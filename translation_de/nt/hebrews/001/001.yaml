  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: de
  text: Vor langer Zeit sprach Gott in vielen einzelnen Teilen[a] und auf vielerlei Weise zu den Vätern[c] durch die Propheten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in vielen Abschnitten«; möglicherweise auch: »viele Male«. Das griechische Wort unterscheidet sich von »auf vielerlei Weise« und betont die Vielteiligkeit der früheren Offenbarung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in den Propheten«; möglich ist auch: »durch Vermittlung der Propheten«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »zu den Vorfahren«; griechisch: »zu den Vätern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: in vielen Teilen
  rationale: Die Wiedergabe bewahrt den Gedanken einer Offenbarung in mehreren Teilen oder Abschnitten und unterscheidet ihn von πολυτρόπως, das die verschiedenen Weisen bezeichnet. Die mögliche zeitliche Nuance wird in einer Fußnote offengehalten.
- source_word: πολυτρόπως
  choice: auf vielerlei Weise
  rationale: Die Formulierung ist natürliches modernes Deutsch und bezeichnet die Vielfalt der Arten und Formen, in denen Gott sprach.
- source_word: πάλαι
  choice: Vor langer Zeit
  rationale: Diese idiomatische Formulierung gibt den zeitlichen Abstand klar wieder, ohne altertümlich zu klingen.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte Wiedergabe des Subjekts; der griechische Artikel erfordert im Deutschen keinen Artikel.
- source_word: λαλήσας
  choice: sprach
  rationale: Das Aoristpartizip gehört syntaktisch zum Hauptverb in Vers 2. Für einen einzeln dargestellten Vers wird es als finite Verbform wiedergegeben, wobei der zeitliche Gegensatz zu Vers 2 erhalten bleibt.
- source_word: τοῖς πατράσιν
  choice: zu den Vätern
  rationale: Die Formulierung bewahrt die konkrete, heilsgeschichtlich geprägte Ausdrucksweise des Griechischen, ohne ein im Ausgangstext nicht vorhandenes »unseren« einzufügen.
- source_word: ἐν τοῖς προφήταις
  choice: durch die Propheten
  rationale: Das griechische ἐν bezeichnet hier wahrscheinlich die Propheten als Mittel oder Vermittler des göttlichen Redens. »Durch« ist im Deutschen klar und idiomatisch; die wörtlichere Möglichkeit wird angemerkt.
theological_decisions:
- issue: Wiedergabe der Partizipialkonstruktion im Zusammenhang mit Hebräer 1,2
  choice: In Vers 1 steht die finite Form »sprach«, während der zeitliche Gegensatz zu Vers 2 gewahrt bleibt.
  alternative: 'Formaler: »Nachdem Gott … gesprochen hatte« oder »Gott, der … gesprochen hat«'
  rationale: Das Partizip λαλήσας wird syntaktisch erst durch das Hauptverb in Vers 2 vervollständigt. Als einzeln wiedergegebener Vers wäre eine rein formale Nachbildung unvollständig oder schwerfällig. Die finite Form fügt keine zusätzliche theologische Deutung hinzu.
- issue: Bedeutung von πολυμερῶς
  choice: »in vielen Teilen« bewahrt die Gliederung oder Teilhaftigkeit der früheren Offenbarung.
  alternative: »viele Male« oder »vielfach«
  rationale: Das Wort kann auf mehrere Teile oder Abschnitte, möglicherweise auch auf wiederholte Gelegenheiten, weisen. Die gewählte Fassung erhält zudem den Unterschied zu »auf vielerlei Weise«, ohne die mögliche Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Formulierung »in vielen Teilen und auf vielerlei Weise« bildet die beiden griechischen Adverbien unterscheidbar ab. »Väter« wahrt die Ausgangsformulierung; »Vorfahren« wird als verständliche Alternative genannt.
