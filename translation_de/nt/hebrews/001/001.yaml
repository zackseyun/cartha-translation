  source_fidelity: Der Entwurf gibt πάλαι, Gott als Subjekt, die Adressaten (τοῖς πατράσιν) und die prophetische Vermittlung (ἐν τοῖς προφήταις) sachgerecht wieder. Auch die Unterscheidung von πολυμερῶς und πολυτρόπως wird grundsätzlich beibehalten. Die finite Wiedergabe von λαλήσας ist für den isolierten Vers vertretbar, obwohl das griechische Partizip syntaktisch mit Vers 2 weiterführt.
  naturalness: „In vielen Teilen sprach Gott“ ist im modernen Deutschen keine ganz natürliche Verbindung und kann nahelegen, Gott selbst sei in Teile gegliedert oder habe nur bruchstückhaft gesprochen. „In vielen einzelnen Teilen“ bezieht die Teilhaftigkeit verständlicher auf das Reden bzw. die Offenbarung und wahrt zugleich den Kontrast zu „auf vielerlei Weise“.
  terminology: „Väter“ ist als quellentreue Wiedergabe von τοῖς πατράσιν angemessen; die alternative Verständnishilfe „Vorfahren“ gehört in die Fußnote. „Durch die Propheten“ ist idiomatisch und gibt den hier naheliegenden instrumentalen Sinn von ἐν wieder. Die Fußnotenanker sind vollständig und korrekt zugeordnet.
