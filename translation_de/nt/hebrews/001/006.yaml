source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: de
  text: 'Wenn er aber den Erstgeborenen wieder in die Welt einführt[a], sagt er: »Alle Engel Gottes sollen ihn anbeten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn er aber den Erstgeborenen in die Welt einführt, sagt er weiter: ›Alle Engel Gottes sollen ihn anbeten.‹« Das griechische Wort für »wieder/weiter« kann sich entweder auf »einführt« oder auf »sagt« beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet einen temporalen Nebensatz ein; hier bezeichnet es am natürlichsten ein bestimmtes Geschehen und nicht ein wiederholtes »wann immer«.
- source_word: δὲ
  choice: aber
  rationale: Markiert einen milden Übergang im Gedankengang; »aber« gibt die leichte Absetzung gegenüber dem Vorhergehenden wieder, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: πάλιν
  choice: wieder
  rationale: Im Haupttext auf »hineinführt« bezogen. Das Adverb kann syntaktisch auch zu »sagt« gehören; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: εἰσαγάγῃ
  choice: hineinführt
  rationale: Gibt die Bewegungsrichtung von εἰς zusammen mit dem Verb anschaulich und idiomatisch wieder und bewahrt gegenüber dem allgemeineren »bringt« den Gedanken des Hineinführens.
- source_word: τὸν πρωτότοκον
  choice: den Erstgeborenen
  rationale: Bewahrt den christologischen Titel und seine Resonanz von Sohnschaft, Vorrang und Rang, ohne ihn erklärend aufzulösen.
- source_word: εἰς τὴν οἰκουμένην
  choice: in die Welt
  rationale: Natürliche deutsche Wiedergabe für die bewohnte Welt beziehungsweise den Weltkreis in diesem Kontext.
- source_word: λέγει
  choice: sagt er
  rationale: Folgt dem knappen griechischen Ausdruck; der aus dem Kontext erschließbare Sprecher wird nicht durch einen erklärenden Zusatz ausdrücklich benannt.
- source_word: προσκυνησάτωσαν
  choice: sollen ... anbeten
  rationale: Gibt den imperativisch-jussiven Aorist in natürlichem Deutsch wieder. Im Kontext der Engel und der Hoheit des Sohnes trifft »anbeten« die Kraft des Verbs besser als ein bloßes Erweisen von Ehrerbietung.
- source_word: αὐτῷ
  choice: ihn
  rationale: Beim deutschen Verb »anbeten« wird das griechische Dativobjekt idiomatisch als Akkusativobjekt wiedergegeben.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: alle Engel Gottes
  rationale: Formnahe und zugleich natürliche Wiedergabe der Genitivverbindung; sie vermeidet eine unnötige Festlegung auf Besitz gegenüber Zugehörigkeit.
theological_decisions:
- issue: Syntaktischer Bezug von πάλιν
  choice: »wieder« modifiziert »hineinführt«
  alternative: '»wieder« modifiziert »sagt«: »Und weiter sagt er, wenn er den Erstgeborenen in die Welt hineinführt ...«'
  rationale: Beide Zuordnungen sind grammatisch möglich. Der Haupttext folgt der naheliegenden Stellung beim Verb εἰσαγάγῃ; die echte und auslegungsrelevante Mehrdeutigkeit bleibt in einer Fußnote sichtbar.
- issue: Bedeutung von προσκυνέω gegenüber dem Sohn
  choice: »anbeten«
  alternative: »sich vor ihm niederwerfen« oder »ihm huldigen«
  rationale: Im Argument von Hebräer 1, das den Sohn über die Engel stellt und alle Engel zu dieser Handlung auffordert, gibt »anbeten« die kontextuelle Kraft des Verbs angemessen wieder, ohne den Satz zusätzlich dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Erstgeborener« bleibt als Titel erhalten, wird im Deutschen jedoch nach den üblichen Regeln großgeschrieben. Die Zitatform mit »sollen« ist klar und feierlich, ohne altertümliches »es sollen«.
