id: HEB.1.10
reference: Hebrews 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: de
  text: 'Und: »Du, Herr, hast am Anfang[a] die Erde gegründet, und die Himmel sind Werke deiner Hände.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu Beginn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Und
  rationale: Leitet in der Zitatreihe ein weiteres Schriftwort ein und bewahrt die einfache verbindende Funktion.
- source_word: Σὺ
  choice: Du
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen Nachdruck und eröffnet die direkte Anrede.
- source_word: κατ’ ἀρχάς
  choice: am Anfang
  rationale: Gibt die zeitliche Bedeutung idiomatisch und im Schöpfungszusammenhang natürlich wieder; die mögliche Nuance „zu Beginn“ wird in der Fußnote genannt.
- source_word: κύριε
  choice: Herr
  rationale: Gibt den Vokativ von κύριος als direkte Anrede wieder, ohne die christologische Aussage des Zusammenhangs abzuschwächen.
- source_word: τὴν γῆν
  choice: die Erde
  rationale: Im Gegensatz zu den Himmeln bezeichnet γῆ hier die Erde als Teil der Schöpfung, nicht ein bestimmtes Land.
- source_word: ἐθεμελίωσας
  choice: gegründet
  rationale: Bewahrt das Fundamentmotiv des Verbs in einer natürlichen und würdigen deutschen Formulierung.
- source_word: ἔργα τῶν χειρῶν σού
  choice: Werke deiner Hände
  rationale: Erhält das konkrete, anthropomorphe Bild des griechischen Textes und des Psalmzitats.
- source_word: οἱ οὐρανοί
  choice: die Himmel
  rationale: Bildet den griechischen Plural ab und entspricht der biblischen Schöpfungssprache.
theological_decisions:
- issue: Anwendung der an den Herrn gerichteten Sprache aus Psalm 102 auf den Sohn in Hebräer 1
  choice: Die direkte Anrede „Du, Herr“ bleibt unverändert erhalten.
  alternative: Eine neutralere Wiedergabe, welche die christologische Kraft des Zitats abschwächt.
  rationale: Der griechische Text enthält κύριε ausdrücklich als Anrede. Die Übersetzung bewahrt diese Aussage, ohne sie über den Wortlaut hinaus dogmatisch auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zitatstruktur, die direkte Anrede und das Bild von den Werken der Hände werden bewahrt. Der Fußnotenmarker steht am Ende des Satzes und bezieht sich auf „am Anfang“.
