id: HEB.1.7
reference: Hebrews 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: de
  text: 'Von den Engeln aber sagt er: »Er macht seine Engel zu Winden[a] und seine Diener zu einer Feuerflamme.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geistern«. Das griechische Wort kann sowohl »Winde« als auch »Geister« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: Von den Engeln aber
  rationale: 'πρός mit λέγει wird hier thematisch verstanden: Das Zitat spricht über die Engel, nicht unmittelbar zu ihnen. μέν eröffnet zugleich den Gegensatz zum Sohn im folgenden Vers.'
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens der Schriftzitationsformel bleibt erhalten.
- source_word: Ὁ ποιῶν
  choice: Er macht
  rationale: Das substantivierte Partizip wird im Deutschen natürlich verbal wiedergegeben und behält den aktiven Sinn.
- source_word: ἀγγέλους
  choice: Engel
  rationale: Der Zusammenhang von Hebräer 1 meint himmlische Engel, nicht allgemein Boten.
- source_word: πνεύματα
  choice: Winde
  rationale: Das Wort kann sowohl »Winde« als auch »Geister« bedeuten. »Winde« passt zum Hintergrund von Psalm 104,4 und zum poetischen Parallelismus mit der Feuerflamme; die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: λειτουργοὺς
  choice: Diener
  rationale: »Diener« bezeichnet hier solche, die Gottes Dienst ausführen, ohne ein späteres kirchliches Amt in den Text einzutragen.
- source_word: πυρὸς φλόγα
  choice: eine Feuerflamme
  rationale: Die Einzahl und das poetische Feuerbild werden knapp und idiomatisch wiedergegeben.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Possessivpronomen bezieht sich im Zitat auf Gott und wird im Deutschen natürlich possessiv wiedergegeben.
theological_decisions:
- issue: Bedeutung von πνεύματα im Zitat aus Psalm 104,4
  choice: Winde
  alternative: Geister
  rationale: »Winde« entspricht wahrscheinlich dem hebräischen Hintergrund und dem parallelen Naturbild »Feuerflamme«. Da das griechische Wort jedoch beide Bedeutungen zulässt, wird »Geister« als sachlich bedeutsame Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Stellung von »Von den Engeln aber« macht den Gegensatz zum Sohn hörbar; die poetische Bildsprache des Zitats bleibt erhalten.
