source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: de
  text: Denn Menschen schwören bei einem Höheren, und für sie ist der Eid zur Bekräftigung das Ende jedes Streits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jedes Widerspruchs«, »jedes Einwands« oder »jeder Auseinandersetzung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: Menschen
  rationale: Der griechische Plural bezeichnet hier Menschen allgemein und ist nicht auf Männer beschränkt.
- source_word: κατὰ τοῦ μείζονος
  choice: bei jemandem, der größer ist als sie
  rationale: κατά mit Genitiv bezeichnet bei einer Eidesformel die angerufene höhere Instanz. Die Formulierung gibt den Vergleich in μείζονος ausdrücklich wieder, ohne eine im Griechischen nicht genannte Person festzulegen.
- source_word: ὀμνύουσιν
  choice: schwören
  rationale: Die einfache Verbform gibt den allgemeinen gegenwärtigen Sachverhalt direkt und idiomatisch wieder.
- source_word: πάσης ... ἀντιλογίας
  choice: jedes Streits
  rationale: ἀντιλογία kann Widerspruch, Einwand oder Auseinandersetzung bezeichnen; im Zusammenhang eines Eides ist »Streit« eine natürliche, sachlich offene Wiedergabe.
- source_word: πέρας
  choice: das Ende
  rationale: Die Übersetzung bewahrt das Bild des Endpunkts, an dem eine strittige Sache abgeschlossen wird.
- source_word: εἰς βεβαίωσιν
  choice: zur Bekräftigung
  rationale: 'Die Wendung bezeichnet Zweck oder Ergebnis: Der Eid bestätigt beziehungsweise bekräftigt die betreffende Aussage oder Verpflichtung.'
- source_word: ὁ ὅρκος
  choice: der Eid
  rationale: Der bestimmte Artikel lässt sich in der allgemeinen Aussage im Deutschen natürlich mit »der Eid« wiedergeben.
theological_decisions:
- issue: Allgemeine Aussage über die Menschheit
  choice: Menschen
  alternative: Männer
  rationale: ἄνθρωποι ist hier generisch gebraucht. »Menschen« bewahrt diesen Umfang und vermeidet eine unbegründete Beschränkung auf männliche Personen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang; »zur Bekräftigung« bewahrt die Zweck- beziehungsweise Ergebnisnuance, ohne sie weiter auszudeuten.
