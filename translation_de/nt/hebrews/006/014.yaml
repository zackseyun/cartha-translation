translation:
  language: de
  text: 'indem er sagte: »Ganz gewiss werde ich dich segnen und ganz gewiss werde ich dich zahlreich machen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Segnend werde ich dich segnen, und mehrend werde ich dich mehren« – eine nachdrückliche Ausdrucksweise in Anlehnung an 1. Mose 22,17.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: indem er sagte
  rationale: Das Partizip führt den Wortlaut des göttlichen Eides ein und schließt syntaktisch an den vorhergehenden Vers an; die finite deutsche Wendung gibt diesen Zusammenhang natürlich wieder.
- source_word: Εἰ μὴν
  choice: Ganz gewiss
  rationale: Die feste Schwurformel ist hier nicht konditional zu verstehen, sondern als nachdrückliche Bekräftigung.
- source_word: εὐλογῶν εὐλογήσω
  choice: werde ich dich segnen
  rationale: Die idiomatische Zukunftsform bewahrt die Verheißung; die besondere emphatische Doppelung des Griechischen wird durch »ganz gewiss« und die Fußnote kenntlich gemacht.
- source_word: σε
  choice: dich
  rationale: Das Pronomen steht im Singular und bezeichnet Abraham als Empfänger der Verheißung.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden parallelen Zusagen.
- source_word: πληθύνων πληθυνῶ σε
  choice: werde ich dich zahlreich machen
  rationale: Die Wendung gibt die Vermehrung Abrahams beziehungsweise seiner Nachkommenschaft wieder, ohne das im griechischen Text nicht ausdrücklich genannte Wort »Nachkommen« in den Haupttext einzufügen.
theological_decisions:
- issue: Wiedergabe der emphatischen Schwurformel aus der Verheißung an Abraham
  choice: Die Bekräftigung wird in beiden parallelen Satzteilen mit »ganz gewiss« ausgedrückt; die griechische Doppelung wird in einer Fußnote dokumentiert.
  alternative: 'Wörtlicher: »Segnend werde ich dich segnen, und mehrend werde ich dich mehren.«'
  rationale: So bleiben die Feierlichkeit des Eides, die parallele Betonung beider Zusagen und der Anklang an 1. Mose 22,17 erhalten, ohne unnatürliches Deutsch zu erzeugen.
- issue: Gegenstand der Vermehrung
  choice: »dich zahlreich machen« ohne ausdrückliche Ergänzung von »deine Nachkommen«
  alternative: »deine Nachkommen überaus zahlreich machen«
  rationale: Im Zusammenhang ist Abrahams Nachkommenschaft gemeint, doch der griechische Wortlaut nennt nur das Singularpronomen »dich«. Die gewählte Fassung wahrt diese Ausdrucksweise und vermeidet eine stillschweigende Explikation.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ganz gewiss« trägt den feierlichen Schwurcharakter, während »zahlreich machen« verständlicher und natürlicher ist als das heute missverständliche »dich mehren«.
