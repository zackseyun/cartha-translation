source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: de
  text: damit wir, die wir Zuflucht gesucht haben, um die vor uns liegende Hoffnung zu ergreifen, durch zwei unveränderliche Gegebenheiten, bei denen es unmöglich ist, dass Gott lügt, starken Zuspruch haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um an der vor uns liegenden Hoffnung festzuhalten“. Das griechische Verb kann „ergreifen“, „festhalten“ oder „sich fest an etwas halten“ bedeuten. Das Bild vom Zufluchtnehmen kann an die alttestamentlichen Zufluchtsstädte erinnern, doch diese Anspielung ist nicht ausdrücklich genannt.'
    reason: lexical_alternative_and_possible_cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den beabsichtigten Zweck beziehungsweise das Ergebnis des vorausgehenden Handelns Gottes ein.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: durch zwei unabänderliche Tatsachen
  rationale: πράγματα ist weit gefasst, bezeichnet hier aber rückbezüglich Gottes Verheißung und Eid; „Tatsachen“ ist im Deutschen natürlicher als „Dinge“. ἀμετάθετος bezeichnet etwas, das nicht geändert werden kann.
- source_word: ἐν οἷς
  choice: bei denen
  rationale: Bewahrt den Bezug auf die beiden vorausgehenden Tatsachen und klingt im Deutschen natürlicher als „in denen“.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: es ist unmöglich, dass Gott lügt
  rationale: Gibt die unpersönliche Konstruktion mit ἀδύνατον wieder und wahrt deren feierlichen Nachdruck.
- source_word: ἰσχυρὰν παράκλησιν
  choice: eine starke Ermutigung
  rationale: παράκλησις kann Ermutigung, Trost oder Zuspruch bedeuten; im Zusammenhang der durch Verheißung und Eid gestärkten Zuversicht trifft „Ermutigung“ den Sinn, ohne ihn einzuengen.
- source_word: ἔχωμεν
  choice: haben
  rationale: Der deutsche Zwecksatz mit „damit“ gibt den griechischen Konjunktiv idiomatisch wieder; ein zusätzlicher Konjunktiv ist nicht nötig.
- source_word: οἱ καταφυγόντες
  choice: wir, die wir Zuflucht genommen haben
  rationale: Bewahrt das konkrete Bild der Flucht an einen sicheren Ort, ohne eine bestimmte alttestamentliche Anspielung als sicher festzulegen.
- source_word: κρατῆσαι
  choice: zu ergreifen
  rationale: κρατέω kann ergreifen, festhalten oder sich fest an etwas halten bedeuten. „Ergreifen“ wahrt hier die aktive und bildhafte Bewegung zur angebotenen Hoffnung; die alternative Nuance wird in der Fußnote genannt.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: die vor uns liegende Hoffnung
  rationale: 'Gibt πρόκειμαι anschaulich und natürlich wieder: Die Hoffnung liegt als Ziel und Angebot vor den Zuflucht Suchenden.'
theological_decisions:
- issue: Bildsprache von Zuflucht und Hoffnung
  choice: Die konkrete Zufluchtsmetapher und das aktive Ergreifen der Hoffnung bleiben erhalten.
  alternative: „wir, die wir bei ihm Zuflucht gesucht haben, um an der uns angebotenen Hoffnung festzuhalten“
  rationale: Der griechische Text verbindet das Bild der Flucht an einen sicheren Ort mit dem Ergreifen beziehungsweise Festhalten der Hoffnung. Die Übersetzung glättet diese Spannung nicht zu einer rein abstrakten Aussage über Gewissheit.
- issue: Gottes Wahrhaftigkeit
  choice: „es ist unmöglich, dass Gott lügt“
  alternative: „Gott kann nicht lügen“
  rationale: Die gewählte Form bewahrt die ausdrückliche Unmöglichkeitsaussage des griechischen Textes, ohne sie zu einer weitergehenden systematisch-theologischen Formulierung auszubauen.
- issue: Referenz der zwei unabänderlichen Tatsachen
  choice: Keine erklärende Ergänzung im Haupttext
  alternative: „durch seine unabänderliche Verheißung und seinen Eid“
  rationale: Aus dem Kontext sind wahrscheinlich Verheißung und Eid gemeint, doch der Vers selbst spricht allgemein von „zwei“ πράγματα. Die Übersetzung lässt den Rückbezug bestehen, statt die Auslegung in den Text einzubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenfluss bleibt trotz des langen griechischen Satzbaus verständlich; der Gedankenstrich hebt die nachgestellte Bezeichnung der Zufluchtnehmenden hervor. Keine konfessionell geprägte Terminologie.
