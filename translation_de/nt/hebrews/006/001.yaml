id: HEB.6.1
reference: Hebrews 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: de
  text: 'Darum wollen wir die grundlegende Lehre über den Messias hinter uns lassen[a] und uns zur Reife[b] weiterführen lassen[c], ohne noch einmal ein Fundament zu legen: die Umkehr von toten Werken und den Glauben an Gott[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „die Lehre vom Anfang des Messias“; möglich ist ebenso: „die elementare Botschaft über den Messias“. Gemeint ist im Zusammenhang ein Fortschreiten über die Anfangsgründe hinaus, nicht deren Verwerfung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Vollkommenheit“ beziehungsweise „zur Vollendung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder freier: „zur Reife voranschreiten“. Das griechische Verb steht im Passiv: „weitergetragen werden“ oder „weitergeführt werden“.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „Glauben auf Gott hin“; sinngemäß auch: „Vertrauen auf Gott“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Leitet als folgernde Konjunktion die aus dem vorausgehenden Abschnitt abgeleitete Aufforderung ein.
- source_word: ἀφέντες
  choice: hinter uns lassen
  rationale: Gibt das Aoristpartizip natürlich wieder und bezeichnet hier das Fortschreiten über den bisherigen Unterricht hinaus, nicht dessen Verwerfung.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: die grundlegende Lehre über den Messias
  rationale: λόγος bezeichnet hier die Lehre oder Botschaft; τῆς ἀρχῆς weist im Zusammenhang auf den anfänglichen, grundlegenden Unterricht hin. Die schwierige Genitivverbindung bleibt in der Fußnote als Alternative sichtbar.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Χριστός wird hier als Titel verstanden; „Messias“ macht diesen Titelcharakter im Deutschen deutlich.
- source_word: ἐπὶ τὴν τελειότητα
  choice: zur Reife
  rationale: Im Gegensatz zu den Grundlagen bezeichnet τελειότης hier volle Entwicklung beziehungsweise Reife; „Vollkommenheit“ bleibt als mögliche wörtlichere Wiedergabe in der Fußnote erhalten.
- source_word: φερώμεθα
  choice: uns … weiterführen lassen
  rationale: Bewahrt die passive Form des griechischen Verbs und klingt zugleich natürlich im modernen Deutschen.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: ein Fundament zu legen
  rationale: Erhält das Bild des Bauens und entspricht einer geläufigen deutschen Wendung.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: die Umkehr von toten Werken
  rationale: „Umkehr“ gibt μετάνοια im religiös-ethischen Sinn verständlich wieder; „tote Werke“ bewahrt die knappe und deutungsoffene Metapher.
- source_word: πίστεως ἐπὶ θεόν
  choice: den Glauben an Gott
  rationale: Ist die natürliche deutsche Wiedergabe; die gerichtete Nuance von ἐπί mit Akkusativ wird als Alternative in der Fußnote vermerkt.
theological_decisions:
- issue: Bedeutet das Verlassen der grundlegenden Lehre eine Abkehr von der Botschaft über den Messias?
  choice: Es bezeichnet das Fortschreiten über den grundlegenden Unterricht hinaus, ohne ihn zu verwerfen.
  alternative: Die Botschaft über den Messias vollständig aufgeben.
  rationale: Die anschließende Mahnung, das Fundament nicht erneut zu legen, setzt dessen bleibende Geltung voraus und fordert zugleich zum Weitergehen auf.
- issue: Bedeutung von τελειότης
  choice: Reife
  alternative: Vollkommenheit oder Vollendung
  rationale: Der Gegensatz zu den Anfangsgründen legt geistliche Reife oder volle Entwicklung nahe; die Übersetzung soll nicht ungekennzeichnet absolute Sündlosigkeit eintragen.
- issue: Passivische Form von φερώμεθα
  choice: uns weiterführen lassen
  alternative: weitergehen
  rationale: Die passive Gestalt des griechischen Ausdrucks bleibt erhalten, ohne ausdrücklich festzulegen, wer oder was die Weiterführung bewirkt.
- issue: Deutung von νεκρὰ ἔργα
  choice: tote Werke
  alternative: Werke, die zum Tod führen, oder wirkungslose Werke
  rationale: Die wörtlich-metaphorische Wiedergabe bewahrt die inhaltliche Offenheit des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt der griechischen Argumentation nahe, wird aber durch Infinitivgruppen und den Doppelpunkt übersichtlich. Fachsprachlich-konfessionelle Zusätze werden vermieden; echte lexikalische und theologische Mehrdeutigkeiten erscheinen in den Fußnoten.
