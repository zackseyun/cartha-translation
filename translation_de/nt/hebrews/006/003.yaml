  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: de
  text: Und das werden wir tun, wenn Gott es denn erlaubt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wenn Gott es zulässt“. Das griechische Partikel verstärkt die Bedingung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Natürliche Satzverknüpfung mit der vorausgehenden Aufforderung.
- source_word: τοῦτο
  choice: das
  rationale: Das substantivisch gebrauchte Demonstrativpronomen im Neutrum Singular verweist auf das zuvor genannte Vorhaben.
- source_word: ποιήσομεν
  choice: werden wir tun
  rationale: Gibt den Futur Indikativ von ποιέω formal nah und im Deutschen verständlich wieder.
- source_word: ἐάνπερ
  choice: wenn … tatsächlich
  rationale: Bewahrt sowohl die Bedingung als auch die durch περ hinzugefügte Hervorhebung, ohne die Unsicherheit zu überzeichnen.
- source_word: ἐπιτρέπῃ
  choice: erlaubt
  rationale: Trifft die Bedeutung des Präsens Konjunktiv von ἐπιτρέπω nach ἐάνπερ in natürlichem modernem Deutsch.
- source_word: ὁ θεός
  choice: Gott
  rationale: Idiomatiche Wiedergabe des artikulierten griechischen Subjekts.
theological_decisions:
- issue: Bedingung der göttlichen Erlaubnis
  choice: Die erklärte Absicht wird ausdrücklich davon abhängig gemacht, dass Gott es erlaubt.
  alternative: Die idiomatische Abschwächung „so Gott will“ oder eine deterministische Ausdeutung.
  rationale: Die Formulierung erhält die reale Bedingung und damit die Spannung zwischen menschlichem Vorhaben und göttlicher Erlaubnis, ohne sie lehrmäßig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das werden wir tun“ bleibt nahe am knappen griechischen Wortlaut; „tatsächlich“ macht die emphatische Bedingung für heutige Leser erkennbar.
