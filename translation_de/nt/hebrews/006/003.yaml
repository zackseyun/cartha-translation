revisions:
- from: Und das werden wir tun, wenn Gott es tatsächlich erlaubt.[a]
  to: Und das werden wir tun, wenn Gott es denn erlaubt.[a]
  rationale: Die Revision ersetzt die leicht unidiomatische und akzentverschiebende Wendung „tatsächlich erlaubt“ durch „denn erlaubt“. Damit bleibt die durch ἐάνπερ hervorgehobene reale Bedingung erhalten; die Aussage über menschliches Vorhaben und Gottes Erlaubnis wird weder abgeschwächt noch dogmatisch gedeutet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:44:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die einzelnen griechischen Ausdrücke insgesamt zutreffend wieder: καὶ τοῦτο ποιήσομεν ist „Und das werden wir tun“, und die Absicht bleibt von Gottes Erlaubnis abhängig. Die Stellung von „tatsächlich“ verschiebt die Hervorhebung jedoch leicht auf die tatsächliche Tatsache von Gottes Erlauben, statt die mit ἐάνπερ betonte Bedingung idiomatisch zu kennzeichnen.'
  naturalness: „Wenn Gott es tatsächlich erlaubt“ ist verständlich, klingt im modernen Standarddeutsch aber etwas schwerfällig und semantisch weniger präzise. „Wenn Gott es denn erlaubt“ ist eine natürliche, würdige Wiedergabe der nachdrücklichen Bedingung.
  terminology: „Gott“ und „erlaubt“ sind passend. Die Formulierung wahrt den Wortlaut, ohne die Bedingung zu der bloßen Redensart „so Gott will“ abzuschwächen oder theologisch auszuweiten.
  issues:
  - severity: low
    issue: Stellung und Wirkung von „tatsächlich“ bei ἐάνπερ
    rationale: Das Partikel περ verstärkt die Bedingung als solche. Im Deutschen legt „wenn Gott es tatsächlich erlaubt“ eher nahe, dass fraglich sei, ob Gott es faktisch erlaubt. Das enklitische „denn“ bildet den bedingungsbetonenden Ton hier idiomatischer nach.
  revised_text: Und das werden wir tun, wenn Gott es denn erlaubt.[a]
  revised_footnotes:
