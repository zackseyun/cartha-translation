source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: de
  text: Wir wünschen aber, dass jeder von euch denselben Eifer für die volle Gewissheit der Hoffnung[a] bis zum Ende[b] zeigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „volle Zuversicht der Hoffnung“ oder „volle Gewissheit im Blick auf die Hoffnung“. Das Griechische kann die volle Gewissheit bzw. Zuversicht bezeichnen, die mit der Hoffnung verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis ans Ende“. Die Wendung betont das beharrliche Durchhalten bis zur Vollendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: wir wünschen
  rationale: Das Verb bezeichnet ein ernsthaftes Verlangen. „Wir wünschen“ gibt hier die nachdrückliche, aber fürsorgliche Ermahnung natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen milden Übergang von der vorausgehenden Anerkennung zur erneuten Ermahnung; „aber“ macht diese leichte Gegenbewegung sichtbar, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: ἕκαστον ὑμῶν
  choice: jeder von euch
  rationale: 'Die Formulierung bewahrt den distributiven Nachdruck: Die Aufforderung gilt jedem Einzelnen in der Gemeinschaft.'
- source_word: τὴν αὐτὴν ... σπουδὴν
  choice: denselben Eifer
  rationale: σπουδή kann Eifer, Ernsthaftigkeit oder Sorgfalt bezeichnen. „Derselbe Eifer“ ist idiomatisch und verweist klar auf den bereits gezeigten Einsatz in Vers 10.
- source_word: ἐνδείκνυσθαι
  choice: zeigt
  rationale: Das Medium bezeichnet das sichtbare Erweisen oder Zeigen einer Haltung. „Zeigt“ ist klar, gegenwärtig und quellennah.
- source_word: πρὸς τὴν πληροφορίαν τῆς ἐλπίδος
  choice: damit eure Hoffnung ... volle Gewissheit erlangt
  rationale: πρός bezeichnet hier Ziel oder Ergebnis. Die deutsche Satzform macht die Zielrichtung verständlich und lässt πληροφορία sowohl als volle Gewissheit als auch als zur Fülle gelangende Zuversicht hörbar werden.
- source_word: ἄχρι τέλους
  choice: bis zum Ende
  rationale: Die Wendung bezeichnet das Fortdauern bis zum abschließenden Ziel und betont Beharrlichkeit.
theological_decisions:
- issue: Bedeutung der „vollen Gewissheit der Hoffnung“ im Verhältnis zum Ausharren
  choice: Die Hoffnung soll bis zum Ende volle Gewissheit erlangen.
  alternative: Jeder soll bis zum Ende Eifer im Blick auf die volle Gewissheit der Hoffnung zeigen.
  rationale: Der griechische Genitiv lässt eine enge Verbindung von Gewissheit und Hoffnung erkennen, ohne eindeutig festzulegen, ob vor allem die subjektive innere Gewissheit oder die volle, auf Gottes Verheißung gerichtete Zuversicht gemeint ist. Die Übersetzung legt kein späteres Lehrsystem zugrunde und bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz ist für heutige Leser verständlich, bewahrt aber den ernsten pastoralen Ton und die theologische Offenheit des griechischen Ausdrucks.
