id: HEB.6.17
reference: Hebrews 6:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: de
  text: Darum wollte Gott den Erben der Verheißung umso deutlicher zeigen, dass sein Beschluss unabänderlich ist, und verbürgte sich dafür mit einem Eid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „trat mit einem Eid als Bürge dafür ein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Darum
  rationale: Die Wendung knüpft folgernd an Gottes Eid gegenüber Abraham im vorherigen Zusammenhang an. „Darum“ gibt diese Verbindung im Deutschen klarer wieder als ein wörtliches „worin“.
- source_word: περισσότερον
  choice: umso deutlicher
  rationale: Der Komparativ verstärkt zusammen mit ἐπιδεῖξαι die Absicht, etwas besonders deutlich vor Augen zu führen.
- source_word: βουλόμενος
  choice: wollte
  rationale: Das Partizip bezeichnet Gottes bewusste, zielgerichtete Absicht, nicht einen bloßen Wunsch.
- source_word: ἐπιδεῖξαι
  choice: zeigen
  rationale: „Zeigen“ ist gegenwärtiges, allgemein verständliches Deutsch; die verstärkende Bedeutung kommt bereits durch „umso deutlicher“ zum Ausdruck.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: den Erben der Verheißung
  rationale: Die Formulierung bewahrt das Erbmotiv und lässt „die Verheißung“ wie im Griechischen ohne erklärenden Zusatz stehen.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: dass sein Beschluss unabänderlich ist
  rationale: Die substantivierte Eigenschaft wird als natürlicher deutscher dass-Satz ausgedrückt. „Beschluss“ bezeichnet Gottes festes Vorhaben, ohne eine spätere metaphysische Fachsprache einzutragen.
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: verbürgte sich dafür mit einem Eid
  rationale: Das seltene Verb bezeichnet hier ein vermittelndes beziehungsweise bürgendes Eintreten. „Sich verbürgen“ vermittelt die bekräftigende Funktion des Eides und bleibt im Deutschen verständlich.
theological_decisions:
- issue: Die Unabänderlichkeit von Gottes βουλή
  choice: dass sein Beschluss unabänderlich ist
  alternative: die Unabänderlichkeit seines Ratschlusses
  rationale: Der Text betont ausdrücklich, dass Gottes beschlossener Wille nicht geändert werden kann. Die gewählte Formulierung wahrt diese Aussage, ohne sie durch metaphysische Kategorien auszuweiten.
- issue: Die Bedeutung von ἐμεσίτευσεν beim göttlichen Eid
  choice: verbürgte sich dafür mit einem Eid
  alternative: trat mit einem Eid dafür ein
  rationale: Die Übersetzung bringt die Funktion des Eides als zusätzliche Gewähr zum Ausdruck. Die Fußnote hält die ungewöhnliche Mittler- beziehungsweise Bürgschaftsmetaphorik des griechischen Verbs sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt eng am Gedankengang des griechischen Textes, löst jedoch die abstrakte Nominalfügung in einen gut verständlichen dass-Satz auf. Die seltene Bildsprache von ἐμεσίτευσεν wird in der Fußnote kenntlich gemacht.
