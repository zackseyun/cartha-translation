id: HEB.6.9
reference: Hebrews 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: de
  text: Doch was euch betrifft, Geliebte, sind wir von Besserem überzeugt – von Dingen, die zur Rettung gehören[a] –, auch wenn wir so reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die mit der Rettung einhergehen.'
    reason: Lexikalisch mögliche Wiedergabe von ἐχόμενα σωτηρίας, welche die begleitende Beziehung stärker hervorhebt.
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: sind wir … überzeugt
  rationale: Das Perfekt bezeichnet einen gefestigten Zustand der Überzeugung; die deutsche Formulierung ist natürlich und bewahrt diese Sicherheit.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zwischen der ernsten Warnung zuvor und der nun ausgesprochenen Zuversicht.
- source_word: περὶ ὑμῶν
  choice: was euch betrifft
  rationale: Gibt περί mit Genitiv klar und in natürlichem modernem Deutsch wieder.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Bewahrt als Anrede sowohl die Zuneigung als auch den würdevollen Ton des griechischen Ausdrucks.
- source_word: τὰ κρείσσονα
  choice: Besserem
  rationale: Die substantivierte Steigerungsform erhält die vergleichende Aussage, ohne im Deutschen unnötig konkrete Dinge zu unterstellen.
- source_word: καὶ ἐχόμενα σωτηρίας
  choice: von Dingen, die zur Rettung gehören
  rationale: Der Gedankenstrich gibt καί hier als erläuternde Weiterführung wieder. Die Formulierung wahrt die allgemeine Beziehung zur Rettung, ohne sie vorschnell als Ursache, Wirkung oder Beweis festzulegen.
- source_word: εἰ καὶ
  choice: auch wenn
  rationale: Gibt den konzessiven Sinn der Wendung idiomatisch wieder.
- source_word: οὕτως
  choice: so
  rationale: Verweist knapp und natürlich auf die Art und den Inhalt der vorausgehenden ernsten Rede.
- source_word: λαλοῦμεν
  choice: wir … reden
  rationale: Eine direkte, gegenwartsbezogene Wiedergabe des Präsens, die im Deutschen in diesem Zusammenhang natürlich klingt.
theological_decisions:
- issue: Beziehung von ἐχόμενα zu σωτηρίας im Zusammenhang der Warnung
  choice: Dinge, die zur Rettung gehören
  alternative: Dinge, die mit der Rettung einhergehen
  rationale: Der Text verbindet die erwarteten besseren Dinge eng mit der Rettung, legt aber nicht fest, ob sie deren Begleiterscheinungen, Beweise oder Folgen sind. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Geliebte“ bewahrt die warme Anrede; „Rettung“ gibt σωτηρία unmittelbar und allgemeinverständlich wieder. Die Gedankenstriche kennzeichnen die erläuternde Zuordnung, ohne die syntaktische Offenheit stärker als nötig festzulegen.
