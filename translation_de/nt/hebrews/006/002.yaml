  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: de
  text: Unterweisung über Waschungen[a], über das Auflegen der Hände, über die Auferstehung der Toten und über das ewige Gericht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Taufen“. Der griechische Plural kann allgemein rituelle Waschungen bezeichnen und muss sich nicht speziell auf die christliche Taufe beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: Waschungen
  rationale: Der griechische Plural kann verschiedene rituelle Waschungen bezeichnen und muss nicht speziell auf die christliche Taufe beschränkt sein. „Waschungen“ bewahrt sowohl den Plural als auch die größere Bedeutungsbreite.
- source_word: διδαχὴν
  choice: Unterweisung
  rationale: Das Wort bezeichnet hier einen Lehrgegenstand innerhalb der fortlaufenden Aufzählung. „Unterweisung“ ist verständlich, würdig und lässt sich natürlich mit „über“ und den folgenden Sachgebieten verbinden.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: das Auflegen der Hände
  rationale: Dies ist die natürliche deutsche Bezeichnung der genannten Handlung und gibt die Genitivverbindung sachlich wieder.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: die Auferstehung der Toten
  rationale: Die geläufige deutsche Wendung bewahrt den kollektiven Sinn von νεκρῶν.
- source_word: κρίματος αἰωνίου
  choice: das ewige Gericht
  rationale: „Gericht“ gibt κρίμα wieder, ohne es auf Verurteilung einzuengen; „ewig“ entspricht αἰώνιος in diesem eschatologischen Zusammenhang.
- source_word: τε ... τε καὶ
  choice: Aufzählung mit Kommas und „und“
  rationale: Die griechischen Verknüpfungspartikel gliedern die Reihe; im natürlichen Deutschen wird ihre koordinierende Funktion durch eine gewöhnliche Aufzählung ausgedrückt.
theological_decisions:
- issue: Bedeutung von βαπτισμῶν in der Aufzählung grundlegender Lehren
  choice: „Waschungen“ im Haupttext
  alternative: „Taufen“
  rationale: Plural und Sprachgebrauch lassen allgemeinere rituelle Waschungen wahrscheinlich erscheinen. Die Fußnote bewahrt die mögliche Deutung als „Taufen“, ohne den Haupttext konfessionell zu verengen.
- issue: Reichweite von κρίματος αἰωνίου
  choice: „ewiges Gericht“
  alternative: „ewige Verurteilung“
  rationale: Der griechische Text spricht von Gericht, nicht ausdrücklich nur von Verurteilung. Die Übersetzung wahrt diese inhaltliche Offenheit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die wiederholte Präposition „über“ macht die syntaktische Zuordnung der gesamten Aufzählung zu „Unterweisung“ klar und flüssig.
