id: HEB.6.20
reference: Hebrews 6:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: de
  text: Dorthin ist Jesus als Vorläufer für uns[a] hineingegangen. Er ist für immer Hoher Priester nach der Ordnung Melchisedeks[b] geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zu unseren Gunsten“. Die griechische Wendung kann eine Handlung zum Nutzen anderer oder in ihrer Vertretung bezeichnen; hier betont sie, dass Jesus zu unserem Nutzen und als unser Vertreter einging.'
    reason: lexical_alternative
  - marker: b
    text: 'Vergleiche Psalm 110,4. Auch möglich: „gemäß der Ordnung Melchisedeks“.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: Dorthin
  rationale: Der Ausdruck verweist auf den inneren Bereich hinter dem Vorhang aus dem vorherigen Vers. In Verbindung mit einem Verb der Bewegung gibt „dorthin“ den örtlichen Bezug im modernen Deutschen natürlich wieder.
- source_word: πρόδρομος
  choice: Vorläufer
  rationale: „Vorläufer“ bewahrt das Bild von jemandem, der anderen vorausgeht und ihnen damit den Weg eröffnet.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Die knappe deutsche Wendung lässt sowohl den Gedanken des Nutzens als auch den der Stellvertretung zu, ohne die Aussage auf „an unserer Stelle“ zu verengen.
- source_word: εἰσῆλθεν
  choice: ist … hineingegangen
  rationale: Das Perfekt bezeichnet im Deutschen ein vollzogenes Eintreten mit bleibender Bedeutung; „hineingegangen“ passt zur Bewegung in den zuvor genannten inneren Bereich.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Die im Deutschen übliche Namensform.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: nach der Ordnung Melchisedeks
  rationale: Die traditionelle, dennoch verständliche Wendung bewahrt den Bezug auf Psalm 110,4 und bezeichnet eine entsprechende priesterliche Ordnung oder Zuordnung.
- source_word: ἀρχιερεὺς
  choice: Hoher Priester
  rationale: Dies ist die etablierte deutsche Bezeichnung für das kultische Amt, das für die Argumentation des Hebräerbriefs zentral ist.
- source_word: γενόμενος
  choice: ist … geworden
  rationale: Die Wiedergabe bewahrt den verbalen Gehalt des Partizips und beschreibt Jesu Übernahme beziehungsweise Erlangung des priesterlichen Amtes, ohne eine Aussage über den Ursprung seines Wesens zu machen.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: „Für immer“ gibt die dauerhafte Geltung idiomatisch und klar wieder.
theological_decisions:
- issue: Bedeutung von γενόμενος für die Christologie
  choice: „ist … Hoher Priester … geworden“ als Aussage über Jesu priesterliches Amt
  alternative: „wurde zum Hohen Priester eingesetzt“
  rationale: Die Übersetzung erhält das im Griechischen ausgedrückte Werden, deutet es im Zusammenhang jedoch nicht ausdrücklich als Veränderung seines Wesens. „Eingesetzt“ wäre erklärender, steht aber nicht ausdrücklich im Verb.
- issue: Bedeutung von ὑπὲρ ἡμῶν
  choice: „für uns“ mit offener repräsentativer und begünstigender Bedeutung
  alternative: „an unserer Stelle“ oder „zu unseren Gunsten“
  rationale: Der Zusammenhang betont, dass Jesus den Glaubenden voraus in das himmlische Heiligtum eingegangen ist. „Für uns“ bewahrt die mögliche Stellvertretungs- und Nutzenaussage, ohne sie auf eine engere Sühneformel festzulegen.
- issue: Verhältnis des Partizips γενόμενος zum Hauptereignis
  choice: In einem zweiten Satz wiedergegeben, ohne eine genaue zeitliche Abfolge festzulegen
  alternative: „nachdem er … geworden war“
  rationale: Das Aoristpartizip kann Vorzeitigkeit nahelegen, doch eine ausdrückliche Übersetzung mit „nachdem“ würde die zeitliche Beziehung stärker bestimmen, als es für eine natürliche und theologisch offene Wiedergabe nötig ist.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze verhindert eine schwerfällige Partizipialkonstruktion und bewahrt, soweit möglich, die offene zeitliche Beziehung des griechischen Satzes. „Hoher Priester“ wird als Amtsbezeichnung großgeschrieben.
