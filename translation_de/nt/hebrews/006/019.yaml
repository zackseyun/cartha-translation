id: HEB.6.19
reference: Hebrews 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: de
  text: Diese Hoffnung haben wir als einen Anker der Seele, der sicher und fest ist und bis in das Innere hinter dem Vorhang[a] hineinreicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Innere innerhalb des Vorhangs“; wörtlich: „in das Innere des Vorhangs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Diese Hoffnung
  rationale: Das feminine Relativpronomen verweist auf die im vorherigen Vers genannte Hoffnung. Die ausdrückliche Wiederaufnahme schafft im Deutschen einen natürlichen, verständlichen Satzanschluss.
- source_word: ὡς ἄγκυραν
  choice: als einen Anker
  rationale: ὡς führt hier den bildhaften Vergleich ein; „als einen Anker“ bewahrt die Metapher knapp und idiomatisch.
- source_word: ἔχομεν
  choice: haben wir
  rationale: Die schlichte Präsensform gibt das griechische Verb unmittelbar und natürlich wieder.
- source_word: τῆς ψυχῆς
  choice: der Seele
  rationale: Der Genitiv wird formal bewahrt. „Seele“ erhält die offene Bedeutungsweite von ψυχή, ohne sie auf Gefühle oder Psyche zu verengen.
- source_word: ἀσφαλῆ τε καὶ βεβαίαν
  choice: der sicher und fest ist
  rationale: „Sicher“ und „fest“ geben die beiden verwandten, aber unterscheidbaren Eigenschaften wieder. Ein Relativsatz ist im Deutschen natürlicher als eine unverbundene Adjektivfolge.
- source_word: εἰσερχομένην
  choice: hineinreicht
  rationale: Das Partizip beschreibt weiterhin den Anker. „Hineinreicht“ ist im Deutschen für das metaphorische Bild idiomatischer als „hineingeht“, ohne den räumlichen Vorgang aufzulösen.
- source_word: εἰς τὸ ἐσώτερον
  choice: bis in das Innere
  rationale: Die substantivierte Komparativform bezeichnet den inneren Bereich. „Das Innere“ lässt dessen genaue Bestimmung bewusst dem folgenden Kontext.
- source_word: τοῦ καταπετάσματος
  choice: hinter dem Vorhang
  rationale: Der Genitiv bezeichnet im Heiligtumsbild den Raum auf der inneren Seite des trennenden Vorhangs. „Vorhang“ ist modernes Deutsch und bewahrt die kultische Bildwelt.
theological_decisions:
- issue: Kultische Bildsprache des himmlischen Heiligtums
  choice: „in das Innere hinter dem Vorhang“
  alternative: „in das Innere innerhalb des Vorhangs“ oder „hinter den Vorhang“
  rationale: Die Formulierung macht die räumliche Beziehung verständlich, ohne das Innere ausdrücklich mit dem Allerheiligsten gleichzusetzen. So bleibt die weitere Entfaltung des Heiligtumsbildes dem Kontext vorbehalten.
- issue: Bezug des Relativpronomens ἣν
  choice: Explizite Wiederaufnahme als „Diese Hoffnung“
  alternative: „Sie haben wir“ oder ein Anschluss mit „die“
  rationale: Der Rückbezug auf die Hoffnung aus Vers 18 ist grammatisch klar. Die explizite Nennung vermeidet im isolierten Vers einen unklaren Pronomenbezug, ohne eine zusätzliche theologische Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt die Anker- und Heiligtumsmetaphorik, vermeidet altertümliches „Schleier“ und löst die genaue Identität des inneren Ortes nicht vorzeitig auf.
