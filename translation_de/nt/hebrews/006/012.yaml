  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Elemente des griechischen Textes zuverlässig wieder: der an den vorherigen Vers anschließende Zwecksatz (ἵνα μή), die Warnung vor einem erst eintretenden Zustand der Trägheit (νωθροὶ γένησθε), der Kontrast mit μιμηταί sowie Glauben, Geduld und den bestimmten Plural „die Verheißungen“. „Denen nacheifert“ ist eine idiomatische und sinngetreue verbale Wiedergabe von „Nachahmer derer [zu sein]“ und wahrt den Bezug auf die Menschen, die die Verheißungen erben.'
