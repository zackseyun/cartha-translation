id: HEB.6.12
reference: Hebrews 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: de
  text: damit ihr nicht träge werdet, sondern denen nacheifert, die durch Glauben[a] und Geduld die Verheißungen erben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Treue und Geduld“. Das griechische Wort kann je nach Zusammenhang auch „Treue“ oder „Vertrauen“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: träge
  rationale: Das Wort bezeichnet mangelnde Bereitschaft oder Schwerfälligkeit im Handeln. „Träge“ passt zum Aufruf zu Eifer im unmittelbaren Zusammenhang und klingt weder altertümlich noch unnötig verurteilend.
- source_word: γένησθε
  choice: werdet
  rationale: Die Form von γίνομαι warnt hier davor, in einen Zustand der Trägheit zu geraten; deshalb wird der ingressive Sinn mit „werdet“ bewahrt.
- source_word: μιμηταὶ
  choice: denen nacheifert
  rationale: Das Substantiv bezeichnet Menschen, die andere nachahmen. Die verbale Wendung „denen nacheifert“ gibt den Aufruf in natürlichem modernem Deutsch wieder, ohne ihn auf bloßes Folgen abzuschwächen.
- source_word: διὰ πίστεως
  choice: durch Glauben
  rationale: „Glauben“ bewahrt den üblichen und umfassenden Sinn von πίστις. Die Präposition διά bezeichnet hier das Mittel oder die Weise, durch die die genannten Menschen erben.
- source_word: μακροθυμίας
  choice: Geduld
  rationale: μακροθυμία bezeichnet geduldiges Ausharren über längere Zeit. „Geduld“ ist verständlich und vermeidet sowohl das altertümliche „Langmut“ als auch eine vollständige Gleichsetzung mit ὑπομονή.
- source_word: κληρονομούντων
  choice: erben
  rationale: Das Präsenspartizip beschreibt die betreffenden Menschen charakteristisch als solche, die die Verheißungen erben. Das einfache Präsens gibt dies im Deutschen knapp und natürlich wieder.
- source_word: τὰς ἐπαγγελίας
  choice: die Verheißungen
  rationale: Der bestimmte Plural des griechischen Textes wird bewahrt und greift zugleich den wiederkehrenden Sprachgebrauch des Hebräerbriefs auf.
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Die Wendung wahrt den Zweck- beziehungsweise Folgesinn und verbindet den Vers mit der vorangehenden Aufforderung.
theological_decisions:
- issue: Bedeutungsumfang von πίστις in diesem ermahnenden Zusammenhang
  choice: Glauben
  alternative: Treue oder Vertrauen
  rationale: πίστις bezeichnet hier wahrscheinlich das vertrauende Festhalten an Gott, kann sprachlich jedoch auch Treue einschließen. „Glauben“ bewahrt die theologische und lexikalische Breite; die mögliche Nuance „Treue“ wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denen nacheifert“ ist idiomatischer als das substantivische „Nachahmer derer seid“ und bewahrt dennoch den ausdrücklichen Gedanken des Nachahmens. Der Satz bleibt als abhängiger Zwecksatz formuliert, wie es der griechische Anschluss an den vorhergehenden Vers verlangt.
