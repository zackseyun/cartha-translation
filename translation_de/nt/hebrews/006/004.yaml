  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: de
  text: Denn es ist unmöglich, diejenigen, die einmal erleuchtet worden sind[a], die himmlische Gabe geschmeckt[b] haben und Anteil am Heiligen Geist bekommen haben[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erleuchtet“ kann allgemein den Empfang geistlichen Lichts oder geistlicher Unterweisung bezeichnen; manche verstehen es hier genauer als Hinweis auf Bekehrung oder Taufe.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die himmlische Gabe erfahren“. Das Verb bedeutet wörtlich „schmecken“, kann aber eine wirkliche Erfahrung und nicht bloß ein oberflächliches Probieren bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Teilhaber des Heiligen Geistes geworden sind“; auch möglich: „am Heiligen Geist teilbekommen haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: es ist unmöglich
  rationale: Das prädikativ und betont vorangestellte Adjektiv wird im Deutschen idiomatisch durch „es ist“ ergänzt; die Aussage wird im folgenden Vers fortgeführt.
- source_word: γὰρ
  choice: Denn
  rationale: Gibt den erläuternden Anschluss an die vorausgehende Aussage wieder, ohne das genaue logische Verhältnis stärker festzulegen.
- source_word: ἅπαξ
  choice: einmal
  rationale: Bezeichnet ein zurückliegendes, bestimmtes Geschehen; „ein für alle Mal“ wäre an dieser Stelle stärker als der Kontext verlangt.
- source_word: φωτισθέντας
  choice: erleuchtet worden sind
  rationale: Bewahrt das geistige beziehungsweise geistliche Lichtbild des griechischen Passivs, ohne es ausdrücklich mit Bekehrung oder Taufe gleichzusetzen.
- source_word: γευσαμένους
  choice: geschmeckt haben
  rationale: Bewahrt die konkrete Metapher des Verbs, das zugleich eine wirkliche Erfahrung bezeichnen kann.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: die himmlische Gabe
  rationale: Gibt die attributive Wortgruppe knapp und natürlich wieder, ohne die Gabe näher zu bestimmen.
- source_word: τε ... καὶ
  choice: die ... und
  rationale: Verbindet die kumulative Reihe der Partizipialbeschreibungen in natürlichem Deutsch.
- source_word: μετόχους γενηθέντας
  choice: Anteil ... bekommen haben
  rationale: Gibt sowohl das Eintreten in einen Zustand (γενηθέντας) als auch die Teilhabe (μετόχους) in gegenwärtigem, verständlichem Deutsch wieder.
- source_word: πνεύματος ἁγίου
  choice: am Heiligen Geist
  rationale: Der Genitiv hängt von μετόχους ab; „Anteil am Heiligen Geist“ bildet diese Beziehung idiomatisch ab.
theological_decisions:
- issue: Ob φωτισθέντας ausdrücklich Bekehrung oder Taufe bezeichnet
  choice: Die weitere Formulierung „erleuchtet worden“ bleibt im Haupttext erhalten.
  alternative: „bekehrt worden“ oder „durch die Taufe erleuchtet worden“
  rationale: Der griechische Text nennt weder Bekehrung noch Taufe ausdrücklich. Die Bildsprache bleibt deshalb offen.
- issue: Ob γευσαμένους nur ein oberflächliches Probieren oder eine wirkliche Erfahrung meint
  choice: Die wörtliche Metapher „geschmeckt“ steht im Haupttext; die mögliche Bedeutung „erfahren“ wird in der Fußnote genannt.
  alternative: „erfahren haben“ oder „nur gekostet haben“
  rationale: Das Verb kann wirkliche Erfahrung ausdrücken, legt deren heilsgeschichtliche Tragweite hier aber nicht eindeutig fest.
- issue: Welche Art von Teilhabe μετόχους ... πνεύματος ἁγίου bezeichnet
  choice: „Anteil am Heiligen Geist bekommen haben“
  alternative: „Teilhaber des Heiligen Geistes geworden sind“ oder „am Heiligen Geist teilgenommen haben“
  rationale: Die Formulierung gibt die Stärke der Aussage wieder, ohne daraus ausdrücklich eine bestimmte Lehre über rettende Innewohnung, Abfall oder Bewahrung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Satzstruktur bleibt erhalten, da der Gedanke erst in den folgenden Versen abgeschlossen wird. „Anteil ... bekommen“ ist verständlicher als das heute seltene „Teilhaber“, bewahrt aber die Aussage der Teilhabe.
