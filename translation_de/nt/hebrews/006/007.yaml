reference: Hebrews 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: de
  text: Denn Land, das den Regen trinkt, der oft darauf fällt, und Pflanzen hervorbringt, die für diejenigen nützlich sind, um derentwillen es auch bebaut wird, empfängt Segen von Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geeignet“ statt „nützlich“. Der Ausdruck „um derentwillen“ kann auch als „durch die es bebaut wird“ verstanden werden; die Form mit διά und Akkusativ weist jedoch eher auf Grund oder Zweck hin.'
    reason: εὔθετος kann sowohl praktische Nützlichkeit als auch Eignung bezeichnen. Die Fußnote vermerkt zudem die kontextuell vertretene Deutung von δι’ οὓς als Bezug auf die Bebauenden, ohne die im griechischen Ausdruck naheliegendere Zweck- bzw. Begünstigtenlesart aufzugeben.
lexical_decisions:
- source_word: γῆ
  choice: Land
  rationale: Im landwirtschaftlichen Bild bezeichnet γῆ eine bewirtschaftete Bodenfläche. „Land“ ist natürlicher und weiter als „Erdboden“, ohne die kosmische Weite von „Erde“ nahezulegen.
- source_word: πιοῦσα
  choice: trinkt
  rationale: Die bildhafte Personifikation des Landes wird bewahrt; „nimmt auf“ wäre sachlicher, aber weniger anschaulich.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: den oft darauf fallenden Regen
  rationale: Die Formulierung gibt das wiederholte Kommen des Regens idiomatisch wieder. „Fallenden“ ist im Deutschen für Regen natürlicher als das wörtlichere „kommenden“.
- source_word: τίκτουσα
  choice: hervorbringt
  rationale: Das Verb wahrt den erzeugenden Charakter des griechischen Ausdrucks und passt in gehobener, aber gegenwärtiger Sprache zu Pflanzenwuchs.
- source_word: βοτάνην
  choice: Pflanzen
  rationale: βοτάνη bezeichnet pflanzlichen Bewuchs beziehungsweise Gewächse. „Pflanzen“ ist allgemeinverständlich und legt keine bestimmte Feldfrucht fest.
- source_word: εὔθετον
  choice: nützlich
  rationale: Hier steht die praktische Eignung des Ertrags für die Begünstigten im Vordergrund; „nützlich“ gibt dies klar wieder.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: denen …, um derentwillen es auch bebaut wird
  rationale: 'διά mit dem Akkusativ bezeichnet am ehesten Grund oder Zweck: Das Land wird zu ihrem Nutzen bebaut. Die etwas gehobene Wendung „um derentwillen“ erhält diese Sinnbeziehung präzise.'
- source_word: γεωργεῖται
  choice: bebaut wird
  rationale: „Bebauen“ ist die geläufige deutsche Bezeichnung für die landwirtschaftliche Bearbeitung von Land und wahrt das Passiv.
- source_word: μεταλαμβάνει
  choice: empfängt
  rationale: Im Kontext bedeutet das Verb, dass dem Land Segen zuteilwird. „Empfängt“ ist natürlich und wahrt die Gabe-Richtung.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: Segen von Gott
  rationale: Die artikellose griechische Wendung lässt sich im Deutschen idiomatisch ohne unbestimmten Artikel wiedergeben und behält den spruchartigen Ton.
theological_decisions:
- issue: Landwirtschaftliches Bild im Zusammenhang der Warnung
  choice: Das positive landwirtschaftliche Bild wird ohne dogmatische Ausdeutung wiedergegeben.
  alternative: Den Ertrag ausdrücklich mit echten Gläubigen oder mit der Bewährung von Gläubigen identifizieren.
  rationale: Der Vers beschreibt zunächst nur fruchtbares Land und Gottes Segen. Welche konkrete Personengruppe das Bild bezeichnet, soll die Übersetzung nicht über den griechischen Wortlaut hinaus festlegen.
- issue: Bezug von δι’ οὓς
  choice: 'Zweck beziehungsweise Begünstigte: „um derentwillen“'
  alternative: 'Urheber beziehungsweise Handelnde: „von denen es bebaut wird“'
  rationale: διά mit Akkusativ spricht regulär für Grund oder Zweck, nicht für persönliche Urheberschaft. Eine gewisse kontextuelle Offenheit wird durch eine Fußnote zur möglichen Alternativauffassung kenntlich gemacht.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, bildhaftem Ton. „Trinkt“ bewahrt die Personifikation; „um derentwillen“ ist bewusst etwas gehoben, weil es die griechische Zweckbeziehung knapp und genau ausdrückt. Der Fußnotenmarker steht im Haupttext.
