  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: de
  text: Und so erlangte er, nachdem er geduldig ausgeharrt hatte, die Verheißung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „empfing, was verheißen war“. Näher am griechischen Wortlaut: „erlangte die Verheißung“.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: Und so
  rationale: Verbindet den Satz mit dem vorausgehenden Bericht über Abraham und gibt die folgernde beziehungsweise modale Bedeutung natürlich wieder.
- source_word: μακροθυμήσας
  choice: nachdem er geduldig ausgeharrt hatte
  rationale: Das temporale Partizip bezeichnet lang anhaltende Geduld. „Ausharren“ bringt die beharrliche Erwartung zum Ausdruck, ohne dem Text ausdrücklich ein bestimmtes Objekt des Wartens hinzuzufügen.
- source_word: ἐπέτυχεν
  choice: erlangte
  rationale: Gibt das erfolgreiche Erreichen oder Erlangen wieder und passt zum Genitivobjekt, ohne bereits eine vollständige Erfüllung festzulegen.
- source_word: τῆς ἐπαγγελίας
  choice: die Verheißung
  rationale: Bewahrt die konkrete Substantivform und die begriffliche Verbindung zum unmittelbaren Kontext, statt sie deutend als den verheißenen Inhalt aufzulösen.
theological_decisions:
- issue: Ob Abraham die Verheißung selbst oder bereits ihren vollständig verwirklichten Inhalt empfing
  choice: „erlangte … die Verheißung“
  alternative: „empfing, was verheißen war“
  rationale: Der griechische Wortlaut nennt ausdrücklich „die Verheißung“. Die formalere Wiedergabe wahrt die in Hebräer bestehende Spannung zwischen dem Empfang der Verheißung und ihrer Erfüllung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, bewahrt aber bewusst die substantivische Rede von der „Verheißung“ und damit die Mehrdeutigkeit des griechischen Textes.
