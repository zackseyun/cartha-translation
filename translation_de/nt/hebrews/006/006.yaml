source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: de
  text: und abgefallen sind[a], wieder zur Umkehr zu erneuern[b], da sie für sich den Sohn Gottes erneut kreuzigen und öffentlich der Schande preisgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Apostasie begangen haben“. Das griechische Verb kann einen schwerwiegenden Abfall bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „während sie für sich den Sohn Gottes erneut kreuzigen und öffentlich der Schande preisgeben“. Die griechischen Partizipien können begleitend oder erklärend verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: abgefallen sind
  rationale: Das Aoristpartizip bezeichnet im Zusammenhang einen schwerwiegenden Abfall. Die Formulierung ist im modernen Deutsch verständlich, ohne eine spätere dogmatische Deutung festzuschreiben.
- source_word: πάλιν ἀνακαινίζειν
  choice: wieder ... zu erneuern
  rationale: πάλιν bezeichnet die Wiederholung, während ἀνακαινίζειν die Erneuerung beziehungsweise Wiederherstellung zu einem früheren Zustand ausdrückt.
- source_word: εἰς μετάνοιαν
  choice: zur Umkehr
  rationale: εἰς bezeichnet Ziel oder Ergebnis. „Umkehr“ gibt μετάνοια im biblischen Zusammenhang natürlich und umfassend wieder.
- source_word: ἀνασταυροῦντας
  choice: erneut kreuzigen
  rationale: Das Präsenspartizip beschreibt die begleitende beziehungsweise begründende Haltung als fortdauernd; „erneut kreuzigen“ bewahrt die Wiederholungsbedeutung.
- source_word: ἑαυτοῖς
  choice: für sich
  rationale: Der reflexive Dativ kann den Bezug beziehungsweise das eigene Interesse oder den eigenen Nachteil bezeichnen. „Für sich“ bildet diese Offenheit knapp ab.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: den Sohn Gottes
  rationale: Direkte und im Deutschen etablierte Wiedergabe des christologischen Titels.
- source_word: παραδειγματίζοντας
  choice: öffentlich der Schande preisgeben
  rationale: Das Verb bezeichnet das öffentliche Bloßstellen zur Schande. Die gewählte Formulierung ist gegenwärtig, würdig und bewahrt die öffentliche Dimension.
theological_decisions:
- issue: Syntaktische Abhängigkeit vom vorhergehenden Vers
  choice: Der Vers beginnt mit „und“ und bleibt ohne eigenes finites Hauptverb, sodass er den Satz aus Hebräer 6,4–6 fortsetzt.
  alternative: „Es ist unmöglich, ... wieder zur Umkehr zu erneuern.“
  rationale: Der griechische Text ist syntaktisch vom vorausgehenden Zusammenhang abhängig. Diese Abhängigkeit soll in der Einzelversdarstellung sichtbar bleiben.
- issue: Art des Abfalls
  choice: „abgefallen sind“
  alternative: „Apostasie begangen haben“ oder „endgültig vom Glauben abgefallen sind“
  rationale: Die Übersetzung bewahrt die Schwere der Warnung, entscheidet aber nicht zwischen späteren Lehrsystemen über Heil, Beharren und Abfall.
- issue: Funktion der Partizipien ἀνασταυροῦντας und παραδειγματίζοντας
  choice: kausal-erklärend mit „da sie“
  alternative: gleichzeitig-begleitend mit „während sie“
  rationale: Die Partizipien können den Grund erläutern oder die gleichzeitige Begleitumständlichkeit bezeichnen. Der Haupttext folgt der naheliegenden kausalen Lesart; die mögliche temporale Lesart wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die ungewöhnlich offene Satzgestalt ist bewusst beibehalten, weil der Vers syntaktisch den vorhergehenden Satz fortsetzt. Alle Fußnotenmarker stehen im Haupttext.
