revisions:
- from: und das gute Wort Gottes und die Kräfte der kommenden Weltzeit[a] geschmeckt haben,
  to: und das gute Wort Gottes und die Kräfte[b] des kommenden Zeitalters[a] geschmeckt haben,
  rationale: Die Änderung zu „kommenden Zeitalters“ verbessert die idiomatische Verständlichkeit und wahrt den eschatologischen Sinn von μέλλων αἰών. Der Haupttext lässt δυνάμεις weiterhin offen; die ergänzte Fußnote dokumentiert die engeren kontextuellen Alternativen. Die abhängige Satzform und die theologische Ambiguität von γεύομαι bleiben unverändert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:44:54Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Partizipialkonstruktion γευσαμένους zutreffend als abhängige Fortsetzung mit „geschmeckt haben“ wieder und bewahrt damit das Bild sowie die in Hebräer 6,4–6 bestehende Auslegungsoffenheit. „das gute Wort Gottes“ entspricht καλὸν ... θεοῦ ῥῆμα. δυνάμεις wird mit „Kräfte“ bewusst weit wiedergegeben. Für μέλλοντος αἰῶνος ist „kommendes Zeitalter“ im heutigen Standarddeutsch die klarere, idiomatischere Entsprechung als „kommende Weltzeit“.
  naturalness: „Kräfte des kommenden Zeitalters“ ist modernes, würdiges und gut verständliches Standarddeutsch. „Weltzeit“ ist zwar sachlich möglich, wirkt jedoch fachsprachlich und weniger geläufig.
  terminology: „Wort Gottes“, „geschmeckt haben“ und „Kräfte“ sind angemessen. Die alternative Wiedergabe von δυνάμεις als „Wunder“ beziehungsweise „Machttaten“ soll wie im englischen Audit Trail mit einem eigenen Anker dokumentiert werden, ohne sie in den Haupttext zu übernehmen.
  issues:
  - severity: low
    issue: „kommende Weltzeit“ ist unnötig ungebräuchlich.
    rationale: αἰών meint hier die künftige Epoche; „kommendes Zeitalter“ drückt dies im modernen Deutsch klarer aus, ohne es als geschaffene „Welt“ zu verstehen.
  - severity: low
    issue: Die lexikalische Alternative zu δυνάμεις ist nicht durch einen Fußnotenanker dokumentiert.
    rationale: Der englische Audit Trail führt hierfür die Alternativen „miracles“ und „mighty works“. Ein eigener deutscher Anker macht die bewusst breite Hauptwiedergabe transparent.
