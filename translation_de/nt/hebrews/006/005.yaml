  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: de
  text: und das gute Wort Gottes und die Kräfte[b] des kommenden Zeitalters[a] geschmeckt haben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der kommenden Weltzeit«; auch: »der zukünftigen Weltzeit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wunder« oder »Machttaten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: gute
  rationale: καλός bewertet hier ῥῆμα positiv. „gut“ ist im Deutschen natürlich, verständlich und legt die Bedeutung nicht unnötig auf „schön“ oder „vortrefflich“ fest.
- source_word: γευσαμένους
  choice: geschmeckt haben
  rationale: Das Partizip setzt die Akkusativreihe aus dem vorangehenden Zusammenhang fort. „geschmeckt haben“ bewahrt das Bild des griechischen Verbs und vermeidet eine theologische Festlegung über die Tiefe der Erfahrung.
- source_word: θεοῦ ῥῆμα
  choice: das Wort Gottes
  rationale: ῥῆμα kann eine Äußerung oder ein gesprochenes Wort bezeichnen. „das Wort Gottes“ ist die natürliche deutsche Wiedergabe und lässt sowohl Herkunft als auch Zugehörigkeit anklingen.
- source_word: δυνάμεις
  choice: die Kräfte
  rationale: Der Plural kann Machterweise oder Wundertaten bezeichnen. „Kräfte“ bleibt nah am griechischen Ausdruck und bewahrt dessen größere Bedeutungsbreite.
- source_word: τε
  choice: und
  rationale: τε verbindet δυνάμεις mit dem vorherigen Gegenstand; das einfache „und“ gibt diese Funktion im Deutschen flüssig wieder.
- source_word: μέλλοντος αἰῶνος
  choice: der kommenden Weltzeit
  rationale: αἰών bezeichnet hier die künftige eschatologische Epoche. „kommende Weltzeit“ gibt den zeitlichen und heilsgeschichtlichen Sinn wieder, ohne αἰών mit der geschaffenen Welt gleichzusetzen.
theological_decisions:
- issue: Bedeutung von γεύομαι im Zusammenhang der Warnung
  choice: Das Bild mit „geschmeckt haben“ unverstärkt beibehalten.
  alternative: „erfahren haben“ oder „nur gekostet haben“
  rationale: Der Wortlaut soll weder volle Teilhabe ausdrücklich behaupten noch die Erfahrung als oberflächlich abschwächen; so bleibt die theologische Spannung von Hebräer 6,4–6 erhalten.
- issue: Bedeutung von δυνάμεις im eschatologischen Zusammenhang
  choice: „Kräfte“
  alternative: „Wunder“ oder „Machttaten“
  rationale: Der Ausdruck kann wunderhafte Manifestationen der anbrechenden künftigen Weltzeit meinen, ist aber lexikalisch weiter. „Kräfte“ vermeidet eine unnötige Einengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktisch abhängige Fortsetzung des vorangehenden Satzes formuliert. „Weltzeit“ ist etwas gehobener, aber verständlich und unterscheidet αἰών von κόσμος.
