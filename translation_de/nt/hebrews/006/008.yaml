  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: de
  text: Bringt der Boden aber Dornen und Disteln hervor, ist er unbrauchbar[a], nahe daran, verflucht zu werden, und endet in der Verbrennung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: verworfen.'
    reason: ἀδόκιμος kann sowohl die Untauglichkeit des Bodens als auch dessen Verwerfung bezeichnen.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: bringt … hervor
  rationale: Das feminine Partizip führt den im vorherigen Vers genannten Erdboden als Subjekt weiter. „Hervorbringen“ ist im landwirtschaftlichen Bild natürlich und gibt die fortdauernde Erzeugung wieder.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zum fruchtbaren Boden in Vers 7.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: Dornen und Disteln
  rationale: Die geläufige deutsche Wortverbindung bewahrt das Bild von stacheligem, nutzlosem Bewuchs.
- source_word: ἀδόκιμος
  choice: unbrauchbar
  rationale: Das Wort bezeichnet hier den Boden als nicht bewährt beziehungsweise für den erwarteten Ertrag untauglich. „Unbrauchbar“ passt zum landwirtschaftlichen Zusammenhang, ohne die mögliche Nuance „verworfen“ auszuschließen.
- source_word: κατάρας ἐγγύς
  choice: dem Fluch nahe
  rationale: Gibt die Genitivkonstruktion mit ἐγγύς eng wieder und bewahrt die nominale Form sowie die noch nicht vollzogene Nähe zum Fluch.
- source_word: ἧς τὸ τέλος
  choice: sein Ende
  rationale: Das Relativpronomen verweist auf den zuvor genannten Erdboden; die deutsche Formulierung ist knapp und wahrt sowohl Ausgang als auch Zielpunkt.
- source_word: εἰς καῦσιν
  choice: ist die Verbrennung
  rationale: Bewahrt das Feuerbild und lässt offen, wie weit es über das landwirtschaftliche Bild hinaus auszulegen ist.
theological_decisions:
- issue: Ob der aus Vers 7 fortgeführte Boden im Deutschen ausdrücklich aufgenommen werden soll
  choice: Den Erdboden durch das Pronomen „er“ fortführen
  alternative: „Land, das … hervorbringt“ oder „Bringt es aber … hervor“
  rationale: Das griechische feminine Partizip setzt das Subjekt aus Vers 7 voraus. Im Deutschen macht das maskuline Pronomen den Rückbezug auf „Erdboden“ klar, ohne das Substantiv erneut hinzuzufügen.
- issue: Wie stark ἀδόκιμος als Verwerfung ausgedrückt werden soll
  choice: „unbrauchbar“ im Haupttext; „verworfen“ in der Fußnote
  alternative: „verworfen“ oder „nicht bewährt“ im Haupttext
  rationale: Im unmittelbaren landwirtschaftlichen Bild steht die fehlende Brauchbarkeit im Vordergrund. Die stärkere und theologisch bedeutsame Nuance „verworfen“ bleibt als echte lexikalische Möglichkeit sichtbar.
- issue: Ob εἰς καῦσιν ausdrücklich als endgültiges Gericht erklärt werden soll
  choice: Das Bild mit „Verbrennung“ stehen lassen
  alternative: „endet im Gerichtsfeuer“ oder „wird schließlich verbrannt“
  rationale: Der griechische Text nennt die Verbrennung, bestimmt aber an dieser Stelle nicht ausdrücklich ihren vollständigen theologischen Bezug. Eine Konkretisierung als Hölle oder endgültige Verdammnis wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bildsprache des griechischen Textes bleibt erhalten; das Semikolon macht den Folgesatz gut lesbar, ohne seinen engen Zusammenhang zu lösen.
