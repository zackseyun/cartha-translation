  source_fidelity: 'Die wesentlichen Lexeme sind zutreffend wiedergegeben: ἀκάνθας καὶ τριβόλους als „Dornen und Disteln“, ἀδόκιμος als „unbrauchbar“ und εἰς καῦσιν ohne dogmatische Ausdeutung. „Dem Fluch nahe“ bildet zwar die griechische Nominalkonstruktion formal ab, ist im heutigen Deutschen jedoch weniger klar als eine idiomatische Wiedergabe der drohenden Verfluchung.'
  naturalness: „Bringt er aber … hervor“ setzt einen maskulinen „Erdboden“ voraus, der im vorliegenden Vers nicht genannt wird und von der deutschen Gestaltung des vorigen Verses abhängig wäre. Die ausdrückliche Wiederaufnahme „der Boden“ ist klar und natürlich. „Sein Ende ist die Verbrennung“ klingt zudem nominal und technisch; „endet in der Verbrennung“ gibt die resultative Zielrichtung von εἰς καῦσιν flüssiger wieder.
  terminology: „Unbrauchbar“ passt im landwirtschaftlichen Bild gut zu ἀδόκιμος. Die Fußnote mit „verworfen“ erhält die mögliche stärkere Nuance, ohne sie im Haupttext aufzuzwingen. „Verflucht zu werden“ verdeutlicht die im Kontext gemeinte drohende Folge von κατάρας ἐγγύς, ohne den Fluch als näher bestimmte Lehrkategorie auszulegen.
