- from: Bringt er aber Dornen und Disteln hervor, ist er unbrauchbar[a] und dem Fluch nahe; sein Ende ist die Verbrennung.
  to: Bringt der Boden aber Dornen und Disteln hervor, ist er unbrauchbar[a], nahe daran, verflucht zu werden, und endet in der Verbrennung.
  rationale: Die Revision macht das fortgeführte Bildsubjekt unabhängig von einer nicht vorliegenden deutschen Formulierung des vorherigen Verses sichtbar. Sie ersetzt zwei formal nahe, aber im modernen Deutsch weniger idiomatische Wendungen durch natürliche Formulierungen, ohne die landwirtschaftliche Bildsprache zu allegorisieren oder die Verbrennung als ausdrücklich endgültiges Gericht festzulegen.
