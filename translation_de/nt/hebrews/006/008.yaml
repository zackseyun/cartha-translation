    issue: Unklare und kontextabhängige Pronominalaufnahme „er“
    rationale: Das griechische Partizip setzt die γῆ aus V. 7 fort; ein deutsches maskulines Pronomen ist aber nur dann nachvollziehbar, wenn die vorherige deutsche Übersetzung ausdrücklich „der Erdboden“ verwendet. Die Wiederholung „der Boden“ beseitigt diese unnötige grammatische Abhängigkeit.
  - severity: low
    issue: „dem Fluch nahe“ ist im modernen Deutsch semantisch weniger eindeutig
    rationale: Die Formulierung ist zwar eng am Griechischen, kann aber wie räumliche Nähe zu einem abstrakten Fluch wirken. „nahe daran, verflucht zu werden“ gibt die drohende Konsequenz im Kontext idiomatisch wieder.
  - severity: low
    issue: „sein Ende ist die Verbrennung“ ist stilistisch steif
    rationale: Die Formulierung ist verständlich, aber „endet in der Verbrennung“ bewahrt die Ziel-/Ergebnisrichtung von εἰς καῦσιν in natürlicherem Deutsch.
  revised_text: Bringt der Boden aber Dornen und Disteln hervor, ist er unbrauchbar[a], nahe daran, verflucht zu werden, und endet in der Verbrennung.
