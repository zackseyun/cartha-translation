  to: Denn Gott ist nicht ungerecht, euer Werk und die Liebe zu vergessen, die ihr seinem Namen erwiesen habt[a], indem ihr den Heiligen[b] gedient habt und ihnen weiterhin dient[c].
  rationale: Die Revision ersetzt allein die ungenaue Folgekonstruktion durch die im Deutschen natürliche und dem griechischen Infinitiv unmittelbar entsprechende Infinitivgruppe. Die Fußnote zu „den Heiligen“ wird logisch präzisiert. Die bewusst knappe, leicht gehobene Wendung „seinem Namen erwiesen habt“ bleibt erhalten, da sie die griechische Ausrichtung auf Gottes Namen ohne einseitige Festlegung auf eine Zwecknuance wiedergibt.
