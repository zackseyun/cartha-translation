source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: de
  text: Denn Gott ist nicht ungerecht, euer Werk und die Liebe zu vergessen, die ihr seinem Namen erwiesen habt[a], indem ihr den Heiligen[b] gedient habt und ihnen weiterhin dient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr um seines Namens willen gezeigt habt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: den anderen Gläubigen; „die Heiligen“ bezeichnet hier Gottes heiliges Volk, nicht eine später kanonisierte Gruppe.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „dadurch, dass ihr den Heiligen gedient habt und ihnen weiterhin dient“.'
    reason: translation_alternative
lexical_decisions:
- source_word: ἄδικος
  choice: ungerecht
  rationale: Die direkte und im Deutschen natürliche Entsprechung bezeichnet hier ein Handeln, das der Gerechtigkeit widerspräche.
- source_word: ἐπιλαθέσθαι
  choice: vergäße
  rationale: Der Konjunktiv nach „sodass“ gibt den griechischen Infinitiv idiomatisch wieder und bewahrt den Grundsinn „vergessen“, einschließlich des kontextuellen Gedankens, etwas nicht entsprechend zu berücksichtigen.
- source_word: τοῦ ἔργου ὑμῶν
  choice: euer Werk
  rationale: Der kollektive Singular des Griechischen bleibt erhalten; „Werk“ umfasst das konkrete Tun, das anschließend als Dienst beschrieben wird.
- source_word: τῆς ἀγάπης
  choice: die Liebe
  rationale: „Liebe“ ist die sachgemäße und geläufige Wiedergabe von ἀγάπη; hier zeigt sie sich in konkretem Dienst.
- source_word: ἧς ἐνεδείξασθε
  choice: die ihr … erwiesen habt
  rationale: „Erwiesen“ bringt zum Ausdruck, dass die Liebe sichtbar unter Beweis gestellt wurde, und verbindet sich im Deutschen natürlich mit „seinem Namen“.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: seinem Namen
  rationale: Die Verbindung „Liebe seinem Namen erweisen“ bewahrt die Ausrichtung auf Gottes Namen, ohne sie vorschnell ausschließlich als Zweckangabe auszulegen.
- source_word: διακονήσαντες
  choice: indem ihr … gedient habt
  rationale: Das Aoristpartizip verweist auf bereits geschehenen Dienst und erläutert, worin die erwiesene Liebe bestand.
- source_word: τοῖς ἁγίοις
  choice: den Heiligen
  rationale: Die etablierte neutestamentliche Bezeichnung wird bewahrt; gemeint sind die zu Gott gehörenden Gläubigen, nicht eine später abgegrenzte kanonisierte Gruppe.
- source_word: διακονοῦντες
  choice: ihnen weiterhin dient
  rationale: „Weiterhin“ macht den durativen Gegenwartsaspekt des Präsenspartizips gegenüber dem vorausgehenden Aoristpartizip verständlich sichtbar.
theological_decisions:
- issue: Ob der Vers ein Verdienst vor Gott oder Gottes gerechtes Erinnern an das Tun der Gläubigen lehrt
  choice: Die Formulierung hält fest, dass Gott ihr Werk und ihre Liebe nicht vergisst.
  alternative: Eine stärker verdienstorientierte Formulierung, nach der menschliche Werke einen geschuldeten Lohn erwerben.
  rationale: Der griechische Text verbindet Gottes Gerechtigkeit mit seinem Nichtvergessen, sagt aber nicht ausdrücklich, dass die genannten Werke das Heil verdienen.
- issue: Bezug von εἰς τὸ ὄνομα αὐτοῦ
  choice: „die ihr seinem Namen erwiesen habt“
  alternative: „die ihr um seines Namens willen gezeigt habt“
  rationale: εἰς kann die Ausrichtung der Liebe auf Gottes Namen oder den Dienst um seines Namens willen bezeichnen. Der Haupttext folgt eng der griechischen Struktur; die mögliche Zwecknuance bleibt in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „sodass“ und „indem“ idiomatisch gegliedert. Der Unterschied zwischen vergangenem und fortdauerndem Dienst wird ausdrücklich wiedergegeben.
