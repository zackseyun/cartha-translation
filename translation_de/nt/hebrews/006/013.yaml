source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: de
  text: Denn als Gott Abraham die Verheißung gab, schwor er bei sich selbst, weil er bei keinem Größeren schwören konnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung zum vorausgehenden Gedankengang klar und idiomatisch ein.
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: als Gott Abraham die Verheißung gab
  rationale: Gibt das temporale Partizip natürlich wieder; der Dativ bezeichnet den Empfänger. „Die Verheißung gab“ macht den im Kontext bestimmten Inhalt ausdrücklich.
- source_word: ἐπεὶ
  choice: weil
  rationale: Kennzeichnet hier den Grund dafür, dass Gott bei sich selbst schwor.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: bei keinem Größeren
  rationale: Im Zusammenhang des Schwörens ist der persönliche Bezug naheliegend; die Formulierung bleibt knapp und bewahrt den Komparativ.
- source_word: ὀμόσαι / ὤμοσεν
  choice: schwören konnte / schwor
  rationale: Bewahrt die Wiederholung desselben griechischen Verbs und gibt die Konstruktion mit εἶχεν idiomatisch als Möglichkeit wieder.
- source_word: καθ’ ἑαυτοῦ
  choice: bei sich selbst
  rationale: Entspricht der deutschen Schwurformel und erhält die Aussage, dass Gott keine höhere Instanz anruft.
theological_decisions:
- issue: Grund und Gegenstand von Gottes Eid
  choice: Gott schwor bei sich selbst, weil er bei keinem Größeren schwören konnte.
  alternative: Gott schwor bei sich selbst, weil er niemand Größeren hatte, bei dem er schwören konnte.
  rationale: Die gewählte Fassung bewahrt Gottes einzigartige Hoheit, ohne über die Aussage des Verses hinauszugehen, und gibt die griechische Konstruktion natürlich wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber dem Griechischen leicht umgestellt, damit Hauptaussage und Begründung klar lesbar sind; die logische und theologische Spannung bleibt erhalten.
