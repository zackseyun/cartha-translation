  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: de
  text: Auch nicht durch das Blut von Böcken und Kälbern, sondern durch sein eigenes Blut trat er ein für alle Mal in die heiligen Stätten ein[a] und erlangte ewige Erlösung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Heiligtum“. Der griechische Ausdruck steht im Plural und lautet wörtlich „in die heiligen [Stätten]“. Manche Übersetzungen geben ihn spezifischer als „in das Allerheiligste“ wieder; das ist jedoch stärker interpretierend, als es der Wortlaut verlangt.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: auch nicht
  rationale: Die Wendung führt den Gedanken des vorausgehenden Verses weiter. „Auch nicht“ bewahrt diese anschließende Kraft und klingt im Deutschen natürlicher als ein vorangestelltes „und nicht“.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: durch das Blut von Böcken und Kälbern
  rationale: διά mit Genitiv bezeichnet hier das Mittel. „Durch“ erhält zudem die bewusste Wiederholung und den Gegensatz zum eigenen Blut Christi.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: sondern durch sein eigenes Blut
  rationale: Das wiederholte διά wird gleichlautend wiedergegeben; „sein eigenes“ bewahrt die Betonung des griechischen ἰδίου.
- source_word: εἰσῆλθεν
  choice: ging … hinein / ging … ein
  rationale: Der Aorist bezeichnet den vollzogenen Eintritt. Die zweiteilige deutsche Formulierung hält sowohl den Gegensatz der Mittel als auch das Ziel des Eintretens verständlich zusammen.
- source_word: ἐφάπαξ
  choice: ein für alle Mal
  rationale: Die Formulierung bezeichnet eine einmalige, endgültige und nicht zu wiederholende Handlung.
- source_word: εἰς τὰ ἅγια
  choice: in die heiligen Stätten
  rationale: Der Plural des griechischen Ausdrucks bleibt sichtbar. „Heiligtum“ ist ebenfalls möglich; „das Allerheiligste“ wäre dagegen stärker interpretierend als der Wortlaut.
- source_word: αἰωνίαν λύτρωσιν
  choice: ewige Erlösung
  rationale: Die Wiedergabe bezeichnet eine Erlösung von bleibender, unbegrenzter Geltung und entspricht dem üblichen Sinn im Kontext.
- source_word: εὑράμενος
  choice: und erlangte
  rationale: Wörtlich bedeutet das Partizip „gefunden habend“, bezeichnet hier aber idiomatisch das Erlangen. Die Beiordnung ergibt einen natürlichen deutschen Satz, ohne eine zeitliche Abfolge stärker festzulegen.
theological_decisions:
- issue: Bedeutung des Eintritts Christi durch sein eigenes Blut
  choice: Christus tritt durch sein eigenes Blut in die himmlischen heiligen Stätten ein; „durch“ bezeichnet das Mittel, ohne den genauen Opfermechanismus näher festzulegen.
  alternative: Christus trägt oder präsentiert sein Blut räumlich buchstäblich; oder er tritt lediglich nach dem Vergießen seines Blutes ein.
  rationale: Die wiederholte Konstruktion διά mit Genitiv legt eine einheitliche instrumentale Wiedergabe nahe. So bleibt der Gegensatz zum Tierblut erhalten, ohne dem Text eine genauere Erklärung des himmlischen Opfergeschehens aufzuzwingen.
- issue: Umfang von τὰ ἅγια
  choice: die heiligen Stätten
  alternative: das Heiligtum; das Allerheiligste
  rationale: Der griechische Ausdruck steht im Plural und kann kultisch das Heiligtum bezeichnen. „Das Allerheiligste“ würde eine Auslegung festschreiben, die der Wortlaut nicht ausdrücklich verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Verwendung von „hinein/ein“ ist bewusst gewählt, um trotz der deutschen Satzstellung den parallelen Gegensatz „nicht durch … sondern durch …“ und das Ziel des Eintretens klar zu erhalten. Der kultische Plural bleibt stehen; die mögliche idiomatische Wiedergabe „Heiligtum“ wird in der Fußnote genannt.
