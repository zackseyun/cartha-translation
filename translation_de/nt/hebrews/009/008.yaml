id: HEB.9.8
reference: Hebrews 9:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: de
  text: Dadurch macht der Heilige Geist deutlich, dass der Weg in das Heiligtum[a] noch nicht offenbar geworden ist, solange das erste Zelt noch Bestand hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Weg in die heiligen Bereiche“; möglicherweise ist besonders der Weg in das Allerheiligste gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „solange das erste Zelt noch steht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: macht ... deutlich
  rationale: Das präsentische Partizip in der Genitivus-absolute-Konstruktion bezeichnet das erklärende Anzeigen durch den Heiligen Geist; die deutsche Wendung ist natürlich und bewahrt den fortdauernden Aussagewert.
- source_word: πνεύματος τοῦ ἁγίου
  choice: der Heilige Geist
  rationale: Übliche und kontextgemäße Wiedergabe der griechischen Wortgruppe.
- source_word: μήπω πεφανερῶσθαι
  choice: noch nicht offenbar geworden ist
  rationale: Das Perfekt Passiv bezeichnet den fortbestehenden Zustand, dass der Zugang noch nicht erschlossen beziehungsweise offenbar gemacht worden ist.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: der Weg in das Heiligtum
  rationale: Im unmittelbaren Zusammenhang bezeichnet τὰ ἅγια den sakralen Bereich. „In“ gibt den gemeinten Zugang idiomatisch wieder, ohne den Bezug zwingend auf das Allerheiligste zu verengen.
- source_word: πρώτης σκηνῆς
  choice: das erste Zelt
  rationale: „Zelt“ gibt σκηνή unmittelbar wieder; „erstes“ knüpft an die räumliche Unterscheidung der beiden Zeltbereiche in Hebräer 9,2–3 an.
- source_word: ἐχούσης στάσιν
  choice: noch Bestand hat
  rationale: Die Wendung bezeichnet hier fortdauernden Bestand beziehungsweise Geltung und ist im Deutschen natürlicher als eine wörtliche Substantivkonstruktion.
- source_word: ἔτι
  choice: noch
  rationale: Kennzeichnet die fortdauernde Existenz beziehungsweise Geltung des ersten Zeltes.
theological_decisions:
- issue: Referent von τῶν ἁγίων
  choice: kultischer Zugang zum Heiligtum
  alternative: der Weg der Heiligen
  rationale: Der Zusammenhang behandelt Aufbau, Dienst und Zugang des Zeltheiligtums; daher ist die Wendung räumlich-kultisch und nicht auf heilige Menschen bezogen.
- issue: Genauigkeit des Heiligtumsbezugs
  choice: Heiligtum als nicht weiter verengter sakraler Bereich
  alternative: das Allerheiligste im Besonderen
  rationale: Der Kontext kann besonders an den innersten Raum denken lassen, doch der griechische substantivierte Plural lässt eine breitere Bezeichnung des Heiligtums zu. Die Hauptfassung bewahrt diese Spannung.
- issue: Bedeutung von ἐχούσης στάσιν
  choice: fortdauernder Bestand
  alternative: bloßes physisches Stehen des Zeltes
  rationale: Die Formulierung kann auf das fortbestehende Bestehen beziehungsweise die fortdauernde Geltung der ersten Zeltordnung zielen. Die Fußnote nennt die stärker räumlich-konkrete Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heiligtum“ ist im Deutschen idiomatischer als ein künstlicher kultischer Plural; die Fußnote bewahrt die griechische Breite. „Erstes Zelt“ hält die Verbindung zur unmittelbar vorausgehenden Beschreibung der beiden Zeltbereiche aufrecht.
