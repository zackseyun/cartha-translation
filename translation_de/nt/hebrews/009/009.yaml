  source_fidelity: Die Satzstruktur und die zentralen Begriffe werden im Wesentlichen zutreffend wiedergegeben. „Gleichnis“ ist für παραβολή vertretbar, sofern die lexikalischen Alternativen in der Fußnote erhalten bleiben. „im Blick auf das Gewissen“ gibt κατὰ συνείδησιν angemessen als Bereichsangabe wieder.
  naturalness: „Ihr entsprechend“ ist in diesem Zusammenhang weniger klar und idiomatisch als „nach der“. „den Gottesdienst Ausübenden“ wirkt verwaltungssprachlich und ist als Bezeichnung einer Einzelperson unnötig schwerfällig.
  terminology: „Gaben und Opfer“, „dargebracht“, „Gewissen“ und „vollkommen machen“ sind sachgerecht. Die Wiedergabe von λατρεύοντα als „denjenigen, der Gottesdienst feiert“ ist modernes Standarddeutsch und wahrt den kultischen Bezug sowie den Singular.
