revisions:
- from: Sie ist ein Gleichnis für die gegenwärtige Zeit[a]. Ihr entsprechend werden sowohl Gaben als auch Opfer dargebracht, die den Gottesdienst Ausübenden im Blick auf das Gewissen nicht vollkommen machen können.
  to: Sie ist ein Gleichnis für die gegenwärtige Zeit[a], nach der sowohl Gaben als auch Opfer dargebracht werden, die denjenigen, der Gottesdienst feiert, im Blick auf das Gewissen nicht vollkommen machen können.
  rationale: Die Revision glättet zwei sprachlich auffällige Formulierungen, ohne die syntaktische Verknüpfung, den kultischen Kontext oder die theologisch gewichtige Aussage über die fehlende Vollendung im Bereich des Gewissens zu verändern. Die Fußnote bewahrt die berechtigte lexikalische Offenheit von παραβολή.
