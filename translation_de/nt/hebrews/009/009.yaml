  variant: modern standard German
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: de
  text: Sie ist ein Gleichnis für die gegenwärtige Zeit[a], nach der sowohl Gaben als auch Opfer dargebracht werden, die denjenigen, der Gottesdienst feiert, im Blick auf das Gewissen nicht vollkommen machen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Sinnbild oder eine bildhafte Darstellung für die gegenwärtige Zeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: Sie
  rationale: Das feminine Pronomen nimmt die zuvor genannte Stiftshütte beziehungsweise ihre Ordnung wieder auf und wahrt den erklärenden Anschluss.
- source_word: παραβολὴ
  choice: Gleichnis
  rationale: „Gleichnis“ bewahrt den Grundsinn einer bildhaften Entsprechung und die für den Hebräerbrief wichtige typologische Beziehung; geläufige Alternativen werden in der Fußnote genannt.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: für die gegenwärtige Zeit
  rationale: Die Wendung bezeichnet die im Gedankengang gegenwärtige Zeit und bleibt zeitlich offen, ohne sie ausdrücklich als ein bestimmtes Zeitalter zu deuten.
- source_word: καθ’ ἣν
  choice: Ihr entsprechend
  rationale: Die Formulierung gibt die durch das feminine Relativpronomen bezeichnete Entsprechungs- beziehungsweise Ordnungsbeziehung knapp und idiomatisch wieder.
- source_word: δῶρά τε καὶ θυσίαι
  choice: sowohl Gaben als auch Opfer
  rationale: Die beiden kultischen Begriffe bleiben unterschieden; „sowohl … als auch“ bildet τε καὶ ab.
- source_word: προσφέρονται
  choice: werden … dargebracht
  rationale: Das kultisch passende „darbringen“ gibt das Präsens Passiv natürlich wieder.
- source_word: μὴ δυνάμεναι
  choice: nicht … können
  rationale: Die Formulierung drückt das Unvermögen der Gaben und Opfer in natürlichem Deutsch aus.
- source_word: κατὰ συνείδησιν
  choice: im Blick auf das Gewissen
  rationale: Die Wendung begrenzt den Bereich, in dem keine Vollkommenheit erreicht wird, ohne sie auf bloße subjektive Aufrichtigkeit zu reduzieren.
- source_word: τελειῶσαι
  choice: vollkommen machen
  rationale: Die Wiedergabe erhält den im Hebräerbrief gewichtigen Gedanken des Zur-Vollendung- beziehungsweise Zur-Eignung-Bringens.
- source_word: τὸν λατρεύοντα
  choice: den Gottesdienst Ausübenden
  rationale: Die substantivierte Singularform bezeichnet die Person, die kultischen Dienst verrichtet; die Übersetzung hält sowohl den Gottesdienstbezug als auch den Singular fest.
theological_decisions:
- issue: παραβολή im kultisch-typologischen Zusammenhang
  choice: Gleichnis
  alternative: Sinnbild oder bildhafte Darstellung
  rationale: „Gleichnis“ bewahrt die bildhafte Entsprechung zwischen der irdischen Heiligtumsordnung und ihrer zeitlichen Bedeutung, ohne diese Beziehung auf ein rein abstraktes Symbol festzulegen.
- issue: Wirkungsbereich der Opfer
  choice: im Blick auf das Gewissen nicht vollkommen machen
  alternative: das Gewissen nicht vollkommen machen
  rationale: κατὰ συνείδησιν bezeichnet den Gesichtspunkt beziehungsweise Bereich der fehlenden Vollendung. Die gewählte Fassung vermeidet die stärkere Behauptung, das Gewissen selbst sei das unmittelbare Objekt von τελειῶσαι.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gleichnis“ und „vollkommen machen“ erhalten die leitenden Begriffe des griechischen Textes; „den Gottesdienst Ausübenden“ ist bewusst etwas formeller, um den kultischen Sinn von λατρεύω zu bewahren.
