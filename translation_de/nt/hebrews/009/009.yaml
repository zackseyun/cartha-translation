  - severity: medium
    issue: Sperrige Wiedergabe von τὸν λατρεύοντα
    rationale: „den Gottesdienst Ausübenden“ ist zwar verständlich, klingt aber bürokratisch und nicht natürlich. „denjenigen, der Gottesdienst feiert“ bezeichnet die einzelne kultisch verehrende Person idiomatisch.
