source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: de
  text: Sie betreffen nur Speisen und Getränke und verschiedene Waschungen; es sind äußere Vorschriften, die bis zur Zeit der Neuordnung auferlegt sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: Waschungen
  rationale: Im kultischen Zusammenhang bezeichnet der Plural verschiedene rituelle Reinigungen, nicht spezifisch die christliche Taufe.
- source_word: δικαιώματα σαρκὸς
  choice: Vorschriften für den äußeren Menschen
  rationale: δικαιώματα meint verbindliche kultische Vorschriften; σαρκὸς bezieht sich hier auf die leiblich-äußere Sphäre. Die Wiedergabe vermeidet das im Deutschen leicht moralisch missverständliche „fleischliche Vorschriften“.
- source_word: καιροῦ διορθώσεως
  choice: Zeit der Neuordnung
  rationale: διορθώσεως bezeichnet ein In-Ordnung-Bringen bzw. eine grundlegende Neuordnung; „Neuordnung“ bewahrt die heilsgeschichtliche Offenheit des Ausdrucks.
- source_word: ἐπικείμενα
  choice: auferlegt sind
  rationale: Das Partizip drückt aus, dass diese Vorschriften verbindlich auferlegt sind; das Präsens folgt der Perspektive der Darstellung.
theological_decisions:
- issue: Bedeutung von σάρξ in δικαιώματα σαρκὸς
  choice: äußerer Mensch
  alternative: fleischliche Vorschriften / Vorschriften für den Körper
  rationale: Der Kontext stellt äußere, kultische Reinigung der Gewissensreinigung gegenüber. „Äußerer Mensch“ vermittelt diese sachliche Begrenzung, ohne σάρξ pauschal als sündige Natur zu deuten.
- issue: Bedeutung der „Zeit der Neuordnung“
  choice: nicht ausdrücklich identifiziert
  alternative: ausdrücklich als neue Ordnung Christi oder messianische Zeit benennen
  rationale: Der Vers selbst lässt die Formulierung knapp; der weitere Kontext erschließt ihren Bezug. Die Übersetzung soll diese Auslegung nicht in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als syntaktische Fortsetzung des vorhergehenden Verses formuliert. Der Gedankenstrich macht die appositionelle Zuordnung der „Vorschriften“ verständlich, ohne zusätzliche Aussage einzuführen.
