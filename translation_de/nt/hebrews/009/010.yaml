  source_fidelity: 'Die Grundstruktur und die kultische Bedeutung von βαπτισμοῖς als „Waschungen“ sind zutreffend. „Vorschriften für den äußeren Menschen“ geht jedoch über δικαιώματα σαρκὸς hinaus: Es trägt den paulinisch geprägten Begriff „äußerer Mensch“ ein, den der griechische Text hier nicht verwendet. „Äußere Vorschriften“ gibt die auf das Leiblich-Äußerliche begrenzte Sphäre von σαρκὸς wieder, ohne eine zusätzliche anthropologische Kategorie einzuführen.'
