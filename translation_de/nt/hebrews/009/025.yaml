id: HEB.9.25
reference: Hebrews 9:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: de
  text: Er ging auch nicht hinein, um sich selbst viele Male darzubringen, wie der Hohepriester Jahr für Jahr mit Blut, das nicht sein eigenes ist, in das Heiligtum[a] hineingeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „in die heiligen Stätten“. In diesem kultischen Zusammenhang kann auch speziell das Allerheiligste gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: Er ging auch nicht hinein, um
  rationale: Die Wendung führt die verneinte Zweckaussage aus dem vorherigen Vers fort. Das im Griechischen vorausgesetzte Hineingehen wird für einen verständlichen deutschen Satz aus dem unmittelbaren Zusammenhang ergänzt.
- source_word: πολλάκις
  choice: viele Male
  rationale: Die direkte Wiedergabe hebt den Gegensatz zum jährlich wiederholten Eintritt des Hohepriesters hervor.
- source_word: προσφέρῃ ἑαυτόν
  choice: sich selbst darzubringen
  rationale: „Darbringen“ bewahrt den Opferbezug von προσφέρω; „sich selbst“ gibt die reflexive Form ausdrücklich wieder.
- source_word: ὥσπερ
  choice: wie
  rationale: Die geläufige deutsche Vergleichspartikel kennzeichnet klar den Vergleich mit dem Hohepriester.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohepriester
  rationale: Dies ist die übliche und sachlich genaue Bezeichnung des kultischen Amtes.
- source_word: εἰσέρχεται
  choice: hineingeht
  rationale: Das Präsens bleibt als Ausdruck einer regelmäßig wiederkehrenden Handlung erhalten; „hineingeht“ macht die räumliche Bewegung natürlich deutlich.
- source_word: εἰς τὰ ἅγια
  choice: in das Heiligtum
  rationale: Der griechische substantivierte Plural bezeichnet in diesem kultischen Zusammenhang den heiligen Bereich beziehungsweise das Heiligtum. Die deutsche Singularform ist idiomatisch, ohne die mögliche engere Deutung im Haupttext festzulegen.
- source_word: κατ’ ἐνιαυτὸν
  choice: Jahr für Jahr
  rationale: Die Wendung gibt den regelmäßig wiederholten jährlichen Vorgang idiomatisch und anschaulich wieder.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: mit Blut, das nicht sein eigenes ist
  rationale: Diese Formulierung wahrt den instrumentalen Sinn von ἐν und macht deutlich, dass das Blut nicht dem Hohepriester selbst gehört, ohne „fremd“ im Sinn von unbekannt oder ausländisch nahezulegen.
theological_decisions:
- issue: Bezug des Vergleichs zwischen Christus und dem levitischen Hohepriester
  choice: Christus geht nicht hinein, um sich wiederholt darzubringen; dem wird der jährlich wiederkehrende Eintritt des Hohepriesters mit nicht eigenem Blut gegenübergestellt.
  alternative: τὰ ἅγια kann enger als das Allerheiligste verstanden werden.
  rationale: Der unmittelbare Zusammenhang betont den Gegensatz zwischen der nicht wiederholten Selbstdarbringung Christi und dem wiederkehrenden kultischen Dienst des Hohepriesters. Die Übersetzung bewahrt diesen Gegensatz, ohne weitergehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz ergänzt das im griechischen Anschluss an den vorherigen Vers ausgelassene Prädikat, damit der Vers auch auf Deutsch verständlich bleibt. Kultische Begriffe wie „Hohepriester“, „darbringen“ und „Heiligtum“ werden wegen ihrer sachlichen Präzision beibehalten.
