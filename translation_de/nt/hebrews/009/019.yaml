id: HEB.9.19
reference: Hebrews 9:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: de
  text: Denn nachdem Mose dem ganzen Volk jedes Gebot gemäß dem Gesetz verkündet hatte, nahm er das Blut der Kälber[a] zusammen mit Wasser, scharlachroter Wolle und Ysop und besprengte sowohl die Schriftrolle selbst als auch das ganze Volk,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jungen Stiere“. Das griechische Wort kann im Zusammenhang mit Opfern Kälber oder junge Stiere bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Denn nachdem ... jedes Gebot ... verkündet hatte
  rationale: Der Genitivus absolutus wird als temporaler Nebensatz wiedergegeben. „Jedes Gebot“ bewahrt die distributive Kraft von πάσης; „verkündet“ gibt das öffentliche Aussprechen gegenüber dem Volk natürlich wieder.
- source_word: κατὰ τὸν νόμον
  choice: gemäß dem Gesetz
  rationale: κατά mit Akkusativ bezeichnet hier die Übereinstimmung mit dem Gesetz; „gemäß“ ist präzise, idiomatisch und würdevoll.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: Mose dem ganzen Volk
  rationale: Die deutsche Aktivkonstruktion benennt Mose als Handelnden und bewahrt das Volk als vollständigen Adressatenkreis.
- source_word: λαβὼν
  choice: nahm er
  rationale: Das Aoristpartizip wird für einen natürlichen deutschen Erzählfluss als finites Verb in zeitlicher Abfolge wiedergegeben.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: das Blut der Kälber
  rationale: μόσχος kann ein Kalb beziehungsweise junges Rind oder einen jungen Stier bezeichnen. „Kälber“ ist die direkte, nicht harmonisierende Wiedergabe; die mögliche Alternative wird in einer Fußnote genannt.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: zusammen mit Wasser, scharlachroter Wolle und Ysop
  rationale: Die Formulierung bewahrt die Begleit- beziehungsweise Instrumentalangabe und gibt alle kultischen Gegenstände klar und gegenwärtig verständlich wieder.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: sowohl die Schriftrolle selbst als auch das ganze Volk
  rationale: „Schriftrolle“ entspricht der antiken Gestalt des Bundesdokuments; „selbst“ bewahrt die Hervorhebung durch αὐτό, und „sowohl ... als auch“ gibt τε ... καί wieder.
- source_word: ἐράντισεν
  choice: besprengte
  rationale: „Besprengen“ ist die geläufige und sachlich genaue Bezeichnung für die rituelle Handlung, ohne unnötige Fachsprache.
theological_decisions:
- issue: Verhältnis zur Darstellung des Bundesrituals in 2. Mose 24
  choice: Den griechischen Wortlaut des Hebräerbriefs ohne erklärende Ergänzung oder Harmonisierung wiedergeben.
  alternative: „Junge Stiere“ wählen oder Einzelheiten aus 2. Mose 24 ergänzen.
  rationale: Die verdichtete Darstellung des Hebräerbriefs soll für sich stehen. Die lexikalische Offenheit von μόσχων wird durch eine Fußnote kenntlich gemacht, nicht durch eine harmonisierende Auslegung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aktive Satzführung vermeidet eine schwerfällige Passivkonstruktion, ohne die inhaltlichen Beziehungen zu verändern. Das abschließende Komma bleibt erhalten, weil der Vers syntaktisch in den folgenden Vers weiterführt.
