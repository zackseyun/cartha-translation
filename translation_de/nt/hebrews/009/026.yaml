  naturalness: Der Entwurf ist überwiegend würdig und verständlich. „Durch sein Opfer“ ist im modernen Standarddeutsch wesentlich natürlicher als „durch das Opfer seiner selbst“. „Bei der Vollendung der Zeitalter“ gibt συντέλεια idiomatischer und mit dem Kulminationsgedanken präziser wieder als „am Abschluss der Zeitalter“.
  terminology: „Grundlegung der Welt“, „ein für alle Mal“, „Sünde“ und „aufheben“ sind passende, registergerechte Wiedergaben. Die Fußnote zum Opfer sollte die mögliche explizierende Deutung als Alternative ausweisen, nicht die griechische Formulierung als angeblich wörtlichen Text darstellen.
