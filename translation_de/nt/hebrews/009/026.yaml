revisions:
- from: Sonst hätte er seit Grundlegung der Welt viele Male leiden müssen. Nun aber ist er ein für alle Mal am Abschluss der Zeitalter erschienen, um die Sünde durch das Opfer seiner selbst[a] aufzuheben.[b]
  to: Sonst hätte er seit Grundlegung der Welt viele Male leiden müssen. Nun aber ist er ein für alle Mal bei der Vollendung der Zeitalter erschienen, um die Sünde durch sein Opfer[a] aufzuheben.[b]
  rationale: Die Revision erhält die Aussage des Verses, seine eschatologische Sprache und den Singular „Sünde“. Sie ersetzt lediglich eine den griechischen possessiven Genitiv überinterpretierende Haupttextformulierung durch „durch sein Opfer“ und kennzeichnet die explizierende Selbstopfer-Deutung korrekt als kontextuelle Alternative. Zudem wird συντέλεια mit „Vollendung“ präziser und idiomatischer wiedergegeben.
