  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: de
  text: Sonst hätte er seit Grundlegung der Welt viele Male leiden müssen. Nun aber ist er ein für alle Mal bei der Vollendung der Zeitalter erschienen, um die Sünde durch sein Opfer[a] aufzuheben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, den Kontext explizierend: „durch das Opfer seiner selbst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu beseitigen“ beziehungsweise „außer Kraft zu setzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Sonst
  rationale: Im Zusammenhang führt ἐπεί die hypothetische Folge einer wiederholten Selbstopferung Christi ein. „Sonst“ gibt diese folgernde Funktion im Deutschen natürlich wieder.
- source_word: ἔδει αὐτὸν ... παθεῖν
  choice: hätte er ... leiden müssen
  rationale: Die irreale Formulierung gibt die im Imperfekt ausgedrückte hypothetische Notwendigkeit angemessen wieder.
- source_word: πολλάκις
  choice: viele Male
  rationale: Bewahrt den deutlichen Gegensatz zu ἅπαξ, „ein für alle Mal“.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: seit Grundlegung der Welt
  rationale: Die Wendung bezeichnet den Zeitraum von der Erschaffung der Welt an; „Grundlegung“ erhält zugleich das Bild des griechischen Ausdrucks.
- source_word: νυνὶ δὲ
  choice: Nun aber
  rationale: Markiert knapp und deutlich den Gegensatz zwischen der hypothetischen Folge und dem tatsächlichen Geschehen.
- source_word: ἅπαξ
  choice: ein für alle Mal
  rationale: Bringt im Opferkontext des Hebräerbriefs sowohl die Einmaligkeit als auch die Unwiederholbarkeit zum Ausdruck.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: am Abschluss der Zeitalter
  rationale: „Abschluss“ bewahrt den Gedanken der Vollendung, während der Plural „Zeitalter“ der griechischen Form entspricht.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: um die Sünde ... aufzuheben
  rationale: ἀθέτησις bezeichnet das Außerkraftsetzen oder Beseitigen. „Aufheben“ erhält diese starke Wirkung, ohne sie unnötig technisch festzulegen.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: durch das Opfer seiner selbst
  rationale: Die Formulierung bewahrt die mögliche und im Kontext naheliegende Bedeutung, dass Christus selbst das dargebrachte Opfer ist; eine weniger ausdrückliche Wiedergabe wird in der Fußnote genannt.
- source_word: πεφανέρωται
  choice: ist ... erschienen
  rationale: Das deutsche Perfekt gibt das vollzogene Erscheinen mit fortdauernder Bedeutung natürlich wieder.
theological_decisions:
- issue: Tragweite von ἅπαξ für das Opfer Christi
  choice: „ein für alle Mal“ als Ausdruck einer endgültigen, nicht zu wiederholenden Handlung
  alternative: „einmal“
  rationale: Der unmittelbare Gegensatz zu πολλάκις („viele Male“) sowie der Argumentationsgang des Kapitels stützen die stärkere Wiedergabe, ohne über den Text hinauszugehen.
- issue: Singular ἁμαρτίας
  choice: „die Sünde“ im Singular
  alternative: „die Sünden“
  rationale: Der griechische Singular stellt die Sünde als zusammenfassende Wirklichkeit dar. Die Übersetzung bewahrt diese theologische Weite, ohne einzelne Sünden auszuschließen.
- issue: Bedeutung von ἀθέτησις
  choice: „aufheben“
  alternative: „beseitigen“ oder „außer Kraft setzen“
  rationale: „Aufheben“ lässt die im Wort enthaltenen Aspekte des Beseitigens und Unwirksammachens offen und vermeidet eine konfessionell verengende Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng an der griechischen Argumentation, ist aber idiomatisch. „Zeitalter“, „Grundlegung“ und „Opfer seiner selbst“ bewahren zentrale Bilder und Mehrdeutigkeiten des Ausgangstextes; Fußnoten erläutern natürliche Alternativen.
