source:
  edition: SBLGNT
  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: de
  text: Denn ein Bund[a] ist im Fall von Toten[b] rechtswirksam; denn er ist niemals in Kraft, solange derjenige lebt, der ihn geschlossen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ein Testament tritt erst nach dem Tod in Kraft; solange derjenige lebt, der es aufgesetzt hat, ist es niemals wirksam.“ Das griechische Wort kann sowohl „Bund“ als auch „Testament“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Die griechische Wendung „im Fall von Toten“ ist knapp und mehrdeutig. Sie kann sich auf verstorbene Personen im testamentarischen Sinn oder auf tote Opfertiere bei der Bestätigung eines Bundes beziehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: Bund
  rationale: „Bund“ entspricht dem vorherrschenden Zusammenhang in Hebräer 8–10, lässt aber die hier mögliche testamentarische Bedeutung nicht unkenntlich; diese wird in einer Fußnote ausdrücklich wiedergegeben.
- source_word: ἐπὶ νεκροῖς
  choice: bei Toten
  rationale: Die bewusst knappe Formulierung bildet die elliptische griechische Wendung nach, ohne festzulegen, ob verstorbene Personen oder Todesfälle bei einer Bundesschließung gemeint sind.
- source_word: βεβαία
  choice: rechtskräftig
  rationale: Das Adjektiv bezeichnet hier verbindliche beziehungsweise wirksame Geltung; „rechtskräftig“ gibt diese rechtlich-bundestheoretische Nuance prägnant wieder.
- source_word: ἐπεὶ
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der vorausgehenden Aussage ein.
- source_word: μήποτε
  choice: niemals
  rationale: Im Zusammenhang mit ἰσχύει bezeichnet μήποτε, dass etwas zu keinem Zeitpunkt wirksam ist.
- source_word: ἰσχύει
  choice: ist ... in Kraft
  rationale: Die Wendung gibt die operative oder rechtliche Wirksamkeit idiomatisch wieder.
- source_word: ὅτε ζῇ
  choice: solange ... lebt
  rationale: Die Formulierung bringt den zeitlichen Gegensatz zwischen Tod und fortdauerndem Leben natürlich zum Ausdruck.
- source_word: ὁ διαθέμενος
  choice: derjenige, der ihn geschlossen hat
  rationale: Die Umschreibung passt zur Hauptübersetzung „Bund“, ohne die mögliche Bedeutung eines Testamentsverfassers grundsätzlich auszuschließen.
theological_decisions:
- issue: Ob διαθήκη in Hebräer 9,17 als „Bund“ oder als „Testament“ zu verstehen ist
  choice: Im Haupttext steht „Bund“; die testamentarische Deutung erscheint in einer Fußnote.
  alternative: „Denn ein Testament tritt erst nach dem Tod in Kraft; solange derjenige lebt, der es aufgesetzt hat, ist es niemals wirksam.“
  rationale: Der weitere Zusammenhang ist von Bund, Opfer und Blut geprägt. Zugleich lässt die Sprache in 9,16–17 eine testamentarische Lesart zu. Die Übersetzung bewahrt diese echte Spannung.
- issue: Wie weit die Mehrdeutigkeit von ἐπὶ νεκροῖς aufzulösen ist
  choice: Die knappe Wendung wird mit „bei Toten“ offen wiedergegeben.
  alternative: „nach eingetretenem Tod“, „im Fall von Verstorbenen“ oder „aufgrund von Todesfällen“
  rationale: Der griechische Ausdruck kann auf verstorbene Personen im testamentarischen Sinn oder auf Todesfälle beziehungsweise Opfertiere bei der Bestätigung eines Bundes bezogen werden. Der Haupttext legt sich nicht auf eine Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich knappe Wendung „bei Toten“ ist bewusst beibehalten, um die Mehrdeutigkeit des Ausgangstextes nicht durch eine glattere, aber stärker deutende Formulierung aufzulösen.
