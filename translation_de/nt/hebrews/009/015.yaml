  to: Und deshalb ist er der Vermittler eines neuen Bundes[a], damit die Berufenen die Verheißung des ewigen Erbes empfangen können, weil durch einen Tod Erlösung von den Übertretungen unter dem ersten Bund geschehen ist.
  rationale: Die Revision glättet allein die deutsche Satzführung beim Genitivus absolutus. Die unbestimmte Formulierung „durch einen Tod“ bewahrt die Form des griechischen θανάτου, während „geschehen ist“ den vollzogenen, begründenden Charakter des Ereignisses verständlich ausdrückt. Die Zweckrelation von ὅπως wird mit „damit … empfangen können“ klar markiert.
