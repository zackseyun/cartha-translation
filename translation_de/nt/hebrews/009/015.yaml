id: HEB.9.15
reference: Hebrews 9:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: de
  text: Und deshalb ist er der Vermittler eines neuen Bundes[a], damit die Berufenen die Verheißung des ewigen Erbes empfangen können, weil durch einen Tod Erlösung von den Übertretungen unter dem ersten Bund geschehen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Testament“. Das griechische Wort διαθήκη kann sowohl „Bund“ als auch „Testament“ bedeuten. In Hebräer 9,16–17 wird diese Bedeutungsüberschneidung aufgegriffen; hier passt wegen des Gegensatzes zum ersten Bund am besten „Bund“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Gibt den rückbezüglichen Begründungszusammenhang idiomatisch und knapp wieder.
- source_word: διαθήκης καινῆς
  choice: eines neuen Bundes
  rationale: Im unmittelbaren Zusammenhang steht der Gegensatz zum ersten Bund im Vordergrund; die ebenfalls mögliche Bedeutung „Testament“ wird in der Fußnote bewahrt.
- source_word: μεσίτης
  choice: Vermittler
  rationale: Bezeichnet präzise den, der zwischen Parteien vermittelt, und ist im modernen Standarddeutsch verständlicher als das ebenfalls mögliche „Mittler“.
- source_word: ὅπως
  choice: damit
  rationale: Bewahrt den Zweck- beziehungsweise Ergebnisbezug des griechischen Satzes.
- source_word: θανάτου γενομένου
  choice: weil ein Tod … eingetreten ist
  rationale: Gibt den Genitivus absolutus als begründenden Umstand und das vollendete Eintreten des Todes wieder, ohne den im Griechischen ungenannten Verursacher ausdrücklich einzusetzen.
- source_word: ἀπολύτρωσιν
  choice: Erlösung
  rationale: Erfasst die durch einen Preis bewirkte Befreiung im Opferzusammenhang des Hebräerbriefs.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: von den Übertretungen unter dem ersten Bund
  rationale: „Unter“ gibt den zeitlichen beziehungsweise bundesbezogenen Geltungsbereich von ἐπί mit Dativ wieder; „Übertretungen“ wahrt den Gedanken konkreter Normverletzungen.
- source_word: τὴν ἐπαγγελίαν
  choice: die Verheißung
  rationale: Behält das substantivische Singular bei und lässt die enge Beziehung zum ewigen Erbe bestehen.
- source_word: λάβωσιν
  choice: empfangen
  rationale: Natürliches deutsches Verb für den beabsichtigten Empfang der Verheißung.
- source_word: οἱ κεκλημένοι
  choice: die Berufenen
  rationale: Bewahrt knapp den durch das Perfektpassiv ausgedrückten Status der Menschen, die gerufen worden sind.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: des ewigen Erbes
  rationale: Formale und zugleich natürliche Wiedergabe des Genitivattributs; „ewig“ wahrt den Gegensatz zu den vorläufigen Ordnungen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts bei ἐστίν
  choice: „er ist“, auf Christus aus dem unmittelbaren Kontext bezogen
  alternative: Eine subjektlose oder nominale Formulierung
  rationale: Ein deutscher Hauptsatz verlangt hier ein Subjekt; der vorausgehende Kontext weist eindeutig auf Christus, ohne dass der Vers den Namen wiederholt.
- issue: Bedeutung von διαθήκη
  choice: „Bund“ im Haupttext
  alternative: „Testament“
  rationale: Der Gegensatz zwischen neuem und erstem Bund bestimmt Vers 15. Die semantische Überschneidung mit „Testament“, die in 9,16–17 wichtig wird, bleibt durch die Fußnote sichtbar.
- issue: Bestimmung des Todes in θανάτου γενομένου
  choice: „ein Tod“ ohne ausdrückliche Ergänzung „sein“
  alternative: „sein Tod“ oder „der Tod Christi“
  rationale: Der Kontext identifiziert den Tod Christi, doch der griechische Ausdruck formuliert unbestimmt. Die Übersetzung wahrt diese Form und vermeidet eine unnötige Explizierung.
- issue: Verhältnis der Verheißung zum ewigen Erbe
  choice: „die Verheißung des ewigen Erbes“
  alternative: „das verheißene ewige Erbe“
  rationale: Die Genitivkonstruktion wird erhalten, sodass nicht vorschnell entschieden wird, ob der Genitiv vor allem den Inhalt beziehungsweise Gegenstand der Verheißung bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche gliedern den langen griechischen Satz und machen den eingeschobenen begründenden Umstand lesbar, ohne die syntaktische Beziehung aufzulösen. „Vermittler“ und „die Berufenen“ sind allgemein verständlich und vermeiden konfessionell aufgeladene Zusatzdeutungen.
