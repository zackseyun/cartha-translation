source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: de
  text: Auch der erste Bund hatte Vorschriften für den Gottesdienst und ein irdisches Heiligtum[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nur: „das Erste“; gemeint ist wahrscheinlich der erste Bund. Manche verstehen die Formulierung allgemeiner als „die erste Ordnung“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ein weltliches Heiligtum“; hier ist wahrscheinlich „irdisch“ gemeint, im Gegensatz zu den himmlischen Wirklichkeiten, die später in diesem Kapitel behandelt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: hatte
  rationale: Das Imperfekt führt die Beschreibung der früheren Ordnung ein; „hatte“ gibt den einfachen Besitz- bzw. Zuordnungssinn natürlich wieder.
- source_word: μὲν οὖν
  choice: auch
  rationale: Die Partikelverbindung markiert einen Übergang mit leichter Hervorhebung. Im Deutschen gibt „auch“ die einräumende bzw. hervorhebende Kraft knapp wieder, ohne einen unnatürlichen einleitenden Diskursmarker zu erzwingen.
- source_word: ἡ πρώτη
  choice: der erste Bund
  rationale: Das feminine substantivierte Adjektiv verweist am ehesten auf den unmittelbar zuvor genannten ersten Bund (Hebräer 8,13). „Bund“ wird zur Verständlichkeit ergänzt; die Ellipse bleibt in der Fußnote kenntlich.
- source_word: δικαιώματα
  choice: Vorschriften
  rationale: Im kultischen Zusammenhang bezeichnet das Wort festgelegte Bestimmungen. „Vorschriften“ ist modernes, klares Deutsch und bewahrt den rechtlich-kultischen Sinn.
- source_word: λατρείας
  choice: für den Gottesdienst
  rationale: Der Genitiv bezeichnet Bereich oder Zweck der Vorschriften. „Gottesdienst“ gibt hier den kultischen Dienst verständlich und würdig wieder.
- source_word: τό τε ἅγιον
  choice: ein Heiligtum
  rationale: Die Wendung bezeichnet den heiligen Ort, dessen Teile in den folgenden Versen erläutert werden. „Heiligtum“ ist weit genug und legt sich nicht vorschnell auf eine einzelne Abteilung fest.
- source_word: κοσμικόν
  choice: irdisches
  rationale: Gemeint ist der Gegensatz zu den später im Kapitel behandelten himmlischen Wirklichkeiten. „Irdisch“ vermeidet die heute leicht moralisch abwertende Bedeutung von „weltlich“.
theological_decisions:
- issue: Unausgesprochenes Bezugswort von ἡ πρώτη
  choice: der erste Bund
  alternative: „die erste Ordnung“ oder „das erste Zelt“
  rationale: Der unmittelbare Zusammenhang in Hebräer 8 stellt den ersten und den neuen Bund einander gegenüber. Daher ist „Bund“ das wahrscheinlichste ergänzte Bezugswort; die echte Ellipse des Griechischen wird in der Fußnote offengelegt.
- issue: Bedeutung von κοσμικόν
  choice: irdisch
  alternative: weltlich
  rationale: Der Zusammenhang kontrastiert das Heiligtum des ersten Bundes mit himmlischen Wirklichkeiten, nicht moralische Weltlichkeit mit Geistlichkeit. „Irdisch“ wahrt diesen räumlich-heilsgeschichtlichen Gegensatz.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. „Gottesdienst“ wird kultisch verstanden; „Heiligtum“ bleibt bewusst allgemein, da die folgenden Verse dessen Bereiche näher beschreiben.
