id: HEB.9.4
reference: Hebrews 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: de
  text: mit dem goldenen Räucheraltar[a] und der Bundeslade, die ringsum mit Gold überzogen war. In ihr befanden sich ein goldener Krug mit dem Manna, der Stab Aarons, der ausgeschlagen hatte, und die Tafeln des Bundes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goldene Räucherpfanne“. Das griechische Wort kann ein Gerät zum Verbrennen von Räucherwerk oder einen Räucheraltar bezeichnen; seine Bedeutung an dieser Stelle ist umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: θυμιατήριον
  choice: Räucheraltar
  rationale: Das Wort kann ein Räuchergerät beziehungsweise eine Räucherpfanne oder einen Räucheraltar bezeichnen. Im Zusammenhang mit der Beschreibung des Heiligtums ist „Räucheraltar“ ein natürlicher kultischer Bezug; die echte lexikalische Unsicherheit wird in der Fußnote bewahrt.
- source_word: χρυσοῦν
  choice: golden
  rationale: Das Adjektiv bezeichnet etwas Goldenes beziehungsweise aus Gold Gefertigtes; „golden“ ist im Deutschen knapp und idiomatisch.
- source_word: κιβωτὸν τῆς διαθήκης
  choice: Bundeslade
  rationale: „Bundeslade“ ist die etablierte und präzise deutsche Bezeichnung für die heilige Lade des Bundes.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: ringsum mit Gold überzogen
  rationale: Die Formulierung gibt sowohl den vollendeten Zustand des Überziehens als auch πάντοθεν, die allseitige Bedeckung, natürlich wieder.
- source_word: ἐν ᾗ
  choice: In ihr befanden sich
  rationale: Das Relativpronomen bezieht sich grammatisch auf die Bundeslade; die deutsche Formulierung führt die mehreren aufgezählten Gegenstände flüssig ein.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: ein goldener Krug mit dem Manna
  rationale: στάμνος bezeichnet ein Gefäß oder einen Krug. Die knappe Wendung „mit dem Manna“ gibt ἔχουσα idiomatisch wieder.
- source_word: ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: der Stab Aarons, der ausgeschlagen hatte
  rationale: „Stab“ ist die geläufige Wiedergabe von ῥάβδος; „ausgeschlagen hatte“ bezeichnet das zurückliegende, bekannte Austreiben des Stabes.
- source_word: πλάκες τῆς διαθήκης
  choice: die Tafeln des Bundes
  rationale: „Tafeln“ und „Bund“ bilden die beiden ausdrücklich genannten Begriffe ab; „Stein“ wird nicht ergänzt, da es im Vers nicht steht.
- source_word: διαθήκη
  choice: Bund
  rationale: Im kultischen und heilsgeschichtlichen Zusammenhang bezeichnet διαθήκη den Bund, nicht ein Testament im modernen rechtlichen Sinn.
theological_decisions:
- issue: Bedeutung von θυμιατήριον in der Beschreibung des Heiligtums
  choice: Räucheraltar
  alternative: Räucherpfanne
  rationale: Die Bedeutung ist lexikalisch und aufgrund der Anordnung der Heiligtumsgeräte umstritten. Der Haupttext nennt den im Kontext naheliegenden kultischen Gegenstand, ohne die andere mögliche Bedeutung zu verschweigen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Formulierung schließt syntaktisch an den vorausgehenden Vers an. Etablierte biblische Begriffe wie „Bundeslade“, „Manna“ und „Tafeln des Bundes“ bleiben erhalten.
