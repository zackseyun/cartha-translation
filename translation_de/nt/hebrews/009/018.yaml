  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: de
  text: Daher wurde auch der erste Bund nicht ohne Blut in Kraft gesetzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die erste“. Gemeint ist der erste Bund; das Bezugswort steht im Griechischen nicht ausdrücklich da.'
    reason: Das feminine substantivierte Adjektiv ἡ πρώτη verweist im Kontext auf den ersten Bund.
lexical_decisions:
- source_word: ὅθεν
  choice: Daher
  rationale: Kennzeichnet eine Folgerung aus der vorausgehenden Erörterung über Bund, Tod und Blut; „Daher“ ist im modernen Deutsch knapp und natürlich.
- source_word: οὐδὲ
  choice: auch … nicht
  rationale: 'Gibt die einschließende und hervorhebende Verneinung idiomatisch wieder: Auch der erste Bund bildet keine Ausnahme.'
- source_word: ἡ πρώτη
  choice: der erste Bund
  rationale: Das substantivierte feminine Adjektiv verweist im Kontext auf den zuvor behandelten Bund. „Bund“ wird zur Verständlichkeit ergänzt, ohne einen neuen Gedanken einzuführen.
- source_word: χωρὶς αἵματος
  choice: nicht ohne Blut
  rationale: Bewahrt die knappe Ausdrucksweise und den kultisch-bundestheologischen Bezug des griechischen Textes.
- source_word: ἐγκεκαίνισται
  choice: wurde … in Kraft gesetzt
  rationale: Gibt das vollendete passive Einsetzen beziehungsweise feierliche Inkrafttreten wieder. Die Formulierung passt zum Bundeskontext, ohne den Ausdruck auf eine rein juristische Ratifizierung zu verengen.
theological_decisions:
- issue: Bezugswort von ἡ πρώτη („der/die erste“)
  choice: der erste Bund
  alternative: „der erste“; im Zusammenhang der vorangehenden Wortbedeutung auch „das erste Testament“
  rationale: Der Zusammenhang von Hebräer 9 und die Anspielung auf Exodus 24 sprechen hier am stärksten für den ersten Bund. Da das griechische Substantiv unausgesprochen bleibt, wird die formale Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
- issue: Bedeutungsumfang von ἐγκαινίζω
  choice: in Kraft setzen
  alternative: einweihen; feierlich einsetzen
  rationale: Der Ausdruck umfasst hier die durch Blut vollzogene Einführung des Bundes. „In Kraft setzen“ ist verständlich und kontextgerecht, während „einweihen“ im Deutschen eher einen sakralen Gegenstand oder Ort erwarten lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Folgerung und die Hervorhebung von „auch … nicht“ klar; die Fußnote dokumentiert die im Griechischen unausgesprochene Ergänzung.
