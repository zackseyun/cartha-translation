    issue: Die Fußnote bezeichnet „der erste“ als wörtliche Wiedergabe.
    rationale: Das substantivierte Adjektiv ἡ πρώτη ist feminin. Formal nah ist im Deutschen „die erste“; „der erste“ entsteht erst durch die ergänzende Wiedergabe „Bund“.
  - severity: low
    issue: Die Fußnote beruft sich auf ein vorausgehendes „Wortspiel“ und stellt „das erste Testament“ als erwägenswerte Lesart heraus.
    rationale: In diesem Vers spricht der unmittelbare Kontext klar für den ersten Bund. Die Formulierung ist interpretativ und für die hier nötige Referenzklärung nicht erforderlich.
