revisions:
- from: So wird auch der Messias, nachdem er ein einziges Mal dargebracht worden ist, um die Sünden vieler zu tragen, ein zweites Mal erscheinen – unabhängig von der Sünde[a] – denen, die ihn sehnsüchtig erwarten, zum Heil.
  to: So wird auch der Messias, nachdem er einmal dargebracht worden ist, um die Sünden vieler zu tragen, ein zweites Mal ohne Sünde[a] erscheinen, denen, die ihn sehnsüchtig erwarten, zum Heil.
  rationale: Die Revision ersetzt die semantisch verschiebende Wendung „unabhängig von der Sünde“ durch „ohne Sünde“, das die knappe Formulierung χωρὶς ἁμαρτίας wahrt, ohne ihre im Kontext naheliegende Deutung in den Haupttext einzutragen. Diese Deutung bleibt als Alternative in der Fußnote. Ferner wird ἅπαξ ohne zusätzliche Verstärkung mit „einmal“ wiedergegeben.
