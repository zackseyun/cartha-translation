  source_fidelity: 'Die Grundstruktur und die wesentlichen Bedeutungen werden zutreffend wiedergegeben: die einmalige Darbringung, das Tragen der Sünden vieler, das zweite Erscheinen und die erwartenden Adressaten. „Unabhängig von der Sünde“ gibt χωρὶς ἁμαρτίας jedoch nicht verlässlich wieder; es kann eine abstrakte Eigenständigkeit statt der knappen Beziehungsaussage des Griechischen nahelegen.'
  naturalness: Der Satz ist insgesamt modernes, gut verständliches Standarddeutsch. „Einmal“ ist für ἅπαξ angemessener als das leicht verstärkende „ein einziges Mal“. Die Stellung von „denen ... zum Heil“ nach dem Hauptverb bleibt klar und natürlich.
  terminology: „Messias“, „dargebracht“, „Sünden vieler“, „erscheinen“ und „zum Heil“ sind passend. „Ohne Sünde“ ist die knappe, im Deutschen etablierte und bewusst nicht weiter festlegende Wiedergabe von χωρὶς ἁμαρτίας; die Fußnote kann die kontextuelle Präzisierung anbieten.
