source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: de
  text: So wird auch der Messias, nachdem er einmal dargebracht worden ist, um die Sünden vieler zu tragen, ein zweites Mal ohne Sünde[a] erscheinen, denen, die ihn sehnsüchtig erwarten, zum Heil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Bezug auf Sünde“; das heißt: nicht, um wie bei seiner ersten Darbringung Sünden zu tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: So wird auch
  rationale: Bewahrt die vergleichende Folgerung aus Vers 27 und verbindet sie im Deutschen natürlich mit dem zukünftigen Hauptverb.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Χριστός ist hier als heilsgeschichtlicher Titel gebraucht; „Messias“ macht den Titelcharakter deutlich.
- source_word: ἅπαξ
  choice: ein einziges Mal
  rationale: Gibt die Einmaligkeit nachdrücklich wieder, ohne das nicht ausdrücklich vorhandene „ein für alle Mal“ einzufügen.
- source_word: προσενεχθεὶς
  choice: nachdem er ... dargebracht worden ist
  rationale: Bewahrt das Passiv des Aoristpartizips und sein zeitliches Verhältnis zum künftigen Erscheinen.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: um die Sünden vieler zu tragen
  rationale: Gibt die Zweckkonstruktion wieder und erhält die kultische sowie jesajanische Bedeutung von ἀναφέρω.
- source_word: πολλῶν
  choice: vieler
  rationale: Entspricht knapp dem Genitiv Plural und wahrt den möglichen Anklang an Jesaja 53.
- source_word: ἐκ δευτέρου
  choice: ein zweites Mal
  rationale: Ist die natürliche deutsche Wiedergabe für das zweite Auftreten im Gegensatz zur ersten Darbringung.
- source_word: χωρὶς ἁμαρτίας
  choice: unabhängig von der Sünde
  rationale: Bleibt nahe an der knappen griechischen Formulierung, klingt im Deutschen jedoch natürlicher als „getrennt von Sünde“; die kontextuelle Deutung wird in der Fußnote genannt.
- source_word: ὀφθήσεται
  choice: wird ... erscheinen
  rationale: Gibt den idiomatischen Erscheinungssinn des passiven ὁράω in diesem endzeitlichen Zusammenhang wieder.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: denen, die ihn sehnsüchtig erwarten
  rationale: „Sehnsüchtig erwarten“ erfasst die gespannte, zuversichtliche Erwartung von ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: zum Heil
  rationale: Gibt Ziel beziehungsweise Ergebnis knapp und in einem würdigen, allgemein verständlichen Register wieder.
theological_decisions:
- issue: Bedeutung von χωρὶς ἁμαρτίας beim zweiten Erscheinen
  choice: „unabhängig von der Sünde“ im Haupttext
  alternative: '„ohne Bezug auf die Sünde“, das heißt: nicht, um wie bei seiner ersten Darbringung Sünde zu tragen'
  rationale: Der Haupttext bewahrt die knappe und spannungsreiche Aussage. Die Fußnote erläutert die naheliegende kontextuelle Deutung, ohne sie in den Text selbst einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt der argumentativen Struktur des Griechischen nahe, wird aber durch Gedankenstriche lesbar gegliedert. „Messias“ wahrt den Titelcharakter; „zum Heil“ ist knapp und gehoben, ohne altertümlich zu wirken.
