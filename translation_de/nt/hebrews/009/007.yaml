  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: de
  text: In den zweiten Raum[a] aber geht nur der Hohepriester hinein, und zwar einmal im Jahr, nicht ohne Blut, das er für sich selbst und für die aus Unwissenheit begangenen Sünden des Volkes[b] darbringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das zweite Zelt“ oder „in die zweite Abteilung“; gemeint ist der innere Bereich des Zeltheiligtums.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die unbeabsichtigten Sünden des Volkes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: In den zweiten Raum aber
  rationale: Das substantivierte Femininum bezieht sich im Zusammenhang auf den zweiten, inneren Bereich des Heiligtums. „Raum“ ergänzt die griechische Ellipse natürlich; möglich wären auch „Zelt“ oder „Abteilung“.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: einmal im Jahr
  rationale: Natürliche deutsche Wiedergabe der jährlichen Häufigkeit.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: nur der Hohe Priester
  rationale: Gibt die im Griechischen betonte Ausschließlichkeit klar und idiomatisch wieder.
- source_word: οὐ χωρὶς αἵματος
  choice: nicht ohne Blut
  rationale: Bewahrt die knappe Negativform und das ausdrücklich genannte kultische Blutmotiv.
- source_word: ὃ προσφέρει
  choice: das er … darbringt
  rationale: „Darbringen“ bezeichnet im Deutschen treffend die kultische Opferhandlung und lässt das Relativpronomen eindeutig auf „Blut“ zurückverweisen.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: für sich selbst
  rationale: Natürliche Wiedergabe von ὑπέρ im stellvertretenden beziehungsweise kultischen Zusammenhang.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: für die aus Unwissenheit begangenen Sünden des Volkes
  rationale: ἀγνοήματα bezeichnet schuldhafte Verfehlungen, die aus Unwissenheit beziehungsweise unbeabsichtigt begangen wurden; die Formulierung bewahrt sowohl den moralischen als auch den kultischen Sinn.
theological_decisions:
- issue: Bedeutung von ἀγνοήματα im Opferzusammenhang
  choice: aus Unwissenheit begangene Sünden
  alternative: unbeabsichtigte Sünden; Verfehlungen aus Unwissenheit
  rationale: Die Wiedergabe bezeichnet nicht bloß fehlendes Wissen, sondern Verfehlungen, die durch Unwissenheit gekennzeichnet sind. Sie legt nicht genauer fest, wie sich Unwissenheit und Unabsichtlichkeit zueinander verhalten.
- issue: Bezugsbereich des Opfers
  choice: für sich selbst und für die … Sünden des Volkes
  alternative: für sich selbst und für die Verfehlungen des Volkes
  rationale: 'Die asymmetrische Formulierung des griechischen Textes bleibt erhalten: Für den Hohen Priester steht nur „für sich selbst“, während beim Volk die ἀγνοήματα ausdrücklich genannt werden. Eine Angleichung zu „für seine eigenen Sünden“ würde mehr sagen als der Vers.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den Kontrast zum ersten Raum, ohne unnötig archaisch zu wirken. Der Fußnotenmarker steht nach dem Satzteil, auf dessen lexikalische Alternative er sich bezieht.
