  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: de
  text: Denn wo ein Bund[a] vorliegt, muss der Tod dessen, der ihn geschlossen hat, nachgewiesen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn wo ein Testament vorliegt, muss der Tod des Erblassers nachgewiesen werden.“ Das griechische Wort diathēkē kann sowohl „Bund“ als auch „Testament“ bedeuten. Viele verstehen die Verse 16–17 hier im erbrechtlichen Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: Bund
  rationale: Im größeren Zusammenhang von Hebräer 8–10 steht der Bund im Vordergrund. Das ebenfalls mögliche „Testament“ wird in der Fußnote bewahrt.
- source_word: θάνατον
  choice: Tod
  rationale: Direkte und kontextgerechte Wiedergabe des griechischen Substantivs.
- source_word: ἀνάγκη
  choice: muss
  rationale: Natürliche deutsche Wiedergabe der ausgedrückten Notwendigkeit.
- source_word: φέρεσθαι
  choice: beigebracht werden
  rationale: Bewahrt das Bild des Herbeibringens beziehungsweise Vorbringens und passt zum möglichen rechtlichen Zusammenhang, ohne ausdrücklich „bewiesen“ oder „verursacht“ zu sagen.
- source_word: τοῦ διαθεμένου
  choice: dessen, der ihn geschlossen hat
  rationale: Gibt den substantivierten Partizipialausdruck verständlich wieder und bezieht ihn auf den im Haupttext genannten Bund, ohne ihn vorzeitig auf einen Erblasser einzuengen.
- source_word: ὅπου γὰρ
  choice: Denn wo
  rationale: Bewahrt sowohl die begründende Funktion von γάρ als auch die relative Ortsangabe.
theological_decisions:
- issue: Bedeutung von διαθήκη in Hebräer 9,16
  choice: „Bund“ im Haupttext
  alternative: „Testament“ beziehungsweise „letztwillige Verfügung“
  rationale: Der weitere Zusammenhang behandelt den Bund und seine Einsetzung durch Opferblut; zugleich erlauben die Verse 16–17 eine erbrechtliche Lesart. Haupttext und Fußnote bewahren diese Spannung.
- issue: Sinn von φέρεσθαι in Verbindung mit dem Tod
  choice: „beigebracht werden“
  alternative: „nachgewiesen werden“ oder „eintreten“
  rationale: Die gewählte Formulierung bleibt näher am Grundsinn „gebracht/vorgebracht werden“ und vermeidet eine eindeutige Festlegung darauf, ob der Tod bewiesen, eingeführt oder herbeigeführt werden muss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Beigebracht werden“ ist bewusst leicht rechtssprachlich, um die ungewöhnliche griechische Wendung und ihre mögliche juristische Färbung zu erhalten.
