    issue: „der Tod ... beigebracht werden“
    rationale: Im Deutschen bedeutet „jemandem den Tod beibringen“ normalerweise, dessen Tod zu verursachen. Dadurch wird φέρεσθαι inhaltlich verfälscht. Die Wendung muss ersetzt werden.
