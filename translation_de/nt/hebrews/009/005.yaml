source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: de
  text: Über ihr waren die Cherubim der Herrlichkeit, die den Sühndeckel[a] überschatteten. Über diese Dinge kann jetzt nicht im Einzelnen gesprochen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch »Gnadenthron«; gemeint ist der Deckel der Bundeslade, der im Versöhnungsritual mit Sühne verbunden war. Das griechische Wort kann andernorts auch »Sühnemittel« bezeichnen.
    reason: Das kontextuell konkrete Verständnis und die weitere theologische Bedeutungsbreite von ἱλαστήριον sollen beide erkennbar bleiben.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Über ihr
  rationale: Die feminine Form bezieht sich auf die zuvor genannte Bundeslade; das Pronomen bewahrt diesen Rückbezug knapp und natürlich.
- source_word: Χερουβὶν δόξης
  choice: die Cherubim der Herrlichkeit
  rationale: Die traditionelle biblische Bezeichnung und die kompakte Genitivverbindung des Griechischen bleiben erhalten, ohne δόξης vorschnell als bloßes Adjektiv auszulegen.
- source_word: κατασκιάζοντα
  choice: überschatteten
  rationale: Das Verb beschreibt die über dem Deckel ausgebreiteten Cherubim und entspricht der räumlichen Bildsprache des Ausgangstextes.
- source_word: τὸ ἱλαστήριον
  choice: den Sühndeckel
  rationale: Im konkreten Heiligtumskontext bezeichnet das Wort den Deckel der Bundeslade, an dem die sühnende Ritualhandlung vollzogen wurde. „Sühndeckel“ wahrt sowohl den Gegenstandsbezug als auch die kultisch-theologische Bedeutung.
- source_word: περὶ ὧν
  choice: Darüber
  rationale: Der knappe deutsche Rückverweis umfasst die zuvor genannten Gegenstände beziehungsweise Einzelheiten, ohne den Bezug unnötig einzuengen.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: kann jetzt nicht im Einzelnen gesprochen werden
  rationale: Die unpersönliche Form gibt die gegenwärtige Unmöglichkeit oder Unangemessenheit einer ausführlichen Erörterung wieder und bewahrt die zurückhaltende Formulierung des Griechischen.
theological_decisions:
- issue: Bedeutung von ἱλαστήριον im Zusammenhang mit der Bundeslade
  choice: Sühndeckel
  alternative: Gnadenthron; Deckel der Bundeslade; Sühnemittel
  rationale: Hier ist ein konkreter Einrichtungsgegenstand des Heiligtums gemeint, nicht unmittelbar ein Opfer. „Sühndeckel“ macht den sachlichen Referenten und seine kultische Funktion zugleich sichtbar; die traditionellen und abstrakteren Alternativen werden in der Fußnote genannt.
- issue: Zuordnung der Herrlichkeit in Χερουβὶν δόξης
  choice: Cherubim der Herrlichkeit
  alternative: herrliche Cherubim; Cherubim, die zur göttlichen Herrlichkeit gehören
  rationale: Der griechische Genitiv kann die Cherubim mit der göttlichen Herrlichkeit verbinden oder sie charakterisieren. Die formnahe Wendung lässt diese Beziehung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Terminologie. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne im Deutschen unnötig schwerfällig zu wirken.
