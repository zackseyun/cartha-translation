  text: λέγων· Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/020.yaml
  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: de
  text: 'und sagte: „Dies ist das Blut des Bundes, den Gott euch geboten hat.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das Präsenspartizip führt das Zitat ein und knüpft an den vorherigen Satz an. Im natürlichen Deutschen gibt eine finite Form diese Verbindung am klarsten wieder.
- source_word: Τοῦτο
  choice: Dies ist
  rationale: Im Griechischen fehlt die Kopula; im Deutschen wird „ist“ für die prädikative Aussage ergänzt.
- source_word: αἷμα
  choice: Blut
  rationale: Direkte Entsprechung; der konkrete Ausdruck für das bei der Bundesschließung verwendete Opferblut bleibt erhalten.
- source_word: διαθήκης
  choice: Bundes
  rationale: Der Bezug auf Exodus 24 verlangt hier „Bund“ und nicht „Testament“.
- source_word: ἧς
  choice: den
  rationale: Das Genitiv-Relativpronomen bezieht sich auf διαθήκης. Im Deutschen richtet sich das Relativpronomen syntaktisch nach dem Objekt von „auferlegen“ und steht daher im Akkusativ.
- source_word: ἐνετείλατο
  choice: auferlegt hat
  rationale: ἐντέλλομαι bezeichnet ein verbindliches Anordnen. „Auferlegt“ verbindet sich natürlich mit einem Bund und bewahrt den verpflichtenden Sinn.
- source_word: πρὸς ὑμᾶς
  choice: euch
  rationale: πρός mit Akkusativ bezeichnet hier die Adressaten bzw. Betroffenen der göttlichen Anordnung; der deutsche Dativ nach „auferlegen“ drückt dies idiomatisch aus.
- source_word: ὁ θεός
  choice: Gott
  rationale: Die übliche und sachgerechte Wiedergabe von ὁ θεός.
theological_decisions:
- issue: Wiedergabe von διαθήκη bei einer Bundesschließung
  choice: Bund
  alternative: Testament
  rationale: Der Vers greift Exodus 24,8 auf und bezeichnet den mosaischen Bund, der mit Blut in Kraft gesetzt wird. „Testament“ würde hier eine unpassende erbrechtliche Bedeutung nahelegen.
- issue: Ergänzung der unausgesprochenen Kopula nach Τοῦτο
  choice: Dies ist das Blut des Bundes
  alternative: Dies, das Blut des Bundes
  rationale: Die griechische Nominalkonstruktion setzt die Kopula voraus. Ihre Ergänzung ist im Deutschen für einen vollständigen und klaren Satz erforderlich, ohne die theologische Aussage zu erweitern.
- issue: Verbindlichkeit von ἐνετείλατο gegenüber dem Volk
  choice: den Gott euch auferlegt hat
  alternative: den Gott euch geboten hat
  rationale: „Auferlegt“ lässt den Bund selbst als Gegenstand der verbindlichen göttlichen Anordnung stehen und glättet die ungewöhnliche griechische Verbindung nicht zu einer anderen Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sagte“ stellt die Verbindung zum vorangehenden Kontext natürlich her; „auferlegt“ wahrt zugleich die ungewöhnliche, verbindliche Formulierung des griechischen Textes.
