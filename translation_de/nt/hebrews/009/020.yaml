- from: 'und sagte: „Dies ist das Blut des Bundes, den Gott euch auferlegt hat.“[a]'
  to: 'und sagte: „Dies ist das Blut des Bundes, den Gott euch geboten hat.“'
  rationale: Der Text wird nur bei der Wiedergabe von ἐνετείλατο korrigiert. „Geboten hat“ vermeidet die zusätzliche Nuance des Aufzwingens in „auferlegt hat“ und bewahrt die direkte, im Deutschen bewusst leicht formelle Aussage des Ausgangstextes. Die dadurch überholte Fußnote entfällt.
  reviewer_model: gpt-5.6-terra
