id: HEB.9.14
reference: Hebrews 9:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: de
  text: Wie viel mehr wird das Blut des Messias – der sich selbst durch den ewigen Geist Gott ohne Makel dargebracht hat – unser Gewissen von toten Werken reinigen, damit wir dem lebendigen Gott dienen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch einen ewigen Geist“. Die griechische Formulierung kann allgemeiner verstanden werden; im Haupttext wird „der ewige Geist“ als Bezeichnung für den Heiligen Geist aufgefasst.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: Wie viel mehr
  rationale: Bewahrt die rhetorische Steigerung und den Schluss vom Geringeren auf das Größere in natürlichem Deutsch.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: das Blut des Messias
  rationale: „Blut“ bewahrt die Opfersprache; Χριστός wird hier als Titel verstanden und daher mit „Messias“ wiedergegeben.
- source_word: διὰ πνεύματος αἰωνίου
  choice: durch den ewigen Geist
  rationale: Gibt διά instrumental mit „durch“ wieder und folgt der wahrscheinlichen Deutung als Bezug auf Gottes Geist, ohne die grammatisch mögliche allgemeinere Lesart zu verschweigen.
- source_word: ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ
  choice: der sich selbst Gott als makelloses Opfer dargebracht hat
  rationale: „Dargebracht“ erhält den kultisch-opferbezogenen Sinn von προσφέρω; die Ergänzung „als ... Opfer“ macht im Deutschen die Funktion von ἄμωμον natürlich deutlich, ohne einen sachfremden Gedanken einzuführen.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: wird unser Gewissen reinigen
  rationale: Bewahrt das griechische Futur und die Reinigungssprache des Zusammenhangs.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: von toten Werken
  rationale: Die wörtliche, theologisch dichte Wendung bleibt erhalten und entspricht Hebräer 6,1.
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: damit wir dem lebendigen Gott dienen
  rationale: Gibt den Zwecksinn der Konstruktion verständlich wieder; „dienen“ lässt sowohl Gottesdienst als auch umfassenderen Dienst anklingen.
theological_decisions:
- issue: Referent von πνεύματος αἰωνίου
  choice: der ewige Geist, wahrscheinlich Gottes Heiliger Geist
  alternative: ein ewiger Geist; Christi eigener ewiger Geist beziehungsweise eine geistliche Weise der Darbringung
  rationale: Die artikellose griechische Formulierung ist mehrdeutig. Im Haupttext steht die wahrscheinlichste personale Deutung; die echte Unbestimmtheit wird in einer Fußnote bewahrt.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός hat hier titularen Sinn; „Messias“ macht die Bedeutung des griechischen Titels für heutige Leser unmittelbar sichtbar.
- issue: Sinn von νεκρῶν ἔργων
  choice: tote Werke
  alternative: Werke, die zum Tod führen; wirkungslose Werke
  rationale: Der knappe griechische Ausdruck lässt mehrere inhaltliche Nuancen zu. Eine ausdeutende Festlegung wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenbogen bleibt trotz des langen Satzes klar; Gedankenstriche markieren den Relativsatz. „Makelloses Opfer“ wahrt die kultische Bildwelt, „dienen“ die Spannweite von λατρεύειν.
