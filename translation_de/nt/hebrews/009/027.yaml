id: HEB.9.27
reference: Hebrews 9:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: de
  text: Und ebenso wie den Menschen bestimmt ist, einmal zu sterben, danach aber das Gericht folgt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: ebenso wie
  rationale: Die Wendung leitet den Vergleich ein, der in Vers 28 mit οὕτως fortgeführt wird. „Ebenso wie“ macht diese Satzverknüpfung im Deutschen deutlich.
- source_word: ἀπόκειται
  choice: es ist … bestimmt
  rationale: In der Verbindung mit Dativ und Infinitiv bezeichnet das Verb hier etwas Feststehendes oder dem Menschen Bestimmtes; diese Wiedergabe ist natürlich und wahrt den passivischen Gedanken.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: ἄνθρωποι bezeichnet hier die Menschheit allgemein. „Menschen“ gibt den generischen Sinn im modernen Deutschen ohne geschlechtliche Einschränkung präzise wieder.
- source_word: ἅπαξ
  choice: einmal
  rationale: Das Adverb bezeichnet hier das einmalige Sterben. „Einmal“ ist präzise; „ein für alle Mal“ würde die Aussage an dieser Stelle unnötig verstärken.
- source_word: ἀποθανεῖν
  choice: zu sterben
  rationale: Schlichte und unmittelbare Wiedergabe des Infinitivs.
- source_word: μετὰ δὲ τοῦτο
  choice: danach aber
  rationale: Die Formulierung wahrt sowohl die zeitliche Abfolge als auch die durch δέ markierte Weiterführung beziehungsweise Gegenüberstellung.
- source_word: κρίσις
  choice: das Gericht
  rationale: κρίσις bezeichnet die gerichtliche Beurteilung, ohne hier bereits deren Ausgang festzulegen. „Gericht“ bewahrt diese Offenheit besser als „Verdammnis“.
theological_decisions:
- issue: Allgemeiner Bezug von τοῖς ἀνθρώποις
  choice: „den Menschen“ als Bezeichnung der gesamten Menschheit
  alternative: „den Männern“
  rationale: Der griechische Ausdruck ist generisch und nicht auf männliche Personen beschränkt. Das deutsche „Menschen“ gibt diesen Sinn genau und natürlich wieder.
- issue: Bedeutungsumfang von κρίσις nach dem Tod
  choice: schlicht „das Gericht“
  alternative: „die Verdammnis“ oder „das Endgericht“
  rationale: Der Vers nennt ein Gericht nach dem Tod, legt aber in dieser Aussage weder dessen Ausgang noch alle eschatologischen Einzelheiten fest.
- issue: Ergänzung eines Verbs bei κρίσις
  choice: „das Gericht folgt“
  alternative: elliptisch „danach aber das Gericht“
  rationale: Im Griechischen steht eine knappe Nominalellipse. Das ergänzte „folgt“ macht die zeitliche Aussage in natürlichem Deutsch vollständig, ohne Art oder Ausgang des Gerichts näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt als Vergleichssatz bewusst offen und endet mit Komma, da der Gedanke in Hebräer 9,28 fortgesetzt wird.
