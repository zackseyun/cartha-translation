  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: σχεδόν als „fast“, den instrumentalen Sinn von ἐν αἵματι als „mit Blut“, den normbezogenen Ausdruck κατὰ τὸν νόμον als „nach dem Gesetz“ sowie die prägnante Folgerung „ohne das Vergießen von Blut gibt es keine Vergebung“. Die Einschränkung durch σχεδόν bleibt erhalten, und ἄφεσις ist im Kontext angemessen als „Vergebung“ übersetzt.'
