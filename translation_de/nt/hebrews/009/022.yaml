id: HEB.9.22
reference: Hebrews 9:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: de
  text: Und nach dem Gesetz wird fast alles mit Blut gereinigt, und ohne das Vergießen von Blut gibt es keine Vergebung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »Erlass« oder »Freilassung« bedeuten; hier bezeichnet es die Vergebung von Sünden.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: fast
  rationale: 'Das Adverb schränkt die Aussage ausdrücklich ein: Nicht ausnahmslos jede Reinigung nach dem Gesetz erforderte Blut.'
- source_word: ἐν αἵματι
  choice: mit Blut
  rationale: ἐν hat hier instrumentalen Sinn. »Mit Blut« bezeichnet im Deutschen natürlich und präzise das rituelle Mittel der Reinigung.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet allgemein die im Zusammenhang behandelten Dinge und rituellen Bereiche; zusammen mit »fast« ergibt sich idiomatisch »fast alles«.
- source_word: καθαρίζεται
  choice: wird gereinigt
  rationale: Das Präsens Passiv beschreibt die übliche rituelle Praxis. »Gereinigt« bewahrt sowohl den kultischen als auch den allgemein verständlichen Sinn.
- source_word: κατὰ τὸν νόμον
  choice: nach dem Gesetz
  rationale: κατά bezeichnet hier die Übereinstimmung mit den Vorschriften des mosaischen Gesetzes. »Nach dem Gesetz« ist knapp und natürlich.
- source_word: χωρὶς αἱματεκχυσίας
  choice: ohne das Vergießen von Blut
  rationale: Die Wendung bezeichnet das Ausgießen beziehungsweise Vergießen von Blut und wahrt den Opferbezug, ohne ihn durch zusätzliche Auslegung enger festzulegen.
- source_word: οὐ γίνεται
  choice: gibt es keine
  rationale: In Verbindung mit dem abstrakten Substantiv ἄφεσις drückt γίνεται aus, dass Vergebung nicht zustande kommt. Die existentielle Formulierung ist im Deutschen idiomatisch.
- source_word: ἄφεσις
  choice: Vergebung
  rationale: Im unmittelbaren Opfer- und Sündenkontext bezeichnet das Wort den Erlass von Sünden. »Vergebung« ist die klare, moderne deutsche Entsprechung; die weitere Bedeutungsbreite wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von ἄφεσις im Opferkontext
  choice: Vergebung
  alternative: Erlass oder Freilassung
  rationale: Der Gedankengang des Hebräerbriefs bezieht ἄφεσις hier auf Sünden. »Vergebung« gibt diesen Sinn verständlich wieder, ohne eine bestimmte konfessionelle Sühnetheorie in den Wortlaut einzutragen.
- issue: Reichweite der Reinigungsaussage
  choice: fast alles
  alternative: alles
  rationale: Das ausdrücklich vorhandene σχεδόν muss erhalten bleiben, damit die Aussage nicht zu einer ausnahmslosen Regel verallgemeinert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die prägnante Schlussaussage bleiben erhalten; kultische Fachsprache wird nur dort verwendet, wo sie der Ausgangstext verlangt.
