  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: de
  text: Denn ein erstes Zelt wurde errichtet, in dem sich der Leuchter, der Tisch und die ausgelegten Brote[a] befanden, das das Heilige[b] genannt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Auslage der Brote“; traditionell: „Schaubrote“.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht eine Pluralform („die Heiligen“); im Zusammenhang ist der erste Raum des Zeltes gemeint, das Heilige.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ
  choice: Zelt
  rationale: Im Zusammenhang bezeichnet das Wort das Heiligtumszelt und hier insbesondere dessen ersten Raum. „Zelt“ wahrt das Bild des griechischen Ausdrucks; der Kontext macht die kultische Bedeutung deutlich.
- source_word: κατεσκευάσθη
  choice: wurde eingerichtet
  rationale: Die Form bezeichnet hier die Herstellung beziehungsweise Herrichtung des heiligen Raums samt seiner Ausstattung. „Eingerichtet“ passt zum anschließenden Verzeichnis der darin befindlichen Gegenstände.
- source_word: ἡ πρώτη
  choice: ein erstes Zelt
  rationale: Die Form ist wörtlich „das erste“. Im Kontext ist der erste Teil beziehungsweise Raum des Zeltes gemeint; „ein erstes Zelt“ bewahrt die Ausdrucksweise des Ausgangstextes und bereitet den Gegensatz zum zweiten Raum vor.
- source_word: λυχνία
  choice: Leuchter
  rationale: Gemeint ist der Träger für Öllampen im Heiligtum, nicht ein Kerzenständer.
- source_word: τράπεζα
  choice: Tisch
  rationale: Direkte und im kultischen Zusammenhang klare Wiedergabe des heiligen Tisches.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: die ausgelegten Brote
  rationale: Die Wendung bezeichnet wörtlich das Auslegen beziehungsweise die Auslage der Brote. Die konkrete Wiedergabe „die ausgelegten Brote“ ist im Deutschen natürlich und bleibt nahe am griechischen Ausdruck.
- source_word: ἥτις λέγεται Ἅγια
  choice: Dieser Raum wird das Heilige genannt
  rationale: Das Relativpronomen bezieht sich auf σκηνή. „Dieser Raum“ verdeutlicht, dass der erste Bereich des Zeltes bezeichnet wird; „das Heilige“ ist die übliche deutsche Benennung und gibt den substantivierten griechischen Plural kontextgemäß wieder.
theological_decisions:
- issue: Bezeichnung des ersten Bereichs durch Ἅγια
  choice: das Heilige
  alternative: die Heiligtümer / die heiligen Stätten
  rationale: Ἅγια ist formal Plural, bezeichnet hier aber im Gegensatz zum inneren Raum in Vers 3 den ersten Raum des Heiligtumszeltes. „Das Heilige“ wahrt diese räumliche Unterscheidung, während eine Fußnote die Form des Griechischen offenlegt.
- issue: Referenz von σκηνή
  choice: Zelt, mit Klarstellung „Dieser Raum“ im Folgesatz
  alternative: erster Raum des Zeltes
  rationale: Der griechische Text nennt σκηνή und nicht ausdrücklich einen „Raum“. Die Übersetzung bewahrt „Zelt“, macht jedoch durch den Kontext verständlich, dass dessen erster Bereich gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache. „Leuchter“ und „das Heilige“ bewahren die geläufige kultische Terminologie; „ausgelegte Brote“ vermeidet das heute wenig verständliche „Schaubrote“, das in der Fußnote genannt wird.
