    issue: „mit diesen Opfern“ ergänzt bei τούτοις ein Bezugsnomen.
    rationale: Das griechische τούτοις lautet lediglich „mit/durch diese [Dinge/Mittel]“ und steht im Neutrum; θυσίαις erscheint erst im zweiten Satzglied und ist feminin. Die Ergänzung „Opfern“ legt einen Bezug fest, den der Wortlaut nicht ausdrücklich markiert.
  - severity: low
