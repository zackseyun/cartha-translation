    rationale: Im modernen Deutsch bezeichnet „Vorbild“ meist ein nachahmenswertes Beispiel. „Muster“ oder „Darstellungen“ gibt die Bedeutung einer Entsprechung bzw. Repräsentation hier sachgerechter wieder.
