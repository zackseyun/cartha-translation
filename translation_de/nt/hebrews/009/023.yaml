revisions:
- from: Daher mussten zwar die Abbilder[a] dessen, was in den Himmeln ist, mit diesen Opfern gereinigt[b] werden, die himmlischen Dinge selbst aber mit besseren Opfern[c] als diesen.
  to: Daher mussten zwar die Abbilder[a] dessen, was in den Himmeln ist, durch diese gereinigt[b] werden, die himmlischen Dinge selbst aber durch bessere Opfer[c] als diese.
  rationale: Die Revision entfernt ausschließlich die nicht ausdrücklich im griechischen Wortlaut vorhandene Ergänzung „Opfern“ bei τούτοις und bewahrt damit den offenen demonstrativen Bezug. Zugleich bleibt der Vergleich mit den ausdrücklich pluralischen „besseren Opfern“ erhalten. Die Fußnote zu ὑποδείγματα verwendet natürlichere und semantisch passendere Alternativen.
