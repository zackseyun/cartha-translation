source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: de
  text: Daher mussten zwar die Abbilder[a] dessen, was in den Himmeln ist, durch diese gereinigt[b] werden, die himmlischen Dinge selbst aber durch bessere Opfer[c] als diese.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Muster“ oder „Darstellungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gereinigt“ im Sinn ritueller Reinigung. Das Verb gehört hier zur Sprache kultischer Reinigung.'
    reason: lexical_alternative
  - marker: c
    text: Im Griechischen steht „Opfer“ im Plural, obwohl der Hebräerbrief im Zusammenhang das ein für alle Mal dargebrachte Opfer des Messias hervorhebt.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Daher mussten
  rationale: Die unpersönliche Notwendigkeitsformel wird im Deutschen idiomatisch mit „mussten“ wiedergegeben; „Daher“ kennzeichnet den Folgerungszusammenhang mit dem Vorhergehenden.
- source_word: ὑποδείγματα
  choice: Abbilder
  rationale: „Abbilder“ bezeichnet verständlich die irdischen Entsprechungen der himmlischen Dinge und bewahrt den Gegensatz zu den himmlischen Dingen selbst.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: dessen, was in den Himmeln ist
  rationale: Die Formulierung gibt die Genitivbeziehung wieder und bewahrt den Plural οὐρανοῖς, ohne ihn mit dem späteren substantivierten Adjektiv ἐπουράνια gleichzusetzen.
- source_word: τούτοις
  choice: mit diesen Opfern
  rationale: Das Demonstrativpronomen verweist im kultischen Zusammenhang auf die zuvor genannten Opfer beziehungsweise Reinigungsmittel. Die Ergänzung „Opfern“ macht den Bezug im Deutschen verständlich.
- source_word: καθαρίζεσθαι
  choice: gereinigt werden
  rationale: „Reinigen“ ist zugänglich und bewahrt zugleich den rituell-kultischen Sinn des Verbs.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: die himmlischen Dinge selbst aber
  rationale: „Selbst“ gibt die Hervorhebung durch αὐτά wieder; „himmlische Dinge“ bleibt näher am offenen Wortlaut als die deutende Wiedergabe „himmlische Wirklichkeiten“.
- source_word: κρείττοσι θυσίαις
  choice: mit besseren Opfern
  rationale: „Besser“ entspricht einem Leitbegriff des Hebräerbriefs; der Plural „Opfern“ bewahrt ausdrücklich den griechischen Plural.
- source_word: παρὰ ταύτας
  choice: als diesen
  rationale: Nach dem Komparativ bezeichnet παρά den Vergleich. Das Pronomen verweist auf die zuvor genannten Opfer zurück.
theological_decisions:
- issue: Bezug der „himmlischen Dinge“ und ihre Reinigung
  choice: 'Die kultische Aussage bleibt unverändert stehen: Die himmlischen Dinge selbst werden mit besseren Opfern gereinigt.'
  alternative: Die Wendung ausdrücklich als himmlisches Heiligtum oder als Menschen des himmlischen Bereichs deuten beziehungsweise die Aussage durch eine Paraphrase abschwächen.
  rationale: Der griechische Text setzt die irdischen Abbilder und die himmlischen Dinge ausdrücklich einander gegenüber und verwendet für beide Reinigungssprache. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Plural „Opfer“ im Verhältnis zum einmaligen Opfer Christi
  choice: Der Plural „Opfern“ bleibt im Haupttext erhalten.
  alternative: Aus theologischer Angleichung an das einmalige Opfer Christi den Singular „Opfer“ verwenden.
  rationale: θυσίαις steht im Plural. Dieser wird nicht stillschweigend an andere Aussagen des Hebräerbriefs angeglichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwar-aber-Konstruktion bildet den griechischen μὲν-δέ-Gegensatz ab. Der ungewöhnliche Plural „in den Himmeln“ und der theologisch spannungsreiche Plural „Opfer“ wurden bewusst bewahrt.
