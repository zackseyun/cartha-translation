  verdict: revise
  source_fidelity: Die Grundstruktur, der Gegensatz μὲν–δέ, der Plural „Himmeln“, die Hervorhebung „selbst“ und der Plural „Opfer“ sind zutreffend wiedergegeben. Die Ergänzung „Opfern“ bei τούτοις ist jedoch im Ausgangstext nicht vorhanden. Da das Neutrum τούτοις sich nicht ausdrücklich auf θυσίαις beziehen kann und sein genauer Rückbezug kontextabhängig bleibt, sollte die Übersetzung diese Ergänzung nicht im Haupttext festlegen. Auch das zweite Demonstrativum ταύτας sollte als „diese“ stehen bleiben, statt die ergänzte Bezeichnung zu wiederholen.
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. „durch diese“ ist in diesem kultisch-argumentativen Kontext natürlich genug und bewahrt die im Griechischen vorhandene Verweisoffenheit. Die zwar–aber-Konstruktion ist idiomatisch und bildet den Kontrast präzise ab.
  terminology: „Abbilder“, „gereinigt“, „himmlische Dinge“ und „bessere Opfer“ sind geeignete, textnahe Wiedergaben. Die Fußnoten werden so angepasst, dass „Vorbilder“ nicht als mögliche Übersetzung für ὑποδείγματα nahegelegt wird, weil es im heutigen Deutsch gewöhnlich eine vorbildhafte Person oder ein nachzuahmendes Beispiel bezeichnet und die Relationsrichtung verzerren kann.
  issues:
