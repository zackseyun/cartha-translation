review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die Konditionalbegründung, die kultischen Gegenstände, die rituell Verunreinigten, das Heiligen und das Ziel der „Reinheit des Fleisches“ zuverlässig wieder. Die instrumentale Relativkonstruktion „mit der ... besprengt werden“ überträgt das auf die Asche bezogene aktive Partizip idiomatisch, ohne ein handelndes Subjekt hinzuzufügen; der rituelle Vorgang und seine Bezugspersonen bleiben erhalten.
  naturalness: Modernes, verständliches Standarddeutsch mit angemessen würdigem kultisch-theologischem Register. „Böcken und Stieren“, „junge Kuh“, „Verunreinigten“, „heiligen“ und „Reinheit des Fleisches“ sind im Zusammenhang klar. Der Satzanschluss und das offene Komma entsprechen der Fortsetzung des Vergleichssatzes in Vers 14.
  terminology: Die Terminologie ist konsistent und sachgerecht. „Junge Kuh“ ist für δάμαλις eine verständliche, quellentreue Wahl und fügt die in Numeri 19 vorausgesetzte Farbe nicht in den Text ein. „Fleisch“ bewahrt den ausdrücklichen Wortlaut und vermeidet die unzutreffende dogmatische Einengung auf eine „sündige Natur“.
