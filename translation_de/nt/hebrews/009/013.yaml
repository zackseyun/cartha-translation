id: HEB.9.13
reference: Hebrews 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: de
  text: Denn wenn das Blut von Böcken und Stieren und die Asche einer jungen Kuh, mit der die Verunreinigten[a][c][d] besprengt werden, zur Reinheit des Fleisches[b] heiligen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die unrein Gewordenen“; gemeint ist rituelle Unreinheit.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die äußere, körperliche Reinheit im Rahmen der Riten des alten Bundes.
    reason: cultural_note
  - marker: c
    text: Anspielung auf das Reinigungsritual mit der Asche einer Kuh in 4. Mose 19.
    reason: cross_reference
  - marker: d
    text: 'Wörtlicher kann das Griechische heißen: „die Asche einer jungen Kuh, die die Verunreinigten besprengt“.'
    reason: translation_note
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: Bewahrt sowohl den begründenden Anschluss γάρ als auch die konditionale Form εἰ; der Satz wird in Vers 14 fortgeführt.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: das Blut von Böcken und Stieren
  rationale: Gibt den kultischen Bezug wörtlich und in natürlichem Deutsch wieder; τράγοι bezeichnet männliche Ziegen.
- source_word: σποδὸς δαμάλεως
  choice: die Asche einer jungen Kuh
  rationale: δάμαλις bezeichnet ein junges weibliches Rind. Die verständliche Formulierung bewahrt den Bezug auf das Reinigungsritual aus 4. Mose 19, ohne eine im griechischen Text nicht ausdrücklich genannte Farbe einzufügen.
- source_word: ῥαντίζουσα
  choice: mit der … besprengt werden
  rationale: Das aktive Partizip stimmt grammatisch mit „Asche“ überein. Die instrumentale deutsche Relativkonstruktion vermeidet die missverständliche Vorstellung, die Asche handle selbstständig, und beschreibt denselben rituellen Vorgang natürlich.
- source_word: τοὺς κεκοινωμένους
  choice: die Verunreinigten
  rationale: κοινόω bezeichnet hier aufgrund des kultischen Zusammenhangs rituelle Verunreinigung. Die substantivierte Form bleibt knapp und lässt die Art der Verunreinigung durch den Kontext bestimmen.
- source_word: ἁγιάζει
  choice: heiligen
  rationale: Bewahrt den kultisch-theologischen Ausdruck, ohne ihn auf innere moralische Erneuerung auszudehnen. Der deutsche Plural folgt der zusammengesetzten Subjektgruppe aus Blut und Asche.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: zur Reinheit des Fleisches
  rationale: Die relativ formale Wiedergabe bewahrt den ausdrücklichen Bezug auf σάρξ und damit den Gegensatz zur Reinigung des Gewissens in Vers 14.
theological_decisions:
- issue: Bedeutung von ἁγιάζει bei den alttestamentlichen Reinigungsriten
  choice: kultisches Heiligen mit äußerer Reinigungswirkung
  alternative: umfassende innere oder moralische Heiligung
  rationale: Der Zusatz „zur Reinheit des Fleisches“ und der folgende Gegensatz zur Reinigung des Gewissens begrenzen die Aussage hier auf die kultische Sphäre.
- issue: Bedeutung von σάρξ
  choice: „Fleisch“ im körperlich-äußerlichen Sinn
  alternative: „sündige Natur“ oder eine rein metaphorische Deutung
  rationale: Der Zusammenhang handelt von ritueller Verunreinigung und äußerer Reinigung. „Fleisch“ bewahrt zugleich die Spannung zum Gewissen in Vers 14.
- issue: Agens beim Besprengen
  choice: 'instrumentale Relativkonstruktion: „mit der … besprengt werden“'
  alternative: 'wörtlich-aktive Personifikation: „die Asche, die die Verunreinigten besprengt“'
  rationale: Das griechische Partizip modifiziert „Asche“, doch der Ritus setzt handelnde Priester beziehungsweise Reine voraus. Die deutsche Form macht den Vollzug verständlich, ohne ein zusätzliches Agens zu benennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst kultischem Wortschatz („heiligen“, „Reinheit des Fleisches“). Die Relativkonstruktion ist lesbarer als eine aktive Personifikation der Asche. Das abschließende Komma zeigt, dass der in Vers 13 begonnene Bedingungssatz in Vers 14 weitergeht.
