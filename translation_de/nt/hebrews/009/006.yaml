source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: de
  text: Nachdem dies alles so eingerichtet worden ist, gehen die Priester immer wieder in die erste Abteilung des Zeltheiligtums[a] hinein und verrichten die kultischen Dienste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »in das erste Zelt«. Das griechische Wort kann das Zeltheiligtum insgesamt oder hier dessen ersten, vorderen Bereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die kultischen Verrichtungen vollziehen« beziehungsweise »die gottesdienstlichen Dienste verrichten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Nachdem dies alles so eingerichtet worden ist
  rationale: Der Genitivus absolutus beschreibt den vorausgesetzten Zustand. »Eingerichtet« passt zum zuvor geschilderten Aufbau und zur Anordnung der Gegenstände, ohne allein auf Herstellung oder Errichtung festzulegen; δέ wirkt hier nur leicht weiterführend.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: in den ersten Teil des Zeltheiligtums
  rationale: Im unmittelbaren Zusammenhang bezeichnet σκηνή den vorderen Bereich des in zwei Abteilungen beschriebenen Heiligtums. »Zeltheiligtum« bewahrt den kultischen und zeltartigen Charakter; »erster Teil« verhindert das Missverständnis, es handle sich um ein eigenständiges erstes Heiligtum.
- source_word: διὰ παντὸς
  choice: immer wieder
  rationale: Die Wendung bezeichnet den regelmäßig wiederkehrenden priesterlichen Zugang, nicht eine ununterbrochene Anwesenheit. »Immer wieder« bringt diesen gewohnheitsmäßigen Vollzug natürlich zum Ausdruck.
- source_word: εἰσίασιν
  choice: gehen ... hinein
  rationale: Das Präsens beschreibt eine wiederholte, übliche Handlung. Die deutsche Präsensform gibt diesen habituellen Sinn natürlich wieder.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Gemeint sind die Priester allgemein, im Gegensatz zum Hohen Priester in Vers 7.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: verrichten dort ihren heiligen Dienst
  rationale: Die Wortgruppe bezeichnet die vorgeschriebenen kultischen Verrichtungen. »Heiliger Dienst« wahrt den Gottesdienstbezug von λατρεία, während »verrichten« den Vollzug der Aufgaben wiedergibt; »dort« macht lediglich den räumlichen Bezug des Partizips im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von σκηνή im Heiligtumskontext
  choice: erster Teil des Zeltheiligtums
  alternative: erstes Zelt; erster Raum; erste Stiftshütte
  rationale: Hebräer 9 beschreibt ein einziges Zeltheiligtum mit zwei Bereichen. Die gewählte Fassung bewahrt den Bezug auf das mosaische Heiligtum und macht zugleich deutlich, dass hier dessen vorderer Bereich gemeint ist. Die lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
- issue: Tragweite von διὰ παντός beim Priesterdienst
  choice: immer wieder
  alternative: beständig; jederzeit; regelmäßig
  rationale: Der Gegensatz zu Vers 7 betrifft den häufigen beziehungsweise regulären Zugang der Priester zum vorderen Bereich gegenüber dem jährlichen Zugang des Hohen Priesters zum hinteren. Die Fassung vermeidet die Vorstellung einer pausenlosen Anwesenheit.
- issue: Charakter von λατρεία
  choice: heiliger Dienst
  alternative: Gottesdienste; kultische Verrichtungen; vorgeschriebene Dienste
  rationale: Der Ausdruck meint hier den kultischen Dienst im Heiligtum. »Heiliger Dienst« ist verständlich und vermeidet, den Plural vorschnell mit modernen Gemeindegottesdiensten gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt nahe am griechischen Zusammenhang, wird aber idiomatisch gestaltet. »Zeltheiligtum« ist kultisch präzise und für heutige Leser verständlicher als das fachsprachlichere »Stiftshütte«; die Fußnoten bewahren die echten lexikalischen Alternativen.
