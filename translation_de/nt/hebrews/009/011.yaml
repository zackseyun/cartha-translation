  source_fidelity: Der Entwurf gibt die SBLGNT-Lesart τῶν γενομένων ἀγαθῶν und die Erklärung οὐ ταύτης τῆς κτίσεως grundsätzlich treffend wieder. Mit „ging er“ wird jedoch ein finites Verb aus dem folgenden Vers (εἰσῆλθεν in V. 12) vorweggenommen, das im griechischen Text von V. 11 nicht steht.
  naturalness: Die vorgeschlagene Fassung ist verständlich und würdig. Die einleitende Konstruktion „Als ... kam, ging er ...“ wirkt zwar flüssig, erzeugt aber gerade durch das ergänzte Hauptverb eine nicht quellentextliche Satzstruktur. Die revidierte Fassung bleibt natürlich und lässt den versübergreifenden Satzanschluss offen.
  terminology: „Messias“, „Hohepriester“, „Zelt“, „vollkommenere“ und „nicht von Menschenhand gemacht“ sind angemessen. „Nicht zu dieser Schöpfung gehörend“ gibt den Zugehörigkeitsgedanken von οὐ ταύτης τῆς κτίσεως gut wieder. Die textkritische Fußnote soll ausdrücklich vom Lesen einzelner Handschriften sprechen.
