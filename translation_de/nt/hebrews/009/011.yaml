  variant: modern standard German
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: de
  text: 'Der Messias aber kam als Hohepriester der guten Dinge, die Wirklichkeit geworden sind,[a] durch das größere und vollkommenere Zelt, das nicht von Menschenhand gemacht ist – das heißt: nicht zu dieser Schöpfung gehörend –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: »der zukünftigen guten Dinge«.'
    reason: textual_variant
lexical_decisions:
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός wird hier als Titel gebraucht; »Messias« macht diesen Sinn im Deutschen deutlich.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden irdischen Heiligtum und dessen Priesterdienst.
- source_word: παραγενόμενος
  choice: kam
  rationale: Gibt das Partizip natürlich wieder und bezeichnet das Auftreten des Messias in seiner Rolle als Hohepriester.
- source_word: ἀρχιερεὺς
  choice: Hohepriester
  rationale: Die übliche und präzise Bezeichnung des kultischen Amtes im Hebräerbrief.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: der guten Dinge, die Wirklichkeit geworden sind
  rationale: Folgt der SBLGNT-Lesart γενομένων und bringt den Eintritt dieser Heilsgüter in die Wirklichkeit idiomatisch zum Ausdruck, ohne sie näher auszudeuten.
- source_word: διὰ τῆς ... σκηνῆς
  choice: durch das ... Zelt
  rationale: »Zelt« ist die natürliche deutsche Wiedergabe von σκηνή und bewahrt den Bezug zum heiligen Zelt. Die Formulierung wird syntaktisch mit dem in Vers 12 folgenden Eintreten verbunden.
- source_word: μείζονος
  choice: größere
  rationale: Bezeichnet hier die Überlegenheit und nicht lediglich räumliche Größe.
- source_word: τελειοτέρας
  choice: vollkommenere
  rationale: Bewahrt die für den Hebräerbrief wichtige Wortgruppe um Vollkommenheit und Vollendung.
- source_word: οὐ χειροποιήτου
  choice: nicht von Menschenhand gemacht
  rationale: Natürliches Deutsch für das biblische Gegenbild zu einem von Menschen hergestellten Heiligtum.
- source_word: τοῦτ’ ἔστιν
  choice: das heißt
  rationale: Leitet die nachfolgende Erläuterung ein.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: nicht zu dieser Schöpfung gehört
  rationale: Gibt die Zugehörigkeitsbedeutung des Genitivs klar wieder und bewahrt den Gegensatz zur gegenwärtigen Schöpfungsordnung.
theological_decisions:
- issue: Textvariante und Deutung von τῶν γενομένων ἀγαθῶν
  choice: der guten Dinge, die Wirklichkeit geworden sind
  alternative: der zukünftigen guten Dinge
  rationale: Der Haupttext folgt der vorgegebenen SBLGNT-Lesart γενομένων. Die gut bezeugte und traditionell vertraute Lesart μελλόντων bleibt in einer Fußnote sichtbar, damit die textkritische und heilsgeschichtliche Spannung nicht stillschweigend aufgelöst wird.
- issue: Syntaktischer Bezug von διὰ τῆς ... σκηνῆς
  choice: 'Beginn des mit Vers 12 fortgesetzten Hauptsatzes: »ging er durch ...«'
  alternative: Bezug auf das Kommen beziehungsweise Auftreten des Messias
  rationale: Der Zusammenhang und das in Vers 12 folgende εἰσῆλθεν sprechen dafür, die Präpositionalphrase mit dem Eintreten zu verbinden. Die versübergreifende Formulierung vermeidet den irreführenden Eindruck, der Messias sei durch das Zelt gekommen, um Hohepriester zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zelt« ist verständlicher und näher am griechischen Bild als das fachsprachliche »Stiftshütte«. Der Satz bleibt am Ende bewusst offen, weil er grammatisch in Vers 12 weitergeführt wird.
