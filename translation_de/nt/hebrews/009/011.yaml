revisions:
- from: Als aber der Messias als Hohepriester der guten Dinge kam, die Wirklichkeit geworden sind,[a] ging er durch das größere und vollkommenere Zelt, das nicht von Menschenhand gemacht ist – das heißt, nicht zu dieser Schöpfung gehört –
  to: 'Der Messias aber kam als Hohepriester der guten Dinge, die Wirklichkeit geworden sind,[a] durch das größere und vollkommenere Zelt, das nicht von Menschenhand gemacht ist – das heißt: nicht zu dieser Schöpfung gehörend –'
  rationale: Die ungesicherte Vorwegnahme von „ging er“ wird entfernt. Dadurch bleibt die Präpositionalgruppe „durch das größere und vollkommenere Zelt“ wie im Griechischen als Teil des versübergreifenden Satzgefüges stehen, ohne ein Verb aus V. 12 in V. 11 einzutragen. Die SBLGNT-Lesart γενομένων bleibt mit einer idiomatischen deutschen Wiedergabe erhalten; die abweichende Lesart μελλόντων wird transparent in der Fußnote dokumentiert.
