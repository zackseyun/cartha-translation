  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: de
  text: Und ebenso besprengte er mit dem Blut sowohl das Heiligtumszelt[a] als auch alle Geräte des Gottesdienstes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: das Zelt; hier ist das heilige Zelt gemeint, das auch „Stiftshütte“ genannt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: alle Gegenstände des Dienstes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: Heiligtumszelt
  rationale: Im Zusammenhang bezeichnet das Wort das heilige Zelt der mosaischen Gottesdienstordnung. „Heiligtumszelt“ ist verständlicher als das fachsprachliche „Stiftshütte“ und bewahrt zugleich den sakralen Bezug.
- source_word: σκεύη
  choice: Geräte
  rationale: Das Wort bezeichnet hier die beim Gottesdienst verwendeten Gegenstände beziehungsweise Ausstattungsstücke. „Geräte“ ist im Deutschen natürlich und für den kultischen Zusammenhang passend.
- source_word: λειτουργία
  choice: Gottesdienst
  rationale: Gemeint ist der priesterlich-kultische Dienst. „Gottesdienst“ gibt den sakralen Funktionszusammenhang knapp und allgemein verständlich wieder; „Dienst“ bleibt als nähere Alternative möglich.
- source_word: αἷμα
  choice: Blut
  rationale: Der Ausdruck verweist wörtlich auf das Opferblut; eine Umschreibung ist nicht erforderlich.
- source_word: ὁμοίως
  choice: ebenso
  rationale: Das Wort verbindet die Handlung mit der zuvor erwähnten Besprengung und wahrt die vergleichende Kraft.
- source_word: ἐράντισεν
  choice: besprengte
  rationale: „Besprengen“ ist die etablierte und klare deutsche Bezeichnung für das rituelle Aufbringen von Blut.
- source_word: δὲ
  choice: Und
  rationale: Die Partikel verbindet hier leicht weiterführend und nicht gegensätzlich; „Und“ entspricht diesem Zusammenhang natürlich.
- source_word: καὶ … καὶ
  choice: sowohl … als auch
  rationale: Die korrelative Wiedergabe bildet die griechische Paarung ab und betont, dass das Heiligtumszelt wie auch sämtliche Geräte einbezogen waren.
theological_decisions:
- issue: Verhältnis zur mosaischen Ritualüberlieferung im 2. Buch Mose
  choice: Die Aussage wird als knappe Zusammenfassung der Besprengung des Heiligtumszelts und seiner kultischen Geräte durch Mose übersetzt, ohne zusätzliche Harmonisierung.
  alternative: Den Wortlaut durch historische Erläuterungen ergänzen oder vermeintliche Unterschiede zu den Berichten im 2. Buch Mose im Haupttext ausgleichen.
  rationale: Der griechische Text selbst bietet eine zusammenfassende Aussage. Die Übersetzung soll intertextuelle Fragen und mögliche Spannungen nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heiligtumszelt“ vermeidet das heute erklärungsbedürftige „Stiftshütte“, ohne den kultischen Bezug zu verlieren. Die Satzstellung folgt der griechischen Hervorhebung von „mit dem Blut“, während „sowohl … als auch“ die korrelative Struktur deutlich macht.
