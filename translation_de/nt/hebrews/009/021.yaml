  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Geräte des Gottesdienstes“ ist idiomatischer und semantisch enger als „Geräte für den Gottesdienst“; Letzteres kann bloß eine Zweckbestimmung ausdrücken, während der griechische Genitiv die Geräte der kultischen Diensthandlung bezeichnet.
