- from: Und ebenso besprengte er mit dem Blut sowohl das Heiligtumszelt[a] als auch alle Geräte für den Gottesdienst[b].
  to: Und ebenso besprengte er mit dem Blut sowohl das Heiligtumszelt[a] als auch alle Geräte des Gottesdienstes[b].
  rationale: Die Übersetzung wird nur bei der Genitivverbindung zu λειτουργία präzisiert. Die Änderung von „für den Gottesdienst“ zu „des Gottesdienstes“ gibt die Zugehörigkeit der Geräte zum kultischen Dienst genauer und natürlicher wieder. Die übrige Formulierung bewahrt Wortlaut, Satzstruktur und die knappe, nicht harmonisierende Aussage des griechischen Textes.
