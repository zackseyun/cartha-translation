  source_fidelity: Die räumliche Wiedergabe „Hinter dem zweiten Vorhang“ trifft μετὰ ... τὸ δεύτερον καταπέτασμα gut. „Allerheiligste“ gibt Ἅγια Ἁγίων angemessen wieder. Jedoch ist die Vergangenheitsform „genannt wurde“ gegenüber dem gegenwärtigen λεγομένη weniger genau; zudem ist „Zeltbereich“ keine naheliegende Wiedergabe von σκηνή und klingt im Deutschen technisch sowie unnötig paraphrasierend.
  naturalness: „Hinter dem zweiten Vorhang lag das Zelt, das Allerheiligstes genannt wird“ ist verständliches, würdevolles Standarddeutsch. Die Bezeichnung „Zelt“ bewahrt dabei die im griechischen Text verwendete Terminologie; der Kontext erläutert, dass damit die innere Abteilung gemeint ist.
  terminology: „Vorhang“, „Zelt“ und „Allerheiligstes“ sind für den Kultzusammenhang passend. Die Fußnote sollte die traditionelle und nahe am griechischen Ausdruck liegende Alternative „das Heilige der Heiligen“ nennen.
  issues:
