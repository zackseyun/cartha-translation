    issue: „Zeltbereich“ ist eine interpretierende und stilistisch unübliche Umschreibung von σκηνή.
    rationale: σκηνή bedeutet „Zelt“ bzw. „Stiftshütte/Tabernakel“. Obwohl der Kontext eine Abteilung des Heiligtums beschreibt, bezeichnet der griechische Wortlaut sie als σκηνή. „Zelt“ erhält diese Terminologie ohne eine zusätzliche Auslegung.
  - severity: low
    issue: „genannt wurde“ verschiebt λεγομένη in die Vergangenheit.
    rationale: Das attributive Präsenspartizip bedeutet hier „das genannt wird“ beziehungsweise „das man ... nennt“. Die Gegenwartsform ist genauer und im Deutschen natürlich.
  - severity: low
    issue: 'Die Fußnote „Wörtlicher: das Heilige der Heiligen“ ist als reine Wörtlichkeitsangabe etwas zu eng formuliert.'
    rationale: Die Wendung ist eine semitisch geprägte Superlativkonstruktion; „das Heilige der Heiligen“ ist vor allem die traditionelle alternative Bezeichnung. Die Fußnote sollte dies transparent benennen.
