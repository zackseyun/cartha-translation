lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: Hinter dem zweiten Vorhang
  rationale: μετά mit Akkusativ bezeichnet hier im räumlichen Zusammenhang des Heiligtums die Lage hinter beziehungsweise jenseits des inneren Vorhangs. „Hinter“ ist im modernen Deutschen klar und natürlich.
- source_word: δὲ
  choice: aber
  rationale: δέ führt die Beschreibung mit einer leichten Abgrenzung zum zuvor genannten vorderen Bereich fort. Das nachgestellte „aber“ gibt diesen milden Übergang wieder, ohne einen starken Gegensatz zu erzeugen.
- source_word: σκηνὴ
  choice: Zeltbereich
  rationale: σκηνή bezeichnet hier den hinter dem zweiten Vorhang liegenden Teil des Zeltheiligtums. „Zeltbereich“ bewahrt das Bild des Zeltes und vermeidet zugleich den missverständlichen Eindruck, hinter dem Vorhang habe ein eigenständiges zweites Zelt gestanden.
- source_word: ἡ λεγομένη
  choice: der ... genannt wurde
  rationale: Die attributive Partizipialkonstruktion wird im Deutschen natürlich als Relativsatz wiedergegeben.
- source_word: Ἅγια Ἁγίων
  choice: das Allerheiligste
  rationale: Die griechische superlativische Wendung bedeutet wörtlich „Heiliges der Heiligen“. „Das Allerheiligste“ ist die verständliche und im Deutschen fest etablierte Bezeichnung für den innersten Heiligtumsbereich.
theological_decisions:
- issue: Wiedergabe der Heiligtumsbezeichnung Ἅγια Ἁγίων
  choice: das Allerheiligste
  alternative: das Heilige der Heiligen
  rationale: „Das Allerheiligste“ vermittelt die Funktion der semitisch geprägten Superlativform in natürlichem modernem Deutsch. Die wörtlichere traditionelle Struktur wird in der Fußnote offengelegt, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Referenz von σκηνή innerhalb des Zeltheiligtums
  choice: Zeltbereich
  alternative: Zelt; Raum
  rationale: Der Text nennt den Bereich σκηνή, obwohl im unmittelbaren Zusammenhang die Abteilungen des Zeltheiligtums beschrieben werden. „Zeltbereich“ wahrt sowohl den lexikalischen Bezug zum Zelt als auch den räumlichen Zusammenhang und legt keine eigenständige zweite Konstruktion nahe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit nachgestelltem „aber“ lässt den beschreibenden Anschluss erkennen. „Zeltbereich“ dient der Klarheit im unmittelbaren Kontext und bewahrt zugleich die Bildwelt des griechischen σκηνή.
