  source_fidelity: 'Der Entwurf gibt den Satzbau und die zentralen Aussagen des Griechischen im Wesentlichen zuverlässig wieder: der Messias tritt nicht in ein handgemachtes Heiligtum, sondern in den Himmel selbst, um jetzt vor Gott für uns zu erscheinen. Der deutsche Singular „Heiligtum“ ist für das im Hebräerbrief kultisch verwendete pluralische ἅγια vertretbar. Allerdings verfehlt „ein Abbild des wahren“ den Plural und die substantivische Bedeutung von τῶν ἀληθινῶν.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. „Von Menschenhand geschaffen“, „den Himmel selbst“ und „vor dem Angesicht Gottes“ sind idiomatisch und dem Register angemessen. „Abbild der wahren Wirklichkeiten“ ist zwar bewusst gehoben, macht aber den Kontrast zu den himmlischen Realitäten klarer und ist grammatisch korrekt.
  terminology: „der Messias“ wahrt den aktiven Titelsinn von Χριστός und stimmt mit dem englischen POB-Audit-Trail überein. „Heiligtum“ ist als kollektive kultische Bezeichnung zulässig. „Abbild“ gibt ἀντίτυπον angemessen wieder, sofern der Bezug auf die pluralischen „wahren Wirklichkeiten“ ausdrücklich bleibt. „Für uns“ bewahrt die offene repräsentative Bedeutung von ὑπὲρ ἡμῶν.
