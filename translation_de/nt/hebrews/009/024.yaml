    rationale: Die Anmerkung erklärt zwei getrennte Ausdrücke im Schlussteil. Getrennte Marker unmittelbar bei „Angesicht Gottes“ und „für uns“ sind für Leserinnen und Leser klarer und erfüllen die Ankerfunktion besser.
