id: HEB.9.24
reference: Hebrews 9:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: de
  text: Denn der Messias ging nicht in ein von Menschenhand geschaffenes Heiligtum hinein, das ein Abbild der wahren Wirklichkeiten ist, sondern in den Himmel selbst, um nun vor dem Angesicht Gottes[a] für uns[b] zu erscheinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dem Angesicht Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: „Für uns“ kann hier auch „uns zugute“ oder „in unserem Interesse“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: der Messias
  rationale: Gibt den hier wirksamen Titelsinn wieder und entspricht dem kultisch-heilsgeschichtlichen Zusammenhang.
- source_word: χειροποίητα ἅγια
  choice: ein von Menschenhand geschaffenes Heiligtum
  rationale: Das substantivierte Neutrum Plural ἅγια bezeichnet im Hebräerbrief häufig das Heiligtum als heiligen Bereich; der natürliche deutsche Singular wahrt den kultischen Sinn, ohne eine bestimmte Kammer festzulegen.
- source_word: ἀντίτυπα τῶν ἀληθινῶν
  choice: ein Abbild des wahren
  rationale: ἀντίτυπα bezeichnet etwas Entsprechendes beziehungsweise Darstellendes; die Formulierung erhält den Kontrast zwischen dem irdischen Heiligtum und der eigentlichen himmlischen Wirklichkeit.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: den Himmel selbst
  rationale: „selbst“ bildet die verstärkende griechische Konstruktion ab.
- source_word: ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ
  choice: vor dem Angesicht Gottes zu erscheinen
  rationale: Bewahrt das konkrete Bild von Gottes Angesicht und ist zugleich würdiges, verständliches Deutsch.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Drückt im priesterlichen Kontext das stellvertretende beziehungsweise zugunsten von uns erfolgende Handeln aus, ohne eine engere Sühnetheorie einzutragen.
theological_decisions:
- issue: Numerus und Referenz von ἅγια
  choice: „Heiligtum“ im Singular als kollektive Bezeichnung
  alternative: „heilige Stätten“ oder „die heiligen Räume“
  rationale: Obwohl die griechische Form pluralisch ist, dient ἅγια in diesem Kontext als kultische Bezeichnung des Heiligtums. Der deutsche Singular ist natürlich und lässt offen, welcher Bereich gemeint ist.
- issue: Bedeutung von ἀντίτυπα
  choice: „Abbild“
  alternative: „Entsprechung“, „Darstellung“ oder „Gegenbild“
  rationale: „Abbild“ macht die Beziehung zur wahren himmlischen Wirklichkeit verständlich, ohne die irdische Einrichtung als unwahr oder wertlos darzustellen.
- issue: Titel Χριστός
  choice: „der Messias“
  alternative: „Christus“
  rationale: Der Titelsinn bleibt im Zusammenhang von priesterlichem Eintritt und Erfüllung erkennbar.
- issue: Vermittelnde Bedeutung von ὑπὲρ ἡμῶν
  choice: „für uns“
  alternative: „uns zugute“ oder „für uns eintretend“
  rationale: Die knappe Formulierung wahrt die offene repräsentative und priesterliche Bedeutung des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von Menschenhand geschaffen“ erhält den biblischen Kontrast zur himmlischen Wirklichkeit; „Heiligtum“ vermeidet die im Deutschen schwerfällige wörtliche Pluralform. Der Fußnotenmarker steht unmittelbar nach dem gesamten Vers, da die Anmerkung zwei Wendungen im Schlussteil erläutert.
