source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: de
  text: Durch Glauben empfing auch Sara selbst Kraft, ein Kind zu empfangen, obwohl sie über das gebärfähige Alter hinaus war; denn sie hielt den, der die Verheißung gegeben hatte, für treu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet das Mittel und entspricht der wiederkehrenden Formel in Hebräer 11.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: selbst Sara
  rationale: καί und das intensive Pronomen heben Sara als weiteres, bemerkenswertes Glaubensbeispiel hervor; die deutsche Stellung gibt diese Betonung natürlich wieder.
- source_word: δύναμιν ... ἔλαβεν
  choice: empfing ... Kraft
  rationale: Die Formulierung bewahrt die lexikalische Bedeutung von δύναμις und klingt zugleich würdig und verständlich.
- source_word: εἰς καταβολὴν σπέρματος
  choice: Nachkommen zu empfangen
  rationale: Die griechische Wendung ist ungewöhnlich und wörtlich schwer verständlich. Bei Sara als grammatischem Subjekt bezeichnet sie im Zusammenhang die Befähigung, ein Kind zu empfangen; die wörtlichere Form wird in der Fußnote bewahrt.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: und das noch über die dafür vorgesehene Lebenszeit hinaus
  rationale: παρά mit Akkusativ bezeichnet hier das Überschreiten der normalen zeitlichen Grenze; die Wiedergabe bleibt nah am Wortlaut, ohne ausdrücklich »gebärfähiges Alter« einzutragen.
- source_word: ἐπεὶ
  choice: denn
  rationale: Leitet die Begründung ein und fügt sich im Deutschen natürlich an den vorangehenden Hauptsatz an.
- source_word: πιστὸν
  choice: treu
  rationale: Bewahrt sowohl die Bedeutung der Zuverlässigkeit als auch die theologische Resonanz des Wortes.
- source_word: ἡγήσατο
  choice: hielt ... für
  rationale: Gibt das wertende Urteil von ἡγέομαι idiomatisch und präzise wieder.
- source_word: τὸν ἐπαγγειλάμενον
  choice: den, der die Verheißung gegeben hatte
  rationale: Die substantivierte Partizipialform wird klar wiedergegeben; »Verheißung« erhält den biblisch-theologischen Gehalt von ἐπαγγέλλομαι.
theological_decisions:
- issue: Subjekt und Sinn der syntaktisch schwierigen Aussage über Sara
  choice: 'Sara ist das Subjekt: Sie empfing Kraft, Nachkommen zu empfangen.'
  alternative: Abraham ist unausgesprochen beteiligt oder vorrangig; oder Sara empfing Kraft zur Begründung einer Nachkommenschaft.
  rationale: In der vorliegenden Textform weist αὐτῇ Σάρρᾳ am natürlichsten auf Sara als Subjekt von ἔλαβεν. Die ungewöhnliche, möglicherweise männlich konnotierte Wendung καταβολὴ σπέρματος wird nicht glattgebügelt, sondern in einer Fußnote sichtbar gemacht.
- issue: Wiedergabe von πιστός in Bezug auf Gott
  choice: treu
  alternative: zuverlässig; vertrauenswürdig
  rationale: »Treu« bringt Gottes verlässlichen Charakter zum Ausdruck und bewahrt das theologische Gewicht, ohne zusätzliche Lehraussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem argumentativen Gang des Griechischen; die ungewöhnliche Zeugungsformel wird im Haupttext verständlich wiedergegeben und in der Fußnote formal offengelegt.
