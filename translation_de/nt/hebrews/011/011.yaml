review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur, Sara als hervorgehobenes Subjekt, den Empfang von δύναμις und die Begründung durch Gottes Treue grundsätzlich richtig wieder. »Nachkommen zu empfangen« ist jedoch im Deutschen semantisch missverständlich: Es kann bedeuten, Nachkommen als bereits vorhandene Personen zu erhalten, nicht schwanger zu werden bzw. ein Kind zu empfangen. Die Altersangabe »dafür vorgesehene Lebenszeit« ist zudem keine natürliche und präzise Wiedergabe von καιρὸς ἡλικίας.'
  naturalness: Der Entwurf ist insgesamt würdig, aber »Nachkommen zu empfangen« und besonders »über die dafür vorgesehene Lebenszeit hinaus« klingen unidiomatisch. »Ein Kind zu empfangen« und »über das gebärfähige Alter hinaus« sind im modernen Standarddeutsch klar und kontextgerecht.
  terminology: »Glauben«, »Kraft«, »Verheißung« und »treu« sind angemessen. Die Fußnote soll die auffällige griechische Formulierung weiterhin kenntlich machen, ohne den deutschen Haupttext zu verunklären.
  issues:
  - severity: medium
    issue: »Nachkommen zu empfangen«
    rationale: Die Formulierung gibt die gemeinte Empfängnisfähigkeit nicht eindeutig wieder und kann im Deutschen das Erhalten von Nachkommen bedeuten. »Ein Kind zu empfangen« stellt den im Kontext gemeinten Vorgang natürlich und genau dar.
  - severity: medium
    issue: »über die dafür vorgesehene Lebenszeit hinaus«
    rationale: Diese Formulierung ist im Deutschen unnatürlich und verschleiert den Bezug von ἡλικία auf das Alter bzw. die Lebensphase. Das gebärfähige Alter ist hier durch die Aussage über die Empfängnisfähigkeit und Saras Kontext hinreichend bestimmt.
  revised_text: Durch Glauben empfing auch Sara selbst Kraft, ein Kind zu empfangen, obwohl sie über das gebärfähige Alter hinaus war; denn sie hielt den, der die Verheißung gegeben hatte, für treu.
