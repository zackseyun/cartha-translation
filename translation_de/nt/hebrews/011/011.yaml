  to: Durch Glauben empfing auch Sara selbst Kraft, ein Kind zu empfangen, obwohl sie über das gebärfähige Alter hinaus war; denn sie hielt den, der die Verheißung gegeben hatte, für treu.
  rationale: Die Revision beseitigt die deutsche Mehrdeutigkeit von »Nachkommen empfangen« und ersetzt die unidiomatische Umschreibung der Altersgrenze durch eine im Kontext präzise, moderne Formulierung. Die Fußnote bewahrt die ungewöhnliche griechische Ausdrucksweise und damit die verbleibende idiomatische Schwierigkeit.
