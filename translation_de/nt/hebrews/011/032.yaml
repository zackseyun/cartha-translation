id: HEB.11.32
reference: Hebrews 11:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: de
  text: Und was soll ich noch sagen? Denn die Zeit würde mir fehlen, wollte ich von Gideon, Barak, Simson, Jiftach, David sowie von Samuel und den Propheten erzählen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Und was soll ich noch sagen?
  rationale: Die rhetorische Frage wird in natürlichem, gegenwärtigem Deutsch wiedergegeben und behält ihren vorwärtsdrängenden Charakter.
- source_word: ἐπιλείψει με γὰρ … ὁ χρόνος
  choice: Die Zeit würde mir fehlen
  rationale: Das griechische Futur bezeichnet hier im rhetorisch vorgestellten Fall die nicht ausreichende Zeit. Der deutsche Konjunktiv II gibt diesen Sinn idiomatisch wieder.
- source_word: διηγούμενον
  choice: wollte ich … erzählen
  rationale: Das präsentische Partizip beschreibt den begleitenden beziehungsweise gedachten Vorgang. Die deutsche Konstruktion bewahrt den hypothetischen Sinn, ohne ihn unnötig auszudeuten.
- source_word: περὶ
  choice: von
  rationale: Nach „erzählen“ ist „von“ die natürliche deutsche Entsprechung für die Angabe des Erzählgegenstands.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gideon, Barak, Simson, Jiftach, David, Samuel
  rationale: Die Eigennamen folgen den im Deutschen etablierten biblischen Namensformen.
- source_word: τε καὶ
  choice: sowie
  rationale: „Sowie“ bewahrt die leicht additive Verknüpfung von David mit Samuel, ohne eine stärkere sachliche Gruppierung zu behaupten.
- source_word: τῶν προφητῶν
  choice: den Propheten
  rationale: Der bestimmte Plural bezeichnet die prophetischen Gestalten als Gruppe und wird im Deutschen entsprechend wiedergegeben.
theological_decisions:
- issue: Rhetorische Aussage über die begrenzte Zeit
  choice: 'Die Aussage wird als hypothetisch-rhetorische Begründung formuliert: „Die Zeit würde mir fehlen, wollte ich … erzählen.“'
  alternative: 'Wörtlicher: „Denn die Zeit wird mich beim Erzählen verlassen.“'
  rationale: So bleibt die Aussage eine Ankündigung bewusster Kürze und wird nicht als absolute Behauptung verstanden, der Verfasser habe überhaupt keine Zeit.
- issue: Verknüpfung der letzten Namen
  choice: „David sowie von Samuel und den Propheten“
  alternative: „David und Samuel und den Propheten“
  rationale: Die Wiedergabe lässt Samuel neben der umfassenderen Gruppe der Propheten stehen und bildet zugleich die additive Kraft von τε καὶ ab, ohne seine Einordnung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Bewegung und die Aufzählung bleiben erhalten; „wollte ich“ ist gehoben, aber allgemein verständlich.
