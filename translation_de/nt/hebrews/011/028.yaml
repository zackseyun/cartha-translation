- from: Durch Glauben hat er das Passafest gehalten und das Blut anbringen lassen[a], damit der Verderber die Erstgeborenen nicht antastete.
  to: Durch Glauben hat er das Passafest gehalten und das Blut aufgetragen[a], damit der Verderber ihre Erstgeborenen nicht antastete.
  rationale: Die Revision stellt die im griechischen αὐτῶν enthaltene Possessivbeziehung ausdrücklich wieder her und ersetzt die kausative Formulierung durch eine nichtkausative Wiedergabe. Sie bewahrt dabei die im Passakontext naheliegende, aber nicht technisch festgelegte Bedeutung der rituellen Blutapplikation.
