review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die Glaubensformel, den Passa-Bezug, den Zweck und „der Verderber“ im Wesentlichen. Korrigiert werden muss jedoch die Auslassung von αὐτῶν: Gemeint sind „ihre Erstgeborenen“, nicht lediglich „die Erstgeborenen“. Zudem ist „anbringen lassen“ unnötig kausativ und kann Mose als Veranlasser statt als Handelnden erscheinen lassen.'
  naturalness: „Durch Glauben“ und „hat er das Passafest gehalten“ sind verständliches, würdiges modernes Standarddeutsch. „Das Blut aufgetragen“ ist gegenüber dem kausativen „anbringen lassen“ unmittelbar und idiomatisch. Die finale Wendung mit „antastete“ wahrt die zurückhaltende Grundbedeutung von θίγῃ.
  terminology: „Passafest“, „Verderber“ und „Erstgeborene“ sind angemessen. „Auftragen des Blutes“ gibt πρόσχυσις als rituelle Blutapplikation wieder, ohne eine bestimmte Technik festzulegen; die traditionelle Alternative „besprengen“ bleibt als Fußnote erhalten.
  issues:
  - severity: medium
    issue: αὐτῶν ist in der Übersetzung nicht wiedergegeben.
    rationale: Das Genitivpronomen bezieht sich auf τὰ πρωτότοκα und bedeutet „ihre Erstgeborenen“. Die bloße Formulierung „die Erstgeborenen“ lässt dieses Besitzverhältnis aus.
  - severity: low
    issue: „das Blut anbringen lassen“ ist kausativ.
    rationale: Die griechische Koordination bezeichnet Mose als denjenigen, der das Passa vollzog und die Blutapplikation vornahm. „Lassen“ fügt eine mögliche Veranlassungsnuance hinzu, die der Text nicht ausdrückt.
  revised_text: Durch Glauben hat er das Passafest gehalten und das Blut aufgetragen[a], damit der Verderber ihre Erstgeborenen nicht antastete.
