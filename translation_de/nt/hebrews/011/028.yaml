  variant: modern standard German
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: de
  text: Durch Glauben hat er das Passafest gehalten und das Blut aufgetragen[a], damit der Verderber ihre Erstgeborenen nicht antastete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Blut besprengt“. Der griechische Ausdruck bezeichnet das rituelle Auftragen von Blut; „besprengen“ ist die traditionelle kultische Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet hier das Mittel. „Durch Glauben“ bewahrt zudem die wiederkehrende Formel in Hebräer 11.
- source_word: πεποίηκεν τὸ πάσχα
  choice: hat er das Passafest gehalten
  rationale: ποιέω bezeichnet in diesem Zusammenhang das Vollziehen bzw. Halten des Passas. Das deutsche Perfekt gibt die abgeschlossene Handlung natürlich wieder; „Passafest“ lässt den Umfang der Feier offen.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: das Blut anbringen lassen
  rationale: πρόσχυσις bezeichnet die rituelle Applikation des Blutes. Im Passakontext wurde es an Türpfosten und Türsturz gestrichen; „anbringen“ ist daher sachlich genauer als das traditionelle „Besprengen“. Die substantivische griechische Wendung wird im Deutschen natürlich verbal wiedergegeben.
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: Gibt den Zweck der Handlung knapp und idiomatisch wieder.
- source_word: ὁ ὀλοθρεύων
  choice: der Verderber
  rationale: Das substantivierte Partizip bezeichnet den, der vernichtet. „Engel“ wird nicht ergänzt, da es im griechischen Text nicht steht.
- source_word: τὰ πρωτότοκα
  choice: die Erstgeborenen
  rationale: Bewahrt die substantivierte, in Geschlecht und Alter nicht näher eingegrenzte Form des griechischen Ausdrucks.
- source_word: θίγῃ αὐτῶν
  choice: sie nicht antastete
  rationale: „Antasten“ bewahrt die Grundbedeutung von θιγγάνω und lässt zugleich im Kontext die tödliche Folge erkennen. Das Pronomen bleibt wie im Griechischen ohne erklärende Ergänzung.
theological_decisions:
- issue: Unausgesprochenes Subjekt von πεποίηκεν
  choice: „er“, im Kontext Mose
  alternative: „Mose“ ausdrücklich einsetzen
  rationale: Der Zusammenhang identifiziert Mose eindeutig, doch die Übersetzung bewahrt das Pronomen des griechischen Textes.
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Vertrauen oder Treue
  rationale: Das Leitthema von Hebräer 11 ist der Glaube; „Treue“ wäre hier weniger wahrscheinlich und würde die Kapitelstruktur verdunkeln.
- issue: Art der Blutapplikation
  choice: anbringen lassen
  alternative: besprengen lassen
  rationale: 2. Mose 12 beschreibt das Anbringen des Blutes an Türpfosten und Türsturz. Die Übersetzung vermeidet es, eine bestimmte Auftragungstechnik festzulegen, während die traditionelle kultische Wiedergabe in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende Glaubensformel bleibt erkennbar; kultische Fachsprache wird nur dort verwendet, wo sie verständlich und sachlich angemessen ist.
