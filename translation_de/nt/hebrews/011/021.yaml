  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: de
  text: Durch Glauben segnete Jakob, als er im Sterben lag, jeden der Söhne Josefs und betete an, auf das obere Ende seines Stabes gestützt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem hebräischen Text von 1. Mose 47,31 auch: „und beugte sich in Anbetung über das Kopfende seines Bettes“. Der griechische Text hier lautet „Stab“.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „und betete an auf das obere Ende seines Stabes“. Die Wendung beschreibt wahrscheinlich Jakobs Körperhaltung, nicht den Gegenstand seiner Anbetung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet hier Mittel oder Art und Weise. In Hebräer 11 ist „durch Glauben“ die natürliche und kontextgemäße Wiedergabe.
- source_word: ἀποθνῄσκων
  choice: als er im Sterben lag
  rationale: Das Präsenspartizip bezeichnet einen gleichzeitig andauernden Vorgang und wird so in natürlichem Deutsch temporal wiedergegeben.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσήφ
  choice: jeden der Söhne Josefs
  rationale: 'Die Formulierung bewahrt die distributive Aussage: Jeder einzelne Sohn Josefs wurde gesegnet.'
- source_word: εὐλόγησεν
  choice: segnete
  rationale: Dies ist die geläufige und sachlich passende Wiedergabe im Zusammenhang mit dem Segenshandeln Jakobs.
- source_word: προσεκύνησεν
  choice: betete er an
  rationale: Das Verb kann Niederbeugung oder Huldigung bezeichnen; im vorliegenden religiösen Zusammenhang steht die Anbetung im Vordergrund. Das Objekt wird wie im Griechischen nicht ausdrücklich ergänzt.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: während er sich auf das obere Ende seines Stabes stützte
  rationale: Die Wendung wird als Beschreibung von Jakobs Haltung verstanden. Diese natürliche deutsche Formulierung vermeidet den irreführenden Eindruck, der Stab sei Gegenstand seiner Anbetung; die enger am Wortlaut liegende Richtungsangabe bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Verhältnis der Anbetung zum Stab im Schlusssatz
  choice: Jakob betete an, während er sich auf das obere Ende seines Stabes stützte.
  alternative: Jakob betete zur Spitze seines Stabes hin an; nach dem hebräischen Text von 1. Mose 47,31 beugte er sich in Anbetung über das Kopfende seines Bettes.
  rationale: Der griechische Hebräertext hat ausdrücklich „Stab“ und wird im Haupttext beibehalten. Die Präpositionalphrase wird wahrscheinlich als Angabe der Körperhaltung verstanden, doch ihre sprachliche Mehrdeutigkeit sowie die abweichende hebräische Textform in 1. Mose werden in den Fußnoten offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext bleibt nah am griechischen Wortlaut, formuliert die schwierige Schlusswendung jedoch idiomatisch. Die Satzteilung erhöht die Verständlichkeit, ohne den logischen Zusammenhang zu verändern.
