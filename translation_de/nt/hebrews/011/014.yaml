id: HEB.11.14
reference: Hebrews 11:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: de
  text: Denn diejenigen, die so etwas sagen, machen deutlich, dass sie eine Heimat suchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr eigenes Land“ oder „ihr Heimatland“. Vers 16 stellt klar, dass die erhoffte Heimat letztlich himmlisch ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorhergehenden Vers und ist im Deutschen natürlich.
- source_word: οἱ … λέγοντες
  choice: wer … sagt
  rationale: Gibt den substantivierten Partizipialausdruck idiomatisch und allgemein wieder. Der griechische Plural kann im Deutschen durch das generische Singularpronomen natürlich ausgedrückt werden.
- source_word: τοιαῦτα
  choice: so etwas
  rationale: Verweist knapp und idiomatisch auf Aussagen der zuvor genannten Art.
- source_word: ἐμφανίζουσιν
  choice: macht deutlich
  rationale: Gibt das Sichtbar- beziehungsweise Erkennbarwerden als Schluss aus ihren Worten treffend wieder.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was durch die Aussagen deutlich wird.
- source_word: πατρίδα
  choice: eine Heimat
  rationale: Bewahrt die unbestimmte Form und bezeichnet das eigene Land beziehungsweise die Heimat, ohne die himmlische Deutung des folgenden Verses vorwegzunehmen.
- source_word: ἐπιζητοῦσιν
  choice: sucht
  rationale: Gibt das fortdauernde, zielgerichtete Suchen wieder; das deutsche Präsens trägt hier den allgemeinen und andauernden Sinn.
theological_decisions:
- issue: Bedeutung der von den Glaubenszeugen gesuchten πατρίς
  choice: Im Haupttext allgemein als „eine Heimat“ wiedergegeben.
  alternative: „ihr eigenes Land“, „ihr Heimatland“ oder ausdrücklich „eine himmlische Heimat“
  rationale: Der Vers selbst bezeichnet das Ziel nur als Heimat. Erst der folgende Vers stellt ausdrücklich klar, dass die erhoffte Heimat letztlich himmlisch ist; diese Spannung wird hier nicht vorzeitig aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die generische Singularkonstruktion „wer … sagt“ vermeidet eine schwerfällige substantivierte Form und schließt alle zuvor genannten Personen ein.
