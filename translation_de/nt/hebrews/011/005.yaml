  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: Πίστει wird angemessen mit »Durch Glauben« wiedergegeben, die wiederholte μετατίθημι-Wortgruppe bleibt als »wegnehmen« erkennbar, und »den Tod sehen« bewahrt das Bild des Grundtexts. Die überarbeitete Formulierung »um den Tod nicht zu sehen« gibt die finale Infinitivkonstruktion idiomatischer wieder, ohne die Bildsprache zu deuten. »War ihm bezeugt worden« bildet das passive μεμαρτύρηται genauer ab als die etwas stärker empfängerbezogene Wendung »hatte er das Zeugnis erhalten«.'
