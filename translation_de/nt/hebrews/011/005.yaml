- from: Durch Glauben wurde Henoch weggenommen, sodass er den Tod nicht sehen sollte[a]; und er wurde nicht gefunden, weil Gott ihn weggenommen hatte. Denn vor seiner Wegnahme hatte er das Zeugnis erhalten, Gott gefallen zu haben.
  to: Durch Glauben wurde Henoch weggenommen, um den Tod nicht zu sehen[a]; und er wurde nicht gefunden, weil Gott ihn weggenommen hatte. Denn bevor er weggenommen wurde, war ihm bezeugt worden, dass er Gott gefallen hatte.
  rationale: Die Revision betrifft ausschließlich idiomatisches modernes Deutsch und eine engere Abbildung des passiven »bezeugt worden«. Sie erhält die Wiederholung von μετατίθημι, die nicht weiter ausgeführte Art der Wegnahme und die bildhafte, nicht durch »sterben« ersetzte Wendung »den Tod sehen«.
