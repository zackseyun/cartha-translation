  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: de
  text: Durch Glauben wurde Henoch weggenommen, um den Tod nicht zu sehen[a]; und er wurde nicht gefunden, weil Gott ihn weggenommen hatte. Denn bevor er weggenommen wurde, war ihm bezeugt worden, dass er Gott gefallen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Tod nicht erfahren«. »Den Tod sehen« ist eine griechische Redewendung, die hier im Haupttext beibehalten wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet hier die bestimmende Grundlage beziehungsweise das Mittel. »Durch Glauben« entspricht dem Leitmotiv von Hebräer 11 und ist im Deutschen klar und geläufig.
- source_word: μετετέθη / μετέθηκεν
  choice: wurde weggenommen / hatte weggenommen
  rationale: »Wegnehmen« bewahrt die passive beziehungsweise göttliche Handlung, ohne über den Text hinaus den Zielort oder den Vorgang näher zu bestimmen. Die Wiederholung gibt die Wiederholung desselben griechischen Verbs wieder.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: sodass er den Tod nicht sehen sollte
  rationale: Die Formulierung wahrt das griechische Bild »den Tod sehen« und lässt die Zweck-/Folgewirkung der Infinitivkonstruktion erkennbar.
- source_word: οὐχ ηὑρίσκετο
  choice: er wurde nicht gefunden
  rationale: Die schlichte Passivform entspricht dem Griechischen und legt nicht fest, wer nach Henoch suchte.
- source_word: πρὸ γὰρ τῆς μεταθέσεως
  choice: Denn vor seiner Wegnahme
  rationale: Das Substantiv »Wegnahme« hält die lexikalische Verbindung zu »weggenommen« aufrecht und gibt die griechische Nominalkonstruktion knapp wieder.
- source_word: μεμαρτύρηται
  choice: hatte er das Zeugnis erhalten
  rationale: 'Die Wendung gibt den passiven Sinn von μαρτυρέω im Kontext von Hebräer 11 natürlich wieder: Henoch wurde ein positives Zeugnis ausgestellt beziehungsweise zugesprochen.'
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: Gott gefallen zu haben
  rationale: Der perfekte Infinitiv bezeichnet das Gottgefallen als dem Zeugnis vorausliegend; die deutsche Infinitivkonstruktion bildet dies prägnant ab.
theological_decisions:
- issue: Bedeutung der Wegnahme Henochs
  choice: »weggenommen« ohne Angabe eines Zielortes oder einer genaueren Art des Vorgangs
  alternative: »in den Himmel aufgenommen« oder das traditionssprachliche »entrückt«
  rationale: Der Vers sagt, dass Gott Henoch wegnahm, damit er den Tod nicht sehe, erläutert aber weder Zielort noch Vorgang. Die Übersetzung bewahrt diese Begrenzung.
- issue: Bedeutung von »den Tod sehen«
  choice: Das Bild wird im Haupttext beibehalten.
  alternative: 'Deutend: »den Tod erfahren« oder »sterben«'
  rationale: Die griechische Wendung ist auch auf Deutsch verständlich und bewahrt die Bildsprache; die idiomatische Bedeutung wird in einer Fußnote erläutert.
- issue: Art des Zeugnisses über Henoch
  choice: »hatte er das Zeugnis erhalten«
  alternative: »war ihm bezeugt worden« oder wertend »war er gelobt worden«
  rationale: Die Formulierung lässt offen, wie genau das Zeugnis vermittelt wurde, und verbindet die Aussage weder ausschließlich mit menschlicher Anerkennung noch mit einer über den Text hinausgehenden dogmatischen Bestimmung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die wiederholte Wortfamilie »weggenommen/Wegnahme« bildet μετατίθημι/μετάθεσις ab; die Bildsprache »den Tod sehen« bleibt erhalten.
