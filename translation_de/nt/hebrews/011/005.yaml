  terminology: »Henoch«, »Glauben«, »Gott gefallen« und die zurückhaltende Wiedergabe von μετατίθημι als »wegnehmen« sind passend. Die Revision bewahrt die wiederholte Wortfamilie »weggenommen/weggenommen wurde«, ohne einen Zielort oder eine dogmatisch weitergehende Deutung einzutragen.
