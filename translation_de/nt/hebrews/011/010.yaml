id: HEB.11.10
reference: Hebrews 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: de
  text: Denn er wartete auf die Stadt, die Fundamente hat[a] und deren Architekt und Erbauer Gott ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Stadt, die die Fundamente hat«. Der Plural kann Dauerhaftigkeit und Stabilität hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deren Gestalter und Schöpfer Gott ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: wartete auf
  rationale: Das Imperfekt bezeichnet ein fortdauerndes, erwartungsvolles Warten in der Vergangenheit; die deutsche Formulierung ist natürlich und bewahrt diesen durativen Sinn.
- source_word: γὰρ
  choice: Denn
  rationale: Gibt die begründende Verbindung zum vorherigen Vers wieder.
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: die Stadt, die feste Fundamente hat
  rationale: Bewahrt die partizipiale Beschreibung und den Plural »Fundamente«. »Feste« macht den im Kontext liegenden Gegensatz zu den Zelten verständlich, ohne die Stadt näher zu identifizieren.
- source_word: τεχνίτης
  choice: Baumeister
  rationale: Bezeichnet einen kundigen Handwerker oder Gestalter; im Zusammenhang mit einer Stadt umfasst »Baumeister« Planung und fachkundige Ausführung.
- source_word: δημιουργός
  choice: Erbauer
  rationale: Gibt Gott als denjenigen wieder, der die Stadt hervorbringt beziehungsweise errichtet, und hält die Bau-Metaphorik fest.
- source_word: ὁ θεός
  choice: Gott
  rationale: Standardwiedergabe des ausdrücklichen Subjekts.
theological_decisions:
- issue: Wesen der erwarteten Stadt
  choice: »die Stadt, die feste Fundamente hat« ohne weitere Identifizierung
  alternative: »die himmlische Stadt« oder »das neue Jerusalem«
  rationale: Der Vers hebt ihre Beständigkeit und Gottes Rolle als Baumeister und Erbauer hervor, nennt sie hier aber nicht ausdrücklich himmlisch und identifiziert sie nicht namentlich.
- issue: Verhältnis von τεχνίτης und δημιουργός
  choice: »Baumeister und Erbauer«
  alternative: »Entwerfer und Schöpfer«
  rationale: Die gewählte Fassung bewahrt zwei unterscheidbare Rollen innerhalb der Bau-Metaphorik, ohne daraus eine technische dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, ist aber flüssig lesbar. Die Stadt wird nicht über den Wortlaut des Verses hinaus theologisch bestimmt.
