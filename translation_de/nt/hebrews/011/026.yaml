source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: de
  text: Er hielt die Schmach des Messias[a] für größeren Reichtum als die Schätze Ägyptens[b]; denn er hielt seinen Blick auf die Belohnung gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schmach des Christus“. Die Wendung kann die Schmach bezeichnen, die um des Messias willen getragen wird, die man mit Gottes Gesalbtem teilt oder die nach der Darstellung des Hebräerbriefs im Messias ihre Erfüllung findet. Der griechische Wortlaut legt die genaue Beziehung nicht eindeutig fest.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich steht der Vergleich in der Reihenfolge: „größeren Reichtum als die Schätze Ägyptens hielt er die Schmach des Messias“.'
    reason: translation_clarity
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: größeren Reichtum
  rationale: Der Komparativ mit πλοῦτον bezeichnet einen Wertvergleich. „Größeren Reichtum“ ist im Deutschen natürlich und bewahrt den Gegensatz zu den Schätzen Ägyptens.
- source_word: ἡγησάμενος
  choice: Er hielt ... für
  rationale: Das Aoristpartizip von ἡγέομαι bezeichnet ein wertendes Ansehen oder Einschätzen. Die finite deutsche Wendung gibt den Sinn klar und idiomatisch wieder.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: die Schätze Ägyptens
  rationale: Die Genitivkonstruktion wird knapp und natürlich wiedergegeben und bewahrt den direkten Vergleich.
- source_word: τὸν ὀνειδισμὸν
  choice: die Schmach
  rationale: ὀνειδισμός bezeichnet öffentliche Beschimpfung, Schande oder Schmach. „Schmach“ ist würdig, verständlich und lässt sowohl erlittene Entehrung als auch soziale Verachtung anklingen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός steht hier als Titel. „Messias“ macht diese Funktion sichtbar; eine Fußnote nennt die traditionelle Wiedergabe „Christus“.
- source_word: ἀπέβλεπεν
  choice: er richtete seinen Blick auf
  rationale: Der Imperfekt bezeichnet eine anhaltende Ausrichtung. Die deutsche Formulierung vermittelt den fortdauernden, zielgerichteten Blick, ohne ausdrücklich ein zeitliches „voraus“ in den Text einzutragen.
- source_word: μισθαποδοσίαν
  choice: die Belohnung
  rationale: Das Substantiv bezeichnet Vergeltung beziehungsweise Lohn. Im positiven Zusammenhang ist „Belohnung“ klares, modernes Deutsch.
theological_decisions:
- issue: Bedeutung der Wendung „die Schmach des Messias“ in Bezug auf Mose
  choice: Die Genitivverbindung wird unverengt als „die Schmach des Messias“ bewahrt.
  alternative: „Schmach um des Messias willen“, „mit dem Messias geteilte Schmach“ oder „auf den Messias vorausweisende Schmach“
  rationale: Der griechische Genitiv legt die genaue Beziehung nicht eindeutig fest. Eine erklärende Auflösung würde eine umstrittene Deutung in den Haupttext eintragen; die Fußnote hält die möglichen Beziehungen offen.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle funktioniert Χριστός als Titel. „Messias“ bildet den Titel transparent ab, während die konventionelle Form „Christus“ als mögliche Wiedergabe ausgewiesen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schmach“ wahrt den biblischen Ernst, ohne altertümliche Syntax zu übernehmen. Die Satzstellung folgt natürlichem Deutsch; der anhaltende Aspekt von ἀπέβλεπεν wird durch „richtete seinen Blick“ ausgedrückt.
