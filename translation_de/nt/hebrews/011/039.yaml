id: HEB.11.39
reference: Hebrews 11:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: de
  text: Und diese alle fanden durch den Glauben Anerkennung[a], empfingen aber die Verheißung nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: erhielten ein gutes Zeugnis; auch: wurden anerkennend bezeugt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: erlangten die Verheißung nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάντες
  choice: Und diese alle
  rationale: „Und“ wahrt die schlichte Verknüpfung durch καί. Das ergänzte „diese“ macht den Rückbezug von πάντες auf die zuvor genannten Glaubenszeugen im Deutschen natürlich deutlich.
- source_word: μαρτυρηθέντες
  choice: fanden … Anerkennung
  rationale: Das passive Partizip bezeichnet hier ein günstiges Zeugnis beziehungsweise göttliche Bestätigung. „Anerkennung fanden“ gibt diesen Sinn idiomatisch wieder, ohne die bezeugende Instanz ausdrücklich zu ergänzen.
- source_word: διὰ τῆς πίστεως
  choice: durch den Glauben
  rationale: διά mit dem Genitiv bezeichnet hier das Mittel. „Glaube“ ist im Zusammenhang von Hebräer 11 die sachgerechte und theologisch offene Wiedergabe von πίστις.
- source_word: οὐκ ἐκομίσαντο
  choice: empfingen … nicht
  rationale: Das Medium von κομίζω kann den Empfang oder die Erlangung von etwas Verheißenem bezeichnen. „Empfingen nicht“ ist klar und bewahrt die Nähe zum griechischen Ausdruck.
- source_word: τὴν ἐπαγγελίαν
  choice: die Verheißung
  rationale: Der bestimmte Singular bleibt erhalten. So wird nicht vorwegnehmend entschieden, ob besonders das Verheißene, die Erfüllung oder die endgültige Heilsgabe gemeint ist.
theological_decisions:
- issue: Bedeutung von „die Verheißung“ im Kontext
  choice: Die kompakte Formulierung „die Verheißung“ bleibt im Haupttext stehen.
  alternative: „das Verheißene“, „die Erfüllung der Verheißung“ oder „das verheißene Erbe“
  rationale: Der griechische Text benennt die noch nicht empfangene eschatologische Gabe knapp; Vers 40 führt den Gedanken weiter aus. Eine erläuternde Erweiterung würde die vorhandene theologische Spannung vorschnell auflösen.
- issue: Verhältnis zwischen Anerkennung und Nichterfüllung
  choice: Die konzessive Beziehung wird durch „aber“ ausgedrückt.
  alternative: Eine rein nebenordnende Wiedergabe ohne „aber“
  rationale: Obwohl καί selbst nur verbindet, ergibt sich der Gegensatz aus dem anerkennenden Partizip und dem folgenden οὐκ. „Aber“ macht diese im Griechischen implizite Beziehung in natürlichem Deutsch sichtbar, ohne einen neuen theologischen Gedanken einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung bewahrt den Anschluss an die vorangehende Reihe der Glaubenszeugen und hebt den im Kontext liegenden Gegensatz hervor.
