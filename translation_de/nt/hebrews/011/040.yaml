id: HEB.11.40
reference: Hebrews 11:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: de
  text: weil Gott für uns etwas Besseres vorgesehen hatte,[a] damit sie nicht ohne uns vollendet würden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Voraus etwas Besseres für uns bereitgestellt hatte“. Das griechische Wort kann sowohl Vorausblick als auch vorausgehende Planung oder Vorsorge ausdrücken; der Zusammenhang hebt Gottes planendes Handeln hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit sie nicht getrennt von uns vollkommen gemacht würden“ beziehungsweise „ohne uns zur Vollendung gelangten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: vorgesehen hatte
  rationale: Das mediale Partizip bezeichnet hier Gottes vorausgehendes Planen und Bereitstellen. „Vorgesehen“ bewahrt im Deutschen sowohl den Gedanken der Voraussicht als auch den der göttlichen Absicht, ohne auf bloßes Vorherwissen zu verengen.
- source_word: κρεῖττόν τι
  choice: etwas Besseres
  rationale: „Besser“ gibt den für den Hebräerbrief charakteristischen Vergleichsbegriff wieder; τι wird idiomatisch mit „etwas“ ausgedrückt.
- source_word: περὶ ἡμῶν
  choice: für uns
  rationale: 'In Verbindung mit προβλέπω ist die Wendung hier am natürlichsten benefaktiv beziehungsweise relational zu verstehen: Gottes Vorsorge hatte uns im Blick.'
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: Die Formulierung bewahrt die Zweck- beziehungsweise Folgebeziehung der griechischen Konstruktion in natürlichem Deutsch.
- source_word: χωρὶς ἡμῶν
  choice: ohne uns
  rationale: „Ohne uns“ ist die klare, idiomatische Entsprechung und bewahrt den Gedanken, dass ihre Vollendung nicht getrennt von der unseren geschieht.
- source_word: τελειωθῶσιν
  choice: vollendet würden
  rationale: „Vollendet“ lässt sowohl das Erreichen des Zieles als auch den theologischen Gedanken der Vollkommenheit anklingen und passt zum Sprachgebrauch des Hebräerbriefs.
- source_word: τοῦ θεοῦ
  choice: Gott
  rationale: Der Genitivus absolutus wird als begründender Nebensatz mit „weil Gott“ natürlich ins Deutsche übertragen.
theological_decisions:
- issue: Bedeutung von τελειωθῶσιν im heilsgeschichtlichen Zusammenhang des Hebräerbriefs
  choice: „vollendet würden“ bewahrt die Verbindung von Zielerreichung, Vollendung und Vollkommenheit.
  alternative: „vollkommen gemacht würden“ oder „zur Vollendung gelangten“
  rationale: Der Ausdruck soll weder ausschließlich als moralische Vervollkommnung noch bloß als zeitlicher Abschluss verstanden werden. „Vollendet“ erhält die theologische Spannung.
- issue: Bedeutung von προβλεψαμένου
  choice: „vorgesehen hatte“ umfasst Gottes vorausgehende Absicht und Vorsorge.
  alternative: „im Voraus für uns bereitgestellt hatte“ oder „im Voraus etwas Besseres für uns ersehen hatte“
  rationale: Der Zusammenhang spricht für Gottes planendes Handeln; zugleich wird die im Verb liegende Nuance des Vorausblickens nicht vollständig ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der mit „weil“ eröffnete Versteil schließt syntaktisch an Hebräer 11,39 an. „Vorgesehen“ und „vollendet“ bewahren die Mehrdeutigkeit und theologische Dichte des griechischen Textes.
