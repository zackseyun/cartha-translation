id: HEB.11.12
reference: Hebrews 11:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: de
  text: Darum gingen auch aus einem einzigen Mann[a] – und noch dazu aus einem, der gleichsam schon tot war[b] – Nachkommen hervor, so zahlreich wie die Sterne am Himmel und wie der unzählbare Sand am Ufer des Meeres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus einem Einzigen“; gemeint ist Abraham.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist, dass Abraham wegen seines hohen Alters menschlich gesehen keine Kinder mehr zeugen konnte.
    reason: contextual_clarification
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem zuvor Gesagten und verbindet den Vers natürlich mit dem Kontext.
- source_word: ἀφ’ ἑνὸς
  choice: aus einem einzigen Mann
  rationale: Die maskuline Form und der Zusammenhang weisen auf Abraham; „einzigen“ bewahrt die Betonung seiner Einzelgestalt.
- source_word: ἐγεννήθησαν
  choice: gingen … Nachkommen hervor
  rationale: Das griechische Passiv bezeichnet das Entstehen beziehungsweise Geborenwerden der Nachkommenschaft. Die deutsche Formulierung ist natürlich und lässt sich gut mit dem Zahlvergleich verbinden.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: und noch dazu aus einem, der gleichsam schon tot war
  rationale: καὶ ταῦτα verstärkt den überraschenden Umstand; νενεκρωμένου beschreibt im Kontext bildhaft Abrahams altersbedingte Zeugungsunfähigkeit, nicht seinen buchstäblichen Tod.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: so zahlreich wie die Sterne am Himmel
  rationale: Gibt den ausdrücklichen Gedanken der Menge in natürlichem, würdevollem Deutsch wieder.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: wie der unzählbare Sand am Ufer des Meeres
  rationale: „Ufer des Meeres“ gibt das wörtliche Bild vom „Rand/Lippenrand des Meeres“ idiomatisch wieder; „unzählbar“ bewahrt die gehobene Sprache der Verheißung.
theological_decisions:
- issue: Bezug von ἀφ’ ἑνὸς
  choice: Abraham wird als „ein einziger Mann“ kenntlich gemacht.
  alternative: 'Wörtlicher und mehrdeutiger: „aus einem Einzigen“ oder „aus einem“.'
  rationale: Genus und Kontext identifizieren Abraham. Die Explizierung beseitigt im Deutschen unnötige Unklarheit, ohne zusätzliche Lehraussagen einzutragen.
- issue: Bedeutung von νενεκρωμένου
  choice: Bildhafte Beschreibung Abrahams als „gleichsam schon tot“.
  alternative: 'Wörtlich: „erstorben“ oder „getötet worden“.'
  rationale: Gemeint ist im Zusammenhang seine altersbedingte Zeugungsunfähigkeit. „Gleichsam“ bewahrt das Todesbild, verhindert aber das Missverständnis eines buchstäblichen Todes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Gedankenstriche bilden den griechischen Einschub ab; das Verheißungsbild von Sternen und Sand bleibt erhalten.
