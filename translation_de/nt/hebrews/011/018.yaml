review_pass:
  verdict: revise
  source_fidelity: Die Anrede an Abraham und das unpersönliche Passiv sind zutreffend erfasst. »Nach Isaak« ist jedoch im modernen Deutsch primär zeitlich („nach Isaac“) verständlich und gibt ἐν Ἰσαὰκ als die durch Isaak bestimmte Abstammungs- bzw. Benennungslinie nicht zuverlässig wieder. »Durch Isaak« bildet diese Funktion klarer ab, ohne die Aussage stärker zu interpretieren.
  naturalness: Der Satzanschluss im Plusquamperfekt ist natürlich und angemessen. Die Änderung zu »Durch Isaak« beseitigt die missverständliche zeitliche Lesart; die passive Formulierung bleibt bewusst nah am Zitatstil.
  terminology: »Nachkommenschaft« gibt σπέρμα treffend als kollektiven Singular wieder. »genannt werden« bewahrt den Bezug zu κληθήσεται. Ein modales »soll« ist nicht erforderlich, da das griechische Futur am direktesten mit »wird« wiedergegeben wird.
  issues:
  - severity: medium
    issue: »Nach Isaak« ist mehrdeutig und überwiegend temporal lesbar.
    rationale: ἐν Ἰσαὰκ bezeichnet in diesem Zitat nicht einen Zeitpunkt nach Isaak, sondern die Bestimmung der Nachkommenschaft durch bzw. über Isaak.
  - severity: low
    issue: »soll … genannt werden« fügt eine modale Nuance hinzu.
    rationale: κληθήσεται ist ein einfaches Futurpassiv; »wird … genannt werden« ist formnäher und im Deutschen ebenso würdevoll.
