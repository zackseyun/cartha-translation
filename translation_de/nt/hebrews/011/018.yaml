  text: πρὸς ὃν ἐλαλήθη ὅτι Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/018.yaml
  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: de
  text: 'zu dem gesagt worden war: »Durch Isaak wird deine Nachkommenschaft genannt werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ὃν
  choice: zu dem
  rationale: Die Präposition πρὸς mit dem Relativpronomen bezeichnet hier den Empfänger der Aussage und schließt unmittelbar an Abraham im vorausgehenden Zusammenhang an.
- source_word: ἐλαλήθη
  choice: gesagt worden war
  rationale: Der Aorist Passiv von λαλέω wird als unpersönliches Passiv wiedergegeben. Das Plusquamperfekt fügt sich natürlich in den deutschen Satzanschluss ein und bezeichnet die zuvor ergangene Zusage.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen die als direkte Rede wiedergegebene Aussage idiomatisch ein; ein zusätzliches »dass« wäre vor dem Zitat unnötig.
- source_word: Ἐν Ἰσαὰκ
  choice: Nach Isaak
  rationale: Im Zusammenhang von Genesis 21,12 bezeichnet ἐν Ἰσαὰκ die Linie, über die Abrahams Nachkommenschaft bestimmt beziehungsweise benannt wird. »Nach Isaak« ist im Deutschen verständlicher als das missverständliche wörtliche »in Isaak«.
- source_word: κληθήσεταί
  choice: soll … genannt werden
  rationale: Das Futur Passiv von καλέω bleibt mit »genannt werden« lexikalisch erkennbar. »Soll« gibt in einer göttlichen Zusage die festgesetzte zukünftige Bestimmung natürlich wieder.
- source_word: σοι
  choice: deine
  rationale: Der Dativ hat hier possessiven Sinn und wird im Deutschen idiomatisch durch das Possessivpronomen ausgedrückt.
- source_word: σπέρμα
  choice: Nachkommenschaft
  rationale: Das deutsche Kollektivum bewahrt den zusammenfassenden Singular und ist im heutigen Sprachgebrauch verständlicher als »Same«.
theological_decisions:
- issue: Bestimmung der verheißenen Nachkommenschaft durch Isaak
  choice: Nach Isaak soll deine Nachkommenschaft genannt werden
  alternative: In Isaak wird dir Nachkommenschaft genannt werden
  rationale: Die gewählte Fassung hält sowohl den Gedanken der durch Isaak bestimmten Verheißungslinie als auch den Wortstamm von καλέω fest, ohne »Nachkommenschaft« ausdrücklich als bloße biologische Abstammung oder als spätere theologische Einzelperson auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktischer Anschluss an Hebräer 11,17 formuliert. Die Genesis-Anspielung wird nah am griechischen Wortlaut, aber ohne das im Deutschen räumlich missverständliche »in Isaak« wiedergegeben.
