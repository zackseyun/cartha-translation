id: HEB.11.1
reference: Hebrews 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: de
  text: Der Glaube ist die Gewissheit dessen, was man erhofft,[a] die Überzeugung von Dingen, die man nicht sieht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Grundlage« beziehungsweise »die Wirklichkeit dessen, was man erhofft«.'
    reason: lexikalische Alternative zu ὑπόστασις
  - marker: b
    text: 'Oder: »der Beweis« beziehungsweise »der Nachweis für Dinge, die man nicht sieht«.'
    reason: lexikalische Alternative zu ἔλεγχος
lexical_decisions:
- source_word: πίστις
  choice: Glaube
  rationale: Hier bezeichnet das Wort die vertrauende Haltung gegenüber Gottes Verheißungen. »Glaube« ist im Deutschen der natürliche und theologisch offene Ausdruck; »Treue« passt in diesem Zusammenhang weniger gut.
- source_word: ἐλπιζομένων
  choice: dessen, was man erhofft
  rationale: Das substantivisch gebrauchte Partizip bezeichnet den Inhalt der Hoffnung. Die Formulierung ist gegenwartsnah und bewahrt den Genitivbezug zu ὑπόστασις.
- source_word: ὑπόστασις
  choice: Gewissheit
  rationale: Das Wort kann je nach Zusammenhang Gewissheit, Grundlage, Bestand oder Wirklichkeit bezeichnen. »Gewissheit« ergibt hier einen natürlichen Sinn, ohne die möglichen sachlich-ontologischen Bedeutungsanteile in der Fußnote auszuschließen.
- source_word: πραγμάτων
  choice: von Dingen
  rationale: πρᾶγμα ist ein weiter Ausdruck für Dinge, Sachverhalte oder Wirklichkeiten. »Dinge« bewahrt diese Offenheit und den parallelen Satzbau.
- source_word: ἔλεγχος
  choice: Überzeugung
  rationale: Der Ausdruck kann sowohl den Nachweis oder Beweis als auch die daraus entstehende Überzeugung bezeichnen. »Überzeugung« ist im Haupttext natürlich; die stärker objektive Lesart bleibt in der Fußnote erhalten.
- source_word: οὐ βλεπομένων
  choice: die man nicht sieht
  rationale: Die Wendung gibt das verneinte präsentische Partizip verständlich wieder und lässt offen, ob die betreffenden Dinge grundsätzlich unsichtbar oder nur gegenwärtig nicht sichtbar sind.
- source_word: δὲ
  choice: im Deutschen nicht eigens wiedergegeben
  rationale: δέ kennzeichnet hier einen milden Übergang, keinen deutlichen Gegensatz. Ein ausdrückliches »aber« oder »nun« wäre im modernen Deutschen leicht zu stark oder missverständlich; der Zusammenhang trägt die Verknüpfung.
theological_decisions:
- issue: Bedeutung von ὑπόστασις
  choice: Gewissheit
  alternative: Grundlage, Bestand oder Wirklichkeit
  rationale: Der Kontext schildert die tragende Haltung des Glaubens, zwingt aber nicht zu einer rein subjektiven oder rein ontologischen Deutung. Der Haupttext ist verständlich, während die Fußnote die echte lexikalische Spannung bewahrt.
- issue: Bedeutung von ἔλεγχος
  choice: Überzeugung
  alternative: Beweis oder Nachweis
  rationale: Das griechische Wort kann das objektive Beweismittel oder die dadurch begründete innere Überzeugung hervorheben. Die Übersetzung entscheidet sich für eine natürliche deutsche Hauptlesart, ohne die Alternative zu unterschlagen.
- issue: Charakter des Verses
  choice: als Aussage über das Wesen beziehungsweise Wirken des Glaubens formuliert
  alternative: als technische, erschöpfende Definition des Glaubens verstehen
  rationale: Die knappe Nominalkonstruktion beschreibt den Glauben im Rahmen der folgenden Beispiele. Die Übersetzung fügt deshalb keine konfessionell geprägte Definition hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Satzhälften bleibt erhalten. Fachsprachliche oder altertümliche Wendungen wie »Substanz« und »Nichtzweifeln« wurden im Haupttext vermieden; die bedeutungsrelevanten Alternativen stehen in den Fußnoten.
