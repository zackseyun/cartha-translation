  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: de
  text: löschten die Kraft des Feuers, entkamen der Schärfe des Schwertes[a], wurden aus Schwachheit heraus gestärkt, wurden mächtig im Kampf und schlugen fremde Heere[b] in die Flucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Mündern des Schwertes“; eine bildhafte Wendung für seine Schneide oder Schärfe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Heerlager“. Das Wort bezeichnet wörtlich ein Lager oder Heerlager und kann im militärischen Zusammenhang für die dort versammelte Streitmacht stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: löschten
  rationale: Das Verb bezeichnet das Löschen oder Ersticken eines Feuers. „Löschten“ bewahrt das anschauliche Bild und passt natürlich zu „Macht des Feuers“.
- source_word: δύναμιν πυρός
  choice: die Macht des Feuers
  rationale: δύναμις bezeichnet hier die wirksame Kraft oder Macht des Feuers. Die Wiedergabe erhält den gegenüber schlichtem „Feuer“ erweiterten Ausdruck des Griechischen.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: entkamen der Schärfe des Schwertes
  rationale: ἔφυγον bezeichnet im Zusammenhang das erfolgreiche Entkommen. στόματα μαχαίρης lautet wörtlich „Münder des Schwertes“, ist aber eine bildhafte Wendung für seine Schneide oder Schärfe.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: wurden aus Schwachheit stark gemacht
  rationale: 'Die passive Verbform wird ausdrücklich erhalten und lässt offen, durch wen die Stärkung geschah. ἀπό bezeichnet den Ausgangspunkt: aus einem Zustand der Schwachheit heraus.'
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: wurden mächtig im Kampf
  rationale: Die Formulierung bezeichnet den Eintritt in einen Zustand der Stärke. „Mächtig“ vermeidet eine unmittelbare Wiederholung von „stark“, während „im Kampf“ den militärischen Zusammenhang natürlich wiedergibt.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: schlugen die Heerlager Fremder in die Flucht
  rationale: παρεμβολή bezeichnet zunächst ein Lager oder Heerlager und kann metonymisch für die dort versammelte Streitmacht stehen. „In die Flucht schlagen“ gibt die militärische Wirkung von ἔκλιναν idiomatisch wieder; „Fremder“ bewahrt die substantivische Offenheit von ἀλλοτρίων.
theological_decisions:
- issue: Konkrete oder vergeistigte Darstellung der Glaubenstaten
  choice: Die körperlichen und militärischen Bilder von Feuer, Schwert, Schwachheit, Kampf und fremden Heerlagern bleiben konkret erhalten.
  alternative: Die Aussagen als allgemeine geistliche Siege über Gefahren und Feinde wiedergeben.
  rationale: Der Zusammenhang zählt konkrete Bewahrungen und Siege aus der Geschichte der Glaubenden auf. Eine Vergeistigung würde die historischen Bilder des Textes abschwächen.
- issue: Urheber der Stärkung
  choice: Das grammatische Passiv „wurden ... stark gemacht“ wird bewahrt, ohne den Handelnden ausdrücklich zu benennen.
  alternative: „Sie wurden stark“ oder „Gott machte sie stark“.
  rationale: Der Text legt eine empfangene Stärkung nahe, nennt den Urheber in diesem Teilsatz jedoch nicht ausdrücklich. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit rhythmischer Reihung. Die wiederholten Aoristformen werden als Folge abgeschlossener Taten wiedergegeben. Das ungewohnte, aber verständliche „aus Schwachheit stark gemacht“ bewahrt bewusst Passiv und Ausgangspunkt des griechischen Ausdrucks.
