source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: de
  text: Durch Glauben erkennen wir, dass die Welten durch Gottes Wort geordnet worden sind,[a] sodass das, was man sieht, nicht aus sichtbaren Dingen entstanden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zeitalter“; auch: „das Universum“. Das griechische Wort kann die Weltordnung in ihrer zeitlichen Erstreckung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet das Mittel; die knappe Wendung greift zugleich die wiederkehrende Formel des Kapitels auf.
- source_word: νοοῦμεν
  choice: erkennen wir
  rationale: Das Verb bezeichnet geistiges Erfassen. „Erkennen“ klingt im Deutschen natürlich und unterscheidet dieses Erfassen vom bloßen sinnlichen Sehen.
- source_word: κατηρτίσθαι
  choice: geordnet worden sind
  rationale: Der Perfekt-Passiv-Infinitiv bezeichnet eine vollzogene Herstellung beziehungsweise Ordnung. „Geordnet“ bewahrt diesen Sinn, ohne den Vorgang unnötig auf materielle Erschaffung zu verengen.
- source_word: τοὺς αἰῶνας
  choice: die Weltzeiten
  rationale: Der Plural αἰῶνες bedeutet wörtlich „Zeitalter“, kann hier aber die geschaffene Weltordnung in ihrer zeitlichen Erstreckung bezeichnen. „Weltzeiten“ bewahrt beide Aspekte besser als das enger deutende „Universum“.
- source_word: ῥήματι θεοῦ
  choice: durch Gottes Wort
  rationale: Der instrumentale Dativ nennt Gottes gesprochenes Wort als Mittel; die deutsche Formulierung ist klar und idiomatisch.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: sodass ... nicht ... entstanden ist
  rationale: Die Konstruktion bezeichnet hier die Folge. „Entstanden ist“ gibt γίνομαι wieder, ohne eine ausführlichere metaphysische Aussage in den Text einzutragen.
- source_word: ἐκ φαινομένων
  choice: aus sichtbaren Dingen
  rationale: Das substantivierte Partizip bezeichnet Dinge, die erscheinen beziehungsweise sichtbar sind.
- source_word: τὸ βλεπόμενον
  choice: das Sichtbare
  rationale: Das substantivierte Partizip steht kollektiv für die sichtbare Schöpfungsordnung; „das Sichtbare“ ist knapp und wahrt den Gegensatz.
theological_decisions:
- issue: Bedeutungsumfang von αἰῶνες im Zusammenhang der Schöpfung
  choice: „die Weltzeiten“
  alternative: „die Welten“, „das Universum“ oder „die Zeitalter“
  rationale: Die gewählte Wiedergabe hält die zeitliche und kosmische Weite des griechischen Ausdrucks zusammen und vermeidet eine Verengung auf den räumlich-materiellen Kosmos.
- issue: Verhältnis der Aussage zur Schöpfung aus dem Nichts
  choice: Keine ausdrückliche Formulierung einer Schöpfung aus dem Nichts im Haupttext
  alternative: Eine eindeutigere Formulierung wie „aus dem Nichts geschaffen“
  rationale: Der griechische Text sagt ausdrücklich, dass das Sichtbare nicht aus sichtbaren Dingen entstanden ist. Er ist mit der Lehre von der Schöpfung aus dem Nichts vereinbar, formuliert sie hier aber nicht in dieser vollständigen dogmatischen Gestalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „Weltzeiten“ bewahrt bewusst die zeitlich-kosmische Spannung von αἰῶνες; die Fußnote nennt geläufigere Alternativen.
