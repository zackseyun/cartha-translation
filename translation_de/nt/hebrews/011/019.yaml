base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: de
  text: Er war überzeugt, dass Gott sogar jemanden von den Toten auferwecken kann. Daher[a] erhielt er ihn auch sinnbildlich[b] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von woher“. Das Wort kann sowohl eine Folgerung als auch einen Herkunftsbezug ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in einem Gleichnis“ beziehungsweise „bildlich gesprochen“. Abraham erhielt Isaak so zurück, als käme er vom Tod zurück, nicht durch eine tatsächliche Auferstehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: war zu der Überzeugung gekommen
  rationale: Das Partizip bezeichnet Abrahams inneres Abwägen und die daraus gewonnene Überzeugung. Die Formulierung klingt im heutigen Deutsch natürlich und wahrt den folgernden Charakter.
- source_word: ἐκ νεκρῶν ἐγείρειν
  choice: von den Toten auferwecken
  rationale: Dies ist die übliche und klare deutsche Wiedergabe der griechischen Auferstehungssprache.
- source_word: δυνατὸς ὁ θεός
  choice: Gott … auferwecken kann
  rationale: Die modale Verbform gibt das griechische Prädikatsadjektiv idiomatisch wieder und bewahrt die gegenwärtig formulierte Aussage über Gottes Vermögen.
- source_word: καὶ ἐκ νεκρῶν
  choice: sogar von den Toten
  rationale: καί hebt hier die äußerste Möglichkeit hervor, mit der Abraham rechnete.
- source_word: ὅθεν
  choice: daher
  rationale: 'Der Folgerungssinn passt syntaktisch und inhaltlich gut: Im Licht dieser Überzeugung erhielt Abraham Isaak zurück. Die mögliche stärker relative beziehungsweise herkunftsbezogene Bedeutung wird in einer Fußnote bewahrt.'
- source_word: ἐν παραβολῇ
  choice: sinnbildlich
  rationale: Die Wiedergabe macht verständlich, dass Isaaks Rückkehr einer Auferweckung vergleichbar war, ohne eine tatsächliche Auferstehung zu behaupten. Die mögliche wörtlichere Fassung mit „Gleichnis“ bleibt in der Fußnote sichtbar.
- source_word: ἐκομίσατο
  choice: erhielt er ihn … zurück
  rationale: Im Zusammenhang bezeichnet das Medium, dass Abraham Isaak nach der beinahe vollzogenen Opferung wiederbekam; „zurückerhalten“ gibt diesen Kontext natürlich wieder.
theological_decisions:
- issue: Art von Isaaks Rückkehr
  choice: Isaak wurde sinnbildlich, also in einer der Auferweckung vergleichbaren Weise, zurückerhalten.
  alternative: Die Wendung kann formaler als „in einem Gleichnis“ wiedergegeben und typologisch verstanden werden.
  rationale: ἐν παραβολῇ kennzeichnet die Rückkehr als Vergleich oder Sinnbild, nicht als tatsächliche Auferstehung. Die Übersetzung benennt die Analogie, ohne ihre mögliche typologische Tragweite festzulegen.
- issue: Bezug von ὅθεν
  choice: 'inferentiell: „daher“'
  alternative: 'relativ beziehungsweise herkunftsbezogen: „von woher“'
  rationale: Beide Bedeutungsnuancen sind sprachlich möglich. Im Haupttext steht die im deutschen Satzgefüge natürlichere Folgerung; die Fußnote bewahrt die formale Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht den gedanklichen Zusammenhang gut verständlich. „Sinnbildlich“ wahrt die bildhafte Aussage, während die Fußnote die ungewöhnlichere, formal nähere Wiedergabe von παραβολή offenhält.
