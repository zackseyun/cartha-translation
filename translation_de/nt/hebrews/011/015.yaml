    rationale: Das griechische Verb bedeutet hier primär „im Sinn haben/gedenken“. Die Vorsilbe „zurück-“ kann im Deutschen zusätzliche Assoziationen eines rückwärtsgewandten oder sehnsüchtigen Denkens hervorrufen. „An ... gedacht“ bewahrt den kognitiven Sinn offener.
  - severity: low
    issue: Die Fußnote bietet eine nicht erforderliche lexikalische Alternative und begründet sie als wörtlicher, obwohl „weggegangen“ nicht eindeutig wörtlicher als „fortgezogen“ ist.
    rationale: Die Fußnote ist für die Übersetzung nicht nötig; wenn sie beibehalten wird, sollte sie neutral als mögliche Formulierung gekennzeichnet sein.
