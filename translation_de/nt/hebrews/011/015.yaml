source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: de
  text: Und wenn sie an jenes Land gedacht hätten, aus dem sie fortgezogen waren,[a] hätten sie Gelegenheit gehabt, zurückzukehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem sie weggegangen waren“.'
    reason: Mögliche lexikalische Alternative für ἐξέβησαν.
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: zurückgedacht hätten
  rationale: Im irrealen Bedingungssatz gibt die deutsche Konjunktiv-II-Vorvergangenheit den kontextuellen Sinn natürlich wieder. „Zurückdenken“ bewahrt den kognitiven Bezug, ohne ihn auf bloße Sehnsucht zu verengen.
- source_word: ἐκείνης
  choice: jenes Land
  rationale: Das feminine Demonstrativpronomen verweist auf die zuvor genannte Heimat beziehungsweise das Land. „Land“ ist konkret und vermeidet einen unnötig politischen Klang.
- source_word: ἀφ’ ἧς
  choice: aus dem
  rationale: Die Präposition bezeichnet den Ausgangspunkt; mit „Land“ ist „aus dem“ im Deutschen idiomatisch.
- source_word: ἐξέβησαν
  choice: fortgezogen waren
  rationale: Der Aorist von ἐκβαίνω bezeichnet ihr Weggehen aus dem früheren Land. „Fortgezogen“ ist im Zusammenhang mit einer Heimat natürlich und bewahrt die räumliche Bewegung.
- source_word: εἶχον ἂν
  choice: hätten sie ... gehabt
  rationale: Im Nachsatz kennzeichnet Imperfekt mit ἄν eine irreale Möglichkeit der Vergangenheit; der deutsche Konjunktiv II gibt dies präzise wieder.
- source_word: καιρὸν
  choice: Gelegenheit
  rationale: Hier bezeichnet καιρός nicht nur Zeitdauer, sondern eine passende Möglichkeit oder Chance.
- source_word: ἀνακάμψαι
  choice: zurückzukehren
  rationale: Das Verb bezeichnet die Rückkehr beziehungsweise Umkehr zu einem früheren Ort; „zurückkehren“ ist knapp und würdevoll.
- source_word: καὶ εἰ μὲν
  choice: Und wenn
  rationale: Die Wendung knüpft an den vorherigen Gedanken an und eröffnet die Bedingung. μέν muss hier im Deutschen nicht eigens wiedergegeben werden.
theological_decisions:
- issue: Bedeutung des Landes, an das sie hätten zurückdenken können
  choice: Das konkrete irdische Herkunftsland, das sie verlassen hatten
  alternative: Eine allgemein verstandene frühere Lebensweise
  rationale: Hebräer 11,13–16 stellt das irdische Herkunftsland der besseren, himmlischen Heimat gegenüber. Die Übersetzung wahrt die konkrete räumliche Aussage und deutet sie nicht allegorisch um.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die irreale Bedingung der Vergangenheit wird klar durch den Konjunktiv II ausgedrückt; „Land“ bleibt offen für die kontextuelle Bedeutung „Heimat“.
