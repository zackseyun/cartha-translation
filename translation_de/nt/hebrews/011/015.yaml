  source_fidelity: Die Satzstruktur und der Irrealis der Vergangenheit sind zutreffend wiedergegeben. „Fortgezogen waren“ gibt ἐξέβησαν im räumlichen Kontext angemessen wieder, und „Gelegenheit“ trifft καιρόν. „Zurückgedacht“ kann jedoch stärker ein nostalgisches oder rückwärtsgewandtes Erinnern nahelegen, während μνημονεύουσιν hier neutraler das Im-Sinn-Haben des früheren Landes bezeichnet.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. Mit „an jenes Land gedacht hätten“ klingt er idiomatischer und semantisch neutraler; das Komma vor dem erweiterten Infinitiv erhöht die Lesbarkeit.
  terminology: „Land“, „Gelegenheit“ und „zurückzukehren“ sind passend. Der demonstrative Bezug auf das zuvor erwähnte Herkunftsland bleibt gewahrt, ohne die Aussage theologisch zu überdeuten.
