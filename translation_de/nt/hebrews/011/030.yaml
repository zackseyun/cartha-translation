  text: πίστει τὰ τείχη Ἰεριχὼ ⸀ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: de
  text: Durch Glauben fielen die Mauern Jerichos, nachdem sie sieben Tage lang umrundet worden waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der Dativ kann Mittel oder Art und Weise ausdrücken. »Durch Glauben« bewahrt die wiederkehrende Formel von Hebräer 11 und lässt diese Nuance angemessen offen.
- source_word: τὰ τείχη Ἰεριχὼ
  choice: die Mauern von Jericho
  rationale: τεῖχος bezeichnet hier die Stadtmauer; der Plural »Mauern« entspricht dem griechischen Text und ist im Deutschen natürlich.
- source_word: ἔπεσαν
  choice: fielen
  rationale: Das Verb πίπτω bedeutet schlicht »fallen«. »Stürzten ein« wäre anschaulicher, aber auch stärker ausdeutend.
- source_word: κυκλωθέντα
  choice: nachdem man … um sie herumgezogen war
  rationale: Das passive Aoristpartizip von κυκλόω bezeichnet ein vorausgehendes Umkreisen. Die unpersönliche Formulierung gibt den passiven Fokus wieder, ohne das im Josuabuch genannte handelnde Volk ausdrücklich in den Text einzutragen.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: sieben Tage lang
  rationale: ἐπί mit Akkusativ bezeichnet hier die zeitliche Dauer; »sieben Tage lang« ist die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe von πίστις in Hebräer 11,30
  choice: Glauben
  alternative: Treue; Vertrauen
  rationale: Die wiederkehrende Formel des Kapitels und der Zusammenhang mit den Glaubenszeugen sprechen für »Glauben«. »Treue« passt hier weniger gut; »Vertrauen« wäre möglich, würde den griechischen Begriff jedoch enger bestimmen.
- issue: Bezug des passiven Partizips κυκλωθέντα
  choice: Die Mauern wurden umrundet
  alternative: Das Volk zog um die Stadtmauern
  rationale: Die gewählte Fassung hält sich an den grammatischen Fokus des griechischen Textes. Die Alternative erklärt die Erzählung aus Josua 6 ausdrücklich, ergänzt aber ein handelndes Subjekt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform bewahrt den rhythmischen Charakter der Glaubensbeispiele in Hebräer 11.
