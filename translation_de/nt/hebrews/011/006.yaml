source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: de
  text: Ohne Glauben[a] aber ist es unmöglich, ihm zu gefallen. Denn wer zu Gott kommt, muss glauben, dass er existiert[b] und dass er die belohnt[c], die ihn ernsthaft suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertrauen“. πίστις kann in anderen Zusammenhängen auch „Treue“ bedeuten; hier erklärt der folgende Satz den Ausdruck durch das Glauben an Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „dass er ist“. Die griechische Formulierung ist knapp.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „dass er ein Belohner wird“. Auch möglich: „dass er ein Belohner ist“ oder „dass er sich als Belohner erweist“. Im Griechischen steht „wird“; im Zusammenhang beschreibt dies, wie Gott denen begegnet, die ihn suchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: Ohne Glauben aber
  rationale: χωρίς bezeichnet das Fehlen von etwas; δέ ist ein milder Anschluss. „Glauben“ gibt πίστις hier passend wieder, da der folgende Satz das Glauben an Gott erläutert.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: ist es unmöglich, ihm zu gefallen
  rationale: Die unpersönliche Konstruktion mit Infinitiv wird im Deutschen natürlich so wiedergegeben. Das im Griechischen unausgesprochene Objekt ergibt sich aus dem unmittelbar folgenden Bezug auf Gott.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: Denn ... muss glauben
  rationale: γάρ begründet die vorausgehende Aussage, während δεῖ die Notwendigkeit ausdrückt.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: wer zu Gott kommt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet den Menschen, der sich Gott nähert. „Zu Gott kommt“ ist verständlich und bewahrt die Bewegung auf Gott hin.
- source_word: ὅτι ἔστιν
  choice: dass er existiert
  rationale: Die knappe griechische Wendung bekräftigt hier Gottes Wirklichkeit. „Existiert“ macht diesen Sinn im Deutschen eindeutig, während „dass er ist“ als wörtlichere Alternative erhalten bleibt.
- source_word: τοῖς ἐκζητοῦσιν αὐτόν
  choice: denen, die ihn ernsthaft suchen
  rationale: ἐκζητέω bezeichnet ein nachdrückliches, ernstliches Suchen; „ernsthaft“ gibt diese Verstärkung in natürlichem Deutsch wieder.
- source_word: μισθαποδότης γίνεται
  choice: zum Belohner wird
  rationale: μισθαποδότης bezeichnet jemanden, der Lohn beziehungsweise Belohnung gibt. „Zum Belohner wird“ bewahrt die verbale Kraft von γίνεται und lässt offen, ob der Ausdruck als „wird“, „erweist sich als“ oder idiomatisch „ist“ verstanden wird.
theological_decisions:
- issue: Bedeutung von πίστις in einem theologisch gewichtigen Zusammenhang
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Der unmittelbare Kontext erläutert πίστις durch πιστεῦσαι und legt daher menschliches Glauben beziehungsweise Vertrauen nahe. „Glauben“ ist im Haupttext etabliert und vermeidet hier die weniger wahrscheinliche Deutung „Treue“.
- issue: Aussage von ὅτι ἔστιν über Gott
  choice: dass er existiert
  alternative: dass er ist
  rationale: Die Wiedergabe benennt Gottes Wirklichkeit, ohne weiter festzulegen, welche philosophische oder dogmatische Aussage über sein Sein damit verbunden ist.
- issue: Kraft von γίνεται bei Gottes Belohnen
  choice: zum Belohner wird
  alternative: ein Belohner ist; sich als Belohner erweist
  rationale: Die gewählte Form wahrt das im Griechischen ausdrücklich verwendete γίνεται. Sie soll keine Veränderung in Gottes Wesen behaupten, sondern ausdrücken, als was Gott den ihn Suchenden begegnet beziehungsweise sich ihnen erweist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, ohne im Deutschen unnötig schwerfällig zu wirken. Die Fußnoten bewahren die relevanten lexikalischen und theologischen Spannungen.
