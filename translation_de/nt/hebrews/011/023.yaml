  source_fidelity: 'Der Entwurf gibt die Syntax und den Sinn des griechischen Textes zuverlässig wieder: Πίστει rahmt das Handeln der Eltern, Mose bleibt Objekt des Passivs, die Dauer von drei Monaten, die Wahrnehmung des Kindes und die Furchtlosigkeit gegenüber dem königlichen Erlass sind erhalten. „Eltern“ ist für τοὺς πατέρας αὐτοῦ im Kontext angemessen.'
