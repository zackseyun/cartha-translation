source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: de
  text: Durch Glauben wurde Mose nach seiner Geburt drei Monate lang von seinen Eltern verborgen, weil sie sahen, dass das Kind schön[a] war, und sich vor dem Erlass des Königs nicht fürchteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wohlgestaltet«, »außergewöhnlich«. Das griechische Wort ἀστεῖον begegnet auch in 2. Mose 2,2 und Apostelgeschichte 7,20.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet das Mittel und greift das wiederkehrende Leitmotiv von Hebräer 11 auf.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Die im modernen Standarddeutsch etablierte biblische Namensform.
- source_word: γεννηθεὶς
  choice: als er geboren war
  rationale: Das Aorist-Passiv-Partizip wird als temporaler Nebensatz wiedergegeben; die Vorzeitigkeit gegenüber dem dreimonatigen Verbergen bleibt erkennbar.
- source_word: ἐκρύβη
  choice: wurde … verborgen
  rationale: Die passive Form bewahrt Mose als denjenigen, den seine Eltern verbargen.
- source_word: τρίμηνον
  choice: drei Monate lang
  rationale: Natürliche deutsche Wiedergabe des Akkusativs der Zeitdauer.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: von seinen Eltern
  rationale: πατέρων bezeichnet hier im Zusammenhang kollektiv die Eltern; der Exodus-Hintergrund und die folgenden Pluralformen beziehen beide ein.
- source_word: διότι
  choice: weil
  rationale: Leitet unmittelbar die Begründung ihres Handelns ein.
- source_word: εἶδον
  choice: sie sahen
  rationale: Bewahrt die konkrete Wahrnehmung des Kindes.
- source_word: ἀστεῖον
  choice: schön
  rationale: Das Wort kann ein ansprechendes Äußeres und darüber hinaus besondere Vortrefflichkeit bezeichnen; „schön“ ist natürlich und entspricht dem Anklang an Exodus 2,2.
- source_word: τὸ παιδίον
  choice: das Kind
  rationale: Direkte, würdige Wiedergabe; „Baby“ wäre kontextuell möglich, aber stärker interpretierend.
- source_word: οὐκ ἐφοβήθησαν
  choice: sie fürchteten sich nicht
  rationale: Idiomatiche Wiedergabe von φοβέομαι, die den Gegensatz zwischen Glauben und Furcht erhält.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: der Erlass des Königs
  rationale: „Erlass“ vermittelt den amtlichen und verbindlichen Charakter der königlichen Anordnung in aktuellem Standarddeutsch.
theological_decisions:
- issue: Beweggrund der Eltern für das Verbergen Moses
  choice: Der Vers stellt ihr Handeln insgesamt unter den Glauben, nennt die Wahrnehmung des schönen Kindes und ihre Furchtlosigkeit gegenüber dem königlichen Erlass.
  alternative: Das Aussehen allein motivierte sie, oder es war ein besonderes göttliches Zeichen.
  rationale: Die Übersetzung erhält die syntaktische und theologische Spannung, ohne aus ἀστεῖον ein ausdrücklich übernatürliches Zeichen zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Formel Πίστει wird knapp mit „Durch Glauben“ wiedergegeben. Der Satzbau folgt dem griechischen Gedankengang, bleibt aber flüssig und allgemein verständlich.
