  text: ἕτεροι δὲ ἐμπαιγμῶν καὶ μαστίγων πεῖραν ἔλαβον, ἔτι δὲ δεσμῶν καὶ φυλακῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: de
  text: Andere wiederum mussten Spott und Auspeitschungen erdulden,[a] ja sogar Fesseln und Gefängnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Andere wiederum erfuhren die Erprobung durch Spott und Auspeitschungen, dazu auch durch Fesseln und Gefängnis.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Andere wiederum
  rationale: Bezeichnet eine weitere Gruppe innerhalb der Reihe von Glaubenszeugen und hebt den Gegensatz zu den zuvor Genannten natürlich hervor.
- source_word: ἐμπαιγμῶν
  choice: Spott
  rationale: Gibt öffentliche Verhöhnung in klarem, modernem Deutsch wieder und steht als Genitiv bei πεῖραν ἔλαβον.
- source_word: μαστίγων
  choice: Auspeitschungen
  rationale: Bezeichnet Schläge mit einer Peitsche oder Geißel; die Wahl ist anschaulich, präzise und heute allgemein verständlich.
- source_word: πεῖραν ἔλαβον
  choice: mussten … erdulden
  rationale: Die Wendung bedeutet wörtlich etwa »eine Erprobung/Probe erfahren«. »Erdulden« gibt hier idiomatisch wieder, dass die Genannten diese Leiden als schwere Prüfungen durchmachten.
- source_word: ἔτι δὲ
  choice: ja sogar
  rationale: Bewahrt die steigernde Kraft der Wendung gegenüber Spott und Auspeitschungen.
- source_word: δεσμῶν
  choice: Fesseln
  rationale: Bezeichnet konkrete Mittel der Gefangensetzung; »Fesseln« ist präzise und vermeidet die mögliche Einengung auf Ketten aus Metall.
- source_word: φυλακῆς
  choice: Gefängnis
  rationale: Kann den Gewahrsam beziehungsweise die Haft bezeichnen. In der festen Verbindung »Fesseln und Gefängnis« klingt das Substantiv natürlich und anschaulich.
