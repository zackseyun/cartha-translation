  source_fidelity: 'Der Entwurf gibt den griechischen Gedankengang insgesamt zuverlässig wieder: πλείονα θυσίαν wird angemessen als „ein besseres Opfer“ wiedergegeben, und die Alternative „größeres“ ist korrekt vermerkt. Die erste Relativkonstruktion δι’ ἧς bezieht sich auf θυσίαν und darf daher im Deutschen ausdrücklich auf das Opfer bezogen werden. Die abschließende Formulierung „dadurch“ wahrt, zusammen mit der Fußnote, die umstrittene beziehungsweise nicht völlig explizite Bezugnahme von δι’ αὐτῆς. Die konzessive Wiedergabe von ἀποθανών ist ebenfalls sachgerecht.'
  naturalness: „Erhielt er das Zeugnis, dass er gerecht war“ ist verständlich, aber etwas schwerfällig und lässt den im anschließenden Genitivus absolutus genannten göttlichen Zeugen erst nachträglich erkennen. „Wurde ihm bezeugt, dass er gerecht war“ ist idiomatischer, bewahrt das Zeugniswortfeld und lässt sich mit „wobei Gott hinsichtlich seiner Gaben Zeugnis ablegte“ klarer verbinden. „Hinsichtlich“ ist bei diesem Register präziser als das etwas umgangssprachlichere „über“.
  terminology: „Glaube“, „Opfer darbringen“, „gerecht“ und „Zeugnis ablegen“ sind im modernen bibelsprachlichen Standarddeutsch treffend. Die Wiedergabe von δῶρα als „Gaben“ ist möglich und bewahrt die lexikalische Weite gegenüber dem bereits verwendeten „Opfer“.
