source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: de
  text: Durch Glauben brachte Abel Gott ein besseres Opfer dar als Kain[a]. Durch dieses Opfer wurde ihm bezeugt, dass er gerecht war, wobei Gott hinsichtlich seiner Gaben Zeugnis ablegte. Und dadurch redet er noch, obwohl er gestorben ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein größeres Opfer«. Der Komparativ kann die Qualität (»besser«) oder den Umfang (»größer«) hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: »Dadurch« kann sich auf Abels Glauben oder auf sein Opfer beziehen; das Griechische legt den Bezug nicht völlig eindeutig fest.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet hier das Mittel. »Glaube« entspricht dem Leitbegriff des Kapitels und beschreibt Abels vertrauende Hinwendung zu Gott.
- source_word: πλείονα θυσίαν
  choice: ein besseres Opfer
  rationale: πλείων kann sowohl qualitative Überlegenheit als auch größere Menge bezeichnen. Im Zusammenhang liegt »besser« nahe; die mögliche Bedeutung »größer« bleibt in einer Fußnote erhalten.
- source_word: παρὰ Κάϊν
  choice: als Kain
  rationale: παρά nach einem Komparativ kennzeichnet den Vergleichsmaßstab. Die knappe Form lässt wie im Griechischen unausgesprochen, dass Kains Opfer gemeint ist.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: brachte … Gott … dar
  rationale: »darbringen« ist im Deutschen die natürliche kultische Wiedergabe von προσφέρω und wahrt den Opferzusammenhang.
- source_word: δι’ ἧς
  choice: Durch dieses Opfer
  rationale: Das feminine Relativpronomen bezieht sich grammatisch am nächsten und eindeutig auf θυσίαν. Wegen des deutschen Neutrums »Opfer« wird der Bezug ausdrücklich wiederholt.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: erhielt er das Zeugnis, dass er gerecht war
  rationale: Die Formulierung gibt das Passiv idiomatisch wieder und bewahrt zugleich das für Hebräer 11 wichtige Wortfeld von Zeugnis und Bezeugen.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: indem Gott über seine Gaben Zeugnis ablegte
  rationale: Der Genitivus absolutus wird als begleitender Umstand wiedergegeben. »über seine Gaben« wahrt den Bezug von ἐπί auf die dargebrachten Gaben, ohne eine kausale Deutung hinzuzufügen.
- source_word: δι’ αὐτῆς
  choice: dadurch
  rationale: Das adverbiale Pronomen lässt im Deutschen offen, ob sich die Aussage auf Abels Glauben oder sein Opfer bezieht, und bewahrt so die Mehrdeutigkeit des Griechischen.
- source_word: ἀποθανὼν
  choice: obwohl er gestorben ist
  rationale: Die konzessive Wiedergabe bringt den beabsichtigten Gegensatz zum fortdauernden Reden natürlich zum Ausdruck.
- source_word: ἔτι λαλεῖ
  choice: redet er noch
  rationale: Das Präsens mit ἔτι bezeichnet die bis in die Gegenwart fortdauernde Wirkung von Abels Zeugnis.
theological_decisions:
- issue: Bezugswort von δι’ αὐτῆς im letzten Satz
  choice: Im Haupttext durch das unbestimmte »dadurch« offengelassen
  alternative: durch den Glauben; durch das Opfer
  rationale: Das feminine Pronomen kann thematisch auf πίστις (Glaube) oder aufgrund eines näheren Bezugs auf θυσία (Opfer) zurückweisen. Der Text entscheidet diese theologisch bedeutsame Spannung nicht eindeutig.
- issue: Bedeutung des passiven ἐμαρτυρήθη
  choice: »erhielt er das Zeugnis«
  alternative: »wurde ihm bestätigt«; »wurde er als gerecht bezeugt«
  rationale: Die gewählte Form ist natürliches Deutsch, wahrt den Zeugnisgedanken und vermeidet sowohl eine unbeholfene Lehnübersetzung als auch das stärker wertende »wurde anerkannt«.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Darbringen« und »Zeugnis ablegen« erhalten den kultischen beziehungsweise forensischen Wortklang, ohne altertümlich zu wirken. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber für natürliche deutsche Lesbarkeit gegliedert.
