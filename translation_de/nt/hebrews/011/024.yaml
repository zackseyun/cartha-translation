base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: de
  text: Durch Glauben weigerte sich Mose[a], als er erwachsen war, Sohn der Tochter des Pharaos genannt zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch Treue“ oder „Durch Vertrauen“; griechisch πίστει. Der Haupttext folgt der wiederkehrenden Formel dieses Kapitels: „Durch Glauben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet hier Mittel oder Grundlage. Die wiederkehrende Formel in Hebräer 11 wird im Deutschen treffend und einheitlich mit „Durch Glauben“ wiedergegeben.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Eingebürgerte deutsche Namensform.
- source_word: μέγας γενόμενος
  choice: als er erwachsen war
  rationale: Die Wendung bezeichnet in diesem Zusammenhang das Erreichen des Erwachsenenalters, nicht Größe oder hohen Rang. Die temporale Formulierung ist natürlich und präzise.
- source_word: ἠρνήσατο
  choice: weigerte sich
  rationale: Das Verb bezeichnet hier die bewusste Ablehnung einer Bezeichnung beziehungsweise gesellschaftlichen Identität; mit dem Infinitiv ist „sich weigern“ idiomatisch.
- source_word: λέγεσθαι
  choice: genannt zu werden
  rationale: Direkte Wiedergabe des passiven Infinitivs.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: Sohn der Tochter des Pharaos
  rationale: Die artikellose Prädikatsbezeichnung verweist im Kontext auf Moses bestimmte zugeschriebene Stellung. Im Deutschen ist die Form ohne Artikel nach „genannt werden“ natürlich.
- source_word: Φαραώ
  choice: Pharao
  rationale: Eingebürgerte deutsche Form des ägyptischen Herrschertitels.
theological_decisions:
- issue: Wiedergabe von πίστις in der wiederkehrenden Formel von Hebräer 11
  choice: Glauben
  alternative: Treue; Vertrauen
  rationale: Der Kontext des Kapitels betont Handlungen, die aus Glauben erfolgen; „Durch Glauben“ bewahrt zudem die wiederkehrende Formel. Die grundsätzlich möglichen Bedeutungsnuancen „Treue“ und „Vertrauen“ werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung folgt natürlichem Deutsch, während die griechische Mittelangabe und der zeitliche Nebensatz klar erhalten bleiben.
