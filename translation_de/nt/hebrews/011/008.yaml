id: HEB.11.8
reference: Hebrews 11:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: de
  text: Durch Glauben gehorchte Abraham, als er gerufen wurde, und zog aus zu einem Ort, den er als Erbe empfangen sollte. Er zog aus, ohne zu wissen, wohin er ging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Durch Glauben
  rationale: Der instrumentale Dativ bezeichnet den Glauben als Grundlage beziehungsweise Mittel von Abrahams Gehorsam. „Durch Glauben“ entspricht zudem dem Leitmotiv des Abschnitts.
- source_word: καλούμενος
  choice: als er gerufen wurde
  rationale: Das passive Präsenspartizip wird als zeitlicher Begleitumstand wiedergegeben, ohne eine genauere zeitliche Abfolge festzulegen.
- source_word: ὑπήκουσεν
  choice: gehorchte
  rationale: Das Verb bezeichnet das Befolgen eines Rufes oder einer Weisung; „gehorchte“ ist direkt, verständlich und semantisch präzise.
- source_word: ἐξελθεῖν / ἐξῆλθεν
  choice: zog aus / Er zog aus
  rationale: „Ausziehen“ passt zu Abrahams Aufbruch und bewahrt die auffällige Wiederholung desselben griechischen Verbstamms. Die Beiordnung nach „gehorchte“ ergibt im Deutschen einen natürlichen Satz.
- source_word: τόπον
  choice: einem Ort
  rationale: Der Zielort ist an dieser Stelle noch unbestimmt. Daher ist die indefinite Wiedergabe sachgerecht.
- source_word: ἤμελλεν λαμβάνειν
  choice: den er … empfangen sollte
  rationale: Die Fügung bezeichnet hier zukünftiges Geschehen. „Sollte“ gibt diese Zukunft aus der damaligen Erzählperspektive wieder, ohne ausdrücklich eine Vorherbestimmung zu behaupten.
- source_word: εἰς κληρονομίαν
  choice: als Erbe
  rationale: Die Wendung bezeichnet den Ort als das, was Abraham erben beziehungsweise als Erbbesitz empfangen würde. „Als Erbe“ ist knapp und natürlich.
- source_word: μὴ ἐπιστάμενος
  choice: ohne zu wissen
  rationale: Die negative Partizipialkonstruktion bezeichnet einen begleitenden Umstand und wird idiomatisch wiedergegeben.
- source_word: ποῦ ἔρχεται
  choice: wohin er ging
  rationale: Im Kontext bezeichnet ἔρχεται die unbekannte Zielrichtung. Das deutsche „wohin er ging“ ist idiomatisch und fügt sich in die vergangene Erzählperspektive ein.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Im Zusammenhang steht Abrahams vertrauende Reaktion auf Gottes Ruf im Vordergrund. „Glauben“ bewahrt zugleich den zentralen Begriff, der den ganzen Abschnitt strukturiert.
- issue: Bedeutungsnuance von ἤμελλεν λαμβάνειν
  choice: empfangen sollte
  alternative: empfangen würde; zu empfangen bestimmt war
  rationale: Die gewählte Formulierung drückt die aus damaliger Sicht zukünftige Inbesitznahme aus, ohne die Wendung unnötig als Aussage über Vorherbestimmung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Wiederholung von „zog aus“ ist bewusst beibehalten, weil auch der griechische Text ἐξελθεῖν und ἐξῆλθεν wiederholt. Keine Fußnote ist erforderlich.
