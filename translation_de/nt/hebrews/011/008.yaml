  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Πίστει als instrumentales „Durch Glauben“, καλούμενος als begleitender zeitlicher Umstand, ὑπήκουσεν mit dem Auszug als Gehorsamshandlung, der noch unbestimmte Ort, der künftige Empfang als Erbe, sowie das Nichtwissen über das Ziel. Die bewusste Wiederholung von „zog aus“ entspricht ἐξελθεῖν … ἐξῆλθεν. „Wohin er ging“ ist im Kontext eine idiomatische Wiedergabe von ποῦ ἔρχεται.'
  naturalness: Modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Die Koordination „gehorchte … und zog aus“ ist im Deutschen deutlich natürlicher als eine künstliche Infinitivkonstruktion und bewahrt den sachlichen Zusammenhang. „Als Erbe empfangen“ ist in diesem Kontext als Empfang eines Erbteils verständlich.
  terminology: „Glauben“ folgt dem Leitbegriff des Abschnitts und ist hier treffend. „Erbe“ gibt κληρονομία angemessen wieder, ohne ein nicht ausgedrücktes Possessivpronomen oder eine konfessionell geprägte Deutung hinzuzufügen. Namen und sonstige Schlüsselbegriffe sind korrekt.
