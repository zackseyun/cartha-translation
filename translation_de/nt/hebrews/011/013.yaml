source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: de
  text: Alle diese starben im Glauben, ohne die Verheißungen empfangen zu haben; sie sahen sie jedoch von fern und begrüßten sie[a] und bekannten, dass sie Fremde und vorübergehende Bewohner[b] auf der Erde seien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „willkommen hießen“ oder „umarmten“. Das griechische Verb bedeutet gewöhnlich „begrüßen“ und wird hier bildlich auf die aus der Ferne gesehenen Verheißungen bezogen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gäste auf Zeit“ oder „ansässige Fremde“. Gemeint sind Menschen, die an einem Ort leben, ohne dort dauerhaft beheimatet zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: Im Glauben
  rationale: Die Wendung bezeichnet hier die Haltung beziehungsweise den Bereich des Glaubens, in dem die Genannten starben. „Im Glauben“ ist im Deutschen natürlich und lässt die mögliche Nuance von „dem Glauben gemäß“ bestehen.
- source_word: ἀπέθανον οὗτοι πάντες
  choice: starben sie alle
  rationale: Die schlichte Formulierung gibt das Verb direkt wieder; das Pronomen verweist auf die zuvor genannten Glaubenszeugen.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: Sie hatten die Verheißungen nicht empfangen
  rationale: Der eigenständige Satz bildet das vorzeitige Partizip in verständlichem Deutsch ab und bewahrt den ausdrücklich verwendeten Plural „Verheißungen“.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: sie nur von fern gesehen
  rationale: „Von fern“ erhält das räumlich-bildhafte Moment. „Nur“ verdeutlicht idiomatisch den Gegensatz zum Nichtempfangen, ohne den Aussagegehalt zu verändern.
- source_word: ἀσπασάμενοι
  choice: begrüßt
  rationale: Das Verb bedeutet grundsätzlich „begrüßen“ oder „willkommen heißen“. Mit den Verheißungen als Objekt bleibt „begrüßt“ bewusst bildhaft und quellennah.
- source_word: ὁμολογήσαντες
  choice: bekannten
  rationale: „Bekennen“ gibt die offene Erklärung oder Anerkennung wieder und bewahrt den gewichtigen Ton des griechischen Verbs.
- source_word: ξένοι
  choice: Fremde
  rationale: „Fremde“ bezeichnet Menschen, die an einem Ort nicht heimisch sind, und ist im heutigen Deutsch klar verständlich.
- source_word: παρεπίδημοί
  choice: vorübergehend Ansässige
  rationale: Der Ausdruck bezeichnet Personen, die sich an einem Ort aufhalten, ohne dort dauerhaft beheimatet zu sein. Diese Wiedergabe vermeidet die zusätzliche Zwangs- oder Vertreibungsnuance von „Exilanten“.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Im Kontext ist die umfassende menschliche Existenz auf der Erde gemeint; „im Land“ würde die Aussage unnötig auf ein bestimmtes Gebiet verengen.
theological_decisions:
- issue: Bedeutung von πίστις in Κατὰ πίστιν
  choice: Glauben
  alternative: Treue; Vertrauen
  rationale: Der Zusammenhang beschreibt die vertrauende Haltung der Glaubenszeugen bis zum Tod. „Glauben“ bewahrt den zentralen Begriff, ohne ihn einseitig als menschliche Treue oder rein psychologisches Vertrauen auszulegen.
- issue: Bildhafte Reaktion auf die noch unerfüllten Verheißungen
  choice: begrüßt
  alternative: willkommen geheißen; sich zu eigen gemacht
  rationale: „Begrüßt“ erhält das Bild, dass die Verheißungen aus der Ferne wahrgenommen und bejaht werden. „Sich zu eigen gemacht“ würde eine stärkere Aneignung behaupten, obwohl der Vers gerade sagt, dass sie sie nicht empfangen hatten.
- issue: Status der Glaubenszeugen auf der Erde
  choice: Fremde und vorübergehend Ansässige
  alternative: Fremde und Exilanten; Fremde und Gäste
  rationale: Die gewählte Fassung beschreibt fehlende dauerhafte Zugehörigkeit, ohne zwingend Vertreibung („Exilanten“) oder die soziale Rolle eingeladener Besucher („Gäste“) einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Partizipialkonstruktion wird zur besseren Verständlichkeit in drei Sätze gegliedert. Die Bildsprache des Begrüßens bleibt erhalten; weniger geläufige soziale Statusbegriffe werden in der Hauptfassung verständlich und in einer Fußnote näher erläutert.
