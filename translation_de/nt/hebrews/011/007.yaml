language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: de
  text: Durch Glauben baute Noah, nachdem er über Dinge gewarnt worden war, die noch nicht zu sehen waren[a], in ehrfürchtiger Scheu[b] eine Arche zur Rettung seines Hauses. Durch sie[c] verurteilte er die Welt und wurde Erbe der Gerechtigkeit gemäß dem Glauben[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Verb kann auch bedeuten: „nachdem er eine göttliche Weisung erhalten hatte“ oder „nachdem er eine göttliche Warnung empfangen hatte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von Gottesfurcht bewegt“ beziehungsweise „in ehrfürchtiger Vorsicht“.'
    reason: lexical_alternative
  - marker: c
    text: „Durch sie“ bezieht sich grammatisch am ehesten auf die Arche; manche verstehen die Wendung weiter als Hinweis auf Noahs Glauben oder seinen glaubenden Gehorsam.
    reason: alternative_reading
  - marker: d
    text: 'Wörtlich: „der Gerechtigkeit gemäß dem Glauben“. Möglich ist auch: „der Gerechtigkeit aus Glauben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der instrumentale Dativ eröffnet wie wiederholt in Hebräer 11 den Satz und bezeichnet den Glauben als bestimmendes Mittel beziehungsweise Prinzip von Noahs Handeln.
- source_word: χρηματισθεὶς
  choice: nachdem er gewarnt worden war
  rationale: Das passive Partizip bezeichnet hier den Empfang einer göttlichen Mitteilung mit Warncharakter. Die Übersetzung bewahrt den Warnsinn, ohne den im Griechischen nur implizierten Urheber ausdrücklich in den Haupttext einzufügen.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: vor dem, was noch nicht zu sehen war
  rationale: Die Formulierung gibt sowohl den Bezug der Warnung als auch die zeitliche Bedeutung von μηδέπω wieder und bleibt im Deutschen natürlich.
- source_word: εὐλαβηθεὶς
  choice: in ehrfürchtiger Scheu
  rationale: Die Wendung verbindet vorsichtige Furcht mit religiöser Ehrfurcht und reduziert Noahs Reaktion weder auf bloßen Schrecken noch auf eine rein verstandesmäßige Vorsicht.
- source_word: κατεσκεύασεν
  choice: baute
  rationale: Im Zusammenhang mit der Arche ist „baute“ die natürliche und präzise deutsche Wiedergabe des zielgerichteten Herstellens.
- source_word: κιβωτὸν
  choice: eine Arche
  rationale: „Arche“ ist im Noahzusammenhang die etablierte und eindeutige deutsche Entsprechung.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: zur Rettung seiner Hausgemeinschaft
  rationale: „Rettung“ erfasst hier die konkrete Bewahrung; „Hausgemeinschaft“ wahrt den Umfang von οἶκος besser als das möglicherweise engere „Familie“ und vermeidet die sachliche Bedeutung eines Gebäudes.
- source_word: δι’ ἧς
  choice: Durch sie
  rationale: Das feminine Relativpronomen bezieht sich grammatisch am ehesten auf die Arche. Das deutsche Pronomen bewahrt diesen naheliegenden Bezug knapp und lesbar.
- source_word: κατέκρινεν τὸν κόσμον
  choice: verurteilte er die Welt
  rationale: 'Die direkte Wiedergabe bewahrt die starke Gerichtssprache: Noahs glaubender Gehorsam ließ den Unglauben der Welt als verurteilungswürdig hervortreten.'
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: der Gerechtigkeit gemäß dem Glauben
  rationale: Die Formulierung erhält die offene Verhältnisbestimmung durch κατά und vermeidet es, sie vorschnell als Ursprung („aus Glauben“) oder ausschließlich als Mittel zu bestimmen.
- source_word: ἐγένετο κληρονόμος
  choice: wurde Erbe
  rationale: Dies ist eine knappe und idiomatische Wiedergabe des entstandenen beziehungsweise erlangten Status.
theological_decisions:
- issue: Bedeutung von χρηματισθεὶς und Benennung Gottes als Urheber
  choice: nachdem er gewarnt worden war
  alternative: nachdem er eine göttliche Weisung oder Warnung empfangen hatte
  rationale: Der göttliche Ursprung ist im Verb und im Noahkontext nahegelegt, aber im griechischen Satz nicht ausdrücklich genannt. Der Haupttext wahrt diese Implizitheit; die Fußnote macht die Bedeutungsbreite sichtbar.
- issue: Nuance von εὐλαβηθεὶς
  choice: in ehrfürchtiger Scheu
  alternative: von Gottesfurcht bewegt; aus vorsichtiger Besorgnis
  rationale: Die gewählte Fassung hält Ehrfurcht, Furcht und daraus folgendes umsichtiges Handeln zusammen, ohne eine Seite auszublenden.
- issue: Bezugswort von δι’ ἧς
  choice: Durch sie, bezogen auf die Arche
  alternative: durch den Glauben oder durch Noahs glaubenden Gehorsam
  rationale: Genus und unmittelbare syntaktische Nähe sprechen am stärksten für κιβωτός. Da ein weiterer Bezug auf Noahs gesamte Glaubensantwort vertreten wird, bleibt diese Möglichkeit in der Fußnote erhalten.
- issue: Verhältnis von Gerechtigkeit und Glauben in κατὰ πίστιν
  choice: Gerechtigkeit gemäß dem Glauben
  alternative: Gerechtigkeit aus Glauben; Gerechtigkeit durch Glauben
  rationale: „Gemäß“ bildet κατά formal ab und bewahrt die theologische Offenheit des Verhältnisses, statt Ursache oder Mittel eindeutiger festzulegen, als es der Ausgangstext tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Hausgemeinschaft“ ist bewusst etwas formeller, aber präziser als „Familie“ und weniger missverständlich als „Haus“. Die Wendung „gemäß dem Glauben“ bewahrt die markierte griechische Ausdrucksweise und ihre theologische Offenheit.
