revisions:
- from: Durch Glauben baute Noah, nachdem er vor dem gewarnt worden war, was noch nicht zu sehen war[a], in ehrfürchtiger Scheu[b] eine Arche zur Rettung seiner Hausgemeinschaft. Durch sie[c] verurteilte er die Welt und wurde Erbe der Gerechtigkeit gemäß dem Glauben[d].
  to: Durch Glauben baute Noah, nachdem er über Dinge gewarnt worden war, die noch nicht zu sehen waren[a], in ehrfürchtiger Scheu[b] eine Arche zur Rettung seines Hauses. Durch sie[c] verurteilte er die Welt und wurde Erbe der Gerechtigkeit gemäß dem Glauben[d].
  rationale: Die Revision glättet die deutsche Syntax und gibt den Gegenstandsbezug von περί sowie den Plural von τῶν μηδέπω βλεπομένων genauer wieder. „Seines Hauses“ ist für οἶκος idiomatischer als „seiner Hausgemeinschaft“, ohne den Umfang auf die Kernfamilie einzuengen. Die Ambiguität des göttlichen Urhebers bei χρηματισθείς und des Bezugs von δι’ ἧς bleibt gewahrt und ist in den Fußnoten dokumentiert.
