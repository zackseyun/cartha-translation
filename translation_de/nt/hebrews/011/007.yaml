  source_fidelity: 'Der Entwurf gibt Satzstruktur und wesentliche Begriffe des griechischen Textes insgesamt zuverlässig wieder: πίστις, die noch nicht sichtbaren Dinge, die Arche, Rettung des οἶκος, Verurteilung der Welt und die Gerechtigkeit gemäß Glauben. Die Formulierung „vor dem gewarnt worden war, was noch nicht zu sehen war“ verschiebt jedoch den mit περί ausgedrückten Gegenstandsbezug unnötig in eine Warnung vor einer Gefahr und ist syntaktisch holprig. „Über Dinge gewarnt worden war, die noch nicht zu sehen waren“ bildet den Bezug und den Plural des Neutrums klarer ab, ohne den impliziten göttlichen Urheber im Haupttext zu ergänzen.'
  naturalness: „Hausgemeinschaft“ ist verständlich, wirkt im heutigen Standarddeutsch aber verwaltungssprachlich. „Seines Hauses“ ist in diesem gehobenen biblischen Register idiomatisch und kann, wie οἶκος, den Haushalt einschließlich der darin Lebenden bezeichnen. Die übrige Satzführung bleibt klar und würdig.
  terminology: „Durch Glauben“, „Arche“, „Gerechtigkeit gemäß dem Glauben“ und „Erbe“ sind sachgerecht. „Ehrfürchtige Scheu“ bewahrt die religiös geprägte Furcht von εὐλαβηθεὶς ohne sie auf bloße Angst zu reduzieren. Die Fußnoten verorten die lexikalischen und syntaktischen Alternativen angemessen.
