  source_fidelity: „Denn durch diesen Glauben fanden die Menschen früherer Zeiten Anerkennung“ gibt ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι inhaltlich zutreffend wieder. „Durch diesen Glauben“ stellt den im Kontext klaren Rückbezug auf πίστις her und gibt den instrumentalen Sinn angemessen wieder. „Fanden … Anerkennung“ wahrt den passivisch-empfangenden Charakter von ἐμαρτυρήθησαν, ohne den im griechischen Satz nicht genannten Bezeugenden zu ergänzen. „Menschen früherer Zeiten“ trifft die kontextuelle Bedeutung von οἱ πρεσβύτεροι und vermeidet die im Deutschen naheliegende Amtsassoziation von „Älteste“.
  naturalness: Der Satz ist knapp, flüssig und modernes, würdiges Standarddeutsch. Die Verbindung mit „Denn“ ist idiomatisch und bildet die argumentative Funktion von γάρ ab.
  terminology: Die gewählten Begriffe sind kontextgerecht. „Anerkennung“ ist eine natürliche Wiedergabe für das günstige Zeugnis beziehungsweise die Anerkennung, die μαρτυρέω hier bezeichnet. Die Fußnoten bieten passende lexikalische Alternativen; ihre Anker stehen bei den jeweils erläuterten Ausdrücken.
