  text: ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/002.yaml
  text: For by this the elders received approval[a][b][c].
translation:
  language: de
  text: Denn durch diesen Glauben fanden die Menschen früherer Zeiten Anerkennung[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wurden bezeugt«; gemeint ist, dass sie ein günstiges Zeugnis erhielten oder Anerkennung fanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Alten« beziehungsweise »die Menschen der Vorzeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: durch diesen Glauben
  rationale: Die feminine Singularform ταύτῃ verweist im unmittelbaren Zusammenhang natürlich auf πίστις in Vers 1. Das deutsche „durch“ gibt den instrumentalen Sinn wieder; die ausdrückliche Wiederaufnahme von „Glauben“ verhindert einen unklaren demonstrativen Verweis.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet beziehungsweise erläutert die vorausgehende Aussage und wird mit dem natürlichen deutschen Anschluss „Denn“ wiedergegeben.
- source_word: ἐμαρτυρήθησαν
  choice: fanden … Anerkennung
  rationale: Der Aorist Passiv von μαρτυρέω bezeichnet hier, dass jemand ein günstiges Zeugnis erhält. „Anerkennung finden“ bewahrt den empfangenden Sinn und klingt im modernen Deutsch natürlich, ohne den im Vers nicht ausdrücklich genannten Urheber des Zeugnisses einzufügen.
- source_word: οἱ πρεσβύτεροι
  choice: die Menschen früherer Zeiten
  rationale: Im Kontext bezeichnet πρεσβύτεροι nicht ein Gemeindeamt, sondern die Glaubenden vergangener Generationen, die anschließend genannt werden. Die Wiedergabe vermeidet das im Deutschen naheliegende Missverständnis von „die Ältesten“ als Amtsträger.
theological_decisions:
- issue: Bezug von ταύτῃ
  choice: Der Ausdruck wird ausdrücklich auf den Glauben aus Vers 1 bezogen.
  alternative: Das Demonstrativpronomen könnte allgemeiner auf die unmittelbar zuvor beschriebene Wirklichkeit verweisen.
  rationale: Genus, Numerus und Kontext sprechen deutlich für πίστις als Bezugswort. Die deutsche Wiederaufnahme „durch diesen Glauben“ macht die ohnehin starke syntaktische Verbindung verständlich, ohne eine zusätzliche theologische Aussage einzuführen.
- issue: Urheber des günstigen Zeugnisses
  choice: Der Urheber wird im Haupttext nicht ausdrücklich als Gott bezeichnet.
  alternative: „Von Gott Anerkennung finden“ beziehungsweise „von Gott ein gutes Zeugnis erhalten“.
  rationale: Der weitere Kapitelzusammenhang legt Gottes bestätigendes Zeugnis nahe, doch der griechische Satz nennt den Handelnden nicht. Die Übersetzung bewahrt diese formale Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschen früherer Zeiten“ ist allgemein verständlich und verhindert, dass οἱ πρεσβύτεροι fälschlich als Amtsbezeichnung verstanden wird. Die Satzstellung bleibt knapp und folgt der argumentativen Verbindung des griechischen Textes.
