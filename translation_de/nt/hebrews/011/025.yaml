  verdict: approve
  source_fidelity: Die Übersetzung bildet die Vergleichsstruktur μᾶλλον … ἢ präzise ab. „entschied sich lieber dafür“ gibt das bewusste, personale Wählen von ἑλόμενος angemessen wieder; „zusammen mit dem Volk Gottes misshandelt zu werden“ wahrt sowohl Passiv als auch Solidaritätsaspekt von συγκακουχεῖσθαι. „den vergänglichen Genuss der Sünde zu haben“ erhält die offene Genitivverbindung ἁμαρτίας ἀπόλαυσιν und unterscheidet sinnvoll zwischen ἔχειν und ἀπόλαυσις.
  naturalness: Der Satz ist modernes, würdevolles Standarddeutsch und funktioniert als Anschluss an den vorherigen Vers. „Genuss der Sünde zu haben“ ist etwas formal, aber verständlich und für eine optimal-äquivalente Übersetzung bewusst vertretbar. „Vergänglich“ ist im Kontext natürlich und gibt die begrenzte Dauer von πρόσκαιρον ausreichend wieder.
  terminology: „Volk Gottes“ ist die etablierte und quellennah passende Wiedergabe. Die Begriffe „Sünde“ und „Genuss“ sind sachgerecht; die Übersetzung legt weder die konkrete Natur der Sünde noch eine konfessionelle Deutung fest.
