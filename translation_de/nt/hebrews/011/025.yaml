  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: de
  text: und entschied sich lieber dafür, zusammen mit dem Volk Gottes misshandelt zu werden, als den vergänglichen Genuss der Sünde zu haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als sich eine Zeit lang am Genuss der Sünde zu erfreuen“.'
    reason: Lexikalische Alternative für πρόσκαιρον und eine idiomatischere Wiedergabe der Verbindung mit ἔχειν.
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: und entschied sich lieber dafür
  rationale: Das aoristische Medium bezeichnet Moses bewusste eigene Wahl; „lieber“ bildet die mit ἢ eingeleitete Gegenüberstellung natürlich ab. Das „und“ bindet das Partizip an den vorausgehenden Vers an.
- source_word: συγκακουχεῖσθαι
  choice: zusammen … misshandelt zu werden
  rationale: Die Wiedergabe wahrt sowohl den passiven Sinn des Erleidens von Misshandlung als auch die durch συν- ausgedrückte Solidarität.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: mit dem Volk Gottes
  rationale: Die geläufige und würdevolle Wendung bewahrt die genitivische Struktur des Griechischen.
- source_word: πρόσκαιρον
  choice: vergänglichen
  rationale: Das Wort bezeichnet etwas, das nur eine begrenzte Zeit besteht; „vergänglich“ ist im Deutschen natürlich und hebt die kurze Dauer hervor.
- source_word: ἔχειν
  choice: zu haben
  rationale: Die schlichte Bedeutung von ἔχειν bleibt erhalten, ohne sie zusätzlich als „genießen“ auszudeuten.
- source_word: ἁμαρτίας ἀπόλαυσιν
  choice: den vergänglichen Genuss der Sünde
  rationale: „Genuss“ gibt ἀπόλαυσις wieder; „der Sünde“ erhält die semantisch offene Genitivverbindung, ohne bestimmte sündige Handlungen festzulegen.
theological_decisions:
- issue: Worin der Genuss der Sünde konkret bestand
  choice: Die Formulierung bleibt allgemein und bezeichnet den kurzzeitigen Genuss, der mit Sünde verbunden ist.
  alternative: Sie ausdrücklich auf die Vorrechte und Kompromisse am Hof des Pharaos oder allgemein auf die sündigen Freuden Ägyptens zu beziehen.
  rationale: Der griechische Text bestimmt die konkreten Sünden nicht und stellt lediglich die Solidarität mit Gottes Volk dem zeitlich begrenzten Genuss der Sünde gegenüber.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanschluss mit „und“ berücksichtigt, dass das griechische Partizip Moses aus dem vorherigen Vers weiter beschreibt. Die ungewöhnliche, aber verständliche Wendung „Genuss der Sünde zu haben“ bewahrt bewusst die formale Unterscheidung zwischen ἔχειν und ἀπόλαυσις.
