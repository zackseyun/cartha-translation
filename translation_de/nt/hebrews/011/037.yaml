  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: de
  text: Sie wurden gesteinigt, sie wurden entzwei gesägt, sie starben durch Schwertgewalt[a]; sie zogen in Schafsfellen und Ziegenhäuten umher, litten Mangel, wurden bedrängt und misshandelt –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie starben durch das Schwert“. Wörtlicher enthält die griechische Wendung ein Wort für gewaltsames Töten oder Blutvergießen (ἐν φόνῳ μαχαίρης) und betont so die Gewalt ihres Todes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: sie wurden gesteinigt
  rationale: Die passive Form von λιθάζω wird unmittelbar und ohne den nicht ausdrücklich genannten Zusatz „getötet“ wiedergegeben.
- source_word: ἐπρίσθησαν
  choice: sie wurden entzweigesägt
  rationale: Die passive Form von πρίζω bezeichnet das Zersägen; „entzweigesägt“ gibt den wahrscheinlich gemeinten gewaltsamen Vorgang prägnant wieder.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: sie starben durch das mörderische Schwert
  rationale: „Sie starben“ entspricht ἀπέθανον. Das Adjektiv „mörderische“ bewahrt möglichst idiomatisch die verstärkende Gewaltkomponente von φόνος, ohne die Wendung als aktives „man tötete sie“ umzudeuten.
- source_word: περιῆλθον
  choice: sie zogen … umher
  rationale: περιέρχομαι beschreibt hier das Umherziehen von Ort zu Ort; die deutsche Wendung ist natürlich und lässt offen, wie ziel- oder heimatlos die Bewegung war.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: in Schafsfellen und Ziegenhäuten
  rationale: Die konkreten Kleidungs- beziehungsweise Fellbezeichnungen und ihre parallele Struktur bleiben erhalten.
- source_word: ὑστερούμενοι
  choice: litten Mangel
  rationale: Das Partizip bezeichnet das Entbehren des Nötigen; „Mangel leiden“ vermittelt dies in natürlichem, würdevollem Deutsch.
- source_word: θλιβόμενοι
  choice: wurden bedrängt
  rationale: Die passive Form bezeichnet Bedrängnis oder Druck und wird bewusst nicht auf eine bestimmte Art der Verfolgung verengt.
- source_word: κακουχούμενοι
  choice: misshandelt
  rationale: Das Wort bezeichnet schlechte beziehungsweise grausame Behandlung; „misshandelt“ ist im heutigen Deutsch klar und kontextgemäß.
theological_decisions:
- issue: Gewaltgrad der Wendung ἐν φόνῳ μαχαίρης
  choice: durch das mörderische Schwert
  alternative: durch das Schwert
  rationale: φόνος verstärkt die Aussage über eine bloße instrumentale Angabe hinaus in Richtung gewaltsamen Tötens. Die Hauptfassung erhält diese Nuance, während die knappere und idiomatischere Lesart in der Fußnote genannt wird.
- issue: Art des Umherziehens in περιῆλθον
  choice: sie zogen … umher
  alternative: sie irrten … umher
  rationale: Der griechische Ausdruck bezeichnet Bewegung von Ort zu Ort, macht aber Heimatlosigkeit oder Orientierungslosigkeit nicht ausdrücklich; „zogen umher“ wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rhythmischer Reihung. Die passiven Verbformen und die Härte des Leidenskatalogs bleiben erhalten. Der Gedankenstrich am Ende zeigt, dass der Satz in Vers 38 weitergeführt wird.
