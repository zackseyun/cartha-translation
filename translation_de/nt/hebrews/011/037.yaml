revisions:
- from: Sie wurden gesteinigt, sie wurden entzweigesägt, sie starben durch das mörderische Schwert[a]; sie zogen in Schafsfellen und Ziegenhäuten umher, litten Mangel, wurden bedrängt und misshandelt –
  to: Sie wurden gesteinigt, sie wurden entzwei gesägt, sie starben durch Schwertgewalt[a]; sie zogen in Schafsfellen und Ziegenhäuten umher, litten Mangel, wurden bedrängt und misshandelt –
  rationale: Die Revision ersetzt die unidiomatische und semantisch verschiebende Formulierung „mörderische[s] Schwert“ durch „Schwertgewalt“, wodurch sowohl der Tod durch das Schwert als auch die durch φόνος hervorgehobene Gewaltsamkeit erhalten bleiben. Die Fußnote bewahrt die einfache Alternative und erläutert die Zusatznuance ohne φόνος auf „Mord“ festzulegen. Außerdem wird „entzwei gesägt“ modern und transparent geschrieben.
