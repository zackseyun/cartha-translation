  source_fidelity: 'Die Reihung, die passiven Formen bei ἐλιθάσθησαν und ἐπρίσθησαν, ἀπέθανον als aktives „starben“ sowie die abschließenden Partizipien werden im Wesentlichen zutreffend wiedergegeben. „Mörderische[s] Schwert“ ist jedoch keine quellentreue deutsche Entsprechung für ἐν φόνῳ μαχαίρης: Es personifiziert das Schwert und kann dem Wort „mörderisch“ eine nicht erforderliche wertende oder intentionale Nuance geben. „Durch Schwertgewalt“ gibt den gewaltsamen Tod idiomatisch wieder, ohne φόνος auf den engeren Begriff „Mord“ festzulegen.'
  naturalness: „Sie wurden entzwei gesägt“ ist im heutigen Standarddeutsch klarer und natürlicher als das zusammengeschriebene „entzweigesägt“. „Sie starben durch Schwertgewalt“ ist eine natürliche, würdige Formulierung für den knappen Leidenskatalog. Die übrige Satzrhythmik und der fortführende Gedankenstrich sind gelungen.
  terminology: Die Begriffe „gesteinigt“, „Schafsfellen“, „Ziegenhäuten“, „Mangel leiden“, „bedrängt“ und „misshandelt“ sind sachgerecht. Die Fußnote sollte φόνος nicht mit „Mord“ gleichsetzen, da der Begriff hier allgemein gewaltsames Töten bzw. Blutvergießen/Abschlachten bezeichnen kann.
