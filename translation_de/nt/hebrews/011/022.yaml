  terminology: „Glaube“, „Auszug“, „Söhne Israels“ und „Gebeine“ sind terminologisch tragfähig. Die Fußnote bietet mit „Israeliten“ zutreffend eine idiomatischere Alternative, ohne den Wortlaut des Haupttexts zu nivellieren.
