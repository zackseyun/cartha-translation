  source_fidelity: 'Der Vers gibt die griechische Satzstruktur und die wesentlichen Begriffe insgesamt treffend wieder: πίστει als „Durch Glauben“, τελευτῶν als „als er im Sterben lag“, ἔξοδος als „Auszug“, ἐμνημόνευσεν als „erwähnte“ und ἐνετείλατο als „gab Anweisungen“. „Söhne Israels“ bewahrt die ausdrücklich im Ausgangstext stehende Familienbezeichnung. Allerdings ist „wegen seiner Gebeine“ im Deutschen vorrangig kausal zu verstehen („aufgrund seiner Gebeine“) und gibt περί nicht angemessen als Gegenstandsbezug wieder.'
