source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: de
  text: Durch Glauben erwähnte Josef, als er im Sterben lag, den Auszug der Söhne Israels[a] und gab Anweisungen hinsichtlich seiner Gebeine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“.'
    reason: Die wörtliche Wendung „Söhne Israels“ bezeichnet das aus Israel hervorgegangene Volk.
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: 'Bewahrt die wiederkehrende Formel in Hebräer 11 und versteht den Dativ instrumental: Josef handelte aufgrund bzw. kraft des Glaubens.'
- source_word: τελευτῶν
  choice: als er im Sterben lag
  rationale: Gibt das gleichzeitig zum Hauptverb stehende Partizip direkt und in natürlichem Deutsch wieder; gemeint ist Josefs Handeln am Lebensende.
- source_word: περὶ τῆς ἐξόδου
  choice: den Auszug
  rationale: „Auszug“ bezeichnet hier Israels künftiges Verlassen Ägyptens und bewahrt zugleich den konkreten Sinn von ἔξοδος.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Folgt der ausdrücklichen familiären Formulierung des griechischen Textes, ohne sie zu „Israeliten“ zu verallgemeinern.
- source_word: ἐμνημόνευσεν
  choice: erwähnte
  rationale: Mit περί bedeutet das Verb hier, etwas zu erwähnen oder davon zu sprechen, nicht lediglich, sich innerlich daran zu erinnern.
- source_word: ἐνετείλατο
  choice: gab Anweisungen
  rationale: Gibt die verbindliche Weisung Josefs in aktuellem, würdigem Deutsch wieder, ohne die Aussage unnötig zu verschärfen.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: wegen seiner Gebeine
  rationale: Behält den konkreten Bezug auf Josefs Knochen bei; „Gebeine“ ist im Zusammenhang mit sterblichen Überresten natürlich und würdig.
theological_decisions:
- issue: Bedeutung von πίστις in Hebräer 11
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: Die kapitelweit wiederkehrende Formel stellt den Glauben heraus, durch den die genannten Personen handelten. „Treue“ ist hier weniger wahrscheinlich, während „Vertrauen“ einen Teilaspekt ausdrückt.
- issue: Bezeichnung von Israels künftigem Verlassen Ägyptens
  choice: Auszug
  alternative: Fortgang
  rationale: „Auszug“ wahrt den historischen Bezug auf den Exodus, ohne über den griechischen Begriff hinaus eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „im Sterben lag“ folgt dem Griechischen enger als eine Umschreibung wie „sich dem Ende seines Lebens näherte“. „Gebeine“ wahrt den konkreten Ausdruck und passt zum biblisch-historischen Zusammenhang.
