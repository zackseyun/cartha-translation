  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: de
  text: — die Welt war ihrer nicht würdig —; sie zogen in Wüsten[a] und Gebirgen umher, in Höhlen und Erdlöchern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in menschenleeren Gegenden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Löchern der Erde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: ihrer
  rationale: Der Genitiv des Relativpronomens verweist auf die zuvor genannten leidenden Glaubenden zurück. In der deutschen Wendung »die Welt war ihrer nicht würdig« bleibt dieser Rückbezug knapp und idiomatisch erhalten.
- source_word: ἄξιος
  choice: würdig
  rationale: »Würdig« gibt die starke wertende Aussage des griechischen Ausdrucks wieder, ohne sie zu erläutern oder abzuschwächen.
- source_word: κόσμος
  choice: die Welt
  rationale: Die übliche und hinreichend offene Wiedergabe umfasst hier die menschliche Welt beziehungsweise Gesellschaft, die diese Glaubenden verwarf.
- source_word: ἐπὶ ἐρημίαις
  choice: in Wüsten
  rationale: ἐπί mit Dativ bezeichnet im Zusammenhang des Umherirrens den Aufenthaltsbereich. »In Wüsten« ist konkret, verständlich und bildhaft.
- source_word: πλανώμενοι
  choice: sie irrten … umher
  rationale: Die finite Wiedergabe des Partizips ergibt im Deutschen einen natürlichen Satz und bewahrt den Gedanken unsteten, heimatlosen Umherziehens.
- source_word: ὄρεσι
  choice: Gebirgen
  rationale: »Gebirge« bezeichnet hier natürlich die bergigen Regionen, in denen die Verfolgten umherzogen; es passt im Deutschen besser zur flächigen Ortsangabe als das isoliertere »Berge«.
- source_word: σπηλαίοις
  choice: Höhlen
  rationale: Dies ist die geläufige, allgemein verständliche Entsprechung für natürliche unterirdische Zufluchtsorte.
- source_word: ὀπαῖς τῆς γῆς
  choice: Erdlöchern
  rationale: Das Kompositum gibt die konkreten Öffnungen oder Löcher der Erde knapp und idiomatisch wieder; eine Fußnote weist auf die wörtlichere Form hin.
theological_decisions:
- issue: Bezug und Aussagekraft von »die Welt war ihrer nicht würdig«
  choice: Die Aussage bleibt als ausdrückliches moralisches Werturteil über die Welt im Gegensatz zu den verfolgten Glaubenden stehen.
  alternative: Eine neutralere Aussage, wonach die Glaubenden lediglich nicht zur Welt passten.
  rationale: Der griechische Text trifft ein starkes Werturteil. Die Übersetzung bewahrt diese Spannung, ohne daraus eine weitergehende Lehraussage zu entwickeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche bewahren den eingeschobenen, nachdrücklichen Charakter der Wertung; der anschließende Hauptsatz gibt das griechische Partizip natürlich wieder.
