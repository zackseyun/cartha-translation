review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die vier aoristischen Handlungen der griechischen Reihung vollständig und in der richtigen Reihenfolge wieder. „Durch Glauben“ gibt διὰ πίστεως als die die gesamte Aufzählung bestimmende Mittelangabe wieder. „Königreiche bezwangen“, „Gerechtigkeit übten“, „Verheißungen erlangten“ und „Löwen das Maul verschlossen“ entsprechen dem Sinn und der Bildsprache des Ausgangstextes. Die idiomatische deutsche distributive Singularform „Löwen das Maul“ verfälscht den griechischen Plural στόματα nicht.
  naturalness: Die knappe Reihung ist für den fortlaufenden Satzbau von Hebräer 11 natürlich und würdevoll. „Gerechtigkeit üben“ und „jemandem das Maul verschließen“ sind verständliche, etablierte Formulierungen im modernen Standarddeutsch, ohne unnötig altertümlich zu wirken.
  terminology: „Glauben“ bewahrt den Leitbegriff πίστις. „Gerechtigkeit“ erhält die Spannweite von δικαιοσύνη; die Fußnote bietet sinnvolle, nicht dogmatisch verengende Alternativen. „Verheißungen“ gibt ἐπαγγελίαι präzise im Plural wieder. Ein zusätzlicher Marker zu „durch Glauben“ am Versende wäre textlich unzutreffend, weil die Präpositionalphrase am Anfang steht und die gesamte Reihe bestimmt.
