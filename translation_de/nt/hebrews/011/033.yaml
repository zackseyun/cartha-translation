id: HEB.11.33
reference: Hebrews 11:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: de
  text: die durch Glauben Königreiche bezwangen, Gerechtigkeit übten[a], Verheißungen erlangten und Löwen das Maul verschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Rechte taten“ beziehungsweise „für Gerechtigkeit sorgten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: durch Glauben
  rationale: Die Präposition διά mit Genitiv bezeichnet hier das Mittel, durch das die genannten Taten geschahen. „Durch Glauben“ bewahrt die Leitvokabel des Kapitels und klingt im Deutschen natürlich.
- source_word: κατηγωνίσαντο βασιλείας
  choice: Königreiche bezwangen
  rationale: καταγωνίζομαι bezeichnet das Überwältigen oder Besiegen in einem Konflikt; „bezwangen“ gibt die kraftvolle militärisch-politische Aussage prägnant wieder.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: Gerechtigkeit übten
  rationale: Eine wörtliche Verbindung wie „Gerechtigkeit wirkten“ wäre im heutigen Deutsch unnatürlich. „Gerechtigkeit üben“ bezeichnet aktives gerechtes Handeln und lässt sowohl moralische Richtigkeit als auch Recht und Gerechtigkeit anklingen.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: Verheißungen erlangten
  rationale: ἐπιτυγχάνω bedeutet erreichen oder erlangen. Die Formulierung bleibt nahe am griechischen Plural und legt nicht fest, in welchem Umfang sich die Verheißungen erfüllten.
- source_word: ἔφραξαν στόματα λεόντων
  choice: Löwen das Maul verschlossen
  rationale: Die deutsche idiomatische Wendung bewahrt das konkrete Bild des griechischen Textes und den wahrscheinlichen Anklang an Daniel, ohne ihn ausdrücklich zu erläutern.
theological_decisions:
- issue: Bedeutung von πίστις im Tatenkatalog von Hebräer 11
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Der Kapitelzusammenhang beschreibt ein Handeln im Vertrauen auf Gott. „Glauben“ erhält zugleich den theologischen Leitbegriff, ohne ihn auf bloße Zustimmung oder menschliche Treue einzuengen.
- issue: Bedeutung von δικαιοσύνη außerhalb eines paulinischen Rechtfertigungskontexts
  choice: Gerechtigkeit
  alternative: das Rechte
  rationale: „Gerechtigkeit“ wahrt die moralische und rechtliche Bedeutungsbreite. Das Verb „übten“ macht deutlich, dass hier gerechtes Handeln gemeint ist, ohne den Begriff ausschließlich auf Rechtspflege zu verengen.
- issue: Verheißungen erlangen trotz Hebräer 11,13.39
  choice: Verheißungen erlangten
  alternative: erlangten, was verheißen war
  rationale: Der griechische Plural wird formal bewahrt. Die Aussage wird nicht zu einer vollständigen Erfüllung aller Verheißungen ausgeweitet, sodass die Spannung zu den späteren Aussagen des Kapitels bestehen bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Reihung. Das Partizip-/Relativgefüge setzt den vorangehenden Satz fort. Die vertraute Wendung „Löwen das Maul verschließen“ ist idiomatisch und bildkräftig. Kein zweiter Fußnotenmarker wurde gesetzt, da „durch Glauben“ im griechischen Text die gesamte folgende Reihe einleitet und eine erneute Markierung am Versende irreführend wäre.
