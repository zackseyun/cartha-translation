  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: de
  text: Durch Glauben durchquerten sie das Rote Meer wie durch trockenes Land[a]. Als die Ägypter dasselbe versuchten, wurden sie verschlungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schilfmeer“. Im griechischen Text steht hier „Rotes Meer“ (Ἐρυθρὰν Θάλασσαν); die zugrunde liegende hebräische Ortsbezeichnung im 2. Buch Mose wird auch als „Schilfmeer“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet das Mittel; zugleich bleibt die programmatische Formulierung von Hebräer 11 erhalten.
- source_word: διέβησαν
  choice: durchquerten sie
  rationale: Das Verb bezeichnet die Überquerung von einer Seite zur anderen; „durchquerten“ passt zudem zur Passage durch das Meer.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: das Rote Meer
  rationale: Dies gibt die griechische Bezeichnung unmittelbar wieder; die mögliche Rückbindung an das hebräische „Schilfmeer“ wird in einer Fußnote genannt.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: wie trockenes Land
  rationale: Die knappe Vergleichskonstruktion mit ὡς und der Sinn von trockenem Boden werden natürlich und würdig wiedergegeben.
- source_word: ἧς πεῖραν λαβόντες
  choice: Als ... dasselbe versuchten
  rationale: πεῖραν λαμβάνειν ist eine idiomatische Wendung für den Versuch. „Dasselbe“ stellt den Bezug auf die zuvor beschriebene Durchquerung her, ohne im Deutschen eine schwerfällige Relativkonstruktion zu erzwingen.
- source_word: οἱ Αἰγύπτιοι
  choice: die Ägypter
  rationale: Direkte Wiedergabe der Volksbezeichnung; im Erzählzusammenhang sind die verfolgenden Ägypter gemeint.
- source_word: κατεπόθησαν
  choice: wurden sie verschlungen
  rationale: Bewahrt das kräftige Bild und das Passiv des griechischen Verbs genauer als das erklärende „ertranken“.
theological_decisions:
- issue: Wiedergabe von πίστις in Hebräer 11
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Die wiederholte Formel Πίστει prägt das gesamte Kapitel. „Glauben“ ist hier die etablierte und kontextuell passende Wiedergabe, ohne mögliche Bedeutungsnuancen grundsätzlich auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur ist gegenüber dem Griechischen behutsam geglättet, während Bildsprache, Vergleich und inhaltlicher Bezug bewahrt bleiben.
