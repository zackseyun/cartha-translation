  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: de
  text: Durch Glauben segnete Isaak Jakob und Esau, auch im Blick auf das, was kommen sollte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Durch Glauben
  rationale: Gibt den instrumentalen Dativ knapp und im Zusammenhang von Hebräer 11 idiomatisch wieder.
- source_word: καὶ περὶ μελλόντων
  choice: auch im Blick auf das, was kommen sollte
  rationale: καί wird als hervorhebendes „auch“ bewahrt; περί bezeichnet den Gegenstand bzw. Bezug des Segens, und τὰ μέλλοντα meint die noch zukünftigen Dinge oder Ereignisse.
- source_word: εὐλόγησεν
  choice: segnete
  rationale: Direkte und natürliche Entsprechung des Aorists; der einmalige Vorgang wird im Deutschen angemessen mit Präteritum wiedergegeben.
- source_word: τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ
  choice: Jakob und Esau
  rationale: Bewahrt Reihenfolge und beide gleichgeordneten Objekte des griechischen Textes.
theological_decisions:
- issue: Verhältnis des Segens zu den zukünftigen Dingen
  choice: „im Blick auf das, was kommen sollte“
  alternative: „über zukünftige Dinge“
  rationale: Die gewählte Fassung lässt offen, ob die Zukunft ausdrücklich Inhalt des Segens oder allgemeiner dessen Bezugspunkt ist, und bildet so die semantische Weite von περί ab.
- issue: Funktion von καί
  choice: „auch“
  alternative: unübersetzt lassen oder „sogar“
  rationale: Die Partikel wird sichtbar bewahrt, ohne mit „sogar“ eine möglicherweise zu starke Steigerung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und gut verständlich. Die für das Griechische charakteristische Aussage über den Glauben bleibt am Satzanfang hervorgehoben.
