id: HEB.11.16
reference: Hebrews 11:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: de
  text: Nun aber sehnen sie sich nach einer besseren Heimat[a], nämlich nach einer himmlischen. Darum schämt Gott sich nicht, ihr Gott genannt zu werden; denn er hat ihnen eine Stadt bereitet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich stehen hier nur die femininen Adjektive „einer besseren“ und „einer himmlischen“. „Heimat“ ist aus dem Zusammenhang mit Vers 14 ergänzt; möglich ist auch „Land“.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Nun aber
  rationale: Die Wendung nimmt den Gegensatz zur hypothetischen Möglichkeit in Vers 15 auf. „Nun aber“ kann im Deutschen sowohl den gedanklichen Kontrast als auch die gegenwärtige Wirklichkeit ausdrücken, ohne sie rein zeitlich festzulegen.
- source_word: κρείττονος
  choice: einer besseren
  rationale: Der Komparativ bedeutet „besser“ oder „vorzüglicher“. Die substantivische Ergänzung ergibt sich aus dem Kontext.
- source_word: ὀρέγονται
  choice: sehnen sie sich nach
  rationale: Das Medium bezeichnet ein ernsthaftes Verlangen oder Ausstrecken nach etwas. „Sich sehnen nach“ gibt diese innere Ausrichtung natürlich wieder.
- source_word: κρείττονος … ἐπουρανίου
  choice: nach einer besseren Heimat, nämlich nach einer himmlischen
  rationale: Die femininen Genitivformen greifen wahrscheinlich die in Vers 14 genannte πατρίς („Heimat“, „Vaterland“) auf. Die Ergänzung „Heimat“ macht die griechische Ellipse im Deutschen verständlich.
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus ihrem Verlangen nach der himmlischen Heimat.
- source_word: οὐκ ἐπαισχύνεται
  choice: schämt Gott sich nicht
  rationale: Bewahrt die direkte Aussage über Scham und die damit verbundene Ehrdimension.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: ihr Gott genannt zu werden
  rationale: Die Formulierung bezeichnet hier die Benennung Gottes als ihres Gottes und bewahrt die alttestamentlich geprägte Beziehungsformel.
- source_word: ἡτοίμασεν
  choice: hat … bereitet
  rationale: Das Perfekt gibt die abgeschlossene Vorbereitung mit fortdauernder Bedeutung idiomatisch wieder; „bereitet“ passt zum würdevollen Register.
- source_word: πόλιν
  choice: eine Stadt
  rationale: Der artikellose Ausdruck wird unbestimmt wiedergegeben und bewahrt das konkrete eschatologische Bild.
theological_decisions:
- issue: Das im Griechischen ausgelassene Bezugswort zu κρείττονος und ἐπουρανίου
  choice: „Heimat“ aus dem unmittelbaren Kontext ergänzen
  alternative: „Land“ ergänzen oder unbestimmt „etwas Besseres“ schreiben
  rationale: Die femininen Formen weisen auf πατρίς in Vers 14 zurück. „Heimat“ entspricht diesem Wort im Kontext und hält die persönliche Zugehörigkeitsdimension fest, ohne den Sinn weiter auszudeuten.
- issue: Bundesformel „ihr Gott“
  choice: Die relationale Formel unverändert bewahren
  alternative: Zu „sie als sein Volk anzuerkennen“ erweitern
  rationale: Der Ausgangstext spricht ausdrücklich davon, dass Gott ihr Gott genannt wird. Eine Erweiterung zur vollständigen Bundesformel wäre zwar sachlich verwandt, ginge aber über den Wortlaut hinaus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Nun aber“ erhält den argumentativen Gegensatz; „bereitet“ wahrt das gehobene Register, ohne altertümlich zu wirken.
