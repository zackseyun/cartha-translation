  terminology: „Heimat“ ist als Ergänzung zu der im Kontext vorausgesetzten πατρίς gut vertretbar; die Fußnote nennt transparent die mögliche Alternative „Land“. „Himmlisch“, „ihr Gott“ und „Stadt“ bewahren die zentralen Begriffe und Bilder ohne konfessionelle Festlegung.
