  source_fidelity: Die Übersetzung gibt den argumentativen Kontrast von νῦν δέ, das nachdrückliche Verlangen (ὀρέγονται), die elliptisch vorausgesetzte feminine Bezugsgröße bei κρείττονος/ἐπουρανίου sowie die Folgerung mit διό zuverlässig wieder. „Ihr Gott genannt zu werden“ trifft die Formulierung θεὸς ἐπικαλεῖσθαι αὐτῶν idiomatisch und ohne inhaltliche Erweiterung. „Hat ihnen eine Stadt bereitet“ gibt ἡτοίμασεν γὰρ αὐτοῖς πόλιν angemessen wieder.
