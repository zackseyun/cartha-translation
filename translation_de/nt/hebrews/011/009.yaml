id: HEB.11.9
reference: Hebrews 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: de
  text: Durch Glauben lebte er als Fremder im Land der Verheißung[a], als wäre es ein fremdes Land, und wohnte in Zelten mit Isaak und Jakob, den Miterben derselben Verheißung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Durch Glauben hielt er sich im Land der Verheißung auf wie in einem fremden Land.«'
    reason: Die Verbindung von παρῴκησεν, εἰς γῆν und ὡς ἀλλοτρίαν kann im Deutschen auch mit »sich aufhalten« und einer enger an das Griechische anschließenden Vergleichsform wiedergegeben werden.
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet hier das Mittel bzw. die Grundlage des Handelns. »Durch Glauben« entspricht dem wiederkehrenden Sprachgebrauch und Gedankengang in Hebräer 11.
- source_word: παρῴκησεν
  choice: lebte er als Fremder
  rationale: Das Verb bezeichnet den Aufenthalt als Ortsfremder ohne dauerhaftes Heimatrecht. Die Formulierung ist modern und bewahrt sowohl den Aufenthalt als auch den sozialen Status des Fremden.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: im Land der Verheißung
  rationale: Bei einem Verb des Wohnens kann εἰς örtlich verstanden werden. »Land der Verheißung« bewahrt die enge genitivische Verbindung mit der göttlichen Verheißung.
- source_word: ὡς ἀλλοτρίαν
  choice: als wäre es ein fremdes Land
  rationale: ἀλλότριος bezeichnet etwas, das einem anderen gehört bzw. fremd ist. Die Formulierung gibt den durch ὡς markierten Vergleich natürlich wieder, ohne zu behaupten, das verheißene Land sei seinem Wesen nach fremd.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: und wohnte in Zelten
  rationale: Das Partizip beschreibt die begleitende Lebensweise während seines Aufenthalts. Die koordinierte Wiedergabe ist im Deutschen natürlich und erhält das konkrete Bild vorläufigen Wohnens.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: mit Isaak und Jakob
  rationale: μετά mit Genitiv bedeutet hier schlicht »mit«; die Namen folgen der etablierten deutschen Form.
- source_word: τῶν συγκληρονόμων
  choice: den Miterben
  rationale: Der Ausdruck bezeichnet Personen, die gemeinsam Anteil an demselben Erbe haben. »Miterben« ist präzise, geläufig und knapp.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: derselben Verheißung
  rationale: Die Stellung von αὐτῆς unterstreicht, dass Isaak und Jakob an genau der Verheißung Anteil hatten, die Abraham empfangen hatte.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das Subjekt wird mit »er« wiedergegeben und bezieht sich auf Abraham aus dem vorhergehenden Vers.
  alternative: Den Namen »Abraham« zur ausdrücklichen Klärung ergänzen.
  rationale: Der griechische Text nennt den Namen hier nicht; der Zusammenhang aus Hebräer 11,8 macht den Bezug dennoch eindeutig. »Er« wahrt die Textgestalt.
- issue: Verhältnis des verheißenen Landes zu Abrahams Fremdlingsstatus
  choice: »als wäre es ein fremdes Land« bewahrt die Spannung zwischen Verheißung und noch nicht verwirklichtem Besitz.
  alternative: »in einem fremden Land« könnte den Vergleich abschwächen und das Land unmittelbar als fremd bezeichnen.
  rationale: 'ὡς kennzeichnet eine vergleichende Perspektive: Abraham hielt sich im verheißenen Land so auf, wie man in einem Land lebt, das einem nicht gehört.'
translation_notes:
  register: Moderne, würdige Standardsprache. »Lebte als Fremder« vermeidet das altertümliche »weilte als Fremdling«; »Miterben« erhält den Erbgedanken knapp und verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der betroffenen Wendung.
