  variant: modern standard German
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: de
  text: Durch Glauben verließ er Ägypten[a], ohne den Zorn des Königs zu fürchten; denn er hielt stand, als sähe er den Unsichtbaren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Es kann entweder die Flucht des Mose vor dem Pharao (2. Mose 2) oder der Auszug mit Israel (2. Mose 12–14) gemeint sein; der griechische Wortlaut legt die Episode nicht fest.
    reason: cross_reference
  - marker: b
    text: 'Oder: »den, der unsichtbar ist«; auch »den unsichtbaren Einen« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der instrumentale bzw. modale Dativ bezeichnet, wodurch oder in welcher Haltung Mose handelte. »Durch Glauben« entspricht zugleich dem wiederkehrenden Sprachmuster in Hebräer 11.
- source_word: κατέλιπεν Αἴγυπτον
  choice: verließ er Ägypten
  rationale: καταλείπω bedeutet hier schlicht »verlassen«. Die Formulierung bleibt bewusst offen, auf welchen Aufbruch Moses der Verfasser anspielt.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: ohne den Zorn des Königs zu fürchten
  rationale: Die verneinte Partizipialkonstruktion wird in natürlichem Deutsch als begleitender Umstand wiedergegeben. θυμός bezeichnet heftigen Zorn; »Zorn« wahrt die Stärke, ohne sie zu »Raserei« zu steigern.
- source_word: τὸν ἀόρατον
  choice: den Unsichtbaren
  rationale: Das substantivierte Adjektiv bezeichnet den unsichtbaren Einen, hier Gott. »Den Unsichtbaren« ist knapp, würdevoll und bewahrt das Paradox zum Sehen.
- source_word: ὡς ὁρῶν
  choice: als sähe er
  rationale: Die vergleichende Wendung mit ὡς und Partizip wird idiomatisch wiedergegeben und bewahrt das spannungsvolle Bild, den Unsichtbaren gleichsam zu sehen.
- source_word: ἐκαρτέρησεν
  choice: er hielt stand
  rationale: καρτερέω bezeichnet beharrliches, standhaftes Ausharren. »Er hielt stand« passt besonders zum Zusammenhang mit dem Zorn des Königs und ist in modernem Deutsch unmittelbar verständlich.
theological_decisions:
- issue: Historischer Bezug von »er verließ Ägypten«
  choice: Der Haupttext legt nicht fest, ob Moses Flucht aus Ägypten oder der spätere Auszug Israels gemeint ist.
  alternative: Die Aussage ausschließlich auf Exodus 2 oder ausschließlich auf Exodus 12–14 beziehen.
  rationale: Der griechische Wortlaut nennt nur das Verlassen Ägyptens. Da beide Bezüge vertreten werden und der Vers selbst die Episode nicht ausdrücklich bestimmt, bleibt die Spannung erhalten.
- issue: Das Sehen des Unsichtbaren
  choice: Die paradoxe Bildsprache bleibt mit »als sähe er den Unsichtbaren« bestehen.
  alternative: Explizit von geistlicher Erkenntnis oder einer sichtbaren Gotteserscheinung sprechen.
  rationale: Der Text erklärt die Art dieses Sehens nicht näher. Eine ausdeutende Formulierung würde mehr festlegen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Gedankenfolge, wird jedoch durch »ohne … zu« und »als sähe er« idiomatisch gestaltet. Die Fußnotenmarker stehen jeweils an der sachlich passenden Stelle.
