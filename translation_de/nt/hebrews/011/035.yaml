source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: de
  text: Frauen erhielten ihre Toten durch Auferstehung zurück; andere aber wurden gefoltert[a] und nahmen die Freilassung[b] nicht an, um eine bessere Auferstehung zu erlangen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet schwere körperliche Folter. Es kann mit Schlägen oder mit einem trommel- beziehungsweise folterbankartigen Gerät verbunden gewesen sein; die genaue Methode ist unsicher.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Befreiung«. Gemeint ist hier die Freilassung aus der Folter oder vom drohenden Tod, nicht zwingend »Erlösung« im heilsgeschichtlichen Sinn.'
    reason: lexical_alternative
  - marker: c
    text: Die »bessere Auferstehung« steht wahrscheinlich im Gegensatz zur zuvor genannten Rückkehr Verstorbener in das gewöhnliche, sterbliche Leben und weist auf eine darüber hinausgehende Auferstehungshoffnung.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: erhielten … zurück
  rationale: Im Zusammenhang mit »ihre Toten« und »durch Auferstehung« bezeichnet das Verb die Rückgabe Verstorbener an die Frauen, nicht bloß ein neutrales Empfangen.
- source_word: γυναῖκες
  choice: Frauen
  rationale: Der Plural bezeichnet Frauen allgemein; eine Einschränkung auf Ehefrauen ist sprachlich und kontextuell nicht geboten.
- source_word: ἐξ ἀναστάσεως
  choice: durch Auferstehung
  rationale: Die Wendung bezeichnet hier Quelle beziehungsweise Mittel der Rückgabe; »durch Auferstehung« ist im Deutschen natürlich und wahrt diesen Sinn.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: ihre Toten
  rationale: Dies ist die natürliche deutsche Wiedergabe des substantivierten Adjektivs mit Possessivpronomen und lässt den genauen verwandtschaftlichen Bezug offen.
- source_word: ἄλλοι δὲ
  choice: andere aber
  rationale: δέ markiert den deutlichen Gegensatz zwischen erfahrenem Eingreifen und standhaft ertragenem Leiden.
- source_word: ἐτυμπανίσθησαν
  choice: wurden gefoltert
  rationale: Das Verb bezeichnet schwere körperliche Misshandlung, möglicherweise auf einem trommel- oder folterbankartigen Gerät; die allgemeine Wiedergabe vermeidet eine nicht sichere Festlegung der Methode.
- source_word: οὐ προσδεξάμενοι
  choice: nahmen … nicht an
  rationale: Das Partizip beschreibt die bewusste Ablehnung einer angebotenen Möglichkeit.
- source_word: τὴν ἀπολύτρωσιν
  choice: die angebotene Freilassung
  rationale: Im unmittelbaren Zusammenhang ist die Befreiung aus Folter oder drohendem Tod gemeint. »Freilassung« vermeidet eine unnötige Festlegung auf den heilsgeschichtlichen Fachbegriff »Erlösung«; »angebotene« verdeutlicht den durch das Partizip vorausgesetzten Angebotscharakter.
- source_word: ἵνα
  choice: damit
  rationale: Die Konjunktion leitet den Zweck beziehungsweise das Ziel ihrer Ablehnung ein.
- source_word: κρείττονος ἀναστάσεως
  choice: eine bessere Auferstehung
  rationale: κρείττων bedeutet im Hebräerbrief regelmäßig »besser«; die Formulierung wahrt den ausdrücklichen Vergleich.
- source_word: τύχωσιν
  choice: sie … erlangen würden
  rationale: τυγχάνω bezeichnet hier das Erlangen oder Erreichen; der Konjunktiv im Zwecksatz wird idiomatisch mit »würden« wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀπολύτρωσις im Zusammenhang
  choice: zeitliche Freilassung aus Folter oder vom drohenden Tod
  alternative: Erlösung im umfassenden heilsgeschichtlichen Sinn
  rationale: Der unmittelbare Zusammenhang handelt von Leidenden, die eine angebotene Befreiung ablehnten. Die Übersetzung hält den konkreten Sinn fest, ohne mögliche Wortassoziationen dogmatisch auszuschließen.
- issue: Sinn der »besseren Auferstehung«
  choice: eine Auferstehung, die der vorher erwähnten Rückkehr ins sterbliche Leben überlegen ist
  alternative: allgemein eine günstigere Auferstehung, ohne ausdrücklichen Bezug zum ersten Satzteil
  rationale: 'Die Gegenüberstellung innerhalb desselben Verses legt den Kontrast nahe: Die zuvor Toten kehrten in das gewöhnliche Leben zurück, während die Leidenden auf eine überlegene Auferstehung hofften. Die Übersetzung selbst belässt die genaue Ausgestaltung offen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den starken Gegensatz des griechischen Textes. »Ihre Toten« und »bessere Auferstehung« bleiben bewusst knapp und theologisch offen; Fußnoten erläutern nur dort, wo Kultur- oder Wortbedeutung sonst leicht missverstanden werden könnten.
