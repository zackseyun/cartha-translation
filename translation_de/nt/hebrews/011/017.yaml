revisions:
- from: Durch Glauben brachte Abraham, als er auf die Probe gestellt wurde, Isaak als Opfer dar. Er, der die Verheißungen empfangen hatte, brachte seinen einzigen, unvergleichlichen Sohn[a] als Opfer dar.
  to: Durch Glauben brachte Abraham, als er auf die Probe gestellt wurde, Isaak als Opfer dar; und er, der die Verheißungen empfangen hatte, war dabei, seinen einzigen Sohn[a] als Opfer darzubringen.
  rationale: Die Revision gibt das Imperfekt προσέφερεν durch „war dabei ... darzubringen“ wieder und vermeidet damit eine unnötige Gleichsetzung mit der zuvor perfektisch zusammengefassten Opferhandlung. „Einzigen Sohn“ bleibt eng am griechischen Ausdruck; die Fußnote dokumentiert dessen mögliche Bedeutung „einzigartig“, ohne die Übersetzung durch die nichtlexikalische Verstärkung „unvergleichlich“ zu erweitern.
