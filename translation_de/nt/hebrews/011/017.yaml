  source_fidelity: Die Wiedergabe von Πίστει, πειραζόμενος, ἐπαγγελίας und der Opferterminologie ist grundsätzlich treffend. Allerdings gibt die zweite finite Verbform προσέφερεν (Imperfekt) eine im Verlauf befindliche bzw. angesetzte Opferhandlung wieder. Das zweimalige „brachte ... als Opfer dar“ nivelliert diese Differenz und kann im Deutschen zudem den Eindruck einer vollzogenen Tötung erwecken. „Unvergleichlichen“ ist keine tragfähige unmittelbare Bedeutung von μονογενής und erweitert den Text unnötig.
  naturalness: Der zweite Satz ist verständlich, aber die Wiederholung von „brachte ... als Opfer dar“ ist stilistisch und semantisch weniger präzise. „War dabei, ... als Opfer darzubringen“ ist modernes, natürliches Deutsch und bildet die unvollendete Handlungsansicht angemessen ab.
  terminology: „Durch Glauben“, „auf die Probe gestellt“, „Verheißungen“ und „als Opfer darbringen“ sind sachgerecht. Für μονογενής ist „einzigen Sohn“ als knappe Textwiedergabe vertretbar, sofern eine Fußnote die Bedeutung „einzigartig“ beziehungsweise die besondere Stellung Isaaks erläutert. Das zusätzliche Adjektiv „unvergleichlich“ sollte entfallen.
