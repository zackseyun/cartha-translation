  - severity: medium
    issue: „unvergleichlichen“ erweitert die Bedeutung von μονογενῆ.
    rationale: μονογενής bezeichnet hier „einzig“ bzw. „einzigartig“; „unvergleichlich“ fügt eine wertende Nuance hinzu, die das griechische Wort nicht selbst ausdrückt.
