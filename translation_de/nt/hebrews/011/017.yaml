source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: de
  text: Durch Glauben brachte Abraham, als er auf die Probe gestellt wurde, Isaak als Opfer dar; und er, der die Verheißungen empfangen hatte, war dabei, seinen einzigen Sohn[a] als Opfer darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen einzigartigen Sohn“. Das griechische Wort betont Isaaks einzigartige Stellung; es muss nicht bedeuten, dass Abraham keinen anderen leiblichen Sohn hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Durch Glauben
  rationale: Der Dativ bezeichnet das Mittel; „Durch Glauben“ ist im Deutschen natürlich und bewahrt die wiederkehrende Formel des Kapitels.
- source_word: προσενήνοχεν / προσέφερεν
  choice: brachte … als Opfer dar
  rationale: Das Verb προσφέρω hat hier im Zusammenhang mit Genesis 22 deutlich kultisch-opfernden Sinn. Die gleiche deutsche Wendung bewahrt die lexikalische Wiederholung; die griechische Aspektdifferenz lässt sich in diesem erzählenden Rückblick nicht ohne unnatürliche Überzeichnung wiedergeben.
- source_word: πειραζόμενος
  choice: als er auf die Probe gestellt wurde
  rationale: Die Form ist ein passives Präsenspartizip. „Auf die Probe gestellt“ bezeichnet hier eine Prüfung und vermeidet die irreführende Bedeutung einer Verführung zum Bösen.
- source_word: μονογενῆ
  choice: einzigen, unvergleichlichen Sohn
  rationale: μονογενής hebt Isaaks Einzigartigkeit hervor. Da Abraham noch einen anderen leiblichen Sohn hatte, macht „unvergleichlich“ deutlich, dass Isaak in seiner Stellung als verheißener Sohn einzigartig war, ohne die Spannung des Ausdrucks zu beseitigen.
- source_word: ἀναδεξάμενος
  choice: empfangen hatte
  rationale: Das Aoristpartizip bezeichnet Abraham als denjenigen, der die Verheißungen zuvor empfangen hatte; das Plusquamperfekt gibt dieses Verhältnis im Deutschen klar wieder.
- source_word: ἐπαγγελίας
  choice: die Verheißungen
  rationale: Die geläufige theologische und allgemein verständliche Entsprechung bewahrt den Plural des griechischen Textes.
theological_decisions:
- issue: Isaak als μονογενής, obwohl Abraham auch Ismael hatte
  choice: „seinen einzigen, unvergleichlichen Sohn“ mit erläuternder Fußnote
  alternative: „seinen einzigen Sohn“; „seinen einzigartigen Sohn“; „seinen einziggezeugten Sohn“
  rationale: Die Formulierung bewahrt sowohl den zugespitzten Wortlaut als auch Isaaks einzigartige Stellung als Sohn der Verheißung. Sie behauptet nicht, Abraham habe keinen weiteren leiblichen Sohn gehabt, und importiert keine spätere christologische Terminologie.
- issue: Abrahams Opferhandlung und ihre Vollendung
  choice: „brachte … als Opfer dar“ an beiden Stellen
  alternative: Beim zweiten Vorkommen „war im Begriff, … als Opfer darzubringen“
  rationale: Der Text beschreibt die Handlung aus der Perspektive der vollzogenen Glaubensprüfung. Eine Ergänzung wie „war im Begriff“ würde den historischen Ausgang ausdrücklich eintragen, obwohl sie nicht im Wortlaut dieses Verses steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „als Opfer darbringen“ spiegelt die Wiederholung des griechischen Verbs; der zweite Satz vermeidet eine überladene deutsche Satzperiode.
