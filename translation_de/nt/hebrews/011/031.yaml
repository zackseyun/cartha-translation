base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: de
  text: Durch Glauben ging Rahab, die Prostituierte, nicht zusammen mit den Ungehorsamen zugrunde,[a] weil sie die Kundschafter friedlich aufgenommen hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging nicht zusammen mit denen zugrunde, die nicht gehorcht hatten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nachdem sie die Kundschafter mit Frieden aufgenommen hatte“. Das griechische Partizip kann hier auch begleitend oder zeitlich verstanden werden; „weil“ gibt eine naheliegende kausale Beziehung wieder.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: πίστει
  choice: Durch Glauben
  rationale: Der instrumentale Dativ bezeichnet den Glauben als Grundlage beziehungsweise Mittel von Rahabs Handeln und entspricht der wiederkehrenden Formel in Hebräer 11.
- source_word: Ῥαὰβ
  choice: Rahab
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: ἡ πόρνη
  choice: die Prostituierte
  rationale: πόρνη bezeichnet hier eindeutig eine Prostituierte. Die moderne Bezeichnung wahrt die Aussagekraft des griechischen Ausdrucks, ohne die veraltete Formulierung „Hure“ zu verwenden.
- source_word: οὐ συναπώλετο
  choice: ging … nicht mit … zugrunde
  rationale: Das zusammengesetzte Verb συναπόλλυμι bezeichnet das gemeinsame Zugrundegehen; die deutsche Konstruktion gibt sowohl die Verneinung als auch den Gemeinschaftsaspekt natürlich wieder.
- source_word: τοῖς ἀπειθήσασιν
  choice: mit den Ungehorsamen
  rationale: ἀπειθέω bezeichnet hier mangelnden Gehorsam beziehungsweise die Weigerung zu gehorchen. Die substantivierte Form ist knapp und bewahrt den moralisch-volitionalen Sinn.
- source_word: δεξαμένη
  choice: weil sie … aufgenommen hatte
  rationale: Das Aoristpartizip beschreibt den Umstand, der mit Rahabs Rettung verbunden ist. Die kausale Wiedergabe ist im Kontext natürlich; die formal offenere Alternative wird in einer Fußnote bewahrt.
- source_word: τοὺς κατασκόπους
  choice: die Kundschafter
  rationale: κατάσκοπος kann einen Spion oder Kundschafter bezeichnen. Im Zusammenhang mit Josua ist „Kundschafter“ die geläufige und natürliche Bezeichnung.
- source_word: μετ’ εἰρήνης
  choice: in Frieden
  rationale: Die Präpositionalphrase bezeichnet die friedliche beziehungsweise wohlwollende Art der Aufnahme und bewahrt zugleich die biblische Ausdrucksweise.
theological_decisions:
- issue: Bedeutung von πίστις in der Beispielreihe von Hebräer 11
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Die wiederkehrende Konstruktion πίστει mit einer namentlich genannten Glaubensperson stützt „Glauben“ als sachlich und sprachlich passende Hauptwiedergabe. „Vertrauen“ und „Treue“ berühren Teilaspekte, sind hier jedoch weniger umfassend.
- issue: Bedeutung von ἀπειθέω
  choice: ungehorsam sein
  alternative: nicht glauben
  rationale: Das Verb kann je nach Kontext Unglauben und Ungehorsam eng miteinander verbinden. Hier bleibt „ungehorsam“ näher an seinem handlungsbezogenen Sinn, ohne den Zusammenhang zwischen Unglauben und Ungehorsam auszuschließen.
- issue: Verhältnis des Partizips δεξαμένη zum Hauptsatz
  choice: 'kausal: „weil sie … aufgenommen hatte“'
  alternative: 'umständlich/zeitlich: „nachdem sie … aufgenommen hatte“'
  rationale: Das Griechische legt die genaue logische Beziehung des Partizips nicht ausdrücklich fest. Die kausale Wiedergabe passt zum Argument des Verses; die formal offenere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Prostituierte“ vermeidet die altertümliche und heute stark beschimpfende Wirkung von „Hure“. „Durch Glauben“ bewahrt die prägnante Leitformel des Kapitels; „in Frieden“ erhält die Bildsprache des Ausgangstextes.
