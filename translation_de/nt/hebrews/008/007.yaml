source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: de
  text: Denn wenn jener erste Bund[a] ohne Mangel gewesen wäre, wäre kein Raum für einen zweiten gesucht worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wörtlich „jener erste“; „Bund“ ist aus dem Zusammenhang ergänzt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wäre keine Gelegenheit für einen zweiten gesucht worden“. Griechisch τόπος bedeutet wörtlich „Ort/Platz“ und kann in dieser Wendung auch „Raum“, „Gelegenheit“ oder „Anlass“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Denn wenn
  rationale: γάρ begründet den vorausgehenden Gedankengang, während εἰ die Bedingung einleitet. „Denn wenn“ gibt beide Funktionen im Deutschen natürlich wieder.
- source_word: ἡ πρώτη ἐκείνη
  choice: jener erste Bund
  rationale: Das feminine Adjektivgefüge verweist im Kontext auf den Bund. „Bund“ wird zur Klarheit ergänzt; die Ergänzung wird in Fußnote [a] offengelegt.
- source_word: ἦν ἄμεμπτος
  choice: ohne Mangel gewesen wäre
  rationale: ἄμεμπτος bezeichnet etwas, an dem nichts zu beanstanden ist. „Ohne Mangel“ bewahrt die Aussage, ohne schon festzulegen, worin der im Gedankengang vorausgesetzte Mangel besteht.
- source_word: οὐκ ἂν
  choice: wäre nicht ... gesucht worden
  rationale: οὐκ mit ἄν kennzeichnet hier die verneinte Folge einer irrealen Bedingung. Der deutsche Konjunktiv II gibt diese hypothetische Aussage wieder.
- source_word: δευτέρας
  choice: für einen zweiten
  rationale: Das substantivierte feminine Adjektiv bezieht sich erneut auf einen Bund. Die Ellipse bleibt wie im Griechischen erhalten, nachdem „Bund“ im ersten Satzteil ausdrücklich genannt wurde.
- source_word: ἐζητεῖτο τόπος
  choice: wäre ... nach einer Möglichkeit ... gesucht worden
  rationale: Die Verbindung aus ζητέω und τόπος meint, dass Raum, Gelegenheit oder eine Möglichkeit für etwas gesucht wird. „Nach einer Möglichkeit suchen“ ist im modernen Deutschen verständlich und bewahrt zugleich das Bild hinreichend genau.
theological_decisions:
- issue: Ob das im Griechischen ausgelassene Bezugswort „Bund“ ausdrücklich genannt werden soll
  choice: „Bund“ wird bei „jener erste“ ergänzt und durch Fußnote [a] kenntlich gemacht.
  alternative: „jener erste“ oder „der erste“ ohne Ergänzung
  rationale: Der unmittelbare Zusammenhang stellt den ersten und den zweiten Bund einander gegenüber. Die Ergänzung verdeutlicht nur den grammatisch vorausgesetzten Bezug und fügt keine neue theologische Aussage hinzu.
- issue: Worauf sich der vorausgesetzte Mangel des ersten Bundes bezieht
  choice: Die Formulierung „ohne Mangel“ lässt die genaue Art und Zuordnung des Mangels offen.
  alternative: Eine erklärende Wiedergabe, die den Mangel ausdrücklich dem Bund, seiner Durchführung oder den Menschen zuschreibt
  rationale: Der Vers formuliert die Bedingungslogik, bestimmt aber für sich genommen nicht abschließend, worin der Mangel besteht. Diese Spannung darf nicht durch eine konfessionell oder systematisch festgelegte Ergänzung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die irreale Bedingung wird mit Konjunktiv II wiedergegeben. Die Ergänzung „Bund“ schafft Klarheit, während „für einen zweiten“ die knappe griechische Ellipse bewahrt.
