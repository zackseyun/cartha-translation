id: HEB.8.9
reference: Hebrews 8:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: de
  text: nicht entsprechend dem Bund, den ich mit ihren Vätern schloss an dem Tag, als ich ihre Hand ergriff, um sie aus dem Land Ägypten herauszuführen[a], denn sie hielten nicht an meinem Bund fest, und ich kümmerte mich nicht um sie[b], sagt der Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „als ich sie bei der Hand nahm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Zitat folgt dem griechischen Wortlaut des Hebräerbriefs: „und ich kümmerte mich nicht um sie“. Der hebräische Text von Jeremia 31,32 hat einen anderen Sinn und wird häufig wiedergegeben: „obwohl ich ihr Ehemann war“ oder „obwohl ich ihr Herr war“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: Bund
  rationale: Im Hebräerbrief bezeichnet διαθήκη Gottes verbindliche Bundesbeziehung; „Bund“ ist im Deutschen sachlich präzise und vermeidet die hier irreführende Bedeutung „Testament“.
- source_word: ἐποίησα
  choice: schloss
  rationale: Deutsch verwendet für ποιεῖν διαθήκην idiomatisch „einen Bund schließen“. Das gibt die gewöhnliche griechische Wendung natürlich wieder.
- source_word: πατράσιν
  choice: Vätern
  rationale: Das ausdrücklich maskuline Wort meint Israels Vorväter; „Vätern“ bewahrt diese Form und den biblischen Bezug.
- source_word: ἐν ἡμέρᾳ
  choice: an dem Tag
  rationale: Die konkrete Zeitangabe wird bewahrt und leitet den Rückblick auf den Auszug aus Ägypten ein.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: als ich ihre Hand ergriff
  rationale: Die temporale Konstruktion und das im Griechischen singularische Bild der Hand werden eng und zugleich verständlich wiedergegeben.
- source_word: ἐξαγαγεῖν
  choice: um sie ... herauszuführen
  rationale: ἐξάγω bezeichnet das Hinausführen; „herauszuführen“ verbindet Ziel und persönliche Führung passend mit dem Bild des Ergreifens der Hand.
- source_word: γῆς Αἰγύπτου
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe erhält das ausdrücklich genannte γῆς und klingt im gehobenen modernen Deutsch natürlich.
- source_word: ἐνέμειναν ἐν
  choice: hielten nicht an ... fest
  rationale: Die deutsche Wendung drückt das beharrliche Bleiben in einer Verpflichtung natürlich aus und passt zur geforderten Bundestreue.
- source_word: κἀγὼ
  choice: und auch ich
  rationale: Die koordinierende Bedeutung „und ich“ wird bewahrt; „auch“ macht den korrespondierenden Subjektwechsel im Deutschen deutlich, ohne ausdrücklich eine stärkere Schlussfolgerung wie „darum“ einzutragen.
- source_word: ἠμέλησα αὐτῶν
  choice: kümmerte mich nicht mehr um sie
  rationale: Die Wendung gibt das Nichtbeachten beziehungsweise Vernachlässigen idiomatisch wieder. „Nicht mehr“ verdeutlicht im Deutschen die relationale Folge im Kontext, ohne eine aktive Verwerfung zu behaupten.
- source_word: λέγει κύριος
  choice: sagt der Herr
  rationale: Die präsentische Zitierformel wird direkt und traditionsübergreifend verständlich wiedergegeben.
theological_decisions:
- issue: ἠμέλησα αὐτῶν gegenüber dem abweichenden Sinn des hebräischen Textes von Jeremia 31,32
  choice: und auch ich kümmerte mich nicht mehr um sie
  alternative: obwohl ich ihr Ehemann war / obwohl ich ihr Herr war
  rationale: Übersetzt wird der vorliegende griechische Text des Hebräerbriefs, der ἠμέλησα αὐτῶν liest und damit dem griechischen Jeremia-Text nahesteht. Die deutlich andere Aussage des masoretischen Textes wird wegen ihrer intertextuellen und theologischen Bedeutung in der Fußnote offengelegt.
- issue: Verhältnis der beiden mit καί verbundenen Aussagen
  choice: und auch ich
  alternative: darum kümmerte ich mich nicht mehr um sie
  rationale: Das einfache καί lässt zwar im Zusammenhang eine Folge erkennen, bezeichnet sie aber nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit und verstärkt die kausale Beziehung nicht zu „darum“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den Charakter eines prophetischen Zitats, bleibt aber gut lesbar. Das konkrete Bild „ihre Hand ergriff“ bleibt im Haupttext erhalten; die geläufigere deutsche Formulierung steht in der Fußnote.
