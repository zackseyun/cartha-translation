id: HEB.8.1
reference: Hebrews 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: de
  text: 'Der Hauptpunkt[a] bei dem, was gesagt wird, ist: Wir haben einen solchen Hohepriester, der sich zur Rechten des Thrones der Majestät in den Himmeln[b] gesetzt hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Zusammenfassung« beziehungsweise »der entscheidende Punkt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »im Himmel«; wörtlich steht im Griechischen die Mehrzahl: »in den Himmeln«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: der Hauptpunkt
  rationale: Im argumentativen Zusammenhang bezeichnet das Wort den entscheidenden Punkt oder die Zusammenfassung des Gesagten, nicht ein wörtliches »Kapitel«.
- source_word: δὲ
  choice: durch den deutschen Satzübergang wiedergegeben
  rationale: Die Partikel kennzeichnet hier einen milden Übergang. Ein ausdrückliches »aber« würde im Deutschen einen zu starken Gegensatz nahelegen.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: bei dem, was gesagt wird
  rationale: Die Formulierung bewahrt den Bezug auf die gegenwärtig behandelten Aussagen und gibt das passive Partizip natürlich wieder.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: wir haben einen solchen Hohepriester
  rationale: »Einen solchen« verweist auf die zuvor beschriebene Art des Hohepriestertums; »Hohepriester« ist die präzise kultische Amtsbezeichnung.
- source_word: ἐκάθισεν
  choice: hat sich … gesetzt
  rationale: Die aktive Vergangenheitsform bezeichnet den vollzogenen Akt des Sichsetzens, ohne dessen theologische Bedeutung ausdeutend zu erweitern.
- source_word: ἐν δεξιᾷ
  choice: zur Rechten
  rationale: Die geläufige biblische Wendung bewahrt das Bild des Ehren- und Vollmachtsplatzes.
- source_word: τοῦ θρόνου τῆς μεγαλωσύνης
  choice: des Thrones der Majestät
  rationale: Die Formulierung erhält sowohl das königliche Thronbild als auch die ehrfürchtige indirekte Bezeichnung Gottes.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Die Übersetzung bewahrt den griechischen Plural; die im Deutschen gebräuchlichere Einzahl wird in der Fußnote genannt.
theological_decisions:
- issue: Soll der Bezug von »der Majestät« ausdrücklich als Gott bezeichnet werden?
  choice: Die indirekte Gottesbezeichnung »der Majestät« bleibt erhalten.
  alternative: des Thrones Gottes
  rationale: Der griechische Text verwendet nicht θεός, sondern eine ehrfürchtige Umschreibung. Die Übersetzung macht den Bezug daher nicht ausdrücklicher als die Vorlage.
- issue: Soll das Sichsetzen als Vollendung des priesterlichen Werkes ausgedeutet werden?
  choice: Die Übersetzung bleibt bei »hat sich … gesetzt«.
  alternative: hat nach vollbrachtem Werk seinen Platz eingenommen
  rationale: Der Kontext des Hebräerbriefs trägt diese theologische Bedeutung, doch der Vers selbst formuliert sie hier nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am argumentativen Aufbau des griechischen Textes, während »zur Rechten« und »Majestät« den erhöhten biblischen Ton bewahren.
