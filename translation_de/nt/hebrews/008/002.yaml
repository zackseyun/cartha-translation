  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: de
  text: ein Diener der heiligen Stätten[a] und des wahren Zeltes[b], das der Herr errichtet hat[c], und nicht ein Mensch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Heiligtums“. Der griechische Ausdruck steht im Plural und kann die heiligen Bereiche des Heiligtums bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „der wahren Stiftshütte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aufgeschlagen hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: der heiligen Stätten
  rationale: Der substantivierte Genitiv Plural bezeichnet im kultischen Zusammenhang des Hebräerbriefs am ehesten die heiligen Bereiche des himmlischen Heiligtums. Die Pluralform bleibt sichtbar, ohne den Ausdruck auf heilige Menschen zu beziehen.
- source_word: λειτουργὸς
  choice: Diener
  rationale: Das Wort bezeichnet jemanden, der einen öffentlichen oder kultischen Dienst ausübt. „Diener“ ist im Deutschen natürlich und würdig; der priesterliche Bezug ergibt sich aus dem Kontext.
- source_word: σκηνῆς
  choice: Zeltes
  rationale: Das griechische Wort bedeutet zunächst „Zelt“ und erinnert hier an das Zelt der Begegnung. „Zelt“ ist gegenwärtig und verständlich, während „Stiftshütte“ traditioneller, aber weniger unmittelbar verständlich ist.
- source_word: ἀληθινῆς
  choice: wahren
  rationale: „Wahr“ bewahrt die knappe Formulierung und kann sowohl Echtheit als auch die endgültige, himmlische Wirklichkeit im Gegensatz zum irdischen Abbild ausdrücken.
- source_word: ἔπηξεν
  choice: errichtet hat
  rationale: Das Verb bezeichnet das feste Aufstellen eines Zeltes. „Errichtet hat“ klingt natürlich und bewahrt das Bild, ohne es unnötig zu verengen.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die übliche und kontextgemäße Wiedergabe von κύριος mit beibehaltenem Artikel.
- source_word: οὐκ ἄνθρωπος
  choice: nicht ein Mensch
  rationale: Die Formulierung bewahrt den scharfen Gegensatz zwischen dem Herrn und einem Menschen und gibt ἄνθρωπος geschlechtsübergreifend und idiomatisch wieder.
theological_decisions:
- issue: Bezug von τῶν ἁγίων
  choice: heilige Stätten des Heiligtums
  alternative: die Heiligen; das Heiligtum
  rationale: Der Zusammenhang von Hebräer 8,1–5 handelt vom hohepriesterlichen Dienst im himmlischen Heiligtum. Die pluralische Wiedergabe wahrt zugleich die Form des griechischen Ausdrucks und lässt dessen mögliche zusammenfassende Bedeutung offen.
- issue: Verhältnis des wahren Zeltes zum irdischen Heiligtum
  choice: „wahr“ ohne erklärenden Zusatz
  alternative: wirklich; eigentlich; himmlisch
  rationale: Der Vers stellt das vom Herrn errichtete Zelt dem menschlich errichteten gegenüber. „Wahr“ bewahrt diese theologische Spannung, ohne die Bedeutung ausdrücklich als „himmlisch“ oder „wirklich“ auszulegen.
- issue: Generischer Sinn von ἄνθρωπος
  choice: nicht ein Mensch
  alternative: nicht der Mensch; nicht von Menschenhand
  rationale: Der griechische Text nennt den handelnden Gegensatz knapp als „nicht ein Mensch“. Die gewählte Form vermeidet die interpretierende Umformung zu einer Passivkonstruktion und hält den Gegensatz zum Herrn fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform setzt Hebräer 8,1 grammatisch fort. „Zelt“ hält die Bildsprache des griechischen Textes lebendig; die traditionelle Bezeichnung „Stiftshütte“ wird in einer Fußnote angeboten.
