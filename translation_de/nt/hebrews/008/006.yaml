  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Aussagen des griechischen Textes zuverlässig wieder: das perfekte τέτυχεν als erreichtes gegenwärtiges Haben, die vergleichende Steigerung von διαφορωτέρας und κρείττων, die Mittlerrolle sowie die auf besseren Verheißungen beruhende rechtliche Einsetzung des Bundes. »Umso … als« bildet die mit ὅσῳ καὶ ausgedrückte Vergleichsbegründung angemessen ab.'
  naturalness: Der Text ist idiomatisches modernes Standarddeutsch mit einem dem Hebräerbrief angemessen würdigen Register. »Nun aber«, »Dienst«, »Mittler« und »in Kraft gesetzt worden ist« sind klar und flüssig. Die Satzlänge und der Relativsatz bleiben gut verständlich.
  terminology: »Bund« ist im Kontext von Hebräer 8 und dem folgenden Jeremia-Zitat die treffende Wiedergabe von διαθήκη. Die Fußnote bewahrt die mögliche alternative Bedeutung »Testament«, ohne sie dem Kontext aufzuzwingen. »Mittler«, »Verheißungen« und die rechtlich geprägte Wendung »in Kraft gesetzt« sind terminologisch stimmig.
