id: HEB.8.6
reference: Hebrews 8:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: de
  text: Nun aber hat er einen umso vorzüglicheren Dienst erlangt, als er auch Mittler eines besseren Bundes[a] ist, der auf der Grundlage besserer Verheißungen in Kraft gesetzt worden ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann »Bund« oder in manchen Zusammenhängen »Testament« bedeuten. Hier passt »Bund«, weil in den folgenden Versen Jeremias Verheißung des neuen Bundes angeführt wird.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »auf der Grundlage besserer Verheißungen gestiftet worden ist« beziehungsweise »gesetzlich eingesetzt worden ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nun aber
  rationale: Gibt sowohl den gegenwärtigen Zeitpunkt als auch den Gegensatz zu den zuvor erwähnten irdischen Priestern knapp und natürlich wieder.
- source_word: διαφορωτέρας
  choice: umso vorzüglicheren
  rationale: Der Komparativ bezeichnet hier qualitative Überlegenheit. Zusammen mit »als« bildet »umso … als« im Deutschen eine natürliche Entsprechung zur proportionalen Konstruktion ὅσῳ καὶ.
- source_word: τέτυχεν
  choice: hat … erlangt
  rationale: Das Perfekt bezeichnet einen erreichten Zustand, der fortbesteht; »hat erlangt« bewahrt Erwerb und gegenwärtigen Besitz des Dienstes.
- source_word: λειτουργίας
  choice: Dienst
  rationale: Im Zusammenhang ist der heilige beziehungsweise priesterliche Dienst Christi gemeint. »Dienst« ist verständlich und lässt die nähere Bestimmung dem Kontext.
- source_word: ὅσῳ καὶ
  choice: umso … als … auch
  rationale: 'Diese korrelative Formulierung bewahrt den proportionalen Gedankengang: Der Dienst Christi ist in dem Maß überlegen, in dem der von ihm vermittelte Bund überlegen ist.'
- source_word: κρείττονός … διαθήκης
  choice: eines besseren Bundes
  rationale: »Besser« erhält das für den Hebräerbrief kennzeichnende Vergleichsmotiv; »Bund« entspricht dem unmittelbar folgenden Bezug auf Jeremias Verheißung des neuen Bundes.
- source_word: μεσίτης
  choice: Mittler
  rationale: Der etablierte deutsche Ausdruck bezeichnet präzise denjenigen, der zwischen den Bundesparteien vermittelt.
- source_word: ἥτις
  choice: der
  rationale: Das Relativpronomen verweist auf den Bund zurück und leitet eine beschreibende Aussage über dessen Grundlage und Inkraftsetzung ein.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: auf der Grundlage besserer Verheißungen
  rationale: Die Formulierung macht die von ἐπί mit Dativ bezeichnete Grundlage im natürlichen Deutschen deutlich, ohne den Inhalt der Verheißungen auszuweiten.
- source_word: νενομοθέτηται
  choice: in Kraft gesetzt worden ist
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene rechtliche beziehungsweise verbindliche Einsetzung mit fortdauernder Geltung.
theological_decisions:
- issue: Bedeutung von διαθήκη in Hebräer 8,6
  choice: Bund
  alternative: Testament
  rationale: Der Zusammenhang greift unmittelbar die Verheißung des neuen Bundes aus Jeremia auf und spricht von dessen Mittler. »Bund« gibt diesen alttestamentlichen Hintergrund klar wieder; »Testament« bleibt eine mögliche Bedeutung des griechischen Wortes in anderen Zusammenhängen.
- issue: Rechtlicher Gehalt von νενομοθέτηται
  choice: in Kraft gesetzt worden ist
  alternative: gestiftet beziehungsweise gesetzlich eingesetzt worden ist
  rationale: Die gewählte Fassung bewahrt den Gedanken verbindlicher Einsetzung und die fortdauernde Geltung, ohne den Bund auf ein bloßes Gesetzgebungsverfahren zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Wendung »umso … als« bildet die Vergleichslogik des griechischen Satzes natürlich ab; »Dienst«, »Mittler« und »Bund« halten den priesterlich-bundestheologischen Zusammenhang präsent, ohne zusätzliche konfessionelle Deutung einzutragen.
