source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: de
  text: Indem er »neu«[a] sagt, hat er den ersten Bund für veraltet erklärt. Was aber veraltet und altert, steht kurz vor dem Verschwinden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht nur »neu«. Gemeint ist der »neue Bund« aus dem vorausgehenden Zitat aus Jeremia 31,31.
    reason: cross_reference
  - marker: b
    text: 'Oder: »ist dem Verschwinden nahe«; auch »steht kurz vor der Beseitigung« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Indem er ... spricht
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv bezeichnet hier Begleitumstand oder Mittel. »Indem er ... spricht« ist im Deutschen natürlich und bewahrt den möglichen instrumentalen Sinn.
- source_word: Καινὴν
  choice: »neuen«
  rationale: Das Adjektiv greift verkürzt die Wendung »neuer Bund« aus dem vorausgehenden Jeremia-Zitat auf. Die elliptische Form bleibt erhalten; die Fußnote erläutert den Bezug.
- source_word: πεπαλαίωκεν
  choice: hat ... für veraltet erklärt
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung mit fortbestehendem Ergebnis. Im Zusammenhang bewirkt die Bezeichnung »neu«, dass der erste Bund als veraltet gilt; die Formulierung vermeidet das im Deutschen möglicherweise zu starke kausale »hat veralten lassen«.
- source_word: τὴν πρώτην
  choice: den ersten Bund
  rationale: Das substantivierte Adjektiv bezieht sich im Kontext eindeutig auf den ersten Bund. Die Ergänzung von »Bund« ist für verständliches, natürliches Deutsch sinnvoll.
- source_word: τὸ ... παλαιούμενον
  choice: Was aber veraltet
  rationale: Das Präsenspartizip beschreibt einen fortschreitenden Vorgang. »Was veraltet« gibt diesen prozesshaften Sinn knapp wieder.
- source_word: γηράσκον
  choice: alt wird
  rationale: Die Formulierung bewahrt das Bild des Alterns und ergänzt die Aussage vom Veralten, ohne sie unnötig zu glätten.
- source_word: ἐγγὺς ἀφανισμοῦ
  choice: steht kurz vor dem Verschwinden
  rationale: Die Verbindung bezeichnet die Nähe zum Verschwinden beziehungsweise zur Beseitigung. Die gewählte Wendung ist idiomatisches modernes Deutsch und erhält den zeitlichen Zug der Aussage.
theological_decisions:
- issue: Unausgesprochenes Subjekt bei ἐν τῷ λέγειν
  choice: »er« ohne ausdrückliche Identifikation
  alternative: »Gott« oder »die Schrift«
  rationale: Der griechische Text lässt das Subjekt unausgesprochen und verweist auf den Sprecher des vorausgehenden Jeremia-Zitats. Das Pronomen wahrt diese textliche Zurückhaltung.
- issue: Status des ersten Bundes
  choice: »für veraltet erklärt«
  alternative: »hat den ersten Bund veraltet gemacht« oder »hat den ersten Bund alt gemacht«
  rationale: Die Formulierung gibt die argumentative Kraft des Gegensatzes zwischen neuem und erstem Bund wieder, ohne über die Aussage des Verses hinaus umfassende Folgerungen über Gesetz oder Israel einzutragen.
- issue: Bedeutung von ἀφανισμός
  choice: »Verschwinden«
  alternative: »Beseitigung« oder »Vernichtung«
  rationale: »Verschwinden« bewahrt die bildhafte und zeitliche Aussage, ohne eine bestimmte historische oder theologische Erfüllung ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ellipse bei »neuen« wird im Haupttext bewahrt und in einer Fußnote erläutert; »Bund« wird bei »den ersten« zur Klarheit ergänzt. Die beiden aufeinander bezogenen Altersbegriffe παλαιούμενον und γηράσκον bleiben als »veraltet und alt wird« erkennbar.
