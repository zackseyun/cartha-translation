  terminology: »Bund« ist als kontextuell eindeutige Ergänzung bei τὴν πρώτην angemessen. »Veraltet« und »Verschwinden« sind hier theologisch und sprachlich neutral genug; sie legen keine über den Argumentationsgang des Verses hinausgehende Folgerung fest.
