  verdict: revise
  source_fidelity: Der Haupttext gibt διαθήκη, die Zeitangabe, die Bundesformeln und die Plurale bei „Gesetze“ zuverlässig wieder. „Sie ihnen ins Herz schreiben“ ist zwar idiomatisch, schwächt jedoch das mit ἐπί ausgedrückte Bild des Schreibens „auf“ die Herzen ab. Die geglättete Wiedergabe des Partizips διδοὺς als Futur ist im Deutschen vertretbar, sofern die Anmerkung die griechische Konstruktion präzise beschreibt.
  naturalness: Der Satz ist gut verständliches, würdiges modernes Standarddeutsch. „Auf ihre Herzen schreiben“ ist etwas bildhafter als „ihnen ins Herz schreiben“, bleibt aber in einer prophetischen Bundesformel natürlich und macht die Inschriftmetapher deutlicher.
  terminology: „Bund“, „Haus Israel“, „Herr“, „Gesetze“, „Gott“ und „Volk“ sind sachgerecht und bewahren die Sprache des Jeremia-Zitats. „Verstand“ ist als Wiedergabe von διάνοιαν möglich; die deutsche distributive Singularform mit pluralischem Possessivpronomen ist akzeptabel.
  issues:
