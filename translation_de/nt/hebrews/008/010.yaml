    rationale: ἐπὶ καρδίας αὐτῶν bezeichnet das Schreiben auf die Herzen. „Ins Herz schreiben“ ist im Deutschen eine etablierte Wendung, legt aber stärker eine Verinnerlichung als die konkrete Inschriftmetapher nahe. „Auf ihre Herzen schreiben“ erhält das Bild des griechischen Textes.
  - severity: low
    issue: Die Fußnote beschreibt das Partizip unpräzise und deutet es mit „indem“ einseitig aus.
    rationale: Nicht das Griechische „gibt ein Partizip wieder“; es verwendet ein Partizip. „Indem“ kann zudem eine kausale oder modale Beziehung festlegen, die die ungewöhnliche Konstruktion nicht eindeutig verlangt. Die Anmerkung sollte die Form ohne weitergehende syntaktische Deutung benennen.
