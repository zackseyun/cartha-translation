source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: de
  text: 'Denn dies ist der Bund, den ich nach jenen Tagen mit dem Haus Israel schließen werde, spricht der Herr: Ich werde meine Gesetze in ihren Verstand legen und sie auf ihre Herzen schreiben. Ich werde ihr Gott sein, und sie werden mein Volk sein.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verwendet zunächst ein Partizip: „meine Gesetze in ihren Verstand gebend/legend“, und danach die Zukunftsform: „und ich werde sie auf ihre Herzen schreiben“. Der Haupttext gibt beide Aussagen idiomatisch als Zukunftsaussagen wieder.'
    reason: Die ungewöhnliche Verbindung des Partizips διδοὺς mit dem Futur ἐπιγράψω wird transparent gemacht, ohne ihre genaue syntaktische Beziehung zusätzlich festzulegen.
lexical_decisions:
- source_word: διαθήκη
  choice: Bund
  rationale: Im Zitat aus Jeremia bezeichnet das Wort die verbindliche Bundesbeziehung, nicht ein Testament.
- source_word: διαθήσομαι
  choice: schließen werde
  rationale: Im Deutschen ist „einen Bund schließen“ die natürliche und sachlich genaue Wiedergabe der Wendung.
- source_word: οἴκῳ Ἰσραήλ
  choice: mit dem Haus Israel
  rationale: Die prophetische und gemeinschaftliche Bundesformel bleibt bewusst erhalten.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: nach jenen Tagen
  rationale: Die wörtlich-nahe prophetische Zeitangabe bewahrt den Bezug zu Jeremia.
- source_word: κύριος
  choice: Herr
  rationale: Dies entspricht dem griechischen κύριος und der neutestamentlichen Zitierform.
- source_word: διδοὺς
  choice: Ich werde … legen
  rationale: Das griechische Partizip wird für natürliches Deutsch als finites Futur wiedergegeben; die formale Besonderheit wird in der Fußnote dokumentiert.
- source_word: νόμους
  choice: Gesetze
  rationale: Der ausdrückliche Plural des griechischen Textes wird beibehalten.
- source_word: διάνοιαν
  choice: Verstand
  rationale: Das Wort bezeichnet hier das innere Denken und Verstehen; „Verstand“ bildet zugleich einen verständlichen Gegenpol zu „Herz“.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: ihnen ins Herz
  rationale: Die idiomatische deutsche Form bewahrt das Bild des Schreibens auf beziehungsweise in das Herz; der griechische Singular „Herz“ wird nicht unnötig pluralisiert.
- source_word: ἐπιγράψω
  choice: schreiben
  rationale: „Schreiben“ gibt die Inschriftmetapher klar und allgemein verständlich wieder.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: Ich werde ihr Gott sein
  rationale: Die geläufige deutsche Bundesformel bewahrt die relationale Aussage.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: sie werden mein Volk sein
  rationale: Die traditionelle und genaue Bundesformel bleibt erhalten.
theological_decisions:
- issue: Erkennbarkeit des Jeremia-Zitats und seiner Bundesformeln
  choice: Formulierungen wie „Bund“, „Haus Israel“, „ihr Gott“ und „mein Volk“ werden bewahrt.
  alternative: Eine freiere Umschreibung in heutiger Alltagssprache.
  rationale: Die theologischen Bezüge des Verses hängen wesentlich an der erkennbaren Sprache des neuen Bundes aus Jeremia.
- issue: Gemischte Verbkonstruktion aus Partizip und Futur
  choice: Im Haupttext wird die Aussage idiomatisch mit zwei zukünftigen Handlungen wiedergegeben.
  alternative: „indem ich meine Gesetze in ihren Verstand lege, und ich werde sie ihnen ins Herz schreiben“
  rationale: Die formnahe Alternative klingt im Deutschen abgebrochen und könnte das Partizip fälschlich als gleichzeitig gegenwärtige Handlung verstehen lassen. Die griechische Form wird deshalb in einer Fußnote offengelegt.
- issue: Singular von διάνοια und καρδίας bei pluralischem Besitzer
  choice: „in ihren Verstand“ und idiomatisch „ihnen ins Herz“
  alternative: „in ihren Verstand und auf ihre Herzen“ beziehungsweise „in ihren Verstand und auf ihr Herz“
  rationale: Der griechische Text hat bei beiden Körper- beziehungsweise Innenbegriffen den Singular. Die deutsche distributive Form wahrt den Sinn, ohne ein einziges gemeinsames Organ nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Bundessprache bleibt erkennbar, während die ungewöhnliche griechische Syntax im Haupttext behutsam geglättet wird. Der Fußnotenmarker [a] steht im Haupttext.
