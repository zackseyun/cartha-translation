  naturalness: „Da es diejenigen gibt, die ...“ ist zwar verständlich, wirkt im modernen Standarddeutsch aber unnötig schwerfällig und wie eine enge Nachbildung des substantivierten Partizips. „Da es solche gibt, die ...“ ist idiomatischer, ohne die Offenheit von τῶν προσφερόντων aufzugeben.
