  rationale: Die einzige Änderung glättet die deutsche Formulierung des Genitivus absolutus. Bedeutung, Argumentationsgang, Irrealität und die bewusste lexikalische Unterscheidung zwischen „darbringen“ und „Gaben“ bleiben erhalten.
