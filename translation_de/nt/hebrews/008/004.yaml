source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: de
  text: Wenn er also auf der Erde wäre, wäre er nicht einmal Priester, da es solche gibt, die die Gaben[a] nach dem Gesetz darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Opfergaben“. Das griechische Wort lautet „Gaben“ und wird in diesem Zusammenhang als kultischer Opferbegriff gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Wenn … also
  rationale: Die Wendung leitet eine folgernde, kontrafaktische Bedingung ein. „Also“ gibt den logischen Übergang natürlich wieder, ohne ein zeitliches „jetzt“ einzuführen.
- source_word: ἦν
  choice: wäre
  rationale: Der Imperfekt steht hier in einer irrealen Bedingung; der deutsche Konjunktiv II bildet diese Aussage angemessen ab.
- source_word: ἐπὶ γῆς
  choice: auf der Erde
  rationale: Die Formulierung bezeichnet im Zusammenhang den irdischen Bereich im Gegensatz zum himmlischen.
- source_word: οὐδ’ ἂν ἦν
  choice: wäre er nicht einmal
  rationale: „Nicht einmal“ bewahrt die verstärkende Verneinung von οὐδέ; der Konjunktiv II entspricht der irrealen Folge.
- source_word: ἱερεύς
  choice: Priester
  rationale: Dies ist die übliche deutsche Bezeichnung für das hier gemeinte kultische Amt.
- source_word: ὄντων τῶν προσφερόντων
  choice: da es diejenigen gibt, die … darbringen
  rationale: Der Genitivus absolutus bezeichnet hier den begründenden Umstand. Die gewählte Fassung bleibt nahe am Wortlaut und ist im Deutschen verständlich.
- source_word: κατὰ νόμον
  choice: nach dem Gesetz
  rationale: Die Wendung bezeichnet die Übereinstimmung mit der gesetzlichen Ordnung; im Zusammenhang ist das mosaische Gesetz gemeint, ohne dass dies im Text ergänzt werden muss.
- source_word: τὰ δῶρα
  choice: die Gaben
  rationale: „Gaben“ bewahrt die Grundbedeutung und die kultische Verwendung von δῶρα, während „darbringen“ das Verb προσφέρειν wiedergibt.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Bedingungssatzes
  choice: Das Subjekt wird mit „er“ ausgedrückt und bezieht sich auf Jesus beziehungsweise den Messias im unmittelbaren Zusammenhang.
  alternative: Das Subjekt unbestimmt lassen.
  rationale: Im Deutschen verlangt der Satz ein ausdrückliches Subjekt; der Bezug ergibt sich eindeutig aus dem Kontext und fügt keine zusätzliche Lehraussage ein.
- issue: Aussagekraft der Bedingung
  choice: 'Wiedergabe als irrealer Bedingungssatz: „Wenn er … wäre, wäre er … nicht“.'
  alternative: Wiedergabe als offene oder rein vergangenheitsbezogene Bedingung.
  rationale: Die Konstruktion εἰ mit Imperfekt und ἄν mit Imperfekt bezeichnet eine kontrafaktische Bedingung. Der Konjunktiv II bewahrt diese Aussage, ohne ihre theologischen Folgerungen weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt argumentativ und relativ formal, ist aber ohne kirchlichen Fachjargon verständlich. Der Fußnotenmarker steht unmittelbar bei „Gaben“, auf die sich die Anmerkung bezieht.
