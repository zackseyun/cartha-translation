  source_fidelity: Die Übersetzung gibt μεμφόμενος αὐτούς treffend als „er tadelt sie“ wieder und wahrt damit den im SBLGNT stehenden, nicht weiter spezifizierten Bezug. „Seht“ bildet Ἰδού als prophetischen Aufmerksamkeitsruf angemessen ab. „Es kommen Tage“ entspricht ἡμέραι ἔρχονται, und „einen neuen Bund schließen“ ist für συντελέσω … διαθήκην eine idiomatische und sachlich passende Wiedergabe. Die beiden „Haus“-Bezeichnungen sowie die Schlusssetzung des fortlaufenden Zitats sind erhalten.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Satzführung ist flüssig; „spricht der Herr“ passt zum prophetischen Zitierstil und bleibt verständlich.
