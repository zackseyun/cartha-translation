id: HEB.8.8
reference: Hebrews 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: de
  text: 'Denn er tadelt sie[a] und sagt: »Seht, es kommen Tage, spricht der Herr, da werde ich mit dem Haus Israel und mit dem Haus Juda einen neuen Bund schließen,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige griechische Handschriften lesen statt „sie“ sinngemäß: „zu ihnen“.'
    reason: Dokumentiert die bedeutungsrelevante Textvariante αὐτοῖς gegenüber dem im SBLGNT gedruckten αὐτούς.
lexical_decisions:
- source_word: μεμφόμενος
  choice: er tadelt
  rationale: Gibt den Vorwurf des Partizips klar und natürlich wieder, ohne ihn abzuschwächen.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der griechischen Partikel in verständlichem, gegenwärtigem Deutsch.
- source_word: συντελέσω … διαθήκην
  choice: werde … einen … Bund schließen
  rationale: „Einen Bund schließen“ ist die natürliche deutsche Entsprechung für das Zustandebringen bzw. rechtskräftige Einsetzen eines Bundes.
- source_word: οἶκον
  choice: Haus
  rationale: Erhält das biblische Bild für das jeweilige Volk bzw. Gemeinwesen, statt es interpretierend aufzulösen.
theological_decisions:
- issue: Bezugswort von αὐτούς („sie“)
  choice: Das Akkusativobjekt wird als „sie“ wiedergegeben, ohne den Bezug im Vers ausdrücklich festzulegen.
  alternative: „den ersten Bund“ oder ausdrücklich „das Volk“
  rationale: Der griechische Text nennt den Bezug nicht erneut; eine ausdrückliche Identifikation würde die Auslegung vorwegnehmen.
- issue: Bedeutung von διαθήκη
  choice: Bund
  alternative: Testament
  rationale: Im Zitat aus Jeremia und in Verbindung mit Israel und Juda bezeichnet διαθήκη einen von Gott gesetzten Bund; „Testament“ wäre hier im Deutschen irreführend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ erhält den prophetischen Aufmerksamkeitsruf, während „einen Bund schließen“ idiomatisch und allgemein verständlich ist. Das abschließende Komma zeigt, dass das Zitat im folgenden Vers weitergeht.
