id: HEB.8.3
reference: Hebrews 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: de
  text: Denn jeder Hohepriester wird dazu eingesetzt, sowohl Gaben als auch Opfer darzubringen. Daher muss auch dieser etwas haben, das er darbringen kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Daher muss auch dieser etwas darzubringen haben.“ Mit „dieser“ ist im Zusammenhang Jesus als Hohepriester gemeint; der griechische Wortlaut nennt ihn hier jedoch nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Denn jeder Hohepriester
  rationale: 'πᾶς mit einem Substantiv im Singular hat distributiven Sinn: „jeder“. γάρ kennzeichnet die Begründung zum vorangehenden Vers und wird mit „denn“ wiedergegeben. ἀρχιερεύς bezeichnet hier präzise den Hohepriester.'
- source_word: εἰς τὸ προσφέρειν
  choice: dazu … darzubringen
  rationale: Die Verbindung aus εἰς und substantiviertem Infinitiv bezeichnet den Zweck. „dazu … darzubringen“ gibt diesen Zweck in natürlichem Deutsch wieder.
- source_word: δῶρά τε καὶ θυσίας
  choice: sowohl Gaben als auch Opfer
  rationale: „sowohl … als auch“ bildet τε καὶ ab und hält die beiden kultischen Kategorien δῶρα und θυσίαι auseinander.
- source_word: καθίσταται
  choice: wird … eingesetzt
  rationale: Das Passiv von καθίστημι bezeichnet in diesem priesterlichen Zusammenhang die Einsetzung in ein Amt. „eingesetzt“ ist sachlich und idiomatisch.
- source_word: ὅθεν
  choice: Daher
  rationale: ὅθεν leitet hier eine Folgerung aus dem zuvor genannten allgemeinen Grundsatz ein.
- source_word: ἀναγκαῖον ἔχειν
  choice: muss … haben
  rationale: Die unpersönliche Wendung drückt Notwendigkeit aus. Die deutsche Konstruktion mit „muss“ ist klar und natürlich, ohne den Aussagegehalt abzuschwächen.
- source_word: τι
  choice: etwas
  rationale: Das Indefinitpronomen bezeichnet einen nicht näher bestimmten Gegenstand der Darbringung.
- source_word: καὶ τοῦτον
  choice: auch dieser
  rationale: „dieser“ bewahrt die demonstrative Kraft von τοῦτον, während „auch“ καί wiedergibt. Der Bezug auf Jesus ergibt sich aus dem Zusammenhang und wird nicht in den Haupttext hineingetragen.
- source_word: ὃ προσενέγκῃ
  choice: das er darbringen kann
  rationale: Das Relativpronomen mit Aorist Konjunktiv bezeichnet hier das, was zur Darbringung bestimmt beziehungsweise verfügbar ist. „darbringen kann“ gibt diese mögliche beziehungsweise vorgesehene Handlung verständlich wieder.
theological_decisions:
- issue: Bezug von τοῦτον („dieser“)
  choice: Der Haupttext lässt den Bezug wie das Griechische unausgesprochen; im Kontext ist Jesus als Hohepriester gemeint.
  alternative: Im Haupttext ausdrücklich „Jesus“, „Christus“ oder „der Messias“ einsetzen.
  rationale: Der Kontext identifiziert den Gemeinten eindeutig, doch der griechische Wortlaut verwendet lediglich ein Demonstrativpronomen. „Dieser“ wahrt diese sprachliche Zurückhaltung.
- issue: Kultische Begriffe δῶρα und θυσίαι
  choice: „Gaben“ und „Opfer“ werden als zwei Begriffe beibehalten.
  alternative: Die Begriffe zu „Opfergaben“ zusammenziehen oder die Aussage als Hinweis auf Jesu Selbsthingabe ausdeuten.
  rationale: Der Vers formuliert zunächst einen allgemeinen Grundsatz über das hohepriesterliche Amt. Die Übersetzung sollte die beiden Begriffe weder verschmelzen noch die spätere christologische Entfaltung vorwegnehmen.
- issue: Art dessen, was Christus darbringt
  choice: Der Gegenstand bleibt mit „etwas“ unbestimmt.
  alternative: Im Haupttext ausdrücklich Jesu Leib, Leben oder Selbstopfer nennen.
  rationale: τι ist unbestimmt. Was Jesus darbringt, wird im weiteren Zusammenhang entfaltet, aber in diesem Vers nicht ausdrücklich benannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hohepriester“, „Gaben“, „Opfer“ und „darbringen“ bewahren die kultische Sprache des Abschnitts; „wird dazu eingesetzt“ und „muss … haben“ sorgen zugleich für einen natürlichen deutschen Satzbau.
