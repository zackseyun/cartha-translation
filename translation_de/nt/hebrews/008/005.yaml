  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: de
  text: 'Sie verrichten ihren Dienst an einem Abbild und Schatten der himmlischen Dinge, so wie Mose eine göttliche Weisung erhielt[a], als er im Begriff war, das Zelt zu errichten[b]. Denn Gott sagt: »Sieh zu, dass du alles nach dem Vorbild anfertigst, das dir auf dem Berg gezeigt worden ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Gott gewarnt wurde«; das griechische Verb kann eine göttliche Weisung mit mahnendem oder warnendem Nachdruck bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu vollenden«; das griechische Verb kann sowohl die Ausführung als auch die Vollendung des Zeltes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: sie
  rationale: Das Pronomen greift die zuvor genannten Priester auf. Im Deutschen führt „sie“ den Satz natürlich fort, ohne die qualitative Nuance überzubetonen.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: an einem Abbild und Schatten
  rationale: „Abbild“ bezeichnet hier das irdische Gegenstück zur himmlischen Wirklichkeit; „Schatten“ bewahrt die prägnante Metapher des Hebräerbriefs. Die gemeinsame Dativkonstruktion wird mit „Dienst an“ idiomatisch wiedergegeben.
- source_word: λατρεύουσιν
  choice: versehen ihren Dienst
  rationale: Das Verb bezeichnet kultischen beziehungsweise priesterlichen Dienst. Die Formulierung macht diesen Sinn im Deutschen deutlich, ohne zusätzlich „Gottesdienst“ oder „Anbetung“ einzutragen.
- source_word: τῶν ἐπουρανίων
  choice: der himmlischen Dinge
  rationale: Die breite Formulierung lässt offen, ob vor allem himmlische Gegebenheiten, Einrichtungen oder Wirklichkeiten gemeint sind.
- source_word: κεχρημάτισται
  choice: eine göttliche Weisung erhielt
  rationale: Das Passiv bezeichnet eine Mitteilung göttlichen Ursprungs. „Göttliche Weisung“ bewahrt sowohl den Offenbarungs- als auch den Anweisungscharakter; die mögliche Warnungsnuance steht in der Fußnote.
- source_word: μέλλων ἐπιτελεῖν
  choice: als er … errichten wollte
  rationale: Die Wendung beschreibt das unmittelbar bevorstehende Vorhaben des Mose. Im Zusammenhang mit dem Zelt ist „errichten“ natürlich; die stärker auf Vollendung zielende lexikalische Möglichkeit wird in einer Fußnote genannt.
- source_word: τὴν σκηνήν
  choice: das Zelt
  rationale: „Zelt“ gibt σκηνή unmittelbar und verständlich wieder; der Zusammenhang kennzeichnet es als das Heiligtumszelt Israels.
- source_word: Ὅρα
  choice: Sieh zu
  rationale: Die Wendung erhält den Bildbezug von „sehen“ und gibt zugleich die mahnende Kraft des Imperativs idiomatisch wieder.
- source_word: ποιήσεις πάντα
  choice: dass du alles … anfertigst
  rationale: Der griechische Futur hat im Zitat gebietende Kraft. Die deutsche Konstruktion nach „Sieh zu“ bringt den Befehl natürlich zum Ausdruck.
- source_word: κατὰ τὸν τύπον
  choice: nach dem Vorbild
  rationale: „Vorbild“ bezeichnet hier das Mose gezeigte Muster, nach dem das irdische Zelt anzufertigen ist.
theological_decisions:
- issue: Verhältnis des irdischen Heiligtums zum Himmlischen
  choice: „ein Abbild und Schatten der himmlischen Dinge“
  alternative: „ein Beispiel und Schatten der himmlischen Wirklichkeiten“
  rationale: Die Wiedergabe wahrt zugleich die Entsprechung zum Himmlischen und die geringere, schattenhafte Beschaffenheit des irdischen Dienstbereichs, ohne das Verhältnis auf bloße Symbolik festzulegen.
- issue: Bedeutungsumfang von κεχρημάτισται
  choice: „eine göttliche Weisung erhielt“
  alternative: „von Gott gewarnt wurde“
  rationale: Die Hauptfassung betont die göttliche Mitteilung und ihre anweisende Funktion. Da der Zusammenhang auch eine mahnende Nuance zulässt, wird „gewarnt“ als Alternative ausgewiesen.
- issue: Referenz der „himmlischen Dinge“
  choice: breite sachliche Formulierung beibehalten
  alternative: „himmlische Wirklichkeiten“
  rationale: „Dinge“ legt nicht genauer fest, ob Orte, Einrichtungen oder umfassendere Wirklichkeiten gemeint sind, und bewahrt damit die Offenheit des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ihren Dienst versehen“ kennzeichnet den kultischen Zusammenhang, ohne altertümlich zu wirken. „Sieh zu“ bewahrt die Direktheit und den mahnenden Ton des Schriftzitats.
