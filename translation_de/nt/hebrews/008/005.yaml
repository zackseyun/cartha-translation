    rationale: μέλλων mit Infinitiv bedeutet hier, dass Mose im Begriff war bzw. kurz davorstand, das Zelt zu errichten; es bezeichnet nicht lediglich seinen Willen oder seine Absicht.
  - severity: medium
    issue: „Denn er sagt“ lässt den Sprecher des Zitats missverständlich.
    rationale: Das ungenannte Subjekt von φησίν ist im griechischen Kontext Gott, der Mose die Weisung erteilt. Im Deutschen kann „er“ nach der Nennung Moses leicht fälschlich auf Mose bezogen werden.
