  source_fidelity: 'Die Grundwiedergabe trifft den Sinn von ὑποδείγματι καὶ σκιᾷ τῶν ἐπουρανίων sowie die kultische Bedeutung von λατρεύειν gut. Eine Präzisierung ist bei μέλλων erforderlich: „wollte“ bezeichnet bloß eine Absicht, während der griechische Ausdruck das unmittelbar Bevorstehen markiert. Außerdem ist das implizite Subjekt von φησίν im Zitat Gott, nicht Mose.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. „Im Begriff war“ gibt den prospektiven Aspekt idiomatisch wieder. Die ausdrückliche Nennung Gottes vor dem Zitat verhindert eine naheliegende, aber unzutreffende Rückbeziehung von „er sagt“ auf Mose.
  terminology: „Abbild und Schatten der himmlischen Dinge“, „göttliche Weisung“, „Zelt“ und „Vorbild“ sind sachgerecht. Die Fußnoten bleiben an ihren jeweiligen lexikalischen Alternativen verankert und sind mit der revidierten Syntax vereinbar.
