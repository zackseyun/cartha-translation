source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: de
  text: 'Und keiner wird jemals seinen Mitbürger[a] oder seinen Bruder belehren und sagen: »Erkenne den Herrn!« Denn sie alle werden mich kennen, vom Geringsten bis zum Größten unter ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nächsten«. Im griechischen Text des Hebräerbriefs steht »Mitbürger«, während die zugrunde liegende Stelle in Jeremia gewöhnlich mit »Nächster« wiedergegeben wird.'
    reason: Alternative Wiedergabe aufgrund des abweichenden Wortlauts der zugrunde liegenden Jeremia-Stelle.
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: ganz gewiss wird keiner mehr … belehren
  rationale: οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung aus. »Ganz gewiss … keiner« gibt diese Stärke in natürlichem Deutsch wieder; »mehr« verdeutlicht im Zusammenhang der neuen Bundesordnung, dass diese Art der Belehrung nicht fortbestehen wird.
- source_word: ἕκαστος
  choice: keiner … seinen
  rationale: Die deutsche Konstruktion mit »keiner« und dem jeweiligen Possessivpronomen gibt die distributive Aussage idiomatisch wieder, ohne das schwerfällige »ein jeder … ein jeder«.
- source_word: πολίτην
  choice: Mitbürger
  rationale: πολίτης bezeichnet hier wörtlich einen Bürger beziehungsweise Mitbürger. Die Übersetzung folgt dem erhaltenen griechischen Wortlaut des Hebräerbriefs; die aus Jeremia vertraute Wiedergabe »Nächster« steht in der Fußnote.
- source_word: ἀδελφὸν
  choice: Bruder
  rationale: Das griechische Substantiv steht im maskulinen Singular. »Bruder« bewahrt sowohl die Form als auch die familiäre Bundessprache des Ausgangstextes.
- source_word: Γνῶθι
  choice: Erkenne
  rationale: Der Aorist Imperativ fordert dazu auf, den Herrn zu erkennen. »Erkenne« ist in diesem feierlichen Zitat knapp, verständlich und semantisch weiter als bloßes Faktenwissen.
- source_word: κύριον
  choice: Herrn
  rationale: »Herr« ist die etablierte und kontextuell passende Wiedergabe von κύριος und bewahrt den Widerhall des Jeremia-Zitats.
- source_word: πάντες εἰδήσουσίν με
  choice: sie alle werden mich kennen
  rationale: Die Formulierung bewahrt das ausdrückliche Objekt »mich« und die umfassende Aussage von πάντες. »Kennen« bezeichnet hier persönliche, unmittelbare Kenntnis.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: vom Geringsten bis zum Größten unter ihnen
  rationale: Die idiomatische Wendung umfasst die gesamte Gruppe über Rang-, Alters- oder Statusunterschiede hinweg, ohne sie auf nur eine dieser Kategorien festzulegen.
theological_decisions:
- issue: Wiedergabe von πολίτην innerhalb des Jeremia-Zitats
  choice: Mitbürger
  alternative: Nächster
  rationale: Der griechische Text des Hebräerbriefs hat πολίτην, auch wenn die zugrunde liegende Jeremia-Stelle gewöhnlich mit »Nächster« wiedergegeben wird. Der Haupttext folgt daher dem unmittelbar vorliegenden griechischen Wortlaut; die traditionelle Alternative bleibt als Fußnote sichtbar.
- issue: Geschlechtsspezifische Familiensprache in ἀδελφόν
  choice: Bruder
  alternative: Bruder oder Schwester
  rationale: Der Ausgangstext verwendet den maskulinen Singular. Die Übersetzung bewahrt diese konkrete Form, ohne damit die umfassende Geltung der Bundesverheißung einzuschränken.
- issue: Art der im neuen Bund entfallenden Belehrung
  choice: 'belehren und sagen: »Erkenne den Herrn!«'
  alternative: überhaupt nicht mehr lehren
  rationale: Der Satz verneint im unmittelbaren Wortlaut die gegenseitige Aufforderung, den Herrn zu erkennen. Die Übersetzung formuliert deshalb nicht pauschal, jede Form von Lehre werde abgeschafft, sondern erhält den ausdrücklich genannten Inhalt der Belehrung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nachdrückliche Verneinung wird mit »ganz gewiss« ausgedrückt. Die distributive griechische Satzform wird zugunsten natürlicher deutscher Syntax mit »keiner … seinen« wiedergegeben; die Parallelität von Mitbürger und Bruder bleibt erhalten.
