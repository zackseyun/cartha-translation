base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: de
  text: Denn ich werde ihren Ungerechtigkeiten gegenüber gnädig sein,[a] und an ihre Sünden werde ich nicht mehr denken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ich werde ihren Unrechtstaten gegenüber gnädig sein.“ Das griechische Wort kann Ungerechtigkeit, Unrecht oder konkrete Unrechtstaten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und ihrer Sünden werde ich gewiss nicht mehr gedenken.“ Die verstärkte Verneinung drückt in diesem Bundeskontext vollständige Vergebung aus; das Bild des Nicht-mehr-Erinnerns bleibt im Text erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung beziehungsweise Erläuterung der vorausgehenden Bundesverheißung ein.
- source_word: ἵλεως ἔσομαι
  choice: ich werde … gnädig sein
  rationale: Gibt die zugesagte barmherzige und vergebende Zuwendung Gottes in natürlichem, würdigem Deutsch wieder.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: ihnen gegenüber … trotz ihrer Ungerechtigkeiten
  rationale: Der Dativ bezeichnet, wem beziehungsweise in Bezug worauf die Gnade gilt. Der Plural „Ungerechtigkeiten“ wahrt die Form und lässt sowohl Unrechtstaten als auch moralische Verfehlungen anklingen; „trotz“ verdeutlicht idiomatisch den nicht billligenden Sinn von ἵλεως gegenüber dem Unrecht.
- source_word: καὶ
  choice: und
  rationale: Schlichte koordinierende Konjunktion.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: ihre Sünden
  rationale: Die übliche und direkte Wiedergabe des Plurals von ἁμαρτία.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: werde ich nicht mehr denken
  rationale: „Nicht mehr“ gibt ἔτι mit der verstärkten Verneinung οὐ μή natürlich wieder. Die Voranstellung von „an ihre Sünden“ bewahrt einen würdigen deutschen Satzrhythmus.
theological_decisions:
- issue: Bedeutung des göttlichen Nicht-mehr-Gedenkens
  choice: Das biblische Bild „an ihre Sünden nicht mehr denken“ bleibt im Haupttext erhalten.
  alternative: 'Ausdeutend: „ihnen ihre Sünden nicht mehr anrechnen“; oder wörtlich als Verlust göttlichen Wissens verstehen.'
  rationale: Im Bundeskontext drückt die Wendung entschiedene Vergebung aus. Die Übersetzung bewahrt dennoch das Bild und erklärt seine Tragweite nur in der Fußnote, statt die theologische Spannung im Haupttext aufzulösen.
- issue: Gnade gegenüber Ungerechtigkeiten
  choice: Gnade gilt den Menschen trotz ihrer Ungerechtigkeiten, nicht den Ungerechtigkeiten als solchen.
  alternative: 'Formal: „ihren Ungerechtigkeiten gnädig sein“ oder „ihren Ungerechtigkeiten gegenüber günstig gesinnt sein“.'
  rationale: Die gewählte deutsche Formulierung verhindert das Missverständnis, Gott heiße das Unrecht gut, und bewahrt zugleich den Bezug des griechischen Dativs.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung lehnt sich an die feierliche Sprache der Bundesverheißung an, ohne altertümliche Formen wie „gedenken“ im Haupttext zu verlangen.
