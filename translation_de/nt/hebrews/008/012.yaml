revisions:
- from: Denn ich werde ihnen gegenüber gnädig sein trotz ihrer Ungerechtigkeiten,[a] und an ihre Sünden werde ich nicht mehr denken.[b]
  to: Denn ich werde ihren Ungerechtigkeiten gegenüber gnädig sein,[a] und an ihre Sünden werde ich nicht mehr denken.[b]
  rationale: Die einzige sachlich nötige Änderung entfernt „trotz“, da dieses Wort eine im griechischen Wortlaut nicht ausdrücklich markierte konzessive Aussage ergänzt und die direkte Verbindung von ἵλεως mit ταῖς ἀδικίαις abschwächt. Die revidierte Fassung erhält die griechische Ambiguität und den biblischen Ausdruck, ohne Gottes Haltung gegenüber dem Unrecht dogmatisch oder paraphrasierend auszuformulieren. Die Fußnotenanker bleiben an den jeweiligen Bezugsstellen.
