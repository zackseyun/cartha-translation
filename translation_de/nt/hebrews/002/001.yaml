  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: de
  text: Deshalb müssen wir umso sorgfältiger auf das achten, was wir gehört haben, damit wir nicht abdriften.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir nicht daran vorbeigleiten“; möglicherweise auch: „damit wir es uns nicht entgleiten lassen“. Das griechische Verb vermittelt das Bild des Ab- oder Vorbeigleitens beziehungsweise des Entgleitens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Stellt knapp und natürlich den begründenden Rückbezug auf die vorausgehende Darlegung her.
- source_word: δεῖ
  choice: müssen wir
  rationale: Gibt die Notwendigkeit deutlich wieder; „wir“ entspricht dem ausdrücklichen ἡμᾶς in der Infinitivkonstruktion.
- source_word: περισσοτέρως
  choice: umso genauer
  rationale: Bewahrt die steigernde Kraft des Komparativs und bildet mit „auf etwas achten“ eine natürliche deutsche Verbindung.
- source_word: προσέχειν ἡμᾶς
  choice: müssen wir … auf … achten
  rationale: Gibt die Aufforderung wieder, die Aufmerksamkeit bewusst auf etwas zu richten, ohne bereits die stärkere Bedeutung „daran festhalten“ einzutragen.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: auf das …, was wir gehört haben
  rationale: Natürliche Wiedergabe des substantivierten Partizips; sie lässt offen, ob vor allem die Botschaft oder ihr gesamter Inhalt gemeint ist.
- source_word: μήποτε
  choice: damit … nicht
  rationale: Drückt die warnende Befürchtung eines möglichen negativen Ausgangs in geläufigem modernem Deutsch aus.
- source_word: παραρυῶμεν
  choice: wir … daran vorbeitreiben
  rationale: Erhält das Bild einer unmerklichen Bewegung in der Strömung und bezieht die gefährliche Bewegung entsprechend der Form des Verbs auf die Hörenden.
theological_decisions:
- issue: Bezug und Bild der Warnung in παραρυῶμεν
  choice: Die Hörenden treiben an dem Gehörten vorbei.
  alternative: 'Wir treiben davon; oder: Wir lassen das Gehörte entgleiten.'
  rationale: Das Verb bezeichnet bildhaft ein Vorbei- oder Abtreiben, kann im Kontext aber unterschiedlich entfaltet werden. Die Hauptfassung wahrt die Hörenden als grammatisches Subjekt und das Strömungsbild, ohne die Warnung in ein bestimmtes Lehrsystem über Abfall einzuordnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist klar und mahnend; das ungewöhnliche, aber verständliche Bild „daran vorbeitreiben“ bewahrt die Metaphorik und Mehrdeutigkeit des griechischen Verbs.
