source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: de
  text: Denn weil er selbst gelitten hat, als er versucht wurde[a], kann er denen helfen, die versucht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder in beiden Fällen „geprüft“: „Denn weil er selbst gelitten hat, als er geprüft wurde, kann er denen helfen, die geprüft werden.“ Das griechische Verb kann je nach Zusammenhang sowohl „versuchen“ als auch „prüfen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: Denn weil
  rationale: Die Verbindung leitet eine Begründung ein. „Denn weil“ bewahrt sowohl die erklärende Funktion von γάρ als auch den kausalen Sinn von ἐν ᾧ und schließt natürlich an den vorherigen Vers an.
- source_word: πέπονθεν
  choice: gelitten hat
  rationale: Das Perfekt bezeichnet eine vollzogene Erfahrung mit fortdauernder Bedeutung. Das deutsche Perfekt klingt natürlich und lässt diese bleibende Relevanz erkennen.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Die betonte Form hebt hervor, dass der Sohn diese Erfahrung persönlich durchgemacht hat.
- source_word: πειρασθείς
  choice: als er versucht wurde
  rationale: Das Partizip beschreibt die Situation, in der er litt. πειράζω kann je nach Zusammenhang „versuchen“ oder „prüfen“ bedeuten; „versuchen“ wahrt hier die Verbindung zu Hebräer 4,15, während die Alternative in der Fußnote erhalten bleibt.
- source_word: δύναται
  choice: kann er
  rationale: „Kann“ gibt die ausgesagte Fähigkeit in natürlichem, klarem Deutsch wieder.
- source_word: τοῖς πειραζομένοις
  choice: denen, die versucht werden
  rationale: Das Präsenspartizip bezeichnet Menschen, die gegenwärtig Versuchung oder Prüfung erfahren. Die Formulierung bewahrt den fortdauernden Vorgang.
- source_word: βοηθῆσαι
  choice: helfen
  rationale: βοηθέω bedeutet „helfen“ oder „zu Hilfe kommen“. „Helfen“ ist klar, würdig und im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutung von πειράζω in Bezug auf Jesus und die Menschen
  choice: versucht
  alternative: geprüft
  rationale: „Versucht“ bewahrt den geläufigen neutestamentlichen Sinn und die enge Verbindung zu Hebräer 4,15, ohne ein Nachgeben Jesu gegenüber der Versuchung anzudeuten. Da das griechische Verb ebenso „prüfen“ heißen kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die kausale Argumentation und die Betonung von „er selbst“ bleiben sichtbar; die lexikalische Mehrdeutigkeit von πειράζω wird nicht im Haupttext überladen, sondern in der Fußnote bewahrt.
