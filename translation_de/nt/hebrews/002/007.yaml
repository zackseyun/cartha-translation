id: HEB.2.7
reference: Hebrews 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: de
  text: Du hast ihn für kurze Zeit niedriger gemacht als die Engel[a]; mit Herrlichkeit und Ehre hast du ihn gekrönt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast ihn ein wenig niedriger gemacht als die Engel.“ Der griechische Ausdruck kann statt einer Zeitdauer auch einen Grad bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: du hast ihn … niedriger gemacht
  rationale: 'Das Verb ist ein Aorist Aktiv Indikativ, 2. Person Singular, und hat hier zusammen mit παρά + Akkusativ kausativ-vergleichenden Sinn: jemanden niedriger machen als einen anderen.'
- source_word: αὐτὸν
  choice: ihn
  rationale: Das maskuline Singularpronomen bleibt erhalten und verweist auf die menschliche Gestalt des Psalmzitats, ohne ein im griechischen Satz nicht ausdrücklich genanntes Substantiv einzufügen.
- source_word: βραχύ τι
  choice: für kurze Zeit
  rationale: Die Wendung kann zeitlich oder graduell verstanden werden. Im Zusammenhang von Hebräer 2 ist die zeitliche Deutung gut begründet; die ebenfalls mögliche graduelle Deutung wird in der Fußnote bewahrt.
- source_word: παρ’ ἀγγέλους
  choice: als die Engel
  rationale: παρά mit Akkusativ drückt nach ἐλαττόω den Vergleich aus und wird im Deutschen idiomatisch mit „als“ wiedergegeben.
- source_word: δόξῃ
  choice: mit Herrlichkeit
  rationale: Der Dativ bezeichnet zusammen mit στεφανόω das, womit jemand gekrönt wird. „Herrlichkeit“ gibt δόξα in diesem erhöhten, biblischen Kontext treffend wieder.
- source_word: τιμῇ
  choice: und Ehre
  rationale: τιμή bezeichnet hier verliehenes Ansehen und bildet mit δόξα die natürliche Wortverbindung „Herrlichkeit und Ehre“.
- source_word: ἐστεφάνωσας
  choice: hast du … gekrönt
  rationale: Der Aorist Aktiv Indikativ, 2. Person Singular, wird im Deutschen natürlich mit dem Perfekt wiedergegeben; die bildhafte Aussage des Verbs bleibt direkt erhalten.
- source_word: αὐτόν
  choice: ihn
  rationale: Das wiederholte Objektpronomen wird in der deutschen Satzstruktur ausdrücklich wiedergegeben.
theological_decisions:
- issue: Bedeutung von βραχύ τι im auf Christus bezogenen Zitat aus Psalm 8
  choice: 'zeitlich: „für kurze Zeit“'
  alternative: 'graduell: „ein wenig niedriger“'
  rationale: Der griechische Ausdruck lässt beide Deutungen zu. Die zeitliche Lesart passt besonders zum unmittelbaren Gedankengang über Jesu zeitweilige Erniedrigung und anschließende Krönung; die graduelle Lesart bleibt als echte Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede Gottes steht in der üblichen Kleinschreibung. Die parallele Satzstruktur des Psalmzitats wurde bewahrt; zugleich wurde der zweite Satzteil für natürliches Deutsch umgestellt.
