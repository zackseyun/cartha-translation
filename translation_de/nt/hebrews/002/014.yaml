id: HEB.2.14
reference: Hebrews 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: de
  text: Da nun die Kinder Anteil an Blut und Fleisch[a] haben, nahm auch er selbst in ähnlicher Weise an denselben Dingen teil, damit er durch den Tod den entmachte, der die Macht über den Tod hat, das heißt den Teufel[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Blut und Fleisch“; üblich ist im Deutschen die Wortfolge „Fleisch und Blut“.'
    reason: Die Hauptübersetzung bewahrt die griechische Reihenfolge, während die Fußnote die geläufige deutsche Wendung nennt.
  - marker: b
    text: 'Oder: „unwirksam machte“; traditionell auch „vernichtete“. Das Verb kann bedeuten, jemanden zu entmachten oder etwas außer Kraft zu setzen, ohne eine Auslöschung der Existenz zu bezeichnen.'
    reason: Die Fußnote macht die Bedeutungsbreite von καταργέω und die traditionelle Übersetzungsalternative transparent.
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Da nun
  rationale: Gibt die begründende Kraft von ἐπεί und den rückbezüglichen Folgerungscharakter von οὖν knapp und natürlich wieder.
- source_word: τὰ παιδία
  choice: die Kinder
  rationale: Entspricht der Bezeichnung im Kontext und vermeidet eine unnötige Präzisierung als kleine Kinder oder Nachkommen.
- source_word: κεκοινώνηκεν
  choice: Anteil … haben
  rationale: Das deutsche Präsens bezeichnet idiomatisch den aus der vollzogenen Teilhabe bestehenden Zustand des griechischen Perfekts.
- source_word: αἵματος καὶ σαρκός
  choice: Blut und Fleisch
  rationale: Bewahrt die Reihenfolge des SBLGNT und gibt σάρξ hier konkret als Fleisch wieder, nicht als sündige Natur.
- source_word: καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν
  choice: nahm auch er selbst in ähnlicher Weise an denselben Dingen teil
  rationale: Bewahrt die Betonung von αὐτός, die Ähnlichkeitsaussage von παραπλησίως und den bewussten Wechsel von κοινωνέω zu μετέχω.
- source_word: ἵνα διὰ τοῦ θανάτου
  choice: damit er durch den Tod
  rationale: Drückt Zweck und Mittel klar aus.
- source_word: καταργήσῃ
  choice: entmachte
  rationale: Bezeichnet das Außerkraftsetzen beziehungsweise den Entzug wirksamer Macht, ohne eine Vernichtung der Existenz zu behaupten.
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: den, der die Macht über den Tod hat
  rationale: κράτος wird als Macht wiedergegeben; die Genitivverbindung lässt sich im Deutschen hier verständlich als Macht über den Tod ausdrücken.
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: das heißt den Teufel
  rationale: Gibt die ausdrückliche Identifizierung sachlich und idiomatisch wieder.
theological_decisions:
- issue: Teilhabe Christi an der menschlichen Existenz
  choice: „nahm auch er selbst in ähnlicher Weise an denselben Dingen teil“
  alternative: „hatte er in gleicher Weise daran Anteil“
  rationale: Die Formulierung bekräftigt wirkliche Teilhabe, lässt aber die durch παραπλησίως und den Verbwechsel gesetzte sprachliche Differenz stehen, ohne spätere dogmatische Terminologie in den Vers einzutragen.
- issue: Wirkung von καταργέω auf den Teufel
  choice: „entmachte“
  alternative: „machte … unwirksam“ oder traditionell „vernichtete“
  rationale: „Entmachten“ trifft hier den Entzug wirksamer Macht und vermeidet die unbelegte Aussage, der Teufel werde in seiner Existenz ausgelöscht.
- issue: Verhältnis des Teufels zum Tod
  choice: „die Macht über den Tod hat“
  alternative: „die Macht des Todes hat“
  rationale: Die gewählte Formulierung ist im Deutschen natürlich und wahrt die Aussage des Genitivs, ohne näher festzulegen, auf welche Weise oder in welchem Umfang diese Macht ausgeübt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der argumentativen Bewegung des Griechischen; „Anteil haben/teilnehmen“ hält die lexikalische Parallelität fest, während „in ähnlicher Weise“ die vorsichtige Nuance von παραπλησίως bewahrt.
