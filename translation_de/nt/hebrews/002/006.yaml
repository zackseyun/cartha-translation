  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: de
  text: 'Doch irgendwo[a] hat jemand bezeugt:


    »Was ist der Mensch, dass du an ihn denkst,[b]

    oder der Menschensohn,[c] dass du dich um ihn kümmerst?[d]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „irgendwo“ führt der Verfasser eine bekannte Schriftstelle an, ohne hier ihren Ort zu nennen; zitiert wird Psalm 8,5 (in abweichender Zählung Psalm 8,4).
    reason: cross_reference
  - marker: b
    text: 'Oder: „dass du seiner gedenkst“ beziehungsweise „ihn im Sinn hast“.'
    reason: lexical_alternative
  - marker: c
    text: Im Zusammenhang von Psalm 8 ist „Menschensohn“ eine poetische Bezeichnung für den Menschen. Im weiteren Zusammenhang des Hebräerbriefs gewinnt die Wendung zugleich Bedeutung für Jesus.
    reason: theological_clarification
  - marker: d
    text: 'Oder: „dass du nach ihm siehst“ beziehungsweise „ihn aufsuchst“. Das griechische Verb kann fürsorgliche Zuwendung durch ein Aufsuchen oder Nachsehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: hat … bezeugt
  rationale: Das Verb bezeichnet ein nachdrückliches Bezeugen. „Hat bezeugt“ gibt die Aussage natürlich wieder, ohne die Intensität durch einen im Deutschen schwerfälligen Zusatz zu überzeichnen.
- source_word: δέ
  choice: Doch
  rationale: δέ markiert hier einen leichten Gegensatz beziehungsweise argumentativen Übergang gegenüber dem vorher Gesagten.
- source_word: πού τις
  choice: irgendwo … jemand
  rationale: Die Verbindung wird idiomatisch wiedergegeben. Sie führt das bekannte Schriftzeugnis ein, ohne dessen Fundstelle oder menschlichen Verfasser zu nennen.
- source_word: λέγων
  choice: und gesagt
  rationale: Die koordinierte Form ist im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion und führt den Inhalt des Zeugnisses klar ein.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Was ist der Mensch
  rationale: Der repräsentative Singular und die poetische Form der Psalmzeile bleiben erhalten; „Mensch“ ist im Deutschen zugleich generisch verständlich.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: du an ihn denkst
  rationale: Die Wendung bezeichnet erinnerndes beziehungsweise aufmerksames Im-Sinn-Haben. „An ihn denkst“ ist gegenwärtiges, gut verständliches Deutsch.
- source_word: υἱὸς ἀνθρώπου
  choice: der Menschensohn
  rationale: Die quellensprachliche Wendung und ihre für den Fortgang des Hebräerbriefs wichtige Resonanz bleiben erhalten. Eine Fußnote macht deutlich, dass sie im Psalm zunächst poetisch den Menschen bezeichnet.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: du dich um ihn kümmerst
  rationale: ἐπισκέπτομαι kann fürsorgliches Aufsuchen, Nachsehen oder Sich-Kümmern bezeichnen. Die gewählte Form vermittelt hier die aufmerksame Fürsorge natürlich und lässt die wörtlichere Alternative in der Fußnote erkennen.
theological_decisions:
- issue: Ist „Menschensohn“ hier bereits ausschließlich als messianischer Titel zu verstehen?
  choice: Die Formulierung „der Menschensohn“ bleibt im Haupttext stehen, ohne sie dort ausdrücklich auf Jesus festzulegen.
  alternative: Generisch mit „ein Menschenkind“ wiedergeben oder durch eine ausdrücklich christologische Formulierung vereindeutigen.
  rationale: In Psalm 8 steht die Wendung parallel zu „der Mensch“ und bezeichnet die Menschheit in repräsentativer Weise. Der weitere Zusammenhang des Hebräerbriefs bezieht den Text zugleich auf Jesus. Haupttext und Fußnote bewahren diese Spannung, statt sie vorzeitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Parallelstruktur. Die Schriftzitat-Form bleibt erkennbar; traditionelle, heute jedoch weniger unmittelbare Wendungen werden in den Fußnoten angeboten.
