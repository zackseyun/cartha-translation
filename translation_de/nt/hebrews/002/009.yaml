revisions:
- from: Doch wir sehen Jesus, der für kurze Zeit niedriger als die Engel gemacht worden war. Wegen seines Todesleidens ist er mit Herrlichkeit und Ehre gekrönt, damit er ohne Gott[a] für jeden den Tod schmeckte.
  to: Wir sehen aber Jesus, der für kurze Zeit niedriger als die Engel gemacht wurde, wegen des Leidens des Todes mit Herrlichkeit und Ehre gekrönt, damit er ohne Gott[a] für jeden den Tod schmecken sollte.
  rationale: Die Revision bewahrt die vorgegebene Lesart χωρὶς θεοῦ im Haupttext und die alternative Lesart in der Fußnote. Sie stellt die beiden auf Jesus bezogenen Partizipialprädikationen wieder in ihren gemeinsamen Zusammenhang, vermeidet das nicht begründete Plusquamperfekt und gibt den finalen Konjunktiv γεύσηται idiomatisch wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:44:36Z'
review_pass:
  verdict: revise
  source_fidelity: Der Haupttext folgt zutreffend der vorgegebenen SBLGNT-Lesart χωρὶς θεοῦ („ohne Gott“) und dokumentiert die gewichtige Variante χάριτι θεοῦ angemessen in einer Fußnote. Die Satzglieder bleiben jedoch im Entwurf durch die Aufteilung und die Tempuswahl nicht klar genug als gemeinsame Prädikationen über Jesus erkennbar. Insbesondere ist „schmeckte“ nach präsentischem „wir sehen“ und „ist ... gekrönt“ als Wiedergabe des Zwecksatzes nicht stimmig.
  naturalness: „Doch“ ist möglich, aber „Wir sehen aber“ bildet den griechischen Kontrast unmittelbar und idiomatisch ab. Der Satz lässt sich als ein deutscher Satz klar und würdevoll führen. „schmecken sollte“ gibt den finalen Charakter von ὅπως mit Konjunktiv natürlich wieder.
  terminology: „Herrlichkeit und Ehre“ sowie „den Tod schmecken“ sind treffend. „Todesleiden“ ist verständlich, aber „Leiden des Todes“ hält die griechische Formulierung genauer offen. Die Fußnote sollte die alternative Lesart als Lesart benennen, ohne ihre textkritische Wertung vorwegzunehmen.
  issues:
  - severity: medium
    issue: Nicht passende Tempus- und Modusfolge im Zwecksatz
    rationale: „damit er ... schmeckte“ steht als Präteritum neben „wir sehen“ und „ist ... gekrönt“ und verschleiert die durch ὅπως ausgedrückte Zielbeziehung. „damit er ... schmecken sollte“ ist im Deutschen die passende finale Formulierung.
  - severity: medium
    issue: Pluperfekt „gemacht worden war“
    rationale: 'Das Plusquamperfekt legt eine vorvergangene Handlung gegenüber einem weiteren vergangenen Bezugspunkt nahe, den der griechische Satz nicht setzt. Die Partizipien beschreiben Jesus als den, den wir sehen: niedriger gemacht und gekrönt.'
  - severity: low
    issue: Satztrennung lockert die gemeinsame Struktur der Partizipien
    rationale: Im Griechischen beziehen sich sowohl „niedriger gemacht“ als auch „gekrönt“ auf Jesus als Objekt von „wir sehen“. Eine einheitliche deutsche Konstruktion macht diesen Zusammenhang besser sichtbar.
  revised_text: Wir sehen aber Jesus, der für kurze Zeit niedriger als die Engel gemacht wurde, wegen des Leidens des Todes mit Herrlichkeit und Ehre gekrönt, damit er ohne Gott[a] für jeden den Tod schmecken sollte.
  revised_footnotes:
