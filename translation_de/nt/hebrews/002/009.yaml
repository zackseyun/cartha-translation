id: HEB.2.9
reference: Hebrews 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: de
  text: Wir sehen aber Jesus, der für kurze Zeit niedriger als die Engel gemacht wurde, wegen des Leidens des Todes mit Herrlichkeit und Ehre gekrönt, damit er ohne Gott[a] für jeden den Tod schmecken sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Handschriften lesen: „durch Gottes Gnade“ statt „ohne Gott“.'
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: für kurze Zeit
  rationale: Die Wendung wird im Zusammenhang mit Psalm 8 zeitlich verstanden und bezeichnet die begrenzte Dauer der Erniedrigung.
- source_word: παρ’ ἀγγέλους
  choice: niedriger als die Engel
  rationale: παρά mit Akkusativ hat nach dem Komparativ von ἐλαττόω vergleichende Bedeutung.
- source_word: ἠλαττωμένον
  choice: niedriger … gemacht worden war
  rationale: Die passive Form bewahrt den Gedanken, dass Jesus in eine niedrigere Stellung versetzt wurde, ohne dies lediglich als innere Demütigung zu deuten.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: wegen seines Todesleidens
  rationale: διά mit Akkusativ bezeichnet hier am natürlichsten den Grund seiner Krönung. „Todesleiden“ gibt die knappe Genitivverbindung idiomatisch wieder.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: mit Herrlichkeit und Ehre gekrönt
  rationale: Die Krönungsmetapher und das Motiv der Erhöhung bleiben unmittelbar erhalten.
- source_word: ὅπως
  choice: damit
  rationale: Die Konjunktion leitet einen Zweck- beziehungsweise Folgesatz ein; „damit“ lässt diese Beziehung offen genug erkennen.
- source_word: χωρὶς θεοῦ
  choice: ohne Gott
  rationale: Dies übersetzt die im vorgegebenen SBLGNT-Text gedruckte Lesart unmittelbar und vermeidet eine stillschweigende Ersetzung durch die bekannte Variante χάριτι θεοῦ.
- source_word: ὑπὲρ παντός
  choice: für jeden
  rationale: Die substantivierte Einzahl wird distributiv und im Kontext personal verstanden; „für jeden“ ist im Deutschen natürlich und bewahrt den stellvertretenden Bezug.
- source_word: γεύσηται θανάτου
  choice: den Tod schmeckte
  rationale: Die verständliche biblische Metapher wird bewahrt, statt sie zu „den Tod erleiden“ aufzulösen.
theological_decisions:
- issue: Textvariante im Zwecksatz
  choice: ohne Gott
  alternative: durch Gottes Gnade
  rationale: Der bereitgestellte griechische Ausgangstext liest χωρὶς θεοῦ. Die verbreitete Variante χάριτι θεοῦ wird wegen ihrer erheblichen textlichen und theologischen Bedeutung in einer Fußnote dokumentiert, aber nicht an die Stelle des angegebenen Ausgangstextes gesetzt.
- issue: Bezug von ὑπὲρ παντός
  choice: für jeden Menschen, knapp als „für jeden“
  alternative: für alles
  rationale: Der Zusammenhang mit Jesu Tod legt einen personal-distributiven Sinn nahe. Die Formulierung bleibt knapp und fügt keine konfessionelle Aussage über die Wirkungsweise seines Todes hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste lange griechische Satz wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. Die auffällige Lesart „ohne Gott“ bleibt gemäß dem vorgegebenen griechischen Text im Haupttext stehen; die wichtige Variante wird transparent in der Fußnote genannt.
