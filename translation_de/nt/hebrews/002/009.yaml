    text: 'Andere Handschriften lesen: „durch Gottes Gnade“ statt „ohne Gott“.'
    reason: textual_variant
  revision_rationale: Die Revision bewahrt die vorgegebene Lesart χωρὶς θεοῦ im Haupttext und die alternative Lesart in der Fußnote. Sie stellt die beiden auf Jesus bezogenen Partizipialprädikationen wieder in ihren gemeinsamen Zusammenhang, vermeidet das nicht begründete Plusquamperfekt und gibt den finalen Konjunktiv γεύσηται idiomatisch wieder.
