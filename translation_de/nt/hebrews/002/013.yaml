  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: de
  text: 'Und wiederum: „Ich werde auf ihn vertrauen.“ Und wiederum: „Siehe, ich und die Kinder, die Gott mir gegeben hat.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Sprecher wird im griechischen Text dieses Verses nicht ausdrücklich genannt; im Zusammenhang bezieht der Hebräerbrief diese Zitate auf den Sohn.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Und wiederum
  rationale: Die knappe Zitationsformel wird ohne ein im Griechischen nicht vorhandenes Verb wie „sagt er“ wiedergegeben.
- source_word: ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: Ich werde auf ihn vertrauen
  rationale: Die periphrastische Konstruktion bezeichnet eine künftige beziehungsweise anhaltende Haltung des Vertrauens. „Auf ihn vertrauen“ ist im Deutschen natürlich und entspricht der griechischen Präposition.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: „Siehe“ bewahrt als geläufige, würdevolle Zitationssprache den hinweisenden und rhetorischen Nachdruck.
- source_word: τὰ παιδία
  choice: die Kinder
  rationale: Die relationale Bezeichnung wird schlicht und natürlich als „die Kinder“ wiedergegeben.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: die Gott mir gegeben hat
  rationale: Das deutsche Relativpronomen richtet sich natürlich nach Personen. Das Perfekt bringt die fortbestehende Bedeutung der Gabe idiomatisch zum Ausdruck, ohne dem griechischen Aorist eine besondere Zeitstufe aufzuzwingen.
theological_decisions:
- issue: Christologische Stimme der Zitate
  choice: Die Zitate stehen ohne ausdrückliche Benennung des Sprechers im Haupttext.
  alternative: „Und wiederum sagt er“ oder „der Messias sagt“ ergänzen.
  rationale: Der griechische Vers nennt den Sprecher nicht ausdrücklich; der Zusammenhang des Hebräerbriefs wendet die Worte auf den Sohn an. Die Übersetzung bewahrt diese textliche Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Zitationsformel und das hervorgehobene „Ich“ bleiben erhalten; unnötige interpretierende Ergänzungen werden vermieden.
