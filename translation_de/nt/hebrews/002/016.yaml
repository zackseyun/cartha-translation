id: HEB.2.16
reference: Hebrews 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: de
  text: Denn er nimmt sich ja nicht der Engel an, sondern er nimmt sich der Nachkommen Abrahams an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ergreift«. Das griechische Verb kann wörtlich »fassen, ergreifen« bedeuten; hier hat es wahrscheinlich den Sinn »sich annehmen, zu Hilfe kommen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: ja
  rationale: Die Modalpartikel »ja« gibt den bestätigenden, als einsichtig vorausgesetzten Nachdruck von δήπου im natürlichen modernen Deutsch wieder.
- source_word: ἀγγέλων
  choice: der Engel
  rationale: Der Genitiv Plural hängt von der reflexiven Wendung »sich jemandes annehmen« ab und bezeichnet die Gruppe, die den Nachkommen Abrahams gegenübergestellt wird.
- source_word: ἐπιλαμβάνεται
  choice: nimmt sich … an
  rationale: Die deutsche Wendung drückt hier Hilfe und fürsorgliches Eingreifen aus, bewahrt aber zugleich eine gewisse Nähe zum Grundsinn des griechischen Verbs »ergreifen/fassen«.
- source_word: σπέρματος Ἀβραὰμ
  choice: der Nachkommen Abrahams
  rationale: σπέρμα ist ein kollektiver Singular und bezeichnet hier Abrahams Nachkommenschaft. »Nachkommen« ist im heutigen Deutsch verständlich und weniger missverständlich als »Same«.
- source_word: οὐ γὰρ … ἀλλὰ
  choice: Denn … nicht …, sondern …
  rationale: Diese Konstruktion gibt sowohl die begründende Verknüpfung durch γάρ als auch den starken Gegensatz von οὐ … ἀλλά klar wieder.
theological_decisions:
- issue: Bedeutung von ἐπιλαμβάνεται im Blick auf das rettende Handeln des Sohnes
  choice: Der Sohn nimmt sich der Nachkommen Abrahams an, das heißt, er wendet sich ihnen helfend zu.
  alternative: Der Sohn ergreift die Nachkommen Abrahams bzw. nimmt ihre menschliche Natur an.
  rationale: Im unmittelbaren Zusammenhang steht das rettende Eintreten des Sohnes für Menschen im Vordergrund. »Sich annehmen« lässt diesen Sinn erkennen, ohne den bildhaften Grundsinn des Verbs vollständig auszublenden; die stärker wörtliche, theologisch bedeutsame Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »nimmt sich … an« folgt dem Nachdruck des griechischen Satzes; »ja« bildet die emphatische Nuance von δήπου idiomatisch ab.
