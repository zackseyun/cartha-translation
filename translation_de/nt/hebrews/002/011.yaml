id: HEB.2.11
reference: Hebrews 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: de
  text: Denn sowohl der, der heiligt, als auch die, die geheiligt werden, stammen alle von einem[a]. Aus diesem Grund schämt er sich nicht, sie Brüder[b] zu nennen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von einem Vater“, „aus einer Quelle“ oder „von einem Stammvater“. Der griechische Text bestimmt nicht näher, worauf sich „einem“ bezieht.'
    reason: alternative_reading
  - marker: b
    text: „Brüder“ gibt den maskulinen Plural ἀδελφούς wieder; im Zusammenhang kann damit die ganze Gemeinschaft der Glaubenden einschließlich der Frauen gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε γὰρ ἁγιάζων
  choice: Denn sowohl der, der heiligt
  rationale: Das substantivierte aktive Präsenspartizip wird transparent und gegenwartsnah wiedergegeben. „Heiligt“ bewahrt den neutestamentlichen Leitbegriff.
- source_word: οἱ ἁγιαζόμενοι
  choice: die, die geheiligt werden
  rationale: Das passive Präsenspartizip bezeichnet die Empfangenden der Heiligung und lässt sowohl einen fortdauernden Vorgang als auch einen gegenwärtigen Zustand zu.
- source_word: ἐξ ἑνὸς
  choice: von einem
  rationale: Der griechische Text nennt den Bezug von „einem“ nicht. Die knappe Wiedergabe bewahrt diese echte Mehrdeutigkeit.
- source_word: πάντες
  choice: stammen alle
  rationale: Das im Griechischen ausgelassene Prädikat wird aus ἐξ ἑνός idiomatisch ergänzt; „alle“ schließt den Heiligenden und die Geheiligten ausdrücklich zusammen.
- source_word: δι’ ἣν αἰτίαν
  choice: Aus diesem Grund
  rationale: Die feste Wendung bezeichnet die Folgerung aus der gemeinsamen Herkunft und wird in natürlichem Deutsch wiedergegeben.
- source_word: οὐκ ἐπαισχύνεται
  choice: schämt er sich nicht
  rationale: Dies ist die idiomatische deutsche Entsprechung und bewahrt den Ehr-Scham-Aspekt des Verbs.
- source_word: ἀδελφοὺς
  choice: Brüder
  rationale: Das maskuline Pluralwort wird formgetreu wiedergegeben. Dass im Zusammenhang die umfassendere Gemeinschaft der Glaubenden gemeint sein kann, wird in einer Fußnote erläutert.
- source_word: καλεῖν
  choice: zu nennen
  rationale: Im Deutschen ist „jemanden Brüder nennen“ hier natürlicher als „Brüder rufen“ und entspricht der Benennungsfunktion des Infinitivs.
theological_decisions:
- issue: Bezug von ἐξ ἑνός („von einem“)
  choice: Der Haupttext lässt den Bezug unbestimmt.
  alternative: „von einem Vater“, „aus einer Quelle“ oder „von einem Stammvater“
  rationale: Das Neutrum/Maskulinum ἑνός steht ohne ausgedrücktes Bezugswort. Eine ausdrückliche Identifikation mit Gott, Adam, Abraham oder einem gemeinsamen Ursprung würde die im griechischen Text bestehende Offenheit auflösen.
- issue: Identität des Subjekts in „schämt er sich nicht“
  choice: Das Pronomen bleibt wie im Griechischen unausdrücklich identifiziert; der Kontext weist auf den heiligenden Sohn.
  alternative: Den Namen „Jesus“ oder die Bezeichnung „der Sohn“ ausdrücklich einsetzen.
  rationale: Der unmittelbare Kontext macht den Bezug verständlich, doch eine ausdrückliche Benennung an dieser Stelle wäre eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Konstruktion „sowohl … als auch“ bildet τε … καί ab. „Heiligen“ bleibt als verständlicher theologischer Leitbegriff erhalten. Die Satzzeichnung folgt dem fortlaufenden Zusammenhang des griechischen Textes; das abschließende Komma zeigt, dass der folgende Vers das Zitat anschließt.
