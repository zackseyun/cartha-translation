  source_fidelity: Der Entwurf gibt das genitivische Partizip als abhängige Fortsetzung der Frage aus Vers 3 sachgerecht wieder. „wobei Gott zugleich Zeugnis ablegte“ vermittelt sowohl die begleitende Funktion als auch die zusätzliche Nuance von συνεπι- idiomatisch. Die instrumentalen Dativen sind mit „durch“ treffend wiedergegeben. „Zeichen und Wunder“, „vielfältige Machttaten“ und „Zuteilungen des Heiligen Geistes“ entsprechen dem griechischen Aufzählungsbau. Die Schlusswendung „nach seinem Willen“ gibt κατὰ τὴν αὐτοῦ θέλησιν angemessen wieder, ohne den Bezug über das im Deutschen Mögliche hinaus zu bestimmen.
  naturalness: Der Satz ist als bewusst abhängige Fortsetzung der rhetorischen Frage flüssig und würdevoll. Die Wiederholung von „durch“ macht die Aufzählung klar und ist im modernen Standarddeutsch nicht störend. Das abschließende Fragezeichen ist aufgrund des Satzgefüges aus dem vorherigen Vers korrekt.
  terminology: „Zeichen und Wunder“ ist etablierte biblische Terminologie. „Machttaten“ ist eine sachgerechte, nicht überinterpretierende Wiedergabe von δυνάμεις; die Fußnote dokumentiert die möglichen Alternativen. „Zuteilungen des Heiligen Geistes“ vermeidet die im Ausgangstext nicht ausdrücklich vorhandene Ergänzung „Gaben“ und erhält die genitivische Offenheit weitgehend. Die Fußnotenanker stehen unmittelbar bei den erläuterten Ausdrücken.
