  variant: modern standard German
source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: de
  text: wobei Gott zugleich Zeugnis ablegte durch Zeichen und Wunder, durch vielfältige Machttaten[a] und durch Zuteilungen des Heiligen Geistes[b] nach seinem Willen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vielfältige Kraftwirkungen“ oder „vielfältige Wunder“. Das griechische Wort bezeichnet Machterweise und kann in diesem Zusammenhang wundersame Taten meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Aufteilungen“ oder „Anteile am Heiligen Geist“. Im griechischen Text steht nicht ausdrücklich „Gaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: wobei Gott zugleich Zeugnis ablegte
  rationale: Das Genitivpartizip begleitet die Aussage des vorangehenden Verses. „Wobei“ macht diese syntaktische Beziehung im Deutschen deutlich; „zugleich“ gibt die mitbezeugende beziehungsweise additive Kraft von συν- natürlich wieder.
- source_word: σημείοις τε καὶ τέρασιν
  choice: durch Zeichen und Wunder
  rationale: Die Dative bezeichnen das Mittel, durch das Gott Zeugnis ablegte. Das feste Wortpaar „Zeichen und Wunder“ ist verständlich und bewahrt sowohl die hinweisende als auch die staunenerregende Funktion dieser Taten.
- source_word: ποικίλαις δυνάμεσιν
  choice: durch vielfältige Machttaten
  rationale: δύναμις bezeichnet hier konkrete Manifestationen göttlicher Macht. „Machttaten“ wahrt diesen Bezug zur Kraft deutlicher als das interpretierendere „Wunder“, während „vielfältige“ ποικίλαις wiedergibt.
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: durch Zuteilungen des Heiligen Geistes
  rationale: „Zuteilungen“ gibt μερισμοῖς wieder, ohne das im Griechischen nicht ausdrücklich vorhandene Wort „Gaben“ einzufügen. Der Genitiv „des Heiligen Geistes“ bleibt in seiner Beziehung zu den Zuteilungen bewusst offen.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: nach seinem Willen
  rationale: Die Wendung bezeichnet die Übereinstimmung mit dem Willen des Handelnden. Das Pronomen bezieht sich syntaktisch am natürlichsten auf Gott.
theological_decisions:
- issue: Bezug von αὐτοῦ in „nach seinem Willen“
  choice: Das Pronomen wird auf Gott, das Subjekt des Partizips, bezogen.
  alternative: Ein lockerer Bezug auf den Heiligen Geist ist denkbar, syntaktisch jedoch weniger wahrscheinlich.
  rationale: Gott ist das übergeordnete handelnde Subjekt, das durch die genannten Mittel Zeugnis ablegt. Die Übersetzung lässt das deutsche Pronomen stehen und fügt keine weitergehende dogmatische Erklärung ein.
- issue: Verhältnis des Genitivs in πνεύματος ἁγίου μερισμοῖς
  choice: „Zuteilungen des Heiligen Geistes“
  alternative: „vom Heiligen Geist bewirkte Zuteilungen“ oder „Zuteilungen von Gaben des Heiligen Geistes“
  rationale: Der knappe Genitiv kann hinsichtlich Quelle oder Inhalt unterschiedlich verstanden werden. Die gewählte Formulierung erhält diese Spannung und vermeidet die nicht ausdrücklich genannte Ergänzung „Gaben“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als abhängige Fortsetzung von Vers 3 formuliert; das Fragezeichen bewahrt den Abschluss der im vorherigen Kontext begonnenen rhetorischen Frage. Wiederholtes „durch“ verdeutlicht die instrumentale Funktion der Dative und strukturiert die Aufzählung.
