source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: de
  text: Wie werden wir entkommen, wenn wir eine so große Rettung vernachlässigen? Diese Rettung wurde zuerst durch den Herrn verkündet und uns von denen bestätigt, die ihn gehört hatten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς … ἐκφευξόμεθα
  choice: Wie werden wir entkommen
  rationale: Bewahrt die rhetorische Zukunftsfrage und ihre eindringliche Warnung, ohne sie in eine ausdrückliche Verneinung umzuschreiben.
- source_word: τηλικαύτης … σωτηρίας
  choice: eine so große Rettung
  rationale: Gibt die hervorgehobene Größe der σωτηρία natürlich wieder; „Rettung“ ist im heutigen Deutsch verständlich und bewahrt den Gedanken der umfassenden Erlösung.
- source_word: ἀμελήσαντες
  choice: wenn wir … missachten
  rationale: Das Aoristpartizip bezeichnet hier die Bedingung beziehungsweise Begleitumstände des Entkommens; die konditionale Wiedergabe ist im Deutschen natürlich. „Missachten“ drückt schuldhafte Nichtbeachtung aus.
- source_word: ἥτις
  choice: Sie
  rationale: Das Pronomen greift eindeutig die feminine „Rettung“ auf und führt den erklärenden Relativgedanken in einem neuen deutschen Satz fort.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: nahm ihren Anfang damit, dass sie … verkündet wurde
  rationale: Bewahrt die inzeptive Kraft des griechischen Idioms und gibt das passive λαλεῖσθαι in natürlichem Deutsch wieder. „Verkündet“ passt zum Kontext einer öffentlich mitgeteilten Heilsbotschaft.
- source_word: διὰ τοῦ κυρίου
  choice: durch den Herrn
  rationale: Bewahrt διά mit Genitiv als vermittelnde beziehungsweise personale Urheberschaft und κύριος als den etablierten christologischen Titel.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: von denen …, die ihn gehört hatten
  rationale: Gibt die persönliche Urheberschaft mit „von“ wieder. Das aus dem Kontext ergänzte „ihn“ bezeichnet den Herrn und macht deutlich, was diese Zeugen gehört hatten.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: wurde uns … bestätigt
  rationale: Natürliches Deutsch für die Richtung auf die Empfänger und für die verlässliche Bestätigung der Botschaft.
theological_decisions:
- issue: Bezug von τοῦ κυρίου
  choice: „der Herr“ bezeichnet Jesus, durch den die Rettungsbotschaft zuerst verkündet wurde.
  alternative: Allgemeine Bezeichnung Gottes als Herrn.
  rationale: Die anschließende Erwähnung derer, die ihn gehört hatten, weist im Zusammenhang stark auf Jesu irdische Verkündigung und deren Bezeugung hin.
- issue: Aussagekraft der Warnfrage
  choice: Die rhetorische Frage bleibt als Frage stehen.
  alternative: 'Explizite Aussage: „Wir werden gewiss nicht entkommen.“'
  rationale: So bleiben Form, Spannung und Warncharakter des griechischen Textes erhalten, ohne die implizite Folgerung ausdrücklich auszudeuten.
- issue: Syntaktischer Anschluss von ἥτις
  choice: Neuer Satz mit dem rückbezüglichen Pronomen „Sie“.
  alternative: 'Ein einziger Satz: „… Rettung missachten, die ihren Anfang damit nahm …“'
  rationale: Der neue Satz ist im Deutschen klar und würdevoll; eine Fußnote dokumentiert die ebenso mögliche engere Relativsatzstruktur.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung vermeidet unnötige Kirchensprache, behält aber „der Herr“ als etablierten Titel bei. Der abschließende Beistrich zeigt, dass der griechische Satz in Vers 4 weitergeführt wird.
