  rationale: Die Revision ersetzt die semantisch zu starke Wiedergabe „missachten“ durch „vernachlässigen“ und glättet den deutschen Satzbau. „Zuerst durch den Herrn verkündet“ bewahrt die inzeptive Aussage, dass die Verkündigung der Rettung beim Herrn ihren Anfang nahm. Die unangebrachte Satzbau-Fußnote wird entfernt; es besteht keine übertragungsrelevante Ambiguität, die eine Fußnote erfordert.
