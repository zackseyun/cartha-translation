  source_fidelity: 'Die Übersetzung gibt die Satzverbindung sowie die zentralen Aussagen des griechischen Textes treffend wieder: Befreiung derjenigen, die wegen bzw. unter der Furcht vor dem Tod ihr ganzes Leben hindurch der Sklaverei unterworfen waren. „Alle, die“ bildet den gruppenbezeichnenden Relativsatz angemessen ab, und „der Sklaverei unterworfen“ wahrt die starke Bildsprache von δουλεία, ohne ihre nähere Ausgestaltung zu ergänzen.'
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch. „Todesfurcht“, „ihr ganzes Leben lang“ und „der Sklaverei unterworfen waren“ sind idiomatisch und dem würdevollen Register des Hebräerbriefs angemessen. Das einleitende „und“ ist als Fortsetzung von Vers 14 korrekt.
  terminology: „Befreien“ entspricht ἀπαλλάσσω präzise; „Sklaverei“ gibt δουλεία mit der nötigen konkreten Schärfe wieder. Die Formulierung legt weder eine bestimmte Ursache noch einen konfessionell bestimmten Mechanismus dieser Sklaverei fest. Die Fußnote bietet die vertretbare instrumentale Nuance von φόβῳ sowie eine alternative Akzentuierung des Gebundenseins.
