source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: de
  text: und alle befreien, die aus Todesfurcht ihr ganzes Leben lang der Sklaverei unterworfen waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Todesfurcht ihr ganzes Leben lang in Sklaverei gehalten wurden“.'
    reason: Die griechische Formulierung kann sowohl das Unterworfensein als Zustand als auch das Gebundensein beziehungsweise Gehaltenwerden in Sklaverei hervorheben; zudem kann φόβῳ instrumental mit „durch“ wiedergegeben werden.
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: befreien
  rationale: Das Verb bezeichnet das Freimachen oder Befreien aus einem bindenden Zustand. „Befreien“ ist im Deutschen prägnant und entspricht dem Gegensatz zur Sklaverei.
- source_word: τούτους, ὅσοι
  choice: alle, die
  rationale: Die Verbindung bezeichnet umfassend die durch den folgenden Relativsatz charakterisierte Gruppe. „Alle, die“ gibt diese inklusive Bedeutung natürlicher wieder als ein wörtliches „diejenigen, so viele“.
- source_word: φόβῳ θανάτου
  choice: aus Todesfurcht
  rationale: Der Dativ kann Ursache, Mittel oder bestimmenden Umstand ausdrücken. „Aus Todesfurcht“ ist idiomatisch und bewahrt die kausale Färbung, ohne den Zusammenhang weiter auszudeuten.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: ihr ganzes Leben lang
  rationale: Die Wendung bezeichnet die gesamte Lebensdauer. Diese Formulierung ist natürliches modernes Deutsch und bildet den durativen Sinn genau ab.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: der Sklaverei unterworfen waren
  rationale: ἔνοχος mit dem Genitiv bezeichnet hier das Unterworfensein unter einen bindenden Zustand. Die Formulierung bewahrt sowohl die tatsächliche Gebundenheit als auch die starke Sklavereimetaphorik.
- source_word: δουλείας
  choice: Sklaverei
  rationale: Das Substantiv bezeichnet Sklaverei beziehungsweise Knechtschaft. „Sklaverei“ hält die Härte und Unfreiheit des Bildes deutlicher fest als das heute weniger unmittelbare „Knechtschaft“.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet diesen Zweck- beziehungsweise Ergebnissatz mit dem vorhergehenden Satzteil.
theological_decisions:
- issue: Art der durch δουλείας bezeichneten Bindung
  choice: Die Übersetzung spricht allgemein von wirklicher Sklaverei im Zusammenhang mit Todesfurcht.
  alternative: Sklaverei unter dem Teufel; Sklaverei der Sünde; existenzielle Gebundenheit unter der Sterblichkeit
  rationale: Vers 14 nennt den Teufel im Zusammenhang mit der Macht des Todes, doch Vers 15 selbst bestimmt die Sklaverei nicht näher. Die Übersetzung vermeidet daher, einen bestimmten theologischen Mechanismus in den Wortlaut einzutragen.
- issue: Beziehung der Todesfurcht zur Sklaverei
  choice: „aus Todesfurcht“ gibt eine kausale beziehungsweise bestimmende Beziehung wieder.
  alternative: „durch Todesfurcht“ mit stärker instrumentaler Färbung
  rationale: Der griechische Dativ lässt eine gewisse Spannung zwischen Ursache, Mittel und Umstand zu. Die Hauptfassung ist idiomatisch; die Fußnote hält die instrumentale Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Todesfurcht“ ist kompakt und verständlich; „Sklaverei“ bewahrt die konkrete Schärfe des griechischen Bildes. Der Satz bleibt als Fortsetzung von Vers 14 mit „und“ angeschlossen.
