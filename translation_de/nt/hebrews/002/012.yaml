  source_fidelity: 'Der Entwurf gibt die griechische Struktur und den Sinn zuverlässig wieder: λέγων als Zitatanschluss, das Futur von ἀπαγγέλλω, „deinen Namen“, den Dativ „meinen Brüdern“, ἐν μέσῳ ἐκκλησίας als „mitten in der Versammlung“ und ὑμνήσω als gesungenes Lob. Die poetische Parallelität des Psalmzitats bleibt erhalten.'
