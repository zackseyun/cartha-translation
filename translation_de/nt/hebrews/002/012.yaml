  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: de
  text: 'indem er sagt: „Ich will deinen Namen meinen Brüdern[a] verkünden; mitten in der Versammlung[b] will ich dir lobsingen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Brüdern und Schwestern“. Im Griechischen steht „Brüdern“; im Zusammenhang kann die Bezeichnung alle Mitglaubenden einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Gemeinde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: indem er sagt
  rationale: Das Präsenspartizip führt das folgende Schriftzitat ein. „Indem er sagt“ gibt die syntaktische Verbindung zum vorherigen Vers direkt und natürlich wieder.
- source_word: Ἀπαγγελῶ
  choice: ich will … verkünden
  rationale: Das Verb bezeichnet ein offenes Bekanntmachen oder Verkünden. „Verkünden“ bewahrt den öffentlichen, feierlichen Charakter des Zitats.
- source_word: τὸ ὄνομά σου
  choice: deinen Namen
  rationale: Die wörtliche Formulierung bleibt erhalten. „Name“ kann im biblischen Sprachgebrauch die offenbarte Identität und das Wesen einschließen, ohne dass dies im Haupttext ausgedeutet wird.
- source_word: τοῖς ἀδελφοῖς μου
  choice: meinen Brüdern
  rationale: Die maskuline Pluralform wird formal genau wiedergegeben. Dass der familiäre Bezug im Kontext alle Glaubenden einschließen kann, wird in einer Fußnote kenntlich gemacht.
- source_word: ἐν μέσῳ
  choice: mitten in
  rationale: Die idiomatische Wiedergabe ist im Deutschen natürlich und bewahrt zugleich das Bild einer Person innerhalb der versammelten Gemeinschaft.
- source_word: ἐκκλησίας
  choice: der Versammlung
  rationale: Im alttestamentlichen Zitat bezeichnet das Wort die zusammengekommene Gemeinschaft. „Versammlung“ gibt diesen Sinn wieder, ohne vorrangig eine spätere kirchliche Institution anzudeuten.
- source_word: ὑμνήσω
  choice: ich will dir lobsingen
  rationale: Das Verb bezeichnet ausdrücklich gesungenes Lob. „Lobsingen“ bewahrt sowohl den Lob- als auch den Gesangsaspekt in knapper, dem poetischen Zitat angemessener Sprache.
- source_word: σε
  choice: dir
  rationale: Beim deutschen Verb „lobsingen“ wird die angesprochene Person idiomatisch im Dativ ausgedrückt.
theological_decisions:
- issue: Repräsentativer familiärer Sinn von ἀδελφοῖς
  choice: Brüder
  alternative: Brüder und Schwestern; Geschwister
  rationale: Der Haupttext bewahrt die grammatisch maskuline Form des griechischen Ausdrucks. Die mögliche Einbeziehung der gesamten Glaubensfamilie wird nicht ausgeschlossen, sondern in der Fußnote erläutert.
- issue: Bedeutung von ἐκκλησία im alttestamentlichen Zitat
  choice: Versammlung
  alternative: Gemeinde
  rationale: Das Zitat aus Psalm 22 spricht von den versammelten Menschen Gottes. „Versammlung“ wahrt diesen konkreten Bezug und legt den Ausdruck nicht vorschnell institutionell aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem Ton, der dem Psalmzitat entspricht. „Lobsingen“ ist bewusst poetischer als die umgebende Prosa, bleibt jedoch verständlich. Die Zeichensetzung markiert die Einführung und den Parallelismus des Zitats klar.
