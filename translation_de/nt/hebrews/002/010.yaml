source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: de
  text: Denn es entsprach ihm, um dessentwillen alles ist und durch den alles ist, den Wegbereiter ihrer Rettung durch Leiden zu vollenden, indem er viele Söhne zur Herrlichkeit führte.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Viele Söhne“ bewahrt die Sohnschafts- und Erbsprache des griechischen Textes; gemeint sind Gottes Kinder insgesamt, nicht nur Männer.
    reason: lexical_alternative
  - marker: b
    text: Für „Wegbereiter“ sind auch „Anführer“, „Begründer“ oder „Urheber“ möglich.
    reason: lexical_alternative
  - marker: c
    text: '„Vollenden“ bedeutet hier: durch Leiden an das vorgesehene Ziel bringen, nicht einen moralischen Fehler beheben.'
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἔπρεπεν γὰρ αὐτῷ
  choice: Denn es entsprach ihm
  rationale: Die unpersönliche Wendung mit πρέπω bezeichnet, was Gottes Wesen und Vorhaben angemessen war. „Es entsprach ihm“ ist im Deutschen würdevoll und macht deutlicher als „es ziemte sich“, dass es um innere Angemessenheit geht.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: um dessentwillen alles ist und durch den alles ist
  rationale: 'Die zwei διά-Konstruktionen bleiben unterschieden: Die erste bezeichnet Ziel beziehungsweise letzten Grund, die zweite Vermittlung oder Wirkursache. Die knappe Parallelstruktur des Griechischen wird bewahrt.'
- source_word: πολλοὺς υἱοὺς
  choice: viele Söhne
  rationale: υἱούς wird ausdrücklich als „Söhne“ wiedergegeben, damit die im Zusammenhang wichtige Sohnschafts- und Erbthematik erhalten bleibt; der umfassende Bezug wird in einer Fußnote erläutert.
- source_word: εἰς δόξαν
  choice: zur Herrlichkeit
  rationale: Die Wendung gibt die durch εἰς ausgedrückte Bewegung auf das Ziel der Herrlichkeit hin idiomatisch wieder.
- source_word: ἀγαγόντα
  choice: als er … führte
  rationale: Das aoristische Partizip wird als begleitender Umstand zum Vollenden des Wegbereiters verstanden. Diese Wiedergabe wahrt den grammatischen Bezug, ohne die im Griechischen nicht ausdrücklich markierte Zweckrelation einzutragen.
- source_word: ἀρχηγὸν
  choice: Wegbereiter
  rationale: ἀρχηγός bezeichnet hier denjenigen, der den Anfang macht und anderen vorangeht. „Wegbereiter“ erfasst diese eröffnende und führende Funktion natürlicher als „Urheber“ allein.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: ihrer Rettung
  rationale: „Rettung“ gibt σωτηρία in verständlichem modernem Deutsch wieder und wahrt den Bezug auf die vielen Söhne.
- source_word: διὰ παθημάτων
  choice: durch Leiden
  rationale: Der deutsche Ausdruck kann die mehrfachen konkreten Leiden zusammenfassend bezeichnen und gibt zugleich das Mittel beziehungsweise den Weg an.
- source_word: τελειῶσαι
  choice: zu vollenden
  rationale: τελειόω bedeutet hier, den Wegbereiter durch Leiden an das für seine Heilsaufgabe bestimmte Ziel zu bringen, nicht einen moralischen Mangel zu beheben. „Vollenden“ ist im Deutschen weniger missverständlich als „vollkommen machen“.
theological_decisions:
- issue: Bedeutung von τελειῶσαι in Bezug auf den Sohn
  choice: zu vollenden
  alternative: vollkommen zu machen; zur Vollendung zu bringen
  rationale: Die Formulierung bezeichnet die Vollendung seines Weges und seiner Aufgabe durch Leiden. Sie behauptet nicht, dass der Sohn zuvor moralisch fehlerhaft gewesen sei.
- issue: Umfang von πολλοὺς υἱοὺς
  choice: viele Söhne
  alternative: viele Kinder
  rationale: Die konkrete Sohnschaftssprache und ihr Erbmotiv bleiben erhalten. Im Zusammenhang sind jedoch nicht ausschließlich Männer gemeint.
- issue: Verhältnis von ἀγαγόντα zu τελειῶσαι
  choice: als er viele Söhne zur Herrlichkeit führte
  alternative: um viele Söhne zur Herrlichkeit zu führen; indem er viele Söhne zur Herrlichkeit führte
  rationale: Das Partizip wird als zeitlich beziehungsweise umständlich mit dem Vollenden verbunden wiedergegeben. Eine eindeutige Zweckbeziehung wäre möglich, ist aber grammatisch nicht zwingend und wird daher nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakte Satzstruktur und die parallelen Gottesprädikate werden bewahrt; „um dessentwillen“ ist bewusst gehoben, aber verständlich. Die Stellung des Partizips folgt dem Sinngefüge des Griechischen, ohne es als eindeutigen Zwecksatz festzulegen.
