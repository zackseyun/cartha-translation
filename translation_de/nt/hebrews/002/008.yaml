  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: de
  text: „Alles hast du unter seine Füße[a] gestellt.“ Denn indem er ihm alles unterwarf[b], ließ er nichts übrig, was ihm nicht unterworfen war. Jetzt aber sehen wir noch nicht, dass ihm alles unterworfen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Pronomen „seine“ und „ihm“ greifen Psalm 8 auf. Dort können sie sich ursprünglich auf den Menschen beziehungsweise die Menschheit beziehen; in der Anwendung des Hebräerbriefs weisen sie zugleich auf Jesus.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Denn als er ihm alles unterwarf“. Die griechische Konstruktion kann auch stärker zeitlich wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend die Gesamtheit; „alles“ ist im Deutschen natürlich und bewahrt den universalen Umfang.
- source_word: ὑπέταξας
  choice: hast du … gestellt
  rationale: In Verbindung mit „unter seine Füße“ gibt „gestellt“ die Herrschaftsmetapher des Psalmzitats idiomatisch wieder; die folgenden Formen desselben Wortstamms werden mit „unterwerfen“ wiedergegeben.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: unter seine Füße
  rationale: Die feste biblische Wendung bezeichnet Herrschaft und Unterordnung und hält den Anklang an Psalm 8 erkennbar.
- source_word: ἐν τῷ … ὑποτάξαι
  choice: indem er … unterwarf
  rationale: Die Formulierung bewahrt den erklärenden Zusammenhang, ohne die Konstruktion ausschließlich temporal festzulegen; eine zeitliche Wiedergabe wird in der Fußnote genannt.
- source_word: οὐδὲν ἀφῆκεν … ἀνυπότακτον
  choice: ließ er nichts übrig, was ihm nicht unterworfen wäre
  rationale: Diese natürliche deutsche Formulierung erhält die uneingeschränkte Aussage und die Wiederholung des Bedeutungsfeldes von ὑποτάσσω.
- source_word: νῦν δὲ οὔπω ὁρῶμεν
  choice: Jetzt aber sehen wir noch nicht
  rationale: Die Wortfolge bringt den Gegensatz zwischen der umfassenden Zusage und der gegenwärtig noch nicht sichtbaren Verwirklichung klar zum Ausdruck.
- source_word: ὑποτεταγμένα
  choice: unterworfen ist
  rationale: Das Perfektpassiv bezeichnet den aus der Unterwerfung hervorgegangenen Zustand; „unterworfen ist“ gibt diesen im Deutschen klar wieder.
theological_decisions:
- issue: Bezug der Pronomen αὐτοῦ und αὐτῷ
  choice: Die Pronomen bleiben als „seine/ihm“ stehen, ohne den Bezug im Haupttext ausdrücklich festzulegen.
  alternative: Ausdrückliche Wiedergabe als Bezug auf die Menschheit beziehungsweise auf Jesus.
  rationale: Im ursprünglichen Zusammenhang von Psalm 8 geht es um den Menschen beziehungsweise die Menschheit; der Hebräerbrief führt die Aussage zugleich auf Jesus hin. Die offene pronominale Form bewahrt diese argumentative und theologische Spannung.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem biblischem Ton. Das Psalmzitat bleibt knapp und bildhaft; die anschließende Erklärung verwendet bewusst wiederholt „unterwerfen“, um den griechischen Wortstamm hörbar zu machen.
