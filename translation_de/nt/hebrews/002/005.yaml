  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: de
  text: Denn nicht Engeln hat er die zukünftige Welt unterstellt, von der wir sprechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die bewohnte Welt, die kommen wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Denn nicht
  rationale: γάρ verbindet den Satz begründend mit dem vorausgehenden Gedankengang; οὐ verneint die Aussage.
- source_word: ἀγγέλοις
  choice: Engeln
  rationale: Im unmittelbaren Kontext des Hebräerbriefs sind himmlische Engel gemeint, nicht menschliche Boten.
- source_word: ὑπέταξεν
  choice: hat ... unterstellt
  rationale: Das Verb bezeichnet das Unterordnen unter Herrschaft oder Autorität; „unterstellen“ gibt diesen Sinn im Deutschen knapp und natürlich wieder.
- source_word: τὴν οἰκουμένην τὴν μέλλουσαν
  choice: die zukünftige Welt
  rationale: οἰκουμένη kann die bewohnte Welt bezeichnen, während μέλλουσαν ihre zukünftige, eschatologische Ausrichtung markiert. „Die zukünftige Welt“ ist verständlich und lässt den Charakter dieser Weltordnung offen.
- source_word: περὶ ἧς λαλοῦμεν
  choice: von der wir sprechen
  rationale: Die Formulierung bewahrt den Bezug auf den fortlaufenden Gedankengang und gibt das Präsens von λαλοῦμεν wieder.
theological_decisions:
- issue: Bezug von „die zukünftige Welt“
  choice: Eine kommende eschatologische Welt beziehungsweise Weltordnung
  alternative: Die bewohnte Erde allgemein oder ausdrücklich das gegenwärtige Evangeliumszeitalter
  rationale: Die Verbindung von οἰκουμένη mit μέλλουσαν weist natürlich auf die künftig kommende Welt hin. Die Übersetzung legt jedoch nicht näher fest, wie diese eschatologische Wirklichkeit zeitlich oder heilsgeschichtlich einzuordnen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „nicht Engeln“ bewahrt den griechischen Kontrastakzent; die Fußnote macht den konkreteren Grundsinn von οἰκουμένη sichtbar.
