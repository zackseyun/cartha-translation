source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: de
  text: Darum musste er in jeder Hinsicht seinen Brüdern gleich werden[a], damit er in dem, was Gott betrifft, ein barmherziger und treuer Hohepriester werde, um die Sünden des Volkes zu sühnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen Brüdern und Schwestern«. Im Griechischen steht die maskuline Mehrzahl »Brüder«, die im Zusammenhang die größere Familie der Glaubenden einschließen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für die Sünden des Volkes Sühne zu erwirken«. Das griechische Verb wird je nach Deutung auch mit »entsühnen« oder »versöhnen« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang knapp und natürlich.
- source_word: ὤφειλεν
  choice: musste er
  rationale: Gibt die sachliche Notwendigkeit im Rahmen von Gottes Heilsabsicht wieder, ohne einen äußeren Zwang ausdrücklich einzutragen.
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Bewahrt den umfassenden Umfang der Gleichheit in idiomatischem Deutsch.
- source_word: τοῖς ἀδελφοῖς
  choice: seinen Brüdern
  rationale: Bewahrt die maskuline familiale Bezeichnung des griechischen Textes; der mögliche weitere, einschließende Bezug wird in der Fußnote erläutert.
- source_word: ὁμοιωθῆναι
  choice: gleich werden
  rationale: Gibt das passive Werden in Gleichheit natürlich wieder, ohne die Art dieser Gleichheit über den Text hinaus festzulegen.
- source_word: ἵνα ... εἰς τό
  choice: damit ... und so
  rationale: Macht Ziel und Folge der Aussage im Deutschen verständlich und hält beide eng zusammen.
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: Ist die etablierte, würdevolle Wiedergabe und passt zum priesterlichen Zusammenhang.
- source_word: πιστός
  choice: treu
  rationale: Bewahrt den Sinn verlässlicher Pflichterfüllung gegenüber Gott.
- source_word: ἀρχιερεύς
  choice: Hohepriester
  rationale: Direkte und im Deutschen geläufige Wiedergabe des kultischen Titels.
- source_word: τὰ πρὸς τὸν θεόν
  choice: in den Angelegenheiten vor Gott
  rationale: Bewahrt die formelle priesterliche Wendung und bezeichnet den Bereich des Dienstes in der Beziehung zu Gott.
- source_word: ἱλάσκεσθαι
  choice: Sühne schaffen für
  rationale: Ist verständlich, wahrt den priesterlichen Kontext und legt die umstrittene genaue Akzentuierung zwischen Entsühnung und Besänftigung nicht einseitig fest.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: für die Sünden des Volkes
  rationale: Gibt Objekt und Zugehörigkeit der Sünden klar und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von ἱλάσκεσθαι im theologisch vielschichtigen Sühnekontext
  choice: für die Sünden des Volkes Sühne schaffen
  alternative: die Sünden des Volkes sühnen; Gott wegen der Sünden des Volkes versöhnen
  rationale: Die Hauptfassung ist zugänglich und lässt offen, ob der Akzent stärker auf der Beseitigung der Sünden oder auf der Wiederherstellung der Beziehung zu Gott liegt. Die Alternativen werden in der Fußnote kenntlich gemacht.
- issue: Familiale Bezeichnung ἀδελφοῖς
  choice: seinen Brüdern
  alternative: seinen Brüdern und Schwestern
  rationale: Die Hauptfassung erhält die grammatisch maskuline Form und den Anschluss an die familiale Sprache des Kontextes; die mögliche inklusive Reichweite wird in der Fußnote erklärt.
- issue: Notwendigkeit in ὤφειλεν
  choice: musste
  alternative: war verpflichtet
  rationale: „Musste“ bringt die im Heilszusammenhang bestehende Notwendigkeit zum Ausdruck, ohne eine Aussage darüber zu erzwingen, ob sie als äußere Verpflichtung oder innere Angemessenheit zu bestimmen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt den logischen Zusammenhang und den priesterlichen Sprachgebrauch, vermeidet aber unnötig akademische Fachwörter. Sämtliche Fußnotenmarker stehen im Haupttext.
