  naturalness: »In den Angelegenheiten vor Gott« ist im modernen Standarddeutsch schwerfällig und weniger präzise als die etablierte, quellentreue Wendung »in dem, was Gott betrifft«. Die revidierte Satzstellung ist klar und würdevoll.
