source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: de
  text: Denn wenn die durch Engel verkündete Botschaft sich als verbindlich erwies[a] und jede Übertretung und jeder Ungehorsam eine gerechte Vergeltung erhielt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich das Gesetz, das nach jüdischer Überlieferung durch Engel vermittelt wurde; vergleiche Apostelgeschichte 7,53 und Galater 3,19.
    reason: cross_reference
  - marker: b
    text: 'Oder: „eine gerechte Strafe“ oder „die verdiente Gegenleistung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: die durch Engel verkündete Botschaft
  rationale: λόγος bezeichnet hier eine mitgeteilte göttliche Botschaft. „Durch Engel“ bewahrt διά mit Genitiv als Vermittlung; „verkündete“ gibt λαληθείς in natürlichem Deutsch wieder, ohne die Engel als Urheber darzustellen.
- source_word: ἀγγέλων
  choice: Engel
  rationale: Der Zusammenhang und die jüdische Überlieferung zur Vermittlung des Gesetzes weisen auf himmlische Engel, nicht auf menschliche Boten.
- source_word: ἐγένετο βέβαιος
  choice: sich als verbindlich erwies
  rationale: Die Wendung besagt, dass die Botschaft feststand, gültig war und ihre Rechtskraft zeigte. „Verbindlich“ bringt den rechtlichen Kontext deutlicher zum Ausdruck als bloß „zuverlässig“.
- source_word: πᾶσα παράβασις
  choice: jede Übertretung
  rationale: παράβασις bezeichnet das Überschreiten einer gesetzten Grenze beziehungsweise das Verletzen eines Gebots. „Übertretung“ ist präzise und im Deutschen verständlich.
- source_word: παρακοὴ
  choice: jeder Ungehorsam
  rationale: παρακοή bezeichnet ein Nicht-Hören beziehungsweise Nicht-Befolgen und hat hier einen moralisch-rechtlichen Sinn. Der deutsche Artikel wird wiederholt, weil die beiden Substantive unterschiedliche Genera haben und als jeweils umfassende Kategorien erscheinen.
- source_word: ἔλαβεν
  choice: empfing
  rationale: „Empfing“ bewahrt die Konstruktion, in der jede Übertretung und jeder Ungehorsam die entsprechende Vergeltung erhält, und passt zum gehobenen gerichtlichen Sprachgebrauch.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: die gerechte Vergeltung
  rationale: μισθαποδοσία bezeichnet Vergeltung, Gegenleistung oder Lohn; ἔνδικος kennzeichnet sie als gerecht beziehungsweise verdient. Der bestimmte Artikel ist im Deutschen idiomatisch für die jeweils entsprechende Folge, obwohl das Griechische keinen Artikel setzt.
theological_decisions:
- issue: Identität der „durch Engel verkündeten Botschaft“
  choice: Die Formulierung bleibt allgemein und spielt wahrscheinlich auf das durch Engel vermittelte Gesetz an.
  alternative: Das Gesetz ausdrücklich im Haupttext nennen oder die Worte auf eine allgemeinere Engelsbotschaft beziehen.
  rationale: Der Kontext legt die Sinai-Gesetzestradition nahe, doch der griechische Text sagt lediglich „die durch Engel gesprochene Botschaft“. Die Übersetzung erhält diese indirekte Bezugnahme und erläutert die wahrscheinliche Identifikation nur in der Fußnote.
- issue: Bedeutung der Vergeltung
  choice: „gerechte Vergeltung“ bewahrt den umfassenden Gedanken einer verdienten Gegenleistung mit strafender Wirkung.
  alternative: „gerechte Strafe“ würde den gerichtlichen Sinn enger und eindeutiger festlegen.
  rationale: Im Kontext ist die Vergeltung negativ und strafend, doch μισθαποδοσία ist lexikalisch weiter als „Strafe“. Die Hauptübersetzung bewahrt diese Spannweite; die Fußnote nennt verständliche Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung wahrt den konditionalen Satzanschluss an Vers 3. „Botschaft“ ist natürlicher als das isolierte „Wort“, während „verbindlich“, „Übertretung“, „Ungehorsam“ und „Vergeltung“ den rechtlich-feierlichen Ton des griechischen Textes erhalten.
