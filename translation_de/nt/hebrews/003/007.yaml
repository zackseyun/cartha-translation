  variant: modern standard German
source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: de
  text: 'Darum, wie der Heilige Geist sagt: »Heute, wenn ihr seine Stimme hört,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Darum
  rationale: Die folgernde Konjunktion knüpft den folgenden Schriftaufruf als Konsequenz an den vorausgehenden Gedankengang an; »Darum« ist prägnant und natürlich.
- source_word: καθὼς
  choice: wie
  rationale: Leitet die Zitierformel ein. Das deutsche »wie« gibt den Vergleichs- und Anschlusscharakter idiomatisch wieder; »genauso wie« wäre hier unnötig schwer.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens der Zitierformel bleibt als lebendiges Präsens erhalten und lässt die Schriftstimme gegenwärtig erklingen.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Die bestimmte griechische Wortgruppe wird in der üblichen, präzisen deutschen Bezeichnung wiedergegeben, ohne zusätzliche Hervorhebung.
- source_word: Σήμερον
  choice: Heute
  rationale: Direkte Wiedergabe des Temporaladverbs am Beginn des Zitats.
- source_word: ἐὰν
  choice: wenn
  rationale: Im Deutschen ist »wenn« in diesem mahnenden, noch offenen Bedingungssatz natürlicher als »falls« und bewahrt den konditionalen Sinn.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: seine Stimme
  rationale: Der Genitiv als Ergänzung zu ἀκούω wird idiomatisch als direktes Objekt wiedergegeben. »Stimme« bewahrt den persönlichen Charakter.
- source_word: ἀκούσητε
  choice: ihr … hört
  rationale: Der Aorist Konjunktiv nach ἐάν wird im Deutschen natürlich mit Präsens wiedergegeben. »Hört« lässt zunächst die Grundbedeutung des Wahrnehmens stehen, ohne ausdrücklich »gehorcht« einzutragen.
theological_decisions:
- issue: Zuschreibung des Psalmzitats
  choice: Das Zitat wird unmittelbar als gegenwärtiges Reden des Heiligen Geistes eingeführt.
  alternative: Der Heilige Geist redet durch die Schrift beziehungsweise den Psalmisten.
  rationale: Der griechische Text sagt ausdrücklich »der Heilige Geist sagt«. Die Übersetzung bewahrt diese direkte Zuschreibung, ohne eine weiter ausgeführte Inspirationslehre in den Vers einzutragen.
- issue: Bedeutungsumfang von ἀκούσητε
  choice: »hört«
  alternative: »auf seine Stimme hört« im Sinn von »ihr gehorcht«
  rationale: Im biblischen Kontext kann Hören Gehorsam einschließen; die Übersetzung bewahrt jedoch die lexikalische Offenheit und lässt die folgende Mahnung den geforderten gehorsamen Umgang mit der Stimme entfalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zeichensetzung lässt das in Vers 8 fortgesetzte Zitat bewusst offen; daher endet der Vers mit einem Komma. Keine Fußnoten erforderlich.
