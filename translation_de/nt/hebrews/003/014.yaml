    issue: „bekommen“ für γεγόναμεν
    rationale: Die Formulierung ist verständlich, klingt aber vergleichsweise umgangssprachlich und rückt den Empfang stärker in den Vordergrund als den durch das griechische Perfekt bezeichneten erreichten Status. „Erlangt“ ist hier genauer und registergerecht.
  revised_text: Denn wir haben Anteil am Messias[a] erlangt, wenn wir wirklich die anfängliche Zuversicht[b] bis zum Ende festhalten.[c]
