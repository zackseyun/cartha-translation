revisions:
- from: Denn wir haben Anteil am Messias[a] bekommen, wenn wir wirklich die anfängliche Zuversicht[b] bis zum Ende festhalten.[c]
  to: Denn wir haben Anteil am Messias[a] erlangt, wenn wir wirklich die anfängliche Zuversicht[b] bis zum Ende festhalten.[c]
  rationale: Die minimale Änderung von „bekommen“ zu „erlangt“ hebt die umgangssprachliche Färbung auf und gibt den durch γεγόναμεν ausgedrückten eingetretenen und fortbestehenden Zustand angemessener wieder. Bedeutung, Bedingungscharakter, Ambiguität und Fußnotenanker bleiben erhalten.
