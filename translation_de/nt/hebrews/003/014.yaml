id: HEB.3.14
reference: Hebrews 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: de
  text: Denn wir haben Anteil am Messias[a] erlangt, wenn wir wirklich die anfängliche Zuversicht[b] bis zum Ende festhalten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Teilhaber des Messias“ oder „Gefährten des Messias“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „feste Gewissheit“. Das griechische Wort kann je nach Zusammenhang auch „Grundlage“, „Wesen“ oder „Wirklichkeit“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „den Anfang der Zuversicht bis zum Ende fest bewahren“.'
    reason: translation_structure
lexical_decisions:
- source_word: μέτοχοι
  choice: Anteil haben
  rationale: Die Wendung gibt die Beteiligung an beziehungsweise Gemeinschaft mit jemandem natürlich und würdig wieder, ohne das heute ungebräuchlichere „Teilhaber“ zu erzwingen.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Mahnung.
- source_word: τοῦ Χριστοῦ
  choice: am Messias
  rationale: Χριστός ist hier als Titel verstanden; der Genitiv nach μέτοχοι wird im Deutschen idiomatisch mit „Anteil an“ wiedergegeben.
- source_word: γεγόναμεν
  choice: haben … bekommen
  rationale: Das Perfekt bezeichnet einen eingetretenen Zustand mit fortdauerndem Ergebnis. „Anteil bekommen haben“ bewahrt den Eintritt in diesen Zustand besser als das bloße „Anteil haben“.
- source_word: ἐάνπερ
  choice: wenn … wirklich
  rationale: Die Übersetzung wahrt die verstärkende Kraft der Bedingung und klingt im modernen Deutsch natürlicher als „wenn anders“.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: die anfängliche Zuversicht
  rationale: Der attributive Ausdruck gibt idiomatisch die zu Beginn vorhandene Haltung wieder. ὑπόστασις bezeichnet hier wahrscheinlich Zuversicht beziehungsweise feste Gewissheit, ohne seine gesamte Bedeutungsbreite festzulegen.
- source_word: μέχρι τέλους
  choice: bis zum Ende
  rationale: Die Wendung bezeichnet das Ausharren über den gesamten Zeitraum hinweg.
- source_word: βεβαίαν κατάσχωμεν
  choice: festhalten
  rationale: Das Verb und das prädikative Adjektiv drücken gemeinsam aus, dass die anfängliche Zuversicht beständig und fest bewahrt wird.
theological_decisions:
- issue: Bedingung und Beharren
  choice: Die reale, betonte Bedingung bleibt mit „wenn wir wirklich … festhalten“ stehen.
  alternative: Die Bedingung ausdrücklich nur als Beweis früherer Teilhabe oder als Aussage über den Verlust dieser Teilhabe auszulegen.
  rationale: Der griechische Wortlaut formuliert eine Bedingung, entscheidet aber nicht ausdrücklich zwischen später entwickelten Lehrmodellen zu Beharren, Abfall und Heilsgewissheit.
- issue: Beziehung zu Christus
  choice: „Anteil am Messias bekommen“
  alternative: „Gefährten des Messias geworden“ oder „Teilhaber an Christus geworden“
  rationale: Die gewählte Fassung bewahrt die absichtlich weit gefasste Beteiligungsbeziehung des Genitivs, ohne sie genauer als der Ausgangstext zu bestimmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Messias“ wahrt den Titelcharakter von Χριστός. Die kompakte Formulierung „anfängliche Zuversicht“ vermeidet eine schwer verständliche wörtliche Genitivkonstruktion; eine Fußnote macht die Ausgangsstruktur sichtbar.
