source:
  edition: SBLGNT
  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: de
  text: 'Während es heißt: »Heute, wenn ihr seine Stimme hört, verhärtet eure Herzen nicht wie bei der Auflehnung[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verbitterung«; das Wort bezeichnet hier Israels provozierende Widersetzlichkeit in der Wüste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: Während es heißt
  rationale: Die Konstruktion mit ἐν und substantiviertem Präsensinfinitiv ist temporal beziehungsweise begleitend. „Während es heißt“ gibt den fortdauernden Vollzug des Schriftwortes in natürlichem Deutsch wieder, ohne daraus lediglich eine abgeschlossene frühere Aussage zu machen.
- source_word: Σήμερον
  choice: Heute
  rationale: Die übliche und prägnante Wiedergabe bewahrt die unmittelbare Dringlichkeit des Psalmwortes.
- source_word: ἐὰν
  choice: wenn
  rationale: Im Deutschen ist „wenn“ in dieser offenen Bedingung und Mahnung natürlicher als „falls“ und kann zugleich den konditionalen Sinn tragen.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: seine Stimme
  rationale: Die idiomatische Wiedergabe der Genitivverbindung erhält den persönlichen Gottesbezug.
- source_word: ἀκούσητε
  choice: ihr … hört
  rationale: Der Aorist Konjunktiv in der Bedingung wird im Deutschen sachgerecht mit dem Präsens wiedergegeben. „Hören“ bewahrt zudem die mögliche Spannung zwischen bloßem Wahrnehmen und gehorsamem Hören.
- source_word: Μὴ σκληρύνητε
  choice: verhärtet … nicht
  rationale: Der verneinte Aorist Konjunktiv hat auffordernden Sinn. „Verhärten“ ist eine genaue, verständliche Wiedergabe und bewahrt den Anklang an Psalm 95.
- source_word: τὰς καρδίας ὑμῶν
  choice: eure Herzen
  rationale: „Herzen“ erhält den biblischen Sinn des inneren Menschen einschließlich Denken, Wollen und Haltung, statt ihn auf Gefühle einzuengen.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: wie bei der Auflehnung
  rationale: παραπικρασμός bezeichnet hier Israels widersetzliches Verhalten in der Wüste. „Auflehnung“ vermittelt den moralischen Gehalt in heutigem Deutsch; „bei“ verweist natürlich auf das damalige Geschehen.
theological_decisions:
- issue: Wiedergabe von παραπικρασμός im Zitat aus Psalm 95
  choice: Auflehnung
  alternative: Verbitterung
  rationale: Der Kontext bezeichnet Israels trotzigen Widerstand gegen Gott. „Auflehnung“ macht diesen Handlungs- und Bundesbruchcharakter deutlich, während „Verbitterung“ näher an einer traditionellen formalen Wiedergabe liegt, im heutigen Deutsch aber leicht als innerer Gefühlszustand missverstanden wird. Die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Ausdruck bleibt als abhängige Wendung stehen, wie im griechischen Text, und wird nicht durch eine ergänzte Hauptaussage geglättet. Die direkte Anrede und die Bildsprache der verhärteten Herzen bleiben erhalten.
