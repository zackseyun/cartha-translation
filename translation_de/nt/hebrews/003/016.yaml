source:
  edition: SBLGNT
  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: de
  text: Denn wer lehnte sich auf, nachdem er gehört hatte?[a] Waren es nicht alle, die durch Mose aus Ägypten ausgezogen waren?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Wer reizte (ihn) oder erbitterte (ihn), nachdem er gehört hatte?“ Das griechische Verb kann ein Reizen oder Erbittern bezeichnen; hier geht es um Israels rebellisches Verhalten in der Wüste. Das Objekt ist im Griechischen nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: wer
  rationale: Das interrogative Pronomen leitet eine rhetorische Frage nach der Identität der Aufständischen ein. Im Deutschen kann „wer“ auch bei einer Mehrzahl stehen und klingt hier natürlicher als „welche“.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet die Begründung beziehungsweise Erläuterung des vorausgehenden Gedankens und bewahrt den argumentativen Zusammenhang.
- source_word: ἀκούσαντες
  choice: hörte
  rationale: Das substantivisch auf die Gefragten bezogene Aoristpartizip wird idiomatisch mit einer koordinierten Verbform wiedergegeben. Die Abfolge – sie hörten und lehnten sich dann auf – bleibt erkennbar.
- source_word: παρεπίκραναν
  choice: lehnte sich auf
  rationale: Im Kontext der Wüstengeneration bezeichnet das Verb widersetzliches Handeln, durch das Gott gereizt wurde. „Sich auflehnen“ vermittelt diese rebellische Haltung verständlich, ohne das Objekt „Gott“ ausdrücklich zu ergänzen.
- source_word: ἀλλ’ οὐ πάντες
  choice: Waren es nicht alle
  rationale: Die Wendung führt die in der rhetorischen Gegenfrage erwartete Antwort ein. Das griechische ἀλλά wirkt hier idiomatisch korrigierend; eine zusätzliche Wiedergabe mit „aber“ wäre im Deutschen schwerfällig.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: die … aus Ägypten ausgezogen waren
  rationale: Das substantivierte Aoristpartizip bezeichnet die Menschen des Exodus. Das Plusquamperfekt stellt natürlich heraus, dass ihr Auszug der späteren Auflehnung vorauslag.
- source_word: διὰ Μωϋσέως
  choice: durch Mose
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise menschliche Leitung. „Durch Mose“ wahrt die knappe Ausdrucksweise und legt die genaue Art der Vermittlung nicht weiter fest.
theological_decisions:
- issue: Bedeutung von παραπικραίνω im Zusammenhang mit der Wüstengeneration
  choice: „lehnte sich auf“ im Haupttext
  alternative: „reizte“ oder „erbitterte“
  rationale: Der Kontext beschreibt Israels rebellischen Widerstand nach dem Hören. Die gewählte Formulierung gibt den kontextuellen Sinn wieder; die wörtlicheren Möglichkeiten und die offene Objektbeziehung werden in der Fußnote kenntlich gemacht.
- issue: Nicht ausdrücklich genanntes Objekt von παρεπίκραναν
  choice: Kein Objekt im Haupttext ergänzen
  alternative: „reizte Gott zum Zorn“
  rationale: Im griechischen Satz steht kein ausdrückliches Objekt. Obwohl der Kontext Gott als den Provozierten nahelegt, bewahrt die Übersetzung die formale Offenheit und vermeidet eine stillschweigende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen und der begründende Anschluss mit „Denn“ bleiben erhalten. „Mose“ folgt der heute üblichen deutschen Namensform.
