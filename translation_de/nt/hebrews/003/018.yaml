  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: de
  text: Und wem schwor er, dass sie nicht in seine Ruhe eingehen würden, wenn nicht denen, die ungehorsam waren[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die nicht gehorchten“. Das griechische Partizip kann die konkrete Verweigerung des Gehorsams hervorheben; im Zusammenhang ist dieser Ungehorsam eng mit Unglauben verbunden (vgl. Hebräer 3,19).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: wem
  rationale: Der Dativ Plural des Fragepronomens bezieht sich auf Personen; „wem“ gibt die rhetorische Frage im Deutschen knapp und idiomatisch wieder.
- source_word: δὲ
  choice: Und
  rationale: δέ führt die vorangehende Folge rhetorischer Fragen weiter, ohne hier einen starken Gegensatz auszudrücken.
- source_word: ὤμοσεν
  choice: schwor er
  rationale: Der Aorist von ὀμνύω bezeichnet ein feierliches Schwören; die einfache Vergangenheitsform passt zur deutschen Fragestruktur.
- source_word: μὴ εἰσελεύσεσθαι
  choice: dass sie nicht ... eingehen würden
  rationale: Der Infinitiv gibt den Inhalt des Schwurs wieder; ein deutscher dass-Satz mit „würden“ bildet die indirekte Aussage natürlich ab.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: in seine Ruhe
  rationale: κατάπαυσις bezeichnet im Hebräerbrief thematisch Gottes Ruhe; „in seine Ruhe eingehen“ bewahrt sowohl das Bewegungsmotiv als auch den Leitbegriff.
- source_word: εἰ μὴ
  choice: wenn nicht
  rationale: In der rhetorischen Frage leitet εἰ μή die erwartete Antwort ein; „wenn nicht“ erhält deren Form und Nachdruck.
- source_word: τοῖς ἀπειθήσασιν
  choice: denen, die ungehorsam waren
  rationale: Das substantivierte Aoristpartizip von ἀπειθέω bezeichnet Menschen, die sich dem Gehorsam verweigerten. Die Wiedergabe bewahrt die Unterscheidung zu ἀπιστία in Vers 19, ohne den Zusammenhang von Ungehorsam und Unglauben zu verdecken.
theological_decisions:
- issue: Wiedergabe von ἀπειθήσασιν im Zusammenhang von Hebräer 3
  choice: die ungehorsam waren
  alternative: die nicht glaubten
  rationale: Vers 18 verwendet ἀπειθέω, während Vers 19 ἀπιστία nennt. Daher bleibt im Haupttext der Aspekt des Ungehorsams erhalten; die enge Beziehung zum Unglauben wird nicht durch eine begriffliche Gleichsetzung vorweggenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte rhetorische Frage und der Leitbegriff „Ruhe“ bleiben erhalten; die Formulierung vermeidet konfessionelle Zusatzdeutungen.
