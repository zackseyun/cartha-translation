id: HEB.3.8
reference: Hebrews 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: de
  text: Verhärtet eure Herzen nicht wie bei der Auflehnung[a], wie am Tag der Erprobung in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, nach den hebräischen Ortsnamen, die Psalm 95,8 zugrunde liegen: „wie bei Meriba, am Tag von Massa in der Wüste“.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: Verhärtet … nicht
  rationale: Der Aorist Konjunktiv Aktiv mit μή bildet hier ein direktes Verbot. Die aktive Form wahrt die Verantwortung der Angesprochenen.
- source_word: τὰς καρδίας ὑμῶν
  choice: eure Herzen
  rationale: „Herzen“ bezeichnet im biblischen Sprachgebrauch das innere Denken, Wollen und die Haltung des Menschen; der Plural der direkten Anrede bleibt erhalten.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: wie bei der Auflehnung
  rationale: παραπικρασμός bezeichnet ein widersetzliches Aufbegehren beziehungsweise eine Provokation. „Auflehnung“ gibt den Vorgang und seine moralische Bedeutung in natürlichem Deutsch wieder, ohne den griechischen Ereignisbegriff durch den hebräischen Ortsnamen Meriba zu ersetzen.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: wie am Tag der Erprobung
  rationale: κατά mit Akkusativ führt hier die parallele Vergleichsangabe weiter. πειρασμός meint in diesem geschichtlichen Zusammenhang eine Erprobung beziehungsweise Prüfung, nicht vorrangig eine innere Versuchung zur Sünde.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist die übliche und verständliche Bezeichnung für den Schauplatz der Wüstenwanderung Israels.
theological_decisions:
- issue: Wiedergabe des geschichtlichen Bezugs auf Psalm 95,8
  choice: Die griechischen Ereignisbegriffe werden im Haupttext beschreibend mit „Auflehnung“ und „Tag der Erprobung“ wiedergegeben.
  alternative: „wie bei Meriba, am Tag von Massa in der Wüste“
  rationale: Hebräer zitiert die griechische Fassung des Psalms, die anstelle der hebräischen Ortsnamen deutende Substantive verwendet. Der Haupttext folgt daher dem vorliegenden griechischen Wortlaut; die bedeutsamen hebräischen Ortsnamen werden in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter gemeinschaftlicher Anrede. „Auflehnung“ und „Erprobung“ sind verständlich, wahren aber den schriftsprachlichen Ton des Psalmzitats.
