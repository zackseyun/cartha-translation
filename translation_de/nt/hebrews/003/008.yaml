review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt das griechische Verbot μὴ σκληρύνητε aktiv und direkt wieder. „wie bei der Auflehnung, wie am Tag der Erprobung“ wahrt die zwei parallelen Vergleichsangaben und lässt die durch die LXX vermittelte Ereignisdeutung gegenüber den hebräischen Ortsnamen bestehen. „Erprobung“ ist für πειρασμός im Wüstenkontext treffend; „in der Wüste“ entspricht ἐν τῇ ἐρήμῳ.
  naturalness: „Verhärtet eure Herzen nicht“ ist idiomatisches, modernes Standarddeutsch mit angemessen würdigem Schriftton. Die Wiederholung von „wie“ ist im Deutschen zwar leicht markiert, bildet aber die bewusste Parallelität der Vorlage verständlich ab.
  terminology: „Herzen“, „Auflehnung“, „Erprobung“ und „Wüste“ sind terminologisch tragfähig. „Auflehnung“ vermittelt den rebellischen bzw. provozierenden Charakter von παραπικρασμός ohne die nicht im griechischen Haupttext stehenden Ortsnamen einzusetzen. Die Fußnote bietet Meriba und Massa als klar gekennzeichnete Alternative.
