id: HEB.3.4
reference: Hebrews 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: de
  text: Denn jedes Haus wird von jemandem gebaut; der aber alles gebaut hat, ist Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: jedes
  rationale: Mit dem singularischen οἶκος ist πᾶς distributiv gebraucht. „Jedes Haus“ gibt die allgemeine Aussage natürlich und genau wieder.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Aussage. „Denn“ wahrt den erklärenden Zusammenhang knapp und idiomatisch.
- source_word: οἶκος
  choice: Haus
  rationale: Der unmittelbare Kontext arbeitet mit dem wörtlichen und übertragenen Sinn von οἶκος. „Haus“ bewahrt dieses Bild, ohne es vorschnell als „Hausgemeinschaft“ auszulegen.
- source_word: κατασκευάζεται
  choice: wird gebaut
  rationale: Das Präsens Passiv bezeichnet hier, dass ein Haus durch einen Erbauer entsteht. „Wird gebaut“ ist verständlich und hält das architektonische Bild fest.
- source_word: ὑπό τινος
  choice: von jemandem
  rationale: ὑπό mit Genitiv bezeichnet den Handelnden; das indefinite τις wird natürlich mit „jemandem“ wiedergegeben.
- source_word: ὁ δὲ
  choice: der aber
  rationale: Der substantivierte Artikel mit Partizip wird durch „der … gebaut hat“ wiedergegeben; „aber“ markiert die leichte Gegenüberstellung und den Übergang zur entscheidenden Aussage.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend „alles“. Diese deutsche Form ist idiomatisch und hält den Umfang offen, ohne ausdrücklich „Universum“ einzutragen.
- source_word: κατασκευάσας
  choice: gebaut hat
  rationale: Die Wiedergabe wahrt die lexikalische Verbindung zum ersten Vorkommen von κατασκευάζω und damit die Analogie des Verses.
- source_word: θεός
  choice: Gott
  rationale: θεός identifiziert prädikativ denjenigen, der alles gebaut hat. Die deutsche Satzstellung „… ist Gott“ bildet diese Identifikation klar ab.
theological_decisions:
- issue: Identifikation des Erbauers aller Dinge
  choice: „der aber alles gebaut hat, ist Gott“
  alternative: „aber Gott ist der, der alles gebaut hat“
  rationale: Die gewählte Fassung folgt der griechischen Informationsstruktur ὁ … κατασκευάσας θεός und stellt ausdrücklich fest, dass der Erbauer von allem Gott ist, ohne zusätzliche metaphysische Deutung einzutragen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Wiederholung von „gebaut“ ist bewusst beibehalten, weil sie den argumentativen Wortbezug des griechischen Textes trägt. Kein Fußnotenmarker ist nötig: Die mögliche englische Alternative „everything“ entspricht im Deutschen unmittelbar „alles“ und stellt hier keine eigenständige Übersetzungsalternative dar.'
