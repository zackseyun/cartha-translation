  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: de
  text: Gebt acht, Brüder und Schwestern[a], dass sich nicht in jemandem von euch ein böses Herz des Unglaubens findet, indem es sich vom lebendigen Gott abwendet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Brüder«; der maskuline griechische Plural kann hier eine gemischte Gruppe von Glaubenden anreden.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ein böses, treuloses Herz«; oder: »beim Abfallen / Sich-Entfernen vom lebendigen Gott«.'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Gebt acht
  rationale: Der präsentische Imperativ richtet eine eindringliche, fortdauernde Warnung an die ganze Gemeinschaft; »Gebt acht« ist natürlich und wahrt den mahnenden Ton.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline griechische Plural kann in diesem gemeindlichen Kontext eine gemischte Gruppe von Glaubenden anreden. Die inklusive deutsche Anrede gibt den kommunikativen Umfang natürlich wieder; die Form des Ausgangstextes wird in einer Fußnote vermerkt.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: dass nicht jemand von euch ... hat
  rationale: Die idiomatische deutsche Konstruktion bewahrt die Warnung vor einer möglichen Entwicklung bei jedem einzelnen Mitglied der Gemeinschaft.
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: ein böses, ungläubiges Herz
  rationale: »Herz« bewahrt die biblische Bezeichnung für das innere Zentrum von Denken, Wollen und Empfinden. Das attributive »ungläubig« gibt den Genitiv ἀπιστίας natürlich wieder, ohne seine mögliche Nuance der Untreue völlig auszuschließen.
- source_word: ἐν τῷ ἀποστῆναι
  choice: und sich ... abwendet
  rationale: Das Abwenden ist eng mit dem bösen, ungläubigen Herzen verbunden. Die koordinierte deutsche Form ist verständlich und lässt offen, ob die griechische Wendung eher Begleitumstand, Ausdruck oder Folge bezeichnet.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: von dem lebendigen Gott
  rationale: Die Wendung bezeichnet im Kontext bestimmt den lebendigen Gott und wahrt den etablierten biblischen Ausdruck.
theological_decisions:
- issue: Bedeutung von ἀπιστίας
  choice: ungläubig
  alternative: treulos
  rationale: Der Zusammenhang in Hebräer 3 betont das Nichtglauben an Gottes Wort. Zugleich kann ἀπιστία auch Untreue bezeichnen; diese mögliche Nuance wird in der Fußnote erhalten.
- issue: Stärke von ἀποστῆναι
  choice: sich abwenden
  alternative: abfallen / sich lossagen
  rationale: »Sich abwenden« gibt die Bewegung weg von Gott ernst und transparent wieder, ohne einen späteren technischen Apostasiebegriff in den Text einzutragen.
- issue: Verhältnis von ἐν τῷ ἀποστῆναι zum ungläubigen Herzen
  choice: koordinierte Formulierung mit »und«
  alternative: indem es sich abwendet / sodass er abfällt
  rationale: Die griechische Konstruktion kann Umstand, Ausdruck oder Folge anzeigen. Die deutsche Koordination vermeidet eine vorschnelle Festlegung und hält die enge sachliche Verbindung aufrecht.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Mahnton. Die direkte Gemeinschaftsanrede und die biblische Herz-Metaphorik bleiben erhalten; leicht technische oder konfessionell aufgeladene Ausdrücke werden vermieden.
