revisions:
- from: Gebt acht, Brüder und Schwestern[a], dass nicht jemand von euch ein böses, ungläubiges Herz hat und sich von dem lebendigen Gott abwendet.[b]
  to: Gebt acht, Brüder und Schwestern[a], dass sich nicht in jemandem von euch ein böses Herz des Unglaubens findet, indem es sich vom lebendigen Gott abwendet.[b]
  rationale: Die Revision gibt den Genitiv ἀπιστίας mit „des Unglaubens“ strukturell transparent wieder und bindet ἐν τῷ ἀποστῆναι durch „indem es sich ... abwendet“ enger an das Herz. Sie wahrt die semantische Offenheit der Infinitivkonstruktion, ohne einen technischen Apostasiebegriff in den Haupttext einzutragen. Die Fußnote dokumentiert die relevanten lexikalischen Alternativen getrennt und idiomatisch.
