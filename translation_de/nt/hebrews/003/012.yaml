review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung ist weitgehend getroffen. Allerdings schwächt bzw. verschiebt die Verbindung mit „und“ die griechische Konstruktion ἐν τῷ ἀποστῆναι, die das böse Herz des Unglaubens näher als im Sich-Abwenden vom lebendigen Gott sichtbar werdend kennzeichnet. „Dass nicht jemand ... hat“ ist außerdem im Deutschen weniger präzise als eine Warnung davor, dass sich ein solches Herz „findet“ bzw. „in jemandem ist“; das griechische Futur lässt die Möglichkeit einer entstehenden bzw. vorhandenen Haltung offen.
  naturalness: „Gebt acht“ und „Brüder und Schwestern“ sind modernes, verständliches Standarddeutsch. Die revidierte Satzstellung ist idiomatischer und bewahrt zugleich die enge Verknüpfung der abschließenden Infinitivkonstruktion.
  terminology: „Böses Herz des Unglaubens“ gibt καρδία πονηρὰ ἀπιστίας genauer wieder als die doppelte Adjektivierung „böses, ungläubiges Herz“ und erhält die mögliche Nuance von ἀπιστία als Unglaube bzw. Treulosigkeit. „Sich abwenden“ ist für ἀποστῆναι angemessen; „abfallen“ bleibt eine mögliche, jedoch stärker interpretierende Alternative in der Anmerkung.
  issues:
  - severity: medium
    issue: Die koordinierende Wiedergabe „hat und sich ... abwendet“ für ἐν τῷ ἀποστῆναι
    rationale: Die griechische Präposition mit artikuliertem Infinitiv stellt das Sich-Abwenden nicht einfach als zweite, gleichrangige Aussage neben das Haben eines bösen Herzens. „Indem es sich abwendet“ bildet die syntaktische und sachliche Bindung genauer ab, ohne die genaue relationale Nuance zu überbestimmen.
  - severity: low
    issue: „dass nicht jemand von euch ein ... Herz hat“
    rationale: Die Formulierung ist verständlich, klingt aber etwas schwerfällig und kann das ἔσται unnötig als bloß gegenwärtigen Besitz lesen. „dass sich in jemandem von euch ... findet“ ist natürlicher und lässt die im griechischen Futur angelegte Möglichkeit offen.
  - severity: low
    issue: Fußnote b verbindet mehrere Alternativen in einer ungenauen Gesamtparaphrase
    rationale: Die Wendung „indem er ... abfällt“ wechselt ohne Grundlage vom sächlichen Bezug auf „Herz“ zu „er“ und koppelt zudem zwei unabhängige Übersetzungsentscheidungen. Getrennte, präzise Alternativen sind klarer.
