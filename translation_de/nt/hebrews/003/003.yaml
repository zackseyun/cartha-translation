id: HEB.3.3
reference: Hebrews 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: de
  text: Denn dieser ist einer größeren Herrlichkeit würdig erachtet worden als Mose, in dem Maß, in dem der Erbauer des Hauses größere Ehre hat als das Haus selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: dieser
  rationale: Der demonstrative Rückverweis bleibt entsprechend dem griechischen Text erhalten und bezeichnet im Zusammenhang Jesus.
- source_word: δόξης
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ gibt δόξα in seinem gewichtigen theologischen Sinn wieder; „Ehre“ wäre möglich, würde aber die im Vers erkennbare Unterscheidung von δόξα und τιμή verwischen.
- source_word: ἠξίωται
  choice: ist … für würdig erachtet worden
  rationale: Das Perfekt Passiv wird formal und in seiner fortdauernden Geltung wiedergegeben.
- source_word: καθ’ ὅσον
  choice: in dem Maß, wie
  rationale: Bewahrt den proportionalen Vergleich des griechischen Ausdrucks genauer als ein bloßes „so wie“.
- source_word: ὁ κατασκευάσας αὐτόν
  choice: der Erbauer des Hauses
  rationale: κατασκευάζω kann „bauen“, „herstellen“ oder „einrichten“ bedeuten. Im Hausvergleich ist „Erbauer“ natürlich und prägnant; das Pronomen wird zur Klarheit mit „des Hauses“ aufgelöst.
- source_word: τιμὴν ἔχει
  choice: größere Ehre besitzt
  rationale: Gibt den vorliegenden Besitz beziehungsweise Rang wieder und unterscheidet τιμή sprachlich von δόξα.
theological_decisions:
- issue: Bezug von οὗτος
  choice: „dieser“ als ausdrücklicher Rückverweis
  alternative: „Jesus“
  rationale: Obwohl der Kontext Jesus eindeutig bezeichnet, vermeidet die Übersetzung eine erklärende Einfügung, die im Vers selbst nicht steht.
- issue: Passiv in ἠξίωται
  choice: „für würdig erachtet worden“
  alternative: „hat größere Herrlichkeit verdient“
  rationale: Das Passiv bleibt erhalten, ohne den im griechischen Text nicht ausdrücklich genannten Handelnden festzulegen oder den Satz als Verdienstbehauptung umzudeuten.
- issue: Hausmetapher
  choice: „das Haus selbst“
  alternative: „es“
  rationale: Die Wiederholung macht den Vergleich im Deutschen klar, ohne οἶκος vorschnell als Gebäude, Haushalt oder Gottesvolk auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt den begründenden Anschluss durch „Denn“ und den proportionalen Vergleich, bleibt aber gut lesbar. „Mose“ folgt der heute üblichen deutschen Namensform.
