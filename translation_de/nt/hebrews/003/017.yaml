source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: de
  text: Auf wen aber war er vierzig Jahre lang zornig? Waren es nicht die, die gesündigt hatten und deren Leiber[a] in der Wüste fielen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Leichname; wörtlich auch: Glieder.'
    reason: Lexikalische Spannweite von κῶλα und die harte Gerichtssprache des Ausdrucks.
lexical_decisions:
- source_word: προσώχθισεν
  choice: war er … zornig
  rationale: Das Verb bezeichnet Zorn oder Unwillen gegenüber jemandem. „War … zornig“ ist im heutigen Deutsch klar und bewahrt die rhetorische Schärfe.
- source_word: τεσσεράκοντα ἔτη
  choice: vierzig Jahre lang
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer; diese Wiedergabe ist natürlich und genau.
- source_word: ἁμαρτήσασιν
  choice: die, die gesündigt hatten
  rationale: Das Aoristpartizip blickt auf das Sündigen der Wüstengeneration zurück. Das Plusquamperfekt gibt diesen Rückbezug im Deutschen verständlich wieder.
- source_word: κῶλα
  choice: Leiber
  rationale: Das Wort bezeichnet wörtlich Glieder beziehungsweise Körper und meint hier die in der Wüste gefallenen Leiber der Israeliten. „Leiber“ bewahrt die konkrete, ernste Bildsprache, ohne den Tod stärker auszudeuten als der Ausdruck selbst.
- source_word: ἔπεσεν
  choice: fielen
  rationale: Die Wiedergabe erhält das Bild des Fallens und lässt den im Zusammenhang klaren Tod als Implikation stehen.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist die geläufige deutsche Bezeichnung für den Schauplatz der Wüstenwanderung Israels.
theological_decisions:
- issue: Unausgesprochenes Subjekt von προσώχθισεν
  choice: „er“ mit Bezug auf Gott
  alternative: Gott ausdrücklich nennen
  rationale: Der Zusammenhang identifiziert Gott als Subjekt. Das deutsche Pronomen macht die grammatisch erforderliche Bezugnahme sichtbar, ohne den Namen ergänzend in den Text einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte rhetorische Frage des griechischen Textes bleibt erhalten; „Auf wen … zornig“ ist gegenwärtig und allgemein verständlich.
