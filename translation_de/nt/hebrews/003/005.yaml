  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: de
  text: Und Mose war zwar in Gottes ganzem Haus[a] als Diener treu, zum Zeugnis von dem, was noch gesagt werden sollte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Gottes ganzer Hausgemeinschaft“. Das griechische Wort kann sowohl ein Haus als auch die dazugehörige Gemeinschaft bezeichnen; hier wird das Hausbild in den folgenden Versen weitergeführt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „zum Zeugnis von dem, was künftig gesagt werden sollte“. Die Formulierung weist auf ein späteres Reden voraus, ohne den Sprecher an dieser Stelle ausdrücklich zu nennen.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der Anschluss an den vorausgehenden Vergleich bleibt sichtbar.
- source_word: Μωϋσῆς μὲν
  choice: Mose war zwar
  rationale: „Zwar“ gibt μὲν natürlich wieder und bereitet den mit δέ folgenden Gegensatz in Vers 6 vor.
- source_word: πιστὸς
  choice: treu
  rationale: Bezeichnet Moses Verlässlichkeit in seinem Dienst und entspricht dem Sprachgebrauch des Zusammenhangs.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: in seinem ganzen Haus
  rationale: Bewahrt das aus 4. Mose 12,7 aufgenommene Hausbild, das in den folgenden Versen weitergeführt wird.
- source_word: ὡς θεράπων
  choice: als Diener
  rationale: „Diener“ wahrt die ehrenvolle Dienststellung von θεράπων und vermeidet die stärkere Bedeutung von „Sklave“, die eher mit δοῦλος verbunden ist.
- source_word: εἰς μαρτύριον
  choice: zum Zeugnis
  rationale: Gibt die Ziel- beziehungsweise Ergebnisrichtung knapp und idiomatisch wieder.
- source_word: τῶν λαληθησομένων
  choice: für das, was noch gesagt werden sollte
  rationale: Die zukünftige Passivform bleibt erhalten; „noch“ macht den zeitlichen Vorausbezug deutlich, ohne den Inhalt oder den Sprecher näher festzulegen.
theological_decisions:
- issue: Bedeutung von „seinem ganzen Haus“
  choice: Das Hausbild wird beibehalten und nicht auf ein gewöhnliches Wohnhaus oder einen rein häuslichen Haushalt verengt.
  alternative: „in seiner ganzen Hausgemeinschaft“ beziehungsweise „in seinem ganzen Haushalt“
  rationale: Der Zusammenhang versteht das „Haus“ als den Bereich, in dem Mose Gott diente, und entwickelt dieses Bild in Hebräer 3,6 weiter. Die Formulierung bewahrt zugleich die Anspielung auf 4. Mose 12,7.
- issue: Stellung des Mose als θεράπων
  choice: Mose wird als „Diener“ bezeichnet.
  alternative: „Bediensteter“ oder „Amtsträger“
  rationale: „Diener“ vermittelt den ehrenvollen Dienstsinn des griechischen Wortes, ohne den Gegensatz zum Sohn in Vers 6 abzuschwächen oder Mose als Sklaven zu bezeichnen.
- issue: Bezug des künftigen Redens
  choice: Die offene Formulierung „was noch gesagt werden sollte“ bleibt bestehen.
  alternative: Ausdrückliche Festlegung auf spätere göttliche Offenbarung oder auf die Verkündigung durch den Sohn
  rationale: Der griechische Text markiert zukünftiges Reden, nennt an dieser Stelle aber weder ausdrücklich den Sprecher noch bestimmt er dessen gesamten Inhalt. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zwar“ bildet den in Vers 6 fortgesetzten Gegensatz natürlich ab; „Haus“ erhält das leitende Bild des Abschnitts. Die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken.
