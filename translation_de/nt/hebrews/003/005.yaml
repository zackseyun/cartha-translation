  to: Und Mose war zwar in Gottes ganzem Haus[a] als Diener treu, zum Zeugnis von dem, was noch gesagt werden sollte[b].
  rationale: Die Revision korrigiert die Beziehung von „Zeugnis“ zu den künftig zu redenden Dingen, verdeutlicht den im Kontext gemeinten Besitzer des Hauses und hält die alternative Fußnote eng am allgemeinen Sinn von λαλέω. Die Ambiguität hinsichtlich des Sprechers und des genauen Inhalts des künftigen Redens bleibt erhalten.
