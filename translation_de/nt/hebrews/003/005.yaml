  source_fidelity: 'Der Entwurf gibt den Anschluss, den durch μὲν vorbereiteten Gegensatz, Moses'' Treue, das Hausbild, θεράπων und die Zukunftsperspektive insgesamt gut wieder. Bei εἰς μαρτύριον τῶν λαληθησομένων verschiebt „zum Zeugnis für das“ jedoch die Beziehung: Das Zeugnis bezieht sich auf die später zu redenden Dinge, nicht primär auf einen Zweck zugunsten dieser Dinge. „von dem“ bildet den Genitiv angemessener ab. Der Bezug von αὐτοῦ ist im Kontext Gottes Haus; die explizite Benennung verhindert im Deutschen die naheliegende Lesart, es handle sich um Moses'' eigenes Haus.'
  naturalness: „Und Mose war zwar ... treu“ ist würdiges, modernes Standarddeutsch und bereitet Vers 6 sinnvoll vor. „in Gottes ganzem Haus“ und „zum Zeugnis von dem“ sind klar und idiomatisch. Die Satzstruktur bleibt dem griechischen Text eng verbunden.
  terminology: „Diener“ ist für θεράπων gut gewählt und vermeidet die für δοῦλος nähere Wiedergabe „Sklave“. „Haus“ soll wegen des fortlaufenden Bildes beibehalten werden. Die Fußnote zu b sollte keine spezifischere Wiedergabe wie „verkündet“ als gleichwertige Alternative ausgeben, da λαλέω zunächst einfach „reden/sagen“ bezeichnet.
