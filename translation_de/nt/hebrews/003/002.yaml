base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: de
  text: Er ist dem treu, der ihn eingesetzt hat,[a] wie auch Mose in seinem Haus treu war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ihn gemacht hat“. Das griechische Verb kann „machen“ bedeuten, bezeichnet hier aber wahrscheinlich das Einsetzen oder Beauftragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Andere Handschriften lesen: „wie auch Mose in seinem ganzen Haus treu war“, in enger Anlehnung an 4. Mose 12,7. Gemeint ist wahrscheinlich Gottes Haus.'
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: Er ist … treu
  rationale: Die Partizipialfügung bezieht sich auf Jesus aus Vers 1. Ein selbstständiger deutscher Satz gibt diesen Bezug natürlich wieder; πιστός bezeichnet hier Treue und Zuverlässigkeit.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: dem, der ihn eingesetzt hat
  rationale: ποιέω bedeutet grundsätzlich „machen“, kann im Zusammenhang einer übertragenen Aufgabe aber „einsetzen“ oder „bestellen“ ausdrücken. „Eingesetzt“ passt zum Vergleich mit Moses Dienst, ohne eine Aussage über die Erschaffung des Sohnes vorwegzunehmen; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: ὡς καὶ
  choice: wie auch
  rationale: Die geläufige deutsche Vergleichsformulierung bildet die Verbindung zwischen der Treue Jesu und der Treue des Mose knapp und genau ab.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Übliche deutsche Namensform.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: in seinem Haus
  rationale: Die Übersetzung folgt dem angegebenen SBLGNT-Text ohne ein zusätzliches Wort für „ganz“. „Haus“ bewahrt zugleich das Bild, das in den folgenden Versen entfaltet wird, und lässt den Bezug des Pronomens ebenso offen wie der griechische Text.
theological_decisions:
- issue: Bedeutung von ποιήσαντι in Bezug auf Jesus
  choice: eingesetzt hat
  alternative: gemacht hat
  rationale: Die kontextuelle Wiedergabe „eingesetzt“ bezeichnet Jesu Beauftragung und vermeidet, die Formulierung unnötig als Aussage über seine Erschaffung festzulegen. Die lexikalisch mögliche wörtliche Wiedergabe bleibt in der Fußnote sichtbar.
- issue: Bezug von αὐτοῦ in „seinem Haus“
  choice: Das Pronomen bleibt unaufgelöst; wahrscheinlich ist Gottes Haus gemeint.
  alternative: Moses eigenes Haus
  rationale: Der Rückbezug auf den, der Jesus eingesetzt hat, und der Anklang an 4. Mose 12,7 sprechen für Gottes Haus. Die Übersetzung „seinem“ bewahrt jedoch die grammatische Offenheit des Ausgangstextes.
- issue: Textvariante mit „ganz“ beziehungsweise „all“
  choice: Haupttext ohne „ganz“ gemäß dem vorgelegten SBLGNT-Text
  alternative: wie auch Mose in seinem ganzen Haus treu war
  rationale: Die Hauptübersetzung folgt der angegebenen kritischen Textform. Die längere Lesart besitzt einen deutlicheren Anklang an 4. Mose 12,7 und wird daher in einer textkritischen Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform stellt den in Vers 1 genannten Jesus ausdrücklich als Subjekt heraus. „Haus“ bleibt wegen des alttestamentlichen Anklangs und der Weiterführung des Bildes in den folgenden Versen erhalten.
