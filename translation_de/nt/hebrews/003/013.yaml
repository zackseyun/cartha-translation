  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: de
  text: Sondern ermutigt einander[b] jeden Tag, solange es »Heute« heißt[a], damit niemand von euch durch die Täuschung der Sünde verhärtet wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Heute« greift Psalm 95 auf und bezeichnet die gegenwärtige Zeit, in der Gottes Ruf beantwortet werden muss.
    reason: cross_reference
  - marker: b
    text: 'Oder: »ermahnt einander«. Das griechische Verb kann je nach Zusammenhang ermutigen, ermahnen, zureden oder trösten bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sondern
  rationale: Der starke Gegensatz zur vorausgehenden Warnung wird im Deutschen nach der verneinten Aufforderung in Vers 12 natürlich mit »sondern« ausgedrückt.
- source_word: παρακαλεῖτε
  choice: ermutigt
  rationale: Das Verb umfasst Ermutigen, Ermahnen und Zureden. »Ermutigt« gibt hier die gegenseitige Stärkung zum Ausharren natürlich wieder; die mahnende Bedeutungsnuance bleibt in einer Fußnote sichtbar.
- source_word: ἑαυτοὺς
  choice: einander
  rationale: Das pluralische Reflexivpronomen hat hier reziproke Bedeutung und bezeichnet das gegenseitige Handeln innerhalb der Gemeinschaft.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: jeden Tag
  rationale: Die Wendung bezeichnet tägliche Wiederholung und wird so klar und idiomatisch wiedergegeben.
- source_word: ἄχρις οὗ
  choice: solange
  rationale: Im Zusammenhang bezeichnet die Wendung den fortdauernden Zeitraum, in dem der gegenwärtige Ruf Gottes gilt.
- source_word: τὸ Σήμερον καλεῖται
  choice: es »Heute« heißt
  rationale: Die substantivische Verwendung von »Heute« und das Passiv von καλεῖται bleiben erkennbar; die Anführungszeichen markieren den Rückbezug auf Psalm 95.
- source_word: ἵνα μὴ σκληρυνθῇ τις ἐξ ὑμῶν
  choice: damit niemand von euch … verhärtet wird
  rationale: Die negative Zweckangabe und der distributive Umfang der Warnung werden in natürlichem Deutsch bewahrt; das Passiv bleibt erhalten.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: durch den Betrug der Sünde
  rationale: Der Dativ wird instrumental verstanden. »Betrug der Sünde« bewahrt die personifizierende Aussage, dass die Sünde täuscht, ohne die Formulierung erklärend aufzulösen.
theological_decisions:
- issue: Gegenseitiges Ermutigen beziehungsweise Ermahnen
  choice: ermutigt einander
  alternative: ermahnt einander
  rationale: παρακαλεῖτε verbindet je nach Kontext Ermutigung, Mahnung und dringliches Zureden. Im Haupttext steht die stärkende Funktion im Vordergrund; die mahnende Nuance wird als echte lexikalische Alternative ausgewiesen.
- issue: Bedeutung von τὸ Σήμερον
  choice: »Heute« als gegenwärtige Zeit des göttlichen Rufes mit Anklang an Psalm 95
  alternative: heute lediglich als gewöhnliche Zeitangabe
  rationale: Der unmittelbare Zusammenhang in Hebräer 3 zitiert und entfaltet Psalm 95. Die Anführungszeichen zeigen die schriftbezogene, theologisch gewichtete Verwendung, ohne sie im Haupttext auszudeuten.
- issue: Vermittlung der Verhärtung
  choice: durch den Betrug der Sünde verhärtet
  alternative: wegen der Sünde verhärtet
  rationale: Der instrumentale Dativ bezeichnet die Täuschung der Sünde als Mittel der Verhärtung. Die Übersetzung bewahrt diese Spannung, ohne eine weitergehende Lehre über den Handelnden hinter dem Passiv festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ist aber idiomatisch. »Betrug der Sünde« bewahrt die bildhafte und theologische Spannung des Ausgangstextes; die Fußnotenmarker stehen jeweils unmittelbar bei ihrem Bezugsausdruck.
