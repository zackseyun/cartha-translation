lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den schlichten Anschluss an die vorhergehende Argumentation, ohne eine stärkere Schlussfolgerung einzutragen.
- source_word: βλέπομεν
  choice: wir sehen
  rationale: Gibt das Präsens und die erste Person Plural direkt und anschaulich wieder.
- source_word: ὅτι
  choice: dass
  rationale: Leitet im Deutschen natürlich den Inhalt dessen ein, was erkannt wird.
- source_word: οὐκ ἠδυνήθησαν
  choice: sie konnten nicht
  rationale: Natürliche deutsche Wiedergabe der ausdrücklich bezeichneten Unfähigkeit.
- source_word: εἰσελθεῖν
  choice: hineingehen
  rationale: Bewahrt den Bezug auf das im Kontext vorausgesetzte Ziel, ohne es im Vers ausdrücklich als Land oder Ruhe festzulegen.
- source_word: δι’
  choice: wegen
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder die Ursache.
- source_word: ἀπιστίαν
  choice: Unglauben
  rationale: Bezeichnet im unmittelbaren Zusammenhang die Weigerung, Gottes Zusage zu glauben und ihm zu vertrauen; die mögliche Nuance der Untreue wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutungsumfang von ἀπιστία im Verhältnis zu πίστις
  choice: Unglauben
  alternative: Untreue
  rationale: Der Kontext hebt das Nichtglauben und Nichtvertrauen hervor. Zugleich kann der Ausdruck untreue Verweigerung des Vertrauens einschließen; diese Spannung wird nicht aufgelöst, sondern in einer Fußnote kenntlich gemacht.
