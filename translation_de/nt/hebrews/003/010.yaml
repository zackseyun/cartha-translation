source:
  edition: SBLGNT
  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: de
  text: 'Vierzig Jahre lang[a]. Darum war ich über diese Generation empört[b] und sagte: »Immer gehen sie in ihrem Herzen in die Irre; doch sie haben meine Wege nicht erkannt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung »vierzig Jahre lang« kann auch mit dem folgenden Satz verbunden werden: »Darum war ich vierzig Jahre lang über diese Generation empört.«'
    reason: syntactic_ambiguity
  - marker: b
    text: Das griechische Verb bezeichnet heftigen Unwillen und kann je nach Zusammenhang auch mit »zornig sein« oder »Abscheu empfinden« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Vierzig Jahre lang
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer. Im gegebenen griechischen Text schließt die Wendung syntaktisch und durch die Interpunktion an den vorhergehenden Gedanken an.
- source_word: διὸ
  choice: Darum
  rationale: Gibt die folgernde Bedeutung knapp und natürlich wieder.
- source_word: προσώχθισα
  choice: war ich … empört
  rationale: Bezeichnet starke Missbilligung beziehungsweise heftigen Unwillen. »Empört« wahrt diese Stärke, ohne eindeutig auf bloßen Zorn oder Abscheu festgelegt zu sein.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: über diese Generation
  rationale: Die Dativkonstruktion nach προσώχθισα wird im Deutschen idiomatisch mit »über« wiedergegeben.
- source_word: Ἀεὶ πλανῶνται
  choice: Immer gehen sie … in die Irre
  rationale: Bewahrt sowohl den fortdauernden Charakter von ἀεί als auch das Bild des Abirrens.
- source_word: τῇ καρδίᾳ
  choice: in ihrem Herzen
  rationale: Bewahrt den griechischen Singular und ist im Deutschen auch bei einem pluralischen Subjekt natürlich verständlich.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: doch … haben sie nicht erkannt
  rationale: »Doch« bringt den Gegensatz zum Ausdruck; »erkannt« lässt neben dem Wissen auch die tiefere, erfahrungsbezogene Bedeutung offen.
- source_word: τὰς ὁδούς μου
  choice: meine Wege
  rationale: Bewahrt die geläufige biblische Metapher für Gottes Handeln und seine Weisungen.
theological_decisions:
- issue: Stärke und Art des göttlichen Missfallens in προσώχθισα
  choice: war ich … empört
  alternative: war ich zornig über / empfand ich Abscheu vor
  rationale: Die Formulierung bringt Gottes wirkliches und starkes Missfallen zum Ausdruck, legt den Begriff aber weder ausschließlich als Zorn noch als Abscheu aus.
- issue: Kollektiver Singular in τῇ καρδίᾳ
  choice: in ihrem Herzen
  alternative: in ihren Herzen
  rationale: Der Singular des Ausgangstextes kann die Generation als kollektive Einheit erfassen. Das Deutsche erlaubt hier eine natürliche Wiedergabe mit Singular, ohne die Aussage unnötig zu individualisieren.
- issue: Zuordnung von τεσσεράκοντα ἔτη
  choice: als Abschluss des vorhergehenden Gedankens wiedergegeben
  alternative: »Vierzig Jahre lang war ich darum über diese Generation empört«
  rationale: Die Interpunktion des SBLGNT setzt nach »vierzig Jahre« einen deutlichen Einschnitt; auch der Zusammenhang verbindet die vierzig Jahre zunächst mit dem Erproben und Sehen der Werke Gottes. Da antike Handschriften keine entsprechende moderne Satzinterpunktion boten, wird die andere Zuordnung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt bildhaft und gut verständlich. Der griechische Singular »Herz« wird als »in ihrem Herzen« bewahrt; die ungewöhnliche Versgrenze und die mögliche alternative Anbindung der Zeitangabe werden transparent gemacht.
