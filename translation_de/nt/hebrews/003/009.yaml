lexical_decisions:
- source_word: οὗ
  choice: wo
  rationale: Das Relativadverb verweist räumlich auf die Wüste im vorausgehenden Vers. „Wo“ bewahrt diesen Bezug; „als“ wäre als zeitliche Glättung ebenfalls denkbar.
- source_word: ἐπείρασαν
  choice: auf die Probe stellten
  rationale: πειράζω bezeichnet hier ein prüfendes, im Zusammenhang herausforderndes Verhalten gegenüber Gott. Die deutsche Wendung ist natürlich und gibt den negativen Unterton wieder, ohne ihn auszudeuten.
- source_word: οἱ πατέρες ὑμῶν
  choice: eure Väter
  rationale: Die direkte Wiedergabe bewahrt die geschichtliche und bundestheologische Ausdrucksweise des Zitats. „Eure Vorfahren“ wäre im heutigen Deutsch eindeutiger genealogisch, aber weniger formnah.
- source_word: ἐν δοκιμασίᾳ
  choice: auf die Probe
  rationale: Die schwierige Präpositionalfügung kann Art oder Mittel des Prüfens bezeichnen. In Verbindung mit πειράζω ergibt „auf die Probe stellen“ eine natürliche deutsche Formulierung; die mögliche Wiederholung des Prüfens wird in der Fußnote erhalten.
- source_word: καὶ εἶδον
  choice: und … sahen
  rationale: καί ist schlicht koordinierend. Der Haupttext fügt daher keinen konzessiven Sinn wie „obwohl“ oder „und doch“ hinzu.
- source_word: τὰ ἔργα μου
  choice: meine Taten
  rationale: ἔργα bezeichnet hier Gottes machtvolle Handlungen in der Wüste. „Taten“ ist im Deutschen natürlicher als „Werke“, ohne den konkreten Handlungsbezug zu verlieren.
theological_decisions:
- issue: Unausgesprochenes Objekt des Prüfens
  choice: mich auf die Probe stellten
  alternative: auf die Probe stellten
  rationale: Obwohl in diesem griechischen Teilsatz kein ausdrückliches Objekt steht, weist der Zusammenhang des Psalmzitats eindeutig auf Gott als das verstandene Objekt. „Mich“ macht den deutschen Satz vollständig, ohne zusätzliche Lehraussage einzutragen.
- issue: Verhältnis zwischen Prüfen und Sehen
  choice: und meine Taten sahen
  alternative: obwohl sie meine Taten sahen / und doch meine Taten sahen
  rationale: Der Zusammenhang kann einen Gegensatz nahelegen, doch der griechische Text setzt lediglich καί. Die Übersetzung bewahrt diese offene Verknüpfung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eure Väter“ bewahrt den biblisch-geschichtlichen Ton; „auf die Probe stellen“ ist zugleich gegenwärtig und gut verständlich. Die syntaktische Schwierigkeit von ἐν δοκιμασίᾳ sowie die mögliche konzessive Beziehung des letzten Teilsatzes werden nicht stillschweigend aufgelöst, sondern in den Fußnoten offengelegt.
