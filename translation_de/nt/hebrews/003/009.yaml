  text: wo eure Väter mich prüften, indem sie mich auf die Probe stellten[a], und meine Taten sahen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „mich durch Prüfen prüften“ oder „mich in einer Prüfung auf die Probe stellten“. Die schwierige Wendung ἐν δοκιμασίᾳ kann die Art oder das Mittel des Prüfens ausdrücken.'
