  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: de
  text: 'So schwor ich in meinem Zorn[a]: »Sie werden gewiss nicht in meine Ruhe eingehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die griechische Schwurformel: „Wenn sie in meine Ruhe eingehen werden.“ Gemeint ist: „Sie werden ganz gewiss nicht in meine Ruhe eingehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: wie
  rationale: Leitet innerhalb des fortlaufenden Zitats die Aussage über Gottes Schwur ein und entspricht hier natürlich dem vergleichend-anschließenden Sinn.
- source_word: ὤμοσα
  choice: ich schwor
  rationale: Der Aorist von ὀμνύω bezeichnet das Ablegen eines Eides; „ich schwor“ ist direkt, würdig und idiomatisch.
- source_word: ἐν τῇ ὀργῇ μου
  choice: in meinem Zorn
  rationale: „Zorn“ bewahrt stärker als „Ärger“ den feierlichen und gerichtlichen Ernst der göttlichen Reaktion.
- source_word: Εἰ εἰσελεύσονται
  choice: Sie werden niemals … eingehen
  rationale: Εἰ mit Futur bildet hier eine semitisch geprägte, elliptische Schwurformel, die keine offene Bedingung, sondern eine nachdrückliche Verneinung ausdrückt.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: in meine Ruhe eingehen
  rationale: „Ruhe“ erhält das zentrale Motiv aus Psalm 95 und dem Hebräerbrief, ohne es vorschnell als Land, Himmel oder inneren Frieden festzulegen; „in … eingehen“ bildet die Richtungsangabe εἰς natürlich ab.
theological_decisions:
- issue: Wiedergabe der Schwurformel Εἰ εἰσελεύσονται
  choice: 'Ausdrückliche Verneinung: „Sie werden niemals in meine Ruhe eingehen.“'
  alternative: 'Formal wörtlich: „Wenn sie in meine Ruhe eingehen werden.“'
  rationale: Die wörtliche Bedingungsform wäre im Deutschen missverständlich. Die ausdrückliche Verneinung vermittelt die etablierte Kraft der griechisch-hebräischen Schwurformel, ohne zusätzliche Lehrinhalte einzutragen.
- issue: Bedeutungsumfang von κατάπαυσις
  choice: Ruhe
  alternative: Ruhestätte
  rationale: „Ruhe“ wahrt die intertextuelle und theologische Spannung des Begriffs im Hebräerbrief und engt ihn nicht auf einen bestimmten Ort ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem biblischem Ton. „Zorn“, „schwor“ und „Ruhe“ bewahren die Ernsthaftigkeit und die Leitbegriffe des Ausgangstextes; die ungewöhnliche Schwurformel wird im Haupttext sinngemäß und in der Fußnote formal erläutert.
