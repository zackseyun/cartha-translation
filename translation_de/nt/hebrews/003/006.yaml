source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: de
  text: Der Messias aber ist als Sohn über seinem Haus treu[a]. Dieses Haus sind wir, wenn wir an unserer Zuversicht[b] und am Rühmen unserer Hoffnung[c] festhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«. Das griechische Χριστός kann sowohl als Titel (»Messias«) als auch als namensähnliche Bezeichnung (»Christus«) gebraucht werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »an unserem Freimut«. Das griechische παρρησία kann Offenheit, Freimut oder zuversichtliche Kühnheit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »am Grund zum Rühmen, den unsere Hoffnung gibt« oder »am Jubel unserer Hoffnung«. Das griechische καύχημα kann »Rühmen«, »Grund zum Rühmen« oder freudig geäußerte Zuversicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός hat hier im Kontrast zu Mose deutlich titulare Kraft. »Messias« gibt diese Funktion wieder; »Christus« bleibt als mögliche namensähnliche Wiedergabe in der Fußnote erhalten.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert den Kontrast zu Mose in Vers 5.
- source_word: ὡς υἱὸς
  choice: als Sohn
  rationale: Die vergleichende beziehungsweise qualitative Aussage wird knapp bewahrt. Die Großschreibung kennzeichnet die christologische Bezeichnung im Deutschen.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: über seinem Haus
  rationale: »Über« drückt Aufsicht und Autorität aus, während »Haus« die Metapher für Gottes Volk bewahrt. Das Pronomen »seinem« lässt im Deutschen den Bezug offen, statt ausdrücklich »Gottes Haus« oder »sein eigenes Haus« festzulegen.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Dieses Haus sind wir
  rationale: Die Formulierung gibt den Relativsatz natürlich wieder und bewahrt zugleich die Hausmetapher.
- source_word: ἐὰν
  choice: wenn
  rationale: »Wenn« formuliert die wirkliche Bedingung, ohne sie durch eine bestimmte Lehre über Beharren oder Abfall auszudeuten.
- source_word: παρρησίαν
  choice: Zuversicht
  rationale: Im Hebräerbrief bezeichnet παρρησία häufig eine offene, mutige Gewissheit. »Zuversicht« klingt im modernen Deutsch natürlich; »Freimut« wird als lexikalische Alternative genannt.
- source_word: καύχημα
  choice: Ruhm
  rationale: καύχημα kann den Gegenstand oder Grund des Rühmens bezeichnen. »Ruhm« erhält diese positive, nach außen tretende Bedeutung, ohne sie bloß mit »Zuversicht« gleichzusetzen.
- source_word: τῆς ἐλπίδος
  choice: unserer Hoffnung
  rationale: Das Possessivpronomen ist im Griechischen nicht ausdrücklich vorhanden, ergibt sich aber natürlich aus dem umgebenden Wir-Bezug.
- source_word: κατάσχωμεν
  choice: festhalten
  rationale: Das Verb bezeichnet beharrliches Bewahren oder Festhalten und trägt hier die Bedingung des Ausharrens.
- source_word: πιστός (aus dem syntaktischen Zusammenhang von Hebräer 3,5)
  choice: ist … treu
  rationale: Im griechischen Satz ist das Prädikat aus dem unmittelbar vorausgehenden Vergleich mit Mose sinngemäß zu ergänzen. Die deutsche Fassung macht diese Ellipse verständlich sichtbar.
theological_decisions:
- issue: Χριστός als Titel oder namensähnliche Bezeichnung
  choice: der Messias
  alternative: Christus
  rationale: Der heilsgeschichtliche Vergleich mit Mose unterstützt die titulare Wiedergabe. Die Alternative wird offengelegt, weil Χριστός auch namensähnlich gebraucht werden kann.
- issue: Bezug von αὐτοῦ in »über seinem Haus«
  choice: das Pronomen ohne ausdrückliche Auflösung beibehalten
  alternative: über Gottes Haus / über sein eigenes Haus
  rationale: Der Zusammenhang legt Gottes Haus nahe, doch die Formulierung soll die syntaktische und christologische Spannung nicht unnötig auflösen.
- issue: Stärke der Bedingung ἐὰν … κατάσχωμεν
  choice: wenn wir … festhalten
  alternative: sofern wir … festhalten
  rationale: »Wenn« bewahrt die echte Bedingung, ohne eine konfessionelle Deutung von Beharren, Heilsgewissheit oder Abfall in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hausmetapher und die Bedingung des Festhaltens bleiben erhalten. Das aus dem unmittelbaren Kontext ergänzte Prädikat »ist … treu« macht die griechische Ellipse im Deutschen verständlich. Die Wendung »über seinem Haus« ist bewusst leicht formal gehalten, um den möglichen Bezug des Pronomens nicht durch eine explizite Deutung zu verengen.
