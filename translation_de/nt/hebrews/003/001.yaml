source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: de
  text: Daher, heilige Brüder[a], die ihr an einer himmlischen Berufung Anteil habt[b], richtet eure Aufmerksamkeit auf Jesus, den Apostel und Hohepriester unseres Bekenntnisses[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ ist hier die ganze glaubende Gemeinschaft einschließlich der Frauen angesprochen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „die ihr an der himmlischen Berufung teilhabt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „richtet eure Aufmerksamkeit auf Jesus, den Apostel und Hohepriester, zu dem wir uns bekennen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Daher
  rationale: Die Folgerungspartikel knüpft an die vorausgehende Darlegung an, besonders an 2,17–18. „Daher“ bewahrt die logische Folgerung knapp und natürlich.
- source_word: ἀδελφοὶ ἅγιοι
  choice: heilige Brüder
  rationale: Die maskuline Pluralform wird formal bewahrt; sie bezeichnet im Kontext die gesamte glaubende Gemeinschaft. „Heilig“ kennzeichnet die Angesprochenen als Gott Zugehörige.
- source_word: κλήσεως ἐπουρανίου μέτοχοι
  choice: die ihr an einer himmlischen Berufung Anteil habt
  rationale: Die prädikative Partizipationsaussage wird in natürlichem Deutsch als Relativsatz wiedergegeben. „Himmlisch“ lässt sowohl Herkunft als auch Wesen der Berufung offen.
- source_word: κατανοήσατε
  choice: richtet eure Aufmerksamkeit auf
  rationale: Der Aoristimperativ fordert zu konzentrierter, aufmerksamer Betrachtung auf. Die Formulierung gibt diese stärkere Nuance natürlicher wieder als das im Deutschen möglicherweise zu schwache „betrachtet“.
- source_word: ἀπόστολον
  choice: Apostel
  rationale: Der ausdrücklich auf Jesus angewandte Titel bleibt erhalten und bewahrt zugleich den Anklang an den von Gott Gesandten.
- source_word: ἀρχιερέα
  choice: Hohen Priester
  rationale: Die etablierte deutsche Bezeichnung für das kultische Amt ist sachgerecht und trägt das zentrale Motiv des Hebräerbriefs.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: unseres Bekenntnisses
  rationale: Die Genitivverbindung wird formal bewahrt und kann sich auf beide Titel beziehen. „Bekenntnis“ wahrt den gemeinschaftlichen und verbalen Sinn, ohne ihn auf subjektiven Glauben zu verengen.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Übliche deutsche Namensform.
theological_decisions:
- issue: Geschlechtsspezifische Anrede ἀδελφοί
  choice: „Brüder“ im Haupttext, mit Hinweis auf die inklusive Bezugnahme in einer Fußnote
  alternative: „Brüder und Schwestern“ oder „Geschwister“
  rationale: Die grammatisch maskuline Form wird sichtbar gehalten, während die Fußnote verdeutlicht, dass die ganze glaubende Gemeinschaft einschließlich der Frauen angesprochen ist.
- issue: ἀπόστολος als Bezeichnung Jesu
  choice: Den Titel „Apostel“ beibehalten
  alternative: „Gesandter“ oder „der von Gott Gesandte“
  rationale: Der ungewöhnliche, ausdrücklich auf Jesus bezogene Titel wird nicht erklärend aufgelöst; seine theologische und literarische Spannung bleibt erhalten.
- issue: Bezug von τῆς ὁμολογίας ἡμῶν
  choice: „den Apostel und Hohen Priester unseres Bekenntnisses“
  alternative: '„den, zu dem wir uns bekennen: Jesus, den Apostel und Hohen Priester“'
  rationale: Die gewählte Fassung bewahrt die griechische Genitivkonstruktion und lässt ihre genaue semantische Beziehung offen; die mögliche verbale Deutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch einen Relativsatz idiomatisch gestaltet. Die etablierten theologischen Begriffe „Berufung“, „Apostel“, „Hoher Priester“ und „Bekenntnis“ werden beibehalten; echte syntaktisch-semantische Mehrdeutigkeit wird durch Fußnote c kenntlich gemacht.
