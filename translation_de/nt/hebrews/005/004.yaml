source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: de
  text: Und niemand nimmt sich diese Ehre selbst, sondern wird von Gott berufen, wie auch Aaron berufen wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Würde“. Wörtlich steht „die Ehre“; im Zusammenhang geht es um die ehrenvolle priesterliche Würde.'
    reason: lexikalische Alternative und Kontextklärung
lexical_decisions:
- source_word: οὐχ … τις
  choice: niemand
  rationale: Die Verbindung aus Verneinung und dem Indefinitpronomen wird im Deutschen idiomatisch als universale Verneinung wiedergegeben.
- source_word: ἑαυτῷ … λαμβάνει
  choice: nimmt sich selbst
  rationale: Der reflexive Dativ bezeichnet die eigenmächtige Aneignung; „nimmt sich selbst“ bewahrt diesen Gedanken natürlich und knapp.
- source_word: τὴν τιμήν
  choice: diese Würde
  rationale: τιμή bezeichnet hier im Zusammenhang die ehrenvolle Würde des Hohepriesteramts. „Diese“ stellt den Rückbezug her, ohne das Substantiv ausdrücklich als „Amt“ festzulegen.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: wird von Gott berufen
  rationale: Das passive Partizip benennt Gottes Berufung als Gegensatz zur Selbstaneignung. Der finite deutsche Satz ist klar und natürlich, wobei das im Griechischen elliptische Prädikat sinngemäß ergänzt wird.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: so wie auch Aaron
  rationale: Die Vergleichsformel und das einschließende καί werden direkt wiedergegeben; die Berufung Aarons ist aus dem vorangehenden Prädikat zu ergänzen.
theological_decisions:
- issue: Art der priesterlichen Einsetzung
  choice: Die hohepriesterliche Würde wird nicht eigenmächtig ergriffen, sondern beruht auf Gottes Berufung; Aaron dient als Beispiel.
  alternative: τιμή könnte allgemein mit „Ehre“ wiedergegeben werden, ohne den Bezug auf die priesterliche Würde sprachlich anzudeuten.
  rationale: Der unmittelbare Zusammenhang in Hebräer 5,1–5 handelt vom Hohepriester. „Würde“ wahrt diesen Kontext, ohne τιμή überdeutlich als „Amt“ zu übersetzen.
- issue: Elliptische Gegenüberstellung mit καλούμενος
  choice: „sondern wird von Gott berufen“
  alternative: „sondern nur als einer, der von Gott berufen ist“
  rationale: Das Griechische lässt die genaue syntaktische Ergänzung knapp. Die finite Wiedergabe entspricht dem natürlichen deutschen Ausdruck und erhält den zentralen Gegensatz zwischen Selbstaneignung und göttlicher Berufung, ohne ein nicht ausdrücklich vorhandenes „nur“ einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und verständlich; „Würde“ vermeidet sowohl das missverständliche allgemeine „Ehre“ als auch die stärkere Festlegung auf „Amt“.
