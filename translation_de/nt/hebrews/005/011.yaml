id: HEB.5.11
reference: Hebrews 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: de
  text: Darüber haben wir viel zu sagen[a], und es ist schwer zu erklären[b], weil ihr im Hören träge geworden seid[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Über ihn“. Das griechische Relativpronomen kann sich persönlich auf Melchisedek beziehen; wahrscheinlich bezeichnet es hier jedoch umfassender das behandelte Thema.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „schwer auszulegen“ beziehungsweise „schwer darzulegen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich nahe: „träge im Hören“. Gemeint ist, dass sie Unterweisung nur langsam oder ohne die nötige Aufnahmebereitschaft annehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Darüber
  rationale: Das griechische Relativpronomen kann sich auf Melchisedek persönlich oder auf den eben behandelten Gegenstand beziehen. „Darüber“ ist im Deutschen natürlich und nimmt den breiteren Gesprächsgegenstand auf, ohne den Zusammenhang mit Melchisedek zu lösen.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: haben wir viel zu sagen
  rationale: Die idiomatische Umformung gibt den Sinn der wörtlich etwa als „uns ist die Rede umfangreich“ zu beschreibenden Wendung klar und gegenwartsnah wieder.
- source_word: δυσερμήνευτος λέγειν
  choice: es ist schwer zu erklären
  rationale: Die Verbindung bezeichnet etwas, das sich schwer sprachlich auslegen oder verständlich darlegen lässt. „Schwer zu erklären“ ist natürliches Deutsch und bewahrt den Bezug auf die Vermittlung des Themas.
- source_word: ἐπεὶ
  choice: weil
  rationale: Die Konjunktion nennt den Grund dafür, dass die Erklärung schwierig ist; „weil“ drückt diesen Kausalzusammenhang eindeutig aus.
- source_word: νωθροὶ
  choice: träge
  rationale: Das Wort bezeichnet Schwerfälligkeit, Langsamkeit oder mangelnde Reaktionsbereitschaft. „Träge“ bewahrt das Bild und passt zur geistigen Aufnahmebereitschaft.
- source_word: γεγόνατε
  choice: geworden seid
  rationale: Das Perfekt beschreibt einen eingetretenen Zustand. „Geworden seid“ macht deutlich, dass sich diese Trägheit entwickelt hat und nun fortbesteht.
- source_word: ταῖς ἀκοαῖς
  choice: im Hören
  rationale: Die Formulierung bewahrt die Hörmetapher und bezeichnet im Zusammenhang die Bereitschaft, Unterweisung aufzunehmen.
theological_decisions:
- issue: Bezugswort von Περὶ οὗ
  choice: Die Wendung wird primär auf den behandelten Gegenstand bezogen („Darüber“).
  alternative: Sie kann sich persönlich auf Melchisedek beziehen („Über ihn“).
  rationale: Der unmittelbare Kontext nennt Melchisedek, sodass der persönliche Bezug grammatisch möglich bleibt. Zugleich leitet der Satz eine weitergehende Darlegung des gesamten Themas ein. Eine Fußnote bewahrt diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während idiomatische Wendungen die Verständlichkeit sichern. Die Hörmetapher und der durch das Perfekt bezeichnete gewordene Zustand bleiben erhalten.
