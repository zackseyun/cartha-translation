id: HEB.5.10
reference: Hebrews 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσαγορευθεὶς ὑπὸ τοῦ θεοῦ ἀρχιερεὺς κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: de
  text: von Gott als Hohepriester nach der Ordnung Melchisedeks bezeichnet[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Gott Hohepriester genannt“; auch möglich: „von Gott zum Hohepriester eingesetzt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Dies greift Psalm 110,4 auf, wo es heißt: „Du bist Priester in Ewigkeit nach der Ordnung Melchisedeks.“'
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: bezeichnet
  rationale: Das Aorist-Passiv-Partizip bezeichnet hier den göttlichen Akt, Jesus ausdrücklich als Hohepriester zu benennen beziehungsweise auszuweisen. „Bezeichnet“ bewahrt die passive Aussage und vermeidet die stärkere institutionelle Nuance von „eingesetzt“.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: Ὑπό mit Genitiv bezeichnet den Handelnden der Passivkonstruktion. „Von Gott“ gibt den Wortlaut wieder, ohne „dem Vater“ erläuternd hinzuzufügen.
- source_word: ἀρχιερεὺς
  choice: als Hohepriester
  rationale: „Hohepriester“ ist die übliche deutsche Wiedergabe. Nach „bezeichnen“ gibt „als“ die prädikative Funktion natürlich wieder, ohne Jesus als nur einen beliebigen Hohepriester unter anderen darzustellen.
- source_word: κατὰ τὴν τάξιν
  choice: nach der Ordnung
  rationale: Κατά drückt hier Übereinstimmung oder Zuordnung aus. „Nach der Ordnung“ wahrt die enge sprachliche und begriffliche Verbindung zu Psalm 110,4 und zum weiteren Gedankengang des Hebräerbriefs.
- source_word: Μελχισέδεκ
  choice: Melchisedek
  rationale: Dies ist die im modernen deutschen Bibelgebrauch etablierte Umschrift des Eigennamens.
theological_decisions:
- issue: Ob die Wiedergabe eine Einsetzung in ein Amt oder eine göttliche Benennung beziehungsweise Ausweisung ausdrücken soll
  choice: von Gott als Hohepriester … bezeichnet
  alternative: von Gott zum Hohepriester eingesetzt
  rationale: Das Verb kann ein Benennen oder förmliches Bezeichnen ausdrücken, verlangt aber nicht zwingend die stärkere Vorstellung einer Amtseinsetzung. Die Übersetzung lässt offen, wie diese göttliche Bezeichnung zur umfassenderen Christologie des Hebräerbriefs ins Verhältnis zu setzen ist.
- issue: Bedeutung von τάξις in der Verbindung mit Melchisedek
  choice: Ordnung
  alternative: Art / Rang / Weise
  rationale: „Ordnung“ bewahrt die traditions- und kontextprägende Formulierung aus Psalm 110,4, ohne im Vers selbst genauer festzulegen, ob vor allem Art, Rang, Muster oder priesterliche Kategorie gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Partizipialkonstruktion bleibt als syntaktische Fortsetzung des vorhergehenden Verses erhalten. Die etablierte Wendung „nach der Ordnung Melchisedeks“ wahrt zugleich den Psalmbezug und die im Ausdruck τάξις liegende Deutungsoffenheit.
