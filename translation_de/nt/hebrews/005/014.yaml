id: HEB.5.14
reference: Hebrews 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: de
  text: Die feste Nahrung aber ist für die Reifen, deren Wahrnehmungsfähigkeiten durch Übung[a] geschult sind, Gutes und Böses zu unterscheiden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: durch Gewöhnung; oder: durch beständigen Gebrauch.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: zur Unterscheidung von Gutem und Bösem.'
    reason: literal_rendering
lexical_decisions:
- source_word: τελείων
  choice: die Reifen
  rationale: Der substantivierte Ausdruck bezeichnet im Gegensatz zu den Unmündigen in Vers 13 geistlich gereifte Menschen, ohne Sündlosigkeit oder Vollkommenheit zu behaupten.
- source_word: στερεὰ τροφή
  choice: die feste Nahrung
  rationale: Bewahrt das Bild des Gegensatzes zur Milch und ist im Deutschen natürlich verständlich.
- source_word: διὰ τὴν ἕξιν
  choice: durch Übung
  rationale: ἕξις kann Gewohnheit, Übung oder eine durch wiederholten Gebrauch erworbene Haltung bezeichnen. „Durch Übung“ ist knapp und lässt den Gedanken wiederholter Praxis erkennen.
- source_word: τὰ αἰσθητήρια
  choice: deren Wahrnehmungsvermögen
  rationale: Der Ausdruck bezeichnet wörtlich die Sinne beziehungsweise Wahrnehmungsorgane, hier jedoch bildlich die inneren Fähigkeiten zur Unterscheidung. „Wahrnehmungsvermögen“ bewahrt diese Metaphorik besser als eine rein deutende Wiedergabe.
- source_word: γεγυμνασμένα ἐχόντων
  choice: geschult sind
  rationale: Das Perfektpartizip bezeichnet einen durch Training erreichten und fortbestehenden Zustand. Die deutsche finite Form gibt diesen Ergebniszustand natürlich wieder.
- source_word: πρὸς διάκρισιν
  choice: zu unterscheiden
  rationale: Die Konstruktion mit πρός bezeichnet hier Ziel oder Befähigung und verbindet sich im Deutschen unmittelbar mit „Gutes und Böses“.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: Gutes und Böses
  rationale: Gibt das bekannte Gegensatzpaar sachgerecht wieder; das korrelative τε καί wird im Deutschen durch die Paarform hinreichend ausgedrückt.
- source_word: δέ
  choice: aber
  rationale: Markiert den Gegensatz zur Milchnahrung der Unmündigen im vorausgehenden Satz.
theological_decisions:
- issue: Bedeutung von τελείων im Zusammenhang geistlichen Wachstums
  choice: die Reifen
  alternative: die Vollkommenen; die Erwachsenen
  rationale: Der unmittelbare Kontext stellt Gereifte den Unmündigen gegenüber. „Die Reifen“ erhält den Gedanken entwickelter Urteilsfähigkeit, ohne eine Lehre moralischer Sündlosigkeit in den Text einzutragen.
- issue: Reichweite von καλοῦ τε καὶ κακοῦ
  choice: Gutes und Böses zu unterscheiden
  alternative: zwischen Gut und Böse zu unterscheiden
  rationale: Die Formulierung bewahrt die allgemeine moralisch-geistliche Unterscheidung, ohne genauer festzulegen, ob Handlungen, Lehren oder beides gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber für natürliche Lesbarkeit leicht geglättet. „Wahrnehmungsvermögen“ wahrt das Bild der Sinne und vermeidet eine zu stark vorwegnehmende Auslegung als bloßes Urteilsvermögen.
