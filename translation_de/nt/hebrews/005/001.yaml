id: HEB.5.1
reference: Hebrews 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: de
  text: Denn jeder Hohepriester wird aus der Mitte der Menschen genommen und für die Menschen eingesetzt in den Dingen, die Gott betreffen, damit er sowohl Gaben als auch Opfer für Sünden darbringt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: Denn jeder Hohepriester
  rationale: Πᾶς steht distributiv im Singular; „jeder Hohepriester“ bezeichnet allgemein jeden Träger dieses Amtes. γάρ begründet die vorausgehende Aussage und wird natürlich mit „denn“ wiedergegeben.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: wird aus den Menschen genommen
  rationale: Die passive Form und die Herkunft aus der menschlichen Gemeinschaft bleiben erhalten. „Menschen“ gibt ἄνθρωποι im modernen Deutschen geschlechtsübergreifend wieder, ohne die historisch männliche Amtsbezeichnung „Hohepriester“ zu verwischen.
- source_word: ὑπὲρ ἀνθρώπων καθίσταται
  choice: wird für die Menschen eingesetzt
  rationale: ὑπέρ bezeichnet hier Handeln zugunsten beziehungsweise in Vertretung anderer; καθίσταται meint die Einsetzung in ein Amt.
- source_word: τὰ πρὸς τὸν θεόν
  choice: in den Angelegenheiten vor Gott
  rationale: Die Wendung bezeichnet den auf Gott bezogenen Bereich priesterlichen Handelns. „Vor Gott“ wahrt den Beziehungs- und Repräsentationsgedanken, ohne ihn stärker auszudeuten.
- source_word: ἵνα προσφέρῃ
  choice: um … darzubringen
  rationale: Die deutsche Infinitivkonstruktion gibt den Zweck des griechischen ἵνα-Satzes klar und idiomatisch wieder.
- source_word: δῶρά τε καὶ θυσίας
  choice: sowohl Gaben als auch Opfer
  rationale: „Sowohl … als auch“ bildet τε καί ab und bewahrt die Unterscheidung der beiden kultischen Begriffe.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: für Sünden
  rationale: Im Opferzusammenhang bezeichnet die Wendung den Bezug der Darbringung auf Sünden; „für Sünden“ bleibt knapp und lässt die genaue Wirkungsweise unausgedeutet.
theological_decisions:
- issue: Repräsentative Bedeutung von ἀνθρώπων
  choice: Beide Vorkommen werden mit „Menschen“ übersetzt.
  alternative: „Männer“ beziehungsweise „für Männer“
  rationale: ἄνθρωποι bezeichnet hier die Menschheit beziehungsweise Menschen allgemein. Das historisch männliche Priesteramt ist bereits durch „Hohepriester“ eindeutig; „Männer“ würde den Kreis der Vertretenen im Deutschen unnötig auf männliche Personen beschränken.
- issue: Bedeutung von ὑπὲρ ἁμαρτιῶν
  choice: „für Sünden“
  alternative: „zur Sühnung der Sünden“
  rationale: Der griechische Ausdruck nennt den Bezug der Opfer auf Sünden, legt hier aber nicht ausdrücklich eine bestimmte dogmatische Beschreibung ihrer Wirkung fest. Die knappere Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem argumentativen und kultischen Charakter des Ausgangstextes nahe, wird aber durch die finale Infinitivkonstruktion flüssig lesbar.
