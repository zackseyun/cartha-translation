source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: de
  text: Denn jeder, der Milch zu sich nimmt, ist mit dem Wort der Gerechtigkeit[a] nicht vertraut, denn er ist ein Kind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Botschaft von der Gerechtigkeit« oder »im Wort über Gerechtigkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: jeder, der ... zu sich nimmt
  rationale: Die distributive, substantivierte Partizipialkonstruktion wird natürlich und generisch wiedergegeben; »zu sich nimmt« erhält das Bild des Milchtrinkens, ohne eine ausschließliche Ernährung zu unterstellen.
- source_word: γάλακτος
  choice: Milch
  rationale: Das im Zusammenhang aufgebaute Bild wird wörtlich beibehalten.
- source_word: ἄπειρος
  choice: unerfahren
  rationale: Das Wort bezeichnet fehlende Erfahrung oder Vertrautheit, nicht notwendig völlige Unkenntnis. »Unerfahren« verbindet sich im Deutschen natürlich mit »im Wort«.
- source_word: λόγου δικαιοσύνης
  choice: im Wort der Gerechtigkeit
  rationale: Die knappe Genitivverbindung bleibt erhalten, damit offenbleibt, ob das Wort beziehungsweise die Botschaft von Gerechtigkeit handelt oder durch Gerechtigkeit gekennzeichnet ist.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« deckt den möglichen forensischen, ethischen und heilsgeschichtlichen Bedeutungsraum besser ab als eine einengende Umschreibung.
- source_word: νήπιος
  choice: ein unmündiges Kind
  rationale: Im Gegensatz zu den Reifen in Vers 14 bezeichnet νήπιος einen noch nicht mündigen, unreifen Menschen. Die Formulierung passt zugleich zum Milchbild.
- source_word: γάρ ... γάρ
  choice: denn ... denn
  rationale: Beide begründenden Verknüpfungen werden sichtbar erhalten und bilden die argumentative Wiederholung des Griechischen ab.
theological_decisions:
- issue: Bedeutung von λόγος δικαιοσύνης
  choice: Wort der Gerechtigkeit
  alternative: Botschaft von der Gerechtigkeit; Wort über Gerechtigkeit
  rationale: Der Haupttext bewahrt die mehrdeutige Genitivkonstruktion, statt sie als Botschaft über Gerechtigkeit oder als gerecht beschaffenes Wort festzulegen.
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht
  rationale: »Gerechtigkeit« ist im Deutschen der umfassendere und im biblisch-theologischen Zusammenhang üblichere Ausdruck; »Recht« könnte die Bedeutung unnötig auf den juristischen Bereich verengen.
- issue: Generisches grammatisches Maskulinum
  choice: jeder ... er
  alternative: wer ... ist ein unmündiges Kind
  rationale: Die maskuline Singularform der griechischen generischen Aussage bleibt transparent erhalten, ohne den Bezug ausschließlich auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wiedergabe von γάρ mit »denn« bewahrt die markante Begründungsstruktur. »Unmündiges Kind« ist gegenwärtig verständlich und gibt die Reifemetaphorik genauer wieder als das biologisch engere »Säugling«.
