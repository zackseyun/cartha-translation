source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: de
  text: Denn obwohl ihr nach so langer Zeit Lehrer sein solltet, braucht ihr wieder jemanden, der euch die ersten Grundlagen der Aussprüche Gottes lehrt; ihr seid dahin gekommen, Milch zu brauchen und nicht feste Nahrung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: sein müsstet
  rationale: Gibt die erwartete, aufgrund der verstrichenen Zeit bestehende Verpflichtung idiomatisch wieder, ohne sie rein gesetzlich zu formulieren.
- source_word: διδάσκαλοι
  choice: Lehrer
  rationale: Die geläufige und sachlich passende Bezeichnung für Menschen, die andere unterweisen können.
- source_word: διὰ τὸν χρόνον
  choice: der Zeit nach
  rationale: Bezieht sich auf die bereits verstrichene Zeit und die deshalb zu erwartende Reife.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: braucht ihr wieder jemanden, der euch … lehrt
  rationale: Gibt die erneute Notwendigkeit des Unterrichtetwerdens in natürlichem Deutsch wieder; das im Griechischen unausgesprochene Subjekt des Lehrens wird mit »jemanden« verdeutlicht.
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: die Anfangsgründe
  rationale: Bündelt die sprachlich schwerfällige Wendung für grundlegende Inhalte des Anfangsstadiums in einem verständlichen deutschen Ausdruck.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: der Aussprüche Gottes
  rationale: Bewahrt den Sinn göttlicher Äußerungen beziehungsweise Offenbarungsworte und den gehobenen Ton von λόγια, ohne an heidnische Orakelpraxis denken zu lassen.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: ihr seid so weit gekommen, dass ihr … braucht
  rationale: Gibt den perfektischen Gedanken eines erreichten und fortbestehenden Zustands wieder und lässt zugleich den vorwurfsvollen Entwicklungsgedanken erkennen.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: Milch … und keine feste Nahrung
  rationale: Erhält den anschaulichen Gegensatz des griechischen Textes unverändert.
theological_decisions:
- issue: Bildlicher Gegensatz zwischen Milch und fester Nahrung
  choice: Das Bild bleibt ohne erklärende Auflösung im Vers erhalten.
  alternative: Paraphrase als elementare gegenüber weiterführender Lehre.
  rationale: Der Text benennt keinen festen Lehrplan und definiert die beiden Stufen hier nicht näher; eine Ausdeutung würde über den Vers hinausgehen.
- issue: Bedeutung von λόγια τοῦ θεοῦ
  choice: Aussprüche Gottes
  alternative: Worte Gottes; Offenbarungen Gottes
  rationale: »Aussprüche« bewahrt den besonderen Charakter göttlicher Kundgaben, ohne festzulegen, welcher konkrete Umfang heiliger Überlieferung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die relativ formelle Wendung »der Zeit nach« wahrt die knappe Argumentation des Ausgangstextes; »Anfangsgründe« vermeidet eine unnötig sperrige Verdoppelung wie »Grundelemente des Anfangs«. Keine Fußnoten erforderlich.
