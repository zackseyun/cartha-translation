    rationale: Die Formulierung klingt im heutigen Deutsch meist nach einem erreichten Fortschritt. γεγόνατε bezeichnet hier die eingetretene gegenwärtige Lage des Rückfalls bzw. der Unreife. »Ihr seid dahin gekommen, Milch zu brauchen« bewahrt diesen Sinn klarer.
  - severity: low
