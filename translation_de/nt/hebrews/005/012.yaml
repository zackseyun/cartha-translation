    rationale: Beides ist verständlich, doch »nach so langer Zeit« ist moderner und »erste Grundlagen« lässt die in τὰ στοιχεῖα τῆς ἀρχῆς enthaltene Betonung des elementaren Anfangs transparenter erkennen.
