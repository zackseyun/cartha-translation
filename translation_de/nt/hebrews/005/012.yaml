  to: Denn obwohl ihr nach so langer Zeit Lehrer sein solltet, braucht ihr wieder jemanden, der euch die ersten Grundlagen der Aussprüche Gottes lehrt; ihr seid dahin gekommen, Milch zu brauchen und nicht feste Nahrung.
  rationale: Die Revision modernisiert zwei leicht formelhafte bzw. missverständliche Wendungen, ohne den rhetorischen Vorwurf, die Metapher oder die offene Reichweite von »Aussprüche Gottes« auszudeuten. Der adversative Kontrast οὐ στερεᾶς τροφῆς bleibt mit »und nicht feste Nahrung« direkt erhalten.
