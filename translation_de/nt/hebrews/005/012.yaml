  verdict: revise
  source_fidelity: 'Die wesentlichen Beziehungen des griechischen Satzes sind getroffen: die aufgrund der vergangenen Zeit erwartete Lehrbefähigung, der erneute Bedarf an Unterweisung sowie der bildhafte Gegensatz von Milch und fester Nahrung. »So weit gekommen« ist jedoch im Deutschen überwiegend positiv fortschrittsbezogen und bildet γεγόνατε im vorwurfsvollen Kontext weniger klar ab. Die doppelte Anfangsmarkierung in στοιχεῖα τῆς ἀρχῆς sollte zudem zumindest als »erste Grundlagen« erkennbar bleiben.'
  naturalness: »Der Zeit nach« ist verständlich, aber für modernes Standarddeutsch unnötig formelhaft. »Nach so langer Zeit« ist idiomatischer und bringt die vom Kontext vorausgesetzte verstrichene Zeit deutlich zum Ausdruck. »Dahin gekommen, Milch zu brauchen« gibt den resultativen Zustand natürlich wieder, ohne einen positiven Fortschritt anzudeuten.
  terminology: »Lehrer«, »Aussprüche Gottes«, »Milch« und »feste Nahrung« sind sachgerecht. »Die ersten Grundlagen« ist eine natürliche deutsche Entsprechung für die verdichtete und rhetorisch doppelte Wendung στοιχεῖα τῆς ἀρχῆς; sie vermeidet die in der Vorlage enthaltene, im Deutschen aber schwerfällige Wiederholung von »Anfang« und »Grundelementen«. Fußnoten sind nicht erforderlich.
