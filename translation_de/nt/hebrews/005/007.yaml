revisions:
- from: Er[a] hat in den Tagen seines irdischen Lebens Gebete und flehentliche Bitten mit lautem Schreien und Tränen vor den gebracht, der ihn aus dem Tod retten konnte, und wurde wegen seiner Ehrfurcht erhört[b].
  to: Er[a] hat in den Tagen seines Fleisches Gebete und flehentliche Bitten mit lautem Schreien und Tränen dem dargebracht, der ihn aus dem Tod retten konnte[b], und wurde wegen seiner Ehrfurcht erhört[c].
  rationale: Die Revision stellt die konkrete Bedeutung von σάρξ mit „Fleisch“ wieder her, ersetzt die etwas abgeschwächte Umschreibung von προσενέγκας durch „dargebracht“ und trennt die Fußnoten zu den zwei unterschiedlichen Auslegungsfragen. Die Mehrdeutigkeit von „aus dem Tod retten“ und die lexikalische Alternative zu εὐλάβεια bleiben ausdrücklich gewahrt.
