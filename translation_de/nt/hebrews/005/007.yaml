  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: de
  text: Er[a] hat in den Tagen seines Fleisches Gebete und flehentliche Bitten mit lautem Schreien und Tränen dem dargebracht, der ihn aus dem Tod retten konnte[b], und wurde wegen seiner Ehrfurcht erhört[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird aus Vers 5 fortgeführt.
    reason: contextual_clarity
  - marker: b
    text: „Aus dem Tod retten“ kann auch im Sinn von „vor dem Tod retten“ verstanden werden; die Formulierung kann aber ebenso auf Befreiung aus dem Tod durch die Auferstehung weisen.
    reason: alternative_reading
  - marker: c
    text: „Wegen seiner Ehrfurcht“ kann auch mit „wegen seiner Gottesfurcht“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: in den Tagen seines irdischen Lebens
  rationale: Die Wendung gibt den Bezug auf Jesu leibliches, sterbliches Erdenleben natürlich wieder. Das wörtliche „in den Tagen seines Fleisches“ wäre im heutigen Deutschen missverständlich und weniger idiomatisch.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: Gebete und flehentliche Bitten
  rationale: „Gebete“ gibt δεήσεις allgemein wieder; „flehentliche Bitten“ bewahrt die gesteigerte Dringlichkeit von ἱκετηρίας und unterscheidet beide Begriffe verständlich.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: vor den, der ihn aus dem Tod retten konnte
  rationale: „Vor den ... gebracht“ ist im Deutschen eine natürliche Verbindung mit Gebeten. „Aus dem Tod retten“ hält eher als „vor dem Tod bewahren“ offen, ob Abwendung des Sterbens oder Befreiung durch Auferstehung gemeint ist.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: mit lautem Schreien und Tränen
  rationale: Die Formulierung folgt dem Singular κραυγῆς und vermittelt die starke Intensität ohne altertümliche Sprache.
- source_word: προσενέγκας
  choice: vor ... gebracht
  rationale: Das Verb wird natürlich wiedergegeben und behält im Kontext des Hebräerbriefs einen möglichen Darbringungsanklang, ohne die Gebete ausdrücklich als Opfer zu deuten.
- source_word: εἰσακουσθεὶς
  choice: wurde ... erhört
  rationale: „Erhört“ drückt stärker als bloßes „gehört“ aus, dass die Bitten wohlwollend aufgenommen wurden, ohne die konkrete Gestalt der Antwort festzulegen.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: wegen seiner Ehrfurcht
  rationale: „Ehrfurcht“ entspricht dem Bedeutungsfeld von εὐλάβεια präzise und knapp. Es vermeidet die interpretative Erweiterung „ehrfürchtige Unterordnung“; die mögliche Nuance „Gottesfurcht“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von ἀπὸ τῆς εὐλαβείας in Bezug auf Jesus
  choice: wegen seiner Ehrfurcht
  alternative: wegen seiner Gottesfurcht
  rationale: Die Hauptfassung wahrt die ehrfürchtige Haltung Jesu, ohne eine unangebrachte Ängstlichkeit oder eine weitergehende Deutung als Unterordnung ausdrücklich einzutragen. Die lexikalisch mögliche Alternative wird vermerkt.
- issue: Bedeutungsumfang von σῴζειν αὐτὸν ἐκ θανάτου
  choice: ihn aus dem Tod retten
  alternative: ihn vor dem Tod retten
  rationale: Das griechische ἐκ θανάτου kann Rettung vor dem Sterben oder Befreiung aus dem Tod bezeichnen. Die Hauptfassung lässt insbesondere die Auferstehungsdimension offen; die Fußnote nennt die andere mögliche Auffassung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt als Fortsetzung des vorigen Verses erkennbar. „Irdisches Leben“ vermeidet die im heutigen Deutsch schwer verständliche wörtliche Wendung „Tage seines Fleisches“; „flehentliche Bitten“, „lautes Schreien“ und „erhört“ bewahren Dringlichkeit und feierlichen Ton.
