source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: de
  text: 'So hat auch der Messias sich nicht selbst die Ehre gegeben, Hohepriester zu werden[a], sondern der, der zu ihm sprach: »Du bist mein Sohn; heute habe ich dich gezeugt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich nicht selbst verherrlicht, um Hohepriester zu werden«; das griechische Verb kann »ehren« oder »verherrlichen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Zitat aus Psalm 2,7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: So hat auch
  rationale: Knüpft vergleichend und folgernd an die zuvor beschriebene Berufung zum Priestertum an und klingt im Deutschen natürlich.
- source_word: ὁ Χριστὸς
  choice: der Messias
  rationale: Χριστός hat hier im Zusammenhang der göttlichen Einsetzung in ein Amt erkennbar Titelfunktion; »Messias« macht diese Bedeutung transparent.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: sich nicht selbst die Ehre genommen
  rationale: Die idiomatische deutsche Wendung gibt δοξάζω im Sinn von ehren bzw. mit Würde ausstatten wieder und passt zum Gegensatz zwischen eigenmächtiger Beanspruchung und göttlicher Berufung.
- source_word: γενηθῆναι ἀρχιερέα
  choice: Hoher Priester zu werden
  rationale: Der Infinitiv bezeichnet das Eintreten in die Stellung des Hohen Priesters. Die Amtsbezeichnung wird im Deutschen substantivisch großgeschrieben.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: sondern der, der zu ihm sprach
  rationale: Bewahrt das substantivierte Partizip und lässt die handelnde Person wie im Griechischen unausgesprochen; aus dem Zitat ergibt sich, dass Gott gemeint ist.
- source_word: Υἱός μου εἶ σύ
  choice: Du bist mein Sohn
  rationale: Natürliches deutsches Wortgefüge, das die direkte feierliche Anrede klar wiedergibt.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: heute habe ich dich gezeugt
  rationale: »Gezeugt« bildet γεννάω präzise ab und bewahrt die intertextuelle sowie theologische Offenheit des Zitats aus Psalm 2,7.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: der Christus
  rationale: Im Argument über die Einsetzung in das hohepriesterliche Amt ist der Titelcharakter aktiv. »Messias« vermittelt diesen Titelcharakter heutigen Lesern unmittelbar.
- issue: Bedeutung von »heute habe ich dich gezeugt«
  choice: Das Zitat ohne deutende Erweiterung beibehalten
  alternative: Eine Paraphrase mit ausdrücklichem Bezug auf Inthronisation, Auferstehung oder ewige Zeugung
  rationale: Der Wortlaut von Psalm 2,7 soll weder auf ein einzelnes theologisches Deutungsmodell verengt noch durch eine erklärende Paraphrase erweitert werden.
- issue: Wer den Messias zum Hohen Priester eingesetzt hat
  choice: Die Ellipse des griechischen Satzes bewahren
  alternative: »sondern Gott verlieh ihm diese Ehre«
  rationale: Der griechische Text nennt den Handelnden nur als »den, der zu ihm sprach«. Die Übersetzung bewahrt diese Form und vermeidet eine zwar naheliegende, aber ausdrücklicher als die Vorlage formulierte Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung »sich die Ehre nehmen« verdeutlicht die eigenmächtige Beanspruchung, ohne die göttliche Einsetzung auszudeuten. Die Psalmformulierung bleibt bewusst eng am griechischen Wortlaut.
