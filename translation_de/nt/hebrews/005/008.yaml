  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: de
  text: Obwohl er Sohn war[a], lernte er aus dem, was er litt, Gehorsam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Obwohl er der Sohn war.“ Im Griechischen steht einfach „Sohn“ ohne Artikel; im Deutschen ist die artikellose prädikative Form natürlich, während „der Sohn“ die im Zusammenhang erkennbare Bestimmtheit stärker ausdrückt.'
    reason: alternative_reading
