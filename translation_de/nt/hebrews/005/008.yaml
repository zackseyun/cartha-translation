lexical_decisions:
- source_word: καίπερ
  choice: obwohl
  rationale: 'Die konzessive Partikel stellt den Gegensatz heraus: Trotz seiner Stellung als Sohn lernte er durch Leiden Gehorsam.'
- source_word: ὢν υἱός
  choice: er Sohn war
  rationale: Die finite Formulierung ist im Deutschen natürlich. Das prädikative „Sohn“ kommt wie im Griechischen ohne Artikel aus und bewahrt die christologische Aussage, ohne eine im Ausgangstext nicht ausdrücklich markierte Bestimmtheit einzutragen.
- source_word: ἔμαθεν
  choice: lernte
  rationale: Die direkte Wiedergabe bewahrt die Aussage eines wirklichen, erfahrungsbezogenen Lernens und schwächt die Spannung des Textes nicht ab.
- source_word: ἀφ’ ὧν
  choice: an dem, was
  rationale: Die Wendung bezeichnet den Erfahrungsgrund beziehungsweise die Quelle des Lernens. „An dem, was“ ist idiomatisches Deutsch und hält den Bezug zu den erlittenen Dingen fest.
- source_word: ἔπαθεν
  choice: er litt
  rationale: Die schlichte Verbform gibt das tatsächlich erduldete Leiden präzise und eindringlich wieder.
- source_word: τὴν ὑπακοήν
  choice: Gehorsam
  rationale: Bei diesem Abstraktum lässt das Deutsche den griechischen Artikel natürlicherweise unübersetzt. „Gehorsam“ bezeichnet das gehorsame Eingehen auf Gottes Willen.
theological_decisions:
- issue: Das Sohnsein Christi im Verhältnis zu seinem Lernen
  choice: Obwohl er Sohn war
  alternative: Obwohl er der Sohn war
  rationale: Die Übersetzung hält Sohnsein und wirkliches Lernen zusammen. Das artikellose prädikative „Sohn“ entspricht dem griechischen Wortlaut und ist im Deutschen natürlich; die Alternative kann die im Kontext bestimmte christologische Identität stärker hervorheben.
- issue: Ob „lernte … Gehorsam“ früheren Ungehorsam voraussetzt
  choice: Die direkte Formulierung „lernte … Gehorsam“ bleibt erhalten.
  alternative: Er erfuhr, was Gehorsam kostet.
  rationale: Der griechische Text spricht ausdrücklich vom Lernen des Gehorsams. Er beschreibt Lernen durch erlittene Erfahrung und sagt nicht, dass vorher Ungehorsam oder ein moralischer Mangel bestanden habe; eine erklärende Paraphrase würde die Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzgestalt folgt der Dichte des griechischen Textes; „an dem, was er litt“ ist bewusst gehoben, aber allgemein verständlich. Das abschließende Komma wahrt den vom Nutzer vorgegebenen Versanschluss.
