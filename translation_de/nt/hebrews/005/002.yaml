id: HEB.5.2
reference: Hebrews 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: de
  text: Er kann mit den Unwissenden und Irrenden[a] nachsichtig umgehen, da auch er selbst von Schwachheit umgeben ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Irregeführten“. Das griechische Partizip kann auch passiv verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Schwachheit umgeben ist“; das Bild kann auch im Sinn von „mit Schwachheit bekleidet ist“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: nachsichtig umgehen
  rationale: Das Verb bezeichnet eine maßvolle, beherrschte Haltung zwischen Härte und Gleichgültigkeit. „Nachsichtig umgehen“ gibt dies in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: δυνάμενος
  choice: Er kann
  rationale: Das Partizip beschreibt die Fähigkeit des Hohenpriesters. Ein deutscher Hauptsatz ist im Zusammenhang natürlich und bewahrt den Sinn der fortdauernden Befähigung.
- source_word: τοῖς ἀγνοοῦσι
  choice: mit den Unwissenden
  rationale: Die substantivierte Partizipialform bezeichnet Menschen, die aus Unwissenheit handeln. Die Wiedergabe bleibt allgemein und engt den Ausdruck nicht auf eine technische Opferkategorie ein.
- source_word: πλανωμένοις
  choice: Irrenden
  rationale: Die Form kann Menschen bezeichnen, die irregehen, und zugleich eine passive Nuance („irregeführt werden“) tragen. „Irrenden“ ist knapp und wahrt die offene Aussage; die passive Möglichkeit wird in der Fußnote genannt.
- source_word: ἐπεὶ
  choice: da
  rationale: Die Konjunktion führt den Grund dafür an, weshalb der Priester nachsichtig handeln kann.
- source_word: καὶ αὐτὸς
  choice: auch er selbst
  rationale: Die Formulierung erhält sowohl den additiven Sinn von καί als auch die persönliche Hervorhebung durch αὐτός.
- source_word: περίκειται ἀσθένειαν
  choice: von Schwachheit umgeben ist
  rationale: Die relativ bildnahe Wiedergabe bewahrt die Vorstellung, dass Schwachheit den Priester umfassend umgibt. „Schwachheit“ lässt körperliche, menschliche und moralische Gebrechlichkeit offen.
theological_decisions:
- issue: Art des Versagens bei ἀγνοοῦσι καὶ πλανωμένοις
  choice: Menschen, die unwissend sind und irregehen, ohne Beschränkung auf eine technische Opferkategorie
  alternative: Ausschließlich unbeabsichtigte Sünden im levitischen Opfersystem
  rationale: Der priesterliche Zusammenhang lässt eine Anspielung auf alttestamentliche Kategorien erkennen, doch die griechische Formulierung ist weiter. Die Übersetzung behält diese Breite bei.
- issue: Bedeutung von ἀσθένεια beim Hohenpriester
  choice: Schwachheit in einem umfassenden Sinn menschlicher Gebrechlichkeit
  alternative: Ausschließlich körperliche oder ausschließlich moralische Schwäche
  rationale: Der Ausdruck legt hier keine eindeutige Einschränkung fest. „Schwachheit“ bewahrt die theologische Spannung und die semantische Breite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nachsichtig umgehen“ ist verständlich und gibt die maßvolle Haltung des griechischen Verbs wieder. Die knappe Paarung „Unwissenden und Irrenden“ wahrt den parallelen Aufbau; die passive Nuance des zweiten Ausdrucks steht in der Fußnote.
