id: HEB.5.6
reference: Hebrews 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: de
  text: 'wie er auch an einer anderen Stelle sagt: „Du bist Priester in Ewigkeit nach der Ordnung Melchisedeks.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς καὶ
  choice: wie er auch
  rationale: Gibt die vergleichende Verknüpfung mit dem vorangehenden Schriftwort natürlich wieder und bewahrt das verstärkende καί („auch“).
- source_word: ἐν ἑτέρῳ
  choice: an einer anderen Stelle
  rationale: Die elliptische griechische Wendung setzt sinngemäß eine andere Schriftstelle voraus; die Ergänzung „Stelle“ ist im Deutschen idiomatisch und präzise.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt den Charakter der Schrift als gegenwärtig redendes Wort; das im Zusammenhang erschließbare Subjekt bleibt unausgesprochen.
- source_word: ἱερεὺς
  choice: Priester
  rationale: Die artikellose prädikative Aussage wird im Deutschen nach „sein“ natürlich ohne unbestimmten Artikel formuliert.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Eine würdige, geläufige Wiedergabe für unbegrenzte Dauer, die zugleich den Ton des Psalmzitats wahrt.
- source_word: κατὰ τὴν τάξιν
  choice: nach der Ordnung
  rationale: Bewahrt die Bedeutung einer bestimmten priesterlichen Ordnung oder Zuordnung und entspricht der etablierten deutschen Formulierung des Zitats.
- source_word: Μελχισέδεκ
  choice: Melchisedek
  rationale: Verwendet die im modernen deutschen Bibelgebrauch übliche Umschrift des Eigennamens.
theological_decisions:
- issue: Subjekt der Einleitungsformel λέγει
  choice: „er … sagt“, wobei Gott als im Zusammenhang erschließbarer Sprecher unausgesprochen bleibt
  alternative: 'unpersönlich: „es heißt“'
  rationale: Der Hebräerbrief stellt Schriftworte häufig als gegenwärtiges Reden Gottes dar. Die persönliche Form bewahrt diese rhetorische und theologische Spannung, ohne „Gott“ ausdrücklich in den Text einzufügen.
- issue: Bedeutung von τάξις im Melchisedek-Zitat
  choice: „Ordnung“ als priesterliche Ordnung oder Zuordnung
  alternative: „Art“ oder „Vorbild“
  rationale: „Ordnung“ erhält die für die Argumentation des Hebräerbriefs wichtige Verbindung zu einem besonderen, mit Melchisedek verbundenen Priestertum, ohne dessen genaue Beschaffenheit über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Zitatanschluss, klingt aber natürlich. „In Ewigkeit“ und „nach der Ordnung Melchisedeks“ wahren den feierlichen Schriftton ohne altertümliche Formen.
