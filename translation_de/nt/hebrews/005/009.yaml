  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: de
  text: Und zur Vollendung gebracht[a], wurde er für alle, die ihm gehorchen, zum Urheber[b] des ewigen Heils,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „vollendet“ oder „vollkommen gemacht“. Der Ausdruck kann im Hebräerbrief die Vollendung beziehungsweise das Erreichen des Ziels einer priesterlichen und erlösenden Aufgabe bezeichnen, nicht eine moralische Verbesserung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „zur Ursache“ oder „zur Quelle“ des ewigen Heils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τελειωθεὶς
  choice: als er zur Vollendung gebracht worden war
  rationale: Das Aorist-Passivpartizip bezeichnet hier wahrscheinlich das Erreichen des vorgesehenen Ziels beziehungsweise die vollständige Erfüllung seiner priesterlichen und rettenden Aufgabe, nicht eine moralische Verbesserung. Die Formulierung ist im Deutschen verständlich und bewahrt diesen zielbezogenen Sinn.
- source_word: ἐγένετο
  choice: wurde ... zum
  rationale: γίνομαι bezeichnet hier den Eintritt in eine daraus folgende Stellung oder Funktion. Die deutsche Wendung „wurde ... zum Urheber“ gibt dies idiomatisch wieder.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: für alle, die ihm gehorchen
  rationale: Die Dativgruppe bezeichnet die Empfänger beziehungsweise Nutznießer. „Ihm gehorchen“ bewahrt die ausdrückliche Bedeutung von ὑπακούω, ohne sie auf bloßes Hören oder eine bestimmte dogmatische Deutung zu verengen.
- source_word: αἴτιος
  choice: Urheber
  rationale: αἴτιος bezeichnet den, der etwas bewirkt oder verursacht. „Urheber“ drückt personale Verursachung würdig und prägnant aus; mögliche Alternativen werden in der Fußnote genannt.
- source_word: σωτηρίας αἰωνίου
  choice: des ewigen Heils
  rationale: „Heil“ entspricht dem theologischen Bedeutungsgehalt von σωτηρία im Hebräerbrief; αἰώνιος wird natürlich mit „ewig“ wiedergegeben. Der bestimmte Artikel ist im Deutschen für diese Genitivverbindung idiomatisch.
- source_word: καὶ
  choice: Und
  rationale: Die Konjunktion verbindet den Satz schlicht mit dem vorausgehenden Gedankengang, ohne die genaue logische Beziehung stärker auszudeuten.
theological_decisions:
- issue: Christologischer Sinn von τελειωθεὶς
  choice: „zur Vollendung gebracht“ als ziel- und aufgabenbezogene Vollendung
  alternative: „vollkommen gemacht“ oder „vollendet“
  rationale: Die Übersetzung vermeidet den irreführenden Eindruck, Jesus sei zuvor moralisch mangelhaft gewesen, und bewahrt zugleich die Aussage des Textes, dass er an das Ziel seiner priesterlichen und erlösenden Aufgabe gebracht wurde.
- issue: Umfang und Bedingung in πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: „für alle, die ihm gehorchen“
  alternative: „für alle, die auf ihn hören“
  rationale: Das ausdrückliche Gehorsamsmotiv des griechischen Textes bleibt stehen und wird weder zu „glauben“ abgeschwächt noch in ein konfessionelles Lehrsystem eingeordnet.
- issue: Kausale Rolle in αἴτιος σωτηρίας
  choice: „Urheber des ewigen Heils“
  alternative: „Ursache“ oder „Quelle des ewigen Heils“
  rationale: „Urheber“ bezeichnet Christus als den personal Handelnden, der das Heil bewirkt, ohne die genaue Art der Kausalität über den griechischen Ausdruck hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zur Vollendung gebracht“ ist etwas gehobener, bleibt jedoch gut verständlich und verhindert ein naheliegendes moralisches Missverständnis. Die Satzstellung folgt natürlichem Deutsch und hält zugleich den Zusammenhang von Vollendung, daraus folgender Rolle und den Empfängern des Heils sichtbar.
