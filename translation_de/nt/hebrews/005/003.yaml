source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: de
  text: Und deshalb[a] muss er, wie für das Volk, so auch für sich selbst Opfer für Sünden darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegen ihr“. Das feminine Pronomen bezieht sich wahrscheinlich auf die im vorigen Vers genannte Schwachheit des Hohepriesters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: deshalb
  rationale: Gibt die kausale Bedeutung von διά mit Akkusativ natürlich wieder, ohne den Bezug im Haupttext ausdrücklich festzulegen. Das feminine Pronomen weist am ehesten auf die im vorigen Vers genannte Schwachheit zurück.
- source_word: ὀφείλει
  choice: muss
  rationale: Bezeichnet hier eine bindende Verpflichtung des Hohepriesters, nicht lediglich eine Empfehlung.
- source_word: καθὼς ... οὕτως καὶ
  choice: sowohl ... als auch
  rationale: Gibt die parallele Zuordnung von Volk und Hohepriester in natürlichem modernem Deutsch wieder.
- source_word: τοῦ λαοῦ
  choice: des Volkes
  rationale: Bewahrt die knappe Bezeichnung des griechischen Textes; im Zusammenhang ist das Bundesvolk gemeint.
- source_word: αὑτοῦ
  choice: seine eigenen
  rationale: Macht den reflexiven Gegensatz zu den Sünden des Volkes im Deutschen eindeutig.
- source_word: προσφέρειν
  choice: Opfer darbringen
  rationale: „Darbringen“ entspricht dem kultischen Zusammenhang. „Opfer“ ist im Griechischen nicht als ausdrückliches Objekt vorhanden, wird aber durch den priesterlich-sakrificialen Kontext vorausgesetzt und ist für idiomatisches Deutsch hilfreich.
- source_word: περὶ ἁμαρτιῶν
  choice: für die Sünden
  rationale: Gibt den Bezug der Darbringung auf Sünden knapp und ohne die stärker deutende Festlegung auf eine bestimmte Opferart wieder.
theological_decisions:
- issue: Bezug von δι’ αὐτὴν
  choice: Der Haupttext lässt den Bezug mit „deshalb“ unausgesprochen; die Fußnote nennt die Schwachheit des Hohepriesters als wahrscheinlichsten Bezug.
  alternative: Die Schwachheit bereits im Haupttext ausdrücklich nennen oder die Wendung allgemein auf seine Lage beziehungsweise sein Amt beziehen.
  rationale: Das feminine Pronomen bezieht sich am naheliegendsten auf ἀσθένεια („Schwachheit“) in Hebräer 5,2. Da der Vers selbst das Bezugswort jedoch nicht wiederholt, wahrt die Übersetzung die grammatische Indirektheit.
- issue: Ergänzung eines Objekts bei προσφέρειν
  choice: „Opfer darbringen“
  alternative: Nur „darbringen“ und damit das im Griechischen unausgesprochene Objekt auch im Deutschen offenlassen.
  rationale: Der priesterliche Opferkontext macht die Handlung eindeutig. Die Ergänzung sorgt für verständliches, idiomatisches Deutsch, ohne die Opferart als „Sündopfer“ festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur stellt Volk und Hohepriester klar einander gegenüber; „muss“ drückt die bindende kultische Verpflichtung verständlich aus.
