  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: de
  text: Doch derjenige, der nicht aus ihrer Abstammungslinie stammt, hat von Abraham den Zehnten empfangen[a] und den gesegnet, der die Verheißungen hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat von Abraham den Zehnten genommen“. Das griechische Verb bezeichnet das Nehmen oder Empfangen eines Zehnten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der die Verheißungen besaß“. Im Griechischen steht ein Partizip im Präsens; im Deutschen kann mit Blick auf Abraham auch die Vergangenheit verwendet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Doch derjenige, dessen Abstammung nicht auf sie zurückgeführt wird
  rationale: Die substantivierte passive Partizipialform bezeichnet Melchisedek und stellt ihn der levitischen Abstammungslinie gegenüber. Die Formulierung bewahrt den passiven und genealogischen Sinn, ohne Aussagen über Melchisedeks Wesen oder Ursprung hinzuzufügen.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: hat von Abraham den Zehnten genommen
  rationale: Das Perfekt wird im Deutschen mit dem Perfekt wiedergegeben. „Den Zehnten nehmen“ macht sowohl den Anteil als auch Abraham als Geber deutlich; eine mögliche neutralere Wiedergabe mit „empfangen“ steht in der Fußnote.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: der die Verheißungen besitzt
  rationale: Das griechische Präsenspartizip wird als Präsens wiedergegeben. Der Plural „die Verheißungen“ bleibt erhalten und bezeichnet die Abraham gegebenen Zusagen.
- source_word: εὐλόγηκεν
  choice: hat … gesegnet
  rationale: Das deutsche Perfekt entspricht der vollendeten Handlung, deren Bedeutung für die gegenwärtige Argumentation des Hebräerbriefs fortbesteht.
theological_decisions:
- issue: Genealogische Abgrenzung Melchisedeks von Levi
  choice: Die Aussage wird als fehlende genealogische Herleitung aus der levitischen Linie wiedergegeben.
  alternative: „der nicht von ihnen abstammt“
  rationale: Der Zusammenhang behandelt die priesterliche Berechtigung außerhalb der levitischen Genealogie. Die gewählte Formulierung vermeidet eine weitergehende ontologische Aussage über Melchisedek.
- issue: Zeitbezug von Abrahams Besitz der Verheißungen
  choice: „der die Verheißungen besitzt“
  alternative: „der die Verheißungen besaß“
  rationale: Das Präsens bewahrt die Form des griechischen Partizips und lässt die fortdauernde Geltung der Verheißungen anklingen, ohne die natürlichere erzählerische Vergangenheitsform auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Der Zehnte“ ist ein geläufiger biblischer Ausdruck; die Satzstruktur bleibt trotz der argumentativen Dichte gut verständlich.
