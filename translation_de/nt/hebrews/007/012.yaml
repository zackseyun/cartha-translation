  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: de
  text: Denn wenn das Priestertum verändert wird, tritt notwendigerweise auch eine Änderung des Gesetzes ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετατιθεμένης
  choice: geändert wird
  rationale: Das Partizip im Genitivus absolutus bezeichnet hier den Wechsel von einer priesterlichen Ordnung zu einer anderen. „Geändert wird“ ist natürlich und lässt offen, ob der Vorgang als Änderung, Übertragung oder Ablösung näher zu bestimmen ist.
- source_word: ἱερωσύνης
  choice: Priestertum
  rationale: Gemeint ist die Institution beziehungsweise Ordnung des priesterlichen Amtes, nicht lediglich die Tätigkeit eines einzelnen Priesters.
- source_word: ἐξ ἀνάγκης
  choice: muss notwendigerweise
  rationale: Die Wendung drückt eine sachlogische Notwendigkeit aus. Die Verbindung mit „muss“ gibt diese Folgerung im Deutschen klar und idiomatisch wieder.
- source_word: νόμου
  choice: das Gesetz
  rationale: Im unmittelbaren Zusammenhang geht es um die gesetzliche Ordnung, welche das levitische Priestertum regelt, und damit konkret um das mosaische Gesetz. Der fehlende griechische Artikel schließt diese bestimmte Bedeutung nicht aus.
- source_word: μετάθεσις
  choice: geändert werden
  rationale: Das Substantiv ist mit μετατιθεμένης verwandt und bezeichnet die entsprechende Änderung des Gesetzes. Die parallele Formulierung macht den Gedankengang im Deutschen deutlich.
- source_word: γίνεται
  choice: muss … geändert werden
  rationale: γίνεται bezeichnet das Eintreten der notwendigen Folge. Zusammen mit ἐξ ἀνάγκης wird dies im Deutschen natürlich durch eine Konstruktion mit „muss“ ausgedrückt.
- source_word: καὶ
  choice: auch
  rationale: Kennzeichnet die Gesetzesänderung als notwendige Entsprechung zur Änderung des Priestertums.
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Gedankengang ein und wahrt den argumentativen Stil des Hebräerbriefs.
theological_decisions:
- issue: Reichweite von νόμος im Verhältnis zum Priestertum
  choice: „das Gesetz“ als kontextuell bestimmter Verweis auf die gesetzliche Ordnung des mosaischen Bundes
  alternative: „Gesetz“ ohne Artikel, mit etwas allgemeinerem Bezug auf die das Priestertum regelnde Rechtsordnung
  rationale: Der Zusammenhang handelt vom levitischen Priestertum, das durch das mosaische Gesetz eingesetzt und geregelt wird. Obwohl νόμου im Griechischen artikellos steht, kann es qualitativ beziehungsweise kontextuell bestimmt gebraucht sein. Die Fußnote bewahrt die allgemeinere Übersetzungsmöglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer argumentativer Satzführung. Die Wiederholung von „geändert“ bildet die Wortverwandtschaft von μετατίθημι und μετάθεσις verständlich ab; die Modalform mit „muss notwendigerweise“ verdeutlicht die logische Folgerung.
