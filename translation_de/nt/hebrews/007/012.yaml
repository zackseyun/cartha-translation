revisions:
- from: Denn wenn das Priestertum geändert wird, muss notwendigerweise auch das Gesetz geändert werden.[a]
  to: Denn wenn das Priestertum verändert wird, tritt notwendigerweise auch eine Änderung des Gesetzes ein.
  rationale: Die Revision gibt den Genitivus absolutus mit „wenn“ wieder, bewahrt die logische Notwendigkeit von ἐξ ἀνάγκης durch „notwendigerweise“ und gibt μετάθεσις/γίνεται als „eine Änderung ... tritt ein“ wieder. „Gesetz“ bleibt im Kontext offen genug, um die mosaische Rechtsordnung einzuschließen, ohne sie über den Wortlaut hinaus zu erläutern.
