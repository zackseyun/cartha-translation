  source_fidelity: Die Aussage wird grundsätzlich richtig wiedergegeben. Die Konstruktion „muss ... geändert werden“ verdichtet jedoch das griechische ἐξ ἀνάγκης καὶ ... γίνεται zu einer deutschen Modalpassivkonstruktion und gibt das eintretende Ereignis (γίνεται) sowie das Substantiv μετάθεσις weniger unmittelbar wieder.
  naturalness: „Muss notwendigerweise“ ist im modernen Standarddeutsch redundant. „Tritt notwendigerweise ... ein“ ist klar, idiomatisch und bewahrt den argumentativen Ton.
  terminology: „Priestertum“ und „Gesetz“ sind im Kontext treffend. „Änderung“ bildet die Wortverwandtschaft von μετατιθεμένης und μετάθεσις angemessen ab, ohne den Vorgang als vollständige Abschaffung festzulegen.
