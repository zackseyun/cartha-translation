    rationale: 'Der Entwurf macht aus „eine Änderung des Gesetzes tritt notwendigerweise ein“: „das Gesetz muss notwendigerweise geändert werden“. Das ist inhaltlich nahe, verschiebt aber die griechische Ausdrucksweise und lässt die substantivische Entsprechung zu μετάθεσις weniger deutlich erkennen.'
  - severity: low
    issue: Redundanz in „muss notwendigerweise“
    rationale: Sowohl „muss“ als auch „notwendigerweise“ markieren die logische Notwendigkeit; die Kombination wirkt stilistisch unnötig schwer.
  - severity: low
    issue: Fußnote bietet keine für den Haupttext relevante alternative Lesart
    rationale: Die vorgeschlagenen Varianten paraphrasieren im Wesentlichen dieselbe Aussage. Die kontextuelle Einordnung von νόμος als mosaisches Gesetz ist sinnvoll, muss aber nicht als alternative Übersetzung ausgegeben werden; die griechische Artikellosigkeit begründet hier keine eigenständige textliche Mehrdeutigkeit, die eine Fußnote erfordert.
