source:
  edition: SBLGNT
  text: Καὶ καθ’ ὅσον οὐ χωρὶς ὁρκωμοσίας (οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: de
  text: Und insofern dies nicht ohne einen Eid geschah (denn jene sind ohne Eid Priester geworden,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne eidliche Bestätigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der Anschluss an den vorausgehenden Gedankengang wird ausdrücklich bewahrt.
- source_word: καθ’ ὅσον
  choice: insofern
  rationale: Die Wendung führt den Gesichtspunkt beziehungsweise Grund für das folgende Argument ein und wahrt den gehobenen argumentativen Ton.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: nicht ohne einen Eid
  rationale: Die emphatische Verneinung und die Bedeutung von χωρίς mit Genitiv werden knapp und natürlich wiedergegeben; ὁρκωμοσία bezeichnet hier die eidliche Bestätigung.
- source_word: οἱ μὲν γὰρ
  choice: denn jene
  rationale: „Denn“ gibt die erklärende Funktion von γάρ wieder; „jene“ bezeichnet die zuvor behandelten levitischen Priester. Die durch μέν vorbereitete Gegenüberstellung bleibt durch den offenen Satzbau für Vers 21 erhalten.
- source_word: χωρὶς ὁρκωμοσίας
  choice: ohne Eid
  rationale: Die wiederholte Wendung wird inhaltlich konsistent und im Deutschen idiomatisch wiedergegeben.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: sind … Priester geworden
  rationale: Die periphrastische Konstruktion bezeichnet einen vollzogenen Eintritt in das Priesteramt mit fortbestehendem Ergebnis.
theological_decisions:
- issue: Bezug der Gegenüberstellung zwischen den bisherigen Priestern und dem durch einen Eid eingesetzten Priester
  choice: „jene“ verweist auf die im unmittelbaren Zusammenhang behandelten levitischen Priester; ihre Einsetzung ohne Eid wird der in Vers 21 folgenden Einsetzung Jesu mit Eid gegenübergestellt.
  alternative: Eine ausdrücklich ausgeweitete Gegenüberstellung zwischen dem alten Bund insgesamt und dem ewigen Priestertum des Messias.
  rationale: Der unmittelbare Kontext trägt die engere Referenz. Der Vers wird nicht mit weitergehenden dogmatischen Folgerungen angereichert, und die mit μέν begonnene, erst im Folgevers abgeschlossene Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wie im griechischen Ausgangstext syntaktisch offen, da die mit μέν vorbereitete Gegenüberstellung erst in Hebräer 7,21 abgeschlossen wird. „Dies … geschah“ ergänzt im Deutschen knapp das aus dem Kontext erschließbare Geschehen, ohne den Gegenstand ausdrücklich festzulegen.
