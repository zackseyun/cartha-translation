  verdict: approve
  source_fidelity: Der Entwurf gibt die argumentative Einleitung Καὶ καθ’ ὅσον angemessen mit „Und insofern“ wieder und bewahrt die betonte negative Formulierung οὐ χωρὶς ὁρκωμοσίας als „nicht ohne einen Eid“. Die erklärende, auf den Folgevers hin offene Parenthese entspricht dem griechischen Satzfragment. „Denn jene sind ohne Eid Priester geworden“ trifft οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες; „jene“ ist im Kontext als die zuvor genannten levitischen Priester verständlich, ohne mehr in den Vers einzutragen.
  naturalness: Der Text ist würdiges, modernes Standarddeutsch und für den argumentativen Stil des Hebräerbriefs natürlich. Die syntaktische Offenheit der Klammer ist durch den Versübergang bedingt und sachgerecht erhalten.
  terminology: „Eid“ ist für ὁρκωμοσία treffend und wird innerhalb des Verses konsistent verwendet. „Priester geworden“ gibt den resultativen Charakter von εἰσὶν … γεγονότες angemessen wieder. Die Fußnote bietet mit „ohne eidliche Bestätigung“ eine vertretbare lexikalische Umschreibung, ohne den Haupttext zu überladen.
