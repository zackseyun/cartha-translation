source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: de
  text: Und es ist noch deutlicher, wenn ein anderer Priester[a] nach der Ähnlichkeit Melchisedeks[b] auftritt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein andersartiger Priester“. Das griechische Wort kann nicht nur einen weiteren, sondern auch einen andersartigen Priester hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „nach der Ähnlichkeit Melchisedeks“ greift die Formulierung und den Gedankengang auf, die in diesem Kapitel aus Psalm 110,4 entwickelt werden.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: noch deutlicher
  rationale: Die Wendung verstärkt die bereits im Zusammenhang erhobene Aussage. „Noch deutlicher“ ist im modernen Deutsch natürlich und gibt die steigernde Kraft knapp wieder.
- source_word: κατάδηλόν
  choice: deutlich
  rationale: Das Adjektiv bezeichnet etwas Offenkundiges oder klar Erkennbares. Zusammen mit „noch“ wird die Intensivierung aus περισσότερον ἔτι ohne Doppelsteigerung wiedergegeben.
- source_word: εἰ
  choice: wenn
  rationale: „Wenn“ bewahrt die formal konditionale Gestalt des griechischen Satzes und lässt offen, ob die Bedingung im argumentativen Zusammenhang nahezu begründenden Sinn hat.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: nach der Ähnlichkeit
  rationale: Die Formulierung bildet die Präpositionalwendung eng ab und bewahrt ihren Bezug auf die Melchisedek-Typologie im Kapitel.
- source_word: Μελχισέδεκ
  choice: Melchisedek
  rationale: Der Personenname folgt der im Deutschen eingebürgerten biblischen Schreibweise.
- source_word: ἀνίσταται
  choice: auftritt
  rationale: Im Zusammenhang bezeichnet das Verb das Hervortreten eines Priesters. „Auftritt“ ist natürlich und vermeidet eine unnötige Festlegung auf Auferstehungs- oder Einsetzungssemantik.
- source_word: ἱερεὺς ἕτερος
  choice: ein anderer Priester
  rationale: Die Wendung bezeichnet einen weiteren beziehungsweise andersartigen Priester. „Ein anderer Priester“ ist idiomatisch und lässt beide Nuancen zu.
theological_decisions:
- issue: Bedeutungsnuance von ἕτερος im Verhältnis zum levitischen Priestertum
  choice: ein anderer Priester
  alternative: ein andersartiger Priester
  rationale: Der Gedankengang unterscheidet diesen Priester vom levitischen Priestertum und ordnet ihn Melchisedek zu. Die Hauptfassung bewahrt die mögliche Spannung zwischen bloßer Verschiedenheit der Person und Verschiedenheit der Art, ohne den Kontrast stärker festzulegen als der griechische Ausdruck.
- issue: Logische Funktion von εἰ
  choice: wenn
  alternative: da / weil
  rationale: Obwohl εἰ hier argumentativ einer als gegeben betrachteten Voraussetzung nahekommen kann, wahrt „wenn“ die grammatische Bedingungsform und löst die Folgerungsstruktur nicht vorzeitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Das abschließende Komma bewahrt, dass der Satz in Vers 16 grammatisch weitergeführt wird; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
