  terminology: „Melchisedek“ folgt der etablierten deutschen biblischen Namensform. „Ein anderer Priester“ lässt die bei ἕτερος mögliche Nuance der Andersartigkeit offen, ohne sie im Haupttext zu überzeichnen. Die Fußnoten sind korrekt verankert und erläutern die lexikalische beziehungsweise intertextuelle Dimension sachgerecht.
