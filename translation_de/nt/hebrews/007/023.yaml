lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der einfache Anschluss wahrt den fortlaufenden Gedankengang und entspricht dem griechischen Bindewort.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: jene sind in größerer Zahl Priester geworden
  rationale: Die Formulierung bewahrt den prädikativen Sinn und berücksichtigt das Perfekt γεγονότες. „Jene“ nimmt die zuvor genannten Priester auf; μέν bereitet den Gegensatz zu Vers 24 vor, ohne dass im Deutschen ein zusätzliches Füllwort nötig ist.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: weil der Tod sie daran hindert
  rationale: διά mit substantiviertem Infinitiv bezeichnet den Grund. Die aktive deutsche Formulierung gibt die instrumentale beziehungsweise ursächliche Funktion von θανάτῳ natürlich wieder.
- source_word: παραμένειν
  choice: im Amt zu bleiben
  rationale: Das Verb bedeutet hier im Zusammenhang des Priestertums, in der priesterlichen Aufgabe fortzubestehen. „Im Amt“ macht diesen Kontextbezug verständlich, ohne ein neues theologisches Konzept einzuführen.
theological_decisions:
- issue: Gegensatz zwischen den vielen sterblichen Priestern und dem bleibenden Priestertum Jesu
  choice: Der Vers hebt die Vielzahl der Priester hervor, die wegen des Todes nicht im Amt bleiben können, und bereitet so den Gegensatz des folgenden Verses vor.
  alternative: Im Haupttext ausdrücklich von „levitischen Priestern“ oder vom „levitischen Priestertum“ sprechen.
  rationale: Der Kontext meint diese Priester, doch der griechische Vers nennt sie nicht ausdrücklich levitisch. Die Übersetzung wahrt daher die Argumentation, ohne die kontextuelle Identifikation in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Gedankengang, während „weil der Tod sie daran hindert“ idiomatischer ist als eine wörtliche Passivkonstruktion. Das abschließende Semikolon erhält den engen Anschluss an den Gegensatz in Vers 24.
