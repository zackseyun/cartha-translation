  source_fidelity: 'Der Entwurf trifft den Kausalzusammenhang zutreffend: Die Vielzahl der Priester ergibt sich daraus, dass der Tod ihr Fortbestehen im priesterlichen Dienst verhindert. „In größerer Zahl“ verschiebt jedoch πλείονες („viele/mehrere“) zu einem unbestimmten Vergleichsausdruck und klingt hier nicht idiomatisch. „Jene“ ist im Deutschen zudem unnötig demonstrativ; das griechische οἱ μέν markiert vor allem die für V. 24 vorbereitete Gegenüberstellung.'
  naturalness: „Und es sind viele Priester geworden“ ist modernes, verständliches Standarddeutsch und bewahrt zugleich die im griechischen Perfektpartizip ausgedrückte Tatsache der zahlreichen Amtsnachfolger. „Weil der Tod sie daran hindert“ ist natürlich. Das Semikolon ist wegen des unmittelbar folgenden Kontrasts angemessen.
  terminology: „Priester“ und „im Amt bleiben“ geben ἱερεῖς beziehungsweise παραμένειν im Kontext angemessen wieder. „Im priesterlichen Amt“ in der Fußnote erläutert den Kontext, ohne die nicht ausdrücklich genannte Bezeichnung „levitisch“ in den Text einzutragen.
