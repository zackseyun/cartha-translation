  - severity: low
    issue: „jene“ für οἱ μέν
    rationale: „Jene“ wirkt demonstrativ und kann eine räumliche oder personelle Absetzung nahelegen, die der Vers nicht ausdrücklich formuliert. Eine unmarkierte deutsche Konstruktion bildet die kontrastvorbereitende Funktion natürlicher ab.
