  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: de
  text: Und es sind viele Priester geworden[a], weil der Tod sie daran hindert, im Amt zu bleiben[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und es hat viele Priester gegeben.«'
