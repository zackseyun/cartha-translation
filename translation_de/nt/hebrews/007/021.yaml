source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: de
  text: 'Dieser hingegen wurde mit einem Eid zum Priester eingesetzt, und zwar durch den, der zu ihm sagte: »Der Herr hat geschworen und wird seine Meinung nicht ändern: Du bist Priester für immer.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Herr schwor und wird seine Meinung nicht ändern.« Der griechische Aorist Ὤμοσεν kann mit »schwor« oder »hat geschworen« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Dieser aber
  rationale: Die substantivische Wendung setzt diesen Priester in deutlichen Gegensatz zu den zuvor genannten Priestern und bewahrt die knappe Ausdrucksweise des Griechischen.
- source_word: μετὰ ὁρκωμοσίας
  choice: durch einen Eid
  rationale: Die Formulierung gibt hier das Mittel bzw. den maßgeblichen Begleitumstand der Einsetzung wieder und hält den Gegensatz zu Vers 20 fest.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: durch den, der zu ihm sagte
  rationale: διά mit Genitiv bezeichnet die vermittelnde Urheberschaft; die Formulierung bleibt nahe am griechischen Satzbau und ist dennoch verständlich.
- source_word: Ὤμοσεν κύριος
  choice: Der Herr hat geschworen
  rationale: Das deutsche Perfekt bringt die fortdauernde Geltung des feierlichen Schwurs natürlich zum Ausdruck; der griechische Aorist lässt ebenso das Präteritum »schwor« zu.
- source_word: οὐ μεταμεληθήσεται
  choice: wird seine Meinung nicht ändern
  rationale: Gemeint ist keine moralische Reue, sondern dass der Herr seine erklärte Absicht nicht widerrufen wird.
- source_word: Σὺ ἱερεὺς
  choice: Du bist Priester
  rationale: Die im Griechischen ausgelassene Kopula wird im Deutschen natürlich ergänzt.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet hier unbegrenzte Dauer; »für immer« ist klar und idiomatisch.
theological_decisions:
- issue: Der durch Gottes Eid begründete und dauerhafte Priesterdienst
  choice: Die Übersetzung stellt heraus, dass dieser Priester im Unterschied zu den früheren Priestern durch einen göttlichen Eid eingesetzt wurde und für immer Priester ist.
  alternative: Man könnte μετὰ ὁρκωμοσίας enger als »mit einem Eid« wiedergeben und Ὤμοσεν als »schwor« übersetzen.
  rationale: Der Kontext von Hebräer 7 kontrastiert eine Einsetzung ohne Eid mit der Einsetzung dieses Priesters durch Gottes Eid. Die Übersetzung bewahrt diesen Gegensatz, ohne über die Aussage des Textes hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Zum Priester eingesetzt« ergänzt den im griechischen Kontrast elliptisch vorausgesetzten Vorgang aus dem unmittelbaren Kontext; das Schriftzitat bleibt knapp und feierlich.
