revisions:
- from: Denn dieser Melchisedek, König von Salem, Priester Gottes, des Höchsten,[a] ging Abraham entgegen, als dieser von der Niederwerfung der Könige zurückkehrte, und segnete ihn.[b]
  to: Denn dieser Melchisedek, König von Salem, Priester Gottes, des Höchsten,[a] ging Abraham auf dem Rückweg von seinem Sieg über die Könige entgegen und segnete ihn.[b]
  rationale: Die Revision ersetzt die missverständliche und weniger idiomatische „Niederwerfung“ durch „Sieg über die Könige“, das den militärischen Kontext und den Bezug auf Abrahams erfolgreiche Rückkehr klar wiedergibt. Die Fußnote erhält die stärkere, wörtlichere Gewaltsemantik von κοπή. „Auf dem Rückweg“ gibt die zeitgleiche Handlung des Präsenspartizips ὑποστρέφοντι natürlich wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:45:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Satz gibt den erklärenden Anschluss (γάρ), die Titel Melchisedeks, seine Begegnung mit Abraham und den Segen zuverlässig wieder. „Niederwerfung“ ist für κοπή jedoch keine ausreichend präzise oder idiomatische deutsche Wiedergabe: Es bezeichnet eher Unterwerfung bzw. Beseitigung als eine kriegerische Niederlage bzw. das gewaltsame Niedermachen. „Sieg über die Könige“ gibt den erzählten Bezug klar wieder; die Fußnote wahrt die wörtlich gewaltsamere Nuance.'
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „als dieser … zurückkehrte“ ist verständlich, doch „auf dem Rückweg …“ bildet die Gleichzeitigkeit des griechischen Partizips natürlicher ab. Die revidierte Formulierung vermeidet zudem die etwas abstrakte Wendung „von der Niederwerfung der Könige“.
  terminology: „Melchisedek“, „Salem“, „König“ und „Priester Gottes, des Höchsten“ sind angemessen. Die Apposition „des Höchsten“ bewahrt den göttlichen Titel, ohne eine theologische Interpretation einzutragen. Die alternative Fußnote „Priester des höchsten Gottes“ ist zutreffend.
  issues:
  - severity: medium
    issue: „von der Niederwerfung der Könige“ für ἀπὸ τῆς κοπῆς τῶν βασιλέων
    rationale: „Niederwerfung“ ist im heutigen Deutsch semantisch und stilistisch weniger passend; es kann politische Unterwerfung oder das Zu-Fall-Bringen meinen. Im Kontext bezeichnet κοπή die gewaltsame Niederlage bzw. das Niedermachen der Könige. Eine idiomatische Haupttextwiedergabe mit einer wörtlicheren Fußnote ist genauer und besser lesbar.
