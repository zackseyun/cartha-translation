id: HEB.7.1
reference: Hebrews 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: de
  text: Denn dieser Melchisedek, König von Salem, Priester Gottes, des Höchsten,[a] ging Abraham auf dem Rückweg von seinem Sieg über die Könige entgegen und segnete ihn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Priester des höchsten Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „von der Tötung“ oder „vom Niedermachen der Könige“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ
  choice: Denn dieser
  rationale: γάρ stellt den erklärenden Anschluss an die vorausgehende Argumentation her; οὗτος wird mit dem Eigennamen natürlich als „dieser“ wiedergegeben und behält so den demonstrativen Nachdruck.
- source_word: Μελχισέδεκ
  choice: Melchisedek
  rationale: Im Deutschen übliche biblische Namensform.
- source_word: βασιλεὺς Σαλήμ
  choice: König von Salem
  rationale: Die geläufige Wiedergabe wahrt den erkennbaren Bezug zu 1. Mose 14.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: Priester Gottes, des Höchsten
  rationale: Die Formulierung folgt der griechischen Folge und erhält „der Höchste“ als Gottesbezeichnung; zugleich bleibt die alternative syntaktische Wiedergabe „des höchsten Gottes“ möglich.
- source_word: ὁ συναντήσας
  choice: ging … entgegen
  rationale: συναντάω bezeichnet hier das Zusammentreffen beziehungsweise Entgegengehen. Die deutsche Formulierung passt zum erzählten Vorgang und bildet das attributive Partizip als finites Verb ab.
- source_word: Ἀβραὰμ ὑποστρέφοντι
  choice: Abraham …, als dieser … zurückkehrte
  rationale: Das Präsenspartizip bezeichnet eine zum Entgegengehen gleichzeitige, noch andauernde Rückkehr; „als dieser … zurückkehrte“ macht den Bezug auf Abraham eindeutig.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: von der Niederwerfung der Könige
  rationale: κοπή kann das Niedermachen oder Töten bezeichnen. „Niederwerfung“ bewahrt den militärischen Ernst, ohne eindeutiger als der Kontext zu behaupten, die Könige selbst seien getötet worden.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: und segnete ihn
  rationale: Das koordinierte Aoristpartizip nennt die zweite Handlung Melchisedeks; im Deutschen ist die finite Reihung klar und natürlich.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung τοῦ θεοῦ τοῦ ὑψίστου
  choice: Priester Gottes, des Höchsten
  alternative: Priester des höchsten Gottes
  rationale: Beide Analysen sind sprachlich möglich und theologisch nicht gegeneinander auszuspielen. Der Haupttext hält sich eng an die griechische Wortfolge; die Fußnote bewahrt die geläufige attributive Alternative.
- issue: Bedeutungsumfang von κοπή im Bericht über die Könige
  choice: Niederwerfung der Könige
  alternative: Tötung der Könige
  rationale: Der Ausdruck ist gewaltsam, doch der Genitiv kann sich auf die militärische Niederlage beziehen, ohne zwingend den Tod jedes Königs festzustellen. Die Fußnote nennt die wörtlich schärfere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Auftakt des über Vers 1 hinausführenden Gedankengangs erkennbar; zur deutschen Lesbarkeit werden die griechischen Partizipien finit wiedergegeben. „Niederwerfung“ vermeidet sowohl eine verharmlosende bloße „Niederlage“ als auch eine möglicherweise überbestimmte Aussage über die Tötung sämtlicher Könige.
