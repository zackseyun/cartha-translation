source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: de
  text: Er muss nicht Tag für Tag[a] wie die Hohepriester Opfer darbringen, zuerst für ihre eigenen Sünden und dann für die des Volkes[b]. Denn dies tat er ein für alle Mal[c], indem er sich selbst darbrachte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „täglich“. Die griechische Wendung bezeichnet eine sich Tag für Tag wiederholende Handlung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dann die des Volkes“; „Sünden“ ist aus dem vorhergehenden Satzglied zu ergänzen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „einmal für immer“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „als er sich selbst darbrachte“ beziehungsweise „nachdem er sich selbst dargebracht hatte“. Das griechische Partizip lässt die genaue zeitliche beziehungsweise modale Beziehung offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die Wendung gibt die wiederholte tägliche Notwendigkeit idiomatisch und mit iterativer Kraft wieder.
- source_word: ἀνάγκην ἔχει
  choice: muss
  rationale: Im Deutschen drückt „muss nicht“ die Konstruktion natürlich und prägnant aus; gemeint ist fehlende Notwendigkeit, nicht ein Verbot.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: wie die Hohepriester
  rationale: Die Vergleichsform und der griechische Plural bleiben erhalten.
- source_word: πρότερον ... ἔπειτα
  choice: zuerst ... und dann
  rationale: Die zeitliche Reihenfolge der Opferhandlungen wird klar wiedergegeben.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: für die eigenen Sünden
  rationale: „Für“ ist im Opferkontext die natürliche Wiedergabe von ὑπέρ; die reflexive Zuordnung ergibt sich eindeutig aus dem Subjekt.
- source_word: θυσίας ἀναφέρειν
  choice: Opfer darbringen
  rationale: „Darbringen“ bewahrt den kultisch-priesterlichen Sinn von ἀναφέρω und klingt im heutigen gehobenen Standarddeutsch natürlich.
- source_word: τῶν τοῦ λαοῦ
  choice: die des Volkes
  rationale: Die griechische Ellipse wird beibehalten; „Sünden“ ist aus dem vorhergehenden Satzglied eindeutig zu ergänzen.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: Denn dies tat er
  rationale: „Dies“ bewahrt den rückverweisenden Charakter von τοῦτο, ohne dessen Bezug enger festzulegen als der griechische Text.
- source_word: ἐφάπαξ
  choice: ein für alle Mal
  rationale: Die Formulierung bringt die einmalige und endgültige Geltung der Handlung idiomatisch zum Ausdruck.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: indem er sich selbst darbrachte
  rationale: „Indem“ gibt den Partizipialsatz als Mittel beziehungsweise begleitenden Vollzug wieder; „darbrachte“ erhält den Opferbezug.
theological_decisions:
- issue: Bezugsumfang von „dies“ im Schlusssatz
  choice: „Dies“ bleibt als offener Rückverweis stehen und bezeichnet die entscheidende Opferhandlung, ohne Jesus ein Opfer für eigene Sünden zuzuschreiben.
  alternative: „Dies“ ausdrücklich nur auf das Opfer für die Sünden des Volkes beziehen.
  rationale: Der unmittelbare Satzbau lässt einen breiteren Rückbezug zu, während der Kontext des Hebräerbriefs Jesus von den sündigen Hohepriestern unterscheidet. Die Übersetzung bewahrt diese Spannung, statt den Bezug erklärend einzuengen.
- issue: Verhältnis des Partizips zur Haupthandlung
  choice: „indem er sich selbst darbrachte“
  alternative: „als er sich selbst darbrachte“
  rationale: Das griechische Aoristpartizip kann temporal oder modal-instrumental verstanden werden. „Indem“ lässt erkennen, wodurch die einmalige Opferhandlung vollzogen wurde, ohne den kultischen Gehalt abzuschwächen.
- issue: Christus als Priester und Opfer
  choice: „sich selbst darbrachte“
  alternative: „sich selbst hingab“
  rationale: „Darbringen“ bewahrt die priesterlich-opferbezogene Sprache des Verses; „hingeben“ wäre natürlicher, würde aber den kultischen Sinn verflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hohepriester“, „Opfer“ und „darbringen“ erhalten das kultische Register des Ausgangstextes, ohne unnötig archaisch zu wirken. Die griechische Ellipse bei den Sünden des Volkes und die mögliche Mehrdeutigkeit des Partizips werden bewahrt beziehungsweise in den Fußnoten ausgewiesen.
