  to: Er muss nicht Tag für Tag[a] wie die Hohepriester Opfer darbringen, zuerst für ihre eigenen Sünden und dann für die des Volkes[b]. Denn dies tat er ein für alle Mal[c], indem er sich selbst darbrachte[d].
