id: HEB.7.10
reference: Hebrews 7:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: de
  text: Denn er war noch in den Lenden seines Vaters, als Melchisedek ihm begegnete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker deutend: »Er war noch im Leib seines Vorfahren.« Wörtlich steht im Griechischen »in den Lenden seines Vaters«, eine bildhafte Wendung für die Abstammung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: noch
  rationale: Gibt den fortdauernden Zustand zu dem Zeitpunkt wieder, als die Begegnung stattfand.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet die erklärende Verbindung zum vorhergehenden Vers, ohne den Zusammenhang stärker kausal auszudeuten.
- source_word: ἐν τῇ ὀσφύϊ
  choice: in den Lenden
  rationale: Bewahrt das konkrete griechische Bild für Abstammung und Zeugungsursprung; der im Deutschen idiomatische Plural gibt den griechischen Singular natürlich wieder.
- source_word: τοῦ πατρὸς
  choice: seines Vaters
  rationale: Bewahrt die Ausdrucksweise des griechischen Textes. »Vater« wird hier im weiteren Sinn für den Vorfahren Abraham gebraucht.
- source_word: ἦν
  choice: war
  rationale: Direkte und natürliche Wiedergabe des Imperfekts von εἰμί.
- source_word: ὅτε
  choice: als
  rationale: Leitet im Deutschen idiomatisch den einmaligen Zeitpunkt der vergangenen Begegnung ein.
- source_word: συνήντησεν
  choice: begegnete
  rationale: Gibt das Zusammentreffen knapp und natürlich wieder und passt zur Anspielung auf den Bericht in Genesis.
- source_word: αὐτῷ
  choice: ihm
  rationale: Bewahrt das Pronomen des griechischen Textes; aus dem Zusammenhang ist Abraham als Bezugsperson erkennbar.
- source_word: Μελχισέδεκ
  choice: Melchisedek
  rationale: Verwendet die im Deutschen etablierte Schreibweise des Personennamens.
theological_decisions:
- issue: Bildhafte Darstellung von Levis Abstammung von Abraham
  choice: Das konkrete Bild »in den Lenden seines Vaters« bleibt im Haupttext erhalten.
  alternative: »im Leib seines Vorfahren«
  rationale: Der Gedankengang stellt Levi aufgrund seiner Abstammung als in Abraham gegenwärtig dar. Die bildhafte Formulierung bleibt sichtbar, ohne sie durch eine technische theologische Erklärung zu ersetzen.
- issue: Identität des »Vaters«
  choice: »seines Vaters« statt der ausdrücklichen Nennung Abrahams
  alternative: »seines Vorfahren Abraham«
  rationale: Obwohl Abraham gemeint ist, steht im griechischen Text »seines Vaters«. Die allgemeinere verwandtschaftliche Bezeichnung bewahrt die Formulierung und ihre antike Verwendung für einen Vorfahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Lenden« ist bewusst bildhaft und leicht gehoben, bewahrt aber den konkreten Ausdruck des Ausgangstextes; die Fußnote erläutert seine Bedeutung.
