reference: Hebrews 7:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: de
  text: 'Denn ein solcher Hoher Priester war für uns durchaus angemessen: heilig, unschuldig, unbefleckt, von den Sündern getrennt[a] und höher als die Himmel geworden[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das heißt nicht, dass Jesus während seines irdischen Wirkens keinen Umgang mit Sündern hatte. Die Wendung hebt seine moralische Reinheit und seinen erhöhten Stand als Hoher Priester hervor.
    reason: theological_clarification
  - marker: b
    text: 'Oder: »über die Himmel erhöht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: ein solcher
  rationale: Greift rückweisend die zuvor beschriebene Art von Hohem Priester auf und klingt im Deutschen natürlich.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorausgehenden Gedankengang.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: entsprach genau dem, was wir brauchten
  rationale: Gibt die Eignung dieses Hohen Priesters für uns idiomatisch wieder; »genau« erfasst die wahrscheinlich verstärkende Funktion von καί.
- source_word: ἀρχιερεύς
  choice: Hoher Priester
  rationale: Etablierte und präzise Bezeichnung des kultischen Amtes im Hebräerbrief.
- source_word: ὅσιος
  choice: heilig
  rationale: Bezeichnet hier die Frömmigkeit und sittlich-kultische Reinheit Jesu; »heilig« ist verständlich und kontextgemäß.
- source_word: ἄκακος
  choice: unschuldig
  rationale: Bringt Schuldlosigkeit sowie das Fehlen böser Absicht zum Ausdruck, ohne das schwächere Missverständnis von »harmlos«.
- source_word: ἀμίαντος
  choice: unbefleckt
  rationale: Bewahrt die Reinheitssprache und ihren wahrscheinlichen kultischen Nachklang.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: von den Sündern getrennt
  rationale: Gibt das resultative Perfektpartizip direkt wieder und lässt offen, ob vor allem moralische Absonderung oder der erhöhte Zustand gemeint ist.
- source_word: ὑψηλότερος τῶν οὐρανῶν
  choice: höher als die Himmel
  rationale: Entspricht unmittelbar der Komparativkonstruktion und bewahrt das räumlich-exaltative Bild.
- source_word: γενόμενος
  choice: geworden
  rationale: Gibt das Aoristpartizip als Eintritt in einen resultierenden erhöhten Stand wieder, ohne ausdrücklich eine verursachende Instanz einzutragen.
theological_decisions:
- issue: Jesu Verhältnis zu den Sündern in »von den Sündern getrennt«
  choice: Die direkte Formulierung bleibt im Haupttext stehen; eine Fußnote erläutert, dass sie Jesu Reinheit und erhöhten priesterlichen Stand hervorhebt.
  alternative: Die Wendung ausschließlich als räumliche Trennung oder ausschließlich als Trennung nach der Himmelfahrt auslegen.
  rationale: Die Reihe der Prädikate betont seine Eignung, Reinheit und Erhöhung. Die Übersetzung bewahrt die Spannung und bestreitet nicht seine irdische Gemeinschaft mit Sündern.
- issue: Aussage von γενόμενος in Verbindung mit »höher als die Himmel«
  choice: »höher als die Himmel geworden«
  alternative: »über die Himmel erhöht« oder rein statisch »höher als die Himmel seiend«
  rationale: Die Formulierung bildet die geschichtliche beziehungsweise resultative Bewegung in den erhöhten priesterlichen Stand ab, ohne eine Veränderung der göttlichen Natur Christi zu behaupten oder eine passive Verursachung ausdrücklich einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung »entsprach genau dem, was wir brauchten« vermeidet das heute etwas steife »geziemte uns«, während die priesterliche und kultische Begrifflichkeit erhalten bleibt.
