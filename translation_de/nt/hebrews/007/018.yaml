  source_fidelity: Der Entwurf trifft die Grundbedeutung von ἀθέτησις, προαγούσης ἐντολῆς sowie ἀσθενές καὶ ἀνωφελές. Die starke Bewertung bleibt zurecht erhalten. Die Formulierung „Einerseits nämlich“ bildet μὲν γάρ jedoch im modernen Deutschen unnatürlich nach; μὲν kann hier idiomatisch durch „zwar“ wiedergegeben werden und erhält so den auf V. 19 vorausweisenden Kontrast.
  naturalness: „Zwar erfolgt nämlich die Aufhebung des früheren Gebots ...“ ist würdiges, modernes Standarddeutsch und verbindet die Erklärung durch γάρ mit dem durch μὲν eröffneten Kontrast. Die nominale Wiedergabe „wegen seiner Schwäche und Nutzlosigkeit“ entspricht zudem der griechischen substantivierten Konstruktion präziser als der Kausalsatz.
  terminology: „Aufhebung“ gibt den rechtlich-sachlichen Sinn von ἀθέτησις angemessen wieder. „Früheres Gebot“ ist im Deutschen idiomatischer als „vorausgehendes Gebot“ und wahrt die zeitliche Priorität von προαγούσης, ohne den Bezug unnötig auszuweiten. „Schwäche und Nutzlosigkeit“ bewahrt die Schärfe der zwei griechischen Prädikatsbegriffe.
