lexical_decisions:
- source_word: ἀθέτησις
  choice: wird … aufgehoben
  rationale: Das Substantiv bezeichnet eine Aufhebung oder Außerkraftsetzung. Die verbale Formulierung ist im Deutschen natürlich und bewahrt den rechtlich-sachlichen Sinn.
- source_word: μὲν γὰρ
  choice: Einerseits nämlich
  rationale: μέν kündigt einen Gegensatz an, der im folgenden Vers weitergeführt wird; γάρ begründet den vorausgehenden Gedankengang. Die Wiedergabe erhält beide Diskursfunktionen.
- source_word: γίνεται
  choice: wird
  rationale: Im Zusammenhang mit ἀθέτησις bezeichnet γίνομαι das Eintreten beziehungsweise Geschehen der Aufhebung; im deutschen Passiv wird dies knapp und idiomatisch ausgedrückt.
- source_word: προαγούσης ἐντολῆς
  choice: das vorausgehende Gebot
  rationale: Das Partizip bezeichnet etwas, das zeitlich oder sachlich vorausgeht. „Vorausgehend“ wahrt diese Bedeutung, ohne den Bezug stärker einzugrenzen, als es der griechische Wortlaut tut.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: weil es schwach und nutzlos ist
  rationale: Die kausale Konstruktion nennt als Grund die mangelnde Kraft und den fehlenden Nutzen des Gebots. Die adjektivische Wiedergabe ist natürlich und erhält die Schärfe beider Ausdrücke.
- source_word: ἀσθενές
  choice: schwach
  rationale: Das Wort bezeichnet hier mangelnde Kraft beziehungsweise Wirksamkeit; „schwach“ ist die direkte und kontextoffene Entsprechung.
- source_word: ἀνωφελές
  choice: nutzlos
  rationale: Das Wort bedeutet ohne Nutzen oder Vorteil. „Nutzlos“ bewahrt die starke Bewertung, ohne sie im Haupttext erklärend abzuschwächen.
theological_decisions:
- issue: Reichweite der Kritik am vorausgehenden Gebot
  choice: Die starke Aussage über Schwäche und Nutzlosigkeit bleibt im Haupttext ungeschmälert; eine Fußnote weist auf den im Kontext behandelten Zweck hin.
  alternative: Die Aussage auf eine pauschale Wertlosigkeit des gesamten mosaischen Gesetzes auszuweiten oder sie bereits in der Übersetzung zu „unwirksam“ abzuschwächen.
  rationale: Hebräer 7,11 und 7,19 behandeln die Unfähigkeit der früheren priesterlichen Ordnung, Vollkommenheit herbeizuführen. Zugleich verwendet der Vers bewusst scharfe Begriffe, deren theologische Spannung nicht im Haupttext aufgelöst werden soll.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung „Einerseits nämlich“ macht den im nächsten Vers fortgeführten Gegensatz sichtbar. Die kräftigen Wertungen des griechischen Textes werden beibehalten und nur in der Fußnote kontextuell eingeordnet.
