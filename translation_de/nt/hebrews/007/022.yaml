  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: de
  text: Um so viel ist Jesus Bürge eines besseren Bundes[a] geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Testaments“. Das griechische Wort kann sowohl „Bund“ als auch in manchen Zusammenhängen „Testament“ bedeuten; hier passt wegen des Gedankengangs über Priestertum und Eid am besten „Bund“.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Insofern
  rationale: Die Wendung bezeichnet Maß beziehungsweise Ausmaß und knüpft an den unmittelbar zuvor beschriebenen Unterschied an. „Insofern“ gibt diesen argumentativen Bezug im Deutschen knapp und natürlich wieder.
- source_word: κρείττονος
  choice: besseren
  rationale: „Besser“ bewahrt den für den Hebräerbrief charakteristischen Vergleich und ist im modernen Deutsch klarer und natürlicher als „überlegener“.
- source_word: διαθήκης
  choice: Bundes
  rationale: Im Zusammenhang von Priestertum und göttlichem Eid bezeichnet διαθήκη hier am ehesten die von Gott gestiftete Bundesordnung. Die mögliche Bedeutung „Testament“ wird in der Fußnote erhalten.
- source_word: γέγονεν
  choice: ist … geworden
  rationale: Das deutsche Perfekt gibt die vollzogene Veränderung mit fortdauerndem Ergebnis angemessen wieder.
- source_word: ἔγγυος
  choice: Bürgen
  rationale: „Bürge“ bezeichnet verständlich und präzise eine Person, die für die Verlässlichkeit beziehungsweise Erfüllung einer Verpflichtung einsteht.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Die im Deutschen übliche Form des Namens.
theological_decisions:
- issue: Bedeutung von διαθήκη in Hebräer 7,22
  choice: Bund
  alternative: Testament
  rationale: Der unmittelbare Zusammenhang behandelt Jesu Priestertum und den Eid, durch den eine bessere Ordnung eingesetzt wird. Daher passt „Bund“ hier besser; die semantische Möglichkeit „Testament“ wird nicht verschwiegen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt Jesus als Subjekt klar heraus; „Bürge“ ist präzise und allgemein verständlich.
