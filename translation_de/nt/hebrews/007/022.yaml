  source_fidelity: Die Wiedergabe von κρείττονος διαθήκης als „eines besseren Bundes“ und von ἔγγυος als „Bürge“ ist zutreffend. Das Perfekt γέγονεν wird mit „ist … geworden“ angemessen wiedergegeben. „Insofern“ bezeichnet jedoch im heutigen Deutsch primär einen sachlichen Bezug („in dieser Hinsicht“) und gibt das durch κατὰ τοσοῦτο ausgedrückte Maß bzw. den steigernden Anschluss an den vorherigen Eid nicht hinreichend wieder.
