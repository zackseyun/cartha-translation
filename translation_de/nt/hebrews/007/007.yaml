  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: de
  text: Unbestreitbar[a] wird der Geringere vom Höheren gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne jeden Widerspruch“; auch: „ohne jeden Zweifel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Unbestreitbar
  rationale: Die Wendung bezeichnet den folgenden Grundsatz als etwas, dem nicht widersprochen werden kann. „Unbestreitbar“ ist im heutigen Deutsch knapp und natürlich; die schwache weiterführende Funktion von δέ muss hier nicht eigens wiedergegeben werden.
- source_word: τὸ ἔλαττον
  choice: der Geringere
  rationale: Der substantivierte Komparativ bezeichnet allgemein die Person von geringerem Rang. Das Deutsche verwendet bei einem auf Personen bezogenen allgemeinen Vergleich natürlich das substantivierte Maskulinum.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: vom Höheren
  rationale: ὑπό mit Genitiv bezeichnet beim Passiv den Handelnden. „Der Höhere“ gibt hier den höheren Rang wieder, ohne moralische Überlegenheit zu behaupten.
- source_word: εὐλογεῖται
  choice: wird … gesegnet
  rationale: Das Präsens Passiv besagt, dass der Geringere den Segen empfängt. Im Zusammenhang mit Melchisedeks Segnung Abrahams ist „segnen“ die direkte und sachgerechte Wiedergabe.
theological_decisions:
- issue: Art des Vergleichs zwischen dem Geringeren und dem Höheren
  choice: 'Der Vers formuliert einen allgemeinen Grundsatz: Eine Person niedrigeren Ranges wird von einer Person höheren Ranges gesegnet.'
  alternative: Die Aussage beschreibt lediglich eine gesellschaftliche Konvention ohne theologisches Gewicht.
  rationale: Im Zusammenhang von Hebräer 7 stützt der Grundsatz das Argument, dass Melchisedek Abraham übergeordnet ist. Die Übersetzung bewahrt den Rangvergleich, ohne dessen Tragweite über den Wortlaut hinaus auszuformulieren.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die substantivierten Komparative bewahren die knappe, sprichwortartige Form des griechischen Grundsatzes.
