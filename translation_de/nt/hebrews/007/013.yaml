  naturalness: „Denn der, von dem dies gesagt wird, gehört einem anderen Stamm an“ ist natürliches, würdevolles modernes Standarddeutsch. „Am Altar Dienst getan hat“ ist verständlich und im biblisch-kultischen Register angemessen.
