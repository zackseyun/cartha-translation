  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: de
  text: Denn der, von dem dies gesagt wird, gehört einem anderen Stamm an,[a] aus dem niemand am Altar Dienst getan hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „hat Anteil an einem anderen Stamm“ oder „ist aus einem anderen Stamm hervorgegangen“. Das griechische Verb kann Teilhabe oder Verbundenheit bezeichnen; hier geht es um die Zugehörigkeit zu einem Stamm.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „am Altar tätig gewesen ist“ oder „am Altar gedient hat“. Gemeint ist priesterliche Anwesenheit oder Dienst in Verbindung mit dem Altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: von dem
  rationale: In Verbindung mit λέγεται ταῦτα bezeichnet ἐπί mit Akkusativ die Person, auf die sich das Gesagte bezieht. „Von dem dies gesagt wird“ ist im Deutschen natürlich und präzise.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Aussage ein und bewahrt so den argumentativen Zusammenhang.
- source_word: λέγεται ταῦτα
  choice: dies gesagt wird
  rationale: Die präsentische Passivform bleibt erhalten. Das deutsche Singularpronomen „dies“ fasst den Inhalt der griechischen Mehrzahl ταῦτα idiomatisch zusammen.
- source_word: φυλῆς ἑτέρας
  choice: einem anderen Stamm
  rationale: φυλή bezeichnet hier einen der Stämme Israels; ἑτέρας hebt dessen Verschiedenheit vom priesterlichen Stamm hervor.
- source_word: μετέσχηκεν
  choice: gehört … an
  rationale: Das Perfekt bezeichnet eine bestehende Zugehörigkeit. Im Kontext ist Stammeszugehörigkeit gemeint; „gehört … an“ gibt dies klar wieder, ohne ausdrücklich Abstammung in den Wortlaut einzutragen.
- source_word: ἀφ’ ἧς
  choice: aus dem
  rationale: Das Relativpronomen bezieht sich auf „Stamm“. „Aus dem“ drückt die Herkunft aus diesem Stamm idiomatisch aus.
- source_word: οὐδεὶς
  choice: noch niemand
  rationale: οὐδείς bedeutet „niemand“. Das deutsche „noch“ verdeutlicht hier idiomatisch den bis dahin geltenden Befund, ohne die Aussage inhaltlich einzuschränken.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: am Altar Dienst getan hat
  rationale: προσέχω bezeichnet hier die kultische Hinwendung beziehungsweise den Dienst am Altar. Die Formulierung wahrt den priesterlichen Zusammenhang, ohne einzelne Amtshandlungen näher festzulegen.
- source_word: θυσιαστηρίῳ
  choice: Altar
  rationale: „Altar“ ist die klare und übliche Wiedergabe im Opfer- und Priesterdienstkontext.
theological_decisions:
- issue: Jesu Zugehörigkeit zu einem nichtlevitischen Stamm innerhalb der Argumentation über das Priestertum
  choice: Die Stammeszugehörigkeit wird ausgedrückt, ohne den Vers ausdrücklich als Aussage über Abstammung zu formulieren.
  alternative: „stammt aus einem anderen Stamm“ oder „ist aus einem anderen Stamm hervorgegangen“
  rationale: Der Zusammenhang betrifft Jesu nichtlevitische Herkunft, doch μετέσχηκεν bezeichnet unmittelbar Teilhabe beziehungsweise Zugehörigkeit. Die Übersetzung soll die Folgerung nicht stärker ausformulieren als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Denn“ erhält den argumentativen Anschluss; „gehört … an“ ist natürlich und bewahrt die bestehende Zugehörigkeit des griechischen Perfekts. Die Fußnoten markieren echte lexikalische Spielräume, ohne eine konfessionelle Deutung einzutragen.
