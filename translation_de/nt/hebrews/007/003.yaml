  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: de
  text: ohne Vater[a], ohne Mutter, ohne Stammbaum, ohne Anfang seiner Tage und ohne Ende seines Lebens, aber dem Sohn Gottes ähnlich gemacht, bleibt er Priester für alle Zeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, zu »ohne Stammbaum«: »ohne überlieferte Genealogie«. Im Bericht der Genesis werden für Melchisedek keine Abstammungsangaben genannt; der Hebräerbrief verwendet dieses Schweigen typologisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für immer« oder »unaufhörlich«. Die Wendung betont den bleibenden Charakter seines Priestertums in der Darstellung der Schrift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: ohne Vater
  rationale: Gibt das privative Adjektiv knapp und in formaler Parallelität mit ἀμήτωρ wieder, ohne die Aussage auf eine bestimmte Deutung festzulegen.
- source_word: ἀμήτωρ
  choice: ohne Mutter
  rationale: Bewahrt die symmetrische Reihung des griechischen Textes und vermeidet die emotionalen Nebenbedeutungen von »mutterlos«.
- source_word: ἀγενεαλόγητος
  choice: ohne Stammbaum
  rationale: Natürliches modernes Deutsch für das Fehlen einer genealogischen Einordnung; die mögliche Präzisierung auf einen nicht überlieferten Stammbaum wird in der Fußnote genannt.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: ohne Anfang seiner Tage und ohne Ende seines Lebens
  rationale: Erhält die feierliche, parallele Formulierung, klingt aber im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion mit »habend«.
- source_word: ἀφωμοιωμένος
  choice: gleichgemacht
  rationale: Bewahrt die passive Aussage und unterscheidet Melchisedek vom Sohn Gottes; das Perfekt bezeichnet eine fortbestehende, im Text hergestellte Ähnlichkeit.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: dem Sohn Gottes
  rationale: Entspricht dem etablierten christologischen Titel und schließt grammatisch an »gleichgemacht« an.
- source_word: μένει ἱερεὺς
  choice: bleibt er Priester
  rationale: »Bleibt« gibt den fortdauernden Zustand des Präsens μένει prägnant wieder; im Deutschen ist hier kein unbestimmter Artikel nötig.
- source_word: εἰς τὸ διηνεκές
  choice: für alle Zeit
  rationale: Drückt die ununterbrochene und bleibende Dauer idiomatisch aus, ohne stärker als nötig eine metaphysische Aussage festzulegen.
theological_decisions:
- issue: Ob Melchisedek buchstäblich ohne Eltern und ewig ist oder in der Schrift typologisch so dargestellt wird
  choice: Die uneingeschränkten Aussagen des Haupttextes bleiben erhalten; eine Fußnote weist darauf hin, dass der Zusammenhang auf das Fehlen genealogischer Angaben in Genesis bezogen werden kann.
  alternative: Die Aussagen ausdrücklich als »ohne verzeichneten Vater«, »ohne verzeichnete Mutter« und »ohne überlieferten Stammbaum« paraphrasieren.
  rationale: Der griechische Wortlaut formuliert absolut, während der Kontext eine typologische Argumentation aus der Darstellung in Genesis nahelegt. Haupttext und Fußnote bewahren beides, ohne eine ontologische Identität Melchisedeks mit dem Sohn zu behaupten.
- issue: Verhältnis Melchisedeks zum Sohn Gottes
  choice: »dem Sohn Gottes gleichgemacht«
  alternative: »dem Sohn Gottes gleich« oder »dem Sohn Gottes ähnlich«
  rationale: Die passive Form von ἀφομοιόω bezeichnet eine hergestellte Ähnlichkeit und spricht gegen eine Gleichsetzung Melchisedeks mit dem Sohn.
- issue: Reichweite der Dauerformel εἰς τὸ διηνεκές
  choice: »für alle Zeit« mit erläuternder Fußnote
  alternative: »für immer« oder »unaufhörlich«
  rationale: Die Formulierung wahrt den bleibenden Charakter des Priestertums in der Argumentation des Hebräerbriefs und lässt die genaue Nuance der Dauer offen.
translation_notes:
  register: Gehobenes, aber gut verständliches modernes Standarddeutsch. Die dreifache Reihung mit »ohne« und die parallelen Aussagen zu Anfang und Ende bewahren den feierlichen Rhythmus und die theologische Spannung des griechischen Textes.
