  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Inhalt des Griechischen im Wesentlichen zutreffend wieder: Abraham teilt Melchisedek ein Zehntel von allem zu; anschließend werden die Bedeutungen von Melchisedeks Namen und von Salem erklärt. »Gerechtigkeit« ist für δικαιοσύνη angemessen, und »das heißt« gibt ὅ ἐστιν natürlich wieder.'
  naturalness: Der Satz ist grundsätzlich modernes Standarddeutsch. »Den zehnten Teil« klingt jedoch eher wie einen bestimmten, ordinal gezählten Anteil; »ein Zehntel« trifft die unbestimmte griechische Form und ist idiomatischer. Das unbetonte »sein Name« kann nach der Nennung Abrahams zudem kurz auf Abraham statt auf Melchisedek bezogen werden.
  terminology: »König der Gerechtigkeit«, »König von Salem« und »König des Friedens« sind sachgerecht. Die Schreibung »Melchisedek« entspricht dem üblichen deutschen biblischen Namen. Die Fußnoten bewahren die möglichen lexikalischen Alternativen, ohne eine theologische Deutung vorzugeben.
