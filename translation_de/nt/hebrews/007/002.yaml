source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: de
  text: dem Abraham auch ein Zehntel von allem zuteilte.[a] Zuerst bedeutet der Name Melchisedek »König der Gerechtigkeit«[b], dann aber auch »König von Salem«, das heißt »König des Friedens«.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Zehnten von allem«. Wörtlich steht im Griechischen »ein Zehntel«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »König des Rechts«. Das griechische Wort kann sowohl Gerechtigkeit als auch Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: dem
  rationale: Das Dativ-Relativpronomen bezieht sich auf Melchisedek; im Deutschen wird der Bezug im fortlaufenden Satz durch »dem« natürlich wiedergegeben.
- source_word: δεκάτην ἀπὸ πάντων
  choice: den zehnten Teil von allem
  rationale: Bewahrt die wörtliche Bedeutung »ein Zehntel« und drückt zugleich idiomatisch aus, dass Abraham diesen Anteil aus der Gesamtheit nahm.
- source_word: ἐμέρισεν
  choice: zuteilte
  rationale: Gibt den Gedanken des Abteilens beziehungsweise Zuweisens genauer wieder als das allgemeinere »gab«.
- source_word: ἑρμηνευόμενος
  choice: wird sein Name ... gedeutet
  rationale: Der Zusammenhang erklärt die Bedeutung des Namens Melchisedek. »Gedeutet« ist hier natürlicher als »übersetzt«, ohne die Aussage inhaltlich zu erweitern.
- source_word: βασιλεὺς δικαιοσύνης
  choice: König der Gerechtigkeit
  rationale: »Gerechtigkeit« ist die etablierte und kontextuell passende Wiedergabe von δικαιοσύνη; die mögliche Nuance »Recht« wird in einer Fußnote bewahrt.
- source_word: βασιλεὺς Σαλήμ
  choice: König von Salem
  rationale: Bei einem Ortsnamen ist »von Salem« im Deutschen die natürliche Bezeichnung eines Königs nach seinem Herrschaftsort.
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: das heißt »König des Friedens«
  rationale: Gibt die erklärende Wendung knapp und idiomatisch wieder und bewahrt die Genitivkonstruktion des Titels.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im erklärten Königstitel
  choice: Gerechtigkeit
  alternative: Recht
  rationale: »Gerechtigkeit« bewahrt die breite ethisch-theologische Bedeutung des griechischen Ausdrucks und die traditionelle Verbindung zum Namen Melchisedek. »Recht« ist möglich, aber enger, und wird daher als Alternative angemerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform schließt bewusst an den vorausgehenden Vers an. Die erklärten Titel stehen zur besseren Erkennbarkeit in deutschen Anführungszeichen; »von Salem« bezeichnet die Herrschaft über den Ort, während »des Friedens« die Namensdeutung wiedergibt.
