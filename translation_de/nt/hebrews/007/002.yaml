  - severity: low
    issue: Unklarer Bezug von »sein Name«
    rationale: Obwohl der Kontext Melchisedek als Bezugsfigur voraussetzt, kann »sein« nach dem unmittelbar genannten Abraham vorübergehend missverständlich sein. Die ausdrückliche Nennung Melchisedeks stellt den Bezug klar.
