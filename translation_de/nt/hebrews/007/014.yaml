  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: de
  text: Denn es ist offensichtlich, dass unser Herr aus Juda, einem Stamm, über den Mose nichts über Priester gesagt hat, hervorgegangen ist[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „aus Juda aufgegangen“ oder „aus Juda hervorgesprossen“. Das griechische Verb weckt das Bild des Aufgehens oder Hervorsprießens; hier bezeichnet es vor allem die Herkunft aus dem Stamm Juda, nicht die Auferstehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: es ist offensichtlich
  rationale: Das prädikative Adjektiv bezeichnet einen klar erkennbaren Sachverhalt. „Es ist offensichtlich“ gibt seine Aussagekraft in natürlichem, modernem Deutsch wieder.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorausgehenden Gedankengang.
- source_word: ἐξ Ἰούδα
  choice: aus Juda
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise Abstammung. Da unmittelbar danach ausdrücklich vom Stamm die Rede ist, muss „Stamm“ hier nicht ergänzt werden.
- source_word: ἀνατέταλκεν
  choice: hervorgegangen ist
  rationale: Das Perfekt von ἀνατέλλω trägt das Bild des Aufgehens oder Hervorsprießens. „Hervorgegangen ist“ bezeichnet hier verständlich die Herkunft aus Juda, ohne den Ausdruck primär auf die Auferstehung zu beziehen; die Bildhaftigkeit wird in der Fußnote kenntlich gemacht.
- source_word: ὁ κύριος ἡμῶν
  choice: unser Herr
  rationale: Die natürliche deutsche Wortstellung bewahrt den Titel κύριος und das Possessivpronomen, ohne den im Kontext erkennbaren Namen Jesus in den Text einzufügen.
- source_word: εἰς ἣν φυλήν
  choice: einem Stamm, über den
  rationale: Die Formulierung nimmt Juda als den gerade genannten Stamm wieder auf. „Über den“ gibt den Bezug im Deutschen idiomatisch wieder.
- source_word: περὶ ἱερέων οὐδὲν
  choice: nichts im Blick auf Priester
  rationale: Die Übersetzung wahrt den konkreten Plural „Priester“ statt des abstrakten Begriffs „Priestertum“ und gibt περί sachgerecht wieder.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Mose ... gesagt hat
  rationale: λαλέω bedeutet hier „sprechen/sagen“. Die deutsche Perfektform fügt sich natürlich in den Relativsatz ein.
theological_decisions:
- issue: Bezug von „unser Herr“
  choice: Der Titel bleibt als „unser Herr“ stehen; im Kontext bezieht er sich auf Jesus.
  alternative: Den Namen „Jesus“ ausdrücklich in den Text einfügen.
  rationale: Der Zusammenhang handelt von Jesu Herkunft aus Juda und seinem nichtlevitischen Priestertum. Da der griechische Wortlaut jedoch nur „unser Herr“ sagt, wird der Name nicht erläuternd ergänzt.
- issue: Bedeutung von ἀνατέταλκεν
  choice: Der Ausdruck bezeichnet bildhaft Herkunft beziehungsweise Abstammung aus Juda.
  alternative: „auferstanden ist“ als ausdrücklicher Bezug auf die Auferstehung.
  rationale: Die unmittelbare Argumentation betrifft die Stammeszugehörigkeit und die priesterliche Ordnung. Daher ist die Herkunft der primäre Sinn, während die griechische Bildsprache des Aufgehens beziehungsweise Hervorsprießens in einer Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der Begründungslogik des griechischen Textes, vermeidet aber eine unnatürlich wörtliche Wiedergabe. „Hervorgegangen“ hält den Herkunftssinn im Haupttext klar; die genuine Bildhaftigkeit des Verbs wird in der Fußnote dokumentiert.
