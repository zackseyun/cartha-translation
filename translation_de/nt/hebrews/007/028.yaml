source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: de
  text: Denn das Gesetz setzt Menschen, die mit Schwachheit behaftet sind, als Hohepriester ein; das Wort des Eides aber, der nach dem Gesetz erging, setzt einen Sohn ein, der für immer vollendet ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der für immer vollkommen gemacht worden ist“. Das griechische Wort kann im priesterlichen Zusammenhang auch „zur Vollendung gebracht“ oder „für den Dienst geweiht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Gemeint ist das mosaische Gesetz, besonders seine priesterlichen Bestimmungen; die Großschreibung entspricht dem deutschen Substantivgebrauch.
- source_word: καθίστησιν
  choice: setzt … ein
  rationale: Die Wendung bezeichnet hier die förmliche Einsetzung in das hohepriesterliche Amt und funktioniert für beide Satzhälften natürlich.
- source_word: ἀνθρώπους
  choice: Menschen
  rationale: Die Übersetzung wahrt den Gegensatz zwischen sterblichen, schwachen Menschen und einem Sohn. Dass die historischen Amtsinhaber Männer waren, ergibt sich aus dem hohenpriesterlichen Kontext.
- source_word: ἀρχιερεῖς
  choice: Hohepriester
  rationale: Der Plural bezeichnet die aufeinanderfolgenden Inhaber des hohenpriesterlichen Amtes.
- source_word: ἔχοντας ἀσθένειαν
  choice: die Schwachheit an sich tragen
  rationale: Die Formulierung bewahrt das Substantiv ἀσθένεια und bezeichnet menschliche Gebrechlichkeit beziehungsweise Anfälligkeit, nicht nur Krankheit.
- source_word: ὁ λόγος τῆς ὁρκωμοσίας
  choice: das Wort des Eides
  rationale: Die bewusst bibelsprachliche Wendung bezeichnet Gottes im Schriftwort ausgesprochene eidliche Erklärung.
- source_word: τῆς μετὰ τὸν νόμον
  choice: der nach dem Gesetz kam
  rationale: Das feminine Relativpronomen bezieht sich im Griechischen grammatisch auf ὁρκωμοσία und unterstreicht, dass der Eid zeitlich nach dem Gesetz erging.
- source_word: υἱόν
  choice: einen Sohn
  rationale: Der artikellose Akkusativ hebt die Eigenschaft und den Gegensatz zu Menschen hervor; der Kontext identifiziert den Sohn eindeutig als Jesus.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Dies ist im Zusammenhang des bleibenden Priestertums die natürliche deutsche Wiedergabe.
- source_word: τετελειωμένον
  choice: der … vollendet ist
  rationale: Das Perfekt Passiv beschreibt einen erreichten, fortdauernden Zustand. „Vollendet“ hält die Bedeutungsweite zwischen zur Vollendung gebracht, vollkommen gemacht und für den Priesterdienst zugerüstet offen.
theological_decisions:
- issue: Artikelloses υἱόν im Gegensatz zu ἀνθρώπους
  choice: einen Sohn
  alternative: den Sohn
  rationale: „Einen Sohn“ bildet die artikellose Form und den qualitativen Kontrast nach, ohne zu bestreiten, dass im Zusammenhang der einzigartige Sohn gemeint ist.
- issue: Bedeutung von τετελειωμένον in der Priestertheologie des Hebräerbriefs
  choice: der für immer vollendet ist
  alternative: der für immer vollkommen gemacht / geweiht worden ist
  rationale: Die Hauptfassung wahrt das Resultat des griechischen Perfekts und legt den vielschichtigen Begriff nicht einseitig auf moralische Vervollkommnung oder kultische Weihe fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Konstruktion „setzt … ein“ hält den scharfen Gegensatz zwischen Gesetz und Eid sowie zwischen Menschen und Sohn sichtbar. Das etwas gehobenere „Schwachheit an sich tragen“ bewahrt den nominalen Ausdruck des Griechischen, ohne ihn auf körperliche Krankheit zu verengen.
