base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/009.yaml
  text: And[a], so to speak, through Abraham even Levi, who receives tithes, has paid tithes[b],
translation:
  language: de
  text: Und, um es so auszudrücken, hat sogar Levi, der den Zehnten empfängt, durch Abraham den Zehnten entrichtet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sozusagen“; „gewissermaßen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht eine Passivform: wörtlich etwa „ist verzehntet worden“. Gemeint ist, dass Levi durch Abraham als jemand gilt, der den Zehnten entrichtet hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: sozusagen
  rationale: Die idiomatische Wendung kennzeichnet die Aussage als qualifizierte beziehungsweise bildhafte Rede; „sozusagen“ ist im heutigen Deutsch natürlich und bewahrt diese rhetorische Einschränkung.
- source_word: δι’ Ἀβραὰμ
  choice: durch Abraham
  rationale: 'διά mit Genitiv bezeichnet hier die vermittelte Beteiligung: Levis Entrichtung des Zehnten wird ihm durch die Handlung seines Vorfahren Abraham zugerechnet, ohne den zugrunde liegenden Zusammenhang weiter auszudeuten.'
- source_word: καὶ Λευὶ
  choice: sogar Levi
  rationale: καί hat hier steigernde, emphatische Kraft. „Sogar Levi“ macht die überraschende Folgerung des Arguments deutlich.
- source_word: ὁ δεκάτας λαμβάνων
  choice: der den Zehnten empfängt
  rationale: Das substantivierte Präsenspartizip beschreibt Levi nach seiner kennzeichnenden priesterlichen Funktion. Der Singular „den Zehnten“ ist im Deutschen die übliche Bezeichnung für die Abgabe.
- source_word: δεδεκάτωται
  choice: hat den Zehnten entrichtet
  rationale: Das griechische Perfekt Passiv ist ungewöhnlich komprimiert („ist verzehntet worden“), meint hier aber, dass Levi durch Abraham als Zehntengeber gilt. Die aktive deutsche Wiedergabe gibt den kontextuellen Sinn verständlich wieder; die Fußnote weist auf die Form und Spannung des Griechischen hin.
theological_decisions:
- issue: Repräsentative Beteiligung Levis an Abrahams Handlung
  choice: Levi gilt in einem qualifizierten Sinn als jemand, der durch Abraham den Zehnten entrichtet hat.
  alternative: Levi wird streng korporativ in seinem Vorfahren Abraham aufgefasst oder die Aussage wird als bloße rhetorische Figur verstanden.
  rationale: „Durch Abraham“ und „sozusagen“ bewahren sowohl die vermittelte Beteiligung als auch die ausdrückliche Einschränkung des Autors, ohne einen bestimmten dogmatischen Mechanismus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Den Zehnten entrichten“ ist verständlich und sachlich; die wörtliche, im Deutschen unnatürliche Passivform wird zur Wahrung der sprachlichen und theologischen Spannung in der Fußnote erläutert.
