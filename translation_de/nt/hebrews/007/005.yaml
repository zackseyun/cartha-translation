  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: de
  text: Und diejenigen von den Söhnen Levis, die das Priestertum empfangen, haben nach dem Gesetz das Gebot, vom Volk den Zehnten zu erheben, das heißt von ihren Brüdern[a], obwohl auch diese aus den Lenden Abrahams hervorgegangen sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihren israelitischen Volksgenossen“. Im Griechischen steht wörtlich „von ihren Brüdern“; die männliche Verwandtschaftsbezeichnung meint hier Angehörige desselben Volkes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „obwohl auch diese von Abraham abstammen“. Wörtlich: „aus den Lenden Abrahams hervorgegangen sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: diejenigen von den Söhnen Levis
  rationale: Bewahrt den partitiven Sinn von ἐκ und die familiäre Ausdrucksweise; gemeint sind nicht unterschiedslos alle Leviten, sondern diejenigen aus Levis Nachkommenschaft, die das Priesteramt erhalten.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: die das Priestertum empfangen
  rationale: „Empfangen“ gibt λαμβάνοντες als Übertragung beziehungsweise Zuweisung wieder, ohne eine eigenmächtige Übernahme anzudeuten.
- source_word: ἐντολὴν ἔχουσιν
  choice: haben … das Gebot
  rationale: Die nominale Konstruktion und die rechtlich-bundestheologische Kraft von ἐντολή bleiben erhalten; zugleich ist die deutsche Formulierung idiomatisch.
- source_word: ἀποδεκατοῦν
  choice: den Zehnten zu erheben
  rationale: Das Verb bezeichnet hier das Einziehen des Zehnten von anderen, nicht das eigene Entrichten. „Erheben“ ist im Deutschen eindeutig und angemessen.
- source_word: τὸν λαὸν
  choice: vom Volk
  rationale: Entspricht direkt dem griechischen Ausdruck; die folgende Erläuterung bestimmt das Volk näher als die israelitischen Brüder der Priester.
- source_word: κατὰ τὸν νόμον
  choice: nach dem Gesetz
  rationale: Gibt den normativen Sinn von κατά mit Akkusativ knapp und natürlich wieder.
- source_word: τοῦτ’ ἔστιν
  choice: das heißt
  rationale: Natürliche deutsche Kennzeichnung der erläuternden Apposition.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: von ihren Brüdern
  rationale: Bewahrt die maskuline Verwandtschaftssprache des Ausgangstextes. Eine Fußnote erläutert, dass im Zusammenhang die israelitischen Volksgenossen gemeint sind.
- source_word: καίπερ
  choice: obwohl
  rationale: Gibt die konzessive Kraft klar und idiomatisch wieder.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: aus den Lenden Abrahams hervorgegangen sind
  rationale: Bewahrt das konkrete Abstammungsbild, das für die Argumentation in Hebräer 7 bedeutsam ist. „Diese“ macht kenntlich, dass sich das griechische Akkusativpartizip auf die zuvor genannten Brüder bezieht.
theological_decisions:
- issue: Verwandtschaftssprache für die Angehörigen Israels
  choice: ihren Brüdern
  alternative: ihren israelitischen Volksgenossen
  rationale: Der Haupttext bewahrt ἀδελφούς als männliche Verwandtschaftsbezeichnung und damit das Bild gemeinsamer Abstammung; die umfassendere kontextuelle Bedeutung wird in der Fußnote erläutert.
- issue: Körperliches Abstammungsbild
  choice: aus den Lenden Abrahams hervorgegangen
  alternative: von Abraham abstammen
  rationale: Die konkrete Rede von Abrahams Lenden hält die körperliche Abstammungsvorstellung und ihre rhetorische Bedeutung im Gedankengang des Kapitels sichtbar.
- issue: Bezug des konzessiven Partizips
  choice: obwohl auch diese … hervorgegangen sind
  alternative: obwohl auch sie … hervorgegangen sind
  rationale: Das Akkusativpartizip ἐξεληλυθότας stimmt grammatisch mit τοὺς ἀδελφούς überein. „Diese“ verhindert, dass die Aussage irrtümlich nur auf die zehntenerhebenden Priester bezogen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch Kommas und die demonstrative Wiederaufnahme „diese“ eindeutig und gut lesbar gestaltet.
