  source_fidelity: 'Der deutsche Text bildet den griechischen Satzbau und seine Bezüge zuverlässig ab: Die priesterlich eingesetzten Angehörigen der Söhne Levis haben den gesetzlichen Auftrag, vom Volk den Zehnten zu erheben; „das heißt von ihren Brüdern“ erläutert τὸν λαόν. Der Konzessivsatz bezieht sich mit „diese“ zutreffend auf die genannten Brüder (τοὺς ἀδελφοὺς αὐτῶν), nicht nur auf die Priester. Das konkrete Abstammungsbild „aus den Lenden Abrahams hervorgegangen“ ist angemessen bewahrt.'
