  terminology: „Priestertum“, „Gebot“, „Gesetz“ und „den Zehnten erheben“ entsprechen dem rechtlich-kultischen Kontext. Die Fußnoten erläutern sowohl die kontextuelle Weite von „Brüdern“ als auch die idiomatische Bedeutung von „Lenden Abrahams“, ohne den Haupttext zu harmonisieren oder theologisch einzuengen.
