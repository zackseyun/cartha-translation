  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: de
  text: der nicht aufgrund einer gesetzlichen, das Fleisch betreffenden Vorschrift[a] Priester geworden ist, sondern aufgrund der Kraft eines unzerstörbaren Lebens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach einem Gesetz eines fleischlichen Gebots«; auch: »aufgrund einer körperlichen Vorschrift«.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »eines endlosen Lebens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: der
  rationale: Das Relativpronomen knüpft an die zuvor genannte Person an und bewahrt den syntaktischen Zusammenhang.
- source_word: κατὰ νόμον
  choice: aufgrund eines Gesetzes
  rationale: κατά mit Akkusativ bezeichnet hier Grundlage oder Maßstab. Der unbestimmte Ausdruck entspricht dem artikellosen νόμον und legt nicht unnötig eine ausdrückliche Benennung des mosaischen Gesetzes fest.
- source_word: ἐντολῆς σαρκίνης
  choice: mit einer das Fleisch betreffenden Vorschrift
  rationale: Die Formulierung gibt die Zuordnung der Vorschrift zum Gesetz verständlich wieder. »Das Fleisch betreffend« bewahrt den körperlichen beziehungsweise genealogischen Bezug, ohne fälschlich moralische Sündhaftigkeit anzudeuten.
- source_word: γέγονεν
  choice: Priester geworden ist
  rationale: Das Perfekt bezeichnet einen eingetretenen und fortbestehenden Zustand. »Priester« ergänzt das im unmittelbaren Zusammenhang vorausgesetzte Prädikatsnomen, das im Deutschen für einen natürlichen Satz nötig ist.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: sondern aufgrund der Kraft
  rationale: Die parallele Wiedergabe von κατά hebt den Gegensatz zwischen den beiden Grundlagen des Priestertums hervor.
- source_word: ζωῆς ἀκαταλύτου
  choice: eines unzerstörbaren Lebens
  rationale: ἀκατάλυτος bezeichnet etwas, das nicht aufgelöst, zerstört oder beendet werden kann. »Unzerstörbar« bewahrt mehr von dieser Bedeutungsbreite als lediglich »endlos«.
theological_decisions:
- issue: Bedeutung von σαρκίνης
  choice: das Fleisch betreffend
  alternative: fleischlich; körperlich
  rationale: Gemeint ist im Zusammenhang eine leibliche beziehungsweise abstammungsbezogene Voraussetzung, nicht moralische Sündhaftigkeit. Die Übersetzung wahrt den Kontrast zum unzerstörbaren Leben, ohne ihn dogmatisch zu überdeuten.
- issue: Bedeutung von ἀκαταλύτου
  choice: unzerstörbar
  alternative: endlos; unvergänglich
  rationale: »Unzerstörbar« umfasst sowohl die Fortdauer als auch die Unmöglichkeit der Auflösung oder Vernichtung; die traditionelle Wiedergabe »endlos« bleibt als Alternative in der Fußnote erhalten.
- issue: Im Griechischen ausgelassenes Prädikatsnomen zu γέγονεν
  choice: Priester geworden ist
  alternative: es geworden ist
  rationale: Der Kontext handelt ausdrücklich vom Priestertum. Die Ergänzung macht die griechische Ellipse in natürlichem Deutsch verständlich, ohne eine neue Aussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vorschrift« vermeidet die im Deutschen schwer verständliche Verbindung »Gesetz eines Gebots«; »das Fleisch betreffend« verhindert zugleich die verbreitete moralische Fehlinterpretation von »fleischlich«.
