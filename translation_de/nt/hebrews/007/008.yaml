id: HEB.7.8
reference: Hebrews 7:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: de
  text: Und hier empfangen sterbliche Menschen den Zehnten, dort aber einer, von dem bezeugt wird, dass er lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen ist im zweiten Satzteil das Empfangen des Zehnten nur mitgedacht. Die Formulierung stellt heraus, dass von Melchisedek bezeugt wird, er lebe; sie behauptet nicht ausdrücklich seine buchstäbliche Unsterblichkeit.
    reason: Erläuterung der Ellipse und Bewahrung der theologischen Spannung
lexical_decisions:
- source_word: ὧδε … ἐκεῖ
  choice: hier … dort
  rationale: Bewahrt den knappen deiktischen Gegensatz zwischen der gegenwärtigen levitischen Ordnung und der Darstellung Melchisedeks in der Schrift.
- source_word: δεκάτας
  choice: den Zehnten
  rationale: Die im Deutschen übliche Bezeichnung für die kultisch-rechtliche Abgabe; der Singular wird idiomatisch als Sammelbegriff gebraucht.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: sterbliche Menschen
  rationale: Gibt den durativen Gedanken des Partizips knapp wieder und hebt im Gegensatz zu Melchisedeks Darstellung die Sterblichkeit der levitischen Priester hervor.
- source_word: λαμβάνουσιν
  choice: empfangen
  rationale: Neutrale, kontextgerechte Wiedergabe ohne die zusätzliche Nuance eines aktiven Eintreibens.
- source_word: μαρτυρούμενος ὅτι ζῇ
  choice: einer, von dem bezeugt wird, dass er lebt
  rationale: Bewahrt den Passivcharakter und die Aussageform eines Zeugnisses. Zugleich ergibt die substantivische Wiedergabe des Partizips im Deutschen einen natürlichen Gegenpol zu den sterblichen Menschen.
theological_decisions:
- issue: Art des Gegensatzes zwischen den levitischen Priestern und Melchisedek
  choice: Melchisedek wird als einer bezeichnet, von dem bezeugt wird, dass er lebt.
  alternative: Melchisedek lebt buchstäblich und persönlich unsterblich fort.
  rationale: Der griechische Text formuliert die Aussage als Zeugnis und nicht als unmittelbare Erklärung ontologischer Unsterblichkeit. Die Übersetzung erhält diese Spannung und legt die Aussage nicht über den Wortlaut hinaus fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ellipse „dort aber einer“ bildet die knappe Struktur des Griechischen nach, bleibt verständlich und vermeidet eine unnötige Wiederholung des Verbs.
