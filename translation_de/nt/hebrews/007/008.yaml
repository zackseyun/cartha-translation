  source_fidelity: 'Der Text gibt den Gegensatz von ὧδε μὲν … ἐκεῖ δέ treffend mit „hier … dort aber“ wieder. „Sterbliche Menschen“ bildet ἀποθνῄσκοντες ἄνθρωποι angemessen ab; „den Zehnten“ ist als deutscher Sammelbegriff für δεκάτας idiomatisch. Die elliptische zweite Satzhälfte entspricht der griechischen Konstruktion: Das Empfangen ist dort nur vorausgesetzt, während Melchisedek als derjenige erscheint, von dem bezeugt wird, dass er lebt.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. Die Ellipse „dort aber einer“ ist in dieser kontrastierenden, literarischen Satzfügung verständlich und stilistisch vertretbar; sie bewahrt die Knappheit des Grundtexts besser als eine volle Ergänzung.
  terminology: „Zehnter“, „sterbliche Menschen“ und „bezeugt wird“ sind sachgerecht. Die Wiedergabe wahrt den Zeugnischarakter von μαρτυρούμενος und macht keine über den Text hinausgehende Aussage über eine buchstäbliche Unsterblichkeit Melchisedeks.
