  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: de
  text: Denn das Gesetz hat nichts zur Vollendung gebracht[a]; doch die Einführung einer besseren Hoffnung[b], durch die wir uns Gott nahen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat nichts vollkommen gemacht“. Das griechische Verb kann auch bedeuten: „hat nichts ans Ziel gebracht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „doch die Einführung einer besseren Hoffnung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: nichts
  rationale: Das substantivisch gebrauchte Neutrum im Akkusativ ist Objekt von ἐτελείωσεν; „nichts“ bewahrt die uneingeschränkte Verneinung.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ gibt die begründende beziehungsweise erläuternde Verbindung zum vorhergehenden Gedanken natürlich wieder.
- source_word: ἐτελείωσεν
  choice: zur Vollendung gebracht
  rationale: Die Wendung bewahrt den in Hebräer wichtigen Gedanken des Erreichens des vorgesehenen Ziels und vermeidet zugleich die mögliche Verengung von „vollkommen gemacht“ auf moralische Fehlerlosigkeit.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Gemeint ist im Kontext das mosaische Gesetz samt seiner priesterlichen Ordnung; die Großschreibung folgt der üblichen deutschen Bezeichnung, ohne zusätzliche Auslegung einzutragen.
- source_word: ἐπεισαγωγὴ
  choice: eingeführt wurde
  rationale: Die seltene Nominalbildung bezeichnet das zusätzliche beziehungsweise neue Hereinbringen. Die verbale deutsche Form ist idiomatisch und bewahrt den Vorgang, ohne dessen zeitliche Einordnung unnötig zu präzisieren.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ macht den deutlichen Gegensatz zur fehlenden Vollendungswirkung des Gesetzes sichtbar.
- source_word: κρείττονος ἐλπίδος
  choice: eine bessere Hoffnung
  rationale: „Besser“ erhält das leitende Vergleichsvokabular des Hebräerbriefs; der unbestimmte Artikel entspricht der artikellosen griechischen Wortgruppe natürlich.
- source_word: δι’ ἧς
  choice: durch die
  rationale: Das feminine Relativpronomen bezieht sich am natürlichsten auf die Hoffnung; „durch“ bezeichnet ihre vermittelnde Funktion.
- source_word: ἐγγίζομεν
  choice: wir uns Gott nahen
  rationale: „Sich Gott nahen“ bewahrt den kultischen und theologischen Klang des Verbs im Hebräerbrief und ist zugleich würdiges, verständliches Deutsch.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ steht als Ergänzung zu „sich nahen“; im Deutschen ist kein zusätzliches Verhältniswort nötig.
theological_decisions:
- issue: Bedeutung von τελειόω im Verhältnis zum Gesetz
  choice: Das Gesetz brachte nichts zur Vollendung.
  alternative: Das Gesetz machte nichts vollkommen.
  rationale: Die gewählte Formulierung bewahrt den Gedanken, dass das Gesetz nichts an das beabsichtigte Ziel führte, ohne zu behaupten, es habe überhaupt keinen Zweck oder keinerlei Wirkung gehabt. Zugleich bleibt die für Hebräer charakteristische Spannung zwischen Vollendung und Zugang zu Gott erhalten.
- issue: Elliptischer Gegensatz bei ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος
  choice: „eingeführt aber wurde eine bessere Hoffnung“
  alternative: „aber die Einführung einer besseren Hoffnung“ beziehungsweise „aber es gibt die Einführung einer besseren Hoffnung“
  rationale: Im Griechischen fehlt im zweiten Satzteil ein ausdrückliches finites Verb. Die deutsche Ergänzung „wurde“ stellt den Gegensatz verständlich dar, ohne einen Handelnden zu benennen oder die Hoffnung mit dem Gesetz gleichzusetzen.
- issue: Bezug von δι’ ἧς
  choice: Das Relativpronomen bezieht sich auf die bessere Hoffnung.
  alternative: Mittelbarer Bezug auf die Einführung der Hoffnung als Gesamtvorgang.
  rationale: Genus und unmittelbare Wortstellung weisen am natürlichsten auf ἐλπίδος, „Hoffnung“. Die Übersetzung lässt die Hoffnung als das Mittel erscheinen, durch das die Glaubenden sich Gott nahen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich Gott nahen“ ist leicht gehoben, erhält aber den kultischen Leitbegriff des Hebräerbriefs. Die Satzstellung mit nachgestelltem „aber“ spiegelt den griechischen Kontrast, ohne unnatürlich zu wirken.
