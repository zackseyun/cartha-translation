  terminology: „Gesetz“, „Vollendung“, „bessere Hoffnung“ und „uns Gott nahen“ sind konsistent, modern verständlich und bewahren die für Hebräer charakteristischen Begriffe, ohne konfessionelle Deutung hinzuzufügen.
