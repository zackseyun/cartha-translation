    issue: Die Wiedergabe von καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι als „von dem nicht gesagt wird, er sei nach der Ordnung Aarons“
    rationale: 'Das Griechische koordiniert zwei von τίς ἔτι χρεία abhängige Infinitive: das Auftreten eines anderen Priesters und sein Nicht-Genanntwerden nach Aarons Ordnung. Die Relativsatzumschreibung ist verständlich, bildet diese Abhängigkeit aber weniger klar ab und verändert die Aussage leicht in eine Behauptung über das, was über den Priester gesagt wird.'
