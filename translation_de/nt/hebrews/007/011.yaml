id: HEB.7.11
reference: Hebrews 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: de
  text: Wenn nun die Vollendung durch das levitische Priestertum gekommen wäre – denn auf dessen Grundlage hat das Volk das Gesetz empfangen[a] –, wozu hätte dann noch ein anderer Priester nach der Ordnung Melchisedeks auftreten sollen, der nicht nach der Ordnung Aarons genannt wird?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn unter diesem Priestertum wurde dem Volk das Gesetz gegeben“.'
    reason: Die griechische Wendung kann formaler wiedergegeben werden; gemeint ist, dass die Gesetzesordnung Israels auf dem levitischen Priestertum beruhte.
  - marker: b
    text: 'Wörtlicher: „und nicht nach der Ordnung Aarons bezeichnet werden“.'
    reason: Das griechische λέγεσθαι kann sowohl das Gesagtwerden als auch die Bezeichnung beziehungsweise Zuordnung ausdrücken.
lexical_decisions:
- source_word: τελείωσις
  choice: Vollendung
  rationale: „Vollendung“ bewahrt den kultisch-heilsgeschichtlichen Gehalt des Begriffs im Hebräerbrief, ohne ihn auf moralische Vollkommenheit einzuengen.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: durch das levitische Priestertum
  rationale: διά mit Genitiv bezeichnet hier das Mittel; die deutsche Formulierung folgt dem Gedankengang klar und eng.
- source_word: ἐπ’ αὐτῆς
  choice: auf dessen Grundlage
  rationale: Das Pronomen bezieht sich am natürlichsten auf das levitische Priestertum. Der Genuswechsel zu „dessen“ ist durch das deutsche Neutrum „Priestertum“ bedingt.
- source_word: νενομοθέτηται
  choice: hat das Gesetz empfangen
  rationale: Die Perfektform bezeichnet den fortwirkenden Zustand des Volkes, dem das Gesetz gegeben wurde. Diese Wiedergabe ist idiomatischer als eine wörtliche Passivkonstruktion.
- source_word: τίς ἔτι χρεία
  choice: wozu hätte dann noch ... müssen
  rationale: Die rhetorische Frage nach einer weiterhin bestehenden Notwendigkeit wird in natürlichem Deutsch als „wozu ... noch ... müssen“ ausgedrückt.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: nach der Ordnung Melchisedeks
  rationale: „Nach der Ordnung“ ist die geläufige und präzise Wiedergabe für eine Ordnung, Zuordnung oder ein maßgebendes Muster.
- source_word: ἕτερον ... ἱερέα
  choice: ein anderer Priester
  rationale: Der folgende Gegensatz zur Ordnung Aarons verdeutlicht, dass ein Priester anderer Art gemeint ist, ohne dass dies im Deutschen zusätzlich erklärt werden muss.
- source_word: ἀνίστασθαι
  choice: auftreten
  rationale: Gemeint ist hier das Hervortreten beziehungsweise Einsetzen eines Priesters. „Auftreten“ ist natürlich und vermeidet eine unbeabsichtigte Festlegung auf Auferweckung.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: von dem nicht gesagt wird, er sei ...
  rationale: Die Formulierung bewahrt den Aussage- und Bezeichnungscharakter von λέγεσθαι und ergibt im Deutschen eine klare Gegenüberstellung.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melchisedek / Aaron
  rationale: Die Namen folgen den etablierten deutschen Bibelschreibungen.
theological_decisions:
- issue: Bedeutung von τελείωσις im priesterlichen Argument des Hebräerbriefs
  choice: Vollendung
  alternative: Vollkommenheit; vollkommen machen; ungehinderter Zugang zu Gott
  rationale: „Vollendung“ lässt den umfassenden kultischen und heilsgeschichtlichen Sinn offen und reduziert den Ausdruck weder auf moralische Fehlerlosigkeit noch auf eine bloß äußere Fertigstellung.
- issue: Bezugswort von αὐτῆς in ἐπ’ αὐτῆς νενομοθέτηται
  choice: das levitische Priestertum
  alternative: das Gesetz; die Bundesordnung im Allgemeinen
  rationale: Das nächstliegende passende Bezugswort ist „Priestertum“; die Parenthese erklärt damit, dass die Gesetzesordnung des Volkes auf diesem Priestertum beruhte.
- issue: Verhältnis von Melchisedeks und Aarons Ordnung
  choice: Die unterschiedliche Zuordnung wird sprachlich bewahrt, ohne ihr Verhältnis weiter auszudeuten.
  alternative: Den anderen Priester ausdrücklich als Ablösung oder Abschaffung des aaronitischen Priestertums bezeichnen
  rationale: Der Vers fragt nach der Notwendigkeit eines anders zugeordneten Priesters, formuliert aber an dieser Stelle noch nicht alle Folgerungen. Die Übersetzung soll diese Spannung nicht vorwegnehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Parenthese bleibt sichtbar; unnötig technische oder konfessionell festgelegte Formulierungen werden vermieden.
