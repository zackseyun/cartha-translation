revisions:
- from: Wenn nun die Vollendung durch das levitische Priestertum gekommen wäre – denn auf dessen Grundlage hat das Volk das Gesetz empfangen[a] –, wozu hätte dann noch ein anderer Priester nach der Ordnung Melchisedeks auftreten müssen, von dem nicht gesagt wird, er sei nach der Ordnung Aarons?[b]
  to: Wenn nun die Vollendung durch das levitische Priestertum gekommen wäre – denn auf dessen Grundlage hat das Volk das Gesetz empfangen[a] –, wozu hätte dann noch ein anderer Priester nach der Ordnung Melchisedeks auftreten sollen, der nicht nach der Ordnung Aarons genannt wird?[b]
  rationale: Die Schlussfrage wird so umgestellt, dass „ein anderer Priester“ zugleich als einer charakterisiert wird, der nach Melchisedeks Ordnung auftritt und nicht nach Aarons Ordnung genannt wird. Dies bewahrt den Kontrast und die syntaktische Bindung an die rhetorische Frage, ohne die im Griechischen offene Nuance von λέγεσθαι dogmatisch auszudeuten. Die vorhandenen Fußnoten bleiben inhaltlich zutreffend und ihre Anker sind unverändert korrekt gesetzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:45:09Z'
