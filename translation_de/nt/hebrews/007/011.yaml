  verdict: revise
  source_fidelity: 'Die Grundwiedergabe trifft den Gedankengang und die zentralen Begriffe weitgehend: τελείωσις ist angemessen als „Vollendung“ wiedergegeben, ἐπ’ αὐτῆς wird zutreffend auf das levitische Priestertum bezogen, und die Namen entsprechen dem deutschen Bibelgebrauch. Die Schlusspartie gibt jedoch die koordinierte griechische Infinitivkonstruktion nicht ganz präzise wieder. „von dem nicht gesagt wird, er sei …“ verschiebt die Aussage zu einer unabhängigen Relativbehauptung und lässt die Frage nach der Notwendigkeit des Nicht-Genanntwerdens weniger unmittelbar erkennen.'
  naturalness: Der Satz ist insgesamt modernes, gut verständliches Standarddeutsch. Die Überarbeitung macht den Schluss zugleich natürlicher und syntaktisch näher am Griechischen. „Nun“ kann hier als idiomatischer Träger der inferenziellen Kraft von οὖν stehen und muss nicht gestrichen werden.
  terminology: „Levitisches Priestertum“, „Vollendung“, „Ordnung Melchisedeks“ und „Ordnung Aarons“ sind sachgerecht und registerangemessen. Für λέγεσθαι ist „genannt werden“ im Deutschen direkter und natürlicher als die umschreibende Konstruktion „von dem nicht gesagt wird, er sei“.
  issues:
