source:
  edition: SBLGNT
  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: de
  text: Doch weil er für immer bleibt, hat er das Priestertum auf Dauer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat ein unveränderliches Priestertum“; auch: „hat ein Priestertum, das nicht auf einen anderen übergeht“. Das griechische Adjektiv kann beide Nuancen tragen. Im Zusammenhang liegt der Nachdruck darauf, dass sein Priestertum nicht an einen Nachfolger übergeht, weil er für immer lebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Doch … er
  rationale: Der substantivierte Artikel verweist im Gegensatz zu den vielen früheren Priestern auf Jesus zurück; δέ wird mit „doch“ adversativ wiedergegeben.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: weil er … bleibt
  rationale: διά mit substantiviertem Infinitiv bezeichnet hier den Grund. „Bleibt“ bewahrt den Gedanken des fortdauernden Bestehens im Gegensatz zu den sterblichen Priestern.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die Wendung bezeichnet zeitlich unbegrenzte Dauer und wird in natürlichem modernem Deutsch mit „für immer“ wiedergegeben.
- source_word: ἀπαράβατον
  choice: auf Dauer
  rationale: Das Adjektiv kann sowohl die Unveränderlichkeit als auch die Nichtübertragbarkeit des Priestertums ausdrücken. „Auf Dauer“ gibt die kontextuelle Pointe wieder, ohne die echte Bedeutungsbreite im Haupttext einseitig festzulegen.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: hat … das Priestertum
  rationale: ἔχω bezeichnet den Besitz beziehungsweise das Innehaben des priesterlichen Amtes. Die schlichte Formulierung ist im Deutschen klar und würdig.
- source_word: ἱερωσύνην
  choice: Priestertum
  rationale: Der Begriff bezeichnet das priesterliche Amt oder dessen Status; „Priestertum“ ist hier die geläufige und präzise Wiedergabe.
theological_decisions:
- issue: Bedeutung von ἀπαράβατον im Blick auf Jesu Priestertum
  choice: „auf Dauer“, wodurch die fortwährende Geltung seines Priestertums betont wird
  alternative: „unveränderlich“ oder „nicht übertragbar“
  rationale: Der Zusammenhang stellt Jesus den sterblichen und daher aufeinanderfolgenden Priestern gegenüber. Die Übersetzung wahrt diese Aussage, ohne eine der möglichen Nuancen des griechischen Adjektivs zur alleinigen technischen Deutung zu machen; die Alternativen werden in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung setzt den begründenden Nebensatz voran und lässt den Gegensatz durch „Doch“ klar hervortreten.
