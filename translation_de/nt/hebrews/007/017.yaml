  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: de
  text: 'Denn es wird bezeugt: »Du bist Priester in Ewigkeit nach der Ordnung Melchisedeks.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach der Art Melchisedeks«.'
    reason: lexical_alternative
  - marker: b
    text: Zitat aus Psalm 110,4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: es wird bezeugt
  rationale: Die präsentische Passivform wird unpersönlich wiedergegeben und führt hier das Zeugnis der Schrift ein, ohne dessen Subjekt ausdrücklich festzulegen.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet beziehungsweise stützt die vorausgehende Aussage und wird im Deutschen natürlich mit »denn« wiedergegeben.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι leitet den Inhalt des Zeugnisses ein; vor dem direkten Zitat ist im Deutschen ein Doppelpunkt idiomatisch.
- source_word: Σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen bewahrt die direkte, nachdrückliche Anrede des Psalmzitats.
- source_word: ἱερεὺς
  choice: Priester
  rationale: Die Bezeichnung wird ohne Erweiterung zu »Hohepriester« übersetzt, da der griechische Text hier lediglich ἱερεύς hat.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. »In Ewigkeit« ist im Deutschen klar, würdig und für ein Schriftzitat angemessen.
- source_word: κατὰ τὴν τάξιν
  choice: nach der Ordnung
  rationale: Die Wendung bezeichnet die Zuordnung zu einer Ordnung beziehungsweise einem bestimmten Typus. »Nach der Ordnung« ist prägnant, geläufig und bewahrt die mögliche fachliche Bedeutung von τάξις.
- source_word: Μελχισέδεκ
  choice: Melchisedek
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions:
- issue: Priesterliche Bezeichnung im Psalmzitat ohne nachträgliche dogmatische Erweiterung
  choice: »Du bist Priester in Ewigkeit«
  alternative: »Du bist Hohepriester in Ewigkeit«
  rationale: Der Ausgangstext hat ἱερεύς, »Priester«, nicht ἀρχιερεύς, »Hohepriester«. Obwohl der Hebräerbrief Jesus andernorts als Hohepriester bezeichnet, darf diese Aussage hier nicht entsprechend erweitert werden.
- issue: Bedeutung von κατὰ τὴν τάξιν Μελχισέδεκ
  choice: »nach der Ordnung Melchisedeks«
  alternative: »nach der Art Melchisedeks«
  rationale: »Ordnung« bewahrt die Mehrdeutigkeit zwischen geordneter Zuordnung, Rangfolge und typologischer Entsprechung, ohne die Aussage auf bloße Ähnlichkeit zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die passive Einleitungsform und die knappe Gestalt des Psalmzitats bleiben erhalten. »In Ewigkeit« entspricht dem gehobenen Zitatcharakter, ist aber weiterhin allgemein verständlich.
