source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: de
  text: 'Bedenkt, wie groß dieser Mann war: Ihm gab Abraham, der Patriarch, ein Zehntel[a] der Kriegsbeute[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Zehnten“. Das Griechische sagt wörtlich „ein Zehntel“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet Kriegsbeute und kann möglicherweise besonders auf deren beste oder erlesenste Teile anspielen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Bedenkt
  rationale: Der Präsensimperativ im Plural fordert die Leser zu aufmerksamer Betrachtung und Schlussfolgerung auf. „Bedenkt“ gibt diese Aufforderung in natürlichem, heutigem Deutsch wieder.
- source_word: δὲ
  choice: durch den fortführenden Satzanschluss ausgedrückt
  rationale: δέ markiert hier nur einen leichten Übergang. Ein ausdrückliches „aber“ würde im Deutschen einen stärkeren Gegensatz nahelegen, als der griechische Text verlangt.
- source_word: πηλίκος
  choice: wie groß
  rationale: Die Wendung bewahrt die offene Aussage über Größe bzw. Rang, ohne sie bereits als „überlegen“ oder „erhaben“ theologisch auszudeuten.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Das Demonstrativpronomen verweist auf Melchisedek. „Dieser Mann“ ist im Deutschen natürlicher als das wörtlichere „dieser“ und legt nicht mehr fest als der männliche Bezug im Kontext.
- source_word: ᾧ
  choice: Ihm
  rationale: Die Voranstellung in einem neuen Hauptsatz bildet die relative Beziehung klar und idiomatisch ab und hebt den Empfänger hervor.
- source_word: δεκάτην
  choice: ein Zehntel
  rationale: Dies entspricht unmittelbar dem griechischen Ausdruck und vermeidet, im Haupttext unnötig spätere institutionelle Vorstellungen mit „der Zehnte“ aufzurufen.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Gebräuchliche deutsche Namensform.
- source_word: ἔδωκεν
  choice: gab
  rationale: Schlichte und genaue Wiedergabe des Aorists von δίδωμι.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: der Kriegsbeute
  rationale: ἀκροθίνια bezeichnet hier im Krieg erlangte Beute. Der Genitiv nach „ein Zehntel“ ist im Deutschen idiomatisch und gibt den Anteil aus der Beute wieder; eine mögliche Nuance der besten Stücke wird in der Fußnote bewahrt.
- source_word: ὁ πατριάρχης
  choice: der Stammvater
  rationale: Die Bezeichnung hebt Abrahams herausragende Stellung als Ahnherr hervor. „Stammvater“ ist für heutige Leser unmittelbarer verständlich als das fachsprachlichere „Patriarch“.
theological_decisions:
- issue: Aussage über Melchisedeks Größe
  choice: Die Größe Melchisedeks wird durch Abrahams Gabe hervorgehoben, ohne die daraus folgende Rangordnung ausdrücklich auszuformulieren.
  alternative: Man könnte die Aussage mit „wie erhaben“ oder durch ein ergänztes „sogar Abraham“ stärker als ausdrückliche Überordnung wiedergeben.
  rationale: Der Vers fordert dazu auf, Melchisedeks Größe an Abrahams Handlung zu erkennen. Die weitergehende theologische Folgerung gehört in den Argumentationszusammenhang und sollte nicht stillschweigend in den Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gestaltet den griechischen Relativanschluss lesbar, ohne seine Begründungsfunktion zu verlieren. Die Anrede steht entsprechend dem griechischen Plural in der vertrauten gemeinschaftlichen Form „Bedenkt“.
