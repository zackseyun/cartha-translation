id: HEB.7.25
reference: Hebrews 7:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: de
  text: Daher kann er auch diejenigen, die durch ihn zu Gott kommen, vollständig[a] retten, denn er lebt allezeit, um für sie einzutreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für immer«; traditionell auch: »bis zum Äußersten«.'
    reason: 'Lexikalische Alternative: εἰς τὸ παντελές kann sowohl vollständige als auch zeitlich unbegrenzte Rettung ausdrücken.'
lexical_decisions:
- source_word: ὅθεν
  choice: Daher
  rationale: Kennzeichnet die Folgerung aus dem zuvor dargelegten bleibenden Priestertum Jesu und stellt den logischen Anschluss natürlich her.
- source_word: καὶ
  choice: auch
  rationale: 'Bewahrt die additive Kraft: Aus seinem bleibenden Priestertum folgt auch seine Fähigkeit zu retten.'
- source_word: σῴζειν
  choice: retten
  rationale: Ist im soteriologischen Zusammenhang die geläufige und gewichtige deutsche Entsprechung.
- source_word: εἰς τὸ παντελές
  choice: vollständig
  rationale: Gibt zunächst den umfassenden Sinn der Wendung wieder, ohne ihre mögliche zeitliche Bedeutung stillschweigend auszuschließen; diese wird in der Fußnote bewahrt.
- source_word: δύναται
  choice: kann
  rationale: Drückt in natürlichem modernem Deutsch die durch sein bleibendes Priestertum begründete Fähigkeit aus.
- source_word: τοὺς προσερχομένους
  choice: die, die … zu Gott kommen
  rationale: Gibt das Hinzutreten zu Gott verständlich und natürlich wieder; der durch den Hebräerbrief geprägte Zug des Zugangs zu Gott bleibt durch die Ergänzung „zu Gott“ erhalten.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: 'Bewahrt den Gedanken der Vermittlung: Der Zugang zu Gott erfolgt durch Jesus.'
- source_word: τῷ θεῷ
  choice: zu Gott
  rationale: Entspricht der Verbindung mit προσέρχομαι und bezeichnet klar das Ziel des Hinzutretens.
- source_word: πάντοτε ζῶν
  choice: denn er lebt allezeit
  rationale: Gibt den begründenden Sinn des Partizips sowie die fortdauernde Bedeutung von πάντοτε wieder; „allezeit“ ist würdig und zugleich verständlich.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: um … einzutreten
  rationale: Gibt die Zweckbeziehung wieder und bezeichnet sein fortwährendes Eintreten zugunsten anderer in natürlichem Deutsch.
- source_word: ὑπὲρ αὐτῶν
  choice: für sie
  rationale: Drückt knapp und idiomatisch Vertretung und Begünstigung aus.
theological_decisions:
- issue: Bedeutungsumfang von εἰς τὸ παντελές
  choice: Im Haupttext mit „vollständig“ wiedergegeben
  alternative: „für immer“; traditionell auch „bis zum Äußersten“
  rationale: Die Wendung kann vollständige beziehungsweise äußerste Rettung oder dauerhafte Rettung bezeichnen. Der Kontext stützt durch Jesu immerwährendes Leben auch die zeitliche Dimension. Der Haupttext betont den umfassenden Sinn, während die Fußnote die zeitliche und traditionelle Wiedergabe offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, ohne im Deutschen schwerfällig zu wirken. „Allezeit“ erhält einen leicht gehobenen biblischen Ton; die übrige Wortwahl ist allgemein verständlich.
