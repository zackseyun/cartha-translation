source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: de
  text: 'Nachdem er zuvor gesagt hat: „Schlachtopfer und Gaben, Ganzbrandopfer und Sündopfer hast du nicht gewollt und an ihnen kein Wohlgefallen gehabt“ – die nach dem Gesetz dargebracht werden –,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Nachdem er zuvor gesagt hat
  rationale: Die Wendung verweist auf den unmittelbar zuvor angeführten Teil des Zitats und leitet dann dessen Fortsetzung ein. Die deutsche Formulierung gibt diese Abfolge natürlich wieder.
- source_word: Θυσίας καὶ προσφορὰς
  choice: Schlachtopfer und Gaben
  rationale: „Schlachtopfer“ bezeichnet θυσίαι im kultischen Zusammenhang präzise; „Gaben“ hält προσφοραί davon unterscheidbar, ohne den Opferbegriff unnötig zu wiederholen.
- source_word: ὁλοκαυτώματα
  choice: Ganzbrandopfer
  rationale: Der etablierte deutsche Kultbegriff macht deutlich, dass das Opfer vollständig verbrannt wurde.
- source_word: περὶ ἁμαρτίας
  choice: Sündopfer
  rationale: Die Wendung wird im kultischen Kontext als Bezeichnung einer Opferkategorie gebraucht; „Sündopfer“ gibt diese technische Bedeutung knapp wieder.
- source_word: οὐκ ἠθέλησας
  choice: hast du nicht gewollt
  rationale: „Wollen“ entspricht dem gewöhnlichen Sinn von θέλω und bewahrt die markante Aussage des Zitats, ohne sie interpretierend abzuschwächen.
- source_word: οὐδὲ εὐδόκησας
  choice: und an ihnen kein Wohlgefallen gehabt
  rationale: Die Ergänzung „an ihnen“ nimmt im Deutschen eindeutig die aufgezählten Opfer auf. „Wohlgefallen haben“ bewahrt den Unterschied gegenüber „wollen“ und den würdigen Ton des Zitats.
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: obwohl sie nach dem Gesetz dargebracht werden
  rationale: Das Relativpronomen greift alle genannten Opferarten auf. „Nach dem Gesetz“ gibt die Normgemäßheit wieder; „obwohl“ macht den im Kontext hervorgehobenen Gegensatz verständlich, ohne zu behaupten, die Opfer seien ungesetzlich.
theological_decisions:
- issue: Gottes Ablehnung der Opfer trotz ihrer Darbringung nach dem Gesetz
  choice: 'Die Spannung bleibt ausdrücklich stehen: Gott wollte diese Opfer nicht und hatte kein Wohlgefallen an ihnen, obwohl sie nach dem Gesetz dargebracht werden.'
  alternative: Den Relativsatz rein beschreibend mit „die nach dem Gesetz dargebracht werden“ wiederzugeben.
  rationale: Der griechische Text stellt beide Aussagen nebeneinander. Die Übersetzung darf weder die göttliche Ablehnung abschwächen noch daraus folgern, das Gesetz sei illegitim gewesen.
- issue: Kultische Bedeutung von περὶ ἁμαρτίας
  choice: Sündopfer
  alternative: Opfer für die Sünde
  rationale: Im Opferkatalog bezeichnet die Wendung am wahrscheinlichsten eine kultische Kategorie. Die Alternative ist wörtlicher, aber im Deutschen weniger eindeutig als Fachbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe sind verständlich und präzise. Der Vers bleibt entsprechend seiner syntaktischen Funktion zum folgenden Vers hin offen und endet daher mit einem Komma.
