  source_fidelity: Der Imperativ »Werft ... nicht weg« gibt μὴ ἀποβάλητε treffend als bewusste Preisgabe wieder; »Zuversicht« ist für παρρησία im Zusammenhang vertretbar. Die bisherige Zukunfts-Passivform »sie wird reich belohnt werden« verändert jedoch die präsentische Formulierung ἔχει und verschiebt die Aussage von der Zuversicht selbst auf eine nicht genannte Person.
  naturalness: Die Überarbeitung bleibt idiomatisches modernes Standarddeutsch. »Mit großem Lohn verbunden ist« ist natürlicher als ein wörtliches »großen Lohn hat« und vermeidet zugleich die sachlich nicht im Griechischen ausgedrückte Zukunftsform.
