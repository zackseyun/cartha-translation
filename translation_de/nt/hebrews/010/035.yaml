base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: de
  text: Werft daher eure Zuversicht nicht weg, die mit großem Lohn verbunden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Freimütigkeit«. Wörtlich: »die großen Lohn hat«. Das griechische Wort kann zuversichtliche Freiheit oder Offenheit bezeichnen, besonders im Zugang zu Gott.'
    reason: lexikalische und formale Übersetzungsalternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: Werft … nicht weg
  rationale: Der Aorist Konjunktiv mit μή formuliert ein Verbot. »Wegwerfen« bewahrt den Gedanken einer bewussten Preisgabe und ist im Deutschen natürlich.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Abschnitt; »also« stellt den logischen Anschluss knapp und idiomatisch her.
- source_word: τὴν παρρησίαν ὑμῶν
  choice: eure Zuversicht
  rationale: παρρησία bezeichnet hier vertrauensvolle Freiheit und Offenheit vor Gott sowie standhaftes Glaubensvertrauen. »Zuversicht« ist im modernen Deutschen natürlicher als »Freimütigkeit«, ohne den Grundsinn auf bloßes inneres Sicherheitsgefühl zu verengen.
- source_word: ἥτις ἔχει μεγάλην μισθαποδοσίαν
  choice: sie wird reich belohnt werden
  rationale: Die idiomatische deutsche Formulierung gibt den Sinn wieder, dass diese Zuversicht mit großer Belohnung verbunden ist. Sie vermeidet das unnatürliche »sie hat eine große Belohnung«, ohne den Träger oder Zeitpunkt der Belohnung näher festzulegen.
theological_decisions:
- issue: Bedeutung von παρρησία
  choice: Zuversicht
  alternative: Freimütigkeit; fester Mut
  rationale: Der Ausdruck umfasst in Hebräer sowohl den freien, vertrauensvollen Zugang zu Gott als auch standhaftes öffentliches Glaubensvertrauen. »Zuversicht« hält diese Beziehungsoffenheit fest; die Fußnote nennt die weitere Bedeutungsbreite.
- issue: Beziehung zwischen Zuversicht und Belohnung
  choice: sie wird reich belohnt werden
  alternative: sie hat großen Lohn
  rationale: Die Übersetzung erhält die positive, wahrscheinlich endzeitliche Belohnungsaussage, legt aber weder einen mechanisch-transaktionalen Zusammenhang noch den genauen Zeitpunkt ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der bildhafte und willentliche Charakter von »wegwerfen« bleibt erhalten. Die Hauptfassung formuliert den Belohnungssatz idiomatisch; die formalere Struktur und die Bedeutungsbreite von παρρησία werden in der Fußnote dokumentiert.
