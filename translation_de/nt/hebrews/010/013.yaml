  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: de
  text: und wartet[a] von da an, bis seine Feinde zum Schemel für seine Füße gemacht werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und erwartet von da an“. Das griechische Partizip bezeichnet ein Warten, das von Erwartung geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Formulierung greift Psalm 110,1 auf: „Setze dich zu meiner Rechten, bis ich deine Feinde zum Schemel für deine Füße mache.“'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: von da an
  rationale: Die substantivierte Neutrumform wird adverbial gebraucht und bezeichnet die Zeit nach dem in Vers 12 genannten Sichsetzen. „Von da an“ ist natürlich und präzise.
- source_word: ἐκδεχόμενος
  choice: wartet … darauf
  rationale: Das Partizip bezeichnet ein fortdauerndes, erwartungsvolles Warten. Die deutsche Konstruktion „darauf warten, dass“ gibt den Anschluss an den ἕως-Satz idiomatisch wieder.
- source_word: ἕως
  choice: dass … gemacht werden
  rationale: In Verbindung mit „darauf warten“ wird der durch ἕως bezeichnete zeitliche Endpunkt im Deutschen natürlich durch einen dass-Satz ausgedrückt; die Bedeutung „bis“ bleibt sachlich erhalten.
- source_word: τεθῶσιν
  choice: gemacht werden
  rationale: Der Aorist Passiv Konjunktiv von τίθημι wird passiv wiedergegeben. Mit dem Prädikatsnomen „Schemel“ ist „zum Schemel gemacht werden“ im Deutschen idiomatisch.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: seine Feinde
  rationale: Direkte und natürliche Wiedergabe der Genitivverbindung.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: zum Schemel für seine Füße
  rationale: Die konkrete Bildsprache aus Psalm 110,1 wird bewahrt. „Schemel für seine Füße“ ist würdevoll und verständlich, ohne das Bild als bloße Niederlage zu paraphrasieren.
theological_decisions:
- issue: Messianisches Thronbesteigungsbild aus Psalm 110,1
  choice: Das konkrete Bild, dass die Feinde zum Schemel für seine Füße gemacht werden, bleibt erhalten.
  alternative: bis seine Feinde besiegt oder ihm unterworfen sind
  rationale: Hebräer greift bewusst Psalm 110,1 auf. Die Bildsprache trägt die intertextuelle und christologische Aussage und soll nicht erklärend aufgelöst werden.
- issue: Handelnder beim Unterwerfen der Feinde
  choice: Die Passivform „gemacht werden“ bleibt ohne ausdrückliche Nennung des Handelnden erhalten.
  alternative: bis Gott seine Feinde zum Schemel für seine Füße macht
  rationale: Das griechische Passiv lässt den Handelnden unausgesprochen. Obwohl der Psalmkontext Gott nahelegt, soll die Übersetzung nichts ausdrücklich ergänzen, was im Vers selbst implizit bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist syntaktisch an Vers 12 angeschlossen; deshalb beginnt er mit „und“. Die traditionelle, aber weiterhin verständliche Bildbezeichnung „Schemel“ bewahrt den Psalmanklang.
