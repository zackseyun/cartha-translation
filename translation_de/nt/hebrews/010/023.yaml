  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: de
  text: Lasst uns am Bekenntnis der Hoffnung unbeirrbar festhalten, denn der, der verheißen hat, ist treu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέχωμεν
  choice: Lasst uns … festhalten
  rationale: Der hortative Konjunktiv der ersten Person Plural wird als gemeinschaftliche Aufforderung wiedergegeben; „festhalten“ bewahrt den Gedanken des beharrlichen Bewahrens.
- source_word: ὁμολογίαν
  choice: Bekenntnis
  rationale: „Bekenntnis“ bezeichnet hier die erklärte beziehungsweise öffentlich festgehaltene Überzeugung und ist im Deutschen natürlich und theologisch nicht verengend.
- source_word: τῆς ἐλπίδος
  choice: der Hoffnung
  rationale: Der Genitiv wird ohne ergänztes Possessivpronomen wiedergegeben, da das Deutsche „Bekenntnis der Hoffnung“ verständlich zulässt und so die Form des griechischen Textes wahrt.
- source_word: ἀκλινῆ
  choice: unbeirrbar
  rationale: Das Adjektiv beschreibt das Bekenntnis als nicht schwankend oder abweichend; adverbial bei „festhalten“ ergibt es eine natürliche deutsche Formulierung mit derselben Aufforderung zur Standhaftigkeit.
- source_word: πιστὸς
  choice: treu
  rationale: „Treu“ bewahrt sowohl die Aussage der Verlässlichkeit als auch den theologischen Klang des griechischen πιστός.
- source_word: ὁ ἐπαγγειλάμενος
  choice: der, der die Verheißung gegeben hat
  rationale: Das substantivierte Aoristpartizip verweist auf denjenigen, der zuvor verheißen hat. Die Formulierung lässt die im Griechischen nicht ausdrücklich genannte Identität Gottes implizit und gibt ἐπαγγέλλομαι mit seinem Verheißungscharakter wieder.
theological_decisions:
- issue: Identität dessen, der verheißen hat
  choice: Der Bezug auf Gott bleibt wie im Griechischen unausgesprochen.
  alternative: „Denn Gott, der die Verheißung gegeben hat, ist treu.“
  rationale: Der Zusammenhang macht Gott als Handelnden deutlich, doch der Ausgangstext nennt ihn hier nicht ausdrücklich. Die Übersetzung vermeidet daher eine interpretierende Ergänzung.
- issue: Possessivbezug der Hoffnung
  choice: „das Bekenntnis der Hoffnung“ ohne ergänztes „unserer“
  alternative: „das Bekenntnis unserer Hoffnung“
  rationale: Die gemeinschaftliche Hoffnung ist durch die Aufforderung „Lasst uns“ kontextuell klar. Da im Griechischen kein Possessivpronomen steht und die deutsche Formulierung natürlich verständlich ist, wird keines ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „denn treu ist der …“ erhält die Hervorhebung von πιστός, ohne altertümlich zu wirken. Der Fußnotenmarker steht unmittelbar nach dem von der Alternative betroffenen ersten Satzteil.
