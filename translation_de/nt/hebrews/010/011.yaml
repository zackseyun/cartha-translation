id: HEB.10.11
reference: Hebrews 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: de
  text: Und jeder Priester steht Tag für Tag da, verrichtet seinen Dienst und bringt immer wieder dieselben Opfer dar, die niemals Sünden wegnehmen können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: jeder Priester
  rationale: πᾶς mit einem Substantiv im Singular hat distributive Bedeutung. „Jeder Priester“ gibt dies natürlich wieder; „Hohepriester“ wäre zu eng, da nicht ἀρχιερεύς steht.
- source_word: ἕστηκεν
  choice: steht ... da
  rationale: Das Perfekt von ἵστημι bezeichnet hier den fortbestehenden Zustand des Stehens. Die Formulierung bewahrt zugleich den anschaulichen Gegensatz zum Sitzen in Vers 12.
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die Wendung bezeichnet täglich wiederkehrendes Handeln. „Tag für Tag“ hebt den fortdauernden Wiederholungscharakter hervor.
- source_word: λειτουργῶν
  choice: verrichtet seinen Dienst
  rationale: Das Partizip bezeichnet den priesterlich-kultischen Dienst. Die gewählte Formulierung ist im Deutschen natürlich und lässt den kultischen Zusammenhang erkennen.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: dieselben Opfer
  rationale: αὐτάς betont, dass immer wieder Opfer derselben Art dargebracht werden.
- source_word: πολλάκις
  choice: immer wieder
  rationale: Das Adverb hebt die wiederholte Darbringung hervor. „Immer wieder“ ist idiomatisch und trägt die rhetorische Betonung.
- source_word: προσφέρων
  choice: bringt ... dar
  rationale: προσφέρω bedeutet im Opferkontext „darbringen“; dies ist die präzise und geläufige deutsche Wiedergabe.
- source_word: αἵτινες
  choice: die
  rationale: Das Relativpronomen bezieht sich erklärend auf die Opfer zurück. Im Deutschen gibt „die“ diesen Bezug klar und ohne unnötige Ausdeutung wieder.
- source_word: οὐδέποτε δύνανται
  choice: niemals ... können
  rationale: Die Verbindung drückt uneingeschränkte Unfähigkeit aus. Die Wortstellung ist natürlich und bewahrt die absolute Aussage.
- source_word: περιελεῖν ἁμαρτίας
  choice: Sünden wegnehmen
  rationale: περιαιρέω bedeutet hier „wegnehmen“ oder „beseitigen“. „Sünden wegnehmen“ ist direkt, verständlich und bewahrt die bildhafte Sprache des Textes.
theological_decisions:
- issue: Bedeutung der priesterlichen Haltung im Argument von Hebräer 10
  choice: ἕστηκεν wird mit „steht ... da“ wiedergegeben, sodass der Gegensatz zwischen dem fortdauernden Dienst der Priester und dem Sitzen des Messias in Vers 12 erhalten bleibt.
  alternative: Eine formal stärker aspektbezogene Wiedergabe wie „ist hingetreten“ oder die neutralere Form „steht“ ohne „da“.
  rationale: Der unmittelbare Kontext gestaltet einen bewussten Gegensatz. Die Übersetzung bewahrt ihn, ohne über die Aussage des griechischen Textes hinauszugehen.
- issue: Reichweite der Unwirksamkeit der Opfer
  choice: Die Opfer „können niemals Sünden wegnehmen“.
  alternative: Eine abgeschwächte Wiedergabe wie „können Sünden nicht vollständig beseitigen“.
  rationale: οὐδέποτε δύνανται formuliert im Argument des Hebräerbriefs eine absolute Unfähigkeit. Diese darf nicht durch einen einschränkenden Zusatz abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tag für Tag“, „verrichtet seinen Dienst“ und „immer wieder“ machen die fortgesetzte Wiederholung verständlich, während „steht ... da“ den literarischen Gegensatz zum folgenden Vers bewahrt. Keine Fußnote ist nötig, da „wegnehmen“ die lexikalische Spannweite im Haupttext angemessen abbildet.
