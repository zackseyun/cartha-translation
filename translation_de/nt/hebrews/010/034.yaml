id: HEB.10.34
reference: Hebrews 10:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: de
  text: Denn ihr habt mit den Gefangenen gelitten[a] und die Plünderung eures Besitzes mit Freude hingenommen, weil ihr wusstet, dass ihr selbst einen besseren und bleibenden Besitz habt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr hattet Mitgefühl mit den Gefangenen“. Das griechische Verb kann Mitgefühl bezeichnen, schließt hier aber wahrscheinlich tätige Anteilnahme an ihrem Leiden ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften haben sinngemäß: „weil ihr wusstet, dass ihr für euch selbst im Himmel einen besseren und bleibenden Besitz habt“.'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: den Gefangenen
  rationale: Das Wort bezeichnet Menschen in Fesseln oder Haft. „Den Gefangenen“ ist im Deutschen knapp, natürlich und sachlich.
- source_word: συνεπαθήσατε
  choice: habt mit ... gelitten
  rationale: Das Verb kann Mitgefühl oder Anteilnahme bezeichnen, hebt im Verfolgungskontext aber die tätige Solidarität mit den Leidenden hervor. Die Formulierung wahrt diese stärkere Nuance, ohne zu behaupten, die Adressaten seien selbst inhaftiert gewesen.
- source_word: ἁρπαγήν
  choice: Plünderung
  rationale: Der Ausdruck bezeichnet gewaltsames oder unrechtmäßiges Wegnehmen. „Plünderung“ gibt diese Härte deutlicher wieder als das verwaltungssprachlichere „Beschlagnahmung“.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: eures Besitzes
  rationale: Das substantivierte Partizip bezeichnet das, was jemandem gehört. „Besitz“ ist idiomatisch und ermöglicht zugleich die erkennbare Wortverbindung zum späteren ὕπαρξις.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Die Präpositionalphrase wird unmittelbar und strukturgerecht wiedergegeben.
- source_word: προσεδέξασθε
  choice: habt ... hingenommen
  rationale: Im Zusammenhang mit einem erlittenen Verlust bedeutet das Verb ein bewusstes Annehmen. „Hingenommen“ klingt im Deutschen natürlicher als „angenommen“, ohne Zustimmung zum Unrecht auszudrücken.
- source_word: γινώσκοντες
  choice: weil ihr wusstet
  rationale: 'Das Partizip trägt hier eine naheliegende kausale Nuance: Das Wissen erklärt, weshalb sie den Verlust mit Freude hinnahmen.'
- source_word: ἑαυτοὺς ἔχειν
  choice: dass ihr selbst ... habt
  rationale: Das Reflexivpronomen wird als Betonung des Subjekts wiedergegeben. Die deutsche Nebensatzkonstruktion vermittelt den Inhalt des griechischen Infinitivs natürlich.
- source_word: κρείττονα
  choice: besseren
  rationale: „Besser“ bewahrt das für den Hebräerbrief charakteristische Vergleichsmotiv und ist weniger ausdeutend als „höherwertig“.
- source_word: ὕπαρξιν
  choice: Besitz
  rationale: Das Singularwort bezeichnet hier ein Gut oder einen Besitz in zusammenfassendem Sinn. „Besitz“ erhält zudem die lexikalische Verbindung zu den zuvor genannten ὑπάρχοντα.
- source_word: μένουσαν
  choice: bleibenden
  rationale: Das Partizip betont Fortbestand und Dauer. „Bleibend“ ist zugleich präzise, würdig und im modernen Standarddeutsch verständlich.
theological_decisions:
- issue: Solidarität mit den inhaftierten Glaubenden
  choice: Die Adressaten haben mit den Gefangenen gelitten.
  alternative: Die Adressaten hatten Mitleid mit den Gefangenen.
  rationale: συμπαθέω kann Mitgefühl bezeichnen, doch der Kontext von Verfolgung und materiellen Verlusten legt kostspielige, tätige Solidarität nahe. Die Übersetzung lässt offen, auf welche konkrete Weise sie das Leiden teilten.
- issue: Bestimmung des besseren und bleibenden Besitzes
  choice: Der Besitz bleibt allgemein bezeichnet.
  alternative: Ein besserer Besitz im Himmel beziehungsweise ein himmlisches Erbe.
  rationale: Der vorliegende SBLGNT-Haupttext nennt weder den Himmel noch ausdrücklich ein Erbe. Daher wird die eschatologische oder räumliche Bestimmung nicht in den Haupttext eingeführt; die abweichende Lesart wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Besitz“ ist bewusst beibehalten, weil sie die Wortverbindung zwischen ὑπάρχοντα und ὕπαρξις hörbar macht. „Hingenommen“ beschreibt standhaftes Annehmen, nicht die Billigung der Plünderung.
