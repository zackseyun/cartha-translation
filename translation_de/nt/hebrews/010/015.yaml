base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: de
  text: 'Auch der Heilige Geist bezeugt uns das; denn nachdem er gesagt hat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: bezeugt
  rationale: „Bezeugt“ gibt das gegenwärtige aktive Zeugnis sachlich und in natürlichem, würdigem Deutsch wieder und bewahrt den Zeugencharakter des Verbs.
- source_word: δὲ
  choice: Auch
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort. Im Deutschen wird seine Funktion zusammen mit dem additiven καί durch die natürliche Satzstellung „Auch der Heilige Geist“ wiedergegeben.
- source_word: ἡμῖν
  choice: uns
  rationale: 'Der Dativ bezeichnet die Empfänger des Zeugnisses: Der Heilige Geist bezeugt es uns.'
- source_word: καὶ
  choice: Auch
  rationale: καί fügt den Heiligen Geist als weiteren Zeugen in die Argumentation ein.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die übliche moderne deutsche Wiedergabe der bestimmten griechischen Bezeichnung.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: denn nachdem er gesagt hat
  rationale: Die Konstruktion mit μετά und substantiviertem Infinitiv bezeichnet eine zeitliche Folge. Das im Griechischen unausgesprochene Subjekt wird im Deutschen aus dem vorhergehenden „der Heilige Geist“ mit „er“ aufgenommen; der Doppelpunkt leitet das folgende Zitat ein.
theological_decisions:
- issue: Persönliches Handeln des Heiligen Geistes beim Zeugnis
  choice: der Heilige Geist bezeugt uns das
  alternative: der Heilige Geist legt uns davon Zeugnis ab
  rationale: Die Formulierung bewahrt den Heiligen Geist als handelndes Subjekt, ohne über die griechische Syntax hinaus weitere dogmatische Aussagen einzutragen.
- issue: Bezug des unausgesprochenen Subjekts von εἰρηκέναι
  choice: nachdem er gesagt hat
  alternative: nach den Worten
  rationale: Der nächstliegende grammatische Bezug ist der zuvor genannte Heilige Geist. Die explizite deutsche Pronomenform macht den Satz idiomatisch, während der folgende Doppelpunkt das noch unvollständige Zitatgefüge bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. „Bezeugt“ ist prägnant und weniger schwerfällig als „legt Zeugnis ab“. Das ergänzte „das“ macht die deutsche Konstruktion mit „bezeugen“ idiomatisch und verweist auf das anschließend angeführte Schriftzeugnis.
