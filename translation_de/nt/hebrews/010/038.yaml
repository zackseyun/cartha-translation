source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: de
  text: Mein Gerechter aber wird aus Glauben[a] leben; und wenn er zurückweicht[b], hat meine Seele kein Gefallen an ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Treue“ oder „aus Vertrauen“. Das griechische Wort pistis kann diese Bedeutungen tragen.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lesen „der Gerechte“ statt „mein Gerechter“. Der grammatisch männliche Singular („Gerechter“, „ihm“) folgt dem griechischen Wortlaut und bezeichnet hier nicht ausschließlich Männer.
    reason: textual_variant_and_cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: mein Gerechter aber
  rationale: Der substantivierte Adjektivgebrauch bezeichnet einen gerechten Menschen; das Possessivpronomen gehört nach dem SBLGNT zum Ausdruck. Die Stellung von „aber“ bewahrt den fortführenden Kontrast von δέ.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: ἐκ bezeichnet hier Grundlage oder Ursprung. „Aus Glauben“ bildet die griechische Wendung sowie den Schriftzitat-Charakter deutlicher ab als das ebenfalls mögliche „durch Glauben“; πίστις bleibt dabei in seiner möglichen Bedeutungsbreite offen.
- source_word: ζήσεται
  choice: wird leben
  rationale: Direkte und natürliche Wiedergabe des Futurs von ζάω.
- source_word: ὑποστείληται
  choice: zurückweicht
  rationale: Das Verb bezeichnet hier ein Zurückweichen oder Sich-Zurückziehen unter Druck. „Zurückweicht“ ist im modernen Deutsch klar und erhält den warnenden Ton.
- source_word: οὐκ εὐδοκεῖ
  choice: hat … kein Gefallen
  rationale: Die feste deutsche Wendung gibt das Nicht-Wohlgefallen präzise und würdig wieder.
- source_word: ἡ ψυχή μου
  choice: meine Seele
  rationale: Die ausdrückliche Rede von der Seele wird als Teil des Schriftzitats bewahrt und nicht zu „ich“ geglättet.
- source_word: ἐν αὐτῷ
  choice: an ihm
  rationale: Bei „Gefallen haben“ verlangt idiomatisches Deutsch „an“; damit wird ἐν αὐτῷ sinngemäß und natürlich wiedergegeben.
theological_decisions:
- issue: Bedeutung von πίστις in ἐκ πίστεως
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: „Glaube“ ist die naheliegende Hauptwiedergabe, doch πίστις kann auch Treue oder Vertrauen bezeichnen. Die Fußnote hält diese echte lexikalisch-theologische Offenheit fest.
- issue: Subjekt von ἐὰν ὑποστείληται
  choice: Der Singular wird auf die zuvor genannte Person bezogen
  alternative: Ein unbestimmter anderer Mensch als neues Subjekt
  rationale: Der griechische Text setzt mit der singularischen Verbform ohne ausdrücklichen Subjektwechsel fort. Die Übersetzung bewahrt dadurch die Spannung der Warnung, statt sie lehrmäßig abzuschwächen.
- issue: Textvariante bei μου
  choice: „mein Gerechter“ nach SBLGNT
  alternative: „der Gerechte“ ohne μου
  rationale: Die vorgegebene Ausgabe enthält μου. Da einige Handschriften das Pronomen auslassen, wird die Variante in einer Fußnote dokumentiert.
- issue: Grammatisches Geschlecht und repräsentative Aussage
  choice: Maskuliner Singular in „mein Gerechter“ und „ihm“
  alternative: Explizit geschlechtsneutrale Umschreibung
  rationale: Die deutsche Form folgt dem grammatisch maskulinen Singular des griechischen Textes. Sie ist hier repräsentativ zu verstehen und nicht als Beschränkung auf Männer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erkennbarem Schriftzitat-Charakter. „Aus Glauben“ erhält die knappe Form von ἐκ πίστεως; „hat meine Seele kein Gefallen“ bewahrt die bildhafte und persönliche Ausdrucksweise der Vorlage.
