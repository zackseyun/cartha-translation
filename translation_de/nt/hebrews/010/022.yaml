  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: de
  text: Lasst uns mit wahrhaftigem Herzen[a] und in voller Gewissheit des Glaubens hinzutreten, mit Herzen, die durch Besprengung von einem bösen Gewissen gereinigt sind[d], und mit einem Leib, der mit reinem Wasser gewaschen ist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit aufrichtigem Herzen“.'
    reason: lexical_alternative
  - marker: c
    text: Die Bildsprache kann an rituelle Reinigung erinnern und von manchen auch als Anklang an die Taufe verstanden werden; der Vers bezeichnet die Waschung jedoch nicht ausdrücklich als Taufe.
    reason: cultural_note
  - marker: d
    text: 'Wörtlicher: „die Herzen von einem bösen Gewissen weg besprengt“. Die deutsche Wendung gibt die durch die Besprengung bewirkte Reinigung wieder.'
    reason: translation_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Lasst uns … hinzutreten
  rationale: Der präsentische hortative Konjunktiv fordert die Gemeinschaft zum Hinzutreten zu Gott auf. „Hinzutreten“ bewahrt den kultischen und zugangsbezogenen Klang des Hebräerbriefs.
- source_word: ἀληθινῆς καρδίας
  choice: mit wahrhaftigem Herzen
  rationale: ἀληθινός kann „wahr“, „echt“ oder „aufrichtig“ bedeuten. „Wahrhaftig“ bewahrt die knappe biblische Ausdrucksweise, ohne die Bedeutung auf subjektive Aufrichtigkeit zu verengen.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: in voller Gewissheit des Glaubens
  rationale: πληροφορία bezeichnet volle Gewissheit oder feste Überzeugung. Der Genitiv πίστεως bleibt als „des Glaubens“ erhalten und bezeichnet hier den vertrauenden Glauben der Hinzutretenden.
- source_word: ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς
  choice: im Herzen durch Besprengung von einem bösen Gewissen gereinigt
  rationale: Das perfekte Passivpartizip beschreibt einen bestehenden Zustand. „Durch Besprengung … gereinigt“ macht die im Zusammenhang liegende Reinigungswirkung verständlich und erhält zugleich das kultische Bild sowie die Trennung, die ἀπό ausdrückt.
- source_word: συνειδήσεως πονηρᾶς
  choice: von einem bösen Gewissen
  rationale: πονηρός bedeutet formal „böse“ oder „schlecht“. „Schuldbeladen“ wäre enger und würde die moralische und kultische Bedeutungsbreite des Ausdrucks beschränken.
- source_word: λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ
  choice: am Leib mit reinem Wasser gewaschen
  rationale: Das perfekte Partizip bezeichnet parallel zur Besprengung einen vollzogenen Waschungszustand. Der griechische Singular τὸ σῶμα lässt sich im Deutschen distributiv und idiomatisch mit „am Leib“ wiedergeben; „reines Wasser“ wahrt die Reinigungssprache.
theological_decisions:
- issue: Ob die Waschung ausdrücklich als christliche Taufe bezeichnet werden soll
  choice: Das Bild der Waschung wird ohne ausdrückliche Identifizierung mit der Taufe wiedergegeben.
  alternative: Die Formulierung ausdrücklich auf die Taufe beziehen oder ausschließlich als innerliche Reinigung deuten.
  rationale: Die Sprache kann levitische Reinigungen und für christliche Leser auch die Taufe anklingen lassen. Der Vers selbst benennt die Waschung jedoch nicht ausdrücklich als Taufe; die Übersetzung bewahrt daher die Offenheit.
- issue: Ob συνειδήσεως πονηρᾶς als „schuldbeladenes Gewissen“ zu deuten ist
  choice: „böses Gewissen“
  alternative: „schuldbeladenes Gewissen“
  rationale: „Schuldbeladen“ ist eine mögliche kontextuelle Deutung, aber enger als πονηρός. Die formale Wiedergabe erhält die moralische und kultische Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hinzutreten“, „wahrhaftig“, „Besprengung“ und „Leib“ erhalten den kultischen und biblischen Ton, während die Satzführung für heutige Leser verständlich bleibt.
