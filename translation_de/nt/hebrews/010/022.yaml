  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird getroffen: der hortative Aufruf zum Hinzutreten, die volle Glaubensgewissheit sowie die parallelen Reinigungsbilder bleiben erhalten. Die Fassung „im Herzen durch Besprengung von einem bösen Gewissen gereinigt“ schwächt jedoch die ausdrücklich genannten Herzen zu einer bloß lokativen Wendung ab und ist syntaktisch missverständlich: „durch Besprengung von“ kann zunächst wie die Herkunft der Besprengung klingen. Eine Umstellung bildet die beiden perfektischen Partizipien und ihre jeweiligen Bezüge klarer ab.'
  naturalness: „Hinzutreten“, „wahrhaftigem Herzen“ und „voller Gewissheit des Glaubens“ sind in einem würdevollen modernen Bibelregister gut verständlich. Die revidierte Satzfügung ist trotz der bewusst bildhaften Sprache klarer und idiomatischer.
  terminology: „böses Gewissen“ gibt πονηρᾶς ohne die engere Deutung „schuldbeladen“ wieder. „Besprengung“ und „reinem Wasser“ bewahren die kultische Bildsprache. Die Fußnote zur Taufe wahrt zutreffend die im Text bestehende Offenheit.
