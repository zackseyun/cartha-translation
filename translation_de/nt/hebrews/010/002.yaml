  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: de
  text: Hätte man sonst nicht aufgehört, sie darzubringen, weil die Anbetenden, nachdem sie einmal[b] gereinigt worden wären, kein Sündenbewusstsein[a] mehr gehabt hätten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Gewissen wegen der Sünden mehr“. Der griechische Ausdruck kann Gewissen, Bewusstsein oder innere Wahrnehmung der Sünden bezeichnen; hier ist das fortbestehende Sünden- beziehungsweise Schuldbewusstsein vor Gott gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein für alle Mal“. Das griechische Wort kann in diesem Zusammenhang den endgültigen und unwiederholbaren Charakter der Reinigung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Denn … sonst
  rationale: ἐπεί leitet hier eine folgernde, der Wirklichkeit entgegenstehende Frage ein. Die Verbindung „Denn … sonst“ gibt den argumentativen Anschluss und die hypothetische Folgerung im Deutschen natürlich wieder.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: hätte man … nicht aufgehört, sie darzubringen
  rationale: Die Verbindung aus οὐκ ἄν und Aorist formuliert eine rhetorische Frage mit irrealer Folgerung. Die unpersönliche deutsche Konstruktion vermeidet das schwerfällige Passiv „aufgehört, dargebracht zu werden“, ohne den Sinn zu verändern.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: weil … kein … mehr hätten
  rationale: διά mit substantiviertem Infinitiv nennt den Grund; „kein … mehr“ bildet μηδεμίαν … ἔτι klar und idiomatisch ab.
- source_word: τοὺς λατρεύοντας
  choice: die, die Gott dienen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die kultischen Dienst beziehungsweise Gottesdienst ausüben. „Gott dienen“ bewahrt den religiösen Bezug und bleibt für heutige Leser verständlich.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: Bewusstsein von Sünden
  rationale: συνείδησις kann Gewissen, Bewusstsein oder innere Wahrnehmung bezeichnen. Hier geht es um das fortbestehende Bewusstsein der Sünden vor Gott, nicht um den Verlust moralischer Urteilsfähigkeit.
- source_word: ἅπαξ
  choice: einmal
  rationale: ἅπαξ bezeichnet zunächst ein einmaliges Geschehen; im Zusammenhang kann zugleich dessen endgültiger, unwiederholbarer Charakter anklingen. Die Hauptlesart bleibt bewusst knapp, die stärkere Nuance steht in der Fußnote.
- source_word: κεκαθαρισμένους
  choice: gereinigt worden wären
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Reinigung mit fortdauerndem Ergebnis. Im irrealen deutschen Satzgefüge wird dies mit „gereinigt worden wären“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von συνείδησιν ἁμαρτιῶν nach der Reinigung
  choice: „Bewusstsein von Sünden“ als fortdauerndes Sünden- beziehungsweise Schuldbewusstsein
  alternative: „Gewissen wegen der Sünden“
  rationale: Der Gedankengang betrifft die bleibende Belastung durch Sünden, die wiederholte Opfer voraussetzt. Die Formulierung behauptet nicht, gereinigte Menschen könnten Sünde moralisch nicht mehr erkennen.
- issue: Tragweite von ἅπαξ
  choice: Im Haupttext „einmal“
  alternative: „ein für alle Mal“
  rationale: Der Kontext lässt eine endgültige, unwiederholbare Reinigung anklingen, doch ἅπαξ allein erzwingt die ausdrückliche Verstärkung nicht. Die Fußnote bewahrt beide Verständnismöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der irreale Gedankengang bleiben erhalten. Die unpersönliche Wendung „hätte man … aufgehört“ sorgt für natürliche Lesbarkeit, während „darbringen“, „reinigen“ und „Gott dienen“ den kultischen Zusammenhang wahren.
