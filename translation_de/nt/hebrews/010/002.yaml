  naturalness: „Denn hätte man sonst nicht aufgehört, sie darzubringen“ ist verständlich, aber die Verbindung von „Denn“ und „sonst“ sowie die unpersönliche Konstruktion sind stilistisch schwerfällig. Eine direkte Frage mit dem impliziten Bezug auf die Opfer ist im modernen Standarddeutsch klarer. „Sündenbewusstsein“ ist idiomatischer als „Bewusstsein von Sünden“ und trifft die hier gemeinte fortbestehende Belastung bzw. Schuldwahrnehmung.
  terminology: „Anbetenden“ gibt λατρεύοντας als substantiviertes, im Kontext kultisch verstandenes Partizip angemessener wieder als „die, die Gott dienen“. „Sündenbewusstsein“ wahrt die bewusst gewählte Unterscheidung von moralischer Gewissenlosigkeit. Die Fußnote zu ἅπαξ sollte nicht behaupten, die verstärkte Wiedergabe sei zwingend, sondern sie als mögliche kontextuelle Nuance ausweisen.
