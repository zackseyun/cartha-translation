id: HEB.10.36
reference: Hebrews 10:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: de
  text: Denn ihr braucht Ausdauer, damit ihr, nachdem ihr den Willen Gottes getan habt, die Verheißung empfangt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Verheißene empfangt“.'
    reason: Alternative Wiedergabe der möglichen metonymischen Bedeutung von ἐπαγγελία.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: Ausdauer
  rationale: ὑπομονή bezeichnet standhaftes Ausharren unter Druck. „Ausdauer“ ist im modernen Deutsch natürlich und bewahrt den Gedanken beharrlicher Standfestigkeit in Prüfungen.
- source_word: χρείαν ἔχετε
  choice: ihr braucht
  rationale: Die Wendung χρείαν ἔχειν bedeutet „brauchen“. Die direkte deutsche Formulierung ist klar, idiomatisch und erhält die Aussagekraft.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet hier den beabsichtigten beziehungsweise erwarteten Ausgang ein; „damit“ gibt diesen Zusammenhang natürlich wieder.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: den Willen Gottes
  rationale: Die Genitivverbindung wird sachlich und in geläufiger biblischer Sprache wiedergegeben.
- source_word: ποιήσαντες
  choice: nachdem ihr ... getan habt
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Empfangen vorausgeht. Ein temporaler Nebensatz macht dieses Verhältnis im Deutschen deutlich.
- source_word: κομίσησθε
  choice: empfangt
  rationale: κομίζω bedeutet hier, etwas Zugesagtes zu empfangen oder zu erlangen. „Empfangen“ passt natürlich zum Gegenstand „Verheißung“ und vermeidet unnötige Deutung.
- source_word: τὴν ἐπαγγελίαν
  choice: die Verheißung
  rationale: ἐπαγγελία kann die Zusage selbst oder das Verheißene beziehungsweise ihre Erfüllung bezeichnen. „Die Verheißung“ bleibt eng am griechischen Ausdruck und bewahrt diese Spannung.
theological_decisions:
- issue: Ob ἐπαγγελίαν die Verheißung selbst oder das Verheißene bezeichnet
  choice: die Verheißung
  alternative: das Verheißene
  rationale: Der Haupttext bewahrt die substantivische Form des griechischen Ausdrucks, ohne den möglichen Bezug auf die verheißene Gabe auszuschließen. Die idiomatisch mögliche Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Gedankengang nahe, ohne unnatürlich zu wirken; „Ausdauer“ und „Verheißung“ sind verständlich und zugleich sachlich präzise.
