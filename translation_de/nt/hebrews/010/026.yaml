id: HEB.10.26
reference: Hebrews 10:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: de
  text: Denn wenn wir vorsätzlich weiter sündigen, nachdem wir die Erkenntnis der Wahrheit[a] empfangen haben, bleibt kein Opfer für Sünden mehr übrig,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die volle Erkenntnis der Wahrheit“. Das griechische Wort kann eine umfassendere oder entschiedene Erkenntnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: vorsätzlich
  rationale: Das Adverb bezeichnet bewusstes, willentliches Handeln. „Vorsätzlich“ ist im modernen Deutschen klar, auch wenn es leicht rechtssprachlich klingt, und wahrt die Schärfe der Warnung.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende Verbindung zum vorhergehenden Gedankengang.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: wenn wir … weiter sündigen
  rationale: Der präsentische Genitivus absolutus legt hier fortgesetztes beziehungsweise anhaltendes Handeln nahe. Die konditionale Wiedergabe ist im Deutschen idiomatisch.
- source_word: μετὰ τὸ λαβεῖν
  choice: nachdem wir … empfangen haben
  rationale: Die Konstruktion bezeichnet eine zeitlich vorausgehende, abgeschlossene Handlung.
- source_word: ἐπίγνωσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist eine natürliche, im biblischen Register geläufige Wiedergabe, ohne den möglicherweise stärkeren Sinn einer vollen oder entschiedenen Erkenntnis zwingend in den Haupttext einzutragen.
- source_word: τῆς ἀληθείας
  choice: der Wahrheit
  rationale: Entspricht der bestimmten Genitivverbindung und lässt den kontextuellen Bezug auf die Wahrheit der Botschaft bestehen.
- source_word: οὐκέτι
  choice: kein … mehr
  rationale: Gibt den zeitlichen Sinn „nicht länger“ in der deutschen Satzkonstruktion natürlich wieder.
- source_word: περὶ ἁμαρτιῶν
  choice: für Sünden
  rationale: Im Opferzusammenhang bezeichnet περί mit Genitiv den Bezug auf beziehungsweise die Sühnung von Sünden; „für Sünden“ ist knapp und idiomatisch.
- source_word: ἀπολείπεται
  choice: bleibt … übrig
  rationale: Gibt die unpersönliche Aussage des Verbs natürlich wieder.
- source_word: θυσία
  choice: Opfer
  rationale: „Opfer“ ist die übliche und kontextgerechte Wiedergabe im Argument des Hebräerbriefs über das Opfer Christi.
theological_decisions:
- issue: Aspekt und Aussagekraft von ἁμαρτανόντων
  choice: „wenn wir vorsätzlich weiter sündigen“ als fortgesetztes Handeln
  alternative: „wenn wir vorsätzlich sündigen“ als möglicherweise einzelner Akt
  rationale: Das Präsenspartizip stützt eine durative Lesart. So bleibt die ernste Warnung erhalten, ohne sie ausdrücklich auf jede einzelne vorsätzliche Sünde nach Empfang der Erkenntnis zu beziehen.
- issue: Theologische Tragweite von ἐπίγνωσις
  choice: „Erkenntnis der Wahrheit“ ohne nähere Bestimmung des geistlichen Zustands der Betroffenen
  alternative: „volle Erkenntnis“ oder ausdrücklich „rettende Erkenntnis“
  rationale: Der Text nennt den Empfang der Erkenntnis, bestimmt aber nicht ausdrücklich, ob damit Wiedergeburt oder rettender Glaube gemeint ist. Die Übersetzung lässt diese theologische Spannung offen.
- issue: Ausschließlichkeit der Opferaussage
  choice: „bleibt kein Opfer für Sünden mehr übrig“
  alternative: Erklärende Zusätze wie „kein anderes Opfer“ oder „keine weitere Möglichkeit der Vergebung“
  rationale: Die Übersetzung folgt der knappen Aussage des griechischen Textes und vermeidet Zusätze, die deren Reichweite bereits auslegen würden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vorsätzlich“ wahrt die bewusste Intentionalität; „weiter sündigen“ macht den fortgesetzten Aspekt deutlich. Die Satzgrenze bleibt wegen des anschließenden Verses mit Komma offen.
