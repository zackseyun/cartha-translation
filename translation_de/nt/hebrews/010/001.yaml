id: HEB.10.1
reference: Hebrews 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: de
  text: Denn weil das Gesetz einen Schatten der kommenden Güter hat, nicht das Abbild selbst der Wirklichkeiten[a], kann es durch dieselben Opfer, die Jahr für Jahr immer wieder dargebracht werden, diejenigen, die sich Gott nahen[b], niemals zur Vollendung bringen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht das eigentliche Abbild der Wirklichkeiten“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „sich Gott nahen“ ist hier das Hinzutreten zu Gott im Gottesdienst gemeint.
    reason: cultural_note
  - marker: c
    text: 'Auch: „vollkommen machen“ oder „ans Ziel bringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: einen Schatten
  rationale: Die wörtliche Metapher bewahrt im Gegensatz zu εἰκών den Gedanken eines vorausweisenden, aber noch nicht voll ausgeprägten Umrisses.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: der kommenden Güter
  rationale: Die Formulierung gibt den Zukunftsbezug knapp wieder, ohne den Zeitpunkt oder die Art ihrer Verwirklichung näher festzulegen.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: nicht deren eigentliche Gestalt
  rationale: „Gestalt“ gibt εἰκών im Kontrast zum Schatten natürlich wieder; „eigentliche“ nimmt die emphatische Kraft von αὐτήν auf, und „deren“ bezieht die Gestalt auf die angekündigten wirklichen Güter.
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις
  choice: durch dieselben Opfer, die Jahr für Jahr … dargebracht werden
  rationale: „Durch“ kennzeichnet den instrumentalen Dativ; „Jahr für Jahr“ betont die fortlaufende jährliche Wiederholung.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: die … immer wieder dargebracht werden
  rationale: Das Passiv vermeidet ein im Griechischen nicht ausdrücklich genanntes Subjekt. „Immer wieder“ verbindet die fortdauernde Wiederholung idiomatisch mit dem jährlichen Opferzyklus.
- source_word: οὐδέποτε δύναται
  choice: kann … niemals
  rationale: Die Wendung bewahrt sowohl die Aussage über das Unvermögen als auch die uneingeschränkte Verneinung.
- source_word: τοὺς προσερχομένους
  choice: diejenigen, die sich Gott nahen
  rationale: „Sich nahen“ wahrt den in Hebräer häufigen kultischen Sinn des Hinzutretens zu Gott; „Gott“ macht den im Kontext vorausgesetzten Bezug verständlich.
- source_word: τελειῶσαι
  choice: zur Vollendung bringen
  rationale: Diese Wiedergabe erhält den Gedanken des Erreichens des vorgesehenen Ziels und vermeidet, den Ausdruck vorschnell auf moralische Fehlerlosigkeit einzuengen.
theological_decisions:
- issue: Der Gegensatz zwischen Schatten und εἰκών in der Aussage über das Gesetz
  choice: Das Gesetz besitzt einen vorausweisenden Schatten, nicht die eigentliche Gestalt der kommenden Güter.
  alternative: Das Gesetz besitzt nicht das Abbild selbst von den Wirklichkeiten.
  rationale: 'Die Übersetzung lässt die ausdrückliche Spannung zwischen Schatten und eigentlicher Gestalt bestehen: Das Gesetz weist wirklich auf die Güter voraus, ist aber nicht ihre endgültige Ausprägung.'
- issue: Die Bedeutung von τελειῶσαι im Opferzusammenhang des Hebräerbriefs
  choice: zur Vollendung bringen
  alternative: vollkommen machen
  rationale: „Zur Vollendung bringen“ wahrt den zentralen Ziel- und Zugangsaspekt des Verbs im Hebräerbrief, ohne eine ausschließlich moralische Vollkommenheit hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Kultische Fachsprache wird nur dort verwendet, wo sie für den Gedankengang wesentlich ist; die Passivform bei den Opfern vermeidet ein nicht genanntes Handlungssubjekt.
