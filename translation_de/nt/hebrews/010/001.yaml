revisions:
- from: Denn das Gesetz hat nur einen Schatten der kommenden Güter, nicht deren eigentliche Gestalt[a]. Darum kann es durch dieselben Opfer, die Jahr für Jahr immer wieder dargebracht werden, diejenigen, die sich Gott nahen[b], niemals zur Vollendung bringen[c].
  to: Denn weil das Gesetz einen Schatten der kommenden Güter hat, nicht das Abbild selbst der Wirklichkeiten[a], kann es durch dieselben Opfer, die Jahr für Jahr immer wieder dargebracht werden, diejenigen, die sich Gott nahen[b], niemals zur Vollendung bringen[c].
  rationale: Die Revision stellt den direkten Bezug von εἰκών auf τῶν πραγμάτων wieder her und bewahrt so die im Ausgangstext angelegte Spannung zwischen dem Schatten der kommenden Güter und dem Abbild der Wirklichkeiten. Die Umformung mit „weil“ gibt den syntaktischen Zusammenhang wieder, ohne mit „Darum“ eine zusätzliche Folgerungsnuance zu setzen. Die vorhandenen Fußnotenanker bleiben an den jeweils erläuterten Ausdrücken.
