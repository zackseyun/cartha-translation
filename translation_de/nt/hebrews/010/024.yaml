  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: de
  text: Und lasst uns aufeinander achten, um uns gegenseitig zur Liebe und zu guten Taten anzuspornen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „anreizen“ oder „provozieren“. Das griechische Wort παροξυσμός kann einen starken Anstoß oder eine Provokation bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: lasst uns … achten
  rationale: Der hortative Konjunktiv wird als gemeinsame Aufforderung wiedergegeben. „Aufeinander achten“ vermittelt die aufmerksame, bedachte Hinwendung zu den anderen in natürlichem Deutsch.
- source_word: ἀλλήλους
  choice: aufeinander / uns gegenseitig
  rationale: Das reziproke Verhältnis wird in der deutschen Satzstruktur mit „aufeinander“ ausgedrückt und im Zwecksatz zur Verdeutlichung idiomatisch mit „uns gegenseitig“ aufgenommen.
- source_word: εἰς
  choice: um … zu
  rationale: εἰς bezeichnet hier Ziel oder Zweck; der deutsche finale Infinitivsatz gibt diese Beziehung natürlich wieder.
- source_word: παροξυσμὸν
  choice: anzuspornen
  rationale: Das Substantiv bezeichnet einen starken Anstoß oder eine Provokation. „Anspornen“ bewahrt die nachdrückliche, aktivierende Bedeutung, ohne im positiven Zusammenhang unnötig feindselig zu klingen.
- source_word: ἀγάπης
  choice: Liebe
  rationale: Die übliche und sachgemäße Wiedergabe von ἀγάπη im modernen Deutschen.
- source_word: καλῶν ἔργων
  choice: guten Taten
  rationale: „Gute Taten“ ist eine natürliche Wiedergabe, die konkrete gute Handlungen bezeichnet, ohne eine besondere Verdienstlehre einzutragen.
- source_word: καὶ
  choice: und
  rationale: Das einleitende καί verbindet die Aufforderung mit dem vorausgehenden Gedankengang; das zweite verbindet Liebe und gute Taten.
theological_decisions:
- issue: Möglicherweise negative Färbung von παροξυσμός
  choice: Im Haupttext positiv, aber kraftvoll mit „anspornen“ wiedergeben.
  alternative: „zur Liebe und zu guten Taten anreizen“ oder „provozieren“
  rationale: Das griechische Wort kann einen scharfen Anstoß oder sogar eine Provokation bezeichnen. Da Liebe und gute Taten das Ziel sind, wahrt „anspornen“ die Intensität, ohne eine negative Absicht zu unterstellen; die stärkere lexikalische Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gemeinsame Aufforderung und der gemeinschaftliche Bezug werden klar ausgedrückt; die kräftige Bedeutung von παροξυσμός bleibt im Haupttext und in der Fußnote erkennbar.
