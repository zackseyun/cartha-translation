  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: de
  text: Da wir nun, Brüder[a], Freimut haben, durch das Blut Jesu in das Heiligtum[b] einzutreten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“; die griechische Anrede kann die ganze Gemeinde einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die heiligen Stätten“; im Zusammenhang ist der heilige Bereich der Gegenwart Gottes gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Da wir nun … haben
  rationale: Das Partizip ἔχοντες nennt im Zusammenhang die Grundlage der anschließenden Aufforderung; „da wir … haben“ gibt diese begründende Funktion natürlich wieder. „Nun“ markiert den Folgerungszusammenhang von οὖν.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die maskuline Pluralform bezeichnet in einer Anrede häufig die gesamte Gemeinde. Die inklusive Wiedergabe macht den gemeinten Adressatenkreis im heutigen Deutsch unmittelbar verständlich; eine Fußnote weist auf die wörtliche Form hin.
- source_word: παρρησίαν
  choice: Zuversicht
  rationale: Gemeint ist hier der freimütige, vertrauensvolle Zugang zu Gott. „Zuversicht“ ist im Deutschen natürlich und ehrfürchtig, ohne die Stärke des Ausdrucks auf bloße Möglichkeit zu reduzieren.
- source_word: εἰς τὴν εἴσοδον
  choice: einzutreten
  rationale: Die nominale Wendung bezeichnet das Hineingehen beziehungsweise den Zugang. Der Infinitiv ist im Deutschen idiomatisch und bewahrt den Sinn.
- source_word: τῶν ἁγίων
  choice: das Heiligtum
  rationale: Im kultischen Zusammenhang des Hebräerbriefs bezeichnet der substantivierte Plural den heiligen Bereich der Gegenwart Gottes. „Heiligtum“ ist im Deutschen die natürliche räumlich-kultische Wiedergabe, ohne ausdrücklich auf das Allerheiligste einzuengen.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: durch das Blut Jesu
  rationale: ἐν bezeichnet hier am plausibelsten das Mittel beziehungsweise die Grundlage des Zugangs. „Durch“ bewahrt die Opfermetaphorik und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bezugsbereich von τῶν ἁγίων
  choice: 'räumlich-kultischer Bezug: „das Heiligtum“'
  alternative: „die heiligen Stätten“ oder enger „das Allerheiligste“
  rationale: Die durchgehende Stiftshütten- und Opferbildwelt des Kontextes spricht für Gottes heiligen Gegenwartsbereich. „Allerheiligstes“ würde die im Griechischen verbleibende Weite stärker festlegen.
- issue: Adressatenkreis von ἀδελφοί
  choice: „Brüder und Schwestern“ im Haupttext
  alternative: formal „Brüder“ mit inklusiver Erläuterung
  rationale: Die Anrede steht grammatisch im Maskulinum, kann aber die ganze Gemeinde repräsentativ umfassen. Die gewählte Form gibt im modernen Deutsch den wahrscheinlichen kommunikativen Umfang wieder und dokumentiert die Form des Ausgangstextes in der Fußnote.
- issue: Funktion des Blutes Jesu
  choice: Mittel beziehungsweise Grundlage des Zugangs
  alternative: 'lokativ und formal: „im Blut Jesu“'
  rationale: Im Opferkontext ist ἐν instrumental zu verstehen; die Übersetzung lässt offen, wie Mittel und Grundlage theologisch im Einzelnen zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als begründender Auftakt zur folgenden Ermahnung bewusst offen und endet daher mit einem Komma.
