  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: de
  text: Denn nur noch eine ganz kurze Zeit, dann wird der Kommende kommen und nicht zögern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Denn nur noch
  rationale: 'γάρ begründet die vorherige Ermahnung; ἔτι bezeichnet die noch verbleibende Zeit. Zusammen ergibt sich im Deutschen natürlich: „Denn nur noch“.'
- source_word: μικρὸν ὅσον ὅσον
  choice: eine ganz kurze Zeit
  rationale: Die ungewöhnliche Wiederholung ὅσον ὅσον verstärkt μικρόν und betont die äußerste Kürze. „eine ganz kurze Zeit“ gibt die idiomatische Bedeutung in natürlichem Deutsch wieder.
- source_word: ὁ ἐρχόμενος
  choice: der Kommende
  rationale: Das substantivierte Partizip kann schlicht den bezeichnen, der kommt, trägt im Kontext aber wahrscheinlich zugleich die Kraft einer messianischen Bezeichnung. „der Kommende“ bewahrt beides, ohne die Identität ausdrücklich zu ergänzen.
- source_word: ἥξει
  choice: wird kommen
  rationale: Der Futur Indikativ hat klare zukünftige Bedeutung. Die Wiedergabe erhält außerdem das Wortspiel mit ὁ ἐρχόμενος.
- source_word: οὐ χρονίσει
  choice: wird nicht zögern
  rationale: χρονίζω bedeutet hier, Zeit verstreichen zu lassen beziehungsweise sich zu verzögern. „wird nicht zögern“ ist knapp, verständlich und vermeidet das altertümliche „säumen“.
theological_decisions:
- issue: Ob ὁ ἐρχόμενος als messianische Bezeichnung oder als allgemeine Partizipialwendung wiederzugeben ist
  choice: „Der Kommende“ im Haupttext
  alternative: „der, der kommt“ / „derjenige, der kommt“
  rationale: Der substantivierte Ausdruck steht in einem christologisch geprägten Schriftzitat und kann als anerkannte Bezeichnung des erwarteten Messias verstanden werden. „Der Kommende“ erhält diese mögliche titelartige Kraft, ohne die grammatisch ebenfalls mögliche allgemeinere Lesart zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet den Übergang von der knappen Zeitangabe zur angekündigten Ankunft ab. Die Großschreibung von „Der“ folgt dem Satzanfang; „Kommende“ ist als substantiviertes Partizip regulär großgeschrieben und erzwingt daher für sich genommen keine zusätzliche dogmatische Festlegung.
