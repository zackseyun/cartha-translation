id: HEB.10.21
reference: Hebrews 10:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἱερέα μέγαν ἐπὶ τὸν οἶκον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/021.yaml
  text: and a great priest over the house of God[b][a],
translation:
  language: de
  text: und einen großen Priester über das Haus Gottes[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Hohen Priester«. Wörtlich steht hier »einen großen Priester«; der Hebräerbrief bezeichnet Jesus jedoch häufig als Hohen Priester.'
    reason: alternative_reading
  - marker: b
    text: »Haus Gottes« kann auch Gottes Hausgemeinschaft meinen, also sein Volk.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die übliche koordinierende Konjunktion verbindet diesen Satzteil mit der vorausgehenden Konstruktion in Hebräer 10,19–21.
- source_word: ἱερέα
  choice: Priester
  rationale: ἱερεύς bedeutet »Priester«. Der im Hebräerbrief sonst häufige Fachausdruck ἀρχιερεύς (»Hoher Priester«) steht hier nicht.
- source_word: μέγαν
  choice: großen
  rationale: μέγας bezeichnet hier die Größe oder herausragende Stellung des Priesters. »großen« wahrt die ungewöhnliche griechische Formulierung, ohne sie in einen technischen Titel umzudeuten.
- source_word: ἐπὶ
  choice: über
  rationale: ἐπί mit Akkusativ bezeichnet in diesem Zusammenhang Zuständigkeit oder Autorität; »über« gibt dies knapp wieder.
- source_word: τὸν οἶκον
  choice: das Haus
  rationale: οἶκος kann sowohl ein Haus als auch einen Haushalt beziehungsweise eine Hausgemeinschaft bezeichnen. »Haus« bewahrt das biblische Bild und lässt den gemeinschaftlichen Sinn offen.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv bezeichnet das Haus als zu Gott gehörig; die deutsche Genitivform ist natürlich und prägnant.
theological_decisions:
- issue: Soll ἱερέα μέγαν als der technische Titel »Hoher Priester« wiedergegeben werden?
  choice: großen Priester
  alternative: Hohen Priester
  rationale: Der weitere Zusammenhang des Hebräerbriefs stellt Jesus eindeutig als Hohen Priester dar. Hier steht jedoch ἱερεύς mit μέγας und nicht der übliche Titel ἀρχιερεύς. Die Übersetzung folgt daher der konkreten griechischen Formulierung und vermeidet, den technischen Titel stillschweigend einzusetzen.
- issue: Bezeichnet »Haus Gottes« ein Gebäude oder Gottes Volk?
  choice: Haus Gottes
  alternative: Hausgemeinschaft Gottes / Gottes Volk
  rationale: οἶκος trägt im Hebräerbrief, besonders in 3,2–6, einen gemeinschaftlichen und bundestheologischen Sinn. Das Bild »Haus Gottes« bewahrt zugleich die Ausdrucksweise des Ausgangstextes und ihre mögliche Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt bewusst eng am griechischen Satzbau, da der Vers ein Satzteil innerhalb von Hebräer 10,19–21 ist. »großen Priester« klingt ungewöhnlicher als der vertraute Titel »Hohen Priester«, bildet aber die bewusste Wortwahl des griechischen Textes ab.
