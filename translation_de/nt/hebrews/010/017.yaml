  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: de
  text: und an ihre Sünden und ihre gesetzlosen Taten werde ich nie mehr denken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und ihrer Sünden und ihrer gesetzlosen Taten werde ich gewiss nicht mehr gedenken.«'
    reason: Die Fußnote macht sowohl die Genitivkonstruktion als auch die nachdrückliche Verneinung οὐ μή ausdrücklich sichtbar.
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die einleitende Konjunktion wird beibehalten, weil der Satz die vorausgehende Zitataussage fortsetzt.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: ihre Sünden
  rationale: ἁμαρτία bezeichnet hier am natürlichsten »Sünde«; der Plural mit αὐτῶν ergibt »ihre Sünden«.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: und ihre gesetzlosen Taten
  rationale: ἀνομία bezeichnet Gesetzlosigkeit beziehungsweise die Übertretung des Gesetzes. Im konkreten Plural ist »gesetzlose Taten« verständlich und genauer als das heute weniger transparente »Missetaten«.
- source_word: οὐ μὴ μνησθήσομαι ἔτι
  choice: werde ich nie mehr denken
  rationale: Die nachdrückliche Verneinung οὐ μή mit dem Futur und ἔτι wird im Deutschen natürlich durch »nie mehr« wiedergegeben. »An etwas denken« entspricht hier der deutschen Konstruktion für μιμνῄσκομαι mit Genitiv und bewahrt den biblischen Gedanken des Nichtgedenkens.
theological_decisions:
- issue: Gottes Nichtgedenken der Sünden
  choice: Die Aussage bleibt als »an ihre Sünden … werde ich nie mehr denken« stehen.
  alternative: »Ihre Sünden … werde ich ihnen gewiss nicht mehr vorhalten.«
  rationale: Die Übersetzung bewahrt die theologisch bedeutsame Rede vom göttlichen Erinnern beziehungsweise Nichtgedenken, statt sie als »nicht anrechnen« auszulegen. Sie behauptet damit keinen Verlust göttlichen Wissens, löst diese Spannung aber auch nicht durch eine erklärende Paraphrase auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Nie mehr« gibt die starke Verneinung samt ἔτι knapp und idiomatisch wieder; die formellere Wiedergabe mit »gedenken« steht in der Fußnote.
