  verdict: approve
  source_fidelity: Die Übersetzung gibt die einleitende Verbindung καὶ, die beiden parallelen Genitivgruppen („ihre Sünden und ihre gesetzlosen Taten“) sowie die nachdrückliche Verneinung οὐ μὴ … ἔτι sachgerecht wieder. „Nie mehr“ ist eine idiomatische deutsche Wiedergabe der emphatischen Zukunftsverneinung mit ἔτι, ohne den Sinn über den griechischen Text hinaus festzulegen.
  naturalness: „Und an ihre Sünden und ihre gesetzlosen Taten werde ich nie mehr denken“ ist modernes, verständliches und zugleich dem Zitatcharakter angemessen würdiges Standarddeutsch. Die Stellung von „an“ vor der ersten gemeinsamen Objektgruppe ist natürlich.
  terminology: „Sünden“ ist für ἁμαρτίαι präzise. „Gesetzlose Taten“ gibt ἀνομίαι verständlich und konkret wieder; es vermeidet das stärker traditionell oder konfessionell gefärbte „Missetaten“ beziehungsweise „Ungerechtigkeiten“. Das Verb „denken an“ bewahrt die Bildsprache des Nichtgedenkens, ohne sie zu einer Auslegung wie „nicht anrechnen“ umzudeuten.
