id: HEB.10.4
reference: Hebrews 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: de
  text: Denn das Blut von Stieren und Ziegenböcken kann unmöglich Sünden wegnehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sünden beseitigen.“ Das griechische Verb kann „wegnehmen“ oder „beseitigen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: kann unmöglich
  rationale: Das prädikative Adjektiv steht mit dem Infinitiv und bezeichnet eine absolute Unmöglichkeit. Die deutsche Konstruktion „kann unmöglich …“ gibt dies natürlich und prägnant wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und bewahrt mit „Denn“ den argumentativen Zusammenhang.
- source_word: αἷμα
  choice: das Blut
  rationale: Der konkrete Opferbegriff ist für die Argumentation des Hebräerbriefs wesentlich und wird daher nicht als „Opfer“ oder „Tod“ umschrieben.
- source_word: ταύρων
  choice: von Stieren
  rationale: Der Genitiv Plural wird im Deutschen natürlich mit „von“ wiedergegeben.
- source_word: τράγων
  choice: Ziegenböcken
  rationale: τράγος bezeichnet ausdrücklich einen männlichen Ziegenbock. „Ziegenböcke“ ist im Deutschen verständlich und bewahrt diese Genauigkeit.
- source_word: ἀφαιρεῖν
  choice: wegnehmen
  rationale: Das Verb bezeichnet das Wegnehmen oder Entfernen. „Sünden wegnehmen“ bewahrt den konkreten Ausdruck und passt zum kultisch-theologischen Zusammenhang.
- source_word: ἁμαρτίας
  choice: Sünden
  rationale: Der ausdrückliche Plural wird beibehalten und nicht zum abstrakten Singular „Sünde“ verallgemeinert.
theological_decisions:
- issue: Wirksamkeit von Tieropfern im Hebräerbrief
  choice: Der Vers erklärt, dass Tierblut Sünden nicht wegnehmen kann, ohne im Haupttext die genaue Reichweite dieser Aussage dogmatisch auszudeuten.
  alternative: Tieropfer bedeckten Sünden vorläufig oder bewirkten rituelle Reinigung, jedoch keine endgültige Beseitigung der Sünden.
  rationale: Die knappe Formulierung bleibt beim griechischen Wortlaut und wahrt die Spannung im Kontext zwischen den wiederholten Tieropfern und dem endgültig wirksamen Opfer des Messias.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich und betont durch „kann unmöglich“ die uneingeschränkte Aussage des griechischen ἀδύνατον.
