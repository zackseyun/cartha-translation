  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: de
  text: Wer das Gesetz des Mose verworfen hat, stirbt ohne Erbarmen aufgrund der Aussage von zwei oder drei Zeugen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird ohne Erbarmen getötet“. Wörtlich steht im Griechischen „stirbt“; der Zusammenhang meint die gerichtlich vollzogene Todesstrafe nach dem Gesetz des Mose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: verworfen hat
  rationale: Das Aoristpartizip bezeichnet die Zurückweisung oder Missachtung einer verbindlichen Ordnung. „Verworfen hat“ bewahrt den Gedanken der Ablehnung der Autorität des Gesetzes, ohne die Art des Vergehens enger als der griechische Ausdruck festzulegen.
- source_word: τις
  choice: Wer
  rationale: Das indefinite Pronomen ist allgemein gebraucht. Die deutsche Konstruktion „Wer …“ gibt diesen generischen Sinn natürlich wieder.
- source_word: νόμον Μωϋσέως
  choice: das Gesetz des Mose
  rationale: Die Genitivverbindung wird in geläufiger, würdiger Form eng am griechischen Wortlaut wiedergegeben.
- source_word: χωρὶς οἰκτιρμῶν
  choice: ohne Erbarmen
  rationale: Der griechische Plural wird im Deutschen idiomatisch als abstrakter Singular wiedergegeben. „Erbarmen“ passt zum gerichtlichen Zusammenhang und bewahrt zugleich die emotionale Färbung des Ausdrucks.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: aufgrund der Aussage von zwei oder drei Zeugen
  rationale: ἐπί mit Dativ bezeichnet hier die Grundlage des Urteils. „Aussage“ macht den rechtlichen Sinn deutlich, der im Griechischen durch „Zeugen“ und den gesetzlichen Hintergrund vorausgesetzt ist.
- source_word: ἀποθνῄσκει
  choice: stirbt
  rationale: Das Präsens formuliert die allgemeine Rechtsfolge. „Stirbt“ entspricht dem nicht kausativen griechischen Verb und lässt den Zusammenhang erkennen, dass es sich um eine gerichtlich vollzogene Todesstrafe handelt.
theological_decisions:
- issue: Ob der gerichtliche Vollzug der Todesstrafe in ἀποθνῄσκει ausdrücklich gemacht werden soll
  choice: Im Haupttext steht das formal nähere „stirbt“; eine Fußnote nennt „wird … getötet“ als kontextuell mögliche Wiedergabe.
  alternative: wird ohne Erbarmen getötet
  rationale: Der mosaische Rechtsrahmen legt eine gerichtliche Hinrichtung nahe. Da der griechische Text jedoch schlicht „stirbt“ sagt, wahrt der Haupttext dessen Zurückhaltung und erläutert die ausdrücklichere Deutung in der Fußnote.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Rechtsbegrifflichkeit wird klar wiedergegeben, ohne den knappen griechischen Wortlaut unnötig auszudeuten.
