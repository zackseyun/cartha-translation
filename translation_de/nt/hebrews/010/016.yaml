source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: de
  text: '»Das ist der Bund, den ich nach jenen Tagen mit ihnen schließen werde«, spricht der Herr: »Ich lege meine Gesetze auf ihre Herzen und werde sie auf ihren Sinn schreiben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erste Satzteil beginnt im Griechischen mit einem Partizip: „meine Gesetze auf ihre Herzen legend“; der deutsche Haupttext löst es mit einem finiten Verb auf.'
    reason: Macht die von διδοὺς geprägte, im Deutschen unnatürliche Partizipialkonstruktion transparent und bewahrt zugleich die gleichartige Bildsprache von ἐπί in beiden Satzteilen.
lexical_decisions:
- source_word: διαθήκη
  choice: Bund
  rationale: Im Jeremia-Zitat bezeichnet διαθήκη die von Gott gestiftete Bundesbeziehung; „Bund“ bewahrt den intertextuellen und theologischen Sinn.
- source_word: διαθήσομαι
  choice: schließen werde
  rationale: Im Deutschen ist „einen Bund schließen“ die natürliche und präzise Entsprechung der Bundesformel.
- source_word: πρὸς αὐτούς
  choice: mit ihnen
  rationale: Im Zusammenhang eines Bundesschlusses gibt πρὸς die beteiligte Gegenseite idiomatisch als „mit“ wieder.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: nach jenen Tagen
  rationale: Die zeitliche Wendung wird knapp und formal nah am Griechischen wiedergegeben.
- source_word: κύριος
  choice: der Herr
  rationale: Dies entspricht dem griechischen κύριος und ist im Zitatkontext würdig und verständlich.
- source_word: διδοὺς
  choice: Ich lege
  rationale: Das wörtliche Partizip „legend“ wäre im Deutschen unnatürlich. Die Auflösung als finites Verb vermittelt die Handlung klar; die formale Besonderheit wird in der Fußnote vermerkt.
- source_word: νόμους
  choice: Gesetze
  rationale: Der ausdrückliche Plural des griechischen Textes bleibt erhalten; zugleich wird die Verbindung zu νόμος gewahrt.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: auf ihre Herzen
  rationale: „Auf“ bewahrt die Bildsprache von ἐπί und bereitet das anschließende Schreiben auf einer Fläche vor.
- source_word: διάνοιαν
  choice: Sinn
  rationale: „Sinn“ bezeichnet hier das innere Denk- und Erkenntnisvermögen und bewahrt zugleich den griechischen Singular, ohne im Deutschen eine unnatürliche Formulierung zu erzeugen.
- source_word: ἐπιγράψω
  choice: werde ... schreiben
  rationale: Die Formulierung gibt das zukünftige Schreiben beziehungsweise Einschreiben klar und natürlich wieder.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist wie im Griechischen auf „meine Gesetze“ zurück.
theological_decisions:
- issue: Syntax des Jeremia-Zitats im Hebräerbrief
  choice: Das griechische Partizip διδοὺς wird im Haupttext als finites Verb „Ich lege“ wiedergegeben; seine Form wird in einer Fußnote transparent gemacht.
  alternative: Die Struktur formal als „indem ich meine Gesetze ... lege, und ich werde ...“ abbilden.
  rationale: Eine wörtliche Nachbildung wäre im modernen Deutschen sperrig und könnte den syntaktischen Bezug verdunkeln. Die gewählte Form bewahrt Inhalt und Abfolge, ohne den Wortlaut an eine traditionelle Fassung des Jeremia-Textes anzugleichen.
- issue: Singular von διάνοιαν bei pluralischem αὐτῶν
  choice: „in ihren Sinn“
  alternative: „in ihren Verstand“ oder idiomatischer pluralisch „in ihren Sinn/ihre Gedanken“
  rationale: Der kollektive Singular des griechischen Textes bleibt sichtbar. „Sinn“ ist im Deutschen mit pluralischem Possessivpronomen möglich und lässt die Spannung zwischen den mehreren Empfängern und dem singularischen Denkvermögen bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert. „Bund schließen“, „nach jenen Tagen“ und „auf ihre Herzen“ halten die Sprache nahe am Ausgangstext; die schwierige Partizipialsyntax wird lesbar geglättet und in der Fußnote dokumentiert.
