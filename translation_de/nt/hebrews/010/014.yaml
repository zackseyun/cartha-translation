  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Aspekte des Griechischen zuverlässig wieder: μιᾷ προσφορᾷ als „durch ein einziges Opfer“, das Perfekt τετελείωκεν als abgeschlossene Handlung mit fortdauernder Wirkung („hat … vollkommen gemacht“), εἰς τὸ διηνεκές als dauerhafte Geltung („für immer“) und das präsentische Passivpartizip τοὺς ἁγιαζομένους als fortlaufenden Vorgang („die geheiligt werden“). Die Spannung zwischen vollendeter Wirkung und gegenwärtiger Heiligung bleibt erhalten.'
