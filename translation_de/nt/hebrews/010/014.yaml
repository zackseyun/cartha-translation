  terminology: „Opfer“, „vollkommen gemacht“ und „geheiligt“ sind für den Hebräerbrief geeignete und konsistente theologische Begriffe. Die Fußnote bietet mit „heilig gemacht werden“ eine legitime, verständlichere Umschreibung von ἁγιάζω, ohne den Haupttext interpretativ einzuengen.
