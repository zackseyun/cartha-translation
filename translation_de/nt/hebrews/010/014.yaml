id: HEB.10.14
reference: Hebrews 10:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: de
  text: Denn durch ein einziges Opfer hat er die, die geheiligt werden[a], für immer vollkommen gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heilig gemacht werden“.'
    reason: Lexikalische Alternative, die die Grundbedeutung von ἁγιάζω transparenter umschreibt.
lexical_decisions:
- source_word: μιᾷ
  choice: ein einziges
  rationale: Der Dativ Singular bestimmt προσφορᾷ näher. „Ein einziges“ hebt im Deutschen die Einmaligkeit im Gegensatz zu den wiederholten Opfern des Zusammenhangs natürlich hervor.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorhergehende Aussage ein; „Denn“ bewahrt diese argumentative Verknüpfung.
- source_word: προσφορᾷ
  choice: Opfer
  rationale: προσφορά bezeichnet eine Gott dargebrachte Gabe beziehungsweise Opfergabe. Im kultischen Zusammenhang des Hebräerbriefs ist „Opfer“ verständlich und idiomatisch, auch wenn „Opfergabe“ näher an der formalen Wortbildung liegt.
- source_word: τετελείωκεν
  choice: hat … vollkommen gemacht
  rationale: Das Perfekt bezeichnet eine vollendete Handlung mit fortdauerndem Ergebnis. Die Formulierung bewahrt die im Hebräerbrief wichtige Vorstellung des Zur-Vollendung-Bringens.
- source_word: εἰς τὸ διηνεκές
  choice: für immer
  rationale: Die Wendung bezeichnet hier die bleibende, ununterbrochene Geltung des vollendeten Handelns. „Für immer“ ist im modernen Deutschen klar und idiomatisch.
- source_word: τοὺς ἁγιαζομένους
  choice: die, die geheiligt werden
  rationale: Das präsentische Passivpartizip wird als fortdauernder beziehungsweise sich vollziehender Vorgang wiedergegeben. „Geheiligt werden“ erhält zudem die kultisch-theologische Bedeutung des griechischen Verbs.
theological_decisions:
- issue: Verhältnis zwischen vollendeter Vervollkommnung und gegenwärtiger Heiligung
  choice: Die Spannung bleibt durch „hat … vollkommen gemacht“ und „die geheiligt werden“ erhalten.
  alternative: Die Aussage entweder rein statisch als „die Geheiligten“ oder ausschließlich prozesshaft wiederzugeben.
  rationale: Der griechische Text verbindet bewusst das abgeschlossene Handeln mit bleibendem Ergebnis (τετελείωκεν) und das präsentische Passivpartizip (ἁγιαζομένους). Die Übersetzung harmonisiert diese beiden Aspekte nicht zu einem bestimmten Lehrsystem.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ein einziges Opfer“ klingt natürlicher und nachdrücklicher als „durch ein Opfer“, während „vollkommen gemacht“ die für den Hebräerbrief charakteristische Vollendungssprache bewahrt.
