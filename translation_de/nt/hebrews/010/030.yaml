source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: de
  text: 'Denn wir kennen den, der gesagt hat: „Mein ist die Rache; ich werde vergelten“, und weiter[a]: „Der Herr wird sein Volk richten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zitat greift 5. Mose 32,35–36 auf. Im ursprünglichen Zusammenhang kann „richten“ sowohl Bestrafung als auch Rechtsschaffung und Befreiung einschließen; hier betont der Warnzusammenhang das göttliche Gericht.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν
  choice: wir kennen
  rationale: Das Perfekt οἶδα hat im Koine-Griechischen präsentische Bedeutung. Mit einem Personenobjekt ist „wir kennen den“ im Deutschen natürlicher als „wir wissen um den“.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden Anschluss an den vorhergehenden Vers.
- source_word: τὸν εἰπόντα
  choice: den, der gesagt hat
  rationale: Gibt das substantivierte Aoristpartizip natürlich wieder und lässt Gott als Sprecher des Schriftwortes persönlich hervortreten.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Mein ist die Rache
  rationale: Die elliptische Wendung bedeutet wörtlich etwa „Mir [gehört] die Rache“. Die gewählte feierliche Form ist knapp, verständlich und liegt eng am griechischen Ausdruck.
- source_word: ἀνταποδώσω
  choice: ich werde vergelten
  rationale: Gibt die zukünftige Erwiderung beziehungsweise angemessene Vergeltung gewichtiger und genauer wieder als das im Deutschen missverständliche „zurückzahlen“.
- source_word: καὶ πάλιν
  choice: und weiter
  rationale: Leitet ein weiteres Schriftzitat idiomatisch ein, ohne ein im Griechischen nicht wiederholtes Redeverb zu ergänzen.
- source_word: Κρινεῖ
  choice: wird richten
  rationale: Bewahrt die Breite des gerichtlichen Verbs κρίνω. Im Warnzusammenhang von Hebräer 10 tritt das göttliche Gericht hervor, ohne mögliche Aspekte der Rechtsschaffung im zitierten alttestamentlichen Kontext auszuschließen.
- source_word: κύριος
  choice: der Herr
  rationale: Übliche und angemessene Wiedergabe von κύριος in einem Schriftzitat, das sich auf Gott bezieht.
- source_word: τὸν λαὸν αὐτοῦ
  choice: sein Volk
  rationale: Natürliche deutsche Wiedergabe mit bewahrtem Bundesbezug.
theological_decisions:
- issue: Gerichtssprache im Zitat aus 5. Mose 32
  choice: „Der Herr wird sein Volk richten“
  alternative: „Der Herr wird seinem Volk Recht schaffen“ beziehungsweise „sein Volk rechtfertigen“
  rationale: κρίνω kann je nach Zusammenhang Verurteilung, Beurteilung oder Rechtsschaffung bezeichnen. Der unmittelbare Warnkontext in Hebräer 10 verlangt, die ernste gerichtliche Aussage nicht zu mildern; „richten“ bewahrt zugleich die lexikalische Spannweite.
- issue: Göttliche Vergeltung
  choice: „Mein ist die Rache; ich werde vergelten“
  alternative: „Mir gehört die Vergeltung; ich werde zurückzahlen“
  rationale: Die Übersetzung hält Gottes alleinigen Anspruch auf Vergeltung und die angekündigte Antwort auf das Unrecht fest, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle, aber weiterhin verständliche Formulierung „Mein ist die Rache“ wahrt die Kürze und Feierlichkeit des Zitats. Der Fußnotenmarker steht nach der Einleitungsformel, sodass er beide anschließenden Zitatteile erläutert.
