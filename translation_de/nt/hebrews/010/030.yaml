  source_fidelity: 'Der Text gibt die griechische Syntax und Aussage zuverlässig wieder: οἴδαμεν γάρ als „Denn wir kennen“, τὸν εἰπόντα als persönliche Bezugnahme auf den Sprecher, die elliptische Zitatformel „Mein ist die Rache“, das Futur „ich werde vergelten“ sowie κρινεῖ als „wird ... richten“. Die zwei durch καὶ πάλιν verbundenen Schriftzitate bleiben klar erkennbar.'
  naturalness: „Denn wir kennen den, der gesagt hat“ ist im würdevollen Bibelregister idiomatisch. „Mein ist die Rache“ ist bewusst feierlich und im modernen Standarddeutsch weiterhin verständlich; es wahrt zudem die knappe, elliptische Prägung des Zitats. „Und weiter“ funktioniert als Einleitung eines weiteren Zitats natürlich.
  terminology: „Rache“, „vergelten“, „der Herr“, „sein Volk“ und besonders „richten“ sind angemessen. „Richten“ bewahrt die gerichtliche Mehrdeutigkeit des Zitats, ohne den im Hebräerbrief hervortretenden Warncharakter zu verharmlosen. Die Fußnote erklärt die mögliche Spannweite im Deuteronomium-Kontext sachgerecht, ohne sie in den Haupttext hineinzutragen.
