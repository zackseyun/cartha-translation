source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: de
  text: 'Dann hat er gesagt: »Siehe, ich bin gekommen, um deinen Willen zu tun.« Er beseitigt das Erste, um das Zweite einzusetzen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »dem Ersten« und »dem Zweiten« sind wahrscheinlich die bisherige Opferordnung und die neue Wirklichkeit gemeint, in der Gottes Wille durch die Hingabe des Messias erfüllt wird. Die knappe Formulierung kann sich zunächst auch auf die beiden Aussagen des angeführten Psalms beziehen.
    reason: Bewahrt die Mehrdeutigkeit der substantivischen Ausdrücke und erläutert ihren wahrscheinlichsten Bezug im unmittelbaren Zusammenhang.
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet die zeitliche und argumentative Folge zum vorausgehenden Zitat; »Dann« ist knapp und natürlich.
- source_word: εἴρηκεν
  choice: hat er gesagt
  rationale: Das deutsche Perfekt gibt die vollendete Äußerung mit fortdauernder Bedeutung wieder und wahrt den Anschluss an τότε.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den hervorgehobenen, schriftsprachlich-feierlichen Einleitungsruf, ohne ihn umgangssprachlich abzuschwächen.
- source_word: ἥκω
  choice: ich bin gekommen
  rationale: Gibt die erfolgte Ankunft mit gegenwärtiger Folge idiomatisch wieder.
- source_word: τοῦ ποιῆσαι
  choice: um … zu tun
  rationale: Der artikulierte Infinitiv drückt hier den Zweck des Kommens aus.
- source_word: τὸ θέλημά σου
  choice: deinen Willen
  rationale: Entspricht dem theologischen Schlüsselbegriff θέλημα präzise und verständlich.
- source_word: ἀναιρεῖ
  choice: beseitigt
  rationale: Gibt das Wegnehmen beziehungsweise Außerkraftsetzen wieder, ohne im Haupttext bereits einen bestimmten institutionellen Bezug festzulegen.
- source_word: τὸ πρῶτον
  choice: das Erste
  rationale: Bewahrt die substantivische, knappe und im Kontext auszulegende Formulierung des Griechischen.
- source_word: ἵνα
  choice: um
  rationale: Markiert in der deutschen Infinitivkonstruktion klar den Zweck.
- source_word: τὸ δεύτερον
  choice: das Zweite
  rationale: Erhält die parallele, bewusst knappe Gegenüberstellung zum »Ersten«.
- source_word: στήσῃ
  choice: einzusetzen
  rationale: Vermittelt in diesem Zusammenhang das Aufrichten beziehungsweise Etablieren des Zweiten in natürlichem Deutsch.
theological_decisions:
- issue: Bezug von »das Erste« und »das Zweite«
  choice: Die knappen substantivischen Ausdrücke bleiben im Haupttext unaufgelöst.
  alternative: Sie könnten ausdrücklich als erste Opferordnung und als Erfüllung von Gottes Willen im Opfer des Messias oder weiter gefasst als alter und neuer Bund bezeichnet werden.
  rationale: Hebräer 10,8–10 stellt Opfer und Gaben dem Tun des Willens Gottes gegenüber. Eine explizite Ergänzung im Vers würde jedoch die echte Kürze und mögliche Spannweite des griechischen Wortlauts vorschnell festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« erhält den gehobenen Schriftton; der übrige Satz bleibt klar und gegenwärtig. Die parallelen Wendungen »das Erste« und »das Zweite« werden nicht erklärend erweitert.
