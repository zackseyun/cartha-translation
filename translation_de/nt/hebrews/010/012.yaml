  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: de
  text: Dieser aber hat ein einziges Opfer für die Sünden dargebracht, das für immer gilt, und sich zur Rechten Gottes gesetzt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Opfer für die Sünden für immer“. Die griechische Wendung kann die dauerhafte Geltung des Opfers bezeichnen; sie wird auch mit dem anschließenden „setzte sich“ verbunden verstanden.'
    reason: alternative_reading
  - marker: b
    text: „Zur Rechten Gottes“ greift Psalm 110,1 auf, einen zentralen Text des Hebräerbriefs über die Erhöhung des Messias.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: Dieser
  rationale: Bewahrt den demonstrativen Kontrast zu den in Vers 11 genannten Priestern und klingt im Deutschen würdevoll und verständlich.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den deutlichen Gegensatz zu den täglich stehenden Priestern und ihren wiederholten Opfern.
- source_word: μίαν ... θυσίαν
  choice: ein einziges Opfer
  rationale: Hebt die Einmaligkeit dieses Opfers gegenüber den vielen wiederholten Opfern hervor.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: für die Sünden
  rationale: Gibt den kultischen Bezug idiomatisch wieder und bewahrt den griechischen Plural.
- source_word: προσενέγκας
  choice: brachte ... dar
  rationale: Das deutsche Präteritum mit anschließender koordinierter Handlung gibt die zeitliche Vorordnung des Aoristpartizips natürlich wieder.
- source_word: εἰς τὸ διηνεκές
  choice: für immer
  rationale: Drückt die ununterbrochene beziehungsweise dauerhafte Geltung aus, lässt durch die Stellung im Satz aber die syntaktische Zuordnung offen.
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Gibt die punktuelle, abgeschlossene Handlung natürlich wieder und wahrt den Gegensatz zum Stehen der Priester in Vers 11.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: zur Rechten Gottes
  rationale: Ist die geläufige, würdevolle deutsche Wiedergabe der Erhöhungsformel und bewahrt den Bezug zu Psalm 110,1.
theological_decisions:
- issue: Zuordnung von εἰς τὸ διηνεκές
  choice: Im Haupttext steht „für immer“ nach „setzte sich“, entsprechend einer naheliegenden syntaktischen Verbindung mit dem Hauptverb.
  alternative: 'Die Wendung kann enger mit dem Opfer verbunden werden: „brachte ein einziges, für immer gültiges Opfer für die Sünden dar“.'
  rationale: Die griechische Wortstellung lässt eine Verbindung mit dem Sitzen besonders gut zu; zugleich betont der Kontext die bleibende Wirksamkeit des einmaligen Opfers. Die Fußnote bewahrt diese echte Zuordnungsfrage, ohne sie dogmatisch aufzulösen.
- issue: Messianische Erhöhung zur Rechten Gottes
  choice: Die traditionelle Wendung „zur Rechten Gottes“ bleibt im Text stehen.
  alternative: Eine erklärende Umschreibung wie „auf dem Ehrenplatz an Gottes rechter Seite“ wäre möglich.
  rationale: Die bildhafte Formulierung sollte wegen ihres direkten Bezugs auf Psalm 110,1 und ihrer Bedeutung für die Argumentation des Hebräerbriefs nicht paraphrasiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die demonstrative Form „Dieser“ wahrt den Kontrast des griechischen Textes; „ein einziges Opfer“ macht die emphatische Einmaligkeit deutlich. Die Haupttextstellung von „für immer“ folgt der naheliegenden syntaktischen Zuordnung zum Sitzen, während die Fußnote die im Kontext wichtige alternative Verbindung mit dem Opfer ausdrücklich erhält.
