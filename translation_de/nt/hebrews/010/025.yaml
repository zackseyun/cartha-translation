  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: de
  text: Dabei wollen wir unser Zusammenkommen nicht vernachlässigen[a], wie es bei manchen zur Gewohnheit geworden ist, sondern einander ermutigen – und das umso mehr, je näher ihr den Tag[b] herankommen seht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unser Zusammenkommen nicht aufgeben oder verlassen.'
    reason: lexical_alternative
  - marker: b
    text: Mit »dem Tag« ist wahrscheinlich der kommende Tag des Herrn beziehungsweise des Gerichts gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: nicht vernachlässigen
  rationale: Das Partizip mit μή führt die vorherige Aufforderung weiter. »Vernachlässigen« gibt das ausbleibende Festhalten am gemeinsamen Zusammenkommen natürlich wieder, ohne zwingend einen vollständigen Abfall zu behaupten; stärkere Bedeutungen wie »aufgeben« bleiben möglich.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: unser Zusammenkommen
  rationale: Die Wendung bezeichnet das Zusammenkommen der angesprochenen Gemeinschaft. »Zusammenkommen« bewahrt den gemeinschaftlichen Vorgang und vermeidet die Einengung auf eine spätere institutionelle Form wie »Gottesdienst«.
- source_word: καθὼς ἔθος τισίν
  choice: wie es bei manchen zur Gewohnheit geworden ist
  rationale: ἔθος bezeichnet Gewohnheit oder Brauch. Die Formulierung ist in modernem Deutsch klar und bewahrt den milden, aber deutlichen Tadel.
- source_word: παρακαλοῦντες
  choice: einander ermutigen
  rationale: παρακαλέω kann ermahnen, ermutigen oder trösten bedeuten. Im Zusammenhang des gegenseitigen Stärkens ist »ermutigen« angemessen; »einander« macht den im Gemeinschaftskontext naheliegenden wechselseitigen Bezug ausdrücklich.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: umso mehr, je
  rationale: Diese korrelative Konstruktion steigert die Aufforderung im Verhältnis zum Näherrücken des Tages. »Umso mehr, je« bildet diese Beziehung idiomatisch ab.
- source_word: βλέπετε
  choice: ihr … seht
  rationale: Die zweite Person Plural wird direkt wiedergegeben. »Sehen« lässt offen, woran oder auf welche Weise die Angesprochenen das Näherrücken erkennen.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: je näher ihr den Tag kommen seht
  rationale: Die Formulierung bewahrt das Bild eines sich nähernden, bestimmten Tages. Da deutsche Substantive ohnehin großgeschrieben werden, wird dessen wahrscheinlich endzeitlicher Bezug in einer Fußnote erläutert, ohne ihn im Text auszuweiten.
theological_decisions:
- issue: Endzeitlicher Bezug von τὴν ἡμέραν
  choice: den Tag
  alternative: den Tag des Herrn; den Gerichtstag
  rationale: Der bestimmte Artikel und der Zusammenhang mit Ausharren und Vollendung sprechen für den erwarteten endzeitlichen Tag. Die Übersetzung belässt jedoch die knappe Form des Griechischen und erläutert die wahrscheinliche Bedeutung in der Fußnote.
- issue: Wechselseitiger Bezug von παρακαλοῦντες
  choice: einander ermutigen
  alternative: ermutigen; einander ermahnen
  rationale: Ein ausdrückliches Objekt steht im Griechischen nicht, doch der gemeinschaftliche Zusammenhang legt die gegenseitige Handlung nahe. »Ermutigen« erhält die stärkende Bedeutung, ohne den möglichen ermahnenden Beiklang dogmatisch auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der einleitende Anschluss »Dabei wollen wir« macht die partizipiale Fortführung aus dem vorherigen Vers im Deutschen lesbar. Keine institutionelle Bezeichnung wie »Gottesdienst« wird in den griechischen Ausdruck hineingetragen.
