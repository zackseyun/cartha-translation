  terminology: Die Terminologie ist angemessen und nicht institutionell überformt. Die Fußnote zu »dem Tag« erläutert den wahrscheinlichen endzeitlichen Bezug, ohne den knappen griechischen Text zu einer bestimmten theologischen Formel auszuweiten. Die Alternativen »aufgeben« und »verlassen« sind als Fußnote sachgerecht.
