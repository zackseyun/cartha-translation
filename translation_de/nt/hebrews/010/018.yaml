- from: Wo aber Vergebung für diese[a] ist, da gibt es kein Opfer für Sünde mehr.
  to: Wo aber Vergebung dieser[a] ist, gibt es kein Opfer für Sünde mehr.
  rationale: Die Präposition „für“ wird durch den dem griechischen Genitiv entsprechenden Bezug „dieser“ ersetzt. Dadurch bleibt der Rückverweis auf die zuvor genannten Sünden und Gesetzlosigkeiten erhalten, ohne den griechischen Wortlaut stärker als nötig zu explizieren. Die übrige knappe, kultisch geprägte Formulierung kann bestehen bleiben.
