  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: de
  text: Wo aber Vergebung dieser[a] ist, gibt es kein Opfer für Sünde mehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erlass dieser“. Mit „dieser“ sind die im vorherigen Vers genannten Sünden und Gesetzlosigkeiten gemeint.'
    reason: Lexikalische Alternative und Klärung des Bezugsworts.
lexical_decisions:
- source_word: ὅπου
  choice: wo … da
  rationale: Die korrelative deutsche Fassung gibt den Bereich bzw. die Voraussetzung der Aussage natürlich und klar wieder.
- source_word: δὲ
  choice: aber
  rationale: Das schwach weiterführende bzw. folgernde δέ wird mit „aber“ wiedergegeben, ohne einen starken Gegensatz zu behaupten.
- source_word: ἄφεσις
  choice: Vergebung
  rationale: „Vergebung“ ist im heutigen Deutsch die klare und sachlich passende Bezeichnung für den Erlass von Sünden.
- source_word: τούτων
  choice: für diese
  rationale: Das Demonstrativpronomen bleibt wie im Griechischen ausdrücklich rückverweisend und bezieht sich auf die zuvor genannten Sünden und Gesetzlosigkeiten, ohne sie im Haupttext erneut auszuschreiben.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die Wendung bezeichnet, dass ein weiteres Opfer für Sünde nicht länger vorhanden bzw. erforderlich ist.
- source_word: προσφορὰ
  choice: Opfer
  rationale: Im kultischen Zusammenhang ist „Opfer“ natürlicher als „Darbringung“ und bewahrt den sachlichen Bezug, ohne die Art des Opfers zusätzlich einzuengen.
- source_word: περὶ ἁμαρτίας
  choice: für Sünde
  rationale: Die Formulierung erhält den singularischen und kultischen Ausdruck des Griechischen, statt deutend „Sündopfer“ oder pluralisch „für Sünden“ einzusetzen.
theological_decisions:
- issue: Endgültigkeit des Opfers Christi
  choice: Der Satz sagt, dass dort, wo Vergebung besteht, kein weiteres Opfer für Sünde mehr vorhanden ist.
  alternative: Die Aussage könnte entweder auf jede Art von Opfer ausgedehnt oder ausschließlich als begrenzte Aussage über levitische Wiederholungsopfer formuliert werden.
  rationale: Der unmittelbare Kontext stellt die wiederholten Opfer dem wirksamen, ein für alle Mal dargebrachten Opfer Christi gegenüber. Die Übersetzung wahrt die Aussage über das Ende weiterer Opfer für Sünde, ohne über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Wo … da“ sorgt für einen natürlichen Satzbau; „für Sünde“ bewahrt bewusst die knappe kultische Formulierung des Ausgangstextes.
