  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: de
  text: sondern nur noch ein furchtbares Erwarten des Gerichts und die Glut eines Feuers[a], die im Begriff ist, die Widersacher zu verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Eifer eines Feuers“; auch möglich: „eine feurige Glut“ oder „ein wütendes Feuer“.'
    reason: Die verdichtete Wendung πυρὸς ζῆλος verbindet Feuer mit heftiger, verzehrender Glut beziehungsweise Eifer. Die Fußnote dokumentiert die wörtlichere und idiomatischere Wiedergabemöglichkeit, ohne „Zorn“ als alleinige Bedeutung festzulegen.
lexical_decisions:
- source_word: φοβερὰ
  choice: furchtbares
  rationale: Das prädikativ gebrauchte Adjektiv kennzeichnet das bevorstehende Warten als erschreckend; „furchtbar“ bewahrt die Härte und den gehobenen Ton.
- source_word: δέ
  choice: sondern
  rationale: Im Zusammenhang mit der Verneinung in Vers 26 bildet δέ den Gegensatz zu dem, was nicht mehr bleibt; im Deutschen ist „sondern“ dafür idiomatischer als ein isoliertes „aber“.
- source_word: τις
  choice: nur noch ein
  rationale: Das indefinite τις wird nicht mechanisch mit „ein gewisses“ wiedergegeben, da dies im Deutschen abschwächend oder unnatürlich klänge. „nur noch ein“ erfasst zusammen mit dem Kontext die allein verbleibende, unbestimmt bezeichnete Aussicht.
- source_word: ἐκδοχὴ κρίσεως
  choice: Erwarten des Gerichts
  rationale: „Erwarten“ gibt den Vorgang des Erwartens beziehungsweise Harrens direkt wieder; „Gericht“ wahrt die gerichtliche Bedeutung, ohne das Ergebnis weiter auszudeuten.
- source_word: πυρὸς ζῆλος
  choice: die Zornesglut eines Feuers
  rationale: ζῆλος bezeichnet hier die heftige, verzehrende Leidenschaft beziehungsweise Glut. „Zornesglut“ bewahrt die personifizierte Heftigkeit, während „eines Feuers“ die Genitivverbindung sichtbar hält.
- source_word: ἐσθίειν μέλλοντος
  choice: das … verzehren wird
  rationale: Das genitivische Partizip μέλλοντος lässt sich auf πυρός beziehen; der deutsche Relativsatz macht deutlich, dass das Feuer zum Verzehren bevorsteht. Das Futur gibt die bevorstehende Handlung natürlich wieder, ohne eine präzise zeitliche Unmittelbarkeit zu erzwingen.
- source_word: τοὺς ὑπεναντίους
  choice: die Widersacher
  rationale: „Widersacher“ bezeichnet die feindlich Entgegenstehenden und erhält den ernsten, gehobenen Ton des Gerichtskontexts.
theological_decisions:
- issue: Art und Tragweite des Gerichtsbildes
  choice: Das Bild eines verzehrenden Feuers bleibt uneingeschränkt stehen, ohne seine genaue Dauer oder metaphysische Art festzulegen.
  alternative: Das Feuer ausdrücklich als ewige Strafe deuten oder zu einem bloßen Sinnbild abschwächen.
  rationale: Der Vers kündigt ein schweres göttliches Gericht an, bestimmt hier aber nicht alle systematisch-theologischen Einzelheiten. Die Übersetzung bewahrt deshalb sowohl die Wucht als auch die Offenheit des Bildes.
- issue: Bezug von μέλλοντος
  choice: Das bevorstehende Verzehren wird grammatisch auf das Feuer bezogen.
  alternative: Das Partizip sinngemäß auf den „Eifer“ beziehungsweise die „Zornesglut“ beziehen.
  rationale: Form und Kasus von μέλλοντος ermöglichen und begünstigen den Bezug auf das genitivische πυρός. In der Wirkung bleiben Feuer und seine Zornesglut eng miteinander verbunden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung von Vers 26 kleingeschrieben. „sondern nur noch“ stellt den notwendigen Zusammenhang mit der vorangehenden Verneinung her; „Widersacher“ erhält den feierlich-gerichtlichen Ton.
