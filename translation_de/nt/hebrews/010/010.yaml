  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: de
  text: Durch diesen Willen sind wir durch die Darbringung des Leibes Jesu, des Messias, ein für alle Mal geheiligt worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in diesem Willen“. „Ein für alle Mal“ kann im Griechischen besonders auf die Darbringung bezogen werden: „durch die ein für alle Mal erfolgte Darbringung des Leibes Jesu, des Messias“.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: Durch diesen Willen
  rationale: Die Wendung verweist auf den unmittelbar zuvor genannten Willen Gottes. „Durch“ gibt den instrumentalen Sinn im Deutschen natürlich wieder; „in diesem Willen“ wäre formaler, aber missverständlicher.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: sind wir … geheiligt worden
  rationale: Die periphrastische Perfektform bezeichnet eine vollzogene Handlung mit fortbestehendem Ergebnis. Das deutsche Perfekt mit „worden“ bewahrt sowohl den passiven Vorgang als auch dessen bleibende Wirkung.
- source_word: διὰ τῆς προσφορᾶς
  choice: durch die Darbringung
  rationale: διά mit Genitiv bezeichnet hier das Mittel. „Darbringung“ erfasst προσφορά im kultisch-opferbezogenen Zusammenhang genauer als das mehrdeutige „Gabe“.
- source_word: τοῦ σώματος
  choice: des Leibes
  rationale: Die Genitivverbindung folgt der griechischen Struktur und hebt die konkrete leibliche Hingabe Jesu hervor. „Leib“ entspricht dem würdigen biblischen Register, ohne unverständlich zu sein.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird als Titel in seiner Bedeutung „Messias“ wiedergegeben. Die Apposition ist idiomatisches Deutsch und macht den Titelcharakter deutlich.
- source_word: ἐφάπαξ
  choice: ein für alle Mal
  rationale: Die feste deutsche Wendung bringt die einmalige, endgültige und nicht zu wiederholende Darbringung prägnant zum Ausdruck.
theological_decisions:
- issue: Aspekt und Aussage der Heiligung
  choice: „sind wir … geheiligt worden“ als vollzogene Handlung mit bleibendem Ergebnis
  alternative: „sind wir geheiligt“
  rationale: Die gewählte Form wahrt den Perfektaspekt, ohne die Aussage konfessionell als ausschließlich statusbezogen oder als fortschreitenden Prozess auszudeuten.
- issue: Bezug von ἐν ᾧ θελήματι
  choice: 'instrumental: „Durch diesen Willen“'
  alternative: 'lokativ oder sphärisch: „In diesem Willen“'
  rationale: Der Kontext legt Gottes zuvor genannten Willen als Grundlage beziehungsweise wirksames Mittel der Heiligung nahe. Die mögliche wörtlichere Form wird in der Fußnote offengelegt.
- issue: Christologischer Titel Χριστός
  choice: „Messias“
  alternative: „Christus“
  rationale: Hier lässt sich Χριστός sinnvoll als Titel verstehen; „Messias“ bewahrt dessen Bedeutung, während „Christus“ im Deutschen stärker wie ein Namensbestandteil wirken kann.
- issue: Stellung von ἐφάπαξ
  choice: Bezug auf das Geheiligtwordensein in der deutschen Satzstellung, sachlich vermittelt durch die einmalige Darbringung
  alternative: unmittelbare Stellung bei „Darbringung“
  rationale: Im Griechischen steht das Adverb am Satzende und kann besonders die Darbringung als einmalig kennzeichnen. Die deutsche Form bleibt flüssig, während die Fußnote die syntaktische Bezugsmöglichkeit ausdrücklich wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darbringung“ und „Leib“ erhalten den kultischen und theologischen Ton des Ausgangstextes; die Satzstruktur bleibt klar und für heutige Leser verständlich.
