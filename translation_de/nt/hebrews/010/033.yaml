source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: de
  text: teils indem ihr durch Beschimpfungen und Bedrängnisse öffentlich zur Schau gestellt wurdet[a], teils indem ihr euch mit denen verbunden habt, denen es ebenso erging.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und bildhafter: »zu einem öffentlichen Schauspiel gemacht wurdet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder möglicherweise: »indem ihr euch mit denen verbunden habt, die so lebten/sich so verhielten«. Das griechische Partizip kann den Lebenswandel bezeichnen; im Zusammenhang der Verfolgung ist hier jedoch eher gemeint, dass es ihnen ebenso erging.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: teils ... teils
  rationale: Die korrelative Konstruktion unterscheidet zwei Formen der früher bewiesenen Standhaftigkeit. „Teils ... teils“ gibt diese Gliederung im Deutschen knapp und natürlich wieder.
- source_word: ὀνειδισμοῖς
  choice: Beschimpfungen
  rationale: Das Wort bezeichnet Schmähungen und ehrverletzende Vorwürfe. „Beschimpfungen“ ist gegenwärtig, verständlich und bewahrt den Aspekt verbaler Misshandlung.
- source_word: θλίψεσιν
  choice: Bedrängnisse
  rationale: Der Ausdruck bezeichnet schweren Druck und leidvolle Not. „Bedrängnisse“ wahrt die Breite des Begriffs und passt zum Verfolgungskontext.
- source_word: θεατριζόμενοι
  choice: öffentlich zur Schau gestellt wurdet
  rationale: Das Verb ruft das Bild einer öffentlichen Vorführung als Schauspiel hervor. Die Formulierung erhält sowohl die Öffentlichkeit als auch die Demütigung.
- source_word: κοινωνοὶ ... γενηθέντες
  choice: indem ihr euch mit ... verbunden habt
  rationale: κοινωνοί bezeichnet Teilhaber oder Gefährten, die solidarisch am Ergehen anderer Anteil nehmen. Die deutsche Wendung macht die aktive Solidarisierung deutlich, ohne bloße Freundschaft oder zwingend identisches Leiden zu behaupten.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: denen es ebenso erging
  rationale: Im unmittelbaren Zusammenhang mit Schmähungen und Bedrängnissen liegt ein Bezug auf Menschen nahe, die entsprechend behandelt wurden. Die idiomatische Formulierung vermeidet eine unnatürliche Passivkonstruktion; die mögliche Deutung als Lebenswandel bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von ἀναστρεφομένων im Zusammenhang
  choice: Bezug auf Menschen, denen es unter Verfolgung ebenso erging
  alternative: Bezug auf Menschen, die auf diese Weise lebten oder sich so verhielten
  rationale: Der unmittelbare Kontext handelt von öffentlicher Schmach, Bedrängnis und Solidarität mit Betroffenen. Dennoch kann ἀναστρέφομαι sonst den Lebenswandel bezeichnen; diese echte lexikalische Mehrdeutigkeit wird nicht verschwiegen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Struktur „teils ... teils“ spiegelt den griechischen Satzbau. „Öffentlich zur Schau gestellt“ erhält das anschauliche Theatermotiv, während die Fußnote die noch wörtlichere Form nennt. Die genuine Mehrdeutigkeit von ἀναστρεφομένων wird durch Fußnote [b] offengehalten.
