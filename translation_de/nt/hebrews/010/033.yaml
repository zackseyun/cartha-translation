  source_fidelity: Die Übersetzung gibt die korrelative Gliederung τοῦτο μὲν ... τοῦτο δέ angemessen mit „teils ... teils“ wieder. „durch Beschimpfungen und Bedrängnisse öffentlich zur Schau gestellt wurdet“ trifft ὀνειδισμοῖς, θλίψεσιν und θεατριζόμενοι einschließlich des öffentlichen Demütigungsaspekts. „euch mit denen verbunden habt, denen es ebenso erging“ vermittelt die solidarische Teilhabe von κοινωνοὶ ... γενηθέντες. Die kontextuell naheliegende Deutung von ἀναστρεφομένων als Betroffene entsprechenden Leidens wird gewählt, ohne die mögliche Verhaltensbedeutung zu verschweigen.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und gut lesbar. Die Wiederholung von „indem“ ist in der paarigen Konstruktion akzeptabel; „teils ... teils“ ist hier idiomatisch.
  terminology: „Beschimpfungen“, „Bedrängnisse“ und „öffentlich zur Schau gestellt“ sind sachgerecht und registerangemessen. Die Formulierung „sich mit denen verbunden habt“ bringt die Bedeutung von κοινωνοί als solidarische Gefährten klar zum Ausdruck, ohne eine stärkere Identifikation mit exakt demselben Leiden zu erzwingen.
