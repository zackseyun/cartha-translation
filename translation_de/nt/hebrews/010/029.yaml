id: HEB.10.29
reference: Hebrews 10:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: de
  text: 'Was meint ihr: Wie viel härtere Strafe wird der verdienen, der den Sohn Gottes mit Füßen getreten, das Blut des Bundes, durch das er geheiligt wurde[b], für etwas Gewöhnliches gehalten[a] und den Geist der Gnade verhöhnt[c] hat?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für unrein“ beziehungsweise „für profan gehalten“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „durch das er geheiligt wurde“ bezieht sich nach der griechischen Satzstruktur am naheliegendsten auf den beschriebenen Täter. Die Stelle wird jedoch auch anders gedeutet; die Übersetzung entscheidet die damit verbundene theologische Frage nicht über den Wortlaut hinaus.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „schwer beleidigt“ beziehungsweise „mit überheblicher Verachtung behandelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ … χείρονος
  choice: wie viel härtere
  rationale: Gibt die Verbindung von πόσῳ mit dem Komparativ χείρονος als natürliche deutsche Steigerungsfrage wieder.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: wird … Strafe verdienen
  rationale: Das Passiv bedeutet wörtlich, einer Strafe für würdig erachtet zu werden. „Strafe verdienen“ ist im Deutschen idiomatisch und bewahrt den gerichtlichen Sinn.
- source_word: καταπατήσας
  choice: mit Füßen getreten
  rationale: Bewahrt das drastische Bild verächtlicher Misshandlung, statt es abstrakt zu umschreiben.
- source_word: κοινὸν
  choice: für etwas Gewöhnliches
  rationale: κοινός bezeichnet hier das Gewöhnliche beziehungsweise Nichtgeheiligte im Gegensatz zum Heiligen. Die Formulierung erhält diesen Gegensatz, während die Fußnote mögliche stärkere Kontextbedeutungen nennt.
- source_word: αἷμα τῆς διαθήκης
  choice: das Blut des Bundes
  rationale: Bewahrt die feste biblische Wendung und ihren Opfer- und Bundesbezug.
- source_word: ἐν ᾧ
  choice: durch das
  rationale: 'Der instrumentale Sinn ist im Zusammenhang am naheliegendsten: Die Heiligung geschieht durch das Blut des Bundes.'
- source_word: ἡγιάσθη
  choice: er geheiligt wurde
  rationale: Bewahrt die passive Form und den für den Hebräerbrief wichtigen Begriff der Heiligung.
- source_word: ἐνυβρίσας
  choice: verhöhnt
  rationale: Drückt die beleidigende, überhebliche Verachtung kräftiger aus als das allgemeinere „beleidigt“, ohne die Handlung zu überdeuten.
- source_word: πνεῦμα τῆς χάριτος
  choice: Geist der Gnade
  rationale: Bewahrt die Genitivverbindung, ohne sie als „gnädiger Geist“ oder „Geist, der Gnade schenkt“ einseitig auszulegen.
theological_decisions:
- issue: Bezugswort von ἐν ᾧ ἡγιάσθη („durch das er geheiligt wurde“)
  choice: 'Die Formulierung wird syntaktisch auf die beschriebene Person bezogen: „durch das er geheiligt wurde“.'
  alternative: Deutungen, die Christus, das Blut selbst oder die Bundesgemeinschaft als sachlichen Bezug verstehen.
  rationale: Der Einzeltäter ist im griechischen Satz der nächstliegende persönliche Bezug. Da die Stelle in Fragen von Abfall und Bewahrung theologisch umstritten ist, gibt die Übersetzung die Syntax direkt wieder und weist auf abweichende Deutungen hin, ohne die Spannung dogmatisch aufzulösen.
- issue: Bedeutung von κοινόν im Verhältnis zu Heiligkeit und Reinheit
  choice: „für etwas Gewöhnliches gehalten“
  alternative: „für unrein“ oder „für profan gehalten“
  rationale: Die Grundbedeutung „gewöhnlich, nicht geheiligt“ bewahrt den Gegensatz zur Heiligung. Die möglichen kultischen beziehungsweise abwertenden Nuancen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die einleitende Form „Was meint ihr“ bildet δοκεῖτε natürlich ab; die drei Partizipialhandlungen werden als parallele deutsche Verbgruppen geführt. Bildsprache, Bundesterminologie und theologische Spannung bleiben erhalten.
