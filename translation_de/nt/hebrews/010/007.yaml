id: HEB.10.7
reference: Hebrews 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: de
  text: 'Da sagte ich: »Siehe, ich bin gekommen – in der Buchrolle[a] steht über mich geschrieben –, um deinen Willen zu tun, o Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist eine Schriftrolle, nicht ein modern gebundenes Buch.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Leitet die zitierte Reaktion knapp und natürlich als zeitliche Folge ein.
- source_word: εἶπον
  choice: sagte ich
  rationale: Die übliche und idiomatische Wiedergabe des Aorists von λέγω in einer Einleitungsformel zur direkten Rede.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den hervorgehobenen, feierlichen Hinweischarakter des Ausdrucks, ohne ihn umgangssprachlich abzuschwächen.
- source_word: ἥκω
  choice: ich bin gekommen
  rationale: 'Gibt die häufig perfektische Bedeutung des formal präsentischen Verbs wieder: Der Sprecher ist angekommen und nun gegenwärtig.'
- source_word: ἐν κεφαλίδι βιβλίου
  choice: in der Buchrolle
  rationale: Die Wendung bezeichnet hier eine Schrift- beziehungsweise Buchrolle, nicht die Überschrift oder ein modern gebundenes Buch.
- source_word: γέγραπται
  choice: steht … geschrieben
  rationale: Eine natürliche deutsche Wiedergabe des Perfekt Passiv, die das fortdauernde Vorliegen des Geschriebenen ausdrückt.
- source_word: περὶ ἐμοῦ
  choice: über mich
  rationale: Entspricht περί mit Genitiv und ist im modernen Deutschen klar und idiomatisch.
- source_word: τοῦ ποιῆσαι
  choice: um … zu tun
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck des Kommens.
- source_word: ὁ θεός
  choice: o Gott
  rationale: Der formal nominativische Ausdruck hat Anredefunktion; „o Gott“ macht diese im Deutschen eindeutig.
- source_word: τὸ θέλημά σου
  choice: deinen Willen
  rationale: Bewahrt den theologischen Schlüsselbegriff θέλημα präzise und in geläufiger deutscher Form.
theological_decisions:
- issue: Messianischer Selbstbezug des in Hebräer aufgenommenen Psalmzitats
  choice: Die Aussage bleibt ohne ergänzende Identifizierung des Sprechers in der ersten Person stehen.
  alternative: Den Sprecher im Vers ausdrücklich als Messias oder Christus bezeichnen.
  rationale: Der Zusammenhang des Hebräerbriefs bezieht das Zitat auf den Sohn beziehungsweise Christus; der Wortlaut dieses Verses enthält diese Bezeichnung jedoch nicht. Die Übersetzung lässt daher den Kontext die christologische Zuordnung leisten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Schriftzitatton. „Siehe“ und „o Gott“ bewahren die feierliche Anrede; die Satzstellung bleibt trotz der eingeschobenen Rollenformel gut nachvollziehbar.
