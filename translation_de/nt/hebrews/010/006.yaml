base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: de
  text: An Brandopfern und Sündopfern hattest du kein Gefallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An Brandopfern und Opfern für die Sünde hattest du kein Gefallen.“ Die griechische Wendung περὶ ἁμαρτίας ist im Opferzusammenhang eine feste Bezeichnung für ein Opfer, das wegen der Sünde dargebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: Brandopfern
  rationale: Der griechische Ausdruck bezeichnet Opfer, die vollständig verbrannt wurden. Das im Deutschen etablierte kultische Wort „Brandopfer“ gibt diese Opferart natürlich und präzise wieder.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden Opferarten.
- source_word: περὶ ἁμαρτίας
  choice: Sündopfern
  rationale: In kultischem Zusammenhang ist die Wendung eine feste Bezeichnung für Opfer, die wegen der Sünde beziehungsweise zur Sühnung dargebracht werden. „Sündopfer“ ist dafür der geläufige deutsche Fachausdruck.
- source_word: οὐκ
  choice: kein
  rationale: Die Verneinung wird in der natürlichen deutschen Verbindung „kein Gefallen haben“ vollständig wiedergegeben.
- source_word: εὐδόκησας
  choice: hattest du kein Gefallen
  rationale: Die zweite Person Singular richtet sich in dem Zitat an Gott. „Gefallen haben“ bewahrt den bewertenden und willensbezogenen Sinn des Verbs, ohne eine stärkere Gefühlsregung hineinzulesen.
theological_decisions:
- issue: Wiedergabe der Opferterminologie im Zitat aus Psalm 40 nach der Septuaginta innerhalb der Argumentation von Hebräer 10
  choice: Die spezifischen kultischen Begriffe „Brandopfer“ und „Sündopfer“ werden beibehalten.
  alternative: „Brandopfer und Opfer für die Sünde“
  rationale: Der Gedankengang unterscheidet konkrete Opferarten. Die präzise Terminologie wahrt diesen Zusammenhang, ohne die theologische Spannung durch eine allgemeinere oder deutende Formulierung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Brandopfer“ und „Sündopfer“ sind verständliche, etablierte Begriffe der biblischen Opfersprache; die Satzstellung schließt natürlich an den vorangehenden Vers an.
