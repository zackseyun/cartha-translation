  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: de
  text: Es ist furchtbar, in die Hände des lebendigen Gottes zu fallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es ist schrecklich, in die Hände des lebendigen Gottes zu fallen.«'
    reason: Lexikalische Alternative für φοβερὸν.
lexical_decisions:
- source_word: φοβερὸν
  choice: furchtbar
  rationale: Das prädikative Adjektiv bezeichnet etwas, das Furcht oder Schrecken hervorruft. „Furchtbar“ bewahrt die ernste Wucht und klingt im modernen Deutschen natürlich; „schrecklich“ ist eine mögliche, etwas stärker emotional gefärbte Alternative.
- source_word: τὸ ἐμπεσεῖν
  choice: zu fallen
  rationale: Der substantivierte Aoristinfinitiv wird im Deutschen idiomatisch mit „zu fallen“ wiedergegeben. Zusammen mit εἰς bezeichnet er das Geraten in den Machtbereich eines anderen.
- source_word: εἰς χεῖρας
  choice: in die Hände
  rationale: Die bildhafte Wendung bezeichnet, unter die Macht oder das Gericht eines anderen zu geraten. Die Beibehaltung von „Hände“ wahrt das biblische Bild und seine intertextuellen Bezüge.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv hängt von „Hände“ ab und wird ohne interpretierende Erweiterung wiedergegeben.
- source_word: ζῶντος
  choice: lebendigen
  rationale: Das Partizip bestimmt θεοῦ attributiv. „Der lebendige Gott“ ist die natürliche und traditionsübergreifend verständliche deutsche Wiedergabe.
theological_decisions:
- issue: Aussagekraft der Warnung
  choice: Eine allgemeine, feierlich-ernste Aussage über den Schrecken, unter die richterliche Macht des lebendigen Gottes zu geraten
  alternative: Nur zeitliche Züchtigung oder eine existenzielle Aussage ohne Gerichtsbezug
  rationale: Der Vers schließt einen Warnabschnitt ab, und die Wendung „in die Hände fallen“ trägt im Kontext richterliche Konnotationen. Diese werden durch das Bild bewahrt, ohne das im Griechischen nicht ausdrücklich vorhandene Wort „Gericht“ in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform und das traditionelle biblische Bild bleiben erhalten; die Formulierung ist zugleich für heutige Leser unmittelbar verständlich.
