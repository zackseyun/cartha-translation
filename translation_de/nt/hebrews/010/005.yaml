id: HEB.10.5
reference: Hebrews 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: de
  text: 'Darum[a] sagt er bei seinem Eintritt in die Welt: »Schlachtopfer und Opfergabe hast du nicht gewollt, aber einen Leib hast du mir bereitet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräer folgt hier dem griechischen Wortlaut von Psalm 40,7: »Einen Leib hast du mir bereitet.« Im hebräischen Text des Psalms heißt es: »Ohren hast du mir geöffnet.«'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet den Folgeschluss aus dem vorangehenden Gedankengang knapp und natürlich.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: bei seinem Eintritt in die Welt
  rationale: Gibt das präsentische Partizip als gleichzeitigen Umstand wieder, ohne unnötig festzulegen, ob der Fokus auf dem Zeitpunkt oder dem Vorgang liegt.
- source_word: λέγει
  choice: sagt er
  rationale: Bewahrt das Präsens, mit dem das neutestamentliche Zitat als gegenwärtig sprechendes Schriftwort eingeführt wird.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: Schlachtopfer und Opfergabe
  rationale: Hält die beiden kultischen Begriffe unterscheidbar; »Schlachtopfer« bezeichnet θυσία konkreter als das allgemeinere »Opfer«, während »Opfergabe« προσφορά verständlich wiedergibt.
- source_word: οὐκ ἠθέλησας
  choice: hast du nicht gewollt
  rationale: Gibt θέλω direkt und in modernem Deutsch wieder; der Kontext macht deutlich, dass Gottes Wille beziehungsweise Wohlgefallen gemeint ist.
- source_word: σῶμα
  choice: einen Leib
  rationale: Gibt den konkreten Singular idiomatisch wieder. »Leib« ist hier würdig und im Zusammenhang der verkörperten Existenz präziser als das stärker alltagssprachliche »Körper«.
- source_word: δὲ
  choice: aber
  rationale: Bewahrt den deutlichen Gegensatz zwischen den nicht gewollten Opferhandlungen und dem bereiteten Leib.
- source_word: κατηρτίσω
  choice: hast du bereitet
  rationale: Gibt die Bedeutung »vorbereiten, zurechtmachen« im Kontext klar und traditionsnah wieder, ohne zusätzliche Vorstellungen wie Erschaffung oder Formung einzutragen.
- source_word: μοι
  choice: mir
  rationale: Der Dativ wird im Deutschen unmittelbar und idiomatisch wiedergegeben.
theological_decisions:
- issue: Der Wortlaut des Zitats in Hebräer 10,5 weicht beim Bezug auf Psalm 40,7 vom hebräischen Psalmentext ab.
  choice: Der griechische Wortlaut des Hebräerbriefs wird mit »einen Leib hast du mir bereitet« übersetzt.
  alternative: 'Nach dem hebräischen Text von Psalm 40,7: »Ohren hast du mir geöffnet/ausgehöhlt.«'
  rationale: Für die Übersetzung dieses Verses ist der überlieferte griechische Text des Hebräerbriefs maßgeblich. Die bedeutsame Abweichung vom hebräischen Psalmentext wird nicht harmonisiert, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Formulierung »bei seinem Eintritt in die Welt« wahrt den Bezug des Partizips zum Sagen und vermeidet eine unnötige Vergangenheitsfestlegung. Die Anführungszeichen kennzeichnen das Schriftzitat.
