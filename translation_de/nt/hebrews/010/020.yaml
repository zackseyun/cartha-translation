  source_fidelity: Die Wiedergabe von ἐνεκαίνισεν als »eröffnet hat«, von πρόσφατον καὶ ζῶσαν als »neuen und lebendigen« sowie von καταπέτασμα als »Vorhang« ist tragfähig. Jedoch enthält der griechische Text nach τοῦτ’ ἔστιν nur den Genitiv »seines Fleisches«; das zweite »durch« steht nicht im Text. Die Konstruktion erläutert den Vorhang appositionell als sein Fleisch.
