  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: de
  text: 'den er uns als neuen und lebendigen Weg durch den Vorhang eröffnet hat – das heißt: sein Fleisch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das heißt: sein Fleisch«. Die Formulierung identifiziert den Vorhang bildhaft mit Jesu Fleisch.'
    reason: cultural_note
lexical_decisions:
- source_word: ἣν
  choice: den
  rationale: Das Relativpronomen bezieht sich grammatisch auf den unmittelbar folgenden »Weg«; die maskuline Form stellt diesen Bezug im Deutschen natürlich her.
- source_word: ἐνεκαίνισεν
  choice: eröffnet hat
  rationale: Das Verb bezeichnet die Einweihung beziehungsweise erstmalige Eröffnung zum Gebrauch. »Eröffnet« ist verständlich und bewahrt im Zusammenhang eines neu zugänglich gemachten Weges den inaugurierenden Sinn.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Begünstigten; in Verbindung mit »eröffnet« gibt »uns« dies idiomatisch wieder.
- source_word: ὁδὸν πρόσφατον καὶ ζῶσαν
  choice: als neuen und lebendigen Weg
  rationale: »Weg« bewahrt das Zugangsbild; »neu« gibt den kontextuellen Sinn von πρόσφατος natürlich wieder, und »lebendig« hält die ungewöhnliche, theologisch bedeutsame Bildsprache offen.
- source_word: διὰ τοῦ καταπετάσματος
  choice: durch den Vorhang
  rationale: καταπέτασμα bezeichnet hier den Vorhang des Heiligtums. »Vorhang« ist modernes Standarddeutsch und behält den konkreten kultischen Bezug bei.
- source_word: τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ
  choice: 'das heißt: durch sein Fleisch'
  rationale: Die erläuternde Apposition setzt den Vorhang zu Christi Fleisch in Beziehung. Die Wiederaufnahme von »durch« macht den syntaktischen Anschluss im Deutschen klar, ohne die Metapher aufzulösen; σάρξ wird transparent mit »Fleisch« wiedergegeben.
theological_decisions:
- issue: Beziehung zwischen dem Vorhang und dem Fleisch Jesu
  choice: '»das heißt: durch sein Fleisch«'
  alternative: '»das heißt: sein Fleisch«'
  rationale: Die Wiederholung von »durch« liest den Genitiv als appositionale Erläuterung des von διά abhängigen Ausdrucks und erhält das Motiv des Zugangs durch Jesu Fleisch. Die knapper formale Alternative bleibt grammatisch möglich, klingt im Deutschen jedoch abgebrochener.
- issue: Wiedergabe von σάρξ
  choice: Fleisch
  alternative: Leib
  rationale: »Fleisch« wahrt die lexikalische und bildhafte Spannung des griechischen Ausdrucks. »Leib« wäre glatter, würde aber die Wortwahl des Textes weniger genau erkennen lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als abhängiger Relativsatz an Vers 19 angeschlossen. Die kultische Bildsprache wird nicht erklärend aufgelöst.
