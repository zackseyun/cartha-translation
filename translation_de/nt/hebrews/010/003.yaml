  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: de
  text: Doch bei diesen Opfern wird Jahr für Jahr an die Sünden erinnert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jedes Jahr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Die adversative Konjunktion stellt den Gegensatz zu der zuvor verneinten dauerhaften Reinigung heraus. „Doch“ ist knapp, natürlich und würdevoll.
- source_word: ἐν αὐταῖς
  choice: durch diese Opfer
  rationale: Das feminine Pronomen verweist im Kontext auf die wiederholt dargebrachten Opfer. Im Deutschen wird der Bezug zur Klarheit ausdrücklich genannt; „durch“ gibt die instrumentale beziehungsweise vermittelnde Bedeutung des griechischen ἐν hier idiomatisch wieder.
- source_word: ἀνάμνησις
  choice: wird … erinnert
  rationale: Die substantivische Wendung wird natürlich verbal wiedergegeben. Sie bezeichnet ein Wieder-ins-Bewusstsein-Bringen, ohne festzulegen, wer sich erinnert.
- source_word: ἁμαρτιῶν
  choice: an die Sünden
  rationale: Bei deutschem „erinnern“ entspricht die Präpositionalergänzung „an“ dem griechischen Genitiv und bewahrt die Sünden als Gegenstand der Erinnerung.
- source_word: κατ’ ἐνιαυτόν
  choice: Jahr für Jahr
  rationale: Die Wendung bezeichnet jährlich wiederkehrendes Geschehen. „Jahr für Jahr“ bringt die für den Gedankengang wichtige fortgesetzte Wiederholung natürlich zum Ausdruck.
theological_decisions:
- issue: Referent von αὐταῖς
  choice: Der Rückverweis wird als „diese Opfer“ ausdrücklich gemacht.
  alternative: Nur pronominal „durch sie“ oder formal-lokal „in ihnen“.
  rationale: Der unmittelbare Kontext handelt von den immer wieder dargebrachten Opfern. Die ausdrückliche Benennung verbessert die Verständlichkeit, ohne dem Text einen neuen theologischen Inhalt hinzuzufügen.
- issue: Agens der Erinnerung
  choice: Die unpersönliche Passivform „wird … erinnert“ lässt offen, wer erinnert wird oder sich erinnert.
  alternative: „Sie erinnern …“ oder „es gibt eine Erinnerung“.
  rationale: Der griechische Nominalsatz nennt kein ausdrückliches Agens. Die gewählte Form bewahrt diese Offenheit und vermeidet eine unnötige theologische Festlegung.
- issue: Zeitliche Kraft von κατ’ ἐνιαυτόν
  choice: „Jahr für Jahr“ betont die fortgesetzte jährliche Wiederholung.
  alternative: „jedes Jahr“ oder „jährlich“.
  rationale: Alle Möglichkeiten sind sachlich zutreffend; „Jahr für Jahr“ spiegelt jedoch besonders gut die Wiederholung, die für die Argumentation des Hebräerbriefs entscheidend ist.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Satzform. Die verbale Wiedergabe von ἀνάμνησις ist idiomatischer als „eine Erinnerung an die Sünden findet statt“ und bewahrt durch das unpersönliche Passiv die Offenheit des griechischen Textes.
