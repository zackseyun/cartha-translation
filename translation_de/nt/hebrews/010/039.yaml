  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: de
  text: Wir aber gehören nicht zu denen, die zurückweichen und ins Verderben geraten, sondern zu denen, die glauben und so ihr Leben bewahren.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die zurückschrecken“ bzw. „sich zurückziehen“. Das griechische Wort bezeichnet einen Rückzug; hier kann damit auch der Abfall vom Glauben gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sondern zum Glauben, zur Bewahrung der Seele“. Möglich ist auch: „zur Gewinnung der Seele“. „Seele“ kann hier das Leben oder die ganze Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς
  choice: Wir aber gehören nicht zu denen, die zurückweichen
  rationale: Die betonte Gegenüberstellung durch ἡμεῖς δέ wird natürlich wiedergegeben. Der Genitiv bezeichnet die Zugehörigkeit zu einer Gruppe oder Haltung; „zurückweichen“ bewahrt den Sinn von Rückzug, ohne ihn vorschnell als vollständigen Abfall festzulegen.
- source_word: εἰς ἀπώλειαν
  choice: und ins Verderben geraten
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis. Die verbale Fassung macht den knappen griechischen Zusammenhang in heutigem Deutsch verständlich; „Verderben“ erhält den ernsten, heilsgeschichtlichen Sinn von ἀπώλεια.
- source_word: ἀλλὰ πίστεως
  choice: sondern zu denen, die glauben
  rationale: Der parallele Zugehörigkeitsgenitiv wird aufgenommen. πίστις bezeichnet hier den Glauben beziehungsweise das vertrauende Festhalten, das dem Zurückweichen gegenübersteht.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: und so ihr Leben bewahren
  rationale: Im Gegensatz zu ἀπώλεια liegt für περιποίησις der Sinn von Bewahrung nahe. ψυχή meint hier wahrscheinlich das Leben beziehungsweise die eigene Person und nicht ausschließlich die „Seele“ im engeren modernen Sinn. „und so“ drückt die Ziel- oder Ergebnisbeziehung von εἰς aus, ohne einen verdienstlichen Erwerb zu unterstellen.
theological_decisions:
- issue: Bedeutung von πίστις im Gegensatz zu ὑποστολή
  choice: glauben
  alternative: treu bleiben / Treue
  rationale: Der Kontext stellt glaubendes Festhalten dem Zurückweichen gegenüber. Die Wiedergabe mit „glauben“ lässt die mögliche Nuance ausdauernder Treue bestehen, ohne πίστις darauf zu verengen.
- issue: Bedeutung von περιποίησις ψυχῆς
  choice: ihr Leben bewahren
  alternative: ihre Seele gewinnen / ihre Seele bewahren
  rationale: Der unmittelbare Gegensatz zum Verderben spricht für Bewahrung. Zugleich kann περιποίησις auch Gewinnen oder Erlangen und ψυχή Seele, Leben oder Person bezeichnen; diese echte Bedeutungsbreite wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zugehörigkeitskonstruktion macht die ungewöhnlich knappen griechischen Genitive verständlich. Die verbale Parallelführung ist idiomatisch, während die Fußnoten die formale Struktur und die lexikalische Mehrdeutigkeit bewahren.
