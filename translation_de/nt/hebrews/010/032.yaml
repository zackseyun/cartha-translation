source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: de
  text: Doch erinnert euch an die früheren Tage, als ihr, nachdem ihr erleuchtet worden wart,[a][b] einen großen Kampf voller Leiden durchgestanden habt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ihr erleuchtet wurdet“. Das griechische Partizip kann hier als vorausgehende Handlung oder in enger zeitlicher Verbindung mit dem anschließenden Geschehen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Erleuchtet“ kann allgemein den Empfang geistlicher Erkenntnis bezeichnen. Der Ausdruck wird unterschiedlich mit Bekehrung, Taufe oder Unterweisung im Glauben verbunden.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „einen harten Wettkampf voller Leiden“. Das griechische Wort bezeichnet einen Kampf oder Wettkampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: erinnert euch
  rationale: Der Imperativ Präsens fordert die Angesprochenen auf, sich die damalige Zeit wieder bewusst vor Augen zu führen. „Erinnert euch“ ist im modernen Deutschen natürlich; ein fortdauernder Aspekt bleibt im Kontext mitgemeint.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel kennzeichnet hier eine leichte Gegenüberstellung beziehungsweise rhetorische Wendung gegenüber der vorangehenden Warnung.
- source_word: τὰς πρότερον ἡμέρας
  choice: die früheren Tage
  rationale: Die Wendung bezeichnet die zurückliegende Anfangszeit der Leser und bewahrt das griechische Bild der „Tage“.
- source_word: ἐν αἷς
  choice: als
  rationale: Das wörtliche „in denen“ hat zeitliche Bedeutung. „Als“ gibt diese in natürlichem Deutsch wieder.
- source_word: φωτισθέντες
  choice: nachdem ihr erleuchtet worden wart
  rationale: Das Aoristpartizip im Passiv bezeichnet eine empfangene Erleuchtung. „Nachdem“ stellt die naheliegende Vorzeitigkeit zur folgenden Aussage dar, ohne die geistliche Metapher auszudeuten.
- source_word: πολλὴν ἄθλησιν
  choice: einen schweren Kampf
  rationale: ἄθλησις bezeichnet einen Wettkampf oder ein hartes Ringen. „Schwerer Kampf“ vermittelt das Bild und die durch πολλήν ausgedrückte Intensität idiomatisch.
- source_word: ὑπεμείνατε
  choice: durchgestanden habt
  rationale: Das Verb bezeichnet standhaftes Ausharren unter Belastung. „Durchgestanden“ ist verständlich und bringt sowohl Ertragen als auch Beharren zum Ausdruck.
- source_word: παθημάτων
  choice: voller Leiden
  rationale: Der Genitiv bestimmt den Kampf als von Leiden geprägt. „Voller Leiden“ ist natürlich und bewahrt die Breite des griechischen Ausdrucks.
theological_decisions:
- issue: Bedeutung von φωτισθέντες im Zusammenhang der Warnung und Ermahnung
  choice: Die Metapher „erleuchtet“ bleibt ohne nähere dogmatische Festlegung erhalten.
  alternative: Der Ausdruck könnte ausdrücklich auf Bekehrung, Taufe oder Unterweisung im Glauben bezogen werden.
  rationale: Der Vers spricht von einer früher empfangenen geistlichen Erleuchtung, benennt aber nicht eindeutig ein bestimmtes kirchliches oder biografisches Ereignis. Die offene Formulierung bewahrt diese theologische Spannung.
- issue: Zeitliches Verhältnis des Partizips φωτισθέντες zum Erdulden
  choice: „nachdem ihr erleuchtet worden wart“ gibt die Erleuchtung als dem Kampf vorausgehend wieder.
  alternative: „als ihr erleuchtet wurdet“ kann Erleuchtung und Beginn des Leidenskampfes zeitlich enger verbinden.
  rationale: Beim Aoristpartizip ist Vorzeitigkeit zum Hauptverb naheliegend, doch kann der Zusammenhang im Deutschen auch mit zeitlicher Überlappung beziehungsweise unmittelbarer Folge ausgedrückt werden; daher wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht im Plural. Die geistliche Metapher „erleuchtet“ und das Kampf-/Wettkampfwortfeld werden bewahrt, ohne den Vers konfessionell zu verengen.
