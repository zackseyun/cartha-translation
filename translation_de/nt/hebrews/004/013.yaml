source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: de
  text: Und kein Geschöpf ist vor ihm verborgen; vielmehr liegt alles nackt und bloß[b] vor seinen Augen. Ihm müssen wir Rechenschaft geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „zu dem hin für uns das Wort [ist]“. Die griechische Wendung kann auch bedeuten: „mit dem wir es zu tun haben“ oder „an den sich unsere Sache richtet“.'
    reason: alternative_reading
  - marker: b
    text: Das mit „bloß“ wiedergegebene seltene Wort kann das Bild eines freigelegten oder zurückgebogenen Halses anklingen lassen und betont die vollständige Offenlegung vor Gott.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: Geschöpf
  rationale: Der Singular bezeichnet allgemein jedes geschaffene Wesen oder Ding. „Geschöpf“ bewahrt den Bezug zum Geschaffensein und ist im Deutschen prägnant.
- source_word: ἀφανὴς
  choice: verborgen
  rationale: Gemeint ist im Zusammenhang nicht metaphysische Unsichtbarkeit, sondern dass sich nichts Gottes prüfendem Blick entziehen kann.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Dies entspricht der räumlich-relationalen Grundbedeutung und fügt sich natürlich in die Aussage über Gottes Wahrnehmung ein.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural hat umfassende Bedeutung; „alles“ ist im modernen Deutschen natürlich und vollständig.
- source_word: γυμνὰ
  choice: nackt
  rationale: Die direkte, anschauliche Wiedergabe bewahrt das Bild völliger Schutzlosigkeit und Offenlegung.
- source_word: τετραχηλισμένα
  choice: bloß
  rationale: Das seltene Partizip bezeichnet einen Zustand vollständiger Offenlegung und kann das Bild eines freigelegten oder zurückgebogenen Halses anklingen lassen. „bloß“ bildet mit „nackt“ eine natürliche, eindringliche Wendung, ohne die umstrittene Bildvorstellung festzulegen.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: vor seinen Augen
  rationale: Die deutsche Wendung bringt den Bezug auf Gottes uneingeschränktes Sehen idiomatisch und bildhaft zum Ausdruck.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: Ihm müssen wir Rechenschaft geben
  rationale: Die knappe griechische Wendung kann im Kontext göttlicher Prüfung die Verantwortlichkeit gegenüber Gott bezeichnen. Die verständliche Haupttextfassung erhält die Warnfunktion; die formnäheren Möglichkeiten stehen in der Fußnote.
theological_decisions:
- issue: Deutung von πρὸς ὃν ἡμῖν ὁ λόγος
  choice: 'Die Wendung bezeichnet die Rechenschaft, die Menschen Gott schulden: „Ihm müssen wir Rechenschaft geben.“'
  alternative: „mit dem wir es zu tun haben“ oder formnäher „auf den unser Wort/unsere Sache gerichtet ist“
  rationale: Der unmittelbare Zusammenhang handelt von Gottes durchdringender Erkenntnis und prüfendem Urteil. Die Rechenschaftsdeutung bewahrt die warnende Aussage, während eine Fußnote die echte sprachliche Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext ist klar und gut vorlesbar; die seltene Bildsprache und die Mehrdeutigkeit des Schlusssatzes werden in Fußnoten bewahrt. Beide Fußnotenmarker stehen im Haupttext; [a] bezieht sich auf den Schlusssatz, [b] auf „bloß“.
