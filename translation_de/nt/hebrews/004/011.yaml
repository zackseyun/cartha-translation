id: HEB.4.11
reference: Hebrews 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: de
  text: Lasst uns also alles daransetzen, in jene Ruhe einzugehen, damit niemand nach demselben Beispiel des Ungehorsams[a] zu Fall kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach demselben Beispiel des Unglaubens«. Das griechische Wort bedeutet unmittelbarer »Ungehorsam«, ist hier aber eng mit der Weigerung der Wüstengeneration verbunden, Gott zu vertrauen.'
    reason: 'Lexikalische Alternative: ἀπείθεια kann im Zusammenhang unter dem Gesichtspunkt des Unglaubens verstanden werden.'
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: Lasst uns alles daransetzen
  rationale: Der hortative Aorist-Konjunktiv formuliert eine eindringliche gemeinsame Aufforderung. »Alles daransetzen« gibt den Ernst und den tätigen Eifer von σπουδάζω in natürlichem modernem Deutsch wieder.
- source_word: οὖν
  choice: also
  rationale: Das Wort kennzeichnet die Folgerung aus der vorausgehenden Darlegung über Gottes Ruhe und Israels Scheitern. »Also« stellt diesen logischen Anschluss knapp und idiomatisch her.
- source_word: εἰσελθεῖν
  choice: einzugehen
  rationale: Der Aorist-Infinitiv ergänzt σπουδάσωμεν und bezeichnet das angestrebte Handeln. »In … eingehen« entspricht der räumlichen Bildsprache des griechischen Textes.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: jene Ruhe
  rationale: κατάπαυσις bezeichnet die im Zusammenhang entfaltete, von Gott verheißene Ruhe. Das Demonstrativpronomen wird mit »jene« bewahrt, ohne die Art dieser Ruhe über den Text hinaus festzulegen.
- source_word: ἵνα μὴ
  choice: damit niemand
  rationale: Die Verbindung leitet eine verneinte Ziel- oder Folgerungsaussage mit warnendem Charakter ein. »Damit niemand« ist im Deutschen klar und natürlich.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: nach demselben Beispiel
  rationale: ὑπόδειγμα kann ein Beispiel, Muster oder warnendes Vorbild bezeichnen. »Nach demselben Beispiel« verweist verständlich auf den Präzedenzfall der Wüstengeneration und lässt die Bedeutungsbreite des Ausdrucks weitgehend bestehen.
- source_word: πέσῃ
  choice: zu Fall kommt
  rationale: Der Aorist-Konjunktiv nach ἵνα μή trägt den ernsten Warncharakter. »Zu Fall kommt« ist eine natürliche deutsche Wiedergabe und bewahrt die Bildlichkeit von πίπτω.
- source_word: τῆς ἀπειθείας
  choice: des Ungehorsams
  rationale: ἀπείθεια bezeichnet unmittelbar Ungehorsam beziehungsweise die Weigerung, sich überzeugen zu lassen. In Hebräer 3–4 ist dies eng mit Unglauben verbunden; die direkte lexikalische Bedeutung bleibt jedoch im Haupttext erhalten.
theological_decisions:
- issue: Verhältnis von ἀπείθεια zum Unglauben der Wüstengeneration
  choice: Im Haupttext steht »Ungehorsam«; »Unglaube« wird als kontextuell mögliche Wiedergabe in einer Fußnote genannt.
  alternative: Unglaube
  rationale: Hebräer 3–4 verbindet Unglauben und Ungehorsam eng miteinander. Die Übersetzung »Ungehorsam« wahrt den unmittelbareren lexikalischen Sinn von ἀπείθεια, ohne durch die Fußnote die Glaubensdimension des Versagens der Wüstengeneration auszublenden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gemeinsame Mahnung bleibt eindringlich, ohne altertümliche Wendungen; die wiederkehrende Bildsprache vom Eingehen in Gottes Ruhe und vom Zu-Fall-Kommen wird bewahrt.
