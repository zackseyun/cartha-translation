  to: 'Wiederum setzt er einen Tag fest, nämlich »Heute«, indem er nach so langer Zeit durch David[a] sagt, wie schon zuvor gesagt worden ist:


    »Heute, wenn ihr seine Stimme hört,


    verhärtet eure Herzen nicht.«'
  rationale: Die Revision beseitigt die konditionale Mehrdeutigkeit von »wenn er ... sagt« durch »indem er ... sagt« und glättet die unnötige Wiederholung von »bestimmt«. Die semantische Offenheit von ἐν Δαυὶδ bleibt durch die Fußnote erhalten; keine bestimmte Auffassung zur Autorschaft des Psalms wird vorausgesetzt.
