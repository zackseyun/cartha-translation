id: HEB.4.7
reference: Hebrews 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: de
  text: 'Wiederum setzt er einen Tag fest, nämlich »Heute«, indem er nach so langer Zeit durch David[a] sagt, wie schon zuvor gesagt worden ist:


    »Heute, wenn ihr seine Stimme hört,


    verhärtet eure Herzen nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in David«, das heißt, in dem mit David verbundenen Psalm.'
    reason: Die Wendung ἐν Δαυίδ kann die Rede durch David bezeichnen oder auf den mit David verbundenen Psalm verweisen.
lexical_decisions:
- source_word: πάλιν
  choice: Wiederum
  rationale: 'Kennzeichnet die erneute Aufnahme und Weiterführung des Gedankens: Gott bestimmt erneut einen Tag.'
- source_word: τινὰ ἡμέραν
  choice: einen bestimmten Tag
  rationale: Das indefinite Pronomen bezeichnet hier einen konkreten, zunächst nicht näher benannten Tag; »bestimmt« bewahrt diese Nuance.
- source_word: ὁρίζει
  choice: bestimmt
  rationale: Das Verb bezeichnet das autoritative Festlegen oder Bezeichnen eines Tages und bleibt im Deutschen natürlich.
- source_word: Σήμερον
  choice: Heute
  rationale: Das Wort benennt den festgesetzten Tag und behält als hervorgehobenes Zitat seine rhetorische Kraft.
- source_word: ἐν Δαυὶδ λέγων
  choice: durch David sagt
  rationale: Die Formulierung gibt David als vermittelnde Stimme der Gottesrede wieder, ohne die idiomatische Wendung unnötig zu überdeuten; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: nach so langer Zeit
  rationale: Bewahrt die Betonung des großen zeitlichen Abstands zur Wüstengeneration.
- source_word: καθὼς προείρηται
  choice: wie schon zuvor gesagt worden ist
  rationale: Das Perfekt Passiv verweist auf eine frühere Aussage, die für die gegenwärtige Argumentation weiterhin gilt.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: wenn ihr seine Stimme hört
  rationale: Bewahrt die biblische Redeweise des Hörens, die auf eine entsprechende Reaktion zielt, ohne ausdrücklich »gehorchen« einzusetzen.
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: verhärtet eure Herzen nicht
  rationale: Gibt die Warnung vor innerer Verstockung prägnant und in geläufiger biblischer Sprache wieder.
theological_decisions:
- issue: Bedeutung von »Heute« im Gedankengang über Gottes Ruhe
  choice: »Heute« bezeichnet die von Gott bestimmte gegenwärtige Gelegenheit zur Antwort, ohne auf ein bloßes Kalenderdatum eingeengt zu werden.
  alternative: Nur der historische Tag der Psalmrede oder ausschließlich ein endzeitlicher Tag.
  rationale: Der Vers begründet, dass Gott lange nach der Wüstenzeit weiterhin einen Tag der Antwort bezeichnet. Die Übersetzung erhält diese Spannung, ohne sie systematisch aufzulösen.
- issue: Bedeutung von ἐν Δαυίδ
  choice: durch David
  alternative: »bei David« beziehungsweise im Davidpsalm
  rationale: »Durch David« ist im Deutschen verständlich und drückt die vermittelte Gottesrede aus. Da die griechische Wendung auch als Verweis auf den mit David verbundenen Psalm verstanden werden kann, bleibt diese Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt nahe am griechischen Argumentationsgang, während Zeilenumbrüche das Psalmzitat kenntlich machen. Der traditionelle Ausdruck »die Herzen verhärten« wird wegen seiner Genauigkeit und allgemeinen Verständlichkeit beibehalten.
