source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: de
  text: Da nun einigen der Eintritt in sie noch offensteht und diejenigen, denen die gute Nachricht zuvor verkündet wurde, wegen ihres Ungehorsams[a] nicht eintraten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen ihres Unglaubens“. Das griechische Wort kann eine Weigerung zu glauben bezeichnen, die sich im Ungehorsam zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Da nun
  rationale: Die Verbindung bewahrt sowohl den folgernden Charakter von οὖν als auch die begründende bzw. voraussetzende Funktion von ἐπεί und passt zum fortlaufenden Satzbau.
- source_word: ἀπολείπεται
  choice: bestehen bleibt
  rationale: Das Präsens Passiv bezeichnet einen weiterhin bestehenden Sachverhalt beziehungsweise eine fortdauernde Möglichkeit.
- source_word: τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: dass einige in sie hineingehen
  rationale: Der Akkusativ mit Infinitiv wird im Deutschen natürlich als dass-Satz wiedergegeben; „einige“ wahrt die unbestimmte Personenangabe.
- source_word: αὐτήν
  choice: sie
  rationale: Das Pronomen verweist zurück auf die zuvor genannte Ruhe und bewahrt Genus und anaphorischen Bezug des griechischen Textes, ohne den Bezug ausdrücklich zu wiederholen.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: die, denen die gute Nachricht früher verkündet wurde
  rationale: Die Formulierung erhält die passive Bedeutung des Partizips und vermeidet das kirchensprachlich oder missverständlich wirkende „evangelisiert“.
- source_word: οὐκ εἰσῆλθον
  choice: nicht hineingingen
  rationale: Die schlichte Verneinung des Aorists wird transparent wiedergegeben; „hineingingen“ greift die gleiche Bewegung wie im ersten Satzteil auf.
- source_word: δι’ ἀπείθειαν
  choice: wegen ihres Ungehorsams
  rationale: ἀπείθεια bezeichnet hier die Weigerung, Gottes Wort zu glauben und ihm zu folgen. „Ungehorsam“ wahrt den vorrangigen lexikalischen Sinn; das Possessivpronomen ist im Deutschen idiomatisch und macht den Bezug auf die betreffenden Menschen klar.
theological_decisions:
- issue: Bedeutung von ἀπείθεια im Zusammenhang von Glaube und Eintritt in Gottes Ruhe
  choice: wegen ihres Ungehorsams
  alternative: wegen ihres Unglaubens
  rationale: Der Ausdruck kann die Verweigerung des Glaubens einschließen, bezeichnet aber nicht lediglich eine gedankliche Überzeugung, sondern eine Weigerung zu hören und zu gehorchen. Der Haupttext bewahrt daher „Ungehorsam“, während die Fußnote die echte Bedeutungsnähe zu „Unglauben“ nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verssyntax bleibt bewusst offen und endet mit einem Komma, da der Gedankengang im folgenden Vers fortgesetzt wird. „Gute Nachricht“ ist allgemein verständlich und bewahrt den Verkündigungscharakter des Verbs.
