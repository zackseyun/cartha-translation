source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: de
  text: Darum lasst uns fürchten[a], dass nicht etwa, während die Verheißung, in seine Ruhe einzugehen, noch besteht[b], jemand von euch den Eindruck macht, zurückgeblieben zu sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst uns Angst haben.“ Das griechische Verb ist stärker als ein bloßes „Lasst uns achtgeben“ und bewahrt den Ernst der Warnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „während eine Verheißung, in seine Ruhe einzugehen, noch besteht“. Die griechische Konstruktion ist knapp und kann auch so wiedergegeben werden.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „als habe er sie nicht erreicht“; auch: „als sei er zurückgeblieben“. Der Ausdruck kann das Erscheinen beziehungsweise die Beurteilung und das Verfehlen des verheißenen Ziels hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: lasst uns fürchten
  rationale: Der hortativ gebrauchte Aoristkonjunktiv enthält eine nachdrückliche gemeinsame Aufforderung. „Fürchten“ bewahrt den Ernst der Warnung und schwächt sie nicht zu bloßer Vorsicht ab.
- source_word: οὖν
  choice: Darum
  rationale: Das Folgewort knüpft die Mahnung als Schlussfolgerung an Israels zuvor geschildertes Versagen an.
- source_word: μήποτε
  choice: dass nicht etwa
  rationale: Die Formulierung gibt die warnende negative Möglichkeit im heutigen Deutsch natürlich wieder.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: solange die Zusage ... noch gilt
  rationale: 'Der Genitivus absolutus beschreibt den fortbestehenden Umstand: Die göttliche Zusage ist weiterhin gültig und nicht ausgeschöpft.'
- source_word: ἐπαγγελίας
  choice: Zusage
  rationale: „Zusage“ bezeichnet hier Gottes weiterhin geltendes Versprechen in natürlichem, würdigem Deutsch.
- source_word: εἰσελθεῖν
  choice: einzugehen
  rationale: Der Infinitiv wird eng an die Zusage gebunden und behält das biblisch geprägte Bild des Eingehens in Gottes Ruhe bei.
- source_word: κατάπαυσιν
  choice: Ruhe
  rationale: „Ruhe“ ist im Zusammenhang von Hebräer 3–4 der passende Leitbegriff und legt die genaue Art dieser Ruhe nicht vorzeitig fest.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Pronomen wird entsprechend dem griechischen Wortlaut bewahrt; aus dem Zusammenhang ist Gott der Bezugspunkt.
- source_word: δοκῇ
  choice: den Anschein erweckt
  rationale: Die Wiedergabe erhält die Bedeutungsnuance des Erscheinens beziehungsweise Dafürgehaltenwerdens, ohne sie stillschweigend als endgültiges Urteil aufzulösen.
- source_word: τις ἐξ ὑμῶν
  choice: jemand von euch
  rationale: Die Formulierung bewahrt den individualisierenden Warncharakter der indefiniten Einzahl mit partitivem Ausdruck.
- source_word: ὑστερηκέναι
  choice: das Ziel verfehlt zu haben
  rationale: Der Perfektinfinitiv bezeichnet hier das Zurückbleiben beziehungsweise Nichterreichen des verheißenen Eingangs. „Das Ziel verfehlt“ macht diesen Bezug im Deutschen verständlich.
theological_decisions:
- issue: Stärke der Aufforderung angesichts der Warnung
  choice: Die direkte Aufforderung „lasst uns fürchten“ bleibt erhalten.
  alternative: „Lasst uns vorsichtig sein“ oder „lasst uns achtgeben“.
  rationale: φοβηθῶμεν bezeichnet ausdrücklich Furcht. Die Übersetzung soll die reale Schärfe der Warnung weder abschwächen noch durch eine Lehraussage über Beharren oder Abfall auflösen.
- issue: Bestimmung der Ruhe
  choice: „seine Ruhe“ mit dem Pronomen des Ausgangstextes.
  alternative: „Gottes endzeitliche Ruhe“ oder „seine Sabbatruhe“.
  rationale: Der Zusammenhang weist auf Gott, doch der Vers selbst entfaltet die genaue theologische Gestalt der Ruhe nicht vollständig. Die knappe Wiedergabe wahrt diese Entwicklung im Kapitel.
- issue: Bedeutung von δοκῇ im Warnsatz
  choice: „den Anschein erweckt“ als offene Wiedergabe des Erscheinens oder Dafürgehaltenwerdens.
  alternative: „sich als jemand erweist“ beziehungsweise eine unmittelbare Feststellung tatsächlichen Scheiterns.
  rationale: Die griechische Formulierung lässt eine Spannung zwischen Erscheinen, Beurteilung und tatsächlichem Zurückbleiben bestehen. Die Übersetzung entscheidet diese Spannung nicht dogmatisch.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Satzstruktur folgt dem Gedankengang des Griechischen, wird aber durch geläufige deutsche Wendungen lesbar gehalten. Die Leitbegriffe „Zusage“ und „Ruhe“ bleiben knapp; die Warnung wird weder abgeschwächt noch konfessionell ausgedeutet.
