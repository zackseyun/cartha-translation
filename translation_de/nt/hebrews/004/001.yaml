- from: Darum lasst uns fürchten[a], dass nicht etwa, solange die Zusage, in seine Ruhe einzugehen, noch gilt[b], jemand von euch den Anschein erweckt, das Ziel verfehlt zu haben[c].
  to: Darum lasst uns fürchten[a], dass nicht etwa, während die Verheißung, in seine Ruhe einzugehen, noch besteht[b], jemand von euch den Eindruck macht, zurückgeblieben zu sein[c].
  rationale: Die Revision ersetzt die potenziell kausative Formulierung „den Anschein erweckt“ durch „den Eindruck macht“, sodass die semantische Offenheit von δοκῇ erhalten bleibt. Außerdem wird ἐπαγγελία mit dem im Hebräerbrief sachlich und terminologisch passenden Leitwort „Verheißung“ wiedergegeben. Die Fußnoten wurden entsprechend angepasst; die Anker bleiben korrekt gesetzt.
