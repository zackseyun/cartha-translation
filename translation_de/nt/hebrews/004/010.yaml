    rationale: Die griechische Formulierung bezeichnet das Ruhen beziehungsweise Aufhören von den eigenen Werken. „Zur Ruhe kommen“ kann vor allem das Ankommen in einem Ruhezustand bezeichnen und steht dadurch dem vorangehenden „eingegangen ist“ zu nahe.
  - severity: medium
    issue: Die Formulierung „Gott von seinen eigenen“ lässt das Bezugsnomen im Deutschen zu stark offen.
    rationale: Während die griechische Ellipse τῶν ἰδίων klar auf die zuvor genannten Werke zurückweist, wirkt die deutsche Ellipse ohne „Werken“ unvollständig. Eine Ergänzung ist für idiomatisches Deutsch erforderlich und ändert den Sinn nicht.
  - severity: low
    issue: Die Fußnotenformulierung „mit seinen Werken aufgehört“ ist keine natürliche und präzise Alternative.
    rationale: ἀπό bezeichnet das Ablassen beziehungsweise Ruhen von den Werken, nicht ein Aufhören „mit“ ihnen. Die Alternative sollte zudem die lexikalische Beziehung zu „Ruhe“ erklären.
