  source_fidelity: 'Die Grundstruktur und die maßgeblichen Begriffe sind zutreffend wiedergegeben: γάρ als „Denn“, κατάπαυσις als „Ruhe“, die generische Einzahl, die betonte Hinzufügung „auch selbst“ sowie der Vergleich mit Gottes Ruhen. „Zur Ruhe gekommen“ ist jedoch gegenüber κατέπαυσεν ἀπό („ruhte/ließ ab von“) etwas zu stark als Eintritt in einen Ruhezustand lesbar und verdeckt die Wiederaufnahme des Ruhewortfeldes weniger klar.'
  naturalness: Der Satz ist insgesamt verständlich und hat ein angemessen würdevolles modernes Register. Die abschließende Ellipse „von seinen eigenen“ klingt im heutigen Deutsch jedoch unvollständig; „Werken“ sollte ergänzt werden. „Von seinen Werken geruht“ ist in diesem biblisch-theologischen Kontext verständlich und bewahrt die beabsichtigte Wortverbindung besser.
  terminology: „Ruhe“ und „Werke“ sind für den Argumentationsgang von Hebräer 3–4 sachgerecht. Das Pronomen „seine“ wahrt die grammatische Offenheit des griechischen αὐτοῦ; der Kontext legt Gottes Ruhe nahe, ohne dass der Haupttext dies festschreiben muss. Die Fußnotenalternative „mit seinen Werken aufgehört“ ist im Deutschen semantisch und idiomatisch nicht passend für ἀπὸ τῶν ἔργων αὐτοῦ.
  issues:
