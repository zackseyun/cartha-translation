  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: de
  text: Denn wer in seine Ruhe eingegangen ist, hat auch selbst von seinen Werken geruht[a], so wie Gott von seinen eigenen Werken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat von seinen Werken abgelassen“. Das griechische Verb gehört zur selben Wortfamilie wie „Ruhe“; die Übersetzung „geruht“ bewahrt diese Verbindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: wer ... eingegangen ist
  rationale: Der substantivierte Aoristpartizip bezeichnet allgemein den Menschen, der eingegangen ist. Die deutsche Konstruktion mit „wer“ gibt den generischen Sinn natürlich wieder und wahrt den vollzogenen Aspekt.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage; „Denn“ stellt diesen erklärenden Zusammenhang knapp und idiomatisch her.
- source_word: κατάπαυσιν
  choice: Ruhe
  rationale: κατάπαυσις ist in Hebräer 3–4 ein Leitwort für Gottes Ruhe und greift den Schöpfungsbericht auf. „Ruhe“ bewahrt diesen thematischen Zusammenhang.
- source_word: αὐτοῦ (nach κατάπαυσιν)
  choice: seine
  rationale: Das Pronomen bleibt entsprechend dem Griechischen erhalten. Im Kontext bezieht es sich am wahrscheinlichsten auf Gott, ohne dass die Übersetzung dies im Haupttext ausdrücklich festlegt.
- source_word: καὶ αὐτὸς
  choice: auch selbst
  rationale: „Auch“ gibt καί wieder, „selbst“ die Hervorhebung durch αὐτός.
- source_word: κατέπαυσεν
  choice: ist ... zur Ruhe gekommen
  rationale: Die Formulierung erhält die Wortverbindung mit κατάπαυσις und klingt mit ἀπό im Deutschen natürlicher als „hat geruht von“. Zugleich bleibt „hat aufgehört“ als mögliche Bedeutungsnuance in der Fußnote sichtbar.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: von seinen Werken
  rationale: „Werke“ ist die direkte, sachlich offene Wiedergabe von ἔργα; sie legt nicht fest, ob bestimmte verdienstliche Leistungen gemeint sind.
- source_word: ὥσπερ
  choice: so wie
  rationale: Die Wendung kennzeichnet den deutlichen Vergleich mit Gottes Ruhen in natürlichem modernem Deutsch.
- source_word: ἀπὸ τῶν ἰδίων
  choice: von seinen eigenen
  rationale: Das Griechische lässt „Werken“ elliptisch aus. Die deutsche Formulierung bewahrt diese Ellipse, bleibt aber durch den vorausgehenden Ausdruck verständlich.
- source_word: ὁ θεός
  choice: Gott
  rationale: Standardwiedergabe von θεός; die im Griechischen nachgestellte ausdrückliche Vergleichsgröße wird im Deutschen natürlich vorangestellt.
theological_decisions:
- issue: Bezug von αὐτοῦ in „seine Ruhe“
  choice: Das Pronomen bleibt im Haupttext als „seine“ stehen; im Zusammenhang ist Gottes Ruhe der wahrscheinlichste Bezug.
  alternative: Das Pronomen könnte sich auf die eigene Ruhe dessen beziehen, der eingeht; expliziter wäre außerdem „Gottes Ruhe“.
  rationale: Hebräer 3–4 spricht wiederholt von Gottes Ruhe und verbindet sie mit Gottes eigener Ruhe nach seinen Werken. Die pronominale Wiedergabe wahrt dennoch die grammatische Offenheit des griechischen Ausdrucks.
- issue: Identität von „wer ... eingegangen ist“
  choice: Die Aussage wird als generische Einzahl wiedergegeben, ohne die Person ausdrücklich als Christus oder als Gläubigen zu identifizieren.
  alternative: Der Singular kann christologisch auf Christus bezogen oder kollektiv beziehungsweise allgemein auf den Glaubenden verstanden werden.
  rationale: Der griechische Text nennt die Person nicht ausdrücklich. Eine identifizierende Übersetzung würde eine exegetische Entscheidung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Leitwort „Ruhe“ bleibt erhalten; der Satzbau ist natürlich, ohne die pronominale und theologische Offenheit unnötig aufzulösen.
