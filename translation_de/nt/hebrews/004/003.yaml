source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: de
  text: 'Denn wir, die zum Glauben gekommen sind, gehen in die Ruhe ein, wie er gesagt hat: »So schwor ich in meinem Zorn: ›Sie werden keinesfalls in meine Ruhe eingehen!‹«[a] Obwohl seine Werke seit der Grundlegung der Welt vollendet waren.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die griechische Schwurformel: »Wenn sie in meine Ruhe eingehen …« Gemeint ist als nachdrückliche Verneinung: »Sie werden keinesfalls in meine Ruhe eingehen.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder, mit stärker hervorgehobener Vorzeitigkeit: »obwohl seine Werke seit der Grundlegung der Welt vollendet gewesen waren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: gehen … ein
  rationale: Das Präsens bewahrt die gegenwärtige Aussage über die Glaubenden, ohne die zukünftige Vollendung auszuschließen.
- source_word: οἱ πιστεύσαντες
  choice: wir, die zum Glauben gekommen sind
  rationale: Gibt das substantivierte Aoristpartizip und die Selbsteinbeziehung durch die erste Person Plural natürlich wieder.
- source_word: κατάπαυσιν
  choice: die Ruhe
  rationale: Bezeichnet die im Zusammenhang bereits behandelte Ruhe Gottes; „Ruhe“ ist verständlich und wahrt die theologische Bildsprache.
- source_word: καθὼς εἴρηκεν
  choice: wie er gesagt hat
  rationale: Das Perfekt bezeichnet ein gesprochenes Wort mit fortdauernder Geltung.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: So schwor ich in meinem Zorn
  rationale: „Zorn“ erhält die ernste, gerichtliche Färbung von ὀργή; „so“ leitet im Deutschen die Schwurformel natürlich ein.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Sie sollen keinesfalls in meine Ruhe eingehen
  rationale: Das griechische εἰ mit Futur gibt hier nach semitischem Sprachgebrauch die abgebrochene Schwurformel als entschiedene Verneinung wieder.
- source_word: καίτοι
  choice: dabei
  rationale: Markiert den einräumenden Kontrast zum vorausgehenden Zitat, ohne einen syntaktisch schwerfälligen Nebensatz zu erzeugen.
- source_word: τῶν ἔργων … γενηθέντων
  choice: seine Werke … vollendet waren
  rationale: Der Genitivus absolutus besagt, dass Gottes Werke bereits zustande gebracht beziehungsweise abgeschlossen waren; das kontextuell ergänzte „seine“ macht den Bezug eindeutig.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: seit der Grundlegung der Welt
  rationale: Bewahrt die traditionelle Schöpfungsformel und gibt den zeitlichen Ausgangspunkt idiomatisch wieder.
theological_decisions:
- issue: Aussagekraft der Schwurformel aus Psalm 95
  choice: 'Die idiomatische Bedeutung wird als nachdrückliche Verneinung übersetzt: „Sie sollen keinesfalls … eingehen.“'
  alternative: Die griechische Oberfläche wörtlich als „Wenn sie in meine Ruhe eingehen …“ wiedergeben.
  rationale: Die mit εἰ eingeleitete, abgebrochene Schwurformel ist semitisch geprägt und bedeutet im Kontext sichere Verweigerung. Eine Fußnote bewahrt zugleich ihre formale Gestalt und echte sprachliche Spannung.
- issue: Zeitlicher Aspekt des Eingehens der Glaubenden
  choice: 'Präsens: „gehen … ein“'
  alternative: 'Ausschließlich zukünftig: „werden … eingehen“; oder progressiv: „sind dabei einzugehen“'
  rationale: Das griechische Präsens spricht vom gegenwärtigen Eingehen der Glaubenden und lässt die künftige Vollendung offen; so bleibt die Spannung des Zusammenhangs erhalten.
- issue: Verhältnis der Ruhe zu den Schöpfungswerken
  choice: 'Einräumender Anschluss: „Dabei waren seine Werke … vollendet.“'
  alternative: „Obwohl seine Werke … vollendet waren.“
  rationale: καίτοι stellt die bereits seit der Schöpfung vorhandene Ruhe den späteren Aussagen über das Eingehen gegenüber. „Dabei“ bewahrt den gedanklichen Kontrast, ohne einen im Deutschen missverständlichen direkten Gegensatz zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch „Dabei“ lesbar gegliedert. Die traditionelle Wendung „Grundlegung der Welt“ wurde wegen ihrer Präzision und Verständlichkeit beibehalten.
