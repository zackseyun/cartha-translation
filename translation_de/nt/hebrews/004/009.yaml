  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: de
  text: Somit bleibt dem Volk Gottes eine Sabbatruhe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sabbatfeier. Das seltene griechische Wort σαββατισμός greift ausdrücklich die Sprache des Sabbats auf; hier bezeichnet es wahrscheinlich eine sabbatähnliche Ruhe, die dem Volk Gottes bleibt.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἄρα
  choice: Somit
  rationale: Die Schlussfolgerung aus dem vorausgehenden Gedankengang wird im heutigen Deutsch klar und knapp ausgedrückt.
- source_word: ἀπολείπεται
  choice: bleibt
  rationale: Das Präsens bezeichnet etwas, das weiterhin besteht beziehungsweise noch verfügbar ist; „bleibt“ gibt dies prägnant wieder.
- source_word: σαββατισμός
  choice: Sabbatruhe
  rationale: Der seltene Begriff nimmt ausdrücklich die Sprache des Sabbats auf und bezeichnet im Zusammenhang eine sabbatähnliche Ruhe. „Sabbatruhe“ bewahrt sowohl diesen Anklang als auch die Verbindung zur verheißenen Ruhe in Hebräer 3–4.
- source_word: τῷ λαῷ
  choice: dem Volk
  rationale: Der deutsche Dativ gibt die griechische Form natürlich wieder und bezeichnet diejenigen, für die diese Sabbatruhe bestehen bleibt.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird knapp und idiomatisch wiedergegeben und bewahrt die Aussage über die Zugehörigkeit beziehungsweise Beziehung des Volkes zu Gott.
theological_decisions:
- issue: Bedeutung von σαββατισμός in Hebräer 4,9
  choice: Eine weiterhin bestehende, sabbatähnliche Ruhe für Gottes Volk, wiedergegeben mit „Sabbatruhe“.
  alternative: Eine wörtliche Sabbatfeier beziehungsweise ausschließlich eine bildliche geistliche Ruhe ohne Sabbatbezug.
  rationale: Das Wort selbst weckt ausdrücklich die Vorstellung des Sabbats; zugleich verbindet der Zusammenhang Gottes Ruhe, den siebten Tag und die verheißene Ruhe des Gottesvolkes. „Sabbatruhe“ bewahrt diese Spannung, ohne sie auf eine wöchentliche Vorschrift oder auf eine vom Sabbat gelöste Metapher zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Somit“ macht den Folgerungscharakter deutlich; „Sabbatruhe“ ist verständlich und bewahrt den für den Gedankengang wichtigen Sabbatanklang.
