  variant: modern standard German
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: de
  text: Lasst uns daher mit Zuversicht[a] zum Thron der Gnade treten, damit wir Barmherzigkeit empfangen und Gnade finden zur rechtzeitigen Hilfe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Freimütigkeit“. Das griechische Wort kann sowohl vertrauensvolle Zuversicht als auch freimütige, kühne Offenheit beim Reden oder Hinzutreten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hilfe zur rechten Zeit“. Traditionell auch: „Hilfe in der Zeit der Not“; wörtlicher liegt der Akzent darauf, dass die Hilfe zur passenden Zeit kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Lasst uns … treten
  rationale: Der präsentische Konjunktiv ist eine Aufforderung. „Zum … treten“ ist im modernen Deutschen natürlich und bewahrt die Vorstellung des Hinzutretens.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Aussage über Jesus als Hohepriester.
- source_word: μετὰ παρρησίας
  choice: mit Zuversicht
  rationale: παρρησία umfasst freimütige Offenheit, Zuversicht und kühnen Zugang. „Mit Zuversicht“ klingt im Deutschen natürlich und bezeichnet vertrauensvollen, ungehinderten Zugang, ohne Vermessenheit nahezulegen.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: zum Thron der Gnade
  rationale: Bewahrt die Genitivkonstruktion und das Thronbild, ohne die Beziehung zwischen Thron und Gnade enger auszulegen.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die finale Bedeutung knapp und idiomatisch wieder.
- source_word: λάβωμεν ἔλεος
  choice: wir Barmherzigkeit empfangen
  rationale: „Empfangen“ ist die direkte und natürliche Wiedergabe von λαμβάνω; „Barmherzigkeit“ entspricht ἔλεος.
- source_word: χάριν εὕρωμεν
  choice: Gnade finden
  rationale: Bewahrt sowohl den Unterschied zu „Barmherzigkeit empfangen“ als auch die Verbindung zum „Thron der Gnade“.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: als rechtzeitige Hilfe
  rationale: εὔκαιρος bezeichnet etwas zur passenden Zeit Kommendes. „Als rechtzeitige Hilfe“ bleibt nahe am griechischen Ausdruck und vermeidet die interpretierende Verschiebung zu „in der Zeit der Not“.
theological_decisions:
- issue: Bedeutungsumfang von παρρησία beim Hinzutreten zu Gott
  choice: mit Zuversicht
  alternative: mit Freimütigkeit; mit Kühnheit
  rationale: „Zuversicht“ vermittelt vertrauensvollen, freien Zugang zu Gott. Die Fußnote hält die stärkere Nuance freimütiger Offenheit fest, ohne den Ausdruck als Vermessenheit zu deuten.
- issue: Wiedergabe von χάρις
  choice: Gnade
  alternative: Gunst
  rationale: „Gnade“ ist kontextuell passend, bewahrt die theologische Dichte des Begriffs und stellt die ausdrückliche Wiederaufnahme von τῆς χάριτος durch χάριν dar.
- issue: Bezug von εἰς εὔκαιρον βοήθειαν
  choice: als rechtzeitige Hilfe
  alternative: zur rechtzeitigen Hilfe; Hilfe zur rechten Zeit; Hilfe in der Zeit der Not
  rationale: Die Formulierung lässt die syntaktische Beziehung hinreichend offen und betont wie das Griechische die Rechtzeitigkeit der Hilfe, statt ausdrücklich eine Notzeit in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die auffordernde Form, das Bild vom Thron und die unterschiedliche Wortwahl „Barmherzigkeit empfangen“ / „Gnade finden“. Die Fußnoten dokumentieren echte Bedeutungs- und Zuordnungsnuancen.
