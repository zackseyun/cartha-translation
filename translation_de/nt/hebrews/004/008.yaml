revisions:
- from: Denn wenn Josua ihnen Ruhe verschafft hätte[a], würde er später nicht von einem anderen Tag sprechen.
  to: Denn wenn Josua ihnen Ruhe verschafft hätte[a], hätte Gott später nicht von einem anderen Tag gesprochen.
  rationale: Das explizite „Gott“ stellt den im Kontext gemeinten Sprecher klar und verhindert, dass Josua fälschlich als derjenige verstanden wird, der später spricht. Die einheitliche Vergangenheitsform des Irrealis gibt die griechische kontrafaktische Aussage natürlich wieder. Die Fußnote bleibt unverändert, da sie die Namensmehrdeutigkeit angemessen dokumentiert.
