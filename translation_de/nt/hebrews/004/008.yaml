id: HEB.4.8
reference: Hebrews 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: de
  text: Denn wenn Josua ihnen Ruhe verschafft hätte[a], hätte Gott später nicht von einem anderen Tag gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Jesus«. Die Namensform Ἰησοῦς kann sowohl Jesus als auch Josua bezeichnen; hier weist der Zusammenhang auf Josua, den Sohn Nuns.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Josua
  rationale: Die griechische Namensform kann sowohl Jesus als auch Josua bezeichnen. Der Zusammenhang mit Israels Einzug ins Land und dem späteren Wort aus Psalm 95 weist hier auf Josua, den Sohn Nuns.
- source_word: κατέπαυσεν
  choice: ihnen Ruhe verschafft hätte
  rationale: 'Die Formulierung gibt den kausativen Sinn von καταπαύω natürlich wieder: jemanden zur Ruhe bringen beziehungsweise ihm Ruhe verschaffen.'
- source_word: οὐκ ἂν ... ἐλάλει
  choice: würde er ... nicht ... sprechen
  rationale: Die Konstruktion bezeichnet die irreale Folge einer nicht eingetretenen Bedingung; im Deutschen ist die würde-Form hier klar und idiomatisch.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: von einem anderen Tag
  rationale: Die Wendung bewahrt die Aussage, dass noch ein weiterer, später genannter Tag im Blick ist, ohne dessen Bedeutung vorschnell auszudeuten.
- source_word: μετὰ ταῦτα
  choice: später
  rationale: Das Adverb gibt die zeitliche Abfolge knapp und natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Denn kennzeichnet den Vers als Begründung für die vorausgehende Aussage.
theological_decisions:
- issue: Bezug der Namensform Ἰησοῦς
  choice: Josua, der Sohn Nuns
  alternative: Jesus
  rationale: Der Gedankengang handelt von der Ruhe nach Israels Einzug unter Josua und von einem späteren Wort über einen anderen Tag. Die im Griechischen bestehende Gleichheit der Namensform wird in einer Fußnote offengelegt.
- issue: Unausgesprochenes Subjekt von ἐλάλει
  choice: er
  alternative: Gott
  rationale: Der griechische Text nennt hier kein ausdrückliches Subjekt. Das Pronomen wahrt diese Form, auch wenn der weitere Zusammenhang Gott als Sprecher nahelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Formulierung bleibt nahe an der griechischen Satzstruktur, ohne im Deutschen steif zu wirken; die Mehrdeutigkeit der Namensform wird transparent in der Fußnote bewahrt.
