    text: 'Griechisch: »Jesus«. Die Namensform Ἰησοῦς kann sowohl Jesus als auch Josua bezeichnen; hier weist der Zusammenhang auf Josua, den Sohn Nuns.'
    reason: alternative_reading
  revision_rationale: Das explizite „Gott“ stellt den im Kontext gemeinten Sprecher klar und verhindert, dass Josua fälschlich als derjenige verstanden wird, der später spricht. Die einheitliche Vergangenheitsform des Irrealis gibt die griechische kontrafaktische Aussage natürlich wieder. Die Fußnote bleibt unverändert, da sie die Namensmehrdeutigkeit angemessen dokumentiert.
