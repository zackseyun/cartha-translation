id: HEB.4.4
reference: Hebrews 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: de
  text: 'Denn er hat irgendwo[a] über den siebten Tag so gesprochen: »Und Gott ruhte[b] am siebten Tag von allen seinen Werken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an einer bestimmten Stelle«. Das griechische Wort bedeutet wörtlich »irgendwo« und führt das Schriftzitat ohne genaue Stellenangabe ein; es drückt keinen Zweifel an dessen Geltung aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hörte auf«. Das Verb kann das Beenden einer Tätigkeit betonen. »Ruhte« bewahrt hier den Zusammenhang mit 1. Mose 2,2 und mit dem Thema der Ruhe Gottes in Hebräer 3–4.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: hat gesprochen
  rationale: Das Perfekt bezeichnet eine in der Vergangenheit ergangene Aussage, die weiterhin gilt; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: γάρ
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Aussage ein.
- source_word: που
  choice: irgendwo
  rationale: Das Wort führt die Schriftstelle ohne genaue Ortsangabe an. Es drückt hier keine Unsicherheit über ihre Geltung aus.
- source_word: περὶ τῆς ἑβδόμης
  choice: über den siebten Tag
  rationale: Das substantivierte feminine Zahladjektiv bezieht sich im Kontext auf den Tag; dieser wird im Deutschen zur Klarheit ausdrücklich genannt.
- source_word: οὕτως
  choice: so
  rationale: Das Adverb leitet knapp und idiomatisch den Wortlaut des Zitats ein.
- source_word: Καὶ
  choice: Und
  rationale: Die Konjunktion gehört zum angeführten Wortlaut aus Genesis und wird deshalb beibehalten.
- source_word: κατέπαυσεν
  choice: ruhte
  rationale: Die Wiedergabe bewahrt den sprachlichen Zusammenhang mit Genesis 2,2 und dem Leitbegriff der Ruhe in Hebräer 3–4; zugleich bezeichnet das Verb das Aufhören mit dem Werk.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte Wiedergabe des Subjekts; ein Artikel ist vor dem Gottesnamen im Deutschen nicht erforderlich.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: am siebten Tag
  rationale: Dies ist die natürliche deutsche Zeitangabe und entspricht der näher bestimmten griechischen Formulierung.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: von allen seinen Werken
  rationale: Der Plural ἔργων und die durch ἀπό bezeichnete Abkehr beziehungsweise Beendigung werden formal und idiomatisch wiedergegeben.
theological_decisions:
- issue: Gottes Aufhören am siebten Tag im Zusammenhang mit der Ruhe-Theologie des Hebräerbriefs
  choice: ruhte
  alternative: hörte auf
  rationale: »Ruhte« erhält die bewusste Verbindung zum Schöpfungsbericht und zum wiederkehrenden Begriff der Ruhe in Hebräer 3–4. Die Übersetzung behauptet dabei nicht, Gott sei ermüdet gewesen; die mögliche Bedeutung des Aufhörens wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Satzstruktur, ist aber idiomatisch; Schlüsselbegriffe und die nicht näher bestimmte Zitateinleitung werden bewusst bewahrt.
