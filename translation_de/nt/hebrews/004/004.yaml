  source_fidelity: 'Die Übersetzung bildet den griechischen Gedankengang und die Zitatstruktur zuverlässig ab: εἴρηκεν als präsentisch relevantes Perfekt („hat ... gesprochen“), γάρ als Begründung („Denn“), πού als absichtlich unspezifische Zitateinleitung („irgendwo“), die Bezugnahme auf den siebten Tag und die vollständige Angabe „von allen seinen Werken“. „Ruhte“ gibt κατέπαυσεν im Kontext des Genesis-Zitats und der Argumentation des Hebräerbriefs angemessen wieder.'
