  terminology: „Gott ruhte“, „siebter Tag“ und „Werke“ erhalten die relevante Verbindung zu Genesis 2,2 sowie zum Ruhe-Motiv in Hebräer 3–4. Die Fußnoten erläutern die möglichen Nuancen von πού und κατέπαυσεν sachlich, ohne eine konfessionelle Deutung aufzudrängen. Die Fußnotenanker stehen an den jeweils passenden Wörtern.
