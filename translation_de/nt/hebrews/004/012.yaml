id: HEB.4.12
reference: Hebrews 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: de
  text: Denn das Wort Gottes ist lebendig und wirksam, schärfer als jedes zweischneidige Schwert. Es dringt durch bis zur Scheidung von Seele und Geist – von Gelenken und Mark – und beurteilt die Gedanken und Absichten des Herzens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung muss nicht so verstanden werden, dass Seele und Geist voneinander trennbare Bestandteile des Menschen sind. Im Zusammenhang unterstreicht sie, wie tief das Wort Gottes in das Innerste vordringt.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: lebendig
  rationale: Gibt die fortdauernde Lebendigkeit des Wortes Gottes natürlich und unmittelbar wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende Verbindung zur vorausgehenden Ermahnung.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Lässt den Bezug bewusst offen und verengt ihn weder auf die Schrift noch auf eine bestimmte Verkündigungsform oder den persönlichen Logos.
- source_word: ἐνεργὴς
  choice: wirksam
  rationale: Bezeichnet etwas, das tätig ist und Wirkung entfaltet; im Deutschen ist „lebendig und wirksam“ prägnant und würdig.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: schärfer als jedes zweischneidige Schwert
  rationale: Gibt Vergleich und Bild klar und idiomatisch wieder.
- source_word: διϊκνούμενος ἄχρι μερισμοῦ
  choice: Es dringt durch bis zur Scheidung
  rationale: Bewahrt sowohl die Bewegung des tiefen Durchdringens als auch die mit ἄχρι bezeichnete Reichweite bis zur Scheidung.
- source_word: ψυχῆς καὶ πνεύματος
  choice: von Seele und Geist
  rationale: Lexikalisch direkte Wiedergabe, ohne eine bestimmte Lehre über die Bestandteile des Menschen festzulegen.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: von Gelenken und Mark
  rationale: Erhält das parallele körperliche Bild tiefster Durchdringung; „Mark“ ist im Deutschen idiomatisch als Stoffbezeichnung im Singular.
- source_word: κριτικὸς
  choice: es beurteilt
  rationale: Das Adjektiv bezeichnet die Fähigkeit, zu unterscheiden und ein Urteil zu fällen; die verbale Formulierung ist im Deutschen natürlich.
- source_word: ἐνθυμήσεων καὶ ἐννοιῶν καρδίας
  choice: die Gedanken und Absichten des Herzens
  rationale: Unterscheidet innere Überlegungen von Zielsetzungen oder Vorhaben und bewahrt „Herz“ als Zentrum des inneren Menschen.
theological_decisions:
- issue: Bezug von „das Wort Gottes“
  choice: Allgemein als „das Wort Gottes“ wiedergegeben
  alternative: die Heilige Schrift; Gottes verkündete Botschaft; Gottes konkrete Zusage oder Gerichtswort; der persönliche Logos
  rationale: Der Zusammenhang betont Gottes wirksames Reden, legt den Ausdruck hier aber nicht eindeutig auf nur einen dieser Bezüge fest.
- issue: Menschenbild in „Seele und Geist“
  choice: Die Wortfolge wird beibehalten, ohne daraus eine feste Aufteilung des Menschen abzuleiten.
  alternative: Seele und Geist als technisch voneinander abgrenzbare Bestandteile des Menschen
  rationale: Die Aussage hebt im Bild die äußerste Reichweite des göttlichen Wortes hervor; sie verlangt für sich genommen keine bestimmte zwei- oder dreigliedrige Anthropologie.
- issue: Verhältnis der Genitivpaare zur „Scheidung“
  choice: Beide Paare werden parallel von „Scheidung“ abhängig wiedergegeben.
  alternative: Das zweite Paar lockerer als zusätzliche Angabe dessen verstehen, was das Wort durchdringt.
  rationale: Die griechische Reihung legt die syntaktische Parallelität von „Seele und Geist“ sowie „Gelenken und Mark“ nahe, auch wenn das Gesamtbild rhetorisch und nicht anatomisch-systematisch zu verstehen ist.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit vertrauter biblischer Bildsprache. Die Satzteilung erhöht die Verständlichkeit, ohne die argumentative Verbindung durch „Denn“ oder die parallelen Bilder des griechischen Textes aufzugeben.
