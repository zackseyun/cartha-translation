revisions:
- from: Denn das Wort Gottes ist lebendig und wirksam, schärfer als jedes zweischneidige Schwert. Es dringt durch bis zur Scheidung von Seele und Geist[a], von Gelenken und Mark, und es beurteilt die Gedanken und Absichten des Herzens[b].
  to: Denn das Wort Gottes ist lebendig und wirksam, schärfer als jedes zweischneidige Schwert. Es dringt durch bis zur Scheidung von Seele und Geist – von Gelenken und Mark – und beurteilt die Gedanken und Absichten des Herzens[a].
  rationale: Die Revision glättet die deutsche Konstruktion und bildet die rhetorische Reihung des griechischen Bildes durch Gedankenstriche ab. Damit bleibt offen, wie die beiden Genitivpaare im Einzelnen zueinander zu bestimmen sind. Die optionale paraphrasierende Fußnote zu „beurteilt“ wird entfernt; die verbleibende Anmerkung wird zurückhaltender formuliert.
