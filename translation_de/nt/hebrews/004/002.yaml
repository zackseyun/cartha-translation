reference: Hebrews 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: de
  text: Denn auch uns ist eine gute Botschaft verkündet worden, ebenso wie ihnen. Doch die Botschaft, die sie hörten, nützte ihnen nichts, weil sie nicht durch Glauben mit denen verbunden waren, die hörten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer anderen Textform und traditioneller Wiedergabe: »weil sie bei den Hörenden nicht mit Glauben verbunden war.«'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: ist eine gute Botschaft verkündet worden
  rationale: Die Umschreibung mit ἐσμεν und dem Perfektpartizip bezeichnet eine erfolgte Verkündigung mit fortdauernder Bedeutung. Die Formulierung bewahrt den verbalen Sinn und passt zum Vergleich mit der Wüstengeneration.
- source_word: καθάπερ κἀκεῖνοι
  choice: ebenso wie ihnen
  rationale: Natürlicher deutscher Vergleich, der die Gleichheit darin ausdrückt, dass beiden Gruppen eine göttliche Botschaft verkündet wurde.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: die Botschaft, die sie hörten
  rationale: Die Genitivverbindung bezeichnet hier sinnvoll den gehörten Inhalt; eine wörtliche Wiedergabe als »Wort des Hörens« wäre im Deutschen unklar.
- source_word: ὠφέλησεν
  choice: nützte ihnen nichts
  rationale: Gibt knapp und idiomatisch wieder, dass die gehörte Botschaft für sie keinen heilsamen Nutzen brachte.
- source_word: συγκεκερασμένους
  choice: verbunden waren
  rationale: Das Partizip bezeichnet ein Vermischen oder Zusammenfügen. Nach dem SBLGNT-Text steht es im Akkusativ Plural und bezieht sich am natürlichsten auf ἐκείνους, also auf die Menschen.
- source_word: πίστει
  choice: durch Glauben
  rationale: Der Dativ bezeichnet wahrscheinlich das Mittel oder den Bereich der Verbindung. »Glaube« bewahrt den üblichen theologischen Begriff; »Vertrauen« bleibt als Bedeutungsnähe mitgedacht.
- source_word: τοῖς ἀκούσασιν
  choice: mit denen, die wirklich hörten
  rationale: Das substantivierte Partizip meint im Kontrast offenbar Menschen, bei denen das Hören zu einer glaubenden Aufnahme führte. »wirklich« verdeutlicht diesen kontextuellen Gegensatz, ohne ein anderes Verb einzuführen.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Vertrauen
  rationale: Der Zusammenhang stellt das bloße Hören einer glaubenden Aufnahme gegenüber. »Glaube« ist dafür die etablierte, sachlich offene Wiedergabe und legt keine bestimmte konfessionelle Lehre fest.
- issue: Bezug des abschließenden Partizips
  choice: Die Menschen waren nicht durch Glauben mit denen verbunden, die wirklich hörten.
  alternative: Die Botschaft war bei den Hörenden nicht mit Glauben verbunden.
  rationale: Die im SBLGNT gebotene Akkusativ-Plural-Form συγκεκερασμένους stimmt grammatisch mit ἐκείνους überein. Die bekannte Variante im Nominativ Singular ermöglicht dagegen die traditionelle Deutung auf »Botschaft/Wort«; sie wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext folgt der überlieferten SBLGNT-Lesart auch dort, wo sie syntaktisch schwierig ist. »wirklich hörten« macht den Gegensatz zwischen bloßem akustischem Hören und glaubender Aufnahme verständlich; die textkritische Alternative bleibt transparent in der Fußnote.
