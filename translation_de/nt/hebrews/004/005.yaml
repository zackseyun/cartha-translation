  text: καὶ ἐν τούτῳ πάλιν· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: de
  text: 'Und an dieser Stelle wiederum: »Sie werden ganz gewiss nicht in meine Ruhe eingehen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: »Wenn sie in meine Ruhe eingehen werden«; dies ist eine Schwurformel mit der Bedeutung: »Sie werden ganz gewiss nicht in meine Ruhe eingehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: an dieser Stelle
  rationale: Die Wendung verweist auf eine weitere Schriftstelle; »an dieser Stelle« ist im Deutschen natürlich und bewahrt den Zitierstil des Hebräerbriefs.
- source_word: πάλιν
  choice: wiederum
  rationale: Das Wort kennzeichnet den erneuten Rückgriff auf die Schrift und passt zum würdigen, argumentativen Stil des Zusammenhangs.
- source_word: Εἰ εἰσελεύσονται
  choice: Sie werden ganz gewiss nicht eingehen
  rationale: Die formal bedingte Konstruktion gibt eine semitisch geprägte Schwurformel wieder und hat hier die Kraft einer nachdrücklichen Verneinung.
- source_word: κατάπαυσίν
  choice: Ruhe
  rationale: »Ruhe« bewahrt den Schlüsselbegriff κατάπαυσις in Hebräer 3–4 und ist im Deutschen zugleich klar und idiomatisch.
- source_word: μου
  choice: meine
  rationale: Das Possessivpronomen bleibt unmittelbar erhalten und kennzeichnet die zitierte Ruhe als Gottes eigene Ruhe.
theological_decisions:
- issue: Wiedergabe der schwurartigen Bedingung Εἰ εἰσελεύσονται
  choice: Sie werden ganz gewiss nicht in meine Ruhe eingehen
  alternative: Wenn sie in meine Ruhe eingehen werden
  rationale: Obwohl die griechische Form wörtlich wie ein Bedingungssatz aussieht, fungiert sie in der aus Psalm 95 übernommenen Schwurformel als emphatische Verneinung. Die idiomatische Wiedergabe vermittelt diese Aussagekraft, während die Fußnote die formale Spannung sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Wiederum« entspricht dem schriftbezogenen Argumentationsstil; »eingehen« hält die räumliche Bildsprache und den Leitbegriff »Ruhe« zusammen.
