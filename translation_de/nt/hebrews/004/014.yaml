id: HEB.4.14
reference: Hebrews 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: de
  text: Da wir nun einen großen Hohepriester haben, der durch die Himmel hindurchgegangen ist – Jesus, den Sohn Gottes –, lasst uns an unserem Bekenntnis festhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an dem Bekenntnis“. Das Griechische verwendet den bestimmten Artikel, aber kein ausdrückliches Possessivpronomen; „unserem“ ergibt sich aus der gemeinschaftlichen Aufforderung.'
    reason: Das Possessivpronomen ist im Deutschen idiomatisch, aber im griechischen Wortlaut nicht ausdrücklich vorhanden.
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Da wir nun … haben
  rationale: Das Partizip gibt den Grund für die folgende Aufforderung an; „da wir“ drückt diesen Zusammenhang natürlich aus. „Nun“ bewahrt die folgernde bzw. weiterführende Funktion von οὖν.
- source_word: ἀρχιερέα μέγαν
  choice: einen großen Hohenpriester
  rationale: Die Wortgruppe wird formal und zugleich idiomatisch wiedergegeben; „groß“ hebt den einzigartigen Rang seines Priestertums hervor.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: der durch die Himmel hindurchgegangen ist
  rationale: Das Perfekt bezeichnet einen vollendeten Vorgang mit fortdauernder Bedeutung. „Durch … hindurchgegangen“ bewahrt die Bewegung durch die im Griechischen pluralischen „Himmel“.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: Jesus, den Sohn Gottes
  rationale: Die Apposition und der christologische Titel bleiben ausdrücklich erhalten.
- source_word: κρατῶμεν
  choice: lasst uns … festhalten
  rationale: Der hortative Konjunktiv fordert die Gemeinschaft zu anhaltender Treue auf; diese deutsche Wendung ist klar und würdevoll.
- source_word: τῆς ὁμολογίας
  choice: an unserem Bekenntnis
  rationale: κρατέω mit Genitiv bedeutet hier, etwas festzuhalten. „Bekenntnis“ bezeichnet den bekannten bzw. öffentlich bezeugten Glauben; „unserem“ macht im Deutschen den gemeinschaftlichen Bezug natürlich deutlich.
theological_decisions:
- issue: Wiedergabe des christologischen Titels υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  alternative: Gottes Sohn
  rationale: Die traditionelle Titelform bewahrt Gewicht und ausdrücklichen Charakter der christologischen Aussage, ohne sie auszulegen oder abzuschwächen.
- issue: Plural τοὺς οὐρανούς und die kosmologische Bildsprache
  choice: die Himmel
  alternative: der Himmel
  rationale: Der griechische Plural wird bewahrt. So bleibt die Bildsprache erhalten, ohne eine bestimmte kosmologische Systematik in den Text hineinzulesen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. Die Satzführung bleibt nahe am griechischen Gedankengang, vermeidet jedoch unnötig schwerfällige Partizipialkonstruktionen. Der Gedankenstrich markiert die erläuternde Apposition.
