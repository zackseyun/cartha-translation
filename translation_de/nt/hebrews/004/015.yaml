source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: de
  text: Denn wir haben keinen Hohen Priester, der nicht mit unseren Schwächen mitfühlen könnte, sondern einen, der in jeder Hinsicht in gleicher Weise[b] erprobt worden ist[a], doch ohne Sünde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „versucht worden ist“.'
    reason: πειράζω kann sowohl „erproben“ als auch „versuchen“ bedeuten.
  - marker: b
    text: 'Wörtlicher: „gemäß der Ähnlichkeit“. Die griechische Formulierung nennt die Ähnlichkeit, lässt die Vergleichsgröße jedoch unausgesprochen; erläuternd kann übersetzt werden: „ebenso wie wir“.'
    reason: Die Fußnote kennzeichnet die im Haupttext bewusst weniger explizit wiedergegebene Formulierung καθ’ ὁμοιότητα.
lexical_decisions:
- source_word: ἀρχιερέα
  choice: Hohen Priester
  rationale: Die übliche und präzise Bezeichnung des kultischen Amtes; im Hebräerbrief ist der Titel für Jesu priesterliche Mittlerschaft zentral.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: der nicht mit unseren Schwächen mitfühlen könnte
  rationale: Die doppelte Verneinung wird in ihrer rhetorischen Form bewahrt. „Mitfühlen“ gibt συμπαθέω als Anteilnahme an menschlicher Schwachheit wieder, nicht bloß als Mitleid aus der Distanz.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: mit unseren Schwächen
  rationale: Gemeint sind menschliche Begrenztheit und Verletzlichkeit im weiteren Sinn, nicht nur körperliche Krankheit.
- source_word: πεπειρασμένον
  choice: erprobt worden ist
  rationale: πειράζω kann sowohl Erprobung als auch Versuchung bezeichnen. „Erprobt“ wahrt die reale Prüfung, ohne die ebenfalls mögliche Bedeutung „versucht“ auszuschließen; diese steht in der Fußnote.
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Die Wendung bringt die umfassende Reichweite der Erprobung in natürlichem, präzisem Deutsch zum Ausdruck.
- source_word: καθ’ ὁμοιότητα
  choice: ebenso wie wir
  rationale: Die wörtliche Wendung „gemäß der Ähnlichkeit“ wäre im Deutschen unnatürlich. Der Kontext legt den Vergleich mit uns nahe, ohne Gleichheit in jeder Hinsicht zu behaupten.
- source_word: χωρὶς ἁμαρτίας
  choice: doch ohne Sünde
  rationale: „Doch“ markiert den entscheidenden Gegensatz zur vorausgehenden Ähnlichkeit und bewahrt die klare Aussage der Sündlosigkeit.
theological_decisions:
- issue: Bedeutung von πεπειρασμένον im Verhältnis zur Sündlosigkeit Christi
  choice: erprobt worden ist
  alternative: versucht worden ist
  rationale: „Erprobt“ bezeichnet wirkliche Prüfung, ohne die Art der inneren Erfahrung näher festzulegen. Da πειράζω auch „versuchen“ bedeuten kann, wird diese sachlich wichtige Möglichkeit in einer Fußnote bewahrt.
- issue: Explizierung des in καθ’ ὁμοιότητα enthaltenen Vergleichs
  choice: ebenso wie wir
  alternative: gemäß der Ähnlichkeit
  rationale: Das Deutsche benötigt eine verständliche Vergleichsgröße. „Ebenso wie wir“ macht den im Zusammenhang naheliegenden Bezug deutlich; „doch ohne Sünde“ setzt zugleich die vom Text selbst genannte Grenze der Ähnlichkeit.
- issue: Bezug von χωρὶς ἁμαρτίας
  choice: doch ohne Sünde
  alternative: abgesehen von der Sünde
  rationale: Die gewählte Fassung lässt offen, ob die Wendung vor allem das Ergebnis, die Art oder den Bereich der Erprobung näher bestimmt, und vermeidet eine unnötige dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die litotische Form „keinen …, der nicht … könnte“ bleibt erhalten. „Ebenso wie wir“ dient der natürlichen Verständlichkeit; der Gedankenstrich hebt die ausdrückliche Grenze „doch ohne Sünde“ hervor.
