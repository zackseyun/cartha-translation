source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: de
  text: Denn auch wir selbst waren einst ohne Einsicht, ungehorsam, in die Irre geführt[a], Sklaven vielerlei Begierden und Vergnügungen. Wir verbrachten unser Leben in Bosheit und Neid, waren verhasst[b] und hassten einander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „getäuscht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hassenswert“. Das griechische Adjektiv kann passiv („verhasst“) oder aktiv („hassenswert, abscheulich“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Denn auch wir selbst waren einst
  rationale: „Denn“ wahrt den begründenden Anschluss; „auch wir selbst“ erhält die inklusive Hervorhebung von καὶ ἡμεῖς, und „einst“ gibt ποτε natürlich wieder.
- source_word: ἀνόητοι
  choice: unverständig
  rationale: Das Wort bezeichnet fehlende Einsicht beziehungsweise moralische Unvernunft; „unverständig“ ist würdig und weniger missverständlich als das umgangssprachlich härtere „dumm“.
- source_word: ἀπειθεῖς
  choice: ungehorsam
  rationale: Die Wiedergabe erfasst im ethischen Zusammenhang die aus mangelnder Bereitschaft zum Hören und Glauben folgende Widersetzlichkeit.
- source_word: πλανώμενοι
  choice: wurden irregeführt
  rationale: Die passive Form bewahrt den Gedanken, dass die Betroffenen auf einen falschen Weg gebracht wurden, ohne den Sinn auf rein intellektuelle Täuschung zu verengen.
- source_word: δουλεύοντες
  choice: waren versklavt an
  rationale: Die Formulierung erhält die starke Bildsprache des Sklavendienstes und macht die Bindung an Begierden und Vergnügungen deutlich.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: an vielerlei Begierden und Vergnügungen
  rationale: „Begierden“ umfasst ungeordnete Verlangen über den sexuellen Bereich hinaus; „vielerlei“ bezieht sich sinngemäß auf beide Substantive.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: Wir verbrachten unser Leben in Bosheit und Neid
  rationale: διάγω bezeichnet hier die Lebensführung über eine Zeitspanne. „Bosheit“ passt zum zwischenmenschlichen Kontext, während „Neid“ φθόνος unmittelbar wiedergibt.
- source_word: στυγητοί
  choice: verhasst
  rationale: Das Adjektiv kann passiv „verhasst“ oder aktiv „hassenswert“ bedeuten. „Verhasst“ ist im Deutschen idiomatisch und lässt die passive Lesart hervortreten; die Alternative wird in der Fußnote bewahrt.
- source_word: μισοῦντες ἀλλήλους
  choice: hassten einander
  rationale: Die finite Form ergibt im Deutschen einen klaren, natürlichen Abschluss und bewahrt die wechselseitige Bedeutung von ἀλλήλους.
theological_decisions:
- issue: Stärke der Bindung in δουλεύοντες bei unpersönlichen Herren
  choice: waren versklavt an vielerlei Begierden und Vergnügungen
  alternative: dienten vielerlei Begierden und Vergnügungen
  rationale: „Versklavt“ wahrt die starke Aussage über moralische Unfreiheit, ohne daraus ein weitergehendes Lehrsystem abzuleiten.
- issue: Aktive oder passive Bedeutung von στυγητοί
  choice: verhasst
  alternative: hassenswert
  rationale: Beide Bedeutungen sind sprachlich möglich. Der Haupttext wählt die passive Lesart, während die Fußnote die aktive Lesart ausdrücklich offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Aufzählung wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; ihre Reihenfolge und gedankliche Bewegung bleiben erhalten. Sämtliche Fußnotenmarker stehen an der betreffenden Stelle im Haupttext.
