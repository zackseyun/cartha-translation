lexical_decisions:
- source_word: οὗ
  choice: den
  rationale: Das Relativpronomen bezieht sich auf den Heiligen Geist in Vers 5. Im Deutschen richtet sich das Genus nach dem maskulinen Substantiv „Geist“; der Akkusativ ergibt sich aus der deutschen Konstruktion mit „ausgießen“.
- source_word: ἐξέχεεν
  choice: ausgegossen hat
  rationale: „Ausgießen“ gibt die übliche Bildsprache von ἐκχέω für die Gabe des Geistes klar und würdig wieder; das Perfekt entspricht hier natürlichem modernem Deutsch.
- source_word: ἐφ’ ἡμᾶς
  choice: über uns
  rationale: Bei „ausgießen“ ist „über uns“ die idiomatische deutsche Wiedergabe der auf Menschen gerichteten Bewegung von ἐπί mit Akkusativ.
- source_word: πλουσίως
  choice: reichlich
  rationale: „Reichlich“ bewahrt die Bedeutung von Fülle und Überfluss und klingt im Deutschen natürlich.
- source_word: διὰ
  choice: durch
  rationale: διά mit Genitiv bezeichnet hier Vermittlung oder Mittel; „durch“ ist die knappe und genaue Wiedergabe.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  rationale: Χριστός wird als Titel mit seiner Bedeutung „Messias“ wiedergegeben. Die Apposition mit Artikel ist im Deutschen idiomatisch und macht den Titel erkennbar.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: unseren Retter
  rationale: Die Apposition bezeichnet Jesus als den Retter der Glaubenden; der deutsche Akkusativ folgt der Einbindung in die durch διὰ eröffnete Wortgruppe.
theological_decisions:
- issue: Bezugswort des Relativpronomens οὗ
  choice: Das Pronomen bezieht sich auf den Heiligen Geist aus Vers 5.
  alternative: Eine weniger personale Wiedergabe entsprechend dem grammatisch sächlichen griechischen πνεῦμα.
  rationale: Der unmittelbare Bezug ist „Heiliger Geist“. Die deutsche Grammatik verlangt wegen „Geist“ die maskuline Form „den“; damit wird der personale Bezug natürlich ausgedrückt, ohne über den griechischen Satz hinauszugehen.
- issue: Wiedergabe von Χριστοῦ
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Χριστός ist hier als Würde- und Hoheitstitel verständlich. „Messias“ legt seine Bedeutung offen; die geläufige traditionelle Wiedergabe wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im Deutschen natürliche Stellung von „durch Jesus, den Messias, unseren Retter“ hält die zusammengehörigen Titel beieinander; „reichlich … über uns ausgegossen“ bewahrt zugleich das Bild und die Betonung der Fülle.
