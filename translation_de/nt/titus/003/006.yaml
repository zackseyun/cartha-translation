  text: den er reichlich durch Jesus, den Messias, unseren Retter, über uns ausgegossen hat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Relativpronomen kann sich auf den Heiligen Geist in Vers 5 beziehen; seine Form ist im Genitiv Singular für Maskulinum und Neutrum gleich. Im Deutschen heißt es wegen des maskulinen Wortes „Geist“ und der Objektfunktion bei „ausgießen“: „den“.'
    reason: lexical_alternative
  - marker: b
