source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: de
  text: Meide aber törichte Streitfragen[a], Geschlechtsregister, Zank und Streitigkeiten über das Gesetz[b]; denn sie sind nutzlos und sinnlos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „törichte Erörterungen“ oder „unsinnige Streitfragen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gesetzesbezogene Streitigkeiten“; gemeint sind Streitigkeiten über das Gesetz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: dumme Streitfragen
  rationale: Die Wortgruppe bezeichnet törichte oder unsinnige, auf Streit hinauslaufende Erörterungen. „Dumme Streitfragen“ ist verständlich, direkt und bewahrt die moralisch-praktische Wertung.
- source_word: γενεαλογίας
  choice: Geschlechtsregister
  rationale: Die Wiedergabe bleibt bewusst allgemein und legt nicht fest, ob jüdische Abstammungsfragen oder spekulative genealogische Konstruktionen gemeint sind.
- source_word: ἔρεις
  choice: Zwietracht
  rationale: ἔρις bezeichnet Streit und daraus entstehende Uneinigkeit. „Zwietracht“ unterscheidet den Ausdruck vom folgenden μάχας und gibt seine gemeinschaftsschädigende Wirkung wieder.
- source_word: μάχας νομικὰς
  choice: Auseinandersetzungen über das Gesetz
  rationale: Das Adjektiv νομικάς bezieht sich auf das Gesetz; μάχας meint hier nicht körperliche Kämpfe, sondern konfliktreiche Auseinandersetzungen.
- source_word: περιΐστασο
  choice: meide
  rationale: Der mediale Imperativ fordert dazu auf, sich von diesen Dingen fernzuhalten. „Meide“ ist knapp und gibt die Handlungsaufforderung deutlich wieder.
- source_word: ἀνωφελεῖς
  choice: nutzlos
  rationale: Das Wort bezeichnet etwas, das keinen Nutzen bringt. „Nutzlos“ ist gegenwärtig und klar.
- source_word: μάταιοι
  choice: nichtig
  rationale: μάταιος bezeichnet etwas Leeres, Vergebliches oder Zweckloses. „Nichtig“ bewahrt neben „nutzlos“ den Gedanken der inhaltlichen Leere.
theological_decisions:
- issue: Art der Geschlechtsregister und der Auseinandersetzungen über das Gesetz
  choice: Die Begriffe bleiben allgemein und werden keiner bestimmten jüdischen, gnostischen oder sonstigen Lehrströmung zugeordnet.
  alternative: Die Geschlechtsregister als jüdische Abstammungsdebatten oder als frühe gnostische Spekulationen näher bestimmen.
  rationale: Der Vers selbst erlaubt keine sichere historische Eingrenzung. Eine allgemein gehaltene Übersetzung bewahrt die Offenheit des Ausgangstextes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Reihung des Griechischen bleibt erkennbar; zugleich werden ἔρεις und μάχας sprachlich unterschieden. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
