id: TIT.3.7
reference: Titus 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: de
  text: damit wir, durch seine Gnade gerechtfertigt[a], Erben werden gemäß der Hoffnung auf ewiges Leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für gerecht erklärt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Erben werden in der Hoffnung auf ewiges Leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die Folge ein und entspricht im Deutschen natürlich dem griechischen ἵνα mit Konjunktiv.
- source_word: δικαιωθέντες
  choice: gerechtfertigt
  rationale: Das passive Partizip wird in einer knappen deutschen Partizipialfügung wiedergegeben; „gerechtfertigt“ bewahrt den etablierten Zusammenhang mit δικαιόω, ohne die genaue theologische Wirkweise auszudeuten.
- source_word: τῇ ἐκείνου χάριτι
  choice: durch seine Gnade
  rationale: Der Dativ bezeichnet hier das Mittel beziehungsweise den Grund. „Seine“ lässt den im Griechischen nicht ausdrücklich benannten Bezug der vorausgehenden Heilsaussage bestehen.
- source_word: κληρονόμοι
  choice: Erben
  rationale: Bewahrt das biblische Bild von Erbe und Erbschaft und ist im modernen Deutschen geläufig.
- source_word: γενηθῶμεν
  choice: wir … werden
  rationale: Gibt den Aorist Konjunktiv von γίνομαι nach ἵνα natürlich wieder und bezeichnet das Eintreten in den Stand von Erben.
- source_word: κατ’ ἐλπίδα
  choice: gemäß der Hoffnung
  rationale: Bewahrt die ungewöhnliche, aber bedeutungsoffene Konstruktion mit κατά möglichst transparent; die idiomatischere Wiedergabe „in der Hoffnung“ wird in der Fußnote genannt.
- source_word: ζωῆς αἰωνίου
  choice: auf ewiges Leben
  rationale: Im Deutschen verlangt „Hoffnung“ idiomatisch „auf“; ewiges Leben ist der Inhalt beziehungsweise Gegenstand der Hoffnung.
theological_decisions:
- issue: Bedeutung von δικαιωθέντες im heilsgeschichtlichen Zusammenhang
  choice: gerechtfertigt
  alternative: für gerecht erklärt
  rationale: „Gerechtfertigt“ wahrt die Verbindung zum griechischen δικαιόω und lässt offen, wie das Verhältnis von Erklärung und Gerechtmachung näher zu bestimmen ist.
- issue: Bezug von ἐκείνου
  choice: seine
  alternative: Gottes beziehungsweise Jesu Christi Gnade
  rationale: Das Pronomen wird nicht durch einen ausdrücklich genannten Referenten ersetzt, sodass die im Kontext verbleibende Bezugsoffenheit nicht stillschweigend aufgelöst wird.
- issue: Verhältnis von Erbschaft und Hoffnung in κατ’ ἐλπίδα
  choice: gemäß der Hoffnung auf ewiges Leben
  alternative: in der Hoffnung auf ewiges Leben
  rationale: Die Hauptfassung bildet κατά formal ab; die Alternative ist idiomatischer und möglicherweise die gemeinte modale Beziehung, wird deshalb als Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Partizipialfügung eng bei „durch seine Gnade“ und bewahrt die knappe Argumentationsstruktur des griechischen Satzes. Beide Fußnotenmarker stehen im Haupttext.
