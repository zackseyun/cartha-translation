review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung bildet die Struktur des griechischen Satzes zuverlässig ab: ἵνα als finaler Anschluss („damit“), das vorzeitige passive Partizip δικαιωθέντες („durch seine Gnade gerechtfertigt“), γενηθῶμεν als Eintritt in den Erbenstatus („Erben werden“) und die zurückhaltend formale Wiedergabe von κατ’ ἐλπίδα. Der nicht explizit ausformulierte Bezug von ἐκείνου bleibt mit „seine“ angemessen offen.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Die eingeschobene Partizipialfügung ist klar und idiomatisch. „Gemäß der Hoffnung auf ewiges Leben“ ist etwas formeller als die mögliche Alternative „in der Hoffnung“, aber verständlich und angesichts der semantisch nicht völlig eindeutigen κατά-Konstruktion vertretbar.
  terminology: „Gerechtfertigt“, „Gnade“, „Erben“ und „ewiges Leben“ sind etablierte, quellentreue und registergerechte Wiedergaben. Die Fußnote zu „für gerecht erklärt“ bietet eine legitime lexikalische Umschreibung, ohne die Hauptfassung theologisch einzuengen.
