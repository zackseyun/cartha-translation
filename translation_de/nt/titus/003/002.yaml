  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: de
  text: über niemanden abfällig zu reden[a], nicht streitlustig zu sein[b], entgegenkommend zu sein und allen Menschen gegenüber uneingeschränkte Sanftmut zu zeigen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „niemanden zu schmähen“ oder „über niemanden Böses zu reden“. Das Verb kann beleidigendes, herabsetzendes oder schmähendes Reden bezeichnen und ist weiter gefasst als eine nachweislich falsche Verleumdung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „friedfertig zu sein“ oder „nicht streitsüchtig zu sein“. Gemeint ist, keinen Streit oder Kampf zu suchen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „allen Menschen gegenüber alle Sanftmut zu zeigen“. Das Substantiv kann Sanftmut, Milde oder eine demütige, nicht aggressive Haltung bezeichnen; „uneingeschränkt“ gibt hier die umfassende Nuance von „alle“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: niemanden
  rationale: Das Akkusativobjekt von βλασφημεῖν wird natürlich und mit uneingeschränktem Geltungsbereich wiedergegeben.
- source_word: βλασφημεῖν
  choice: zu verleumden
  rationale: Im zwischenmenschlichen ethischen Zusammenhang bezeichnet das Verb schädigendes oder herabsetzendes Reden; „verleumden“ ist knapp und verständlich, während die Fußnote den weiteren Bedeutungsumfang nennt.
- source_word: ἀμάχους εἶναι
  choice: nicht streitsüchtig zu sein
  rationale: Die negative Form und die Bedeutung, Streit oder Kampf nicht zu suchen, bleiben erhalten; die Wendung ist im heutigen Deutsch natürlich.
- source_word: ἐπιεικεῖς
  choice: nachsichtig
  rationale: „Nachsichtig“ vermittelt die Bereitschaft, nicht auf dem eigenen Recht zu bestehen, und unterscheidet das Wort sinnvoll von πραΰτης im folgenden Satzglied.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: durchweg Sanftmut zu zeigen
  rationale: Die Formulierung bewahrt das ausdrückliche „Zeigen“ des Partizips und gibt πᾶσαν bei dem abstrakten Substantiv idiomatisch als umfassende, beständige Haltung wieder.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: allen Menschen gegenüber
  rationale: Die Wendung gibt die relationale Ausrichtung von πρός und den universalen, geschlechtsübergreifenden Sinn von ἀνθρώπους wieder.
theological_decisions:
- issue: Generischer Sinn von ἀνθρώπους
  choice: allen Menschen
  alternative: allen / jedermann gegenüber
  rationale: Das grammatisch maskuline Substantiv bezeichnet hier Menschen allgemein; die Übersetzung wahrt den universalen Bezug ohne eine männliche Einschränkung.
- issue: Unterscheidung von ἐπιεικής und πραΰτης
  choice: nachsichtig / Sanftmut
  alternative: freundlich / Freundlichkeit; gütig / Sanftmut
  rationale: 'Die beiden eng verwandten Tugendbegriffe werden nicht gleichgesetzt: ἐπιεικής hebt hier maßvolle Nachsicht hervor, πραΰτης eine sanfte, nicht aggressive Haltung. Die Übersetzung wahrt ihre Nähe, ohne die Begriffe miteinander zu verschmelzen.'
translation_notes:
  register: Moderner, würdiger Ermahnungsstil. Die Infinitivreihe bleibt als Fortsetzung des vorangehenden Satzes erhalten. „Sanftmut“ ist zwar gehobener als Alltagssprache, aber im ethischen und biblischen Register verständlich; die Fußnote erschließt den Bedeutungsumfang.
