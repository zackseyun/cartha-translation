id: TIT.3.14
reference: Titus 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: de
  text: Auch die Unseren[a] sollen lernen, sich guten Werken zu widmen[b], um dringenden Bedürfnissen abzuhelfen[c], damit sie nicht ohne Frucht bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere eigenen Leute“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gute Werke zu tun“; möglicherweise auch: „in guten Werken voranzugehen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „um notwendige Bedürfnisse zu decken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: sollen lernen
  rationale: Der Imperativ der dritten Person wird im modernen Deutschen natürlich als aufforderndes „sollen lernen“ wiedergegeben, ohne ihn zu einem bloßen Vorschlag abzuschwächen.
- source_word: οἱ ἡμέτεροι
  choice: die Unseren
  rationale: Die substantivierte Form bezeichnet die Menschen, die zu Paulus und Titus beziehungsweise zu ihrer Glaubensgemeinschaft gehören. „Die Unseren“ bewahrt den relationalen und gemeinschaftlichen Charakter, ohne das Geschlecht unnötig einzugrenzen.
- source_word: καλῶν ἔργων
  choice: guten Werken
  rationale: Die geläufige und transparente Wiedergabe erhält zugleich das wiederkehrende Leitmotiv des Titusbriefs.
- source_word: προΐστασθαι
  choice: sich … zu widmen
  rationale: In Verbindung mit „guten Werken“ bezeichnet das Verb hier anhaltenden, tatkräftigen Einsatz. Die Übersetzung vermeidet eine vorschnelle Festlegung auf eine Leitungsfunktion; die mögliche Bedeutung „vorangehen“ wird in der Fußnote bewahrt.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: um dringenden Bedürfnissen abzuhelfen
  rationale: Die Zweckrichtung von εἰς wird idiomatisch ausgedrückt. ἀναγκαῖος bezeichnet notwendige beziehungsweise drängende Bedürfnisse; „abhelfen“ macht deutlich, dass die guten Werke konkreten Bedarf decken sollen.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: damit sie nicht ohne Frucht bleiben
  rationale: Die finale Konstruktion wird als Zwecksatz wiedergegeben. „Ohne Frucht“ erhält das Bild von ἄκαρπος und vermeidet die interpretierende Verengung auf bloße Wirkungslosigkeit.
theological_decisions:
- issue: Bezugsgruppe von οἱ ἡμέτεροι
  choice: „die Unseren“ als Angehörige der mit Paulus und Titus verbundenen christlichen Gemeinschaft
  alternative: „unsere eigenen Leute“ beziehungsweise eine ausdrücklich von Außenstehenden abgegrenzte Gruppe
  rationale: Die Formulierung ist gemeinschaftlich und relational, legt aber weder eine ausschließlich männliche Gruppe noch eine weitergehende lehrmäßige Abgrenzung fest.
- issue: Bedeutung von προΐστασθαι bei guten Werken
  choice: tatkräftige und beständige Hingabe an gute Werke
  alternative: in guten Werken die Führung übernehmen beziehungsweise ihnen vorstehen
  rationale: Der Zusammenhang mit konkreten Bedürfnissen legt praktischen Einsatz nahe, doch die mögliche Leitungsnuance des Verbs wird nicht verworfen, sondern in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Unseren“ bewahrt knapp die gemeinschaftliche Sprache des Originals; „sich guten Werken widmen“ klingt natürlich und trägt den Gedanken nachhaltigen Einsatzes. Die Schlusswendung erhält bewusst die Fruchtmetapher.
