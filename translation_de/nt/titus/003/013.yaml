  text: ζηνᾶν τὸν νομικὸν καὶ ⸀Ἀπολλῶν σπουδαίως πρόπεμψον, ἵνα μηδὲν αὐτοῖς λείπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: de
  text: Hilf Zenas, dem Gesetzeskundigen, und Apollos sorgfältig bei der Weiterreise[a], damit es ihnen an nichts fehlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sorge sorgfältig dafür, dass Zenas, der Gesetzeskundige, und Apollos weiterreisen können.“ Das Verb kann praktische Unterstützung und Versorgung für die Reise einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζηνᾶν
  choice: Zenas
  rationale: Der Eigenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: τὸν νομικόν
  choice: dem Gesetzeskundigen
  rationale: νομικός bezeichnet einen in Rechts- oder Gesetzesfragen kundigen Menschen. „Gesetzeskundiger“ bewahrt die mögliche Breite zwischen einem juristischen Fachmann und einem Kenner des jüdischen Gesetzes, ohne den Kontext vorschnell festzulegen.
- source_word: Ἀπολλῶν
  choice: Apollos
  rationale: Der Eigenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: σπουδαίως
  choice: sorgfältig
  rationale: Das Adverb fordert ernsthafte, gewissenhafte Bemühung. „Sorgfältig“ ist hier natürlich und legt den Akzent nicht einseitig auf Eile.
- source_word: πρόπεμψον
  choice: Hilf ... bei der Weiterreise
  rationale: προπέμπω bezeichnet in frühchristlichen Reisekontexten häufig das Geleitgeben beziehungsweise die praktische Versorgung für die Weiterreise, nicht bloß das Wegschicken.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: damit es ihnen an nichts fehlt
  rationale: Die Formulierung gibt den finalen ἵνα-Satz knapp und idiomatisch wieder und lässt den Umfang der benötigten Unterstützung wie im Griechischen offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die konkrete Hilfeleistung in den Vordergrund. „Gesetzeskundiger“ vermeidet die modern-berufliche Engführung von „Anwalt“ und bewahrt die sachliche Offenheit des griechischen νομικός.
