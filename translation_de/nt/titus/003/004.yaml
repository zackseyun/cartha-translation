base_translation:
  language: en
  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: de
  text: Als aber die Güte und die Menschenliebe Gottes, unseres Retters, erschienen,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Menschenfreundlichkeit“; das griechische Wort bezeichnet Wohlwollen oder Liebe gegenüber Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als aber
  rationale: ὅτε leitet einen zeitlichen Nebensatz ein; δέ markiert den milden Kontrast zur vorherigen Schilderung menschlicher Verfehlung. „Als aber“ gibt beides natürlich wieder.
- source_word: χρηστότης
  choice: Güte
  rationale: χρηστότης bezeichnet freundliche Güte bzw. wohlwollende Freundlichkeit. „Güte“ ist würdevoll und lässt sich im Deutschen klar von „Menschenliebe“ unterscheiden.
- source_word: φιλανθρωπία
  choice: Menschenliebe
  rationale: Das Wort bezeichnet Wohlwollen oder Liebe gegenüber Menschen. „Menschenliebe“ ist prägnant, im modernen Standarddeutsch verständlich und bewahrt den Bezug auf die Menschen als Gegenstand der Liebe.
- source_word: ἐπεφάνη
  choice: erschien
  rationale: Die Form bezeichnet ein Sichtbarwerden oder Erscheinen. „Erschien“ bewahrt den Manifestationsgedanken, ohne die Art des Erscheinens näher festzulegen.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Gottes, unseres Retters
  rationale: Der Genitiv bezieht sich auf „Güte“ und „Menschenliebe“; σωτῆρος ἡμῶν steht als nähere Bezeichnung zu θεοῦ. Die deutsche Wortstellung samt Kommas macht diese Apposition klar.
theological_decisions:
- issue: Bezug von „Gott, unserem Retter“
  choice: Die Formulierung bleibt als Titel Gottes stehen; im unmittelbaren Zusammenhang legt Vers 6 die Unterscheidung von Jesus Christus nahe.
  alternative: Der Ausdruck kann in diesem Vers für sich genommen auch allgemein als göttlicher Titel gelesen werden, ohne die Person näher zu bestimmen.
  rationale: Die Übersetzung bewahrt Wortlaut und Titelgewicht des Griechischen, ohne die personale Zuordnung ausdrücklich in den Vers hineinzuschreiben oder Vater und Sohn gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als zeitlicher Nebensatz offen, da er in den folgenden Versen fortgeführt wird. „Menschenliebe“ vermeidet eine geschlechtsspezifische Formulierung und erhält zugleich den eigenständigen Sinn von φιλανθρωπία.
