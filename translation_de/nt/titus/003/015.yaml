id: TIT.3.15
reference: Titus 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: de
  text: Alle, die bei mir sind, grüßen dich. Grüße alle, die uns im Glauben[a] lieben. Die Gnade sei mit euch allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Treue“; „im Glauben“ kann hier auch „in dem gemeinsamen Glauben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: grüßen
  rationale: Im brieflichen Schluss ist „grüßen“ die natürliche und genaue deutsche Wiedergabe von ἀσπάζομαι.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: alle, die bei mir sind
  rationale: Die Formulierung bewahrt sowohl πάντες („alle“) als auch die Aussage über die bei Paulus befindlichen Begleiter.
- source_word: ἄσπασαι
  choice: Grüße
  rationale: Der Imperativ wird knapp und idiomatisch wiedergegeben.
- source_word: φιλοῦντας
  choice: lieben
  rationale: φιλέω bezeichnet hier persönliche Zuneigung; „lieben“ ist im Deutschen direkt, verständlich und dem Ton des Briefschlusses angemessen.
- source_word: ἐν πίστει
  choice: im Glauben
  rationale: Die Wendung lässt den Glauben als Bereich oder gemeinsame Grundlage der Liebe erkennen, ohne die mögliche Nuance der Treue auszuschließen; die Alternative wird in der Fußnote bewahrt.
- source_word: ἡ χάρις
  choice: Die Gnade
  rationale: Der bestimmte Artikel des griechischen Segenswunsches lässt sich im Deutschen natürlich mit „Die Gnade“ wiedergeben.
- source_word: μετὰ πάντων ὑμῶν
  choice: sei mit euch allen
  rationale: Das im Griechischen ausgelassene Verb wird im deutschen Segenswunsch idiomatisch ergänzt; πάντων bleibt durch „allen“ ausdrücklich erhalten.
theological_decisions:
- issue: Bedeutung von πίστις in ἐν πίστει
  choice: Glauben
  alternative: Treue; der Glaube
  rationale: „Im Glauben“ gibt die wahrscheinlichste Bedeutung als gemeinsamen christlichen Glauben beziehungsweise als Bereich der Zuneigung wieder. Da πίστις hier auch „Treue“ bezeichnen kann und die Wendung als Bezug auf „den Glauben“ verstanden werden kann, wird diese Offenheit in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderner, würdiger Briefstil mit allgemein verständlicher Syntax. Die Anrede wechselt entsprechend dem griechischen Text vom persönlichen Singular „dich“ zum pluralischen „euch allen“ im abschließenden Segenswunsch.
