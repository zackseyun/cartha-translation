translation:
  language: de
  text: 'Du weißt: Ein solcher Mensch ist vom rechten Weg abgekommen[a] und sündigt; er hat sich selbst verurteilt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist verdreht“ oder „ist vom Weg abgebracht“. Das griechische Perfekt bezeichnet einen Zustand, der aus einem vorausgegangenen Abweichen entstanden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ist selbstverurteilt“ oder „steht durch sich selbst verurteilt da“. Gemeint sein kann, dass sein eigenes Handeln oder Zeugnis ihn verurteilt; ein ausdrücklich über sich selbst gesprochenes Urteil ist nicht zwingend gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: Du weißt ja
  rationale: Das adverbiale Partizip bezieht sich auf den Adressaten der vorangehenden Anweisung. Die selbstständige deutsche Wendung gibt den begleitenden beziehungsweise begründenden Sinn natürlich wieder, ohne ihn eindeutig kausal festzulegen.
- source_word: ἐξέστραπται
  choice: ist vom rechten Weg abgekommen
  rationale: Das Perfekt bezeichnet einen gegenwärtigen Zustand als Folge eines früheren Abweichens. Die Formulierung bewahrt das Weg-/Abwendungsbild und vermeidet die im heutigen Deutsch leicht missverständliche Spezialisierung von „pervertiert“.
- source_word: ὁ τοιοῦτος
  choice: ein solcher Mensch
  rationale: Der Ausdruck bezeichnet die zuvor genannte spalterische Person. Obwohl die griechische Form maskulin singular ist, kann das grammatische Maskulinum generisch sein; „Mensch“ gibt den Einzelbezug wieder, ohne biologisches Geschlecht stärker festzulegen, als der Kontext verlangt.
- source_word: ἁμαρτάνει
  choice: sündigt
  rationale: Das Präsens beschreibt sein gegenwärtiges beziehungsweise fortgesetztes Handeln. Im Deutschen kann das einfache Präsens diese Verlaufsbedeutung tragen, ohne durch „sündigt weiterhin“ zusätzliche Betonung einzutragen.
- source_word: ὢν
  choice: durch sich selbst ist er
  rationale: Das Partizip verbindet die abschließende Charakterisierung mit dem Vorhergehenden. Für natürliches Deutsch wird die Konstruktion als finiter Satz wiedergegeben.
- source_word: αὐτοκατάκριτος
  choice: durch sich selbst verurteilt
  rationale: 'Die Wiedergabe bewahrt die mögliche Spannung des Ausdrucks: Die Person steht aufgrund ihres eigenen Handelns oder Zeugnisses verurteilt da, ohne zwingend zu behaupten, sie habe ausdrücklich ein Urteil über sich selbst gesprochen.'
theological_decisions:
- issue: Geschlechtsbezug von ὁ τοιοῦτος
  choice: ein solcher Mensch
  alternative: ein solcher Mann
  rationale: Die Form ist grammatisch maskulin und verweist auf eine einzelne Person, doch der Zusammenhang verlangt keine Festlegung auf das biologische Geschlecht. „Mensch“ erhält den Singular und den persönlichen Bezug, ohne den generischen Ausdruck unnötig zu verengen.
- issue: Aussagekraft von αὐτοκατάκριτος
  choice: durch sich selbst verurteilt
  alternative: selbstverurteilt
  rationale: Die Formulierung lässt offen, ob die Verurteilung durch eigenes Handeln, eigenes Zeugnis oder ein ausdrücklich gegen sich selbst gerichtetes Urteil zustande kommt. Sie importiert keine weitergehende Aussage über das Endgericht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt löst die griechische Partizipialkonstruktion idiomatisch auf; das Semikolon hält die eng verbundenen Aussagen zusammen. Die Übersetzung wahrt die Unbestimmtheit der Partizipien und des Ausdrucks αὐτοκατάκριτος.
