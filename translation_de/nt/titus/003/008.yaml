reference: Titus 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: de
  text: Diese Aussage ist zuverlässig. Ich möchte, dass du diese Dinge mit Nachdruck bekräftigst, damit diejenigen, die Gott geglaubt haben[a], darauf bedacht sind, sich guten Werken zu widmen[b]. Diese Dinge sind gut und nützlich für die Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die an Gott geglaubt haben“; oder: „die Gott vertraut haben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich um gute Werke zu bemühen“; möglicherweise auch: „bei guten Werken voranzugehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Dieses Wort ist zuverlässig
  rationale: Die pastorale Briefformel bezeichnet die unmittelbar vorausgehende Aussage beziehungsweise Botschaft. „Wort“ wahrt die Verbindung zu λόγος; „dieses“ macht den kontextuellen Rückbezug deutlich.
- source_word: περὶ τούτων
  choice: diese Dinge
  rationale: Im Deutschen lässt sich der Bezug idiomatisch als direktes Objekt von „bekräftigen“ ausdrücken, ohne die Bedeutung von περί mit Genitiv zu verlieren.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: Ich möchte, dass du ... mit Nachdruck bekräftigst
  rationale: βούλομαι bezeichnet den persönlichen Willen, während διαβεβαιόομαι ein bestimmtes, nachdrückliches Bekräftigen ausdrückt. Die Formulierung ist natürlich und erhält die Stärke der Aufforderung.
- source_word: ἵνα φροντίζωσιν
  choice: damit ... darauf bedacht sind
  rationale: Die Zweck- beziehungsweise Folgebeziehung von ἵνα bleibt erhalten; „darauf bedacht sein“ gibt das sorgfältige Erwägen und Bemühen von φροντίζω treffend wieder.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: sich guten Werken zu widmen
  rationale: Im Kontext bezeichnet προΐστασθαι wahrscheinlich anhaltendes Bemühen um gute Werke, nicht eine organisatorische Leitungsfunktion. „Sich widmen“ bewahrt diesen aktiven und nachhaltigen Sinn.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: alle, die Gott geglaubt haben
  rationale: Der Dativ θεῷ wird möglichst unmittelbar wiedergegeben. Das Perfekt bezeichnet Menschen, die zum Glauben gekommen sind und in diesem Verhältnis stehen.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα
  choice: Das ist gut und nützlich
  rationale: Das griechische Neutrum Plural kann zusammenfassend auf den ganzen beschriebenen Sachverhalt weisen. Das deutsche Singularpronomen „Das“ ist hier natürlich; „gut und nützlich“ wahrt die qualitative und praktische Aussage.
- source_word: τοῖς ἀνθρώποις
  choice: für die Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, nicht nur Männer.
theological_decisions:
- issue: Verhältnis von Glauben und guten Werken
  choice: Die guten Werke erscheinen als beabsichtigte Folge des bereits erfolgten Glaubens.
  alternative: Die Werke als Grundlage oder Verdienst des Heils zu verstehen.
  rationale: Die Reihenfolge des griechischen Satzes nennt zuerst diejenigen, die geglaubt haben, und fordert sie dann zur Hingabe an gute Werke auf. Die Übersetzung wahrt diese Abfolge, ohne ein konfessionelles System einzutragen.
- issue: Bedeutung von πιστεύω mit dem Dativ θεῷ
  choice: „Gott geglaubt haben“ im Haupttext
  alternative: „an Gott geglaubt“ oder „Gott vertraut haben“
  rationale: Die direkte Wiedergabe erhält die griechische Konstruktion und lässt offen, ob der Akzent auf dem Für-wahr-Halten von Gottes Aussage oder auf dem Vertrauen auf Gott liegt; idiomatischere Möglichkeiten werden in der Fußnote genannt.
- issue: Referenz von ταῦτα
  choice: Zusammenfassender Rückbezug durch „Das“
  alternative: Pluralisch „Diese Dinge sind“
  rationale: Der Bezug kann die genannten Lehren und die daraus folgende Lebenspraxis zusammenfassen. Das Deutsche verwendet dafür natürlicherweise den Singular, ohne den Umfang des Rückbezugs dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mit Nachdruck bekräftigen“ vermittelt die Stärke der Aufforderung, ohne altertümlich zu klingen. Die Fußnoten bewahren die echte Bedeutungsbreite bei πιστεύω mit Dativ und προΐστασθαι.
