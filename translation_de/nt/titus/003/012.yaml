source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: de
  text: Wenn ich Artemas oder Tychikus zu dir schicke, setze alles daran[a], zu mir nach Nikopolis zu kommen; denn ich habe beschlossen, dort zu überwintern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bemühe dich, zu mir nach Nikopolis zu kommen“; das griechische Wort kann neben nachdrücklichem Bemühen auch Dringlichkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Wenn ich … schicke
  rationale: Ὅταν mit dem Aorist Konjunktiv bezeichnet hier ein konkret erwartetes zukünftiges Ereignis. Im Deutschen gibt das Präsens nach „wenn“ diese Zukunftsbedeutung natürlich wieder.
- source_word: Ἀρτεμᾶν
  choice: Artemas
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Konjunktion bezeichnet zwei mögliche Abgesandte.
- source_word: Τυχικόν
  choice: Tychikus
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: σπούδασον
  choice: bemühe dich
  rationale: Der Imperativ fordert ernsthaften, zielgerichteten Einsatz und kann auch Dringlichkeit einschließen, ohne ausschließlich Eile zu bezeichnen.
- source_word: ἐλθεῖν πρός με εἰς Νικόπολιν
  choice: zu mir nach Nikopolis zu kommen
  rationale: Die Formulierung bewahrt sowohl die Bewegung auf den Sprecher zu als auch Nikopolis als Ziel und klingt im Deutschen natürlich.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die vorausgehende Aufforderung ein.
- source_word: κέκρικα
  choice: ich habe beschlossen
  rationale: Das Perfekt bezeichnet einen gefassten, weiterhin geltenden Entschluss.
- source_word: παραχειμάσαι
  choice: zu überwintern
  rationale: Das Verb bedeutet, die Winterzeit an einem Ort zu verbringen; „überwintern“ ist die knappe und genaue deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während „zu mir nach Nikopolis“ idiomatisches Deutsch bietet. „Bemühe dich“ vermeidet eine einseitige Festlegung auf bloße Eile; die stärkere mögliche Nuance wird in der Fußnote genannt.
