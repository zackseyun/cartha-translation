  text: αἱρετικὸν ἄνθρωπον μετὰ μίαν καὶ δευτέραν νουθεσίαν παραιτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/010.yaml
  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: de
  text: Einen Menschen, der Spaltungen verursacht, weise nach einer ersten und zweiten Ermahnung ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Einen sektiererischen Menschen“; traditionell auch: „Einen ketzerischen Menschen“. Das griechische Wort bezeichnet hier wahrscheinlich jemanden, der Parteiungen oder Spaltungen hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: der Spaltungen verursacht
  rationale: Das Adjektiv bezeichnet hier wahrscheinlich einen Menschen, der Parteiungen oder Spaltungen hervorruft. Die Umschreibung gibt den wahrscheinlichen Sinn im damaligen Zusammenhang klar wieder, ohne den späteren kirchlichen Fachbegriff „Ketzer“ in den Text einzutragen.
- source_word: ἄνθρωπον
  choice: einen Menschen
  rationale: ἄνθρωπος bezeichnet hier allgemein eine einzelne Person. „Mensch“ entspricht der Form des griechischen Substantivs und ist im Deutschen geschlechtsübergreifend verständlich.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: nach einer ersten und zweiten Ermahnung
  rationale: Die Wendung bezeichnet zwei vorausgehende korrektive Ermahnungen. „Ermahnung“ bewahrt sowohl den warnenden als auch den zurechtweisenden Charakter von νουθεσία.
- source_word: παραιτοῦ
  choice: weise … ab
  rationale: Der Imperativ fordert dazu auf, den betreffenden Menschen nach wiederholter Ermahnung entschieden zurückzuweisen beziehungsweise sich nicht weiter mit ihm einzulassen. „Abweisen“ gibt diese disziplinarische Entschiedenheit knapp wieder.
theological_decisions:
- issue: Ob αἱρετικὸν mit dem späteren dogmatischen Begriff „ketzerisch“ oder entsprechend seinem wahrscheinlichen frühchristlichen Sinn wiederzugeben ist
  choice: der Spaltungen verursacht
  alternative: einen sektiererischen oder ketzerischen Menschen
  rationale: Der Zusammenhang betrifft einen Menschen, dessen Verhalten Parteiungen hervorruft und der trotz wiederholter Ermahnung daran festhält. Die gewählte Formulierung vermeidet es, eine erst später fest umrissene Kategorie formaler Häresie vorauszusetzen, bewahrt aber die mögliche sektiererische Bedeutung in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung hält den betroffenen Menschen im Vordergrund; „weise … ab“ klingt bestimmt, ohne eine über den griechischen Text hinausgehende konkrete kirchenrechtliche Maßnahme festzulegen.
