  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes treffend wieder: αἱρετικὸν als einen Menschen, der Spaltungen verursacht, ἄνθρωπον als „Menschen“, die Abfolge zweier νουθεσίαι als erste und zweite Ermahnung sowie παραιτοῦ als entschiedene Zurückweisung. Die Umschreibung von αἱρετικὸν wahrt den wahrscheinlichen gemeindebezogenen Sinn und vermeidet eine unangebrachte Eintragung späterer häresiologischer Fachterminologie in den Haupttext.'
  naturalness: „Einen Menschen, der Spaltungen verursacht, weise nach einer ersten und zweiten Ermahnung ab“ ist klares, modernes Standarddeutsch und hat einen angemessen knappen, würdigen Imperativstil. Die getrennte Stellung von „weise … ab“ ist idiomatisch.
  terminology: „Ermahnung“ ist für νουθεσία sachgerecht. „Abweisen“ gibt die entschiedene Distanzierung von παραιτοῦ wieder, ohne eine spezifisch institutionelle Sanktion zu behaupten. Die Fußnote dokumentiert mit „sektiererisch“ und der traditionellen Wiedergabe „ketzerisch“ die einschlägigen lexikalischen Alternativen; ihre Erklärung ist kontextsensibel und nicht konfessionell festgelegt.
