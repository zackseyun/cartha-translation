id: TIT.3.1
reference: Titus 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: de
  text: Erinnere sie daran, sich den Regierenden und den Behörden unterzuordnen, ihnen zu gehorchen und zu jedem guten Werk bereit zu sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Erinnere sie daran
  rationale: Der Präsensimperativ fordert Titus zu fortlaufender Erinnerung auf. Die natürliche deutsche Formulierung lässt diesen wiederholten Charakter im Zusammenhang mitschwingen.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Akkusativpronomen im Plural verweist auf die Gläubigen, die Titus unterweisen soll.
- source_word: ἀρχαῖς
  choice: den Regierenden
  rationale: Im staatsbürgerlichen Zusammenhang bezeichnet ἀρχαί die Träger der Herrschaft; »Regierende« gibt den personalen Aspekt wieder.
- source_word: ἐξουσίαις
  choice: staatlichen Gewalten
  rationale: Zusammen mit ἀρχαῖς bezeichnet der Ausdruck obrigkeitliche Instanzen beziehungsweise staatliche Autoritäten. »Staatliche Gewalten« bewahrt die zweigliedrige Formulierung und verdeutlicht den zivilen Kontext.
- source_word: ὑποτάσσεσθαι
  choice: sich … unterzuordnen
  rationale: Der Infinitiv bezeichnet die Einordnung unter eine bestehende Ordnung, ohne im Deutschen uneingeschränkte Gefügigkeit auszudrücken.
- source_word: πειθαρχεῖν
  choice: ihnen zu gehorchen
  rationale: Das Verb bedeutet, einer Obrigkeit Folge zu leisten. Das ergänzte Pronomen macht den Bezug auf die zuvor genannten Regierenden und Gewalten im Deutschen eindeutig.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: zu jedem guten Werk
  rationale: πρός mit Akkusativ bezeichnet hier die Ausrichtung der Bereitschaft. »Jedes gute Werk« wahrt die ethische und konkrete Ausdrucksweise.
- source_word: ἑτοίμους εἶναι
  choice: bereit zu sein
  rationale: Die Infinitivphrase fordert einen Zustand der Bereitschaft und wird so knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Reichweite der Unterordnung unter staatliche Instanzen
  choice: Der Vers wird als allgemeine Aufforderung zu staatsbürgerlicher Unterordnung und Gehorsam wiedergegeben, ohne daraus ausdrücklich einen ausnahmslosen Gehorsam in jeder denkbaren Lage zu machen.
  alternative: Eine Formulierung, die uneingeschränkten Gehorsam gegenüber jeder staatlichen Anordnung nahelegt.
  rationale: Der griechische Text spricht die Unterordnung und den Gehorsam klar aus, bestimmt hier aber nicht deren Grenzen. Die Übersetzung bewahrt diese Spannung, ohne sie durch einen Zusatz aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Regierende und staatliche Gewalten« erhält die beiden griechischen Begriffe und macht zugleich den staatsbürgerlichen Kontext verständlich. Der Satzbau bildet die Folge der drei Infinitivaufforderungen natürlich ab.
