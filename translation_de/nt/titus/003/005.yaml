source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: de
  text: nicht aufgrund von Werken, die wir selbst in Gerechtigkeit getan haben,[a] sondern nach seinem Erbarmen rettete er uns durch das Bad der Wiedergeburt und der Erneuerung durch den Heiligen Geist.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Werke in Gerechtigkeit, die wir selbst getan haben“.'
    reason: Die Fußnote dokumentiert die ungewöhnliche griechische Fügung und die Betonung des menschlichen Handelns.
  - marker: b
    text: „Bad“ kann auf die Taufe, auf das Bild einer Reinigung oder auf beides verweisen; der griechische Ausdruck entscheidet dies nicht ausdrücklich.
    reason: Die lexikalische und theologische Mehrdeutigkeit von λουτρόν soll nicht im Haupttext aufgelöst werden.
  - marker: c
    text: 'Oder: „die Erneuerung des Heiligen Geistes“. Die griechische Genitivverbindung lässt den genauen Bezug etwas offen.'
    reason: Die alternative syntaktische Beziehung von πνεύματος ἁγίου wird bewahrt.
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: nicht aufgrund von Werken
  rationale: ἐκ bezeichnet hier Grundlage oder Ursprung. „Nicht aufgrund von Werken“ ist im Deutschen natürlich und wahrt den Gegensatz zu Gottes Erbarmen.
- source_word: τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς
  choice: die wir selbst in Gerechtigkeit getan hatten
  rationale: Die Relativkonstruktion bezieht sich auf die Werke; das ausdrückliche ἡμεῖς wird mit „wir selbst“ betont wiedergegeben. Das Plusquamperfekt stellt die Werke gegenüber dem anschließenden vergangenen Rettungshandeln zeitlich klar dar, ohne die Aussage inhaltlich zu erweitern.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl den paulinisch-theologischen als auch den ethisch-rechtlichen Bedeutungsbereich besser ab als eine interpretierende Umschreibung.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: nach seinem Erbarmen
  rationale: Die formnahe Wendung bewahrt die Bedeutung von κατά als Maßstab beziehungsweise Grundlage und den ausdrücklichen Gegensatz zu den Werken.
- source_word: ἔσωσεν ἡμᾶς
  choice: rettete er uns
  rationale: „Retten“ ist die natürliche und sachlich angemessene Wiedergabe von σῴζω in diesem heilsgeschichtlichen Zusammenhang.
- source_word: διὰ λουτροῦ
  choice: durch das Bad
  rationale: λουτρόν bezeichnet ein Bad beziehungsweise eine Waschung. „Bad“ erhält das konkrete Bild und lässt offen, ob Taufe, Reinigungssymbolik oder beides gemeint ist.
- source_word: παλιγγενεσίας
  choice: der Wiedergeburt
  rationale: „Wiedergeburt“ ist eine verständliche, traditionsreiche und präzise Wiedergabe von παλιγγενεσία.
- source_word: καὶ ἀνακαινώσεως
  choice: und die Erneuerung
  rationale: Das Substantiv wahrt die parallele genitivische Struktur des Griechischen, soweit dies in natürlichem Deutsch möglich ist.
- source_word: πνεύματος ἁγίου
  choice: durch den Heiligen Geist
  rationale: Die Wiedergabe versteht den Genitiv am ehesten als Urheberangabe zur unmittelbar vorausgehenden „Erneuerung“, ohne diese syntaktische Zuordnung als einzig mögliche auszugeben.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; Recht
  rationale: „Gerechtigkeit“ bewahrt den breiten griechischen und paulinischen Bedeutungsraum. Eine Fußnote ist hier nicht nötig, da das deutsche Wort ebenfalls ethische und rechtliche Aspekte tragen kann.
- issue: Bedeutung von λουτρόν und möglicher Taufbezug
  choice: das Bad der Wiedergeburt
  alternative: 'die Waschung der Wiedergeburt; ausdrücklich: das Taufbad'
  rationale: Der Haupttext setzt „Taufe“ nicht ausdrücklich ein, weil λουτρόν zwar einen Taufbezug nahelegen kann, ihn aber lexikalisch nicht allein festlegt. Die Fußnote erhält diese theologische Spannung.
- issue: Bezug von πνεύματος ἁγίου
  choice: die Erneuerung durch den Heiligen Geist
  alternative: die Erneuerung des Heiligen Geistes
  rationale: Die agentive Wiedergabe ist im Deutschen klar und wahrscheinlich, während die Fußnote die formnähere und syntaktisch offenere Genitivwiedergabe dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng an der griechischen Argumentationsstruktur, wird aber durch idiomatische Präpositionen und eine klare deutsche Wortstellung verständlich. „Erbarmen“, „Wiedergeburt“ und „Heiliger Geist“ bewahren das biblisch-theologische Register ohne konfessionelle Zusätze.
