  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: de
  text: in der Hoffnung auf ewiges Leben, das Gott, der nicht lügt, bevor die Zeitalter begannen[a] versprochen hat
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor ewigen Zeiten“. Wörtlich: „vor ewigen beziehungsweise zeitalterlangen Zeiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: in der Hoffnung auf
  rationale: ἐπί mit dem Dativ kann Grundlage, Umstand oder Bezugsrahmen ausdrücken. „In der Hoffnung auf“ ist im Deutschen natürlich und lässt die genaue syntaktische Beziehung zum vorausgehenden Satz offen, ohne sie unnötig kausal festzulegen.
- source_word: ζωῆς αἰωνίου
  choice: ewiges Leben
  rationale: Der Genitiv bezeichnet am natürlichsten den Inhalt beziehungsweise Gegenstand der Hoffnung. „Ewiges Leben“ ist die klare und im Neuen Testament geläufige Wiedergabe.
- source_word: ἣν
  choice: das
  rationale: Das feminine griechische Relativpronomen bezieht sich am natürlichsten auf ζωῆς αἰωνίου. Im Deutschen richtet sich das Relativpronomen nach dem grammatischen Geschlecht von „Leben“ und lautet daher „das“.
- source_word: ἐπηγγείλατο
  choice: versprochen hat
  rationale: Der Aorist von ἐπαγγέλλομαι wird idiomatisch und genau mit „versprochen hat“ wiedergegeben; eine besondere Mittelform-Nuance muss im Deutschen hier nicht eigens ausgedrückt werden.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: Gott, der nicht lügt
  rationale: ἀψευδής bezeichnet jemanden, der nicht lügt beziehungsweise wahrhaftig ist. Der Relativsatz ist natürlich, würdig und verstärkt die Aussage nicht zu „nicht lügen kann“.
- source_word: πρὸ χρόνων αἰωνίων
  choice: vor ewigen Zeiten
  rationale: Diese Wiedergabe bleibt eng bei χρόνοι αἰώνιοι und bewahrt zugleich die ungewöhnliche, spannungsreiche Formulierung. Eine Fußnote erläutert die möglichen idiomatischen Verständnisse.
theological_decisions:
- issue: Zeitangabe πρὸ χρόνων αἰωνίων und Gottes Verheißung
  choice: „vor ewigen Zeiten“ mit erläuternder Fußnote
  alternative: „bevor die Zeitalter begannen“ oder „bevor die Zeit begann“
  rationale: Der Text setzt die Verheißung vor die αἰώνιοι χρόνοι, erklärt aber weder die metaphysische Beschaffenheit dieses Vorher noch, wem die Verheißung gegeben wurde. Die Übersetzung wahrt diese Offenheit.
- issue: Bezeichnung Gottes als ἀψευδής
  choice: „Gott, der nicht lügt“
  alternative: „Gott, der nicht lügen kann“ oder „der wahrhaftige Gott“
  rationale: Die gewählte Fassung gibt die ausdrücklich genannte Wahrhaftigkeit Gottes wieder, ohne das Adjektiv zu einer stärkeren Aussage über Unmöglichkeit auszubauen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Formulierung bleibt als Satzteil eng an Vers 1 angebunden. Die auffällige Zeitangabe wird im Haupttext formal bewahrt und in der Fußnote erklärt.
