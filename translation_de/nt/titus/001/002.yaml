    issue: „vor ewigen Zeiten“ für πρὸ χρόνων αἰωνίων
    rationale: Im modernen Deutsch bezeichnet diese Wendung typischerweise eine sehr weit zurückliegende Zeit innerhalb der Geschichte. Der griechische Ausdruck stellt die Verheißung dagegen vor die „Zeiten/Zeitalter“ und wird treffender mit „bevor die Zeitalter begannen“ wiedergegeben.
