  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: de
  text: Sie müssen zum Schweigen gebracht werden[a], denn sie zerrütten ganze Hausgemeinschaften[b], indem sie lehren, was sie nicht lehren dürfen, um schändlichen Gewinns willen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Man muss ihnen den Mund verschließen.“ Gemeint ist, ihre schädliche Lehre zu unterbinden.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind vermutlich ganze Haushalte mit den darin verbundenen Menschen, nicht bloß Häuser als Gebäude.
    reason: cultural_note
  - marker: c
    text: 'Oder: „aus schmutziger Gewinnsucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: Ihnen muss man den Mund stopfen
  rationale: Die deutsche Wendung gibt das Bild des griechischen Verbs und die aus δεῖ folgende Notwendigkeit unmittelbar wieder, ohne eine bestimmte Zwangsmaßnahme festzulegen.
- source_word: οἵτινες
  choice: denn sie
  rationale: Der Relativanschluss begründet hier, warum diese Menschen zum Schweigen gebracht werden müssen; „denn sie“ ist im Deutschen natürlich und erhält die erklärende Funktion.
- source_word: ὅλους οἴκους
  choice: ganze Hausgemeinschaften
  rationale: οἶκος bezeichnet in diesem Zusammenhang eher die im Haus verbundene soziale Einheit als ein Gebäude. „Hausgemeinschaften“ wahrt diese historische Weite besser als „Häuser“ und legt sich weniger eng als „Familien“ fest.
- source_word: ἀνατρέπουσιν
  choice: bringen … durcheinander
  rationale: Die Formulierung vermittelt das Umstürzen beziehungsweise schwere Zerrütten ganzer Haushalte in verständlichem Gegenwartsdeutsch, ohne vollständige Vernichtung zu behaupten.
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: indem sie … lehren, was sie nicht lehren dürfen
  rationale: Das Partizip wird als Mittel des Zerrüttens verstanden. Die Wiederholung von „lehren“ macht im Deutschen klar, dass sich das Verbot auf den Inhalt ihrer Lehre bezieht.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: um schändlichen Gewinns willen
  rationale: Die Wiedergabe erhält sowohl das Gewinnmotiv als auch dessen ausdrückliche moralische Verurteilung. Die leicht gehobene Fügung passt zum würdigen biblischen Register.
theological_decisions:
- issue: Art des Vorgehens gegen die Irrlehrer
  choice: Ihnen muss man den Mund stopfen
  alternative: Sie müssen zum Schweigen gebracht werden
  rationale: Das griechische Sprachbild wird bewahrt, bezeichnet aber im Zusammenhang das Unterbinden der schädlichen Lehre. Der Text legt nicht fest, mit welchen kirchlichen, sozialen oder anderen Mitteln dies geschehen soll.
- issue: Reichweite von ὅλους οἴκους
  choice: ganze Hausgemeinschaften
  alternative: ganze Familien
  rationale: Die Übersetzung wahrt die Möglichkeit, dass neben der Kernfamilie auch weitere Angehörige und Abhängige eines antiken Haushalts gemeint sind, ohne die soziale Einheit auf das Gebäude zu reduzieren.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Das anschauliche griechische Bild vom Verschließen des Mundes bleibt erhalten; „Hausgemeinschaften“ bildet die antike soziale Bedeutung von οἶκος ab. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Wendungen.
