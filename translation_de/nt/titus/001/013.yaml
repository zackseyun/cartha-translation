id: TIT.1.13
reference: Titus 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: de
  text: Dieses Zeugnis ist wahr. Aus diesem Grund weise sie scharf zurecht, damit sie im Glauben gesund werden[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck kann bedeuten, dass sie in ihrem persönlichen Glauben gesund werden, oder dass sie im christlichen Glauben als Glaubensinhalt fest und unverfälscht werden.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: Zeugnis
  rationale: „Zeugnis“ bewahrt den Aussage- und Beweischarakter der vorangehenden Äußerung über die Kreter besser als das allgemeinere „Aussage“.
- source_word: ἀληθής
  choice: wahr
  rationale: Das prädikative Adjektiv bezeichnet das Zeugnis als der Wirklichkeit entsprechend; „wahr“ ist die direkte und natürliche Wiedergabe.
- source_word: δι’ ἣν αἰτίαν
  choice: Aus diesem Grund
  rationale: Die Wendung zieht eine Folgerung aus der vorangehenden Feststellung und wird so in natürlichem modernem Deutsch wiedergegeben.
- source_word: ἔλεγχε
  choice: weise … zurecht
  rationale: Der Präsensimperativ fordert zu fortgesetzter, direkter Konfrontation und Korrektur auf. „Zurechtweisen“ gibt diese Kraft wieder, ohne unnötig strafend zu klingen.
- source_word: ἀποτόμως
  choice: scharf
  rationale: Das Adverb bezeichnet eine entschiedene, strenge Art des Zurechtweisens; „scharf“ wahrt die Stärke und ist idiomatisch.
- source_word: ὑγιαίνωσιν
  choice: gesund sind
  rationale: Die Wiedergabe bewahrt das Gesundheitsbild des griechischen Verbs, das hier bildlich geistliche beziehungsweise lehrmäßige Unversehrtheit bezeichnet.
- source_word: ἐν τῇ πίστει
  choice: im Glauben
  rationale: Die deutsche Formulierung lässt wie das Griechische offen, ob der persönliche Glaube oder der christliche Glaube als Glaubensinhalt gemeint ist.
theological_decisions:
- issue: Bedeutung von ἐν τῇ πίστει
  choice: im Glauben
  alternative: in ihrem Glauben; im christlichen Glauben
  rationale: Der griechische Ausdruck kann sowohl die Gesundheit ihres Glaubens als auch ihre Unversehrtheit im christlichen Glauben als Glaubensinhalt bezeichnen. Die Hauptfassung bewahrt diese echte Mehrdeutigkeit, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Gesundheitsbild von ὑγιαίνωσιν und die Mehrdeutigkeit von ἐν τῇ πίστει bleiben erhalten. Das abschließende Komma folgt dem überlieferten Versanschluss und signalisiert, dass der Satz in Vers 14 weitergeht.
