  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: de
  text: 'Einer von ihnen, ihr eigener Prophet, sagte: »Kreter sind immer Lügner, böse Tiere, faule Bäuche[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »faule Fresser«; wörtlich: »faule Bäuche«.'
    reason: Die Metapher γαστέρες ἀργαί bezeichnet Menschen, die auf Essen aus sind, aber Mühe und Arbeit scheuen; die Fußnote nennt die idiomatische Bedeutung.
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Einer von ihnen ... sagte
  rationale: Die Wiedergabe bewahrt sowohl den indefiniten Charakter von τις als auch den partitiven Sinn von ἐξ αὐτῶν und klingt im Deutschen natürlich.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: ihr eigener Prophet
  rationale: ἴδιος betont, dass der zitierte Prophet zu den Kretern selbst gehört; die knappe Formulierung folgt der griechischen Struktur.
- source_word: Κρῆτες ἀεὶ ψεῦσται
  choice: Kreter sind immer Lügner
  rationale: Die direkte Wiedergabe erhält die pauschale und zugespitzte Form des zitierten Ausspruchs, ohne sie abzuschwächen oder auszuweiten.
- source_word: κακὰ θηρία
  choice: böse Tiere
  rationale: Die Formulierung bewahrt das konkrete Tierbild von θηρία und die moralische Wertung durch κακά.
- source_word: γαστέρες ἀργαί
  choice: faule Bäuche
  rationale: Die wörtliche Metapher ist auch im Deutschen verständlich, bewahrt die schroffe Bildsprache und vermeidet die interpretierende Einengung auf bloße Gefräßigkeit.
theological_decisions:
- issue: Wiedergabe eines pauschalen negativen Ausspruchs über die Kreter
  choice: Den Ausspruch als direktes Zitat ungemildert wiedergeben
  alternative: Die ethnische Verallgemeinerung durch eine erklärende oder abschwächende Paraphrase begrenzen
  rationale: Der griechische Text kennzeichnet die Worte ausdrücklich als Ausspruch eines eigenen Propheten der Kreter. Die Übersetzung sollte die Härte und Spannung des Zitats bewahren, ohne im Vers selbst eine Deutung über seine Reichweite einzufügen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die direkte, harte Bildsprache des griechischen Zitats bleibt erhalten. Deutsche Anführungszeichen markieren deutlich, dass Paulus hier einen Ausspruch zitiert.
