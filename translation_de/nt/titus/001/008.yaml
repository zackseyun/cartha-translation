    text: 'Im Griechischen stehen hier zwei verwandte Tugendbegriffe: σώφρονα bezeichnet vernünftige Besonnenheit und maßvolles Verhalten, ἐγκρατῆ die Herrschaft über die eigenen Begierden und Impulse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Die Konjunktion stellt die geforderten positiven Eigenschaften den negativen Merkmalen des vorherigen Verses gegenüber. Nach der vorausgehenden Verneinung gibt „sondern“ diesen Gegensatz im Deutschen präzise wieder.
- source_word: φιλόξενον
  choice: gastfreundlich
  rationale: Das Adjektiv bezeichnet die Bereitschaft, Gäste und Fremde willkommen zu heißen. „Gastfreundlich“ ist die natürliche und inhaltlich genaue deutsche Entsprechung.
- source_word: φιλάγαθον
  choice: das Gute liebend
  rationale: Das zusammengesetzte Adjektiv bezeichnet jemanden, der das Gute liebt oder ihm zugetan ist. Die Formulierung bewahrt den Gegenstand dieser Liebe und fügt keine nähere Bestimmung hinzu.
- source_word: σώφρονα
  choice: besonnen
  rationale: Der Ausdruck umfasst vernünftige Selbstbeherrschung, maßvolles Urteilen und einen gesunden Sinn. „Besonnen“ bewahrt diesen Schwerpunkt und unterscheidet das Wort von ἐγκρατῆ.
- source_word: δίκαιον
  choice: gerecht
  rationale: In der Tugendliste bezeichnet das Wort ein Verhalten, das dem Rechten entspricht. „Gerecht“ ist die direkte, verständliche Wiedergabe und lässt sowohl zwischenmenschliche als auch moralische Bezüge offen.
- source_word: ὅσιον
  choice: heilig
  rationale: Das Wort bezeichnet eine Haltung und Lebensführung, die dem Heiligen entspricht und von Frömmigkeit geprägt ist. „Heilig“ bewahrt das religiöse Gewicht des griechischen Ausdrucks.
- source_word: ἐγκρατῆ
  choice: selbstbeherrscht
  rationale: Das Adjektiv betont die Herrschaft über eigene Begierden und Impulse. „Selbstbeherrscht“ gibt diesen Schwerpunkt klar wieder, während σώφρονα mit „besonnen“ wiedergegeben wird.
theological_decisions:
- issue: Unterscheidung der verwandten Tugenden σώφρονα und ἐγκρατῆ
  choice: σώφρονα mit „besonnen“ und ἐγκρατῆ mit „selbstbeherrscht“ wiedergeben
  alternative: Beide Begriffe mit nahezu gleichbedeutenden Ausdrücken aus dem Bereich der Selbstbeherrschung wiedergeben
  rationale: 'Die beiden griechischen Wörter überschneiden sich, setzen aber unterschiedliche Akzente: σώφρονα hebt vernünftige Besonnenheit und Maß hervor, ἐγκρατῆ die Herrschaft über sich selbst. Die gewählte Wiedergabe erhält diese Spannung, ohne einen scharfen Gegensatz zu behaupten.'
- issue: Bedeutungsumfang von ὅσιον
  choice: „heilig“
  alternative: „fromm“ oder „Gott ergeben“
  rationale: „Heilig“ erhält die sakrale und ethische Dimension des Ausdrucks. „Fromm“ könnte im heutigen Deutsch missverständlich oder abwertend klingen; „Gott ergeben“ würde den impliziten religiösen Bezug ausdrücklich ausformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Reihung von Eigenschaften wird beibehalten; die inhaltliche Nähe von „besonnen“ und „selbstbeherrscht“ wird nicht eingeebnet.
