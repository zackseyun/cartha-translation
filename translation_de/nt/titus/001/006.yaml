source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: de
  text: wenn jemand untadelig ist, Mann einer einzigen Frau, mit treuen[a] Kindern, die weder eines ausschweifenden Lebens beschuldigt werden noch widerspenstig sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gläubigen“. Das griechische Wort kann „treu“ oder „gläubig“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: untadelig
  rationale: Bezeichnet jemanden, gegen den kein berechtigter Vorwurf erhoben werden kann; „untadelig“ ist in einer Aufzählung von Eignungsvoraussetzungen natürlich, ohne völlige Sündlosigkeit zu behaupten.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: Mann einer einzigen Frau
  rationale: Gibt die männlich formulierte griechische Wendung transparent wieder und lässt ihre umstrittene genaue Tragweite offen.
- source_word: τέκνα
  choice: Kinder
  rationale: Die übliche und natürliche deutsche Entsprechung im Zusammenhang mit einem Haushalt.
- source_word: πιστά
  choice: treu
  rationale: πιστά kann hier „treu/zuverlässig“ oder „gläubig“ bedeuten. Der Haupttext verwendet die weitere Bedeutung; die andere Möglichkeit steht in der Fußnote.
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: denen ausschweifendes Leben vorgeworfen wird
  rationale: Bewahrt sowohl den Anklage- beziehungsweise Vorwurfsaspekt von κατηγορία als auch die Bedeutung eines zügellosen, verschwenderischen Lebenswandels in ἀσωτία.
- source_word: ἀνυπότακτα
  choice: Ungehorsam
  rationale: Bezeichnet fehlende Unterordnung beziehungsweise Widersetzlichkeit; die substantivische Form fügt sich natürlich in die koordinierte deutsche Satzstruktur ein.
theological_decisions:
- issue: Bedeutung von πιστά in τέκνα ἔχων πιστά
  choice: treue Kinder
  alternative: gläubige Kinder
  rationale: Das Adjektiv ist im Kontext echt mehrdeutig zwischen charakterlicher Treue beziehungsweise Zuverlässigkeit und christlichem Glauben. Die Fußnote erhält die theologisch bedeutsame Alternative.
- issue: Tragweite von μιᾶς γυναικὸς ἀνήρ
  choice: Mann einer einzigen Frau
  alternative: ein Mann, der seiner Frau treu ist
  rationale: Die transparente Wiedergabe vermeidet es, die Wendung ausschließlich auf Familienstand, sexuelle Treue, Wiederheirat oder eine andere konfessionell umstrittene Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt wegen des syntaktischen Anschlusses an den vorausgehenden Vers kleingeschrieben und als Bedingungssatz offen. Die männlich-spezifische Form des griechischen Textes wird beibehalten; echte lexikalische und theologische Mehrdeutigkeit wird nicht eingeebnet.
