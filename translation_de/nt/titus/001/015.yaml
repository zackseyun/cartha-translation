id: TIT.1.15
reference: Titus 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: de
  text: Für die Reinen ist alles rein; für die jedoch, die befleckt und ungläubig sind, ist nichts rein.[a] Vielmehr sind sowohl ihr Denken als auch ihr Gewissen befleckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rein“ kann hier sowohl rituelle als auch moralische Reinheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural hat umfassenden Sinn; „alles“ gibt die knappe, sprichwortartige Form im Deutschen natürlich wieder.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: rein / die Reinen
  rationale: „Rein“ kann im Deutschen wie καθαρός sowohl kultisch-rituelle als auch moralische Bedeutungsanteile tragen und bewahrt die Wiederholung des griechischen Wortstamms.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: für die jedoch, die befleckt … sind
  rationale: Das Perfektpartizip bezeichnet einen aus vorausgegangener Verunreinigung hervorgegangenen Zustand; „befleckt sind“ erhält diesen Zustandscharakter und die Verbindung zum späteren μεμίανται.
- source_word: ἀπίστοις
  choice: ungläubig
  rationale: Im Kontext bezeichnet das Wort Menschen ohne echten Glauben; „ungläubig“ ist die klare und sachlich passende Wiedergabe.
- source_word: οὐδὲν καθαρόν
  choice: ist nichts rein
  rationale: Die Formulierung spiegelt den ersten Satzteil und erhält die durchgehende Reinheitsterminologie.
- source_word: ἀλλὰ
  choice: Vielmehr
  rationale: „Vielmehr“ kennzeichnet den starken Gegensatz und lenkt auf den eigentlichen inneren Zustand der Betroffenen.
- source_word: μεμίανται
  choice: sind … befleckt
  rationale: Die Perfektform hebt den bestehenden Zustand als Ergebnis einer Verunreinigung hervor; die gleiche Wortwahl wie beim Partizip bildet die Wiederholung des Griechischen ab.
- source_word: νοῦς
  choice: Denken
  rationale: „Denken“ bezeichnet hier natürlich das innere Wahrnehmungs- und Urteilsvermögen; „Verstand“ wäre ebenfalls möglich, könnte aber stärker die intellektuelle Fähigkeit betonen.
- source_word: συνείδησις
  choice: Gewissen
  rationale: „Gewissen“ ist die übliche deutsche Wiedergabe für das moralische Selbstbewusstsein und Urteilsvermögen.
- source_word: καὶ ... καὶ
  choice: sowohl … als auch
  rationale: Die korrelative Fügung bringt die Betonung beider betroffener innerer Bereiche idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bedeutungsumfang der Reinheitssprache
  choice: καθαρός wird durchgehend mit „rein“ wiedergegeben, sodass rituelle und moralische Bedeutungsanteile offenbleiben.
  alternative: „Sauber“ oder eine ausdrücklich kultische Formulierung wie „kultisch rein“, wodurch jeweils eine Bedeutungsseite stärker festgelegt würde.
  rationale: Der Zusammenhang berührt Reinheitsvorschriften und jüdische Gebote, doch die Aussage erstreckt sich zugleich auf Denken und Gewissen. „Rein“ bewahrt diese Spannung, ohne sie auf Zeremonialvorschriften oder ausschließlich moralische Reinheit zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, sprichwortartiger Satzführung. Die wiederholten Wörter „rein“ und „befleckt“ bilden die bewussten lexikalischen Wiederholungen des griechischen Textes ab.
