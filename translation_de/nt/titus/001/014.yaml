id: TIT.1.14
reference: Titus 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: de
  text: und nicht auf jüdische Mythen und Gebote von Menschen achten, die sich von der Wahrheit abwenden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sich nicht jüdischen Mythen und menschlichen Geboten von Leuten widmen, die sich von der Wahrheit abwenden.“'
    reason: Lexikalische Alternative für προσέχω und kompaktere Wiedergabe von ἐντολαῖς ἀνθρώπων.
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: und nicht … achten
  rationale: Das verneinte Präsenspartizip führt die vorherige Ermahnung weiter. „Auf etwas achten“ gibt die bewusste Hinwendung zu etwas natürlich und quellennah wieder.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: jüdische Mythen
  rationale: μῦθος bezeichnet erfundene Erzählungen oder Legenden; „Mythen“ ist im heutigen Deutsch klar und bewahrt die jüdische Prägung oder Herkunft, die das Adjektiv bezeichnet.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: Gebote von Menschen
  rationale: Die Formulierung bleibt nahe am griechischen Genitiv und kennzeichnet die Gebote als menschlichen Ursprungs, ohne eine unnötig männlich verengte Bezeichnung zu verwenden.
- source_word: ἀποστρεφομένων
  choice: die sich … abwenden
  rationale: Das reflexive „sich abwenden“ bewahrt das Richtungsbild des Verbs und stimmt als Genitiv Plural am natürlichsten mit ἀνθρώπων überein.
- source_word: τὴν ἀλήθειαν
  choice: der Wahrheit
  rationale: Die übliche Wiedergabe lässt offen, in welchem Umfang hier besonders die Wahrheit des Evangeliums gemeint ist.
theological_decisions:
- issue: Bezug des Genitivpartizips ἀποστρεφομένων
  choice: 'Das Partizip bezieht sich auf „Menschen“: „Gebote von Menschen, die sich von der Wahrheit abwenden“.'
  alternative: Das Partizip kann lockerer auf die Urheber beziehungsweise Vertreter sowohl der Mythen als auch der Gebote bezogen werden.
  rationale: Die nächstliegende grammatische Verbindung besteht zum unmittelbar vorausgehenden ἀνθρώπων, das ebenfalls im Genitiv Plural steht. Die Übersetzung folgt dieser Lesart, ohne weitere Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanschluss mit „und“ macht deutlich, dass der Vers syntaktisch die vorausgehende Ermahnung fortsetzt; „Mythen“ und „Gebote“ sind allgemein verständlich und zugleich quellennah.
