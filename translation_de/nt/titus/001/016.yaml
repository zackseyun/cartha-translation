base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: de
  text: Sie behaupten, Gott zu kennen[a], doch durch ihre Taten verleugnen sie ihn[b]. Sie sind verabscheuungswürdig[c] und ungehorsam und für jedes gute Werk ungeeignet[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie bekennen, Gott zu kennen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »doch mit ihren Werken verleugnen sie ihn.«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »abscheulich.«'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »für jedes gute Werk untauglich«; das griechische Wort kann jemanden bezeichnen, der sich bei einer Prüfung nicht bewährt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Gott
  rationale: Direktes Objekt des behaupteten Kennens; die übliche und eindeutige Wiedergabe.
- source_word: ὁμολογοῦσιν
  choice: sie behaupten
  rationale: Im Kontrast zu ihrem Verhalten bezeichnet das Verb hier ein offenes Bekenntnis beziehungsweise eine Aussage, deren Wahrheitsgehalt durch die Taten infrage gestellt wird. »Behaupten« gibt diesen Zusammenhang in heutigem Deutsch natürlich wieder.
- source_word: εἰδέναι
  choice: zu kennen
  rationale: Der Infinitiv bezeichnet die von ihnen beanspruchte Kenntnis Gottes.
- source_word: τοῖς δὲ ἔργοις
  choice: doch durch ihre Taten
  rationale: Der Dativ kann Mittel oder Hinsicht ausdrücken. »Durch ihre Taten« macht deutlich, dass ihr Handeln die Weise ist, in der sie Gott verleugnen; »doch« wahrt den starken Gegensatz.
- source_word: ἀρνοῦνται
  choice: verleugnen sie ihn
  rationale: Das im ersten Satzteil genannte Objekt »Gott« wird sinngemäß weitergeführt. »Verleugnen« bewahrt den starken Gegensatz zwischen mündlichem Bekenntnis und praktischem Verhalten.
- source_word: βδελυκτοὶ
  choice: verabscheuungswürdig
  rationale: Das Wort bezeichnet starke moralische Abscheu. Die gewählte Form ist deutlich und würdevoll, ohne unnötig altertümlich zu klingen.
- source_word: ὄντες
  choice: Sie sind
  rationale: Das Partizip wird für natürliches Deutsch als neuer Hauptsatz wiedergegeben und leitet die drei Charakterisierungen ein.
- source_word: ἀπειθεῖς
  choice: ungehorsam
  rationale: Im ethischen Zusammenhang bezeichnet das Wort die Weigerung, zu gehorchen, nicht bloß mangelnde Überzeugtheit.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: für jedes gute Werk
  rationale: πρός mit Akkusativ beschreibt hier die Eignung beziehungsweise Beziehung zu jeder guten Handlung.
- source_word: ἀδόκιμοι
  choice: ungeeignet
  rationale: Das Wort bezeichnet Personen, die einer Prüfung nicht standhalten und daher für den genannten Zweck nicht taugen. »Ungeeignet« ist im modernen Deutsch klar; die Fußnote nennt die stärker prüfungsbezogene Alternative.
theological_decisions:
- issue: Verhältnis zwischen verbalem Bekenntnis und praktischer Verleugnung
  choice: Die Menschen erklären, Gott zu kennen, verleugnen ihn jedoch durch ihr tatsächliches Verhalten.
  alternative: Die Verleugnung könnte allgemeiner als Verwerfung der Wahrheit Gottes verstanden werden.
  rationale: »Gott« ist im ersten Satzteil ausdrücklich das Objekt und wird im zweiten natürlich als Objekt von »verleugnen« mitverstanden. Die Übersetzung bewahrt die Spannung zwischen Anspruch und Lebensführung, ohne sie dogmatisch auszuweiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der lange griechische Satz wird nach »ihn« geteilt, ohne die logische Verbindung der drei abschließenden Prädikate zu verändern. Die Wortwahl vermeidet konfessionelle Zusätze und erhält die Schärfe des Urteils.
