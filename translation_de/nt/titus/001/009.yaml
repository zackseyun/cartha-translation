  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: de
  text: Er muss an dem zuverlässigen Wort festhalten, das der Lehre entspricht[a], damit er sowohl durch die gesunde Lehre ermahnen als auch die, die widersprechen, zurechtweisen kann[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „an dem treuen Wort gemäß der Lehre festhalten“. Das griechische πιστός kann „zuverlässig“ oder „treu“ bedeuten; κατὰ τὴν διδαχήν bezeichnet Übereinstimmung mit der Lehre.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „widerlegen“. Das griechische Verb kann sowohl das Zurechtweisen als auch das Aufdecken oder Erweisen eines Irrtums bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: festhalten
  rationale: Das Partizip bezeichnet beharrliches, entschiedenes Festhalten. Die deutsche Wendung „an … festhalten“ gibt dies natürlich wieder.
- source_word: πιστοῦ λόγου
  choice: dem zuverlässigen Wort
  rationale: πιστός bezeichnet hier am ehesten die Verlässlichkeit der Botschaft. λόγος wird mit „Wort“ wiedergegeben, ohne es auf eine bloße Äußerung zu verengen.
- source_word: κατὰ τὴν διδαχήν
  choice: das der Lehre entspricht
  rationale: κατά mit Akkusativ bezeichnet Übereinstimmung oder Maßgabe. Der Relativsatz macht im Deutschen klar und natürlich, dass das Wort mit der anerkannten Lehre übereinstimmt.
- source_word: δυνατὸς ᾖ
  choice: damit er fähig ist
  rationale: Die Formulierung bewahrt den Zweck der ἵνα-Konstruktion und bezeichnet die erforderliche Befähigung.
- source_word: παρακαλεῖν
  choice: zu ermahnen
  rationale: Im Zusammenhang mit verantwortlicher Unterweisung umfasst παρακαλέω nachdrückliches Zusprechen und Ermahnen; „ermahnen“ wahrt hier die autoritative pastorale Färbung.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: durch die gesunde Lehre
  rationale: „Gesund“ bewahrt die Metapher von ὑγιαίνω. „Durch“ gibt den instrumentalen Sinn von ἐν in diesem Zusammenhang idiomatisch wieder.
- source_word: τοὺς ἀντιλέγοντας
  choice: die, die widersprechen
  rationale: Die Wendung bezeichnet Personen, die gegen die Lehre reden. Da das griechische Objekt unausgesprochen bleibt, wird auch im Haupttext kein ausdrückliches Objekt ergänzt.
- source_word: ἐλέγχειν
  choice: zurechtzuweisen
  rationale: ἐλέγχω kann das Aufdecken eines Irrtums, das Überführen, Widerlegen und Zurechtweisen umfassen. „Zurechtweisen“ bewahrt die korrigierende Kraft; die argumentative Nuance wird in einer Fußnote genannt.
theological_decisions:
- issue: Bezug von „der Lehre“ und „dem zuverlässigen Wort“
  choice: Die Formulierung bezeichnet eine anerkannte christliche Lehrüberlieferung, an der ein Gemeindeleiter festhalten soll.
  alternative: Allgemeine moralische Unterweisung oder die persönliche Auffassung des Leiters.
  rationale: Der Artikel bei διδαχή und die Verbindung mit πιστὸς λόγος sprechen für einen bestimmten, bereits vermittelten Lehrinhalt. Die Übersetzung macht dessen Verbindlichkeit sichtbar, ohne spätere dogmatische Fachbegriffe einzutragen.
- issue: Bedeutungsumfang von ἐλέγχειν gegenüber Widersprechenden
  choice: „zurechtzuweisen“ betont die korrigierende und pastorale Handlung.
  alternative: „zu widerlegen“ betont stärker das argumentative Erweisen des Irrtums.
  rationale: Der Kontext umfasst sowohl lehrmäßige Gegenrede als auch deren Korrektur. Der Haupttext wahrt die persönliche, korrigierende Komponente; die Fußnote erhält die sachlich-argumentative Alternative.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. „Gesunde Lehre“ bewahrt die anschauliche griechische Metapher und ist zugleich allgemein verständlich. Der Satzbau folgt der logischen Bewegung des griechischen Textes: Festhalten am Wort als Voraussetzung für ermahnende Unterweisung und korrigierende Auseinandersetzung.'
