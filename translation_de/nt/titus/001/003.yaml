id: TIT.1.3
reference: Titus 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: de
  text: doch zu den von ihm bestimmten Zeiten offenbarte er sein Wort durch die Verkündigung, die mir anvertraut wurde[a], gemäß dem Auftrag Gottes, unseres Retters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Relativpronomen kann auch auf »sein Wort« bezogen werden: »sein Wort …, das mir anvertraut wurde«. Das griechische Wort für »Verkündigung« kann sowohl das Verkündigen als auch die verkündigte Botschaft bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: offenbarte er
  rationale: Der Aorist bezeichnet, dass Gott sein zuvor verborgenes Wort öffentlich bekannt machte; „offenbaren“ ist präzise und im modernen theologischen Deutsch verständlich.
- source_word: καιροῖς ἰδίοις
  choice: zu den von ihm bestimmten Zeiten
  rationale: Die Wiedergabe wahrt den Bezug der „eigenen Zeiten“ auf Gott und macht zugleich den idiomatischen Sinn göttlich festgesetzter Zeitpunkte natürlich verständlich.
- source_word: τὸν λόγον αὐτοῦ
  choice: sein Wort
  rationale: „Wort“ erhält die lexikalische und theologische Weite von λόγος, das hier Gottes mitgeteilte Botschaft bezeichnet.
- source_word: ἐν κηρύγματι
  choice: durch die Verkündigung
  rationale: Das instrumentale ἐν wird mit „durch“ wiedergegeben; „Verkündigung“ kann sowohl den Vorgang als auch den verkündigten Inhalt bezeichnen.
- source_word: ὃ ἐπιστεύθην ἐγώ
  choice: mit der ich betraut wurde
  rationale: Das neutrale Relativpronomen wird syntaktisch am naheliegendsten auf κήρυγμα bezogen; die passive Form bezeichnet das Anvertrauen einer Aufgabe oder Botschaft, nicht Glauben.
- source_word: κατ’ ἐπιταγὴν
  choice: gemäß dem Auftrag
  rationale: κατά mit Akkusativ bezeichnet hier Übereinstimmung mit beziehungsweise Grundlage in einer autoritativen Weisung; „Auftrag“ passt zugleich natürlich zur Beauftragung des Paulus.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Gottes, unseres Retters
  rationale: Die Apposition bewahrt die ausdrückliche Bezeichnung Gottes als Retter und ergibt eine klare deutsche Wortstellung.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐφανέρωσεν und Sinn von καιροῖς ἰδίοις
  choice: Gott ist das Subjekt und offenbart zu den von ihm bestimmten Zeiten.
  alternative: 'Unpersönlich: „zur rechten Zeit wurde es offenbart“.'
  rationale: Der vorausgehende Zusammenhang nennt Gott als denjenigen, der verheißen hat; das persönliche Subjekt und der possessive Gehalt von ἰδίοις bleiben so erhalten.
- issue: Bezugswort des Relativpronomens ὃ
  choice: Das Relativpronomen bezieht sich auf „die Verkündigung“.
  alternative: 'Es kann auf „sein Wort“ bezogen werden: „sein Wort …, mit dem ich betraut wurde“.'
  rationale: κήρυγμα ist das nächstliegende neutrale Bezugswort. Da λόγον ebenfalls Neutrum Singular ist, bleibt die andere syntaktische Zuordnung jedoch echt möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu den von ihm bestimmten Zeiten“ ist natürlicher als das wörtliche „zu seinen eigenen Zeiten“, ohne den Gottesbezug aufzugeben. „Auftrag“ vermeidet einen unnötig gesetzlichen Klang und gibt die autoritative Beauftragung idiomatisch wieder.
