id: TIT.1.5
reference: Titus 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: de
  text: Aus diesem Grund habe ich dich auf Kreta zurückgelassen, damit du in Ordnung bringst, was noch ausstand,[a] und in jeder Stadt[b] Älteste einsetzt, wie ich es dir aufgetragen habe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was noch fehlte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Stadt für Stadt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie ich es dir befohlen habe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Aus diesem Grund
  rationale: Die geläufige deutsche Wendung gibt die begründende Funktion der griechischen Präpositionalkonstruktion klar wieder.
- source_word: ἀπέλιπόν
  choice: habe ich … zurückgelassen
  rationale: Das Perfekt ist im Deutschen für den vergangenen, für Titus weiterhin maßgeblichen Vorgang natürlich; „zurückgelassen“ bildet ἀπολείπω genauer ab als das missverständliche bloße „gelassen“.
- source_word: ἐν Κρήτῃ
  choice: auf Kreta
  rationale: Bei Inselnamen ist im Deutschen die Präposition „auf“ die natürliche Ortsangabe.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ drückt den Zweck der Beauftragung prägnant und idiomatisch aus.
- source_word: τὰ λείποντα
  choice: was noch ausstand
  rationale: Die Formulierung bewahrt den Gedanken noch unerledigter oder fehlender Dinge, ohne vorschnell festzulegen, ob organisatorische Aufgaben oder konkrete Mängel gemeint sind.
- source_word: ἐπιδιορθώσῃ
  choice: in Ordnung bringst
  rationale: Die Wendung umfasst sowohl das Ordnen als auch das Beheben noch bestehender Unzulänglichkeiten und klingt in modernem Deutsch natürlich.
- source_word: καταστήσῃς
  choice: einsetzt
  rationale: Im Zusammenhang bezeichnet das Verb die Bestellung von Personen für eine anerkannte Aufgabe; „einsetzt“ ist klar, ohne ein späteres formales Amtsverfahren vorauszusetzen.
- source_word: κατὰ πόλιν
  choice: in jeder Stadt
  rationale: Die Formulierung gibt den distributiven Sinn von κατά mit Singular verständlich wieder; die wörtlichere Alternative wird in der Fußnote erhalten.
- source_word: πρεσβυτέρους
  choice: Älteste
  rationale: Hier bezeichnet der Ausdruck anerkannte Gemeindeleiter und nicht bloß ältere Männer. „Älteste“ ist verständlich und legt keine spätere konfessionelle Amtsordnung fest.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: wie ich es dir aufgetragen habe
  rationale: „Aufgetragen“ bewahrt den verbindlichen und autoritativen Charakter der Anweisung, ohne den Ton unnötig zu verschärfen.
theological_decisions:
- issue: Bezeichnung des gemeindlichen Leitungsdienstes mit πρεσβυτέρους
  choice: Älteste
  alternative: Presbyter; ältere Männer
  rationale: Der Kontext spricht von eingesetzten Gemeindeleitern. „Älteste“ gibt diese Funktion wieder, ohne eine spätere konfessionelle Amtsstruktur in den Text einzutragen.
- issue: Stärke von διεταξάμην
  choice: wie ich es dir aufgetragen habe
  alternative: wie ich es dir befohlen habe; wie ich dich angewiesen habe
  rationale: Das Verb bezeichnet eine verbindliche Anordnung. „Aufgetragen“ wahrt die Autorität des Sprechers und lässt zugleich die im Griechischen mögliche Spannweite des Tons bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Übersetzung bleibt nahe an der griechischen Struktur, verwendet aber idiomatische deutsche Wendungen. Sie vermeidet konfessionell festgelegte Amtsbegriffe und bewahrt die Bedeutungsbreite bei den noch ausstehenden Dingen sowie bei der Autorität der Anweisung.
