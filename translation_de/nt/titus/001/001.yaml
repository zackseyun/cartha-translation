id: TIT.1.1
reference: Titus 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: de
  text: Paulus, ein Sklave Gottes und Apostel Jesu, des Messias, für den Glauben der von Gott Erwählten[a] und für die Erkenntnis[b] der Wahrheit, die der Gottesfurcht entspricht[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Auserwählten Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für die volle Erkenntnis der Wahrheit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die zur Gottesfurcht führt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet Zugehörigkeit und Unterordnung und drückt hier Paulus’ vollständige Bindung an Gott stärker aus als das allgemeinere „Diener“.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: „Apostel“ ist im Deutschen die etablierte und präzise Bezeichnung für das von Jesus verliehene Sendungsamt des Paulus.
- source_word: δὲ
  choice: und
  rationale: δέ führt hier ohne deutlichen Gegensatz eine zweite Selbstbezeichnung an; „und“ gibt diese verbindende Funktion natürlich wieder.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird als Titel wiedergegeben. Die Apposition „des Messias“ macht dies in idiomatischem Deutsch deutlich.
- source_word: κατὰ
  choice: für
  rationale: κατά bezeichnet hier wahrscheinlich die Ausrichtung beziehungsweise den Zweck des Apostelamts. „Für“ gibt diese missionale Orientierung knapp wieder, ohne die syntaktische Offenheit ganz aufzuheben.
- source_word: πίστιν
  choice: Glauben
  rationale: Im Zusammenhang bezeichnet πίστις am ehesten den Glauben beziehungsweise das Vertrauen der von Gott Erwählten.
- source_word: ἐκλεκτῶν θεοῦ
  choice: der von Gott Erwählten
  rationale: Die Formulierung bewahrt die Aussage göttlicher Erwählung, ohne sie durch ein bestimmtes theologisches System näher festzulegen.
- source_word: ἐπίγνωσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt das bewusste Erfassen der Wahrheit angemessen wieder; eine mögliche verstärkende Bedeutung wird in der Fußnote genannt.
- source_word: ἀληθείας
  choice: der Wahrheit
  rationale: Der bestimmte Ausdruck verweist auf die Wahrheit als erkannten Inhalt, nicht lediglich auf Wahrhaftigkeit im Allgemeinen.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: die der Gottesfurcht entspricht
  rationale: Die Wiedergabe lässt die durch κατά bezeichnete Entsprechung zwischen Wahrheit und gottesfürchtigem Leben bestehen, ohne zwingend eine kausale Beziehung festzulegen.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: „Gottesfurcht“ bezeichnet eine ehrfürchtige, am Verhältnis zu Gott ausgerichtete Lebenshaltung und ist im Deutschen verständlich und würdevoll.
theological_decisions:
- issue: Wiedergabe von ἐκλεκτῶν θεοῦ
  choice: der von Gott Erwählten
  alternative: der Auserwählten Gottes
  rationale: Beide Formulierungen benennen Gottes Erwählung. Die Hauptfassung klingt im modernen Deutsch natürlicher und vermeidet, über die Aussage des Textes hinaus ein bestimmtes Lehrsystem vorauszusetzen.
- issue: Beziehung von κατὰ zu πίστιν und ἐπίγνωσιν
  choice: für den Glauben ... und für die Erkenntnis
  alternative: gemäß dem Glauben ... und der Erkenntnis
  rationale: Die gedrängte Konstruktion kann Maßstab, Bezug oder Zielrichtung ausdrücken. „Für“ folgt der wahrscheinlich gemeinten Ausrichtung des apostolischen Auftrags, ohne daraus eine engere dogmatische Aussage zu machen.
- issue: Beziehung zwischen Wahrheit und εὐσέβεια
  choice: die der Gottesfurcht entspricht
  alternative: die zur Gottesfurcht führt
  rationale: κατά kann eine Entsprechung ausdrücken; eine Ziel- oder Wirkungsbeziehung ist ebenfalls möglich. Die Hauptfassung bewahrt die weniger festlegende Lesart, die Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst starke Bezeichnung „Sklave Gottes“ bewahrt die Aussage vollständiger Zugehörigkeit. Der fortführende Satzbau und das abschließende Komma entsprechen dem Umstand, dass Titus 1,1 syntaktisch in den folgenden Versen weitergeht.
