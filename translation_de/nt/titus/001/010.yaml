  source_fidelity: Die Grundbedeutung wird getroffen. Die drei griechischen Personenbezeichnungen (ἀνυπότακτοι, ματαιολόγοι, φρεναπάται) werden im Entwurf jedoch zu einer Reihe von Handlungen umgeformt; dadurch klingt es, als müssten alle Genannten jeweils alle drei Tätigkeiten ausüben. Eine parallele Reihe von Personenbezeichnungen bildet den griechischen Satzbau und die Charakterisierung genauer ab.
  naturalness: „die aus der Beschneidung“ ist als bewusst knappe, biblisch geprägte Gruppenbezeichnung verständlich; die Fußnote erleichtert das Verständnis. Die nominale Reihung „Aufsässige, Schwätzer und Verführer“ ist im modernen Standarddeutsch klarer und rhythmisch näher am Ausgangstext als die Relativsatz- und Verbkonstruktion.
  terminology: „Aufsässige“ gibt ἀνυπότακτοι als Personen wieder, die sich nicht unterordnen. „Schwätzer“ gibt ματαιολόγοι idiomatisch wieder; „Verführer“ wahrt bei φρεναπάται stärker als „andere täuschen“ den Charakter einer Personenbezeichnung. Die zurückhaltende Wiedergabe von οἱ ἐκ τῆς περιτομῆς und die nicht festlegende Fußnote bewahren die historische Offenheit.
