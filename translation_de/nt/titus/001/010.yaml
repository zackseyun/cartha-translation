  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: de
  text: Denn es gibt viele Aufsässige, Schwätzer und Verführer, besonders die aus der Beschneidung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die zur Beschneidungsgruppe gehören«. Gemeint sind wahrscheinlich jüdische oder judaisierende Gegner; der griechische Ausdruck ist jedoch weniger eindeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet die Begründung für die vorhergehende Anweisung und stellt den Zusammenhang im Deutschen natürlich her.
- source_word: πολλοὶ καὶ ἀνυπότακτοι
  choice: viele, die sich nicht unterordnen
  rationale: Die substantivisch gebrauchte Personenbezeichnung wird idiomatisch mit einem Relativsatz wiedergegeben; ἀνυπότακτοι bezeichnet Menschen, die sich der gebotenen Ordnung oder Autorität nicht fügen.
- source_word: ματαιολόγοι
  choice: leeres Gerede verbreiten
  rationale: Gibt die Bezeichnung für Menschen wieder, deren Reden gehaltlos, nutzlos oder nichtig ist; die verbale Form fügt sich natürlich in die deutsche Satzreihe ein.
- source_word: φρεναπάται
  choice: andere täuschen
  rationale: Das Wort bezeichnet Verführer oder Betrüger, wörtlich mit dem Beiklang einer Täuschung des Denkens. Die Wiedergabe ist verständlich und macht das implizite Objekt idiomatisch sichtbar.
- source_word: μάλιστα
  choice: besonders
  rationale: Hebt innerhalb der größeren Gruppe eine Teilgruppe hervor.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: die aus der Beschneidung
  rationale: Bewahrt die knappe und ungewöhnliche Ausdrucksweise des Griechischen, ohne sie ausdrücklich als jüdische Menschen oder als eine bestimmte Partei festzulegen.
theological_decisions:
- issue: Bezugsgruppe von οἱ ἐκ τῆς περιτομῆς
  choice: die aus der Beschneidung
  alternative: die zur Beschneidungsgruppe gehören; die aus dem Judentum kommen
  rationale: Gemeint sind wahrscheinlich jüdische oder judaisierende Gegner. Der griechische Ausdruck nennt jedoch weder ausdrücklich eine Partei noch das Judentum; daher bleibt die Hauptübersetzung transparent und die mögliche historische Einordnung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Reihe griechischer Personenbezeichnungen wird durch parallele verbale Wendungen natürlich lesbar gemacht. Die auffällige Wendung »aus der Beschneidung« bleibt wegen ihrer sachlichen Offenheit im Haupttext erhalten und wird in der Fußnote erläutert.
