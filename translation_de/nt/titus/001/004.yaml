  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: de
  text: 'An Titus, mein echtes Kind im gemeinsamen Glauben[a]: Gnade und Frieden von Gott, dem Vater, und vom Messias Jesus[b], unserem Retter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gemäß dem gemeinsamen Glauben“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Christus Jesus“; hier mit „Messias Jesus“ wiedergegeben, weil Χριστός als Titel verstanden wird.
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: mein echtes Kind
  rationale: Die Wendung bezeichnet die Echtheit der geistlichen Verwandtschaft, nicht biologische Abstammung oder rechtliche Legitimität. „Kind“ bewahrt die nicht ausdrücklich männliche Form von τέκνον; „mein“ verdeutlicht im Deutschen die im persönlichen Anredeverhältnis liegende Zuordnung.
- source_word: κατὰ κοινὴν πίστιν
  choice: im gemeinsamen Glauben
  rationale: κατά beschreibt hier das Verhältnis beziehungsweise den gemeinsamen Bezugsrahmen. Die knappe deutsche Fassung ist natürlicher als „gemäß dem gemeinsamen Glauben“ und lässt offen, ob stärker an Grundlage, Maßstab oder Lebensbereich gedacht ist.
- source_word: πίστιν
  choice: Glauben
  rationale: Im Kontext bezeichnet πίστις den von Paulus und Titus geteilten Glauben; „Glauben“ ist die geläufige und sachlich passende Wiedergabe.
- source_word: χάρις καὶ εἰρήνη
  choice: Gnade und Frieden
  rationale: Die traditionellen deutschen Begriffe geben den paulinischen Segensgruß präzise und verständlich wieder.
- source_word: θεοῦ πατρὸς
  choice: Gott, dem Vater
  rationale: Der griechische Text hat bei πατρός kein „unser“. Die Apposition „dem Vater“ wahrt diese Genauigkeit und klingt im Deutschen natürlich.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  rationale: Χριστός wird seinem Titelgehalt entsprechend mit „Messias“ übersetzt, statt lediglich als „Christus“ übernommen zu werden; die griechische Reihenfolge bleibt erhalten.
- source_word: σωτῆρος ἡμῶν
  choice: unserem Retter
  rationale: Die Apposition bezeichnet unmittelbar den Messias Jesus als den Retter der Angesprochenen und des Absenders.
theological_decisions:
- issue: Wiedergabe von Χριστός in Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: „Messias“ macht den Bedeutungsgehalt des griechischen Titels sichtbar. Eine bloße traditionelle Lautübertragung könnte seine Titelfunktion verdecken.
- issue: Bezug von τοῦ σωτῆρος ἡμῶν
  choice: „unserem Retter“ steht als Apposition zu „Messias Jesus“
  alternative: Ein weiterer, lockerer Bezug auf die gesamte koordinierte Herkunftsangabe
  rationale: Artikel und unmittelbare Wortstellung verbinden den Rettertitel am natürlichsten mit Χριστοῦ Ἰησοῦ. Die Übersetzung bildet diese Syntax ab, ohne sie dogmatisch zu erweitern.
translation_notes:
  register: Moderner, würdevoller Briefstil. „Im gemeinsamen Glauben“ vermeidet eine unnötig hölzerne Wiedergabe von κατά, während „Messias Jesus“ bewusst den Titelgehalt und die griechische Wortfolge bewahrt. Sämtliche Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
