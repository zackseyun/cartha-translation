  variant: modern standard German
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: de
  text: Denn ein Aufseher[a] muss als Gottes Verwalter untadelig sein, nicht selbstherrlich, nicht jähzornig, nicht dem Wein ergeben, nicht gewalttätig und nicht auf schändlichen Gewinn aus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bischof“. Das griechische Wort bezeichnet jemanden, der Aufsicht führt; „Aufseher“ vermeidet spätere kirchenamtliche Vorstellungen, die mit „Bischof“ verbunden sein können.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „nicht auf unehrlichen Gewinn aus“. Gemeint ist Gewinn, der auf moralisch verwerfliche Weise angestrebt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: muss
  rationale: Gibt die im Griechischen ausgedrückte Notwendigkeit beziehungsweise Verpflichtung klar und idiomatisch wieder.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden Anschluss an den vorhergehenden Vers.
- source_word: ἐπίσκοπον
  choice: Aufseher
  rationale: Gibt die Grundbedeutung des Amtes wieder, ohne spätere kirchenhierarchische Vorstellungen vorauszusetzen.
- source_word: ἀνέγκλητον
  choice: untadelig
  rationale: Bezeichnet eine Person, gegen die kein berechtigter Vorwurf erhoben werden kann; die knappe Formulierung ist im Deutschen natürlich und würdevoll.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: als Gottes Verwalter
  rationale: Bewahrt sowohl die Beauftragung durch Gott als auch den Gedanken verantwortlicher Verwaltung.
- source_word: αὐθάδη
  choice: selbstherrlich
  rationale: Erfasst die Verbindung von eigensinnigem Beharren auf dem eigenen Willen und anmaßendem Auftreten.
- source_word: ὀργίλον
  choice: jähzornig
  rationale: Bezeichnet eine dauerhafte Neigung zu raschem Zorn, nicht nur einen einzelnen Wutausbruch.
- source_word: πάροινον
  choice: dem Wein ergeben
  rationale: Drückt eine von Wein und dessen übermäßigem Genuss geprägte Haltung aus, ohne die Bedeutung auf eine einzelne Trunkenheit oder ausdrücklich auf Abhängigkeit zu verengen.
- source_word: πλήκτην
  choice: gewalttätig
  rationale: Gibt den Sinn eines Schlägers beziehungsweise einer zu tätlicher Gewalt neigenden Person in allgemein verständlichem Deutsch wieder.
- source_word: αἰσχροκερδῆ
  choice: auf schändlichen Gewinn aus
  rationale: Bewahrt sowohl das eigennützige Streben nach Gewinn als auch dessen moralisch verwerflichen Charakter; der Ausdruck ist weiter als bloß rechtswidriger oder betrügerischer Gewinn.
theological_decisions:
- issue: Wiedergabe von ἐπίσκοπος als Bezeichnung einer gemeindlichen Leitungsaufgabe
  choice: Aufseher
  alternative: Bischof
  rationale: „Aufseher“ folgt der lexikalischen Bedeutung und vermeidet es, die später entwickelte Gestalt des Bischofsamtes in den Text hineinzulesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Reihe der negativen Eigenschaften folgt dem griechischen Satzfluss; das abschließende Komma macht sichtbar, dass der Satz im folgenden Vers weitergeführt wird.
