source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: de
  text: Nichts unterschlagen, sondern sich in jeder Hinsicht als treu[a] erweisen, damit sie in allem die Lehre Gottes, unseres Retters, schmücken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „jede gute Treue zeigen“. Das griechische Wort pistis kann „Glaube“, aber auch „Treue“ oder „Zuverlässigkeit“ bedeuten; hier ist wahrscheinlich die Treue im Verhalten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: nichts unterschlagen
  rationale: Das Verb bezeichnet hier, dass jemand etwas, das einem anderen gehört, heimlich für sich behält oder abzweigt. „Unterschlagen“ ist im Deutschen präzise und passt zum Kontext von Sklaven und ihren Herren.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: sich in jeder Hinsicht als treu erweisen
  rationale: Die Wendung beschreibt umfassende, gute Verlässlichkeit im Verhalten. Diese natürliche deutsche Formulierung gibt die ethische Bedeutung von πίστις sowie die verstärkende Wirkung von πᾶσαν und die positive Bestimmung durch ἀγαθήν wieder.
- source_word: κοσμῶσιν
  choice: schmücken
  rationale: '„Schmücken“ bewahrt das Bild des griechischen Verbs: Ihr Verhalten soll die Lehre ansprechend erscheinen lassen und ihr Ehre machen.'
- source_word: διδασκαλίαν
  choice: die Lehre
  rationale: „Lehre“ ist eine geläufige und genaue Wiedergabe von διδασκαλία und passt hier besser als das enger klingende „Doktrin“.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Gottes, unseres Retters
  rationale: Die Formulierung gibt den Genitiv und den Titel direkt wieder, ohne über den ausdrücklichen Wortlaut dieses Verses hinauszugehen.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die knappe Wendung bewahrt den umfassenden Geltungsbereich des griechischen Ausdrucks und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von πίστις in einem ethischen Kontext
  choice: treu
  alternative: Glauben; Treue; Zuverlässigkeit
  rationale: Im Zusammenhang mit dem Verhalten gegenüber Herren bezeichnet πίστις wahrscheinlich Treue beziehungsweise Zuverlässigkeit. Die Fußnote bewahrt zugleich die lexikalische Verbindung zum häufigen Sinn „Glaube“, ohne ihn dem Kontext aufzuzwingen.
- issue: Bezug der Bezeichnung „Gott, unser Retter“
  choice: Gottes, unseres Retters
  alternative: unseres Retter-Gottes
  rationale: Der Wortlaut bezeichnet hier Gott als Retter. Die Übersetzung lässt die Aussage dieses Satzes stehen und trägt keine zusätzliche christologische Identifizierung in die Formulierung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unterschlagen“ ist präzise und allgemein verständlich; „schmücken“ erhält die anschauliche Metapher des Ausgangstextes. Die Formulierung ist als Fortsetzung der Anweisungen an Sklaven verständlich, funktioniert aber auch als einzelner Vers.
