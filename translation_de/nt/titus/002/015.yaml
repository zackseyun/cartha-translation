  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: de
  text: Davon sollst du reden, dazu ermahnen und zurechtweisen – mit aller Vollmacht. Niemand soll dich geringschätzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Niemand soll dich verachten / auf dich herabsehen.'
    reason: Lexikalische Alternativen zu περιφρονέω; das Verb kann stärkere Verachtung oder ein herablassendes Geringachten ausdrücken.
lexical_decisions:
- source_word: Ταῦτα
  choice: Davon
  rationale: Das neutrale Pluraldemonstrativ verweist zusammenfassend auf die vorausgehenden Anweisungen. „Davon“ ist im Deutschen natürlich und legt den Inhalt nicht enger als der griechische Text fest.
- source_word: λάλει
  choice: sollst du reden
  rationale: Das Präsensimperativ fordert fortgesetztes mündliches Vermitteln. „reden“ wahrt die allgemeine Bedeutung, ohne sie vorschnell auf „lehren“ zu verengen.
- source_word: παρακάλει
  choice: ermahnen
  rationale: παρακαλέω kann ermutigen, auffordern oder ermahnen bedeuten. Im Zusammenhang mit verbindlicher Unterweisung und Zurechtweisung gibt „ermahnen“ die mahnend-aufrufende Kraft angemessen wieder.
- source_word: ἔλεγχε
  choice: zurechtweisen
  rationale: ἐλέγχω bezeichnet hier das Aufdecken und Korrigieren von Fehlverhalten. „zurechtweisen“ ist verständlich und bewahrt die korrigierende Kraft, ohne unnötig scharf zu klingen.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: mit aller Vollmacht
  rationale: ἐπιταγή kann Gebot, Auftrag oder Autorität bezeichnen. In dieser Verbindung bezeichnet die Wendung das volle Gewicht, mit dem Titus diese Aufgaben ausführen soll; „Vollmacht“ lässt zugleich offen, dass diese Autorität übertragen ist.
- source_word: μηδείς
  choice: Niemand
  rationale: Die negative Indefinitform wird als klare deutsche Verneinung eines persönlichen Subjekts wiedergegeben.
- source_word: σου
  choice: dich
  rationale: Der Genitiv bei περιφρονέω bezeichnet die Person, die geringgeachtet wird; idiomatisches Deutsch verlangt hier den Akkusativ.
- source_word: περιφρονείτω
  choice: soll dich geringschätzen
  rationale: περιφρονέω bedeutet, von jemandem gering zu denken, ihn zu verachten oder nicht ernst zu nehmen. „geringschätzen“ bewahrt die wertende Komponente und bleibt in würdigem modernem Deutsch verständlich.
theological_decisions:
- issue: Tragweite von μετὰ πάσης ἐπιταγῆς für den Dienst des Titus
  choice: Titus soll beim Reden, Ermahnen und Zurechtweisen mit voller Vollmacht handeln.
  alternative: Die Wendung könnte lediglich einen befehlenden Ton oder ausschließlich die Autorität der Botschaft bezeichnen.
  rationale: Die Präpositionalphrase bezieht sich natürlich auf die zusammengefassten Handlungen und bezeichnet deren verbindliches Gewicht. „Mit aller Vollmacht“ wahrt dies, ohne Titus eine eigenständige, vom Auftrag losgelöste Autorität zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt knapp und imperativisch; „Davon sollst du reden“ klingt natürlicher als das wörtlichere „Diese Dinge rede“. Der Gedankenstrich hebt die modale Bestimmung hervor, ohne zusätzliche Auslegung einzutragen.
