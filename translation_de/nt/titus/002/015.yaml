  source_fidelity: Die drei Präsensimperative (λάλει, παρακάλει, ἔλεγχε) werden als fortlaufende Aufforderungen sachgerecht wiedergegeben. „Davon“ nimmt den breit auf die vorausgehenden Weisungen verweisenden Charakter von Ταῦτα auf. „Mit aller Vollmacht“ gibt μετὰ πάσης ἐπιταγῆς in vertretbarer, nicht überinterpretierender Weise wieder; „Niemand soll dich geringschätzen“ trifft περιφρονείτω angemessen.
  naturalness: Der Text ist knapp, würdig und modernes Standarddeutsch. Die Verbindung „Davon sollst du reden, dazu ermahnen und zurechtweisen“ ist als koordinierte, elliptische Imperativfolge verständlich und stilistisch tragfähig. Der Gedankenstrich setzt die modale Bestimmung lesbar ab.
  terminology: „Ermahnen“, „zurechtweisen“, „Vollmacht“ und „geringschätzen“ passen zum pastoralen und zugleich modernen Register. Die Fußnote nennt mit „verachten“ und „auf dich herabsehen“ tragfähige lexikalische Alternativen, ohne die Grundübersetzung zu entwerten.
