  variant: modern standard German
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: de
  text: Die älteren Männer sollen nüchtern, würdevoll und besonnen sein sowie im Glauben[a], in der Liebe und in der Ausdauer gesund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in der Treue. Das griechische Wort πίστις kann je nach Zusammenhang sowohl „Glaube“ als auch „Treue“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: die älteren Männer
  rationale: In dieser Unterweisung bezeichnet πρεσβύτας Männer fortgeschrittenen Alters, nicht das Gemeindeamt der Ältesten.
- source_word: νηφαλίους
  choice: nüchtern
  rationale: Das Wort bezeichnet wörtlich Nüchternheit und darüber hinaus einen klaren, beherrschten Lebenswandel. Das deutsche „nüchtern“ bewahrt beide Bedeutungsebenen.
- source_word: σεμνούς
  choice: würdevoll
  rationale: Der Ausdruck beschreibt eine achtbare, respektgebietende Haltung; „würdevoll“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: σώφρονας
  choice: besonnen
  rationale: Gemeint sind vernünftige Selbstbeherrschung und ein ausgewogenes Urteilsvermögen. „Besonnen“ unterscheidet sich zudem klar von „nüchtern“.
- source_word: ὑγιαίνοντας
  choice: gesund
  rationale: Die wörtliche Gesundheitsmetapher lässt sich im Deutschen auch in Verbindung mit Glauben, Liebe und Standhaftigkeit verständlich bewahren.
- source_word: τῇ πίστει
  choice: im Glauben
  rationale: πίστις kann hier Glauben beziehungsweise Vertrauen oder Treue bezeichnen. „Glauben“ steht im Haupttext; die ebenfalls mögliche Wiedergabe „Treue“ wird in einer Fußnote erhalten.
- source_word: τῇ ἀγάπῃ
  choice: in der Liebe
  rationale: „Liebe“ ist die direkte und natürliche Wiedergabe von ἀγάπη; die Präposition verdeutlicht den Bereich, in dem die Männer gesund sein sollen.
- source_word: τῇ ὑπομονῇ
  choice: in der Standhaftigkeit
  rationale: ὑπομονή bezeichnet geduldiges Ausharren unter Belastung. „Standhaftigkeit“ hebt die beständige Ausdauer hervor.
- source_word: εἶναι
  choice: sollen … sein
  rationale: Der Infinitiv hängt von der Aufforderung des vorausgehenden Zusammenhangs ab. „Sollen … sein“ gibt diesen unterweisenden Charakter idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von πίστις in der Tugendreihe
  choice: Glauben
  alternative: Treue
  rationale: In der Verbindung mit Liebe und Standhaftigkeit kann πίστις sowohl den Glauben beziehungsweise das Vertrauen als auch die Treue bezeichnen. Der Haupttext verwendet „Glauben“, ohne die mögliche Bedeutung „Treue“ auszuschließen; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer knappen Tugendreihe. Die Gesundheitsmetapher des griechischen Textes bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei „Glauben“, da sich die alternative Lesart auf πίστις bezieht.
