  source_fidelity: Der Entwurf gibt die angesprochenen älteren Männer, die vier Tugendbegriffe und die Gesundheitsmetapher von ὑγιαίνοντας insgesamt treffend wieder. Die Fußnote wahrt angemessen die mögliche Bedeutung von πίστις als „Treue“.
