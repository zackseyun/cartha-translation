  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des griechischen Textes weitgehend zutreffend wieder: freiwillige Selbsthingabe, Erlösung von aller Gesetzlosigkeit, Reinigung eines Christus zugehörigen Volkes und dessen Eifer für gute Werke. Bei ἑαυτῷ ist jedoch „sich selbst“ im Satz missverständlich, weil es wie eine Reflexivbestimmung des Reinigens wirken kann. „für sich“ gibt den Dativ der Zugehörigkeit bzw. des Vorteils klarer wieder.'
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. Die Verbindung „sich selbst ein Volk zum besonderen Eigentum zu reinigen“ ist allerdings syntaktisch und semantisch schwer verständlich. „um sich ein Volk zu reinigen, das sein besonderes Eigentum ist“ ist klar und bewahrt die Satzfunktion.
  terminology: „hingab“, „für uns“, „erlösen“, „Gesetzlosigkeit“, „reinigen“ und „gute Werke“ sind angemessen. „besonderes Eigentum“ trifft λαὸν περιούσιον als Besitz-/Bundessprache gut. Die Fußnote sollte die Besitzbeziehung nicht unnötig mit „allein“ verschärfen und nicht ohne Einschränkung „Gott“ einsetzen, da der unmittelbare Bezug im Satz auf denjenigen geht, der sich hingab.
  issues:
