  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: de
  text: der sich selbst für uns hingab, um uns von aller Gesetzlosigkeit zu erlösen und sich ein Volk zu reinigen, das sein besonderes Eigentum ist und mit Eifer gute Werke tut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Volk, das ihm gehört“; auch: „ein kostbares Volk“. Der griechische Ausdruck greift die Bundessprache für ein Volk auf, das ihm in besonderer Weise als Eigentum gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: sich selbst hingab
  rationale: Die Wendung bringt die freiwillige Selbsthingabe natürlich und würdevoll zum Ausdruck; „hingab“ ist im Deutschen idiomatischer als das wörtlichere „gab“.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: „Für uns“ bewahrt die benefaktive und mögliche stellvertretende Weite der Präposition, ohne ein bestimmtes Sühneverständnis festzuschreiben.
- source_word: ἵνα λυτρώσηται
  choice: um … zu erlösen
  rationale: „Erlösen“ wahrt sowohl den Gedanken der Befreiung als auch den mit λύτρωσις verbundenen Loskauf-Hintergrund und ist im Deutschen gut verständlich.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: von aller Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ entspricht dem spezifischen Sinn von ἀνομία genauer als das allgemeinere „Bosheit“; „aller“ gibt die umfassende Aussage wieder.
- source_word: καθαρίσῃ
  choice: zu reinigen
  rationale: „Reinigen“ bewahrt die kultische und moralische Bedeutungsbreite des Verbs, ohne sie auf innere Läuterung zu verengen.
- source_word: ἑαυτῷ
  choice: sich selbst
  rationale: Die Formulierung zeigt, dass das gereinigte Volk Christus selbst gehört und für ihn bestimmt ist.
- source_word: λαὸν περιούσιον
  choice: ein Volk zum besonderen Eigentum
  rationale: Diese Wendung erhält den alttestamentlich-bundestheologischen Sinn eines Volkes, das Gott in besonderer Weise gehört, und klingt im Deutschen natürlicher als „ein Volk für seinen eigenen Besitz“.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: das mit Eifer gute Werke tut
  rationale: Die prädikative Beschreibung wird in einen natürlichen deutschen Relativsatz umgesetzt. Sie bewahrt sowohl den Eifer als auch die Ausrichtung auf gute Werke.
theological_decisions:
- issue: Bedeutung von ὑπὲρ ἡμῶν bei der Selbsthingabe Christi
  choice: „für uns“
  alternative: „an unserer Stelle“ oder „um unsertwillen“
  rationale: Die knappe Wiedergabe lässt sowohl die Zuwendung zu unserem Heil als auch eine mögliche stellvertretende Nuance bestehen, ohne den Vers auf ein einzelnes Sühneschema festzulegen.
- issue: Bundestheologischer Gehalt von λαὸν περιούσιον
  choice: „ein Volk zum besonderen Eigentum“
  alternative: „ein kostbares Volk“ oder „ein Volk, das ihm allein gehört“
  rationale: Die gewählte Formulierung bewahrt den Anklang an die Sprache des Alten Testaments von Gottes besonderem Eigentumsvolk und vermeidet eine bloß qualitative Deutung als „besonders“ oder „kostbar“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber durch den finalen Infinitivsatz und den Relativsatz idiomatisch gestaltet. Der Ausdruck „gute Werke“ bleibt als theologisch und ethisch geprägter Schlüsselbegriff erhalten.
