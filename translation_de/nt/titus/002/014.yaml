    rationale: In „sich selbst ein Volk ... zu reinigen“ kann „sich selbst“ im Deutschen reflexiv zu „reinigen“ verstanden werden. Das griechische ἑαυτῷ bezeichnet dagegen das Volk als für ihn selbst gereinigt bzw. ihm zugehörig.
  - severity: low
    issue: Fußnotenalternative „ihm allein gehört“
    rationale: „Allein“ ist im griechischen περιούσιος nicht ausdrücklich enthalten und kann die Aussage stärker exklusiv formulieren als der Ausgangstext. Eine neutrale Alternative wie „ein Volk, das ihm gehört“ wahrt den Besitzgedanken.
  - severity: low
    issue: Fußnote nennt ausdrücklich Gott
    rationale: Die christologische Identifikation liegt im Kontext nahe, doch die Fußnote kann näher am unmittelbaren grammatischen Bezug bleiben, indem sie „ihm“ verwendet.
