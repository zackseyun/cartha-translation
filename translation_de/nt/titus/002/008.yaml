id: TIT.2.8
reference: Titus 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: de
  text: eine gesunde, unanfechtbare Rede[a][b], damit der Gegner[c] beschämt wird, da er nichts Schlechtes über uns zu sagen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein gesundes Wort“ oder „eine gesunde Botschaft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Rede, die nicht zu beanstanden ist“ beziehungsweise „keinen Anlass zur Verurteilung gibt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der von der Gegenseite“, das heißt: ein Gegner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: Rede
  rationale: Im Zusammenhang bezeichnet λόγος Inhalt und Art des Redens beim Lehren. „Rede“ bewahrt den Singular und ist weiter als ein einzelnes „Wort“.
- source_word: ὑγιῆ
  choice: gesund
  rationale: Das Adjektiv bewahrt das in den Pastoralbriefen wiederkehrende Bild für lehrmäßige und sittliche Unversehrtheit und ist im Deutschen verständlich.
- source_word: ἀκατάγνωστον
  choice: unanfechtbar
  rationale: Gemeint ist eine Rede, gegen die kein berechtigter Tadel oder verurteilendes Urteil erhoben werden kann. „Unanfechtbar“ gibt dies knapp und idiomatisch wieder.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ bringt die Zweck- beziehungsweise Ergebnisbeziehung natürlich zum Ausdruck.
- source_word: ὁ ἐξ ἐναντίας
  choice: der Gegner
  rationale: Die substantivierte Wendung bezeichnet idiomatisch jemanden von der Gegenseite. „Der Gegner“ ist im Deutschen klar, ohne ein nicht ausdrücklich genanntes Objekt des Widerstands einzufügen.
- source_word: ἐντραπῇ
  choice: beschämt wird
  rationale: Die passive Form und die soziale wie moralische Wirkung werden mit „beschämt wird“ unmittelbar wiedergegeben.
- source_word: μηδὲν ἔχων λέγειν
  choice: da er nichts … zu sagen hat
  rationale: 'Die deutsche Konstruktion gibt das modale beziehungsweise begründende Partizip idiomatisch wieder: Dem Gegner fehlt jeder schlechte Vorwurf.'
- source_word: περὶ ἡμῶν
  choice: über uns
  rationale: Der griechische Plural der ersten Person bleibt ohne Einengung oder Erweiterung erhalten.
- source_word: φαῦλον
  choice: Schlechtes
  rationale: φαῦλον bezeichnet hier etwas moralisch Schlechtes oder Tadelnswertes, das als Vorwurf geäußert werden könnte. Die substantivierte Form ist im Deutschen natürlich.
theological_decisions:
- issue: Bezugsumfang von περὶ ἡμῶν
  choice: „über uns“ ohne nähere Bestimmung
  alternative: „über dich“, „über uns Christen“ oder „über unsere Lehre“
  rationale: Der griechische Text verwendet die erste Person Plural, legt deren genauen Personenkreis aber nicht ausdrücklich fest. Die Übersetzung bewahrt diese Offenheit.
- issue: Verhältnis des Partizips μηδὲν ἔχων zur Beschämung des Gegners
  choice: als begründender Begleitumstand mit „da“ wiedergegeben
  alternative: 'beiordnend: „und nichts Schlechtes über uns sagen kann“'
  rationale: Das Partizip beschreibt, dass der Gegner keinen schlechten Vorwurf vorbringen kann; dies erklärt seine Beschämung. Die Übersetzung macht diesen naheliegenden Zusammenhang deutlich, ohne einen zusätzlichen theologischen Gedanken einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung der vorangehenden Aufforderung fragmentarisch. „Gesunde Rede“ bewahrt die Bildsprache des Ausgangstextes; „unanfechtbar“ vermeidet eine schwerfällige Relativkonstruktion. Alle textkritisch und lexikalisch relevanten Alternativen werden knapp in den Fußnoten ausgewiesen.
