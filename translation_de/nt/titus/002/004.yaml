lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet natürlich und präzise den Zweck beziehungsweise die beabsichtigte Folge der vorhergehenden Anweisung ein.
- source_word: σωφρονίζωσι
  choice: sie dazu anleiten
  rationale: Das Verb bezeichnet ein Hinführen zu besonnenem, vernünftigem Verhalten und kann je nach Zusammenhang auch »ermahnen« oder »zur Besonnenheit anhalten« bedeuten. »Dazu anleiten« gibt hier den formenden Charakter der Unterweisung wieder.
- source_word: τὰς νέας
  choice: die jüngeren Frauen
  rationale: Der substantivierte feminine Plural bezeichnet im Gegensatz zu den älteren Frauen im Kontext die jüngeren Frauen. Die Wiedergabe vermeidet die unnötige Verengung auf »Ehefrauen«.
- source_word: φιλάνδρους
  choice: ihren Männern zugetan
  rationale: Das Adjektiv bezeichnet liebevolle Zuneigung zum eigenen Ehemann. »Zuge­tan« bewahrt den beschreibenden Charakter der Eigenschaft und klingt im Deutschen natürlicher als eine wörtlich zusammengesetzte Form.
- source_word: εἶναι
  choice: zu sein
  rationale: Der Infinitiv verbindet die beiden prädikativen Adjektive und bezeichnet, wozu die jüngeren Frauen angeleitet werden sollen.
- source_word: φιλοτέκνους
  choice: kinderlieb
  rationale: Das Adjektiv bezeichnet liebevolle Zuneigung zu den eigenen Kindern. »Kinderlieb« gibt die adjektivische Form knapp wieder; der Bezug auf die eigenen Kinder wird durch die Parallelstellung zu »ihren Männern« und durch eine Fußnote verdeutlicht.
theological_decisions:
- issue: Umfang der Anweisung an die »jüngeren Frauen« im Rahmen der Haustafel
  choice: Die Personengruppe wird ohne Verengung als »die jüngeren Frauen« wiedergegeben; die genannten Eigenschaften beziehen sich auf diejenigen in der vorausgesetzten familiären Situation.
  alternative: »Die jüngeren Ehefrauen« oder eine verallgemeinernde Aussage über das Wesen aller Frauen.
  rationale: Der griechische Ausdruck nennt Frauen, nicht ausdrücklich Ehefrauen, während die folgenden Adjektive Ehe und Kinder voraussetzen. Die Übersetzung wahrt diese Spannung, ohne daraus eine umfassende Definition weiblicher Lebensführung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bewahrt die adjektivische Parallelität von φιλάνδρους und φιλοτέκνους, ohne schwer verständliche deutsche Komposita zu bilden. Die Fußnoten dokumentieren die wichtigsten lexikalischen Alternativen und die im Griechischen nur aus dem Kontext ergänzte Bezeichnung »Frauen«.
