  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: de
  text: Sklaven[a] sollen sich ihren eigenen Herren in allem unterordnen, ihnen gefällig sein und nicht widersprechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das griechische Wort doulos kann Menschen in einem Dienstverhältnis bezeichnen; hier ist jedoch wahrscheinlich ihr Status als Sklaven gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „keine Widerworte geben“ beziehungsweise „nicht gegenreden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: Sklaven
  rationale: δοῦλος kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen. Die Verbindung mit δεσπόταις weist hier auf den rechtlich und sozial gebundenen Status hin; „Sklaven“ gibt diese Realität wieder, ohne sie zu beschönigen.
- source_word: ἰδίοις δεσπόταις
  choice: ihren eigenen Herren
  rationale: δεσπότης bezeichnet hier den Herrn beziehungsweise Besitzer eines Sklaven. „Herren“ ist im Deutschen in diesem historischen Haushaltskontext natürlicher als „Besitzern“; ἰδίοις wird mit „eigenen“ ausdrücklich wiedergegeben.
- source_word: ὑποτάσσεσθαι
  choice: sich … unterordnen
  rationale: Der Infinitiv bezeichnet eine erwartete Haltung der Unterordnung. Die reflexive Form ist im modernen Deutschen natürlich und entspricht dem möglichen medialen Sinn.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die umfassende Formulierung bleibt ohne eine nicht ausdrücklich im Vers stehende Einschränkung erhalten.
- source_word: εὐαρέστους εἶναι
  choice: ihnen gefällig sein
  rationale: εὐάρεστος bedeutet „wohlgefällig“ oder „angenehm“. Das bezogene Pronomen „ihnen“ macht im Deutschen den aus dem Zusammenhang erschlossenen Bezug auf die Herren deutlich.
- source_word: μὴ ἀντιλέγοντας
  choice: nicht widersprechen
  rationale: ἀντιλέγω bezeichnet das Gegenreden, Widersprechen oder verbale Widerstreben. „Nicht widersprechen“ bewahrt den sprachlichen Charakter des Verhaltens und ist würdig sowie gegenwärtig verständlich.
theological_decisions:
- issue: Wiedergabe von δοῦλος im antiken Haushaltskontext
  choice: Sklaven
  alternative: Diener; leibeigene Diener
  rationale: Der Bezug auf δεσπόταις macht die gebundene soziale und rechtliche Stellung deutlich. „Sklaven“ beschreibt diese historische Realität präzise; die Übersetzung stellt die Anweisung des Textes dar, ohne die Institution der Sklaverei zu billigen.
- issue: Umfang von ἐν πᾶσιν
  choice: in allem
  alternative: in jeder Hinsicht
  rationale: Die umfassende und spannungsreiche Aussage des griechischen Textes wird beibehalten. Eine ethische Einschränkung wird nicht stillschweigend in den Vers eingefügt, da sie hier nicht ausdrücklich formuliert ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die historische Härte von „Sklaven“ wird nicht durch „Diener“ abgeschwächt. „Ihnen gefällig sein“ hält sich eng an die griechische Prädikativkonstruktion, während „nicht widersprechen“ verständlicher und weniger umgangssprachlich ist als „keine Widerworte geben“.
