source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: de
  text: Sie erzieht uns[a], damit wir der Gottlosigkeit und den weltlichen Begierden absagen und im gegenwärtigen Zeitalter[b] besonnen, gerecht und gottesfürchtig leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie unterweist uns« beziehungsweise »Sie weist uns zurecht«; das griechische Wort meint eine formende Erziehung, die auch Zurechtweisung einschließen kann.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet die gegenwärtige Epoche im Unterschied zur kommenden.
    reason: meaning_clarification
lexical_decisions:
- source_word: παιδεύουσα
  choice: Sie erzieht uns
  rationale: Das Partizip bezieht sich auf die zuvor genannte Gnade. »Erzieht« umfasst Unterweisung und formende Zurechtweisung, ohne den Sinn auf bloßes Lehren oder Strafen zu verengen.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die Ziel- und Zweckbeziehung der griechischen Konstruktion knapp und idiomatisch wieder.
- source_word: ἀρνησάμενοι
  choice: absagen
  rationale: Bezeichnet die entschiedene Abkehr von Gottlosigkeit und Begierden. Die deutsche Infinitivkonstruktion vermeidet eine unnötige Festlegung darauf, ob das Aoristpartizip streng vorzeitig oder als grundlegende Begleithandlung zu verstehen ist.
- source_word: ἀσέβειαν
  choice: Gottlosigkeit
  rationale: Bewahrt sowohl den religiösen als auch den ethischen Sinn eines Lebens ohne Ehrfurcht vor Gott.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: weltlichen Begierden
  rationale: Bezeichnet Begierden, die von der gegenwärtigen, Gott entfremdeten Weltordnung geprägt sind. »Begierden« trägt hier deutlicher als das neutrale »Wünsche« die ethisch negative Wertung.
- source_word: σωφρόνως
  choice: besonnen
  rationale: Gibt Selbstbeherrschung, vernünftiges Urteil und maßvolles Verhalten in natürlichem Deutsch wieder und entspricht einem Leitmotiv des Titusbriefs.
- source_word: δικαίως
  choice: gerecht
  rationale: Bezeichnet ein Verhalten, das dem Rechten entspricht, und erhält den moralisch-theologischen Klang.
- source_word: εὐσεβῶς
  choice: gottesfürchtig
  rationale: Drückt ein von Ehrfurcht vor Gott geprägtes Leben aus. Im Deutschen ist »gottesfürchtig« präziser und natürlicher als das missverständliche »göttlich«.
- source_word: ζήσωμεν
  choice: leben
  rationale: Der von ἵνα abhängige Konjunktiv wird in der deutschen damit-Konstruktion sachgerecht wiedergegeben.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: in der gegenwärtigen Weltzeit
  rationale: »Weltzeit« bewahrt den eschatologischen Sinn von αἰών als gegenwärtige Epoche im Gegensatz zur kommenden, statt den Ausdruck auf einen bloßen Zeitpunkt zu reduzieren.
theological_decisions:
- issue: Verhältnis der Absage an das frühere Leben zum neuen Lebenswandel
  choice: 'als zwei eng verbundene Ziele der Erziehung formuliert: »absagen und … leben«'
  alternative: »nachdem wir … abgesagt haben, … leben«
  rationale: Das Aoristpartizip kann eine grundlegende beziehungsweise vorausliegende Abkehr ausdrücken, zwingt aber nicht zu einer streng zeitlichen Stufenfolge. Die koordinierte deutsche Form bewahrt den Zusammenhang, ohne die zeitliche Beziehung stärker festzulegen als der Kontext.
- issue: Dreigliedrige ethische Bestimmung σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: »besonnen, gerecht und gottesfürchtig leben«
  alternative: »in Besonnenheit, Gerechtigkeit und Gottesfurcht leben«
  rationale: 'Die drei deutschen Adverbialbestimmungen bilden die griechische Dreierreihe natürlich und vollständig ab: Haltung gegenüber sich selbst, Mitmenschen und Gott, ohne diese Zuordnung dogmatisch festzuschreiben.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers wird wegen des Rückbezugs auf die in Vers 11 genannte Gnade mit »Sie« eröffnet. Die Satzstruktur bleibt gut vorlesbar; traditionelle, aber verständliche Begriffe wie »Gottlosigkeit«, »Begierden« und »gottesfürchtig« erhalten die religiös-ethische Präzision des Ausgangstextes.
