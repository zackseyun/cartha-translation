  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: de
  text: 'Ebenso sollen ältere Frauen sich in ihrem Verhalten so verhalten, wie es dem Heiligen entspricht: Sie sollen keine Verleumderinnen sein, nicht von viel Wein versklavt sein und das Gute lehren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: ältere Frauen
  rationale: Bezeichnet Frauen fortgeschrittenen Alters und entspricht der Bezugnahme auf die älteren Männer im vorausgehenden Vers; die Formulierung ist natürlich und gegenwärtig.
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Bewahrt die enge Verbindung zur vorausgehenden Ermahnung.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: sich so verhalten, wie es dem Heiligen entspricht
  rationale: κατάστημα bezeichnet Auftreten bzw. Verhalten; ἱεροπρεπής das, was zum heiligen Bereich passt. Die Formulierung gibt beides verständlich wieder, ohne das seltene Adjektiv auf bloße Frömmigkeit zu verengen.
- source_word: μὴ διαβόλους
  choice: Sie sollen niemanden verleumden
  rationale: διάβολος bezeichnet hier in einer ethischen Aufzählung verleumderische Personen, nicht den Teufel. Die verbale Formulierung ist im Deutschen idiomatischer als das substantivische »keine Verleumderinnen«.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: nicht von vielem Wein versklavt sein
  rationale: Das Perfektpassiv von δουλόω beschreibt einen Zustand der Versklavung bzw. Beherrschung. »Versklavt« erhält das starke Bild des griechischen Textes; »von vielem Wein« gibt den Dativ als beherrschende Macht natürlich wieder.
- source_word: καλοδιδασκάλους
  choice: Gutes lehren
  rationale: Das seltene Kompositum bezeichnet das Lehren dessen, was gut ist. Die Formulierung vermeidet die mögliche Fehldeutung von »gute Lehrerinnen« als Aussage über pädagogische Fähigkeit.
theological_decisions:
- issue: Bild der Versklavung durch Wein
  choice: Das Sklavereibild mit »von vielem Wein versklavt« bewahren
  alternative: »vielem Wein ergeben« oder »von vielem Wein abhängig«
  rationale: δουλόω stellt Wein als beherrschende Macht dar. Die direkte Bildsprache wahrt die Schärfe der ethischen Mahnung, ohne den Ausdruck medizinisch als Abhängigkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde als direkte Soll-Ermahnung gestaltet, um die vom übergeordneten Satzbau abhängigen Akkusativformen im Deutschen verständlich wiederzugeben. Keine Fußnote nötig, da die relevanten Bedeutungen im Haupttext transparent ausgedrückt sind.
