    issue: Nicht im Grundtext markierter Gegensatz durch „sondern“
    rationale: Das Griechische reiht καλοδιδασκάλους an die vorhergehenden Beschreibungen an, ohne eine adversative Partikel. „Sondern“ kann fälschlich nahelegen, dass das Lehren des Guten als Gegenpol zu den beiden vorherigen Verneinungen formuliert sei.
  - severity: low
    issue: Leicht unidiomatische Formulierung und Kasus bei der Weinwendung
    rationale: „von viel Wein versklavt“ ist im heutigen Deutsch die natürlichere Verbindung. Eine parallel aufgebaute Prädikatsreihe verbessert zudem die Lesbarkeit.
  revised_text: 'Ebenso sollen ältere Frauen sich in ihrem Verhalten so verhalten, wie es dem Heiligen entspricht: Sie sollen keine Verleumderinnen sein, nicht von viel Wein versklavt sein und das Gute lehren.'
