  variant: modern standard German
source:
  edition: SBLGNT
  text: περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων, ἐν τῇ διδασκαλίᾳ ⸀ἀφθορίαν, ⸀σεμνότητα,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: de
  text: Zeige dich in jeder Hinsicht als Vorbild guter Werke[a]; in deiner Lehre zeige Unverdorbenheit[b] und Würde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in allem als Vorbild für gute Werke“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lauterkeit“ beziehungsweise „Reinheit“. Gemeint sein kann unverfälschte Lehre, eine integre Haltung beim Lehren oder beides.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „würdigen Ernst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: in jeder Hinsicht
  rationale: Die Wendung steht hier adverbial und beschreibt die umfassende Weise, in der Titus als Vorbild auftreten soll. „In jeder Hinsicht“ ist natürliches Deutsch und wahrt den weiten Geltungsbereich.
- source_word: σεαυτὸν παρεχόμενος
  choice: Zeige dich
  rationale: Der reflexive Sinn des Partizips wird knapp und idiomatisch wiedergegeben; zugleich bleibt Titus’ aktives Vorleben im Blick.
- source_word: τύπον
  choice: Vorbild
  rationale: Im ethischen Zusammenhang bezeichnet τύπος ein nachahmenswertes Muster. „Vorbild“ ist im Deutschen klarer und natürlicher als „Muster“.
- source_word: καλῶν ἔργων
  choice: guter Werke
  rationale: Die Genitivverbindung wird eng am Griechischen wiedergegeben. „Gute Werke“ ist verständlich und bewahrt den ethischen Ausdruck, ohne ihn weiter auszulegen.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: in deiner Lehre
  rationale: Der Kontext bezieht die Lehre auf Titus’ eigene Unterweisung. „Lehre“ kann Inhalt und Lehrtätigkeit umfassen und ist hier knapp und würdig.
- source_word: ἀφθορίαν
  choice: Unverdorbenheit
  rationale: Die Wiedergabe bewahrt den Grundgedanken der Freiheit von Verderbnis oder Verfälschung und vermeidet eine vorschnelle Verengung auf bloße moralische Reinheit oder persönliche Integrität.
- source_word: σεμνότητα
  choice: Würde
  rationale: Das Wort bezeichnet eine ehrfurchtgebietende, respektwürdige Ernsthaftigkeit. „Würde“ vermittelt dies in modernem Deutsch am besten.
theological_decisions:
- issue: Bedeutungsumfang von διδασκαλία
  choice: „Lehre“ statt eines ausschließlich dogmatischen Fachbegriffs
  alternative: „Unterweisung“ oder „beim Lehren“
  rationale: „Lehre“ lässt sowohl Inhalt als auch Tätigkeit der Unterweisung zu und beschränkt den Vers nicht auf ein formales Lehrsystem.
- issue: Deutung von ἀφθορίαν innerhalb der Lehre
  choice: Die breite Bedeutung mit „Unverdorbenheit“ bewahren
  alternative: „Reinheit“ oder „Lauterkeit“
  rationale: Der griechische Ausdruck kann auf unverfälschte Lehre, persönliche Lauterkeit beim Lehren oder beides weisen. Die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde gegenüber der griechischen Partizipialfügung zu einer direkten Aufforderung gestaltet. Die Wiederholung „zeige“ verdeutlicht im Deutschen, dass auch Unverdorbenheit und Würde als Anforderungen an Titus gelten, ohne den Bedeutungsumfang der griechischen Nominalreihe unnötig festzulegen.
