  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: de
  text: Denn die Gnade Gottes, die allen Menschen Rettung bringt, ist erschienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn die rettende Gnade Gottes ist allen Menschen erschienen.« Das griechische Adjektiv kann mit »rettend« oder »Rettung bringend« wiedergegeben werden; »allen Menschen« lässt sich dabei entweder enger auf das Retten oder auf das Erscheinen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: ist erschienen
  rationale: Der Aorist von ἐπιφαίνω bezeichnet hier das Sichtbar- oder Offenbarwerden. »Ist erschienen« ist im Deutschen natürlich und bewahrt den feierlichen Offenbarungscharakter.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehenden Ermahnungen; »Denn« gibt diese Verbindung knapp und klar wieder.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: die Gnade Gottes
  rationale: Die etablierte Wendung bewahrt sowohl Gottes unverdiente Zuwendung als auch deren wirksame Kraft, ohne den Genitiv unnötig als reine Herkunftsangabe festzulegen.
- source_word: σωτήριος
  choice: bringt … Rettung
  rationale: Das Adjektiv kennzeichnet die Gnade als rettend beziehungsweise heilbringend. Die verbale Wiedergabe ist in modernem Deutsch natürlicher als »rettend für« und vermeidet das fachsprachliche »heilbringend«.
- source_word: πᾶσιν ἀνθρώποις
  choice: allen Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein und nicht nur Männer. Der Dativ lässt sich bei der gewählten Formulierung idiomatisch ohne zusätzliche Präposition wiedergeben; der umfassende Wortlaut bleibt erhalten.
theological_decisions:
- issue: Reichweite von πᾶσιν ἀνθρώποις
  choice: allen Menschen
  alternative: Menschen aller Gruppen; jedem Menschen
  rationale: Die Übersetzung bewahrt die uneingeschränkte Weite der griechischen Formulierung, ohne festzulegen, ob damit jeder Einzelne ohne Ausnahme oder Menschen aus allen gesellschaftlichen Gruppen gemeint sind.
- issue: Syntaktische Zuordnung von σωτήριος und πᾶσιν ἀνθρώποις
  choice: Die erschienene Gnade wird als allen Menschen Rettung bringend beschrieben.
  alternative: Die rettende Gnade ist allen Menschen erschienen.
  rationale: σωτήριος bezieht sich grammatisch auf »Gnade«; der Dativ kann jedoch enger mit »rettend« oder mit »erschienen« verbunden werden. Die Hauptfassung folgt der naheliegenden Verbindung mit σωτήριος, während die Fußnote die andere mögliche Akzentsetzung offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Rettung« gibt σωτήριος transparent wieder; »allen Menschen« ist geschlechtsübergreifend und bewahrt die theologische Spannung des umfassenden Ausdrucks.
