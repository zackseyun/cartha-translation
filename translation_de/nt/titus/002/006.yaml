  variant: modern standard German
source:
  edition: SBLGNT
  text: Τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: de
  text: Ebenso ermahne die jüngeren Männer[a], besonnen zu sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die jungen Männer“. Das Griechische bezeichnet hier ausdrücklich jüngere männliche Personen, nicht allgemein junge Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich selbst zu beherrschen“ beziehungsweise „vernünftig zu handeln“. Das griechische Wort verbindet gesundes Urteilsvermögen mit disziplinierter Selbstbeherrschung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: die jüngeren Männer
  rationale: Der bestimmte Artikel mit dem maskulinen Plural bezeichnet im Zusammenhang ausdrücklich die jüngeren männlichen Mitglieder der Gemeinde. „Die jüngeren Männer“ bewahrt sowohl den Geschlechtsbezug als auch die Gegenüberstellung der Altersgruppen.
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Das Adverb knüpft diese Aufforderung an die vorangehenden, parallel aufgebauten Weisungen an und gibt den Zusammenhang knapp und natürlich wieder.
- source_word: παρακάλει
  choice: ermahne
  rationale: Der Präsensimperativ fordert Titus zu fortgesetztem eindringlichem Zuspruch auf. „Ermahne“ vermittelt diese auffordernde Bedeutung in einem würdigen, verständlichen Register.
- source_word: σωφρονεῖν
  choice: besonnen zu sein
  rationale: Das Verb umfasst vernünftiges Urteilen, innere Disziplin und beherrschtes Verhalten. „Besonnen“ bewahrt diese Bedeutungsbreite besser als eine ausschließlich auf Selbstkontrolle verengte Wiedergabe.
theological_decisions:
- issue: Geschlechtsbezug von νεωτέρους
  choice: ausdrücklicher Bezug auf jüngere Männer
  alternative: allgemeiner Bezug auf jüngere Menschen
  rationale: Im unmittelbaren Kontext werden Gruppen nach Alter und Geschlecht unterschieden angesprochen. Der maskuline Plural ist daher nicht stillschweigend zu verallgemeinern.
- issue: Bedeutungsbreite von σωφρονεῖν
  choice: besonnen sein
  alternative: sich selbst beherrschen
  rationale: Die Wiedergabe hält vernünftiges Urteilsvermögen und disziplinierte Selbstbeherrschung zusammen, ohne das Wort auf nur einen Aspekt festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau des griechischen Textes bleibt erhalten; „ermahne“ gibt den nachdrücklichen, fortlaufenden Auftrag wieder, während „besonnen“ die begriffliche Weite von σωφρονεῖν wahrt.
