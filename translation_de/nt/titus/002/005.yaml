base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: de
  text: besonnen, rein, im Haushalt tätig[a], gütig, sich ihren eigenen Ehemännern unterordnend[b], damit das Wort Gottes nicht geschmäht wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu Hause fleißig« oder »das Haus führend«. Das seltene griechische Wort bezeichnet die Beschäftigung mit den Arbeiten des Haushalts.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihren eigenen Ehemännern untergeordnet«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »verleumdet«; wörtlicher: »gelästert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: besonnen
  rationale: Das Wort bezeichnet vernünftige Selbstbeherrschung. »Besonnen« verbindet klares Urteilsvermögen mit beherrschtem Verhalten und passt natürlich in die Tugendaufzählung.
- source_word: ἁγνάς
  choice: rein
  rationale: Das Adjektiv bezeichnet hier vor allem sittliche Reinheit. »Rein« wahrt die Breite des Ausdrucks, ohne ihn auf sexuelle Keuschheit zu verengen.
- source_word: οἰκουργούς
  choice: im Haushalt tätig
  rationale: Das seltene Wort verbindet Haus und Arbeit und bezeichnet die aktive Wahrnehmung häuslicher Aufgaben. Die Formulierung bewahrt den Arbeitsaspekt, ohne ein Verbot außerhäuslicher Tätigkeit einzutragen.
- source_word: ἀγαθάς
  choice: gütig
  rationale: In dieser Tugendaufzählung bringt »gütig« die auf andere gerichtete ethische Qualität von ἀγαθός natürlicher zum Ausdruck als das sehr allgemeine »gut«.
- source_word: ὑποτασσομένας
  choice: untergeordnet
  rationale: Die Wiedergabe erhält den Gedanken einer relationalen Unterordnung und passt als Partizip beziehungsweise prädikative Eigenschaft in die Aufzählung, ohne ein umfassenderes Ehemodell auszudeuten.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: ihren eigenen Ehemännern
  rationale: ἀνήρ bedeutet im Zusammenhang »Ehemann«. »Eigenen« gibt ἰδίοις ausdrücklich wieder und begrenzt die Aussage auf die jeweilige Ehebeziehung.
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: Die Formulierung gibt den Zweck beziehungsweise das beabsichtigte Ergebnis idiomatisch und präzise wieder.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die etablierte Wendung ist unmittelbar verständlich und lässt offen, ob Gottes Botschaft allgemein oder besonders die verkündigte Heilsbotschaft gemeint ist.
- source_word: βλασφημῆται
  choice: verleumdet wird
  rationale: Das Verb bezeichnet hier ein herabsetzendes, rufschädigendes Reden über Gottes Wort. »Verleumdet« ist modernes Deutsch und vermittelt den öffentlichen Ansehensschaden; »gelästert« wäre formnäher, kann aber enger religiös verstanden werden.
theological_decisions:
- issue: Die häusliche Tätigkeit in οἰκουργούς wiedergeben, ohne eine Beschränkung auf das Haus zu behaupten
  choice: im Haushalt tätig
  alternative: das Haus führend; häuslich; zu Hause arbeitend
  rationale: Das Wort betont produktive Arbeit im häuslichen Bereich. Der Vers sagt nicht ausdrücklich, dass jede außerhäusliche Tätigkeit ausgeschlossen sei; eine solche Folgerung wird daher nicht in die Übersetzung aufgenommen.
- issue: Die eheliche Unterordnung ausdrücken, ohne ein konfessionelles Gesamtsystem einzutragen
  choice: ihren eigenen Ehemännern untergeordnet
  alternative: sich ihren eigenen Ehemännern unterordnend; ihren eigenen Ehemännern gegenüber gehorsam
  rationale: Die Übersetzung bewahrt die im griechischen Partizip ausgesagte relationale Ordnung. Sie erweitert diese Einzelaussage weder zu einer allgemeinen Unterordnung unter Männer noch zu einer näher bestimmten konfessionellen Lehre über Ehe und Geschlechterrollen.
- issue: βλασφημῆται bei Gottes Wort angemessen wiedergeben
  choice: verleumdet wird
  alternative: gelästert wird; geschmäht wird; in Verruf gebracht wird
  rationale: Gemeint ist, dass Gottes Wort durch das Verhalten seiner Anhängerinnen zum Ziel abwertender Rede werden kann. »Verleumdet« bewahrt diesen Gedanken, ohne das Verb ausschließlich als unmittelbare Gotteslästerung zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist als Fortsetzung der grammatischen Aufzählung aus dem vorangehenden Vers gestaltet. Fachsprachliche oder konfessionell geprägte Zusätze werden vermieden; die seltene Haushaltsbezeichnung und die möglichen Nuancen von Unterordnung und βλασφημεῖν werden in Fußnoten offengehalten.
