review_pass:
  verdict: revise
  source_fidelity: Die Tugendreihe und der Zweckssatz sind insgesamt treffend wiedergegeben. »Im Haushalt tätig« gibt οἰκουργούς sachgerecht als auf Hausarbeit bezogen wieder, ohne eine räumliche Absonderung zu behaupten. Für ὑποτασσομένας ist jedoch die reflexiv-partizipiale Wiedergabe genauer als das eher statische »untergeordnet«. βλασφημῆται umfasst über falsche Verleumdung hinaus auch Schmähung bzw. herabsetzende Rede; »geschmäht wird« wahrt diese weitere Bedeutung.
  naturalness: Der Satz ist als Fortsetzung der Aufzählung aus V. 4 gut lesbar und entspricht modernem, würdigem Standarddeutsch. »Sich ihren eigenen Ehemännern unterordnend« ist trotz der längeren Form in einer solchen Partizipialreihe natürlich und präziser.
  terminology: »Besonnen«, »rein«, »gütig« und »das Wort Gottes« sind angemessen. »Ihre eigenen Ehemänner« bewahrt die begrenzende Funktion von ἰδίοις. Die Revision vermeidet sowohl eine über das griechische Partizip hinausgehende theologische Ausgestaltung als auch die zu enge Behauptung, es gehe bei βλασφημεῖν notwendig um Verleumdung im strengen Sinn.
  issues:
  - severity: medium
    issue: »ihren eigenen Ehemännern untergeordnet«
    rationale: ὑποτασσομένας ist ein Partizip im Medium/Passiv und beschreibt im Kontext ein Sich-Unterordnen. »Untergeordnet« kann im Deutschen stärker einen bloßen Status oder eine institutionelle Rangordnung bezeichnen. Die reflexive Partizipialform bildet die griechische Aussage genauer ab.
  - severity: medium
    issue: »nicht verleumdet wird«
    rationale: βλασφημῆται kann Verleumdung einschließen, bezeichnet aber weiter gefasst Schmähung, Beschimpfung oder abwertende Rede. »Verleumden« legt im Deutschen relativ stark eine falsche Tatsachenbehauptung nahe. »Geschmäht« erhält die semantische Breite besser.
  - severity: low
    issue: Fußnote b entspricht nach der Revision der Hauptlesart
    rationale: Wenn die Hauptübersetzung »sich ... unterordnend« lautet, muss die lexikalische Alternative entsprechend angepasst werden, damit Anker und Fußnoteninhalt konsistent bleiben.
  revised_text: besonnen, rein, im Haushalt tätig[a], gütig, sich ihren eigenen Ehemännern unterordnend[b], damit das Wort Gottes nicht geschmäht wird.[c]
