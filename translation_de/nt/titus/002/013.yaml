    issue: Die alternative Fußnote lässt »das Erscheinen« aus.
    rationale: Die alternative Konstruktion betrifft die Referenz bzw. Zuordnung von »Gott« und »Retter«, nicht das Auslassen von ἐπιφάνειαν. Die Fußnote sollte daher die vollständige einschlägige Wortgruppe wiedergeben.
  - severity: low
    issue: »glückselige Hoffnung« ist unnötig altertümlich.
    rationale: »Selig« gibt μακαρίαν in diesem eschatologischen Kontext idiomatischeres modernes Standarddeutsch wieder, ohne die gehobene Aussage abzuschwächen.
  revised_text: während wir auf die selige Hoffnung und auf das Erscheinen der Herrlichkeit unseres großen Gottes und Retters Jesus, des Messias, warten.
