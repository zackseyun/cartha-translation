id: TIT.2.13
reference: Titus 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: de
  text: während wir auf die selige Hoffnung und auf das Erscheinen der Herrlichkeit unseres großen Gottes und Retters Jesus, des Messias, warten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: während wir … warten
  rationale: Gibt die fortdauernde, erwartungsvolle Haltung des Partizips natürlich wieder und lässt den Anschluss an den vorhergehenden Satz erkennen.
- source_word: μακαρίαν ἐλπίδα
  choice: die glückselige Hoffnung
  rationale: „Glückselig“ wahrt das eschatologische Gewicht von μακάριος; „glücklich“ wäre hier zu alltäglich.
- source_word: ἐπιφάνειαν
  choice: Erscheinen
  rationale: Bezeichnet hier das sichtbare Offenbarwerden und ist im modernen Deutsch verständlicher als „Epiphanie“.
- source_word: δόξης
  choice: Herrlichkeit
  rationale: Bewahrt den Genitiv und damit die mögliche Vorstellung, dass die Herrlichkeit sichtbar erscheint.
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: unseres großen Gottes und Retters
  rationale: Die gemeinsame Artikelkonstruktion wird als einheitliche Bezeichnung einer Person wiedergegeben.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός wird als Titel mit „Messias“ übersetzt; der Genitiv entspricht der appositionellen Einbindung in die griechische Konstruktion.
theological_decisions:
- issue: Bezeichnen „Gott“ und „Retter“ eine einzige Person, Jesus, oder zwei verschiedene Personen?
  choice: Die Hauptübersetzung versteht „unser großer Gott und Retter“ als eine einheitliche Bezeichnung für Jesus, den Messias.
  alternative: „die Herrlichkeit des großen Gottes und unseres Retters Jesus, des Messias“
  rationale: Ein einziger Artikel steht vor den beiden singularischen Personenbezeichnungen θεοῦ und σωτῆρος; anschließend nennt Ἰησοῦ Χριστοῦ den gemeinsamen Bezug. Daher ist die Ein-Personen-Deutung grammatisch am naheliegendsten. Die weniger wahrscheinliche Zwei-Personen-Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „auf“ erleichtert das Verständnis der beiden koordinierten Erwartungsgegenstände. „Glückselig“ ist bewusst gehobener, aber im biblisch-eschatologischen Zusammenhang noch verständlich. Die Genitivapposition „Jesus, des Messias“ ist formal und wahrt die Ausgangskonstruktion.
