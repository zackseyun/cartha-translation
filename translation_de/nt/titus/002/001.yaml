  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: de
  text: Du aber rede von dem, was der gesunden Lehre entspricht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… der gesunden Unterweisung entspricht.“'
    reason: διδασκαλία kann sowohl den Inhalt der Lehre als auch die Unterweisung bezeichnen; πρέπω meint, was angemessen ist beziehungsweise dazu passt.
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Du aber
  rationale: Das ausdrücklich gesetzte Pronomen Σὺ trägt zusammen mit δέ einen deutlichen Kontrast zu den zuvor genannten Irrlehrern. „Du aber“ gibt diesen Gegensatz knapp und natürlich wieder.
- source_word: λάλει
  choice: sollst sagen
  rationale: Der Präsensimperativ fordert Titus zum fortgesetzten Reden auf. „Sollst sagen“ wahrt den allgemeinen Charakter des Verbs, ohne es auf formalen Unterricht zu verengen.
- source_word: ἃ πρέπει
  choice: was … entspricht
  rationale: πρέπει bezeichnet hier das, was angemessen ist oder zu etwas passt. Die Wendung „was … entspricht“ ist im Deutschen idiomatisch und drückt diese sachliche Übereinstimmung klar aus.
- source_word: ὑγιαινούσῃ
  choice: gesunden
  rationale: Das Partizip verwendet Gesundheit metaphorisch für Verlässlichkeit und Unverdorbenheit. „Gesund“ bewahrt dieses im Titusbrief wiederkehrende Bild.
- source_word: διδασκαλίᾳ
  choice: Lehre
  rationale: διδασκαλία kann sowohl das Lehren als auch dessen Inhalt bezeichnen. „Lehre“ ist hier natürlich, verständlich und lässt diese inhaltliche Dimension bestehen.
theological_decisions:
- issue: Wiedergabe von τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: der gesunden Lehre
  alternative: der heilsamen Unterweisung
  rationale: „Gesunde Lehre“ bewahrt die Gesundheitsmetapher und bezeichnet zuverlässige apostolische Unterweisung, ohne den Ausdruck durch konfessionelle Zusätze näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Kontrast wird durch „Du aber“ hervorgehoben; die Formulierung bleibt knapp und für eine öffentliche Lesung geeignet.
