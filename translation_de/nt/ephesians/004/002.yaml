source:
  edition: SBLGNT
  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: de
  text: mit aller Demut und Sanftmut, mit Geduld, indem ihr einander in Liebe ertragt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: mit aller
  rationale: μετά mit dem Genitiv bezeichnet hier Begleitung oder Haltung; πάσης verstärkt die folgende Eigenschaft umfassend. „Mit aller“ ist im Deutschen natürlich und nah an der griechischen Formulierung.
- source_word: ταπεινοφροσύνης
  choice: Demut
  rationale: Das Substantiv bezeichnet eine demütige Haltung oder Niedriggesinntheit. „Demut“ ist die klare, gegenwärtige und würdige deutsche Entsprechung.
- source_word: πραΰτητος
  choice: Sanftmut
  rationale: πραΰτης bezeichnet milde, beherrschte Stärke. „Sanftmut“ ist in diesem ethischen Zusammenhang präziser als bloße „Freundlichkeit“ und im heutigen Deutsch weiterhin verständlich.
- source_word: μακροθυμίας
  choice: Geduld
  rationale: Das Wort bezeichnet lang anhaltende Geduld gegenüber Menschen, besonders die Bereitschaft, nicht schnell zornig zu werden. „Geduld“ gibt dies natürlich wieder.
- source_word: ἀνεχόμενοι
  choice: ertragt
  rationale: Das Präsenspartizip beschreibt fortdauerndes gegenseitiges Aushalten und Nachsicht. Wegen des Satzanschlusses an die Aufforderung in Vers 1 wird es im Deutschen natürlich als Imperativ wiedergegeben, ohne den fortdauernden Sinn aufzuheben.
- source_word: ἀλλήλων
  choice: einander
  rationale: Das reziproke Pronomen wird knapp und idiomatisch mit „einander“ wiedergegeben.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: ἐν mit dem Dativ bezeichnet wahrscheinlich die Sphäre oder Art des gegenseitigen Ertragens. „In Liebe“ bewahrt diese Offenheit und gibt ἀγάπη direkt wieder.
theological_decisions:
- issue: Wiedergabe von ἀγάπη
  choice: Liebe
  alternative: Nächstenliebe
  rationale: „Liebe“ entspricht dem griechischen Begriff unmittelbar und lässt den vom Kontext bestimmten Umfang offen. „Nächstenliebe“ würde den Ausdruck unnötig spezifizieren.
- issue: Syntaktische Funktion von ἀνεχόμενοι
  choice: 'als weiterführende Aufforderung: „ertragt“'
  alternative: 'partizipial: „einander ertragend“ oder modal: „indem ihr einander ertragt“'
  rationale: Das griechische Partizip hängt von der Aufforderung in Vers 1 ab und kann modal oder imperativisch verstanden werden. Der deutsche Imperativ bildet den ermahnenden Zusammenhang natürlich ab, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die traditionellen ethischen Begriffe „Demut“ und „Sanftmut“ bleiben erhalten, da sie präzise und weiterhin verständlich sind. Das Semikolon macht den Übergang von den begleitenden Haltungen zur gegenseitigen Handlung lesbar.
