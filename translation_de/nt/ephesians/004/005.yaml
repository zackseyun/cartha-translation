  text: one Lord[a], one faith, one baptism;
translation:
  language: de
  text: ein Herr, ein Glaube, eine Taufe;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: ein / eine
  rationale: Die drei Genusformen desselben Zahlworts werden jeweils mit „ein/eine“ wiedergegeben. So bleiben die dreigliedrige Parallelstruktur und die Betonung der Einheit erhalten.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist hier die natürliche Wiedergabe des christologischen Titels und bezeichnet im Zusammenhang von Epheser 4,4–6 am ehesten Jesus Christus.
- source_word: πίστις
  choice: Glaube
  rationale: „Glaube“ bezeichnet hier am ehesten den gemeinsamen Glauben beziehungsweise die glaubende Bindung, welche die Gemeinde eint. Die möglichen Bedeutungen „Vertrauen“ und „Treue“ werden nicht ausgeschlossen, sind in diesem knappen Einheitsbekenntnis jedoch weniger wahrscheinlich.
- source_word: βάπτισμα
  choice: Taufe
  rationale: „Taufe“ ist die präzise und allgemein verständliche Bezeichnung für den mit βάπτισμα benannten Initiationsakt; die Übersetzung legt weder Taufweise noch Taufwirkung fest.
theological_decisions:
- issue: Bezug von „Herr“
  choice: „Herr“ bleibt als christologischer Titel stehen und bezieht sich im Zusammenhang am ehesten auf Jesus Christus.
  alternative: Eine allgemeinere Bezeichnung Gottes.
  rationale: Die Folge „ein Geist“ (Vers 4), „ein Herr“ (Vers 5) und „ein Gott und Vater“ (Vers 6) legt den Bezug auf den Sohn nahe, ohne dass die Übersetzung den Namen ergänzen muss.
- issue: Bedeutung von „eine Taufe“
  choice: Neutral als „eine Taufe“ wiedergegeben.
  alternative: Eine ausdrücklich sakramentale Deutung oder eine vorwiegend metaphorische beziehungsweise geistliche Taufe.
  rationale: Der Vers betont die Einheit, entscheidet aber nicht über Taufweise, Taufwirkung oder konfessionelle Tauftheologien.
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch. Die asyndetische Dreierformel und die wiederholte Zahl „ein/eine“ werden ohne erklärende Zusätze bewahrt. Keine Fußnote ist nötig, da „Glaube“ im Kontext die hinreichend klare und wahrscheinlichste Wiedergabe ist.
