id: EPH.4.32
reference: Ephesians 4:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: de
  text: Seid freundlich zueinander und mitfühlend. Vergebt einander, wie auch Gott euch im Messias vergeben hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch übersetzt: »in Christus«.'
    reason: alternative_rendering
lexical_decisions:
- source_word: γίνεσθε
  choice: Seid
  rationale: Der präsentische Imperativ fordert zu einer fortdauernden Haltung auf; „Seid“ ist im Deutschen natürlich und bewahrt den Aufforderungscharakter.
- source_word: εἰς ἀλλήλους
  choice: zueinander
  rationale: Gibt die wechselseitige Ausrichtung der Haltung knapp und idiomatisch wieder.
- source_word: χρηστοί
  choice: freundlich
  rationale: Passt zum zwischenmenschlichen Mahnkontext und ist für heutige Leser unmittelbar verständlich.
- source_word: εὔσπλαγχνοι
  choice: mitfühlend
  rationale: Bezeichnet herzliches Erbarmen und innere Anteilnahme; „mitfühlend“ klingt natürlich, ohne mit „freundlich“ zusammenzufallen.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: Vergebt einander
  rationale: Im Kontext bezeichnet χαρίζομαι das Vergeben von Verfehlungen; das formal reflexive ἑαυτοῖς hat hier reziproke Bedeutung.
- source_word: καθὼς καὶ
  choice: wie auch
  rationale: Bewahrt sowohl den Vergleich als auch die durch καί ausgedrückte Entsprechung in natürlichem Deutsch.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Bewahrt die Präposition ἐν und gibt Χριστός als Titel mit „Messias“ wieder.
- source_word: ἐχαρίσατο ὑμῖν
  choice: euch … vergeben hat
  rationale: Gibt den abgeschlossenen Akt der Vergebung idiomatisch und direkt wieder.
theological_decisions:
- issue: Wiedergabe von ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus; durch den Messias
  rationale: „Im Messias“ hält die enge Verbindung mit ἐν formal offen und gibt Χριστός als Titel wieder, ohne die Beziehung vorschnell instrumental als „durch“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert. „Vielmehr“ nimmt den Gegensatz zum vorangehenden Vers auf, den das einleitende καί im Zusammenhang fortführt.
