    rationale: „Durch“ ist eine interpretierende Instrumentalangabe, während ἐν hier formal mit „im“ wiedergegeben wird. Als alternative Übersetzung sollte die Fußnote auf die etablierte Wiedergabe „in Christus“ beschränkt bleiben.
