source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: de
  text: Darum ermahne ich euch – ich, der Gefangene im Herrn[a] –, so zu leben, wie es der Berufung entspricht, zu der ihr berufen worden seid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Gefangene des Herrn«; oder: »der Gefangene um des Herrn willen«.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »würdig der Berufung zu wandeln, mit der ihr berufen wurdet«; gemeint ist eine Lebensführung, die dieser Berufung entspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ermahne
  rationale: Das Verb bezeichnet hier einen nachdrücklichen pastoralen Appell. »Ermahnen« bewahrt den auffordernden Ernst, ohne den Ton unnötig zu verschärfen.
- source_word: οὖν
  choice: Darum
  rationale: Das Wort zieht eine Folgerung aus dem vorausgehenden Gedankengang und leitet den praktischen Teil des Briefes ein. »Darum« stellt diesen Zusammenhang in natürlichem Deutsch her.
- source_word: δέσμιος
  choice: Gefangene
  rationale: δέσμιος bezeichnet unmittelbar einen Gefangenen. Diese Wiedergabe ist klar und vermeidet eine ausdeutende Umschreibung.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die formal entsprechende Wendung bewahrt die für Paulus charakteristische Weite der Beziehung zum Herrn, ohne sie auf Besitz, Ursache oder Zweck festzulegen.
- source_word: ἀξίως
  choice: so …, wie es … entspricht
  rationale: ἀξίως bezeichnet eine Lebensführung, die der empfangenen Berufung angemessen ist. Die deutsche Wendung gibt diesen Sinn natürlich wieder und vermeidet das heute leicht missverständliche »würdig leben«.
- source_word: περιπατῆσαι
  choice: so zu leben
  rationale: Das griechische »gehen/wandeln« ist eine Metapher für die Lebensführung. »Leben« vermittelt ihren gemeinten Sinn in heutigem Standarddeutsch; die Bildlichkeit wird in einer Fußnote kenntlich gemacht.
- source_word: κλήσεως
  choice: Berufung
  rationale: κλῆσις bezeichnet hier Gottes Ruf und die dadurch bestimmte Stellung und Lebensausrichtung der Glaubenden. »Berufung« ist sachgerecht und im Deutschen etabliert.
- source_word: ἧς ἐκλήθητε
  choice: zu der ihr berufen worden seid
  rationale: Die Formulierung gibt den Bezug zwischen Gottes Berufung und dem Berufensein idiomatisch wieder. Das Passiv des griechischen Textes bleibt erhalten.
theological_decisions:
- issue: Bedeutung von ὁ δέσμιος ἐν κυρίῳ
  choice: der Gefangene im Herrn
  alternative: der Gefangene des Herrn; der Gefangene um des Herrn willen
  rationale: Die Übersetzung bewahrt die griechische Präpositionalwendung und legt nicht fest, ob vor allem Zugehörigkeit, Ursache oder die geistliche Verbundenheit mit dem Herrn gemeint ist.
- issue: Verhältnis von Berufung und Lebensführung
  choice: so zu leben, wie es der Berufung entspricht
  alternative: der Berufung würdig zu leben
  rationale: Die gewählte Fassung bewahrt den Maßstab der Berufung, vermeidet aber den möglichen Eindruck, die Angesprochenen müssten sich die Berufung durch persönliche Würdigkeit verdienen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt Paulus’ Selbstbezeichnung hervor, ohne die Satzführung zu verdunkeln. Die traditionelle Metapher »wandeln« wird im Haupttext zugunsten unmittelbarer Verständlichkeit mit »leben« wiedergegeben und in Fußnote [b] dokumentiert.
