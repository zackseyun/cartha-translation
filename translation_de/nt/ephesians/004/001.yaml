  source_fidelity: 'Die Übersetzung bildet die syntaktischen und semantischen Kernelemente des griechischen Textes zuverlässig ab: οὖν als folgerndes »Darum«, παρακαλῶ als nachdrückliches »ermahne«, die Selbstbezeichnung als »der Gefangene im Herrn«, den Maßstab einer der κλῆσις entsprechenden Lebensführung sowie das passive »berufen worden seid«. Die offene Nuance von ἐν κυρίῳ bleibt erhalten.'
