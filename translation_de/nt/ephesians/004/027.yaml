lexical_decisions:
- source_word: μηδὲ
  choice: Und … keinen
  rationale: Die Konjunktion führt die vorangehenden Ermahnungen weiter. Im Deutschen gibt „und“ diesen Anschluss natürlich wieder; die Verneinung wird idiomatisch durch „keinen“ beim Objekt ausgedrückt.
- source_word: δίδοτε
  choice: gebt
  rationale: Der Imperativ von δίδωμι bedeutet hier schlicht „geben“ und bildet mit „Raum“ auch im Deutschen eine verständliche Wendung.
- source_word: τόπον
  choice: Raum
  rationale: τόπος bedeutet wörtlich „Ort“ oder „Platz“ und bezeichnet in dieser Wendung den Handlungsspielraum, der jemandem eingeräumt wird. „Raum geben“ bewahrt das Bild und klingt im modernen Deutschen natürlich; „Gelegenheit“ wird als sinngemäße Alternative in der Fußnote genannt.
- source_word: τῷ διαβόλῳ
  choice: dem Teufel
  rationale: Der Ausdruck bezeichnet hier mit Artikel den persönlichen Widersacher. „Dem Teufel“ ist die übliche und kontextgemäße deutsche Wiedergabe.
theological_decisions:
- issue: Ob διάβολος als Gattungsbezeichnung („Verleumder“) oder als Bezeichnung des persönlichen Bösen wiederzugeben ist
  choice: dem Teufel
  alternative: dem Verleumder
  rationale: Im Zusammenhang der paulinischen Ermahnung bezeichnet der Ausdruck sehr wahrscheinlich den persönlichen Widersacher. Die Übersetzung benennt diesen naheliegenden Bezug, ohne den Text auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Wendung „jemandem Raum geben“ bewahrt das griechische Bild und bleibt zugleich allgemein verständlich.
