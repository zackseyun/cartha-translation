  text: and to be renewed in the spirit of your mind,[a]
translation:
  language: de
  text: und im Geist eures Denkens erneuert zu werden,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Geist eures Denkens“. Wahrscheinlicher bezeichnet die Wendung die innere Haltung oder Ausrichtung eures Denkens und nicht unmittelbar den Heiligen Geist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: erneuert zu werden
  rationale: Der Präsens-Passiv-Infinitiv wird als Passiv bewahrt und fügt sich natürlich in die Infinitivfolge des Zusammenhangs ein. Der durative Aspekt kann einen fortlaufenden Vorgang nahelegen, muss aber im Haupttext nicht eigens ergänzt werden.
- source_word: δὲ
  choice: und
  rationale: δέ verbindet hier als milde Fortführung die Infinitive der Aussage; „und“ gibt den Zusammenhang wieder, ohne einen zu starken Gegensatz einzutragen.
- source_word: τῷ πνεύματι
  choice: im Geist
  rationale: 'Der Dativ wird am ehesten als Bereich oder Hinsicht verstanden: Die Erneuerung geschieht „im Geist“ des Denkens. Die Kleinschreibung wäre im Deutschen ebenfalls möglich; „Geist“ bleibt jedoch semantisch offen und die Fußnote erläutert die mögliche Beziehung zum Heiligen Geist.'
- source_word: νοὸς
  choice: Denkens
  rationale: νοῦς bezeichnet Verstand, Sinn oder Denkvermögen. „Denken“ ergibt in der Genitivverbindung ein natürliches modernes Deutsch und bewahrt die innere Ausrichtung, ohne den Ausdruck zu paraphrasieren.
- source_word: ὑμῶν
  choice: eures
  rationale: Das Possessivpronomen gibt die zweite Person Plural wieder und stimmt mit dem substantivierten Neutrum „Denken“ überein.
theological_decisions:
- issue: Ob πνεύματι den Heiligen Geist oder den menschlichen Geist beziehungsweise die innere Ausrichtung bezeichnet
  choice: „im Geist eures Denkens“ als vorwiegend anthropologische Wendung
  alternative: „durch den Geist in eurem Denken“ als unmittelbarer Bezug auf den Heiligen Geist
  rationale: Der Genitiv τοῦ νοὸς ὑμῶν bestimmt πνεύματι am natürlichsten als den inneren Geist beziehungsweise die Ausrichtung des Denkens. Die ungewöhnliche Formulierung bleibt erhalten, während die Fußnote die mögliche pneumatologische Lesart offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktisch dichte Wendung „im Geist eures Denkens“ wahrt die Bild- und Begriffsspannung des griechischen Textes; die Verbindung mit dem vorhergehenden Vers wird durch „und“ erhalten.
