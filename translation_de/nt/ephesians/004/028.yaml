source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: de
  text: Wer stiehlt, soll nicht länger stehlen, sondern vielmehr hart arbeiten und mit eigenen Händen etwas Gutes schaffen,[a] damit er etwas hat, das er mit dem Bedürftigen teilen kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit eigenen Händen arbeiten und das Gute tun«; auch: »mit eigenen Händen etwas Gutes erarbeiten«.'
    reason: ἐργαζόμενος mit τὸ ἀγαθόν kann produktive, gute Arbeit meinen oder weiter gefasst das Tun dessen, was gut ist.
  - marker: b
    text: 'Oder: »damit er dem, der Bedarf hat, etwas weitergeben kann«; auch: »mit dem, der in Not ist«.'
    reason: μεταδίδωμι bedeutet »teilen«, »weitergeben« oder »abgeben«. Die Dativgruppe bezeichnet die Person, die Bedarf hat, als Empfänger bzw. Teilhaber.
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: Wer stiehlt
  rationale: Das substantivierte Präsenspartizip bezeichnet eine Person, die stiehlt; die deutsche Wer-Konstruktion ist natürlich und bewahrt den verbalen Charakter, ohne die Person fest als »Dieb« zu etikettieren.
- source_word: μηκέτι κλεπτέτω
  choice: soll nicht länger stehlen
  rationale: »Nicht länger« drückt die Beendigung der bisherigen Praxis aus; »soll« gibt den Imperativ der dritten Person in modernem Deutsch angemessen wieder.
- source_word: μᾶλλον δὲ κοπιάτω
  choice: sondern sich vielmehr abmühen
  rationale: Die Formulierung erhält den starken korrektiven Gegensatz und die mit κοπιάω verbundene Vorstellung anstrengender Arbeit.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: und mit den eigenen Händen das Gute erarbeiten
  rationale: Die Wiedergabe verbindet das Mittel persönlicher Arbeit mit dem substantivierten τὸ ἀγαθόν. »Das Gute erarbeiten« bewahrt die mögliche moralische und nützliche Bedeutung, ohne sie auf ein bestimmtes Handwerk einzuengen.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: damit er etwas hat, das er … teilen kann
  rationale: Die Zweckbeziehung bleibt ausdrücklich erhalten. »Etwas« wird im Deutschen idiomatisch ergänzt und bezeichnet die durch Arbeit verfügbaren Mittel.
- source_word: τῷ χρείαν ἔχοντι
  choice: mit dem Bedürftigen
  rationale: Die substantivische Wiedergabe bezeichnet den Menschen, der Bedarf hat, knapp und verständlich; die weniger etikettierende Umschreibung steht in der Fußnote.
theological_decisions:
- issue: Ethischer Zweck der Arbeit
  choice: Ehrliche Arbeit ersetzt das Stehlen und schafft die Möglichkeit, Bedürftige zu unterstützen.
  alternative: Der Schwerpunkt liegt ausschließlich auf Selbstversorgung oder auf Wiedergutmachung.
  rationale: Der ausdrückliche Zwecksatz richtet den Ertrag der Arbeit auf das Teilen mit einem bedürftigen Menschen. Selbstversorgung mag vorausgesetzt sein; Wiedergutmachung wird hier jedoch nicht ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wer-Konstruktion vermeidet eine unnötig starre Personenbezeichnung. »Sich abmühen« erhält die kräftige Arbeitsnuance; die Fußnoten dokumentieren die echte lexikalisch-syntaktische Offenheit bei τὸ ἀγαθόν und μεταδιδόναι.
