    issue: »das Gute erarbeiten«
    rationale: Die Formulierung ist im Deutschen ungewohnt und kann den Sinn von τὸ ἀγαθόν verschieben. »Etwas Gutes schaffen« gibt die offene Bedeutung von gut/nützlich und den Zusammenhang mit eigener Arbeit idiomatischer wieder.
  - severity: low
