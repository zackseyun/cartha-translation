    rationale: Dies ist keine hilfreiche wörtliche deutsche Entsprechung der griechischen Dativkonstruktion. Der Dativ kann bei μεταδιδόναι den Empfänger bezeichnen, während »teilen mit« im Deutschen den Gedanken des Teilhabens natürlich ausdrückt.
