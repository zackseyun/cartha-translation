revisions:
- from: Wer stiehlt, soll nicht länger stehlen, sondern sich vielmehr abmühen und mit den eigenen Händen das Gute erarbeiten,[a] damit er etwas hat, das er mit dem Bedürftigen teilen kann.[b]
  to: Wer stiehlt, soll nicht länger stehlen, sondern vielmehr hart arbeiten und mit eigenen Händen etwas Gutes schaffen,[a] damit er etwas hat, das er mit dem Bedürftigen teilen kann.[b]
  rationale: Die Revision ersetzt die missverständliche und weniger idiomatische Verbindung »das Gute erarbeiten« durch eine natürliche Formulierung, die die Anstrengung der Arbeit und ihre gute bzw. nützliche Frucht wahrt. Die Fußnote zur Dativgruppe wird sprachlich und grammatisch präzisiert. Aussagegehalt, Ambiguität und Fußnotenanker bleiben erhalten.
