  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: de
  text: Kein faules Wort soll aus eurem Mund kommen,[a] sondern nur ein gutes Wort, das dem jeweiligen Bedarf entsprechend aufbaut,[b] damit es denen, die zuhören, Gnade schenkt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Kein faules Wort«. Gemeint sein kann auch: keine verdorbene oder schädliche Rede.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das zum Aufbau dient, wie es die jeweilige Situation erfordert«. Die griechische Wendung ist knapp und kann den Bedarf oder die passende Gelegenheit betonen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »damit es denen, die zuhören, guttut«. Das griechische Wort kann »Gnade«, »Wohltat« oder »Nutzen« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: kein faules Wort
  rationale: 'Unter der Verneinung hat πᾶς mit dem Singular distributiven Sinn: kein einziges. »Faul« bewahrt das anschauliche Bild von σαπρός; »Wort« bezeichnet hier eine Äußerung bzw. Rede.'
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: soll aus eurem Mund kommen
  rationale: Die prohibitive Imperativkonstruktion wird im Deutschen natürlich mit »soll ... nicht/kein ...« wiedergegeben. Der kollektive Singular »Mund« bewahrt die griechische Körpermetapher.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: sondern nur eines, das gut ist
  rationale: Die elliptische Gegenüberstellung wird für natürliches Deutsch ergänzt; »eines« greift »Wort« auf, und »nur« macht den ausschließenden Kontrast deutlich.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: das ... dem jeweiligen Bedarf entsprechend aufbaut
  rationale: »Aufbauen« bewahrt die Metapher von οἰκοδομή. Die gedrängte Genitivverbindung lässt sich als Aufbau verstehen, der sich nach dem konkreten Bedarf richtet; »jeweilig« zeigt den situativen Charakter, ohne χρεία bloß mit »Gelegenheit« gleichzusetzen.
- source_word: ἵνα δῷ χάριν
  choice: damit es ... Gnade vermittelt
  rationale: »Gnade« wahrt die theologische und zwischenmenschliche Bedeutungsweite von χάρις. »Vermittelt« ist im Deutschen idiomatischer als »Gnade gibt«, ohne die Aussage auf bloßen Nutzen zu verengen.
- source_word: τοῖς ἀκούουσιν
  choice: denen, die zuhören
  rationale: Die präsentische Partizipialform bezeichnet die jeweils Hörenden. »Zuhören« klingt im Deutschen in diesem Redezusammenhang natürlicher als das bloße »hören«.
theological_decisions:
- issue: Bedeutung von χάρις in einer ethischen Ermahnung
  choice: Gnade
  alternative: Nutzen oder Wohltat
  rationale: Der Zusammenhang erlaubt den Sinn einer wohltuenden Wirkung auf die Hörenden, doch »Gnade« bewahrt zugleich Paulus’ charakteristische Wortwahl und die bewusst offene religiös-zwischenmenschliche Resonanz. Die Formulierung behauptet nicht eigens, menschliche Rede spende rettende Gnade.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kräftige Bild »faules Wort« und die Baumetapher »aufbauen« bleiben erhalten. Die kompakte griechische Wendung πρὸς οἰκοδομὴν τῆς χρείας wird lesbar entfaltet, während eine Fußnote ihre syntaktische und semantische Offenheit festhält.
