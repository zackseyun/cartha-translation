  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: de
  text: wenn ihr ihn denn gehört habt[a] und in ihm unterwiesen worden seid, wie die Wahrheit in Jesus ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihm gehört habt“. Wörtlicher heißt es im Griechischen „ihn gehört habt“; möglicherweise ist gemeint, dass sie in der apostolischen Verkündigung Christus selbst hörten.'
    reason: alternative_reading
  - marker: b
    text: „In ihm“ und „in Jesus“ können eine Sphäre, Verbundenheit oder enge Beziehung bezeichnen; das Griechische ist weiter gefasst als ein bloßes „durch ihn“.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: wenn … denn
  rationale: Die bedingte Form und die leicht bekräftigende Kraft von γε bleiben erhalten, ohne sie eindeutig kausal als „da ja“ aufzulösen.
- source_word: αὐτὸν ἠκούσατε
  choice: ihr ihn … gehört habt
  rationale: Der direkte Akkusativ wird unmittelbar wiedergegeben. So bleibt die auffällige Aussage erhalten, dass die Adressaten Christus selbst gehört haben; die idiomatische Deutung „von ihm gehört“ wird in der Fußnote genannt.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Wiedergabe bewahrt die mögliche Bedeutung von Sphäre, Verbundenheit oder enger Beziehung und verengt die Wendung nicht auf Urheberschaft.
- source_word: ἐδιδάχθητε
  choice: unterrichtet worden seid
  rationale: Das Passiv des Aorists wird klar und in natürlichem modernem Deutsch wiedergegeben.
- source_word: καθώς
  choice: wie es … entspricht
  rationale: Im Deutschen stellt diese Formulierung den sachlichen Bezug zwischen dem Unterricht und der Wahrheit in Jesus natürlich her, ohne den Vergleich aufzugeben.
- source_word: ἀλήθεια
  choice: der Wahrheit
  rationale: Der deutsche Satzbau verlangt hier den bestimmten Artikel; semantisch bleibt „Wahrheit“ erhalten, nicht die interpretierende Alternative „Wirklichkeit“.
- source_word: ἐν τῷ Ἰησοῦ
  choice: in Jesus
  rationale: Der persönliche Name und die offene räumlich-relationale Formulierung des Griechischen werden bewahrt.
theological_decisions:
- issue: Bedeutung von αὐτὸν ἠκούσατε
  choice: ihn gehört
  alternative: von ihm gehört
  rationale: Der direkte Akkusativ spricht für die formal nähere Wiedergabe. Sie lässt den Gedanken zu, dass Christus in der apostolischen Verkündigung selbst gehört wurde, ohne dies im Haupttext auszudeuten.
- issue: Bedeutung der wiederholten ἐν-Wendungen
  choice: in ihm / in Jesus
  alternative: durch ihn / in Verbundenheit mit Jesus
  rationale: Die gewählte Fassung erhält die paulinische Mehrdeutigkeit zwischen Sphäre, Verbundenheit und enger Beziehung und reduziert die Wendungen weder auf Mittel noch Urheberschaft.
- issue: Syntaktischer Bezug von καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ
  choice: wie es der Wahrheit entspricht, die in Jesus ist
  alternative: wie Wahrheit in Jesus ist
  rationale: Die natürliche deutsche Form macht den Bezug zur vorausgehenden Unterweisung verständlich, während sie ausdrücklich festhält, dass die Wahrheit „in Jesus“ ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche direkte Formulierung „ihn gehört“ sowie beide Wendungen mit „in“ bleiben bewusst erhalten; der etwas komplexe Schluss wird für deutsche Leser syntaktisch geglättet, ohne die Aussage „Wahrheit … in Jesus“ aufzulösen.
