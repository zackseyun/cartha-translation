translation:
  language: de
  text: Sie sind innerlich abgestumpft[a] und haben sich der Zügellosigkeit[b] hingegeben, um voller Gier[c] jede Art von Unreinheit auszuüben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie haben jedes Empfinden verloren; oder: Sie sind völlig gefühllos geworden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Ausschweifung; oder: schamloses Verhalten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: in Habgier; das Wort kann auch unersättliches Verlangen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Sie
  rationale: Das Relativpronomen verweist auf die zuvor genannten Menschen. Da der Vers im Deutschen als eigenständiger Satz wiedergegeben wird, stellt „Sie“ den Rückbezug natürlich und ohne zusätzliche Hervorhebung her.
- source_word: ἀπηλγηκότες
  choice: innerlich abgestumpft
  rationale: Das Perfektpartizip bezeichnet einen eingetretenen Zustand der Unempfindlichkeit. „Innerlich abgestumpft“ macht im Zusammenhang die moralische Unempfindlichkeit deutlich, ohne den Ausdruck auf bloße Gefühllosigkeit zu verengen.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: haben sich … hingegeben
  rationale: Die reflexive Konstruktion bezeichnet eine bewusste Selbstüberlassung. „Sich hingeben“ ist im modernen Deutschen natürlich und bewahrt den Aspekt freiwilligen Sich-Auslieferns.
- source_word: τῇ ἀσελγείᾳ
  choice: der Zügellosigkeit
  rationale: ἀσέλγεια bezeichnet schamlose, ungehemmte Selbstbefriedigung, häufig mit sexueller Färbung. „Zügellosigkeit“ bewahrt die mögliche Breite des Begriffs.
- source_word: εἰς ἐργασίαν
  choice: um … auszuüben
  rationale: Die Wendung bezeichnet hier die Betätigung oder Praxis und hat Zweck- beziehungsweise Ergebnischarakter. Die Infinitivkonstruktion ist im Deutschen idiomatisch.
- source_word: ἀκαθαρσίας πάσης
  choice: jede Art von Unreinheit
  rationale: Die Formulierung gibt die umfassende Reichweite von πάσης natürlich wieder und vermeidet das schwerfällige „jede Unreinheit“.
- source_word: ἐν πλεονεξίᾳ
  choice: voller Gier
  rationale: πλεονεξία bezeichnet das verlangende Mehrhabenwollen und kann hier die Art und Weise der unreinen Praxis bestimmen. „Voller Gier“ erhält diese Bedeutung, ohne sie auf finanziellen Geiz zu beschränken.
theological_decisions:
- issue: Moralisch-psychologische Bedeutung von ἀπηλγηκότες
  choice: Als innere beziehungsweise moralische Abstumpfung wiedergegeben.
  alternative: „Sie haben jedes Empfinden verloren“ oder „Sie sind gefühllos geworden“.
  rationale: Der Zusammenhang handelt von ethischer Verhärtung und der Hingabe an Unreinheit. Die Übersetzung vermeidet daher ein rein emotionales oder klinisches Verständnis.
- issue: Bedeutungsumfang von ἀσέλγεια
  choice: Mit dem breiten Ausdruck „Zügellosigkeit“ wiedergegeben.
  alternative: „Ausschweifung“, „schamloses Verhalten“ oder eine ausdrücklich sexuelle Wiedergabe.
  rationale: Das Wort kann sexuelle Schamlosigkeit einschließen, bezeichnet aber allgemeiner ungehemmte, schamlose Selbstbefriedigung. Die Übersetzung verengt den Begriff nicht unnötig.
- issue: Bezug und Bedeutung von ἐν πλεονεξίᾳ
  choice: Als modale Bestimmung „voller Gier“ verstanden.
  alternative: „in Habgier“ oder als eigenständiger zusätzlicher Lasterbegriff.
  rationale: Die griechische Formulierung lässt eine gewisse Spannung zwischen Habgier und unersättlichem Verlangen zu. „Voller Gier“ bewahrt den Gedanken maßlosen Begehrens und passt syntaktisch zur Ausübung der Unreinheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist als eigenständiger Vers formuliert, behält aber durch „Sie“ den Rückbezug auf den vorherigen Kontext. Die Wortwahl vermeidet sowohl altertümliche Ausdrücke als auch eine unnötige Verengung auf ausschließlich sexuelle oder finanzielle Verfehlungen.
