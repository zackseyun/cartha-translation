source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: de
  text: 'Deshalb sage ich dies und bezeuge es im Herrn: Lebt nicht länger, wie auch die Nichtjuden in der Vergeblichkeit ihres Denkens leben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο οὖν λέγω
  choice: Das sage ich nun
  rationale: οὖν stellt eine folgernde Verbindung zum vorausgehenden Abschnitt her. „Nun“ gibt diesen Übergang im Deutschen natürlich wieder, während „das“ als vorangestelltes Objekt erhalten bleibt.
- source_word: μαρτύρομαι
  choice: bezeuge
  rationale: Das Verb bezeichnet hier eine nachdrückliche, feierliche Bekräftigung. „Bezeuge“ bewahrt den Zeugnischarakter besser als das stärker deutende „beschwöre“ oder „bestehe darauf“.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die wörtliche und im paulinischen Sprachgebrauch geläufige Wiedergabe lässt offen, ob vor allem die Sphäre, die Verbundenheit oder die Autorität des Herrn betont ist.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: Lebt nicht länger
  rationale: Der Infinitiv hat im Zusammenhang auffordernden Charakter. „Lebt“ gibt die ethische Bedeutung des griechischen Bildes vom Umhergehen in natürlichem modernem Deutsch wieder; „nicht länger“ bewahrt die zeitliche Aussage von μηκέτι.
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: so, wie auch die Nichtjuden
  rationale: ἔθνη bezeichnet hier im paulinischen Zusammenhang die nichtjüdischen Völker. „Nichtjuden“ macht diese relationale Bedeutung verständlich, ohne die zusätzliche religiöse Wertung des traditionellen Wortes „Heiden“ in den Haupttext einzutragen.
- source_word: περιπατεῖ
  choice: leben
  rationale: Wie beim ersten Vorkommen wird das griechische Bild idiomatisch als Lebensführung wiedergegeben. Die Wiederholung von „leben“ spiegelt zugleich die Wiederholung des Verbs im Ausgangstext.
- source_word: ἐν ματαιότητι
  choice: in der Vergeblichkeit
  rationale: ματαιότης kann Nichtigkeit, Leere, Zwecklosigkeit oder Vergeblichkeit bezeichnen. „Vergeblichkeit“ ist verständlich und bewahrt die Aussage, dass dieses Denken sein Ziel verfehlt, ohne sie auf bloße Dummheit zu verengen.
- source_word: τοῦ νοὸς αὐτῶν
  choice: ihres Denkens
  rationale: νοῦς bezeichnet hier das geistige Wahrnehmen und Denken. „Denken“ klingt im modernen Deutsch natürlicher als „Sinn“ und greift dem in Vers 18 folgenden Begriff διάνοια nicht unnötig vor.
theological_decisions:
- issue: Wiedergabe von ἔθνη im ethischen Gegensatz bei einer überwiegend nichtjüdischen Leserschaft
  choice: Nichtjuden
  alternative: Völker; Heiden
  rationale: Die Formulierung bewahrt die ethnisch-bundestheologische Kategorie des paulinischen Sprachgebrauchs, ohne den Ausdruck als pauschale Wesensaussage über alle Nichtjuden zu verstehen. Die wörtliche und die traditionelle Wiedergabe werden in der Fußnote offengelegt.
- issue: Auffordernde Kraft des Infinitivs περιπατεῖν nach λέγω καὶ μαρτύρομαι
  choice: Lebt nicht länger
  alternative: dass ihr nicht länger lebt
  rationale: Der Zusammenhang verlangt eine nachdrückliche Ermahnung. Der deutsche Imperativ macht diese syntaktisch angelegte Kraft klar, ohne eine zusätzliche theologische Kategorie einzuführen.
- issue: Bedeutungsumfang von ἐν κυρίῳ
  choice: im Herrn
  alternative: durch den Herrn; beim Herrn
  rationale: Die traditionelle, formnahe Wiedergabe erhält die mögliche Spannung zwischen Verbundenheit mit Christus, geistlicher Sphäre und seiner Autorität, statt sich auf nur eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ethische Metapher von περιπατέω wird zugunsten unmittelbarer Verständlichkeit mit „leben“ wiedergegeben; die Wiederholung des griechischen Verbs bleibt durch die Wiederholung von „leben“ sichtbar. Der Gedankenstrich markiert die abschließende nähere Bestimmung, ohne eine im Griechischen nicht vorhandene eigenständige Aussage daraus zu machen.
