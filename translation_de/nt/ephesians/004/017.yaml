  naturalness: „Lebt nicht länger, wie auch die Nichtjuden leben – in der Vergeblichkeit ihres Denkens“ ist grundsätzlich verständlich. Die Stellung der abschließenden Präpositionalgruppe hinter dem Gedankenstrich ist jedoch weniger glatt als eine Einbindung in den Vergleichssatz. „Deshalb“ stellt den Anschluss klar und ist modernes Standarddeutsch.
  terminology: „Im Herrn“, „Nichtjuden“, „Vergeblichkeit“ und „Denken“ sind angemessen. Die Wiedergabe vermeidet bei ἔθνη eine unnötig abwertende Haupttextformulierung, ohne die traditionelle Alternative in der Anmerkung zu verschweigen.
