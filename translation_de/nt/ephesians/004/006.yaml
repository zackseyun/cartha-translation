id: EPH.4.6
reference: Ephesians 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν ⸀πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/006.yaml
  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: de
  text: ein Gott und Vater aller[a], der über allen und durch alle und in allen ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vater von allen« beziehungsweise »Vater von allem«. Im Griechischen wird bei dem wiederholten »alle« nicht ausdrücklich gesagt, ob Menschen oder Dinge gemeint sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften lesen: »in euch allen«.'
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: ein
  rationale: 'Bewahrt die betonte Einheitsformel der Umgebung: ein Leib, ein Geist, ein Herr, ein Gott.'
- source_word: θεὸς καὶ πατὴρ
  choice: Gott und Vater
  rationale: Die geläufige und würdevolle Wiedergabe erhält beide aufeinander bezogenen Gottesbezeichnungen.
- source_word: πάντων
  choice: aller / allen / alle
  rationale: Die substantivisch gebrauchten Formen von πᾶς werden ohne ergänzendes Bezugswort wiedergegeben, sodass die im Griechischen offene Reichweite erhalten bleibt.
- source_word: ὁ ἐπὶ πάντων
  choice: der über allen ... ist
  rationale: Der Artikel leitet eine nähere Beschreibung Gottes ein; ἐπί mit Genitiv bezeichnet hier am natürlichsten seine Hoheit über alle.
- source_word: διὰ πάντων
  choice: durch alle
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Wirksamkeit; die knappe Form wahrt den Parallelismus, ohne etwa »wirkt« hinzuzufügen.
- source_word: ἐν πᾶσιν
  choice: in allen
  rationale: Die direkte Wiedergabe erhält sowohl die Präposition als auch die Offenheit des nicht ausdrücklich genannten Bezugswortes.
theological_decisions:
- issue: Reichweite der wiederholten Formen von πᾶς
  choice: »aller / allen / alle« ohne ausdrückliche Eingrenzung auf Menschen, Gläubige oder Dinge
  alternative: »aller Menschen«, »aller Gläubigen« oder »aller Dinge«
  rationale: Der unmittelbare Zusammenhang behandelt die Einheit der Gemeinde, doch der griechische Wortlaut nennt kein Bezugswort. Die Übersetzung bewahrt daher die mögliche Weite und die theologische Spannung.
- issue: Textvariante am Versende
  choice: '»in allen« nach SBLGNT: ἐν πᾶσιν'
  alternative: »in euch allen« nach der Variante ἐν ὑμῖν πᾶσιν
  rationale: Der vorgegebene Ausgangstext bietet die kürzere Lesart; die verbreitete Variante wird transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der dreifache Parallelismus »über allen und durch alle und in allen« bleibt erhalten. »Vater aller« ist knapp und schriftsprachlich natürlich; die Fußnote erläutert die im Deutschen weniger deutlich erkennbare Offenheit des griechischen Ausdrucks.
