base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: de
  text: und setzt alles daran[a], die Einheit des Geistes[b] im Band des Friedens zu bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seid eifrig darauf bedacht, … zu erhalten“ oder „bemüht euch mit allem Ernst, … zu bewahren“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Geist“ ist hier sehr wahrscheinlich der Heilige Geist gemeint; manche verstehen das Wort allgemeiner als den gemeinsamen Geist oder die gemeinsame Gesinnung der Glaubenden.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: bemüht euch mit allem Ernst
  rationale: Das präsentische Partizip setzt den Aufforderungsfluss aus Vers 1–2 fort und bezeichnet ernsthaften, tätigen Einsatz. Die deutsche Formulierung gibt diese nachdrückliche Bemühung natürlich wieder.
- source_word: τηρεῖν
  choice: zu bewahren
  rationale: τηρέω meint hier, etwas bereits Vorhandenes zu erhalten oder zu hüten, nicht es erst herzustellen. „Bewahren“ bringt dies im Deutschen klar zum Ausdruck.
- source_word: τὴν ἑνότητα
  choice: die Einheit
  rationale: „Einheit“ ist die übliche, klare und kontextgemäße Wiedergabe von ἑνότης.
- source_word: τοῦ πνεύματος
  choice: des Geistes
  rationale: Der Kontext des Epheserbriefs, besonders Vers 4, spricht am stärksten für den Heiligen Geist. Die Großschreibung kennzeichnet diese Auslegung, ohne die grammatisch mögliche allgemeinere Lesart zu verschweigen.
- source_word: ἐν
  choice: durch
  rationale: ἐν kann hier das Mittel bezeichnen, durch das die Einheit bewahrt wird. „Durch“ ergibt im Deutschen eine natürliche und präzise Verbindung mit dem Bild des Bandes.
- source_word: τῷ συνδέσμῳ
  choice: das Band
  rationale: σύνδεσμος bezeichnet etwas, das verbindet oder zusammenhält. „Band“ bewahrt das knappe Bild und ist im heutigen Deutschen verständlich.
- source_word: τῆς εἰρήνης
  choice: des Friedens
  rationale: Der einfache Genitiv wird formal als „des Friedens“ wiedergegeben; Frieden erscheint dabei als das verbindende Band.
theological_decisions:
- issue: Bezug von πνεύματος
  choice: der Heilige Geist
  alternative: der gemeinsame Geist oder die gemeinsame Gesinnung der Glaubenden
  rationale: Der nähere Kontext, insbesondere Epheser 4,4, legt den Heiligen Geist nahe. Da die Formulierung sprachlich auch allgemeiner verstanden werden kann, wird diese Möglichkeit in einer Fußnote erhalten.
- issue: Wesen der Einheit
  choice: eine bereits bestehende Einheit, die bewahrt werden soll
  alternative: eine von den Glaubenden erst herzustellende Einheit
  rationale: τηρεῖν fordert zum Bewahren auf und setzt damit eine vorhandene Einheit voraus. Der Text sagt nicht, dass die Glaubenden sie selbst schaffen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufforderungsform führt den syntaktischen Gedankengang aus den vorangehenden Versen natürlich fort. „Band des Friedens“ erhält das Bild des griechischen Textes; „durch“ gibt den instrumentalen Sinn von ἐν idiomatisch wieder.
