  to: damit wir nicht länger Kinder sind, von den Wellen hin und her geworfen und von jedem Wind der Lehre umhergetrieben, durch das betrügerische Spiel der Menschen[a] und durch ihre Verschlagenheit bei planvoller Irreführung[b].
  rationale: Die Revision entfernt die im modernen Deutsch missverständliche Verstärkung „unmündige“, glättet den schwierigen Schlussteil und belässt dessen umstrittene bzw. verdichtete semantische Beziehung in einer transparenten Fußnote. Das maritime Bild, die passive Ausgesetztheit, das Würfelspielbild und die negativen Konnotationen von κυβεία und πανουργία bleiben erhalten.
