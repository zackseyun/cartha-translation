    rationale: Die Wendung ist verständlich, aber „unmündig“ hat im modernen Deutsch vor allem einen juristischen Klang und verstärkt „Kinder“ unnötig. Das griechische Bild wird mit „Kinder“ ausreichend bewahrt.
  - severity: medium
    issue: Fußnote b enthält die Formulierung „planmäßiges Vorgehen des Irrtums“.
    rationale: „Irrtum“ ist im Deutschen nicht der natürliche Akteur eines „Vorgehens“. Die Fußnote sollte die schwierige Genitivverbindung erläutern, ohne eine unidiomatische wörtliche Konstruktion als gleichwertige Alternative anzubieten.
  - severity: low
    issue: Der Schluss ist unnötig schwerfällig.
    rationale: Die Relativkonstruktion „Verschlagenheit, die auf ... zielt“ ist möglich, doch eine präpositionale Anbindung gibt die instrumentale Folge der griechischen Wendung im Deutschen klarer wieder.
