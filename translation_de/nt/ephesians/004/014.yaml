id: EPH.4.14
reference: Ephesians 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: de
  text: damit wir nicht länger Kinder sind, von den Wellen hin und her geworfen und von jedem Wind der Lehre umhergetrieben, durch das betrügerische Spiel der Menschen[a] und durch ihre Verschlagenheit bei planvoller Irreführung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier ein Ausdruck für das Würfelspiel; gemeint ist betrügerisches oder manipulatives Vorgehen.
    reason: cultural_note
  - marker: b
    text: Der griechische Ausdruck ist stark verdichtet. Er kann auch die Vorstellung eines planvollen Vorgehens im Bereich des Irrtums oder der Täuschung ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: damit wir nicht länger … sind
  rationale: „Damit“ wahrt den Zweck- beziehungsweise Folgesinn von ἵνα; der deutsche Präsenssatz gibt den griechischen Konjunktiv nach ἵνα natürlich wieder.
- source_word: νήπιοι
  choice: unmündige Kinder
  rationale: νήπιοι bezeichnet hier bildlich geistliche Unreife. „Unmündige Kinder“ macht diesen Sinn deutlich, ohne das Bild aufzugeben.
- source_word: κλυδωνιζόμενοι
  choice: von den Wellen hin und her geworfen
  rationale: Die Form bewahrt das Passiv und das maritime Bild eines von Wogen herumgeworfenen Menschen.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: von jedem Wind der Lehre umhergetrieben
  rationale: Die Wendung erhält das Windbild sowie den passiven Sinn. „Lehre“ ist im Deutschen die natürliche, nicht unnötig eingeengte Entsprechung für διδασκαλία.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: durch das betrügerische Spiel der Menschen
  rationale: κυβεία bezeichnet wörtlich das Würfelspiel und daraus abgeleitet betrügerische Manipulation. Die Formulierung bewahrt einen Rest des Bildes und vermittelt zugleich dessen Sinn.
- source_word: ἐν πανουργίᾳ
  choice: durch ihre Verschlagenheit
  rationale: πανουργία meint moralisch verwerfliche Schlauheit oder Gerissenheit. Das ergänzte „ihre“ stellt im Deutschen den natürlichen Bezug zu den Menschen her.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: die auf die planmäßige Irreführung zielt
  rationale: πρός bezeichnet hier Ziel oder Ausrichtung; μεθοδεία legt ein methodisches, planvolles Vorgehen nahe. πλάνη kann Irrtum, Täuschung oder Irreführung bezeichnen; „Irreführung“ lässt sowohl die Täuschung als auch das Verleiten anklingen.
theological_decisions:
- issue: Bedeutung von διδασκαλία
  choice: Lehre
  alternative: Unterweisung
  rationale: „Lehre“ entspricht dem allgemeinen Sinn des griechischen Wortes und beschränkt die Warnung nicht auf ein bestimmtes konfessionelles Lehrsystem.
- issue: Bedeutung von πλάνη
  choice: Irreführung
  alternative: Irrtum oder Täuschung
  rationale: Der Ausdruck steht neben Begriffen für menschlichen Betrug und Verschlagenheit. „Irreführung“ wahrt die Spannung zwischen falschem Weg, Irrtum und aktiver Täuschung, ohne sie dogmatisch festzulegen.
- issue: Bezug von ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: Verschlagenheit, die auf planmäßige Irreführung zielt
  alternative: Verschlagenheit innerhalb eines Systems des Irrtums
  rationale: Die Zielangabe gibt πρός erkennbar wieder und verbindet die Verschlagenheit mit einer absichtsvollen Strategie, ohne den schwierigen griechischen Genitiv übermäßig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Bewegung von Wellen und Wind bleibt erhalten. Der schwierige Schluss wird verständlich formuliert, während eine Fußnote die Mehrdeutigkeit von πλάνη und der Genitivverbindung offenhält.
