id: EPH.4.8
reference: Ephesians 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: de
  text: 'Darum heißt es: »Als er in die Höhe hinaufstieg, führte er die Gefangenschaft gefangen[a] und gab den Menschen[b] Gaben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »führte Gefangene gefangen« oder »führte ein Heer von Gefangenen mit sich«. Im Griechischen steht eine eindringliche Verbindung stammverwandter Wörter, die an Psalm 68,19 anklingt.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Menschen« sind hier Menschen allgemein gemeint.
    reason: lexical_clarification
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Gibt den folgernden Anschluss an das vorher Gesagte knapp und natürlich wieder.
- source_word: λέγει
  choice: heißt es
  rationale: Bewahrt die unpersönliche Zitierformel, da im Griechischen kein ausdrückliches Subjekt genannt wird.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: Als er in die Höhe hinaufstieg
  rationale: Gibt das Aoristpartizip als zeitlich auf den Aufstieg bezogenen Nebensatz wieder und bewahrt zugleich den Anklang an Psalm 68,19.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: führte er die Gefangenschaft gefangen
  rationale: Bewahrt die auffällige, klanglich verwandte Verbindung von Verb und Objekt sowie die dichte Bildsprache des Psalmzitats, ohne sie auf eine einzige Deutung festzulegen.
- source_word: ἔδωκεν δόματα
  choice: gab ... Gaben
  rationale: Die Wiederholung des Wortstamms ist im Deutschen natürlich und entspricht der schlichten Aussage des griechischen Textes.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein; „Menschen“ ist im modernen Deutschen genau und schließt alle gemeinten Personen ein.
theological_decisions:
- issue: Bildsprache der adaptierten Anführung aus Psalm 68,19
  choice: die Gefangenschaft gefangen führen
  alternative: Gefangene gefangen führen; ein Heer von Gefangenen mit sich führen
  rationale: Die ungewöhnliche Formulierung lässt offen, ob kollektiv von Gefangenen oder abstrakt von Gefangenschaft gesprochen wird, und erhält den rhetorischen Nachdruck des griechischen Ausdrucks.
- issue: Bedeutungsumfang von τοῖς ἀνθρώποις
  choice: den Menschen
  alternative: den Männern
  rationale: Der griechische Plural ist in diesem Zusammenhang generisch. Die Übersetzung soll keine Beschränkung auf männliche Personen nahelegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die unpersönliche Zitierformel ist idiomatisch; die bewusst ungewöhnliche Gefangenschaftsformel erhält dagegen die sprachliche Dichte und Mehrdeutigkeit des griechischen Psalmanklangs.
