translation:
  language: de
  text: Seid zornig[a], doch sündigt nicht. Die Sonne soll über eurem Zorn[b] nicht untergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ihr zornig seid, sündigt nicht.“ Im Griechischen steht formal ein Imperativ („Seid zornig“); im Zusammenhang kann er jedoch auch als einräumende Aufforderung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort kann auch „Erbitterung“, „Verärgerung“ oder „Provokation“ bezeichnen. Wahrscheinlich klingt hier Psalm 4,5 nach der griechischen Übersetzung an, wo Zorn mit der Aufforderung verbunden wird, nicht zu sündigen.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Seid zornig
  rationale: Der griechische Imperativ wird als Imperativ wiedergegeben. So bleiben seine sprachliche Form, der wahrscheinliche Anklang an Psalm 4,5 nach der Septuaginta und die Spannung zum folgenden Sündigungsverbot erhalten.
- source_word: καὶ μὴ ἁμαρτάνετε
  choice: doch sündigt nicht
  rationale: Das Verbot wird direkt wiedergegeben. „Doch“ macht im Deutschen den begrenzenden Gegensatz natürlich verständlich, ohne den Inhalt zu erweitern.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Die Sonne soll … nicht untergehen
  rationale: Diese Form gibt den griechischen Imperativ der dritten Person klar, würdig und idiomatisch wieder.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: über eurem Zorn
  rationale: „Zorn“ ist im Zusammenhang die klarste Wiedergabe für den Zustand anhaltender Verärgerung und bewahrt zugleich die Verbindung zum ersten Satzteil. Die Präposition wird passend zur deutschen Wendung vom Untergehen der Sonne mit „über“ wiedergegeben.
theological_decisions:
- issue: Ob der erste Satzteil Zorn gebietet oder ihn nur als mögliche Bedingung einräumt
  choice: 'Imperativ: „Seid zornig, doch sündigt nicht.“'
  alternative: 'Konzessiv beziehungsweise konditional: „Wenn ihr zornig seid, sündigt nicht.“'
  rationale: Die griechische Form ist ein Imperativ. Die Übersetzung bewahrt diese Form und damit die Spannung des Textes, ohne Zorn pauschal gutzuheißen; das unmittelbar folgende Verbot und die zeitliche Begrenzung schränken ihn ein.
translation_notes:
  register: Modernes Standarddeutsch in natürlicher, würdiger Sprache. Der formal auffällige Imperativ bleibt erhalten; „doch“ verdeutlicht lediglich die im Kontext liegende Begrenzung. Die Fußnoten bündeln die echte grammatische und lexikalische Mehrdeutigkeit, ohne sie im Haupttext aufzulösen.
