source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: de
  text: Sie sind in ihrem Denken verfinstert[a] und dem Leben Gottes[b] entfremdet – wegen der Unwissenheit, die in ihnen ist, wegen der Verhärtung ihres Herzens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihrem Verstand“.'
    reason: lexical_alternative
  - marker: b
    text: „Das Leben Gottes“ kann sowohl das Gott eigene Leben als auch das von Gott kommende Leben bezeichnen.
    reason: alternative_reading
  - marker: c
    text: Im Griechischen steht „Herz“ in der Einzahl; sinngemäß ist auch „ihrer Herzen“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: verfinstert
  rationale: Das Perfektpassiv bezeichnet einen eingetretenen, fortbestehenden Zustand. „Verfinstert“ bewahrt sowohl das Bild als auch den passiven Sinn.
- source_word: τῇ διανοίᾳ
  choice: in ihrem Denken
  rationale: διάνοια kann Denkvermögen, Verstand oder Denken bezeichnen. „Denken“ ist im modernen Deutsch natürlich und bezeichnet hier den Bereich, in dem die Verfinsterung besteht.
- source_word: ὄντες
  choice: Sie sind
  rationale: Die griechische Partizipialkonstruktion wird für klares, natürliches Deutsch als finite Aussage wiedergegeben, ohne ihren beschreibenden Charakter zu verändern.
- source_word: ἀπηλλοτριωμένοι
  choice: entfremdet
  rationale: Das Perfektpassiv beschreibt einen fortbestehenden Zustand der Trennung. „Entfremdet“ wahrt den relationalen Sinn und verengt ihn nicht auf einen rechtlichen Ausschluss.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: dem Leben Gottes
  rationale: Die Genitivverbindung bleibt bewusst offen dafür, ob das Gott eigene oder das von Gott kommende Leben gemeint ist.
- source_word: διὰ τὴν ἄγνοιαν
  choice: wegen der Unwissenheit
  rationale: διά mit Akkusativ gibt hier den Grund an. „Wegen“ ist präzise und idiomatisch.
- source_word: τὴν οὖσαν ἐν αὐτοῖς
  choice: die in ihnen ist
  rationale: Die attributive Partizipialphrase beschreibt die Unwissenheit als etwas, das in ihnen vorhanden ist.
- source_word: διὰ τὴν πώρωσιν
  choice: wegen der Verhärtung
  rationale: πώρωσις bezeichnet Verhärtung beziehungsweise Unempfindlichkeit. „Verhärtung“ bewahrt das Bild und ist im Deutschen gut verständlich.
- source_word: τῆς καρδίας αὐτῶν
  choice: ihres Herzens
  rationale: Die griechische Einzahl „Herz“ mit pluralischem Bezug wird beibehalten. Im Deutschen kann „ihres Herzens“ die innere Mitte jedes Einzelnen bezeichnen, ohne den kollektiven Ausdruck unnötig zu glätten.
theological_decisions:
- issue: Bedeutung von „dem Leben Gottes“
  choice: Die Genitivform bleibt als „dem Leben Gottes“ erhalten.
  alternative: „dem Leben, das von Gott kommt“ oder „Gottes eigenem Leben“
  rationale: Der griechische Genitiv kann sowohl die Zugehörigkeit zu Gott als auch den Ursprung bei Gott ausdrücken. Die Übersetzung entscheidet diese echte Mehrdeutigkeit nicht vorzeitig.
- issue: Einzahl „Herz“ bei pluralischem Bezug
  choice: „ihres Herzens“
  alternative: „ihrer Herzen“
  rationale: Die Einzahl des griechischen καρδία wird gewahrt und kann das Herz als innere Mitte eines jeden Menschen beziehungsweise als einheitliche innere Instanz hervorheben, ohne daraus eine besondere Lehre abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechischen Partizipien werden als koordinierte finite Aussage wiedergegeben. Der Gedankenstrich macht die beiden parallelen Ursachenangaben lesbar, ohne ihre Beziehung zur Entfremdung interpretierend aufzulösen.
