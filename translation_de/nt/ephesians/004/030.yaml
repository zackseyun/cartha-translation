  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: de
  text: Und betrübt nicht den Heiligen Geist Gottes, in dem ihr für den Tag der Erlösung[a] versiegelt worden seid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Tag der Erlösung“. Das griechische εἰς ἡμέραν ἀπολυτρώσεως bedeutet wörtlich etwa „auf den Tag der Erlösung hin“ und kann hier auch zeitlich mit Blick auf diesen zukünftigen Tag verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: betrübt
  rationale: Der Präsensimperativ mit μή formuliert ein Verbot. „Betrübt“ bewahrt die persönliche und beziehungsbezogene Aussage des Verbs, ohne sie zu „beleidigt“ oder „kränkt“ umzudeuten.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: den Heiligen Geist Gottes
  rationale: Die vollständige Genitivverbindung wird beibehalten. „Heiliger Geist“ ist im Deutschen die natürliche feste Bezeichnung; „Gottes“ gibt den ausdrücklichen griechischen Genitiv wieder.
- source_word: ἐν ᾧ
  choice: in dem
  rationale: Die Wiedergabe erhält die Präposition ἐν und bezieht das Relativpronomen natürlich auf den im Deutschen maskulinen „Geist“. „Durch den“ wäre als Angabe des Handelnden möglich, wäre jedoch stärker auslegend.
- source_word: ἐσφραγίσθητε
  choice: ihr … versiegelt worden seid
  rationale: Die Form ist Aorist Passiv, zweite Person Plural. „Versiegelt worden seid“ bewahrt sowohl das Passiv als auch das Bild des Siegels, ohne dessen mögliche Bedeutungen wie Zugehörigkeit, Beglaubigung oder Schutz im Haupttext festzulegen.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: für den Tag der Erlösung
  rationale: „Für“ gibt die Zielrichtung von εἰς ausgewogen wieder. Der bestimmte Ausdruck „der Tag der Erlösung“ ist im Kontext natürlich und weist auf die zukünftige Vollendung der Erlösung.
theological_decisions:
- issue: Persönlicher Bezug auf den Heiligen Geist im Relativsatz
  choice: „in dem“ mit persönlichem Bezug auf den Heiligen Geist
  alternative: „in welchem“ oder eine unpersönliche Wiedergabe
  rationale: Das griechische Relativpronomen ist aufgrund der grammatischen Übereinstimmung mit πνεῦμα sächlich; sein Bezug ist jedoch der Heilige Geist, der betrübt werden kann. Die deutsche Form richtet sich grammatisch nach „Geist“ und wahrt den persönlichen Bezug.
- issue: Ausrichtung der Versiegelung auf den Tag der Erlösung
  choice: „für den Tag der Erlösung“
  alternative: „bis zum Tag der Erlösung“
  rationale: Die gewählte Fassung bewahrt die zielgerichtete Kraft von εἰς, ohne über den Vers hinaus eine bestimmte Lehre über das Beharren, die Sakramente oder den genauen Mechanismus der Versiegelung festzulegen. Die zeitliche Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige biblische Metapher „versiegelt“ bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser verständlich.
