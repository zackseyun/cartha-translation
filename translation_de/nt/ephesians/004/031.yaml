source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: de
  text: Alle Bitterkeit und Wut, aller Zorn, alles Geschrei und jede verletzende Rede sollen von euch weggenommen werden, zusammen mit aller Bosheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Verleumdung“; traditionell „Lästerung“. Das griechische Wort kann herabsetzende Rede bezeichnen und wird in diesem Zusammenhang wahrscheinlich auf verletzende Rede gegen andere bezogen.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: alle Bitterkeit
  rationale: Gibt die umfassende Forderung wieder und bewahrt die geläufige Bezeichnung für eine tief sitzende, nachtragende Haltung.
- source_word: θυμός
  choice: Wut
  rationale: Bezeichnet hier heftige, aufwallende Erregung und bleibt dadurch vom folgenden ὀργή unterscheidbar.
- source_word: ὀργή
  choice: Zorn
  rationale: Gibt den anhaltenderen oder allgemeineren Zorn wieder und bildet im Deutschen ein natürliches Begriffspaar mit „Wut“.
- source_word: κραυγή
  choice: Geschrei
  rationale: Bezeichnet im Zusammenhang lautes, feindseliges Rufen oder Streiten, nicht einen neutralen Ausruf.
- source_word: βλασφημία
  choice: beleidigendes Reden
  rationale: Der zwischenmenschliche Zusammenhang legt verletzende, herabsetzende Rede nahe. Die Formulierung ist breiter als das rechtlich enger klingende „Verleumdung“ und vermeidet eine unbegründete Beschränkung auf Gotteslästerung.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: sollen von euch weggenommen werden
  rationale: Bewahrt die passive Form und den Gedanken vollständiger Entfernung aus dem Verhalten und Zusammenleben der Angesprochenen; der deutsche Plural entspricht der mehrgliedrigen Aufzählung.
- source_word: σὺν πάσῃ κακίᾳ
  choice: zusammen mit aller Bosheit
  rationale: Bewahrt sowohl die begleitende Kraft von σύν als auch die umfassende Aussage von πάσῃ; κακία bezeichnet hier böse Gesinnung beziehungsweise Arglist.
theological_decisions:
- issue: Bedeutung von βλασφημία in der ethischen Lasterliste
  choice: zwischenmenschlich verletzende Rede („beleidigendes Reden“)
  alternative: „Verleumdung“ oder traditionell „Lästerung“, möglicherweise auch Gotteslästerung
  rationale: Die umgebenden Begriffe betreffen zerstörerische Haltungen und Äußerungen im menschlichen Zusammenleben. Dennoch wird die weitere Bedeutungsbreite des griechischen Wortes in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten beziehungsweise angepassten Artikel machen die umfassende Aufzählung trotz unterschiedlicher grammatischer Geschlechter klar. „Wut“ und „Zorn“ halten die begriffliche Spannung zwischen θυμός und ὀργή aufrecht.
