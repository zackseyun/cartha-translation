id: EPH.4.11
reference: Ephesians 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: de
  text: Und er selbst hat die einen als Apostel, die anderen als Propheten, andere als Evangelisten und wieder andere als Hirten[a] und Lehrer[b] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pastoren“. Wörtlich bezeichnet das griechische Wort „Hirten“.'
    reason: lexical_alternative
  - marker: b
    text: Der einzige Artikel vor „Hirten und Lehrer“ kann auf eine besonders enge Beziehung zwischen diesen Aufgaben hinweisen; die Wendung muss jedoch nicht ein einziges Amt bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche Anschluss an den vorausgehenden Gedankengang bleibt erhalten.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Die betonte Stellung und Form des Pronomens wird im Deutschen ausdrücklich wiedergegeben.
- source_word: ἔδωκεν
  choice: hat ... gegeben
  rationale: Dies entspricht dem Grundsinn von δίδωμι und vermeidet die engere, interpretierende Wiedergabe „hat eingesetzt“.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: die einen ... die anderen ... andere ... wieder andere
  rationale: Die wiederholte Verteilungsstruktur mit μέν/δέ wird in natürlichem Deutsch nachvollzogen.
- source_word: ἀποστόλους
  choice: als Apostel
  rationale: „Apostel“ ist die geläufige und sachlich genaue Wiedergabe; „als“ macht deutlich, in welcher Aufgabe die Personen gegeben wurden.
- source_word: προφήτας
  choice: als Propheten
  rationale: Direkte und im Deutschen etablierte Wiedergabe von προφήτης.
- source_word: εὐαγγελιστάς
  choice: als Evangelisten
  rationale: Der etablierte Ausdruck gibt εὐαγγελιστής in dieser Aufzählung knapp und genau wieder.
- source_word: ποιμένας
  choice: als Hirten
  rationale: „Hirten“ bewahrt das im griechischen Wort enthaltene Bild und vermeidet, im Haupttext vorschnell einen späteren kirchlichen Amtstitel einzutragen.
- source_word: καὶ διδασκάλους
  choice: und Lehrer
  rationale: Die koordinierte Formulierung wird unmittelbar wiedergegeben; ihre genaue syntaktische Beziehung zu „Hirten“ bleibt offen.
theological_decisions:
- issue: Soll ποιμένας als „Hirten“ oder mit dem traditionellen kirchlichen Begriff „Pastoren“ wiedergegeben werden?
  choice: Hirten
  alternative: Pastoren
  rationale: „Hirten“ wahrt die Metapher des griechischen Textes. „Pastoren“ ist als traditionelle, kontextuell mögliche Wiedergabe in einer Fußnote vermerkt, würde im Haupttext jedoch stärker eine spätere Amtsbezeichnung nahelegen.
- issue: Bezeichnen „Hirten und Lehrer“ eine einzige verbundene Gruppe oder zwei unterscheidbare Gruppen?
  choice: Beide Substantive werden koordiniert wiedergegeben, ohne die Frage zu entscheiden.
  alternative: Hirtenlehrer als eine einzige Gruppe; oder zwei klar getrennte Gruppen
  rationale: Der gemeinsame Artikel kann auf eine besonders enge Beziehung hindeuten, zwingt aber nicht dazu, beide Funktionen als ein einziges Amt zu verstehen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verteilungsstruktur wird idiomatisch entfaltet; die Hirtenmetapher und die syntaktische Offenheit der letzten beiden Bezeichnungen bleiben erhalten.
