  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: de
  text: dass ihr im Blick auf euren früheren Lebenswandel den alten Menschen ablegt[a], der nach den Begierden des Betrugs[b] verdorben wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „den alten Menschen ablegen“. Gemeint ist die frühere menschliche Daseins- und Lebensweise, nicht nur ein männlicher Mensch.
    reason: alternative_reading
  - marker: b
    text: Wörtlich „nach den Begierden des Betrugs“. Die Wendung kann Begierden bezeichnen, die von Betrug geprägt oder geleitet sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: dass ihr … ablegt
  rationale: „Ablegen“ bewahrt das Bild vom Ausziehen eines Kleidungsstücks und entspricht dem Gegenstück „anziehen“ in Vers 24. Der dass-Satz fügt den von Vers 21 abhängigen Infinitiv im Deutschen natürlich ein, ohne ihn ausdrücklich als Befehl oder als bereits vollendetes Geschehen festzulegen.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: im Blick auf euren früheren Lebenswandel
  rationale: κατά bezeichnet hier wahrscheinlich den Bezugsbereich. „Im Blick auf“ gibt diesen Bezug idiomatisch wieder; „Lebenswandel“ umfasst Verhalten und Lebensführung.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: den alten Menschen
  rationale: Die wörtliche und im Deutschen natürliche Wiedergabe erhält die repräsentative anthropologische Ausdrucksweise sowie mögliche korporative Bezüge.
- source_word: τὸν φθειρόμενον
  choice: der … zugrunde gerichtet wird
  rationale: Das präsentische Passivpartizip bezeichnet einen fortdauernden Verfalls- oder Verderbnisprozess. „Zugrunde gerichtet wird“ bewahrt das Passiv und ist verständlicher als das missverständliche „korrumpiert wird“.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: durch die Begierden des Betrugs
  rationale: κατά kann hier die bestimmende oder wirkende Macht bezeichnen. Die formnahe Genitivverbindung „Begierden des Betrugs“ bewahrt die mögliche personifizierende Kraft von ἡ ἀπάτη und wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von τὸν παλαιὸν ἄνθρωπον
  choice: den alten Menschen
  alternative: das alte Selbst
  rationale: „Den alten Menschen“ entspricht der griechischen Wendung und erhält ihre anthropologische sowie möglicherweise adamisch-korporative Spannung. Sie bezeichnet nicht nur Männer.
- issue: Kraft von ἀποθέσθαι im Zusammenhang
  choice: dass ihr … ablegt
  alternative: den alten Menschen abgelegt zu haben
  rationale: Die Form wird als Inhalt der vorausgehenden Belehrung verstanden. Die Übersetzung legt nicht fest, ob vor allem eine Aufforderung, eine fortdauernde Lebensaufgabe oder ein Ereignis bei der Bekehrung gemeint ist.
- issue: Bedeutung des passiven φθειρόμενον
  choice: zugrunde gerichtet wird
  alternative: verdirbt
  rationale: Das Passiv wird erhalten, damit die grammatische Perspektive und die offene Frage nach der wirkenden Macht nicht durch eine aktive Form eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als von Vers 21 abhängiger Teilsatz offen und endet daher mit Komma. „Lebenswandel“ ist leicht gehoben, aber allgemein verständlich und trägt den ethischen Sinn von ἀναστροφή. Sämtliche Fußnotenmarker stehen im Haupttext.
