  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: de
  text: und den neuen Menschen[a] anzuziehen, der Gott entsprechend[b] in Gerechtigkeit[c] und Heiligkeit der Wahrheit[d] geschaffen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das neue Selbst“ oder „die neue Person“. Wörtlich: „den neuen Menschen“, entsprechend dem „alten Menschen“ im Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach Gott“; oder: „nach Gottes Bild“.'
    reason: lexical_alternative
  - marker: c
    text: „Gerechtigkeit“ kann hier auch gerechtes Handeln einschließen.
    reason: semantic_range
  - marker: d
    text: 'Oder sinngemäß: „in wahrer Gerechtigkeit und Heiligkeit“ beziehungsweise „in Gerechtigkeit und Heiligkeit, die aus der Wahrheit kommen“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: anzuziehen
  rationale: Der Infinitiv führt das Kleidungsbild des Ablegens und Anziehens aus dem Zusammenhang fort; „anziehen“ ist im Deutschen knapp und natürlich.
- source_word: καινὸν ἄνθρωπον
  choice: den neuen Menschen
  rationale: Bewahrt die wörtliche anthropologische Formulierung und die Verbindung zum „alten Menschen“ im unmittelbaren Kontext; „Mensch“ ist im Deutschen geschlechtsübergreifend verwendbar.
- source_word: κατὰ θεὸν
  choice: nach Gott
  rationale: Gibt κατά mit Akkusativ knapp wieder und lässt offen, ob vor allem Gottes Vorbild, Entsprechung zu Gott oder Gottes Art gemeint ist.
- source_word: κτισθέντα
  choice: der … geschaffen ist
  rationale: Bewahrt das passive Schöpfungsvokabular und bezieht den Ausdruck eindeutig auf den neuen Menschen.
- source_word: δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Wiedergabe und umfasst hier moralische Richtigkeit sowie gerechtes Handeln.
- source_word: ὁσιότητι
  choice: Heiligkeit
  rationale: „Heiligkeit“ gibt die auf Gott bezogene Reinheit und Frömmigkeit des Ausdrucks angemessen und verständlich wieder.
- source_word: τῆς ἀληθείας
  choice: der Wahrheit
  rationale: Die Genitivkonstruktion bleibt formal erhalten, sodass ihr Verhältnis zu Gerechtigkeit und Heiligkeit nicht vorschnell auf „wahrhaftig“ oder „aus der Wahrheit“ festgelegt wird.
theological_decisions:
- issue: Anthropologische Wendung „neuer Mensch“
  choice: den neuen Menschen
  alternative: das neue Selbst; der neue Mensch als neue Persönlichkeit
  rationale: Die Wiedergabe erhält das Gegenstück zum „alten Menschen“ und vermeidet eine Festlegung auf ein rein individuelles psychologisches Selbst.
- issue: Bedeutung von κατὰ θεὸν
  choice: nach Gott
  alternative: Gott entsprechend; nach Gottes Bild
  rationale: „Nach Gott“ bewahrt die Spannung der griechischen Wendung, ohne ausdrücklich eine Bild-Gottes-Terminologie einzufügen, die hier nicht wörtlich steht.
- issue: Bezug des Genitivs τῆς ἀληθείας
  choice: Gerechtigkeit und Heiligkeit der Wahrheit
  alternative: wahre Gerechtigkeit und Heiligkeit; Gerechtigkeit und Heiligkeit, die aus der Wahrheit kommen
  rationale: Der formale Genitiv lässt offen, ob Wahrheit beide Begriffe qualitativ bestimmt, ihren Ursprung bezeichnet oder enger mit ihnen verbunden ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als Fortsetzung des vorangehenden Gedankens mit „und“ erhalten. Die ungewöhnliche Genitivverbindung „Heiligkeit der Wahrheit“ wird wegen ihrer echten grammatischen Offenheit im Haupttext bewahrt und in der Fußnote erläutert.
