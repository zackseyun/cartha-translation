revisions:
- from: und den neuen Menschen[a] anzuziehen, der nach Gott[b] in Gerechtigkeit[c] und Heiligkeit der Wahrheit[d] geschaffen ist.
  to: und den neuen Menschen[a] anzuziehen, der Gott entsprechend[b] in Gerechtigkeit[c] und Heiligkeit der Wahrheit[d] geschaffen ist.
  rationale: Die einzige Änderung im Haupttext ersetzt die unnatürliche, aber formal nahe Wendung „nach Gott“ durch das moderne und semantisch präzise „Gott entsprechend“. Die Fußnote hält die wörtliche Form sowie die mögliche Deutung „nach Gottes Bild“ fest. Die Genitivkonstruktion „der Wahrheit“ bleibt im Haupttext stehen, damit die Beziehung des Genitivs nicht voreilig als rein qualitativ oder als Herkunftsangabe entschieden wird.
