id: EPH.4.7
reference: Ephesians 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: de
  text: Jedem Einzelnen von uns aber wurde die Gnade nach dem Maß der Gabe des Messias[a] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gabe Christi“. Der griechische Titel Χριστός kann mit „Christus“ wiedergegeben werden, besonders wenn er wie ein Name gebraucht wird; hier bewahrt „Messias“ die Bedeutung des Titels.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: Jedem Einzelnen von uns
  rationale: Die Verbindung von ἑνί und ἑκάστῳ ist distributiv und betont die individuelle Zuteilung innerhalb der Gemeinschaft. „Jedem Einzelnen von uns“ bildet diese Hervorhebung im Deutschen deutlich ab.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen milden Gegensatz beziehungsweise Übergang von der zuvor betonten Einheit zur Vielfalt der verliehenen Gnade. Die nachgestellte Stellung von „aber“ klingt im Deutschen natürlich und würdig.
- source_word: ἐδόθη
  choice: wurde ... gegeben
  rationale: Der Aorist Passiv wird als schlichtes deutsches Präteritum Passiv wiedergegeben.
- source_word: ἡ χάρις
  choice: die Gnade
  rationale: „Gnade“ bewahrt den theologischen Wortlaut des Paulus und lässt den Kontext bestimmen, dass hier die zum Dienst zugeteilte Gnade im Blick steht. Der griechische Artikel kann im Deutschen natürlich mitgeführt werden.
- source_word: κατὰ τὸ μέτρον
  choice: nach dem Maß
  rationale: κατά mit Akkusativ bezeichnet hier Maßstab oder Verhältnis. „Nach dem Maß“ ist präzise, idiomatisch und weniger schwerfällig als „gemäß dem Maß“.
- source_word: τῆς δωρεᾶς
  choice: der Gabe
  rationale: „Gabe“ bezeichnet etwas frei Gewährtes und vermeidet im Zusammenhang mit „gegeben“ die etwas stärkere Wiederholung von „Geschenk“.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός bewahrt hier als Titel seinen Bedeutungsgehalt. Der deutsche Genitiv lässt offen, ob es sich um die vom Messias verliehene oder ihm zugehörige Gabe handelt.
theological_decisions:
- issue: Bedeutung von χάρις im Kontext
  choice: Gnade als individuell zugeteilte Befähigung beziehungsweise Gabe innerhalb der Gemeinde
  alternative: allgemeine göttliche Gunst oder ausschließlich rettende Gnade
  rationale: Der unmittelbare Zusammenhang führt von der Einheit der Gemeinde zu unterschiedlichen Dienstgaben. Im Haupttext bleibt dennoch das theologisch offene Wort „Gnade“ stehen, sodass die Spannung nicht durch eine erklärende Paraphrase aufgelöst wird.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Hier ist der Titelcharakter noch erkennbar; „Messias“ gibt den Bedeutungsgehalt des griechischen Titels wieder. Die traditionelle Wiedergabe „Christus“ wird in der Fußnote genannt.
- issue: Genitiv τῆς δωρεᾶς τοῦ Χριστοῦ
  choice: der Gabe des Messias
  alternative: der Gabe, die der Messias gibt
  rationale: Die kompakte Genitivkonstruktion bewahrt die mögliche Bedeutungsbreite, statt den Genitiv ausdrücklich und ausschließlich als Urheberschaft aufzulösen.
translation_notes:
  register: Modernes, standarddeutsches und würdiges Register. Die emphatische Individualisierung wird mit „Jedem Einzelnen“ erhalten; die Wortstellung bleibt natürlich. Der Haupttext bewahrt die paulinischen Schlüsselbegriffe „Gnade“, „Maß“ und „Gabe“ sowie die Mehrdeutigkeit der Genitivverbindung.
