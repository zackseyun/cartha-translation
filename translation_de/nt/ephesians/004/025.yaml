  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: de
  text: Darum legt die Unwahrheit ab[a]; jeder soll mit seinem Nächsten die Wahrheit reden, denn wir sind Glieder voneinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lüge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Ermahnung knapp und natürlich.
- source_word: ἀποθέμενοι
  choice: legt … ab
  rationale: Das Aoristpartizip steht im Zusammenhang einer Aufforderung. Die koordinierte deutsche Aufforderung gibt die geforderte entschiedene Abkehr idiomatisch wieder, ohne sie als bloße Begleithandlung abzuschwächen.
- source_word: τὸ ψεῦδος
  choice: die Unwahrhaftigkeit
  rationale: Der substantivierte Singular bezeichnet hier am ehesten falsches, täuschendes Verhalten als ethische Kategorie. Die mögliche formalere Wiedergabe „die Lüge“ bleibt in der Fußnote erhalten.
- source_word: λαλεῖτε ἀλήθειαν
  choice: redet die Wahrheit
  rationale: Gibt den fortdauernd geltenden Imperativ und den direkten Gegensatz zur Unwahrhaftigkeit klar wieder.
- source_word: ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ
  choice: jeder mit seinem Nächsten
  rationale: Bewahrt sowohl die distributive Verpflichtung jedes Einzelnen als auch μετά mit Genitiv im Sinn gemeinschaftlicher Beziehung.
- source_word: ὅτι
  choice: denn
  rationale: Leitet in diesem ermahnenden Zusammenhang den Grund für das Gebot natürlich ein.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: wir sind Glieder voneinander
  rationale: Bewahrt das Körperbild und die pointierte gegenseitige Zugehörigkeit des griechischen Ausdrucks.
theological_decisions:
- issue: Umfang von τὸ ψεῦδος
  choice: Als allgemeine Unwahrhaftigkeit verstanden
  alternative: „die Lüge“ als bestimmter oder kollektiv aufgefasster Singular
  rationale: Der ethische Zusammenhang spricht für täuschendes Verhalten als Kategorie; Artikel und Singular lassen jedoch die formalere Lesart „die Lüge“ zu, die deshalb nicht verschwiegen wird.
- issue: Gegenseitige Zugehörigkeit im Leibbild
  choice: „Glieder voneinander“
  alternative: „untereinander Glieder“ oder „als Glieder miteinander verbunden“
  rationale: 'Die gewählte Formulierung erhält die ungewöhnlich starke Aussage ἀλλήλων: Die Glaubenden gehören nicht nur demselben Ganzen, sondern in ihrer Gliedschaft auch einander an.'
- issue: Generischer maskuliner Singular
  choice: „jeder mit seinem Nächsten“
  alternative: „alle mit ihren Mitmenschen“
  rationale: Die grammatische Einzelansprache des Griechischen bleibt sichtbar; im Deutschen ist sie in diesem Zusammenhang allgemein auf alle Angesprochenen bezogen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Redet die Wahrheit“ und „Glieder“ bewahren den biblischen Bild- und Begriffszusammenhang; die Satzstellung bleibt trotz der Nähe zum Griechischen gut verständlich.
