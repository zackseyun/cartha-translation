revisions:
- from: Darum legt die Unwahrhaftigkeit ab[a] und redet die Wahrheit, jeder mit seinem Nächsten; denn wir sind Glieder voneinander.
  to: Darum legt die Unwahrheit ab[a]; jeder soll mit seinem Nächsten die Wahrheit reden, denn wir sind Glieder voneinander.
  rationale: Die Revision ersetzt die eigenschaftsbezogene „Unwahrhaftigkeit“ durch „Unwahrheit“, das die von τὸ ψεῦδος bezeichnete ethische Kategorie im Kontext präziser trifft. Die Satzglieder werden für natürliches modernes Deutsch umgestellt. Die alternative Wiedergabe „die Lüge“ bleibt als vertretbare Lesart des artikulären Singulars verankert.
