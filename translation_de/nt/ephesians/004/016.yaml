source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: de
  text: Von ihm her wird der ganze Leib durch jedes Gelenk, das ihn versorgt,[a] zusammengefügt und zusammengehalten. Indem jedes einzelne Glied in dem ihm zugemessenen Maß wirksam ist, bewirkt der Leib sein Wachstum und baut sich selbst in Liebe auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „jedes Gelenk, das ihn versorgt“ kann auch mit „jedes Band, das ihn unterstützt“ oder „jede Verbindung, die Versorgung leistet“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: Von ihm her
  rationale: Der unmittelbare Bezug ist Christus in Vers 15. Die persönliche Wiedergabe wahrt ihn als Ursprung, ohne die Mitwirkung der Glieder zu verdecken.
- source_word: πᾶν τὸ σῶμα
  choice: der ganze Leib
  rationale: Natürliche deutsche Wiedergabe des singulären Kollektivausdrucks; zugleich bleibt das paulinische Leibbild erhalten.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: zusammengefügt und zusammengehalten
  rationale: Die beiden Passivpartizipien bezeichnen sowohl das passende Zusammenfügen als auch den fortdauernden Zusammenhalt.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: durch jedes Gelenk, das ihn versorgt
  rationale: Die Formulierung bewahrt das konkrete Körperbild von ἁφή und gibt den Versorgungs- beziehungsweise Unterstützungsaspekt von ἐπιχορηγία verständlich wieder, ohne anatomisch zu präzisieren.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: Indem jedes einzelne Glied in dem ihm zugemessenen Maß wirksam ist
  rationale: Die deutsche Formulierung macht die proportionale Wirksamkeit jedes Teils deutlich und wahrt sowohl ἐνέργεια als auch μέτρον, ohne das interpretierende Adjektiv „richtig“ einzuführen.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: bewirkt der Leib sein Wachstum
  rationale: Das Subjekt „der ganze Leib“ wird im Deutschen wieder aufgenommen. „bewirkt … sein Wachstum“ gibt die kausative Wendung idiomatisch wieder und lässt den Leib als handelndes Subjekt erscheinen.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: baut sich selbst … auf
  rationale: Die verbale Wiedergabe ist modernes Deutsch und bewahrt die reflexive Aussage von ἑαυτοῦ sowie das Bild des Aufbauens.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Direkte und kontextgemäße Wiedergabe, die den theologischen und gemeinschaftlichen Sinn nicht weiter einengt.
theological_decisions:
- issue: Ursprung und Träger des Wachstums der Gemeinde
  choice: Christus wird mit „Von ihm her“ als Ursprung genannt; zugleich bewirkt der Leib sein Wachstum durch die maßgemäße Wirksamkeit jedes Gliedes.
  alternative: Das Wachstum ausschließlich Christus zuzuschreiben oder die Wendung unpersönlich mit „von dem her“ wiederzugeben.
  rationale: Der Kontext bezieht das Relativpronomen auf Christus, während die Grammatik den ganzen Leib als Subjekt von ποιεῖται erkennen lässt. Die Übersetzung hält beides zusammen.
- issue: Bedeutung von ἁφή und ἐπιχορηγία im Leibbild
  choice: „jedes Gelenk, das ihn versorgt“
  alternative: „jedes Band, das Unterstützung gewährt“ oder „jede versorgende Verbindung“
  rationale: Die gewählte Fassung erhält das körperliche Bild und die Funktion der Versorgung, ohne ἁφή eindeutig auf ein anatomisches Band oder Gelenk festzulegen; die mögliche Breite wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Leib“ und „Glied“ bewahren das konkrete paulinische Körperbild; „in dem ihm zugemessenen Maß“ erhält die Spannung zwischen zugeteiltem Maß und tatsächlicher Wirksamkeit.
