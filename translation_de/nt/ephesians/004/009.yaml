id: EPH.4.9
reference: Ephesians 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: de
  text: Was bedeutet aber »Er stieg hinauf« anderes, als dass er auch in die tieferen Bereiche der Erde hinabstieg?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die tieferen Bereiche, nämlich auf die Erde«. Die Wendung kann einfach das Herabkommen auf die Erde bezeichnen oder genauer den Bereich der Toten.'
    reason: Bewahrt die grammatische und theologische Mehrdeutigkeit der Wendung τὰ κατώτερα μέρη τῆς γῆς.
lexical_decisions:
- source_word: Ἀνέβη
  choice: Er stieg hinauf
  rationale: Gibt den Aorist von ἀναβαίνω wieder, greift das Zitat auf und bewahrt zusammen mit »hinabstieg« die räumliche Gegenüberstellung.
- source_word: τὸ δὲ … τί ἐστιν εἰ μὴ ὅτι
  choice: Was bedeutet aber … anderes, als dass
  rationale: Natürliches modernes Deutsch für die griechische Schlussfolgerungsformel; δέ wird als argumentatives »aber« wiedergegeben, ohne einen zeitlichen Übergang einzuführen.
- source_word: καὶ κατέβη
  choice: dass er auch … hinabstieg
  rationale: »auch« bewahrt die additive Kraft von καί; »hinabstieg« entspricht dem Bewegungsbild und bildet den Gegenpol zu »stieg hinauf«.
- source_word: εἰς
  choice: in … hinabstieg
  rationale: Die Verbindung aus »in« und dem gerichteten Verb bewahrt die Bewegung in einen Bereich hinein und klingt im Deutschen natürlich.
- source_word: τὰ κατώτερα μέρη
  choice: die tieferen Bereiche
  rationale: κατώτερα ist komparativ und μέρη bezeichnet Teile oder Bereiche. »Tiefere Bereiche« ist verständlich und lässt den Bezug offen, ohne ihn vorschnell als Totenreich festzulegen.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: 'Bewahrt den Genitiv und damit die mögliche partitive oder erläuternde Beziehung: tiefere Bereiche der Erde oder tiefere Bereiche, nämlich die Erde.'
theological_decisions:
- issue: Deutung von εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: Die mehrdeutige Formulierung »in die tieferen Bereiche der Erde« bleibt im Haupttext erhalten.
  alternative: »in die tieferen Bereiche, nämlich auf die Erde« oder ausdrücklich »in das Reich der Toten«
  rationale: Der griechische Genitiv kann unterschiedlich verstanden werden. Der Haupttext legt daher weder nur die Menschwerdung beziehungsweise das Herabkommen auf die Erde noch ausdrücklich den Abstieg in das Totenreich fest; die Fußnote nennt beide Hauptmöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtliche Bewegungsmetaphorik wird beibehalten; die umstrittene Ortsangabe bleibt bewusst offen und wird in der Fußnote erläutert.
