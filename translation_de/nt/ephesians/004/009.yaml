  source_fidelity: Der Text gibt die Schlussfolgerungsfrage τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι treffend wieder. »Er stieg hinauf« und »hinabstieg« bewahren die korrespondierenden Bewegungsverben, »auch« gibt καί wieder, und »in die tieferen Bereiche der Erde« erhält sowohl die Richtung von εἰς als auch die syntaktisch und theologisch umstrittene Mehrdeutigkeit des Genitivs τῆς γῆς.
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Satzstellung mit »Was bedeutet aber … anderes, als dass …« ist idiomatisch und bildet den argumentativen Charakter des griechischen Satzes angemessen ab.
  terminology: Die Begriffe »hinaufstieg«, »hinabstieg«, »Erde« und »Bereiche« sind sachgerecht. »Tiefere Bereiche« ist gegenüber einer Festlegung auf Totenreich oder Unterwelt angemessen offen. Die Fußnote erläutert beide wesentlichen Deutungsmöglichkeiten, ohne eine konfessionelle Auslegung vorzuschreiben.
