  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: de
  text: Der hinabgestiegen ist, ist derselbe, der auch weit über alle Himmel hinaufgestiegen ist,[a] um alles zu erfüllen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über alle Himmel hinaufgestiegen ist“. „Weit über“ hebt seine Erhöhung über jeden himmlischen Bereich hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um alles zu füllen“. Das griechische Verb bezeichnet hier wahrscheinlich das Füllen oder Zur-Fülle-Bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: der hinabgestiegen ist
  rationale: Das substantivierte Aoristpartizip wird als natürlicher deutscher Relativsatz wiedergegeben; die vollzogene Bewegung bleibt erkennbar.
- source_word: αὐτός ἐστιν καὶ
  choice: ist derselbe, der auch
  rationale: 'Die Formulierung bewahrt die emphatische Identität: Der Hinabgestiegene und der Hinaufgestiegene sind ein und dieselbe Person.'
- source_word: ὁ ἀναβὰς
  choice: der ... hinaufgestiegen ist
  rationale: Parallel zu ὁ καταβὰς wird auch dieses substantivierte Partizip als Relativsatz übersetzt.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: weit über alle Himmel
  rationale: „Weit über“ gibt die steigernde bzw. übergeordnete räumliche Bedeutung von ὑπεράνω wieder; der Plural „Himmel“ bleibt erhalten.
- source_word: ἵνα
  choice: um ... zu
  rationale: Der deutsche Infinitivsatz bringt die hier naheliegende Zweckbedeutung knapp und idiomatisch zum Ausdruck.
- source_word: πληρώσῃ
  choice: zu erfüllen
  rationale: „Erfüllen“ kann im Deutschen sowohl das Füllen als auch das Zur-Fülle-Bringen bezeichnen und wahrt damit die Bedeutungsweite des Verbs im Kontext. Die mögliche Lesart „alles ausfüllen“ wird in einer Fußnote genannt.
- source_word: τὰ πάντα
  choice: alles
  rationale: „Alles“ ist eine natürliche, umfassende Wiedergabe des substantivierten Neutrums, ohne den Bezug auf Menschen oder Kosmos einzuengen.
theological_decisions:
- issue: Identität des Hinabgestiegenen und Hinaufgestiegenen
  choice: „ist derselbe, der auch“ betont ausdrücklich die Identität beider.
  alternative: Eine schwächere Formulierung wie „ist auch der, der“ könnte die Betonung von αὐτός weniger deutlich wiedergeben.
  rationale: αὐτός sowie die parallelen substantivierten Partizipien heben hervor, dass dieselbe Person hinab- und hinaufgestiegen ist; die Übersetzung fügt keine nähere Erklärung der Person oder der Bewegungen hinzu.
- issue: Bedeutung von πληρώσῃ
  choice: „alles zu erfüllen“
  alternative: „alles auszufüllen“
  rationale: Das griechische πληρόω besitzt hier eine semantische Weite zwischen Füllen, Ausfüllen und Zur-Fülle-Bringen. „Erfüllen“ hält diese theologische Spannung eher offen, während die konkretere Alternative in der Fußnote dokumentiert wird.
- issue: Umfang von τὰ πάντα
  choice: „alles“
  alternative: „alle Dinge“ oder deutend „das ganze Universum“
  rationale: Die umfassende, aber nicht näher bestimmte Reichweite des griechischen Ausdrucks bleibt erhalten; sie wird weder auf Menschen begrenzt noch ausdrücklich kosmologisch ausgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bewegungsverben „hinabgestiegen“ und „hinaufgestiegen“ erhalten die Struktur des griechischen Satzes; „derselbe“ macht dessen Identitätsbetonung idiomatisch deutlich.
