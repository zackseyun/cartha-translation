  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: de
  text: Ein Leib und ein Geist[a], wie ihr auch zu einer Hoffnung eurer Berufung berufen wurdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier den Heiligen Geist oder einen gemeinsamen Geist beziehungsweise eine geistliche Haltung bezeichnen. Im Zusammenhang ist der Heilige Geist am wahrscheinlichsten gemeint.
    reason: Lexikalische und referenzielle Alternative; das griechische πνεῦμα legt den Bezug ohne weiteren Kontext nicht durch eine Großschreibung fest.
lexical_decisions:
- source_word: ἓν
  choice: ein/einen
  rationale: Die wiederholte Zahlbezeichnung betont die Einheit und wird in beiden Vorkommen konsequent mit „ein“ wiedergegeben; Kasus und Genus werden im Deutschen angepasst.
- source_word: σῶμα
  choice: Leib
  rationale: „Leib“ bewahrt die im Epheserbrief geläufige Metapher für die zusammengehörige Gemeinschaft der Glaubenden und passt zum würdevollen biblischen Register.
- source_word: πνεῦμα
  choice: Geist
  rationale: Im Zusammenhang der Einheitsformel von Epheser 4,4–6 ist sehr wahrscheinlich der Heilige Geist gemeint. Da der griechische Text keine Groß-/Kleinschreibung zur Unterscheidung bietet, wird die mögliche Alternative in einer Fußnote festgehalten.
- source_word: καθὼς καὶ
  choice: so wie ihr auch
  rationale: Die Formulierung gibt den Vergleich durch καθώς und das ergänzende καί natürlich wieder und bezieht die Angesprochenen ausdrücklich ein.
- source_word: ἐκλήθητε
  choice: ihr berufen wurdet
  rationale: Die passive Form wird bewahrt, ohne den im Text unausgesprochenen Handelnden ausdrücklich zu benennen.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: zu der einen Hoffnung
  rationale: In Verbindung mit „berufen werden“ bezeichnet ἐν hier den Bereich beziehungsweise das Ziel der Berufung. „Zu“ ist im modernen Deutschen idiomatischer als das missverständliche „in einer Hoffnung“, während „einen“ das Einheitsmotiv erhält.
- source_word: τῆς κλήσεως ὑμῶν
  choice: eurer Berufung
  rationale: Die Genitivverbindung bleibt knapp und bewahrt durch „Berufung“ die Wortverwandtschaft mit „berufen wurdet“.
theological_decisions:
- issue: Bezugswort von πνεῦμα
  choice: der Heilige Geist, im Haupttext als „Geist“ großgeschrieben
  alternative: ein gemeinsamer Geist oder eine gemeinsame geistliche Haltung der Glaubenden
  rationale: Die Reihe „ein Leib ... ein Geist ... ein Herr ... ein Gott und Vater“ in Epheser 4,4–6 spricht stark für den Heiligen Geist. Die Fußnote erhält dennoch die sprachlich mögliche andere Lesart.
- issue: Bedeutung von ἐν μιᾷ ἐλπίδι bei ἐκλήθητε
  choice: „zu der einen Hoffnung“
  alternative: „in der einen Hoffnung“
  rationale: „Zu“ drückt im Deutschen die enge Verbindung zwischen Berufung und Hoffnung verständlich aus, ohne eine zusätzliche theologische Aussage einzuführen. Die Einheit der Hoffnung bleibt durch den bestimmten Ausdruck „der einen“ hervorgehoben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib“ bewahrt die paulinische Gemeinschaftsmetapher; die Wiederholung „Berufung/berufen“ bildet die griechische Wortverwandtschaft hörbar ab. Der Satz beginnt wie das Griechische ohne ergänzendes „Es gibt“ und setzt damit die knappe Einheitsreihe fort.
