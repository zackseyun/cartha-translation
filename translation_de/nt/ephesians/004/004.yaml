    rationale: Im Deutschen werden sowohl ein allgemeiner Geist als auch der Heilige Geist als Substantiv großgeschrieben. Die Fußnote sollte die referenzielle Ambiguität von πνεῦμα erklären, nicht eine im Deutschen nicht abbildbare Groß-/Kleinschreibungsdifferenz behaupten.
