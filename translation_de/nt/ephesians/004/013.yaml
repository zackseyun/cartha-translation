id: EPH.4.13
reference: Ephesians 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: de
  text: bis wir alle zur Einheit des Glaubens[a] und der Erkenntnis[b] des Sohnes Gottes gelangen, zum reifen Mann[c], zum Maß der Größe[d] der Fülle des Messias[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des gemeinsamen Glaubens“. Gemeint sein kann besonders der von allen geteilte christliche Glaube, aber auch der Glaube der Glaubenden allgemein.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „der vollen Erkenntnis“ oder „der tiefen Erkenntnis“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „zur Reife eines Erwachsenen“. Wörtlich steht im Griechischen „zu einem reifen Mann“; der männliche Singular ist ein Bild für die gemeinsame Reife der ganzen Gemeinde.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Reife“. Das griechische Wort kann Größe beziehungsweise Körperwuchs, Lebensalter oder Reife bezeichnen.'
    reason: lexical_alternative
  - marker: e
    text: 'Griechisch: „Christus“. Hier mit „Messias“ wiedergegeben, weil der Titelcharakter hervortritt.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: bis
  rationale: Kennzeichnet das Ziel des in den vorhergehenden Versen beschriebenen Zurüstens.
- source_word: καταντήσωμεν οἱ πάντες
  choice: wir alle … gelangen
  rationale: Gibt das Erreichen eines geistlichen Ziels sowie die ausdrückliche Einbeziehung der ganzen Gemeinschaft wieder.
- source_word: εἰς τὴν ἑνότητα
  choice: zur Einheit
  rationale: Bewahrt die Zielrichtung von εἰς und die bestimmte, erkennbare Einheit.
- source_word: τῆς πίστεως
  choice: des Glaubens
  rationale: Die Formulierung lässt im Deutschen wie im Griechischen sowohl den gemeinsam bekannten Glauben als auch den Glauben der Glaubenden anklingen.
- source_word: ἐπιγνώσεως
  choice: Erkenntnis
  rationale: Im Deutschen ist „Erkenntnis“ für die persönliche und inhaltliche Kenntnis des Sohnes Gottes angemessen, ohne den möglichen Verstärkungsgehalt festzuschreiben.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: des Sohnes Gottes
  rationale: Direkte Wiedergabe der Genitivverbindung und des christologischen Titels.
- source_word: εἰς ἄνδρα τέλειον
  choice: zum reifen Mann
  rationale: Bewahrt das maskuline Singularbild für die gemeinsame Reife der ganzen Gemeinde; τέλειος bezeichnet hier im Wachstumskontext Reife beziehungsweise Vollendung.
- source_word: μέτρον
  choice: Maß
  rationale: Erhält das Bild des Messens und die dreifach wiederholte Zielangabe mit εἰς.
- source_word: ἡλικίας
  choice: Größe
  rationale: Bewahrt das körperliche Wachstumsbild; das Wort kann im Kontext zugleich Reife oder ausgewachsene Gestalt bezeichnen.
- source_word: τοῦ πληρώματος
  choice: der Fülle
  rationale: Erhält den theologisch gewichtigen und bewusst dichten Ausdruck πλήρωμα, statt ihn paraphrasierend aufzulösen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός wird hier als theologischer Titel für den Gesalbten verstanden und entsprechend mit „Messias“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von τῆς πίστεως
  choice: des Glaubens, mit wahrscheinlichem Bezug auf den gemeinsam bekannten christlichen Glauben
  alternative: des Glaubens im Sinn des persönlichen Glaubens oder Vertrauens der Glaubenden
  rationale: Artikel und Gemeinschaftskontext sprechen eher für den gemeinsam bekannten Glauben; die deutsche Formulierung lässt die sachlich echte Mehrdeutigkeit jedoch bestehen.
- issue: Korporatives Bild in εἰς ἄνδρα τέλειον
  choice: zum reifen Mann
  alternative: zur Reife eines Erwachsenen; zum vollkommenen Mann
  rationale: Der griechische Text verwendet ausdrücklich einen einzelnen Mann als Bild für die geeinte, zur Reife gelangende Gemeinde. Dieses spannungsreiche korporative Bild wird nicht neutralisiert.
- issue: Verhältnis von μέτρον, ἡλικία und πλήρωμα
  choice: zum Maß der Größe der Fülle
  alternative: zum Maß der Reife der Fülle; zum Maß der vollen Größe
  rationale: Die eng gefügten Genitive sind auslegungsfähig. Die Hauptfassung bewahrt ihre Dichte und das Wachstumsbild, ohne „Fülle“ stillschweigend nur zu einem Adjektiv umzuformen.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle ist der Titelcharakter des griechischen Wortes deutlich; „Messias“ macht die Bedeutung als der Gesalbte transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ formnaher Satzstruktur. Die dreifache Zielbewegung („zur …, zum …, zum …“) und die dichte Folge der Genitive bleiben erhalten. Ungewöhnlich ist bewusst „zum reifen Mann“, weil damit das korporative Bild des griechischen Singulars sichtbar bleibt; eine idiomatischere Erklärung steht in der Fußnote.
