id: EPH.4.20
reference: Ephesians 4:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: de
  text: Ihr aber habt den Messias nicht auf diese Weise kennengelernt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ihr aber habt Christus nicht auf diese Weise kennengelernt.'
    reason: Alternative Wiedergabe von Χριστόν mit der traditionellen deutschen Bezeichnung »Christus«.
lexical_decisions:
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen bezeichnet die Adressaten im Plural und trägt zusammen mit »aber« den Kontrast zum vorher beschriebenen Leben der anderen Völker.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier den Gegensatz zur vorangehenden Schilderung und wird im Deutschen natürlich adversativ wiedergegeben.
- source_word: οὐχ οὕτως
  choice: nicht auf diese Weise
  rationale: Die Verbindung verneint die zuvor beschriebene Art und Weise des Lebens; die Formulierung wahrt diesen modalen Bezug deutlicher als ein bloßes »nicht so«.
- source_word: ἐμάθετε
  choice: habt … kennengelernt
  rationale: μανθάνω bedeutet grundsätzlich »lernen«. Da hier eine Person direktes Objekt ist, gibt »kennenlernen« die ungewöhnliche griechische Wendung im natürlichen Deutschen wieder, ohne das Passiv »unterrichtet werden« aus dem folgenden Vers vorwegzunehmen.
- source_word: τὸν Χριστόν
  choice: den Messias
  rationale: Χριστός trägt mit Artikel titelhaften Charakter. »Messias« bewahrt diesen Sinn; der Personenbezug bleibt als direktes Objekt der Lernwendung erhalten.
theological_decisions:
- issue: Χριστόν als Titel oder konventionelle Namensform
  choice: den Messias
  alternative: Christus
  rationale: Der Artikel und der Kontext erlauben eine titelbezogene Wiedergabe. »Messias« hält die Bedeutung des Titels sichtbar, während die Fußnote die im Deutschen kirchlich geläufige Wiedergabe »Christus« dokumentiert.
- issue: Ungewöhnliche Wendung »den Christus lernen«
  choice: den Messias kennenlernen
  alternative: den Messias lernen
  rationale: Die griechische Spannung, dass eine Person Gegenstand des Lernens ist, bleibt inhaltlich bestehen. Das im Deutschen ungrammatisch beziehungsweise missverständlich wirkende »eine Person lernen« wird jedoch nicht mechanisch nachgebildet; »kennenlernen« vermeidet zugleich die Einengung auf bloße Belehrung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung »Ihr aber« erhält den ausdrücklichen Kontrast des griechischen Pronomens; »auf diese Weise« verweist klar auf die zuvor geschilderte Lebensführung.
