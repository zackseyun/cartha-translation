  source_fidelity: 'Der Haupttext gibt die drei griechischen Präpositionalgruppen vollständig und in ihrer Reihenfolge wieder: πρὸς τὸν καταρτισμόν mit „zur Ausrüstung“, εἰς ἔργον διακονίας mit „für das Werk des Dienstes“ und εἰς οἰκοδομὴν mit „zum Aufbau“. Die Genitivverbindungen „der Heiligen“ und „des Leibes des Messias“ entsprechen dem Ausgangstext. Die deutsche Formulierung wahrt die im Griechischen bestehende syntaktische Offenheit zwischen gestaffelter und koordinierter Zweckbeziehung.'
