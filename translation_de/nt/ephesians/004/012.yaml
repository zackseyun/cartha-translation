  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: de
  text: zur Ausrüstung der Heiligen für das Werk des Dienstes[a], zum Aufbau des Leibes des Messias[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Werk des Dienens“. Das griechische Wort διακονία kann sowohl Dienst als auch dienendes Wirken bezeichnen und ist nicht auf ein kirchliches Amt beschränkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“. Das griechische Χριστός bedeutet als Titel „Messias“.'
    reason: alternative_reading
  - marker: c
    text: 'Die drei Angaben können auch als parallele Zwecke verstanden werden: „zur Ausrüstung der Heiligen, für das Werk des Dienstes und zum Aufbau des Leibes des Messias“. Möglich ist ebenso die fortschreitende Auffassung, dass die Heiligen für den Dienst ausgerüstet werden und dieser dem Aufbau des Leibes dient.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: zur Ausrüstung
  rationale: καταρτισμός bezeichnet das Zurüsten, Vorbereiten oder Tauglichmachen. „Ausrüstung“ bewahrt die substantivische Form und drückt den Zweck in verständlichem Deutsch aus.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: Dies ist die etablierte paulinische Bezeichnung für die zu Gott gehörenden und für ihn ausgesonderten Gläubigen; sie bezeichnet hier nicht eine später kirchlich kanonisierte Sondergruppe.
- source_word: εἰς ἔργον διακονίας
  choice: für das Werk des Dienstes
  rationale: Die Formulierung gibt sowohl das singularische ἔργον als auch den weiten Bedeutungsbereich von διακονία wieder. „Dienst“ ist im Deutschen breiter und weniger auf ein kirchliches Amt beschränkt als „Dienstamt“.
- source_word: εἰς οἰκοδομὴν
  choice: zum Aufbau
  rationale: οἰκοδομή verwendet ein Baubild für die Stärkung und Entfaltung der Gemeinschaft. „Aufbau“ erhält dieses Bild in natürlichem modernem Deutsch.
- source_word: τοῦ σώματος
  choice: des Leibes
  rationale: „Leib“ bewahrt die paulinische Gemeinschaftsmetapher und entspricht dem würdigen biblischen Register besser als das ebenfalls mögliche „Körper“.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier ein Titel. „Messias“ macht den titularen Sinn sichtbar; die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Syntaktisches Verhältnis der drei Zweckangaben
  choice: Die Präpositionsfolge wird eng am Griechischen mit „zur … für … zum …“ wiedergegeben, sodass die Heiligen als für den Dienst ausgerüstet verstanden werden können, der dem Aufbau des Leibes dient.
  alternative: Alle drei Angaben können als parallele Zwecke der in Vers 11 genannten Gaben beziehungsweise Personen verstanden werden.
  rationale: Die Folge πρός … εἰς … εἰς lässt sowohl eine fortschreitende als auch eine koordinierte Deutung zu. Der Haupttext bewahrt die griechische Struktur; die Fußnote hält die andere syntaktische Möglichkeit offen, ohne die Frage nach den Trägern des Dienstes konfessionell festzulegen.
- issue: Wiedergabe des Titels Χριστός
  choice: Messias
  alternative: Christus
  rationale: „Messias“ bewahrt ausdrücklich den Titelcharakter; „Christus“ ist die eingebürgerte deutsche Form und bleibt als sachlich mögliche Wiedergabe in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle paulinische Bezeichnung „die Heiligen“ und die Leib-Metapher bleiben erhalten. Die nominale Struktur des griechischen Fragments wird bewahrt, da der Vers syntaktisch an Epheser 4,11 anschließt.
