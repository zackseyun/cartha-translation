translation:
  language: de
  text: 'Vielmehr lasst uns, indem wir in Liebe wahrhaftig sind[a], in jeder Hinsicht[b] in ihn hineinwachsen, der das Haupt ist: der Messias[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem wir in Liebe die Wahrheit sagen“ beziehungsweise „die Wahrheit tun“. Das griechische Verb kann wahrhaftiges Reden und wahrhaftiges Handeln umfassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in allem“; wörtlicher: „alles“.'
    reason: lexical_alternative
  - marker: c
    text: 'Griechisch: „Christus“; hier als Titel „Messias“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: indem wir … wahrhaftig sind
  rationale: Das griechische Verb kann sowohl wahrhaftiges Reden als auch wahrhaftiges Handeln bezeichnen. Die deutsche Formulierung bewahrt diese Bedeutungsbreite, ohne den unmittelbaren Zusammenhang mit irreführender Lehre auszublenden.
- source_word: δὲ
  choice: vielmehr
  rationale: δέ setzt hier einen milden Gegensatz zur zuvor beschriebenen Unbeständigkeit und Täuschung; „vielmehr“ gibt diesen Übergang im Deutschen natürlich wieder.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Die Wendung bewahrt sowohl die Art und Weise als auch den Lebensbereich, in dem die Wahrhaftigkeit gelten soll.
- source_word: αὐξήσωμεν
  choice: sollen wir … hineinwachsen
  rationale: Der hortative Konjunktiv fordert die Gemeinschaft zum Wachstum auf. „Sollen wir“ klingt im modernen Deutschen natürlich und bewahrt den auffordernden Charakter.
- source_word: εἰς αὐτὸν
  choice: in ihn hinein
  rationale: Die Wiedergabe erhält die Richtungsangabe und das Bild eines Wachstums hinein in den Messias stärker als das allgemeinere „zu ihm hin“.
- source_word: τὰ πάντα
  choice: in jeder Hinsicht
  rationale: Im Zusammenhang mit dem Wachstum wird der umfassende Sinn idiomatisch ausgedrückt; die wörtlichere Form bleibt in der Fußnote erhalten.
- source_word: κεφαλή
  choice: Haupt
  rationale: „Haupt“ bewahrt das Körperbild und den würdevollen biblischen Stil, ohne die umstrittene Metapher als „Quelle“ oder „Herrscher“ auszudeuten.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός steht appositionell nach „das Haupt“ und hat hier Titelfunktion; „Messias“ macht diese Funktion transparent.
theological_decisions:
- issue: Bedeutungsumfang von ἀληθεύοντες
  choice: „indem wir in Liebe wahrhaftig sind“
  alternative: „indem wir in Liebe die Wahrheit sagen“ oder „die Wahrheit tun“
  rationale: Die Übersetzung hält offen, ob vor allem wahrhaftiges Reden oder umfassend wahrhaftiges Verhalten gemeint ist. Damit wird die echte lexikalische und theologische Spannung nicht aufgelöst.
- issue: Aussagekraft der Haupt-Metapher
  choice: „Haupt“
  alternative: „Quelle“ oder „Herrscher“
  rationale: Die Metapher wird als solche bewahrt, ohne eine bestimmte konfessionelle Deutung in den Text einzutragen.
- issue: Funktion von Χριστός
  choice: „der Messias“ als Titel
  alternative: „Christus“
  rationale: Die appositionelle Stellung spricht dafür, den Titelcharakter sichtbar zu machen; „Christus“ bleibt als traditionelle Wiedergabe in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wahrhaftig sein“ bewahrt bewusst die semantische Weite des griechischen Verbs; „in ihn hineinwachsen“ erhält das paulinische Wachstums- und Leibbild trotz seiner leicht ungewohnten Ausdrucksweise.
