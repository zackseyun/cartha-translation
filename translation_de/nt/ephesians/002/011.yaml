source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: de
  text: 'Darum denkt daran: Ihr, die ihr einst dem Fleisch nach Nichtjuden wart[a] und von der sogenannten »Beschneidung«, die von Menschenhand am Fleisch vollzogen wird, »Unbeschnittenheit« genannt werdet[b] –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihr, einst die Völker im Fleisch«. Mit »Nichtjuden« sind die Menschen aus den Völkern im Unterschied zu Juden gemeint. »Dem Fleisch nach« bezeichnet hier den leiblich-ethnischen Status, nicht eine moralische Eigenschaft.'
    reason: lexical_alternative
  - marker: b
    text: »Beschneidung« und »Unbeschnittenheit« sind hier nicht nur körperliche Beschreibungen, sondern ethnisch-religiöse Gruppenbezeichnungen. Die wiederholte Formulierung »genannt« bzw. »sogenannt« kann eine kritische Distanz gegenüber einer lediglich äußerlichen Beschneidung erkennen lassen.
    reason: cultural_note
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet den folgernden Übergang vom zuvor Gesagten und klingt im modernen Deutschen natürlich.
- source_word: μνημονεύετε
  choice: denkt daran
  rationale: Gibt den präsentischen Imperativ idiomatisch und verständlich wieder.
- source_word: ποτὲ ὑμεῖς
  choice: ihr, die ihr einst
  rationale: Bewahrt den Zeitkontrast und hebt das ausdrücklich gesetzte ὑμεῖς hervor.
- source_word: τὰ ἔθνη ἐν σαρκί
  choice: der Herkunft nach zu den Völkern gehörtet
  rationale: Im jüdisch-nichtjüdischen Gegensatz bezeichnet τὰ ἔθνη die Nichtjuden. ἐν σαρκί meint hier den leiblich-ethnischen Status, nicht eine sündige Natur; die natürliche deutsche Wendung macht dies deutlich, ohne den Sinn moralisch umzudeuten.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: »Unbeschnittenheit« genannt werdet
  rationale: Bewahrt die passive gesellschaftliche Benennung und den abstrakten, kollektiv gebrauchten Ausdruck.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: von der sogenannten »Beschneidung«
  rationale: Gibt die rhetorische Wiederholung von λεγόμενοι/λεγομένης und Paulus’ Distanz zum bloßen Etikett knapp wieder.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: die am Körper von Menschenhand vollzogen wird
  rationale: Bezieht χειροποιήτου klar auf die Beschneidung und gibt sowohl ihren körperlichen als auch ihren menschlich vollzogenen Charakter in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von σάρξ in ἐν σαρκί
  choice: der Herkunft nach
  alternative: im Fleisch
  rationale: Hier geht es um leiblich-ethnische Zuordnung, nicht um moralische Verderbtheit. Die Übersetzung macht den kontextuellen Sinn verständlich; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- issue: Kraft von λεγομένης bei περιτομή
  choice: sogenannte »Beschneidung«
  alternative: die so bezeichnete »Beschneidung«
  rationale: Die Formulierung erhält die rhetorische Distanz gegenüber äußerer Gruppenbezeichnung, ohne eine pauschal antijüdische Wertung einzutragen.
- issue: Kollektive Funktion von περιτομή und ἀκροβυστία
  choice: abstrakte Gruppenbezeichnungen in Anführungszeichen
  alternative: die Beschnittenen und die Unbeschnittenen
  rationale: Die griechische Ausdrucksform und ihre bundestheologisch-ethnische Spannung bleiben sichtbar, während die Anführungszeichen signalisieren, dass es sich um Etiketten handelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange, in Vers 12 weitergeführte griechische Satz bleibt durch Gedankenstriche als offene Konstruktion erkennbar. Die doppelte Formulierung mit »genannt«/»sogenannt« wahrt die rhetorische Spannung; »von Menschenhand« ist bewusst idiomatischer als »handgemacht«.
