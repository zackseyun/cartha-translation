  naturalness: „Ihr, die ihr einst dem Fleisch nach Nichtjuden wart“ ist trotz der bewusst quellennahe gehaltenen Wortstellung im modernen Standarddeutsch verständlich und bildet die paulinische Gegenüberstellung klarer ab. „Von Menschenhand am Fleisch vollzogen“ ist eine natürliche, eng auf „Beschneidung“ bezogene Formulierung.
  terminology: „Nichtjuden“ gibt τὰ ἔθνη im vorliegenden jüdisch-nichtjüdischen Gegensatz präzise wieder. Die substantivischen Etiketten „Unbeschnittenheit“ und „Beschneidung“ sowie die doppelte Distanzierung durch „genannt“/„sogenannt“ bewahren die rhetorische Spannung, ohne sie konfessionell auszudeuten.
