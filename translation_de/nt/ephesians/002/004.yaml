  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: de
  text: Gott aber, reich an Barmherzigkeit, wegen seiner großen Liebe, mit der er uns geliebt hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den starken Gegensatz zur vorausgehenden Beschreibung; die Nachstellung nach „Gott“ ist im Deutschen natürlich und würdig.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: ist reich an Barmherzigkeit
  rationale: Die idiomatische deutsche Verbindung „reich an“ gibt das griechische Bild der Fülle genau wieder. Das Partizip wird als finites Verb wiedergegeben, weil der griechische Satz erst im Folgevers sein Hauptverb erhält und eine wörtliche Partizipialkonstruktion im Deutschen schwerfällig wäre.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: Wegen seiner großen Liebe
  rationale: διά mit Akkusativ bezeichnet hier den Grund. „Große Liebe“ ist die natürliche Wiedergabe von πολλὴν ἀγάπην.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: mit der er uns geliebt hat
  rationale: Bewahrt den Relativsatz und die betonte Stammwiederholung „Liebe … geliebt“, auch wenn sie im Deutschen bewusst feierlich klingt.
theological_decisions:
- issue: Stammwiederholung „Liebe … geliebt“
  choice: „seiner großen Liebe, mit der er uns geliebt hat“
  alternative: „seiner großen Liebe zu uns“
  rationale: Die Wiederholung von ἀγάπη und ἀγαπάω ist im Griechischen ausdrücklich vorhanden und wird nicht zugunsten stilistischer Glättung beseitigt.
- issue: Verhältnis von Barmherzigkeit und Liebe
  choice: 'Beide Begriffe bleiben eigenständig: „reich an Barmherzigkeit. Wegen seiner großen Liebe …“'
  alternative: Zusammenfassung als „wegen seiner barmherzigen Liebe“
  rationale: Der Ausgangstext unterscheidet Barmherzigkeit und Liebe, verbindet sie aber sachlich. Eine Verschmelzung würde die theologische Ausdrucksfülle verkürzen.
- issue: Satzanschluss an Vers 5
  choice: Vers 4 endet offen mit einem Komma; zugleich wird die Partizipialangabe als deutscher Hauptsatz formuliert.
  alternative: 'Durchgehende Satzkonstruktion: „Gott aber, der reich an Barmherzigkeit ist, hat uns wegen …“'
  rationale: Im Griechischen wird der Gedanke erst in Vers 5 durch das Hauptverb abgeschlossen. Das Schlusskomma wahrt diesen syntaktischen Fortgang, während die Aufteilung nach „Barmherzigkeit“ die Verständlichkeit im modernen Deutsch erhöht, ohne das in Vers 5 folgende Handeln Gottes vorwegzunehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Barmherzigkeit“ und die absichtliche Wiederholung „Liebe … geliebt“ bleiben erhalten. Der Vers ist syntaktisch auf die Fortsetzung in Epheser 2,5 ausgerichtet.
