base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: de
  text: Denn aus Gnade seid ihr durch Glauben[a] gerettet; und das[b] kommt nicht aus euch selbst – es ist Gottes Geschenk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Glauben“ kann hier auch im Sinn von „Vertrauen“ verstanden werden. Das griechische Wort kann in anderen Zusammenhängen zudem „Treue“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: '„Das“ bezieht sich wahrscheinlich auf den gesamten vorhergehenden Gedanken: die Rettung aus Gnade durch Glauben, nicht nur auf den Glauben allein.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: Gnade
  rationale: „Gnade“ ist die natürliche und theologisch etablierte Wiedergabe von χάρις und bezeichnet hier Gottes unverdiente Zuwendung.
- source_word: ἐστε σεσῳσμένοι
  choice: seid ihr gerettet
  rationale: Die umschreibende Perfektform bezeichnet eine vollzogene Rettung mit fortdauerndem Ergebnis. Das deutsche Zustandspassiv „seid ... gerettet“ gibt diesen gegenwärtigen Heilszustand natürlich wieder.
- source_word: διὰ πίστεως
  choice: durch Glauben
  rationale: διά mit Genitiv bezeichnet hier das Mittel. „Glauben“ bewahrt den üblichen paulinischen Ausdruck; „Vertrauen“ wäre sinngemäß ebenfalls möglich.
- source_word: τοῦτο
  choice: das
  rationale: Das sächliche Demonstrativpronomen verweist wahrscheinlich auf den gesamten vorhergehenden Sachverhalt der Rettung aus Gnade durch Glauben, nicht eindeutig nur auf eines der femininen Substantive χάρις oder πίστις.
- source_word: οὐκ ἐξ ὑμῶν
  choice: kommt nicht aus euch selbst
  rationale: Die Formulierung gibt ἐκ als Ursprung oder Quelle wieder und ist zugleich natürliches modernes Deutsch.
- source_word: θεοῦ τὸ δῶρον
  choice: es ist Gottes Geschenk
  rationale: Die im Griechischen elliptische Nominalphrase wird für verständliches Deutsch mit „es ist“ ergänzt; der Genitiv θεοῦ wird als Zugehörigkeit und Ursprung in „Gottes Geschenk“ bewahrt.
theological_decisions:
- issue: Bezug von τοῦτο („das“) auf Gnade, Glauben oder den gesamten Rettungsvorgang
  choice: '„Das“ bezieht sich wahrscheinlich auf den gesamten vorhergehenden Sachverhalt: Rettung aus Gnade durch Glauben.'
  alternative: „Das“ bezieht sich enger entweder auf den Glauben oder auf die Gnade allein.
  rationale: Das sächliche τοῦτο stimmt grammatisch weder mit dem femininen χάρις noch mit dem ebenfalls femininen πίστις überein. Daher liegt ein zusammenfassender Bezug auf den vorausgehenden Gedanken nahe. Die Fußnote wahrt dennoch die knappe Ausdrucksweise und deren mögliche Deutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Kernformulierung „aus Gnade ... durch Glauben“ bleibt erhalten; „Gottes Geschenk“ ist gegenwärtiger als „Gottes Gabe“. Der Gedankenstrich verdeutlicht die erklärende Apposition, ohne eine im Griechischen nicht ausdrücklich vorhandene logische Beziehung hinzuzufügen.
