  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: de
  text: In ihm[a] werdet auch ihr zusammen zu einer Wohnstätte Gottes im Geist[b] aufgebaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dem“, falls sich das Relativpronomen auf den ganzen Bau und nicht unmittelbar auf Christus bezieht.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „im Geist“ im unbestimmten Sinn von „geistlich“ oder: „durch den Geist“. Die Wendung kann den Bereich bezeichnen, in dem Gott wohnt, oder das Wirken des Heiligen Geistes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: in ihm
  rationale: Das Relativpronomen bezieht sich im Zusammenhang am ehesten auf Christus; die mögliche Beziehung auf den ganzen Bau bleibt in Fußnote [a] erhalten.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: καί hat additive Kraft, während das ausdrücklich gesetzte ὑμεῖς die angesprochenen Gläubigen hervorhebt.
- source_word: συνοικοδομεῖσθε
  choice: werdet ... mit aufgebaut
  rationale: Die präsentische Passivform beschreibt einen fortdauernden Bauvorgang; „mit“ gibt die durch σύν ausgedrückte Gemeinsamkeit wieder.
- source_word: εἰς κατοικητήριον
  choice: zu einer Wohnstätte
  rationale: εἰς bezeichnet Ziel oder Ergebnis. „Wohnstätte“ wahrt das konkrete Tempel- und Bau-Bild in würdigem, verständlichem Deutsch.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird knapp und natürlich wiedergegeben und bezeichnet Gott als den, dessen Wohnstätte der Bau ist.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Im paulinischen Zusammenhang ist wahrscheinlich der Heilige Geist gemeint. „Im“ bewahrt die räumliche beziehungsweise sphärische Aussage, ohne eine mögliche instrumentale Nuance auszuschließen.
theological_decisions:
- issue: Bezug von ἐν ᾧ
  choice: 'Bezug auf Christus: „in ihm“'
  alternative: 'Bezug auf den ganzen Bau: „in dem“'
  rationale: Der unmittelbare Zusammenhang stellt Christus als Eckstein und als denjenigen dar, in dem der Bau zusammengefügt wird. Die grammatisch und kontextuell mögliche andere Beziehung wird nicht verschwiegen.
- issue: Bedeutung von ἐν πνεύματι
  choice: 'Bezug auf den Heiligen Geist: „im Geist“'
  alternative: „im Geist“ im unbestimmten Sinn oder instrumental „durch den Geist“
  rationale: Tempel- und Wohnungssprache in Epheser legt den Heiligen Geist als Referenten nahe. Die Präposition „in“ hält zugleich die Spannung zwischen Bereich und Wirksamkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung bewahrt den Nachdruck auf „auch ihr“, und „mit aufgebaut“ hält sowohl den fortdauernden Vorgang als auch das gemeinsame Eingefügtwerden in den Bau fest.
