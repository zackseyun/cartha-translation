  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: de
  text: auch als wir in unseren Verfehlungen tot waren, hat er uns zusammen mit dem Messias[a] lebendig gemacht – aus Gnade seid ihr gerettet –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Christus“. Das griechische Χριστός bezeichnet den Messias und wird traditionell häufig mit „Christus“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκρούς
  choice: als wir … tot waren
  rationale: Die temporale Wiedergabe ist im Deutschen natürlich und wahrt den beschriebenen Zustand, ohne dem Partizip unnötig eine eindeutig konzessive Bedeutung aufzuzwingen.
- source_word: τοῖς παραπτώμασιν
  choice: in unseren Verfehlungen
  rationale: Die Formulierung gibt den Dativ als Bereich bzw. Bezug wieder. „Unseren“ ergibt sich aus dem Objekt „uns“ und dem unmittelbaren Kontext; „Verfehlungen“ ist verständlich und trifft schuldhafte Übertretungen, ohne vorschnell eine rein kausale Deutung festzulegen.
- source_word: συνεζωοποίησεν
  choice: hat er uns zusammen … lebendig gemacht
  rationale: Die Übersetzung bewahrt sowohl das Lebendigmachen als auch das im zusammengesetzten Verb enthaltene Moment des Gemeinsamseins.
- source_word: τῷ Χριστῷ
  choice: mit dem Messias
  rationale: Der Dativ bezeichnet die Gemeinschaft mit dem Messias. „Messias“ macht den Titelgehalt von Χριστός sichtbar; die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
- source_word: χάριτί
  choice: aus Gnade
  rationale: „Aus Gnade“ ist im Deutschen die geläufige und sachlich genaue Wiedergabe für die Grundlage bzw. das Mittel der Rettung.
- source_word: ἐστε σεσῳσμένοι
  choice: seid ihr gerettet worden
  rationale: Das deutsche Zustandspassiv mit Partizip II bewahrt den gegenwärtigen, aus einer vollendeten Rettung hervorgegangenen Zustand und die Passivform.
theological_decisions:
- issue: Wiedergabe von Χριστῷ
  choice: mit dem Messias
  alternative: mit Christus
  rationale: Hier bleibt der Titelgehalt erkennbar. Die traditionelle Form „Christus“ ist ebenfalls möglich und wird als Alternative ausgewiesen.
- issue: Rhetorische Funktion von χάριτί ἐστε σεσῳσμένοι
  choice: als eingeschobene Aussage zwischen Gedankenstrichen beibehalten
  alternative: ohne besondere Abgrenzung in den Satz integrieren
  rationale: Der abrupte Einschub hebt die Gnade hervor und greift der ausführlicheren Aussage in Epheser 2,8–9 voraus; die Gedankenstriche erhalten diese rhetorische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung des vorhergehenden Satzes kleingeschrieben. Die beiden Gedankenstriche bewahren den paulinischen Einschub.
