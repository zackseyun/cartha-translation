  source_fidelity: Die Übersetzung trifft οὐκ ἐξ ἔργων mit „nicht aus Werken“ präzise und lässt „Werke“ zu Recht unbestimmt. „Damit niemand sich rühme“ gibt die negative Zielangabe von ἵνα μή τις sowie den Konjunktiv von καυχήσηται genauer wieder als der Indikativ „sich rühmt“.
  naturalness: „Nicht aus Werken, damit niemand sich rühme“ ist knapp, verständlich und im modernen Standarddeutsch in einem angemessen würdigen Bibelregister natürlich. Der Konjunktiv ist hier nicht archaisierend, sondern markiert den Zweck klar.
  terminology: „Werke“ und „sich rühmen“ sind etablierte, sachgerechte Wiedergaben, ohne die Aussage auf Gesetzeswerke, gute Werke oder menschliche Leistung einzuengen. Die Fußnote sollte „aufgrund von Werken“ nicht als bloße lexikalische Alternative ausgeben, da dies eher Grund/Basis als Herkunft bezeichnet; die mögliche instrumentale Deutung lässt sich transparent als „durch Werke“ nennen.
