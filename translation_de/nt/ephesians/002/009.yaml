  text: not from works[a], so that no one may boast.
translation:
  language: de
  text: nicht aus Werken[a], damit niemand sich rühme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bezeichnet die griechische Wendung Herkunft oder Ursprung: „aus Werken“. Manche verstehen sie instrumental: „durch Werke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ
  choice: nicht aus
  rationale: Die Wendung bewahrt die Verneinung und den Grundsinn von ἐξ als Herkunft oder Ursprung; zugleich klingt sie im Deutschen natürlich.
- source_word: ἔργων
  choice: Werken
  rationale: „Werke“ entspricht der knappen paulinischen Formulierung. Zusätze wie „des Gesetzes“, „gute“ oder „menschliche Leistungen“ stehen nicht im griechischen Text.
- source_word: ἵνα μή τις
  choice: damit niemand
  rationale: Die Formulierung gibt den negativen Zweck beziehungsweise die beabsichtigte Folge idiomatisch und ohne unnötige Geschlechtsmarkierung wieder.
- source_word: καυχήσηται
  choice: sich rühmt
  rationale: Das geläufige biblische und zugleich verständliche deutsche Verb bewahrt den Gedanken des Rühmens deutlicher als das schwächere „stolz sein“.
theological_decisions:
- issue: Bedeutung von „Werken“
  choice: Die allgemeine Bezeichnung „Werke“ bleibt ohne nähere Bestimmung stehen.
  alternative: „Werke des Gesetzes“, „menschliche Leistung“ oder „gute Werke“
  rationale: Der griechische Text enthält nur ἔργων. Eine nähere Bestimmung würde eine mögliche Auslegung in die Übersetzung eintragen.
- issue: Nuance von ἐξ
  choice: „aus“ als Bezeichnung von Herkunft oder Ursprung
  alternative: „durch“ als instrumentale Wiedergabe
  rationale: ἐξ bezeichnet hier seinem gewöhnlichen Grundsinn nach Herkunft oder Ursprung. Eine instrumentale Nuance ist möglich, sollte aber nicht an die Stelle der formnäheren Wiedergabe treten.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die Wortstellung „niemand sich rühmt“ ist natürlich und hält den Nachdruck auf „niemand“.
