id: EPH.2.14
reference: Ephesians 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: de
  text: Denn er selbst ist unser Friede, der die beiden eins gemacht und die trennende Mauer, nämlich die Schranke – die Feindschaft –, in seinem Fleisch niedergerissen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz läuft in Vers 15 weiter. „Die beiden“ meint im Zusammenhang Juden und Nichtjuden. Die Wendung „in seinem Fleisch“ kann auch enger mit der folgenden Aussage verbunden werden.
    reason: Kontextreferenz und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das betonte Pronomen hebt hervor, dass Christus persönlich unser Friede ist.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ bewahrt den begründenden Anschluss an den vorhergehenden Gedanken.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: unser Friede
  rationale: 'Die nominale Aussage bleibt erhalten: Christus schafft nicht nur Frieden, sondern wird selbst als unser Friede bezeichnet.'
- source_word: ὁ ποιήσας τὰ ἀμφότερα ἓν
  choice: Er hat die beiden eins gemacht
  rationale: „Die beiden“ gibt τὰ ἀμφότερα eng wieder; der unmittelbare Kontext bezeichnet damit Juden und Nichtjuden, ohne dies im Vers ausdrücklich einzusetzen.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: die trennende Mauer, die Schranke
  rationale: „Trennende Mauer“ vermittelt das Bild von μεσότοιχον natürlich; „die Schranke“ bildet den erklärenden Genitiv τοῦ φραγμοῦ ab, ohne zwei verschiedene Hindernisse anzunehmen.
- source_word: λύσας
  choice: niedergerissen
  rationale: Bei einer Mauer bezeichnet das Verb anschaulich deren Beseitigung; „niedergerissen“ ist im Deutschen idiomatisch.
- source_word: τὴν ἔχθραν
  choice: die Feindschaft
  rationale: „Feindschaft“ ist eine klare, geläufige Entsprechung und wird appositionell als Erklärung der trennenden Schranke verstanden.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: in seinem Fleisch
  rationale: Die formnahe Wiedergabe bewahrt die leibliche Konkretheit und vermeidet die unzutreffende Deutung „sündige Natur“.
theological_decisions:
- issue: Bezugsgröße von τὰ ἀμφότερα
  choice: „die beiden“ mit kontextuellem Bezug auf Juden und Nichtjuden
  alternative: „beide Gruppen“ oder ausdrückliche Nennung von Juden und Nichtjuden
  rationale: Der Kontext macht den Bezug deutlich; die knappe Form bewahrt zugleich die Ausdrucksweise des griechischen Verses.
- issue: Syntaktische Beziehung von τὴν ἔχθραν
  choice: Apposition zur trennenden Mauer beziehungsweise Schranke
  alternative: Anschluss an den folgenden Vers oder Deutung als eigenständiges weiteres Objekt
  rationale: Die Gedankenstriche kennzeichnen „die Feindschaft“ als Erklärung des zuvor genannten Hindernisses, ohne den fortlaufenden Satzbau dogmatisch zu verengen.
- issue: Bezug von ἐν τῇ σαρκὶ αὐτοῦ
  choice: auf das Niederreißen der Schranke bezogen
  alternative: „die Feindschaft in seinem Fleisch“
  rationale: Die Zeichensetzung verhindert den missverständlichen Eindruck, die Feindschaft habe sich in Christi Fleisch befunden, und lässt die Wendung die vollzogene Handlung näher bestimmen.
- issue: Bedeutung von σάρξ
  choice: „Fleisch“ im Sinn der leiblichen Existenz Christi
  alternative: „Leib“ oder „sündige Natur“
  rationale: „Fleisch“ wahrt hier die griechische Begrifflichkeit und die leibliche Dimension; eine sündhafte Bedeutung ist im Blick auf Christus ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Ein neuer Hauptsatz vermeidet die im Deutschen schwerfällige substantivierte Partizipialkonstruktion. Die Gedankenstriche erhalten die erklärende Apposition und verhindern, dass „Feindschaft“ als etwas in Christi Fleisch Befindliches verstanden wird.
