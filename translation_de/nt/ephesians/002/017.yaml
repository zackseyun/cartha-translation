  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: de
  text: Und er kam und verkündete euch, die ihr fern wart,[a] Frieden und denen, die nahe waren, Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind im Zusammenhang die zuvor Fernen und die Nahen, also die Nichtjuden und die Juden (siehe Eph 2,11–13). Das mit »verkündete« übersetzte Verb kann auch »als gute Botschaft verkünden« bedeuten.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: er kam
  rationale: Das substantivische Partizip wird als beigeordnete Handlung wiedergegeben. So bleibt das Motiv seines Kommens erhalten, ohne im Deutschen eine schwerfällige Partizipialkonstruktion zu erzeugen.
- source_word: εὐηγγελίσατο
  choice: verkündete
  rationale: Das Verb bezeichnet das Überbringen einer guten Botschaft. Da im Satz »Frieden« unmittelbar als Inhalt beziehungsweise Objekt folgt, gibt »verkündete« den Sinn natürlich wieder; die mögliche Nuance »als gute Botschaft verkünden« wird in einer Fußnote genannt.
- source_word: εἰρήνην
  choice: Frieden
  rationale: Die direkte und kontextuell tragfähige Entsprechung bewahrt sowohl den gewöhnlichen Sinn als auch die Anklänge an Versöhnung und umfassendes Heil.
- source_word: ὑμῖν τοῖς μακρὰν
  choice: euch, die ihr fern wart
  rationale: Die Anrede in der zweiten Person und das substantivierte »den Fernen« werden im Deutschen natürlich verbunden. »Wart« macht die im Kontext vorausgesetzte frühere Ferne deutlich, ohne die Gruppenidentität in den Haupttext einzutragen.
- source_word: τοῖς ἐγγύς
  choice: denen, die nahe waren
  rationale: Die Formulierung wahrt den parallelen Gegensatz zwischen den Fernen und den Nahen.
- source_word: καὶ ... καὶ
  choice: und ... und ebenso
  rationale: Die Koordination beider Empfängergruppen bleibt erkennbar. »Ebenso« verdeutlicht im Deutschen, dass derselbe Frieden beiden verkündet wurde, ohne den Aussagegehalt zu verändern.
theological_decisions:
- issue: Identität der Fernen und Nahen
  choice: Die bildhaften Bezeichnungen »fern« und »nahe« bleiben im Haupttext erhalten.
  alternative: Ausdrückliche Wiedergabe als »euch Heiden« und »den Juden«.
  rationale: Der unmittelbare Zusammenhang legt diese Zuordnung nahe (Eph 2,11–13), doch der Vers selbst nennt die Gruppen nicht ausdrücklich. Die metaphorische Sprache wird daher nicht interpretierend aufgelöst.
- issue: Subjekt des Kommens und Verkündens
  choice: Das griechische Pronomen wird mit »er« wiedergegeben, ohne im Vers einen Namen einzufügen.
  alternative: Explizit »Christus« einsetzen.
  rationale: Der Kontext identifiziert das Subjekt als Christus, während der griechische Satz hier nur durch die Verbform beziehungsweise das Partizip auf ihn zurückverweist. Die Übersetzung bewahrt diese Textgestalt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt die direkte Anrede »euch« heraus und hält zugleich den Parallelismus der beiden Gruppen verständlich. Der einzige Fußnotenmarker [a] steht unmittelbar bei der bildhaften Gruppenbezeichnung.
