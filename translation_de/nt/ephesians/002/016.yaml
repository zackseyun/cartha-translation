source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: de
  text: und die beiden in einem Leib durch das Kreuz mit Gott versöhne, indem er am Kreuz die Feindschaft tötete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in ihm«. Das Pronomen kann sich wahrscheinlich auf das Kreuz beziehen (griechisch maskulin); auch ein Bezug auf Christus wird erwogen.'
    reason: Die Anmerkung bewahrt die Mehrdeutigkeit von ἐν αὐτῷ. Sie berücksichtigt zugleich, dass »Kreuz« im Griechischen, anders als im Deutschen, maskulin ist, und vermeidet den grammatisch nicht naheliegenden Bezug auf »Leib«.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: versöhnte
  rationale: Das Verb bezeichnet die Wiederherstellung einer gestörten Beziehung; im deutschen Satzgefüge wird der griechische Konjunktiv als Fortsetzung des Zwecksatzes aus Vers 15 wiedergegeben.
- source_word: τοὺς ἀμφοτέρους
  choice: die beiden
  rationale: Gemeint sind die zuvor genannten Gruppen, Juden und Nichtjuden; die knappe Form bewahrt den Rückbezug.
- source_word: ἐν ἑνὶ σώματι
  choice: in einem Leib
  rationale: Die körperliche Metapher bleibt bewusst erhalten und wird nicht vorschnell als bloße Gemeinschaft erklärt.
- source_word: διὰ τοῦ σταυροῦ
  choice: durch das Kreuz
  rationale: Gibt das Mittel der Versöhnung direkt und idiomatisch wieder.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: indem er ... die Feindschaft tötete
  rationale: Die starke Tötungsmetapher des griechischen Textes wird bewahrt; das Partizip bezeichnet das begleitende beziehungsweise vermittelnde Handeln.
- source_word: ἐν αὐτῷ
  choice: an ihm
  rationale: Das Pronomen wird naheliegend auf das Kreuz bezogen; die Wendung kann räumlich-instrumental verstanden werden und spielt auf Christi Tod am Kreuz an.
theological_decisions:
- issue: Bezug von »einem Leib«
  choice: Die Metapher bleibt ohne erklärenden Zusatz stehen.
  alternative: Ausdrückliche Identifikation mit Christi Leib oder der Gemeinde.
  rationale: Der unmittelbare Zusammenhang lässt beide Bezüge anklingen; eine eindeutige Festlegung würde die genuine Spannung des Textes reduzieren.
- issue: Bezug von ἐν αὐτῷ
  choice: »an ihm« mit Bezug auf das Kreuz
  alternative: »in ihm« mit Bezug auf Christus beziehungsweise den einen Leib oder »durch es« mit Bezug auf das Kreuz
  rationale: Das nächstliegende grammatische Bezugswort ist »Kreuz«. »An ihm« bewahrt die Kreuzigungsvorstellung, während eine Fußnote die Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform schließt syntaktisch an den Zweckzusammenhang des vorherigen Verses an. Die ungewöhnlich starke Wendung »die Feindschaft tötete« ist wegen der bewussten Kreuzes- und Todesmetaphorik beibehalten.
