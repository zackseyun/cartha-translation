    issue: Die fortlaufende passive Bedeutung von συναρμολογουμένη ist in „zusammengefügt“ nicht ausdrücklich erkennbar.
    rationale: Das griechische Präsenspartizip beschreibt das gegenwärtige Zusammenfügen. „wird ... zusammengefügt und wächst“ bringt sowohl diesen Vorgang als auch das gleichzeitige Wachstum im Deutschen klar zum Ausdruck.
  - severity: low
    issue: „der ganze Bau“ wirkt etwas weniger idiomatisch als „das ganze Bauwerk“.
    rationale: „Bauwerk“ bezeichnet die metaphorisch gedachte, zusammengefügte Struktur natürlicher und wahrt den Bezug auf οἰκοδομή.
