  rationale: Die Revision macht den präsentischen passiven Vorgang von συναρμολογουμένη mit „wird ... zusammengefügt“ explizit und verbindet ihn natürlich mit αὔξει („wächst ... heran“). Sie ersetzt das weniger idiomatische „Bau“ durch „Bauwerk“, ohne die Bildsprache oder die Aussage zu verändern. Die Fußnote wird an die Terminologie des Haupttexts angeglichen und erhält die Auslegungsalternative vollständig.
