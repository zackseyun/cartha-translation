  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: de
  text: In ihm wird das ganze Bauwerk[a] zusammengefügt und wächst zu einem heiligen Tempel im Herrn heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jedes Bauwerk“. Der griechische Ausdruck kann sowohl distributiv als auch kollektiv verstanden werden; der Haupttext folgt dem Bild des einen, zusammengefügten Tempels im Zusammenhang.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: In ihm
  rationale: Das Relativpronomen verweist im Zusammenhang am natürlichsten auf Christus, den zuvor genannten Eckstein; die personale Wiedergabe bewahrt zugleich die paulinische Formel des Seins in Christus.
- source_word: πᾶσα οἰκοδομὴ
  choice: der ganze Bau
  rationale: Die artikellose Verbindung kann sowohl kollektiv als auch distributiv verstanden werden. Der Kontext von dem einen, aus Juden und Nichtjuden zusammengefügten Gottesvolk legt hier die kollektive Lesart nahe.
- source_word: συναρμολογουμένη
  choice: zusammengefügt
  rationale: Das passive Partizip bezeichnet das fortlaufende Zusammenfügen einzelner Teile zu einem stimmigen Ganzen und erhält das Bild des Bauwerks.
- source_word: αὔξει
  choice: wächst ... heran
  rationale: Das Präsens bezeichnet einen fortschreitenden Vorgang. „heranwachsen zu“ gibt zusammen mit εἰς sowohl das Wachstum als auch dessen Ziel natürlich wieder.
- source_word: εἰς
  choice: zu
  rationale: 'Die Präposition markiert hier Ziel oder Ergebnis: Der Bau wächst mit dem Ziel heran, ein heiliger Tempel zu sein.'
- source_word: ναὸν ἅγιον
  choice: einem heiligen Tempel
  rationale: ναός bezeichnet das eigentliche Heiligtum. „Tempel“ ist im Deutschen klar und bewahrt im Zusammenhang die kultische Metapher; ἅγιον wird unmittelbar mit „heilig“ wiedergegeben.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die knappe Formulierung wahrt die mögliche Bedeutung von Sphäre beziehungsweise Verbundenheit, ohne sie erklärend einzuengen.
theological_decisions:
- issue: 'Bezug von ᾧ: Christus persönlich oder das Bauwerk beziehungsweise der Eckstein als Bild'
  choice: 'personaler Bezug auf Christus: „In ihm“'
  alternative: 'sachlicher Bezug: „In diesem“ oder „in dem“'
  rationale: Der vorausgehende Ausdruck nennt Christus Jesus selbst als Eckstein, und die wiederholte In-Christus-Sprache des Abschnitts stützt den personalen Bezug.
- issue: Kollektive oder distributive Bedeutung von πᾶσα οἰκοδομή
  choice: 'kollektive Bedeutung: „der ganze Bau“'
  alternative: 'distributive Bedeutung: „jeder Bau“'
  rationale: Die Einheit von Juden und Nichtjuden und das Tempelbild in 2,14–22 sprechen für ein einziges zusammengefügtes Bauwerk. Da die griechische Form auch distributiv gelesen werden kann, bleibt diese Möglichkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bau“ vermeidet die mögliche Verengung von „Gebäude“ auf ein bereits fertiges Objekt und passt zu dem fortlaufenden Zusammenfügen und Wachsen. Die Stellung von „zusammengefügt“ hält den Satz gut lesbar und nahe an der griechischen Bildfolge.
