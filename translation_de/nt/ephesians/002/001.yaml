  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: de
  text: Auch ihr wart tot durch eure Verfehlungen und Sünden,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: Verfehlungen
  rationale: Bezeichnet Übertretungen bzw. falsche Schritte und bleibt im modernen Deutsch von ἁμαρτίαις unterscheidbar.
- source_word: ἁμαρτίαις
  choice: Sünden
  rationale: Die übliche und sachlich genaue Wiedergabe des religiös-ethischen Begriffs.
- source_word: νεκρούς
  choice: tot
  rationale: Bewahrt die starke Todesmetapher des griechischen Textes ohne abschwächende Umschreibung.
- source_word: τοῖς … καὶ ταῖς …
  choice: durch … und …
  rationale: Der Dativ kann hier Ursache oder Sphäre bezeichnen. »Durch« ergibt natürliches Deutsch und gibt die ursächliche Beziehung wieder, ohne die Metapher aufzulösen.
theological_decisions:
- issue: Ellipse und syntaktischer Anschluss des Partizips ὄντας
  choice: »wart tot« als vollständiger deutscher Satzanschluss
  alternative: »als ihr tot wart« / »die ihr tot wart«
  rationale: Im Griechischen hängt der Akkusativ ὑμᾶς mit dem Partizip an dem erst in Vers 5 folgenden Hauptverb. Für den Einzelvers wird die Ellipse entsprechend der konsultierten englischen Fassung idiomatisch ergänzt. Die inhaltliche Aussage bleibt unverändert.
- issue: Bedeutung des Totseins
  choice: Metaphorisch unverändert als »tot« wiedergegeben
  alternative: Deutende Zusätze wie »geistlich tot«
  rationale: Der Ausgangstext nennt keine ausdrückliche Qualifikation. Ein Zusatz würde die theologische Spannung vorschnell festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Auch ihr« bewahrt das vorangestellte καὶ ὑμᾶς und den Anschluss an den weiteren Gedankengang. Das Schlusskomma signalisiert, dass der Satz über die Versgrenze hinweg weitergeht.
