  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: de
  text: dass ihr zu jener Zeit ohne den Messias[a] wart, dem Gemeinwesen Israels entfremdet und den Bündnissen der Verheißung[b] fremd, ohne Hoffnung und ohne Gott in der Welt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Christus“. Der griechische Titel Χριστός kann auf beide Arten wiedergegeben werden; „Messias“ hebt hier den Zusammenhang mit Israel, den Bündnissen und der Verheißung hervor.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Fremde der Bündnisse der Verheißung“. Möglich ist auch: „Verheißungsbündnissen“.'
    reason: lexical_alternative
  - marker: c
    text: „Ohne Gott“ kann hier bedeuten, dass sie ohne Beziehung zum wahren Gott lebten; gemeint ist nicht zwingend die philosophische Leugnung jeder Gottheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: ohne den Messias
  rationale: Χριστός ist hier im jüdisch-bundestheologischen Zusammenhang als Titel gebraucht. „Messias“ gibt die Bedeutung des Titels wieder; „Christus“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: ausgeschlossen vom Gemeinwesen Israels
  rationale: Das Partizip bezeichnet einen fortdauernden Zustand der Entfremdung beziehungsweise des Ausgeschlossenseins. πολιτεία meint hier wahrscheinlich Israels geordnetes Gemeinwesen, nicht nur den individuellen Bürgerstatus.
- source_word: ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας
  choice: Fremde gegenüber den Bündnissen der Verheißung
  rationale: „Fremde gegenüber“ macht verständlich, dass die Angesprochenen außerhalb dieses Bundesbereichs standen. Der Plural „Bündnisse“ und der Singular „Verheißung“ werden bewahrt.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: ohne Hoffnung
  rationale: Die knappe deutsche Präpositionalfügung gibt den beschreibenden Zustand natürlich wieder und bildet einen wirkungsvollen Parallelismus mit „ohne Gott“.
- source_word: ἄθεοι
  choice: ohne Gott
  rationale: Die Wendung vermeidet die moderne philosophische Kategorie „Atheisten“ und bewahrt den kontextuellen Sinn eines Lebens ohne Zugehörigkeit zum wahren Gott.
- source_word: ἐν τῷ κόσμῳ
  choice: in der Welt
  rationale: Die direkte und idiomatische Wiedergabe bezeichnet die Welt als Bereich menschlichen Daseins.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Kontext von Israel, Bündnissen und Verheißung hebt den Titel und seine jüdische Bedeutung hervor. Die alternative traditionelle Wiedergabe wird offengelegt.
- issue: Bedeutung von ἄθεοι
  choice: ohne Gott
  alternative: gottlos
  rationale: „Ohne Gott“ bezeichnet hier am ehesten die fehlende Beziehung und Zugehörigkeit zum wahren Gott, ohne philosophischen Atheismus zu unterstellen.
- issue: Genitivverbindung διαθηκῶν τῆς ἐπαγγελίας
  choice: Bündnisse der Verheißung
  alternative: Bündnisse der Verheißungen / Verheißungsbündnisse
  rationale: Die gewählte Fassung bewahrt sowohl den Plural der Bündnisse als auch den auffälligen Singular „Verheißung“, ohne dessen genaue Beziehung zu den Bündnissen enger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der von Vers 11 abhängige dass-Satz bleibt erhalten. Die parallelen Wendungen „ohne Hoffnung“ und „ohne Gott“ geben den zugespitzten Abschluss natürlich wieder. Alle Fußnotenmarker stehen an den jeweils einschlägigen Textstellen.
