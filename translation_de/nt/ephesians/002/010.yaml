source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: de
  text: Denn wir sind sein Werk, geschaffen in Jesus, dem Messias[a], zu guten Werken, die Gott im Voraus vorbereitet hat, damit wir in ihnen wandeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus Jesus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: alternative_reading
  - marker: b
    text: Das Bild des Wandelns bezeichnet die Lebensführung.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ γάρ ἐσμεν ποίημα
  choice: Denn wir sind sein Werk
  rationale: „Denn“ wahrt den begründenden Anschluss an den vorherigen Zusammenhang. „Sein Werk“ gibt ποίημα als das von Gott Geschaffene natürlich und konkret wieder, ohne den Ausdruck auf handwerkliche Herstellung einzuengen.
- source_word: κτισθέντες
  choice: geschaffen
  rationale: Das passive Partizip bezeichnet die Glaubenden als von Gott Geschaffene. Die knappe deutsche Partizipialkonstruktion erhält den Bezug zu „wir sind sein Werk“.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Messias Jesus
  rationale: Χριστός wird hier in seiner Titelfunktion als „Messias“ wiedergegeben; ἐν bleibt als Ausdruck der Einbindung beziehungsweise Verbundenheit erhalten, ohne diese näher dogmatisch auszudeuten.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: zu guten Werken
  rationale: ἐπί mit Dativ bezeichnet hier die Ausrichtung beziehungsweise Bestimmung der Schöpfung. „Zu guten Werken“ ist im Deutschen idiomatisch und bewahrt den ethischen Akzent von ἔργα.
- source_word: οἷς προητοίμασεν ὁ θεός
  choice: die Gott im Voraus bereitet hat
  rationale: Das Relativpronomen bezieht sich auf die guten Werke. „Im Voraus“ gibt die zeitliche Bedeutung des Präfixes προ- ausdrücklich wieder.
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: damit wir in ihnen leben
  rationale: „Damit“ gibt die Zweckbeziehung von ἵνα wieder. περιπατέω bezeichnet hier metaphorisch die Lebensführung; „in ihnen leben“ ist natürliches modernes Deutsch, während die Fußnote das zugrunde liegende Bild des Gehens sichtbar hält.
theological_decisions:
- issue: Χριστός als Titel oder als eingebürgerte Namensform
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Die Wiedergabe als „Messias“ macht den Titelgehalt von Χριστός sichtbar. Die geläufige Form „Christus Jesus“ wird als Übersetzungsalternative vermerkt.
- issue: Verhältnis von Gottes vorausgehender Vorbereitung und menschlicher Lebensführung
  choice: die Gott im Voraus bereitet hat, damit wir in ihnen leben
  alternative: die Gott im Voraus für uns bereitet hat, damit wir sie tun
  rationale: Die Formulierung hält sowohl Gottes vorausgehendes Handeln als auch die beabsichtigte Lebensführung der Glaubenden fest, ohne weitergehende Lehrfragen über Vorherbestimmung oder menschliches Mitwirken zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sein Werk“ ist bewusst schlicht und konkret; „in ihnen leben“ vermeidet das heute ungebräuchlich wirkende „wandeln“, während die Fußnote die paulinische Wegmetapher bewahrt.
