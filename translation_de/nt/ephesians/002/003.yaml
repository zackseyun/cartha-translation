id: EPH.2.3
reference: Ephesians 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: de
  text: Unter ihnen[a] lebten einst auch wir alle in den Begierden unseres Fleisches[b]. Wir taten, was das Fleisch und die Gedanken wollten,[c] und waren von Natur Kinder des Zorns[d] – wie auch die Übrigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in ihnen« beziehungsweise »in diesen Dingen«. Der griechische Ausdruck kann auf die zuvor genannten Menschen oder auf den Bereich des Ungehorsams zurückweisen.'
    reason: alternative_reading
  - marker: b
    text: »Fleisch« bezeichnet hier nicht nur den Körper. Gemeint sein kann der Mensch in seiner von Sünde bestimmten Ausrichtung; die Übersetzung behält jedoch den Ausdruck von Paulus bei.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »indem wir die Willensregungen des Fleisches und der Gedanken ausführten«.'
    reason: literal_rendering
  - marker: d
    text: 'Oder sinngemäß: »Menschen, die dem Zorn verfallen waren«. »Kinder des Zorns« gibt die griechische Redewendung wörtlich wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: unter ihnen
  rationale: Der Relativausdruck kann sich im Zusammenhang auf die unmittelbar zuvor genannten »Söhne des Ungehorsams« beziehen. »Unter ihnen« gibt diesen persönlichen Bezug natürlich wieder; die ebenfalls mögliche sachliche Rückbeziehung wird in einer Fußnote genannt.
- source_word: ἀνεστράφημέν
  choice: lebten
  rationale: Das Verb bezeichnet hier die Lebensführung. »Lebten« ist gegenwärtiges, natürliches Deutsch und vermeidet das steife »führten unseren Lebenswandel«.
- source_word: ἐπιθυμίαις
  choice: Begierden
  rationale: »Begierden« bezeichnet starke, hier moralisch ungeordnete Wünsche, ohne den Sinn auf Sexualität zu verengen.
- source_word: σάρξ
  choice: Fleisch
  rationale: »Fleisch« bewahrt den paulinischen Begriff und seine anthropologisch-ethische Spannung, statt ihn bereits als »sündige Natur« auszulegen.
- source_word: ποιοῦντες τὰ θελήματα
  choice: Wir taten, was … wollten
  rationale: Die idiomatische deutsche Form gibt das Ausführen der Willensregungen verständlich wieder und unterscheidet θελήματα weiterhin von den zuvor genannten ἐπιθυμίαις.
- source_word: διανοιῶν
  choice: Gedanken
  rationale: Der Plural kann Gedanken, Denkweisen oder innere Überlegungen bezeichnen. »Gedanken« ist knapp und wahrt die offene Bedeutung.
- source_word: τέκνα ὀργῆς
  choice: Kinder des Zorns
  rationale: Die semitisch geprägte Genitivverbindung wird bewusst beibehalten, damit nicht vorentschieden wird, ob vor allem Zustand, Zugehörigkeit oder das Verfallensein an das Gericht gemeint ist.
- source_word: φύσει
  choice: von Natur
  rationale: Die geläufige Wendung bewahrt die theologisch umstrittene Aussage, ohne sie auf biologische Abstammung oder bloße Gewohnheit festzulegen.
- source_word: οἱ λοιποί
  choice: die Übrigen
  rationale: Die Formulierung gibt den Vergleich mit den übrigen Menschen knapp und würdig wieder.
theological_decisions:
- issue: Bedeutung von σάρξ im ethisch geprägten paulinischen Zusammenhang
  choice: Fleisch
  alternative: sündige Natur
  rationale: »Sündige Natur« würde die Anthropologie enger auslegen, als der griechische Ausdruck es verlangt. »Fleisch« lässt die theologische Spannung bestehen.
- issue: Aussage von τέκνα φύσει ὀργῆς
  choice: von Natur Kinder des Zorns
  alternative: von Geburt an dem Zorn verfallen / Gegenstände des Zorns
  rationale: Die Hauptfassung hält sich eng an die griechische Ausdrucksweise und systematisiert die Aussage weder zu einer bestimmten Erbsündenlehre noch zu einer rein forensischen Kategorie.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die lange griechische Satzperiode wird zur besseren Lesbarkeit in zwei Sätze gegliedert. Zentrale paulinische Begriffe und echte Mehrdeutigkeiten bleiben im Haupttext beziehungsweise in knappen Fußnoten erhalten.
