review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt die zentralen Elemente des griechischen Satzes zuverlässig wieder: den personalen Bezug von ἐν οἷς mit »Unter ihnen«, die frühere Lebensführung, die Begierden des Fleisches, das praktische Ausführen der vom Fleisch und den Gedanken bestimmten Anliegen sowie »von Natur Kinder des Zorns«. Die Aufteilung der griechischen Periode in zwei deutsche Sätze verändert weder Aussage noch zeitlich-logischen Zusammenhang. »Wie auch die Übrigen« wahrt den knappen Vergleich ὡς καὶ οἱ λοιποί.'
  naturalness: Modernes, gut verständliches Standarddeutsch. »Wir taten, was das Fleisch und die Gedanken wollten« ist eine idiomatische Wiedergabe von ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν und vermeidet eine im Deutschen schwerfällige wörtliche Konstruktion. Der würdige Registerton ist angemessen.
  terminology: »Fleisch«, »Begierden«, »von Natur« und »Kinder des Zorns« bewahren bewusst die paulinische bzw. idiomatische Ausdrucksweise, ohne umstrittene theologische Folgerungen in den Haupttext einzutragen. Die Fußnoten erläutern die sachlich mögliche Alternative bei ἐν οἷς sowie die idiomatische Natur von »Kinder des Zorns«; die Anker stehen an den jeweils passenden Textstellen.
