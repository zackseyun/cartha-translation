  rationale: Die Revision korrigiert die modale Wiedergabe von ἐν χρηστότητι und macht die demonstrative Bedeutung von ἐνδείξηται im Deutschen eindeutiger. Alle übrigen tragenden Begriffe und die vorhandenen Fußnotenanker bleiben erhalten.
