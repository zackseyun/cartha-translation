id: EPH.2.7
reference: Ephesians 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: de
  text: damit er in den kommenden Zeitaltern den alles überragenden Reichtum seiner Gnade in seiner Güte uns gegenüber im Messias Jesus zeigt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den künftigen Zeitaltern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den unermesslichen Reichtum seiner Gnade“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das Ergebnis des vorher Gesagten ein und bewahrt die finale Kraft der Konstruktion.
- source_word: ἐνδείξηται
  choice: erweist
  rationale: Gibt den öffentlichen, sichtbar machenden Sinn von ἐνδείκνυμι natürlich wieder; das Subjekt ergibt sich aus dem Kontext.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: in den kommenden Zeitaltern
  rationale: Bewahrt sowohl den Plural von αἰῶσιν als auch den Zukunftsbezug von τοῖς ἐπερχομένοις.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: den alles überragenden Reichtum
  rationale: Folgt der im SBLGNT gedruckten ungewöhnlichen Verbindung des substantivierten Partizips mit πλοῦτος und vermittelt die Bedeutung von etwas, das jedes Maß übersteigt.
- source_word: τῆς χάριτος αὐτοῦ
  choice: seiner Gnade
  rationale: Bewahrt den zentralen paulinischen Sinn von χάρις und die Genitivbeziehung.
- source_word: ἐν χρηστότητι
  choice: durch seine Güte
  rationale: 'Versteht ἐν instrumental beziehungsweise modal: Gottes Gnade wird in seinem gütigen Handeln an uns erwiesen. Das ergänzte Possessivpronomen macht den griechisch impliziten Bezug im Deutschen klar.'
- source_word: ἐφ’ ἡμᾶς
  choice: zu uns
  rationale: Gibt die auf uns gerichtete wohltätige Haltung beziehungsweise Handlung idiomatisch wieder.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Bewahrt die präpositionale Wendung und gibt Χριστός als bedeutungsvollen Titel statt als bloßen Namensbestandteil wieder.
theological_decisions:
- issue: Χριστός als Titel oder eingebürgerte Namensform
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός trägt hier in der paulinischen Formel weiterhin titularen und theologischen Gehalt; „Messias“ macht diesen im modernen Deutsch transparent.
- issue: Bezug von ἐν χρηστότητι
  choice: durch seine Güte zu uns
  alternative: in Güte gegen uns
  rationale: Die Formulierung lässt Gottes Güte als Weise beziehungsweise Mittel der Offenbarung seiner Gnade erkennen, ohne die enge syntaktische Verbindung mit ἐφ’ ἡμᾶς aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeitalter“ erhält den Plural und den heilsgeschichtlichen Horizont; „alles überragend“ ist verständlicher als ein abstrakter Superlativ. Der Gedankenstrich gliedert die dichte Präpositionalfolge, ohne ihren Zusammenhang aufzulösen.
