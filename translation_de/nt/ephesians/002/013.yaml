source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: de
  text: Jetzt aber seid ihr im Messias Jesus[a] – ihr, die ihr einst fern wart – durch das Blut des Messias[b] nahe geworden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Christus Jesus«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »im Blut des Messias«.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »seid nahe gebracht worden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Jetzt aber
  rationale: Gibt sowohl den zeitlichen Nachdruck von νυνί als auch den Gegensatz zur früheren Lage durch δέ knapp und natürlich wieder.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Bewahrt das paulinische ἐν für die Zugehörigkeit beziehungsweise Verbundenheit und gibt Χριστός als Titel »Messias« wieder.
- source_word: ὑμεῖς οἵ ποτε ὄντες μακρὰν
  choice: ihr, die ihr einst fern wart
  rationale: Entspricht der Relativkonstruktion und lässt die im Kontext zugleich räumliche, relationale und heilsgeschichtliche Ferne offen.
- source_word: ἐγενήθητε ἐγγὺς
  choice: seid … nahe gekommen
  rationale: Drückt den eingetretenen Wechsel in idiomatischem Deutsch aus, ohne einen im Verb nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: durch das Blut des Messias
  rationale: Versteht ἐν hier instrumental als Angabe des Mittels. »Blut« bleibt als Bild stehen und wird nicht deutend zu »Tod« aufgelöst.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier erkennbar Titelfunktion. »Messias« übersetzt den Titel, während die geläufige traditionelle Wiedergabe »Christus« in der Fußnote erhalten bleibt.
- issue: Bedeutung von ἐν τῷ αἵματι
  choice: 'instrumental: »durch das Blut«'
  alternative: 'lokativ beziehungsweise sphärisch: »im Blut«'
  rationale: Der Zusammenhang legt das Blut als Mittel des Nahekommens nahe. Die alternative, formal nähere Wiedergabe wird vermerkt, ohne eine weiter ausgearbeitete Sühnetheorie in den Vers einzutragen.
- issue: Agens bei ἐγενήθητε ἐγγὺς
  choice: »seid … nahe gekommen« ohne ausdrücklich genanntes Agens
  alternative: »seid … nahe gebracht worden« mit implizitem göttlichem Agens
  rationale: Die gewählte Form bewahrt den Zustandswechsel des griechischen γίνομαι, ohne dessen mögliche Passivbedeutung oder göttliche Verursachung zwingend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche machen den eingeschobenen Relativsatz verständlich, ohne die Satzstruktur wesentlich umzudeuten. »Fern« und »nahe« bleiben als bewusst offene Gegenbegriffe erhalten; »Blut« wird nicht paraphrasiert.
