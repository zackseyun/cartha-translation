  source_fidelity: Die Übersetzung gibt den Kontrast νυνὶ δέ, die Zugehörigkeits-/Sphärenformel ἐν Χριστῷ Ἰησοῦ, den früheren Zustand der Ferne sowie das instrumentale ἐν τῷ αἵματι angemessen wieder. Bei ἐγενήθητε ἐγγύς bezeichnet γίνομαι jedoch primär den eingetretenen Zustand („wurdet/ seid nahe geworden“); „nahe gekommen“ kann im Deutschen eine eigene Bewegung oder Annäherung der Angesprochenen nahelegen.
  naturalness: Der Satz ist gut verständlich und würdevoll. „nahe geworden“ ist in diesem bewusst bildhaften, biblisch geprägten Gegensatzpaar fern/nahe natürlich genug und hält sich enger an die griechische Zustandsveränderung als „nahe gekommen“.
  terminology: „Messias“ ist als Übersetzung von Χριστός konsistent und die Fußnote zu „Christus Jesus“ sinnvoll. „Blut des Messias“ bewahrt die Metapher. Die Fußnote zu ἐν τῷ αἵματι sollte die instrumentale Wiedergabe nicht durch die unnatürliche Umschreibung „mithilfe des Blutes“ erklären; „durch“ ist bereits im Haupttext abgedeckt, während „im Blut“ als formnähere Alternative genügt.
