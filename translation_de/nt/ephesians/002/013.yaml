- from: Jetzt aber seid ihr im Messias Jesus[a] – ihr, die ihr einst fern wart – durch das Blut des Messias[b] nahe gekommen.[c]
  to: Jetzt aber seid ihr im Messias Jesus[a] – ihr, die ihr einst fern wart – durch das Blut des Messias[b] nahe geworden.[c]
  rationale: Die Revision ersetzt „nahe gekommen“ durch „nahe geworden“, um ἐγενήθητε ἐγγύς als Zustandswechsel enger und ohne Bewegungsassoziation wiederzugeben. Die Fußnote zum Blut wird auf die tatsächlich formnähere, semantisch relevante Alternative beschränkt. Der instrumentale Sinn von „durch das Blut“ sowie die Ambiguität hinsichtlich eines ausdrücklich benannten Agens bleiben erhalten.
