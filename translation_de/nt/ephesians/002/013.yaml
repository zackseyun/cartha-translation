  - severity: low
    issue: Fußnote b enthält „mithilfe des Blutes“
    rationale: Diese Umschreibung klingt im Deutschen technisch und fügt gegenüber dem Haupttext keine hilfreiche lexikalische Alternative hinzu. Die formal nähere Alternative „im Blut“ sollte genügen.
