  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: de
  text: und hat uns mit ihm auferweckt und uns mit ihm in der Himmelswelt Platz nehmen lassen – in Jesus, dem Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus Jesus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγειρεν
  choice: hat uns mit ihm auferweckt
  rationale: Das Präfix συν- bezeichnet gemeinsame Teilhabe. „Mit ihm auferweckt“ gibt diese Beziehung im Deutschen klar und natürlich wieder; das Objekt „uns“ ergibt sich aus dem übergreifenden Satz.
- source_word: συνεκάθισεν
  choice: hat uns mit ihm einen Platz gegeben
  rationale: Das Verb bedeutet, jemanden zusammen mit einem anderen sitzen zu lassen beziehungsweise ihm einen gemeinsamen Sitz zu geben. Die Formulierung ist modernes Deutsch und vermeidet die stärkere, im Verb nicht ausdrücklich enthaltene Deutung „mit ihm auf den Thron gesetzt“.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: in der Himmelswelt
  rationale: Die substantivierte Wendung bezeichnet in Epheser den himmlischen Bereich oder die himmlische Sphäre. „Himmelswelt“ ist verständlich und bewahrt diesen räumlich-sphärischen Sinn, ohne konkrete einzelne Orte vorauszusetzen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Jesus, dem Messias
  rationale: Χριστός trägt hier weiterhin den Sinn des Titels „Messias“. Die deutsche Wortstellung macht den Titel natürlich verständlich, während die Fußnote die traditionelle Wiedergabe nennt.
- source_word: καὶ … καὶ
  choice: und … und
  rationale: Die wiederholte Konjunktion verbindet die beiden göttlichen Handlungen kumulativ und wird entsprechend bewahrt.
theological_decisions:
- issue: Gemeinschaft mit Christus in den zusammengesetzten Verben
  choice: Das Präfix συν- wird bei beiden Verben ausdrücklich mit „mit ihm“ wiedergegeben.
  alternative: „hat uns auferweckt und uns einen Platz gegeben“
  rationale: Paulus bezeichnet die Teilhabe der Glaubenden an Christi Auferweckung und Erhöhung. Die ausdrückliche Wiedergabe macht den im Griechischen enthaltenen Beziehungsaspekt sichtbar, ohne zusätzliche Lehrinhalte einzutragen.
- issue: Χριστός als Titel oder namensähnliche Bezeichnung
  choice: Jesus, der Messias
  alternative: Christus Jesus
  rationale: „Messias“ gibt die Bedeutung des griechischen Titels wieder; die umgestellte deutsche Formulierung ist natürlicher als „Messias Jesus“. Die traditionelle Form bleibt als Übersetzungsalternative in der Fußnote erhalten.
- issue: Bedeutung von συνεκάθισεν
  choice: einen Platz gegeben
  alternative: mit ihm auf den Thron gesetzt
  rationale: Der Kontext kann an Teilhabe an Christi Erhöhung denken lassen, doch das Verb selbst sagt nicht ausdrücklich „inthronisieren“. Die Übersetzung lässt diese theologische Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Fortsetzung des Satzes mit „und“ angeschlossen. „Himmelswelt“ ist bewusst als Sammelbezeichnung für die himmlische Sphäre gewählt; „einen Platz gegeben“ ist idiomatischer als das schwerfällige „mitsitzen lassen“.
