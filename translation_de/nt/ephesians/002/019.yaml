    issue: πάροικοι wird unvollständig wiedergegeben.
    rationale: „Menschen ohne Bürgerrecht“ benennt fehlendes Bürgerrecht, lässt aber die für πάροικοι kennzeichnende Ansässigkeit außer Acht. „Ansässige Nichtbürger“ wahrt beide Aspekte.
  - severity: medium
    issue: Die Genitivverbindung „Mitbürger der Heiligen“ ist im modernen Deutsch semantisch missverständlich.
    rationale: Sie kann nahelegen, die Heiligen seien die Bürger, denen die Angesprochenen zugeordnet sind. Der griechische Ausdruck betont gemeinsame Bürgerschaft; „Mitbürger zusammen mit den Heiligen“ macht dies deutlich.
  - severity: low
    issue: „Angehörige des Hauses Gottes“ kann im Deutschen stärker an ein Gebäude als an einen Haushalt denken lassen.
    rationale: οἰκεῖοι bezeichnet Haushaltszugehörige. „Gottes Hausgemeinschaft“ macht die personale Metapher explizit.
