source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: de
  text: Ihr seid also nicht länger Fremde und ansässige Nichtbürger, sondern Mitbürger zusammen mit den Heiligen[a] und Angehörige von Gottes Hausgemeinschaft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Heiligen“ bezeichnet hier Gottes geheiligtes Volk, nicht eine besondere Gruppe später kirchlich heiliggesprochener Menschen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich näher: „Hausgenossen Gottes“; gemeint sind Menschen, die zu Gottes Hausgemeinschaft gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Daraus folgt
  rationale: Die Verbindung der beiden Folgerungspartikeln zieht nachdrücklich den Schluss aus dem vorhergehenden Gedankengang; die Formulierung ist klar und idiomatisch.
- source_word: οὐκέτι
  choice: nicht länger
  rationale: Gibt die zeitliche Verneinung und den eingetretenen Statuswechsel natürlich wieder.
- source_word: ξένοι
  choice: Fremde
  rationale: Bezeichnet Menschen, die nicht zum betreffenden Gemeinwesen gehören, und bildet zugleich einen deutlichen Gegensatz zur Zugehörigkeit zum Haus Gottes.
- source_word: πάροικοι
  choice: Menschen ohne Bürgerrecht
  rationale: Bringt den gesellschaftlich-rechtlichen Sinn von ansässigen Nichtbürgern verständlich zum Ausdruck, ohne den heute missverständlichen Ausdruck „Ausländer“ zu verwenden.
- source_word: συμπολῖται
  choice: Mitbürger
  rationale: Bewahrt prägnant das Bild gemeinsamer Bürgerschaft.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: Die Genitivkonstruktion lässt sich im Deutschen natürlich mit „Mitbürger der Heiligen“ wiedergeben; die traditionelle Bezeichnung bleibt erhalten, ohne ihren Bezug im Haupttext einzuengen.
- source_word: οἰκεῖοι τοῦ θεοῦ
  choice: Angehörige des Hauses Gottes
  rationale: Gibt die Zugehörigkeit zu Gottes Hausgemeinschaft idiomatisch wieder und bewahrt zugleich die Hausmetapher.
theological_decisions:
- issue: Bezug von τῶν ἁγίων („der Heiligen“)
  choice: Die offene Bezeichnung „der Heiligen“ bleibt im Haupttext stehen und meint Gottes geheiligtes Volk, ohne den genauen Umfang festzulegen.
  alternative: Ausdrückliche Eingrenzung auf alle Christen, jüdische Gläubige oder Engel.
  rationale: Der Zusammenhang beschreibt die Eingliederung der zuvor Außenstehenden in Gottes Volk. Eine engere Bestimmung würde eine im Ausdruck verbleibende Deutungsspannung unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Bilder des Bürgerrechts und der Hausgemeinschaft bleiben deutlich erhalten. „Menschen ohne Bürgerrecht“ erklärt πάροικοι im Haupttext verständlich, während die Fußnoten echte sprachliche Alternativen und kulturell nötige Erläuterungen bieten.
