  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Metaphern von Bürgerschaft und Hausgemeinschaft sind zutreffend wiedergegeben. „Menschen ohne Bürgerrecht“ trifft jedoch nur einen Teil von πάροικοι: Der Ausdruck bezeichnet ansässige Personen ohne volle Bürgerzugehörigkeit. Außerdem ist „Mitbürger der Heiligen“ im heutigen Deutsch leicht missverständlich, weil es einen Besitz- oder Zugehörigkeitsgenitiv nahelegen kann, während συμπολῖται τῶν ἁγίων die gemeinsame Bürgerschaft mit den Heiligen ausdrückt.'
  naturalness: Der Satz ist insgesamt klar und würdevoll. „Ansässige Nichtbürger“ ist zwar leicht fachsprachlich, aber im gegebenen sozialrechtlichen Bild präziser und verständlich. „Mitbürger zusammen mit den Heiligen“ ist unmissverständlich und bewahrt die offene Referenz von „den Heiligen“.
  terminology: „Heilige“ sollte als etablierter, im Kontext nicht einengender biblischer Ausdruck stehen bleiben. „Angehörige von Gottes Hausgemeinschaft“ gibt οἰκεῖοι τοῦ θεοῦ idiomatisch wieder und erhält die Haushaltsmetapher besser als die potenziell gebäudebezogene Formulierung „des Hauses Gottes“.
  issues:
