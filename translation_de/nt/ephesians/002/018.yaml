id: EPH.2.18
reference: Ephesians 2:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: de
  text: Denn durch ihn haben wir beide in einem Geist Zugang zum Vater.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weil wir durch ihn beide … Zugang zum Vater haben.“'
    reason: lexical_alternative
  - marker: b
    text: „Zugang“ kann auch mit „Hinführung“ oder „Zutritt“ wiedergegeben werden. „In einem Geist“ kann dem Sinn nach auch „durch einen Geist“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage über Frieden und Versöhnung. „Denn“ ist im Deutschen hier natürlich und bewahrt den erklärenden Zusammenhang; möglich ist auch „weil“.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: διά mit Genitiv bezeichnet hier Vermittlung oder Mittel. „Durch ihn“ bewahrt den Bezug auf Christus als denjenigen, durch den der Zugang eröffnet ist.
- source_word: ἔχομεν
  choice: haben wir
  rationale: Der Präsens Indikativ beschreibt eine gegenwärtige, beiden Seiten gemeinsame Wirklichkeit. „Haben wir“ gibt dies schlicht und idiomatisch wieder.
- source_word: τὴν προσαγωγὴν
  choice: Zugang
  rationale: προσαγωγή kann den Zugang oder die Hinführung in die Gegenwart einer hochgestellten Person bezeichnen. „Zugang“ ist im modernen Deutsch klar, lässt die möglichen höfischen und kultischen Anklänge offen und passt natürlich zu „haben“.
- source_word: οἱ ἀμφότεροι
  choice: wir beide
  rationale: Die Formulierung verweist auf die zuvor genannten Juden und Nichtjuden und bewahrt zugleich die erste Person und ihre gemeinsame Teilhabe.
- source_word: ἐν ἑνὶ πνεύματι
  choice: in einem Geist
  rationale: Die Wiedergabe mit „in“ hält sich an die griechische Präposition und lässt offen, ob vor allem Mittel oder Sphäre gemeint ist. Die Großschreibung von „Geist“ kennzeichnet im trinitarischen Kontext den wahrscheinlichen Bezug auf den Heiligen Geist.
- source_word: πρὸς τὸν πατέρα
  choice: zum Vater
  rationale: πρός mit Akkusativ bezeichnet hier die Ausrichtung oder den Zugang zur persönlichen Gegenwart des Vaters. „Zum Vater“ ist knapp und textnah.
theological_decisions:
- issue: Bezug von „einem Geist“
  choice: der Heilige Geist
  alternative: ein gemeinsamer menschlicher Geist
  rationale: 'Der Zusammenhang ist deutlich trinitarisch geprägt: durch ihn, in einem Geist, zum Vater. Die Großschreibung gibt den wahrscheinlichen Bezug wieder, ohne „Heiliger“ in den Haupttext einzufügen.'
- issue: Bedeutung von προσαγωγή
  choice: gemeinsamer Zugang zum Vater
  alternative: förmliche Einführung in die Gegenwart des Vaters
  rationale: Der Ausdruck kann höfische oder kultische Vorstellungen einer Hinführung enthalten. „Zugang“ vermittelt das fortdauernde gemeinsame Vorrecht, ohne das Bild unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit möglichst enger Wahrung der griechischen Satzstruktur. „Wir beide“ ist verständlicher als eine ausdrückliche Ergänzung „Juden und Nichtjuden“, die nicht im Vers selbst steht. Die Stellung der Fußnoten am Satzende hält den Haupttext gut lesbar.
