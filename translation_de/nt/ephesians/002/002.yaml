source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: de
  text: in denen ihr einst gelebt habt[a], nach dem Zeitalter dieser Welt[b], nach dem Herrscher über die Macht der Luft[c], dem Geist, der jetzt in den Söhnen des Ungehorsams[d] wirkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in denen ihr einst umhergegangen seid“; „gehen“ bezeichnet hier die Lebensführung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „nach dem Lauf dieser Welt“. Das griechische Wort αἰών bezeichnet ein Zeitalter beziehungsweise dessen prägende Ordnung oder Denkweise.'
    reason: lexical_alternative
  - marker: c
    text: „Die Luft“ gehört zur antiken kosmologischen Ausdrucksweise für den Bereich, der mit feindlichen geistlichen Mächten verbunden wurde.
    reason: cultural_note
  - marker: d
    text: '„Söhne des Ungehorsams“ bedeutet Menschen, die vom Ungehorsam geprägt sind; auch: „Kinder des Ungehorsams“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: in denen
  rationale: Das Relativpronomen nimmt die in Vers 1 genannten Übertretungen und Sünden auf und bewahrt den lokalen beziehungsweise übertragenen Sinn.
- source_word: ποτε περιεπατήσατε
  choice: ihr einst gelebt habt
  rationale: ποτε bezeichnet die frühere Lebensweise. περιπατέω bedeutet wörtlich „gehen“ oder „wandeln“, wird hier aber idiomatisch für die Lebensführung gebraucht; „gelebt habt“ ist im heutigen Deutsch klar und natürlich.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: nach dem Zeitalter dieser Welt
  rationale: „Zeitalter“ gibt αἰών wieder und hält dessen zeitlich-kulturelle Bedeutung von κόσμος („Welt“) unterscheidbar. „nach“ drückt die Ausrichtung beziehungsweise Übereinstimmung aus.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: den Herrscher über den Machtbereich der Luft
  rationale: „Herrscher“ ist eine klare gegenwärtige Wiedergabe von ἄρχων. „Machtbereich“ bildet den möglichen Bereichs- oder Herrschaftssinn von ἐξουσία verständlich ab, ohne „Luft“ aus der antiken Vorstellungswelt wegzuerklären.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: dem Geist, der jetzt … wirkt
  rationale: Die Kleinschreibung kennzeichnet hier einen feindlichen Geist, nicht den Heiligen Geist. Die appositionelle Form wahrt die enge Verbindung mit dem zuvor genannten Herrscher, ohne das Verhältnis ontologisch genauer festzulegen.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: in den Söhnen des Ungehorsams
  rationale: Die semitisch geprägte Wendung und das maskuline υἱοί bleiben sichtbar. Eine Fußnote erklärt, dass Menschen gemeint sind, die durch Ungehorsam gekennzeichnet sind.
theological_decisions:
- issue: Verhältnis des wirkenden Geistes zum Herrscher über den Machtbereich der Luft
  choice: „dem Geist“ wird als appositionelle nähere Bezeichnung eng an den Herrscher angeschlossen.
  alternative: Der Geist könnte als eine vom Herrscher unterschiedene, ihm untergeordnete geistliche Macht verstanden werden.
  rationale: Die griechische Genitivkette lässt eine appositionelle Beziehung zu, bestimmt aber die genaue Ontologie nicht eindeutig. Die Übersetzung erhält diese Spannung.
- issue: Bedeutung von „Söhne des Ungehorsams“
  choice: Die bildhafte, grammatisch maskuline Wendung bleibt im Haupttext erhalten.
  alternative: „Kinder des Ungehorsams“ oder „die Ungehorsamen“.
  rationale: Die wörtlichere Form bewahrt die Ausdrucksweise der Quelle; die Fußnote erläutert ihren idiomatischen Sinn, ohne sie im Text zu verflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die parallelen κατά-Wendungen mit zweimaligem „nach“. Bildhafte oder kulturell fremde Formulierungen werden im Haupttext möglichst erhalten und knapp in Fußnoten erläutert.
