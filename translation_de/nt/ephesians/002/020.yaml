  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: de
  text: aufgebaut auf dem Fundament der Apostel und Propheten[a], wobei Jesus, der Messias[b], selbst der Eckstein ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Fundament der Apostel und Propheten“ kann das mit ihrem Zeugnis verbundene, das von ihnen gelegte oder das in ihnen bestehende Fundament bezeichnen; der griechische Genitiv legt die Beziehung nicht genauer fest.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus Jesus“. Das griechische Χριστός bedeutet „Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: aufgebaut
  rationale: Das Partizip bewahrt den passiven Sinn und schließt als Satzfragment natürlich an den vorausgehenden Kontext an.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: auf dem Fundament
  rationale: Die Präposition mit Dativ bezeichnet hier im architektonischen Bild die tragende Grundlage.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: der Apostel und Propheten
  rationale: 'Der deutsche Genitiv erhält die im Griechischen nicht näher bestimmte Beziehung: Gemeint sein kann das mit ihnen verbundene, von ihnen gelegte oder in ihnen bestehende Fundament.'
- source_word: ὄντος ... αὐτοῦ
  choice: wobei ... selbst ... ist
  rationale: Diese natürliche deutsche Wiedergabe des Genitivus absolutus erhält die Hervorhebung durch αὐτοῦ.
- source_word: ἀκρογωνιαίου
  choice: Eckstein
  rationale: Der Ausdruck bezeichnet im Baugleichnis den maßgeblichen Eckstein; „Schlussstein“ wäre hier weniger wahrscheinlich.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Jesus, der Messias
  rationale: Χριστός wird seinem Titelsinn entsprechend als „Messias“ wiedergegeben. Die deutsche Wortstellung mit Apposition klingt natürlicher als „Messias Jesus“.
theological_decisions:
- issue: Bedeutung von „Fundament der Apostel und Propheten“
  choice: Der Genitiv bleibt bewusst offen.
  alternative: „das von den Aposteln und Propheten gelegte Fundament“ oder „das aus den Aposteln und Propheten bestehende Fundament“
  rationale: Der griechische Genitiv legt nicht fest, ob Apostel und Propheten das Fundament bilden, es gelegt haben oder durch ihr Zeugnis damit verbunden sind.
- issue: Wiedergabe von Χριστός
  choice: Jesus, der Messias
  alternative: Christus Jesus
  rationale: Die Übersetzung macht den Titelgehalt von Χριστός sichtbar, ohne die traditionelle Wiedergabe als unzulässig auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als abhängiges Satzfragment formuliert, da das griechische Partizip an den vorausgehenden Satz anschließt. Die Apposition „Jesus, der Messias“ ist idiomatischer als „Messias Jesus“ und bewahrt dennoch den Titelsinn.
