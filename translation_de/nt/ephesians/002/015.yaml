  rationale: Die Revision ersetzt eine im Deutschen sperrige und stärker festlegende Wiedergabe von ἐν δόγμασιν durch „in Verordnungen gefasst“, eine natürliche Formulierung, die dem englischen auditieren Leitentscheid „expressed in decrees“ entspricht. Außerdem wird der bestehende Fußnotenanker c an den von ihm erläuterten Ausdruck gesetzt. Die übrige Übersetzung bleibt unverändert.
