source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: de
  text: indem er das Gesetz der Gebote, in Verordnungen gefasst,[a] außer Kraft setzte, damit er die beiden in sich selbst[c] zu einem neuen Menschen[b] erschaffe und Frieden stifte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Gesetz der Gebote in Verordnungen“; auch möglich: „das Gesetz der in Verordnungen enthaltenen Gebote“.'
    reason: Die Beziehung von ἐν δόγμασιν zu „Gesetz“ und „Geboten“ ist syntaktisch nicht völlig eindeutig.
  - marker: b
    text: '„Ein neuer Mensch“ ist ein korporatives Bild; sinngemäß auch: „eine neue Menschheit“.'
    reason: Die Fußnote erläutert die kollektive Bedeutung des griechischen Singulars, ohne das Bild im Haupttext aufzulösen.
  - marker: c
    text: 'Die Wortfolge lässt auch die Wiedergabe zu: „damit er die beiden zu einem neuen Menschen in sich selbst erschaffe und Frieden stifte“.'
    reason: Die Reichweite und Stellung von „in sich selbst“ kann im Deutschen unterschiedlich wiedergegeben werden.
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν
  choice: das Gesetz der Gebote
  rationale: Die Genitivverbindung bleibt eng am Griechischen und bezeichnet das durch Gebote bestimmte Gesetz.
- source_word: ἐν δόγμασιν
  choice: das in Verordnungen bestand
  rationale: Diese Fassung macht die syntaktisch mehrdeutige Beziehung der Präpositionalphrase zum Gesetz beziehungsweise zu den Geboten verständlich, ohne sie auf Ritualvorschriften zu verengen.
- source_word: καταργήσας
  choice: indem er … außer Kraft setzte
  rationale: „Außer Kraft setzen“ gibt die starke Wirkung von καταργέω wieder, ohne über den näher bestimmten Gegenstand hinaus eine umfassende Aussage über jedes Verständnis des Gesetzes einzutragen.
- source_word: τοὺς δύο
  choice: die beiden
  rationale: Der bestimmte Ausdruck verweist auf die zuvor genannten Gruppen, Juden und Nichtjuden.
- source_word: κτίσῃ
  choice: erschaffe
  rationale: „Erschaffen“ bewahrt den Schöpfungs- beziehungsweise Neuschöpfungsanklang von κτίζω.
- source_word: ἐν αὑτῷ
  choice: in sich selbst
  rationale: Die reflexive Form wird ausdrücklich wiedergegeben; Christus ist der personale Bereich der neuen Einheit.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: zu einem neuen Menschen
  rationale: „Mensch“ entspricht ἄνθρωπος im modernen Deutschen natürlich und bewahrt das singuläre korporative Bild.
- source_word: ποιῶν εἰρήνην
  choice: und Frieden stifte
  rationale: „Frieden stiften“ ist idiomatisches, würdevolles Deutsch und gibt das Hervorbringen von Frieden wieder.
theological_decisions:
- issue: Tragweite von καταργήσας in Bezug auf das Gesetz
  choice: das näher bestimmte „Gesetz der Gebote“ wurde außer Kraft gesetzt
  alternative: vernichtete das Gesetz / machte das gesamte Gesetz unwirksam
  rationale: Der starke griechische Ausdruck wird gewahrt, zugleich bleibt sein Objekt durch die Formulierung des Verses begrenzt; weitergehende systematische Folgerungen werden nicht in den Text eingetragen.
- issue: Korporatives Bild von εἷς καινὸς ἄνθρωπος
  choice: ein neuer Mensch
  alternative: eine neue Menschheit
  rationale: Die gewählte Fassung bewahrt Numerus und Bildsprache des Griechischen. Die korporative Bedeutung ergibt sich daraus, dass „die beiden“ zu diesem einen neuen Menschen erschaffen werden.
- issue: Zuordnung von ἐν αὑτῷ
  choice: die beiden in sich selbst zu einem neuen Menschen erschaffen
  alternative: die beiden zu einem neuen Menschen erschaffen, der in ihm besteht
  rationale: Die Stellung bei κτίσῃ wird beibehalten, ohne die mögliche Beziehung zum Ergebnis sprachlich völlig auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist als syntaktischer Satzteil formuliert, entsprechend dem Partizipialanschluss im griechischen Kontext. „Verordnungen“ ist zugänglicher als „Satzungen“, während „Frieden stiften“ natürlich und gehoben klingt.
