source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: de
  text: Er gebe euch erleuchtete Augen eures Herzens, damit ihr erkennt, was die Hoffnung seiner Berufung ist und was der Reichtum der Herrlichkeit seines Erbes unter den Heiligen[a] ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Heiligen“; „die Heiligen“ kann auch mit „Gottes heiliges Volk“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: „Seines Erbes“ kann sowohl Gottes eigenes Erbe als auch das Erbe bezeichnen, das er gibt. „Reichtum der Herrlichkeit“ kann idiomatischer auch als „herrlicher Reichtum“ wiedergegeben werden.
    reason: theological_ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: πεφωτισμένους
  choice: Er erleuchte
  rationale: Das Perfekt Passiv bezeichnet einen bewirkten Zustand des Erleuchtetseins. Im Zusammenhang des Gebets wird dies im Deutschen natürlich als Bitte wiedergegeben; die passive Wirkung bleibt darin enthalten, ohne das Bild auf bloßes »Verstehen« zu reduzieren.
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: die Augen eures Herzens
  rationale: Die markante Metapher des griechischen Textes bleibt erhalten und wird nicht zu »Verstand« oder »innerer Einsicht« abgeflacht.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: damit ihr erkennt
  rationale: Die finale Infinitivkonstruktion wird idiomatisch als Zwecksatz wiedergegeben. »Erkennen« bezeichnet hier ein wirkliches Erfassen und passt besser als das im Deutschen oft rein faktische »wissen«.
- source_word: ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ
  choice: welche Hoffnung seine Berufung eröffnet
  rationale: »Hoffnung« bewahrt den paulinischen Begriff der zuversichtlichen Erwartung. Die Genitivverbindung wird knapp entfaltet, damit im Deutschen deutlich wird, dass die Berufung auf eine Hoffnung ausgerichtet ist, ohne deren Inhalt näher festzulegen.
- source_word: τίς ὁ πλοῦτος τῆς δόξης
  choice: wie reich an Herrlichkeit
  rationale: Die griechische Häufung der Substantive wird in natürliches Deutsch überführt. Dabei bleiben sowohl die Fülle (πλοῦτος) als auch die Herrlichkeit (δόξα) ausdrücklich erhalten.
- source_word: τῆς κληρονομίας αὐτοῦ
  choice: sein Erbe
  rationale: Die knappe Genitivform bleibt offen dafür, ob das Erbe Gott gehört oder von ihm gewährt wird. Diese theologisch bedeutsame Mehrdeutigkeit wird nicht im Haupttext aufgelöst.
- source_word: ἐν τοῖς ἁγίοις
  choice: unter den Heiligen
  rationale: ἐν kann hier räumlich-korporativ »unter« oder enger »in« bedeuten. »Unter den Heiligen« ist im modernen Deutsch natürlich; die wörtlichere Alternative wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezeichnet »sein Erbe« Gottes eigenes Erbe, nämlich sein Volk, oder das Erbe, das er den Glaubenden gibt?
  choice: sein Erbe
  alternative: das Erbe, das er gibt; sein Erbbesitz
  rationale: Der griechische Genitiv legt die Richtung der Beziehung nicht eindeutig fest. Die Hauptfassung wahrt deshalb die Spannung, statt eine bestimmte heilsgeschichtliche Deutung festzuschreiben.
- issue: Bedeutet ἐν τοῖς ἁγίοις »unter den Heiligen« oder »in den Heiligen«?
  choice: unter den Heiligen
  alternative: in den Heiligen; unter seinem heiligen Volk
  rationale: »Unter« gibt den möglichen gemeinschaftlichen Sinn idiomatisch wieder. Da »in« eine andere, theologisch relevante Nuance zulässt, wird diese Möglichkeit in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild von den »Augen des Herzens« und die paulinischen Leitbegriffe Hoffnung, Berufung, Herrlichkeit, Erbe und Heilige bleiben erhalten. Die dichte griechische Nominalformulierung wird maßvoll geglättet, ohne ihre Mehrdeutigkeiten zu beseitigen.
