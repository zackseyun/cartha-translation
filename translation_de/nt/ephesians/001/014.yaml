source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: de
  text: Er ist die Anzahlung auf unser Erbe, zur Erlösung des Eigentums[a], zum Lob seiner Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, je nach Verständnis von „Eigentum“: „zur Erlösung seines Eigentums“. Das griechische Wort kann das erworbene beziehungsweise zu Gott gehörende Eigentum meinen, aber auch Erwerb oder Inbesitznahme.'
    reason: περιποίησις lässt sowohl die Bedeutung „Besitz/Eigentum“ als auch „Erwerb/Inbesitznahme“ zu; der Bezug des Eigentums wird im Text nicht mit einem Possessivpronomen ausdrücklich genannt.
lexical_decisions:
- source_word: ἀρραβών
  choice: Anzahlung
  rationale: Bezeichnet eine erste Zahlung, die den vollständigen späteren Empfang verbürgt; im Deutschen verständlicher und genauer als das heute ungebräuchliche „Unterpfand“.
- source_word: κληρονομία
  choice: Erbe
  rationale: Gibt den erb- und verheißungsbezogenen Sinn natürlich und knapp wieder.
- source_word: εἰς ἀπολύτρωσιν
  choice: bis zur Erlösung
  rationale: εἰς bezeichnet hier die Ausrichtung auf den noch ausstehenden Zeitpunkt bzw. das Ziel der Erlösung. „Bis zur“ drückt diese eschatologische Vorläufigkeit im Deutschen idiomatisch aus, ohne den Zielsinn auszuschließen.
- source_word: περιποίησις
  choice: Eigentum
  rationale: Im Zusammenhang bezeichnet das Wort wahrscheinlich das von Gott erworbene beziehungsweise ihm gehörende Volk oder Eigentum; die knappe Wiedergabe erhält die im Griechischen vorhandene Offenheit.
- source_word: ἔπαινος τῆς δόξης
  choice: Lob seiner Herrlichkeit
  rationale: Bewahrt die Genitivkonstruktion und den Anschluss an Epheser 1,6.12.
theological_decisions:
- issue: Bezug von ὅς auf den Heiligen Geist aus Vers 13
  choice: „Er“
  alternative: „Dieser“ oder eine Wiederholung von „der Heilige Geist“
  rationale: Das maskuline Relativpronomen bezieht sich grammatisch auf den zuvor genannten Geist; „Er“ bewahrt den Personenbezug, ohne den vorangehenden Vers unnötig zu wiederholen.
- issue: Deutung von τῆς περιποιήσεως
  choice: „des Eigentums“ mit Fußnote
  alternative: „unseres Besitzes“ oder „des erworbenen Volkes“
  rationale: Die Formulierung kann Gottes Eigentum beziehungsweise sein erworbenes Volk meinen, wurde aber auch auf das in Besitz zu nehmende Erbe bezogen. Der Haupttext wahrt die Spannung, die Fußnote nennt die wesentlichen Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert den langen griechischen Satz und macht deutlich, dass die Schlusswendung „zum Lob seiner Herrlichkeit“ den größeren Gedankengang abschließt.
