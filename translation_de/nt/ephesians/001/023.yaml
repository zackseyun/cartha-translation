translation:
  language: de
  text: Sie ist sein Leib, die Fülle dessen, der alles in allem erfüllt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „der alles in allen erfüllt“.'
    reason: lexical_alternative
  - marker: b
    text: Das Partizip kann auch als „der erfüllt wird“ verstanden werden; meist wird es hier jedoch aktivisch als „der erfüllt“ aufgefasst.
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: Sie
  rationale: Das Relativpronomen bezieht sich auf die Gemeinde in Vers 22. Im Deutschen stellt „Sie“ den Bezug natürlich und eindeutig her.
- source_word: τὸ σῶμα αὐτοῦ
  choice: sein Leib
  rationale: „Leib“ bewahrt die etablierte paulinische Metapher und entspricht dem würdigen biblischen Sprachgebrauch.
- source_word: τὸ πλήρωμα
  choice: die Fülle
  rationale: „Fülle“ gibt den theologisch dichten Ausdruck formal wieder, ohne zwischen Erfülltsein, Ergänzung und Vollendung vorschnell zu entscheiden.
- source_word: τοῦ ... πληρουμένου
  choice: dessen, der ... erfüllt
  rationale: Obwohl das Partizip morphologisch im Medium/Passiv steht, ist hier eine aktivische Bedeutung kontextuell am wahrscheinlichsten. Die mögliche passive Deutung wird in einer Fußnote erhalten.
- source_word: τὰ πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend die Gesamtheit; „alles“ ist im Deutschen natürlich und bewahrt die kosmische Weite.
- source_word: ἐν πᾶσιν
  choice: in allen
  rationale: Die formal nahe Wiedergabe bewahrt die Mehrdeutigkeit, ob Personen, Bereiche oder eine umfassende Sphäre gemeint sind.
theological_decisions:
- issue: Bedeutung von πλήρωμα im Verhältnis zwischen Gemeinde und Christus
  choice: Die Gemeinde wird als Christi Leib und als „die Fülle“ bezeichnet, ohne das genaue Verhältnis weiter aufzulösen.
  alternative: Die Gemeinde als das von Christus Erfüllte oder als seine Ergänzung beziehungsweise Vollendung.
  rationale: Der griechische Ausdruck lässt mehrere eng verwandte Deutungen zu. „Fülle“ erhält diese theologische Spannung.
- issue: Diathese und Bedeutung von πληρουμένου
  choice: 'Aktivisch: „der ... erfüllt“'
  alternative: 'Passivisch: „der ... erfüllt wird“'
  rationale: Der Zusammenhang legt die aktivische Bedeutung nahe, doch die Form erlaubt eine umstrittene passive Auffassung, die deshalb in der Fußnote genannt wird.
- issue: Bedeutung von ἐν πᾶσιν
  choice: „in allen“
  alternative: „in jeder Hinsicht“ oder „in allem“
  rationale: Die wörtlichere Formulierung wahrt die syntaktische und inhaltliche Offenheit des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leib“ und „Fülle“ bewahren die paulinische Bildsprache und theologische Dichte; „in allen“ erhält bewusst die Mehrdeutigkeit des griechischen Wortlauts.
