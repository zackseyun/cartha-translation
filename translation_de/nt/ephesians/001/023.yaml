  naturalness: „alles in allen erfüllt“ ist im modernen Standarddeutsch syntaktisch und semantisch deutlich schwerfälliger; es legt zudem stärker nahe, dass einzelne Personen gemeint sind. „alles in allem erfüllt“ ist idiomatischer und wahrt die dichte, nicht näher erklärte Aussage des Griechischen.
