  source_fidelity: 'Die Wiedergabe von ἀνακεφαλαιώσασθαι, τὰ πάντα, den kosmischen Lokalangaben und der abschließenden Wiederholung „in ihm“ ist quellentreu. „bei der Fülle“ verfehlt jedoch die genitivische Verbindung τοῦ πληρώματος mit οἰκονομίαν: Gemeint ist die Verwaltung/Ordnung der Fülle der Zeiten, nicht eine bloße zeitliche Begleitumstandsangabe.'
  naturalness: Der fragmentarische Charakter als Anschluss an den vorhergehenden Satz ist angemessen. „Ordnung bei der Fülle der Zeiten“ klingt im Deutschen jedoch sowohl ungewohnt als auch semantisch verschoben. „Verwaltung der Fülle der Zeiten“ gibt die Konstruktion transparent wieder; die markierte Schlussstellung „in ihm“ bleibt aufgrund des griechischen Textes erhalten.
  terminology: „Messias“ ist als titelhafte Wiedergabe von Χριστός passend. „Zusammenfassen“ wahrt die lexikalische Zurückhaltung bei ἀνακεφαλαιώσασθαι; die Fußnote erhält sachgerecht die mögliche Haupt-/Einheitsnuance. „Himmel“ im Plural und „Erde“ sind korrekt wiedergegeben.
