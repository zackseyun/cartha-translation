id: EPH.1.10
reference: Ephesians 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: de
  text: für die Verwaltung der Fülle der Zeiten, alles im Messias zusammenzufassen[a] – das in den Himmeln und das auf der Erde –, in ihm,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles im Messias unter einem Haupt zusammenzuführen“. Das griechische Verb kann sowohl „zusammenfassen“ als auch „unter einem Haupt vereinen“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: Ordnung
  rationale: Das Wort bezeichnet eine geordnete Verwaltung, Durchführung oder Anordnung. „Ordnung“ bewahrt hier den Gedanken eines planvollen göttlichen Handelns, ohne den Text ausdrücklich zu „Plan“ umzudeuten.
- source_word: πληρώματος τῶν καιρῶν
  choice: Fülle der Zeiten
  rationale: Die Formulierung erhält sowohl die Vorstellung des vollen Maßes als auch den Bezug auf bestimmte, von Gott gesetzte Zeiten; „Erfüllung“ wäre möglich, würde den Ausdruck aber stärker auf einen Endpunkt festlegen.
- source_word: ἀνακεφαλαιώσασθαι
  choice: zusammenzufassen
  rationale: Das Verb kann „zusammenfassen“ bedeuten und zugleich den Gedanken anklingen lassen, etwas unter einem Haupt zusammenzuführen. Die Hauptfassung bleibt lexikalisch zurückhaltend; die alternative Nuance steht in der Fußnote.
- source_word: τὰ πάντα
  choice: alles
  rationale: Das substantivierte Neutrum ist umfassend gemeint. „Alles“ ist im Deutschen natürlicher als „alle Dinge“ und behält den kosmischen Umfang.
- source_word: ἐν τῷ Χριστῷ
  choice: im Messias
  rationale: Χριστός ist hier als Titel gebraucht. „Messias“ macht diesen Titelgehalt im modernen Deutschen deutlich.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: das in den Himmeln
  rationale: Die Wiedergabe wahrt den griechischen Plural und bezeichnet umfassend alles im himmlischen Bereich.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: das auf der Erde
  rationale: Die Formulierung gibt den räumlichen Gegensatz zu den Himmeln knapp und transparent wieder.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Wiederholung wird trotz ihrer ungewöhnlichen Stellung bewahrt; das Pronomen verweist am natürlichsten auf den Messias.
theological_decisions:
- issue: Wiedergabe von Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck hat hier erkennbar Titelfunktion. „Messias“ bewahrt diese Bedeutung, ohne ihn lediglich wie einen Eigennamen erscheinen zu lassen.
- issue: Bedeutungsumfang von ἀνακεφαλαιώσασθαι
  choice: alles zusammenzufassen
  alternative: alles unter einem Haupt zusammenzuführen
  rationale: Das griechische Verb lässt sowohl eine summierende als auch eine auf ein Haupt bezogene Lesart zu. Die Hauptfassung vermeidet eine vorschnelle theologische Festlegung; die zweite Nuance wird in der Fußnote erhalten.
- issue: Bezug und Nachdruck von ἐν αὐτῷ
  choice: die abschließende Wiederholung „in ihm“ beibehalten
  alternative: die Wendung in den vorherigen Satzteil einarbeiten oder aus stilistischen Gründen nicht wiederholen
  rationale: Die griechische Wiederholung setzt einen eigenen Nachdruck auf den Messias. Ihre Beibehaltung wahrt die rhetorische und theologische Spannung, auch wenn sie im Deutschen markiert klingt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt als syntaktischer Anschluss an den vorhergehenden Vers bewusst fragmentarisch. Doppelpunkt und Gedankenstriche gliedern die dichte griechische Formulierung; „in ihm“ bleibt zur Wahrung des Nachdrucks in seiner markierten Schlussstellung.
