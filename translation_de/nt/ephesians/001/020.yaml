  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: de
  text: die er im Messias[a] wirksam werden ließ, als er ihn von den Toten auferweckte und ihn in den himmlischen Bereichen[b] zu seiner Rechten setzte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in den himmlischen Orten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: die
  rationale: Das feminine Relativpronomen greift die im vorangehenden Zusammenhang genannte Kraft zurück und wahrt den syntaktischen Anschluss.
- source_word: ἐνήργηκεν
  choice: wirksam werden ließ
  rationale: Die Form bezeichnet Gottes effektives Wirken. Die deutsche Wendung ist natürlich und macht deutlich, dass sich die zuvor genannte Kraft tatsächlich auswirkte.
- source_word: ἐν τῷ Χριστῷ
  choice: im Messias
  rationale: Χριστός hat hier titelhaften Charakter; „Messias“ bewahrt diesen Sinn, während „im“ die griechische Präposition wiedergibt.
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: als er ihn von den Toten auferweckte
  rationale: Das Aoristpartizip kann zeitlich beziehungsweise als begleitender Vollzug des göttlichen Wirkens verstanden werden. „Als“ gibt den Zusammenhang natürlich wieder, ohne eine strengere logische Beziehung festzulegen.
- source_word: καὶ καθίσας
  choice: und ihn … setzte
  rationale: Das zweite Aoristpartizip ist mit dem ersten koordiniert. Die finite deutsche Konstruktion erhält die Abfolge und ist idiomatisch.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: zu seiner Rechten
  rationale: Dies ist die geläufige deutsche Wiedergabe für den Ehren- und Autoritätsplatz an Gottes rechter Seite.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: in den himmlischen Bereichen
  rationale: Das substantivierte Adjektiv bezeichnet die himmlische Sphäre. „Bereiche“ ist in modernem Deutsch verständlich und vermeidet das unnatürliche „in den Himmlischen“.
theological_decisions:
- issue: Titelbedeutung von Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Im Kontext der Auferweckung und Erhöhung ist die titelartige Bedeutung gut erkennbar. Die traditionelle Wiedergabe „Christus“ bleibt als mögliche Übersetzung in der Fußnote erhalten.
- issue: Bedeutung von ἐν τοῖς ἐπουρανίοις
  choice: in den himmlischen Bereichen
  alternative: an den himmlischen Orten
  rationale: Die gewählte Fassung bezeichnet verständlich die himmlische Sphäre; die Alternative bewahrt die stärker örtliche und traditionellere Ausdrucksweise.
- issue: Verhältnis der Partizipien zum Hauptverb
  choice: zeitlicher Anschluss mit „als“
  alternative: instrumentaler Anschluss mit „indem“
  rationale: Das Partizip ἐγείρας lässt sowohl einen zeitlichen als auch einen mittelbezogenen Zusammenhang zu. „Als“ liest sich natürlich und legt die Aussage nicht ausschließlich auf das Mittel fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Relativsatzfragment an Vers 19 angeschlossen. „Wirksam werden ließ“ vermeidet das im Deutschen missverständliche oder schwerfällige „die er wirkte“, während „zu seiner Rechten“ die etablierte biblische Wendung bewahrt.
