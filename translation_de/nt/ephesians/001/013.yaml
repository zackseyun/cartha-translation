  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: de
  text: In ihm wurdet auch ihr, nachdem ihr das Wort der Wahrheit – die gute Nachricht von eurer Rettung[a] – gehört und an ihn geglaubt hattet[b], mit dem verheißenen Heiligen Geist[c] versiegelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Evangelium von eurer Rettung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht erneut: „in ihm“. Die Wendung wird hier idiomatisch mit „an ihn geglaubt“ wiedergegeben.'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Wörtlicher: „mit dem Heiligen Geist der Verheißung“; gemeint sein kann der von Gott verheißene oder der mit seiner Verheißung verbundene Geist.'
    reason: genitive_ambiguity
lexical_decisions:
- source_word: ἐν ᾧ
  choice: in ihm
  rationale: Das Relativpronomen verweist im Zusammenhang auf Christus. „In ihm“ bewahrt sowohl den Rückbezug als auch die für den Abschnitt wichtige Vorstellung der Verbundenheit mit Christus.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Die additive Hervorhebung schließt die angesprochenen Gläubigen in das zuvor über „wir“ Gesagte ein.
- source_word: ἀκούσαντες
  choice: nachdem ihr … gehört hattet
  rationale: Das vorangestellte Aoristpartizip wird als der Versiegelung vorausgehende Handlung wiedergegeben, ohne daraus eine weitergehende dogmatische Reihenfolge abzuleiten.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: das Wort der Wahrheit
  rationale: Die Formulierung bleibt nahe am griechischen Ausdruck und ist im Deutschen verständlich; zugleich bewahrt sie den paulinischen Anklang von λόγος als verkündigtem Wort beziehungsweise Botschaft.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: die gute Nachricht von eurer Rettung
  rationale: „Gute Nachricht“ gibt εὐαγγέλιον allgemeinverständlich wieder; die Genitivverbindung lässt den Bezug der Botschaft zur Rettung bewusst offen.
- source_word: πιστεύσαντες
  choice: nachdem ihr … zum Glauben gekommen wart
  rationale: Die Wendung gibt das Partizip natürlich wieder und bewahrt seine wahrscheinlich vorzeitige Beziehung zur Versiegelung, ohne einen besonderen Akt oder eine konfessionelle Bekehrungslehre einzutragen.
- source_word: ἐσφραγίσθητε
  choice: wurdet … versiegelt
  rationale: Das Passiv und das Bild des Siegels bleiben erhalten; es kann Kennzeichnung, Bestätigung und Zugehörigkeit ausdrücken.
- source_word: τῷ πνεύματι
  choice: mit dem … Heiligen Geist
  rationale: „Mit“ passt zum Bild des Versiegelns und lässt die genaue Funktion des Dativs zwischen Mittel und begleitender Gabe hinreichend offen.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: mit dem verheißenen Heiligen Geist
  rationale: Die natürliche deutsche Formulierung versteht den Genitiv als Hinweis auf den von Gott verheißenen Geist; die formal nähere Fassung wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Verhältnis von Hören, Glauben und Versiegelung
  choice: Die beiden Partizipien werden mit „nachdem“ als der Versiegelung vorausgehend dargestellt.
  alternative: „Als ihr hörtet … und glaubtet“ könnte die Vorgänge zeitlich enger zusammenrücken.
  rationale: Die Aoristpartizipien vor dem finiten Verb legen eine vorausgehende Handlung nahe. Die Übersetzung behauptet jedoch keinen über den Satz hinausgehenden zeitlichen Abstand und legt keine konfessionelle Lehre über den Empfang des Geistes fest.
- issue: Zweites ἐν ᾧ beim Glauben
  choice: „nachdem ihr in ihm zum Glauben gekommen wart“ bewahrt den zweiten Christusbezug als eigene Wendung.
  alternative: „nachdem ihr an ihn geglaubt hattet“ ist idiomatischer, deutet ἐν ᾧ aber unmittelbarer als Objekt des Glaubens.
  rationale: Die gewählte Fassung hält die im Griechischen wiederholte Wendung ἐν ᾧ und damit die Verbundenheit mit Christus sichtbar, ohne auszuschließen, dass zugleich der Glaube an Christus gemeint ist.
- issue: Bedeutung von „Geist der Verheißung“
  choice: „der verheißene Heilige Geist“
  alternative: „der Heilige Geist der Verheißung“
  rationale: Der griechische Genitiv ist gedrängt und kann den Geist als den verheißenen Geist oder als den mit der Verheißung verbundenen Geist kennzeichnen. Die Hauptfassung ist natürliches Deutsch; die formal nähere Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt wegen der beiden Partizipialgruppen und des wiederholten ἐν ᾧ bewusst etwas feierlich, wird aber durch Gedankenstriche um die Apposition gegliedert. „Rettung“ ist allgemeinverständlich; „Versiegelung“ bewahrt das zentrale Bild des Ausgangstextes.
