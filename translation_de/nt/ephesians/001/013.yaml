  to: In ihm wurdet auch ihr, nachdem ihr das Wort der Wahrheit – die gute Nachricht von eurer Rettung[a] – gehört und an ihn geglaubt hattet[b], mit dem verheißenen Heiligen Geist[c] versiegelt.
