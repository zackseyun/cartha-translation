  terminology: „Wort der Wahrheit“, „gute Nachricht“, „Rettung“, „versiegelt“ und „verheißener Heiliger Geist“ sind sachgerecht und modernes Standarddeutsch. Die Fußnote zum Genitiv bei „Geist der Verheißung“ wahrt angemessen die Auslegungsbreite.
