id: EPH.1.3
reference: Ephesians 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: de
  text: Gepriesen sei der Gott und Vater unseres Herrn Jesus, des Messias,[c] der uns mit jedem geistlichen Segen[a] in den himmlischen Bereichen[b] im Messias gesegnet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit jedem Segen des Geistes“. Das griechische Adjektiv kann allgemein „geistlich“ oder spezifischer „den Geist betreffend“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an den himmlischen Orten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „Jesus Christus“ und am Versende „in Christus“. Der griechische Titel Χριστός wird hier mit „Messias“ übersetzt, um seine Bedeutung sichtbar zu machen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Gepriesen sei
  rationale: Die prädikative Adjektivform eröffnet einen Lobpreis. „Gepriesen sei“ gibt diese doxologische Funktion in natürlichem, würdevollem Deutsch wieder; „Gesegnet sei“ wäre hier missverständlich.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: der Gott und Vater
  rationale: Der gemeinsame Artikel bezieht sich auf die koordinierten Substantive. Beide Bezeichnungen werden bewahrt.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ entspricht der neutestamentlichen Titelfunktion von κύριος und ist im Deutschen etabliert.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός wird als bedeutungstragender Titel „Messias“ wiedergegeben. Die Apposition mit „des“ macht den Titel innerhalb der deutschen Genitivkonstruktion verständlich.
- source_word: ὁ εὐλογήσας
  choice: der … gesegnet hat
  rationale: Das substantivierte Aoristpartizip bezieht sich auf Gott. Das deutsche Perfekt bezeichnet die vollzogene, weiterhin bedeutsame Handlung natürlich.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: mit jeder geistlichen Segnung
  rationale: Nach „segnen“ bezeichnet „mit“ idiomatisch den verliehenen Inhalt. „Jeder“ wahrt die umfassende Aussage von πάσῃ, während „geistlich“ die Bedeutungsbreite von πνευματικῇ erhält.
- source_word: πνευματικῇ
  choice: geistlichen
  rationale: Das Adjektiv kann allgemein „geistlich“ oder spezifischer „vom Geist stammend/den Geist betreffend“ bedeuten. Die Hauptübersetzung hält diese Offenheit fest.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: in den himmlischen Bereichen
  rationale: Die substantivierte neutrale Pluralform bezeichnet die himmlische Sphäre. „Bereiche“ ist modernes Deutsch und legt sich weniger konkret-räumlich fest als „Orte“.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Die knappe paulinische ἐν-Formulierung wird bewahrt, ohne sie erklärend aufzulösen; Χριστός erscheint als Titel „Messias“.
theological_decisions:
- issue: Wiedergabe von Χριστός in den paulinischen Formulierungen
  choice: Messias in „Jesus, des Messias“ und „im Messias“
  alternative: Christus in „Jesus Christus“ und „in Christus“
  rationale: Χριστός trägt die Bedeutung eines Titels. „Messias“ macht diese Bedeutung sichtbar; die traditionelle Wiedergabe wird in einer Fußnote genannt.
- issue: Bedeutung von πνευματικῇ
  choice: geistlich
  alternative: vom Geist / des Geistes
  rationale: Der griechische Ausdruck lässt sowohl eine breitere geistliche Charakterisierung als auch einen unmittelbaren Bezug auf den Geist zu. Der Haupttext verengt die Aussage nicht; die spezifischere Möglichkeit steht in der Fußnote.
- issue: Bedeutung der Wendung ἐν Χριστῷ
  choice: im Messias
  alternative: durch den Messias / in der Gemeinschaft mit dem Messias
  rationale: Die kompakte lokale beziehungsweise relationale Metapher wird nicht in eine bestimmte theologische Erklärung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem für einen Lobpreis natürlichen Auftakt „Gepriesen sei“. Die Wiederholung von „Segnung“ und „gesegnet“ bewahrt das griechische Wortspiel zwischen εὐλογία und εὐλογέω. Die ungewöhnlich kompakte Formulierung „im Messias“ erhält bewusst die paulinische Ausdrucksweise.
