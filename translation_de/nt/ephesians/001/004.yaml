  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: de
  text: Wie er uns in ihm schon vor Grundlegung der Welt erwählt hat, damit wir heilig und ohne Makel vor ihm seien, in Liebe.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„In Liebe“ kann auch zum folgenden Vers gehören: „In Liebe hat er uns vorherbestimmt …“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „untadelig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: So
  rationale: Knüpft natürlich an den vorausgehenden Lobpreis an und bewahrt den begründenden beziehungsweise erläuternden Zusammenhang.
- source_word: ἐξελέξατο
  choice: hat er uns … erwählt
  rationale: „Erwählt“ gibt die bewusste göttliche Auswahl präzise und im deutschen biblischen Register natürlich wieder, ohne eine bestimmte spätere Lehrsystematik festzulegen.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Bewahrt die knappe paulinische Formulierung und ihre mögliche räumliche, relationale und repräsentative Bedeutungsfülle.
- source_word: πρὸ καταβολῆς κόσμου
  choice: schon vor Grundlegung der Welt
  rationale: „Grundlegung“ entspricht καταβολή eng; „schon“ macht den zeitlichen Vorbezug im modernen Deutsch flüssig deutlich.
- source_word: εἶναι ἡμᾶς
  choice: damit wir … seien
  rationale: Gibt den Zweck- beziehungsweise Ergebnissinn des Infinitivsatzes klar und idiomatisch wieder.
- source_word: ἁγίους
  choice: heilig
  rationale: Bewahrt sowohl die Bedeutung der Zugehörigkeit zu Gott als auch die ethische Dimension.
- source_word: ἀμώμους
  choice: ohne Makel
  rationale: Erhält neben moralischer Untadeligkeit auch den im Wort möglichen kultisch-opferbezogenen Anklang.
- source_word: κατενώπιον αὐτοῦ
  choice: vor ihm
  rationale: Ist knapp, idiomatisch und bewahrt den Gedanken der Gegenwart und Beurteilung Gottes.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Steht entsprechend der griechischen Wortfolge am Versende; der Gedankenstrich markiert die mögliche Zuordnung, ohne sie endgültig festzulegen.
theological_decisions:
- issue: Mögliche dogmatische Überdeutung von ἐξελέξατο
  choice: erwählt
  alternative: ausgewählt
  rationale: „Erwählt“ ist lexikalisch sachgerecht und im Deutschen geläufig. Die Übersetzung ergänzt weder Gegenstand noch Modalität der Erwählung und entscheidet daher keine spätere konfessionelle Streitfrage.
- issue: Syntaktischer Bezug von ἐν ἀγάπῃ
  choice: am Ende von Vers 4 belassen und durch Gedankenstrich sowie Fußnote offenhalten
  alternative: 'mit Vers 5 verbinden: „In Liebe hat er uns vorherbestimmt …“'
  rationale: Die griechische Formulierung kann zum vorausgehenden Heilig-und-makellos-Sein oder zum folgenden Gedanken der Vorherbestimmung gehören. Diese echte Mehrdeutigkeit wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt eng am griechischen Aufbau, wird aber durch „damit wir … seien“ idiomatisch gegliedert. Der Gedankenstrich vor „in Liebe“ signalisiert die syntaktische Schwebe; die Fußnote nennt ausdrücklich die alternative Verbindung mit Vers 5.
