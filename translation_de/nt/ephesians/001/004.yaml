  source_fidelity: 'Die Wiedergabe von ἐξελέξατο, ἐν αὐτῷ, πρὸ καταβολῆς κόσμου, dem finalen Infinitivsatz sowie ἀμώμους ist im Wesentlichen treffend. Allerdings gibt „So hat“ καθὼς nicht angemessen wieder: καθὼς ist hier eine an den vorangehenden Satz anschließende Vergleichs-/Entsprechungspartikel („wie/so wie“), nicht schlicht eine Folgerung („so“).'
