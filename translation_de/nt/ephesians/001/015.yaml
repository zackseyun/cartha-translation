  source_fidelity: Der Haupttext gibt Διὰ τοῦτο, κἀγώ, das vorausgesetzte Hören, den Glauben an den Herrn Jesus sowie die Liebe zu allen Heiligen sachgerecht wieder. Die finite deutsche Form „habe … gehört“ ist als idiomatische Auflösung des griechischen Aoristpartizips vertretbar, zumal der Satz in V. 16 fortgeführt wird. Allerdings ist die im SBLGNT durch Klammern markierte textkritisch unsichere Wortgruppe ἀγάπην τὴν bisher nicht kenntlich gemacht.
  naturalness: „Darum habe auch ich von eurem Glauben an den Herrn Jesus und von eurer Liebe zu allen Heiligen gehört“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung von „von“ ist nicht erforderlich; ohne sie ist der Satz etwas flüssiger.
  terminology: „Glauben“, „Herr“ und „Heiligen“ sind angemessene, etablierte Wiedergaben von πίστις, κύριος und ἅγιοι. „Liebe zu allen Heiligen“ gibt die auf Personen gerichtete Bedeutung von εἰς natürlich wieder. Die Fußnote zu πίστις soll unmittelbar beim Wort „Glauben“ verankert werden.
