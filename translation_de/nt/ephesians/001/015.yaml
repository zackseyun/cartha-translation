  - severity: low
    issue: Der vorhandene Fußnotenanker steht am Satzende, obwohl die Fußnote primär „Glauben“ erläutert.
    rationale: Ein Anker direkt nach „Glauben“ macht den Bezug eindeutig und verbessert die Fußnotenführung.
