id: EPH.1.15
reference: Ephesians 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: de
  text: Darum habe auch ich von eurem Glauben[a] an den Herrn Jesus und eurer Liebe zu allen Heiligen[b] gehört
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eurem Vertrauen auf den Herrn Jesus“. Das griechische Wort für „Glaube“ kann je nach Zusammenhang auch die Bedeutung „Treue“ haben.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lassen „und eurer Liebe“ aus.
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung verweist begründend auf den vorausgehenden Lobpreis zurück; „Darum“ gibt den folgernden Zusammenhang natürlich wieder.
- source_word: κἀγώ
  choice: auch ich
  rationale: Die Verschmelzung von καί und ἐγώ setzt Paulus ausdrücklich hinzu, ohne das Pronomen übermäßig zu betonen.
- source_word: ἀκούσας
  choice: habe … gehört
  rationale: Das Aoristpartizip bezeichnet das vorausgehende beziehungsweise den Anlass gebende Hören. Im Deutschen ist die finite Form innerhalb des fortlaufenden Satzes natürlicher; der Satz wird in Vers 16 weitergeführt.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: eurem Glauben
  rationale: Die idiomatische Wendung bezeichnet den Glauben der Adressaten. Der Dativ wird durch „von“ regiert.
- source_word: πίστιν ἐν τῷ κυρίῳ Ἰησοῦ
  choice: Glauben an den Herrn Jesus
  rationale: Im heutigen Deutschen bezeichnet „Glaube an“ die vertrauende Beziehung zu einer Person idiomatisch; ein wörtliches „Glaube in“ wäre unnatürlich. Die mögliche Nuance von Vertrauen wird in der Fußnote bewahrt.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ bewahrt den christologischen Titel κύριος und ist im Deutschen die etablierte, gewichtige Wiedergabe.
- source_word: ἀγάπην
  choice: Liebe
  rationale: „Liebe“ ist die klare und gegenwärtige Entsprechung von ἀγάπη.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: zu allen Heiligen
  rationale: „Zu“ gibt die auf Personen gerichtete Bedeutung von εἰς nach ἀγάπη natürlich und relativ formnah wieder.
- source_word: ἁγίους
  choice: Heiligen
  rationale: „Heilige“ bewahrt die paulinische Bezeichnung für die Glaubenden und vermeidet eine erklärende Paraphrase im Haupttext.
theological_decisions:
- issue: Bedeutung von πίστις in der Beziehung zu Jesus
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: In dieser Konstruktion steht primär die glaubende beziehungsweise vertrauende Beziehung der Adressaten zum Herrn Jesus im Vordergrund. „Treue“ ist lexikalisch möglich, hier aber weniger wahrscheinlich; „Vertrauen“ wird als verständliche Bedeutungsnuance in der Fußnote genannt.
- issue: Wiedergabe von κύριος als christologischer Titel
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt den etablierten christologischen Titel und dessen theologisches Gewicht, ohne ihn abzuschwächen.
- issue: Referenz von οἱ ἅγιοι
  choice: die Heiligen
  alternative: Gottes heiliges Volk; die heiligen Menschen
  rationale: Die traditionelle Wiedergabe erhält die paulinische Gruppenbezeichnung. Im Kontext meint sie alle zu Gott gehörenden Glaubenden, nicht nur später besonders ausgezeichnete Personen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die finite Konstruktion ist für den deutschen Satzfluss gewählt; Vers 15 bleibt wegen der Fortsetzung in Vers 16 bewusst ohne abschließenden Punkt. „Heilige“ wird als paulinische Bezeichnung beibehalten.
