  naturalness: „Zum Lob seiner Herrlichkeit da sind“ ist im modernen Standarddeutsch jedoch semantisch blass und stilistisch unidiomatisch. „Zum Lob seiner Herrlichkeit dienen“ formuliert den mit εἰς τὸ εἶναι εἰς ἔπαινον ausgedrückten Zweck klar und natürlich.
