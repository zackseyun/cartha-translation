- from: damit wir, die wir schon zuvor auf den Messias gehofft hatten, zum Lob seiner Herrlichkeit da sind.[a]
  to: damit wir, die wir schon zuvor auf den Messias gehofft haben, zum Lob seiner Herrlichkeit dienen.[a]
  rationale: Die Übersetzung ersetzt allein die unnatürliche Wendung „da sind“ durch „dienen“. Zugleich wird beim Partizip das deutsche Perfekt „gehofft haben“ verwendet, das die fortwirkende Relevanz des griechischen Perfekts besser wahrt als das im bisherigen Satz zeitlich unmotivierte Plusquamperfekt. Die Fußnote bleibt als vorsichtige Alternative zur stärker spezifizierenden Deutung von προηλπικότας erhalten.
