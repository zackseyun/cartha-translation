  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: de
  text: damit wir, die wir schon zuvor auf den Messias gehofft haben, zum Lob seiner Herrlichkeit dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir, die wir als Erste auf den Messias gehofft haben, zum Lob seiner Herrlichkeit dienen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: damit … da sind
  rationale: Die Präposition mit substantiviertem Infinitiv bezeichnet hier Ziel beziehungsweise Ergebnis. Die finite Konstruktion mit „damit“ ist im Deutschen natürlich; „da sind“ gibt εἶναι wieder und verbindet sich idiomatisch mit „zum Lob“.
- source_word: ἡμᾶς
  choice: wir
  rationale: Im Griechischen ist das Pronomen Akkusativ als Subjekt des Infinitivs; bei der deutschen Umformung in einen finiten Nebensatz steht entsprechend der Nominativ „wir“.
- source_word: εἰς ἔπαινον
  choice: zum Lob
  rationale: Die Formulierung bewahrt die Zielrichtung der wiederkehrenden Wendung im Epheserbrief und klingt zugleich natürlich und würdig.
- source_word: δόξης αὐτοῦ
  choice: seiner Herrlichkeit
  rationale: Der Genitiv wird direkt bewahrt. „Herrlichkeit“ erhält das theologische Gewicht von δόξα, ohne es paraphrasierend einzuengen.
- source_word: τοὺς προηλπικότας
  choice: die wir schon zuvor … gehofft hatten
  rationale: Das Perfektpartizip bezeichnet ein früher einsetzendes Hoffen mit fortwirkender Bedeutung. „Schon zuvor“ bildet die zeitliche Priorität ab, ohne festzulegen, ob ausdrücklich die allererste Gruppe der Hoffenden gemeint ist.
- source_word: ἐν τῷ Χριστῷ
  choice: auf den Messias
  rationale: Beim Verb „hoffen“ verlangt idiomatisches Deutsch „auf“. Χριστός wird als Titel mit „Messias“ wiedergegeben; die Präposition ἐν bezeichnet hier den Bezug beziehungsweise die Grundlage der Hoffnung.
theological_decisions:
- issue: Ob προηλπικότας eine bestimmte erste Gruppe bezeichnet oder lediglich Menschen, die bereits zuvor gehofft hatten
  choice: die wir schon zuvor auf den Messias gehofft hatten
  alternative: die wir als Erste auf den Messias gehofft hatten
  rationale: Die Vorsilbe προ- bezeichnet zeitliche Priorität, legt aber nicht eindeutig fest, dass die betreffende Gruppe die absolut erste war. Der Haupttext wahrt diese Offenheit; die stärker heilsgeschichtlich deutende Lesart steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativsatz bestimmt näher, wer mit „wir“ gemeint ist. „Zum Lob seiner Herrlichkeit“ bewahrt die prägnante paulinische Wendung; „da sind“ vermeidet die im Deutschen schwerfällige Formulierung „zum Lob … sein“.
