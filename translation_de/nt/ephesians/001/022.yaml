id: EPH.1.22
reference: Ephesians 1:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: de
  text: Und alles hat er ihm unter die Füße unterworfen[a] und ihn der Gemeinde[b] als Haupt über alles gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung greift das Bild aus Psalm 8,7 auf: Alles wird dem Herrscher unter die Füße gelegt.'
    reason: cross_reference
  - marker: b
    text: 'Oder: »für die Gemeinde«; der griechische Dativ kann sowohl die Empfängerin als auch die Begünstigte bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet die Gesamtheit aller Dinge und bewahrt den umfassenden, kosmischen Horizont.
- source_word: ὑπέταξεν
  choice: hat … unterworfen
  rationale: Die Wiedergabe bezeichnet ein Unterordnen unter Herrschaft und erhält zugleich das Bild der folgenden Wendung.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: ihm unter die Füße
  rationale: Diese natürliche deutsche Wendung bewahrt das Herrschaftsbild und macht deutlich, dass die Füße zu Christus gehören, nicht zum handelnden Gott.
- source_word: αὐτὸν ἔδωκεν
  choice: ihn … gegeben
  rationale: Die Grundbedeutung von δίδωμι wird erhalten; eine stärker deutende Wiedergabe wie »eingesetzt« wird vermieden.
- source_word: κεφαλὴν
  choice: als Haupt
  rationale: »Haupt« erhält die paulinische Metapher; »als« kennzeichnet im Deutschen die prädikative Funktion.
- source_word: ὑπὲρ πάντα
  choice: über alles
  rationale: Die Formulierung drückt Christi Vorrang und Herrschaft über die gesamte Schöpfung knapp und idiomatisch aus.
- source_word: τῇ ἐκκλησίᾳ
  choice: der Gemeinde
  rationale: Der Dativ kann die Gemeinde als Empfängerin oder als Begünstigte bezeichnen. »Gemeinde« ist im modernen biblischen Deutsch verständlich und lässt den unmittelbaren Kontext zur Gemeinschaft der Glaubenden erkennen.
theological_decisions:
- issue: Verhältnis von Christi Hauptsein zur Gemeinde und zu allem
  choice: Christus wird der Gemeinde als der gegeben, der Haupt über alles ist.
  alternative: Christus wird zum Nutzen der Gemeinde als Haupt über alles gegeben.
  rationale: Die Wortstellung verbindet »Haupt« sachlich mit »über alles«, während der Dativ die besondere Beziehung zur Gemeinde ausdrückt. Die mögliche Nuance von Empfängerin oder Begünstigter bleibt in einer Fußnote offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken. »Ihm unter die Füße« vermeidet den im Deutschen möglichen falschen Bezug eines Possessivpronomens auf Gott als Satzsubjekt.
