  source_fidelity: Die Übersetzung gibt die beiden Prädikate ὑπέταξεν und ἔδωκεν, die umfassende Aussage πάντα sowie die Beziehung „als Haupt über alles“ zur Gemeinde zutreffend wieder. „Ihm unter die Füße“ erhält den Bezug auf Christus klar und bewahrt das Bild der Unterordnung.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und trotz der engen Orientierung am griechischen Satzbau gut verständlich. „Gemeinde“ und „Haupt“ sind in diesem paulinischen Kontext etablierte und angemessene Formulierungen.
  terminology: „Alles“, „unterworfen“, „Haupt“, „über alles“ und „Gemeinde“ sind terminologisch konsistent und vermeiden eine konfessionell einengende Auslegung. Die Fußnote zu „der Gemeinde“ bewahrt sachgerecht die offene Nuance des griechischen Dativs.
