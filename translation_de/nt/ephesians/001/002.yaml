  source_fidelity: Der griechische Segensgruß wird vollständig und ohne sachliche Zusätze wiedergegeben. „Gnade sei mit euch“ gibt χάρις ὑμῖν als im Deutschen natürliche Segensformel wieder; die ausgelassene Wiederaufnahme bei „und Friede“ entspricht der knappen griechischen Koordination. „von Gott, unserem Vater, und dem Herrn Jesus, dem Messias“ wahrt die gemeinsame Abhängigkeit von ἀπό sowie die appositionale Beziehung von „unserem Vater“ zu Gott.
