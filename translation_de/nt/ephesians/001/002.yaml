id: EPH.1.2
reference: Ephesians 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: de
  text: Gnade sei mit euch und Friede von Gott, unserem Vater, und dem Herrn Jesus, dem Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Herrn Jesus Christus“. Das griechische Χριστός kann als Titel („Messias“) oder in manchen Zusammenhängen wie ein Namensbestandteil („Christus“) gebraucht werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Bewahrt sowohl den Grußcharakter als auch den für Paulus wichtigen theologischen Gehalt des Begriffs.
- source_word: ὑμῖν
  choice: sei mit euch
  rationale: Gibt den Dativ des Gruß- und Segenswunsches in natürlichem Deutsch wieder; „euch“ wahrt den Plural.
- source_word: εἰρήνη
  choice: Friede
  rationale: Die traditionelle und sachlich passende Wiedergabe lässt sowohl den allgemeinen Sinn als auch den möglichen Anklang an den jüdischen Schalom-Gruß bestehen.
- source_word: ἀπὸ
  choice: von
  rationale: Kennzeichnet Gott und den Herrn Jesus als Ursprung des zugesprochenen Segens.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Gott, unserem Vater
  rationale: Versteht „unserem Vater“ appositionell zu „Gott“, ohne ein im Griechischen nicht vorhandenes zusätzliches „und“ einzuführen.
- source_word: κυρίου
  choice: Herrn
  rationale: Bewahrt die christologische Titelfunktion von κύριος und entspricht dem etablierten deutschen Sprachgebrauch.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: Übersetzt Χριστός als Titel und macht dessen messianische Bedeutung verständlich; die Apposition ist im Deutschen idiomatisch und bleibt syntaktisch von „von“ abhängig.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  alternative: Jesus Christus
  rationale: Χριστός kann als Titel „Messias“ oder in einer namenähnlichen Verbindung als „Christus“ verstanden werden. Der Haupttext macht die Titelbedeutung sichtbar; die geläufige alternative Wiedergabe wird in der Fußnote bewahrt.
- issue: Verhältnis von Gott, dem Vater, und dem Herrn Jesus als Ursprung des Segens
  choice: von Gott, unserem Vater, und dem Herrn Jesus
  alternative: von unserem Gott und Vater und dem Herrn Jesus
  rationale: Die griechische Wortfolge legt nahe, πατρὸς ἡμῶν appositionell auf θεοῦ zu beziehen. Zugleich bleibt die gemeinsame Abhängigkeit beider Glieder von ἀπό erhalten, ohne ihre theologische Beziehung weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Grußformel „Gnade sei mit euch“ ist gut verständlich und bewahrt den Segenscharakter. Die Ellipse bei „und Friede“ folgt der knappen griechischen Formulierung, ohne einen zusätzlichen Gedanken einzuführen.
