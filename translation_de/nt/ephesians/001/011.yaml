id: EPH.1.11
reference: Ephesians 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: de
  text: In ihm sind auch wir zu Gottes Erbteil geworden[a], vorherbestimmt nach dem Vorsatz dessen, der alles nach dem Ratschluss seines Willens wirkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In ihm haben auch wir ein Erbteil erhalten.“ Das griechische Verb kann entweder den Empfang eines Erbteils oder die Bestimmung zu Gottes Erbteil und Eigentum bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: In ihm
  rationale: Das Relativpronomen verweist im Zusammenhang auf Christus. „In ihm“ ist im Deutschen natürlich und bewahrt den Gedanken der Verbundenheit mit Christus.
- source_word: ἐκληρώθημεν
  choice: sind auch wir zu Gottes Erbteil geworden
  rationale: Das Passiv kann ausdrücken, dass die Glaubenden als Gottes zugelostes Eigentum beziehungsweise Erbteil bestimmt wurden. Die Ergänzung „Gottes“ macht den im Ausdruck vorausgesetzten Besitzer verständlich; die ebenfalls plausible Deutung als Empfang eines Erbteils bleibt in der Fußnote erhalten.
- source_word: προορισθέντες
  choice: nachdem wir vorherbestimmt worden waren
  rationale: Die Form bezeichnet eine vorausgehende Bestimmung. Die temporale Wiedergabe macht das Verhältnis zum Hauptverb verständlich, ohne ein darüber hinausgehendes theologisches System einzutragen.
- source_word: κατὰ πρόθεσιν
  choice: nach dem Vorsatz
  rationale: „Vorsatz“ bezeichnet hier eine zielgerichtete Absicht und entspricht dem würdigen paulinischen Sprachregister.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: dessen, der alles … wirkt
  rationale: Die Wiedergabe erhält Gott als handelndes Subjekt und lässt die Art seines Wirkens unbestimmt.
- source_word: τὰ πάντα
  choice: alles
  rationale: „Alles“ gibt den umfassenden Geltungsbereich knapp und idiomatisch wieder.
- source_word: κατὰ τὴν βουλὴν
  choice: nach dem Ratschluss
  rationale: „Ratschluss“ bewahrt die Nuance einer überlegten, feststehenden Entscheidung besser als das allgemeinere „Plan“.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: seines Willens
  rationale: Die Formulierung gibt die Genitivverbindung direkt wieder und bewahrt das Verhältnis zwischen Gottes Ratschluss und seinem Willen.
theological_decisions:
- issue: Bedeutung von ἐκληρώθημεν
  choice: Die Glaubenden sind zu Gottes Erbteil beziehungsweise seinem zugelosten Volk geworden.
  alternative: Die Glaubenden haben ein Erbteil erhalten.
  rationale: Das passive Verb lässt beide Deutungen zu. Die alttestamentliche Vorstellung von Gottes Volk als seinem Erbteil und die Passivform stützen die Hauptfassung; da die empfangsbezogene Deutung sprachlich ebenfalls gut möglich ist, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit maßvoll formellem paulinischem Ton. „Erbteil“, „Vorsatz“ und „Ratschluss“ bewahren die begriffliche Dichte des Ausgangstextes; die Satzstruktur bleibt lesbar, ohne die logischen Bezüge einzuebnen.
