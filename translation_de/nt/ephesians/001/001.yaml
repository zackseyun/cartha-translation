id: EPH.1.1
reference: Ephesians 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: de
  text: 'Paulus, Apostel des Messias Jesus durch Gottes Willen, an die Heiligen, die [in Ephesus][a] sind und dem Messias Jesus treu sind[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige frühe Handschriften lassen „in Ephesus“ aus. Daher könnte der Brief für eine weitere Verbreitung bestimmt gewesen sein und nicht nur für die Gemeinde in Ephesus.
    reason: textual_variant
  - marker: b
    text: 'Oder: „an die Gläubigen im Messias Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: Apostel
  rationale: „Apostel“ bewahrt hier die etablierte Bezeichnung für den von Christus beauftragten Gesandten und damit den amtlich-autoritativen Sinn.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός hat in der Grußformel weiterhin erkennbaren Titelcharakter; „Messias“ gibt diesen wieder, während der Genitiv durch „des“ ausgedrückt wird.
- source_word: διὰ θελήματος θεοῦ
  choice: durch Gottes Willen
  rationale: διά mit Genitiv bezeichnet hier die vermittelnde Grundlage beziehungsweise Autorisierung von Paulus’ Apostelamt. Die Formulierung bleibt nahe am Griechischen und ist im Deutschen verständlich.
- source_word: τοῖς ἁγίοις
  choice: an die Heiligen
  rationale: Gemeint sind die Gott geweihten Angehörigen seines Volkes. „Die Heiligen“ ist die im Deutschen etablierte gemeinschaftliche Bezeichnung und meint nicht nur besonders herausragende Einzelpersonen.
- source_word: τοῖς οὖσιν [ἐν Ἐφέσῳ]
  choice: die [in Ephesus] sind
  rationale: Die direkte Wiedergabe erhält sowohl die griechische Satzstruktur als auch durch eckige Klammern die textkritische Unsicherheit der Ortsangabe.
- source_word: πιστοῖς
  choice: Treuen
  rationale: πιστός kann sowohl „treu“ als auch „gläubig“ bedeuten. „Treuen“ bewahrt die adjektivische Bedeutung; die ebenfalls mögliche Deutung „Gläubigen“ wird in einer Fußnote genannt.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: „Im Messias Jesus“ bewahrt die paulinische Beziehungsaussage mit ἐν und gibt Χριστός als Titel wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός in der paulinischen Grußformel
  choice: Messias
  alternative: Christus
  rationale: Hier ist Χριστός als Würdetitel noch deutlich erkennbar. „Messias“ macht diesen Titelcharakter transparent, ohne ihn zu einem bloßen Namensbestandteil werden zu lassen.
- issue: Textbestand von ἐν Ἐφέσῳ
  choice: Die Ortsangabe steht in eckigen Klammern im Haupttext und erhält eine Fußnote.
  alternative: Auslassung von „in Ephesus“
  rationale: Einige frühe und bedeutende Handschriften lassen die Ortsangabe aus. Die Klammern bewahren die Unsicherheit sichtbar, statt die Textfrage stillschweigend zu entscheiden.
- issue: Bedeutung von πιστοῖς
  choice: Treuen
  alternative: Gläubigen
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der Haupttext erhält mit „Treuen“ die Eigenschaft der Treue, während die Fußnote die Deutung als Glaubende offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit Nähe zur griechischen Grußformel. „Messias Jesus“ ist bewusst ungewöhnlicher als „Jesus Christus“, erhält aber die im Ausgangstext vorangestellte Titelfunktion. Die eckigen Klammern sind Teil des Haupttextes und markieren die textkritisch unsichere Ortsangabe; sämtliche Fußnotenmarker erscheinen unmittelbar an der betreffenden Stelle.
