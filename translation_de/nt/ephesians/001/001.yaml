    issue: Die zweite Präposition „an“ trennt „die Treuen“ von „den Heiligen“ zu einer zweiten Empfängergruppe.
    rationale: τοῖς ἁγίοις und πιστοῖς sind im griechischen Dativ beide auf dieselben Adressaten bezogen. Die deutsche Fassung soll diese gemeinsame Bezugnahme ohne zusätzliche Empfängeranrede erkennen lassen.
