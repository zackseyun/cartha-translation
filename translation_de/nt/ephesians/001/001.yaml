  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des griechischen Textes zutreffend wieder: Paulus’ Apostelamt beruht auf Gottes Willen; Χριστός wird als Titel mit „Messias“ wiedergegeben; die unsichere Ortsangabe bleibt geklammert; und πιστοῖς wird mit der Fußnotenalternative angemessen offen gehalten. Die zweimalige Empfängeranrede („an die Heiligen ... und an die Treuen“) lässt jedoch zwei getrennte Empfängergruppen entstehen, während beide Bezeichnungen im Griechischen denselben Adressaten näher bestimmen.'
  naturalness: „Paulus, Apostel ...“ ist in einem brieflichen, würdevollen Register möglich. Die koordinierte Wiederholung von „an“ ist hingegen syntaktisch und semantisch weniger passend. Eine einheitliche Relativsatzkonstruktion ist natürlicher und bildet die griechische Zuordnung klarer ab.
  terminology: „Apostel“, „Heilige“ und „Messias“ sind konsequent und fachlich tragfähig. „Treuen“ ist als substantiviertes Adjektiv möglich, klingt hier aber zusammen mit der zweiten Anrede unnötig schwerfällig. „dem Messias Jesus treu“ gibt die gewählte Nuance idiomatisch wieder; die Fußnote bewahrt „Gläubigen“ als mögliche Lesart.
  issues:
