  text: ἧς ἐπερίσσευσεν εἰς ἡμᾶς ἐν πάσῃ σοφίᾳ καὶ φρονήσει
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/008.yaml
  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: de
  text: die er uns in aller Weisheit und Einsicht überreich geschenkt hat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der er uns überreich beschenkt hat“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „in aller Weisheit und Einsicht“ kann entweder beschreiben, wie Gott seine Gnade überreich schenkte, oder Weisheit und Einsicht bezeichnen, die den Glaubenden dabei zuteilwurden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: die
  rationale: Das feminine Relativpronomen im Genitiv nimmt die zuvor genannte Gnade wieder auf. Im Deutschen ermöglicht die Verbindung mit „geschenkt“ eine natürliche Wiedergabe, ohne den Bezug zu verlieren.
- source_word: ἐπερίσσευσεν
  choice: überreich geschenkt hat
  rationale: 'Die aktive Aoristform hat hier wahrscheinlich kausativ-transitiven Sinn: Gott ließ seine Gnade den Empfängern überreich zukommen. Die Formulierung bewahrt den Gedanken überschwänglicher Fülle und klingt im heutigen Deutsch natürlich.'
- source_word: εἰς ἡμᾶς
  choice: uns
  rationale: Der Dativ bei „geschenkt“ gibt die auf die Glaubenden gerichtete Zuwendung idiomatisch wieder.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: in aller Weisheit und Einsicht
  rationale: Die formnahe Wiedergabe wahrt die mögliche Zuordnung der Präpositionalphrase entweder zu Gottes Handeln oder zu dem, was den Glaubenden mit der Gnade zuteilwird.
- source_word: σοφίᾳ
  choice: Weisheit
  rationale: „Weisheit“ ist die transparente und übliche Wiedergabe von σοφία.
- source_word: φρονήσει
  choice: Einsicht
  rationale: „Einsicht“ unterscheidet den Ausdruck von σοφία und vermittelt verständiges, auch praktisch orientiertes Erfassen, ohne das heute teils engere „Klugheit“ festzulegen.
theological_decisions:
- issue: Bezug von „in aller Weisheit und Einsicht“
  choice: Die syntaktische Zuordnung bleibt im Haupttext offen.
  alternative: Die Wendung kann entweder die Weise beschreiben, in der Gott seine Gnade schenkte, oder Weisheit und Einsicht bezeichnen, die den Glaubenden im Zusammenhang mit dieser Gnade zuteilwerden.
  rationale: Die griechische Wortstellung erlaubt beide Bezüge. Eine ausdrückliche Festlegung würde eine echte exegetische und theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Überreich geschenkt“ ist verständlich und bewahrt den Gedanken der überströmenden Fülle; die formnahe Präpositionalphrase lässt die genuine syntaktische Mehrdeutigkeit bestehen.
