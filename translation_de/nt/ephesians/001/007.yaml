id: EPH.1.7
reference: Ephesians 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: de
  text: In ihm haben wir die Erlösung durch sein Blut, die Vergebung der Verfehlungen, nach dem Reichtum seiner Gnade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: In ihm
  rationale: Das Relativpronomen verweist auf den Geliebten im vorhergehenden Vers. „In ihm“ ist im modernen Deutsch natürlich und bewahrt den paulinischen Gedanken der Verbundenheit mit Christus.
- source_word: ἔχομεν
  choice: haben wir
  rationale: Der Präsens-Indikativ bezeichnet eine gegenwärtige Wirklichkeit; „haben wir“ gibt dies direkt wieder.
- source_word: ἀπολύτρωσιν
  choice: die Erlösung
  rationale: Der Ausdruck bezeichnet Befreiung, die mit einem kostspieligen Mittel verbunden ist. „Erlösung“ bewahrt das begriffliche und theologische Gewicht des Wortes.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: durch sein Blut
  rationale: διά mit Genitiv bezeichnet hier das Mittel. Die konkrete Blut-Metaphorik des griechischen Textes wird unverändert bewahrt.
- source_word: ἄφεσιν
  choice: die Vergebung
  rationale: Im Zusammenhang bezeichnet ἄφεσις den Erlass der Verfehlungen; „Vergebung“ ist die klare und idiomatische deutsche Entsprechung.
- source_word: παραπτωμάτων
  choice: der Verfehlungen
  rationale: παράπτωμα bezeichnet moralisches Fehlverhalten oder einen Fehltritt. „Verfehlungen“ ist modernes, verständliches Deutsch und bewahrt den moralischen Sinn, ohne eine bestimmte Gesetzesmetaphorik hinzuzufügen.
- source_word: κατὰ τὸ πλοῦτος
  choice: nach dem Reichtum
  rationale: κατά mit Akkusativ bezeichnet hier Maßstab oder Maß. „Nach dem Reichtum“ folgt der griechischen Struktur und vermittelt, dass die Gnade selbst das Maß der Vergebung ist.
- source_word: χάριτος
  choice: seiner Gnade
  rationale: „Gnade“ ist die semantisch angemessene und im paulinischen Sprachgebrauch etablierte Wiedergabe von χάρις.
theological_decisions:
- issue: Verhältnis von „Erlösung“ und „Vergebung der Verfehlungen“
  choice: 'Die beiden Akkusativgruppen werden appositionell nebeneinandergestellt: „die Erlösung …, die Vergebung …“'
  alternative: „die Erlösung, das heißt die Vergebung der Verfehlungen“
  rationale: Die zweite Wortgruppe erläutert am wahrscheinlichsten die erste. Die griechische Struktur wird bewahrt, ohne das deutende „das heißt“ einzufügen.
- issue: Sühne- und Opferaussage in „durch sein Blut“
  choice: Die konkrete Formulierung „durch sein Blut“ bleibt erhalten.
  alternative: „durch seinen Tod“ oder „durch seinen Opfertod“
  rationale: Der Ausgangstext nennt ausdrücklich das Blut. Eine Ersetzung durch „Tod“ würde die kultische und bundesbezogene Bildsprache interpretierend abschwächen.
- issue: Maßstab der Gnade
  choice: „nach dem Reichtum seiner Gnade“
  alternative: „aus dem Reichtum seiner Gnade“
  rationale: κατά bezeichnet eher Maßstab beziehungsweise Entsprechung als bloße Herkunft. Die gewählte Formulierung wahrt diese Aussage, auch wenn sie im Deutschen leicht gehoben klingt.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Bildsprache des griechischen Textes. Keine Fußnote ist nötig: Anders als im Englischen besteht bei „In ihm“ keine relevante formale Alternative zu „in welchem“, und „Verfehlungen“ deckt den Sinn von παραπτώματα verständlich ab.'
