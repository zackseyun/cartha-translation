  source_fidelity: 'Der Text gibt sämtliche Satzglieder des griechischen Ausgangstextes zutreffend wieder: die lokative Beziehung „In ihm“, das gegenwärtige „haben wir“, die Erlösung als durch sein Blut vermittelt, die appositionell folgende Vergebung der Verfehlungen sowie den Maßstab „nach dem Reichtum seiner Gnade“. Die konkrete Bildsprache „Blut“ bleibt erhalten; die appositionelle Beziehung wird nicht überdeutet.'
  naturalness: „In ihm haben wir die Erlösung durch sein Blut, die Vergebung der Verfehlungen, nach dem Reichtum seiner Gnade“ ist verständliches, würdiges modernes Standarddeutsch. Die Stellung von „nach dem Reichtum seiner Gnade“ ist leicht gehoben, aber für den paulinischen Registerton natürlich und bewahrt die enge Bindung an den Ausgangstext.
  terminology: „Erlösung“, „Blut“, „Vergebung“ und „Gnade“ sind sachgerechte, im deutschen neutestamentlichen Sprachgebrauch etablierte Wiedergaben. „Verfehlungen“ ist eine tragfähige moderne Wiedergabe von παραπτώματα und legt keine engere Deutung als der griechische Begriff fest.
