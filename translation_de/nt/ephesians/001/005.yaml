- from: indem er uns im Voraus dazu bestimmte, durch Jesus, den Messias, als Söhne angenommen zu werden und zu ihm zu gehören[a] – so entsprach es seinem wohlgefälligen Willen.
  to: indem er uns im Voraus dazu bestimmte, durch Jesus, den Messias, als Söhne für sich selbst angenommen zu werden, nach dem Wohlgefallen seines Willens.
  rationale: Die Revision ersetzt die auslegende Ergänzung „zu ihm zu gehören“ durch „für sich selbst“ und vermerkt die alternative Zielrichtung in der Fußnote. Sie gibt κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ unmittelbar als „nach dem Wohlgefallen seines Willens“ wieder. Die übrigen zentralen Entscheidungen bleiben erhalten.
