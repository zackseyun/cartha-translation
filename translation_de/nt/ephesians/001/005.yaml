  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: de
  text: indem er uns im Voraus dazu bestimmte, durch Jesus, den Messias, als Söhne für sich selbst angenommen zu werden, nach dem Wohlgefallen seines Willens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προορίσας
  choice: indem er uns im Voraus dazu bestimmte
  rationale: Die Wiedergabe bewahrt sowohl die Vorzeitigkeit als auch die Festlegung in προορίζω. Die Partizipialform wird als anschließender Modalsatz wiedergegeben, da der Vers syntaktisch zum langen Segenssatz ab Vers 3 gehört.
- source_word: εἰς υἱοθεσίαν
  choice: als Söhne angenommen zu werden
  rationale: υἱοθεσία bezeichnet die Einsetzung beziehungsweise Annahme in den rechtlichen Status eines Sohnes. Diese Formulierung bewahrt den im Griechischen enthaltenen Sohn- und Erbstatus und bleibt zugleich verständlich.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: διά mit Genitiv bezeichnet hier Vermittlung. Χριστός wird als Titel mit „Messias“ übersetzt, während Ἰησοῦ als Name transliteriert wird.
- source_word: εἰς αὐτόν
  choice: und zu ihm zu gehören
  rationale: εἰς αὐτόν bezeichnet Gott als Ziel der Annahme. Die idiomatische deutsche Formulierung drückt diese Zielrichtung aus, ohne die mögliche Zwecknuance auszuschließen.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: so entsprach es seinem wohlgefälligen Willen
  rationale: κατά bezeichnet Übereinstimmung; εὐδοκία meint Wohlgefallen beziehungsweise einen günstig gefassten Entschluss. „Wohlgefälliger Wille“ ist würdig und im modernen Deutsch verständlich.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: seinem … Willen
  rationale: θέλημα wird direkt mit „Wille“ wiedergegeben; das Possessivpronomen bewahrt αὐτοῦ.
theological_decisions:
- issue: Wiedergabe von προορίσας in einem lehrmäßig umstrittenen Zusammenhang
  choice: im Voraus dazu bestimmte
  alternative: vorherbestimmte
  rationale: Die gewählte Formulierung bewahrt die ausdrückliche Vorher-Festlegung des griechischen Verbs, ohne durch ein kirchlich stark aufgeladenes deutsches Fachwort zusätzliche systematische Aussagen einzutragen.
- issue: Geschlechtsspezifischer und rechtlicher Gehalt von υἱοθεσία
  choice: als Söhne angenommen zu werden
  alternative: als Kinder anzunehmen / die Sohnschaft zu empfangen
  rationale: „Als Söhne“ erhält die sprachliche Gestalt und den rechtlichen Erbstatus des griechischen Begriffs. Der Vers selbst beschränkt die gemeinte Personengruppe nicht auf Männer.
- issue: Titel Χριστοῦ
  choice: den Messias
  alternative: Christus
  rationale: Χριστός ist hier der Titel „Messias“. Die Apposition mit bestimmtem Artikel ist im Deutschen idiomatisch.
- issue: Bezug und Funktion von εἰς αὐτόν
  choice: zu ihm zu gehören
  alternative: für sich selbst / zu sich hin
  rationale: Die Formulierung erhält Gott als Ziel der Annahme; die Fußnote weist auf die ebenfalls mögliche Zwecknuance hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als abhängige Fortführung des Segenssatzes in Epheser 1,3–14 gestaltet. „Als Söhne angenommen“ erklärt den rechtlichen Status knapp im Haupttext; die inklusive Reichweite wird nicht durch eine geschlechtsneutrale Einebnung des Quellbegriffs verdeckt.
