  verdict: revise
  source_fidelity: 'Die Grundbestandteile werden überwiegend erfasst: προορίσας mit der Vorherbestimmung, υἱοθεσία mit der Annahme als Söhne und διά als Vermittlung durch Jesus, den Messias. Die Hauptfassung deutet εἰς αὐτόν jedoch durch die zusätzliche Wendung „zu ihm zu gehören“ zu stark aus. Zudem gibt „so entsprach es seinem wohlgefälligen Willen“ κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ nicht präzise wieder: εὐδοκία ist das Wohlgefallen, nicht eine Eigenschaft des Willens.'
  naturalness: Die Satzform als Fortführung des Segenssatzes ist möglich. Die revidierte Formulierung bleibt modernes, würdiges Standarddeutsch und ist zugleich syntaktisch näher am griechischen Partizipialausdruck. „Nach dem Wohlgefallen seines Willens“ ist idiomatisch und klar.
  terminology: „Messias“ gibt Χριστός angemessen als Titel wieder. „Als Söhne angenommen zu werden“ wahrt die geschlechtlich markierte und statusbezogene Nuance von υἱοθεσία. „Für sich selbst“ bewahrt für εἰς αὐτόν die mögliche Zweckrichtung, ohne eine nicht ausdrücklich formulierte Zugehörigkeitsaussage einzutragen.
  issues:
  - severity: medium
    issue: εἰς αὐτόν wird mit „und zu ihm zu gehören“ paraphrasiert.
    rationale: Die Wendung fügt das Verb „gehören“ hinzu und macht aus der umstrittenen Präpositionalphrase eine konkrete Aussage über Zugehörigkeit. Der griechische Ausdruck kann Zielrichtung oder Zweck ausdrücken; dies sollte im Haupttext nicht weiter ausgelegt werden.
  - severity: medium
    issue: „so entsprach es seinem wohlgefälligen Willen“ verschiebt die Bedeutung von κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ.
    rationale: κατά bedeutet „nach/gemäß“, und εὐδοκία bezeichnet das Wohlgefallen bzw. den gnädig gefassten Entschluss. „Wohlgefälliger Wille“ lässt den Willen selbst als wohlgefällig erscheinen und gibt die Genitivverbindung weniger genau wieder.
  revised_text: indem er uns im Voraus dazu bestimmte, durch Jesus, den Messias, als Söhne für sich selbst angenommen zu werden, nach dem Wohlgefallen seines Willens.
  revised_footnotes:
  - marker: a
    text: 'Oder: „zu ihm hin“. Die griechische Wendung kann sowohl die Ausrichtung auf ihn als auch den Zweck für ihn ausdrücken.'
    reason: lexical_alternative
