  text: οὐ παύομαι εὐχαριστῶν ὑπὲρ ὑμῶν ⸀μνείαν ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/016.yaml
  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: de
  text: Ich höre nicht auf, für euch zu danken und euch in meinen Gebeten zu erwähnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meinen Gebeten an euch zu denken“. Wörtlich lautet die griechische Wendung: „Erwähnung [von euch] zu machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παύομαι
  choice: Ich höre nicht auf
  rationale: Die Wendung gibt die fortdauernde Nichtbeendigung direkt und zugleich in natürlichem modernem Deutsch wieder.
- source_word: εὐχαριστῶν
  choice: für euch zu danken
  rationale: Das Partizip bezeichnet die fortdauernde Handlung des Dankens; der deutsche Infinitiv fügt sich natürlich in die Konstruktion mit „höre nicht auf“ ein.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: ὑπέρ mit Genitiv bezeichnet hier die Menschen, derentwegen Gott gedankt wird; „für euch“ bewahrt diese offene, im Deutschen übliche Beziehung.
- source_word: μνείαν ποιούμενος
  choice: euch … zu erwähnen
  rationale: Die griechische Wendung bedeutet wörtlich „Erwähnung machen“. „Euch erwähnen“ bleibt diesem Ausdruck nahe und ist verständlicher als eine substantivische Nachbildung.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: in meinen Gebeten
  rationale: Die Präpositionalphrase bezeichnet den Rahmen beziehungsweise Anlass des Erwähnens; „in meinen Gebeten“ ist idiomatisch und sachlich genau.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Partizipien des Griechischen werden als koordinierte Infinitive nach „Ich höre nicht auf“ wiedergegeben; dadurch bleiben der fortdauernde Dank und das fortdauernde Erwähnen eng verbunden.
