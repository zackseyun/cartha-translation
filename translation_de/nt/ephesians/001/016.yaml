  verdict: approve
  source_fidelity: Der deutsche Text gibt οὐ παύομαι mit „Ich höre nicht auf“ treffend als fortdauernde Nichtunterbrechung wieder. „für euch zu danken“ entspricht εὐχαριστῶν ὑπὲρ ὑμῶν, und „euch in meinen Gebeten zu erwähnen“ gibt μνείαν ποιούμενος ἐπὶ τῶν προσευχῶν μου angemessen wieder. Die im Griechischen bei μνείαν ποιούμενος nur kontextuell ergänzte Bezugnahme auf „euch“ darf im Deutschen explizit erscheinen.
  naturalness: Die koordinierte Infinitivkonstruktion ist modernes, klares Standarddeutsch. Sie bewahrt die enge Verbindung von Danken und Erwähnen, ohne eine unnatürliche Partizipialkonstruktion zu erzwingen.
  terminology: „danken“, „Gebete“ und „erwähnen“ sind registergerecht und theologisch neutral. Die Fußnote bietet mit „an euch zu denken“ eine sinnvolle lexikalische Alternative und erläutert die griechische Idiomatik ausreichend.
