  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: de
  text: Er machte uns das Geheimnis seines Willens bekannt, gemäß seinem Wohlgefallen, das er in ihm geplant hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Christus«; andere verstehen »in ihm« rückbezüglich als »in sich selbst«.'
    reason: Der Bezug von ἐν αὐτῷ ist auslegungsbedürftig und theologisch bedeutsam; der Haupttext bewahrt die pronominale Mehrdeutigkeit.
lexical_decisions:
- source_word: γνωρίσας
  choice: indem er … bekannt machte
  rationale: Das Aoristpartizip wird durch einen deutschen Nebensatz wiedergegeben, der die enge Verbindung zum übergeordneten Satz wahrt und zugleich natürlich klingt. Der genaue zeitliche oder modale Bezug bleibt vom Kontext abhängig.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der Bekanntmachung.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Im paulinischen Sprachgebrauch bezeichnet das Wort einen zuvor verborgenen, nun bekannt gemachten göttlichen Ratschluss; „Geheimnis“ bewahrt diese Spannung.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: seines Willens
  rationale: Die Genitivverbindung wird direkt und idiomatisch wiedergegeben; „Wille“ vermeidet eine Vermischung mit dem späteren Ausdruck des Sich-Vornehmens.
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: gemäß seinem Wohlgefallen
  rationale: κατά bezeichnet hier Übereinstimmung oder Maßstab. „Wohlgefallen“ bewahrt sowohl die positive als auch die willentliche Bedeutung von εὐδοκία.
- source_word: ἣν προέθετο
  choice: das er sich … vorgenommen hatte
  rationale: Das Relativpronomen bezieht sich auf εὐδοκία. Die mediale Form wird mit „sich vorgenommen“ natürlich wiedergegeben; das Plusquamperfekt ordnet den Vorsatz vor dem Bekanntmachen ein.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Formulierung gibt das griechische Pronomen transparent wieder, ohne seinen theologisch bedeutsamen Bezug im Haupttext festzulegen.
theological_decisions:
- issue: Bezug von ἐν αὐτῷ
  choice: Der Haupttext behält die wörtliche Form „in ihm“ bei.
  alternative: „in Christus“ oder reflexiv „in sich selbst“
  rationale: Das Pronomen kann aus dem Zusammenhang auf Christus bezogen oder als Rückbezug auf Gott verstanden werden. Der Haupttext entscheidet diese Mehrdeutigkeit nicht stillschweigend; die Deutungsmöglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die partizipiale Einbindung in den langen Satz von Epheser 1 bleibt durch „indem“ erhalten. „Wohlgefallen“ ist gehobener, aber im biblisch-theologischen Zusammenhang verständlich und präzise.
