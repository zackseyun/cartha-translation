  terminology: „Geheimnis“, „Wille“ und „Wohlgefallen“ sind für den paulinischen und kirchlich-biblischen Registerbereich präzise und verständlich. „Geplant“ gibt προέθετο idiomatisch wieder, ohne die Mehrdeutigkeit von ἐν αὐτῷ aufzulösen.
