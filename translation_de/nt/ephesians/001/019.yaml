  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: de
  text: und wie überragend groß seine Kraft an uns ist, die wir glauben,[a] entsprechend dem Wirken der Macht seiner Stärke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in uns, die wir glauben“. Das Griechische hat „auf uns hin“; „in uns“ deutet die Präposition stärker als Gottes inneres Wirken in den Glaubenden.'
    reason: Alternative Deutung der Präposition εἰς und ihrer theologischen Nuance.
lexical_decisions:
- source_word: ὑπερβάλλον μέγεθος
  choice: überragende Größe
  rationale: Die Verbindung bezeichnet eine Größe, die das gewöhnliche Maß übersteigt. Die deutsche Formulierung „wie überragend groß“ gibt die Konstruktion im Zusammenhang der indirekten Frage natürlich wieder, ohne sie zum stärkeren „unermesslich“ zu steigern.
- source_word: δύναμις
  choice: Kraft
  rationale: „Kraft“ ist im Deutschen die natürliche Bezeichnung wirksamer Fähigkeit und eröffnet die Häufung verwandter Ausdrücke, ohne sie mit den folgenden Begriffen gleichzusetzen.
- source_word: εἰς ἡμᾶς
  choice: an uns
  rationale: „An uns“ bewahrt die auf Personen gerichtete beziehungsweise an ihnen wirksame Bewegung von εἰς besser als das stärker ausdeutende „in uns“ und klingt im Deutschen natürlicher als „auf uns hin“.
- source_word: τοὺς πιστεύοντας
  choice: die wir glauben
  rationale: Das substantivierte Präsenspartizip wird verbal und idiomatisch wiedergegeben. Der Relativsatz bezieht sich unmittelbar auf „uns“.
- source_word: κατά
  choice: entsprechend
  rationale: κατά bezeichnet hier Übereinstimmung oder Maßstab. „Entsprechend“ ist präzise und in der verschachtelten deutschen Satzstruktur flüssiger als „gemäß“.
- source_word: ἐνέργεια
  choice: Wirken
  rationale: Gemeint ist tätige, wirksame Betätigung. „Wirken“ vermeidet die modernen Nebenbedeutungen von „Energie“.
- source_word: κράτος
  choice: Macht
  rationale: κράτος bezeichnet hier machtvoll hervortretende Kraft. „Macht“ hält den Begriff von δύναμις („Kraft“) und ἰσχύς („Stärke“) unterscheidbar.
- source_word: ἰσχύς
  choice: Stärke
  rationale: „Stärke“ entspricht der Vorstellung vorhandener Kraft und bewahrt zusammen mit „Kraft“, „Wirken“ und „Macht“ die rhetorische Häufung des Griechischen.
- source_word: καὶ τί
  choice: und wie ... groß ... ist
  rationale: Im fortlaufenden Gebet wird die griechische Fragekonstruktion im Deutschen idiomatisch als „wie ... groß“ formuliert; „ist“ wird für einen vollständigen deutschen Satz ergänzt.
theological_decisions:
- issue: Wiedergabe der Häufung δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: Die verwandten Begriffe werden als „Kraft ... Wirken ... Macht ... Stärke“ unterschieden.
  alternative: Die Häufung zu einer Wendung wie „die volle Kraft seiner Macht“ zusammenziehen.
  rationale: Die Anhäufung nahezu synonymer Begriffe verstärkt rhetorisch die Größe und Wirksamkeit der göttlichen Kraft. Verschiedene deutsche Wörter erhalten diese Wirkung, ohne daraus ein technisches theologisches Begriffssystem zu machen.
- issue: Richtung beziehungsweise Wirkungsbereich der göttlichen Kraft in εἰς ἡμᾶς
  choice: „an uns, die wir glauben“
  alternative: „in uns, die wir glauben“ oder „für uns, die wir glauben“
  rationale: εἰς bezeichnet hier am ehesten die Ausrichtung der Kraft auf die Glaubenden. „An uns“ lässt offen, ob besonders das innere Wirken oder die Zuwendung zugunsten der Glaubenden gemeint ist; diese echte Nuance wird in einer Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Fortsetzung des langen Satzes aus Vers 18 mit „und“ angeschlossen. Die dichte paulinische Häufung der Kraftbegriffe wird bewusst erhalten; „an uns“ ist quellennah, aber im Deutschen noch natürlich.
