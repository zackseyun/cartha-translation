source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: de
  text: hoch über jede Herrschaft und Autorität und Macht und Herrschergewalt[a] und über jeden Namen, der genannt wird[b] – nicht nur in diesem Zeitalter, sondern auch im kommenden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Herrschergewalt und Vollmacht und Macht und Herrschaft“. Die griechischen Begriffe können Rangstufen oder Bereiche von Autorität bezeichnen, darunter auch kosmische oder geistliche Mächte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jeden Titel, der verliehen wird“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „nicht nur in dieser Weltzeit, sondern auch in der kommenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: hoch über
  rationale: Drückt in diesem Zusammenhang Christi überragende Stellung und Erhöhung aus; im Deutschen ist „hoch über“ natürlich und bewahrt den räumlich-rangbezogenen Bildgehalt.
- source_word: πάσης ἀρχῆς
  choice: jede Herrschaft
  rationale: ἀρχή bezeichnet hier eine Herrschaftsmacht oder einen Herrschaftsbereich. „Herrschaft“ bleibt hinsichtlich menschlicher oder geistlicher Mächte bewusst offen.
- source_word: ἐξουσίας
  choice: Autorität
  rationale: Gibt die Bedeutung von Befugnis oder ausgeübter Vollmacht wieder und bleibt von δύναμις („Macht“) unterscheidbar.
- source_word: δυνάμεως
  choice: Macht
  rationale: Eine geläufige Wiedergabe, die die Kraft beziehungsweise Machtstellung bezeichnet und die Begriffsreihe nicht unnötig auslegt.
- source_word: κυριότητος
  choice: Hoheit
  rationale: Bezeichnet Herrschaft oder Oberhoheit als Kategorie. „Hoheit“ ist würdig und vermeidet eine unmittelbare Gleichsetzung mit dem Gottestitel „Herr“.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: jeden Namen, der genannt wird
  rationale: Bewahrt die rhetorische Wiederholung des griechischen Ausdrucks und lässt offen, ob konkrete Namen, Titel oder Rangbezeichnungen gemeint sind.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: nicht nur ... sondern auch
  rationale: Entspricht der griechischen korrelativen Fügung in natürlichem modernem Deutsch.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: in diesem Zeitalter
  rationale: Bewahrt den zeitlichen Gegensatz zwischen dem gegenwärtigen und dem kommenden Zeitalter; „Welt“ wäre weniger präzise.
- source_word: ἐν τῷ μέλλοντι
  choice: im kommenden
  rationale: Im Griechischen ist „Zeitalter“ aus dem vorigen Satzglied mitzudenken. Die deutsche Ellipse ist verständlich und bildet diese Knappheit nach.
theological_decisions:
- issue: Wesen der genannten Herrschaftsmächte (ἀρχή, ἐξουσία, δύναμις, κυριότης)
  choice: Die Begriffe werden als allgemeine Kategorien von Herrschaft und Macht wiedergegeben, ohne sie im Haupttext ausdrücklich als menschliche, kosmische oder geistliche Wesen festzulegen.
  alternative: Die Reihe ausdrücklich als kosmische Mächte oder als Rangordnungen von Engelwesen bezeichnen.
  rationale: Der Zusammenhang legt kosmische oder geistliche Mächte nahe, doch die griechische Formulierung bestimmt ihr Wesen nicht ausdrücklich. Die offene Wiedergabe wahrt die Breite und Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung des griechischen Textes bleibt erhalten; zugleich werden übermäßig konfessionell geprägte Fachbegriffe vermieden. Der Gedankenstrich markiert den hervorgehobenen zeitlichen Gegensatz, ohne die Syntax inhaltlich zu verändern.
