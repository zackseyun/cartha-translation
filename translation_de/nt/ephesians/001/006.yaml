  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: de
  text: zum Lob der Herrlichkeit seiner Gnade, mit der er uns in dem Geliebten beschenkt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der er uns in dem Geliebten begnadet hat“. Das griechische Verb ist mit „Gnade“ verwandt und bezeichnet Gottes gnädiges Handeln an uns. „Der Geliebte“ meint Christus.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: zum Lob
  rationale: Die feste Wendung gibt Ziel beziehungsweise Ergebnis natürlich wieder.
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: der Herrlichkeit seiner Gnade
  rationale: Die genitivische Fügung bleibt bewusst eng am Griechischen und bewahrt die doxologische Dichte.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: mit der er uns beschenkt hat
  rationale: Das Relativpronomen wird auf „Gnade“ bezogen; „beschenkt“ vermittelt das gnädige Zuwenden idiomatisch, auch wenn die griechische Wortverwandtschaft zwischen χάρις und χαριτόω im Deutschen nicht vollständig nachgebildet werden kann.
- source_word: ἐν τῷ ἠγαπημένῳ
  choice: in dem Geliebten
  rationale: „In“ wahrt die mögliche Bedeutung von Sphäre beziehungsweise Verbundenheit; „der Geliebte“ erhält die substantivierte, christologische Titelform, ohne „Sohn“ in den Text einzufügen.
theological_decisions:
- issue: Beziehung zwischen χάρις und χαριτόω
  choice: mit der er uns … beschenkt hat
  alternative: durch die er uns begnadet hat / die er uns geschenkt hat
  rationale: „Begnadet“ bewahrt zwar den Wortstamm, kann im heutigen Deutsch jedoch vor allem an Straferlass denken lassen. „Beschenkt“ ist natürlicher und hält Gottes freies, gnädiges Handeln fest; die Wortbeziehung wird in der Fußnote erläutert.
- issue: Christologische Bedeutung von τῷ ἠγαπημένῳ
  choice: in dem Geliebten
  alternative: in seinem geliebten Sohn / in dem, den er liebt
  rationale: Der Ausdruck bezeichnet Christus, nennt an dieser Stelle aber nicht ausdrücklich den Sohn. Die Titelform erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genitivische Formulierung „Herrlichkeit seiner Gnade“ ist bewusst dicht und entspricht dem doxologischen Stil des Satzes. Der Fußnotenmarker steht nach der gesamten erklärungsbedürftigen Wendung.
