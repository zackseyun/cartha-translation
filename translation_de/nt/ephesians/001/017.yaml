source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: de
  text: dass der Gott unseres Herrn Jesus, des Messias,[a] der Vater der Herrlichkeit,[b] euch einen Geist[c] der Weisheit und der Offenbarung gebe in der Erkenntnis Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Jesus Christus“. Das griechische Χριστός bedeutet „Messias“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der herrliche Vater“. Wörtlich steht im Griechischen: „der Vater der Herrlichkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Geist der Weisheit und der Offenbarung“. Das griechische πνεῦμα kann hier einen von Gott gegebenen Geist beziehungsweise eine innere Befähigung oder den Heiligen Geist bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: dass
  rationale: Schließt als Inhalt beziehungsweise Ziel an das Gebet des vorigen Verses an und wahrt die unterordnende Funktion natürlich im Deutschen.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: der Gott unseres Herrn Jesus, des Messias
  rationale: Gibt die Genitivverbindung eng wieder. Χριστός wird als bedeutungstragender Titel mit „Messias“ übersetzt; die Apposition mit Artikel ist im Deutschen idiomatisch.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: der Vater der Herrlichkeit
  rationale: Bewahrt die Genitivform und lässt offen, ob Herrlichkeit den Vater kennzeichnet, ihm gehört oder von ihm ausgeht.
- source_word: δώῃ
  choice: gebe
  rationale: Der deutsche Konjunktiv I passt zum Inhalt eines Gebets und gibt den Aoristkonjunktiv nach ἵνα knapp wieder.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: einen Geist der Weisheit und der Offenbarung
  rationale: Die indefinite Form wahrt die mögliche Bedeutung einer von Gott geschenkten inneren Befähigung; zugleich wird die mögliche Beziehung auf den Heiligen Geist in einer Fußnote offengehalten.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: in der Erkenntnis seiner selbst
  rationale: Bleibt der Präposition ἐν und dem Erkenntnisbegriff nahe. „Seiner selbst“ bezeichnet Gott als Bezugsgegenstand, ohne die Wendung frei in einen Zweck- oder Folgesatz umzudeuten.
theological_decisions:
- issue: Bezeichnet πνεῦμα den Heiligen Geist oder einen von Gott gegebenen Geist beziehungsweise eine innere Befähigung?
  choice: einen Geist der Weisheit und der Offenbarung
  alternative: den Geist der Weisheit und der Offenbarung
  rationale: Das artikellose πνεῦμα erlaubt beide Deutungen. Der Haupttext vermeidet eine eindeutige Identifizierung; die alternative Lesart wird ausdrücklich vermerkt.
- issue: Wie ist Χριστός wiederzugeben?
  choice: Messias
  alternative: Christus
  rationale: Χριστός ist hier als Titel verständlich. „Messias“ macht dessen Bedeutung sichtbar, während die traditionelle Wiedergabe in der Fußnote erhalten bleibt.
- issue: Wie ist der Genitiv in πατὴρ τῆς δόξης zu verstehen?
  choice: Vater der Herrlichkeit
  alternative: herrlicher Vater
  rationale: Die formnahe Wendung bewahrt die Mehrdeutigkeit des Genitivs und vermeidet, ihn ausschließlich als Eigenschaft zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv „gebe“ trägt den Gebetscharakter. Die bewusst formnahe Schlusswendung „in der Erkenntnis seiner selbst“ erhält die syntaktische und theologische Offenheit des griechischen Textes, auch wenn sie gehobener klingt als „damit ihr ihn erkennt“.
