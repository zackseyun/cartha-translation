id: EPH.6.13
reference: Ephesians 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: de
  text: Darum ergreift die ganze Rüstung Gottes[a], damit ihr am bösen Tag[b] Widerstand leisten und, nachdem ihr alles vollbracht habt[c], standhalten könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vollständige Rüstung Gottes“. Das griechische Wort bezeichnet die gesamte Ausrüstung eines Soldaten.'
    reason: lexical_alternative
  - marker: b
    text: Der „böse Tag“ kann allgemein eine Zeit besonders heftiger Bedrängnis durch das Böse bezeichnen; die Wendung muss nicht ausschließlich auf ein bestimmtes endzeitliches Ereignis bezogen sein.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „nachdem ihr alles ausgeführt habt“ beziehungsweise „nachdem ihr alles getan habt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den rückbezüglichen Folgerungszusammenhang knapp und idiomatisch wieder.
- source_word: ἀναλάβετε
  choice: ergreift
  rationale: Der Aoristimperativ bezeichnet das Aufnehmen bzw. Ergreifen der Ausrüstung; „ergreift“ bewahrt das militärische Bild, ohne das Verb mit „anziehen“ zu überdeuten.
- source_word: τὴν πανοπλίαν
  choice: die ganze Rüstung
  rationale: πανοπλία bezeichnet die vollständige Ausrüstung eines Soldaten. „Die ganze Rüstung“ ist verständlich und gibt den Gedanken der Vollständigkeit wieder.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv bleibt bewusst offen und kann Zugehörigkeit, Herkunft oder Bereitstellung ausdrücken.
- source_word: ἵνα δυνηθῆτε
  choice: damit ihr … könnt
  rationale: Gibt sowohl den Zweck als auch die Befähigung natürlich wieder.
- source_word: ἀντιστῆναι
  choice: Widerstand leisten
  rationale: Bezeichnet hier das Entgegentreten und Widerstehen; die Formulierung passt zum militärischen Zusammenhang und unterscheidet sich hörbar vom abschließenden στῆναι.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: am bösen Tag
  rationale: Bewahrt die knappe, offene Bezeichnung eines von Bösem bzw. Bedrängnis geprägten Tages, ohne sie auf ein bestimmtes endzeitliches Ereignis festzulegen.
- source_word: ἅπαντα κατεργασάμενοι
  choice: nachdem ihr alles vollbracht habt
  rationale: κατεργάζομαι kann das Ausführen oder Vollenden des Geforderten bezeichnen. „Vollbracht“ bewahrt den Abschlussaspekt, ohne ausdrücklich einen Sieg zu behaupten.
- source_word: στῆναι
  choice: standhalten
  rationale: Gibt im militärischen Kontext das feste Stehen bzw. Behaupten der Stellung idiomatisch wieder.
theological_decisions:
- issue: Bedeutung des „bösen Tages“
  choice: Allgemein als eine Zeit konzentrierter böser Bedrängnis offengelassen
  alternative: Ein bestimmter endzeitlicher Tag oder ein einzelner persönlicher Prüfungstag
  rationale: Die griechische Wendung legt keine dieser zeitlichen Bestimmungen eindeutig fest.
- issue: Bedeutungsumfang des Genitivs in „Rüstung Gottes“
  choice: Mit „Gottes“ formal offen wiedergegeben
  alternative: „die Gott gehört“ oder „die Gott gibt“
  rationale: Der Genitiv kann Gottes eigene Rüstung, von Gott bereitgestellte Rüstung oder allgemein ihre Beziehung zu Gott bezeichnen; die Übersetzung entscheidet dies nicht.
- issue: Sinn von κατεργασάμενοι
  choice: „nachdem ihr alles vollbracht habt“ ohne ausdrückliche Siegesaussage
  alternative: „nachdem ihr alles getan habt“ oder „nachdem ihr alles überwunden habt“
  rationale: Das Partizip bezeichnet Ausführung oder Vollendung, verlangt aber nicht die stärker deutende Aussage, alles sei siegreich überwunden worden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das militärische Bild bleibt klar, ohne unnötig altertümliche Wörter wie „Waffenrüstung“ zu verwenden. Die beiden griechischen Verben ἀντιστῆναι und στῆναι werden mit „Widerstand leisten“ und „standhalten“ unterschieden; der abschließende Ausdruck vermittelt in natürlichem Deutsch das Behaupten der Stellung.
