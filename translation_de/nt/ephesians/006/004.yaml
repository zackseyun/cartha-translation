source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: de
  text: Und ihr Väter, reizt eure Kinder nicht zum Zorn[a], sondern zieht sie in der Erziehung und Ermahnung des Herrn[b] groß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erbittert eure Kinder nicht“. Das griechische Verb bezeichnet das Hervorrufen von Zorn oder Verbitterung.'
    reason: lexical_alternative
  - marker: b
    text: „Des Herrn“ kann bedeuten, dass Erziehung und Ermahnung vom Herrn kommen, ihm entsprechen, ihm gehören oder auf ihn ausgerichtet sind.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: Väter
  rationale: Das griechische Substantiv bezeichnet ausdrücklich Väter; eine Erweiterung zu „Eltern“ würde den unmittelbaren Adressatenkreis verallgemeinern.
- source_word: παροργίζετε
  choice: reizt ... nicht zum Zorn
  rationale: 'Die Wendung gibt die kausative Bedeutung wieder: jemanden zornig machen beziehungsweise in ihm Zorn oder Verbitterung hervorrufen.'
- source_word: τέκνα
  choice: Kinder
  rationale: „Kinder“ ist die natürliche deutsche Entsprechung für die Nachkommen innerhalb einer Familie und umfasst beide Geschlechter.
- source_word: ἐκτρέφετε
  choice: zieht ... groß
  rationale: Im Zusammenhang der Kindererziehung bedeutet das Verb nicht nur „nähren“, sondern umfassender „aufziehen“ oder „großziehen“.
- source_word: παιδείᾳ
  choice: Erziehung
  rationale: Der Ausdruck umfasst formende Anleitung, Schulung und nötigenfalls Zurechtweisung; „Erziehung“ ist im Deutschen breit genug, ohne den Aspekt der Formung auszublenden.
- source_word: νουθεσίᾳ
  choice: Ermahnung
  rationale: Das Wort bezeichnet verbale Anleitung, warnende Zurechtweisung oder eindringlichen Rat. „Ermahnung“ bewahrt den korrigierenden Charakter deutlicher als das allgemeinere „Unterweisung“.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird kompakt und mehrdeutig wiedergegeben; er kann Herkunft, Zugehörigkeit, Prägung oder Ausrichtung bezeichnen.
theological_decisions:
- issue: Adressatenkreis von πατέρες
  choice: Die Anrede wird ausdrücklich mit „Väter“ wiedergegeben.
  alternative: Eltern
  rationale: Der Ausgangstext nennt Väter. Eine mögliche weitergehende Anwendung soll nicht in die Übersetzung selbst eingetragen werden.
- issue: Bezug und Bedeutung von κυρίου
  choice: „des Herrn“ bleibt als weiter Genitiv erhalten.
  alternative: vom Herrn; nach dem Willen des Herrn; auf den Herrn ausgerichtet
  rationale: Der griechische Genitiv kann die Erziehung und Ermahnung als vom Herrn kommend, ihm zugehörig, durch ihn geprägt oder auf ihn ausgerichtet kennzeichnen. Die Übersetzung legt sich nicht unnötig auf nur eine Möglichkeit fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Reizt ... zum Zorn“ bewahrt die konkrete Zorn-Bedeutung des Verbs; „zieht ... groß“ klingt natürlich und bezeichnet den fortlaufenden Vorgang der Kindererziehung. Die beiden Genitive werden nicht konfessionell oder lehrmäßig verengt.
