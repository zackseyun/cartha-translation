source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: de
  text: Ihr Kinder, gehorcht euren Eltern im Herrn,[a] denn das ist richtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Menschen, die dem Herrn gehören“ / „in Verbundenheit mit dem Herrn“. „Im Herrn“ kann den Bereich oder die Art des Gehorsams bezeichnen und zugleich andeuten, dass dieser Gehorsam durch die Treue zum Herrn begrenzt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Kinder
  rationale: Der Vokativ Plural spricht die jüngeren Mitglieder der Hausgemeinschaft unmittelbar an. „Kinder“ gibt die familiäre Beziehung natürlich und präzise wieder.
- source_word: ὑπακούετε
  choice: gehorcht
  rationale: Der Präsensimperativ verlangt fortdauernde, hörende Folgsamkeit und nicht nur bloßes Zuhören. „Gehorcht“ trifft die Aufforderung im Rahmen der Haustafel.
- source_word: γονεῦσιν
  choice: Eltern
  rationale: Das Substantiv im Plural bezeichnet Vater und Mutter gemeinsam; „Eltern“ ist die idiomatische und genaue deutsche Entsprechung.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die knappe paulinische Wendung bleibt erhalten. Sie kann den Bereich oder die Art des Gehorsams bezeichnen und zugleich die Zugehörigkeit zum Herrn anklingen lassen.
- source_word: δίκαιον
  choice: richtig
  rationale: Das Adjektiv bezeichnet hier, was moralisch recht und angemessen ist. „Richtig“ ist im heutigen Deutsch klarer und natürlicher als „gerecht“ oder „rechtschaffen“.
theological_decisions:
- issue: Bezug und Tragweite der Wendung ἐν κυρίῳ
  choice: 'Die Wendung wird unmittelbar mit dem Gebot verbunden: „gehorcht euren Eltern im Herrn“; ihre Deutungsoffenheit bleibt bestehen.'
  alternative: „Ihr Kinder im Herrn, gehorcht euren Eltern“ oder „gehorcht euren Eltern, wie es im Herrn angemessen ist“.
  rationale: Im Griechischen steht ἐν κυρίῳ am natürlichsten beim Imperativ, doch seine genaue Nuance ist nicht ausdrücklich festgelegt. Die wörtlich-kompakte Wiedergabe vermeidet eine Entscheidung zwischen Zugehörigkeit zum Herrn, dem Bereich bzw. der Art des Gehorsams und einer durch die Treue zum Herrn gesetzten Grenze.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ihr Kinder“ macht die direkte Anrede natürlich hörbar; „im Herrn“ bewahrt bewusst die knappe paulinische Formulierung und ihre Mehrdeutigkeit.
