source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: de
  text: In jeder Lage ergreift den Schild des Glaubens, mit dem ihr alle brennenden Pfeile[a] des Bösen[b] werdet auslöschen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: »Geschosse«. Das griechische Wort bezeichnet verschiedene Arten von Wurfgeschossen.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Form kann den Bösen als persönlichen Widersacher oder das Böse bezeichnen; im Kampfbild des Zusammenhangs liegt die persönliche Deutung näher.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: Bei alledem
  rationale: Die Wendung wird im Zusammenhang der Waffenrüstung adverbial verstanden und knüpft natürlich an die zuvor genannten Ausrüstungsteile an, ohne sie auf bestimmte Lebensumstände einzuengen.
- source_word: ἀναλαβόντες
  choice: nehmt ... auf
  rationale: Das Aoristpartizip begleitet die fortlaufende Aufforderung des Abschnitts. Im Deutschen gibt der Imperativ diesen Anschluss klar und natürlich wieder.
- source_word: τὸν θυρεὸν τῆς πίστεως
  choice: den Schild des Glaubens
  rationale: θυρεός bezeichnet einen Schild, genauer einen großen Schutzschild; die geläufige Formulierung bewahrt das Bild. πίστις wird hier als Glaube beziehungsweise vertrauendes Sichverlassen auf Gott verstanden.
- source_word: ἐν ᾧ
  choice: Mit ihm
  rationale: Die Präposition bezeichnet hier das Mittel; der Rückbezug auf den Schild ist eindeutig und in dieser Form idiomatisch.
- source_word: δυνήσεσθε
  choice: werdet ihr ... können
  rationale: Die Wiedergabe bewahrt die futurische Aussage der griechischen Verbform.
- source_word: βέλη
  choice: Pfeile
  rationale: βέλη ist eine allgemeine Bezeichnung für Geschosse. Im Bild antiker Brandgeschosse ist »Pfeile« konkret, verständlich und sachlich passend; die weitere Bedeutung wird in einer Fußnote genannt.
- source_word: πεπυρωμένα
  choice: brennenden
  rationale: Das Partizip beschreibt Geschosse, die in Brand gesetzt worden sind. »Brennend« gibt das Bild in natürlichem modernem Deutsch wieder.
- source_word: τοῦ πονηροῦ
  choice: des Bösen
  rationale: Im geistlichen Kampfzusammenhang liegt die persönliche Deutung, der Böse, nahe. Die deutsche Formulierung lässt zugleich die grammatisch mögliche abstrakte Deutung anklingen; diese wird ausdrücklich in der Fußnote festgehalten.
- source_word: σβέσαι
  choice: auslöschen
  rationale: Das Verb bezeichnet das Löschen von Feuer und passt daher genau zu den brennenden Geschossen.
theological_decisions:
- issue: Personale oder abstrakte Bedeutung von τοῦ πονηροῦ
  choice: des Bösen, im Kontext vorrangig personal verstanden
  alternative: des Bösen im Sinn von »des Übels« oder »des Bösen schlechthin«
  rationale: Der Zusammenhang des geistlichen Kampfes spricht für einen persönlichen Widersacher, doch die griechische substantivierte Form kann auch abstrakt verstanden werden. Die Fußnote bewahrt diese echte Mehrdeutigkeit.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Im Bild des Schutzschildes bezeichnet πίστις am ehesten den glaubenden, vertrauenden Bezug auf Gott. »Glaube« ist zugleich die etablierte und hier ausreichend offene Wiedergabe; »Treue« ist lexikalisch möglich, im unmittelbaren Zusammenhang jedoch weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht den langen griechischen Zusammenhang verständlich, ohne die logische Verbindung zwischen Schild und Schutzwirkung aufzugeben. Militärische Bildsprache und futurische Aussage bleiben erhalten.
