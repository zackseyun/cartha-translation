  terminology: „Herr“ wahrt den im Kontext wahrscheinlichen Bezug auf den erhöhten Herrn, ohne ihn auszuformulieren. „Sklave“ ist angesichts des ausdrücklichen Kontrasts zu ἐλεύθερος sachgerecht; „freier Mensch“ ist die natürliche moderne Entsprechung. Die Fußnote zum Statusgegensatz ist inhaltlich zutreffend.
