  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: de
  text: Ihr wisst, dass jeder, was er auch Gutes tut, dies vom Herrn zurückerhalten wird[a] – ob Sklave oder freier Mensch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies wird ihm vom Herrn vergolten werden.“ Das griechische Verb kann den Empfang dessen bezeichnen, was der eigenen Handlung entspricht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: „ob Sklave oder Freier“. Gemeint ist der Gegensatz zwischen versklavtem und freiem sozialen Status.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Ihr wisst
  rationale: Das adverbiale Partizip knüpft an die vorausgehende Ermahnung an. Die finite Form ist im Deutschen natürlich, ohne die mögliche kausale Nuance ausdrücklich festzulegen.
- source_word: ἕκαστος
  choice: jeder
  rationale: 'Bewahrt die verteilende Betonung des Singulars: Es gilt für jede einzelne Person.'
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: was er auch Gutes tut
  rationale: Die Verbindung mit ἄν bezeichnet eine unbestimmte Möglichkeit; „was … auch“ gibt dieses „was immer“ idiomatisch wieder. „Gutes“ bewahrt die moralische Qualität der Handlung.
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen verweist ausdrücklich auf das zuvor genannte Gute zurück und erhält die korrespondierende Struktur des griechischen Satzes.
- source_word: κομίσεται
  choice: wird … zurückerhalten
  rationale: Das Verb kann hier den Empfang dessen bezeichnen, was einer Handlung entsprechend zurückkommt. „Zurückerhalten“ wahrt diesen Vergeltungs- beziehungsweise Entsprechungsgedanken, ohne ihn rein geschäftlich zu formulieren.
- source_word: παρὰ κυρίου
  choice: vom Herrn
  rationale: παρά mit Genitiv bezeichnet die Quelle. „Herr“ bewahrt den wahrscheinlich christologischen Bezug und unterscheidet ihn vom menschlichen Herrn im unmittelbaren sozialen Kontext.
- source_word: δοῦλος
  choice: Sklave
  rationale: Der ausdrückliche Gegensatz zu ἐλεύθερος macht den rechtlich-sozialen Status zentral. „Sklave“ gibt diese historische Realität klarer wieder als das abschwächende „Diener“.
- source_word: ἐλεύθερος
  choice: freier Mensch
  rationale: Bezeichnet im Gegensatz zum Sklaven eine sozial freie Person. „Freier Mensch“ ist im modernen Deutsch verständlich und vermeidet das heute leicht missverständliche substantivierte „Freier“.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Kontext der Haustafel
  choice: Sklave
  alternative: Diener; leibeigener Diener
  rationale: Der direkte Gegensatz zwischen versklavtem und freiem Status darf nicht abgeschwächt werden. Die Übersetzung beschreibt die damalige soziale Wirklichkeit, ohne sie theologisch zu billigen.
- issue: Bezug und Wiedergabe von κύριος
  choice: der Herr
  alternative: der Gebieter
  rationale: Obwohl der Abschnitt auch von menschlichen Herren handelt, ist hier der göttliche Geber der Vergeltung gemeint. „Der Herr“ erhält den wahrscheinlichen Bezug auf Christus, ohne ihn im Vers ausdrücklich zu ergänzen.
- issue: Art der göttlichen Vergeltung
  choice: dies … zurückerhalten
  alternative: dafür belohnt werden; dies vergolten bekommen
  rationale: Die Formulierung bewahrt die Aussage einer entsprechenden Rückgabe durch den Herrn, legt aber weder eine bestimmte Lohnlehre noch eine rein kommerzielle Vergütung in den Text hinein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Aussage „jeder“ und die rückverweisende Form „dies“ erhalten die markante griechische Satzstruktur, während „freier Mensch“ heutige Missverständnisse vermeidet.
