  source_fidelity: 'Der Vers gibt die wesentlichen griechischen Elemente zuverlässig wieder: εἰδότες als einleitende Wissensbegründung, die distributive Betonung von ἕκαστος, die indefinite Relativkonstruktion („was ... auch“), die Rückverweisung durch „dies“, die Herkunft „vom Herrn“ sowie den sozialen Gegensatz „Sklave oder freier Mensch“. „Zurückerhalten“ gibt den bei κομίσεται möglichen Gedanken einer entsprechenden Rückgabe angemessen wieder, auch wenn es im Deutschen leicht eine vorherige eigene Inhaberschaft nahelegen kann.'
