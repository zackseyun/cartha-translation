id: EPH.6.17
reference: Ephesians 6:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: de
  text: Und nehmt den Helm des Heils[a] und das Schwert des Geistes, das Gottes Wort[b] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „empfangt den Helm des Heils“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gottes Ausspruch“; das griechische Wort kann besonders ein gesprochenes Wort oder eine verkündete Botschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: nehmt
  rationale: Der Aoristimperativ in der 2. Person Plural bezeichnet hier das Entgegennehmen bzw. Aufnehmen der bereitgestellten Rüstung. „Nehmt“ ist im Deutschen in diesem Bild natürlich und kann sowohl das Empfangen als auch das Ergreifen ausdrücken.
- source_word: περικεφαλαίαν
  choice: Helm
  rationale: Direkte und geläufige Bezeichnung für den militärischen Kopfschutz im Bild der Rüstung.
- source_word: τοῦ σωτηρίου
  choice: des Heils
  rationale: Die traditionelle, prägnante Wiedergabe bewahrt den theologischen Gehalt und legt die genaue Beziehung des Genitivs nicht unnötig fest.
- source_word: μάχαιραν
  choice: Schwert
  rationale: Natürliche deutsche Entsprechung für die bezeichnete Klingenwaffe; „Kurzschwert“ wäre denkbar, würde den Haupttext aber unnötig spezifizieren.
- source_word: τοῦ πνεύματος
  choice: des Geistes
  rationale: Im paulinischen Zusammenhang ist der Heilige Geist der wahrscheinlichste Bezug. Die Formulierung lässt zugleich offen, ob das Schwert dem Geist gehört, von ihm gegeben oder durch ihn wirksam ist.
- source_word: ὅ ἐστιν
  choice: das ... ist
  rationale: Das sächliche Relativpronomen wird natürlich auf „Schwert“ bezogen und führt dessen Erklärung ein.
- source_word: ῥῆμα θεοῦ
  choice: Gottes Wort
  rationale: „Wort“ ist verständlich und theologisch vertraut; eine Fußnote weist darauf hin, dass ῥῆμα besonders ein gesprochenes Wort, einen Ausspruch oder eine Botschaft bezeichnen kann.
theological_decisions:
- issue: Bezug von „Geist“
  choice: Heiliger Geist
  alternative: menschlicher Geist oder allgemein geistliche Wirklichkeit
  rationale: Der Kontext von Gottes Rüstung und die anschließende Gleichsetzung mit Gottes Wort sprechen am stärksten für den Heiligen Geist. Die Großschreibung entspricht dem deutschen Gebrauch, ohne die Art der Genitivbeziehung festzulegen.
- issue: Beziehung zwischen Schwert und Gottes Wort
  choice: Das Relativpronomen erklärt das Schwert als Gottes Wort
  alternative: Bezug auf den Geist
  rationale: Das griechische ὅ ist sächlich und stimmt daher mit μάχαιραν („Schwert“, im Griechischen sächlich) dem Sinn nach erklärend überein, nicht mit πνεύματος als nächstem möglichen Bezugswort. Im Deutschen wird dies mit „das“ eindeutig wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute Rüstungsmetapher bleibt knapp erhalten. „Heil“ wahrt den biblisch-theologischen Klang, während die Fußnoten echte lexikalische Alternativen sichtbar machen.
