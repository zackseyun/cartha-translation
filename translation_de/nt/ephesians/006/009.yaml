reference: Ephesians 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: de
  text: Und ihr Herren, behandelt sie ebenso und hört auf, ihnen zu drohen. Denn ihr wisst, dass ihr Herr und euer Herr im Himmel ist und dass es bei ihm keine Parteilichkeit gibt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριοι
  choice: Herren
  rationale: Im Zusammenhang der antiken Hausordnung bezeichnet das Wort die Herren der zuvor angesprochenen Sklaven. „Herren“ bewahrt außerdem die bewusste Wiederaufnahme desselben griechischen Wortes für den himmlischen Herrn.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: handelt ihnen gegenüber ebenso
  rationale: Die Formulierung erhält den Rückbezug auf die vorherigen Weisungen und betont die Gegenseitigkeit, klingt dabei im modernen Deutschen natürlicher als eine streng wörtliche Wiedergabe.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: Hört auf, ihnen zu drohen
  rationale: Das Partizip bezeichnet hier das Aufgeben beziehungsweise Einstellen des Drohens. Ein eigener deutscher Imperativ gibt die enge Verbindung mit der vorausgehenden Aufforderung klar und natürlich wieder.
- source_word: εἰδότες
  choice: Ihr wisst ja
  rationale: Das griechische Partizip nennt den Grund für die Aufforderung. „Ihr wisst ja“ bewahrt diesen begründenden Zusammenhang in natürlichem Deutsch.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: ihr Herr und euer Herr
  rationale: Die parallele Form wahrt die ausdrückliche Zuordnung zu beiden Gruppen und macht deutlich, dass die irdischen Herren selbst unter demselben himmlischen Herrn stehen.
- source_word: ἐν οὐρανοῖς
  choice: im Himmel
  rationale: Der griechische Plural wird nach üblichem deutschen Sprachgebrauch idiomatisch mit dem Singular „im Himmel“ wiedergegeben.
- source_word: προσωπολημψία
  choice: Ansehen der Person
  rationale: Die feste Wendung bezeichnet Bevorzugung oder Benachteiligung aufgrund des gesellschaftlichen Status und passt besonders zum Kontrast zwischen Herren und Sklaven.
- source_word: παρ’ αὐτῷ
  choice: bei ihm
  rationale: „Bei ihm“ gibt die idiomatische Aussage wieder, dass Parteilichkeit in Gottes Urteil und Handeln keinen Platz hat.
theological_decisions:
- issue: Wiedergabe von κύριος für menschliche und göttliche Bezugspersonen im selben Vers
  choice: Beide Vorkommen mit „Herr/Herren“ wiedergeben
  alternative: Das menschliche Vorkommen mit „Herren“, das göttliche mit „Gebieter“ oder „Herr“ in abweichender Form wiedergeben
  rationale: Das Griechische verwendet bewusst dasselbe Wort und stellt so die irdischen Herren unter den himmlischen Herrn. Die deutsche Wiederholung bewahrt diesen rhetorischen und theologischen Zusammenhang.
- issue: Bezeichnung der antiken sozialen Beziehung
  choice: „Herren“ im Zusammenhang mit den zuvor angesprochenen Sklaven
  alternative: „Arbeitgeber“ oder „Besitzer“
  rationale: „Arbeitgeber“ wäre anachronistisch und würde die antike Unfreiheit abschwächen; „Besitzer“ wäre enger als die hier bezeichnete soziale Rolle. „Herren“ hält den historischen Kontext offen und präzise.
- issue: Gottes Unparteilichkeit gegenüber sozialem Rang
  choice: „kein Ansehen der Person“
  alternative: „keine Parteilichkeit“ oder „keine Bevorzugung“
  rationale: Die gewählte Wendung macht deutlich, dass Gott sein Urteil nicht am Rang einer Person ausrichtet, ohne die Aussage auf bloße persönliche Sympathie zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die klaren Hauptsätze machen die ethische Forderung verständlich; die Wiederholung von „Herr“ bewahrt den Wortklang und die Spannung des griechischen Textes.
