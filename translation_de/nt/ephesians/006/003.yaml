  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: de
  text: damit es dir gut geht und du lange auf der Erde lebst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Land«; damit würde der Wortlaut des fünften Gebots in 2. Mose 20,12 und 5. Mose 5,16 anklingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die Folge der mit dem Gebot verbundenen Verheißung ein und ist im Deutschen natürlich.
- source_word: εὖ σοι γένηται
  choice: es dir gut geht
  rationale: Gibt die griechische Wendung idiomatisch und zugleich eng am Sinn wieder.
- source_word: καὶ
  choice: und
  rationale: Verbindet schlicht die beiden verheißenen Folgen.
- source_word: ἔσῃ μακροχρόνιος
  choice: du lange … lebst
  rationale: Das prädikative Adjektiv μακροχρόνιος bedeutet »langlebig«; die verbale deutsche Formulierung ist natürlicher.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Entspricht dem tatsächlich vorliegenden griechischen Wortlaut und bewahrt dessen möglichen weiteren Geltungsbereich; der Anklang an das Land der Gebotsverheißung wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bedeutungsumfang von ἐπὶ τῆς γῆς im Verhältnis zur Verheißung des fünften Gebots
  choice: auf der Erde
  alternative: im Land
  rationale: Die Übersetzung folgt dem griechischen Text des Epheserbriefs, ohne die spezifischere Bundesland-Formulierung aus Exodus oder Deuteronomium einzutragen. Die mögliche Anspielung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches und würdiges Standarddeutsch. Der Satz setzt Vers 2 syntaktisch fort; daher beginnt er mit »damit« und bleibt kleingeschrieben.
