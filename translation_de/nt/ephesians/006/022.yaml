source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: de
  text: 'Ihn habe ich genau zu diesem Zweck zu euch gesandt: damit ihr erfahrt, wie es um uns steht,[a] und damit er eure Herzen ermutigt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was uns betrifft“; oder: „wie unsere Umstände sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: Ihn
  rationale: Das Akkusativpronomen bezieht sich auf Tychikus im vorhergehenden Vers. Im Deutschen ist die Wiederaufnahme mit „Ihn“ natürlich und eindeutig.
- source_word: ἔπεμψα
  choice: habe ich ... gesandt
  rationale: Das Perfekt gibt den aus Sicht der Empfänger bereits vollzogenen Sendungsakt im modernen Deutsch idiomatisch wieder; „gesandt“ wahrt den würdigen Briefstil.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: πρός mit Akkusativ bezeichnet bei einem Verb des Sendens die Bewegung zu Personen hin.
- source_word: εἰς αὐτὸ τοῦτο
  choice: genau zu diesem Zweck
  rationale: „genau“ bewahrt die Hervorhebung durch αὐτό, während „zu diesem Zweck“ die finale Bedeutung natürlich ausdrückt.
- source_word: ἵνα
  choice: damit
  rationale: „damit“ leitet im Deutschen klar und idiomatisch den Zweck ein.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: ihr erfahrt, wie es um uns steht
  rationale: Die Wendung bezeichnet die Angelegenheiten beziehungsweise die Lage von Paulus und seinen Begleitern. Die Formulierung ist natürlich und lässt persönliche Verfassung und äußere Umstände eingeschlossen.
- source_word: καὶ
  choice: und damit
  rationale: Die Wiederholung von „damit“ macht deutlich, dass auch der zweite Teilsatz vom Zweckgedanken abhängt.
- source_word: παρακαλέσῃ
  choice: er ... ermutigt
  rationale: παρακαλέω kann ermutigen, trösten oder ermahnen bedeuten. In Verbindung mit den Herzen und im Kontext stärkender Nachricht ist „ermutigt“ die passende, ohne unnötige Verengung verständliche Wiedergabe.
- source_word: τὰς καρδίας ὑμῶν
  choice: eure Herzen
  rationale: Die wörtliche biblische Ausdrucksweise ist auch im modernen Deutsch verständlich und bewahrt den Bezug auf das innere Denken, Fühlen und Wollen.
theological_decisions:
- issue: Bedeutungsumfang von τὰ περὶ ἡμῶν
  choice: „wie es um uns steht“
  alternative: „was uns betrifft“ oder „unsere Umstände“
  rationale: Der griechische Ausdruck umfasst sowohl die persönliche Lage als auch die näheren Umstände. „Wie es um uns steht“ bewahrt diese Breite, ohne nur äußere Verhältnisse zu meinen.
- issue: Bedeutungsumfang von παρακαλέω
  choice: „ermutigt“
  alternative: „tröstet“ oder „ermahnt“
  rationale: Der unmittelbare Zusammenhang legt stärkenden Zuspruch nahe. „Ermutigt“ lässt den pastoralen Charakter erkennen, ohne eine spezifische konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Briefstil. Die Voranstellung „Ihn“ hält den Rückbezug auf Tychikus deutlich; der Doppelpunkt gliedert die beiden parallelen Zweckangaben.
