  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: de
  text: 'und auch für mich: dass mir, wenn ich meinen Mund öffne, Worte gegeben werden,[a] um das Geheimnis des Evangeliums freimütig bekannt zu machen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass mir beim Öffnen meines Mundes ein Wort gegeben werde“; auch möglich: „eine Botschaft“ oder „eine Äußerung“.'
    reason: lexical_alternative
  - marker: b
    text: „Freimütig“ kann hier auch mit „offen und mutig“ oder „unerschrocken“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: auch für mich
  rationale: Im fortlaufenden Gebetsaufruf bedeutet ὑπέρ mit Genitiv, dass die Gemeinde auch für Paulus beten soll. „Auch für mich“ ist im Deutschen knapp und natürlich.
- source_word: δοθῇ λόγος
  choice: mir … die richtigen Worte gegeben werden
  rationale: Der Singular λόγος bezeichnet hier die zum Reden gegebene Äußerung bzw. Botschaft. Die idiomatische deutsche Wendung bewahrt den Gedanken, dass Paulus die passenden Worte von Gott empfängt, ohne λόγος als christologischen Titel misszuverstehen.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: wenn ich den Mund öffne
  rationale: Die Formulierung hält das Bild des griechischen Ausdrucks fest und klingt zugleich in modernem Deutsch natürlich.
- source_word: ἐν παρρησίᾳ
  choice: freimütig
  rationale: παρρησία verbindet Offenheit, Unerschrockenheit und öffentliches, rückhaltloses Reden. „Freimütig“ gibt diese Spannweite besser wieder als bloß subjektives „selbstbewusst“.
- source_word: γνωρίσαι
  choice: bekannt mache
  rationale: Das Verb bedeutet unmittelbar „bekannt machen“; diese Wiedergabe vermeidet eine unnötige Verengung auf einen bestimmten Verkündigungsmodus.
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: das Geheimnis des Evangeliums
  rationale: „Geheimnis“ bezeichnet hier Gottes zuvor verborgenen und nun bekannt gemachten Heilsplan, nicht ein unlösbares Rätsel. „Evangelium“ ist im modernen kirchlichen und allgemeinen Deutsch verständlich und entspricht der theologischen Dichte von εὐαγγέλιον.
theological_decisions:
- issue: Sinn von λόγος in der Gebetsbitte
  choice: „die richtigen Worte“ als von Gott gewährte Befähigung zum Reden
  alternative: „eine Botschaft“ oder „das Wort“
  rationale: Der Text kann sowohl die sprachliche Äußerung als auch ihren Inhalt meinen. Die gewählte Formulierung ist idiomatisch, vermeidet die mögliche Fehldeutung von „das Wort“ als festem Titel und behauptet keine besondere Inspirationslehre.
- issue: Bedeutung von παρρησία
  choice: „freimütig“
  alternative: „mutig“, „offen“ oder „mit Zuversicht“
  rationale: Die Wiedergabe bewahrt den Gedanken offenen und unerschrockenen öffentlichen Redens, ohne ihn auf inneres Selbstvertrauen zu reduzieren.
- issue: Bezug des Genitivs τοῦ εὐαγγελίου
  choice: „das Geheimnis des Evangeliums“
  alternative: „das Geheimnis, nämlich das Evangelium“
  rationale: 'Der Genitiv bleibt bewusst formal offen: Das Geheimnis kann als Inhalt, Bestandteil oder näher bestimmter Gegenstand des Evangeliums verstanden werden. Eine erklärende Gleichsetzung würde diese Mehrdeutigkeit unnötig auflösen.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Betet darum“ ergänzt die im vorigen Vers stehende und im Griechischen hier nur weitergeführte Gebetsaufforderung, damit der Einzelvers auf Deutsch verständlich bleibt. Die Bildsprache vom Öffnen des Mundes und der theologisch geprägte Ausdruck „Geheimnis des Evangeliums“ bleiben erhalten.
