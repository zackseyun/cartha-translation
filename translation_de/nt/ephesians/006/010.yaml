review_pass:
  verdict: approve
  source_fidelity: „Schließlich“ gibt Τοῦ λοιποῦ als abschließenden Übergangsmarker angemessen wieder. „Lasst euch … stärken“ wahrt die rezeptive/passive Nuance von ἐνδυναμοῦσθε, ohne einen bestimmten Urhebermechanismus einzutragen. „Im Herrn“ lässt die offene relationale bzw. sphärische Funktion von ἐν bestehen. Die abgestufte Wiedergabe von κράτος und ἰσχύς als „Macht“ und „Kraft“ bildet die griechische Begriffshäufung sachgerecht ab.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und trotz der absichtlich gewichtigen Formel „in der Macht seiner Kraft“ gut verständlich. Der Doppelpunkt nach „Schließlich“ ist stilistisch möglich und unterstützt den Übergang zur Ermahnung.
  terminology: „Herr“ ist für κύριος im paulinischen Kontext passend. „Macht seiner Kraft“ ist eine vertretbare, source-nahe Differenzierung der beiden Kraftbegriffe und vermeidet eine unnötige dogmatische Ausdeutung.
