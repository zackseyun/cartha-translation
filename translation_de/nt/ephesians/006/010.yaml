  text: ⸂Τοῦ λοιποῦ⸃ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: de
  text: 'Schließlich: Lasst euch im Herrn und in der Macht seiner Kraft stärken.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid stark im Herrn und in der Macht seiner Kraft.“ Das griechische Verb kann idiomatischer so wiedergegeben werden; „Lasst euch stärken“ hebt jedoch seine passive beziehungsweise rezeptive Nuance deutlicher hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Schließlich
  rationale: Die Wendung leitet den abschließenden Hauptteil des Briefes ein. „Schließlich“ gibt diese Übergangsfunktion im modernen Deutsch knapp und natürlich wieder; „Von nun an“ bleibt als mögliche zeitliche Deutung denkbar, ist hier aber weniger wahrscheinlich.
- source_word: ἐνδυναμοῦσθε
  choice: Lasst euch … stärken
  rationale: Der präsentische Imperativ in passiver beziehungsweise medialer Form fordert die Adressaten dazu auf, Stärke zu empfangen. „Lasst euch stärken“ bewahrt diesen rezeptiven Zug deutlicher als das idiomatischere „Seid stark“.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: „Im Herrn“ erhält die paulinische Sprache von Beziehung und Lebensbereich, ohne das griechische ἐν einseitig als Mittel oder Urheber festzulegen.
- source_word: κράτει
  choice: Macht
  rationale: κράτος bezeichnet wirksame, sich erweisende Stärke. „Macht“ unterscheidet den Ausdruck im Deutschen von ἰσχύς und bewahrt die Häufung der Kraftbegriffe.
- source_word: ἰσχύος
  choice: Kraft
  rationale: ἰσχύς bezeichnet Stärke oder Kraft. Die Formulierung „Macht seiner Kraft“ ist bewusst gewichtig und spiegelt die verdichtete griechische Verbindung zweier nah verwandter Begriffe.
- source_word: αὐτοῦ
  choice: seiner
  rationale: Das Pronomen bezieht sich natürlich auf den Herrn. Das Possessivpronomen ist knapp und eindeutig.
theological_decisions:
- issue: Stimme und Ursprung der Stärkung in ἐνδυναμοῦσθε
  choice: 'Die Aufforderung wird rezeptiv wiedergegeben: „Lasst euch … stärken“.'
  alternative: „Seid stark“ beziehungsweise „Werdet stark“.
  rationale: Die gewählte Fassung unterstreicht, dass die Angesprochenen die Stärke nicht lediglich aus eigener Entschlossenheit hervorbringen. Zugleich legt sie nicht genauer fest, wie die Stärkung geschieht.
- issue: Bedeutung von ἐν in ἐν κυρίῳ
  choice: „im Herrn“
  alternative: „durch den Herrn“ oder „in Gemeinschaft mit dem Herrn“
  rationale: Die wörtlich-nahe Fassung bewahrt die mögliche relationale und sphärische Bedeutung. „Durch“ würde Instrumentalität festlegen, während „in Gemeinschaft mit“ eine zutreffende mögliche Erklärung bereits in den Text eintragen würde.
- issue: Wiedergabe von κύριος
  choice: „Herr“
  alternative: „Gebieter“
  rationale: „Herr“ ist in diesem paulinischen Zusammenhang die natürliche und theologisch offene Wiedergabe und verweist ohne erklärenden Zusatz auf Jesus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich gewichtige Wendung „in der Macht seiner Kraft“ wurde beibehalten, weil sie die bewusste Häufung zweier griechischer Kraftbegriffe wiedergibt. Der Satz bleibt knapp und exhortativ.
