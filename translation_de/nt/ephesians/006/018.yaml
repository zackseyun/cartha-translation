source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: de
  text: Betet zu jeder Zeit im Geist[a] mit allen Arten von Gebet und Flehen. Seid dazu mit aller Beharrlichkeit und allem Flehen für alle Heiligen[b] wachsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im allgemeineren Sinn: „im Geist“, also geistlich bzw. aus dem eigenen Geist heraus. Im Zusammenhang ist aber wahrscheinlich der Heilige Geist gemeint.'
    reason: alternative_reading
  - marker: b
    text: Mit den „Heiligen“ sind hier alle gemeint, die als Gottes heiliges Volk zu ihm gehören, also alle Glaubenden.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: mit allem Gebet und Flehen
  rationale: διά mit dem Genitiv bezeichnet hier das Mittel. „Mit“ ist im Deutschen natürlich; „Gebet“ gibt den allgemeinen Begriff προσευχή wieder, während „Flehen“ die konkrete, dringliche Bitte von δέησις erkennen lässt. Das umfassende πάσης bleibt durch „allem“ erhalten, ohne ausdrücklich „jede Art“ in den Text einzutragen.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: Betet … zu jeder Zeit
  rationale: Der präsentische Partizipialausdruck setzt die vorausgehende Aufforderung fort. Ein deutscher Imperativ ist hier klarer als eine schwerfällige Partizipialkonstruktion; „zu jeder Zeit“ bewahrt die umfassende Bedeutung von παντί.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Im Kontext von Epheser 6 und besonders nach „dem Schwert des Geistes“ ist der Heilige Geist wahrscheinlich gemeint. Die Großschreibung macht diese Hauptlesart kenntlich; die mögliche allgemeinere Lesart wird in einer Fußnote bewahrt.
- source_word: εἰς αὐτό
  choice: dazu
  rationale: Der Ausdruck verweist auf das eben genannte Ziel oder Anliegen. „Dazu“ ist im modernen Deutschen knapp und idiomatisch und vermeidet eine übermäßig wörtliche Formulierung.
- source_word: ἀγρυπνοῦντες
  choice: Wacht
  rationale: Das Verb bezeichnet wache, anhaltende Aufmerksamkeit. „Wacht“ bewahrt das Bild der Wachsamkeit und führt die Aufforderung in natürlichem Deutsch fort.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: mit aller Beharrlichkeit und mit Flehen
  rationale: Die koordinierte Formulierung wird sichtbar erhalten. „Beharrlichkeit“ bezeichnet ausdauerndes Festhalten; das wiederholte „mit“ sorgt im Deutschen dafür, dass auch δέησις klar auf die Wachsamkeit bezogen bleibt, ohne zwingend eine Hendiadys festzulegen.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: für alle Heiligen
  rationale: ἅγιοι bezeichnet bei Paulus die Gesamtheit der zu Gott gehörenden Gläubigen. „Heilige“ ist lexikalisch nah und kirchlich vertraut; eine Fußnote verhindert das Missverständnis einer später eingeschränkten Kategorie besonders verehrter Personen.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: der Heilige Geist („im Geist“)
  alternative: der menschliche Geist oder eine allgemein geistliche Weise („im Geist“/„im eigenen Geist“)
  rationale: Der unmittelbare und weitere paulinische Kontext spricht wahrscheinlich für den Heiligen Geist. Da der griechische Ausdruck ohne Artikel steht und die allgemeinere Deutung grammatisch möglich bleibt, wird diese Spannung in einer Fußnote offengelegt.
- issue: Bedeutung von ἅγιοι
  choice: alle Glaubenden als Gottes heiliges Volk
  alternative: eine später kirchlich abgegrenzte Gruppe kanonisierter Heiliger
  rationale: Im paulinischen Sprachgebrauch bezeichnet der Ausdruck die ganze Gemeinschaft der Glaubenden, nicht nur eine besondere, später anerkannte Gruppe.
- issue: Verhältnis von προσκαρτέρησις und δέησις
  choice: 'zwei koordinierte, eng verbundene Größen: Beharrlichkeit und Flehen'
  alternative: 'Hendiadys: beharrliches Flehen bzw. Beharrlichkeit im Flehen'
  rationale: Das καί verbindet beide Substantive ausdrücklich. Die Übersetzung bewahrt diese Koordination und lässt zugleich ihre enge sachliche Verbindung erkennen, statt die mögliche Hendiadys zur einzig möglichen Deutung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer übertragbare griechische Partizipialkonstruktion wird in zwei klare Aufforderungen aufgelöst. „Gebet und Flehen“, „Beharrlichkeit“ und „Heilige“ halten den biblisch-theologischen Wortschatz aufrecht, bleiben aber für heutige Leser verständlich.
