  text: τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: de
  text: »Ehre deinen Vater und deine Mutter« – das ist das erste Gebot mit einer Verheißung:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »das erste Gebot in Verheißung«; gemeint ist wahrscheinlich das erste Gebot, das von einer Verheißung begleitet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: Ehre
  rationale: Der Imperativ fordert tätige Ehrung, nicht nur ein inneres Gefühl von Achtung. „Ehre“ ist prägnant und bewahrt den Anklang an das Gebot im Dekalog.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: deinen Vater und deine Mutter
  rationale: Natürliche und genaue Wiedergabe der unmittelbaren familiären Bezeichnungen; das nur beim ersten Glied ausdrücklich stehende σου gilt sinngemäß für beide.
- source_word: ἥτις ἐστὶν
  choice: das ist
  rationale: Das Relativpronomen greift das soeben angeführte Gebot auf. Im Deutschen leitet „das ist“ den erläuternden Einschub klar und natürlich ein.
- source_word: ἐντολὴ
  choice: Gebot
  rationale: „Gebot“ ist im Deutschen die etablierte Bezeichnung für ein Gebot des Dekalogs und bewahrt den biblischen Bezug.
- source_word: πρώτη
  choice: das erste
  rationale: Das Adjektiv ist hier ordinal zu verstehen; die Übersetzung lässt die genaue Reichweite von „erste“ im Haupttext bestehen.
- source_word: ἐν ἐπαγγελίᾳ
  choice: mit einer Verheißung
  rationale: Wörtlich steht „in Verheißung“. Die idiomatische deutsche Formulierung bezeichnet ein Gebot, das von einer Verheißung begleitet wird, ohne den Gedanken unnötig auszubauen.
theological_decisions:
- issue: Bezug und Bedeutung von „erstes Gebot“
  choice: „das erste Gebot mit einer Verheißung“
  alternative: „das erste Gebot in Verheißung“; „das erste Gebot der zweiten Tafel“; „das wichtigste Gebot mit einer Verheißung“
  rationale: Die gewählte Form wahrt die ordinale Bedeutung von πρώτη und gibt ἐν ἐπαγγελίᾳ idiomatisch wieder. Sie legt weder eine bestimmte konfessionelle Zählung des Dekalogs zugrunde noch deutet sie „erste“ unbegründet als „wichtigste“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anführungszeichen kennzeichnen das angeführte Gebot; der Gedankenstrich hebt den erläuternden Nachsatz ab. Der Doppelpunkt hält den syntaktischen Anschluss an Vers 3 offen.
