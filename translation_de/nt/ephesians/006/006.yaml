  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: de
  text: nicht mit Augendienst[a], um Menschen zu gefallen, sondern als Sklaven des Messias[b], die Gottes Willen aus ganzer Seele[c] tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet wörtlich „Augendienst“, also einen Dienst, der nur oder besonders dann geleistet wird, wenn jemand zusieht.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“. Das griechische Christos bedeutet „Gesalbter“ und entspricht dem Titel „Messias“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „aus der Seele“; sinngemäß auch: „von Herzen“ oder „mit ganzer Hingabe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: Augendienst
  rationale: Das seltene Kompositum bezeichnet einen Dienst, der auf den beobachtenden Blick ausgerichtet ist. „Augendienst“ bewahrt das prägnante griechische Bild; eine Fußnote erläutert den Sinn.
- source_word: ἀνθρωπάρεσκοι
  choice: Menschengefällige
  rationale: Die Bezeichnung meint Menschen, die auf menschliche Anerkennung aus sind. „Menschengefällige“ ist knapp, wertend und bildet den Gegensatz zu den Sklaven des Messias nach.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Im unmittelbaren Zusammenhang werden tatsächlich versklavte Menschen angesprochen; zugleich wird ihre Zugehörigkeit zum Messias hervorgehoben. „Sklaven“ erhält diese zugespitzte rhetorische Verbindung.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet den Gesalbten. „Messias“ macht den Titelgehalt im Deutschen sichtbar, während die traditionelle Wiedergabe „Christus“ in der Fußnote genannt wird.
- source_word: ποιοῦντες
  choice: die … tun
  rationale: Das Partizip wird als deutscher Relativsatz wiedergegeben, der die Sklaven des Messias näher bestimmt und die gleichzeitige Handlung natürlich ausdrückt.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: Gottes Willen
  rationale: Die übliche deutsche Wendung gibt prägnant wieder, was Gott getan wissen will.
- source_word: ἐκ ψυχῆς
  choice: aus ganzer Seele
  rationale: Die Formulierung erhält ψυχή als „Seele“ und bringt zugleich idiomatisch die innere Aufrichtigkeit und volle Hingabe zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im Kontext der Haustafel
  choice: Sklaven des Messias
  alternative: Diener des Messias
  rationale: Da der Abschnitt versklavte Menschen anspricht und ihre irdische Gebundenheit ihrer Zugehörigkeit zum Messias gegenüberstellt, darf die Härte und Besitzdimension von δοῦλοι nicht abgeschwächt werden.
- issue: Titelgehalt von Χριστοῦ
  choice: des Messias
  alternative: Christi / von Christus
  rationale: „Messias“ übersetzt den Titel „Gesalbter“, ohne ihn bloß wie einen Eigennamen erscheinen zu lassen; die geläufige traditionelle Form bleibt als Alternative vermerkt.
- issue: Anthropologische Bildsprache in ἐκ ψυχῆς
  choice: aus ganzer Seele
  alternative: von Herzen / mit ganzem Herzen
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Bezug auf ψυχή, ohne daraus eine technische Lehre über die menschliche Seele abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängiger Versabschnitt formuliert, entsprechend dem griechischen Anschluss an den vorhergehenden Imperativ. Die markanten Ausdrücke „Augendienst“, „Menschengefällige“ und „Sklaven“ erhalten die zugespitzte Rhetorik des Ausgangstextes; Fußnoten sichern die Verständlichkeit und benennen geläufige Alternativen.
