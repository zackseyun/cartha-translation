  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: de
  text: Friede sei den Brüdern[a] und Liebe mit Glauben[b] von Gott, dem Vater, und dem Herrn Jesus, dem Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Brüdern und Schwestern“ beziehungsweise „den Geschwistern“. Im Griechischen steht die maskuline Pluralform „Brüder“, die die ganze Glaubensgemeinschaft ansprechen kann.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mit Treue“ oder „mit Vertrauen“. Das griechische Wort kann diese Bedeutungen tragen; hier ist „Glaube“ die naheliegende Wiedergabe.'
    reason: lexical_alternative
  - marker: c
    text: 'Griechisch: „Jesus Christus“. „Messias“ gibt hier die Bedeutung des Titels Χριστός wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Friede sei
  rationale: Das alleinstehende Substantiv bildet eine elliptische Segensformel. Im Deutschen macht „sei“ den Wunsch natürlich verständlich, ohne den Aussagegehalt zu erweitern.
- source_word: τοῖς ἀδελφοῖς
  choice: den Brüdern
  rationale: ἀδελφοῖς ist ein maskuliner Plural und bezeichnet im paulinischen Sprachgebrauch häufig die gesamte Glaubensgemeinschaft. Die quellennähere Form steht im Haupttext; der inklusive Sinn wird in der Fußnote genannt.
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die übliche und kontextuell klare Wiedergabe von ἀγάπη.
- source_word: μετὰ πίστεως
  choice: mit Glauben
  rationale: μετά mit dem Genitiv bezeichnet Begleitung; πίστις wird hier in seinem üblichen Sinn als „Glaube“ wiedergegeben, ohne mögliche Nuancen wie Vertrauen oder Treue auszuschließen.
- source_word: ἀπὸ
  choice: von
  rationale: Die Präposition bezeichnet hier den Ursprung des zugesprochenen Friedens und der Liebe mit Glauben.
- source_word: θεοῦ πατρὸς
  choice: Gott, dem Vater
  rationale: Der griechische Text hat kein Possessivpronomen wie „unser“. Die Apposition „dem Vater“ bildet die Wortfolge präzise und idiomatisch ab.
- source_word: κυρίου
  choice: dem Herrn
  rationale: „Herr“ ist die etablierte Wiedergabe von κύριος als Würdebezeichnung Jesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: Ἰησοῦ ist der Name; Χριστοῦ trägt die Bedeutung des Titels „Messias“. Die deutsche Apposition macht den Titel verständlich und fügt sich in die von ἀπό abhängige Dativkonstruktion ein.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Schlusssegnung
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός ist seinem Ursprung und Sinn nach ein Titel. „Messias“ gibt diesen Bedeutungsgehalt wieder; die geläufige Form „Christus“ wird in der Fußnote als formale Alternative genannt.
- issue: Geschlecht und Umfang der Anrede ἀδελφοῖς
  choice: den Brüdern
  alternative: den Brüdern und Schwestern; den Geschwistern
  rationale: Die grammatisch maskuline Form bleibt im Haupttext sichtbar. Da sie im Kontext die gesamte Gemeinde einschließen kann, wird dieser mögliche Umfang ausdrücklich in einer Fußnote erläutert.
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Treue; Vertrauen
  rationale: „Glaube“ ist in diesem Kontext die naheliegende Standardbedeutung. Das Bedeutungsspektrum des griechischen Wortes erlaubt jedoch auch „Treue“ oder „Vertrauen“, was die Fußnote offenhält.
translation_notes:
  register: Moderne, würdige Segenssprache. „Friede sei“ entfaltet die im Griechischen elliptische Wunschformel idiomatisch. Die Appositionen „Gott, dem Vater“ und „Jesus, dem Messias“ bewahren die Beziehungen der Titel, ohne ein im Ausgangstext fehlendes „unser“ einzufügen.
