id: EPH.6.11
reference: Ephesians 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: de
  text: Legt die vollständige Waffenrüstung Gottes an[a], damit ihr den Machenschaften des Teufels[b] standhalten könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die ganze Rüstung Gottes“. Das griechische Wort bezeichnet die vollständige Ausrüstung eines Soldaten.
    reason: lexical_alternative
  - marker: b
    text: Oder „den listigen Plänen“ beziehungsweise „den hinterhältigen Methoden des Teufels“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Legt … an
  rationale: Der Aorist-Medium-Imperativ in der zweiten Person Plural ist als unmittelbare Aufforderung wiedergegeben. „Anlegen“ ist im Deutschen die natürliche Verbindung mit einer Rüstung.
- source_word: πανοπλίαν
  choice: vollständige Waffenrüstung
  rationale: Das Wort bezeichnet die gesamte militärische Ausrüstung eines schwer bewaffneten Soldaten. „Vollständige Waffenrüstung“ bewahrt diesen Umfang deutlicher als das engere „Rüstung“ allein.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv bleibt bewusst offen und kann sowohl Zugehörigkeit als auch Bereitstellung durch Gott anklingen lassen, ohne diese Beziehung näher festzulegen.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: damit ihr … standhalten könnt
  rationale: Die Verbindung aus πρὸς und substantiviertem Infinitiv bezeichnet hier den Zweck. „Damit … könnt“ gibt sowohl die Zweckbeziehung als auch δύνασθαι natürlich wieder.
- source_word: στῆναι πρὸς
  choice: standhalten
  rationale: Im militärischen Bild bedeutet die Wendung, gegenüber einem Angriff den eigenen Stand zu behaupten. „Standhalten“ drückt dies idiomatisch aus, ohne einen Sieg über den Gegner hinzuzufügen.
- source_word: μεθοδείας
  choice: Machenschaften
  rationale: Der Ausdruck bezeichnet planvolle, listige oder betrügerische Vorgehensweisen. „Machenschaften“ ist modern verständlich und trägt die negative, hinterhältige Färbung.
- source_word: τοῦ διαβόλου
  choice: des Teufels
  rationale: Im Zusammenhang des geistlichen Kampfes dient διάβολος als persönliche Bezeichnung des bösen Widersachers; „Teufel“ ist dafür die geläufige deutsche Wiedergabe.
theological_decisions:
- issue: Bezug und Wiedergabe von διάβολος
  choice: der Teufel als persönlicher böser Widersacher
  alternative: der Verleumder
  rationale: Der unmittelbare Zusammenhang des geistlichen Kampfes in Epheser 6 spricht für einen persönlichen übermenschlichen Gegner und nicht für einen beliebigen menschlichen Verleumder. Weitere dogmatische Einzelheiten werden nicht in den Vers hineingetragen.
- issue: Beziehung der Waffenrüstung zu Gott im Genitiv τοῦ θεοῦ
  choice: Waffenrüstung Gottes
  alternative: von Gott gegebene Waffenrüstung
  rationale: Die knappe Genitivkonstruktion lässt offen, ob vor allem Gottes Besitz, sein eigener Kampfpanzer oder seine Gabe an die Glaubenden betont wird. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt knapp und imperativisch; traditionelle kirchliche Sprache wird nur dort verwendet, wo sie weiterhin klar und sachlich treffend ist.
