  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: de
  text: Denn unser Ringen richtet sich nicht gegen Fleisch und Blut[a], sondern gegen die Mächte, gegen die Gewalten, gegen die Weltherrscher dieser Finsternis[b], gegen die geistlichen Mächte des Bösen in den himmlischen Bereichen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn wir kämpfen nicht gegen Fleisch und Blut.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Weltherrscher dieser gegenwärtigen Finsternis“. Das Wort „gegenwärtig“ ist sinngemäß, steht jedoch nicht ausdrücklich im griechischen Text.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an den himmlischen Orten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: kämpfen
  rationale: Das Substantiv bezeichnet einen Ringkampf oder unmittelbaren Kampf. Die verbale Wiedergabe „wir kämpfen“ ist im modernen Deutsch natürlich und bewahrt das Bild eines persönlichen, heftigen Ringens; die wörtlichere Nuance steht in Fußnote [a].
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: gegen Fleisch und Blut
  rationale: Die feste deutsche Wendung bezeichnet sterbliche Menschen als Gegner. Wie im Deutschen üblich wird gegenüber der griechischen Reihenfolge „Blut und Fleisch“ die Reihenfolge umgestellt.
- source_word: ἀρχάς
  choice: Mächte
  rationale: Im paulinischen Zusammenhang bezeichnet ἀρχαί übermenschliche Herrschaftsmächte. „Mächte“ ist verständlich und vermeidet das heute wenig transparente „Fürstentümer“.
- source_word: ἐξουσίας
  choice: Gewalten
  rationale: ἐξουσίαι bezeichnet mit Vollmacht ausgestattete Autoritäten oder Gewalten. „Gewalten“ hält den Unterschied zu ἀρχαί erkennbar und ist in diesem geistlichen Kontext idiomatisch.
- source_word: κοσμοκράτορας
  choice: Weltherrscher
  rationale: Das seltene Kompositum bezeichnet Herrscher der Welt beziehungsweise des Kosmos. „Weltherrscher“ bildet seine Wortstruktur knapp und deutlich ab, ohne es zum abstrakteren „kosmische Mächte“ umzudeuten.
- source_word: τοῦ σκότους τούτου
  choice: dieser Finsternis
  rationale: Der Genitiv ordnet die Weltherrscher dieser Finsternis zu oder kennzeichnet sie durch diese. Die Wiedergabe bleibt eng am Wortlaut und ergänzt nicht ausdrücklich „gegenwärtig“.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: die geistlichen Mächte des Bösen
  rationale: Das substantivierte Neutrum Plural bezeichnet hier angesichts des Kontextes geistliche Wesen oder Mächte. „Geistliche Mächte“ macht den Bezug im Deutschen verständlich, ohne die Wesen genauer als der griechische Ausdruck einzuordnen.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: in den himmlischen Bereichen
  rationale: Die wiederkehrende Wendung im Epheserbrief bezeichnet die himmlische Sphäre. „Himmlische Bereiche“ ist modernes, verständliches Deutsch und lässt ihre genaue räumliche oder kosmische Bestimmung offen.
theological_decisions:
- issue: Art der in diesem Vers genannten Gegner
  choice: Die Reihung bezeichnet übermenschliche geistliche Mächte.
  alternative: Die Begriffe könnten vor allem menschliche Herrscher und Institutionen oder zugleich geistliche Mächte und deren irdische Erscheinungsformen bezeichnen.
  rationale: Besonders κοσμοκράτορας und τὰ πνευματικὰ τῆς πονηρίας weisen unmittelbar auf geistliche Gegner. Die Übersetzung macht dies erkennbar, legt aber weder ihre genaue Rangordnung noch die Beziehung zu irdischen Strukturen fest.
- issue: Bedeutung von σάρξ in der Wendung αἷμα καὶ σάρκα
  choice: „Fleisch“ als Bestandteil der Wendung „Fleisch und Blut“
  alternative: „Sündige Natur“
  rationale: Hier bezeichnet σάρξ zusammen mit αἷμα das leibliche, sterbliche Menschsein und nicht eine sündige Wesensart.
- issue: Reichweite von ἐν τοῖς ἐπουρανίοις
  choice: Die Orts- beziehungsweise Sphärenangabe wird auf die geistlichen Mächte des Bösen bezogen.
  alternative: Die Wendung könnte rhetorisch weiter auf die gesamte vorausgehende Reihe geistlicher Gegner bezogen werden.
  rationale: Grammatisch steht die Präpositionalphrase unmittelbar beim letzten Glied. Ihre genaue Reichweite wird durch die Übersetzung nicht zusätzlich dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vierfache Wiederholung von „gegen“ bildet die nachdrückliche Struktur des griechischen Satzes ab. „Mächte“ und „Gewalten“ sind verständlich, bewahren zugleich aber die terminologische Spannung der beiden griechischen Herrschaftsbegriffe.
