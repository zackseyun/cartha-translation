  source_fidelity: Die Übersetzung gibt μετ’ εὐνοίας treffend mit „mit gutem Willen“ wieder und wahrt bei δουλεύοντες den dienstbezogenen Sinn im Kontext der bereits genannten Sklaven. „dem Herrn und nicht Menschen“ bildet den Gegensatz τῷ κυρίῳ καὶ οὐκ ἀνθρώποις vollständig und ohne unzulässige Einengung ab.
