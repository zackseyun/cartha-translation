source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: de
  text: Dient mit gutem Willen, als dientet ihr dem Herrn und nicht Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: mit gutem Willen
  rationale: μετά mit dem Genitiv bezeichnet hier die begleitende Haltung; εὔνοια meint Wohlwollen beziehungsweise eine bereitwillige, positive Gesinnung. „Mit gutem Willen“ ist natürlich und bewahrt den inneren Aspekt.
- source_word: δουλεύοντες
  choice: dient
  rationale: Das Partizip von δουλεύω bezeichnet das Dienen in der Stellung eines Sklaven. Da die Angesprochenen im Kontext bereits ausdrücklich als Sklaven bezeichnet werden, gibt „dient“ hier die Handlung idiomatisch wieder, ohne den sozialen Kontext zu verdecken.
- source_word: ὡς
  choice: als dientet ihr
  rationale: ὡς kennzeichnet, wem der Dienst seinem eigentlichen Bezug nach gilt. Die im Deutschen ergänzte Verbform macht den knappen griechischen Vergleich verständlich, ohne ihn zu einem bloß hypothetischen „als ob“ abzuschwächen.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: κύριος ist hier der göttliche beziehungsweise christologische Titel. „Herr“ hält zugleich die Unterscheidung zu den menschlichen Herren des Kontextes aufrecht.
- source_word: ἀνθρώποις
  choice: Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen im Gegensatz zum Herrn, nicht spezifisch männliche Personen. Das deutsche „Menschen“ gibt diesen generischen Sinn genau und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von κύριος im Gegensatz zu menschlichen Herren
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt den christologischen Titel und vermeidet eine Gleichsetzung mit den irdischen Herren im unmittelbaren Kontext.
- issue: Stärke des Sklaverei-Aspekts in δουλεύοντες
  choice: dient
  alternative: verrichtet Sklavendienst
  rationale: Der weitere Abschnitt nennt den rechtlichen und sozialen Status der Angesprochenen bereits ausdrücklich. In diesem Satz steht ihre Haltung beim Dienen im Vordergrund; eine stärkere Formulierung wäre im Deutschen unnötig schwer und könnte den Akzent verschieben.
- issue: Bezug von ἀνθρώποις
  choice: Menschen
  alternative: Männern
  rationale: Der Gegensatz ist theologisch zwischen dem Herrn und Menschen als solchen formuliert. Das grammatische Wort bezeichnet hier die Menschheit generisch; „Männern“ wäre im modernen Deutschen zu eng.
translation_notes:
  register: 'Moderne, würdevolle Standardsprache. Der Imperativ ergibt sich im Deutschen natürlich aus dem abhängigen Partizip des griechischen Satzgefüges und führt die Ermahnung des Kontextes fort. Die Formulierung „als dientet ihr“ ist idiomatisch, darf aber nicht als bloße Fiktion verstanden werden: Der Dienst gilt nach dem Kontext letztlich dem Herrn.'
