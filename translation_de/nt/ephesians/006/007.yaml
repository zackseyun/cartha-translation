  terminology: „Herr“ ist für κύριος im christologischen Kontrast zu menschlichen Personen angemessen. „Menschen“ gibt ἀνθρώποις als generischen Ausdruck korrekt wieder; „Männern“ wäre semantisch zu eng. Eine Fußnote ist nicht erforderlich, da der deutsche Wortlaut den Gegensatz klar ausdrückt.
