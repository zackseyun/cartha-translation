revisions:
- from: Ihr Sklaven, gehorcht euren Herren nach dem Fleisch[a] mit Furcht und Zittern, in Aufrichtigkeit eures Herzens, wie dem Messias[b].
  to: Ihr Sklaven, gehorcht euren irdischen Herren mit Furcht und Zittern und mit aufrichtigem Herzen, als dem Messias.[a]
  rationale: Die Revision ersetzt die im heutigen Deutsch missverständliche, formal nachgebildete Wortfolge „Herren nach dem Fleisch“ durch die kontextgemäße und idiomatische Wiedergabe „irdischen Herren“. Sie glättet außerdem die beiden deutschen Präpositional- und Vergleichsfügungen, ohne die Intensität von „Furcht und Zittern“, die Aufrichtigkeit des Herzens oder den Vergleich mit dem Messias abzuschwächen. Die Fußnote zu κατὰ σάρκα dokumentiert die formnähere Alternative. Der Marker bei „Messias“ entfällt im Lauftext, weil die Fußnote zu diesem Wort als allgemeine Übersetzungsanmerkung nicht an eine zusätzliche strittige Formulierung gebunden sein muss.
