  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: de
  text: Ihr Sklaven, gehorcht euren irdischen Herren mit Furcht und Zittern und mit aufrichtigem Herzen, als dem Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „euren Herren nach dem Fleisch“; gemeint sind Herren in der menschlichen, irdischen Sphäre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Im haushaltsrechtlichen Zusammenhang bezeichnet das Wort Menschen in einem Besitz- und Abhängigkeitsverhältnis. „Sklaven“ gibt diese soziale Wirklichkeit klarer wieder als das abschwächende „Diener“.
- source_word: ὑπακούετε
  choice: gehorcht
  rationale: Der Imperativ fordert fortdauernden Gehorsam; „gehorcht“ ist im Deutschen die klare und übliche Entsprechung.
- source_word: κατὰ σάρκα
  choice: nach dem Fleisch
  rationale: Die formnahe Wiedergabe bewahrt den ausdrücklichen Gegensatz zwischen der menschlich-leiblichen, zeitlichen Herrschaft und der Beziehung zum Messias, ohne die Wendung vorschnell auf „irdisch“ festzulegen.
- source_word: κυρίοις
  choice: Herren
  rationale: Im sozialen Verhältnis von Sklaven und Besitzern bezeichnet κύριοι die Herren. „Herren“ passt zum Kontext und lässt zugleich den Kontrast zur messianischen Herrschaft hörbar werden.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: mit Furcht und Zittern
  rationale: Die feste paulinische Wendung wird formnah wiedergegeben, sodass ihre rhetorische Kraft und ihre Bezüge zu anderen Stellen erhalten bleiben.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: in Aufrichtigkeit eures Herzens
  rationale: ἁπλότης bezeichnet hier Lauterkeit, Aufrichtigkeit und ungeteilte Gesinnung. Die gewählte Formulierung ist würdig und im modernen Deutsch verständlich.
- source_word: ὡς τῷ Χριστῷ
  choice: wie dem Messias
  rationale: ὡς behält seine vergleichende Kraft, ohne die menschlichen Herren mit dem Messias gleichzusetzen. Χριστός wird entsprechend seiner Titelfunktion als „Messias“ übersetzt.
theological_decisions:
- issue: Wiedergabe von Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Χριστός hat hier Titelfunktion. „Messias“ übersetzt den griechischen Titel, statt ihn lediglich in seiner traditionellen deutschen Form zu übernehmen.
- issue: Wiedergabe von δοῦλοι im Kontext antiker Sklaverei
  choice: Sklaven
  alternative: Diener
  rationale: Der Abschnitt spricht Menschen an, die Herren unterstanden. „Sklaven“ verschleiert das historische Besitz- und Abhängigkeitsverhältnis nicht.
- issue: Verständnis von κατὰ σάρκα
  choice: nach dem Fleisch
  alternative: irdischen / menschlichen
  rationale: Die formnahe Wendung bewahrt die theologische und anthropologische Spannung des Ausdrucks. Eine Fußnote erläutert den hier naheliegenden Bezug auf die rein menschliche, irdische Ebene.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst formnahen paulinischen Wendungen. „Ihr Sklaven“ macht die direkte Anrede deutlich; „nach dem Fleisch“ und „Furcht und Zittern“ bleiben wegen ihrer theologischen und intertextuellen Bedeutung erhalten. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
