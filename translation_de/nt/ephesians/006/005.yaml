  source_fidelity: „Sklaven“, „gehorcht“, „Furcht und Zittern“ und „Messias“ geben die maßgeblichen griechischen Ausdrücke zutreffend wieder. Die Wendung „Herren nach dem Fleisch“ ist zwar formnah, ist im modernen Standarddeutsch jedoch missverständlich und keine natürliche Modifikation von „Herren“. In diesem Kontext bezeichnet κατὰ σάρκα die begrenzte menschlich-irdische Sphäre dieser Herren; „irdischen Herren“ gibt dies idiomatisch wieder. Die Vergleichsfügung ὡς τῷ Χριστῷ wird mit „als dem Messias“ natürlicher und ohne Bedeutungszuwachs abgebildet.
  naturalness: Die Anrede und der gehobene Registerton sind passend. „in Aufrichtigkeit eures Herzens“ ist verständlich, aber „mit aufrichtigem Herzen“ ist gegenwärtiger und flüssiger. „wie dem Messias“ wirkt im Deutschen elliptisch und weniger idiomatisch als „als dem Messias“.
  terminology: „Sklaven“ benennt δοῦλοι im antiken Besitz- und Abhängigkeitsverhältnis angemessen. „Herren“ ist für κυρίοις im Kontext treffend. „Messias“ folgt der vorgesehenen Übersetzung von Χριστός als Titel. Die Fußnote zu κατὰ σάρκα sollte die wörtliche griechische Form nennen und zugleich klarstellen, dass keine Aussage über eine „fleischliche“ Gesinnung der Herren gemeint ist.
  issues:
