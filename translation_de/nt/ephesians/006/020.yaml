    issue: „als Gesandter eintrete“ für πρεσβεύω
    rationale: Die deutsche Wendung bedeutet primär, sich für etwas einzusetzen. πρεσβεύω bezeichnet dagegen, als Gesandter zu handeln bzw. Gesandter zu sein; die revidierte Formulierung erhält dieses Bild ohne zusätzliche Bedeutungsnuance.
  - severity: low
    issue: „es freimütig verkünde“ für ἐν αὐτῷ παρρησιάσωμαι ὡς δεῖ με λαλῆσαι
    rationale: Die Formulierung ist sinngemäß möglich, verdeckt aber das relationale „in/darin“ und ersetzt das ausdrücklich folgende „reden“ durch „verkünden“. „Darin freimütig rede“ bildet die Struktur und den Bezug enger ab.
