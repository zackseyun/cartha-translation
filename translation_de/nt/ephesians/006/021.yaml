source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: de
  text: Damit aber auch ihr erfahrt, was mich betrifft[a] und was ich tue, wird euch Tychikus, der geliebte Bruder und treue Diener im Herrn[b], alles mitteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie es um mich steht“ oder „meine Umstände“; wörtlich: „was mich betrifft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „treuer Mitarbeiter“ oder „treuer Diakon“; das griechische Wort διάκονος kann „Diener“, „Mitarbeiter“ und in manchen Zusammenhängen „Diakon“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Damit aber
  rationale: ἵνα leitet den Zweck ein; δέ setzt den Gedanken mit leichter weiterführender oder kontrastierender Kraft fort. „Damit aber“ bildet beides knapp ab.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: auch ihr wisst
  rationale: καί zusammen mit dem ausdrücklich gesetzten ὑμεῖς betont, dass neben anderen auch die Empfänger Bescheid wissen sollen.
- source_word: τὰ κατ’ ἐμέ
  choice: wie es um mich steht
  rationale: Die griechische Wendung bezeichnet das, was Paulus und seine Lage betrifft. Die deutsche Formulierung ist natürlich, ohne die Art seiner Umstände näher festzulegen.
- source_word: τί πράσσω
  choice: was ich tue
  rationale: πράσσω bezeichnet hier schlicht das Tun oder Ergehen des Paulus; „was ich tue“ gibt den unmittelbaren Wortsinn verständlich wieder.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: wird euch … alles mitteilen
  rationale: γνωρίζω bedeutet „bekannt machen, mitteilen“. Die deutsche Wortstellung ist natürlich und bewahrt den umfassenden Sinn von πάντα.
- source_word: Τυχικὸς
  choice: Tychikus
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: der geliebte Bruder
  rationale: Die Formulierung bewahrt sowohl die Zuneigung von ἀγαπητός als auch die christliche Verwandtschaftssprache von ἀδελφός.
- source_word: πιστὸς διάκονος
  choice: treue Diener
  rationale: πιστός beschreibt Tychikus als zuverlässig und treu. „Diener“ hält διάκονος funktional offen und legt hier kein förmliches Kirchenamt fest.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die feste paulinische Wendung bezeichnet die Beziehung zu beziehungsweise den Wirkungsbereich in Christus und wird ohne zusätzliche Deutung wiedergegeben.
theological_decisions:
- issue: Bedeutung von διάκονος bei Tychikus
  choice: Diener
  alternative: Mitarbeiter; Diakon
  rationale: Der Zusammenhang beschreibt Tychikus als verlässlichen Beauftragten, der über Paulus berichten wird. Ob διάκονος hier ein förmliches Amt bezeichnet, bleibt offen; „Diener“ vermeidet eine unbegründete Festlegung.
- issue: Wiedergabe von ἀδελφός
  choice: Bruder
  alternative: Geschwister
  rationale: Gemeint ist der einzelne männliche Mitarbeiter Tychikus; daher ist „Bruder“ sachlich und sprachlich passend.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: ἐν κυρίῳ ist eine feste paulinische Bezeichnung der Beziehung zu Christus. „Herr“ wahrt den tradierten Titel und die theologische Mehrdeutigkeit der Wendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem griechischen Gedankengang nahe, wird aber durch „und“ zwischen den beiden Angaben zu Paulus im Deutschen flüssig verbunden. Die Amtsfrage bei διάκονος wird nicht im Haupttext entschieden.
