  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: de
  text: und an den Füßen beschuht mit der Bereitschaft des Evangeliums des Friedens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Vorbereitung“; möglicherweise: „mit der Bereitschaft, das Evangelium des Friedens zu verkünden“, oder: „mit dem festen Stand, den das Evangelium des Friedens gibt“.'
    reason: Die verdichtete griechische Wendung kann Bereitschaft beziehungsweise Vorbereitung, Verkündigungsbereitschaft oder den durch das Evangelium gegebenen festen Stand bezeichnen.
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: beschuht
  rationale: Das Partizip bezeichnet das Anlegen von Schuhwerk. „Beschuht“ bewahrt das Bild der Rüstung und lässt sich knapp an die vorausgehende Aufforderung anschließen.
- source_word: τοὺς πόδας
  choice: die Füße
  rationale: Das Griechische nennt ausdrücklich die Füße, nicht das Schuhwerk; die körperliche Metapher bleibt daher erhalten.
- source_word: ἐν
  choice: mit
  rationale: ἐν bezeichnet hier im Bild der Rüstung wahrscheinlich die Ausrüstung oder das Mittel. „Mit“ ist im Deutschen natürlich und semantisch offen genug.
- source_word: ἑτοιμασίᾳ
  choice: Bereitschaft
  rationale: Das Substantiv kann Bereitschaft oder Vorbereitung bezeichnen. „Bereitschaft“ ist direkt und vermeidet es, bereits im Haupttext entweder Verkündigungsbereitschaft oder festen Stand festzulegen.
- source_word: εὐαγγελίου
  choice: Evangelium
  rationale: „Evangelium“ ist der geläufige paulinische Ausdruck und bewahrt die theologische Dichte des Begriffs.
- source_word: εἰρήνης
  choice: Friedens
  rationale: Der Genitiv qualifiziert das Evangelium als Evangelium, das vom Frieden handelt oder Frieden bringt; die knappe Genitivverbindung bewahrt diese Offenheit.
theological_decisions:
- issue: Bedeutung von ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: Die Füße sind mit der Bereitschaft ausgerüstet, die mit dem Evangelium des Friedens verbunden ist oder aus ihm hervorgeht.
  alternative: Bereitschaft, das Evangelium des Friedens zu verkünden; oder fester Stand, den das Evangelium des Friedens gibt.
  rationale: Die griechische Formulierung ist verdichtet und lässt die genaue Beziehung der Genitive offen. Der Haupttext behält deshalb „Bereitschaft“ und die Genitivkette bei, statt die Aussage auf Verkündigung oder Standfestigkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Partizipialform ist auf den Zusammenhang der Waffenrüstung abgestimmt. Die ungewöhnliche, aber verständliche Genitivfolge wurde bewusst beibehalten, um die Mehrdeutigkeit des Ausgangstextes nicht vorschnell aufzulösen.
