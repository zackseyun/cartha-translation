  naturalness: „Die Gnade sei mit allen“ ist eine natürliche, würdige deutsche Segensformel. „Jesus, den Messias“ ist als artikulierte Apposition idiomatisch; die Kommas sind korrekt. „In Unvergänglichkeit“ ist im heutigen Deutsch markiert, aber als absichtlich formnahe Haupttextform vertretbar und durch die Fußnote hinreichend erläutert.
  terminology: „Gnade“, „Herr“ und „Messias“ sind angemessen und registergerecht. „Unvergänglichkeit“ trifft ἀφθαρσία präzise, ohne die umstrittene Deutung in Richtung bloßer Aufrichtigkeit oder ausschließlich unvergänglicher Liebe festzulegen.
