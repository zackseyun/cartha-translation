id: EPH.6.24
reference: Ephesians 6:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: de
  text: Die Gnade sei mit allen, die unseren Herrn Jesus, den Messias, in Unvergänglichkeit lieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit unvergänglicher Liebe“; auch möglich: „in Aufrichtigkeit“ oder „mit nie endender Liebe“. Der griechische Ausdruck „in Unvergänglichkeit“ ist knapp und mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: die Gnade
  rationale: Die paulinische Segensformel wird mit dem geläufigen theologischen und zugleich verständlichen Ausdruck „Gnade“ wiedergegeben.
- source_word: μετὰ πάντων
  choice: sei mit allen
  rationale: Der griechische Satz ist ohne ausdrückliches Verb; im Deutschen ergänzt „sei“ die natürliche Form eines Segenswunsches. μετά mit Genitiv entspricht „mit“.
- source_word: τῶν ἀγαπώντων
  choice: die … lieben
  rationale: Das substantivierte Präsenspartizip wird als natürlicher Relativsatz wiedergegeben; „lieben“ bezeichnet die kennzeichnende, fortdauernde Haltung.
- source_word: τὸν κύριον ἡμῶν
  choice: unseren Herrn
  rationale: „Herr“ bewahrt κύριος als christologischen Titel und entspricht dem gehobenen, aber allgemein verständlichen deutschen Sprachgebrauch.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, den Messias
  rationale: Χριστός wird seinem Titelsinn entsprechend als „Messias“ übersetzt; die Apposition mit Artikel ist im Deutschen idiomatisch und macht den Titel kenntlich.
- source_word: ἐν ἀφθαρσίᾳ
  choice: in Unvergänglichkeit
  rationale: Die bewusst formnahe Wiedergabe bewahrt die knappe semantische und syntaktische Mehrdeutigkeit des griechischen Ausdrucks, statt ihn eindeutig auf die Liebe oder den Segenswunsch zu beziehen.
theological_decisions:
- issue: Bezug und Bedeutung von ἐν ἀφθαρσίᾳ
  choice: Die mehrdeutige Formulierung „in Unvergänglichkeit“ bleibt im Haupttext stehen.
  alternative: „mit unvergänglicher Liebe“, „in Aufrichtigkeit“ oder „mit nie endender Liebe“
  rationale: Der griechische Ausdruck lässt offen, ob die Unvergänglichkeit näher die Liebe der Glaubenden, deren Haltung oder den Bereich beziehungsweise die Qualität des Segens bezeichnet. Eine deutende Glättung würde diese echte Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „in Unvergänglichkeit“ ist absichtlich beibehalten, um die Mehrdeutigkeit der Vorlage sichtbar zu machen; die verständlicheren Deutungen stehen in der Fußnote.
