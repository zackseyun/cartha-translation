  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: de
  text: Steht also, die Hüften mit Wahrheit umgürtet und den Brustpanzer der Gerechtigkeit[a] angelegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit stärkerer Betonung des persönlichen Verhaltens: „den Brustpanzer der Rechtschaffenheit“. Das griechische Wort kann sowohl Gerechtigkeit als auch rechtschaffenes Leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: Steht fest
  rationale: Der Aorist-Imperativ fordert zu entschlossenem Standhalten auf. „Fest“ ist im weiteren Zusammenhang natürlich, ohne die Aufforderung unnötig auszubauen.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Aufforderung und klingt im modernen Deutschen natürlich.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: Umgürtet eure Hüften
  rationale: Gibt das Bild des Umgürtens knapp und verständlich wieder. Der griechische Singular ὀσφύν wird im Deutschen idiomatisch als Plural formuliert.
- source_word: ἐν ἀληθείᾳ
  choice: mit Wahrheit
  rationale: Bewahrt die präpositionale Formulierung und lässt offen, ob Wahrheit als Mittel, prägende Wirklichkeit oder Wahrhaftigkeit gemeint ist; ein im Griechischen nicht ausdrücklich genanntes „Gürtel“ wird nicht ergänzt.
- source_word: ἐνδυσάμενοι
  choice: legt … an
  rationale: Das deutsche Verb „anlegen“ ist für Kleidung und Rüstung natürlich. Die koordinierte Imperativform vermittelt die begleitenden Partizipialhandlungen flüssiger als eine schwerfällige Vorzeitigkeitskonstruktion.
- source_word: θώρακα
  choice: Brustpanzer
  rationale: Übliche und verständliche Bezeichnung für den den Oberkörper schützenden Teil der Rüstung.
- source_word: δικαιοσύνης
  choice: der Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Entsprechung und kann sowohl einen rechten Stand beziehungsweise ein rechtes Handeln als auch den Aspekt der Gerechtigkeit im öffentlichen Sinn tragen.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im paulinischen Rüstungsbild
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ bewahrt den breiten theologischen und ethischen Bedeutungsumfang des griechischen Wortes. „Rechtschaffenheit“ würde den Sinn stärker auf persönliche Tugend verengen.
- issue: Bezug von ἐν ἀληθείᾳ
  choice: mit Wahrheit
  alternative: mit dem Gürtel der Wahrheit
  rationale: Der griechische Text nennt an dieser Stelle keinen Gürtel. Die gewählte Fassung erhält zugleich die mögliche instrumentale und qualitative Nuance, ohne das Rüstungsbild interpretierend zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht deutlich, dass die folgenden Aufforderungen erläutern, wie die Adressaten feststehen sollen. Die griechischen Aoristpartizipien werden als koordinierte Imperative wiedergegeben, um im Deutschen einen klaren und kraftvollen Satz zu erhalten; ihre sachliche Unterordnung unter „Steht“ bleibt durch den Doppelpunkt erkennbar.
