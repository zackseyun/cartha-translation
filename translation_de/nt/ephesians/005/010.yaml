  text: testing what is pleasing to the Lord;[a]
translation:
  language: de
  text: und prüft, was dem Herrn gefällt;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „findet heraus“ oder „beurteilt, was dem Herrn gefällt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: prüft
  rationale: Das präsentische aktive Partizip führt den Aufforderungszusammenhang weiter. „Prüft“ bewahrt den aktiven, wertenden Sinn des Untersuchens und Erprobens; im Deutschen ist eine koordinierte Aufforderung hier natürlicher als ein Partizip.
- source_word: τί
  choice: was
  rationale: Leitet eine indirekte Frage ein; „was“ ist die natürliche moderne deutsche Wiedergabe.
- source_word: ἐστιν
  choice: gefällt
  rationale: Die Kopula wird zusammen mit εὐάρεστον idiomatisch durch das Verb „gefällt“ wiedergegeben, ohne den Sinn zu erweitern.
- source_word: εὐάρεστον
  choice: gefällt
  rationale: „Dem Herrn gefällt“ ist natürliches, gegenwärtiges Deutsch und gibt das Angenehme beziehungsweise Wohlgefällige treffend wieder.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ hängt von εὐάρεστον ab. „Herr“ bewahrt den griechischen Titel, ohne seinen Bezug ausdrücklich auf Jesus oder Gott festzulegen.
theological_decisions:
- issue: Bezug von κύριος
  choice: Herr
  alternative: der Herr Jesus; Gott
  rationale: Der griechische Text nennt nur den Titel κύριος. Die Übersetzung bewahrt diese Offenheit und fügt keine ausdrückliche Identifikation hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung schließt mit „und“ an den vorausgehenden Satzfluss an; das Semikolon wahrt den Fortsetzungscharakter des Verses.
