  verdict: approve
  source_fidelity: 'Der deutsche Text gibt den griechischen Gedankengang zuverlässig wieder: γάρ ist mit „Denn“ angeschlossen, οὐδεὶς ... ποτέ mit „niemand hat je“, der Kontrast mit „sondern“ und die Vergleichsstruktur καθὼς καὶ mit „so wie auch“. Die Wiederholung von „ernährt und pflegt“ im Schlussteil löst die griechische Ellipse idiomatisch auf, ohne über ἐκτρέφει und θάλπει hinausgehenden Inhalt einzutragen.'
  naturalness: Modernes, flüssiges Standarddeutsch. „Seinen eigenen Leib ... ernährt und pflegt“ ist klar und angemessen würdevoll. Die explizite Verbwiederholung bei Christus vermeidet eine im Deutschen unnötig harte Ellipse.
  terminology: „Leib“ ist in diesem Kontext eine sachgerechte deutsche Kontextwiedergabe von σάρξ und wird durch die Fußnote transparent gegen ein ethisch-metaphorisches Verständnis abgegrenzt. „Christus“ und „die Gemeinde“ sind im deutschen biblischen Register etablierte und natürliche Wiedergaben; keine theologisch einengende Deutung wird eingeführt.
