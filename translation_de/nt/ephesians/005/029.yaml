id: EPH.5.29
reference: Ephesians 5:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: de
  text: Denn niemand hat je seinen eigenen Leib[a] gehasst, sondern er ernährt und pflegt ihn, so wie auch Christus die Gemeinde ernährt und pflegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: sein eigenes Fleisch. Gemeint ist hier der eigene Leib beziehungsweise die eigene leibliche Person, nicht die „sündige Natur“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Denn niemand hat je
  rationale: Bewahrt den begründenden Anschluss von γάρ und gibt die durch οὐδεὶς ... ποτε ausgedrückte Allgemeingültigkeit natürlich wieder.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: seinen eigenen Leib
  rationale: σάρξ bezeichnet hier im Rahmen des Leib-Ehe-Vergleichs die eigene leibliche Person, nicht die sündige Natur. „Leib“ ist im Deutschen natürlich und hält zugleich den Zusammenhang mit dem Leibmotiv fest.
- source_word: ἐμίσησεν
  choice: gehasst
  rationale: Direkte und angemessen starke Wiedergabe des Aorists von μισέω.
- source_word: ἐκτρέφει
  choice: ernährt
  rationale: Gibt die Versorgung durch Nahrung wieder und passt zum konkreten Bild des eigenen Leibes.
- source_word: θάλπει
  choice: pflegt
  rationale: Bezeichnet hier fürsorgliche, wärmende Zuwendung; „pflegt“ ist verständlich und bildet zusammen mit „ernährt“ ein natürliches Wortpaar.
- source_word: καθὼς καὶ
  choice: so wie auch
  rationale: Bewahrt sowohl den Vergleich als auch die additive Nuance von καί.
- source_word: ὁ Χριστὸς
  choice: Christus
  rationale: „Christus“ ist im modernen deutschen Bibel- und Allgemeingebrauch die natürliche, würdevolle Bezeichnung; seine Titelbedeutung kann in der Fußnote erläutert werden.
- source_word: τὴν ἐκκλησίαν
  choice: die Gemeinde
  rationale: ἐκκλησία meint hier die Gemeinschaft der Glaubenden als Ganze; „Gemeinde“ ist im Deutschen etabliert und weniger institutionell verengt als „Kirche“.
theological_decisions:
- issue: Wiedergabe von σάρξ
  choice: Leib
  alternative: Fleisch
  rationale: Hier ist die physische beziehungsweise leibliche Person gemeint, nicht „Fleisch“ als ethisch-theologische Macht. „Leib“ bewahrt den Gedankengang des Abschnitts und vermeidet im Deutschen eine missverständliche oder unnatürliche Formulierung.
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: der Messias
  rationale: Der griechische Ausdruck ist ein Titel und bedeutet „Messias“. Im Deutschen ist „Christus“ jedoch als Titel Jesu unmittelbar verständlich und stilistisch natürlicher; die Bedeutungsalternative wird offengelegt.
- issue: Ellipse im letzten Teilsatz
  choice: ernährt und pflegt ergänzt
  alternative: so wie auch Christus die Gemeinde
  rationale: Das Griechische lässt die Verben im Vergleich aus. Im Deutschen werden sie wiederholt, damit der Satz vollständig und eindeutig bleibt, ohne den Sinn über die beiden ausdrücklich genannten Handlungen hinaus zu erweitern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevollem biblischem Ton. Die griechische Ellipse im Schlusssatz wird durch Wiederholung der beiden Verben natürlich aufgelöst. Der Fußnotenmarker [a] steht unmittelbar beim betreffenden Ausdruck.
