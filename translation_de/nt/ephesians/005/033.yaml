  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: de
  text: Jedenfalls soll auch jeder Einzelne von euch[a] seine eigene Frau so lieben wie sich selbst; die Frau aber soll ihren Mann achten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine betont verteilende Formulierung: „ihr, jeder Einzelne“; die Aufforderung gilt jedem persönlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „soll ihren Mann fürchten“. Das griechische Verb kann hier ehrfürchtige Achtung bezeichnen, nicht nur Angst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Jedenfalls
  rationale: Das Wort leitet nach den vorausgehenden Ausführungen eine abschließende, praktisch zugespitzte Zusammenfassung ein. „Jedenfalls“ gibt diesen folgernden und zugleich leicht abgrenzenden Übergang natürlich wieder.
- source_word: καὶ ὑμεῖς
  choice: auch … von euch
  rationale: Die Wiedergabe bewahrt die ausdrückliche Einbeziehung der Angesprochenen; die deutsche Wortstellung wird mit dem folgenden distributiven Ausdruck verbunden.
- source_word: οἱ καθ’ ἕνα ἕκαστος
  choice: jeder Einzelne von euch
  rationale: Die gehäufte distributive Formulierung betont, dass die Aufforderung jedem Ehemann persönlich gilt.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: seine eigene Frau
  rationale: Im Ehekontext bedeutet γυνή „Frau/Ehefrau“; ἑαυτοῦ hebt die jeweils eigene Frau hervor.
- source_word: οὕτως ἀγαπάτω
  choice: soll … so lieben
  rationale: „Soll lieben“ gibt den Imperativ in natürlichem, würdigem Deutsch wieder; „so“ verweist wie οὕτως auf die zuvor beschriebene Weise zurück.
- source_word: ὡς ἑαυτόν
  choice: wie sich selbst
  rationale: Die knappe Vergleichsform wahrt den reflexiven Bezug des griechischen Textes.
- source_word: ἡ δὲ γυνὴ
  choice: die Frau aber
  rationale: Im Kontext ist die Ehefrau gemeint. „Aber“ markiert den Übergang zum zweiten Teil der zusammenfassenden Ermahnung, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: ἵνα φοβῆται τὸν ἄνδρα
  choice: soll Ehrfurcht vor ihrem Mann haben
  rationale: φοβέομαι kann Furcht, Scheu oder ehrfürchtige Achtung bezeichnen. Im ehelichen Mahnkontext gibt „Ehrfurcht haben“ die respektvolle Haltung wieder, lässt aber mehr vom griechischen Bedeutungsfeld erkennen als das bloße „respektieren“. Der deutsche Possessivbezug ist idiomatisch ergänzt.
theological_decisions:
- issue: Bedeutung von φοβῆται in der ehelichen Ermahnung
  choice: Ehrfurcht vor ihrem Mann haben
  alternative: ihren Mann fürchten; ihren Mann achten
  rationale: Das Verb bezeichnet wörtlich häufig „fürchten“, kann aber auch ehrfürchtige Achtung ausdrücken. „Ehrfurcht haben“ bewahrt die Spannung des Ausdrucks, ohne im Deutschen zwangsläufig Angst oder Bedrohung zu unterstellen. Die wörtlichere Möglichkeit wird in der Fußnote offengelegt.
- issue: Geschlechtsspezifische Einzahl der Ermahnung
  choice: seine eigene Frau … die Frau … ihrem Mann
  alternative: die eigene Partnerin bzw. den eigenen Partner
  rationale: Die griechischen Formen sprechen ausdrücklich von Ehemann und Ehefrau. Diese geschlechtsspezifische eheliche Aussage wird nicht verallgemeinert oder neutralisiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ermahnungscharakter. Die Satzstellung ist für natürliches Deutsch geglättet; „so“ wahrt den Rückverweis auf den vorausgehenden Vergleich. „Ehrfurcht“ erhält die stärkere Färbung von φοβέομαι, während die Fußnote die wörtlichere Wiedergabe transparent macht.
