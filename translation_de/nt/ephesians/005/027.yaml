    issue: „die Gemeinde sich selbst in Herrlichkeit vor Augen stelle“
    rationale: Die feste Wendung „sich etwas vor Augen stellen“ bedeutet im gegenwärtigen Deutsch gewöhnlich, sich etwas gedanklich vorzustellen. Damit verschiebt sie die Aussage von einer tatsächlichen Präsentation zu einem inneren Anschauen und ist keine sichere Wiedergabe von παραστήσῃ.
  - severity: low
