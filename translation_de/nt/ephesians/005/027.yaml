  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: de
  text: damit er selbst die Gemeinde sich selbst als herrliche Gemeinde darstelle, die weder Fleck noch Runzel noch etwas dergleichen hat, sondern damit sie heilig und makellos sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Herrlichkeit“; das griechische Adjektiv kann die Eigenschaft der Gemeinde oder ihren herrlichen Zustand bei der Präsentation bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: vor Augen stelle
  rationale: Das Verb bezeichnet hier das Präsentieren beziehungsweise Vor-sich-Stellen. Die Wendung ist im Deutschen natürlich und bewahrt den feierlichen Charakter des Bildes.
- source_word: αὐτὸς ... ἑαυτῷ
  choice: er selbst ... sich selbst
  rationale: Beide ausdrücklich gesetzten Formen werden wiedergegeben, um sowohl die Betonung des Handelnden als auch den reflexiven Bezug zu erhalten.
- source_word: ἔνδοξον
  choice: in Herrlichkeit
  rationale: Die präpositionale Fassung beschreibt den Zustand, in dem die Gemeinde präsentiert wird, und lässt zugleich die adjektivische Alternative „herrlich“ erkennen.
- source_word: ἐκκλησίαν
  choice: die Gemeinde
  rationale: „Gemeinde“ ist im deutschen biblischen Sprachgebrauch eine etablierte Bezeichnung für die Gemeinschaft der Glaubenden und meint hier die Kirche als Ganzes, nicht bloß eine einzelne Versammlung.
- source_word: σπίλον
  choice: Flecken
  rationale: Die konkrete Bildsprache wird bewahrt und bildet mit „Runzel“ ein anschauliches Paar.
- source_word: ῥυτίδα
  choice: Runzel
  rationale: „Runzel“ ist die direkte, in diesem feierlichen Kontext passende Entsprechung und erhält das körperlich-bräutliche Bild.
- source_word: ἤ τι τῶν τοιούτων
  choice: oder etwas dergleichen
  rationale: Die Formulierung gibt die offene Verallgemeinerung des Griechischen knapp und idiomatisch wieder.
- source_word: ἁγία καὶ ἄμωμος
  choice: heilig und makellos
  rationale: „Heilig“ bewahrt den theologischen Gehalt; „makellos“ nimmt sowohl die Freiheit von einem Defekt als auch den Reinheitsgedanken auf.
theological_decisions:
- issue: Reflexive Darstellung im Christus-Gemeinde-Bild
  choice: „er selbst ... sich selbst“ ausdrücklich beibehalten
  alternative: Den Satz zu „damit er die Gemeinde herrlich vor sich stelle“ glätten
  rationale: Der griechische Text betont sowohl das handelnde Subjekt als auch den reflexiven Empfänger. Die Übersetzung löst die daraus entstehende theologische und bildliche Spannung nicht auf.
- issue: Reinheitsbild der Gemeinde
  choice: „Flecken oder Runzel ... heilig und makellos“
  alternative: „Makel oder Runzel ... heilig und untadelig“
  rationale: Die gewählte Fassung bewahrt die konkrete bräutliche Bildsprache und verbindet sie mit der Aussage von Heiligkeit und Fehlerlosigkeit, ohne sie ausschließlich moralisch oder kultisch zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wendung „vor Augen stelle“ passt zur Präsentations- und Brautmetaphorik; der doppelte reflexive Ausdruck bleibt trotz seiner Auffälligkeit wegen der griechischen Betonung erhalten.
