  source_fidelity: Die Übersetzung gibt die Zweckkonstruktion, die emphatische Subjektform αὐτός, den reflexiven Bezug ἑαυτῷ, die Reinheitsbilder sowie „heilig und makellos“ grundsätzlich zutreffend wieder. „Vor Augen stellen“ bezeichnet im heutigen Deutsch jedoch vorrangig ein geistiges Sich-Vorstellen und verfehlt daher hier die Bedeutung von παραστήσῃ als feierlichem Darstellen/Präsentieren.
  naturalness: Der doppelte reflexive Bezug darf wegen des griechischen Nachdrucks erhalten bleiben, muss aber idiomatisch so gefasst sein, dass keine mentale Vorstellung gemeint ist. „Als herrliche Gemeinde darstellen“ ist klar, würdig und modernes Standarddeutsch. Die Aufzählung mit „weder ... noch ... noch“ bildet die ausschließende Aussage flüssig ab.
  terminology: „Gemeinde“, „heilig“ und „makellos“ sind kontextgerecht. „Herrliche Gemeinde“ ist eine präzise und natürliche Wiedergabe von ἔνδοξον; die Zustandsnuance kann in einer Fußnote als „in Herrlichkeit“ kenntlich gemacht werden. „Fleck“ und „Runzel“ bewahren die konkrete Bildsprache.
