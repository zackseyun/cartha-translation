id: EPH.5.31
reference: Ephesians 5:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: de
  text: »Darum[a] wird ein Mann Vater und Mutter verlassen und sich mit seiner Frau verbinden, und die zwei werden ein Fleisch sein.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Anstelle dessen“. Im Zusammenhang des Genesis-Zitats wird die griechische Wendung jedoch kausal beziehungsweise folgernd verstanden: „Darum“ oder „Deshalb“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Darum
  rationale: Die Wendung dient im Genesis-Zitat als kausale beziehungsweise folgernde Verknüpfung. „Darum“ ist im Deutschen natürlich und wahrt den Bezug zum vorausgehenden Zusammenhang.
- source_word: καταλείψει
  choice: wird ... verlassen
  rationale: Das Verb bezeichnet hier das Verlassen des Elternhauses zur Bildung einer neuen ehelichen Gemeinschaft, ohne notwendig ein feindseliges Aufgeben auszudrücken.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Obwohl ἄνθρωπος allgemein „Mensch“ bedeuten kann, bezeichnet es hier in Verbindung mit „seiner Frau“ den männlichen Ehepartner.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: Vater und Mutter
  rationale: Die koordinierte deutsche Wendung gibt beide bestimmten familiären Bezugspersonen idiomatisch wieder; die Zugehörigkeit ergibt sich eindeutig aus dem Zusammenhang.
- source_word: προσκολληθήσεται
  choice: wird sich mit ... verbinden
  rationale: Die mediale/passive Zukunftsform beschreibt ein enges Sich-Anschließen. „Sich verbinden“ ist natürlich, würdig und bewahrt den Gedanken dauerhafter ehelicher Gemeinschaft.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: mit seiner Frau
  rationale: γυνή bedeutet in diesem eindeutig ehelichen Zusammenhang „Frau“ im Sinn von Ehefrau.
- source_word: ἔσονται οἱ δύο
  choice: die zwei werden ... sein
  rationale: Die Übersetzung bewahrt sowohl das ausdrücklich genannte „die zwei“ als auch die Grundbedeutung des Verbs „sein“, statt die Ergebnisnuance mit „werden zu“ zu verdeutlichen.
- source_word: εἰς σάρκα μίαν
  choice: ein Fleisch
  rationale: Die feste biblische Wendung wird beibehalten. σάρξ bezeichnet hier die leiblich-relationale eheliche Einheit, nicht die sündige menschliche Natur.
theological_decisions:
- issue: Geschlechtsspezifische Sprache im Ehezitat
  choice: ein Mann ... seine Frau
  alternative: ein Mensch ... sein Ehepartner
  rationale: Der griechische Text stellt durch die Verbindung von ἄνθρωπος mit „seiner Frau“ ausdrücklich ein männlich-weibliches Ehepaar dar. Diese sprachliche Gestalt wird nicht neutralisiert.
- issue: Wiedergabe von σάρξ in εἰς σάρκα μίαν
  choice: ein Fleisch
  alternative: ein Leib
  rationale: Die Formulierung stammt aus Genesis und bezeichnet eheliche Einheit. „Fleisch“ erhält die bewusste biblische Ausdrucksweise und vermeidet eine unnötige begriffliche Glättung.
- issue: Seins- oder Werdensnuance in ἔσονται ... εἰς
  choice: werden ... sein
  alternative: werden zu ... werden / werden ... werden
  rationale: Das griechische ἔσονται bedeutet formal „sie werden sein“, während εἰς eine resultative Nuance tragen kann. Die gewählte Fassung bewahrt die grammatische Form und lässt die Ergebnisdimension im Zusammenhang stehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schriftzitat-Charakter. Die Anführungszeichen kennzeichnen das in Epheser 5,31 angeführte Genesis-Zitat. „Ein Fleisch“ bleibt als bewusst biblische und theologisch offene Wendung erhalten.
