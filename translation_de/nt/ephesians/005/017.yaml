source:
  edition: SBLGNT
  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: de
  text: Aus diesem Grund[a] werdet nicht unverständig, sondern versteht, was der Wille des Herrn ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum seid nicht unverständig.“ Das griechische Verb kann hier eher zustandsbezogen mit „seid“ wiedergegeben werden; „werdet“ bringt jedoch die Bedeutung des Eintretens in einen Zustand deutlicher zum Ausdruck.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Aus diesem Grund
  rationale: Die Wendung verweist auf die vorausgehende Ermahnung zurück und drückt eine folgernde beziehungsweise begründende Verbindung aus. „Aus diesem Grund“ bewahrt diese Verknüpfung klar.
- source_word: μὴ γίνεσθε
  choice: werdet nicht
  rationale: γίνομαι bezeichnet ein Werden beziehungsweise das Eintreten in einen Zustand. „Werdet nicht“ gibt diese dynamische Nuance genauer wieder als das statische „seid nicht“.
- source_word: ἄφρονες
  choice: unverständig
  rationale: ἄφρων bezeichnet einen Mangel an Einsicht oder praktischem Verstand. „Unverständig“ bildet zudem einen klaren Gegensatz zum folgenden „versteht“, ohne den Weisheitswortschatz des unmittelbaren Kontexts unnötig einzuebnen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten Aufforderung bezeichnet ἀλλά den starken Gegensatz zur positiven Aufforderung; im Deutschen ist „sondern“ dafür idiomatisch.
- source_word: συνίετε
  choice: versteht
  rationale: συνίημι bedeutet verstehen, erfassen oder einsehen. „Versteht“ ist klar, natürlich und lässt die kontextuelle Nuance einsichtsvollen Erkennens bestehen.
- source_word: τί
  choice: was
  rationale: τί leitet den Inhalt dessen ein, was verstanden werden soll. „Was“ ist die natürliche deutsche Entsprechung.
- source_word: τὸ θέλημα
  choice: der Wille
  rationale: θέλημα bezeichnet hier den Willen, die Absicht oder das, was getan werden soll. „Der Wille“ ist präzise und im paulinischen Sprachgebrauch angemessen.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Die Genitivverbindung wird natürlich mit „des Herrn“ wiedergegeben. Die Übersetzung bestimmt den im Griechischen nicht ausdrücklich genannten Referenten nicht näher.
theological_decisions:
- issue: Referent von τοῦ κυρίου
  choice: „des Herrn“ ohne ergänzendes „Jesus“ oder „Gottes“
  alternative: „des Herrn Jesus“ oder „Gottes“
  rationale: Im Zusammenhang des Epheserbriefs kann „Herr“ auf Jesus bezogen sein; der Vers selbst sagt jedoch nur κυρίου. Die offenere Formulierung bewahrt den Wortlaut und vermeidet eine nicht ausdrücklich vorhandene Präzisierung.
- issue: Aussagekraft des Verbots μὴ γίνεσθε
  choice: „werdet nicht“
  alternative: „seid nicht“ oder „hört auf, unverständig zu sein“
  rationale: Die gewählte Fassung bewahrt die Bedeutung des Eintretens in einen Zustand, ohne vorauszusetzen, dass die Angesprochenen bereits unverständig sind oder ausdrücklich mit einem bestehenden Verhalten aufhören sollen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und exhortativ. „Unverständig“ ist allgemein verständlich, stellt den Gegensatz zu „versteht“ heraus und bewahrt die Unterscheidung zum Weisheitswortschatz des vorausgehenden Zusammenhangs.
