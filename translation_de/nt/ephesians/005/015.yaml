base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: de
  text: Achtet also genau darauf, wie ihr lebt[a] – nicht als Unweise, sondern als Weise –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie ihr geht“. Das griechische Wort gebraucht das Gehen als Bild für die Art, wie jemand sein Leben führt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Achtet … darauf
  rationale: Das präsentische Verb steht hier als Aufforderung an die ganze Gemeinde. „Achtet darauf“ gibt die aufmerksame, wachsame Haltung in natürlichem modernem Deutsch wieder.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet knapp und klar die Folgerung aus dem vorausgehenden Gedankengang.
- source_word: ἀκριβῶς πῶς
  choice: genau darauf, wie
  rationale: ἀκριβῶς betont Sorgfalt beziehungsweise Genauigkeit, während πῶς die Art und Weise einführt. Die deutsche Formulierung bewahrt diese Betonung ohne technische Färbung.
- source_word: περιπατεῖτε
  choice: ihr lebt
  rationale: Wörtlich bedeutet das Verb „ihr geht/umhergeht“, wird hier aber als geläufige paulinische Metapher für die Lebensführung gebraucht. „Ihr lebt“ vermittelt den gemeinten Sinn in heutigem Deutsch; die Metapher wird in einer Fußnote kenntlich gemacht.
- source_word: μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί
  choice: nicht als Unweise, sondern als Weise
  rationale: Die substantivierten Adjektive bewahren den unmittelbaren Gegensatz zwischen fehlender Weisheit und Weisheit. „Unweise“ ist näher an ἄσοφοι als das stärker wertende „Toren“ oder „Narren“.
theological_decisions:
- issue: Generischer Bezug der maskulinen Pluralformen ἄσοφοι und σοφοί
  choice: „Unweise … Weise“ ohne männliche Personenbezeichnung
  alternative: „unweise Männer … weise Männer“
  rationale: Die grammatisch maskulinen Pluralformen bezeichnen im Kontext die gesamte angesprochene Gemeinde. Die deutschen substantivierten Adjektive geben den Gegensatz wieder, ohne eine im Griechischen nicht ausdrücklich vorhandene Beschränkung auf Männer einzuführen.
- issue: Metapher des Gehens als Lebensführung
  choice: Sinnwiedergabe „wie ihr lebt“ im Haupttext, wörtliche Metapher in der Fußnote
  alternative: „wie ihr wandelt“
  rationale: „Wandeln“ wäre formal näher, wirkt im heutigen Standarddeutsch jedoch archaisch und kirchensprachlich. Die gewählte Fassung macht die ethische Aussage unmittelbar verständlich, ohne die Bildsprache zu verschweigen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Satzform bewahrt die nachdrückliche Gegenüberstellung; der abschließende Gedankenstrich berücksichtigt, dass der Satz im folgenden Vers weitergeführt wird.
