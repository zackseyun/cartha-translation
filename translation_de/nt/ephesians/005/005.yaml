source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: de
  text: 'Denn dies sollt ihr wissen und erkennen: Kein sexuell unmoralischer, unreiner oder habgieriger Mensch, der ein Götzendiener ist[a], hat ein Erbteil im Reich des Messias[b] und Gottes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die neutrale griechische Relativform lässt auch eine sachbezogene Wiedergabe zu: „was Götzendienst ist“; damit ist wahrscheinlich besonders die Habgier gemeint.'
    reason: alternative_reading
  - marker: b
    text: Griechisch Christos („Christus“); hier als Titel mit „Messias“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: ihr wisst und erkennt
  rationale: Die Wiedergabe mit zwei koordinierten Verben bewahrt die verstärkende Verbindung von ἴστε und γινώσκοντες und klingt zugleich im Deutschen natürlich.
- source_word: πόρνος
  choice: sexuell unmoralischer Mensch
  rationale: Die Formulierung bezeichnet einen Menschen, dessen Verhalten von sexueller Unmoral geprägt ist, ohne das heute engere oder altertümliche „Unzüchtiger“ zu verwenden.
- source_word: ἀκάθαρτος
  choice: unreiner Mensch
  rationale: „Unrein“ bewahrt neben der ethischen Bedeutung auch den metaphorischen und kultischen Anklang des griechischen Wortes.
- source_word: πλεονέκτης
  choice: habgieriger Mensch
  rationale: „Habgierig“ gibt das gierige Habenwollen und rücksichtslose Mehrhabenwollen in aktuellem Standarddeutsch wieder.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: der ein Götzendiener ist
  rationale: Die personenbezogene Wiedergabe folgt dem unmittelbaren Zusammenhang und lässt sich im Deutschen klar formulieren; die grammatisch auffällige neutrale Form und die mögliche sachliche Beziehung besonders auf die Habgier werden in der Fußnote erhalten.
- source_word: κληρονομίαν
  choice: Erbteil
  rationale: „Erbteil“ bewahrt die paulinische Bundes- und Erbmetaphorik deutlicher als das allgemeinere „Anteil“.
- source_word: βασιλείᾳ
  choice: Reich
  rationale: „Reich“ ist die geläufige und sachgerechte Wiedergabe, die Herrschaftsbereich und Königsherrschaft einschließen kann.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός steht hier als Titel; „Messias“ macht diesen Titelcharakter für heutige Leser sichtbar.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: des Messias und Gottes
  rationale: Die koordinierte Formulierung folgt dem griechischen Wortlaut, ohne eine weitergehende syntaktische oder christologische Deutung in die Übersetzung einzutragen.
theological_decisions:
- issue: Bezug von ὅ ἐστιν εἰδωλολάτρης
  choice: 'Personenbezogen: „der ein Götzendiener ist“'
  alternative: 'Sachbezogen: „was Götzendienst ist“, wahrscheinlich besonders auf die Habgier bezogen'
  rationale: Das neutrale Relativpronomen ὅ steht auffällig nach maskulinen Personenbezeichnungen. Der Zusammenhang und Kolosser 3,5 stützen besonders die Verbindung von Habgier und Götzendienst. Der Haupttext formuliert personenbezogen, während die Fußnote die grammatische Mehrdeutigkeit und die engere Beziehung zur Habgier wahrt.
- issue: Ausschluss vom Erbteil
  choice: 'Gegenwärtige Statusaussage: „hat kein Erbteil“'
  alternative: 'Zukünftige Aussage: „wird das Reich nicht erben“'
  rationale: Der griechische Text verwendet das Präsens οὐκ ἔχει. Die Übersetzung erhält diese gegenwärtige Aussage, ohne die eschatologische Tragweite der Warnung abzuschwächen.
- issue: Verhältnis von „Messias und Gott“
  choice: 'Schlichte koordinierte Wiedergabe: „im Reich des Messias und Gottes“'
  alternative: Eine stärker deutende Formulierung, die aus der Artikelkonstruktion eine bestimmte christologische Aussage ausdrücklich ableitet
  rationale: Die Übersetzung bewahrt die enge griechische Konstruktion, ohne eine umstrittene syntaktische Folgerung ausdrücklich festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzöffnung „ihr wisst und erkennt“ erhält die rhetorische Verstärkung des griechischen Ausdrucks. Die Aufzählung wird zur natürlichen deutschen Negativkonstruktion mit „kein“ umgeformt. Alle erklärungsbedürftigen Alternativen sind knapp in Fußnoten ausgewiesen.
