source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: de
  text: Doch wie die Gemeinde sich dem Messias[a] unterordnet, so ordnen sich auch die Ehefrauen ihren Ehemännern in allem unter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“.'
    reason: Alternative traditionelle Wiedergabe des Titels
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Kontrast beziehungsweise die Wiederaufnahme des vorherigen Gedankens und klingt im Deutschen an dieser Stelle natürlich.
- source_word: ὡς ... οὕτως καὶ
  choice: wie ... so auch
  rationale: Bewahrt die korrelative Vergleichsstruktur des Griechischen knapp und idiomatisch.
- source_word: ἡ ἐκκλησία
  choice: die Gemeinde
  rationale: Bezeichnet hier die christliche Gemeinschaft; „Gemeinde“ ist im deutschen neutestamentlichen Sprachgebrauch klar und geläufig.
- source_word: ὑποτάσσεται
  choice: sich unterordnet
  rationale: Gibt die mediale Form und den Gedanken einer freiwilligen Einordnung wieder, ohne einen über den griechischen Ausdruck hinausgehenden Zwang einzutragen.
- source_word: τῷ Χριστῷ
  choice: dem Messias
  rationale: Χριστός fungiert hier als Titel; „Messias“ übersetzt diesen Titel, während „Christus“ als traditionelle Alternative in der Fußnote genannt wird.
- source_word: αἱ γυναῖκες
  choice: die Ehefrauen
  rationale: Im Kontext der Haustafel und in Verbindung mit ἀνδράσιν ist die eheliche Bedeutung gemeint, nicht Frauen allgemein.
- source_word: τοῖς ἀνδράσιν
  choice: ihren Ehemännern
  rationale: Der häusliche Kontext verlangt die Bedeutung „Ehemänner“; das Possessivpronomen macht die im Griechischen vorausgesetzte eheliche Zuordnung im Deutschen idiomatisch deutlich.
- source_word: ἐν παντί
  choice: in allem
  rationale: Gibt die uneingeschränkte Formulierung des griechischen Textes wieder, ohne sie interpretierend einzugrenzen.
- source_word: Ellipse des Verbs im zweiten Vergleichsglied
  choice: so auch die Ehefrauen ihren Ehemännern
  rationale: Bewahrt die im Griechischen vorhandene Auslassung des aus dem ersten Teils zu ergänzenden Verbs; die Konstruktion ist auch im Deutschen verständlich und stilistisch möglich.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Das Wort wird hier als Titel verstanden und deshalb übersetzt. Die traditionelle deutsche Form „Christus“ bleibt als sachlich mögliche Wiedergabe in der Fußnote erhalten.
- issue: Reichweite der ehelichen Unterordnung
  choice: „in allem“ ohne ergänzende Einschränkung
  alternative: Deutende Zusätze wie „in allem, was angemessen ist“
  rationale: Der griechische Text lautet schlicht ἐν παντί. Eine einschränkende Ergänzung würde die im Vers bestehende Spannung interpretierend auflösen.
- issue: Ausgelassenes Verb bei den Ehefrauen
  choice: Ellipse beibehalten
  alternative: „so sollen sich auch die Ehefrauen ihren Ehemännern unterordnen“
  rationale: Im zweiten Vergleichsglied steht im griechischen Text kein wiederholtes Verb. Die deutsche Ellipse erhält diese formale Eigenart, ohne den Sinn unverständlich zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Ehefrauen“ und „Ehemänner“ vermeiden die im Deutschen mögliche Fehlinterpretation als Frauen und Männer im Allgemeinen. Die knappe Ellipse des griechischen zweiten Satzteils bleibt erhalten.
