id: EPH.5.3
reference: Ephesians 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: de
  text: Doch von sexueller Unmoral und jeder Art von Unreinheit oder Habgier soll unter euch nicht einmal die Rede sein[a], wie es sich für Heilige gehört[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »soll unter euch nicht einmal genannt werden«. Gemeint sein kann auch: Es soll unter euch nicht einmal vorkommen.'
    reason: lexical_alternative
  - marker: b
    text: »Heilige« bezeichnet hier alle Glaubenden als Gottes heiliges Volk, nicht eine später kanonisierte besondere Gruppe.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: sexuelle Unmoral
  rationale: Der Ausdruck bezeichnet unerlaubtes sexuelles Verhalten allgemein und wird daher nicht auf vorehelichen Geschlechtsverkehr verengt.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel markiert hier einen milden Gegensatz beziehungsweise Übergang zur vorausgehenden Mahnung.
- source_word: ἀκαθαρσία πᾶσα
  choice: jede Art von Unreinheit
  rationale: Diese Formulierung gibt den umfassenden Sinn von πᾶσα idiomatisch wieder; im Kontext ist moralische, besonders sexuelle Unreinheit gemeint, ohne den Ausdruck darauf zu verengen.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Verknüpfung des griechischen Textes wird unmittelbar bewahrt.
- source_word: πλεονεξία
  choice: Habgier
  rationale: Das Wort bezeichnet ein maßloses Verlangen nach mehr, häufig verbunden mit Aneignung und Ausbeutung. »Habgier« ist im Deutschen präzise und wird nicht unbegründet auf sexuelle Begierde eingeschränkt.
- source_word: μηδὲ ὀνομαζέσθω
  choice: soll ... nicht einmal die Rede sein
  rationale: Die starke Verneinung des passiven Imperativs wird natürlich wiedergegeben. Die Formulierung lässt die genuine Spannung offen, ob vor allem das Vorkommen solcher Laster oder auch unangemessenes Reden darüber ausgeschlossen wird.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung bezieht sich gemeinschaftlich auf das Leben in der Gemeinde.
- source_word: καθὼς πρέπει
  choice: wie es sich ... gehört
  rationale: Die idiomatische deutsche Wendung drückt den Maßstab angemessenen Verhaltens klar aus.
- source_word: ἁγίοις
  choice: Heilige
  rationale: Der paulinische Ausdruck bezeichnet die Glaubenden als Menschen, die Gott gehören und für ihn ausgesondert sind.
theological_decisions:
- issue: Bedeutung von πλεονεξία in einer Lasterliste neben sexuellen Verfehlungen
  choice: Habgier im breiteren Sinn
  alternative: sexuelle Gier beziehungsweise Begierde
  rationale: Obwohl der Kontext von Sexualethik geprägt ist, hat πλεονεξία im paulinischen Sprachgebrauch einen weiteren Sinn. Eine sexuelle Verengung wäre textlich nicht hinreichend begründet.
- issue: Referent von ἁγίοις
  choice: Heilige als Bezeichnung für alle Glaubenden
  alternative: die heiligen Menschen beziehungsweise Gottes heiliges Volk
  rationale: Der Ausdruck bezeichnet hier nicht eine später kanonisierte Sondergruppe, sondern die christliche Gemeinschaft als Gottes geheiligtes Volk.
- issue: Reichweite von μηδὲ ὀνομαζέσθω
  choice: »soll unter euch nicht einmal die Rede sein« mit erläuternder Alternative
  alternative: »soll unter euch nicht einmal vorkommen«
  rationale: Das Verb bedeutet wörtlich »genannt werden«. Im ethischen Zusammenhang kann die Aussage sowohl das tatsächliche Vorkommen als auch ein unangemessenes Reden darüber berühren; die Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sexuelle Unmoral« ist verständlich und sachlich; »jede Art von Unreinheit« bewahrt die umfassende Aussage. Die idiomatische Wendung »nicht einmal die Rede sein« wird durch eine Fußnote gegen eine rein sprachliche Verengung abgesichert.
