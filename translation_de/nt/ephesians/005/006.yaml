review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt die griechische Satzstruktur und die zentralen Bedeutungen zuverlässig wieder: das Verbot (Μηδεὶς … ἀπατάτω), das Mittel („mit leeren Worten“), den Kausalbezug (διὰ ταῦτα), das Präsens von ἔρχεται sowie die gerichtete Bewegung von ἐπί („kommt … über“) bleiben erhalten. „Söhne des Ungehorsams“ bewahrt die maskuline und idiomatische Form von τοὺς υἱοὺς τῆς ἀπειθείας, ohne deren Charakterisierungsfunktion im Haupttext aufzulösen.'
  naturalness: „Lasst euch von niemandem mit leeren Worten täuschen“ ist natürliches modernes Standarddeutsch. „Denn wegen dieser Dinge kommt der Zorn Gottes über …“ ist bewusst würdig und dem gerichtlichen Register angemessen. Die ungewöhnlichere, aber verständliche Formulierung „Söhne des Ungehorsams“ ist als quellensprachlich geprägtes Idiom gerechtfertigt und wird sachgerecht erläutert.
  terminology: „Zorn Gottes“ gibt ὀργὴ τοῦ θεοῦ direkt wieder und wird nicht zu „Gericht“ abgeschwächt. „Leere Worte“, „Ungehorsam“ und „Söhne“ entsprechen den relevanten griechischen Ausdrücken. Die Fußnote bietet mit „Kinder des Ungehorsams“ eine legitime sprachliche Alternative und erklärt die idiomatische Bedeutung, ohne eine theologische Deutung aufzuzwingen.
