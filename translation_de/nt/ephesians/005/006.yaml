id: EPH.5.6
reference: Ephesians 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: de
  text: Lasst euch von niemandem mit leeren Worten täuschen; denn wegen dieser Dinge kommt der Zorn Gottes über die Söhne des Ungehorsams.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kinder des Ungehorsams“, das heißt Menschen, die vom Ungehorsam geprägt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ὑμᾶς ἀπατάτω
  choice: Lasst euch von niemandem täuschen
  rationale: Die deutsche Aufforderung mit „lasst euch von niemandem“ gibt das griechische Verbot natürlich und präzise wieder; „täuschen“ entspricht ἀπατάω im Kontext irreführender moralischer Behauptungen.
- source_word: κενοῖς λόγοις
  choice: mit leeren Worten
  rationale: Die Wendung bewahrt das Bild in κενοῖς und lässt offen, ob λόγοις einzelne Worte, Aussagen oder Argumente bezeichnet.
- source_word: διὰ ταῦτα
  choice: wegen dieser Dinge
  rationale: διά mit Akkusativ bezeichnet hier den Grund. Der Rückbezug auf die zuvor genannten Verhaltensweisen bleibt erhalten.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens wird ohne Festlegung auf eine ausschließlich gegenwärtige oder zukünftige Zeitbedeutung wiedergegeben.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: der Zorn Gottes
  rationale: Die Formulierung gibt ὀργή ausdrücklich als „Zorn“ wieder und schwächt den Begriff nicht zu einem allgemeinen Gerichtswort ab.
- source_word: ἐπὶ
  choice: über
  rationale: Bei Personen als Ziel bezeichnet ἐπί hier das Kommen über sie; „über“ ist im Deutschen natürlich und wahrt den gerichtlichen Ton.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: die Söhne des Ungehorsams
  rationale: Die Wiedergabe erhält die ausdrücklich männliche, semitisch geprägte Charakterisierungsform des Griechischen. Eine Fußnote erläutert ihre idiomatische Bedeutung.
theological_decisions:
- issue: Sprache vom göttlichen Zorn
  choice: der Zorn Gottes
  alternative: das Gericht Gottes
  rationale: Der Ausgangstext verwendet ὀργή und nicht einen allgemeineren Ausdruck für Gericht; seine theologische Schärfe wird daher bewahrt.
- issue: Idiom τοὺς υἱοὺς τῆς ἀπειθείας
  choice: die Söhne des Ungehorsams
  alternative: die Kinder des Ungehorsams; die vom Ungehorsam geprägten Menschen
  rationale: Die formale Gestalt des griechischen Idioms bleibt im Haupttext sichtbar, während die Fußnote klarstellt, dass damit Menschen bezeichnet werden, die durch Ungehorsam gekennzeichnet sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Pluralaufforderung „Lasst euch“ ist gut verständlich; „leere Worte“, „Zorn Gottes“ und „Söhne des Ungehorsams“ bewahren Bildsprache, theologisches Gewicht und die idiomatische Spannung des Ausgangstextes.
