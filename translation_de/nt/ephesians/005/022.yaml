  source_fidelity: Die Wiedergabe trifft γυναῖκες als „Ehefrauen“, ἰδίοις ἀνδράσιν als „euren eigenen Ehemännern“, ὡς als „wie“ und τῷ κυρίῳ als „dem Herrn“ sachgerecht. Dass in Vers 22 kein eigenes Verb ergänzt wird, entspricht der Ellipse des griechischen Textes und dessen Abhängigkeit von Vers 21.
  naturalness: Die Fassung mit bloßem Komma („Ihr Ehefrauen, euren eigenen Ehemännern ...“) ist im Deutschen unnötig schwer lesbar und lässt die gewollte Ellipse wie einen Satzbruch wirken. Ein Doppelpunkt markiert die fragmentarische, vom Vorvers abhängige Konstruktion verständlich, ohne ein nicht im Vers stehendes Verb einzuführen.
  terminology: „Ehefrauen“, „eigenen Ehemännern“ und „dem Herrn“ sind registergerecht und terminologisch angemessen. Die Fußnote sollte präzise von englischen Übersetzungen sprechen, da dies der auditierte Befund ist, und die syntaktische Abhängigkeit vom vorhergehenden Satzteil benennen.
