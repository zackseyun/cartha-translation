  text: Wives[a], to your own husbands as to the Lord,
translation:
  language: de
  text: 'Ihr Ehefrauen: euren eigenen Ehemännern wie dem Herrn[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Viele englische Übersetzungen ergänzen aus Vers 21 das Verb: „Ihr Ehefrauen, ordnet euch euren eigenen Ehemännern unter wie dem Herrn.“ Der griechische Wortlaut von Vers 22 selbst ist elliptisch und hängt vom vorhergehenden Satzteil ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Ihr Ehefrauen
  rationale: Im Zusammenhang der Weisungen für den Haushalt bezeichnet γυνή hier Ehefrauen, nicht Frauen im Allgemeinen. „Ihr“ macht die direkte Anrede im Deutschen natürlich kenntlich.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: euren eigenen Ehemännern
  rationale: ἀνήρ bedeutet in diesem ehelichen Zusammenhang „Ehemann“. „Eigenen“ gibt ἰδίοις ausdrücklich wieder und bezeichnet die jeweilige konkrete Ehebeziehung.
- source_word: ὡς
  choice: wie
  rationale: „Wie“ bewahrt den knappen Vergleich, ohne dessen genaue Reichweite über den griechischen Wortlaut hinaus festzulegen.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: κύριος bezeichnet im paulinischen Zusammenhang hier den Herrn Jesus; der bestimmte Artikel wird im Deutschen mit „dem“ wiedergegeben.
- source_word: implicit verb from context
  choice: kein Verb im Haupttext ergänzt
  rationale: Vers 22 enthält im SBLGNT kein eigenes Verb, sondern hängt syntaktisch von ὑποτασσόμενοι in Vers 21 ab. Die Ellipse bleibt deshalb im Haupttext erhalten und wird in der Fußnote erläutert.
theological_decisions:
- issue: Soll „ordnet euch unter“ trotz seines Fehlens in Vers 22 ergänzt werden?
  choice: Das Verb wird im Haupttext nicht ergänzt; die elliptische Form bleibt erhalten.
  alternative: Ihr Ehefrauen, ordnet euch euren eigenen Ehemännern unter wie dem Herrn.
  rationale: Der Sinn „ordnet euch unter“ wird aus Vers 21 übernommen, steht aber nicht ausdrücklich im griechischen Wortlaut von Vers 22. Die Ellipse wahrt die Abhängigkeit vom vorhergehenden Satz und vermeidet, eine kontextuell erschlossene Ergänzung als Wortlaut dieses Verses auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Satzellipse ist bewusst beibehalten, da sie ein echtes Merkmal des griechischen Ausgangstextes ist; die Fußnote sichert die Verständlichkeit.
