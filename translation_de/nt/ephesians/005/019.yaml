  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: de
  text: indem ihr zueinander mit Psalmen, Lobgesängen und geistlichen Liedern redet[a], dem Herrn singt und in euren Herzen Melodien erklingen lasst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „untereinander“ beziehungsweise „zu euch selbst“; das griechische Reflexivpronomen wird im Plural häufig wechselseitig verstanden: „zueinander“.'
    reason: lexical_alternative
  - marker: b
    text: Oder „Lob singt“ beziehungsweise „musiziert“; das griechische Wort kann das Singen von Lob oder das Hervorbringen einer Melodie bezeichnen, ohne hier instrumentale Begleitung zwingend vorauszusetzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: indem ihr … redet
  rationale: Das Partizip wird als modale Fortführung des vorhergehenden Satzes wiedergegeben. „Redet“ bewahrt den weiten Sinn des Verbs, ohne eine förmliche Anrede vorauszusetzen.
- source_word: ἑαυτοῖς
  choice: zueinander
  rationale: Das Reflexivpronomen hat im pluralischen Gemeinschaftskontext sehr wahrscheinlich reziproke Bedeutung. „Zueinander“ ist im Deutschen natürlich und bewahrt zugleich die mögliche Nuance des gemeinschaftlichen Austauschs.
- source_word: ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς
  choice: mit Psalmen, Lobgesängen und geistlichen Liedern
  rationale: Die dreigliedrige Folge bleibt erhalten. „Psalmen“ gibt ψαλμοί direkt wieder; „Lobgesänge“ ist für ὕμνοι verständlicher als das im heutigen Deutsch enger konnotierte „Hymnen“; „geistliche Lieder“ wahrt die Offenheit von πνευματικαῖς, ohne ausdrücklich Inspiration zu behaupten.
- source_word: ᾄδοντες
  choice: singt
  rationale: Die finite Wiedergabe ist in der deutschen Fortführung nach „indem“ natürlich und entspricht dem klaren Grundsinn des Partizips.
- source_word: ψάλλοντες
  choice: Melodien erklingen lasst
  rationale: Die Formulierung bewahrt den musikalischen und lobpreisenden Sinn, legt aber weder instrumentale Begleitung noch deren Ausschluss fest.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: in eurem Herzen
  rationale: Der Dativ wird als Bereich verstanden. Die Formulierung bleibt nahe am griechischen Singular καρδίᾳ und vermeidet, ihn durch „von Herzen“ ausschließlich als Aussage über Aufrichtigkeit zu deuten.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ bezeichnet den Adressaten des Singens und Musizierens. κύριος wird ohne zusätzliche Identifizierung schlicht mit „Herr“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von ψάλλοντες für die musikalische Praxis
  choice: Als „Melodien erklingen lasst“ wiedergegeben, ohne eine instrumentale Begleitung festzuschreiben.
  alternative: „Loblieder singt“, „musiziert“ oder „auf Instrumenten spielt“
  rationale: ψάλλω kann im damaligen Sprachgebrauch Singen beziehungsweise musikalisches Loben bezeichnen, verlangt hier aber keine Aussage über Instrumente. Die Übersetzung entscheidet daher keine konfessionelle Streitfrage.
- issue: Bezug von „dem Herrn“
  choice: Die Bezeichnung „dem Herrn“ bleibt ohne ausdrückliche Ergänzung stehen.
  alternative: „dem Herrn Jesus“
  rationale: Der Zusammenhang kann auf Christus weisen, doch der Vers selbst nennt nur κύριος. Die Übersetzung bewahrt diese Formulierung.
- issue: Bedeutung von πνευματικαῖς
  choice: „geistlichen“
  alternative: „vom Geist eingegebenen“
  rationale: Das Adjektiv kann einen Bezug zum Geist tragen, doch die stärkere Aussage einer unmittelbaren Eingebung wird durch die Form allein nicht zwingend festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform mit „indem“ wahrt den Anschluss der griechischen Partizipien an den vorausgehenden Kontext. Die musikalische Bildsprache bleibt verständlich, ohne eine bestimmte Gottesdienstpraxis festzulegen.
