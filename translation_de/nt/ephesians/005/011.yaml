  source_fidelity: 'Die Übersetzung gibt die beiden Imperative und ihre Gegenüberstellung zuverlässig wieder: συγκοινωνεῖτε als aktive Teilhabe, ἔργοις τοῖς ἀκάρποις τοῦ σκότους als „unfruchtbare Werke der Finsternis“ und ἐλέγχετε im kontextgemäßen Sinn des Aufdeckens. „Sie“ bezieht sich eindeutig auf die Werke. Das steigernde μᾶλλον δὲ καί ist durch „sondern ... vielmehr“ idiomatisch und ausreichend markiert, ohne den deutschen Satz zu überladen.'
