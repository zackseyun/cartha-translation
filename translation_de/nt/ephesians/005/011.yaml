  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: de
  text: Und beteiligt euch nicht an den unfruchtbaren Werken der Finsternis, sondern deckt sie vielmehr auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weist sie vielmehr zurecht“ beziehungsweise „überführt sie“. Das griechische Wort kann eine tadelnde Zurechtweisung bezeichnen; im Zusammenhang von Licht und Finsternis schwingt zugleich das Offenlegen solcher Werke mit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: beteiligt euch an
  rationale: Das Verb bezeichnet gemeinschaftliche Teilhabe oder Mitwirkung. „Sich an etwas beteiligen“ ist im heutigen Deutsch natürlich und gibt die aktive Verstrickung treffend wieder.
- source_word: ἔργοις
  choice: Werken
  rationale: „Werke“ bewahrt die für Paulus charakteristische Begrifflichkeit und entspricht dem griechischen Ausdruck eng, ohne im Deutschen unverständlich zu sein.
- source_word: ἀκάρποις
  choice: unfruchtbaren
  rationale: Die Wiedergabe erhält die Fruchtmetaphorik des griechischen Wortes und den Zusammenhang mit der „Frucht des Lichts“ in Vers 9.
- source_word: σκότους
  choice: der Finsternis
  rationale: Der Genitiv wird unmittelbar wiedergegeben. „Finsternis“ bewahrt sowohl die bildhafte als auch die moralische Dimension.
- source_word: μᾶλλον δὲ καὶ
  choice: sondern ... vielmehr
  rationale: 'Die Formulierung markiert den starken Gegensatz und die weiterführende Forderung: Nicht nur Nichtbeteiligung, sondern aktives Aufdecken ist geboten. Das griechische καί wird im Deutschen nicht eigens mit „auch“ oder „sogar“ ausgedrückt, da dies hier schwerfällig wäre; seine steigernde Kraft kommt durch den Gesamtkontrast zur Geltung.'
- source_word: ἐλέγχετε
  choice: deckt sie ... auf
  rationale: Im Licht-Finsternis-Kontext bezeichnet das Verb das Offenlegen und kenntlich Machen verwerflicher Werke, kann jedoch zugleich Zurechtweisung oder Überführung einschließen. „Aufdecken“ erhält den Bildzusammenhang, ohne die Bedeutung auf bloßen Tadel zu verengen.
theological_decisions:
- issue: Bedeutung von ἐλέγχετε gegenüber den Werken der Finsternis
  choice: deckt sie auf
  alternative: weist sie zurecht / überführt sie
  rationale: Die folgenden Verse sprechen davon, dass das Licht Dinge sichtbar macht. Daher steht das Offenlegen im Vordergrund; die mögliche Bedeutung moralischer Zurechtweisung bleibt in einer Fußnote ausdrücklich erhalten.
- issue: Kraft des imperativischen Gegensatzes
  choice: beteiligt euch nicht ... sondern deckt sie vielmehr auf
  alternative: habt keine Gemeinschaft ... sondern weist sie zurecht
  rationale: 'Die Übersetzung erhält die zweifache Forderung des Textes: keine Teilhabe am Bösen und zugleich ein aktives Entgegentreten, ohne eine bestimmte Vorgehensweise einzutragen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Finsternis“ und „Werke“ bewahren die paulinische Bild- und Begriffswelt; die Satzform bleibt knapp und imperativisch.
