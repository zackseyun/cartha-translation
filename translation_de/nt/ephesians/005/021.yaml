translation:
  language: de
  text: indem ihr euch einander in der Furcht vor dem Messias[a][b] unterordnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Ehrfurcht vor dem Messias“ oder „in ehrfürchtiger Scheu vor dem Messias“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch Χριστοῦ („Christus“); hier mit „dem Messias“ wiedergegeben, weil Χριστός als Titel verstanden wird.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: indem ihr euch … unterordnet
  rationale: Das Präsenspartizip führt die vorausgehende Satzkonstruktion weiter. Die deutsche Nebensatzform mit „indem“ bewahrt den begleitenden, fortdauernden Sinn; das reflexive „euch“ ist im Deutschen für diese aktive Wendung idiomatisch erforderlich, ohne darüber hinaus eine besondere Reflexivität zu behaupten.
- source_word: ἀλλήλοις
  choice: einander
  rationale: Der reziproke Dativ wird knapp und natürlich mit „einander“ wiedergegeben.
- source_word: ἐν
  choice: in
  rationale: „In“ hält sich eng an die Präposition und bezeichnet hier die Haltung beziehungsweise den Beweggrund, in dem die Unterordnung geschieht.
- source_word: φόβῳ
  choice: Furcht
  rationale: „Furcht“ bewahrt den lexikalischen Kern und die theologische Spannung des Ausdrucks. Die kontextuell möglichen Nuancen „Ehrfurcht“ und „Scheu“ werden in einer Fußnote genannt.
- source_word: Χριστοῦ
  choice: dem Messias
  rationale: Χριστός wird hier als Titel verstanden und daher mit „Messias“ übersetzt. Der Genitiv nach φόβος wird im natürlichen Deutschen durch „vor“ ausgedrückt.
theological_decisions:
- issue: Bedeutung von φόβος gegenüber dem Messias
  choice: Furcht vor dem Messias
  alternative: Ehrfurcht vor Christus; vom Messias bewirkte Furcht
  rationale: 'Der Genitiv wird am naheliegendsten objektiv verstanden: Die Furcht beziehungsweise Ehrfurcht richtet sich auf den Messias. „Furcht“ bleibt im Haupttext stehen, damit die stärkere Formulierung nicht zu bloßem Respekt abgeschwächt wird.'
- issue: Wiedergabe von Χριστοῦ
  choice: dem Messias
  alternative: Christus
  rationale: In dieser Wendung bleibt der Titelcharakter von Χριστός erkennbar. Die traditionelle Wiedergabe „Christus“ wird als Alternative in der Fußnote bewahrt.
- issue: Gegenseitige Unterordnung
  choice: euch einander … unterordnet
  alternative: einander untergeordnet seid
  rationale: Die aktive deutsche Form ist natürlicher und gibt die gegenseitige Beziehung ausdrücklich wieder, ohne zu bestimmen, wie diese im folgenden Abschnitt konkret ausgestaltet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die mit „indem“ eingeleitete Form zeigt, dass der Vers syntaktisch an den vorausgehenden Zusammenhang anschließt. „Unterordnen“ wahrt die sachliche Stärke des griechischen Verbs; „Furcht“ erhält bewusst dessen Spannung.
