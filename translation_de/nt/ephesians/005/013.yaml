  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: de
  text: Doch alles, was vom Licht aufgedeckt wird, wird sichtbar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles wird sichtbar, wenn es vom Licht aufgedeckt wird.“ Das griechische Partizip und das Verb lassen sich eng aufeinander beziehen, wobei der Nachdruck entweder auf dem Aufdecken oder auf der daraus folgenden Sichtbarkeit liegen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend alles Betroffene; im modernen Deutschen gibt „alles“ den Sinn natürlicher wieder als „alle Dinge“.
- source_word: δὲ
  choice: Doch
  rationale: δέ führt im Zusammenhang einen milden Gegensatz beziehungsweise eine Weiterführung ein; „doch“ wahrt diesen Übergang in würdigem, natürlichem Deutsch.
- source_word: ἐλεγχόμενα
  choice: was ... aufgedeckt wird
  rationale: ἐλέγχω kann zurechtweisen, überführen oder aufdecken bedeuten. Mit dem Licht als handelnder Größe und dem folgenden φανεροῦται steht hier das Offenlegen im Vordergrund. Der Relativsatz gibt das passive Partizip idiomatisch wieder.
- source_word: ὑπὸ τοῦ φωτός
  choice: vom Licht
  rationale: ὑπό mit Genitiv bezeichnet hier die bewirkende Größe. Der bestimmte Artikel bleibt erhalten, da das Licht bereits im Kontext eingeführt ist.
- source_word: φανεροῦται
  choice: wird sichtbar
  rationale: Das Passiv von φανερόω bezeichnet hier das Sichtbarwerden beziehungsweise Offenbarwerden. „Wird sichtbar“ passt unmittelbar zum Lichtbild und lässt offen, ob der Akzent stärker auf Vorgang oder Ergebnis liegt.
theological_decisions:
- issue: Bedeutung von „das Licht“ im Kontext
  choice: „das Licht“ ohne nähere Bestimmung
  alternative: Christus, das Evangelium, moralische Wahrheit oder das Zeugnis der Glaubenden ausdrücklich als Referenten nennen
  rationale: Der nähere Kontext nennt die Glaubenden „Licht im Herrn“ und spricht vom Aufdecken der Werke der Finsternis. Der Vers selbst legt den Referenten jedoch nicht eindeutig auf eine einzige Deutung fest; die Metapher bleibt daher bewusst offen.
- issue: Syntaktisches Verhältnis von ἐλεγχόμενα und φανεροῦται
  choice: „alles, was vom Licht aufgedeckt wird, wird sichtbar“
  alternative: „Alles wird sichtbar, wenn es vom Licht aufgedeckt wird“
  rationale: Beide Fassungen geben die enge Beziehung zwischen dem passiven Partizip und dem Hauptverb wieder. Die gewählte Form liest das Partizip attributiv beziehungsweise konditional-relativ und bewahrt die Aussage, dass das Aufgedeckte sichtbar wird, ohne die syntaktische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Die Wiederholung „wird ... wird“ bildet die beiden griechischen Passivformen ab und bewahrt die enge sachliche Verbindung zwischen Aufdeckung und Sichtbarkeit.
