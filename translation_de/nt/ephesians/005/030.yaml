  text: because we are members of his body[a].
translation:
  language: de
  text: denn wir sind Glieder seines Leibes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen hinzu: „von seinem Fleisch und von seinen Gebeinen“.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage. „Denn“ gibt diesen erklärend-kausalen Zusammenhang im Deutschen natürlich und würdig wieder.
- source_word: μέλη
  choice: Glieder
  rationale: „Glieder“ bezeichnet Teile eines Leibes und bewahrt zugleich das im paulinischen Leibbild geläufige gemeinschaftliche Verständnis.
- source_word: ἐσμὲν
  choice: wir sind
  rationale: Der Präsens Indikativ wird unmittelbar und idiomatisch wiedergegeben.
- source_word: τοῦ σώματος
  choice: seines Leibes
  rationale: „Leib“ erhält das Körperbild und entspricht dem gehobenen, aber allgemein verständlichen biblischen Sprachgebrauch in Bezug auf Christus und die Gemeinde.
- source_word: αὐτοῦ
  choice: seines
  rationale: Das Genitivpronomen bezieht sich im Kontext auf Christus und wird daher als personale Besitzangabe wiedergegeben.
theological_decisions:
- issue: Ob die längere byzantinische Lesart „von seinem Fleisch und von seinen Gebeinen“ in den Haupttext aufgenommen wird
  choice: 'Es wird nur der vorgegebene SBLGNT-Text übersetzt: „denn wir sind Glieder seines Leibes“'
  alternative: „denn wir sind Glieder seines Leibes, von seinem Fleisch und von seinen Gebeinen“
  rationale: Der vorgegebene griechische Ausgangstext bietet die kürzere Lesart. Die längere Lesart wird nicht in den Haupttext aufgenommen, sondern als textkritische Variante transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Register. „Glieder seines Leibes“ bewahrt das paulinische Körperbild, ohne es erläuternd einzuengen.
