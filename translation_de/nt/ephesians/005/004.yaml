  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: de
  text: Auch Unanständigkeit, törichtes Gerede oder anstößige Witze[a] sind unangebracht[b]; stattdessen Danksagung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „derbe Späße“. Das griechische Wort kann allgemein auch Witz oder Schlagfertigkeit bezeichnen; hier ist es wegen des negativen Zusammenhangs abwertend gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gehören sich nicht“ oder „sind unangemessen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: Schamlosigkeit
  rationale: Der Begriff bezeichnet Schändliches oder Unanständiges. „Schamlosigkeit“ bewahrt die mögliche Breite zwischen unanständiger Rede und verwerflichem Verhalten, während der Zusammenhang besonders an sprachliche Äußerungen denken lässt.
- source_word: μωρολογία
  choice: törichtes Gerede
  rationale: Die Zusammensetzung bezeichnet törichte oder unsinnige Rede. „Törichtes Gerede“ ist verständlich, gegenwartsnah und gibt den ausdrücklichen Sprachbezug wieder.
- source_word: ἢ
  choice: oder
  rationale: Die Konjunktion verbindet das letzte Glied der Aufzählung; „oder“ entspricht ihrer üblichen Bedeutung und funktioniert im Deutschen natürlich.
- source_word: εὐτραπελία
  choice: anstößige Witze
  rationale: Das Wort kann außerhalb dieses Zusammenhangs auch Gewandtheit oder Witz bezeichnen. Hier erhält es durch die Zusammenstellung mit negativen Begriffen und durch οὐκ ἀνῆκεν eine abwertende Bedeutung. „Anstößige Witze“ bringt diesen kontextuellen Sinn verständlich zum Ausdruck.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: gehören sich nicht
  rationale: Die Wendung bewertet die genannten Dinge als unpassend oder unangemessen. „Gehören sich nicht“ ist eine natürliche deutsche Entsprechung und lässt den kollektiven Rückbezug erkennen.
- source_word: ἀλλὰ μᾶλλον
  choice: sondern vielmehr
  rationale: Die Formulierung gibt sowohl den starken Gegensatz als auch die verstärkende Funktion von μᾶλλον wieder.
- source_word: εὐχαριστία
  choice: Danksagung
  rationale: Das Substantiv bezeichnet dankbares Reden beziehungsweise das Aussprechen von Dank. „Danksagung“ bewahrt die substantivische Form und den Gegensatz zu den vorher genannten Äußerungen.
theological_decisions:
- issue: Reichweite von αἰσχρότης im sprachlichen Zusammenhang
  choice: „Schamlosigkeit“ verwenden und damit die begriffliche Breite bewahren, während der Kontext einen besonderen Bezug auf unanständige Rede nahelegt.
  alternative: „Obszönes Reden“ oder „Unanständigkeit“
  rationale: Die benachbarten Begriffe betreffen ausdrücklich Rede, und auch Danksagung ist sprachlicher Ausdruck. Dennoch ist αἰσχρότης selbst breiter; die Übersetzung soll diese mögliche Spannung nicht unnötig auflösen.
- issue: Moralische Bewertung von εὐτραπελία
  choice: Im Haupttext negativ als „anstößige Witze“ wiedergeben.
  alternative: „Witz“ oder „Schlagfertigkeit“
  rationale: Obwohl das griechische Wort in anderem Gebrauch neutral oder positiv sein kann, bestimmen hier die negative Aufzählung und „gehören sich nicht“ seinen abwertenden Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist gegenüber dem Griechischen leicht geglättet. „Gehören sich nicht“ ist idiomatisch, aber nicht umgangssprachlich; „Danksagung“ erhält den nominalen und ethischen Kontrast des Ausgangstextes.
