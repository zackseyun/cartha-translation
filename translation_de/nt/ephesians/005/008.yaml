  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: de
  text: Denn einst wart ihr Finsternis, jetzt aber seid ihr Licht im Herrn. Lebt[a] als Kinder des Lichts!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Geht als Kinder des Lichts.“ Das griechische Wort für „gehen“ oder „umhergehen“ wird bei Paulus häufig als Bild für die Lebensführung gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: wart ihr
  rationale: Der Imperfekt von εἰμί bezeichnet den früheren Zustand unmittelbar und natürlich.
- source_word: γάρ
  choice: Denn
  rationale: γάρ begründet die vorangehende Ermahnung; „Denn“ bewahrt diese erklärende Verknüpfung.
- source_word: ποτε
  choice: einst
  rationale: „Einst“ ist knapp, würdevoll und hebt den Gegensatz zum jetzigen Zustand hervor.
- source_word: σκότος
  choice: Finsternis
  rationale: Das prädikative Substantiv wird nicht zu „in der Finsternis“ abgeschwächt; so bleibt die zugespitzte Identitätsaussage erhalten.
- source_word: νῦν δὲ
  choice: jetzt aber
  rationale: Die Wortfolge gibt den starken zeitlichen und adversativen Gegensatz natürlich wieder.
- source_word: φῶς
  choice: Licht
  rationale: Wie bei σκότος bleibt das prädikative Substantiv und damit die Aussage über ihre veränderte Identität erhalten.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die Formulierung bewahrt den paulinischen Gedanken, dass ihre neue Identität in der Beziehung und Zugehörigkeit zum Herrn besteht.
- source_word: ὡς
  choice: als
  rationale: „Als“ bezeichnet ein Verhalten, das ihrer Identität entspricht, nicht nur einen äußerlichen Vergleich.
- source_word: τέκνα φωτός
  choice: Kinder des Lichts
  rationale: τέκνα ist geschlechtsübergreifend; der Genitiv und das biblische Bild bleiben erhalten.
- source_word: περιπατεῖτε
  choice: Lebt
  rationale: Der Imperativ meint bildlich die gesamte Lebensführung. „Lebt“ vermittelt dies in heutigem Standarddeutsch; die wörtliche Wegmetapher wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Metaphorische Identitätsaussage „Finsternis“ und „Licht“
  choice: „ihr wart Finsternis … ihr seid Licht“
  alternative: „ihr wart in der Finsternis … ihr seid im Licht“
  rationale: Im Griechischen stehen beide Substantive prädikativ und ohne Präposition. Die starke Aussage über Identität und Verwandlung darf nicht zu einer bloßen Orts- oder Zustandsangabe abgeschwächt werden.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ entspricht dem neutestamentlichen Sprachgebrauch und bewahrt die theologische Tragweite, ohne die Bedeutung unnötig zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Finsternis“ und „im Herrn“ bewahren die prägnante biblisch-theologische Sprache; „Lebt“ vermeidet das heute altertümliche „Wandelt“, während die Fußnote die griechische Wegmetapher offenlegt.
