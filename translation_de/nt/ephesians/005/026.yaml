id: EPH.5.26
reference: Ephesians 5:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα αὐτὴν ἁγιάσῃ καθαρίσας τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: de
  text: damit er sie heilige[a], nachdem er sie durch das Wasserbad[b] mit dem Wort[c] gereinigt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit er sie heilig mache“.'
    reason: lexical_alternative
  - marker: b
    text: Das „Wasserbad“ erinnert wahrscheinlich an die Taufe; der griechische Wortlaut allein legt jedoch nicht fest, wie spezifisch sakramental dies zu verstehen ist.
    reason: cultural_note
  - marker: c
    text: 'Oder: „mit der Botschaft“. Das griechische Wort rhēma kann „Wort“, „Ausspruch“ oder „Botschaft“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck ein und gibt die finale Bedeutung im modernen Deutschen knapp und natürlich wieder.
- source_word: αὐτὴν
  choice: sie
  rationale: Das feminine Singularpronomen bezieht sich im Kontext auf die Gemeinde.
- source_word: ἁγιάσῃ
  choice: er sie heilige
  rationale: Der Konjunktiv nach ἵνα bezeichnet den beabsichtigten Zweck. „Heiligen“ bewahrt den Bezug zur Heiligkeit und bleibt im Deutschen verständlich und würdig.
- source_word: καθαρίσας
  choice: nachdem er sie … gereinigt hat
  rationale: Die temporale Wiedergabe stellt die zum Hauptverb vorausliegende Handlung des Aoristpartizips natürlich dar. Das im Griechischen mitverstandene Objekt wird im Deutschen als „sie“ ergänzt.
- source_word: τῷ λουτρῷ τοῦ ὕδατος
  choice: durch das Wasserbad
  rationale: „Durch“ gibt den instrumentalen Dativ wieder; „Wasserbad“ fasst die Genitivverbindung idiomatisch zusammen, ohne die Bildsprache aufzulösen.
- source_word: ἐν ῥήματι
  choice: mit dem Wort
  rationale: Die Formulierung lässt offen, ob das Wort als Mittel oder als begleitender Umstand gemeint ist. Der bestimmte Artikel ist im Deutschen kontextbedingt natürlich, obwohl er im Griechischen fehlt.
- source_word: ῥήματι
  choice: Wort
  rationale: ῥῆμα kann Wort, Ausspruch oder Botschaft bedeuten. „Wort“ bewahrt die lexikalische und theologische Offenheit, ohne eine bestimmte Verkündigung oder Taufformel festzulegen.
theological_decisions:
- issue: Verhältnis von Reinigung, Wasserbad und Wort in einem möglicherweise sakramentalen Zusammenhang
  choice: Die Bildsprache wird beibehalten, ohne eine bestimmte Tauf- oder Sakramentenlehre in den Text einzutragen.
  alternative: Eine ausdrücklich sakramentale Deutung oder eine ausschließlich metaphorische Deutung.
  rationale: Die Formulierung weckt wahrscheinlich Taufassoziationen, legt aber für sich allein nicht fest, wie spezifisch sakramental sie zu verstehen ist.
- issue: Bedeutungsumfang von ῥήματι
  choice: Im Haupttext steht „Wort“.
  alternative: „Botschaft“, „Ausspruch“ oder eine ausdrückliche Bezeichnung als Evangelium beziehungsweise Taufformel.
  rationale: Der Kontext kann an eine verkündigte Botschaft denken lassen, doch das griechische Wort bleibt weiter und soll nicht unnötig verengt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die participiale Konstruktion wird zur besseren Verständlichkeit als temporaler Nebensatz wiedergegeben. Die Formulierung wahrt die mögliche Taufanspielung sowie die Mehrdeutigkeit von ἐν ῥήματι.
