source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: de
  text: 'Denn alles, was sichtbar gemacht wird, ist Licht.[a] Darum heißt es: »Wach auf, du Schläfer, und steh auf von den Toten, und der Messias wird dir leuchten.«[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn alles, was aufgedeckt wird, ist Licht.« Das griechische Wort kann sowohl »sichtbar gemacht« als auch »aufgedeckt/offenbart« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Quelle dieses Zitats ist unbekannt. Möglicherweise greift es biblische Motive auf, besonders Jesaja 60,1, oder stammt aus einem frühen christlichen Lied.
    reason: cross_reference
  - marker: c
    text: 'Griechisch: »der Christus«. »Messias« und »Christus« geben denselben Titel wieder, nämlich »der Gesalbte«.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν τὸ φανερούμενον
  choice: alles, was sichtbar gemacht wird
  rationale: Die substantivierte neutrale Wendung wird allgemein mit »alles« wiedergegeben. Das Passiv bewahrt den Gedanken des Sichtbarmachens, ohne ihn vorschnell als bloßes Aufdecken von Schuld festzulegen.
- source_word: φῶς
  choice: Licht
  rationale: Die unmittelbare und bildhafte Entsprechung lässt die metaphorische Aussage unaufgelöst stehen.
- source_word: διὸ λέγει
  choice: Darum heißt es
  rationale: »Darum« gibt die Folgerung wieder; die unpersönliche Form wahrt, dass der griechische Text die Quelle oder den Sprecher des Zitats nicht nennt.
- source_word: Ἔγειρε, ὁ καθεύδων
  choice: Wach auf, du Schläfer
  rationale: Die Anrede wird in natürlichem, modernem Deutsch wiedergegeben und das Schlafbild bewahrt.
- source_word: ἀνάστα ἐκ τῶν νεκρῶν
  choice: steh auf von den Toten
  rationale: »Steh auf« erhält sowohl den gewöhnlichen Sinn des Aufstehens als auch den möglichen Anklang an Auferstehung; »von den Toten« entspricht der etablierten deutschen Wendung.
- source_word: ἐπιφαύσει σοι
  choice: wird über dir aufleuchten
  rationale: Die Formulierung bewahrt das Lichtbild und gibt die auf die angesprochene Person gerichtete Wirkung des Verbs idiomatisch wieder.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Der Artikel unterstützt hier die Funktion als Titel. »Messias« macht den Titelgehalt von Χριστός verständlich, statt das Wort nur wie einen Eigennamen zu behandeln.
theological_decisions:
- issue: Quelle des eingeführten Zitats
  choice: Unpersönlich mit »Darum heißt es« wiedergeben
  alternative: »Darum sagt die Schrift« oder »Darum sagt er«
  rationale: Der griechische Text nennt weder Sprecher noch Quelle. Die Übersetzung lässt daher offen, ob Schriftmotive, eine frühchristliche Liedzeile oder eine andere überlieferte Formulierung vorliegt.
- issue: Aussage πᾶν τὸ φανερούμενον φῶς ἐστιν
  choice: »alles, was sichtbar gemacht wird, ist Licht«
  alternative: »alles, was aufgedeckt wird, ist Licht«
  rationale: Die sprachlich und theologisch anspruchsvolle Gleichsetzung bleibt erhalten, ohne sie zu »wird durch das Licht sichtbar« umzudeuten.
- issue: Wiedergabe von ὁ Χριστός
  choice: »der Messias«
  alternative: »der Christus« oder »Christus«
  rationale: An dieser Stelle ist Χριστός aufgrund des Artikels deutlich als Titel lesbar. Die Übersetzung bewahrt diese Titelfunktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Anrede des Zitats bleibt knapp und einprägsam. »Darum heißt es« vermeidet eine nicht im Ausgangstext vorgenommene Bestimmung der Zitatquelle; »aufleuchten« hält das leitende Lichtmotiv fest.
