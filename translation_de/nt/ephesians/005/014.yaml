  naturalness: „Denn alles, was sichtbar gemacht wird, ist Licht“ und „Darum heißt es“ sind modernes, würdiges Standarddeutsch. „Der Messias wird dir leuchten“ ist idiomatisch und bildet sowohl die auf die angesprochene Person gerichtete Aussage als auch das Lichtbild genauer ab. Die Satzzeichen des Zitats sollten die griechische Fortführung mit „und“ nicht durch ein Ausrufezeichen unterbrechen.
  terminology: „der Messias“ ist als Wiedergabe von ὁ Χριστός angemessen; die Fußnote erläutert die traditionelle Alternative „Christus“, ohne den Titelgehalt zu verlieren. Die Fußnotenanker sind nach der Revision eindeutig und inhaltlich passend gesetzt.
