id: EPH.5.23
reference: Ephesians 5:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: de
  text: Denn der Mann ist das Haupt seiner Frau, wie auch der Messias das Haupt der Gemeinde ist – er selbst, der Retter des Leibes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „er selbst Retter des Leibes“. Die Wendung kann als hervorgehobene nähere Bestimmung des Messias verstanden werden.'
    reason: syntaktische_ambiguität
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: ἀνήρ / γυνή
  choice: der Mann / seine Frau
  rationale: Im unmittelbaren Kontext der Ehebeziehung sind die relationalen Bedeutungen gemeint. Das Possessivpronomen verdeutlicht im Deutschen diese Zuordnung, ohne den Sinn zu erweitern.
- source_word: κεφαλή
  choice: Haupt
  rationale: Bewahrt die griechische Metapher in beiden Vergleichsgliedern und legt sie nicht einseitig als Autorität, Vorrang oder Ursprung aus.
- source_word: ὡς καὶ
  choice: wie auch
  rationale: Erhält die vergleichende Struktur, ohne beide Beziehungen vollständig gleichzusetzen.
- source_word: Χριστός
  choice: Messias
  rationale: Gibt den hier wirksamen Titelsinn wieder.
- source_word: ἐκκλησία
  choice: Gemeinde
  rationale: Bezeichnet hier die Gemeinschaft der Glaubenden; „Gemeinde“ ist im deutschen neutestamentlichen Sprachgebrauch verständlich und vermeidet die mögliche Verengung auf eine Institution oder ein Gebäude.
- source_word: αὐτός
  choice: er selbst
  rationale: Bewahrt die emphatische Hervorhebung des Messias.
- source_word: σωτήρ
  choice: Retter
  rationale: Gibt die rettende Funktion klar und in heutigem Deutsch wieder, ohne den christologischen Gehalt abzuschwächen.
- source_word: σῶμα
  choice: Leib
  rationale: Bewahrt die paulinische Körpermetapher und ihre traditionelle Verbindung mit der Gemeinde.
theological_decisions:
- issue: Bedeutung von κεφαλή im Vergleich zwischen Ehe und Gemeinde
  choice: Die Metapher „Haupt“ bleibt unaufgelöst stehen.
  alternative: Oberhaupt, Ursprung oder derjenige, der Autorität ausübt
  rationale: Die möglichen Bedeutungsnuancen sind umstritten. Die Übersetzung soll weder eine Autoritäts- noch eine Ursprungsauslegung in den Text eintragen.
- issue: Syntaktische Beziehung von αὐτὸς σωτὴρ τοῦ σώματος
  choice: 'Apposition mit ausdrücklichem „er selbst“: „er selbst, der Retter des Leibes“'
  alternative: „wobei er selbst der Retter des Leibes ist“ oder „als Retter des Leibes“
  rationale: Die knappe nominativische Wendung wird als hervorgehobene nähere Bestimmung des Messias wiedergegeben, ohne eine im Griechischen nicht ausdrücklich vorhandene kausale oder modale Beziehung festzulegen.
- issue: Bezug von „Leib“
  choice: „des Leibes“ ohne ergänztes Possessivpronomen
  alternative: „seines Leibes“
  rationale: Das Griechische nennt kein Possessivpronomen. Der kontextuelle Bezug zur Gemeinde bleibt erkennbar, während die formale Offenheit gewahrt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haupt“ und „Leib“ bewahren die zusammengehörigen Metaphern; der Gedankenstrich macht die knappe appositionelle Fortführung verständlich. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
