  verdict: approve
  source_fidelity: 'Die Übersetzung bildet die griechische Struktur und den Sinn zuverlässig ab: ὅτι als begründendes „Denn“, ἀνήρ/γυνή im ehelichen Sinn, die zweimalige Metapher κεφαλή als „Haupt“, den Vergleich ὡς καί sowie die emphatische appositionelle Wendung αὐτὸς σωτὴρ τοῦ σώματος. „seiner Frau“ ist im generisch-distributiven deutschen Satzbau eine natürliche Wiedergabe und fügt keine sachliche Einschränkung hinzu. „des Leibes“ bewahrt zutreffend das im Griechischen nicht explizierte Possessivverhältnis.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „Haupt“ und „Leib“ sind bewusst gehoben, aber als zusammengehörige paulinische Metaphern idiomatisch und verständlich. Der Gedankenstrich gliedert die knappe appositionelle Fortführung klar, ohne deren Sinn festzulegen.
  terminology: „Messias“ entspricht der dokumentierten Titelentscheidung für Χριστός; „Gemeinde“ ist für ἐκκλησία in diesem Kontext gut geeignet. „Haupt“ erhält die umstrittene Metapher offen, statt sie als „Oberhaupt“, „Autorität“ oder „Ursprung“ auszudeuten. „Retter“ gibt σωτήρ in gegenwärtigem Deutsch angemessen wieder.
