source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: de
  text: Werdet als geliebte Kinder also Nachahmer Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seid also Nachahmer Gottes«; der griechische Imperativ kann sowohl das Werden als auch ein fortdauerndes Sein betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Werdet
  rationale: Der Imperativ Präsens von γίνομαι kann einen Prozess oder ein Eintreten in einen Zustand ausdrücken. »Werdet« bewahrt diesen Aufforderungs- und Prozesscharakter; die mögliche fortdauernde Bedeutung wird in der Fußnote offengehalten.
- source_word: οὖν
  choice: also
  rationale: »Also« markiert in natürlichem modernem Deutsch die Folgerung aus dem vorangehenden Gedankengang.
- source_word: μιμηταὶ
  choice: Nachahmer
  rationale: Das Substantiv bezeichnet Menschen, die jemanden nachahmen. »Nachahmer« erhält das ausdrückliche Motiv der Nachahmung genauer als das allgemeinere »Nachfolger«.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der griechische Genitiv wird im Deutschen knapp und idiomatisch mit »Gottes« wiedergegeben.
- source_word: ὡς
  choice: als
  rationale: »Als« bewahrt die knappe Aussage über Rolle, Art oder Grundlage der Aufforderung, ohne den möglichen Sinn ausdrücklich auf eine rein kausale Lesart festzulegen.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα ist geschlechtsübergreifend und bezeichnet die kindliche Beziehung; »Kinder« ist präzise und natürlich.
- source_word: ἀγαπητά
  choice: geliebte
  rationale: »Geliebte« gibt den liebevollen Beziehungsgehalt von ἀγαπητά würdig und knapp wieder.
theological_decisions:
- issue: Verhältnis der Aufforderung zur Gotteskindschaft
  choice: Die Gläubigen werden als geliebte Kinder dazu aufgefordert, Gott nachzuahmen; der Text sagt nicht, dass sie durch Nachahmung erst zu Gottes Kindern werden.
  alternative: 'Die Wendung kann lockerer als Vergleich verstanden werden: Gott so nachahmen, wie geliebte Kinder es tun.'
  rationale: Die Übersetzung mit »als geliebte Kinder« erhält die syntaktische Offenheit zwischen Art und Grundlage der Aufforderung und fügt keine weitergehende Lehraussage über die Gotteskindschaft hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die knappe Zuordnung »als geliebte Kinder« gut lesbar, ohne ihre syntaktische und theologische Offenheit aufzulösen.
