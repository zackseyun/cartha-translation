lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung zur vorausgehenden Aufforderung ein und bewahrt den Zusammenhang natürlich.
- source_word: καρπὸς
  choice: Frucht
  rationale: Bewahrt das paulinische Bild für hervorgebrachte Eigenschaften und Wirkungen.
- source_word: τοῦ φωτός
  choice: des Lichts
  rationale: Gibt den Genitiv direkt wieder und nimmt das Lichtmotiv aus Vers 8 auf.
- source_word: ἐν
  choice: zeigt sich in
  rationale: Drückt hier verständlich den Bereich beziehungsweise die Erscheinungsform der Frucht aus, ohne eine räumliche Bedeutung nahezulegen.
- source_word: πάσῃ
  choice: lauter
  rationale: Gibt bei den abstrakten Substantiven den umfassenden Sinn idiomatisch wieder.
- source_word: ἀγαθωσύνῃ
  choice: Güte
  rationale: Bezeichnet moralische Güte und wohltätiges Gutsein, ohne den Sinn auf Freundlichkeit zu verengen.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: Deckt im Deutschen sowohl rechtschaffenes Handeln als auch den Bezug zur Gerechtigkeit ab.
- source_word: ἀληθείᾳ
  choice: Wahrheit
  rationale: Bewahrt die Weite zwischen objektiver Wahrheit und persönlicher Wahrhaftigkeit.
theological_decisions:
- issue: Textvariante in der Genitivverbindung
  choice: Frucht des Lichts
  alternative: Frucht des Geistes
  rationale: SBLGNT liest φωτός; dies passt unmittelbar zum Aufruf, als Kinder des Lichts zu leben. Die bekannte Variante wird in einer Fußnote bewahrt.
- issue: Bedeutungsweite von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Gerechtigkeit ist die übliche und semantisch breite Wiedergabe; Rechtschaffenheit kann hier besonders die moralische Lebensführung hervorheben.
- issue: Funktion von ἐν
  choice: zeigt sich in
  alternative: besteht in
  rationale: Die Formulierung versteht ἐν als Bereich beziehungsweise Ausdrucksweise der Frucht, ohne abschließend zu behaupten, die drei Eigenschaften seien ihre vollständige Definition.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zeigt sich in« vermeidet die unnatürliche Formulierung »ist in« und wahrt zugleich die Offenheit von ἐν besser als das stärker definierende »besteht in«. Alle Fußnotenmarker stehen im Haupttext.
