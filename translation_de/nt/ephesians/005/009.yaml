translation:
  language: de
  text: Denn die Frucht des Lichts zeigt sich in lauter Güte, Gerechtigkeit[a] und Wahrheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rechtschaffenheit«.'
