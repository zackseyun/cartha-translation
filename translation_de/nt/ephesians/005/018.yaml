  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: de
  text: Und berauscht euch nicht mit Wein, denn darin liegt Zügellosigkeit, sondern lasst euch mit dem Geist erfüllen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lasst euch im Geist erfüllen“; einige verstehen πνεῦμα hier allgemeiner als „Geist“, etwa als den menschlichen Geist.'
    reason: Die anarthrische Wendung ἐν πνεύματι lässt neben der im Haupttext gewählten Deutung auf den Heiligen Geist unterschiedliche Nuancen der Präposition und eine allgemeinere Referenz von πνεῦμα zu.
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: berauscht euch nicht
  rationale: Der verneinte Präsensimperativ bezeichnet ein untersagtes Verhalten. Die reflexive deutsche Wendung ist natürlich und erfasst sowohl Vorgang als auch Zustand des Betrunkenseins.
- source_word: οἴνῳ
  choice: mit Wein
  rationale: Der Dativ bezeichnet hier das berauschende Mittel beziehungsweise die betreffende Substanz; „mit Wein“ ist im Deutschen idiomatisch.
- source_word: ἐν ᾧ
  choice: das führt zu
  rationale: Das Relativpronomen verweist grammatisch auf den Wein, sachlich jedoch auf den damit verbundenen Rausch. Die Wiedergabe macht den Zusammenhang natürlich verständlich, ohne die Aussage unnötig auf den Stoff Wein an sich zu verengen.
- source_word: ἀσωτία
  choice: zügelloses Leben
  rationale: Das Wort bezeichnet verschwenderisches, haltloses und moralisch ungezügeltes Verhalten. „Zügelloses Leben“ ist verständlich und bewahrt die ethische Tragweite.
- source_word: πληροῦσθε
  choice: lasst euch erfüllen
  rationale: Die passive Imperativform wird im Deutschen natürlich mit „lasst euch“ wiedergegeben. Der Präsenscharakter legt ein fortdauerndes beziehungsweise wiederholtes Geschehen nahe, ohne dass dies ausdrücklich ergänzt werden muss.
- source_word: ἐν πνεύματι
  choice: vom Geist
  rationale: Bei πληρόω kann ἐν mit Dativ Mittel, Sphäre oder inhaltliche Bestimmung anzeigen. „Vom Geist erfüllen“ ist idiomatisches Deutsch und versteht πνεῦμα im Kontext wahrscheinlich als den Heiligen Geist, ohne die griechische Konstruktion übermäßig auszudeuten.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: der Geist, verstanden als der Heilige Geist
  alternative: Geist im allgemeinen Sinn beziehungsweise der menschliche Geist
  rationale: Im paulinischen Kontext liegt der Bezug auf Gottes Geist nahe. Da πνεύματι ohne Artikel steht und die Konstruktion auch anders verstanden werden kann, wird die Alternative in einer Fußnote bewahrt.
- issue: Funktion von ἐν bei πληροῦσθε
  choice: „vom Geist“ als Urheber beziehungsweise wirkende Kraft
  alternative: „im Geist“ als Sphäre oder „mit Geist“ als Inhalt
  rationale: Die Präposition lässt mehrere eng verwandte Nuancen zu. Der Haupttext verwendet die natürlichste deutsche Formulierung; die Fußnote dokumentiert die genuine Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche bilden den erklärenden Relativsatz flüssig ab. „Zügelloses Leben“ vermeidet das heute teils enger sexuell verstandene „Ausschweifung“ und gibt die breitere Bedeutung von ἀσωτία wieder.
