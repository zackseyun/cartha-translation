id: EPH.5.2
reference: Ephesians 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: de
  text: und lebt in Liebe, so wie auch der Messias[a] uns geliebt und sich für uns[b] hingegeben hat – als Opfergabe und Opfer für Gott, zu einem wohlriechenden Duft[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »zu unseren Gunsten«. Die Wendung kann hier eine begünstigende oder stellvertretende Bedeutung haben.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung vom wohlriechenden Duft greift die alttestamentliche Opfersprache für eine Gott wohlgefällige Gabe auf.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: lebt
  rationale: Das griechische Verb bedeutet wörtlich »geht« bzw. »wandelt«, ist hier aber eine paulinische Metapher für die Lebensführung. »Lebt« gibt diese Bedeutung in modernem, natürlichem Deutsch wieder.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Bewahrt die Präpositionalfügung und lässt sowohl den Bereich als auch die Art der Lebensführung anklingen.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Der Artikel unterstützt hier das Verständnis als Titel. »Der Messias« gibt den Bedeutungsgehalt von Χριστός wieder; »Christus« bleibt als gebräuchliche Alternative in der Fußnote erhalten.
- source_word: ἠγάπησεν ἡμᾶς
  choice: uns geliebt
  rationale: Direkte Wiedergabe des Aorists; zugleich bleibt die Wortverbindung mit »Liebe« im ersten Satzteil erkennbar.
- source_word: παρέδωκεν ἑαυτὸν
  choice: sich hingegeben hat
  rationale: Gibt die freiwillige Selbsthingabe in diesem Opferzusammenhang präzise und idiomatisch wieder, ohne mehr auszusagen als der griechische Ausdruck.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: »Für uns« bewahrt die begünstigende und stellvertretende Bedeutungsbreite von ὑπέρ, ohne sie auf eine einzige dogmatische Deutung einzuengen.
- source_word: προσφορὰν καὶ θυσίαν
  choice: als Opfergabe und Opfer
  rationale: Beide griechischen Opferbegriffe werden unterschieden und nicht zu einem einzigen Ausdruck zusammengezogen. »Opfergabe« macht den kultischen Zusammenhang von προσφορά deutlich.
- source_word: τῷ θεῷ
  choice: für Gott
  rationale: Der Dativ bezeichnet hier den Empfänger beziehungsweise die Ausrichtung der Opfergabe; »für Gott« ist im Deutschen natürlich und sachlich passend.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: zu einem wohlriechenden Duft
  rationale: Bewahrt das konkrete Geruchsbild und den Anklang an die Opfersprache des Alten Testaments, ohne die Wendung rein abstrakt als »Gott wohlgefällig« aufzulösen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Χριστός steht mit Artikel und ist hier als Titel verständlich. Die Übersetzung macht dessen Bedeutung sichtbar, während die traditionelle Form in einer Fußnote genannt wird.
- issue: Bedeutung von ὑπὲρ ἡμῶν im Opferzusammenhang
  choice: für uns
  alternative: zu unseren Gunsten; an unserer Stelle
  rationale: Der Zusammenhang beschreibt die Selbsthingabe des Messias als Opfer. Die Präposition ὑπέρ kann dabei eine begünstigende oder stellvertretende Nuance tragen; »für uns« bewahrt diese theologische Spannung, ohne sie enger festzulegen.
- issue: Opfersprachlicher Ausdruck εἰς ὀσμὴν εὐωδίας
  choice: zu einem wohlriechenden Duft
  alternative: als ein Gott wohlgefälliges Opfer
  rationale: Die bildhafte Sprache wird beibehalten, statt ihre theologische Bedeutung unmittelbar auszudeuten. Die Fußnote weist auf den alttestamentlichen Opferhintergrund hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Lebt« vermeidet das heute altertümlich wirkende »wandelt«, während »in Liebe« und das konkrete Duftbild die Bildsprache des Ausgangstextes bewahren. Der Gedankenstrich verdeutlicht die appositionelle Bestimmung der Selbsthingabe als Opfer, ohne die Syntax inhaltlich umzudeuten.
