  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: de
  text: Ebenso sind auch die Ehemänner verpflichtet, ihre eigenen Frauen zu lieben wie ihre eigenen Körper. Wer seine eigene Frau liebt, liebt sich selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Ebenso
  rationale: Knüpft folgernd und vergleichend an das zuvor Gesagte an und ist im Deutschen natürlich und prägnant.
- source_word: ὀφείλουσιν
  choice: sind verpflichtet
  rationale: Gibt die moralische Verbindlichkeit des Verbs deutlicher wieder als ein bloßes „sollen“, ohne die Aussage in eine direkte Befehlsform umzuwandeln.
- source_word: καὶ
  choice: auch
  rationale: 'Bewahrt die additive Kraft: Auch die Ehemänner stehen unter der aus dem vorangehenden Vergleich folgenden Verpflichtung.'
- source_word: οἱ ἄνδρες
  choice: die Ehemänner
  rationale: Im Kontext der Eheordnung bezeichnet ἀνήρ verheiratete Männer; „Ehemänner“ ist daher eindeutiger als „Männer“.
- source_word: ἀγαπᾶν
  choice: zu lieben
  rationale: Bewahrt die wiederholte Wortverbindung mit ἀγαπάω und gibt den Ausdruck direkt und würdig wieder.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: ihre eigenen Frauen
  rationale: „Frauen“ bezeichnet hier aufgrund des Ehekontexts die Ehefrauen; „eigenen“ erhält die reflexive Hervorhebung von ἑαυτῶν.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: wie ihre eigenen Körper
  rationale: Bewahrt den ausdrücklichen Vergleich und gibt σώματα wörtlich mit „Körper“ wieder.
- source_word: ὁ ἀγαπῶν
  choice: Wer ... liebt
  rationale: Gibt das substantivierte Partizip idiomatisch als allgemeingültige Aussage wieder; der unmittelbare Kontext macht deutlich, dass vom Ehemann die Rede ist.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: seine eigene Frau
  rationale: Erhält sowohl den ehelichen Sinn von γυνή als auch die reflexive Betonung durch ἑαυτοῦ.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: liebt sich selbst
  rationale: Folgt dem reflexiven Pronomen und der Wiederholung des Verbs und bewahrt so die Argumentationslinie des Satzes.
theological_decisions:
- issue: Geschlechtsspezifische Sprache in der ehelichen Ermahnung
  choice: οἱ ἄνδρες wird mit „die Ehemänner“ wiedergegeben; ὁ ἀγαπῶν idiomatisch mit „Wer ... liebt“ innerhalb dieses eindeutig männlich-ehelichen Bezugs.
  alternative: „die Männer“ und „derjenige, der liebt“
  rationale: Der Abschnitt richtet sich konkret an Ehemänner, nicht allgemein an alle Männer. Das deutsche „Wer“ formuliert die Aussage natürlich, ohne ihren durch den Kontext bestimmten Bezug zu verändern.
- issue: Art des Vergleichs zwischen Ehefrau und eigenem Körper
  choice: Der Vergleich und seine Folgerung bleiben ohne erklärende Erweiterung stehen.
  alternative: Die Aussage im Haupttext als metaphysische Identität von Ehefrau und Körper auszudeuten.
  rationale: Der griechische Text verbindet die eheliche Liebe mit der Liebe zum eigenen Körper und folgert daraus Selbstliebe. Die Übersetzung bewahrt diese ethisch-theologische Spannung, ohne sie systematisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an Syntax und Wiederholungen des griechischen Textes, klingt jedoch natürlich. Keine Fußnote ist erforderlich.
