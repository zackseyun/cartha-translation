  source_fidelity: Die Wiedergabe von καιρός als „Gelegenheit“ trifft dessen opportunen Aspekt grundsätzlich. „Kauft die Gelegenheit aus“ ist jedoch keine geläufige oder klare deutsche Entsprechung von ἐξαγοράζομαι und kann den Eindruck eines tatsächlichen Erwerbs einer Gelegenheit erwecken. „Macht das Beste aus der Zeit“ gibt die kontextuelle Bedeutung des Partizips zuverlässig wieder; die Fußnote bewahrt die Kaufmetapher und den möglichen Sinn „günstige Gelegenheit“.
  naturalness: „Kauft die Gelegenheit aus“ wirkt im modernen Standarddeutsch deutlich unidiomatisch. „Macht das Beste aus der Zeit“ ist eine natürliche, würdige und klare Aufforderung. „Denn die Tage sind böse“ ist idiomatisch und bewahrt die prägnante, moralisch akzentuierte Sprache des Griechischen.
  terminology: „Zeit“ entspricht dem englischen Audit-Trail und ist als Haupttextwort gut verständlich, ohne den bei καιρός mitschwingenden Aspekt der günstigen Gelegenheit auszuschließen. Dieser Aspekt wird in der Fußnote präzisiert. „Böse“ ist für πονηραί treffend und sollte beibehalten werden.
