lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: Kauft … aus
  rationale: Die deutsche Wendung bewahrt das Bild des griechischen Verbs vom Auf- bzw. Auskaufen und ist zugleich als Aufforderung verständlich, eine Gelegenheit ganz zu nutzen. Der Partizipialanschluss an den vorausgehenden Kontext wird entsprechend dem deutschen Satzbau als Imperativ wiedergegeben.
- source_word: τὸν καιρόν
  choice: die Gelegenheit
  rationale: καιρός bezeichnet hier eher die günstige bzw. verfügbare Gelegenheit als abstrakte, fortlaufende Zeit. „Gelegenheit“ macht diesen Sinn im Deutschen deutlich.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet die Aufforderung. „Denn“ stellt diesen Begründungszusammenhang in einem eigenständigen deutschen Satz natürlich her; „weil“ wäre ebenfalls möglich.
- source_word: αἱ ἡμέραι
  choice: die Tage
  rationale: Die konkrete Ausdrucksweise des Ausgangstextes bleibt erhalten, ohne sie deutend zu „Zeiten“ oder „gegenwärtige Welt“ zu erweitern.
- source_word: πονηραί
  choice: böse
  rationale: „Böse“ bewahrt die moralische und feindselige Dimension von πονηρός; „schwierig“ oder „schlimm“ würde sie abschwächen.
theological_decisions:
- issue: Mögliche Deutung von ἐξαγοραζόμενοι als Erlösungsbegriff
  choice: Praktische Aufforderung, die Gelegenheit vollständig zu nutzen
  alternative: „Erlöst die Zeit“ bzw. „Kauft die Zeit frei“
  rationale: Im ermahnenden Zusammenhang bezeichnet das Verb den entschlossenen Gebrauch der verfügbaren Gelegenheit und nicht ausdrücklich eine heilsgeschichtliche Erlösung. Die beibehaltene Kaufmetapher lässt die Bildhaftigkeit stehen, ohne soteriologische Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kauft die Gelegenheit aus“ ist bewusst bildhaft und etwas markanter als die idiomatische Alternative „Nutzt die Zeit bestmöglich“; die Fußnote bewahrt sowohl die geläufige Sinnwiedergabe als auch die traditionelle zeitbezogene Form.
