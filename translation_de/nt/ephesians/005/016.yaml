translation:
  language: de
  text: Macht das Beste aus der Zeit[a], denn die Tage sind böse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Nutzt die günstige Gelegenheit. Wörtlich: Kauft den günstigen Zeitpunkt aus.'
