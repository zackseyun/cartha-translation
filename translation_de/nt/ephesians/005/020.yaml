id: EPH.5.20
reference: Ephesians 5:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: de
  text: indem ihr Gott, dem Vater, allezeit für alles[a] im Namen unseres Herrn Jesus, des Messias[b], dankt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „für alle Dinge“; grammatisch ist auch „für alle Menschen“ möglich, doch der Zusammenhang spricht eher für den umfassenden sachlichen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „Jesus Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: indem ihr … dankt
  rationale: Das präsentische Partizip führt die vorausgehende Aufforderung durch eine begleitende Handlung weiter. Die deutsche Konstruktion mit „indem“ bewahrt diesen syntaktischen Anschluss natürlicher als ein isolierter deutscher Partizipialsatz.
- source_word: πάντοτε
  choice: allezeit
  rationale: Gibt den umfassenden zeitlichen Sinn prägnant wieder und entspricht dem würdigen, aber weiterhin verständlichen biblischen Register.
- source_word: ὑπὲρ πάντων
  choice: für alles
  rationale: πάντων kann der Form nach sächlich oder männlich verstanden werden. Im Zusammenhang liegt der umfassende Bezug auf alles beziehungsweise alle Dinge näher; die mögliche personenbezogene Deutung wird in der Fußnote offengehalten.
- source_word: ἐν ὀνόματι
  choice: im Namen
  rationale: Bewahrt die geläufige biblische Wendung und lässt ihren repräsentativen beziehungsweise vermittelnden Gehalt stehen, ohne ihn ausdeutend einzuengen.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: κύριος wird als christologischer Titel mit „Herr“ wiedergegeben; das Possessivpronomen bewahrt ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός hat hier weiterhin Titelcharakter. Die Apposition „des Messias“ ist im Deutschen idiomatisch und macht den Titel deutlicher als die bloße Folge „Jesus Messias“.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Gott, dem Vater
  rationale: Der Dativ bezeichnet den Empfänger des Dankes. Die appositionelle deutsche Form gibt die auf dieselbe Person bezogenen Bezeichnungen θεός und πατήρ natürlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: des Messias
  alternative: Christus
  rationale: Die Übersetzung macht die Bedeutung des griechischen Titels sichtbar, ohne ihn zu einem bloßen Namensbestandteil werden zu lassen. Die traditionelle Form „Christus“ bleibt als Fußnotenalternative erhalten.
- issue: Bezug von πάντων in ὑπὲρ πάντων
  choice: für alles
  alternative: für alle Menschen
  rationale: Die Form ist grammatisch mehrdeutig. Der Kontext umfassender Dankbarkeit begünstigt den sachlichen Bezug, doch die mögliche männlich-personale Deutung wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Allezeit“ wahrt den biblischen Ton, ohne unverständlich zu sein. Die einleitende „indem“-Konstruktion kennzeichnet den syntaktischen Anschluss des griechischen Partizips an den vorausgehenden Satz.
