  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: de
  text: Ihr Männer, liebt eure Frauen, wie auch der Messias[a] die Gemeinde geliebt und sich für sie hingegeben hat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«. Der griechische Titel Χριστός bedeutet »Gesalbter«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich für sie ausgeliefert hat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: Ihr Männer
  rationale: Im Zusammenhang der Haustafel sind verheiratete Männer angesprochen. Die Verbindung mit »eure Frauen« macht die eheliche Beziehung im Deutschen eindeutig, ohne das schlichtere griechische Wort durch »Ehemänner« unnötig zu verengen.
- source_word: ἀγαπᾶτε … ἠγάπησεν
  choice: liebt … geliebt
  rationale: Die Wiederholung desselben deutschen Wortstamms bewahrt die im Griechischen beabsichtigte Verbindung zwischen dem Gebot und dem Vorbild des Messias.
- source_word: τὰς γυναῖκας
  choice: eure Frauen
  rationale: Im Ehekontext bezeichnet γυναῖκας die Ehefrauen der Angesprochenen. Das Possessivpronomen ist im Deutschen für die gemeinte Beziehung natürlich und sachlich im Kontext begründet.
- source_word: καθὼς καὶ
  choice: so wie auch
  rationale: Die Formulierung gibt sowohl den Vergleich als auch die hervorhebende beziehungsweise additive Kraft von καί in natürlichem Deutsch wieder.
- source_word: ὁ Χριστὸς
  choice: der Messias
  rationale: Χριστός steht mit Artikel und ist hier als Titel erkennbar. »Der Messias« gibt die Bedeutung des griechischen Titels unmittelbar wieder.
- source_word: τὴν ἐκκλησίαν
  choice: die Gemeinde
  rationale: ἐκκλησία bezeichnet hier das Gottesvolk als Gemeinschaft. »Gemeinde« ist im Deutschen ein geläufiges, kontextgemäßes Äquivalent, ohne den Bezug auf eine bloß örtliche Versammlung festzulegen.
- source_word: ἑαυτὸν παρέδωκεν
  choice: sich hingegeben hat
  rationale: Die Wendung drückt freiwillige Selbsthingabe aus. »Sich hingegeben hat« ist idiomatisch und bewahrt das Gewicht der Aussage, ohne zusätzliche Sühneterminologie einzutragen.
- source_word: ὑπὲρ αὐτῆς
  choice: für sie
  rationale: ὑπέρ mit Genitiv bedeutet hier »für« beziehungsweise »zugunsten von«. Das Pronomen verweist auf die Gemeinde zurück.
theological_decisions:
- issue: Wiedergabe von Χριστός im Vergleich zwischen Ehe und Gemeinde
  choice: der Messias
  alternative: der Christus / Christus
  rationale: Die Wiedergabe als »Messias« macht den Titelcharakter sichtbar. Die Alternative »Christus« ist im deutschen kirchlichen Sprachgebrauch vertrauter, kann jedoch stärker wie ein Eigenname wirken.
- issue: Aussageumfang von παρέδωκεν ὑπὲρ αὐτῆς
  choice: sich für sie hingegeben hat
  alternative: sich für sie ausgeliefert hat
  rationale: Die gewählte Fassung bewahrt die freiwillige, stellvertretend ausgerichtete Selbsthingabe, ohne ausdrücklich festzulegen, auf welche Weise sie geschah oder eine über den Wortlaut hinausgehende Sühnetheorie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede »Ihr Männer« bleibt nah am griechischen Ausdruck und wird durch »eure Frauen« eindeutig als Anrede an Ehemänner verstanden. Der Satzschluss mit Komma folgt dem vorgelegten Verssegment, das syntaktisch in den nächsten Zusammenhang weiterführt.
