base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: de
  text: Macht euch daher nicht mit ihnen gemein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Werdet daher nicht Mitteilhaber mit ihnen“ oder „Menschen, die mit ihnen Anteil haben“. Im Zusammenhang geht es um Beteiligung an ihrem sündigen Verhalten oder an dessen Folgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: nicht
  rationale: Verneint den Imperativ γίνεσθε; im Deutschen steht „nicht“ natürlich beim verneinten Aufforderungssatz.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Warnung in den Versen 3–6 und klingt in modernem Standarddeutsch klar und würdig.
- source_word: γίνεσθε
  choice: Werdet
  rationale: Bewahrt gegenüber einem bloßen „seid“ den Gedanken, nicht in einen solchen Zustand oder eine solche Verbindung einzutreten.
- source_word: συμμέτοχοι
  choice: Teilhaber
  rationale: Bezeichnet Menschen, die mit anderen an etwas Anteil haben. „Teilhaber“ erhält die personbezogene und zugleich inhaltlich offene Formulierung des Griechischen.
- source_word: αὐτῶν
  choice: ihre
  rationale: Der Genitiv hängt von συμμέτοχοι ab. „Ihre Teilhaber“ bildet diese Beziehung knapp ab, ohne das Gemeinte ausdrücklich auf Taten oder Folgen zu verengen.
theological_decisions:
- issue: Umfang der durch συμμέτοχοι αὐτῶν bezeichneten Beteiligung
  choice: 'Das Verbot bleibt allgemein formuliert: Die Leser sollen nicht zu Teilhabern dieser Menschen werden.'
  alternative: „Beteiligt euch nicht an ihren Taten“ oder „Habt keinen Anteil an ihrem Geschick“
  rationale: Der unmittelbare Zusammenhang legt eine Beteiligung an ihrem sündigen Verhalten und möglicherweise auch an dessen Folgen nahe. Der griechische Wortlaut nennt jedoch Personen („ihnen“) und keinen ausdrücklich bezeichneten Gegenstand der Beteiligung; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. „Teilhaber“ ist etwas gehobener, aber allgemein verständlich und bewahrt die Offenheit des griechischen Ausdrucks besser als eine explizite Ergänzung wie „an ihren Taten“.
