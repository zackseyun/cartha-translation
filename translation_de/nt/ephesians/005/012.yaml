  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: de
  text: Denn es ist schändlich, auch nur über das zu reden, was von ihnen im Verborgenen getan wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Denn es ist schändlich, auch nur davon zu reden, was sie im Verborgenen tun.'
    reason: Alternative natürliche Wiedergabe der substantivierten Passivkonstruktion τὰ ... γινόμενα ὑπ’ αὐτῶν.
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Aufforderung und bewahrt den argumentativen Zusammenhang.
- source_word: τὰ ... γινόμενα
  choice: was ... getan wird
  rationale: Der substantivierte Partizipialausdruck bezeichnet die betreffenden Handlungen. Die deutsche Was-Konstruktion gibt ihn natürlich wieder und bewahrt zugleich die passive Form.
- source_word: κρυφῇ
  choice: im Verborgenen
  rationale: Die adverbial gebrauchte Dativform bezeichnet verborgenes oder geheimes Handeln. „Im Verborgenen“ ist idiomatisch und stilistisch würdig.
- source_word: ὑπ’ αὐτῶν
  choice: von ihnen
  rationale: ὑπό mit Genitiv bezeichnet die handelnden Personen. Das Pronomen bleibt wie im griechischen Text ohne ausdrückliche Benennung seines kontextuellen Bezugs stehen.
- source_word: αἰσχρόν
  choice: eine Schande
  rationale: Die Wendung bringt die moralische Anstößigkeit deutlich und in natürlichem modernem Deutsch zum Ausdruck.
- source_word: καὶ λέγειν
  choice: davon auch nur zu reden
  rationale: 'καί hat hier steigernde Kraft: Selbst das Reden über diese Taten ist eine Schande. „Auch nur“ macht diese Funktion im Deutschen klar.'
theological_decisions:
- issue: Bezug von αὐτῶν
  choice: Das Pronomen wird als „ihnen“ wiedergegeben, ohne seinen Bezug im Vers ausdrücklich zu bestimmen.
  alternative: „von denen, die zur Finsternis gehören“ oder eine andere kontextuelle Ausdeutung
  rationale: Der unmittelbare Zusammenhang erschließt den Bezug, während der griechische Vers selbst nur das Pronomen verwendet. Eine ausdrückliche Benennung würde eine Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Satzstellung bewahrt die Hervorhebung dessen, was im Verborgenen geschieht; „eine Schande“ ist verständlich und trägt die ethische Wertung des griechischen Ausdrucks.
