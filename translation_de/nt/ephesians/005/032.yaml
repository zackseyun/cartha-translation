  terminology: „Geheimnis“ ist für μυστήριον im paulinischen Kontext etabliert; „Messias“ gibt den titularen Charakter von Χριστός wieder; „Gemeinde“ ist für ἐκκλησία sachgerecht. Die Fußnote erklärt die mögliche Bedeutungsspanne von μέγα, ohne den Haupttext interpretativ einzuengen.
