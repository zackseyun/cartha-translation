  source_fidelity: Der Entwurf gibt τὸ μυστήριον τοῦτο μέγα ἐστίν präzise als „Dieses Geheimnis ist groß“ wieder und bewahrt damit die offene Bedeutung von μέγα. „Ich aber“ gibt δέ als leichten Kontrast bzw. Übergang angemessen wieder. „den Messias und die Gemeinde“ entspricht Χριστόν καὶ ἐκκλησίαν und vermeidet eine konfessionell verengende Auslegung des Bezugs von „dieses Geheimnis“.
