base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: de
  text: Dieses Geheimnis ist groß[a]; ich aber spreche im Hinblick auf den Messias und die Gemeinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieses Geheimnis ist von großer Bedeutung.“ Das griechische Wort bedeutet wörtlich „groß“ und kann hier Größe, Tragweite oder Bedeutsamkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Im paulinischen Sprachgebrauch bezeichnet das Wort eine zuvor verborgene, von Gott offenbarte Wahrheit, nicht bloß etwas Rätselhaftes. „Geheimnis“ bewahrt den etablierten theologischen Sprachgebrauch, ohne den Bezug näher festzulegen.
- source_word: μέγα
  choice: groß
  rationale: „Groß“ gibt die direkte Bedeutung des griechischen Adjektivs wieder und lässt offen, ob vor allem Größe, Tragweite oder Bedeutsamkeit gemeint ist.
- source_word: δὲ
  choice: aber
  rationale: Die nachgestellte Formulierung „ich aber“ bildet den leichten Kontrast beziehungsweise Übergang zur Erläuterung des Paulus natürlich ab.
- source_word: λέγω
  choice: spreche
  rationale: „Ich spreche“ wahrt den verbalen Sinn der Präsensform; „ich meine“ wäre stärker deutend.
- source_word: εἰς
  choice: im Blick auf
  rationale: Nach λέγω bezeichnet εἰς hier den Bezug des Gesagten. „Im Blick auf“ ist im Deutschen idiomatisch und wahrt den erläuternden Charakter.
- source_word: Χριστόν
  choice: den Messias
  rationale: Χριστός hat hier deutlich titularen Sinn. „Messias“ macht diesen Titel im Deutschen erkennbar.
- source_word: ἐκκλησίαν
  choice: die Gemeinde
  rationale: Gemeint ist die Gemeinschaft des Gottesvolkes in ihrer korporativen Identität. „Gemeinde“ ist im deutschen neutestamentlichen Sprachgebrauch dafür klar und angemessen.
theological_decisions:
- issue: Bezug von „dieses Geheimnis“ innerhalb des Zusammenhangs von Ehe, Genesis 2,24, Messias und Gemeinde
  choice: Der Haupttext legt nicht fest, ob sich das Geheimnis unmittelbar auf die Ehe, das Zitat aus Genesis 2,24 oder dessen typologische Bedeutung für Messias und Gemeinde bezieht.
  alternative: Das Geheimnis ausdrücklich als die Ein-Fleisch-Verbindung der Ehe, als Genesis 2,24 selbst oder als deren typologische Erfüllung in Messias und Gemeinde bestimmen.
  rationale: Der griechische Text bezeichnet „dieses Geheimnis“ als groß und erläutert anschließend den Blickpunkt des Sprechens. Eine engere Festlegung würde die echte Auslegungsspannung des Textes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „ich aber“ wahrt den leichten Kontrast des Griechischen; das Semikolon macht den erläuternden Übergang klar. Die Formulierung vermeidet eine konfessionelle Festlegung des mehrdeutigen Bezugs von „dieses Geheimnis“.
