  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: de
  text: nach dem ewigen Vorsatz[a], den er im[b] Messias[c] Jesus, unserem Herrn, verwirklicht hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Vorsatz der Zeitalter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch den Messias Jesus“. Die griechische Präposition bedeutet „in“, kann hier aber auch instrumental verstanden werden.'
    reason: alternative_reading
  - marker: c
    text: Griechisch „Christus“; hier mit „Messias“ wiedergegeben, weil das Wort als Titel gebraucht wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: nach
  rationale: Mit dem Akkusativ bezeichnet κατά die Übereinstimmung mit einem Maßstab oder Plan. „Nach“ ist in der Verbindung „nach dem Vorsatz“ natürlich und sachlich genau.
- source_word: πρόθεσιν
  choice: Vorsatz
  rationale: πρόθεσις bezeichnet hier Gottes bewusst gefasste Absicht. „Vorsatz“ bewahrt den Gedanken zielgerichteten göttlichen Wollens und passt zur paulinischen Ausdrucksweise.
- source_word: τῶν αἰώνων
  choice: ewig
  rationale: Wörtlich steht „der Zeitalter“. Im Deutschen gibt „ewig“ die zeitliche Tragweite der Genitivverbindung natürlich wieder; die formnähere Wiedergabe wird in der Fußnote offengelegt.
- source_word: ἣν
  choice: den
  rationale: Das Relativpronomen bezieht sich auf den maskulinen deutschen Ausdruck „Vorsatz“.
- source_word: ἐποίησεν
  choice: verwirklicht hat
  rationale: ποιέω bezeichnet in diesem Zusammenhang, dass Gott seinen Vorsatz zur Ausführung brachte. „Verwirklicht hat“ ist im Deutschen idiomatisch und gibt diesen Vollzug wieder.
- source_word: ἐν
  choice: in
  rationale: Die unmittelbare Bedeutung der Präposition wird bewahrt. Ein mögliches instrumentales Verständnis als „durch“ bleibt durch eine Fußnote sichtbar.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός wird hier als Titel verstanden. „Messias“ macht dessen Bedeutung und jüdischen Hintergrund erkennbar, statt ihn lediglich als namenartigen Bestandteil wiederzugeben.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Eigenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ ist die etablierte und theologisch angemessene Wiedergabe von κύριος.
- source_word: ἡμῶν
  choice: unserem
  rationale: Der Genitiv bezeichnet die Zugehörigkeit; wegen der Apposition im Dativ lautet die natürliche deutsche Form „unserem Herrn“.
theological_decisions:
- issue: Bedeutung von τῶν αἰώνων in πρόθεσιν τῶν αἰώνων
  choice: „ewiger Vorsatz“ im Haupttext
  alternative: „Vorsatz der Zeitalter“
  rationale: Die griechische Genitivverbindung lautet wörtlich „der Zeitalter“ und bezeichnet die alle Zeitalter umspannende beziehungsweise ewige Dimension des göttlichen Vorsatzes. Die natürliche deutsche Wiedergabe steht im Haupttext, während die formale Struktur in der Fußnote erhalten bleibt.
- issue: Bedeutungsnuance von ἐν τῷ Χριστῷ Ἰησοῦ
  choice: „in dem Messias Jesus“
  alternative: „durch den Messias Jesus“
  rationale: ἐν kann im Zusammenhang instrumental verstanden werden, lautet aber zunächst „in“. Die Übersetzung wahrt diese örtlich-sphärische beziehungsweise relationale Formulierung und löst die theologische Spannung nicht stillschweigend auf.
- issue: Wiedergabe von Χριστός
  choice: „Messias“
  alternative: „Christus“
  rationale: Der Ausdruck hat hier Titelfunktion. „Messias“ legt die Bedeutung des griechischen Titels offen und bewahrt seinen jüdischen Erwartungshorizont.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als abhängiger Versabschnitt eng am griechischen Ausgangstext. „Ewiger Vorsatz“ ist natürlich verständlich; Fußnoten dokumentieren die wörtlichere Wendung, die mögliche instrumentale Bedeutung von ἐν und die Titelwiedergabe „Messias“.
