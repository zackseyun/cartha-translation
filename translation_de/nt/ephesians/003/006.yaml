  text: dass die Nichtjuden[a] Miterben, Glieder desselben Leibes[b] und Mitteilhaber der Verheißung in Jesus, dem Messias[c], durch das Evangelium sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Völker“. Gemeint sind hier besonders die nichtjüdischen Menschen, die zusammen mit Israel in Gottes Verheißung einbezogen werden.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene griechische Wort bezeichnet Menschen, die gemeinsam zu demselben Leib gehören.
