lexical_decisions:
- source_word: τὰ ἔθνη
  choice: die Nichtjuden
  rationale: Im unmittelbaren Zusammenhang bezeichnet der Ausdruck die nichtjüdischen Menschen, die zusammen mit Israel in Gottes Verheißung einbezogen werden. „Nichtjuden“ ist im heutigen Deutsch präziser als das mögliche „Völker“.
- source_word: συγκληρονόμα
  choice: Miterben
  rationale: Das deutsche Kompositum bewahrt sowohl den Gedanken des gemeinsamen Erbes als auch die knappe Parallelstruktur der drei griechischen σύν-Bildungen.
- source_word: σύσσωμα
  choice: Glieder desselben Leibes
  rationale: Das seltene griechische Wort bezeichnet die gemeinsame Zugehörigkeit zu einem Leib. Die Wiedergabe macht das paulinische Leibbild verständlich, ohne ein unnatürliches deutsches Kompositum zu bilden.
- source_word: συμμέτοχα
  choice: Mitteilhaber
  rationale: „Mitteilhaber“ bringt die gemeinsame Beteiligung zum Ausdruck und nimmt durch die Vorsilbe „Mit-“ den rhetorischen Gleichklang mit „Miterben“ auf.
- source_word: τῆς ἐπαγγελίας
  choice: der Verheißung
  rationale: Der Genitiv hängt von συμμέτοχα ab. Der Singular des griechischen Textes bleibt erhalten, ohne den Inhalt der Verheißung näher festzulegen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: „Messias“ bewahrt hier die Bedeutung von Χριστός als Titel in Paulus’ heilsgeschichtlicher Aussage; ἐν wird mit „im“ wiedergegeben.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: durch das Evangelium
  rationale: διά mit Genitiv bezeichnet hier das Mittel, durch das die Nichtjuden an der Verheißung Anteil erhalten.
- source_word: εἶναι
  choice: dass … sind
  rationale: Der Infinitiv erläutert in Verbindung mit dem vorhergehenden Vers den Inhalt des Geheimnisses. Im Deutschen ist dafür ein dass-Satz natürlich.
theological_decisions:
- issue: Bedeutung von τὰ ἔθνη
  choice: die Nichtjuden
  alternative: die Völker
  rationale: Der Zusammenhang handelt nicht allgemein von politischen oder ethnischen Nationen, sondern von der Einbeziehung nichtjüdischer Menschen. Die mögliche wörtlichere Wiedergabe wird in einer Fußnote bewahrt.
- issue: Χριστός als Titel oder namensähnliche Bezeichnung
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: In der Aussage über die Erfüllung und gemeinsame Teilhabe an Gottes Verheißung ist der messianische Titel semantisch deutlich wirksam. Die traditionelle Wiedergabe bleibt als Fußnotenalternative erhalten.
- issue: Bildgehalt von σύσσωμα
  choice: Glieder desselben Leibes
  alternative: Mitglieder des Leibes
  rationale: Die gewählte Formulierung bewahrt das Bild eines einzigen gemeinsamen Leibes und vermeidet zugleich das im Deutschen unverständliche „mitleibig“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als inhaltlich von den vorhergehenden Versen abhängiger dass-Satz stehen. Die knappe Dreierreihe des Griechischen wird soweit idiomatisch möglich bewahrt; beim seltenen σύσσωμα erhält Verständlichkeit Vorrang vor einer künstlichen deutschen Wortbildung.
