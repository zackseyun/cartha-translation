  source_fidelity: Die drei Prädikate geben συγκληρονόμα, σύσσωμα und συμμέτοχα zutreffend und mit erkennbarer Parallelität wieder. τὰ ἔθνη als „Nichtjuden“ ist im Kontext sachgerecht. Die Präpositionalgruppen ἐν Χριστῷ Ἰησοῦ und διὰ τοῦ εὐαγγελίου beziehen sich jedoch im Griechischen auf die Teilhabe an der Verheißung; die abgesetzte Stellung nach „sind“ macht diesen Bezug im Deutschen unnötig locker.
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Standarddeutsch. „– im Messias Jesus durch das Evangelium“ wirkt nach dem finiten Verb wie ein nachgetragener Zusatz. Die Einbindung in die Nominalgruppe „der Verheißung“ ergibt einen flüssigeren und syntaktisch klareren dass-Satz. „in Jesus, dem Messias“ ist im Deutschen natürlicher als „im Messias Jesus“ und bewahrt zugleich den Titelcharakter.
  terminology: „Miterben“, „Glieder desselben Leibes“, „Mitteilhaber“ und „Verheißung“ sind angemessen. „Jesus, dem Messias“ gibt Χριστῷ Ἰησοῦ als Titel-Apposition verständlich wieder, ohne die traditionelle Form „Christus Jesus“ im Text zu erzwingen. Fußnote b sollte nicht als wörtliche Übersetzung ein künstliches deutsches Kompositum präsentieren; das seltene Wort bezeichnet die gemeinsame Zugehörigkeit zu demselben Leib.
