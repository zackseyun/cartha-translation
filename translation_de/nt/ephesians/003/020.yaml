    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ δὲ δυναμένῳ
  choice: Dem aber, der … zu tun vermag
  rationale: Der substantivierte Dativ leitet die bis Vers 21 fortgeführte Doxologie ein. „Dem …, der“ bewahrt den Dativ und lässt den in diesem Vers nicht ausdrücklich genannten Bezugsträger offen. „Aber“ gibt δέ als überleitenden, nicht stark gegensätzlichen Anschluss wieder.
- source_word: ὑπὲρ πάντα … ὑπερεκπερισσοῦ
  choice: unermesslich viel mehr … als alles
  rationale: Die Formulierung gibt sowohl das Überschreiten in ὑπὲρ πάντα als auch die stark steigernde Wirkung von ὑπερεκπερισσοῦ in verständlichem, nachdrücklichem Deutsch wieder.
- source_word: ποιῆσαι
  choice: zu tun
  rationale: Die schlichte und weite Bedeutung von ποιέω bleibt erhalten, ohne sie auf „vollbringen“ oder „bewirken“ zu verengen.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: alles, worum wir bitten oder was wir uns vorstellen
  rationale: αἰτέομαι wird natürlich mit „um etwas bitten“ wiedergegeben. νοέω bezeichnet hier das gedankliche Erfassen oder Ausdenken; „sich vorstellen“ drückt dies im Deutschen klarer aus als das mehrdeutige „denken“.
- source_word: κατὰ τὴν δύναμιν
  choice: gemäß der Kraft
  rationale: κατά mit Akkusativ bezeichnet hier Maßstab oder Entsprechung. „Gemäß“ bewahrt diese Nuance besser als das rein instrumentale „durch“.
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: die in uns wirkt
  rationale: Die Formulierung gibt die gegenwärtige, wirksame Tätigkeit der Kraft knapp und idiomatisch wieder. „In uns“ ist die naheliegende Wiedergabe, ohne eine nähere dogmatische Erklärung einzutragen.
theological_decisions:
- issue: Bezugsträger der Doxologie
  choice: „Dem aber, der …“ ohne ergänztes „Gott“
  alternative: „Gott aber, der …“
  rationale: Der Zusammenhang weist auf Gott, doch im griechischen Text dieses Verses steht kein ausdrückliches Substantiv. Die Übersetzung bewahrt diese syntaktische Offenheit.
- issue: Wirkungsbereich der Kraft
  choice: „die in uns wirkt“
  alternative: „die unter uns wirkt“
  rationale: ἐν ἡμῖν kann grundsätzlich eine innere oder gemeinschaftliche Sphäre bezeichnen. „In uns“ ist hier die unmittelbarere Lesart und lässt offen, wie diese göttliche Kraft theologisch näher zu bestimmen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Satzteil mit abschließendem Komma stehen, weil die Doxologie in Vers 21 syntaktisch fortgeführt wird. Die starke griechische Steigerung wird idiomatisch ausgedrückt, ohne ihre Aussage abzuschwächen.
