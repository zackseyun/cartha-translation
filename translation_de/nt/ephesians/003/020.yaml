  verdict: revise
  source_fidelity: Der Entwurf gibt die dative, bis V. 21 weiterlaufende Doxologie, die umfassende Steigerung von ὑπὲρ πάντα ... ὑπερεκπερισσοῦ, den Gegenstand des Bittens bzw. Vorstellens sowie den Maßstab der in uns wirkenden Kraft grundsätzlich zutreffend wieder. Die Formulierung „viel mehr zu tun ... als alles“ ist jedoch im Deutschen syntaktisch und semantisch weniger präzise als die griechische Konstruktion des weit hinausgehenden Tuns.
  naturalness: „Dem aber, der“ und der abschließende Satzanschluss mit Komma sind würdiges, modernes Standarddeutsch. „unermesslich viel mehr zu tun vermag als alles, worum ...“ wirkt allerdings schwerfällig, weil „mehr tun als alles“ zunächst einen unklaren Vergleich nahelegt. „weit über alles hinaus zu tun vermag, worum ...“ ist idiomatischer und bildet die Konstruktion klarer ab.
  terminology: „Kraft, die in uns wirkt“ ist eine treffende, theologisch nicht einengende Wiedergabe von τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν. „Sich vorstellen“ ist für νοοῦμεν in diesem Kontext vertretbar. Der nicht ausdrücklich genannte Empfänger der Doxologie wird zu Recht nicht durch „Gott“ ergänzt.
