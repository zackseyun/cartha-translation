id: EPH.3.13
reference: Ephesians 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: de
  text: Deshalb bitte ich euch, wegen meiner Bedrängnisse für euch nicht den Mut zu verlieren[a] – das ist eure Herrlichkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deshalb bitte ich darum, angesichts meiner Bedrängnisse für euch nicht mutlos zu werden.“ Im Griechischen ist das Gegenüber von „bitte“ nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: „Das“ kann sich besonders auf Paulus’ Bedrängnisse oder umfassender auf seinen Dienst und sein Leiden für sie beziehen. Auch „das ist eure Ehre“ ist möglich.
    reason: referent_and_lexical_ambiguity
lexical_decisions:
- source_word: διὸ
  choice: Deshalb
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus dem vorausgehenden Gedankengang.
- source_word: αἰτοῦμαι
  choice: bitte ich euch
  rationale: Gibt den Appell im Deutschen idiomatisch wieder. Das im Griechischen nicht ausdrücklich genannte Gegenüber wird aus dem Zusammenhang erschlossen; die Fußnote hält die formal offenere Wiedergabe fest.
- source_word: μὴ ἐγκακεῖν
  choice: nicht den Mut zu verlieren
  rationale: Entspricht dem Sinn von ἐγκακέω als mutlos oder entmutigt werden und ist in modernem Deutsch klar und würdig.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: wegen meiner Bedrängnisse
  rationale: ἐν bezeichnet hier bei einem Verb des Mutverlierens wahrscheinlich den Anlass oder Grund. „Bedrängnisse“ bewahrt die Schwere von θλῖψις, ohne unnötig altertümlich zu wirken.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: 'Gibt den benefaktiven beziehungsweise stellvertretenden Sinn von ὑπέρ knapp wieder: Paulus erleidet diese Bedrängnisse im Dienst an den Angesprochenen.'
- source_word: ἥτις
  choice: das
  rationale: Das demonstrative „das“ greift die zuvor genannte Gesamtsituation als begriffliche Einheit auf und wahrt damit den Singular des griechischen Relativpronomens, ohne einen unnatürlichen deutschen Relativsatz zu erzwingen.
- source_word: δόξα ὑμῶν
  choice: eure Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt die theologische und rhetorische Tragweite von δόξα. „Ehre“ ist ebenfalls möglich, würde die Formulierung jedoch stärker auf gesellschaftliches Ansehen einengen.
theological_decisions:
- issue: Bezug von ἥτις ἐστὶν δόξα ὑμῶν
  choice: „das“ bezieht sich auf die zuvor genannte Gesamtsituation, besonders auf Paulus’ Bedrängnisse für die Adressaten.
  alternative: Der Satz kann enger unmittelbar auf die Bedrängnisse oder weiter auf Paulus’ Dienst und Leiden für sie bezogen werden.
  rationale: Das singuläre ἥτις steht nach dem pluralischen θλίψεσιν und legt einen zusammenfassenden, begrifflichen Rückbezug nahe. Die Übersetzung lässt den genauen Umfang dieses Rückbezugs bewusst offen.
- issue: Bedeutung von δόξα für die Adressaten
  choice: Die paradoxe Aussage „eure Herrlichkeit“ bleibt unaufgelöst stehen.
  alternative: Sinngemäß könnte „es dient euch zur Ehre“ formuliert werden.
  rationale: Der Quelltext erklärt nicht ausdrücklich, auf welche Weise Paulus’ Leiden ihre Herrlichkeit sind. Die stärkere Deutung wird daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Bedrängnisse“ und „Herrlichkeit“ erhalten das Gewicht der griechischen Begriffe; die Gedankenstrichkonstruktion bildet den pointierten, paradoxen Abschluss natürlich ab.
