source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: de
  text: und für alle ans Licht zu bringen, was die Verwaltung[a] des Geheimnisses ist, das von den Zeitaltern her[b] in Gott verborgen war, der alles erschaffen hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haushalterschaft“, „Ordnung“ oder „Plan“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „seit Urzeiten“; stärker deutend: „von Ewigkeit her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι πάντας
  choice: für alle ans Licht zu bringen
  rationale: Die Formulierung bewahrt das Bild des Erhellens, während die Konstruktion mit dem folgenden indirekten Fragesatz im Deutschen natürlich bleibt. πάντας bezeichnet hier den universalen persönlichen Adressatenkreis.
- source_word: τίς ἡ οἰκονομία
  choice: worin die Verwaltung besteht
  rationale: οἰκονομία kann Verwaltung, Haushalterschaft, Ordnung oder Plan bezeichnen. „Verwaltung“ bewahrt den Gedanken einer geordneten Ausführung, ohne vorschnell einen späteren theologischen Fachbegriff einzutragen.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Im paulinischen Sprachgebrauch bezeichnet das Wort einen zuvor verborgenen, nun offenbarten göttlichen Ratschluss. „Geheimnis“ erhält diesen etablierten Sinn besser als „Geheimlehre“ oder bloß „Geheimnisvolles“.
- source_word: ἀποκεκρυμμένου
  choice: verborgen war
  rationale: Das Perfektpartizip beschreibt den aus früherem Verbergen hervorgegangenen Zustand. Die deutsche Formulierung gibt diesen anhaltenden Zustand im Zusammenhang idiomatisch wieder.
- source_word: ἀπὸ τῶν αἰώνων
  choice: von den Zeitaltern her
  rationale: Diese relativ formnahe Wiedergabe wahrt den Bezug auf αἰῶνες und legt die Wendung nicht eindeutig als abstrakte Ewigkeit aus.
- source_word: ἐν τῷ θεῷ
  choice: in Gott
  rationale: 'Die lokale Bildsprache von ἐν bleibt erhalten: Das Geheimnis war in Gott verborgen, nicht lediglich bei ihm.'
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: der alles erschaffen hat
  rationale: Der substantivierte Partizipialausdruck beschreibt Gott als Schöpfer. Der Relativsatz ist im Deutschen natürlich und gibt τὰ πάντα knapp als „alles“ wieder.
theological_decisions:
- issue: Bedeutung von οἰκονομία in Bezug auf das Geheimnis
  choice: Verwaltung
  alternative: Haushalterschaft; Plan; geordnete Ausführung
  rationale: „Verwaltung“ hält den Gedanken der geordneten Durchführung fest, ohne οἰκονομία nur auf den Inhalt des Geheimnisses zu reduzieren oder eine spätere konfessionelle Systematik einzutragen.
- issue: Zeitlicher Sinn von ἀπὸ τῶν αἰώνων
  choice: von den Zeitaltern her
  alternative: seit Urzeiten; von Ewigkeit her; seit den Zeitaltern
  rationale: Der griechische Ausdruck nennt ausdrücklich die Zeitalter. Die gewählte Formulierung bewahrt diese Spannung und behauptet nicht eindeutiger als der Ausgangstext eine abstrakte Ewigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung des übergeordneten Gedankengangs bewusst mit „und“ eröffnet und endet entsprechend mit einem Komma. Die Lichtmetapher sowie die ungewöhnliche zeitliche Wendung des Griechischen werden bewahrt; erläuternde Alternativen stehen in den Fußnoten.
