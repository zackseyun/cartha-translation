  text: von dem jede Familie im Himmel und auf der Erde ihren Namen hat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von dem die ganze Familie im Himmel und auf der Erde ihren Namen hat«; stärker deutend auch: »von dem jede Vaterschaft im Himmel und auf der Erde ihren Namen herleitet«. Im Griechischen klingt bei »Familie« (patria) das Wort »Vater« (patēr) aus Vers 14 an.'
    reason: Alternative grammatische Deutung und nicht vollständig übertragbares Wortspiel.
lexical_decisions:
- source_word: ἐξ οὗ
  choice: von dem
  rationale: 'Die Präposition ἐκ mit dem Genitiv des Relativpronomens bezeichnet hier den Ursprung: »von dem«. Zusammen mit ὀνομάζεται ergibt sich, dass die Benennung von ihm ausgeht.'
- source_word: πᾶσα
  choice: jede
  rationale: 'Bei einem singularischen Substantiv hat πᾶσα hier am natürlichsten distributiven Sinn: »jede«. »Die ganze« bleibt grammatisch möglich und wird in der Fußnote genannt.'
- source_word: πατριά
  choice: Familie
  rationale: πατριά bezeichnet gewöhnlich eine Familie, Sippe oder Abstammungsgruppe. »Familie« ist im heutigen Deutsch klar und natürlich; das im Zusammenhang anklingende Wortspiel mit πατήρ (»Vater«) lässt sich nicht vollständig nachbilden.
- source_word: ἐν οὐρανοῖς
  choice: im Himmel
  rationale: Der griechische Plural bezeichnet den himmlischen Bereich; im modernen Standarddeutsch ist »im Himmel« die idiomatische Entsprechung.
- source_word: ἐπὶ γῆς
  choice: auf der Erde
  rationale: Dies ist eine genaue und idiomatische Wiedergabe der Ortsangabe.
- source_word: ὀνομάζεται
  choice: ihren Namen hat
  rationale: Das Präsens Passiv bedeutet wörtlich »benannt wird« beziehungsweise »genannt wird«. In Verbindung mit ἐξ οὗ gibt »von dem … ihren Namen hat« die Benennung und ihren Ursprung natürlich wieder, ohne die stärkere Deutung »sein Wesen herleitet« einzutragen.
theological_decisions:
- issue: Bedeutung von πᾶσα πατριά im Verhältnis zu »dem Vater« im vorhergehenden Vers
  choice: jede Familie
  alternative: die ganze Familie; jedes Vatersein
  rationale: Die Hauptfassung bewahrt den gewöhnlichen Sinn von πατριά als Familien- oder Abstammungsgruppe und versteht πᾶσα distributiv. Sie entscheidet den Ausdruck weder zugunsten einer einzigen umfassenden himmlisch-irdischen Familie noch zugunsten der abstrakten Aussage, alles Vatersein gehe von Gott aus. Die möglichen Alternativen und das griechische Wortspiel werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Ihren Namen hat« ist natürlicher als das formellere »benannt wird« und bewahrt im Zusammenhang mit »von dem« den Ursprungsgedanken. Die Fußnote hält die echte Mehrdeutigkeit von πᾶσα πατριά und das Vater/Familie-Wortspiel offen.
