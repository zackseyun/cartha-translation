id: EPH.3.4
reference: Ephesians 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: de
  text: Wenn ihr das lest, könnt ihr daran erkennen, welche Einsicht ich in das Geheimnis des Messias[a] habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Der griechische Titel Χριστός kann mit „Messias“ oder traditionell mit „Christus“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ
  choice: daran
  rationale: Die Wendung verweist auf das zuvor Geschriebene zurück. Zusammen mit dem Partizip ἀναγινώσκοντες wird dieser Bezug im Deutschen natürlich durch „Wenn ihr das lest, könnt ihr daran …“ wiedergegeben.
- source_word: δύνασθε
  choice: könnt ihr
  rationale: Das Verb bezeichnet Fähigkeit oder Möglichkeit; „könnt ihr“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: ἀναγινώσκοντες
  choice: wenn ihr das lest
  rationale: Das präsentische Partizip bezeichnet hier den begleitenden beziehungsweise mittelgebenden Umstand. Der Nebensatz ist im modernen Deutsch klar und idiomatisch.
- source_word: νοῆσαι
  choice: erkennen
  rationale: νοέω bezeichnet geistiges Erfassen. „Erkennen“ vermeidet die unschöne Wiederholung von „verstehen/Verständnis“ und passt zu „Einsicht“.
- source_word: τὴν σύνεσίν μου
  choice: welche Einsicht ich … habe
  rationale: σύνεσις bezeichnet Verständnis oder Einsicht. Die Umformung als indirekter Fragesatz ergibt natürliches Deutsch und bewahrt den Bezug auf Paulus’ eigene Einsicht.
- source_word: ἐν τῷ μυστηρίῳ
  choice: in das Geheimnis
  rationale: Nach dem deutschen Substantiv „Einsicht“ bezeichnet „in“ mit Akkusativ den Gegenstand, in den jemand Einsicht hat. „Geheimnis“ bewahrt den paulinischen theologischen Ausdruck, ohne ihn erklärend aufzulösen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier als Titel zu verstehen. „Messias“ gibt dessen Bedeutung wieder; die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von τοῦ Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Der griechische Ausdruck kann als bedeutungstragender Titel „Messias“ oder in der traditionellen Form „Christus“ wiedergegeben werden. Der Haupttext macht den Titel verständlich, während die Fußnote die geläufige kirchliche Form bewahrt.
- issue: Beziehung des Genitivs τοῦ Χριστοῦ zu μυστήριον
  choice: das Geheimnis des Messias
  alternative: das Geheimnis über den Messias
  rationale: 'Der Genitiv bleibt absichtlich offen: Er kann Zugehörigkeit, Inhalt oder Bezug anzeigen. Die knappe Genitivkonstruktion legt keine engere Deutung fest.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Griechischen leicht entfaltet, um den Rückverweis von πρὸς ὃ und die Aussage über Paulus’ Einsicht verständlich auszudrücken, ohne die inhaltliche Offenheit von „Geheimnis des Messias“ aufzulösen.
