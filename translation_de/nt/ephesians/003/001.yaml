  verdict: revise
  source_fidelity: Die Grundstruktur, die Selbstidentifikation des Paulus, „Gefangene des Messias Jesus“ und der abbrechende Gedankenstrich entsprechen dem griechischen Text. „Menschen aus den Völkern“ trifft den paulinischen Bezug auf Nichtjuden jedoch weniger unmittelbar und kann im Deutschen unnötig weit bzw. ethnisch-geografisch verstanden werden.
  naturalness: „Menschen aus den Völkern“ wirkt in dieser direkten Anrede schwerfällig. „euch Nichtjuden“ ist modernes, neutrales Standarddeutsch und bildet die Apposition τῶν ἐθνῶν klar und idiomatisch ab. Das ergänzte „bin“ ist im Deutschen zur Bildung des begonnenen Satzes erforderlich; der Gedankenstrich bewahrt den absichtlichen Abbruch.
  terminology: „Messias Jesus“ gibt Χριστοῦ als Titel wieder und entspricht der vorgegebenen Terminologie. „Nichtjuden“ ist hier präziser und gegenwartsnäher als „Heiden“, ohne den Sinn von ἔθνη zu verändern.
  issues:
  - severity: medium
    issue: „die Menschen aus den Völkern“ für τῶν ἐθνῶν
    rationale: Im Kontext bezeichnet τὰ ἔθνη die nichtjüdischen Adressaten. Die gewählte Umschreibung ist unnötig umständlich und kann allgemein Menschen unterschiedlicher Völker statt Nichtjuden meinen. „Nichtjuden“ bewahrt den kontextuellen Sinn eindeutig und neutral.
