id: EPH.3.1
reference: Ephesians 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: de
  text: Aus diesem Grund bin ich, Paulus, der Gefangene des Messias Jesus für euch Nichtjuden—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Aus diesem Grund
  rationale: Die Wendung verweist begründend auf den vorausgehenden Gedankengang und wird im Deutschen idiomatisch als „Aus diesem Grund“ wiedergegeben.
- source_word: ἐγὼ Παῦλος
  choice: ich, Paulus,
  rationale: Das ausdrücklich gesetzte Pronomen hebt Paulus hervor; die Apposition mit Kommas entspricht natürlichem deutschem Satzbau.
- source_word: ὁ δέσμιος
  choice: der Gefangene
  rationale: Das Substantiv bezeichnet unmittelbar einen Menschen in Gefangenschaft; „Gefangene“ bleibt näher am Wortlaut als eine Umschreibung wie „der in Ketten liegt“.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός wird als Titel mit „Messias“ übersetzt. Der Genitiv bleibt bewusst offen dafür, dass Paulus dem Messias zugehört und um seinetwillen gefangen ist.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: ὑπέρ bezeichnet hier den Nutzen beziehungsweise das Eintreten zugunsten der Adressaten; „für euch“ ist präzise und natürlich, ohne eine bestimmte Nuance übermäßig festzulegen.
- source_word: τῶν ἐθνῶν
  choice: die Menschen aus den Völkern
  rationale: Im paulinischen Kontext sind die nichtjüdischen Adressaten gemeint. Die Formulierung ist im heutigen Deutsch verständlicher als das traditionssprachliche „Heiden“ und bewahrt zugleich den Bezug zu ἔθνη, „Völker“.
theological_decisions:
- issue: Χριστοῦ als Titel oder namensähnlicher Bestandteil
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός bezeichnet den messianischen Titel Jesu. „Messias“ macht dessen Bedeutung transparent, während „Christus Jesus“ die traditionelle kirchliche Form wäre.
- issue: Beziehung des Gefangenen zu Jesus im Genitiv τοῦ Χριστοῦ Ἰησοῦ
  choice: Gefangene des Messias Jesus
  alternative: um des Messias Jesus willen Gefangene
  rationale: Die Genitivkonstruktion wird formal bewahrt und nicht einseitig als Ursache der Gefangenschaft oder bloße Zugehörigkeit ausgelegt.
- issue: Bezeichnung der nichtjüdischen Adressaten
  choice: Menschen aus den Völkern
  alternative: Heiden
  rationale: Gemeint sind Nichtjuden. „Menschen aus den Völkern“ vermeidet die im heutigen Deutsch häufig abwertende oder religionssoziologisch missverständliche Wirkung von „Heiden“.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Gedankenstrich bleibt stehen, weil der griechische Satz in Vers 1 abbricht und der begonnene Gedanke erst nach dem Einschub wieder aufgenommen wird.
