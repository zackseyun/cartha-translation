  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: de
  text: wenn ihr denn von der Verwaltung[b] der Gnade Gottes gehört habt, die mir für euch gegeben wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Form lautet wörtlich „wenn ihr denn … gehört habt“. Im Zusammenhang setzt Paulus wahrscheinlich voraus, dass dies tatsächlich der Fall ist.
    reason: alternative_reading
  - marker: b
    text: Oder „Haushalterschaft“, „Beauftragung“ beziehungsweise „Heilsordnung“. Das griechische Wort kann eine anvertraute Verwaltung, ihre Ausführung oder die zugrunde liegende Ordnung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: wenn ihr denn
  rationale: Die Wendung bewahrt die griechische Bedingungsform. Im Zusammenhang äußert Paulus damit wahrscheinlich keinen wirklichen Zweifel, sondern setzt voraus, dass die Leser davon gehört haben.
- source_word: ἠκούσατε
  choice: gehört habt
  rationale: Das deutsche Perfekt gibt den als Ganzes betrachteten vergangenen Vorgang natürlich wieder und lässt seine gegenwärtige Bedeutung im Zusammenhang erkennen.
- source_word: οἰκονομίαν
  choice: Verwaltung
  rationale: Der Ausdruck bezeichnet hier eine anvertraute Aufgabe beziehungsweise die verantwortliche Ausführung eines Auftrags. „Verwaltung“ wahrt diese Bedeutung, ohne den Begriff vorschnell nur als Heilsplan oder nur als Amt zu deuten.
- source_word: χάριτος
  choice: Gnade
  rationale: „Gnade“ ist die natürliche und theologisch offene Wiedergabe des paulinischen Begriffs für Gottes unverdiente Zuwendung und Gabe.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv bewahrt die Beziehung zur Gnade als von Gott kommend und ihm zugehörig.
- source_word: τῆς δοθείσης
  choice: die … gegeben wurde
  rationale: Das feminine Genitivpartizip bezieht sich grammatisch auf „Gnade“ und bewahrt zugleich die Passivform, die Gott als Geber voraussetzt.
- source_word: μοι
  choice: mir
  rationale: Der Dativ wird unmittelbar und idiomatisch wiedergegeben.
- source_word: εἰς ὑμᾶς
  choice: für euch
  rationale: Im Zusammenhang bezeichnet die Präposition die Ausrichtung und den Nutzen des Paulus anvertrauten Dienstes für die Leser.
theological_decisions:
- issue: Bedeutung von „Verwaltung der Gnade Gottes“
  choice: Paulus spricht von der ihm anvertrauten Verwaltung beziehungsweise Beauftragung im Zusammenhang mit Gottes Gnade für die Leser.
  alternative: Der Ausdruck kann allgemeiner auf Gottes Heilsordnung oder Heilsplan bezogen werden.
  rationale: Der unmittelbare Zusammenhang hebt den Paulus anvertrauten Dienst an den Nichtjuden hervor. „Verwaltung“ erhält sowohl den Gedanken des anvertrauten Auftrags als auch den Bezug zu Gottes umfassenderem Handeln.
- issue: Aussagekraft von εἴ γε
  choice: Die Bedingungsform wird beibehalten, wobei sie im Zusammenhang eine als wahr erwartete Voraussetzung ausdrückt.
  alternative: 'Die Form könnte als echte, offene Bedingung verstanden werden: „falls ihr wirklich gehört habt“.'
  rationale: Paulus dürfte nicht ernsthaft bezweifeln, dass die Leser von seinem Auftrag gehört haben; dennoch soll die grammatische Spannung der bedingten Form nicht aus dem Haupttext verschwinden.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Der Vers bleibt als abhängiger Satzteil formuliert, wie es der griechische Zusammenhang mit dem vorhergehenden Vers nahelegt. „Wenn ihr denn“ bewahrt die echte sprachliche Spannung zwischen Bedingungsform und rhetorisch erwarteter Wahrheit.
