id: EPH.3.5
reference: Ephesians 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: de
  text: das den Menschen in anderen Generationen nicht in der Weise bekannt gemacht wurde, wie es jetzt seinen heiligen Aposteln und Propheten im Geist[a] offenbart worden ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch den Geist«; die griechische Wendung kann sowohl den Bereich als auch das Mittel der Offenbarung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: das
  rationale: Das neutrale Relativpronomen knüpft an das zuvor genannte Geheimnis an, ohne den Bezug im Vers ausdrücklich zu wiederholen.
- source_word: ἑτέραις γενεαῖς
  choice: in früheren Generationen
  rationale: Der Dativ ist hier temporal zu verstehen. »Frühere« gibt im Deutschen den Gegensatz zu »jetzt« natürlicher wieder als das formal nähere »andere«.
- source_word: οὐκ ἐγνωρίσθη
  choice: nicht … bekannt gemacht wurde
  rationale: Bewahrt Passiv und mitteilenden Sinn von γνωρίζω; es geht nicht bloß darum, dass etwas unbekannt war.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: den Menschen
  rationale: Die semitisch geprägte Wendung bezeichnet Menschen beziehungsweise die Menschheit allgemein. Das natürliche deutsche Äquivalent vermeidet die heute missverständliche wörtliche Form »den Söhnen der Menschen«.
- source_word: ὡς νῦν
  choice: nicht so …, wie es jetzt
  rationale: Bewahrt den Vergleich, der einen Unterschied in Art oder Ausmaß der Bekanntmachung ausdrücken kann, statt absolute Unkenntnis früherer Generationen zu behaupten.
- source_word: ἀπεκαλύφθη
  choice: offenbart worden ist
  rationale: »Offenbaren« ist die klare, im paulinischen Offenbarungskontext angemessene Wiedergabe des Passivs.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: seinen heiligen Aposteln und Propheten
  rationale: »Heiligen« bezieht sich natürlich auf beide verbundenen Gruppen; »seinen« bewahrt αὐτοῦ, ohne dessen Bezug über den Kontext hinaus festzulegen.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Der Offenbarungskontext spricht stark für den Heiligen Geist. »Im Geist« bewahrt ἐν und lässt offen, ob vor allem Sphäre oder Mittel gemeint ist.
theological_decisions:
- issue: Bedeutung des Vergleichs οὐκ … ὡς νῦν
  choice: »nicht so …, wie es jetzt«
  alternative: »war nicht bekannt …, ist aber jetzt offenbart worden«
  rationale: Die gewählte Form bewahrt die Spannung, dass das Geheimnis früher möglicherweise nicht in derselben Weise oder demselben Ausmaß bekannt gemacht wurde, ohne eine völlig absolute Unkenntnis festzuschreiben.
- issue: Referent von πνεύματι
  choice: Heiliger Geist
  alternative: menschlicher Geist oder geistliche Sphäre/Weise
  rationale: Die göttliche Offenbarung an Apostel und Propheten macht den Heiligen Geist zum wahrscheinlichsten Referenten; die Präposition bleibt jedoch bewusst mehrdeutig hinsichtlich Sphäre und Mittel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Relativsatz offen, weil Vers 5 grammatisch an den vorherigen Kontext anschließt. Die idiomatische Wiedergabe »den Menschen« vermittelt die Bedeutung der semitischen Wendung ohne unnötig archaische oder geschlechtlich missverständliche Sprache.
