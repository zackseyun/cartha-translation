  terminology: »Menschen«, »heiligen Aposteln und Propheten«, »offenbart« und »im Geist« sind sachgerecht. Die Großschreibung von »Geist« gibt den im Kontext sehr wahrscheinlichen Bezug auf den Heiligen Geist wieder, ohne die Funktion von ἐν als Bereich oder Mittel festzulegen. Die Fußnote bildet diese verbleibende Nuance zutreffend ab.
