source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: de
  text: damit jetzt durch die Gemeinde die vielfältige Weisheit Gottes den Mächten und Gewalten in den himmlischen Bereichen[a][b] bekannt gemacht wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „im Himmlischen“; gemeint ist die himmlische Sphäre.'
    reason: lexical_alternative
  - marker: b
    text: „Mächte und Gewalten“ bezeichnet hier angesichts der himmlischen Sphäre wahrscheinlich kosmische oder geistliche Mächte, nicht nur menschliche Autoritäten.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet einen Zweck- oder Zielsatz ein und gibt die finale Bedeutung im modernen Deutschen natürlich wieder.
- source_word: γνωρισθῇ
  choice: bekannt gemacht wird
  rationale: Bewahrt das Passiv des griechischen Aorist Konjunktiv; nach „damit“ ist der deutsche Indikativ idiomatisch, ohne den Zweckcharakter aufzugeben.
- source_word: νῦν
  choice: jetzt
  rationale: Direkte und natürliche Wiedergabe des Zeitadverbs.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: den Mächten und Gewalten
  rationale: Die etablierte deutsche Wortpaarung bleibt verständlich und lässt die genaue Art der übermenschlichen Herrschaftsmächte offen.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: in den himmlischen Bereichen
  rationale: Bezeichnet in Epheser die himmlische Sphäre; „Bereiche“ klingt im heutigen Deutsch natürlicher als eine substantivierte Form wie „das Himmlische“.
- source_word: διὰ τῆς ἐκκλησίας
  choice: durch die Gemeinde
  rationale: διά mit Genitiv bezeichnet das Mittel. „Gemeinde“ gibt ἐκκλησία hier zugänglich wieder und bezeichnet die gemeinschaftliche Kirche, nicht ein Gebäude.
- source_word: ἡ πολυποίκιλος σοφία
  choice: die vielfältige Weisheit
  rationale: πολυποίκιλος bezeichnet eine reich gegliederte, vielgestaltige oder facettenreiche Vielfalt; „vielfältig“ ist klar, würdig und nicht altertümlich.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Natürliche deutsche Wiedergabe des Genitivs; die Weisheit wird Gott zugeordnet.
theological_decisions:
- issue: Identität der „Mächte und Gewalten“
  choice: Die Formulierung bezeichnet im Kontext himmlische beziehungsweise kosmisch-geistliche Mächte, ohne ihre Art genauer festzulegen.
  alternative: Menschliche politische Herrscher und Amtsträger oder eine bewusst umfassende Bezeichnung für irdische und himmlische Autoritäten.
  rationale: Der Zusatz „in den himmlischen Bereichen“ spricht deutlich für übermenschliche Mächte. Der Haupttext vermeidet dennoch die präzisierende Einfügung „Engel“ oder „Dämonen“, die über den Wortlaut hinausginge.
- issue: Funktion der Gemeinde
  choice: Die Gemeinde ist das Mittel, durch das Gottes Weisheit bekannt gemacht wird.
  alternative: Die Gemeinde selbst ist lediglich der Gegenstand der Bekanntmachung.
  rationale: διά mit Genitiv hat hier instrumentale Bedeutung; die Übersetzung „durch die Gemeinde“ bewahrt diese Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung folgt gut lesbarem Deutsch, bewahrt aber Zweck, Mittel, Empfänger und Inhalt der Aussage. „Vielfältige Weisheit“ vermittelt die vielen Facetten von πολυποίκιλος ohne das altertümlich wirkende „mannigfaltig“.
