id: EPH.3.21
reference: Ephesians 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: de
  text: Ihm gebührt die Herrlichkeit in der Gemeinde und in Messias Jesus durch alle Generationen hindurch, für immer und ewig.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus“. Der griechische Titel Χριστός wird hier mit „Messias“ wiedergegeben, um seine Bedeutung sichtbar zu machen.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Ihm gebührt die Herrlichkeit
  rationale: Die griechische Doxologie ist ohne ausdrückliches Verb. „Ihm gebührt“ gibt die zugrunde liegende Zuschreibung in natürlichem, würdevollem Deutsch wieder, ohne sie als bloßen Wunsch festzulegen.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: in der Gemeinde
  rationale: „Gemeinde“ bezeichnet hier die Gemeinschaft des Gottesvolkes und ist im modernen deutschen Bibelsprachgebrauch natürlich; „in“ bewahrt zugleich die Parallelität zum folgenden Ausdruck.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: und in Messias Jesus
  rationale: Χριστός wird als bedeutungsvoller Titel mit „Messias“ wiedergegeben; die Präposition ἐν bleibt als „in“ erhalten.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: durch alle Generationen hindurch
  rationale: Bei einer Zeitangabe bezeichnet εἰς die Erstreckung über die Zeit. Die Formulierung ist verständlich und bewahrt ausdrücklich „alle Generationen“.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die gesteigerte idiomatische Wendung bezeichnet unbegrenzte Dauer; eine wörtliche Wiedergabe wie „des Zeitalters der Zeitalter“ wäre im heutigen Deutsch missverständlich.
- source_word: ἀμήν
  choice: Amen
  rationale: Die etablierte liturgische Transkription ist im Deutschen allgemein verständlich.
theological_decisions:
- issue: Χριστός als Titel oder als namensähnliche Form
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός trägt hier den Sinn eines Titels. „Messias“ macht diesen Gehalt sichtbar, während „Christus Jesus“ als traditionelle Alternativwiedergabe in der Fußnote genannt wird.
- issue: Sinn der elliptischen Doxologie αὐτῷ ἡ δόξα
  choice: Ihm gebührt die Herrlichkeit
  alternative: Ihm sei die Herrlichkeit
  rationale: Da im Griechischen kein Verb steht, kann die Wendung als Zuschreibung oder Wunsch verstanden werden. Der Haupttext verwendet die natürliche askriptive Form; die griechische Ellipse erlaubt jedoch grundsätzlich auch die optativische Auffassung.
translation_notes:
  register: Moderne, würdevolle Doxologie in allgemein verständlichem Standarddeutsch. „Gemeinde“ und „Herrlichkeit“ entsprechen dem etablierten biblischen Register; die zeitliche Schlussformel wird idiomatisch statt mechanisch wörtlich wiedergegeben.
