id: EPH.3.19
reference: Ephesians 3:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: de
  text: und die Liebe des Messias zu erkennen, die Erkenntnis übersteigt,[a] damit ihr bis zur ganzen Fülle Gottes erfüllt werdet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „Liebe des Messias“ kann grammatisch die Liebe bezeichnen, die vom Messias ausgeht, oder die Liebe zu ihm; der Zusammenhang spricht besonders für seine Liebe zu den Glaubenden.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mit der ganzen Fülle Gottes erfüllt werdet“. Wörtlich steht im Griechischen eine verdichtete Wendung mit der Bedeutung „bis zu der ganzen Fülle Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: zu erkennen
  rationale: Der Aoristinfinitiv von γινώσκω wird direkt wiedergegeben und bewahrt sowohl die kognitive als auch die erfahrungsbezogene Bedeutung.
- source_word: τε
  choice: und
  rationale: Die Partikel verbindet diesen Infinitiv leicht mit den vorausgehenden Gebetsanliegen; „und“ ist dafür im Deutschen natürlich.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: die alle Erkenntnis übersteigt
  rationale: Die Relativkonstruktion gibt das Partizip idiomatisch wieder. „Erkenntnis“ erhält die Wortbeziehung zu „erkennen“ und bewahrt das Paradox, etwas zu erkennen, das Erkenntnis übersteigt. „Alle“ verdeutlicht hier natürlich den unbegrenzten Vergleich, ohne einen eigenen griechischen Ausdruck mechanisch hinzuzufügen.
- source_word: ἀγάπην
  choice: Liebe
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet den Titel „Messias“. Der Genitiv bleibt formal offen und wird nicht ausdrücklich als subjektiv oder objektiv aufgelöst.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck- beziehungsweise Ergebnissinn idiomatisch wieder.
- source_word: πληρωθῆτε
  choice: ihr erfüllt werdet
  rationale: Die passive Verbform wird gewahrt. „Erfüllt werden“ passt im Deutschen zur abstrakten „Fülle“ besser als „gefüllt werden“.
- source_word: εἰς
  choice: bis zu
  rationale: „Bis zu“ erhält die Zielrichtung der Präposition und vermeidet es, die Wendung vorschnell als bloßes „mit“ zu deuten.
- source_word: πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: zur ganzen Fülle Gottes
  rationale: Die umfassende Aussage und der Genitiv werden knapp und würdig bewahrt.
theological_decisions:
- issue: Bedeutung von τοῦ Χριστοῦ
  choice: die Liebe des Messias
  alternative: die Liebe, die der Messias zu uns hat; die Liebe zum Messias
  rationale: Der griechische Genitiv kann formal mehr als eine Beziehung ausdrücken. Obwohl der Zusammenhang stark für die Liebe des Messias zu den Glaubenden spricht, löst der Haupttext dies nicht ausdrücklich auf.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi; von Christus
  rationale: Die Übersetzung macht den Titelgehalt von Χριστός sichtbar, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Wiedergabe von εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: bis zur ganzen Fülle Gottes erfüllt
  alternative: mit der ganzen Fülle Gottes erfüllt
  rationale: Die Formulierung bewahrt die verdichtete Zielrichtung von εἰς und vermeidet, die theologisch gewichtige Wendung auf eine reine Inhaltsangabe zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortverbindung „erkennen – Erkenntnis“ und der paradoxe Gedanke des griechischen Textes bleiben erhalten. Die ungewöhnliche Zielrichtung der Schlusswendung wird lesbar, aber nicht eingeebnet.
