  - severity: low
    issue: Der Fußnotentext legt „Gemeint ist das innere Selbst“ zu stark als erschöpfende Erklärung fest.
    rationale: Die Fußnote soll die mögliche alternative Formulierung erläutern, ohne die bildhafte Wendung „innerer Mensch“ auf eine einzige Interpretation zu reduzieren.
