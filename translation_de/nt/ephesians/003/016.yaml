review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Gebetsinhalt, den Maßstab „nach dem Reichtum seiner Herrlichkeit“, die Vermittlung durch Gottes Geist und den passiven Infinitiv zutreffend wieder. „Am inneren Menschen“ ist jedoch als Wiedergabe von εἰς τὸν ἔσω ἄνθρωπον weniger klar; die Ziel- bzw. Bereichsangabe wird mit „an eurem inneren Menschen“ idiomatischer und eindeutiger ausgedrückt.
  naturalness: Die Konstruktion „schenkt, ... gestärkt zu werden“ ist verständlich, wirkt im modernen Standarddeutsch aber etwas schwerfällig. „Gewährt“ ist in diesem Gebetsregister natürlich und bildet die gewährende Bedeutung von δῷ angemessen ab. Der Gedankenstrich ist syntaktisch nicht nötig.
  terminology: „Herrlichkeit“, „Geist“, „Kraft“ und „innerer Mensch“ sind sachgerecht. Die Großschreibung von „Geist“ ist im paulinischen Kontext vertretbar. Der Fußnotentext sollte die lexikalische Alternative benennen, ohne die Deutung „das innere Selbst“ als alleinige Bedeutung festzulegen.
