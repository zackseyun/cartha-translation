  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: de
  text: dass er euch entsprechend dem Reichtum seiner Herrlichkeit gewährt, durch seinen Geist mit Kraft an eurem inneren Menschen gestärkt zu werden,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: dass
  rationale: Leitet den Inhalt beziehungsweise das Ziel der in Vers 14 begonnenen Bitte ein und wahrt den syntaktischen Anschluss.
- source_word: δῷ ὑμῖν
  choice: er euch … schenkt
  rationale: δίδωμι steht im Aorist Konjunktiv unter ἵνα. „Schenkt“ passt zum Gebetskontext und gibt die gnädige Gewährung wieder, ohne einen zusätzlichen theologischen Begriff einzuführen.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: nach dem Reichtum seiner Herrlichkeit
  rationale: κατά mit Akkusativ bezeichnet hier Maßstab oder Entsprechung. „Nach dem Reichtum“ ist prägnant und verhindert die mögliche Vorstellung, Gott gebe lediglich einen Teil aus diesem Reichtum.
- source_word: δυνάμει κραταιωθῆναι
  choice: mit Kraft gestärkt zu werden
  rationale: Die instrumentale Dativform δυνάμει und der passive Infinitiv κραταιωθῆναι bleiben erkennbar. Die leichte Bedeutungsnähe von „Kraft“ und „gestärkt“ entspricht der Ausdrucksweise des griechischen Textes.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: durch seinen Geist
  rationale: διά mit Genitiv bezeichnet Mittel beziehungsweise Vermittlung. „Geist“ wird großgeschrieben, weil im paulinischen Zusammenhang Gottes Geist gemeint ist.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: am inneren Menschen
  rationale: Die Formulierung bewahrt das paulinische Bild des „inneren Menschen“ und bezeichnet den Bereich beziehungsweise das Ziel der Stärkung. „Am“ klingt im Deutschen natürlicher als ein räumlich missverständliches „in den“.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: Gottes persönlicher Geist („sein Geist“)
  alternative: Gottes Geist als unpersönliche göttliche Kraft oder Wirkung verstanden
  rationale: Der unmittelbare Kontext spricht vom Wirken Gottes in den Glaubenden; der paulinische Sprachgebrauch stützt hier die persönliche Bezugnahme. Der Text bleibt dennoch bei der schlichten Formulierung „sein Geist“.
- issue: Wiedergabe von ἔσω ἄνθρωπον
  choice: der innere Mensch
  alternative: das Innere / die innere Person
  rationale: Das Quellbild wird bewahrt, ohne die Wendung auf männliche Personen zu beschränken; der Singular bezeichnet den inneren Menschen jedes angesprochenen Gemeindeglieds.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Konstruktion „schenkt, … gestärkt zu werden“ hält die Abhängigkeit des Infinitivs von δῷ sichtbar. Der Gedankenstrich markiert die nachgestellte Ziel- beziehungsweise Bereichsangabe und erleichtert das Verständnis des langen Satzglieds.
