  source_fidelity: 'Die zentralen Lexeme sind zutreffend wiedergegeben: κατοικῆσαι als dauerhaftes Wohnen, τὸν Χριστόν als „der Messias“, διὰ τῆς πίστεως als „durch den Glauben“ sowie die beiden unterschiedlichen Bildfelder von Verwurzelung und Fundament. Die Partizipien ἐρριζωμένοι καὶ τεθεμελιωμένοι beziehen sich jedoch auf die angeredeten Leser (Plural), nicht auf den Messias.'
  naturalness: Die vorliegende Fassung lässt „in Liebe verwurzelt und fest gegründet“ grammatisch und semantisch am ehesten auf „der Messias“ zurückweisen. Eine explizite pluralische Prädikation für „ihr“ beseitigt diese falsche Zuordnung und ist im modernen Standarddeutsch natürlich. Der Konjunktiv „wohne“ bildet zudem die Gebets-/Zielabhängigkeit des griechischen Infinitivs angemessener ab als der Indikativ „wohnt“.
  terminology: „Messias“, „Glauben“, „Herzen“, „Liebe“, „verwurzelt“ und „fest gegründet“ sind registergerecht und quellennah. „Fest gegründet“ bewahrt das Fundamentbild von τεθεμελιωμένοι besser als eine bloß allgemeine Umschreibung.
