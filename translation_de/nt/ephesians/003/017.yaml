  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: de
  text: dass der Messias durch den Glauben in euren Herzen wohne und ihr in Liebe[a] verwurzelt und fest gegründet seid,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In Liebe“ gehört wahrscheinlich zu „verwurzelt und fest gegründet“. Möglich ist auch die Verbindung mit „in euren Herzen wohne“.
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: wohnt
  rationale: Der Aoristinfinitiv hängt vom vorausgehenden Gebet ab und bezeichnet Ziel oder Ergebnis. „Wohnen“ bewahrt den Gedanken eines dauerhaften Wohnens.
- source_word: τὸν Χριστόν
  choice: der Messias
  rationale: Χριστός ist hier mit Artikel als Titel gebraucht; „Messias“ gibt dessen Bedeutung wieder.
- source_word: διὰ τῆς πίστεως
  choice: durch den Glauben
  rationale: Die Wendung bezeichnet am natürlichsten das Mittel, durch das der Messias in den Herzen wohnt. „Glaube“ ist hier gegenüber „Vertrauen“ oder „Treue“ die passendste Wiedergabe.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: in euren Herzen
  rationale: Die übliche anthropologische Wendung meint das innere Leben des Menschen und ist im Deutschen natürlich verständlich.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Die Präpositionalphrase bezeichnet am wahrscheinlichsten den Bereich, in dem die Angeredeten verwurzelt und gegründet sind.
- source_word: ἐρριζωμένοι
  choice: verwurzelt
  rationale: Das Perfektpartizip beschreibt einen fortbestehenden Zustand; „verwurzelt“ erhält das Bild aus dem Pflanzenleben.
- source_word: τεθεμελιωμένοι
  choice: fest gegründet
  rationale: Das Perfektpartizip setzt neben das Bild der Wurzeln ein architektonisches Fundamentbild. „Fest gegründet“ macht diesen Sinn im heutigen Deutsch deutlich.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Der griechische Ausdruck wird hier als Titel verstanden. „Messias“ bewahrt seine Bedeutung, während „Christus“ im Deutschen eher wie ein Name wirken kann.
- issue: Bedeutung von πίστις in διὰ τῆς πίστεως
  choice: durch den Glauben
  alternative: durch Vertrauen; durch Treue
  rationale: Im Zusammenhang des Gebets bezeichnet πίστις am ehesten den Glauben als Mittel. Die lexikalisch möglichen Alternativen sind hier weniger wahrscheinlich.
- issue: Zuordnung von ἐν ἀγάπῃ
  choice: zu „verwurzelt und fest gegründet“
  alternative: zu „in euren Herzen wohnt“
  rationale: Wortstellung und Gedankengang sprechen eher dafür, „in Liebe“ mit den folgenden Partizipien zu verbinden; die andere syntaktische Zuordnung bleibt jedoch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanschluss „sodass“ bewahrt die Abhängigkeit vom vorausgehenden Gebet. Die beiden unterschiedlichen Bilder – Wurzeln und Fundament – bleiben bewusst erhalten.
