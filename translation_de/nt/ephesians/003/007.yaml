  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: de
  text: dessen Diener ich geworden bin, gemäß der Gabe der Gnade Gottes, die mir gegeben wurde, gemäß dem Wirken seiner Kraft—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dessen Diener ich gemacht wurde“.'
    reason: Die Form ἐγενήθην kann neben „ich bin geworden“ auch mit passiver Betonung verstanden werden.
lexical_decisions:
- source_word: οὗ
  choice: dessen
  rationale: Das Relativpronomen bezieht sich im Kontext auf das unmittelbar vorausgehende neutrale εὐαγγέλιον („Evangelium“). „Dessen“ bewahrt diesen Rückbezug knapp und formal.
- source_word: ἐγενήθην
  choice: ich geworden bin
  rationale: Die Aoristform von γίνομαι bezeichnet hier das Eintreten in eine Aufgabe. „Ich geworden bin“ ist natürliches Deutsch und lässt eine mögliche passive Nuance offen.
- source_word: διάκονος
  choice: Diener
  rationale: διάκονος bezeichnet hier funktional einen Menschen, der dient. „Diener“ vermeidet die Einengung auf das spätere kirchliche Amt eines Diakons.
- source_word: κατὰ τὴν δωρεὰν
  choice: entsprechend der Gabe
  rationale: κατά mit Akkusativ drückt hier Maßstab beziehungsweise Grundlage aus. „Entsprechend“ gibt diese Beziehung verständlich wieder, ohne sie bloß instrumental als „durch“ festzulegen.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: der Gnade Gottes
  rationale: Die Genitivverbindung bleibt nah an der griechischen Formulierung und wahrt, dass die Gabe in Gottes Gnade besteht oder von ihr geprägt ist.
- source_word: τῆς δοθείσης μοι
  choice: die mir gegeben wurde
  rationale: Der attributive Partizipialausdruck wird als Relativsatz wiedergegeben. Das Passiv bewahrt den Charakter der Gnade als empfangene göttliche Gabe.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: entsprechend der Wirksamkeit
  rationale: ἐνέργεια bezeichnet wirksames Tätigsein beziehungsweise Kraftentfaltung. „Wirksamkeit“ ist im Deutschen prägnant und vermeidet das technisch klingende „Operation“.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: seiner Kraft
  rationale: δύναμις bezeichnet hier Gottes Kraft oder Macht. „Kraft“ verbindet sich im Deutschen natürlich mit „Wirksamkeit“ und bewahrt den dynamischen Sinn.
theological_decisions:
- issue: Art von Paulus’ Dienst als διάκονος
  choice: Diener
  alternative: Beauftragter; Amtsträger; Diakon
  rationale: Der Vers beschreibt Paulus’ Dienst am Evangelium, ohne ausdrücklich ein fest umrissenes kirchliches Amt zu bezeichnen. „Diener“ wahrt den funktionalen Sinn.
- issue: Handlungsträger bei ἐγενήθην
  choice: ich geworden bin
  alternative: ich gemacht wurde
  rationale: Die Verbform kann eine passive Färbung haben; der Zusammenhang nennt Gottes Gnade und Kraft eindeutig als Grundlage. Die Hauptfassung legt die grammatische Stimme dennoch nicht stärker fest als nötig.
- issue: Verhältnis von Gabe, Gnade und Kraft
  choice: zweimal „entsprechend“
  alternative: „durch die Gabe“ und „durch das Wirken“
  rationale: Die Wiederholung bildet die beiden κατά-Konstruktionen ab und bewahrt die Spannung zwischen Maßstab, Grundlage und wirkender Ursache, statt sie jeweils eindeutig instrumental aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Anlehnung an die griechische Satzstruktur. Der Gedankenstrich bleibt erhalten, weil der Satz im folgenden Vers weitergeführt wird.
