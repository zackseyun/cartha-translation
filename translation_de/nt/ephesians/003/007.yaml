  terminology: „Diener“ ist für διάκονος in diesem Kontext sachgerecht und vermeidet die unberechtigte Festlegung auf ein kirchliches Amt. „Gabe der Gnade Gottes“ wahrt die griechische Genitivfügung und sollte nicht zu „Gnadengabe“ verdichtet werden, da dies im Deutschen eine stärker festgelegte theologische Fachbedeutung haben kann.
