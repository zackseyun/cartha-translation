id: EPH.3.12
reference: Ephesians 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: de
  text: In ihm haben wir Freimütigkeit und Zugang mit Zuversicht durch den Glauben an ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch seine Treue“. Die griechische Wendung kann sowohl den auf ihn gerichteten Glauben als auch seine eigene Treue bezeichnen.'
    reason: Alternative Deutung einer mehrdeutigen Genitivverbindung.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: In ihm
  rationale: Das maskuline Relativpronomen bezieht sich im Zusammenhang am natürlichsten auf Christus; die Formulierung bewahrt zugleich den Gedanken der Verbundenheit mit ihm.
- source_word: παρρησίαν
  choice: Freimütigkeit
  rationale: Das Wort bezeichnet offenes, unerschrockenes Auftreten oder Reden. „Freimütigkeit“ ist würdig und unterscheidet sich von πεποίθησις.
- source_word: προσαγωγὴν
  choice: Zugang
  rationale: Im paulinischen Zusammenhang bezeichnet der Ausdruck den Zugang zu Gottes Gegenwart; „Zugang“ ist im Deutschen klar und idiomatisch.
- source_word: ἐν πεποιθήσει
  choice: vertrauensvollen
  rationale: Die attributive Wiedergabe beschreibt den Zugang als von Zuversicht und Vertrauen geprägt, ohne ihn mit der zuvor genannten Freimütigkeit gleichzusetzen.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: durch den Glauben an ihn
  rationale: 'Der Genitiv αὐτοῦ wird im Haupttext objektiv verstanden: der auf Christus gerichtete Glaube. Die grammatisch mögliche Deutung als seine Treue bleibt in der Fußnote erhalten.'
theological_decisions:
- issue: Deutung von διὰ τῆς πίστεως αὐτοῦ
  choice: durch den Glauben an ihn
  alternative: durch seine Treue
  rationale: Die Genitivverbindung ist tatsächlich mehrdeutig. Weil der Zusammenhang den Zugang der Glaubenden hervorhebt, steht die objektive Deutung im Haupttext; die subjektive Deutung wird nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Freimütigkeit“ erhält den eigenständigen Sinn von παρρησία; „vertrauensvoller Zugang“ gibt ἐν πεποιθήσει natürlich wieder und vermeidet eine schwerfällige Doppelung mit „Zuversicht“.
