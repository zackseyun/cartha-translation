  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: de
  text: Aus diesem Grund beuge ich meine Knie vor dem Vater,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Aus diesem Grund
  rationale: Die idiomatische Verbindung bezeichnet den Grund oder Anlass des folgenden Gebets und stellt den Bezug zum vorausgehenden Zusammenhang natürlich her.
- source_word: κάμπτω
  choice: beuge ich
  rationale: Die Wiedergabe bewahrt die konkrete Bedeutung „beugen“ und verbindet sich im Deutschen natürlich mit dem ausdrücklich genannten Objekt „meine Knie“.
- source_word: τὰ γόνατά μου
  choice: meine Knie
  rationale: Die ausdrückliche Körpermetapher bleibt erhalten und bezeichnet die Gebetshaltung, statt sie zusammenfassend mit „ich knie nieder“ wiederzugeben.
- source_word: πρὸς
  choice: vor
  rationale: Bei der beschriebenen Gebetshaltung gibt „vor dem Vater“ die Ausrichtung auf den Angeredeten idiomatisch wieder. Das mögliche räumlich-direktionale Element von πρός wird dabei kontextgemäß ausgedrückt.
- source_word: πατέρα
  choice: dem Vater
  rationale: Artikel und Kontext weisen auf Gott als den im Gebet angesprochenen Vater. Die Großschreibung entspricht dem deutschen Gebrauch für die göttliche Bezeichnung.
theological_decisions:
- issue: Ob πατέρα als göttliche Bezeichnung wiederzugeben ist
  choice: dem Vater
  alternative: dem Vater (rein relational, ohne Hervorhebung als Titel)
  rationale: Paulus beschreibt ein an Gott gerichtetes Gebet; Vers 15 führt die Vater-Bezeichnung weiter aus. Die Großschreibung kennzeichnet den göttlichen Referenten, ohne zusätzliche trinitarische Erläuterungen in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Gebetshaltung des griechischen Textes bleibt erhalten. Das abschließende Komma zeigt, dass der Satz in Vers 15 weitergeführt wird.
