  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: de
  text: damit ihr stark genug seid, zusammen mit allen Heiligen zu erfassen, was die Breite und Länge und Höhe und Tiefe sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen bleibt unausgesprochen, worauf sich die Begriffe Breite, Länge, Höhe und Tiefe beziehen. Viele verstehen den Gedanken im nächsten Vers im Zusammenhang mit der Liebe des Messias.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das Ergebnis des vorausgehenden Gebets natürlich und mit erhaltener Zielrichtung ein.
- source_word: ἐξισχύσητε
  choice: ihr stark genug seid
  rationale: Das Verb bezeichnet ausreichende Stärke oder Befähigung für das folgende Erfassen. Die Formulierung gibt diesen Gedanken im heutigen Deutsch klar wieder.
- source_word: καταλαβέσθαι
  choice: zu erfassen
  rationale: Im Kontext geht es um ein geistiges beziehungsweise gedankliches Begreifen. „Erfassen“ bewahrt zugleich die kräftige Bedeutung des Verbs, ohne rein intellektuell zu klingen.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: zusammen mit allen Heiligen
  rationale: σύν bezeichnet gemeinsame Teilhabe; „die Heiligen“ ist die sachlich genaue und im paulinischen Sprachgebrauch etablierte Bezeichnung für die Glaubenden.
- source_word: τί
  choice: was … ist
  rationale: Das substantivische Fragewort führt den Inhalt dessen ein, was erfasst werden soll, ohne deutend „wie groß“ einzusetzen.
- source_word: τὸ πλάτος καὶ μῆκος καὶ ὕψος καὶ βάθος
  choice: die Breite und Länge und Höhe und Tiefe
  rationale: Die vier räumlichen Begriffe werden direkt wiedergegeben. Die wiederholte Verbindung mit „und“ erhält die feierliche Reihung des griechischen Textes.
theological_decisions:
- issue: Bezugsgröße der vier Dimensionen
  choice: Der Gegenstand von „Breite und Länge und Höhe und Tiefe“ bleibt im Haupttext unausgesprochen.
  alternative: Die Maße ausdrücklich auf die Liebe des Messias oder auf Gottes Heilsplan beziehen.
  rationale: Der griechische Vers nennt keine Bezugsgröße. Eine Ergänzung würde die offene Formulierung vorzeitig auflösen; erst der folgende Vers legt besonders die Liebe des Messias als möglichen Zusammenhang nahe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Stark genug“ ist allgemein verständlich und bildet den Gedanken ausreichender Befähigung genauer ab als das abstraktere „Kraft haben“. Die offene syntaktische Spannung des Ausgangstextes bleibt erhalten.
