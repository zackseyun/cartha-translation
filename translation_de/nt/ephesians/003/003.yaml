id: EPH.3.3
reference: Ephesians 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: de
  text: dass mir das Geheimnis durch Offenbarung[a] bekannt gemacht wurde[b], wie ich zuvor kurz geschrieben habe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gemäß einer Offenbarung“; auch: „aufgrund einer Offenbarung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mir offenbart wurde“; wörtlich: „mir bekannt gemacht wurde“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in Kürze“ beziehungsweise „mit wenigen Worten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: durch Offenbarung
  rationale: κατά mit dem Akkusativ bezeichnet hier die Weise oder Grundlage der Mitteilung. „Durch Offenbarung“ ist im Deutschen natürlich und lässt offen, wie genau die Offenbarung geschah.
- source_word: ἐγνωρίσθη μοι
  choice: mir … bekannt gemacht wurde
  rationale: Die passive Form von γνωρίζω wird formal und idiomatisch wiedergegeben, ohne den im Griechischen unausgesprochenen Handelnden ausdrücklich zu benennen.
- source_word: τὸ μυστήριον
  choice: das Geheimnis
  rationale: „Geheimnis“ bewahrt den paulinischen Begriff für einen zuvor verborgenen und nun kundgemachten göttlichen Ratschluss, ohne seinen Inhalt hier vorwegzunehmen.
- source_word: καθὼς
  choice: wie
  rationale: „Wie“ stellt den schlichten Vergleich beziehungsweise Rückbezug auf das zuvor Geschriebene natürlich her.
- source_word: προέγραψα
  choice: ich zuvor … geschrieben habe
  rationale: Im Zusammenhang verweist προγράφω am ehesten auf das frühere Schreiben innerhalb des Briefes; „zuvor geschrieben“ gibt diesen zeitlichen Sinn klar wieder.
- source_word: ἐν ὀλίγῳ
  choice: kurz
  rationale: Die Wendung bezeichnet eine knappe Darstellung. „Kurz“ ist gegenwärtiges, natürliches Deutsch und vermeidet eine unnötige Festlegung auf die Zahl der Wörter.
theological_decisions:
- issue: Bedeutung von μυστήριον im paulinischen Sprachgebrauch
  choice: das Geheimnis
  alternative: der verborgene Plan Gottes
  rationale: Der Vers benennt den Begriff, entfaltet seinen Inhalt aber noch nicht vollständig. „Das Geheimnis“ wahrt die theologische Kategorie und überlässt ihre Erklärung dem Kontext.
- issue: Unausgesprochener Handelnder beim Passiv ἐγνωρίσθη
  choice: Passiv ohne ausdrückliche Nennung des Handelnden
  alternative: Gott machte mir das Geheimnis bekannt
  rationale: Der Zusammenhang legt Gott als Handelnden nahe, doch der griechische Satz nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese Form und vermeidet eine Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als abhängiger dass-Satz an den vorhergehenden Kontext angebunden. Die Wortstellung ist natürlich, während Passiv, Schlüsselbegriff und semantische Offenheit des griechischen Textes erhalten bleiben.
