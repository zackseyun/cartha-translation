id: EPH.3.8
reference: Ephesians 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: de
  text: Mir, dem Allergeringsten von allen Heiligen, wurde diese Gnade gegeben — den Nichtjuden[a] den unergründlichen Reichtum des Messias als gute Botschaft zu verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Völkern“. Gemeint sind hier im Zusammenhang die nichtjüdischen Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: dem Allergeringsten
  rationale: Die ungewöhnliche Steigerungsform drückt äußerste Selbstdemütigung aus. „Allergeringsten“ bewahrt die rhetorische Zuspitzung in natürlichem Deutsch.
- source_word: ἁγίων
  choice: allen Heiligen
  rationale: Bezeichnet im paulinischen Sprachgebrauch die zu Gott gehörenden Gläubigen; „Heilige“ ist knapp, würdig und lexikalisch eng am Ausgangstext.
- source_word: χάρις
  choice: Gnade
  rationale: Bewahrt sowohl den Gedanken unverdienter göttlicher Zuwendung als auch den hier damit verbundenen Auftrag.
- source_word: τοῖς ἔθνεσιν
  choice: den Nichtjuden
  rationale: Im Zusammenhang des Epheserbriefs meint ἔθνη die Völker außerhalb Israels beziehungsweise Menschen, die keine Juden sind. „Nichtjuden“ macht diesen Gegensatz im heutigen Deutsch unmittelbar verständlich.
- source_word: εὐαγγελίσασθαι
  choice: zu verkünden
  rationale: Gibt den Auftrag wieder, die gute Botschaft öffentlich bekannt zu machen, und verbindet sich natürlich mit dem folgenden Gegenstand der Verkündigung.
- source_word: ἀνεξιχνίαστον
  choice: unergründlichen
  rationale: Bezeichnet etwas, dessen Ausmaß nicht vollständig erforscht oder erfasst werden kann; „unergründlich“ wahrt Bild und Sinn.
- source_word: πλοῦτος
  choice: Reichtum
  rationale: Der griechische Singular wird im Deutschen natürlich als „Reichtum“ wiedergegeben und bezeichnet die unermessliche Fülle dessen, was im Messias gegeben ist.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist der griechische Titel für den Gesalbten. „Messias“ gibt hier die Titelfunktion verständlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Die Übersetzung als Titel macht die Bedeutung „der Gesalbte“ sichtbar, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Bezug von χάρις
  choice: Gnade
  alternative: Gnadengabe / gnädiger Auftrag
  rationale: 'Der knappe Ausdruck bewahrt die theologische Weite: Gemeint sein kann sowohl Gottes unverdiente Zuwendung als auch der aus ihr hervorgehende Verkündigungsauftrag.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der ungewöhnlich starke Demutsausdruck wird mit „Allergeringsten“ bewahrt; der Satz bleibt trotz enger Bindung an die griechische Struktur gut verständlich.
