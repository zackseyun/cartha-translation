    issue: Die Bedeutung von εὐαγγελίσασθαι wird mit „zu verkünden“ allein nicht vollständig ausgedrückt.
    rationale: Das Verb bezeichnet nicht nur irgendein Verkünden, sondern das Verkündigen einer guten Botschaft. Da der Gegenstand im Griechischen „der unergründliche Reichtum des Messias“ ist, kann dies im Deutschen natürlich mit „als gute Botschaft zu verkünden“ wiedergegeben werden.
  - severity: low
    issue: Der Fußnotenanker steht am Satzende statt unmittelbar bei „Nichtjuden“.
    rationale: Die Fußnote erläutert ausschließlich die Wiedergabe von τοῖς ἔθνεσιν. Ein unmittelbarer Anker macht den Bezug eindeutig.
  revised_text: Mir, dem Allergeringsten von allen Heiligen, wurde diese Gnade gegeben — den Nichtjuden[a] den unergründlichen Reichtum des Messias als gute Botschaft zu verkünden.
