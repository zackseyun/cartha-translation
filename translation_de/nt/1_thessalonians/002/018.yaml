source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: de
  text: Denn wir wollten zu euch kommen – ich, Paulus, mehr als einmal[a] –, doch der Satan hat uns daran gehindert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einmal und zweimal«; eine Wendung im Sinn von »mehr als einmal«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den erklärenden Zusammenhang natürlich.
- source_word: ἠθελήσαμεν
  choice: wir wollten
  rationale: Gibt den Willen beziehungsweise Wunsch in klarem, heutigem Deutsch wieder.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: zu euch kommen
  rationale: Bewahrt die im Ausgangstext ausgedrückte Bewegung zu den Adressaten, ohne einen Besuch oder eine Rückkehr ausdrücklich hinzuzufügen.
- source_word: ἐγὼ μὲν Παῦλος
  choice: ich, Paulus
  rationale: Hebt Paulus innerhalb des vorausgehenden »wir« hervor, ohne für μέν einen unnatürlichen deutschen Gegenpart zu erzwingen.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: sogar mehr als einmal
  rationale: Gibt die idiomatische Wendung »sowohl einmal als auch zweimal« verständlich wieder und erhält durch »sogar« die hervorhebende Kraft der wiederholten καί.
- source_word: ἐνέκοψεν
  choice: hat uns daran gehindert
  rationale: Drückt die Behinderung des beabsichtigten Kommens aus, ohne über den Wortlaut hinaus eine uneingeschränkt endgültige Verhinderung zu behaupten.
- source_word: ὁ Σατανᾶς
  choice: der Satan
  rationale: Entspricht der im Deutschen etablierten persönlichen Bezeichnung und bildet den griechischen Artikel angemessen ab.
theological_decisions:
- issue: Satans Wirken bei der Verhinderung von Paulus’ Reise
  choice: doch der Satan hat uns daran gehindert
  alternative: doch der Widersacher hat uns aufgehalten
  rationale: Die persönliche Urheberschaft Satans wird ausdrücklich bewahrt; zugleich wird weder erklärt, auf welche Weise er handelte, noch eine stärkere absolute Bestimmung in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche markieren die eingeschobene persönliche Hervorhebung des Paulus; die Fußnote bewahrt die ungewöhnliche wörtliche Form der griechischen Wendung.
