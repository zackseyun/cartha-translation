  rationale: Die Revision vermeidet eine unnötige konzessive Deutung der Partizipien und erhält bei ἀγών die im Griechischen offene Bedeutung von Kampf, Ringen oder Konflikt. Sie korrigiert außerdem die Zuordnung des Fußnotenankers und präzisiert die lexikalische Anmerkung zu ἐπαρρησιασάμεθα, ohne die Aussage oder theologischen Bezüge zu verändern.
