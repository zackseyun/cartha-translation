    rationale: Die aoristischen Partizipien bezeichnen primär vorausgehende Umstände; ein konzessiver Sinn ist möglich, aber nicht ausdrücklich markiert. »Nachdem« wahrt die zeitliche Abfolge ohne zusätzliche Festlegung.
  - severity: medium
    issue: »trotz heftigen Widerstands« verengt ἐν πολλῷ ἀγῶνι
    rationale: ἀγών kann Kampf, Ringen oder Auseinandersetzung meinen und muss nicht ausschließlich äußerem Widerstand entsprechen. Außerdem gibt »trotz« nicht die einfache ἐν-Konstruktion wieder.
