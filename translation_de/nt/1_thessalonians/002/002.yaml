  source_fidelity: Die Abfolge des vorausgehenden Leidens, der entehrenden Behandlung in Philippi und des anschließenden mutigen Verkündigens ist grundsätzlich getroffen. »Obwohl« macht das Verhältnis der Partizipien jedoch stärker konzessiv, als der griechische Text es ausdrücklich markiert. »Trotz heftigen Widerstands« legt ἀγών zudem auf äußere Gegnerschaft fest und verschiebt ἐν von einer Situierung zu einem Gegensatz.
  naturalness: Die deutsche Formulierung ist weitgehend flüssig. »Nachdem« bildet die zeitlich-vorausgehende Funktion von προπαθόντες und ὑβρισθέντες idiomatisch ab. »In schwerem Kampf« bewahrt einen würdigen, verständlichen Registerton und lässt die Art des ἀγών offen.
  terminology: »Evangelium Gottes« und »in unserem Gott« bewahren die paulinische Terminologie beziehungsweise die Offenheit der Präpositionalphrase. »Schändlich misshandelt« gibt die entehrende Dimension von ὑβρισθέντες angemessen wieder. Die Fußnote zu ἐπαρρησιασάμεθα wird sprachlich und sachlich präzisiert.
