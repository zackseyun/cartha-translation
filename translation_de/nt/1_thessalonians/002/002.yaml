source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: de
  text: Doch nachdem wir zuvor gelitten hatten und, wie ihr wisst, in Philippi schändlich misshandelt worden waren[a], fassten wir in unserem Gott den Mut[b], euch das Evangelium Gottes zu verkünden – in schwerem Kampf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beleidigend behandelt«, »entehrend misshandelt« oder »missbraucht worden waren«. Das griechische Verb bezeichnet eine anmaßende, öffentlich entehrende Behandlung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wir redeten in unserem Gott mutig« oder »wir traten in unserem Gott freimütig auf«. Das griechische Verb kann selbst mutiges beziehungsweise freimütiges Reden einschließen; die Übersetzung gibt es mit »fassten ... den Mut« wieder und lässt das Reden im folgenden Infinitiv ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »unter großem Ringen«, »in vielen Auseinandersetzungen« oder »inmitten heftiger Konflikte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zum vorherigen Gedanken und verbindet den Vers zugleich natürlich mit dem Kontext.
- source_word: προπαθόντες
  choice: obwohl wir zuvor gelitten hatten
  rationale: Das Aoristpartizip bezeichnet ein dem Hauptgeschehen vorausgehendes Leiden; »zuvor« gibt die Bedeutung des Präfixes προ- wieder. Die konzessive Fassung entspricht dem gedanklichen Verhältnis zum mutigen Reden.
- source_word: ὑβρισθέντες
  choice: schändlich misshandelt worden waren
  rationale: Das Verb bezeichnet eine anmaßende, entehrende und missbräuchliche Behandlung, nicht nur eine verbale Beleidigung.
- source_word: καθὼς οἴδατε
  choice: wie ihr wisst
  rationale: Gibt den parenthetischen Hinweis auf das Wissen der Adressaten schlicht und idiomatisch wieder.
- source_word: ἐν Φιλίπποις
  choice: in Philippi
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: ἐπαρρησιασάμεθα
  choice: fassten wir ... den Mut
  rationale: παρρησιάζομαι bezeichnet freimütiges, mutiges Reden oder Auftreten. Diese Wiedergabe vermeidet eine schwerfällige Doppelung mit λαλῆσαι und bewahrt dessen Sprechkomponente in der Fußnote.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: in unserem Gott
  rationale: Bewahrt bewusst die relationale beziehungsweise sphärische Offenheit der griechischen Präpositionalphrase, statt sie eindeutig instrumental aufzulösen.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: euch ... zu verkünden
  rationale: Im Zusammenhang mit dem Evangelium ist »verkünden« natürliches Deutsch; eine Fußnote weist auf die wörtlichere Wiedergabe »zu euch zu reden« hin.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: das Evangelium Gottes
  rationale: Bewahrt den vertrauten paulinischen Ausdruck und die offene Beziehung des Genitivs.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: trotz heftigen Widerstands
  rationale: ἀγών kann Kampf, Ringen oder konfliktreiche Anfechtung bezeichnen. Im Kontext bringt »heftiger Widerstand« die äußere Gegnerschaft klar und natürlich zum Ausdruck, ohne die Alternativen zu verschweigen.
theological_decisions:
- issue: Bedeutung von ἐν τῷ θεῷ ἡμῶν
  choice: in unserem Gott
  alternative: durch unseren Gott; im Vertrauen auf unseren Gott
  rationale: Die Formulierung lässt offen, ob vor allem die Sphäre, Grundlage oder Befähigung des mutigen Auftretens gemeint ist, und verengt die Aussage nicht auf eine rein instrumentale Deutung.
- issue: Genitiv in τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: das Evangelium Gottes
  alternative: Gottes Evangelium; die gute Nachricht von Gott
  rationale: Die Genitivkonstruktion bleibt erhalten und legt nicht fest, ob Gott vor allem als Ursprung, Urheber oder Inhalt der Botschaft hervortritt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der griechischen Abfolge, wird jedoch für heutige Leser geglättet. »Evangelium« bewahrt den vertrauten theologischen Ausdruck; die Fußnoten sichern wichtige lexikalische Alternativen und echte Mehrdeutigkeiten.
