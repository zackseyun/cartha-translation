id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: de
  text: Denn ihr selbst wisst, Brüder[a], dass unser Kommen zu euch nicht vergeblich gewesen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Brüder und Schwestern«; im Griechischen steht »Brüder«, eine Anrede, die häufig die ganze Glaubensgemeinschaft einschließt.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: ihr selbst
  rationale: Die intensive Verwendung von αὐτοί hebt das eigene, unmittelbare Wissen der Thessalonicher hervor.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet den vorhergehenden Gedanken und bewahrt den argumentativen Zusammenhang.
- source_word: οἴδατε
  choice: wisst
  rationale: Obwohl οἶδα formal eine Perfektform ist, hat es hier präsentische Bedeutung; »wisst« ist natürlich und sachlich genau.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird quellennah wiedergegeben. Da sie im paulinischen Sprachgebrauch häufig die ganze Glaubensgemeinschaft einschließt, erläutert eine Fußnote den weiteren Bezug.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: unser Kommen zu euch
  rationale: εἴσοδος bezeichnet hier das Eintreffen beziehungsweise den missionarischen Besuch des Paulus und seiner Mitarbeiter; »Kommen zu euch« ist im Deutschen natürlich und bewahrt die Richtungsangabe.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt dessen ein, was die Adressaten wissen.
- source_word: οὐ κενὴ
  choice: nicht vergeblich
  rationale: κενός kann »leer«, »wirkungslos« oder »vergeblich« bedeuten. »Nicht vergeblich« bewahrt die Aussage, ohne sie auf bloßen sichtbaren Erfolg zu verengen.
- source_word: γέγονεν
  choice: gewesen ist
  rationale: Das Perfekt von γίνομαι beschreibt den eingetretenen und weiterhin bedeutsamen Charakter ihres Kommens; das deutsche Perfekt gibt dies idiomatisch wieder.
theological_decisions:
- issue: Bedeutungsumfang der Anrede ἀδελφοί in einer gemischten Gemeinde
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die maskuline Form des Ausgangstextes bleibt im Haupttext sichtbar. Der wahrscheinliche Bezug auf die gesamte Glaubensgemeinschaft wird in der Fußnote ausdrücklich offengehalten, statt im Haupttext stillschweigend festgelegt zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber flüssig und allgemein verständlich; »nicht vergeblich gewesen ist« bewahrt sowohl die Rückschau als auch die fortdauernde Bedeutung des Kommens.
