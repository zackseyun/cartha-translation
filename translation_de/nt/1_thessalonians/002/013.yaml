source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: de
  text: 'Und deshalb danken auch wir Gott unablässig dafür: Als ihr Gottes Wort empfingt, das ihr von uns gehört hattet,[a] habt ihr es nicht als Menschenwort angenommen, sondern – wie es in Wahrheit ist – als Gottes Wort, das auch in euch, die ihr glaubt, wirksam ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „als ihr die Botschaft Gottes empfingt, die ihr von uns gehört hattet“. Die griechische Wortverbindung ist stark verdichtet.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Relativpronomen kann auch auf Gott bezogen werden: „Er ist auch in euch wirksam, die ihr glaubt.“'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Gibt den ausdrücklichen Rückbezug auf den vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: danken auch wir Gott unablässig
  rationale: Bewahrt den fortdauernden Charakter des Dankens und die mit καί markierte Einbeziehung der Absender.
- source_word: παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: als ihr Gottes Wort empfingt, das ihr von uns gehört hattet
  rationale: Entfaltet die gedrängte Genitivverbindung in natürlichem Deutsch, ohne λόγος vorzeitig nur als allgemeine „Botschaft“ abzuschwächen.
- source_word: ἐδέξασθε
  choice: habt ihr es … angenommen
  rationale: Unterscheidet die zustimmende Annahme von dem zuvor genannten Empfangen und erhält so die rhetorische Bewegung des Satzes.
- source_word: οὐ λόγον ἀνθρώπων
  choice: nicht als Menschenwort
  rationale: Das idiomatische deutsche Kompositum gibt den qualitativen Gegensatz zu Gottes Wort prägnant und geschlechtsübergreifend wieder.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: 'sondern als das, was es in Wahrheit ist: Gottes Wort'
  rationale: Erhält die bekräftigende Parenthese sowie die pointierte Wiederholung von „Wort“ und gestaltet sie im Deutschen verständlich.
- source_word: ἐνεργεῖται
  choice: ist … wirksam
  rationale: Gibt die gegenwärtige, wirksame Tätigkeit wieder, ohne die mögliche mediale oder passive Nuance unnötig festzulegen.
- source_word: τοῖς πιστεύουσιν
  choice: in euch …, die ihr glaubt
  rationale: Bewahrt den substantivierten Präsenspartizipcharakter als fortdauernde Kennzeichnung der Adressaten.
theological_decisions:
- issue: Bezugswort des Relativpronomens ὃς
  choice: 'Bezug auf „Gottes Wort“: „Dieses ist auch in euch wirksam“'
  alternative: 'Bezug auf Gott: „Er ist auch in euch wirksam“'
  rationale: Das maskuline Relativpronomen kann grammatisch sowohl auf λόγος als auch auf θεός bezogen werden. Der unmittelbare Satzbau und der Gedankengang sprechen eher für „Wort“; die mögliche Beziehung auf Gott bleibt in einer Fußnote sichtbar.
- issue: Bedeutungsgewicht von λόγον θεοῦ
  choice: „Gottes Wort“
  alternative: „Gottes Botschaft“
  rationale: Die wörtliche Wiedergabe erhält den ausdrücklich aufgebauten Gegensatz zwischen Menschenwort und Gottes Wort, ohne daraus eine weitergehende Inspirationslehre abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschenwort“ hält den rhetorischen Gegensatz knapp und vermeidet das heute missverständliche generische „Wort von Männern“. Der Doppelpunkt gliedert den langen griechischen Satz lesefreundlich; „in Wahrheit“ bewahrt den feierlich-bekräftigenden Ton.
