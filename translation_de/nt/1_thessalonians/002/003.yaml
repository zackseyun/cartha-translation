lexical_decisions:
- source_word: παράκλησις
  choice: Aufruf
  rationale: „Aufruf“ gibt hier das eindringliche Werben und Ermahnen der missionarischen Verkündigung natürlich wieder, ohne den Ausdruck auf Trost oder bloßen Mitteilungsinhalt zu verengen.
- source_word: πλάνης
  choice: Irrtum
  rationale: Mit ἐκ bezeichnet πλάνη den Ursprung des Aufrufs. „Irrtum“ wahrt den möglichen Sinn von falscher Auffassung oder Irreführung und unterscheidet ihn von der bewussten Hinterlist des folgenden δόλος.
- source_word: ἀκαθαρσίας
  choice: Unreinheit
  rationale: Der breite Ausdruck lässt die Art der moralischen Unreinheit offen, wie es auch der griechische Text tut; eine ausdrückliche Einschränkung auf sexuelle Unmoral wäre hier zu eng.
- source_word: δόλῳ
  choice: mit Hinterlist
  rationale: Die Wendung mit ἐν beschreibt die Art und Weise. „Mit Hinterlist“ bezeichnet bewusstes, arglistiges Vorgehen und bewahrt den Unterschied zum möglicherweise unabsichtlichen Irrtum.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: entspringt weder ... noch ... und erfolgt auch nicht mit ...
  rationale: Die Formulierung unterscheidet natürlich im Deutschen zwischen dem Ursprung, den ἐκ/ἐξ ausdrücken, und der durch ἐν bezeichneten Art und Weise.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ erhält die begründende Verbindung zum vorhergehenden Vers.
theological_decisions:
- issue: Bedeutungsumfang von ἀκαθαρσία
  choice: Allgemein als „Unreinheit“ wiedergeben
  alternative: „sexuelle Unreinheit“
  rationale: Obwohl das Wort sexuelle Unmoral einschließen kann, legt der Vers diese Einengung nicht ausdrücklich fest. Die breite Wiedergabe vermeidet einen zusätzlichen Vorwurf, den der Text selbst nicht näher bestimmt.
- issue: Verhältnis von πλάνη und δόλος
  choice: „Irrtum“ und „Hinterlist“ als unterscheidbare Begriffe wiedergeben
  alternative: Beide Begriffe mit Wörtern aus dem Bedeutungsfeld „Täuschung“ wiedergeben
  rationale: So bleibt die Spannung zwischen falscher Auffassung beziehungsweise Irreführung als Ursprung und bewusst arglistigem Vorgehen als Handlungsweise erkennbar, ohne auszuschließen, dass πλάνη auch „Täuschung“ bedeuten kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entspringt“ und „erfolgt“ machen den Wechsel von Herkunft (ἐκ/ἐξ) zu Art und Weise (ἐν) verständlich, ohne die dreifache Verneinung unnötig schwerfällig zu gestalten.
