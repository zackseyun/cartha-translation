    rationale: Das Griechische lässt das Partizip im zweiten Glied aus; im Deutschen ist die entsprechende Auslassung nach einer »um … zu«-Konstruktion nicht idiomatisch. »Sondern um Gott zu gefallen« muss ergänzt werden.
