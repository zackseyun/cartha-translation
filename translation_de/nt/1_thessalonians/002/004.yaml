source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: de
  text: 'Sondern so, wie Gott uns geprüft und für geeignet befunden hat, mit dem Evangelium betraut zu werden, so reden wir: nicht um Menschen zu gefallen, sondern um Gott zu gefallen, der unsere Herzen prüft.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: uns geprüft und für geeignet befunden hat
  rationale: Das Perfekt Passiv bezeichnet eine abgeschlossene Prüfung mit fortdauerndem Ergebnis. Die Doppelwendung bewahrt sowohl den Prüfungsvorgang als auch das positive Urteil, ohne eine besondere Würdigkeit zu behaupten.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: mit dem Evangelium betraut zu werden
  rationale: Das passive πιστευθῆναι bezeichnet hier das Anvertrauen eines Gutes beziehungsweise Auftrags, nicht das Glauben an das Evangelium.
- source_word: τὸ εὐαγγέλιον
  choice: das Evangelium
  rationale: Der etablierte paulinische Begriff bewahrt die theologische Dichte und ist im modernen Standarddeutsch allgemein verständlich.
- source_word: οὕτως λαλοῦμεν
  choice: so reden wir
  rationale: Die Formulierung erhält die Folgerungs- und Entsprechungsstruktur von καθὼς … οὕτως und klingt zugleich natürlich.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: nicht um Menschen zu gefallen
  rationale: Die griechische Partizipialkonstruktion wird im Deutschen idiomatisch als Absichts- beziehungsweise Ausrichtungsangabe wiedergegeben.
- source_word: ἀλλὰ θεῷ
  choice: sondern Gott
  rationale: Die knappe Ellipse des Griechischen bleibt sichtbar; das zuvor genannte ‚zu gefallen‘ ist sinngemäß zu ergänzen.
- source_word: τῷ δοκιμάζοντι
  choice: der … prüft
  rationale: Das Präsenspartizip beschreibt Gottes fortwährendes Prüfen und wahrt die Wortverbindung zu δεδοκιμάσμεθα.
- source_word: τὰς καρδίας ἡμῶν
  choice: unsere Herzen
  rationale: ‚Herzen‘ erhält den biblisch-anthropologischen Ausdruck und verengt ihn nicht auf Verstand oder Gefühle.
theological_decisions:
- issue: Der Gegensatz zwischen dem Gefallen von Menschen und dem Gefallen Gottes
  choice: nicht um Menschen zu gefallen, sondern Gott
  alternative: nicht um Menschen zu gefallen, sondern um Gott zu gefallen
  rationale: Der Haupttext wahrt die griechische Ellipse, in der ἀρέσκοντες nur im ersten Teil ausdrücklich steht. Die Fußnote bietet die im Deutschen vollständig ausformulierte Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Korrespondenz »so, wie …, so« bildet καθὼς … οὕτως ab. Die Formulierung »geprüft und für geeignet befunden« macht den positiven Ausgang der göttlichen Prüfung deutlich, ohne »würdig« einzutragen.
