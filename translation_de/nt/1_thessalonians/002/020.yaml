  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: de
  text: Denn ihr seid unser Ruhm und unsere Freude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für „Ruhm“ auch: „Ehre“ oder „Herrlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen der zweiten Person Plural trägt Nachdruck; im Deutschen wird dieser durch das vorangestellte „ihr“ hinreichend wiedergegeben.
- source_word: γάρ
  choice: denn
  rationale: Die Konjunktion begründet oder erläutert die vorhergehende Aussage; „denn“ bewahrt diesen logischen Anschluss knapp und natürlich.
- source_word: ἐστε
  choice: seid
  rationale: Der Präsens Indikativ von εἰμί wird direkt und idiomatisch mit „seid“ wiedergegeben.
- source_word: ἡ δόξα ἡμῶν
  choice: unsere Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt die Breite und das rhetorische Gewicht von δόξα. Im zwischenmenschlichen Zusammenhang sind auch „Ruhm“ und „Ehre“ möglich.
- source_word: ἡ χαρά
  choice: Freude
  rationale: „Freude“ ist die direkte und natürliche Wiedergabe des Substantivs χαρά, ohne es in eine Tätigkeit wie „Jubeln“ umzudeuten.
theological_decisions:
- issue: Wiedergabe von δόξα in einer persönlichen Aussage des Paulus
  choice: Herrlichkeit
  alternative: Ruhm oder Ehre
  rationale: Der Vers formuliert keine technische Lehrdefinition, sondern bezeichnet die Thessalonicher als Herrlichkeit und Freude der Missionare. „Herrlichkeit“ wahrt die lexikalische Verbindung und die Spannung der bildhaften Aussage; die kontextuell naheliegenden Bedeutungen „Ruhm“ und „Ehre“ werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des griechischen Satzes bleibt erhalten; „Denn“ stellt den Zusammenhang mit dem vorhergehenden Vers her.
