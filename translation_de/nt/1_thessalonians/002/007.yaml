source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: de
  text: Obwohl wir als Apostel des Messias[a] mit Gewicht hätten auftreten können[b], wurden wir doch sanft[c] in eurer Mitte – wie eine stillende Mutter, die ihre eigenen Kinder liebevoll umsorgt.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für »Messias« steht im Griechischen Χριστός; traditionelle Wiedergabe: »Christus« beziehungsweise hier »Christi«.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: »gewichtig sein«. Gemeint sein kann auch: »Autorität geltend machen«, »Ansprüche stellen« oder »zur Last fallen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Andere Handschriften lesen statt »sanft«: »wie unmündige Kinder« beziehungsweise »kindlich« in eurer Mitte.'
    reason: textual_variant
  - marker: d
    text: 'Auch möglich: »wie eine Amme« oder »wie eine stillende Frau«. Das Bild ist von zärtlicher mütterlicher Fürsorge geprägt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι
  choice: obwohl wir … hätten … können
  rationale: Das Partizip erhält durch den Gegensatz mit ἀλλά einen einräumenden Sinn; die deutsche Konstruktion gibt diesen natürlich wieder.
- source_word: ἐν βάρει εἶναι
  choice: mit Gewicht auftreten
  rationale: Die griechische Wendung bedeutet wörtlich etwa »in Gewichtigkeit sein«. Die gewählte Formulierung bewahrt das Bild und lässt offen, ob besonders Autorität, Ansprüche oder Belastung gemeint sind.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: als Apostel des Messias
  rationale: Χριστός wird hier als Titel gebraucht; der Genitiv wird im Deutschen natürlich mit »des Messias« wiedergegeben.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: wurden wir doch
  rationale: »Wurden« bewahrt den Vorgangscharakter von γίνομαι; »doch« macht den Gegensatz zur einräumenden Eröffnung deutlich.
- source_word: ἤπιοι
  choice: sanft
  rationale: Das Adjektiv bezeichnet ein mildes, behutsames Verhalten; »sanft« passt zugleich zum folgenden Bild mütterlicher Fürsorge.
- source_word: ἐν μέσῳ ὑμῶν
  choice: in eurer Mitte
  rationale: Die Wendung ist verständliches, würdevolles Deutsch und bildet die räumlich-gemeinschaftliche Ausdrucksweise der Vorlage ab.
- source_word: ὡς ἐὰν τροφὸς
  choice: wie eine stillende Mutter
  rationale: τροφός bezeichnet hier eine Frau, die Kinder stillt und versorgt. Wegen »ihre eigenen Kinder« liegt im Kontext das Bild einer stillenden Mutter näher als das moderne Berufsbild einer Krankenpflegerin.
- source_word: θάλπῃ
  choice: liebevoll umsorgt
  rationale: Das Verb kann wörtlich »wärmen« und übertragen zärtlich nähren oder pflegen bedeuten. »Liebevoll umsorgt« vermittelt die fürsorgliche Wärme des Bildes.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: ihre eigenen Kinder
  rationale: »Kinder« entspricht τέκνα; »eigenen« gibt die durch ἑαυτῆς gesetzte Betonung wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / des Christus
  rationale: Χριστός fungiert hier als Titel. »Messias« macht diesen Titelsinn transparent, während die traditionelle Wiedergabe in der Fußnote erhalten bleibt.
- issue: Bedeutung von ἐν βάρει εἶναι
  choice: mit Gewicht auftreten
  alternative: zur Last fallen / Ansprüche stellen / Autorität geltend machen
  rationale: Der Ausdruck kann apostolische Autorität und daraus folgende Ansprüche bezeichnen, möglicherweise auch eine konkrete Belastung. Der Haupttext wahrt diese Spannung, ohne sie auf finanzielle Unterstützung zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Metapher des Gewichts bleibt in idiomatischer Form erhalten; der Gedankenstrich führt klar in das mütterliche Vergleichsbild. Die Handschriftenvariante bei ἤπιοι wird ausgewiesen, weil sie den Sinn merklich verändert.
