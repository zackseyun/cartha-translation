revisions:
- from: Denn wer ist unsere Hoffnung oder Freude oder unser Siegeskranz, dessen wir uns rühmen? Seid nicht gerade auch ihr es vor unserem Herrn Jesus bei seiner Ankunft[a]?
  to: Denn was ist unsere Hoffnung oder Freude oder unser Ruhmeskranz vor unserem Herrn Jesus bei seiner Ankunft[a], wenn nicht auch ihr?
  rationale: Die Revision stellt die sachlich passende Frageform „was“ wieder her, fasst den Vers als eine einzige rhetorische Frage und ordnet „vor unserem Herrn Jesus bei seiner Ankunft“ natürlich dem Ruhmeskranz zu. „Ruhmeskranz“ wahrt das Bild von στέφανος καυχήσεως ohne die nicht ausdrücklich geforderte Nuance eines errungenen Sieges. Die Fußnote bewahrt die lexikalische Spannweite von παρουσία.
