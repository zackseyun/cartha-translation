review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von γάρ, ἐλπίς, χαρά, οὐχί, καί, ἔμπροσθεν, κύριος und παρουσία ist grundsätzlich sachgerecht. τίς bezieht sich jedoch auf die genannten unpersönlichen Prädikatsnomen und ist hier im Deutschen mit „was“, nicht „wer“, wiederzugeben. Die zwei Fragen des Entwurfs zerlegen zudem die eine griechische rhetorische Frage unnötig und machen ihren syntaktischen Zusammenhang weniger klar.
  naturalness: „Seid nicht gerade auch ihr es vor unserem Herrn Jesus bei seiner Ankunft?“ ist im Deutschen schwerfällig; insbesondere ist der Anschluss von „vor unserem Herrn Jesus bei seiner Ankunft“ an „es“ missverständlich. Eine einzige Frage mit „wenn nicht auch ihr?“ ist idiomatisch und bildet die erwartete bejahende Antwort natürlich ab.
  terminology: „Siegeskranz“ kann bei στέφανος eine mögliche Bildseite treffen, fügt aber die Vorstellung eines Sieges stärker ein, als der Kontext verlangt. „Ruhmeskranz“ ist im Deutschen eine etablierte, knappe Wiedergabe von στέφανος καυχήσεως. „Ankunft“ für παρουσία ist im eschatologischen Kontext vertretbar; die lexikalischen Alternativen bleiben in der Fußnote erhalten.
  issues:
  - severity: medium
    issue: „wer“ für τίς
    rationale: Die Frage lautet nach dem, was die Hoffnung, Freude oder der Ruhmeskranz ist; die nachfolgende Anrede identifiziert die Thessalonicher als diese Größen. Daher verlangt der deutsche Satzbau „was“.
  - severity: medium
    issue: Aufspaltung und Wortstellung der rhetorischen Frage
    rationale: Die griechische Konstruktion ist eine zusammenhängende Frage. Die Fassung mit „Seid nicht ... ihr es vor ...?“ ist syntaktisch belastet und verdunkelt, dass die Orts-/Zeitangabe den Ruhmeskranz vor Christus bei seiner Ankunft näher bestimmt.
  - severity: low
    issue: „Siegeskranz“
    rationale: στέφανος kann zwar einen Siegerkranz bezeichnen, doch ist ein Sieg hier nicht ausdrücklich im Blick. „Ruhmeskranz“ gibt die Verbindung mit καυχήσεως ohne diese zusätzliche Akzentsetzung wieder.
  revised_text: Denn was ist unsere Hoffnung oder Freude oder unser Ruhmeskranz vor unserem Herrn Jesus bei seiner Ankunft[a], wenn nicht auch ihr?
