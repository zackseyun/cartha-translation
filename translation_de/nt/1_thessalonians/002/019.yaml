source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: de
  text: Denn was ist unsere Hoffnung oder Freude oder unser Ruhmeskranz vor unserem Herrn Jesus bei seiner Ankunft[a], wenn nicht auch ihr?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei seinem Kommen« oder »in seiner Gegenwart«. Das griechische Wort παρουσία kann Ankunft, Kommen oder Gegenwart bezeichnen; hier geht es um die zukünftige Ankunft des Herrn Jesus.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: τίς
  choice: wer
  rationale: Das Fragepronomen kann »wer« oder »was« bedeuten. Da die rhetorische Frage anschließend Personen (»ihr«) als Antwort nennt, ist »wer« im Deutschen natürlich und bewahrt die personale Zuspitzung.
- source_word: γὰρ
  choice: denn
  rationale: »Denn« erhält den begründenden Anschluss an den vorhergehenden Zusammenhang.
- source_word: ἐλπὶς ἢ χαρὰ
  choice: Hoffnung oder Freude
  rationale: Die geläufigen deutschen Entsprechungen geben sowohl die Erwartung als auch die emotionale Aussage direkt wieder.
- source_word: στέφανος καυχήσεως
  choice: Siegeskranz, dessen wir uns rühmen
  rationale: στέφανος bezeichnet hier anschaulich einen Ehren- oder Siegeskranz; die Relativkonstruktion gibt den Genitiv καυχήσεως in natürlichem Deutsch wieder, ohne ihn zu »Freude« umzudeuten.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: Seid nicht gerade auch ihr es?
  rationale: Die Formulierung bewahrt die eine bejahende Antwort erwartende rhetorische Frage, die Betonung von οὐχί und das einschließende καί (»auch«).
- source_word: ἔμπροσθεν
  choice: vor
  rationale: »Vor« gibt knapp wieder, dass die Gemeinde in der Gegenwart beziehungsweise vor den Augen des Herrn als solcher Siegeskranz gelten wird.
- source_word: κυρίου ἡμῶν Ἰησοῦ
  choice: unserem Herrn Jesus
  rationale: Dies ist die direkte, im modernen Standarddeutsch etablierte Wiedergabe.
- source_word: παρουσίᾳ
  choice: Ankunft
  rationale: »Ankunft« erfasst in diesem endzeitlichen Zusammenhang das Kommen Jesu und bleibt zugleich näher am Übergang vom Eintreffen zur Gegenwart als eine ausschließlich statische Wiedergabe.
theological_decisions:
- issue: Bedeutung von παρουσία im endzeitlichen Zusammenhang
  choice: Ankunft
  alternative: Kommen oder Gegenwart
  rationale: Der Kontext meint die zukünftige Ankunft des Herrn Jesus. Da παρουσία zugleich das Eintreffen und die daraus entstehende Gegenwart bezeichnen kann, werden die Alternativen in einer Fußnote offengehalten.
- issue: Bezug von »vor unserem Herrn Jesus«
  choice: An die vorausgehende Identifikation der Gemeinde als Hoffnung, Freude und Siegeskranz angeschlossen
  alternative: Eng ausschließlich mit »bei seiner Ankunft« verbunden
  rationale: 'Die griechische Wortstellung lässt die Wendungen zusammenwirken: Die Thessalonicher sind bei Jesu Ankunft vor ihm der Grund des Rühmens. Die deutsche Fassung erhält diese Spannung, ohne eine zusätzliche Gerichtsszene ausdrücklich einzutragen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Siegeskranz« macht das antike Bild von στέφανος verständlich; die Relativformulierung vermeidet das im Deutschen schwerfällige »Kranz des Rühmens«. Der Gedankenstrich des Griechischen wird durch zwei aufeinander bezogene rhetorische Fragen natürlich abgebildet.
