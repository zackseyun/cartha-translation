source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: de
  text: Wir haben euch ermutigt, getröstet und eindringlich ermahnt, auf eine Weise zu leben[a], die Gottes würdig ist, der euch in sein eigenes Reich und seine Herrlichkeit beruft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu gehen“ oder „zu wandeln“; das Bild bezeichnet die gesamte Lebensführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: ermutigt
  rationale: Das Partizip bezeichnet hier fortwährendes väterlich-pastorales Zureden. „Ermutigt“ passt zum nahen Kontext und lässt gegenüber den beiden folgenden Verben eine eigene Nuance erkennen.
- source_word: παραμυθούμενοι
  choice: getröstet
  rationale: Das Verb bezeichnet tröstendes oder aufrichtendes Zusprechen. „Getröstet“ gibt die fürsorgliche Nuance knapp und verständlich wieder.
- source_word: μαρτυρόμενοι
  choice: eindringlich ermahnt
  rationale: Im Kontext bedeutet das Verb feierliches, nachdrückliches Zureden oder Beschwören. „Eindringlich ermahnt“ vermittelt diese Stärke natürlicher als das hier missverständliche „bezeugt“.
- source_word: εἰς τὸ περιπατεῖν ὑμᾶς
  choice: so zu leben
  rationale: Die Konstruktion bezeichnet Ziel oder Zweck des dreifachen Zuspruchs. Das griechische Bild vom „Gehen/Wandeln“ meint die Lebensführung; „so zu leben“ ist im modernen Deutsch klar und natürlich, während eine Fußnote das Bild offenlegt.
- source_word: ἀξίως τοῦ θεοῦ
  choice: wie es Gottes würdig ist
  rationale: Die Formulierung bewahrt den Maßstab, den der Genitiv nach ἀξίως ausdrückt, ohne zu unterstellen, Menschen könnten sich Gottes würdig machen oder seine Berufung verdienen.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: Er beruft euch
  rationale: Das präsentische Partizip wird als gegenwärtige Aussage wiedergegeben. Ein neuer Satz vermeidet einen schwerfälligen deutschen Relativsatz, ohne die zeitliche oder theologische Offenheit einzuengen.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: in sein eigenes Reich und in seine Herrlichkeit
  rationale: „Eigenes“ gibt das reflexiv betonte ἑαυτοῦ wieder. Die Wiederholung von „in“ macht im Deutschen eindeutig, dass die Berufung sowohl auf Gottes Reich als auch auf seine Herrlichkeit zielt.
theological_decisions:
- issue: Bildhafte oder sinngemäße Wiedergabe von περιπατεῖν
  choice: Im Haupttext sinngemäß „leben“, mit Hinweis auf das Bild in der Fußnote
  alternative: „wandeln“ oder „seinen Weg gehen“
  rationale: „Wandeln“ ist im heutigen Standarddeutsch in dieser Bedeutung stark bibelsprachlich und für viele Leser nicht unmittelbar klar. „Leben“ vermittelt die ethische Bedeutung, während die Fußnote die Bildlichkeit und mögliche Alternative bewahrt.
- issue: Zeitlicher Aspekt der Berufung Gottes
  choice: 'Präsens: „Er beruft euch“'
  alternative: „Er hat euch berufen“
  rationale: Das griechische Präsens wird nicht in ein punktuelles Vergangenheitstempus umgedeutet. So bleibt offen, wie die gegenwärtige Berufung zu ihrem Beginn und ihrer Vollendung steht.
- issue: Verhältnis von Reich und Herrlichkeit
  choice: Beide Begriffe gleichgeordnet als Ziel der Berufung wiedergeben
  alternative: Die Herrlichkeit als nähere Bestimmung des Reiches verstehen
  rationale: Die koordinierende Konstruktion lässt beide Substantive nebeneinander stehen. Eine erklärende Unterordnung wäre theologisch möglich, ist aber sprachlich nicht ausdrücklich markiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei Partizipien werden wegen des versübergreifenden deutschen Satzanschlusses als Perfektformen wiedergegeben. „Eindringlich ermahnt“ wahrt die feierliche Stärke des dritten Verbs; „so zu leben“ vermeidet das heute ungebräuchliche ethische „wandeln“.
