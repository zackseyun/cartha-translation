review_pass:
  verdict: revise
  source_fidelity: Die drei Partizipien und die Zweckbestimmung sind grundsätzlich zutreffend wiedergegeben. Die Abtrennung von „Er beruft euch“ als selbstständiger Satz lockert jedoch die im Griechischen ausdrückliche Beziehung zu „Gott“ (τοῦ θεοῦ τοῦ καλοῦντος). Eine Relativkonstruktion bildet diese Anbindung genauer ab. Die Wiedergabe von περιπατεῖν als „leben“ ist als idiomatische Übertragung mit Fußnote vertretbar.
  naturalness: „wie es Gottes würdig ist“ ist verständlich, aber weniger idiomatisch als „auf eine Weise zu leben, die Gottes würdig ist“. Der Relativsatz mit „der euch ... beruft“ ist im modernen Standarddeutsch flüssig und vermeidet den etwas abrupten neuen Hauptsatz.
  terminology: „ermutigt, getröstet und eindringlich ermahnt“ gibt die abgestuften Nuancen von παρακαλοῦντες, παραμυθούμενοι und μαρτυρόμενοι angemessen wieder. „Reich“, „Herrlichkeit“ und das betonte „sein eigenes“ sind beizubehalten.
  issues:
