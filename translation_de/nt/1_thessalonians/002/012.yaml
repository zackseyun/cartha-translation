    rationale: τοῦ καλοῦντος ist ein Partizip, das Gott näher bestimmt. „Gottes, der euch ... beruft“ erhält diese syntaktische und semantische Verbindung unmittelbar.
  - severity: low
    issue: „wie es Gottes würdig ist“ ist stilistisch schwerfällig.
    rationale: Die Aussage ist nicht falsch, doch eine Relativformulierung ist im heutigen Deutsch idiomatischer und bildet ἀξίως τοῦ θεοῦ klar ab.
