- from: Wir haben euch ermutigt, getröstet und eindringlich ermahnt, so zu leben[a], wie es Gottes würdig ist. Er beruft euch in sein eigenes Reich und in seine Herrlichkeit.
  to: Wir haben euch ermutigt, getröstet und eindringlich ermahnt, auf eine Weise zu leben[a], die Gottes würdig ist, der euch in sein eigenes Reich und seine Herrlichkeit beruft.
  rationale: Die Revision bindet Gottes gegenwärtige Berufung mittels eines Relativsatzes wieder unmittelbar an „Gott“ an und glättet die deutsche Wiedergabe von ἀξίως τοῦ θεοῦ. Die sinngemäße Wiedergabe von περιπατεῖν bleibt mit einer zutreffend verankerten Fußnote erhalten; Reich und Herrlichkeit bleiben als gleichgeordnete Ziele der Berufung stehen.
