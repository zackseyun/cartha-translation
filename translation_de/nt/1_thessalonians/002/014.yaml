  source_fidelity: Der Entwurf gibt die Satzglieder und den Vergleich des griechischen Textes im Wesentlichen zutreffend wieder. Die kausale ὅτι-Konstruktion sollte jedoch im Deutschen ausdrücklich mit „weil“ angebunden werden. Die Wendung ἐν Χριστῷ Ἰησοῦ bezeichnet die Zugehörigkeit der Gemeinden zu Christus; „in Jesus, dem Messias, sind“ ist zwar eng am Wortlaut, im Deutschen aber missverständlich und stilistisch schwerfällig.
  naturalness: „Die in Judäa in Jesus, dem Messias, sind“ ist kein natürlicher deutscher Relativsatz. „Die in Judäa zu Jesus, dem Messias, gehören“ vermittelt die hier gemeinte Zugehörigkeit idiomatisch. Eine vollständige Wiederaufnahme von „erlitten“ nach „wie sie“ vermeidet die etwas abrupte Ellipse im Entwurf.
  terminology: „Gemeinden Gottes“, „Brüder und Schwestern“, „Messias“ und „Landsleute“ sind angemessen. „Messias“ erhält den Titelgehalt von Χριστός. Die Fußnote zu „Juden“ bewahrt die mögliche Lesart „Judäer“ und begrenzt den Bezug sachlich auf die im Kontext genannten Handelnden.
