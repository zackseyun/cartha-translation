revisions:
- from: 'Denn ihr, Brüder und Schwestern,[a] seid zu Nachahmern der Gemeinden Gottes geworden, die in Judäa in Jesus, dem Messias,[b] sind: Auch ihr habt von euren eigenen Landsleuten dasselbe erlitten wie jene von den Juden.[c]'
  to: Denn ihr, Brüder und Schwestern,[a] seid zu Nachahmern der Gemeinden Gottes geworden, die in Judäa zu Jesus, dem Messias,[b] gehören, weil auch ihr von euren eigenen Landsleuten dasselbe erlitten habt, wie sie von den Juden[c] erlitten haben.
  rationale: Die Revision ersetzt eine im Deutschen unidiomatische wörtliche Konstruktion durch eine verständliche Wiedergabe der Zugehörigkeitsformel ἐν Χριστῷ Ἰησοῦ. Sie macht außerdem die im Griechischen durch ὅτι ausgedrückte Begründung und den parallelen Vergleich explizit. Aussageumfang, historische Bezugnahme und die lexikalische Ambiguität von Ἰουδαῖοι bleiben erhalten.
