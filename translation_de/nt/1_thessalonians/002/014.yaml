source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: de
  text: Denn ihr, Brüder und Schwestern,[a] seid zu Nachahmern der Gemeinden Gottes geworden, die in Judäa zu Jesus, dem Messias,[b] gehören, weil auch ihr von euren eigenen Landsleuten dasselbe erlitten habt, wie sie von den Juden[c] erlitten haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; die Anrede bezieht die ganze Gemeinde ein.
    reason: gender_inclusive_scope
  - marker: b
    text: 'Oder: „in Christus Jesus“. Das griechische Χριστός bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von den Judäern“. Gemeint sind im Zusammenhang diejenigen, von denen die Gemeinden in Judäa erlitten haben, nicht unterschiedslos alle Juden.'
    reason: lexical_and_scope_clarification
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: seid zu Nachahmern … geworden
  rationale: Bewahrt sowohl die ausdrückliche Vergleichssprache von μιμηταί als auch den durch ἐγενήθητε bezeichneten Übergang.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der grammatisch maskuline Plural spricht hier die gesamte Gemeinde an; die inklusive deutsche Wiedergabe macht diesen kommunikativen Umfang natürlich und eindeutig.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: Gemeinden Gottes
  rationale: „Gemeinden“ ist im heutigen Deutschen für örtliche christliche Gemeinschaften natürlich und gibt den Plural von ἐκκλησίαι klar wieder.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: die in Judäa … sind
  rationale: Gibt die geografisch bestimmende Partizipialkonstruktion direkt wieder.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Jesus, dem Messias
  rationale: Bewahrt den Titelgehalt von Χριστός und klingt im Deutschen natürlicher als „im Messias Jesus“.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: habt … dasselbe erlitten
  rationale: Gibt πάσχω als tatsächliches Erleiden von Bedrängnis wieder und erhält den direkten Vergleich.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: von euren eigenen Landsleuten
  rationale: Erfasst die Zugehörigkeit zur selben ethnischen oder gesellschaftlichen Gruppe, ohne Verwandtschaft zu unterstellen.
- source_word: τῶν Ἰουδαίων
  choice: von den Juden
  rationale: Gibt die naheliegende ethnoreligiöse Bedeutung wieder; der Kontext beschränkt den Bezug auf die hier handelnden Verfolger und meint nicht unterschiedslos alle Juden.
theological_decisions:
- issue: Titel- oder namensartige Wiedergabe von Χριστῷ
  choice: Jesus, dem Messias
  alternative: Christus Jesus
  rationale: Die Formulierung erhält den semantischen Titelgehalt von Χριστός, ohne eine christologische Spannung aufzulösen.
- issue: Bezugsumfang von οἱ Ἰουδαῖοι
  choice: die Juden
  alternative: die Judäer
  rationale: Die traditionelle ethnoreligiöse Wiedergabe passt hier besser als die rein geografische; eine Fußnote bewahrt die lexikalische Alternative und weist darauf hin, dass keine pauschale Aussage über alle Juden gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt verdeutlicht, dass das vergleichbare Leiden den Grund für die zuvor genannte Nachahmung bildet. „Brüder und Schwestern“ ist gemeindesprachlich geläufig; „Jesus, dem Messias“ wahrt den Titelgehalt bei natürlicher deutscher Wortstellung.
