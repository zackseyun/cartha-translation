  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: de
  text: Auch suchten wir keine Anerkennung von Menschen[a] – weder von euch noch von anderen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ehre« oder »Lob« statt »Anerkennung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: suchten wir
  rationale: Das Partizip gehört zum fortlaufenden Satz und bezeichnet hier das Verhalten der Sprecher. Die finite Wiedergabe ist im Deutschen natürlich und bewahrt den durativen Sinn im Zusammenhang.
- source_word: ἐξ ἀνθρώπων
  choice: bei Menschen
  rationale: ἄνθρωποι ist allgemein auf Menschen bezogen, nicht ausschließlich auf Männer. Bei Menschen Anerkennung suchen ist eine natürliche deutsche Entsprechung.
- source_word: δόξαν
  choice: Anerkennung
  rationale: Im Zusammenhang bezeichnet δόξα das Ansehen oder den Beifall, den Menschen gewähren. Anerkennung gibt diesen Sinn im modernen Deutsch klar wieder; die Fußnote bewahrt die möglichen Alternativen.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: auch ... keine ... – weder ... noch
  rationale: Das erste οὔτε knüpft negativ an den vorhergehenden Satzteil an; weder ... noch bildet die beiden danach genannten Menschengruppen präzise ab.
- source_word: ἀφ’ ὑμῶν
  choice: bei euch
  rationale: Die zweite Person Plural bezeichnet unmittelbar die Gemeinde in Thessalonich.
- source_word: ἀπ’ ἄλλων
  choice: bei anderen
  rationale: ἄλλων meint andere Menschen außer den Adressaten; die knappe Formulierung entspricht dem Griechischen.
theological_decisions:
- issue: Bedeutung der gesuchten δόξα
  choice: menschliche Anerkennung
  alternative: menschliche Ehre oder menschliches Lob
  rationale: ἐξ ἀνθρώπων zeigt ausdrücklich, dass von Ansehen oder Beifall seitens der Menschen die Rede ist, nicht von Gottes Herrlichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht die nähere Aufgliederung durch »weder ... noch« sichtbar; der Satzanfang bleibt bewusst an den vorausgehenden Kontext angeschlossen.
