  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: de
  text: die auch den Herrn Jesus und die Propheten getötet[a] und uns vertrieben haben[b], Gott nicht gefallen und allen Menschen feindlich gegenüberstehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu Tode gebracht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: hinausgetrieben oder ausgewiesen; das Verb ist konkreter als das allgemeinere »verfolgt«.'
    reason: lexical_alternative
  - marker: c
    text: Diese Beschreibung setzt grammatisch die im vorherigen Vers genannte Gruppe fort; sie ist nicht als pauschale Aussage über alle jüdischen Menschen zu jeder Zeit und an jedem Ort zu verstehen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: getötet
  rationale: Das Aoristpartizip bedeutet »töten« bzw. »zu Tode bringen«. »Getötet« ist im modernen Deutschen natürlich und fügt keine im Verb selbst nicht ausdrücklich enthaltene Aussage über das Motiv hinzu.
- source_word: κύριον Ἰησοῦν
  choice: den Herrn Jesus
  rationale: κύριος wird als christologischer Titel mit »Herr« wiedergegeben; der Personenname folgt der üblichen deutschen Form.
- source_word: τοὺς προφήτας
  choice: die Propheten
  rationale: Der bestimmte Artikel und der Plural bezeichnen die bekannte Reihe der Propheten.
- source_word: ἐκδιωξάντων
  choice: vertrieben haben
  rationale: Das Verb bezeichnet konkret das Hinaus- oder Forttreiben. »Vertrieben« bewahrt diese spezifische Bedeutung besser als das allgemeinere »verfolgt«.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: Gott nicht gefallen
  rationale: Das Präsenspartizip mit dem Dativ θεῷ bezeichnet, dass sie Gott nicht gefallen. Die finite deutsche Form setzt die griechische Partizipienkette natürlich fort.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: allen Menschen feindlich gegenüberstehen
  rationale: ἐναντίος bezeichnet Gegnerschaft oder Feindseligkeit. Die gewählte Formulierung ist idiomatisch, bewahrt aber die starke wertende Aussage.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: die auch ... getötet und ... vertrieben haben, ... nicht gefallen und ... gegenüberstehen
  rationale: Der Genitivartikel mit der Partizipienkette führt die Beschreibung der in Vers 14 genannten Gruppe als Relativsatz weiter.
- source_word: καί
  choice: auch / und
  rationale: Das erste καί kennzeichnet eine zusätzliche Anschuldigung und wird mit »auch« übersetzt; die weiteren Vorkommen verbinden die Glieder der rhetorischen Aufzählung.
theological_decisions:
- issue: Bezug der partizipialen Beschreibung
  choice: Der Relativsatz setzt die Beschreibung der im vorherigen Vers genannten Gruppe fort, ohne daraus ausdrücklich eine zeitlose Aussage über alle jüdischen Menschen zu machen.
  alternative: Eine pauschale Verurteilung aller jüdischen Menschen zu allen Zeiten.
  rationale: Syntax und Genus des griechischen Artikels verbinden Vers 15 unmittelbar mit dem Bezugswort in 2,14. Die Übersetzung wahrt diese Verbindung und erweitert den Bezug nicht über den literarischen Zusammenhang hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Relativsatzfragment erhalten, weil er syntaktisch an Vers 14 anschließt. Die kumulative Schärfe der griechischen Partizipienfolge wird bewahrt, ohne zusätzliche Motive oder eine über den Kontext hinausgehende Verallgemeinerung einzutragen.
