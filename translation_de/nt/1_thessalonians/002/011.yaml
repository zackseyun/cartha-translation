translation:
  language: de
  text: Ihr wisst ja, dass wir mit jedem Einzelnen von euch umgegangen sind wie ein Vater mit seinen eigenen Kindern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher in der Satzfolge: „wie ihr wisst, wie [wir] mit jedem Einzelnen von euch, wie ein Vater mit seinen eigenen Kindern [umgegangen sind]“. Der griechische Satzteil ist elliptisch; die Verbalaussage wird aus dem Zusammenhang ergänzt.'
    reason: Die Fußnote kennzeichnet die im Deutschen notwendige Ergänzung und bewahrt die syntaktische Offenheit des griechischen Satzfragments.
lexical_decisions:
- source_word: καθάπερ
  choice: ja
  rationale: Im Deutschen gibt „ja“ in Verbindung mit „ihr wisst“ den bestätigenden Rückverweis auf das den Thessalonichern bekannte Verhalten natürlich wieder; die Vergleichsfunktion wird zugleich durch „wie“ im Folgesatz ausgedrückt.
- source_word: οἴδατε
  choice: ihr wisst
  rationale: Das formal perfektische οἶδα hat hier präsentische Bedeutung und bezeichnet gegenwärtiges Wissen.
- source_word: ὡς (erstes Vorkommen)
  choice: dass
  rationale: Das erste ὡς leitet den Inhalt dessen ein, was die Adressaten wissen. „Dass“ ergibt im Deutschen eine klare, idiomatische Konstruktion.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: jeden Einzelnen von euch
  rationale: Die Formulierung bewahrt die verstärkte distributive Aussage und betont die persönliche Zuwendung zu jedem Mitglied der Gemeinde.
- source_word: ὡς (zweites Vorkommen)
  choice: wie
  rationale: Das zweite ὡς führt den Vergleich mit dem Verhalten eines Vaters ein.
- source_word: πατὴρ
  choice: ein Vater
  rationale: Das artikellose Substantiv ist im Vergleich qualitativ gebraucht; „ein Vater“ ist die natürliche deutsche Wiedergabe.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα ist ein umfassender Verwandtschaftsbegriff und legt kein bestimmtes Geschlecht fest.
- source_word: ἑαυτοῦ
  choice: seine eigenen
  rationale: Das Reflexivpronomen hebt hervor, dass es um die eigenen Kinder des Vaters geht.
- source_word: '[elliptische, aus dem Kontext zu ergänzende Verbalaussage]'
  choice: wir uns … gekümmert haben
  rationale: Der griechische Wortlaut ist elliptisch und erhält seine Verbalaussage aus dem umgebenden Satz. Die breite Formulierung beschreibt die väterliche persönliche Zuwendung, ohne die einzelnen Handlungen des folgenden Verses auf nur eine zu verengen.
theological_decisions:
- issue: Ergänzung der impliziten Verbalaussage in einem elliptischen Satzteil
  choice: Die breite Aussage „wir uns um jeden Einzelnen von euch gekümmert haben“ wird ergänzt.
  alternative: Den Satz fragmentarischer wiedergeben oder ein engeres Verb wie „ermahnten“ einsetzen.
  rationale: Für einen selbstständigen, verständlichen deutschen Vers muss die aus dem Kontext erschließbare Handlung ergänzt werden. Die breite Formulierung wahrt die väterliche Metapher und nimmt die mehreren in Vers 12 genannten Handlungen nicht einseitig vorweg.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Sich um jemanden kümmern“ ist bewusst breit gewählt und passt zur väterlichen Fürsorge; die Fußnote bewahrt die syntaktische Offenheit des griechischen Textes.
