id: 1TH.2.16
reference: 1 Thessalonians 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: de
  text: indem sie uns daran hindern, zu den Nichtjuden zu reden, damit diese gerettet werden, und so das Maß ihrer Sünden stets vollmachen. Doch der Zorn[b] ist schließlich[a] über sie gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollständig“, „ganz“ oder „bis zum Ende“ (griechisch: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: Mit „Zorn“ ist wahrscheinlich Gottes Gericht gemeint. Paulus legt hier jedoch nicht fest, ob er von einem gegenwärtigen geschichtlichen Gericht, vom Endgericht oder von beidem spricht.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: indem sie uns daran hindern
  rationale: Das Partizip setzt die Beschreibung aus dem vorherigen Zusammenhang fort und bezeichnet ein andauerndes Hindern. Die Formulierung bleibt natürlich, ohne ein förmliches Verbot vorauszusetzen.
- source_word: τοῖς ἔθνεσιν
  choice: zu den Nichtjuden
  rationale: Gemeint sind hier im paulinischen Zusammenhang Menschen außerhalb des jüdischen Volkes, nicht politische Nationen. „Nichtjuden“ gibt diesen Sinn in modernem Deutsch klar wieder.
- source_word: λαλῆσαι
  choice: zu reden
  rationale: Die direkte Wiedergabe des Infinitivs bewahrt die schlichte Ausdrucksweise; dass es um die Verkündigung der rettenden Botschaft geht, ergibt sich aus dem Kontext.
- source_word: ἵνα σωθῶσιν
  choice: damit diese gerettet werden
  rationale: Die Zweckangabe und die Passivform von σῴζω bleiben erhalten. Das Demonstrativpronomen macht den Bezug auf die Nichtjuden im Deutschen eindeutig.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: und so ... voll machen
  rationale: „Und so“ lässt die Konstruktion als Folge beziehungsweise Konsequenz verstehen, ohne zu behaupten, das Vollmachen der Sünden sei die bewusste Absicht der Handelnden.
- source_word: ἀναπληρῶσαι
  choice: das Maß ... voll machen
  rationale: Das Verb bezeichnet ein Auffüllen bis zur Fülle. „Das Maß ihrer Sünden voll machen“ gibt das zugrunde liegende biblische Bild idiomatisch wieder, auch wenn „Maß“ im Griechischen nur sinngemäß enthalten ist.
- source_word: πάντοτε
  choice: stets
  rationale: „Stets“ bewahrt die Aussage eines fortdauernden, wiederkehrenden Musters und passt zum würdigen modernen Register.
- source_word: ἔφθασεν
  choice: ist ... gekommen
  rationale: Das Perfekt im Deutschen vermittelt ein eingetretenes Geschehen mit gegenwärtiger Tragweite. Zusammen mit „über sie“ entspricht es der griechischen Verbindung mit ἐπί, ohne zwischen Ankunft und Einholen übermäßig festzulegen.
- source_word: ὀργή
  choice: Zorn
  rationale: „Zorn“ bewahrt die Schwere und den wahrscheinlich göttlichen Bezug des Ausdrucks; „Gericht“ wäre bereits eine Deutung statt einer unmittelbaren Übersetzung.
- source_word: εἰς τέλος
  choice: schließlich
  rationale: „Schließlich“ gibt die mögliche Bedeutung einer abschließenden Zuspitzung natürlich wieder. Da die Wendung auch „vollständig“ oder „bis zum Ende“ bedeuten kann, wird diese Mehrdeutigkeit in einer Fußnote offengelegt.
theological_decisions:
- issue: Bezug und zeitliche Tragweite des „Zorns“
  choice: Der Text spricht vom „Zorn“, ohne näher festzulegen, ob ein gegenwärtiges geschichtliches Gericht, das Endgericht oder beides gemeint ist.
  alternative: Ausdrückliche Festlegung auf ein bereits geschehenes historisches Gericht oder ausschließlich auf das künftige Endgericht.
  rationale: Paulus benennt hier kein konkretes Ereignis. Die Übersetzung bewahrt daher die theologische Spannung und erläutert die offenen Möglichkeiten in einer Fußnote.
- issue: Sinn von εἰς τὸ ἀναπληρῶσαι
  choice: 'Konsekutive Färbung: „und so ... voll machen“'
  alternative: 'Finale Färbung: „um ... voll zu machen“'
  rationale: Die konsekutive Wiedergabe vermeidet die zusätzliche Behauptung, die Gegner hätten bewusst beabsichtigt, ihre Sünden zur Fülle zu bringen, lässt aber die griechische Ziel- beziehungsweise Folgebeziehung erkennen.
translation_notes:
  register: Natürliches, heutiges Standarddeutsch mit würdigem biblischem Ton. Der kleingeschriebene Beginn mit „indem“ macht sichtbar, dass der Vers syntaktisch die Aussage des vorherigen Verses fortsetzt. „Nichtjuden“ ist für heutige Leser verständlicher als das missverständliche „Heiden“, und die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
