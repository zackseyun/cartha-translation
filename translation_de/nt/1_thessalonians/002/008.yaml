  naturalness: Die Revision ist modernes, würdiges Standarddeutsch. Sie vermeidet zudem die bei „unser Leben mit euch teilen“ mögliche Assoziation eines bloßen gemeinsamen Lebensvollzugs und macht die beabsichtigte selbsthingebende Zuwendung klarer.
