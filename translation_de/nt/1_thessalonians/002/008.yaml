source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: de
  text: In solcher Sehnsucht nach euch[a] waren wir gern bereit, euch nicht nur am Evangelium Gottes, sondern auch an unserem eigenen Leben[b] Anteil zu geben; denn ihr wart uns lieb geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann auch mit „innig nach euch verlangend“, „euch innig zugetan“ oder „voller Sehnsucht nach euch“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „unsere eigenen Seelen“; gemeint sein kann auch „uns selbst“. Hier bezeichnet das Wort die persönliche und umfassende Hingabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ὁμειρόμενοι ὑμῶν
  choice: Weil wir uns so innig nach euch sehnten
  rationale: Das seltene Partizip bezeichnet starke, liebevolle Sehnsucht. Die kausale Wiedergabe ergibt im Deutschen einen natürlichen Satzanschluss; „so innig“ bewahrt die Intensität und nimmt zugleich οὕτως auf.
- source_word: εὐδοκοῦμεν
  choice: waren wir gern bereit
  rationale: Die Form drückt bereitwilliges, von Freude getragenes Wollen aus, nicht bloße Zustimmung. Die Vergangenheitsform entspricht dem erzählenden Rückblick des Zusammenhangs.
- source_word: μεταδοῦναι
  choice: mit euch … zu teilen
  rationale: Das Verb meint, anderen Anteil an etwas Eigenem zu geben. „Teilen“ lässt sich im Deutschen sowohl auf das Evangelium als auch auf das eigene Leben beziehen.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: das Evangelium Gottes
  rationale: Die etablierte, verständliche Wendung bewahrt den Genitiv, ohne festzulegen, ob vor allem Ursprung, Inhalt oder Zugehörigkeit gemeint ist.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: unser eigenes Leben
  rationale: ψυχή bezeichnet hier im Zusammenhang persönlicher Hingabe das Leben beziehungsweise die eigene Person, nicht eigens eine vom Körper getrennte Seele. „eigenes“ erhält die Betonung von ἑαυτῶν.
- source_word: διότι ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: denn ihr wart uns lieb geworden
  rationale: Die Formulierung gibt den eingetretenen Zustand persönlicher Verbundenheit natürlich wieder; „denn“ markiert den begründenden Anschluss.
theological_decisions:
- issue: Bedeutung von ψυχάς in der Aussage über die Hingabe der Apostel
  choice: „Leben“
  alternative: „Seelen“ oder „uns selbst“
  rationale: Der Kontext handelt von persönlicher, umfassender Hingabe und trifft keine anthropologische Unterscheidung zwischen Leib und Seele. „Leben“ wahrt diesen konkreten Sinn.
- issue: Beziehungsrichtung von ἀγαπητοὶ ἡμῖν
  choice: „uns lieb“
  alternative: „von uns geliebt“ oder „uns geliebte Menschen“
  rationale: Die relationale Wiedergabe bewahrt die Wärme der Aussage, ohne dem Adjektiv eine hier nicht ausdrücklich markierte heilsgeschichtliche oder technische Bedeutung zu geben.
- issue: Verhältnis des Partizips ὁμειρόμενοι zum Hauptverb
  choice: 'kausal: „Weil wir …“'
  alternative: 'modal: „So, voller Sehnsucht nach euch, …“'
  rationale: Das Partizip kann die innige Zuneigung als Beweggrund des bereitwilligen Teilens bezeichnen. Die kausale Fassung ist im Deutschen klar, während die Fußnote auf die lexikalische Spannweite aufmerksam macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „gern bereit“ verbindet Willigkeit und Freude, ohne altertümlich zu klingen. Der Satz wahrt die emotionale Wärme des griechischen Textes und vermeidet eine unnötig dualistische Deutung von ψυχή.
