  source_fidelity: Die Übersetzung gibt den Zeugenaufruf, den modalen Sinn von ὡς, die dreifache Charakterisierung sowie den verhaltensbezogenen Sinn von ἐγενήθημεν zutreffend wieder. Das substantivierte Partizip τοῖς πιστεύουσιν wird mit „Glaubenden“ idiomatisch und ohne Bedeutungsverlust wiedergegeben. Die alternative räumlich-soziale Deutung von ὑμῖν bleibt in der Fußnote erhalten.
  naturalness: Die Nachstellung „euch gegenüber verhalten haben, die ihr glaubt“ ist zwar verständlich, wirkt im modernen Standarddeutsch jedoch schwerfällig, weil der Relativsatz vom Bezugswort getrennt wird. „euch Glaubenden gegenüber“ ist flüssiger und wahrt die Anrede sowie den Bezug auf die gläubigen Adressaten.
  terminology: „fromm“, „gerecht“ und „untadelig“ geben ὁσίως, δικαίως und ἀμέμπτως angemessen wieder. „Untadelig“ bezeichnet hier zurecht ein Verhalten ohne berechtigten Vorwurf und behauptet keine absolute Sündlosigkeit. Die Fußnote zu „heilig“ ist als lexikalische Alternative vertretbar.
