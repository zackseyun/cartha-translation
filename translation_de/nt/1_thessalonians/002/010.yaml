source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: de
  text: Ihr seid Zeugen, und Gott ist es auch, wie fromm[a], gerecht und untadelig wir uns euch Glaubenden[b] gegenüber verhalten haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heilig“. Das griechische Wort hebt ein ehrfürchtiges, Gott gemäßes Verhalten hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unter euch Glaubenden“ statt „euch Glaubenden gegenüber“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Ihr seid Zeugen, und Gott ist es auch
  rationale: 'Die ergänzte Kopula gibt den idiomatischen Zeugenaufruf natürlich wieder und bewahrt die betonte Reihenfolge: zuerst die Thessalonicher, dann Gott.'
- source_word: ὡς
  choice: wie
  rationale: ὡς leitet hier die Art und Weise des Verhaltens ein; „wie“ ist im Deutschen die direkte und natürliche Entsprechung.
- source_word: ὁσίως
  choice: fromm
  rationale: Das Adverb bezeichnet ein von Ehrfurcht und Hingabe gegenüber Gott geprägtes Verhalten. „Fromm“ ist verständlich und bewahrt diese Gottesbeziehung.
- source_word: δικαίως
  choice: gerecht
  rationale: Das Adverb beschreibt ein moralisch richtiges und rechtschaffenes Verhalten; die adverbial gebrauchte Form „gerecht“ ist im Deutschen natürlich.
- source_word: ἀμέμπτως
  choice: untadelig
  rationale: Das Wort bezeichnet ein Verhalten, gegen das kein berechtigter Vorwurf erhoben werden kann, ohne damit Sündlosigkeit zu behaupten.
- source_word: ὑμῖν
  choice: euch gegenüber
  rationale: Der Dativ bezeichnet hier die Personen, in deren Beziehung zu den Missionaren sich dieses Verhalten zeigte. „Euch gegenüber“ bewahrt diese relationale Ausrichtung.
- source_word: τοῖς πιστεύουσιν
  choice: die ihr glaubt
  rationale: Das substantivierte Präsenspartizip kennzeichnet die angesprochenen Thessalonicher als Glaubende und bewahrt mit „glaubt“ den verbalen Charakter.
- source_word: ἐγενήθημεν
  choice: wir uns … verhalten haben
  rationale: γίνομαι bezeichnet mit den drei Adverbien idiomatisch die tatsächliche Lebens- und Verhaltensweise der Missionare; „uns verhalten haben“ gibt dies klar und natürlich wieder.
theological_decisions:
- issue: Ethische Beschreibung des apostolischen Verhaltens
  choice: Die drei Ausdrücke beschreiben das tatsächliche Verhalten der Missionare vor Gott und gegenüber den Glaubenden.
  alternative: Die Aussage ist entweder nur rhetorische Selbstverteidigung oder eine Behauptung absoluter Sündlosigkeit.
  rationale: Der Vers beruft sich feierlich auf menschliche und göttliche Zeugen. „Untadelig“ bezeichnet hier ein Verhalten ohne berechtigten Vorwurf, ohne die Spannung durch eine Aussage über absolute moralische Vollkommenheit aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige adverbiale Beschreibung bleibt erhalten; die Konstruktion mit „euch gegenüber“ wahrt die mögliche relationale Deutung des Dativs, während die Fußnote die örtlich-soziale Alternative nennt.
