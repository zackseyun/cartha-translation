  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: de
  text: Denn nie sind wir mit schmeichelnden Worten aufgetreten, wie ihr wisst, auch nicht unter dem Deckmantel der Habgier[a] – Gott ist Zeuge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem habgierigen Vorwand“; wörtlich etwa: „unter einem Vorwand der Habgier“. Die knappe Genitivverbindung kann einen von Habgier bestimmten Vorwand oder einen Vorwand bezeichnen, hinter dem Habgier verborgen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Denn wir sind niemals … und auch nicht
  rationale: γάρ verbindet die Aussage begründend mit dem vorherigen Zusammenhang. οὔτε … οὔτε wird im Deutschen idiomatisch durch „niemals … und auch nicht“ wiedergegeben; ποτέ verstärkt die zeitliche Verneinung.
- source_word: ἐν λόγῳ κολακείας
  choice: mit schmeichelnden Worten
  rationale: λόγος bezeichnet hier die Redeweise, nicht nur ein einzelnes Wort; κολακεία meint Schmeichelei. Die Formulierung gibt den instrumentalen Sinn von ἐν natürlich wieder.
- source_word: ἐγενήθημεν
  choice: sind … aufgetreten
  rationale: γίνομαι beschreibt hier, wie Paulus und seine Mitarbeiter sich bei den Thessalonichern zeigten beziehungsweise verhielten. „Aufgetreten“ passt zum Besuchskontext, ohne lediglich eine Ankunft zu behaupten.
- source_word: καθὼς οἴδατε
  choice: wie ihr wisst
  rationale: Die knappe Formulierung bewahrt den Appell an das eigene Wissen der Adressaten.
- source_word: ἐν προφάσει πλεονεξίας
  choice: unter einem Vorwand für Habgier
  rationale: πρόφασις bezeichnet einen Vorwand oder eine vorgeschobene Fassade; πλεονεξία meint das eigennützige Verlangen nach mehr, hier natürlich als „Habgier“ wiedergegeben. Die Beziehung zwischen Vorwand und Habgier bleibt im Griechischen etwas offen und wird in der Fußnote erläutert.
- source_word: θεὸς μάρτυς
  choice: Gott ist Zeuge
  rationale: Die prägnante, feierliche Wendung folgt dem Griechischen ohne ein dort nicht ausdrücklich vorhandenes Possessivpronomen.
theological_decisions:
- issue: Gegenstand der Zurückweisung hinsichtlich Vorgehen und Beweggrund
  choice: Der Vers weist sowohl schmeichelnde Rede als auch Habgier zurück, die sich hinter einem Vorwand verbergen könnte.
  alternative: Eine pauschale Ablehnung jeder rhetorisch gestalteten Rede oder eine ausschließlich auf finanzielle Ausbeutung begrenzte Aussage.
  rationale: Der griechische Text nennt konkret κολακεία und πλεονεξία. Die Übersetzung erweitert dies weder zu einer allgemeinen Rhetorikkritik noch verengt sie Habgier ausdrücklich auf Geld.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufgetreten“ ist im Kontext natürlicher als das wörtliche „geworden“. Der Gedankenstrich hebt den feierlichen Zeugenruf am Satzende hervor.
