source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: de
  text: 'Denn ihr erinnert euch, Brüder[a], an unsere Mühe und Plage: Wir arbeiteten Nacht und Tag, um keinem von euch zur Last zu fallen, und verkündeten euch das Evangelium Gottes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann hier die ganze Gemeinde einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: ihr erinnert euch
  rationale: Das Präsens Indikativ der zweiten Person Plural wird als gegenwärtige Feststellung wiedergegeben, nicht als Aufforderung.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die maskuline Pluralform der griechischen Anrede; im Zusammenhang kann die ganze Gemeinde einschließlich der Frauen gemeint sein.
- source_word: κόπον ... μόχθον
  choice: Mühe und Beschwerde
  rationale: Die Wortpaarung bezeichnet sowohl anstrengende Arbeit als auch die damit verbundene Belastung; zwei verschiedene deutsche Wörter erhalten die Nuance.
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: Nacht und Tag arbeiteten wir
  rationale: Gibt die idiomatische Zeitangabe natürlich wieder und ordnet das Partizip als begleitenden Umstand dem Hauptsatz zu.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: um keinem von euch zur Last zu fallen
  rationale: Die Konstruktion drückt einen Zweck aus; die deutsche Wendung bezeichnet natürlich eine finanzielle oder praktische Belastung.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: verkündeten euch
  rationale: „Verkündigen“ bewahrt den öffentlichen Bekanntmachungscharakter von κηρύσσω; der Dativ gibt die Richtung auf die Empfänger idiomatisch wieder.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: das Evangelium Gottes
  rationale: Bewahrt die geläufige paulinische Formulierung und lässt offen, ob der Genitiv vor allem Ursprung, Zugehörigkeit oder Inhalt bezeichnet.
theological_decisions:
- issue: Inklusive Reichweite von ἀδελφοί
  choice: „Brüder“ im Haupttext mit Fußnote
  alternative: „Brüder und Schwestern“
  rationale: Der Haupttext bewahrt die grammatisch maskuline Form; die Fußnote weist darauf hin, dass die Anrede im Kontext wahrscheinlich die gesamte Gemeinde einschließt.
- issue: Bezug des Genitivs in τοῦ θεοῦ
  choice: „Evangelium Gottes“
  alternative: „die von Gott kommende gute Nachricht“
  rationale: Die knappe Genitivkonstruktion vermeidet eine Festlegung darauf, ob Gott als Ursprung, Eigentümer oder Inhalt des Evangeliums bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder wurden für einen natürlichen deutschen Lesefluss leicht geordnet; „so“ verdeutlicht, dass die Arbeit Nacht und Tag die Umstände der Verkündigung beschreibt, ohne einen zusätzlichen Gedanken einzuführen.
