  source_fidelity: Der Entwurf gibt Präsensindikativ, Anrede, die Doppelung κόπος/μόχθος, die fortdauernde Arbeit, den Zweck des Nicht-zur-Last-Fallens sowie die Verkündigung des Evangeliums Gottes insgesamt zutreffend wieder. Das ergänzte „so“ hat jedoch keine ausdrückliche griechische Entsprechung und kann die Arbeit unnötig als Mittel oder Folge der Verkündigung profilieren.
  naturalness: „Mühe und Beschwerde“ ist verständlich, doch „Beschwerde“ bezeichnet im heutigen Standarddeutsch häufig eine Klage. „Mühe und Plage“ ist für die Aussage von κόπος und μόχθος idiomatischer und würdevoll. Eine leichte Umstellung bildet die partizipiale Konstruktion natürlich ab.
  terminology: „Brüder“ mit der Fußnote wahrt die Form der griechischen Anrede, ohne ihre wahrscheinlich gemeindeweite Reichweite zu verschweigen. „Evangelium Gottes“ bewahrt die offene Genitivverbindung. „Verkündeten“ ist für ἐκηρύξαμεν angemessen.
