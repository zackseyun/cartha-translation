  - severity: medium
    issue: „Beschwerde“ ist für μόχθος im modernen Deutsch weniger passend.
    rationale: Das Wort wird gewöhnlich als „Klage“ verstanden. „Plage“ bezeichnet hier natürlicher die Mühsal bzw. Belastung und erhält die Unterscheidung zu „Mühe“.
