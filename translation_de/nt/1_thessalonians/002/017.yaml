source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: de
  text: Wir aber, Brüder,[a] waren für kurze Zeit von euch losgerissen[b] – nur körperlich, nicht im Herzen – und bemühten uns umso mehr, in großer Sehnsucht euer Angesicht zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „Brüder“; die Anrede bezieht sich hier wahrscheinlich auf die ganze Gemeinde, Frauen eingeschlossen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „von euch verwaist“; das griechische Wort gebraucht ein eindringliches Bild des schmerzlichen Verlusts durch die Trennung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Wir aber
  rationale: Das betonte Pronomen und δέ markieren einen milden Gegensatz beziehungsweise Übergang; „Wir aber“ bewahrt beides knapp und natürlich.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die grammatisch maskuline Anrede bezeichnet im paulinischen Gemeindekontext sehr wahrscheinlich die gesamte Glaubensgemeinschaft. Die inklusive Wiedergabe vermittelt diesen kommunikativen Umfang im heutigen Deutsch; die griechische Form wird in der Fußnote kenntlich gemacht.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: von euch losgerissen
  rationale: Das seltene Verb vermittelt einen schmerzlichen, unfreiwilligen Verlust. „Losgerissen“ erhält die emotionale Stärke, während die wörtliche Verwaisungsmetapher in einer Fußnote dokumentiert wird.
- source_word: πρὸς καιρὸν ὥρας
  choice: für kurze Zeit
  rationale: Die Wendung bezeichnet idiomatisch eine kurze Zeitspanne, nicht zwingend eine buchstäbliche Stunde.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: nur äußerlich, nicht im Herzen
  rationale: Die knappe Gegenüberstellung unterscheidet körperliche Abwesenheit von fortbestehender innerer Verbundenheit. „Nur äußerlich“ gibt den instrumentalen beziehungsweise relationalen Sinn von προσώπῳ verständlich wieder.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: Umso eifriger bemühten wir uns
  rationale: Die Formulierung bewahrt sowohl die gesteigerte Intensität von περισσοτέρως als auch den in σπουδάζω enthaltenen Gedanken von Eifer und Bemühung.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: euch wieder von Angesicht zu Angesicht zu sehen
  rationale: Die Wiedergabe hält das Motiv des Angesichts und den Wunsch nach leibhaftiger Begegnung fest. „Wieder“ ist durch die vorausgesetzte frühere Gemeinschaft und die vorübergehende Trennung sachlich gedeckt.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: denn wir hatten große Sehnsucht nach euch
  rationale: ἐπιθυμία bezeichnet hier ein starkes, liebevolles Verlangen. Die finite deutsche Formulierung macht den emotionalen Beweggrund natürlich verständlich, ohne dem Ausdruck eine negative Bedeutung zu geben.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Obwohl die griechische Form grammatisch maskulin ist, fungiert sie hier sehr wahrscheinlich als Anrede der ganzen Gemeinde einschließlich der Frauen. Die Haupttextfassung gibt den gemeinten Adressatenkreis wieder; die formale Besonderheit bleibt durch die Fußnote transparent.
- issue: Bildsprache von ἀπορφανισθέντες
  choice: losgerissen
  alternative: von euch verwaist
  rationale: Das griechische Verb verwendet ein starkes Bild des Verwaist- beziehungsweise Beraubtseins, legt aber keine geistliche Eltern-Kind-Lehre fest. Die idiomatische Haupttextfassung wahrt Schmerz und Unfreiwilligkeit, ohne die Beziehung unnötig zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Gedankenstriche bewahren die eingeschobene Gegenüberstellung; „von Angesicht zu Angesicht“ erhält die persönliche und leibliche Dimension der ersehnten Begegnung.
