  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: de
  text: Denn wer schläft, schläft nachts, und wer sich betrinkt, betrinkt sich nachts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Ermahnung ein und bewahrt den schlichten erklärenden Zusammenhang.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: wer schläft, schläft
  rationale: Die substantivierten Partizipien werden allgemein wiedergegeben. Die Wiederholung von »schläft« erhält den Parallelismus und das wörtliche Bild.
- source_word: νυκτός
  choice: nachts
  rationale: Der adverbiale Genitiv bezeichnet die übliche Zeit des Geschehens; »nachts« ist im modernen Deutsch knapp und natürlich.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: wer sich betrinkt, betrinkt sich
  rationale: Die reflexive Formulierung gibt den Vorgang des Betrunkenwerdens idiomatisch wieder und bewahrt die Wiederholung des griechischen Verbstamms.
- source_word: καί
  choice: und
  rationale: Verbindet die beiden parallel aufgebauten Aussagen schlicht koordinierend.
theological_decisions:
- issue: Wörtliche oder metaphorische Wiedergabe von Schlaf und Trunkenheit
  choice: Die konkreten Bilder »schlafen« und »sich betrinken« bleiben im Haupttext erhalten.
  alternative: Als geistliche Unachtsamkeit und sittliche Zügellosigkeit ausdeuten.
  rationale: Paulus greift gewöhnliches Verhalten in der Nacht als Bild für seine geistliche Ermahnung auf. Eine wörtliche Wiedergabe erhält die Analogie, ohne ihre Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdigem Satzbau. Die singularische Konstruktion mit »wer« bildet beide generischen Personengruppen natürlich ab und wahrt den strengen Parallelismus.
