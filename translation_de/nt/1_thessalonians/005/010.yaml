source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: de
  text: der für uns starb, damit wir, ob wir wachen oder schlafen,[a] gemeinsam mit ihm leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ob wir wachsam sind oder schlafen“. Die Formulierung kann an die Mahnung zur Wachsamkeit im unmittelbaren Zusammenhang anknüpfen; wahrscheinlich meint sie hier jedoch, ob Glaubende noch leben oder bereits gestorben sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: der … starb
  rationale: Das Aoristpartizip bezieht sich auf den im vorherigen Vers genannten Herrn Jesus Christus. Ein deutscher Relativsatz ist natürlicher als das wörtlichere „der gestorben ist“.
- source_word: περὶ ἡμῶν
  choice: für uns
  rationale: περί mit Genitiv bedeutet in diesem soteriologischen Zusammenhang „für/zugunsten von“. „Für uns“ ist natürlich und legt die genaue Art des stellvertretenden Handelns nicht über den Wortlaut hinaus fest.
- source_word: ἵνα
  choice: damit
  rationale: Gibt den Zweck beziehungsweise das beabsichtigte Ergebnis knapp und idiomatisch wieder.
- source_word: γρηγορῶμεν
  choice: wir wachen
  rationale: Das Verb kann körperliches Wachsein oder aufmerksame Wachsamkeit bezeichnen. „Wachen“ bewahrt diese Mehrdeutigkeit und bildet den natürlichen Gegensatz zu „schlafen“.
- source_word: καθεύδωμεν
  choice: wir … schlafen
  rationale: Die Metapher bleibt erhalten. Im Zusammenhang dürfte sie vor allem auf den Tod von Glaubenden zielen, kann aber zugleich an die vorangehende Mahnung zur Wachsamkeit erinnern.
- source_word: ἅμα σὺν αὐτῷ
  choice: gemeinsam mit ihm
  rationale: ἅμα und σύν drücken hier gemeinschaftliches Leben in Verbindung mit Christus aus. „Gemeinsam mit ihm“ ist klar und vermeidet eine schwerfällige Doppelung.
- source_word: ζήσωμεν
  choice: wir … leben
  rationale: Der Aorist Konjunktiv steht unter ἵνα. Im deutschen damit-Satz gibt der Indikativ „leben“ den Zweck natürlich wieder, ohne Unsicherheit auszudrücken.
theological_decisions:
- issue: Bedeutung von „wachen oder schlafen“
  choice: Die Bildsprache bleibt im Haupttext stehen und bezeichnet wahrscheinlich in erster Linie Lebende und Verstorbene.
  alternative: Ethische Wachsamkeit im Gegensatz zu geistlicher Nachlässigkeit, in Fortführung von 5,6–7.
  rationale: Die Aussage, dass die Glaubenden unabhängig davon gemeinsam mit Christus leben, passt besonders gut zum Gegensatz zwischen Lebenden und bereits Verstorbenen aus 4,13–15. Wegen des unmittelbaren Kontexts von 5,6–7 wird die ethische Nebenbedeutung jedoch nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativsatz schließt syntaktisch an Vers 9 an. Die knappe Parallelform „ob wir wachen oder schlafen“ erhält die Bildsprache und ihre genuine kontextuelle Spannung.
