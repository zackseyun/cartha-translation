  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: de
  text: Prüft aber alles[a]; haltet an dem Guten fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Dinge“. Im Zusammenhang geht es besonders auch darum, prophetische Äußerungen zu beurteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: alles
  rationale: Das substantivisch gebrauchte Akkusativ Neutrum Plural ist umfassend und im modernen Deutsch idiomatisch mit „alles“ wiedergegeben, ohne den Bezug ausdrücklich auf prophetische Äußerungen zu verengen.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen milden Gegensatz beziehungsweise Übergang zu den vorangehenden Aufforderungen. „Aber“ bewahrt diese leicht adversative Nuance.
- source_word: δοκιμάζετε
  choice: prüft
  rationale: Der Präsensimperativ fordert zu fortlaufender, wertender Prüfung auf. „Prüft“ ist knapp, natürlich und gibt den Gedanken wieder, Echtheit oder Wert festzustellen.
- source_word: τὸ καλὸν
  choice: das Gute
  rationale: Der Artikel mit dem substantivisch gebrauchten Adjektiv bezeichnet das, was gut ist. „Das Gute“ ist im Deutschen natürlich und bildet zugleich die grammatische Form des Griechischen angemessen ab.
- source_word: κατέχετε
  choice: haltet … fest
  rationale: Der Imperativ bezeichnet entschiedenes Festhalten beziehungsweise Bewahren nach erfolgter Prüfung. „Haltet … fest“ vermittelt fortdauernde Bindung stärker als bloßes „bewahrt“.
theological_decisions:
- issue: Umfang von πάντα im Zusammenhang von Prophetie und Unterscheidung
  choice: Umfassend als „alles“ wiedergegeben; der unmittelbare Zusammenhang legt besonders die Prüfung prophetischer Äußerungen nahe.
  alternative: „alle prophetischen Äußerungen“ beziehungsweise „alles Gesagte“
  rationale: Vers 20 nennt prophetische Äußerungen, doch der griechische Text von Vers 21 verwendet das breite πάντα ohne einschränkendes Substantiv. Die Übersetzung erhält diese Weite, statt den Befehl interpretierend einzuengen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallelen Imperative bleiben knapp und einprägsam; „festhalten“ wird entsprechend der deutschen Satzstruktur getrennt.
