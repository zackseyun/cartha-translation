id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: de
  text: Wir bitten euch aber, Brüder und Schwestern,[a] diejenigen anzuerkennen,[b] die sich unter euch abmühen, euch im Herrn leiten[c] und euch ermahnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; die griechische Anrede gilt hier der Gemeinde insgesamt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu achten“ oder „zu erkennen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „euch im Herrn vorstehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: wir bitten
  rationale: Das Verb bezeichnet hier eine höfliche, nachdrückliche Bitte und keinen Befehl.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen milden Übergang; das unbetonte deutsche „aber“ bewahrt die Verknüpfung, ohne einen starken Gegensatz auszudrücken.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die maskuline griechische Anrede richtet sich in diesem Gemeindezusammenhang an die gesamte Gemeinde; die inklusive Wiedergabe macht den gemeinten Adressatenkreis im heutigen Deutsch deutlich.
- source_word: εἰδέναι
  choice: anzuerkennen
  rationale: 'Im Kontext meint εἰδέναι mehr als bloßes Kennen: Die Arbeit der betreffenden Personen soll wahrgenommen und entsprechend gewürdigt werden, ohne bereits Gehorsam oder Verehrung einzutragen.'
- source_word: κοπιῶντας
  choice: die sich abmühen
  rationale: Die Form betont anstrengende, ermüdende Arbeit; „sich abmühen“ gibt diese Intensität natürlich wieder.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung bezeichnet den Dienst innerhalb der Gemeinde.
- source_word: προϊσταμένους ὑμῶν
  choice: euch leiten
  rationale: Das Partizip kann Leitung, Aufsicht und fürsorgliche Verantwortung bezeichnen; „leiten“ bewahrt die Autoritätskomponente, ohne eine bestimmte Kirchenordnung vorauszusetzen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die traditionelle und transparente Wendung lässt offen, ob vor allem Zugehörigkeit, Beauftragung oder der Bereich der Leitung betont wird.
- source_word: νουθετοῦντας
  choice: euch zurechtweisen
  rationale: νουθετέω bezeichnet mahnende, korrigierende Unterweisung; „zurechtweisen“ bringt den korrektiven Charakter klar zum Ausdruck.
theological_decisions:
- issue: Adressatenkreis von ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Die grammatisch maskuline Anrede kann eine gemischte Gemeinde einschließen. Die Haupttextfassung gibt den kommunikativen Umfang wieder; die formnähere Alternative bleibt in der Fußnote sichtbar.
- issue: Aufforderung durch εἰδέναι gegenüber Gemeindeleitenden
  choice: anzuerkennen
  alternative: zu achten / zu kennen
  rationale: Die Formulierung fordert relationale Wahrnehmung und Wertschätzung, ohne ausdrücklich Unterordnung, Gehorsam oder eine sakrale Amtsauffassung zu verlangen.
- issue: Bedeutung von προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: euch im Herrn leiten
  alternative: euch im Herrn vorstehen
  rationale: „Leiten“ hält Autorität und Verantwortung zusammen, ohne eine konkrete konfessionelle Leitungsstruktur festzulegen. Das formalere „vorstehen“ wird als mögliche Wiedergabe dokumentiert.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die drei parallelen Partizipien werden als koordinierte Relativsatzglieder wiedergegeben. Die Stellung der Fußnoten folgt jeweils unmittelbar der betreffenden Formulierung.
