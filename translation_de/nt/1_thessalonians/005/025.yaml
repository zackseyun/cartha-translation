  text: Brüder und Schwestern, betet für uns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline Plural bezeichnet in der Anrede hier sehr wahrscheinlich die gesamte Gemeinde. „Brüder und Schwestern“ gibt den gemeinten Personenkreis im heutigen Standarddeutsch natürlich und genau wieder.
- source_word: προσεύχεσθε
  choice: betet
  rationale: Der Präsensimperativ fordert zum Gebet auf. Das schlichte „betet“ ist im Deutschen idiomatisch; ein ausdrücklich fortdauerndes „betet weiterhin“ wäre stärker als der Kontext verlangt.
- source_word: περὶ ἡμῶν
  choice: für uns
  rationale: περί mit Genitiv bezeichnet hier die Personen, denen das erbetene Gebet gilt. „Für uns“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Geschlechtsspezifische Form der Gemeindeanrede Ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Obwohl die griechische Form grammatisch maskulin ist, richtet sich die Anrede im Zusammenhang wahrscheinlich an die ganze, gemischtgeschlechtliche Gemeinde. Die inklusive Wiedergabe macht den Referenzumfang sichtbar, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Kurze, unmittelbare Bitte in modernem, würdigem Standarddeutsch. Die inklusive Gemeindeanrede ist im Deutschen geläufig und vermeidet das heute mögliche Missverständnis, nur Männer seien angesprochen.
