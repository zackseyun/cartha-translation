base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: de
  text: Haltet euch von jeder Art des Bösen fern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von jeder Form des Bösen“; traditionell: „von jedem Anschein des Bösen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Haltet euch … fern
  rationale: Das Präsensimperativ in der zweiten Person Plural fordert zu fortdauernder Distanzierung auf. Die reflexive deutsche Wendung ist natürlich und bewahrt die Aufforderungskraft.
- source_word: ἀπὸ
  choice: von
  rationale: Die Präposition bezeichnet zusammen mit ἀπέχεσθε die Trennung beziehungsweise Distanz zu etwas.
- source_word: παντὸς
  choice: jeder
  rationale: Der Genitiv Singular bestimmt εἴδους und wird im Deutschen idiomatisch mit „jeder Art“ wiedergegeben.
- source_word: εἴδους
  choice: Art
  rationale: Im Kontext bezeichnet εἶδος am ehesten eine Art oder Form, nicht lediglich den äußeren Anschein. „Art“ ist im modernen Deutsch präzise und natürlich.
- source_word: πονηροῦ
  choice: des Bösen
  rationale: Der substantivierte Genitiv gibt das moralisch Böse direkt wieder und fügt sich natürlich in die Wendung „jede Art des Bösen“ ein.
theological_decisions:
- issue: Bedeutung von εἴδους in ἀπὸ παντὸς εἴδους πονηροῦ
  choice: jede Art des Bösen
  alternative: jede Form des Bösen; jeder Anschein des Bösen
  rationale: „Art“ beziehungsweise „Form“ entspricht hier wahrscheinlich dem Sinn von εἶδος. Die traditionelle Wiedergabe mit „Anschein“ könnte dagegen den Gedanken eintragen, man solle auch alles meiden, was nur böse aussieht. Die Fußnote macht die sprachlichen Alternativen transparent.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Imperativ. Die Formulierung vermeidet den missverständlichen Eindruck, der Vers beziehe sich primär auf bloßen äußeren Anschein.
