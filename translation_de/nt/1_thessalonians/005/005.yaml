id: 1TH.5.5
reference: 1 Thessalonians 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: de
  text: Denn ihr alle seid Söhne des Lichts und Söhne des Tages.[a] Wir gehören weder der Nacht noch der Finsternis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kinder des Lichts und Kinder des Tages.« Wörtlich steht im Griechischen »Söhne«; die Wendung bezeichnet Menschen, die zum Licht und zum Tag gehören und davon geprägt sind.'
    reason: Lexikalische Alternative und Erklärung einer semitisch geprägten Zugehörigkeitswendung.
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: Denn ihr alle
  rationale: Bewahrt den begründenden Anschluss von γάρ und die betonte, umfassende Aussage von πάντες bei natürlicher deutscher Wortstellung.
- source_word: υἱοὶ
  choice: Söhne
  rationale: Gibt die ausdrücklich maskuline Form wieder und bewahrt die biblische Zugehörigkeitsmetapher; eine Fußnote erklärt ihre einschließende idiomatische Bedeutung.
- source_word: φωτός
  choice: des Lichts
  rationale: Der Genitiv bleibt erhalten und bezeichnet Zugehörigkeit beziehungsweise Prägung durch das Licht.
- source_word: ἡμέρας
  choice: des Tages
  rationale: Bewahrt die parallele Metapher und den Gegensatz zur Nacht.
- source_word: οὐκ ἐσμὲν
  choice: Wir gehören weder … noch …
  rationale: Erhält den Wechsel von der zweiten zur ersten Person Plural und macht die bei den bloßen Genitiven vorausgesetzte Zugehörigkeit in natürlichem Deutsch deutlich.
- source_word: νυκτὸς οὐδὲ σκότους
  choice: weder der Nacht noch der Finsternis
  rationale: Gibt die beiden parallelen Genitive idiomatisch wieder und bewahrt den Gegensatz zu Tag und Licht.
theological_decisions:
- issue: Geschlechtsspezifische Familienmetapher in υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: Söhne des Lichts und Söhne des Tages
  alternative: Kinder des Lichts und Kinder des Tages
  rationale: Die Hauptübersetzung wahrt die Form υἱοί und damit die konkrete Metapher. Die Fußnote stellt klar, dass die Wendung alle Angesprochenen einschließt und Zugehörigkeit beziehungsweise charakteristische Prägung ausdrückt.
- issue: Personenwechsel von der zweiten zur ersten Person Plural
  choice: ihr alle seid … Wir gehören …
  alternative: ihr alle seid … ihr gehört …
  rationale: Der griechische Text wechselt bewusst von ὑμεῖς zu ἐσμέν. Die Übersetzung glättet diesen rhetorisch und inhaltlich bedeutsamen Wechsel nicht.
- issue: Bedeutung der Genitive νυκτός und σκότους
  choice: gehören weder der Nacht noch der Finsternis
  alternative: sind nicht von der Nacht noch von der Finsternis
  rationale: Die idiomatische deutsche Formulierung bringt Zugehörigkeit zum Ausdruck, ohne die moralisch-geistliche Bildsprache weitergehend auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung »Söhne des …« erhält den Parallelismus des Ausgangstextes. »Finsternis« wurde gegenüber »Dunkelheit« gewählt, weil es den gehobenen bildhaften Gegensatz zu »Licht« natürlich wiedergibt, ohne altertümlich zu wirken.
