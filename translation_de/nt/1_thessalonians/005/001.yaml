  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: de
  text: Was aber die Zeiten und Zeitpunkte[a] betrifft, Brüder[b], habt ihr es nicht nötig, dass euch darüber geschrieben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zeiten und Zeitpunkte“ ist eine verbundene Wendung für Zeiträume und besondere oder festgesetzte Momente, hier im Zusammenhang mit den kommenden Ereignissen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Brüder und Schwestern“; im Griechischen steht „Brüder“, womit hier wahrscheinlich die ganze Glaubensgemeinschaft angesprochen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Was aber … betrifft
  rationale: Περὶ führt das Thema ein, während δέ einen Übergang markiert. Die deutsche Wendung gibt beides natürlich wieder, ohne ein im Griechischen nicht vorhandenes zeitliches „nun“ einzufügen.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: die Zeiten und Zeitpunkte
  rationale: χρόνος bezeichnet häufig Zeit in ihrer Dauer oder ihrem Verlauf, καιρός eher einen bestimmten, passenden oder festgesetzten Zeitpunkt. Die Paarung wahrt den Unterschied, ohne ihn übermäßig auszudeuten.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der griechische Vokativ ist grammatisch maskulin. In diesem gemeindlichen Zusammenhang dürfte er die gesamte Glaubensgemeinschaft ansprechen; dies wird in einer Fußnote erläutert.
- source_word: οὐ χρείαν ἔχετε
  choice: ist es nicht nötig
  rationale: Die idiomatische deutsche Formulierung gibt das Fehlen einer Notwendigkeit klar und natürlich wieder.
- source_word: ὑμῖν γράφεσθαι
  choice: euch darüber zu schreiben
  rationale: Das Griechische hat einen passiven Infinitiv und nennt den Schreibenden nicht ausdrücklich. Das unpersönliche deutsche „es ist nicht nötig, euch … zu schreiben“ bewahrt diese Offenheit, während „darüber“ den bereits genannten Gegenstand natürlich aufnimmt.
theological_decisions:
- issue: Geschlechtsspezifische Anrede der Gemeinde
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die Ausgangsform ἀδελφοί wird im Haupttext formal als „Brüder“ wiedergegeben. Dass wahrscheinlich die gesamte Gemeinde einschließlich der Frauen gemeint ist, wird transparent in der Fußnote festgehalten.
- issue: Eschatologische Bedeutung der Zeitbegriffe
  choice: Zeiten und Zeitpunkte
  alternative: Zeiten und festgesetzte Zeitpunkte
  rationale: Der Kontext legt eine eschatologische Verwendung nahe, doch „festgesetzt“ wäre bereits eine stärkere Auslegung von καιρός. Die Übersetzung lässt die mögliche Bedeutung eines bestimmten oder angesetzten Zeitpunkts offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur macht den Themenwechsel durch „Was aber … betrifft“ sichtbar. Die unpersönliche Form vermeidet es, einen im griechischen Passiv nicht ausdrücklich genannten Schreiber einzusetzen.
