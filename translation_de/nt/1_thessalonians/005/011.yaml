  text: διὸ παρακαλεῖτε ἀλλήλους καὶ οἰκοδομεῖτε εἷς τὸν ἕνα, καθὼς καὶ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: de
  text: Darum ermutigt einander[a] und baut einander auf, so wie ihr es auch tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ermahnt einander“; das griechische Wort kann hier sowohl Ermutigung als auch eindringliches Zureden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorherigen Gedankengang und stellt den logischen Zusammenhang knapp und natürlich her.
- source_word: παρακαλεῖτε
  choice: ermutigt
  rationale: Das Verb kann je nach Kontext ermutigen, ermahnen oder trösten bedeuten. Hier passt „ermutigt“ zur gegenseitigen Stärkung, ohne die mögliche mahnende Nuance auszuschließen; diese wird in der Fußnote genannt.
- source_word: ἀλλήλους
  choice: einander
  rationale: Gibt die wechselseitige Handlung im Deutschen idiomatisch und genau wieder.
- source_word: οἰκοδομεῖτε
  choice: baut ... auf
  rationale: Bewahrt das griechische Bild des Bauens und ist zugleich im modernen Deutsch als Ausdruck für geistliche und gemeinschaftliche Stärkung verständlich.
- source_word: εἷς τὸν ἕνα
  choice: einander
  rationale: Die griechische Wendung bezeichnet die wechselseitige Zuwendung von Person zu Person. Die Wiederholung von „einander“ erhält den Nachdruck auf der Gegenseitigkeit.
- source_word: καθὼς καὶ ποιεῖτε
  choice: so wie ihr es auch tut
  rationale: Gibt den Vergleich, das verstärkende καί und die gegenwärtig bereits geübte Praxis natürlich wieder.
theological_decisions:
- issue: Bedeutungsbreite von παρακαλεῖτε
  choice: ermutigt
  alternative: ermahnt; sprecht einander Mut zu
  rationale: Der Kontext verbindet gegenseitige Ermutigung mit Aufbau. „Ermutigt“ trägt diesen breiten positiven Sinn, während eine Fußnote die ebenfalls mögliche auffordernde oder mahnende Nuance offenhält.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Bau-Metapher bleibt erhalten; die zweimalige Verwendung von „einander“ spiegelt den Nachdruck des griechischen Textes auf gegenseitigem Handeln.
