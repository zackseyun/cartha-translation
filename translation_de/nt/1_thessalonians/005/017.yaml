lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: ohne Unterlass
  rationale: Das Adverb bezeichnet ein fortdauerndes oder beharrlich wiederkehrendes Handeln. »Ohne Unterlass« bewahrt die starke Ausdrucksweise des Griechischen, ohne zwingend ein in jeder Sekunde ununterbrochenes Sprechen zu behaupten.
- source_word: προσεύχεσθε
  choice: Betet
  rationale: Der Imperativ Präsens in der zweiten Person Plural fordert die ganze Gemeinde zu anhaltendem, gewohnheitsmäßigem Beten auf. Die Fortdauer wird bereits durch »ohne Unterlass« ausgedrückt.
theological_decisions:
- issue: Praktische Tragweite des Gebots
  choice: Die Formulierung bleibt als uneingeschränkte Aufforderung zu beharrlichem Gebet stehen.
  alternative: Das Gebot ausdrücklich als Forderung nach ununterbrochen gesprochenem Gebet in jedem Augenblick wiederzugeben.
  rationale: Der griechische Wortlaut betont Beständigkeit und Beharrlichkeit. Die Übersetzung bewahrt seine Spannung, ohne eine hyperwörtliche asketische Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. »Ohne Unterlass« ist eine geläufige, leicht gehobene Wendung und entspricht der prägnanten Form des griechischen Satzes.
