lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist-Imperativ in der zweiten Person Plural formuliert eine direkte Aufforderung. „Grüßt“ gibt den sozialen Sinn von ἀσπάζομαι knapp und natürlich wieder.
- source_word: ἀδελφοὺς
  choice: Brüder
  rationale: Die griechische Form ist ein maskuliner Plural. „Brüder“ bewahrt diese sprachliche Form; dass die ganze Glaubensgemeinschaft einschließlich der Frauen gemeint sein kann, wird in einer Fußnote kenntlich gemacht.
- source_word: πάντας
  choice: alle
  rationale: πάντας betont die Gesamtheit der angesprochenen Gruppe und wird im Deutschen präzise und idiomatisch mit „alle“ wiedergegeben.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: mit einem heiligen Kuss
  rationale: ἐν bezeichnet hier die begleitende Art und Weise und wird idiomatisch mit „mit“ übersetzt. φίλημα bedeutet konkret „Kuss“, während ἁγίῳ ihn als heilig, das heißt der christlichen Gemeinschaft entsprechend, kennzeichnet.
theological_decisions:
- issue: Geschlechtlich markierte Anrede ἀδελφοί im Zusammenhang der Gemeinde
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Der Haupttext bewahrt den grammatisch maskulinen Ausdruck des Griechischen, ohne den wahrscheinlich umfassenderen Bezug auf die ganze Gemeinde auszuschließen. Dieser mögliche inklusive Sinn wird in Fußnote [a] ausdrücklich genannt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem und knappem apostolischem Aufforderungsstil. Die traditionelle Wendung „heiliger Kuss“ bleibt erhalten, während ihre kulturelle Funktion erläutert wird.
