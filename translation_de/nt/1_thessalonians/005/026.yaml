translation:
  language: de
  text: Grüßt alle Brüder mit einem heiligen Kuss[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Brüder und Schwestern“; „Brüder“ kann hier die gesamte Glaubensgemeinschaft bezeichnen.'
