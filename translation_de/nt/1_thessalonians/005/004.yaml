source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: de
  text: Ihr aber, Brüder[a], seid nicht in der Finsternis, sodass der Tag[b] euch nicht wie ein Dieb ereilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im einschließenden Sinn: „Brüder und Schwestern“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist im unmittelbaren Zusammenhang der Tag des Herrn.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ihr aber
  rationale: Die ausdrückliche Anrede ὑμεῖς ist hervorgehoben, während δέ den Gegensatz zum zuvor Gesagten markiert. „Ihr aber“ bewahrt beides in natürlichem Deutsch.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der griechische maskuline Vokativ wird im Haupttext formal wiedergegeben; der wahrscheinlich die ganze Gemeinde einschließende Gebrauch wird in einer Fußnote erläutert.
- source_word: ἐν σκότει
  choice: in der Finsternis
  rationale: Die Formulierung bewahrt das Bild des griechischen Textes und seinen geistlich-eschatologischen Nachhall, ohne die Metapher erklärend aufzulösen.
- source_word: ἵνα
  choice: sodass
  rationale: 'Im Zusammenhang bezeichnet ἵνα die daraus folgende beziehungsweise erwartbare Lage: Sie befinden sich nicht in einer Finsternis, in der jener Tag sie unerwartet treffen könnte. „Sodass“ lässt die genaue Abstufung zwischen Folge und Zweck weitgehend offen.'
- source_word: ἡ ἡμέρα
  choice: der Tag
  rationale: Der bestimmte Artikel verweist auf den im unmittelbaren Zusammenhang genannten eschatologischen Tag. Die knappe Wiedergabe übernimmt die Form des griechischen Textes, ohne die Kontextangabe in den Haupttext einzutragen.
- source_word: ὡς κλέπτης
  choice: wie ein Dieb
  rationale: Dies ist die natürliche deutsche Vergleichsform und erhält das Bild unverändert.
- source_word: καταλάβῃ
  choice: überrascht
  rationale: καταλαμβάνω bezeichnet hier das unerwartete Einholen oder Ergreifen. Im Bild vom Dieb gibt „überrascht“ die kontextuelle Wirkung natürlich wieder, ohne ein zusätzliches Objekt oder eine ausführliche Erklärung einzuführen.
theological_decisions:
- issue: Geschlechtsspezifische Anrede ἀδελφοί an die Gemeinde
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Der Haupttext bewahrt die grammatisch maskuline Anrede. Da Paulus damit wahrscheinlich die gesamte Gemeinde anspricht, wird der inklusive Sinn in einer Fußnote kenntlich gemacht.
- issue: Eschatologischer Bezug von ἡ ἡμέρα
  choice: der Tag
  alternative: der Tag des Herrn
  rationale: Der unmittelbare Zusammenhang identifiziert den Tag als den Tag des Herrn, doch der Vers selbst enthält nur „der Tag“. Deshalb bleibt der Haupttext knapp, während die Fußnote den Bezug erläutert.
- issue: Nuance von καταλάβῃ
  choice: überrascht
  alternative: ereilt
  rationale: „Ereilt“ bildet die Grundvorstellung des Einholens formaler ab; „überrascht“ bringt im Zusammenhang mit dem Dieb den Aspekt des unerwarteten Getroffenwerdens verständlich zum Ausdruck. Die Aussage über die Wachsamkeit der Angesprochenen bleibt dabei erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Ihr aber“ wahrt den betonten Gegensatz. „Finsternis“ erhält das biblische Bild; „überrascht“ macht die Wirkung des Diebesvergleichs unmittelbar verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
