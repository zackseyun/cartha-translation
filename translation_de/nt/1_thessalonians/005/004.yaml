  terminology: „Finsternis“ wahrt die etablierte biblische Metaphorik. Die Fußnote zu „Brüder“ macht den wahrscheinlich inklusiven Gemeindebezug kenntlich, ohne den griechischen Wortlaut im Haupttext zu ersetzen. Die Kontextfußnote zum „Tag“ ist sachlich und trägt keine zusätzliche Lehrentscheidung ein.
