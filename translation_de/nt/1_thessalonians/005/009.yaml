id: 1TH.5.9
reference: 1 Thessalonians 5:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: de
  text: Denn Gott hat uns nicht zum Zorn bestimmt, sondern dazu, durch unseren Herrn Jesus, den Messias,[b] das Heil zu erlangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zur Erlangung des Heils“. Das griechische Wort περιποίησις kann auch Erwerb oder Besitz und möglicherweise Bewahrung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „durch unseren Herrn Jesus Christus“. Das griechische Χριστός ist hier mit seiner Bedeutung „Messias“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet hier die vorausgehende Ermahnung; „Denn“ gibt diesen kausalen Zusammenhang im Deutschen natürlich wieder.
- source_word: οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν
  choice: Gott hat uns nicht zum Zorn bestimmt
  rationale: τίθημι mit εἰς bezeichnet hier eine Bestimmung auf ein Ziel hin. „Bestimmt“ wahrt diese Aussage, ohne ausdrücklich eine weitergehende Prädestinationslehre zu formulieren. „Zorn“ entspricht dem eschatologisch gewichtigen ὀργή, ohne es deutend durch „Gericht“ zu ersetzen.
- source_word: εἰς περιποίησιν σωτηρίας
  choice: sondern dazu, … das Heil zu erlangen
  rationale: Die verbale deutsche Formulierung ist natürlich und bildet den Gegensatz zweier Zielbestimmungen klar ab. περιποίησις kann neben Erlangung auch Erwerb, Besitz oder Bewahrung bezeichnen; diese Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: σωτηρίας
  choice: Heil
  rationale: „Heil“ ist eine geläufige, würdige Wiedergabe von σωτηρία im paulinischen Zusammenhang und umfasst Gottes endzeitliche Rettung.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: durch unseren Herrn Jesus, den Messias
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise Mittel. Χριστός wird als bedeutungsvoller Titel „Messias“ wiedergegeben; die Apposition mit Artikel ist idiomatisches Deutsch.
theological_decisions:
- issue: Stärke der durch ἔθετο ausgedrückten göttlichen Bestimmung
  choice: hat uns nicht zum Zorn bestimmt
  alternative: hat uns nicht für den Zorn vorgesehen
  rationale: Der Text spricht von Gottes Zielsetzung für die Glaubenden, legt aber keine ausgearbeitete Position zu weitergehenden Prädestinationsfragen fest. „Bestimmt“ bewahrt die Aussage, ohne sie systematisch auszubauen.
- issue: Wiedergabe von Χριστοῦ als Titel oder nameähnliche Bezeichnung
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Χριστός trägt auch nach dem Namen Jesus seinen Titelgehalt. „Messias“ macht diesen Sinn sichtbar; die traditionelle Form „Christus“ bleibt in der Fußnote erhalten.
- issue: Bedeutungsumfang von περιποίησις
  choice: das Heil zu erlangen
  alternative: zum Besitz beziehungsweise zur Bewahrung des Heils zu gelangen
  rationale: „Erlangen“ passt am natürlichsten zum Zielkontrast mit dem Zorn. Da das Substantiv auch Besitz oder Bewahrung bezeichnen kann, wird diese echte lexikalische Offenheit nicht dogmatisch entschieden, sondern angemerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die Satzstruktur bleibt eng am griechischen Zielkontrast, wird aber durch „dazu … zu erlangen“ idiomatisch gestaltet.
