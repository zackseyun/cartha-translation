  text: Do not quench the Spirit,[a]
translation:
  language: de
  text: Löscht den Geist nicht aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch allgemein »Geist« bezeichnen. Hier ist wahrscheinlich der Heilige Geist gemeint, besonders wegen der unmittelbar folgenden Erwähnung prophetischer Äußerungen.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: den Geist
  rationale: Das Substantiv πνεῦμα mit Artikel bezeichnet hier im Zusammenhang mit prophetischen Äußerungen (Verse 20–21) am wahrscheinlichsten den Heiligen Geist. Die deutsche Wiedergabe »den Geist« bleibt zugleich nahe am griechischen Wortlaut und lässt dessen mögliche allgemeinere Bedeutung offen.
- source_word: μὴ
  choice: nicht
  rationale: μή bildet zusammen mit dem Imperativ Präsens ein Verbot; im Deutschen wird dies natürlich durch »nicht« beim Imperativ ausgedrückt.
- source_word: σβέννυτε
  choice: Löscht … aus
  rationale: σβέννυμι bedeutet wörtlich, Feuer oder Licht auszulöschen. »Auslöschen« bewahrt das anschauliche Bild und gibt den Imperativ Präsens in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: der Heilige Geist als wahrscheinlichster Bezug, im Haupttext jedoch als »der Geist« wiedergegeben
  alternative: der menschliche Geist oder geistliche Regung beziehungsweise Gabe
  rationale: Der unmittelbare Hinweis auf prophetische Äußerungen in den folgenden Versen legt das Wirken des Heiligen Geistes in der Gemeinde nahe. Da πνεῦμα sprachlich auch allgemeiner verstanden werden kann und der griechische Text keine bedeutungsunterscheidende Großschreibung kennt, wird die alternative Deutung in einer Fußnote bewahrt.
translation_notes:
  register: Kurzer, einprägsamer Imperativ in modernem Standarddeutsch. Die traditionelle Feuer-Metapher »auslöschen« bleibt erhalten, ohne sie erklärend aufzulösen.
