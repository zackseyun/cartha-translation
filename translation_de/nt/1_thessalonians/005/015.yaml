id: 1TH.5.15
reference: 1 Thessalonians 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: de
  text: Achtet darauf, dass niemand jemandem Böses mit Bösem vergilt[a]. Bemüht euch vielmehr allezeit um das Gute – füreinander und für alle Menschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Passt auf, dass nicht jemand jemandem Böses mit Bösem vergilt.“'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „füreinander und für alle Menschen“ weitet den Blick wahrscheinlich von den Glaubenden untereinander auf alle Menschen aus.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Achtet darauf
  rationale: Der Imperativ ist hier idiomatisch eine Aufforderung zu wachsamer, gemeinschaftlicher Verantwortung, nicht zum bloßen Sehen.
- source_word: μή τις ... τινι ἀποδῷ
  choice: dass niemand jemandem ... vergilt
  rationale: Die Konstruktion bezeichnet das Verhalten, das verhindert werden soll. Die doppelte Wiedergabe mit „niemand“ und „jemandem“ bildet sowohl das indefinite Subjekt als auch den Empfänger natürlich ab.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: Böses mit Bösem
  rationale: Die feste Vergeltungsformel bewahrt die Wiederholung und die breite moralische Bedeutung von κακόν; „mit“ ist im Deutschen die natürliche Formulierung für Vergeltung gleicher Art.
- source_word: πάντοτε
  choice: allezeit
  rationale: „Allezeit“ gibt die uneingeschränkte zeitliche Geltung prägnant und in einem würdigen, gut verständlichen biblischen Register wieder.
- source_word: τὸ ἀγαθὸν
  choice: das Gute
  rationale: Der substantivierte Artikel mit Adjektiv bezeichnet das moralisch Gute als Ziel des Handelns.
- source_word: διώκετε
  choice: Bemüht euch ... um
  rationale: διώκω verlangt hier aktives, beharrliches Streben. „Sich um etwas bemühen“ ist gegenwärtiges, natürliches Deutsch und vermeidet das im Deutschen missverständliche „verfolgen“.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: füreinander und für alle Menschen
  rationale: εἰς bezeichnet hier die Ausrichtung des guten Handelns. „Für“ klingt im Deutschen natürlicher als „gegenüber“ oder „auf ... hin“; „alle Menschen“ macht den personalen Bezug von πάντας deutlich.
theological_decisions:
- issue: Reichweite der ethischen Verpflichtung
  choice: „füreinander und für alle Menschen“ lässt eine Bewegung von der gegenseitigen Verantwortung in der Gemeinde zu einem umfassenderen Personenkreis erkennen.
  alternative: „alle“ könnte ausschließlich alle Glaubenden bezeichnen.
  rationale: Die Verbindung von ἀλλήλους mit πάντας legt eine Erweiterung nahe. Die Übersetzung bildet diese sprachliche Staffelung ab; die Fußnote kennzeichnet die naheliegende Einordnung, ohne sie als ausdrücklich erklärte Gruppengrenze auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Achtet darauf“ und „Bemüht euch“ sind klare Pluralimperative. Der Gedankenstrich verdeutlicht die Ausrichtung des Guten, ohne dem griechischen Text eine zusätzliche inhaltliche Aussage hinzuzufügen.
