  text: προφητείας μὴ ἐξουθενεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: de
  text: Verachtet prophetische Worte[a] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Prophezeiungen“.'
    reason: 'Lexikalische Alternative: προφητείας kann knapp mit „Prophezeiungen“ wiedergegeben werden; „prophetische Worte“ macht den Bezug auf einzelne Äußerungen deutlicher.'
lexical_decisions:
- source_word: προφητείας
  choice: prophetische Worte
  rationale: Der Akkusativ Plural bezeichnet einzelne prophetische Äußerungen oder Botschaften. „Prophetische Worte“ bewahrt den Plural und ist im heutigen Deutsch natürlicher und eindeutiger als das mögliche, aber stärker fachsprachliche „Prophezeiungen“.
- source_word: μὴ
  choice: nicht
  rationale: In Verbindung mit dem Imperativ Präsens bildet μὴ eine schlichte Verneinung; „nicht“ gibt sie wieder, ohne sie durch „niemals“ unnötig zu verstärken.
- source_word: ἐξουθενεῖτε
  choice: Verachtet
  rationale: Das Verb bedeutet, etwas für gering oder nichts zu achten beziehungsweise geringschätzig zu behandeln. „Verachtet“ gibt die Stärke und den imperativischen Charakter knapp wieder; „lehnt ab“ wäre enger und ließe den Aspekt der Geringschätzung vermissen.
theological_decisions:
- issue: Bedeutung von προφητείας im frühchristlichen Gemeindekontext
  choice: Die Formulierung „prophetische Worte“ bleibt breit und bezeichnet prophetische Äußerungen, ohne ihren genauen Vorgang oder ihre spätere dogmatische Einordnung festzulegen.
  alternative: „Prophezeiungen“ oder interpretierend „Botschaften, die als von Gott kommend gelten“
  rationale: Der griechische Ausdruck soll nicht durch eine cessationistische oder continuationistische Deutung verengt werden. Die offene Formulierung bewahrt die theologische Spannung; der folgende Kontext kann zur Prüfung solcher Äußerungen anleiten, ohne dass dies hier vorweggenommen wird.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die Anrede ist wie im Griechischen Plural. Die Wortstellung entspricht natürlichem deutschem Imperativstil.
