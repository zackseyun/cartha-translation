  text: καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: de
  text: und sie wegen ihrer Arbeit in Liebe überaus hoch zu achten.[a] Lebt in Frieden miteinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie in Liebe ganz außerordentlich hoch zu achten“. Das griechische Adverb ist ungewöhnlich stark intensiviert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: achten
  rationale: Das Verb bezeichnet hier eine wertende Haltung gegenüber den im vorigen Vers genannten Personen. „hoch achten“ ist im modernen Deutschen natürlich und bewahrt diesen Sinn.
- source_word: ὑπερεκπερισσοῦ
  choice: überaus hoch
  rationale: Das seltene, stark intensivierende Adverb verlangt eine ungewöhnlich kräftige Formulierung. „überaus hoch“ gibt die Steigerung verständlich wieder, ohne unnatürlich zu klingen.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Die Formulierung bewahrt den zentralen Begriff ἀγάπη und lässt die Liebe als Haltung beziehungsweise Weise der Achtung erkennen.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: wegen ihres Dienstes
  rationale: διά mit Akkusativ nennt den Grund der Achtung. In diesem Gemeindekontext bezeichnet ἔργον die von ihnen verrichtete Arbeit; „Dienst“ gibt ihren gemeindlichen Einsatz natürlich wieder, ohne einen Amtstitel einzuführen.
- source_word: εἰρηνεύετε
  choice: Haltet Frieden
  rationale: Der Präsensimperativ fordert zu einer fortdauernden friedlichen Haltung und Praxis auf. „Haltet Frieden“ ist eine klare, gemeinschaftsbezogene Aufforderung.
- source_word: ἐν ἑαυτοῖς
  choice: untereinander
  rationale: Der pluralische reflexive Ausdruck bezieht sich auf den Frieden innerhalb der Gemeinde. „untereinander“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet diese Aufforderung mit dem vorangehenden Satz und wird entsprechend beibehalten.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist auf die im vorigen Vers genannten Menschen, die in der Gemeinde arbeiten, ihr vorstehen und sie zurechtweisen.
theological_decisions:
- issue: Wiedergabe von ἔργον im Gemeindekontext
  choice: Dienst
  alternative: Arbeit
  rationale: „Dienst“ macht den gemeindlichen Charakter des Wirkens deutlich, ohne eine bestimmte kirchliche Amtslehre vorauszusetzen. Die sachlich breitere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzanschluss mit „und“ bleibt erhalten, da der Vers mitten in einer Reihe von Aufforderungen einsetzt. Die starke Intensität von ὑπερεκπερισσοῦ wird im Haupttext und ergänzend in der Fußnote sichtbar gemacht.
