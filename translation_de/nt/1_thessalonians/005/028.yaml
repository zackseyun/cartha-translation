  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: de
  text: Die Gnade unseres Herrn Jesus Christus sei mit euch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen hinzu: „Amen.“'
