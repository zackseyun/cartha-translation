lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: In paulinischen Segensgrüßen bezeichnet χάρις Gottes unverdiente, wirksame Zuwendung; „Gnade“ ist dafür die präzise und im Deutschen geläufige Entsprechung.
- source_word: κυρίου
  choice: Herrn
  rationale: κύριος ist hier der christologische Titel Jesu und wird mit dem theologisch gewichtigen, idiomatischen „Herr“ wiedergegeben.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: Die feste deutsche Namens- und Titelform „Jesus Christus“ gibt die griechische Verbindung natürlich und würdig wieder; „Christus“ bewahrt zugleich den messianischen Titel, ohne im Deutschen die ungebräuchlichere Form „Jesus Messias“ zu erzwingen.
- source_word: μεθ’ ὑμῶν
  choice: sei mit euch
  rationale: Das Griechische enthält eine verbloser Segensformel. „Sei“ ergänzt das im Deutschen erforderliche Verb und wahrt den Wunsch- bzw. Segenscharakter; ὑμῶν ist Plural und wird mit „euch“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Schlussformel
  choice: Christus
  alternative: Messias
  rationale: Χριστός bedeutet seinem Ursprung nach „Gesalbter/Messias“, ist in der festen Verbindung Ἰησοῦ Χριστοῦ hier jedoch auch namenähnlich gebraucht. „Jesus Christus“ ist im modernen Standarddeutsch die natürliche Form und lässt die traditionelle christologische Titelfunktion bestehen.
- issue: Ergänzung eines Verbs in der verblosen Segensformel
  choice: sei
  alternative: ist / möge sein
  rationale: Der Kontext verlangt einen abschließenden Segenswunsch. „Sei“ gibt diesen knapp wieder, ohne aus der Formel eine Tatsachenfeststellung zu machen oder mit „möge“ stärker auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Form und der traditionelle Segensrhythmus des griechischen Briefschlusses bleiben erhalten.
