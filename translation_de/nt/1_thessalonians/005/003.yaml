source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: de
  text: 'Wenn sie sagen: »Frieden und Sicherheit!«[a], dann kommt plötzliches Verderben über sie, wie die Wehen über eine Schwangere[b], und sie werden ganz gewiss nicht entkommen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Frieden und Schutz.«'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Geburtswehen.«'
    reason: lexical_alternative
  - marker: c
    text: 'Im Griechischen steht eine nachdrückliche Verneinung: »Sie werden keinesfalls entkommen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Wenn sie sagen
  rationale: Die unbestimmte temporale Konstruktion mit Konjunktiv ist im zukunftsbezogenen Warnzusammenhang natürlich mit »Wenn sie sagen« wiedergegeben; das unbestimmte Subjekt »sie« bleibt erhalten.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Frieden und Sicherheit
  rationale: »Frieden« gibt εἰρήνη direkt wieder; »Sicherheit« entspricht dem abstrakten Sinn von ἀσφάλεια und passt zu einem öffentlich geäußerten Anspruch.
- source_word: τότε
  choice: dann
  rationale: Kennzeichnet unmittelbar die Folge der vorangehenden Aussage.
- source_word: αἰφνίδιος ... ἐφίσταται ὄλεθρος
  choice: dann kommt plötzliches Verderben über sie
  rationale: Die Formulierung bewahrt sowohl die Plötzlichkeit als auch das Eintreffen des Verderbens über die Betroffenen. »Verderben« bezeichnet schweren Untergang beziehungsweise Ruin, ohne dessen genaue Art dogmatisch festzulegen.
- source_word: ὥσπερ ἡ ὠδὶν
  choice: wie die Wehen
  rationale: »Wehen« ist die natürliche moderne deutsche Bezeichnung für Geburtsschmerzen und erhält das Vergleichsbild.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: über eine Schwangere
  rationale: Die wörtliche Wendung »der, die [etwas] im Leib hat« wird idiomatisch und präzise als »eine Schwangere« wiedergegeben.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: sie werden ganz gewiss nicht entkommen
  rationale: »Ganz gewiss nicht« vermittelt die nachdrückliche zukünftige Verneinung von οὐ μή mit Aoristkonjunktiv in aktuellem Deutsch.
theological_decisions:
- issue: Bedeutung von ὄλεθρος in der endzeitlichen Warnung
  choice: Verderben
  alternative: Zerstörung; Untergang
  rationale: »Verderben« wahrt die Schwere und Endgültigkeit des angekündigten Gerichts, legt aber weder Auslöschung noch eine bestimmte Lehre über Art und Dauer der Strafe fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf gibt die formelhafte Selbstgewissheit der Aussage wieder. Die Wortstellung folgt natürlichem Deutsch, während die zeitliche Abfolge und die emphatische Schlussverneinung des griechischen Textes deutlich bleiben.
