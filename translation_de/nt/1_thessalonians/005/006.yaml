  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: de
  text: Lasst uns also nicht schlafen wie die anderen, sondern wach bleiben[a] und nüchtern sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wachsam sein“. Das griechische Verb kann Wachsein oder Wachsamkeit betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „besonnen sein“, „einen klaren Kopf behalten“ oder „sich beherrschen“. Das griechische Verb bezeichnet Nüchternheit und im übertragenen Sinn geistige Klarheit und Selbstbeherrschung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: also
  rationale: Die Verbindung beider Folgerungspartikeln leitet nachdrücklich die Konsequenz aus dem vorherigen Gedankengang ein. Im modernen Deutschen gibt „also“ dies natürlich und knapp wieder.
- source_word: μὴ καθεύδωμεν
  choice: lasst uns nicht schlafen
  rationale: Der hortative Konjunktiv mit μή wird als gemeinsame Aufforderung wiedergegeben. Das Bild des Schlafens bleibt erhalten, statt als geistliche oder moralische Gleichgültigkeit ausgedeutet zu werden.
- source_word: ὡς οἱ λοιποί
  choice: wie die anderen
  rationale: οἱ λοιποί bezeichnet die übrigen Menschen im Gegensatz zu den Angesprochenen. „Die anderen“ ist im Deutschen klarer und natürlicher als „die Übrigen“, ohne die Bezugsgruppe näher festzulegen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten ersten Aufforderung markiert „sondern“ im Deutschen den direkten Gegensatz idiomatischer als „aber“.
- source_word: γρηγορῶμεν
  choice: wach bleiben
  rationale: Die Wiedergabe hält den unmittelbaren Gegensatz zu „schlafen“ fest. Zugleich kann das Verb im Kontext Wachsamkeit bezeichnen; diese Bedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: νήφωμεν
  choice: nüchtern sein
  rationale: νήφω bezeichnet Nüchternheit und daraus folgend auch Besonnenheit, geistige Klarheit und Selbstbeherrschung. „Nüchtern sein“ bewahrt das konkrete Bild und seine übertragenen Untertöne.
theological_decisions:
- issue: Metaphorik von Schlaf und Wachsein
  choice: Das Bild von Schlafen und Wachbleiben bleibt im Haupttext erhalten.
  alternative: Als geistliche Sorglosigkeit und Wachsamkeit paraphrasieren.
  rationale: Der Kontext stellt Menschen des Lichts denen der Nacht gegenüber. Die Bildsprache trägt diese ethisch-geistliche Spannung, ohne dass die Übersetzung sie ausdrücklich auf nur eine Bedeutung festlegt.
- issue: Bedeutungsumfang von νήφω
  choice: „nüchtern sein“
  alternative: „besonnen sein“, „einen klaren Kopf behalten“ oder „sich beherrschen“
  rationale: Der griechische Ausdruck kann sowohl konkrete Nüchternheit als auch übertragene geistige Klarheit und Selbstbeherrschung anklingen lassen. Die gewählte Formulierung bewahrt diesen Bedeutungsumfang.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem exhortativem Ton. Die parallele Form „Lasst uns …“ umfasst beide Aufforderungen; „wach bleiben und nüchtern sein“ ist im Deutschen natürlich und bewahrt die griechische Bildsprache.
