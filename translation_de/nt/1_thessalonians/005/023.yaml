source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: de
  text: Möge der Gott des Friedens selbst euch ganz und gar heiligen, und möge euer Geist, eure Seele und euer Körper[a] vollständig und untadelig bewahrt werden bei der Ankunft unseres Herrn Jesus, des Messias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus nennt hier „Geist, Seele und Körper“. Ob damit eine dreigliedrige Sicht des Menschen gelehrt oder einfach der ganze Mensch bezeichnet wird, ist umstritten.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „bei der Ankunft unseres Herrn Jesus Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης
  choice: Der Gott des Friedens selbst aber
  rationale: „Selbst“ bewahrt die intensive Hervorhebung durch αὐτός; „aber“ gibt δέ als leichten Übergang wieder, ohne einen starken Gegensatz zu erzeugen. Der paulinische Titel „Gott des Friedens“ bleibt formal erhalten.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: heilige euch ganz und gar
  rationale: Der Optativ wird als Gebetswunsch mit dem deutschen Konjunktiv wiedergegeben. „Heiligen“ erhält den Bezug zur Heiligkeit; „ganz und gar“ drückt die umfassende Bedeutung von ὁλοτελεῖς natürlich aus.
- source_word: ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: euer Geist, eure Seele und euer Körper mögen vollständig … bewahrt werden
  rationale: Die drei ausdrücklich genannten Begriffe bleiben unterschieden. „Vollständig“ gibt die Vorstellung von Ganzheit und Unversehrtheit in ὁλόκληρον wieder, ohne daraus ein festes anthropologisches System abzuleiten.
- source_word: ἀμέμπτως … τηρηθείη
  choice: mögen vollständig und untadelig bewahrt werden
  rationale: Der passive Optativ wird als Wunsch formuliert. „Untadelig“ gibt ἀμέμπτως idiomatisch wieder; „bewahrt werden“ entspricht dem Passiv von τηρέω.
- source_word: ἐν τῇ παρουσίᾳ
  choice: bei der Ankunft
  rationale: παρουσία bezeichnet hier die endzeitliche Ankunft Jesu. „Bei der Ankunft“ bewahrt die Präposition ἐν und vermeidet die stärkere zeitliche Umdeutung „bis zur Ankunft“.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: unseres Herrn Jesus, des Messias
  rationale: Χριστός wird als Titel mit „Messias“ übersetzt. Die Apposition „des Messias“ ist im modernen Deutschen verständlich und macht den Titelcharakter deutlich.
theological_decisions:
- issue: Dreigliedrige Nennung von Geist, Seele und Körper
  choice: Alle drei Begriffe werden ausdrücklich und unverkürzt wiedergegeben.
  alternative: Die Aufzählung als Umschreibung für „der ganze Mensch“ zusammenzufassen oder als technische Dreiteilung des Menschen zu deuten.
  rationale: Der griechische Text nennt Geist, Seele und Körper, entscheidet aber nicht ausdrücklich, ob damit eine formale Dreiteilung der menschlichen Natur gelehrt oder die Ganzheit des Menschen rhetorisch betont wird.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christus
  rationale: Χριστός ist seinem Ursprung und seiner Funktion nach ein Titel. „Messias“ macht diesen Titelgehalt transparent; die traditionelle Form „Christus“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetswunsch wird durch den Konjunktiv „heilige“ und die Formulierung „mögen … bewahrt werden“ kenntlich gemacht. Die Wiederholung der Possessivformen sorgt trotz der griechischen Sammelkonstruktion für klare und natürliche deutsche Syntax.
