  source_fidelity: Die passive Infinitivkonstruktion ἀναγνωσθῆναι und der umfassende Adressatenkreis πᾶσιν τοῖς ἀδελφοῖς sind im Entwurf zutreffend wiedergegeben. Bei ἐνορκίζω τὸν κύριον ist jedoch „beim Herrn“ die näherliegende deutsche Entsprechung für die Anrufung des Herrn als Eidautorität; „vor dem Herrn“ legt eher einen anderen deutschen Sinn nahe.
  naturalness: „Ich beschwöre euch beim Herrn“ ist feierliches, aber verständliches modernes Standarddeutsch und gibt die starke Verpflichtungsformel idiomatischer wieder als „Ich verpflichte euch vor dem Herrn mit einem Eid“. Der folgende Infinitiv mit „vorlesen zu lassen“ bleibt klar und natürlich.
  terminology: „Herrn“, „Brief“ und „Brüdern“ sind angemessen. Die Fußnote zu „Brüdern“ wahrt die grammatische Form im Haupttext und erläutert sachlich die wahrscheinlich inklusive gemeindliche Referenz. Eine zusätzliche Fußnote sichert die mögliche alternative Nuance von τὸν κύριον ab.
