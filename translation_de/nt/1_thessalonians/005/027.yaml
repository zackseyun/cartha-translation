  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: de
  text: Ich beschwöre euch beim Herrn[b], diesen Brief allen Brüdern[a] vorlesen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüdern“ ist wahrscheinlich die ganze Gemeinde einschließlich der Frauen gemeint; das griechische Wort ἀδελφοῖς steht im maskulinen Plural.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor dem Herrn“. Die griechische Konstruktion ruft den Herrn als Autorität der feierlichen Verpflichtung an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: Ich verpflichte euch ... mit einem Eid
  rationale: Das Verb bezeichnet eine feierliche Verpflichtung unter Eid. Die Formulierung gibt die starke, rechtlich-feierliche Aussage in verständlichem modernem Deutsch wieder.
- source_word: τὸν κύριον
  choice: vor dem Herrn
  rationale: Beim Verb ἐνορκίζω bezeichnet der Akkusativ den Herrn als angerufenen Zeugen beziehungsweise als Autorität des Eides. „Vor dem Herrn“ ist idiomatisch; die mögliche instrumentale Auffassung „beim Herrn“ wird durch die Formulierung nicht dogmatisch ausgeschlossen.
- source_word: ἀναγνωσθῆναι
  choice: vorlesen zu lassen
  rationale: Der passive Aoristinfinitiv bedeutet „vorgelesen zu werden“. „Vorlesen zu lassen“ bewahrt den passiven beziehungsweise veranlassenden Sinn und macht den gemeindlichen Vortrag natürlich deutlich.
- source_word: τὴν ἐπιστολήν
  choice: diesen Brief
  rationale: Gemeint ist das vorliegende Schreiben. „Diesen Brief“ ist im Deutschen natürlicher und verständlicher als „den Brief“ oder das gehobene „diese Epistel“.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: allen Brüdern
  rationale: ἀδελφοῖς ist grammatisch maskuliner Plural. Die textnahe Wiedergabe bewahrt diese Form; dass im paulinischen Sprachgebrauch wahrscheinlich die gesamte Gemeinde einschließlich der Frauen gemeint ist, wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von ἀδελφοῖς in einer wahrscheinlich gemischtgeschlechtlichen Gemeinde
  choice: Brüdern
  alternative: Brüdern und Schwestern
  rationale: Der griechische Text verwendet den maskulinen Plural. Die Hauptübersetzung bleibt formal textnah, während die wahrscheinlich inklusive gemeindliche Bezugsweite in der Fußnote kenntlich gemacht wird.
- issue: Bezug des Herrn bei der eidlichen Verpflichtung
  choice: vor dem Herrn
  alternative: beim Herrn
  rationale: Die Konstruktion kann den Herrn als angerufene Autorität beziehungsweise Zeugen ausdrücken. „Vor dem Herrn“ ist in modernem Deutsch würdevoll und verständlich, ohne die Beziehung unnötig dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Stärke von ἐνορκίζω bleibt erhalten, ohne das heute wenig gebräuchliche „beschwören“ zu verwenden. Nur eine Fußnote ist nötig, da „vor dem Herrn“ die griechische Eidkonstruktion hinreichend natürlich wiedergibt.
