  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: de
  text: Dankt in jeder Lage[a], denn das ist Gottes Wille für euch in Jesus, dem Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter allen Umständen“. Wörtlich steht im Griechischen „in allem“; gemeint sind die Umstände, in denen die Glaubenden danken sollen, nicht zwingend ein Dank für das Böse selbst.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „in Christus Jesus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: in allem
  rationale: ἐν mit dem Dativ bezeichnet hier am natürlichsten den Bereich beziehungsweise die Umstände, in denen gedankt werden soll. Die Wiedergabe vermeidet die stärkere Aussage „für alles“, die auch als Dank für das Böse selbst verstanden werden könnte.
- source_word: εὐχαριστεῖτε
  choice: Dankt
  rationale: Der präsentische Imperativ in der zweiten Person Plural fordert zu einer fortdauernden Haltung und Praxis auf. „Dankt“ ist knapp, natürlich und gibt den Befehl unmittelbar wieder.
- source_word: τοῦτο
  choice: das
  rationale: Das Demonstrativpronomen weist am ehesten auf die unmittelbar vorausgehende Aufforderung zum Danken zurück; die knappe Form bewahrt die Offenheit des griechischen Ausdrucks.
- source_word: γὰρ
  choice: denn
  rationale: γάρ leitet die Begründung für die Aufforderung ein. „Denn“ entspricht dieser Funktion in natürlichem Deutsch.
- source_word: θέλημα θεοῦ
  choice: Gottes Wille
  rationale: Der Genitiv wird idiomatisch possessiv wiedergegeben, ohne den Sinn zu erweitern.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird als bedeutungstragender Titel „Messias“ wiedergegeben; ἐν bleibt erhalten, um die paulinische Beziehungsaussage nicht durch eine erklärende Umschreibung festzulegen.
- source_word: εἰς ὑμᾶς
  choice: für euch
  rationale: 'εἰς mit Personen bezeichnet hier Richtung beziehungsweise Bezug: Gottes Wille betrifft die angesprochenen Gläubigen. „Für euch“ ist dafür die natürliche deutsche Formulierung.'
theological_decisions:
- issue: Bedeutung von ἐν παντί beim Danken
  choice: in allem
  alternative: für alles
  rationale: Der Wortlaut bezeichnet vorrangig die Lage, in der gedankt wird, und verlangt nicht ausdrücklich, das Böse als solches zum Gegenstand des Dankes zu machen. Die echte Kürze und mögliche Weite des Ausdrucks bleiben erhalten.
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός trägt hier weiterhin den Sinn eines Titels und wird deshalb transparent als „Messias“ wiedergegeben. Die traditionelle Form wird in einer Fußnote bewahrt.
- issue: Bezug von τοῦτο
  choice: Rückbezug auf die Aufforderung zum Danken
  alternative: Rückbezug auf die Folge der Aufforderungen in 1. Thessalonicher 5,16–18
  rationale: Der unmittelbarste Bezug ist die direkt vorausgehende Aufforderung; durch das unergänzte „das“ wird ein weiter gefasster Rückbezug jedoch nicht ausgeschlossen.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die Satzstruktur folgt der kompakten Begründungsform des griechischen Textes. „Dankt“ ist allgemeinverständlich; „im Messias Jesus“ bewahrt sowohl den Titelcharakter von Χριστός als auch die theologisch dichte Präposition ἐν.
