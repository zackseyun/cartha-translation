  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: de
  text: Da wir aber zum Tag gehören, lasst uns nüchtern sein und den Brustpanzer des Glaubens[a] und der Liebe sowie die Hoffnung auf Rettung als Helm anlegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Treue«. Das griechische Wort kann Glaube, Vertrauen oder Treue bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ ἡμέρας ὄντες
  choice: Da wir aber zum Tag gehören
  rationale: δέ setzt die Angesprochenen in Gegensatz zu den zuvor Genannten; die Partizipialkonstruktion begründet die Aufforderung. »Zum Tag gehören« gibt den Zugehörigkeits- und Bildcharakter des Genitivs natürlich wieder.
- source_word: νήφωμεν
  choice: lasst uns nüchtern sein
  rationale: Die Wendung bewahrt sowohl den wörtlichen Bezug auf Nüchternheit als auch den übertragenen Sinn von Wachsamkeit und Selbstbeherrschung im Zusammenhang von Nacht und Tag.
- source_word: ἐνδυσάμενοι
  choice: anlegen
  rationale: Das Partizip bezeichnet die mit der Aufforderung verbundene Handlung bzw. ihre praktische Ausführung. Die koordinierte deutsche Form ist natürlich und hält das Rüstungsbild fest.
- source_word: θώρακα
  choice: Brustpanzer
  rationale: Die direkte militärische Bezeichnung bewahrt das ausdrücklich verwendete Rüstungsbild.
- source_word: πίστεως
  choice: Glaubens
  rationale: »Glaube« ist in der Verbindung mit Liebe und Hoffnung die naheliegende Wiedergabe; die mögliche Bedeutung »Treue« wird in einer Fußnote bewahrt.
- source_word: ἀγάπης
  choice: Liebe
  rationale: Dies ist die direkte und im paulinischen Tugendzusammenhang natürliche Wiedergabe.
- source_word: περικεφαλαίαν
  choice: Helm
  rationale: Die übliche deutsche Bezeichnung gibt den militärischen Gegenstand präzise wieder.
- source_word: ἐλπίδα σωτηρίας
  choice: die Hoffnung auf Rettung
  rationale: Der Genitiv bezeichnet am ehesten das Ziel bzw. den Inhalt der Hoffnung. »Rettung« hält den Ausdruck offen und vermeidet eine unnötige konfessionelle Festlegung.
theological_decisions:
- issue: Bedeutung von πίστις im Rüstungsbild
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: Die Verbindung mit Liebe und Hoffnung spricht für die Tugendbezeichnung »Glaube«. Da πίστις auch »Treue« bezeichnen kann, bleibt diese echte lexikalische Möglichkeit in der Fußnote sichtbar.
- issue: Bedeutung von ἡμέρας ὄντες
  choice: zum Tag gehören
  alternative: vom Tag sein
  rationale: Die Formulierung bezeichnet Zugehörigkeit bzw. Lebenssphäre und nicht lediglich eine Tageszeit. Die gewählte Fassung bewahrt das Bild, ohne seine ethisch-theologische Bedeutung weiter auszudeuten.
- issue: Verhältnis von ἐνδυσάμενοι zur Aufforderung
  choice: 'als koordinierte Aufforderung: »nüchtern sein und … anlegen«'
  alternative: »nüchtern sein, indem wir … angelegt haben«
  rationale: Das Aoristpartizip kann begleitenden Umstand oder Mittel ausdrücken. Die Koordination ergibt idiomatisches Deutsch und bewahrt den engen Zusammenhang, ohne eine starre zeitliche Abfolge zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Tag-Nacht- und Rüstungsbild bleibt erhalten; die Satzstruktur ist für heutige Leser geglättet, ohne die theologischen Begriffe auszudeuten.
