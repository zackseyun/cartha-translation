  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: de
  text: Denn ihr selbst wisst ganz genau, dass der Tag des Herrn wie ein Dieb in der Nacht kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: selbst
  rationale: Das intensive Pronomen hebt das bereits in οἴδατε enthaltene Subjekt hervor. „Ihr wisst selbst“ bewahrt diese Betonung natürlich im Deutschen.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet beziehungsweise erläutert die vorausgehende Aussage. „Denn“ gibt diese erklärende Funktion knapp und idiomatisch wieder.
- source_word: ἀκριβῶς
  choice: ganz genau
  rationale: Das Adverb bezeichnet genaue, zuverlässige Kenntnis. In Verbindung mit „wissen“ ist „ganz genau“ natürlich und erhält den Nachdruck.
- source_word: οἴδατε
  choice: wisst
  rationale: οἶδα bedeutet hier unmittelbar „wissen“; die geläufige deutsche Entsprechung passt zum Kontext.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen den Inhalt ihres Wissens flüssig ein. Ein ausdrückliches „dass“ wäre ebenfalls möglich, würde aber eine andere Wortstellung erfordern.
- source_word: ἡμέρα κυρίου
  choice: der Tag des Herrn
  rationale: Die feste biblisch-eschatologische Wendung bezeichnet den Tag göttlichen Eingreifens und nicht einen wöchentlichen Gottesdiensttag.
- source_word: κυρίου
  choice: des Herrn
  rationale: κύριος wird in dieser etablierten biblischen Wendung angemessen mit „Herr“ wiedergegeben.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: wie ein Dieb in der Nacht
  rationale: Die bildhafte Wendung bleibt eng am Griechischen und ist im Deutschen idiomatisch. Sie vermittelt das unerwartete Eintreffen, ohne das Bild auszudeuten.
- source_word: οὕτως
  choice: durch die Stellung des Vergleichs wiedergegeben
  rationale: οὕτως verweist auf die durch den Vergleich bezeichnete Art und Weise. Im natürlichen Deutschen wird diese Beziehung bereits durch „kommt wie …“ ausgedrückt; ein zusätzliches „so“ wäre hier schwerfällig.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens mit Zukunftsbezug bleibt als anschauliches Präsens erhalten und klingt im Deutschen natürlich.
theological_decisions:
- issue: Eschatologische Wendung ἡμέρα κυρίου
  choice: der Tag des Herrn
  alternative: der Herrentag
  rationale: Der Zusammenhang betrifft den Zeitpunkt und das unerwartete Eintreffen des eschatologischen Tages göttlichen Eingreifens. „Tag des Herrn“ bewahrt die etablierte prophetische Wendung und vermeidet eine mögliche Verwechslung mit einem wöchentlichen Feiertag.
- issue: Aussagekraft des Vergleichs „wie ein Dieb in der Nacht“
  choice: Das Bild unverändert als Hinweis auf ein unerwartetes Eintreffen stehen lassen
  alternative: Das Bild durch Begriffe wie „heimlich“, „plötzlich“ oder durch ein bestimmtes Endzeitschema ausdeuten
  rationale: Der Text selbst nennt einen Vergleich, entfaltet dessen Einzelheiten hier aber nicht. Die Übersetzung bewahrt daher das Bild, ohne zusätzliche eschatologische Festlegungen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die Formulierung ist knapp und nachdrücklich; der Doppelpunkt gibt den griechischen Inhaltssatz natürlich wieder. Keine konfessionelle oder endzeitsystematische Zusatzdeutung.
