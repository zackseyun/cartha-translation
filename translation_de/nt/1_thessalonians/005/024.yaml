source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: de
  text: Treu ist der, der euch beruft[a]; er wird es auch tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertrauenswürdig ist der, der euch beruft; er wird es auch vollbringen.“'
    reason: Lexikalische Alternativen für πιστός und ποιήσει sowie mögliche Satzverknüpfung.
lexical_decisions:
- source_word: πιστὸς
  choice: Treu
  rationale: Das prädikative Adjektiv bezeichnet Gottes Verlässlichkeit. „Treu“ ist im Deutschen knapp, idiomatisch und theologisch anschlussfähig; „vertrauenswürdig“ bleibt eine mögliche lexikalische Alternative.
- source_word: ὁ καλῶν
  choice: der, der euch beruft
  rationale: Das substantivierte Präsenspartizip bezeichnet Gott als den Berufenden. „Beruft“ gibt den im paulinischen Kontext üblichen Sinn von καλέω wieder und klingt natürlicher als „ruft“.
- source_word: ὑμᾶς
  choice: euch
  rationale: Die zweite Person Plural wird im Deutschen eindeutig durch „euch“ wiedergegeben und richtet sich an die Gemeinde.
- source_word: ὃς καὶ
  choice: er … auch
  rationale: 'Die Umformung des Relativsatzes in einen selbstständigen Satz ist im Deutschen flüssig und bewahrt durch „auch“ die Kontinuität: Der Berufende ist zugleich der Handelnde.'
- source_word: ποιήσει
  choice: wird es tun
  rationale: Das Futur von ποιέω bleibt bewusst allgemein. Das ergänzte „es“ verweist idiomatisch auf die unmittelbar zuvor erbetene Heiligung und Bewahrung, ohne den unausgesprochenen Gegenstand näher festzulegen.
theological_decisions:
- issue: Unausgesprochener Gegenstand von ποιήσει
  choice: „er wird es auch tun“ – mit Rückbezug auf das in Vers 23 Erbetene
  alternative: „er wird es auch vollbringen“ oder „er wird es auch zustande bringen“
  rationale: Der griechische Text nennt keinen Gegenstand. Das deutsche „es“ hält den Rückbezug offen und bewahrt die knappe Zusage, ohne die Art oder den Ablauf von Gottes Wirken näher zu bestimmen.
- issue: Aussage über Gottes Verlässlichkeit
  choice: „Treu ist der …“
  alternative: „Vertrauenswürdig ist der …“
  rationale: Die vorangestellte Prädikatsstellung erhält den Nachdruck des griechischen Satzanfangs. „Treu“ bezeichnet hier Gottes Verlässlichkeit, ohne eine darüber hinausgehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Anfangsstellung „Treu ist …“ bewahrt den Nachdruck des Originals; der zweite Relativsatz wird für natürliche deutsche Syntax als Hauptsatz formuliert.
