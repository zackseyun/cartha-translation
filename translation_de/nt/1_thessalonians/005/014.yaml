source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: de
  text: Wir bitten euch eindringlich, Brüder[a], die Ungeordneten zurechtzuweisen[b], die Kleinmütigen zu ermutigen[c], euch der Schwachen anzunehmen[d] und mit allen geduldig zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Anrede meint hier die ganze Gemeinde, also Brüder und Schwestern.
    reason: alternative_reading
  - marker: b
    text: 'Oder: die Unbotmäßigen; im Zusammenhang möglicherweise auch: die Untätigen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: tröstet die Entmutigten.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: steht den Schwachen bei; wörtlicher: haltet an den Schwachen fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: wir bitten euch eindringlich
  rationale: Die Formulierung gibt den nachdrücklichen, eindringlichen Appell wieder, ohne das im folgenden νουθετεῖτε ausgedrückte Zurechtweisen vorwegzunehmen.
- source_word: δέ
  choice: nicht eigens wiedergegeben
  rationale: δέ kennzeichnet hier einen fortführenden Übergang. Im Deutschen wird dieser Zusammenhang durch den Satzanschluss hinreichend deutlich; „aber“ würde einen zu starken Gegensatz nahelegen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die formal maskuline Anrede wird quellennah wiedergegeben. Dass die ganze Gemeinde und damit auch die Frauen angesprochen sind, wird in einer Fußnote erläutert.
- source_word: νουθετεῖτε
  choice: weist ... zurecht
  rationale: Die Wendung bezeichnet korrigierende Unterweisung mit dem Ziel, jemanden wieder auf den richtigen Weg zu bringen.
- source_word: ἀτάκτους
  choice: die Ungeordneten
  rationale: Die Bezeichnung wahrt das breite Bild von Menschen, die sich nicht in die gebotene Ordnung einfügen, ohne es vorschnell allein auf Untätigkeit zu verengen.
- source_word: παραμυθεῖσθε
  choice: ermutigt
  rationale: Das Verb bezeichnet freundlichen, stärkenden Zuspruch; „ermutigt“ ist im modernen Deutsch klar und pastoral angemessen.
- source_word: ὀλιγοψύχους
  choice: die Kleinmütigen
  rationale: „Kleinmütig“ bewahrt das Bild mangelnden Mutes und umfasst Entmutigung wie Ängstlichkeit, ohne den Zustand genauer festzulegen.
- source_word: ἀντέχεσθε
  choice: nehmt euch ... an
  rationale: Mit dem Genitiv bezeichnet das Verb ein festes Sich-Halten-an und daraus folgend unterstützende Zuwendung. Die deutsche Wendung drückt verlässliche Fürsorge natürlich aus.
- source_word: τῶν ἀσθενῶν
  choice: der Schwachen
  rationale: Die Übersetzung lässt offen, ob körperliche, seelische, moralische oder soziale Schwäche gemeint ist.
- source_word: μακροθυμεῖτε
  choice: seid geduldig
  rationale: Das Verb bezeichnet lang anhaltende Geduld und Nachsicht gegenüber Menschen; die gewählte Form ist klar und gegenwärtig.
- source_word: πρὸς πάντας
  choice: mit allen
  rationale: Die Formulierung gibt die auf sämtliche Menschen gerichtete Haltung idiomatisch wieder.
theological_decisions:
- issue: Inklusive Reichweite der Anrede ἀδελφοί
  choice: Im Haupttext steht „Brüder“; eine Fußnote weist darauf hin, dass die gesamte Gemeinde einschließlich der Frauen angeredet ist.
  alternative: „Brüder und Schwestern“ oder „Geschwister“ im Haupttext
  rationale: So bleibt die grammatische Gestalt der griechischen Anrede sichtbar, während ihre im Kontext inklusive Reichweite nicht verschwiegen wird.
- issue: Art der Schwäche in τῶν ἀσθενῶν
  choice: „die Schwachen“ ohne nähere Bestimmung
  alternative: Einschränkung auf körperlich Kranke, Glaubensschwache oder sozial Machtlose
  rationale: Der griechische Ausdruck ist breit und der Vers legt die Art der Schwäche nicht fest; eine theologische Verengung wäre daher unbegründet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Imperativen. „Kleinmütige“ und „Ungeordnete“ sind bewusst quellennah gewählt; Fußnoten erschließen ihre alltagssprachlicheren Bedeutungsalternativen. Die Satzstruktur bewahrt die knappe Folge der vier gemeindlichen Aufforderungen.
