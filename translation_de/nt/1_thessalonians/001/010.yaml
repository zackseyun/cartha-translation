reference: 1 Thessalonians 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: de
  text: und auf seinen Sohn vom Himmel zu warten, den er von den Toten auferweckt hat — Jesus, der uns vor dem kommenden Zorn rettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der uns aus dem kommenden Zorn herausrettet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμένειν
  choice: zu warten
  rationale: Das Verb bezeichnet ein erwartungsvolles Warten und führt inhaltlich fort, wozu sich die Thessalonicher nach Vers 9 Gott zugewandt haben.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Die direkte Wiedergabe bewahrt den christologischen Sohnestitel ohne erklärende Erweiterung.
- source_word: ἐκ τῶν οὐρανῶν
  choice: aus dem Himmel
  rationale: Obwohl der griechische Ausdruck im Plural steht, ist im heutigen Deutschen hier der Singular idiomatisch und sinngleich.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: den er von den Toten auferweckt hat
  rationale: Dies entspricht der geläufigen deutschen Auferstehungssprache und gibt die Herkunft aus dem Bereich der Toten angemessen wieder.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Der Personenname folgt der etablierten deutschen Form.
- source_word: τὸν ῥυόμενον
  choice: der uns … rettet
  rationale: Der substantivierte Präsenspartizip wird natürlich als Relativsatz wiedergegeben. Das Präsens charakterisiert Jesus als den Retter, ohne die Aussage ausdrücklich auf eine einzige Zeitstufe festzulegen.
- source_word: ἐκ τῆς ὀργῆς
  choice: vor dem … Zorn
  rationale: Zorn gibt ὀργή genauer wieder als das weitere Gericht. Bei retten ist im Deutschen die Verbindung vor idiomatisch und drückt die Bewahrung aus der drohenden Gefahr aus.
- source_word: τῆς ἐρχομένης
  choice: kommenden
  rationale: Das attributive Partizip bezeichnet den Zorn als herannahend; kommenden ist knapp, natürlich und bewahrt den eschatologischen Bezug.
theological_decisions:
- issue: Wesen des kommenden Zorns
  choice: die Wendung „der kommende Zorn“ ohne nähere Bestimmung beibehalten
  alternative: das kommende Gericht; eine ausdrückliche Deutung als endzeitliche Bedrängnis oder als endgültige Verdammnis
  rationale: Der Vers selbst legt nicht eindeutig fest, welche konkrete Gestalt dieses Zorngericht annimmt. Die Formulierung bewahrt daher die theologische Spannung und vermeidet ein bestimmtes Endzeitschema.
- issue: Zeitlicher Aussagewert von ῥυόμενον
  choice: „der uns … rettet“
  alternative: „der uns retten wird“ oder „der uns gerade rettet“
  rationale: Das Präsenspartizip kann Jesus als denjenigen kennzeichnen, der rettet. Der kommende Zorn weist zwar in die Zukunft, doch der griechische Wortlaut beschränkt die Aussage nicht ausdrücklich auf ein Futur.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung von Vers 9 infinitivisch angebunden. Der Doppelpunkt vor „Jesus“ macht die Apposition im Deutschen klar, ohne den Gedanken in einen neuen Satz umzudeuten.
