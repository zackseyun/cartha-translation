id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: de
  text: Denn unser Evangelium kam nicht nur in Worten zu euch, sondern auch in Kraft, im Heiligen Geist und mit großer Gewissheit[a], wie ihr ja wisst, als was für Männer wir uns unter euch euretwegen erwiesen haben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großer Überzeugung“; auch: „mit völliger Gewissheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was für Menschen wir unter euch euretwegen waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: Evangelium
  rationale: „Evangelium“ ist im Deutschen die etablierte und weiterhin verständliche Bezeichnung für die apostolische Heilsbotschaft; zugleich bewahrt es den paulinischen Fachgebrauch.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: kam … zu euch
  rationale: Die Verbindung bezeichnet hier idiomatisch das Eintreffen beziehungsweise Wirksamwerden der Botschaft bei den Thessalonichern; „kam zu euch“ ist natürlich und kontextgerecht.
- source_word: ἐν λόγῳ μόνον
  choice: nicht nur in Worten
  rationale: Die Formulierung erhält den Gegensatz zwischen bloßer sprachlicher Verkündigung und ihrer wirksamen Begleitung. Der deutsche Plural „Worten“ klingt hier natürlicher als der abstrakte Singular.
- source_word: ἐν δυνάμει
  choice: in Kraft
  rationale: Die Wiedergabe bewahrt die Präpositionalstruktur und den feierlichen Rhythmus der griechischen Reihung.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die Wendung bezeichnet im paulinischen Sprachgebrauch hier den Heiligen Geist; die bestimmte deutsche Form ist idiomatisch und sachlich angemessen.
- source_word: πληροφορίᾳ πολλῇ
  choice: mit großer Gewissheit
  rationale: „Gewissheit“ gibt den Sinn von voller Überzeugtheit oder Sicherheit wieder, ohne ausdrücklich festzulegen, ob sie vor allem die Verkündiger, die Hörer oder das gesamte Geschehen kennzeichnet.
- source_word: καθὼς οἴδατε
  choice: Ihr wisst ja
  rationale: Die deutsche Wendung drückt aus, dass Paulus sich bestätigend auf das eigene Wissen der Adressaten beruft.
- source_word: οἷοι ἐγενήθημεν
  choice: als was für Männer wir uns … erwiesen haben
  rationale: „Sich erweisen“ gibt den kontextuellen Sinn von γίνομαι natürlicher wieder als „werden“, das im Deutschen eine charakterliche Veränderung nahelegen könnte. „Männer“ bezeichnet die konkrete männliche Missionarsgruppe.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Gemeint ist das Auftreten der Missionare inmitten der Gemeinde; „unter euch“ ist dafür die natürliche deutsche Entsprechung.
- source_word: δι’ ὑμᾶς
  choice: euretwegen
  rationale: „Euretwegen“ bewahrt die knappe Form und lässt sowohl den Bezug auf die Adressaten als Anlass als auch den Gedanken ihres Nutzens anklingen.
theological_decisions:
- issue: Bezug von πνεύματι ἁγίῳ
  choice: „im Heiligen Geist“ als Bezug auf den göttlichen Heiligen Geist
  alternative: „in heiligem Geist“ als unbestimmte geistliche Kraft oder Haltung
  rationale: Der paulinische Sprachgebrauch und der Gegensatz zur bloßen Wortverkündigung sprechen für göttliches Wirken, ohne dass über den Wortlaut hinaus erläutert wird, wie dieses Wirken geschah.
- issue: Träger der πληροφορία
  choice: „mit großer Gewissheit“, ohne den Träger ausdrücklich festzulegen
  alternative: „mit großer Überzeugungskraft“ oder „in voller Überzeugung“
  rationale: Der griechische Text nennt nicht ausdrücklich, ob die Gewissheit bei den Verkündigern, den Hörern oder im gesamten Auftreten der Botschaft lag; die Übersetzung hält diese Offenheit fest.
- issue: Charakterisierung der Missionare
  choice: „als was für Männer wir uns … erwiesen haben“
  alternative: „was für Menschen wir unter euch waren“
  rationale: Die gewählte Form bezieht sich konkret auf Paulus und seine männlichen Mitarbeiter und gibt zugleich die qualitative Aussage von οἷοι sowie den kontextuellen Sinn von ἐγενήθημεν wieder.
translation_notes:
  register: Moderne, würdige Standardsprache mit weitgehend bewahrter paulinischer Satzbewegung. Die wiederholten Präpositionalangaben bleiben erkennbar, werden aber so angeordnet, dass der Vers im Deutschen flüssig lesbar ist. „Euretwegen“ ist gehoben, jedoch geläufig und erhält die mögliche Bedeutungsbreite von δι’ ὑμᾶς.
