source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: de
  text: 'Paulus, Silvanus und Timotheus an die Gemeinde[a] der Thessalonicher in Gott, dem Vater, und dem Herrn Jesus, dem Messias[b]: Gnade sei mit euch und Friede.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Versammlung“. Das griechische Wort ἐκκλησία bezeichnet hier die zusammengekommene Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jesus Christus“. Der griechische Titel Χριστός bedeutet „Messias“; traditionell wird er im Deutschen als „Christus“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Die im Deutschen etablierte Form des griechischen Personennamens.
- source_word: Σιλουανὸς
  choice: Silvanus
  rationale: Gibt die im Ausgangstext stehende Namensform Σιλουανός direkt wieder; „Silas“ entspricht einer anderen griechischen Form.
- source_word: Τιμόθεος
  choice: Timotheus
  rationale: Die im Deutschen etablierte Form des griechischen Personennamens.
- source_word: ἐκκλησίᾳ
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet im heutigen Deutschen natürlich die versammelte örtliche Gemeinschaft, ohne primär ein Gebäude zu meinen.
- source_word: Θεσσαλονικέων
  choice: der Thessalonicher
  rationale: Der Genitiv Plural bezeichnet die Menschen aus Thessalonich; die knappe deutsche Einwohnerbezeichnung entspricht der griechischen Form.
- source_word: ἐν
  choice: in
  rationale: Das „in“ wird beibehalten, damit die von Paulus ausgedrückte Sphäre beziehungsweise Beziehung nicht deutend zu „gehörend zu“ oder Ähnlichem aufgelöst wird.
- source_word: θεῷ πατρὶ
  choice: Gott, dem Vater
  rationale: Die Apposition wird ohne ein im Griechischen nicht vorhandenes Possessivpronomen wiedergegeben.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ ist in diesem neutestamentlichen Zusammenhang die sachlich und sprachlich angemessene Wiedergabe von κύριος.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jesus, dem Messias
  rationale: Χριστός wird als bedeutungstragender Titel „Messias“ wiedergegeben; die Apposition mit Artikel ist im Deutschen idiomatisch.
- source_word: χάρις
  choice: Gnade
  rationale: Bewahrt den zentralen paulinischen Grußbegriff und seine theologische Resonanz.
- source_word: εἰρήνη
  choice: Friede
  rationale: Die singularische Form „Friede“ entspricht dem griechischen Grußwort und bewahrt zugleich dessen jüdischen Resonanzraum.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Gnade sei mit euch und Friede
  rationale: Die deutsche Grußformel macht den im nominalen griechischen Satz mitverstandenen Wunsch verständlich und hält zugleich die Abfolge Gnade–euch–Friede fest.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Grußformel
  choice: Messias
  alternative: Christus
  rationale: Der Titel wird seiner Bedeutung nach übersetzt, statt lediglich in der überlieferten Form „Christus“ übernommen zu werden. Die Fußnote nennt die geläufige Alternative.
- issue: Beziehung in ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: in Gott, dem Vater, und dem Herrn Jesus, dem Messias
  alternative: die Gott, dem Vater, und dem Herrn Jesus, dem Messias, gehört
  rationale: Die Präposition „in“ erhält die offene theologische Aussage über die Beziehung beziehungsweise Lebenssphäre der Gemeinde und wahrt die parallele Zuordnung zu Gott, dem Vater, und dem Herrn Jesus.
translation_notes:
  register: Moderne, würdige deutsche Briefsprache. Die Namen stehen in ihren etablierten deutschen Formen. Die knappe griechische Grußformel wird mit dem ergänzten „sei“ verständlich gemacht, ohne ihre Reihenfolge unnötig umzustellen; das theologisch markante „in“ bleibt erhalten.
