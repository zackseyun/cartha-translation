source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: de
  text: Denn von euch aus ist das Wort des Herrn erschallt, nicht nur in Mazedonien und Achaia, sondern an jedem Ort ist euer Glaube an Gott[a] ausgegangen, sodass wir es nicht nötig haben, etwas zu sagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euer auf Gott gerichteter Glaube“. Die Präposition πρὸς bezeichnet eine Ausrichtung auf Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: ist … erschallt
  rationale: „Erschallt“ bewahrt das deutliche Klangbild des griechischen Verbs und gibt das Perfekt mit seinem fortwirkenden Ergebnis wieder.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: das Wort des Herrn
  rationale: Die vertraute paulinische Wendung bleibt erhalten; zugleich wird der Genitiv nicht unnötig auf „Botschaft vom Herrn“ oder „Botschaft über den Herrn“ festgelegt.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Mazedonien und Achaia
  rationale: Die im Deutschen üblichen Formen der antiken Landschaftsnamen werden verwendet.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: sondern an jedem Ort
  rationale: Diese Wiedergabe erhält die konkrete und distributive Formulierung des Griechischen; „überall“ wäre flüssiger, aber weniger nah an der Ausdrucksweise der Vorlage.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: euer Glaube an Gott
  rationale: „Glaube an Gott“ ist im heutigen Deutsch die natürliche Wiedergabe. Eine Fußnote bewahrt die Richtungsnuance von πρὸς.
- source_word: ἐξελήλυθεν
  choice: ist … hinausgedrungen
  rationale: Die Formulierung erhält das Bewegungsbild und den resultativen Sinn des Perfekts. „Hat sich verbreitet“ wäre idiomatisch, aber stärker deutend.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: sodass wir es nicht nötig haben
  rationale: Die resultative Konstruktion mit ὥστε wird natürlich und zugleich eng am Sinn des griechischen Ausdrucks wiedergegeben.
- source_word: λαλεῖν τι
  choice: etwas zu sagen
  rationale: Dies ist eine natürliche deutsche Wiedergabe, ohne einen Gegenstand oder eine besondere Betonung hinzuzufügen.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: Im Zusammenhang geht es vor allem um die glaubende Hinwendung der Thessalonicher zu Gott. „Glaube“ lässt dabei mehr Bedeutungsbreite offen als eine Festlegung auf „Treue“ oder „Vertrauen“.
- issue: Beziehung des Glaubens zu Gott in πρὸς τὸν θεόν
  choice: Glaube an Gott
  alternative: auf Gott gerichteter Glaube; Glaube zu Gott hin
  rationale: Die idiomatische Haupttextformulierung vermeidet unnatürliches Deutsch; die Fußnote hält fest, dass πρὸς eine Ausrichtung auf Gott ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Klang- und Bewegungsbilder der Vorlage bleiben mit „erschallt“ und „hinausgedrungen“ erhalten. Der Satzbau folgt der griechischen Gedankenführung, ohne unnötig schwerfällig zu wirken.
