  to: Denn von euch aus ist das Wort des Herrn erschallt, nicht nur in Mazedonien und Achaia, sondern an jedem Ort ist euer Glaube an Gott[a] ausgegangen, sodass wir es nicht nötig haben, etwas zu sagen.
