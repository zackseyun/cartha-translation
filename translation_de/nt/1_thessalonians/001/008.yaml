  - severity: low
    issue: Formulierung der Fußnote als „Wörtlicher“
    rationale: „Auf Gott gerichteter Glaube“ und besonders „Glaube zu Gott hin“ sind erklärende Umschreibungen der Präposition πρὸς, keine eigentlichen wörtlichen deutschen Entsprechungen. Eine als Alternative formulierte Anmerkung ist präziser und natürlicher.
