review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzstruktur, die beiden Perfektformen, den Klangcharakter von ἐξήχηται, die Ortsnamen, die resultative ὥστε-Konstruktion und die offene Formulierung von λόγος τοῦ κυρίου insgesamt zuverlässig wieder. Für ἐξελήλυθεν ist „hinausgedrungen“ jedoch semantisch zu stark, weil es ein Durchdringen bzw. Vordringen nahelegt, das der einfache Bewegungsverbalbegriff ἐξέρχομαι nicht ausdrückt.
  naturalness: Der Text ist weitgehend modernes, würdiges Standarddeutsch. „Euer Glaube ... ist ... hinausgedrungen“ wirkt allerdings im heutigen Deutsch unnötig ungewohnt und leicht bildlich vermischt. „Ist ... ausgegangen“ bewahrt das Bewegungsbild der Vorlage und ist in diesem Kontext klarer.
  terminology: „Wort des Herrn“, „Mazedonien“, „Achaia“ und „Glaube an Gott“ sind angemessen. Die Fußnote bewahrt zutreffend die Richtungsnuance von πρὸς, sollte aber nicht mit „wörtlicher“ zwei unterschiedlich freie deutsche Umschreibungen als wörtliche Wiedergaben bezeichnen.
  issues:
