source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: de
  text: Denn sie selbst berichten von uns, was für eine Aufnahme wir bei euch fanden[a] und wie ihr euch von den Götzen Gott zugewandt habt[b], um dem lebendigen und wahren Gott zu dienen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was für einen Eingang wir bei euch hatten“. Der griechische Ausdruck bezeichnet die Art und Wirkung unseres Kommens zu den Thessalonichern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ihr euch von den Götzen zu Gott bekehrt habt“ beziehungsweise „wie ihr euch von den Götzen zu Gott umgekehrt habt“.'
    reason: alternative_reading
  - marker: c
    text: „Der lebendige und wahre Gott“ steht im Gegensatz zu den leblosen Götzen; vergleiche Jeremia 10,10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Das betonte Pronomen hebt hervor, dass die anderen von sich aus über Paulus und seine Begleiter berichten.
- source_word: ἀπαγγέλλουσιν
  choice: berichten
  rationale: Das Präsens bezeichnet ein fortdauerndes Weitersagen; „berichten“ ist natürlich und wahrt den öffentlichen Charakter.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: was für eine Aufnahme wir bei euch fanden
  rationale: Wörtlich ist von einem „Eingang“ oder „Hinkommen“ die Rede. Im Zusammenhang umfasst die Wendung die Art und Wirkung ihres Auftretens bei den Thessalonichern; die deutsche Formulierung gibt dies verständlich wieder.
- source_word: πῶς ἐπεστρέψατε
  choice: wie ihr euch … zugewandt habt
  rationale: Die Wendemetapher bleibt erhalten, ohne das Verb vorschnell als theologischen Fachbegriff wiederzugeben.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: von den Götzen Gott zugewandt
  rationale: Die beiden Präpositionen bezeichnen Ausgangspunkt und Ziel der Hinwendung. Die im Deutschen natürliche Wortfolge bewahrt beide Bewegungsrichtungen.
- source_word: εἰδώλων
  choice: Götzen
  rationale: „Götzen“ ist im Deutschen die geläufige kultische Bezeichnung für die verehrten falschen Gottheiten beziehungsweise ihre Bilder.
- source_word: δουλεύειν
  choice: um … zu dienen
  rationale: Der Infinitiv bezeichnet den Zweck beziehungsweise die Folge der Hinwendung und meint hier den ergebenen Dienst für Gott; „dienen“ ist genauer als eine Verengung auf „anbeten“.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: dem lebendigen und wahren Gott
  rationale: Die Adjektive stellen Gott den leblosen und unwahren Götzen gegenüber; die bestimmte deutsche Form ist idiomatisch und sachgerecht.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ erhält den begründenden Anschluss an den vorhergehenden Vers.
theological_decisions:
- issue: Bekehrungssprache in ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: „ihr euch von den Götzen Gott zugewandt habt“
  alternative: „ihr euch von den Götzen zu Gott bekehrt habt“ oder „ihr von den Götzen zu Gott umgekehrt seid“
  rationale: Die Übersetzung bewahrt das Bild einer entschiedenen Richtungsänderung, ohne durch den späteren Fachbegriff „Bekehrung“ zusätzliche systematische Festlegungen einzutragen.
- issue: Bedeutung von δουλεύειν im Verhältnis zu Gott
  choice: „dienen“
  alternative: „als Sklaven dienen“ oder „anbeten“
  rationale: Das Verb gehört zum Wortfeld von Sklavendienst und Dienstbarkeit, bezeichnet hier aber umfassende religiöse Hingabe. „Dienen“ bewahrt diese Weite, ohne die Aussage auf Kult oder auf eine ausdrücklich ausformulierte Sklavenmetapher zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufnahme fanden“ vermeidet das heute missverständliche wörtliche „Eingang hatten“, während die Fußnote den Ausgangsausdruck sichtbar hält. Die Hinwendungsmetapher bleibt im Haupttext erhalten.
