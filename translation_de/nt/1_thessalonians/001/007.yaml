  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: de
  text: sodass ihr für alle Glaubenden in Mazedonien und in Achaia zu einem Vorbild[a] wurdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Beispiel“ oder „zu einem Muster“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet die Folge der im vorherigen Vers beschriebenen Aufnahme des Wortes und Nachahmung ein und bewahrt den konsekutiven Sinn.
- source_word: γενέσθαι
  choice: wurdet
  rationale: Der Aorist-Infinitiv steht nach ὥστε in einer Folgekonstruktion; im Deutschen gibt ein finites Verb diese natürlich wieder.
- source_word: ὑμᾶς
  choice: ihr
  rationale: Das Akkusativsubjekt des griechischen Infinitivs wird in der deutschen finiten Konstruktion zum Subjekt.
- source_word: τύπον
  choice: zu einem Vorbild
  rationale: τύπος bezeichnet hier ein beispielhaftes Muster, an dem sich andere orientieren können; „Vorbild“ ist im heutigen Deutsch klar und idiomatisch.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: für alle Glaubenden
  rationale: Das substantivierte Partizip bezeichnet alle, die glauben. „Glaubende“ bewahrt den verbalen Charakter besser als das ebenfalls mögliche „Gläubige“; „für“ gibt die Bezugsgruppe des Vorbilds natürlich wieder.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: in Mazedonien
  rationale: Direkte lokative Wiedergabe der genannten Region beziehungsweise römischen Provinz.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: und in Achaia
  rationale: Die Wiederholung von „in“ erhält die parallele Struktur der beiden Ortsangaben.
