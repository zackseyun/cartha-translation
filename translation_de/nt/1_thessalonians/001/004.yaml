  yaml_path: translation/nt/1_thessalonians/001/004.yaml
  text: For we know[a], brothers loved by God, your election[b],
translation:
  language: de
  text: Denn wir wissen, von Gott geliebte Brüder und Schwestern, um eure Erwählung,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „eure Erwählung“. Der Ausdruck bezeichnet Gottes Erwählen, ohne hier dessen weitere theologische Zusammenhänge näher zu bestimmen.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: Denn wir wissen
  rationale: Das Partizip führt den Gedankengang aus Vers 3 begründend weiter. Die finite Wendung ist im Deutschen natürlich und gibt den Zusammenhang klar wieder.
- source_word: ἀδελφοὶ
  choice: Brüder und Schwestern
  rationale: Das grammatisch maskuline Pluralwort bezeichnet in diesem paulinischen Gemeindegruß die gesamte Glaubensgemeinschaft. Die kontextuell inklusive Wiedergabe ist im heutigen Deutsch natürlich und sachlich genau.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: von Gott geliebte
  rationale: Die Form bewahrt das Passiv und beschreibt einen aus Gottes Liebe hervorgegangenen, fortbestehenden Zustand.
- source_word: τὴν ἐκλογὴν ὑμῶν
  choice: dass ihr erwählt seid
  rationale: Die verbale Formulierung gibt den griechischen Akkusativgegenstand idiomatisch wieder und vermeidet das im heutigen Deutsch leicht missverständliche politische Wort „Wahl“, ohne die Aussage über Gottes Erwählen näher systematisch festzulegen.
theological_decisions:
- issue: Wiedergabe von ἐκλογή in einem theologisch umstrittenen Zusammenhang
  choice: dass ihr erwählt seid
  alternative: eure Erwählung
  rationale: Beide Wiedergaben lassen offen, wie das Verhältnis von Gottes Erwählen, menschlicher Antwort und Heil systematisch zu erklären ist. Die Hauptfassung ist natürlicheres modernes Deutsch; die nominale Form bleibt in der Fußnote sichtbar.
- issue: Inklusive Bedeutung von ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Im Kontext richtet Paulus sich an die ganze Gemeinde. Die Wiedergabe macht diese pragmatische Bedeutung deutlich, ohne die Geschlechterreferenz zu neutralisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede ist gemeindlich und inklusiv formuliert; die theologisch gewichtige Nominalform „Erwählung“ wird in der Fußnote bewahrt.
