source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: de
  text: Und ihr seid zu Nachahmern von uns und vom Herrn geworden, indem ihr das Wort in großer Bedrängnis mit Freude vom Heiligen Geist[a] aufgenommen habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit Freude des Heiligen Geistes“; gemeint sein kann eine Freude, die vom Heiligen Geist kommt oder durch ihn gewirkt wird.'
    reason: Der griechische Genitiv lässt die genaue Beziehung zwischen Freude und Heiligem Geist offen.
lexical_decisions:
- source_word: μιμηταὶ
  choice: Nachahmer
  rationale: Das Substantiv bezeichnet Menschen, die sich an einem Vorbild orientieren und es nachahmen. „Nachahmer“ bewahrt diesen ausdrücklichen Gedanken genauer als „Anhänger“.
- source_word: ἐγενήθητε
  choice: seid … geworden
  rationale: Die Form von γίνομαι bezeichnet hier den Eintritt in einen neuen Zustand; die deutsche Perfektform ist natürlich und inhaltlich präzise.
- source_word: τοῦ κυρίου
  choice: vom Herrn
  rationale: κύριος ist hier ein christologischer Titel für Jesus; „Herr“ ist die sachgemäße und etablierte Wiedergabe.
- source_word: δεξάμενοι
  choice: indem ihr … aufgenommen habt
  rationale: Das Aoristpartizip erläutert, worin beziehungsweise wodurch sie zu Nachahmern wurden. „Aufgenommen“ bringt neben dem Empfangen auch die bereitwillige Annahme zum Ausdruck.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: Gemeint ist die verkündigte Botschaft. „Das Wort“ bewahrt den paulinischen Sprachgebrauch und dessen Bezüge, ohne die Bedeutung unnötig auszudeuten.
- source_word: ἐν θλίψει πολλῇ
  choice: trotz großer Bedrängnis
  rationale: θλῖψις bezeichnet bedrückende Not, Verfolgungsdruck oder Leiden. Das konzessive „trotz“ gibt im Deutschen den inhaltlichen Gegensatz zur Freude natürlich wieder, auch wenn ἐν formal „in/unter“ bedeutet.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Dies ist eine direkte und idiomatische Wiedergabe der Präpositionalphrase.
- source_word: πνεύματος ἁγίου
  choice: vom Heiligen Geist
  rationale: Der Genitiv kann besonders die Quelle beziehungsweise den Urheber der Freude bezeichnen. „Vom Heiligen Geist“ ist knapp und natürlich; die genuine Mehrdeutigkeit wird in der Fußnote erhalten.
theological_decisions:
- issue: Genitivbeziehung in χαρᾶς πνεύματος ἁγίου
  choice: Freude vom Heiligen Geist, also mit dem Geist als Quelle beziehungsweise Urheber
  alternative: Freude des Heiligen Geistes; vom Heiligen Geist gewirkte Freude
  rationale: Der Gegensatz zwischen großer Bedrängnis und Freude legt nahe, dass der Geist die Quelle oder der Urheber der Freude ist. Da der griechische Genitiv die Beziehung nicht vollständig festlegt, wird die engere formale Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber durch „indem“ und „trotz“ für heutige Leser natürlich erschlossen. Der zentrale paulinische Ausdruck „das Wort“ bleibt erhalten.
