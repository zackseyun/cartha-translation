revisions:
- from: Und ihr seid zu Nachahmern von uns und vom Herrn geworden, indem ihr das Wort trotz großer Bedrängnis mit Freude vom Heiligen Geist[a] aufgenommen habt.
  to: Und ihr seid zu Nachahmern von uns und vom Herrn geworden, indem ihr das Wort in großer Bedrängnis mit Freude vom Heiligen Geist[a] aufgenommen habt.
