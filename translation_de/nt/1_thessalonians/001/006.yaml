    issue: „trotz großer Bedrängnis“ ist stärker konzessiv als ἐν θλίψει πολλῇ.
    rationale: ἐν beschreibt primär den Rahmen bzw. die Situation der Annahme des Wortes. Zwar steht die Freude in einem erkennbaren Kontrast zur Bedrängnis, aber „trotz“ kodiert diesen Kontrast expliziter, als der griechische Wortlaut es tut. „In großer Bedrängnis“ bewahrt die Formulierung und Bedeutung offener.
  revised_text: Und ihr seid zu Nachahmern von uns und vom Herrn geworden, indem ihr das Wort in großer Bedrängnis mit Freude vom Heiligen Geist[a] aufgenommen habt.
