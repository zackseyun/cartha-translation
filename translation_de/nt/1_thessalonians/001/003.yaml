id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: de
  text: Dabei denken wir vor unserem Gott und Vater an das Werk eures Glaubens[a], an die Mühe eurer Liebe und an die Standhaftigkeit eurer Hoffnung auf unseren Herrn Jesus, den Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Glaube“ kann hier auch den Sinn von „Vertrauen“ oder „Treue“ tragen.
    reason: lexical_alternative
  - marker: b
    text: Griechisch Christos; traditionell „Christus“. Das Wort bedeutet „Messias“, das heißt „Gesalbter“.
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: Dabei denken wir … an
  rationale: Das präsentische Partizip führt den Satz aus dem vorhergehenden Vers weiter. „An etwas denken“ gibt den fortdauernden Vorgang natürlich wieder; „dabei“ signalisiert den syntaktischen Anschluss.
- source_word: ἔργου τῆς πίστεως
  choice: das Werk eures Glaubens
  rationale: 'Die Genitivverbindung bleibt bewusst offen: Gemeint sein kann ein vom Glauben hervorgebrachtes oder durch Glauben geprägtes Werk. „Werk“ bewahrt zugleich die dreigliedrige rhetorische Struktur.'
- source_word: κόπου τῆς ἀγάπης
  choice: die Mühe eurer Liebe
  rationale: „Mühe“ vermittelt die in κόπος liegende Vorstellung anstrengenden Einsatzes. Die Genitivkonstruktion wahrt die knappe Parallelität des Griechischen, ohne das Verhältnis zwischen Mühe und Liebe auszudeuten.
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: die Standhaftigkeit eurer Hoffnung
  rationale: „Standhaftigkeit“ bezeichnet beharrliches Ausharren unter Belastung. Der Genitiv bleibt wie im Ausgangstext mehrdeutig und kann Ursprung, Prägung oder Kennzeichen ausdrücken.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: auf unseren Herrn Jesus, den Messias
  rationale: Bei „Hoffnung“ ist „auf“ im Deutschen die natürliche Kennzeichnung ihres Gegenstands. Χριστός wird als Titel mit „der Messias“ wiedergegeben; die Apposition vermeidet den unnatürlichen bloßen Namen „Jesus Messias“.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: vor unserem Gott und Vater
  rationale: „Vor“ bewahrt knapp die Vorstellung der Gegenwart Gottes. „Unser Gott und Vater“ gibt die enge Verbindung beider Bezeichnungen wieder.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe; πίστις kann jedoch je nach Akzent auch Vertrauen oder Treue bezeichnen. Diese echte Bedeutungsbreite wird in einer Fußnote erhalten.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin Titelcharakter und wird daher bedeutungsorientiert mit „der Messias“ übersetzt. Das im Deutschen traditionelle „Christus“ bleibt als Alternative in der Fußnote erhalten.
- issue: Bezug von ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: bei „denken wir … an“ belassen
  alternative: Bezug auf die gesamte Dreiergruppe, besonders auf die Standhaftigkeit
  rationale: Die Stellung am Versende lässt syntaktische Bezugsmöglichkeiten offen. Die deutsche Satzstellung verbindet die Wendung natürlich mit dem Erinnern, ohne auszuschließen, dass das gesamte beschriebene Leben vor Gott geschieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Parallelstruktur „Werk … Mühe … Standhaftigkeit“ und die Genitivverbindungen des griechischen Textes bleiben erhalten. Die Formulierung ist als Fortsetzung von 1,2 gestaltet.
