source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: de
  text: Wir danken Gott allezeit für euch alle und erwähnen euch unablässig[a] in unseren Gebeten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir danken Gott unablässig für euch alle und erwähnen euch in unseren Gebeten.“ Das Adverb kann sich entweder besonders auf das Erwähnen im Gebet oder auf die Danksagung insgesamt beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Wir danken
  rationale: Das Präsens Aktiv in der ersten Person Plural wird mit der natürlichen deutschen Wendung „wir danken“ wiedergegeben; die Ausrichtung des Dankes auf Gott bleibt ausdrücklich erhalten.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet den Empfänger des Dankes und lässt sich im Deutschen unmittelbar mit „Gott danken“ ausdrücken.
- source_word: πάντοτε
  choice: allezeit
  rationale: „Allezeit“ gibt die zeitliche Aussage prägnant wieder und entspricht dem würdigen, zugleich verständlichen Ton eines paulinischen Dankspruchs.
- source_word: περὶ πάντων ὑμῶν
  choice: für euch alle
  rationale: περί mit Genitiv bezeichnet hier den Bezug beziehungsweise Anlass des Dankes; „für euch alle“ ist natürlich und bewahrt die inklusive Kraft von πάντων.
- source_word: μνείαν ποιούμενοι
  choice: und erwähnen euch
  rationale: Das partizipiale Idiom bedeutet wörtlich „Erwähnung machen“. Die koordinierte deutsche Form ist flüssiger; „euch“ wird aus dem Zusammenhang ergänzt und bezeichnet, dass die Adressaten im Gebet genannt werden.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: in unseren Gebeten
  rationale: Die Präpositionalfügung bezeichnet den Gebetsvollzug; „in unseren Gebeten“ ist die natürliche moderne deutsche Entsprechung.
- source_word: ἀδιαλείπτως
  choice: unablässig
  rationale: Das Adverb bezeichnet beharrliche, fortgesetzte Regelmäßigkeit. „Unablässig“ bewahrt die nachdrückliche Wirkung, ohne zwingend eine buchstäblich pausenlose Tätigkeit zu behaupten.
theological_decisions:
- issue: Bezug von ἀδιαλείπτως
  choice: Im Haupttext bezieht sich „unablässig“ durch seine Stellung zunächst auf das Erwähnen im Gebet.
  alternative: 'Das Adverb kann sich auf die gesamte Danksagung beziehen: „Wir danken Gott unablässig …“.'
  rationale: Wortstellung und Satzgliederung lassen den syntaktischen Bezug nicht völlig eindeutig erkennen. Die Haupttextfassung folgt dem näheren Bezug, während die Fußnote die echte Alternative offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Allezeit“ bewahrt den paulinischen Klang, während Satzbau und Wortwahl für heutige Leser unmittelbar verständlich bleiben. Das abschließende Komma trägt dem Satzanschluss an Vers 3 Rechnung.
