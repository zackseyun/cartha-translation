  naturalness: »Was aber … betrifft« und »denn ihr selbst seid von Gott gelehrt« sind würdiges, modernes Standarddeutsch. »dass euch jemand darüber schreibt« ist idiomatischer und präziser als »niemanden, der euch darüber schreibt«. »Liebe unter Glaubensgeschwistern« ist etwas kompakter als die vorliegende Formulierung und bewahrt den gemeinschaftlich-familiären Bezug.
  terminology: »Liebe unter Glaubensgeschwistern« gibt φιλαδελφία inklusiv wieder; »einander zu lieben« erhält die abweichende verbale Wortwahl ἀγαπᾶν, ohne daraus einen theologischen Gegensatz zu konstruieren. »von Gott gelehrt« ist eine klare Wiedergabe von θεοδίδακτοι.
