revisions:
- from: Was aber die Liebe unter Geschwistern im Glauben betrifft[a], so braucht ihr niemanden, der euch darüber schreibt[b]; denn ihr selbst seid von Gott gelehrt, einander zu lieben.
  to: Was aber die Liebe unter Glaubensgeschwistern betrifft[a], so habt ihr es nicht nötig, dass euch jemand darüber schreibt[b]; denn ihr selbst seid von Gott gelehrt, einander zu lieben.
  rationale: Die Revision beseitigt die leichte Bedeutungsverschiebung bei »brauchen« und gibt die griechische Aussage als fehlenden Bedarf an einem Schreiben wieder. Das Subjekt von γράφειν bleibt mit »jemand« offen; die kontextuell naheliegende Einengung auf Paulus und seine Mitabsender bleibt zutreffend in der Fußnote dokumentiert. Die Anpassung von »Geschwistern im Glauben« zu »Glaubensgeschwistern« ist eine stilistische Verdichtung ohne Sinnänderung.
