source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: de
  text: Was aber die Liebe unter Glaubensgeschwistern betrifft[a], so habt ihr es nicht nötig, dass euch jemand darüber schreibt[b]; denn ihr selbst seid von Gott gelehrt, einander zu lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Geschwisterliebe«; gemeint ist die von familiärer Verbundenheit geprägte Liebe unter Glaubenden.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Infinitiv nennt den Schreibenden nicht ausdrücklich. Dem Zusammenhang nach kann auch übersetzt werden: »so habt ihr es nicht nötig, dass wir euch darüber schreiben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Was aber … betrifft
  rationale: Kennzeichnet natürlich und ohne ein nicht vorhandenes zeitliches »nun« den Übergang zu einem neuen Thema; δέ wird mit »aber« leicht weitergeführt.
- source_word: φιλαδελφίας
  choice: Liebe unter Geschwistern im Glauben
  rationale: Gibt die familiäre Bildsprache und den gemeinschaftsbezogenen Sinn von φιλαδελφία inklusiv und in modernem Deutsch wieder, ohne den Ausdruck mit dem späteren Verb ἀγαπᾶν völlig gleichzusetzen.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: so braucht ihr niemanden, der euch darüber schreibt
  rationale: Die griechische Infinitivkonstruktion nennt kein ausdrückliches Subjekt. Die indefinite Formulierung bleibt diesem Befund treu und ist im Deutschen idiomatisch; »darüber« macht den Themenbezug deutlich.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: denn ihr selbst
  rationale: Bewahrt die emphatische Hervorhebung durch αὐτοὶ … ὑμεῖς in natürlichem Deutsch.
- source_word: θεοδίδακτοί
  choice: von Gott gelehrt
  rationale: Gibt das seltene zusammengesetzte Adjektiv verständlich wieder und bewahrt Gott als Urheber der Unterweisung.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: einander zu lieben
  rationale: Die Infinitivwendung wird als Inhalt beziehungsweise Ziel des göttlichen Lehrens natürlich wiedergegeben.
theological_decisions:
- issue: Verhältnis von φιλαδελφία und ἀγαπᾶν im selben Vers
  choice: φιλαδελφία als »Liebe unter Geschwistern im Glauben«, ἀγαπᾶν als »lieben« wiedergeben
  alternative: Beide Ausdrücke unterschiedslos mit »Liebe/lieben« wiedergeben
  rationale: Die Übersetzung bewahrt sowohl die besondere familiäre Prägung des Nomens als auch die allgemeinere verbale Aussage, ohne daraus eine starre theologische Trennung verschiedener Arten von Liebe abzuleiten.
- issue: Unausgesprochenes Subjekt von γράφειν
  choice: Mit »niemanden, der euch … schreibt« indefinit wiedergeben
  alternative: »Wir brauchen euch darüber nicht zu schreiben« beziehungsweise »ihr braucht nicht, dass wir euch schreiben«
  rationale: Im Zusammenhang sind Paulus und seine Mitabsender naheliegende Schreiber, doch der griechische Infinitiv nennt kein Subjekt ausdrücklich. Die Hauptfassung lässt diese Offenheit bestehen; die kontextuell engere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Geschwister im Glauben« erschließt die inklusive gemeinschaftliche Bedeutung, während die Fußnote die knappe griechische Familienmetapher dokumentiert. Die Satzstruktur bleibt gut vorlesbar und folgt dem Gedankengang des Ausgangstextes.
