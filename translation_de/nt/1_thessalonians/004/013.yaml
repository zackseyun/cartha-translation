source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: de
  text: Wir wollen euch aber, Brüder und Schwestern, nicht im Unklaren lassen über die, die eingeschlafen sind[a], damit ihr nicht trauert wie die Übrigen, die keine Hoffnung haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Schlafenden“. Paulus gebraucht Schlaf hier als Bild für Menschen, die gestorben sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν
  choice: Wir wollen euch aber nicht im Unklaren lassen
  rationale: Die deutsche Wendung gibt die verneinte Konstruktion mit ἀγνοεῖν natürlich und sachlich wieder, ohne den heute abwertend klingenden Ausdruck „unwissend“ zu verwenden. δέ wird als milder Übergang mit „aber“ wiedergegeben.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der grammatisch maskuline Plural dient hier als Anrede der gesamten Gemeinde. Im heutigen Deutschen macht „Brüder und Schwestern“ den gemeinten gemischtgeschlechtlichen Adressatenkreis natürlich und eindeutig sichtbar.
- source_word: περὶ τῶν κοιμωμένων
  choice: über die Entschlafenen
  rationale: „Entschlafene“ bewahrt das Schlafbild für Verstorbene und passt zum Auferstehungskontext. Eine Fußnote erläutert die Metapher.
- source_word: ἵνα μὴ λυπῆσθε
  choice: damit ihr nicht trauert
  rationale: „Damit“ wahrt die Ziel- beziehungsweise Folgebeziehung; „trauern“ bezeichnet hier passend die Trauer um Verstorbene und bedeutet im Zusammenhang nicht, dass jede Trauer untersagt wird.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: wie die Übrigen
  rationale: Die knappe Wiedergabe erhält den Vergleich mit den Menschen außerhalb der angesprochenen Hoffnungsgemeinschaft, ohne zusätzliche Deutung in den Haupttext einzutragen.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: die keine Hoffnung haben
  rationale: Dies ist eine direkte und idiomatische Wiedergabe der griechischen Partizipialkonstruktion.
theological_decisions:
- issue: Bedeutung von κοιμωμένων im eschatologischen Zusammenhang
  choice: Das Schlafbild wird mit „die Entschlafenen“ beibehalten.
  alternative: „die Verstorbenen“ oder „die Schlafenden“
  rationale: Die Formulierung bezeichnet hier Verstorbene, lässt aber bewusst das im Auferstehungszusammenhang bedeutsame Schlafbild stehen. Die Fußnote klärt den Bezug, ohne die Metapher im Haupttext aufzulösen.
- issue: Reichweite der Anrede ἀδελφοί
  choice: „Brüder und Schwestern“ als Anrede der ganzen Gemeinde
  alternative: „Brüder“
  rationale: Obwohl die griechische Form grammatisch maskulin ist, spricht Paulus in diesem Kontext sehr wahrscheinlich die gesamte Gemeinde an. Die explizite deutsche Paarform gibt die kommunikative Reichweite wieder, ohne eine theologische Sonderdeutung einzuführen.
- issue: Art der Trauer, die mit ἵνα μὴ λυπῆσθε gemeint ist
  choice: Der Satz unterscheidet christliche Trauer von hoffnungsloser Trauer, statt Trauer schlechthin zu verbieten.
  alternative: Ein uneingeschränktes Verbot jeder Trauer
  rationale: 'Der anschließende Vergleich „wie die Übrigen, die keine Hoffnung haben“ bestimmt die Aussage: Der Unterschied liegt in der Hoffnung, nicht notwendig im völligen Fehlen von Trauer.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Das traditionelle „Entschlafene“ ist wegen der bewahrten Ausgangsmetapher vertretbar und wird durch die Fußnote erklärt; die übrige Syntax bleibt bewusst schlicht und gegenwärtig.
