  terminology: „Brüder und Schwestern“ gibt die an die ganze Gemeinde gerichtete Anrede im heutigen Deutschen angemessen wieder. „Eingeschlafen sind“ wahrt das für den Zusammenhang relevante Schlafbild besser als „Verstorbene“, ohne den stärker traditionssprachlichen Ausdruck „Entschlafene“ zu verlangen.
