id: 1TH.4.11
reference: 1 Thessalonians 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: de
  text: und es euch zum Ziel zu setzen, ein ruhiges Leben zu führen[a], euch um eure eigenen Angelegenheiten zu kümmern[b] und mit euren eigenen Händen zu arbeiten, wie wir euch aufgetragen haben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch darum zu bemühen, still zu sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „das Eure zu tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: es euch zum Ziel zu setzen
  rationale: Das Verb bezeichnet, etwas als Ehrensache oder Ziel anzusehen und sich ernsthaft darum zu bemühen. Die Wendung ist im modernen Deutsch natürlich und bewahrt die auffällige Verbindung mit einem ruhigen Leben.
- source_word: ἡσυχάζειν
  choice: ein ruhiges Leben zu führen
  rationale: Im ermahnenden Zusammenhang geht es nicht bloß um Schweigen, sondern um eine ruhige, geordnete Lebensweise.
- source_word: πράσσειν τὰ ἴδια
  choice: euch um eure eigenen Angelegenheiten zu kümmern
  rationale: Die idiomatische Verbindung meint, sich den eigenen Angelegenheiten zu widmen. Diese Wiedergabe ist klar und vermeidet den schroffen Klang von „kümmert euch um euren eigenen Kram“.
- source_word: ἐργάζεσθαι
  choice: zu arbeiten
  rationale: Das Verb bezeichnet allgemein Arbeit oder Erwerbstätigkeit; „arbeiten“ ist hier die natürliche und hinreichend breite Wiedergabe.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: mit euren eigenen Händen
  rationale: Der Dativ ist instrumental. „eigenen“ gibt das Possessivpronomen wieder und hebt die persönliche Handarbeit beziehungsweise Selbstversorgung hervor.
- source_word: καθὼς
  choice: wie
  rationale: Leitet den Vergleich mit der früheren apostolischen Weisung idiomatisch ein; ein zusätzliches „genau“ wäre im Deutschen möglich, aber nicht erforderlich.
- source_word: παρηγγείλαμεν
  choice: wir euch aufgetragen haben
  rationale: παραγγέλλω bezeichnet eine verbindliche Weisung. „aufgetragen“ bewahrt den autoritativen Ton, ohne im modernen Deutsch unnötig hart zu klingen.
theological_decisions:
- issue: Verbindlichkeit der apostolischen Weisung
  choice: „wie wir euch aufgetragen haben“
  alternative: „wie wir euch geboten haben“
  rationale: Die Übersetzung wahrt den verbindlichen Charakter der früheren Weisung. „geboten“ wäre ebenfalls möglich, klingt im heutigen Deutschen jedoch stärker gesetzlich und kann die Bandbreite von παραγγέλλω verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Fortsetzung des vorangehenden Kontextes mit „und“ sowie abschließendem Komma formuliert. Die Infinitivreihe des Griechischen wird bewahrt; die Fußnoten machen die mögliche engere Wiedergabe von ἡσυχάζειν und die wörtlichere Form des Idioms πράσσειν τὰ ἴδια sichtbar.
