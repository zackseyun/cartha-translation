  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die dreigliedrige Infinitivreihe präzise wieder: φιλοτιμεῖσθαι als bewusstes Zielsetzen, ἡσυχάζειν als ruhige Lebensführung, πράσσειν τὰ ἴδια als Beschäftigung mit den eigenen Angelegenheiten und ἐργάζεσθαι ταῖς χερσὶν ὑμῶν als eigene Handarbeit. „wie wir euch aufgetragen haben“ bildet καθὼς ὑμῖν παρηγγείλαμεν angemessen und mit passender Verbindlichkeit ab.'
  naturalness: Der Text ist modernes, flüssiges Standarddeutsch. Die Konstruktion als mit „und“ eingeleitete Fortsetzung und das Schlusskomma entsprechen dem Charakter des griechischen Satzabschnitts. „Es euch zum Ziel zu setzen“ bewahrt zudem die rhetorisch auffällige Verbindung von Ehrgeiz und ruhiger Lebensweise.
  terminology: Die gewählten Ausdrücke sind registergerecht und vermeiden sowohl unnötig schroffe Umgangssprache als auch eine übermäßig kirchlich-gesetzliche Färbung. „Aufgetragen“ ist für παραγγέλλω in diesem Kontext tragfähig.
