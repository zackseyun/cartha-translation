id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: de
  text: Denn der Herr selbst wird mit einem Befehlsruf[a], mit der Stimme eines Erzengels und mit der Posaune Gottes vom Himmel herabkommen, und die Toten im Messias werden zuerst auferstehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Befehl“ bzw. „mit einem gebietenden Ruf“. Das griechische Wort kann einen Befehl, Aufruf oder Kommandoruf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „die Toten in Christus werden zuerst auferstehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet hier die vorausgehende Zusicherung; „Denn“ gibt diese erklärende Funktion natürlich wieder.
- source_word: αὐτὸς ὁ κύριος
  choice: der Herr selbst
  rationale: „selbst“ bewahrt die Hervorhebung durch das intensive αὐτός.
- source_word: ἐν κελεύσματι
  choice: mit einem Befehlsruf
  rationale: κέλευσμα bezeichnet einen Befehl, Aufruf oder gebietenden Ruf. „Befehlsruf“ bewahrt sowohl den akustischen als auch den gebietenden Aspekt.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: mit der Stimme eines Erzengels
  rationale: Die artikellose Genitivform bezeichnet nicht eindeutig einen bestimmten Erzengel; „eines Erzengels“ lässt dies offen.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: mit der Posaune Gottes
  rationale: „Posaune“ ist die geläufige, würdige biblische Wiedergabe von σάλπιγξ; der Genitiv wird formal bewahrt.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: wird vom Himmel herabkommen
  rationale: Die Formulierung gibt Bewegungsrichtung und Herkunft klar und in natürlichem Deutsch wieder.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: die Toten im Messias
  rationale: Das substantivierte Adjektiv wird idiomatisch als „die Toten“ wiedergegeben; Χριστός wird als Titel mit „Messias“ übersetzt.
- source_word: ἀναστήσονται πρῶτον
  choice: werden zuerst auferstehen
  rationale: Das intransitive Futur bezeichnet die Auferstehung und πρῶτον die zeitliche Reihenfolge gegenüber den im Folgevers erwähnten Lebenden.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: Χριστός ist hier der Titel des Gesalbten. „Messias“ übersetzt diesen Titel, während die traditionelle Form „in Christus“ in einer Fußnote erhalten bleibt.
- issue: Bezug der Stimme des Erzengels
  choice: eines Erzengels
  alternative: des Erzengels
  rationale: Der griechische Ausdruck ist artikellos und bestimmt weder ausdrücklich einen einzelnen bekannten Erzengel noch eindeutig, wessen Stimme den Befehlsruf äußert. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die dreifache Konstruktion mit ἐν wird durch dreimaliges „mit“ nachvollzogen; unnötige Festlegungen hinsichtlich des Erzengels werden vermieden.
