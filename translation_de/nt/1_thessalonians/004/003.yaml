id: 1TH.4.3
reference: 1 Thessalonians 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: de
  text: 'Denn das ist Gottes Wille: eure Heiligung – dass ihr euch von sexueller Unmoral fernhaltet[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Heiligkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch porneía; ein weiter Ausdruck für unerlaubtes sexuelles Verhalten. Traditionell: „Unzucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: Wille
  rationale: „Wille“ ist bei Gottes verbindlicher Absicht die natürliche und sachlich passende Wiedergabe; „Wunsch“ wäre zu schwach, „Plan“ könnte den Sinn unnötig verengen.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: eure Heiligung
  rationale: „Heiligung“ bewahrt die Bedeutung eines Gott geweihten, heiligen Lebens und lässt offen, ob stärker der Zustand oder der Vorgang betont ist. Die Alternative „eure Heiligkeit“ wird in einer Fußnote genannt.
- source_word: ἀπέχεσθαι
  choice: dass ihr euch … fernhaltet
  rationale: Der Infinitiv erläutert, worin die genannte Heiligung hier konkret besteht. Der deutsche dass-Satz gibt diese erklärende Funktion klar und natürlich wieder.
- source_word: πορνείας
  choice: sexuelle Unmoral
  rationale: πορνεία ist ein weiter Ausdruck für unerlaubtes sexuelles Verhalten. „Sexuelle Unmoral“ wahrt diese Breite besser als das heute missverständliche oder enger verstandene „Unzucht“.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ erhält die begründende Verbindung zur vorausgehenden Ermahnung.
theological_decisions:
- issue: Bedeutung von ἁγιασμός in der ethischen Ermahnung
  choice: „Heiligung“, deren ethischer Gehalt durch den folgenden Satz konkretisiert wird
  alternative: „Heiligkeit“ als stärkere Betonung des erreichten Zustands
  rationale: Die Wiedergabe hält sowohl den Gedanken des Geheiligtseins als auch den eines Gott geweihten Lebens offen und beschränkt den Begriff nicht auf ein bestimmtes dogmatisches Modell.
- issue: Bedeutungsumfang von πορνεία
  choice: breit als „sexuelle Unmoral“ wiedergegeben
  alternative: „Unzucht“
  rationale: Der griechische Ausdruck umfasst unerlaubtes sexuelles Verhalten allgemein; die Übersetzung vermeidet eine unbegründete Einengung auf eine einzelne Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt und der Gedankenstrich machen die erläuternde Beziehung zwischen „Heiligung“ und dem folgenden dass-Satz transparent. „Sich fernhalten“ ist idiomatisch und bewahrt den Sinn bewusster Enthaltung.
