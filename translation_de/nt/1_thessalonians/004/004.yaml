  source_fidelity: Der Haupttext bewahrt mit „Gefäß“ die Mehrdeutigkeit von σκεῦος und gibt κτᾶσθαι zutreffend als „erwerben“ wieder, entsprechend der englischen Audit-Fassung. Das eingefügte „soll“ gibt jedoch eine zusätzliche ausdrückliche Sollensmodalität wieder, die im griechischen Infinitiv selbst nicht ausgedrückt ist.
  naturalness: „wie er sich sein eigenes Gefäß in Heiligkeit und Ehre erwerben kann“ ist modernes, verständliches Standarddeutsch und gibt εἰδέναι … κτᾶσθαι idiomatisch als „wissen, wie man etwas erwirbt“ wieder. Die bewusst bildhafte, leicht ungewohnte Wendung bleibt angemessen.
  terminology: „Heiligkeit und Ehre“ ist für ἐν ἁγιασμῷ καὶ τιμῇ treffend. Die Fußnote wahrt die umstrittene Deutung von σκεῦος, ohne eine davon als Hauptsinn festzulegen. Bei der Körperdeutung sollte „beherrschen“ als mögliche auslegerische Wiedergabe, nicht als zwingende lexikalische Bedeutung, kenntlich bleiben.
