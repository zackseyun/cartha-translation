source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: de
  text: dass jeder von euch weiß, wie er sich sein eigenes Gefäß[a] in Heiligkeit und Ehre erwerben kann,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Gefäß“ kann hier der eigene Körper gemeint sein; andere verstehen es als Bezeichnung für eine Ehefrau. Entsprechend wird der Ausdruck auch mit „den eigenen Körper in Heiligkeit und Ehre zu beherrschen“ beziehungsweise „sich in Heiligkeit und Ehre eine Frau zu gewinnen“ übersetzt.
    reason: Die Metapher σκεῦος und ihre Verbindung mit κτᾶσθαι sind auslegungsbedürftig und dürfen nicht stillschweigend auf nur eine Deutung festgelegt werden.
lexical_decisions:
- source_word: εἰδέναι
  choice: weiß, wie … soll
  rationale: Gibt den Infinitiv als abhängigen Inhaltssatz natürlich wieder und bewahrt den Gedanken sachkundigen, verantwortlichen Handelns.
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: sein eigenes Gefäß
  rationale: 'Die wörtliche Wiedergabe bewahrt die echte Auslegungsmehrdeutigkeit: Gemeint sein kann der eigene Körper oder, nach einer anderen Deutung, eine Ehefrau.'
- source_word: κτᾶσθαι
  choice: erwerben
  rationale: Das Verb bezeichnet grundsätzlich das Erwerben oder Gewinnen von Besitz. Diese Wiedergabe folgt der Erwerbsbedeutung, ohne sie zu dem anders möglichen Sinn ‚beherrschen/unter Kontrolle halten‘ umzudeuten.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: in Heiligkeit und Ehre
  rationale: Bewahrt die beiden ethischen Leitbegriffe und die instrumentale beziehungsweise modale Offenheit der Präposition ἐν.
theological_decisions:
- issue: Bedeutung von „Gefäß“
  choice: Die Metapher bleibt im Haupttext stehen und wird in einer Fußnote erläutert.
  alternative: „den eigenen Körper beherrschen“ oder „eine Ehefrau gewinnen“
  rationale: Der griechische Wortlaut erlaubt beide verbreiteten Deutungen; eine eindeutige Auflösung würde eine umstrittene Auslegung in den Text eintragen.
- issue: Bedeutung von κτᾶσθαι
  choice: „erwerben“
  alternative: „besitzen“, „beherrschen“ oder „unter Kontrolle halten“
  rationale: Der mediale Infinitiv hat hier naheliegend die Bedeutung „für sich erwerben/gewinnen“. Zusammen mit „Gefäß“ bleibt die genaue Anwendung dennoch umstritten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewohnte Formulierung „sein eigenes Gefäß erwerben“ ist bewusst quellennah, da eine glattere Wiedergabe die im Griechischen vorhandene Mehrdeutigkeit beseitigen würde.
