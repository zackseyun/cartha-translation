    rationale: εἰδέναι („wissen“) mit κτᾶσθαι („erwerben/gewinnen“) besagt, dass jeder wissen soll bzw. wissen möge, wie er handelt; im deutschen Nebensatz macht „erwerben soll“ aber das Erwerben selbst zusätzlich zu einer explizit modal formulierten Pflicht. „erwerben kann“ gibt „wissen, wie“ idiomatischer wieder, ohne diese zusätzliche Nuance.
