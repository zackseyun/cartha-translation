source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: de
  text: Denn ihr übt sie ja gegenüber allen Brüdern[a] in ganz Mazedonien. Wir bitten euch aber, Brüder[a], darin noch mehr zuzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ bezeichnet hier die Glaubensgeschwister und schließt in den Gemeinden wahrscheinlich Männer und Frauen ein.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn ... ja
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder; „ja“ bewahrt die bestätigende und nachdrückliche Nuance von καί in natürlichem Deutsch.
- source_word: ποιεῖτε αὐτό
  choice: ihr tut das
  rationale: Das Präsens bezeichnet die fortdauernde Praxis; „das“ verweist auf die zuvor genannte Bruderliebe zurück.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: an allen Brüdern
  rationale: „An“ bezeichnet hier idiomatisch die Personen, denen die Liebestat gilt, und bewahrt die relationale Ausrichtung von εἰς.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: in ganz Mazedonien
  rationale: Die knappe Formulierung gibt die umfassende geografische Reichweite natürlich und genau wieder.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Wir bitten euch aber dringend
  rationale: παρακαλέω bezeichnet hier eine nachdrückliche Bitte beziehungsweise Ermahnung; „aber“ gibt den Übergang durch δέ wieder.
- source_word: ἀδελφοὺς / ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede und Gemeinschaftsbezeichnung bleibt im Haupttext erhalten; ihre wahrscheinlich Männer und Frauen umfassende Bedeutung wird in einer Fußnote erklärt.
- source_word: περισσεύειν μᾶλλον
  choice: darin noch weiter zuzunehmen
  rationale: Die Wendung bezeichnet eine weitere Steigerung einer bereits vorhandenen Praxis. „Darin“ macht den Rückbezug auf die Bruderliebe verständlich, ohne eine neue Sache einzuführen.
theological_decisions:
- issue: Umfang von ἀδελφοί/ἀδελφούς in der Gemeinde
  choice: Brüder mit erklärender Fußnote
  alternative: Brüder und Schwestern; Glaubensgeschwister
  rationale: Die Form des griechischen Ausdrucks wird bewahrt, während die Fußnote klarstellt, dass im damaligen gemeindlichen Zusammenhang wahrscheinlich die Glaubenden beider Geschlechter gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bestätigende Verbindung καὶ γάρ wird mit „Denn ... ja“ wiedergegeben; die Ermahnung bleibt eindringlich, ohne altertümlich zu klingen.
