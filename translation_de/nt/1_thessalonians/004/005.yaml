lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: nicht in leidenschaftlicher Begierde
  rationale: Die Wendung beschreibt die Weise beziehungsweise Sphäre des Verhaltens. „Leidenschaftliche Begierde“ gibt die beiden eng verbundenen Substantive natürlich wieder und bewahrt den negativen sexuellen Sinn des Zusammenhangs.
- source_word: καθάπερ καὶ
  choice: wie auch
  rationale: Gibt den Vergleich samt καί knapp und idiomatisch wieder.
- source_word: τὰ ἔθνη
  choice: die Heiden
  rationale: Im paulinischen Zusammenhang bezeichnet der Ausdruck die nichtjüdischen Völker außerhalb der Gotteserkenntnis; „die Heiden“ bildet hier die religiöse Gegenüberstellung verständlicher ab als das heute missverständliche „die Nationen“.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: die Gott nicht kennen
  rationale: Das attributive Partizip bezeichnet einen fortdauernden Zustand und wird im Deutschen natürlich durch einen Relativsatz wiedergegeben.
theological_decisions:
- issue: Wiedergabe von τὰ ἔθνη in der ethischen Gegenüberstellung
  choice: die Heiden
  alternative: die Völker; die Nichtjuden
  rationale: „Heiden“ bringt in diesem Kontext die religiöse Kategorie von Menschen, die Gott nicht kennen, prägnant zum Ausdruck. Die Fußnote hält die ethnische Grundbedeutung offen und vermeidet, die Bezeichnung als pauschale ethnische Abwertung zu verstehen.
- issue: Bedeutung von πάθει ἐπιθυμίας
  choice: in leidenschaftlicher Begierde
  alternative: in Begierdenleidenschaft; in einer Leidenschaft der Begierde
  rationale: Der Genitiv kann die Leidenschaft näher bestimmen. Die gewählte Formulierung wahrt die Intensität und den im Kontext sexuellen, ungeordneten Charakter, ohne eine übermäßig technische deutsche Nominalfügung zu erzeugen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Versfragment setzt den Satz und die Ermahnung aus Vers 4 fort; deshalb beginnt es kleingeschrieben und endet mit einem Komma. „Begierde“ ist kontextgemäß negativ, während die Fußnote die sprachliche Spannweite erkennen lässt.
