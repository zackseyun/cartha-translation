  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und wesentlichen Begriffe des griechischen Textes insgesamt treffend wieder: ἐν λόγῳ κυρίου, die doppelte Kennzeichnung der Lebenden/Übrigbleibenden, παρουσία und die nachdrückliche Verneinung οὐ μή φθάσωμεν. „Entschlafenen“ bewahrt die Metapher von κοιμηθέντας. Allerdings ist „durch ein Wort des Herrn“ im heutigen Deutsch weniger klar und idiomatisch als „aufgrund eines Wortes des Herrn“ bzw. „durch ein Wort vom Herrn“; die letztgenannte Form wahrt zugleich die im Griechischen offene Herkunftsfrage besser.'
  naturalness: „Wir, die Lebenden“ klingt als substantiviertes Partizip in modernem Standarddeutsch etwas steif. „Wir, die wir leben“ ist natürlich, präzise und behält die griechische erste Person. Auch „die bis zur Ankunft des Herrn übrig bleiben“ kann missverständlich nach bloßem Restbestand klingen; „die bis zur Ankunft des Herrn noch übrig bleiben“ ist idiomatischer, ohne den Sinn zu verändern.
  terminology: „Ankunft des Herrn“ ist für παρουσία im Kontext angemessen. „Entschlafenen“ ist als bewusste biblisch geprägte Metapher vertretbar und wird korrekt erklärt. Die Fußnote zu παρουσία sollte die gewählte Übersetzung nicht als bloße Alternative doppeln; „Kommen“, „Eintreffen“ und „Gegenwart“ sind ausreichende lexikalische Hinweise. Die Erklärung zu den Entschlafenen sollte nicht ohne Einschränkung behaupten, das Wort bezeichne an sich ausschließlich Glaubende; im unmittelbaren Kontext sind die verstorbenen Gemeindeglieder gemeint.
