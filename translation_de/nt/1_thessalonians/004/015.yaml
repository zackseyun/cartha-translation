reference: 1 Thessalonians 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: de
  text: 'Denn dies sagen wir euch durch ein Wort vom Herrn[a]: Wir, die wir leben und bis zur Ankunft des Herrn[b] noch übrig bleiben, werden den Entschlafenen[c] ganz gewiss nicht zuvorkommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „durch das Wort des Herrn“. Das Griechische kann entweder auf ein Wort von Jesus, dem Herrn, oder auf eine mit seiner Autorität gegebene Offenbarung hinweisen.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort παρουσία kann je nach Zusammenhang auch „Kommen“, „Eintreffen“ oder „Gegenwart“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Die Entschlafenen“ ist hier ein Bild für die verstorbenen Glaubenden, um die es im Zusammenhang geht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: durch ein Wort des Herrn
  rationale: Bewahrt den instrumentalen beziehungsweise autoritativen Sinn von ἐν und lässt offen, ob ein überliefertes Wort Jesu oder eine mit seiner Autorität gegebene Offenbarung gemeint ist.
- source_word: παρουσίαν
  choice: Ankunft
  rationale: Im eschatologischen Zusammenhang bezeichnet παρουσία das künftige Eintreffen und Gegenwärtigwerden des Herrn. „Ankunft“ gibt den Ereignischarakter natürlich wieder; „Gegenwart“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: οἱ ζῶντες
  choice: wir, die Lebenden
  rationale: Gibt das substantivierte Präsenspartizip knapp und formnah wieder.
- source_word: οἱ περιλειπόμενοι
  choice: die … übrig bleiben
  rationale: Bezeichnet neutral diejenigen, die bis zum genannten Zeitpunkt noch da sind, ohne durch „überleben“ zusätzliche Vorstellungen einzutragen.
- source_word: οὐ μὴ φθάσωμεν
  choice: werden … ganz gewiss nicht zuvorkommen
  rationale: „Ganz gewiss nicht“ bildet die nachdrückliche Verneinung οὐ μή ab; „zuvorkommen“ gibt hier die Bedeutung „zeitlich vorangehen“ idiomatisch wieder.
- source_word: τοὺς κοιμηθέντας
  choice: den Entschlafenen
  rationale: Erhält das griechische Schlafbild für verstorbene Glaubende, statt es erklärend zu „den Toten“ zu verflachen.
- source_word: κύριος / κυρίου
  choice: Herr / Herrn
  rationale: Die kontextuell auf Jesus bezogene Anrede beziehungsweise Bezeichnung wird entsprechend dem üblichen und sachgerechten deutschen Ausdruck mit „Herr“ wiedergegeben.
theological_decisions:
- issue: Art des „Wortes des Herrn“
  choice: Eine Formulierung, die die Autorität des Herrn ausdrückt, aber den Übermittlungsweg offenlässt.
  alternative: Ein ausdrücklich zitiertes Wort des irdischen Jesus oder eine Paulus unmittelbar gegebene prophetische Offenbarung.
  rationale: ἐν λόγῳ κυρίου legt nicht eindeutig fest, ob Paulus eine überlieferte Jesusrede anführt oder eine Offenbarung mit der Autorität des Herrn weitergibt.
- issue: Schlafmetapher für Verstorbene
  choice: Das Bild wird mit „Entschlafenen“ beibehalten.
  alternative: Explizit „den Toten“ oder „den verstorbenen Glaubenden“.
  rationale: Das Bild gehört zur theologischen Textur des Verses und steht im Zusammenhang der Auferstehungshoffnung, ohne den wirklichen Tod zu leugnen.
- issue: Bezug von „wir, die Lebenden“
  choice: Die erste Person des griechischen Textes wird unverändert bewahrt.
  alternative: Verallgemeinernd „diejenigen, die dann noch leben“.
  rationale: Die Übersetzung soll die mögliche Spannung hinsichtlich paulinischer Erwartung nicht durch eine erklärende Umformulierung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt gut verständlich und bewahrt zugleich die Hervorhebung der lebend Übrigbleibenden. „Ganz gewiss nicht“ gibt die starke griechische Verneinung hörbar wieder; „Entschlafene“ ist bewusst bildhaft und wird durch die Fußnote erläutert.
