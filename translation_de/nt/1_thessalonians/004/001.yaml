source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: de
  text: Im Übrigen nun, Brüder[a], bitten und ermahnen wir euch im Herrn Jesus, dass ihr, wie ihr von uns empfangen habt, wie ihr leben und Gott gefallen sollt – und wie ihr ja auch lebt –, noch mehr zunehmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort lautet „Brüder“, kann aber eine gemischte Gruppe anreden.'
    reason: Lexikalische Alternative und Erläuterung des inklusiven Gemeindebezugs.
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Im Übrigen also
  rationale: Kennzeichnet den Übergang zu einem weiteren, abschließenden Ermahnungsabschnitt und gibt sowohl λοιπόν als auch die folgernde Kraft von οὖν wieder, ohne einen unmittelbar bevorstehenden Briefschluss zu behaupten.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die grammatisch maskuline Anrede des griechischen Textes; dass die gesamte Gemeinde einschließlich der Frauen gemeint ist, wird in einer Fußnote erläutert.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: bitten und ermahnen wir euch
  rationale: Die Doppelung verbindet eine eindringliche Bitte mit einer autoritativen Ermahnung. „Ermahnen“ trifft hier die paränetische Kraft von παρακαλεῖν.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: im Herrn Jesus
  rationale: Bewahrt die Präposition und den christologischen Titel; die Bitte geschieht im Bereich und unter der Autorität des Herrn Jesus.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς
  choice: so, wie ihr von uns die Weisung empfangen habt, wie
  rationale: „Empfangen“ erhält den Gedanken der überlieferten Unterweisung. „Die Weisung“ macht die substantivierte Wendung τὸ πῶς im Deutschen verständlich, ohne ihren Inhalt vorwegzunehmen.
- source_word: δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ
  choice: ihr leben und Gott gefallen sollt
  rationale: „Leben“ gibt die im Deutschen weniger übliche paulinische Weg-Metapher idiomatisch wieder. Die Koordination mit „Gott gefallen“ bleibt erhalten; δεῖ wird als moralische Verpflichtung mit „sollt“ ausgedrückt.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: und so lebt ihr ja auch
  rationale: Gibt die anerkennende Feststellung des gegenwärtigen Verhaltens wieder; „ja auch“ spiegelt die bestätigende Kraft von καί.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: sollt ihr darin noch immer mehr zunehmen
  rationale: „Zunehmen“ bewahrt das Bild wachsenden Überflusses, während „darin“ den aus dem Kontext erschlossenen Bereich der beschriebenen Lebensführung natürlich aufnimmt. „Noch immer mehr“ macht deutlich, dass die Gemeinde bereits entsprechend lebt und weiter wachsen soll.
theological_decisions:
- issue: Geschlechtsspezifische Anrede der Gemeinde
  choice: „Brüder“ im Haupttext mit erläuternder Fußnote
  alternative: „Brüder und Schwestern“
  rationale: ἀδελφοί ist grammatisch maskulin, bezeichnet in diesem gemeindlichen Zusammenhang jedoch sehr wahrscheinlich die gesamte Glaubensgemeinschaft. Der Haupttext bewahrt die Form, die Fußnote erklärt ihren inklusiven Bezug.
- issue: κύριος als Bezeichnung für Jesus
  choice: „Herr“
  alternative: „Gebieter“
  rationale: κύριος fungiert hier als christologischer Titel. „Herr“ ist die sachlich und traditionsgeschichtlich angemessene deutsche Wiedergabe.
- issue: Verhältnis von Lebensführung und Gefallen Gottes
  choice: Die griechische Koordination „leben und Gott gefallen“ bleibt bestehen
  alternative: „so leben, dass ihr Gott gefallt“
  rationale: Eine Zweck- oder Folgerelation ist im Zusammenhang naheliegend, wird durch καί jedoch nicht ausdrücklich festgelegt. Die Übersetzung löst diese mögliche Spannung daher nicht einseitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz bleibt als zusammenhängende Bitte erkennbar, wird aber durch Doppelpunkt und Gedankenstriche lesbar gegliedert. Die Formulierung vermeidet konfessionelle Sonderbegriffe und bewahrt die anerkennende Spannung zwischen bereits gelebtem Gehorsam und weiterem Wachstum.
