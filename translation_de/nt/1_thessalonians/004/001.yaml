  naturalness: „Im Übrigen also“ klingt im modernen Standarddeutsch unidiomatisch. Die doppelte Konstruktion „So, wie ... – und so ... – , sollt ihr“ ist zwar verständlich, aber schwerfällig. Eine dass-Konstruktion bildet die griechische Bitte und ihr Ziel klarer und natürlicher ab.
  terminology: „Brüder“, „Herr Jesus“, „bitten und ermahnen“, „leben“ und „Gott gefallen“ sind angemessen. Die Fußnote ist sachlich, idiomatisch und korrekt verankert.
