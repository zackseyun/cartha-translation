    rationale: Das finale ἵνα περισσεύητε μᾶλλον wird im Entwurf als „sollt ihr darin ... zunehmen“ nach einer verschachtelten Vergleichskonstruktion wiedergegeben. Eine einleitende dass-Konstruktion macht die Abhängigkeit von „bitten und ermahnen“ transparent und erhält die gegenwärtige Lebensführung als eingeschobene Anerkennung.
