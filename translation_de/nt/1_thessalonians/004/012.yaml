source:
  edition: SBLGNT
  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: de
  text: damit ihr euch gegenüber Außenstehenden anständig verhaltet und nichts nötig habt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf niemanden angewiesen seid“. Die Formulierung kann betonen, dass sie nicht von anderen abhängig sein sollen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die beabsichtigte Folge der vorangehenden Ermahnung natürlich und präzise ein.
- source_word: περιπατῆτε
  choice: ihr euch … verhaltet
  rationale: Das Verb bedeutet wörtlich „gehen“, bezeichnet hier aber idiomatisch die Lebensführung. Im modernen Deutschen gibt „sich verhalten“ den sozialen Bezug klar und natürlich wieder.
- source_word: εὐσχημόνως
  choice: anständig
  rationale: Bezeichnet ein schickliches, respektables und angemessenes Auftreten. „Anständig“ ist gegenwärtig, verständlich und vermeidet eine Überbetonung des Ehrbegriffs.
- source_word: πρὸς τοὺς ἔξω
  choice: gegenüber Außenstehenden
  rationale: Gibt sowohl die Beziehung zu den Betreffenden als auch die Bezeichnung für Menschen außerhalb der christlichen Gemeinschaft wieder, ohne sie ausdrücklich als Ungläubige zu definieren.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: nichts nötig habt
  rationale: Die Genitivform μηδενός kann sachlich „nichts“ oder personal „niemanden“ bezeichnen. Im Haupttext steht die grammatisch naheliegende, umfassende sachliche Wiedergabe; die kontextuell plausible personale Deutung bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von μηδενὸς χρείαν ἔχητε
  choice: „nichts nötig habt“
  alternative: „auf niemanden angewiesen seid“
  rationale: Im Zusammenhang mit eigener Arbeit und geordnetem Leben geht es um die Vermeidung unnötiger Abhängigkeit. Die Hauptfassung bewahrt die breitere Aussage des Griechischen; die Fußnote hält die mögliche personale Zuspitzung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paulinische Metapher des „Wandelns“ wird zugunsten einer unmittelbar verständlichen deutschen Wendung idiomatisch wiedergegeben. „Außenstehende“ bewahrt die Perspektive der Gemeinschaft, ohne eine stärkere theologische Einordnung einzutragen.
