base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: de
  text: 'Darum: Wer dies verwirft[a], verwirft nicht einen Menschen, sondern Gott, der euch[b] auch seinen Heiligen Geist gibt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer dies missachtet …« Das Verb kann »verwerfen«, »missachten« oder »außer Kraft setzen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »in euch«. Die griechische Präposition lautet εἰς (»in … hinein«); beim Verb »geben« bezeichnet der deutsche Dativ jedoch natürlich den Empfänger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: also
  rationale: Die Folgerung aus der vorangehenden Ermahnung wird im Deutschen natürlich durch die Stellung von »also« im Hauptsatz ausgedrückt.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: wer … verwirft, verwirft
  rationale: Das substantivierte Partizip hat allgemeinen Bezug. »Wer« gibt diesen geschlechtsübergreifenden Sinn idiomatisch wieder; die Wiederholung von »verwirft« bewahrt die pointierte Parallelität des Griechischen.
- source_word: οὐκ ἄνθρωπον … ἀλλὰ τὸν θεόν
  choice: nicht einen Menschen, sondern Gott
  rationale: ἄνθρωπον bezeichnet hier einen Menschen im Gegensatz zu Gott. Der unbestimmte Artikel gibt den generischen Singular im modernen Deutschen klar wieder.
- source_word: τὸν καὶ διδόντα
  choice: der … auch … gibt
  rationale: Das artikulierte Präsenspartizip wird als Relativsatz wiedergegeben. »Auch« bewahrt καί; das Präsens bezeichnet Gottes gegenwärtiges bzw. fortdauerndes Geben, ohne dessen zeitlichen Aspekt zu überbestimmen.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: seinen Heiligen Geist
  rationale: Die Wortgruppe bezeichnet im paulinischen Zusammenhang Gottes Heiligen Geist. Die deutsche Großschreibung macht diesen persönlichen Bezug kenntlich, ohne weitere dogmatische Aussagen einzutragen.
- source_word: εἰς ὑμᾶς
  choice: euch
  rationale: Bei »geben« wird der Empfänger im natürlichen Deutschen mit dem Dativ bezeichnet. Die örtlich wirkende Grundbedeutung von εἰς bleibt als mögliche Nuance in einer Fußnote sichtbar.
theological_decisions:
- issue: Bezug von »seinen Heiligen Geist«
  choice: Die Wendung bezeichnet den Heiligen Geist, den Gott den Glaubenden gibt.
  alternative: Ein heiliger Geist als unpersönliche Gabe oder Haltung.
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον bezeichnet im paulinischen Sprachgebrauch am natürlichsten Gottes Heiligen Geist; die Übersetzung fügt darüber hinaus keine trinitarische Auslegung hinzu.
- issue: Allgemeiner Bezug von ὁ ἀθετῶν
  choice: »wer … verwirft«
  alternative: »derjenige, der … verwirft« oder eine männlich markierte Formulierung
  rationale: Der maskuline Singular ist hier generisch und nicht auf Männer beschränkt. »Wer« erhält diesen allgemeinen Bezug in gegenwärtigem Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gegenüberstellung »nicht einen Menschen, sondern Gott« und die bewusste Wiederholung von »verwirft« bewahren Nachdruck und Struktur des griechischen Satzes.
