id: 1TH.4.17
reference: 1 Thessalonians 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: de
  text: Danach werden wir, die Lebenden, die übrig bleiben, zusammen mit ihnen in Wolken entrückt werden[a], dem Herrn entgegen in die Luft[b]. Und so werden wir für immer beim Herrn sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „mit Macht weggerissen werden“. Das griechische Verb betont ein plötzliches, kraftvolles Geschehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „um dem Herrn in der Luft zu begegnen“. Die Wendung kann das Hinausgehen zu einer Begegnung bezeichnen; wohin es danach geht, sagt der Vers selbst nicht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Danach
  rationale: Kennzeichnet den nächsten Schritt nach der Auferstehung der in Christus Verstorbenen im vorhergehenden Vers und gibt die zeitliche Abfolge natürlich wieder.
- source_word: ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι
  choice: wir, die Lebenden, die übrig bleiben
  rationale: Bewahrt beide näher bestimmenden Partizipialgruppen und bezeichnet diejenigen, die bis zu diesem Zeitpunkt noch leben, ohne ein Überleben aus besonderer Gefahr vorauszusetzen.
- source_word: ἅμα σὺν αὐτοῖς
  choice: zusammen mit ihnen
  rationale: Drückt sowohl Gleichzeitigkeit als auch Gemeinschaft mit den auferstandenen Glaubenden idiomatisch aus.
- source_word: ἁρπαγησόμεθα
  choice: entrückt werden
  rationale: Gibt das Futur Passiv als ein an den Betroffenen vollzogenes, plötzliches und machtvolles Geschehen wieder. Der Ausdruck bleibt knapp und legt kein bestimmtes endzeitliches System fest.
- source_word: ἐν νεφέλαις
  choice: in Wolken
  rationale: Bewahrt das konkrete Wolkenmotiv und dessen möglichen theophanischen Klang, ohne es auszudeuten.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: dem Herrn entgegen
  rationale: Gibt die zielgerichtete Begegnung idiomatisch wieder, ohne einen darüber hinausgehenden Ablauf vorwegzunehmen.
- source_word: εἰς ἀέρα
  choice: in die Luft
  rationale: Bewahrt die Richtungsbedeutung von εἰς und bezeichnet den Raum, in dem die Begegnung stattfindet.
- source_word: καὶ οὕτως
  choice: Und so
  rationale: Bezeichnet die Folge beziehungsweise die auf diese Weise eintretende bleibende Gemeinschaft.
- source_word: πάντοτε
  choice: für immer
  rationale: Gibt im Zusammenhang der eschatologischen Zusage die ununterbrochene und bleibende Dauer in natürlichem Deutsch wieder; wörtlicher wäre „allezeit“.
- source_word: σὺν κυρίῳ ἐσόμεθα
  choice: werden wir beim Herrn sein
  rationale: Bewahrt die zukünftige Zusage dauernder Gemeinschaft mit dem Herrn in klarem modernem Deutsch.
theological_decisions:
- issue: Wiedergabe von ἁρπαγησόμεθα in einem für Lehren über die sogenannte Entrückung zentralen Vers
  choice: entrückt werden
  alternative: mit Macht weggerissen werden
  rationale: Die Übersetzung bezeichnet das plötzliche, von außen bewirkte Geschehen, ohne dessen Zeitpunkt oder Verhältnis zu anderen endzeitlichen Ereignissen konfessionell festzulegen.
- issue: Bedeutung von εἰς ἀπάντησιν τοῦ κυρίου
  choice: dem Herrn entgegen
  alternative: um dem Herrn zu begegnen
  rationale: Die Formulierung hält die Bewegung zur Begegnung fest. Sie entscheidet nicht, wohin sich der Herr und die Begegnenden anschließend begeben, da der Vers dies nicht ausdrücklich sagt.
- issue: Zeitliche Tragweite von πάντοτε
  choice: für immer
  alternative: allezeit
  rationale: Im Kontext bezeichnet das Adverb die fortdauernde Gemeinschaft mit dem Herrn. „Für immer“ ist modernes, natürliches Deutsch, ohne den Inhalt über die Aussage des Verses hinaus zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt relativ nah am griechischen Ablauf, ohne unnatürlich zu wirken. „Entrückt“ wahrt den etablierten biblischen Ausdruck, wird aber durch eine lexikalische Fußnote erläutert; die Formulierung vermeidet eine Festlegung auf ein bestimmtes endzeitliches Lehrsystem.
