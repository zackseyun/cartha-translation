id: 1TH.4.2
reference: 1 Thessalonians 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: de
  text: Denn ihr wisst, welche Anweisungen wir euch durch den Herrn Jesus[a] gegeben haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Vollmacht des Herrn Jesus«.'
    reason: Alternative Deutung von διά mit Genitiv als Hinweis auf die Autorität, in der die Anweisungen gegeben wurden.
lexical_decisions:
- source_word: οἴδατε
  choice: ihr wisst
  rationale: Das formal perfekte οἶδα hat im Koine-Griechischen präsentische Bedeutung; „ihr wisst“ ist die natürliche deutsche Wiedergabe.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage; „denn“ bewahrt diesen Zusammenhang idiomatisch.
- source_word: τίνας
  choice: welche
  rationale: Das pluralische Fragewort bezieht sich auf παραγγελίας und wird im Deutschen natürlich mit „welche Anweisungen“ wiedergegeben.
- source_word: παραγγελίας
  choice: Anweisungen
  rationale: Das Wort bezeichnet verbindliche Weisungen oder Aufträge. „Anweisungen“ ist modern und verständlich und lässt den autoritativen Ton erkennen, ohne ihn gegenüber dem Kontext zu verstärken.
- source_word: ἐδώκαμεν
  choice: gegeben haben
  rationale: Der Aorist von δίδωμι bezeichnet hier das frühere Erteilen der Anweisungen; im natürlichen deutschen Rückblick passt das Perfekt „gegeben haben“.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ wird als indirektes Objekt direkt und idiomatisch wiedergegeben.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: durch den Herrn Jesus
  rationale: διά mit Genitiv kann Vermittlung oder Mittel bezeichnen. Die formnahe Wiedergabe bewahrt zugleich die mögliche Bedeutung, dass die Anweisungen in Jesu Vollmacht ergingen.
- source_word: κυρίου
  choice: Herrn
  rationale: κύριος wird in der üblichen christlichen Titulatur mit „Herr“ wiedergegeben; der Kasus verlangt hier „Herrn“.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung von διὰ τοῦ κυρίου Ἰησοῦ
  choice: durch den Herrn Jesus
  alternative: in der Vollmacht des Herrn Jesus
  rationale: Die griechische Präposition kann eine Vermittlung beziehungsweise ein Mittel ausdrücken und im Kontext zugleich die Autorität Jesu einschließen. Der Haupttext bewahrt mit „durch“ die Mehrdeutigkeit; die Fußnote nennt die plausible autoritative Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Denn“ erhält die Verbindung zum vorherigen Vers; „Anweisungen“ ist allgemein verständlich und trägt den verbindlichen Charakter des griechischen Ausdrucks, ohne unnötig hart zu klingen.
