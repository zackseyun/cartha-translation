review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft Gottes Berufung (ἐκάλεσεν) und den Kontrast zwischen ἀκαθαρσία und ἁγιασμός grundsätzlich. »Zu einem Leben in Heiligung« erweitert jedoch den knappen griechischen Ausdruck ἐν ἁγιασμῷ um »Leben« und verschiebt die durch ἐν ausgedrückte Sphäre/Art des Berufenseins stärker in eine Zielbestimmung. »In Heiligkeit« gibt den Ausdruck unmittelbarer wieder und wahrt die mögliche Zustandsbedeutung von ἁγιασμός; die Prozessbedeutung bleibt als Fußnotenalternative erhalten.
  naturalness: »Denn Gott hat uns nicht zur Unreinheit berufen, sondern in Heiligkeit« ist modernes, würdiges und gut verständliches Standarddeutsch. Die bewusst parallelarme Gegenüberstellung spiegelt den griechischen Kontrast angemessen.
  terminology: »Berufen«, »Unreinheit« und »Heiligkeit« sind passende biblisch-theologische Begriffe, ohne eine konfessionelle Lehre über die Wirkweise der Berufung vorwegzunehmen. »Heiligkeit« ist als Grundtext vorzuziehen; »Heiligung« bleibt wegen der semantischen Breite von ἁγιασμός sachgerecht in der Anmerkung.
  issues:
  - severity: medium
    issue: Die Wendung »zu einem Leben in Heiligung« ergänzt und interpretiert den Ausdruck ἐν ἁγιασμῷ.
    rationale: Das hinzugefügte »Leben« ist zwar kontextuell plausibel, steht aber nicht im Grundtext. Zudem bildet »zu einem Leben in« die präpositionale Gegenüberstellung von ἐπί mit Dativ und ἐν weniger präzise ab und bevorzugt die prozesshafte Lesart »Heiligung«.
  revised_text: Denn Gott hat uns nicht zur Unreinheit[a] berufen, sondern in Heiligkeit[b].
