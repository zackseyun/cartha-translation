  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: de
  text: Denn Gott hat uns nicht zur Unreinheit[a] berufen, sondern in Heiligkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur sittlichen Unreinheit«. Das griechische Wort bezeichnet hier im Zusammenhang besonders sexuelle Unreinheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in Heiligung«. Das griechische Wort kann sowohl den Zustand der Heiligkeit als auch den Vorgang der Heiligung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Ermahnung ein und entspricht natürlichem, gehobenem Standarddeutsch.
- source_word: ἐκάλεσεν
  choice: hat … berufen
  rationale: Das Perfekt gibt den punktuellen göttlichen Ruf idiomatisch wieder; »berufen« bewahrt den biblischen Bedeutungsgehalt, ohne eine bestimmte dogmatische Auslegung festzulegen.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: zur Unreinheit
  rationale: »Zur« bringt Zielrichtung beziehungsweise Bestimmung der Berufung knapp zum Ausdruck. »Unreinheit« wahrt sowohl die moralische als auch die biblische Reinheitskonnotation; im Kontext ist besonders sexuelle Unreinheit gemeint.
- source_word: ἐν ἁγιασμῷ
  choice: zu einem Leben in Heiligung
  rationale: Die Formulierung gibt den Gegensatz zur Unreinheit natürlich wieder und bewahrt zugleich die mögliche Bedeutung von ἁγιασμός als geheiligter Zustand und als fortschreitende Heiligung.
theological_decisions:
- issue: Bedeutung der Berufung durch Gott
  choice: Ein wirklicher göttlicher Ruf, der die ethische Ermahnung begründet, ohne dessen Wirkweise dogmatisch näher zu bestimmen.
  alternative: Eine bloß allgemeine Einladung oder ausdrücklich ein technisch verstandener wirksamer Ruf.
  rationale: Der Text nennt Gottes Berufung als Grundlage eines heiligen Lebens, erläutert aber nicht die dogmatische Wirkweise dieses Rufes.
- issue: Zustand oder Vorgang bei ἁγιασμός
  choice: Die Übersetzung »Leben in Heiligung« hält Zustand, Lebensbereich und fortschreitenden Vorgang zusammen.
  alternative: »Heiligkeit« als vorwiegend statischer Zustand oder »Heiligung« als vorwiegend verstandener Prozess.
  rationale: Das griechische Substantiv kann sowohl Heiligkeit als Zustand als auch Heiligung als Vorgang bezeichnen; diese Spannung soll nicht unnötig aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zu einem Leben in« verdeutlicht idiomatisch den gemeinten Lebensbereich, ohne die Mehrdeutigkeit von ἁγιασμός auf einen rein statischen Zustand oder einen rein fortschreitenden Prozess zu verengen.
