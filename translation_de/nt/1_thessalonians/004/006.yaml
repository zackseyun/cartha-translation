source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: de
  text: Dass niemand zu weit geht und seinen Bruder in dieser Sache übervorteilt[a]; denn der Herr ahndet all dies[b], wie wir euch schon vorher gesagt und nachdrücklich gewarnt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Bruder in dieser Sache ausnutzt“ oder „betrügt“. Das griechische Verb kann bedeuten, sich auf Kosten eines anderen einen unrechtmäßigen Vorteil zu verschaffen. Im Zusammenhang geht es wahrscheinlich um sexuelles Fehlverhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn der Herr ist ein Rächer in Bezug auf all dies“. Gemeint ist, dass der Herr das Unrecht ahndet und gerechtes Urteil vollzieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: Keiner soll dabei die Grenzen überschreiten
  rationale: Der substantivierte Infinitiv führt die Ermahnung aus dem Zusammenhang fort. Die Formulierung bewahrt das Bild einer überschrittenen Grenze und gibt die allgemeine Geltung idiomatisch wieder.
- source_word: πλεονεκτεῖν
  choice: ausnutzen
  rationale: Das Verb bezeichnet, sich auf Kosten eines anderen einen unrechtmäßigen Vorteil zu verschaffen. „Ausnutzen“ wahrt die Breite des Ausdrucks, ohne ihn auf finanziellen Betrug zu verengen.
- source_word: ἐν τῷ πράγματι
  choice: dabei
  rationale: Der Ausdruck verweist auf die unmittelbar zuvor behandelte Angelegenheit, bleibt im Griechischen aber allgemein. „Dabei“ stellt den Kontextbezug natürlich her, ohne die sexuelle Deutung ausdrücklich in den Text einzutragen.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Dies entspricht der maskulinen Singularform des griechischen Ausdrucks und wahrt vermutlich den Bezug auf ein Mitglied der Glaubensgemeinschaft.
- source_word: ἔκδικος κύριος
  choice: der Herr zieht … zur Rechenschaft
  rationale: ἔκδικος bezeichnet den, der Recht schafft beziehungsweise Vergeltung übt. Die deutsche Wendung gibt die richterliche Konsequenz natürlich und würdig wieder, ohne ein missverständliches Bild persönlicher Rachsucht hervorzurufen.
- source_word: περὶ πάντων τούτων
  choice: für all dies
  rationale: Die Formulierung lässt den Umfang bewusst breit und verweist auf die zuvor genannten Verfehlungen.
- source_word: προείπαμεν
  choice: schon früher gesagt
  rationale: Die Wiedergabe bewahrt den zeitlichen Sinn des Verbs und vermeidet eine Doppelung mit dem nachfolgenden stärkeren Ausdruck.
- source_word: διεμαρτυράμεθα
  choice: eindringlich bezeugt
  rationale: Das Verb kann feierliches Bezeugen oder nachdrückliches Warnen ausdrücken. „Eindringlich bezeugt“ erhält diese Bedeutungsbreite, während der warnende Charakter aus dem Satz hervorgeht.
theological_decisions:
- issue: Bezug von ἐν τῷ πράγματι und Art des Unrechts
  choice: Die Formulierung bleibt allgemein, wird im Zusammenhang von Vers 3–5 aber vorrangig als Warnung vor sexueller Grenzüberschreitung und Ausnutzung verstanden.
  alternative: Der Satz warnt enger vor Betrug oder allgemeiner vor geschäftlicher beziehungsweise zwischenmenschlicher Übervorteilung.
  rationale: Der unmittelbare Kontext behandelt Heiligung und sexuelle Unmoral. Dennoch benennt das Griechische die Sache nicht ausdrücklich; deshalb wird die wahrscheinliche Kontextdeutung nicht als Zusatz in den Haupttext aufgenommen.
- issue: Bedeutung von ἔκδικος κύριος
  choice: Der Herr handelt als Richter und zieht die Täter zur Rechenschaft.
  alternative: 'Wörtlicher: Der Herr ist ein Rächer in all diesen Dingen.'
  rationale: Die gewählte Fassung bewahrt Gottes vergeltende Gerechtigkeit, vermeidet jedoch im modernen Deutschen die mögliche Nebenbedeutung ungezügelter persönlicher Rache.
- issue: Wiedergabe von ἀδελφός
  choice: seinen Bruder
  alternative: einen Bruder oder eine Schwester; einen anderen Glaubenden
  rationale: Der Haupttext folgt der maskulinen Singularform. Eine Fußnote erläutert, dass wahrscheinlich ein Glaubensbruder gemeint ist, ohne die Reichweite der ethischen Mahnung unnötig einzuschränken.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und kontextuell angemessene Wiedergabe; hier bezeichnet es den Herrn, der gerechtes Gericht ausübt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Argumentationsstruktur, verwendet aber natürliche deutsche Wendungen. Die wahrscheinliche sexuelle Einordnung wird im Haupttext nicht expliziter formuliert als im Griechischen; die Fußnote bewahrt zugleich die alternative Deutung als Übervorteilung oder Betrug.
