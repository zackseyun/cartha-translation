id: 1TH.4.14
reference: 1 Thessalonians 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: de
  text: Denn wenn wir glauben, dass Jesus gestorben und auferstanden ist, so wird Gott auch die Entschlafenen[a] durch Jesus[b] zusammen mit ihm bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Verstorbenen“ beziehungsweise „diejenigen, die gestorben sind“. Paulus verwendet hier das Bild des Entschlafens für den Tod.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung „durch Jesus“ kann unterschiedlich verstanden und zugeordnet werden: Gott kann die Entschlafenen durch Jesus bringen, oder gemeint sein können diejenigen, die in enger Verbindung mit Jesus entschlafen sind („in Jesus“).'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: Bewahrt sowohl die begründende Funktion von γάρ als auch die Bedingungsform von εἰ und knüpft natürlich an den vorherigen Gedanken an.
- source_word: πιστεύομεν
  choice: wir glauben
  rationale: Gibt das gemeinsame Bekenntnis zu Jesu Tod und Auferstehung in klarem, gegenwärtigem Deutsch wieder.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Verwendet die im Deutschen übliche Form des Eigennamens.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: gestorben und auferstanden ist
  rationale: Gibt die beiden aoristischen Verben als abgeschlossene Ereignisse wieder; „auferstanden“ bewahrt dabei die intransitive Form des griechischen Verbs.
- source_word: οὕτως καὶ
  choice: so … auch
  rationale: Erhält die folgernde Entsprechung zwischen Jesu Auferstehung und Gottes künftigem Handeln an den verstorbenen Glaubenden, ohne die genaue Art der Entsprechung zu überbestimmen.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und natürliche Wiedergabe des Subjekts.
- source_word: τοὺς κοιμηθέντας
  choice: die Entschlafenen
  rationale: Bewahrt das im Zusammenhang bedeutsame Bild des Schlafes für den Tod; die substantivierte Form ist würdig und im Deutschen verständlich.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: durch Jesus
  rationale: Gibt διά mit Genitiv formal naheliegend wieder und lässt offen, ob die Wendung Mittel beziehungsweise Vermittlung bezeichnet oder enger zu den Entschlafenen gehört.
- source_word: ἄξει
  choice: wird … bringen
  rationale: Gibt den Zukunftssinn von ἄγω natürlich wieder, ohne eine zusätzliche Vorstellung wie Auferwecken oder Heimführen einzutragen.
- source_word: σὺν αὐτῷ
  choice: zusammen mit ihm
  rationale: Bewahrt den Begleitsinn von σύν; das Pronomen verweist im Kontext am natürlichsten auf Jesus.
theological_decisions:
- issue: Bedeutung des Todesbildes κοιμηθέντας
  choice: Das Bild wird mit „die Entschlafenen“ beibehalten.
  alternative: die Verstorbenen; diejenigen, die gestorben sind
  rationale: Paulus bezeichnet den wirklichen Tod bildhaft als Schlaf und stellt ihn in den Horizont der Auferstehungshoffnung. Eine bloße Wiedergabe mit „gestorben“ würde dieses Spannungsverhältnis einebnen.
- issue: Deutung und syntaktische Zuordnung von διὰ τοῦ Ἰησοῦ
  choice: Im Haupttext steht „durch Jesus“; die Mehrdeutigkeit wird in einer Fußnote erläutert.
  alternative: in Jesus; durch Jesus als nähere Bestimmung zu Gottes Bringen; um Jesu willen
  rationale: Die Wendung kann als Angabe der Vermittlung beziehungsweise des Mittels verstanden oder enger mit den Entschlafenen verbunden werden. Der Haupttext entscheidet diese exegetische Frage nicht unnötig.
- issue: Bezug von σὺν αὐτῷ
  choice: Das Pronomen bleibt als „mit ihm“ stehen.
  alternative: zusammen mit Jesus
  rationale: Jesus ist der naheliegende Bezug, doch die Beibehaltung des Pronomens folgt der Ausdrucksweise des griechischen Textes und vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entschlafene“ bewahrt bewusst das paulinische Bild, während Satzbau und Verbalformen für heutige Leser klar bleiben. Die Stellung von „durch Jesus“ erhält die echte syntaktische und theologische Mehrdeutigkeit des griechischen Textes.
