  language: de
  text: Darum ermutigt einander mit diesen Worten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tröstet einander mit diesen Worten.« Das Verb kann ermutigen, trösten oder ermahnen bedeuten; in diesem Zusammenhang steht besonders der tröstende Zuspruch im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Die Konjunktion zieht eine Folgerung aus der vorausgehenden Lehre über die Ankunft des Herrn, die Auferstehung und die bleibende Gemeinschaft der Glaubenden.
- source_word: παρακαλεῖτε
  choice: ermutigt
  rationale: Das Verb kann je nach Zusammenhang »ermutigen«, »trösten« oder »ermahnen« bedeuten. Hier steht angesichts der Sorge um die Verstorbenen die stärkende und tröstende Wirkung im Vordergrund; »ermutigt« bewahrt zugleich die Bedeutungsbreite.
- source_word: ἀλλήλους
  choice: einander
  rationale: Die Wiedergabe drückt die Gegenseitigkeit des Auftrags knapp und idiomatisch aus.
- source_word: ἐν
  choice: mit
  rationale: Die Präposition bezeichnet hier das Mittel beziehungsweise den Inhalt der Ermutigung; im Deutschen ist »mit diesen Worten« die natürliche Formulierung.
- source_word: τοῖς λόγοις τούτοις
  choice: diesen Worten
  rationale: Die Formulierung verweist unmittelbar auf die vorausgehenden Aussagen des Paulus und gibt λόγοι konkret und transparent wieder.
