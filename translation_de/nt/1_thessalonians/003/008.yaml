lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion leitet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Gedanken ein. „Denn“ gibt diese Funktion im Deutschen natürlich wieder, ohne die Aussage stärker kausal festzulegen als nötig.
- source_word: νῦν
  choice: jetzt
  rationale: Das Temporaladverb wird direkt wiedergegeben und betont die gegenwärtig neu gewonnene Zuversicht des Paulus.
- source_word: ζῶμεν
  choice: leben wir
  rationale: Die wörtliche Formulierung bleibt erhalten. Im Zusammenhang bezeichnet sie wahrscheinlich neue Lebenskraft oder Ermutigung, doch diese rhetorische Bedeutung wird nicht interpretierend in den Haupttext eingefügt.
- source_word: ἐὰν
  choice: wenn
  rationale: „Wenn“ bewahrt die Bedingungsform des griechischen Satzes und klingt hier im Deutschen natürlicher als „falls“, ohne die Bedingung abzuschwächen.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen wird wiedergegeben und hält die Thessalonicher als Gegenüber im Mittelpunkt.
- source_word: στήκετε
  choice: feststeht
  rationale: Das Verb bezeichnet standhaftes, festes Stehen. „Feststeht“ ist prägnant, gegenwartsbezogen und bewahrt das Bild des griechischen Ausdrucks.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die vertraute paulinische Wendung bleibt erhalten und bezeichnet den Beziehungs- beziehungsweise Wirkungsbereich der Standhaftigkeit, ohne ihn konfessionell einzuengen.
theological_decisions:
- issue: Aussagekraft von „jetzt leben wir“
  choice: Die wörtliche, rhetorisch zugespitzte Aussage wird beibehalten.
  alternative: „Jetzt leben wir wirklich auf“ oder „jetzt haben wir neuen Lebensmut“.
  rationale: Im Zusammenhang spricht Paulus wahrscheinlich von neuer Ermutigung und Lebenskraft angesichts der Standhaftigkeit der Thessalonicher, nicht bloß vom körperlichen Überleben. Die wörtliche Wiedergabe bewahrt jedoch die Ausdruckskraft und theologische Spannung.
- issue: Bedeutung von „im Herrn“
  choice: „im Herrn“ als umfassende paulinische Beziehungs- und Sphärenangabe
  alternative: „in der Verbundenheit mit dem Herrn“ oder „dem Herrn treu“.
  rationale: Die knappe Formulierung lässt die inhaltliche Weite des griechischen Ausdrucks bestehen und legt ihn nicht auf eine bestimmte Lehre über Beharren oder Gemeinschaft fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und eindringliche Satzstruktur des Griechischen bleibt erhalten; „feststeht“ ist verständlich und bewahrt zugleich das Bild des standhaften Stehens.
