  text: Darum[a] hielten wir es, weil wir es nicht länger aushielten, für gut, allein in Athen zurückgelassen zu werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deshalb“; auch möglich: „Da wir es nicht länger aushielten“.'
    reason: Διὸ kennzeichnet den Folgerungsanschluss; die partizipiale Konstruktion kann im Deutschen auch als Kausalsatz wiedergegeben werden.
  - marker: b
    text: 'Oder: „waren wir damit einverstanden, allein in Athen zurückgelassen zu werden“.'
    reason: 'εὐδοκήσαμεν kann günstige Zustimmung oder einen zustimmenden Entschluss ausdrücken. καταλειφθῆναι ist passiv: „zurückgelassen zu werden“.'
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorherigen Zusammenhang und stellt den logischen Anschluss natürlich her.
- source_word: μηκέτι στέγοντες
  choice: hielten wir es nicht länger aus
  rationale: Die Verbindung beschreibt die Grenze emotionaler Belastbarkeit; die deutsche Wendung ist idiomatisch und bewahrt den Sinn von στέγω als ertragen oder aushalten.
- source_word: εὐδοκήσαμεν
  choice: hielten wir es für das Beste
  rationale: Gibt den zustimmenden Willensentschluss im Kontext natürlich wieder, ohne bloßes Wohlgefallen zu behaupten.
- source_word: καταλειφθῆναι
  choice: zurückzubleiben
  rationale: Vermittelt in natürlichem Deutsch das passive Zurückgelassenwerden; die Fußnote nennt die formal näherliegende passive Wiedergabe.
- source_word: ἐν Ἀθήναις
  choice: in Athen
  rationale: Übliche deutsche Ortsangabe für die Stadt Ἀθῆναι.
- source_word: μόνοι
  choice: allein
  rationale: Bewahrt die prädikative Aussage über die im Plural bezeichneten Sprecher und greift der Nennung von Timotheus im Folgevers nicht vor.
theological_decisions:
- issue: Bezug der ersten Person Plural und Spannung zum weiteren historischen Zusammenhang
  choice: Die Pluralformen „wir“ und „allein“ bleiben erhalten.
  alternative: Als brieflichen Plural deuten und mit „ich“ beziehungsweise „allein“ im Singular wiedergeben.
  rationale: εὐδοκήσαμεν und μόνοι stehen im Plural. Die Übersetzung soll die grammatische Form und die historische Auslegungsfrage bewahren, statt sie durch Harmonisierung zu entscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Hauptfassung ist idiomatisch, während die Fußnoten die formalen und lexikalischen Alternativen offenhalten.
