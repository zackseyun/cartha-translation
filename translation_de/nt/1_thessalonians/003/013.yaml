reference: 1 Thessalonians 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: de
  text: damit er eure Herzen festigt, damit sie bei der Ankunft unseres Herrn Jesus mit all seinen Heiligen untadelig in Heiligkeit vor unserem Gott und Vater sind[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Heiligen“ kann hier heilige Menschen, Engel oder beide bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: damit er … fest macht
  rationale: Die Präposition mit substantiviertem Infinitiv bezeichnet hier den Zweck beziehungsweise die beabsichtigte Folge des vorausgehenden Gebets. Ein deutscher Finalsatz gibt dies natürlich wieder.
- source_word: στηρίξαι
  choice: fest macht
  rationale: Das Verb bedeutet stärken, festigen oder standhaft machen. „Fest macht“ ist verständlich und bewahrt das Bild innerer Festigkeit.
- source_word: καρδίας
  choice: Herzen
  rationale: „Herzen“ entspricht dem paulinischen Sprachgebrauch und bezeichnet den inneren Menschen, nicht nur die Gefühle.
- source_word: ἀμέμπτους
  choice: untadelig
  rationale: Das Wort bezeichnet einen Zustand, in dem kein berechtigter Tadel erhoben werden kann. „Untadelig“ ist präzise und würdevoll.
- source_word: ἐν ἁγιωσύνῃ
  choice: in Heiligkeit
  rationale: Die Wendung bezeichnet Heiligkeit als Beschaffenheit oder Lebenszustand und wird formal wie natürlich wiedergegeben.
- source_word: ἔμπροσθεν
  choice: vor
  rationale: „Vor“ bringt knapp zum Ausdruck, dass die Untadeligkeit im Angesicht und Urteil Gottes gilt.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: unserem Gott und Vater
  rationale: Diese Formulierung bewahrt die koordinierte Bezeichnung Gottes und klingt im Deutschen natürlich.
- source_word: παρουσίᾳ
  choice: Ankunft
  rationale: Im eschatologischen Zusammenhang bezeichnet παρουσία das künftige Eintreffen beziehungsweise Kommen des Herrn. „Ankunft“ bewahrt dabei stärker als „Wiederkunft“ den Wortlaut, ohne eine zusätzliche Vorsilbe einzutragen.
- source_word: κυρίου ἡμῶν Ἰησοῦ
  choice: unseres Herrn Jesus
  rationale: Die übliche Wiedergabe bewahrt den christologischen Titel κύριος und den Eigennamen.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: mit allen seinen Heiligen
  rationale: „Heilige“ ist im Deutschen eine natürliche substantivische Wiedergabe von ἅγιοι. Da sie Menschen oder Engel bezeichnen kann, erläutert eine Fußnote die im Kontext verbleibende Mehrdeutigkeit.
theological_decisions:
- issue: Bezug von πάντων τῶν ἁγίων αὐτοῦ
  choice: allen seinen Heiligen
  alternative: allen seinen heiligen Engeln; allen Heiligen aus seinem Volk
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob Engel, geheiligte Menschen oder beide Gruppen gemeint sind. Der Haupttext wahrt diese Offenheit, und die Fußnote macht sie ausdrücklich sichtbar.
- issue: Verhältnis von „fest machen“ und „untadelig“
  choice: „sodass sie untadelig sind“ macht ἀμέμπτους als prädikative Bestimmung der Herzen deutlich
  alternative: „eure untadeligen Herzen fest macht“
  rationale: Die alternative deutsche Wortstellung könnte fälschlich nahelegen, die Herzen seien bereits untadelig. Die gewählte Fassung zeigt Untadeligkeit als Ziel beziehungsweise Ergebnis des Festmachens, ohne die genaue Zweck-Ergebnis-Nuance enger als nötig festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. „Heiligkeit“, „untadelig“ und „Herr“ bleiben wegen ihrer inhaltlichen Präzision erhalten; die Satzstruktur wird gegenüber dem Griechischen leicht entfaltet, um die prädikative Beziehung klar auszudrücken.
