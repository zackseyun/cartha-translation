source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: de
  text: und wir sandten Timotheus, unseren Bruder und Gottes Mitarbeiter[a] im Evangelium des Messias[b], damit er euch stärke und euch im Blick auf euren Glauben ermutige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mitarbeiter mit Gott“. Einige Handschriften bieten hier andere Formulierungen, etwa „Diener Gottes“.'
    reason: alternative_reading
  - marker: b
    text: 'Griechisch: „Christus“; hier als Titel mit „Messias“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: wir sandten
  rationale: Der Aorist wird als schlichtes erzählendes Präteritum wiedergegeben; „sandten“ ist würdig und im biblischen Erzählzusammenhang natürlich.
- source_word: ἀδελφὸν ἡμῶν
  choice: unseren Bruder
  rationale: Bewahrt das familiäre Bild und die Beziehungsnähe des griechischen Ausdrucks, ohne ihn erklärend zu erweitern.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: Gottes Mitarbeiter
  rationale: Gibt den Genitiv knapp und eng am SBLGNT wieder und bewahrt die starke Aussage, ohne sie zu „Diener Gottes“ abzuschwächen oder ausdrücklich als „Mitarbeiter mit Gott“ auszulegen.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: am Evangelium des Messias
  rationale: „Am Evangelium“ bezeichnet im Deutschen idiomatisch den Arbeitsbereich; „des Messias“ bewahrt den Genitiv und lässt offen, ob Herkunft oder Inhalt im Vordergrund steht.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός hat hier in der Verbindung mit „Evangelium“ deutlichen Titelcharakter; „Messias“ macht diesen Sinn im modernen Deutschen transparent.
- source_word: εἰς τὸ στηρίξαι ὑμᾶς
  choice: damit er euch stärkt
  rationale: Die Konstruktion mit εἰς und substantiviertem Infinitiv bezeichnet den Zweck. Der deutsche Finalsatz ist klar und natürlich.
- source_word: παρακαλέσαι
  choice: ermutigt
  rationale: Im Zusammenhang bedrängten Glaubens erfasst „ermutigen“ den unterstützenden pastoralen Sinn, ohne das Wort ausschließlich als Trost oder Ermahnung festzulegen.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: in eurem Glauben
  rationale: Die Formulierung gibt den sachlichen Bezug der Ermutigung idiomatisch wieder. ὑπέρ kann hier auch „im Blick auf“ oder „um ... willen“ bedeuten.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glaube“ ist hier die natürliche Wiedergabe für die vertrauende Glaubenshaltung der Thessalonicher.
theological_decisions:
- issue: Wiedergabe von συνεργὸν τοῦ θεοῦ
  choice: Gottes Mitarbeiter
  alternative: 'Mitarbeiter mit Gott; in abweichender Textüberlieferung: Diener Gottes'
  rationale: Die starke Formulierung des SBLGNT wird bewahrt und nicht aus theologischer Vorsicht abgeschwächt. Die deutsche Genitivform lässt die genaue Relation zu Gott ähnlich knapp stehen wie der griechische Text; die textkritische und syntaktische Alternative wird in der Fußnote genannt.
- issue: Wiedergabe von Χριστοῦ in εὐαγγελίῳ τοῦ Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: An dieser Stelle ist der Titelgehalt von Χριστός deutlich. „Messias“ macht ihn sichtbar, während die traditionelle Wiedergabe „Christus“ beziehungsweise im Genitiv „Christi“ als mögliche Übersetzung vermerkt wird.
- issue: Bezug von ὑπὲρ τῆς πίστεως ὑμῶν
  choice: in eurem Glauben
  alternative: im Blick auf euren Glauben; um eures Glaubens willen
  rationale: Der Zusammenhang zielt auf die Festigung der Gemeinde. Die gewählte Fassung ist idiomatisch, ohne die mögliche Bedeutung von ὑπέρ vollständig auf eine einzige semantische Kategorie festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Briefstil. Das einleitende „und“ wahrt den Satzanschluss. Die Fußnotenmarker [a] und [b] stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
