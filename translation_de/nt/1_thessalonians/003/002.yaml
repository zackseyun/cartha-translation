  terminology: „Timotheus“, „unseren Bruder“, „Gottes Mitarbeiter“, „Evangelium“, „Messias“ und „Glauben“ sind angemessen. „Messias“ gibt den Titelcharakter von Χριστοῦ wieder. Die Fußnotenanker bleiben an den jeweils erläuterten Ausdrücken.
