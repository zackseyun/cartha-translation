source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: de
  text: Denn welchen Dank können wir Gott für euch erstatten für all die Freude, über die wir uns euretwegen vor unserem Gott freuen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: welchen Dank
  rationale: Bewahrt die direkte rhetorische Frage und gibt das abstrakte Substantiv in natürlichem, würdigem Deutsch wieder.
- source_word: δυνάμεθα
  choice: könnten wir
  rationale: Der Konjunktiv entspricht im Deutschen dem rhetorischen Sinn der Frage und betont, dass kein Dank ausreichen kann.
- source_word: ἀνταποδοῦναι
  choice: zurückgeben
  rationale: Bewahrt den Gedanken einer erwidernden Gabe, ohne so stark wie „zurückzahlen“ einen geschäftlichen Vorgang nahezulegen.
- source_word: περὶ ὑμῶν
  choice: für euch
  rationale: Im Zusammenhang des Dankes ist dies modernes, natürliches Deutsch; die folgende kausale Wendung δι’ ὑμᾶς wird unterscheidbar mit „euretwegen“ wiedergegeben.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: für all die Freude
  rationale: Gibt den Grund beziehungsweise Anlass des Dankes idiomatisch wieder.
- source_word: ᾗ χαίρομεν
  choice: mit der wir uns … freuen
  rationale: Erhält die bewusste Wortwiederholung von χαρά und χαίρω als „Freude“ und „freuen“.
- source_word: δι’ ὑμᾶς
  choice: euretwegen
  rationale: Gibt διά mit Akkusativ klar kausal wieder und unterscheidet die Wendung von περὶ ὑμῶν.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: vor unserem Gott
  rationale: Bewahrt das knappe räumliche Bild für das Leben und die Freude in Gottes Gegenwart.
theological_decisions:
- issue: Bild des erwiderten Dankes gegenüber Gott
  choice: „Dank … zurückgeben“ als rhetorisches Bild beibehalten
  alternative: „Wie könnten wir Gott genug für euch danken?“
  rationale: ἀνταποδοῦναι bezeichnet ausdrücklich ein Erwidern oder Zurückgeben. Die rhetorische Frage macht deutlich, dass Paulus keine geschäftliche Vergeltung meint, sondern die Unzulänglichkeit jedes möglichen Dankes hervorhebt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die ungewöhnliche Dank-Metapher und die Wortwiederholung „Freude … freuen“ bleiben bewusst erhalten; der Gedankenstrich gliedert die lange rhetorische Frage.
