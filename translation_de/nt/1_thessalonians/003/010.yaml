translation:
  language: de
  text: Tag und Nacht beten wir überaus inständig darum, euch persönlich zu sehen und das zu ergänzen, was eurem Glauben noch fehlt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was in eurem Glauben noch fehlt“. Das Griechische kann umfassender das bezeichnen, was an ihrem Glauben noch gestärkt, geordnet oder vervollständigt werden muss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Tag und Nacht
  rationale: Die adverbial gebrauchten Genitive bezeichnen wiederholtes beziehungsweise anhaltendes Handeln. „Tag und Nacht“ ist im modernen Deutschen die natürliche feste Wendung.
- source_word: ὑπερεκπερισσοῦ
  choice: überaus inständig
  rationale: Das seltene, stark intensivierende Adverb wird durch „überaus“ wiedergegeben; zusammen mit „inständig“ im Gebetsausdruck bleibt seine außergewöhnliche Nachdrücklichkeit hörbar.
- source_word: δεόμενοι
  choice: beten wir … inständig darum
  rationale: Das Partizip bezeichnet eine eindringliche Bitte. Die finite Form ergibt im Deutschen einen klaren Satz; „inständig darum beten“ wahrt den bittenden Charakter.
- source_word: εἰς τὸ ἰδεῖν
  choice: euch … zu sehen
  rationale: Die Konstruktion mit εἰς und substantiviertem Infinitiv drückt hier das Ziel der Bitte aus und lässt sich natürlich mit „darum … zu“ wiedergeben.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: euch von Angesicht zu sehen
  rationale: Die konkrete Wendung mit πρόσωπον bezeichnet eine persönliche Begegnung. Diese Formulierung bewahrt das Bild des Angesichts, ohne im Deutschen unnatürlich „euer Gesicht“ zu sagen.
- source_word: καταρτίσαι
  choice: zu ergänzen
  rationale: Das Verb kann ordnen, ausrüsten, wiederherstellen oder vervollständigen bedeuten. In Verbindung mit dem Fehlenden bezeichnet „ergänzen“ das Beheben eines Mangels, ohne eine bestimmte Art dieser Hilfe festzulegen.
- source_word: τὰ ὑστερήματα
  choice: was … noch fehlt
  rationale: Der griechische Plural bezeichnet vorhandene Mängel oder Fehlendes. Die kollektive deutsche Wendung ist idiomatisch und „noch“ bringt den Gedanken ausstehender Reifung zum Ausdruck, ohne Glaubenslosigkeit zu unterstellen.
- source_word: τῆς πίστεως ὑμῶν
  choice: eurem Glauben
  rationale: Der Genitiv bezeichnet den Bereich, in dem noch etwas fehlt. „Glaube“ ist hier die naheliegende Wiedergabe von πίστις und lässt sowohl Vertrauen als auch den gelebten Glauben mitschwingen.
theological_decisions:
- issue: Wiedergabe von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Im Zusammenhang ist der Glaube der Thessalonicher gemeint, der weiterer Stärkung beziehungsweise Vervollständigung bedarf. „Glaube“ hält den Begriff weit und legt ihn nicht einseitig auf Verhalten („Treue“) oder eine rein innere Haltung („Vertrauen“) fest.
- issue: Art des Mangels im Glauben
  choice: was eurem Glauben noch fehlt
  alternative: die Mängel eures Glaubens; was an eurem Glauben noch zu stärken oder zu vollenden ist
  rationale: Der Text spricht von ὑστερήματα, ohne den konkreten Mangel zu benennen. Die gewählte Formulierung bewahrt diese Offenheit und behauptet weder, ihr Glaube sei unecht, noch bestimmt sie vorab, ob Lehre, Erkenntnis oder Praxis gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von Angesicht zu sehen“ bewahrt das konkrete griechische Bild in einer verständlichen deutschen Form. Die starke Intensität des Gebets wird mit „überaus inständig“ erhalten; die Satzstruktur wird gegenüber dem griechischen Partizip für einen selbstständig lesbaren deutschen Vers finit gestaltet.
