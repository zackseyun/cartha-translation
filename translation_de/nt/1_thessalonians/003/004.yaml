id: 1TH.3.4
reference: 1 Thessalonians 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: de
  text: Denn schon als wir bei euch waren, sagten wir euch immer wieder voraus, dass wir Bedrängnis erleiden würden[a]. Genauso ist es auch gekommen, und ihr wisst es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bedrängt werden würden“ beziehungsweise „Not erleiden würden“. Das griechische Verb kann Erfahrungen von Druck, Bedrängnis, Leid oder Verfolgung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn schon
  rationale: γάρ stellt die Begründung zum vorherigen Gedanken her; καί hebt hervor, dass die Ankündigung bereits während des Aufenthalts erfolgte. „Denn schon“ gibt beides im Deutschen natürlich wieder.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: als wir bei euch waren
  rationale: Die Wendung bezeichnet den Aufenthalt in der Gegenwart der Adressaten. „Bei euch“ ist idiomatisches, modernes Deutsch.
- source_word: προελέγομεν
  choice: sagten wir euch immer wieder voraus
  rationale: Der Imperfekt lässt eine wiederholte oder fortdauernde Mitteilung erkennen; προλέγω bedeutet, etwas im Voraus zu sagen, ohne notwendig den stärkeren Sinn von „warnen“ anzunehmen.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: dass wir Bedrängnis erleiden würden
  rationale: μέλλομεν bezeichnet das damals bevorstehende Geschehen; in abhängiger Rede gibt „würden“ dies natürlich wieder. „Bedrängnis erleiden“ wahrt die Breite des passiven θλίβεσθαι.
- source_word: θλίβεσθαι
  choice: Bedrängnis erleiden
  rationale: Die Form kann Druck, Not, Anfeindung oder Verfolgung bezeichnen. Die gewählte Formulierung bleibt bewusst allgemein und bewahrt zugleich den Zusammenhang mit θλῖψις in Vers 3.
- source_word: καθὼς καὶ ἐγένετο
  choice: Genauso ist es auch gekommen
  rationale: καθώς bezeichnet die genaue Entsprechung zwischen Ankündigung und Eintritt; καί wird mit „auch“ wiedergegeben.
- source_word: καὶ οἴδατε
  choice: und ihr wisst es
  rationale: Das im Griechischen unausgesprochene Objekt bezieht sich auf das gerade erwähnte Eintreffen und wird im Deutschen zur natürlichen Verständlichkeit mit „es“ ausgedrückt.
theological_decisions:
- issue: Art der mit θλίβεσθαι bezeichneten Leiden
  choice: allgemeine Bedrängnis, die Anfeindung und Verfolgung einschließen kann
  alternative: ausschließlich konkrete Verfolgung oder eine technisch-eschatologische „Drangsal“
  rationale: Der Kontext legt Widerstand und Leiden nahe, doch das Verb selbst legt weder ausschließlich Verfolgung noch einen besonderen endzeitlichen Fachbegriff fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Immer wieder“ bildet den durativen beziehungsweise iterativen Aspekt des Imperfekts verständlich ab; „Bedrängnis“ bewahrt die begriffliche Verbindung zum unmittelbaren Kontext, ohne das Leiden konfessionell oder endzeitlich zu verengen.
