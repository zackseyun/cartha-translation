  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: de
  text: Darum hielt auch ich es nicht länger aus und schickte jemanden, um zu erfahren, wie es um euren Glauben[a] stand, aus Furcht, der Versucher könnte euch versucht haben und unsere Mühe könnte vergeblich werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euer Vertrauen“ beziehungsweise „eure Treue“. Das griechische Wort kann je nach Zusammenhang einander überschneidende Bedeutungen haben.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „und unsere Mühe vergeblich werden würde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den rückbezüglichen Folgerungszusammenhang knapp und natürlich wieder.
- source_word: κἀγὼ
  choice: auch ich
  rationale: Macht das in κἀγώ enthaltene καί sichtbar, ohne die Aussage übermäßig zu betonen.
- source_word: μηκέτι στέγων
  choice: hielt ... es nicht länger aus
  rationale: Natürliche deutsche Wiedergabe dafür, dass Paulus die belastende Ungewissheit nicht länger ertragen konnte.
- source_word: ἔπεμψα
  choice: schickte jemanden
  rationale: Im Deutschen verlangt das absolute „schicken“ gewöhnlich eine Ergänzung. „Jemanden“ wahrt, dass der in Vers 2 genannte Timotheus hier im griechischen Satz nicht ausdrücklich wiederholt wird.
- source_word: εἰς τὸ γνῶναι
  choice: um zu erfahren, wie es um ... stand
  rationale: Gibt den finalen Infinitiv und den erkundigenden Sinn idiomatisch wieder.
- source_word: τὴν πίστιν ὑμῶν
  choice: euren Glauben
  rationale: Im Kontext ist primär der fortbestehende Glaube der Thessalonicher gemeint; mögliche Nuancen von Vertrauen und Treue werden in der Fußnote bewahrt.
- source_word: μή πως
  choice: Denn ich fürchtete
  rationale: Drückt die besorgte Befürchtung der griechischen Konstruktion im Deutschen klar aus, ohne sie als feststehende Tatsache darzustellen.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: der Versucher könnte euch versucht haben
  rationale: Bewahrt die Wortwiederholung zwischen Partizip und Verb sowie die Unsicherheit der Befürchtung.
- source_word: εἰς κενὸν γένηται
  choice: wäre vergeblich gewesen
  rationale: „Vergeblich“ ist die natürliche deutsche Entsprechung für das wirkungslose oder zwecklose Ergebnis; die vollendete Form passt zur befürchteten Folge einer bereits erfolgten Versuchung.
- source_word: ὁ κόπος ἡμῶν
  choice: unsere Mühe
  rationale: „Mühe“ vermittelt die mit κόπος verbundene anstrengende Arbeit idiomatisch und würdig.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Vertrauen oder Treue
  rationale: „Glaube“ bezeichnet hier am natürlichsten das fortdauernde gläubige Festhalten an der Botschaft. Die semantisch möglichen Nuancen bleiben in einer Fußnote sichtbar.
- issue: Zeit- und Modalbezug der Versuchung
  choice: könnte euch versucht haben
  alternative: hat euch vielleicht versucht
  rationale: Die Form ἐπείρασεν steht in einer von μή πως eingeleiteten Befürchtung und darf daher nicht als behauptete Tatsache erscheinen.
- issue: Mögliche Vergeblichkeit apostolischer Arbeit
  choice: unsere Mühe wäre vergeblich gewesen
  alternative: unsere Mühe könnte vergeblich werden
  rationale: Die Aussage bewahrt Paulus’ reale Sorge vor einem erfolglosen Ausgang, ohne eine endgültige theologische Aussage über den tatsächlichen Wert seiner Arbeit zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der lange griechische Satz wird zur Klarheit in zwei deutsche Sätze gegliedert. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
