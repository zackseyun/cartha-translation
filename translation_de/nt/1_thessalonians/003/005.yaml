  rationale: Die Revision korrigiert die unzutreffende abgeschlossene Vergangenheitsform bei der möglichen Vergeblichkeit der apostolischen Mühe. Sie erhält zugleich die Unsicherheit der Befürchtung („könnte euch versucht haben“) sowie die im Griechischen eng verbundene Folge. Die Fußnotenanker und die lexikalische Erläuterung werden entsprechend angepasst.
