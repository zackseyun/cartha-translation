  terminology: „Glaube“, „Versucher“ und „Mühe“ sind angemessene, registergerechte Wiedergaben von πίστις, ὁ πειράζων und κόπος. Die Fußnote zu πίστις bewahrt mögliche Bedeutungsnuancen ohne sie im Haupttext vorzuziehen.
