  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: de
  text: Unser Gott und Vater selbst und unser Herr Jesus mögen aber unseren Weg zu euch ebnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht das Verb „ebnen“ in der Einzahl, obwohl „unser Gott und Vater“ und „unser Herr Jesus“ gemeinsam als Subjekte genannt werden. Auch möglich: „unseren Weg zu euch gerade machen“ oder „unseren Weg zu euch lenken“.'
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: Er selbst
  rationale: Das intensive αὐτός hebt Gott persönlich hervor; „Er selbst“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen Übergang zum Gebetswunsch. „Aber“ bewahrt die leichte weiterführende beziehungsweise kontrastierende Funktion, ohne einen zeitlichen Sinn einzutragen.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: unser Gott und Vater
  rationale: Die beiden Bezeichnungen beziehen sich auf dieselbe Person; die griechische Verbindung und Reihenfolge bleiben erhalten.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: unser Herr Jesus
  rationale: Die Anrede gibt κύριος, das Possessivpronomen und den Namen vollständig und ohne Ergänzung wieder.
- source_word: κατευθύναι
  choice: mögen … ebnen
  rationale: Der Aorist Optativ drückt einen Wunsch beziehungsweise ein Gebet aus. „Den Weg ebnen“ erfasst sowohl das Gerademachen als auch das Ermöglichen der Reise.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: unseren Weg
  rationale: ὁδός bezeichnet hier den Weg beziehungsweise die Reisemöglichkeit zu den Adressaten; „unseren Weg“ bewahrt die bildhafte und konkrete Weite.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: πρός mit Akkusativ bezeichnet die Richtung auf die Gemeinde hin; „zu euch“ ist im Reisekontext idiomatisch.
theological_decisions:
- issue: Singularisches Verb bei den verbundenen Subjekten „unser Gott und Vater“ und „unser Herr Jesus“
  choice: Beide Subjekte werden ausdrücklich beibehalten; die deutsche Verbform steht notwendigerweise im Plural.
  alternative: Den Satz so umzuformen, dass nur Gott als grammatisches Subjekt erscheint, oder die auffällige Konstruktion in einer Fußnote ausführlich zu deuten.
  rationale: Der griechische Text verbindet den Vater und Jesus als Subjekte eines einzigen singularischen Optativs. Da idiomatisches Deutsch bei zwei verbundenen Subjekten den Plural verlangt, weist eine Fußnote auf die genuine grammatische Besonderheit hin, ohne ihre theologische Tragweite über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Er selbst aber“ bewahrt die Hervorhebung und den Übergang des griechischen Textes. Das idiomatische „den Weg ebnen“ vermittelt den Gebetswunsch klar; die Fußnote hält sowohl die auffällige Numeruskonstruktion als auch die wörtlichere Wegmetaphorik präsent.
