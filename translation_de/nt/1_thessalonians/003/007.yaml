id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: de
  text: Darum wurden wir, Geschwister[a], im Blick auf euch in all unserer Not und Bedrängnis durch euren Glauben[b] getröstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“. Die griechische Anrede kann hier die gesamte Glaubensgemeinschaft umfassen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „eure Treue“ beziehungsweise „eure Glaubenstreue“. Das griechische Wort kann Glaube, Vertrauen oder Treue bezeichnen; hier schwingt wahrscheinlich das standhafte Festhalten am Glauben mit.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die knappe Folgerungsformel stellt den natürlichen Rückbezug auf Timotheus’ zuvor erwähnten Bericht her.
- source_word: παρεκλήθημεν
  choice: wurden wir … getröstet
  rationale: Im Zusammenhang mit Not und Bedrängnis bezeichnet das Passiv die durch die Nachricht empfangene Tröstung und Ermutigung; „getröstet“ bringt hier die emotionale Entlastung am klarsten zum Ausdruck.
- source_word: ἀδελφοί
  choice: Geschwister
  rationale: Die Anrede bezeichnet im paulinischen Sprachgebrauch die Glaubensgemeinschaft als familiär verbundene Gruppe. „Geschwister“ gibt diesen gemeinschaftlichen Sinn im heutigen Deutsch natürlich wieder; die grammatisch maskuline griechische Form wird in der Fußnote kenntlich gemacht.
- source_word: ἐφ’ ὑμῖν
  choice: im Blick auf euch
  rationale: Die Wendung nennt die Personen, auf die sich der Trost bezieht. Diese Wiedergabe vermeidet das mögliche Missverständnis, die Thessalonicher hätten die Not verursacht.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: in all unserer Not und Bedrängnis
  rationale: Die Präpositionalphrase bezeichnet die belastenden Umstände. Die beiden Substantive bleiben als eng verwandte, aber unterscheidbare Leidensbegriffe erhalten.
- source_word: ἀνάγκῃ
  choice: Not
  rationale: Im Leidenszusammenhang meint ἀνάγκη bedrängende Notlage, nicht bloß abstrakte Notwendigkeit.
- source_word: θλίψει
  choice: Bedrängnis
  rationale: „Bedrängnis“ bewahrt das Bild von Druck und schwerer Belastung, das θλῖψις trägt, ohne altertümlich zu wirken.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: durch euren Glauben
  rationale: διά mit Genitiv bezeichnet hier das Mittel, durch das Paulus und seine Mitarbeiter getröstet wurden. Die Formulierung bildet diese instrumentale Nuance direkt ab.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glaube“ ist die naheliegende Wiedergabe von πίστις; im Kontext des standhaften Festhaltens kann zugleich „Treue“ mitschwingen, was die Fußnote bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von πίστις angesichts der Standhaftigkeit der Thessalonicher
  choice: Glauben
  alternative: Treue beziehungsweise Glaubenstreue
  rationale: Der Text spricht von ihrem fortdauernden Vertrauen, das sich zugleich als Standhaftigkeit zeigt. Der Haupttext wahrt die übliche Bedeutung „Glaube“, während die mögliche Nuance der Treue nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt wird.
- issue: Adressatenumfang von ἀδελφοί
  choice: Geschwister
  alternative: Brüder
  rationale: Die formal maskuline Anrede kann im gemeindlichen Gebrauch die gesamte Glaubensgemeinschaft einschließen. „Geschwister“ gibt diese kommunikative Funktion idiomatisch wieder; die Form des Ausgangstextes bleibt durch die Fußnote transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut lesbar und ordnet „im Blick auf euch“ eindeutig dem empfangenen Trost zu, nicht der Not. Die beiden Leidensbegriffe sowie die instrumentale Wendung „durch euren Glauben“ werden bewahrt.
