id: 1TH.3.3
reference: 1 Thessalonians 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: de
  text: damit niemand durch diese Bedrängnisse[b] erschüttert wird[a]. Denn ihr wisst selbst, dass wir dazu bestimmt sind[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »beunruhigt« oder »verunsichert«. Das seltene Verb kann in anderen Zusammenhängen auch »getäuscht« oder »durch Schmeichelei gewonnen« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Oder »Nöte«; traditionell »Trübsale«.
    reason: lexical_alternative
  - marker: c
    text: Oder »dazu eingesetzt sind« oder »dafür vorgesehen sind«.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: damit niemand … erschüttert wird
  rationale: Der substantivierte Infinitiv führt im Zusammenhang mit dem vorherigen Vers einen Zweck beziehungsweise ein Ergebnis aus. Das seltene σαίνεσθαι bezeichnet hier am ehesten ein Erschüttert- oder Verunsichertwerden; die passive Form bleibt erhalten.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: durch diese Bedrängnisse
  rationale: θλῖψις bezeichnet bedrückende Not, Bedrängnis oder Trübsal. Bei »erschüttert werden« gibt »durch« die naheliegende instrumentale beziehungsweise ursächliche Bedeutung von ἐν idiomatisch wieder.
- source_word: αὐτοὶ
  choice: ihr … selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist betont; »ihr wisst selbst« bewahrt diese Hervorhebung.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ leitet die Begründung für die vorausgehende Aussage ein.
- source_word: οἴδατε
  choice: wisst
  rationale: οἶδα hat trotz seiner Perfektform präsentische Bedeutung.
- source_word: εἰς τοῦτο
  choice: dazu
  rationale: Die Wendung verweist knapp auf die eben genannten Bedrängnisse, ohne einen weitergehenden Zweck ausdrücklich festzulegen.
- source_word: κείμεθα
  choice: wir … bestimmt sind
  rationale: κεῖμαι bedeutet wörtlich »liegen« beziehungsweise »gesetzt sein« und bezeichnet in dieser Verbindung ein Bestimmt- oder Vorgesehensein. Die Übersetzung wahrt den passiven und gewichtigen Charakter der Aussage.
theological_decisions:
- issue: Verhältnis der Glaubenden zum Leiden in εἰς τοῦτο κείμεθα
  choice: dass wir dazu bestimmt sind
  alternative: dass wir dazu eingesetzt sind; dass dies für uns vorgesehen ist
  rationale: Die Formulierung stellt Bedrängnisse als zum Weg der Glaubenden gehörig dar, legt aber weder den Handelnden ausdrücklich fest noch entfaltet sie eine bestimmte Prädestinationslehre. »Bestimmt« bewahrt das theologische Gewicht und die Offenheit des Passivs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Bedrängnisse« bewahrt das Gewicht des paulinischen Ausdrucks, während die Satzführung natürlich und allgemein verständlich bleibt.
