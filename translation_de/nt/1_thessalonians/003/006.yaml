  to: Jetzt aber ist Timotheus von euch zu uns gekommen und hat uns die gute Nachricht von eurem Glauben[a] und eurer Liebe gebracht und berichtet, dass ihr uns stets in guter Erinnerung habt und euch danach sehnt, uns zu sehen, genauso wie auch wir uns danach sehnen, euch zu sehen.
