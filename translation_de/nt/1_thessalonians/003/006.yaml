source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: de
  text: Jetzt aber ist Timotheus von euch zu uns gekommen und hat uns die gute Nachricht von eurem Glauben[a] und eurer Liebe gebracht und berichtet, dass ihr uns stets in guter Erinnerung habt und euch danach sehnt, uns zu sehen, genauso wie auch wir uns danach sehnen, euch zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eurer Treue“. Das griechische Wort kann Glaube, Vertrauen oder Treue bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Jetzt aber
  rationale: Gibt sowohl den aktuellen Zeitpunkt als auch den milden Kontrast zur vorausgehenden Sorge natürlich wieder.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: ist Timotheus von euch zu uns zurückgekommen
  rationale: Der Genitivus absolutus wird als idiomatischer deutscher Hauptsatz wiedergegeben. „Zurückgekommen“ verdeutlicht aus dem Zusammenhang die Rückkehr von seiner Sendung, ohne den Sinn zu verändern.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: hat uns die gute Nachricht … gebracht
  rationale: Im Kontext bezeichnet das Verb Timotheus’ erfreulichen Bericht; „gute Nachricht“ bewahrt zugleich den Anklang an die Verkündigungssprache.
- source_word: τὴν πίστιν
  choice: euren Glauben
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe für das fortbestehende Vertrauen der Thessalonicher; die mögliche Nuance „Treue“ wird in einer Fußnote erhalten.
- source_word: τὴν ἀγάπην
  choice: eure Liebe
  rationale: Direkte und im Deutschen etablierte Wiedergabe von ἀγάπη.
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: uns stets in guter Erinnerung habt
  rationale: Natürliche deutsche Formulierung, die den positiven Charakter ihres Gedenkens an Paulus und seine Mitarbeiter bewahrt.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: euch danach sehnt, uns zu sehen
  rationale: „Sich sehnen“ gibt die starke, herzliche Wunschkomponente des Verbs wieder.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: genauso wie auch wir euch sehen möchten
  rationale: Das im Griechischen ausgelassene Verb wird für klares Deutsch sinngemäß ergänzt; die Gegenseitigkeit bleibt erhalten.
theological_decisions:
- issue: Bedeutung von πίστις zwischen Glaube und Treue
  choice: eurem Glauben
  alternative: eurer Treue
  rationale: Der Zusammenhang spricht vorrangig von ihrem fortbestehenden Glauben; zugleich kann πίστις auch Treue oder Zuverlässigkeit bezeichnen. Diese echte Bedeutungsbreite wird durch die Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die logischen Beziehungen und die herzliche Gegenseitigkeit wurden bewahrt.
