  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: de
  text: Der Herr aber lasse eure Liebe zueinander und zu allen[a] zunehmen und überreich werden, wie auch wir euch lieben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „füreinander und für alle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil ist im Griechischen verkürzt, wörtlich: „so wie auch wir zu euch“. Der ergänzte Gedanke bezieht sich auf die Liebe im vorhergehenden Satzteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμᾶς δὲ ὁ κύριος
  choice: Der Herr aber lasse euch
  rationale: δέ verbindet den Gebetswunsch mit dem vorherigen Zusammenhang und kann im Deutschen passend mit „aber“ wiedergegeben werden. Der Optativ in der Wunschform wird mit „lasse“ ausgedrückt; „der Herr“ bewahrt den Titel κύριος ohne nähere Festlegung des Referenten.
- source_word: πλεονάσαι
  choice: wachsen
  rationale: Das Verb bezeichnet Zunahme. In Verbindung mit „lasse euch“ bleibt die vom Herrn bewirkte Steigerung erkennbar.
- source_word: καὶ περισσεύσαι
  choice: und überreich werden
  rationale: Die Wiedergabe hält das zweite, verstärkende Verb neben πλεονάσαι eigenständig fest und vermittelt den Gedanken einer Fülle, die über ein bloßes Wachsen hinausgeht.
- source_word: τῇ ἀγάπῃ
  choice: in der Liebe
  rationale: Der Dativ bezeichnet den Bereich beziehungsweise die Hinsicht, in der das Wachsen und Überreichwerden geschieht.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: zueinander und zu allen
  rationale: „Zu“ bewahrt die gerichtete Bedeutung von εἰς und klingt mit „Liebe“ im Deutschen natürlich. „Alle“ bleibt bewusst offen und wird weder auf Gläubige beschränkt noch ausdrücklich als alle Menschen gedeutet.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: so wie auch wir euch gegenüber
  rationale: Die griechische Schlusswendung ist elliptisch. Die deutsche Fassung erhält diese Ellipse, bleibt aber durch „euch gegenüber“ verständlich und vermeidet, ein nicht ausdrücklich wiederholtes Verb einzusetzen.
theological_decisions:
- issue: Referent von ὁ κύριος
  choice: „der Herr“ ohne ausdrückliche Identifizierung
  alternative: ausdrückliche Identifizierung mit Christus oder allgemein mit Gott
  rationale: Der Titel wird so wiedergegeben, wie er im Vers steht. Eine nähere Bestimmung würde eine kontextuelle Deutung in den Wortlaut eintragen.
- issue: Umfang von πάντας
  choice: „alle“ bleibt uneingeschränkt und unbestimmt
  alternative: „alle Menschen“ oder „alle Gläubigen“
  rationale: Der griechische Ausdruck ist weit, benennt die gemeinte Gruppe aber nicht näher. Die Übersetzung wahrt diese Offenheit.
- issue: Ellipse im Schlusssatz
  choice: Die Ellipse wird in verständlichem Deutsch beibehalten
  alternative: „so wie auch wir euch lieben“ oder „so wie auch unsere Liebe zu euch überreich ist“
  rationale: Die Ergänzungen sind sinngemäß möglich, würden jedoch den grammatisch unausgesprochenen Inhalt stärker festlegen als der griechische Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebets- und Wunschform wird mit „lasse“ wiedergegeben. Die beiden Steigerungsverben bleiben unterscheidbar; die ungewöhnliche, aber verständliche Schlussellipse folgt bewusst der knappen Form des griechischen Textes.
