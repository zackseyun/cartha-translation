  source_fidelity: Der Gebetswunsch mit dem Herrn als Subjekt, die doppelte Steigerung und die offene Reichweite „zu allen“ sind grundsätzlich zutreffend wiedergegeben. Die deutsche Schlussellipse „so wie auch wir euch gegenüber“ ist jedoch kein tragfähiger vollständiger Satz und lässt den Vergleich in unnatürlicher Weise offen. Die unmittelbare griechische Ellipse bezieht sich erkennbar auf die Liebe; „wie auch wir euch lieben“ gibt dies ohne zusätzliche theologische Festlegung wieder.
  naturalness: „Überreich werden“ ist in Verbindung mit Personen und „in der Liebe“ weniger idiomatisch. Die Formulierung „eure Liebe ... zunehmen und überreich werden“ ist modernes, klares Standarddeutsch. Der ergänzte Schlusssatz ist gegenüber der unvollständigen deutschen Ellipse wesentlich natürlicher.
  terminology: „Der Herr“ wahrt κύριος als Titel. „Liebe“, „zueinander“ und „zu allen“ sind angemessen; „alle“ bleibt wie πάντας bewusst offen. Die Formulierung vermeidet eine Festlegung des Referenten von „Herr“ und der Gruppe „aller“.
