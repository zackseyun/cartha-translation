revisions:
- from: Der Herr aber lasse euch in der Liebe zueinander und zu allen[a] wachsen und überreich werden, so wie auch wir euch gegenüber[b].
  to: Der Herr aber lasse eure Liebe zueinander und zu allen[a] zunehmen und überreich werden, wie auch wir euch lieben[b].
  rationale: Die Revision macht die doppelte Steigerung idiomatisch, indem sie die Liebe als dasjenige nennt, was zunehmen und überreich werden soll. Der griechische Gedanke bleibt erhalten. Im Schlusssatz wird die im Griechischen vorhandene Ellipse mit dem aus dem Kontext eindeutig erschließbaren „lieben“ ergänzt, weil eine entsprechende bloße Ellipse im Deutschen ungrammatisch und unnatürlich wäre.
