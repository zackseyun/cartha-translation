source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: de
  text: Denn viele Verführer sind in die Welt hinausgegangen, die Jesus, den Messias, der im Fleisch kommt, nicht bekennen.[a] Ein solcher ist der Verführer und der Antichrist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus, den Messias, der im Fleisch gekommen ist“. Im Griechischen steht wörtlich „kommend im Fleisch“; das Präsenspartizip kann formal präsentisch verstanden werden, wird im Zusammenhang jedoch auch auf Jesu geschichtliches Kommen bezogen.'
    reason: Das präsentische Partizip ἐρχόμενον verdient eine transparente Wiedergabe; die im Deutschen und in der Auslegung verbreitete vergangenheitsbezogene Auffassung wird als Alternative angegeben, ohne die griechische Form zu ersetzen.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Mahnung und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: πολλοὶ πλάνοι
  choice: viele Verführer
  rationale: πλάνοι bezeichnet hier Menschen, die andere irreführen; „Verführer“ bewahrt zudem den Bezug zur singularischen Wiederaufnahme.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: sind in die Welt hinausgegangen
  rationale: Die Formulierung gibt den Aorist und die öffentliche Ausbreitung wieder, ohne κόσμος über die konkrete Aussage hinaus auszudeuten.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: Menschen, die nicht bekennen
  rationale: Das substantivierte Partizip bezeichnet die betreffende Personengruppe; „bekennen“ bewahrt den öffentlichen und inhaltlich bestimmten Sinn von ὁμολογέω.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus der Messias
  rationale: Χριστός hat in dieser Bekenntnisaussage deutlich Titelfunktion; im Deutschen ist „Jesus der Messias“ idiomatisch.
- source_word: ἐρχόμενον ἐν σαρκί
  choice: im Fleisch kommt
  rationale: Der deutsche Präsensausdruck bewahrt das griechische Präsenspartizip und die Inkarnationsformel, ohne sie stillschweigend in eine abgeschlossene Vergangenheitsaussage umzuwandeln.
- source_word: οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος
  choice: Wer so handelt, ist der Verführer und der Antichrist
  rationale: Die singularische Aussage individualisiert jeden Menschen aus der zuvor genannten Gruppe. „Wer so handelt“ macht diesen Bezug im Deutschen verständlich, ohne eine bestimmte Einzelperson festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Im Inhalt des Bekenntnisses tritt die Titelfunktion hervor. „Messias“ macht sie sichtbar, während „Christus“ im Deutschen leicht wie ein Namensbestandteil wirkt.
- issue: Zeitliche Aussage von ἐρχόμενον ἐν σαρκί
  choice: im Fleisch kommt
  alternative: im Fleisch gekommen ist
  rationale: Das Präsenspartizip lautet wörtlich „kommend“. Die Hauptfassung erhält diese Form und die damit verbundene Spannung; die verbreitete vergangenheitsbezogene Deutung wird in der Fußnote genannt.
- issue: Bedeutung von σάρξ
  choice: Fleisch im Sinn wirklicher menschlicher Leiblichkeit
  alternative: menschliche Natur
  rationale: Im christologischen Zusammenhang bezeichnet σάρξ die reale menschliche Existenz und nicht eine sündige Natur. „Im Fleisch“ bewahrt zugleich die markante johanneische Formulierung.
- issue: Referenz des singularischen οὗτος
  choice: jeder so gekennzeichnete Mensch
  alternative: dies bzw. diese Lehre als abstraktes Phänomen
  rationale: Der Singular greift die pluralisch beschriebene Gruppe typisierend auf. Die Formulierung „Wer so handelt“ bewahrt den Personenbezug, ohne unnötig eine einzelne historische Gestalt zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht deutlich, dass die folgende Gruppe die zuvor genannten Verführer näher bestimmt. Die Wendung „im Fleisch“ bleibt wegen ihrer theologischen und johanneischen Prägnanz erhalten.
