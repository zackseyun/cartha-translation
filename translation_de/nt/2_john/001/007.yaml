  terminology: „Messias“, „im Fleisch“, „Verführer“ und „Antichrist“ sind angemessen. „Im Fleisch“ sollte als prägnante johanneische Wendung beibehalten werden. Die Fußnote soll die formal präsentische Lesart nicht als bloßes Zitatfragment gegenüber einer alternativen Vergangenheitslesart ausspielen, sondern die grammatische und auslegungsgeschichtliche Spannung knapp benennen.
