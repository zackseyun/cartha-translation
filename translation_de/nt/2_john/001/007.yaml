  source_fidelity: 'Die Hauptaussage ist weitgehend zutreffend: πλάνοι wird angemessen als „Verführer“ wiedergegeben, ἐξῆλθον εἰς τὸν κόσμον als abgeschlossene Ausbreitung in die Welt, und die Schlussaussage bewahrt die singuläre, typisierende Bezugnahme. Die Formulierung „dass Jesus der Messias im Fleisch kommt“ bildet jedoch die griechische Konstruktion nur unklar ab: Sie lässt „Jesus der Messias“ im Deutschen wie das Subjekt von „kommt“ erscheinen, statt Jesus als den Gegenstand des Bekenntnisses mit dem ihn kennzeichnenden Partizip darzustellen. „Jesus, den Messias, der im Fleisch kommt“ stellt diese syntaktische Beziehung klarer dar und hält die präsentische Form bei.'
