  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: de
  text: Es grüßen dich die Kinder deiner auserwählten Schwester.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί σε
  choice: Es grüßen dich
  rationale: Gibt die Grußformel im natürlichen deutschen Satzbau wieder; das griechische Verb steht trotz des sächlichen Pluralsubjekts im Singular, während im Deutschen der Plural erforderlich ist.
- source_word: τὰ τέκνα
  choice: die Kinder
  rationale: Die direkte und kontextgemäße Entsprechung von τέκνα.
- source_word: τῆς ἀδελφῆς σου τῆς ἐκλεκτῆς
  choice: deiner auserwählten Schwester
  rationale: Bewahrt die attributive Beziehung und gibt ἐκλεκτή mit dem im biblischen Sprachgebrauch etablierten, würdevollen Ausdruck „auserwählt“ wieder.
theological_decisions:
- issue: Bezeichnet „Schwester“ eine leibliche Schwester oder eine Gemeinde?
  choice: Die bildhafte beziehungsweise personale Offenheit bleibt durch die wörtliche Formulierung „deiner auserwählten Schwester“ erhalten.
  alternative: Eine ausdrückliche Deutung als „Schwestergemeinde“.
  rationale: Der griechische Text entscheidet die Referenz nicht ausdrücklich; eine interpretierende Auflösung würde die genuine Mehrdeutigkeit beseitigen.
- issue: Bedeutung von ἐκλεκτή
  choice: auserwählt
  alternative: ausgewählt / erwählt
  rationale: „Auserwählt“ trägt den möglichen theologischen Beiklang, ohne festzulegen, ob das Wort hier Titel, geistliche Charakterisierung oder einfache Auswahl bezeichnet.
translation_notes:
  register: Kurzer, natürlicher und würdevoller Schlussgruß in modernem Standarddeutsch. Keine Fußnoten nötig; die mögliche metaphorische Bedeutung von „Schwester“ bleibt im Haupttext bewusst offen.
