id: 2JN.1.8
reference: 2 John 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: de
  text: Gebt auf euch selbst acht, damit ihr nicht verliert, was wir erarbeitet haben,[a] sondern den vollen Lohn empfangt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben hier: „was ihr erarbeitet habt“ statt: „was wir erarbeitet haben“.'
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Gebt auf euch selbst acht
  rationale: Der Präsensimperativ im Plural fordert zu anhaltender Wachsamkeit auf. Die Wendung ist im modernen Deutschen natürlich und gibt sowohl den Warncharakter von βλέπετε als auch den reflexiven Bezug von ἑαυτούς wieder.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: damit ihr nicht verliert
  rationale: ἵνα mit Aorist Konjunktiv bezeichnet hier das zu vermeidende Ergebnis beziehungsweise den Zweck der Mahnung. Im Zusammenhang mit Arbeit und Lohn bedeutet ἀπόλλυμι sachgerecht „verlieren“, nicht „vernichten“.
- source_word: ἃ εἰργασάμεθα
  choice: was wir erarbeitet haben
  rationale: Das Relativpronomen wird idiomatisch mit „was“ wiedergegeben. Die erste Person Plural folgt dem vorgelegten SBLGNT-Text; das Perfekt bezeichnet Arbeit mit fortbestehendem Ergebnis. „Erarbeitet haben“ bringt zum Ausdruck, dass die Arbeit auf ein bleibendes Ergebnis zielte.
- source_word: μισθὸν πλήρη
  choice: den vollen Lohn
  rationale: μισθός kann Lohn oder Belohnung bedeuten. „Lohn“ bewahrt die konkrete Metapher des griechischen Textes, während πλήρη dessen ungekürzte Vollständigkeit bezeichnet.
- source_word: ἀπολάβητε
  choice: empfangt
  rationale: Das Verb bezeichnet hier das Erlangen beziehungsweise Empfangen des Lohns. Ein ausdrücklich rückbezügliches „zurückerhaltet“ wäre im Deutschen stärker, als der Kontext verlangt.
theological_decisions:
- issue: Subjekt von εἰργασάμεθα
  choice: was wir erarbeitet haben
  alternative: was ihr erarbeitet habt
  rationale: Der vorgelegte SBLGNT-Text hat die erste Person Plural und bezieht die Arbeit daher auf den Verfasser beziehungsweise die apostolischen Mitarbeiter. Eine bedeutende Textvariante hat die zweite Person Plural und bezieht sie auf die Leser; diese Variante wird in der Fußnote offengelegt.
- issue: Bedeutung von μισθός
  choice: Lohn
  alternative: Belohnung
  rationale: „Lohn“ erhält die im Griechischen vorhandene Arbeits- und Vergeltungsmetapher, ohne genauer festzulegen, worin dieser Lohn besteht. So wird die theologische Offenheit des Verses bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Mahnung bleibt knapp und eindringlich; die Satzstruktur folgt dem Gedankengang des griechischen Textes, ohne unnötig wörtlich zu wirken.
