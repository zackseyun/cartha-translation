reference: 2 John 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: de
  text: 'Und nun bitte ich dich[a], Frau, nicht als ob ich dir ein neues Gebot schriebe, sondern eines, das wir von Anfang an hatten: dass wir einander lieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist mit »Frau« bildlich eine Gemeinde gemeint; andere verstehen Kyria als Eigennamen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: bitte ich
  rationale: Im brieflichen Zusammenhang bezeichnet ἐρωτάω eine Bitte. „Ich bitte dich“ ist im Deutschen natürlicher als „ich frage dich“ und steigert die Aussage nicht zu einer ausdrücklichen Ermahnung.
- source_word: κυρία
  choice: Herrin
  rationale: κυρία ist der Vokativ Singular von „Herrin“ beziehungsweise „Dame“. „Herrin“ bewahrt die direkte Anrede und lässt offen, ob eine Frau, sinnbildlich eine Gemeinde oder möglicherweise eine Person namens Kyria gemeint ist.
- source_word: ἐντολὴν καινὴν
  choice: kein neues Gebot
  rationale: „Neues Gebot“ ist die sachlich und intertextuell passende Wiedergabe der johanneischen Formulierung.
- source_word: γράφων σοι
  choice: Ich schreibe dir damit
  rationale: Die partizipiale Konstruktion οὐχ ὡς ... γράφων σοι wird in natürliches Deutsch als selbstständiger Satz überführt; „damit“ nimmt den Inhalt der Bitte auf.
- source_word: ἣν εἴχομεν
  choice: eines, das wir ... hatten
  rationale: Der Imperfekt εἴχομεν wird formal als „hatten“ wiedergegeben. Das Gebot ist aus dem vorherigen Satz ergänzt, ohne eine darüber hinausgehende zeitliche Deutung einzutragen.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Die feste Wendung bewahrt den johanneischen Sprachgebrauch und klingt in modernem Deutsch natürlich.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: dass wir einander lieben
  rationale: Der ἵνα-Satz bezeichnet hier den Inhalt des Gebots und behält zugleich seinen auffordernden Klang. „Einander lieben“ ist klar und idiomatisch.
theological_decisions:
- issue: Bezug von κυρία
  choice: Wörtliche Anrede als „Herrin“, ohne die Adressatin näher zu bestimmen.
  alternative: „Gemeinde“, wenn die Herrin bildlich verstanden wird; möglicherweise auch „Kyria“ als Eigenname.
  rationale: Der griechische Wortlaut entscheidet nicht eindeutig zwischen einer einzelnen Frau, einer personifizierten Gemeinde und der möglichen Deutung als Eigenname. Die Hauptübersetzung wahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gliedert die Bitte und ihre nähere Erklärung. Die Anrede „Herrin“ ist bewusst etwas markiert, um die lexikalische Form und die Mehrdeutigkeit des griechischen Textes zu erhalten.
