    issue: „Herrin“ als Wiedergabe von κυρία
    rationale: Obwohl lexikalisch möglich, ist „Herrin“ in heutigem Deutsch als Anrede stark semantisch verengt. „Frau“ ist hier die idiomatischere respektvolle Anrede und erhält die offene Referenz zwischen realer Frau, metaphorischer Gemeinde und möglichem Namen.
  - severity: medium
    issue: Syntaktische Umformung „Ich schreibe dir damit kein neues Gebot“
    rationale: Das griechische οὐχ ὡς ... γράφων σοι ἀλλά kontrastiert nicht zwei unabhängige Aussagen, sondern qualifiziert die Bitte. „Nicht als ob ich dir ein neues Gebot schriebe, sondern ...“ bildet diese Struktur klarer ab; „damit“ hat im Ausgangstext kein direktes Gegenstück.
  revised_text: 'Und nun bitte ich dich[a], Frau, nicht als ob ich dir ein neues Gebot schriebe, sondern eines, das wir von Anfang an hatten: dass wir einander lieben.'
