review_pass:
  verdict: revise
  source_fidelity: Der Sinn wird im Wesentlichen getroffen; die Satzverbindung zu οὐχ ὡς ... ἀλλά wird jedoch durch zwei Hauptsätze und „damit“ weniger präzise abgebildet. Die Verneinung bezieht sich darauf, dass der Verfasser nicht gleichsam ein neues Gebot schreibt, sondern auf das seit Anfang bestehende Gebot verweist.
  naturalness: „Herrin“ ist als direkte Anrede im modernen Standarddeutsch unnötig hart und weckt vorrangig Assoziationen von Dienstbarkeit oder Dominanz. „Frau“ ist als respektvolle Anrede natürlich, wahrt die wörtliche Grundbedeutung von κυρία und lässt die Referenz offen. Eine integrierte Vergleichskonstruktion ist zudem flüssiger und näher am Griechischen.
  terminology: „Neues Gebot“, „von Anfang an“ und „einander lieben“ sind treffend und johanneisch konsistent. Die Fußnote soll neben der bildlichen Deutung auch ausdrücklich die mögliche Auffassung als Eigenname nennen.
  issues:
