id: 2JN.1.6
reference: 2 John 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: de
  text: 'Und darin besteht die Liebe: dass wir nach seinen Geboten leben. Das ist das Gebot[a], wie ihr von Anfang an gehört habt: dass ihr darin lebt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Darin“ kann sich auch auf die Liebe statt auf das Gebot beziehen: „dass ihr in der Liebe lebt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die natürliche moderne Entsprechung und bewahrt die für die johanneischen Schriften wichtige Wortverbindung.
- source_word: ἵνα περιπατῶμεν
  choice: dass wir … leben
  rationale: ἵνα erläutert hier, worin sich die Liebe praktisch zeigt. Das ethische Bild des Wandelns wird im heutigen Standarddeutsch verständlich mit „leben“ wiedergegeben.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: nach seinen Geboten
  rationale: κατά mit Akkusativ bezeichnet hier die Ausrichtung an einem Maßstab. „Nach seinen Geboten“ ist knapp, natürlich und bewahrt den Plural.
- source_word: ἐντολάς / ἐντολή
  choice: Geboten / Gebot
  rationale: Die einheitliche Wiedergabe erhält den auffälligen Wechsel vom Plural zum Singular.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: wie ihr von Anfang an gehört habt
  rationale: Die Formulierung bewahrt die johanneische Wendung „von Anfang an“ und gibt den Aorist ἠκούσατε natürlich wieder.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: dass ihr darin lebt
  rationale: „Darin“ bewahrt die Präpositionalfügung und lässt im Deutschen die mögliche Beziehung sowohl auf „Gebot“ als auch auf „Liebe“ offen; „lebt“ nimmt die ethische Bedeutung von περιπατέω wieder auf.
theological_decisions:
- issue: Bezug von αὐτῇ im letzten Satzteil
  choice: Im fortlaufenden Satz liegt als nächster Bezug „das Gebot“ nahe.
  alternative: Das Pronomen kann sich auf „die Liebe“ im ersten Satzteil beziehen.
  rationale: ἐντολή und ἀγάπη sind im Griechischen beide feminin und kommen grammatisch als Bezug infrage. Der nähere Bezug ist ἐντολή, doch der gedankliche Zusammenhang mit der Liebe ist stark. Die Übersetzung „darin“ und die Fußnote bewahren diese Spannung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Leben“ vermeidet das heute altertümlich wirkende „wandeln“, während die Wiederholung in beiden Satzhälften die Struktur des griechischen Textes erkennen lässt.
