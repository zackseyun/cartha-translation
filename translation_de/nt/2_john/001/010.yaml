source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: de
  text: Wenn jemand zu euch kommt und diese Lehre nicht mitbringt[b], nehmt ihn nicht ins Haus auf und grüßt ihn nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: „Sagt ihm nicht: ,Gruß!‘“; idiomatisch: „Grüßt ihn nicht.“'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang geht es um jemanden, der ohne „diese Lehre“ kommt – wahrscheinlich um einen reisenden Lehrer, dessen Botschaft von dem in den vorangehenden Versen beschriebenen Bekenntnis abweicht.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: Wenn jemand
  rationale: Die offene, allgemeine Bedingung wird im Deutschen natürlich mit „Wenn jemand“ wiedergegeben.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: zu euch kommt
  rationale: Dies bildet die Bewegung zu den Adressaten direkt ab, ohne aus dem Kontext zusätzliche kirchliche Einzelheiten in den Wortlaut einzutragen.
- source_word: ταύτην τὴν διδαχήν
  choice: diese Lehre
  rationale: „Lehre“ ist eine klare, gegenwartsdeutsche Wiedergabe von διδαχή und bewahrt den ausdrücklichen Rückverweis durch „diese“.
- source_word: οὐ φέρει
  choice: nicht mitbringt
  rationale: Im Zusammenhang mit einer Lehre bedeutet φέρει „bringen“; „mitbringen“ ist im Deutschen idiomatisch und bewahrt das Bild.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: nehmt ihn nicht ins Haus auf
  rationale: „Ins Haus aufnehmen“ gibt den konkreten Bezug auf Aufnahme und Gastfreundschaft natürlich wieder. Der griechische Text sagt „in ein/das Haus“ und enthält kein ausdrückliches Possessivpronomen.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: entbietet ihm keinen Gruß
  rationale: Die Formulierung wahrt die sprachliche Gestalt „ihm keinen Gruß sagen/entbieten“, klingt dabei würdig und verständlich; die idiomatischere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Reichweite des Verbots gegenüber einem Irrlehrer
  choice: Die konkreten Handlungen der Aufnahme ins Haus und des Grußentbietens bleiben ohne erläuternde Einschränkung im Haupttext stehen.
  alternative: Das Verbot ausdrücklich auf jede soziale Begegnung oder ausschließlich auf die offizielle Beherbergung eines reisenden Lehrers zu beziehen.
  rationale: Der unmittelbare Zusammenhang betrifft Personen, die ohne „diese Lehre“ kommen, wahrscheinlich reisende Lehrer. Der griechische Wortlaut selbst legt jedoch nicht abschließend fest, wie weit das Verbot in jeder denkbaren Situation reicht; diese Spannung darf die Übersetzung nicht auflösen.
- issue: Wiedergabe des maskulinen Singulars αὐτόν/αὐτῷ
  choice: ihn / ihm
  alternative: die betreffende Person / ihr
  rationale: Die maskulinen Singularformen des Ausgangstextes werden grammatisch genau wiedergegeben, ohne daraus eine Aussage abzuleiten, dass ausschließlich Männer gemeint sein könnten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entbietet ihm keinen Gruß“ ist etwas gehobener als Alltagssprache, erhält aber die auffällige Formulierung des Griechischen besser als das schlichte „grüßt ihn nicht“. Die Fußnotenmarker stehen beide am Versende, da Fußnote a den letzten Teilsatz und Fußnote b den gesamten situativen Zusammenhang erläutert.
