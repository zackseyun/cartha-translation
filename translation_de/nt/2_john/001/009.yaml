  source_fidelity: 'Der Haupttext bildet die syntaktische und gedankliche Struktur des SBLGNT zuverlässig ab: πᾶς ὁ προάγων ist generisch mit „Jeder, der …“ wiedergegeben; „vorauseilt“ erhält das Bewegungsbild von προάγων, ohne die Variante παραβαίνων in den Text einzutragen. „nicht … bleibt“ entspricht dem wiederholten μένων, und „hat Gott nicht“ bewahrt die knappe Aussage θεὸν οὐκ ἔχει. Die Wiederholung von διδαχή wird gewahrt; „dieser Lehre“ verweist angemessen auf die zuvor genannte „Lehre des Messias“. „sowohl den Vater als auch den Sohn“ gibt καὶ … καὶ vollständig wieder.'
