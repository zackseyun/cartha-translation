id: 2JN.1.9
reference: 2 John 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: de
  text: Jeder, der vorauseilt und nicht in der Lehre des Messias bleibt, hat Gott nicht.[a] Wer in dieser Lehre bleibt,[b] der hat sowohl den Vater als auch den Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu weit geht«. Einige Handschriften haben statt »vorauseilt«: »übertritt«.'
    reason: textual_variant
  - marker: b
    text: »Die Lehre des Messias« kann sowohl die vom Messias vermittelte Lehre als auch die Lehre über den Messias bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Jeder, der vorauseilt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden, auf den dies zutrifft. „Vorauseilt“ bewahrt das Bild des προάγειν und lässt im Zusammenhang erkennen, dass ein Hinausgehen über die maßgebliche Lehre gemeint ist, ohne die stärkere Lesart „übertritt“ in den Haupttext einzutragen.
- source_word: μὴ μένων
  choice: nicht … bleibt
  rationale: „Bleiben“ gibt das johanneische Schlüsselverb μένω natürlich und zugleich konkordant wieder.
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: in der Lehre des Messias
  rationale: „Lehre“ ist die natürliche Wiedergabe von διδαχή. Der Genitiv „des Messias“ bewahrt die mögliche Bedeutung sowohl der vom Messias stammenden Lehre als auch der Lehre über ihn. Χριστός wird als Titel mit „Messias“ wiedergegeben.
- source_word: θεὸν οὐκ ἔχει
  choice: hat Gott nicht
  rationale: Die knappe und zugespitzte Formulierung des griechischen Textes bleibt erhalten, ohne sie deutend zu „hat keine Gemeinschaft mit Gott“ zu erweitern.
- source_word: ὁ μένων ἐν τῇ διδαχῇ, οὗτος
  choice: Wer in dieser Lehre bleibt, der
  rationale: Die deutsche Korrelativkonstruktion „Wer …, der …“ gibt das substantivierte Partizip und das hervorhebende οὗτος idiomatisch und mit erkennbarem Nachdruck wieder.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: hat sowohl den Vater als auch den Sohn
  rationale: „Sowohl … als auch“ bildet die korrelative Konstruktion καὶ … καὶ klar und natürlich ab.
theological_decisions:
- issue: Bedeutung von προάγων
  choice: „vorauseilt“
  alternative: '„zu weit geht“; nach einer Textvariante: „übertritt“'
  rationale: Der SBLGNT bietet προάγων, nicht παραβαίνων. Die gewählte Wiedergabe erhält das Bewegungsbild und vermeidet es, die polemische Folgerung bereits lexikalisch festzuschreiben.
- issue: Bedeutung von „der Lehre des Messias“
  choice: Der kompakte Genitiv bleibt erhalten.
  alternative: „der Lehre, die der Messias vermittelt“; „der Lehre über den Messias“
  rationale: Der griechische Genitiv kann Herkunft beziehungsweise Urheberschaft oder Inhalt bezeichnen. Der Haupttext soll diese sachlich bedeutsame Mehrdeutigkeit nicht auflösen.
- issue: Wiedergabe des Titels Χριστός
  choice: „Messias“
  alternative: „Christus“
  rationale: Χριστός fungiert hier als Titel. „Messias“ macht dessen titulare Bedeutung in modernem Deutsch unmittelbar kenntlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem, knappem Briefstil. Die johanneische Wiederholung von „Lehre“ und „bleiben“ wird bewahrt; „Wer …, der …“ gibt οὗτος natürlicher wieder als das im Deutschen schwerfällige „dieser“.
