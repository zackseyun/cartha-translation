  terminology: „Messias“ folgt der vorgegebenen Wiedergabe von Χριστός als Titel. „Lehre“, „bleibt“, „Vater“ und „Sohn“ sind konsistent und sachgerecht. Die Fußnote zu „Lehre des Messias“ bewahrt zutreffend die offene genitivische Beziehung zwischen einer vom Messias stammenden und einer ihn betreffenden Lehre. Die textkritische Fußnote unterscheidet korrekt zwischen der Ausgangslesart und der Lesart „übertritt“.
