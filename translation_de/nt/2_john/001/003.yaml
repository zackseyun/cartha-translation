source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: de
  text: Gnade, Barmherzigkeit und Frieden werden mit uns sein, von Gott, dem Vater, und von Jesus, dem Messias[a], dem Sohn des Vaters[b], in Wahrheit und Liebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus Christus«. Der griechische Titel Χριστός kann mit »Messias« übersetzt werden; traditionell wird er als »Christus« wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »der Sohn des Vaters«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: werden … sein
  rationale: Der Futur Indikativ von εἰμί wird seiner Form entsprechend als Aussage wiedergegeben, nicht als Wunschform.
- source_word: μεθ’ ἡμῶν
  choice: mit uns
  rationale: μετά mit Genitiv bezeichnet hier Gemeinschaft bzw. Begleitung; „mit uns“ entspricht der griechischen Wendung und dem Segenskontext.
- source_word: χάρις ἔλεος εἰρήνη
  choice: Gnade, Barmherzigkeit und Frieden
  rationale: Die drei Nominative sind die Subjekte von ἔσται; die geläufige und quellennahe Reihenfolge bleibt erhalten.
- source_word: παρὰ θεοῦ πατρός
  choice: von Gott, dem Vater
  rationale: παρά mit Genitiv bezeichnet die Quelle. Die Apposition „dem Vater“ gibt πατρός wieder, ohne ein im Griechischen nicht vorhandenes „unserem“ hinzuzufügen.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: von Jesus, dem Messias
  rationale: παρά bezeichnet erneut die Quelle. Χριστός wird als Titel mit „Messias“ übersetzt; die deutsche Apposition macht den Titel natürlich und eindeutig.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: dem Sohn des Vaters
  rationale: Die Genitivfügung wird eng appositionell auf Jesus, den Messias, bezogen und formal klar wiedergegeben.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: in Wahrheit und Liebe
  rationale: ἐν mit Dativ wird unmittelbar mit „in“ wiedergegeben; die artikellosen Substantive bleiben qualitativ und erhalten im Deutschen keinen bestimmten Artikel.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: Χριστός bezeichnet hier den Titel Jesu. „Messias“ übersetzt dessen Titelsinn, während das traditionelle „Christus“ als mögliche Wiedergabe in der Fußnote genannt wird.
- issue: Beziehung von τοῦ υἱοῦ τοῦ πατρός zu Jesus
  choice: 'Appositionelle Identifikation: „Jesus, dem Messias, dem Sohn des Vaters“'
  alternative: Locker beschreibender Nachtrag
  rationale: Kasus und Stellung legen eine Apposition nahe, die Jesus ausdrücklich als Sohn des Vaters bezeichnet, ohne zusätzliche dogmatische Formulierungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Futur-Aussage und die wiederholte Herkunftsangabe „von … und von …“ bleiben erhalten. Die Zeichensetzung kennzeichnet die griechischen Appositionen klar.
