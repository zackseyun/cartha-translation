id: 2JN.1.1
reference: 2 John 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: de
  text: Der Älteste an die erwählte Herrin[a] und ihre Kinder, die ich in Wahrheit[b] liebe – und nicht ich allein, sondern auch alle, die die Wahrheit erkannt haben –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die auserwählte Herrin“. Manche verstehen die „Herrin“ bildlich als eine Ortsgemeinde; andere fassen „Kyria“ als Personennamen auf.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „aufrichtig“; die Wendung kann im johanneischen Sinn auch „in der Wahrheit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Der Älteste
  rationale: Die Selbstbezeichnung am Briefanfang bezeichnet am ehesten eine anerkannte Stellung, lässt aber den möglichen Bezug auf Alter und Würde offen. „Presbyter“ wäre im heutigen Deutsch technischer und konfessionell stärker geprägt.
- source_word: ἐκλεκτῇ
  choice: erwählte
  rationale: „Erwählt“ ist die natürliche und zugleich traditionsnahe Wiedergabe und kann sich sowohl auf eine Frau als auch auf eine personifizierte Gemeinde beziehen.
- source_word: κυρίᾳ
  choice: Herrin
  rationale: κυρία bezeichnet eine Herrin bzw. vornehme Frau. „Herrin“ bewahrt die formelle Anrede und ermöglicht sowohl die persönliche als auch die metaphorische Deutung; die mögliche Lesart als Eigenname wird in der Fußnote genannt.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: ihre Kinder
  rationale: τέκνα ist geschlechtsübergreifend. Die Formulierung passt sowohl zu leiblichen Kindern als auch metaphorisch zu den Mitgliedern einer Gemeinde.
- source_word: οὓς
  choice: die
  rationale: Das deutsche Relativpronomen kann sich hier natürlich auf „Kinder“ beziehen, ohne die angesprochene Personengruppe unnötig näher festzulegen.
- source_word: ἀγαπῶ
  choice: liebe
  rationale: Die schlichte Wiedergabe vermeidet eine im Griechischen nicht ausgedrückte Verstärkung.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die Formulierung bewahrt sowohl den möglichen Sinn „wahrhaftig“ als auch den johanneischen Gedanken eines Lebens und Liebens im Bereich der Wahrheit.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: und nicht ich allein, sondern auch alle
  rationale: Die deutsche Wortfolge erhält den betonten Gegensatz zwischen dem Verfasser und allen anderen, die die Wahrheit kennen.
- source_word: οἱ ἐγνωκότες
  choice: die … erkannt haben
  rationale: Das Perfekt bezeichnet ein erlangtes Erkennen mit fortdauernder Wirkung. „Erkannt haben“ gibt dies knapp und idiomatisch wieder.
- source_word: τὴν ἀλήθειαν
  choice: die Wahrheit
  rationale: Die bestimmte Form bewahrt die gewöhnliche wie auch die theologisch geprägte johanneische Bedeutung.
theological_decisions:
- issue: Identität der ἐκλεκτῇ κυρίᾳ
  choice: Als „die erwählte Herrin“ wiedergegeben, ohne festzulegen, ob eine einzelne Frau oder eine personifizierte Ortsgemeinde gemeint ist.
  alternative: Eine bestimmte Christin; eine personifizierte Gemeinde; „Kyria“ als Personenname.
  rationale: Der griechische Wortlaut lässt diese Deutungen zu. Der Haupttext folgt dem naheliegenden Gattungswort, während die Fußnote die echte Mehrdeutigkeit offenhält.
- issue: Bedeutung von ἐν ἀληθείᾳ
  choice: „in Wahrheit“
  alternative: „wahrhaftig“ oder „in der Wahrheit“
  rationale: „In Wahrheit“ bewahrt sowohl den adverbialen Sinn der Aufrichtigkeit als auch den für die johanneischen Schriften typischen theologischen Nachklang, ohne einen davon festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit brieflicher Feierlichkeit. Der Gedankenstrich am Versende wahrt den syntaktisch offenen Übergang zum folgenden Vers. Die wiederholte „Wahrheit“ bleibt als Schlüsselwort sichtbar.
