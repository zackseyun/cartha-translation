base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: de
  text: 'Denn wer ihm sagt: »Grüße!«[a], beteiligt sich an seinen bösen Taten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im gegebenen Zusammenhang stärker gedeutet: »Willkommen!« Das griechische Wort ist eine übliche Grußformel. Hier bezeichnet es jedoch nicht bloß beiläufige Höflichkeit, sondern kann Aufnahme oder Zustimmung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: wer … sagt
  rationale: Der substantivierte Präsenspartizip bezeichnet allgemein jeden, der so handelt. Die deutsche Konstruktion »wer … sagt« gibt diesen generischen Sinn natürlich und präzise wieder.
- source_word: γάρ
  choice: Denn
  rationale: Die Konjunktion begründet das Verbot im vorherigen Vers; »Denn« bewahrt diese erklärende Funktion knapp und idiomatisch.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Das Dativpronomen verweist auf die im vorherigen Vers genannte Person. Die Übersetzung bleibt beim knappen Verweis des griechischen Textes.
- source_word: χαίρειν
  choice: »Sei gegrüßt!«
  rationale: Nach λέγων dient der Infinitiv als konventionelle Grußformel. »Sei gegrüßt!« bildet die Formel würdig und verständlich ab, ohne sie im Haupttext bereits als ausdrückliche Unterstützung oder Billigung auszulegen.
- source_word: κοινωνεῖ
  choice: beteiligt sich an
  rationale: Das Verb mit Dativ bezeichnet Teilhabe beziehungsweise Mitwirkung. »Beteiligt sich an« bringt die hier gemeinte moralische Mitverantwortung klar zum Ausdruck, ohne einen engeren kirchlichen Gemeinschaftsbegriff einzutragen.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: an seinen bösen Taten
  rationale: Die Dativgruppe bezeichnet das, woran jemand teilhat. »Taten« ist im heutigen Deutsch bei moralisch qualifiziertem Handeln natürlicher als »Werke«, während »bösen« die Wertung von πονηροῖς bewahrt.
theological_decisions:
- issue: Ob die Grußformel bloße Höflichkeit oder zustimmende Unterstützung bezeichnet
  choice: Der Haupttext übersetzt die Grußformel wörtlich-idiomatisch und lässt der unmittelbaren Verbindung mit der Beteiligung an bösen Taten ihr Gewicht; die Fußnote erläutert die kontextuelle Tragweite.
  alternative: Die Aussage als ausnahmsloses Verbot jeder höflichen Anrede oder ausdrücklich als »willkommen heißen« wiederzugeben.
  rationale: χαίρειν ist lexikalisch eine übliche Grußformel. Im Zusammenhang mit der Aufnahme und Unterstützung des Irrlehrers in Vers 10 erhält sie jedoch die Bedeutung einer solidarischen Begrüßung, die Mitverantwortung begründet. Diese Spannung soll nicht durch eine überdeutende Haupttextübersetzung aufgehoben werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Die Satzstruktur ist knapp und bewahrt den begründenden Anschluss an Vers 10. »Taten« vermeidet das im heutigen Sprachgebrauch teils missverständliche »Werke«.
