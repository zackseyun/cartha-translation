  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: de
  text: Ich habe mich sehr darüber gefreut, dass ich einige unter deinen Kindern gefunden habe[a], die in der Wahrheit leben[b], wie wir es als Gebot vom Vater empfangen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus deinen Kindern“. Die griechische Formulierung bezeichnet eine Teilmenge und meint nicht notwendigerweise alle.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Wahrheit leben“. Gemeint ist wahrscheinlich nicht nur Aufrichtigkeit, sondern ein Leben im Einklang mit der offenbarten Wahrheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Ich habe mich sehr darüber gefreut
  rationale: Die Formulierung gibt die abgeschlossene, nachdrücklich ausgedrückte Freude natürlich und würdevoll wieder.
- source_word: εὕρηκα
  choice: ich … gefunden habe
  rationale: Das deutsche Perfekt bewahrt den Ergebnisbezug des griechischen Perfekts und klingt im modernen Standarddeutsch natürlich.
- source_word: ἐκ τῶν τέκνων σου
  choice: unter deinen Kindern einige
  rationale: 'Die Konstruktion mit ἐκ ist partitiv: Gemeint ist ausdrücklich eine Teilmenge, ohne dass über alle Kinder eine Aussage gemacht wird.'
- source_word: περιπατοῦντας ἐν ἀληθείᾳ
  choice: die in der Wahrheit ihren Weg gehen
  rationale: Die Wendung bewahrt das johanneische Bild des Gehens und bezeichnet zugleich eine Lebensführung, die von der Wahrheit bestimmt ist.
- source_word: καθὼς
  choice: so wie
  rationale: Kennzeichnet die Entsprechung zwischen ihrer Lebensführung und dem empfangenen Gebot in natürlichem Deutsch.
- source_word: ἐντολὴν ἐλάβομεν
  choice: wir … ein Gebot empfangen haben
  rationale: „Gebot“ wahrt das Gewicht des johanneischen Schlüsselbegriffs ἐντολή; der Plural „wir“ bleibt erhalten.
- source_word: παρὰ τοῦ πατρός
  choice: vom Vater
  rationale: Gibt den griechischen Wortlaut ohne erklärenden Zusatz wieder.
theological_decisions:
- issue: Bezug der Bezeichnung „der Vater“
  choice: vom Vater
  alternative: von Gott, dem Vater
  rationale: Der Ausgangstext sagt lediglich „vom Vater“. Der Titel wird bewahrt, ohne „Gott“ ergänzend in den Text einzutragen.
- issue: Umfang der Aussage über die Kinder
  choice: unter deinen Kindern einige
  alternative: deine Kinder
  rationale: Das partitive ἐκ bezeichnet einige aus der Gruppe und erlaubt nicht die Aussage, dass ausnahmslos alle gemeint seien.
- issue: Bedeutung von „in Wahrheit“
  choice: in der Wahrheit ihren Weg gehen
  alternative: aufrichtig leben
  rationale: 'Die Wendung meint im johanneischen Zusammenhang wahrscheinlich mehr als persönliche Aufrichtigkeit: ein Leben im Bereich und nach dem Maßstab der offenbarten Wahrheit. Die Übersetzung bewahrt zugleich die mögliche sprachliche Weite.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Ihren Weg gehen“ bewahrt die biblische Wegmetapher, ohne im Deutschen unnatürlich wörtlich zu klingen; Satzbau und Perfekt entsprechen natürlichem gegenwärtigem Sprachgebrauch.
