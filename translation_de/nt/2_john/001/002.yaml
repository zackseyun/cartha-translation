  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: de
  text: wegen der Wahrheit, die in uns bleibt und für immer bei uns sein wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὴν ἀλήθειαν
  choice: um der Wahrheit willen
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Beweggrund der in Vers 1 genannten Liebe. „Um der Wahrheit willen“ gibt diesen Zusammenhang würdig und natürlich wieder, ohne ihn weiter auszudeuten.
- source_word: τὴν μένουσαν
  choice: die … bleibt
  rationale: Das Partizip Präsens von μένω bezeichnet fortdauerndes Bleiben. „Bleibt“ ist im modernen Deutsch klar und bewahrt den durativen Sinn.
- source_word: ἐν ἡμῖν
  choice: in uns
  rationale: ἐν mit Dativ wird direkt als „in uns“ wiedergegeben und lässt die johanneische Vorstellung von der inneren Gegenwart der Wahrheit bestehen; „unter uns“ wäre möglich, aber weniger unmittelbar.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: und … mit uns sein wird
  rationale: Die Verbindung aus μετά mit Genitiv und dem Futur von εἰμί bedeutet schlicht „wird mit uns sein“. Ein zusätzliches „bleiben“ würde den Wortlaut unnötig erweitern.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „Für immer“ ist die klare und natürliche deutsche Entsprechung.
theological_decisions:
- issue: Johanneischer Sinn von „Wahrheit“
  choice: Der einfache Ausdruck „Wahrheit“ bleibt erhalten.
  alternative: „die Wahrheit des Evangeliums“ oder „die wahre Lehre“
  rationale: Der Kontext verleiht dem Begriff theologisches Gewicht, legt ihn aber nicht ausdrücklich auf Evangelium, Lehre, Christus oder eine andere einzelne Bezugsgröße fest. Die offene Formulierung bewahrt diese Bedeutungsfülle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung schließt syntaktisch an Vers 1 an; deshalb beginnt sie entsprechend dem griechischen Satzbau mit „um“. Keine Fußnote nötig, da „bleibt“ die naheliegende und unauffällige deutsche Wiedergabe von μένω ist.
