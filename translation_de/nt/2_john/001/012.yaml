  variant: modern standard German
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: de
  text: Obwohl ich euch vieles zu schreiben habe, wollte ich es nicht mit Papier und Tinte tun. Vielmehr hoffe ich, zu euch zu kommen und von Angesicht zu Angesicht mit euch zu reden, damit eure Freude vollkommen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „unsere Freude“ statt „eure Freude“.
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Obwohl ich euch noch vieles zu schreiben habe
  rationale: Die Partizipialkonstruktion wird ihrem Zusammenhang entsprechend konzessiv wiedergegeben. „Vieles“ bewahrt den substantivierten Plural Πολλά; „noch“ verdeutlicht natürlich, dass über den Brief hinaus weiterer Gesprächsstoff besteht, ohne den Sinn zu verändern.
- source_word: οὐκ ἐβουλήθην
  choice: wollte ich es nicht
  rationale: Gibt die Willensentscheidung in klarem, modernem Deutsch wieder; „es“ nimmt das Schreiben des Vielen auf.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: mit Papier und Tinte
  rationale: διά mit Genitiv bezeichnet hier das Mittel. „Mit Papier und Tinte“ ist im Deutschen natürlich und bleibt nahe am Wortlaut.
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: Vielmehr hoffe ich, zu euch zu kommen
  rationale: „Vielmehr“ markiert den Gegensatz, während „zu euch zu kommen“ die auf die Empfänger gerichtete persönliche Anwesenheit natürlich wiedergibt.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: von Angesicht zu Angesicht mit euch zu reden
  rationale: Die wörtliche Wiedergabe „Mund zu Mund“ wäre im heutigen Deutschen missverständlich. Die etablierte Wendung bezeichnet ein unmittelbares persönliches Gespräch; „mit euch“ macht den Gesprächsbezug idiomatisch deutlich.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: damit eure Freude vollkommen wird
  rationale: Die Zweckkonstruktion mit ἵνα bleibt erhalten. „Vollkommen wird“ gibt den Zustand erfüllter bzw. voll gewordener Freude knapp und würdig wieder.
theological_decisions:
- issue: 'Textvariante beim Pronomen: wessen Freude gemeint ist'
  choice: eure Freude
  alternative: unsere Freude
  rationale: Der vorgelegte SBLGNT-Text liest ὑμῶν („eure“). Die bezeugte Variante ἡμῶν („unsere“) wird wegen ihrer inhaltlichen Bedeutung in einer Fußnote bewahrt, statt stillschweigend ausgeschlossen zu werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in einem würdigen brieflichen Ton. Der direkte Gegensatz zwischen schriftlicher und persönlicher Kommunikation sowie die genuine Textvariante werden bewahrt.
