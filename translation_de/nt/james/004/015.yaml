id: JAS.4.15
reference: James 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: de
  text: 'Stattdessen solltet ihr sagen: »Wenn der Herr will, werden wir leben und dies oder das tun.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Stattdessen solltet ihr sagen
  rationale: Die Konstruktion bedeutet wörtlich »anstatt dass ihr sagt«. Die gewählte Form gibt den im Zusammenhang enthaltenen korrigierenden Sinn natürlich und klar wieder.
- source_word: Ἐὰν
  choice: Wenn
  rationale: Leitet mit dem Konjunktiv eine Bedingung ein; »wenn« ist hier die natürliche deutsche Entsprechung.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Bewahrt die übliche Wiedergabe von κύριος und lässt offen, ob speziell Gott oder Jesus Christus gemeint ist.
- source_word: θελήσῃ
  choice: will
  rationale: Drückt den Willen des Herrn aus und passt im Deutschen sowohl semantisch als auch stilistisch.
- source_word: καὶ ζήσομεν καὶ ποιήσομεν
  choice: werden wir leben und … tun
  rationale: Gibt beide Futurformen und ihre Verknüpfung wieder. Ein zusätzliches »auch« ist im Deutschen nicht nötig und könnte eine nicht beabsichtigte Hervorhebung erzeugen.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: dies oder das
  rationale: Die feste, natürliche Wendung bewahrt den unbestimmten Bezug auf unterschiedliche Vorhaben.
theological_decisions:
- issue: Bezug von ὁ κύριος
  choice: der Herr
  alternative: Gott; der Herr Jesus
  rationale: Der griechische Text bestimmt den Referenten nicht näher. Die Übersetzung bewahrt diese Offenheit und zugleich die Aussage, dass Leben und Handeln vom Willen des Herrn abhängen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die korrigierende Aussage ist idiomatisch formuliert; die knappe Abhängigkeit von Leben und Vorhaben vom Willen des Herrn bleibt erhalten.
