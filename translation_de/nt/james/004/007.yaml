id: JAS.4.7
reference: James 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: de
  text: Ordnet euch daher Gott unter.[a] Widersteht aber dem Teufel, dann wird er vor euch fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid Gott untertan.“'
    reason: Lexikalische Alternative, die die grammatische Passivform von ὑποτάγητε unmittelbarer abbildet.
lexical_decisions:
- source_word: ὑποτάγητε
  choice: Ordnet euch … unter
  rationale: Der aoristische Passivimperativ von ὑποτάσσω kann in dieser Ermahnung reflexiv verstanden werden. „Ordnet euch … unter“ ist im heutigen Deutsch natürlich und bewahrt sowohl die freiwillige Hinwendung als auch Gottes Autorität.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Gedankengang; „daher“ stellt diesen logischen Zusammenhang klar und knapp her.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Dativische Ergänzung zu „unterordnen“; im Deutschen steht sie ohne Präposition.
- source_word: ἀντίστητε
  choice: Widersteht
  rationale: Der aoristische Aktivimperativ bezeichnet entschlossenen Widerstand. „Widersteht“ ist präzise, würdig und im Deutschen gut verständlich.
- source_word: δὲ
  choice: aber
  rationale: Markiert den Kontrast zwischen der Unterordnung unter Gott und dem Widerstand gegen den Teufel.
- source_word: τῷ διαβόλῳ
  choice: dem Teufel
  rationale: διάβολος ist hier mit Artikel gebraucht und bezeichnet den persönlichen Widersacher; „der Teufel“ ist die etablierte deutsche Wiedergabe.
- source_word: καὶ
  choice: dann
  rationale: καί verbindet hier Aufforderung und zugesagte Folge. „Dann“ macht diesen Folgezusammenhang im Deutschen natürlich deutlich, ohne eine zusätzliche Bedingung einzutragen.
- source_word: φεύξεται
  choice: wird er … fliehen
  rationale: Das Futur von φεύγω bezeichnet die zugesagte Folge; das Pronomen verweist eindeutig auf den Teufel.
- source_word: ἀφ’ ὑμῶν
  choice: vor euch
  rationale: ἀπό mit Genitiv bezeichnet die Bewegung weg von den Angeredeten. Bei „fliehen“ ist „vor euch“ idiomatisches Deutsch und bewahrt die Richtung des Sich-Entfernens.
theological_decisions:
- issue: Bedeutung von διάβολος
  choice: „der Teufel“ als persönlicher übernatürlicher Widersacher
  alternative: „der Verleumder“ als allgemeine Bezeichnung oder als unpersönliche Macht
  rationale: Der artikulierte Ausdruck bezeichnet in diesem Kontext geistlicher Auseinandersetzung am natürlichsten einen persönlichen Widersacher. Die Übersetzung folgt dem griechischen Sprachgebrauch, ohne die Aussage weiter auszudeuten.
- issue: Verhältnis der beiden Imperative
  choice: Unterordnung unter Gott und Widerstand gegen den Teufel werden kontrastiv nebeneinandergestellt
  alternative: Den Widerstand ausdrücklich als Mittel oder Folge der Unterordnung auszuformulieren
  rationale: Das griechische δέ markiert einen Kontrast beziehungsweise eine Weiterführung, legt aber die genaue theologische Beziehung nicht über die Satzverknüpfung hinaus fest. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Imperative bleiben knapp und eindringlich; „ordnet euch unter“ ist geläufiger als das steifere „seid untertan“, das deshalb als Fußnotenalternative erscheint.
