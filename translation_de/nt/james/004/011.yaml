  naturalness: Der Text ist insgesamt modernes, würdevolles Standarddeutsch. „Richtet“ ist in diesem ethisch-paränetischen und bewusst kontrastierenden Kontext idiomatisch und klar. „Täter des Gesetzes“ ist als an Jakobus anschließende feste Ausdrucksweise vertretbar.
