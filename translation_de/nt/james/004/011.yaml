id: JAS.4.11
reference: James 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: de
  text: Redet nicht schlecht übereinander[a], Brüder[b]. Wer schlecht über einen Bruder redet oder seinen Bruder richtet, redet schlecht über das Gesetz und richtet das Gesetz. Wenn du aber das Gesetz richtest, bist du kein Täter des Gesetzes, sondern ein Richter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verleumdet einander nicht“; das griechische Verb bezeichnet feindseliges oder herabsetzendes Reden gegen jemanden.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Anrede steht in der männlichen Pluralform und meint hier wahrscheinlich die ganze Gemeinde, also Brüder und Schwestern.
    reason: inclusive_scope
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: schlecht reden über
  rationale: Das Verb bezeichnet feindseliges oder herabsetzendes Reden gegen jemanden. „Schlecht reden über“ ist im modernen Deutschen natürlich, wahrt die Wiederholung und legt den Sinn nicht auf den engeren juristischen Begriff „verleumden“ fest.
- source_word: ἀλλήλων
  choice: übereinander
  rationale: Natürliche reziproke Wiedergabe in Verbindung mit „schlecht reden“.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die maskuline Pluralform und die familiäre Bildsprache; der wahrscheinlich die ganze Gemeinde umfassende Sinn wird in einer Fußnote erläutert.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: einen Bruder / seinen Bruder
  rationale: Bewahrt die familiäre Metapher und die lexikalische Verbindung zur Anrede.
- source_word: ἢ
  choice: oder
  rationale: Gibt die im SBLGNT bezeugte disjunktive Verknüpfung direkt wieder.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: verurteilen
  rationale: Im Zusammenhang mit dem tadelnden Reden bezeichnet κρίνω ein negatives Urteilen. „Verurteilen“ ist verständlich und hält die verbale Wiederholung durchgehend fest, ohne im Deutschen die missverständliche Vorstellung zu fördern, jede Form von Urteilsbildung sei gemeint.
- source_word: νόμου / νόμον
  choice: das Gesetz
  rationale: Der bestimmte Ausdruck ist im Deutschen idiomatisch und lässt offen, wie genau das in Jakobus erwähnte göttliche Gesetz näher zu bestimmen ist.
- source_word: ποιητὴς
  choice: Täter
  rationale: Bewahrt den für Jakobus charakteristischen Gegensatz zwischen Tun und Urteilen sowie die Verbindung zum „Täter“ des Wortes beziehungsweise Gesetzes.
- source_word: κριτής
  choice: Richter
  rationale: Direkte substantivische Wiedergabe, die den Gegensatz zu „Täter“ prägnant erhält.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: „Brüder“ im Haupttext, mit Erläuterung des wahrscheinlich inklusiven Gemeindebezugs in einer Fußnote
  alternative: „Brüder und Schwestern“
  rationale: Die Übersetzung bewahrt die Form und familiäre Metapher des griechischen Ausdrucks, ohne zu verschweigen, dass die gesamte Gemeinde angesprochen sein dürfte.
- issue: Referent von „das Gesetz“
  choice: Keine nähere Bestimmung im Haupttext
  alternative: „Gottes Gesetz“, „das königliche Gesetz“ oder „das mosaische Gesetz“
  rationale: Der Kontext deutet auf Gottes ethische Weisung, möglicherweise besonders das Gebot der Nächstenliebe; der Vers selbst grenzt den Bezug jedoch nicht ausdrücklich ein.
- issue: Bedeutungsumfang von κρίνω
  choice: „verurteilen“
  alternative: „richten“ oder „beurteilen“
  rationale: Der Kontext beschreibt ein negatives, anmaßendes Urteil über einen Bruder und dadurch über das Gesetz. Die gewählte Form erhält die argumentative Wiederholung, ohne den Satz als Verbot jeglicher Beurteilung erscheinen zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von καταλαλέω und die wiederholten Formen von κρίνω werden zur Wahrung der Argumentationsstruktur jeweils einheitlich wiedergegeben. Die Anrede „Brüder“ bleibt quellennah und wird hinsichtlich ihres Umfangs erläutert.
