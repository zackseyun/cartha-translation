  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: de
  text: Demütigt euch vor dem Herrn[a], und er wird euch erhöhen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in der Gegenwart des Herrn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: aufrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Demütigt euch
  rationale: Der Aorist Passiv-Imperativ kann hier, wie in paränetischen Zusammenhängen üblich, reflexiv beziehungsweise medial verstanden werden. „Demütigt euch“ ist im Deutschen natürlich und bewahrt den Aufruf zur freiwilligen Selbsterniedrigung.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ gibt die relationale und gegenwartsbezogene Bedeutung knapp und idiomatisch wieder; die ausführlichere Möglichkeit „in der Gegenwart“ wird in einer Fußnote genannt.
- source_word: κυρίου
  choice: dem Herrn
  rationale: Die bestimmte Bezeichnung wird natürlich deutsch wiedergegeben, ohne den im Kontext nicht eindeutig festgelegten Referenten näher als der griechische Text zu bestimmen.
- source_word: ὑψώσει
  choice: wird … erhöhen
  rationale: Das Verb bezeichnet hier bildlich die Erhöhung beziehungsweise Ehrung als Gegenstück zur Demütigung. „Erhöhen“ bewahrt diesen gehobenen theologischen und ethischen Sinn.
- source_word: ὑμᾶς
  choice: euch
  rationale: „Euch“ gibt das Objekt der zweiten Person Plural eindeutig wieder.
theological_decisions:
- issue: Referent von „der Herr“
  choice: „dem Herrn“, ohne nähere Bestimmung
  alternative: „vor Gott“ oder „vor dem Herrn Jesus“
  rationale: Jakobus kann κύριος sowohl auf Gott als auch auf Jesus beziehen. Der unmittelbare Satz entscheidet dies nicht eindeutig; daher bleibt die Spannung des Ausgangstextes erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Imperativ richtet sich erkennbar an mehrere Personen; „dann“ stellt den Folgezusammenhang natürlich dar, ohne eine zusätzliche Bedingung einzuführen.
