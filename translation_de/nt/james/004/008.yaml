id: JAS.4.8
reference: James 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: de
  text: Nähert euch Gott, und er wird sich euch nähern. Reinigt eure Hände, ihr Sünder, und läutert eure Herzen, ihr Zwiespältigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „ihr Doppelseeligen“. Gemeint sind Menschen, deren innere Ausrichtung oder Loyalität geteilt ist.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Nähert euch
  rationale: Der Aoristimperativ fordert die Angesprochenen unmittelbar auf, zu Gott zu kommen. „Sich nähern“ ist im modernen Deutschen natürlich und bewahrt zugleich den geistlich-relationalen Sinn sowie die Parallele zum folgenden Verb.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet nach ἐγγίζω denjenigen, dem man sich nähert; die deutsche Konstruktion „sich Gott nähern“ gibt dies direkt wieder.
- source_word: ἐγγιεῖ
  choice: er wird sich euch nähern
  rationale: Das Futur mit Gott als erschlossenem Subjekt wird ausdrücklich wiedergegeben. Die Wiederholung von „sich nähern“ erhält den griechischen Parallelismus.
- source_word: καθαρίσατε
  choice: Reinigt
  rationale: Der Aoristimperativ hat scharfe Aufforderungskraft. „Reinigt“ lässt sowohl kultische als auch ethisch-moralische Anklänge offen.
- source_word: χεῖρας
  choice: eure Hände
  rationale: Das im Griechischen nicht eigens ausgedrückte Possessivpronomen ist im Deutschen bei dieser direkten Anrede idiomatisch. Das Bild der Hände bleibt erhalten und kann auf das äußere Handeln verweisen, ohne es auszudeuten.
- source_word: ἁμαρτωλοί
  choice: ihr Sünder
  rationale: Der pluralische Vokativ wird als direkte, eindringliche Anrede wiedergegeben.
- source_word: ἁγνίσατε
  choice: läutert
  rationale: „Läutert“ bezeichnet das Reinmachen beziehungsweise Reinwerden im sittlich-inneren Sinn und wahrt gegenüber καθαρίσατε eine erkennbare lexikalische Variation.
- source_word: καρδίας
  choice: eure Herzen
  rationale: „Herzen“ bewahrt das biblische Bild für das innere Leben, die Beweggründe und die Ausrichtung des Menschen; „eure“ ist im Deutschen idiomatisch ergänzt.
- source_word: δίψυχοι
  choice: ihr Zwiespältigen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen mit geteilter innerer Ausrichtung oder Loyalität. „Zwiespältige“ ist verständlich und bewahrt die scharfe Anrede, ohne die ungewöhnliche griechische Wortbildung unnatürlich nachzuahmen.
theological_decisions:
- issue: Bildhafte Sprache der moralischen Aufforderung
  choice: Die Bilder von Händen und Herzen bleiben unaufgelöst stehen.
  alternative: Als äußeres Handeln und innere Beweggründe paraphrasieren.
  rationale: Jakobus verwendet Reinigungssprache, die ethische und möglicherweise kultische Anklänge trägt. Eine Ausdeutung im Haupttext würde diese Spannung vorschnell festlegen.
- issue: Wiedergabe von δίψυχοι
  choice: Im Haupttext steht „ihr Zwiespältigen“; die wörtliche Bildprägung wird in der Fußnote erläutert.
  alternative: „ihr Doppelseeligen“ oder „ihr Menschen mit geteilter Seele“ im Haupttext.
  rationale: Das griechische Wort beschreibt geteilte innere Loyalität. „Zwiespältige“ ist für heutige Leser verständlich; die Fußnote bewahrt das auffällige Ausgangsbild.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter imperativischer Schärfe. Der Satzbau folgt dem griechischen Parallelismus. Die körperlichen Bilder und die Spannung zwischen äußerer Reinigung und innerer Läuterung bleiben erhalten.
