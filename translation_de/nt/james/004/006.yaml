id: JAS.4.6
reference: James 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: de
  text: 'Doch er gibt größere Gnade. Darum heißt es[a]: »Gott stellt sich den Hochmütigen entgegen, den Demütigen aber gibt er Gnade.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Darum sagt er« oder: »Darum sagt die Schrift«. Im Griechischen bleibt das Subjekt von »sagt« unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: größere
  rationale: Bewahrt die komparative Bedeutung und verbindet sich im Deutschen natürlich mit »Gnade«.
- source_word: δίδωσιν χάριν
  choice: gibt Gnade
  rationale: Gibt die Verb-Objekt-Verbindung unmittelbar wieder und erhält ihre Wiederholung im Vers.
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet knapp und idiomatisch die Folgerung aus der vorausgehenden Aussage.
- source_word: λέγει
  choice: heißt es
  rationale: Lässt das im Griechischen unausgesprochene Subjekt unbestimmt und eignet sich natürlich zur Einleitung eines Schriftzitats.
- source_word: ὑπερηφάνοις
  choice: den Hochmütigen
  rationale: Gibt das substantivierte Adjektiv wieder und bezeichnet treffend stolze, überhebliche Menschen.
- source_word: ἀντιτάσσεται
  choice: stellt sich … entgegen
  rationale: Bringt die aktive Gegenstellung des Verbs deutlich und in natürlichem Deutsch zum Ausdruck.
- source_word: ταπεινοῖς
  choice: den Demütigen
  rationale: Bewahrt den ethischen Gegensatz zu den Hochmütigen, ohne den Sinn auf gesellschaftlich Niedrige einzuengen.
- source_word: δὲ
  choice: Doch / aber
  rationale: Gibt die kontrastive Funktion an beiden Stellen des Verses idiomatisch wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt bei λέγει
  choice: Darum heißt es
  alternative: Darum sagt er / Darum sagt die Schrift
  rationale: Das Griechische nennt kein ausdrückliches Subjekt. Die unpersönliche Form wahrt diese Offenheit und signalisiert zugleich ein Schriftzitat, ohne dessen Sprecher ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Größere Gnade« erhält den Vergleich, und »stellt sich … entgegen« macht die aktive Opposition anschaulich, ohne den Text auszudeuten.
