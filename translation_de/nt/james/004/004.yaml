source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: de
  text: Ihr Ehebrecherinnen[a], wisst ihr nicht, dass Freundschaft mit der Welt Feindschaft gegen Gott ist? Wer also ein Freund der Welt sein will, wird zum Feind Gottes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort ist feminin und bedeutet wörtlich „Ehebrecherinnen“. Wahrscheinlich ist geistliche Untreue gegenüber Gott gemeint, wie sie schon die Propheten mit Ehebruch verglichen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „macht sich zum Feind Gottes“. „Die Welt“ meint hier die von Gott abgewandte menschliche Ordnung und Wertausrichtung, nicht die Schöpfung an sich.'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: Ihr Ehebrecherinnen
  rationale: Der feminine Vokativ Plural wird konkret und scharf wiedergegeben. Wahrscheinlich bezeichnet er bildhaft geistliche beziehungsweise bundestheologische Untreue; diese Deutung wird jedoch nicht an die Stelle des griechischen Ausdrucks gesetzt.
- source_word: οὐκ οἴδατε
  choice: wisst ihr nicht
  rationale: Die geläufige deutsche rhetorische Frage bewahrt Form und Nachdruck des Griechischen.
- source_word: φιλία τοῦ κόσμου
  choice: Freundschaft mit der Welt
  rationale: „Freundschaft“ entspricht φιλία und erhält die Wortbeziehung zu φίλος („Freund“) im Folgesatz. „Die Welt“ bleibt bewusst unausgedeutet im Haupttext.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: Feindschaft gegen Gott
  rationale: Die Formulierung gibt den Genitiv im Zusammenhang plausibel als gegen Gott gerichtete Feindschaft wieder und klingt im heutigen Deutsch natürlich.
- source_word: ὃς ἐὰν οὖν βουληθῇ
  choice: Wer also … sein will
  rationale: „Wer“ gibt die verallgemeinernde Relativkonstruktion wieder, „also“ den Folgerungscharakter von οὖν und „will“ die bewusste Willensausrichtung von βούλομαι.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: ein Freund der Welt sein
  rationale: Die nominale Ausdrucksweise und der Gegensatz zwischen Freundschaft mit der Welt und Feindschaft gegen Gott bleiben erhalten.
- source_word: ἐχθρὸς τοῦ θεοῦ καθίσταται
  choice: macht sich zum Feind Gottes
  rationale: Die Wendung bringt sowohl den eintretenden Status als auch die im Kontext betonte willentliche Ausrichtung des Subjekts zum Ausdruck. „Wird zum Feind Gottes“ bleibt als mögliche, weniger agentive Wiedergabe in der Fußnote erhalten.
theological_decisions:
- issue: Bildhafte Bedeutung von μοιχαλίδες
  choice: Den wörtlichen, femininen Ausdruck „Ihr Ehebrecherinnen“ im Haupttext beibehalten.
  alternative: „Ihr Untreuen“ oder „Ihr ehebrecherischen Menschen“
  rationale: Der Ausdruck greift wahrscheinlich die prophetische Bildsprache geistlicher beziehungsweise bundesbezogener Untreue auf. Eine neutralisierende Umschreibung würde jedoch die auffällige feminine Form und die Härte des Ausgangstextes verdecken.
- issue: Bedeutung von κόσμος
  choice: Im Haupttext „die Welt“ verwenden.
  alternative: „die gottfeindliche Weltordnung“
  rationale: Im Zusammenhang bezeichnet κόσμος die menschliche Ordnung und Wertausrichtung im Widerstand gegen Gott, nicht die Schöpfung als solche. Diese Einordnung gehört in die Fußnote, damit der Haupttext die Breite des griechischen Ausdrucks wahrt.
- issue: Genitiv bei ἔχθρα τοῦ θεοῦ
  choice: „Feindschaft gegen Gott“
  alternative: „Feindschaft mit Gott“
  rationale: Der Zusammenhang legt eine gegen Gott gerichtete Feindschaft nahe. Die alternative Genitivauffassung ist grammatisch möglich, wirkt im Deutschen aber weniger eindeutig.
- issue: Handlungsanteil in καθίσταται
  choice: „macht sich zum Feind Gottes“
  alternative: „wird zum Feind Gottes“
  rationale: Die gewählte Formulierung verbindet das Eintreten in einen Status mit dem zuvor genannten bewussten Wollen. Da das Verb auch schlichter resultativ verstanden werden kann, wird die Alternative vermerkt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem und rhetorisch zugespitztem Ton. Die direkte Anrede und der Gegensatz „Freund/Freundschaft“ gegenüber „Feind/Feindschaft“ werden bewahrt; erklärende theologische Präzisierungen stehen nur in den Fußnoten.
