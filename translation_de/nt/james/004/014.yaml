id: JAS.4.14
reference: James 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: de
  text: Ihr wisst nicht, was morgen sein wird. Was ist euer Leben? Denn ihr seid ein Dunst[a], der für kurze Zeit sichtbar wird und dann verschwindet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dampf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθε
  choice: wisst
  rationale: Das Verb bezeichnet hier das Wissen um die Zukunft; „wissen“ ist im Deutschen direkt und natürlich.
- source_word: τὸ τῆς αὔριον
  choice: was morgen sein wird
  rationale: Die elliptische Wendung meint das, was den morgigen Tag betrifft. Die Formulierung bewahrt die Zukunftsoffenheit, ohne sie unnötig auszudeuten.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Was ist euer Leben?
  rationale: Die knappe rhetorische Frage bewahrt die Frage nach Wesen und Beschaffenheit des menschlichen Lebens.
- source_word: ἀτμὶς
  choice: Dunst
  rationale: „Dunst“ bezeichnet etwas Flüchtiges und nur vorübergehend Sichtbares und trägt damit das Bild der Vergänglichkeit; „Dampf“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: πρὸς ὀλίγον
  choice: für kurze Zeit
  rationale: Die Wendung bezeichnet eine begrenzte, kurze Dauer und wird idiomatisch wiedergegeben.
- source_word: φαινομένη
  choice: sichtbar wird
  rationale: Das Partizip beschreibt das zeitweilige Sichtbarwerden des Dunstes; diese Wiedergabe macht den Bildablauf klar.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: und dann verschwindet
  rationale: Die zeitliche Abfolge und das anschließende Unsichtbarwerden werden knapp und bildhaft wiedergegeben.
theological_decisions:
- issue: Bildhafte Aussage über die Vergänglichkeit des menschlichen Lebens
  choice: Das Bild vom kurz sichtbaren und dann verschwindenden Dunst bleibt als rhetorische Aussage über Kürze und Ungewissheit des Lebens erhalten.
  alternative: 'Deutender formulieren: „Euer Leben ist vergänglich.“'
  rationale: Die Bildsprache des griechischen Textes soll nicht in eine abstrakte Lehr Aussage aufgelöst oder um zusätzliche Aussagen über Tod, Gericht oder Vorsehung erweitert werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Bildsprache. „Doch“ gibt den mahnenden Anschluss und die rhetorische Zuspitzung natürlich wieder. Der Fußnotenmarker steht beim tatsächlich erläuterten Bildwort.
