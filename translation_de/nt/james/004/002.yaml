source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: de
  text: Ihr begehrt[a] und habt nichts; ihr mordet[b] und seid neidisch[c] und könnt nichts erlangen; ihr streitet und führt Krieg. Ihr habt nichts, weil ihr nicht bittet.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr verlangt heftig“; das griechische Wort bezeichnet ein starkes Verlangen, das hier im Zusammenhang als verkehrt erscheint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr tötet“. Das griechische Verb bedeutet gewöhnlich genauer „morden“. Manche verstehen die Aussage rhetorisch oder bildlich; die Übersetzung bewahrt jedoch den starken Wortsinn.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihr seid eifersüchtig“.'
    reason: lexical_alternative
  - marker: d
    text: Gemeint ist dem Zusammenhang nach, dass sie Gott nicht bitten; im griechischen Text wird das Objekt hier jedoch nicht ausdrücklich genannt.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: ihr begehrt
  rationale: ἐπιθυμέω bezeichnet ein starkes Verlangen, das hier durch den Zusammenhang als fehlgeleitet erscheint. „Begehren“ bewahrt diese Stärke und moralische Färbung, ohne den Sinn auf sexuelles Verlangen oder fremdes Eigentum zu verengen.
- source_word: ἔχετε
  choice: ihr habt
  rationale: Die einfache und natürliche Wiedergabe von ἔχω wahrt die knappe Aussage des griechischen Textes.
- source_word: φονεύετε
  choice: ihr mordet
  rationale: φονεύω bezeichnet gewöhnlich nicht bloß irgendein Töten, sondern Mord. Die starke, anklagende Formulierung des Ausgangstextes bleibt daher erhalten.
- source_word: ζηλοῦτε
  choice: ihr seid neidisch
  rationale: ζηλόω kann Eifer, Eifersucht oder Neid ausdrücken. Der feindselige Zusammenhang und die Verbindung mit unerfülltem Begehren sprechen hier für den negativen Sinn „neidisch sein“.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: ihr könnt nichts erlangen
  rationale: Die Wendung bezeichnet das Unvermögen, das Begehrte zu erreichen oder zu erhalten. „Nichts erlangen“ ist im Deutschen knapp, verständlich und dem Zusammenhang angemessen.
- source_word: μάχεσθε
  choice: ihr streitet
  rationale: μάχομαι kann körperliches Kämpfen oder Streiten bezeichnen. „Streiten“ ist hier natürlich und lässt zusammen mit dem folgenden „Krieg führen“ die Steigerung der beiden Verben erkennen.
- source_word: πολεμεῖτε
  choice: ihr führt Krieg
  rationale: πολεμέω verwendet ausdrücklich die Sprache des Krieges und ist stärker als μάχομαι. „Krieg führen“ bewahrt diese Zuspitzung.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: weil ihr nicht bittet
  rationale: διά mit dem substantivierten Infinitiv drückt den Grund aus. Das schlichte „bitten“ gibt αἰτέω natürlich wieder; die angesprochene Person wird wie im Griechischen nicht ausdrücklich genannt.
theological_decisions:
- issue: Ob φονεύετε wegen einer möglichen rhetorischen oder bildlichen Deutung abgeschwächt werden soll
  choice: Die starke Haupttextwiedergabe „ihr mordet“ bleibt erhalten.
  alternative: „ihr tötet“ oder die deutende Erweiterung „ihr mordet in euren Herzen“
  rationale: Der griechische Ausdruck selbst ist stark. Ob Jakobus wörtlich, rhetorisch oder anspielend spricht, ist eine Frage der Auslegung und soll nicht durch eine Abschwächung oder Erweiterung im Haupttext entschieden werden.
- issue: Ob bei αἰτεῖσθαι Gott als Objekt ausdrücklich ergänzt werden soll
  choice: 'Das Objekt bleibt unausgesprochen: „weil ihr nicht bittet“.'
  alternative: „weil ihr Gott nicht bittet“
  rationale: Aus dem Zusammenhang ist Gott als derjenige, an den sich die Bitte richtet, naheliegend. Da er in diesem Vers jedoch nicht ausdrücklich als Objekt genannt wird, bewahrt die Übersetzung die implizite Formulierung.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem, anklagendem Ton. Die kurzen Parallelsätze und die Steigerung von „streiten“ zu „Krieg führen“ bilden die Schärfe und den Rhythmus des griechischen Textes nach. Die Zeichensetzung fasst die drei Konfliktaussagen eng zusammen, ohne ihre Eigenständigkeit aufzuheben.
