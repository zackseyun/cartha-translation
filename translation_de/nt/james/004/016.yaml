id: JAS.4.16
reference: James 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: de
  text: Jetzt aber prahlt ihr mit euren Anmaßungen.[a] Jedes derartige Prahlen ist böse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit euren Überheblichkeiten“, „mit euren selbstsicheren Behauptungen“ oder, dem Zusammenhang entsprechend, „mit euren überheblichen Plänen“. Das griechische Wort bezeichnet anmaßende Selbstüberschätzung und kann hier besonders auf die selbstsicheren Pläne der vorhergehenden Verse zielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Jetzt aber
  rationale: Gibt den gegenwärtigen Gegensatz zur demütigen Haltung in Vers 15 unmittelbar und natürlich wieder, ohne den zeitlichen Ausdruck zu einer bloßen Zustandsformel umzudeuten.
- source_word: καυχᾶσθε
  choice: prahlt ihr
  rationale: „Prahlen“ trifft den negativen Sinn des Verbs und hält die Wortverwandtschaft mit καύχησις durch die Wiederholung im zweiten Satz erkennbar.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: mit euren Anmaßungen
  rationale: „Anmaßungen“ bewahrt den Plural und bezeichnet selbstüberhebliches Auftreten beziehungsweise selbstsichere Ansprüche. Es bleibt näher am griechischen Ausdruck als die kontextuell mögliche, aber stärker auslegende Wiedergabe „überheblichen Plänen“.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Jedes derartige Prahlen
  rationale: 'Bewahrt die distributive Kraft von πᾶσα und den qualitativen Rückbezug von τοιαύτη: Prahlen dieser Art.'
- source_word: πονηρά
  choice: böse
  rationale: Drückt das moralische Urteil des Textes klar aus und vermeidet die Abschwächung zu „schlecht“.
theological_decisions:
- issue: Gegenstand des verurteilten Prahlens
  choice: Die Formulierung verurteilt anmaßendes Prahlen; der Zusammenhang bezieht es besonders auf selbstsichere Zukunftspläne ohne Unterordnung unter den Willen des Herrn.
  alternative: Eine ausdrückliche Wiedergabe als „überhebliche Pläne“ oder eine allgemeine Verurteilung jedes Selbstvertrauens.
  rationale: Der unmittelbare Kontext in 4,13–15 bestimmt die konkrete Anwendung, doch ἀλαζονεία bezeichnet zunächst anmaßende Selbstüberhebung und nicht ausdrücklich „Pläne“. Die Übersetzung lässt daher die lexikalische Weite und die kontextuelle Zuspitzung nebeneinander bestehen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Ton. „Anmaßungen“ ist bewusst etwas gehobener, aber allgemein verständlich; die Fußnote erschließt die Bedeutungsbreite und die kontextuelle Möglichkeit.
