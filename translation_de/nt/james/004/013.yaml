source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: de
  text: 'Nun denn, ihr, die ihr sagt: »Heute oder morgen werden wir in diese Stadt[a] reisen, dort ein Jahr verbringen, Handel treiben und Gewinn machen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »in die und die Stadt«. Im Griechischen steht »in diese Stadt«; damit wird auf eine bestimmte Stadt im Plan der Sprecher verwiesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Nun zu euch
  rationale: Die Wendung dient als eindringlicher Aufmerksamkeitsruf und leitet eine Zurechtweisung ein. »Nun zu euch« gibt die direkte Anrede im modernen Deutschen natürlich und bestimmt wieder.
- source_word: οἱ λέγοντες
  choice: die ihr sagt
  rationale: Das substantivierte Partizip ist hier als direkte Anrede zu verstehen. Die zweite Person bewahrt die konfrontative Wirkung besser als die distanziertere Form »diejenigen, die sagen«.
- source_word: Σήμερον ἢ αὔριον
  choice: Heute oder morgen
  rationale: ἤ ist disjunktiv; »oder« bewahrt die Aussage über eine geplante Abreise an einem der beiden nahen Zeitpunkte.
- source_word: πορευσόμεθα
  choice: werden wir … reisen
  rationale: πορεύομαι bezeichnet hier die Bewegung zu einer Stadt. »Reisen« passt zum geschäftlichen Aufenthalt und klingt im Deutschen natürlicher als ein bloßes »gehen«.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: in diese Stadt
  rationale: Die Demonstrativform τήνδε bezeichnet die konkrete Stadt im vorgestellten Plan der Sprecher. Die wörtlichere Fassung bewahrt diese Bestimmtheit; die idiomatischere Möglichkeit wird in einer Fußnote genannt.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: dort ein Jahr verbringen
  rationale: ποιέω mit einer Zeitangabe bedeutet idiomatisch, einen Zeitraum zu verbringen. Die deutsche Formulierung gibt den Sinn klar und natürlich wieder.
- source_word: ἐμπορευσόμεθα
  choice: Handel treiben
  rationale: Das Verb bezeichnet kaufmännische oder kommerzielle Tätigkeit. »Handel treiben« ist präzise, verständlich und stilistisch passend.
- source_word: κερδήσομεν
  choice: Gewinn machen
  rationale: Im Zusammenhang mit Handel meint das Verb finanziellen Gewinn. »Gewinn machen« erhält den kaufmännischen Bezug und die selbstsichere Zukunftsplanung.
theological_decisions:
- issue: Ton der direkten Zurechtweisung
  choice: 'Direkte Anrede: »Nun zu euch, die ihr sagt«'
  alternative: 'Unpersönlichere Beschreibung: »Nun aber, ihr, die sagen« oder »diejenigen, die sagen«'
  rationale: Jakobus beschreibt die Planenden nicht nur, sondern spricht sie unmittelbar an. Die direkte Anrede bewahrt die rhetorische Schärfe, ohne den späteren theologischen Einwand gegen ihre Selbstsicherheit vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter rhetorischer Ansprache. Die Zukunftsformen und die Abfolge der selbstsicheren Vorhaben bleiben erhalten; die Bewertung dieser Planung wird nicht vorweggenommen.
