source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: de
  text: Oder meint ihr, die Schrift rede vergeblich? Der Geist, den er in uns wohnen ließ, sehnt sich mit Eifersucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Geist, den er in uns wohnen ließ, sehnt sich mit Neid“; auch möglich: „Der menschliche Geist, den er in uns wohnen ließ, verlangt bis zum Neid.“ Das Griechische kann sowohl den Heiligen Geist als auch den menschlichen Geist meinen; die Wendung „mit Eifersucht“ kann auch „mit Neid“ oder „bis zum Neid“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: vergeblich
  rationale: Das Adverb bezeichnet hier ein Reden ohne Wirkung oder Zweck. „Vergeblich“ gibt die rhetorische Frage knapp, würdig und idiomatisch wieder.
- source_word: ἡ γραφὴ
  choice: die Schrift
  rationale: Der Singular mit Artikel bezeichnet die autoritative Schrift; „die Schrift“ ist dafür die etablierte deutsche Wiedergabe.
- source_word: Πρὸς φθόνον
  choice: mit Eifersucht
  rationale: Die adverbiale Wiedergabe erhält die schwierige Verbindung mit ἐπιποθεῖ. „Eifersucht“ kann im Kontext eines berechtigten Anspruchs stehen, während „Neid“ im Deutschen fast ausschließlich negativ klingt; die Alternative wird in der Fußnote genannt.
- source_word: ἐπιποθεῖ
  choice: sehnt sich … nach uns
  rationale: Das Verb bezeichnet starkes Verlangen oder Sehnen. Das im Deutschen erforderliche Bezugswort „nach uns“ wird aus dem Zusammenhang ergänzt, ohne die im Griechischen vorhandene Spannung aufzulösen.
- source_word: τὸ πνεῦμα
  choice: Der Geist
  rationale: Die Großschreibung folgt im Haupttext der möglichen Deutung als Heiliger Geist. Da das Griechische ebenso den menschlichen Geist meinen kann, wird diese echte Mehrdeutigkeit ausdrücklich in der Fußnote bewahrt.
- source_word: κατῴκισεν
  choice: wohnen ließ
  rationale: 'Die Form ist kausativ und rückblickend: Gott ließ den Geist in uns Wohnung nehmen. „Wohnen ließ“ bewahrt diesen Sinn in natürlichem Deutsch.'
- source_word: ἐν ἡμῖν
  choice: in uns
  rationale: Die Wendung bezeichnet hier am ehesten ein Innewohnen; die unmittelbare Wiedergabe „in uns“ lässt zugleich die Frage nach dem Referenten des Geistes offen.
theological_decisions:
- issue: Referent von τὸ πνεῦμα
  choice: Im Haupttext ist der Heilige Geist gemeint.
  alternative: Der menschliche Geist, den Gott in uns wohnen ließ.
  rationale: Die Sprache vom Wohnenlassen in uns passt zur neutestamentlichen Rede vom göttlichen Geist, doch Grammatik und Wortlaut entscheiden die Frage nicht eindeutig. Deshalb bleibt die alternative Deutung in der Fußnote sichtbar.
- issue: Moralische Färbung von φθόνος
  choice: „mit Eifersucht“ als Ausdruck eines ausschließlichen, berechtigten Anspruchs
  alternative: „neidisch“ oder „bis zum Neid“
  rationale: Bei der Deutung auf den Heiligen Geist vermeidet „Eifersucht“ die vorschnelle Zuschreibung sündhaften Neides. Weil φθόνος gewöhnlich auch „Neid“ bedeuten kann, wird diese Schwierigkeit nicht verschwiegen.
- issue: Unausgesprochenes Objekt von ἐπιποθεῖ
  choice: „nach uns“ wird im Haupttext ergänzt.
  alternative: „Der Geist … sehnt sich eifersüchtig“ ohne genanntes Objekt; oder der menschliche Geist „verlangt bis zum Neid“.
  rationale: Das deutsche Verb „sich sehnen“ verlangt hier idiomatisch eine Ergänzung. „Nach uns“ entspricht der Deutung des Geistes als Gottes Geist und seines Anspruchs auf die Glaubenden, während die Fußnote die anders mögliche Satzauffassung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp. Der Haupttext bietet eine gut lesbare Deutung, während die Fußnote die außergewöhnliche grammatische und theologische Mehrdeutigkeit des griechischen Satzes offenlegt.
