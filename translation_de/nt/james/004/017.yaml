id: JAS.4.17
reference: James 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: de
  text: Wer also weiß, Gutes zu tun, und es nicht tut, für den ist es Sünde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδότι
  choice: wer weiß
  rationale: Das substantivisch gebrauchte Partizip im Dativ bezeichnet allgemein die Person, die weiß. Die deutsche Konstruktion mit „wer“ gibt diesen generischen Personenbezug natürlich wieder.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet eine Folgerung aus dem vorangehenden Gedankengang. „Also“ ist im modernen Deutsch natürlich und wahrt den logischen Anschluss.
- source_word: καλὸν
  choice: Gutes
  rationale: καλόν bezeichnet hier das moralisch Gute beziehungsweise Richtige. Das substantivierte „Gutes“ bewahrt die breite ethische Bedeutung, ohne den Gegenstand unnötig einzuengen.
- source_word: ποιεῖν
  choice: zu tun
  rationale: Der Infinitiv verbindet sich mit καλόν im Sinn von „Gutes tun“. Diese Wiedergabe ist direkt und idiomatisch.
- source_word: μὴ ποιοῦντι
  choice: und es nicht tut
  rationale: Das Partizip stellt dem Wissen das unterlassene Handeln gegenüber. „Es“ greift das zuvor genannte Gute natürlich auf.
- source_word: ἁμαρτία
  choice: Sünde
  rationale: Das artikellose Prädikatsnomen kennzeichnet die Unterlassung als Sünde. Der deutsche Nullartikel in „es ist Sünde“ bewahrt den qualitativen Aussagewert.
- source_word: αὐτῷ
  choice: für den
  rationale: Der Dativ bezeichnet die Person, in Bezug auf die die Unterlassung Sünde ist. „Für den“ entspricht idiomatisch dem durch „wer“ eröffneten Relativsatz.
- source_word: ἐστιν
  choice: ist es
  rationale: Die Kopula verbindet die unterlassene gute Handlung mit der Bezeichnung „Sünde“; die deutsche Wortstellung dient dem natürlichen Satzfluss.
theological_decisions:
- issue: Reichweite der Aussage über unterlassenes Gutes
  choice: Die Formulierung erklärt das wissentlich unterlassene Gute zur Sünde und bleibt grundsätzlich formuliert.
  alternative: Die Aussage ausschließlich auf das selbstsichere Planen im unmittelbaren Zusammenhang zu begrenzen.
  rationale: Der unmittelbare Kontext betrifft selbstsicheres Planen ohne Rücksicht auf Gott; der Vers ist jedoch allgemein und spruchartig formuliert. Die Übersetzung bewahrt sowohl den Kontextbezug als auch die mögliche breitere ethische Tragweite, ohne eine bestimmte Lehrtradition einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Struktur und die Wiederholung von „tun“ spiegeln die pointierte Gegenüberstellung des griechischen Satzes. Keine Fußnote ist nötig, da „also“ die Funktion von οὖν klar wiedergibt und die mögliche alternative Satzgestaltung keine wesentliche Bedeutungsvariante erzeugt.
