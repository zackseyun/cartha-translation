id: JAS.4.1
reference: James 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: de
  text: Woher kommen Kriege und woher kommen Kämpfe unter euch?[a][b] Kommen sie nicht daher – aus euren Begierden,[c] die in euren Gliedern[d] Krieg führen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Konflikte … Streitigkeiten“. Im Griechischen stehen militärische Begriffe, wörtlich „Kriege“ und „Kämpfe“, als Bild für Auseinandersetzungen in der Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in euch“. Die griechische Wendung kann sowohl Konflikte unter den Angesprochenen als auch Konflikte in ihnen bezeichnen. Der ganze Vers verbindet äußeren Streit mit inneren Begierden.'
    reason: alternative_reading
  - marker: c
    text: 'Das griechische Wort bezeichnet Freuden oder Genüsse und kann im Zusammenhang auch das Verlangen nach ihnen meinen; möglich wäre daher auch: „aus eurem Verlangen nach Genuss“.'
    reason: lexical_alternative
  - marker: d
    text: „Glieder“ ist wörtlich. Gemeint sein können die Körperteile oder, weiter gefasst, die im Menschen wirkenden Kräfte und Fähigkeiten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: Woher kommen
  rationale: Bewahrt das wiederholte Fragewort und die rhetorische Frage nach dem Ursprung; die Wiederholung klingt auch im heutigen Deutsch eindringlich und natürlich.
- source_word: πόλεμοι
  choice: Kriege
  rationale: Gibt den militärischen Ausdruck wörtlich wieder und erhält das zugespitzte Bild für schwere Auseinandersetzungen in der Gemeinschaft.
- source_word: μάχαι
  choice: Kämpfe
  rationale: Unterscheidet den zweiten militärischen Begriff von „Kriege“, ohne ihn vorschnell auf bloße Wortstreitigkeiten einzuengen.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Im Zusammenhang bezeichnet die Wendung am ehesten Konflikte innerhalb der angesprochenen Gemeinschaft; die mögliche innere Bedeutung wird in einer Fußnote offengehalten.
- source_word: οὐκ ἐντεῦθεν
  choice: Kommen sie nicht daher
  rationale: Ergänzt im Deutschen das im Griechischen elliptisch vorausgesetzte Verb und bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: ἡδονῶν
  choice: Begierden
  rationale: Bezeichnet hier auf Genuss gerichtete, selbstbezogene Verlangen. „Begierden“ ist im modernen Deutsch natürlicher als das wörtlichere „Vergnügungen“ und kann als handelnde Kraft Krieg führen; die Genusskomponente wird in der Fußnote erläutert.
- source_word: στρατευομένων
  choice: die … Krieg führen
  rationale: Erhält die aktive, fortdauernde militärische Bildsprache und greift „Kriege“ aus der ersten Satzhälfte wieder auf.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: in euren Gliedern
  rationale: Bewahrt die körperliche Metapher und lässt offen, ob konkrete Körperteile oder umfassender die Kräfte und Fähigkeiten des Menschen gemeint sind.
theological_decisions:
- issue: Bezeichnet ἐν ὑμῖν äußere Konflikte in der Gemeinschaft oder innere Konflikte?
  choice: Die erste Wendung wird mit „unter euch“ gemeinschaftlich, die spätere mit „in euren Gliedern“ innerlich-körperlich wiedergegeben.
  alternative: Beide Wendungen könnten stärker verinnerlicht werden, etwa „in euch“ und „in eurem Inneren“.
  rationale: Der Vers verbindet sichtbare Auseinandersetzungen mit Begierden im Menschen. Die Übersetzung erhält beide Ebenen, statt den Text ausschließlich sozial oder ausschließlich psychologisch zu deuten.
- issue: Wie ist ἡδονῶν moralisch zu verstehen?
  choice: „Begierden“ gibt das auf Genuss gerichtete Verlangen wieder, ohne eine bestimmte Art von Lust festzulegen.
  alternative: „Vergnügungen“, „Genusssüchte“ oder „Lüste“.
  rationale: Der Kontext bewertet diese Kräfte durch ihre kriegerische Wirkung negativ, nennt aber weder ausschließlich sexuelle Begierde noch eine bestimmte Sünde. Die Übersetzung vermeidet eine solche Einengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener militärischer Bildsprache. Die zweimalige Formulierung „woher kommen“ bildet die griechische Wiederholung ab. Der Gedankenstrich markiert die nachgestellte Antwortquelle, ohne die knappe rhetorische Bewegung des Originals aufzulösen.
