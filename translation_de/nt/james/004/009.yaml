  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: de
  text: Fühlt euch elend[a], trauert und weint. Euer Lachen verwandle sich in Trauer und eure Freude in Niedergeschlagenheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid elend“ oder „Seid tief bekümmert“. Das griechische Verb bezeichnet einen Zustand des Elends oder der Bedrängnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bedrücktheit“. Gemeint ist eine niedergeschlagene, verdüsterte Gemütslage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Fühlt euer Elend
  rationale: Der Aoristimperativ fordert nachdrücklich dazu auf, sich dem eigenen elenden, bedrängten Zustand zu stellen. Die Formulierung ist im Deutschen verständlich und bewahrt die Härte des Aufrufs, ohne das Verb mit den folgenden Aufforderungen zum Trauern und Weinen gleichzusetzen.
- source_word: πενθήσατε
  choice: trauert
  rationale: Das Verb bezeichnet ernstes Trauern und trägt im Zusammenhang den Klang reuiger Umkehr.
- source_word: κλαύσατε
  choice: weint
  rationale: Die konkrete Aufforderung zum Weinen bewahrt die Steigerung nach dem allgemeineren Trauern.
- source_word: ὁ γέλως ὑμῶν εἰς πένθος μετατραπήτω
  choice: Euer Lachen soll sich in Trauer verwandeln
  rationale: Die deutsche Konstruktion gibt den passiven Imperativ als nachdrückliche Aufforderung zur Zustandsänderung wieder und erhält die konkreten Substantive „Lachen“ und „Trauer“.
- source_word: ἡ χαρὰ εἰς κατήφειαν
  choice: eure Freude in Niedergeschlagenheit
  rationale: Das Possessivpronomen wird aus dem parallelen ersten Satzglied sinngemäß ergänzt. „Niedergeschlagenheit“ bezeichnet treffend die nach unten gerichtete, verdüsterte Gemütslage von κατήφεια.
theological_decisions:
- issue: Umkehrsprache und emotionale Schärfe
  choice: Der Vers bleibt ein scharfer Aufruf zu Trauer und Weinen angesichts des eigenen Elends.
  alternative: Eine abgeschwächte Aufforderung zu bloßem Ernst oder zur Besonnenheit.
  rationale: Die Imperative und der Zusammenhang in Jakobus 4,6–10 sprechen für einen eindringlichen Ruf zur demütigen Umkehr. Die Übersetzung bewahrt diese Schärfe, ohne eine weitergehende Lehrdeutung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, eindringlichen Imperativen. „Fühlt euer Elend“ ist bewusst kräftig formuliert; „Niedergeschlagenheit“ ist gegenwärtig verständlich und vermeidet sowohl klinische als auch altertümliche Färbung.
