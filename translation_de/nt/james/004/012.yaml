  naturalness: '„Nur einer ist Gesetzgeber und Richter: der, der …“ ist verständlich, wirkt wegen der doppelten Form „der, der“ aber unnötig schwerfällig. Eine existentielle Formulierung mit Relativsatz ist im modernen Standarddeutsch flüssiger.'
  terminology: „Gesetzgeber“, „Richter“, „retten“ und „vernichten“ sind geeignete, registergerechte Entsprechungen. „Nächster“ ist hier als Entsprechung von πλησίον gegenüber „Mitmensch“ vorzuziehen.
