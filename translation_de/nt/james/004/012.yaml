id: JAS.4.12
reference: James 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: de
  text: Es gibt nur einen Gesetzgeber und Richter, der retten und vernichten kann. Du aber, wer bist du, dass du über deinen Nächsten richtest?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Gesetzgeber
  rationale: Die direkte und im Deutschen natürliche Entsprechung bewahrt Gottes einzigartige Autorität, das Gesetz zu geben.
- source_word: κριτής
  choice: Richter
  rationale: Gibt die richterliche Funktion prägnant und ohne konfessionelle Zusatzdeutung wieder.
- source_word: σῶσαι
  choice: retten
  rationale: Bewahrt den umfassenden Sinn von Rettung, ohne ihn hier enger zu bestimmen.
- source_word: ἀπολέσαι
  choice: vernichten
  rationale: Gibt den starken Gegensatz zu „retten“ wieder; der Infinitiv bezeichnet die Fähigkeit, zugrunde zu richten beziehungsweise zu vernichten.
- source_word: πλησίον
  choice: Mitmenschen
  rationale: Im Kontext ist die andere Person beziehungsweise der Nächste gemeint; „Mitmensch“ ist aktuell und verständlich, ohne die Beziehung unnötig einzuengen.
- source_word: ὁ κρίνων
  choice: dass du … richtest
  rationale: Die idiomatische deutsche Frage gibt das substantivierte Partizip als gegenwärtiges, anmaßendes Richten wieder.
theological_decisions:
- issue: Einzigkeit von Gesetzgeber und Richter
  choice: „Nur einer ist Gesetzgeber und Richter“
  alternative: „Es gibt einen Gesetzgeber und Richter“
  rationale: εἷς ist prädikativ und betont in diesem Zusammenhang die Einzigkeit; „nur einer“ macht diese Aussage im Deutschen klar, ohne den Einen ausdrücklich zu benennen.
- issue: Bedeutungsumfang von ἀπολέσαι
  choice: „vernichten“
  alternative: „verderben“ oder „ins Verderben stürzen“
  rationale: Die starke, bewusst spannungsvolle Gegenüberstellung von retten und vernichten bleibt erhalten; Art und zeitlicher Horizont des Vernichtens werden nicht dogmatisch festgelegt.
- issue: Charakter der Schlussfrage
  choice: „wer bist du, dass du … richtest?“
  alternative: „wer bist du, der du … richtest?“
  rationale: Die idiomatische Form bewahrt den vorwurfsvollen Sinn der griechischen Partizipialkonstruktion, ohne zu behaupten, jede Form menschlicher Beurteilung sei grundsätzlich ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt stellt die folgende Apposition klar heraus; der Gedankenstrich trägt die rhetorische Zuspitzung der Schlussfrage. Keine Fußnoten erforderlich.
