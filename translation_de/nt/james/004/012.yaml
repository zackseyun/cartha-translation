  to: Es gibt nur einen Gesetzgeber und Richter, der retten und vernichten kann. Du aber, wer bist du, dass du über deinen Nächsten richtest?
  rationale: Die Revision glättet die deutsche Satzführung und ersetzt „Mitmenschen“ durch das quellennahe „deinen Nächsten“. Sie bewahrt die rhetorische Zuspitzung und legt weder die Identität des einen Gesetzgebers noch die genaue Tragweite von „vernichten“ über den griechischen Text hinaus fest.
