base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: de
  text: Ihr bittet und empfangt nichts, weil ihr in böser Absicht[a] bittet, um es für eure Vergnügungen[b] auszugeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf falsche Weise“ oder „mit falschen Beweggründen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Begierden“ oder „Leidenschaften“; das Wort kann auch selbstbezogene Wünsche bezeichnen. Wörtlicher ist auch möglich: „in euren Vergnügungen auszugeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: ihr bittet
  rationale: Das Präsens und die direkte Bedeutung des Verbs werden bewahrt; „bitten“ ist im Zusammenhang eines an Gott gerichteten Begehrens natürlich, ohne das im Vers unausgesprochene Objekt ausdrücklich zu ergänzen.
- source_word: οὐ λαμβάνετε
  choice: empfangt nicht
  rationale: „Empfangen“ gibt λαμβάνω in gehobenem, aber allgemein verständlichem Deutsch wieder und erhält die Verbindung zwischen Bitten und Empfangen.
- source_word: διότι
  choice: weil
  rationale: Die Konjunktion leitet den Grund dafür ein, dass die Angesprochenen nicht empfangen.
- source_word: κακῶς
  choice: falsch
  rationale: „Falsch“ bewahrt den weiten moralisch-qualitativen Sinn des Adverbs, ohne ihn vorschnell ausschließlich auf die Beweggründe einzuengen.
- source_word: αἰτεῖσθε
  choice: ihr bittet
  rationale: Die Wiederholung erhält den Parallelismus. Die mediale Form verlangt hier keine ausdrückliche reflexive Wiedergabe.
- source_word: ἵνα
  choice: um
  rationale: Die Infinitivkonstruktion mit „um“ gibt den Zweck des Bittens im Deutschen knapp und natürlich wieder.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: für eure Vergnügungen
  rationale: ἡδονή bezeichnet Vergnügen oder Genuss und kann im Kontext selbstsüchtige Begierden einschließen. „Für“ verbindet die Wendung im Deutschen natürlich mit dem Ausgeben, während eine Fußnote die Bedeutungsbreite nennt.
- source_word: δαπανήσητε
  choice: auszugeben
  rationale: Das Verb bedeutet „aufwenden“ oder „ausgeben“. Die neutrale Wiedergabe vermeidet die stärkere, nicht zwingend im Verb selbst liegende Wertung von „verschwenden“.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass das Bitten an Gott gerichtet ist
  choice: 'Das Objekt bleibt unausgesprochen: „Ihr bittet und empfangt nicht“.'
  alternative: „Ihr bittet Gott und empfangt nicht.“
  rationale: Der Zusammenhang legt Gebet zu Gott nahe, doch der griechische Satz nennt Gott hier nicht ausdrücklich.
- issue: Ob κακῶς ausschließlich als falsche Motivation erklärt werden soll
  choice: Im Haupttext steht das weitere „falsch“.
  alternative: „mit falschen Beweggründen“
  rationale: Das Adverb ist weiter als eine reine Aussage über Motive; der folgende Zwecksatz erläutert, worin das falsche Bitten besteht.
- issue: Wie die negative Färbung von ἡδοναῖς wiederzugeben ist
  choice: „Vergnügungen“ im Haupttext, ergänzt durch eine Fußnote zur möglichen Bedeutung „selbstsüchtige Begierden“.
  alternative: „Begierden“ oder „Leidenschaften“ direkt im Haupttext
  rationale: „Vergnügungen“ liegt nahe an der Grundbedeutung, während der Kontext den selbstbezogenen, moralisch problematischen Charakter erkennen lässt, ohne dass diese Deutung lexikalisch verengt werden muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Anlehnung an Satzbau und Aussage des griechischen Textes. Die Wiederholung von „bittet“ bleibt erhalten; das Zielwort „es“ wird wie im Deutschen erforderlich aus dem Zusammenhang ergänzt, ohne einen konkreten erbetenen Gegenstand festzulegen.
