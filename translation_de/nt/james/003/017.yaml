id: JAS.3.17
reference: James 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: de
  text: Die Weisheit von oben aber ist zuerst rein, dann friedfertig, gütig, bereit, sich überzeugen zu lassen, voller Erbarmen und guter Früchte, unparteiisch[a] und aufrichtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ungeteilt« beziehungsweise »ohne Unsicherheit oder Zweifel«. Das griechische Wort kann unterschiedlich verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: von oben
  rationale: Bewahrt die räumliche Metapher und den Gegensatz zur irdischen Weisheit in Jakobus 3,15, ohne ausdrücklich »vom Himmel« zu interpretieren.
- source_word: σοφία
  choice: Weisheit
  rationale: Die übliche und im Zusammenhang klare Wiedergabe für die hier beschriebene Art von Weisheit.
- source_word: πρῶτον μὲν
  choice: zuerst
  rationale: Gibt die hervorgehobene erste Eigenschaft in der geordneten Beschreibung knapp und natürlich wieder.
- source_word: ἁγνή
  choice: rein
  rationale: Bezeichnet hier moralische Reinheit und ungeteilte Lauterkeit; »rein« ist verständlich und semantisch breit genug.
- source_word: ἔπειτα
  choice: dann
  rationale: Markiert den Übergang zu den folgenden Eigenschaften.
- source_word: εἰρηνική
  choice: friedfertig
  rationale: Drückt eine auf Frieden ausgerichtete Haltung aus, nicht bloß einen ruhigen Zustand.
- source_word: ἐπιεικής
  choice: gütig
  rationale: Vermittelt die milde, rücksichtsvolle und nicht auf dem eigenen Recht bestehende Haltung des griechischen Ausdrucks in natürlichem Deutsch.
- source_word: εὐπειθής
  choice: bereit, sich überzeugen zu lassen
  rationale: Der seltene Ausdruck bezeichnet Zugänglichkeit und die Bereitschaft, auf vernünftige oder richtige Einwände zu hören, ohne Leichtgläubigkeit zu unterstellen.
- source_word: μεστὴ ἐλέους
  choice: voller Erbarmen
  rationale: Bewahrt sowohl die Vorstellung der Fülle als auch den ethischen und mitfühlenden Gehalt von ἔλεος.
- source_word: καρπῶν ἀγαθῶν
  choice: guter Früchte
  rationale: Erhält den griechischen Plural und die Metapher für sichtbare gute Wirkungen oder Taten.
- source_word: ἀδιάκριτος
  choice: unparteiisch
  rationale: Passt als sozialethische Eigenschaft gut zu Erbarmen, guten Früchten und Aufrichtigkeit sowie zum Thema der Parteilichkeit im Jakobusbrief; die lexikalisch möglichen anderen Deutungen werden in der Fußnote genannt.
- source_word: ἀνυπόκριτος
  choice: aufrichtig
  rationale: Gibt das Fehlen von Heuchelei oder Verstellung in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Deutung von ἀδιάκριτος
  choice: unparteiisch
  alternative: ungeteilt; ohne Unsicherheit oder Zweifel
  rationale: Das Adjektiv ist mehrdeutig. »Unparteiisch« fügt sich in den sozialen und ethischen Zusammenhang und entspricht dem Anliegen des Briefes gegen Bevorzugung. Zugleich können die Themen Zweifel und innere Gespaltenheit im Jakobusbrief für die anderen Deutungen sprechen; deshalb werden sie nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Eigenschaften bleibt erhalten; idiomatisch notwendige Erweiterungen dienen der Verständlichkeit, ohne die ethische Spannung des griechischen Textes aufzulösen.
