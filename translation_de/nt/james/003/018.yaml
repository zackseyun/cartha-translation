  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: de
  text: Und die Frucht der Gerechtigkeit[a] wird in Frieden von denen gesät, die Frieden schaffen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gerechtigkeit“ kann hier sowohl rechtes Verhalten als auch gerechte Beziehungen und Verhältnisse bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für die, die Frieden schaffen“. Der griechische Dativ lässt beide Deutungen zu; beim Passiv „wird gesät“ liegt „von denen“ näher.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: Frucht
  rationale: „Frucht“ bewahrt sowohl die konkrete Bildsprache als auch die Singularform des griechischen Substantivs; „Ernte“ wäre im Zusammenhang möglich, würde das Bild aber stärker auslegen.
- source_word: δὲ
  choice: Und
  rationale: δέ stellt hier eine lockere Verbindung zum vorangehenden Gedanken her und bezeichnet keinen ausgeprägten Gegensatz.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ gibt das breite Bedeutungsfeld von δικαιοσύνη wieder, das sowohl rechtes Verhalten als auch gerechte Beziehungen und Verhältnisse umfassen kann.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Die relativ formnahe Wiedergabe erhält die mögliche Bedeutung als Art und Weise oder als Bereich des Säens.
- source_word: σπείρεται
  choice: wird gesät
  rationale: Das deutsche Präsens Passiv entspricht dem griechischen Präsens Passiv und bewahrt zugleich das Bild vom Säen.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: von denen, die Frieden schaffen
  rationale: Beim Passiv „wird gesät“ liegt eine Deutung des Dativs als handelnde Personen nahe. Der Relativsatz bildet ποιέω mit εἰρήνην ausdrücklich ab und ist genauer als das knappe „von Friedensstiftern“.
theological_decisions:
- issue: Bedeutung von „Frucht der Gerechtigkeit“
  choice: Die Genitivverbindung bleibt als „Frucht der Gerechtigkeit“ offen.
  alternative: Eine Ernte, die in Gerechtigkeit besteht; eine Frucht, die Gerechtigkeit hervorbringt.
  rationale: Der Kontext legt einen von himmlischer Weisheit und friedlichem Handeln geprägten Ertrag nahe, entscheidet aber nicht eindeutig, ob die Gerechtigkeit die Frucht näher bestimmt oder ihr Ergebnis ist. Die Übersetzung löst diese Spannung nicht auf.
- issue: Funktion des Dativs τοῖς ποιοῦσιν εἰρήνην
  choice: 'Agens: „von denen, die Frieden schaffen“'
  alternative: 'Vorteil oder Bezug: „für die, die Frieden schaffen“'
  rationale: In Verbindung mit dem Passiv σπείρεται ist die agentive Deutung am naheliegendsten; grammatisch bleibt jedoch auch eine Deutung als Dativ des Vorteils beziehungsweise Bezugs möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und verständliche Bildsprache „Frucht“ und „säen“ bleibt erhalten. „Frieden schaffen“ ist natürlich und bildet die griechische Verbverbindung genauer ab als ein substantivisches „Friedensstifter“.
