id: JAS.3.16
reference: James 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: de
  text: Denn wo Eifersucht[a] und selbstsüchtiger Ehrgeiz herrschen, da gibt es Unordnung und jede üble Tat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Neid«. Das griechische Wort kann auch »Eifer« bedeuten, ist hier aber eindeutig negativ gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »jedes böse Tun«; wörtlicher: »jede üble Sache«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: wo
  rationale: Leitet eine allgemeine örtlich-bedingende Aussage ein und bewahrt zusammen mit ἐκεῖ die Struktur »wo … da …«.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet den Vers als Begründung beziehungsweise Erläuterung des vorher Gesagten.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Der Zusammenhang in Jakobus 3,14–15 verlangt eine negative Bedeutung. »Eifersucht« gibt diese wieder; »Neid« ist ebenfalls möglich.
- source_word: ἐριθεία
  choice: selbstsüchtiger Ehrgeiz
  rationale: Bezeichnet eigennütziges Streben nach persönlichem Vorteil, das Rivalität und Parteiung hervorruft. Die Formulierung ist im heutigen Deutsch klar und erfasst sowohl Beweggrund als auch soziale Wirkung.
- source_word: ἐκεῖ
  choice: da
  rationale: Entspricht idiomatisch dem vorausgehenden »wo« und erhält die sprichwortartige Satzform.
- source_word: ἀκαταστασία
  choice: Unordnung
  rationale: Bezeichnet Störung, Aufruhr oder instabile Verhältnisse, hier besonders im gemeinschaftlichen Zusammenleben, nicht bloß gedankliche Verwirrung.
- source_word: πᾶν
  choice: jede
  rationale: Gibt die distributive Bedeutung in Verbindung mit dem singularischen πρᾶγμα natürlich wieder.
- source_word: φαῦλον
  choice: üble
  rationale: Drückt die sittliche Schlechtigkeit oder Niedrigkeit aus, ohne die Aussage unnötig zu verschärfen.
- source_word: πρᾶγμα
  choice: Tat
  rationale: Das Wort kann allgemein »Sache« oder »Angelegenheit« bedeuten; im vorliegenden Lasterkontext bezeichnet »Tat« verständlich das daraus hervorgehende schlechte Handeln.
theological_decisions:
- issue: Moralische Bedeutung von ζῆλος im Zusammenhang
  choice: Als negatives Laster mit »Eifersucht« wiedergegeben
  alternative: »Neid«; lexikalisch auch »Eifer«, hier jedoch nicht in neutralem oder positivem Sinn
  rationale: Die unmittelbaren Verse 14–15 sprechen von bitterem ζῆλος und stellen ihn als Merkmal irdischer, ungeistlicher Weisheit dar. Daher ist die negative Bedeutung kontextuell erforderlich, während die genaue Nuance zwischen Eifersucht und Neid offenbleibt.
- issue: Reichweite von πᾶν φαῦλον πρᾶγμα
  choice: »jede üble Tat«
  alternative: »jedes böse Tun« oder wörtlicher »jede üble Sache«
  rationale: Die gewählte Fassung bewahrt die umfassende moralische Aussage und macht zugleich deutlich, dass es um verwerfliches Handeln geht, ohne eine bestimmte Liste von Sünden einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Form »wo … da …« erhält den prägnanten Charakter des griechischen Satzes. Das im Deutschen ergänzte »herrschen« macht die verblosen griechischen Satzglieder natürlich verständlich, ohne die Aussage inhaltlich festzulegen.
