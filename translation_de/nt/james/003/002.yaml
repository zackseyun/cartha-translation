source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: de
  text: Denn wir alle straucheln in vieler Hinsicht.[a] Wenn jemand im Reden[b] nicht strauchelt, der ist ein reifer Mann,[c] fähig, auch den ganzen Körper zu zügeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vielfach“. Das griechische πολλά bezeichnet hier ein Straucheln in vielen Hinsichten oder auf vielerlei Weise.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Wort“, das heißt beim Sprechen oder in dem, was jemand sagt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „vollkommener“ beziehungsweise „vollständiger Mann“. Das griechische τέλειος kann Reife, Vollständigkeit oder Vollkommenheit bezeichnen. Das griechische ἀνήρ lautet „Mann“ und wird hier in einer allgemeinen Aussage repräsentativ gebraucht.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: vielfach
  rationale: Das adverbial gebrauchte Neutrum Plural bezeichnet ein Straucheln in vielerlei Hinsicht und kann zugleich die Häufigkeit anklingen lassen. „Vielfach“ ist knapp und bewahrt diese Bedeutungsbreite.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet die Begründung für die vorausgehende Warnung und stellt den argumentativen Anschluss natürlich her.
- source_word: πταίομεν / πταίει
  choice: straucheln
  rationale: Bewahrt das Bild des Stolperns und bezeichnet im Zusammenhang zugleich ethisches Versagen, ohne es vorschnell mit „sündigen“ gleichzusetzen.
- source_word: ἅπαντες
  choice: wir alle
  rationale: Gibt die betonte umfassende Aussage einschließlich der Selbstzurechnung des Verfassers direkt wieder.
- source_word: εἴ τις
  choice: wenn jemand
  rationale: Entspricht der unbestimmten Bedingung, die einen allgemein geltenden Fall einführt.
- source_word: ἐν λόγῳ
  choice: im Reden
  rationale: λόγος bezieht sich hier auf Sprache beziehungsweise das Gesagte. „Im Reden“ ist im Deutschen natürlicher als das wörtliche „im Wort“.
- source_word: οὗτος
  choice: der
  rationale: Das hinweisende „der“ greift die zuvor genannte Person betont auf und ist in dieser deutschen Satzform natürlich.
- source_word: τέλειος
  choice: reif
  rationale: Bezeichnet hier ethische Ganzheit beziehungsweise Reife. „Reif“ vermeidet, im unmittelbaren Zusammenhang absolute Sündlosigkeit zu behaupten.
- source_word: ἀνήρ
  choice: Mann
  rationale: Gibt das ausdrücklich maskuline Substantiv wieder; in der allgemeinen Aussage hat es repräsentative Geltung, wie bereits „wenn jemand“ erkennen lässt.
- source_word: δυνατὸς
  choice: fähig
  rationale: Drückt unmittelbar die Fähigkeit aus, die aus der beschriebenen Selbstbeherrschung hervorgeht.
- source_word: χαλιναγωγῆσαι
  choice: zu zügeln
  rationale: Bewahrt das Bild des Lenkens mit einem Zaum, das in den folgenden Versen weitergeführt wird.
- source_word: καὶ
  choice: auch
  rationale: Verbindet die Beherrschung des Redens additiv mit der Fähigkeit, den ganzen Körper zu lenken.
theological_decisions:
- issue: Bedeutung von τέλειος im ethischen Zusammenhang
  choice: reif
  alternative: vollkommen oder vollständig
  rationale: Der unmittelbare Satz beginnt mit dem Eingeständnis, dass alle vielfach straucheln. „Reif“ bezeichnet daher charakterliche Ganzheit und Selbstbeherrschung, ohne die mögliche Nuance der Vollständigkeit zu leugnen oder absolute Fehlerlosigkeit einzutragen.
- issue: Repräsentative Verwendung von ἀνήρ
  choice: Mann mit allgemeiner, repräsentativer Geltung
  alternative: Mensch oder Person
  rationale: Der griechische Text verwendet ausdrücklich ἀνήρ. Die Einleitung „wenn jemand“ zeigt zugleich, dass eine allgemeine Aussage vorliegt; die Fußnote macht diese Spannung transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Straucheln“ und „zügeln“ bewahren die beiden anschaulichen Bilder des griechischen Textes. Die leicht markierte Konstruktion „der ist“ erhält die hinweisende Kraft von οὗτος, ohne unnatürlich zu wirken.
