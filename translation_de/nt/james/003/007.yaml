source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: de
  text: Denn jede Art von wilden Tieren und Vögeln, von Kriechtieren und Meerestieren wird gezähmt und ist von den Menschen[a] gezähmt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die menschliche Natur“ beziehungsweise „durch die Menschheit“. Die griechische Wendung kann kollektiv die Menschen als Ganze oder abstrakter die menschliche Natur beziehungsweise Sphäre bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: jede Art
  rationale: Im zoologischen Zusammenhang bezeichnet φύσις idiomatisch eine Art oder Gattung. Der Singular „jede Art“ bewahrt die verteilende Kraft von πᾶσα und passt zur singularischen Verbform.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage; „denn“ stellt diesen Zusammenhang im Deutschen natürlich her.
- source_word: θηρίων
  choice: wilde Tiere
  rationale: θηρίον bezeichnet hier Tiere, besonders wilde Tiere. Diese Wiedergabe ist heute klarer und weniger altertümlich als „Bestien“.
- source_word: πετεινῶν
  choice: Vögel
  rationale: Das Wort bezeichnet fliegende Geschöpfe und wird in diesem Tierkatalog natürlich mit „Vögel“ wiedergegeben.
- source_word: ἑρπετῶν
  choice: Kriechtiere
  rationale: ἑρπετά kann allgemein kriechende Tiere bezeichnen. „Kriechtiere“ wahrt diese Vorstellung besser als die engere moderne Fachkategorie „Reptilien“.
- source_word: ἐναλίων
  choice: Meerestiere
  rationale: Das substantivierte Adjektiv bezeichnet im Meer lebende Geschöpfe; „Meerestiere“ ist prägnant und hinreichend weit.
- source_word: δαμάζεται
  choice: wird gezähmt
  rationale: Das Präsens Passiv beschreibt einen allgemeinen und fortdauernden Vorgang.
- source_word: δεδάμασται
  choice: ist ... gezähmt worden
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Zähmung mit fortbestehendem Ergebnis und bleibt so vom vorausgehenden Präsens unterschieden.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: von den Menschen
  rationale: Die Wendung wird im Haupttext kollektiv auf die Menschheit als Handelnde bezogen. „Von den Menschen“ ist im modernen Deutsch natürlich, ohne die zugrunde liegende Mehrdeutigkeit in der Anmerkung zu verdecken.
theological_decisions:
- issue: Bezug von τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: 'kollektiv: „von den Menschen“'
  alternative: 'abstrakt: „durch die menschliche Natur“ oder „durch das menschliche Wesen“'
  rationale: Im Gegensatz zu den verschiedenen Tierarten liegt die kollektive Deutung als Menschheit nahe. Da φύσις jedoch auch „Natur“ oder „Wesen“ bedeuten kann, wird die abstrakte Lesart nicht ausgeschlossen, sondern in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „wird gezähmt und ist ... gezähmt worden“ ist bewusst beibehalten, um den Unterschied zwischen griechischem Präsens und Perfekt sowie die rhetorische Verstärkung des Satzes wiederzugeben.
