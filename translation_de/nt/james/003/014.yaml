source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: de
  text: Wenn ihr aber bittere Eifersucht[a] und selbstsüchtigen Ehrgeiz[b] in euren Herzen habt, dann rühmt euch nicht und lügt nicht gegen die Wahrheit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bitteren Eifer“ oder „bitteren Neid“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rivalität“ oder „Parteilichkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Lügt nicht im Widerspruch zur Wahrheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn ihr aber
  rationale: Die Formulierung gibt sowohl die Bedingung als auch den Gegensatz zur vorausgehenden Darstellung der Weisheit natürlich wieder.
- source_word: ζῆλον πικρὸν
  choice: bittere Eifersucht
  rationale: ζῆλος kann Eifer, Eifersucht oder Neid bezeichnen. Zusammen mit ἐριθεία und in diesem negativen Kontext steht die feindselige Bedeutung im Vordergrund; „bitter“ bildet πικρόν unmittelbar ab.
- source_word: ἐριθείαν
  choice: selbstsüchtigen Ehrgeiz
  rationale: Die Wendung erfasst das eigennützige Streben des Wortes; die mögliche Bedeutung von Rivalität und Parteigeist bleibt in einer Fußnote sichtbar.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: in euren Herzen
  rationale: Der griechische Singular mit pluralischem Possessivpronomen ist distributiv. Der deutsche Plural ist bei der Anrede einer Gruppe klar und idiomatisch.
- source_word: μὴ κατακαυχᾶσθε
  choice: rühmt euch nicht
  rationale: Das Verb bezeichnet überhebliches Rühmen beziehungsweise Sich-Brüsten. Die knappe Wiedergabe ist würdig und verständlich.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: lügt nicht gegen die Wahrheit
  rationale: „Lügen“ bewahrt die verbale Aussage von ψεύδεσθε, während „gegen“ den Widerstand ausdrückt, den κατά mit Genitiv bezeichnet.
theological_decisions:
- issue: Bedeutungsumfang von „der Wahrheit“
  choice: die Wahrheit
  alternative: die Wahrheit des Evangeliums; der wahre Weg der Weisheit; Wahrhaftigkeit im Reden
  rationale: Der Ausdruck bleibt bewusst offen und umfasst Gottes Wahrheit im Gegensatz zu überheblicher Selbsttäuschung. Eine nähere dogmatische oder rein ethische Festlegung würde den griechischen Text unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Mahnung des Griechischen bleibt erhalten; „dann“ verdeutlicht im Deutschen den Folgesatz der Bedingung. Der Plural „in euren Herzen“ gibt den distributiven griechischen Singular für eine Gruppenanrede idiomatisch wieder.
