id: JAS.3.6
reference: James 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: de
  text: Auch die Zunge ist ein Feuer. Als eine Welt der Ungerechtigkeit nimmt die Zunge ihren Platz unter unseren Gliedern ein. Sie befleckt[a] den ganzen Körper, setzt das Rad der Geburt[b] in Brand und wird selbst von der Gehenna[c] in Brand gesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verunreinigt den ganzen Körper“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Rad der Entstehung“; sinngemäß: „den Lauf des Lebens“ oder „den Kreislauf des Daseins“.'
    reason: lexical_alternative
  - marker: c
    text: Gehenna ist der hier verwendete griechische Begriff; traditionell wird er mit „Hölle“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: Zunge
  rationale: Die konkrete Körpermetapher bleibt erhalten; zugleich bezeichnet „Zunge“ metonymisch das Reden.
- source_word: πῦρ
  choice: ein Feuer
  rationale: Die prädikative Metapher wird knapp und natürlich wiedergegeben.
- source_word: κόσμος τῆς ἀδικίας
  choice: eine Welt der Ungerechtigkeit
  rationale: Die auffällige und umfassende Bildsprache des Griechischen bleibt erhalten, ohne sie zu „voller Bosheit“ abzuschwächen.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: nimmt ... ihren Platz unter unseren Gliedern ein
  rationale: Gibt Stellung und Wirksamkeit der Zunge innerhalb der Körperglieder verständlich wieder, ohne ein ausdrücklich göttliches Einsetzen anzunehmen.
- source_word: σπιλοῦσα
  choice: befleckt
  rationale: Bezeichnet sowohl Verunreinigung als auch moralische Verunreinigung und erhält die Bildhaftigkeit.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: das Rad des Lebens
  rationale: Bewahrt das ungewöhnliche Rad-Bild, während „des Lebens“ γένεσις im Kontext natürlicher als das missverständliche „der Geburt“ wiedergibt.
- source_word: φλογίζουσα ... φλογιζομένη
  choice: setzt ... in Brand ... wird ... in Brand gesetzt
  rationale: Die aktive und passive Wiederholung desselben Feuerwortes bleibt deutlich hörbar.
- source_word: ὑπὸ τῆς γεέννης
  choice: von der Gehenna
  rationale: Der spezifische griechische Begriff bleibt erhalten; die traditionelle Wiedergabe wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von γέεννα
  choice: Gehenna
  alternative: Hölle
  rationale: „Gehenna“ wahrt die historische und begriffliche Eigenart des Ausgangsworts und vermeidet, spätere systematische Vorstellungen unbemerkt in den Text einzutragen.
- issue: Deutung von τροχὸς τῆς γενέσεως
  choice: Rad des Lebens
  alternative: Lauf des Lebens / Kreislauf des Daseins
  rationale: Die Übersetzung bewahrt das fremdartige Rad-Bild und lässt dessen genaue Reichweite offen, statt es auf einen geradlinigen Lebenslauf oder einen bestimmten kosmologischen Kreislauf festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für gute Verständlichkeit gegliedert. Das ungewöhnliche Bild „Welt der Ungerechtigkeit“ und die Wiederholung der Brandmetapher bleiben erhalten. Alle Fußnotenmarker stehen unmittelbar an den erläuterten Stellen.
