  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: de
  text: Nicht viele von euch sollen Lehrer werden, meine Brüder[a], denn ihr wisst, dass wir ein strengeres Urteil erhalten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ ist hier wahrscheinlich die ganze Gemeinde einschließlich der Schwestern angesprochen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ … γίνεσθε
  choice: Nicht viele von euch sollen … werden
  rationale: Die Verneinung μή mit dem Imperativ γίνεσθε formuliert eine Warnung beziehungsweise Aufforderung. „Nicht viele von euch sollen“ gibt sie im Deutschen natürlich wieder; „von euch“ erschließt sich aus der zweiten Person Plural.
- source_word: διδάσκαλοι
  choice: Lehrer
  rationale: „Lehrer“ ist die direkte und im Gemeindekontext verständliche Entsprechung, ohne daraus ausdrücklich ein festes Amt zu machen.
- source_word: ἀδελφοί μου
  choice: meine Brüder
  rationale: Die grammatisch maskuline Anrede wird im Haupttext genau wiedergegeben. Ihr wahrscheinlich die ganze Gemeinde einschließender Gebrauch wird in einer Fußnote erläutert.
- source_word: εἰδότες
  choice: denn ihr wisst
  rationale: Die partizipiale Wendung begründet hier die Warnung. Die finite deutsche Form ist natürlich und bewahrt diesen begründenden Zusammenhang.
- source_word: μεῖζον κρίμα
  choice: ein strengeres Urteil
  rationale: Wörtlich bezeichnet μεῖζον ein „größeres“ Urteil; im Zusammenhang abgestufter Verantwortlichkeit drückt „strengeres Urteil“ den Sinn im heutigen Deutsch klarer aus.
- source_word: λημψόμεθα
  choice: wir … empfangen werden
  rationale: Die Form wird als Futur der ersten Person Plural wiedergegeben und bewahrt, dass der Verfasser sich in die Gruppe der Beurteilten einschließt.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί μου
  choice: „meine Brüder“ im Haupttext mit inklusiver Erläuterung in der Fußnote
  alternative: „meine Brüder und Schwestern“
  rationale: Die Form des griechischen Ausdrucks bleibt sichtbar, während die wahrscheinlich auf die gesamte Gemeinde bezogene Bedeutung ausdrücklich vermerkt wird.
- issue: Bedeutung von κρίμα
  choice: „Urteil“
  alternative: „Verdammnis“ oder „Gericht“
  rationale: „Urteil“ bewahrt die Warnung vor erhöhter Rechenschaft, ohne das Wort vorschnell auf endgültige Verdammnis festzulegen.
- issue: Vergleich μεῖζον bei κρίμα
  choice: „strengeres Urteil“
  alternative: „größeres Urteil“
  rationale: „Strengeres“ vermittelt die kontextuelle Steigerung der Beurteilung idiomatisch; „größeres Urteil“ wäre formnäher, im Deutschen aber weniger klar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Warnung bleibt knapp und direkt; der begründende Partizipialsatz wird zur natürlichen deutschen Konstruktion „denn ihr wisst“ umgeformt.
