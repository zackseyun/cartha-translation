id: JAS.3.5
reference: James 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: de
  text: So ist auch die Zunge ein kleines Körperteil und prahlt mit großen Dingen. Seht, welch kleines Feuer[a] einen so großen Wald[b] in Brand setzt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seht, was für ein Feuer einen so großen Wald in Brand setzt!“ Die griechische Formulierung kann als Ausruf über die Größe des Feuers verstanden werden. Der Haupttext folgt dem Zusammenhang, in dem eine kleine Ursache eine große Wirkung hervorbringt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „so viel Holz“, „so viel Brennstoff“ beziehungsweise „ein so großes Waldgebiet“. Das griechische Wort bezeichnet Wald, Holz oder allgemein brennbares Material.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: Zunge
  rationale: Die konkrete Körpermetapher bleibt erhalten; „Reden“ oder „Sprache“ würde das Bild bereits auslegen.
- source_word: μικρὸν μέλος
  choice: ein kleines Körperteil
  rationale: „Körperteil“ gibt μέλος in heutigem, allgemein verständlichem Deutsch wieder und bewahrt den Bezug zum Leib.
- source_word: μεγάλα αὐχεῖ
  choice: prahlt mit großen Dingen
  rationale: Die Formulierung erhält sowohl das Prahlen als auch die unbestimmte Größe der Ansprüche; sie legt nicht näher fest, worin diese „großen Dinge“ bestehen.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der Imperativ lenkt in natürlichem, würdigem Deutsch die Aufmerksamkeit auf das folgende Bild.
- source_word: ἡλίκον πῦρ
  choice: welch kleines Feuer
  rationale: Im unmittelbaren Vergleich steht einem kleinen Körperteil eine große Wirkung gegenüber. Daher wird ἡλίκον kontextuell als Kleinheit des auslösenden Feuers verstanden; die mögliche exklamatorische Deutung bleibt in einer Fußnote erhalten.
- source_word: ἡλίκην ὕλην
  choice: einen so großen Wald
  rationale: ὕλη kann Wald, Holz oder brennbares Material bezeichnen. „Wald“ vermittelt das Bild eines großen, zusammenhängenden Bereichs, der Feuer fängt, im Deutschen am klarsten.
- source_word: ἀνάπτει
  choice: in Brand setzt
  rationale: Die Wendung ist anschaulich, idiomatisch und gibt das Entzünden eines großen brennbaren Bereichs treffend wieder.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in klarer, würdiger Sprache. Die konkrete Bildsprache von Zunge, Körperteil und Feuer bleibt erhalten. „Körperteil“ ist im heutigen Deutsch natürlicher als „Glied“, während „prahlt mit großen Dingen“ die auffällige und bewusst offene Formulierung des griechischen Textes bewahrt.
