  source_fidelity: Der Entwurf gibt die Kondition (εἰ), die präzise bildliche Bedeutung von χαλινοί als „Gebisse“, die Zielangabe („damit sie uns gehorchen“) und μετάγομεν als „lenken“ zutreffend wieder. Der Singular σώμα ist bei dem Plural αὐτῶν distributiv zu verstehen.
