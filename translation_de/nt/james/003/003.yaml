source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: de
  text: Wenn wir den Pferden die Gebisse ins Maul legen, damit sie uns gehorchen, lenken wir auch ihre ganzen Körper.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn
  rationale: Leitet ein veranschaulichendes Bedingungsgefüge ein. Im Deutschen gibt „wenn“ die konditionale Kraft natürlich wieder; δέ verlangt hier keinen ausdrücklich wiedergegebenen Gegensatzmarker.
- source_word: τῶν ἵππων τοὺς χαλινοὺς
  choice: den Pferden die Gebisse
  rationale: χαλινοί bezeichnet hier wegen der Platzierung im Maul präzise die Gebisse, nicht das gesamte Zaumzeug. Die deutsche Dativkonstruktion ist idiomatisch.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: ins Maul legen
  rationale: εἰς bezeichnet die Bewegung hinein, βάλλομεν in diesem Zusammenhang schlicht das Hineinlegen. Der distributive Singular „Maul“ ist bei mehreren Pferden im Deutschen natürlich.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: damit sie uns gehorchen
  rationale: Die Konstruktion mit εἰς und substantiviertem Infinitiv drückt hier Zweck beziehungsweise beabsichtigtes Ergebnis aus; πείθεσθαι mit Dativ bedeutet „gehorchen“.
- source_word: καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν
  choice: lenken wir auch ihren ganzen Körper
  rationale: μετάγομεν bezeichnet das Lenken beziehungsweise Steuern. Der griechische Singular σῶμα wird distributiv auf die Pferde bezogen und kann im Deutschen ebenso natürlich im Singular stehen.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die konkrete Pferdemetapher bleibt erhalten; wegen der eindeutigen Wendung „ins Maul“ ist keine lexikalische Fußnote zu „Gebisse“ nötig.
