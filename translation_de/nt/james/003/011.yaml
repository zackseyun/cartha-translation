  text: μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: de
  text: Lässt etwa eine Quelle aus derselben Öffnung süßes und bitteres Wasser hervorsprudeln?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Lässt etwa die Quelle aus derselben Öffnung das Süße und das Bittere hervorsprudeln?“'
    reason: 'Lexikalische Alternative: Die griechischen Adjektive stehen substantivisch; „Wasser“ ist im Haupttext zur natürlichen deutschen Verständlichkeit ergänzt.'
lexical_decisions:
- source_word: μήτι
  choice: Lässt etwa ...?
  rationale: „Etwa“ kennzeichnet im Deutschen natürlich eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird.
- source_word: ἡ πηγή
  choice: eine Quelle
  rationale: πηγή bezeichnet hier eine natürliche Wasserquelle; „Quelle“ ist die geläufige und bildlich passende deutsche Entsprechung.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: aus derselben Öffnung
  rationale: ὀπή meint eine Öffnung oder ein Loch. „Öffnung“ bewahrt das konkrete Bild, ohne unnötig grob zu klingen.
- source_word: βρύει
  choice: hervorsprudeln
  rationale: βρύω bezeichnet das Hervorquellen oder Sprudeln. „Hervorsprudeln“ gibt die lebendige Bewegung des Quellwassers präzise und natürlich wieder.
- source_word: τὸ γλυκὺ καὶ τὸ πικρόν
  choice: süßes und bitteres Wasser
  rationale: Die substantivierten Adjektive bezeichnen im Zusammenhang das Wasser. Die Ergänzung von „Wasser“ macht den im Griechischen vorausgesetzten Bezug im Deutschen klar und erhält den Gegensatz „süß–bitter“.
theological_decisions: []
