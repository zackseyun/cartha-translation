id: JAS.3.9
reference: James 3:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: de
  text: Mit ihr preisen wir den Herrn und Vater[a], und mit ihr verfluchen wir die Menschen, die nach Gottes Ebenbild geschaffen worden sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „den Herrn und Vater“. Die Wendung kann den Herrn als Vater näher bestimmen oder als verbundene Bezeichnung für Gott verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: mit ihr
  rationale: Das Pronomen bezieht sich auf die Zunge im vorausgehenden Zusammenhang; „mit ihr“ gibt den instrumentalen Sinn im Deutschen natürlich wieder.
- source_word: εὐλογοῦμεν
  choice: preisen wir
  rationale: Bei Gott als Objekt bezeichnet εὐλογέω hier lobendes, ehrendes Reden. „Preisen“ ist im modernen Deutschen natürlicher als „segnen“, ohne den Gegensatz zum Verfluchen abzuschwächen.
- source_word: τὸν κύριον καὶ πατέρα
  choice: den Herrn und Vater
  rationale: Die koordinierte griechische Formulierung bleibt erhalten und wird nicht eindeutig als Apposition oder als doppelte Bezeichnung aufgelöst.
- source_word: καταρώμεθα
  choice: verfluchen wir
  rationale: „Verfluchen“ ist die direkte, kräftige deutsche Entsprechung und bewahrt den scharfen Gegensatz zu εὐλογοῦμεν.
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, nicht ausschließlich Männer.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: nach Gottes Ebenbild
  rationale: Die Wendung gibt die schöpfungstheologische Aussage idiomatisch und würdig wieder; „Ebenbild“ bezeichnet hier die Gottähnlichkeit, nicht ein körperliches Abbild.
- source_word: γεγονότας
  choice: geschaffen worden sind
  rationale: Im Zusammenhang mit Gottes Ebenbild verweist das resultative Partizip auf das Geschaffensein der Menschen und lässt Gott als impliziten Urheber erkennen.
theological_decisions:
- issue: Beziehung zwischen „Herr“ und „Vater“
  choice: den Herrn und Vater
  alternative: den Herrn, nämlich den Vater
  rationale: Der griechische Ausdruck kann appositionell verstanden werden, lässt sich aber auch als verbundene Gottesbezeichnung lesen. Die Übersetzung bewahrt diese Spannung, statt sie festzulegen.
- issue: Wiedergabe von ἀνθρώπους
  choice: die Menschen
  alternative: die Männer
  rationale: Gemeint ist die gesamte Menschheit als nach Gottes Ebenbild geschaffen; eine Beschränkung auf männliche Personen wäre sachlich irreführend.
- issue: Schöpfungsbezug von γεγονότας
  choice: geschaffen worden sind
  alternative: geworden sind
  rationale: Der Kontext und die Anspielung auf die Schöpfung des Menschen rechtfertigen „geschaffen“, ohne eine weitergehende dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der parallele Satzbau „Mit ihr … und mit ihr …“ bildet den rhetorischen Gegensatz des griechischen Textes nach.
