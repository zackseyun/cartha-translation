id: JAS.3.15
reference: James 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: de
  text: Diese Weisheit kommt nicht von oben herab, sondern ist irdisch, ungeistlich[a], dämonisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „natürlich“ beziehungsweise „seelisch“. Das griechische Adjektiv kann das bezeichnen, was nur zum natürlichen Leben gehört, im Gegensatz zum Geistlichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Diese Weisheit
  rationale: Die Demonstrativfügung verweist unmittelbar auf die zuvor beschriebene Art von Weisheit. „Diese Weisheit“ ist direkt und lässt den Kontext die nähere Bestimmung leisten.
- source_word: ἄνωθεν
  choice: von oben
  rationale: Bewahrt die räumliche Formulierung und zugleich den bei Jakobus anklingenden Gedanken göttlicher Herkunft, ohne sie ausdrücklich als „vom Himmel“ auszudeuten.
- source_word: κατερχομένη
  choice: kommt … herab
  rationale: Gibt das attributive Präsenspartizip natürlich und mit fortdauerndem Aspekt wieder.
- source_word: ἐπίγειος
  choice: irdisch
  rationale: Entspricht dem Gegensatz zu „von oben“ genauer als das stärker deutende „weltlich“.
- source_word: ψυχική
  choice: ungeistlich
  rationale: Bringt den neutestamentlichen Gegensatz zum Geistlichen verständlich zum Ausdruck. Da das griechische Wort zugleich das bloß natürliche, seelische Leben bezeichnen kann, wird diese Bedeutungsbreite in einer Fußnote kenntlich gemacht.
- source_word: δαιμονιώδης
  choice: dämonisch
  rationale: Gibt die Zugehörigkeit zur beziehungsweise Prägung durch die Sphäre der Dämonen knapp und in modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von ψυχική im geistlichen und moralischen Gegensatz
  choice: ungeistlich
  alternative: natürlich; seelisch
  rationale: „Ungeistlich“ macht die negative Gegenüberstellung zu der von oben kommenden Weisheit deutlich, ohne ein bestimmtes Lehrsystem einzutragen. Die Alternativen bewahren andere lexikalische Aspekte, sind im heutigen Deutsch jedoch entweder zu neutral oder missverständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Steigerung „irdisch, ungeistlich, dämonisch“ und der Gegensatz zwischen „von oben“ und „irdisch“ bleiben erhalten.
