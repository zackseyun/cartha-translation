source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: de
  text: 'Seht euch auch die Schiffe an: Obwohl sie so groß sind und von heftigen Winden getrieben werden, lassen sie sich durch ein sehr kleines Ruder lenken, wohin der Steuermann will.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wohin der Impuls (oder: Drang) des Steuernden will“.'
    reason: Die ungewöhnliche griechische Wendung mit ὁρμή lässt sich im Deutschen nicht zugleich wörtlich und natürlich wiedergeben; die Anmerkung dokumentiert ihre Bildhaftigkeit und Bedeutungsspanne.
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Seht euch auch die Schiffe an
  rationale: Die Aufforderung lenkt die Aufmerksamkeit natürlich auf das zweite Beispiel und gibt καί als Fortführung von Vers 3 wieder.
- source_word: τηλικαῦτα ὄντα
  choice: Obwohl sie so groß sind
  rationale: Die konzessive Formulierung macht den im Kontext beabsichtigten Gegensatz zwischen großen Schiffen und sehr kleinem Ruder deutlich.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: von heftigen Winden getrieben werden
  rationale: „Heftig“ gibt die Kraft und Härte der Winde idiomatisch wieder; das Passiv von ἐλαύνω bleibt erhalten.
- source_word: μετάγεται
  choice: lassen sie sich … lenken
  rationale: Im Zusammenhang mit dem Ruder bezeichnet das Verb das Steuern beziehungsweise Lenken; die deutsche Konstruktion ist natürlich und bewahrt den passiven Sinn.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: durch ein sehr kleines Ruder
  rationale: Der elativische Superlativ wird idiomatisch als „sehr klein“ wiedergegeben und der starke Größenkontrast bleibt gewahrt.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: dorthin, wohin der Steuermann will
  rationale: Die idiomatische Wiedergabe bezeichnet das vom Steuernden beabsichtigte Ziel. Eine Fußnote bewahrt die ungewöhnliche wörtliche Struktur und die Bedeutungsspanne von ὁρμή.
theological_decisions:
- issue: Wiedergabe von ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: dorthin, wohin der Steuermann will
  alternative: wohin der Antrieb des Steuernden will
  rationale: Die geglättete Haupttextfassung ist im Deutschen klar, ohne eine besondere Lehrdeutung einzutragen. Die Fußnote erhält die auffällige Personifikation und lexikalische Offenheit des Griechischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Aufforderung „Seht euch … an“ ist allgemein verständlich; „Steuermann“ passt zum nautischen Bild, ohne unnötig technisch zu wirken.
