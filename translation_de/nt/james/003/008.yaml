id: JAS.3.8
reference: James 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: de
  text: Die Zunge aber kann kein Mensch zähmen. Sie ist ein unstetes Übel[a], voll von tödlichem Gift.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein ruheloses Übel“; auch „ein unbeherrschtes Übel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: die Zunge
  rationale: Der konkrete Körperteilbegriff bewahrt das im Zusammenhang durchgehend verwendete Bild für das menschliche Reden.
- source_word: οὐδεὶς … ἀνθρώπων
  choice: kein Mensch
  rationale: Die partitive Verbindung bedeutet idiomatisch ‚kein Mensch‘ bzw. ‚niemand unter den Menschen‘. Die natürliche deutsche Form gibt den universalen menschlichen Bezug wieder, ohne die komprimierte griechische Syntax nachzuahmen.
- source_word: δαμάσαι δύναται
  choice: kann … zähmen
  rationale: ‚Zähmen‘ bewahrt die Wortverbindung zur Zähmung der Tiere im vorhergehenden Vers und entspricht der natürlichen deutschen Ausdrucksweise.
- source_word: ἀκατάστατον
  choice: unstet
  rationale: Das Wort bezeichnet etwas Unbeständiges, Ruheloses oder Unbeherrschtes. ‚Unstet‘ hält diese Bedeutungsbreite offen und passt zur personifizierten Zunge.
- source_word: κακόν
  choice: Übel
  rationale: ‚Übel‘ bezeichnet hier zugleich etwas moralisch Böses und Verderbliches und bildet mit dem sächlichen Adjektiv eine natürliche deutsche Wendung.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: voll von tödlichem Gift
  rationale: Die Formulierung gibt das starke Bild unmittelbar und verständlich wieder; ἰός meint im Kontext Gift, während θανατηφόρος dessen tödliche Wirkung ausdrückt.
theological_decisions:
- issue: Reichweite von οὐδεὶς mit dem Genitiv ἀνθρώπων
  choice: kein Mensch
  alternative: niemand unter den Menschen
  rationale: Der Genitiv ist am besten partitiv zu verstehen. ‚Kein Mensch‘ drückt den Sinn natürlich und geschlechtsübergreifend aus, ohne die Aussage abzuschwächen.
- issue: Charakterisierung der Zunge als ἀκατάστατον κακόν
  choice: ein unstetes Übel
  alternative: ein ruheloses oder unbeherrschbares Übel
  rationale: Die Übersetzung wahrt die Spannung zwischen Unbeständigkeit, Ruhelosigkeit und Unordnung, statt das Adjektiv vorschnell nur als mangelnde Beherrschbarkeit zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit vorangestelltem „Die Zunge aber“ bewahrt den griechischen Kontrast. Das Bild der Zunge und die Verbindung zur Tierzähmung im unmittelbaren Kontext bleiben erhalten.
