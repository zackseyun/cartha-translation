  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: de
  text: Aus demselben Mund kommen Segen und Fluch. Meine Brüder[a], das darf nicht so sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Brüder und Schwestern«. Im Griechischen steht »Brüder«; im Zusammenhang spricht Jakobus damit wahrscheinlich die ganze Glaubensgemeinschaft an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Aus demselben Mund
  rationale: Bewahrt das konkrete Bild und gibt die Herkunftsangabe im Deutschen natürlich wieder.
- source_word: ἐξέρχεται
  choice: kommen
  rationale: Das griechische Verb steht im Singular, bezieht sich aber auf die verbundenen Subjekte »Segen und Fluch«; im Deutschen ist der Plural idiomatisch und inhaltlich entsprechend.
- source_word: εὐλογία
  choice: Segen
  rationale: Bezeichnet hier im Zusammenhang mit Mund und Zunge den ausgesprochenen Segen und erhält den direkten Gegensatz zu »Fluch«.
- source_word: κατάρα
  choice: Fluch
  rationale: Gibt die schädigende Sprechhandlung knapp und idiomatisch wieder und bildet den natürlichen Gegensatz zu »Segen«.
- source_word: οὐ χρή
  choice: darf ... nicht
  rationale: Drückt die starke sittliche Ungehörigkeit im modernen Deutsch natürlich aus; »sollte nicht« wäre schwächer, »es ziemt sich nicht« altertümlicher.
- source_word: ἀδελφοί μου
  choice: Meine Brüder
  rationale: Gibt die grammatisch maskuline Anrede quellennah wieder; der wahrscheinlich die gesamte Glaubensgemeinschaft umfassende Gebrauch wird in der Fußnote kenntlich gemacht.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: so ... es ... sein
  rationale: Das idiomatische »so darf es nicht sein« bewahrt οὕτως und fasst das demonstrative ταῦτα im Deutschen natürlich durch »es« auf.
theological_decisions:
- issue: Geschlechtsspezifische Gemeinschaftsanrede ἀδελφοί μου
  choice: Meine Brüder
  alternative: Meine Brüder und Schwestern
  rationale: Die Hauptübersetzung bildet die maskuline griechische Form ab, ohne den im Kontext wahrscheinlichen inklusiven Bezug zu verschweigen; dieser wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Gegensatz bleibt knapp und pointiert; die abschließende Mahnung ist natürlich formuliert, ohne ihre moralische Stärke abzuschwächen.
