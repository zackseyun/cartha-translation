id: JAS.3.13
reference: James 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: de
  text: Wer ist weise und verständig unter euch? Er[a] soll durch seinen guten Lebenswandel seine Werke in der Sanftmut der Weisheit[b] zeigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verwendet für den hier beschriebenen Menschen maskuline Singularformen; sie können stellvertretend für jeden entsprechend beschriebenen Menschen in der Gemeinschaft stehen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „mit der Sanftmut, die aus Weisheit kommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς
  choice: Wer
  rationale: Leitet eine rhetorische Frage nach einer Person mit den folgenden Eigenschaften ein und entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: σοφὸς
  choice: weise
  rationale: Gibt im Weisheitszusammenhang praktische und sittliche Weisheit wieder, nicht bloß Intelligenz.
- source_word: ἐπιστήμων
  choice: verständig
  rationale: Bezeichnet einen Menschen mit Einsicht und Sachverstand; „verständig“ fügt sich natürlich in den moralisch-ermahnenden Zusammenhang ein.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Ist die natürliche deutsche Wiedergabe für die Zugehörigkeit zur angesprochenen Gemeinschaft.
- source_word: δειξάτω
  choice: soll … zeigen
  rationale: Gibt den Imperativ der dritten Person Singular in klarem, heutigem Deutsch wieder.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: durch seinen guten Lebenswandel
  rationale: ἐκ bezeichnet hier Quelle beziehungsweise Mittel; ἀναστροφή meint das gelebte Verhalten oder die Lebensführung. „Lebenswandel“ erfasst den über einzelne Handlungen hinausgehenden Sinn.
- source_word: τὰ ἔργα αὐτοῦ
  choice: seine Werke
  rationale: „Werke“ bewahrt die für den Jakobusbrief wichtige Wortverbindung zu ἔργον und gibt das Possessivpronomen ausdrücklich wieder.
- source_word: ἐν πραΰτητι σοφίας
  choice: in der Sanftmut der Weisheit
  rationale: Die formnahe Wiedergabe bewahrt die mögliche Mehrdeutigkeit des Genitivs σοφίας. πραΰτης bezeichnet beherrschte Sanftmut beziehungsweise Demut, nicht Schwäche.
theological_decisions:
- issue: Maskuliner Singular mit repräsentativer Bedeutung
  choice: Er soll … zeigen
  alternative: Ein solcher Mensch soll … zeigen
  rationale: Die Übersetzung bewahrt den Singular und die grammatische Form des griechischen Ausdrucks; eine Fußnote macht deutlich, dass die Aufforderung repräsentativ für jeden entsprechend beschriebenen Menschen in der Gemeinschaft gilt.
- issue: Verhältnis von Sanftmut und Weisheit
  choice: in der Sanftmut der Weisheit
  alternative: mit der Sanftmut, die aus Weisheit kommt
  rationale: Der griechische Genitiv kann die Sanftmut als von Weisheit geprägt oder aus ihr hervorgehend beschreiben. Die Hauptfassung lässt diese Beziehung bewusst offen; die Fußnote bietet eine natürliche mögliche Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lebenswandel“ ist leicht gehoben, aber allgemein verständlich und gibt die umfassende Bedeutung von ἀναστροφή präzise wieder. Die ungewöhnlichere Formulierung „Sanftmut der Weisheit“ wurde beibehalten, um die Mehrdeutigkeit des griechischen Genitivs nicht vorschnell aufzulösen.
