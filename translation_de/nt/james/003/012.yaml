  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: de
  text: Meine Brüder[a], kann etwa ein Feigenbaum Oliven hervorbringen oder ein Weinstock Feigen? Ebenso wenig kann Salzwasser Süßwasser hervorbringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Brüder und Schwestern“. Wörtlich steht im Griechischen „meine Brüder“; der maskuline Plural kann hier Männer und Frauen gemeinsam ansprechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satz ist im Griechischen verkürzt formuliert. Im Anschluss an das Bild von der Quelle im vorherigen Vers kann „Salzwasser“ auch als „eine salzige Quelle“ verstanden werden: „Ebenso wenig kann eine salzige Quelle Süßwasser hervorbringen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Meine Brüder und Schwestern
  rationale: Der griechische maskuline Plural kann in dieser Anrede die gesamte Gemeinschaft einschließen. Die ausgeschriebene inklusive Wiedergabe ist im heutigen Deutsch natürlich und vermeidet den möglichen Eindruck, nur Männer seien angesprochen; die Form des Ausgangstextes wird in einer Fußnote ausgewiesen.
- source_word: μὴ δύναται
  choice: kann etwa …?
  rationale: Die mit μή eingeleitete rhetorische Frage erwartet eine verneinende Antwort. „Kann etwa“ bildet diese Erwartung idiomatisch ab, ohne die Frage in eine Aussage umzuwandeln.
- source_word: συκῆ
  choice: Feigenbaum
  rationale: Das Substantiv bezeichnet den Baum, nicht dessen Frucht.
- source_word: ἐλαίας ποιῆσαι
  choice: Oliven hervorbringen
  rationale: ποιέω bezeichnet hier das Erzeugen beziehungsweise Tragen von Frucht. „Hervorbringen“ ist natürlich und wahrt das landwirtschaftliche Bild.
- source_word: ἄμπελος
  choice: Weinstock
  rationale: „Weinstock“ ist die geläufige und genaue deutsche Bezeichnung für die fruchttragende Weinrebe.
- source_word: σῦκα
  choice: Feigen
  rationale: Direkte Wiedergabe des pluralischen Fruchtnamens.
- source_word: οὔτε ἁλυκὸν
  choice: Ebenso wenig kann Salzwasser
  rationale: Der griechische Ausdruck ist elliptisch; ἁλυκόν steht substantivisch für etwas Salziges. „Salzwasser“ ergänzt im Deutschen nur das aus ὕδωρ und dem unmittelbaren Zusammenhang erschließbare Bezugswort, ohne ausdrücklich eine Quelle anzunehmen.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: Süßwasser hervorbringen
  rationale: γλυκύς bedeutet wörtlich „süß“, bezeichnet bei Wasser aber den Gegensatz zu salzigem Wasser. „Süßwasser“ ist dafür der präzise, geläufige deutsche Ausdruck.
