id: JAS.1.5
reference: James 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: de
  text: Wenn aber jemandem von euch Weisheit fehlt, soll er Gott darum bitten, der allen großzügig und ohne Vorwürfe[a] gibt, und sie wird ihm gegeben werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne ihm Vorhaltungen zu machen“ beziehungsweise „ohne ihn zu tadeln“.'
    reason: lexical_alternative
  - marker: b
    text: Die griechischen Formen „er“ und „ihm“ stehen im Singular und beziehen sich hier allgemein auf jeden Menschen unter den Angesprochenen.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Wenn es aber
  rationale: δέ führt den Gedanken aus dem vorherigen Vers mit leichter Gegenüberstellung weiter; „aber“ bewahrt diese Verknüpfung, ohne einen starken Gegensatz zu erzeugen.
- source_word: τις ὑμῶν
  choice: jemandem von euch
  rationale: Das indefinite τις mit dem partitiven Genitiv ὑμῶν bezeichnet eine beliebige Person aus dem angesprochenen Kreis. Die deutsche Konstruktion passt zugleich natürlich zu „an Weisheit fehlt“.
- source_word: λείπεται σοφίας
  choice: an Weisheit fehlt
  rationale: λείπεται bezeichnet hier das Fehlen oder den Mangel an etwas; mit dem Genitiv σοφίας ist „an Weisheit fehlt“ idiomatisch und semantisch eng.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: soll er Gott darum bitten
  rationale: Der Imperativ der dritten Person wird im modernen Deutsch natürlich mit „soll er“ wiedergegeben. „darum“ macht den Rückbezug auf Weisheit klar, während „Gott bitten“ die Bedeutung der Konstruktion mit παρά idiomatisch ausdrückt.
- source_word: τοῦ διδόντος θεοῦ
  choice: Gott ... der ... gibt
  rationale: Das substantivisch-attributive Partizip beschreibt Gott als den Gebenden; ein Relativsatz ist im Deutschen klar und natürlich.
- source_word: πᾶσιν
  choice: allen
  rationale: Die uneingeschränkte plurale Reichweite des griechischen Ausdrucks bleibt erhalten.
- source_word: ἁπλῶς
  choice: großzügig
  rationale: Im Zusammenhang des Gebens bezeichnet ἁπλῶς am wahrscheinlichsten freigebige, vorbehaltlose Großzügigkeit. „großzügig“ ist verständlich, ohne den Sinn unnötig zu verengen.
- source_word: μὴ ὀνειδίζοντος
  choice: ohne Vorwurf
  rationale: ὀνειδίζω bezeichnet Vorwerfen, Beschämen oder Schmähung. „ohne Vorwurf“ wahrt die knappe partizipiale Charakterisierung; die idiomatischere Alternative wird in einer Fußnote genannt.
- source_word: δοθήσεται αὐτῷ
  choice: dann wird sie ihm gegeben werden
  rationale: Das Futur Passiv drückt die Zusage aus; „sie“ nimmt die feminine „Weisheit“ eindeutig wieder auf. „ihm“ entspricht dem repräsentativ gebrauchten maskulinen Singular.
theological_decisions:
- issue: Repräsentativer maskuliner Singular
  choice: soll er ... ihm
  alternative: soll diese Person ... ihr; sollen sie ... ihnen
  rationale: Die griechische Aussage bezieht sich allgemein auf jede beliebige Person, formuliert dies jedoch im Singular und nimmt sie mit dem maskulinen αὐτῷ wieder auf. Die Übersetzung wahrt Singular und grammatische Form; eine Fußnote erläutert die allgemeine Reichweite.
- issue: Bedeutung von ἁπλῶς beim göttlichen Geben
  choice: großzügig
  alternative: vorbehaltlos; in Einfalt; ohne Hintergedanken
  rationale: Im unmittelbaren Kontext einer Bitte um Weisheit liegt freigebiges Geben nahe. Andere lexikalisch mögliche Nuancen werden nicht zu einer besonderen Lehre ausgebaut.
- issue: Bezug des Passivs δοθήσεται
  choice: wird sie ihm gegeben werden
  alternative: Gott wird sie ihm geben
  rationale: Das Passiv des Ausgangstextes bleibt erhalten und vermeidet, die grammatische Form unnötig aufzulösen, obwohl Gott im Kontext klar als Geber erscheint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter pastoraler Anrede. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber für natürlichen deutschen Sprachfluss leicht gegliedert. Beide Fußnotenmarker stehen an den inhaltlich passenden Stellen im Haupttext.
