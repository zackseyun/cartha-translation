source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: de
  text: Darum legt allen Schmutz und jedes Übermaß an Bosheit[a] ab und nehmt in Sanftmut[b] das eingepflanzte Wort[c] an, das eure Seelen[d] retten kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Fülle des Bösen“; auch: „jeden Überschuss an Schlechtigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit Sanftmut“; auch: „in demütiger Haltung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das angeborene Wort“; traditionell auch: „das eingepfropfte Wort“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „euer Leben“ beziehungsweise „euch selbst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Zusammenhang knapp und natürlich.
- source_word: ἀποθέμενοι
  choice: legt … ab
  rationale: Das Aoristpartizip bezeichnet eine das Hauptgebot begleitende beziehungsweise vorausgesetzte Handlung. Im Deutschen gibt die koordinierte Aufforderung den Zusammenhang natürlicher wieder als eine schwerfällige Partizipialkonstruktion.
- source_word: πᾶσαν ῥυπαρίαν
  choice: allen Schmutz
  rationale: Bewahrt das anschauliche Bild von Schmutz und lässt dessen moralische Bedeutung im Kontext hervortreten.
- source_word: περισσείαν κακίας
  choice: jedes Übermaß an Bosheit
  rationale: περισσεία bezeichnet Fülle, Überschuss oder Übermaß; κακία ist hier allgemein moralisch als Bosheit beziehungsweise Schlechtigkeit zu verstehen, nicht zwingend nur als Arglist.
- source_word: ἐν πραΰτητι
  choice: in Sanftmut
  rationale: Bewahrt die Präpositionalfügung und bezeichnet eine Haltung milder, demütiger Aufnahmebereitschaft.
- source_word: δέξασθε
  choice: nehmt … an
  rationale: Gibt den Imperativ als bewusste, willige Aufnahme idiomatisch wieder.
- source_word: τὸν ἔμφυτον λόγον
  choice: das eingepflanzte Wort
  rationale: ἔμφυτος kann ‚eingepflanzt‘ oder ‚angeboren‘ bedeuten. ‚Eingepflanzt‘ bewahrt das Bild eines im Menschen verwurzelten Wortes, ohne dessen Wirkweise näher festzulegen.
- source_word: τὸν δυνάμενον σῶσαι
  choice: das … retten kann
  rationale: Gibt die attributive Partizipialfügung und die ausgesagte Fähigkeit klar wieder, ohne einen Mechanismus der Rettung hinzuzufügen.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: eure Seelen
  rationale: Bewahrt die traditionelle und in diesem Heilszusammenhang gewichtige Wiedergabe, während die mögliche Bedeutung ‚euer Leben‘ beziehungsweise ‚euch selbst‘ in einer Fußnote sichtbar bleibt.
theological_decisions:
- issue: Bedeutung von ψυχὰς ὑμῶν im Zusammenhang mit Rettung
  choice: eure Seelen
  alternative: euer Leben; euch selbst
  rationale: ‚Seelen‘ wahrt den theologischen Klang des Ausdrucks und die lexikalische Entsprechung, ohne auszuschließen, dass ψυχή die ganze Person bezeichnen kann.
- issue: Bedeutung von ἔμφυτον λόγον
  choice: das eingepflanzte Wort
  alternative: das angeborene Wort; das eingepfropfte Wort
  rationale: Die gewählte Formulierung lässt offen, auf welche Weise das Wort eingepflanzt wurde und wie es nun in den Hörern gegenwärtig ist; so wird die im Griechischen vorhandene Spannung nicht dogmatisch aufgelöst.
- issue: Verhältnis des Partizips ἀποθέμενοι zum Imperativ δέξασθε
  choice: zwei koordinierte Aufforderungen
  alternative: nachdem ihr … abgelegt habt, nehmt … an
  rationale: Das Partizip kann vorausgehendes oder begleitendes Handeln ausdrücken. Die deutsche Koordination wahrt den engen Zusammenhang, ohne eine strikte zeitliche Reihenfolge festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und mündlich verständlich; traditionelle Schlüsselbegriffe wie „Sanftmut“, „Wort“ und „Seelen“ bleiben erhalten, während Fußnoten echte lexikalische Alternativen dokumentieren.
