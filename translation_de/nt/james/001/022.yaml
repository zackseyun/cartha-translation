id: JAS.1.22
reference: James 1:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: de
  text: Setzt das Wort aber in die Tat um und hört es nicht nur an; sonst täuscht ihr euch selbst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sonst führt ihr euch durch falsche Überlegungen selbst in die Irre.«'
    reason: Das griechische Verb παραλογίζομαι bezeichnet eine Täuschung, die durch fehlerhaftes Schlussfolgern oder irreführende Überlegungen zustande kommt.
lexical_decisions:
- source_word: Γίνεσθε
  choice: Setzt … um
  rationale: Der griechische Präsensimperativ fordert zu einer fortdauernden Lebenspraxis auf. Zusammen mit ποιηταὶ λόγου wird dies im Deutschen natürlich als »Setzt das Wort … in die Tat um« wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet im Zusammenhang einen milden Gegensatz zur vorherigen Aufforderung und steht im Deutschen idiomatisch nach dem ersten Satzglied.
- source_word: ποιηταὶ λόγου
  choice: das Wort … in die Tat um
  rationale: Die Wendung bezeichnet Menschen, die tun, was das Wort verlangt. »In die Tat umsetzen« bewahrt den Gegensatz zum bloßen Hören und vermeidet das heute häufig negativ verstandene Substantiv »Täter«.
- source_word: ἀκροαταὶ μόνον
  choice: hört es nicht nur an
  rationale: Gibt sowohl das Hören als auch die einschränkende Bedeutung von μόνον klar und natürlich wieder; das Pronomen »es« bezieht sich auf »das Wort«.
- source_word: παραλογιζόμενοι
  choice: täuscht
  rationale: Das Partizip beschreibt Selbsttäuschung, die auf falschem Schlussfolgern beruht. »Täuschen« ist verständlich und idiomatisch; die genauere Denknuance wird in der Fußnote genannt.
- source_word: ἑαυτούς
  choice: euch selbst
  rationale: Entspricht dem reflexiven Objekt und betont, dass die Angesprochenen die Opfer ihrer eigenen Täuschung sind.
theological_decisions:
- issue: Bedeutung von λόγος
  choice: »das Wort« als die empfangene Botschaft Gottes
  alternative: »die Botschaft« oder »die Lehre«
  rationale: Der unmittelbare Zusammenhang spricht vom eingepflanzten Wort (Jakobus 1,21). »Das Wort« wahrt diese Verbindung und die biblisch-theologische Resonanz, ohne den Ausdruck dogmatisch weiter einzuengen.
- issue: Aspekt von Γίνεσθε
  choice: fortdauernde Aufforderung zu einem vom Tun geprägten Leben
  alternative: 'ingressiv: »Werdet zu Tätern«'
  rationale: Der Präsensimperativ legt eine anhaltende Praxis nahe. Die gewählte aktive Formulierung vermittelt diesen praktischen und fortdauernden Anspruch.
- issue: Verhältnis des Partizips παραλογιζόμενοι zur Mahnung
  choice: als Folge beziehungsweise Kennzeichen des bloßen Hörens mit »sonst« ausgedrückt
  alternative: 'wörtlicher beigeordnet: »wobei ihr euch selbst täuscht«'
  rationale: Die griechische Partizipialkonstruktion lässt den genauen logischen Bezug unausgesprochen. »Sonst« macht im Deutschen die im Kontext naheliegende Warnung verständlich, ohne die Art der Selbsttäuschung theologisch näher festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Mahnton. Die idiomatische Verbform »in die Tat umsetzen« ersetzt das im heutigen Deutsch oft kriminalsprachlich gefärbte »Täter«, bewahrt jedoch den rhetorischen Gegensatz zwischen Tun und bloßem Hören.
