  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: de
  text: 'Wisst[a], meine geliebten Brüder[b]: Jeder Mensch soll schnell zum Hören, langsam zum Reden und langsam zum Zorn sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr wisst“; die griechische Form kann hier als Aufforderung oder als Feststellung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Die griechische Anrede lautet wörtlich „Brüder“, meint hier aber wahrscheinlich die ganze Glaubensgemeinschaft, also Brüder und Schwestern.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: Wisst
  rationale: Die Form kann als Imperativ oder als Indikativ verstanden werden. Der Imperativ passt zum mahnenden Zusammenhang und zu der folgenden Aufforderung; die alternative Deutung wird in einer Fußnote bewahrt.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: meine geliebten Brüder
  rationale: Die grammatisch maskuline Anrede wird formal genau wiedergegeben. Im Kontext kann sie die gesamte Glaubensgemeinschaft einschließlich der Frauen ansprechen; dies wird in einer Fußnote kenntlich gemacht.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: Jeder Mensch soll ... sein
  rationale: „Soll ... sein“ gibt den Imperativ der dritten Person in natürlichem Deutsch wieder. „Jeder Mensch“ bewahrt den generischen Singular, ohne das griechische ἄνθρωπος unnötig auf Männer einzuengen. Das leicht weiterführende δέ muss im Deutschen nicht eigens durch ein starkes „aber“ ausgedrückt werden.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: schnell sein zum Hören
  rationale: Die Formulierung bildet die griechische Konstruktion und ihre einprägsame Parallelstruktur eng ab; „Hören“ umfasst hier aufmerksames Zuhören.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: langsam zum Reden
  rationale: Eine knappe, natürliche Wiedergabe, die den Parallelismus mit „zum Hören“ wahrt.
- source_word: βραδὺς εἰς ὀργήν
  choice: langsam zum Zorn
  rationale: Die Wendung bewahrt die Parallelstruktur und gibt ὀργή als Zorn beziehungsweise aufwallenden Ärger wieder, ohne eine besondere dogmatische Färbung einzutragen.
theological_decisions:
- issue: Inklusiver Umfang der maskulinen Anrede ἀδελφοί
  choice: „Brüder“ im Haupttext, mit Hinweis auf den wahrscheinlich inklusiven Adressatenkreis
  alternative: „Brüder und Schwestern“
  rationale: Der Haupttext bewahrt die grammatische Gestalt des Griechischen, während die Fußnote deutlich macht, dass vermutlich die gesamte Glaubensgemeinschaft angesprochen ist.
- issue: Modus von Ἴστε
  choice: 'Imperativ: „Wisst“'
  alternative: 'Indikativ: „Ihr wisst“'
  rationale: Beide Analysen sind grammatisch möglich. Der Imperativ fügt sich gut in den paränetischen Zusammenhang ein, doch die echte Mehrdeutigkeit wird nicht verschwiegen.
- issue: Generische Bedeutung von πᾶς ἄνθρωπος
  choice: „Jeder Mensch“
  alternative: „Jeder Mann“
  rationale: ἄνθρωπος bezeichnet hier generisch einen Menschen und nicht spezifisch eine männliche Person. „Jeder Mensch“ gibt sowohl die Singularform als auch den universalen Umfang im modernen Deutschen genau wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Anlehnung an die dreigliedrige griechische Parallelstruktur. „Wisst“ ist bewusst knapp; „schnell zum Hören, langsam zum Reden, langsam zum Zorn“ erhält den einprägsamen Rhythmus der Mahnung.
