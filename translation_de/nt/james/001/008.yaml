  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: de
  text: ein Mann mit geteiltem Herzen[a], unbeständig auf allen seinen Wegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mensch mit geteiltem Herzen, unbeständig auf allen seinen Wegen“. Der griechische Text steht im maskulinen Singular, ist hier aber wahrscheinlich repräsentativ gemeint.'
    reason: Lexikalische Alternative und Erläuterung der generischen Aussage
lexical_decisions:
- source_word: ἀνὴρ
  choice: Mann
  rationale: Das Substantiv steht im griechischen Text im maskulinen Singular und bezeichnet hier den zuvor angesprochenen Bittenden. „Mann“ bewahrt die grammatische Form; im Zusammenhang ist die Aussage jedoch repräsentativ und nicht auf männliche Personen beschränkt.
- source_word: δίψυχος
  choice: mit geteiltem Herzen
  rationale: Das seltene Adjektiv bezeichnet wörtlich einen „Zweiseeligen“ und beschreibt einen Menschen, dessen Inneres beziehungsweise Loyalität geteilt ist. „Mit geteiltem Herzen“ gibt dieses Bild in natürlichem, verständlichem Deutsch wieder, ohne die Spannung vorschnell auf bloßen intellektuellen Zweifel zu verengen.
- source_word: ἀκατάστατος
  choice: unbeständig
  rationale: „Unbeständig“ trifft hier den Gedanken mangelnder Festigkeit und Verlässlichkeit. „Unruhig“ wäre schwächer, „ungeordnet“ könnte fälschlich vor allem auf äußere Ordnung bezogen werden.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: auf allen seinen Wegen
  rationale: Die Wegmetapher des griechischen Textes wird beibehalten und bezeichnet die gesamte Lebensführung. Die Formulierung ist im Deutschen verständlich und würdevoll.
theological_decisions:
- issue: Generische Aussage in maskuliner Singularform
  choice: Im Haupttext steht „Mann“; eine Fußnote erläutert die repräsentative Bedeutung.
  alternative: „ein Mensch mit geteiltem Herzen, unbeständig auf allen seinen Wegen“
  rationale: Der griechische Text verwendet ausdrücklich die maskuline Singularform ἀνήρ, doch der Zusammenhang macht deutlich, dass die Warnung allgemein gilt. Die Übersetzung bewahrt deshalb die Form, ohne den Aussagebereich auf Männer zu beschränken.
- issue: Bedeutung von δίψυχος
  choice: „mit geteiltem Herzen“
  alternative: „zweifelnd“, „innerlich gespalten“ oder wörtlich „zweiseelig“
  rationale: Der Ausdruck lässt sowohl innere Zerrissenheit als auch geteilte Loyalität anklingen. „Mit geteiltem Herzen“ bewahrt diese theologische und psychologische Spannung besser als das engere „zweifelnd“; „zweiseelig“ wäre im heutigen Deutsch unverständlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die traditionelle Wegmetapher bleibt erhalten; „mit geteiltem Herzen“ vermeidet sowohl eine schwer verständliche wörtliche Wiedergabe als auch eine Verengung auf bloßen Zweifel.
