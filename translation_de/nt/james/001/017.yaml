id: JAS.1.17
reference: James 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: de
  text: Jede gute Gabe[a] und jedes vollkommene Geschenk kommen von oben und steigen vom Vater der Lichter herab. Bei ihm gibt es weder Veränderung noch einen Schatten infolge eines Wechsels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jedes gute Geben“. Das erste Substantiv kann den Vorgang des Gebens betonen, das zweite eher das Geschenk selbst.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „Schatten eines Wechsels“ oder „wechselnder Schatten“. Die Wendung spielt wahrscheinlich auf die sich verändernden Schatten an, die mit der Bewegung der Himmelslichter verbunden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Jede gute Gabe
  rationale: δόσις kann sowohl das Geben als auch das Gegebene bezeichnen. „Gabe“ ist im Deutschen natürlich; die mögliche Betonung des Gebens wird in einer Fußnote bewahrt.
- source_word: πᾶν δώρημα τέλειον
  choice: jedes vollkommene Geschenk
  rationale: δώρημα bezeichnet vor allem das geschenkte Gut. „Geschenk“ unterscheidet es von δόσις, während „vollkommen“ die Bedeutung von τέλειον als vollständig und uneingeschränkt gut wahrt.
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: kommen von oben und steigen … herab
  rationale: Die deutsche Formulierung gibt Herkunft und abwärts gerichtete Bewegung natürlich wieder. Der Plural folgt der deutschen Grammatik des zusammengesetzten Subjekts, ohne den distributiven Sinn von πᾶσα und πᾶν aufzugeben.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: vom Vater der Lichter
  rationale: Die Metapher und die Genitivverbindung bleiben erhalten. „Lichter“ lässt den wahrscheinlichen Bezug auf die Himmelslichter erkennen, ohne ihn im Haupttext ausdrücklich festzulegen.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: Bei ihm gibt es weder Veränderung
  rationale: παρ’ ᾧ beschreibt hier die Beziehung zu Gott; die existentielle Wendung οὐκ ἔνι wird idiomatisch mit „gibt es … nicht“ wiedergegeben. παραλλαγή bezeichnet Veränderung oder Wechsel.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: noch einen Schatten infolge eines Wechsels
  rationale: Die deutsche weder-noch-Konstruktion gibt die Koordination im verneinten Satz natürlich wieder. „Schatten infolge eines Wechsels“ wahrt das schwierige Schatten- und Bewegungsbild, ohne es zu einer abstrakten Lehraussage zu glätten.
theological_decisions:
- issue: Das Bild vom „Vater der Lichter“ und Gottes Unveränderlichkeit
  choice: Die Metapher bleibt im Haupttext stehen und wird der fehlenden Veränderung beziehungsweise dem fehlenden wechselbedingten Schatten gegenübergestellt.
  alternative: „Lichter“ ausdrücklich als Himmelskörper erklären oder den Schlusssatz abstrakt mit „Gott verändert sich nicht“ wiedergeben.
  rationale: Der griechische Text stellt Gott als Ursprung aller guten Gaben den wechselnden Erscheinungen der geschaffenen Lichter gegenüber. Die Übersetzung bewahrt diese Bildspannung, statt sie dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gabe“ und „Geschenk“ machen die beiden verwandten griechischen Substantive hörbar; die traditionelle Metapher „Vater der Lichter“ bleibt erhalten. Der schwer verständliche Schluss wird behutsam verdeutlicht, aber nicht in eine ausdrückliche Lehrformel aufgelöst.
