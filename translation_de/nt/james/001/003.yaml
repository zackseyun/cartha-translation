translation:
  language: de
  text: Denn ihr wisst, dass die Erprobung eures Glaubens Ausdauer bewirkt[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die erwiesene Echtheit eures Glaubens«. Das griechische Wort kann sowohl den Vorgang der Erprobung als auch die dabei erwiesene Echtheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »standhaftes Ausharren« oder »Beharrlichkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: Denn ihr wisst
  rationale: Das präsentische Partizip knüpft begründend an die Aufforderung in Vers 2 an. Die finite Wiedergabe ist im modernen Deutschen natürlich und macht den kausalen Zusammenhang deutlich.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt leitet idiomatisch den Inhalt dessen ein, was die Leser wissen; die kausale Beziehung ist bereits durch „Denn“ ausgedrückt.
- source_word: τὸ δοκίμιον
  choice: die Erprobung
  rationale: δοκίμιον kann sowohl den Vorgang des Prüfens als auch die dadurch erwiesene Echtheit bezeichnen. „Erprobung“ passt zum Zusammenhang der Prüfungen und lässt den Aspekt des Bewährens anklingen.
- source_word: ὑμῶν τῆς πίστεως
  choice: eures Glaubens
  rationale: Der Genitiv bezeichnet den Glauben der Adressaten als das, was erprobt wird. „Glaube“ ist hier die klare und etablierte Wiedergabe von πίστις.
- source_word: κατεργάζεται
  choice: bewirkt
  rationale: Das Verb bezeichnet, dass die Erprobung ein Ergebnis hervorbringt. „Bewirkt“ gibt diese resultative Bedeutung prägnant wieder.
- source_word: ὑπομονήν
  choice: standhaftes Ausharren
  rationale: ὑπομονή bezeichnet beharrliches Standhalten unter Belastung. „Standhaftes Ausharren“ ist verständlich und bildet sowohl Beständigkeit als auch Ausdauer ab.
theological_decisions:
- issue: Wiedergabe von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Im Zusammenhang wird der Glaube der Adressaten durch Prüfungen erprobt. „Glaube“ wahrt die theologische Breite des Begriffs, ohne ihn auf subjektives Vertrauen oder gelebte Treue einzuengen.
- issue: Mehrdeutigkeit von δοκίμιον
  choice: Erprobung als Vorgang im Haupttext
  alternative: erwiesene Echtheit als Ergebnis
  rationale: Der Zusammenhang mit den Prüfungen in Vers 2 spricht für den Vorgang; die mögliche Ergebnisbedeutung ist jedoch echt und wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt vermeidet eine schwerfällige Konstruktion mit „dass“. „Standhaftes Ausharren“ ist etwas gehobener, bleibt aber allgemein verständlich und gibt den Bedeutungsumfang von ὑπομονή präziser wieder als bloßes „Geduld“.
