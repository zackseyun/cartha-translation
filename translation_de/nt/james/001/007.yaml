  - severity: low
    issue: Die Fußnotenalternative „eine solche Person“ entspricht dem Demonstrativum ἐκεῖνος nicht genau.
    rationale: „Solche“ legt eine qualitative Bedeutung nahe. „Jene Person“ gibt die mögliche personenbezogene, aber weiterhin demonstrative Wiedergabe präziser wieder.
