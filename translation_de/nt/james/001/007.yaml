  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: de
  text: Denn jener Mensch[a] soll nicht meinen, er werde etwas vom Herrn empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jene Person“. Die griechische Form steht im maskulinen Singular („jener Mensch“), bezeichnet aber repräsentativ den zweifelnden Menschen aus dem vorherigen Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Denn ... soll nicht
  rationale: γάρ begründet die Warnung mit der Beschreibung des Zweifelnden im vorherigen Vers. „Denn“ erhält diesen Zusammenhang; μή mit dem Verb in der dritten Person wird im Deutschen natürlich als nachdrückliche Aufforderung mit „soll nicht“ wiedergegeben.
- source_word: οἰέσθω
  choice: soll ... meinen
  rationale: οἴομαι bezeichnet das Denken oder Annehmen. „Meinen“ gibt den mentalen Vorgang wieder, ohne ihn bereits als Erwartung des Empfangens auszulegen.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: jener Mensch
  rationale: Die demonstrative, maskuline Singularform wird formnah bewahrt und verweist auf den im vorherigen Vers beschriebenen Zweifelnden. Der repräsentative Sinn wird in einer Fußnote erläutert.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt dessen ein, was der Mensch nicht meinen soll; der deutsche dass-Satz entspricht dieser Funktion.
- source_word: λήμψεταί
  choice: empfangen wird
  rationale: Das Futur von λαμβάνω bezeichnet hier den künftigen Empfang. „Empfangen“ passt zum genannten Geber und wahrt den gehobenen, aber verständlichen Ton.
- source_word: τι
  choice: etwas
  rationale: Im Bereich der Verneinung bezeichnet τι etwas Unbestimmtes; im deutschen dass-Satz ist „etwas“ idiomatisch, wobei „nicht ... etwas“ im Gesamtsatz den Sinn ausdrückt, dass kein Empfang erwartet werden soll.
- source_word: παρὰ τοῦ κυρίου
  choice: vom Herrn
  rationale: παρά mit Genitiv bezeichnet die Herkunft oder Quelle. „Vom Herrn“ bewahrt κύριος als Titel und legt dessen Referenten nicht genauer fest, als es der griechische Text tut.
theological_decisions:
- issue: Referent von τοῦ κυρίου
  choice: der Herr
  alternative: Gott; der Herr, Gott
  rationale: Der griechische Text nennt κύριος ohne nähere Bestimmung. „Der Herr“ bewahrt diese Offenheit und vermeidet eine explizitere Identifizierung.
- issue: Geschlecht und repräsentativer Sinn von ὁ ἄνθρωπος ἐκεῖνος
  choice: jener Mensch
  alternative: eine solche Person
  rationale: Die maskuline Singularform und der demonstrative Rückverweis werden im Haupttext erhalten. Zugleich macht die Fußnote deutlich, dass der einzelne Zweifelnde repräsentativ gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, ohne unnatürlich zu wirken; „jener Mensch“ bewahrt den markierten Rückverweis des Originals.
