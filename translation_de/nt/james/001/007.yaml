  naturalness: „Denn jener Mensch soll nicht meinen, dass er etwas vom Herrn empfangen wird“ ist zwar grundsätzlich verständlich, aber die Verbindung von „empfangen wird“ kann kurzzeitig passivisch wirken und klingt weniger klar als ein Konjunktiv-I-Futur im abhängigen Gedankengang.
  terminology: „Herr“ bewahrt κύριος sachgerecht und ohne den Referenten über den Wortlaut hinaus festzulegen. „Jener Mensch“ ist ein angemessen formnahes, modernes Register für den demonstrativen Rückverweis. Die Fußnotenalternative sollte „jene Person“ statt „eine solche Person“ lauten, da ἐκεῖνος primär deiktisch („jener/jene“) und nicht qualitativ („solch“) ist.
