id: JAS.1.15
reference: James 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: de
  text: Dann gebiert die Begierde, nachdem sie empfangen hat[a], die Sünde; die Sünde aber gebiert, wenn sie zur Reife gelangt ist[b], den Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „als sie empfangen hatte“. Das griechische Partizip verbindet das Bild der Empfängnis eng mit der Begierde und bezeichnet eine der Geburt vorausgehende Handlung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „wenn sie vollendet ist“ oder „wenn sie völlig ausgereift ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Dann
  rationale: Kennzeichnet die nächste Stufe in der Abfolge von Versuchung, Sünde und Tod.
- source_word: ἐπιθυμία
  choice: Begierde
  rationale: Bezeichnet hier im Zusammenhang ein fehlgeleitetes Verlangen allgemein; eine auf sexuelles Begehren verengte Wiedergabe wäre zu eng.
- source_word: συλλαβοῦσα
  choice: nachdem sie empfangen hat
  rationale: Gibt die dem Hauptverb vorausgehende Handlung wieder und bewahrt das Bild von Empfängnis und Geburt.
- source_word: τίκτει
  choice: gebiert
  rationale: Bewahrt die personifizierende Geburtsmetaphorik klar und prägnant.
- source_word: ἁμαρτίαν
  choice: die Sünde
  rationale: Entspricht dem üblichen und kontextuell genauen Sinn des griechischen Begriffs.
- source_word: δὲ
  choice: aber
  rationale: Markiert den Übergang von der Begierde zur personifizierten Sünde und lässt zugleich einen leichten Kontrast erkennen.
- source_word: ἀποτελεσθεῖσα
  choice: wenn sie zur Reife gelangt ist
  rationale: Drückt das Erreichen von Vollendung oder Reife aus und fügt sich natürlich in die organische Bildfolge ein.
- source_word: ἀποκύει
  choice: gebiert
  rationale: Das Verb gehört ebenfalls zum Geburtsbild; die bewusste Wiederholung macht die fortschreitende Kette im Deutschen deutlich.
- source_word: θάνατον
  choice: den Tod
  rationale: Gibt den offenen, nicht näher eingeschränkten Ausdruck des Ausgangstextes unmittelbar wieder.
theological_decisions:
- issue: Bildhafte Verbindung von Begierde, Sünde und Tod
  choice: Das Bild von Empfängnis, Geburt und Reifung wird als Personifikation bewahrt.
  alternative: Die Aussage lediglich als abstrakte Ursache-Wirkungs-Kette wiederzugeben.
  rationale: Eine bloße Paraphrase wie „Begierde führt zu Sünde“ würde die rhetorische Kraft und die organische Entwicklung des griechischen Bildes abschwächen.
- issue: Bedeutungsumfang von θάνατος
  choice: Schlicht „Tod“, ohne nähere Bestimmung.
  alternative: „geistlicher Tod“ oder „ewiger Tod“.
  rationale: Der Ausgangstext bestimmt die Art des Todes nicht näher; die Übersetzung soll diese theologische Offenheit nicht einengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Begierde“ ist allgemein verständlich und bezeichnet hier fehlgeleitetes Verlangen, ohne den Sinn auf Sexualität zu verengen. Die wiederholte Form „gebiert“ bewahrt die markante Geburtsmetaphorik des griechischen Textes.
