id: JAS.1.26
reference: James 1:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: de
  text: Wenn jemand meint, religiös zu sein, aber seine Zunge nicht im Zaum hält, sondern sein Herz täuscht, dessen Religion ist wertlos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn jemand religiös zu sein scheint …, dann ist seine Religion nichtig (oder: vergeblich, nutzlos).“'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: meint
  rationale: „Meint“ gibt hier die persönliche Selbsteinschätzung wieder; die alternative Bedeutung „scheint“ bleibt in der Fußnote erhalten.
- source_word: θρησκὸς ... θρησκεία
  choice: religiös ... Religion
  rationale: Die verwandten deutschen Wörter bewahren die lexikalische Verbindung und bezeichnen religiöse Haltung beziehungsweise Praxis, ohne eine bestimmte Konfession vorauszusetzen.
- source_word: μὴ χαλιναγωγῶν γλῶσσαν αὐτοῦ
  choice: seine Zunge nicht im Zaum hält
  rationale: Die geläufige deutsche Wendung bewahrt sowohl das Bild des Zaumzeugs als auch den konkreten Bezug auf die Zunge.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: sein Herz täuscht
  rationale: Die wörtlich-nahe Formulierung erhält „Herz“ als Bezeichnung des inneren Menschen und lässt die ungewöhnliche Aussage des Griechischen bestehen.
- source_word: τούτου
  choice: dessen
  rationale: „Dessen“ greift die zuvor beschriebene Person knapp und mit der demonstrativen Rückverweisung des griechischen Ausdrucks auf.
- source_word: μάταιος
  choice: wertlos
  rationale: „Wertlos“ vermittelt in heutigem Deutsch deutlich die Bedeutung von nichtig, vergeblich oder ohne wirklichen Nutzen.
theological_decisions:
- issue: Generische Personenbezeichnung
  choice: jemand ... seine ... sein ... dessen
  alternative: jemand ... die eigene ... das eigene ... dessen
  rationale: Das Deutsche verwendet nach „jemand“ natürliche grammatisch maskuline Rückbezüge, ohne den allgemeinen Geltungsbereich auf Männer zu beschränken.
- issue: Bedeutung von θρησκεία/θρησκός
  choice: religiös / Religion
  alternative: fromm / Frömmigkeit; gottesdienstlich / Gottesdienst
  rationale: Die gewählte Wortfamilie bewahrt den Zusammenhang beider griechischer Ausdrücke und vermeidet eine Verengung auf innerliche Frömmigkeit oder den Gottesdienst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Zunge im Zaum halten“ ist idiomatisch verständlich und bewahrt zugleich das Bild des griechischen Verbs. Der Fußnotenmarker steht nach dem gesamten Satz, da die Fußnote mehrere lexikalische Alternativen des Verses bündelt.
