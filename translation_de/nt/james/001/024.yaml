  naturalness: „Wie er beschaffen war“ klingt in modernem Standarddeutsch für eine Person unidiomatisch und sachlich-technisch. „Was für ein Mensch er war“ ist natürlich, wahrt den qualitativen Sinn und passt zum Kontext der Selbstwahrnehmung im Spiegel.
