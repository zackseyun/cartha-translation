  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: de
  text: Denn er hat sich selbst betrachtet, ist weggegangen und hat sofort vergessen, was für ein Mensch er war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was für einer er war“. Der griechische Ausdruck bezeichnet die Art oder Beschaffenheit einer Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: hat … betrachtet
  rationale: κατανοέω bezeichnet ein aufmerksames Wahrnehmen oder Betrachten. Im Spiegelbild ist „betrachten“ natürlich und bewahrt mehr von der bewussten Wahrnehmung als das bloße „ansehen“.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die Aussage des vorangehenden Verses; „denn“ gibt diesen erklärenden Zusammenhang knapp und idiomatisch wieder.
- source_word: ἑαυτὸν
  choice: sich selbst
  rationale: Das Reflexivpronomen bezeichnet hier unmittelbar die eigene Person. Das im Kontext erwähnte Gesicht wird in diesem Vers nicht wiederholt.
- source_word: ἀπελήλυθεν
  choice: ist weggegangen
  rationale: Der Perfekt von ἀπέρχομαι bezeichnet das Weggehen mit erreichtem Ergebnis. Das deutsche Perfekt passt natürlich in die Verbfolge und bildet die griechische Form angemessen ab.
- source_word: εὐθέως
  choice: sofort
  rationale: „Sofort“ gibt die unmittelbare zeitliche Abfolge klar und in modernem Standarddeutsch wieder.
- source_word: ἐπελάθετο
  choice: hat … vergessen
  rationale: ἐπιλανθάνομαι bedeutet, etwas zu vergessen beziehungsweise nicht mehr im Gedächtnis zu behalten. „Vergessen“ ist die direkte idiomatische Entsprechung.
- source_word: ὁποῖος ἦν
  choice: wie er beschaffen war
  rationale: ὁποῖος fragt nach Art oder Beschaffenheit, nicht nur nach Identität. Die Formulierung hält diesen qualitativen Sinn offen, ohne eine moralische Bewertung hinzuzufügen.
theological_decisions:
- issue: Generisch maskuline Einzelfigur im Spiegelvergleich
  choice: wie er beschaffen war
  alternative: was für ein Mensch er war
  rationale: Die griechische Form ist maskulin Singular, dient im Zusammenhang aber als allgemeines Beispiel. Die gewählte deutsche Form folgt der einzelnen Vergleichsfigur, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Verbindung mit „und“ bewahrt die auffällige griechische Handlungsfolge; das Perfekt klingt im Deutschen natürlich und spiegelt zugleich den griechischen Wechsel von Aorist zu Perfekt und zurück zum Aorist annähernd wider.
