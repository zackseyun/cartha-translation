id: JAS.1.13
reference: James 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: de
  text: 'Niemand, der versucht wird, soll sagen: »Ich werde von Gott versucht.« Denn Gott kann nicht zum Bösen versucht werden, und er selbst versucht niemanden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδεὶς … λεγέτω
  choice: Niemand … soll sagen
  rationale: Die Verbindung aus negativem Indefinitpronomen und Imperativ wird im modernen Deutschen natürlich als Verbot mit »soll« wiedergegeben.
- source_word: πειραζόμενος
  choice: der versucht wird
  rationale: Das Präsenspartizip Passiv bezeichnet jemanden, der Versuchung erfährt. Im Zusammenhang mit Begierde und Sünde ist »versucht« treffender als das breitere »geprüft«.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Ich werde von Gott versucht
  rationale: ἀπό bezeichnet hier bei der Passivform die behauptete Quelle beziehungsweise den Urheber; »von Gott« ist idiomatisch und bewahrt die passive Form.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: kann nicht zum Bösen versucht werden
  rationale: Das seltene Adjektiv ἀπείραστος bezeichnet im Kontext Gottes Unzugänglichkeit für Versuchung. »zum Bösen« gibt den Genitiv Plural κακῶν natürlich wieder, ohne ihn auf einzelne böse Taten einzuengen.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: und er selbst versucht niemanden
  rationale: »versucht« hält die Wortwiederholung fest; »er selbst« bewahrt die Betonung des Pronomens αὐτός, und »niemanden« entspricht οὐδένα.
theological_decisions:
- issue: Bedeutung der πειράζω-Wortgruppe
  choice: Durchgehend mit »versuchen« wiedergeben
  alternative: An einer oder mehreren Stellen »prüfen« verwenden
  rationale: Der unmittelbare Zusammenhang handelt von der Verlockung zur Sünde, nicht von Prüfung im allgemeineren Sinn. Damit wird nicht bestritten, dass Gott Menschen in einem anderen Sinn prüfen kann.
- issue: Deutung von ἀπείραστός ἐστιν κακῶν
  choice: Gott kann nicht zum Bösen versucht werden
  alternative: Gott ist vom Bösen unversuchbar; Gott ist mit Bösem unerfahren
  rationale: Die griechische Wendung ist selten und lexikalisch schwierig. Die gewählte Fassung gibt die im Zusammenhang naheliegende Aussage wieder, dass das Böse bei Gott keinen Ansatzpunkt zur Versuchung findet, ohne die ungewöhnliche deutsche Neubildung »unversuchbar« in den Haupttext zu setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »versucht« ist bewusst beibehalten, weil sie die enge argumentative Verknüpfung des griechischen Textes trägt. Direkte Rede wird mit deutschen Anführungszeichen gesetzt.
