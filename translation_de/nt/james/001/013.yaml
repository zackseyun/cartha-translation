review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und Argumentation des griechischen Textes zuverlässig wieder: das Verbot (μηδεὶς … λεγέτω), die gegenwärtig-passive Versuchung (πειραζόμενος), die behauptete Urheberschaft Gottes (ἀπὸ θεοῦ), Gottes Unzugänglichkeit für Versuchung zum Bösen (ἀπείραστός ἐστιν κακῶν) und die betonte abschließende Verneinung (αὐτὸς οὐδένα) sind erhalten. »Zum Bösen« ist für das schwierige κακῶν eine natürliche deutsche kontextuelle Wiedergabe und legt keine über den Kontext hinausgehende Lehre fest.'
  naturalness: Modernes Standarddeutsch, klar und würdig. Die Wiederholung von »versucht« ist im Deutschen tragfähig und bildet die gezielte Wiederholung von πειράζω. »Kann nicht zum Bösen versucht werden« ist idiomatischer als eine künstliche Bildung wie »unversuchbar«.
  terminology: »Versuchen/Versuchung« ist im unmittelbaren Kontext gegenüber »prüfen« angemessen. »Von Gott« gibt die behauptete Quelle bzw. Urheberschaft idiomatisch wieder. Die Hervorhebung in »er selbst versucht niemanden« entspricht αὐτός. Eigennamen oder sonstige feststehende theologische Termini sind nicht betroffen.
  issues: []
  revised_text: 'Niemand, der versucht wird, soll sagen: »Ich werde von Gott versucht.« Denn Gott kann nicht zum Bösen versucht werden, und er selbst versucht niemanden.'
  revised_footnotes: []
  revision_rationale: Keine sichere Korrektur erforderlich. Die englische Fußnote behandelt die dort gewählte, bewusst wörtliche Formulierung »untemptable by evil(s)«. Der deutsche Haupttext verwendet bereits die natürliche erläuternde Entsprechung »kann nicht zum Bösen versucht werden«; daher ist keine Fußnote und folglich kein Fußnotenanker erforderlich.
