  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: de
  text: 'Jakobus, ein Sklave[a] Gottes und des Herrn Jesus Christus[b], an die zwölf Stämme in der Zerstreuung[c]: Seid gegrüßt!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“ beziehungsweise traditionell „Knecht“. Das griechische Wort bezeichnet jemanden, der einem Herrn gehört.'
    reason: lexical_alternative
  - marker: b
    text: „Christus“ bedeutet „der Gesalbte“, also „der Messias“.
    reason: title_explanation
  - marker: c
    text: Die „Zerstreuung“ (Diaspora) bezeichnet das Leben jüdischer Menschen außerhalb des Landes Israel.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Jakobus
  rationale: „Jakobus“ ist die im Deutschen etablierte Namensform für den Verfasser; die griechische Form entspricht geschichtlich dem Namen Jakob.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv bezeichnet die Zugehörigkeit des Sklaven zu Gott und wird knapp und formal entsprechend wiedergegeben.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ bewahrt sowohl den Autoritätsanspruch als auch den im Neuen Testament üblichen christologischen Titel.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: „Christus“ ist im Deutschen die etablierte Wiedergabe von Χριστός und lässt sich zugleich als Titel „Messias“ verstehen; eine Fußnote hält diese Bedeutung ausdrücklich fest.
- source_word: δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet einen Menschen, der einem Herrn gehört. „Sklave“ bewahrt den starken Zugehörigkeitssinn deutlicher als „Diener“, auch wenn es im Deutschen bewusst hart klingt.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: an die zwölf Stämme
  rationale: Die Wiedergabe erhält die israelitische Bundes- und Stammesbezeichnung, ohne sie zu verallgemeinern.
- source_word: διασπορᾷ
  choice: Zerstreuung
  rationale: „Zerstreuung“ gibt den jüdischen Fachbegriff für das Leben außerhalb des Landes Israel wieder und wahrt zugleich das Bild des Zerstreutseins.
- source_word: χαίρειν
  choice: Seid gegrüßt!
  rationale: Hier liegt die übliche griechische Briefformel vor; eine wörtliche Wiedergabe als „Freut euch“ würde ihre Funktion am Briefanfang verfehlen.
theological_decisions:
- issue: Bedeutung von Χριστός in der Bezeichnung Jesu
  choice: Christus, mit Erläuterung „Messias“
  alternative: Messias
  rationale: Χριστός ist ein Titel mit der Bedeutung „Gesalbter/Messias“, wird in der deutschen Bibel- und Allgemeinsprache jedoch idiomatisch als „Christus“ gebraucht. Die Fußnote verhindert, dass der Titel nur als zweiter Eigenname verstanden wird.
- issue: Selbstbezeichnung mit δοῦλος
  choice: Sklave
  alternative: Diener; Knecht
  rationale: Die Formulierung drückt umfassende Zugehörigkeit zu Gott und zum Herrn Jesus Christus aus. „Diener“ ist natürlicher, schwächt aber das Besitz- und Bindungsverhältnis; „Knecht“ ist traditionell, im heutigen Deutsch jedoch weniger klar.
- issue: Bezug der beiden Genitive θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: Gott und der Herr Jesus Christus als gemeinsam genannte Herren des Sklaven
  alternative: Keine syntaktisch eigenständige Alternative erforderlich
  rationale: Das eine δοῦλος wird durch zwei mit καί verbundene Genitivangaben bestimmt. Die Übersetzung bewahrt diese enge Zuordnung, ohne daraus eine weitergehende dogmatische Erklärung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sklave“ ist absichtlich stärker als das geläufigere „Diener“ und wahrt die Aussage des griechischen δοῦλος. „Seid gegrüßt!“ gibt die antike Briefformel verständlich und idiomatisch wieder. Die traditionelle Wendung „in der Zerstreuung“ erhält den bildhaften und halbtechnischen Charakter des Ausgangstextes.
