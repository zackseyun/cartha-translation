id: JAS.1.11
reference: James 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: de
  text: Denn die Sonne ging auf mit ihrer sengenden Hitze[a] und ließ das Gras verdorren; seine Blüte fiel ab, und die Schönheit seiner Erscheinung verging. So wird auch der Reiche mitten in seinen Unternehmungen[b] verwelken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem sengenden Wind“. Das griechische Wort kann die brennende Hitze und in manchen Zusammenhängen auch den damit verbundenen heißen Wind bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „auf seinen Wegen“ oder „auf seinen Reisen“. Gemeint sein kann auch allgemeiner der Gang seiner Tätigkeiten und Unternehmungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: ging auf
  rationale: Der Aorist bezeichnet im anschaulichen Vergleich ein schlichtes vergangenes Geschehen; „ging auf“ ist die natürliche deutsche Wendung für den Sonnenaufgang.
- source_word: σὺν τῷ καύσωνι
  choice: mit ihrer sengenden Hitze
  rationale: καύσων kann sengende Hitze oder den damit verbundenen heißen Wind bezeichnen. Mit der Sonne als Subjekt ist „mit ihrer sengenden Hitze“ natürlich und bewahrt die Bildkraft.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: ließ das Gras verdorren
  rationale: ξηραίνω beschreibt hier die austrocknende Wirkung der Hitze auf die Vegetation. „Verdorren lassen“ gibt Ursache und Ergebnis idiomatisch wieder.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: seine Blüte fiel ab
  rationale: ἐκπίπτω bezeichnet das Herab- oder Abfallen; „fiel ab“ hält das konkrete Pflanzenbild fest.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: die Schönheit seiner Erscheinung
  rationale: εὐπρέπεια bezeichnet Schönheit oder ansprechende Gestalt, während πρόσωπον hier die sichtbare Erscheinung meint. Die Formulierung vermeidet eine unnatürliche Rede vom „Gesicht“ des Grases beziehungsweise seiner Blüte.
- source_word: ἀπώλετο
  choice: verging
  rationale: Die Form bezeichnet hier das Zugrundegehen beziehungsweise Verschwinden der Schönheit. „Verging“ ist würdig, verständlich und passt zur Vergänglichkeit des Bildes.
- source_word: ὁ πλούσιος
  choice: der Reiche
  rationale: Das substantivierte maskuline Adjektiv bezeichnet eine repräsentative Einzelperson. „Der Reiche“ ist im Deutschen präzise und schließt die Warnung ihrem Sinn nach nicht auf Männer ein.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: mitten in seinen Unternehmungen
  rationale: πορεία kann wörtlich Reisen oder allgemeiner den Gang und die Tätigkeiten des Lebens meinen. „Unternehmungen“ wahrt den breiteren Bezug, während eine Fußnote die wörtliche Möglichkeit nennt.
- source_word: μαρανθήσεται
  choice: wird … verwelken
  rationale: Das Futur setzt das Pflanzenbild fort und drückt die Gewissheit des kommenden Vergehens aus.
theological_decisions:
- issue: Geschlechtliche Form von ὁ πλούσιος
  choice: der Reiche
  alternative: der reiche Mensch
  rationale: Die grammatisch maskuline Singularform bleibt als repräsentative Gestalt sichtbar, ohne den Geltungsbereich der Warnung unnötig einzuschränken.
- issue: Bedeutungsumfang von πορείαις
  choice: Unternehmungen
  alternative: Reisen
  rationale: Der Kontext zielt wahrscheinlich auf den aktiven Lebensvollzug des Reichen. Da der griechische Ausdruck auch wörtliche Reisen bezeichnen kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzrhythmus folgt dem fortschreitenden Bild des griechischen Textes; die Pflanzenmetaphorik wird konsequent beibehalten.
