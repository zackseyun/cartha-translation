base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: de
  text: Die Standhaftigkeit aber soll ihr Werk zur Vollendung bringen[a], damit ihr reif und in jeder Hinsicht vollständig seid, ohne dass euch etwas fehlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll ihr Werk vollkommen bzw. vollständig zu Ende führen“. Die verwandten griechischen Begriffe bezeichnen hier sowohl das Erreichen eines vorgesehenen Ziels als auch Ganzheit in allen Teilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: Standhaftigkeit
  rationale: Bezeichnet beharrliches Ausharren unter Prüfungen; „Standhaftigkeit“ ist im Deutschen aktiv und kontextgerecht, ohne die mögliche Passivität von „Geduld“.
- source_word: ἔργον τέλειον ἐχέτω
  choice: soll ihr Werk zur Vollendung bringen
  rationale: Gibt den Imperativ und das Bild eines Werkes wieder, das sein vorgesehenes Ziel erreicht, ohne die im Deutschen schwer verständliche Wendung „ein vollkommenes Werk haben“ wörtlich nachzubilden.
- source_word: τέλειοι
  choice: reif
  rationale: Bei Personen kann τέλειος das Erreichen des vorgesehenen Ziels beziehungsweise geistliche Reife bezeichnen; „reif“ vermeidet eine vorschnelle Festlegung auf absolute Sündlosigkeit.
- source_word: ὁλόκληροι
  choice: unversehrt
  rationale: Hebt Ganzheit und Vollständigkeit in allen Teilen hervor und bleibt von „reif“ semantisch unterscheidbar.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: es euch an nichts fehlt
  rationale: Natürliche deutsche Wiedergabe der umfassenden Aussage, dass in keiner Hinsicht ein Mangel besteht.
- source_word: δὲ
  choice: aber
  rationale: Markiert den weiterführenden, leicht abgrenzenden Anschluss an den vorherigen Gedanken; im Deutschen ist „aber“ hier natürlich und bewahrt die Diskurspartikel.
theological_decisions:
- issue: Bedeutung von τέλειος im Zusammenhang geistlicher Bewährung
  choice: reif
  alternative: vollkommen
  rationale: Der Ausdruck kann sowohl Zielerreichung und Reife als auch Vollkommenheit anklingen lassen. Der Haupttext verwendet das verständliche „reif“, während die Fußnote die weitergehende Bedeutung offenhält und keine konfessionelle Vollkommenheitslehre festschreibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung wahrt das Arbeitsbild des griechischen Textes, bleibt für heutige Leser verständlich und lässt die Spannung zwischen Reife, Vollendung und Vollkommenheit bestehen.
