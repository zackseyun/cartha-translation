id: JAS.1.10
reference: James 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: de
  text: Der Reiche aber soll sich seiner Erniedrigung rühmen[a]; denn wie eine Blüte des Grases[b] wird er vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier ohne wiederholtes Verb: »der Reiche aber in seiner Erniedrigung«. Die Aufforderung »soll sich rühmen« ist aus dem vorhergehenden Vers ergänzt.'
    reason: alternative_reading
  - marker: b
    text: »Blüte des Grases« gibt das griechische Bild wörtlich wieder und hebt hervor, wie rasch der Reiche vergeht – wie Pflanzen, während sie blühen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: Der Reiche aber
  rationale: Das substantivierte maskuline Adjektiv bezeichnet hier den reichen Mann; δέ stellt ihn dem niedrig gestellten Bruder aus Vers 9 gegenüber, ohne einen schroffen Gegensatz zu erzwingen.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: seiner Erniedrigung
  rationale: ταπείνωσις bezeichnet hier das Herabgesetzt- oder Erniedrigtwerden. Der Kontext begründet dies mit der Vergänglichkeit des Reichen; daher ist nicht vorrangig die Tugend der Demut gemeint. Wegen des im Deutschen üblichen Verbs »sich rühmen« wird die griechische Präpositionalfügung idiomatisch mit dem Genitiv wiedergegeben.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet die Begründung ein. »Denn« gibt den kausalen Zusammenhang in diesem Satz natürlich und würdig wieder.
- source_word: ὡς ἄνθος χόρτου
  choice: wie eine Blüte des Grases
  rationale: Die Formulierung bewahrt das konkrete und schriftsprachlich vertraute griechische Bild. Sie vermeidet die Ergänzung »des Feldes«, die im Ausgangstext nicht steht.
- source_word: παρελεύσεται
  choice: wird er vergehen
  rationale: παρέρχομαι bezeichnet hier im Bild der rasch verwelkenden Vegetation das Verschwinden und die Vergänglichkeit des Reichen. »Vergehen« erhält diese Bedeutungsweite.
theological_decisions:
- issue: Ellipse aus dem vorhergehenden Vers
  choice: 'Das in Vers 9 stehende Aufforderungsverb wird zur Bildung eines verständlichen deutschen Satzes ausdrücklich ergänzt: »soll sich … rühmen«.'
  alternative: 'Die Ellipse formal stehen lassen: »der Reiche aber in seiner Erniedrigung«.'
  rationale: Im Griechischen hängt Vers 10 syntaktisch von καυχάσθω in Vers 9 ab. Eine wortgetreue Auslassung ergäbe im Deutschen nur ein schwer verständliches Satzfragment. Die Fußnote macht transparent, dass das Verb ergänzt wurde.
- issue: Bedeutung der Erniedrigung des Reichen
  choice: Die Formulierung bezeichnet sein Erniedrigtwerden angesichts der Vergänglichkeit von Leben, Reichtum und gesellschaftlichem Rang.
  alternative: Freiwillige Demut oder lediglich ein allgemein niedriger sozialer Stand.
  rationale: Die anschließende Begründung durch das Bild der vergänglichen Grasblüte legt eine Umkehr und Herabsetzung nahe, ohne genauer festzulegen, ob diese schon gegenwärtig oder erst künftig vollzogen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die aus Vers 9 übernommene Aufforderung wird zur Verständlichkeit ergänzt und in einer Fußnote offengelegt. Das ungewöhnliche, aber verständliche Bild »Blüte des Grases« bleibt erhalten.
