id: JAS.1.18
reference: James 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: de
  text: Weil er es wollte[a], brachte er uns durch das Wort der Wahrheit zur Welt, damit wir gewissermaßen eine Erstlingsfrucht[b] unter seinen Geschöpfen seien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Aus eigenem Willen brachte er uns durch das Wort der Wahrheit zur Welt.“'
    reason: alternative_reading
  - marker: b
    text: „Erstlingsfrucht“ bezeichnet den ersten und Gott geweihten Anteil einer Ernte. Hier stellt das Bild die Glaubenden als einen ersten, Gott zugehörigen Anteil unter seinen Geschöpfen dar.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Weil er es wollte
  rationale: Das Aoristpartizip bezeichnet Gottes vorausgehenden Willen und hat hier wahrscheinlich kausale Kraft. Die Formulierung betont Gottes Initiative, ohne ein bestimmtes Lehrsystem einzutragen.
- source_word: ἀπεκύησεν
  choice: gebar er uns
  rationale: Das Verb bezeichnet Gebären beziehungsweise Hervorbringen. Die Geburtsmetapher bleibt erhalten und greift den bewussten Gegensatz zu Vers 15 auf, wo die Begierde die Sünde gebiert.
- source_word: λόγῳ ἀληθείας
  choice: durch das Wort der Wahrheit
  rationale: Der Dativ bezeichnet das Mittel. Die traditionelle und verständliche Wendung bewahrt sowohl den Wahrheitsanspruch als auch die mögliche Bezugnahme auf die Evangeliumsbotschaft, ohne diese ausdrücklich festzulegen.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: damit wir … seien
  rationale: Die Konstruktion kann Zweck oder Ergebnis ausdrücken. „Damit“ gibt ihre Zielrichtung natürlich wieder, ohne das Verhältnis dogmatisch enger zu bestimmen.
- source_word: ἀπαρχήν
  choice: Erstlingsfrucht
  rationale: Der Ausdruck stammt aus dem Ernte- und Opferbereich und bezeichnet den ersten, Gott geweihten Anteil. „Erstlingsfrucht“ erhält dieses biblische Bild.
- source_word: τινα
  choice: gewissermaßen eine
  rationale: 'Das Indefinitpronomen qualifiziert die Aussage: Die Glaubenden sind in einem bestimmten beziehungsweise bildlichen Sinn Erstlingsfrucht. „Gewissermaßen“ gibt diese Abschwächung idiomatisch wieder.'
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: unter seinen Geschöpfen
  rationale: κτίσματα bezeichnet geschaffene Wesen oder Dinge im Plural. „Unter seinen Geschöpfen“ wahrt den weiten Bezug und macht den partitiven Sinn des Genitivs im Deutschen verständlich.
theological_decisions:
- issue: Gottes Initiative bei der neuen Geburt
  choice: Gottes Wille wird als Grund des Gebärens dargestellt, ohne ihn durch eine konfessionelle Lehre näher zu definieren.
  alternative: „Aus eigenem Willen brachte er uns hervor“ oder eine ausdrückliche Deutung im Sinne einer bestimmten Wiedergeburts- oder Prädestinationslehre.
  rationale: Der griechische Text stellt Gottes Wollen vor die Haupthandlung und wahrscheinlich als deren Grund dar, entfaltet hier aber kein vollständiges dogmatisches System.
- issue: Umfang von κτισμάτων
  choice: „seinen Geschöpfen“ bleibt weit und schließt den gesamten geschaffenen Bereich als möglichen Bezug ein.
  alternative: „unter den von ihm geschaffenen Menschen“ oder kollektiv „in seiner Schöpfung“.
  rationale: Eine Beschränkung auf Menschen wäre enger als der griechische Plural; „Schöpfung“ würde die konkreten Geschöpfe zu einem Kollektivbegriff umformen.
- issue: Bildsprache von ἀπεκύησεν
  choice: Die Geburtsmetapher wird mit „gebar er uns“ ausdrücklich bewahrt.
  alternative: „brachte er uns hervor“ oder deutend „schenkte er uns neues Leben“.
  rationale: Die auffällige Metapher verbindet den Vers mit Jakobus 1,15. Eine erklärende Wiedergabe als „neues Leben“ würde eine im Kontext naheliegende, aber nicht ausdrücklich genannte Deutung in den Haupttext aufnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche „gebar er uns“ ist bewusst beibehalten, um die Geburtsmetapher und den Bezug zu Vers 15 nicht abzuschwächen. „Gewissermaßen“ gibt die qualifizierende Funktion von τινα natürlicher wieder als „eine Art“.
