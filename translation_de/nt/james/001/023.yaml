source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: de
  text: Denn wenn jemand Hörer des Wortes ist und nicht Täter, gleicht er einem Mann, der sein natürliches Gesicht im Spiegel aufmerksam betrachtet[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Gesicht seiner Geburt“. Gemeint ist sein natürliches, von Geburt an eigenes Gesicht.'
    reason: Die Fußnote macht die ungewöhnliche griechische Genitivverbindung τὸ πρόσωπον τῆς γενέσεως αὐτοῦ sichtbar und erläutert die im Kontext naheliegende idiomatische Wiedergabe.
lexical_decisions:
- source_word: ἀκροατὴς
  choice: Hörer
  rationale: Das substantivische „Hörer“ bewahrt die pointierte Gegenüberstellung zu „Täter“ und gibt den Bezug zum Hören sprachlich direkt wieder.
- source_word: λόγου
  choice: des Wortes
  rationale: „Wort“ ist die direkte Wiedergabe von λόγος und wahrt den Zusammenhang mit dem in Jakobus verkündigten und eingepflanzten Wort.
- source_word: ποιητής
  choice: Täter
  rationale: Die substantivische Wiedergabe entspricht dem griechischen Nomen und erhält den knappen Gegensatz „Hörer – Täter“.
- source_word: ἔοικεν
  choice: gleicht
  rationale: „Gleicht“ gibt die präsentische Bedeutung der Perfektform knapp und idiomatisch wieder.
- source_word: ἀνδρὶ
  choice: einem Mann
  rationale: ἀνήρ ist ausdrücklich maskulin; „Mann“ bildet diese Form genau ab, auch wenn das Beispiel allgemein anwendbar ist.
- source_word: κατανοοῦντι
  choice: aufmerksam betrachtet
  rationale: κατανοέω bezeichnet ein bewusstes, aufmerksames Wahrnehmen und nicht nur einen flüchtigen Blick.
- source_word: τὸ πρόσωπον
  choice: das Gesicht
  rationale: Im Zusammenhang mit einem Spiegel ist „Gesicht“ die naheliegende konkrete Bedeutung von πρόσωπον.
- source_word: τῆς γενέσεως αὐτοῦ
  choice: seiner Geburt
  rationale: Die formnahe Wiedergabe bewahrt die ungewöhnliche Genitivverbindung und ihre Bildsprache; die gemeinte natürliche beziehungsweise angeborene Erscheinung wird in der Fußnote erläutert.
- source_word: ἐν ἐσόπτρῳ
  choice: in einem Spiegel
  rationale: Dies ist die klare und übliche moderne deutsche Bezeichnung für ἔσοπτρον.
theological_decisions:
- issue: Maskuline repräsentative Sprache in ἀνδρὶ
  choice: einem Mann
  alternative: einem Menschen
  rationale: Der griechische Text verwendet das ausdrücklich maskuline ἀνήρ. Die Übersetzung erhält diese Form, ohne die allgemeine Anwendung des Vergleichs einzuschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der traditionelle und prägnante Gegensatz „Hörer – Täter“ bleibt erhalten. Die im Deutschen bewusst ungewöhnliche Wendung „das Gesicht seiner Geburt“ bewahrt die Form und Spannung des griechischen Ausdrucks; eine verständlichere Deutung steht in der Fußnote.
