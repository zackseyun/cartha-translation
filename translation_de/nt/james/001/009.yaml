  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: de
  text: Der Bruder[a] in niedriger Stellung aber soll sich seiner hohen Stellung[b] rühmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Bruder oder die Schwester in niedriger Stellung“. Im Griechischen steht der maskuline Singular „Bruder“, der stellvertretend einen Menschen aus der Glaubensgemeinschaft bezeichnen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seiner Erhöhung“. Die Wendung kann auf die dem Niedriggestellten von Gott verliehene Würde weisen; dabei können sowohl eine gegenwärtige als auch eine künftige Umkehrung der Verhältnisse mitschwingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: soll sich … rühmen
  rationale: Der Imperativ wird als Aufforderung wiedergegeben. „Sich rühmen“ bewahrt die lexikalische Kraft von καυχάομαι; der Gegenstand des Rühmens ist dabei die von Gott verliehene Erhöhung, nicht eigene Leistung.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Kontrast beziehungsweise Übergang und leitet das Gegensatzpaar vom Niedriggestellten und Reichen in den Versen 9–10 ein.
- source_word: ὁ ἀδελφὸς
  choice: der Bruder
  rationale: Die maskuline Singularform bleibt im Haupttext erhalten. Im Kontext bezeichnet ἀδελφός einen Glaubensbruder und kann stellvertretend auch eine Glaubensschwester einschließen.
- source_word: ὁ ταπεινὸς
  choice: der niedriggestellt ist
  rationale: ταπεινός weist hier wahrscheinlich auf eine niedrige soziale oder wirtschaftliche Stellung hin, ohne die mögliche geistliche Nebenbedeutung von Niedrigkeit auszuschließen. Die Formulierung vermeidet eine Verengung auf bloße Armut oder persönliche Demut.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: seiner hohen Stellung
  rationale: ὕψος bezeichnet Höhe beziehungsweise Erhöhung. „Hohe Stellung“ ist im Deutschen natürlich und lässt offen, ob vor allem die gegenwärtige Würde vor Gott, eine Umkehrung der sozialen Verhältnisse oder die künftige Erhöhung gemeint ist.
theological_decisions:
- issue: Bedeutung der hohen Stellung des niedriggestellten Bruders
  choice: Die Formulierung bezeichnet seine von Gott verliehene erhöhte Stellung oder Würde und lässt gegenwärtige wie künftige Umkehrungsmotive offen.
  alternative: Gegenwärtiger sozialer Aufstieg; ausschließlich geistlicher Stand vor Gott; ausschließlich künftige eschatologische Erhöhung.
  rationale: Der Gegensatz zum Reichen in Vers 10 und die Umkehrungssprache sprechen für einen breiten Sinn. Die Übersetzung legt sich daher nicht auf nur eine zeitliche oder soziale Dimension fest.
- issue: Geschlechtliche Wiedergabe von ἀδελφός
  choice: „Bruder“ im Haupttext, mit Hinweis auf möglichen repräsentativen Gebrauch.
  alternative: „Bruder oder Schwester“; „Glaubender“; „Gemeindemitglied“.
  rationale: So bleiben Genus und Numerus des griechischen Ausdrucks sichtbar, ohne seinen möglichen inklusiven Bezug im Gemeindekontext zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Niedriggestellt“ macht den Statusbezug des substantivierten ταπεινός verständlich; „hohe Stellung“ bildet den bewussten Gegensatz ab. Die Fußnotenmarker stehen nach dem vollständigen Satz in ihrer alphabetischen Reihenfolge.
