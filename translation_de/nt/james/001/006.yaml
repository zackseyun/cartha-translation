id: JAS.1.6
reference: James 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: de
  text: Er bitte aber im Glauben[a] und zweifle nicht; denn wer zweifelt, gleicht einer Meereswoge, die vom Wind getrieben und hin und her geworfen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Vertrauen“. Das griechische Wort für „Glauben“ kann hier das vertrauensvolle Sichverlassen auf Gott betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: er bitte
  rationale: Der Imperativ der dritten Person hat auffordernden Charakter. „Er bitte“ bewahrt diesen in würdigem, knappem Deutsch und knüpft an die Bitte um Weisheit im vorherigen Vers an.
- source_word: δὲ
  choice: aber
  rationale: 'Kennzeichnet einen milden Gegensatz beziehungsweise eine Weiterführung: Gott gibt bereitwillig, der Bittende soll aber im Glauben bitten.'
- source_word: ἐν πίστει
  choice: im Glauben
  rationale: Gibt die Präpositionalphrase eng und im Deutschen idiomatisch wieder; zugleich bleibt der in diesem Zusammenhang mitschwingende Sinn vertrauender Hinwendung erhalten.
- source_word: μηδὲν διακρινόμενος
  choice: und zweifle nicht
  rationale: Das Partizip bezeichnet hier inneres Schwanken oder Zweifeln. Die natürliche deutsche Aufforderung gibt μηδέν umfassend wieder, ohne eine unübliche nominale Konstruktion zu erzwingen.
- source_word: ὁ γὰρ διακρινόμενος
  choice: denn wer zweifelt
  rationale: Die substantivierte Partizipialkonstruktion wird generisch und ohne unnötige geschlechtliche Festlegung wiedergegeben.
- source_word: ἔοικεν
  choice: gleicht
  rationale: Eine natürliche, würdige Wiedergabe des Vergleichsausdrucks.
- source_word: κλύδωνι θαλάσσης
  choice: einer Meereswoge
  rationale: κλύδων bezeichnet eine bewegte Woge oder Brandungswelle; „Meereswoge“ erhält das kräftige Bild knapp und verständlich.
- source_word: ἀνεμιζομένῳ
  choice: vom Wind getrieben
  rationale: Gibt das passive, vom Wind verursachte Bewegtwerden ausdrücklich wieder.
- source_word: καὶ ῥιπιζομένῳ
  choice: und hin und her geworfen
  rationale: Vermittelt die heftige, unbeständige Bewegung der Woge und macht die im Bild liegende Haltlosigkeit anschaulich.
theological_decisions:
- issue: Bedeutung von πίστις im Zusammenhang des Gebets
  choice: Glauben
  alternative: Vertrauen
  rationale: „Glauben“ bewahrt die etablierte theologische und lexikalische Entsprechung, während die Fußnote darauf hinweist, dass hier besonders das vertrauensvolle Sichverlassen auf Gott gemeint sein kann.
- issue: Bedeutung von διακρίνομαι
  choice: zweifeln
  alternative: schwanken
  rationale: Im Kontext des Bittens bezeichnet das Wort innere Unentschlossenheit beziehungsweise Zweifel. „Zweifeln“ ist klar und natürlich; „schwanken“ würde die Bildsprache stärker vorwegnehmen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Der Konjunktiv „er bitte“ bewahrt die auffordernde Form des griechischen Imperativs; die zweite Satzhälfte ist bewusst geschlechtsneutral formuliert.
