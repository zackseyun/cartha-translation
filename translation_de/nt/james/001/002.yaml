source:
  edition: SBLGNT
  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: de
  text: Haltet es für lauter Freude, meine Brüder und Schwestern[a], wenn ihr in verschiedenartige Prüfungen geratet[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „meine Brüder“; die Anrede dürfte hier die gesamte glaubende Gemeinschaft einschließen.
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort kann „Prüfungen“, „Erprobungen“ oder je nach Zusammenhang auch „Versuchungen“ bedeuten. Hier sind am ehesten Bedrängnisse gemeint, durch die der Glaube geprüft wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: lauter Freude
  rationale: Die prädikative Akkusativverbindung bezeichnet die Bewertung als uneingeschränkte Freude. „Lauter Freude“ ist im Deutschen natürlich und bewahrt den umfassenden Sinn von πᾶσαν, ohne „vollkommene Freude“ zu unterstellen.
- source_word: ἡγήσασθε
  choice: Haltet es für
  rationale: Der Aorist-Medium-Imperativ Plural fordert zu einer bewussten Einschätzung auf. „Haltet es für“ gibt diese wertende gedankliche Haltung idiomatisch und mit klarer Befehlsform wieder.
- source_word: ἀδελφοί μου
  choice: meine Brüder und Schwestern
  rationale: Der maskuline Plural kann in dieser gemeindlichen Anrede die gesamte Glaubensgemeinschaft einschließen. Die inklusive Bedeutung wird im Haupttext natürlich ausgedrückt; die formnähere Wiedergabe wird in der Fußnote dokumentiert.
- source_word: ὅταν
  choice: wenn
  rationale: Mit dem Konjunktiv bezeichnet ὅταν einen unbestimmten zeitlichen Fall. Deutsches „wenn“ gibt diesen wiederholbaren oder allgemeinen Sinn natürlicher wieder als das stärker distributive „wann immer“.
- source_word: πειρασμοῖς
  choice: Prüfungen
  rationale: Im unmittelbaren Zusammenhang sind Belastungen gemeint, durch die der Glaube erprobt wird. „Prüfungen“ wahrt zugleich die semantische Verbindung zum Prüfen; die mögliche Bedeutung „Versuchungen“ wird in der Fußnote genannt.
- source_word: περιπέσητε
  choice: ihr … geratet
  rationale: Das Verb bedeutet bildhaft „hineinfallen“ oder „unversehens in etwas geraten“. „In … geraten“ klingt im modernen Deutsch natürlich und bewahrt, dass die Lage nicht bewusst gesucht wird.
- source_word: ποικίλοις
  choice: verschiedenartige
  rationale: Das Adjektiv hebt die Vielfalt der Prüfungen hervor. „Verschiedenartige“ ist präzise und enger am griechischen Ausdruck als eine auslegende Erweiterung wie „allerlei“.
theological_decisions:
- issue: Inklusiver Umfang von ἀδελφοί als gemeindliche Anrede
  choice: „meine Brüder und Schwestern“ im Haupttext, mit Hinweis auf die wörtliche maskuline Form in der Fußnote
  alternative: „meine Brüder“ im Haupttext
  rationale: Der griechische maskuline Plural ist formal „Brüder“, dient hier aber wahrscheinlich als Anrede der gesamten glaubenden Gemeinschaft. Die inklusive Wiedergabe vermittelt den gemeinten Adressatenkreis, während die Fußnote die Form des Ausgangstextes transparent hält.
- issue: Bedeutung von πειρασμοῖς
  choice: „Prüfungen“ als äußere oder situative Bewährungsproben
  alternative: „Versuchungen“ als Anreize zum Bösen
  rationale: Vers 3 spricht von der Bewährung des Glaubens, während Jakobus 1,13 die moralische Versuchung eigens behandelt. Deshalb passt „Prüfungen“ hier besser, ohne die breitere Bedeutungsweite des griechischen Wortes zu leugnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz behält die knappe imperativische Form und die Spannung zwischen Freude und Bedrängnis bei. „Lauter Freude“ ist gehoben, aber allgemein verständlich; „in verschiedenartige Prüfungen geraten“ bewahrt die Bildhaftigkeit ohne unnötige Wörtlichkeit.
