  source_fidelity: 'Die Grundbedeutung ist zutreffend: πειράζεται meint hier Verführung zum Bösen; die Versuchung geht von der eigenen ἐπιθυμία aus. Der individuelle Singular und die beiden bildhaften Partizipien werden gewahrt. „Geködert“ ist als Passiv für δελεαζόμενος jedoch im Deutschen weniger idiomatisch und kann nahelegen, die Person selbst werde als Köder benutzt, statt dass sie durch einen Köder angelockt wird.'
  naturalness: Die Satzstellung mit „wenn“ ist verständlich, bildet die griechischen begleitenden Partizipien aber weniger unmittelbar ab. „Indem er ... gelockt wird“ ist klarer und natürliches modernes Standarddeutsch. „Gelockt“ ist zudem als Personenprädikat idiomatischer als „geködert“.
  terminology: „Begierde“ ist eine passende breite Wiedergabe von ἐπιθυμία und nicht auf sexuelles Begehren beschränkt. „Versucht“ trifft im Kontext die Bedeutung von πειράζεται. Die Fußnote sollte die Ködermetaphorik ausdrücklich als Bild des Anlockens erklären, damit „gelockt“ nicht zu schwach verstanden wird.
  issues:
  - severity: low
    issue: „geködert“ als Passiv für eine Person
    rationale: δελεαζόμενος bezeichnet das Anlocken mittels Köder. Im modernen Deutschen ist „jemanden ködern“ zwar möglich, aber weniger idiomatisch und potenziell missverständlich; „gelockt“ ist natürlicher, während die Ködernuance in der Anmerkung erhalten bleiben kann.
  - severity: low
    issue: „wenn“ gibt die Partizipialkonstruktion nur mittelbar wieder
    rationale: Die griechischen Partizipien beschreiben, wie bzw. wodurch die Versuchung geschieht. „Indem“ stellt diesen Zusammenhang im Deutschen direkter dar, ohne die Aussage zu verändern.
  revised_text: Jeder aber wird von seiner eigenen Begierde versucht, indem er fortgezogen und gelockt wird.[a]
