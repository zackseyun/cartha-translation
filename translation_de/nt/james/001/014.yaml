source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: de
  text: Jeder aber wird von seiner eigenen Begierde versucht, indem er fortgezogen und gelockt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden Ausdrücke zeichnen das Bild von Beute oder einem Fisch, der herausgelockt und durch einen Köder in eine Falle gezogen wird. Das mit „Begierde“ übersetzte griechische Wort kann allgemein ein starkes Verlangen bezeichnen, nicht nur sexuelles Begehren.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: jeder
  rationale: Bewahrt den verteilenden Singular und betont die persönliche Verantwortung; im Deutschen ist „jeder“ dafür natürlich und prägnant.
- source_word: δὲ
  choice: aber
  rationale: 'Markiert den milden Gegensatz zu Vers 13: Nicht Gott versucht, sondern die eigene Begierde ist die unmittelbare Quelle der Versuchung.'
- source_word: πειράζεται
  choice: wird versucht
  rationale: Im unmittelbaren Zusammenhang geht es um die Verlockung zur Sünde, nicht lediglich um eine neutrale Prüfung.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: von seiner eigenen Begierde
  rationale: „Von“ gibt die wirksame Quelle der Versuchung wieder; „seiner eigenen“ wahrt den Singular und den Nachdruck auf persönlicher Zugehörigkeit und Verantwortung.
- source_word: ἐπιθυμίας
  choice: Begierde
  rationale: „Begierde“ bezeichnet hier ein starkes, in diesem Zusammenhang sündhaft wirkendes Verlangen, ohne es auf Sexualität zu beschränken.
- source_word: ἐξελκόμενος
  choice: fortgezogen
  rationale: Gibt das Bild wieder, dass jemand aus sicherer Stellung herausgezogen wird, und lässt zugleich die Verbindung mit dem folgenden Köderbild bestehen.
- source_word: δελεαζόμενος
  choice: geködert
  rationale: Bewahrt anschaulich das Jagd- oder Fischfangbild eines Köders, durch den Beute in eine Falle gelockt wird.
theological_decisions:
- issue: Quelle der Versuchung im Verhältnis zu Gott
  choice: Die Versuchung wird der eigenen Begierde des Menschen zugeschrieben, nicht Gott.
  alternative: Den Satz lediglich auf äußere Prüfungsumstände beziehen.
  rationale: Der Zusammenhang mit Vers 13 und die Entwicklung zur Sünde in Vers 15 zeigen, dass hier die Verlockung zum Bösen gemeint ist. Die Formulierung wahrt diesen Gegensatz, ohne über die unmittelbare Aussage hinaus eine umfassende Lehre der Verursachung einzutragen.
- issue: Generischer maskuliner Singular
  choice: „Jeder … von seiner eigenen Begierde“
  alternative: Eine pluralische oder ausdrücklich geschlechtsneutrale Umformung.
  rationale: Die deutsche Form wahrt den individualisierenden Singular des Griechischen und ist zugleich generisch verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Sprache des griechischen Textes wird im Haupttext bewahrt; „Begierde“ ist bewusst breiter als das heute oft sexuell verstandene „Lust“.
