  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: de
  text: Lasst euch nicht täuschen, meine geliebten Brüder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“. Das griechische Wort für „Brüder“ kann die Glaubensgemeinschaft insgesamt ansprechen und dabei auch Frauen einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: nicht
  rationale: In Verbindung mit dem Imperativ bezeichnet μή ein Verbot. Die deutsche Konstruktion „Lasst euch nicht …“ gibt dieses Verbot natürlich wieder, ohne eine nicht eindeutig geforderte Verlaufsnuance hinzuzufügen.
- source_word: πλανᾶσθε
  choice: Lasst euch … täuschen
  rationale: Die Form kann medial oder passiv verstanden werden und warnt hier davor, einer falschen Auffassung zu erliegen. „Lasst euch nicht täuschen“ ist modernes, natürliches Deutsch und bewahrt die Vorstellung des Irregeführtwerdens, ohne einen Urheber zu nennen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der Vokativ Plural ist grammatisch maskulin und bedeutet wörtlich „Brüder“. Da er in der frühchristlichen Anrede die Glaubensgemeinschaft einschließlich der Frauen bezeichnen kann, wird diese inklusive Reichweite in einer Fußnote erläutert.
- source_word: μου
  choice: meine
  rationale: Das Possessivpronomen bringt die persönliche Verbundenheit des Schreibers mit den Angesprochenen zum Ausdruck.
- source_word: ἀγαπητοί
  choice: geliebten
  rationale: „Geliebten“ bewahrt die herzliche, beziehungsreiche Bedeutung von ἀγαπητοί und bildet zusammen mit „meine … Brüder“ eine natürliche deutsche Anrede.
theological_decisions:
- issue: Geschlechtsspezifische Anrede der christlichen Gemeinschaft
  choice: ἀδελφοί wird im Haupttext mit „Brüder“ wiedergegeben; die mögliche inklusive Bezugnahme wird in einer Fußnote erläutert.
  alternative: „Brüder und Schwestern“ oder „Geschwister“ im Haupttext
  rationale: Die Übersetzung bewahrt die grammatisch maskuline Form des griechischen Ausdrucks, ohne seine wahrscheinliche Anwendung auf die gesamte, gemischtgeschlechtliche Glaubensgemeinschaft zu verschweigen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Anrede „meine geliebten Brüder“ bewahrt die Wärme und Eindringlichkeit des griechischen Vokativs.
