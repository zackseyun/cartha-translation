reference: James 1:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: de
  text: Wer aber aufmerksam in das vollkommene Gesetz, das Gesetz der Freiheit,[a] hineinschaut und daran festhält – nicht zu einem vergesslichen Hörer wird,[b] sondern handelt[c] –, der wird in seinem Tun gesegnet sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in das vollkommene Gesetz der Freiheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „nicht ein Hörer des Vergessens geworden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ein Täter eines Werkes“; sinngemäß auch: „einer, der handelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: aufmerksam ... hineingeschaut hat
  rationale: Das Verb bezeichnet bildhaft ein Sich-Vorbeugen und genaues Hineinschauen. „Aufmerksam hineinschauen“ bewahrt die Intensität in natürlichem Deutsch.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: das vollkommene Gesetz, das Gesetz der Freiheit
  rationale: Die wiederholte Apposition des Griechischen bleibt erhalten. „Vollkommen“ gibt τέλειον wieder, ohne es vorschnell als „reif“ oder „fehlerlos“ auszulegen.
- source_word: παραμείνας
  choice: dabei bleibt
  rationale: Gemeint ist beständiges Verweilen beziehungsweise Festhalten an dem zuvor genannten Gesetz. „Dabei bleibt“ ist knapp und idiomatisch.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: nicht als ein Hörer, der vergisst
  rationale: Der ungewöhnliche Genitiv wird als beschreibender Relativsatz natürlich wiedergegeben, ohne den Sinn zu erweitern.
- source_word: ποιητὴς ἔργου
  choice: als einer, der das Werk tut
  rationale: Die Formulierung bewahrt ausdrücklich ἔργον („Werk/Tat“) und den Gegensatz zwischen Hören und Tun. Der bestimmte Artikel dient im Deutschen der natürlichen Formulierung, ohne eine bestimmte einzelne Tat festzulegen.
- source_word: μακάριος
  choice: gesegnet
  rationale: „Gesegnet“ wahrt den religiösen Klang von μακάριος besser als bloßes „glücklich“ oder „vom Glück begünstigt“.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: in seinem Tun
  rationale: Die nominale Wendung spiegelt ποίησις und nimmt das zuvor genannte Tun sprachlich wieder auf.
- source_word: ὁ ... οὗτος
  choice: Wer aber ... der
  rationale: Die deutsche Korrelativkonstruktion gibt die repräsentative Einzahl natürlich und geschlechterübergreifend wieder.
theological_decisions:
- issue: Bedeutung von „Gesetz der Freiheit“
  choice: Die Formulierung „das Gesetz der Freiheit“ bleibt ohne nähere Ausdeutung stehen.
  alternative: „das Gesetz, das Freiheit schenkt“ oder ausdrückliche Gleichsetzung mit Evangelium beziehungsweise Sittengesetz
  rationale: Der Genitiv lässt die genaue Beziehung zwischen Gesetz und Freiheit offen. Eine ausdeutende Übersetzung würde eine theologische Lesart festlegen, die der griechische Wortlaut nicht erzwingt.
- issue: Generisches Maskulinum der griechischen Einzahl
  choice: Die Konstruktion „Wer ... der“ bewahrt die repräsentative Einzahl, ohne die Aussage auf Männer zu beschränken.
  alternative: „der Mann, der ...“ oder pluralische Wiedergabe
  rationale: Der Kontext zeigt eine allgemeine, nicht männlich exklusive Aussage; zugleich sollte die Einzahl des griechischen Textes erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gegensatz von Hören und Tun, vermeidet aber unnatürliche Wörtlichkeit. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
