id: JAS.1.12
reference: James 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: de
  text: Glücklich zu preisen ist der Mann, der eine Prüfung[a] standhaft erträgt; denn nachdem er sich bewährt hat, wird er den Kranz des Lebens[b] empfangen, den Gott denen versprochen hat, die ihn lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Versuchung“ oder „Erprobung“. Das griechische Wort kann sowohl eine belastende Prüfung als auch eine Versuchung bezeichnen; hier liegt der Nachdruck auf standhaftem Ausharren in der Erprobung.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Ausdruck kann den Kranz bezeichnen, den ein Sieger erhielt, nicht unbedingt eine Königskrone.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Glückselig
  rationale: Bewahrt den feierlichen, an eine Seligpreisung erinnernden Sinn; „glücklich“ könnte zu stark als subjektives Gefühl verstanden werden.
- source_word: ἀνὴρ
  choice: der Mann
  rationale: Gibt die grammatisch maskuline Einzahl des griechischen Textes wieder; die Aussage hat zugleich beispielhaften, allgemeinen Charakter.
- source_word: ὑπομένει
  choice: standhaft erträgt
  rationale: Bringt sowohl das Ausharren als auch das Tragen unter Druck in natürlichem Deutsch zum Ausdruck.
- source_word: πειρασμόν
  choice: eine Prüfung
  rationale: Der Zusammenhang betont Bewährung durch standhaftes Ausharren. Das Wort kann jedoch auch „Versuchung“ bedeuten; diese Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: δόκιμος γενόμενος
  choice: nachdem er sich bewährt hat
  rationale: Gibt die zeitliche Beziehung und das Ergebnis der Erprobung idiomatisch wieder, ohne eine ausdrückliche menschliche oder göttliche Prüfinstanz einzutragen.
- source_word: λήμψεται
  choice: wird er ... empfangen
  rationale: Entspricht dem Futur und dem Charakter einer verheißenen Gabe.
- source_word: στέφανον
  choice: Siegeskranz
  rationale: στέφανος bezeichnet häufig den Kranz eines Siegers und nicht primär eine Königskrone; „Siegeskranz“ macht das kulturelle Bild im Deutschen verständlich.
- source_word: τῆς ζωῆς
  choice: des Lebens
  rationale: Bewahrt die knappe Genitivverbindung und legt nicht fest, ob Leben Inhalt, Kennzeichen oder Belohnung des Kranzes ist.
- source_word: ἐπηγγείλατο
  choice: versprochen hat
  rationale: Natürliches modernes Deutsch für den Aorist; das Perfekt bezeichnet hier keine abweichende Aspektdeutung, sondern eine weiterhin geltende Zusage.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: denen ..., die ihn lieben
  rationale: Gibt den Dativ und die charakteristische, fortdauernde Liebe klar wieder.
theological_decisions:
- issue: Bedeutung von πειρασμός in Jakobus 1,12
  choice: Prüfung
  alternative: Versuchung; Erprobung
  rationale: Ausharren und Bewährung weisen hier besonders auf eine belastende Prüfung. Da dasselbe Wort auch Versuchung bezeichnen kann und der folgende Kontext diese Bedeutung aufgreift, wird die Spannweite in einer Fußnote offengehalten.
- issue: Unausgesprochenes Subjekt von ἐπηγγείλατο
  choice: Gott im Haupttext ausdrücklich genannt
  alternative: „den er ... versprochen hat“ mit grammatisch missverständlichem Rückbezug
  rationale: Im Griechischen ist das Subjekt der Verheißung unausgesprochen und aus dem theologischen Zusammenhang als Gott zu erschließen. Im Deutschen würde ein bloßes „er“ unmittelbar auf „der Mann“ zurückweisen; die Nennung Gottes verhindert dieses unbeabsichtigte Missverständnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glückselig“ wahrt den Ton einer Seligpreisung, während „standhaft erträgt“ und „sich bewährt hat“ unmittelbar verständlich bleiben. Die Satzstruktur folgt dem Gedankengang des griechischen Textes, ohne unnatürliche Wortstellung nachzuahmen.
