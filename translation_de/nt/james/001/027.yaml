  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: de
  text: 'Reine und unbefleckte Frömmigkeit vor Gott, dem Vater, besteht darin: sich um Waisen und Witwen in ihrer Not zu kümmern[a] und sich von der Welt[b] unbefleckt zu bewahren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Waisen und Witwen in ihrer Not besuchen“. Das griechische Verb kann sowohl das Aufsuchen als auch die tätige Fürsorge einschließen.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Welt“ ist hier die moralisch verdorbene, Gott entgegenstehende Ordnung gemeint, nicht die Schöpfung als solche.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: Frömmigkeit
  rationale: Das Wort bezeichnet hier die nach außen gelebte religiöse Praxis. „Frömmigkeit“ ist im Deutschen natürlicher und weniger institutionell missverständlich als „Religion“.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: rein und unbefleckt
  rationale: Die Wiedergabe bewahrt das Begriffspaar und seine kultisch-moralische Bildsprache.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: vor Gott, dem Vater
  rationale: παρά mit Dativ bezeichnet hier die Beurteilung aus Gottes Sicht; „dem Vater“ gibt πατρί appositionell wieder, ohne ein im Griechischen nicht vorhandenes Possessivpronomen einzufügen.
- source_word: ἐπισκέπτεσθαι
  choice: sich kümmern um
  rationale: Das Verb meint in diesem Zusammenhang nicht nur einen Besuch, sondern fürsorgliche Zuwendung und praktische Hilfe; die wörtlichere Nuance wird in einer Fußnote bewahrt.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: Waisen und Witwen
  rationale: Direkte, geläufige Entsprechungen für die genannten besonders schutzbedürftigen Gruppen.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: in ihrer Not
  rationale: „Not“ gibt Bedrängnis und leidvolle Lebenslage in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: sich unbefleckt zu bewahren
  rationale: Die Formulierung erhält das Bild moralischer Verunreinigung und gibt den generischen Bezug von ἑαυτόν angemessen wieder.
- source_word: ἀπὸ τοῦ κόσμου
  choice: von der Welt
  rationale: Die knappe Formulierung des Ausgangstextes bleibt erhalten; eine auslegende Erweiterung wie „von der Verdorbenheit der Welt“ wird vermieden.
theological_decisions:
- issue: Bedeutung von κόσμος im ethischen Zusammenhang
  choice: „die Welt“ im Haupttext beibehalten und in der Fußnote als gottwidrige, moralisch verdorbene Ordnung erläutern
  alternative: „die Verdorbenheit der Welt“ oder „die gegenwärtige Weltordnung“
  rationale: So bleibt die theologische Spannung der Formulierung erhalten, ohne κόσμος mit der Schöpfung als solcher gleichzusetzen oder den Haupttext interpretierend auszuweiten.
- issue: Verhältnis von θεῷ und πατρί
  choice: „Gott, dem Vater“
  alternative: „Gott und Vater“ oder „unserem Gott und Vater“
  rationale: Der eine Artikel und der syntaktische Zusammenhang sprechen für eine appositionelle Wiedergabe; „unserem“ wäre ein Zusatz ohne ausdrückliche Grundlage im griechischen Text.
- issue: Generischer Bezug von ἑαυτόν
  choice: „sich“
  alternative: „sich selbst“ oder eine männlich markierte Form
  rationale: Der maskuline Singular steht in einer allgemeinen ethischen Aussage und beschränkt den Adressatenkreis nicht auf Männer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frömmigkeit“ bezeichnet hier sichtbar gelebte Gottesverehrung; die Satzstruktur bleibt prägnant und folgt der Definition mit zwei parallelen Infinitivgruppen.
