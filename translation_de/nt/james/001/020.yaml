  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: de
  text: Denn der Zorn eines Menschen bewirkt nicht die Gerechtigkeit Gottes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ
  choice: Zorn
  rationale: Bezeichnet hier heftigen menschlichen Unwillen oder Ärger; „Zorn“ gibt die warnende Aussage knapp und würdig wieder.
- source_word: ἀνδρὸς
  choice: eines Menschen
  rationale: Der Genitiv bezeichnet hier allgemein den Menschen, nicht ausschließlich einen Mann; die inklusive generische Wiedergabe entspricht dem Zusammenhang.
- source_word: δικαιοσύνην θεοῦ
  choice: die Gerechtigkeit Gottes
  rationale: 'Bewahrt die Genitivverbindung und ihre echte Deutungsoffenheit: Gemeint sein kann Gottes eigene Gerechtigkeit, die von Gott geforderte Gerechtigkeit oder das vor Gott rechte Handeln.'
- source_word: οὐκ ἐργάζεται
  choice: bewirkt nicht
  rationale: ἐργάζομαι bezeichnet das Hervorbringen oder Zustandebringen eines Ergebnisses; „bewirkt nicht“ ist natürlich und erhält den Ergebnisbezug.
theological_decisions:
- issue: Bedeutung von δικαιοσύνην θεοῦ
  choice: die Gerechtigkeit Gottes
  alternative: das, was vor Gott gerecht ist
  rationale: Die wörtlichere Genitivform wahrt die theologische Spannung des griechischen Ausdrucks, ohne ihn auf menschliches Wohlverhalten oder auf Gottes zugerechnete Gerechtigkeit festzulegen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit knapper, sprichwortartig-mahnender Satzform. „Denn“ stellt den begründenden Anschluss an Vers 19 her.
