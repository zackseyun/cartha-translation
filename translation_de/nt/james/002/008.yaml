id: JAS.2.8
reference: James 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: de
  text: 'Wenn ihr jedoch das königliche Gesetz gemäß der Schrift erfüllt: »Du sollst deinen Nächsten lieben wie dich selbst«, dann handelt ihr richtig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Königliches Gesetz“ kann ein vom König gegebenes Gesetz, ein zur Königsherrschaft gehörendes Gesetz oder ein Gesetz von höchstem Rang bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Wenn ihr jedoch
  rationale: Die Wendung bewahrt sowohl die Bedingung durch εἰ als auch die leicht gegensätzliche beziehungsweise einschränkende Nuance von μέντοι.
- source_word: νόμον ... βασιλικὸν
  choice: das königliche Gesetz
  rationale: Die formnahe und im Deutschen natürliche Wiedergabe lässt offen, ob die königliche Herkunft, der Bezug zur Königsherrschaft oder der herausragende Rang des Gesetzes betont wird.
- source_word: τελεῖτε
  choice: erfüllt
  rationale: τελέω bezeichnet hier das Ausführen beziehungsweise Erfüllen einer Forderung; „erfüllt“ gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: κατὰ τὴν γραφήν
  choice: gemäß der Schrift
  rationale: Die Formulierung drückt Übereinstimmung mit der angeführten Schriftstelle aus und bewahrt den Singular mit Artikel.
- source_word: Ἀγαπήσεις
  choice: Du sollst lieben
  rationale: Die griechische Futurform hat im Zitat Gebotskraft; „du sollst“ wahrt den vertrauten, würdigen Schriftton.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: „Der Nächste“ ist die etablierte und sachlich passende ethische Bedeutung von πλησίον.
- source_word: ὡς σεαυτόν
  choice: wie dich selbst
  rationale: Die knappe Vergleichsform des Griechischen wird ohne erklärende Ergänzung erhalten.
- source_word: καλῶς ποιεῖτε
  choice: dann handelt ihr richtig
  rationale: Die Wiedergabe drückt die positive Bewertung des Handelns natürlich aus; „dann“ verdeutlicht im Deutschen die Folge innerhalb des Bedingungssatzes, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Bedeutung von „königliches Gesetz“
  choice: Die mehrdeutige Bezeichnung bleibt im Haupttext als „königliches Gesetz“ stehen.
  alternative: „Gesetz des Königs“, „höchstes Gesetz“ oder „Gesetz des Reiches“
  rationale: βασιλικός kann Herkunft, Zugehörigkeit zur Königsherrschaft oder besonderen Rang nahelegen. Die Übersetzung entscheidet nicht zwischen diesen theologischen Möglichkeiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftton. Das Zitat ist durch deutsche Anführungszeichen gekennzeichnet; die syntaktische Spannung des Bedingungssatzes wird natürlich mit „dann“ wiedergegeben.
