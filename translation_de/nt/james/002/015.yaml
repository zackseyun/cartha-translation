  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: de
  text: Wenn ein Bruder oder eine Schwester unzureichend gekleidet ist[a] und nicht genug Nahrung für den Tag hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nackt ist«. Das griechische Wort kann völlige Nacktheit bezeichnen, meint hier aber wahrscheinlich, dass jemand nicht ausreichend gekleidet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Wenn
  rationale: Leitet einen hypothetischen Bedingungssatz ein und entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: ein Bruder oder eine Schwester
  rationale: Gibt das ausdrückliche männlich-weibliche Begriffspaar direkt wieder und bewahrt die familiäre Sprache des griechischen Textes.
- source_word: γυμνοὶ
  choice: unzureichend gekleidet
  rationale: Das Wort kann wörtlich »nackt« bedeuten, bezeichnet im Zusammenhang mit fehlender Nahrung aber wahrscheinlich einen Mangel an angemessener Kleidung.
- source_word: ὑπάρχωσιν
  choice: ist
  rationale: Das Verb fungiert hier kopulativ; wegen der mit »oder« verbundenen Einzelsubjekte ist der deutsche Singular natürlich.
- source_word: λειπόμενοι
  choice: nicht genug … hat
  rationale: Drückt den andauernden Mangel idiomatisch aus, ohne über den Wortlaut hinaus eine völlige Abwesenheit von Nahrung zu behaupten.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: Nahrung für den Tag
  rationale: Gibt sowohl τροφή als Nahrung als auch ἐφήμερος im Sinn des für den jeweiligen Tag Benötigten präzise und natürlich wieder.
theological_decisions:
- issue: Bezugsbereich von ἀδελφὸς ἢ ἀδελφή
  choice: Bruder oder Schwester
  alternative: ein bedürftiger Mitmensch allgemein
  rationale: Die familiäre Bezeichnung wird unverändert bewahrt und bezeichnet im Kontext wahrscheinlich Angehörige der Glaubensgemeinschaft, ohne den möglichen ethischen Bezug darüber hinaus ausdrücklich auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist als Nebensatz offen gehalten, da der Gedanke im folgenden Vers weitergeführt wird.
