  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: de
  text: 'Wenn aber jemand von euch zu ihnen sagt: »Geht in Frieden, haltet euch warm und werdet satt!«[a], und ihr ihnen doch nicht gebt, was der Körper braucht – was nützt das?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Lasst euch wärmen und sättigen«; bei medialem Verständnis: »Wärmt euch und esst euch satt.« Die griechischen Formen können passiv oder medial verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ἐξ ὑμῶν
  choice: Wenn aber jemand von euch … sagt
  rationale: Die Formulierung gibt das hypothetische Beispiel und den partitiven Sinn von ἐξ ὑμῶν natürlich wieder. δέ wird mit »aber« aufgenommen, ohne den Gegensatz übermäßig zu verstärken.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Geht in Frieden
  rationale: Die geläufige Abschieds- und Segensformel entspricht dem Griechischen und bewahrt im Zusammenhang ihre ironische Wirkung.
- source_word: θερμαίνεσθε
  choice: haltet euch warm
  rationale: Die idiomatische deutsche Formulierung passt zur konkreten Notlage, ohne ausdrücklich festzulegen, durch wen die Betroffenen gewärmt werden. Die mögliche passivische Wiedergabe wird in der Fußnote genannt.
- source_word: χορτάζεσθε
  choice: werdet satt
  rationale: Das Verb bezeichnet das Sattwerden beziehungsweise Gesättigtwerden, besonders durch Nahrung. »Werdet satt« ist verständlich und bewahrt den Zustandsbezug, ohne die Versorgung ausdrücklich einer bestimmten handelnden Person zuzuschreiben.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: ihr ihnen aber nicht gebt
  rationale: Der Wechsel vom einzelnen Sprecher zum angesprochenen »ihr« wird entsprechend der griechischen Verbform bewahrt. »aber« hebt den Gegensatz zwischen frommem Wunsch und unterlassener Hilfe hervor.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: was der Körper braucht
  rationale: Diese natürliche Formulierung gibt die für den Körper notwendigen Dinge klar wieder und erhält den ausdrücklichen Bezug auf die leibliche Not.
- source_word: τί ὄφελος;
  choice: was nützt das?
  rationale: Die knappe rhetorische Frage gibt den praktischen Sinn von ὄφελος in modernem, idiomatischem Deutsch wieder.
theological_decisions:
- issue: Diathese von θερμαίνεσθε und χορτάζεσθε
  choice: »haltet euch warm und werdet satt« als natürliche Aufforderungen, ohne die handelnde Person näher zu bestimmen
  alternative: »Lasst euch wärmen und sättigen« beziehungsweise »Wärmt euch und esst euch satt«
  rationale: Die griechischen Formen können passiv oder medial verstanden werden. Der Haupttext soll Jakobus’ Gegensatz zwischen bloßen Worten und materieller Hilfe deutlich machen, ohne die Spannung zwischen Selbsttätigkeit und passivem Empfangen unnötig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und formelhaft; der abschließende Gedankenstrich unterstützt die rhetorische Zuspitzung. Der Wechsel vom Singular »jemand« zum pluralischen »ihr« folgt bewusst dem griechischen Text.
