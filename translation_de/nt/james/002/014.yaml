id: JAS.2.14
reference: James 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: de
  text: Was nützt es, meine Brüder[a], wenn jemand sagt, er habe Glauben[b], aber keine Werke? Kann dieser Glaube ihn retten?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Brüder und Schwestern“. Das Griechische verwendet die maskuline Pluralform „Brüder“ als Anrede, die hier die gesamte Glaubensgemeinschaft einschließen kann.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische πίστις kann auch „Vertrauen“ und in manchen Zusammenhängen „Treue“ bedeuten. Hier passt „Glaube“ am besten zu dem, was jemand nach eigener Aussage besitzt.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Kann der Glaube ihn retten?“ Der griechische Artikel verweist auf den eben genannten Glauben zurück – einen Glauben, den jemand für sich beansprucht, obwohl er keine Werke hat. Möglich ist daher auch: „Kann ein solcher Glaube ihn retten?“'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: Was nützt es
  rationale: Gibt die rhetorische Frage idiomatisch und knapp wieder und bewahrt den Gedanken eines praktischen Nutzens oder Vorteils.
- source_word: ἀδελφοί μου
  choice: meine Brüder
  rationale: Entspricht der maskulinen Pluralform der griechischen Anrede; dass damit die gesamte Glaubensgemeinschaft angesprochen sein kann, wird in einer Fußnote erläutert.
- source_word: πίστιν
  choice: Glauben
  rationale: „Glaube“ ist hier die natürliche Wiedergabe für den behaupteten Besitz von πίστις; „Vertrauen“ und in anderen Zusammenhängen „Treue“ bleiben lexikalisch möglich.
- source_word: λέγῃ τις ἔχειν
  choice: wenn jemand sagt, er habe
  rationale: Bewahrt das schlichte „sagt“ des griechischen Textes, ohne es durch das stärker wertende „behauptet“ vorwegnehmend zu deuten.
- source_word: ἔργα
  choice: Werke
  rationale: Bewahrt den für die Argumentation in Jakobus 2 wichtigen Ausdruck und die begriffliche Verbindung zwischen Glaube und Werken.
- source_word: μὴ δύναται
  choice: Kann …?
  rationale: Gibt die rhetorische Frage natürlich wieder. Das griechische μή lässt eine verneinende Antwort erwarten, ohne dass diese ausdrücklich in die Übersetzung eingesetzt werden muss.
- source_word: ἡ πίστις
  choice: dieser Glaube
  rationale: 'Gibt die rückverweisende Kraft des Artikels wieder: Gemeint ist der unmittelbar zuvor beschriebene, zwar bekannte, aber werklose Glaube. Eine wörtlichere Alternative wird in der Fußnote genannt.'
- source_word: σῶσαι αὐτόν
  choice: ihn retten
  rationale: „Retten“ ist die übliche und theologisch gewichtige Wiedergabe von σῴζω; das maskuline Singularpronomen entspricht αὐτόν.
theological_decisions:
- issue: Verhältnis von Glaube und Werken
  choice: Die Frage wird auf den soeben beschriebenen Glauben bezogen, der zwar mit Worten bekannt wird, aber keine Werke hat.
  alternative: „Kann der Glaube ihn retten?“ könnte allgemeiner verstanden werden; „Kann ein solcher Glaube ihn retten?“ würde die Art des Glaubens noch ausdrücklicher festlegen.
  rationale: „Dieser Glaube“ wahrt den Rückbezug von ἡ πίστις, ohne die weitere Argumentation des Jakobus dogmatisch vorwegzunehmen oder die Spannung zwischen Glaube und Werken aufzulösen.
- issue: Geschlecht der Anrede und des Pronomens
  choice: Die maskulinen Formen „Brüder“ und „ihn“ bleiben im Haupttext erhalten.
  alternative: „Brüder und Schwestern“ beziehungsweise eine geschlechtsneutrale Umformulierung.
  rationale: Dies folgt der Form des griechischen Textes. Bei der Anrede wird in einer Fußnote klargestellt, dass die maskuline Pluralform die ganze Glaubensgemeinschaft einschließen kann.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Was nützt es“ ist idiomatisch; „Werke“ und „retten“ bewahren die zentralen theologischen Begriffe. Der Konjunktiv „er habe“ kennzeichnet die Aussage der betreffenden Person, ohne sie stärker als der Ausgangstext zu bewerten.
