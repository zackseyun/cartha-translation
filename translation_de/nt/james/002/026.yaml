review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die Syntax und die ausgeprägte Vergleichsstruktur des Griechischen präzise wieder: γάρ („Denn“), ὥσπερ … οὕτως καί („wie … so ist auch“), die beiden χωρὶς-Phrasen („ohne“) sowie die Wiederholung von νεκρός („tot“) bleiben erhalten. „Körper“, „Geist“, „Glaube“ und „Werke“ sind semantisch tragfähige, nicht überinterpretierende Entsprechungen.'
  naturalness: „Denn wie der Körper ohne Geist tot ist, so ist auch der Glaube ohne Werke tot“ ist idiomatisches, würdiges modernes Standarddeutsch. Die knappe Parallelstruktur ist klar und entspricht dem rhetorischen Nachdruck des Ausgangstextes.
  terminology: Die Terminologie ist konsistent und sachgerecht. „Geist“ wahrt bei πνεῦμα die mögliche anthropologische Bedeutung; die Fußnote hält „Atem“ offen. „Glaube“ ist für πίστις die angemessene Haupttextwiedergabe; die Fußnote bewahrt mögliche Nuancen, ohne eine theologische Deutung festzulegen. Die deutschen Fußnotenanker stehen jeweils beim einschlägigen Wort. Im englischen Audittext scheinen die Marker in der Satzzeile vertauscht positioniert zu sein, dies betrifft jedoch nicht den deutschen Entwurf.
