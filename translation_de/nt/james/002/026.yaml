source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: de
  text: Denn wie der Körper ohne Geist[a] tot ist, so ist auch der Glaube[b] ohne Werke tot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Atem“. Das griechische Wort kann „Geist“ oder „Atem“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Treue“ beziehungsweise „Vertrauen“. Das griechische Wort hat diese Bedeutungsbreite; im Haupttext steht die übliche Wiedergabe „Glaube“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: „Denn“ bewahrt den begründenden Anschluss an das Vorhergehende; „wie“ eröffnet natürlich und klar den Vergleich.
- source_word: τὸ σῶμα
  choice: der Körper
  rationale: Direkte und im heutigen Standarddeutsch natürliche Bezeichnung für den physischen Körper.
- source_word: χωρὶς πνεύματος
  choice: ohne Geist
  rationale: χωρίς bedeutet „ohne/getrennt von“. „Geist“ wahrt die übliche Bedeutungsbreite von πνεῦμα und den Gedanken des belebenden Prinzips; „Atem“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: νεκρόν ἐστιν
  choice: tot ist
  rationale: Gibt das prädikative Adjektiv direkt wieder und erhält die starke, zweimal verwendete Aussage des griechischen Textes.
- source_word: οὕτως καὶ
  choice: so ist auch
  rationale: Kennzeichnet die entsprechende zweite Hälfte des Vergleichs und bewahrt das hervorhebende καί.
- source_word: ἡ πίστις
  choice: der Glaube
  rationale: „Glaube“ ist hier die sachlich und traditionsgeschichtlich naheliegende Wiedergabe; mögliche Bedeutungsnuancen wie „Treue“ oder „Vertrauen“ werden nicht stillschweigend ausgeschlossen, sondern in einer Fußnote genannt.
- source_word: χωρὶς ἔργων
  choice: ohne Werke
  rationale: Direkte Wiedergabe, die den sprachlichen und argumentativen Zusammenhang mit dem übrigen Abschnitt sowie dem weiteren biblischen Sprachgebrauch wahrt.
- source_word: νεκρά ἐστιν
  choice: tot ist
  rationale: Die identische Wiedergabe des wiederholten Adjektivs erhält die prägnante Parallelität des Satzes.
theological_decisions:
- issue: Bedeutung von πνεύματος im Vergleich
  choice: Geist
  alternative: Atem
  rationale: „Geist“ bewahrt die anthropologische und theologische Bedeutungsbreite des griechischen Wortes, ohne es auf den Vorgang des Atmens zu verengen. Da „Atem“ im Bild eines leblosen Körpers ebenfalls möglich ist, wird diese Lesart in einer Fußnote offengehalten.
- issue: Bedeutung von πίστις in Jakobus 2,26
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: Im unmittelbaren Zusammenhang bezeichnet πίστις am naheliegendsten den beanspruchten Glauben, dessen Verhältnis zu Werken erörtert wird. Die weitere lexikalische Spannweite wird durch die Fußnote sichtbar gemacht, ohne die theologische Spannung des Textes aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, nahezu sprichwörtlicher Satzstruktur. Die Parallelität des griechischen Vergleichs und die Wiederholung von „tot“ bleiben erhalten.
