  source_fidelity: Die Hauptfassung fasst τῆς δόξης als Genitiv zu „Messias“ auf („Messias der Herrlichkeit“). Diese Zuordnung ist zwar nicht völlig unmöglich, gibt aber die wahrscheinlichere und im Deutschen klarer ausdrückbare appositionelle Beziehung zu κύριος nicht angemessen wieder. Die Genitivbeziehung bei πίστις wird mit „Glauben an“ sinnvoll wiedergegeben, sollte aber als mögliche Auslegung kenntlich bleiben.
  naturalness: „Messias der Herrlichkeit“ wirkt im modernen Standarddeutsch ungewohnt und legt zudem eine weniger naheliegende syntaktische Verbindung nahe. „Herr der Herrlichkeit“ ist sowohl idiomatischer als auch dem feierlichen Register des Verses angemessen. „Parteilichkeit“ ist hier präziser und knapper als „parteiliche Bevorzugung“.
  terminology: „Brüder“ mit inklusiver Fußnote ist angemessen. „Herr“, „Messias“, „Glaube“ und „Herrlichkeit“ sind konsistent und sachgerecht. Die appositionelle Wiedergabe „Jesus, den Messias, den Herrn der Herrlichkeit“ bewahrt die Titelabfolge, ohne „Herrlichkeit“ zu einem bloß beschreibenden Adjektiv abzuschwächen.
  issues:
