    issue: „Messias der Herrlichkeit“ bindet τῆς δόξης zu eng an „Messias“.
    rationale: Im griechischen Titelgefüge wird τῆς δόξης am besten als nähere appositionelle Bestimmung von κύριος verstanden („Herr der Herrlichkeit“). Die vorliegende Fassung ist dadurch sowohl syntaktisch weniger wahrscheinlich als auch im Deutschen unnötig missverständlich.
  - severity: low
    issue: Die im Haupttext gewählte Deutung „Glauben an“ wird nicht als Auslegung der mehrdeutigen Genitivverbindung dokumentiert.
    rationale: Sie ist eine gut vertretbare und natürliche deutsche Wiedergabe, aber die alternative, stärker possessive bzw. definierende Genitivbeziehung sollte in einer Fußnote erhalten bleiben.
