  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: de
  text: Meine Brüder[a], verbindet den Glauben[b] an unseren Herrn Jesus, den Messias, den Herrn der Herrlichkeit[c], nicht mit Parteilichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Brüder und Schwestern«; das griechische Wort lautet »Brüder«, kann hier aber die gesamte Glaubensgemeinschaft ansprechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Glauben unseres Herrn Jesus, des Messias«; die griechische Genitivverbindung kann auch anders verstanden werden.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »unseren herrlichen Herrn Jesus, den Messias«. Die griechische Formulierung kann auch als »unseren Herrn Jesus, den Messias der Herrlichkeit« aufgefasst werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Meine Brüder
  rationale: Die grammatisch maskuline Anrede wird im Haupttext genau wiedergegeben; im Zusammenhang ist die ganze Glaubensgemeinschaft angesprochen, was die Fußnote erläutert.
- source_word: μὴ ... ἔχετε
  choice: verbindet ... nicht mit
  rationale: Der verneinte Präsensimperativ drückt ein Verbot aus. Zusammen mit ἐν προσωπολημψίαις ergibt diese Formulierung im Deutschen eine natürliche und ethisch klare Aufforderung.
- source_word: ἐν προσωπολημψίαις
  choice: mit parteilicher Bevorzugung
  rationale: Der Ausdruck bezeichnet die ungerechte Begünstigung von Menschen aufgrund ihres Ansehens. Die deutsche Formulierung gibt den Plural idiomatisch als Verhaltensweise wieder.
- source_word: τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: den Glauben an unseren Herrn Jesus, den Messias
  rationale: Im Deutschen ist „Glaube an“ die natürliche Wiedergabe des objektiven Genitivs. Χριστός wird in der feierlichen Titelfolge als „der Messias“ wiedergegeben.
- source_word: τῆς δόξης
  choice: der Herrlichkeit
  rationale: Der Genitiv bleibt eng am griechischen Wortlaut und bewahrt die feierliche, christologische Aussage, ohne ihn lediglich zum Adjektiv „herrlich“ abzuschwächen.
theological_decisions:
- issue: Genitivbeziehung in τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Glauben an unseren Herrn Jesus, den Messias
  alternative: Glauben unseres Herrn Jesus, des Messias
  rationale: Der objektive Sinn „Glaube an“ ist im Kontext einer Ermahnung an Glaubende am wahrscheinlichsten und im Deutschen verständlich. Der griechische Genitiv ist formal weiter gefasst; diese mögliche Mehrdeutigkeit wird nicht zu einer eigenständigen Lehraussage ausgebaut.
- issue: Bezug von τῆς δόξης
  choice: Jesus, den Messias der Herrlichkeit
  alternative: unseren herrlichen Herrn Jesus, den Messias; unseren Herrn Jesus, den Messias, den Herrn der Herrlichkeit
  rationale: Der knappe Genitiv ist syntaktisch mehrdeutig. Die Hauptfassung bewahrt seine Form und Nähe zum gesamten vorausgehenden Titel; die Fußnote nennt die wichtigsten idiomatischen Deutungen.
- issue: Bedeutungsumfang von Ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die maskuline Form des Ausgangstextes bleibt im Haupttext erhalten, während die Fußnote deutlich macht, dass die Anrede im Kontext die gesamte Gemeinde einschließen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber biblisch geprägte Wendung „Messias der Herrlichkeit“ erhält die Dichte und Mehrdeutigkeit des griechischen Genitivs; Fußnoten sichern inklusive und syntaktische Alternativen.
