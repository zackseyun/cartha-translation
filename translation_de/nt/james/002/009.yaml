  text: εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: de
  text: Wenn ihr aber Menschen nach ihrem Ansehen bevorzugt[a], begeht ihr Sünde und werdet vom Gesetz als Übertreter überführt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Parteilichkeit übt“ beziehungsweise „Menschen begünstigt“. Das griechische Verb meint, Menschen aufgrund ihres äußeren Ansehens oder ihrer gesellschaftlichen Stellung unterschiedlich zu behandeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vom Gesetz als Gesetzesübertreter bloßgestellt“ beziehungsweise „zurechtgewiesen“. Das griechische Wort umfasst das Aufdecken des Unrechts und den Nachweis der Schuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn ihr aber
  rationale: εἰ leitet die Bedingung ein, δέ stellt einen leichten Gegensatz beziehungsweise die Fortführung des Gedankens her. Die deutsche Wortstellung ist natürlich und bewahrt beides.
- source_word: προσωπολημπτεῖτε
  choice: Menschen nach ihrem Ansehen bevorzugt
  rationale: Das Verb bezeichnet eine parteiische Behandlung aufgrund äußerer Stellung oder Erscheinung. Die Formulierung macht den zugrunde liegenden sozialen Maßstab deutlich, ohne den griechischen Idiomatik künstlich nachzubilden.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: begeht ihr Sünde
  rationale: In Verbindung mit ἁμαρτίαν bedeutet ἐργάζεσθε idiomatisch, Sünde zu tun oder zu begehen. Die Wendung ist im Deutschen klar und bewahrt den direkten Vorwurf.
- source_word: ἐλεγχόμενοι
  choice: werdet ... überführt
  rationale: Das passive Partizip bezeichnet, dass das Gesetz das Fehlverhalten aufdeckt und die Betroffenen als schuldig erweist. Ein koordinierter deutscher Hauptsatz gibt den Sinn flüssig wieder.
- source_word: ὑπὸ τοῦ νόμου
  choice: vom Gesetz
  rationale: Die Formulierung bewahrt das Gesetz als handelnde Instanz, ohne den Bezug enger als im Griechischen auf das mosaische Gesetz oder eine bestimmte theologische Kategorie festzulegen.
- source_word: ὡς παραβάται
  choice: als Übertreter
  rationale: παραβάται bezeichnet Menschen, die eine gesetzte Grenze überschreiten beziehungsweise ein Gebot verletzen. „Übertreter“ wahrt den rechtlichen und biblischen Ton.
theological_decisions:
- issue: Reichweite von νόμος im ethischen Argument des Jakobus
  choice: „Gesetz“ ohne erläuternden Zusatz
  alternative: „das mosaische Gesetz“ oder „Gottes Gesetz“
  rationale: Der griechische Text bezeichnet das Gesetz als den Maßstab, der Parteilichkeit als Sünde erweist, legt hier aber keine engere heilsgeschichtliche oder konfessionelle Bestimmung ausdrücklich fest.
- issue: Verhältnis von Sündigen und Überführtwerden
  choice: Mit „und“ als zwei eng verbundene Aussagen wiedergegeben
  alternative: „indem/weil ihr vom Gesetz überführt werdet“
  rationale: Das Partizip kann syntaktisch verschieden nuanciert werden. Die koordinierte Wiedergabe wahrt die enge Verbindung, ohne eine kausale oder modale Beziehung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nach ihrem Ansehen bevorzugen“ ist verständlicher als die traditionelle, heute missverständliche Wendung „die Person ansehen“. „Übertreter“ bewahrt den rechtlich-biblischen Ton; die Fußnote bietet eine explizitere Alternative.
