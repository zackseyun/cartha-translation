  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: de
  text: Denn wer das ganze Gesetz hält, aber in einem Punkt strauchelt[a], ist am ganzen Gesetz schuldig geworden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in einem strauchelt«; gemeint ist moralisches Versagen. Auch möglich: »in einem Punkt versagt« oder »in einem Punkt zu Fall kommt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ist für das Ganze haftbar geworden«. Die Wendung besagt, dass die Übertretung eines Punktes Schuld gegenüber dem ganzen Gesetz begründet; sie besagt nicht, dass alle einzelnen Gebote tatsächlich übertreten worden seien.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: wer
  rationale: Das indefinite Relativpronomen formuliert einen allgemein gültigen Grundsatz; „wer“ gibt diese universale Aussage im Deutschen natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet die vorangehende Aussage und bewahrt den argumentativen Zusammenhang.
- source_word: ὅλον τὸν νόμον
  choice: das ganze Gesetz
  rationale: Die Formulierung gibt die ausdrücklich bezeichnete Gesamtheit des Gesetzes direkt und idiomatisch wieder.
- source_word: τηρήσῃ
  choice: hält
  rationale: τηρέω bezeichnet hier das Halten beziehungsweise Befolgen des Gesetzes; „hält“ ist im deutschen biblisch-rechtlichen Sprachgebrauch klar und geläufig.
- source_word: πταίσῃ
  choice: zu Fall kommt
  rationale: πταίω bezeichnet wörtlich ein Stolpern und bildlich ein moralisches Verfehlen. „Zu Fall kommt“ bewahrt das Bild und macht dessen ernste ethische Bedeutung verständlich.
- source_word: ἐν ἑνί
  choice: in einem einzigen Punkt
  rationale: Die Wendung bezeichnet einen einzelnen Bereich oder eine einzelne Forderung; „einzigen“ hebt den Kontrast zum ganzen Gesetz hervor, ohne den Bezug enger festzulegen.
- source_word: γέγονεν
  choice: ist … geworden
  rationale: Das Perfekt bezeichnet einen eingetretenen Zustand als Folge des Verfehlens; „ist … geworden“ erhält diesen Ergebnisaspekt.
- source_word: πάντων
  choice: am ganzen Gesetz
  rationale: Der Genitiv Plural bezieht sich auf die Gesamtheit der gesetzlichen Forderungen. Die deutsche Wiedergabe stellt den Rückbezug auf „das ganze Gesetz“ klar her.
- source_word: ἔνοχος
  choice: schuldig
  rationale: ἔνοχος bezeichnet Schuld beziehungsweise rechtliche Haftbarkeit. „Schuldig“ passt zum moralisch-rechtlichen Zusammenhang; die Alternative „haftbar“ wird in der Fußnote genannt.
theological_decisions:
- issue: Umfang der Schuld gegenüber dem Gesetz
  choice: Die Verletzung eines einzigen Punktes macht einen Menschen gegenüber dem ganzen Gesetz schuldig.
  alternative: Jedes einzelne Gebot sei damit der Tat nach übertreten worden oder jede Übertretung sei gleich schwer.
  rationale: πάντων ἔνοχος bezeichnet Schuld oder Haftbarkeit im Blick auf die Gesamtheit, sagt aber nicht ausdrücklich, dass alle Gebote einzeln begangen wurden oder jede Sünde denselben Schweregrad hat. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu Fall kommt“ bewahrt das griechische Stolperbild verständlicher als das im Deutschen möglicherweise zu schwach wirkende bloße „stolpert“. Die Formulierung vermeidet konfessionelle Zusätze und lässt den genauen Umfang von πάντων ἔνοχος offen.
