reference: James 2:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: de
  text: 'Und so wurde die Schrift erfüllt, die sagt: »Abraham glaubte Gott, und das wurde ihm zur Gerechtigkeit angerechnet[a]«, und er wurde Freund Gottes genannt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »zugerechnet« oder »zur Gerechtigkeit gerechnet«.'
    reason: Lexikalische Alternativen für ἐλογίσθη; das Verb kann im Kontext des Anrechnens oder Zurechnens wiedergegeben werden.
lexical_decisions:
- source_word: ἐπληρώθη
  choice: es erfüllte sich
  rationale: Die deutsche reflexive Wendung gibt das griechische Passiv in einer natürlichen Schriftzitat-Formel wieder und bewahrt den Gedanken, dass das Schriftwort zur Erfüllung kam.
- source_word: ἡ γραφή ἡ λέγουσα
  choice: die Schrift, die sagt
  rationale: γραφή bezeichnet hier die Heilige Schrift beziehungsweise das zitierte Schriftwort; das Präsens λέγουσα wird als weiterhin sprechendes Schriftzeugnis wiedergegeben.
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: Abraham glaubte Gott
  rationale: πιστεύω mit Dativ bezeichnet hier, dass Abraham Gott Glauben schenkte. Die Formulierung bleibt quellennah und legt sich nicht einseitig auf eine abstrakte Aussage über den Glauben an Gottes Existenz fest.
- source_word: ἐλογίσθη αὐτῷ
  choice: das wurde ihm ... angerechnet
  rationale: Das Passiv von λογίζομαι hat hier eine rechnende beziehungsweise zurechnende Nuance. „Angerechnet“ ist im modernen Deutschen verständlich und bewahrt diese Bedeutung; „das“ nimmt Abrahams Glauben auf.
- source_word: εἰς δικαιοσύνην
  choice: als Gerechtigkeit
  rationale: Die Wendung entspricht dem prädikativen Sinn der Genesis-Zitation und bewahrt δικαιοσύνη als „Gerechtigkeit“, ohne den theologischen Zusammenhang weiter auszudeuten.
- source_word: φίλος θεοῦ
  choice: Freund Gottes
  rationale: Die artikellose Prädikatsbezeichnung wird im Deutschen natürlich ohne unbestimmten Artikel wiedergegeben und lässt die genitivische Beziehung unverengt stehen.
- source_word: ἐκλήθη
  choice: wurde ... genannt
  rationale: Die passive Wiedergabe bewahrt die offene Aussage des Griechischen darüber, wer Abraham so bezeichnete oder anerkannte.
theological_decisions:
- issue: Verhältnis von Abrahams Glauben und Werken im Argument des Jakobus
  choice: Die Aussage von der Erfüllung der Schrift wird unmittelbar mit dem Zitat über Abrahams Glauben verbunden.
  alternative: Den Vers ausdrücklich entweder rein forensisch von den Werken lösen oder die Werke an die Stelle des Glaubens setzen.
  rationale: Der griechische Text verbindet in seinem Kontext Genesis 15,6 mit Abrahams gehorsamem Handeln. Die Übersetzung bewahrt diese Spannung, ohne eine konfessionelle Lösung in den Vers einzutragen.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht oder Gerechtsein
  rationale: „Gerechtigkeit“ entspricht der etablierten theologischen und schriftsprachlichen Bedeutung in diesem Genesis-Zitat und bleibt zugleich hinreichend offen.
- issue: Bezug von ἐπληρώθη
  choice: Die Schrift „erfüllte sich“.
  alternative: Die Schrift wurde lediglich bestätigt oder bewiesen.
  rationale: „Erfüllte sich“ gibt πληρόω direkt wieder und bewahrt Jakobus’ starke Aussage, ohne genauer festzulegen, in welchem dogmatischen Sinn das frühere Schriftwort zur Erfüllung gelangte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit quellennaher Satzführung. Die wörtliche Schriftformel bleibt erkennbar; unnötige altertümliche Formen werden vermieden. Das griechische δέ im Zitat wird nicht eigens wiedergegeben, da es hier im Deutschen keinen notwendigen Gegensatz markiert.
