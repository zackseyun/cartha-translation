id: JAS.2.17
reference: James 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: de
  text: So ist auch der Glaube[a], wenn er keine Werke hat, für sich allein tot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „das Vertrauen“; hier weniger wahrscheinlich: „die Treue“. Das griechische Wort pistis kann diese Bedeutungen haben, doch „Glaube“ passt am besten zum Gedankengang des Jakobus in diesem Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: So ist auch
  rationale: οὕτως stellt die Folgerung beziehungsweise den Vergleich mit dem vorangehenden Beispiel her, während καί die Entsprechung markiert. „So ist auch“ gibt diesen argumentativen Anschluss knapp und natürlich wieder.
- source_word: ἡ πίστις
  choice: der Glaube
  rationale: Im Gedankengang von Jakobus 2 geht es um einen behaupteten Glauben, dem entsprechende Taten fehlen. „Glaube“ bewahrt sowohl den üblichen Sinn als auch die theologische Spannung des Abschnitts, ohne sie vorzeitig aufzulösen.
- source_word: ἐὰν μὴ ἔχῃ
  choice: wenn er keine … hat
  rationale: Die Bedingung mit ἐάν μή und Präsens Konjunktiv wird im Deutschen transparent und idiomatisch als „wenn … keine … hat“ wiedergegeben.
- source_word: ἔργα
  choice: Werke
  rationale: „Werke“ erhält die begriffliche Verbindung zum weiteren Gedankengang in Jakobus 2 und bezeichnet hier sichtbare Handlungen, ohne diese interpretierend auf eine bestimmte Art von Taten einzugrenzen.
- source_word: νεκρά
  choice: tot
  rationale: Das prädikative Adjektiv ist eine scharfe Metapher. „Tot“ bewahrt ihre volle Aussagekraft.
- source_word: καθ’ ἑαυτήν
  choice: für sich allein
  rationale: Die Wendung beschreibt den Glauben isoliert von Werken. „Für sich allein“ ist verständliches, gegenwärtiges Deutsch und vermeidet die mögliche Fehlbedeutung von „an sich“, als sei eine Wesensaussage über jeden Glauben gemeint.
theological_decisions:
- issue: Wiedergabe von πίστις im theologisch umstrittenen Verhältnis von Glaube und Werken
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: „Glaube“ passt am besten zu Jakobus’ Argument über einen Glauben, der keine Werke hat. Die Übersetzung bewahrt die Spannung zwischen Glaube und Werken, ohne eine konfessionelle Erklärung darüber einzutragen, wie diese Aussage mit anderen neutestamentlichen Aussagen über Glaube und Rechtfertigung zusammenhängt.
- issue: Bedeutung von καθ’ ἑαυτήν
  choice: für sich allein
  alternative: an sich; für sich
  rationale: Die Formulierung hebt den von Werken getrennten Glauben hervor. Sie sagt nicht deutlicher als der griechische Text, ob damit bloß ein beanspruchter Glaube oder Glaube in einem umfassenderen Sinn gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt eng am argumentativen Aufbau des griechischen Textes, klingt aber natürlich. Der Ausdruck „Werke“ wird wegen seiner Schlüsselrolle im unmittelbaren Kontext beibehalten.
