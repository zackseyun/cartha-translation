id: JAS.2.2
reference: James 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: de
  text: Denn wenn in eure Versammlung[a] ein Mann mit goldenen Ringen und glänzender Kleidung kommt und auch ein Armer in schmutziger Kleidung kommt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Synagoge“; das griechische Wort synagōgē bedeutet „Synagoge“ oder „Versammlung“.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: Versammlung
  rationale: Das Wort bezeichnet eine Synagoge beziehungsweise eine Zusammenkunft. Im Zusammenhang ist „Versammlung“ verständlich, ohne die Zusammenkunft vorschnell als bestimmte Institution einzuordnen; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: Das griechische Substantiv ist ausdrücklich maskulin und bezeichnet in diesem Beispiel einen Mann.
- source_word: χρυσοδακτύλιος
  choice: mit goldenen Ringen
  rationale: Das Adjektiv beschreibt jemanden, der Gold an den Fingern trägt. Die idiomatische Wiedergabe bewahrt das sichtbare Zeichen des Wohlstands.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: glänzender Kleidung
  rationale: λαμπρός kann „glänzend“, „prächtig“ oder „vornehm“ bedeuten. „Glänzend“ erhält die anschauliche Wirkung und lässt zugleich den Eindruck kostbarer Kleidung erkennen.
- source_word: πτωχὸς
  choice: ein Armer
  rationale: Das substantivierte maskuline Adjektiv steht im rhetorischen Gegensatz zu dem wohlhabend erscheinenden Mann.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: in schmutziger Kleidung
  rationale: ῥυπαρός bezeichnet deutlich verschmutzte oder unreine Kleidung. „Schmutzig“ gibt dies direkt wieder, ohne die Aussage auf bloß abgetragene Kleidung abzuschwächen.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: kommt ... kommt
  rationale: Die Wiederholung bewahrt die parallele Struktur des griechischen Beispiels; im Deutschen bezeichnet „in die Versammlung kommen“ natürlich das Eintreten.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ stellt den erklärenden Bezug zum vorausgehenden Verbot der Bevorzugung her.
theological_decisions:
- issue: Wiedergabe von συναγωγή im Kontext eines christlichen Briefes
  choice: Versammlung
  alternative: Synagoge
  rationale: Der Ausdruck legt hier keine bestimmte Gemeindeverfassung fest. „Versammlung“ gibt die Zusammenkunft wieder, ohne eine institutionelle Deutung vorzugeben; „Synagoge“ bleibt als wörtlichere lexikalische Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hypothetische Satzform und die wiederholte Bewegung beider Männer in die Versammlung bleiben erhalten; der Vers endet entsprechend der fortlaufenden Satzkonstruktion mit einem Komma.
