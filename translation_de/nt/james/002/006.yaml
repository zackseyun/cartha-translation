source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: de
  text: Ihr aber habt den Armen entehrt.[a] Sind es nicht die Reichen, die euch unterdrücken und die euch selbst vor Gericht schleppen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den armen Menschen“; allgemeiner auch: „die Armen“. Im Griechischen steht der Singular, wahrscheinlich als Rückbezug auf den armen Mann im vorausgehenden Beispiel und zugleich stellvertretend für Arme allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „in die Gerichte“; gemeint sind gerichtliche Instanzen oder Gerichtsverfahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: habt … entehrt
  rationale: Das Verb bezeichnet eine Behandlung, die jemandem Ehre abspricht und ihn geringschätzt. „Entehrt“ bewahrt die Ehr-Schande-Dimension des griechischen Ausdrucks.
- source_word: τὸν πτωχόν
  choice: den Armen
  rationale: Der substantivierte maskuline Singular greift wahrscheinlich den armen Mann aus dem unmittelbar vorausgehenden Beispiel auf und kann ihn zugleich als Vertreter der Armen bezeichnen.
- source_word: οἱ πλούσιοι
  choice: die Reichen
  rationale: Der substantivierte Plural bezeichnet knapp und idiomatisch die gesellschaftliche Gruppe der Reichen.
- source_word: καταδυναστεύουσιν
  choice: unterdrücken
  rationale: Das Verb beschreibt eine harte, gegen andere gerichtete Machtausübung; „unterdrücken“ gibt diese Bedeutung ohne unnötige Präzisierung wieder.
- source_word: ἕλκουσιν
  choice: schleppen
  rationale: Das Verb vermittelt ein gewaltsames oder widerstrebendes Ziehen und bewahrt im gerichtlichen Zusammenhang die anschauliche Schärfe.
- source_word: κριτήρια
  choice: vor Gericht
  rationale: Der Plural bezeichnet hier gerichtliche Instanzen beziehungsweise Gerichtsverfahren. Die deutsche Wendung „vor Gericht schleppen“ ist natürlich und eindeutig.
- source_word: καὶ αὐτοὶ
  choice: und euch selbst
  rationale: Das emphatische αὐτοί hebt hervor, dass gerade die Reichen selbst diejenigen sind, die dies tun. Die deutsche Stellung nach „und“ hält diese Betonung verständlich aufrecht.
- source_word: οὐχ … ;
  choice: Sind es nicht …?
  rationale: Die rhetorische Frage erwartet Zustimmung. Die deutsche Spaltsatzkonstruktion gibt sowohl diese Erwartung als auch die Hervorhebung der Reichen natürlich wieder.
theological_decisions:
- issue: Bezug des singularischen Ausdrucks „der Arme“
  choice: Ein repräsentativer armer Mann aus dem Versammlungsszenario, mit weiterem Bezug auf Arme allgemein
  alternative: Ein rein kollektiver Singular mit der Bedeutung „die Armen“
  rationale: Der Singular setzt das konkrete Beispiel aus Jakobus 2,2–3 fort. Zugleich kann die einzelne Gestalt repräsentativ für Arme insgesamt stehen; die Übersetzung legt die allgemeinere Anwendung nicht fest oder aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Den Armen“ wahrt den grammatischen Singular und den Anschluss an das vorausgehende Beispiel. „Vor Gericht schleppen“ ist idiomatisch, bewahrt aber die gewaltsame Bildhaftigkeit von ἕλκω. Die emphatische Identifikation der Reichen wird durch „Sind es nicht die Reichen“ und „selbst“ hervorgehoben.
