source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: de
  text: 'Hört zu, meine geliebten Brüder[a]: Hat Gott nicht die erwählt, die in den Augen der Welt arm sind[b], reich im Glauben[c] und Erben des Reiches, das er denen versprochen hat, die ihn lieben?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort lautet „Brüder“, kann hier aber die ganze Glaubensgemeinschaft einschließen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „nach den Maßstäben der Welt arm“ oder „in weltlichen Verhältnissen arm“.'
    reason: lexical_alternative
  - marker: c
    text: „Glaube“ kann auch mit „Vertrauen“ oder, hier weniger wahrscheinlich, mit „Treue“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Hört zu
  rationale: Der Aoristimperativ im Plural fordert die Angesprochenen nachdrücklich zur Aufmerksamkeit auf; „Hört zu“ ist im heutigen Deutsch natürlich und direkt.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: meine geliebten Brüder
  rationale: „Brüder“ gibt den grammatisch maskulinen Plural wieder; „geliebten“ bewahrt ἀγαπητοί. Die wahrscheinlich inklusive Anrede der ganzen Glaubensgemeinschaft wird in einer Fußnote kenntlich gemacht.
- source_word: οὐχ ... ἐξελέξατο
  choice: Hat Gott nicht ... erwählt
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung. „Erwählt“ ist die übliche, sachlich passende Wiedergabe, ohne eine umfassende Erwählungslehre in den Vers hineinzulesen.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: die vor der Welt arm sind
  rationale: Die Formulierung bewahrt den Bezug des Dativs τῷ κόσμῳ und lässt die mögliche Bedeutung „nach den Maßstäben bzw. im Urteil der Welt“ erkennen, ohne sie im Haupttext vollständig festzulegen.
- source_word: πλουσίους ἐν πίστει
  choice: reich im Glauben
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe von πίστις und erhält den Gegensatz zwischen weltlicher Armut und Reichtum im Glauben.
- source_word: κληρονόμους τῆς βασιλείας
  choice: Erben des Reiches
  rationale: „Erben“ bewahrt die rechtlich-familiäre Bildsprache von κληρονόμοι und ist im Deutschen geläufig.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: das er denen versprochen hat, die ihn lieben
  rationale: Die Formulierung gibt das Relativpronomen und den Dativ als Empfänger der Verheißung natürlich wieder; das substantivierte Präsenspartizip bezeichnet Menschen, die durch ihre Liebe zu Gott gekennzeichnet sind.
theological_decisions:
- issue: Mögliche dogmatische Überdeutung der göttlichen Erwählung
  choice: ἐξελέξατο wird schlicht mit „erwählt“ wiedergegeben.
  alternative: Eine stärker deutende Formulierung, die Prädestination oder eine bestimmte Heilsordnung ausdrücklich hervorhebt.
  rationale: Der Vers stellt Gottes Wertung der Armen dem menschlichen Ansehen der Reichen gegenüber. Die Übersetzung bewahrt die Erwählungsaussage, ohne spätere Lehrsysteme einzutragen.
- issue: Umfang der Anrede ἀδελφοί
  choice: Im Haupttext steht „Brüder“, ergänzt durch eine inklusive Fußnote.
  alternative: „Brüder und Schwestern“ unmittelbar im Haupttext.
  rationale: Die griechische Form ist maskulin plural, kann in der brieflichen Anrede jedoch die gesamte Gemeinde einschließen. Haupttext und Fußnote bilden Form und wahrscheinlichen Umfang gemeinsam ab.
- issue: Bedeutung von πίστις
  choice: Im Haupttext steht „Glaube“.
  alternative: „Vertrauen“ oder, hier weniger wahrscheinlich, „Treue“.
  rationale: Im Ausdruck πλουσίους ἐν πίστει bezeichnet πίστις am ehesten den Glauben bzw. das Vertrauen auf Gott. Die lexikalische Spannweite wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der Gegensatz zwischen Armut vor der Welt und Reichtum im Glauben bleiben deutlich. Die Formulierung „vor der Welt arm“ wahrt die knappe, mehrdeutige Dativkonstruktion des Griechischen; verständlichere Deutungsmöglichkeiten stehen in der Fußnote.
