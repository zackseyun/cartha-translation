id: JAS.2.22
reference: James 2:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: de
  text: Du siehst, dass der Glaube[a] mit seinen Werken zusammenwirkte und dass der Glaube durch die Werke vollendet wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Treue“ oder „das Vertrauen“. Das griechische Wort πίστις kann je nach Zusammenhang diese Bedeutungsnuancen tragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Vollendung gebracht wurde“ oder „vollständig gemacht wurde“. Das griechische Verb kann ausdrücken, dass etwas sein vorgesehenes Ziel oder seine Reife erreicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Du siehst
  rationale: Die direkte Anrede in der zweiten Person Singular und der argumentative Stil des Jakobus werden bewahrt.
- source_word: πίστις
  choice: Glaube
  rationale: „Glaube“ ist hier die naheliegende und im Zusammenhang etablierte Wiedergabe, ohne die möglichen Nuancen „Treue“ oder „Vertrauen“ auszuschließen.
- source_word: συνήργει
  choice: wirkte … zusammen
  rationale: Die Form bezeichnet ein Zusammenwirken in der Vergangenheit. Die Wiedergabe erhält sowohl den Gedanken der Mitwirkung als auch den Bezug zwischen Glaube und Werken.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: mit seinen Werken
  rationale: Der Dativ steht bei συνεργέω als Bezug des Zusammenwirkens. „Werke“ wahrt den Leitbegriff der Argumentation in Jakobus 2.
- source_word: ἐκ τῶν ἔργων
  choice: durch die Werke
  rationale: ἐκ bezeichnet hier den Ausgangspunkt beziehungsweise das Mittel, durch das der Glaube sein Ziel erreicht. „Durch“ ist im Deutschen natürlich und lässt den genauen theologischen Zusammenhang offen.
- source_word: ἐτελειώθη
  choice: wurde vollendet
  rationale: Das Passiv von τελειόω bezeichnet das Erreichen des vorgesehenen Ziels oder der Vollständigkeit. „Vollendet“ wahrt diese Bedeutung knapp und würdig.
theological_decisions:
- issue: Verhältnis von Glaube und Werken
  choice: Der Glaube wirkte mit den Werken zusammen und wurde durch die Werke vollendet.
  alternative: 'Die Werke zeigen den Glauben lediglich nach außen; oder: Die Werke bringen den Glauben zur Reife; oder: Die Werke wirken als notwendiger Ausdruck mit dem Glauben zusammen.'
  rationale: Der griechische Text spricht ausdrücklich von Zusammenwirken und Vollendung, entfaltet hier aber keine vollständige Rechtfertigungslehre. Die Übersetzung bewahrt diese Spannung, ohne eine konfessionelle Deutung einzutragen.
- issue: Bedeutungsumfang von πίστις
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: „Glaube“ entspricht dem unmittelbaren Gedankengang und dem üblichen Leitbegriff, während eine Fußnote die möglichen verwandten Nuancen offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Anrede „Du“ und der wiederholte Ausdruck „der Glaube“ folgen der griechischen Satzführung; „Werke“ bleibt als zentraler Begriff des Abschnitts erhalten.
