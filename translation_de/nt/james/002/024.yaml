  - severity: medium
    issue: „Taten“ ist enger als ἔργα.
    rationale: „Taten“ kann vor allem einzelne vollbrachte Handlungen nahelegen. „Werke“ ist die im Kontext offene und traditionelle deutsche Entsprechung für ἔργα und erhält die terminologische Spannung des Verses.
