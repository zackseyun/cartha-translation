  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: de
  text: Ihr seht, dass ein Mensch durch Werke gerechtfertigt wird und nicht durch Glauben allein.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als gerecht erwiesen wird“ oder „im Recht bestätigt wird“. Die Formulierung lässt offen, ob hier besonders an ein Gerechtsprechen oder an die Bestätigung gedacht ist, dass jemand im Recht ist.'
    reason: alternative_reading
  - marker: b
    text: Für „Glauben“ kann das griechische Wort je nach Zusammenhang auch „Treue“ oder „Vertrauen“ bedeuten; hier ist „Glauben“ die naheliegende Wiedergabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Ihr seht
  rationale: Die zweite Person Plural im Präsens richtet sich als Feststellung unmittelbar an die Lesenden und knüpft an das vorausgehende Beispiel an.
- source_word: ἐξ ἔργων
  choice: aufgrund von Taten
  rationale: ἐξ mit Genitiv bezeichnet hier Grundlage oder Ausgangspunkt. „Aufgrund von Taten“ gibt dies in natürlichem Deutsch wieder; „Taten“ bezeichnet konkrete Handlungen und vermeidet die mögliche Verengung von „Werken“ auf religiöse Leistungen.
- source_word: δικαιοῦται
  choice: gerechtfertigt wird
  rationale: Die Wiedergabe bewahrt das theologisch gewichtige und mehrdeutige δικαιόω sowie die sprachliche Spannung zu paulinischen Aussagen, ohne den Sinn auf „als gerecht erwiesen“ festzulegen.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet hier einen Menschen allgemein. „Ein Mensch“ ist im Deutschen präzise, generisch und entspricht nicht notwendig einem männlichen Individuum.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glauben“ ist in diesem Kontext die naheliegende Wiedergabe von πίστις und wahrt den ausdrücklichen Gegensatz zu den Taten.
- source_word: μόνον
  choice: allein
  rationale: Das nachgestellte μόνον schränkt „Glauben“ exklusiv ein; „nicht allein aufgrund von Glauben“ bildet diese Stellung und Aussage idiomatisch ab.
theological_decisions:
- issue: Bedeutung von δικαιοῦται im Verhältnis zur Rechtfertigungslehre
  choice: „gerechtfertigt wird“ im Haupttext beibehalten
  alternative: „als gerecht erwiesen wird“ oder „Recht bekommt“
  rationale: Jakobus’ Formulierung soll stehen bleiben, ohne sie zugunsten einer demonstrativen, vindikatorischen oder ausschließlich forensischen Deutung aufzulösen. Eine Fußnote nennt die möglichen Sinnnuancen.
- issue: Verhältnis von Taten und Glauben
  choice: Die ausschließende Aussage „nicht allein aufgrund von Glauben“ unverändert bewahren
  alternative: Sinngemäße Harmonisierung, etwa „nicht durch einen Glauben ohne Taten“
  rationale: Eine paraphrasierende Harmonisierung würde die zugespitzte Aussage des griechischen Textes abschwächen. Die theologische Spannung bleibt daher im Haupttext erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ein Mensch“ gibt den generischen Sinn von ἄνθρωπος ohne unnötige Geschlechtsmarkierung wieder. „Taten“ ist allgemein verständlicher als das kirchensprachlich geprägte „Werke“, während „gerechtfertigt“ bewusst die traditionelle theologische Spannung bewahrt.
