  naturalness: „Ihr seht“ und „ein Mensch“ sind natürliches modernes Standarddeutsch. „Durch Werke … und nicht durch Glauben allein“ ist knapper, idiomatischer und macht den parallelen Kontrast des Griechischen deutlich.
  terminology: „Gerechtfertigt“ bewahrt die terminologische Verbindung zu δικαιόω und sollte im Haupttext stehen bleiben. „Werke“ ist hier gegenüber „Taten“ vorzuziehen, weil es ἔργα ohne unnötige Einengung auf einzelne konkrete Handlungen wiedergibt und den bewusst beibehaltenen theologischen Wortlaut wahrt. Die alternative Fußnotenformulierung „Recht bekommt“ ist für δικαιοῦται zu umgangssprachlich und semantisch zu ungenau.
