revisions:
- from: Ihr seht, dass ein Mensch aufgrund von Taten gerechtfertigt wird und nicht allein aufgrund von Glauben.[a][b]
  to: Ihr seht, dass ein Mensch durch Werke gerechtfertigt wird und nicht durch Glauben allein.[a][b]
  rationale: Die Revision stellt den direkten griechischen Kontrast mit „durch Werke … nicht durch Glauben allein“ wieder her und verwendet mit „Werke“ eine semantisch offenere, für den Kontext terminologisch angemessene Wiedergabe von ἔργα. „Gerechtfertigt“ bleibt im Haupttext, damit die Auslegungsfrage nicht vorentschieden wird; die Fußnote nennt mögliche Kontextnuancen in natürlichem, präzisem Deutsch.
