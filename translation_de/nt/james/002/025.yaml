id: JAS.2.25
reference: James 2:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: de
  text: Und wurde nicht ebenso auch die Prostituierte Rahab aufgrund von Werken gerechtfertigt[a], als sie die Boten aufnahm[b] und sie auf einem anderen Weg fortschickte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als gerecht erwiesen« oder »für gerecht erklärt«. Das griechische Wort bedeutet wörtlich »gerechtfertigt«; die Übersetzung entscheidet hier nicht zwischen den möglichen Bedeutungsnuancen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bedeutet »Boten« und kann auch »Engel« bezeichnen. Hier sind die Männer gemeint, die Rahab aufnahm (Josua 2), nicht himmlische Engel.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Und wurde nicht ebenso auch
  rationale: Die Formulierung verbindet Rahabs Beispiel mit dem vorausgehenden Beispiel Abrahams und bewahrt sowohl die weiterführende als auch die vergleichende und additive Funktion.
- source_word: Ῥαὰβ
  choice: Rahab
  rationale: Der Personenname folgt der etablierten deutschen Schreibweise.
- source_word: ἡ πόρνη
  choice: die Prostituierte
  rationale: πόρνη bezeichnet hier unmittelbar eine Prostituierte. Die moderne Bezeichnung ist klar und bewahrt die soziale und moralische Aussage des griechischen Ausdrucks.
- source_word: οὐκ ... ἐδικαιώθη
  choice: wurde nicht ... gerechtfertigt
  rationale: Das Passiv von δικαιόω wird mit dem in diesem theologischen Zusammenhang üblichen Ausdruck »gerechtfertigt« wiedergegeben, ohne die Bedeutung auf »als gerecht erwiesen« oder »für gerecht erklärt« festzulegen.
- source_word: ἐξ ἔργων
  choice: aufgrund von Werken
  rationale: ἐκ mit Genitiv bezeichnet hier Grundlage oder Ausgangspunkt. »Aufgrund von Werken« bildet diesen Bezug im Deutschen klarer ab als das potenziell instrumentale »durch Werke«.
- source_word: ὑποδεξαμένη
  choice: als sie ... aufnahm
  rationale: Das Partizip bezeichnet Rahabs bereitwillige Aufnahme der Männer. »Als« gibt den begleitenden beziehungsweise konkretisierenden Bezug zu ihrer Rechtfertigung natürlich wieder.
- source_word: τοὺς ἀγγέλους
  choice: die Boten
  rationale: ἄγγελος kann Bote oder Engel bedeuten. Im Zusammenhang der Rahab-Erzählung sind menschliche Abgesandte gemeint; »Boten« wahrt den lexikalischen Wert, ohne die spezifischere Bezeichnung »Kundschafter« in den Text einzutragen.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: und sie auf einem anderen Weg fortschickte
  rationale: ἐκβάλλω bedeutet hier nicht gewaltsames Hinauswerfen, sondern Wegschicken. »Auf einem anderen Weg« bewahrt den Kontrast von ἑτέρᾳ ὁδῷ.
theological_decisions:
- issue: Bedeutung von δικαιόω in Jakobus 2,25 im Verhältnis von Glauben und Werken
  choice: Im Haupttext steht »gerechtfertigt«, ohne den Ausdruck auf anfängliche forensische Rechtfertigung oder spätere Bestätigung einzuengen.
  alternative: »als gerecht erwiesen« oder »für gerecht erklärt«
  rationale: Die Formulierung des Jakobus lässt eine theologisch bedeutsame Spannung bestehen. Eine deutende Umschreibung würde diese zugunsten eines bestimmten Systems auflösen; die Fußnote nennt deshalb die wichtigsten Bedeutungsnuancen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die Verbindung zum vorausgehenden Abraham-Beispiel bleiben erhalten. »Prostituierte« ist gegenwärtig und präzise; »gerechtfertigt« bewahrt die theologische Spannung.
