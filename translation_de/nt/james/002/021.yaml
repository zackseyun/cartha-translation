id: JAS.2.21
reference: James 2:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: de
  text: Wurde nicht Abraham, unser Vater, aufgrund seiner Werke gerechtfertigt, als er seinen Sohn Isaak auf dem Altar darbrachte?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als gerecht erwiesen« oder »für gerecht erklärt«. Das griechische Verb kann je nach Zusammenhang sowohl eine deklarative als auch eine erweisende Bedeutung haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: unser Vater
  rationale: Bewahrt die familiäre Metapher und die Sprache gemeinsamer Bundesidentität; „unser Vorfahr“ wäre sachlich möglich, würde aber die relationale Kraft abschwächen.
- source_word: ἐξ ἔργων
  choice: aufgrund seiner Werke
  rationale: ἐξ mit Genitiv bezeichnet hier Grundlage oder Ausgangspunkt. Die Formulierung ist im modernen Deutsch natürlich und vermeidet, „Werke“ vorschnell als bloßes Mittel zu deuten.
- source_word: ἐδικαιώθη
  choice: wurde gerechtfertigt
  rationale: Bewahrt die lexikalische Verbindung zur Rechtfertigungsthematik und lässt offen, ob der Akzent auf Gerechterklärung, Erweis als gerecht oder Bestätigung liegt.
- source_word: ἀνενέγκας
  choice: als er ... darbrachte
  rationale: Gibt das Aoristpartizip natürlich temporal wieder und bewahrt mit „darbrachte“ den kultisch-opferbezogenen Sinn von ἀναφέρω.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Idiومatische deutsche Wiedergabe des Possessivverhältnisses ohne Bedeutungsverlust.
- source_word: θυσιαστήριον
  choice: Altar
  rationale: Die übliche und klare Bezeichnung für einen Opferaltar.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Wurde nicht ... gerechtfertigt?
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet, in natürlicher deutscher Wortstellung.
theological_decisions:
- issue: Bedeutung von δικαιόω in Jakobus 2,21 im Verhältnis zu den Werken
  choice: Im Haupttext steht „gerechtfertigt“, damit die Verbindung zur Rechtfertigungsthematik und die theologische Spannung erhalten bleiben.
  alternative: „als gerecht erwiesen“, „für gerecht erklärt“ oder „bestätigt“
  rationale: Der Kontext erlaubt eine deklarative beziehungsweise demonstrative Nuance, ohne dass der Vers allein eindeutig zwischen ihnen entscheidet. Die Übersetzung legt sich daher im Haupttext nicht auf eine konfessionelle Deutung fest; mögliche Sinnnuancen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unser Vater“ erhält die biblische Verwandtschafts- und Identitätssprache; „darbrachte“ trägt den Opferbezug. Die Wortstellung bleibt klar und gut vorlesbar.
