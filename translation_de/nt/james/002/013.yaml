base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: de
  text: Denn das Gericht ist erbarmungslos gegenüber dem, der keine Barmherzigkeit erwiesen hat. Die Barmherzigkeit triumphiert über das Gericht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Die Barmherzigkeit rühmt sich gegenüber dem Gericht.“ Das griechische Verb kann ein Rühmen oder Frohlocken über etwas ausdrücken; hier ist es sinngemäß mit „triumphiert über“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: Gericht
  rationale: Bezeichnet hier die göttliche beziehungsweise richterliche Beurteilung. „Gericht“ bewahrt die forensische Bedeutung, ohne sie auf „Verurteilung“ zu verengen, und gibt beide Vorkommen einheitlich wieder.
- source_word: ἀνέλεος
  choice: erbarmungslos
  rationale: Das prädikative Adjektiv kennzeichnet das Gericht als ohne Erbarmen. „Erbarmungslos“ ist im modernen Deutschen natürlich und hält die Wortbeziehung zu „Barmherzigkeit“ sinngemäß fest.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: gegen den, der keine Barmherzigkeit geübt hat
  rationale: Die artikulierte Partizipialfügung bezeichnet den Betroffenen; ποιεῖν ἔλεος ist eine semitisch geprägte Wendung für das praktische Erweisen von Barmherzigkeit. „Barmherzigkeit üben“ ist würdig und verständlich und wahrt den Handlungsaspekt.
- source_word: κατακαυχᾶται
  choice: triumphiert über
  rationale: Das Verb kann wörtlicher „sich gegenüber rühmen“ oder „über etwas frohlocken“ bedeuten. Im Zusammenhang vermittelt „triumphiert über“ die Vorstellung des Überlegenseins idiomatisch, ohne die knappe Bildsprache aufzulösen.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Die übliche und kontextgerechte Wiedergabe; sie bewahrt die Wiederholung und den Gegensatz zum erbarmungslosen Gericht.
theological_decisions:
- issue: Bezug und Aussage der Schlussklausel κατακαυχᾶται ἔλεος κρίσεως
  choice: 'Als allgemeiner, bewusst knapper Grundsatz: „Die Barmherzigkeit triumphiert über das Gericht.“'
  alternative: „Die Barmherzigkeit rühmt sich gegenüber dem Gericht“ beziehungsweise ein ausdrücklicher Bezug auf die vom Menschen geübte oder auf Gottes Barmherzigkeit.
  rationale: Der griechische Satz bestimmt nicht ausdrücklich, ob Gottes Barmherzigkeit, die von Glaubenden geübte Barmherzigkeit oder Barmherzigkeit im Gericht im Vordergrund steht. Die allgemeine Formulierung bewahrt diese Spannung und vermeidet eine Aussage über verdienstliche Werke.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist nah an der griechischen Satzstruktur, bleibt aber idiomatisch. Der bestimmte Artikel in „die Barmherzigkeit“ und „das Gericht“ bewahrt den aphoristischen Charakter des Schlusssatzes.
