  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: de
  text: Habt ihr damit nicht unter euch Unterschiede gemacht[a] und seid zu Richtern mit bösen Überlegungen geworden?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Habt ihr damit nicht untereinander diskriminiert?“ Das Verb kann auch „gespalten sein“ oder in anderen Zusammenhängen „zweifeln“ bedeuten; hier spricht der Zusammenhang für diskriminierende Unterscheidungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Richter böser Gedanken/Überlegungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: habt ihr … Unterschiede gemacht
  rationale: Im unmittelbaren Zusammenhang mit der Bevorzugung des Reichen gegenüber dem Armen bezeichnet das Verb hier am ehesten ein unterscheidendes, diskriminierendes Urteilen. Die Form lässt zwar auch die Nuance einer inneren oder gemeinschaftlichen Spaltung zu, doch „Unterschiede gemacht“ gibt die konkrete Handlung im Kontext klar wieder.
- source_word: ἐν ἑαυτοῖς
  choice: unter euch
  rationale: Die Wendung kann sowohl „in euch selbst“ als auch „unter euch“ bedeuten. Wegen des gemeinschaftlichen Rahmens und des Verhaltens in der Versammlung ist die zwischenmenschliche Bedeutung hier wahrscheinlicher.
- source_word: ἐγένεσθε
  choice: seid … geworden
  rationale: 'Das Verb bezeichnet das Ergebnis ihres unterscheidenden Handelns: Dadurch sind sie zu einer bestimmten Art von Richtern geworden.'
- source_word: κριταὶ
  choice: Richtern
  rationale: „Richter“ ist die direkte und im Deutschen verständliche Entsprechung und bewahrt den moralisch-gerichtlichen Nachdruck der Zurechtweisung.
- source_word: διαλογισμῶν πονηρῶν
  choice: mit bösen Überlegungen
  rationale: Die Formulierung gibt den Genitiv idiomatisch als kennzeichnendes Merkmal der Richter wieder. „Überlegungen“ bewahrt stärker als „Motive“ den Bedeutungsbereich von διαλογισμός als Denken, Erwägen oder Schlussfolgern.
- source_word: οὐ
  choice: nicht
  rationale: Die verneinte Frage ist rhetorisch und erwartet Zustimmung. Die deutsche Form „Habt ihr … nicht …?“ erhält diesen vorwurfsvollen Fragecharakter.
theological_decisions:
- issue: Bedeutung von διακρίνω im Zusammenhang mit Parteilichkeit
  choice: Der Vers tadelt das diskriminierende Unterscheiden innerhalb der Gemeinschaft.
  alternative: Der Vers beschreibt, dass die Angesprochenen innerlich gespalten oder unsicher geworden sind.
  rationale: Jakobus 2,1–3 handelt unmittelbar von der bevorzugten Behandlung des Reichen gegenüber dem Armen. Daher passt hier die soziale Bedeutung des Unterscheidens besser als die an anderer Stelle bei Jakobus belegte Bedeutung „zweifeln“. Die Fußnote hält die echte Mehrdeutigkeit des Verbs dennoch sichtbar.
- issue: Beziehung des Genitivs διαλογισμῶν πονηρῶν zu κριταί
  choice: Idiomatiche Wiedergabe als „Richter mit bösen Überlegungen“.
  alternative: Formnähere Wiedergabe als „Richter böser Überlegungen/Gedanken“.
  rationale: Der griechische Genitiv ist knapp und kann unterschiedlich bestimmt werden. Die Hauptübersetzung versteht die bösen Überlegungen als Kennzeichen der Richter, ohne sie enger als bloße „Motive“ festzulegen; die formnahe Fassung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Damit“ stellt natürlich den Rückbezug auf das in den vorhergehenden Versen beschriebene Verhalten her. „Böse Überlegungen“ klingt bewusst etwas gewichtiger als „böse Gedanken“ und bewahrt den Aspekt des urteilenden Erwägens.
