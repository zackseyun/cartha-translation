revisions:
- from: 'und ihr dem, der die glänzende Kleidung trägt, besondere Aufmerksamkeit schenkt und sagt: »Setz du dich hier auf einen guten Platz«, zu dem Armen aber sagt: »Bleib du dort stehen oder setz dich dort unten an meinen Fußschemel[a]«,'
  to: 'und ihr dem, der die glänzende Kleidung trägt, besondere Aufmerksamkeit schenkt und sagt: »Setz du dich hier auf einen guten Platz«, zu dem Armen aber sagt: »Stell du dich dort hin oder setz dich unter meinen Fußschemel[a]«,'
  rationale: Die Revision bewahrt die im griechischen Text markierte Zuordnung von „dort“ zur Sitzalternative, gibt στῆθι ohne zusätzlichen Verlaufsaspekt wieder und übersetzt ὑπό direkt mit „unter“. Die Textvariante wird präzise und ohne Vermischung mit einer lexikalischen Erläuterung dokumentiert.
