review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft den Sinn von ἐπιβλέψητε, die glänzende/prächtige Kleidung und den Kontrast der Platzzuweisungen weitgehend. Sie verändert jedoch die Satzstruktur und verwischt dadurch eine relevante Ambiguität: Im griechischen Drucktext gehört ἐκεῖ unmittelbar zur Alternative „setz dich dort“, nicht zum Befehl „steh“. „Bleib ... stehen“ fügt zudem gegenüber dem einfachen Aoristimperativ στῆθι einen durativen Aspekt hinzu. „Unten an“ ist eine interpretierende Abschwächung von ὑπό mit Akkusativ („unter“).'
  naturalness: Die direkte Rede ist modernes, verständliches Standarddeutsch. „Schenk[t] besondere Aufmerksamkeit“ ist idiomatisch; „gewähr[t] ... besondere Aufmerksamkeit“ ist etwas knapper und in diesem Kontext ebenso natürlich. „Setz dich“ passt gut.
  terminology: „glänzende Kleidung“, „der Arme“ und „Fußschemel“ sind angemessen. Die Anrede mit „du“ kann die griechische zweite Person wiedergeben, sollte aber nicht durch „bleib“ inhaltlich verstärkt werden.
  issues:
  - severity: medium
    issue: „Bleib du dort stehen“ gibt στῆθι nicht präzise wieder und ordnet „dort“ auch dem ersten Befehl zu.
    rationale: 'στῆθι ist hier ein einfacher Imperativ „steh/stell dich“. Im SBLGNT folgt „ἐκεῖ“ auf κάθου und qualifiziert daher die Sitzalternative: „oder setz dich dort“. Die deutsche Fassung sollte diese Zuordnung nicht umstellen.'
  - severity: medium
    issue: „unten an meinen Fußschemel“ ersetzt die räumliche Aussage „unter meinen Fußschemel“.
    rationale: ὑπὸ τὸ ὑποπόδιόν μου bedeutet mit Akkusativ hier „unter meinen Fußschemel“. Die bildlich-demütigende und im Deutschen möglicherweise harte Formulierung ist gerade beizubehalten; eine Fußnote kann die wörtliche Räumlichkeit erläutern.
  - severity: low
    issue: Die Fußnote beschreibt die Variantenlage ungenau.
    rationale: Die kürzere Lesart lässt nach στῆθι die Wörter ἢ κάθου ἐκεῖ aus; sie bietet nicht lediglich unspezifisch „statt ‚oder setz dich dort‘ eine kürzere Lesart“. Die Fußnote sollte den ausgelassenen Wortlaut klar benennen.
