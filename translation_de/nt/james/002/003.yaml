id: JAS.2.3
reference: James 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: de
  text: 'und ihr dem, der die glänzende Kleidung trägt, besondere Aufmerksamkeit schenkt und sagt: »Setz du dich hier auf einen guten Platz«, zu dem Armen aber sagt: »Stell du dich dort hin oder setz dich unter meinen Fußschemel[a]«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen »oder setz dich dort« aus.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: besondere Aufmerksamkeit schenkt
  rationale: Das Verb bezeichnet hier im Zusammenhang der Parteilichkeit mehr als bloßes Hinsehen, ohne bereits ausdrücklich mit »bevorzugen« zu übersetzen.
- source_word: φοροῦντα
  choice: trägt
  rationale: Im Zusammenhang mit Kleidung ist »trägt« die direkte und natürliche deutsche Wiedergabe.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: die glänzende Kleidung
  rationale: »Glänzend« bewahrt den anschaulichen Grundsinn von λαμπρός und lässt zugleich die Bedeutung prächtiger oder feiner Kleidung anklingen.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Setz du dich hier auf einen guten Platz
  rationale: Die Formulierung gibt den Imperativ und die bevorzugte Sitzgelegenheit idiomatisch wieder; das betonte »du« erhält den Kontrast.
- source_word: τῷ πτωχῷ
  choice: zu dem Armen
  rationale: Der substantivierte maskuline Singular bezeichnet in der geschilderten Szene einen bestimmten armen Mann; »der Arme« ist im Deutschen natürlich und geschlechtsgenau.
- source_word: στῆθι
  choice: Bleib du dort stehen
  rationale: Das griechische στῆθι ist ein Befehl zu stehen; »bleib stehen« klingt in dieser Gegenüberstellung natürlich. »Dort« ergibt sich im gedruckten Text aus dem anschließenden ἐκεῖ und wird in der deutschen Koordination für beide Alternativen verständlich gemacht.
- source_word: ἢ κάθου ἐκεῖ
  choice: oder setz dich dort
  rationale: Die Wendung bewahrt den alternativen Befehl und die räumlich distanzierende Wirkung von ἐκεῖ.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: unten an meinen Fußschemel
  rationale: Wörtliches »unter meinen Fußschemel« wäre im Deutschen leicht als räumlich unmögliche Position unter dem Gegenstand misszuverstehen. »Unten an« bewahrt die erniedrigende Platzzuweisung und die vertikale Unterordnung, ohne sie zu glätten.
theological_decisions:
- issue: Soziale Parteilichkeit
  choice: Die unterschiedliche Behandlung wird durch konkrete Aufmerksamkeit und Platzzuweisung dargestellt.
  alternative: Im Haupttext ausdrücklich »bevorzugt« oder »parteiisch behandelt« sagen.
  rationale: Der Vers schildert das Verhalten, während der Zusammenhang es als Parteilichkeit deutet. Die Übersetzung soll diese theologische Wertung nicht vorwegnehmend in jedes Verb eintragen.
- issue: Geschlecht von πτωχῷ
  choice: der Arme
  alternative: die arme Person
  rationale: Der griechische Ausdruck steht im maskulinen Singular und bezeichnet einen einzelnen Besucher; die deutsche Wiedergabe erhält diese Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bewahrt den schroffen sozialen Kontrast. Das einleitende »und« erhält den syntaktischen Anschluss an Vers 2; der Satz bleibt entsprechend offen zum folgenden Vers hin.
