id: JAS.2.18
reference: James 2:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: de
  text: 'Doch jemand wird sagen[d]: „Du hast Glauben, und ich habe Werke.“ Zeige mir deinen Glauben ohne Werke[a], und ich werde dir meinen Glauben an meinen Werken[b] zeigen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „getrennt von Werken“. Das griechische χωρίς kann sowohl „ohne“ als auch „getrennt von“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „aus meinen Werken“. Die griechische Präposition kann den Ausgangspunkt oder das Mittel bezeichnen; „an meinen Werken“ bringt zum Ausdruck, dass die Werke den Glauben sichtbar machen.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische pistis kann je nach Zusammenhang auch „Vertrauen“ oder „Treue“ bedeuten.
    reason: alternative_reading
  - marker: d
    text: Die griechischen Handschriften haben keine modernen Anführungszeichen. Daher ist nicht völlig sicher, wo die Rede des hypothetischen Einwenders endet; möglicherweise umfasst sie auch einen Teil des Folgenden.
    reason: discourse_ambiguity
lexical_decisions:
- source_word: Ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Einwand beziehungsweise Gegensatz innerhalb der Argumentation und klingt im modernen Deutschen natürlich.
- source_word: ἐρεῖ τις
  choice: jemand wird sagen
  rationale: Bewahrt das Futur des griechischen Ausdrucks und den Stil eines hypothetischen Einwands.
- source_word: πίστιν
  choice: Glauben
  rationale: Gibt πίστις in diesem Zusammenhang sachgerecht und traditionsübergreifend wieder, ohne die Spannung zwischen bekanntem Glauben und sichtbaren Werken vorzeitig aufzulösen.
- source_word: ἔργα
  choice: Werke
  rationale: Bewahrt den Leitbegriff in Jakobus 2 und seine Verbindung zur theologischen Diskussion über Glauben und Werke.
- source_word: δεῖξόν μοι
  choice: Zeige mir
  rationale: Der Imperativ fordert eine konkrete, sichtbare Darlegung; die Formulierung ist direkt und idiomatisch.
- source_word: χωρὶς τῶν ἔργων
  choice: ohne Werke
  rationale: Gibt die Trennung beziehungsweise das Fehlen von Werken natürlich wieder. „Getrennt von Werken“ wäre ebenfalls möglich, klingt hier jedoch schwerfälliger.
- source_word: κἀγώ σοι δείξω
  choice: und ich werde dir … zeigen
  rationale: Bewahrt die parallele Gegenüberstellung und das Futur des griechischen Satzes.
- source_word: ἐκ τῶν ἔργων μου
  choice: an meinen Werken
  rationale: Drückt im Deutschen idiomatisch aus, dass die Werke den Glauben sichtbar und erkennbar machen; die mögliche Nuance des Ausgangspunkts wird in einer Fußnote genannt.
- source_word: τὴν πίστιν
  choice: meinen Glauben
  rationale: Das Possessivpronomen ergibt sich aus μου bei „meinen Werken“ und stellt die beabsichtigte Parallele zu „deinen Glauben“ klar heraus.
theological_decisions:
- issue: Wiedergabe von πίστις in der Debatte über Glauben und Werke
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: „Glauben“ bewahrt den zentralen Begriff und die theologische Spannung des Abschnitts. „Treue“ würde die Aussage stärker festlegen, als es der Kontext verlangt.
- issue: Umfang der Rede des hypothetischen Einwenders
  choice: Die direkte Rede endet nach „ich habe Werke“
  alternative: Die folgenden Aufforderungen können ganz oder teilweise noch zur Rede des Einwenders gehören
  rationale: Die griechischen Handschriften enthalten keine modernen Anführungszeichen. Die gewählte Zeichensetzung entspricht einer verbreiteten und im Zusammenhang gut verständlichen Gliederung, ohne die alternative Abgrenzung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Werke“ und „Glauben“ bleiben als Leitbegriffe erhalten. Der Satzbau folgt der pointierten Gegenüberstellung des griechischen Textes, ohne unnötig altertümlich zu wirken.
