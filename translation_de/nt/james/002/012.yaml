  text: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: de
  text: Redet so und handelt so wie Menschen, die durch das Gesetz der Freiheit gerichtet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Redet so und handelt so
  rationale: Bewahrt die parallelen Imperative und gibt ποιεῖτε im Deutschen natürlich mit „handelt“ wieder.
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: wie Menschen, die ... gerichtet werden sollen
  rationale: Macht den Vergleich und die bevorstehende Beurteilung verständlich, ohne das Futurische übermäßig zu verstärken.
- source_word: διὰ νόμου ἐλευθερίας
  choice: durch das Gesetz der Freiheit
  rationale: „Durch“ bildet διά mit Genitiv formal ab und bewahrt die mögliche instrumentale beziehungsweise vermittelnde Funktion des Gesetzes, statt sie eindeutig als bloßen Maßstab aufzulösen.
theological_decisions:
- issue: Verhältnis des Gesetzes der Freiheit zum Gericht
  choice: durch das Gesetz der Freiheit
  alternative: nach dem Gesetz der Freiheit / vom Gesetz der Freiheit
  rationale: Die Übersetzung hält die instrumentale oder vermittelnde Spannung von διά offen und vermeidet sowohl eine rein normative Festlegung („nach“) als auch die Darstellung des Gesetzes als handelnden Richter („vom“).
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Mahnform und der Parallelismus des griechischen Satzes bleiben erhalten.
source_grounding:
  english_pob_role: consult_only
