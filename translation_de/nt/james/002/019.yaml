  variant: modern standard German
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: de
  text: Du glaubst, dass Gott einer ist[a]? Du tust gut daran. Selbst die Dämonen glauben es – und schaudern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass es nur einen Gott gibt“. Das Griechische lässt beide Wiedergaben zu; „dass Gott einer ist“ folgt der griechischen Formulierung enger und kann an das jüdische Bekenntnis zur Einheit Gottes anklingen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zittern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Du
  rationale: Das Personalpronomen ist im Griechischen ausdrücklich gesetzt und betont die direkte Anrede. Das deutsche „Du“ bewahrt diese Anrede, ohne sie durch „du selbst“ unnötig zu verstärken.
- source_word: πιστεύεις
  choice: glaubst
  rationale: Da ὅτι den Inhalt des Glaubens einführt, ist „glauben“ hier natürlicher und genauer als „vertrauen“.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt des Glaubens ein und wird im Deutschen idiomatisch mit „dass“ wiedergegeben.
- source_word: εἷς ἐστιν ὁ θεός
  choice: Gott einer ist
  rationale: Diese Formulierung folgt der griechischen Aussage eng und bewahrt einen möglichen Anklang an das jüdische Bekenntnis zur Einheit Gottes. „Es gibt nur einen Gott“ wäre ebenfalls möglich, verschöbe die Aussage aber stärker in Richtung einer Existenzbehauptung.
- source_word: καλῶς ποιεῖς
  choice: Du tust gut daran
  rationale: Die feste deutsche Wendung gibt die knappe Anerkennung natürlich und würdevoll wieder, ohne den möglicherweise zugespitzten Unterton festzulegen.
- source_word: καὶ
  choice: Auch
  rationale: Das erste καί vor „die Dämonen“ hebt hervor, dass selbst sie denselben Glaubenssatz bejahen. „Auch“ wirkt im Deutschen hier natürlicher als „sogar“, ohne die Aussage abzuschwächen.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: „Dämonen“ ist die direkte und etablierte Entsprechung; „böse Geister“ wäre stärker deutend.
- source_word: πιστεύουσιν
  choice: glauben es
  rationale: „Glauben“ erhält die für das Argument entscheidende Wiederholung von πιστεύω. Das Pronomen „es“ nimmt im natürlichen Deutschen den zuvor genannten Glaubensinhalt auf.
- source_word: φρίσσουσιν
  choice: schaudern
  rationale: „Schaudern“ bezeichnet eine von Furcht ausgelöste körperliche Reaktion und gibt die Anschaulichkeit des seltenen Verbs φρίσσω prägnant wieder.
theological_decisions:
- issue: Wiedergabe des monotheistischen Bekenntnisses εἷς ἐστιν ὁ θεός
  choice: Gott ist einer
  alternative: Es gibt nur einen Gott
  rationale: „Gott ist einer“ bleibt näher an der griechischen Prädikation und lässt den möglichen Anklang an das Bekenntnis Israels bestehen. Die alternative existenziale Wiedergabe ist sachlich möglich und wird in der Fußnote genannt.
- issue: Gegenüberstellung menschlichen und dämonischen Glaubens
  choice: Auch die Dämonen glauben es – und schaudern
  alternative: Und die Dämonen glauben ebenfalls und zittern
  rationale: „Auch“ und der Gedankenstrich schärfen den rhetorischen Gegensatz, ohne zusätzliche Lehraussagen einzutragen. So bleibt die Spannung bestehen, dass die Zustimmung zu einem richtigen Glaubenssatz allein den Menschen nicht von den Dämonen unterscheidet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzführung. Die direkte Anrede und die Wiederholung von „glauben“ bleiben erhalten; der Gedankenstrich bildet die rhetorische Zuspitzung des griechischen Satzes ab.
