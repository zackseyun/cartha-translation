id: JAS.2.20
reference: James 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: de
  text: Willst du aber erkennen, du hohler Mensch[a], dass der Glaube ohne Werke wirkungslos ist[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „leerer Mensch“; auch: „törichter Mensch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „untätig“, „unwirksam“ oder „unfruchtbar“. Das griechische Wort bezeichnet etwas Inaktives oder Unproduktives.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Willst du aber erkennen
  rationale: θέλω mit Infinitiv bezeichnet hier den Willen oder die Bereitschaft; δέ setzt den Gedankengang mit einem Gegensatz fort. „Erkennen“ gibt γνῶναι direkt und im Deutschen natürlich wieder.
- source_word: ὦ ἄνθρωπε κενέ
  choice: du hohler Mensch
  rationale: κενός bedeutet wörtlich „leer“ und bezeichnet hier einen Menschen ohne Einsicht oder geistigen Gehalt. „Hohl“ bewahrt das Bild besser als das stärker deutende „töricht“; die Anrede bleibt singular und personenbezogen.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt dessen ein, was der Angesprochene erkennen soll.
- source_word: ἡ πίστις
  choice: der Glaube
  rationale: „Glaube“ ist hier die übliche, sachlich offene Wiedergabe von πίστις und passt zu Jakobus’ Erörterung des Verhältnisses von Glauben und Werken.
- source_word: χωρὶς τῶν ἔργων
  choice: ohne Werke
  rationale: χωρίς mit Genitiv bedeutet „ohne“ oder „getrennt von“. „Ohne Werke“ ist knapp, idiomatisch und bewahrt die inhaltliche Trennung.
- source_word: ἀργή ἐστιν
  choice: wirkungslos ist
  rationale: ἀργός bezeichnet hier etwas Untätiges, Unproduktives oder Unwirksames. „Wirkungslos“ bringt die praktische Aussage klar zum Ausdruck, ohne den Ausdruck mit „tot“ an die Formulierung benachbarter Verse anzugleichen.
theological_decisions:
- issue: Verhältnis von Glauben und Werken in der Argumentation des Jakobus
  choice: Der Glaube ohne Werke wird als „wirkungslos“ bezeichnet.
  alternative: „Untätig“, „unfruchtbar“ oder – in Angleichung an die Nachbarverse – „tot“.
  rationale: Der griechische Text verwendet hier ἀργή, nicht νεκρά. „Wirkungslos“ wahrt die Aussage dieses Verses, ohne sie konfessionell zu erklären oder mit der Wortwahl der benachbarten Verse gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die rhetorische Frage bleiben erhalten. „Hohler Mensch“ bewahrt das griechische Bild, während die Fußnote die wörtliche und die stärker deutende Alternative nennt.
