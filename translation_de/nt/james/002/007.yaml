  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: de
  text: Sind nicht gerade sie es, die den guten Namen lästern, der über euch angerufen worden ist?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den ehrenvollen Namen“ oder „den edlen Namen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der über euch genannt worden ist“. Die Wendung meint nicht notwendig ein Gebet, sondern wahrscheinlich den Namen, durch den die Gläubigen als zugehörig gekennzeichnet sind; sie kann an Bundes- oder Taufsprache anklingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Sind nicht gerade sie es
  rationale: Die rhetorische Frage erwartet Zustimmung; „gerade sie“ gibt die Hervorhebung durch αὐτοὶ in natürlichem Deutsch wieder.
- source_word: βλασφημοῦσιν
  choice: lästern
  rationale: „Lästern“ bewahrt sowohl den Gedanken ehrverletzender Rede als auch den möglichen religiösen Bezug des Verbs, ohne das Objekt ausdrücklich mit Gott oder Christus gleichzusetzen.
- source_word: τὸ καλὸν ὄνομα
  choice: den guten Namen
  rationale: Die wörtliche und im Deutschen verständliche Wiedergabe lässt offen, ob καλός hier besonders „ehrenvoll“ oder „edel“ meint, und legt den Namensträger nicht ausdrücklich fest.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: der über euch ausgerufen wurde
  rationale: Die Formulierung bildet die passive Konstruktion und das räumliche Bild von ἐπί ab. „Ausgerufen“ ist im heutigen Deutsch verständlicher als „angerufen“, das leicht als Gebet missverstanden würde.
theological_decisions:
- issue: Bezug des „guten Namens“
  choice: Der Name bleibt im Haupttext unbenannt und wird als der über den Gläubigen ausgerufene Name wiedergegeben.
  alternative: Ausdrückliche Wiedergabe als „der Name Christi“ oder „der Name Jesu“.
  rationale: Der Zusammenhang in Jakobus 2,1 legt einen christologischen Bezug nahe, doch der griechische Vers nennt Jesus oder Christus nicht ausdrücklich. Die offene Formulierung bewahrt daher die mögliche Beziehung auf den Namen Jesu, Gottes Namen oder die dadurch bezeichnete Identität der Gemeinschaft.
- issue: Bedeutung der Wendung ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: „über euch ausgerufen wurde“
  alternative: „nach dem ihr genannt seid“ oder „der über euch angerufen wurde“
  rationale: Die gewählte Fassung bewahrt das Bild eines über Menschen ausgesprochenen Namens und damit mögliche Bundes-, Zugehörigkeits- oder Taufsprache, ohne eine bestimmte rituelle Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Zuspitzung wird durch „gerade sie“ erhalten; die ungewöhnliche Namensformel bleibt bewusst bildhaft und wird in der Fußnote erläutert.
