id: JAS.2.11
reference: James 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: de
  text: 'Denn derjenige, der gesagt hat: »Du sollst nicht die Ehe brechen«, hat auch gesagt: »Du sollst nicht morden.« Wenn du nun nicht die Ehe brichst, aber mordest, bist du zu einem Übertreter des Gesetzes geworden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: derselbe, der gesagt hat
  rationale: Das substantivierte Partizip bezeichnet den einen Sprecher beider Gebote. »Derselbe« macht im Deutschen den für die Argumentation entscheidenden gemeinsamen Urheber deutlich, ohne ihn ausdrücklich als Gott zu benennen.
- source_word: Μὴ μοιχεύσῃς
  choice: Du sollst nicht die Ehe brechen
  rationale: Die Formulierung gibt das Verbot in natürlichem, würdigem Deutsch wieder und lässt zugleich den erkennbaren Anklang an den Wortlaut des Dekalogs bestehen.
- source_word: καί
  choice: auch
  rationale: »Auch« verbindet das zweite Gebot ausdrücklich mit demselben Sprecher und trägt so den argumentativen Nachdruck des griechischen καί.
- source_word: Μὴ φονεύσῃς
  choice: Du sollst nicht morden
  rationale: φονεύω bezeichnet hier Mord beziehungsweise unerlaubtes Töten, nicht jedes Töten unterschiedslos. »Morden« bewahrt die ethische Bestimmtheit des Gebots.
- source_word: εἰ δὲ
  choice: Wenn ... nun
  rationale: Die Wendung leitet die folgernde Anwendung ein. »Wenn ... nun« klingt im modernen Deutsch natürlich und wahrt den Gedankengang.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: nicht die Ehe brichst, aber mordest
  rationale: Die Präsensformen beschreiben einen allgemeinen angenommenen Fall; »aber« gibt den ausdrücklichen Gegensatz wieder.
- source_word: γέγονας
  choice: bist ... geworden
  rationale: Das Perfekt von γίνομαι bezeichnet den eingetretenen und fortbestehenden Zustand. »Bist geworden« erhält diesen Aspekt besser als das bloße »bist«.
- source_word: παραβάτης νόμου
  choice: ein Übertreter des Gesetzes
  rationale: Die Formulierung bewahrt das rechtlich-ethische Bild einer Grenz- oder Gebotsübertretung und bezieht die Tat auf das Gesetz als Ganzes.
- source_word: νόμου
  choice: des Gesetzes
  rationale: Der Zusammenhang meint das bekannte göttliche Gesetz, aus dem die beiden Gebote angeführt werden; der bestimmte Artikel ist daher im Deutschen sachgemäß.
theological_decisions:
- issue: Identität des Sprechers der Gebote
  choice: Der Sprecher bleibt als »derselbe, der gesagt hat« bezeichnet.
  alternative: Denn Gott, der gesagt hat ...
  rationale: Gott ist im Zusammenhang eindeutig vorausgesetzt, wird im griechischen Wortlaut aber nicht ausdrücklich genannt. Die Übersetzung vermeidet deshalb eine erklärende Ergänzung im Haupttext.
- issue: Umfang der Gesetzesübertretung
  choice: »Übertreter des Gesetzes«
  alternative: Übertreter dieses Gebots
  rationale: Der Wortlaut bezieht die einzelne Übertretung auf das Gesetz, nicht lediglich auf das jeweils verletzte Einzelgebot. Damit bleibt die Spannung von Einheit und einzelnen Forderungen des Gesetzes erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Gebotszitate behalten die geläufige Form »Du sollst nicht ...«, während der umgebende Satz natürlich und argumentativ klar formuliert ist.
