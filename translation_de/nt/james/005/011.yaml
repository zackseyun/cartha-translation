id: JAS.5.11
reference: James 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: de
  text: Seht, wir nennen die glücklich, die standgehalten haben. Von Hiobs Standhaftigkeit habt ihr gehört, und ihr habt den Ausgang gesehen, den der Herr herbeigeführt hat; denn der Herr ist reich an Mitgefühl und barmherzig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίζομεν
  choice: wir preisen die glücklich
  rationale: Gibt das aktive Urteil »glücklich/selig nennen« natürlich wieder, ohne daraus eine Segenshandlung zu machen.
- source_word: ὑπομείναντας / ὑπομονήν
  choice: die standgehalten haben / Standhaftigkeit
  rationale: Bewahrt den gemeinsamen Wortstamm sinngemäß und bezeichnet ausdauerndes Standhalten unter Belastung.
- source_word: τὸ τέλος κυρίου
  choice: welches Ende der Herr herbeigeführt hat
  rationale: τέλος kann Ende, Ausgang oder Ziel bedeuten. Im Zusammenhang mit Hiob ist der von Gott herbeigeführte Ausgang gemeint; die Formulierung wahrt zugleich den Bezug zum »Ende« der Erzählung.
- source_word: πολύσπλαγχνος
  choice: reich an Mitgefühl
  rationale: Vermittelt das intensive, innige Erbarmen des seltenen griechischen Ausdrucks in verständlichem modernem Deutsch.
- source_word: οἰκτίρμων
  choice: barmherzig
  rationale: Die etablierte und sachlich genaue Wiedergabe für erbarmungsvoll und gnädig handelnd.
theological_decisions:
- issue: Bedeutung von τὸ τέλος κυρίου
  choice: welches Ende der Herr herbeigeführt hat
  alternative: das Ziel / die Absicht des Herrn
  rationale: Der Genitiv kann unterschiedlich verstanden werden. Der Hiob-Bezug legt den schließlich vom Herrn bewirkten Ausgang nahe; eine Festlegung allein auf Gottes verborgene Absicht würde die lexikalische Spannung unnötig auflösen.
- issue: Referent von κύριος
  choice: der Herr
  alternative: Gott / der HERR
  rationale: Die Übersetzung bewahrt die griechische Gottesbezeichnung und vermeidet sowohl eine nicht ausdrücklich vorhandene Präzisierung als auch die Eintragung des Gottesnamens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Seht« erhält den aufmerksamkeitslenkenden Charakter von ἰδού, ohne altertümliches »Siehe«. Die parallelen Aussagen sind klar und gut vorlesbar gestaltet.
