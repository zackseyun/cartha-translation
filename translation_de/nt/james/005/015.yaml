id: JAS.5.15
reference: James 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: de
  text: Und das Gebet des Glaubens wird den Kranken retten[a], und der Herr wird ihn aufrichten. Und wenn er Sünden begangen hat[b], wird ihm vergeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »heilen« oder »gesund machen«; griechisch: »retten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »selbst wenn er Sünden begangen hat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: Gebet
  rationale: Im Zusammenhang mit dem Gebet der Ältesten für den Kranken (V. 14) bezeichnet εὐχή ein Gebet, nicht ein Gelübde.
- source_word: πίστεως
  choice: des Glaubens
  rationale: Die formnahe Wiedergabe bewahrt die genitivische Verbindung und ihre mögliche Bedeutung als ein von Glauben beziehungsweise Vertrauen geprägtes Gebet.
- source_word: σώσει
  choice: wird ... retten
  rationale: σῴζω kann im Krankheitszusammenhang auch heilen oder gesund machen bedeuten. »Retten« bewahrt die lexikalische und theologische Weite, während der Kontext körperliche Wiederherstellung einschließt.
- source_word: τὸν κάμνοντα
  choice: den Kranken
  rationale: κάμνω kann ermüdet, erschöpft oder krank sein bedeuten; im unmittelbaren Zusammenhang von Krankheit, Salbung und Aufrichtung ist »der Kranke« die natürliche deutsche Wiedergabe.
- source_word: ἐγερεῖ
  choice: wird ... aufrichten
  rationale: »Aufrichten« erhält das Bild von ἐγείρω und passt zur Wiederherstellung vom Krankenlager, ohne mögliche weitergehende Resonanzen auszuschließen.
- source_word: κύριος
  choice: der Herr
  rationale: Dies ist die übliche und theologisch angemessene Wiedergabe von κύριος bei göttlichem Handeln.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: wenn er Sünden begangen hat
  rationale: Die Formulierung gibt die bedingte Aussage klar wieder. Die mögliche konzessive Nuance »selbst wenn« wird in einer Fußnote erhalten.
- source_word: ἀφεθήσεται αὐτῷ
  choice: wird ihm vergeben werden
  rationale: Die unpersönliche Passivkonstruktion ist im Deutschen natürlich und bewahrt das göttliche Passiv sowie den Bezug auf die zuvor genannten Sünden.
theological_decisions:
- issue: Ob σώσει eng als körperliche Heilung oder weiter als Rettung beziehungsweise Wiederherstellung wiederzugeben ist
  choice: Im Haupttext steht »retten«; der Krankheitskontext lässt die körperliche Heilung mitschwingen.
  alternative: »heilen« oder »gesund machen«
  rationale: Jakobus verwendet σῴζω und nicht ein ausschließlich medizinisches Verb. Die gewählte Fassung bewahrt dessen Bedeutungsweite.
- issue: Ob der Vers eine automatisch eintretende Heilung durch Gebet lehrt
  choice: Die Futurformen werden ohne abschwächende oder verstärkende Zusätze als direkte Aussagen wiedergegeben.
  alternative: Deutende Zusätze wie »kann wiederherstellen« oder »wird in jedem Fall heilen«
  rationale: Die Übersetzung soll weder die Zusage des griechischen Textes abschwächen noch eine über den Wortlaut hinausgehende Lehre garantierter Heilung eintragen.
- issue: Ob Krankheit stets ursächlich mit persönlicher Sünde verbunden wird
  choice: 'Die Sünden werden in einem Bedingungssatz genannt: »wenn er Sünden begangen hat«.'
  alternative: Krankheit grundsätzlich als Folge persönlicher Sünde darzustellen
  rationale: Der griechische Text nennt begangene Sünden als Möglichkeit, nicht als allgemeine Ursache jeder Krankheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Text, ist aber idiomatisch. »Gebet des Glaubens«, »retten« und »aufrichten« bewahren bewusst die sprachliche und theologische Mehrdeutigkeit der Vorlage.
