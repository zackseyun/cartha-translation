id: JAS.5.13
reference: James 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: de
  text: Leidet jemand unter euch? Dann soll er beten. Ist jemand guten Mutes? Dann soll er Loblieder singen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Psalmen singen. Das griechische Verb kann sich besonders auf das Singen von Psalmen beziehen, aber auch allgemeiner auf gesungenes Gotteslob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: leidet
  rationale: Das Verb κακοπαθέω bezeichnet das Erleben von Not, Mühsal oder Leiden. »Leidet« ist knapp, natürlich und lässt die Art der Bedrängnis offen.
- source_word: τις
  choice: jemand
  rationale: Das unbestimmte Pronomen ist singularisch und allgemein gebraucht. »Jemand« gibt diesen repräsentativen Sinn im Deutschen idiomatisch wieder.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung verortet die betreffende Person innerhalb der angesprochenen Gemeinschaft; »unter euch« ist direkt und natürlich.
- source_word: προσευχέσθω
  choice: Dann soll er beten
  rationale: Der Imperativ der dritten Person fordert die einzelne betroffene Person zum anhaltenden beziehungsweise wiederholten Gebet auf. »Soll … beten« bewahrt Aufforderung und Singular; »dann« stellt den natürlichen Bezug zur vorausgehenden Frage her.
- source_word: εὐθυμεῖ
  choice: ist guten Mutes
  rationale: εὐθυμέω bezeichnet, guten oder frohen Mutes zu sein. »Ist guten Mutes« ist würdig und bewahrt den inneren Zustand, ohne ihn auf bloße Heiterkeit zu verengen.
- source_word: ψαλλέτω
  choice: Dann soll er Loblieder singen
  rationale: ψάλλω bezeichnet hier musikalisch beziehungsweise singend ausgedrücktes Lob. »Loblieder singen« vermittelt den gottesdienstlichen Sinn verständlich, ohne den Ausdruck zwingend auf kanonische Psalmen zu beschränken; diese engere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Generische singularische Aufforderungen
  choice: Singular mit »jemand« und »er« beibehalten
  alternative: Pluralische Formulierung oder »diese Person«
  rationale: Der griechische Text verbindet das generische τις mit Imperativen der dritten Person Singular. Die deutsche Fassung wahrt den repräsentativen Singular; »jemand« macht deutlich, dass die Aussage allgemein gilt und nicht auf Männer beschränkt ist.
- issue: Bedeutung von ψαλλέτω
  choice: »Loblieder singen«
  alternative: »Psalmen singen« oder »musizieren«
  rationale: Das Verb kann besonders das Singen von Psalmen bezeichnen, trägt in diesem Zusammenhang aber auch den weiteren Sinn gesungenen Gotteslobs. Die Hauptfassung vermeidet eine nicht zwingend ausgesprochene Beschränkung auf den Psalter, während die lexikalische Mehrdeutigkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Fragen und Aufforderungen des griechischen Textes bleiben erhalten. »Guten Mutes« ist leicht gehoben, aber allgemein verständlich und bildet einen passenden Gegenpol zu »leidet«.
