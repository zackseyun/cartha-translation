  source_fidelity: Die Übersetzung gibt die beiden generischen, singularischen Fragen und die anschließenden Aufforderungen zuverlässig wieder. »Leidet« deckt κακοπαθεῖ angemessen weit ab und legt weder Krankheit noch Verfolgung fest. »Ist jemand guten Mutes?« trifft εὐθυμεῖ idiomatisch und bewahrt den Kontrast. »Loblieder singen« ist eine vertretbare kontextuelle Wiedergabe von ψαλλέτω, ohne die Aussage zwingend auf Psalmen zu begrenzen.
  naturalness: Modernes Standarddeutsch, klar und gut lesbar. Die Wiederholung von »Dann soll er« macht die Folgerung explizit, die im Deutschen natürlich klingt, ohne den Sinn zu verändern. »Guten Mutes« ist leicht gehoben, aber in diesem würdigen Register passend.
