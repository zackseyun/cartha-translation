revisions:
- from: 'Seht doch: Der Lohn der Arbeiter, die eure Felder abgeerntet haben und denen ihr ihn vorenthalten habt, schreit laut; und die Hilferufe der Erntearbeiter sind bis zu den Ohren des Herrn Zebaot[a] gedrungen.'
  to: 'Seht doch: Der Lohn der Arbeiter, die eure Felder abgeerntet haben, der von euch vorenthalten wurde, schreit; und die Rufe der Erntearbeiter sind bis zu den Ohren des Herrn Zebaot[a] gedrungen.'
  rationale: Die Revision stellt die syntaktische Zuordnung des zurückgehaltenen Lohnes unmittelbar zum griechischen Partizip her, entfernt die nicht erforderliche Intensivierung von κράζει und vermeidet mit „Rufe“ eine engere Deutung von βοαί. Der Gottesname samt Fußnotenanker bleibt unverändert erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:47:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und der Sinn des griechischen Textes sind zutreffend wiedergegeben: der zurückgehaltene Lohn wird personifiziert, die Rufe der Erntearbeiter gelangen zu Gottes Ohren, und das Perfekt von εἰσεληλύθασιν ist angemessen durch „sind ... gedrungen“ erfasst. Die Formulierung „denen ihr ihn vorenthalten habt“ verengt jedoch die griechische Partizipialkonstruktion unnötig auf die Arbeiter als Dativobjekt, während der Text den Lohn als „von euch zurückgehalten“ qualifiziert.'
  naturalness: Der Satz ist insgesamt gut lesbar und dem prophetisch-anklagenden Register angemessen. „Schreit laut“ ist im Deutschen semantisch doppelt, da „schreit“ die Lautstärke bereits ausdrückt. „Hilferufe“ legt zudem einen Hilferuf stärker fest, als βοαί verlangt; „Rufe“ bewahrt die offene Bedeutung von Klage- bzw. Schreirufen.
  terminology: „Lohn“, „Arbeiter“, „Felder“, „Herrn Zebaot“ und „Ohren“ sind passend. Die Fußnote zu „Zebaot“ ist sachgerecht und hält die Übersetzungsalternative transparent. Die traditionelle Transkription wird nicht verändert.
  issues:
  - severity: medium
    issue: „denen ihr ihn vorenthalten habt“
    rationale: ὁ ἀφυστερημένος ἀφ’ ὑμῶν beschreibt unmittelbar den Lohn als den von den Angeredeten zurückgehaltenen Lohn. Die dative Ergänzung „denen“ ist zwar kontextuell naheliegend, aber im griechischen Wortlaut nicht ausgedrückt. „der von euch vorenthalten wurde“ bildet die Konstruktion genauer ab.
  - severity: low
    issue: „schreit laut“
    rationale: κράζει bedeutet bereits „schreit/ruft laut“. Das zusätzliche „laut“ ist nicht erforderlich und wirkt im Deutschen redundant.
  - severity: low
    issue: „Hilferufe“
    rationale: βοαί bezeichnet dringliche Rufe bzw. Schreie, ohne ausdrücklich den Inhalt als Hilferuf festzulegen. „Rufe“ erhält die semantische Offenheit besser.
  revised_text: 'Seht doch: Der Lohn der Arbeiter, die eure Felder abgeerntet haben, der von euch vorenthalten wurde, schreit; und die Rufe der Erntearbeiter sind bis zu den Ohren des Herrn Zebaot[a] gedrungen.'
  revised_footnotes:
