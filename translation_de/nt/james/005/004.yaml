id: JAS.5.4
reference: James 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: de
  text: 'Seht doch: Der Lohn der Arbeiter, die eure Felder abgeerntet haben, der von euch vorenthalten wurde, schreit; und die Rufe der Erntearbeiter sind bis zu den Ohren des Herrn Zebaot[a] gedrungen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herr der Heerscharen“. „Zebaot“ gibt den im griechischen Text bewahrten hebräischen Gottestitel wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Seht doch
  rationale: Die Wendung lenkt nachdrücklich die Aufmerksamkeit auf die folgende Anklage; „Seht doch“ ist modern, natürlich und bewahrt den emphatischen Impuls.
- source_word: μισθὸς
  choice: der Lohn
  rationale: Das griechische Substantiv steht im Singular und bezeichnet die den Arbeitern geschuldete Vergütung.
- source_word: ἐργατῶν
  choice: der Arbeiter
  rationale: Eine klare, allgemein verständliche Bezeichnung für die landwirtschaftlichen Arbeitskräfte.
- source_word: ἀμησάντων τὰς χώρας ὑμῶν
  choice: die eure Felder abgeerntet haben
  rationale: ἀμάω bezeichnet hier das Abernten; χώρα meint im Zusammenhang den bewirtschafteten Landbesitz beziehungsweise die Felder.
- source_word: ὁ ἀφυστερημένος ἀφ’ ὑμῶν
  choice: denen ihr ihn vorenthalten habt
  rationale: Die Form bezeichnet den von den Besitzern zurückgehaltenen Lohn. Die deutsche Relativkonstruktion macht den Bezug eindeutig und wahrt die direkte Anklage, ohne das stärker deutende „betrügen“ einzutragen.
- source_word: κράζει
  choice: schreit laut
  rationale: Bewahrt die anschauliche Personifikation des vorenthaltenen Lohns und gibt die Intensität des Verbs idiomatisch wieder.
- source_word: βοαὶ
  choice: Hilferufe
  rationale: Das Wort bezeichnet laute, dringliche Rufe; im Kontext sind es Rufe nach Hilfe und Recht.
- source_word: τῶν θερισάντων
  choice: der Erntearbeiter
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die die Ernte eingebracht haben. „Erntearbeiter“ ist knapp und in modernem Deutsch verständlich.
- source_word: εἰς τὰ ὦτα
  choice: bis zu den Ohren
  rationale: Bewahrt das konkrete biblische Bild, klingt im Deutschen jedoch natürlicher als eine starre Wiedergabe mit „in die Ohren“.
- source_word: Κυρίου Σαβαὼθ
  choice: des Herrn Zebaot
  rationale: Σαβαώθ ist die griechische Umschrift des hebräischen Gottestitels. Die im Deutschen biblisch etablierte Form „Zebaot“ bewahrt diesen Eigennamencharakter; seine Bedeutung wird in der Fußnote erläutert.
- source_word: εἰσεληλύθασιν
  choice: sind … gedrungen
  rationale: Das Perfekt bezeichnet ein erfolgtes Gelangen mit fortdauernder Geltung; „sind … gedrungen“ erhält sowohl das Bild als auch den resultativen Nachdruck.
theological_decisions:
- issue: Wiedergabe des Gottestitels Κυρίου Σαβαὼθ
  choice: Herr Zebaot
  alternative: Herr der Heerscharen
  rationale: Der griechische Text bewahrt mit Σαβαώθ die Umschrift des hebräischen Titels. „Herr Zebaot“ ist im Deutschen die traditionelle, erkennbare Form und lässt die alttestamentliche Anspielung sichtbar; die Bedeutungsübersetzung wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftigem prophetischem Anklang. Die Personifikation des vorenthaltenen Lohns und das konkrete Bild der Ohren Gottes bleiben erhalten; unnötig altertümliche Syntax wird vermieden.
