source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: de
  text: Habt also Geduld, Brüder[a], bis der Herr kommt[b]. Seht, der Bauer wartet auf die kostbare Frucht der Erde und bleibt ihretwegen geduldig, bis er den Früh- und Spätregen empfängt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann die ganze glaubende Gemeinschaft anreden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „bis zum Kommen“; das griechische Wort παρουσία kann auch „Ankunft“ oder „Anwesenheit“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich stehen hier nur „den frühen und den späten“; gemeint sind Früh- und Spätregen.
    reason: source_ambiguity
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: Habt Geduld / bleibt geduldig
  rationale: Die wiederholte Wortwurzel bezeichnet ausdauernde Geduld. Die deutsche Wiederaufnahme mit „Geduld“ und „geduldig“ erhält die Verbindung und klingt natürlich.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet in gegenwärtigem Standarddeutsch klar die Folgerung aus dem vorherigen Abschnitt.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird formal wiedergegeben; ihre mögliche inklusive Reichweite wird in einer Fußnote erläutert.
- source_word: παρουσίας τοῦ κυρίου
  choice: bis der Herr kommt
  rationale: Im eschatologischen Zusammenhang bezeichnet παρουσία das erwartete Kommen des Herrn. Die verbale Form ist im Deutschen natürlicher als „bis zur Ankunft“, ohne die Aussage dogmatisch einzuengen.
- source_word: ἰδοὺ
  choice: Seht
  rationale: Der Aufmerksamkeitsruf leitet das Beispiel ein; „Seht“ ist würdig, verständlich und weniger altertümlich als „Siehe“.
- source_word: γεωργὸς
  choice: Bauer
  rationale: Bezeichnet hier allgemein den Landbewirtschafter; „Bauer“ ist die natürliche deutsche Entsprechung.
- source_word: ἐκδέχεται
  choice: wartet auf
  rationale: Drückt anhaltendes, erwartungsvolles Warten aus und trägt das Geduldsmotiv.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: die kostbare Frucht der Erde
  rationale: Die bildhafte und relativ formnahe Wiedergabe bewahrt den Gedanken des hohen Wertes, ohne καρπός vorschnell auf eine bestimmte Ernte einzuengen.
- source_word: ἐπ’ αὐτῷ
  choice: ihretwegen
  rationale: Das Pronomen wird auf die „Frucht“ bezogen; „ihretwegen geduldig bleiben“ gibt die geduldige Sorge um ihr Reifen idiomatisch wieder.
- source_word: ἕως λάβῃ πρόϊμον καὶ ὄψιμον
  choice: bis Früh- und Spätregen kommen
  rationale: πρόϊμον und ὄψιμον bezeichnen elliptisch Früh- und Spätregen. Die unpersönliche deutsche Form vermeidet eine unnötige Festlegung des nicht ausdrücklich genannten Subjekts von λάβῃ.
theological_decisions:
- issue: Reichweite der Anrede ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die Form des griechischen Textes bleibt in der Hauptübersetzung sichtbar; zugleich kann die Anrede die gesamte glaubende Gemeinschaft einschließen, was die Fußnote offenlegt.
- issue: Bedeutung von παρουσία τοῦ κυρίου
  choice: bis der Herr kommt
  alternative: bis zur Gegenwart/Anwesenheit des Herrn
  rationale: Der Zusammenhang erwartet ein zukünftiges Eintreffen des Herrn. „Kommt“ gibt dies natürlich wieder, ohne ein detailliertes Endzeitschema in den Text einzutragen.
- issue: Subjekt von λάβῃ
  choice: 'unpersönlich: „bis Früh- und Spätregen kommen“'
  alternative: bis er/sie den Früh- und Spätregen empfängt
  rationale: Das griechische Subjekt ist nicht ausdrücklich genannt und kann im Satzbau unterschiedlich bezogen werden. Die gewählte Form bewahrt den Sachinhalt und vermeidet eine stille Entscheidung zugunsten des Bauern, der Frucht oder der Erde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. „Seht“ erhält den auffordernden Ton, ohne unnötig altertümlich zu wirken. Die Wiederholung des Geduldsmotivs und die landwirtschaftliche Bildsprache bleiben deutlich.
