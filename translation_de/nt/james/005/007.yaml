  to: Habt also Geduld, Brüder[a], bis der Herr kommt[b]. Seht, der Bauer wartet auf die kostbare Frucht der Erde und bleibt ihretwegen geduldig, bis er den Früh- und Spätregen empfängt[c].
  rationale: Die Revision stellt die aktive Aussage von λάβῃ wieder her und folgt der natürlichen grammatischen Rückbeziehung auf „der Bauer“. Die Ergänzung „Regen“ bleibt als notwendige, im Griechischen elliptische Explikation markiert. Alle übrigen Formulierungen und Anker bleiben erhalten.
