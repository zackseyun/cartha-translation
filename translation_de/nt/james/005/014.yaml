id: JAS.5.14
reference: James 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: de
  text: Ist jemand unter euch krank?[a] Er soll die Ältesten der Gemeinde zu sich rufen, und sie sollen über ihm beten und ihn im Namen des Herrn mit Öl salben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schwach“. Das griechische Verb kann Schwäche allgemeiner bezeichnen; hier ist wegen des Gebets, der Salbung mit Öl und des Heilungszusammenhangs im folgenden Vers wahrscheinlich Krankheit gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Die Salbung mit Öl kann medizinisch, symbolisch oder in beiderlei Sinn verstanden werden; der Text selbst legt ihre Funktion nicht näher fest.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: ist krank
  rationale: Der Zusammenhang mit Gebet, Salbung und der in Vers 15 genannten Aufrichtung spricht vorrangig für körperliche Krankheit; die allgemeinere Bedeutung „ist schwach“ bleibt in einer Fußnote erhalten.
- source_word: τις ἐν ὑμῖν
  choice: jemand unter euch
  rationale: Gibt die unbestimmte, auf die ganze angesprochene Gemeinschaft bezogene Form natürlich und ohne unnötige Geschlechtsspezifizierung wieder.
- source_word: προσκαλεσάσθω
  choice: soll er ... zu sich rufen
  rationale: Bewahrt den Aufforderungscharakter des Aorist-Imperativs und verdeutlicht idiomatisch, dass die Ältesten zum Kranken gerufen werden.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: die Ältesten der Gemeinde
  rationale: πρεσβύτεροι bezeichnet hier anerkannte Leitungspersonen; „Gemeinde“ gibt ἐκκλησία als örtliche christliche Gemeinschaft im Deutschen natürlich wieder.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: sie sollen über ihm beten
  rationale: Bewahrt sowohl den imperativischen Sinn als auch die räumlich beziehungsweise relational gefärbte Wendung ἐπ’ αὐτόν, ohne sie auf ein bloßes „für ihn“ zu reduzieren.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: ihn ... mit Öl salben
  rationale: Bezeichnet die Anwendung von Öl, ohne festzulegen, ob sie medizinisch, symbolisch, rituell oder in mehr als einer dieser Weisen verstanden wird.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: im Namen des Herrn
  rationale: Bewahrt die vertraute biblische Wendung und ihre Beziehung zur Person und Autorität des Herrn.
theological_decisions:
- issue: Bedeutungsumfang von ἀσθενεῖ
  choice: Körperliche Krankheit als Hauptsinn
  alternative: Allgemeine oder geistliche Schwäche
  rationale: Gebet, Ölsalbung und der Heilungszusammenhang im folgenden Vers begünstigen „krank“, ohne den weiteren Bedeutungsumfang des Verbs auszuschließen.
- issue: Funktion der Ölsalbung
  choice: Neutral als Salbung mit Öl wiedergeben
  alternative: Ausschließlich medizinische Anwendung, ausschließlich symbolischer Akt oder sakramentaler Ritus
  rationale: Der griechische Text nennt die Handlung, erklärt aber weder ihren Mechanismus noch ihren genauen theologischen Status.
- issue: Bezug von κυρίου
  choice: Titel „Herr“ ohne erklärende Erweiterung
  alternative: Explizite Ergänzung „Jesus“ oder Umschreibung als „Autorität des Herrn“
  rationale: Im christlichen Zusammenhang liegt ein Bezug auf Jesus nahe, doch die Übersetzung bewahrt die im Ausgangstext stehende Titulatur.
- issue: Verhältnis des Partizips ἀλείψαντες zum Gebet
  choice: Als begleitende Handlung mit „und“ natürlich koordinieren
  alternative: 'Streng untergeordnet: „wobei sie ihn ... salben“'
  rationale: Das Partizip bezeichnet eine mit dem Gebet verbundene Handlung; die deutsche Koordination ist idiomatisch und legt keine genaue zeitliche oder kausale Reihenfolge fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemeinde“ ist im deutschen kirchlichen Sprachgebrauch für die örtliche ἐκκλησία verständlich und weniger institutionell als „Kirche“. Die Aufforderungen werden mit „soll“ wiedergegeben; „zu sich rufen“ macht die Situation idiomatisch klar. Sämtliche Fußnotenmarker stehen im Haupttext.
