    text: 'Oder: „ein Mensch von gleicher Art wie wir“; auch: „ein Mensch mit denselben Empfindungen oder Leidenschaften wie wir“.'
    reason: 'Lexikalische Alternative: ὁμοιοπαθής kann die gemeinsame menschliche Beschaffenheit breit oder insbesondere gleiche Empfindungen und Leidenschaften bezeichnen.'
  revision_rationale: 'Die Revision beschränkt sich auf zwei sichere stilistisch-semantische Anpassungen: Das einfache „und“ entspricht dem griechischen καί, und „im Land“ verhindert die im Deutschen naheliegende Fehlassoziation von „auf dem Land“ mit einem Gegensatz zur Stadt. Bedeutung, Ambiguität und Fußnotenfunktion bleiben erhalten.'
