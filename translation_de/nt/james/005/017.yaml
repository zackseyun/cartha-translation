- from: Elija war ein Mensch wie wir[a], und er betete inständig, dass es nicht regnen sollte. Da regnete es drei Jahre und sechs Monate lang nicht auf dem Land.
  to: Elija war ein Mensch wie wir[a], und er betete inständig, dass es nicht regnen sollte. Und es regnete drei Jahre und sechs Monate lang nicht im Land.
  rationale: 'Die Revision beschränkt sich auf zwei sichere stilistisch-semantische Anpassungen: Das einfache „und“ entspricht dem griechischen καί, und „im Land“ verhindert die im Deutschen naheliegende Fehlassoziation von „auf dem Land“ mit einem Gegensatz zur Stadt. Bedeutung, Ambiguität und Fußnotenfunktion bleiben erhalten.'
