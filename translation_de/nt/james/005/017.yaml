source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: de
  text: Elija war ein Mensch wie wir[a], und er betete inständig, dass es nicht regnen sollte. Und es regnete drei Jahre und sechs Monate lang nicht im Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mensch von gleicher Art wie wir“; auch: „ein Mensch mit denselben Empfindungen oder Leidenschaften wie wir“.'
    reason: 'Lexikalische Alternative: ὁμοιοπαθής kann die gemeinsame menschliche Beschaffenheit breit oder insbesondere gleiche Empfindungen und Leidenschaften bezeichnen.'
lexical_decisions:
- source_word: Ἠλίας
  choice: Elija
  rationale: Die im modernen deutschen Bibelgebrauch übliche Namensform des Propheten.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: Bezeichnet Elija als gewöhnlichen Menschen und gibt den Bezug auf seine gemeinsame menschliche Lebenswirklichkeit mit den Lesenden natürlich wieder.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: wie wir
  rationale: Die knappe deutsche Wendung bewahrt den breiten Sinn gleicher menschlicher Beschaffenheit und Erfahrung, ohne ihn auf Gefühle oder Leidenschaften einzuengen.
- source_word: προσευχῇ προσηύξατο
  choice: er betete inständig
  rationale: Die Verbindung des Substantivs mit dem verwandten Verb verstärkt den Gebetsvorgang; „inständig“ gibt diese emphatische Kraft in natürlichem Deutsch wieder.
- source_word: τοῦ μὴ βρέξαι
  choice: dass es nicht regnen sollte
  rationale: Gibt Inhalt beziehungsweise Ziel des Gebets idiomatisch wieder, ohne die genaue syntaktische Funktion unnötig festzulegen.
- source_word: οὐκ ἔβρεξεν
  choice: Da regnete es … nicht
  rationale: Die unpersönliche deutsche Form entspricht dem griechischen Ausdruck; „Da“ macht den erzählerischen Fortgang natürlich deutlich, ohne eine stärkere Kausalbehauptung einzuführen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf dem Land
  rationale: Im Zusammenhang der Elija-Erzählung bezeichnet γῆ am ehesten das betroffene Land; „Erde“ könnte unnötig global verstanden werden.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: drei Jahre und sechs Monate lang
  rationale: Die Zeitdauer wird im Deutschen natürlich durch „lang“ ausgedrückt.
theological_decisions:
- issue: Bedeutung von ὁμοιοπαθὴς für Elijas Menschsein
  choice: Elija wird als Mensch wie die Lesenden dargestellt, der ihre menschliche Beschaffenheit und Lebenswirklichkeit teilt.
  alternative: Elija hatte dieselben Gefühle oder Leidenschaften wie wir.
  rationale: Der Zusammenhang ermutigt zum Gebet, indem er Elijas gemeinsames Menschsein hervorhebt. Die Hauptfassung hält den Sinn weit; die Fußnote bewahrt die möglichen engeren Nuancen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist flüssig und allgemein verständlich; die Wiederholung des Regnens bewahrt den Nachdruck des griechischen Textes.
