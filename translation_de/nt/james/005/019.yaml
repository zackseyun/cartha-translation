    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Meine Brüder und Schwestern
  rationale: Die maskuline griechische Anrede bezeichnet hier sehr wahrscheinlich die gesamte Gemeinschaft. Die inklusive Wiedergabe ist im heutigen Deutsch natürlich; die Form des Griechischen wird in der Fußnote erläutert.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: wenn jemand unter euch
  rationale: Bewahrt den konditionalen und unbestimmten Sinn des singularischen τις in natürlichem Deutsch.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: von der Wahrheit abirrt
  rationale: πλανηθῇ kann sowohl ein Abirren als auch ein Irregeführtwerden ausdrücken. „abirrt“ gibt die Abwendung idiomatisch wieder, ohne die Ursache festzulegen.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: und ein anderer ihn zurückführt
  rationale: Das zweite τις bezeichnet eine weitere, nicht näher bestimmte Person. „zurückführt“ bewahrt die Rückkehrbewegung von ἐπιστρέφω und passt zum folgenden Vers.
theological_decisions:
- issue: Inklusiver Umfang der Anrede Ἀδελφοί μου
  choice: Meine Brüder und Schwestern
  alternative: Meine Brüder
  rationale: Die grammatisch maskuline Pluralanrede kann die gesamte Glaubensgemeinschaft einschließen. Die inklusive Bedeutung wird im Haupttext verständlich gemacht, während die griechische Form in der Fußnote transparent bleibt.
- issue: Nuance des passiven πλανηθῇ
  choice: abirrt
  alternative: irregeführt wird
  rationale: Die Form lässt sowohl ein Sich-Verirren als auch ein Irregeführtwerden zu. Der Haupttext legt die äußere Verursachung nicht fest; die passive/dezeptive Möglichkeit wird in der Fußnote bewahrt.
- issue: Bezug des zweiten τις
  choice: ein anderer
  alternative: jemand
  rationale: Gemeint ist jemand, der die zuerst genannte Person zurückführt. „ein anderer“ macht die Rollen im Deutschen deutlich, ohne die Person näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Satzanfang mit Komma offen, da der Gedanke in Jakobus 5,20 fortgeführt wird. Die Personenbezüge im Singular bleiben erhalten.
