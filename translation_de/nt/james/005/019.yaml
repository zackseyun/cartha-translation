  text: Meine Brüder[a], wenn jemand unter euch von der Wahrheit abirrt[b] und jemand ihn zurückführt[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische maskuline Pluralanrede „meine Brüder“ kann die ganze Gemeinschaft, also Männer und Frauen, einschließen.
    reason: lexical_alternative
  - marker: b
    text: Oder „von der Wahrheit weggeführt wird“ beziehungsweise „von der Wahrheit abkommt“.
