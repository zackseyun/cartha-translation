  source_fidelity: Der Entwurf gibt Πρὸ πάντων, die Anrede, das Verbot und die abschließende Warnung insgesamt treffend wieder. Bei μήτε ἄλλον τινὰ ὅρκον ist „noch irgendeinen anderen Eid“ jedoch syntaktisch nicht parallel zu „beim Himmel/beim Erde schwören“ und kann bedeuten, man solle keinen Eid als Objekt schwören. Das Griechische setzt die Präposition zwar elliptisch fort, meint aber weitere Schwurgegenstände bzw. Schwurformeln. „noch bei irgendeinem anderen Eid“ bildet dies im Deutschen klar und parallel ab.
  naturalness: Modernes, würdiges Deutsch. Die revidierte dreigliedrige Folge „weder beim Himmel noch bei der Erde noch bei irgendeinem anderen Eid“ ist idiomatisch und beseitigt den kleinen Konstruktionsbruch. Die Satzfolge und der prägnante Klang der Ja-Nein-Formel bleiben gewahrt.
  terminology: „schwört“, „Eid“, „Gericht“ und „Verurteilung“ sind sachgerecht. „Gericht“ bewahrt die weitere Bedeutung von κρίσις; die Fußnote bietet die engere Alternative ohne sie dem Haupttext aufzuzwingen. Die Fußnote zu „Brüder“ erklärt die wahrscheinlich gemeinte gesamte Gemeinschaft angemessen.
