source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: de
  text: Vor allem aber, meine Brüder[a], schwört nicht – weder beim Himmel noch bei der Erde noch bei irgendeinem anderen Eid. Euer Ja soll vielmehr ein Ja sein und euer Nein ein Nein, damit ihr nicht unter das Gericht fallt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Brüder und Schwestern«; das griechische Wort lautet wörtlich »Brüder« und spricht hier wahrscheinlich die ganze Glaubensgemeinschaft an.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »damit ihr nicht der Verurteilung anheimfallt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: Vor allem
  rationale: Die geläufige deutsche Wendung gibt den Vorrang bzw. besonderen Nachdruck der Ermahnung natürlich wieder, ohne das Griechische unnötig wörtlich als „vor allen Dingen“ abzubilden.
- source_word: ἀδελφοί μου
  choice: meine Brüder
  rationale: Die grammatisch maskuline Anrede wird formal bewahrt. Da sie wahrscheinlich die gesamte Glaubensgemeinschaft einschließt, wird diese Reichweite in einer Fußnote erläutert.
- source_word: μὴ ὀμνύετε
  choice: schwört nicht
  rationale: Die knappe Form bezeichnet hier, wie die folgenden Beispiele und ὅρκον zeigen, das Schwören von Eiden und nicht den Gebrauch von Schimpfwörtern.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: weder beim Himmel noch bei der Erde
  rationale: „Bei etwas schwören“ ist die natürliche deutsche Konstruktion und bewahrt die paarige Verneinung des griechischen Textes.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: noch irgendeinen anderen Eid
  rationale: Die umfassende Formulierung wird knapp wiedergegeben. Der syntaktische Wechsel vom Schwören „bei“ etwas zum Eid ist auch im Griechischen angelegt.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Euer Ja soll vielmehr ein Ja sein und euer Nein ein Nein
  rationale: Die sprichwortartige Wiederholung und der Kontrast zum Schwören bleiben erhalten. „Vielmehr“ gibt das kontrastive δέ im Deutschen idiomatisch wieder.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: damit ihr nicht unter das Gericht fallt
  rationale: Die Wiedergabe bewahrt sowohl die Metapher von πίπτω als auch den breiteren Sinn von κρίσις, ohne ihn vorschnell auf Verurteilung einzuengen.
theological_decisions:
- issue: Bedeutung von κρίσις
  choice: Gericht
  alternative: Verurteilung
  rationale: κρίσις bezeichnet zunächst Gericht bzw. Beurteilung und verlangt nicht zwingend die engere Bedeutung einer verurteilenden Entscheidung. Die offenere Formulierung bewahrt die theologische Spannung.
- issue: Reichweite der Anrede ἀδελφοί
  choice: meine Brüder
  alternative: meine Brüder und Schwestern
  rationale: Der Haupttext wahrt die maskuline Form des griechischen Ausdrucks; eine Fußnote macht deutlich, dass wahrscheinlich die ganze, gemischte Glaubensgemeinschaft angesprochen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, mahnender Satzführung. Die traditionelle Eidsprache bleibt verständlich; die Wiederholung von Ja und Nein bewahrt den einprägsamen Charakter des Originals.
