source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: de
  text: Klagt nicht übereinander, Brüder und Schwestern,[a] damit ihr nicht gerichtet werdet. Seht, der Richter steht vor den Türen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier die grammatisch männliche Anrede „Brüder“; sie kann in diesem Zusammenhang die ganze Glaubensgemeinschaft einschließlich der Frauen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: stöhnt
  rationale: Das Verb bezeichnet grundsätzlich Seufzen oder Stöhnen. Mit κατ’ ἀλλήλων erhält es eine gegen andere gerichtete, missbilligende Bedeutung. „Stöhnt nicht übereinander“ bewahrt das Bild des griechischen Ausdrucks, ohne es auf offen ausgesprochenes Murren zu verengen.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der grammatisch maskuline Plural kann in diesem gemeindlichen Kontext die gesamte Glaubensgemeinschaft einschließlich der Frauen anreden. Die ausgeschriebene Paarform gibt den gemeinten Adressatenkreis im heutigen Deutsch klar wieder.
- source_word: κατ’ ἀλλήλων
  choice: übereinander
  rationale: κατά mit Genitiv kennzeichnet hier die gegen andere gerichtete Haltung. In Verbindung mit „stöhnen“ ist „übereinander“ im Deutschen natürlicher als „gegeneinander“, während der vorwurfsvolle zwischenmenschliche Bezug erhalten bleibt.
- source_word: κριθῆτε
  choice: gerichtet werdet
  rationale: Die Passivform von κρίνω bezeichnet das Gericht, ohne dessen Ausgang ausdrücklich als Verurteilung festzulegen. Die damit-Konstruktion gibt ἵνα μή angemessen wieder.
- source_word: κριτὴς
  choice: der Richter
  rationale: Die bestimmte Bezeichnung weist im Kontext auf den endzeitlichen göttlichen Richter. Die Übersetzung benennt den Richter nicht näher und bewahrt damit die Offenheit des griechischen Textes.
- source_word: πρὸ τῶν θυρῶν
  choice: vor den Türen
  rationale: Die Formulierung bewahrt sowohl die Präposition πρό als auch den Plural θυρῶν und vermittelt zugleich die unmittelbare Nähe des Richters.
- source_word: ἕστηκεν
  choice: steht
  rationale: Das Perfekt beschreibt einen eingetretenen und fortbestehenden Zustand. Das deutsche Präsens „steht“ gibt diesen gegenwärtigen Zustand knapp und anschaulich wieder.
theological_decisions:
- issue: Bezug von „der Richter“
  choice: Der endzeitliche göttliche Richter, im Zusammenhang am ehesten der Herr
  alternative: Gott allgemein als Richter
  rationale: Der Vers spricht bewusst nur vom „Richter“. Die Übersetzung ergänzt weder „Gott“ noch „Christus“ und erhält so die theologische Spannung, während der Kontext von der nahen Ankunft des Herrn die endzeitliche Dimension erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stöhnt nicht übereinander“ ist bewusst quellennah und erhält das körperlich-emotionale Bild des Originals; „murrt nicht übereinander“ wäre idiomatischer, würde die Bedeutung jedoch stärker auf hörbare Beschwerde festlegen. Der Plural „Türen“ wird gegen die im Deutschen geläufigere Einzahl bewahrt.
