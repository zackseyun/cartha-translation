id: JAS.5.6
reference: James 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: de
  text: Ihr habt den Gerechten[a] verurteilt, ihr habt ihn ermordet. Leistet er euch nicht Widerstand?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Gerechte“ kann hier einen beispielhaften gerechten Menschen bezeichnen, der von den Reichen unterdrückt wird. Möglich ist auch ein Anklang an Jesus als „den Gerechten“.
    reason: alternative_reading
  - marker: b
    text: 'Die kurze griechische Klausel kann auch als Aussage verstanden und wiedergegeben werden: „Er leistet euch keinen Widerstand.“'
    reason: punctuation_and_interpretive_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: ihr habt … verurteilt
  rationale: Das Verb bezeichnet ein Verurteilen mit rechtlichem beziehungsweise richterlichem Beiklang. Das deutsche Perfekt gibt den Aorist in natürlicher gegenwärtiger Standardsprache wieder und lässt die Anklage als vollzogene Tat hervortreten.
- source_word: ἐφονεύσατε
  choice: ihr habt ihn ermordet
  rationale: φονεύω bezeichnet schuldhaftes Töten und trägt hier die starke moralische Anklage „ermorden“. Die Wiederholung von „ihr habt“ bewahrt den eindringlichen, anklagenden Rhythmus der beiden Aoristformen.
- source_word: τὸν δίκαιον
  choice: den Gerechten
  rationale: Der substantivierte maskuline Singular wird direkt und knapp als „den Gerechten“ wiedergegeben. Die Form kann einen repräsentativen gerechten Menschen bezeichnen, ohne einen möglichen titularen Anklang auszuschließen.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Leistet er euch nicht Widerstand?
  rationale: ἀντιτάσσομαι bedeutet, sich entgegenzustellen oder Widerstand zu leisten. Die Frageform folgt der Interpunktion des SBLGNT und bewahrt die Spannung der griechischen Formulierung, statt sie im Haupttext in eine Aussage umzudeuten.
theological_decisions:
- issue: Bezug von „dem Gerechten“
  choice: Die Übersetzung lässt offen, ob ein repräsentativer gerechter Mensch oder möglicherweise Jesus als „der Gerechte“ gemeint ist.
  alternative: Die Wendung ausdrücklich entweder auf einen unterdrückten Armen oder ausschließlich auf Jesus beziehen.
  rationale: Der unmittelbare Zusammenhang handelt von der Unterdrückung Gerechter durch Reiche; zugleich kann die singularische Bezeichnung einen christologischen Anklang haben. Der Haupttext sollte diese Spannung nicht auflösen.
- issue: Aussagekraft des letzten Satzes
  choice: 'Wiedergabe als Frage entsprechend der Interpunktion des SBLGNT: „Leistet er euch nicht Widerstand?“'
  alternative: 'Aussagesatz: „Er leistet euch keinen Widerstand.“'
  rationale: Die griechischen Handschriften überliefern keine ursprüngliche moderne Interpunktion, und die knappe Klausel kann im Zusammenhang auch als Feststellung verstanden werden. Da die angegebene Ausgangsausgabe sie als Frage setzt, steht diese Form im Haupttext; die verbreitete deklarative Deutung wird in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Formulierung „ihr habt“ erhält den scharfen Anklagerhythmus. „Den Gerechten“ bleibt bewusst knapp und deutungsoffen; die Frageform folgt der vorgegebenen griechischen Ausgabe.
