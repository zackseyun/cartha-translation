id: JAS.5.10
reference: James 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: de
  text: Brüder[a], nehmt euch die Propheten, die im Namen des Herrn gesprochen haben, zum Vorbild im Leiden und in der Geduld.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ gibt den maskulinen Plural ἀδελφοί wieder; im Zusammenhang spricht Jakobus wahrscheinlich die ganze Glaubensgemeinschaft an, einschließlich der Frauen.
    reason: lexikalische Alternative und Erklärung der umfassenden Anrede
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: Vorbild
  rationale: Das Wort bezeichnet ein Beispiel oder Muster, an dem man sich orientieren soll. „Vorbild“ gibt den auffordernden und nachahmungsbezogenen Sinn im Deutschen natürlich wieder.
- source_word: λάβετε
  choice: nehmt euch … zum
  rationale: Der Aoristimperativ von λαμβάνω bedeutet wörtlich „nehmt“. Die deutsche Wendung „sich jemanden zum Vorbild nehmen“ bildet die Verbindung mit ὑπόδειγμα idiomatisch und zugleich eng am griechischen Satzbau ab.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der griechische Vokativ ist grammatisch maskulin. Die wahrscheinliche Einbeziehung der gesamten Glaubensgemeinschaft wird in einer Fußnote erläutert, ohne die Form des Ausgangstextes im Haupttext zu neutralisieren.
- source_word: κακοπαθίας
  choice: Leiden
  rationale: κακοπαθία bezeichnet das Erleiden von Not, Bedrängnis oder Ungemach. „Leiden“ ist eine breite, verständliche und sachlich passende Wiedergabe.
- source_word: μακροθυμίας
  choice: Geduld
  rationale: μακροθυμία bezeichnet langes, standhaftes Ausharren gegenüber schwierigen Umständen oder Menschen. „Geduld“ ist die natürliche moderne Entsprechung.
- source_word: τοὺς προφήτας
  choice: die Propheten
  rationale: Die Propheten sind das Akkusativobjekt und werden als nachzuahmendes Vorbild genannt.
- source_word: ἐλάλησαν
  choice: gesprochen haben
  rationale: λαλέω ist das gewöhnliche Verb für „sprechen“. Das Perfekt im deutschen Relativsatz gibt den griechischen Aorist hier natürlich wieder, ohne einen stärkeren Verkündigungsbegriff einzutragen.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: im Namen des Herrn
  rationale: Die feste biblische Wendung drückt Handeln in Vertretung und Autorität des Herrn aus. Sie bleibt im Haupttext erhalten, statt erklärend umschrieben zu werden.
theological_decisions:
- issue: Maskuliner Vokativ ἀδελφοί als Anrede der Gemeinde
  choice: „Brüder“ im Haupttext mit Hinweis auf die wahrscheinlich umfassende Anrede in einer Fußnote
  alternative: „Brüder und Schwestern“ oder „Geschwister“
  rationale: Die grammatisch maskuline Form wird sichtbar bewahrt. Zugleich erläutert die Fußnote, dass Jakobus im Zusammenhang sehr wahrscheinlich die gesamte glaubende Gemeinschaft einschließlich der Frauen anspricht.
- issue: Beziehung der Propheten zu ὑπόδειγμα sowie zu den beiden Genitiven
  choice: Die Propheten werden „zum Vorbild im Leiden und in der Geduld“ genommen.
  alternative: „als Beispiel dafür, Leid zu ertragen und geduldig zu bleiben“
  rationale: 'Die gewählte Fassung bewahrt die beiden substantivischen Begriffe und ihre Spannung: Die Propheten sind hinsichtlich des Leidens und der Geduld exemplarisch. Die Alternative wäre flüssig, würde aber „Leiden“ stärker als aktives Ertragen ausdeuten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „sich jemanden zum Vorbild nehmen“ sorgt für natürliche Lesbarkeit; „im Leiden und in der Geduld“ bewahrt zugleich die knappe Parallelität und die begriffliche Offenheit des griechischen Textes.
