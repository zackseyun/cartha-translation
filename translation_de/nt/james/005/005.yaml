id: JAS.5.5
reference: James 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: de
  text: Ihr habt auf der Erde im Luxus gelebt und in üppigem Genuss geschwelgt. Ihr habt eure Herzen gemästet am Tag des Schlachtens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für den Tag des Schlachtens«. Das Bild erinnert an Tiere, die vor dem Schlachten gemästet werden, und deutet wahrscheinlich auf bevorstehendes Gericht hin.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: im Luxus gelebt
  rationale: Das Verb bezeichnet ein üppiges, genussorientiertes Leben. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den vorwurfsvollen Ton.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: γῆ kann »Erde« oder »Land« bedeuten; im Zusammenhang der umfassenden Anklage passt der weitere Sinn »Erde«.
- source_word: ἐσπαταλήσατε
  choice: euch Ausschweifungen hingegeben
  rationale: Das Verb steigert den vorherigen Gedanken und bezeichnet selbstgefälliges, verschwenderisches Genussleben. Die gewählte Wendung gibt den deutlichen Tadel wieder, ohne archaisch zu klingen.
- source_word: ἐθρέψατε
  choice: gemästet
  rationale: Obwohl τρέφω grundsätzlich »ernähren« oder »nähren« bedeutet, legt das anschließende Bild des Schlachtens hier das Mästen von Tieren nahe.
- source_word: τὰς καρδίας ὑμῶν
  choice: eure Herzen
  rationale: Die wörtliche Wiedergabe erhält das biblische Menschenbild und die rhetorische Kraft der Metapher.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: am Tag des Schlachtens
  rationale: Die Präposition ἐν wird räumlich-zeitlich eng mit »am« wiedergegeben. »Des Schlachtens« bewahrt die schroffe Bildsprache und lässt offen, ob ein bestimmter Gerichtstag oder allgemeiner ein Schlachttag gemeint ist.
theological_decisions:
- issue: Bildliche Bedeutung des »Tages des Schlachtens«
  choice: Das Bild drohenden Schlachtens beziehungsweise Gerichts bleibt im Haupttext unausgedeutet.
  alternative: Die Wendung ausdrücklich als Tag des göttlichen Gerichts wiedergeben.
  rationale: Der Zusammenhang legt Gericht nahe, doch der griechische Text nennt es nicht ausdrücklich. Die konkrete, spannungsvolle Metapher soll daher stehen bleiben.
- issue: Zeitliche oder finale Deutung von ἐν ἡμέρᾳ σφαγῆς
  choice: 'zeitlich: »am Tag des Schlachtens«'
  alternative: 'final: »für den Tag des Schlachtens«'
  rationale: ἐν bezeichnet zunächst den zeitlichen Rahmen. Zugleich kann das Mastbild eine Vorbereitung auf das Schlachten nahelegen; diese mögliche finale Nuance wird in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede und kräftiger prophetischer Bildsprache. »Ausschweifungen« ist bewusst deutlicher als bloßes »Genießen«, während »gemästet« die Ironie des griechischen Zusammenhangs erhält.
