id: JAS.5.16
reference: James 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: de
  text: Bekennt daher einander eure Sünden und betet füreinander, damit ihr geheilt werdet. Das Gebet eines gerechten Menschen hat große Kraft, wenn es zur Wirkung kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Flehen eines gerechten Menschen vermag viel, wenn es wirksam ist.«'
    reason: Lexikalische und syntaktische Alternative für δέησις, πολὺ ἰσχύει und ἐνεργουμένη.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Bekennt
  rationale: Der mediale Imperativ bezeichnet ein offenes Eingestehen; zusammen mit »Sünden« ist »bekennen« die natürliche und sachlich genaue deutsche Wiedergabe, ohne einen bestimmten sakramentalen Rahmen vorauszusetzen.
- source_word: οὖν
  choice: also
  rationale: »Also« stellt in natürlichem modernem Deutsch den folgernden Zusammenhang mit den vorausgehenden Aussagen über Gebet, Sünde und Wiederherstellung her.
- source_word: ἀλλήλοις
  choice: einander
  rationale: Der reziproke Dativ verlangt ausdrücklich Gegenseitigkeit.
- source_word: τὰς ἁμαρτίας
  choice: eure Sünden
  rationale: Im Zusammenhang des gegenseitigen Bekennens ist das im Deutschen ergänzte Possessivpronomen idiomatisch; »Sünden« gibt ἁμαρτίας unmittelbar wieder.
- source_word: εὔχεσθε ὑπὲρ ἀλλήλων
  choice: betet füreinander
  rationale: Die Formulierung gibt sowohl den Imperativ als auch den fürbittenden Sinn von ὑπέρ mit Genitiv knapp und natürlich wieder.
- source_word: ὅπως ἰαθῆτε
  choice: damit ihr geheilt werdet
  rationale: »Damit« wahrt den Zweck- beziehungsweise Ergebnisbezug; »geheilt« lässt entsprechend dem Kontext körperliche wie weiter gefasste Wiederherstellung offen.
- source_word: πολὺ ἰσχύει
  choice: vermag viel
  rationale: Die geläufige deutsche Wendung drückt die große Kraft beziehungsweise Wirksamkeit des Gebets aus, ohne den möglichen Erfolg näher festzulegen.
- source_word: δέησις
  choice: Gebet
  rationale: »Gebet« ist hier verständlich und kontextgerecht; die spezifischere Bedeutung »Flehen« wird in der Fußnote bewahrt.
- source_word: δικαίου
  choice: eines gerechten Menschen
  rationale: Das substantivierte maskuline Adjektiv ist in diesem sentenzartigen Satz generisch; »Mensch« gibt diesen Bezug geschlechtsgerecht und quellennah wieder.
- source_word: ἐνεργουμένη
  choice: wenn es wirksam ist
  rationale: Die Formulierung bewahrt die schwierige mediale beziehungsweise passive Nuance des Partizips und vermeidet die umstrittene Festlegung darauf, wodurch oder von wem das Gebet wirksam gemacht wird.
theological_decisions:
- issue: Gegenseitiges Bekennen oder ausschließlich sakramentale Beichte vor Amtsträgern
  choice: gegenseitiges Bekennen
  alternative: durch ordinierte Amtsträger vermitteltes Bekenntnis
  rationale: Das reziproke ἀλλήλοις bezeichnet ausdrücklich das gegenseitige Handeln in der angesprochenen Gemeinschaft. Die Übersetzung legt darüber hinaus keine bestimmte kirchliche Praxis fest.
- issue: Reichweite der Heilung in ἰαθῆτε
  choice: »geheilt«, mit bewusst offenem Bedeutungsumfang
  alternative: ausschließlich körperlich oder ausschließlich geistlich geheilt
  rationale: Der unmittelbare Zusammenhang handelt von Krankheit, bezieht aber auch Sünden ein. Die offene Wiedergabe erhält diese Spannung.
- issue: Geschlechtsbezug von δικαίου
  choice: »eines gerechten Menschen« als generische Formulierung
  alternative: »eines gerechten Mannes«
  rationale: Das maskuline Singularadjektiv wird substantivisch und allgemein gebraucht; die Übersetzung soll kein biologisches Geschlecht behaupten, das der Aussage nicht wesentlich ist.
- issue: Deutung von ἐνεργουμένη
  choice: »wenn es wirksam ist«
  alternative: »wenn es wirkt« oder »wenn es wirksam gemacht wird«
  rationale: Die gewählte Form erhält die Aussage über die operative Kraft des Gebets, ohne die grammatisch mögliche mediale oder passive Deutung vorschnell theologisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Imperative sind gemeinschaftlich und unmittelbar. »Füreinander« und »einander« halten die Gegenseitigkeit sichtbar; konfessionell geprägte Fachsprache wird vermieden.
