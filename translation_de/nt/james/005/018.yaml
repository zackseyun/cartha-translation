id: JAS.5.18
reference: James 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: de
  text: Und er betete wieder, und der Himmel gab Regen, und die Erde brachte ihre Frucht hervor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb bezeichnet die Wiederholung des Gebets und wird im Deutschen knapp und natürlich mit „wieder“ wiedergegeben.
- source_word: προσηύξατο
  choice: er betete
  rationale: Der Aorist von προσεύχομαι bedeutet schlicht „er betete“. Eine Verstärkung wie „inständig“ gehört zu Vers 17 und wird hier nicht ergänzt.
- source_word: ὁ οὐρανὸς
  choice: der Himmel
  rationale: Im Wetterzusammenhang bezeichnet οὐρανός den sichtbaren Himmel. Das deutsche „Himmel“ deckt diese Bedeutung idiomatisch ab, ohne dass eine erklärende Alternative nötig ist.
- source_word: ὑετὸν ἔδωκεν
  choice: gab Regen
  rationale: Die Formulierung bewahrt das ausdrückliche Verb δίδωμι („geben“) und die bildhafte Parallelität des griechischen Satzes.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: „Erde“ entspricht γῆ und erhält die Parallelität zwischen Himmel und Erde; zugleich ist der landwirtschaftliche Bezug im Kontext verständlich.
- source_word: ἐβλάστησεν
  choice: brachte … hervor
  rationale: βλαστάνω bezeichnet das Hervorsprießen beziehungsweise Hervorbringen von Pflanzenwuchs. Mit „Frucht“ als Objekt ist „brachte … hervor“ natürlich und quellennah.
- source_word: τὸν καρπὸν αὐτῆς
  choice: ihre Frucht
  rationale: καρπός bezeichnet hier den Ertrag der Erde. „Ihre Frucht“ erhält die Singularform und die Possessivbeziehung des griechischen Textes.
theological_decisions:
- issue: Elijas Gebet und die göttliche Antwort
  choice: 'Die beobachtbare Folge des Gebets wird in der Ausdrucksweise des Ausgangstextes wiedergegeben: Der Himmel gibt Regen und die Erde bringt Frucht hervor.'
  alternative: Ausdrücklich formulieren, dass Gott den Regen sandte.
  rationale: Der Zusammenhang legt Gottes Handeln nahe, doch der Vers selbst nennt Gott hier nicht als grammatisches Subjekt. Die Übersetzung ergänzt diese theologische Erklärung daher nicht.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die koordinierte Satzstruktur mit zweimaligem „und“ bewahrt den rhythmischen Aufbau des griechischen Textes.
