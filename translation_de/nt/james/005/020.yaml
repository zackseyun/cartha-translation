id: JAS.5.20
reference: James 5:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: de
  text: 'Der soll wissen: Wer einen Sünder von seinem Irrweg zurückführt, wird seine Seele[a][b] vor dem Tod retten und eine Menge Sünden zudecken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird sein Leben vor dem Tod retten“. Das griechische Wort kann „Seele“ oder „Leben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Seine“ kann sich auf den Sünder beziehen, der zurückgeführt wird; manche beziehen es auf den, der ihn zurückführt.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: Der soll wissen
  rationale: Der Imperativ der dritten Person Singular wird als direkte Aufforderung wiedergegeben und nimmt die in Vers 19–20 angesprochene Person auf.
- source_word: ὁ ἐπιστρέψας
  choice: wer … zurückführt
  rationale: Das substantivierte Partizip hat allgemeinen Sinn. „Zurückführt“ bringt im Zusammenhang die Wiederherstellung eines Abgeirrten zum Ausdruck, ohne einen späteren theologischen Fachbegriff einzutragen.
- source_word: ἁμαρτωλὸν
  choice: einen Sünder
  rationale: Die artikellose Form bezeichnet allgemein einen Menschen als Sünder; der unbestimmte Artikel ist im Deutschen natürlich.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: vom Irrweg
  rationale: „Irrweg“ bündelt die Begriffe πλάνη und ὁδός idiomatisch, bewahrt sowohl den Gedanken des Irrtums als auch das Wegbild und bezeichnet hier die verfehlte Lebensführung.
- source_word: σώσει
  choice: wird … retten
  rationale: Die Zukunftsform wird direkt wiedergegeben; „retten“ bewahrt die volle lebensbezogene und theologische Tragweite von σῴζω.
- source_word: ψυχὴν αὐτοῦ
  choice: seine Seele
  rationale: „Seele“ gibt ψυχή formal wieder, während eine Fußnote die ebenfalls mögliche Bedeutung „Leben“ nennt. Das Possessivpronomen lässt den griechischen Bezugsspielraum bestehen und wird in einer weiteren Fußnote erläutert.
- source_word: ἐκ θανάτου
  choice: vor dem Tod
  rationale: Im Deutschen ist „vor dem Tod retten“ die natürliche Entsprechung zu σώσει … ἐκ θανάτου. Die Art des Todes wird nicht näher festgelegt.
- source_word: καλύψει
  choice: wird … zudecken
  rationale: „Zudecken“ bewahrt das biblische Bild von καλύπτω, ohne es vorschnell als Vergebung, Verbergen oder Nichtanrechnen auszudeuten.
- source_word: πλῆθος ἁμαρτιῶν
  choice: eine Menge Sünden
  rationale: Die Formulierung gibt den kollektiven Ausdruck verständlich und mit seinem quantitativen Nachdruck wieder.
theological_decisions:
- issue: Bezugswort von αὐτοῦ in ψυχὴν αὐτοῦ
  choice: Das Pronomen wird im Haupttext als „seine“ wiedergegeben, ohne den Bezug ausdrücklich festzulegen.
  alternative: Gemeint sein kann die Seele des zurückgeführten Sünders oder, nach einer weniger wahrscheinlichen Deutung, die Seele dessen, der ihn zurückführt.
  rationale: Der griechische Wortlaut erlaubt beide Bezüge. Die Übersetzung entscheidet die theologische Spannung nicht stillschweigend, sondern dokumentiert sie in einer Fußnote.
- issue: Bedeutung von ψυχή und θάνατος
  choice: „Seele“ und „Tod“ bleiben als weite Begriffe erhalten.
  alternative: „Leben … vor dem Tod“ oder eine ausdrückliche Deutung als geistlicher Tod.
  rationale: Der Vers kann Lebensrettung, geistliche Rettung oder beides umfassen. Der Ausgangstext legt die Art des Todes nicht ausdrücklich fest.
- issue: Bildsprache von καλύψει ἁμαρτίας
  choice: „Sünden zudecken“
  alternative: „Sünden vergeben“, „Sünden verbergen“ oder „bewirken, dass Sünden nicht angerechnet werden“.
  rationale: Das Bild bleibt stehen, damit seine alttestamentlich-jüdische Resonanz erhalten wird und keine bestimmte Erklärung des Zusammenhangs zwischen Umkehr und Sündenvergebung in den Text eingetragen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, klare Satzführung; „Irrweg“, „Seele“, „Tod“ und „Sünden zudecken“ erhalten die Weg-, Rettungs- und Verhüllungsbilder des griechischen Textes. Die Fußnotenmarker stehen unmittelbar bei der mehrdeutigen Wendung.
