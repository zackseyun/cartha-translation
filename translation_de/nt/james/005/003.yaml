  source_fidelity: 'Der Entwurf gibt die zentralen Elemente des griechischen Textes zuverlässig wieder: den resultativen Perfektzustand von κατίωται, den korrosiven »Rost« (ἰός), die forensische Funktion als Zeugnis gegen die Angeredeten, das drastische Bild vom Verzehren des Fleisches sowie das Anhäufen von Schätzen in den letzten Tagen. Die plurale deutsche Form »sind verrostet« ist bei dem zusammengesetzten Subjekt idiomatisch, auch wenn der griechische Verbgebrauch formal Singular aufweist.'
  naturalness: Modernes Standarddeutsch und ein angemessen würdiger, bildhafter Registerton. »Als Zeugnis gegen euch dienen« und »euer Fleisch wie Feuer verzehren« sind verständlich und bewahren die Personifikation und Schärfe des Satzes. Die bewusst anstößige Verbindung von Gold/Silber mit »verrostet« reflektiert die prophetische Bildsprache und wird sachgerecht erläutert.
  terminology: »Rost«, »Zeugnis«, »Fleisch«, »Schätze angehäuft« und »letzten Tagen« sind treffend. Insbesondere vermeidet »Fleisch« eine unnötige theologische Umdeutung und erhält die konkrete Gerichtsmetaphorik. Die Fußnoten behandeln sowohl die metallkundliche Spannung als auch die umstrittene syntaktische Zuordnung von ὡς πῦρ angemessen.
