id: JAS.5.3
reference: James 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: de
  text: Euer Gold und Silber sind verrostet[a], und ihr Rost wird als Zeugnis gegen euch dienen und euer Fleisch wie Feuer verzehren.[b] Ihr habt in den letzten Tagen Schätze angehäuft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sind mit Rost überzogen« oder »sind korrodiert«. Gold und Silber rosten nicht im engeren naturwissenschaftlichen Sinn; das griechische Wort kann allgemein Korrosion oder Beschlag bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und euer Fleisch verzehren. Wie Feuer habt ihr in den letzten Tagen Schätze angehäuft.« Die Wendung »wie Feuer« kann statt mit dem vorausgehenden auch mit dem folgenden Satz verbunden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: sind verrostet
  rationale: Das Perfekt bezeichnet einen gegenwärtigen Zustand als Ergebnis eines vorausgegangenen Vorgangs. »Verrostet« bewahrt das eindringliche Bild des griechischen Textes, obwohl Gold und Silber im engeren naturwissenschaftlichen Sinn nicht rosten.
- source_word: ἰὸς
  choice: Rost
  rationale: Im Zusammenhang mit Metallen bezeichnet das Wort den korrosiven Belag oder dessen Wirkung. »Rost« hält die Wortverbindung mit »verrostet« aufrecht und entspricht dem prophetischen Bild.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: wird als Zeugnis gegen euch dienen
  rationale: Die Formulierung bewahrt die forensische und personifizierende Sprache von μαρτύριον und gibt die im Kontext gegen die Angeredeten gerichtete Funktion natürlich wieder.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: wird euer Fleisch verzehren
  rationale: »Verzehren« gibt das drastische Bild von φάγεται in würdigem, natürlichem Deutsch wieder; »Fleisch« bewahrt den konkreten körperlichen Bezug des Plurals σάρκας.
- source_word: ὡς πῦρ
  choice: wie Feuer
  rationale: 'Die Wendung wird am wahrscheinlichsten mit dem vorausgehenden Verb verbunden: Der Rost verzehrt ihr Fleisch wie Feuer. Die mögliche Zuordnung zum folgenden Satz wird in einer Fußnote bewahrt.'
- source_word: ἐθησαυρίσατε
  choice: habt ... Schätze angehäuft
  rationale: Die Wiedergabe bringt den im Verb enthaltenen Gedanken des Ansammelns von Schätzen zum Ausdruck. »Angehäuft« vermittelt im Kontext die kritische Stoßrichtung, ohne das stärkere und enger wertende »gehortet« zu wählen.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: in den letzten Tagen
  rationale: Dies ist die direkte und im Deutschen geläufige Wiedergabe der eschatologischen Zeitangabe, ohne ein im Griechischen nicht ausdrücklich vorhandenes »diesen« hinzuzufügen.
theological_decisions:
- issue: Syntaktische Zuordnung von ὡς πῦρ
  choice: '»wie Feuer« wird mit dem vorausgehenden Satzteil verbunden: Der Rost wird ihr Fleisch wie Feuer verzehren.'
  alternative: '»wie Feuer« kann mit dem folgenden Satz verbunden werden: »Wie Feuer habt ihr in den letzten Tagen Schätze angehäuft.«'
  rationale: Wortstellung und Sinnzusammenhang sprechen eher für die Verbindung mit φάγεται; dadurch entsteht ein geschlossenes Bild vernichtenden Gerichts. Da die alternative Zuordnung syntaktisch möglich ist und eine bedeutende Übersetzungstradition besitzt, wird sie in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Gerichtsmetaphorik und der forensische Ausdruck »Zeugnis gegen euch« bleiben erhalten. Der schwerfällige Plural »eure Fleischteile« wird vermieden; »euer Fleisch« entspricht natürlichem Deutsch. Sämtliche Fußnotenmarker stehen im Haupttext.
