  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: de
  text: Habt auch ihr Geduld. Stärkt eure Herzen, denn das Kommen des Herrn ist nahe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gegenwart des Herrn“. Das griechische Wort kann „Gegenwart/Anwesenheit“ oder „Kommen/Ankunft“ bedeuten; hier bezieht es sich im Zusammenhang auf die erwartete Ankunft des Herrn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: Habt Geduld
  rationale: Der Aorist-Imperativ fordert zu geduldigem Ausharren unter Belastung auf. „Habt Geduld“ ist im modernen Deutsch klar und passt zum Bild des wartenden Bauern im Zusammenhang.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Die Wendung verbindet die Angesprochenen mit dem unmittelbar zuvor genannten Beispiel und bewahrt die Betonung des ausdrücklichen Pronomens.
- source_word: στηρίξατε
  choice: Stärkt
  rationale: Das Verb bezeichnet Festigen oder Stärken. Zusammen mit „eure Herzen“ gibt „Stärkt“ den Aufruf zu innerer Festigkeit natürlich wieder.
- source_word: τὰς καρδίας ὑμῶν
  choice: eure Herzen
  rationale: Die direkte Wiedergabe erhält die biblische Metapher für das innere Zentrum von Entschlossenheit, Mut und Willen.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die beiden Aufforderungen ein. „Denn“ verbindet die Sätze in würdigem, natürlichem Deutsch.
- source_word: ἡ παρουσία
  choice: das Kommen
  rationale: παρουσία kann „Gegenwart/Anwesenheit“ oder „Kommen/Ankunft“ bedeuten. Im zukunftsgerichteten Zusammenhang von Jakobus 5,7–8 bezeichnet es das erwartete Kommen des Herrn.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: „Herr“ ist die natürliche Wiedergabe des Titels κύριος und entspricht hier dem neutestamentlichen Gebrauch im endzeitlichen Zusammenhang.
- source_word: ἤγγικεν
  choice: ist nahe
  rationale: Das Perfekt beschreibt einen eingetretenen Zustand der Nähe. Die idiomatische deutsche Formulierung „ist nahe“ gibt das Ergebnis dieses Nahkommens klar wieder.
theological_decisions:
- issue: Bedeutung von παρουσία in der Aussage über den Herrn
  choice: das Kommen des Herrn
  alternative: die Gegenwart/Anwesenheit des Herrn
  rationale: Obwohl παρουσία auch „Gegenwart“ oder „Anwesenheit“ bedeuten kann, weist der Zusammenhang mit dem geduldigen Warten in Jakobus 5,7–8 auf die erwartete endzeitliche Ankunft des Herrn. Die Fußnote bewahrt die echte lexikalische Alternative.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Herzmetapher bleibt erhalten; „ist nahe“ ist gegenüber dem wörtlicheren „hat sich genähert“ idiomatischer und bewahrt den resultativen Sinn des griechischen Perfekts.
