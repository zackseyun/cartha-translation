  source_fidelity: Die beiden aoristischen Imperative werden zutreffend als Aufforderungen im Plural wiedergegeben. „Habt auch ihr Geduld“ bewahrt sowohl μακροθυμήσατε als auch die hervorhebende Anbindung καὶ ὑμεῖς. „Stärkt eure Herzen“ gibt στηρίξατε τὰς καρδίας ὑμῶν direkt und im Deutschen verständlich wieder. „Denn“ gibt den begründenden Zusammenhang von ὅτι wieder. „Das Kommen des Herrn ist nahe“ trifft παρουσία im eschatologischen Kontext und gibt den resultativen Sinn von ἤγγικεν idiomatisch wieder.
