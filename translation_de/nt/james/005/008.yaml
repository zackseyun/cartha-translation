  terminology: „Herr“ ist für κύριος konsequent und kontextgerecht. „Kommen“ ist im Zusammenhang die beste Wiedergabe von παρουσία. Die Fußnote benennt die lexikalische Alternative „Gegenwart/Anwesenheit“, ohne den kontextuellen Sinn der Übersetzung zu relativieren.
