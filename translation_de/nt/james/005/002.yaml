  text: ὁ πλοῦτος ὑμῶν σέσηπεν, καὶ τὰ ἱμάτια ὑμῶν σητόβρωτα γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/002.yaml
  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: de
  text: Euer Reichtum ist verfault, und eure Kleider sind von Motten zerfressen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: Reichtum
  rationale: „Reichtum“ ist die natürliche, umfassende deutsche Entsprechung und bezeichnet hier den angehäuften materiellen Besitz der Angeredeten.
- source_word: σέσηπεν
  choice: ist verfault
  rationale: Das Perfekt beschreibt einen eingetretenen Verfall mit fortbestehendem Ergebnis. „Ist verfault“ gibt sowohl das lebhafte Bild als auch den gegenwärtigen Zustand idiomatisch wieder.
- source_word: ἱμάτια
  choice: Kleider
  rationale: „Kleider“ bezeichnet allgemein Kleidungsstücke, klingt würdig und ist im modernen Standarddeutsch gut verständlich.
- source_word: σητόβρωτα
  choice: von Motten zerfressen
  rationale: Die Form bezeichnet wörtlich etwas von Motten Verzehrtes. „Von Motten zerfressen“ bewahrt das konkrete Bild und klingt natürlicher als eine kompakte Neubildung.
- source_word: γέγονεν
  choice: sind … zerfressen
  rationale: Das griechische Perfekt hebt den entstandenen und nun bestehenden Zustand hervor. Im Deutschen bringt die resultative Zustandsformulierung „sind … zerfressen“ dies natürlicher zum Ausdruck als „sind geworden“.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die beiden Perfektformen werden wegen unterschiedlicher deutscher Idiomatik einmal als Vorgang mit Ergebnis („ist verfault“) und einmal als resultierender Zustand („sind … zerfressen“) wiedergegeben.
