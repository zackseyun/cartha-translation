    issue: „Nun hört“ für Ἄγε νῦν
    rationale: Die griechische Wendung ist kein Hörbefehl, sondern ein diskursleitender, scharf einsetzender Aufruf. „Kommt nun“ bildet diese Funktion ohne zusätzliche Bedeutung ab.
  - severity: low
    issue: Singular „das Elend“ für ταλαιπωρίαις
    rationale: Das griechische Substantiv steht im Plural. Ein deutscher Plural wie „die Nöte“ erhält die Mehrzahl der bevorstehenden Bedrängnisse.
  - severity: low
    issue: „jammert laut“ für ὀλολύζοντες
    rationale: „Jammern“ kann im heutigen Deutsch auch kleinliches oder übertriebenes Klagen bezeichnen. „Klagt laut“ ist für öffentlichen, intensiven Klageruf neutraler und dem Register besser entsprechend.
