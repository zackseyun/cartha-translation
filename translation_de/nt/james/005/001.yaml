  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: de
  text: Kommt nun, ihr Reichen, weint und klagt laut über die Nöte, die auf euch zukommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Nun hört
  rationale: Die idiomatische Aufforderungsformel leitet eine scharfe, prophetische Anrede ein. „Nun hört“ klingt im heutigen Deutsch natürlich und bewahrt den dringlichen Ton.
- source_word: οἱ πλούσιοι
  choice: ihr Reichen
  rationale: Der Nominativ hat hier die Funktion einer direkten Anrede. „Ihr Reichen“ erhält deren knappe und konfrontative Wirkung.
- source_word: κλαύσατε
  choice: weint
  rationale: Der Aoristimperativ fordert nachdrücklich zu offenem Weinen auf; „weint“ ist die unmittelbare und gewichtige deutsche Entsprechung.
- source_word: ὀλολύζοντες
  choice: jammert laut
  rationale: Das Partizip bezeichnet lautes, hörbares Klagen und verstärkt den Imperativ. „Jammert laut“ gibt diesen Sinn verständlich wieder, ohne die im Deutschen leicht tierisch wirkende Konnotation von „heulen“ aufzudrängen.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: über das Elend
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass des Klagens. Das abstrakte Singularwort „Elend“ ist im Deutschen eine natürliche Sammelbezeichnung für die angekündigten schweren Nöte.
- source_word: ὑμῶν ταῖς ἐπερχομέναις
  choice: das über euch kommen wird
  rationale: Der Genitiv ὑμῶν wird zusammen mit dem herannahenden Elend sinnvoll als Betroffenheit wiedergegeben. Die Zukunftsform macht im Deutschen das bevorstehende Eintreffen klar, ohne einen genaueren Zeitpunkt festzulegen.
theological_decisions:
- issue: Ton und Adressatenkreis der Anrede an die Reichen
  choice: Prophetische Gerichtsankündigung an reiche Menschen, deren genaue Zugehörigkeit in diesem Vers offenbleibt
  alternative: Ausschließlich ungläubige, ausbeuterische Grundbesitzer oder ausschließlich wohlhabende Mitglieder der christlichen Gemeinde
  rationale: Der Vers nennt allgemein „die Reichen“ und kündigt kommendes Elend an, bestimmt aber für sich genommen weder ihren Glaubensstatus noch ihre genauere gesellschaftliche Rolle. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit scharfem prophetischem Ton. Die Formulierung ist unmittelbar verständlich und vermeidet unnötig altertümliche Wendungen.
