  source_fidelity: Der Entwurf trifft die Gerichtsankündigung und die direkte Anrede grundsätzlich. „Nun hört“ fügt jedoch den Sinn von „hören/zuhören“ ein, den Ἄγε νῦν nicht hat; die Formel ist eine nachdrückliche Aufforderung. Zudem gibt der Singular „das Elend“ die Pluralform ταλαιπωρίαις weniger genau wieder. Die präsentische Partizipform wird mit „auf euch zukommen“ angemessen wiedergegeben.
  naturalness: „Kommt nun, ihr Reichen“ ist modernes, würdiges Standarddeutsch und trägt den scharfen prophetischen Ton. „Weint und klagt laut“ ist idiomatisch und vermittelt die Steigerung durch ὀλολύζοντες ohne umgangssprachlich-abwertendes „jammert“.
  terminology: „Reichen“ bewahrt die offene, direkte Anrede. „Nöte“ gibt ταλαιπωρίαις im Plural verständlich und ausreichend gewichtig wieder. Die Formulierung legt weder die Identität der Angeredeten noch eine bestimmte Auslegung des angekündigten Gerichts fest.
  issues:
