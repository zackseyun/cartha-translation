  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: de
  text: Aus Liebe bitte ich dich vielmehr – ich, Paulus, ein alter Mann[a] und jetzt auch ein Gefangener des Messias Jesus[b] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, nach einer weniger wahrscheinlichen Deutung: „ein Gesandter“. Das griechische Wort bedeutet hier natürlicher „ein alter Mann“.'
    reason: alternative_reading
  - marker: b
    text: Griechisch „Christus Jesus“; hier mit „Messias Jesus“ wiedergegeben, weil Χριστός als Titel verstanden wird.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: Aus Liebe
  rationale: διά mit Akkusativ bezeichnet hier den Beweggrund. „Aus Liebe“ ist im Deutschen natürlich und bewahrt den kausalen Sinn.
- source_word: μᾶλλον παρακαλῶ
  choice: bitte ich dich vielmehr
  rationale: μᾶλλον stellt die Bitte dem möglichen Gebieten in Vers 8 gegenüber. „Vielmehr“ markiert diesen Kontrast; „bitten“ gibt den persönlichen, eindringlichen Appell idiomatisch wieder.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: 'als der, der ich bin: Paulus'
  rationale: Die elliptische Selbstcharakterisierung wird verständlich und würdevoll wiedergegeben, ohne zusätzliche Eigenschaften in den Text einzutragen.
- source_word: πρεσβύτης
  choice: ein alter Mann
  rationale: Das Wort bezeichnet am natürlichsten einen alten beziehungsweise älteren Mann. Die vorgeschlagene Bedeutung „Gesandter“ beruht auf einem anderen, ähnlich lautenden griechischen Wort.
- source_word: νυνὶ δὲ καὶ
  choice: und jetzt auch
  rationale: Die Wiedergabe erhält sowohl den zeitlichen Nachdruck von νυνί als auch die hinzufügende Kraft von καί.
- source_word: δέσμιος
  choice: ein Gefangener
  rationale: Die direkte nominale Entsprechung ist im Deutschen klar und bewahrt Paulus’ Selbstbezeichnung.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός ist hier als Titel hörbar. Der Genitiv bezeichnet wahrscheinlich Zugehörigkeit oder den Grund seiner Gefangenschaft, ohne diese Beziehung genauer festzulegen.
theological_decisions:
- issue: Bedeutung von πρεσβύτης
  choice: ein alter Mann
  alternative: ein Gesandter; ein Ältester
  rationale: πρεσβύτης ist altersbezogen; „Gesandter“ entspräche eher πρεσβευτής. „Ältester“ könnte fälschlich ein kirchliches Amt nahelegen.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle bleibt der Titelcharakter erkennbar. „Messias“ macht diesen Sinn transparent, während „Christus“ als traditionelle Alternative möglich bleibt.
- issue: Beziehung des Gefangenen zu Jesus im Genitiv
  choice: Gefangener des Messias Jesus
  alternative: Gefangener um des Messias Jesus willen
  rationale: Die knappe Genitivkonstruktion des Griechischen bleibt erhalten und wird nicht eindeutig als Besitz-, Dienst- oder Kausalverhältnis aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bleibt offen, da der Satz in Vers 10 weitergeführt wird. Die leicht feierliche Selbstvorstellung wird bewahrt, aber die im Deutschen unnatürliche wörtliche Form „ein solcher seiend wie Paulus“ vermieden.
