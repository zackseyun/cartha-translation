base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: de
  text: Ich bitte dich für mein Kind[a], Onesimus, den ich in meinen Fesseln gezeugt habe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Kind“ ist hier bildlich gemeint; Paulus beschreibt seine Beziehung zu Onesimus mit einer Zeugungsmetapher.
    reason: metaphor_clarification
  - marker: b
    text: 'Oder: „den ich während meiner Gefangenschaft gezeugt habe“. Der griechische Ausdruck bewahrt das konkrete Bild der Fesseln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: ich bitte
  rationale: Im persönlichen Zusammenhang leitet παρακαλῶ eine eindringliche, aber nicht befehlende Bitte ein. „Ich bitte dich“ klingt im heutigen Deutschen natürlich und wahrt den Beziehungston.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: für mein Kind
  rationale: περί mit Genitiv bezeichnet hier die Person, für die Paulus eintritt. „Für mein Kind“ ist im Deutschen idiomatischer als „wegen/meines Kindes betreffend“ und bewahrt τέκνον als liebevolle Bezeichnung geistlicher Elternschaft.
- source_word: ὃν ἐγέννησα
  choice: den ich gezeugt habe
  rationale: γεννάω verwendet ein Zeugungs- beziehungsweise Geburtsbild. „Gezeugt“ bewahrt diese auffällige Metapher, ohne sie ausdrücklich als Bekehrung auszulegen.
- source_word: ἐν τοῖς δεσμοῖς
  choice: in meinen Fesseln
  rationale: δεσμοί bezeichnet konkret Fesseln und metonymisch die Gefangenschaft. „In meinen Fesseln“ erhält das körperlich-konkrete Bild; das Possessivpronomen ergibt sich natürlich aus dem Ich-Kontext.
- source_word: Ὀνήσιμον
  choice: Onesimus
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Art der Beziehung zwischen Paulus und Onesimus
  choice: Das Bild geistlicher Vaterschaft wird mit „gezeugt“ beibehalten.
  alternative: „dessen Vater ich in der Gefangenschaft geworden bin“ oder ausdrücklich „den ich zum Glauben geführt habe“
  rationale: Der griechische Text legt nahe, dass Onesimus durch Paulus zu neuem geistlichem Leben kam, formuliert dies aber als Zeugungsmetapher. Die Übersetzung soll diese Aussage weder abschwächen noch in eine ausdrückliche Bekehrungsformel auflösen.
- issue: Bedeutung von δεσμοί
  choice: Das konkrete Bild „Fesseln“ bleibt im Haupttext stehen.
  alternative: „Gefangenschaft“ oder „im Gefängnis“
  rationale: Der Ausdruck kann die Haft insgesamt bezeichnen, doch die konkrete Rede von Fesseln gehört zur Bildsprache des Textes und sollte nicht unnötig abstrahiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Zeugungsmetapher und das konkrete Bild der Fesseln werden bewusst erhalten; Fußnoten erläutern sie knapp, ohne die Hauptaussage konfessionell auszudeuten.
