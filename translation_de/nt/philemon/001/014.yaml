  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: de
  text: Doch ohne deine Zustimmung wollte ich nichts tun[a], damit das Gute, das du tust, nicht gleichsam unter Zwang, sondern freiwillig geschehe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne deine Billigung“ oder „ohne deine Meinung“.'
    reason: lexical_alternative
  - marker: b
    text: „Das Gute, das du tust“ kann auch allgemeiner „deine Güte“ oder „deine Freundlichkeit“ bedeuten; „freiwillig“ heißt wörtlich „gemäß dem Freiwilligen“, also aus eigenem Willen.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: ohne deine Zustimmung
  rationale: γνώμη kann Meinung, Urteil, Absicht oder Zustimmung bezeichnen. Im Zusammenhang geht es darum, dass Paulus nicht ohne Philemons Einverständnis handeln will; „Zustimmung“ gibt den relationalen und willentlichen Sinn natürlich wieder.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: wollte ich nichts tun
  rationale: θέλω bezeichnet hier den Willen. Die Formulierung bleibt nahe am Griechischen und vermeidet die stärkere Festlegung von „ich beschloss“.
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: Die Wendung gibt den Zweck des Verzichts von Paulus in klarem, heutigem Deutsch wieder.
- source_word: ὡς κατὰ ἀνάγκην
  choice: wie unter Zwang
  rationale: ἀνάγκη bezeichnet hier äußeren Druck oder Zwang; „wie“ bewahrt die durch ὡς ausgedrückte Charakterisierung, ohne zu behaupten, Philemon werde tatsächlich gezwungen.
- source_word: τὸ ἀγαθόν σου
  choice: deine gute Tat
  rationale: Das substantivierte Neutrum kann eine konkrete gute Handlung oder allgemeiner Philemons Güte bezeichnen. Im Kontext liegt eine konkrete Handlung nahe, während die Fußnote die echte Bedeutungsbreite wahrt.
- source_word: ᾖ
  choice: geschieht
  rationale: Im Deutschen verlangt „gute Tat“ eine idiomatische verbale Fassung. „Geschieht“ gibt in der Zweckkonstruktion den Sinn von „sei“ natürlich wieder.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: sondern freiwillig
  rationale: ἑκούσιον bezeichnet etwas aus eigenem Willen Geschehendes. „Freiwillig“ bildet den knappen Gegensatz zu „unter Zwang“.
theological_decisions:
- issue: Art von Philemons Reaktion
  choice: Paulus legt Wert auf eine freiwillige gute Tat statt auf eine erzwungene Reaktion, ohne die konkrete Tat näher festzulegen.
  alternative: Abstrakter „deine Güte“ oder kontextuell enger „deine Freundlichkeit“.
  rationale: Der griechische Text betont die freiwillige Beschaffenheit von Philemons Reaktion, lässt aber offen, worin das Gute genau besteht. Die Übersetzung vermeidet daher eine weitergehende ethische oder lehrmäßige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gegensatz zwischen Zwang und Freiwilligkeit, ohne unnatürlich wörtlich zu klingen.
