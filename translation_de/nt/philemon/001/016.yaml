source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: de
  text: 'nicht länger als einen Sklaven[a], sondern als einen, der mehr ist als ein Sklave: als einen geliebten Bruder – besonders mir, wie viel mehr aber dir, sowohl im Fleisch[b] als auch im Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang auch mit „Diener“ oder „Unfreier“ wiedergegeben werden; hier bezeichnet es wahrscheinlich den sozialen Status des Onesimus als Sklave.
    reason: alternative_reading
  - marker: b
    text: „Im Fleisch“ meint hier wahrscheinlich die menschliche oder soziale Beziehung, möglicherweise auch „persönlich“; nicht die „sündige Natur“.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: nicht länger
  rationale: Gibt die zeitliche Verneinung und die gegenüber der früheren Situation eingetretene Veränderung natürlich wieder.
- source_word: ὡς δοῦλον
  choice: als einen Sklaven
  rationale: Im sozialen Kontext des Onesimus bezeichnet δοῦλος sehr wahrscheinlich einen rechtlich und sozial unfreien Menschen; „Sklave“ macht diese Realität deutlich.
- source_word: ὑπὲρ δοῦλον
  choice: als mehr als einen Sklaven
  rationale: ὑπέρ drückt hier ein Hinausgehen über den bisherigen Status aus; die Formulierung bewahrt den direkten Kontrast.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: als einen geliebten Bruder
  rationale: Bewahrt sowohl die familiäre Metapher der christlichen Gemeinschaft als auch den Ausdruck persönlicher Liebe.
- source_word: μάλιστα ἐμοί
  choice: ganz besonders für mich
  rationale: Gibt die graduelle Hervorhebung durch μάλιστα in natürlichem Deutsch wieder.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: wie viel mehr aber für dich
  rationale: Bewahrt die rhetorische Steigerung und den Kontrast zwischen Paulus und Philemon.
- source_word: ἐν σαρκὶ
  choice: im Fleisch
  rationale: Die wörtliche paulinische Formulierung bleibt erhalten, ohne die mögliche irdische, leibliche oder soziale Bedeutung im Haupttext einzuengen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Bewahrt die geläufige paulinische Wendung für die Beziehung beziehungsweise Gemeinschaft im Herrn, ohne sie erklärend zu verengen.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Zusammenhang mit Onesimus
  choice: Sklave
  alternative: Diener; Leibeigener; Unfreier
  rationale: Der soziale Status des Onesimus ist für den Gedankengang zentral. „Sklave“ wahrt die Härte dieser Realität und die Kraft der Aussage, er sei nun „mehr als“ ein Sklave.
- issue: Bedeutung von ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: sowohl im Fleisch als auch im Herrn
  alternative: sowohl im irdischen Leben als auch im Herrn; sowohl persönlich als auch im Herrn
  rationale: Die wörtliche Gegenüberstellung erhält die mögliche Spannung zwischen der leiblich-sozialen Beziehung und der geistlichen Beziehung im Herrn, statt sie auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt die rhetorische Steigerung des griechischen Textes; der Doppelpunkt verdeutlicht, dass „geliebter Bruder“ erläutert, inwiefern Onesimus mehr als ein Sklave ist.
