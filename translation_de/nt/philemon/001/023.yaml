id: PHM.1.23
reference: Philemon 1:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: de
  text: Epaphras, mein Mitgefangener im Messias Jesus[a], grüßt dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „in Christus Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: grüßt
  rationale: Das Verb ἀσπάζομαι bezeichnet hier idiomatisch das Grüßen. „Grüßt“ ist im Deutschen knapp, natürlich und entspricht dem singularischen Subjekt.
- source_word: σε
  choice: dich
  rationale: Das Pronomen steht in der zweiten Person Singular und richtet sich unmittelbar an Philemon.
- source_word: Ἐπαφρᾶς
  choice: Epaphras
  rationale: Der Personenname wird gemäß der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: ὁ συναιχμάλωτός μου
  choice: mein Mitgefangener
  rationale: Das Kompositum συναιχμάλωτος bezeichnet einen Mitgefangenen; der possessive Genitiv μου wird mit „mein“ wiedergegeben. Die mögliche bildhafte Färbung eines gemeinsamen Kriegsgefangenenstatus wird nicht überbetont.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: „Im“ bewahrt die paulinische ἐν-Formulierung und vermeidet eine vorschnelle Auflösung in „für“ oder „wegen“. Χριστός wird als Titel mit „Messias“ übersetzt, während Ἰησοῦ als Name „Jesus“ bleibt.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in der paulinischen Wendung ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: in Christus Jesus
  rationale: Die Übersetzung mit „Messias“ macht den Titelgehalt von Χριστός sichtbar und erhält zugleich durch „im“ die theologisch dichte, nicht vollständig aufzulösende Beziehungsaussage. Die im Deutschen traditionellere Form „in Christus Jesus“ wird als Alternative in der Fußnote genannt.
- issue: Bezug von ἐν Χριστῷ Ἰησοῦ
  choice: unaufgelöst bei „mein Mitgefangener“ belassen
  alternative: mein Mitgefangener um Jesu willen
  rationale: Die griechische Wendung kann die gemeinsame Zugehörigkeit zum Messias kennzeichnen und im Kontext zugleich die Gefangenschaft prägen. Eine kausale Paraphrase würde die Mehrdeutigkeit unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt Epaphras als hervorgehobenes Subjekt und bleibt trotz der bewusst markierten Wendung „im Messias Jesus“ gut verständlich.
