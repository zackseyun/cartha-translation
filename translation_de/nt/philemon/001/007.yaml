source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: de
  text: Denn deine Liebe hat mir viel Freude und Ermutigung bereitet, weil die Herzen[a] der Heiligen durch dich neue Kraft geschöpft haben, Bruder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: das Innerste; das griechische Wort bezeichnet eigentlich die inneren Organe als Sitz tiefer Empfindungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: Freude
  rationale: „Freude“ ist die natürliche und übliche Entsprechung für χαρά und passt zur parallelen „Ermutigung“.
- source_word: πολλὴν ἔσχον
  choice: hat mir viel … bereitet
  rationale: Die idiomatische deutsche Formulierung gibt das Erleben von „viel Freude und Ermutigung“ natürlich wieder, auch wenn sie die griechische Satzstruktur leicht umstellt.
- source_word: παράκλησιν
  choice: Ermutigung
  rationale: παράκλησις kann Ermutigung, Trost oder Zuspruch bedeuten. Hier bezeichnet „Ermutigung“ am besten die stärkende Wirkung von Philemons Liebe auf Paulus.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: deine Liebe
  rationale: ἐπί mit Dativ bezeichnet hier den Grund für Paulus’ Freude und Ermutigung. Die deutsche Konstruktion „deine Liebe hat mir … bereitet“ bringt diesen kausalen Zusammenhang klar zum Ausdruck.
- source_word: ἀγάπῃ
  choice: Liebe
  rationale: „Liebe“ ist die direkte, geläufige Entsprechung für ἀγάπη.
- source_word: σπλάγχνα
  choice: Herzen
  rationale: Wörtlich sind die inneren Organe gemeint, idiomatisch jedoch das Innerste beziehungsweise der Sitz tiefer Empfindungen. „Herzen“ vermittelt dieses Bild im heutigen Deutsch verständlich; die Fußnote bewahrt die wörtlichere Nuance.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: „Die Heiligen“ bewahrt den paulinischen Ausdruck für die zu Gott gehörenden Gläubigen, ohne ihn durch eine erklärende Umschreibung zu ersetzen.
- source_word: ἀναπέπαυται
  choice: zur Ruhe gekommen sind
  rationale: Die Formulierung gibt sowohl die Grundbedeutung „Ruhe finden“ als auch den durch das Perfekt bezeichneten fortdauernden Zustand wieder. Sie bewahrt zudem die Verbindung zur erneuten Verwendung des Verbs in Vers 20.
- source_word: διὰ σοῦ
  choice: durch dich
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise Wirksamkeit; „durch dich“ bildet dies direkt und natürlich ab.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Die direkte familiäre Anrede innerhalb der Glaubensgemeinschaft wird ohne zusätzliche, im Griechischen nicht ausdrücklich vorhandene Wertung wiedergegeben.
theological_decisions:
- issue: Wiedergabe von ἅγιοι
  choice: die Heiligen
  alternative: Gottes Volk; die zu Gott Gehörenden
  rationale: „Die Heiligen“ erhält die paulinische Bezeichnung für die Glaubenden als für Gott ausgesonderte Gemeinschaft und setzt keine spätere kirchliche Heiligsprechung voraus.
- issue: Anthropologische Bildsprache von σπλάγχνα
  choice: Herzen
  alternative: das Innerste; die innersten Empfindungen
  rationale: Das griechische Körperbild bezeichnet den Sitz tiefer Empfindungen und das innere Leben. „Herzen“ ist im Deutschen verständlich und pastoral treffend, während die Fußnote die konkretere Bildsprache offenlegt.
- issue: Bedeutungsumfang von ἀναπέπαυται
  choice: zur Ruhe gekommen sind
  alternative: sind erquickt worden; haben neue Kraft geschöpft
  rationale: Die gewählte Fassung hält die Vorstellung von Ruhe und Entlastung fest und vermeidet eine unnötige Festlegung allein auf körperliche oder emotionale Erfrischung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leichte syntaktische Umstellung vermeidet das schwerfällige „ich hatte viel Freude“ und hält zugleich beide Begründungszusammenhänge klar. Die Anrede „Bruder“ bleibt bewusst schlicht und direkt.
