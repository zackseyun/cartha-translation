  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: de
  text: 'Ich schicke[a] ihn zu dir zurück – ihn selbst, das heißt: mein Herz.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe ihn zu dir zurückgeschickt“ oder „Ich schickte ihn zu dir zurück“. Der griechische Aorist kann unterschiedlich wiedergegeben werden; das Präsens folgt der Briefperspektive, nach der Onesimus den Brief zu Philemon bringt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „meine Eingeweide“; als Redewendung ein Ausdruck tiefster Zuneigung oder innigen Mitgefühls.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Onesimus und wird im Deutschen natürlich mit „ihn“ wiedergegeben.
- source_word: ἀνέπεμψά
  choice: ich schicke … zurück
  rationale: 'Der Aorist von ἀναπέμπω bezeichnet das Zurücksenden. Das Präsens gibt hier passend die Briefperspektive wieder: Onesimus kommt zusammen mit dem Brief beim Empfänger an.'
- source_word: σοι
  choice: zu dir
  rationale: Der Dativ bezeichnet den Empfänger; „zu dir“ ist im Zusammenhang mit „zurückschicken“ idiomatisches Deutsch.
- source_word: αὐτόν
  choice: ihn selbst
  rationale: Das erneut gesetzte Pronomen hebt Onesimus nachdrücklich hervor. „Ihn selbst“ bewahrt diese Betonung in natürlichem Deutsch.
- source_word: τοῦτ’ ἔστιν
  choice: das heißt
  rationale: Die feste erklärende Wendung leitet die nachfolgende Gleichsetzung ein.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: mein eigenes Herz
  rationale: σπλάγχνα bezeichnet wörtlich die inneren Organe, idiomatisch aber den Sitz inniger Zuneigung. „Mein eigenes Herz“ vermittelt sowohl die tiefe Verbundenheit als auch die durch ἐμά ausgedrückte persönliche Betonung.
theological_decisions:
- issue: Anthropologische Metapher in σπλάγχνα
  choice: mein eigenes Herz
  alternative: mein Innerstes; meine innigste Zuneigung
  rationale: Die Formulierung wird idiomatisch statt anatomisch wiedergegeben. Sie bewahrt die starke persönliche Zuneigung des Paulus, ohne aus der Metapher eine zusätzliche anthropologische oder lehrmäßige Aussage abzuleiten.
- issue: Zeitliche Perspektive des Aorists ἀνέπεμψα
  choice: ich schicke … zurück
  alternative: ich habe … zurückgeschickt; ich schickte … zurück
  rationale: Das deutsche Präsens entspricht der Briefperspektive und stellt den Vorgang als mit der Übermittlung des Schreibens verbunden dar. Die Vergangenheitsformen bleiben grammatisch mögliche Wiedergaben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die emphatische Wiederaufnahme von αὐτόν ab; „das heißt“ bewahrt die erklärende Apposition. Die Fußnote vereint die beiden wesentlichen sprachlichen Alternativen knapp.
