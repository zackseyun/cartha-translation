id: PHM.1.1
reference: Philemon 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: de
  text: Paulus, ein Gefangener des Messias[b] Jesus[a], und Timotheus, unser Bruder, an Philemon, unseren geliebten Mitarbeiter,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gefangener um des Messias Jesus willen“. Der griechische Genitiv kann eine Beziehung oder Zugehörigkeit, aber auch den Grund der Gefangenschaft bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Griechisch Christos; traditionell „Christus“. „Messias“ gibt hier den Titel mit seiner Bedeutung wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: Gefangener
  rationale: Das Substantiv bezeichnet einen Menschen in Fesseln oder Haft. „Gefangener“ ist die klare und natürliche deutsche Entsprechung.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Χριστός bezeichnet hier den Titel des Gesalbten. „Messias“ gibt diesen Titel im Deutschen ausdrücklich wieder; die geläufige Alternative „Christus“ wird in einer Fußnote genannt.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Übliche deutsche Form des Personennamens.
- source_word: ὁ ἀδελφός
  choice: unser Bruder
  rationale: Wörtlich steht „der Bruder“. Das im frühchristlichen Sprachgebrauch vorausgesetzte Gemeinschaftsverhältnis wird im natürlichen Deutschen mit „unser Bruder“ ausgedrückt.
- source_word: ἀγαπητῷ
  choice: geliebten
  rationale: „Geliebt“ bewahrt die herzliche gemeinschaftliche Zuneigung des griechischen Adjektivs.
- source_word: συνεργῷ
  choice: Mitarbeiter
  rationale: Das Wort bezeichnet jemanden, der gemeinsam mit anderen arbeitet. „Mitarbeiter“ ist im Deutschen natürlich und wahrt den Bezug auf die gemeinsame Arbeit.
- source_word: ἡμῶν
  choice: unseren
  rationale: Das Pronomen im Plural wird beibehalten und auf den geliebten Mitarbeiter bezogen; es entspricht dem gemeinsamen Absenderrahmen von Paulus und Timotheus.
- source_word: Φιλήμονι
  choice: an Philemon
  rationale: Der Dativ bezeichnet in der Briefeinleitung den Empfänger und wird idiomatisch mit „an“ wiedergegeben.
- source_word: καὶ Τιμόθεος
  choice: und Timotheus
  rationale: Timotheus wird in der Anrede zusammen mit Paulus als Mitabsender genannt.
theological_decisions:
- issue: Bedeutung des Genitivs Χριστοῦ Ἰησοῦ nach δέσμιος
  choice: ein Gefangener des Messias Jesus
  alternative: ein Gefangener um des Messias Jesus willen
  rationale: Der knappe Genitiv kann Zugehörigkeit beziehungsweise Beziehung ausdrücken, aber auch den Grund der Gefangenschaft bezeichnen. Der Haupttext bewahrt die griechische Form; die Fußnote nennt die kausale Deutung.
- issue: Wiedergabe von Χριστός in der Briefeinleitung
  choice: Messias
  alternative: Christus
  rationale: Der Titelcharakter ist hier noch erkennbar. „Messias“ macht die Bedeutung als der Gesalbte sichtbar, ohne die traditionelle Namensform „Christus“ als mögliche Wiedergabe auszuschließen.
translation_notes:
  register: Moderne, würdige deutsche Briefformel. Die ungewöhnliche, aber verständliche Wortfolge „Messias Jesus“ bewahrt den Titel vor dem Personennamen. Das abschließende Komma zeigt, dass die Anrede im folgenden Vers weitergeht.
