source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: de
  text: Zugleich aber bereite mir auch eine Unterkunft[a] vor; denn ich hoffe, euch durch eure Gebete geschenkt zu werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gastfreundschaft“ beziehungsweise „eine Bleibe“. Das griechische Wort kann sowohl die gewährte Gastfreundschaft als auch den für einen Gast vorgesehenen Aufenthaltsort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gewährt zu werden“. Die Passivform kann andeuten, dass Gott Paulus den Empfängern wieder schenkt, ohne ihn ausdrücklich als Handelnden zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: zugleich auch
  rationale: Die Wendung führt neben der vorausgehenden Bitte eine weitere Bitte ein. „Zugleich auch“ gibt ἅμα und καὶ wieder; δέ wird durch den fließenden Anschluss ausgedrückt.
- source_word: ἑτοίμαζέ
  choice: bereite … vor
  rationale: Der Imperativ bezeichnet eine konkrete praktische Vorbereitung und wird im Deutschen natürlich mit dem trennbaren Verb „vorbereiten“ wiedergegeben.
- source_word: μοι
  choice: mir
  rationale: Der Dativ bezeichnet Paulus als den Begünstigten der Vorbereitung.
- source_word: ξενίαν
  choice: eine Unterkunft
  rationale: ξενία kann sowohl Gastfreundschaft als auch eine Unterkunft bezeichnen. In Verbindung mit „vorbereiten“ und „mir“ liegt hier die konkrete Unterbringung nahe, ohne die Bedeutung unnötig auf ein bestimmtes Gästezimmer einzuengen.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: denn ich hoffe, dass
  rationale: γάρ begründet die Bitte, während ἐλπίζω mit ὅτι den Inhalt der Hoffnung einführt.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: durch eure Gebete
  rationale: διά mit Genitiv bezeichnet hier am ehesten das Mittel; „durch“ bewahrt diese instrumentale Nuance.
- source_word: χαρισθήσομαι
  choice: ich … geschenkt werde
  rationale: Das Futur Passiv von χαρίζομαι bezeichnet ein freies beziehungsweise gnädiges Gewähren. „Geschenkt werde“ bewahrt Passivform und Gabecharakter, ohne Gottes Wirken im Haupttext ausdrücklich hinzuzufügen.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger, denen Paulus nach seiner Hoffnung wieder gegeben werden wird.
theological_decisions:
- issue: Bedeutung von χαρισθήσομαι im Blick auf Paulus’ erhoffte Rückkehr
  choice: Paulus hofft, den Empfängern durch ihre Gebete geschenkt zu werden; Gottes Wirken bleibt impliziert.
  alternative: Paulus hofft, freigelassen und zu ihnen zurückgeschickt zu werden.
  rationale: Der Briefkontext legt eine Freilassung und Rückkehr nahe, doch der griechische Wortlaut nennt die Freilassung hier nicht ausdrücklich. Die Übersetzung bewahrt daher die passive, gnadenbezogene Ausdrucksweise und die implizite göttliche Urheberschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unterkunft“ ist verständlich und weniger spezifisch als „Gästezimmer“. Das ungewöhnliche „euch … geschenkt werde“ bewahrt bewusst die Bildlichkeit und theologische Spannung des griechischen Passivs; eine Fußnote bietet die idiomatischere Alternative.
