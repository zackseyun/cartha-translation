  source_fidelity: 'Der Text gibt alle Sinnelemente des griechischen Satzes zutreffend wieder: εὐχαριστῶ mit „Ich danke“, τῷ θεῷ μου mit „meinem Gott“, πάντοτε mit „allezeit“, μνείαν σου ποιούμενος mit „und erwähne dich“ und ἐπὶ τῶν προσευχῶν μου mit „in meinen Gebeten“. Die Koordination im Deutschen gibt die gleichzeitige begleitende Handlung des griechischen Partizips angemessen wieder.'
