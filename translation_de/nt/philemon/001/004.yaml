  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: de
  text: Ich danke meinem Gott allezeit und erwähne dich in meinen Gebeten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich in meinen Gebeten an dich denke“. Wörtlicher: „indem ich dich in meinen Gebeten erwähne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Ich danke
  rationale: Das Präsens Aktiv Indikativ in der ersten Person Singular wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: τῷ θεῷ μου
  choice: meinem Gott
  rationale: Der Dativ bezeichnet bei εὐχαριστέω die Person, der gedankt wird; „meinem Gott danken“ ist im Deutschen idiomatisch und bewahrt den persönlichen Ausdruck.
- source_word: πάντοτε
  choice: allezeit
  rationale: Das Adverb bezeichnet beständige beziehungsweise regelmäßige Wiederkehr. „Allezeit“ passt zum würdevollen biblischen Register, ohne unverständlich zu sein.
- source_word: μνείαν σου ποιούμενος
  choice: und erwähne dich
  rationale: Die Wendung bedeutet wörtlich „Erwähnung von dir machend“. Die koordinierte Wiedergabe drückt die Gleichzeitigkeit mit dem Danken natürlich aus und bewahrt den Gedanken des ausdrücklichen Nennens im Gebet.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: in meinen Gebeten
  rationale: ἐπί mit dem Genitiv wird in dieser Gebetsformel idiomatisch mit „in“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Allezeit“ hält den Ton der paulinischen Danksagung; „erwähne dich“ bewahrt gegenüber dem freieren „denke an dich“ den verbalen Gebetsbezug des griechischen Ausdrucks.
