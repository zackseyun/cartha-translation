base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: de
  text: Wenn er dir aber in irgendeiner Weise Unrecht getan hat oder dir etwas schuldet, stell es mir in Rechnung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rechne es mir zu.« Das Verb ist ein Begriff aus der Buchführung und meint, etwas jemandem anzurechnen oder auf dessen Konto zu verbuchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Wenn … aber
  rationale: Die Verbindung gibt die Bedingung εἰ und den milden Gegensatz beziehungsweise Übergang δέ im Deutschen natürlich wieder.
- source_word: τι ἠδίκησέν σε
  choice: er dir … Unrecht getan hat
  rationale: ἀδικέω bezeichnet allgemein ein unrechtes Handeln gegen jemanden. Die Formulierung bleibt bewusst offen für persönlichen wie materiellen Schaden; τι wird im Deutschen idiomatisch nicht eigens wiederholt, da die unbestimmte Reichweite aus der Konstruktion hervorgeht.
- source_word: ἢ ὀφείλει
  choice: oder dir etwas schuldet
  rationale: ὀφείλω bezeichnet hier eine Schuld oder Verbindlichkeit. Das aus dem Zusammenhang erschlossene indirekte Objekt wird ausdrücklich genannt, und »etwas« bewahrt die unbestimmte Aussage.
- source_word: τοῦτο
  choice: es
  rationale: Das Pronomen verweist zusammenfassend auf das zuvor genannte Unrecht oder die Schuld. »Es« ist im deutschen Ausdruck »es jemandem in Rechnung stellen« natürlicher als das formal nähere »dies«.
- source_word: ἐμοὶ ἐλλόγα
  choice: stell es mir in Rechnung
  rationale: ἐλλογέω ist ein Begriff aus der Buchführung und bedeutet, etwas jemandem anzurechnen beziehungsweise auf dessen Konto zu verbuchen. Die gewählte Formulierung ist modern, klar und erhält das kaufmännische Bild.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wahrt die offene Reichweite des möglichen Unrechts und erhält mit »in Rechnung stellen« den buchhalterischen Sinn des griechischen Verbs.
