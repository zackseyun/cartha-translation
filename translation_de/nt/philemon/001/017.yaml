  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: de
  text: Wenn du mich also als Partner ansiehst, nimm ihn auf[a] wie mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heiße ihn willkommen“ beziehungsweise „nimm ihn an“. Das Verb kann bedeuten, jemanden wohlwollend aufzunehmen oder in die Gemeinschaft anzunehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Wenn … also
  rationale: Die Verbindung gibt sowohl die Bedingung als auch den folgernden Anschluss an den vorausgehenden Appell in natürlichem Deutsch wieder.
- source_word: με ἔχεις κοινωνόν
  choice: du mich als Partner ansiehst
  rationale: κοινωνός bezeichnet jemanden, der mit einem anderen an etwas teilhat. „Als Partner ansehen“ gibt die relationale Bedeutung der griechischen Wendung verständlich wieder, ohne sie auf eine geschäftliche oder konfessionell geprägte Bedeutung festzulegen.
- source_word: προσλαβοῦ
  choice: nimm ihn auf
  rationale: Der Imperativ kann ein wohlwollendes Aufnehmen, Willkommenheißen oder Annehmen bezeichnen. „Nimm ihn auf“ bewahrt diese Bedeutungsbreite und passt zu Paulus’ persönlichem Appell.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich im Kontext auf Onesimus.
- source_word: ὡς ἐμέ
  choice: wie mich selbst
  rationale: Die idiomatische deutsche Formulierung bringt knapp zum Ausdruck, dass Philemon Onesimus so aufnehmen soll, wie er Paulus aufnehmen würde.
theological_decisions:
- issue: Beziehungsgehalt von κοινωνός in Paulus’ Appell
  choice: Partner
  alternative: Gefährte; Teilhaber; jemand, der mit mir Gemeinschaft hat
  rationale: „Partner“ vermittelt die gegenseitige Teilhabe und Verbundenheit zwischen Paulus und Philemon, ohne einen technischen kirchlichen oder sakramentalen Begriff einzuführen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Konstruktion „Wenn … also, dann …“ erhält den logischen Zusammenhang und den eindringlichen Charakter des Appells. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Alternative tatsächlich bezieht.
