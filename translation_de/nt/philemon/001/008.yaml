  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: de
  text: Darum könnte ich dir zwar im Messias[a] mit großer Freimütigkeit gebieten, das zu tun, was sich gehört[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Christus«. Das griechische Χριστός ist ein Titel und bedeutet »Messias« beziehungsweise »Gesalbter«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »was angemessen ist«; »was sich gebührt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διό
  choice: Darum
  rationale: Die Folgerungspartikel knüpft den folgenden Gedanken eng an die vorausgehenden Aussagen an.
- source_word: πολλὴν ... παρρησίαν
  choice: mit großer Freimütigkeit
  rationale: παρρησία bezeichnet hier die Freiheit und Kühnheit, offen und mit Autorität zu sprechen; die adverbiale deutsche Formulierung ist natürlich und bewahrt den Sinn.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός ist ein Titel; »Messias« gibt seinen titularen Sinn wieder. »In« bleibt als paulinische Bezeichnung des Beziehungs- und Wirkungsbereichs erhalten.
- source_word: ἔχων
  choice: könnte ich ... zwar
  rationale: Das Partizip hat im Zusammenhang einen einräumenden Sinn, der in Vers 9 durch den Gegensatz weitergeführt wird. Die deutsche Modalform gibt die vorhandene Befugnis wieder, ohne zu behaupten, Paulus übe sie tatsächlich aus.
- source_word: ἐπιτάσσειν σοι
  choice: dir ... gebieten
  rationale: ἐπιτάσσω bezeichnet eine autoritative Weisung; »gebieten« wahrt diese Stärke und verbindet sich natürlich mit dem Dativ.
- source_word: τὸ ἀνῆκον
  choice: was sich gehört
  rationale: Das substantivierte Partizip bezeichnet das Angemessene oder Gebührende. Die Wendung ist gegenwärtiges, verständliches Standarddeutsch.
theological_decisions:
- issue: Wiedergabe von Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Der griechische Ausdruck trägt titularen Gehalt. »Messias« macht diesen sichtbar, während die traditionelle Wiedergabe »Christus« als Alternative vermerkt wird.
- issue: Art der paulinischen Autorität
  choice: könnte ... gebieten
  alternative: habe ... die Freimütigkeit, zu gebieten
  rationale: Die Formulierung bewahrt sowohl Paulus’ tatsächliche Befugnis als auch den Kontrast dazu, dass er im folgenden Vers lieber bittet; sie leitet keine besondere Amtslehre aus dem Satz ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das »zwar« signalisiert den erst in Vers 9 vervollständigten Gegensatz; das abschließende Komma bewahrt den fortlaufenden Satzbau.
