review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt ἀκούων kausal und im Präsens zutreffend wieder und bewahrt die Paarung von Liebe und Glaube. Die Verben „entgegenbringst“ und „erweist“ erzeugen jedoch eine semantisch unhaltbare Kreuzzuordnung: Der Glaube wird damit auch allen Heiligen „erwiesen“, während die Liebe dem Herrn Jesus „entgegengebracht“ wird. Die griechische, nicht ausdrücklich aufgelöste Zuordnung wird dadurch nicht bewahrt.'
  naturalness: „Liebe und Glauben … entgegenbringen und … erweisen“ ist im Deutschen wegen der beiden unterschiedlichen Verben und ihrer jeweiligen passenden Objekte nicht natürlich. „Liebe und Glauben … hast“ ist idiomatisch und lässt die im griechischen Satzbau verbleibende gemeinsame Bezugsstruktur erkennbar.
  terminology: „Herr Jesus“, „Liebe“, „Glaube“ und „Heilige“ sind angemessene moderne standarddeutsche Wiedergaben. Die Fußnote zur möglichen Bedeutung „Treue“ ist sinnvoll; die alternative distributive Zuordnung soll erhalten bleiben.
  issues:
  - severity: medium
    issue: Die zwei Verben erzwingen bzw. nahelegen eine falsche Kreuzzuordnung der Beziehungen.
    rationale: Syntaktisch beziehen sich sowohl „entgegenbringst“ als auch „erweist“ auf „Liebe und Glauben“ und auf beide Dativobjekte. Inhaltlich ist insbesondere „Glauben allen Heiligen erweisen“ keine tragfähige Wiedergabe von εἰς πάντας τοὺς ἁγίους. Die Konstruktion löst die griechische Ambiguität nicht neutral, sondern verzerrt sie.
