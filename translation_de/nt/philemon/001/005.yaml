source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: de
  text: weil ich von deiner Liebe und deinem Glauben höre, die du gegenüber dem Herrn Jesus und allen Heiligen hast.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß ausdrücklich zugeordnet: „weil ich von deinem Glauben an den Herrn Jesus und von deiner Liebe zu allen Heiligen höre“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „deiner Liebe und deiner Treue“. Das griechische Wort kann Glaube, Vertrauen oder Treue bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: weil ich … höre
  rationale: Das Partizip knüpft begründend an den vorausgehenden Dank an; die finite Wiedergabe ist im Deutschen natürlich und bewahrt den Präsenssinn.
- source_word: ἀγάπην
  choice: Liebe
  rationale: Die übliche und kontextgemäße Wiedergabe von ἀγάπη.
- source_word: πίστιν
  choice: Glauben
  rationale: Bewahrt die Standardbedeutung von πίστις; die mögliche Nuance „Treue“ wird in einer Fußnote genannt.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: dem Herrn Jesus entgegenbringst
  rationale: Gibt die personale Ausrichtung von πρός idiomatisch wieder und unterscheidet sie sprachlich von der folgenden εἰς-Verbindung.
- source_word: κύριον
  choice: Herrn
  rationale: Entspricht dem etablierten christologischen Titel κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: allen Heiligen erweist
  rationale: Gibt die Ausrichtung auf die gesamte Gemeinschaft der Glaubenden in natürlichem Deutsch wieder, ohne die Bezeichnung ἅγιοι zu paraphrasieren.
- source_word: ἁγίους
  choice: Heiligen
  rationale: Bewahrt die knappe, etablierte paulinische Gemeinschaftsbezeichnung.
theological_decisions:
- issue: Zuordnung von „Liebe“ und „Glauben“ zu den beiden Präpositionalgruppen
  choice: 'Die Oberflächenstruktur bleibt erhalten: Beide Substantive stehen vor einem Relativsatz, dessen zwei verbale Ergänzungen auf den Herrn Jesus und auf alle Heiligen ausgerichtet sind.'
  alternative: 'Dem Sinn nach ausdrücklich verteilen: „deinen Glauben an den Herrn Jesus und deine Liebe zu allen Heiligen“.'
  rationale: Die distributive Deutung ist sachlich wahrscheinlich und passt zum paulinischen Sprachgebrauch, doch die griechische Syntax ordnet die beiden Substantive nicht ausdrücklich jeweils einer Präpositionalgruppe zu. Der Haupttext bewahrt daher die Spannung; die explizite Deutung steht in der Fußnote.
- issue: Bedeutungsumfang von πίστις
  choice: Glauben
  alternative: Treue
  rationale: „Glauben“ ist die sachgerechte Standardwiedergabe; da πίστις hier auch den Aspekt der Treue einschließen kann, wird diese Möglichkeit als lexikalische Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung folgt dem griechischen Satzfluss, vermeidet jedoch die im Deutschen missverständliche Aussage, Glaube werde den Heiligen entgegengebracht. Die durch die Syntax verbleibende Zuordnungsfrage wird nicht stillschweigend dogmatisch entschieden, sondern in Fußnote [a] offengelegt.
