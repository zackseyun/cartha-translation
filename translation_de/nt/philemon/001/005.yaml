- from: weil ich von deiner Liebe und deinem Glauben höre, die du dem Herrn Jesus entgegenbringst und allen Heiligen erweist.[a][b]
  to: weil ich von deiner Liebe und deinem Glauben höre, die du gegenüber dem Herrn Jesus und allen Heiligen hast.[a][b]
  rationale: Die Revision ersetzt die semantisch widersprüchliche Doppelverbkonstruktion durch „hast“, das dem griechischen ἣν ἔχεις direkt entspricht. „Gegenüber dem Herrn Jesus und allen Heiligen“ hält die beiden Bezugsgruppen im Haupttext gemeinsam, ohne die wahrscheinliche distributive Lesart vorwegzunehmen; diese bleibt transparent in Fußnote [a] dokumentiert.
