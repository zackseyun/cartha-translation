id: PHM.1.25
reference: Philemon 1:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: de
  text: Die Gnade des Herrn Jesus Christus sei mit eurem Geist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Eurem“ steht im Plural; der Schlusssegen gilt somit nicht nur Philemon, sondern allen Empfängern des Briefes.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ ist die etablierte und sachlich passende deutsche Wiedergabe des paulinischen Segensbegriffs für Gottes unverdiente Zuwendung.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ bewahrt den titelartigen und christologischen Gehalt von κύριος in dieser Segensformel.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: Im Deutschen ist „Jesus Christus“ die natürliche, würdevolle Wiedergabe; „Christus“ bleibt dabei als Titel erkennbar und wirkt hier nicht bloß wie ein Familienname.
- source_word: μετὰ
  choice: sei mit
  rationale: Das griechische μετὰ bedeutet „mit“; das im Griechischen ausgelassene Verb wird im Deutschen für einen natürlichen Segenswunsch mit „sei“ ergänzt.
- source_word: πνεύματος
  choice: Geist
  rationale: Der Zusammenhang und das Possessivpronomen sprechen für den menschlichen Geist beziehungsweise das innere Wesen der Empfänger; die Formulierung bleibt knapp und deutet nicht weiter aus.
- source_word: ὑμῶν
  choice: eurem
  rationale: „Eurem“ gibt die zweite Person Plural im Deutschen ausdrücklich wieder und zeigt, dass der Schlusssegen über Philemon hinaus den versammelten Empfängern gilt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Schlusssegnung
  choice: Christus
  alternative: Messias
  rationale: „Christus“ ist im modernen deutschen Bibelregister die natürliche Form des Titels in der festen Verbindung „Jesus Christus“. Der Titelgehalt wird bewahrt, ohne die geläufige Segensformel unnötig zu verfremden.
- issue: Bezug von πνεύματος in „mit eurem Geist“
  choice: menschlicher Geist beziehungsweise inneres Wesen der Empfänger
  alternative: Heiliger Geist
  rationale: Das Possessivpronomen „eurem“ legt den Geist der Empfänger nahe. Die Kleinschreibung vermeidet es, gegen den unmittelbaren Wortlaut einen ausdrücklichen Bezug auf den Heiligen Geist einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Segensform wird beibehalten; zugleich macht „eurem“ die im Griechischen ausdrückliche Mehrzahl sichtbar.
