base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: de
  text: Im Vertrauen auf deinen Gehorsam habe ich dir geschrieben; ich weiß ja, dass du sogar mehr tun wirst, als ich sage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über das hinaus, was ich sage“; auch: „über das hinaus, worüber ich spreche“. Paulus deutet möglicherweise an, dass Philemon mehr tun wird als das, worum er ausdrücklich gebeten hat; worin dieses Mehr besteht, sagt der Text jedoch nicht.'
    reason: Lexikalische Alternative und bewusste inhaltliche Offenheit von ὑπὲρ ἃ λέγω.
lexical_decisions:
- source_word: πεποιθὼς
  choice: Im Vertrauen
  rationale: Das Perfektpartizip bezeichnet einen gefestigten Zustand des Vertrauens. Die Wendung ist im Deutschen natürlich und bewahrt die einleitende, begründende Funktion des Partizips.
- source_word: τῇ ὑπακοῇ σου
  choice: auf deinen Gehorsam
  rationale: ὑπακοή bezeichnet Gehorsam beziehungsweise bereitwilliges Eingehen auf eine Weisung. „Gehorsam“ erhält die im Wort liegende Autoritäts- und Beziehungsdimension, ohne zusätzlichen Zwang in den Text hineinzulesen.
- source_word: ἔγραψά σοι
  choice: habe ich dir geschrieben
  rationale: Der Aorist wird als deutsches Perfekt wiedergegeben, das in einem Brief natürlich klingt und den vollzogenen Schreibakt bezeichnet.
- source_word: εἰδὼς
  choice: denn ich weiß
  rationale: Das adverbiale Perfektpartizip drückt das sichere Wissen aus, das Paulus beim Schreiben begleitet. Ein begründender Hauptsatz ist im modernen Deutschen klar und idiomatisch.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: sogar mehr …, als ich sage
  rationale: ὑπέρ mit Akkusativ bedeutet hier „über das hinaus, was“ beziehungsweise „mehr als“. Die Formulierung bewahrt die Erwartung, dass Philemon die ausdrücklich genannte Bitte übertreffen wird, ohne die zusätzliche Handlung zu bestimmen.
- source_word: ποιήσεις
  choice: du … tun wirst
  rationale: Das Futur von ποιέω bleibt bewusst allgemein. „Tun“ erhält diese Offenheit und legt nicht fest, worin das erwartete Handeln besteht.
theological_decisions:
- issue: Bedeutung von ὑπακοή im Verhältnis zu Paulus’ Bitte
  choice: „Gehorsam“
  alternative: „Entgegenkommen“ oder „Bereitschaft zu folgen“
  rationale: Der Ausgangstext verwendet ausdrücklich ὑπακοή. „Gehorsam“ bewahrt die Spannung zwischen Paulus’ persönlicher Bitte und seiner apostolischen Autorität, ohne daraus eine ausdrückliche Drohung oder einen Zwang abzuleiten.
- issue: Andeutung in „mehr …, als ich sage“
  choice: Die erwartete zusätzliche Handlung bleibt unbestimmt.
  alternative: Eine ausdrückliche Aufforderung zur Freilassung des Onesimus oder lediglich zu einer besonders großzügigen Aufnahme
  rationale: Paulus formuliert suggestiv, nennt aber nicht, was Philemon zusätzlich tun soll. Die Übersetzung löst diese theologisch und historisch diskutierte Offenheit nicht auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Perfekt entspricht natürlichem deutschem Briefstil; die Satzgliederung löst die griechischen Partizipien lesefreundlich auf, ohne ihre logischen Beziehungen oder Paulus’ zuversichtlichen Ton abzuschwächen.
