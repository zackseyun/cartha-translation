revisions:
- from: Im Vertrauen auf deinen Gehorsam habe ich dir geschrieben, denn ich weiß, dass du sogar mehr tun wirst, als ich sage.[a]
  to: Im Vertrauen auf deinen Gehorsam habe ich dir geschrieben; ich weiß ja, dass du sogar mehr tun wirst, als ich sage.[a]
  rationale: Die Revision ersetzt die kausale Konjunktion durch eine im Deutschen natürliche, nichtkausale Satzverbindung. Dadurch bleibt εἰδώς als Ausdruck von Paulus’ begleitender Gewissheit erhalten. Die offene Erwartung eines nicht näher bestimmten Mehrhandelns und die Terminologie „Gehorsam“ bleiben unverändert.
