id: PHM.1.11
reference: Philemon 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: de
  text: der dir früher nutzlos war[a], jetzt aber dir und mir nützlich ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus spielt hier wahrscheinlich auf den Namen Onesimus an, der mit der Vorstellung verbunden ist, nützlich oder hilfreich zu sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: der
  rationale: Der substantivisch-anaphorische Artikel nimmt Onesimus aus dem vorherigen Vers auf; im Deutschen führt ein Relativpronomen den Satz natürlich weiter.
- source_word: ποτέ
  choice: früher
  rationale: Bezeichnet den früheren Zustand knapp und bildet einen klaren zeitlichen Gegensatz zu νυνί.
- source_word: σοι
  choice: dir
  rationale: Der Dativ wird im persönlichen Zusammenhang direkt mit „dir“ wiedergegeben.
- source_word: ἄχρηστον
  choice: nutzlos
  rationale: Gibt die Grundbedeutung verständlich wieder und bewahrt sowohl den Gegensatz zu εὔχρηστον als auch das wahrscheinliche Wortspiel mit dem Namen Onesimus.
- source_word: νυνὶ δὲ
  choice: jetzt aber
  rationale: Bewahrt den betonten zeitlichen und adversativen Gegensatz zu ποτέ.
- source_word: σοὶ καὶ ἐμοὶ
  choice: dir und mir
  rationale: Gibt beide koordinierten Dative prägnant und ausgewogen wieder; das deutsche „und“ trägt die Paarung ohne einen ergänzten Ausdruck wie „beiden“.
- source_word: εὔχρηστον
  choice: nützlich
  rationale: Ist das direkte moderne Gegenstück zu „nutzlos“ und erhält das wahrscheinliche Namenswortspiel.
theological_decisions:
- issue: Mögliches Wortspiel mit dem Namen Onesimus und Veränderung seines Verhältnisses zu Paulus und Philemon
  choice: Den schlichten Gegensatz „nutzlos/nützlich“ im Haupttext bewahren
  alternative: Das Wortspiel durch eine erklärende oder verstärkende Formulierung im Haupttext ausdrücklich hervorheben
  rationale: Der griechische Text formuliert den Gegensatz selbst, erklärt das Namenswortspiel jedoch nicht ausdrücklich. Die direkte Wiedergabe bewahrt die literarische Wirkung, ohne die Aussage interpretierend auszubauen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Früher … jetzt aber“ bildet den Kontrast natürlich ab; „nutzlos/nützlich“ erhält die auffällige Wortverbindung und vermeidet das heute wirtschaftlich oder altertümlich klingende „unnütz/nutzbringend“.
