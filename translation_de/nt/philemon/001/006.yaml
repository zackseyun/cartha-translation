id: PHM.1.6
reference: Philemon 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: de
  text: damit die Gemeinschaft deines Glaubens in der Erkenntnis alles Guten in uns im Blick auf Christus wirksam wird.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Teilhabe an deinem Glauben“, „die Gemeinschaft, die aus deinem Glauben entsteht“, beziehungsweise „das Weitergeben deines Glaubens“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort für „Glauben“ kann je nach Zusammenhang auch „Vertrauen“ oder „Treue“ bedeuten.
    reason: alternative_reading
  - marker: c
    text: Einige Handschriften lesen „in euch“ statt „in uns“; im unmittelbaren Zusammenhang könnte dies auf Philemon bezogen im Deutschen auch mit „in dir“ wiedergegeben werden.
    reason: textual_variant
  - marker: d
    text: 'Oder: „für Christus“ beziehungsweise „auf Christus hin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck bzw. das erbetene Ergebnis von Paulus’ Gebet ein und gibt die finale Bedeutung natürlich wieder.
- source_word: κοινωνία τῆς πίστεώς σου
  choice: die Gemeinschaft deines Glaubens
  rationale: „Gemeinschaft“ bewahrt die Bandbreite von κοινωνία zwischen Teilhabe, Gemeinschaft und Mitteilung, ohne die schwierige Genitivverbindung vorschnell auf das aktive Weitergeben des Glaubens festzulegen.
- source_word: πίστεώς
  choice: Glaubens
  rationale: Bezeichnet hier am ehesten Philemons Glauben; die mögliche Nuance von Treue oder Vertrauen bleibt in einer Fußnote erhalten.
- source_word: ἐνεργὴς γένηται
  choice: wirksam wird
  rationale: Gibt das Werden bzw. Sich-Erweisen als tätig und wirksam knapp und idiomatisch wieder.
- source_word: ἐν ἐπιγνώσει
  choice: in der Erkenntnis
  rationale: Entspricht der Präposition ἐν eng und lässt offen, ob Erkenntnis den Bereich oder das Mittel der Wirksamkeit bezeichnet.
- source_word: παντὸς ἀγαθοῦ
  choice: all des Guten
  rationale: Gibt den substantivierten Singular umfassend und in natürlichem, würdigem Deutsch wieder.
- source_word: τοῦ ἐν ἡμῖν
  choice: das in uns
  rationale: Folgt dem SBLGNT-Text ἡμῖν und bezieht den Relativsatz auf „all das Gute“; eine bedeutende Variante liest „in euch/dir“.
- source_word: εἰς Χριστόν
  choice: auf Christus hin
  rationale: Bewahrt die schwer eindeutig festzulegende Ziel- und Bezugsrichtung von εἰς besser als ein glättendes „für“.
theological_decisions:
- issue: Bedeutung von κοινωνία τῆς πίστεώς σου
  choice: „die Gemeinschaft deines Glaubens“ mit bewusst offener Bedeutung
  alternative: „das Weitergeben deines Glaubens“, „die Teilhabe an deinem Glauben“ oder „die durch deinen Glauben bewirkte Gemeinschaft“
  rationale: Die Wendung ist syntaktisch und semantisch umstritten. Die Hauptfassung bewahrt ihre gemeinschaftliche und aktive Bedeutungsbreite, statt sie ausschließlich als Evangelisation oder als innere Gemeinschaft zu deuten.
- issue: Bezug von ἐν ἐπιγνώσει
  choice: „in der Erkenntnis“
  alternative: „durch die Erkenntnis“
  rationale: Der griechische Ausdruck kann sphärisch oder instrumental verstanden werden. Die formal nähere Fassung vermeidet eine unnötige Festlegung.
- issue: Referent von ἐν ἡμῖν
  choice: „in uns“ gemäß dem gedruckten SBLGNT-Text
  alternative: „in euch“ beziehungsweise kontextbezogen „in dir“ nach einer Textvariante
  rationale: Die Hauptfassung folgt der angegebenen Ausgangsausgabe und lässt das „uns“ kollektiv auf Paulus, Philemon und weitere Glaubende bezogen sein.
- issue: Bedeutung von εἰς Χριστόν
  choice: „auf Christus hin“ als Ziel- oder Bezugsrichtung
  alternative: „für Christus“ oder „im Blick auf Christus“
  rationale: Die knappe Präpositionalphrase ist mehrdeutig. „Auf Christus hin“ erhält ihre theologische Spannung und vermeidet eine zu enge Zweckdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung „Gemeinschaft deines Glaubens“ ist bewusst beibehalten, weil auch der griechische Ausdruck mehrdeutig ist. „Auf Christus hin“ klingt leicht gehoben, bildet aber die offene Zielrichtung von εἰς Χριστόν präziser ab als eine stärker deutende Glättung.
