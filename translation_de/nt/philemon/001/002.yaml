  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: de
  text: 'und an die Schwester Apphia[a] und an Archippus, unseren Mitstreiter, und an die Gemeinde in deinem Haus:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „unsere Schwester“ statt „die Schwester“.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Apphia
  rationale: Der Personenname wird gemäß der im Deutschen üblichen Form wiedergegeben.
- source_word: τῇ ἀδελφῇ
  choice: die Schwester
  rationale: Die vorliegende SBLGNT-Lesart enthält den bestimmten Artikel, aber kein ἡμῶν („unsere“). Die Wiedergabe bewahrt daher die auffällige Formulierung des Ausgangstextes, statt die textkritische Variante in den Haupttext aufzunehmen.
- source_word: Ἀρχίππῳ
  choice: Archippus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: τῷ συστρατιώτῃ ἡμῶν
  choice: unseren Mitstreiter
  rationale: „Mitstreiter“ erhält das militärische Bild des griechischen Kompositums und gibt ἡμῶν ausdrücklich mit „unseren“ wieder.
- source_word: τῇ κατ’ οἶκόν σου ἐκκλησίᾳ
  choice: die Gemeinde in deinem Haus
  rationale: „Gemeinde“ ist im deutschen neutestamentlichen Sprachgebrauch die natürliche Bezeichnung für die örtliche christliche Gemeinschaft. „In deinem Haus“ bleibt nahe am Griechischen, ohne das Treffen der Gemeinde ausdrücklich hinzuzufügen.
- source_word: καὶ
  choice: und / an
  rationale: Die additive Struktur der Empfängerliste bleibt erhalten; vor Archippus wird das im Deutschen aus dem Zusammenhang klare „an“ wiederholt, während ein zusätzliches „und“ dort zur Vermeidung einer schwerfälligen Reihung entfällt.
theological_decisions:
- issue: Ob ἀδελφῇ aufgrund einer Textvariante und vertrauter Übersetzungstradition mit „unsere Schwester“ wiederzugeben ist
  choice: die Schwester
  alternative: unsere Schwester
  rationale: Der angegebene SBLGNT-Haupttext lautet τῇ ἀδελφῇ ohne ἡμῶν. Deshalb folgt der Haupttext dieser Lesart; die abweichende Überlieferung wird in einer Fußnote dokumentiert. So wird die christliche Verwandtschaftssprache nicht durch eine textlich umstrittene Ergänzung geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anredeform „die Schwester“ klingt bewusst etwas markiert, weil sie die vorgegebene griechische Hauptlesart ohne harmonisierende Ergänzung wiedergibt. Der Doppelpunkt führt den in Vers 3 folgenden Gruß weiter.
