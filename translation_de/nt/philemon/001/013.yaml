revisions:
- from: Ihn wollte ich gern bei mir behalten, damit er mir an deiner Stelle dient, während ich für das Evangelium in Fesseln bin.
  to: Ihn wollte ich bei mir behalten, damit er mir an deiner Stelle Dienst leistet, während ich in den Fesseln des Evangeliums bin[a].
  rationale: Die Revision entfernt die nicht ausdrücklich bezeichnete Nuance „gern“, gestaltet den Dienst idiomatisch und bewahrt bei der Schlusswendung die Ambiguität des griechischen Genitivs. Die Fußnote bietet die wahrscheinliche kausale Deutung transparent an, ohne sie zur alleinigen Aussage des Haupttexts zu machen.
