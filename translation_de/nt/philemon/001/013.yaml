  timestamp: '2026-07-15T03:44:17Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft den Rückbezug auf Onesimus, Paulus’ Wunsch, das Behalten bei sich, den Zweck und den stellvertretenden Charakter des Dienstes gut. Mit „während ich für das Evangelium in Fesseln bin“ wird jedoch sowohl das ἐν als auch der bewusst knappe, hinsichtlich des Genitivs nicht völlig festgelegte Ausdruck τοῖς δεσμοῖς τοῦ εὐαγγελίου stärker ausgelegt als nötig.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „gern“ ist bei „wollte“ nicht erforderlich und fügt eine Nuance hinzu. Eine vorsichtigere Wiedergabe der Schlusswendung mit erklärender Fußnote wahrt zugleich Verständlichkeit und die griechische Offenheit.
  terminology: „an deiner Stelle“ gibt den kontextuell naheliegenden repräsentativen Sinn von ὑπὲρ σοῦ angemessen wieder. „Dienst leisten“ ist für διακονῇ idiomatischer als das hier etwas formelhafte „dient“. „Fesseln“ bewahrt die konkrete Bildsprache von δεσμοί.
  issues:
  - severity: medium
    issue: Die Schlusswendung legt τοῦ εὐαγγελίου kausal fest.
    rationale: „für das Evangelium in Fesseln“ bedeutet eindeutig, dass die Fesseln wegen des Evangeliums getragen werden. Der Genitiv kann zwar so verstanden werden, ist aber im griechischen Wortlaut kompakter und nicht ausdrücklich kausal bestimmt. Die Übersetzung sollte diese Auslegung nicht ohne Kennzeichnung festschreiben.
  - severity: low
    issue: „gern“ ergänzt den Ausdruck ἐβουλόμην.
    rationale: βούλομαι bezeichnet Wunsch bzw. Absicht; „gern“ ist möglich, aber nicht im Ausgangstext eigens markiert und kann ohne Verlust entfallen.
  revised_text: Ihn wollte ich bei mir behalten, damit er mir an deiner Stelle Dienst leistet, während ich in den Fesseln des Evangeliums bin[a].
