id: PHM.1.13
reference: Philemon 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: de
  text: Ihn wollte ich bei mir behalten, damit er mir an deiner Stelle Dienst leistet, während ich in den Fesseln des Evangeliums bin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während ich wegen des Evangeliums in Fesseln bin“. Die griechische Wendung kann die Fesseln als mit dem Evangelium verbunden oder als wegen des Evangeliums getragen bezeichnen.'
    reason: Der Genitiv τοῦ εὐαγγελίου ist auslegungsfähig; die Fußnote dokumentiert die kausale Deutung, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: ὃν
  choice: Ihn
  rationale: Das Akkusativpronomen bezieht sich auf Onesimus; im Deutschen ist ein selbstständiger Hauptsatz mit „Ihn“ natürlich und bewahrt zugleich den Rückbezug.
- source_word: ἐβουλόμην
  choice: wollte ich gern
  rationale: Der Imperfekt bezeichnet den damaligen Wunsch beziehungsweise die Absicht des Paulus. „wollte ich gern“ gibt diesen Wunsch idiomatisch wieder, ohne eine nicht ausgedrückte Endentscheidung vorwegzunehmen.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: bei mir behalten
  rationale: Die Verbindung meint, Onesimus in der eigenen Nähe zu behalten. „bei mir behalten“ ist natürliches modernes Deutsch und trifft sowohl κατέχειν als auch πρὸς ἐμαυτόν.
- source_word: ἵνα
  choice: damit
  rationale: „damit“ gibt den finalen Sinn der Konjunktion knapp und klar wieder.
- source_word: ὑπὲρ σοῦ
  choice: an deiner Stelle
  rationale: Im Zusammenhang bezeichnet ὑπέρ, dass Onesimus den Dienst leistet, den Philemon Paulus sonst selbst hätte erweisen können. „an deiner Stelle“ bringt den repräsentativen Sinn deutlicher zum Ausdruck als das mehrdeutige „für dich“.
- source_word: μοι διακονῇ
  choice: er mir … dient
  rationale: διακονέω bezeichnet hier persönliche Hilfe beziehungsweise Dienst. „dient“ ist würdig und verständlich, ohne den Ausdruck unnötig auf ein kirchliches Amt festzulegen.
- source_word: ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου
  choice: während ich für das Evangelium in Fesseln bin
  rationale: Die Wendung bezeichnet die Gefangenschaft des Paulus und ihre Ursache beziehungsweise Verbindung mit dem Evangelium. Der deutsche Temporalsatz ist natürlich und macht den situativen Sinn von ἐν deutlich.
theological_decisions:
- issue: Bezug und Sinn von τοῦ εὐαγγελίου bei δεσμοῖς
  choice: für das Evangelium in Fesseln
  alternative: in den Fesseln des Evangeliums
  rationale: 'Der Genitiv verbindet die Fesseln mit der Verkündigung des Evangeliums und ist wahrscheinlich kausal zu verstehen: Paulus ist wegen seines Dienstes am Evangelium gefangen. Die wörtlichere Form „Fesseln des Evangeliums“ wäre im heutigen Deutsch missverständlich und könnte so klingen, als fessele das Evangelium selbst ihn.'
- issue: Bedeutung von ὑπὲρ σοῦ
  choice: an deiner Stelle
  alternative: für dich / deinetwegen
  rationale: Der Kontext legt einen stellvertretenden Dienst nahe, ohne daraus eine weitergehende soteriologische Aussage zu machen. „an deiner Stelle“ bewahrt diese konkrete relationale Aussage.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satz folgt der Hervorhebung von ὃν durch das vorangestellte „Ihn“, vermeidet jedoch eine im Deutschen schwer verständliche wörtliche Nachbildung von „Fesseln des Evangeliums“.
