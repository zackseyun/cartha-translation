  - marker: a
    text: 'Oder: „während ich wegen des Evangeliums in Fesseln bin“. Die griechische Wendung kann die Fesseln als mit dem Evangelium verbunden oder als wegen des Evangeliums getragen bezeichnen.'
    reason: Der Genitiv τοῦ εὐαγγελίου ist auslegungsfähig; die Fußnote dokumentiert die kausale Deutung, ohne sie im Haupttext festzulegen.
