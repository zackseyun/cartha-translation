id: PHM.1.20
reference: Philemon 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: de
  text: Ja, Bruder, lass mich im Herrn Nutzen von dir haben[a]. Erfrische mein Herz[b] im Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »lass mich von dir profitieren« oder »lass mich Freude an dir haben«. Paulus spielt möglicherweise mit dem Namen Onesimus und dem Gedanken des Nutzens oder der Nützlichkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mein Innerstes« beziehungsweise »meine Eingeweide«; im Griechischen eine Bezeichnung für tiefe Empfindungen und das innere Wesen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: »in Christus«. Das griechische Χριστός ist hier als Titel »Messias« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Ja
  rationale: Leitet die persönliche Bitte mit warmer Bekräftigung ein und entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Die männliche Singularform redet Philemon unmittelbar als Glaubensbruder an.
- source_word: ἐγώ σου ὀναίμην
  choice: lass mich Nutzen von dir haben
  rationale: Bewahrt den Wunsch- und Bittecharakter des Optativs sowie die Bedeutung von ὀνίνημι als Nutzen oder Vorteil haben. Die etwas markante Formulierung lässt zudem das mögliche Wortspiel mit Onesimus erkennen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Gibt die paulinische Wendung knapp und in etabliertem, würdigem Deutsch wieder.
- source_word: ἀνάπαυσόν
  choice: erquicke
  rationale: Bezeichnet hier das konkrete Stärken, Aufatmenlassen oder Zur-Ruhe-Bringen und greift die entsprechende Aussage aus Vers 7 auf.
- source_word: μου τὰ σπλάγχνα
  choice: mein Herz
  rationale: Das wörtliche Bild der inneren Organe bezeichnet idiomatisch das Innerste, besonders tiefe Empfindungen. »Herz« ist dafür im Deutschen natürlich und verständlich.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Bewahrt den Titelsinn von Χριστός und bezeichnet zugleich den Bereich der Verbundenheit, in dem die erbetene Ermutigung geschehen soll.
theological_decisions:
- issue: Wiedergabe von Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Χριστός ist seinem Ursprung und seiner Funktion nach ein Titel. »Messias« macht diesen Titelsinn sichtbar, ohne die Aussage weiter auszudeuten.
- issue: Wiedergabe von κυρίῳ
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« entspricht dem üblichen paulinischen Titelgebrauch und vermeidet, in diesem Satz unnötig einen engeren Herr-Sklave-Sinn einzutragen.
- issue: Verhältnis der Wendungen ἐν κυρίῳ und ἐν Χριστῷ
  choice: Beide Wendungen bleiben eigenständig erhalten
  alternative: Beide vereinheitlichen oder frei zu »als Glaubensbrüder« umschreiben
  rationale: Die Wiederholung rahmt sowohl die Bitte als auch ihre Erfüllung theologisch ein. Eine Vereinheitlichung würde die sprachliche Gestalt des griechischen Textes einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewöhnliche Wendung »Nutzen von dir haben« bleibt bewusst nahe am griechischen Ausdruck und erhält das mögliche Wortspiel mit Onesimus. »Erquicke« ist gehoben, aber geläufig genug und bewahrt den Anschluss an die Bildsprache des Zur-Ruhe-Bringens.
