source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: de
  text: 'Ich, Paulus, schreibe dies mit eigener Hand: Ich werde es zurückzahlen – um nicht zu erwähnen, dass du mir auch dich selbst schuldest.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Etwas formaler: »Ich, Paulus, habe mit meiner eigenen Hand geschrieben: Ich werde es zurückzahlen; um dir nicht zu sagen, dass du mir auch dich selbst schuldest.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: schreibe
  rationale: Der Aorist bedeutet formal »schrieb« bzw. »habe geschrieben«. Im brieflichen Kontext ist das deutsche Präsens natürlich, wenn Paulus die Aufmerksamkeit auf die eigenhändig geschriebene Erklärung lenkt, die der Empfänger gerade liest.
- source_word: τῇ ἐμῇ χειρί
  choice: mit eigener Hand
  rationale: Die geläufige deutsche Wendung bezeichnet das eigenhändige Schreiben und unterstreicht die persönliche Verbindlichkeit der Zusage.
- source_word: ἀποτίσω
  choice: Ich werde es zurückzahlen
  rationale: Das Futur formuliert eine verbindliche Zusage, für den im vorherigen Vers genannten Schaden oder die Schuld aufzukommen.
- source_word: ἵνα μὴ λέγω σοι
  choice: um dir nicht zu sagen
  rationale: 'Die Formulierung bewahrt die grammatische Gestalt und zugleich die taktvolle Ironie: Paulus behauptet, etwas nicht sagen zu wollen, während er es tatsächlich erwähnt.'
- source_word: καὶ σεαυτόν
  choice: sogar dich selbst
  rationale: »Sogar« gibt die hervorhebende Kraft von καί wieder; »dich selbst« erhält die starke persönliche Aussage, ohne die Art der Schuld näher festzulegen.
- source_word: προσοφείλεις
  choice: darüber hinaus … schuldest
  rationale: Das Verb bezeichnet ein zusätzliches Schuldigsein. »Darüber hinaus« macht diese additive Nuance ausdrücklich und verständlich.
theological_decisions:
- issue: Art von Philemons persönlicher Schuld gegenüber Paulus
  choice: Die starke, aber nicht näher bestimmte persönliche Schuld bleibt im Haupttext stehen.
  alternative: Die Schuld ausdrücklich als Bekehrung, Rettung, Lebensrettung oder allgemein als Lebensschuld erklären.
  rationale: Der griechische Text nennt den Grund der Schuld nicht. Eine nähere Bestimmung würde eine historische oder theologische Deutung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Spannung der Wendung ἵνα μὴ λέγω σοι bleibt erhalten; der Gedankenstrich bildet den taktvoll-ironischen Nachsatz ab. Der Fußnotenmarker steht im Haupttext.
