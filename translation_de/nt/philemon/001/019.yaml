  source_fidelity: Der Entwurf gibt die persönliche Schreibgarantie, die Rückzahlungszusage und die bewusst nicht spezifizierte persönliche Verschuldung Philemons grundsätzlich zutreffend wieder. Die Kombination „darüber hinaus sogar“ verstärkt jedoch die additive Aussage von προσοφείλεις und καί unnötig doppelt.
  naturalness: „Um dir nicht zu sagen“ ist verständlich, aber „um nicht zu erwähnen“ ist im Deutschen die idiomatischere Wiedergabe der rhetorisch-ironischen Formel. „Auch dich selbst schuldest“ klingt dabei natürlicher als die doppelt verstärkte Fassung.
  terminology: „Paulus“, „mit eigener Hand“ und „zurückzahlen“ sind treffend. Die persönliche Schuld bleibt, wie im Griechischen, ohne Festlegung auf Bekehrung, Rettung oder eine andere Deutung.
