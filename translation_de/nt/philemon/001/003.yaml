id: PHM.1.3
reference: Philemon 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: de
  text: Gnade sei mit euch und Frieden von Gott, unserem Vater, und dem Herrn Jesus, dem Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus Christus«. Das griechische Χριστός kann als Titel (»Messias«) oder in manchen Zusammenhängen eher wie ein Namensbestandteil (»Christus«) gebraucht werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Bewahrt sowohl den Grußcharakter als auch das theologische Gewicht des paulinischen Begriffs.
- source_word: ὑμῖν
  choice: sei mit euch
  rationale: Gibt den im Griechischen nominal formulierten Segensgruß in natürlichem, würdigem Deutsch wieder; der Plural »euch« entspricht dem griechischen Dativ Plural.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Bewahrt den üblichen Sinn und den möglichen Anklang an den umfassenden Frieden des hebräischen Schalom.
- source_word: ἀπὸ
  choice: von
  rationale: Kennzeichnet Gott und den Herrn Jesus als Quelle von Gnade und Frieden.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Gott, unserem Vater
  rationale: Versteht »unserem Vater« appositionell zu »Gott« und bildet die natürliche paulinische Wendung im Deutschen ab.
- source_word: κυρίου
  choice: Herrn
  rationale: Bewahrt die ehrende und christologische Aussagekraft von κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: Gibt Ἰησοῦ als Namen und Χριστοῦ in seiner titelhaften Bedeutung wieder; die Apposition ist im Deutschen idiomatisch und wahrt die Kasusbeziehung.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  alternative: Jesus Christus
  rationale: Χριστός bedeutet »Gesalbter/Messias« und kann zugleich zunehmend namensartig gebraucht werden. Der Haupttext macht den Titelgehalt sichtbar; die Fußnote bewahrt die konventionelle, möglicherweise namensnähere Wiedergabe.
- issue: Beziehung der Quellenangabe zu Gott und Jesus
  choice: von Gott, unserem Vater, und dem Herrn Jesus, dem Messias
  alternative: Umformulierung mit getrennten Quellenangaben
  rationale: Die gemeinsame Präposition ἀπό wird nicht aufgespalten; so bleibt die enge syntaktische Zuordnung beider Genitive als Quelle des Segens erhalten, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Brief- und Segensstil. »Gnade sei mit euch« ergänzt ein im Griechischen unausgesprochenes Verb idiomatisch, ohne den Aussagegehalt zu verändern.
