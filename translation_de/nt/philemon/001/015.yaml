  rationale: Die einzige Änderung ersetzt die sprachlich unnatürliche Formulierung „zurückhast“ durch „zurückerhältst“. Dadurch wird der Wiederempfang ausgedrückt, der im Kontext von ἀπέχῃς naheliegt, während die zeitliche Gegenüberstellung und die zurückhaltende Aussageweise des griechischen Textes erhalten bleiben.
