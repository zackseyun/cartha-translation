  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: de
  text: Denn vielleicht wurde er gerade deshalb für eine Zeit von dir getrennt, damit du ihn für immer zurückerhältst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging er für eine Weile von dir fort“. Das griechische Passiv „wurde … getrennt“ vermeidet möglicherweise taktvoll eine direkte Schuldzuweisung und lässt zugleich Raum für einen angedeuteten göttlichen Plan.'
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: vielleicht
  rationale: Bewahrt die vorsichtige, zurückhaltende Vermutung des Paulus, ohne Gewissheit auszudrücken.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet natürlich und klar die begründende Verbindung zum vorhergehenden Vers.
- source_word: διὰ τοῦτο
  choice: gerade deshalb
  rationale: Gibt den Bezug auf den möglichen Zweck beziehungsweise Grund wieder; „gerade“ hebt diesen Zusammenhang hervor, ohne ihn als sicher zu behaupten.
- source_word: ἐχωρίσθη
  choice: wurde … getrennt
  rationale: Bewahrt das griechische Passiv und legt weder Onesimus noch Gott ausdrücklich als Handelnden fest.
- source_word: πρὸς ὥραν
  choice: für eine Zeit
  rationale: Gibt die idiomatische Bedeutung eines begrenzten Zeitraums wieder und erhält den Gegensatz zu „für immer“.
- source_word: ἵνα
  choice: damit
  rationale: Drückt den im griechischen Text bezeichneten Zweck beziehungsweise das beabsichtigte Ergebnis aus.
- source_word: αἰώνιον
  choice: für immer
  rationale: Das Adjektiv wird hier sinngemäß adverbial wiedergegeben und bezeichnet im Gegensatz zur zeitweiligen Trennung einen bleibenden Wiedergewinn.
- source_word: αὐτὸν
  choice: ihn
  rationale: Bezieht sich als direktes Objekt auf Onesimus.
- source_word: ἀπέχῃς
  choice: zurückhast
  rationale: Gibt im Kontext den Gedanken wieder, Onesimus nach der Trennung wieder und nun bleibend bei sich zu haben.
theological_decisions:
- issue: Die im Passiv ἐχωρίσθη offenbleibende Urheberschaft
  choice: Das Passiv „wurde … getrennt“ wird beibehalten, ohne einen Handelnden zu nennen.
  alternative: „Er ging von dir fort“ oder „Gott trennte ihn von dir“
  rationale: Die Formulierung kann Onesimus’ Verantwortung taktvoll im Hintergrund lassen und zugleich auf göttliche Vorsehung hindeuten, ohne sie ausdrücklich festzustellen. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt eng am griechischen Satzbau, klingt aber natürlich; „zurückhast“ macht den Wiedergewinn im Zusammenhang deutlich.
