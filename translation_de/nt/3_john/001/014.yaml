lexical_decisions:
- source_word: ἐλπίζω
  choice: Ich hoffe
  rationale: Das Präsens bezeichnet hier die persönliche Hoffnung beziehungsweise Erwartung des Schreibers und entspricht natürlichem deutschem Briefstil.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen leichten Gegensatz beziehungsweise Übergang gegenüber dem zuvor erwähnten Schreiben; „aber“ bewahrt diese Gedankenwendung.
- source_word: εὐθέως
  choice: bald
  rationale: Im Zusammenhang eines geplanten Besuchs bezeichnet εὐθέως zeitliche Nähe, nicht notwendig augenblickliches Handeln.
- source_word: σε ἰδεῖν
  choice: dich zu sehen
  rationale: Die Formulierung gibt die Infinitivkonstruktion unmittelbar wieder, ohne sie deutender als „dich zu besuchen“ zu übersetzen.
- source_word: στόμα πρὸς στόμα
  choice: von Angesicht zu Angesicht
  rationale: Die wörtliche Wendung „Mund zu Mund“ bezeichnet hier ein unmittelbares persönliches Gespräch; die gewählte deutsche Entsprechung ist verständlich und würdig.
- source_word: λαλήσομεν
  choice: werden wir … miteinander sprechen
  rationale: Das Futur kündigt das erwartete Gespräch an. „Miteinander sprechen“ macht den wechselseitigen Gesprächscharakter im Deutschen natürlich deutlich.
