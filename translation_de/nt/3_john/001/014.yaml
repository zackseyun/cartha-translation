translation:
  language: de
  text: Ich hoffe aber, dich bald zu sehen, und wir werden von Angesicht zu Angesicht[a] miteinander sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mund zu Mund“. Gemeint ist ein unmittelbares persönliches Gespräch.'
