source:
  edition: SBLGNT
  text: Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατ’ ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: de
  text: Friede sei mit dir.[a] Die Freunde grüßen dich. Grüße die Freunde mit Namen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Friede dir.“ Der griechische Ausdruck ist eine knappe briefliche Segensformel.'
    reason: lexical_alternative
  - marker: b
    text: 'Das kann auch bedeuten: „Grüße die Freunde einzeln“ oder „einen nach dem anderen“. Wörtlich steht im Griechischen „mit Namen“; gemeint ist ein persönlicher Gruß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Friede sei mit dir
  rationale: Die knappe griechische Gruß- und Segensformel lautet wörtlich „Friede dir“. Die gewählte deutsche Form macht das im Griechischen unausgesprochene Verb natürlich und würdig deutlich.
- source_word: ἀσπάζονταί σε
  choice: grüßen dich
  rationale: Das Verb bezeichnet hier den üblichen brieflichen Gruß; „grüßen“ gibt ihn knapp und idiomatisch wieder.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: die Freunde
  rationale: „Freunde“ entspricht φίλοι und bewahrt die auffällige Bezeichnung, ohne sie zu „Brüder“ umzudeuten oder ein im Griechischen fehlendes Possessivpronomen hinzuzufügen.
- source_word: κατ’ ὄνομα
  choice: mit Namen
  rationale: 'Die nahe formale Entsprechung wahrt den persönlichen Akzent: Jeder Einzelne soll namentlich beziehungsweise persönlich gegrüßt werden.'
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem brieflichem Ton. Die Anrede bleibt entsprechend dem griechischen Singular persönlich („dir“, „dich“).
