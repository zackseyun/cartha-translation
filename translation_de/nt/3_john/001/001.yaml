  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: de
  text: Der Älteste an den geliebten Gaius, den ich in Wahrheit[a] liebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufrichtig“; alternativ: „in der Wahrheit“. Die griechische Wendung kann aufrichtige Liebe, eine in der Wahrheit des Evangeliums gegründete Liebe oder beides ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Der Älteste
  rationale: Die substantivierte Bezeichnung dient als Selbstbezeichnung des Absenders. „Der Älteste“ ist im Deutschen natürlich und bewahrt die mögliche Amts- oder Ansehensnuance, ohne den stärker technischen Ausdruck „Presbyter“ einzuführen.
- source_word: Γαΐῳ
  choice: Gaius
  rationale: Der Personenname wird nach der im Deutschen etablierten Form wiedergegeben.
- source_word: τῷ ἀγαπητῷ
  choice: an den geliebten
  rationale: „Geliebten“ gibt die herzliche Anrede wieder und erhält die Wortverbindung zum folgenden Verb ἀγαπῶ („liebe“).
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: den ich liebe
  rationale: Das Relativpronomen wird entsprechend seiner Funktion als Objekt mit „den“ wiedergegeben. Das ausdrückliche ἐγώ erhält durch „ich“ seinen natürlichen Platz, ohne die leichte griechische Betonung künstlich zu verstärken.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die Wendung bewahrt den Wahrheitsbegriff und lässt sowohl aufrichtige Liebe als auch Liebe im Bereich beziehungsweise auf der Grundlage der Wahrheit anklingen. Eine eindeutigere Festlegung wird vermieden.
theological_decisions:
- issue: Bedeutungsweite von ἐν ἀληθείᾳ im johanneischen Sprachgebrauch
  choice: in Wahrheit
  alternative: aufrichtig; in der Wahrheit
  rationale: Der Ausdruck kann die Aufrichtigkeit der Liebe bezeichnen, auf die Wahrheit des Evangeliums verweisen oder beides verbinden. Die Hauptfassung hält diese theologische Spannung offen; die möglichen Verdeutlichungen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antike Briefeinleitung bleibt erhalten. „Der Älteste“ und „der geliebte Gaius“ bewahren den leicht feierlichen Ton sowie die Wiederholung des Wortfelds „lieben“.
