id: 3JN.1.11
reference: 3 John 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: de
  text: Geliebter, ahme nicht das Böse nach, sondern das Gute. Wer Gutes tut, ist aus Gott; wer Böses tut, hat Gott nicht gesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Partizipien können fortgesetztes oder charakteristisches Handeln hervorheben: wörtlich auch „der Gutes Tuende … der Böses Tuende“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Geliebter
  rationale: Der substantivierte Vokativ Singular ist eine herzliche persönliche Anrede und bewahrt den johanneischen Sprachklang. „Lieber Freund“ wäre geläufiger, aber weniger eng am Ausdruck.
- source_word: μὴ μιμοῦ
  choice: ahme nicht … nach
  rationale: Die direkte deutsche Entsprechung zu μιμέομαι bewahrt den Gedanken, sich ein moralisches Beispiel zum Vorbild zu nehmen.
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: das Böse / das Gute
  rationale: Die substantivierten neutralen Adjektive bezeichnen allgemeine ethische Kategorien; die knappe deutsche Gegenüberstellung ist natürlich und formnah.
- source_word: ὁ ἀγαθοποιῶν
  choice: Wer Gutes tut
  rationale: Das substantivierte Präsenspartizip bezeichnet die Person anhand ihres Tuns und kann fortgesetztes oder charakteristisches Verhalten ausdrücken.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ist aus Gott
  rationale: „Aus Gott“ erhält die für Johannes charakteristische Aussage über Ursprung beziehungsweise Zugehörigkeit und deutet sie nicht weiter aus.
- source_word: ὁ κακοποιῶν
  choice: wer Böses tut
  rationale: Die parallele Wiedergabe zu ὁ ἀγαθοποιῶν erhält den klaren ethischen Gegensatz und den möglichen Aspekt charakteristischen Handelns.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: hat Gott nicht gesehen
  rationale: Die Übersetzung bewahrt Tempus und Bildsprache des griechischen Perfekts sowie die johanneische theologische Formulierung, statt sie mit „kennt Gott nicht“ auszulegen.
theological_decisions:
- issue: Verhältnis von moralischem Handeln und Gottesbeziehung in der johanneischen Aussage
  choice: 'Die Kategorien des Textes bleiben unverändert: Wer Gutes tut, ist „aus Gott“; wer Böses tut, „hat Gott nicht gesehen“.'
  alternative: Die Aussagen ausdrücklich als Lehre über Wiedergeburt, Sündlosigkeit oder den vollständigen Ausschluss jeder früheren Gottesbeziehung formulieren.
  rationale: Der griechische Text bietet eine zugespitzte geistlich-moralische Diagnose, legt sie aber nicht in den Begriffen späterer dogmatischer Systeme aus. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geliebter“ und „aus Gott“ sind bewusst bibelsprachlich, bleiben jedoch verständlich und bewahren den johanneischen Ton. Der Fußnotenmarker steht nach dem Gesamtsatz, da die Anmerkung beide parallelen Partizipialformulierungen erläutert.
