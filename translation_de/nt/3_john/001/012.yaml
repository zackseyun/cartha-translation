source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: de
  text: Demetrius hat von allen Zeugnis erhalten[a], ebenso von der Wahrheit selbst. Auch wir legen Zeugnis ab, und du weißt, dass unser Zeugnis wahr ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Für Demetrius ist von allen Zeugnis abgelegt worden.« Das griechische Perfekt bezeichnet ein bereits erfolgtes Zeugnis, das weiterhin Geltung hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Für Demetrius
  rationale: Der Dativ bezeichnet hier die Person, zu deren Gunsten Zeugnis abgelegt wird; die übliche deutsche Namensform ist „Demetrius“.
- source_word: μεμαρτύρηται ὑπὸ πάντων
  choice: legen alle Zeugnis ab
  rationale: Das griechische Perfekt Passiv bezeichnet ein bereits begründetes und fortgeltendes Zeugnis. Die aktive deutsche Form ist natürlich und bewahrt den Zeugniswortschatz, gibt die Perfektbedeutung jedoch weniger ausdrücklich wieder; darauf weist die Fußnote hin.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: auch die Wahrheit selbst
  rationale: Die intensive Wendung αὐτῆς τῆς wird mit „selbst“ bewahrt. „Wahrheit“ bleibt bewusst unaufgelöst, statt sie auf Evangelium oder Lebensführung zu verengen.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Auch wir legen Zeugnis ab
  rationale: „Auch“ gibt den additiven Zusammenhang von καί und δέ idiomatisch wieder; das betonte ἡμεῖς erscheint als „wir“.
- source_word: οἶδας
  choice: du weißt
  rationale: οἶδα hat trotz seiner Perfektform präsentische Bedeutung.
- source_word: ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν
  choice: unser Zeugnis wahr ist
  rationale: Die direkte Wiedergabe erhält sowohl die Wortfamilie des Zeugnisses als auch den Zusammenhang zwischen ἀλήθεια und ἀληθής.
theological_decisions:
- issue: Bedeutung von „die Wahrheit selbst“
  choice: Die bildhafte Formulierung wird unverändert beibehalten.
  alternative: „das Evangelium selbst“ oder „sein wahrheitsgemäßes Leben“
  rationale: Der griechische Text lässt offen, ob die Wahrheit als Evangelium, als Maßstab des Lebens oder in umfassender johanneischer Bedeutung Zeugnis gibt. Eine engere Deutung würde die theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Wörter „Zeugnis“ und „Wahrheit/wahr“ bilden die griechischen Leitwortverbindungen ab. Das im Zusammenhang eindeutig positive Zeugnis wird nicht durch das im Griechischen unausgesprochene Adjektiv „gut“ ergänzt.
