  source_fidelity: 'Die Übersetzung bewahrt Namen, die johanneische offene Wendung „die Wahrheit selbst“, die Wiederholung von Zeugnis und den präsentischen Sinn von οἶδας. Die aktive Gegenwartsform „legen alle Zeugnis ab“ gibt jedoch das griechische Perfektpassiv μεμαρτύρηται nicht angemessen wieder: Es bezeichnet ein bereits erfolgtes Zeugnis mit fortbestehender Geltung.'
  naturalness: „Für Demetrius legen alle Zeugnis ab“ ist zwar verständlich, wirkt im Deutschen aber weniger idiomatisch und lässt die beiden durch ὑπό angeschlossenen Zeugen leicht ungleich erscheinen. „Demetrius hat von allen Zeugnis erhalten, ebenso von der Wahrheit selbst“ ist modernes Standarddeutsch und stellt die Parallelität klar.
  terminology: „Demetrius“, „Zeugnis“, „Wahrheit selbst“, „wahr“ und „du weißt“ sind terminologisch sachgemäß. Die Deutung von „Wahrheit“ wird nicht unzulässig eingeengt.
