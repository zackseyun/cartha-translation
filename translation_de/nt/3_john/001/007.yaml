review_pass:
  verdict: approve
  source_fidelity: Der Entwurf gibt ὑπὲρ τοῦ ὀνόματος treffend mit „um des Namens willen“ wieder und wahrt die im Griechischen absichtlich implizite ehrfürchtige Bezeichnung. „Sind sie aufgebrochen“ gibt ἐξῆλθον im missionarischen Kontext idiomatisch wieder. „Haben nichts von den Heiden angenommen“ entspricht μηδὲν λαμβάνοντες ἀπὸ τῶν ἐθνικῶν in Sinn und Satzfunktion ausreichend; die perfekte deutsche Koordination ist stilistisch natürlich, auch wenn das Griechische einen begleitenden Partizipialsatz verwendet.
  naturalness: Der Satz ist klares, modernes Standarddeutsch mit angemessen würdigem Register. Die feste Wendung „um des Namens willen“ ist leicht gehoben, aber gegenwärtig verständlich und passt zur reverenziellen Formulierung des Ausgangstextes. „Heiden“ ist in diesem historischen-religiösen Kontext idiomatisch und nicht als ethnische Gleichsetzung mit „Nichtjuden“ missverständlich.
  terminology: „Des Namens“ bewahrt die christliche Kurzformel ohne den im Vers nicht ausdrücklich genannten Bezug auf Jesus oder Christus einzutragen. „Heiden“ bildet die religiös-kulturelle Außenperspektive von ἐθνικῶν angemessen ab. Die Fußnote nennt mit „Nichtchristen“ und „Ungläubigen“ legitime kontextuelle Alternativen und erklärt deren Charakter als lexikalische Alternativen.
