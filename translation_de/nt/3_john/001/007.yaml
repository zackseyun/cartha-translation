id: 3JN.1.7
reference: 3 John 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: de
  text: Denn um des Namens willen sind sie aufgebrochen und haben nichts von den Heiden angenommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: von Nichtchristen; auch: von Ungläubigen.'
    reason: Lexikalische Alternative zu ἐθνικῶν; im Kontext kann das Wort religiöse Außenstehende bezeichnen.
lexical_decisions:
- source_word: ὑπὲρ
  choice: um … willen
  rationale: Mit dem Genitiv bezeichnet ὑπέρ hier den Beweggrund oder Zweck. Die idiomatische deutsche Wendung „um … willen“ bewahrt diese Bedeutung.
- source_word: τοῦ ὀνόματος
  choice: des Namens
  rationale: Der bestimmte Ausdruck „der Name“ ist eine ehrfürchtige Kurzbezeichnung für Jesus beziehungsweise den Herrn. Die implizite Ausdrucksweise des griechischen Textes bleibt erhalten.
- source_word: ἐξῆλθον
  choice: sind sie aufgebrochen
  rationale: Im Zusammenhang mit reisenden Glaubensboten bezeichnet das Verb ihren Aufbruch. „Aufgebrochen“ klingt im heutigen Deutsch natürlicher und zielgerichteter als das wörtliche „hinausgegangen“.
- source_word: μηδὲν λαμβάνοντες
  choice: haben nichts … angenommen
  rationale: Das Partizip beschreibt den begleitenden Umstand ihres Aufbruchs. „Angenommen“ verdeutlicht ohne unnötige Ergänzung, dass es um materielle oder finanzielle Unterstützung geht.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: von den Heiden
  rationale: ἐθνικοί bezeichnet hier Menschen aus den Völkern, die nicht zur christlichen Gemeinschaft gehören. „Heiden“ bewahrt im Deutschen die historische religiöse Außenseiterperspektive besser als das heute häufig ethnisch verstandene „Nichtjuden“.
theological_decisions:
- issue: Bezug von „der Name“
  choice: Die ehrfürchtige Kurzbezeichnung bleibt als „der Name“ implizit.
  alternative: „der Name Jesu“, „der Name Christi“ oder „sein Name“
  rationale: Im Kontext bezieht sich die Wendung auf Jesus beziehungsweise den Herrn, doch der Ausgangstext nennt ihn an dieser Stelle nicht ausdrücklich. Die Übersetzung bewahrt diese theologisch gewichtige Zurückhaltung.
- issue: Bedeutung von ἐθνικῶν
  choice: „Heiden“ im Haupttext
  alternative: „Nichtchristen“, „Ungläubigen“ oder „Menschen aus den Völkern“
  rationale: Im Kontext bezeichnet das Wort Außenstehende, von denen die reisenden Glaubensboten keine Unterstützung annahmen. „Heiden“ erhält die religiös-kulturelle Färbung, während eine Fußnote die kontextuell möglichen Umschreibungen nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Um des Namens willen“ bewahrt bewusst den feierlichen Charakter der griechischen Wendung; der übrige Satz ist klar und gegenwärtig formuliert.
