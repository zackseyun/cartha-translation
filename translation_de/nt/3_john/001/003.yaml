  rationale: Die Revision ersetzt die zu lockere „Verbundenheit“ durch „Treue zur Wahrheit“, das den wahrscheinlichen Sinn der griechischen Wendung klar und zugleich theologisch nicht einengend wiedergibt. „Von … Zeugnis ablegen“ ist die idiomatische deutsche Verbindung und spiegelt μαρτυρεῖν besser als „für … Zeugnis ablegen“. Die Fußnote wird syntaktisch und inhaltlich berichtigt; die verbleibende Auslegungsbreite bleibt sichtbar.
