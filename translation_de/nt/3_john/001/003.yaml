  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: de
  text: Denn ich freute mich sehr, als Brüder kamen und von deiner Treue zur Wahrheit Zeugnis ablegten,[a] wie du in der Wahrheit lebst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von deiner Wahrheit Zeugnis ablegten“. Möglich ist auch: „von der Wahrheit, die in dir ist“ oder „von deiner Treue zur Wahrheit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Denn ich habe mich sehr gefreut
  rationale: Das Perfekt gibt den rückblickenden Aorist im Deutschen natürlich wieder; „Denn“ bewahrt den erklärenden Anschluss, „sehr“ die starke Gradangabe λίαν.
- source_word: ἐρχομένων ἀδελφῶν
  choice: als Brüder kamen
  rationale: Die Genitivus-abs.-ähnliche Partizipialkonstruktion wird als zeitlicher Umstand wiedergegeben. „Brüder“ entspricht dem maskulinen griechischen Ausdruck und der frühchristlichen Familiensprache.
- source_word: μαρτυρούντων
  choice: Zeugnis ablegten
  rationale: Die Wendung erhält die Zeugnissprache von μαρτυρέω und klingt im modernen Standarddeutsch würdig und idiomatisch.
- source_word: σου τῇ ἀληθείᾳ
  choice: für deine Verbundenheit mit der Wahrheit
  rationale: Der Dativ bei μαρτυρέω und das vorangestellte σου bezeichnen hier am plausibelsten das bezeugte Verhältnis des Gaius zur Wahrheit. Diese Formulierung vermeidet das missverständliche „deine Wahrheit“, ohne die Aussage auf bloße Aufrichtigkeit zu reduzieren.
- source_word: καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς
  choice: so wie du in der Wahrheit lebst
  rationale: „So wie“ bewahrt die Entsprechung; „leben“ gibt die ethische Wegmetapher von περιπατέω im Deutschen natürlich wieder, während „in der Wahrheit“ die johanneische Formulierung erhält.
theological_decisions:
- issue: Bedeutung von ἀλήθεια im johanneischen ethischen Zusammenhang
  choice: „Wahrheit“ in beiden Satzteilen beibehalten
  alternative: „Treue“ oder „Aufrichtigkeit“
  rationale: „Wahrheit“ hält die theologische und ethische Spannung zwischen erkannter Wahrheit und gelebtem Verhalten offen und legt den Ausdruck nicht einseitig auf Lehre, Wahrhaftigkeit oder Treue fest.
- issue: Deutung von σου τῇ ἀληθείᾳ
  choice: „deine Verbundenheit mit der Wahrheit“
  alternative: „deine Wahrheit“ / „die Wahrheit, die in dir ist“
  rationale: Die gewählte Fassung macht verständlich, dass nicht eine private Wahrheit des Gaius gemeint ist, sondern sein Verhältnis zur Wahrheit; die formnähere Möglichkeit wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zeugnissprache und der zweimalige Ausdruck „Wahrheit“ bleiben erhalten; die im Deutschen unnatürliche Wegmetapher wird im Haupttext idiomatisch mit „leben“ wiedergegeben.
