review_pass:
  verdict: revise
  source_fidelity: Der griechische Aorist Ἔγραψα wird mit „Ich habe ... geschrieben“ idiomatisch und sinnentsprechend wiedergegeben. „etwas“, „der Gemeinde“, die Umschreibung des φιλοπρωτεύων und „unter ihnen“ bewahren den Wortlaut und seine Offenheit. Bei οὐκ ἐπιδέχεται ἡμᾶς ist „nimmt uns nicht an“ zwar möglich, im heutigen Deutsch aber weniger präzise und kann unnötig nach persönlicher Akzeptanz oder Adoption klingen. „nimmt uns nicht auf“ bildet die Aufnahme-/Empfangskomponente natürlicher ab und lässt zugleich die weiterreichende Anerkennungsnuance offen.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „Ich habe ... geschrieben“ ist natürlich. „der es liebt, unter ihnen an erster Stelle zu stehen“ ist verständlich, aber leicht schwerfällig; „der unter ihnen gern an erster Stelle stehen will“ ist knapper und idiomatischer, ohne den Sinn abzuschwächen.
  terminology: '„Gemeinde“ ist für ἐκκλησία angemessen. „Diotrephes“ entspricht der deutschen Namensform. Die Alternative „heißt uns nicht willkommen“ ist idiomatisch; als Haupttext ist „nimmt uns nicht auf“ dem missverständlicheren „nimmt uns nicht an“ vorzuziehen. Die Fußnote zu τι sollte die textkritische Lage genauer ausdrücken: Nicht die Formulierung im Allgemeinen ist bloß „unterschiedlich überliefert“, sondern einige Handschriften erweitern die knappe Lesart.'
  issues:
  - severity: medium
    issue: „nimmt uns nicht an“ für οὐκ ἐπιδέχεται ἡμᾶς
    rationale: Die Formulierung ist lexikalisch möglich, klingt im modernen Deutsch jedoch eher nach persönlicher Billigung und kann die Empfangs-/Aufnahmekomponente verdecken. „nimmt uns nicht auf“ ist natürlicher und bewahrt die semantische Breite; die Fußnote nennt weiterhin „erkennt uns nicht an“ als mögliche Konkretisierung.
  - severity: low
    issue: Textkritische Fußnote zu [a] ist zu unbestimmt formuliert
    rationale: Die englische Auditspur erläutert, dass die SBLGNT-Lesart ein unbestimmtes „etwas“ hat und einige Handschriften die Wendung erweitern. Die deutsche Fußnote sollte dies unmittelbar sagen, statt allgemein von unterschiedlicher Überlieferung zu sprechen.
  - severity: low
