  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: de
  text: Ich habe der Gemeinde etwas geschrieben[a]. Doch Diotrephes, der unter ihnen gern an erster Stelle stehen will, nimmt uns nicht auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich schrieb der Gemeinde etwas.“ Der griechische Text hat die unbestimmte Wendung „etwas“; einige Handschriften erweitern die Formulierung.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „heißt uns nicht willkommen“ oder „erkennt uns nicht an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: Ich habe … geschrieben
  rationale: Der Aorist bezeichnet hier eine zurückliegende Schreibhandlung. Das Perfekt ist dafür im modernen Standarddeutsch die natürliche Erzählform, ohne einen besonderen fortdauernden Zustand zu behaupten.
- source_word: τι
  choice: etwas
  rationale: Das indefinite Pronomen wird ausdrücklich und ohne inhaltliche Ergänzung wiedergegeben. So bleibt die Unbestimmtheit des griechischen Textes erhalten.
- source_word: τῇ ἐκκλησίᾳ
  choice: der Gemeinde
  rationale: Gemeint ist die örtliche christliche Versammlung. „Gemeinde“ ist im Deutschen dafür klar und idiomatisch und bezeichnet hier nicht ein Kirchengebäude.
- source_word: ἀλλ’
  choice: Doch
  rationale: „Doch“ gibt den deutlichen Gegensatz zwischen dem Schreiben des Verfassers und der ablehnenden Haltung des Diotrephes natürlich wieder.
- source_word: ὁ φιλοπρωτεύων
  choice: der es liebt, … an erster Stelle zu stehen
  rationale: Die Form bezeichnet jemanden, der danach verlangt, der Erste zu sein beziehungsweise Vorrang zu haben. Die Wiedergabe bewahrt die wertende Aussage, ohne ein bestimmtes kirchliches Amt vorauszusetzen.
- source_word: αὐτῶν
  choice: unter ihnen
  rationale: Der Genitiv bezeichnet hier am ehesten die Gruppe, innerhalb derer Diotrephes den ersten Rang beansprucht. „Unter ihnen“ vermeidet die zusätzliche Behauptung einer formalen Herrschaft über sie.
- source_word: Διοτρέφης
  choice: Diotrephes
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen Form wiedergegeben.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: nimmt uns nicht an
  rationale: '„Annehmen“ hält die Bedeutung bewusst weit: Gemeint sein können persönliche Aufnahme, gastfreundlicher Empfang oder die Anerkennung des Verfassers und seiner Vertreter.'
theological_decisions:
- issue: Art der Ablehnung durch Diotrephes
  choice: nimmt uns nicht an
  alternative: heißt uns nicht willkommen / erkennt uns nicht an
  rationale: Das Verb kann sowohl tatsächlichen Empfang als auch Anerkennung ausdrücken. Die Übersetzung legt nicht fest, ob vor allem Gastfreundschaft, persönliche Aufnahme oder die Anerkennung geistlicher Autorität verweigert wird.
- issue: Vorrang des Diotrephes
  choice: unter ihnen an erster Stelle zu stehen
  alternative: über sie herrschen / ihr Leiter sein
  rationale: Der Text kritisiert sein Streben nach dem ersten Rang, benennt aber weder ein bestimmtes Amt noch ausdrücklich eine formale Herrschaft. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt entspricht dem gewöhnlichen deutschen Erzählgebrauch; „Gemeinde“ bezeichnet die örtliche christliche Gemeinschaft. Die Formulierungen vermeiden sowohl altertümliche Sprache als auch eine konfessionell eingeengte Deutung.
