source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: de
  text: Wir sind also verpflichtet, solche Menschen aufzunehmen[a], damit wir Mitarbeiter für die Wahrheit[b] werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „aufzunehmen“ übersetzte Verb kann hier auch gastfreundliches Aufnehmen und praktische oder materielle Unterstützung einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Mitarbeiter der Wahrheit“, „mit der Wahrheit“ oder „in der Wahrheit“. Der griechische Dativ lässt die genaue Beziehung offen; der Haupttext versteht die Aussage als Mitarbeit für die Sache der Wahrheit.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und betont die Verantwortung der Glaubenden.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet natürlich und klar die Folgerung aus dem vorherigen Vers.
- source_word: ὀφείλομεν
  choice: sind verpflichtet
  rationale: Gibt die moralische Verpflichtung stärker und genauer wieder als das im heutigen Deutsch oft schwächere „sollten“.
- source_word: ὑπολαμβάνειν
  choice: aufzunehmen
  rationale: Passt zum Kontext der Gastfreundschaft gegenüber reisenden Glaubensboten und kann zugleich praktische sowie materielle Unterstützung einschließen.
- source_word: τοὺς τοιούτους
  choice: solche Menschen
  rationale: Bezeichnet Personen der zuvor beschriebenen Art, ohne die Formulierung unnötig auf Männer zu beschränken.
- source_word: ἵνα
  choice: damit
  rationale: Gibt den Zweck der Aufnahme idiomatisch wieder.
- source_word: συνεργοὶ
  choice: Mitarbeiter
  rationale: Drückt gemeinsame Beteiligung am Werk aus; das anschließende „für die Wahrheit“ nennt, wofür sie mitarbeiten.
- source_word: γινώμεθα
  choice: wir … werden
  rationale: Bewahrt gegenüber einer bloßen Zustandsaussage den Gedanken, dass man durch die Unterstützung zu einem Mitwirkenden wird.
- source_word: τῇ ἀληθείᾳ
  choice: für die Wahrheit
  rationale: Versteht den Dativ als Angabe dessen, dessen Sache durch die Mitarbeit gefördert wird; andere grammatisch mögliche Beziehungen bleiben in der Fußnote erhalten.
theological_decisions:
- issue: Beziehung von τῇ ἀληθείᾳ zu συνεργοὶ
  choice: '„Mitarbeiter für die Wahrheit“: Beteiligung an dem Werk, das der Wahrheit dient'
  alternative: „Mitarbeiter der Wahrheit“, „Mitarbeiter mit der Wahrheit“ oder „Mitarbeiter in der Wahrheit“
  rationale: Der Zusammenhang handelt von der Unterstützung derer, die für den Namen ausgezogen sind. „Für die Wahrheit“ bringt den Zweckbezug verständlich zum Ausdruck, ohne die Mehrdeutigkeit des griechischen Dativs zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sind verpflichtet“ wahrt die bindende Kraft von ὀφείλομεν; „solche Menschen“ ist allgemein verständlich und sachlich. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Formulierungen.
