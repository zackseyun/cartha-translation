id: 3JN.1.2
reference: 3 John 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: de
  text: Geliebter, ich bete darum, dass es dir in jeder Hinsicht gut geht und du gesund bist, so wie es deiner Seele gut geht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Geliebter
  rationale: Die substantivierte Anrede bewahrt den sprachlichen Bezug zur Liebe und den herzlichen Ton des griechischen Vokativs.
- source_word: περὶ πάντων
  choice: in jeder Hinsicht
  rationale: Die Wendung bezeichnet hier am natürlichsten den Umfang des Wohlergehens, nicht eine Rangfolge im Sinn von »vor allem«.
- source_word: εὔχομαί
  choice: ich bete darum
  rationale: εὔχομαι kann einen Wunsch oder ein Gebet ausdrücken; im christlichen Briefzusammenhang gibt »ich bete darum« die religiöse Färbung angemessen wieder.
- source_word: σε εὐοδοῦσθαι
  choice: dass es dir … gut geht
  rationale: Die idiomatische deutsche Formulierung gibt umfassendes Wohlergehen wieder, ohne den heute leicht materiell verengten Beiklang von »gedeihen« oder »Erfolg haben«.
- source_word: ὑγιαίνειν
  choice: gesund bist
  rationale: Das Verb bezeichnet hier körperliche Gesundheit und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: καθὼς
  choice: so wie
  rationale: Die Formulierung kennzeichnet klar den vom griechischen Text gesetzten Vergleich.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: es deiner Seele gut geht
  rationale: Die Formulierung bewahrt sowohl ψυχή als »Seele« als auch die lexikalische Entsprechung zum vorherigen εὐοδοῦσθαι.
- source_word: ψυχή
  choice: Seele
  rationale: »Seele« erhält die mögliche innere beziehungsweise geistliche Dimension, ohne eine bestimmte Lehre über die Bestandteile des Menschen festzulegen.
theological_decisions:
- issue: Bedeutung von περὶ πάντων
  choice: 'Umfang: »in jeder Hinsicht«'
  alternative: 'Priorität: »vor allem«'
  rationale: Die griechische Wendung bezeichnet natürlicher den Bereich beziehungsweise Umfang der Bitte als deren höchsten Rang.
- issue: Bedeutung von ψυχή
  choice: Seele
  alternative: Inneres; Leben; Selbst
  rationale: »Seele« bewahrt die Mehrdeutigkeit und den möglichen Kontrast zu äußerem Wohlergehen und körperlicher Gesundheit, ohne diesen anthropologisch auszudefinieren.
- issue: Art des Wohlergehens bei εὐοδοῦσθαι
  choice: 'umfassendes Wohlergehen: »es dir gut geht«'
  alternative: 'materieller Erfolg: »du wohlhabend bist« oder »Erfolg hast«'
  rationale: Das Verb kann allgemein gutes Ergehen bezeichnen; der Vers begründet daher keine Verengung auf finanziellen Wohlstand.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung »es dir … gut geht / es deiner Seele gut geht« bildet die Wiederholung von εὐοδοῦσθαι ab. »Geliebter« ist bewusst bibelsprachlich, aber verständlich; der Adressat ist grammatisch männlich.
