  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: de
  text: Vieles hatte ich dir zu schreiben, aber ich will dir nicht mit Tinte und Schreibrohr[a] schreiben;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet wörtlich ein Rohr, hier ein als Schreibgerät zugeschnittenes Schilfrohr.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: Vieles
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet zahlreiche Dinge bzw. Inhalte. „Vieles“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: εἶχον γράψαι σοι
  choice: hätte ich dir zu schreiben
  rationale: Die griechische Verbindung bezeichnet den vorhandenen, aber nicht schriftlich ausgeführten Mitteilungsstoff. Die deutsche Wendung ist idiomatischer als „hatte ich dir zu schreiben“, das leicht eine Verpflichtung ausdrücken würde.
- source_word: ἀλλ’ οὐ θέλω
  choice: aber ich will … nicht
  rationale: θέλω bezeichnet hier den Willen bzw. Wunsch des Schreibers. „Ich will nicht“ ist klar, gegenwärtig und entspricht dem Briefstil.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: mit Tinte und Schreibrohr
  rationale: διά mit Genitiv bezeichnet das Mittel. μέλαν ist Tinte; κάλαμος ist wörtlich ein Rohr und im Zusammenhang ein daraus gefertigtes Schreibgerät. „Schreibrohr“ bewahrt das historische Bild, ohne die Funktion unklar zu lassen.
- source_word: σοι γράφειν
  choice: dir … schreiben
  rationale: Die Wiedergabe erhält sowohl den Adressaten im Dativ als auch das ausdrückliche Verb „schreiben“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Briefdeutsch. Die Anfangsstellung „Vieles“ bewahrt die Hervorhebung des griechischen Satzes; „hätte … zu schreiben“ vermeidet die im Deutschen missverständliche Pflichtbedeutung von „hatte … zu schreiben“.
