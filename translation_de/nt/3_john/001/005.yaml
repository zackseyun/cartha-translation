  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: de
  text: Geliebter, du handelst treu in allem, was du für die Brüder tust, auch wenn sie dir fremd sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geliebter, du tust treu, was immer du für die Brüder tust – und zwar für Fremde.« Mit »Brüder« sind hier Mitgläubige gemeint; die Gruppe kann in diesem Zusammenhang auch Frauen umfasst haben. »Fremde« bezeichnet Personen, die dem Gastgeber unbekannt waren, nicht notwendigerweise Ausländer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Geliebter
  rationale: Der substantivisch gebrauchte Vokativ Singular ist eine herzliche Anrede. »Geliebter« bewahrt sowohl die Zuneigung als auch den würdevollen Briefstil.
- source_word: πιστὸν ποιεῖς
  choice: du handelst treu
  rationale: Die Wendung bedeutet wörtlich etwa »du tust etwas Treues«. »Du handelst treu« gibt die Anerkennung seiner Verlässlichkeit in natürlichem Deutsch wieder.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: in allem, was du … tust
  rationale: 'Relativpronomen mit ἐάν und Konjunktiv hat einen unbestimmten Sinn: »was auch immer du tust«. Die gewählte Fassung ist idiomatisch und umfasst die praktische Hilfe.'
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: für die Brüder
  rationale: Das grammatisch maskuline Pluralwort bezeichnet hier Glaubensgeschwister; »für« gibt das benefaktive εἰς natürlich wieder. Die formale Geschlechtsmarkierung bleibt im Haupttext erhalten.
- source_word: καὶ τοῦτο ξένους
  choice: und das sogar für solche, die dir fremd sind
  rationale: Die knappe griechische Konstruktion hebt hervor, dass die unterstützten Brüder dem Empfänger persönlich unbekannt waren. »Dir fremd« verhindert das mögliche Missverständnis, es gehe notwendig um Ausländer.
- source_word: ξένους
  choice: solche, die dir fremd sind
  rationale: ξένος bezeichnet hier im Zusammenhang der Gastfreundschaft wahrscheinlich unbekannte Personen, nicht zwingend Menschen aus einem anderen Land.
