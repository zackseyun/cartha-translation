translation_notes:
  register: Modernes, würdiges Standarddeutsch mit persönlicher Du-Anrede. Die natürliche Hauptfassung bewahrt die Aussage über treues Handeln und macht deutlich, dass ξένους persönliche Unbekanntheit bezeichnet. Die ungewöhnlich knappe griechische Syntax wird in der Fußnote sichtbar gehalten.
