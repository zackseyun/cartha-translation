source:
  edition: SBLGNT
  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: de
  text: 'Ich habe keine größere Freude als diese: zu hören, dass meine Kinder in der Wahrheit leben.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich habe keine größere Freude als diese Dinge.«'
    reason: lexical_alternative
  - marker: b
    text: Mit »meine Kinder« sind wahrscheinlich geistliche Kinder gemeint, also Menschen, die der Verfasser geistlich begleitet.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν τούτων οὐκ ἔχω χαράν
  choice: Ich kenne keine größere Freude als diese
  rationale: 'Die idiomatische deutsche Wendung gibt den Vergleich natürlich wieder; das folgende ἵνα erläutert, worin diese Freude besteht. Wörtlicher wäre: »Ich habe keine größere Freude als diese Dinge.«'
- source_word: ἵνα ἀκούω
  choice: zu hören, dass
  rationale: ἵνα bezeichnet hier den Inhalt dessen, was die Freude ausmacht, nicht einen Zweck. Die Infinitivkonstruktion ist im Deutschen natürlich und präzise.
- source_word: τὰ ἐμὰ τέκνα
  choice: meine Kinder
  rationale: Die familiäre Metapher bleibt erhalten, ohne im Haupttext festzulegen, ob leibliche oder geistliche Kinder gemeint sind.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: in der Wahrheit
  rationale: Die bestimmte Formulierung bewahrt die johanneische Bedeutungsbreite zwischen erkannter Wahrheit und einem von ihr geprägten Leben.
- source_word: περιπατοῦντα
  choice: leben
  rationale: Das griechische Bild des Gehens bezeichnet die Lebensführung. »Leben« ist im modernen Deutschen natürlicher als »wandeln«, ohne den ethischen Sinn einzuengen.
theological_decisions:
- issue: Bezug von τέκνα
  choice: Im Haupttext steht offen »meine Kinder«; eine Fußnote nennt den wahrscheinlich geistlichen Sinn.
  alternative: meine geistlichen Kinder; Menschen, die durch Johannes zum Glauben gekommen sind
  rationale: Der Kontext legt eine geistliche Beziehung nahe, doch der griechische Text verwendet lediglich den familiären Ausdruck und lässt die genaue Art der Beziehung unausgesprochen.
- issue: Bedeutung von ἐν τῇ ἀληθείᾳ
  choice: in der Wahrheit
  alternative: wahrhaftig; nach der wahren Lehre
  rationale: Die Formulierung soll weder auf persönliche Aufrichtigkeit noch ausschließlich auf Lehrtreue reduziert werden; im johanneischen Sprachgebrauch gehören Wahrheit und Lebensführung zusammen.
- issue: Wiedergabe der Metapher περιπατέω
  choice: leben
  alternative: wandeln; ihren Weg gehen
  rationale: Die Bedeutung »sein Leben führen« wird verständlich wiedergegeben. Die theologische Aussage bleibt erhalten, während ein heute gehobener oder kirchlich geprägter Ausdruck vermieden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ich kenne keine größere Freude« ist idiomatischer als »Ich habe keine größere Freude«. »Leben« erschließt die antike Wegmetapher einem breiten Publikum; »in der Wahrheit« bewahrt bewusst die theologische Mehrdeutigkeit.
