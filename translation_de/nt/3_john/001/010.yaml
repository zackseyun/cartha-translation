source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: de
  text: 'Deshalb werde ich, wenn ich komme, die Taten zur Sprache bringen, die er begeht: Er verbreitet mit bösen Worten leeres Gerede über uns. Doch damit nicht genug: Er selbst nimmt die Brüder nicht auf[a], hindert diejenigen, die sie aufnehmen wollen, und schließt sie aus der Gemeinde aus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Brüder“ sind wahrscheinlich reisende christliche Brüder beziehungsweise Missionare. „Aufnehmen“ kann hier besonders bedeuten, sie willkommen zu heißen und ihnen Gastfreundschaft zu gewähren.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wirft sie aus der Gemeinde hinaus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: Gibt die folgernde Verknüpfung knapp und natürlich wieder.
- source_word: ἐὰν ἔλθω
  choice: wenn ich komme
  rationale: Bewahrt die reale Bedingung und die briefliche Perspektive; im Deutschen steht bei einem erwartbaren möglichen Fall idiomatisch „wenn“.
- source_word: ὑπομνήσω
  choice: werde ich … aufmerksam machen
  rationale: Im Kontext geht es darum, das Verhalten des Diotrephes ausdrücklich ins Bewusstsein zu rufen und offenzulegen, nicht lediglich um eine private Erinnerung.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: seine Taten …, die er begeht
  rationale: Bewahrt den konkreten Plural und den fortdauernden Charakter seines Handelns; „begehen“ passt zu den hier genannten verwerflichen Taten.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: Mit bösen Worten verbreitet er unsinniges Gerede über uns
  rationale: „Unsinniges Gerede“ erfasst das leere, törichte Reden von φλυαρέω; „böse Worte“ erhält πονηροῖς, und „über uns“ gibt das feindselig gegen die Verfasser gerichtete Reden natürlich wieder.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: Und damit nicht genug
  rationale: Natürliche deutsche Wiedergabe der partizipialen Wendung, die eine weitere Steigerung seines Fehlverhaltens einführt.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: Er selbst nimmt die Brüder nicht auf
  rationale: „Aufnehmen“ kann sowohl Annahme als auch gastfreundliche Beherbergung bezeichnen und passt daher zur kontextuellen Bedeutung von ἐπιδέχομαι.
- source_word: τοὺς βουλομένους κωλύει
  choice: hindert diejenigen, die es tun wollen
  rationale: Bewahrt die volitive Bedeutung von βούλομαι und lässt die genaue Art der Behinderung, wie im Griechischen, offen.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: schließt sie aus der Gemeinde aus
  rationale: Bezeichnet klar die gewaltsame soziale bzw. gemeindliche Ausgrenzung; „Gemeinde“ meint hier die örtliche christliche Versammlung.
theological_decisions:
- issue: Referenz und Geschlecht von τοὺς ἀδελφούς
  choice: die Brüder
  alternative: die Glaubensgeschwister / die Brüder und Schwestern
  rationale: Der Zusammenhang handelt wahrscheinlich von reisenden christlichen Mitarbeitern. Die maskuline Form wird deshalb nicht ohne textlichen Anlass verallgemeinert; die Fußnote erläutert die wahrscheinliche Referenz.
- issue: Art des Ausschlusses aus der ἐκκλησία
  choice: schließt sie aus der Gemeinde aus
  alternative: wirft sie aus der Versammlung hinaus
  rationale: Der Text beschreibt einen Ausschluss aus der örtlichen christlichen Gemeinschaft, ohne dessen formales Verfahren näher zu bestimmen. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze machen die Steigerung der Vorwürfe verständlich, während die inhaltliche Abfolge und die fortdauernden Handlungen des griechischen Textes gewahrt bleiben.
