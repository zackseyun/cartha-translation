  terminology: „Gemeinde“ ist in diesem konkreten frühchristlichen Kontext eine treffende und natürliche Wiedergabe von ἐκκλησία. „Liebe“ für ἀγάπη und „Gottes würdig“ für ἀξίως τοῦ θεοῦ sind sachgerecht und theologisch nicht überinterpretiert.
