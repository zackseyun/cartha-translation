  source_fidelity: 'Die Übersetzung gibt die Satzglieder und ihre Bezüge zuverlässig wieder: Das Perfekt „haben ... Zeugnis abgelegt“ ist für den Aorist ἐμαρτύρησαν idiomatisch, „von deiner Liebe“ bezeichnet angemessen den Gegenstand des Zeugnisses, und „vor der Gemeinde“ entspricht ἐνώπιον ἐκκλησίας. „Du wirst gut daran tun“ wahrt die futurische, zugleich ermunternde Kraft von καλῶς ποιήσεις. „Weiterzuschicken“ gibt προπέμψας in der Hauptaussage angemessen wieder; die Fußnote sichert dessen möglichen Sinn praktischer Reiseunterstützung. „die Gottes würdig ist“ entspricht ἀξίως τοῦ θεοῦ ohne Ausdeutung.'
