source:
  edition: SBLGNT
  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: de
  text: Sie haben vor der Gemeinde von deiner Liebe Zeugnis abgelegt. Du wirst gut daran tun, sie auf eine Weise weiterzuschicken[a], die Gottes würdig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann bedeuten, Reisende mit praktischer oder materieller Hilfe für ihren weiteren Weg auszustatten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: haben … Zeugnis abgelegt
  rationale: Das Perfekt gibt im Deutschen eine abgeschlossene Handlung mit fortwirkender Bedeutung natürlich wieder; „Zeugnis ablegen“ bewahrt den Aussage- und Bestätigungscharakter von μαρτυρέω.
- source_word: σου τῇ ἀγάπῃ
  choice: von deiner Liebe
  rationale: Der Dativ bezeichnet hier den Gegenstand des Zeugnisses. „Von deiner Liebe“ ist idiomatisch und lässt erkennen, dass die Reisenden über die Liebe des Gaius berichteten.
- source_word: ἐνώπιον ἐκκλησίας
  choice: vor der Gemeinde
  rationale: ἐνώπιον bezeichnet das Auftreten in der Gegenwart anderer; ἐκκλησία meint hier die versammelte christliche Gemeinschaft.
- source_word: καλῶς ποιήσεις
  choice: Du wirst gut daran tun
  rationale: Die deutsche Wendung erhält sowohl die Futurform als auch den höflich auffordernden und anerkennenden Ton.
- source_word: προπέμψας
  choice: sie … weiterzuschicken
  rationale: Die Form bezeichnet das Geleit beziehungsweise die Hilfe zur Weiterreise. Die knappe Haupttextfassung bleibt offen dafür, ob praktische oder materielle Unterstützung eingeschlossen ist; diese Nuance wird in der Fußnote erläutert.
- source_word: ἀξίως τοῦ θεοῦ
  choice: auf eine Weise …, die Gottes würdig ist
  rationale: 'Die Formulierung gibt die modale Bedeutung von ἀξίως wieder und bewahrt den theologischen Maßstab: Die Unterstützung soll Gottes Würde entsprechen.'
theological_decisions:
- issue: Bedeutungsumfang von προπέμπω im Zusammenhang christlicher Gastfreundschaft
  choice: „weiterzuschicken“ im Haupttext, mit Erläuterung praktischer Unterstützung in der Fußnote
  alternative: „ihnen bei der Weiterreise zu helfen“ oder „sie für die Weiterreise auszustatten“
  rationale: Das Verb kann mehr als bloßes Verabschieden bezeichnen und Hilfe, Versorgung oder Geleit einschließen. Der Haupttext legt die konkrete Art der Hilfe nicht fest; die Fußnote bewahrt den weiteren Bedeutungsumfang.
- issue: Maßstab in ἀξίως τοῦ θεοῦ
  choice: „die Gottes würdig ist“
  alternative: „wie es vor Gott angemessen ist“
  rationale: Die gewählte Fassung erhält die starke, im Griechischen angelegte Aussage, dass Gott selbst den Maßstab für die Art der Unterstützung bildet, ohne sie auf bloße Angemessenheit vor Gott abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemeinde“ ist im deutschsprachigen christlichen Kontext natürlicher als „Kirche“ für die konkret versammelte Gemeinschaft. Die Anrede bleibt entsprechend dem griechischen Singular persönlich („deiner“, „Du“).
