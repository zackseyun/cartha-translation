  source_fidelity: Die Übersetzung bildet die zweigliedrige κατά-μέν/δέ-Konstruktion sachgerecht ab. »Feinde« für ἐχθροί, »Erwählung« für ἐκλογή, »Geliebte« für ἀγαπητοί sowie »um der Väter willen« für διὰ τοὺς πατέρας bewahren die Aussage und ihre Spannung. »euretwegen« lässt bei δι’ ὑμᾶς die im Kontext mögliche kausale beziehungsweise auf den Nutzen der Angesprochenen bezogene Nuance offen.
  naturalness: Der Satz ist klares, würdiges modernes Standarddeutsch. Die bewusst parallele Struktur ist für den argumentativen Kontrast des griechischen Textes angemessen. »Geliebte« und »um der Väter willen« haben einen leicht gehobenen biblischen Ton, sind aber verständlich und im Register dieser Aussage natürlich.
  terminology: Die etablierten paulinischen Schlüsselbegriffe »Evangelium« und »Erwählung« sind treffend. »Die Väter« bewahrt die knappe Ausdrucksweise des Ausgangstextes; die Fußnote erläutert den wahrscheinlichen Bezug auf die Patriarchen, ohne ihn in den Haupttext einzutragen.
