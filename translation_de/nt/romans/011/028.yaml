id: ROM.11.28
reference: Romans 11:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: de
  text: Was das Evangelium betrifft, sind sie euretwegen Feinde[a]; was aber die Erwählung betrifft, sind sie um der Väter willen Geliebte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen euch«. Die Formulierung kann sowohl den Grund als auch den Nutzen für die Angesprochenen hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Vätern« sind die Stammväter Israels gemeint, besonders Abraham, Isaak und Jakob.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: Was das Evangelium betrifft
  rationale: κατά mit Akkusativ bezeichnet hier den Gesichtspunkt oder Bezugsbereich. Die Wendung gibt zusammen mit μέν … δέ die Gegenüberstellung klar und idiomatisch wieder.
- source_word: ἐχθροὶ
  choice: Feinde
  rationale: Das prädikativ gebrauchte Adjektiv wird substantivisch wiedergegeben. »Feinde« bewahrt die starke relationale Aussage; »feindlich« wäre schwächer, »Gehasste« würde die Perspektive unzulässig festlegen.
- source_word: δι’ ὑμᾶς
  choice: euretwegen
  rationale: διά mit Akkusativ kann Grund oder Begünstigung ausdrücken. »Euretwegen« bewahrt diese knappe, im Deutschen ebenfalls nicht völlig aufgelöste Beziehung.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: was aber die Erwählung betrifft
  rationale: Die parallele Formulierung erhält den kontrastierenden Aufbau des griechischen Satzes und gibt ἐκλογή mit dem im paulinischen Zusammenhang präzisen Begriff »Erwählung« wieder.
- source_word: ἀγαπητοὶ
  choice: Geliebte
  rationale: Die substantivische Wiedergabe entspricht der prädikativen Form und bewahrt den gewichtigen Gegensatz zu »Feinde«.
- source_word: διὰ τοὺς πατέρας
  choice: um der Väter willen
  rationale: Die feste deutsche Wendung gibt διά mit Akkusativ als Grund beziehungsweise Bezug auf die Väter wieder, ohne die knappe Bundesterminologie des Ausgangstextes auszudeuten.
theological_decisions:
- issue: Bezug der unausgesprochenen dritten Person Plural
  choice: Die deutsche Übersetzung verwendet »sie« und lässt den im Kontext von Römer 9–11 bestimmten korporativen Bezug auf Israel bestehen.
  alternative: Den Bezug ausdrücklich auf die ungläubigen Juden zur Zeit des Paulus einengen.
  rationale: Der unmittelbare Zusammenhang spricht von Israel als Volk, zugleich besonders von seinem gegenwärtigen Unglauben. Eine nähere Bestimmung im Vers würde die Aussage stärker festlegen als der griechische Text.
- issue: Sinn von »Feinde«
  choice: Die Aussage bleibt ausdrücklich auf den Gesichtspunkt des Evangeliums bezogen und steht zugleich neben »Geliebte«.
  alternative: »Feinde« als uneingeschränkte Aussage über Gottes endgültige Haltung oder nur als gesellschaftliche Gegnerschaft erklären.
  rationale: Paulus stellt beide Bezeichnungen spannungsvoll nebeneinander. Die Übersetzung darf weder »Feinde« abschwächen noch »Geliebte« relativieren.
- issue: Bedeutung von »die Väter«
  choice: Die wörtliche Bundesbezeichnung »die Väter« bleibt im Haupttext erhalten; eine Fußnote nennt die Patriarchen als naheliegenden Bezug.
  alternative: Im Haupttext direkt »die Erzväter« oder allgemein »die Vorfahren« schreiben.
  rationale: »Die Väter« bewahrt die Ausdrucksweise des Ausgangstextes; im Kontext sind besonders Abraham, Isaak und Jakob gemeint, ohne dass der griechische Vers sie einzeln nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur bildet μέν … δέ ab; die theologischen Schlüsselbegriffe »Evangelium«, »Erwählung«, »Feinde« und »Geliebte« bleiben erhalten. Die Formulierung löst die Spannung zwischen gegenwärtiger Gegnerschaft und bleibendem Geliebtsein nicht auf.
