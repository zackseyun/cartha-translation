id: ROM.11.12
reference: Romans 11:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: de
  text: Wenn aber ihre Verfehlung Reichtum für die Welt bedeutet und ihr Verlust[a] Reichtum für die Nichtjuden, wie viel mehr dann ihre Fülle[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Niederlage oder ihre Minderung.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Oder: ihre volle Zahl oder ihre vollständige Aufnahme.'
    reason: mögliche Bedeutungsnuancen
lexical_decisions:
- source_word: παράπτωμα
  choice: Verfehlung
  rationale: Das Wort bezeichnet einen Fehltritt oder ein Vergehen. »Verfehlung« bewahrt den moralischen Sinn, ohne die Art des Vergehens näher festzulegen.
- source_word: πλοῦτος
  choice: Reichtum
  rationale: Der bildhafte Ausdruck bezeichnet hier die Fülle göttlichen Segens und wird im Deutschen natürlich mit »Reichtum« wiedergegeben.
- source_word: κόσμου
  choice: die Welt
  rationale: κόσμος ist hier umfassend und bezeichnet die Welt außerhalb Israels; »die Welt« erhält diese Weite.
- source_word: ἥττημα
  choice: Verlust
  rationale: Das seltene Wort kann Verlust, Niederlage oder Minderung bedeuten. »Verlust« wahrt die Mehrdeutigkeit am besten; weitere Nuancen stehen in der Fußnote.
- source_word: ἐθνῶν
  choice: die Nichtjuden
  rationale: Im Zusammenhang des Römerbriefs steht ἔθνη im Gegensatz zu Israel beziehungsweise den Juden. »Nichtjuden« macht diesen Gegensatz in heutigem Deutsch klar, ohne das missverständliche »Heiden« zu verwenden.
- source_word: πόσῳ μᾶλλον
  choice: wie viel mehr
  rationale: Die feste Vergleichsformel leitet einen Schluss vom Geringeren auf das Größere ein und wird im Deutschen idiomatisch mit »wie viel mehr« wiedergegeben.
- source_word: πλήρωμα
  choice: Fülle
  rationale: πλήρωμα kann Fülle, volle Zahl oder vollständige Aufnahme bezeichnen. »Fülle« hält die quantitative und qualitative Bedeutung offen.
theological_decisions:
- issue: Bedeutung von τὸ πλήρωμα αὐτῶν
  choice: ihre Fülle
  alternative: ihre volle Zahl; ihre vollständige Aufnahme; ihre Wiederherstellung
  rationale: Die knappe griechische Formulierung legt nicht eindeutig fest, ob Paulus von einer Zahl, vollständiger Einbeziehung oder Wiederherstellung Israels spricht. Die offene Wiedergabe bewahrt diese theologische Spannung.
- issue: Unausgesagtes Prädikat im Schlusssatz
  choice: Die griechische Ellipse wird mit »wie viel mehr dann ihre Fülle!« bewahrt.
  alternative: wie viel mehr wird ihre Fülle Reichtum bedeuten/bringt ihre Fülle Reichtum
  rationale: Der Ausgangstext nennt im Schlusssatz weder ein ausdrückliches Verb noch ein Zukunftszeichen. Die knappe deutsche Form vermeidet eine unnötige zeitliche oder sachliche Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Nichtjuden« verdeutlicht den jüdisch-nichtjüdischen Gegensatz für heutige Leser. Die zugespitzte Ellipse des griechischen Schlusssatzes bleibt erhalten.
