    rationale: Die anarthrische griechische Nominalform verlangt nicht, dass das Deutsche ebenfalls artikellos bleibt. Der unbestimmte Artikel verbessert die Lesbarkeit, ohne die Bedeutung oder die Offenheit der Aussage zu verändern.
