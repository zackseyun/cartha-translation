  source_fidelity: 'Die Grundstruktur und die wesentlichen Begriffe entsprechen dem griechischen Text gut: ἀγνοεῖν ist angemessen mit „unbekannt ist“, μυστήριον mit „Geheimnis“, πώρωσις mit „Verhärtung“, ἀπὸ μέρους mit „zum Teil“ und πλήρωμα offen mit „Fülle“ wiedergegeben. Die inklusive Hauptlesart „Brüder und Schwestern“ geht jedoch über die maskuline griechische Anrede ἀδελφοί hinaus. Die mögliche Einbeziehung von Frauen lässt sich sachgerecht in einer Fußnote vermerken.'
  naturalness: Der Satz ist insgesamt verständlich und registergerecht. „Israel ist zum Teil Verhärtung widerfahren“ wirkt ohne Artikel im heutigen Deutsch jedoch unnötig spröde. „Israel ist zum Teil eine Verhärtung widerfahren“ ist idiomatischer und wahrt zugleich die ereignishafte Perfektbedeutung von γέγονεν. „Hineingekommen ist“ kann die im Griechischen vorausgesetzte, aber nicht näher bestimmte Bewegung ausdrücken.
  terminology: „Geheimnis“, „Verhärtung“ und „Fülle“ sind terminologisch treffend und bewahren die paulinische sowie die bewusst offene Ausdrucksweise. „Völker“ ist als Entsprechung von ἐθνῶν vertretbar; die Fußnote erläutert die im Kontext naheliegende Bedeutung „Nichtjuden“, ohne die Hauptfassung unnötig festzulegen.
