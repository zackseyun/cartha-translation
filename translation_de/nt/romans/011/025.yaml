id: ROM.11.25
reference: Romans 11:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: de
  text: 'Denn ich will nicht, dass euch, Brüder,[a] dieses Geheimnis unbekannt ist, damit ihr euch nicht selbst für klug haltet: Israel ist zum Teil eine Verhärtung widerfahren, bis die Fülle der Völker[b] hineingekommen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; die griechische Anrede kann eine gemischte Gruppe einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die volle Zahl der Nichtjuden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: unbekannt sein
  rationale: Die paulinische Wendung οὐ θέλω ὑμᾶς ἀγνοεῖν wird im Deutschen natürlich mit „ich will nicht, dass euch … unbekannt ist“ wiedergegeben und vermeidet den abwertenden Klang von „unwissend“.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der grammatisch maskuline Plural kann im griechischen Sprachgebrauch eine gemischte Gruppe anreden; die ausdrückliche inklusive Wiedergabe macht den Bezug auf die römische Gemeinde im heutigen Deutsch klar. Die formnähere Alternative steht in der Fußnote.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Bei Paulus bezeichnet μυστήριον einen zuvor verborgenen und nun offenbarten göttlichen Ratschluss; „Geheimnis“ bewahrt diesen theologischen Sprachgebrauch.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: damit ihr euch nicht selbst für klug haltet
  rationale: Die Formulierung gibt Zweck bzw. beabsichtigte Folge idiomatisch wieder und bewahrt die Warnung vor Selbstüberschätzung.
- source_word: πώρωσις
  choice: Verhärtung
  rationale: „Verhärtung“ ist die klare und etablierte Entsprechung für geistliche Unempfänglichkeit in diesem Zusammenhang.
- source_word: ἀπὸ μέρους
  choice: zum Teil
  rationale: Die Wendung lässt offen, ob sie insbesondere Umfang oder Anteil beschreibt, und vermeidet eine unnötige Festlegung durch ein attributives „teilweise“.
- source_word: τῷ Ἰσραὴλ γέγονεν
  choice: Israel ist … widerfahren
  rationale: Das deutsche Perfekt mit „widerfahren“ gibt den eingetretenen und fortbestehenden Zustand sowie den Dativbezug zu Israel knapp wieder.
- source_word: πλήρωμα
  choice: Fülle
  rationale: „Fülle“ bewahrt die Mehrdeutigkeit zwischen voller Zahl, Gesamtheit und Vollendung, ohne die umstrittene Aussage auszulegen.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: „Völker“ bildet ἔθνη quellennah ab; im Kontrast zu Israel bezeichnet es hier die nichtjüdischen Völker. Die geläufige Alternative „Nichtjuden“ wird in der Fußnote erläutert.
- source_word: εἰσέλθῃ
  choice: hineingekommen ist
  rationale: Nach ἄχρι οὗ bezeichnet der Aorist Konjunktiv den erreichten Endpunkt; das deutsche Perfekt mit „bis“ formuliert diese Schwelle natürlich, ohne ein Ziel hinzuzufügen, das der Text nicht nennt.
theological_decisions:
- issue: Bedeutung von „Fülle der Völker“
  choice: Die Hauptfassung lässt mit „Fülle der Völker“ offen, ob die volle Zahl, die Gesamtheit ihrer Aufnahme oder eine endzeitliche Vollendung gemeint ist.
  alternative: die volle Zahl der Nichtjuden
  rationale: Die Wendung ist theologisch umstritten. Eine quellennähere, offene Formulierung bewahrt die Spannung des Textes; eine verbreitete Deutung wird nur als Alternative genannt.
- issue: Umfang der Anrede ἀδελφοί
  choice: „Brüder und Schwestern“ macht den wahrscheinlich gemischten Adressatenkreis ausdrücklich sichtbar.
  alternative: Brüder
  rationale: Das griechische Maskulinum kann Frauen einschließen. Die inklusive Hauptfassung ist im modernen Deutsch verständlicher, während die formale Gestalt des Ausgangstextes in der Fußnote kenntlich bleibt.
- issue: Bezug von ἀπὸ μέρους
  choice: „zum Teil“ beschreibt eine begrenzte Verhärtung Israels, ohne genauer festzulegen, ob die Begrenzung zahlenmäßig oder in anderer Hinsicht zu verstehen ist.
  alternative: teilweise Verhärtung
  rationale: Der Text schränkt die Verhärtung ein, erklärt aber nicht ausdrücklich die genaue Art dieser Einschränkung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem argumentativen Aufbau des Griechischen; „Geheimnis“, „Verhärtung“ und „Fülle“ bewahren den theologischen Wortlaut und seine Deutungsoffenheit.
