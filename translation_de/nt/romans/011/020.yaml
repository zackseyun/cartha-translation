id: ROM.11.20
reference: Romans 11:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: de
  text: 'Ganz recht: Wegen ihres Unglaubens wurden sie herausgebrochen, du aber stehst durch den Glauben. Sei nicht überheblich, sondern fürchte dich.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist eine demütige, wachsame Furcht vor Gott, die jede überhebliche Selbstsicherheit ausschließt; der Ausdruck kann auch mit „habe Ehrfurcht“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Ganz recht
  rationale: Die Wendung bestätigt die Aussage des gedachten Gesprächspartners aus dem vorigen Vers und klingt im modernen Deutschen natürlich.
- source_word: τῇ ἀπιστίᾳ
  choice: wegen ihres Unglaubens
  rationale: Der Dativ bezeichnet hier im Zusammenhang den Grund des Herausbrechens; „Unglaube“ bewahrt den Gegensatz zu πίστις.
- source_word: ἐξεκλάσθησαν
  choice: wurden sie herausgebrochen
  rationale: Die konkrete Formulierung hält das Bild vom Ölbaum und seinen Zweigen fest.
- source_word: τῇ πίστει
  choice: durch den Glauben
  rationale: Der Dativ bezeichnet Mittel oder Grundlage ihres Standes; „Glaube“ wahrt den unmittelbaren Gegensatz zu „Unglaube“.
- source_word: ἕστηκας
  choice: du stehst
  rationale: Das deutsche Präsens gibt den durch das griechische Perfekt bezeichneten gegenwärtigen, fortdauernden Stand knapp und idiomatisch wieder.
- source_word: ὑψηλὰ φρόνει
  choice: Sei nicht überheblich
  rationale: Die idiomatische Wendung warnt davor, hoch von sich selbst zu denken; „überheblich“ ist klar, gegenwärtig und würdevoll.
- source_word: φοβοῦ
  choice: fürchte dich
  rationale: Die knappe Imperativform bewahrt die Schärfe und theologische Spannung des griechischen Befehls, ohne die Furcht zu bloßem Respekt abzuschwächen.
theological_decisions:
- issue: Bedeutung von πίστις im Gegensatz zu ἀπιστία
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Der direkte Gegensatz zu „Unglaube“ spricht hier vor allem für die glaubende beziehungsweise vertrauende Antwort des Menschen. „Glaube“ lässt dennoch die volle theologische Tragweite des Begriffs offen.
- issue: Bedeutung und Stärke von φοβοῦ
  choice: fürchte dich
  alternative: habe Ehrfurcht; sei in Furcht
  rationale: Der Zusammenhang warnt vor vermessener Selbstsicherheit angesichts von Gottes Handeln. Die unverstärkte Wiedergabe „fürchte dich“ bewahrt die Spannung zwischen ehrfürchtiger Vorsicht und wirklicher Furcht, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Das Ölbaumbild bleibt konkret erhalten. Der Gegensatz zwischen Unglaube und Glaube sowie die scharfe Aufforderung zur Furcht werden nicht abgeschwächt.
