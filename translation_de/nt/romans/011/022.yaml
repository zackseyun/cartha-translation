  source_fidelity: Der Entwurf gibt die kontrastierende Aufforderung, Gottes Güte und Strenge, die beiden parallelen Bezugsgruppen sowie die bedingte Warnung sachgerecht wieder. Bei „bei seiner Güte bleibst“ ist die räumlich/sphärische Nuance des Dativs jedoch weniger klar als im Griechischen; „in seiner Güte“ bildet das Verbleiben innerhalb bzw. unter Gottes Güte unmittelbarer ab.
  naturalness: Der Satz ist flüssiges, würdiges modernes Standarddeutsch. „Sieh“ ist als knapper Imperativ möglich. „Abgehauen“ ist im Bildzusammenhang verständlich, wirkt aber etwas kräftiger und umgangssprachlicher als das unmittelbare „abgeschnitten“.
  terminology: „Güte“ für χρηστότης und „Strenge“ für ἀποτομία sind treffend und bewahren den Kontrast. „Abgeschnitten werden“ gibt das passive ἐκκοπήσῃ klar wieder, ohne die Metapher oder den Grad der Härte unnötig auszubauen.
