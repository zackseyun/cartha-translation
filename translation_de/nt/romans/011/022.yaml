source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: de
  text: 'Sieh also die Güte und die Strenge Gottes: Strenge gegenüber denen, die gefallen sind, Gottes Güte aber gegenüber dir, wenn du in seiner Güte bleibst; sonst wirst auch du abgeschnitten werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „abgehauen“. Das griechische Verb bedeutet wörtlich „abschneiden“; im Zusammenhang steht das Bild von den Zweigen eines Ölbaums im Hintergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: Sieh
  rationale: Der Imperativ fordert dazu auf, Gottes Handeln aufmerksam wahrzunehmen und zu bedenken. „Sieh“ bewahrt die Bildhaftigkeit und ist im Deutschen natürlich.
- source_word: χρηστότητα / χρηστότης
  choice: Güte
  rationale: „Güte“ umfasst hier Gottes wohlwollende, freundliche Zuwendung und bildet einen klaren Gegensatz zu seiner Strenge.
- source_word: ἀποτομίαν / ἀποτομία
  choice: Strenge
  rationale: Das Wort bezeichnet die scharfe, entschiedene Seite des göttlichen Gerichts. „Strenge“ gibt diesen Sinn idiomatisch wieder, ohne ihn zu überzeichnen.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: gegenüber denen, die gefallen sind
  rationale: „Gegenüber“ bildet die Ausrichtung der beiden parallelen ἐπί-Fügungen ab; das Perfekt „gefallen sind“ bezeichnet ihren aus dem Fallen hervorgegangenen Zustand.
- source_word: ἐπὶ δὲ σὲ
  choice: gegenüber dir
  rationale: Die Formulierung wahrt den Parallelismus und die direkte Anrede im Singular.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: sofern du bei seiner Güte bleibst
  rationale: ἐπιμένω mit dem Dativ bezeichnet hier das fortdauernde Bleiben bei beziehungsweise im Bereich der göttlichen Güte. „Seiner“ macht den im Kontext eindeutigen Bezug auf Gott natürlich verständlich.
- source_word: ἐπεὶ
  choice: sonst
  rationale: Im Zusammenhang leitet ἐπεί die Folge für den Fall ein, dass die Bedingung nicht erfüllt wird. „Sonst“ gibt diese Warnlogik knapp und idiomatisch wieder.
- source_word: ἐκκοπήσῃ
  choice: wirst abgehauen
  rationale: Das Futur Passiv von ἐκκόπτω bedeutet „abhauen/abschneiden“. „Abgehauen“ passt zur umgebenden Ölbaum-Metapher und bewahrt den Vorgang des Entfernens eines Zweiges.
theological_decisions:
- issue: Bedingte Warnung im Verhältnis zu Gottes Güte und Gericht
  choice: Die Bedingung und ihre negative Folge werden als wirkliche Mahnung unmittelbar wiedergegeben.
  alternative: Die Warnung als bloß hypothetisch abschwächen oder sie ausdrücklich im Sinn einer bestimmten Lehre über Beharren beziehungsweise Abfall festlegen.
  rationale: Der griechische Text formuliert eine reale Bedingung samt Warnung, entscheidet hier aber nicht ausdrücklich zwischen späteren theologischen Deutungen oder zwischen individueller und gemeinschaftlicher Anwendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der direkte Imperativ und die Anrede im Singular bleiben erhalten. Der Gedankenstrich verdeutlicht den Gegensatz, ohne die Satzstruktur inhaltlich umzudeuten.
