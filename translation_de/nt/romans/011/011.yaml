id: ROM.11.11
reference: Romans 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: de
  text: 'Ich frage nun: Sie sind doch nicht gestrauchelt, um zu Fall zu kommen, oder?[a] Auf keinen Fall! Vielmehr ist durch ihre Verfehlung[b] das Heil zu den nichtjüdischen Völkern[c] gekommen, um sie zur Eifersucht zu reizen.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Sind sie etwa gestrauchelt, damit sie fallen?“ Die Frage erwartet ein Nein; der griechische Text unterscheidet „straucheln“ von „fallen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch ihre Übertretung“; das griechische Wort kann auch einen schuldhaften Fehltritt bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zu den Völkern“; gemeint sind hier die nichtjüdischen Völker.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „um sie zum Nacheifern anzuregen“. Die Eifersucht kann hier einschließen, dass sie nach demselben Heil verlangen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Ich frage nun
  rationale: Im argumentativen Zusammenhang leitet λέγω eine rhetorische Frage ein; „Ich frage nun“ gibt diese Diskursfunktion und die Folgerung durch οὖν natürlich wieder.
- source_word: μὴ ἔπταισαν
  choice: Sie sind doch nicht gestrauchelt … oder?
  rationale: Die Frage mit μή erwartet eine verneinende Antwort. Die deutsche Formulierung mit „doch nicht … oder?“ bewahrt diese Erwartung.
- source_word: ἵνα πέσωσιν
  choice: um zu Fall zu kommen
  rationale: Die Formulierung lässt Zweck oder Ergebnis offen und hält den Unterschied zwischen πταίω („straucheln“) und πίπτω („fallen, zu Fall kommen“) aufrecht, ohne einen endgültigen Untergang ausdrücklich einzutragen.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Diese geläufige, nachdrückliche deutsche Zurückweisung gibt Paulus’ feste Verneinung idiomatisch wieder.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: durch ihre Verfehlung
  rationale: παράπτωμα bezeichnet hier eine schuldhafte Verfehlung und kann zugleich an einen Fehltritt anknüpfen. „Durch“ gibt den instrumentalen Dativ wieder.
- source_word: ἡ σωτηρία
  choice: das Heil
  rationale: „Das Heil“ ist im Deutschen eine natürliche, theologisch gewichtige Wiedergabe von σωτηρία und bezeichnet Gottes rettendes Handeln beziehungsweise dessen Ergebnis.
- source_word: τοῖς ἔθνεσιν
  choice: zu den nichtjüdischen Völkern
  rationale: ἔθνη bezeichnet im jüdisch-nichtjüdischen Gegensatz des Zusammenhangs die Völker außerhalb Israels. Die Formulierung ist für heutige Leser unmittelbar verständlich und bewahrt zugleich den Völkerbegriff.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: um sie zur Eifersucht zu reizen
  rationale: εἰς τό mit Infinitiv bezeichnet Zweck oder Ergebnis. παραζηλόω wird mit der im Deutschen natürlichen Wendung wiedergegeben, ohne festzulegen, ob die Eifersucht rein negativ bleibt oder zum Nacheifern führt.
theological_decisions:
- issue: Ob Israels Straucheln als endgültiger Fall dargestellt wird
  choice: Die Übersetzung unterscheidet klar zwischen „straucheln“ und „zu Fall kommen“ und gibt die verneinende rhetorische Frage wieder.
  alternative: Den Fall ausdrücklich als endgültig, vollständig oder unwiderruflich zu bezeichnen.
  rationale: Der griechische Text unterscheidet die beiden Verben, erklärt aber nicht ausdrücklich mit einem Zusatz, in welchem Sinn der Fall endgültig wäre. Die theologische Spannung bleibt daher bestehen.
- issue: Bedeutung der Eifersucht im heilsgeschichtlichen Zusammenhang
  choice: „zur Eifersucht reizen“ bewahrt die gewöhnliche Bedeutung und lässt eine Bewegung zum Nacheifern als mögliche Nuance offen.
  alternative: Die Aussage ausschließlich als negative Missgunst oder ausdrücklich als positives Nacheifern zu deuten.
  rationale: παραζηλόω kann Eifersucht hervorrufen und im Zusammenhang zugleich ein Begehren nach demselben Heil nahelegen. Der Haupttext entscheidet diese Wirkungsrichtung nicht vorzeitig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Struktur bleibt hörbar; Fachjargon und konfessionell geprägte Zusätze werden vermieden. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Formulierungen.
