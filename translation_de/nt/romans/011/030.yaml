id: ROM.11.30
reference: Romans 11:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: de
  text: Denn wie ihr einst Gott ungehorsam wart,[a] jetzt aber durch ihren Ungehorsam Erbarmen gefunden habt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nicht an Gott glaubtet« und »durch ihren Unglauben«; die griechischen Wörter können in diesem Zusammenhang sowohl Ungehorsam als auch Unglauben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: Bewahrt sowohl die begründende Funktion von γάρ als auch die vergleichende Kraft von ὥσπερ und lässt den in Vers 31 fortgeführten Vergleich offen.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Gibt den Plural der zweiten Person direkt wieder, ohne die im Kontext erkennbaren nichtjüdischen Adressaten ausdrücklich in den Vers einzutragen.
- source_word: ποτε
  choice: einst
  rationale: Drückt den Gegensatz zur Gegenwart knapp und in würdigem, geläufigem Deutsch aus.
- source_word: ἠπειθήσατε
  choice: ungehorsam wart
  rationale: ἀπειθέω kann Ungehorsam und Unglauben bezeichnen. Diese Wiedergabe erhält den moralisch-relationalen Sinn und die Wortverbindung mit ἀπείθεια.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Bei »ungehorsam sein« wird der griechische Dativ im Deutschen natürlich ohne Präposition wiedergegeben.
- source_word: νῦν δὲ
  choice: jetzt aber
  rationale: Kennzeichnet den deutlichen Gegensatz zwischen dem früheren Ungehorsam und dem gegenwärtigen Erbarmen.
- source_word: ἠλεήθητε
  choice: Erbarmen gefunden habt
  rationale: Gibt das Passiv idiomatisch wieder und hält fest, dass den Angesprochenen Erbarmen zuteilgeworden ist.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: durch ihren Ungehorsam
  rationale: Bewahrt die mögliche instrumentale beziehungsweise vermittelnde Kraft des Dativs, ohne einen streng direkten Kausalmechanismus festzulegen. τούτων verweist im Kontext auf die zuvor genannten Israeliten und wird natürlich mit »ihren« wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀπειθέω / ἀπείθεια im paulinischen Zusammenhang
  choice: Ungehorsam / ungehorsam
  alternative: Unglaube / nicht glauben
  rationale: Beide Bedeutungsbereiche greifen hier ineinander. »Ungehorsam« bewahrt die formale Verbindung zwischen Verb und Substantiv und verengt die Aussage nicht auf eine rein gedankliche Ablehnung; die mögliche Bedeutung »Unglaube« wird in der Fußnote dokumentiert.
- issue: Bedeutung des Dativs τῇ τούτων ἀπειθείᾳ
  choice: durch ihren Ungehorsam
  alternative: wegen ihres Ungehorsams
  rationale: »Durch« hält die instrumentale oder vermittelnde Nuance des Dativs stärker offen. »Wegen« wäre ebenfalls möglich, könnte die Beziehung jedoch eindeutiger kausal erscheinen lassen, als die Form allein verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wie im Griechischen syntaktisch offen, da der mit »wie« begonnene Vergleich erst in Vers 31 fortgeführt wird. Die parallelen Begriffe werden konsequent mit »ungehorsam« und »Ungehorsam« wiedergegeben.
