id: ROM.11.1
reference: Romans 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: de
  text: 'Ich frage also: Hat Gott sein Volk verstoßen?[a] Auf keinen Fall![b] Denn auch ich bin ein Israelit, ein Nachkomme Abrahams,[c] aus dem Stamm Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurückgewiesen?“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Das geschehe niemals!“ Eine starke Form der Zurückweisung; auch übersetzbar mit: „Keineswegs!“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „aus dem Samen Abrahams“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Ich frage also
  rationale: λέγω führt hier eine rhetorische Frage ein; „ich frage“ ist im Deutschen natürlich, während „also“ die folgernde Kraft von οὖν bewahrt.
- source_word: μὴ ἀπώσατο
  choice: Hat ... verstoßen?
  rationale: ἀπωθέομαι bezeichnet Zurückweisung oder Verstoßung. Die mit μή eingeleitete Frage erwartet eine verneinende Antwort; „verstoßen“ gibt die starke relationale Aussage prägnant wieder.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Die übliche und kontextgemäße Wiedergabe von θεός.
- source_word: τὸν λαὸν αὐτοῦ
  choice: sein Volk
  rationale: Die Formulierung bewahrt sowohl die kollektive Bedeutung von λαός als auch den possessiven, im Kontext bundestheologisch bedeutsamen Bezug.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Die feste paulinische Wendung drückt eine nachdrückliche Zurückweisung aus. „Auf keinen Fall!“ ist stark, idiomatisch und in modernem Deutsch gut verständlich.
- source_word: καὶ γὰρ ἐγὼ
  choice: Denn auch ich
  rationale: γάρ begründet die Zurückweisung, καί bedeutet hier „auch“, und das ausdrücklich gesetzte ἐγώ hebt Paulus als Beispiel hervor.
- source_word: Ἰσραηλίτης
  choice: ein Israelit
  rationale: Die direkte und natürliche Bezeichnung seiner ethnischen und heilsgeschichtlichen Zugehörigkeit.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: ein Nachkomme Abrahams
  rationale: σπέρμα bedeutet wörtlich „Same“, bezeichnet hier aber die Abstammung. „Nachkomme“ vermittelt den Sinn in natürlichem Deutsch, ohne die Aussage zu erweitern.
- source_word: φυλῆς Βενιαμίν
  choice: aus dem Stamm Benjamin
  rationale: φυλή bezeichnet einen Stamm; die deutsche Wendung „aus dem Stamm Benjamin“ ist die übliche genealogische Formulierung.
theological_decisions:
- issue: Reichweite der Frage nach Gottes Verstoßung seines Volkes
  choice: Die Frage wird ohne Zusätze als „Hat Gott sein Volk verstoßen?“ wiedergegeben.
  alternative: „Hat Gott sein Volk endgültig/völlig verstoßen?“
  rationale: Im Griechischen stehen keine ausdrücklichen Bestimmungen wie „endgültig“, „völlig“ oder „für immer“. Der Zusammenhang soll die Reichweite der Frage entfalten; die Übersetzung nimmt die theologische Antwort nicht vorweg.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am argumentativen Verlauf des Griechischen, klingt aber natürlich. Die Fußnoten markieren echte lexikalische Alternativen; alle Marker stehen an der jeweils einschlägigen Stelle im Haupttext.
