revisions:
- from: Wenn aber einige der Zweige herausgebrochen wurden und du, obwohl du ein wilder Ölbaum bist,[a] unter ihnen eingepfropft wurdest und Mitteilhaber an der Wurzel, an der nährenden Fülle des Ölbaums geworden bist,[b]
  to: Wenn aber einige der Zweige herausgebrochen wurden und du, obwohl du ein wilder Ölbaum bist,[a] zwischen ihnen eingepfropft wurdest und Mitteilhaber an der Wurzel und an der Fülle des Ölbaums geworden bist,[b]
  rationale: Die Revision beseitigt die räumliche Fehlassoziation von „unter ihnen“, vermeidet die zusätzliche Aussage „nährend“ und ersetzt die irreführende Berufung auf eine abweichende Lesart durch eine zutreffend gekennzeichnete lexikalisch-syntaktische Fußnote. Das abschließende Komma bleibt erhalten, da der Bedingungssatz in Vers 18 fortgeführt wird.
