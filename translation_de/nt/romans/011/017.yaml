    issue: „unter ihnen“ ist als Wiedergabe von ἐν αὐτοῖς räumlich missverständlich.
    rationale: Im Deutschen bedeutet „unter“ gewöhnlich „unterhalb“. Gemeint ist das Einpfropfen zwischen beziehungsweise unter die verbliebenen Zweige.
  - severity: low
    issue: „nährenden“ ergänzt die Aussage von πιότης.
    rationale: πιότης bezeichnet Fülle, Reichhaltigkeit bzw. Fettigkeit; die Nährfunktion liegt zwar im Bild nahe, wird aber nicht eigens ausgedrückt.
  - severity: medium
    issue: Fußnote b bezeichnet eine Deutungsmöglichkeit unbelegt als „abweichende Lesart“.
    rationale: Der SBLGNT-Text und der englische Prüfpfad dokumentieren hier eine lexikalisch-syntaktische Alternative, keinen textkritischen Variantenbefund.
