source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: de
  text: Wenn aber einige der Zweige herausgebrochen wurden und du, obwohl du ein wilder Ölbaum bist,[a] zwischen ihnen eingepfropft wurdest und Mitteilhaber an der Wurzel und an der Fülle des Ölbaums geworden bist,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „obwohl du ein wilder Ölzweig bist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mitteilhaber an der reichen Wurzel des Ölbaums“. Traditionell: „an der Wurzel und an der Fettigkeit des Ölbaums“.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: Wenn aber
  rationale: Gibt die konditionale Einleitung und den leichten Gegensatz natürlich wieder.
- source_word: τινες τῶν κλάδων
  choice: einige der Zweige
  rationale: Bewahrt sowohl die unbestimmte Mengenangabe als auch den partitiven Genitiv.
- source_word: ἐξεκλάσθησαν
  choice: herausgebrochen wurden
  rationale: Entspricht dem Passiv und hält das konkrete Bild abgebrochener Zweige fest.
- source_word: ἀγριέλαιος ὢν
  choice: obwohl du ein wilder Ölbaum bist
  rationale: Das Partizip wird im Kontext konzessiv verstanden; das Bild bleibt wörtlich und wird nicht als Bezeichnung für einen Nichtjuden aufgelöst.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: unter ihnen eingepfropft wurdest
  rationale: Verwendet den geläufigen gärtnerischen Ausdruck und bezieht αὐτοῖς natürlich auf die dort verbliebenen Zweige.
- source_word: συγκοινωνὸς
  choice: Mitteilhaber
  rationale: Drückt gemeinsame Teilhabe mit anderen aus und bewahrt das σύν-Präfix deutlicher als das bloße „Teilhaber“.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: an der Wurzel, an der nährenden Fülle des Ölbaums
  rationale: Bewahrt die gedrängte Folge der Genitive und gibt πιότης als lebensspendende, reiche Fülle wieder, ohne sie auf materielles Fett zu verengen.
- source_word: ἐγένου
  choice: geworden bist
  rationale: Bezeichnet den Eintritt in einen neuen Zustand und passt im Deutschen zum Perfekt der vorausgehenden Passivhandlung.
theological_decisions:
- issue: Identität des wilden Ölbaums
  choice: Das Bild wird wörtlich als „wilder Ölbaum“ wiedergegeben.
  alternative: „wilder Ölzweig“ oder eine deutende Wiedergabe als „Nichtjude“
  rationale: Paulus entfaltet ein theologisches Argument durch das Baumgleichnis. Die Übersetzung soll dieses Bild erhalten und die Identität des Angeredeten nicht in den Wortlaut hinein auslegen.
- issue: Verhältnis von Wurzel und nährender Fülle
  choice: Die gemeinsame Teilhabe wird auf die Wurzel und, in appositioneller Weiterführung, auf die nährende Fülle des Ölbaums bezogen.
  alternative: „an der nährenden Wurzel des Ölbaums“ oder nach abweichender Lesart „an der Wurzel und der Fülle des Ölbaums“
  rationale: Die griechische Genitivfolge ist mehrdeutig und syntaktisch gedrängt. Die Hauptfassung hält ihre Spannung sichtbar; die Fußnote nennt die wichtigsten natürlichen Deutungsmöglichkeiten, ohne eine bestimmte ekklesiologische Identifikation der Wurzel festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche, aber verständliche „Mitteilhaber“ bewahrt den Gedanken gemeinsamer Teilhabe. Das abschließende Komma bleibt stehen, weil der griechische Bedingungssatz im folgenden Vers fortgesetzt wird.
