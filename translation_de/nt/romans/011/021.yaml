  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: de
  text: Denn wenn Gott die natürlichen Zweige[a] nicht verschont hat, wird er auch dich nicht verschonen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Zweige gemäß der Natur“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: Bewahrt sowohl die begründende Funktion von γάρ als auch die Bedingung von εἰ und fügt sich natürlich in den deutschen Argumentationsgang ein.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Die übliche und sachlich genaue Wiedergabe des Subjekts.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: die natürlichen Zweige
  rationale: κατὰ φύσιν bezeichnet hier die Zweige, die ihrer Natur bzw. natürlichen Zugehörigkeit nach zum Ölbaum gehören. Die knappe Formulierung erhält das Bild, ohne den gemeinten Bezug im Haupttext auszudeuten.
- source_word: οὐκ ἐφείσατο
  choice: nicht verschont hat
  rationale: φείδομαι bedeutet hier „verschonen“. Das Perfekt ist im Deutschen eine natürliche Erzählform für den griechischen Aorist und wahrt die Parallele zum folgenden Futur.
- source_word: οὐδὲ σοῦ φείσεται
  choice: wird er auch dich nicht verschonen
  rationale: Die deutsche Konstruktion mit „auch … nicht“ gibt die negative Weiterführung durch οὐδέ idiomatisch wieder. „Dich“ bewahrt den griechischen Singular σοῦ und damit die direkte Warnung.
theological_decisions:
- issue: Bezug der „natürlichen Zweige“ im Ölbaumgleichnis
  choice: Das Zweigbild bleibt im Haupttext ohne ausdrückliche Gleichsetzung erhalten.
  alternative: Die Zweige ausdrücklich als Israel beziehungsweise ethnisches Israel bezeichnen.
  rationale: Der Zusammenhang legt diesen Bezug nahe, doch Paulus formuliert ihn hier bildlich. Die Übersetzung sollte die Metapher nicht durch eine ausdeutende Paraphrase ersetzen.
- issue: Tragweite der Warnung an „dich“
  choice: Die Warnung wird unmittelbar und im Singular wiedergegeben, ohne dogmatische Zusätze.
  alternative: Die Aussage ausdrücklich auf individuelle oder gemeinschaftliche Erwählung, Abfall oder Beharren festlegen.
  rationale: Der griechische Text enthält eine wirkliche direkte Warnung, entscheidet an dieser Stelle aber nicht ausdrücklich zwischen den weitergehenden theologischen Deutungsmodellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist idiomatisch, erhält aber den konditionalen Begründungsgang, die Ölbaummetapher und die betonte direkte Anrede im Singular.
