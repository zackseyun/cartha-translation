  source_fidelity: „Denn wenn“ gibt εἰ γάρ treffend als begründende Bedingung wieder. „die natürlichen Zweige“ bildet τῶν κατὰ φύσιν κλάδων knapp und sachgerecht ab, ohne die Metapher auszudeuten. „nicht verschont hat“ und „wird er auch dich nicht verschonen“ bewahren die semantische und rhetorische Parallelität von οὐκ ἐφείσατο und οὐδὲ σοῦ φείσεται; „dich“ erhält die griechische Singularanrede.
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und besitzt einen angemessen würdevollen, argumentativen Registerton. Die Stellung „wird er auch dich nicht verschonen“ ist natürlich und betont die negative Fortführung angemessen.
  terminology: „Gott“, „verschonen“ und „natürliche Zweige“ sind terminologisch treffend. Die Fußnote bietet die wörtlichere Alternative, ohne den metaphorischen Bezug oder theologische Folgerungen vorwegzunehmen.
