source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: de
  text: O, welche Tiefe des Reichtums, der Weisheit und der Erkenntnis Gottes![a] Wie unerforschlich sind seine Urteile und wie unergründlich seine Wege![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „O, welche Tiefe des Reichtums sowohl der Weisheit als auch der Erkenntnis Gottes!“ Die griechische Satzfügung kann „Reichtum“ enger mit „Weisheit und Erkenntnis Gottes“ verbinden. Die Hauptfassung versteht Reichtum, Weisheit und Erkenntnis als drei parallele Aussagen über Gott.'
    reason: alternative_reading
  - marker: b
    text: „Unergründlich“ gibt ein griechisches Wort wieder, das wörtlich etwas bezeichnet, dessen Spur nicht verfolgt werden kann. Damit unterscheidet es sich im Bild von „unerforschlich“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: O
  rationale: Die Ausrufepartikel eröffnet den staunenden Lobpreis. „O“ bewahrt die knappe, feierliche Form und ist im gehobenen modernen Deutsch weiterhin verständlich.
- source_word: βάθος
  choice: Tiefe
  rationale: Das Substantiv bezeichnet hier bildlich die unermessliche Tiefe dessen, was Gott eigen ist.
- source_word: πλούτου
  choice: Reichtum
  rationale: „Reichtum“ bewahrt das paulinische Bild einer übergroßen Fülle und klingt im Deutschen natürlicher als der Plural „Reichtümer“.
- source_word: σοφίας
  choice: Weisheit
  rationale: Die übliche und sachlich genaue Wiedergabe; der Begriff bleibt von „Erkenntnis“ unterschieden.
- source_word: γνώσεως
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt γνῶσις in diesem doxologischen Zusammenhang natürlich wieder und wahrt die Unterscheidung von Gottes Weisheit.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird auf Reichtum, Weisheit und Erkenntnis bezogen. Die deutsche Genitivform erhält den kompakten Rhythmus.
- source_word: ὡς
  choice: Wie
  rationale: Das exklamative „Wie“ leitet die staunende Aussage der zweiten Satzhälfte idiomatisch ein.
- source_word: ἀνεξεραύνητα
  choice: unerforschlich
  rationale: Das Wort bezeichnet etwas, das nicht vollständig untersucht oder ergründet werden kann.
- source_word: κρίματα
  choice: Urteile
  rationale: κρίματα kann Urteile, Entscheidungen oder richterliche Bestimmungen bezeichnen. „Urteile“ wahrt diese Breite besser als das engere „Beschlüsse“.
- source_word: ἀνεξιχνίαστοι
  choice: lassen sich nicht nachverfolgen
  rationale: Die Formulierung erhält gegenüber „unerforschlich“ die Bildvorstellung von etwas, dessen Spur oder Verlauf nicht verfolgt werden kann.
- source_word: ὁδοὶ
  choice: Wege
  rationale: „Wege“ bewahrt das biblische Bild für Gottes Handeln und Vorgehen.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das zweimalige Pronomen bezieht sich jeweils unmittelbar auf Gott und wird entsprechend wiederholt.
theological_decisions:
- issue: Bezug des Genitivs θεοῦ auf Reichtum, Weisheit und Erkenntnis
  choice: '„Gottes“ wird auf alle drei Hauptwörter bezogen: Gottes Reichtum, Weisheit und Erkenntnis.'
  alternative: '„Reichtum“ kann enger mit „Weisheit und Erkenntnis Gottes“ verbunden werden: der Reichtum, der in Gottes Weisheit und Erkenntnis besteht.'
  rationale: Die griechische Wortfolge lässt beide Verknüpfungen zu. Die Hauptfassung versteht die drei Hauptwörter als parallele Aussagen über Gott; die echte syntaktische Alternative wird in Fußnote [a] bewahrt.
- issue: Unterscheidung zwischen ἀνεξεραύνητα und ἀνεξιχνίαστοι
  choice: „unerforschlich“ für Gottes Urteile und „lassen sich nicht nachverfolgen“ für seine Wege
  alternative: Beide mit eng benachbarten Wörtern wie „unerforschlich“ und „unergründlich“ wiedergeben.
  rationale: Der griechische Text verwendet zwei verschiedene Wörter. Die gewählte Fassung wahrt beim zweiten die Vorstellung des Spurenlesens, ohne daraus einen technischen theologischen Unterschied zu machen.
translation_notes:
  register: Moderner, würdevoller Lobpreis mit knapper rhetorischer Steigerung. Die Wiederholung von „wie“ macht die Parallelität im Deutschen deutlich. „O“ ist bewusst feierlich, aber allgemein verständlich; die zweite Adjektivform wird verbal wiedergegeben, um das griechische Spurenbild natürlich auszudrücken.
