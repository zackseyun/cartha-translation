    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Euch Nichtjuden aber sage ich
  rationale: Die beiden Dativausdrücke werden als direkte Anrede zusammengeführt. δέ kennzeichnet den Übergang und leichten Gegensatz mit „aber“, ohne ein nicht vorhandenes Zeitadverb einzuführen.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: Insofern … nun
  rationale: „Insofern“ gibt den Bezug auf Maß beziehungsweise Begründung wieder; „nun“ nimmt die fortführende Funktion der Partikeln auf, ohne sie übermäßig auszudeuten.
- source_word: ἐθνῶν ἀπόστολος
  choice: Apostel für die Nichtjuden
  rationale: Der Genitiv bezeichnet hier den Adressatenkreis des apostolischen Auftrags. „Für“ klingt im Deutschen natürlicher als „Apostel der Nichtjuden“ und vermeidet ein Besitzverhältnis.
- source_word: τὴν διακονίαν μου
  choice: meinen Dienst
  rationale: „Dienst“ bewahrt den Grundgedanken des Dienens und ist im Zusammenhang des apostolischen Auftrags verständlich, ohne auf einen institutionellen Amtsbegriff verengt zu werden.
- source_word: δοξάζω
  choice: ehre ich
  rationale: Das Verb bezeichnet hier, dem eigenen Dienst Ehre und Gewicht beizumessen. „Ehren“ ist natürliches Deutsch und lässt den Dienst, nicht Paulus selbst, als Objekt der Hervorhebung erkennen.
theological_decisions:
- issue: Bedeutung von ἔθνη im Gegensatz zu Israel
  choice: Nichtjuden
  alternative: Völker
  rationale: Im Zusammenhang von Römer 9–11 bezeichnet der Ausdruck die nichtjüdischen Menschen im Gegenüber zu Israel. „Nichtjuden“ macht diesen Bezug im heutigen Deutsch klar; die wörtlichere Alternative bleibt in der Fußnote sichtbar.
- issue: Paulus’ Aussage über seinen Dienst
  choice: Er ehrt seinen apostolischen Dienst.
  alternative: Er verherrlicht seinen Dienst.
  rationale: Das Objekt des Verbs ist der Dienst, nicht Paulus selbst. Die Formulierung wahrt die starke positive Wertung, ohne daraus Selbsterhöhung oder Prahlen abzuleiten; die stärkere lexikalische Alternative wird angemerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtjuden“ ist gegenüber dem traditionell gebräuchlichen „Heiden“ sachlicher und im heutigen Sprachgebrauch weniger missverständlich. Der abschließende Beistrich zeigt an, dass der Gedankengang im folgenden Vers weitergeht.
