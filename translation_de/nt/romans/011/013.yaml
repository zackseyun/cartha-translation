revisions:
- from: 'Euch Nichtjuden[a] aber sage ich: Insofern ich nun Apostel für die Nichtjuden bin, ehre ich meinen Dienst[b],'
  to: 'Euch Nichtjuden[a] aber sage ich: Als Apostel für die Nichtjuden preise ich meinen Dienst[b],'
  rationale: Die Revision ersetzt die schwerfällige und potenziell einschränkend verstandene Konstruktion „Insofern ich nun“ durch die im Deutschen natürliche Perspektivformulierung „Als Apostel für die Nichtjuden“. Sie gibt damit den Bezug von ἐφ’ ὅσον auf Paulus’ apostolische Aufgabe wieder, ohne eine weitergehende theologische Deutung einzutragen. „Preise ich meinen Dienst“ stärkt die Wiedergabe von δοξάζω gegenüber „ehre ich“ und entspricht dem englischen Auditpfad („I magnify my ministry“; Alternative „I glorify“). Die bestehende Fußnotenalternative zu ἔθνη bleibt erhalten.
