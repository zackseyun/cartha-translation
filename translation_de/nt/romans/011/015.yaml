reference: Romans 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: de
  text: Denn wenn ihre Verwerfung die Versöhnung der Welt bedeutet, was wird dann ihre Annahme[a] anderes bedeuten als Leben aus den Toten[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aufnahme“ oder „Wiederannahme“. Das griechische Wort steht im Gegensatz zu „Verwerfung“ und kann das Auf- oder Wiederaufnehmen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Leben aus den Toten“ kann bildlich eine außergewöhnliche geistliche Erneuerung oder konkreter die Auferstehung bezeichnen; Paulus lässt die Wendung knapp und vieldeutig.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: Verwerfung
  rationale: Bewahrt den relationalen Sinn des Zurückweisens beziehungsweise Beiseitesetzens und bildet einen klaren Gegensatz zu πρόσλημψις.
- source_word: καταλλαγὴ
  choice: Versöhnung
  rationale: Entspricht dem üblichen paulinischen Sprachgebrauch für die Wiederherstellung einer gestörten Beziehung.
- source_word: κόσμου
  choice: der Welt
  rationale: Gibt die breite Formulierung des griechischen Textes wieder, ohne sie im Haupttext auf die nichtjüdische Welt einzuengen.
- source_word: πρόσλημψις
  choice: Annahme
  rationale: Drückt das Auf- oder Wiederannehmen aus und steht im Deutschen natürlich im Gegensatz zu „Verwerfung“.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: Leben aus den Toten
  rationale: Bleibt eng an der knappen, bildkräftigen griechischen Wendung und legt nicht fest, ob geistliche Erneuerung oder Auferstehung gemeint ist.
- source_word: εἰ μὴ
  choice: anderes … als
  rationale: Gibt in der rhetorischen Frage die ausschließende und nachdrückliche Kraft idiomatisch wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den begründenden Anschluss an den vorausgehenden Gedankengang.
theological_decisions:
- issue: Bedeutung von „Leben aus den Toten“
  choice: Die offene eschatologische Wendung bleibt im Haupttext unaufgelöst.
  alternative: Die Formulierung ausdrücklich als umfassende geistliche Erneuerung oder als endzeitliche Auferstehung deuten.
  rationale: Paulus formuliert knapp und mehrdeutig; die Übersetzung soll die mögliche Spannung zwischen bildlicher Belebung und Auferstehung bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird natürlich formuliert; „Verwerfung“, „Versöhnung“ und „Annahme“ bewahren zugleich den paulinischen Begriffsgehalt und den Gegensatz des Satzes.
