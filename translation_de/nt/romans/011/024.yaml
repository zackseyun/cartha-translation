source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: de
  text: Denn wenn du aus dem von Natur aus wilden Ölbaum herausgeschnitten und gegen die Natur in einen kultivierten Ölbaum eingepfropft wurdest, wie viel mehr werden diese, die natürlichen Zweige[a], in ihren eigenen Ölbaum eingepfropft werden[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „diese, die von Natur aus sind“; „Zweige“ ist aus dem Ölbaumbild im Zusammenhang ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „wieder in ihren eigenen Ölbaum eingepfropft werden“. Die Rückkehr ist im Zusammenhang vorausgesetzt; „wieder“ steht jedoch nicht ausdrücklich im griechischen Text.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: herausgeschnitten wurdest
  rationale: ἐκκόπτω bezeichnet ein Heraus- oder Abschneiden. „Herausgeschnitten“ wahrt den konkreten gärtnerischen Vorgang und unterscheidet ihn vom im Kontext ebenfalls vorkommenden Abbrechen.
- source_word: ἀγριελαίου
  choice: wilder Ölbaum
  rationale: Das Substantiv bezeichnet einen wilden Ölbaum und bildet den klaren Gegensatz zum kultivierten beziehungsweise veredelten Ölbaum.
- source_word: παρὰ φύσιν
  choice: gegen die Natur
  rationale: Die Wendung bewahrt den ausdrücklichen Gegensatz zu κατὰ φύσιν und klingt im modernen Deutschen natürlich.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: eingepfropft wurdest / eingepfropft werden
  rationale: ἐγκεντρίζω ist der gärtnerische Fachausdruck für das Pfropfen. „Einpfropfen“ ist im Deutschen anschaulich und idiomatisch.
- source_word: καλλιέλαιον
  choice: veredelter Ölbaum
  rationale: Gemeint ist der kultivierte, gepflegte Ölbaum im Gegensatz zum wilden Ölbaum. „Veredelt“ passt zur gärtnerischen Bildwelt, ohne den Baum bloß moralisch als „gut“ zu bewerten.
- source_word: πόσῳ μᾶλλον
  choice: wie viel mehr
  rationale: Dies ist die geläufige deutsche Wiedergabe des Schlusses vom weniger zum mehr.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: diese, die natürlichen Zweige
  rationale: „Zweige“ steht nicht ausdrücklich im griechischen Satz, ist aber durch das Ölbaumgleichnis und den unmittelbaren Kontext eindeutig mitgedacht. Die Ergänzung sorgt für verständliches Deutsch.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: in ihren eigenen Ölbaum
  rationale: Der Dativ wird entsprechend dem Pfropfbild mit „in“ wiedergegeben; ἰδίᾳ betont die natürliche Zugehörigkeit zu diesem Baum.
theological_decisions:
- issue: Ob „diese“ ausdrücklich als Israel beziehungsweise Juden bezeichnet werden soll
  choice: Der Bezug bleibt im Haupttext als „diese, die natürlichen Zweige“ im Ölbaumbild ausgedrückt.
  alternative: „diese Juden“ oder „diese Israeliten“
  rationale: Der Zusammenhang bezieht die Aussage auf Israel, doch der griechische Vers verwendet hier keine ausdrückliche ethnische Bezeichnung. Die metaphorische Form soll deshalb erhalten bleiben.
- issue: Ob „Zweige“ trotz fehlenden ausdrücklichen Substantivs ergänzt werden soll
  choice: „Zweige“ wird zur verständlichen Fortführung des Ölbaumbildes ergänzt und mit einer Fußnote gekennzeichnet.
  alternative: „diese, die von Natur aus dazugehören“
  rationale: Die Ergänzung ist unmittelbar aus dem Kontext erschließbar, vermeidet eine schwerfällige substantivierte Form und legt die theologische Bedeutung nicht über den Wortlaut hinaus fest.
- issue: Ob beim abschließenden Pfropfen „wieder“ ergänzt werden soll
  choice: Im Haupttext steht kein „wieder“.
  alternative: „wieder in ihren eigenen Ölbaum eingepfropft werden“
  rationale: Die Rückkehr ist im Kontext sachlich nahegelegt, doch das griechische Verb selbst enthält kein ausdrückliches Präfix oder Adverb mit der Bedeutung „wieder“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Das durchgehende Ölbaumbild bleibt erhalten; „du“ entspricht der direkten Anrede im Singular. Die Satzform bewahrt den argumentativen Nachdruck des griechischen Schlusses.
