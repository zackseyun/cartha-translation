  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: de
  text: Und dies ist mein Bund mit ihnen[a], wenn ich ihre Sünden wegnehme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und dies ist ihnen der von mir ausgehende Bund.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: Bund
  rationale: Im paulinischen Zusammenhang und im prophetischen Schriftzitat bezeichnet διαθήκη Gottes verbindliche Bundeszusage; „Bund“ bewahrt diesen alttestamentlichen Bezug.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: mein Bund
  rationale: Wörtlich steht hier etwa „der von mir ausgehende Bund“. Das natürliche deutsche „mein Bund“ gibt Ursprung und Zugehörigkeit knapp wieder; die formalere Lesart wird in der Fußnote bewahrt.
- source_word: αὐτοῖς
  choice: mit ihnen
  rationale: Der Dativ kann formal „ihnen“ bedeuten. Im Deutschen wird ein Bund idiomatisch „mit“ jemandem geschlossen oder gehalten, daher „mit ihnen“.
- source_word: ὅταν
  choice: wenn
  rationale: ὅταν bezeichnet hier den Zeitpunkt der Erfüllung der prophetischen Zusage, nicht beliebig wiederkehrende Fälle.
- source_word: ἀφέλωμαι
  choice: wegnehme
  rationale: Das Medium von ἀφαιρέω bezeichnet hier die Beseitigung der Sünden. „wegnehmen“ ist klar, natürlich und bewahrt die bildhafte Ausdrucksweise.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ihre Sünden
  rationale: Die direkte Wiedergabe erhält den Plural und den moralisch-theologischen Sinn des Ausdrucks.
- source_word: καὶ αὕτη
  choice: Und dies ist
  rationale: Im Griechischen fehlt ein ausdrückliches Verb. Deutsch ergänzt idiomatisch „ist“; die Zukunft der Verheißung wird bereits durch den mit „wenn“ eingeleiteten Satz getragen, ohne ein nicht ausdrücklich vorhandenes Futur einzufügen.
theological_decisions:
- issue: Bedeutung von διαθήκη im prophetischen Zitat
  choice: Bund
  alternative: Testament
  rationale: „Bund“ bewahrt den Bezug auf Gottes heilsgeschichtliche Zusage und vermeidet die sachfremde Vorstellung eines letzten Willens.
- issue: Zeitlicher Sinn von ὅταν ἀφέλωμαι
  choice: wenn ich ihre Sünden wegnehme
  alternative: wann immer ich ihre Sünden wegnehme
  rationale: Der Zusammenhang spricht von der gewissen Erfüllung einer prophetischen Zusage, nicht von einer unbestimmten Wiederholung.
- issue: Zeitform der elliptischen Wendung καὶ αὕτη
  choice: dies ist
  alternative: dies wird sein
  rationale: Der griechische Text enthält kein ausdrückliches Futur. „Ist“ wahrt die knappe nominale Form, während der folgende Zeitsatz den künftigen Erfüllungsbezug offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nah am Griechischen, ohne im Deutschen unnötig sperrig zu wirken.
