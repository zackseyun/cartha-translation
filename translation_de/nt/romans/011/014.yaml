  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: de
  text: ob ich vielleicht meine Volksgenossen zur Eifersucht reizen und einige von ihnen retten kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mein Fleisch“; gemeint sind meine jüdischen Volksgenossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: ob ich dadurch vielleicht … kann
  rationale: Die Wendung drückt im Zusammenhang ein erhofftes, aber ungewisses Ziel aus. Die deutsche Formulierung mit „vielleicht“ bewahrt diesen vorsichtigen Charakter; „dadurch“ nimmt sinngemäß auf den im vorherigen Vers genannten Dienst Bezug.
- source_word: παραζηλώσω
  choice: zur Eifersucht reizen
  rationale: Die Wiedergabe erhält das Motiv der Eifersucht aus dem unmittelbaren Kontext und gibt die bewirkende Kraft des Verbs natürlich wieder.
- source_word: μου τὴν σάρκα
  choice: meine eigenen Volksgenossen
  rationale: Wörtlich steht „mein Fleisch“. Hier bezeichnet die Wendung jedoch Paulus’ leiblich-ethnische Verwandtschaft, also seine jüdischen Volksgenossen. Die verständliche Bedeutung steht im Haupttext; die griechische Metapher wird in der Fußnote bewahrt.
- source_word: σώσω
  choice: retten
  rationale: Das Verb hat hier das für Paulus typische heilsgeschichtliche Gewicht; „retten“ ist die klare und übliche deutsche Entsprechung.
- source_word: τινὰς ἐξ αὐτῶν
  choice: einige von ihnen
  rationale: Die Formulierung bezeichnet eine Teilmenge aus der zuvor genannten Gruppe und entspricht idiomatischem Deutsch.
theological_decisions:
- issue: Bedeutung von σάρξ in Paulus’ Bezeichnung seiner ethnischen Gruppe
  choice: Als Verwandtschafts- und Volkszugehörigkeit mit „meine eigenen Volksgenossen“ wiedergegeben
  alternative: 'Wörtlich: „mein eigenes Fleisch“'
  rationale: σάρξ bezeichnet hier nicht eine sündige Natur, sondern Paulus’ natürliche und ethnische Verbundenheit mit Israel. Der Haupttext macht den Bezug verständlich, während die Fußnote die bildhafte Ausdrucksweise des Griechischen offenlegt.
- issue: Paulus als handelndes Mittel beim Retten
  choice: „einige von ihnen retten kann“
  alternative: „zur Rettung einiger von ihnen beitragen kann“
  rationale: Der direkte Ausdruck des griechischen σώσω bleibt erhalten. Er behauptet nicht, Paulus sei der letzte Urheber der Rettung, sondern beschreibt seine dienende Mitwirkung, wie es der Satz selbst formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform wird durch den Anschluss „ob ich dadurch vielleicht“ natürlich gestaltet; die ethnische Bedeutung der griechischen Fleisch-Metapher erscheint verständlich im Haupttext und wörtlich in der Fußnote.
