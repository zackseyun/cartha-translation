  source_fidelity: 'Die Grundbegriffe sind zutreffend wiedergegeben: οὕτως οὖν καί als folgerndes „So ... nun auch“, ἐν τῷ νῦν καιρῷ als gegenwärtige Zeit, λεῖμμα als „Rest“, ἐκλογή als „Erwählung“ und γέγονεν mit resultativem Perfekt. In der vorliegenden Syntax verschiebt jedoch „aufgrund ... entstanden“ die Beziehung von κατὰ ἐκλογὴν χάριτος: Die Präpositionalphrase wird zu einer kausalen Erklärung des Entstehens des Restes, statt die im Griechischen offenere Bestimmung „gemäß/entsprechend einer Erwählung ...“ beizubehalten.'
  naturalness: „So ist nun auch in der gegenwärtigen Zeit ein Rest ... entstanden“ ist modernes, verständliches Standarddeutsch und bildet die Stellung des Prädikats γέγονεν angemessen ab. „Gemäß“ ist hier genauer als „aufgrund“, ohne unnatürlich zu wirken.
  terminology: „Rest“, „Erwählung“ und „Gnade“ sind sachgerechte, im paulinischen Kontext verständliche Begriffe. „Erwählung aus Gnade“ gibt eine mögliche, sprachlich natürliche Auslegung der genitivischen Verbindung wieder; die Fußnote erhält die formal nähere und weitere Alternativen.
