  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: de
  text: So ist nun auch in der gegenwärtigen Zeit ein Rest gemäß einer Erwählung aus Gnade[a] entstanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gemäß einer Erwählung der Gnade“, „gemäß gnädiger Erwählung“ oder „gemäß einer Erwählung durch Gnade“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: So gibt es nun auch
  rationale: „So … nun“ zieht die Folgerung aus dem Elia-Beispiel; „auch“ wahrt die Parallele zur gegenwärtigen Zeit.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: in der gegenwärtigen Zeit
  rationale: Die Formulierung bezeichnet die gegenwärtige Epoche und bewahrt den zeitlichen Kontrast zum Zeitalter Elias.
- source_word: λεῖμμα
  choice: einen Rest
  rationale: „Rest“ ist der etablierte und verständliche biblische Ausdruck für die verbliebene Minderheit.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: aufgrund einer Erwählung aus Gnade
  rationale: „Erwählung“ wahrt das theologisch gewichtige ἐκλογή; „aus Gnade“ gibt χάριτος wieder, ohne die genaue genitivische Beziehung unnötig eng festzulegen.
- source_word: γέγονεν
  choice: entstanden ist
  rationale: Das Perfekt von γίνομαι bezeichnet einen eingetretenen Vorgang mit fortbestehendem Ergebnis; „entstanden ist“ bewahrt diese verbale Kraft natürlicher als ein bloßes „ist“.
theological_decisions:
- issue: Wiedergabe von ἐκλογή in einem lehrmäßig umstrittenen paulinischen Zusammenhang
  choice: Erwählung
  alternative: Auswahl; Auserwähltheit
  rationale: „Erwählung“ ist die übliche sachgerechte Entsprechung und bewahrt das theologische Gewicht, ohne ein bestimmtes konfessionelles System einzutragen.
- issue: Verhältnis von Gnade und Erwählung in κατ’ ἐκλογὴν χάριτος
  choice: Erwählung aus Gnade
  alternative: gnädige Erwählung; Erwählung durch Gnade
  rationale: Die gewählte Formulierung stellt die Erwählung als von Gnade geprägt beziehungsweise in ihr begründet dar, ohne die mehrdeutige Genitivbeziehung vollständig auf eine einzige Kategorie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist natürlich, während „Rest“, „Erwählung“ und „Gnade“ als zentrale paulinische Begriffe erhalten bleiben.
