id: ROM.11.3
reference: Romans 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: de
  text: Herr, sie haben deine Propheten getötet und deine Altäre niedergerissen. Ich allein bin übrig geblieben, und sie trachten mir nach dem Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie suchen meine Seele“; die griechische Wendung bedeutet hier, dass sie ihm nach dem Leben trachten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος richtet sich hier unmittelbar an Gott. „Herr“ ist die natürliche und traditionsübergreifend verständliche deutsche Wiedergabe.
- source_word: ἀπέκτειναν
  choice: haben getötet
  rationale: Das Verb bezeichnet das Töten, ohne für sich allein die zusätzliche rechtliche oder moralische Nuance von „ermorden“ ausdrücklich festzulegen.
- source_word: θυσιαστήριά
  choice: Altäre
  rationale: θυσιαστήριον bezeichnet einen Opferaltar; im Deutschen ist „Altäre“ im Zusammenhang eindeutig und vermeidet eine unnötig schwere Formulierung.
- source_word: κατέσκαψαν
  choice: niedergerissen
  rationale: Das Verb beschreibt das Abtragen oder Zerstören bis auf den Grund. Bei Altären gibt „niedergerissen“ die konkrete Handlung natürlich wieder.
- source_word: κἀγὼ
  choice: Ich
  rationale: Die Verbindung aus καί und ἐγώ wird am neuen Satz durch „Ich“ wiedergegeben; das folgende „allein“ trägt die inhaltliche Hervorhebung, ohne ein zusätzliches „sogar“ einzuführen.
- source_word: ὑπελείφθην μόνος
  choice: ich allein bin übrig geblieben
  rationale: Die Formulierung wahrt den passiven Ergebnissinn und betont die von Elia wahrgenommene zahlenmäßige Ausschließlichkeit.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: sie trachten mir nach dem Leben
  rationale: Die feste deutsche Wendung gibt die gegenwärtige, feindliche Absicht idiomatisch wieder. ψυχή bezeichnet hier das bedrohte Leben, nicht ausdrücklich eine vom Körper getrennte Seele.
theological_decisions:
- issue: Wiedergabe von ψυχή in einer Bedrohungsformel
  choice: Leben
  alternative: Seele
  rationale: Im Kontext geht es darum, Elia zu töten. „Leben“ bewahrt den gemeinten Sinn, ohne eine Aussage über die Beschaffenheit des Menschen oder eine immaterielle Seele in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzverknüpfung des Griechischen bleibt weitgehend erhalten; ein Satzpunkt nach „niedergerissen“ verhindert jedoch eine schwerfällige deutsche Reihung. Die bildhafte deutsche Wendung „nach dem Leben trachten“ wahrt sowohl die Bedrohung als auch den idiomatischen Charakter des griechischen Ausdrucks.
