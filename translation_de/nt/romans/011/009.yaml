  verdict: approve
  source_fidelity: 'Der Text gibt alle Elemente des griechischen Satzes vollständig und in ihrer Reihenfolge wieder: David als Sprecher, das literarische Präsens, den jussivischen Wunsch, das konkrete Bild des Tisches sowie die vier Folgen Schlinge, Falle, Stolperstein und Vergeltung. Die Zuordnung von »ihr« zu αὐτῶν und von »ihnen« zu αὐτοῖς bleibt erkennbar.'
  naturalness: '»Und David sagt: ›Ihr Tisch soll ihnen zur Schlinge und zur Falle, zum Stolperstein und zur Vergeltung werden.‹« ist flüssiges modernes Standarddeutsch mit angemessen würdigem Bibelregister. Die Konstruktion mit »soll … werden« trägt den jussivisch-imprekatorischen Charakter idiomatisch, ohne ihn zu einer bloßen Zukunftsaussage abzuschwächen.'
  terminology: 'Die Begriffswahl ist sachgerecht: »Schlinge« und »Falle« bewahren die parallelen Fangbilder, »Stolperstein« gibt σκάνδαλον bildhaft wieder, und »Vergeltung« ist für ἀνταπόδομα im Kontext natürlich, ohne eine konfessionell geprägte Deutung einzutragen. Der Name »David« entspricht dem deutschen Gebrauch.'
