id: ROM.11.9
reference: Romans 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: de
  text: 'Und David sagt: »Ihr Tisch soll ihnen zur Schlinge und zur Falle, zum Stolperstein und zur Vergeltung werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δαυὶδ
  choice: David
  rationale: Die im Deutschen übliche Namensform.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt das griechische Präsens als natürliches literarisches Präsens zur Einleitung des Zitats.
- source_word: Γενηθήτω
  choice: soll … werden
  rationale: Gibt den jussivischen Imperativ in gegenwärtigem, würdigem Deutsch wieder und bewahrt den Charakter des Fluchwunsches.
- source_word: ἡ τράπεζα αὐτῶν
  choice: ihr Tisch
  rationale: Bewahrt das konkrete Bild des Ausgangstextes, ohne es als Mahlgemeinschaft oder Versorgung auszudeuten.
- source_word: παγίδα
  choice: Schlinge
  rationale: Eine geläufige metaphorische Bezeichnung für ein Mittel des Fangens; sie bleibt vom folgenden Begriff unterscheidbar.
- source_word: θήραν
  choice: Falle
  rationale: Im parallelen Zusammenhang bezeichnet das Wort etwas zum Fangen; »Falle« gibt dies natürlich wieder, während die Grundbedeutung auch Jagd oder Beute berühren kann.
- source_word: σκάνδαλον
  choice: Stolperstein
  rationale: Bewahrt das Bild eines Hindernisses, das zu Fall bringt, statt es auf subjektives Ärgernis zu verengen.
- source_word: ἀνταπόδομα
  choice: Vergeltung
  rationale: Bezeichnet eine entsprechende Erwiderung beziehungsweise Rückerstattung; im Fluchkontext ist »Vergeltung« natürlich, ohne die Art des Gerichts weiter auszulegen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das Dativpronomen wird idiomatisch in die Konstruktion »ihnen zur … Vergeltung« eingebunden.
theological_decisions:
- issue: Fluchwunsch im Zitat aus Psalm 69
  choice: 'Der jussivische Fluchwunsch bleibt direkt erhalten: »Ihr Tisch soll … werden.«'
  alternative: »Ihr Tisch wird … werden« oder »Möge ihr Tisch … werden«
  rationale: Der griechische Imperativ ist mehr als eine bloße Zukunftsaussage. »Soll … werden« bewahrt seine Schärfe, ohne den Wortlaut konfessionell zu glätten oder zusätzlich auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. Die Reihung der vier Unheilsbegriffe bleibt erhalten; durch »zur/zum« wird sie im Deutschen flüssig und syntaktisch klar.
