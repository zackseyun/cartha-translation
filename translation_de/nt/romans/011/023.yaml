id: ROM.11.23
reference: Romans 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: de
  text: Aber auch sie werden, wenn sie nicht im Unglauben bleiben, eingepfropft werden; denn Gott ist imstande, sie wieder einzupfropfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: Aber auch sie
  rationale: δέ markiert hier den Gegensatz zur vorherigen Aussage, während καί in κἀκεῖνοι die einbeziehende Bedeutung „auch“ trägt. Die Formulierung ist im Deutschen natürlich und hält den Rückbezug auf die zuvor abgebrochenen Zweige offen.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: wenn sie nicht … bleiben
  rationale: Die Bedingung mit ἐάν und Präsens Konjunktiv blickt auf eine mögliche künftige Entwicklung. „bleiben“ gibt das Andauern in einem Zustand idiomatisch wieder.
- source_word: τῇ ἀπιστίᾳ
  choice: im Unglauben
  rationale: Der Dativ bezeichnet den Zustand, in dem sie verharren. Im unmittelbaren Zusammenhang von Römer 11 steht ἀπιστία dem Glauben gegenüber; „Unglaube“ wahrt diesen Kontrast.
- source_word: ἐγκεντρισθήσονται
  choice: werden … eingepfropft werden
  rationale: Das Futur Passiv erhält sowohl die Zukunftsaussage als auch das passive Bild des Einpfropfens in den Ölbaum. Ein „wieder“ wird hier nicht vorgezogen, da es im Griechischen erst im folgenden Satzteil ausdrücklich steht.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: denn Gott ist imstande
  rationale: Die Formulierung gibt Gottes ausdrücklich hervorgehobene Fähigkeit klar und würdig wieder, ohne die Aussage über das im Text Gesagte hinaus zu verstärken.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: sie wieder einzupfropfen
  rationale: „wieder“ entspricht ausdrücklich πάλιν und bringt den Wiederherstellungsaspekt an derselben Stelle wie der griechische Text zum Ausdruck.
theological_decisions:
- issue: Bedeutung von ἀπιστία
  choice: Unglaube
  alternative: Untreue
  rationale: Im Argument von Römer 11 werden Glaube und Unglaube als ausschlaggebender Gegensatz behandelt. „Unglaube“ gibt diesen unmittelbaren Sinn wieder; die mögliche allgemeinere Nuance „Untreue“ wird nicht in den Haupttext eingetragen.
- issue: Stelle des Wiederherstellungsaspekts
  choice: „wieder“ nur beim zweiten Vorkommen von „einpfropfen“
  alternative: bereits im ersten Satzteil „wieder eingepfropft werden“
  rationale: πάλιν steht ausdrücklich erst bei ἐγκεντρίσαι. Die Übersetzung bewahrt diese Verteilung und löst die rhetorische Entwicklung nicht vorzeitig auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das geläufige Bildwort „einpfropfen“ erhält die Ölbaum-Metapher; die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken.
