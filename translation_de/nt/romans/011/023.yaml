  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zuverlässig wieder: die einbeziehend-kontrastive Eröffnung (κἀκεῖνοι δέ), die bedingte Zukunftsaussage, das anhaltende Verbleiben im Unglauben, das künftige Passiv des Einpfropfens, Gottes Fähigkeit und das ausdrücklich erst im zweiten Satzteil stehende πάλιν („wieder“).'
