source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: de
  text: 'Und auf diese Weise wird ganz Israel gerettet werden[a], wie geschrieben steht: »Aus Zion wird der Retter kommen; er wird die Gottlosigkeit[b] von Jakob abwenden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und so wird ganz Israel gerettet werden.« Das griechische οὕτως kann »so« oder »auf diese Weise« bedeuten; hier weist es wahrscheinlich auf die zuvor beschriebene Art und Weise hin. Die Wendung »ganz Israel« bleibt hinsichtlich ihres genauen Bezugs auslegungsbedürftig.'
    reason: lexical_alternative_and_interpretive_ambiguity
  - marker: b
    text: Im Griechischen steht hier der Plural »Gottlosigkeiten«. Der deutsche kollektive Singular »Gottlosigkeit« kann konkrete gottlose Verhaltensweisen oder Äußerungen einschließen.
    reason: source_form_clarification
lexical_decisions:
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Die Wendung gibt den modalen Sinn des Adverbs natürlich wieder und verweist wahrscheinlich auf den zuvor beschriebenen Vorgang; die Alternative »so« bleibt in der Fußnote erhalten.
- source_word: πᾶς Ἰσραήλ
  choice: ganz Israel
  rationale: Dies ist die natürliche, formal genaue deutsche Wiedergabe und lässt den umstrittenen Umfang und Bezug der Aussage offen.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Das Futur Passiv von σῴζω trägt im paulinischen Zusammenhang Heilsbedeutung; die passive Form und ihre theologische Spannung bleiben erhalten.
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Dies ist die geläufige und würdige deutsche Zitierformel; ein zusätzliches »genau« wäre im Deutschen unnötig verstärkend.
- source_word: ἐκ Σιὼν
  choice: aus Zion
  rationale: »Aus« bildet ἐκ präzise und zugleich idiomatisch ab.
- source_word: ὁ ῥυόμενος
  choice: der Retter
  rationale: Das substantivierte Partizip bezeichnet den, der rettet oder befreit. »Retter« ist knapp, titelartig und im Deutschen natürlich.
- source_word: ἀποστρέψει
  choice: wird … abwenden
  rationale: »Abwenden« bewahrt das Bewegungsbild des griechischen Verbs und vermeidet die stärker deutende Wiedergabe »beseitigen«.
- source_word: ἀσεβείας
  choice: die Gottlosigkeiten
  rationale: Der griechische Plural wird bewusst bewahrt. »Gottlosigkeiten« bezeichnet konkrete Äußerungen oder Formen der Missachtung Gottes, auch wenn der Plural im Deutschen ungewohnt klingt.
- source_word: ἀπὸ Ἰακώβ
  choice: von Jakob
  rationale: Die Wiedergabe erhält den Namen Jakob und harmonisiert ihn nicht mit Israel.
theological_decisions:
- issue: Bezug von »ganz Israel«
  choice: Die Formulierung »ganz Israel« bleibt ohne erklärende Eingrenzung stehen.
  alternative: Ganz ethnisches Israel; der gläubige Rest Israels; das vollständige Gottesvolk einschließlich der Nichtjuden.
  rationale: Der griechische Ausdruck entscheidet die umstrittene Auslegung nicht ausdrücklich. Die Übersetzung soll diese theologische Spannung nicht durch eine Paraphrase auflösen.
- issue: Titelartige Wiedergabe von ὁ ῥυόμενος
  choice: »der Retter«
  alternative: »der Befreier« oder »der Rettende«
  rationale: »Retter« gibt die rettende Funktion natürlich wieder und passt zur christologischen Verwendung des Schriftwortes im Kontext, ohne den Namen einer Person in den Text einzufügen.
- issue: Bedeutung von σωθήσεται
  choice: »wird gerettet werden«
  alternative: »wird befreit werden«
  rationale: Im unmittelbaren paulinischen Zusammenhang ist der umfassende Heilssinn naheliegend; »gerettet« erhält ihn, ohne Art oder zeitlichen Ablauf der Rettung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger biblischer Zitierformel. Der Satzbau bleibt nahe am Griechischen, ohne unnatürlich zu wirken. Der markierte Plural »Gottlosigkeiten« wird aus Gründen der formalen und semantischen Genauigkeit beibehalten und durch eine Fußnote erläutert.
