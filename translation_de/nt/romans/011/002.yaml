  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: de
  text: 'Gott hat sein Volk, das er zuvor kannte,[a] nicht verstoßen. Oder wisst ihr nicht, was die Schrift im Abschnitt über Elia sagt: wie er bei Gott gegen Israel Klage erhebt?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das er im Voraus kannte«. Manche verstehen das griechische Verb stärker im Sinn einer vorausgehenden Erwählung; die Übersetzung lässt diese theologische Frage offen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »wie er bei Gott gegen Israel vorstellig wird« oder »wie er Gott gegen Israel anruft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: hat … nicht verstoßen
  rationale: Das Verb bezeichnet hier Zurückweisung oder Verstoßung. »Verstoßen« ist im Deutschen klar, würdig und bringt Paulus’ Aussage prägnant zum Ausdruck.
- source_word: τὸν λαὸν αὐτοῦ
  choice: sein Volk
  rationale: Die Wendung bewahrt den Bundesbezug, ohne »Israel« vorwegnehmend in den ersten Satzteil einzufügen.
- source_word: ὃν προέγνω
  choice: das er vorher erkannt hat
  rationale: Die Wiedergabe bildet die zeitliche Vorsilbe und das Verb »erkennen« transparent ab, ohne die theologisch stärkere Deutung »vorher erwählt« in den Text einzutragen.
- source_word: ἢ οὐκ οἴδατε
  choice: Oder wisst ihr nicht
  rationale: Dies gibt die rhetorische Frage natürlich und nahe an der griechischen Form wieder.
- source_word: ἐν Ἠλίᾳ
  choice: in dem Abschnitt über Elia
  rationale: Die griechische Kurzform verweist idiomatisch auf den Schriftabschnitt, der von Elia handelt; eine wörtliche Wiedergabe als »in Elia« wäre im modernen Deutschen missverständlich.
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: Im paulinischen Sprachgebrauch ist damit die heilige Schrift gemeint; »die Schrift« ist die geläufige deutsche Wiedergabe.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: wie er sich vor Gott … wendet
  rationale: ἐντυγχάνω kann ein Bitten, Vorbringen oder Eintreten vor Gott bezeichnen. Wegen des folgenden »gegen Israel« vermeidet diese Formulierung den im Deutschen meist positiven Klang von »Fürbitte einlegen«.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: gegen Israel
  rationale: κατά mit Genitiv hat hier eindeutig gegnerische Bedeutung; der Eigenname Israel bleibt erhalten.
theological_decisions:
- issue: Bedeutung von προέγνω im Verhältnis zur göttlichen Erwählung
  choice: vorher erkannt hat
  alternative: zuvor kannte; vorher erwählt hatte; zuvor geliebt hatte
  rationale: Der Ausdruck kann innerhalb der paulinischen Erwählungstheologie stärker gedeutet werden, doch das griechische Verb selbst sollte hier nicht durch eine bestimmte Lehrtradition vereindeutigt werden. Die Übersetzung bewahrt daher den Bezug auf vorheriges Erkennen und erläutert die Spannung in einer Fußnote.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Bibelregister. Die Syntax folgt dem griechischen Gedankengang, während »ἐν Ἠλίᾳ« idiomatisch erschlossen wird. Sämtliche Fußnotenmarker stehen im Haupttext an der jeweils einschlägigen Stelle.
