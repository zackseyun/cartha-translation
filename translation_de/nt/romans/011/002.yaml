  to: 'Gott hat sein Volk, das er zuvor kannte,[a] nicht verstoßen. Oder wisst ihr nicht, was die Schrift im Abschnitt über Elia sagt: wie er bei Gott gegen Israel Klage erhebt?[b]'
  rationale: Die Revision präzisiert die an Gott gerichtete Klage Elias gegen Israel und verbessert die natürliche deutsche Wiedergabe von προέγνω. Sie lässt die in der Vorlage und im englischen Audit Trail bewusst offen gehaltene theologische Deutung unangetastet. Die Marker stehen weiterhin an den jeweils zugehörigen Textstellen.
