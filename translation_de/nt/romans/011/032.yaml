  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: de
  text: Denn Gott hat alle in den Ungehorsam eingeschlossen[a][b][c], damit er allen Barmherzigkeit erweist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle dem Ungehorsam übergeben“ beziehungsweise „alle im Ungehorsam eingeschlossen“.'
    reason: lexical_alternative
  - marker: b
    text: „Ungehorsam“ kann in manchen Zusammenhängen auch „Unglaube“ bedeuten; hier liegt wahrscheinlich der weitere Sinn einer Weigerung zu gehorchen vor.
    reason: lexical_alternative
  - marker: c
    text: Das zweimalige „alle/allen“ gibt die Wiederholung bei Paulus wieder und sollte nicht vorschnell eingeschränkt werden. Im Zusammenhang spricht er von Juden und Nichtjuden gemeinsam.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: hat … eingeschlossen
  rationale: Das Aoristverb συγκλείω bezeichnet ein Einschließen oder Umschließen. „Hat … eingeschlossen“ bewahrt das anschauliche Bild und gibt die vollzogene Handlung im Deutschen natürlich wieder, ohne sie vorschnell als strafrechtliches „Einsperren“ zu deuten.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert den vorausgehenden Gedankengang. „Denn“ wahrt diesen argumentativen Zusammenhang knapp und idiomatisch.
- source_word: τοὺς πάντας
  choice: alle / allen
  rationale: Die zweimalige Wendung wird in beiden Satzteilen ausdrücklich mit derselben umfassenden Bezeichnung wiedergegeben. Der Kasuswechsel von „alle“ zu „allen“ ist durch die deutsche Syntax bedingt und schränkt den Bezug nicht ein.
- source_word: εἰς ἀπείθειαν
  choice: in den Ungehorsam
  rationale: ἀπείθεια kann Ungehorsam oder, je nach Zusammenhang, Unglauben bezeichnen. „Ungehorsam“ bewahrt hier den weiteren Sinn einer Weigerung, zu gehorchen; „in“ bildet zugleich die mit εἰς verbundene Einschließungsmetapher nach.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet Ziel oder beabsichtigte Folge ein. „Damit“ ist im modernen Deutsch natürlich und lässt diese Bedeutungsbeziehung bestehen.
- source_word: ἐλεήσῃ
  choice: Barmherzigkeit erweist
  rationale: ἐλεάω bedeutet, sich zu erbarmen beziehungsweise Barmherzigkeit zu erweisen. Die gewählte Formulierung ist klar und würdevoll; der griechische Konjunktiv nach ἵνα bezeichnet hier keine Unsicherheit und verlangt daher keinen deutschen Möglichkeitsausdruck.
theological_decisions:
- issue: Reichweite von τοὺς πάντας in beiden Satzteilen
  choice: Die beiden Vorkommen werden als „alle“ beziehungsweise grammatisch bedingt „allen“ wiedergegeben, ohne den Bezug im Haupttext einzuengen.
  alternative: „alle Menschen“, „jeden“ oder ausdrücklich „Juden und Nichtjuden“
  rationale: Paulus verwendet in beiden Satzteilen dieselbe umfassende Wendung. Der Zusammenhang betrifft Juden und Nichtjuden, doch die Übersetzung soll weder die Reichweite stillschweigend verengen noch aus dem Vers allein eine bestimmte Lehre über die endgültige Rettung aller ableiten. Die sprachliche Symmetrie und die theologische Spannung bleiben erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die ungewöhnliche, aber nachvollziehbare Wendung „in den Ungehorsam eingeschlossen“ erhält bewusst das griechische Bild; die Wiederholung „alle/allen“ wahrt die rhetorische Symmetrie.
