  source_fidelity: Die Übersetzung gibt die kausale Einleitung (ὅτι), die dreigliedrige Aussage von Ursprung, Vermittlung und Ziel (ἐξ/διά/εἰς) sowie den umfassenden Ausdruck τὰ πάντα zuverlässig wieder. „Auf ihn hin“ bewahrt die zielgerichtete Offenheit von εἰς αὐτόν besser als eine einseitig zweckbezogene Wiedergabe. Die Pronomen bleiben entsprechend dem griechischen Wortlaut erhalten.
