id: ROM.11.36
reference: Romans 11:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: de
  text: Denn von ihm und durch ihn und auf ihn hin ist alles. Ihm gebührt die Herrlichkeit in Ewigkeit.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Lobpreis ein und bewahrt die kausale Verbindung natürlich im Deutschen.
- source_word: ἐξ αὐτοῦ
  choice: von ihm
  rationale: Bezeichnet Gott als Ursprung; „von ihm“ ist idiomatisch und eng am griechischen Ausdruck.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: Bewahrt die Bedeutung von Vermittlung beziehungsweise Wirksamkeit, ohne sie näher festzulegen.
- source_word: εἰς αὐτὸν
  choice: auf ihn hin
  rationale: Gibt die Zielrichtung des griechischen εἰς deutlicher wieder als bloßes „zu ihm“ und legt sie nicht einseitig als Nutzen oder Zweck aus.
- source_word: τὰ πάντα
  choice: alles
  rationale: Gibt den umfassenden kosmischen Bezug in natürlichem modernem Deutsch wieder.
- source_word: αὐτῷ ἡ δόξα
  choice: Ihm gebührt die Herrlichkeit
  rationale: Gibt den verblosen doxologischen Satz würdig und verständlich wieder; „gebührt“ drückt die Zuschreibung aus, ohne eine zusätzliche dogmatische Aussage einzuführen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Natürliche deutsche Wiedergabe der idiomatischen Wendung für unbegrenzte Dauer; die wörtliche Bildsprache wird in einer Fußnote genannt.
- source_word: ἀμήν
  choice: Amen
  rationale: Die im Deutschen eingebürgerte liturgische Bekräftigung wird beibehalten.
theological_decisions:
- issue: Bezug der wiederholten Pronomen αὐτοῦ/αὐτόν/αὐτῷ
  choice: Die Pronomen bleiben als „ihm/ihn“ erhalten; aus dem Zusammenhang ist Gott der Bezugspunkt.
  alternative: Den Bezug ausdrücklich mit „Gott“ wiedergeben.
  rationale: Der unmittelbare Zusammenhang weist auf Gott, doch die Beibehaltung der Pronomen bewahrt die rhetorische Form und vermeidet eine über den Wortlaut hinausgehende Präzisierung.
- issue: Zielrichtung von εἰς αὐτόν
  choice: „auf ihn hin“
  alternative: „zu ihm“ oder „für ihn“
  rationale: „Auf ihn hin“ bewahrt die teleologische beziehungsweise gerichtete Spannung des Ausdrucks, ohne ausschließlich Zweck, Nutzen oder Rückkehr zu behaupten.
- issue: Verbloser Lobpreis αὐτῷ ἡ δόξα
  choice: „Ihm gebührt die Herrlichkeit“
  alternative: „Ihm sei die Herrlichkeit“ oder „Sein ist die Herrlichkeit“
  rationale: Die gewählte Form ist eine natürliche doxologische Zuschreibung im modernen Deutschen. Da das Griechische kein Verb enthält, bleibt sowohl eine Wunschform als auch eine Feststellung als mögliche Nuance bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper doxologischer Satzführung. „Auf ihn hin“ ist leicht gehoben, aber verständlich und bewahrt die dreigliedrige Bewegung von Ursprung, Vermittlung und Ziel. Der Fußnotenmarker [a] steht im Haupttext.
