source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: de
  text: 'wie geschrieben steht: »Gott gab ihnen einen Geist der Benommenheit[a], Augen, die nicht sehen, und Ohren, die nicht hören, bis auf den heutigen Tag.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Geist tiefen Schlafes«. Die Formulierung erinnert an Jesaja 29,10; das hier verwendete griechische Wort bezeichnet jedoch Benommenheit, Abstumpfung oder Betäubung.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Die geläufige deutsche Zitierformel gibt den Sinn von καθώς idiomatisch und würdig wieder; ein zusätzliches »genauso« wäre hier unnötig schwerfällig.
- source_word: Ἔδωκεν
  choice: gab
  rationale: Der Aorist wird im Schriftzitat sachgerecht mit dem einfachen Präteritum wiedergegeben.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und eindeutige Wiedergabe des ausdrücklich genannten Subjekts.
- source_word: πνεῦμα κατανύξεως
  choice: einen Geist der Benommenheit
  rationale: κατάνυξις bezeichnet hier einen Zustand geistiger Abstumpfung oder Betäubung. »Benommenheit« ist im heutigen Deutsch verständlicher als »Stupor« und bleibt näher am griechischen Ausdruck als die aus dem Jesaja-Hintergrund stammende Wiedergabe »tiefer Schlaf«.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: Augen, um nicht zu sehen
  rationale: Die Formulierung bewahrt die kompakte Zweck- beziehungsweise Ergebnisstruktur von τοῦ μή mit Infinitiv, ohne sie auf nur eine syntaktische Nuance festzulegen.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: Ohren, um nicht zu hören
  rationale: Die parallele Formulierung entspricht dem griechischen Satzbau; »hören« gibt ἀκούω hier unmittelbar wieder.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: bis auf den heutigen Tag
  rationale: Diese feste deutsche Wendung bewahrt den feierlichen Ton und den zeitlichen Nachdruck des griechischen Idioms.
theological_decisions:
- issue: Göttliches Handeln bei Verstockung beziehungsweise geistlicher Unempfänglichkeit
  choice: Die direkte Aussage »Gott gab ihnen« bleibt unverändert erhalten.
  alternative: »Gott ließ zu, dass sie … hatten« oder »Gott überließ sie …«
  rationale: Im Griechischen ist Gott ausdrücklich Subjekt von ἔδωκεν. Eine Abschwächung zu bloßer Zulassung würde die theologische Spannung des Textes eigenmächtig auflösen.
- issue: Zweck oder Ergebnis bei τοῦ μὴ mit Infinitiv
  choice: »um nicht zu sehen … um nicht zu hören«
  alternative: »sodass sie nicht sehen … und nicht hören« oder »Augen, die nicht sehen …«
  rationale: Die gewählte Fassung hält die im Griechischen mögliche Zwecknuance offen, ohne eine weitergehende dogmatische Erklärung hinzuzufügen; die Fußnote zur Benommenheit verhindert zugleich keine andere Deutung der Konstruktion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten biblischen Zitierformel. Die direkte göttliche Urheberschaft und die knappe Parallelstruktur des Schriftzitats bleiben erhalten.
