  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: de
  text: Denn wer hat den Sinn des Herrn erkannt? Oder wer ist sein Ratgeber geworden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus greift Jesaja 40,13 auf; auch dort fragt der griechische Text, wer den Sinn des Herrn erkannt hat und wer sein Ratgeber geworden ist.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: wer
  rationale: Das Interrogativpronomen eröffnet eine rhetorische Frage; „wer“ gibt sie knapp und natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und bewahrt den argumentativen Zusammenhang.
- source_word: ἔγνω
  choice: hat … erkannt
  rationale: Das Perfekt ist im Deutschen für die rhetorische, auf allgemeine Erfahrung zielende Frage idiomatisch; „erkannt“ wahrt den Erkenntnisaspekt von γινώσκω.
- source_word: νοῦν
  choice: Sinn
  rationale: νοῦς bezeichnet hier Gottes Denken, Absicht oder Verständnis. „Sinn“ ist in der Wendung „Sinn des Herrn“ würdig und entspricht dem Jesaja-Anklang, ohne auf bloße Gedanken oder Verstand einzuengen.
- source_word: κυρίου
  choice: des Herrn
  rationale: Die Genitivform wird entsprechend dem griechischen κύριος mit „des Herrn“ wiedergegeben; der Bezug auf Gott bleibt erhalten, ohne die alttestamentliche Gottesnamenschreibung in den neutestamentlichen Wortlaut einzutragen.
- source_word: ἢ
  choice: Oder
  rationale: „Oder“ bewahrt die disjunktive Verknüpfung der beiden parallelen rhetorischen Fragen.
- source_word: σύμβουλος
  choice: Ratgeber
  rationale: Das Substantiv bezeichnet jemanden, der Rat erteilt. „Ratgeber“ ist direkt, verständlich und stilistisch der Schriftanklang angemessen.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Possessivpronomen gibt den Genitivbezug im Deutschen natürlich wieder.
- source_word: ἐγένετο
  choice: ist … geworden
  rationale: 'Das Perfekt gibt γίνομαι als Eintritt in eine Stellung wieder: Niemand ist je Gottes Ratgeber geworden.'
theological_decisions:
- issue: Bezug von „Herr“ im aus Jesaja übernommenen Wortlaut
  choice: „Herr“ ohne weitere Präzisierung
  alternative: Eine ausdrückliche Wiedergabe mit dem alttestamentlichen Gottesnamen
  rationale: Der griechische Text bietet κυρίου. Die Übersetzung bewahrt daher den neutestamentlichen Wortlaut und lässt zugleich den Bezug auf Gott sowie den Jesaja-Hintergrund erkennen.
- issue: Bedeutungsumfang von νοῦς
  choice: „Sinn“ als Bezeichnung für Gottes Denken und Absicht
  alternative: „Verstand“, „Gedanken“ oder „Plan“
  rationale: „Sinn“ hält den Ausdruck offen und vermeidet, Gottes νοῦς entweder auf intellektuelle Fähigkeit oder auf einen einzelnen Plan zu verengen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der knappen, parallelen Form der beiden rhetorischen Fragen. „Ratgeber“ ist allgemein verständlich; „Sinn des Herrn“ bewahrt die traditionelle Schriftprägung, ohne altertümlich zu wirken.
