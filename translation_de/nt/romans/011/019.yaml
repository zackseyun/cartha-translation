  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: de
  text: 'Du wirst nun sagen: »Zweige wurden herausgebrochen, damit ich eingepfropft würde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: Du wirst sagen
  rationale: Das Futur Aktiv, 2. Person Singular, wird direkt wiedergegeben und bewahrt die Anrede an den gedachten Gesprächspartner.
- source_word: οὖν
  choice: nun
  rationale: Als folgernder Gesprächspartikel führt »nun« die erwartete Einwendung im Deutschen natürlich weiter.
- source_word: Ἐξεκλάσθησαν
  choice: wurden herausgebrochen
  rationale: Die passive Form und das Bild vom Ölbaum bleiben erhalten; »herausgebrochen« gibt ἐκκλάω anschaulich wieder.
- source_word: κλάδοι
  choice: Zweige
  rationale: »Zweige« ist im Bild des Ölbaums eine natürliche und genaue Wiedergabe.
- source_word: ἵνα
  choice: damit
  rationale: »Damit« bewahrt die im Einwand formulierte Zweck- beziehungsweise Folgebeziehung, ohne sie näher auszudeuten.
- source_word: ἐγὼ
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten und trägt den im Griechischen angelegten Kontrast.
- source_word: ἐγκεντρισθῶ
  choice: eingepfropft würde
  rationale: Die passive Konjunktivform wird im Deutschen mit »würde« wiedergegeben; »einpfropfen« ist der geläufige Ausdruck für das gärtnerische Bild.
theological_decisions:
- issue: Kennzeichnung des Sprechers als gedachter Gesprächspartner
  choice: Die direkte Anrede »Du wirst nun sagen« bleibt ohne erklärenden Zusatz stehen.
  alternative: »Dann könnte jemand sagen«
  rationale: Der Kontext lässt eine rhetorisch vorgestellte Einwendung erkennen, doch der Vers selbst verwendet die zweite Person Singular im Futur. Eine unpersönliche Umschreibung wäre stärker auslegend.
- issue: Deutung des mit ἵνα eingeleiteten Satzes als göttliche Absicht
  choice: Die Aussage wird schlicht mit »damit ich eingepfropft würde« wiedergegeben.
  alternative: »damit Gott mich einpfropfen konnte«
  rationale: Der griechische Text nennt weder Gott als Handelnden noch bestätigt Paulus hier ausdrücklich die Schlussfolgerung des Gesprächspartners. Die Spannung bleibt daher bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Baummetapher und der knappe Charakter der rhetorischen Einwendung werden bewahrt; es sind keine Fußnoten erforderlich.
