    issue: „angesichts der Barmherzigkeit“ gibt τῷ ὑμετέρῳ ἐλέει nicht hinreichend präzise wieder.
    rationale: „Angesichts“ bezeichnet primär einen Umstand oder Hintergrund. Die griechische Dativphrase steht im Satzfluss vielmehr für die vermittelte Beziehung, durch die sie Barmherzigkeit erlangen sollen. Die Kontextdeutung als den Adressaten erwiesene göttliche Barmherzigkeit bleibt dabei angemessen.
  revised_text: So sind auch diese jetzt ungehorsam geworden durch die Barmherzigkeit, die euch erwiesen wurde,[a] damit auch sie jetzt Barmherzigkeit erfahren.
