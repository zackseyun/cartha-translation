  rationale: Die Revision ersetzt lediglich die zu schwache Umstandsangabe „angesichts“ durch „durch“, das die syntaktische und argumentative Verbindung der griechischen Dativphrase besser abbildet. Die Fußnote bewahrt die mögliche Lesart, nach der „eure Barmherzigkeit“ als von den Adressaten ausgeübte Barmherzigkeit verstanden wird.
