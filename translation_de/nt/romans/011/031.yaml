  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: de
  text: So sind auch diese jetzt ungehorsam geworden durch die Barmherzigkeit, die euch erwiesen wurde,[a] damit auch sie jetzt Barmherzigkeit erfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch eure Barmherzigkeit«. Die griechische Wendung kann wörtlicher so verstanden werden; im Zusammenhang ist jedoch wahrscheinlich die Barmherzigkeit gemeint, die Gott euch erwiesen hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: So sind auch
  rationale: Leitet entsprechend dem vorhergehenden Vers eine Parallele ein und gibt die vergleichende Folgerung knapp und natürlich wieder.
- source_word: οὗτοι
  choice: diese
  rationale: Bewahrt den demonstrativen Bezug auf Israel im Kontext, statt ihn zu einem bloßen Pronomen abzuschwächen.
- source_word: νῦν
  choice: jetzt
  rationale: Markiert in beiden Vorkommen die gegenwärtige Phase in Paulus’ heilsgeschichtlicher Argumentation.
- source_word: ἠπείθησαν
  choice: sind … ungehorsam geworden
  rationale: ἀπειθέω umfasst Unglauben und Ungehorsam. »Ungehorsam« hält diese umfassendere Beziehungsaussage offen; das Perfekt wird im Deutschen idiomatisch wiedergegeben.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: angesichts der Barmherzigkeit, die euch erwiesen wurde
  rationale: Der knappe Dativ ist syntaktisch mehrdeutig. Die Formulierung bezeichnet Gottes den Adressaten erwiesene Barmherzigkeit als den maßgeblichen Zusammenhang, ohne eine präzise instrumentale Kausalität stärker festzulegen, als es der griechische Text erlaubt.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise Ergebnisaussage natürlich wieder und bewahrt deren Spannung.
- source_word: καὶ αὐτοὶ
  choice: auch sie
  rationale: Erhält die nachdrückliche Einbeziehung Israels, ohne im Deutschen unnötig schwer zu wirken.
- source_word: ἐλεηθῶσιν
  choice: Barmherzigkeit erfahren
  rationale: Gibt das göttliche Passiv in verständlichem Deutsch wieder; Gott bleibt als Geber der Barmherzigkeit aus dem Kontext erschließbar.
theological_decisions:
- issue: Bezeichnet »eure Barmherzigkeit« eine von den nichtjüdischen Glaubenden ausgeübte oder eine ihnen von Gott erwiesene Barmherzigkeit?
  choice: die euch erwiesene Barmherzigkeit
  alternative: eure Barmherzigkeit / durch eure Barmherzigkeit
  rationale: Der Zusammenhang in Römer 11,30–32 spricht wiederholt von Gottes Erbarmen gegenüber beiden Gruppen. Die Übersetzung macht diesen wahrscheinlichsten Bezug deutlich, während die Fußnote die grammatisch mögliche wörtlichere Deutung offenhält.
- issue: Bedeutet ἀπειθέω hier vor allem Unglauben oder Ungehorsam?
  choice: ungehorsam geworden
  alternative: nicht geglaubt / ungläubig geworden
  rationale: Das Verb kann beide Aspekte verbinden. »Ungehorsam« bewahrt die breitere bundestheologische Spannung und reduziert die Aussage nicht auf bloßes Für-wahr-Halten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem paulinischen Gedankengang, vermeidet jedoch einen missverständlichen deutschen Ausdruck »eure Barmherzigkeit« im Haupttext. Der Fußnotenmarker steht unmittelbar nach der erklärend entfalteten Dativphrase.
