source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: de
  text: Wenn aber die Erstlingsgabe heilig ist, ist auch der ganze Teig[a] heilig; und wenn die Wurzel heilig ist, sind auch die Zweige heilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Teigmasse“. Das griechische Wort bezeichnet eine Masse beziehungsweise Mischung aus Teig.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἀπαρχή
  choice: Erstlingsgabe
  rationale: Die Übersetzung bewahrt den kultischen Hintergrund der ersten, Gott dargebrachten Portion und passt grammatisch zum Singular des griechischen Ausdrucks.
- source_word: ἁγία
  choice: heilig
  rationale: „Heilig“ erhält die biblische Kategorie und den Parallelismus beider Bildaussagen, ohne die Art der Heiligkeit näher festzulegen.
- source_word: φύραμα
  choice: der ganze Teig
  rationale: Der Ausdruck bezeichnet eine geknetete Teigmasse. „Der ganze Teig“ macht im Deutschen den Gegensatz zwischen Erstlingsgabe und Gesamtmenge verständlich.
- source_word: ῥίζα
  choice: Wurzel
  rationale: Dies ist die natürliche und genaue Wiedergabe des botanischen Bildes.
- source_word: κλάδοι
  choice: Zweige
  rationale: „Zweige“ gibt das botanische Bild idiomatisch wieder und fügt sich in das anschließende Bild vom Ölbaum ein.
- source_word: εἰ δὲ ... καὶ ...· καὶ εἰ ... καὶ ...
  choice: Wenn aber ... dann ... auch; und wenn ... dann ... auch
  rationale: Die ergänzten Formen von „sein“ machen die im Griechischen verkürzte Folgerung im Deutschen klar. „Aber“ gibt δέ als milden Anschluss wieder, ohne einen zeitlichen Sinn einzuführen.
theological_decisions:
- issue: Art der Heiligkeit in den Bildern von Erstlingsgabe und Teig sowie Wurzel und Zweigen
  choice: „heilig“ ohne nähere Bestimmung
  alternative: „geweiht“ oder „für Gott ausgesondert“ in ausdrücklich bundestheologischem Sinn
  rationale: Der Vers stellt eine abgeleitete Beziehung zwischen dem ersten Teil und dem Ganzen sowie zwischen Wurzel und Zweigen her, bestimmt aber nicht ausdrücklich, ob die Heiligkeit kultisch, bundesbezogen, repräsentativ oder rettend gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, sprichwortartige Parallelstruktur bleibt erhalten; „dann ... auch“ verdeutlicht die im Griechischen elliptische Folgerung.
