  source_fidelity: Die Übersetzung gibt die beiden konditionalen Analogien, die Ellipse des griechischen Prädikats durch zulässige Ergänzung und den milden Anschluss durch „aber“ sachgerecht wieder. „Erstlingsgabe“, „heilig“, „Wurzel“ und „Zweige“ sind quellentreu. „Der ganze Teig“ verdeutlicht im Deutschen angemessen den Kontrast von Erstlingsgabe und Teigmasse, ohne die offenbleibende Art der Heiligkeit näher zu bestimmen.
  naturalness: Die Fassung „dann ist es auch der ganze Teig“ beziehungsweise „dann sind es auch die Zweige“ ist zwar verständlich, wirkt aber im modernen Standarddeutsch unnötig schwerfällig. Die direkte Wiederaufnahme des Prädikats „heilig“ ist idiomatischer und bewahrt den knappen Parallelismus.
  terminology: Die gewählten Begriffe sind angemessen. „Erstlingsgabe“ wahrt den kultischen Bezug von ἀπαρχή; „heilig“ sollte beibehalten werden, damit keine bestimmte Deutung der übertragenen Heiligkeit vorweggenommen wird. Die Fußnote ist inhaltlich zutreffend und am Bezugsausdruck verankert.
