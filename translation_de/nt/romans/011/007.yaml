id: ROM.11.7
reference: Romans 11:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: de
  text: Was folgt daraus? Israel hat nicht erlangt, wonach es strebt; die Erwählten aber haben es erlangt, und die Übrigen wurden verhärtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurden unempfindlich gemacht«. Das griechische Verb bezeichnet ein Verhärten oder Abstumpfen und kann geistliche Unempfindlichkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Was folgt daraus?
  rationale: Die paulinische Schluss- und Übergangsformel wird als natürliche rhetorische Frage wiedergegeben und an den vorausgehenden Gedankengang angebunden.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: wonach Israel strebt
  rationale: ἐπιζητέω bezeichnet hier ein nachdrückliches Suchen oder Streben. Die fortdauernde Gegenwart wird im Deutschen durch das Präsens bewahrt; Israel ist kollektiv gemeint.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: hat nicht erlangt
  rationale: ἐπιτυγχάνω bedeutet im Zusammenhang, das Erstrebte zu erreichen oder zu erlangen. Das Perfekt ist im Deutschen die natürliche Erzählform.
- source_word: ἡ δὲ ἐκλογὴ
  choice: die Erwählten aber
  rationale: Obwohl ἐκλογή wörtlich »Erwählung« oder »Auswahl« bedeutet, bezeichnet das Wort hier aufgrund des Gegensatzes zu »den Übrigen« wahrscheinlich die erwählte Personengruppe.
- source_word: ἐπέτυχεν
  choice: haben es erlangt
  rationale: Die Wiederholung desselben Verbs wird zur Wahrung des Kontrasts auch im Deutschen beibehalten; »es« nimmt das zuvor genannte Erstrebte auf.
- source_word: οἱ δὲ λοιποὶ
  choice: die Übrigen
  rationale: Die Formulierung bezeichnet die verbleibenden Personen im Gegensatz zu den Erwählten.
- source_word: ἐπωρώθησαν
  choice: wurden verhärtet
  rationale: Das Passiv und das Bild geistlicher Verhärtung werden bewahrt, ohne den im Satz nicht genannten Handelnden festzulegen.
theological_decisions:
- issue: Bedeutung von ἡ ἐκλογὴ
  choice: die Erwählten
  alternative: die Erwählung / die Auswahl
  rationale: Der Gegensatz zu »den Übrigen« legt nahe, dass die abstrakte Bezeichnung metonymisch für die von Gott erwählten Menschen steht. Die Wiedergabe benennt diese Gruppe, ohne ein konfessionelles Erwählungssystem einzutragen.
- issue: Handelnder bei ἐπωρώθησαν
  choice: wurden verhärtet
  alternative: Gott verhärtete sie / sie verhärteten sich
  rationale: Das griechische Passiv nennt keinen Handelnden. Die Übersetzung lässt daher die Spannung zwischen göttlichem Gericht und menschlicher Verantwortlichkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Verwendung von »erlangen« bewahrt den pointierten Gegensatz des griechischen Satzes. Das Semikolon gliedert die rhetorisch dichte Aussage. Die Fußnotenmarkierung steht unmittelbar nach der betreffenden Formulierung.
