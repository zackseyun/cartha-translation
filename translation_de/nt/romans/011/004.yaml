id: ROM.11.4
reference: Romans 11:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: de
  text: Doch was sagt ihm Gottes Antwort[a]? »Ich habe mir siebentausend Männer übriggelassen[b], die das Knie nicht vor Baal gebeugt haben.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Antwort von Gott“; auch: „der Gottesspruch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zurückbehalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: Gottes Antwort
  rationale: Das Substantiv bezeichnet hier Gottes autoritative Antwort an Elija. „Gottes Antwort“ ist im heutigen Deutsch klar und natürlich; zugleich bleibt die Aussageform des griechischen Textes erhalten, nach der die Antwort selbst „sagt“.
- source_word: Κατέλιπον
  choice: habe … übriggelassen
  rationale: 'Die Wiedergabe bezeichnet eine abgeschlossene Handlung mit fortbestehendem Ergebnis: Die Siebentausend sind als Rest geblieben. „Übriggelassen“ bewahrt zudem den Grundsinn des Verbs.'
- source_word: ἐμαυτῷ
  choice: mir
  rationale: Der reflexive Dativ wird idiomatisch mit „mir“ wiedergegeben und zeigt, dass Gott diese Männer für sich selbst übriggelassen hat.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: siebentausend Männer
  rationale: ἄνδρας ist ausdrücklich maskulin und wird daher nicht zum allgemeineren „Menschen“ neutralisiert.
- source_word: οἵτινες
  choice: die
  rationale: Das Relativpronomen kennzeichnet die Siebentausend näher. Das deutsche „die“ gibt diese Funktion natürlich wieder, ohne eine mögliche qualitative Nuance zu überzeichnen.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: die das Knie nicht … gebeugt haben
  rationale: Die bildhafte Wendung für anbetende Unterwerfung wird bewahrt. Der Singular „das Knie“ entspricht sowohl dem griechischen Ausdruck als auch natürlichem Deutsch.
- source_word: τῇ Βάαλ
  choice: vor Baal
  rationale: Beim Beugen des Knies bezeichnet Deutsch die verehrte Instanz idiomatisch mit „vor“. Der Eigenname steht ohne Artikel.
theological_decisions:
- issue: Ob der göttliche Ursprung der Antwort ausdrücklich genannt wird
  choice: „Gottes Antwort“
  alternative: „die Antwort“, „der Gottesspruch“
  rationale: Der Zusammenhang und die zitierte alttestamentliche Stelle weisen Gott eindeutig als Antwortenden aus. Die Formulierung macht dies sichtbar, ohne zusätzliche Lehrinhalte einzutragen.
- issue: Geschlechtsspezifische Wiedergabe von ἄνδρας
  choice: „Männer“
  alternative: „Menschen“
  rationale: Der Ausgangstext verwendet einen ausdrücklich männlichen Begriff; die Übersetzung bewahrt diese sprachliche Bestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfrage und das Bild vom Beugen des Knies bleiben nahe am griechischen Wortlaut, während „vor Baal“ und das Perfekt idiomatisches Deutsch gewährleisten.
