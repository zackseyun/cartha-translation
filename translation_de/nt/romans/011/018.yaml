  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: de
  text: 'Rühme dich nicht auf Kosten der Zweige.[a] Wenn du dich aber rühmst: Nicht du trägst die Wurzel, sondern die Wurzel trägt dich.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rühme dich nicht gegen die Zweige.“'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann hier auch „stützen“ oder „erhalten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: sich gegenüber … rühmen / sich rühmen
  rationale: Das Verb bezeichnet ein überhebliches Rühmen gegenüber oder auf Kosten anderer. „Sich gegenüber den Zweigen rühmen“ ist im Deutschen verständlich und bewahrt die gegen sie gerichtete relationale Nuance, ohne den Bildvergleich auszudeuten.
- source_word: κλάδων
  choice: den Zweigen
  rationale: Der bestimmte Artikel verweist auf die bereits im Ölbaumgleichnis genannten Zweige und wird deshalb beibehalten.
- source_word: ῥίζαν / ῥίζα
  choice: die Wurzel
  rationale: Die einheitliche Wiedergabe erhält das Bild des Baumes und die Abhängigkeit des eingepfropften Zweiges von der Wurzel.
- source_word: βαστάζεις
  choice: trägst
  rationale: „Tragen“ bewahrt die konkrete Metapher und kann im Deutschen zugleich die Bedeutung von stützen und erhalten ausdrücken.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: Nicht du trägst die Wurzel, sondern die Wurzel trägt dich
  rationale: Die Wortstellung erhält den nachdrücklichen Gegensatz zwischen „du“ und „die Wurzel“ sowie die Umkehrung der vermeintlichen Abhängigkeit.
- source_word: μὴ
  choice: nicht
  rationale: Mit dem Imperativ ergibt sich die natürliche direkte Aufforderung „Rühme dich nicht“, ohne den Aspekt als fortgesetzte Handlung überzubestimmen.
theological_decisions:
- issue: Bildhafte Bedeutung von Wurzel und Zweigen im Ölbaumgleichnis
  choice: Die Metapher bleibt ohne ausdrückliche Identifizierung von Wurzel oder Zweigen stehen.
  alternative: Die Wurzel in der Übersetzung ausdrücklich mit Abraham, den Erzvätern oder den Bundesverheißungen gleichsetzen.
  rationale: Der griechische Text nennt hier nur Wurzel und Zweige. Eine genauere Identifizierung wäre Auslegung und würde die im Kontext bestehende theologische Offenheit einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Ermahnung und der emphatische Gegensatz des griechischen Satzes bleiben erhalten; die Baum-Metapher wird nicht erklärend aufgelöst.
