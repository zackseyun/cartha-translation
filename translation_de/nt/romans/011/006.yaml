  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: de
  text: Wenn aber aus Gnade, dann nicht mehr aufgrund von Werken; sonst wird die Gnade nicht mehr zur Gnade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: aus Gnade
  rationale: Der Dativ bezeichnet hier die Grundlage beziehungsweise das bestimmende Prinzip. „Aus Gnade“ ist im Deutschen idiomatisch und wahrt den Gegensatz zu den Werken.
- source_word: ἐξ ἔργων
  choice: aufgrund von Werken
  rationale: Die Formulierung gibt den Gedanken einer Grundlage oder Bedingung verständlich wieder, ohne „Werke“ inhaltlich näher zu bestimmen.
- source_word: γίνεται
  choice: wird … zur
  rationale: Die Wiedergabe bewahrt ausdrücklich den dynamischen Wortlaut von γίνομαι („werden“) statt ihn zur bloßen Gleichsetzung „ist“ zu glätten.
theological_decisions:
- issue: Gegensatz zwischen Gnade und Werken
  choice: Der absolute Gegensatz des Satzes bleibt ohne ergänzende Einschränkung stehen.
  alternative: „Werke des Gesetzes“ oder „verdienstliche Werke“ ergänzen.
  rationale: Im griechischen Vers steht lediglich ἔργων. Eine nähere Bestimmung würde eine theologische Deutung in den Text eintragen, die hier nicht ausdrücklich formuliert ist.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die Ellipse des griechischen Bedingungssatzes bleibt erhalten; „dann“ macht den deutschen Satzfluss natürlich, ohne einen neuen Sachinhalt einzuführen.
