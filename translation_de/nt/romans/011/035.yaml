  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: de
  text: Oder wer hat ihm zuvor etwas gegeben, und es wird ihm zurückerstattet werden?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet knapp und natürlich die nächste rhetorische Frage der Reihe ein.
- source_word: τίς
  choice: wer
  rationale: Das Interrogativpronomen bezeichnet eine Person und wird im Deutschen idiomatisch mit „wer“ wiedergegeben.
- source_word: προέδωκεν
  choice: hat … zuvor etwas gegeben
  rationale: 'Bewahrt den zeitlichen Vorrang des Verbs: Niemand hat Gott zuerst oder im Voraus gegeben und ihn dadurch zum Schuldner gemacht.'
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Pronomen wird entsprechend dem griechischen Wortlaut beibehalten; im Zusammenhang verweist es klar auf Gott.
- source_word: καὶ ἀνταποδοθήσεται αὐτῷ
  choice: sodass es ihm zurückerstattet werden müsste
  rationale: Die parataktische griechische Verbindung bezeichnet hier die gedachte Folge einer Vorleistung. Der deutsche Konjunktiv wahrt den rhetorisch-hypothetischen Sinn, während „zurückerstattet“ den Gedanken der Gegenleistung ausdrückt.
theological_decisions:
- issue: Bezug von αὐτῷ
  choice: „ihm“, mit Gott als Bezug im Kontext
  alternative: Das Pronomen ausdrücklich durch „Gott“ ersetzen
  rationale: Die Beibehaltung des Pronomens folgt der Form des griechischen Textes, ohne den im Zusammenhang eindeutigen Bezug zu verdunkeln.
- issue: Vorrang des Gebens und eine vermeintliche Verpflichtung Gottes
  choice: „zuvor“ und die hypothetische Rückerstattung ausdrücklich bewahren
  alternative: Nur „gegeben“ sagen oder den Satz als direkte Lehraussage über Gottes Nichtverpflichtung ausformulieren
  rationale: προέδωκεν stellt eine vorausgehende Gabe in den Mittelpunkt, die einen Anspruch auf Gegenleistung begründen könnte. Die rhetorische Frage verneint diesen Gedanken, ohne ihn in eine erklärende Aussage umzuschreiben.
- issue: Verhältnis von καί zum zweiten Satzteil
  choice: Als Folgezusammenhang „sodass“ wiedergeben
  alternative: 'Formal koordinierend: „und es wird ihm zurückerstattet werden“'
  rationale: 'Das schlichte καί kann formal mit „und“ übersetzt werden; im rhetorischen Zusammenhang ist jedoch die Folge gemeint: Wer Gott zuerst gegeben hätte, könnte Rückzahlung beanspruchen. „Sodass“ macht diesen Zusammenhang in natürlichem Deutsch sichtbar.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Klang. „Zuvor“ erhält den Prioritätsgedanken; „zurückerstattet“ ist präzise und vermeidet konfessionelle Zusatzdeutungen.
