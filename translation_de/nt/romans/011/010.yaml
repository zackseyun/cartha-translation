  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: de
  text: Ihre Augen sollen verfinstert werden, sodass sie nicht sehen[a], und ihren Rücken beuge fortwährend[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie nicht sehen“. Der griechische Ausdruck kann Zweck oder Folge bezeichnen.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „beständig“ oder „allezeit“. Die griechische Wendung bezeichnet fortdauernde beziehungsweise ständige Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: sollen finster werden
  rationale: Die passive Imperativform hat hier auffordernden beziehungsweise verwünschenden Charakter. „Finster werden“ bewahrt das griechische Bild der Dunkelheit und klingt im modernen Deutschen natürlicher als „verfinstert werden“.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ihre Augen
  rationale: Die konkrete Körpermetapher wird unmittelbar und ohne erklärende Erweiterung wiedergegeben.
- source_word: τοῦ μὴ βλέπειν
  choice: sodass sie nicht sehen
  rationale: Der substantivierte Infinitiv mit μή kann Zweck oder Folge ausdrücken. „Sodass“ lässt diese Beziehung hinreichend offen, ohne sie unnötig zu präzisieren.
- source_word: τὸν νῶτον αὐτῶν
  choice: ihren Rücken
  rationale: Der griechische Singular wird bewahrt; im Deutschen ist der distributive Singular mit „ihren“ idiomatisch.
- source_word: διὰ παντός
  choice: fortwährend
  rationale: Die Wendung bezeichnet eine andauernde oder beständige Dauer. „Fortwährend“ vermeidet die mögliche Überdeutung von „für immer“ als ausdrückliche Aussage über endgültige Ewigkeit.
- source_word: σύγκαμψον
  choice: beuge
  rationale: Der aktive Imperativ Singular wird als direkte Aufforderung bewahrt. „Beuge“ passt zur Körpermetapher und zum direkten Objekt „Rücken“.
theological_decisions:
- issue: Verwünschender Schriftbezug und göttliches Handeln
  choice: 'Die auffordernde Form bleibt erhalten: „Ihre Augen sollen … und beuge …“'
  alternative: Den Satz als bloße Vorhersage oder als unpersönliche Folge wiederzugeben.
  rationale: Der griechische Wortlaut bewahrt den Charakter einer Verwünschung beziehungsweise Gerichtsanrufung. Die Übersetzung soll diese Härte weder abschwächen noch durch eine zusätzliche theologische Erklärung verschärfen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Bildsprache von Dunkelheit, Augen und gebeugtem Rücken sowie der Wechsel zwischen auffordernder Soll-Form und direktem Imperativ bleiben erhalten.
