  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: de
  text: Denn Gottes Gnadengaben und seine Berufung sind unwiderruflich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden nicht bereut“ beziehungsweise „werden nicht zurückgenommen“. Ältere Übersetzungen geben den Ausdruck teils mit „sind ohne Reue“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: unwiderruflich
  rationale: Das Adjektiv bezeichnet etwas, das nicht bereut beziehungsweise nicht zurückgenommen wird. In Verbindung mit Gottes Gnadengaben und Berufung gibt „unwiderruflich“ diesen Sinn im heutigen Deutsch knapp und natürlich wieder, ohne die Bedeutung zu „unveränderlich“ auszuweiten.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage; „Denn“ bewahrt diese Verknüpfung.
- source_word: τὰ χαρίσματα
  choice: die Gnadengaben
  rationale: χάρισμα bezeichnet eine aus Gnade gewährte Gabe. „Gnadengaben“ bewahrt diesen Bedeutungsanteil und den Plural; der Kontext entscheidet, welche Gaben gemeint sind.
- source_word: ἡ κλῆσις
  choice: seine Berufung
  rationale: κλῆσις meint hier Gottes Rufen beziehungsweise Berufung. Das Possessivpronomen gibt den gemeinsamen Genitiv τοῦ θεοῦ in natürlichem Deutsch wieder.
- source_word: τοῦ θεοῦ
  choice: Gottes … seine
  rationale: Der Genitiv bezieht sich auf Gnadengaben und Berufung und lässt Quelle beziehungsweise Zugehörigkeit offen. Die deutsche Formulierung bewahrt diesen Bezug ohne unnötige Wiederholung.
theological_decisions:
- issue: Umfang von „Gottes Gnadengaben und seine Berufung“
  choice: Die Formulierung bleibt ohne ausdrückliche Eingrenzung stehen.
  alternative: Sie ausdrücklich auf Israels Vorrechte und Berufung beziehen oder als allgemeine Aussage über jede göttliche Gabe und Berufung formulieren.
  rationale: Der unmittelbare Zusammenhang von Römer 9–11 handelt stark von Israel, doch der griechische Satz nennt das Bezugsobjekt hier nicht erneut. Die Übersetzung soll weder die engere noch die allgemeinere Auslegung in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gnadengaben“ erhält den Gnadenbezug von χαρίσματα; „unwiderruflich“ ist idiomatisch und wird durch die Fußnote gegen die wörtlichere Bedeutungsseite abgesichert.
