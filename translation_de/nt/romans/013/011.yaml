  verdict: revise
  source_fidelity: Die Hauptaussage, die zweite Person Plural im SBLGNT-Text und die eschatologisch offene Rede von „unserer Rettung“ sind zutreffend wiedergegeben. Die Konstruktion „Die Stunde ist schon da, dass ihr … erwacht“ bildet jedoch den griechischen Infinitivanschluss nicht idiomatisch ab. „die Zeit kennt“ ist zudem näher an τὸν καιρόν als die paraphrasierende Frageform „wisst, was für eine Zeit es ist“.
  naturalness: Die Revision verwendet modernes Standarddeutsch und erhält die Dringlichkeit des Satzes. „Die Stunde zum Aufwachen aus dem Schlaf ist schon da“ ist syntaktisch klar und bewahrt zugleich das Bild von ὥρα und ἐξ ὕπνου ἐγερθῆναι.
  terminology: „Rettung“ ist für σωτηρία möglich und lässt die im griechischen Satz bestehende Spannung zwischen gegenwärtiger Zugehörigkeit und zukünftigem Näherkommen offen. „Aufwachen aus dem Schlaf“ ist eine natürliche, nicht unnötig theologisch interpretierende Wiedergabe. Die Fußnote zur Variantenlesart sollte präzise die abweichende erste Person nennen; die zweite Person braucht nicht als eigene Lesart erklärt zu werden.
