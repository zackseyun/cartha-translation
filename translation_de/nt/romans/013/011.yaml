source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: de
  text: 'Und dies tut, weil ihr die Zeit kennt: Die Stunde zum Aufwachen aus dem Schlaf ist schon da. Denn jetzt ist unsere Rettung näher als damals, als wir glaubten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als wir zum Glauben kamen“. Wörtlich steht im Griechischen: „als wir glaubten“. Einige Handschriften lesen in der vorigen Satzhälfte „für uns“ statt „für euch“.'
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: Und tut dies
  rationale: Das Demonstrativpronomen verweist auf die vorangehenden Ermahnungen. Das im Deutschen ergänzte „tut“ gibt die im Zusammenhang erkennbare Aufforderung natürlich wieder.
- source_word: εἰδότες τὸν καιρόν
  choice: weil ihr wisst, was für eine Zeit es ist
  rationale: Das Partizip hat hier naheliegend begründenden Sinn. Die Formulierung lässt erkennen, dass καιρός die bedeutsame, entscheidende Zeit meint und nicht bloß einen Zeitpunkt.
- source_word: ὅτι ὥρα ἤδη
  choice: Die Stunde ist schon da
  rationale: „Stunde“ bewahrt die Bildkraft und Dringlichkeit von ὥρα; „schon da“ gibt ἤδη und den gegenwärtigen Charakter des entscheidenden Augenblicks wieder.
- source_word: ὑμᾶς
  choice: ihr
  rationale: Der SBLGNT-Haupttext hat die zweite Person Plural. Die abweichende Lesart „wir/uns“ wird in einer Fußnote genannt.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: aus dem Schlaf erwacht
  rationale: Die natürliche deutsche Wendung erhält das Bild des Erwachens aus dem Schlaf und entspricht dem inchoativen Sinn des Infinitivs.
- source_word: νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: Denn jetzt ist unsere Rettung näher
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder. „Unsere Rettung“ lässt den noch bevorstehenden Aspekt von σωτηρία offen, ohne ihn dogmatisch einzuengen.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: als damals, als wir glaubten
  rationale: Die Wiedergabe folgt der schlichten Verbform des Griechischen und ergänzt weder ausdrücklich „zuerst“ noch eine bestimmte Beschreibung des Glaubensbeginns.
theological_decisions:
- issue: Die Rettung ist den Glaubenden zugehörig und zugleich noch näher kommend
  choice: „unsere Rettung“ ohne nähere dogmatische Bestimmung
  alternative: „unsere endgültige Rettung“ oder „die Vollendung unserer Rettung“
  rationale: Paulus bezeichnet die Rettung als „unsere“, spricht aber zugleich von ihrem Näherkommen. Die Übersetzung bewahrt diese eschatologische Spannung, statt sie auf eine einzelne Heilsstufe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die folgende Erklärung der erkannten Zeit deutlich; die kurzen Hauptsätze erhalten die Dringlichkeit des Verses.
