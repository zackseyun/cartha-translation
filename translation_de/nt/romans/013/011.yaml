revisions:
- from: 'Und tut dies, weil ihr wisst, was für eine Zeit es ist: Die Stunde ist schon da, dass ihr[a] aus dem Schlaf erwacht. Denn jetzt ist unsere Rettung näher als damals, als wir glaubten.[b]'
  to: 'Und dies tut, weil ihr die Zeit kennt: Die Stunde zum Aufwachen aus dem Schlaf ist schon da. Denn jetzt ist unsere Rettung näher als damals, als wir glaubten.[a]'
  rationale: Die Satzstruktur wurde neu gefasst, damit die im Griechischen ausgesagte Dringlichkeit („die Stunde ist schon da“) und der Bezug zum Aufwachen idiomatisch im Deutschen erscheinen. Die freie Umschreibung von καιρός wurde durch „die Zeit kennt“ ersetzt. Die Fußnoten wurden an einem einzigen Anker zusammengeführt, da beide den Vers betreffen; die Variantenlesart wird präzise als „für uns“ angegeben. Die Bedeutung des Verses bleibt unverändert.
