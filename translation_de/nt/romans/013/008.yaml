source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: de
  text: Seid niemandem etwas schuldig, außer einander zu lieben; denn wer den anderen[a] liebt, hat das Gesetz erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen anderen Menschen«. Griechisch: »den anderen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Seid niemandem etwas schuldig
  rationale: Die Formulierung gibt die umfassende Wendung »niemandem nichts« in natürlichem Deutsch wieder und bewahrt zugleich das Bedeutungsfeld von Schuld, Verschuldung und Verpflichtung.
- source_word: εἰ μὴ
  choice: außer dass
  rationale: Die Wendung führt die einzige fortbestehende Verpflichtung ein und lässt sich vor dem Infinitivsatz idiomatisch mit »außer dass« wiedergeben.
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: dass ihr einander liebt
  rationale: Der substantivierte Infinitiv bezeichnet die wechselseitige Liebe als bleibende Verpflichtung. Der deutsche Nebensatz klingt natürlicher als eine nominale Konstruktion.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: denn wer … liebt
  rationale: Das substantivierte Partizip wird geschlechtsübergreifend, knapp und idiomatisch durch »wer« wiedergegeben.
- source_word: τὸν ἕτερον
  choice: den anderen
  rationale: Dies entspricht unmittelbar dem griechischen Ausdruck »den anderen« und vermeidet, den erst im folgenden Kontext auftretenden Begriff »Nächster« vorwegzunehmen.
- source_word: νόμον
  choice: das Gesetz
  rationale: Der bestimmte Ausdruck verweist im Kontext auf das bekannte Gesetz, dessen Forderungen die folgenden Verse zusammenfassen.
- source_word: πεπλήρωκεν
  choice: hat … erfüllt
  rationale: Das deutsche Perfekt gibt den vollendeten Aspekt mit fortbestehendem Ergebnis angemessen wieder; »erfüllt« bewahrt zudem den paulinischen Sinnzusammenhang.
theological_decisions:
- issue: Reichweite des Verbots, Schulden zu haben
  choice: Die Aussage wird unmittelbar als Verbot des Schuldigseins wiedergegeben, ohne sie zu einer ausdrücklichen Lehre über jede Form finanzieller Kreditaufnahme auszubauen.
  alternative: Den Vers entweder als absolutes Verbot jeglicher Kreditaufnahme oder ausschließlich als Metapher moralischer Verpflichtung deuten.
  rationale: Der griechische Text spricht vom Schuldigsein und nennt die gegenseitige Liebe als Ausnahme. Die Übersetzung soll die ethische Spannung stehen lassen, statt die weitergehende Debatte vorzuentscheiden.
- issue: Bezug von τὸν ἕτερον
  choice: »den anderen«
  alternative: »den Nächsten« oder »einen anderen Menschen«
  rationale: »Den anderen« wahrt die konkrete, aber nicht näher eingegrenzte Formulierung des griechischen Textes. »Den Nächsten« würde Terminologie aus dem anschließenden Kontext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken. »Schuldig sein« erhält bewusst sowohl den finanziellen als auch den allgemein verpflichtenden Bedeutungsbereich.
