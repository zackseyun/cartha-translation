  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: de
  text: Denn die Herrschenden sind für gutes Handeln kein Grund zur Furcht, sondern für schlechtes Handeln.[a] Willst du dich aber vor der staatlichen Gewalt nicht fürchten? Tu das Gute, und du wirst von ihr Anerkennung erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für eine gute Tat … für das Böse«. Das Griechische stellt das Gute und das Böse im allgemeinen ethischen Sinn gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχοντες
  choice: die Herrschenden
  rationale: Bezeichnet diejenigen, die regieren oder ein Regierungsamt innehaben; die Formulierung bleibt allgemein und legt kein bestimmtes Amt fest.
- source_word: φόβος
  choice: ein Grund zur Furcht
  rationale: Der prädikative Ausdruck bezeichnet hier das, was Furcht hervorruft. Diese deutsche Wendung gibt den Sinn natürlich wieder, ohne die Herrschenden selbst als abstrakte »Furcht« zu bezeichnen.
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: für das gute Werk … für das böse
  rationale: Die Gegenüberstellung von Gutem und Bösem wird bewahrt. »Werk« gibt das ausdrücklich vorhandene ἔργῳ wieder; beim zweiten Glied ist »Werk« wie im Griechischen sinngemäß zu ergänzen.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Willst du dich aber … nicht fürchten?
  rationale: Bewahrt die rhetorische Frage und die Struktur von θέλεις mit verneintem Infinitiv, statt sie in einen Bedingungssatz umzudeuten.
- source_word: ἐξουσίαν
  choice: die staatliche Gewalt
  rationale: Im Zusammenhang von Römer 13 bezeichnet die singuläre ἐξουσία die regierende Autorität. »Staatliche Gewalt« ist im Deutschen verständlich und institutionell, ohne ein bestimmtes Organ zu benennen.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Dann tue das Gute
  rationale: Der substantivierte Ausdruck wird als allgemeine ethische Kategorie wiedergegeben; »Dann« stellt den natürlichen Anschluss an die rhetorische Frage her.
- source_word: ἕξεις ἔπαινον
  choice: du wirst … Anerkennung erhalten
  rationale: ἔπαινος kann Lob oder Anerkennung bezeichnen. »Anerkennung erhalten« ist im Verhältnis zu einer staatlichen Instanz idiomatischer als »Lob haben«.
- source_word: ἐξ αὐτῆς
  choice: von ihr
  rationale: Das feminine Pronomen verweist auf die ebenfalls feminine »staatliche Gewalt« und lässt den Bezug im Haupttext klar erkennen.
theological_decisions:
- issue: Reichweite der Aussage über Herrschende und Anerkennung
  choice: Die Aussage wird als Beschreibung der normalen beziehungsweise vorgesehenen Funktion staatlicher Gewalt übersetzt, ohne sie sprachlich zu einer ausnahmslosen Behauptung über jedes tatsächliche Regierungshandeln zu verstärken.
  alternative: Die Aussage als uneingeschränktes Versprechen verstehen, dass jede Regierung stets das Gute anerkennt und nur das Böse sanktioniert, oder sie ohne Textsignal ironisch deuten.
  rationale: Der griechische Text formuliert allgemein und spannungsreich. Die Übersetzung sollte weder zusätzliche Einschränkungen einfügen noch eine absolute oder ironische Deutung ausdrücklich festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage des griechischen Textes bleibt erhalten. »Staatliche Gewalt« bezeichnet hier die regierende Autorität als Institution; das feminine Pronomen »ihr« nimmt diesen Ausdruck eindeutig wieder auf.
