id: ROM.13.7
reference: Romans 13:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: de
  text: 'Gebt allen, was ihr ihnen schuldet: Wem die Steuer zusteht, dem die Steuer; wem der Zoll zusteht, dem der Zoll; wem die Furcht gebührt, dem die Furcht; wem die Ehre gebührt, dem die Ehre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Gebt
  rationale: Der Imperativ bezeichnet das Entrichten beziehungsweise Erstatten dessen, was jemandem zusteht. Zusammen mit „was ihr ihnen schuldet“ gibt „Gebt“ den Sinn natürlich und präzise wieder.
- source_word: ὀφειλάς
  choice: was ihr ihnen schuldet
  rationale: Das Substantiv bezeichnet geschuldete Leistungen oder Verpflichtungen. Die verbale Wendung ist im modernen Deutsch verständlicher als „das Geschuldete“.
- source_word: φόρον
  choice: Steuer
  rationale: φόρος bezeichnet hier eine direkte staatliche Abgabe beziehungsweise Tributsteuer.
- source_word: τέλος
  choice: Zoll
  rationale: τέλος bezeichnet im Unterschied zu φόρος eine indirekte Abgabe, etwa Zoll oder Verbrauchsabgabe. „Zoll“ bewahrt die erkennbare Unterscheidung der beiden Begriffe knapp.
- source_word: φόβον
  choice: Furcht
  rationale: Die Grundbedeutung ist „Furcht“. Diese Wiedergabe bewahrt die bewusste Spannung des Textes und schwächt sie nicht zu „Respekt“ ab.
- source_word: τιμήν
  choice: Ehre
  rationale: τιμή bezeichnet die Anerkennung und Wertschätzung, die jemandem gebührt; „Ehre“ entspricht dem Ausdruck und unterscheidet ihn von φόβος.
theological_decisions:
- issue: Bedeutung von φόβος gegenüber staatlichen Autoritäten
  choice: Furcht
  alternative: Respekt
  rationale: Der griechische Text verwendet φόβος, nicht einen eindeutig auf Achtung beschränkten Ausdruck. „Furcht“ wahrt daher die lexikalische und theologische Spannung, ohne den Umfang oder die Grenzen dieser Verpflichtung auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die viergliedrige Parallelstruktur und die emphatische Wiederholung des jeweils Geschuldeten bleiben erhalten. „Gebührt“ variiert idiomatisch gegenüber „zusteht“, ohne den Sinn zu verändern.
