  source_fidelity: Die Übersetzung gibt die Aufforderung ἀπόδοτε sowie die vier bewusst parallelen, elliptischen Dativglieder zuverlässig wieder. „Steuer“ für φόρος und „Zoll“ für τέλος bewahren die im Griechischen markierte Unterscheidung zwischen Abgabenarten. „Furcht“ entspricht φόβος unmittelbar und erhält die Spannung des Ausdrucks, ohne ihn interpretativ zu „Respekt“ abzuschwächen.
  naturalness: Modernes, würdiges Standarddeutsch. Die Wiederholung „wem …, dem …“ ist leicht formelhafter als Alltagssprache, bildet aber die rhetorische Parallelstruktur des griechischen Textes angemessen nach. „Gebt allen, was ihr ihnen schuldet“ ist klar und idiomatisch.
