id: ROM.13.1
reference: Romans 13:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: de
  text: Jeder Mensch soll sich den übergeordneten staatlichen Autoritäten unterordnen[a]. Denn es gibt keine Autorität außer von Gott, und die bestehenden Autoritäten sind von Gott eingesetzt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den höheren Autoritäten«; auch: »den übergeordneten Gewalten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von Gott angeordnet« oder »von Gott eingesetzt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: Jeder Mensch
  rationale: Wörtlich steht »jede Seele«; im koinegriechischen Sprachgebrauch bezeichnet die Wendung hier jedoch jeden einzelnen Menschen. »Jeder Mensch« ist idiomatisch und bewahrt die distributive Aussage.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: den übergeordneten Autoritäten
  rationale: ἐξουσία bezeichnet hier ausgeübte beziehungsweise übertragene Autorität; ὑπερέχω beschreibt diese Autoritäten als übergeordnet. Die Wiedergabe bleibt nahe an der Formulierung des Griechischen und legt den Ausdruck nicht unnötig auf eine bestimmte Staatsform fest.
- source_word: ὑποτασσέσθω
  choice: soll sich … unterordnen
  rationale: Der Imperativ verlangt eine geordnete Unterstellung. »Sich unterordnen« gibt die mediale Form natürlich wieder, ohne den Ausdruck zu absolutem Gehorsam auszuweiten.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: Denn es gibt keine Autorität außer von Gott
  rationale: Die Formulierung bewahrt Gott als Ursprung beziehungsweise maßgebenden Urheber von Autorität, ohne die Aussage durch zusätzliche Erklärungen einzuengen.
- source_word: αἱ δὲ οὖσαι
  choice: die bestehenden Autoritäten
  rationale: Das feminine Partizip verweist auf die zuvor genannten Autoritäten. Die ausdrückliche Wiederaufnahme ist im Deutschen klarer als »die bestehenden« allein.
- source_word: τεταγμέναι
  choice: sind … eingesetzt
  rationale: Der Perfekt Passiv von τάσσω bezeichnet einen bestehenden Zustand als Ergebnis einer Anordnung. »Eingesetzt« ist gegenwärtiges, verständliches Deutsch und erhält den Gedanken göttlicher Zuordnung.
theological_decisions:
- issue: Reichweite der Aussage über Autoritäten und Gott
  choice: Der Vers wird als Aussage wiedergegeben, dass bestehende Autoritäten in einer von Gott gesetzten Ordnung stehen.
  alternative: Die Aussage könnte als uneingeschränkte göttliche Billigung jedes Regimes und jeder einzelnen Regierungshandlung oder lediglich als abstrakte Aussage über das Prinzip der Autorität verstanden werden.
  rationale: Der griechische Text spricht konkret von den bestehenden Autoritäten und ihrer Anordnung durch Gott. Die Übersetzung bewahrt diese Spannung, erweitert sie aber weder zu einer moralischen Billigung aller Handlungen noch schwächt sie sie zu einer rein abstrakten Aussage ab.
- issue: Bedeutungsumfang von ὑποτάσσομαι
  choice: »sich unterordnen«
  alternative: »bedingungslos gehorchen«
  rationale: Das Verb bezeichnet Unterstellung in eine Ordnung, sagt in diesem Vers aber nicht ausdrücklich, dass jede einzelne Anweisung ohne jede Grenze zu befolgen sei. Eine solche Schlussfolgerung wird daher nicht in die Übersetzung aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Autoritäten« vermeidet die im heutigen Deutsch mögliche Assoziation von »Gewalten« mit Gewaltausübung; die traditionelle Alternative wird in der Fußnote genannt. Der Satzbau bleibt dem argumentativen Aufbau des griechischen Textes nahe.
