review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes im Wesentlichen treffend wieder: Πᾶσα ψυχή ist idiomatisch als „Jeder Mensch“ wiedergegeben; ὑποτασσέσθω wird ohne unzulässige Ausweitung zu absolutem Gehorsam als „soll sich ... unterordnen“ übersetzt; und das Perfektpassiv τεταγμέναι wird mit „sind ... eingesetzt“ angemessen erfasst. Der zivile Bezug von ἐξουσίαις ὑπερεχούσαις ist im Kontext sachlich gerechtfertigt. Eine kleine stilistische und terminologische Glättung ist jedoch sicher möglich.'
  naturalness: „Übergeordnete Autoritäten“ ist verständlich, wirkt im heutigen Standarddeutsch aber etwas abstrakt und verwaltungsförmig. Mit „übergeordneten staatlichen Autoritäten“ wird der im Kontext gemeinte Bereich klar und die Formulierung bleibt modern. Die Fußnotenformulierung „in ihre Ordnung gestellt“ ist zudem weniger idiomatisch als „von Gott eingesetzt“ bzw. „von Gott angeordnet“.
  terminology: „Autoritäten“ ist als Übersetzung von ἐξουσίαις möglich. Der Zusatz „staatlich“ verdeutlicht den von ὑπερεχούσαις und dem unmittelbaren Kontext nahegelegten Bezug auf öffentliche Regierungsgewalt, ohne eine konkrete Staatsform einzutragen. „Von Gott eingesetzt“ gibt τεταγμέναι sachgerecht wieder und impliziert keine moralische Billigung jeder Handlung einer Regierung.
  issues:
