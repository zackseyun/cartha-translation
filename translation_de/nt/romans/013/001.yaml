revisions:
- from: Jeder Mensch soll sich den übergeordneten Autoritäten unterordnen[a]. Denn es gibt keine Autorität außer von Gott, und die bestehenden Autoritäten sind von Gott eingesetzt[b].
  to: Jeder Mensch soll sich den übergeordneten staatlichen Autoritäten unterordnen[a]. Denn es gibt keine Autorität außer von Gott, und die bestehenden Autoritäten sind von Gott eingesetzt[b].
  rationale: Die Revision glättet nur die moderne deutsche Ausdrucksweise und verdeutlicht den staatlich-öffentlichen Bezug der im Kontext gemeinten Autoritäten. Sie bewahrt die distributive Aussage, den Imperativ zur Unterordnung, Gottes Bezug als Ursprung der Autorität und den resultativen Charakter von τεταγμέναι. Sie zieht keinerlei weitergehende Folgerung über die moralische Beurteilung einzelner Machthaber oder Handlungen.
