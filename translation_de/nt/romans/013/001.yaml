    issue: Die Wendung „übergeordnete Autoritäten“ ist ohne Kontextangabe im modernen Deutsch etwas unpräzise und stilistisch schwerfällig.
    rationale: ὑπερεχούσαις bezeichnet hier die übergeordneten bzw. regierenden Autoritäten. „Staatlichen“ macht den kontextuell gegebenen öffentlichen Bezug deutlich, ohne den griechischen Begriff auf eine bestimmte institutionelle Form zu verengen.
  - severity: low
    issue: Die Fußnotenalternative „von Gott in ihre Ordnung gestellt“ ist sprachlich unnötig umständlich.
    rationale: Sie soll τεταγμέναι erläutern, ist aber weniger idiomatisch als die bereits textnahe Alternative „von Gott eingesetzt“ oder „von Gott angeordnet“.
