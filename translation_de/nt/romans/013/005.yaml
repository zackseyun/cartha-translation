id: ROM.13.5
reference: Romans 13:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: de
  text: Darum ist es notwendig, sich unterzuordnen[a] – nicht nur wegen des Zorns[b], sondern auch wegen des Gewissens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „untertan zu sein“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort lautet „Zorn“. Gemeint sein kann die strafende Reaktion der Obrigkeit oder, weiter gefasst, Gottes Zorn, der durch die staatliche Gewalt wirksam wird.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Die Folgerungspartikel zieht eine Schlussfolgerung aus der vorausgehenden Begründung über die staatliche Gewalt. „Darum“ ist in modernem Deutsch klar und natürlich.
- source_word: ἀνάγκη
  choice: ist es notwendig
  rationale: Die unpersönliche Wendung drückt eine Notwendigkeit aus. Die Formulierung wahrt diese Aussage, ohne sie durch ein stärkeres „man muss“ zu verschärfen.
- source_word: ὑποτάσσεσθαι
  choice: sich unterzuordnen
  rationale: Der Infinitiv bezeichnet hier die angemessene Haltung gegenüber den staatlichen Gewalten. „Sich unterzuordnen“ ist verständlich und gibt den medialen beziehungsweise passiven Formwert wieder, ohne uneingeschränkten Gehorsam in den Text hineinzulesen.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: nicht nur … sondern auch
  rationale: Diese geläufige deutsche Korrelativkonstruktion gibt Aufbau und Kontrast des griechischen Ausdrucks genau wieder.
- source_word: διὰ τὴν ὀργὴν
  choice: wegen des Zorns
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Beweggrund. „Zorn“ bewahrt den unmittelbaren Wortlaut und legt nicht fest, ob die strafende Reaktion der Obrigkeit oder der durch sie wirksame göttliche Zorn gemeint ist.
- source_word: διὰ τὴν συνείδησιν
  choice: wegen des Gewissens
  rationale: Die Formulierung wahrt die Parallelität zu „wegen des Zorns“ und bezeichnet das Gewissen als inneren Beweggrund.
theological_decisions:
- issue: Bezug von ὀργή („Zorn“)
  choice: Der Text bleibt bei „Zorn“, ohne dessen Träger ausdrücklich zu bestimmen.
  alternative: „Strafe“ beziehungsweise „Gottes Zorn“
  rationale: Der unmittelbare Zusammenhang spricht sowohl von Gottes Anordnung als auch von der strafenden Funktion der Obrigkeit. Da der griechische Text den Bezug hier nicht ausdrücklich festlegt, bleibt die Spannung erhalten.
- issue: Aussagegehalt von ὑποτάσσεσθαι gegenüber staatlichen Gewalten
  choice: „sich unterzuordnen“
  alternative: „untertan zu sein“
  rationale: Die gewählte Formulierung bezeichnet die geforderte Haltung, ohne daraus eine im Vers nicht ausdrücklich ausgesagte Pflicht zu uneingeschränktem Gehorsam abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der griechischen Folgerung und der parallelen Begründung, bleibt aber durch den Gedankenstrich gut lesbar.
