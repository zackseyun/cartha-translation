id: ROM.13.6
reference: Romans 13:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: de
  text: Deshalb zahlt ihr ja auch Steuern; denn sie sind Gottes Diener und widmen sich eben dieser Aufgabe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: zahlt ihr … Steuern
  rationale: φόρος bezeichnet hier eine staatliche Abgabe bzw. Steuer; τελεῖτε bedeutet in diesem Zusammenhang „entrichten, zahlen“.
- source_word: λειτουργοὶ θεοῦ
  choice: Gottes Diener
  rationale: „Diener“ bewahrt den öffentlichen Dienstcharakter von λειτουργοί, ohne durch „Amtsträger“ mehr institutionelle Präzision einzutragen, als der Ausdruck selbst bietet.
- source_word: προσκαρτεροῦντες
  choice: widmen sich
  rationale: Das Partizip bezeichnet beharrliches Dabeibleiben bzw. fortgesetzte Hingabe an eine Tätigkeit; „widmen sich“ ist hier natürlich und sachgerecht.
- source_word: εἰς αὐτὸ τοῦτο
  choice: eben dieser Aufgabe
  rationale: Die Wendung hebt genau den zuvor beschriebenen Dienst hervor; „Aufgabe“ macht den Bezug im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Bezeichnung staatlicher Autoritäten als λειτουργοὶ θεοῦ
  choice: Gottes Diener
  alternative: Diener Gottes
  rationale: Der Genitiv wird bewusst direkt bewahrt. Die Aussage beschreibt ihre Funktion im Gedankengang, ohne eine weitergehende Billigung jedes staatlichen Handelns einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das vorangestellte γάρ wird im Deutschen nicht schwerfällig mit „Denn deshalb“ wiedergegeben; „ja auch“ bildet καὶ und den begründenden Anschluss natürlich ab. Das zweite γάρ erscheint ausdrücklich als „denn“.
