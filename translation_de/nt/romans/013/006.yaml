  source_fidelity: 'Die Übersetzung gibt den Gedankengang und die Schlüsselbegriffe des griechischen Textes zuverlässig wieder: διὰ τοῦτο γάρ als begründendes „Deshalb“, καὶ als „auch“, φόρους τελεῖτε als Steuerzahlung, λειτουργοὶ θεοῦ als „Gottes Diener“ und προσκαρτεροῦντες εἰς αὐτὸ τοῦτο als fortgesetzte Hinwendung zu genau dieser Aufgabe.'
  naturalness: „Deshalb zahlt ihr ja auch Steuern; denn sie sind Gottes Diener und widmen sich eben dieser Aufgabe“ ist modernes, flüssiges und dem argumentativen Register des Briefes angemessenes Standarddeutsch. Das „ja auch“ vermittelt den anschließenden, begründenden Ton ohne eine im Deutschen sperrige Doppelung von „denn/deshalb“.
  terminology: „Steuern“ ist hier passend für φόρους. „Gottes Diener“ bewahrt die funktionale und kultisch-öffentliche Konnotation von λειτουργοί, ohne den Begriff unnötig zu institutionalisieren oder theologisch auszuweiten. „Aufgabe“ macht den Bezug von εἰς αὐτὸ τοῦτο idiomatisch klar.
