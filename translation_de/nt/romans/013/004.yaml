  variant: modern standard German
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: de
  text: Denn sie ist Gottes Dienerin zu deinem Besten. Wenn du aber Böses tust, dann fürchte dich; denn sie trägt das Schwert nicht umsonst.[a] Sie ist nämlich Gottes Dienerin, eine Rächerin, die Zorn über den bringt, der Böses tut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ohne Grund; oder: vergeblich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: eine Rächerin zum Zorn für den, der Böses tut.'
    reason: alternative_rendering
lexical_decisions:
- source_word: διάκονός
  choice: Dienerin
  rationale: Das Wort bezeichnet hier eine Beauftragte, die im Dienst Gottes handelt. „Dienerin“ ist im Zusammenhang mit der grammatisch femininen staatlichen Gewalt natürlich und vermeidet eine unnötige kirchliche Einengung.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: zu deinem Besten
  rationale: Die Wendung drückt Nutzen beziehungsweise förderliche Zielrichtung aus und verbindet diesen Sinn ausdrücklich mit „dir“.
- source_word: τὸ κακὸν ποιῇς
  choice: Böses tust
  rationale: Die Formulierung gibt den moralischen Sinn von κακόν knapp und idiomatisch wieder.
- source_word: φοβοῦ
  choice: fürchte dich
  rationale: Der Imperativ warnt vor der strafenden Funktion der staatlichen Gewalt und wird im Deutschen prägnant wiedergegeben.
- source_word: εἰκῇ
  choice: umsonst
  rationale: Gemeint ist „ohne Grund, Zweck oder Wirkung“. „Nicht umsonst“ ist natürliches modernes Deutsch und bewahrt diese Bedeutungsbreite.
- source_word: μάχαιραν φορεῖ
  choice: trägt das Schwert
  rationale: Die konkrete Schwertmetapher und ihr Bezug auf Strafgewalt bleiben erhalten; φορεῖ bezeichnet hier das regelmäßige Tragen.
- source_word: ἔκδικος
  choice: die … vollstreckt
  rationale: Das Wort bezeichnet eine Instanz, die Vergeltung oder Recht durchsetzt. Die verbale Wiedergabe klingt im Deutschen natürlicher als „Rächerin“, ohne den vergeltenden Charakter zu beseitigen.
- source_word: εἰς ὀργὴν
  choice: den Zorn
  rationale: „Zorn“ bewahrt die theologische Spannung des griechischen Ausdrucks und legt weder ausdrücklich „Gottes Zorn“ noch bloß staatliche „Strafe“ fest.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: an dem, der Böses tut
  rationale: Die substantivierte Partizipialkonstruktion wird verständlich und ohne die stärkere Etikettierung „Übeltäter“ wiedergegeben.
theological_decisions:
- issue: Verhältnis der staatlichen Strafgewalt zum göttlichen Zorn
  choice: „die den Zorn an dem vollstreckt“ ohne ausdrückliche Ergänzung „Gottes“
  alternative: „die Gottes Zorn über den bringt“ oder „die den bestraft“
  rationale: Der Zusammenhang stellt die Gewalt als Gottes Dienerin dar, doch εἰς ὀργήν nennt Gott nicht ausdrücklich. Die gewählte Fassung erhält sowohl die Verbindung zum göttlichen Auftrag als auch die knappe Mehrdeutigkeit des Ausgangstextes.
- issue: Bedeutung von ἔκδικος als Vergelterin oder Rechtvollstreckerin
  choice: verbale Wiedergabe mit „vollstreckt“
  alternative: „eine Rächerin“
  rationale: „Rächerin“ wäre formal näher, kann im heutigen Deutschen jedoch private oder leidenschaftliche Rache nahelegen. „Vollstreckt“ passt zur amtlichen Funktion, lässt aber durch „Zorn“ den retributiven Ernst bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das feminine Pronomen „sie“ und „Dienerin“ beziehen sich auf die im Kontext genannte staatliche Gewalt beziehungsweise Obrigkeit. Die Satzführung ist verständlich, hält aber die wiederholte Bezeichnung als Gottes Dienerin und das konkrete Bild des Schwertes bewusst fest.
