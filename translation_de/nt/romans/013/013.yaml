id: ROM.13.13
reference: Romans 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: de
  text: 'Lasst uns wie am Tag anständig[a] leben: nicht in wilden Feiern und Trunkenheit, nicht in sexueller Unmoral und Zügellosigkeit, nicht in Streit und Eifersucht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in achtbarer Weise.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Neid. Das griechische Wort kann beides bezeichnen; in dieser Lasterreihe ist es negativ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: wie am Tag
  rationale: Die knappe Wendung bewahrt das Bild des Tageslichts und den Kontrast zu den Werken der Finsternis im unmittelbaren Zusammenhang.
- source_word: εὐσχημόνως
  choice: anständig
  rationale: Das Adverb bezeichnet ein schickliches, achtbares Verhalten. „Anständig“ ist gegenwärtig, verständlich und trifft die ethische Aussage.
- source_word: περιπατήσωμεν
  choice: Lasst uns … leben
  rationale: Das griechische „gehen/wandeln“ ist eine geläufige Metapher für die Lebensführung. Im heutigen Deutsch gibt „leben“ ihren Sinn natürlich wieder und bewahrt durch „Lasst uns“ den auffordernden Konjunktiv.
- source_word: κώμοις
  choice: wilden Feiern
  rationale: Gemeint sind ausgelassene, lärmende Festgelage, häufig mit starkem Alkoholkonsum. „Wilde Feiern“ ist verständlich und vermeidet die heute vorwiegend sexuelle Engführung von „Orgien“.
- source_word: μέθαις
  choice: Trunkenheit
  rationale: Das Wort bezeichnet Rauschzustände beziehungsweise Trinkexzesse; „Trunkenheit“ ist präzise und fügt sich in die Lasterreihe ein.
- source_word: κοίταις
  choice: sexueller Unmoral
  rationale: Wörtlich steht „Betten“, hier jedoch idiomatisch für unerlaubte sexuelle Beziehungen. Die sinngemäße Wiedergabe macht den sexuellen Bezug ohne irreführenden Literalismus deutlich.
- source_word: ἀσελγείαις
  choice: Zügellosigkeit
  rationale: Das Wort bezeichnet schamloses, ungehemmtes Verhalten, oft mit sexueller Färbung. „Zügellosigkeit“ erhält die Breite des Begriffs.
- source_word: ἔριδι
  choice: Streit
  rationale: Der Ausdruck meint Zwietracht und streitsüchtige Rivalität; „Streit“ ist knapp, klar und im Deutschen natürlich.
- source_word: ζήλῳ
  choice: Eifersucht
  rationale: Im Rahmen der Lasterreihe ist die negative Bedeutung verlangt. „Eifersucht“ passt zur Verbindung mit Streit; „Neid“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
theological_decisions:
- issue: Bildhafter Gegensatz von Tag und Finsternis in der ethischen Ermahnung
  choice: Das Bild wird direkt mit „wie am Tag“ wiedergegeben.
  alternative: „als wäre es Tag“ oder eine ausdeutende Wiedergabe als Leben im Licht
  rationale: Der Vers steht im Tag-Nacht-Kontrast des Zusammenhangs. Die Übersetzung bewahrt dieses Bild, ohne es zu einer weitergehenden dogmatischen Aussage auszubauen.
- issue: Idiomatische sexuelle Bedeutung von κοίταις
  choice: Sinngemäße Wiedergabe als „sexuelle Unmoral“
  alternative: Die wörtliche Wiedergabe „Betten“
  rationale: Die wörtliche Form wäre im heutigen Deutsch undurchsichtig. Die gewählte Fassung gibt den im Kontext erkennbaren sexuellen und moralischen Sinn wieder, ohne eine bestimmte Art sexuellen Fehlverhaltens zusätzlich festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die paulinische Lebenswandel-Metapher wird zugunsten natürlicher Verständlichkeit sinngemäß mit „leben“ wiedergegeben; die Tag-Metapher und die parallele Struktur der dreifachen Verneinung bleiben erhalten.
