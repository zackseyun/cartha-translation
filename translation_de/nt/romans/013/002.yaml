review_pass:
  verdict: revise
  source_fidelity: 'Die Satzlogik und die wesentlichen Bezüge sind getroffen: ὥστε ist folgernd, ἐξουσία bezieht sich im Kontext auf staatliche Autorität, und κρίμα wird zu Recht nicht auf endgültige Verdammnis eingeengt. Die Formulierung „hat sich ... gestellt“ gibt das Perfekt von ἀνθέστηκεν angemessen wieder. „Staatliche Gewalt“ kann jedoch im gegenwärtigen Deutsch leicht primär Zwangsgewalt meinen, während ἐξουσία hier die Autorität bzw. Amtsgewalt bezeichnet.'
  naturalness: Der Entwurf ist insgesamt verständlich und würdevoll. „Sich selbst ein Urteil zuziehen“ ist jedoch keine besonders natürliche deutsche Verbindung; üblich ist, dass man sich eine Strafe oder Folgen zuzieht. Die Wiederholung von „sich ... gestellt“ ist im Griechischen semantisch begründet und kann im Deutschen beibehalten werden.
  terminology: „Staatliche Autorität“ ist im modernen Standarddeutsch die klarere kontextuelle Wiedergabe von ἐξουσία. „Gottes Anordnung“ ist für διαταγή vertretbar. „Urteil“ wahrt die Bedeutungsweite von κρίμα besser als „Verurteilung“ oder „Strafe“.
  issues:
  - severity: medium
    issue: „staatliche Gewalt“ ist missverständlich.
    rationale: Es kann im modernen Deutsch vor allem physische oder staatliche Zwangsgewalt bezeichnen. Im Kontext von Römer 13,1–2 ist die institutionelle Autorität gemeint; „staatliche Autorität“ trifft dies präziser.
  - severity: low
    issue: „sich selbst ein Urteil zuziehen“ ist idiomatisch schwach.
    rationale: Die reflexive Konsequenz von ἑαυτοῖς soll erhalten bleiben, aber „ziehen sich damit ein Urteil zu“ ist im Deutschen flüssiger und macht die Folgebeziehung deutlich.
