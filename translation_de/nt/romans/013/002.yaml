revisions:
- from: Darum hat sich derjenige, der sich der staatlichen Gewalt widersetzt, gegen Gottes Anordnung[a] gestellt; und die, die sich dagegen gestellt haben, werden sich selbst ein Urteil[b] zuziehen.
  to: 'Darum: Wer sich der staatlichen Autorität widersetzt, hat sich gegen Gottes Anordnung[a] gestellt; und diejenigen, die sich dagegen gestellt haben, werden sich damit ein Urteil[b] zuziehen.'
  rationale: Die Revision ersetzt die potenziell mehrdeutige „staatliche Gewalt“ durch „staatliche Autorität“ und glättet die Verbindung mit κρίμα. Die perfektische Gegenstellung („hat sich ... gestellt“) sowie die im griechischen Text ausgedrückte, auf die Handelnden zurückfallende Folge bleiben erhalten. Die Fußnotenanker und ihre Zuordnung bleiben unverändert.
