id: ROM.13.2
reference: Romans 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: de
  text: 'Darum: Wer sich der staatlichen Autorität widersetzt, hat sich gegen Gottes Anordnung[a] gestellt; und diejenigen, die sich dagegen gestellt haben, werden sich damit ein Urteil[b] zuziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottes Ordnung“ beziehungsweise „Gottes Verfügung“.'
    reason: lexical_alternative
  - marker: b
    text: „Urteil“ kann auch mit „Verurteilung“ oder „Strafe“ wiedergegeben werden; das griechische Wort verlangt hier jedoch nicht zwingend den stärkeren Sinn einer endgültigen Verdammnis.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der Aussage des vorangehenden Verses und klingt im modernen Deutsch natürlich.
- source_word: ὁ ἀντιτασσόμενος
  choice: derjenige, der sich … widersetzt
  rationale: Das substantivierte Partizip bezeichnet allgemein einen Menschen, der Widerstand leistet; die reflexive Form gibt die bewusste Gegenstellung wieder.
- source_word: τῇ ἐξουσίᾳ
  choice: der staatlichen Gewalt
  rationale: ἐξουσία bezeichnet hier aufgrund des unmittelbaren Zusammenhangs die staatliche beziehungsweise regierende Autorität. „Gewalt“ ist in diesem Sinn ein etablierter deutscher Ausdruck für legitime Amts- und Herrschaftsbefugnis.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: Gottes Anordnung
  rationale: διαταγή kann eine Anordnung, Ordnung oder Verfügung bezeichnen. „Gottes Anordnung“ bewahrt sowohl den ordnenden als auch den verbindlichen Sinn.
- source_word: ἀνθέστηκεν
  choice: hat sich … gestellt
  rationale: Das Perfekt beschreibt eine vollzogene Gegenstellung mit fortwirkender Bedeutung. Zusammen mit „gegen“ ergibt sich eine natürliche deutsche Wiedergabe.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: und die, die sich dagegen gestellt haben
  rationale: Das substantivierte Perfektpartizip nimmt die zuvor beschriebene Gegenstellung auf. „Dagegen“ ergänzt im Deutschen den aus dem Zusammenhang klaren Bezug.
- source_word: ἑαυτοῖς
  choice: sich selbst
  rationale: Der reflexive Dativ hebt hervor, dass die Folge auf die Widerstehenden selbst zurückfällt.
- source_word: κρίμα
  choice: Urteil
  rationale: κρίμα bezeichnet ein Urteil oder einen richterlichen Entscheid und kann je nach Zusammenhang auch Verurteilung bedeuten. „Urteil“ bewahrt hier die größere Bedeutungsweite.
- source_word: λήμψονται
  choice: werden … zuziehen
  rationale: Das zukünftige Empfangen beziehungsweise Erleiden einer Folge wird zusammen mit dem reflexiven Dativ idiomatisch durch „sich ein Urteil zuziehen“ ausgedrückt.
theological_decisions:
- issue: Tragweite von κρίμα
  choice: Urteil
  alternative: Verurteilung
  rationale: Der Vers warnt vor einem Urteil über die Widerstehenden, legt aber nicht ausdrücklich fest, dass damit die endgültige ewige Verdammnis gemeint ist. Die allgemeinere Wiedergabe vermeidet eine theologische Überbestimmung.
- issue: Bezug von ἐξουσία
  choice: staatliche Gewalt im unmittelbaren Zusammenhang
  alternative: Autorität in einem allgemeineren Sinn
  rationale: Römer 13,1 spricht von den regierenden Gewalten. Die kontextbezogene Wiedergabe macht diesen Bezug verständlich, ohne eine bestimmte Staatsform oder uneingeschränkte politische Gehorsamspflicht in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt die Folgerung und die Wiederholung des Sich-Entgegenstellens, vermeidet aber veraltete Ausdrücke wie „Obrigkeit“. Die Semikolonverbindung erhält die enge argumentative Einheit des griechischen Satzes.
