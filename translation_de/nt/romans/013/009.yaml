source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: de
  text: 'Denn: »Du sollst nicht die Ehe brechen, du sollst nicht morden, du sollst nicht stehlen, du sollst nicht begehren«, und wenn es irgendein anderes Gebot gibt, wird es in diesem Wort[a] zusammengefasst: »Du sollst deinen Nächsten lieben wie dich selbst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in diesem Satz« beziehungsweise »in diesem Ausspruch«. Das griechische Wort bezeichnet hier die folgende zusammenfassende Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Denn die Gebote
  rationale: Der substantivierte Artikel leitet den Inhalt der anschließend aufgezählten Gebote ein. Im Deutschen muss der Bezug ausdrücklich gemacht werden; „die Gebote“ ergibt zusammen mit dem folgenden Singularsatz einen natürlichen und klaren Anschluss.
- source_word: Οὐ μοιχεύσεις
  choice: Du sollst nicht die Ehe brechen
  rationale: Der futurische Indikativ hat im Zitat Gebotskraft. Die traditionelle deutsche Gebotsform bewahrt den Bezug zum Dekalog und bleibt allgemein verständlich.
- source_word: Οὐ φονεύσεις
  choice: du sollst nicht morden
  rationale: φονεύω bezeichnet unerlaubtes Töten beziehungsweise Mord, nicht jedes Töten ohne Unterschied. „Morden“ ist daher genauer als „töten“.
- source_word: Οὐ κλέψεις
  choice: du sollst nicht stehlen
  rationale: Die Form „du sollst nicht“ gibt den gebietenden futurischen Indikativ wieder und wahrt die Gestalt des Schriftzitates.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: du sollst nicht begehren
  rationale: Im Zusammenhang des Dekalogs bezeichnet ἐπιθυμέω begehrliches Verlangen. „Begehren“ bewahrt sowohl den traditionellen Schriftklang als auch die kontextuelle Bedeutung.
- source_word: καὶ εἴ τις ἑτέρα ἐντολή
  choice: und jedes andere Gebot
  rationale: Die konditionale griechische Wendung ist idiomatisch als umfassende unbestimmte Aussage wiedergegeben. Sie schließt alle weiteren Gebote ein, ohne ihren Bestand eigens infrage zu stellen.
- source_word: ἀνακεφαλαιοῦται
  choice: werden ... zusammengefasst
  rationale: Das Verb bedeutet, etwas zusammenzufassen oder unter einer Überschrift zu bündeln. Der Plural nimmt im Deutschen sowohl die aufgezählten als auch alle weiteren Gebote gemeinsam auf.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: in diesem Wort
  rationale: λόγος bezeichnet hier eine sprachliche Aussage oder Formulierung. „Wort“ bleibt nahe am Griechischen und ist im biblischen Sprachgebrauch verständlich; die Fußnote nennt die natürliche Bedeutungsalternative.
- source_word: Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν
  choice: Du sollst deinen Nächsten lieben wie dich selbst
  rationale: Die Gebotsform und der knappe Vergleich des Zitats aus Levitikus werden ohne erklärende Ergänzung bewahrt.
theological_decisions:
- issue: Form der zitierten Gebote
  choice: „Du sollst nicht …“ beziehungsweise „Du sollst …“
  alternative: 'Direkter Imperativ: „Brich nicht die Ehe … Liebe deinen Nächsten …“'
  rationale: Die griechischen Futurformen zitieren den verbindlichen Wortlaut der Tora. Die vertraute deutsche Gebotsform erhält diesen intertextuellen und rechtlichen Charakter, ohne eine konfessionelle Deutung einzutragen.
- issue: Reichweite von λόγος
  choice: „Wort“ im Sinn einer zusammenfassenden Aussage
  alternative: „Ausspruch“ oder „Satz“
  rationale: Gemeint ist nicht bloß ein einzelnes Wort, sondern die folgende Schriftformulierung. Der Haupttext wahrt die lexikalische Offenheit; die Fußnote macht den gemeinten Umfang kenntlich.
- issue: Verhältnis des Liebesgebots zu den übrigen Geboten
  choice: „werden … zusammengefasst“
  alternative: „finden … ihre Erfüllung“
  rationale: ἀνακεφαλαιοῦται spricht vom Zusammenfassen oder Bündeln. „Erfüllung“ könnte eine weitergehende theologische Aussage eintragen, die das Verb an dieser Stelle nicht ausdrücklich macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Gebotsform. Die Aufzählung folgt dem Rhythmus des griechischen Schriftzitates. „Morden“ vermeidet die zu weite Bedeutung von „töten“. Der Fußnotenmarker steht nach dem vollständigen Vers, da er die Wiedergabe von „in diesem Wort“ erläutert.
