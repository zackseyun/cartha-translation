id: ROM.13.12
reference: Romans 13:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: de
  text: Die Nacht ist weit vorgerückt[a], und der Tag ist nahe gekommen. Lasst uns deshalb die Werke der Finsternis ablegen und die Rüstung des Lichts[b] anlegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Die Nacht ist fortgeschritten.“ Das griechische Verb stellt die Nacht als voranschreitend dar und deutet damit an, dass sie bereits größtenteils vergangen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die Waffen des Lichts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: die Nacht
  rationale: Die wörtliche Wiedergabe bewahrt das zeitliche Bild und den Gegensatz zum Tag; die ethische Bedeutung wird nicht vorschnell ausgedeutet.
- source_word: προέκοψεν
  choice: ist weit vorgerückt
  rationale: Das Verb bezeichnet ein Voranschreiten. „Ist weit vorgerückt“ ist im Deutschen idiomatisch und lässt erkennen, dass die Nacht bereits weit fortgeschritten ist.
- source_word: ἡ ἡμέρα
  choice: der Tag
  rationale: Die wörtliche Wiedergabe erhält den zeitlichen, ethischen und endzeitlichen Gegensatz zur Nacht.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: Die Form bezeichnet ein erfolgtes Näherkommen mit gegenwärtigem Ergebnis; „ist nahe gekommen“ bildet diesen Aspekt natürlich ab.
- source_word: ἀποβαλώμεθα
  choice: lasst uns … ablegen
  rationale: Der auffordernde Konjunktiv wird mit „Lasst uns“ wiedergegeben. „Ablegen“ wahrt zusammen mit „anlegen“ das Bild vom Wechsel der Kleidung beziehungsweise Ausrüstung.
- source_word: τὰ ἔργα
  choice: die Werke
  rationale: „Werke“ ist eine genaue und im paulinischen Sprachgebrauch vertraute Wiedergabe; der Zusammenhang macht die ethische Bedeutung deutlich.
- source_word: τοῦ σκότους
  choice: der Finsternis
  rationale: Die Genitivverbindung wird wörtlich wiedergegeben. „Finsternis“ bildet einen würdigen und klaren Gegenpol zu „Licht“.
- source_word: ἐνδυσώμεθα
  choice: lasst uns … anlegen
  rationale: „Anlegen“ passt im Deutschen sowohl zu Kleidung als auch zu einer Rüstung und erhält die Parallele zu „ablegen“.
- source_word: τὰ ὅπλα
  choice: die Rüstung
  rationale: Das Wort kann Waffen oder Ausrüstung bezeichnen. In Verbindung mit „anlegen“ liegt die tragbare Kampfausrüstung beziehungsweise Rüstung nahe, ohne die militärische Metapher auf Angriffswaffen zu verengen.
- source_word: τοῦ φωτός
  choice: des Lichts
  rationale: Die wörtliche Genitivverbindung bewahrt den Gegensatz zur Finsternis und lässt seine ethische und endzeitliche Tragweite offen.
theological_decisions:
- issue: Endzeitliches Bild von Nacht und Tag
  choice: Die Bilder „Nacht“ und „Tag“ bleiben wörtlich erhalten.
  alternative: Deutende Wiedergaben wie „das dunkle Zeitalter ist fast vorbei“ und „die neue Zeit steht bevor“.
  rationale: Die Metapher ist zugleich zeitlich, ethisch und heilsgeschichtlich. Eine erklärende Paraphrase würde diese Spannung auf eine einzelne Deutung festlegen.
- issue: Bedeutung von ὅπλα τοῦ φωτός
  choice: „die Rüstung des Lichts“
  alternative: „die Waffen des Lichts“
  rationale: Das Verb „anlegen“ begünstigt die Vorstellung tragbarer Kampfausrüstung. Da ὅπλα jedoch auch konkret „Waffen“ bedeuten kann, wird diese Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarigen Verben „ablegen“ und „anlegen“ bewahren das Kleidungs- und Ausrüstungsbild; „Finsternis“ und „Licht“ erhalten den biblisch-poetischen Kontrast, ohne ihn auszudeuten.
