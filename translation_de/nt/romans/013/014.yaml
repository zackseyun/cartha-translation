source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: de
  text: Zieht vielmehr den Herrn Jesus, den Messias, an und trefft keine Vorsorge für das Fleisch, um Begierden zu befriedigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trefft keine Vorsorge für die sündige Natur, um Begierden zu befriedigen.“ Wörtlich steht im Griechischen „Fleisch“. Paulus bezeichnet damit häufig menschliche Regungen, die einem von Gott bestimmten Leben entgegenstehen können.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sondern
  rationale: Der starke Gegensatz zum vorausgehenden Aufruf wird im Deutschen natürlich mit „sondern“ wiedergegeben.
- source_word: ἐνδύσασθε
  choice: zieht … an
  rationale: Der mediale Imperativ verwendet ein Kleidungsbild. „Zieht … an“ bewahrt diese Metapher und ist im modernen Deutschen verständlich.
- source_word: τὸν κύριον Ἰησοῦν Χριστόν
  choice: den Herrn Jesus, den Messias
  rationale: κύριος bleibt als christologischer Titel „Herr“ erhalten; Χριστός wird als Titel mit „Messias“ wiedergegeben. Die Apposition mit Komma klingt im Deutschen natürlich und verhindert, dass „Messias“ wie ein Familienname wirkt.
- source_word: τῆς σαρκὸς
  choice: für das Fleisch
  rationale: „Fleisch“ bewahrt den paulinischen Ausdruck und seine anthropologische Spannung, statt ihn vorschnell als „sündige Natur“ auszulegen.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: sorgt nicht
  rationale: Die Wendung bezeichnet vorausschauende Fürsorge oder Vorsorge. „Sorgt nicht für“ ist idiomatisches Deutsch und erhält den Bezug auf das vorherige Planen und Bereitstellen.
- source_word: εἰς ἐπιθυμίας
  choice: damit seine Begierden befriedigt werden
  rationale: εἰς kann hier Ziel oder Ergebnis der Vorsorge bezeichnen. Die Wiedergabe macht diesen Zusammenhang verständlich, ohne „Begierden“ auf ausschließlich sexuelle Lust zu verengen.
theological_decisions:
- issue: Bedeutung von σάρξ im ethisch geprägten paulinischen Zusammenhang
  choice: Fleisch
  alternative: sündige Natur
  rationale: Obwohl σάρξ hier ungeordnete menschliche Begierden einschließt, würde „sündige Natur“ die Metapher enger deuten und Paulus’ Anthropologie stärker systematisieren, als der griechische Ausdruck selbst es tut. Der Haupttext bewahrt deshalb „Fleisch“; die Fußnote erläutert die mögliche Bedeutung.
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier den Titelgehalt des Gesalbten. „Messias“ macht diesen Gehalt für heutige Leser sichtbar; „Christus“ wäre traditioneller, kann jedoch wie ein Namensbestandteil verstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Kleidungsbild und der paulinische Schlüsselbegriff „Fleisch“ bleiben erhalten; die Ziel- bzw. Ergebnisbeziehung des Schlusssatzes wird verständlich ausgedrückt.
