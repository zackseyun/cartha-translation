  source_fidelity: 'Die Kleidungsmetapher, „Herr“, „Messias“ und „Fleisch“ sind grundsätzlich quellentreu wiedergegeben. Der Schlusssatz „damit seine Begierden befriedigt werden“ verschiebt jedoch die Konstruktion unnötig ins Passiv und fügt mit „seine“ einen im Griechischen nicht ausdrücklich gesetzten Bezug hinzu. Die Fußnotenalternative „sodass ihre Begierden geweckt werden“ gibt εἰς ἐπιθυμίας sachlich nicht wieder: Es geht um Vorsorge im Hinblick auf bzw. zur Befriedigung von Begierden, nicht um deren Erweckung.'
  naturalness: „Sorgt nicht für das Fleisch“ ist möglich, aber gegenüber der auf vorausschauendes Bereitstellen zielenden Wendung πρόνοιαν ποιεῖσθε weniger präzise. „Trefft keine Vorsorge“ ist im würdevollen modernen Bibelregister klar und idiomatisch. Die Stellung „Zieht vielmehr … an“ ist im Deutschen flüssig.
  terminology: „Herr“, „Messias“, „Fleisch“ und „Begierden“ bewahren die maßgeblichen Begriffe und vermeiden eine konfessionell verengende Deutung. Die Fußnote darf „Fleisch“ als mögliche Umschreibung mit „sündige Natur“ nennen, sollte aber die semantische Erklärung nicht überzeichnen.
  issues:
