    issue: Der finale Zweckausdruck ist im Haupttext unnötig umgeformt.
    rationale: εἰς ἐπιθυμίας bezeichnet den Bezug bzw. Zweck der Vorsorge. „damit seine Begierden befriedigt werden“ setzt einen possessiven Bezug und eine passive Ereignisform, die im griechischen Text nicht vorgegeben sind.
  - severity: high
    issue: Die Fußnotenalternative verfälscht den Sinn von εἰς ἐπιθυμίας.
    rationale: „Begierden geweckt werden“ bezeichnet das Hervorrufen von Begierden; der Text untersagt hingegen Vorsorge für das Fleisch im Blick auf Begierden bzw. zu deren Befriedigung.
  - severity: low
    issue: „sorgt nicht für“ ist für πρόνοιαν ποιεῖσθε weniger genau.
    rationale: Die griechische Wendung betrifft vorsorgliches Planen oder Bereitstellen. „Trefft keine Vorsorge“ bildet dies genauer ab.
