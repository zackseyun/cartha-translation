  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe zutreffend wieder: ἀγάπη bleibt zweimal „Liebe“, κακὸν οὐκ ἐργάζεται wird idiomatisch als „tut ... nichts Böses“ wiedergegeben, und πλήρωμα νόμου als nominale Aussage „die Erfüllung des Gesetzes“. Die deutsche Fassung sollte jedoch den Bezug von τῷ πλησίον näher am etablierten und semantisch offenen „Nächsten“ halten. „Mitmensch“ ist zwar möglich, verschiebt aber die Formulierung von dem in diesem ethisch-schriftbezogenen Kontext relevanten Ausdruck „Nächster“ zu einer modernen sozialethischen Bezeichnung.'
  naturalness: „Die Liebe tut dem Nächsten nichts Böses“ ist modernes, natürliches und würdiges Standarddeutsch. „Daher“ ist möglich; „Also“ ist etwas unmittelbarer und idiomatisch als Schlussfolgerung, ohne die logische Funktion von οὖν zu verändern.
  terminology: „Nächsten“ bewahrt die terminologische Verbindung zu πλησίον und zu der paulinischen Aufnahme des Liebesgebots im unmittelbaren Kontext. „Erfüllung des Gesetzes“ ist für πλήρωμα νόμου präzise und etabliert. Die Fußnote „Fülle“ bleibt als lexikalische Alternative vertretbar.
