  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: de
  text: Die Liebe tut dem Nächsten nichts Böses; also ist die Liebe die Erfüllung des Gesetzes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Liebe ist die Fülle des Gesetzes.“'
    reason: Lexikalische Alternative für πλήρωμα; „Erfüllung“ ist im Zusammenhang klarer, während „Fülle“ die formale Bedeutung stärker erkennen lässt.
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: die Liebe
  rationale: Die geläufige und kontextgerechte Wiedergabe von ἀγάπη; die Wiederholung in beiden Satzhälften bleibt erhalten.
- source_word: τῷ πλησίον
  choice: dem Mitmenschen
  rationale: Der Dativ bezeichnet die betroffene Person. „Mitmensch“ gibt den allgemeinen ethischen Sinn natürlich wieder und vermeidet eine unnötige Einengung auf räumliche Nachbarschaft.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: tut … nichts Böses
  rationale: Die Wendung bedeutet, dass Liebe gegenüber einem anderen Menschen nichts Schädliches oder Böses vollbringt. Die Formulierung bleibt nahe an κακόν und ist zugleich idiomatisches Deutsch.
- source_word: πλήρωμα
  choice: Erfüllung
  rationale: „Erfüllung“ bezeichnet hier das, was das Gesetz zur Verwirklichung beziehungsweise Vollendung bringt, und bewahrt die nominale Aussage des Griechischen.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Schlussfolgerung aus der vorausgehenden Aussage in natürlichem Deutsch.
- source_word: νόμου
  choice: des Gesetzes
  rationale: Im Kontext ist das erkennbare Gesetz gemeint; der bestimmte Artikel ist im Deutschen idiomatisch und sachlich angemessen.
theological_decisions:
- issue: Verhältnis der Liebe zum Gesetz
  choice: die Liebe ist die Erfüllung des Gesetzes
  alternative: die Liebe ist die Fülle des Gesetzes; die Liebe erfüllt das Gesetz
  rationale: Die Übersetzung wahrt den griechischen Nominalsatz und die theologische Spannung der Aussage, ohne sie in eine bloß verbale Umschreibung oder eine konfessionelle Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mitmensch“ ist allgemein verständlich und bringt den generischen Bezug von πλησίον zum Ausdruck. Die Satzstruktur bleibt knapp und nahe am griechischen Gedankengang.
