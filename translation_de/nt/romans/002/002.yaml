source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: de
  text: Wir wissen aber, dass Gottes Urteil der Wahrheit entspricht und sich gegen die richtet, die solche Dinge tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Das formal perfekte οἶδα hat Präsensbedeutung; „wir wissen“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: δέ
  choice: aber
  rationale: δέ führt den Gedankengang mit einem leichten Gegensatz zum angesprochenen menschlichen Richten fort; „aber“ macht diesen Zusammenhang im Deutschen natürlich deutlich, ohne einen starken Kontrast zu erzwingen.
- source_word: κρίμα
  choice: Urteil
  rationale: κρίμα bezeichnet hier Gottes richterliches Urteil. „Urteil“ wahrt den gerichtlichen Sinn, ohne ihn vorschnell auf „Verurteilung“ einzuengen.
- source_word: κατὰ ἀλήθειαν
  choice: der Wahrheit entspricht
  rationale: Die Formulierung gibt die Übereinstimmung des göttlichen Urteils mit Wahrheit beziehungsweise Wirklichkeit idiomatisch wieder und bewahrt den ausdrücklichen Bezug auf „Wahrheit“.
- source_word: ἐπὶ
  choice: sich gegen ... richtet
  rationale: Bei Personen, denen ein nachteiliges Urteil gilt, bezeichnet ἐπί dessen gerichtete Geltung; „sich gegen ... richtet“ ist dafür klares modernes Deutsch.
- source_word: τὰ τοιαῦτα
  choice: so etwas
  rationale: Die Wendung verweist zusammenfassend auf die zuvor genannten Handlungen; „so etwas“ ist eine natürliche deutsche Entsprechung.
- source_word: πράσσοντας
  choice: tun
  rationale: Das substantivierte Präsenspartizip bezeichnet Menschen, deren Handeln durch solche Taten gekennzeichnet ist. Im Kontext vermittelt „die ... tun“ dies natürlich; die fortdauernde beziehungsweise charakteristische Nuance ergibt sich aus der Personenbeschreibung.
theological_decisions:
- issue: Ob κατὰ ἀλήθειαν interpretierend mit „zu Recht“ oder ausdrücklich mit Bezug auf Wahrheit wiedergegeben werden soll.
  choice: der Wahrheit entspricht
  alternative: zu Recht; gemäß der Wahrheit
  rationale: Die gewählte Formulierung bewahrt Paulus’ ausdrückliche Verankerung des göttlichen Urteils in der Wahrheit, statt sie auf die allgemeinere Aussage seiner Richtigkeit zu reduzieren. Zugleich ist sie idiomatischer als „gemäß der Wahrheit“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber durch „entspricht und sich ... richtet“ idiomatisch gegliedert. Da keine Fußnote nötig ist, enthält der Haupttext keinen Fußnotenmarker.
