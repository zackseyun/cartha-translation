  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: de
  text: 'Du also, der du einen anderen lehrst – lehrst du dich selbst nicht? Du, der du verkündest: »Du sollst nicht stehlen« – stiehlst du?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet den folgernden Übergang aus dem vorhergehenden Gedankengang; im modernen Deutschen gibt »also« diese Schlussfolgerung natürlich und deutlich wieder.
- source_word: διδάσκων
  choice: der du … lehrst
  rationale: Das substantivisch gebrauchte Partizip wird als Relativsatz wiedergegeben; so bleiben der charakterisierende Sinn und die direkte Anrede erhalten.
- source_word: ἕτερον
  choice: einen anderen
  rationale: Bewahrt den Singular und den Gegensatz zwischen der anderen Person und dem Angesprochenen selbst.
- source_word: σεαυτὸν
  choice: dich selbst
  rationale: Die reflexive Form erhält die zugespitzte Gegenüberstellung von Fremdbelehrung und Selbstbelehrung.
- source_word: οὐ διδάσκεις;
  choice: lehrst du dich selbst nicht?
  rationale: Die verneinte rhetorische Frage bleibt als Frage erhalten und vermittelt den vorwurfsvollen, ironischen Ton.
- source_word: κηρύσσων
  choice: Du verkündest
  rationale: »Verkündest« bringt den öffentlichen Bekanntmachungscharakter zum Ausdruck, ohne den Ausdruck auf eine formelle Predigt einzuengen.
- source_word: μὴ κλέπτειν
  choice: »Du sollst nicht stehlen«
  rationale: Die Infinitivkonstruktion bezeichnet den Inhalt der Verkündigung. Als direktes Verbot klingt sie im Deutschen natürlich und nimmt erkennbar die Form des Gebots auf, ohne eine ausdrückliche Quellenangabe hinzuzufügen.
- source_word: κλέπτεις;
  choice: stiehlst du?
  rationale: Die knappe Präsensfrage bewahrt die unmittelbare, anklagende Zuspitzung des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte direkte Anrede und die beiden rhetorischen Fragen bewahren Paulus’ scharfe Gegenüberstellung. Der Gedankenstrich gliedert die beiden Kontraste, ohne ihre formale Parallelität völlig einzuebnen.
