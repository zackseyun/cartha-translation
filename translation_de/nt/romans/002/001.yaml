revisions:
- from: Darum bist du nicht zu entschuldigen, du Mensch – wer du auch bist, der du urteilst. Denn indem du über einen anderen urteilst, verurteilst du dich selbst; denn du, der du urteilst, tust genau dasselbe.
  to: Darum bist du nicht zu entschuldigen, o Mensch, jeder, der urteilt. Denn indem du über einen anderen urteilst, verurteilst du dich selbst; denn du, der du urteilst, tust genau dasselbe.
  rationale: Die Revision ersetzt nur die schwerfällige und leicht verschobene Wiedergabe von πᾶς ὁ κρίνων durch „jeder, der urteilt“. Die direkte Anrede, die universale Reichweite, die rhetorische Schärfe und die bewusst nicht einseitig festgelegte Nuance von ἐν ᾧ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
