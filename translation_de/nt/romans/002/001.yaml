review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn des griechischen Satzes wird insgesamt getroffen: Διό ist folgernd wiedergegeben, ἀναπολόγητος wahrt den forensischen Gedanken, und die Unterscheidung zwischen κρίνεις und κατακρίνεις ist erhalten. Die Formulierung „wer du auch bist“ verschiebt jedoch die universalisierende Bestimmung πᾶς ὁ κρίνων leicht zu einer Aussage über die Identität des Angeredeten („wer immer du bist“), statt klar „jeder, der urteilt“ zu bezeichnen.'
  naturalness: Der Entwurf ist weitgehend modernes Standarddeutsch. Die Verbindung „du Mensch – wer du auch bist, der du urteilst“ ist jedoch syntaktisch schwerfällig. Eine direkte appositionelle Wiedergabe ist klarer und zugleich näher am griechischen Nachdruck.
  terminology: „urteilen“ und „verurteilen“ geben die abgestufte Terminologie κρίνειν / κατακρίνειν angemessen wieder. „Nicht zu entschuldigen“ ist als etablierte und verständliche Wiedergabe von ἀναπολόγητος tragfähig. „O Mensch“ gibt die feierlich-rhetorische Vokativanrede wieder, ohne die repräsentative Reichweite von ἄνθρωπος auf Männer zu begrenzen.
  issues:
  - severity: low
    issue: πᾶς ὁ κρίνων wird als „wer du auch bist, der du urteilst“ wiedergegeben.
    rationale: Die Wendung ist verständlich, aber weniger präzise und weniger idiomatisch als „jeder, der urteilt“. Das griechische πᾶς universalisiert die Gruppe der Urteilenden, nicht primär die unbekannte Identität des Angeredeten.
  revised_text: Darum bist du nicht zu entschuldigen, o Mensch, jeder, der urteilt. Denn indem du über einen anderen urteilst, verurteilst du dich selbst; denn du, der du urteilst, tust genau dasselbe.
