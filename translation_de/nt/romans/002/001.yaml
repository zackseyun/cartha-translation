id: ROM.2.1
reference: Romans 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: de
  text: Darum bist du nicht zu entschuldigen, o Mensch, jeder, der urteilt. Denn indem du über einen anderen urteilst, verurteilst du dich selbst; denn du, der du urteilst, tust genau dasselbe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Schlussfolgerung aus dem vorausgehenden Gedankengang.
- source_word: ἀναπολόγητος
  choice: nicht zu entschuldigen
  rationale: Gibt verständlich wieder, dass keine stichhaltige Rechtfertigung oder Verteidigung möglich ist, und bewahrt den forensischen Unterton.
- source_word: ὦ ἄνθρωπε
  choice: du Mensch
  rationale: Bewahrt die direkte, eindringliche Anrede. „Mensch“ bezeichnet hier repräsentativ jeden angesprochenen Menschen und ist im Deutschen nicht auf Männer beschränkt.
- source_word: πᾶς ὁ κρίνων
  choice: wer du auch bist, der du urteilst
  rationale: Gibt die universale Reichweite von πᾶς und die nähere Bestimmung des Angesprochenen in natürlichem Deutsch wieder.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: indem du über einen anderen urteilst
  rationale: „Indem“ bewahrt sowohl den modalen beziehungsweise instrumentalen als auch den gleichzeitigen Zug der kompakten griechischen Wendung.
- source_word: κατακρίνεις
  choice: verurteilst
  rationale: Unterscheidet die stärkere, verurteilende Bedeutung deutlich vom vorausgehenden κρίνεις („urteilst“).
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: denn … tust genau dasselbe
  rationale: Gibt die inhaltliche Gleichheit des Handelns idiomatisch wieder; das Präsens lässt im Zusammenhang auch wiederholtes oder kennzeichnendes Tun erkennen.
- source_word: ὁ κρίνων
  choice: du, der du urteilst
  rationale: Bewahrt die erneute partizipiale Kennzeichnung und den direkten Vorwurfscharakter.
theological_decisions:
- issue: Repräsentative Anrede im maskulinen Singular
  choice: „du Mensch“ im Haupttext
  alternative: „o Mensch“ oder „du Mensch, jeder, der urteilt“
  rationale: ἄνθρωπος ist hier zwar formal maskulin und singularisch, richtet sich aber repräsentativ an jeden urteilenden Menschen. „Du Mensch“ erhält Form und rhetorische Schärfe, ohne den Bezug unnötig auf Männer einzuengen.
- issue: Art der Selbstverurteilung beim Urteil über andere
  choice: „indem du … urteilst, verurteilst du dich selbst“
  alternative: „wenn du … urteilst“ oder „womit du … urteilst“
  rationale: Die Übersetzung hält offen, dass der Akt beziehungsweise Maßstab des Urteilens zur Selbstverurteilung führt, statt die griechische Konstruktion ausschließlich temporal oder instrumental festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter paulinischer Anrede. Der Gedankenstrich macht die appositionelle Universalität lesbar, ohne die Schärfe des Satzes abzuschwächen. Keine Fußnote ist nötig, da „Mensch“ im Deutschen den allgemein-menschlichen Bezug bereits natürlich ausdrückt.
