  yaml_path: translation/nt/romans/002/006.yaml
  text: who will repay each one according to his works[a][b].
translation:
  language: de
  text: der jedem nach seinen Werken vergelten wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Jedem … seinen“ ist hier allgemein gemeint: jedem Menschen nach dessen Werken. Für „Werke“ kann auch „Taten“ stehen.'
    reason: lexikalische Alternative und Erläuterung des generischen Sprachgebrauchs
lexical_decisions:
- source_word: ὃς
  choice: der
  rationale: Das Relativpronomen knüpft unmittelbar an Gott im vorausgehenden Zusammenhang an; „der“ ist im Deutschen natürlich und genau.
- source_word: ἀποδώσει
  choice: vergelten wird
  rationale: Das Verb bezeichnet hier das Zurückgeben beziehungsweise die Vergeltung in einem gerichtlichen Zusammenhang. „Vergelten“ bewahrt diesen Sinn klar und würdig.
- source_word: ἑκάστῳ
  choice: jedem
  rationale: „Jedem“ gibt die distributive Aussage des griechischen Singulars knapp und idiomatisch wieder.
- source_word: κατὰ
  choice: nach
  rationale: „Nach“ bezeichnet hier den Maßstab der Vergeltung und entspricht der üblichen deutschen Wendung.
- source_word: τὰ ἔργα
  choice: Werken
  rationale: „Werke“ ist die direkte Entsprechung und wahrt den paulinischen Wortgebrauch; „Taten“ bleibt eine verständliche Alternative.
- source_word: αὐτοῦ
  choice: seinen
  rationale: Das Possessivpronomen wird im Deutschen auf das generisch gebrauchte „jedem“ bezogen. Die inklusive Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Gericht nach den Werken
  choice: Die Aussage von Vergeltung nach den Werken bleibt ohne Abschwächung stehen.
  alternative: Allgemeiner mit „behandeln“ oder ausschließlich positiv mit „belohnen“ wiedergeben.
  rationale: Der griechische Text spricht ausdrücklich von Vergeltung nach den Werken. Die Übersetzung soll die daraus entstehende theologische Spannung nicht durch harmonisierende Auslegung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur bleibt als Relativsatz erhalten, weil der Vers syntaktisch an den vorausgehenden Kontext anschließt.
