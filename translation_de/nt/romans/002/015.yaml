  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: de
  text: Sie zeigen, dass das Werk des Gesetzes[a] in ihren Herzen geschrieben ist. Zugleich legt ihr Gewissen dafür Zeugnis ab, und ihre Gedanken klagen einander an oder verteidigen einander sogar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Forderung des Gesetzes“ oder „das, was das Gesetz fordert“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung ist syntaktisch gedrängt und enthält ausdrücklich einen reziproken Bezug („untereinander“ bzw. „einander“). Unter Ergänzung eines Objekts ist auch möglich: „ihre Gedanken klagen sie an oder verteidigen sie sogar“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: sie zeigen
  rationale: „Zeigen“ gibt die nachweisende Bedeutung des Verbs klar wieder, ohne sie zu einem strengen Beweis zu verstärken.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: das Werk des Gesetzes
  rationale: Die bewusst knappe griechische Formulierung steht im Singular und wird im Haupttext möglichst transparent bewahrt; die geläufigere Deutung steht in der Fußnote.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: in ihre Herzen geschrieben
  rationale: Die Wendung bewahrt sowohl die räumliche Präposition als auch das Bild einer inneren Einschreibung in natürlichem Deutsch.
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: zugleich legt ihr Gewissen dafür Zeugnis ab
  rationale: „Zugleich“ und „dafür Zeugnis ablegen“ geben den begleitenden und bestätigenden Sinn der Genitivus-absolute-Konstruktion samt dem Präfix συν- verständlich wieder.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: ihre Gedanken
  rationale: Die syntaktisch gedrängte reziproke Wendung lässt sich im Deutschen nicht eindeutig und zugleich natürlich in den Hauptsatz übernehmen; ihre wörtlichere Gestalt und Mehrdeutigkeit werden deshalb in der Fußnote bewahrt.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: klagen sie an oder verteidigen sie sogar
  rationale: „Anklagen“ und „verteidigen“ entsprechen der forensischen Färbung der Verben; „sogar“ gibt das betonte καὶ nach ἢ wieder. Das Pronomen „sie“ bezeichnet im Zusammenhang die betreffenden Menschen.
theological_decisions:
- issue: Bezeichnet Paulus allgemein ein inneres moralisches Wissen oder ausdrücklich das, was das Gesetz fordert?
  choice: Im Haupttext bleibt die weniger deutende Formulierung „das Werk des Gesetzes“ erhalten.
  alternative: „die Forderung des Gesetzes“ oder „das, was das Gesetz fordert“
  rationale: Der griechische Ausdruck ist knapper und weniger eindeutig als diese verbreiteten Deutungen. Die formnähere Wiedergabe bewahrt die theologische Spannung.
- issue: Sind die Gedanken wechselseitig aufeinander bezogen, oder klagen und verteidigen sie die Menschen?
  choice: 'Im Haupttext sind die Menschen das ergänzte Objekt: Die Gedanken klagen „sie“ an oder verteidigen „sie“.'
  alternative: „die Gedanken klagen einander an oder verteidigen einander“ beziehungsweise „die Gedanken untereinander“
  rationale: Die Partizipien beschreiben am natürlichsten die innere Anklage oder Verteidigung der betreffenden Menschen. Das griechische μεταξὺ ἀλλήλων bleibt jedoch syntaktisch mehrdeutig und wird daher in der Fußnote ausdrücklich sichtbar gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist für heutige Leser gegliedert, ohne die knappe Bildsprache oder die sachlich-forensische Färbung des griechischen Textes aufzugeben.
