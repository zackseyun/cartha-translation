id: ROM.2.9
reference: Romans 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: de
  text: Bedrängnis und Not kommen über jeden Menschen[a], der das Böse tut, über den Juden zuerst und auch über den Griechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über jede Seele eines Menschen“; gemeint ist jeder Mensch beziehungsweise jede Person.'
    reason: lexical_alternative
  - marker: b
    text: „Grieche“ bezeichnet hier im Gegensatz zu „Jude“ den Nichtjuden.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: Gibt schwere Not in natürlichem, würdigem Deutsch wieder und bleibt von στενοχωρία unterscheidbar.
- source_word: στενοχωρία
  choice: Angst
  rationale: Bewahrt neben „Bedrängnis“ die Vorstellung innerer Enge und Not, ohne ein unnatürliches Begriffspaar zu bilden.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: über jeden Menschen[a]
  rationale: ψυχή bezeichnet hier idiomatisch die Person beziehungsweise den Menschen als lebendes Wesen. Die natürliche deutsche Wiedergabe vermeidet das missverständliche „jede Menschenseele“, während die Fußnote die Bildlichkeit des Wortlauts festhält.
- source_word: τοῦ κατεργαζομένου
  choice: der ... tut
  rationale: Gibt das substantivierte Partizip in diesem sittlichen Zusammenhang schlicht und idiomatisch wieder, ohne eine Gewohnheit stärker zu betonen, als der Text es verlangt.
- source_word: τὸ κακόν
  choice: das Böse
  rationale: Bewahrt die substantivierte, allgemein moralische Bedeutung des griechischen Neutrums.
- source_word: Ἰουδαίου
  choice: Juden
  rationale: Bezeichnet im Römerbrief in diesem Gegensatz das jüdische Volk und nicht lediglich Bewohner Judäas.
- source_word: Ἕλληνος
  choice: Griechen[b]
  rationale: Bewahrt Paulus’ tatsächliche Bezeichnung und seinen wiederkehrenden Gegensatz „Jude/Grieche“; die Fußnote erläutert die kontextuelle Reichweite.
- source_word: πρῶτον
  choice: zuerst
  rationale: Bewahrt die ausdrücklich genannte Vorrang- beziehungsweise Reihenfolge, ohne sie theologisch auszudeuten.
theological_decisions:
- issue: Ob für die knappe griechische Nominalkonstruktion ein Verb ergänzt werden soll
  choice: „Bedrängnis und Angst kommen ...“
  alternative: „Bedrängnis und Angst über ...“
  rationale: Ein finites Verb ist im Deutschen für einen vollständigen und natürlichen Satz erforderlich. „kommen“ macht die Gerichtsaussage verständlich, ohne ihren theologischen Gehalt näher festzulegen.
- issue: Bedeutung von „Grieche“ im Gegensatz zu „Jude“
  choice: „Grieche“ im Haupttext beibehalten und als Nichtjude erläutern
  alternative: direkt „Nichtjude“ oder „Heide“ übersetzen
  rationale: Die formale Bezeichnung des Ausgangstextes bleibt sichtbar; zugleich erklärt die Fußnote, dass sie in diesem binären Gegensatz die nichtjüdische Seite bezeichnet.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit feierlichem Ernst. Die parallele Wendung „Bedrängnis und Angst“ erhält die verdichtete Gerichtssprache; „Jude“ und „Grieche“ bewahren Paulus’ Begriffspaar.
