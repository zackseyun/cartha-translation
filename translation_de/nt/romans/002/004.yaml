id: ROM.2.4
reference: Romans 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: de
  text: Oder verachtest du den Reichtum seiner Güte, Nachsicht und Geduld, ohne zu wissen, dass Gottes Güte dich zur Umkehr führt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Freundlichkeit“ an beiden Stellen statt „Güte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: Reichtum
  rationale: Bewahrt das paulinische Bild einer überströmenden Fülle und die Genitivkonstruktion auf natürliche Weise.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: Güte
  rationale: „Güte“ gibt die wohlwollende, gütige Zuwendung Gottes wieder und ermöglicht eine erkennbare lexikalische Entsprechung bei beiden Vorkommen.
- source_word: ἀνοχῆς
  choice: Nachsicht
  rationale: Bezeichnet hier Gottes Zurückhalten des Gerichts, ohne die modernen Nebenbedeutungen von „Toleranz“ einzutragen.
- source_word: μακροθυμίας
  choice: Geduld
  rationale: Ist im modernen Deutsch klar und würdevoll und vermittelt Gottes langes Ertragen.
- source_word: καταφρονεῖς
  choice: verachtest
  rationale: Erhält die scharfe, tadelnde Kraft des griechischen Verbs.
- source_word: ἀγνοῶν
  choice: erkennst nicht
  rationale: Gibt die begleitende Unkenntnis idiomatisch wieder, ohne vorsätzliche Ignoranz ausdrücklich zu unterstellen.
- source_word: εἰς μετάνοιάν
  choice: zur Umkehr
  rationale: „Umkehr“ ist eine natürliche und theologisch nicht verengende Wiedergabe von μετάνοια; „zur“ bewahrt die Zielrichtung von εἰς.
- source_word: ἄγει
  choice: führt
  rationale: Das deutsche Präsens gibt die gegenwärtige, fortdauernde Wirksamkeit natürlich wieder, ohne eine zusätzliche Verlaufsform zu erzwingen.
theological_decisions:
- issue: Wiedergabe von χρηστότης / χρηστόν als „Güte“ oder „Freundlichkeit“
  choice: Beide Vorkommen mit „Güte“ wiedergegeben.
  alternative: Beide Vorkommen mit „Freundlichkeit“ oder „Gütigkeit“ wiedergeben.
  rationale: „Güte“ umfasst im Kontext Gottes wohlwollende und moralisch gute Zuwendung und bewahrt die Wiederholung; die Fußnote hält die stärker relationale Alternative offen.
- issue: Bedeutungsumfang von μετάνοια
  choice: „Umkehr“
  alternative: „Buße“ oder „Sinnesänderung“
  rationale: „Umkehr“ erfasst die von Gott bewirkte Neuausrichtung, ohne den Begriff auf bloßes Bedauern, eine kirchliche Bußpraxis oder einen rein inneren Meinungswechsel zu reduzieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Die rhetorische Frage und die dreigliedrige Aufzählung des Griechischen bleiben erhalten.
