id: ROM.2.3
reference: Romans 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: de
  text: Meinst du aber etwa, du Mensch[a], der du über diejenigen urteilst, die solche Dinge tun, und sie selbst tust, dass du dem Urteil Gottes entkommen wirst?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen die männliche Singularform der Anrede; gemeint ist hier ein stellvertretend angesprochener Mensch.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: meinst du … etwa
  rationale: Das Verb bezeichnet hier eine persönliche Einschätzung oder Annahme. Die Partikel „etwa“ lässt im Deutschen den vorwurfsvollen Charakter der rhetorischen Frage natürlich erkennen.
- source_word: ἄνθρωπε
  choice: du Mensch
  rationale: Der Vokativ spricht einen einzelnen, stellvertretend angesprochenen Menschen direkt an. „Du Mensch“ bewahrt diese direkte Anrede, ohne das heute altertümlich klingende „o Mensch“ zu verlangen.
- source_word: κρίνων
  choice: der du … urteilst
  rationale: „Urteilen“ gibt die moralische Beurteilung direkt wieder; „verurteilen“ wäre an dieser Stelle stärker als das griechische Verb zwingend verlangt.
- source_word: πράσσοντας
  choice: die solche Dinge tun
  rationale: Die Form bezeichnet das Ausüben der zuvor genannten Handlungen. Eine künstliche deutsche Unterscheidung gegenüber ποιῶν würde einen Bedeutungsunterschied überzeichnen, den der Kontext nicht sicher trägt.
- source_word: ποιῶν αὐτά
  choice: und sie selbst tust
  rationale: Die Formulierung greift „solche Dinge“ pronominal wieder auf. „Selbst“ macht den Gegensatz zwischen dem Urteilen über andere und dem eigenen Handeln deutlich, ohne zusätzliche Sachbedeutung einzuführen.
- source_word: ἐκφεύξῃ
  choice: entkommen wirst
  rationale: Das Futur bezeichnet das vermeintliche künftige Entrinnen vor Gottes Gericht. „Entkommen“ ist präzise und im Deutschen idiomatisch.
- source_word: κρίμα
  choice: Urteil
  rationale: Das Substantiv kann Gottes richterliches Urteil beziehungsweise Gericht bezeichnen. „Urteil“ bewahrt den forensischen Sinn, ohne vorschnell nur den Vollzug der Strafe zu meinen.
theological_decisions:
- issue: Umfang von τὸ κρίμα τοῦ θεοῦ
  choice: dem Urteil Gottes
  alternative: dem Gericht Gottes
  rationale: „Urteil“ hält den richterlichen Charakter fest und lässt offen, ob vor allem der Urteilsspruch oder das umfassendere Gerichtsgeschehen im Blick steht; „Gericht“ wäre ebenfalls möglich.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede „du Mensch“ erhält den Stil der paulinischen Streit- und Lehrrede. Der Satzbau folgt der rhetorischen Frage des Griechischen, bleibt aber im Deutschen verständlich.
