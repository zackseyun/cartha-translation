  terminology: „Urteilen“ ist für κρίνων angemessen, ohne die stärkere Bedeutung „verurteilen“ einzutragen. „Urteil Gottes“ ist eine zulässige forensische Wiedergabe von τὸ κρίμα τοῦ θεοῦ und lässt den genauen Umfang des gerichtlichen Handelns offen. Die Fußnote zu „Mensch“ erklärt die männliche Singularform sachlich, ohne die Reichweite der Anrede unnötig einzuengen.
