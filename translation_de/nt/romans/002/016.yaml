  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: de
  text: an dem Tag, an dem Gott durch Messias Jesus[a] das Verborgene der Menschen richten wird, meinem Evangelium gemäß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: an dem Tag, an dem
  rationale: Die Wendung gibt die ausdrückliche Zeitangabe und den Bezug auf den Gerichtstag in natürlichem Deutsch wieder.
- source_word: κρίνει
  choice: richten wird
  rationale: Das griechische Präsens steht in einem zukunftsbezogenen eschatologischen Zusammenhang; das deutsche Futur macht diesen Zeitbezug klar, ohne die Aussage inhaltlich zu erweitern.
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: das Verborgene der Menschen
  rationale: 'Die kollektive deutsche Form bewahrt die Breite des substantivierten griechischen Ausdrucks: Gemeint ist alles, was Menschen verborgen halten oder was in ihnen verborgen ist. ἄνθρωποι bezeichnet Menschen allgemein, nicht nur Männer.'
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: durch Christus Jesus
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise Handlungsträgerschaft. „Christus Jesus“ ist die im Deutschen geläufige und zugleich quellennahe Wiedergabe der griechischen Titelfügung.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: meinem Evangelium gemäß
  rationale: Die Formulierung erhält den persönlichen Bezug „mein“ und lässt offen, ob Paulus besonders den Inhalt seiner Verkündigung oder deren Aussage über das Gericht hervorhebt.
theological_decisions:
- issue: Funktion Christi im göttlichen Gericht
  choice: Gott richtet durch Christus Jesus
  alternative: Gott richtet, wobei Christus Jesus als vermittelnde Instanz unausdrücklich bleibt
  rationale: Die Übersetzung bewahrt sowohl Gott als handelndes Subjekt als auch die durch διά mit Genitiv bezeichnete Vermittlung durch Christus Jesus.
- issue: Χριστός als Titel oder namensähnlicher Bestandteil
  choice: Christus Jesus
  alternative: Messias Jesus
  rationale: „Christus“ ist im modernen deutschen Bibelregister die natürliche Entsprechung und kann weiterhin als Titel verstanden werden; „Messias Jesus“ wäre zwar etymologisch verdeutlichend, klingt im Deutschen hier jedoch ungewöhnlich und würde die Titelfunktion stärker markieren, als es der Kontext zwingend verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als Anschluss an den vorausgehenden Kontext ein Fragment. „Das Verborgene“ ist bewusst weiter als „Geheimnisse“ und vermeidet eine unnötige Festlegung auf bestimmte verborgene Taten oder Gedanken.
