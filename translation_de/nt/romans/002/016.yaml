  - severity: low
    issue: Die alternative Wiedergabe „Christus Jesus“ ist nicht durch eine Fußnote dokumentiert.
    rationale: Die englische POB-Fassung führt diese traditionelle Form als alternative Lesart. Eine deutsche Fußnote erhält diese Information und macht die bewusste Titelübersetzung transparent.
  revised_text: an dem Tag, an dem Gott durch Messias Jesus[a] das Verborgene der Menschen richten wird, meinem Evangelium gemäß.
