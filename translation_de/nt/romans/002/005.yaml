id: ROM.2.5
reference: Romans 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: de
  text: Doch weil du hart bist und dein Herz nicht zur Umkehr bereit ist, häufst du dir selbst Zorn auf für den Tag des Zorns und der Offenbarung des gerechten Gerichts Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des gerechten Urteilsspruchs Gottes“.'
    reason: Lexikalische Alternative für δικαιοκρισία; „Urteilsspruch“ hebt den richterlichen Entscheid hervor, während „Gericht“ den umfassenderen Vorgang bezeichnen kann.
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Doch weil
  rationale: δέ wird mild gegensätzlich mit „Doch“ wiedergegeben; κατά mit Akkusativ bezeichnet hier den der inneren Haltung entsprechenden Grund und wird im Deutschen natürlich kausal ausgedrückt.
- source_word: σκληρότητά σου
  choice: weil du hart bist
  rationale: Die Härte-Metapher bleibt erhalten. Die prädikative Form klingt im heutigen Deutsch natürlicher als das abstrakte „wegen deiner Härte“.
- source_word: ἀμετανόητον καρδίαν
  choice: dein Herz nicht zur Umkehr bereit ist
  rationale: Die Wendung bewahrt sowohl das Herzmotiv als auch den Bezug von ἀμετανόητος auf fehlende Umkehrbereitschaft; sie ist verständlicher als das kirchensprachliche „unbußfertiges Herz“.
- source_word: θησαυρίζεις σεαυτῷ
  choice: häufst du dir selbst … auf
  rationale: „Aufhäufen“ vermittelt das Bild eines anwachsenden Vorrats und die reflexive Wendung bezeichnet die persönliche Folge für den Angesprochenen.
- source_word: ὀργή
  choice: Zorn
  rationale: „Zorn“ bewahrt in diesem Gerichtszusammenhang die Schwere des griechischen Ausdrucks und ist im Deutschen natürlicher als „Grimm“.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: für den Tag des Zorns und der Offenbarung
  rationale: Im Zusammenhang mit dem Aufhäufen bezeichnet die Tagesangabe den Zeitpunkt, auf den der angesammelte Zorn zuläuft. „Für den Tag“ ist im Deutschen klarer als „am Tag“, das fälschlich den Vorgang des Aufhäufens erst diesem Tag zuordnen könnte; die koordinierten Nomina bleiben erhalten.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: des gerechten Gerichts Gottes
  rationale: Das seltene Kompositum bezeichnet ein gerechtes Urteil beziehungsweise Gericht. Die Genitivfolge folgt der griechischen Struktur und lässt Gott ausdrücklich als den Träger des gerechten Gerichts erkennen.
theological_decisions:
- issue: Ob die nominale Formulierung zur Offenbarung in einen erklärenden Nebensatz umgewandelt werden soll
  choice: „für den Tag des Zorns und der Offenbarung des gerechten Gerichts Gottes“
  alternative: „für den Tag des Zorns, an dem Gottes gerechtes Gericht offenbart wird“
  rationale: Der erklärende Nebensatz wäre inhaltlich plausibel, doch der griechische Text verwendet koordinierte Substantive und kein finites Verb. Die Übersetzung bewahrt diese Struktur und damit ihre mögliche Spannung.
- issue: Ob ὀργή ausdrücklich als Gottes Zorn bezeichnet werden soll
  choice: „Zorn“ ohne ergänzten Besitzer
  alternative: „Gottes Zorn“
  rationale: Der Kontext legt Gottes Zorn nahe, aber der griechische Text nennt bei ὀργή keinen Genitiv. Deshalb wird die theologisch naheliegende Zuordnung nicht ausdrücklich ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung vermeidet das heute stark kirchensprachliche „unbußfertig“, bewahrt aber Umkehr, Herz, Zorn und Gericht als zentrale Begriffe. Der Satzbau bleibt nahe an der griechischen Nominalstruktur, ohne unnatürlich zu wirken.
