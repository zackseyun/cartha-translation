  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: de
  text: denen, die durch beharrliches Tun des Guten Herrlichkeit, Ehre und Unvergänglichkeit suchen, ewiges Leben;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: beharrlich Gutes tun
  rationale: Die Wendung bezeichnet Ausdauer im guten Handeln. Die verbale Formulierung ist im heutigen Deutsch natürlicher als „in der Ausdauer eines guten Werkes“ und bewahrt den fortgesetzten Charakter.
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: Herrlichkeit, Ehre und Unvergänglichkeit
  rationale: Die drei koordinierten Begriffe werden einzeln und in derselben Reihenfolge wiedergegeben; „Unvergänglichkeit“ entspricht ἀφθαρσία genauer als „Unsterblichkeit“.
- source_word: ζητοῦσιν
  choice: suchen
  rationale: „Suchen“ bildet das aktive Streben des Partizips direkt ab, ohne dessen Gegenstände näher zu deuten.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Die etablierte und sachlich genaue Wiedergabe bewahrt sowohl den Lebensbegriff als auch die eschatologische Zeitdimension.
theological_decisions:
- issue: Verhältnis von beharrlichem Gutestun, Suchen und ewigem Leben
  choice: Die syntaktische Zuordnung wird ohne erklärenden Zusatz wiedergegeben.
  alternative: Durch Zusätze erläutern, ob das ewige Leben Lohn, Folge oder Beweis des Handelns ist.
  rationale: Der Vers stellt diese Elemente nebeneinander, erklärt hier aber nicht ihren dogmatischen Zusammenhang. Die Übersetzung soll diese Spannung nicht einseitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Als syntaktisch von Römer 2,6 abhängiges Satzglied bleibt der Vers fragmentarisch; das Semikolon signalisiert den Anschluss an den folgenden Kontrast.
