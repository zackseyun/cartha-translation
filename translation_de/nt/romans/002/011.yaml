  text: For there is no partiality with God[a].
translation:
  language: de
  text: Denn bei Gott gibt es keine Parteilichkeit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bevorzugung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den erklärenden Zusammenhang natürlich im Deutschen.
- source_word: προσωπολημψία
  choice: Parteilichkeit
  rationale: Bezeichnet eine ungerechte Bevorzugung aufgrund von Ansehen, Stellung oder äußeren Merkmalen. „Parteilichkeit“ ist präzise, verständlich und trägt dem rechtlich-moralischen Zusammenhang Rechnung.
- source_word: παρὰ τῷ θεῷ
  choice: bei Gott
  rationale: Die Präposition παρά mit dem Dativ bezeichnet hier den Bereich beziehungsweise die Gegenwart Gottes; „bei Gott“ entspricht der griechischen Form und klingt im Deutschen natürlich.
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: Denn bei Gott gibt es keine Parteilichkeit.
  rationale: Die existentielle Satzgestalt des Griechischen bleibt erhalten, ohne sie in die aktive Umschreibung „Gott bevorzugt niemanden“ umzuwandeln.
theological_decisions:
- issue: Ausdruck der göttlichen Unparteilichkeit
  choice: 'Die Aussage wird allgemein und existentiell formuliert: „bei Gott gibt es keine Parteilichkeit“.'
  alternative: 'Dynamisch: „Denn Gott bevorzugt niemanden.“'
  rationale: Beide Fassungen vermitteln Gottes Unparteilichkeit; die gewählte Form gibt jedoch die griechische existentielle Konstruktion genauer wieder und vermeidet eine im Ausgangstext nicht ausdrücklich formulierte verbale Handlung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung „bei Gott gibt es“ ist idiomatisch und bewahrt zugleich die relationale Aussage von παρὰ τῷ θεῷ.
