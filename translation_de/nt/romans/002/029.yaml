  naturalness: „Beschneidung ist die des Herzens“ ist im modernen Deutsch unnötig holprig. Eine Formulierung mit „die Beschneidung des Herzens“ und einem expliziten Verb ist klarer. „dessen Lob“ macht zudem den Rückbezug von οὗ eindeutiger als „sein Lob“.
  terminology: „Jude“, „Beschneidung“, „Herz“, „Buchstabe“, „Menschen“ und „Gott“ sind sachgerecht. „Im Geist“ bewahrt die Mehrdeutigkeit von ἐν πνεύματι besser als die festlegende Wiedergabe „durch den Geist“.
