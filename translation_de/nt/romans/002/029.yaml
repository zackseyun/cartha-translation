id: ROM.2.29
reference: Romans 2:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: de
  text: Vielmehr ist Jude, wer es im Verborgenen ist; und die Beschneidung des Herzens geschieht im Geist[a], nicht nach dem Buchstaben. Dessen Lob kommt nicht von Menschen, sondern von Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Geist“; πνεῦμα kann hier den Heiligen Geist bezeichnen. Die Wendung kann jedoch auch die innere geistliche Wirklichkeit meinen, im Gegensatz zum äußerlich geschriebenen Buchstaben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: im Verborgenen
  rationale: Bewahrt den Gegensatz zum äußerlich Sichtbaren und bezeichnet die verborgene, innere Wirklichkeit, ohne den Ausdruck auf bloße Heimlichkeit zu verengen.
- source_word: Ἰουδαῖος
  choice: Jude
  rationale: Der Zusammenhang behandelt die religiöse und bundesbezogene Identität, nicht primär die geografische Herkunft aus Judäa.
- source_word: περιτομὴ καρδίας
  choice: Beschneidung ist die des Herzens
  rationale: Bewahrt das Bild der Beschneidung und gibt die knappe griechische Nominalfügung in verständlichem Deutsch wieder.
- source_word: ἐν πνεύματι
  choice: durch den Geist
  rationale: Die instrumentale Wiedergabe passt zum paulinischen Gegensatz von Geist und Buchstaben und versteht πνεῦμα wahrscheinlich als Gottes Geist; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: οὐ γράμματι
  choice: nicht durch den Buchstaben
  rationale: „Buchstabe“ wahrt die lexikalische Form und den paulinischen Gegensatz, ohne vorschnell zu „Gesetz“ oder „geschriebener Vorschrift“ zu paraphrasieren.
- source_word: οὗ ὁ ἔπαινος
  choice: Sein Lob
  rationale: Bezieht das Lob natürlich und eindeutig auf den zuvor beschriebenen Menschen, der im Verborgenen Jude ist.
- source_word: ἐξ ἀνθρώπων
  choice: von Menschen
  rationale: Gibt den generischen Plural geschlechtsübergreifend und idiomatisch wieder.
- source_word: ἐκ τοῦ θεοῦ
  choice: von Gott
  rationale: Direkte und natürliche Wiedergabe ohne sachlich unbegründete Erweiterung.
theological_decisions:
- issue: Bezeichnet πνεύματι den Heiligen Geist, den menschlichen Geist oder allgemein die innere geistliche Wirklichkeit?
  choice: den Heiligen Geist („durch den Geist“)
  alternative: „im Geist“, verstanden als menschlicher Geist oder innere geistliche Wirklichkeit
  rationale: Der paulinische Gegensatz zwischen Geist und Buchstaben spricht eher für das Wirken des Heiligen Geistes. Da Form und Bedeutung der Wendung nicht völlig eindeutig sind, wird die alternative Deutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Verborgenen“ erhält den innerlich-äußerlich-Kontrast; Gedankenstrich und Satzteilung machen die dichte griechische Struktur lesbar, ohne ihre theologischen Spannungen einzuebnen.
