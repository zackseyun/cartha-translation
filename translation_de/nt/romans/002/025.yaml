revisions:
- from: Denn die Beschneidung ist zwar von Nutzen, wenn du das Gesetz tust; wenn du aber das Gesetz übertrittst, ist deine Beschneidung zur Unbeschnittenheit geworden.[a]
  to: Denn die Beschneidung ist zwar von Nutzen, wenn du das Gesetz befolgst; wenn du aber das Gesetz übertrittst, ist deine Beschneidung zur Unbeschnittenheit geworden.[a]
  rationale: Die Revision modernisiert allein die weniger idiomatische Wendung „das Gesetz tun“ zu „das Gesetz befolgen“ und ersetzt die interpretativ verengende Fußnote durch eine neutrale Erklärung der bildhaften Umkehrung. Die griechische Syntax, der Kontrast und die starke resultative Aussage bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:44:47Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die bedingte Nützlichkeit der Beschneidung, die direkte Anrede, den Gegensatz von Gesetzesausübung und -übertretung sowie die resultative Zuspitzung von γέγονεν insgesamt treffend wieder. „Das Gesetz übertrittst“ ist eine idiomatische und sinngenaue Entfaltung von παραβάτης νόμου.
  naturalness: „Das Gesetz tun“ ist im heutigen Standarddeutsch zwar verständlich, wirkt aber deutlich bibelsprachlich und weniger natürlich als „das Gesetz befolgen“. Die revidierte Fassung wahrt die Aussage von πράσσω und ist zugleich flüssiger. Die Satzstruktur mit „zwar … aber“ bleibt angemessen.
  terminology: „Beschneidung“ und „Unbeschnittenheit“ bewahren den absichtlich scharfen paulinischen Gegensatz. Die vorhandene Fußnote deutet den Befund als Verlust eines „Bundesvorzugs“ aus; dies ist als Erklärung enger und theologisch stärker festgelegt als der griechische Wortlaut verlangt. Eine neutralere Erläuterung der rhetorischen Umkehrung ist vorzuziehen.
