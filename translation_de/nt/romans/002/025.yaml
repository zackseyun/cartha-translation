    issue: „das Gesetz tun“ klingt im modernen Standarddeutsch unnötig formelhaft.
    rationale: „Das Gesetz befolgen“ ist natürliches Deutsch und gibt die hier geforderte praktische Befolgung des Gesetzes ohne Bedeutungsverlust wieder.
  - severity: medium
    issue: Die Fußnote legt mit „verliert den mit der Beschneidung verbundenen Bundesvorzug“ eine spezifischere Deutung nahe als nötig.
    rationale: Der Text formuliert eine rhetorische Umkehrung von Beschneidung zu Unbeschnittenheit. Die Anmerkung sollte dies erklären, ohne den Sinn in eine weitergehende theologische Kategorie festzulegen.
  revised_text: Denn die Beschneidung ist zwar von Nutzen, wenn du das Gesetz befolgst; wenn du aber das Gesetz übertrittst, ist deine Beschneidung zur Unbeschnittenheit geworden.[a]
