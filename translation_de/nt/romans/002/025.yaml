id: ROM.2.25
reference: Romans 2:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: de
  text: Denn die Beschneidung ist zwar von Nutzen, wenn du das Gesetz befolgst; wenn du aber das Gesetz übertrittst, ist deine Beschneidung zur Unbeschnittenheit geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung beschreibt keine körperliche Veränderung, sondern kehrt den Gegensatz von Beschneidung und Unbeschnittenheit rhetorisch um.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: die Beschneidung
  rationale: Das konkrete Abstraktum bewahrt die bundesbezogene Kategorie des Paulus und den Gegensatz zu ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: Denn … zwar
  rationale: „Denn“ stellt die Begründungsverbindung her, während „zwar“ die bestätigende Aussage auf den folgenden Gegensatz mit „aber“ ausrichtet.
- source_word: ὠφελεῖ
  choice: ist von Nutzen
  rationale: Die Formulierung gibt den wirklichen, aber bedingten Nutzen natürlich und ohne zusätzliche Deutung wieder.
- source_word: ἐὰν νόμον πράσσῃς
  choice: wenn du das Gesetz tust
  rationale: „Das Gesetz tun“ folgt πράσσω eng, bleibt im Deutschen verständlich und vermeidet die etwas stärker deutende Wiedergabe „halten“.
- source_word: παραβάτης νόμου ᾖς
  choice: wenn du aber das Gesetz übertrittst
  rationale: Die verbale Formulierung ist natürliches modernes Deutsch und bewahrt den Gedanken der Übertretung, auch wenn die griechische Nominalkonstruktion wörtlicher „ein Übertreter des Gesetzes bist“ lautet.
- source_word: ἡ περιτομή σου
  choice: deine Beschneidung
  rationale: Die direkte Anrede und die rhetorische Zuspitzung bleiben erhalten.
- source_word: ἀκροβυστία
  choice: Unbeschnittenheit
  rationale: Hier bezeichnet das Wort den bundesbezogenen Gegenpol zur Beschneidung, nicht lediglich die Vorhaut als Körperteil.
- source_word: γέγονεν
  choice: ist … geworden
  rationale: Das Perfekt bezeichnet einen eingetretenen Zustand; „ist geworden“ erhält sowohl die Veränderung als auch ihr fortbestehendes Ergebnis.
theological_decisions:
- issue: Ob die Schlussaussage als körperliche Veränderung oder als Umkehrung des Bundesstatus auszulegen ist
  choice: Die bildkräftige Formulierung „deine Beschneidung ist zur Unbeschnittenheit geworden“ bleibt im Haupttext stehen.
  alternative: „deine Beschneidung gilt als Unbeschnittenheit“ oder „wird als Unbeschnittenheit angerechnet“
  rationale: γέγονεν formuliert die Umkehrung stärker als bloße Bewertungs- oder Anrechnungssprache. Die wörtlichere Wendung bewahrt die theologische Spannung; eine Fußnote erläutert den bundesbezogenen Sinn, ohne ihn in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paulinische Gegenüberstellung „Beschneidung/Unbeschnittenheit“ und die direkte Anrede werden bewahrt. „Das Gesetz tun“ ist bewusst quellennah; die Satzführung mit „zwar … aber“ bildet den griechischen Kontrast natürlich ab.
