  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: de
  text: Und der von Natur aus Unbeschnittene[a], der das Gesetz erfüllt, wird dich richten, der du durch den Buchstaben und die Beschneidung[b] ein Übertreter des Gesetzes bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Unbeschnittenheit von Natur aus“; gemeint ist ein unbeschnittener Mensch.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch den Buchstaben und die Beschneidung“. „Der Buchstabe“ kann hier das geschriebene Gesetz bezeichnen; die genaue Nuance von „durch“ wird unterschiedlich verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: der Unbeschnittene
  rationale: Das Substantiv bedeutet wörtlich „Unbeschnittenheit“, bezeichnet hier aber metonymisch einen unbeschnittenen Menschen. Die Wiedergabe vermeidet die weitergehende ethnische Festlegung auf „Nichtjude“.
- source_word: ἐκ φύσεως
  choice: von Natur aus
  rationale: Die geläufige deutsche Wendung gibt den natürlichen beziehungsweise angeborenen Zustand wieder, ohne ihn unnötig auszudeuten.
- source_word: τελοῦσα
  choice: der das Gesetz erfüllt
  rationale: Das attributive Partizip beschreibt den Unbeschnittenen als jemanden, der das Gesetz tatsächlich erfüllt. Die Formulierung bleibt näher an der griechischen Syntax als eine ausdrücklich konditionale Wiedergabe mit „wenn“.
- source_word: νόμος
  choice: das Gesetz
  rationale: Im Zusammenhang ist das mosaische Gesetz als bestimmte Größe gemeint.
- source_word: διὰ γράμματος καὶ περιτομῆς
  choice: Du hast den Buchstaben und die Beschneidung
  rationale: Die idiomatische deutsche Fassung bringt den Gegensatz zur Gesetzesübertretung klar zum Ausdruck. Eine Fußnote bewahrt die formal nähere und mehrdeutige Wiedergabe mit „durch“ sowie die mögliche Bedeutung „geschriebenes Gesetz“.
- source_word: παραβάτην νόμου
  choice: übertrittst doch das Gesetz
  rationale: Die verbale Formulierung ist im Deutschen natürlicher als „ein Übertreter des Gesetzes bist“ und bewahrt den ausdrücklichen Bezug zum Gesetz; „doch“ verdeutlicht den im Satz angelegten Kontrast.
theological_decisions:
- issue: Ob ἀκροβυστία ausdrücklich ethnisch als „Nichtjude“ wiederzugeben ist
  choice: der Unbeschnittene
  alternative: der Nichtjude
  rationale: Der Zusammenhang betrifft Juden und Nichtjuden, doch der griechische Ausdruck benennt hier unmittelbar die Unbeschnittenheit. Die engere Formulierung bewahrt den sprachlichen und theologischen Kontrast des Textes.
- issue: Ob das Partizip τελοῦσα konditional aufzulösen ist
  choice: der das Gesetz erfüllt
  alternative: wenn er das Gesetz erfüllt
  rationale: Die griechische Form ist ein attributives Partizip und enthält keine ausdrückliche Konditionalpartikel. Die gewählte Fassung lässt die argumentative Beziehung offen, statt sie grammatisch als Bedingung festzulegen.
- issue: Wie διὰ γράμματος καὶ περιτομῆς zum Gesetzesübertreter steht
  choice: Besitz beziehungsweise Vorzug wird im Haupttext idiomatisch ausgedrückt; die formale Mehrdeutigkeit bleibt in der Fußnote erhalten.
  alternative: durch den Buchstaben und die Beschneidung ein Übertreter des Gesetzes
  rationale: Das griechische διά kann hier instrumental verstanden werden, wird aber im Zusammenhang oft als Hinweis auf die vorhandenen Vorzüge oder sogar konzessiv aufgefasst. Der Haupttext vermeidet die missverständliche Aussage, Buchstabe und Beschneidung verursachten notwendig die Übertretung, ohne die engere Form auszublenden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Anrede „dich“ bleibt erhalten; der Doppelpunkt macht die nachfolgende nähere Bestimmung des Angeredeten lesbar. Alle Fußnotenmarker stehen im Haupttext.
