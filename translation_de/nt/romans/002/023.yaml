  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: de
  text: Du rühmst dich des Gesetzes – und entehrst Gott, indem du das Gesetz übertrittst?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: des Gesetzes
  rationale: Die idiomatische deutsche Verbindung „sich einer Sache rühmen“ gibt den Gegenstand des Rühmens natürlich wieder, ohne νόμος auf ein bloßes Reden über das Gesetz zu reduzieren.
- source_word: καυχᾶσαι
  choice: rühmst dich
  rationale: „Sich rühmen“ bewahrt den pointierten, kritischen Ton und entspricht dem reflexiven Gebrauch von καυχάομαι.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: indem du das Gesetz übertrittst
  rationale: Die instrumentale bzw. vermittelnde Funktion von διά wird durch „indem“ klar ausgedrückt. Die verbale Formulierung ist im Deutschen natürlicher als „durch die Übertretung des Gesetzes“ und bewahrt den Begriff des Übertretens.
- source_word: τὸν θεὸν
  choice: Gott
  rationale: Der bestimmte Referent wird im Deutschen bei „Gott“ ohne Artikel idiomatisch ausgedrückt.
- source_word: ἀτιμάζεις
  choice: entehrst
  rationale: „Entehren“ bildet den Gegensatz zwischen dem Rühmen des Gesetzes und der Missachtung Gottes prägnant ab.
theological_decisions:
- issue: νόμος in der paulinischen Argumentation
  choice: das Gesetz
  alternative: die Tora
  rationale: „Das Gesetz“ wahrt die traditionelle und im unmittelbaren Kontext verständliche Bezeichnung, ohne den Ausdruck durch eine speziellere Benennung stärker festzulegen, als es der griechische Text selbst tut.
- issue: Rhetorische Form des Satzes
  choice: als Frage wiedergegeben
  alternative: 'als Feststellung: „Du ... entehrst Gott ...“'
  rationale: Das griechische Fragezeichen und der Zusammenhang der rhetorischen Fragen in Römer 2,21–23 sprechen für eine anklagende Frage; ihre Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert den scharfen rhetorischen Umschlag vom Rühmen zur Entehrung. Die direkte Anrede im Singular entspricht den griechischen Verbformen.
