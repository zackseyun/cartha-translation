id: ROM.2.13
reference: Romans 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: de
  text: Denn nicht die Hörer des Gesetzes sind vor Gott gerecht, sondern die, die das Gesetz tun, werden gerechtfertigt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden für gerecht erklärt werden“; auch möglich: „werden als gerecht bestätigt werden“.'
    reason: Lexikalische Alternativen zu δικαιωθήσονται, dessen forensische Nuance unterschiedlich wiedergegeben werden kann.
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: Hörer
  rationale: „Hörer“ bewahrt den pointierten Gegensatz zu denen, die das Gesetz tun, und bezeichnet Menschen, die das Gesetz lediglich hören.
- source_word: νόμου
  choice: des Gesetzes
  rationale: Obwohl der griechische Ausdruck ohne Artikel steht, verweist er im Zusammenhang auf das bereits behandelte Gesetz; „des Gesetzes“ ist im Deutschen natürlich und kontextgerecht.
- source_word: δίκαιοι
  choice: gerecht
  rationale: „Gerecht“ entspricht dem griechischen Ausdruck und bewahrt die begriffliche Verbindung zu „gerechtfertigt werden“.
- source_word: παρὰ τῷ θεῷ
  choice: vor Gott
  rationale: „Vor Gott“ gibt die Stellung in Gottes Beurteilung knapp und idiomatisch wieder.
- source_word: ποιηταὶ νόμου
  choice: die, die das Gesetz tun
  rationale: Die substantivische Wendung wird im heutigen Deutsch natürlicher verbal wiedergegeben und wahrt den Gegensatz zwischen Hören und Tun.
- source_word: δικαιωθήσονται
  choice: werden gerechtfertigt werden
  rationale: Die Formulierung bewahrt das Futur und Passiv sowie die wichtige terminologische Verbindung zu δικαιόω im Römerbrief, ohne die Art der Rechtfertigung enger auszulegen.
theological_decisions:
- issue: Bedeutung von δικαιωθήσονται im Zusammenhang von Gottes Urteil
  choice: werden gerechtfertigt werden
  alternative: werden für gerecht erklärt werden; werden als gerecht bestätigt werden
  rationale: „Gerechtfertigt werden“ erhält die paulinische Terminologie und die genuine Deutungsspannung des Verbs. Die erklärenden Alternativen werden in der Fußnote genannt, ohne eine davon im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Gegensatz zwischen bloßem Hören und tatsächlichem Tun bleibt deutlich; die etwas markierte Form „werden gerechtfertigt werden“ bewahrt bewusst Futur, Passiv und paulinische Begriffskontinuität.
