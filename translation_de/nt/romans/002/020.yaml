revisions:
- from: ein Erzieher der Unverständigen, ein Lehrer der Unmündigen, der im Gesetz die Verkörperung von Erkenntnis und Wahrheit besitzt[a] —
  to: ein Erzieher der Unverständigen, ein Lehrer der Unmündigen, der im Gesetz die Gestalt der Erkenntnis und der Wahrheit hat[a] —
  rationale: Die Revision beschränkt sich auf μόρφωσις und die damit verbundene idiomatische Wiedergabe von ἔχων. „Gestalt“ bewahrt die lexikalische und rhetorische Offenheit des griechischen Ausdrucks besser als „Verkörperung“; die Fußnote dokumentiert die naheliegende Alternative „Form“.
  reviewer_model: gpt-5.6-terra
