  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: de
  text: ein Erzieher der Unverständigen, ein Lehrer der Unmündigen, der im Gesetz die Gestalt der Erkenntnis und der Wahrheit hat[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der im Gesetz die Form der Erkenntnis und der Wahrheit hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδευτὴν
  choice: Erzieher
  rationale: Das Wort bezeichnet jemanden, der anleitet, erzieht und nötigenfalls zurechtweist. „Erzieher“ bewahrt diese Breite und passt zur Reihe der beanspruchten Lehrrollen.
- source_word: ἀφρόνων
  choice: der Unverständigen
  rationale: ἄφρων bezeichnet Menschen ohne Einsicht oder vernünftiges Urteil. „Unverständige“ klingt im modernen Deutsch natürlich und erhält den herabsetzenden Ton.
- source_word: διδάσκαλον
  choice: Lehrer
  rationale: Die gewöhnliche und kontextuell klare Bedeutung ist „Lehrer“.
- source_word: νηπίων
  choice: der Unmündigen
  rationale: νήπιος kann wörtlich ein Kleinkind und übertragen einen unreifen oder unerfahrenen Menschen bezeichnen. „Unmündige“ erhält die Metapher, ohne ausschließlich Säuglinge als tatsächliche Schüler nahezulegen.
- source_word: ἔχοντα
  choice: der … besitzt
  rationale: Der griechische Partizipialsatz wird als deutscher Relativsatz wiedergegeben; so bleibt sein Bezug auf die angesprochene Person klar und der Satz klingt natürlich.
- source_word: μόρφωσιν
  choice: Verkörperung
  rationale: μόρφωσις kann Form, Ausprägung oder Verkörperung bedeuten. „Verkörperung“ gibt hier den Gedanken einer greifbaren Gestalt von Erkenntnis und Wahrheit wieder; die formalere Alternative wird in der Fußnote bewahrt.
- source_word: γνώσεως
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist in diesem Zusammenhang idiomatisch und erhält die enge Verbindung mit „Wahrheit“.
- source_word: ἀληθείας
  choice: Wahrheit
  rationale: Die direkte und sachgemäße Entsprechung ist „Wahrheit“.
- source_word: ἐν τῷ νόμῳ
  choice: im Gesetz
  rationale: Die Wendung bezeichnet das Gesetz als den Bereich, in dem die beanspruchte Gestalt von Erkenntnis und Wahrheit vorliegt. „Im Gesetz“ bewahrt die Präposition und den bestimmten Bezug.
theological_decisions:
- issue: Wert oder bloß äußere Form des Gesetzeswissens
  choice: „Verkörperung“ im Haupttext, „Form“ als Fußnotenalternative
  alternative: „Form“ im Haupttext, möglicherweise mit dem Unterton einer bloß äußerlichen Gestalt
  rationale: Der Vers formuliert zunächst den Anspruch der angesprochenen Person. μόρφωσις allein entscheidet nicht eindeutig, ob Paulus diesen Besitz als substanzielle Verkörperung oder als bloße Form bewertet; die Übersetzung soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung setzt den Satz aus den vorhergehenden Versen fort; der Gedankenstrich am Ende signalisiert den Übergang zur folgenden rhetorischen Wendung. Der Fußnotenmarker steht unmittelbar nach der gesamten strittigen Wendung.
