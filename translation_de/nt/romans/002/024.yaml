  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: de
  text: Denn euretwegen wird der Name Gottes unter den Nichtjuden[a] gelästert, wie geschrieben steht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter den Völkern«.'
    reason: lexical_alternative
  - marker: b
    text: Paulus greift hier Worte der Schrift auf, besonders Jesaja 52,5; ein verwandtes Thema findet sich auch in Hesekiel 36,20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für den vorhergehenden Vorwurf ein und wahrt den argumentativen Zusammenhang.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: der Name Gottes
  rationale: Gibt die Genitivverbindung direkt wieder und bewahrt die biblische Bedeutungsweite von »Name«, einschließlich des Rufes Gottes.
- source_word: δι’ ὑμᾶς
  choice: euretwegen
  rationale: διά mit Akkusativ bezeichnet hier die Ursache; »euretwegen« formuliert den Vorwurf knapp und idiomatisch.
- source_word: βλασφημεῖται
  choice: wird … gelästert
  rationale: Bewahrt Passiv und Präsens sowie den starken religiösen Sinn des Verbs.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Nichtjuden
  rationale: Im jüdisch-nichtjüdischen Zusammenhang des Römerbriefs bezeichnet ἔθνη hier am ehesten Menschen außerhalb des jüdischen Volkes; die wörtlichere Alternative wird in einer Fußnote genannt.
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Natürliche deutsche Wiedergabe der festen Formel, mit der eine Schriftanführung eingeleitet wird.
theological_decisions:
- issue: Bezug von ἔθνη
  choice: Nichtjuden
  alternative: Völker
  rationale: Der unmittelbare Kontext kontrastiert Juden und Nichtjuden. »Nichtjuden« macht diesen ethnisch-religiösen Bezug verständlich, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Euretwegen« ist prägnant und gut verständlich; »gelästert« erhält die Schärfe des griechischen Ausdrucks. Die Fußnotenmarker stehen jeweils unmittelbar beim sachlich zugehörigen Ausdruck.
