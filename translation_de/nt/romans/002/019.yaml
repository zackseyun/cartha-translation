- from: und du bist überzeugt, selbst ein Führer der Blinden zu sein, ein Licht für die, die in der Finsternis sind,
  to: und du bist überzeugt, dass du selbst ein Wegweiser für Blinde bist, ein Licht für die, die in der Finsternis sind,
  rationale: Die Revision verdeutlicht die im Griechischen ausgedrückte Selbstzuschreibung durch einen expliziten dass-Satz und ersetzt die heute unnötig markierte Bezeichnung „Führer“ durch das natürliche metaphorische Äquivalent „Wegweiser“. Aussagegehalt, Parallelismus, Satzanschluss und offene Fortführung in Vers 20 bleiben erhalten.
