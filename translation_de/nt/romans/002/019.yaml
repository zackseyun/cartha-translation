    issue: „selbst ein Führer der Blinden“
    rationale: Die Stellung von „selbst“ bildet das reflexive Objekt nicht so deutlich ab wie „dass du selbst … bist“. Zudem ist „Führer“ im gegenwärtigen Deutsch unnötig belastet; eine neutrale, personbezogen lesbare Metapher ist vorzuziehen.
