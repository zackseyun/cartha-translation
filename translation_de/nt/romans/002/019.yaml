  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: de
  text: und du bist überzeugt, dass du selbst ein Wegweiser für Blinde bist, ein Licht für die, die in der Finsternis sind,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: du bist überzeugt
  rationale: Das Perfekt bezeichnet einen gefestigten Zustand der Überzeugung bzw. Zuversicht. „Du bist überzeugt“ gibt zugleich den selbstsicheren Ton in Paulus’ Anrede wieder.
- source_word: τε
  choice: und
  rationale: Die Partikel verbindet diese Aussage mit der vorausgehenden Aufzählung. Das schlichte „und“ wahrt die Verknüpfung, ohne sie zu verstärken.
- source_word: σεαυτόν
  choice: selbst
  rationale: Das Reflexivpronomen erhält durch „selbst“ seinen betonten, auf die eigene Person gerichteten Sinn.
- source_word: ὁδηγόν
  choice: ein Führer
  rationale: Gemeint ist jemand, der anderen den Weg weist. „Führer“ bildet außerdem die Genitivverbindung „Führer der Blinden“ natürlich und prägnant ab.
- source_word: τυφλῶν
  choice: der Blinden
  rationale: Der Genitiv hängt von „Führer“ ab. Die substantivierte Personenbezeichnung ist im Deutschen verständlich und hält die knappe Bildsprache fest.
- source_word: φῶς
  choice: ein Licht
  rationale: Das metaphorisch gebrauchte Substantiv bezeichnet eine Person, die Orientierung oder Erkenntnis vermittelt; „ein Licht“ bewahrt das Bild direkt.
- source_word: τῶν ἐν σκότει
  choice: für die, die in der Finsternis sind
  rationale: Die Wendung wird personenbezogen wiedergegeben und bewahrt zugleich die Metapher. „Finsternis“ entspricht dem würdevollen biblischen Register, ohne den Sinn auszudeuten.
