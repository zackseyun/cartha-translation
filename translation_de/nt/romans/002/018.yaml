  naturalness: Der Satz ist als Fortsetzung des bedingten Satzgefüges in Römer 2,17 natürlich. „Das Vorzügliche beurteilst“ ist in diesem würdevollen Kontext idiomatisch und bewahrt die wertende Nuance besser als die Umschreibung „worauf es ankommt“.
  terminology: „Gesetz“ und „unterwiesen“ sind angemessen. „Seinen Willen“ ist kontextuell verständlich; die Anmerkung legt transparent offen, dass das griechische Possessivpronomen fehlt.
