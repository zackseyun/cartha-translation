lexical_decisions:
- source_word: γινώσκεις
  choice: kennst
  rationale: Das Präsens bezeichnet eine bestehende Kenntnis; „kennst“ ist im Deutschen bei Gottes Willen natürlicher als „weißt“ und entspricht dem direkten Sinn des Verbs.
- source_word: τὸ θέλημα
  choice: seinen Willen
  rationale: Wörtlich steht nur „den Willen“. Aus dem Zusammenhang ist Gott als Bezug eindeutig mitgemeint; das Possessivpronomen macht dies in natürlichem Deutsch deutlich, während eine Fußnote die formale Offenheit des Griechischen bewahrt.
- source_word: δοκιμάζεις
  choice: prüfst
  rationale: Das Verb bezeichnet ein prüfendes Beurteilen, das zur Erkenntnis oder Billigung des Richtigen führt. „prüfst“ hält sowohl den Vorgang als auch die wertende Nuance offen.
- source_word: τὰ διαφέροντα
  choice: worauf es ankommt
  rationale: Die Wendung kann wörtlich „die unterschiedlichen Dinge“ oder wertend „das Vorzügliche/Wesentliche“ bedeuten. „worauf es ankommt“ gibt den wahrscheinlichen idiomatischen Sinn in klarem, heutigem Deutsch wieder; die Mehrdeutigkeit wird in der Fußnote ausgewiesen.
- source_word: κατηχούμενος
  choice: da du … unterwiesen wirst
  rationale: Das passive Partizip nennt hier plausibel den Grund beziehungsweise die Grundlage der beschriebenen Kenntnis und Urteilsfähigkeit. Die finite deutsche Konstruktion ist flüssig und bewahrt die passive Lehrsituation.
- source_word: ἐκ τοῦ νόμου
  choice: aus dem Gesetz
  rationale: ἐκ bezeichnet die Quelle der Unterweisung. „aus dem Gesetz“ wahrt diese Herkunftsnuance genauer als „durch das Gesetz“.
theological_decisions:
- issue: Unausgesprochener Bezug von τὸ θέλημα
  choice: „seinen Willen“ mit Gott als kontextuellem Bezug
  alternative: „den Willen“
  rationale: Vers 17 nennt das Sich-Rühmen Gottes; deshalb ist Gottes Wille gemeint. Die Ergänzung dient natürlichem Deutsch und wird wegen des fehlenden griechischen Possessivpronomens transparent gemacht.
- issue: Deutung von τὰ διαφέροντα
  choice: idiomatisch „worauf es ankommt“
  alternative: „die unterschiedlichen Dinge“ oder „das Vorzügliche“
  rationale: Die Formulierung kann entweder Unterschiede als solche oder das in der Prüfung als überlegen Erkannte bezeichnen. Der Haupttext bietet den wahrscheinlichen kontextuellen Sinn, ohne die echte sprachliche Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt als Fortsetzung des in Vers 17 begonnenen Bedingungssatzes offen und endet daher mit einem Komma. „Unterwiesen“ wahrt den lehrhaften Charakter von κατηχέω, ohne konfessionelle Fachsprache einzuführen.
