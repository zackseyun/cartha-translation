source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: de
  text: 'Denen aber, die von selbstsüchtigem Ehrgeiz getrieben sind[a] und der Wahrheit nicht gehorchen, sondern der Ungerechtigkeit[b] gehorchen: Zorn und Wut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die aus Eigennutz handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: dem Unrecht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: aus Eigennutz handeln
  rationale: Die Wendung bezeichnet Ursprung oder Beweggrund des Handelns. „Aus Eigennutz handeln“ gibt die selbstbezogene, eigennützige Ausrichtung in natürlichem Deutsch wieder, ohne den Ausdruck auf bloße Rivalität zu verengen.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: der Wahrheit nicht gehorchen
  rationale: ἀπειθέω bezeichnet hier willentliche Ungehorsamkeit, nicht lediglich fehlenden Glauben. Die Dativkonstruktion und der Gegensatz zum folgenden πειθομένοις werden gewahrt.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: sondern der Ungerechtigkeit gehorchen
  rationale: Die Wiederholung von „gehorchen“ macht die parallele Gegenüberstellung von Wahrheit und Ungerechtigkeit sichtbar. „Sondern“ gibt den deutlichen Kontrast des zweiten δέ im Deutschen idiomatisch wieder.
- source_word: ἀδικίᾳ
  choice: Ungerechtigkeit
  rationale: „Ungerechtigkeit“ bewahrt sowohl den moralisch-theologischen als auch den auf Unrecht bezogenen Bedeutungsumfang des paulinischen Begriffs.
- source_word: ὀργὴ
  choice: Zorn
  rationale: „Zorn“ entspricht dem feierlichen und gerichtlichen Gewicht des Begriffs in diesem Zusammenhang.
- source_word: θυμός
  choice: Wut
  rationale: Neben „Zorn“ bezeichnet das Wort heftige, aufflammende Erregung. „Wut“ erhält diese Steigerung in verständlichem modernem Deutsch.
- source_word: implicit verbal ellipsis
  choice: Doppelpunkt vor „Zorn und Wut“
  rationale: Der griechische Text enthält hier kein ausdrückliches Verb. Der Doppelpunkt bewahrt die knappe, spannungsvolle Ellipse, ohne „es wird geben“ oder „wird kommen“ einzufügen.
theological_decisions:
- issue: Wiedergabe von ἀδικία im Zusammenhang des göttlichen Gerichts
  choice: Ungerechtigkeit
  alternative: Unrecht
  rationale: „Ungerechtigkeit“ wahrt den breiten paulinischen Gegensatz zur Wahrheit und die Zugehörigkeit zur δικ-Wortgruppe. „Unrecht“ ist natürlicher und konkreter, kann den theologischen Bedeutungsumfang jedoch stärker einengen.
- issue: Verbellose Ankündigung von ὀργὴ καὶ θυμός
  choice: Ellipse mit Doppelpunkt beibehalten
  alternative: „wird Zorn und Wut treffen“
  rationale: Die Ellipse lässt offen, wie das im Satzzusammenhang vorausgesetzte göttliche Vergelten syntaktisch zu ergänzen ist, und bewahrt dadurch die Härte und Kürze des Originals.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „gehorchen“ ist bewusst formal gehalten, um die genaue Gegenüberstellung der beiden griechischen Partizipien zu erhalten. Die ver bellose Schlusswendung des Originals bleibt durch den Doppelpunkt erkennbar.
