source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: de
  text: 'Du, der du sagst: »Du sollst nicht die Ehe brechen«, begehst du Ehebruch? Du, der du Götzen verabscheust, plünderst du Tempel[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: »Begehst du ein Sakrileg?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Du, der du sagst
  rationale: Der substantivierte Präsenspartizip bezeichnet eine repräsentative Person und setzt die direkte rhetorische Anrede fort. Die deutsche Form bewahrt sowohl den Partizipialgedanken als auch die persönliche Zuspitzung.
- source_word: μὴ μοιχεύειν
  choice: Du sollst nicht die Ehe brechen
  rationale: μή mit dem Infinitiv gibt den Inhalt des Gesagten als Verbot wieder. Die Formulierung ist im modernen Deutsch klar und lässt zugleich den Anklang an das Gebot erkennen.
- source_word: μοιχεύεις
  choice: brichst du die Ehe
  rationale: Das Präsens steht in einer rhetorischen Frage mit allgemeiner, anklagender Kraft. Das deutsche Präsens entspricht diesem Sinn.
- source_word: ὁ βδελυσσόμενος
  choice: Du, der du … verabscheust
  rationale: βδελύσσομαι bezeichnet starke Abscheu. »Verabscheuen« ist kräftig, gegenwärtig und stilistisch angemessen.
- source_word: τὰ εἴδωλα
  choice: Götzen
  rationale: Im Kontext sind kultisch verehrte Bilder beziehungsweise falsche Götter gemeint. »Götzen« ist die klare und herkömmliche deutsche Wiedergabe.
- source_word: ἱεροσυλεῖς
  choice: plünderst du Tempel
  rationale: ἱεροσυλέω bezeichnet konkret das Berauben oder Plündern von Tempeln beziehungsweise ihres Besitzes. »Tempel plündern« bewahrt die konkrete historische Bildsprache und klingt im Deutschen natürlich; der weitere Sinn wird in der Fußnote genannt.
theological_decisions:
- issue: Konkrete oder allgemeinere Bedeutung von ἱεροσυλεῖς
  choice: plünderst du Tempel
  alternative: begehst du ein Sakrileg
  rationale: Der unmittelbare Zusammenhang mit den Götzen spricht dafür, zunächst den konkreten Sinn beizubehalten. Da das Verb auch allgemeiner einen Frevel an Heiligem bezeichnen kann, wird diese echte Bedeutungsbreite nicht entschieden, sondern in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Form »Du, der du …« erhält den parallelen Aufbau und die direkte Schärfe der rhetorischen Fragen. Die Gebotsformulierung ist verständlich, ohne künstlich archaisch zu wirken.
