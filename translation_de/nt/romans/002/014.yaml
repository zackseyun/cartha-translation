  source_fidelity: 'Die Grundstruktur und die Schlüsselbegriffe sind zutreffend wiedergegeben: ἔθνη bezeichnet hier im Kontrast zum Gesetz Nichtjuden; φύσει bleibt mit „von Natur aus“ offen; die Wiederholung von „Gesetz“ und die Metapher „sich selbst ein Gesetz“ werden bewahrt. „Menschen aus den Völkern“ ist jedoch eine unnötig umschreibende und im Deutschen wenig idiomatische Wiedergabe von ἔθνη.'
