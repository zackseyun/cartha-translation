  terminology: „Gesetz“ ist durchgehend angemessen und erhält die rhetorische Verbindung zum abschließenden νόμος. „Nichtjuden“ trifft die kontextuelle Bedeutung von ἔθνη, ohne das historisch belastete Wort „Heiden“ zu erzwingen. Die Fußnotenalternative zu φύσει sollte nicht durch „natürliches Empfinden“ eine spezifische psychologische Deutung einführen.
