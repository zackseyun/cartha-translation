source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: de
  text: Denn wenn Nichtjuden[a], die das Gesetz nicht haben, von Natur aus[b] tun, was das Gesetz verlangt[c], sind sie, obwohl sie das Gesetz nicht haben, sich selbst ein Gesetz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Völker“.
    reason: lexical_alternative
  - marker: b
    text: Oder „naturgemäß“.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich „die Dinge des Gesetzes tun“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: Menschen aus den Völkern
  rationale: Im paulinischen Zusammenhang bezeichnet der Ausdruck Nichtjuden im Gegensatz zu Juden. „Menschen aus den Völkern“ macht diesen Sinn verständlich und hält zugleich die Grundbedeutung „Völker“ sichtbar.
- source_word: νόμον / νόμου / νόμος
  choice: Gesetz / das Gesetz
  rationale: Die wiederholte Wiedergabe mit „Gesetz“ bewahrt Paulus’ Wortspiel und den Zusammenhang zwischen dem mosaischen Gesetz und der prädikativen Aussage „sich selbst ein Gesetz“.
- source_word: φύσει
  choice: von Natur aus
  rationale: Diese naheliegende formale Wiedergabe lässt offen, ob angeborene Einsicht, natürliche Verfassung oder ein anderes Moment gemeint ist.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: das tun, was das Gesetz verlangt
  rationale: Die idiomatische deutsche Formulierung gibt den Sinn der griechischen Wendung klar wieder; die wörtlichere Alternative wird in einer Fußnote genannt.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: sich selbst ein Gesetz sein
  rationale: Die Formulierung bewahrt die prägnante Metapher und vermeidet, stärker als der griechische Text eine autonome Selbstgesetzgebung zu behaupten.
theological_decisions:
- issue: Bedeutung von φύσει für moralische Erkenntnis und Gewissen
  choice: „von Natur aus“ ohne nähere Erklärung
  alternative: „instinktiv“ oder „ihrem natürlichen Empfinden folgend“
  rationale: Das einzelne Wort legt nicht eindeutig fest, wie das natürliche Handeln theologisch zu erklären ist; die offene Formulierung bewahrt diese Spannung.
- issue: Bezug von νόμος
  choice: „Gesetz“ ohne typografische Festlegung auf einen Eigennamen
  alternative: „das mosaische Gesetz“ oder „Gesetz“ als Eigenname
  rationale: Der Kontext weist auf das mosaische Gesetz, doch die Schlusswendung verwendet dasselbe Wort metaphorisch. Die einheitliche Wiedergabe erhält die rhetorische Verbindung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, vermeidet aber eine im Deutschen schwerfällige Wiederholung von Partizipialkonstruktionen. „Menschen aus den Völkern“ ist allgemein verständlich und weniger kirchensprachlich als „Heiden“.
