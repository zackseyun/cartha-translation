source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: de
  text: Wenn nun ein Unbeschnittener[a] die Forderungen des Gesetzes befolgt, wird dann nicht seine Unbeschnittenheit als Beschneidung angerechnet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wenn nun die Unbeschnittenheit die Forderungen des Gesetzes befolgt …“ Das griechische Wort kann sowohl die Unbeschnittenheit als auch metonymisch einen Unbeschnittenen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: ein Unbeschnittener / seine Unbeschnittenheit
  rationale: Das erste Vorkommen bezeichnet im Satz sinngemäß die unbeschnittene Person; αὐτοῦ stützt diesen personalen Bezug. Beim zweiten Vorkommen bleibt der abstrakte Ausdruck „seine Unbeschnittenheit“ natürlich und bildet den Gegensatz zur Beschneidung präzise ab.
- source_word: δικαιώματα
  choice: Forderungen
  rationale: Der Plural bezeichnet hier das, was das Gesetz verbindlich verlangt. „Forderungen“ ist in modernem Deutsch klar und vermeidet den engeren oder altertümlichen Klang von „Satzungen“.
- source_word: νόμου
  choice: des Gesetzes
  rationale: Der Genitiv wird direkt wiedergegeben; im Kontext ist das mosaische Gesetz gemeint.
- source_word: φυλάσσῃ
  choice: befolgt
  rationale: Im Zusammenhang mit gesetzlichen Forderungen bezeichnet das Verb deren gehorsame Einhaltung. „Befolgt“ ist natürlicher als das wörtliche „bewacht“ und präziser als „hält“ ohne Ergänzung.
- source_word: λογισθήσεται
  choice: wird ... angerechnet
  rationale: „Angerechnet“ bewahrt die rechnende beziehungsweise zurechnende Bildsprache von λογίζομαι und ist in diesem rhetorischen Fragesatz idiomatisch.
- source_word: εἰς περιτομήν
  choice: als Beschneidung
  rationale: εἰς bezeichnet hier die Zuordnung zu einem Status oder einer Kategorie; „als Beschneidung“ gibt dies im Deutschen klar wieder.
- source_word: οὐχ
  choice: wird dann nicht ...?
  rationale: Die Negation leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. Diese Erwartung bleibt in der deutschen Form erhalten.
theological_decisions:
- issue: Verhältnis von Gesetzesgehorsam, Unbeschnittenheit und Beschneidung
  choice: 'Die rhetorische Aussage wird ohne erläuternde Zusätze wiedergegeben: Die Unbeschnittenheit wird bei Befolgung der Forderungen des Gesetzes als Beschneidung angerechnet.'
  alternative: Den Vers ausdrücklich auf Heiden, Rechtfertigung oder Bundeszugehörigkeit festlegen.
  rationale: Der griechische Satz benennt diese weiterführenden theologischen Deutungen nicht ausdrücklich. Die Übersetzung wahrt daher die Spannung und lässt den Kontext die Bedeutung entfalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personale Wiedergabe des ersten ἀκροβυστία vermeidet eine im Deutschen unnatürliche Personifizierung; die Fußnote dokumentiert die wörtliche Form. Die rhetorische Frage und die Zurechnungssprache bleiben erhalten.
