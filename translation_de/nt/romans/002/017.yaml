id: ROM.2.17
reference: Romans 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: de
  text: Wenn du dich aber Jude nennst[a], dich auf das Gesetz verlässt[b] und dich Gottes rühmst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Namen Jude trägst“ oder „Jude genannt wirst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „auf dem Gesetz ruhst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Wenn … aber
  rationale: Bewahrt sowohl die Bedingung als auch die leicht kontrastierende beziehungsweise weiterführende Funktion von δέ; die deutsche Wortstellung ist natürlich.
- source_word: Ἰουδαῖος
  choice: Jude
  rationale: Der Ausdruck ist im Römerbrief vor allem ethnisch-religiös und nicht bloß geografisch gemeint.
- source_word: ἐπονομάζῃ
  choice: dich … nennst
  rationale: Gibt den reflexiven Sinn der medialen Form idiomatisch wieder und erhält den rhetorischen Akzent des beanspruchten Namens.
- source_word: ἐπαναπαύῃ
  choice: dich auf … verlässt
  rationale: Drückt das Setzen von Vertrauen aus und ist im heutigen Deutsch klarer als eine wörtliche Wiedergabe mit „ruhen“.
- source_word: νόμῳ
  choice: das Gesetz
  rationale: Der bestimmte Artikel ist im Deutschen bei dem hier wahrscheinlich gemeinten mosaischen Gesetz sachgemäß zu ergänzen.
- source_word: καυχᾶσαι
  choice: dich … rühmst
  rationale: „Sich rühmen“ ist eine geläufige, würdige paulinische Wendung und lässt die kontextabhängige positive oder kritische Wertung offen.
- source_word: ἐν θεῷ
  choice: Gottes
  rationale: Die idiomatische Verbindung „sich Gottes rühmen“ gibt den Gegenstand beziehungsweise Grund des Rühmens wieder, ohne die Aussage zu „über Gott reden“ abzuschwächen.
theological_decisions:
- issue: Wertung des Rühmens Gottes
  choice: Die Formulierung bleibt für sich genommen wertungsoffen; der kritische Ton ergibt sich aus dem weiteren Zusammenhang.
  alternative: „auf Gott stolz bist“ könnte die Aussage stärker psychologisieren oder bereits eindeutig negativ färben.
  rationale: καυχᾶσαι kann je nach Kontext positiv oder negativ gebraucht werden. Die Übersetzung soll diese Spannung nicht vorzeitig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Vers bleibt als einleitender Bedingungssatz offen, entsprechend dem griechischen Satzbau und dem Anschluss an die folgenden Verse.
