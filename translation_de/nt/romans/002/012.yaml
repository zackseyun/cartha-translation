reference: Romans 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: de
  text: Denn alle, die ohne das Gesetz[a] gesündigt haben, werden auch ohne das Gesetz zugrunde gehen; und alle, die unter dem Gesetz[b] gesündigt haben, werden durch das Gesetz[c] gerichtet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ohne Gesetz« beziehungsweise »gesetzlos«; so an beiden Stellen für ἀνόμως.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »im Gesetz«; »unter dem Gesetz« verdeutlicht, dass diese Menschen in dessen Geltungsbereich stehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »aufgrund des Gesetzes« beziehungsweise »nach Maßgabe des Gesetzes« statt »durch das Gesetz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: ohne das Gesetz
  rationale: Die relationale Wiedergabe bewahrt den Gegensatz zu ἐν νόμῳ und bezeichnet hier das Leben außerhalb des Geltungsbereichs des mosaischen Gesetzes, ohne bloß allgemein »gesetzlos« zu bedeuten.
- source_word: ἥμαρτον
  choice: gesündigt haben
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des griechischen Aorists und hält die Aussage sachlich, ohne den Verbalaspekt zu überdeuten.
- source_word: ἀπολοῦνται
  choice: werden zugrunde gehen
  rationale: Diese Formulierung gibt den zukünftigen Untergang wieder, ohne dessen Art als Vernichtung oder ewige Strafe näher festzulegen.
- source_word: ἐν νόμῳ
  choice: unter dem Gesetz
  rationale: Die idiomatische Formulierung bezeichnet das Leben im Geltungs- und Verantwortungsbereich des Gesetzes und klingt im Deutschen natürlicher als das wörtliche »im Gesetz«.
- source_word: διὰ νόμου
  choice: durch das Gesetz
  rationale: Die Wiedergabe bewahrt den Unterschied zu ἐν νόμῳ und lässt offen, ob das Gesetz vor allem als Mittel oder Maßstab des Gerichts gedacht ist.
- source_word: κριθήσονται
  choice: werden gerichtet werden
  rationale: Die neutrale gerichtliche Bedeutung bleibt erhalten; eine Verurteilung wird nicht ausdrücklich in das Verb hineingelesen.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: alle, die ... und alle, die
  rationale: Die parallele Formulierung gibt die umfassende und verteilende Kraft beider Relativsätze klar wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Der begründende Anschluss an den vorherigen Gedankengang wird ausdrücklich beibehalten.
theological_decisions:
- issue: Bezug von νόμος
  choice: »das Gesetz« mit wahrscheinlichem Bezug auf das mosaische Gesetz
  alternative: Gesetz im allgemeinen moralischen Sinn
  rationale: Der Gegensatz zwischen Menschen ohne das Gesetz und Menschen unter dem Gesetz steht im Zusammenhang der jüdisch-nichtjüdischen Unterscheidung. Die Übersetzung erklärt dies jedoch nicht im Haupttext aus.
- issue: Bedeutung von ἀπολοῦνται im Blick auf das Endgericht
  choice: »werden zugrunde gehen« ohne nähere Bestimmung der Art des Verderbens
  alternative: »werden vernichtet werden« oder »werden verurteilt werden«
  rationale: Der Vers nennt den Ausgang, legt aber dessen genaue Beschaffenheit nicht fest. Die theologische Spannung bleibt daher erhalten.
- issue: Reichweite von κριθήσονται
  choice: »werden gerichtet werden«
  alternative: »werden verurteilt werden«
  rationale: κρίνω bezeichnet zunächst das gerichtliche Urteil beziehungsweise Verfahren. Eine ausdrückliche Vorwegnahme des negativen Urteils wäre stärker als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. »Zugrunde gehen« ist allgemein verständlich und weniger lehrhaft festlegend als »vernichtet werden«. Alle Fußnotenmarker stehen im Haupttext an den jeweils betroffenen Formulierungen.
