    issue: Die Formulierung „was äußerlich am Fleisch geschieht“ fasst die Beschneidung als bloßes Geschehen auf.
    rationale: Das Griechische ist elliptisch und stellt „Beschneidung“ als äußerlich-am-Fleisch bestimmte Größe der eigentlichen Beschneidung gegenüber. Die deutsche Formulierung sollte diese prädikative Gegenüberstellung bewahren, statt nur den körperlichen Vollzug zu beschreiben.
