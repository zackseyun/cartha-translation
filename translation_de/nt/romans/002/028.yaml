  source_fidelity: Die erste Satzhälfte gibt die antithetische Aussage sachgerecht wieder. In der zweiten Satzhälfte macht „was äußerlich am Fleisch geschieht“ die Beschneidung jedoch primär zu einem Vorgang und verschiebt damit die elliptische prädikative Aussage des Griechischen („äußerliche Beschneidung am Fleisch“ ist nicht die maßgebliche Beschneidung).
  naturalness: Die Vorlage ist verständlich und im würdigen Register gehalten. Die revidierte Fassung bewahrt die knappe Parallelstruktur und ist zugleich idiomatisch genug für modernes Standarddeutsch.
  terminology: „Jude“ ist im Kontext von Römer 2 die passende Wiedergabe von Ἰουδαῖος; „Beschneidung“ und „am Fleisch“ geben περιτομή beziehungsweise ἐν σαρκί präzise wieder. Die Fußnoten sind sachlich zutreffend; der Anker zu „äußerlich“ wird in beiden Vorkommen sinnvoll gesetzt.
  issues:
