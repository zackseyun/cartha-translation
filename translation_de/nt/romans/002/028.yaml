source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: de
  text: Denn nicht der ist Jude, der es äußerlich ist[a], und auch nicht ist die Beschneidung die, die äußerlich am Fleisch geschieht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im Sichtbaren«; gemeint ist das äußerlich Erkennbare.'
    reason: lexical_alternative
  - marker: b
    text: »Am Fleisch« bezeichnet hier die körperliche Beschneidung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Jude
  rationale: Im Zusammenhang des Römerbriefs geht es um jüdische Bundesidentität in Bezug auf Gesetz und Beschneidung, nicht vorrangig um die regionale Herkunft aus Judäa.
- source_word: ἐν τῷ φανερῷ
  choice: äußerlich
  rationale: Die Wendung bezeichnet das Sichtbare beziehungsweise äußerlich Erkennbare und bildet den Gegenpol zum Verborgenen im folgenden Vers.
- source_word: περιτομή
  choice: Beschneidung
  rationale: Dies ist die übliche und präzise deutsche Bezeichnung für das hier behandelte Bundeszeichen.
- source_word: ἐν σαρκί
  choice: am Fleisch
  rationale: σάρξ ist hier körperlich und konkret gemeint. »Am Fleisch« ist im Deutschen natürlich und bewahrt den ausdrücklichen Körperbezug.
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: und nicht das ist Beschneidung, was äußerlich am Fleisch geschieht
  rationale: Der griechische Satz ist elliptisch. Die deutsche Ergänzung macht die Prädikatsstruktur verständlich, ohne die Aussage auf eine bloße Beschreibung körperlicher Beschneidung zu reduzieren.
- source_word: γὰρ
  choice: Denn
  rationale: »Denn« bewahrt die begründende Verbindung zum vorausgehenden Gedankengang.
theological_decisions:
- issue: Äußere jüdische Identität und Beschneidung
  choice: Der Vers verneint, dass äußerlich erkennbare Zugehörigkeit beziehungsweise körperliche Beschneidung für sich allein das volle Wesen jüdischer Identität und der Beschneidung ausmachen.
  alternative: Paulus bestreitet jüdische Identität grundsätzlich oder ersetzt sie ohne Weiteres durch eine rein geistige Kategorie.
  rationale: Die Gegenüberstellung von äußerlich und innerlich wird erst in Vers 29 vervollständigt. Die Übersetzung wahrt diese Spannung und legt keine weitergehende theologische Auflösung in Vers 28 hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur wird bewahrt; die Ellipse des Griechischen wird für verständliches Deutsch behutsam ergänzt.
