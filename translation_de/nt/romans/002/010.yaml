  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: de
  text: Doch Herrlichkeit, Ehre und Frieden jedem, der das Gute[a] tut – zuerst dem Juden, ebenso dem Griechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was gut ist“.'
    reason: lexical_alternative
  - marker: b
    text: „Grieche“ bezeichnet hier wahrscheinlich allgemeiner einen Nichtjuden.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: Herrlichkeit
  rationale: Die übliche biblische Entsprechung bewahrt sowohl das Gewicht öffentlicher Anerkennung als auch den Zusammenhang endzeitlicher Vergeltung.
- source_word: τιμή
  choice: Ehre
  rationale: „Ehre“ gibt den Begriff im Zusammenhang der mit Herrlichkeit und Frieden verbundenen Belohnung natürlich und präzise wieder.
- source_word: εἰρήνη
  choice: Frieden
  rationale: „Frieden“ bewahrt die breite biblische Bedeutung, ohne sie vorschnell auf inneres Wohlergehen, gesellschaftliche Harmonie oder Heil einzuengen.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: für jeden, der … tut
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet jeden Menschen, dessen Handeln entsprechend geprägt ist; diese Formulierung ist modernes, verständliches Deutsch.
- source_word: τὸ ἀγαθόν
  choice: das Gute
  rationale: Der substantivierte Ausdruck bedeutet wörtlich „das Gute“ beziehungsweise „was gut ist“. „Das Gute tun“ ist im Deutschen natürlich und erhält die Form des griechischen Ausdrucks.
- source_word: Ἰουδαίῳ
  choice: für den Juden
  rationale: Der repräsentative Singular des griechischen Textes wird direkt bewahrt und ist im Gegensatzpaar „Jude und Grieche“ verständlich.
- source_word: πρῶτον
  choice: zuerst
  rationale: „Zuerst“ wahrt die knappe Reihenfolgeangabe, ohne deren heilsgeschichtliche Bedeutung näher auszulegen.
- source_word: Ἕλληνι
  choice: für den Griechen
  rationale: Die wörtliche Bezeichnung und das paulinische Gegensatzpaar bleiben im Haupttext erhalten; die wahrscheinlich weitere Bedeutung wird in einer Fußnote erläutert.
- source_word: δὲ … καὶ
  choice: doch … aber auch
  rationale: „Doch“ markiert den Gegensatz zur vorausgehenden Aussage über Zorn und Bedrängnis; „aber auch“ gibt die einschließende Weiterführung zum Griechen idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von Ἕλληνι im Gegensatz „Jude und Grieche“
  choice: Im Haupttext „der Grieche“, mit Erläuterung der weiteren Bedeutung in einer Fußnote.
  alternative: der Nichtjude
  rationale: Der griechische Wortlaut bezeichnet wörtlich einen Griechen, doch Paulus verwendet das Gegensatzpaar häufig umfassender für Juden und Nichtjuden. Haupttext und Fußnote bewahren sowohl den Wortlaut als auch diese Bedeutungsweite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfragmentstruktur setzt wie der griechische Text den Gedanken des vorhergehenden Verses fort. Der Gedankenstrich gliedert die Empfängerangabe, ohne zusätzliche inhaltliche Beziehungen einzuführen.
