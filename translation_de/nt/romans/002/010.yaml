  source_fidelity: Der Entwurf gibt die drei Gaben, den charakterisierenden Partizipialsinn von ἐργαζομένῳ, das Objekt τὸ ἀγαθόν sowie die Reihenfolge „dem Juden zuerst, auch dem Griechen“ sachlich zutreffend wieder. Eine engere Dativparallelität bildet die Empfängerangaben des griechischen Satzes jedoch klarer ab.
  naturalness: Die Fassung ist grundsätzlich verständlich und würdevoll. „Jedem … zuerst dem Juden, ebenso dem Griechen“ ist im Deutschen flüssiger und syntaktisch klarer als die Wiederholung von „für“; außerdem sollte der als eigenständiger Vers gesetzte Satz mit „Doch“ groß beginnen.
  terminology: „Herrlichkeit, Ehre und Frieden“, „das Gute“, „Jude“ und „Grieche“ sind angemessene, quellentreue Begriffe. Die Erläuterung zu „Grieche“ wahrt sinnvoll die wahrscheinlich weitere Bedeutung im paulinischen Gegensatzpaar, ohne den Haupttext zu interpretierend umzudeuten.
