  text: ⸀διὸ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: de
  text: Darum wurde es ihm als Gerechtigkeit angerechnet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „gerechnet“; möglich ist ebenso: „gutgeschrieben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem zuvor Gesagten und stellt den logischen Zusammenhang in natürlichem Deutsch knapp her.
- source_word: ἐλογίσθη
  choice: wurde … angerechnet
  rationale: Die passive Form bewahrt sowohl die grammatische Gestalt als auch das in Römer 4 wichtige Bild des Anrechnens; „angerechnet“ ist im heutigen Deutsch natürlicher als „zugerechnet“ oder „gerechnet“.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet Abraham als die Person, der etwas angerechnet wurde.
- source_word: εἰς
  choice: als
  rationale: In der Wendung λογίζομαι … εἰς δικαιοσύνην gibt „als“ die Einstufung beziehungsweise Geltung idiomatisch wieder, ohne die Aussage auszudeuten.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die sachlich und traditionsgeschichtlich angemessene deutsche Wiedergabe des paulinischen Begriffs und bewahrt dessen mögliche forensische und ethische Dimensionen.
theological_decisions:
- issue: Paulus’ Anrechnungs- beziehungsweise Rechnungsbild ohne dogmatische Erweiterung wiedergeben
  choice: wurde es ihm als Gerechtigkeit angerechnet
  alternative: wurde es ihm zur Gerechtigkeit gerechnet
  rationale: Die gewählte Formulierung erhält das passive Rechnungsbild und lässt offen, wie das Verhältnis zwischen Glaube und Gerechtigkeit dogmatisch genauer zu bestimmen ist. Das im Deutschen nötige „es“ nimmt den vorausgehenden Glauben auf, ohne ihn im Vers ausdrücklich zu wiederholen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Folgerungsstruktur des griechischen Satzes bleibt erhalten; die Fußnote dokumentiert die wichtigsten deutschen Möglichkeiten für λογίζομαι.
