  source_fidelity: Die Übersetzung gibt διό als folgerndes „Darum“ wieder und bewahrt mit „wurde … angerechnet“ die passive Rechnungsmetapher von ἐλογίσθη. Das im Deutschen erforderliche „es“ bezieht sich verständlich auf den unmittelbar vorausgehenden Glauben Abrahams und fügt keine sachliche Deutung hinzu. „Ihm als Gerechtigkeit“ entspricht der Konstruktion αὐτῷ εἰς δικαιοσύνην angemessen.
  naturalness: „Darum wurde es ihm als Gerechtigkeit angerechnet“ ist klares, modernes Standarddeutsch mit einem dem paulinischen Register angemessen würdigen Ton. Die Satzstellung ist idiomatisch und knapp.
  terminology: „Gerechtigkeit“ ist für δικαιοσύνη im paulinischen Kontext die etablierte und sachlich offene deutsche Entsprechung. „Angerechnet“ erhält das zentrale Rechnungsbild ohne dogmatische Ausgestaltung. Die Fußnote bietet mit „gerechnet“ und „gutgeschrieben“ vertretbare lexikalische Alternativen.
