review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzglieder, die an Abraham anschließende Ausweitung („sondern auch“) sowie die Auferweckungsaussage zuverlässig wieder. Das ungenannte Objekt von λογίζεσθαι wird mit „es“ angemessen als Ellipse bewahrt. Allerdings kann „angerechnet werden soll“ im modernen Deutsch eine normative oder unsichere Modalität ausdrücken, während μέλλει hier die Zukunftsorientierung der Anrechnung bezeichnet.
  naturalness: Die Formulierung ist insgesamt gut verständlich und im würdevollen modernen Standarddeutsch gehalten. „Künftig angerechnet wird“ vermeidet die im Deutschen doppeldeutige Modalform „soll“, ohne die zukunftsbezogene Aussage aufzugeben. Der Gedankenstrich kennzeichnet die erläuternde Wiederaufnahme „uns“ klarer als der Doppelpunkt.
  terminology: „angerechnet“ bewahrt die Rechnungsmetapher von λογίζεσθαι. „an den glauben“, „Herrn“ und „von den Toten auferweckt“ sind idiomatisch, quellentreu und im kirchlich-literarischen Register etabliert. Die Fußnote zur Alternative „auf den vertrauen“ muss unmittelbar bei „glauben“ verankert werden.
  issues:
  - severity: medium
    issue: „soll“ für μέλλει
    rationale: Die deutsche Modalform kann einen Sollensanspruch oder eine bloß berichtete Behauptung nahelegen. Die griechische Konstruktion μέλλει λογίζεσθαι ist hier zukunftsorientiert; „künftig … wird“ gibt dies ohne zusätzliche Modalnuance wieder.
  - severity: low
    issue: Position des Fußnotenankers zur Glaubenswendung
    rationale: 'Die Fußnote „Oder: ‚auf den vertrauen‘“ erläutert πιστεύουσιν ἐπί und sollte daher bei „glauben“ statt erst nach dem Satzschluss stehen.'
