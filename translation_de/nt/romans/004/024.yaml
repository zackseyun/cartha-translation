id: ROM.4.24
reference: Romans 4:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: de
  text: sondern auch unseretwegen[a], denen es künftig angerechnet wird – uns, die wir an den glauben[b], der Jesus, unseren Herrn, von den Toten auferweckt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um unseretwillen“ oder „wegen uns“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf den vertrauen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: sondern auch
  rationale: 'Bewahrt die adversativ-additive Verbindung zum vorangehenden Vers: Es wurde nicht nur Abrahams wegen geschrieben, sondern auch unseretwegen.'
- source_word: δι’ ἡμᾶς
  choice: unseretwegen
  rationale: διά mit Akkusativ bezeichnet hier den Bezug beziehungsweise die Personen, um derentwillen die Aussage geschrieben wurde.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: denen es angerechnet werden soll
  rationale: Das unpersönliche „es“ wahrt das im Griechischen nur aus dem Kontext erschließbare Objekt; „angerechnet“ erhält die in Römer 4 prägende Rechnungsmetapher. „soll“ gibt die zukunftsgerichtete Bedeutung von μέλλει wieder, ohne eine unmittelbar bevorstehende Handlung zu erzwingen.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: uns, die wir an den glauben
  rationale: Die substantivierte Partizipialkonstruktion benennt die Empfänger näher. „an jemanden glauben“ ist im Deutschen die natürliche Wiedergabe des auf eine Person gerichteten Vertrauens.
- source_word: τὸν ἐγείραντα
  choice: der … auferweckt hat
  rationale: Gibt das substantivierte Partizip als Relativsatz wieder und bezeichnet Gott durch sein Handeln.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jesus, unseren Herrn
  rationale: Bewahrt sowohl den Personennamen als auch den Titel κύριος und die Zugehörigkeitsangabe.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die geläufige und genaue deutsche Formulierung für die Auferweckung aus dem Bereich der Toten.
theological_decisions:
- issue: Das unausgesprochene Objekt von λογίζεσθαι
  choice: Das Pronomen „es“ wird ergänzt.
  alternative: „Gerechtigkeit“ ausdrücklich als Objekt einsetzen.
  rationale: Der griechische Text übernimmt das Objekt sinngemäß aus dem vorherigen Zusammenhang. „Es“ ergibt einen vollständigen deutschen Satz, ohne die Ellipse stärker als nötig auszulegen.
- issue: Bedeutungsumfang von πιστεύειν ἐπί
  choice: „an den glauben“ im Haupttext
  alternative: „auf den vertrauen“
  rationale: Beides liegt im Bedeutungsbereich der Wendung. Der Haupttext verwendet die geläufige biblische Formulierung; die vertrauensbezogene Nuance wird in einer Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die erklärende Wiederaufnahme von „uns“ durch τοῖς πιστεύουσιν sichtbar. Die Satzstellung bleibt trotz der Nähe zur griechischen Struktur gut verständlich.
