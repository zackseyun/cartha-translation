  source_fidelity: Die Übersetzung gibt die elliptische Fortsetzung mit »und« angemessen wieder. »Vater der Beschnittenen« trifft πατέρα περιτομῆς im Kontext, und die Einschränkung auf diejenigen, die nicht allein beschnitten sind, sondern dem Glaubensvorbild Abrahams folgen, wird erhalten. »als er noch unbeschnitten war« gibt ἐν ἀκροβυστίᾳ idiomatisch und sachgerecht wieder.
  naturalness: Modernes, verständliches Standarddeutsch. Die Verbindung mittels Gedankenstrich und »und zwar« macht die im Griechischen dichte Apposition gut lesbar, ohne den Gedankengang inhaltlich zu erweitern. »Den Spuren des Glaubens folgen« ist eine natürliche Bewahrung des Bildes von den Fußspuren.
  terminology: »Beschneidung/Beschnittene«, »Glaube« und »unbeschnitten« sind konsistent und registergerecht. Die Fußnote bewahrt die formnähere Alternative zu πατέρα περιτομῆς und ist korrekt verankert.
