id: ROM.4.12
reference: Romans 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: de
  text: und Vater der Beschnittenen[a] – und zwar derer, die nicht nur beschnitten sind, sondern auch den Spuren des Glaubens folgen, den unser Vater Abraham hatte, als er noch unbeschnitten war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Vater der Beschneidung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: Vater der Beschnittenen
  rationale: Die griechische Wendung lautet formal »Vater der Beschneidung«, bezeichnet im Zusammenhang aber Abraham als Vater der beschnittenen Menschen. Die gewählte Form ist im Deutschen natürlich; die formale Alternative wird in einer Fußnote bewahrt.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: die nicht nur beschnitten sind
  rationale: Die idiomatische Wiedergabe macht deutlich, dass die bloße Zugehörigkeit zur Beschneidung nicht genügt, ohne den Satz auszudeuten.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: den Spuren … folgen
  rationale: στοιχεῖν bezeichnet ein Gehen in geordneter Übereinstimmung, während ἴχνη die Bildsprache von Fußspuren trägt. »Den Spuren folgen« bewahrt das Bild in natürlichem Deutsch.
- source_word: πίστεως
  choice: Glaubens
  rationale: Im Zusammenhang von Römer 4 bezeichnet πίστις Abrahams glaubende Antwort beziehungsweise sein Vertrauen auf Gott; »Glaube« wahrt den zentralen Begriff der Argumentation.
- source_word: ἐν ἀκροβυστίᾳ
  choice: als er noch unbeschnitten war
  rationale: 'Die Zustandsangabe wird idiomatisch und zeitlich wiedergegeben: Abraham glaubte vor seiner Beschneidung.'
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: den unser Vater Abraham hatte
  rationale: Die Genitivverbindung wird für verständliches Deutsch entfaltet, während die gemeinschaftliche Bezeichnung »unser Vater Abraham« erhalten bleibt.
theological_decisions:
- issue: Bezieht sich Abrahams Vaterschaft auf alle Beschnittenen oder auf die Beschnittenen, die zugleich seinem Glauben folgen?
  choice: Die Vaterschaft wird hier auf diejenigen Beschnittenen bezogen, die nicht nur beschnitten sind, sondern auch Abrahams Glaubensweg folgen.
  alternative: Abraham ist ohne weitere Einschränkung Vater aller Beschnittenen.
  rationale: Die Konstruktion οὐκ … μόνον ἀλλὰ καὶ samt τοῖς στοιχοῦσιν qualifiziert die betreffende Gruppe. Die Übersetzung erhält diese Einschränkung, ohne sie zusätzlich theologisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich mit »und zwar« klärt die syntaktisch dichte Einschränkung des griechischen Satzes. Die Bildsprache der Spuren bleibt erhalten.
