id: ROM.4.15
reference: Romans 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: de
  text: Denn das Gesetz bewirkt Zorn[a]; wo es aber kein Gesetz gibt, gibt es auch keine Übertretung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sein kann besonders Gottes gerichtlicher Zorn; im griechischen Text steht nur „Zorn“.
    reason: theological_ambiguity
lexical_decisions:
- source_word: νόμος
  choice: das Gesetz / Gesetz
  rationale: Der bestimmte Artikel ist im Deutschen idiomatisch erforderlich. Die Wiedergabe lässt offen, ob Paulus hier allgemein vom Gesetz als Prinzip oder mit besonderem Bezug auf das mosaische Gesetz spricht.
- source_word: ὀργή
  choice: Zorn
  rationale: „Zorn“ bewahrt das gewichtige gerichtliche und theologische Bedeutungsspektrum des paulinischen Begriffs besser als das schwächere „Ärger“.
- source_word: κατεργάζεται
  choice: bewirkt
  rationale: „Bewirkt“ gibt die hervorbringende, kausative Aussage knapp und in natürlichem modernem Deutsch wieder.
- source_word: οὗ δὲ
  choice: wo es aber
  rationale: „Wo“ bildet die relative Ortskonstruktion ab; „aber“ wahrt den leichten Gegensatz des δέ.
- source_word: παράβασις
  choice: Übertretung
  rationale: „Übertretung“ bezeichnet das Überschreiten beziehungsweise Verletzen einer gesetzten Grenze und passt daher genau zum Zusammenhang mit dem Gesetz.
theological_decisions:
- issue: Bedeutungsumfang von νόμος in Paulus’ Argumentation
  choice: das Gesetz / Gesetz ohne einschränkenden Zusatz
  alternative: das mosaische Gesetz
  rationale: Der griechische Wortlaut benennt das Gesetz, legt an dieser Stelle aber nicht ausdrücklich fest, dass ausschließlich das mosaische Gesetz gemeint ist. Die Übersetzung bewahrt diese Spannung und vermeidet eine vorschnelle Eingrenzung.
- issue: Bezug von ὀργή
  choice: Zorn ohne ausdrückliche Ergänzung eines Besitzers
  alternative: Gottes Zorn
  rationale: Im Kontext kann Gottes gerichtlicher Zorn gemeint sein, doch der griechische Text nennt Gott in diesem Satz nicht ausdrücklich. Daher wird die theologische Zuordnung nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und argumentativ. „Übertretung“ ist bewusst etwas gehobener, aber allgemein verständlich und lexikalisch präziser als „Verstoß“.
