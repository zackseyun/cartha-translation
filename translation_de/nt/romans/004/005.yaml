id: ROM.4.5
reference: Romans 4:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: de
  text: Wer dagegen nicht arbeitet[a], sondern an den glaubt[b], der den Gottlosen rechtfertigt[c], dessen Glaube wird als Gerechtigkeit angerechnet[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine Werke tut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vertraut“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für gerecht erklärt“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „zugerechnet“ beziehungsweise „gerechnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: dem ..., der nicht arbeitet
  rationale: Die substantivierte Partizipialkonstruktion wird natürlich wiedergegeben und der Gegensatz zum Glauben bewahrt. „Arbeitet“ bleibt bewusst knapp und ergänzt nicht ausdrücklich „für seine Rechtfertigung“, was im Griechischen nicht dasteht.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: sondern an den glaubt
  rationale: „An jemanden glauben“ ist im Deutschen die natürliche Wiedergabe der Konstruktion mit ἐπί und lässt den darin enthaltenen Vertrauensaspekt bestehen.
- source_word: τὸν δικαιοῦντα
  choice: der ... rechtfertigt
  rationale: „Rechtfertigen“ bewahrt den paulinischen Schlüsselbegriff und seine Verbindung zu δικαιοσύνη, ohne die theologische Tragweite durch eine Paraphrase festzulegen.
- source_word: τὸν ἀσεβῆ
  choice: den Gottlosen
  rationale: „Gottlos“ gibt die fehlende Ehrfurcht beziehungsweise rechte Beziehung zu Gott prägnant wieder; „böse“ würde den Ausdruck stärker auf allgemeine moralische Bosheit verengen.
- source_word: λογίζεται
  choice: wird ... angerechnet
  rationale: „Anrechnen“ ist verständliches modernes Deutsch und bewahrt den rechnenden beziehungsweise zurechnenden Sinn des Verbs in diesem Zusammenhang.
- source_word: ἡ πίστις αὐτοῦ
  choice: sein Glaube
  rationale: Der unmittelbare Zusammenhang mit πιστεύοντι spricht für „Glaube“ und gegen „Treue“; zugleich bleibt die Wortverbindung von glauben und Glaube erhalten.
- source_word: εἰς δικαιοσύνην
  choice: als Gerechtigkeit
  rationale: Bei λογίζομαι bezeichnet εἰς hier, als was etwas angerechnet wird. „Als Gerechtigkeit“ ist im Deutschen klar und formal nah am griechischen Ausdruck.
theological_decisions:
- issue: Bedeutung von δικαιόω im paulinischen Argument
  choice: rechtfertigt
  alternative: für gerecht erklärt
  rationale: „Rechtfertigt“ bewahrt den etablierten theologischen Schlüsselbegriff, ohne allein eine deklarative oder eine transformative Deutung festzuschreiben; die mögliche forensische Explikation wird in der Fußnote genannt.
- issue: Verhältnis von Werken und Glauben
  choice: nicht arbeitet, sondern ... glaubt
  alternative: keine Werke tut, sondern ... vertraut
  rationale: Die Übersetzung hält den scharfen griechischen Gegensatz fest, ergänzt aber weder ein Objekt zu „arbeitet“ noch eine ausdrückliche Einschränkung wie „um sich die Rechtfertigung zu verdienen“.
- issue: Sinn von πίστις/πιστεύω
  choice: glaubt / Glaube
  alternative: vertraut / Vertrauen
  rationale: Die einheitliche Wiedergabe mit der deutschen Glaubenswortgruppe wahrt den paulinischen Leitbegriff; der Vertrauensaspekt wird als echte lexikalische Alternative angegeben.
- issue: Anrechnung der πίστις εἰς δικαιοσύνην
  choice: sein Glaube wird als Gerechtigkeit angerechnet
  alternative: sein Glaube wird zur Gerechtigkeit gerechnet
  rationale: Die Formulierung erhält die Aussage und ihre theologische Spannung, ohne näher zu bestimmen, auf welche Weise der Glaube und die Gerechtigkeit zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Gegensatz, wurde aber idiomatisch geglättet. Zentrale paulinische Begriffe wie „Glaube“, „rechtfertigen“ und „Gerechtigkeit“ bleiben erkennbar miteinander verbunden.
