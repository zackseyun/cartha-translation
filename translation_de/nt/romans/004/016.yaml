  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: de
  text: 'Darum geschieht es aus Glauben[b], damit es auf Gnade beruht und die Verheißung für alle Nachkommen[a] sicher ist: nicht nur für die aus dem Gesetz, sondern auch für die, die wie Abraham glauben[c], der unser aller Vater ist,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Samen“; hier kollektiv für Abrahams Nachkommen oder Nachkommenschaft.
    reason: lexical_alternative
  - marker: b
    text: „Glauben“ kann hier auch im Sinn von „Vertrauen“ verstanden werden; „Treue“ ist in diesem Zusammenhang weniger wahrscheinlich.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „für den, der aus dem Glauben Abrahams ist“. Die griechische Einzahl kann kollektiv gemeint sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Gedankengang knapp und natürlich wieder.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: Bewahrt die paulinische Herkunfts- bzw. Grundbeziehung der Präposition ἐκ und vermeidet eine unnötige Festlegung allein auf Mittel oder Ursache.
- source_word: ἵνα κατὰ χάριν
  choice: damit es auf Gnade beruht
  rationale: Gibt den Zweck ausdrücklich wieder und formuliert κατὰ χάριν in natürlichem Deutsch, ohne Gnade als menschliche Leistung erscheinen zu lassen.
- source_word: βεβαίαν
  choice: sicher
  rationale: Bezeichnet die Verlässlichkeit und Gewissheit der Verheißung in geläufigem modernem Deutsch.
- source_word: ἐπαγγελίαν
  choice: Verheißung
  rationale: Der etablierte und sachlich passende Ausdruck für Gottes zugesagte Verheißung in diesem Zusammenhang.
- source_word: σπέρματι
  choice: Nachkommen
  rationale: Das griechische Wort bedeutet wörtlich „Samen“, wird hier aber kollektiv für Abrahams Nachkommenschaft gebraucht.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: nicht nur für die aus dem Gesetz
  rationale: Behält die knappe Herkunftsformulierung des Griechischen bei; der deutsche Plural macht den kollektiven Bezug verständlich.
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: für die, die Abrahams Glauben teilen
  rationale: Löst die stark verdichtete griechische Wendung in verständlichem Deutsch auf, ohne den Glauben Abrahams inhaltlich näher zu bestimmen.
- source_word: πατὴρ πάντων ἡμῶν
  choice: unser aller Vater
  rationale: Eine natürliche und zugleich eng am griechischen Wortlaut bleibende Wiedergabe.
theological_decisions:
- issue: Bezug und Bedeutung der verkürzten Wendung ἐκ πίστεως
  choice: Darum geschieht es aus Glauben
  alternative: Darum kommt es auf den Glauben an
  rationale: Die gewählte Fassung bewahrt die grammatische Verkürzung und den Zusammenhang von Glauben und Gnade, ohne das im Griechischen unausgesprochene Subjekt ausdrücklich als Erbe, Rechtfertigung oder Verheißungsempfang festzulegen.
- issue: Deutung von τῷ ἐκ πίστεως Ἀβραάμ
  choice: die Abrahams Glauben teilen
  alternative: der aus dem Glauben Abrahams ist
  rationale: Die Hauptfassung gibt den kollektiven Personenbezug verständlich wieder. Die Fußnote bewahrt die formal singularische und stärker verdichtete Gestalt des Griechischen.
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Vertrauen
  rationale: „Glauben“ entspricht dem paulinischen Sprachgebrauch und lässt den Beziehungs- und Vertrauensaspekt offen; „Treue“ ist hier weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ellipse des griechischen Anfangs wird durch das neutrale „es“ bewahrt, statt ein theologisches Bezugswort einzusetzen. Der Schluss behält das Komma bei, weil der Satz im folgenden Vers weitergeführt wird.
