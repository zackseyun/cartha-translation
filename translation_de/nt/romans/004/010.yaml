  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: de
  text: Wie wurde es ihm also angerechnet?[a] Als er beschnitten war oder als er unbeschnitten war? Nicht als er beschnitten war, sondern als er unbeschnitten war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugerechnet“ oder „zugeschrieben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Wie
  rationale: Das übliche Frageadverb gibt die Frage nach den Umständen der Anrechnung klar und unmittelbar wieder.
- source_word: οὖν
  choice: also
  rationale: „Also“ bewahrt die folgernde beziehungsweise den Gedankengang wieder aufnehmende Funktion im Argument.
- source_word: ἐλογίσθη
  choice: wurde es ihm angerechnet
  rationale: Das Passiv von λογίζομαι bezeichnet hier, dass Abraham etwas zugerechnet wird. Das ergänzte „ihm“ macht den im Kontext eindeutigen Bezug im Deutschen natürlich verständlich; „angerechnet“ passt zum wiederkehrenden Sprachgebrauch in Römer 4, ohne die Bedeutung ausschließlich finanziell festzulegen.
- source_word: ἐν περιτομῇ ὄντι
  choice: als er beschnitten war
  rationale: Die griechische substantivische Wendung bezeichnet Abrahams Zustand und hat hier zeitlichen Sinn; die deutsche Formulierung ist idiomatisch und bewahrt diesen Bezug.
- source_word: ἐν ἀκροβυστίᾳ
  choice: als er unbeschnitten war
  rationale: Das Substantiv bezeichnet in diesem Zusammenhang den Zustand des Unbeschnittenseins. Die adjektivische Wiedergabe bildet den rhetorischen Gegensatz klar ab.
- source_word: οὐκ ... ἀλλ’
  choice: Nicht ... sondern ...
  rationale: Die geläufige deutsche Kontrastkonstruktion erhält die nachdrückliche Korrektur des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „als er … war“ erhält die rhetorische Parallelität und macht deutlich, dass nach Abrahams Zustand zum Zeitpunkt der Anrechnung gefragt wird.
