  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: de
  text: Es wurde aber nicht nur um seinetwillen geschrieben, dass es ihm angerechnet wurde,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugerechnet“ oder „gutgeschrieben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: wurde geschrieben
  rationale: Die Passivform gibt den ausdrücklichen Bezug auf den geschriebenen Schrifttext direkt und in natürlichem Deutsch wieder.
- source_word: δὲ
  choice: Doch
  rationale: δέ führt den Gedanken weiter und setzt ihn zugleich leicht vom zuvor Gesagten ab; „Doch“ bewahrt diese verbindende Kontrastnuance.
- source_word: δι’ αὐτὸν μόνον
  choice: nicht nur um seinetwillen
  rationale: Die Wendung bringt idiomatisch zum Ausdruck, dass die Aussage nicht allein mit Abraham im Blick niedergeschrieben wurde.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was geschrieben wurde.
- source_word: ἐλογίσθη
  choice: angerechnet wurde
  rationale: „Angerechnet“ wahrt den rechnenden beziehungsweise zurechnenden Sinn von λογίζομαι und ist im modernen Deutschen verständlich.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ wird passend zur deutschen Konstruktion mit „anrechnen“ unmittelbar wiedergegeben.
theological_decisions:
- issue: Wiedergabe von λογίζομαι im Zusammenhang von Paulus’ Rechtfertigungsargument
  choice: angerechnet wurde
  alternative: zugerechnet wurde; gerechnet wurde
  rationale: „Angerechnet“ erhält das Bild des Rechnens beziehungsweise Gutschreibens, ohne genauer festzulegen, auf welche dogmatische Weise diese Anrechnung zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung von „nicht nur“ vermeidet die mögliche Fehlbedeutung, lediglich der Schreibvorgang sei nicht ausschließlich um Abrahams willen erfolgt, und hält den Satz zugleich eng am griechischen Aufbau.
