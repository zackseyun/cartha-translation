  naturalness: Der Satz ist flüssiges modernes Standarddeutsch. „Gerecht gesprochen“ ist jedoch außerhalb eines engeren theologischen Kontexts weniger geläufig und kann im allgemeinen Sprachgebrauch auch den Beiklang von Freispruch bzw. Entlastung haben. „Gerechtfertigt“ ist hier die etablierte und präzisere paulinische Formulierung.
