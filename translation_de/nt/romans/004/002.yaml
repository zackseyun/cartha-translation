  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: de
  text: Denn wenn Abraham aufgrund von Werken gerechtfertigt wurde[a], hat er Grund, sich zu rühmen[b] – aber nicht vor Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für gerecht erklärt wurde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „hat er Ruhm“; auch: „hat er etwas, dessen er sich rühmen kann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: γάρ führt die Begründung des vorhergehenden Gedankens weiter, während εἰ die Bedingung einleitet.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Entspricht der eingebürgerten deutschen Namensform.
- source_word: ἐξ ἔργων
  choice: aufgrund von Werken
  rationale: Gibt ἐκ als Grundlage oder Ausgangspunkt der Rechtfertigung idiomatisch wieder, ohne die Art der Werke näher zu bestimmen.
- source_word: ἐδικαιώθη
  choice: gerecht gesprochen wurde
  rationale: Bewahrt den forensischen Bedeutungsaspekt des passiven δικαιόω und ist in modernem Deutsch verständlicher als das mögliche Fachwort „gerechtfertigt“.
- source_word: ἔχει καύχημα
  choice: hat er Grund, sich zu rühmen
  rationale: Gibt das Substantiv καύχημα natürlich als Anlass oder Grundlage des Rühmens wieder.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: aber nicht vor Gott
  rationale: „Vor Gott“ ist eine knappe, natürliche Wiedergabe, die den Bezug auf Gottes Urteil offenhält.
theological_decisions:
- issue: Ob die Bedingung als real, irreal oder nur hypothetisch zu kennzeichnen ist
  choice: Die Bedingung wird direkt mit „wenn ... wurde“ wiedergegeben.
  alternative: „wenn Abraham aufgrund von Werken gerecht gesprochen worden wäre“
  rationale: Der griechische Bedingungssatz kennzeichnet die Annahme hier nicht ausdrücklich als irreal. Die Übersetzung soll Paulus’ argumentative Voraussetzung stehen lassen, statt das spätere Ergebnis vorwegzunehmen.
- issue: Bedeutung von δικαιόω
  choice: „gerecht sprechen“
  alternative: „rechtfertigen“ oder „für gerecht erklären“
  rationale: „Gerecht sprechen“ wahrt den gerichtlichen beziehungsweise deklarativen Sinn, ohne die paulinische theologische Spannung auf eine umfassendere Veränderungsbedeutung festzulegen.
- issue: Bezug von „aber nicht vor Gott“
  choice: Die knappe Gegenüberstellung bleibt erhalten.
  alternative: „aber nicht in Gottes Augen“ oder eine Ergänzung wie „kann er sich nicht vor Gott rühmen“
  rationale: Der elliptische griechische Wortlaut lässt offen, wie genau die Einschränkung auf den vorangehenden Satzteil zurückbezogen wird; eine erklärende Ergänzung würde diese Mehrdeutigkeit vermindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt argumentativ knapp; „aufgrund von Werken“ ist präzise und allgemein verständlich. Gedankenstrich und Fußnoten dienen der Lesbarkeit, ohne die Ellipse des Schlusses aufzulösen.
