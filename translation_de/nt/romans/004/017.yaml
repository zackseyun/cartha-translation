id: ROM.4.17
reference: Romans 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: de
  text: 'wie geschrieben steht: »Ich habe dich zum Vater vieler Völker[a] gemacht« – vor dem Gott, dem er glaubte, der die Toten lebendig macht und das, was nicht ist, ruft, als wäre es da.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Völker« kann auch mit »Heiden« wiedergegeben werden; im Genesis-Zitat ist jedoch wahrscheinlich der umfassendere Sinn gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder, stärker deutend: »der das, was nicht existiert, ins Dasein ruft«.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: 'Die geläufige Schriftzitat-Formel gibt den perfektischen Sinn wieder: Es wurde geschrieben und steht weiterhin geschrieben.'
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: zum Vater vieler Völker
  rationale: Im Zusammenhang des Genesis-Zitats bezeichnet ἐθνῶν allgemein Völker; die Konstruktion mit »zum Vater« ist im Deutschen natürlich und entspricht dem prädikativen Sinn.
- source_word: τέθεικά σε
  choice: Ich habe dich … gemacht
  rationale: Das deutsche Perfekt bewahrt sowohl die vollzogene Einsetzung als auch ihre fortdauernde Gültigkeit.
- source_word: κατέναντι
  choice: vor Gott
  rationale: Die knappe räumlich-relationale Wendung entspricht dem Griechischen und ist im Deutschen verständlich, ohne den Bezug näher auszudeuten.
- source_word: οὗ ἐπίστευσεν
  choice: dem er glaubte
  rationale: Das Verb mit Dativ gibt Abrahams auf Gott gerichtetes Vertrauen natürlich wieder; das Präteritum entspricht dem erzählenden Rückblick.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: der die Toten lebendig macht
  rationale: Die Formulierung ist klar und textnah und beschreibt Gott als den, der den Toten Leben gibt.
- source_word: καλοῦντος
  choice: ruft
  rationale: Die Grundbedeutung bleibt erhalten; eine ausdrückliche Ergänzung wie »ins Dasein« würde die verdichtete Aussage bereits interpretierend festlegen.
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: das, was nicht ist, … als wäre es da
  rationale: Diese verständliche deutsche Form bewahrt die Spannung der griechischen Wendung, ohne sie im Haupttext ausdrücklich als Erschaffung aus dem Nichts zu deuten.
theological_decisions:
- issue: Ob der Schlusssatz ausdrücklich als Aussage über das Hervorrufen ins Dasein wiederzugeben ist
  choice: der … das, was nicht ist, ruft, als wäre es da
  alternative: der das, was nicht existiert, ins Dasein ruft
  rationale: Der griechische Wortlaut kann Gottes schöpferische Macht einschließen, formuliert dies aber verdichtet. Der Haupttext wahrt diese Offenheit; die deutlichere Auslegung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Schriftzitat ist klar markiert; der anschließende Gedankenstrich bewahrt den dichten Anschluss des griechischen Satzes. Die schwer deutbare Schlusswendung bleibt im Haupttext bewusst textnah.
