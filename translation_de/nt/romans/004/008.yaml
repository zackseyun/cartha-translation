id: ROM.4.8
reference: Romans 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: de
  text: Glücklich ist der Mensch, dem der Herr Sünde niemals anrechnen wird.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Glücklich ist der Mann“; „Mann“ ist hier repräsentativ gemeint und nicht auf männliche Personen beschränkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem der Herr ganz gewiss keine Sünde anrechnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Glücklich
  rationale: Gibt die biblische Seligpreisung in verständlichem, modernem Deutsch wieder, ohne sie auf ein bloß subjektives Glücksgefühl zu beschränken.
- source_word: ἀνήρ
  choice: Mensch
  rationale: Der Singular bleibt erhalten; „Mensch“ bringt hier den repräsentativen, nicht auf Männer beschränkten Sinn natürlich zum Ausdruck. Die wörtlichere Alternative „Mann“ steht in der Fußnote.
- source_word: οὗ
  choice: dem
  rationale: Der griechische Genitiv des Relativpronomens wird passend zur deutschen Verbindung „jemandem etwas anrechnen“ als Dativ wiedergegeben.
- source_word: οὐ μὴ
  choice: niemals
  rationale: Die verstärkte griechische Verneinung wird mit dem nachdrücklichen und zugleich natürlichen „niemals“ wiedergegeben.
- source_word: λογίσηται
  choice: anrechnen wird
  rationale: „Anrechnen“ bewahrt das für Römer 4 wichtige Bild einer rechnerischen Zurechnung und gibt zusammen mit „wird“ die zukunftsbezogene Kraft der Konstruktion wieder.
- source_word: κύριος
  choice: Herr
  rationale: Entspricht der üblichen Wiedergabe von κύριος und passt zum Kontext des Schriftzitats.
- source_word: ἁμαρτίαν
  choice: Sünde
  rationale: Der griechische Singular wird als kategorischer Begriff ohne unbestimmten Artikel beibehalten.
theological_decisions:
- issue: Repräsentative maskuline Ausdrucksweise
  choice: Im Haupttext steht „Mensch“.
  alternative: „Mann“
  rationale: ἀνήρ ist grammatisch maskulin, bezeichnet in diesem Schriftwort aber repräsentativ den Menschen und ist nicht auf männliche Personen begrenzt. „Mensch“ wahrt im Deutschen den Singular und den umfassenden Sinn; die formnähere Wiedergabe wird in der Fußnote genannt.
- issue: Nachdruck der Verneinung
  choice: „niemals anrechnen wird“
  alternative: „ganz gewiss nicht anrechnet“
  rationale: οὐ μή mit dem Konjunktiv drückt eine besonders starke Verneinung aus. „Niemals“ erhält sowohl den Nachdruck als auch die zukunftsbezogene Aussage, ohne eine technische dogmatische Formulierung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glücklich“ vermeidet das heute leicht altertümlich oder jenseitig verstandene „selig“, behält aber den Charakter einer biblischen Seligpreisung. Die Wortstellung ist klar und natürlich; „Sünde anrechnen“ wahrt zugleich das Leitmotiv des Zusammenhangs.
