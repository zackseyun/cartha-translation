  naturalness: Die Satzfügung ist im modernen Standarddeutschen verständlich. Gedankenstriche grenzen die Apposition klarer ab als die bisherigen Kommas und verhindern, dass „dem Fleisch nach“ im Haupttext versehentlich an „gefunden hat“ angeschlossen wird. „Was sollen wir nun dazu sagen“ ist eine natürliche rhetorische Überleitung.
