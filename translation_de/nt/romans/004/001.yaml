  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: de
  text: Was sollen wir nun dazu sagen, was Abraham – unser Stammvater dem Fleisch nach – gefunden hat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was hat Abraham dem Fleisch nach gefunden?“ Dann bezieht sich „dem Fleisch nach“ auf „gefunden“ und kann „auf menschliche Weise“ oder „aus rein menschlicher Sicht“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Was sollen wir nun sagen
  rationale: Bewahrt den rhetorischen Übergang und den abwägenden, auf die folgende Argumentation gerichteten Charakter der Frage in natürlichem modernem Deutsch.
- source_word: εὑρηκέναι
  choice: erlangt hat
  rationale: Das Perfekt wird als gegenwärtig relevantes Ergebnis wiedergegeben. „Erlangt“ passt im Deutschen besser als das hier missverständliche wörtliche „gefunden“, ohne bereits festzulegen, worin Abrahams Ergebnis bestand.
- source_word: προπάτορα
  choice: Stammvater
  rationale: Bezeichnet Abraham als männlichen Ahnherrn und entspricht seiner patriarchalen Rolle im Zusammenhang genauer als das allgemeinere „Vorfahr“.
- source_word: ἡμῶν
  choice: unser
  rationale: Die ausdrückliche gemeinsame Zuordnung Abrahams zu Paulus und seinen angesprochenen Lesern bleibt erhalten.
- source_word: κατὰ σάρκα
  choice: dem Fleisch nach
  rationale: Die traditionelle, im Deutschen verständliche paulinische Wendung bewahrt die Bildsprache und die mögliche syntaktische Mehrdeutigkeit. Im primären Satzverständnis bezeichnet sie die leibliche Abstammung.
theological_decisions:
- issue: Bezug von κατὰ σάρκα
  choice: Die Wendung wird im Haupttext unmittelbar an „unser Stammvater“ angeschlossen und bezeichnet so Abraham als leiblichen Ahnherrn.
  alternative: 'Die Wendung kann auf „erlangt hat“ bezogen werden: Was hat Abraham dem Fleisch nach, also auf menschliche Weise oder aus rein menschlicher Sicht, erlangt?'
  rationale: Die Stellung bei der Apposition zu Abraham unterstützt den Bezug auf die Abstammung; zugleich lässt die griechische Syntax den Bezug auf das Erlangen zu. Diese echte Auslegungsfrage wird daher in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dem Fleisch nach“ erhält bewusst die paulinische Ausdrucksweise; „Stammvater“ macht den im Kontext primär gemeinten Abstammungsbezug klar, während die Fußnote die echte syntaktische Alternative dokumentiert.
