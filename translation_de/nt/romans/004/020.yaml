id: ROM.4.20
reference: Romans 4:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: de
  text: Doch angesichts der Verheißung Gottes schwankte er nicht im Unglauben[a], sondern wurde im Glauben gestärkt[b] und gab Gott die Ehre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zweifelte er nicht aus Unglauben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurde durch den Glauben gestärkt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Doch angesichts der Verheißung Gottes
  rationale: εἰς mit Akkusativ bezeichnet hier den Bezug; „angesichts“ gibt diesen Sinn natürlich wieder. δέ markiert den milden Kontrast zum vorherigen Zusammenhang.
- source_word: οὐ διεκρίθη
  choice: schwankte er nicht
  rationale: διακρίνω bezeichnet hier inneres Schwanken oder Zögern, nicht bloß eine verstandesmäßige Frage.
- source_word: τῇ ἀπιστίᾳ
  choice: im Unglauben
  rationale: Der Dativ kann den Bereich oder die begleitende Haltung bezeichnen und steht in deutlicher Entsprechung zu „im Glauben“.
- source_word: ἐνεδυναμώθη
  choice: wurde … gestärkt
  rationale: Die passive Form bleibt erhalten, ohne ausdrücklich festzulegen, wer oder was die Stärkung bewirkte.
- source_word: τῇ πίστει
  choice: im Glauben
  rationale: Diese Wiedergabe bewahrt die parallele Gegenüberstellung von Unglauben und Glauben; instrumentales „durch den Glauben“ bleibt möglich.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: und gab Gott die Ehre
  rationale: Die deutsche finite Koordination gibt das begleitende Partizip natürlich und würdig wieder, ohne eine zusätzliche zeitliche oder ursächliche Beziehung einzutragen.
theological_decisions:
- issue: Ob Abrahams Reaktion als bloßer Zweifel oder als umfassenderes Schwanken wiederzugeben ist
  choice: schwankte er nicht im Unglauben
  alternative: zweifelte er nicht aus Unglauben
  rationale: „Schwanken“ entspricht dem Kontext und dem Gegensatz zur Stärkung im Glauben besser, ohne die Aussage auf einen rein intellektuellen Zweifel zu verengen.
- issue: Ob der Glaube als Bereich oder Mittel der Stärkung bezeichnet wird
  choice: wurde im Glauben gestärkt
  alternative: wurde durch den Glauben gestärkt
  rationale: Der griechische Dativ erlaubt beide Beziehungen. Der Haupttext bewahrt die Parallelität zu „im Unglauben“; die instrumentale Deutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Bibelstil. „Verheißung“ bewahrt den paulinischen und heilsgeschichtlichen Klang; „gab Gott die Ehre“ ist idiomatischer als eine deutsche Partizipialkonstruktion.
