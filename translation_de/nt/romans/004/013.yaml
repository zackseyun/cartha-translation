reference: Romans 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: de
  text: Denn nicht durch das Gesetz wurde Abraham oder seiner Nachkommenschaft[a] die Verheißung zuteil, dass er Erbe der Welt sein solle, sondern durch die Gerechtigkeit des Glaubens[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Samen«. Das griechische Wort steht im Singular, kann aber kollektiv »Nachkommenschaft« oder »Nachkommen« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »durch Gerechtigkeit aus Glauben« oder »durch Gerechtigkeit, die durch Glauben kommt«.'
    reason: alternative_reading
  - marker: c
    text: Das griechische Wort für »Gerechtigkeit« kann je nach Zusammenhang auch gerechtes Handeln oder Rechtschaffenheit bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: Das griechische Wort für »Glauben« kann je nach Zusammenhang auch »Vertrauen« oder »Treue« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: Verheißung
  rationale: Das Wort bezeichnet hier Gottes Zusage. »Verheißung« ist im paulinischen Zusammenhang präzise und im modernen Standarddeutsch geläufig.
- source_word: σπέρματι
  choice: Nachkommenschaft
  rationale: Das griechische Substantiv steht im Singular, kann aber kollektiv gebraucht werden. »Nachkommenschaft« bewahrt sowohl die singularische Form als auch den kollektiven Sinn.
- source_word: κληρονόμον ... κόσμου
  choice: Erbe der Welt
  rationale: Die Formulierung erhält sowohl das Erbmotiv als auch die umfassende Bedeutung von κόσμος, ohne den Bezug einzuengen.
- source_word: διὰ νόμου
  choice: durch das Gesetz
  rationale: Obwohl νόμου ohne Artikel steht, legt der paulinische Gedankengang den Bezug auf das Gesetz, insbesondere das mosaische Gesetz, nahe. Die Formulierung bleibt zugleich eng am griechischen Ausdruck.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« gibt den breiten paulinischen Bedeutungsgehalt wieder und lässt sowohl den forensischen als auch den auf rechtes Verhältnis und Handeln bezogenen Aspekt offen.
- source_word: πίστεως
  choice: Glaubens
  rationale: »Glaube« ist hier die naheliegende Wiedergabe im Gegensatz zum Gesetz. Die möglichen Nuancen »Vertrauen« und »Treue« werden in einer Fußnote offengehalten.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: durch die Gerechtigkeit des Glaubens
  rationale: Die kompakte Genitivverbindung des Griechischen bleibt erhalten, ohne ihr Verhältnis eindeutig als Ursprung, Mittel oder Grundlage festzulegen.
theological_decisions:
- issue: Verhältnis in δικαιοσύνης πίστεως
  choice: Gerechtigkeit des Glaubens
  alternative: Gerechtigkeit aus Glauben; Gerechtigkeit durch Glauben
  rationale: Paulus stellt Gesetz und Glauben einander gegenüber, doch die knappe Genitivkonstruktion bestimmt das genaue Verhältnis nicht ausdrücklich. Die gewählte Form bewahrt diese theologische Spannung.
- issue: Bezug von αὐτόν in »er werde Erbe der Welt«
  choice: Das Personalpronomen »er« bleibt stehen.
  alternative: Abraham werde Erbe der Welt; die Nachkommenschaft werde Erbe der Welt
  rationale: Die griechische Formulierung nennt im Inhalt der Verheißung ein maskulines Singularpronomen. Die deutsche Wiedergabe vermeidet es, dessen Bezug über den Wortlaut hinaus ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestalt folgt der argumentativen Dichte des griechischen Textes, bleibt aber durch die finite Form »kam« gut verständlich. »Nachkommenschaft« und »Gerechtigkeit des Glaubens« bewahren bewusst die formale und theologische Offenheit des Ausgangstextes.
