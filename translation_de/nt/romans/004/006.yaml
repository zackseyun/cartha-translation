id: ROM.4.6
reference: Romans 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: de
  text: So preist auch David den Menschen selig, dem Gott Gerechtigkeit ohne Werke anrechnet:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurechnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: So
  rationale: Leitet den Vergleich mit der vorhergehenden Argumentation natürlich ein; im Deutschen bildet „So … auch“ die griechische Verbindung καθάπερ καί knapp und idiomatisch ab.
- source_word: καὶ
  choice: auch
  rationale: Kennzeichnet David als zusätzlichen Zeugen für die vorangehende Argumentation.
- source_word: λέγει τὸν μακαρισμόν
  choice: spricht … von der Seligkeit
  rationale: Die Konstruktion bezeichnet Davids Aussage über den glücklichen beziehungsweise gesegneten Stand des betreffenden Menschen; „spricht von“ ist im Deutschen natürlich.
- source_word: μακαρισμός
  choice: Seligkeit
  rationale: Bewahrt den abstrakten Sinn eines glücklichen, von Gott begünstigten Zustands; die mögliche Bedeutung „Seligpreisung“ wird in einer Fußnote genannt.
- source_word: ἀνθρώπου
  choice: des Menschen
  rationale: Gibt den repräsentativen Singular geschlechtsübergreifend und zugleich formal nah am griechischen ἄνθρωπος wieder.
- source_word: λογίζεται
  choice: anrechnet
  rationale: Bringt die rechnende beziehungsweise zurechnende Metapher klar und im theologischen Zusammenhang geläufig zum Ausdruck.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Entspricht dem etablierten deutschen Ausdruck für die paulinische δικαιοσύνη und wahrt ihre theologische Bedeutungsbreite.
- source_word: χωρὶς ἔργων
  choice: ohne Werke
  rationale: Gibt die Trennung von der Grundlage menschlicher Werke knapp und unmittelbar wieder.
theological_decisions:
- issue: Repräsentative Personenbezeichnung ἀνθρώπου
  choice: des Menschen
  alternative: der Person
  rationale: ἄνθρωπος bezeichnet hier einen einzelnen Menschen repräsentativ, nicht ausschließlich einen Mann; „des Menschen“ bewahrt Singular und Allgemeingültigkeit.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ ist im paulinischen Zusammenhang der tragfähige und offene deutsche Leitbegriff; eine Festlegung auf ausschließlich moralische Rechtschaffenheit würde den Sinn verengen.
- issue: Rechnungsmetapher in λογίζεται
  choice: anrechnet
  alternative: zurechnet
  rationale: „Anrechnet“ hält die metaphorische und forensische Spannung fest, ohne den Vers durch zusätzliche dogmatische Begriffe auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist eng am griechischen Satzbau orientiert, bleibt jedoch idiomatisch; „Seligkeit“ ist bewusst gehoben, aber im biblischen Register verständlich.
