id: ROM.4.25
reference: Romans 4:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: de
  text: Er wurde wegen unserer Verfehlungen dahingegeben und zu unserer Rechtfertigung auferweckt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen unserer Rechtfertigung“.'
    reason: alternative_reading
  - marker: b
    text: „Rechtfertigung“ kann auch mit „Freispruch“ oder „Gerechterklärung“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: wurde … dahingegeben
  rationale: Die passive Form des Griechischen bleibt erhalten und lässt den wahrscheinlich gemeinten göttlichen Handelnden unausgesprochen. „Dahingegeben“ ist in diesem Zusammenhang würdevoll und verständlich.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: wegen unserer Verfehlungen
  rationale: διά mit Akkusativ ist hier am natürlichsten kausal zu verstehen. „Wegen“ bringt dies eindeutig zum Ausdruck.
- source_word: παραπτώματα
  choice: Verfehlungen
  rationale: „Verfehlungen“ bezeichnet konkrete moralische Übertretungen, ohne den Ausdruck zum allgemeineren „Sünden“ zu verflachen.
- source_word: ἠγέρθη
  choice: wurde … auferweckt
  rationale: Die Passivform entspricht dem Griechischen und bewahrt zugleich den unausgesprochenen göttlichen Handelnden.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: zu unserer Rechtfertigung
  rationale: „Zu“ gibt im Haupttext die Zweck- beziehungsweise Zielrichtung wieder. Die grammatisch mögliche kausale Deutung wird in einer Fußnote bewahrt.
- source_word: δικαίωσιν
  choice: Rechtfertigung
  rationale: „Rechtfertigung“ ist der präzise und etablierte deutsche Ausdruck für die rechtlich-heilsgeschichtliche Bedeutung von δικαίωσις; eine verständlichere Umschreibung steht in der Fußnote.
theological_decisions:
- issue: Ob διὰ τὴν δικαίωσιν ἡμῶν Zweck beziehungsweise Ziel („zu unserer Rechtfertigung“) oder Ursache („wegen unserer Rechtfertigung“) bezeichnet.
  choice: zu unserer Rechtfertigung
  alternative: wegen unserer Rechtfertigung
  rationale: Die Zieldeutung bringt zum Ausdruck, dass die Auferweckung Christi mit der Rechtfertigung der Glaubenden verbunden ist. Da διά mit Akkusativ auch kausal verstanden werden kann, bleibt diese Alternative ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Die parallelen Passivformen des griechischen Satzes werden bewahrt; die Stellung der Fußnotenmarker nach dem vollständigen Satz bezieht beide Hinweise eindeutig auf „zu unserer Rechtfertigung“.
