  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: de
  text: Wer arbeitet, dem wird der Lohn nicht als Gnadenerweis angerechnet, sondern als geschuldete Leistung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: wer arbeitet
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein einen Menschen, der arbeitet; die deutsche Relativkonstruktion ist natürlich und bewahrt den allgemeinen Sinn.
- source_word: μισθὸς
  choice: der Lohn
  rationale: Im Zusammenhang von Arbeit und geschuldeter Bezahlung bezeichnet μισθός den verdienten Lohn.
- source_word: λογίζεται
  choice: wird … angerechnet
  rationale: Die Formulierung bewahrt das paulinische Bild des Anrechnens und passt idiomatisch zur dativischen Person.
- source_word: κατὰ χάριν
  choice: aus Gnade
  rationale: Die traditionelle und zugleich verständliche Wendung bewahrt ausdrücklich χάρις und den Gegensatz zwischen unverdienter Gnade und geschuldeter Vergütung.
- source_word: ὀφείλημα
  choice: als etwas, das ihm geschuldet wird
  rationale: Die Umschreibung gibt den Kern von ὀφείλημα als geschuldete Leistung klar wieder und klingt im Deutschen natürlicher als „nach Schuld“ oder „als Verpflichtung“.
- source_word: δὲ
  choice: unmarkiert
  rationale: Der leichte fortführende beziehungsweise kontrastive Anschluss ergibt sich im Deutschen aus dem Zusammenhang; ein ausdrückliches „nun“ oder „aber“ wäre hier unnötig und könnte die Nuance überzeichnen.
theological_decisions:
- issue: Wiedergabe von χάρις im Gegensatz zu verdientem Lohn
  choice: aus Gnade
  alternative: als Geschenk / aus Gefälligkeit
  rationale: „Aus Gnade“ wahrt den theologischen Schlüsselbegriff und bleibt im unmittelbaren Gegensatz zu einer geschuldeten Zahlung klar, ohne den Sinn auf eine bestimmte Lehrtradition festzulegen.
- issue: Wiedergabe des geschuldeten Charakters von ὀφείλημα
  choice: als etwas, das ihm geschuldet wird
  alternative: als Schuld / nach dem Geschuldeten
  rationale: Die gewählte Formulierung erhält die rechtlich-wirtschaftliche Spannung zwischen Gnade und Anspruch und vermeidet im Deutschen die mögliche Fehlassoziation von „Schuld“ mit persönlicher Verfehlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und mündlich verständlich; „angerechnet“ bewahrt zugleich Paulus’ Rechnungsmetaphorik. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext erhalten bleiben.
