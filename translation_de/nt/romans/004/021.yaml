  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: de
  text: und war völlig überzeugt[a], dass er auch das tun kann, was er versprochen hat[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war sich vollkommen gewiss“ beziehungsweise „war fest davon überzeugt“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Perfekt kann im erzählenden Zusammenhang auch mit „versprochen hatte“ wiedergegeben werden; es hebt das gegebene Versprechen in seiner fortdauernden Geltung hervor.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „fähig ist“ oder „imstande ist“. Manche Übersetzungen wählen wegen des rückblickenden Zusammenhangs „konnte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: war völlig überzeugt
  rationale: Das Partizip bezeichnet volle Gewissheit. Die Formulierung ist gegenwärtiges, natürliches Deutsch und bewahrt die Stärke des griechischen Ausdrucks.
- source_word: ὅτι
  choice: dass
  rationale: Leitet unmittelbar den Inhalt von Abrahams Überzeugung ein.
- source_word: ὃ
  choice: das, was
  rationale: Gibt das Relativpronomen in dieser Satzfügung klar und idiomatisch wieder.
- source_word: ἐπήγγελται
  choice: versprochen hatte
  rationale: Das griechische Perfekt bezeichnet ein gegebenes Versprechen mit fortdauernder Geltung; das deutsche Plusquamperfekt ordnet es im erzählenden Zusammenhang als vorausgehend ein.
- source_word: δυνατός ἐστιν
  choice: kann
  rationale: Bewahrt den Präsens des griechischen Textes und bringt Gottes fortbestehende Fähigkeit natürlich zum Ausdruck.
- source_word: καὶ
  choice: auch
  rationale: Betont, dass derjenige, der versprochen hat, das Versprochene auch ausführen kann.
- source_word: ποιῆσαι
  choice: tun
  rationale: Bewahrt die breite, schlichte Bedeutung von ποιέω, ohne interpretierend zu präzisieren.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Versprechens und Könnens
  choice: Das Pronomen „er“ bleibt im Haupttext stehen.
  alternative: „dass Gott das, was er versprochen hatte, auch tun kann“
  rationale: Aus dem Zusammenhang ist Gott eindeutig der Bezugspunkt; im Vers selbst wird der Name jedoch nicht wiederholt. Das Pronomen wahrt die Ausdrucksweise des Ausgangstextes.
- issue: Zeitform von δυνατός ἐστιν
  choice: „kann“
  alternative: „konnte“
  rationale: Der griechische Text steht im Präsens und kann eine bleibende Aussage über Gottes Fähigkeit ausdrücken. Das deutsche Präsens bewahrt diese Spannung innerhalb des Rückblicks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem griechischen Gedankenaufbau, bleibt aber idiomatisch. Alle im Haupttext gesetzten Fußnoten erläutern echte lexikalische oder zeitliche Übersetzungsfragen.
