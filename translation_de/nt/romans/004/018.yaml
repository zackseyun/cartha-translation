source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: de
  text: 'Entgegen aller Hoffnung glaubte er voller Hoffnung[a], sodass er zum Vater vieler Völker wurde, wie es gesagt worden war: »So wird deine Nachkommenschaft[b] sein.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „gegen alle Hoffnung“ oder „über alle Hoffnung hinaus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dein Same“; das griechische Wort steht im Singular und kann kollektiv die gesamte Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Zitat aus 1. Mose 15,5; vergleiche 1. Mose 17,5.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: entgegen aller Hoffnung
  rationale: Die Wendung bewahrt den paradoxen Gegensatz zur folgenden Hoffnung und gibt παρά mit Akkusativ als Widerspruch zu menschlicher Erwartung wieder.
- source_word: ἐπ’ ἐλπίδι
  choice: voller Hoffnung
  rationale: Diese natürliche deutsche Formulierung bezeichnet die hoffnungsvolle Haltung beziehungsweise Grundlage seines Glaubens und erhält den rhetorischen Kontrast.
- source_word: ἐπίστευσεν
  choice: glaubte
  rationale: Die übliche Wiedergabe von πιστεύω wahrt den Anschluss an den paulinischen Sprachgebrauch, ohne den Begriff deutend zu erweitern.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: sodass er … wurde
  rationale: Die Konstruktion εἰς τό mit Infinitiv kann Ziel oder Ergebnis ausdrücken. „Sodass“ lässt diese Nähe von Zweck und Folge bestehen; „wurde“ entspricht dem Aorist γενέσθαι.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: zum Vater vieler Völker
  rationale: „Völker“ entspricht dem Verheißungskontext der Genesis besser als „Heiden“ und vermeidet, hier vorschnell einen ausschließlichen Juden-Heiden-Gegensatz einzutragen.
- source_word: κατὰ τὸ εἰρημένον
  choice: wie es gesagt worden war
  rationale: Das Perfekt Passiv verweist auf ein zuvor gesprochenes Wort, dessen Geltung fortbesteht. Die Formulierung bleibt bewusst allgemein, da Gott im griechischen Satz nicht ausdrücklich als Sprecher genannt wird.
- source_word: Οὕτως ἔσται
  choice: So zahlreich wird … sein
  rationale: „So zahlreich“ macht den im Zitat aus Genesis 15,5 durch den Sternenvergleich bestimmten Sinn von οὕτως im Deutschen verständlich.
- source_word: τὸ σπέρμα σου
  choice: deine Nachkommenschaft
  rationale: „Nachkommenschaft“ ist modernes Deutsch und bewahrt eher als der Plural „Nachkommen“ den singularisch-kollektiven Charakter von σπέρμα.
theological_decisions:
- issue: Bedeutung von ἔθνη in der Abrahamverheißung
  choice: Völker
  alternative: Heiden; Nationen
  rationale: Paulus greift die Abrahamverheißung auf, die von vielen aus Abraham hervorgehenden beziehungsweise in die Verheißung einbezogenen Völkern spricht. „Heiden“ würde den späteren Juden-Heiden-Kontrast zu stark in diese Formulierung hineintragen.
- issue: Verhältnis von Glauben und dem Werden zum Vater vieler Völker
  choice: sodass er … wurde
  alternative: damit er … würde
  rationale: Die griechische Konstruktion kann sowohl Ziel als auch Ergebnis anzeigen. „Sodass“ gibt die verwirklichte, verheißene Folge wieder, ohne Abrahams Glauben als verdienstliche Ursache der Verheißung darzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der paradoxe Gegensatz der beiden Hoffnungswendungen bleibt hörbar; schwer verständliche Wörtlichkeit wird vermieden. Die Schriftquotation ist leicht gehoben, jedoch nicht altertümlich formuliert.
