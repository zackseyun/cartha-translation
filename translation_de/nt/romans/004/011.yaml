id: ROM.4.11
reference: Romans 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: de
  text: Und er empfing das Zeichen der Beschneidung als Siegel der Gerechtigkeit aus dem Glauben, den er hatte, als er noch unbeschnitten war. So sollte er der Vater aller sein, die unbeschnitten glauben, damit auch ihnen die Gerechtigkeit angerechnet wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „angerechnet“ kann auch „zugerechnet“ oder „gerechnet“ übersetzt werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: Zeichen
  rationale: Die übliche und klare Wiedergabe bewahrt die Funktion der Beschneidung als sichtbares Zeichen.
- source_word: περιτομή
  choice: Beschneidung
  rationale: Die präzise deutsche Standardbezeichnung für den Ritus.
- source_word: σφραγίς
  choice: Siegel
  rationale: Bewahrt das Bild der Bestätigung beziehungsweise Beglaubigung, ohne es deutend aufzulösen.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Die etablierte und sachlich passende Wiedergabe im paulinischen Zusammenhang.
- source_word: πίστις
  choice: Glaube
  rationale: Hier bezeichnet das Wort den Glauben, mit dem die Gerechtigkeit verbunden ist; „Glaube“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: als er noch unbeschnitten war
  rationale: Gibt den gemeinten Zustand Abrahams idiomatisch und zeitlich verständlich wieder.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: der Vater aller, die glauben
  rationale: Natürliches Deutsch, das die repräsentative Vaterrolle Abrahams bewahrt.
- source_word: δι’ ἀκροβυστίας
  choice: obwohl sie unbeschnitten sind
  rationale: Verdeutlicht, dass die Glaubenden sich im Zustand der Unbeschnittenheit befinden; das griechische διά mit Genitiv ist hier nicht instrumental zu verstehen.
- source_word: λογισθῆναι
  choice: angerechnet wird
  rationale: Bewahrt die buchhalterische Zurechnungsmetapher und ist im modernen Deutschen klarer als „gerechnet wird“.
- source_word: καί
  choice: auch
  rationale: Hebt hervor, dass die Gerechtigkeit ebenfalls den unbeschnittenen Glaubenden angerechnet wird.
theological_decisions:
- issue: Verhältnis der Beschneidung zur Gerechtigkeit
  choice: Die Beschneidung erscheint als nachfolgendes Zeichen und Siegel der bereits mit dem Glauben verbundenen Gerechtigkeit.
  alternative: Die Formulierung könnte so verstanden werden, als vermittle die Beschneidung selbst die Gerechtigkeit.
  rationale: Die griechische Satzfolge unterscheidet die Gerechtigkeit aus dem Glauben im unbeschnittenen Zustand von der später empfangenen Beschneidung als Zeichen und Siegel.
- issue: Bezug von τῆς πίστεως
  choice: „Gerechtigkeit aus dem Glauben“
  alternative: „Gerechtigkeit des Glaubens“
  rationale: „Aus dem Glauben“ ist natürliches Deutsch und bezeichnet die enge Beziehung zwischen Glaube und Gerechtigkeit, ohne den Ausdruck als menschlichen Verdienst festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzperiode wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Das doppelte εἰς τὸ wird mit „So sollte“ und „damit“ wiedergegeben; Zeichen- und Siegelmetaphorik bleiben erhalten.
