  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: de
  text: Glücklich zu preisen sind die, deren Gesetzesbrüche vergeben und deren Sünden zugedeckt worden sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριοι
  choice: Glücklich zu preisen sind
  rationale: Die feste Wendung gibt den erklärenden, von Gott her bestimmten Seligpreisungscharakter wieder, ohne ihn auf ein subjektives Glücksgefühl zu verengen.
- source_word: ἀφέθησαν
  choice: vergeben worden sind
  rationale: Das Passiv bezeichnet hier den Erlass beziehungsweise die Vergebung; die Formulierung bewahrt in natürlichem Deutsch den abgeschlossenen Vorgang mit fortbestehendem Ergebnis.
- source_word: ἀνομίαι
  choice: Gesetzlosigkeiten
  rationale: Der Ausdruck hält den Bezug auf die Missachtung von Gesetz oder Ordnung fest und unterscheidet den Begriff von den parallel genannten Sünden, ohne ihn unnötig auszudeuten.
- source_word: ἐπεκαλύφθησαν
  choice: zugedeckt worden sind
  rationale: Die Übersetzung bewahrt das Bild des griechischen Verbs und damit die Bildsprache des angeführten Psalms.
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: Dies ist die übliche, klare und kontextgemäße Wiedergabe.
theological_decisions:
- issue: Verhältnis von »Gesetzlosigkeiten« und »Sünden«
  choice: Die beiden griechischen Begriffe werden im Deutschen verschieden wiedergegeben.
  alternative: Beide Begriffe einheitlich mit »Sünden« übersetzen.
  rationale: So bleiben der poetische Parallelismus und die verwandten, aber nicht identischen Ausdrücke des Ausgangstextes erhalten, ohne daraus eine weitergehende dogmatische Unterscheidung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung »Glücklich zu preisen sind« ist verständlicher als das traditionelle »Selig sind«, bewahrt aber dessen deklarativen Sinn. Der parallele Satzbau und die Metapher des Zudeckens bleiben erhalten.
