  naturalness: „Die aus dem Gesetz Erben sind“ wirkt im Deutschen elliptisch und unidiomatisch. Die Revision bietet eine klare, würdige und moderne Formulierung. „Zunichtegemacht“ ist für κεκένωται idiomatischer als das in diesem Zusammenhang sperrige „entleert“ und bewahrt die Aussage, dass der Glaube seiner Wirksamkeit beraubt wäre.
  terminology: „Erben“, „Glaube“ und „Verheißung“ sind passende etablierte Begriffe. „Außer Kraft gesetzt“ gibt κατήργηται angemessen als Aufhebung der Wirksamkeit wieder. Die Fußnote zu κεκένωται hält die Bildsprache von „leer/entleert“ als Alternative fest.
