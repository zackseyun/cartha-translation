  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: de
  text: Denn wenn diejenigen, die sich auf das Gesetz stützen, Erben sind, ist der Glaube zunichtegemacht[a] und die Verheißung außer Kraft gesetzt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist leer gemacht“; wörtlicher: „ist entleert worden“; sinngemäß: „ist wirkungslos gemacht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unwirksam gemacht“ beziehungsweise „für ungültig erklärt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: die aus dem Gesetz
  rationale: Bewahrt die knappe paulinische Wendung und lässt offen, ob Zugehörigkeit, Herkunft oder Bestimmung durch das Gesetz im Vordergrund steht.
- source_word: κληρονόμοι
  choice: Erben
  rationale: Die geläufige und sachlich passende Bezeichnung im Zusammenhang von Verheißung und Erbe.
- source_word: κεκένωται
  choice: ist entleert
  rationale: Gibt das Bild des Leerwerdens beziehungsweise der Wirkungslosigkeit wieder und wahrt den resultativen Sinn des Perfekts.
- source_word: πίστις
  choice: der Glaube
  rationale: Im Zusammenhang steht der Glaube dem Gesetz als Grundlage des Erbens gegenüber; die übliche paulinische Terminologie bleibt erhalten.
- source_word: κατήργηται
  choice: ist außer Kraft gesetzt
  rationale: Drückt aus, dass die Verheißung unwirksam gemacht wäre, ohne eine Vernichtung zu behaupten.
- source_word: ἐπαγγελία
  choice: die Verheißung
  rationale: Traditionell verständlich und im biblischen Zusammenhang präziser als das allgemeinere Wort „Versprechen“.
theological_decisions:
- issue: Bedeutung von πίστις im Gegensatz zu νόμος
  choice: der Glaube
  alternative: das Vertrauen; die Treue
  rationale: Der Argumentationsgang in Römer 4 stellt das Erbe aus Gesetz dem Empfang durch Glauben gegenüber. „Glaube“ wahrt diese Spannung, ohne den Begriff auf bloße Zustimmung oder menschliche Treue einzuengen.
- issue: Deutung von οἱ ἐκ νόμου
  choice: die aus dem Gesetz
  alternative: die zum Gesetz gehören; die nach dem Gesetz leben
  rationale: Die formal knappe Wiedergabe vermeidet es, die Gruppe ausschließlich als Gesetzesbefolger oder ethnisch bestimmte Gemeinschaft zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich knappe Formulierung „die aus dem Gesetz“ ist bewusst beibehalten, um die Mehrdeutigkeit des griechischen Ausdrucks nicht durch eine auslegende Paraphrase aufzulösen.
