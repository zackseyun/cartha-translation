    issue: Die Fußnote zu [a] ist logisch und lexikalisch ungeeignet.
    rationale: Der Haupttext lautet bereits »Gerechtigkeit«, während die Anmerkung erneut »Gerechtigkeit« als mögliche Bedeutung aufführt. »Rechtschaffenheit« verschiebt δικαιοσύνη zudem in Richtung einer persönlichen Tugendeigenschaft und ist in diesem paulinischen Kontext keine angemessene Alternativübersetzung. Da »Gerechtigkeit« im Deutschen sowohl die einschlägige paulinische Bedeutung als auch je nach Kontext den Sinn von »justice« abdecken kann, ist keine Fußnote erforderlich.
