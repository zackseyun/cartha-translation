reference: Romans 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: de
  text: 'Gilt diese Seligpreisung nun den Beschnittenen oder auch den Unbeschnittenen? Denn wir sagen: »Abraham wurde der Glaube als Gerechtigkeit angerechnet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρισμός
  choice: Seligpreisung
  rationale: Das Wort verweist auf die in Römer 4,6–8 ausgesprochene Seligkeit. »Seligpreisung« gibt diesen Rückbezug genauer wieder als das allgemeinere »Segen« und ist im biblischen Kontext verständlich.
- source_word: περιτομή
  choice: die Beschnittenen
  rationale: Das griechische Abstraktum »Beschneidung« bezeichnet hier metonymisch die Gruppe der beschnittenen Menschen. Die personenbezogene Wiedergabe ist im Deutschen natürlich und macht den Gegensatz deutlich.
- source_word: ἀκροβυστία
  choice: die Unbeschnittenen
  rationale: Wie περιτομή bezeichnet das Substantiv hier metonymisch eine Menschengruppe. »Die Unbeschnittenen« bildet den Gegensatz klar und idiomatisch ab.
- source_word: πίστις
  choice: Glaube
  rationale: »Glaube« ist hier die sachlich und sprachlich naheliegende Wiedergabe; der Vers selbst entfaltet nicht näher, ob Vertrauen oder Treue besonders betont ist.
- source_word: ἐλογίσθη
  choice: wurde … angerechnet
  rationale: »Anrechnen« bewahrt die rechenhafte beziehungsweise zurechnende Bedeutung von λογίζομαι und ist in modernem Deutsch verständlich.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« ist die reguläre deutsche Entsprechung und passt zu Paulus’ Argument über Abrahams Stellung vor Gott, ohne den Begriff weiter dogmatisch auszudeuten.
- source_word: εἰς δικαιοσύνην
  choice: als Gerechtigkeit
  rationale: Die Konstruktion gibt wieder, als was der Glaube angerechnet wurde. »Als Gerechtigkeit« ist präzise und idiomatisch.
theological_decisions:
- issue: Verhältnis von Abrahams Glauben und Gerechtigkeit
  choice: Abraham wurde der Glaube als Gerechtigkeit angerechnet.
  alternative: Abraham wurde der Glaube zur Gerechtigkeit angerechnet.
  rationale: Die gewählte Formulierung wahrt die Aussage des Zitats und seine theologische Spannung, ohne eine weitergehende Lehre über Art oder Mechanismus der Anrechnung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das anschließende Schriftzitat bleiben deutlich erkennbar; die Gruppenbezeichnungen werden idiomatisch personenbezogen wiedergegeben.
