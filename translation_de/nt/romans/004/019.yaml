id: ROM.4.19
reference: Romans 4:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: de
  text: Und ohne im Glauben schwach zu werden, betrachtete[a] er seinen eigenen, als abgestorbenen Körper – er war ja ungefähr hundert Jahre alt – und den abgestorbenen Zustand von Saras Mutterleib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer anderen Textüberlieferung: „betrachtete er seinen eigenen, als abgestorbenen Körper nicht“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Saras Unfruchtbarkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: schwach zu werden
  rationale: Die verbale Wiedergabe des Aoristpartizips bewahrt die Verbindung zum Hauptverb und bezeichnet hier ein Nachlassen der Glaubenskraft, nicht bloß einen statischen Zustand.
- source_word: πίστει
  choice: im Glauben
  rationale: Gemeint ist Abrahams vertrauendes Festhalten an Gottes Verheißung. „Im Glauben“ ist dafür im Deutschen natürlich und wahrt den paulinischen Leitbegriff.
- source_word: κατενόησεν
  choice: betrachtete
  rationale: Das Verb bezeichnet bewusstes Wahrnehmen und Bedenken. „Betrachtete“ lässt offen, wie stark das gedankliche Abwägen hervorzuheben ist.
- source_word: νενεκρωμένον
  choice: bereits wie abgestorbenen
  rationale: Das Perfektpartizip beschreibt einen bestehenden, auf die Zeugungsfähigkeit bezogenen Zustand, nicht den buchstäblichen Tod Abrahams. „Wie abgestorben“ gibt diese Wirkung verständlich wieder; „bereits“ nimmt den resultativen Aspekt auf.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: er war ja ungefähr hundert Jahre alt
  rationale: „Ungefähr“ gibt das abschwächende πού wieder. Der eingeschobene Hauptsatz klingt im modernen Deutschen natürlich und erklärt den vorausgehenden Ausdruck.
- source_word: νέκρωσιν
  choice: den abgestorbenen Zustand
  rationale: Diese Formulierung erhält die Todesmetaphorik und die sachliche Parallelität zu Abrahams Körper, ohne das im Deutschen schwerfällige „Abgestorbensein“ in den Haupttext zu setzen.
- source_word: μήτρας Σάρρας
  choice: von Saras Mutterleib
  rationale: Die Formulierung bewahrt das konkrete körperliche Bild und ist in modernem Standarddeutsch klar.
theological_decisions:
- issue: Soll die Todesmetaphorik der eingeschränkten Fortpflanzungsfähigkeit durch „Unfruchtbarkeit“ ersetzt werden?
  choice: Die Todesmetaphorik wird in beiden Satzteilen mit „wie abgestorben“ und „abgestorbener Zustand“ beibehalten.
  alternative: Abrahams Zeugungsunfähigkeit und Saras Unfruchtbarkeit ausdrücklich benennen.
  rationale: Paulus stellt Abrahams Körper und Saras Mutterleib mit verwandten Todesbegriffen nebeneinander. Diese Spannung unterstreicht die menschliche Unmöglichkeit, die durch Gottes Verheißung überwunden wird, und sollte nicht durch eine rein medizinische Deutung eingeebnet werden.
- issue: Textvariante bei der Verneinung von κατενόησεν
  choice: 'Dem SBLGNT-Haupttext folgend: Abraham betrachtete seinen wie abgestorbenen Körper.'
  alternative: 'Nach einer anderen Textüberlieferung: Abraham betrachtete seinen wie abgestorbenen Körper nicht.'
  rationale: Der Haupttext folgt der angegebenen Ausgangsausgabe. Da die Variante die Aussage syntaktisch und interpretativ deutlich verändert, wird sie in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den erläuternden Altersverweis gut lesbar. Die ungewöhnliche Todesmetaphorik bleibt bewusst erhalten, wird aber mit „abgestorbener Zustand“ idiomatischer formuliert als mit dem substantivierten „Abgestorbensein“.
