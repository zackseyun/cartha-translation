revisions:
- from: Und ohne im Glauben schwach zu werden, betrachtete[a] er seinen eigenen, bereits wie abgestorbenen Körper – er war ja ungefähr hundert Jahre alt – und den abgestorbenen Zustand von Saras Mutterleib[b].
  to: Und ohne im Glauben schwach zu werden, betrachtete[a] er seinen eigenen, als abgestorbenen Körper – er war ja ungefähr hundert Jahre alt – und den abgestorbenen Zustand von Saras Mutterleib[b].
  rationale: Die Revision entfernt das im SBLGNT-Haupttext nicht belegte „bereits“, glättet die deutsche Wiedergabe von νενεκρωμένον und formuliert die lexikalische Alternative idiomatisch. Die auffällige Todesmetaphorik und die im griechischen Satz parallel gesetzten Aussagen über Abraham und Sara bleiben im Haupttext erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:45:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der SBLGNT-Haupttext wird grundsätzlich zutreffend wiedergegeben: Das Partizip zu ἀσθενέω, die Erwähnung des ungefähr hundertjährigen Alters, das bewusste Beachten (κατενόησεν) und die parallele Todesmetaphorik bei Abrahams Körper und Saras Mutterleib bleiben erhalten. Allerdings hat „bereits“ im Haupttext keine Grundlage im angegebenen SBLGNT-Text; es darf nicht in die Hauptlesart aufgenommen werden.'
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. „Wie abgestorbenen Körper“ ist jedoch weniger präzise und stilistisch weniger glatt als „als abgestorbenen Körper“. „Den abgestorbenen Zustand von Saras Mutterleib“ ist als verständliche Wiedergabe der ungewöhnlichen griechischen Todesmetaphorik vertretbar.
  terminology: „Im Glauben“, „Körper“ und „Mutterleib“ sind passend. Die Wiedergabe mit „abgestorben“ bewahrt die lexikalische Verknüpfung von νενεκρωμένον und νέκρωσις, ohne die Aussage vorschnell medizinisch zu „Unfruchtbarkeit“ zu harmonisieren. Die Fußnotenalternative „Unfruchtbarkeit von Saras Mutterleib“ ist im Deutschen semantisch weniger natürlich; „Saras Unfruchtbarkeit“ ist als alternative Deutung idiomatischer.
  issues:
  - severity: medium
    issue: Unbegründtes „bereits“ im Haupttext
    rationale: νενεκρωμένον ist ein Perfektpartizip und beschreibt einen bestehenden Zustand, doch der vorgelegte SBLGNT-Text enthält kein ἤδη („bereits“). Die Ergänzung geht über die Hauptlesart hinaus.
  - severity: low
    issue: „wie abgestorbenen“ ist unnötig abgeschwächt
    rationale: Die griechische Formulierung bezeichnet den Körper mit Todesmetaphorik. „Als abgestorbenen“ gibt dies im Deutschen idiomatischer wieder und bewahrt zugleich, dass kein buchstäblicher Tod behauptet wird.
  - severity: low
    issue: Lexikalische Alternativfußnote b ist unidiomatisch formuliert
    rationale: „Unfruchtbarkeit von Saras Mutterleib“ klingt im Deutschen weniger natürlich. Die alternative interpretierende Wiedergabe lässt sich klarer als „Saras Unfruchtbarkeit“ formulieren.
  revised_text: Und ohne im Glauben schwach zu werden, betrachtete[a] er seinen eigenen, als abgestorbenen Körper – er war ja ungefähr hundert Jahre alt – und den abgestorbenen Zustand von Saras Mutterleib[b].
  revised_footnotes:
