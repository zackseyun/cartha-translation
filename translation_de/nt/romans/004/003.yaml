  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: τί γάρ als einleitendes „Denn“, ἡ γραφή als „die Schrift“, πιστεύειν mit Dativ treffend als „Gott glauben“ sowie die passive Zurechnungsformel ἐλογίσθη αὐτῷ εἰς δικαιοσύνην als „wurde ihm als Gerechtigkeit angerechnet“. Das im Zitat wiedergegebene δέ durch „aber“ ist möglich und ohne Sinnverschiebung.'
  naturalness: „Denn was sagt die Schrift?“ und „Abraham aber glaubte Gott“ sind klares, würdiges modernes Standarddeutsch. Die Anführungszeichen und der knappe Satzrhythmus passen zu einem Schriftzitat. „Als Gerechtigkeit angerechnet“ ist im Deutschen verständlich und im paulinischen Kontext idiomatisch.
  terminology: „Die Schrift“ ist für ἡ γραφή in diesem paulinischen Kontext angemessen. „Gott glauben“ wahrt gegenüber „an Gott glauben“ die hier relevante Konstruktion und Aussage. „Gerechtigkeit“ ist die sachgerechte, nicht konfessionell verengende Wiedergabe von δικαιοσύνη. Die Fußnote bietet sinnvolle lexikalische Alternativen zu ἐλογίσθη bzw. der Zurechnungsformel.
