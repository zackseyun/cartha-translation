id: ROM.4.3
reference: Romans 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: de
  text: Denn was sagt die Schrift? »Abraham aber glaubte Gott, und es wurde ihm als Gerechtigkeit angerechnet.«[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wurde ihm zur Gerechtigkeit gerechnet“ oder „wurde ihm als Gerechtigkeit zugerechnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: Mit dem bestimmten Artikel bezeichnet der Ausdruck bei Paulus hier die heilige Schrift, aus der er anschließend zitiert.
- source_word: Ἐπίστευσεν
  choice: glaubte
  rationale: Die schlichte Wiedergabe wahrt den Aussagegehalt des Aorists, ohne das Verb durch eine stärker deutende Formulierung wie „vertraute“ zu erweitern.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ nach πιστεύω bezeichnet hier die Person, deren Wort Abraham glaubte. Das deutsche „Gott glauben“ bildet dies genauer ab als „an Gott glauben“.
- source_word: ἐλογίσθη
  choice: wurde … angerechnet
  rationale: Die passive Form bleibt erhalten; „anrechnen“ gibt den wertenden beziehungsweise zurechnenden Sinn von λογίζομαι in natürlichem modernem Deutsch wieder.
- source_word: εἰς δικαιοσύνην
  choice: als Gerechtigkeit
  rationale: „Als Gerechtigkeit“ gibt die prädikative Zuordnung im Zusammenhang natürlich wieder und bewahrt den in der paulinischen Argumentation bedeutsamen Begriff „Gerechtigkeit“.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im Zusammenhang der Rechtfertigungsargumentation
  choice: Gerechtigkeit
  alternative: Recht beziehungsweise Gerechtsein
  rationale: „Gerechtigkeit“ wahrt die begriffliche Weite des griechischen Ausdrucks und legt nicht einseitig fest, ob vor allem ein Status, eine Eigenschaft oder gerechtes Handeln gemeint ist.
- issue: Gegenstand von Abrahams Glauben in τῷ θεῷ
  choice: Abraham glaubte Gott
  alternative: Abraham glaubte an Gott
  rationale: Die gewählte Form betont, dass Abraham Gott beziehungsweise Gottes Zusage Glauben schenkte, ohne den Ausdruck in eine allgemeine Aussage über Gottesglauben umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Frage bleibt knapp; das Schriftzitat wird durch deutsche Anführungszeichen kenntlich gemacht. „Aber“ gibt δέ wieder, ohne einen stärkeren Gegensatz zu erzeugen.
