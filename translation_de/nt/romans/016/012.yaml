id: ROM.16.12
reference: Romans 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: de
  text: Grüßt Tryphäna und Tryphosa[a], die sich im Herrn abgemüht haben. Grüßt Persis, die Geliebte[b], die sich sehr im Herrn abgemüht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die im Herrn hart gearbeitet haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: die Geliebte. Der griechische Text sagt nicht ausdrücklich „meine Geliebte“.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Pluralimperativ bezeichnet in einem brieflichen Grußabschnitt das Ausrichten eines Grußes; „Grüßt“ ist knapp, natürlich und kontextgemäß.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Tryphäna und Tryphosa
  rationale: Die Personennamen werden nach gebräuchlicher deutscher Form transliteriert und nicht übersetzt.
- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: die sich … abgemüht haben / die sich … abgemüht hat
  rationale: „Sich abmühen“ gibt die mit κοπιάω verbundene anstrengende Arbeit wieder. Die Wiederholung desselben Verbs im Griechischen bleibt im Deutschen erkennbar; das Perfekt beschreibt vergangene, weiterhin anerkennend relevante Arbeit.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die traditionelle und zugleich präzise paulinische Wendung bewahrt die mögliche Beziehungs- und Sphärenbedeutung, ohne sie auf „für den Herrn“ zu verengen.
- source_word: Περσίδα
  choice: Persis
  rationale: Der Personenname wird transliteriert.
- source_word: τὴν ἀγαπητήν
  choice: die Geliebte
  rationale: Der griechische Text enthält den bestimmten Artikel und das Adjektiv, aber kein ausdrückliches Possessivpronomen; daher wird kein „meine“ ergänzt.
- source_word: ἥτις
  choice: die
  rationale: Das Relativpronomen leitet eine charakterisierende Aussage über Persis ein; im natürlichen Deutschen genügt „die“.
- source_word: πολλὰ
  choice: sehr
  rationale: Das adverbial gebrauchte πολλὰ hebt das Ausmaß ihrer Mühe hervor. „Sehr“ verbindet sich im Deutschen idiomatisch mit „sich abmühen“.
theological_decisions:
- issue: Bedeutung von ἐν κυρίῳ in der paulinischen Aussage über den Dienst
  choice: im Herrn
  alternative: für den Herrn / im Dienst des Herrn
  rationale: „Im Herrn“ bewahrt die theologisch dichte Aussage über Arbeit innerhalb der Beziehung und Zugehörigkeit zum Herrn und legt sie nicht ausschließlich als Zweckangabe aus.
- issue: Wiedergabe von τὴν ἀγαπητήν ohne ausdrückliches Possessivpronomen
  choice: die Geliebte
  alternative: meine Geliebte / die liebe Persis
  rationale: Da μου („meine“) fehlt, wird keine persönliche Besitz- oder Beziehungsangabe ergänzt. Die ungewöhnlichere deutsche Form erhält die Offenheit des griechischen Wortlauts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „sich im Herrn abmühen“ wahrt die Wortwiederholung des Ausgangstextes und vermittelt den Gedanken an anstrengende Arbeit. „Die Geliebte“ bleibt bewusst textnah, obwohl „die liebe Persis“ idiomatischer wäre.
