id: ROM.16.1
reference: Romans 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: de
  text: Ich empfehle euch Phöbe, unsere Schwester, die auch Diakonin[a] der Gemeinde in Kenchreä ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Dienerin oder Beauftragte. Das griechische Wort diakonos kann sowohl eine Person in einem anerkannten Gemeindedienst als auch allgemeiner jemanden bezeichnen, der anderen dient.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Ich empfehle euch
  rationale: Im brieflichen Zusammenhang führt das Verb eine Person empfehlend bei den Adressaten ein. Die Formulierung ist im Deutschen natürlich und gibt die erste Person Singular sowie den Empfängerbezug genau wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel markiert hier lediglich einen leichten Übergang. Ein deutsches „aber“ würde einen zu starken Gegensatz ausdrücken, während „nun“ leicht zeitlich verstanden werden könnte; der Themenwechsel ist durch den neuen Satz ausreichend erkennbar.
- source_word: Φοίβην
  choice: Phöbe
  rationale: Die im Deutschen gebräuchliche Form des griechischen Personennamens wird verwendet.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: unsere Schwester
  rationale: Die direkte Wiedergabe bewahrt die familiäre Sprache für eine Glaubensschwester, ohne die Erläuterung „im Glauben“ in den Text einzufügen.
- source_word: οὖσαν καὶ
  choice: die auch … ist
  rationale: Der Relativsatz gibt die zusätzliche identifizierende Aussage des Partizips und die additive Bedeutung von καί idiomatisch wieder.
- source_word: διάκονον
  choice: Diakonin
  rationale: Die Verbindung mit einer bestimmten Gemeinde kann auf einen anerkannten Dienst hinweisen. Die feminine Form entspricht dem Bezug auf Phöbe; die allgemeinere Bedeutung „Dienerin“ bleibt in der Fußnote erhalten.
- source_word: τῆς ἐκκλησίας
  choice: der Gemeinde
  rationale: Im paulinischen Kontext bezeichnet ἐκκλησία die örtliche christliche Gemeinschaft. „Gemeinde“ ist im modernen Deutschen klar und vermeidet, dass das Gebäude gemeint erscheint.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: in Kenchreä
  rationale: Die Ortsangabe wird mit der im Deutschen üblichen Form des antiken Ortsnamens und einer natürlichen lokativen Präposition wiedergegeben.
theological_decisions:
- issue: Ob διάκονον eine allgemeine Dienerin oder eine Trägerin eines anerkannten Gemeindedienstes bezeichnet
  choice: Diakonin
  alternative: Dienerin oder Beauftragte der Gemeinde
  rationale: Die Zuordnung zu der konkreten Gemeinde in Kenchreä spricht für eine erkennbare Dienstfunktion, legt aber keine später entwickelte Amtsordnung fest. Da das griechische Wort auch allgemein eine dienende Person bezeichnen kann, wird diese echte Mehrdeutigkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, klingt aber natürlich. „Gemeinde“ bezeichnet hier die örtliche christliche Gemeinschaft; „Diakonin“ wird nicht mit späteren konfessionellen Amtsvorstellungen näher bestimmt.
