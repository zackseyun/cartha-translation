  source_fidelity: 'Die Übersetzung gibt die griechische Segensformel vollständig wieder: χάρις als „Gnade“, κύριος als „Herr“, die Anredeformel „unseres Herrn Jesus Christus“, die umfassende Wendung μετὰ πάντων ὑμῶν als „mit euch allen“ sowie „Amen“. Das ergänzte „sei“ bildet den im Deutschen natürlichen optativen Charakter einer griechischen Segensformel angemessen ab.'
  naturalness: „Die Gnade unseres Herrn Jesus Christus sei mit euch allen“ ist idiomatisches, modernes und zugleich dem würdigen Briefschluss entsprechendes Standarddeutsch. Die Stellung des Fußnotenankers vor dem als textkritisch unsicher markierten Vers ist klar.
  terminology: „Gnade“, „Herr“, „Jesus Christus“ und „Amen“ sind im deutschen bibelsprachlichen Register etabliert und sachgerecht. „Christus“ ist in dieser festen Namen-Titel-Verbindung die natürliche deutsche Form und wahrt den messianischen Titel ohne künstliche Formulierung.
