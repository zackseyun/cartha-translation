  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: de
  text: '[a]Die Gnade unseres Herrn Jesus Christus sei mit euch allen. Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in einigen Handschriften; andere enthalten ihn an dieser Stelle. Deshalb kennzeichnen viele moderne Ausgaben ihn als Textvariante im Schluss des Römerbriefs.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Der etablierte paulinische Segensbegriff bewahrt sowohl den Gedanken unverdienter Zuwendung als auch das theologische Gewicht des Ausdrucks.
- source_word: κυρίου
  choice: Herrn
  rationale: In der Verbindung mit Jesus bezeichnet κύριος seine Herrschaft; „Herr“ ist die natürliche und traditionsgeprägte deutsche Entsprechung.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: „Christus“ ist im modernen Standarddeutsch die geläufige Wiedergabe von Χριστός und bleibt als messianischer Titel erkennbar, ohne die ungewöhnliche Form „Jesus Messias“ zu erzwingen.
- source_word: μετὰ πάντων ὑμῶν
  choice: mit euch allen
  rationale: Die Formulierung gibt μετά mit Genitiv sowie die ausdrückliche Einbeziehung der gesamten angesprochenen Gemeinschaft natürlich und genau wieder.
- source_word: Ἀμήν
  choice: Amen
  rationale: Die herkömmliche liturgische Wiedergabe ist im Deutschen unmittelbar verständlich und entspricht der Funktion der abschließenden Bekräftigung.
theological_decisions:
- issue: Wiedergabe von Χριστός in Ἰησοῦ Χριστοῦ
  choice: Christus
  alternative: Messias
  rationale: Χριστός trägt den Sinn „Gesalbter/Messias“, ist in dieser festen Namens- und Titelfolge im Deutschen jedoch idiomatisch als „Christus“ wiederzugeben. Dadurch wird keine besondere konfessionelle Deutung hinzugefügt.
- issue: Segensformel ohne ausdrücklich geschriebenes Verb
  choice: „sei“ ergänzt
  alternative: „ist“ oder eine verblessene Formel
  rationale: Der griechische Nominalsatz ist als Segenswunsch zu verstehen. Das deutsche „sei“ macht diese Funktion natürlich sichtbar, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute paulinische Segenssprache wird beibehalten; die Textvariante wird kenntlich gemacht, ohne den Vers stillschweigend als sicher ursprünglich oder unecht zu bewerten.
