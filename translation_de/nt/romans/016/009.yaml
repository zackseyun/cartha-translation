  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: de
  text: Grüßt Urbanus, unseren Mitarbeiter in Christus, und meinen lieben Stachys.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Imperativ Plural bezeichnet in dieser Grußliste die Aufforderung, Grüße auszurichten; „Grüßt“ ist knapp, idiomatisch und entspricht der Form des griechischen Textes.
- source_word: Οὐρβανὸν
  choice: Urbanus
  rationale: Der Personenname wird in seiner im Deutschen etablierten latinisierten Form wiedergegeben.
- source_word: συνεργὸν ἡμῶν
  choice: unseren Mitarbeiter
  rationale: συνεργός bezeichnet jemanden, der gemeinsam mit anderen arbeitet. „Unseren Mitarbeiter“ gibt die partnerschaftliche Zusammenarbeit natürlich wieder, ohne den Begriff auf ein bestimmtes Amt festzulegen.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Die Präpositionalphrase bezeichnet die Verbundenheit beziehungsweise den Wirkungsbereich in Bezug auf den Gesalbten. „Messias“ hält hier den Titelcharakter von Χριστός sichtbar; die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
- source_word: Στάχυν
  choice: Stachys
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form transliteriert.
- source_word: ἀγαπητόν μου
  choice: meinen lieben Stachys
  rationale: Die Formulierung bringt persönliche Zuneigung in natürlichem modernem Deutsch zum Ausdruck. „Meinen Geliebten“ wäre formaler, kann heute jedoch eine unbeabsichtigt romantische Nebenbedeutung haben.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in ἐν Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Χριστός bleibt in dieser Wendung als Titel verständlich. „Messias“ macht diesen Sinn transparent, während die Fußnote die traditionelle und ebenfalls mögliche Wiedergabe „Christus“ bewahrt. Die räumlich klingende Form „im“ erhält zudem die bewusst knappe paulinische Formel, ohne ihre genaue theologische Beziehung auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Struktur der paulinischen Grußliste bleibt erhalten. „Meinen lieben Stachys“ klingt persönlich und warm, ohne im heutigen Deutsch unnötig romantisch zu wirken.
