  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: de
  text: Grüßt Asynkritus, Phlegon, Hermes, Patrobas, Hermas und die Brüder, die mit ihnen sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist-Medium-Imperativ in der zweiten Person Plural steht in einer abschließenden Grußliste. „Grüßt“ ist im Deutschen die natürliche, knappe Wiedergabe.
- source_word: Ἀσύγκριτον
  choice: Asynkritus
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: Φλέγοντα
  choice: Phlegon
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Hier handelt es sich in einer Grußliste um einen Personennamen; die Form bleibt von dem folgenden Namen Hermas unterscheidbar.
- source_word: Πατροβᾶν
  choice: Patrobas
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: Ἑρμᾶν
  choice: Hermas
  rationale: Der Personenname wird transliteriert und klar von Ἑρμῆν („Hermes“) unterschieden.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: die Brüder, die bei ihnen sind
  rationale: „Brüder“ bewahrt den grammatisch maskulinen Plural ἀδελφούς; „die bei ihnen sind“ gibt σὺν αὐτοῖς natürlich wieder, ohne die genaue Art der Zugehörigkeit festzulegen.
theological_decisions:
- issue: Wiedergabe von ἀδελφούς in einem gemeinschaftlichen Gruß
  choice: Brüder
  alternative: Brüder und Schwestern; Glaubensgeschwister
  rationale: Der griechische Ausdruck ist ausdrücklich maskuliner Plural. Da der unmittelbare Kontext keine gemischtgeschlechtliche Gruppe ausdrücklich erkennen lässt, bleibt die formale Gestalt erhalten, ohne auszuschließen, dass „Brüder“ hier Glaubensgenossen bezeichnet.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die Namensformen folgen gängigen deutschen Transliterationskonventionen; die Reihung und die knappe Grußform des griechischen Textes bleiben erhalten.
