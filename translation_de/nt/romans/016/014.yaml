  source_fidelity: Die Namensreihe und der Imperativ „Grüßt“ geben den griechischen Text zutreffend wieder. Bei σὺν αὐτοῖς ist „mit ihnen“ die unmittelbare und semantisch präzisere Wiedergabe als „bei ihnen“.
