id: ROM.16.22
reference: Romans 16:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: de
  text: Ich, Tertius, der den Brief geschrieben hat, grüße euch im Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich, aber weniger wahrscheinlich: „Ich, Tertius, der den Brief im Herrn geschrieben hat, grüße euch.“ Die griechische Wendung „im Herrn“ kann sich auf „geschrieben hat“ beziehen, gehört aber wahrscheinlich zum Grüßen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: grüße
  rationale: Das Verb bezeichnet hier im brieflichen Schluss das Grüßen bzw. Ausrichten von Grüßen. „Grüße“ ist knapp, natürlich und fügt keine im Griechischen nicht ausdrücklich bezeichnete Herzlichkeit hinzu.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Akkusativpronomen der zweiten Person Plural wird im Deutschen eindeutig und natürlich mit „euch“ wiedergegeben.
- source_word: ἐγὼ Τέρτιος
  choice: Ich, Tertius
  rationale: Das ausdrücklich gesetzte Pronomen hebt den nun selbst sprechenden Schreiber hervor. Die Apposition bewahrt diese klare Selbstvorstellung.
- source_word: ὁ γράψας
  choice: der … geschrieben hat
  rationale: Das substantivierte Aoristpartizip identifiziert Tertius als denjenigen, der den Brief niedergeschrieben hat. Ein deutscher Relativsatz gibt dies natürlich wieder, ohne über die genaue Art seiner Schreiberrolle hinauszugehen.
- source_word: τὴν ἐπιστολήν
  choice: den Brief
  rationale: „Brief“ ist die geläufige moderne Entsprechung für ἐπιστολή. Der bestimmte Artikel wird bewahrt; ein zusätzliches „diesen“ steht nicht ausdrücklich im Ausgangstext.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die feste paulinische Wendung wird in ihrer knappen relationalen beziehungsweise sphärischen Bedeutung erhalten. „Herr“ gibt κύριος angemessen wieder.
theological_decisions:
- issue: Bezug von ἐν κυρίῳ („im Herrn“)
  choice: 'Die Wendung wird auf das Grüßen bezogen: Tertius grüßt die Empfänger „im Herrn“.'
  alternative: 'Die Wendung kann grammatisch auch näher zu „der den Brief geschrieben hat“ gezogen werden: Tertius habe den Brief „im Herrn“ geschrieben.'
  rationale: Wortstellung und brieflicher Zusammenhang lassen den Bezug auf das Hauptverb des Grüßens natürlicher erscheinen. Da der griechische Satz den anderen Bezug jedoch zulässt, wird diese echte syntaktische Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Text, ist aber idiomatisch. Das traditionelle und theologisch prägnante „im Herrn“ wird nicht umschrieben; die syntaktische Mehrdeutigkeit wird durch die Fußnote bewahrt.
