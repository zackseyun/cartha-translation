  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: de
  text: Grüßt Ampliatus[a], meinen Geliebten im Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Name kann auch als „Amplias“ wiedergegeben werden; die Lesart des SBLGNT an dieser Stelle stützt „Ampliatus“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist-Medium-Imperativ in der zweiten Person Plural dient als übliche briefliche Aufforderung, Grüße auszurichten. „Grüßt“ ist im Deutschen knapp, natürlich und kontextgerecht.
- source_word: Ἀμπλιᾶτον
  choice: Ampliatus
  rationale: Der im SBLGNT gebotene griechische Akkusativ wird als Personenname in der deutschen Nominativform „Ampliatus“ wiedergegeben. Die Form entspricht der zugrunde liegenden Namensform besser als die kürzere Variante „Amplias“.
- source_word: ἀγαπητόν μου
  choice: meinen Geliebten
  rationale: Die Wendung bewahrt die persönliche Wärme und die Prägnanz des Griechischen. Das substantivierte „Geliebten“ bezeichnet hier einen von Paulus geliebten Glaubensbruder, ohne eine romantische Bedeutung festzulegen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die geläufige paulinische Wendung bezeichnet die Beziehung beziehungsweise den Lebensbereich in Gemeinschaft mit dem Herrn. „Im Herrn“ erhält diese theologische Dichte, ohne den im Griechischen nicht genannten Namen Jesus zu ergänzen.
theological_decisions:
- issue: Bezug und Aussagekraft von ἐν κυρίῳ
  choice: „im Herrn“ wird mit „meinen Geliebten“ verbunden und beschreibt Paulus’ Zuneigung innerhalb der christlichen Gemeinschaft.
  alternative: Die Wendung könnte als bloß formelhafter Zusatz verstanden oder auf die Aufforderung zum Grüßen bezogen werden.
  rationale: Wortstellung und Syntax verbinden τὸν ἀγαπητόν μου ἐν κυρίῳ am natürlichsten als zusammengehörige Beschreibung des Ampliatus. Die wörtlich-nahe Wiedergabe wahrt zugleich die theologische Spannung der paulinischen Formel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle, aber weiterhin verständliche Wendung „mein Geliebter im Herrn“ bewahrt die knappe Wärme und den paulinischen Sprachgebrauch. Der Fußnotenmarker steht unmittelbar nach dem Namen.
