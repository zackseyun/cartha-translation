  naturalness: Die würdige, unabgeschlossene Doxologie ist natürliches gehobenes Standarddeutsch. Die Stellung des textkritischen Ankers am Satzende ist jedoch weniger passend, weil die Anmerkung die Stellung der gesamten Doxologie (V. 25–27) betrifft, nicht nur den unmittelbar vorhergehenden Relativsatz.
  terminology: „stärken“, „Evangelium“, „Verkündigung“, „Geheimnis“ und „Messias“ sind treffend. „Jesu, des Messias“ gibt Ἰησοῦ Χριστοῦ als Namen mit Titel wieder und erhält zugleich den offenen Genitivbezug bei κήρυγμα.
