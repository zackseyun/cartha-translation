source:
  edition: robinson-pierpont-2005-byzantine
  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: de
  text: '[a] Dem aber, der euch stärken kann nach meinem Evangelium und der Verkündigung Jesu, des Messias, nach der Offenbarung des Geheimnisses, das seit ewigen Zeiten verschwiegen war,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse 25–27 bilden einen abschließenden Lobpreis, der in alten Handschriften an unterschiedlichen Stellen steht. In der byzantinischen Mehrheitstradition findet er sich am Ende von Kapitel 14, im frühesten erhaltenen Papyrus nach Kapitel 15 und hier am Ende von Kapitel 16 in bedeutenden Handschriften des 4. Jahrhunderts sowie in der lateinischen Überlieferung. Einige Handschriften enthalten ihn an mehreren Stellen, wenige lassen ihn ganz aus. Die meisten modernen Übersetzungen behalten ihn hier als Abschluss des Römerbriefs bei.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: stärken
  rationale: Das Verb bezeichnet hier Gottes Handeln, durch das die Glaubenden gefestigt und standhaft gemacht werden; „stärken“ ist natürlich und bewahrt den fortlaufenden Sinn der Doxologie.
- source_word: κήρυγμα
  choice: Verkündigung
  rationale: Das Substantiv kann sowohl den Vorgang als auch den Inhalt der öffentlichen Verkündigung bezeichnen; „Verkündigung“ erhält diese Offenheit.
- source_word: Ἰησοῦ Χριστοῦ
  choice: von Jesus, dem Messias
  rationale: Die Genitivverbindung bleibt hinsichtlich ihres sachlichen Bezugs zur Verkündigung offen; Χριστός wird als Titel „Messias“ wiedergegeben.
- source_word: μυστηρίου
  choice: Geheimnisses
  rationale: „Geheimnis“ bezeichnet einen zuvor verborgenen, nun durch Offenbarung bekannt gemachten göttlichen Ratschluss und ist im Deutschen bibelsprachlich wie allgemein verständlich.
- source_word: χρόνοις αἰωνίοις
  choice: seit ewigen Zeiten
  rationale: Die idiomatische Wendung verweist auf weit zurückliegende, unermessliche Zeiten; „seit ewigen Zeiten“ gibt die Zeitdauer würdig und verständlich wieder, ohne die Wendung philosophisch zu präzisieren.
- source_word: σεσιγημένου
  choice: verschwiegen war
  rationale: Das Perfekt Passiv von σιγάω betont, dass das Geheimnis über lange Zeit unausgesprochen beziehungsweise nicht bekannt gemacht worden war; „verschwiegen“ hält das Bild des Schweigens näher als „verborgen“.
theological_decisions:
- issue: Genitiv in „κήρυγμα Ἰησοῦ Χριστοῦ“
  choice: „Verkündigung von Jesus, dem Messias“
  alternative: „Verkündigung über Jesus, den Messias“
  rationale: Der griechische Genitiv kann Jesus als Inhalt oder in anderer Beziehung zur Verkündigung bezeichnen. Die Formulierung mit „von“ bewahrt diese echte Mehrdeutigkeit, statt sie ausschließlich objektiv aufzulösen.
- issue: Bedeutung von χρόνοις αἰωνίοις
  choice: „seit ewigen Zeiten“
  alternative: „seit langen Zeitaltern“
  rationale: Die gewählte Wendung wahrt die starke zeitliche Aussage des Griechischen, ohne festzulegen, ob metaphysische Ewigkeit oder unermesslich lange vergangene Zeitalter gemeint sind.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der für eine Doxologie passenden würdigen Satzführung. Der Vers bleibt als syntaktisch unabgeschlossener Auftakt zu 16,26–27 erhalten; es wird kein im Griechischen nicht vorhandenes „Nun“ ergänzt.
