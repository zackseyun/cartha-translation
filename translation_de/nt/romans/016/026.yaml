source:
  edition: robinson-pierpont-2005-byzantine
  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: de
  text: jetzt aber offenbart und durch prophetische Schriften auf Befehl des ewigen Gottes allen Völkern bekannt gemacht worden ist, um den Gehorsam des Glaubens zu bewirken, [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers setzt den abschließenden Lobpreis in Römer 16,25–27 fort. Zu seiner Stellung und zur handschriftlichen Überlieferung siehe die Anmerkung zu Römer 16,25.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: offenbart
  rationale: Das Partizip bezieht sich auf das in Vers 25 genannte Geheimnis und bezeichnet dessen nun erfolgte Enthüllung.
- source_word: γραφαῖς προφητικαῖς
  choice: prophetische Schriften
  rationale: Die Formulierung bezeichnet prophetische heilige Schriften; die Wiedergabe bleibt nahe am griechischen Ausdruck, ohne den bestimmten Artikel hinzuzufügen.
- source_word: ἐπιταγήν
  choice: Befehl
  rationale: Das Wort bezeichnet eine verbindliche, autoritative Anordnung Gottes.
- source_word: ὑπακοὴν πίστεως
  choice: Gehorsam des Glaubens
  rationale: Die bewusst knappe Genitivverbindung wird bewahrt und entspricht derselben Wendung in Römer 1,5, ohne das Verhältnis von Glaube und Gehorsam einseitig festzulegen.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Dies gibt den weltweiten Umfang wieder und lässt im Deutschen den inklusiven Bezug auf die nichtjüdischen Völker im Zusammenhang erkennen.
- source_word: γνωρισθέντος
  choice: bekannt gemacht worden ist
  rationale: Das passive Partizip bezeichnet die von Gott veranlasste Bekanntmachung des Geheimnisses an alle Völker.
theological_decisions:
- issue: Bedeutung des Genitivs in ὑπακοὴ πίστεως
  choice: Gehorsam des Glaubens
  alternative: Glaubensgehorsam / Gehorsam, der aus dem Glauben kommt
  rationale: 'Die formale Mehrdeutigkeit wird erhalten: Gemeint sein kann sowohl der Gehorsam, der im Glauben besteht, als auch der aus Glauben hervorgehende Gehorsam.'
- issue: Zielangabe εἰς ὑπακοὴν πίστεως
  choice: damit sie zum Gehorsam des Glaubens kommen
  alternative: zum Gehorsam des Glaubens
  rationale: Die verbale deutsche Fassung macht die Zielrichtung verständlich; das ergänzte Subjekt „sie“ verweist natürlich auf die zuvor genannten Völker.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt als syntaktische Fortsetzung von Vers 25 erkennbar. Der Fußnotenmarker steht am Versende, damit er den gesamten fortgesetzten Satzteil und dessen textkritischen Zusammenhang erfasst.
