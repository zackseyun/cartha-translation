  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: de
  text: Grüßt Rufus[a], den im Herrn Erwählten, und seine Mutter, die auch meine ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den im Herrn Ausgezeichneten“. Das griechische Wort kann auch „auserlesen“ oder „hervorragend“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Imperativ Plural fordert die Gemeinde zu einem Gruß auf; „Grüßt“ ist im Deutschen knapp, natürlich und für die Schlussgrüße des Paulus angemessen.
- source_word: Ῥοῦφον
  choice: Rufus
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: ἐκλεκτὸν
  choice: Erwählten
  rationale: „Erwählt“ gibt die Grundbedeutung des Adjektivs wieder, ohne die Aussage auf ein bestimmtes Lehrsystem einzuengen. Die mögliche Bedeutung „ausgezeichnet“ wird in der Fußnote genannt.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die Wendung bewahrt die paulinische Verhältnis- beziehungsweise Sphärenangabe und lässt offen, wie genau sie sich zur Erwählung verhält.
- source_word: τὴν μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: seine Mutter, die auch meine ist
  rationale: Diese natürliche deutsche Form bewahrt die knappe Aussage, dass Paulus die Mutter des Rufus zugleich als seine eigene bezeichnet, ohne die wohl bildliche Beziehung ausdrücklich auszudeuten.
theological_decisions:
- issue: Bedeutung von ἐκλεκτὸν ἐν κυρίῳ
  choice: „den im Herrn Erwählten“
  alternative: „den im Herrn Ausgezeichneten“ oder „den im Herrn Bewährten“
  rationale: Das Griechische kann göttliche Erwählung oder eine besondere, hervorragende Stellung bezeichnen. Der Haupttext folgt der Grundbedeutung „erwählt“, während die Fußnote die echte lexikalische Mehrdeutigkeit offenhält.
- issue: Bedeutung von „seine Mutter, die auch meine ist“
  choice: Die wörtliche familiäre Bezeichnung bleibt erhalten.
  alternative: „seine Mutter, die mir wie eine Mutter ist“
  rationale: Der Zusammenhang legt eine liebevolle, nicht biologische Bezeichnung nahe. Eine erklärende Umschreibung würde diese Deutung jedoch stärker festlegen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paulinische Wendung „im Herrn“ und die knappe familiäre Aussage werden bewahrt; die Wortstellung „den im Herrn Erwählten“ klingt natürlich und hält die syntaktische Verbindung eng.
