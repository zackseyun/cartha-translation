  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: de
  text: Timotheus, mein Mitarbeiter, grüßt euch. Ebenso grüßen euch Luzius, Jason und Sosipater, meine Verwandten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Landsleute“ beziehungsweise „meine jüdischen Landsleute“. Das griechische Wort kann leibliche Verwandte oder Menschen gemeinsamer Abstammung und Volkszugehörigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: grüßt
  rationale: In einem Brief bezeichnet ἀσπάζομαι gewöhnlich das persönliche Grüßen beziehungsweise Übermitteln von Grüßen. „Grüßt“ ist knapp, natürlich und gibt die Singularform mit Timotheus als Subjekt wieder.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen steht in der zweiten Person Plural und richtet sich an die Gemeinde in Rom.
- source_word: συνεργός
  choice: Mitarbeiter
  rationale: συνεργός bezeichnet jemanden, der mit einem anderen gemeinsam arbeitet, bei Paulus besonders im Dienst für das Evangelium. „Mitarbeiter“ ist im heutigen Deutsch natürlich und bewahrt den Gedanken gemeinsamer Arbeit.
- source_word: Λούκιος
  choice: Luzius
  rationale: Die Namensform folgt der im Deutschen üblichen Wiedergabe des griechischen Λούκιος.
- source_word: Ἰάσων
  choice: Jason
  rationale: „Jason“ ist die übliche deutsche Form des Personennamens.
- source_word: Σωσίπατρος
  choice: Sosipater
  rationale: Die Wiedergabe folgt der in diesem Vers bezeugten vollen Namensform Σωσίπατρος; „Sopater“ wäre die kürzere, andernorts belegte Form.
- source_word: συγγενεῖς
  choice: Verwandten
  rationale: συγγενής bezeichnet Verwandte, kann aber auch eine weiter gefasste gemeinsame Abstammung oder Volkszugehörigkeit ausdrücken. „Verwandten“ gibt den naheliegenden Wortsinn wieder; die mögliche weitere Bedeutung wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bedeutung von συγγενεῖς μου im paulinischen Sprachgebrauch
  choice: meine Verwandten
  alternative: meine Volksgenossen / meine jüdischen Landsleute
  rationale: Der Ausdruck kann leibliche Verwandtschaft oder eine weiter gefasste ethnische Verbundenheit meinen. Da der Vers nicht entscheidet, welcher Sinn hier beabsichtigt ist, wird die Mehrdeutigkeit durch eine Fußnote bewahrt und nicht historisch oder theologisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze macht den Wechsel vom singularischen Verb bei Timotheus zur anschließenden Namensgruppe natürlich verständlich, ohne den Inhalt zu verändern.
