id: ROM.16.15
reference: Romans 16:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: de
  text: Grüßt Philologus und Julia[a], Nereus und seine Schwester, Olympas und alle Heiligen, die bei ihnen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise auch „Julias“, falls der Name als männlich verstanden wird; die griechische Form wird gewöhnlich als der weibliche Name „Julia“ aufgefasst.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist-Imperativ in der zweiten Person Plural fordert im brieflichen Zusammenhang dazu auf, Grüße auszurichten; „Grüßt“ ist die knappe und natürliche deutsche Entsprechung.
- source_word: Φιλόλογον
  choice: Philologus
  rationale: Der Personenname wird in seiner im Deutschen üblichen latinisierten Form wiedergegeben.
- source_word: Ἰουλίαν
  choice: Julia
  rationale: Die Akkusativform wird am natürlichsten als der weibliche Name Julia verstanden. Die weniger wahrscheinliche Deutung als männlicher Name wird in einer Fußnote erhalten.
- source_word: Νηρέα
  choice: Nereus
  rationale: Der Personenname wird entsprechend der üblichen deutschen Namensform wiedergegeben.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: seine Schwester
  rationale: ἀδελφή bezeichnet die leibliche oder soziale „Schwester“; das Pronomen αὐτοῦ bezieht sich syntaktisch am naheliegendsten auf Nereus.
- source_word: Ὀλυμπᾶν
  choice: Olympas
  rationale: Der Personenname Ὀλυμπᾶς steht hier im Akkusativ und wird in der üblichen Nominativform „Olympas“ wiedergegeben.
- source_word: τοὺς σὺν αὐτοῖς
  choice: die bei ihnen sind
  rationale: Die Verbindung mit σύν bezeichnet Zugehörigkeit oder Gemeinschaft. Der deutsche Relativsatz gibt den substantivierten Ausdruck natürlich und vollständig wieder.
- source_word: πάντας ἁγίους
  choice: alle Heiligen
  rationale: ἅγιοι ist bei Paulus eine übliche Bezeichnung für die Glaubenden als die Gott Gehörenden. „Heilige“ bewahrt diesen paulinischen Sprachgebrauch ohne erläuternde Erweiterung.
theological_decisions:
- issue: Wiedergabe von ἅγιοι in einer paulinischen Grußliste
  choice: Heilige
  alternative: die heiligen Menschen; Gottes heiliges Volk
  rationale: Der Ausdruck bezeichnet hier die mit den Genannten verbundenen Glaubenden. „Heilige“ wahrt die traditionelle paulinische Bezeichnung, ohne eine spätere kirchliche Heiligsprechung vorauszusetzen.
- issue: Geschlecht des Namens Ἰουλίαν
  choice: Julia
  alternative: Julias
  rationale: Form und antiker Namensgebrauch sprechen am ehesten für den weiblichen Namen Julia. Weil die männliche Deutung in der Übersetzungsgeschichte vertreten wurde, wird sie transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer brieflichen Grußliste bleibt erhalten; „Grüßt“ entspricht der direkten Anrede im Plural. Personennamen folgen geläufigen deutschen Formen.
