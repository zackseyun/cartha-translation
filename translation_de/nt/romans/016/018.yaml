id: ROM.16.18
reference: Romans 16:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: de
  text: Denn solche Menschen dienen nicht unserem Herrn, dem Messias,[a] sondern ihrem eigenen Bauch,[b] und durch schöne Worte und Schmeichelei täuschen sie die Herzen der Arglosen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unserem Herrn Christus“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ihrem eigenen Bauch“; ein anschauliches Bild für selbstsüchtige Begierden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Unschuldigen“ beziehungsweise „der Unbedarften“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: solche Menschen
  rationale: Die Form verweist auf die im vorherigen Vers genannten Unruhestifter. „Solche Menschen“ ist natürliches modernes Deutsch und bewahrt den rückverweisenden Charakter.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: unserem Herrn, dem Messias
  rationale: κύριος wird mit „Herr“ wiedergegeben; Χριστός wird als Titel „Messias“ übersetzt. Das im Griechischen nicht vorhandene „Jesus“ wird nicht ergänzt.
- source_word: δουλεύουσιν
  choice: dienen
  rationale: Das Verb bezeichnet Sklavendienst oder Unterordnung. Im Gegensatz zwischen dem Dienst für den Herrn und dem Dienst für den eigenen Bauch gibt „dienen“ die Aussage natürlich und hinreichend deutlich wieder.
- source_word: κοιλίᾳ
  choice: Bauch
  rationale: Die konkrete Metapher des griechischen Textes bleibt erhalten; sie bezeichnet hier eigennützige, selbstsüchtige Begierden, ohne diese auf eine einzige Art von Verlangen einzuengen.
- source_word: χρηστολογίας
  choice: schöne Worte
  rationale: Das Wort bezeichnet angenehm oder gewinnend klingende Rede. „Schöne Worte“ ist verständlich und trägt im Zusammenhang den Beiklang verführerischer Glätte.
- source_word: εὐλογίας
  choice: Schmeichelei
  rationale: Im Kontext bezeichnet der Ausdruck keine echte Segnung, sondern lobende, einschmeichelnde Rede, die der Täuschung dient.
- source_word: ἐξαπατῶσι
  choice: täuschen
  rationale: Das Verb drückt wirksame beziehungsweise gründliche Irreführung aus. „Täuschen“ ist im Deutschen prägnant und entspricht dem Kontext.
- source_word: καρδίας
  choice: Herzen
  rationale: „Herzen“ bewahrt das biblische Bild für das innere Denken, Wollen und Empfinden des Menschen.
- source_word: ἀκάκων
  choice: Arglosen
  rationale: Das Adjektiv kann Menschen als unschuldig, ohne Arg oder nicht misstrauisch bezeichnen. „Arglose“ bewahrt die Mehrdeutigkeit zwischen Lauterkeit und mangelndem Verdacht besser als „Naive“.
theological_decisions:
- issue: Wiedergabe von Χριστός in der paulinischen Titelformel
  choice: Messias
  alternative: Christus
  rationale: Χριστός ist hier ein Titel. „Messias“ macht dessen Bedeutung unmittelbar sichtbar; die kirchlich vertraute Wiedergabe „Christus“ bleibt als Alternative in der Fußnote erhalten.
- issue: Bedeutung von κοιλία im ethischen Gegensatz
  choice: Bauch als bewusst beibehaltene Metapher
  alternative: Begierden oder eigener Vorteil
  rationale: Paulus verwendet ein körperliches Bild, das eigennützige beziehungsweise selbstsüchtige Triebe bezeichnen kann. Eine abstrakte Wiedergabe würde die Bildkraft mindern und den Sinn unnötig verengen.
- issue: Nuance von ἀκάκων
  choice: Arglose
  alternative: Unschuldige oder Unbedarfte
  rationale: Der Ausdruck kann moralische Lauterkeit wie auch Gutgläubigkeit bezeichnen. „Arglose“ erhält diese Spannung und passt zur geschilderten Täuschbarkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Gegensatz, ohne hölzern zu wirken. Die Bilder „Bauch“ und „Herzen“ bleiben erhalten; erläuterungsbedürftige Mehrdeutigkeiten werden in knappen Fußnoten ausgewiesen.
