  source_fidelity: 'Der Entwurf gibt die griechische Satzstruktur und die zentralen Ausdrücke zuverlässig wieder: ὁ θεὸς τῆς εἰρήνης als etablierter Titel, das futurische συντρίψει, die kollektive Anrede in „euren Füßen“, ἐν τάχει als zeitliches „bald“ sowie die abschließende Segensformel. „Zermalmen“ ist für συντρίψει eine angemessen starke, idiomatische Wiedergabe. Die Stellung „Satan bald unter euren Füßen“ bewahrt die Unterwerfungsmetapher.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und gut lesbar. „Die Gnade unseres Herrn Jesus, des Messias, sei mit euch“ ist eine grammatisch mögliche appositionelle Genitivfügung; sie macht den Titelcharakter von Χριστοῦ sichtbar, ohne den Sinn zu erweitern.
