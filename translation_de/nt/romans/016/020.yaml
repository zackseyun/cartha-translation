id: ROM.16.20
reference: Romans 16:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: de
  text: Der Gott des Friedens aber wird Satan bald unter euren Füßen zermalmen. Die Gnade unseres Herrn Jesus, des Messias,[a] sei mit euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »Jesus Christus«.'
    reason: Alternative Wiedergabe von Χριστοῦ als fester Namensbestandteil statt als transparenter Titel.
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Der Gott des Friedens aber
  rationale: Die Genitivverbindung wird als geläufiger paulinischer Hoheitstitel bewahrt. Das nachgestellte »aber« gibt δέ in natürlichem Deutsch wieder.
- source_word: συντρίψει
  choice: wird … zermalmen
  rationale: Das Futur bezeichnet eine bestimmte künftige Handlung. »Zermalmen« bewahrt das kräftige Bild vollständiger Niederwerfung und passt zur Wendung »unter euren Füßen«.
- source_word: τὸν Σατανᾶν
  choice: Satan
  rationale: Der im Griechischen als Eigenname gebrauchte Ausdruck wird entsprechend dem üblichen neutestamentlichen Sprachgebrauch transliteriert, nicht mit »Widersacher« umschrieben.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: unter euren Füßen
  rationale: Die feste Sieges- und Unterwerfungsmetapher bleibt erhalten. »Euren« wahrt die Mehrzahl und damit die gemeinschaftliche Anrede.
- source_word: ἐν τάχει
  choice: bald
  rationale: Im Kontext bezeichnet die Wendung am natürlichsten zeitliche Nähe. »Schnell« könnte im Deutschen lediglich die Geschwindigkeit des Vorgangs meinen.
- source_word: ἡ χάρις
  choice: Die Gnade
  rationale: Der zentrale paulinische Begriff wird in der Segensformel direkt und traditionsgemäß wiedergegeben.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: Der Genitiv wird als Zugehörigkeitsverhältnis in der üblichen Segensformel bewahrt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: »Messias« gibt die titulare Bedeutung von Χριστός wieder. Die appositionelle Genitivform ist im Deutschen natürlicher und grammatisch klarer als »Jesus Messias«.
- source_word: μεθ’ ὑμῶν
  choice: sei mit euch
  rationale: Das im Griechischen ausgelassene Verb wird ergänzt, wie es eine natürliche deutsche Segensformel erfordert; »mit euch« entspricht der gemeinschaftlichen Anrede.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der abschließenden Segensformel
  choice: des Messias
  alternative: Christus
  rationale: Die Wiedergabe als Titel lässt die Bedeutung von Χριστός transparent werden, ohne sie zu einer bloßen Namenskomponente zu machen. Die traditionelle, stärker namenartige Form »Christus« wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Text, ist aber idiomatisch; die kräftige Siegesmetapher und die gemeinschaftliche Anrede werden bewahrt.
