  verdict: approve
  source_fidelity: Der Text gibt die beiden Imperative ἀσπάσασθε angemessen mit „Grüßt“ wieder und bewahrt die Satzgliederung. „Gemeinde in ihrem Haus“ bildet κατ’ οἶκον αὐτῶν ἐκκλησίαν eng und idiomatisch ab. „meinen geliebten Epänetus“ entspricht τὸν ἀγαπητόν μου. „die Erstlingsgabe Asiens für den Messias“ erhält sowohl das Bild von ἀπαρχή als auch die nicht ganz eindeutige Beziehung von εἰς Χριστόν, ohne sie im Haupttext zu einer bloßen Aussage über einen ersten Bekehrten aufzulösen.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung von „Grüßt“ ist in einer paulinischen Grußliste natürlich. „Erstlingsgabe“ ist leicht gehoben, aber für den kultisch-metaphorischen Ausdruck angemessen und durch die Anmerkung sinnvoll ergänzt.
  terminology: „Gemeinde“, „Messias“ und „Erstlingsgabe“ sind terminologisch konsistent. Die Namensform „Epänetus“ ist im Deutschen vertretbar. Die kulturelle Erläuterung zu „Asia“ ist sachgerecht; sie verhindert eine Verwechslung mit dem modernen Kontinent.
