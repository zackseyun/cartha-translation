id: ROM.16.5
reference: Romans 16:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: de
  text: Grüßt auch die Gemeinde in ihrem Haus.[a] Grüßt meinen geliebten Epänetus, der die Erstlingsgabe Asiens[b] für den Messias ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gemeinde, die sich in ihrem Haus versammelt“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die römische Provinz Asia im Westen der heutigen Türkei, nicht der heutige Kontinent Asien.
    reason: cultural_note
  - marker: c
    text: 'Sinngemäß möglicherweise: „der Erste in Asia, der zum Glauben an den Messias kam“.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: die Gemeinde in ihrem Haus
  rationale: Bewahrt die knappe griechische Zuordnung und bleibt im Deutschen natürlich; gemeint ist die Versammlung, die mit ihrem Haus verbunden ist beziehungsweise dort zusammenkommt.
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Die übliche und kontextgerechte Wiedergabe in einer brieflichen Grußliste.
- source_word: Ἐπαίνετον
  choice: Epänetus
  rationale: Verwendet die im Deutschen geläufige, an die griechische Form angelehnte Namensform.
- source_word: ἀγαπητόν μου
  choice: meinen geliebten
  rationale: Gibt die persönliche Zuneigung eng am griechischen Adjektiv und in würdigem, verständlichem Deutsch wieder.
- source_word: ἀπαρχὴ
  choice: Erstlingsgabe
  rationale: Bewahrt das Bild vom ersten, Gott dargebrachten Anteil. Die kontextuelle Bedeutung „erster Bekehrter“ wird nicht stillschweigend in den Haupttext eingesetzt.
- source_word: τῆς Ἀσίας
  choice: Asiens
  rationale: Entspricht dem Genitiv; eine Fußnote erläutert, dass die römische Provinz Asia gemeint ist.
- source_word: εἰς Χριστόν
  choice: für den Messias
  rationale: Gibt die Ziel- beziehungsweise Beziehungsrichtung von εἰς wieder und behandelt Χριστός hier als Titel.
theological_decisions:
- issue: Wiedergabe von Χριστόν
  choice: Messias
  alternative: Christus
  rationale: Χριστός bezeichnet hier den messianischen Titel. „Messias“ macht dessen Bedeutung sichtbar, ohne zusätzliche konfessionelle Deutung einzutragen.
- issue: Bedeutung von ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: die Erstlingsgabe Asiens für den Messias
  alternative: der Erste in Asia, der zum Glauben an Christus kam
  rationale: Der Haupttext bewahrt das paulinische Erstlingsbild und die etwas offene Beziehung, die εἰς ausdrückt. Die wahrscheinlich gemeinte Aussage über den ersten Gläubigen beziehungsweise Bekehrten wird als Deutungsmöglichkeit in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemeinde“ ist für ἐκκλησία allgemein verständlich; „Erstlingsgabe“ erhält das kultisch-metaphorische Bild, wird aber durch eine Fußnote erschlossen. Die Wiederholung von „Grüßt“ bildet die Struktur des griechischen Grußkatalogs ab.
