source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: de
  text: Grüßt einander mit einem heiligen Kuss.[a] Alle Gemeinden des Messias grüßen euch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „heilige Kuss“ war ein in der damaligen Kultur üblicher Gruß, der unter den Glaubenden heilige Zuneigung und Gemeinschaft ausdrückte.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Alle Gemeinden Christi grüßen euch.“'
    reason: translation_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: Grüßt einander
  rationale: Der Aorist-Imperativ von ἀσπάζομαι fordert zum Grüßen auf; ἀλλήλους wird als das natürliche deutsche Reziprokpronomen „einander“ wiedergegeben.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: mit einem heiligen Kuss
  rationale: ἐν mit dem Dativ bezeichnet hier die Art beziehungsweise das Mittel des Grußes. „Heilig“ bewahrt den religiös-ethischen Gehalt von ἁγίῳ, ohne den Ausdruck auf bloße Herzlichkeit zu reduzieren.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: grüßen euch
  rationale: Die direkte Formulierung entspricht dem griechischen Briefstil und macht durch „euch“ die Mehrzahl der Angesprochenen deutlich.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: Alle Gemeinden
  rationale: πᾶσαι mit dem Artikel bezeichnet die Gesamtheit der betreffenden ἐκκλησίαι. „Gemeinden“ ist im Deutschen für örtliche christliche Gemeinschaften natürlicher als „Kirchen“ und vermeidet die mögliche Verengung auf Gebäude oder Institutionen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist seinem Ursprung und Sinn nach der Titel „Messias/der Gesalbte“; der Genitiv drückt Zugehörigkeit aus. „des Messias“ hält diesen Titelcharakter sichtbar.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: Beide deutschen Wiedergaben sind sachlich möglich. „Messias“ macht den Titelgehalt ausdrücklich, während „Christus“ die traditionelle, im Deutschen häufig namensähnliche Form ist. Der Haupttext bewahrt hier den Titelcharakter; die geläufige Alternative wird in einer Fußnote genannt.
- issue: Bedeutung des „heiligen Kusses“
  choice: Wörtliche Beibehaltung ohne Umdeutung im Haupttext
  alternative: Umschreibung als herzlicher oder geschwisterlicher Gruß
  rationale: Der konkrete Kuss gehört zum Wortlaut und bezeichnet einen als heilig gekennzeichneten Gemeinschaftsgruß. Eine kulturelle Erklärung ist angemessener in der Fußnote als eine verallgemeinernde Umschreibung im Text.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem brieflichem Ton. „Grüßt“ und „euch“ bilden die im Griechischen vorhandene Mehrzahl ab. „Gemeinden“ bezeichnet hier örtliche Gemeinschaften von Glaubenden.
