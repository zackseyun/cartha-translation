source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: de
  text: damit ihr sie im Herrn aufnehmt, wie es den Heiligen angemessen ist, und ihr in jeder Angelegenheit beisteht, in der sie euch braucht; denn sie selbst ist vielen, auch mir persönlich, eine Patronin[a] geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Wohltäterin“, „Unterstützerin“ oder „Beschützerin“. Das griechische Wort bezeichnet wahrscheinlich eine Frau, die andere in einer sozial anerkannten Weise unterstützte oder förderte, möglicherweise auch materiell.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: aufnehmt
  rationale: Das Verb bezeichnet hier die wohlwollende, gastfreundliche Aufnahme Phöbes in die Gemeinschaft; „aufnehmen“ ist natürlich und bewahrt die Nähe zum griechischen Ausdruck.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die feste paulinische Wendung bezeichnet den Bereich und die Beziehung der christlichen Gemeinschaft und wird ohne erklärende Paraphrase bewahrt.
- source_word: ἀξίως τῶν ἁγίων
  choice: wie es den Heiligen würdig ist
  rationale: Die Formulierung gibt die modale Bedeutung von ἀξίως wieder und ist im Deutschen verständlicher als das steifere „in einer der Heiligen würdigen Weise“.
- source_word: παραστῆτε αὐτῇ
  choice: ihr … beisteht
  rationale: παρίστημι bedeutet in diesem Zusammenhang, sich unterstützend an ihre Seite zu stellen; „beistehen“ bewahrt dieses Bild und schließt praktische Hilfe ein.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: in jeder Angelegenheit, in der sie euch braucht
  rationale: πρᾶγμα bleibt mit „Angelegenheit“ bewusst weit gefasst; der Genitiv ὑμῶν bei χρῄζῃ wird natürlich als „euch braucht“ wiedergegeben.
- source_word: προστάτις
  choice: Fürsprecherin und Unterstützerin
  rationale: Das seltene feminine Substantiv bezeichnet eine Frau, die anderen schützend, unterstützend oder als Patronin zur Seite steht. Die Doppelwendung wahrt die Bedeutungsbreite, ohne einen möglicherweise missverständlichen modernen Amtstitel festzulegen.
- source_word: ἐγενήθη
  choice: ist … gewesen
  rationale: Das deutsche Perfekt drückt die zurückliegende, für Paulus weiterhin bedeutsame Unterstützung idiomatisch aus.
- source_word: ἐμοῦ αὐτοῦ
  choice: auch mir persönlich
  rationale: „persönlich“ bringt die emphatische Kraft von αὐτοῦ bei ἐμοῦ in natürlichem Deutsch zur Geltung.
theological_decisions:
- issue: Bezeichnung von Phöbes Rolle durch προστάτις
  choice: Fürsprecherin und Unterstützerin
  alternative: Patronin; Wohltäterin; Beschützerin; Helferin
  rationale: Der Ausdruck weist wahrscheinlich auf eine bedeutende, möglicherweise auch sozial und materiell geprägte Unterstützungsrolle hin. „Helferin“ allein wäre zu schwach, während „Patronin“ das antike Sozialverhältnis präziser andeuten kann, im heutigen Deutsch aber leicht kunstbezogen oder technisch wirkt. Die gewählte Doppelwendung bewahrt Phöbes aktive und gewichtige Rolle, ohne daraus ein bestimmtes kirchliches Amt abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist für sich als abhängiger Finalsatz übersetzt, entsprechend dem einleitenden ἵνα und dem Verszusammenhang. „Heilige“ bewahrt den paulinischen Sprachgebrauch für Gottes Volk. Die Fußnotenmarkierung steht unmittelbar nach der erklärungsbedürftigen Aussage.
