source:
  edition: robinson-pierpont-2005-byzantine
  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: de
  text: dem allein weisen Gott durch Jesus, den Messias – dem sei die Herrlichkeit in Ewigkeit! Amen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers schließt den Lobpreis am Ende des Briefes ab (Römer 16,25–27). Wie bei Römer 16,25 vermerkt, unterscheiden sich frühe Handschriften deutlich darin, wo dieser Lobpreis steht und ob er enthalten ist. In der byzantinischen Mehrheitstradition ist er an dieser Stelle überliefert.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ σοφῷ θεῷ
  choice: dem allein weisen Gott
  rationale: Die Dativform setzt den in Vers 25 begonnenen Satz fort. »Allein« gibt μόνος wieder und betont, dass Gott in einzigartiger Weise weise ist, ohne die Formulierung unnötig auszubauen.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: 'διά mit Genitiv bezeichnet hier die Vermittlung: Der Lobpreis geschieht durch Jesus. Χριστός wird als Titel »Messias« wiedergegeben; die Apposition macht dies in natürlichem Deutsch deutlich.'
- source_word: ᾧ ἡ δόξα
  choice: dem sei die Herrlichkeit
  rationale: Das Relativpronomen wird als »dem« beibehalten. So bleibt die leichte syntaktische Spannung des Griechischen hinsichtlich des Bezugs auf Gott oder Jesus erhalten; der elliptische Nominalsatz wird idiomatisch als Wunsch- bzw. Lobpreisformel formuliert.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die wörtliche Wendung »in die Zeitalter« ist ein geläufiges griechisches Idiom für unbegrenzte Dauer; »in Ewigkeit« ist die entsprechende würdige deutsche Formel.
- source_word: Ἀμήν
  choice: Amen
  rationale: Die traditionelle Transliteration ist im Deutschen allgemein verständlich und liturgisch etabliert.
theological_decisions:
- issue: Bezugswort des Relativpronomens ᾧ
  choice: Die Formulierung »dem sei die Herrlichkeit« bewahrt formal den möglichen Bezug auf Gott oder Jesus.
  alternative: Explizit »Gott sei die Herrlichkeit« oder »Jesus sei die Herrlichkeit«.
  rationale: Obwohl der größere Satzbau am ehesten auf »Gott« weist, steht »Jesus, den Messias« unmittelbar davor. Eine explizite Auflösung würde die im griechischen Wortlaut vorhandene syntaktische Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Fortsetzung des in Vers 25 begonnenen Satzes kleingeschrieben und im Dativ. Der Gedankenstrich verdeutlicht den Übergang zur abschließenden Lobpreisformel, ohne die syntaktische Mehrdeutigkeit des Relativpronomens aufzulösen.
