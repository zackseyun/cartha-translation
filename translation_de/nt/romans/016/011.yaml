  verdict: revise
  source_fidelity: Die Satzstruktur, die zweimalige Aufforderung zum Grüßen und die Einschränkung der mit Narkissus verbundenen Gruppe auf diejenigen „im Herrn“ entsprechen dem griechischen Text. „Meinen Verwandten“ ist mit der Fußnote als bewusst offene Wiedergabe von συγγενής vertretbar. Der Personenname sollte jedoch nach der im Deutschen für die griechische Namensform üblichen Schreibung „Narkissus“ wiedergegeben werden.
  naturalness: „Grüßt Herodion, meinen Verwandten“ und „die im Herrn sind“ sind natürliches, würdiges modernes Standarddeutsch. „Die Leute des Narzissus“ ist verständlich und bewahrt die offene Zuordnungsformel, kann aber leicht eine soziale Abhängigkeit nahelegen; im vorliegenden knappen Grußkontext ist es noch akzeptabel.
  terminology: „Herr“ und die paulinische Formel „im Herrn“ sind angemessen. Die Fußnote zu συγγενής bewahrt die mögliche Bedeutung „jüdischer Volksgenosse“, ohne sie dem Haupttext aufzuzwingen. Die Fußnote zu Narkissus erläutert die wahrscheinliche Haushalts- oder Besitzzugehörigkeit, ohne den Haupttext zu überfrachten.
