  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: de
  text: Grüßt Herodion, meinen Verwandten[a]. Grüßt die Leute des Narkissus[b], die im Herrn sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann einen leiblichen Verwandten oder einen jüdischen Volksgenossen des Paulus bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind wahrscheinlich Menschen aus dem Haushalt oder Besitz des Narkissus, die an Christus glauben.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der pluralische Imperativ bezeichnet im brieflichen Zusammenhang das Ausrichten eines persönlichen Grußes; „Grüßt“ ist im Deutschen natürlich und präzise.
- source_word: Ἡρῳδίωνα
  choice: Herodion
  rationale: Der Personenname wird nach den üblichen deutschen Konventionen transliteriert.
- source_word: συγγενῆ μου
  choice: meinen Verwandten
  rationale: συγγενής kann einen leiblichen Verwandten, bei Paulus aber auch einen Volksgenossen bezeichnen. „Verwandten“ gibt den naheliegenden Sinn wieder, während die mögliche weitere Bedeutung in der Fußnote erhalten bleibt.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: die Leute des Narzissus
  rationale: Die Wendung bezeichnet eine mit Narzissus verbundene Personengruppe, wahrscheinlich Angehörige seines Haushalts oder Besitzes. Die knappe Formulierung vermeidet, „Haushalt“ ausdrücklich in den Haupttext einzutragen.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: die im Herrn sind
  rationale: Die Formulierung bewahrt die charakteristische paulinische Wendung und beschränkt den Gruß auf diejenigen aus dieser Gruppe, die „im Herrn“ sind.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ ist hier die sachgemäße Wiedergabe von κύριος und bewahrt die etablierte christologische Ausdrucksweise des Paulus.
theological_decisions:
- issue: Bedeutung von συγγενής in den Grußlisten des Paulus
  choice: „meinen Verwandten“ im Haupttext, mit Hinweis auf die mögliche Bedeutung „Volksgenossen“
  alternative: „meinen jüdischen Volksgenossen“
  rationale: Der Kontext entscheidet nicht eindeutig zwischen leiblicher Verwandtschaft und gemeinsamer jüdischer Herkunft. Die Übersetzung legt die ethnische Deutung daher nicht fest.
- issue: Art der Verbindung mit Narzissus
  choice: „die Leute des Narzissus“ ohne ausdrückliche Ergänzung von „Haushalt“
  alternative: „die Angehörigen des Haushalts von Narzissus“
  rationale: Der griechische Text nennt keinen Haushalt ausdrücklich, obwohl eine Haus- oder Besitzgemeinschaft wahrscheinlich gemeint ist. Die offenere Haupttextformulierung wahrt diesen Unterschied.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweimalige Imperativ „Grüßt“ bildet die Struktur des griechischen Textes ab. Die paulinische Wendung „im Herrn“ bleibt wegen ihrer theologischen Aussagekraft unverändert erhalten.
