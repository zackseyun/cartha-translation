lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aoristimperativ in der 2. Person Plural ist eine übliche briefliche Aufforderung, Grüße auszurichten; „Grüßt“ ist im Deutschen knapp und natürlich.
- source_word: Πρίσκαν
  choice: Priska
  rationale: Der griechische Text bietet die Namensform Πρίσκα; „Priska“ gibt diese Form im Deutschen wieder, während „Priscilla“ als geläufigere Form in der Fußnote genannt wird.
- source_word: Ἀκύλαν
  choice: Aquila
  rationale: Übliche deutsche Wiedergabe des Eigennamens Ἀκύλας.
- source_word: συνεργούς μου
  choice: meine Mitarbeiter
  rationale: συνεργός bezeichnet Menschen, die mit Paulus gemeinsam an derselben Aufgabe arbeiten. Das generische Maskulinum im Plural schließt hier ausdrücklich Priska und Aquila ein und entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Die Präposition bezeichnet die Beziehung beziehungsweise den Wirkungsbereich ihres gemeinsamen Dienstes. „Messias“ gibt den Titel Χριστός sinngemäß wieder; die traditionelle Form „Christus Jesus“ bleibt als Alternative sichtbar.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in der paulinischen Wendung ἐν Χριστῷ Ἰησοῦ
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin den Sinn eines Titels für Jesus. „Messias Jesus“ macht diesen Titelgehalt transparent, ohne die mögliche traditionelle Wiedergabe „Christus Jesus“ zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze briefliche Aufforderung bleibt erhalten; „Mitarbeiter“ ist hier auf beide genannten Personen bezogen.
