  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: de
  text: Grüßt Priska[a] und Aquila, meine Mitarbeiterin und meinen Mitarbeiter in Messias Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Priska ist die im griechischen Text stehende Namensform; Priscilla ist die geläufigere Form desselben Namens, die an anderen Stellen verwendet wird.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »in Christus Jesus«.'
