id: ROM.16.4
reference: Romans 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: de
  text: die für mein Leben ihren eigenen Hals hingehalten haben.[a] Nicht nur ich danke ihnen, sondern auch alle Gemeinden unter den Nichtjuden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Bild lautet wörtlich „ihren eigenen Hals daruntergelegt“ und bedeutet, dass sie ihr Leben aufs Spiel setzten.
    reason: Erläuterung einer bildhaften Redewendung und ihrer konkreten Bedeutung.
  - marker: b
    text: 'Wörtlicher: „alle Gemeinden der Völker“; gemeint sind die Gemeinden unter den Nichtjuden.'
    reason: Bewahrt die wörtlichere Wiedergabe von ἐθνῶν und erläutert den paulinischen Sinn.
lexical_decisions:
- source_word: οἵτινες
  choice: die
  rationale: Das Relativpronomen knüpft beschreibend an Priska und Aquila im vorhergehenden Vers an. Das schlichte „die“ wahrt diesen Zusammenhang natürlich.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: für mein Leben
  rationale: ψυχή bezeichnet hier angesichts tödlicher Gefahr das irdische Leben des Paulus, nicht speziell eine vom Körper unterschiedene Seele.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: ihren eigenen Hals hingehalten haben
  rationale: Die deutsche Wendung bewahrt das konkrete Bild des griechischen Ausdrucks und vermittelt zugleich, dass sie sich selbst tödlicher Gefahr aussetzten. Der Singular „Hals“ entspricht dem griechischen τράχηλον und funktioniert im Deutschen distributiv bei zwei Personen.
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: Nicht nur ich danke ihnen, sondern auch
  rationale: Die Umstellung ergibt einen klaren, natürlichen deutschen Satz und erhält die Betonung, dass Paulus nicht der Einzige ist, der dankt.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: alle Gemeinden
  rationale: „Gemeinden“ bezeichnet im neutestamentlichen Zusammenhang die örtlichen Versammlungen der Glaubenden und gibt den Plural mit Artikel sachgerecht wieder.
- source_word: τῶν ἐθνῶν
  choice: aus den anderen Völkern
  rationale: Im paulinischen Zusammenhang sind die nichtjüdischen Völker gemeint. „Aus den anderen Völkern“ gibt diese Beziehung verständlich wieder, ohne das heute mitunter abwertend klingende Wort „Heiden“ zu verwenden.
theological_decisions:
- issue: Bedeutung von ψυχή
  choice: Leben
  alternative: Seele
  rationale: Der Zusammenhang handelt von persönlicher Gefährdung zugunsten des Überlebens von Paulus. Daher ist „Leben“ die konkrete Bedeutung, ohne eine anthropologische Aussage über Leib und Seele einzutragen.
- issue: Bedeutung von ἔθνη
  choice: die anderen Völker, das heißt die Nichtjuden
  alternative: die Völker
  rationale: Bei Paulus bezeichnet der Ausdruck hier am ehesten Menschen außerhalb des jüdischen Volkes. Die Formulierung wahrt den jüdisch-nichtjüdischen Bezug und lässt zugleich die wörtlichere Bedeutung in der Fußnote erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Rede vom Hals bleibt erhalten; eine Fußnote erläutert sie. „Andere Völker“ vermeidet das potenziell abwertende moderne Verständnis von „Heiden“, ohne den jüdisch-nichtjüdischen Gegensatz zu verwischen.
