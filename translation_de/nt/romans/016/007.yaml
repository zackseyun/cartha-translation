  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: de
  text: Grüßt Andronikus und Junia[a], meine Stammesverwandten[c] und Mitgefangenen. Sie sind angesehen unter den Aposteln[b] und waren schon vor mir im Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Junia: Möglich ist auch die Wiedergabe „Junias“ als männlicher Name; nach der griechischen Form und dem historischen Namensgebrauch ist der weibliche Name jedoch wahrscheinlicher.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Sie sind hervorragend unter den Aposteln“; die Wendung kann außerdem als „Sie sind bei den Aposteln wohlbekannt“ verstanden werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „meine Verwandten“. Das griechische Wort kann sowohl familiäre Verwandte als auch Angehörige derselben Volks- oder Stammesgruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der direkte Imperativ entspricht dem üblichen brieflichen Grußauftrag und klingt im Deutschen natürlich.
- source_word: Ἀνδρόνικον
  choice: Andronikus
  rationale: Der Personenname wird nach gängiger deutscher Form wiedergegeben.
- source_word: Ἰουνίαν
  choice: Junia
  rationale: Die griechische Akkusativform entspricht am wahrscheinlichsten dem gut belegten weiblichen Namen Junia; die historisch vertretene männliche Deutung wird in einer Fußnote genannt.
- source_word: συγγενεῖς μου
  choice: meine Verwandten
  rationale: συγγενής kann Verwandte oder Volksgenossen bezeichnen. „Verwandte“ ist die naheliegende, zugleich nicht übermäßig spezifizierende deutsche Wiedergabe.
- source_word: συναιχμαλώτους μου
  choice: Mitgefangenen
  rationale: Das Kompositum bezeichnet Menschen, die das Gefangensein mit Paulus teilen; „Mitgefangene“ gibt dies knapp und konkret wieder.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: angesehen unter den Aposteln
  rationale: „Angesehen“ erfasst die Bedeutung „bemerkenswert/hervorragend“, während „unter den Aposteln“ die naheliegende Syntax wahrt. Die mögliche exklusive Deutung „bei den Aposteln wohlbekannt“ wird wegen der echten Ambiguität in der Fußnote erhalten.
- source_word: πρὸ ἐμοῦ
  choice: schon vor mir
  rationale: Die Formulierung bezeichnet zeitlichen Vorrang; „schon“ macht den deutschen Satz idiomatisch, ohne zusätzliche Sachinformation einzutragen.
- source_word: γέγοναν ἐν Χριστῷ
  choice: waren … im Messias
  rationale: Die Wiedergabe bewahrt die paulinische Wendung „im Messias“ und den resultativen Sinn des Perfekts, ohne sie als Bekehrungsformel auszudeuten.
theological_decisions:
- issue: Geschlecht und Identität von Ἰουνίαν
  choice: Junia als weiblicher Personenname
  alternative: Junias als männlicher Personenname
  rationale: Sprachform und historischer Namensgebrauch sprechen deutlich für Junia. Die männliche Deutung bleibt wegen ihrer Wirkungsgeschichte in der Fußnote sichtbar.
- issue: Bedeutung von ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: „angesehen unter den Aposteln“
  alternative: „bei den Aposteln wohlbekannt“ oder „hervorragend unter den Aposteln“
  rationale: Die griechische Wendung kann eine angesehene Stellung innerhalb des apostolischen Kreises bezeichnen; diskutiert wird jedoch auch eine Bekanntheit bei den Aposteln. Der Haupttext folgt der naheliegenden inklusiven Lesart, ohne den Rang mit „hervorragend“ unnötig zuzuspitzen, und dokumentiert die andere syntaktische Deutung.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός wird als Titel wiedergegeben. „Im Messias“ bewahrt zugleich die charakteristische paulinische Formel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze briefliche Imperativ und die paulinische Formel „im Messias“ bleiben erhalten. Die umstrittenen Stellen werden nicht konfessionell vereindeutigt; beide Fußnotenmarker stehen im Haupttext.
