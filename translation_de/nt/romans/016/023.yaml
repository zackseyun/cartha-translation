id: ROM.16.23
reference: Romans 16:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: de
  text: Gaius, mein Gastgeber und der Gastgeber der ganzen Gemeinde, grüßt euch. Erastus, der Stadtkämmerer[a], grüßt euch, ebenso Quartus, der Bruder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Stadtverwalter. Das griechische Wort kann allgemein einen städtischen Verwaltungsbeamten bezeichnen; hier ist wahrscheinlich ein Amt im Finanzwesen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: grüßt
  rationale: Im paulinischen Briefschluss bezeichnet das Verb das Ausrichten eines persönlichen Grußes. „Grüßt“ ist im modernen Deutschen knapp, natürlich und quellennah.
- source_word: ξένος
  choice: Gastgeber
  rationale: Mit Gaius als Subjekt und der Ergänzung „der ganzen Gemeinde“ bezeichnet ξένος hier denjenigen, der andere gastlich aufnimmt, nicht einen Fremden oder Gast.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: der ganzen Gemeinde
  rationale: ἐκκλησία bezeichnet hier die örtliche christliche Gemeinschaft. „Gemeinde“ ist im Deutschen natürlich und gibt zusammen mit „ganzen“ den Umfang der Gastfreundschaft des Gaius wieder.
- source_word: οἰκονόμος τῆς πόλεως
  choice: Stadtkämmerer
  rationale: οἰκονόμος bezeichnet einen Verwalter; im städtischen Amtskontext ist eine finanzielle Verwaltungsfunktion wahrscheinlich. „Stadtkämmerer“ gibt diese wahrscheinliche Bedeutung prägnant wieder, während die Fußnote die breitere Deutung offenhält.
- source_word: ἀδελφός
  choice: der Bruder
  rationale: Der griechische Ausdruck ist männlich, singularisch und bestimmt. „Der Bruder“ bewahrt diese Form und kennzeichnet Quartus als Glaubensbruder, ohne ein im Griechischen nicht ausdrücklich vorhandenes „unser“ einzufügen.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία im Grußzusammenhang
  choice: Gemeinde
  alternative: Kirche; Versammlung
  rationale: Im paulinischen Sprachgebrauch bezeichnet ἐκκλησία regelmäßig die christliche Gemeinschaft. „Gemeinde“ ist hier idiomatisch und legt keine weitergehende Kirchenstruktur in den Text hinein.
- issue: Familiäre Bezeichnung ἀδελφός
  choice: der Bruder
  alternative: unser Bruder; ein Glaubensbruder
  rationale: Die grammatisch männliche Einzahl bezieht sich auf einen einzelnen Mann. Die bestimmte Form wird beibehalten; eine besitzanzeigende oder erklärende Ergänzung wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Gastgeber“ macht den doppelten Bezug eindeutig. „Ebenso Quartus“ vermeidet eine im Deutschen unnatürliche Verbkonstruktion und gibt den zweiten Grüßenden klar wieder.
