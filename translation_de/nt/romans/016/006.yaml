  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: de
  text: Grüßt Maria[a], die sich sehr für euch abgemüht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben statt „für euch“ die Lesart „für uns“ oder „unter euch“.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist Imperativ Medium in der zweiten Person Plural dient im Briefstil zur Übermittlung eines Grußes. „Grüßt“ ist die knappe und natürliche deutsche Wiedergabe.
- source_word: Μαριάμ
  choice: Maria
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: ἥτις
  choice: die
  rationale: Das Relativpronomen leitet eine beschreibende Aussage über Maria ein. Das deutsche „die“ gibt dies natürlich wieder, ohne die allenfalls leicht qualitative Nuance zu überzeichnen.
- source_word: πολλὰ
  choice: sehr
  rationale: Das adverbial gebrauchte Wort bezeichnet hier das große Maß der Mühe und wird zusammen mit dem Verb idiomatisch durch „sich sehr abgemüht“ ausgedrückt.
- source_word: ἐκοπίασεν
  choice: sich … abgemüht hat
  rationale: κοπιάω bezeichnet anstrengende, ermüdende Arbeit. „Sich abmühen“ bewahrt diese intensive Bedeutung besser als das allgemeinere „arbeiten“ und klingt dennoch gegenwärtig und verständlich.
- source_word: εἰς ὑμᾶς
  choice: für euch
  rationale: εἰς mit Personen bezeichnet hier am natürlichsten die Ausrichtung beziehungsweise den Nutzen ihrer Arbeit. „Für euch“ folgt dem SBLGNT-Text und bleibt idiomatisch.
theological_decisions:
- issue: Textvariante in der Schlussphrase
  choice: für euch
  alternative: für uns; unter euch
  rationale: Der vorgegebene SBLGNT-Text lautet εἰς ὑμᾶς („für euch“). Andere Handschriften bieten εἰς ἡμᾶς („für uns“) oder ἐν ὑμῖν („unter euch“). Der Haupttext folgt der gewählten griechischen Ausgabe; die bedeutsamen Varianten werden in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist knapp und briefgemäß; „sich sehr abmühen“ wahrt den Nachdruck des griechischen Verbs, ohne altertümlich zu wirken.
