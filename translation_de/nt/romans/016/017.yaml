reference: Romans 16:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: de
  text: 'Ich ermahne euch aber, Brüder[a]: Achtet auf die, die entgegen der Lehre, die ihr gelernt habt, Spaltungen und Stolpersteine verursachen, und wendet euch von ihnen ab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; im Griechischen steht „Brüder“, wahrscheinlich ist jedoch die ganze Gemeinde angesprochen.'
    reason: Lexikalische Alternative und Erläuterung der inklusiven Reichweite der maskulinen Anrede.
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Ich ermahne
  rationale: Das Verb bezeichnet hier einen eindringlichen seelsorgerlichen Appell. „Ich ermahne“ gibt dessen Ernst und Aufforderungscharakter in würdigem, verständlichem Deutsch wieder.
- source_word: δὲ
  choice: aber
  rationale: Die postpositive Konjunktion markiert einen Übergang mit leichtem Kontrast zum vorherigen Zusammenhang; „aber“ bewahrt diese ausdrücklich vorhandene Verknüpfung.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Vokativ Plural wird formal wiedergegeben. Im paulinischen Sprachgebrauch kann er die gesamte Gemeinde einschließlich der Frauen ansprechen; dies wird in einer Fußnote erläutert.
- source_word: σκοπεῖν
  choice: Achtet auf
  rationale: Das Verb fordert zu genauer, wachsamer Beachtung bestimmter Personen auf. „Achtet auf“ wahrt sowohl Beobachtung als auch Warnung, ohne altertümlich zu klingen.
- source_word: διχοστασίας
  choice: Spaltungen
  rationale: Der Ausdruck bezeichnet gemeinschaftsschädigende Trennungen oder Zerwürfnisse; „Spaltungen“ ist klar und kontextgerecht.
- source_word: σκάνδαλα
  choice: Stolpersteine
  rationale: Die Wiedergabe erhält das Bild von etwas, das andere zu Fall bringt, statt den Ausdruck auf bloße Kränkungen zu verengen.
- source_word: παρὰ τὴν διδαχήν
  choice: entgegen der Lehre
  rationale: παρά mit Akkusativ bezeichnet hier Abweichung von beziehungsweise Widerspruch zu dem Maßstab der empfangenen Lehre.
- source_word: ἣν ὑμεῖς ἐμάθετε
  choice: die ihr gelernt habt
  rationale: Die direkte Wiedergabe erhält das betonte ὑμεῖς und verweist auf die bereits empfangene Unterweisung.
- source_word: ποιοῦντας
  choice: die … verursachen
  rationale: Das Partizip beschreibt die betreffenden Menschen als Urheber der Spaltungen und Stolpersteine. Ein deutscher Relativsatz ist natürlich und eindeutig.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: wendet euch von ihnen ab
  rationale: Die Formulierung bewahrt das Richtungsbild des Verbs und den imperativischen Nachdruck; sie ist etwas bildnäher als „meidet sie“.
theological_decisions:
- issue: Repräsentative Reichweite von ἀδελφοί als Anrede der römischen Gemeinde
  choice: „Brüder“ im Haupttext mit einer Fußnote zur wahrscheinlichen Einbeziehung von Frauen
  alternative: „Brüder und Schwestern“ im Haupttext
  rationale: Die griechische Form lautet ausdrücklich maskulin Plural, dient bei Paulus jedoch häufig als Anrede der gesamten Gemeinde. Haupttext und Fußnote bewahren gemeinsam Form und pragmatische Reichweite, ohne die Frage stillschweigend aufzulösen.
- issue: Bedeutungsumfang von σκάνδαλα
  choice: „Stolpersteine“ als bewahrte Metapher
  alternative: „Anstöße“, „Verführungen“ oder „Hindernisse“
  rationale: Der Kontext lässt offen, auf welche konkrete Weise Menschen zu Fall gebracht werden. Die metaphorische Wiedergabe wahrt diese Breite und vermeidet eine konfessionell oder dogmatisch verengte Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach der Anrede macht die zweigliedrige Aufforderung übersichtlich. Die Stellung „entgegen der Lehre, die ihr gelernt habt“ bezieht sich auf das Verursachen sowohl der Spaltungen als auch der Stolpersteine. Die Metapher „Stolpersteine“ bleibt bewusst erhalten.
