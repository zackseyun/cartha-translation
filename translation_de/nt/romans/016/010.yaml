revisions:
- from: Grüßt Apelles, der sich im Messias[a] bewährt hat. Grüßt die Angehörigen des Hauses von Aristobul.
  to: Grüßt Apelles, den Bewährten im Messias[a]. Grüßt die aus dem Haus des Aristobul.
  rationale: Die Kennzeichnung des Apelles wird von einer unnötig explizierenden Verbkonstruktion zu „den Bewährten im Messias“ korrigiert. Dadurch bleiben der anerkennende Charakter von δόκιμος und die knappe paulinische Formel ἐν Χριστῷ erhalten. „Die aus dem Haus des Aristobul“ gibt die elliptische soziale Zuordnung von τοὺς ἐκ τῶν Ἀριστοβούλου idiomatisch und ohne weitergehende Festlegung wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:47:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von ἀσπάσασθε, den Namen und der Haushaltszuordnung ist sachgerecht. Bei τὸν δόκιμον verschiebt „der sich ... bewährt hat“ jedoch die Aussage: Das Partizip/Adjektiv bezeichnet Apelles als den Bewährten bzw. Anerkannten; der Zusatz „sich“ legt unnötig den Vorgang seiner eigenen Bewährung nahe. Zudem sollte ἐν Χριστῷ unmittelbar an diese Kennzeichnung gebunden bleiben.'
  naturalness: „Grüßt Apelles, den Bewährten im Messias“ ist modernes, würdiges Deutsch und gibt die knappe appositionelle Struktur natürlich wieder. „Die Angehörigen des Hauses von Aristobul“ ist verständlich, aber „die aus dem Haus des Aristobul“ bildet die griechische elliptische Zuordnung unmittelbarer nach, ohne mehr über einen konkreten Haushalt zu behaupten.
  terminology: „Messias“ gibt den Titelsinn von Χριστός entsprechend der vorgegebenen Projektentscheidung wieder; die traditionelle Alternative „in Christus“ ist korrekt verankert. „Bewährten“ trifft δόκιμον als getestete und anerkannte Person, ohne die Art der Bewährung zu bestimmen.
  issues:
  - severity: medium
    issue: „der sich im Messias bewährt hat“ ergänzt reflexiv und verbal einen nicht expliziten Vorgang der Selbstbewährung.
    rationale: τὸν δόκιμον ἐν Χριστῷ kennzeichnet Apelles als bewährt/anerkannt „im Messias“; die deutsche Formulierung kann einen stärker aktiven oder kausalen Sinn erzeugen. Eine appositionelle Wiedergabe wahrt die knappe Qualifikation und ihre Bindung an ἐν Χριστῷ.
  revised_text: Grüßt Apelles, den Bewährten im Messias[a]. Grüßt die aus dem Haus des Aristobul.
  revised_footnotes:
  - marker: a
    text: 'Traditionell: „in Christus“.'
    reason: Alternative Wiedergabe des Titels Χριστός und der vertrauten paulinischen Formel.
