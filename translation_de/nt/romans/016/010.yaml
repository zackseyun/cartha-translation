  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: de
  text: Grüßt Apelles, den Bewährten im Messias[a]. Grüßt die aus dem Haus des Aristobul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „in Christus“.'
    reason: Alternative Wiedergabe des Titels Χριστός und der vertrauten paulinischen Formel.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Imperativ Plural fordert die Adressaten auf, Grüße auszurichten. „Grüßt“ ist knapp, natürlich und bewahrt die wiederholte Formulierung des Abschnitts.
- source_word: Ἀπελλῆν
  choice: Apelles
  rationale: Der Personenname wird nach gängiger deutscher Konvention transliteriert.
- source_word: τὸν δόκιμον
  choice: der sich bewährt hat
  rationale: δόκιμος bezeichnet jemanden, der sich als echt beziehungsweise zuverlässig erwiesen hat. Die verbale Wiedergabe ist im Deutschen natürlicher als „der Bewährte“ und erhält den anerkennenden Sinn.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Die Formulierung bewahrt sowohl den titularen Sinn von Χριστός als auch die paulinische Wendung, die Zugehörigkeit beziehungsweise Lebenssphäre ausdrückt, ohne sie erklärend aufzulösen.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: die Angehörigen des Hauses von Aristobul
  rationale: Die elliptische griechische Wendung bezeichnet wahrscheinlich Menschen aus dem Haushalt oder Hausverband des Aristobulus, nicht zwingend Aristobulus selbst. „Angehörige des Hauses“ gibt diese soziale Zuordnung verständlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in der paulinischen Formel ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: „Messias“ macht den Titelsinn des griechischen Χριστός sichtbar. Die traditionelle und im Deutschen sehr geläufige Wiedergabe „in Christus“ bleibt als Fußnotenalternative erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Aufforderung „Grüßt“ bleibt erhalten. „Aristobul“ folgt der etablierten deutschen Namensform; die Haushaltsbezeichnung wird verständlich, aber ohne unnötige Präzisierung wiedergegeben.
