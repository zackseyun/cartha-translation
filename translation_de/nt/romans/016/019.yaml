id: ROM.16.19
reference: Romans 16:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: de
  text: Denn euer Gehorsam ist allen bekannt geworden.[a] Darum freue ich mich über euch.[b] Ich möchte aber, dass ihr weise seid im Blick auf das Gute und unverdorben im Blick auf das Böse.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn euer Gehorsam ist zu allen gelangt.« Gemeint sein kann: Die Nachricht von eurem Gehorsam ist überall bekannt geworden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Darum freue ich mich euretwegen.«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »arglos«, »lauter« oder »rein« im Blick auf das Böse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: Gehorsam
  rationale: Das Substantiv bezeichnet bei Paulus gewöhnlich die gehorsame Antwort und nicht nur das Hören.
- source_word: εἰς πάντας ἀφίκετο
  choice: ist allen bekannt geworden
  rationale: Wörtlich hat der Gehorsam »alle erreicht«; gemeint ist idiomatisch, dass die Nachricht davon weite Verbreitung gefunden hat. Die rhetorische Weite von πάντας bleibt erhalten.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: freue ich mich über euch
  rationale: Bei χαίρω kann ἐπί mit Dativ den Anlass oder Gegenstand der Freude bezeichnen. Die deutsche Wendung ist natürlich und wahrt diese Offenheit.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: weise ... im Blick auf das Gute
  rationale: Die Formulierung bezeichnet praktische Einsicht, die auf das Gute ausgerichtet ist, ohne εἰς auf einen einzigen präzisen deutschen Relationsausdruck festzulegen.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: unverdorben ... im Blick auf das Böse
  rationale: ἀκέραιος kann »unvermischt, lauter, arglos, unverdorben« bedeuten. »Unverdorben« betont hier, parallel zum Guten, eine vom Bösen nicht beeinträchtigte Haltung, ohne Unwissenheit oder Naivität zu fordern.
theological_decisions:
- issue: Reichweite von πάντας
  choice: »allen« als rhetorisch weit gefasste Aussage
  alternative: »bei allen Gemeinden« oder eine mathematisch ausnahmslose Universalität
  rationale: Der Text selbst nennt keine eingegrenzte Gruppe. Zugleich ist die Aussage als anerkennende rhetorische Verallgemeinerung zu verstehen; eine zusätzliche Begrenzung wird nicht in den Haupttext eingeführt.
- issue: Moralischer Gegensatz zwischen σοφούς und ἀκεραίους
  choice: Weisheit im Blick auf das Gute und Unverdorbenheit im Blick auf das Böse
  alternative: Klugheit im Guten und Unwissenheit oder Naivität gegenüber dem Bösen
  rationale: Der Gegensatz verbindet aktive moralische Einsicht mit Unversehrtheit gegenüber dem Bösen. Er verlangt nicht ausdrücklich Unkenntnis des Bösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Im Blick auf« bildet die parallelen εἰς-Wendungen verständlich ab. »Unverdorben« ist hier natürlicher als das missverständliche »unschuldig in Bezug auf das Böse« und bewahrt die Vorstellung moralischer Unversehrtheit.
