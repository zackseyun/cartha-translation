reference: Romans 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: de
  text: Durch ihn haben wir auch durch den Glauben Zugang zu dieser Gnade erhalten, in der wir stehen; und wir rühmen uns[a] in der Hoffnung auf die Herrlichkeit Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wir freuen uns“ oder „wir jubeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: Zugang
  rationale: „Zugang“ gibt den Eintritt in den gegenwärtigen Gnadenstand natürlich und präzise wieder; „Zutritt“ wäre ebenfalls möglich, klingt aber etwas räumlicher.
- source_word: πίστει
  choice: im Glauben
  rationale: Der Dativ bezeichnet hier wahrscheinlich das Mittel beziehungsweise den vermittelnden Bereich. „Im Glauben“ ist idiomatisch und lässt diese Nuance offen; möglich ist auch „durch den Glauben“.
- source_word: χάριν
  choice: Gnade
  rationale: „Gnade“ ist im paulinischen Zusammenhang die sachlich und sprachlich angemessene Wiedergabe für Gottes unverdiente Zuwendung und den daraus folgenden Stand.
- source_word: ἑστήκαμεν
  choice: wir stehen
  rationale: Das Perfekt bezeichnet einen herbeigeführten Zustand, der in der Gegenwart fortbesteht. Das deutsche Präsens bringt diesen bestehenden Stand klar zum Ausdruck.
- source_word: καυχώμεθα
  choice: wir rühmen uns
  rationale: „Sich rühmen“ bewahrt die markante, positive Verwendung des Verbs bei Paulus und seine lexikalische Verbindung zu den benachbarten Aussagen, ohne sie zu bloßer Freude abzuschwächen.
- source_word: ἐπ’ ἐλπίδι
  choice: in der Hoffnung
  rationale: Die Formulierung ist im Deutschen natürlich und bewahrt Hoffnung als Grundlage beziehungsweise Bezugsrahmen des Rühmens.
- source_word: δόξης τοῦ θεοῦ
  choice: die Herrlichkeit Gottes
  rationale: Die Genitivverbindung wird transparent und in würdigem, geläufigem Deutsch wiedergegeben.
theological_decisions:
- issue: Die positive und zugleich spannungsvolle Bedeutung von καυχώμεθα
  choice: wir rühmen uns
  alternative: wir freuen uns / wir jubeln
  rationale: „Wir rühmen uns“ erhält die bewusste rhetorische Spannung des griechischen Ausdrucks und die Verbindung zu Paulus’ sonstigem Gebrauch. Glattere Alternativen würden diese Spannung teilweise auflösen.
- issue: Bezug von τῇ πίστει
  choice: im Glauben
  alternative: durch den Glauben
  rationale: Der Dativ kann instrumental verstanden werden. „Im Glauben“ wahrt jedoch etwas mehr Offenheit zwischen Mittel und Sphäre und bleibt in modernem Deutsch verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit paulinischer Begriffskontinuität. Der Satzbau wurde gegenüber dem Griechischen leicht geglättet, ohne die Abfolge von Zugang, bestehendem Gnadenstand und Hoffnung auf Gottes Herrlichkeit zu verändern.
