  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: de
  text: 'Doch nicht nur das: Wir rühmen uns[a] auch in Bedrängnissen, weil wir wissen, dass Bedrängnis Ausdauer[b] bewirkt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir freuen uns in den Bedrängnissen“ oder „wir jubeln in den Bedrängnissen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ausharren“ oder „Standhaftigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: wir freuen uns
  rationale: Das Verb bezeichnet hier ein zuversichtliches Sich-Rühmen oder Frohlocken. „Wir freuen uns“ gibt den positiven, nicht selbstgefälligen Sinn in natürlichem Deutsch wieder.
- source_word: ἐν ταῖς θλίψεσιν
  choice: mitten in Bedrängnissen
  rationale: ἐν kann hier die Situation bezeichnen, in der dieses Freuen geschieht. „Mitten in“ macht verständlich, dass nicht das Leid als solches verherrlicht wird, ohne die Aussage abzuschwächen.
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: „Bedrängnis“ bewahrt den Gedanken von Druck und Not und spiegelt im Grundsatzsatz den Wechsel vom griechischen Plural zum Singular.
- source_word: ὑπομονήν
  choice: standhaftes Ausharren
  rationale: ὑπομονή bezeichnet beharrliche Standfestigkeit unter Belastung. Die Wortgruppe ist heute verständlich und bewahrt sowohl den zeitlichen als auch den charakterlichen Aspekt.
- source_word: κατεργάζεται
  choice: bewirkt
  rationale: '„Bewirkt“ gibt den resultativen Sinn prägnant wieder: Bedrängnis bringt Ausharren hervor.'
- source_word: εἰδότες
  choice: weil wir wissen
  rationale: Die kausale Wiedergabe macht den gedanklichen Zusammenhang im Deutschen natürlich deutlich, ohne den Inhalt des Partizips zu erweitern.
theological_decisions:
- issue: Bedeutung von καυχώμεθα im Zusammenhang mit Bedrängnissen
  choice: „wir freuen uns“ als Ausdruck zuversichtlichen, auf Gottes Wirken bezogenen Frohlockens
  alternative: „wir rühmen uns“ oder „wir jubeln“
  rationale: „Freuen“ vermeidet im heutigen Deutsch den naheliegenden Eindruck selbstbezogener Prahlerei. Eine Fußnote bewahrt jedoch die stärkere Bedeutung des griechischen Verbs.
- issue: Verhältnis der Freude zu den Bedrängnissen
  choice: „mitten in Bedrängnissen“
  alternative: „über Bedrängnisse“ oder „in Bedrängnissen“
  rationale: Die Formulierung wahrt, dass die Freude in der Erfahrung von Not besteht, ohne eindeutig zu behaupten, die Not selbst sei unmittelbar ihr Gegenstand.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet den engen Anschluss an den vorangehenden Gedanken ab. Die Formulierung bleibt gut vorlesbar und vermeidet sowohl altertümliches „Trübsal“ als auch ein zu schwaches „Schwierigkeiten“.
