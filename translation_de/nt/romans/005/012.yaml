id: ROM.5.12
reference: Romans 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: de
  text: 'Darum: Wie durch einen Menschen die Sünde in die Welt kam und durch die Sünde der Tod, so breitete sich der Tod auf alle Menschen aus, weil[a] alle sündigten —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer traditionellen Deutung: „in ihm alle sündigten“.'
    reason: Alternative Deutung der theologisch umstrittenen Wendung ἐφ’ ᾧ.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Kennzeichnet den folgernden Übergang vom vorhergehenden Gedankengang und ist im Deutschen knapp und natürlich.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: durch einen Menschen
  rationale: διά mit Genitiv bezeichnet die Vermittlung. „Mensch“ gibt ἄνθρωπος wieder; der Kontext identifiziert diesen einen Menschen mit Adam, ohne dass sein Name hier ergänzt werden muss.
- source_word: ἡ ἁμαρτία
  choice: die Sünde
  rationale: Bewahrt den substantivischen und personifiziert wirkenden paulinischen Sprachgebrauch.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: in die Welt kam
  rationale: Gibt die gerichtete Bewegung von εἰς idiomatisch wieder.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: durch die Sünde der Tod
  rationale: 'Erhält die Parallelität: Die Sünde kommt durch einen Menschen, der Tod durch die Sünde.'
- source_word: οὕτως
  choice: so
  rationale: Markiert die entsprechende Folge innerhalb des begonnenen Vergleichs.
- source_word: εἰς πάντας ἀνθρώπους
  choice: auf alle Menschen
  rationale: Bezeichnet die gesamte Menschheit und ist im modernen Deutschen eindeutig inklusiv.
- source_word: ὁ θάνατος διῆλθεν
  choice: der Tod breitete sich aus
  rationale: Gibt die Bewegung und universale Ausdehnung von διέρχομαι natürlich wieder.
- source_word: ἐφ’ ᾧ
  choice: weil
  rationale: Die Wendung lässt sich im Kontext am natürlichsten kausal verstehen; die traditionsreiche alternative Deutung wird in einer Fußnote bewahrt.
- source_word: πάντες ἥμαρτον
  choice: alle sündigten
  rationale: Der einfache Vergangenheitsausdruck entspricht dem Aorist, ohne eine zusätzliche aspektuelle oder dogmatische Präzisierung einzutragen.
theological_decisions:
- issue: Bedeutung von ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'kausal: „weil alle sündigten“'
  alternative: 'repräsentativ beziehungsweise korporativ: „in dem sie alle sündigten“'
  rationale: Der kausale Sinn ist sprachlich und kontextuell gut begründet und legt keine weitergehende Lehrformel in den Text hinein. Da die alternative traditionelle Deutung für das Verhältnis zwischen Adam und der Menschheit theologisch bedeutsam ist, bleibt sie in der Fußnote sichtbar.
- issue: Unvollendete Vergleichskonstruktion
  choice: Gedankenstrich am Versende
  alternative: syntaktische Ergänzung des Vergleichs
  rationale: Der griechische Satz setzt mit ὥσπερ einen Vergleich an, führt ihn in diesem Vers jedoch nicht mit einem ausdrücklichen korrespondierenden Hauptsatz zu Ende. Der Gedankenstrich bewahrt diese offene Spannung, statt den Text redaktionell zu vervollständigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante paulinische Parallelstruktur und der am Versende offenbleibende Satzbau werden bewahrt; unnötige theologische Erläuterungen im Haupttext werden vermieden.
