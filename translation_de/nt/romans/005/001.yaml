  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: de
  text: Da wir nun aus Glauben[b] gerechtfertigt worden sind, haben[a] wir Frieden mit Gott durch unseren Herrn Jesus, den Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In einigen Handschriften steht: „Lasst uns Frieden mit Gott haben.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „aufgrund des Glaubens“.'
    reason: lexical_alternative
  - marker: c
    text: Griechisch Christos, „Messias“; traditionell „Christus“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: da wir … gerechtfertigt worden sind
  rationale: Das Aorist-Passiv-Partizip wird als begründender Nebensatz wiedergegeben. „Gerechtfertigt“ bewahrt den etablierten forensischen Sinn, ohne ihn zu einer bestimmten Lehrformel auszuweiten.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ kennzeichnet hier natürlich und würdig die Schlussfolgerung aus der vorangegangenen Argumentation; die Folgerungsbeziehung wird durch die gesamte Konstruktion „Da wir nun …“ deutlich.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: Die Wiedergabe bildet ἐκ formal ab und ist im paulinischen Sprachgebrauch verständlich. Die idiomatischere Deutung „aufgrund des Glaubens“ wird in einer Fußnote genannt.
- source_word: εἰρήνην
  choice: Frieden
  rationale: „Frieden“ bewahrt die Bedeutungsbreite des griechischen Nomens und verengt die Aussage weder auf ein inneres Gefühl noch auf den erklärenden Begriff „Versöhnung“.
- source_word: ἔχομεν
  choice: haben wir
  rationale: Die Übersetzung folgt dem Indikativ ἔχομεν des angegebenen SBLGNT-Textes. Die bekannte Variante mit hortativem Konjunktiv wird in einer Fußnote dokumentiert.
- source_word: πρὸς τὸν θεὸν
  choice: mit Gott
  rationale: In Verbindung mit „Frieden“ bezeichnet πρὸς idiomatisch die Beziehung zu Gott.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die natürliche, ehrerbietige und im neutestamentlichen Kontext etablierte Wiedergabe von κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  rationale: Χριστός wird als Titel mit seiner Bedeutung „Messias“ wiedergegeben; die Apposition mit Artikel entspricht natürlichem modernem Deutsch.
theological_decisions:
- issue: Bedeutung von δικαιωθέντες in der paulinischen Theologie
  choice: „gerechtfertigt worden sind“ ohne weitere dogmatische Auslegung
  alternative: „für gerecht erklärt worden sind“ oder „gerecht gemacht worden sind“
  rationale: Der Vers nennt Gottes rechtfertigendes Handeln, legt an dieser Stelle aber nicht dessen gesamten theologischen Mechanismus fest. Die gewählte Formulierung bewahrt diese Spannung.
- issue: Bedeutung von „Frieden mit Gott“
  choice: Die relationale Aussage bleibt schlicht als „Frieden mit Gott“ stehen.
  alternative: „Versöhnung mit Gott“ oder „inneren Frieden von Gott“
  rationale: Der Kontext weist auf eine wiederhergestellte Beziehung zu Gott, doch der griechische Text sagt „Frieden“. Die Übersetzung vermeidet daher eine unnötige Verengung.
- issue: Textvariante ἔχομεν / ἔχωμεν
  choice: 'Indikativ: „haben wir“'
  alternative: 'Hortativer Konjunktiv: „Lasst uns Frieden mit Gott haben“'
  rationale: Der vorgelegte SBLGNT-Text hat ἔχομεν. Die gut belegte abweichende Lesart wird sichtbar in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Argumentationsstruktur, ist aber flüssig lesbar. Fachlich etablierte Begriffe wie „gerechtfertigt“ werden beibehalten; erklärungsbedürftige Varianten erscheinen knapp in den Fußnoten.
