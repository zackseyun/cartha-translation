  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: de
  text: und Standhaftigkeit bewirkt Bewährung[a], Bewährung aber Hoffnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „bewährten Charakter“, „Erprobtheit“ oder „Anerkennung“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: Standhaftigkeit
  rationale: Das Wort bezeichnet beharrliches Ausharren unter Bedrängnis. „Standhaftigkeit“ ist im modernen Deutschen klar und bewahrt sowohl Ausdauer als auch innere Festigkeit.
- source_word: δοκιμή
  choice: Bewährung
  rationale: „Bewährung“ bezeichnet hier die durch Erprobung erwiesene Echtheit. Der Ausdruck bleibt knapp und lässt sowohl den Vorgang als auch besonders dessen positives Ergebnis anklingen.
- source_word: ἐλπίς
  choice: Hoffnung
  rationale: „Hoffnung“ ist die natürliche deutsche Entsprechung und bezeichnet im paulinischen Zusammenhang eine auf Gott gegründete Erwartung, ohne dies im Vers ausdrücklich auszuweiten.
- source_word: δὲ
  choice: und / aber
  rationale: Die Partikel verbindet die Glieder einer fortschreitenden Kette. Beim ersten Glied setzt „und“ den Gedankengang aus dem vorherigen Vers fort; „aber“ markiert anschließend den Übergang zum nächsten Glied, ohne einen starken Gegensatz auszudrücken.
- source_word: Ellipse des Verbs
  choice: bewirkt
  rationale: Im Griechischen ist das Verb aus Römer 5,3 mitzudenken. „Bewirkt“ macht die Folgerung im Deutschen verständlich; im zweiten Glied kann es entsprechend der knappen griechischen Form ausgelassen werden.
theological_decisions:
- issue: Bedeutung von δοκιμή in der Abfolge von Bedrängnis, Standhaftigkeit und Hoffnung
  choice: Bewährung als durch Prüfung erwiesene Echtheit
  alternative: Prüfungsvorgang, bewährter Charakter oder Anerkennung
  rationale: Da δοκιμή hier aus der Standhaftigkeit hervorgeht, liegt der Schwerpunkt wahrscheinlich auf dem positiven Ergebnis der Erprobung. „Bewährung“ wahrt jedoch die genuine Bedeutungsbreite besser als eine ausschließlich charakterbezogene Umschreibung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Kettenstruktur des Griechischen bleibt erhalten; nur das aus dem Kontext zu ergänzende Verb wird einmal ausdrücklich wiedergegeben.
