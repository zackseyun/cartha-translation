id: ROM.5.8
reference: Romans 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: de
  text: Doch Gott erweist seine eigene Liebe zu uns[a] dadurch, dass der Messias[b] für uns[c] starb, als wir noch Sünder waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf uns gerichtet“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch Christos; traditionell „Christus“. Hier als Titel mit „Messias“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu unseren Gunsten“; ὑπέρ kann in diesem Zusammenhang auch stellvertretende Bedeutung anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: erweist
  rationale: Das Präsens bezeichnet, dass Gott seine Liebe sichtbar und erkennbar unter Beweis stellt. „Erweist“ ist im Deutschen natürlich und bewahrt die demonstrative Aussagekraft.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel markiert hier einen leichten argumentativen Gegensatz zum vorausgehenden Gedankengang; „doch“ gibt diesen Übergang knapp und idiomatisch wieder.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: seine eigene Liebe
  rationale: „Liebe“ entspricht ἀγάπη; „eigene“ bewahrt die Betonung des reflexiven ἑαυτοῦ.
- source_word: εἰς ἡμᾶς
  choice: zu uns
  rationale: Die Präposition bezeichnet die Ausrichtung der Liebe auf uns. „Zu uns“ bildet diese Richtung unmittelbarer ab als das ebenfalls mögliche „für uns“.
- source_word: ὅτι
  choice: dadurch, dass
  rationale: ὅτι führt den Sachverhalt ein, an dem Gottes Liebe erkennbar wird. Die deutsche Konstruktion gibt diese erklärende beziehungsweise konkretisierende Funktion natürlich wieder.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: als wir noch Sünder waren
  rationale: Der Genitivus absolutus wird als temporaler Satz wiedergegeben; „noch“ bewahrt ἔτι, und „Sünder“ erhält die substantivische Aussage.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός fungiert hier als christologischer Titel. „Der Messias“ übersetzt den Titel, statt ihn lediglich in der traditionellen Form „Christus“ zu übertragen.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Die Wendung bezeichnet mindestens ein Sterben zu unseren Gunsten beziehungsweise in unserem Interesse. „Für uns“ ist präzise genug, ohne eine bestimmte Sühnetheorie in den Wortlaut einzutragen.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Die einfache Vergangenheitsform gibt den Aorist knapp und direkt wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός im paulinischen Sprachgebrauch
  choice: der Messias
  alternative: Christus
  rationale: An dieser Stelle ist der messianische Titel erkennbar. Seine Übersetzung als „Messias“ macht den Titelgehalt sichtbar, ohne die christologische Aussage zu verändern.
- issue: Bedeutungsweite von ὑπὲρ ἡμῶν
  choice: für uns
  alternative: zu unseren Gunsten; an unserer Stelle
  rationale: Der Vers sagt eindeutig, dass der Tod des Messias uns zugutekommt. Ob ὑπέρ hier zusätzlich ausdrücklich Stellvertretung bezeichnet, sollte der Haupttext nicht enger entscheiden, als die Formulierung selbst verlangt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung setzt Gottes Handeln an den Anfang und hält den Kontrast deutlich. „Sünder“ und „Messias“ bewahren die sachliche und theologische Dichte des Ausgangstextes; die Fußnoten machen echte lexikalische Alternativen sichtbar, ohne sie im Haupttext zu überladen.
