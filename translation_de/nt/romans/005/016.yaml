id: ROM.5.16
reference: Romans 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: de
  text: Und mit der Gabe verhält es sich nicht wie mit dem, was durch den einen kam, der sündigte.[a] Denn das Urteil führte aufgrund einer einzigen Verfehlung[b] zur Verurteilung, die Gnadengabe aber aufgrund vieler Verfehlungen zur Rechtfertigung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie mit dem, was durch einen Menschen kam, der sündigte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich möglicherweise nur: „aus einem“; gemeint sein kann eine einzige Verfehlung oder ein einziges Vergehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu einem rechtfertigenden Urteil“ oder „zum Freispruch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: Gabe
  rationale: Das Substantiv bezeichnet eine Gabe; „Gabe“ ist natürlich und vermeidet eine unnötige zusätzliche Bestimmung wie „freie“.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: was durch den einen kam, der sündigte
  rationale: Die Wiedergabe bewahrt den persönlichen Bezug und die elliptische Vergleichsform des Griechischen, ohne das Gemeinte übermäßig auszudeuten.
- source_word: κρίμα
  choice: Urteil
  rationale: Im gerichtlichen Zusammenhang bezeichnet κρίμα die richterliche Entscheidung; „Urteil“ bildet den Gegensatz zu Verurteilung und Freispruch klar ab.
- source_word: ἐξ ἑνὸς
  choice: von einer einzigen Verfehlung
  rationale: Das Neutrum ἑνός verweist im Gegensatz zu den später genannten vielen Verfehlungen wahrscheinlich auf eine einzelne Verfehlung. Das ergänzte Substantiv macht den deutschen Satz verständlich.
- source_word: κατάκριμα
  choice: Verurteilung
  rationale: Der Ausdruck bezeichnet ein verurteilendes Gerichtsurteil; „Verurteilung“ ist präzise, verständlich und wahrt den forensischen Gegensatz.
- source_word: χάρισμα
  choice: Gnadengabe
  rationale: „Gnadengabe“ bringt den Zusammenhang des Wortes mit χάρις zum Ausdruck und unterscheidet es zugleich von δώρημα.
- source_word: παραπτωμάτων
  choice: Verfehlungen
  rationale: „Verfehlungen“ gibt den Gedanken moralischer Übertretungen in natürlichem modernem Deutsch wieder, ohne einen unnötig archaischen Ton.
- source_word: δικαίωμα
  choice: Freispruch
  rationale: Im unmittelbaren Gegensatz zu κατάκριμα bezeichnet δικαίωμα hier am ehesten den rechtfertigenden beziehungsweise freisprechenden Urteilsspruch. „Freispruch“ erhält das konkrete forensische Bild.
theological_decisions:
- issue: Forensische Bedeutung von δικαίωμα im Gegensatz zu κατάκριμα
  choice: Freispruch als gerichtliches Ergebnis im Gegensatz zur Verurteilung
  alternative: Rechtfertigung; gerechter Urteilsspruch
  rationale: Die Satzstruktur stellt Verurteilung und δικαίωμα einander als gerichtliche Ergebnisse gegenüber. „Freispruch“ gibt diesen Gegensatz konkret wieder; die Fußnote bewahrt die mögliche abstraktere Wiedergabe „Rechtfertigung“ und die wörtlichere Nuance eines rechtfertigenden Urteilsspruchs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und der gerichtliche Gegensatz werden deutlich gehalten; die Ellipse im ersten Satzteil und die Bedeutungsbreite von ἐξ ἑνὸς sowie δικαίωμα bleiben durch Fußnoten sichtbar.
