id: ROM.5.6
reference: Romans 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: de
  text: Denn als wir noch schwach waren, starb der Messias zur rechten Zeit für Gottlose.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugunsten von Gottlosen“.'
    reason: Die Präposition ὑπέρ kann den Nutzen beziehungsweise das Handeln zugunsten anderer hervorheben; „für“ lässt im Haupttext die genaue Nuance offen.
lexical_decisions:
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός wird als Titel mit „der Messias“ wiedergegeben; das ist im Deutschen natürlich und bewahrt den Bezug auf den verheißenen Gesalbten.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: als wir noch schwach waren
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. „Schwach“ lässt die umfassende menschliche Unfähigkeit offen, ohne sie auf körperliche Schwäche oder einen engeren Lehrbegriff festzulegen.
- source_word: ἔτι
  choice: noch
  rationale: Das Adverb bezeichnet den fortdauernden Zustand. Im Deutschen gibt ein einmaliges „noch“ seinen Sinn natürlich wieder; die griechische Wiederholung wird nicht mechanisch nachgebildet.
- source_word: κατὰ καιρὸν
  choice: zur rechten Zeit
  rationale: Die Wendung bezeichnet den passenden beziehungsweise bestimmten Zeitpunkt. „Zur rechten Zeit“ ist idiomatisch und vermeidet eine unnötige Festlegung darauf, wie dieser Zeitpunkt bestimmt wurde.
- source_word: ὑπὲρ
  choice: für
  rationale: „Für“ ist hier die natürliche, inhaltlich offene Wiedergabe und kann sowohl den Nutzen als auch stellvertretende Bedeutung tragen, ohne die genaue Relation vorschnell zu systematisieren.
- source_word: ἀσεβῶν
  choice: Gottlose
  rationale: „Gottlose“ bewahrt den moralisch-religiösen Sinn von Menschen, denen die Ehrfurcht vor Gott fehlt. Der artikellose Plural wird im Deutschen ebenfalls ohne Artikel wiedergegeben.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Der Aorist bezeichnet das einmalige vergangene Geschehen und wird schlicht mit dem deutschen Präteritum wiedergegeben.
theological_decisions:
- issue: Bedeutung des Todes des Messias in ὑπὲρ ἀσεβῶν
  choice: für Gottlose
  alternative: zugunsten von Gottlosen
  rationale: „Für“ erhält die theologische Tragweite und lässt zugleich offen, ob der Akzent auf Nutzen, Vertretung oder Stellvertretung liegt; der griechische Ausdruck wird nicht auf eine ausgearbeitete dogmatische Formel verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist gegenüber der markierten griechischen Wortstellung geglättet; „noch“ wird nur einmal ausgedrückt, da eine Wiederholung im Deutschen schwerfällig wäre. „Zur rechten Zeit“ ist geläufig, ohne den Zeitpunkt ausdrücklich als göttlich festgesetzt zu deuten.
