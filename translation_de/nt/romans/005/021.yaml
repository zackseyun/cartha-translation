id: ROM.5.21
reference: Romans 5:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: de
  text: damit, wie die Sünde im Tod[a] herrschte, so auch die Gnade durch Gerechtigkeit zum ewigen Leben herrsche – durch Jesus, den Messias, unseren Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Tod“.'
    reason: ἐν kann hier neben dem Herrschaftsbereich möglicherweise auch das Mittel bezeichnen.
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet natürlich den Zweck- bzw. Folgesatz ein und entspricht dem anschließenden griechischen Konjunktiv.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: geherrscht hat / herrscht
  rationale: Bewahrt die königliche Metapher und gibt zugleich den Wechsel vom Aorist-Indikativ zum von ἵνα abhängigen Konjunktiv in natürlichem Deutsch wieder.
- source_word: ἐν τῷ θανάτῳ
  choice: im Tod
  rationale: Versteht ἐν primär räumlich beziehungsweise als Bezeichnung des Herrschaftsbereichs; die mögliche instrumentale Deutung wird in der Fußnote bewahrt.
- source_word: ἡ χάρις
  choice: die Gnade
  rationale: Die übliche deutsche Wiedergabe bewahrt die Personifikation und den Gegensatz zur Sünde.
- source_word: διὰ δικαιοσύνης
  choice: durch Gerechtigkeit
  rationale: Gibt διά mit Genitiv als Mittel wieder. Das deutsche „Gerechtigkeit“ umfasst hier sowohl den ethisch-rechtlichen als auch den paulinisch-theologischen Bedeutungsbereich.
- source_word: εἰς ζωὴν αἰώνιον
  choice: zum ewigen Leben
  rationale: Bewahrt die Zielrichtung von εἰς in einer knappen, geläufigen deutschen Formulierung.
- source_word: Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: Gibt Χριστός als bedeutungstragenden Titel wieder, statt ihn lediglich als „Christus“ zu transliterieren; die deutsche Kasusform folgt auf „durch“.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseren Herrn
  rationale: Gibt κύριος mit „Herr“ wieder und stellt die Apposition im Deutschen in den Akkusativ.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht beziehungsweise recht schaffendes Handeln
  rationale: „Gerechtigkeit“ lässt im Deutschen die forensische, ethische und heilsgeschichtliche Spannung des griechischen Begriffs offen, ohne sie auf eine einzelne Lehrdeutung festzulegen.
- issue: Χριστός als Titel oder nameähnliche Bezeichnung
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Die Übersetzung als Titel macht den lexikalischen Gehalt von Χριστός sichtbar. Die appositionale Form ist im Deutschen grammatisch klar, ohne eine weitergehende christologische Deutung einzutragen.
- issue: Bezug von διὰ δικαιοσύνης
  choice: Die Gnade herrscht durch Gerechtigkeit
  alternative: Die Gnade führt durch Gerechtigkeit zum ewigen Leben
  rationale: Die unmittelbare Stellung nach βασιλεύσῃ legt den Bezug auf das Herrschen der Gnade nahe; die kompakte Satzstruktur lässt zugleich die Zielangabe „zum ewigen Leben“ bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur „wie … so auch“ und die wiederholte Herrschaftsmetapher bleiben erhalten. Der Gedankenstrich gliedert die abschließende Mittlerformel, ohne ihren syntaktischen Bezug zu lösen.
