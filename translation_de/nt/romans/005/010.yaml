reference: Romans 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: de
  text: Denn wenn wir, als wir Feinde waren, durch den Tod seines Sohnes mit Gott versöhnt wurden, um wie viel mehr werden wir als Versöhnte durch sein Leben[a] gerettet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinem Leben“.'
    reason: Alternative Wiedergabe der möglichen lokativen oder assoziativen Bedeutung von ἐν.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorausgehenden Gedanken, „wenn“ die ausdrücklich konditionale Form der Argumentation.
- source_word: ἐχθροὶ ὄντες
  choice: als wir Feinde waren
  rationale: Die Formulierung gibt den zeitlichen Begleitumstand des Partizips und den relationalen Sinn von ἐχθροί klar und natürlich wieder.
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: mit Gott versöhnt wurden
  rationale: „Versöhnen“ ist die präzise und geläufige Wiedergabe von καταλλάσσω. Das deutsche „mit Gott“ entspricht idiomatisch der durch den Dativ bezeichneten Beziehung, ohne die Richtung des griechischen Passivs umzudeuten.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: durch den Tod seines Sohnes
  rationale: „Durch“ gibt διά mit Genitiv als Mittel wieder; „seines Sohnes“ bewahrt die christologische Bezeichnung ohne erklärenden Zusatz.
- source_word: πολλῷ μᾶλλον
  choice: wie viel mehr
  rationale: Die Wendung erhält die rhetorische Steigerung des paulinischen Schlusses vom Größeren zum umso Gewisseren.
- source_word: καταλλαγέντες
  choice: nachdem wir versöhnt worden sind
  rationale: Der Nebensatz macht deutlich, dass die durch das Aoristpartizip bezeichnete Versöhnung der zukünftigen Rettung vorausgeht.
- source_word: σωθησόμεθα
  choice: werden wir … gerettet werden
  rationale: Das Futur und die passive Form bleiben ausdrücklich erhalten; „gerettet“ ist im Kontext die sachlich passende Wiedergabe von σῴζω.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: durch sein Leben
  rationale: Die instrumentale Wiedergabe passt zum Gegenüber von Tod und Leben und ist im Deutschen natürlich; die mögliche lokative oder assoziative Bedeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von ἐν τῇ ζωῇ αὐτοῦ
  choice: 'instrumental: „durch sein Leben“'
  alternative: 'lokativ/assoziativ: „in seinem Leben“'
  rationale: Der unmittelbare Gegensatz zu „durch den Tod seines Sohnes“ spricht dafür, das Leben des Sohnes als Mittel oder Grundlage der künftigen Rettung zu verstehen. Da ἐν jedoch auch „in“ bedeuten kann, wird diese echte Mehrdeutigkeit nicht beseitigt, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der argumentativen Bewegung des Griechischen, wird aber durch idiomatische Nebensätze verständlich gehalten. Das abschließende Ausrufezeichen bringt die rhetorische Nachdrücklichkeit der Steigerung zum Ausdruck.
