id: ROM.5.9
reference: Romans 5:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: de
  text: Um wie viel mehr werden wir also, nachdem wir jetzt durch sein Blut gerechtfertigt worden sind[a], durch ihn vor dem Zorn gerettet werden![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für gerecht erklärt worden sind“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der im Zusammenhang vorausgesetzte göttliche Zorn; im griechischen Text steht hier nur „der Zorn“.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Um wie viel mehr … also
  rationale: Bewahrt sowohl den folgernden Charakter von οὖν als auch die verstärkende Steigerung πολλῷ … μᾶλλον in natürlichem Deutsch.
- source_word: δικαιωθέντες
  choice: nachdem wir … gerechtfertigt worden sind
  rationale: Gibt das Aorist-Passiv-Partizip als eine der zukünftigen Rettung vorausgehende, abgeschlossene Handlung wieder und wahrt die paulinische Schlüsselterminologie.
- source_word: νῦν
  choice: jetzt
  rationale: Gibt das Zeitadverb unmittelbar wieder und bezeichnet den gegenwärtigen Stand der Gerechtfertigten.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: durch sein Blut
  rationale: ἐν bezeichnet hier idiomatisch Mittel oder Grundlage. „Durch sein Blut“ ist im Deutschen natürlich und erhält den Bezug auf Jesu gewaltsamen Opfertod, ohne ihn auszudeuten.
- source_word: σωθησόμεθα
  choice: werden wir … gerettet werden
  rationale: Wahrt Futur und Passiv und lässt die hier noch zukünftige Dimension der Rettung erkennen.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: Gibt διά mit Genitiv als Vermittlung beziehungsweise Wirksamkeit angemessen wieder.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: vor dem Zorn
  rationale: „Vor … gerettet werden“ ist die natürliche deutsche Verbindung für Rettung aus einer drohenden Gefahr. Der bestimmte Ausdruck bleibt erhalten, ohne „Gottes“ ausdrücklich hinzuzufügen.
theological_decisions:
- issue: Bedeutung von δικαιωθέντες
  choice: „gerechtfertigt worden“ im Haupttext
  alternative: „für gerecht erklärt worden“
  rationale: „Gerechtfertigt“ wahrt die etablierte paulinische Begriffskontinuität, ohne die genaue Wirkweise konfessionell festzulegen; die forensisch verständliche Alternative wird in der Fußnote genannt.
- issue: Bezug von ἡ ὀργή
  choice: „der Zorn“ ohne ausdrückliche Ergänzung
  alternative: „Gottes Zorn“
  rationale: Der Zusammenhang legt den göttlichen Zorn nahe, doch das griechische Substantiv nennt Gott an dieser Stelle nicht ausdrücklich. Die Übersetzung bewahrt diese sprachliche Zurückhaltung.
- issue: Verhältnis von gegenwärtiger Rechtfertigung und zukünftiger Rettung
  choice: „jetzt … gerechtfertigt“ und künftig „gerettet werden“
  alternative: Beide Aussagen unterschiedslos als bereits vollständig vollzogen wiedergeben
  rationale: Die Zeitformen des griechischen Textes unterscheiden eine bereits erfolgte Rechtfertigung von der hier zukünftig bezeichneten Rettung; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die „um wie viel mehr“-Konstruktion bildet Paulus’ Steigerung als Ausruf ab. „Gerechtfertigt“ bleibt als theologischer Schlüsselbegriff stehen; die alternative, stärker erklärende Wiedergabe erscheint in der Fußnote.
