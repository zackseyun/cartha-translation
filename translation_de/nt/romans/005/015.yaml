id: ROM.5.15
reference: Romans 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: de
  text: Doch die Gnadengabe ist nicht wie die Verfehlung. Denn wenn durch die Verfehlung des einen die Vielen starben, ist die Gnade Gottes und die Gabe durch die Gnade[a] des einen Menschen, Jesus, des Messias[b], den Vielen um wie viel mehr im Überfluss zuteilgeworden!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gabe in der Gnade“ beziehungsweise „die Gabe, die aus Gnade kam“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jesus Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: Verfehlung
  rationale: „Verfehlung“ bezeichnet verständlich eine schuldhafte Tat oder Übertretung und bewahrt den moralischen Gehalt, ohne unnötig juristisch zu klingen.
- source_word: χάρισμα
  choice: Gnadengabe
  rationale: „Gnadengabe“ stellt den von Paulus beabsichtigten Gegensatz zur Verfehlung klar heraus und gibt den Zusammenhang des Geschenks mit der Gnade wieder.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: die Vielen / den Vielen
  rationale: Der bestimmte Artikel und der rhetorische Gegensatz zwischen dem einen und den Vielen bleiben erhalten; der Ausdruck wird nicht deutend zu „alle“ erweitert.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: die Gnade Gottes
  rationale: Die formale Genitivkonstruktion bewahrt die Parallelität des griechischen Satzes.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: die Gabe durch die Gnade
  rationale: Das instrumentale Verständnis von ἐν ergibt klares Deutsch; eine Fußnote hält die mögliche stärker assoziative Fassung offen.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: des einen Menschen
  rationale: Die bestimmte, betonte Form wahrt den Gegensatz zwischen dem einen Menschen und den Vielen.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός wird als hörbarer Titel „Messias“ wiedergegeben; die Genitiv-Apposition bildet die griechische Konstruktion im Deutschen natürlich ab.
- source_word: ἐπερίσσευσεν
  choice: überreich zuteilgeworden
  rationale: Die Formulierung bringt sowohl den Überschuss von περισσεύω als auch die auf die Vielen gerichtete Bewegung von εἰς zum Ausdruck.
theological_decisions:
- issue: Reichweite von „die Vielen“ im Adam-Messias-Vergleich
  choice: Die bestimmte Wendung „die Vielen“ bleibt stehen.
  alternative: „alle“
  rationale: Paulus formuliert hier bewusst den Gegensatz zwischen dem einen und den Vielen. Eine Wiedergabe mit „alle“ würde die Aussage dieses einzelnen Verses anhand weitergehender theologischer Folgerungen vereindeutigen.
- issue: Verhältnis von Gottes Gnade und der Gnade des einen Menschen
  choice: Die koordinierte Formulierung des griechischen Textes bleibt erhalten.
  alternative: Beide Ausdrücke ausdrücklich zu einer einzigen Gnadenwirkung zusammenziehen.
  rationale: Der Satz nennt sowohl „die Gnade Gottes“ als auch „die Gabe durch die Gnade des einen Menschen“. Die Übersetzung bewahrt diese spannungsreiche Struktur, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gnadengabe“ und „Verfehlung“ sind bibelsprachlich anschlussfähig, aber allgemein verständlich. Der Ausruf am Satzende gibt die gesteigerte πολλῷ μᾶλλον-Konstruktion natürlich wieder; die ungewöhnliche paulinische Satzspannung bleibt erhalten.
