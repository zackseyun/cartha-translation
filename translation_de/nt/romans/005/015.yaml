  terminology: „Gnadengabe“, „Verfehlung“, „die Vielen“, „Gnade Gottes“ und „Messias“ sind geeignete, moderne und zugleich textnahe Wiedergaben. „Jesus, des Messias“ ist hier als genitivische Apposition zu verstehen; die Fußnote bietet weiterhin die etablierte Namensform „Jesus Christus“ an.
