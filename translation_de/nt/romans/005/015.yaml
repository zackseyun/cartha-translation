  to: Doch die Gnadengabe ist nicht wie die Verfehlung. Denn wenn durch die Verfehlung des einen die Vielen starben, ist die Gnade Gottes und die Gabe durch die Gnade[a] des einen Menschen, Jesus, des Messias[b], den Vielen um wie viel mehr im Überfluss zuteilgeworden!
