id: ROM.5.13
reference: Romans 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: de
  text: Denn bis zum Gesetz war die Sünde in der Welt; die Sünde wird aber nicht angerechnet[a], wenn kein Gesetz da ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugerechnet“; auch: „jemandem in Rechnung gestellt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι
  choice: bis zu
  rationale: Die Präposition bezeichnet den Zeitraum bis zum Auftreten beziehungsweise zur Gabe des Gesetzes; die Verbindung „bis zum Gesetz“ gibt dies knapp und natürlich wieder.
- source_word: νόμου
  choice: das Gesetz
  rationale: Im Zusammenhang von Römer 5, besonders der Zeitspanne von Adam bis Mose, ist wahrscheinlich das mosaische Gesetz gemeint. Der bestimmte Artikel ist im Deutschen für diesen bekannten Bezug idiomatisch.
- source_word: ἁμαρτία
  choice: die Sünde
  rationale: Der Singular bezeichnet bei Paulus die Sünde als Größe und kann zugleich ihre ansatzweise personifizierte Kraft anklingen lassen.
- source_word: ἐν κόσμῳ
  choice: in der Welt
  rationale: Diese unmittelbare und geläufige Wiedergabe bezeichnet die menschliche Welt, in der die Sünde gegenwärtig war.
- source_word: ἐλλογεῖται
  choice: wird angerechnet
  rationale: Das Verb hat einen buchhalterischen beziehungsweise zurechnenden Sinn. „Angerechnet“ bewahrt diesen Bedeutungsgehalt, ohne im Haupttext einen stärker dogmatisch geprägten Fachausdruck zu verwenden.
- source_word: μὴ ὄντος νόμου
  choice: wenn kein Gesetz da ist
  rationale: Der Genitivus absolutus bezeichnet die Abwesenheit von Gesetz als Bedingung. „Wenn“ gibt diesen konditionalen Zusammenhang im Deutschen klar wieder.
theological_decisions:
- issue: Bezug von νόμος in der Argumentation des Paulus
  choice: „das Gesetz“, mit durch den Kontext naheliegendem Bezug auf das mosaische Gesetz
  alternative: „Gesetz“ in einem allgemeineren Sinn
  rationale: Der Kontext stellt die Zeit von Adam bis Mose der späteren Gesetzesgabe gegenüber. Die Übersetzung lässt diesen wahrscheinlichen Bezug erkennen, ohne „mosaisch“ ausdrücklich in den Text einzufügen.
- issue: Bedeutungsstärke von ἐλλογεῖται
  choice: „wird angerechnet“
  alternative: „wird zugerechnet“ oder „wird jemandem auf sein Konto geschrieben“
  rationale: Die Formulierung wahrt das Bild der Verrechnung und lässt offen, wie diese Aussage im Einzelnen theologisch auf die Zeit vor Mose zu beziehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Gegenüberstellung, ist jedoch natürlich lesbar. Die Wiederholung von „die Sünde“ wird bewahrt, da sie die argumentative Struktur und den möglichen personifizierenden Unterton trägt.
