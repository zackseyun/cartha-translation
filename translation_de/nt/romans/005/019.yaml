id: ROM.5.19
reference: Romans 5:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: de
  text: Denn wie durch den Ungehorsam des einen Menschen die Vielen zu Sündern gemacht wurden[a], so werden auch durch den Gehorsam des einen Menschen[b] die Vielen zu Gerechten gemacht werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Sünder eingesetzt wurden“ beziehungsweise „zu Sündern bestimmt wurden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch den Gehorsam des Einen“; „Menschen“ ist aus dem ersten Satzteil ergänzt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als Gerechte eingesetzt werden“ beziehungsweise „zu Gerechten bestimmt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: Ungehorsam
  rationale: Bezeichnet das Nichtgehorchen und bildet im Deutschen den direkten, natürlichen Gegensatz zu ὑπακοή („Gehorsam“).
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: des einen Menschen
  rationale: Artikel und Zahlwort kennzeichnen im Zusammenhang den einen repräsentativen Menschen; „Mensch“ gibt ἄνθρωπος ohne unnötige Verengung wieder.
- source_word: ἁμαρτωλοὶ
  choice: Sünder
  rationale: Das Adjektiv wird hier prädikativ und substantivisch gebraucht; „Sünder“ ist die klare, geläufige Wiedergabe.
- source_word: κατεστάθησαν
  choice: wurden … gemacht
  rationale: καθίστημι bezeichnet hier das Versetzen beziehungsweise Konstituieren in einen Stand. Die Formulierung ist verständlich und wahrt die Parallelität mit dem Futur im zweiten Satzteil.
- source_word: οἱ πολλοί
  choice: die Vielen
  rationale: Die Wiedergabe erhält den bestimmten Artikel und lässt die theologisch umstrittene Reichweite der Wendung offen.
- source_word: ὑπακοῆς
  choice: Gehorsam
  rationale: Die natürliche Entsprechung bewahrt den ausdrücklichen Gegensatz zu παρακοή („Ungehorsam“).
- source_word: τοῦ ἑνὸς
  choice: des einen Menschen
  rationale: Im zweiten Satzteil steht wörtlich nur „des Einen“; „Menschen“ wird aus dem streng parallelen ersten Satzteil ergänzt, damit der Bezug im Deutschen klar bleibt.
- source_word: δίκαιοι
  choice: Gerechte
  rationale: Das prädikativ gebrauchte Adjektiv wird substantivisch wiedergegeben und bewahrt den paulinischen Wortstamm rund um Gerechtigkeit.
- source_word: κατασταθήσονται
  choice: werden … gemacht werden
  rationale: Das Futur Passiv spiegelt κατεστάθησαν. Die Wiedergabe vermeidet die engere Deutung „für gerecht erklärt“, da hier nicht δικαιόω steht.
theological_decisions:
- issue: Reichweite von οἱ πολλοί
  choice: die Vielen
  alternative: alle; viele Menschen
  rationale: Die Übersetzung bewahrt Paulus’ bestimmte Formulierung, ohne ihre Reichweite auslegend festzulegen.
- issue: Bedeutung von κατασταθήσονται δίκαιοι
  choice: zu Gerechten gemacht werden
  alternative: für gerecht erklärt werden; als Gerechte eingesetzt werden
  rationale: Die gewählte Fassung folgt καθίστημι mit δίκαιοι und lässt offen, wie genau dieses Zum-Gerechten-Machen dogmatisch zu bestimmen ist.
- issue: Ergänzung von ἄνθρωπος im zweiten Satzteil
  choice: des einen Menschen
  alternative: des Einen
  rationale: Die Ergänzung macht die im Griechischen durch die Parallelkonstruktion eindeutige Beziehung im Deutschen natürlich verständlich, ohne einen neuen Referenten einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst parallele Satzstruktur bildet den Adam-Christus-Gegensatz ab; „die Vielen“ und die Zustands- beziehungsweise Statussprache bleiben ohne konfessionelle Präzisierung erhalten.
