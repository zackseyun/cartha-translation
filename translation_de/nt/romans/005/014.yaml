review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn des griechischen Textes wird im Wesentlichen getroffen: Der Tod wird personifiziert als Herrschender, der Zeitraum von Adam bis Mose bleibt erhalten, und Adam wird als typologische Entsprechung zu dem Kommenden bezeichnet. Die Formulierung „wie Adam mit seiner Übertretung“ bildet jedoch ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ nicht idiomatisch und kann den Bezug von „seiner Übertretung“ unnötig verwischen. „selbst über“ gibt die hervorhebende Reichweite von καὶ ἐπί besser wieder als „auch über“.'
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. Die beanstandete Vergleichsformulierung ist jedoch syntaktisch schwerfällig. „nicht auf die gleiche Weise wie Adam eine Übertretung begangen hatten“ ist klarer und bewahrt zugleich die Unterscheidung zwischen „sündigen“ und Adams „Übertretung“.
  terminology: '„Tod herrschte“, „Übertretung“ und „Vorausbild“ sind angemessen. „Vorausbild“ ist für τύπος verständlich und wahrt den typologischen Charakter, ohne die Identität des Kommenden im Haupttext auszuformulieren. Die Fußnote zu b sollte eine tatsächlich gleichwertige deutsche Umschreibung bieten; „desjenigen, der kommen wird“ vermeidet die unnötige Vergangenheitsmodalität von „kommen sollte“. Im englischen Audit-Trail sind die Fußnotenanker offenbar vertauscht: [a] steht nach „Moses“, erläutert aber „type“, und [b] steht nach „transgression“, erläutert aber „the coming one“. Die deutschen Anker sind dagegen sachlich korrekt gesetzt.'
  issues:
  - severity: medium
    issue: Unidiomatische und potenziell missverständliche Wiedergabe des Vergleichs mit Adams Übertretung
    rationale: „die nicht in der gleichen Weise sündigten wie Adam mit seiner Übertretung“ klingt im Deutschen nicht natürlich und lässt den syntaktischen Bezug von „mit seiner Übertretung“ unscharf. Der griechische Ausdruck meint, dass ihr Sündigen nicht der Art von Adams Übertretung entsprach.
  - severity: low
    issue: Abschwächung der Hervorhebung in καὶ ἐπί
    rationale: „auch über“ ist möglich, doch „selbst über“ gibt die im Kontext überraschende Ausdehnung der Herrschaft des Todes prägnanter wieder.
  - severity: low
    issue: Die alternative Fußnotenformulierung zu τοῦ μέλλοντος ist zeitlich weniger genau
    rationale: „dessen, der kommen sollte“ kann im Deutschen eine vergangenheitsbezogene Erwartung ausdrücken. „desjenigen, der kommen wird“ ist als Alternative zu „des Kommenden“ klarer.
  revised_text: Doch der Tod herrschte von Adam bis Mose, selbst über diejenigen, die nicht auf die gleiche Weise wie Adam eine Übertretung begangen hatten. Adam ist ein Vorausbild[a] des Kommenden[b].
