id: ROM.5.14
reference: Romans 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: de
  text: Doch der Tod herrschte von Adam bis Mose, selbst über diejenigen, die nicht auf die gleiche Weise wie Adam eine Übertretung begangen hatten. Adam ist ein Vorausbild[a] des Kommenden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Typus, ein Muster oder eine Vorabbildung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: desjenigen, der kommen wird. Gemeint ist im Zusammenhang Christus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zum vorhergehenden Gedanken und klingt im modernen Deutschen natürlich.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: der Tod herrschte
  rationale: Bewahrt das Bild des Todes als personifizierter Herrscher.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: von Adam bis Mose
  rationale: Gibt die zeitliche Spanne knapp und idiomatisch wieder.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: auch über die, die nicht … sündigten
  rationale: ἐπί bezeichnet hier den Herrschaftsbereich des Todes; »auch« hebt dessen überraschende Ausdehnung hervor.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: in der gleichen Weise … wie Adam mit seiner Übertretung
  rationale: Gibt die Vergleichsbeziehung verständlich wieder, ohne näher festzulegen, worin die Ähnlichkeit oder Unähnlichkeit genau besteht.
- source_word: παράβασις
  choice: Übertretung
  rationale: Bewahrt den Gedanken, dass ein Gebot beziehungsweise eine gesetzte Grenze überschritten wird.
- source_word: τύπος
  choice: Vorausbild
  rationale: Drückt die typologische Entsprechung im Deutschen verständlicher als das fachsprachliche »Typus« aus, ohne Adam bloß zu einem Beispiel zu machen.
- source_word: τοῦ μέλλοντος
  choice: des Kommenden
  rationale: Bewahrt die substantivierte und nicht ausdrücklich benannte Gestalt der griechischen Formulierung.
theological_decisions:
- issue: Bezug von τοῦ μέλλοντος
  choice: »des Kommenden« im Haupttext; Christus wird nur in der Fußnote als kontextueller Bezug genannt
  alternative: »des Christus, der kommen sollte« oder allgemein »dessen, der kommen sollte«
  rationale: Römer 5,12–21 weist auf Christus als Gegenüber Adams, doch der griechische Text nennt ihn an dieser Stelle nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung.
- issue: Art der Sünde der Menschen zwischen Adam und Mose
  choice: Der Vergleich wird als »nicht in der gleichen Weise … wie Adam« formuliert
  alternative: »nicht mit einer Übertretung wie der Adams sündigten«
  rationale: Die gewählte Formulierung bleibt nahe an ὁμοίωμα, legt aber nicht vorschnell fest, ob ausschließlich ein fehlendes ausdrückliches Gebot oder ein anderer Gesichtspunkt des Vergleichs gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Personifikation des Todes und die Adam-Christus-Typologie bleiben erhalten; erklärende Präzisierungen werden in die Fußnoten verwiesen.
