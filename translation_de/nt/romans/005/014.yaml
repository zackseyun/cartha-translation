revisions:
- from: Doch der Tod herrschte von Adam bis Mose, auch über die, die nicht in der gleichen Weise sündigten wie Adam mit seiner Übertretung. Adam ist ein Vorausbild[a] des Kommenden[b].
  to: Doch der Tod herrschte von Adam bis Mose, selbst über diejenigen, die nicht auf die gleiche Weise wie Adam eine Übertretung begangen hatten. Adam ist ein Vorausbild[a] des Kommenden[b].
  rationale: Die Revision verbessert die deutsche Syntax und die Hervorhebung der Aussage, ohne den umstrittenen beziehungsweise nicht weiter ausgeführten Charakter des Vergleichs näher zu bestimmen. Der Haupttext nennt Christus weiterhin nicht ausdrücklich. Die Fußnotenanker bleiben unmittelbar bei den jeweils erläuterten Begriffen.
