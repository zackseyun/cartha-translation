id: ROM.5.11
reference: Romans 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: de
  text: 'Und nicht nur das: Wir rühmen uns auch Gottes durch unseren Herrn Jesus, den Messias,[a] durch den wir jetzt die Versöhnung empfangen haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Christos; traditionell „Christus“.
    reason: alternative_reading
lexical_decisions:
- source_word: καυχώμενοι
  choice: wir rühmen uns
  rationale: Die Wendung gibt das positive, auf Gott gerichtete Rühmen unmittelbar wieder. Im Deutschen kann „sich Gottes rühmen“ anders als gewöhnliche Prahlerei einen berechtigten, freudigen Stolz ausdrücken.
- source_word: ἐν τῷ θεῷ
  choice: Gottes
  rationale: Der Genitiv nach „sich rühmen“ ist im Deutschen die natürliche Entsprechung und bezeichnet Gott als Grund und Gegenstand des Rühmens.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: durch unseren Herrn Jesus, den Messias
  rationale: „Herr“ ist die übliche christologische Wiedergabe von κύριος. „Messias“ macht den Titelgehalt von Χριστός transparent; die Apposition mit Artikel ist idiomatisches Deutsch.
- source_word: τὴν καταλλαγὴν
  choice: die Versöhnung
  rationale: „Versöhnung“ bezeichnet die in den vorangehenden Versen beschriebene Wiederherstellung der Beziehung zu Gott. Der bestimmte Artikel bleibt erhalten.
- source_word: νῦν … ἐλάβομεν
  choice: jetzt … empfangen haben
  rationale: Das Perfekt ist im Deutschen zusammen mit „jetzt“ idiomatisch und bringt den gegenwärtigen Besitz als Ergebnis des empfangenen Versöhnungshandelns zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ als christologischer Titel
  choice: den Messias
  alternative: Christus
  rationale: Χριστός trägt hier Titelcharakter. „Messias“ legt seine Bedeutung offen, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Bezug des Rühmens
  choice: wir rühmen uns Gottes
  alternative: wir freuen uns an Gott
  rationale: Die Übersetzung bewahrt die markante paulinische Rühmterminologie und macht zugleich deutlich, dass Gott selbst und nicht menschliche Leistung der Grund des Rühmens ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den unvollständigen Anschluss „nicht nur das“ natürlich. Die Formulierung „sich Gottes rühmen“ ist bewusst gehoben, aber verständlich und bewahrt die paulinische Ausdrucksweise.
