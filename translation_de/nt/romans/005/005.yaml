id: ROM.5.5
reference: Romans 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: de
  text: Und die Hoffnung lässt uns nicht zuschanden werden[a], denn die Liebe Gottes[b] ist durch den Heiligen Geist, der uns gegeben wurde, in unsere Herzen ausgegossen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „enttäuscht uns nicht.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, weniger wahrscheinlich: „unsere Liebe zu Gott.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: die Hoffnung
  rationale: Die übliche und im Zusammenhang natürliche Wiedergabe; der Artikel bezeichnet die Hoffnung allgemein.
- source_word: δέ
  choice: Und
  rationale: Gibt die leichte Weiterführung wieder, ohne einen stärkeren Gegensatz zu behaupten.
- source_word: καταισχύνει
  choice: lässt uns nicht zuschanden werden
  rationale: Bewahrt den Scham- und Ehraspekt des Verbs und ist zugleich in modernem Deutsch verständlich; die sinngemäßere Alternative „enttäuscht uns nicht“ steht in der Fußnote.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: die Liebe Gottes
  rationale: Bewahrt die Form des griechischen Genitivs. Im Kontext ist vor allem Gottes Liebe zu uns gemeint, doch die formal mögliche Deutung als Liebe zu Gott wird in einer Fußnote erhalten.
- source_word: ἐκκέχυται
  choice: ist … ausgegossen worden
  rationale: Das Perfekt bezeichnet ein vollzogenes Geschehen mit fortdauernder Wirkung; das deutsche Perfekt bildet dies natürlich ab.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: in unsere Herzen
  rationale: Bei „ausgießen“ ist im Deutschen die Richtungsangabe mit Akkusativ idiomatisch und vermittelt denselben Ziel- und Innenraumbezug.
- source_word: διὰ πνεύματος ἁγίου
  choice: durch den Heiligen Geist
  rationale: διά mit Genitiv bezeichnet hier das Mittel beziehungsweise die Vermittlung.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: der uns gegeben wurde
  rationale: Der attributive Partizipialsatz bezieht sich auf den Heiligen Geist; der Relativsatz ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Bedeutung des Genitivs in ἡ ἀγάπη τοῦ θεοῦ
  choice: Gottes Liebe zu uns, im Haupttext formal als „die Liebe Gottes“ wiedergegeben
  alternative: unsere Liebe zu Gott
  rationale: Die Begründung im unmittelbaren Kontext – diese Liebe ist durch den gegebenen Heiligen Geist in die Herzen ausgegossen – spricht stärker für Gottes Liebe zu den Glaubenden. Die echte grammatische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zuschanden werden“ bewahrt die Bild- und Bedeutungswelt von Scham und Ehre, ohne altertümliche Satzbildung; die geläufigere Deutung „enttäuscht uns nicht“ wird ergänzend genannt.
