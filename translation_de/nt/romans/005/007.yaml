source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: de
  text: Denn kaum wird jemand für einen Gerechten[a][b] sterben; vielleicht wagt jemand sogar, für einen guten Menschen zu sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „für einen gerechten Mann“. Die griechische Form ist grammatisch männlich, kann hier aber allgemein einen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Gegenüberstellung von „gerecht“ und „gut“ kann bewusst gemeint sein und muss nicht nur stilistische Variation sein.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: kaum
  rationale: Gibt die Seltenheit bzw. äußerste Unwahrscheinlichkeit einer solchen Handlung knapp und idiomatisch wieder.
- source_word: ὑπὲρ
  choice: für
  rationale: Bezeichnet hier ein Sterben zugunsten beziehungsweise anstelle eines anderen; „für“ ist im Deutschen natürlich und lässt diese Bedeutungsweite offen.
- source_word: δικαίου
  choice: einen Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet einen Menschen, der als gerecht gilt. „Gerechter“ bewahrt die ethisch-theologische Wortgruppe um Gerechtigkeit.
- source_word: ἀποθανεῖται
  choice: wird … sterben
  rationale: Bewahrt die Futurform des Griechischen in der allgemeinen Aussage.
- source_word: τοῦ ἀγαθοῦ
  choice: einen guten Menschen
  rationale: Bewahrt den möglichen Unterschied zwischen dem Gerechten und dem Guten und klingt zugleich natürlich im modernen Deutsch.
- source_word: τάχα
  choice: vielleicht
  rationale: Drückt eine vorsichtige Möglichkeit aus, ohne sie als wahrscheinlich darzustellen.
- source_word: καὶ
  choice: sogar
  rationale: Das steigernde καί hebt hervor, wie außergewöhnlich ein solcher Entschluss wäre.
- source_word: τολμᾷ
  choice: wagt
  rationale: Gibt das gegenwärtige Verb in der verallgemeinernden Aussage direkt und idiomatisch wieder.
- source_word: ἀποθανεῖν
  choice: zu sterben
  rationale: Direkte Wiedergabe des Infinitivs; die Wiederholung des Sterbens bleibt erhalten.
theological_decisions:
- issue: Möglicher Bedeutungsunterschied zwischen δικαίου und ἀγαθοῦ
  choice: Unterschiedlich als „einen Gerechten“ und „einen guten Menschen“ wiedergeben.
  alternative: Beide Ausdrücke als weitgehend gleichbedeutend behandeln und den Unterschied sprachlich einebnen.
  rationale: Der griechische Text verwendet verschiedene Begriffe. Die Übersetzung bewahrt diese mögliche bewusste Gegenüberstellung, ohne genauer festzulegen, worin der Unterschied besteht.
- issue: Bedeutung von ὑπέρ beim Sterben
  choice: Mit dem offenen deutschen „für“ übersetzen.
  alternative: Ausdrücklich „anstelle von“ oder „zugunsten von“ schreiben.
  rationale: „Für“ kann sowohl stellvertretende als auch zugunsten einer Person geschehende Hingabe ausdrücken und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang; „Gerechter“ erhält die paulinische Gerechtigkeitsterminologie, während „guter Mensch“ im heutigen Deutsch klar und natürlich ist.
