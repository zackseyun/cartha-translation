source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: de
  text: Das Gesetz aber kam hinzu[a], damit die Verfehlung[b] zunehme. Doch wo die Sünde zunahm, da strömte die Gnade noch viel mehr über[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „trat zusätzlich ein“; das griechische Verb bezeichnet ein Hinzukommen neben etwas bereits Vorhandenem.
    reason: lexical_alternative
  - marker: b
    text: Oder „die Übertretung“ oder „das Vergehen“.
    reason: lexical_alternative
  - marker: c
    text: Oder „da war die Gnade noch viel überreicher“.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: das Gesetz
  rationale: Der Artikel und der paulinische Zusammenhang weisen am natürlichsten auf das mosaische Gesetz; die bestimmte Form bewahrt diesen konkreten Bezug.
- source_word: παρεισῆλθεν
  choice: kam hinzu
  rationale: Die Wendung ist im modernen Deutsch natürlich und gibt den Gedanken eines zusätzlichen Hinzukommens wieder; die im Präfix liegende Vorstellung des Danebeneintretens wird in der Fußnote erläutert.
- source_word: ἵνα πλεονάσῃ
  choice: damit ... zunahm
  rationale: „Damit“ wahrt den finalen Sinn von ἵνα mit Konjunktiv, ohne die theologische Spannung durch eine bloße Folgewiedergabe abzuschwächen.
- source_word: τὸ παράπτωμα
  choice: die Verfehlung
  rationale: „Verfehlung“ bezeichnet eine konkrete schuldhafte Tat und passt zum Rückblick auf Adams Verfehlung, ohne unnötig altertümlich zu wirken.
- source_word: οὗ
  choice: wo ... da
  rationale: Die deutsche Korrelativkonstruktion gibt den adverbialen Relativanschluss klar und idiomatisch wieder.
- source_word: ἁμαρτία
  choice: die Sünde
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe des paulinischen Begriffs.
- source_word: ὑπερεπερίσσευσεν
  choice: strömte ... noch viel mehr über
  rationale: Das Bild des Überströmens vermittelt die starke Steigerung des zusammengesetzten Verbs und bildet einen deutlichen Kontrast zum bloßen Zunehmen der Sünde.
- source_word: ἡ χάρις
  choice: die Gnade
  rationale: „Gnade“ ist die klare, etablierte und in diesem Zusammenhang sachlich genaue Wiedergabe.
theological_decisions:
- issue: Ob ἵνα als Zweck oder lediglich als Folge wiederzugeben ist
  choice: „damit die Verfehlung zunahm“
  alternative: „sodass die Verfehlung zunahm“
  rationale: Die Zweckkonstruktion entspricht der griechischen Syntax und bewahrt Paulus’ theologische Spannung. Der Wortlaut behauptet keine moralische Billigung der Sünde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kam hinzu“ vermeidet eine schwerfällige wörtliche Nachbildung, während die Fußnote die Präfixbedeutung sichert. Die starke Steigerung im Schlusssatz bleibt durch „noch viel mehr über“ hörbar.
