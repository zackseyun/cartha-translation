    rationale: „Gerechter Freispruch“ legt δικαιοσύνη in diesem Kontext stärker forensisch aus, als der Haupttext und das griechische Wort selbst verlangen. Als kontextuelle Alternative kann „Rechtfertigung“ genannt werden, ohne die Grundbedeutung festzulegen.
