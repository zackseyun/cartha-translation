  to: Denn wenn durch die Verfehlung des einen der Tod durch den einen herrschte, wie viel mehr werden die, die die Fülle der Gnade und die Gabe der Gerechtigkeit[a] empfangen, im Leben durch den einen, Jesus Christus[b], herrschen.
