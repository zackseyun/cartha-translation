id: ROM.5.17
reference: Romans 5:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: de
  text: Denn wenn durch die Verfehlung des einen der Tod durch den einen herrschte, wie viel mehr werden die, die die Fülle der Gnade und die Gabe der Gerechtigkeit[a] empfangen, im Leben durch den einen, Jesus Christus[b], herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Zusammenhang: „die Gabe der Rechtfertigung“.'
    reason: contextual_alternative
  - marker: b
    text: 'Oder: „Jesus, den Messias“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: Verfehlung
  rationale: „Verfehlung“ gibt den Gedanken eines Fehltritts beziehungsweise einer Übertretung natürlich wieder und passt zum Adam-Christus-Gegensatz.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: zur Herrschaft kam / herrschen
  rationale: Beide Wiedergaben bewahren die königliche Herrschaftsmetapher; die erste Formulierung vermeidet im Deutschen die missverständliche Aussage, der Tod habe als König regiert.
- source_word: περισσείαν τῆς χάριτος
  choice: die Gnade in überreichem Maß
  rationale: Die Formulierung gibt die Fülle beziehungsweise das Übermaß der Gnade idiomatisch wieder, ohne das griechische Genitivgefüge unnötig nachzubilden.
- source_word: χάριτος
  choice: Gnade
  rationale: „Gnade“ ist die etablierte und im paulinischen Zusammenhang sachgerechte Wiedergabe für göttliche unverdiente Zuwendung.
- source_word: δωρεᾶς
  choice: Gabe
  rationale: „Gabe“ wahrt den Geschenkcharakter; ein Zusatz wie „freie“ ist wegen des unmittelbaren Gnadenbezugs nicht nötig.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ wahrt die in diesem Rechtfertigungszusammenhang zentrale Bedeutung und lässt zugleich offen, ob die Gabe als zugesprochener Status oder als heilvolle rechte Ordnung näher zu bestimmen ist.
- source_word: λαμβάνοντες
  choice: empfangen
  rationale: Das Präsens bezeichnet die Menschen als solche, die diese Fülle und Gabe empfangen; „empfangen“ ist dabei natürlicher und weniger willensbetont als „annehmen“.
- source_word: ἐν ζωῇ
  choice: im Leben
  rationale: Die knappe Formulierung bewahrt den bewussten Gegensatz zur Herrschaft des Todes und legt die genaue Reichweite des Lebens nicht fest.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: In dieser festen Verbindung nach dem persönlichen Namen ist „Christus“ im Deutschen natürlich und wahrt zugleich den messianischen Titel, der in der Fußnote ausdrücklich genannt wird.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη in der Wendung „Gabe der Gerechtigkeit“
  choice: Gabe der Gerechtigkeit
  alternative: Gabe des gerechten Freispruchs / Gabe der Rechtfertigung
  rationale: Der allgemeinere Ausdruck bewahrt die lexikalische Breite und vermeidet es, die Gabe ausschließlich als forensischen Freispruch oder als sittliche Erneuerung festzulegen.
- issue: Wiedergabe von Χριστός
  choice: Jesus Christus
  alternative: Jesus, der Messias
  rationale: „Jesus Christus“ ist in dieser Namens-Titel-Verbindung die natürliche deutsche Form. Die Alternative macht den Titelcharakter transparent, ohne ihn im Haupttext gegen die etablierte Form auszuspielen.
- issue: Subjekt der künftigen Herrschaft
  choice: Die Empfangenden werden im Leben herrschen
  alternative: Das Leben wird über sie herrschen
  rationale: Das grammatische Subjekt des Futurs sind ausdrücklich die Empfangenden; diese überraschende Umkehr gegenüber der Herrschaft des Todes wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange paulinische Vergleichsstruktur bleibt erhalten, wird aber durch Kommas und „dann“ lesbar gegliedert. Die Wiederholung „des einen / durch den einen“ wird bewusst bewahrt, weil sie den Adam-Christus-Kontrast trägt.
