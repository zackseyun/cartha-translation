revisions:
- from: 'Also gilt: Wie es durch eine einzige Verfehlung für alle Menschen zur Verurteilung kam, so kam es auch durch eine einzige gerechte Tat für alle Menschen zum Freispruch, der Leben bringt.[a]'
  to: 'So gilt: Wie es durch eine einzige Verfehlung für alle Menschen zur Verurteilung kam, so kam es auch durch eine einzige gerechte Tat für alle Menschen zur Rechtfertigung, die zum Leben führt.[a]'
  rationale: Die Änderung beschränkt sich auf die fachlich und kontextuell angemessenere Wiedergabe von δικαίωσις als „Rechtfertigung“ sowie eine geringfügig idiomatischere Einleitung. Die Wiederholung von „alle Menschen“ und die im Text bestehende theologische Spannung bleiben unverändert erhalten.
