review_pass:
  verdict: revise
  source_fidelity: 'Die Parallelstruktur, die zweimalige uneingeschränkte Reichweite „alle Menschen“, das gerichtliche κατάκριμα („Verurteilung“) und die konkrete „eine gerechte Tat“ geben den griechischen Text sachgerecht wieder. Die Wiedergabe von δικαίωσις als „Freispruch“ ist jedoch zu eng: Ein Freispruch kann im Deutschen eine bloße Feststellung fehlender Schuld bezeichnen, während δικαίωσις hier die paulinische Rechtfertigung im Gegenüber zur Verurteilung benennt.'
  naturalness: Der Satz ist in modernem Standarddeutsch gut verständlich und bewahrt den erkennbaren Parallelismus. „Also gilt“ ist möglich; „So gilt“ ist etwas unmittelbarer und weniger formelhaft. „Rechtfertigung, die zum Leben führt“ ist natürlich und verständlich.
  terminology: „Rechtfertigung“ sollte als etablierte und semantisch passendere Wiedergabe von δικαίωσις beibehalten werden. Sie wahrt zugleich die Verbindung zum theologischen Sprachgebrauch, ohne eine konfessionelle Deutung hinzuzufügen. Die Fußnote kann die genitivische, wörtlichere Form transparent machen.
  issues:
  - severity: medium
    issue: δικαίωσις wird mit „Freispruch“ wiedergegeben.
    rationale: „Freispruch“ verengt den Begriff auf einen möglichen deutschen Rechtsausgang und kann nahelegen, dass lediglich keine Schuld festgestellt werde. „Rechtfertigung“ trifft die paulinische Terminologie und die Kontrastrelation zu κατάκριμα verlässlicher.
  revised_text: 'So gilt: Wie es durch eine einzige Verfehlung für alle Menschen zur Verurteilung kam, so kam es auch durch eine einzige gerechte Tat für alle Menschen zur Rechtfertigung, die zum Leben führt.[a]'
  revised_footnotes:
  - marker: a
    text: 'Wörtlicher: „zur Rechtfertigung des Lebens“.'
    reason: lexical_alternative
  revision_rationale: Die Änderung beschränkt sich auf die fachlich und kontextuell angemessenere Wiedergabe von δικαίωσις als „Rechtfertigung“ sowie eine geringfügig idiomatischere Einleitung. Die Wiederholung von „alle Menschen“ und die im Text bestehende theologische Spannung bleiben unverändert erhalten.
