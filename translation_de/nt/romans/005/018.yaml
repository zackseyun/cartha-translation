reference: Romans 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: de
  text: 'So gilt: Wie es durch eine einzige Verfehlung für alle Menschen zur Verurteilung kam, so kam es auch durch eine einzige gerechte Tat für alle Menschen zur Rechtfertigung, die zum Leben führt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zur Rechtfertigung des Lebens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Also gilt
  rationale: Gibt die folgernde Kraft der doppelten Konjunktion in natürlichem, gehobenem Gegenwartsdeutsch wieder.
- source_word: παραπτώματος
  choice: Verfehlung
  rationale: Bezeichnet eine konkrete schuldhafte Übertretung und wahrt den Gegensatz zur einen gerechten Tat.
- source_word: κατάκριμα
  choice: Verurteilung
  rationale: Bewahrt den gerichtlichen Sinn des griechischen Ausdrucks und passt idiomatisch zur Konstruktion „zur Verurteilung kommen“.
- source_word: δικαιώματος
  choice: gerechte Tat
  rationale: Der Singular bezeichnet im Kontext die eine entscheidende Tat Christi; die Wiedergabe bleibt konkret und vermeidet eine unnötige dogmatische Präzisierung.
- source_word: δικαίωσιν ζωῆς
  choice: Freispruch, der Leben bringt
  rationale: „Freispruch“ vermittelt hier die forensische Kraft von δικαίωσις verständlich; der Relativsatz gibt die wahrscheinlich resultative Beziehung des Genitivs ζωῆς wieder, ohne die wörtlichere Lesart zu verschweigen.
- source_word: πάντας ἀνθρώπους
  choice: alle Menschen
  rationale: Gibt den inklusiven und in beiden Satzhälften identisch formulierten Umfang unmittelbar wieder.
theological_decisions:
- issue: Ob das zweite „alle Menschen“ zur Vermeidung eines universalen Anscheins eingeengt werden soll
  choice: In beiden Satzhälften steht uneingeschränkt „alle Menschen“.
  alternative: „alle, die glauben“ oder „alle Gerechtfertigten“
  rationale: Das Griechische wiederholt εἰς πάντας ἀνθρώπους exakt. Eine Einschränkung in der Übersetzung würde die theologische Spannung auflösen, die der Vers selbst bestehen lässt.
- issue: Wie δικαίωσις wiederzugeben ist
  choice: Freispruch
  alternative: Rechtfertigung
  rationale: Der gerichtliche Sinn wird in modernem Deutsch klar ausgedrückt. „Rechtfertigung“ wäre terminologisch traditioneller, kann im heutigen Sprachgebrauch jedoch wie eine Selbstentschuldigung klingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt sichtbar; die im Ausgangstext elliptisch ausgelassenen Verben werden für verständliches Deutsch mit „kam es“ ergänzt.
