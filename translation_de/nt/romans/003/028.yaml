base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: de
  text: Denn wir kommen zu dem Schluss, dass ein Mensch durch Glauben gerechtfertigt wird, ohne Werke des Gesetzes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für gerecht erklärt wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: wir kommen zu dem Schluss
  rationale: Das Verb bezeichnet hier im argumentativen Zusammenhang ein begründetes Urteil. Die Wendung ist im modernen Deutschen natürlich und gibt den Gedankengang treffend wieder.
- source_word: γάρ
  choice: denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage und wird knapp mit „denn“ wiedergegeben.
- source_word: δικαιοῦσθαι
  choice: gerechtfertigt wird
  rationale: Die etablierte paulinische Formulierung bewahrt den forensischen und theologischen Gehalt, ohne ihn im Haupttext auf eine einzige Erklärung zu verengen.
- source_word: πίστει
  choice: durch Glauben
  rationale: Der Dativ bezeichnet hier das Mittel. „Durch Glauben“ ist idiomatisch und lässt offen, ob der Akzent stärker auf Glauben oder Vertrauen liegt.
- source_word: ἄνθρωπον
  choice: ein Mensch
  rationale: ἄνθρωπος ist hier generisch gebraucht. „Ein Mensch“ ist im Deutschen natürlich, würdevoll und schließt nicht nur Männer ein.
- source_word: χωρὶς
  choice: unabhängig von
  rationale: Die Wendung drückt die Trennung beziehungsweise den Ausschluss der Gesetzeswerke als Grundlage oder Mittel der Rechtfertigung aus, ohne den Satz unnötig schwer zu machen.
- source_word: ἔργων νόμου
  choice: Werken des Gesetzes
  rationale: Die formale Verbindung zu νόμος bleibt erhalten. Die Übersetzung legt nicht vorzeitig fest, ob nur bestimmte Gebote, Identitätsmerkmale oder sämtliche vom Gesetz geforderten Werke gemeint sind.
theological_decisions:
- issue: Bedeutungsnuance von δικαιοῦσθαι
  choice: gerechtfertigt wird
  alternative: für gerecht erklärt wird
  rationale: Der Haupttext wahrt die vertraute paulinische Terminologie und ihre theologische Spannung; die Fußnote nennt die deutlicher forensische Umschreibung.
- issue: Generischer Sinn von ἄνθρωπον
  choice: ein Mensch
  alternative: ein Mann
  rationale: Obwohl die griechische Form grammatisch maskulin ist, bezeichnet sie hier den Menschen allgemein. Die deutsche Wahl gibt diesen generischen Sinn ohne sachfremde Geschlechtsverengung wieder.
- issue: Umfang von ἔργων νόμου
  choice: Werke des Gesetzes
  alternative: vom Gesetz geforderte Werke
  rationale: Die knappe formnahe Wiedergabe bewahrt die exegetische Offenheit der paulinischen Wendung und vermeidet eine vorschnelle Eingrenzung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Syntax folgt dem argumentativen Charakter des griechischen Satzes, bleibt aber natürlich. „Ein Mensch“ trägt im Deutschen bereits den generischen Sinn; daher ist dazu keine Fußnote nötig.
