  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: de
  text: Es gibt keinen, der Einsicht hat; es gibt keinen, der Gott sucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der nach Gott sucht“; das griechische Verb kann ein nachdrückliches Suchen bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: συνίων
  choice: versteht
  rationale: Das substantivierte Partizip bezeichnet jemanden, der versteht oder Einsicht besitzt. „der versteht“ ist im heutigen Deutsch natürlich und gibt die verbale Aussage knapp wieder.
- source_word: ἐκζητῶν
  choice: sucht
  rationale: Das zusammengesetzte Verb bezeichnet ein Suchen und kann dessen Nachdrücklichkeit betonen. „Gott sucht“ ist klar und idiomatisch; die mögliche stärkere Nuance wird in der Fußnote genannt.
- source_word: οὐκ ἔστιν
  choice: Da ist keiner
  rationale: Diese Formulierung bewahrt die zweimalige kategorische Verneinung und klingt zugleich natürlich und eindringlich.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: der versteht / der Gott sucht
  rationale: Die substantivierten Partizipien werden im Deutschen idiomatisch durch Relativsätze wiedergegeben.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Der bestimmte Artikel wird vor dem Gottesnamen im Deutschen nicht wiedergegeben; der Bezug bleibt eindeutig.
theological_decisions:
- issue: Reichweite der Verneinung in der Zitatreihe des Paulus
  choice: Die absolute Aussage „Da ist keiner“ wird an beiden Stellen ohne Einschränkung beibehalten.
  alternative: „Keiner versteht wirklich; keiner sucht aufrichtig nach Gott.“
  rationale: Der griechische Text formuliert eine kategorische Verneinung. Zusätze wie „wirklich“ oder „aufrichtig“ würden die Aussage interpretierend abschwächen oder näher bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzstruktur. Die Wiederholung bewahrt den rhetorischen Nachdruck des griechischen Textes.
