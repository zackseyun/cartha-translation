source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: de
  text: 'Und warum sollten wir nicht sagen – wie man uns verleumdet und wie einige behaupten, dass wir das sagen –: »Lasst uns Böses tun, damit Gutes geschieht«? Ihre Verurteilung ist gerecht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Bezug von »ihre« ist im Griechischen nicht ausdrücklich festgelegt. Gemeint sein können die Verleumder; die Formulierung kann möglicherweise auch Menschen einschließen, die diese Argumentation vertreten.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: man uns verleumdet
  rationale: Das Verb bezeichnet hier die verleumderische Entstellung der apostolischen Aussage, nicht unmittelbar eine Lästerung Gottes. Die unpersönliche Formulierung klingt im Deutschen natürlich und bewahrt das Passiv sinngemäß.
- source_word: φασίν τινες
  choice: einige behaupten
  rationale: »Behaupten« gibt die berichtete, im Zusammenhang falsche Anschuldigung treffend wieder, ohne über das griechische φασίν hinaus eine Lehrtätigkeit anzunehmen.
- source_word: ἡμᾶς λέγειν
  choice: wir würden sagen
  rationale: Der abhängige Infinitiv wird im Deutschen idiomatisch durch indirekte Rede wiedergegeben; »sagen« bleibt näher am Wortlaut als »lehren«.
- source_word: Ποιήσωμεν
  choice: Lasst uns … tun
  rationale: Der hortative Aorist-Konjunktiv wird als Aufforderung in der ersten Person Plural wiedergegeben.
- source_word: τὰ κακὰ
  choice: Böses
  rationale: Der substantivierte Plural wird im Deutschen natürlich kollektiv mit »Böses« ausgedrückt.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: damit Gutes daraus entsteht
  rationale: »Damit« bewahrt die Ziel- beziehungsweise Folgebeziehung von ἵνα. »Daraus entsteht« macht den im Zusammenhang gemeinten Zusammenhang idiomatisch deutlich, ohne ihn theologisch weiter auszulegen.
- source_word: κρίμα
  choice: Verurteilung
  rationale: Hier bezeichnet κρίμα ein negatives richterliches Urteil; »Verurteilung« ist daher präziser als das allgemeinere »Gericht« oder »Urteil«.
- source_word: ἔνδικον
  choice: gerecht
  rationale: »Gerecht« bewahrt sowohl den rechtlichen als auch den moralischen Gehalt des Ausdrucks.
- source_word: καὶ μὴ
  choice: Und warum sollten wir nicht sagen
  rationale: Die griechische Wendung ist elliptisch und setzt die Frage aus dem vorherigen Vers fort. Die Ergänzung »warum sollten wir« ergibt im Deutschen einen verständlichen Satz und gibt die naheliegende syntaktische Fortführung wieder.
theological_decisions:
- issue: Bezug von ὧν in »ὧν τὸ κρίμα«
  choice: »Ihre Verurteilung« bezieht sich auf die zuvor genannten Ankläger, die Paulus diese Aussage unterschieben.
  alternative: Das Pronomen könnte auf diejenigen bezogen werden, die nach dem Grundsatz »Böses tun, damit Gutes entsteht« handeln oder ihn vertreten.
  rationale: Der nächstliegende grammatische Bezug sind »einige«, die verleumderisch behaupten, Paulus und seine Mitarbeiter sagten dies. Da die knappe griechische Form einen gewissen Bezugsspielraum lässt, wird die Zuordnung in einer Fußnote erläutert statt im Haupttext ausformuliert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verschachtelte Argumentation des Griechischen bleibt erkennbar, wird aber durch Gedankenstrich, Doppelpunkt und indirekte Rede lesbar gegliedert. Der elliptische Anschluss καὶ μὴ wird kontextgemäß ergänzt.
