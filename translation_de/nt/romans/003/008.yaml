revisions:
- from: 'Und warum sollten wir nicht sagen – wie man uns verleumdet und einige behaupten, wir würden sagen: »Lasst uns Böses tun, damit Gutes daraus entsteht«? Ihre Verurteilung ist gerecht.[a]'
  to: 'Und warum sollten wir nicht sagen – wie man uns verleumdet und wie einige behaupten, dass wir das sagen –: »Lasst uns Böses tun, damit Gutes geschieht«? Ihre Verurteilung ist gerecht.[a]'
  rationale: Die Revision stellt die im Griechischen vorhandene Parallelität der beiden καθώς-Sätze wieder her, vermeidet die explizite Ergänzung „daraus“ und formuliert die Fußnote zur Mehrdeutigkeit des Relativbezugs zurückhaltender.
