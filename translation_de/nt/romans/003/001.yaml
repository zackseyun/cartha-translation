  variant: modern standard German
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: de
  text: Was ist nun der Vorzug des Juden?[a] Oder welchen Nutzen hat die Beschneidung?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Der Jude« steht hier im repräsentativen Singular und bezeichnet einen jüdischen Menschen als Angehörigen dieser Gruppe.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Oder welchen Wert hat die Beschneidung?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Was ist nun
  rationale: Bewahrt den folgernden Übergang und leitet die rhetorische Frage in natürlichem Deutsch ein.
- source_word: τὸ περισσὸν
  choice: der Vorzug
  rationale: Bezeichnet hier das Besondere beziehungsweise Vorteilhafte; »Vorzug« wahrt die Frage nach der besonderen Stellung, ohne eine pauschale ethnische Überlegenheit zu behaupten.
- source_word: τοῦ Ἰουδαίου
  choice: des Juden
  rationale: Der bestimmte Singular ist generisch und wird als repräsentativer Singular beibehalten.
- source_word: ἢ τίς
  choice: Oder welchen
  rationale: Gibt die parallele zweite Frage idiomatisch wieder; das Genus richtet sich im Deutschen nach »Nutzen«.
- source_word: ἡ ὠφέλεια
  choice: Nutzen
  rationale: Ist eine klare heutige Wiedergabe und lässt gegenüber »Vorzug« die leichte lexikalische Unterscheidung der griechischen Ausdrücke erkennen.
- source_word: τῆς περιτομῆς
  choice: die Beschneidung
  rationale: Benennt den Ritus direkt; die deutsche Konstruktion »welchen Nutzen hat …?« gibt den griechischen Genitiv natürlich wieder.
theological_decisions:
- issue: Generische oder geschlechtsneutrale Wiedergabe von Ἰουδαίου
  choice: des Juden
  alternative: eines jüdischen Menschen; der Juden
  rationale: Paulus verwendet einen repräsentativen maskulinen Singular. Seine rhetorische Form wird bewahrt, statt sie in eine abstrakte oder pluralische Form umzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen rhetorischen Fragen und die leichte Bedeutungsdifferenz zwischen περισσόν (»Vorzug«) und ὠφέλεια (»Nutzen«) bleiben erhalten.
