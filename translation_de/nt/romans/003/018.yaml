  text: οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/018.yaml
  text: There is no fear of God before their eyes[a][b].
translation:
  language: de
  text: Die Furcht vor Gott steht ihnen nicht vor Augen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht vor Gott steht ihnen nicht vor Augen.“'
    reason: lexical_alternative
  - marker: b
    text: Zitat aus Psalm 36,2 (in der Septuaginta Psalm 35,2).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: steht … nicht
  rationale: Im Deutschen gibt die idiomatische Verbindung „vor Augen stehen“ zusammen mit der Verneinung den griechischen Existenzsatz natürlich wieder, ohne dessen Aussagekraft abzuschwächen.
- source_word: φόβος
  choice: Furcht
  rationale: „Furcht“ ist die unmittelbare lexikalische Entsprechung und bewahrt die biblische Rede von der angemessenen Haltung gegenüber Gott; die mögliche Nuance „Ehrfurcht“ wird in der Fußnote genannt.
- source_word: θεοῦ
  choice: vor Gott
  rationale: Die feste deutsche Wendung „Furcht vor Gott“ gibt den objektiven Genitiv natürlich wieder und bezeichnet Gott als den, auf den sich die Furcht richtet.
- source_word: ἀπέναντι
  choice: vor
  rationale: „Vor“ erhält in der Wendung „vor Augen“ das räumlich-metaphorische Bild des griechischen Ausdrucks.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: ihnen … vor Augen
  rationale: Die Formulierung bewahrt das konkrete Bild der Augen und ist zugleich natürliches, würdiges Standarddeutsch.
theological_decisions:
- issue: Bedeutungsumfang von φόβος θεοῦ
  choice: Furcht vor Gott
  alternative: Ehrfurcht vor Gott
  rationale: Der Haupttext bewahrt den stärkeren und unmittelbareren Ausdruck „Furcht“, ohne ihn auf bloßen Schrecken festzulegen; „Ehrfurcht“ wird als mögliche kontextuelle Nuance offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Satzstellung „steht ihnen nicht vor Augen“ erhält das konkrete biblische Bild und vermeidet eine unnötig hölzerne Wiedergabe.
