revisions:
- from: Wo bleibt nun das Rühmen? Es ist ausgeschlossen. Durch was für ein Gesetz? Durch das der Werke? Nein, sondern durch das Gesetz des Glaubens.
  to: Wo ist nun das Rühmen? Es wurde ausgeschlossen. Durch welches Gesetz? Durch ein Gesetz der Werke? Nein, sondern durch ein Gesetz des Glaubens.
  rationale: Die Revision korrigiert die leicht verschobene Eingangsfrage, ersetzt eine im Deutschen nicht tragfähige Ellipse durch eine minimale verständlichkeitssichernde Ergänzung und gibt den Aorist als vollzogenen passiven Vorgang wieder. Die rhetorische Zuspitzung, die Wiederholung von „Gesetz“ sowie die Auslegungsweite von „Gesetz des Glaubens“ bleiben erhalten.
