source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: de
  text: Wo ist nun das Rühmen? Es wurde ausgeschlossen. Durch welches Gesetz? Durch ein Gesetz der Werke? Nein, sondern durch ein Gesetz des Glaubens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: das Rühmen
  rationale: Bezeichnet hier das Sich-Rühmen bzw. den Anspruch, sich auf eigene Vorzüge berufen zu können; die substantivierte Form bewahrt die knappe rhetorische Frage.
- source_word: ἐξεκλείσθη
  choice: es ist ausgeschlossen
  rationale: Gibt den Aorist Passiv und das Bild des Ausschließens direkt wieder, ohne den nicht genannten Handelnden zu ergänzen.
- source_word: νόμος
  choice: Gesetz
  rationale: Bewahrt die bewusste Wiederholung und die mögliche Spannung zwischen Gesetz im üblichen Sinn und einem wirksamen Prinzip bzw. einer Ordnung.
- source_word: πίστις
  choice: Glaube
  rationale: Die Grundbedeutung passt zum paulinischen Zusammenhang; die mögliche Bedeutungsbreite von Glaube und Treue wird nicht durch eine ausführlichere Deutung verengt.
- source_word: διὰ
  choice: durch
  rationale: Gibt die instrumentale bzw. vermittelnde Funktion der Präposition mit Genitiv in beiden Vorkommen parallel wieder.
theological_decisions:
- issue: Bedeutung von „Gesetz des Glaubens“
  choice: Gesetz des Glaubens
  alternative: Prinzip des Glaubens
  rationale: Die wörtliche Form wahrt Paulus’ pointierten und spannungsvollen Gebrauch von νόμος, statt ihn interpretierend auf „Prinzip“ festzulegen.
- issue: Ergänzung des Handelnden bei „ist ausgeschlossen“
  choice: Passiv ohne genannten Handelnden
  alternative: Gott hat es ausgeschlossen
  rationale: Der griechische Text nennt den Handelnden nicht; die Übersetzung ergänzt deshalb keine ausdrückliche theologische Zuschreibung.
- issue: Elliptische Wendung τῶν ἔργων
  choice: durch das der Werke
  alternative: durch ein Gesetz der Werke
  rationale: Die knappe Ellipse des griechischen Textes bleibt erkennbar, ist im Deutschen aber durch die Aufnahme von „durch“ syntaktisch klar.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die kurzen Fragen und Antworten erhalten den zugespitzten dialogischen Rhythmus des griechischen Textes; die Wiederholung von „Gesetz“ bleibt bewusst stehen.
