id: ROM.3.3
reference: Romans 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: de
  text: Was nun? Wenn einige untreu waren, wird dann ihre Untreue Gottes Treue aufheben?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Glaube Gottes“. Die griechische Wendung kann hier Gottes Treue oder Verlässlichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Wie nun?
  rationale: Die knappe Wendung leitet im Gedankengang einen Einwand beziehungsweise eine Folgerung ein. „Wie nun?“ gibt diesen argumentativen Übergang natürlich und prägnant wieder.
- source_word: ἠπίστησάν
  choice: untreu waren
  rationale: Das Verb kann auch „nicht glaubten“ bedeuten. Im unmittelbaren Gegensatz zur πίστις Gottes liegt hier jedoch die Bedeutung „untreu sein“ nahe; zugleich bleibt die Beziehung zum Glauben im Deutschen hörbar.
- source_word: τινες
  choice: einige
  rationale: Das indefinite Pronomen bezeichnet eine unbestimmte Mehrzahl; „einige“ ist die natürliche deutsche Entsprechung.
- source_word: ἀπιστία
  choice: Untreue
  rationale: Das Substantiv entspricht dem vorangehenden Verb ἠπίστησάν und steht im Kontrast zu Gottes πίστις. „Untreue“ bewahrt diese rhetorische Gegenüberstellung.
- source_word: πίστιν τοῦ θεοῦ
  choice: Gottes Treue
  rationale: Wörtlich steht „die πίστις Gottes“. Im Kontrast zur menschlichen Untreue bezeichnet πίστις hier am ehesten Gottes Treue beziehungsweise Verlässlichkeit; die formale Alternative wird in der Fußnote dokumentiert.
- source_word: καταργήσει
  choice: aufheben
  rationale: Das Verb bezeichnet hier das Unwirksammachen oder Außerkraftsetzen. „Aufheben“ ist in einer rhetorischen Frage idiomatisch und bewahrt diesen Sinn.
theological_decisions:
- issue: Deutung von πίστιν τοῦ θεοῦ als umstrittener paulinischer Genitivverbindung
  choice: Gottes Treue
  alternative: Gottes Glaube / der Glaube Gottes
  rationale: Der unmittelbare Gegensatz zwischen menschlicher ἀπιστία und göttlicher πίστις spricht dafür, Gottes Zuverlässigkeit beziehungsweise Bundestreue auszudrücken. Da die griechische Form auch formal als „Glaube Gottes“ wiedergegeben werden kann, wird diese echte lexikalisch-theologische Spannung in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Struktur des Griechischen bleibt erhalten; „Untreue“ und „Treue“ machen den bewussten Gegensatz sichtbar, ohne die mögliche Bedeutung „Unglaube/Glaube“ zu verschweigen.
