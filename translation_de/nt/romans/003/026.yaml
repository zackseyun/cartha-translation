source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: de
  text: in der Nachsicht Gottes, zum Erweis seiner Gerechtigkeit[a] in der jetzigen Zeit, um selbst gerecht zu sein und den gerecht zu sprechen[b], der an Jesus glaubt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seines gerechten Handelns“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den für gerecht erklärt“.'
    reason: lexical_alternative
  - marker: c
    text: Die griechische Wendung kann auch als Bezug auf Jesu Treue verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: Nachsicht
  rationale: „Nachsicht“ bezeichnet hier Gottes bewusstes Zurückhalten des Gerichts und ist im Deutschen natürlicher und präziser als das allgemeinere „Geduld“.
- source_word: ἔνδειξιν
  choice: Erweis
  rationale: „Erweis“ bewahrt den Gedanken eines sichtbaren Aufzeigens oder Nachweises und passt zum würdevollen argumentativen Stil des Abschnitts.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die etablierte, kontextuell offene Wiedergabe und kann sowohl Gottes gerechtes Wesen als auch sein gerechtes Handeln umfassen.
- source_word: νῦν καιρῷ
  choice: in der jetzigen Zeit
  rationale: Die Formulierung gibt die zeitliche Zuspitzung von νῦν καιρός klar und idiomatisch wieder.
- source_word: δίκαιον
  choice: gerecht
  rationale: „Gerecht“ passt zum gerichtlichen Zusammenhang und ermöglicht die sprachliche Verbindung mit δικαιοῦντα.
- source_word: δικαιοῦντα
  choice: den gerecht spricht
  rationale: „Gerecht spricht“ gibt den präsentischen, substantivisch gebrauchten Partizipialausdruck natürlich wieder und bewahrt zugleich das Wortspiel mit „gerecht“.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: der an Jesus glaubt
  rationale: Der Haupttext folgt der geläufigen objektiven Deutung des Genitivs und formuliert sie in verständlichem modernem Deutsch; die mögliche Deutung als Treue Jesu wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von ἐκ πίστεως Ἰησοῦ
  choice: der an Jesus glaubt
  alternative: der sich auf Jesu Treue gründet
  rationale: Die objektive Deutung ist im Deutschen unmittelbar verständlich. Da die Genitivverbindung jedoch auch subjektiv als Jesu eigene Treue verstanden werden kann, wird diese echte exegetische Spannung nicht aufgelöst, sondern in der Fußnote kenntlich gemacht.
- issue: Verhältnis von δίκαιον und δικαιοῦντα
  choice: gerecht ist und den gerecht spricht
  alternative: gerecht ist und den für gerecht erklärt
  rationale: Die gewählte Formulierung wahrt sowohl den gerichtlichen Sinn als auch die bewusste Wortverbindung des griechischen Textes, ohne eine bestimmte Rechtfertigungslehre über den Wortlaut hinaus einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende kleingeschriebene Satzanschluss bleibt erhalten, weil der griechische Vers mitten in der Satzkonstruktion des vorhergehenden Verses beginnt. Die Wiederholung „gerecht … gerecht spricht“ bildet die griechische Wortverbindung bewusst nach.
