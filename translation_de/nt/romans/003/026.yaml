  naturalness: Der Satz ist insgesamt würdig und gut verständlich. „um selbst gerecht zu sein und den gerecht zu sprechen“ ist im modernen Standarddeutsch zugleich natürlicher und syntaktisch genauer als „damit er selbst gerecht ist und den gerecht spricht“.
