  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: de
  text: Wir wissen aber, dass alles, was das Gesetz sagt, zu denen spricht, die unter dem Gesetz stehen[a], damit jeder Mund zum Schweigen gebracht wird[b] und die ganze Welt Gott gegenüber rechenschaftspflichtig wird[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die im Gesetz sind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit jeder Mund verschlossen wird“. Gemeint ist, dass jede Einrede verstummt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „haftbar wird“, „dem Urteil verfällt“ oder „vor Gott schuldig dasteht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Wir wissen aber
  rationale: Οἴδαμεν bezeichnet gemeinsames gegenwärtiges Wissen; δέ wird mit dem natürlichen, leicht kontrastierenden „aber“ wiedergegeben, ohne ein zeitliches „nun“ einzuführen.
- source_word: ὅσα ὁ νόμος λέγει
  choice: Alles, was das Gesetz sagt
  rationale: Die umfassende Formulierung ὅσα bleibt erhalten; νόμος wird ohne zusätzliche konfessionelle oder heilsgeschichtliche Festlegung als „das Gesetz“ wiedergegeben.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: zu denen, die unter dem Gesetz stehen
  rationale: Die idiomatische deutsche Wendung bezeichnet Menschen im Geltungs- und Zuständigkeitsbereich des Gesetzes. Die wörtlichere räumliche Formulierung wird in einer Fußnote bewahrt.
- source_word: λαλεῖ
  choice: spricht es zu
  rationale: „Spricht“ wahrt den Wechsel von λέγει („sagt“) zu λαλεῖ und bezeichnet hier die Adressaten der Rede.
- source_word: ἵνα
  choice: damit
  rationale: Die Konjunktion gibt die ziel- beziehungsweise folgebezogene Aussage des griechischen Finalsatzes natürlich wieder.
- source_word: πᾶν στόμα φραγῇ
  choice: jeder Mund verstummt
  rationale: Das konkrete Bild des Mundes bleibt erhalten; „verstummt“ vermittelt natürlich, dass jede Einrede und Verteidigung zum Schweigen kommt.
- source_word: ὑπόδικος γένηται
  choice: rechenschaftspflichtig wird
  rationale: Die Wiedergabe bewahrt sowohl die rechtliche Verantwortlichkeit als auch den mit γένηται ausgedrückten Eintritt in diesen Zustand, ohne ὑπόδικος vorschnell als bereits ausgesprochenes Schuldurteil zu verengen.
- source_word: πᾶς ὁ κόσμος
  choice: die ganze Welt
  rationale: Die umfassende Reichweite der Aussage über die Menschheit bleibt gewahrt.
- source_word: τῷ θεῷ
  choice: Gott gegenüber
  rationale: Die Dativbeziehung wird als die auf Gott gerichtete Rechenschaftspflicht ausgedrückt.
theological_decisions:
- issue: Rechtliche Tragweite von ὑπόδικος vor Gott
  choice: Die ganze Welt wird Gott gegenüber rechenschaftspflichtig.
  alternative: Die ganze Welt steht vor Gott schuldig da beziehungsweise ist seinem Urteil verfallen.
  rationale: Ὑπόδικος bezeichnet einen dem Recht oder Gericht unterworfenen, haftbaren Zustand. „Rechenschaftspflichtig“ erhält die forensische Spannung, ohne bereits ausdrücklich den stärkeren Wortlaut eines endgültigen Schuldspruchs einzutragen.
- issue: Adressaten des Gesetzes in τοῖς ἐν τῷ νόμῳ
  choice: die unter dem Gesetz stehen
  alternative: die im Gesetz sind
  rationale: Die Hauptfassung macht den Geltungsbereich des Gesetzes in natürlichem Deutsch verständlich; die Fußnote hält die ungewöhnlichere, formal nähere Wendung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während „unter dem Gesetz stehen“ und „rechenschaftspflichtig“ für heutige Leser verständlich sind. Die rechtliche Bildsprache und die Spannung zwischen Verantwortlichkeit, Haftbarkeit und Schuld werden nicht konfessionell vereindeutigt.
