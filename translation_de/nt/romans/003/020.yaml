id: ROM.3.20
reference: Romans 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: de
  text: Denn aufgrund von Werken des Gesetzes wird kein Mensch vor ihm gerechtgesprochen werden; denn durch das Gesetz kommt Erkenntnis der Sünde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: aufgrund von Werken des Gesetzes
  rationale: Gibt die Grundlage oder den beanspruchten Grund des Gerechtgesprochenwerdens wieder und bewahrt den paulinischen Ausdruck »Werke des Gesetzes«.
- source_word: οὐ δικαιωθήσεται
  choice: wird … nicht gerechtgesprochen werden
  rationale: Bewahrt den forensischen Klang des Passivs von δικαιόω besser als eine bloße Zustandsbeschreibung wie »gerecht sein«.
- source_word: πᾶσα σὰρξ
  choice: kein Mensch
  rationale: Die wörtliche Wendung »alles Fleisch« bezeichnet hier im semitisch geprägten Sprachgebrauch die gesamte Menschheit; idiomatisches Deutsch gibt die Aussage als »kein Mensch« wieder.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Natürliche und genaue Wiedergabe der Vorstellung, vor Gottes Angesicht beziehungsweise in seinem Urteil zu stehen.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: Erkenntnis der Sünde
  rationale: Bewahrt sowohl den kognitiven Gehalt von ἐπίγνωσις als auch den Singular »Sünde«, ohne ihn auf einzelne Übertretungen einzuengen.
theological_decisions:
- issue: Bedeutung von δικαιόω
  choice: gerechtgesprochen werden
  alternative: gerecht gemacht werden
  rationale: Die gerichtliche Nuance ist im Kontext stark, doch die Übersetzung formuliert nicht über den Vers hinaus eine umfassende Rechtfertigungslehre.
- issue: Reichweite von πᾶσα σὰρξ
  choice: kein Mensch
  alternative: kein Fleisch
  rationale: Gemeint ist die ausnahmslose Menschheit. »Kein Mensch« vermittelt dies im modernen Deutschen klar, ohne die Aussage auf den Körper oder die sündige Natur umzudeuten.
- issue: Funktion des Gesetzes
  choice: durch das Gesetz kommt Erkenntnis der Sünde
  alternative: das Gesetz bewirkt Sündenerkenntnis
  rationale: Die knappe Form bewahrt die Aussage des griechischen Nominalsatzes und vermeidet eine unnötige Festlegung darauf, auf welche Weise diese Erkenntnis entsteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweimalige Gebrauch von »denn« spiegelt die argumentative Verknüpfung durch διότι und γάρ; das Semikolon macht die Begründungsstruktur gut lesbar.
