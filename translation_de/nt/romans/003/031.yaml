id: ROM.3.31
reference: Romans 3:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: de
  text: 'Setzen wir nun durch den Glauben das Gesetz außer Kraft? Auf keinen Fall! Im Gegenteil: Wir halten das Gesetz aufrecht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir bestätigen das Gesetz“; wörtlicher: „Wir geben dem Gesetz festen Bestand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: das Gesetz
  rationale: Obwohl im Griechischen ohne Artikel, bezeichnet νόμος hier innerhalb der Argumentation des Römerbriefs das bestimmte Gesetz, insbesondere die Tora. Im Deutschen ist daher der bestimmte Artikel sachlich und idiomatisch angemessen.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ kennzeichnet die rhetorische Folgerung aus dem vorherigen Gedankengang natürlich und knapp.
- source_word: καταργοῦμεν
  choice: setzen … außer Kraft
  rationale: Die Wendung gibt das Unwirksam- oder Ungültigmachen wieder und bildet im Deutschen einen klaren Gegensatz zu „aufrechterhalten“, ohne vorschnell eine formelle Abschaffung zu unterstellen.
- source_word: διὰ τῆς πίστεως
  choice: durch den Glauben
  rationale: „Durch“ entspricht διά mit Genitiv und bewahrt den instrumentalen Sinn; „Glaube“ ist hier die etablierte, sachlich offene Wiedergabe von πίστις.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Diese gegenwärtige, nachdrückliche deutsche Formulierung gibt die entschiedene Zurückweisung der griechischen Wendung natürlich wieder.
- source_word: ἀλλὰ
  choice: Im Gegenteil
  rationale: Die Formulierung macht den scharfen korrigierenden Gegensatz deutlich.
- source_word: ἱστάνομεν
  choice: halten … aufrecht
  rationale: In Verbindung mit „Gesetz“ drückt die Wendung aus, dass dessen Bestand oder Geltung bestätigt wird, und bildet den präzisen Gegenpol zu „außer Kraft setzen“. Die mögliche stärker wörtliche Nuance „festigen/bestätigen“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Verhältnis von Glauben und Gesetz
  choice: „Wir halten das Gesetz aufrecht“ im Haupttext
  alternative: „Wir bestätigen das Gesetz“ beziehungsweise „wir geben dem Gesetz festen Bestand“
  rationale: Das Griechische lässt eine Wiedergabe im Sinn von „feststellen“, „festigen“ oder „bestätigen“ zu. „Aufrechterhalten“ bringt im unmittelbaren Gegensatz zu „außer Kraft setzen“ klar zum Ausdruck, dass der Glaube das Gesetz nicht ungültig macht, ohne eine bestimmte konfessionelle Erklärung seiner fortdauernden Rolle einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die nachdrückliche Zurückweisung bleiben erhalten; der Doppelpunkt nach „Im Gegenteil“ führt natürlich zur positiven Gegenaussage.
