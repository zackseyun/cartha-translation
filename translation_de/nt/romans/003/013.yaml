  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: de
  text: Ihre Kehle ist ein offenes Grab; mit ihren Zungen täuschten sie[a]; unter ihren Lippen ist Gift von Nattern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihren Zungen handelten sie hinterlistig“. Das griechische Imperfekt kann fortgesetztes oder wiederholtes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet eine giftige Schlange; möglich sind auch „Aspis“, „Viper“ oder „Otter“. Die genaue Artzuordnung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: Grab
  rationale: „Grab“ ist die natürliche standarddeutsche Entsprechung und bewahrt das Bild von Tod und Verderben.
- source_word: ἀνεῳγμένος
  choice: offen
  rationale: Das griechische Perfektpartizip bezeichnet einen durch das Öffnen entstandenen Zustand; „ein offenes Grab“ gibt dies idiomatisch wieder.
- source_word: λάρυγξ
  choice: Rachen
  rationale: „Rachen“ bezeichnet hier den inneren Hals- und Mundraum und passt präzise zum Bild des offenen Grabes; „Kehle“ wäre ebenfalls möglich.
- source_word: ἐδολιοῦσαν
  choice: betrogen sie fortwährend
  rationale: Der Imperfekt bezeichnet anhaltendes oder wiederholtes hinterlistiges Handeln in der Vergangenheit; die Formulierung bewahrt diesen Aspekt, auch wenn sie im Deutschen markierter ist.
- source_word: ἰὸς
  choice: Gift
  rationale: Im Zusammenhang mit einer Giftschlange ist „Gift“ im Deutschen die natürliche und sachlich passende Bezeichnung.
- source_word: ἀσπίδων
  choice: Ottern
  rationale: Das griechische Wort bezeichnet giftige Schlangen, wahrscheinlich eine Art Viper. „Ottern“ bewahrt die traditionelle, konkrete Schlangenbezeichnung, ohne eine unsichere moderne Artbestimmung vorzutäuschen.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: unter ihren Lippen
  rationale: Die unmittelbare Wiedergabe bewahrt das eindringliche Körperbild des Ausgangstextes.
