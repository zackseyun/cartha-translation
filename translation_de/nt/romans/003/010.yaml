  text: καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: de
  text: 'Wie geschrieben steht: »Keiner ist gerecht, auch nicht einer.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Wie
  rationale: Leitet zusammen mit γέγραπται die Schriftzitierung idiomatisch und quellennah ein.
- source_word: γέγραπται
  choice: geschrieben steht
  rationale: Die feste deutsche Zitierformel gibt das griechische Perfekt Passiv natürlich wieder und lässt die fortdauernde Geltung des Geschriebenen erkennen.
- source_word: ὅτι
  choice: ':'
  rationale: Ein Doppelpunkt führt das Zitat im modernen Deutschen natürlicher ein als ein ausdrückliches »dass«.
- source_word: Οὐκ ἔστιν
  choice: Keiner ist
  rationale: Gibt die verneinte Existenzaussage in Verbindung mit dem prädikativen δίκαιος knapp und idiomatisch wieder.
- source_word: δίκαιος
  choice: gerecht
  rationale: Bewahrt den moralischen und theologischen Bedeutungsumfang des paulinischen Begriffs, ohne ihn auf bloße Rechtschaffenheit zu verengen.
- source_word: οὐδὲ εἷς
  choice: auch nicht einer
  rationale: Erhält die nachdrückliche Zuspitzung des Griechischen und vermeidet eine Abschwächung zu einem bloßen »niemand«.
theological_decisions:
- issue: Ob die Aussage als allgemeines »Niemand ist gerecht« geglättet oder mit der ausdrücklichen Zuspitzung auf den Einzelnen wiedergegeben wird.
  choice: Keiner ist gerecht, auch nicht einer.
  alternative: Niemand ist gerecht, kein Einziger.
  rationale: Die gewählte Fassung bewahrt sowohl die uneingeschränkte Allgemeinheit als auch die emphatische Wiederholung οὐδὲ εἷς, ohne die theologische Spannung zu erklären oder einzuschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Zitierformel »Wie geschrieben steht« ist allgemein verständlich; die knappe Wiederholung »auch nicht einer« bildet den markanten Rhythmus und Nachdruck des griechischen Satzes ab.
