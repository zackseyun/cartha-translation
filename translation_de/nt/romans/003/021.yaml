id: ROM.3.21
reference: Romans 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: de
  text: Jetzt aber ist, unabhängig vom Gesetz, Gottes Gerechtigkeit[a] offenbart worden, bezeugt durch das Gesetz und die Propheten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gottes Gerechtigkeit kann auch Gottes gerechtes Handeln bezeichnen; möglicherweise auch: Gerechtigkeit von Gott.'
    reason: Bewahrt die lexikalische und genitivische Mehrdeutigkeit von δικαιοσύνη θεοῦ.
  - marker: b
    text: „Das Gesetz und die Propheten“ ist eine Bezeichnung für die heiligen Schriften Israels.
    reason: Erläutert die wahrscheinlich kanonische Bedeutung der festen Wendung.
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Jetzt aber
  rationale: Gibt sowohl den zeitlichen als auch den kontrastierenden Übergang in Paulus’ Argumentation natürlich und knapp wieder.
- source_word: χωρὶς νόμου
  choice: unabhängig vom Gesetz
  rationale: χωρίς bezeichnet hier Trennung beziehungsweise Unabhängigkeit. Der bestimmte Artikel ist im Deutschen sachgerecht, da im Kontext das mosaische Gesetz gemeint ist.
- source_word: δικαιοσύνη θεοῦ
  choice: Gottes Gerechtigkeit
  rationale: 'Die natürliche deutsche Genitivkonstruktion bewahrt die Offenheit der griechischen Wendung weitgehend: Sie kann Gottes eigene Gerechtigkeit und sein gerechtes Handeln bezeichnen, ohne den möglichen Herkunftssinn ausdrücklich festzulegen.'
- source_word: πεφανέρωται
  choice: ist ... offenbart worden
  rationale: Das Perfekt bezeichnet eine erfolgte Offenbarung mit fortbestehender Geltung. Das deutsche Perfekt gibt dies in gegenwärtigem Standarddeutsch klar wieder.
- source_word: μαρτυρουμένη
  choice: bezeugt
  rationale: Das Partizip Präsens Passiv wird knapp und idiomatisch wiedergegeben; es beschreibt das fortbestehende Zeugnis für die offenbarte Gerechtigkeit.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: durch das Gesetz und die Propheten
  rationale: Die feste biblische Wendung bezeichnet hier wahrscheinlich die schriftliche Überlieferung Israels; die Formulierung bleibt nah am Griechischen und im Deutschen verständlich.
theological_decisions:
- issue: Bedeutung des Genitivs in δικαιοσύνη θεοῦ
  choice: Gottes Gerechtigkeit
  alternative: Gerechtigkeit von Gott
  rationale: Der griechische Genitiv kann Gottes eigene Gerechtigkeit und sein rettendes gerechtes Handeln hervorheben; möglicherweise schwingt auch eine von Gott kommende Gerechtigkeit mit. Der Haupttext vermeidet eine einseitige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt wie das Griechische den neuen heilsgeschichtlichen Übergang und die Unabhängigkeit vom Gesetz hervor, ohne den Zusammenhang mit dem Schriftzeugnis aufzulösen.
