id: ROM.3.4
reference: Romans 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: de
  text: 'Auf keinen Fall! Vielmehr soll sich Gott als wahrhaftig erweisen, jeder Mensch aber als Lügner, wie geschrieben steht: »Damit du mit deinen Worten als gerecht erwiesen wirst[a] und siegst, wenn man über dich richtet.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als im Recht bestätigt wirst«; wörtlicher: »gerechtfertigt wirst«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wenn du richtest«. Diese Wiedergabe entspricht unmittelbarer dem hebräischen Wortlaut von Psalm 51,6; die griechische Form im Römerbrief wird natürlicherweise als »wenn man über dich richtet« verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Gibt Paulus’ nachdrückliche Zurückweisung idiomatisch und kraftvoll in modernem Deutsch wieder.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: soll sich Gott als wahrhaftig erweisen
  rationale: Bewahrt den Aufforderungscharakter und macht deutlich, dass Gottes Wahrhaftigkeit offenbar wird, nicht erst entsteht; zugleich bleibt der Gegensatz zu »Lügner« erhalten.
- source_word: πᾶς ... ἄνθρωπος
  choice: jeder Mensch
  rationale: Gibt den allgemeinen und distributiven Bezug geschlechtsübergreifend und quellennah wieder.
- source_word: ψεύστης
  choice: Lügner
  rationale: Direkte und idiomatische Entsprechung für eine Person, die lügt beziehungsweise sich als falsch erweist.
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Etablierte deutsche Wiedergabe der neutestamentlichen Zitierformel.
- source_word: δικαιωθῇς
  choice: als gerecht erwiesen wirst
  rationale: 'Bringt den forensischen Sinn zum Ausdruck: Gott wird als im Recht stehend bestätigt, nicht moralisch erst gerecht gemacht.'
- source_word: ἐν τοῖς λόγοις σου
  choice: mit deinen Worten
  rationale: Natürliches Deutsch, das den Bezug auf Gottes Äußerungen wahrt; »in deinen Worten« wäre formaler, aber weniger idiomatisch.
- source_word: νικήσεις
  choice: siegst
  rationale: Gibt das Bild des Obsiegens knapp wieder und passt zum gerichtlichen Zusammenhang.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: wenn man über dich richtet
  rationale: Gibt die in der griechischen Form naheliegende passive Bedeutung idiomatisch wieder, ohne das sperrige »wenn du gerichtet wirst«.
theological_decisions:
- issue: Forensischer Sinn von δικαιωθῇς in einer Aussage über Gott
  choice: als gerecht erwiesen wirst
  alternative: gerechtfertigt wirst; als im Recht bestätigt wirst
  rationale: Die Aussage handelt nicht davon, dass Gott gerecht gemacht wird, sondern davon, dass sich seine Gerechtigkeit beziehungsweise sein Recht gegenüber menschlicher Falschheit erweist.
- issue: Diathese von κρίνεσθαί σε und Verhältnis zum hebräischen Wortlaut von Psalm 51,6
  choice: wenn man über dich richtet
  alternative: wenn du richtest
  rationale: Der griechische Wortlaut des Römerbriefs wird am natürlichsten passiv verstanden. Die aktive, am Hebräischen des Psalms orientierte Lesart bleibt wegen der echten text- und zitationsbezogenen Spannung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der scharfe Gegensatz zwischen Gottes Wahrhaftigkeit und menschlicher Falschheit sowie der gerichtliche Ton des Psalmzitats bleiben erhalten. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar an der betreffenden Formulierung.
