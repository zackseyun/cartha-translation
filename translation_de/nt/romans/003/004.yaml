review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die emphatische Zurückweisung μὴ γένοιτο treffend wieder. „soll sich Gott als wahrhaftig erweisen“ bewahrt den Aufforderungscharakter von γινέσθω und bringt angemessen zum Ausdruck, dass Gottes Wahrhaftigkeit sich gegenüber menschlicher Falschheit erweist. „jeder Mensch aber als Lügner“ entspricht dem generischen und distributiven πᾶς ... ἄνθρωπος ψεύστης. Das Zitat wird in seiner gerichtlichen Bildsprache sachgerecht wiedergegeben: δικαιωθῇς als „als gerecht erwiesen wirst“ und νικήσεις als „siegst“. Die passive Deutung von κρίνεσθαί σε in „wenn man über dich richtet“ ist für den griechischen Wortlaut naheliegend und wird durch die Fußnote verantwortungsvoll gegen die vom hebräischen Psalmwortlaut her bekannte aktive Alternative abgegrenzt.'
  naturalness: Modernes, klares und würdevolles Standarddeutsch. „Auf keinen Fall!“ hat die erforderliche Schärfe, ohne unnatürlich zu wirken. Die Satzfügung des Schriftzitats ist gut verständlich; „wenn man über dich richtet“ ist idiomatischer als eine stärker formale Passivkonstruktion.
  terminology: „wahrhaftig“ und „Lügner“ erhalten den beabsichtigten Kontrast. „als gerecht erwiesen“ vermittelt bei Gott den forensischen Sinn ohne missverständlicherweise eine moralische Rechtfertigung Gottes nahezulegen. Die Fußnote nennt „gerechtfertigt wirst“ zutreffend als wörtlichere Alternative und macht die aktive Lesemöglichkeit bei Psalm 51,6 deutlich, ohne sie dem griechischen Wortlaut von Römer 3,4 aufzuzwingen.
