id: ROM.3.29
reference: Romans 3:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: de
  text: Oder ist Gott nur der Gott der Juden? Ist er nicht auch der Gott der Nichtjuden? Ja, auch der Nichtjuden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der Völker«; gemeint sind hier die nichtjüdischen Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet eine weitere rhetorische Alternative in Paulus’ Argumentation ein und bewahrt den Gedankengang knapp und natürlich.
- source_word: Ἰουδαίων
  choice: der Juden
  rationale: Der Genitiv wird im Deutschen idiomatisch als »der Gott der Juden« wiedergegeben.
- source_word: ὁ θεὸς
  choice: Gott / der Gott
  rationale: Θεός wird standardmäßig mit »Gott« wiedergegeben; die prädikative Zugehörigkeit verlangt im Deutschen die Formulierung »der Gott der …«.
- source_word: μόνον
  choice: nur
  rationale: Gibt die ausschließende Bedeutung direkt wieder und erhält die rhetorische Zuspitzung.
- source_word: οὐχὶ καὶ
  choice: Ist er nicht auch
  rationale: Οὐχί kennzeichnet eine Frage, auf die eine bejahende Antwort erwartet wird; »nicht auch« bewahrt Form und Erwartung der griechischen Frage.
- source_word: ἐθνῶν
  choice: der Nichtjuden
  rationale: Im ausdrücklichen Gegensatz zu Ἰουδαίων bezeichnet ἔθνη hier Menschen außerhalb des jüdischen Volkes. »Nichtjuden« ist in modernem Deutsch verständlich und präzise; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: ναὶ
  choice: Ja
  rationale: Gibt die knappe ausdrückliche Bejahung des griechischen Textes natürlich wieder.
- source_word: καὶ
  choice: auch
  rationale: Nimmt die Nichtjuden neben den Juden ausdrücklich mit auf und bewahrt den inklusiven Nachdruck.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν im Gegensatz zu Ἰουδαίων
  choice: Nichtjuden
  alternative: Völker
  rationale: Der unmittelbare Gegensatz gilt Juden und Menschen aus den übrigen Völkern, nicht politischen Nationen als solchen. »Nichtjuden« macht den Bezug im Deutschen klar, während die Fußnote die wörtlichere und kollektiv gefärbte Alternative bewahrt.
- issue: Ergänzung von »der Gott« beziehungsweise »er« in der zweiten Frage
  choice: Ist er nicht auch der Gott der Nichtjuden?
  alternative: Nicht auch der Nichtjuden?
  rationale: Das Griechische lässt das Prädikat elliptisch aus. Die Ergänzung macht die Frage im modernen Deutsch verständlich, ohne ihren Inhalt zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen und die knappe bejahende Antwort bleiben erhalten. »Nichtjuden« vermeidet das heute teils ungebräuchliche »Heiden« und gibt den kontextuellen Gegensatz klar wieder.
