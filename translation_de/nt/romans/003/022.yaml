id: ROM.3.22
reference: Romans 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: de
  text: Die Gerechtigkeit Gottes[a] aber durch den Glauben an Jesus, den Messias,[b] für alle, die glauben; denn es gibt keinen Unterschied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausdruck kann Gottes eigenes gerechtes Handeln und die von ihm geschenkte Gerechtigkeit bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch die Treue Jesu, des Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη θεοῦ
  choice: die Gerechtigkeit Gottes
  rationale: Die Wiedergabe bewahrt die Genitivverbindung und lässt offen, ob vor allem Gottes eigenes gerechtes Handeln oder die von ihm gewährte Gerechtigkeit gemeint ist.
- source_word: διὰ πίστεως
  choice: durch den Glauben
  rationale: „Glaube“ ist hier die natürliche und traditionsübergreifend verständliche Wiedergabe von πίστις; die mögliche Bedeutung „Treue“ wird wegen der umstrittenen Genitivkonstruktion in einer Fußnote bewahrt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: an Jesus, den Messias
  rationale: Χριστός wird als Titel mit „Messias“ wiedergegeben. In der gewählten objektiven Lesart bezeichnet der Genitiv denjenigen, auf den sich der Glaube richtet.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: für alle, die glauben
  rationale: Diese idiomatische Formulierung erhält sowohl den umfassenden Geltungsbereich von πάντας als auch den fortdauernden verbalen Sinn des Partizips πιστεύοντας.
- source_word: διαστολή
  choice: Unterschied
  rationale: „Unterschied“ gibt den kontextuellen Sinn natürlich und allgemeinverständlich wieder, ohne eine weitergehende Art der Unterscheidung festzulegen.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: Glaube an Jesus, den Messias
  alternative: Treue Jesu, des Messias
  rationale: Der Genitiv kann objektiv oder subjektiv verstanden werden. Der Haupttext folgt der verbreiteten objektiven Lesart, während die grammatisch und theologisch gewichtige subjektive Lesart ausdrücklich in der Fußnote erhalten bleibt.
- issue: δικαιοσύνη θεοῦ
  choice: Gerechtigkeit Gottes
  alternative: Gottes gerechtes Handeln beziehungsweise die von Gott geschenkte Gerechtigkeit
  rationale: Die knappe Genitivverbindung wird nicht auf Gottes Eigenschaft, sein rettendes Handeln oder den von ihm verliehenen gerechten Status eingeengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Griechischen verblose Satzfügung wurde als Anschluss an den vorhergehenden Vers bewahrt, statt ein deutendes Verb einzufügen. „Messias“ bleibt als Titel erkennbar.
