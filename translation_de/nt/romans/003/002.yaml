  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: de
  text: Sehr viel, in jeder Hinsicht. Denn zunächst einmal wurden ihnen die Aussprüche Gottes anvertraut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺ
  choice: Sehr viel
  rationale: Das adverbial gebrauchte Wort beantwortet die vorausgehende Frage nach dem Vorzug knapp und natürlich.
- source_word: κατὰ πάντα τρόπον
  choice: in jeder Hinsicht
  rationale: Die Wendung bezeichnet umfassende Geltung; „in jeder Hinsicht“ ist im Deutschen idiomatisch und präzise.
- source_word: πρῶτον μὲν γὰρ
  choice: Denn zunächst einmal
  rationale: „Denn“ gibt γάρ wieder; „zunächst einmal“ markiert den ersten angeführten Gesichtspunkt, ohne zwingend eine unmittelbar folgende nummerierte Liste zu erwarten.
- source_word: ἐπιστεύθησαν
  choice: wurden ihnen … anvertraut
  rationale: Der Passivgebrauch von πιστεύω bezeichnet hier das Anvertrauen eines Gutes, nicht das Glauben.
- source_word: τὰ λόγια
  choice: die Aussprüche
  rationale: λόγια bezeichnet hier von Gott stammende Offenbarungsworte. „Aussprüche“ bewahrt diesen besonderen Sinn besser als das allgemeinere „Worte“ und bleibt verständlich.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird direkt wiedergegeben und lässt Besitz beziehungsweise Ursprung unausgesprochen offen.
theological_decisions: []
