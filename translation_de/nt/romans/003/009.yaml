- from: Was nun? Sind wir besser? Keineswegs![a] Denn wir haben bereits die Anklage erhoben, dass Juden wie Griechen allesamt unter der Sünde stehen[b].
  to: Was nun? Sind wir besser? Keineswegs![a] Denn wir haben bereits sowohl Juden als auch Griechen beschuldigt, allesamt unter der Sünde zu stehen[b].
  rationale: Die Revision beschränkt sich auf eine idiomatischere und quellentreuere forensische Satzkonstruktion. Sie macht Juden und Griechen ausdrücklich zu denjenigen, gegen die die Beschuldigung gerichtet ist, und bewahrt zugleich die knappe, nicht dogmatisch aufgelöste Ausdrucksweise bei προεχόμεθα und ὑφ’ ἁμαρτίαν.
