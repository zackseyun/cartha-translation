source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: de
  text: Was nun? Sind wir besser? Keineswegs![a] Denn wir haben bereits sowohl Juden als auch Griechen beschuldigt, allesamt unter der Sünde zu stehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haben wir irgendeinen Vorteil?“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „unter der Macht der Sünde stehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Was nun?
  rationale: Die knappe Folgerungsfrage bewahrt οὖν ausdrücklich und entspricht dem zugespitzten Argumentationsstil des Paulus.
- source_word: προεχόμεθα
  choice: Sind wir besser?
  rationale: Die umstrittene mediale Form fragt im Zusammenhang nach einer Vorrangstellung der Juden. Die kurze Formulierung lässt offen, ob moralische Überlegenheit oder eine günstigere Stellung gemeint ist; die mögliche Bedeutung eines Vorteils steht in der Fußnote.
- source_word: οὐ πάντως
  choice: Keineswegs!
  rationale: Die Formulierung gibt die nachdrückliche Verneinung prägnant und in natürlichem modernem Deutsch wieder.
- source_word: προῃτιασάμεθα
  choice: wir haben bereits die Anklage erhoben
  rationale: Die Wendung wahrt den forensischen Sinn eines schon zuvor erhobenen Vorwurfs und passt zum argumentativen Zusammenhang des Römerbriefs.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: Juden wie Griechen
  rationale: Diese natürliche deutsche Paarformel bildet τε καὶ ab und behält die im griechischen Text gebrauchte Gegenüberstellung von Juden und Griechen bei.
- source_word: πάντας
  choice: allesamt
  rationale: Allesamt betont knapp, dass aus beiden genannten Gruppen niemand ausgenommen ist.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: unter der Sünde stehen
  rationale: Die bewusst verdichtete Formulierung bewahrt das paulinische Bild der Unterordnung, ohne die Sünde bereits im Haupttext ausdrücklich als Macht oder Herrschaft auszudeuten.
theological_decisions:
- issue: Bedeutung der ersten Person Plural in προεχόμεθα
  choice: 'Die Frage lautet: „Sind wir besser?“'
  alternative: „Haben wir irgendeinen Vorteil?“
  rationale: Der Zusammenhang von Römer 3,1–9 behandelt sowohl jüdische Vorrechte als auch die gemeinsame Verstrickung in die Sünde. Der Haupttext gibt die Frage nach einer möglichen Überlegenheit knapp wieder; die lexikalisch plausible Deutung als Frage nach einem Vorteil bleibt in der Fußnote erhalten.
- issue: Bedeutung von „unter der Sünde“
  choice: Die verdichtete Metapher bleibt als „unter der Sünde stehen“ erhalten.
  alternative: „unter der Macht der Sünde stehen“
  rationale: Der griechische Ausdruck bezeichnet Unterordnung, nennt aber das Wort „Macht“ nicht ausdrücklich. Die alternative Auslegung wird deshalb nicht in den Haupttext eingetragen, sondern in einer Fußnote angeboten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper paulinischer Argumentationsführung. Die forensische Sprache bleibt erkennbar; zugleich werden die Mehrdeutigkeit von προεχόμεθα und die verdichtete Metapher ὑφ’ ἁμαρτίαν nicht stillschweigend aufgelöst.
