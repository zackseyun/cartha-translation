lexical_decisions:
- source_word: ὀξεῖς
  choice: schnell dabei
  rationale: Wörtlich bezeichnet das Wort etwas »Scharfes« oder »Schnelles«. In Verbindung mit Füßen drückt es hier die rasche Bereitschaft zu gewaltsamem Handeln aus; »schnell dabei« gibt den Sinn im modernen Deutsch natürlich wieder.
- source_word: οἱ πόδες
  choice: die Füße
  rationale: Die direkte Wiedergabe bewahrt das körperliche Bild des Ausgangstextes.
- source_word: αὐτῶν
  choice: ihre
  rationale: Der Genitiv bezeichnet hier die Zugehörigkeit der Füße; im Deutschen steht dafür natürlich das Possessivpronomen.
- source_word: ἐκχέαι
  choice: zu vergießen
  rationale: Das Verb bedeutet grundsätzlich »ausgießen«; bei Blut ist »Blut vergießen« die geläufige deutsche Wendung und bewahrt den gewaltsamen Sinn.
- source_word: αἷμα
  choice: Blut
  rationale: Dies ist die direkte und kontextgemäße Entsprechung.
