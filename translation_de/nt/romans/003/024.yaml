lexical_decisions:
- source_word: δικαιούμενοι
  choice: werden … gerechtfertigt
  rationale: Das präsentische Passivpartizip wird als finite Fortsetzung des vorangehenden Satzes wiedergegeben. „Rechtfertigen“ bewahrt den knappen paulinischen Rechts- und Bundesbegriff; eine erklärende Alternative steht in der Fußnote.
- source_word: δωρεὰν
  choice: unverdient
  rationale: Das Adverb bezeichnet eine freie, nicht erarbeitete Gabe. „Unverdient“ ist im heutigen Deutsch klarer als das doppeldeutige „umsonst“ und fügt keine Vorstellung eines Kaufpreises aufseiten der Empfangenden hinzu.
- source_word: τῇ αὐτοῦ χάριτι
  choice: durch seine Gnade
  rationale: Der Dativ bezeichnet hier Grundlage beziehungsweise Mittel der Rechtfertigung. „Gnade“ ist die sachlich genaue und im paulinischen Zusammenhang etablierte Wiedergabe.
- source_word: ἀπολυτρώσεως
  choice: Erlösung
  rationale: „Erlösung“ bewahrt den Gedanken der Befreiung und ist im Deutschen der geläufige theologische Ausdruck, ohne die genaue Art eines Lösegeldes über den Wortlaut hinaus festzulegen.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός wird hier als Titel verstanden und deshalb transparent mit „Messias“ wiedergegeben. Die traditionelle Form „Christus“ wird in einer Fußnote genannt.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: die in Messias Jesus ist
  rationale: Der Relativsatz macht im Deutschen deutlich, dass die präpositionale Wendung die Erlösung näher bestimmt, und erhält zugleich die bewusst knappe Aussage, dass diese Erlösung in Messias Jesus ist.
theological_decisions:
- issue: Paulinische Rechtfertigungssprache
  choice: „gerechtfertigt“ im Haupttext
  alternative: „für gerecht erklärt“
  rationale: Die traditionelle Fachprägung wahrt die juristische Dimension von δικαιόω, ohne das Verhältnis von Erklärung, Status und Erneuerung im Haupttext einseitig aufzulösen. Die verständliche Umschreibung wird als Alternative dokumentiert.
- issue: Bedeutung von ἐν bei der Erlösung
  choice: „die in Messias Jesus ist“
  alternative: „die durch Messias Jesus geschieht“
  rationale: Die wörtlichere Orts- beziehungsweise Beziehungsaussage bewahrt die theologische Spannung des griechischen ἐν und legt es nicht vorschnell ausschließlich instrumental aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung setzt syntaktisch den Gedanken aus Römer 3,23 fort. „Unverdient“ vermeidet die heutige Mehrdeutigkeit von „umsonst“; „Messias Jesus“ macht den Titel Χριστός sichtbar.
