  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: de
  text: und werden unverdient durch seine Gnade gerechtfertigt[a], durch die Erlösung, die in Jesus, dem Messias[b], ist.
  philosophy: optimal-equivalence
  footnotes:
