  text: and they have not known the way of peace[a].
translation:
  language: de
  text: Und den Weg des Friedens haben sie nicht gekannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Pfad des Friedens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die einfache verbindende Konjunktion bewahrt den fortlaufenden Charakter der Anklagereihe in Paulus’ Schriftzitat.
- source_word: ὁδὸν
  choice: Weg
  rationale: „Weg“ gibt sowohl das konkrete Bild eines Weges als auch den übertragenen Sinn einer Lebens- oder Handlungsweise natürlich wieder.
- source_word: εἰρήνης
  choice: Frieden
  rationale: „Frieden“ ist die klare Standardentsprechung und bezeichnet hier den Weg, der vom Frieden geprägt ist oder zu ihm führt; die genaue Beziehung bleibt offen.
- source_word: ἔγνωσαν
  choice: haben sie nicht erkannt
  rationale: Das Perfekt klingt im modernen Deutschen natürlich und gibt die im Aorist zusammengefasste Feststellung wieder. „Erkannt“ kann hier sowohl fehlende Einsicht als auch fehlende praktische Vertrautheit mit diesem Weg ausdrücken.
theological_decisions:
- issue: Bedeutung von „Weg des Friedens“
  choice: Die Genitivverbindung bleibt unverändert als „Weg des Friedens“ stehen.
  alternative: „Weg, der zum Frieden führt“ oder „friedlicher Weg“
  rationale: Der griechische Genitiv lässt offen, ob der Weg durch Frieden gekennzeichnet ist oder zum Frieden führt. Die Übersetzung soll diese Spannung nicht einseitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung stellt den „Weg des Friedens“ entsprechend dem griechischen Satzbau heraus und bleibt dennoch gut verständlich.
