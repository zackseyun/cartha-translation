reference: Romans 3:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: de
  text: Denn Gott ist einer[a]; er wird die Beschnittenen[b] aus Glauben und die Unbeschnittenen[b] durch den Glauben gerechtsprechen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn Gott tatsächlich einer ist«.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht im Griechischen »Beschneidung« beziehungsweise »Unbeschnittenheit«; gemeint sind die Beschnittenen und die Unbeschnittenen.
    reason: cultural_note
  - marker: c
    text: 'Paulus gebraucht zwei verschiedene Wendungen: »aus Glauben« und »durch den Glauben«. Der Unterschied kann stilistisch sein und muss keinen scharfen sachlichen Gegensatz ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: denn
  rationale: Im Zusammenhang führt Paulus die gemeinsame Überzeugung von dem einen Gott als Begründung an, nicht als unsichere Möglichkeit. Die bedingte Nuance bleibt in Fußnote [a] sichtbar.
- source_word: εἷς ὁ θεός
  choice: Gott ist einer
  rationale: Die Formulierung bewahrt die betonte Aussage von der Einheit Gottes und klingt zugleich natürlich und würdig.
- source_word: δικαιώσει
  choice: wird … gerechtsprechen
  rationale: Die Wiedergabe erhält den Zukunftsbezug und den paulinischen Sinn eines göttlichen Rechtsspruchs, ohne ihn weiter dogmatisch auszudeuten.
- source_word: περιτομήν
  choice: die Beschnittenen
  rationale: Das abstrakte Substantiv »Beschneidung« bezeichnet hier metonymisch beschnittene Menschen. Die Wiedergabe vermeidet die engere Deutung »die Juden«.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: Die knappe, im Deutschen verständliche Formulierung bleibt nahe an ἐκ und lässt offen, ob Herkunft, Grundlage oder Mittel besonders betont ist.
- source_word: ἀκροβυστίαν
  choice: die Unbeschnittenen
  rationale: Das abstrakte Substantiv »Unbeschnittenheit« bezeichnet hier metonymisch unbeschnittene Menschen. »Die Völker« wäre stärker auslegend.
- source_word: διὰ τῆς πίστεως
  choice: durch den Glauben
  rationale: Diese Wiedergabe erhält die von ἐκ πίστεως verschiedene Präposition und bildet auch den griechischen Artikel natürlich ab, ohne daraus zwingend einen sachlichen Gegensatz abzuleiten.
- source_word: πίστεως
  choice: Glauben
  rationale: »Glaube« ist hier die natürliche und sachlich offene Wiedergabe von πίστις; der Vers enthält keine umstrittene Genitivverbindung wie πίστις Χριστοῦ.
theological_decisions:
- issue: Ob εἴπερ eine echte Bedingung oder eine vorausgesetzte Überzeugung ausdrückt
  choice: Die Aussage wird im Haupttext begründend mit »denn« wiedergegeben.
  alternative: »wenn Gott tatsächlich einer ist«
  rationale: Paulus baut seine Folgerung auf dem geteilten monotheistischen Bekenntnis auf. Die grammatisch mögliche bedingte Färbung wird jedoch nicht beseitigt, sondern in Fußnote [a] dokumentiert.
- issue: Ob zwischen ἐκ πίστεως und διὰ τῆς πίστεως ein theologischer Unterschied beabsichtigt ist
  choice: Die Verschiedenheit wird als »aus Glauben« und »durch den Glauben« bewahrt, ohne einen Lehrunterschied zu behaupten.
  alternative: Beide Wendungen einheitlich als »durch Glauben« wiedergeben
  rationale: Der griechische Text verwendet verschiedene Präpositionen. Diese Spannung soll sichtbar bleiben, doch der Zusammenhang zwingt nicht zu einer scharfen Unterscheidung zwischen Grundlage und Mittel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Gerechtsprechen« bewahrt den forensischen Klang des Verbs, während »aus Glauben« und »durch den Glauben« die sprachliche Spannung des griechischen Textes erkennbar halten. Der wiederholte Marker [b] steht bei beiden metonymischen Personenbezeichnungen, auf die dieselbe Fußnote Bezug nimmt.
