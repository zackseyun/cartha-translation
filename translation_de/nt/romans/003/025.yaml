id: ROM.3.25
reference: Romans 3:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: de
  text: Ihn hat Gott als Sühnopfer[a] hingestellt – durch den Glauben an sein Blut[b] –, um seine Gerechtigkeit[c] zu erweisen; denn er hatte die zuvor begangenen Sünden ungestraft gelassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Sühnemittel“. Das Wort kann auch auf den „Sühneort“ beziehungsweise „Sühndeckel“ anspielen, den goldenen Deckel der Bundeslade, auf den am Versöhnungstag Blut gesprengt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung kann auch verstanden werden als: „durch den Glauben, kraft seines Blutes“. Dann bezeichnet „sein Blut“ eher die Grundlage oder das Mittel der Sühne als den Gegenstand des Glaubens.'
    reason: alternative_reading
  - marker: c
    text: Gemeint sein kann hier besonders Gottes gerechtes Handeln beziehungsweise der Erweis, dass Gott gerecht ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: hingestellt
  rationale: Das Verb bezeichnet hier ein Darstellen bzw. öffentliches Vor-Augen-Stellen. „Hingestellt“ ist im Deutschen anschaulich und lässt zugleich die weniger wahrscheinliche Bedeutung „vorherbestimmt“ unaufgenommen.
- source_word: ἱλαστήριον
  choice: Sühnopfer
  rationale: „Sühnopfer“ ist verständlich, bewahrt den kultisch-sühnenden Zusammenhang und vermeidet im Haupttext eine vorschnelle Festlegung darauf, ob ausschließlich die Abwendung von Zorn, die Tilgung von Schuld oder der alttestamentliche Sühneort gemeint ist.
- source_word: διὰ πίστεως
  choice: durch den Glauben
  rationale: Die Wendung gibt Mittel bzw. Zugang an. „Glaube“ ist hier die natürliche und in diesem paulinischen Zusammenhang sachgerechte Wiedergabe von πίστις.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: an sein Blut
  rationale: In Verbindung mit „Glauben“ ergibt sich die natürliche deutsche Formulierung „Glaube an sein Blut“. Da die griechische Zuordnung umstritten ist, wird die mögliche instrumentale Lesart in einer Fußnote erhalten.
- source_word: εἰς ἔνδειξιν
  choice: um … zu erweisen
  rationale: Die Infinitivkonstruktion gibt die zielgerichtete Aussage der griechischen Präpositionalphrase idiomatisch wieder.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ wahrt die breite paulinische Bedeutung und kann hier zugleich Gottes gerechtes Handeln einschließen.
- source_word: πάρεσιν
  choice: ungestraft gelassen
  rationale: Die Formulierung bezeichnet das vorläufige Nichtahnden früherer Sünden, ohne πάρεσις mit vollständiger Vergebung gleichzusetzen.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: die zuvor begangenen Sünden
  rationale: Diese Wiedergabe bringt sowohl die zeitliche Vorordnung als auch den Gedanken tatsächlich begangener Sünden in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Bedeutung von ἱλαστήριον
  choice: Sühnopfer
  alternative: Sühnemittel; Sühneort beziehungsweise Sühndeckel
  rationale: Das Hauptwort kann die sühnende Opferfunktion bezeichnen, erinnert aber möglicherweise zugleich an den Deckel der Bundeslade als Ort der Sühne. „Sühnopfer“ ist im Haupttext zugänglich; die kultische Ortsbedeutung und eine allgemeinere funktionale Wiedergabe bleiben in der Fußnote sichtbar.
- issue: Zuordnung von διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι
  choice: durch den Glauben an sein Blut
  alternative: durch den Glauben, kraft seines Blutes; durch den Glauben, in seinem Blut
  rationale: Der Haupttext verbindet „sein Blut“ als Gegenstand mit dem Glauben. Die griechische Wortfolge erlaubt jedoch auch, das Blut auf die sühnende Darbringung oder deren Wirksamkeit zu beziehen; diese Mehrdeutigkeit wird ausdrücklich vermerkt.
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: gerechtes Handeln; Recht schaffende Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt den theologischen und ethischen Bedeutungsumfang des Ausdrucks, während die Fußnote darauf hinweist, dass hier besonders Gottes Rechtmäßigkeit beziehungsweise Gerechtsein hervortreten kann.
- issue: Verhältnis des früheren Nichtahndens zur Vergebung
  choice: die Sünden ungestraft gelassen
  alternative: über die Sünden hinweggesehen; die Sünden hatte hingehen lassen
  rationale: πάρεσις bezeichnet hier nicht einfach endgültige Vergebung. Die gewählte Formulierung hält die Spannung fest, dass Gott frühere Sünden zunächst nicht ahndete und nun seine Gerechtigkeit erweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit vorangestelltem „Ihn“ wahrt den Anschluss an den vorherigen Vers. Gedankenstriche grenzen die syntaktisch umstrittene Wendung ab, ohne ihre Zuordnung endgültig festzulegen. „Ungestraft gelassen“ ist verständlicher als das substantivische „Hingehenlassen“, hält aber den Unterschied zur vollständigen Vergebung aufrecht.
