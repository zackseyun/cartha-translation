translation:
  language: de
  text: Ihr Mund ist voll Fluch und Bitterkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: ihr
  rationale: Das Genitiv-Relativpronomen knüpft an die zuvor beschriebenen Menschen an. Im Deutschen gibt das possessive „ihr“ die Beziehung natürlich wieder, ohne den Sinn zu verändern.
- source_word: τὸ στόμα
  choice: Mund
  rationale: Die wörtliche Wiedergabe bewahrt den im Griechischen kollektiv gebrauchten Singular; auch im Deutschen ist diese Ausdrucksweise verständlich und idiomatisch.
- source_word: ἀρᾶς
  choice: Fluch
  rationale: Das Substantiv bezeichnet einen Fluch beziehungsweise verfluchende Rede. „Fluch“ bewahrt die knappe nominale Form und passt natürlich zur Wendung „voll … sein“.
- source_word: πικρίας
  choice: Bitterkeit
  rationale: „Bitterkeit“ entspricht dem lexikalischen Sinn und lässt dessen moralische und sprachliche Dimension offen, statt ihn verengend als bloß „bittere Worte“ auszulegen.
- source_word: γέμει
  choice: ist voll
  rationale: Die geläufige deutsche Wendung gibt den präsentischen Zustand des griechischen Verbs klar und unmittelbar wieder.
