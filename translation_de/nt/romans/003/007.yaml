source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: de
  text: Wenn aber Gottes Wahrhaftigkeit durch meine Lüge zu seiner Ehre umso mehr hervorgetreten ist, warum werde dann auch ich noch als Sünder gerichtet?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn aber Gottes Wahrheit durch meine Unwahrheit zu seiner Ehre umso reicher geworden ist, warum werde dann auch ich noch als Sünder gerichtet?“'
    reason: „Wahrheit“ ist eine mögliche Wiedergabe von ἀλήθεια; „Unwahrheit“ von ψεῦσμα. „Umso reicher geworden“ gibt den Zunahme- bzw. Überflussgedanken von ἐπερίσσευσεν formaler wieder.
lexical_decisions:
- source_word: ἡ ἀλήθεια τοῦ θεοῦ
  choice: Gottes Wahrhaftigkeit
  rationale: Im Zusammenhang steht Gottes Verlässlichkeit und Wahrhaftigkeit dem menschlichen Lügen gegenüber (vgl. Vers 4). Diese Wiedergabe erfasst den persönlichen und moralischen Sinn, ohne den Ausdruck auf eine bestimmte Lehre festzulegen.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: durch meine Lüge
  rationale: 'ἐν bezeichnet hier am ehesten das Mittel: Die menschliche Lüge lässt Gottes Wahrhaftigkeit im rhetorischen Gedankengang umso stärker hervortreten.'
- source_word: ἐπερίσσευσεν
  choice: umso deutlicher hervortritt
  rationale: Das Verb bezeichnet ein Übermaß oder Zunehmen. Im Deutschen gibt diese Formulierung den kontrastiven Sinn natürlich wieder; das griechische Aorist wird in der rhetorischen Bedingung idiomatisch präsentisch wiedergegeben.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: und ihm dadurch Ehre bringt
  rationale: Die Formulierung bringt die resultative beziehungsweise zielgerichtete Bedeutung von εἰς zum Ausdruck und klingt in modernem Deutsch natürlich.
- source_word: τί ἔτι κἀγὼ
  choice: warum werde dann auch ich noch
  rationale: „auch ich“ bewahrt den additiven Nachdruck von κἀγώ, während „noch“ die Bedeutung von ἔτι erhält.
- source_word: ὡς ἁμαρτωλὸς κρίνομαι
  choice: als Sünder verurteilt
  rationale: κρίνομαι kann allgemein „gerichtet/beurteilt werden“ heißen; im Zusammenhang einer Anklage als Sünder ist „verurteilt werden“ idiomatisch und kontextuell passend, bleibt jedoch in einer Fußnote als mögliche Engführung kenntlich.
theological_decisions:
- issue: Bedeutung von ἀλήθεια τοῦ θεοῦ
  choice: Gottes Wahrhaftigkeit
  alternative: Gottes Wahrheit
  rationale: Der Gegensatz zu menschlicher Lüge legt Gottes Wahrhaftigkeit nahe. „Gottes Wahrheit“ bleibt sprachlich möglich und wird nicht als theologisch ausgeschlossen behandelt.
- issue: Reichweite von κρίνομαι
  choice: verurteilt werde
  alternative: gerichtet werde
  rationale: Der Kontext der Einstufung „als Sünder“ stützt die gerichtliche Nuance „verurteilt“. Das allgemeinere „gerichtet“ bleibt möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt zugespitzt; „auch ich noch“ bewahrt die im Griechischen ausdrücklich vorhandenen Partikeln. Eine Sammelfußnote dokumentiert die wichtigsten echten Übersetzungsalternativen.
