review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von ἀλήθεια τοῦ θεοῦ als „Gottes Wahrhaftigkeit“ ist im Kontext gut begründet; „durch meine Lüge“, „auch ich noch“ und „als Sünder“ treffen wesentliche Nuancen. Jedoch gibt „umso deutlicher hervortritt und ihm dadurch Ehre bringt“ ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ nicht hinreichend genau wieder: Das Verb bezeichnet Zunahme/Überfluss, und die Formulierung fügt eine eigenständige kausative Handlung („bringt“) hinzu. „Verurteilt“ engt κρίνομαι stärker als nötig auf ein Schuldspruchurteil ein.'
  naturalness: Die bestehende deutsche Formulierung ist flüssig, doch „umso mehr hervorgetreten ist zu seiner Ehre“ ist sowohl natürlich als auch näher am griechischen Bild der gesteigerten Offenbarwerdung. „Gerichtet“ wahrt die offene Bedeutung von κρίνομαι und passt in der rhetorischen Frage idiomatisch.
  terminology: „Wahrhaftigkeit“ ist als kontextuelle Wiedergabe von ἀλήθεια vertretbar, ohne „Wahrheit“ auszuschließen. „Lüge“ ist direkt und angemessen. Für κρίνομαι ist „gerichtet“ gegenüber „verurteilt“ vorzuziehen, da der griechische Ausdruck nicht zwingend die Verurteilung als Ergebnis bezeichnet.
  issues:
  - severity: medium
    issue: „umso deutlicher hervortritt und ihm dadurch Ehre bringt“ paraphrasiert ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ zu frei.
    rationale: ἐπερίσσευσεν meint, dass Gottes Wahrheit/Wahrhaftigkeit überreich geworden bzw. umso mehr hervorgetreten ist; εἰς τὴν δόξαν αὐτοῦ ist „zu seiner Ehre/Herrlichkeit“. Die zusätzliche Aussage, sie „bringe“ Gott Ehre, verschiebt die syntaktische und semantische Beziehung.
  - severity: medium
    issue: „verurteilt“ ist für κρίνομαι zu eng.
    rationale: Das Präsenspassiv kann „gerichtet“ beziehungsweise „beurteilt“ bedeuten. Der Satzkontext kann zwar eine Verurteilung implizieren, aber der Grundtext legt das Ergebnis nicht ausdrücklich fest.
  revised_text: Wenn aber Gottes Wahrhaftigkeit durch meine Lüge zu seiner Ehre umso mehr hervorgetreten ist, warum werde dann auch ich noch als Sünder gerichtet?[a]
