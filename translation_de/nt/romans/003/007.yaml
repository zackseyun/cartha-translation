revisions:
- from: Wenn aber Gottes Wahrhaftigkeit durch meine Lüge umso deutlicher hervortritt und ihm dadurch Ehre bringt, warum werde dann auch ich noch als Sünder verurteilt?[a]
  to: Wenn aber Gottes Wahrhaftigkeit durch meine Lüge zu seiner Ehre umso mehr hervorgetreten ist, warum werde dann auch ich noch als Sünder gerichtet?[a]
  rationale: Die Revision bewahrt die rhetorische Zuspitzung und die begründete Wahl „Wahrhaftigkeit“, stellt aber die Steigerungsbedeutung von ἐπερίσσευσεν sowie die auf Gottes Ehre bezogene Wendung εἰς τὴν δόξαν αὐτοῦ unmittelbarer dar. Sie ersetzt zudem die zu endgültige Einengung „verurteilt“ durch das semantisch offenere „gerichtet“.
