  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: de
  text: Wenn aber unsere Ungerechtigkeit Gottes Gerechtigkeit sichtbar macht[a], was sollen wir sagen? Ist Gott etwa ungerecht, wenn er seinen Zorn bringt? (Ich spreche nach menschlicher Art.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Ungerechtigkeit erweist Gottes Gerechtigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: Ungerechtigkeit
  rationale: Der Ausdruck bezeichnet hier menschliches Unrecht beziehungsweise moralische Verkehrtheit und bildet im Deutschen einen klaren Gegensatz zu Gottes Gerechtigkeit.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt sowohl den moralischen als auch den gerichtlichen Bedeutungsbereich des griechischen Wortes, ohne zwischen „Righteousness“ und „Justice“ künstlich zu unterscheiden, die im Deutschen gewöhnlich zusammenfallen.
- source_word: συνίστησιν
  choice: sichtbar macht
  rationale: Die Wendung gibt den kontextuellen Sinn wieder, dass menschliche Ungerechtigkeit Gottes Gerechtigkeit hervortreten beziehungsweise erkennbar werden lässt.
- source_word: μὴ ἄδικος
  choice: Ist Gott etwa ungerecht
  rationale: „Etwa“ lässt erkennen, dass die mit μή eingeleitete rhetorische Frage eine verneinende Antwort erwartet, ohne die Frage in eine ausdrückliche Feststellung umzuwandeln.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: wenn er seinen Zorn verhängt
  rationale: „Zorn verhängen“ ist im Deutschen verständlich und bewahrt den gerichtlichen Zusammenhang; das Possessivpronomen macht natürlich deutlich, dass es um Gottes Zorn geht.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Ich spreche nach menschlicher Art
  rationale: Die Formulierung bewahrt Paulus’ Hinweis, dass er sich einer menschlichen Argumentationsweise bedient, ohne den Satz auf eine bestimmte theologische Deutung festzulegen.
theological_decisions:
- issue: Rhetorische Frage nach Gottes Gerechtigkeit im Gericht
  choice: Die erwartete Verneinung wird durch „etwa“ angedeutet, während die Aussage als echte Frage stehen bleibt.
  alternative: „Gott ist doch nicht ungerecht, wenn er seinen Zorn verhängt?“
  rationale: Das griechische μή signalisiert eine erwartete negative Antwort. Die gewählte Fassung bewahrt zugleich die Spannung des vorgebrachten Einwands und vermeidet es, ihn vorschnell in eine Feststellung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem argumentativen Gang des Griechischen; „nach menschlicher Art“ ist bewusst etwas gehoben, bleibt aber allgemein verständlich.
