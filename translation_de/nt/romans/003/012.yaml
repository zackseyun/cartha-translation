id: ROM.3.12
reference: Romans 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: de
  text: Alle sind abgewichen; gemeinsam sind sie untauglich geworden.[a] Da ist keiner, der Gutes tut[b], auch nicht einer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unbrauchbar geworden«; das griechische Wort kann auch den Gedanken des Verdorbenseins einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Güte übt« beziehungsweise »freundlich handelt«; das griechische Wort bezeichnet auch Güte und Freundlichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Alle
  rationale: Bewahrt den universalen Umfang des substantivisch gebrauchten Plurals, ohne ein im Griechischen nicht vorhandenes Substantiv hinzuzufügen.
- source_word: ἐξέκλιναν
  choice: sind abgewichen
  rationale: Gibt die vollzogene moralische Abkehr knapp und in modernem Deutsch wieder.
- source_word: ἅμα
  choice: gemeinsam
  rationale: 'Drückt hier die kollektive Bedeutung aus: Alle teilen denselben Zustand.'
- source_word: ἠχρεώθησαν
  choice: sind untauglich geworden
  rationale: Bewahrt den passiven, resultativen Sinn und die Vorstellung, dass sie unbrauchbar beziehungsweise ohne Nutzen geworden sind, ohne die mögliche Bedeutung vorschnell auf moralische Verderbnis einzuengen.
- source_word: ποιῶν
  choice: der ... tut
  rationale: Überführt das Partizip natürlich ins Deutsche und wahrt seinen allgemeinen beziehungsweise charakterisierenden Sinn.
- source_word: χρηστότητα
  choice: Gutes
  rationale: Ist im ethischen Zusammenhang idiomatisch; die ebenfalls mögliche Nuance der Güte oder Freundlichkeit wird in einer Fußnote offengehalten.
- source_word: οὐκ ἔστιν
  choice: Da ist keiner
  rationale: Gibt die existentielle Verneinung klar, nachdrücklich und in natürlichem Deutsch wieder.
- source_word: ἕως ἑνός
  choice: auch nicht einer
  rationale: 'Erfasst die idiomatische, emphatische Zuspitzung: keine einzige Ausnahme.'
theological_decisions: []
