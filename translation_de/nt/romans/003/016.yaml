lexical_decisions:
- source_word: σύντριμμα
  choice: Verwüstung
  rationale: Das Substantiv bezeichnet das Ergebnis von Zerschmetterung oder Zerstörung. „Verwüstung“ gibt die angerichtete Zerstörung natürlich und prägnant wieder; „Verderben“ bleibt als mögliche Alternative erhalten.
- source_word: ταλαιπωρία
  choice: Elend
  rationale: „Elend“ bezeichnet schwere Not und leidvolle Bedrängnis und entspricht dem griechischen Ausdruck in verständlichem, gegenwärtigem Deutsch.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: liegen auf ihren Wegen
  rationale: „Auf ihren Wegen“ bewahrt das konkrete Wegbild und lässt zugleich den übertragenen Sinn ihrer Lebensführung erkennen. Das im Griechischen nominal formulierte „in ihren Wegen“ wird mit „liegen“ idiomatisch ins Deutsche übertragen.
- source_word: καὶ
  choice: und
  rationale: Die gewöhnliche koordinierende Konjunktion verbindet die beiden Substantive.
