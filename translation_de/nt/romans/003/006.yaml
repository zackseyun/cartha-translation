  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: de
  text: Auf keinen Fall! Denn wie wird Gott sonst die Welt richten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Die feste paulinische Wendung weist den vorausgehenden Schluss entschieden zurück. Die idiomatische deutsche Formulierung bewahrt ihre starke verneinende Kraft, ohne die griechische Wunschform unnatürlich nachzubilden.
- source_word: ἐπεὶ
  choice: Denn … sonst
  rationale: Im Zusammenhang begründet ἐπεὶ die Zurückweisung durch die Konsequenz, die sich andernfalls ergäbe. Die geteilte deutsche Wendung „Denn … sonst“ gibt sowohl den argumentativen Anschluss als auch diese Konsequenz natürlich wieder.
- source_word: κρινεῖ
  choice: wird … richten
  rationale: Das Futur Indikativ wird direkt als deutsches Futur wiedergegeben; dadurch bleibt die Aussage über Gottes künftiges Gericht erhalten, ohne eine zusätzliche modale Deutung einzutragen.
- source_word: κόσμον
  choice: die Welt
  rationale: „Die Welt“ ist hier die natürliche und hinreichend weite Entsprechung für κόσμος als Gegenstand des göttlichen Gerichts.
theological_decisions:
- issue: Aussagekraft der Zurückweisungsformel μὴ γένοιτο
  choice: 'Entschiedene Zurückweisung des vorausgehenden Schlusses: „Auf keinen Fall!“'
  alternative: 'Formaler: „Das sei ferne!“ oder „Das geschehe niemals!“'
  rationale: Die idiomatische Wiedergabe erhält die starke paulinische Verneinung, ohne altertümliche Sprache oder zusätzliche konfessionelle Aussagen einzuführen.
- issue: Logischer Anschluss von ἐπεὶ
  choice: „Denn … sonst“ führt die rhetorische Begründung ein.
  alternative: „Andernfalls“ allein oder formal näher „Denn dann“
  rationale: 'Der Wortlaut hält den Gedankengang offen und klar: Die zuvor erwogene Folgerung wird abgewiesen, weil sie Gottes Gericht über die Welt infrage stellen würde.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze, nachdrückliche Zurückweisung und die anschließende rhetorische Frage bleiben erhalten; es werden keine konfessionellen Zusätze eingeführt.
