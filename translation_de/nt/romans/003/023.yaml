  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: de
  text: Denn alle haben gesündigt und erreichen die Herrlichkeit Gottes nicht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es fehlt ihnen an der Herrlichkeit Gottes“ oder „ihnen mangelt die Herrlichkeit Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „die Herrlichkeit Gottes“ kann Gottes eigene Herrlichkeit meinen, die Herrlichkeit, die Menschen widerspiegeln sollten, oder die Herrlichkeit, die Gott verleiht.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: alle
  rationale: Die knappe umfassende Formulierung entspricht dem griechischen Plural und bewahrt im Zusammenhang die universale Aussage.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ gibt die begründende beziehungsweise erläuternde Verbindung zum vorangehenden Gedankengang natürlich wieder.
- source_word: ἥμαρτον
  choice: haben gesündigt
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des zusammenfassenden Aorists und bezeichnet die geschehene Sünde mit gegenwärtiger Relevanz.
- source_word: ὑστεροῦνται
  choice: erreichen … nicht
  rationale: Die Formulierung gibt den gegenwärtigen Mangel beziehungsweise das Zurückbleiben idiomatisch wieder, ohne genauer festzulegen, in welchem Sinn die Herrlichkeit fehlt.
- source_word: δόξης
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte, kontextuell angemessene Wiedergabe von δόξα und bewahrt die theologische Bedeutungsbreite.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv entspricht der kompakten griechischen Genitivverbindung und legt nicht fest, ob Gottes eigene, von Gott verliehene oder von Menschen widerzuspiegelnde Herrlichkeit gemeint ist.
theological_decisions:
- issue: Bedeutung von „die Herrlichkeit Gottes“
  choice: Die Wendung bleibt im Haupttext neutral als „die Herrlichkeit Gottes“ erhalten.
  alternative: „die von Gott kommende Herrlichkeit“, „Gottes herrlicher Maßstab“ oder „Anteil an Gottes Herrlichkeit“
  rationale: Der griechische Genitiv ist auslegungsfähig. Eine interpretierende Erweiterung würde die genuine theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Wortstellung bleibt knapp und paulinisch; die Fußnoten bewahren die lexikalische und theologische Offenheit des griechischen Textes.
