id: ROM.8.35
reference: Romans 8:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: de
  text: Wer wird uns von der Liebe des Messias trennen? Bedrängnis oder Not oder Verfolgung oder Hunger oder Nacktheit oder Gefahr oder Schwert?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von unserer Liebe zum Messias“. Der griechische Genitiv lässt auch diese Deutung zu, doch der Zusammenhang spricht eher für „von der Liebe des Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Wer
  rationale: Das personale Fragepronomen wird in der rhetorischen Frage direkt und natürlich mit „Wer“ wiedergegeben.
- source_word: χωρίσει
  choice: wird … trennen
  rationale: Die Zukunftsform bezeichnet eine mögliche künftige Trennung; „wird … trennen“ ist präzise und idiomatisch.
- source_word: ἀγάπης
  choice: Liebe
  rationale: „Liebe“ ist die übliche und sachlich passende Entsprechung für ἀγάπη.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier ein Titel. „Des Messias“ bewahrt die Genitivkonstruktion und lässt deren genaue Beziehung grundsätzlich offen, während der Kontext vor allem an die Liebe des Messias zu den Glaubenden denken lässt.
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: „Bedrängnis“ gibt äußeren Druck und schwere Not würdig und prägnant wieder.
- source_word: στενοχωρία
  choice: Angst
  rationale: Das Wort bezeichnet bedrängende Enge beziehungsweise große innere Not; „Angst“ ist verständlich und unterscheidet sich hinreichend von „Bedrängnis“.
- source_word: διωγμός
  choice: Verfolgung
  rationale: Dies ist die klare und etablierte deutsche Entsprechung im gegebenen Zusammenhang.
- source_word: λιμός
  choice: Hunger
  rationale: λιμός kann Hungersnot oder schweren Hunger bezeichnen. In der Aufzählung persönlicher Bedrohungen klingt „Hunger“ im Deutschen natürlicher, ohne die Schwere abzuschwächen.
- source_word: γυμνότης
  choice: Nacktheit
  rationale: Die direkte Wiedergabe erhält sowohl das konkrete Bild fehlender Kleidung als auch den möglichen Beiklang völliger Mittellosigkeit.
- source_word: κίνδυνος
  choice: Gefahr
  rationale: „Gefahr“ ist die natürliche moderne Entsprechung.
- source_word: μάχαιρα
  choice: Schwert
  rationale: Die wörtliche Wiedergabe bewahrt das Bild tödlicher Gewalt und löst es nicht erklärend in „gewaltsamer Tod“ auf.
theological_decisions:
- issue: Genitivbeziehung in τοῦ Χριστοῦ
  choice: Liebe des Messias
  alternative: unsere Liebe zum Messias
  rationale: Der Genitiv kann grammatisch als subjektiv oder objektiv verstanden werden. Der Zusammenhang von Römer 8,31–39 spricht stärker für die Liebe des Messias zu den Glaubenden; die andere mögliche Deutung wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Frage und die asyndetisch wirkende Reihe mit wiederholtem „oder“ folgen der Struktur des griechischen Textes. „Messias“ gibt Χριστός als Titel wieder.
