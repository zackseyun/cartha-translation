id: ROM.8.30
reference: Romans 8:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: de
  text: Die er aber vorherbestimmt[a] hat, die hat er auch berufen; und die er berufen hat, die hat er auch gerechtfertigt; die er aber gerechtfertigt hat, die hat er auch verherrlicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Voraus bestimmt“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen die Vergangenheitsform „verherrlichte“. Manche verstehen sie hier so, dass von einer zukünftigen Herrlichkeit gesprochen wird, die so gewiss ist, als wäre sie bereits vollendet.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: vorherbestimmt
  rationale: Das Verb bezeichnet ein im Voraus erfolgtes Bestimmen oder Festlegen. „Vorherbestimmt“ gibt den kompakten griechischen Ausdruck wieder, ohne ihn durch eine konfessionelle Deutung näher festzulegen.
- source_word: ἐκάλεσεν
  choice: berufen
  rationale: „Berufen“ ist in diesem paulinischen Zusammenhang die natürliche und etablierte Wiedergabe von καλέω und bewahrt die gedankliche Kette des Verses.
- source_word: ἐδικαίωσεν
  choice: gerechtfertigt
  rationale: „Gerechtfertigt“ wahrt den knappen, in Paulus häufig forensisch gebrauchten Ausdruck, ohne ihn im Haupttext erklärend zu erweitern.
- source_word: ἐδόξασεν
  choice: verherrlicht
  rationale: Der griechische Aorist wird durch die deutsche Vergangenheitsform wiedergegeben. So bleibt die auffällige Abfolge des Textes erhalten, auch wenn die Verherrlichung häufig als noch zukünftig verstanden wird.
- source_word: οὓς … τούτους
  choice: die … die
  rationale: Die wiederholte deutsche Korrelativkonstruktion bildet ab, dass in jedem Glied ausdrücklich dieselbe Personengruppe gemeint ist.
- source_word: καὶ
  choice: auch
  rationale: '„Auch“ gibt die additive Kraft wieder und macht die fortschreitende Abfolge sichtbar: vorherbestimmt, berufen, gerechtfertigt, verherrlicht.'
- source_word: δὲ
  choice: aber
  rationale: Das milde „aber“ entspricht dem verbindenden beziehungsweise leicht weiterführenden δέ und erhält zugleich die wiederholte Struktur der griechischen Satzglieder.
theological_decisions:
- issue: Ob προώρισεν abgeschwächt werden soll, um konfessionelle Folgerungen zu vermeiden
  choice: vorherbestimmt
  alternative: im Voraus bestimmt
  rationale: Der griechische Text spricht selbst von einer vorausgehenden Bestimmung. Die Übersetzung wahrt diese Aussage, ohne die Art, Grundlage oder Reichweite dieser Bestimmung näher zu definieren.
- issue: Ob ἐδόξασεν vergangen oder zukünftig wiederzugeben ist
  choice: hat … verherrlicht
  alternative: wird … verherrlichen
  rationale: Im Griechischen steht ein Aorist Indikativ. Deshalb bleibt die Vergangenheitsform im Haupttext stehen; die verbreitete Deutung als Vorwegnahme einer gewissen zukünftigen Verherrlichung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Perfekt ist im heutigen Deutsch natürlicher als eine durchgehende Präteritumreihe; die wiederholte Form „die … die“ bewahrt dennoch den nachdrücklichen Kettenbau des griechischen Satzes. Die etablierten theologischen Begriffe „berufen“, „gerechtfertigt“ und „verherrlicht“ bleiben erhalten, ohne zusätzliche Lehrdeutung.
