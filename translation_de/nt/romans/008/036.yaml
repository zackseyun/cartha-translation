review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die Zitatformel καθὼς γέγραπται angemessen wieder und bewahrt die direkte Gottesansprache in „Um deinetwillen“. Das präsentische Passiv θανατούμεθα ist mit „werden wir ... getötet“ als fortdauerndes Geschehen treffend wiedergegeben. „Den ganzen Tag“ entspricht ὅλην τὴν ἡμέραν, und „wir wurden wie Schafe zum Schlachten angesehen“ gibt den Aoristpassiv ἐλογίσθημεν sowie den Vergleich ὡς πρόβατα σφαγῆς sachgerecht wieder.
  naturalness: Das Deutsch ist modernes Standarddeutsch und zugleich für ein Schriftzitat würdevoll. „Wie geschrieben steht“ und „Um deinetwillen“ sind geläufige, angemessen gehobene Formulierungen. Die Satzführung ist klar und die Schlachtmetaphorik bleibt verständlich.
  terminology: Die zentralen Begriffe sind konsistent und nicht unnötig theologisch eingeengt. „Angesehen“ trifft hier die Bedeutung von λογίζομαι („betrachtet/gerechnet“) natürlich. „Schafe zum Schlachten“ erhält das Bild von „Schafen zur Schlachtung“, ohne eine bestimmte dogmatische Deutung zu ergänzen.
  issues: []
  revised_text: ''
  revised_footnotes: []
  revision_rationale: Keine sichere Korrektur erforderlich. Der Entwurf ist quellennah, idiomatisch und erhält sowohl die zeitliche Fortdauer als auch den passiven Charakter der Aussage. Eine Fußnote zur möglichen Wiedergabe von ἐλογίσθημεν ist nicht erforderlich, da „angesehen“ die im englischen Audit Trail genannte lexikalische Alternative bereits transparent ausdrückt.
