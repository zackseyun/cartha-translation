id: ROM.8.36
reference: Romans 8:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: de
  text: 'Wie geschrieben steht: »Um deinetwillen werden wir den ganzen Tag getötet; wir wurden wie Schafe zum Schlachten angesehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Wie geschrieben steht
  rationale: Natürliche und würdevolle deutsche Einleitungsformel für ein Schriftzitat; sie wahrt den Anschluss an den vorausgehenden Gedankengang und die fortgeltende Aussage des Perfekts.
- source_word: Ἕνεκεν σοῦ
  choice: Um deinetwillen
  rationale: Bewahrt den kausalen Sinn und die unmittelbare Anrede Gottes; die Formulierung entspricht zugleich dem gehobenen Register des Zitats.
- source_word: θανατούμεθα
  choice: werden wir … getötet
  rationale: Gibt das Präsens Passiv als fortdauerndes Erleiden tödlicher Gewalt wieder, ohne die Aussage auf eine bestimmte Form des Sterbens einzuengen.
- source_word: ὅλην τὴν ἡμέραν
  choice: den ganzen Tag
  rationale: Idiomatiche deutsche Wiedergabe der zeitlichen Ausdehnung; im Kontext bezeichnet sie unablässige Gefährdung beziehungsweise fortwährendes Erleiden.
- source_word: ἐλογίσθημεν
  choice: wir wurden … angesehen
  rationale: λογίζομαι bedeutet hier, als etwas betrachtet oder eingestuft zu werden. „Angesehen“ ist im Deutschen natürlich und erhält den passiven Sinn.
- source_word: ὡς πρόβατα σφαγῆς
  choice: wie Schafe zum Schlachten
  rationale: Bewahrt den Vergleich und das drastische Schlachtbild der griechischen Genitivverbindung in klarem, heutigem Deutsch.
theological_decisions:
- issue: Zitat aus Psalm 44,23 (LXX 43,23) im Zusammenhang des Leidens
  choice: Die gemeinschaftliche und fortdauernde Erfahrung tödlicher Bedrohung bleibt ohne zusätzliche Deutung stehen.
  alternative: Die Aussage ausdrücklich auf Märtyrertod oder eine bestimmte Gruppe von Verfolgten beschränken.
  rationale: Der griechische Text zitiert die Klage unvermittelt und lässt ihre Anwendung im Zusammenhang wirken. Eine engere dogmatische Festlegung wäre interpretierend.
translation_notes:
  register: Modernes Standarddeutsch mit einem würdevollen, leicht gehobenen Ton für das Schriftzitat. „Um deinetwillen“ ist bewusst feierlicher als „wegen dir“, bleibt aber allgemein verständlich. Keine Fußnote erforderlich; die im englischen Material genannte Alternative gehört sachlich zu ἐλογίσθημεν, doch „angesehen“ bildet diese Bedeutung bereits im Haupttext klar ab.
