revisions:
- from: Ebenso hilft auch der Geist unserer Schwachheit auf. Denn wir wissen nicht, was wir beten sollen, wie es nötig wäre; doch der Geist selbst tritt mit unaussprechlichen Seufzern[a] für uns ein.
  to: Ebenso kommt auch der Geist unserer Schwachheit zu Hilfe. Denn wir wissen nicht, worum wir beten sollen, wie es sich gehört; doch der Geist selbst tritt mit unaussprechlichen Seufzern[a] für uns ein,
  rationale: Die Revision ersetzt zwei im heutigen Deutsch unnatürliche Formulierungen. Sie wahrt dabei den kollektiven Singular „Schwachheit“, die verstärkende Hilfeleistung des Geistes, die offene Reichweite von καθὸ δεῖ sowie die durch das Satzende angezeigte Fortsetzung zum nächsten Vers. Die Fußnotenverankerung bleibt unmittelbar bei „unaussprechlichen Seufzern“.
