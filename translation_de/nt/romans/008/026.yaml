    rationale: Die Verbindung „jemandem/einer Sache aufhelfen“ ist zwar möglich, wirkt hier aber ungebräuchlich und bezeichnet oft ein Aufhelfen nach Sturz oder Schwäche. Sie ist keine natürliche Wiedergabe von συναντιλαμβάνεται in diesem Satz.
  - severity: medium
    issue: „was wir beten sollen, wie es nötig wäre“
    rationale: Die Formulierung ist im modernen Deutsch holprig und stellt die Beziehung von τί προσευξώμεθα zu καθὸ δεῖ nicht idiomatisch dar. Die Quelle meint, dass die Betenden nicht wissen, worum sie in angemessener Weise beten sollen.
