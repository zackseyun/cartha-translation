id: ROM.8.26
reference: Romans 8:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: de
  text: Ebenso kommt auch der Geist unserer Schwachheit zu Hilfe. Denn wir wissen nicht, worum wir beten sollen, wie es sich gehört; doch der Geist selbst tritt mit unaussprechlichen Seufzern[a] für uns ein,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit wortlosen Seufzern“ beziehungsweise „mit Seufzern, die sich nicht in Worte fassen lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: Ebenso … auch
  rationale: Knüpft vergleichend an den vorherigen Gedankengang an; δέ bleibt durch den natürlichen deutschen Anschluss unausgedrückt.
- source_word: συναντιλαμβάνεται
  choice: hilft … auf
  rationale: 'Gibt mehr als bloße Unterstützung wieder: Der Geist nimmt sich unserer Schwachheit an und trägt helfend mit.'
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: unserer Schwachheit
  rationale: Der Singular bleibt erhalten und bezeichnet umfassend die menschliche Begrenztheit, ohne sie körperlich oder geistlich zu verengen.
- source_word: τὸ γὰρ τί προσευξώμεθα
  choice: Denn wir wissen nicht, was wir beten sollen
  rationale: Der deliberative Konjunktiv wird idiomatisch mit „sollen“ wiedergegeben; ein ergänztes „wofür“ würde die griechische Formulierung unnötig auf den Gebetsinhalt verengen.
- source_word: καθὸ δεῖ
  choice: wie es nötig wäre
  rationale: Bewahrt den Gedanken des Erforderlichen und lässt offen, ob vor allem Inhalt, Weise oder beides gemeint ist.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: der Geist selbst
  rationale: Die emphatische Konstruktion wird bewahrt; Deutsch benötigt hier trotz des griechischen Neutrums keine geschlechtsspezifische Ergänzung.
- source_word: ὑπερεντυγχάνει
  choice: tritt … für uns ein
  rationale: Gibt die intensive Fürsprache idiomatisch wieder. „Für uns“ ist im Verbzusammenhang sinngemäß enthalten und im Deutschen für die gemeinte Fürbitte klar.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: mit unaussprechlichen Seufzern
  rationale: ἀλάλητος kann das sprachlich nicht Ausdrückbare oder Wortlose bezeichnen. „Unaussprechlich“ bewahrt diese Bedeutungsbreite besser als eine eindeutige Festlegung auf bloß unausgesprochene Seufzer.
theological_decisions:
- issue: Ob πνεῦμα wegen seines griechischen grammatischen Neutrums unpersönlich wiederzugeben ist
  choice: der Geist selbst
  alternative: der Geist selber / es selbst
  rationale: Die Verben des Helfens und Eintretens stellen den Geist als handelnden Akteur dar. „Der Geist selbst“ wahrt die Emphase, ohne aus dem grammatischen Genus eine zusätzliche dogmatische Aussage abzuleiten.
- issue: Wessen Seufzer mit στεναγμοῖς ἀλαλήτοις gemeint sind
  choice: Die deutsche Satzstruktur ordnet sie der Fürsprache des Geistes zu, ohne ihre Erfahrungsweise näher zu erklären.
  alternative: ausdrückliche Zuordnung zu den Seufzern der Glaubenden oder ausschließlich zu eigenen Seufzern des Geistes
  rationale: Grammatisch bestimmen die Seufzer das Eintreten des Geistes; der Text erläutert jedoch nicht, wie sich diese Seufzer zur Erfahrung der Betenden verhalten. Diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hilft … auf“ bewahrt die kräftige Mitwirkung des seltenen Verbs, ohne die unnatürlich wörtliche Bildform „fasst mit an“ zu erzwingen. Das Semikolon verdeutlicht, dass das Nichtwissen den Inhalt oder die rechte Weise des Gebets betreffen kann.
