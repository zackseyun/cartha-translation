  text: Those who are in the flesh cannot please God[a].
translation:
  language: de
  text: Die aber im Fleisch sind, können Gott nicht gefallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Fleisch“. Es kann einen von der sündigen menschlichen Natur bestimmten Zustand bezeichnen. Das griechische Wort „Fleisch“ ist in diesem Zusammenhang ein wichtiger Begriff bei Paulus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: wer ... bestimmt ist
  rationale: Der substantivierte Partizipialausdruck bezeichnet eine Gruppe von Menschen in einem gegenwärtigen Zustand. Die singularische deutsche Klassenbezeichnung mit „wer“ ist natürlich und schließt alle Betroffenen ein.
- source_word: δὲ
  choice: aber
  rationale: δέ führt den Gegensatz zum vorherigen Kontext weiter; „aber“ macht diesen Zusammenhang im Deutschen knapp und klar sichtbar.
- source_word: ἐν σαρκὶ
  choice: vom Fleisch bestimmt
  rationale: Die Wendung bezeichnet hier nicht bloß körperliche Existenz, sondern einen durch σάρξ geprägten Zustand. „Vom Fleisch bestimmt“ gibt die metaphorische Kraft natürlich wieder, ohne den paulinischen Schlüsselbegriff „Fleisch“ auf eine einzige Deutung festzulegen.
- source_word: ἀρέσαι
  choice: gefallen
  rationale: „Gott gefallen“ ist die natürliche deutsche Entsprechung des Infinitivs ἀρέσαι mit θεῷ.
- source_word: θεῷ
  choice: Gott
  rationale: Der griechische Dativ wird in der deutschen Verbindung „Gott gefallen“ unmittelbar bewahrt.
- source_word: οὐ δύνανται
  choice: kann ... nicht
  rationale: Die deutsche Konstruktion drückt die verneinte Fähigkeit knapp und idiomatisch aus.
theological_decisions:
- issue: Wiedergabe von σάρξ im umstrittenen paulinischen Kontext
  choice: vom Fleisch bestimmt
  alternative: in der sündigen menschlichen Natur / im Fleisch
  rationale: Die Hauptfassung bewahrt „Fleisch“ als paulinischen Leitbegriff und macht zugleich deutlich, dass ein bestimmender Macht- oder Lebensbereich gemeint ist. Die Fußnote nennt sowohl die formnähere als auch die stärker deutende Möglichkeit, ohne die theologische Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist gut verständlich und hält durch „Fleisch“ die begriffliche Verbindung im unmittelbaren Kontext von Römer 8 aufrecht.
