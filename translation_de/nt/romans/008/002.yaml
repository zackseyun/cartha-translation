id: ROM.8.2
reference: Romans 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: de
  text: Denn das Gesetz[a] des Geistes des Lebens im Messias Jesus[c] hat dich[b] vom Gesetz der Sünde und des Todes befreit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „Prinzip“: „Denn das Prinzip des Geistes des Lebens …“'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften haben „mich“ statt „dich“.
    reason: textual_variant
  - marker: c
    text: 'Traditionelle Wiedergabe: „in Christus Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: Gesetz
  rationale: Beide Vorkommen werden gleich wiedergegeben, um die Wiederholung und die Spannung in Paulus’ Bildsprache zu bewahren. „Prinzip“ wäre möglich, würde die Bedeutung aber stärker festlegen.
- source_word: πνεύματος
  choice: Geist
  rationale: Der Zusammenhang von Römer 8 spricht am ehesten vom Heiligen Geist als dem, der Leben gibt; die Großschreibung macht diesen Bezug sichtbar.
- source_word: ζωῆς
  choice: Leben
  rationale: Die Genitivverbindung „Geist des Lebens“ bleibt ohne erklärende Erweiterung erhalten.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird als Titel mit „Messias“ wiedergegeben. „Im“ bewahrt die paulinische Wendung für die Verbundenheit mit dem Messias und klingt im Deutschen natürlicher als „in Messias Jesus“.
- source_word: ἠλευθέρωσέν
  choice: hat … befreit
  rationale: Das deutsche Perfekt bezeichnet idiomatisch die vollzogene Befreiung und lässt ihre fortdauernde Wirkung erkennen.
- source_word: σε
  choice: dich
  rationale: Die Übersetzung folgt der Lesart der SBLGNT-Ausgabe im Singular der zweiten Person; die Variante „mich“ wird in einer Fußnote dokumentiert.
- source_word: ἁμαρτίας
  choice: Sünde
  rationale: Die Einzahl bewahrt Paulus’ Darstellung der Sünde sowohl als Wirklichkeit als auch als versklavende Macht.
- source_word: θανάτου
  choice: Tod
  rationale: Die knappe Verbindung „Sünde und Tod“ bleibt erhalten.
theological_decisions:
- issue: Bezeichnet πνεύματος den Heiligen Geist oder den menschlichen Geist beziehungsweise ein geistliches Prinzip?
  choice: Heiliger Geist („Geist“ großgeschrieben)
  alternative: menschlicher Geist oder geistliches Prinzip
  rationale: Der Gegensatz zwischen Fleisch, Sünde und Tod einerseits und dem Leben gebenden Geist andererseits spricht im Zusammenhang von Römer 8 am stärksten für den Heiligen Geist.
- issue: Ist νόμος hier wörtlich als „Gesetz“ oder deutend als „Prinzip“ zu verstehen?
  choice: Gesetz
  alternative: Prinzip oder Gesetzmäßigkeit
  rationale: „Gesetz“ bewahrt die bewusste Wiederholung desselben griechischen Wortes und lässt offen, ob Paulus an ein Gesetz, eine wirksame Ordnung oder ein Prinzip denkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Ausgangstext, ohne unnatürlich zu wirken. „Messias“ behandelt Χριστός als Titel; „im Messias Jesus“ bewahrt zugleich die paulinische In-Christus-Formulierung.
