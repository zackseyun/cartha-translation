id: ROM.8.17
reference: Romans 8:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: de
  text: Sind wir aber Kinder, dann sind wir auch Erben – Erben Gottes und Miterben des Messias, wenn wir denn[a] mit ihm leiden, damit wir auch mit ihm verherrlicht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „vorausgesetzt, dass wir mit ihm leiden“.'
    reason: εἴπερ kann stärker konditional verstanden werden; die Fußnote macht diese Nuance sichtbar, ohne den Haupttext unnötig zu verschärfen.
lexical_decisions:
- source_word: τέκνα
  choice: Kinder
  rationale: Das sächliche Pluralwort bezeichnet die Zugehörigkeit zur Familie und den Kindesstatus ohne Festlegung auf ein Geschlecht; „Kinder“ gibt dies im Deutschen präzise wieder.
- source_word: κληρονόμοι
  choice: Erben
  rationale: Der geläufige rechtlich-familiäre Ausdruck bewahrt den Zusammenhang von Kindschaft und Erbe.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird direkt wiedergegeben und lässt die im Ausdruck liegende Beziehung des Erbes zu Gott offen.
- source_word: συγκληρονόμοι
  choice: Miterben
  rationale: Die Vorsilbe συν- bezeichnet gemeinsame Teilhabe am Erbe; „Miterben“ ist knapp, natürlich und präzise.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός trägt hier als Bezeichnung des gesalbten königlichen Heilsträgers titularen Sinn; „Messias“ macht diesen im modernen Deutsch sichtbar.
- source_word: εἴπερ
  choice: wenn wir denn
  rationale: Die Wendung bewahrt sowohl die wirkliche Bedingung als auch den rhetorisch erwartenden Nachdruck, ohne sie zu „da“ abzuschwächen.
- source_word: συμπάσχομεν
  choice: wir mit ihm leiden
  rationale: Die Mitbeteiligung der συν-Bildung wird ausdrücklich auf den Messias bezogen und natürlich formuliert.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Ziel- beziehungsweise Folgebeziehung knapp wieder, ohne sie weiter festzulegen.
- source_word: συνδοξασθῶμεν
  choice: wir auch mit ihm verherrlicht werden
  rationale: Die passive Form und die gemeinsame Teilhabe der συν-Bildung bleiben beide erhalten.
theological_decisions:
- issue: Ob εἴπερ συμπάσχομεν das Mitleiden als verdienstliche Voraussetzung oder als erwartetes Muster der Gemeinschaft mit dem Messias bezeichnet
  choice: Die reale Bedingung wird mit „wenn wir denn mit ihm leiden“ bewahrt, ohne dem Leiden verdienstliche Wirkung zuzuschreiben.
  alternative: „Da wir mit ihm leiden“ würde die Bedingung abschwächen; „nur wenn wir durch Leiden die Herrlichkeit verdienen“ würde eine nicht ausgesagte Verdienstlehre eintragen.
  rationale: Der griechische Wortlaut hat echte konditionale Kraft und verbindet Leiden und Verherrlichung mit der gemeinsamen Teilhabe am Weg des Messias; wie diese Bedingung dogmatisch einzuordnen ist, wird nicht stillschweigend entschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Griechischen elliptische Eröffnung wird zur natürlichen deutschen Satzform ergänzt. Die parallelen συν-Bildungen werden durch „mit ihm“ wiedergegeben; der Gedankenstrich erhält die erläuternde Steigerung des Satzes.
