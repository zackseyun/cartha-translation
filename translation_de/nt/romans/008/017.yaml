  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und die zentralen Ausdrücke des Griechischen zuverlässig wieder: τέκνα als „Kinder“, κληρονόμοι als „Erben“, συγκληρονόμοι als „Miterben des Messias“, die reale, rhetorisch akzentuierte Bedingung εἴπερ als „wenn wir denn“ sowie die Mitteilhabe in συμπάσχομεν und συνδοξασθῶμεν durch „mit ihm“. Das Passiv von συνδοξασθῶμεν bleibt in „verherrlicht werden“ erhalten. Die Ergänzung „Sind wir“ ist eine notwendige und sinnentsprechende Auflösung der griechischen Ellipse.'
