id: ROM.8.13
reference: Romans 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: de
  text: Denn wenn ihr nach dem Fleisch lebt,[a] werdet ihr sterben; wenn ihr aber durch den Geist die Taten des Leibes tötet, werdet ihr leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach dem Fleisch«. Gemeint ist hier ein Leben, das sich an der von der Sünde bestimmten menschlichen Existenz ausrichtet.'
    reason: Die wörtliche paulinische Wendung bleibt im Haupttext erhalten; die Fußnote erschließt ihren ethischen Sinn, ohne ihre Bedeutungsbreite auf »sündige Natur« zu verengen.
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende und an den vorausgehenden Gedankengang anknüpfende Funktion.
- source_word: κατὰ σάρκα
  choice: nach dem Fleisch
  rationale: Gibt die paulinische Formulierung eng wieder und bewahrt ihre körperliche, ethische und heilsgeschichtliche Bedeutungsbreite, ohne sie auf »sündige Natur« festzulegen.
- source_word: ζῆτε
  choice: ihr lebt
  rationale: Entspricht dem Präsens im Bedingungssatz und klingt im modernen Deutsch natürlich.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: werdet ihr sterben
  rationale: Gibt die bevorstehende beziehungsweise sichere Folge idiomatisch wieder; eine Übersetzung mit »im Begriff sein« würde im Deutschen eine möglicherweise zu starke zeitliche Unmittelbarkeit nahelegen.
- source_word: πνεύματι
  choice: durch den Geist
  rationale: Versteht den Dativ instrumental; der Zusammenhang von Römer 8 spricht deutlich für Gottes Heiligen Geist als handelnde Kraft.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: die Taten des Leibes
  rationale: Bewahrt den Genitiv und den konkreten ethischen Sinn von πράξεις; »Leib« entspricht in diesem theologischen Zusammenhang σῶμα würdig und präzise.
- source_word: θανατοῦτε
  choice: tötet
  rationale: Gibt die starke, fortdauernd beziehungsweise wirksam gedachte Handlung direkt wieder, ohne das im Deutschen schwerfälligere »zu Tode bringt«.
- source_word: ζήσεσθε
  choice: werdet ihr leben
  rationale: Entspricht schlicht und klar dem griechischen Futur.
theological_decisions:
- issue: Bedeutung von σάρξ im ethischen Gegensatz
  choice: das Bild mit »Fleisch« bewahren
  alternative: »sündige Natur«
  rationale: »Sündige Natur« legt die vielschichtige paulinische Verwendung stärker aus, als der griechische Wortlaut verlangt, und könnte eine bestimmte Anthropologie eintragen. Eine Fußnote erläutert den kontextuellen Sinn.
- issue: Bezug von πνεύματι
  choice: der Heilige Geist
  alternative: der menschliche Geist oder bewusst unbestimmt »Geist«
  rationale: Der unmittelbare Zusammenhang von Römer 8 bezeichnet wiederholt Gottes Geist; die Großschreibung macht diesen wahrscheinlichen Bezug sichtbar, ohne einen Zusatz wie »Heiliger« in den Haupttext einzufügen.
- issue: Reichweite von μέλλετε ἀποθνῄσκειν
  choice: »werdet ihr sterben«
  alternative: »seid ihr im Begriff zu sterben«
  rationale: Die Aussage bezeichnet die drohende beziehungsweise sichere Folge eines Lebens nach dem Fleisch. Der Kontext verlangt keine Festlegung auf unmittelbar bevorstehenden leiblichen Tod.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in der vertrauten Anredeform des Plurals. Der Satzbau wahrt die parallelen Bedingungen und Folgen des griechischen Textes. »Fleisch«, »Geist« und »Leib« bleiben als voneinander unterschiedene Leitbegriffe sichtbar.
