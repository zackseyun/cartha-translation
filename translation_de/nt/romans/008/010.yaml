  rationale: Die Revision verlegt die Anmerkung zur möglichen Bedeutung von πνεῦμα an „Geist“ und ergänzt die im englischen Audit-Trail ausgewiesene Alternative zu δικαιοσύνη. Der Haupttext bleibt eng am Griechischen, wahrt dessen referenzielle Offenheit und erhält die knappe prädikative Formulierung „ist … Leben“.
