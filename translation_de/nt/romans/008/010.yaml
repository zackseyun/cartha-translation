id: ROM.8.10
reference: Romans 8:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: de
  text: Wenn aber der Messias in euch ist, ist der Körper zwar wegen der Sünde tot[a], der Geist[b] aber wegen der Gerechtigkeit Leben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist der Körper dem Tod unterworfen« oder »ist der Körper sterblich«.'
    reason: lexical_alternative
  - marker: b
    text: »Geist« kann hier den von Gott lebendig gemachten menschlichen Geist oder den Heiligen Geist bezeichnen.
    reason: alternative_reading
  - marker: c
    text: 'Oder: »wegen des Rechts«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός behält hier seine titelartige Bedeutung; „Messias“ gibt diese im heutigen Deutsch verständlich wieder.
- source_word: σῶμα
  choice: der Körper
  rationale: σῶμα bezeichnet den Körper und bildet den konkreten Gegensatz zu πνεῦμα; „Fleisch“ würde ein anderes griechisches Wort nahelegen.
- source_word: νεκρὸν
  choice: tot
  rationale: Die unmittelbare Bedeutung des Adjektivs wird bewahrt, ohne die Aussage im Haupttext zu „sterblich“ abzuschwächen.
- source_word: διὰ ἁμαρτίαν
  choice: wegen der Sünde
  rationale: διά mit Akkusativ hat hier kausale Bedeutung; die Formulierung bewahrt Paulus’ knappe Ursachenangabe.
- source_word: πνεῦμα
  choice: der Geist
  rationale: 'Die deutsche Schreibung lässt den Bezug in gewissem Maß offen: Gemeint sein kann der von Gott lebendig gemachte menschliche Geist oder der Heilige Geist.'
- source_word: ζωὴ
  choice: ist Leben
  rationale: Das Substantiv ζωή wird als „Leben“ wiedergegeben; so bleibt die verdichtete nominale Aussage erhalten.
- source_word: διὰ δικαιοσύνην
  choice: wegen der Gerechtigkeit
  rationale: Die kausale Bedeutung von διά bleibt erhalten; „Gerechtigkeit“ ist im paulinischen Zusammenhang die sachlich und sprachlich angemessene Wiedergabe von δικαιοσύνη.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: der Geist
  alternative: der menschliche Geist; der Heilige Geist
  rationale: Der Text kann den durch Gott lebendig gemachten menschlichen Geist oder unmittelbar den Heiligen Geist meinen. Die Übersetzung entscheidet diese Spannung nicht durch einen erläuternden Zusatz.
- issue: Aussagekraft von νεκρὸν bei σῶμα
  choice: der Körper ist tot
  alternative: der Körper ist dem Tod unterworfen; der Körper ist sterblich
  rationale: Obwohl wahrscheinlich die durch die Sünde bedingte Sterblichkeit gemeint ist, lautet die scharfe Formulierung des griechischen Textes „tot“ und wird im Haupttext beibehalten.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht bzw. rechtmäßiges Urteil
  rationale: „Gerechtigkeit“ bewahrt die breite paulinische Bedeutung, ohne vorschnell festzulegen, ob Gottes rettendes Handeln, der zugesprochene gerechte Stand oder gelebte Gerechtigkeit im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „zwar … aber“ bildet μέν … δέ natürlich ab. „Wenn … dann“ macht das griechische Bedingungsgefüge verständlich, ohne seinen Sinn zu erweitern. Sämtliche Fußnotenmarker stehen an den jeweils einschlägigen Aussagen im Haupttext.
