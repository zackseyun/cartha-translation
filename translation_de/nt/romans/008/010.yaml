  source_fidelity: Der Haupttext gibt die Satzglieder, die kausalen Angaben διὰ mit Akkusativ sowie die spannungsvolle Gegenüberstellung von σώμα und πνεῦμα im Wesentlichen treffend wieder. Die Ambiguität von πνεῦμα wird jedoch derzeit erst durch eine Fußnote am nicht zugehörigen Wort „Gerechtigkeit“ markiert; zudem fehlt die aus dem Audit hervorgehende lexikalische Alternative zu δικαιοσύνη.
  naturalness: „Wenn aber …, ist … zwar …, … aber …“ ist modernes, würdevolles Standarddeutsch und bildet die griechische μὲν–δὲ-Struktur natürlich ab. Die Stellung von „zwar“ nach „der Körper“ verbessert den Kontrast und die Lesbarkeit.
  terminology: „Messias“, „Körper“, „Sünde“, „Geist“, „Leben“ und „Gerechtigkeit“ sind sachgerecht. Das Substantiv „Geist“ wird im Deutschen unabhängig vom gemeinten Referenten großgeschrieben; die Fußnote muss deshalb die syntaktisch nicht entschiedene Referenz erläutern.
