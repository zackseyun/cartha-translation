  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: de
  text: Der Geist selbst bezeugt zusammen mit unserem Geist, dass wir Kinder Gottes sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Geist selbst bestätigt unserem Geist, dass wir Kinder Gottes sind.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Der Geist selbst
  rationale: Die emphatische Verbindung mit αὐτό wird durch „selbst“ bewahrt. Im Deutschen besitzt „Geist“ grammatisch männliches Genus, sodass keine besondere Anpassung zur Kennzeichnung personaler Wirksamkeit nötig ist.
- source_word: συμμαρτυρεῖ
  choice: bezeugt zusammen mit
  rationale: Das Präfix συν- bezeichnet ein gemeinsames beziehungsweise begleitendes Zeugnis. „Bezeugt zusammen mit“ macht diesen Sinn in heutigem Deutsch deutlicher als das mögliche, aber mehrdeutige „bezeugt unserem Geist“.
- source_word: τῷ πνεύματι ἡμῶν
  choice: mit unserem Geist
  rationale: 'Der Dativ wird im Zusammenhang mit συμμαρτυρεῖ als Gemeinschaft oder Begleitung verstanden: Gottes Geist legt zusammen mit unserem Geist Zeugnis ab.'
- source_word: ὅτι ἐσμὲν
  choice: dass wir ... sind
  rationale: ὅτι leitet den Inhalt des Zeugnisses ein; die schlichte deutsche dass-Konstruktion gibt dies direkt wieder.
- source_word: τέκνα θεοῦ
  choice: Kinder Gottes
  rationale: τέκνα ist geschlechtsübergreifend und bezeichnet Kinder, nicht eigens Söhne. „Kinder Gottes“ ist eine natürliche und zugleich würdige deutsche Formulierung.
theological_decisions:
- issue: Verhältnis des Zeugnisses des Heiligen Geistes zu unserem Geist
  choice: „zusammen mit unserem Geist“
  alternative: „unserem Geist gegenüber“ beziehungsweise „unserem Geist bezeugt“
  rationale: συμμαρτυρεῖ bezeichnet am ehesten ein Mitbezeugen. Die Übersetzung bewahrt damit zwei zugleich genannte Zeugnisträger, ohne näher festzulegen, wie ihr Zeugnis innerlich erfahren wird.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. „Bezeugt zusammen mit“ ist bewusst etwas ausführlicher, um die Bedeutung von συμμαρτυρεῖ und die echte Auslegungsalternative transparent zu halten.
