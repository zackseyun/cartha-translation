id: ROM.8.7
reference: Romans 8:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: de
  text: Denn die Gesinnung des Fleisches ist Feindschaft gegen Gott[a]; dem Gesetz Gottes ordnet sie sich nämlich nicht unter, denn sie kann es nicht einmal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gesinnung der sündigen menschlichen Natur“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aussage ein und bewahrt die kausale Verknüpfung in natürlichem Deutsch.
- source_word: τὸ φρόνημα
  choice: die Gesinnung
  rationale: Bezeichnet nicht nur einzelne Gedanken, sondern die innere Ausrichtung oder Denkhaltung; „Gesinnung“ gibt diesen dispositionellen Sinn prägnant wieder.
- source_word: τῆς σαρκὸς
  choice: des Fleisches
  rationale: Bewahrt den für Paulus charakteristischen, metaphorisch gebrauchten Ausdruck und vermeidet, seine Bedeutung im Haupttext vorschnell auf eine einzige Deutung festzulegen.
- source_word: ἔχθρα εἰς θεόν
  choice: Feindschaft gegen Gott
  rationale: Gibt das Substantiv ἔχθρα als Substantiv wieder und macht mit „gegen“ deutlich, dass sich die Feindschaft auf Gott richtet.
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: sie ordnet sich nämlich dem Gesetz Gottes nicht unter
  rationale: Das reflexive „ordnet sich … unter“ gibt die mögliche mediale Bedeutung idiomatisch wieder; „nämlich“ nimmt die begründende Funktion von γάρ auf.
- source_word: οὐδὲ γὰρ δύναται
  choice: ja, sie kann es nicht einmal
  rationale: Bewahrt die ausdrücklich ausgesagte Unfähigkeit und die Steigerung durch οὐδέ. Das Pronomen „es“ verweist auf das Sich-Unterordnen.
theological_decisions:
- issue: Metaphorische Bedeutung von σάρξ
  choice: Im Haupttext „Fleisch“, mit einer erklärenden Alternative in der Fußnote.
  alternative: die sündige menschliche Natur
  rationale: Der Kontext bezeichnet eine gottwidrige menschliche Ausrichtung, doch „Fleisch“ hält die paulinische Bildsprache und ihre Bedeutungsbreite offen.
- issue: Charakter der Aussage ἔχθρα εἰς θεόν
  choice: „Feindschaft gegen Gott“ als substantivische Aussage.
  alternative: „Gott feindlich“
  rationale: Die substantivische Form folgt dem griechischen Wortlaut und stellt die radikale Gleichsetzung heraus, statt sie zu einer bloßen Eigenschaft abzuschwächen.
- issue: Unfähigkeit im Schlusssatz
  choice: 'Die Unfähigkeit wird ohne Abschwächung wiedergegeben: „sie kann es nicht einmal“.'
  alternative: sie will sich nicht unterordnen
  rationale: δύναται spricht ausdrücklich vom Können. Der Text wird nicht durch eine zusätzliche dogmatische Erklärung ergänzt oder auf bloßen Unwillen reduziert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt argumentativ eng am Griechischen; „Gesinnung“ und „Feindschaft“ bewahren die gewichtige substantivische Ausdrucksweise, während „ordnet sich … unter“ und „kann es nicht einmal“ gegenwärtig und verständlich formuliert sind.
