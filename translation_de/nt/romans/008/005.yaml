  source_fidelity: Die Übersetzung gibt die antithetische Struktur des Griechischen genau wieder. »nach dem Fleisch/Geist leben« ist eine idiomatische deutsche Entfaltung von κατὰ σάρκα/πνεῦμα ὄντες und entspricht auch der englischen POB-Entscheidung. »richten ihren Sinn auf« trifft φρονοῦσιν als Ausrichtung bzw. Gesinnung, nicht lediglich als Denkakt. Die Ellipse im zweiten Satzglied ist im Deutschen klar verständlich und bewahrt die Vorlage.
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die parallele Satzführung mit der ausgelassenen Wiederholung von »richten ihren Sinn« ist natürlich und stilistisch passend.
  terminology: Die Leitbegriffe »Fleisch« und »Geist« sind sachgerecht beibehalten. »das, was zum Fleisch/Geist gehört« gibt die substantivierten Genitive präzise wieder, ohne eine theologisch verengende Deutung einzutragen. Für diesen Vers sind keine Fußnoten erforderlich.
