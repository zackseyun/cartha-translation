id: ROM.8.5
reference: Romans 8:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: de
  text: Denn die, die nach dem Fleisch leben, richten ihren Sinn auf das, was zum Fleisch gehört; die aber, die nach dem Geist leben, auf das, was zum Geist gehört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: die nach dem Fleisch leben
  rationale: Die Wendung bezeichnet eine vom »Fleisch« bestimmte Daseinsweise. »Leben« gibt dies im Deutschen natürlich wieder, ohne σάρξ auf den Körper oder eine bloße menschliche Natur zu verengen.
- source_word: φρονοῦσιν
  choice: richten ihren Sinn auf
  rationale: Das Verb bezeichnet nicht nur Denken, sondern eine innere Ausrichtung, Gesinnung und Interessenlage. »Ihren Sinn richten auf« bewahrt diese Breite.
- source_word: τὰ τῆς σαρκὸς / τὰ τοῦ πνεύματος
  choice: das, was zum Fleisch / zum Geist gehört
  rationale: Diese Formulierung gibt die substantivierten Genitivwendungen verständlich wieder und vermeidet die missverständliche Rede von materiellen »Dingen«.
- source_word: πνεῦμα
  choice: Geist
  rationale: Im unmittelbaren Zusammenhang von Römer 8 weist der Ausdruck auf Gottes Geist; »Geist« bewahrt zugleich die knappe Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Bedeutung von σάρξ
  choice: Fleisch
  alternative: sündige Natur
  rationale: »Fleisch« erhält Paulus’ vielschichtigen Begriff und legt ihn nicht vorschnell auf eine einzige dogmatische Erklärung fest.
- issue: Bezug von πνεῦμα
  choice: Geist
  alternative: menschlicher Geist
  rationale: Der Kontext von Römer 8 spricht überwiegend für Gottes Geist. Die schlichte Wiedergabe »Geist« macht diesen Bezug deutlich, ohne dem Vers zusätzliche Erläuterungen einzuschreiben.
- issue: Elliptischer zweiter Satzteil
  choice: Das Prädikat »richten ihren Sinn« bleibt sinngemäß mitverstanden
  alternative: Wiederholung des vollständigen Prädikats
  rationale: Wie im Griechischen kann das Deutsche das Prädikat nach »die aber« auslassen; dies erhält die Parallelstruktur und bleibt eindeutig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusster Beibehaltung der paulinischen Leitbegriffe »Fleisch« und »Geist«. Die Satzparallelität und die Ellipse des griechischen Textes bleiben erhalten.
