  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: de
  text: Wenn wir aber auf das hoffen, was wir nicht sehen, warten wir mit Ausdauer[a] darauf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Geduld« oder »durch Beharrlichkeit«.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch ein erwartungsvolles oder gespanntes Warten ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn wir aber
  rationale: Bewahrt die Bedingung εἰ und die leicht kontrastierende beziehungsweise weiterführende Kraft von δέ in natürlichem Deutsch.
- source_word: ὃ οὐ βλέπομεν
  choice: was wir nicht sehen
  rationale: Gibt das substantivierte neutrale Relativpronomen idiomatisch wieder und bewahrt die schlichte Aussage des Präsens, ohne ein »nicht sehen können« hinzuzufügen.
- source_word: ἐλπίζομεν
  choice: auf das hoffen
  rationale: Das Deutsche verwendet bei einem ausdrücklichen Gegenstand idiomatisch »auf etwas hoffen«; die fortdauernde, zukunftsgerichtete Erwartung bleibt erhalten.
- source_word: δι’ ὑπομονῆς
  choice: mit Ausdauer
  rationale: »Ausdauer« erfasst standhaftes Ausharren unter Verzögerung oder Belastung besser als bloße passive Geduld.
- source_word: ἀπεκδεχόμεθα
  choice: warten wir … darauf
  rationale: Die Formulierung ist natürlich und gibt das erwartungsvolle Warten wieder; die mögliche stärkere Nuance gespannten oder sehnsüchtigen Erwartens wird in einer Fußnote genannt.
theological_decisions:
- issue: Gegenstand der christlichen Hoffnung angesichts der noch unsichtbaren zukünftigen Erfüllung
  choice: 'Der Gegenstand bleibt entsprechend dem griechischen Relativsatz unbestimmt: »was wir nicht sehen«.'
  alternative: Den Gegenstand aus dem Zusammenhang ausdrücklich als Rettung, Erlösung oder Auferstehung benennen.
  rationale: Der nähere Kontext legt diese Vorstellungen nahe, doch der Vers selbst nennt sie nicht ausdrücklich. Die Übersetzung bewahrt daher die textliche Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung ist natürlich und macht den Rückbezug von »darauf« eindeutig; zugleich bleiben Bedingung, Kontrast und die knappe Unbestimmtheit des griechischen Textes erhalten.
