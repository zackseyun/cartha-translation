source:
  edition: SBLGNT
  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: de
  text: Denn die Schöpfung wartet sehnsüchtig darauf, dass die Söhne Gottes[a] offenbar werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Kinder Gottes“. Im Griechischen steht „Söhne“; der Ausdruck kann zugleich die Stellung als Söhne und die Erbberechtigung betonen.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorhergehenden Gedanken.
- source_word: ἀποκαραδοκία
  choice: sehnsüchtig
  rationale: Das Substantiv bezeichnet eine intensive, vorwärtsgerichtete Erwartung. Die adverbiale Wiedergabe mit „wartet“ klingt im Deutschen natürlich und erhält die Nachdrücklichkeit.
- source_word: κτίσεως
  choice: die Schöpfung
  rationale: Der Genitiv bezeichnet hier die Schöpfung als die Erwartende; der kollektive Ausdruck passt zum kosmischen Zusammenhang.
- source_word: ἀποκάλυψιν
  choice: dass … offenbar werden
  rationale: Die Nebensatzkonstruktion gibt die künftige Offenbarung dessen, was jetzt noch verborgen ist, in natürlichem Deutsch wieder.
- source_word: υἱῶν
  choice: Söhne
  rationale: „Söhne“ entspricht der ausdrücklich maskulinen griechischen Form und bewahrt außerdem den möglichen Anklang an Sohnesstellung und Erbberechtigung.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird knapp und idiomatisch als Zugehörigkeits- beziehungsweise Beziehungsangabe wiedergegeben.
- source_word: ἀπεκδέχεται
  choice: wartet … darauf
  rationale: Die Wendung drückt das gespannte Warten auf ein zukünftiges Ereignis aus; dessen Intensität wird bereits durch „sehnsüchtig“ vermittelt.
theological_decisions:
- issue: Soll υἱῶν θεοῦ geschlechtsgenau als „Söhne Gottes“ oder inklusiv als „Kinder Gottes“ wiedergegeben werden?
  choice: Söhne Gottes
  alternative: Kinder Gottes
  rationale: Der griechische Text verwendet ausdrücklich „Söhne“. Diese Wiedergabe erhält zudem die mögliche paulinische Bedeutung von Sohnesstellung und Erbschaft, ohne auszuschließen, dass Frauen mitgemeint sind.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die abstrakte griechische Konstruktion („die sehnsüchtige Erwartung der Schöpfung“) wird für einen natürlichen deutschen Satz verbal wiedergegeben, ohne die Intensität oder Zukunftsausrichtung abzuschwächen.
