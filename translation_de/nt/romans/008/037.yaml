  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: de
  text: Doch in all dem erringen wir einen überwältigenden Sieg durch den, der uns geliebt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im unmittelbaren Zusammenhang wahrscheinlich Christus.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zu den zuvor genannten Bedrängnissen und ist im Deutschen natürlich und würdevoll.
- source_word: ἐν τούτοις πᾶσιν
  choice: in all dem
  rationale: Gibt die Präpositionalphrase eng wieder und verweist auf sämtliche in Vers 35 genannten Bedrängnisse.
- source_word: ὑπερνικῶμεν
  choice: erringen wir einen überwältigenden Sieg
  rationale: Bewahrt die verbale Aussage und bringt zugleich die durch ὑπέρ- verstärkte, weit überlegene Überwindung idiomatisch zum Ausdruck.
- source_word: διὰ
  choice: durch
  rationale: Gibt διά mit Genitiv als Vermittlung beziehungsweise wirksames Mittel wieder.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: den, der uns geliebt hat
  rationale: Gibt das substantivierte Aoristpartizip persönlich wieder, ohne den im Griechischen nicht ausdrücklich genannten Bezug in den Haupttext einzufügen.
theological_decisions:
- issue: Identität dessen, »der uns geliebt hat«
  choice: Im Haupttext bleibt die Person unbenannt.
  alternative: Die Person ausdrücklich als Christus bezeichnen.
  rationale: Der unmittelbare Zusammenhang legt Christus nahe, doch der griechische Wortlaut nennt hier keinen Namen. Die Übersetzung wahrt diese Formulierung; eine Fußnote erläutert den wahrscheinlichen Bezug.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Einen überwältigenden Sieg erringen« vermeidet das im Deutschen schwerfällige »mehr als Sieger sein« und erhält die intensive verbale Aussage.
