  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: de
  text: Was sollen wir nun dazu sagen?[a] Wenn Gott für uns ist,[b] wer ist dann gegen uns?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Was sollen wir nun zu diesen Dingen sagen?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Da Gott für uns ist, wer ist dann gegen uns?“'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Was sollen wir nun … sagen?
  rationale: Die deliberativ-rhetorische Frage wird in natürlichem, modernem Deutsch wiedergegeben; „nun“ bewahrt die folgernde beziehungsweise überleitende Kraft von οὖν.
- source_word: πρὸς ταῦτα
  choice: dazu
  rationale: „Dazu“ bezeichnet knapp und idiomatisch die zuvor dargelegten Sachverhalte; die wörtlichere Wiedergabe „zu diesen Dingen“ wäre im Deutschen weniger natürlich.
- source_word: εἰ
  choice: Wenn
  rationale: „Wenn“ erhält die griechische Konditionalform und die rhetorische Spannung, ohne Zweifel an Gottes Zuwendung auszudrücken.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und im Deutschen idiomatische Wiedergabe des Subjekts.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Die Wendung drückt hier Gottes günstige Stellung und sein Eintreten für die Angesprochenen aus; „für uns“ ist prägnant und natürlich.
- source_word: τίς καθ’ ἡμῶν
  choice: wer kann dann gegen uns sein?
  rationale: „Gegen uns“ gibt die durch κατά mit Genitiv bezeichnete Gegnerschaft wieder. Das im Deutschen ergänzte „kann dann … sein“ macht die elliptische rhetorische Frage idiomatisch verständlich, ohne zu behaupten, es gebe keinerlei Gegner.
theological_decisions:
- issue: Konditionale Aussage εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: „Wenn Gott für uns ist“ im Haupttext
  alternative: „Da Gott für uns ist“ beziehungsweise „Weil Gott für uns ist“
  rationale: Das griechische εἰ wird formal als „wenn“ bewahrt. Der Kontext und die rhetorische Frage zeigen, dass Paulus Gottes Eintreten nicht bezweifelt; die Alternative macht diese vorausgesetzte Gewissheit ausdrücklich.
- issue: Sinn der elliptischen Frage τίς καθ’ ἡμῶν
  choice: „wer kann dann gegen uns sein?“
  alternative: „wer ist gegen uns?“
  rationale: 'Die Ergänzung „kann … sein“ bringt den triumphierenden Sinn der rhetorischen Frage im Deutschen zur Geltung: Gegner können vorhanden sein, aber angesichts Gottes nicht entscheidend gegen die Glaubenden bestehen.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Klang. Die beiden Fragen bleiben erhalten; die griechische Konditionalform wird im Haupttext nicht theologisch geglättet.
