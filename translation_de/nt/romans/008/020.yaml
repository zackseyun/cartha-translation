revisions:
- from: Denn die Schöpfung wurde der Vergänglichkeit[a] unterworfen, nicht freiwillig, sondern wegen dessen, der sie unterworfen hat[b] – auf Hoffnung hin.[c]
  to: Denn die Schöpfung wurde der Nichtigkeit[a] unterworfen, nicht freiwillig, sondern wegen dessen, der sie unterworfen hat[b] – in Hoffnung.[c]
  rationale: Die Revision ersetzt die semantisch zu stark auf Verfall bezogene Wiedergabe „Vergänglichkeit“ durch „Nichtigkeit“, die ματαιότης im paulinischen Kontext genauer abbildet. Der Hoffnungsausdruck wird idiomatisch geglättet, ohne seine syntaktische und theologische Offenheit aufzulösen. Die Fußnoten bleiben an ihren jeweiligen Bezugsstellen verankert und benennen die relevanten Alternativen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:46:41Z'
review_pass:
  verdict: revise
  source_fidelity: „Vergänglichkeit“ trifft in diesem Kontext eher die in Römer 8,21 genannte φθορά (Verderben/Verfall) als ματαιότης. Für ματαιότης ist „Nichtigkeit“ bzw. „Vergeblichkeit“ quellentreuer. Die passive Unterwerfung, die unbestimmte Person des Unterwerfenden und der Hoffnungsbezug bleiben gewahrt.
  naturalness: „Auf Hoffnung hin“ ist im modernen Standarddeutsch ungebräuchlich und klingt unnötig technisch. „In Hoffnung“ ist knapp, verständlich und für den offen weiterlaufenden Gedankengang zu Vers 21 geeignet.
  terminology: „Schöpfung“ und „unterworfen“ sind passend. „Nichtigkeit“ unterscheidet die hier gemeinte Vergeblichkeit der Schöpfung klarer von Vergänglichkeit/Verfall. „Wegen dessen, der sie unterworfen hat“ gibt den kausalen Sinn von διά mit Akkusativ wieder, ohne die Person zu identifizieren.
  issues:
  - severity: medium
    issue: „Vergänglichkeit“ für ματαιότης
    rationale: Der Ausdruck bezeichnet primär Nichtigkeit, Vergeblichkeit bzw. frustrierte Zwecklosigkeit. Der Aspekt des Verfalls wird im unmittelbaren Kontext mit φθορά ausgedrückt; „Vergänglichkeit“ verwischt diese Unterscheidung.
  - severity: low
    issue: „auf Hoffnung hin“
    rationale: Die Formulierung ist im modernen Deutsch unidiomatisch und legt einen finalen Sinn stärker nahe. „In Hoffnung“ bewahrt die knappe griechische Wendung und bleibt offen.
  - severity: low
    issue: Formulierung der Fußnote b
    rationale: 'Die bestehende Fußnote ist verständlich, aber syntaktisch glatter und präziser ist: „Wer mit … gemeint ist, wird … nicht ausdrücklich gesagt.“'
