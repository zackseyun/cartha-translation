  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: de
  text: Denn die Schöpfung wurde der Nichtigkeit[a] unterworfen, nicht freiwillig, sondern wegen dessen, der sie unterworfen hat[b] – in Hoffnung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vergeblichkeit“, „Sinnlosigkeit“ oder „Vergänglichkeit“.'
    reason: lexical_alternative
  - marker: b
    text: Wer mit „dem, der sie unterworfen hat“ gemeint ist, wird im griechischen Text nicht ausdrücklich gesagt.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „mit Hoffnung“; auch: „auf Hoffnung hin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: Vergänglichkeit
  rationale: Der Ausdruck bezeichnet hier den Zustand, in dem die Schöpfung ihr Ziel nicht erreicht und dem Verfall ausgeliefert ist. „Vergänglichkeit“ ist im Zusammenhang von Römer 8 natürlich und würdevoll; mögliche Bedeutungsnuancen werden in der Fußnote offengehalten.
- source_word: κτίσις
  choice: Schöpfung
  rationale: Im Zusammenhang von Römer 8,19–22 ist die geschaffene Welt als Ganzes gemeint, nicht ein einzelnes Geschöpf.
- source_word: ὑπετάγη
  choice: wurde … unterworfen
  rationale: Das Passiv bewahrt, dass die Schöpfung diese Unterordnung erfuhr und sie nicht selbst herbeiführte.
- source_word: οὐχ ἑκοῦσα
  choice: nicht freiwillig
  rationale: Die knappe Formulierung gibt den Gegensatz zwischen dem fehlenden eigenen Willen der Schöpfung und dem Handeln des Unterwerfenden klar wieder.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: wegen dessen, der sie unterworfen hat
  rationale: διά mit Akkusativ wird kausal verstanden. Die Formulierung lässt die Identität des Handelnden entsprechend dem griechischen Text offen.
- source_word: ἐφ’ ἑλπίδι
  choice: auf Hoffnung hin
  rationale: Die Wendung bewahrt die knappe, zielgerichtete Aussage des Griechischen und verbindet die Unterwerfung mit einer Hoffnungsperspektive, ohne diese weiter auszudeuten.
theological_decisions:
- issue: Identität dessen, der die Schöpfung unterworfen hat
  choice: 'Im Haupttext bleibt die Person unbestimmt: „dessen, der sie unterworfen hat“.'
  alternative: Gemeint sein kann Gott, der die Schöpfung dem Gericht unterwarf; teils wird die Unterwerfung mittelbar mit Adams Fall verbunden, seltener mit Satan.
  rationale: Der griechische Vers nennt den Handelnden nicht ausdrücklich. Die Übersetzung wahrt diese Zurückhaltung und löst die theologische Spannung nicht im Haupttext auf.
- issue: Bezug von ἐφ’ ἑλπίδι
  choice: „auf Hoffnung hin“ wird an die Unterwerfungsaussage angeschlossen.
  alternative: Die Wendung kann auch als „in Hoffnung“ oder „mit Hoffnung“ wiedergegeben und unterschiedlich eng mit dem Vorhergehenden verbunden werden.
  rationale: Die gewählte Fassung erhält sowohl den Hoffnungsaspekt als auch die syntaktische Dichte des Ausgangstextes.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Satzstruktur bleibt nahe am griechischen Gedankengang; der Gedankenstrich macht den abschließenden Hoffnungsbezug lesbar, ohne ihn interpretierend aufzulösen.
