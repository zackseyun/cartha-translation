id: ROM.8.39
reference: Romans 8:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: de
  text: weder Höhe noch Tiefe noch irgendetwas anderes Geschaffenes[a] wird uns von der Liebe Gottes[c] trennen können, die im Messias Jesus[b], unserem Herrn, ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sonst irgendetwas in der Schöpfung“ oder „irgendein anderes Geschöpf“.'
    reason: lexical_alternative
  - marker: b
    text: „Messias Jesus“ wird traditionell mit „Christus Jesus“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: Mit „Liebe Gottes“ ist hier sehr wahrscheinlich Gottes Liebe zu uns gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: Höhe
  rationale: Im Gegensatzpaar mit βάθος ist die räumliche Bedeutung am natürlichsten; „Höhe“ bewahrt die knappe rhetorische Form.
- source_word: βάθος
  choice: Tiefe
  rationale: Zusammen mit ὕψωμα bezeichnet das Wort den entgegengesetzten räumlichen Extrembereich; „Tiefe“ ist direkt und idiomatisch.
- source_word: κτίσις ἑτέρα
  choice: irgendetwas anderes Geschaffenes
  rationale: κτίσις kann „Schöpfung“ oder „Geschöpf“ bedeuten. Die substantivierte Formulierung erfasst hier umfassend alles sonstige Erschaffene, während „anderes“ ἑτέρα und „irgendetwas“ die unbestimmte Kraft von τις wiedergibt.
- source_word: δυνήσεται
  choice: wird … können
  rationale: Die Formulierung gibt sowohl den Zukunftsbezug als auch die Fähigkeit beziehungsweise Macht wieder.
- source_word: χωρίσαι
  choice: trennen
  rationale: „Trennen“ ist im Kontext die natürliche Wiedergabe für das Absondern oder Abschneiden von Gottes Liebe.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: Liebe Gottes
  rationale: Die Genitivkonstruktion bleibt formal erhalten und klingt im Deutschen natürlich; der Kontext legt Gottes Liebe zu uns nahe.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird als Titel mit „Messias“ wiedergegeben; ἐν bleibt durch „in/im“ sichtbar.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ ist die sachgerechte und etablierte Wiedergabe von κύριος in dieser christologischen Aussage.
theological_decisions:
- issue: Bedeutung des Genitivs in „Liebe Gottes“
  choice: Die Hauptformulierung bewahrt den Genitiv; kontextuell ist vor allem Gottes Liebe zu uns gemeint.
  alternative: unsere Liebe zu Gott oder eine bewusst beide Richtungen umfassende Aussage
  rationale: Römer 8,31–39 betont Gottes Handeln für sein Volk und die Unmöglichkeit, die Glaubenden von seiner Liebe abzuschneiden. Dennoch wird die grammatische Form nicht durch eine eindeutige Paraphrase ersetzt.
- issue: Bezug und Sinn von „die im Messias Jesus … ist“
  choice: Die Relativkonstruktion bezieht sich auf Gottes Liebe und bewahrt die Aussage, dass sie im Messias Jesus ist.
  alternative: eine erklärende Wiedergabe wie „die uns im Messias Jesus begegnet“ oder „die sich im Messias Jesus zeigt“
  rationale: Der griechische Text erläutert nicht näher, in welchem Sinn die Liebe „in“ Christus ist. Die Übersetzung bewahrt diese theologisch dichte Formulierung, statt sie auf Offenbarung, Vermittlung oder Erfahrung festzulegen.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Die Satzstellung bewahrt die anaphorische Reihe „weder … noch … noch“ und setzt mit „wird … trennen können“ den Zukunfts- und Fähigkeitsaspekt des griechischen Verbs um. Der ungewöhnlichere Ausdruck „Messias Jesus“ folgt der Entscheidung, Χριστός als Titel zu übersetzen; die traditionelle Form wird in der Fußnote genannt.
