  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: de
  text: Denn alle, die vom Geist Gottes geleitet werden, sind Söhne Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kinder Gottes«. »Söhne« entspricht dem griechischen Wortlaut und bewahrt im Zusammenhang die Bedeutung der Annahme als Söhne und der Erbschaft.'
    reason: lexikalische Alternative und inklusive Reichweite
lexical_decisions:
- source_word: ὅσοι
  choice: alle, die
  rationale: Gibt die umfassende Bedeutung der pluralischen Korrelativkonstruktion idiomatisch wieder.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorherigen Gedankengang.
- source_word: πνεύματι θεοῦ
  choice: vom Geist Gottes
  rationale: Gibt den instrumentalen Dativ bei ἄγονται natürlich wieder und bewahrt die paulinische Wendung »Geist Gottes«.
- source_word: ἄγονται
  choice: geleitet werden
  rationale: Bewahrt Passiv und fortdauernden Sinn des Präsens; im Deutschen klingt dies im Kontext natürlicher als eine rein räumliche Wiedergabe mit »geführt«.
- source_word: οὗτοι
  choice: sind
  rationale: Die deutsche Korrelativkonstruktion »alle, die …, sind …« bezeichnet dieselbe Gruppe eindeutig; ein zusätzliches »diese« wäre unnatürlich.
- source_word: υἱοί
  choice: Söhne
  rationale: Entspricht dem ausdrücklich maskulinen Plural und erhält im Kontext von Annahme und Erbe die Sohnschaftsnuance.
- source_word: θεοῦ
  choice: Gottes
  rationale: Direkte und natürliche Wiedergabe des Genitivs; die Wiederholung bleibt in beiden Wendungen erhalten.
theological_decisions:
- issue: Wiedergabe von υἱοί θεοῦ als »Söhne Gottes« oder inklusiver als »Kinder Gottes«
  choice: Söhne Gottes
  alternative: Kinder Gottes; Söhne und Töchter Gottes
  rationale: »Söhne« bewahrt den Wortlaut und die im Zusammenhang wichtige Annahme- und Erbnuance. Zugleich kann der Ausdruck im Kontext alle vom Geist Geleiteten einschließen; diese echte sprachliche Spannung wird in der Fußnote offengelegt statt im Haupttext eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Geleitet werden« ist verständlich und wahrt das passive Handeln des Geistes. Die Satzstellung ist idiomatisch; der griechische demonstrative Nachdruck wird nicht mit einem schwerfälligen »diese« nachgebildet.
