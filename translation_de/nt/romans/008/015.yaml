  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: de
  text: 'Denn ihr habt nicht einen Geist der Sklaverei empfangen, der wieder zur Furcht führt, sondern ihr habt den Geist der Annahme zu Söhnen empfangen, in dem wir rufen: »Abba! Vater!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Annahme zu Söhnen« bezeichnet die rechtliche Einsetzung in den Status von Söhnen und Erben; Frauen sind dabei mitgemeint. Für »in dem« ist auch die Übersetzung »durch den« möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: einen Geist der Sklaverei
  rationale: Bewahrt das Bild tatsächlicher Unfreiheit und den parallelen Gegensatz zum Geist der Annahme; die Kleinschreibung bzw. Großschreibung von »Geist« ist im Deutschen grammatisch nicht unterscheidungskräftig.
- source_word: πάλιν εἰς φόβον
  choice: der euch wieder in Angst führt
  rationale: Gibt πάλιν und die Zielrichtung von εἰς natürlich wieder. Das ergänzte Relativgefüge macht den knappen griechischen Ausdruck im Deutschen verständlich.
- source_word: πνεῦμα υἱοθεσίας
  choice: den Geist der Annahme als Söhne
  rationale: Der Kontext in Römer 8 legt den Heiligen Geist nahe; zugleich hält »Geist der Annahme« die Formulierung des Ausgangstextes fest. »Annahme als Söhne« bewahrt den rechtlichen Status- und Erbgedanken von υἱοθεσία.
- source_word: ἐν ᾧ
  choice: in dem
  rationale: Entspricht formal der griechischen Präposition und dem Relativpronomen, ohne den möglichen instrumentalen Sinn auf »durch den« festzulegen.
- source_word: κράζομεν
  choice: wir rufen
  rationale: Gibt den nachdrücklichen, hörbaren Ruf in natürlichem modernem Deutsch wieder.
- source_word: Αββα ὁ πατήρ
  choice: Abba! Vater!
  rationale: Transliteriert die aramäische Anrede und übersetzt die griechische Apposition; die Ausrufezeichen lassen den eindringlichen Charakter des Rufes erkennen.
theological_decisions:
- issue: Bezeichnet πνεῦμα υἱοθεσίας ausdrücklich den Heiligen Geist oder eine innere Haltung?
  choice: »den Geist der Annahme als Söhne«
  alternative: »einen Geist der Annahme als Söhne«
  rationale: Der unmittelbare Zusammenhang von Römer 8 spricht stark für den Heiligen Geist, während die sprachliche Parallelität zu »Geist der Sklaverei« eine gewisse Spannung bestehen lässt. Der bestimmte Artikel im Deutschen ergibt eine natürliche kontextuelle Wiedergabe, ohne »Heiliger« hinzuzufügen.
- issue: Reichweite und geschlechtliche Form von υἱοθεσία
  choice: »Annahme als Söhne«
  alternative: »Annahme als Kinder« oder »Kindschaft«
  rationale: Die männliche Form gehört zum antiken Rechts- und Erbstatus, der hier auch Frauen einschließt. Die Übersetzung bewahrt diesen Sachbezug, ohne die angesprochenen Personen auf Männer zu beschränken.
- issue: Bedeutung von ἐν ᾧ
  choice: »in dem«
  alternative: »durch den«
  rationale: Die formal offene Wiedergabe bewahrt sowohl die Sphäre bzw. Gemeinschaft des Geistes als auch einen möglichen instrumentalen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sklaverei« wahrt die Schärfe des Bildes; »Annahme als Söhne« ist bewusst erklärungsbedürftiger als »Kindschaft«, bewahrt aber den rechtlichen und erbbezogenen Sinn des griechischen Ausdrucks.
