lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Daraus folgt nun
  rationale: Die Verbindung beider Folgerungspartikeln zieht einen Schluss aus dem vorangehenden Gedankengang; die Wiedergabe erhält sowohl den folgernden als auch den überleitenden Charakter.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die grammatisch maskuline Anrede bezeichnet hier die gesamte glaubende Gemeinschaft. Im heutigen Deutschen gibt die inklusive Form den gemeinten Adressatenkreis natürlich und eindeutig wieder; die wörtliche Form wird in der Fußnote genannt.
- source_word: ὀφειλέται ἐσμέν
  choice: Wir sind Schuldner
  rationale: Die Formulierung bewahrt das Schuldnerbild des griechischen Substantivs, das hier eine Verpflichtung und keine finanzielle Schuld bezeichnet.
- source_word: τῇ σαρκί / κατὰ σάρκα
  choice: dem Fleisch / nach dem Fleisch
  rationale: „Fleisch“ erhält Paulus’ wiederkehrenden theologischen Leitbegriff und dessen Spannung zum Geist, ohne ihn vorschnell als bloße Körperlichkeit oder vollständig als „sündige Natur“ aufzulösen.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: sodass wir nach dem Fleisch leben müssten
  rationale: Der substantivierte Infinitiv beschreibt die daraus folgende Verpflichtung zum Leben nach dem Maßstab des Fleisches. „Müssten“ macht den durch ὀφειλέται bestimmten Verpflichtungssinn im Deutschen klar.
theological_decisions:
- issue: Deutung von σάρξ im paulinischen Gegensatz zwischen Fleisch und Geist
  choice: Fleisch
  alternative: sündige menschliche Natur
  rationale: Der Haupttext bewahrt Paulus’ Begriff und seine theologische Mehrschichtigkeit. Die Alternative erklärt den metaphorischen Bezug, kann aber die Bedeutung stärker festlegen, als der griechische Ausdruck selbst es tut.
- issue: Inklusiver Umfang der Anrede ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Paulus richtet sich an die ganze Gemeinde. Die inklusive deutsche Anrede gibt diesen kommunikativen Umfang wieder, während die Fußnote die grammatische Form des Originals transparent macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert Schlussfolgerung und Aussage; der Gedankenstrich hebt die ausdrücklich verneinte Verpflichtung hervor. „Schuldner“ und „Fleisch“ bewahren die prägenden Metaphern des Ausgangstextes, während „müssten“ den syntaktischen Verpflichtungsbezug natürlich verdeutlicht.
