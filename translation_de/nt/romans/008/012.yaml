  naturalness: „So sind wir nun, Brüder und Schwestern, ...“ ist als paulinische Folgerungsformel im modernen Standarddeutsch idiomatischer und weniger paraphrasierend als „Daraus folgt nun“. Die Konstruktion „nicht dem Fleisch verpflichtet, nach dem Fleisch zu leben“ ist klar und natürlich. Das im Entwurf ergänzte „aber“ ist nicht erforderlich.
