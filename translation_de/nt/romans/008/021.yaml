id: ROM.8.21
reference: Romans 8:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: de
  text: Denn auch die Schöpfung selbst wird aus der Sklaverei der Vergänglichkeit in die Freiheit der Herrlichkeit der Kinder Gottes befreit werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die herrliche Freiheit der Kinder Gottes“.'
    reason: Die Alternative gibt τῆς δόξης adjektivisch wieder, während der Haupttext die mehrdeutige Genitivkette des Griechischen beibehält.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι wird hier kausal verstanden und begründet die im vorherigen Zusammenhang genannte Hoffnung. „Denn“ verbindet den Vers natürlich mit dem vorausgehenden Satz.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: auch die Schöpfung selbst
  rationale: „Auch“ bewahrt die additive Kraft von καί; „selbst“ gibt die Betonung durch αὐτή wieder. κτίσις bezeichnet hier die Schöpfung als Ganzes.
- source_word: ἐλευθερωθήσεται
  choice: wird … befreit werden
  rationale: Das Futur Passiv bezeichnet eine künftige Befreiung, die an der Schöpfung vollzogen wird. Die passive Form bleibt ausdrücklich erhalten.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: aus der Sklaverei der Vergänglichkeit
  rationale: „Sklaverei“ wahrt die Stärke des Bildes von δουλεία. φθορά bezeichnet im Kontext den Verfall und die dem Geschaffenen eigene Vergänglichkeit; der Genitiv wird nicht vorschnell als bloße Ziel- oder Abhängigkeitsbeziehung aufgelöst.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: hinein in die Freiheit
  rationale: Die Formulierung macht den von εἰς bezeichneten Übergang aus einem Zustand in einen anderen deutlich.
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: der Herrlichkeit der Kinder Gottes
  rationale: Die Genitivkette wird formal bewahrt, damit offenbleibt, wie genau Freiheit, Herrlichkeit und die Kinder Gottes aufeinander bezogen sind.
theological_decisions:
- issue: Deutung der Genitivkette τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: die Freiheit der Herrlichkeit der Kinder Gottes
  alternative: die herrliche Freiheit der Kinder Gottes
  rationale: Die gewählte Fassung folgt der griechischen Genitivstruktur und bewahrt ihre theologische Spannung. Die idiomatischere Alternative versteht „Herrlichkeit“ als nähere Charakterisierung der Freiheit, legt die Beziehung jedoch stärker aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich entlastet den langen Satz und hebt den Übergang von der Sklaverei in die Freiheit hervor, ohne die Satzbeziehung zu verändern.
