    rationale: „wird aus ... befreit werden – hinein in ...“ ist zwar verständlich, aber stilistisch holprig. Die griechische Gegenüberstellung von ἀπό und εἰς lässt sich im Deutschen direkt mit „aus ... in ...“ anschließen.
  - severity: low
    issue: Formulierung der Fußnote
    rationale: Die Fassung „herrliche Freiheit“ ist eine mögliche interpretierende Wiedergabe der Genitivkette, nicht lediglich eine sinngemäße Umschreibung. Eine neutralere Kennzeichnung wahrt die Offenheit besser.
