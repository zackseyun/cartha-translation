  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: de
  text: Der aber die Herzen erforscht, weiß, was der Sinn des Geistes ist; denn der Geist tritt für die Heiligen Gott gemäß[a] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Gottes Willen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: erforscht
  rationale: „Erforscht“ gibt den aktiven, prüfenden Sinn des Partizips wieder und ist in der Verbindung mit „Herzen“ natürlich und würdig.
- source_word: καρδίας
  choice: Herzen
  rationale: „Herzen“ bewahrt die biblische Metapher für das innere Wesen des Menschen, ohne sie erklärend aufzulösen.
- source_word: τί τὸ φρόνημα
  choice: was das Sinnen … ist
  rationale: „Sinnen“ bezeichnet die innere Ausrichtung bzw. das Trachten und wahrt im Deutschen den Zusammenhang mit φρόνημα in Römer 8 besser als das rein intellektuelle „Denken“.
- source_word: τοῦ πνεύματος
  choice: des Geistes
  rationale: Der unmittelbare Kontext spricht vom Heiligen Geist; die Großschreibung macht diesen Bezug im Deutschen deutlich.
- source_word: ἐντυγχάνει
  choice: tritt … ein
  rationale: „Für jemanden eintreten“ gibt hier den Sinn des Fürbittens bzw. vermittelnden Eintretens natürlich wieder und knüpft an die Tätigkeit des Geistes im vorhergehenden Vers an.
- source_word: ὑπὲρ ἁγίων
  choice: für die Heiligen
  rationale: Dies ist eine knappe, natürliche Wiedergabe von ὑπέρ mit Genitiv und bewahrt Paulus’ feste Bezeichnung für die zu Gott Gehörenden.
- source_word: κατὰ θεὸν
  choice: wie es Gott entspricht
  rationale: Die Formulierung bewahrt die knappe Beziehung auf Gott, ohne das im Griechischen nicht ausdrücklich vorhandene Wort „Willen“ in den Haupttext einzufügen.
theological_decisions:
- issue: Ob κατὰ θεὸν ausdrücklich als Übereinstimmung mit Gottes Willen wiederzugeben ist
  choice: wie es Gott entspricht
  alternative: nach Gottes Willen
  rationale: Gemeint ist wahrscheinlich ein Eintreten in Übereinstimmung mit Gottes Willen; da „Wille“ jedoch nicht ausdrücklich im griechischen Text steht, bleibt diese Deutung in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem Gedankengang des griechischen Textes, bleibt aber gut lesbar. „Sinnen“ ist bewusst bibelsprachlich geprägt, jedoch noch allgemein verständlich; es bewahrt die Bedeutung von innerer Ausrichtung und Trachten.
