revisions:
- from: Der aber die Herzen erforscht, weiß, was das Sinnen des Geistes ist; denn er tritt für die Heiligen ein, wie es Gott entspricht.[a]
  to: Der aber die Herzen erforscht, weiß, was der Sinn des Geistes ist; denn der Geist tritt für die Heiligen Gott gemäß[a] ein.
  rationale: Die Revision ersetzt das ungebräuchlichere „Sinnen“ durch „Sinn“, verdeutlicht den im Kontext impliziten Handlungsträger des Fürbittens und gibt κατὰ θεόν mit der knappen, theologisch nicht weiter ausdeutenden Formel „Gott gemäß“ wieder. Die Fußnote bewahrt die mögliche explizierende Deutung als Gottes Willen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:46:45Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die zentralen Begriffe grundsätzlich zutreffend wieder. „Wie es Gott entspricht“ ist für κατὰ θεόν jedoch weniger unmittelbar als „Gott gemäß“. Zudem kann sich das deutsche „er“ nach der Konstruktion auf denjenigen beziehen, der die Herzen erforscht, während ἐντυγχάνει im Kontext den Geist als Handelnden bezeichnet.
  naturalness: „Was das Sinnen des Geistes ist“ wirkt im heutigen Standarddeutsch ungewohnt und kann eher den Vorgang des Nachdenkens als dessen innere Ausrichtung bezeichnen. „Was der Sinn des Geistes ist“ ist idiomatischer und wahrt die knappe griechische Formulierung. Die explizite Wiederaufnahme „der Geist“ verhindert eine missverständliche Pronomenreferenz.
  terminology: „Herzen“, „Geist“, „Heilige“ und „für ... eintreten“ sind angemessen und konsistent. „Gott gemäß“ bewahrt bei κατὰ θεόν die offene, knappe Beziehung auf Gott; die Fußnote kann die naheliegende Auslegung mit Gottes Willen nennen.
  issues:
  - severity: medium
    issue: „Sinnen“ ist hier semantisch und stilistisch weniger passend.
    rationale: Als Substantiv bezeichnet „Sinnen“ im modernen Deutsch vor allem ein Nachdenken bzw. Grüten, nicht ohne Weiteres das φρόνημα, also die Ausrichtung bzw. den Sinn des Geistes.
  - severity: medium
    issue: Das Pronomen „er“ kann im Deutschen auf den Herzenerforscher bezogen werden.
    rationale: Der griechische Kontext identifiziert den Handelnden des Eintretens als den Geist. Die ausdrückliche Nennung verhindert, dass Gott als der Fürbittende gelesen wird.
  - severity: low
    issue: „Wie es Gott entspricht“ ist eine freiere Umschreibung von κατὰ θεόν.
    rationale: „Gott gemäß“ ist knapper, näher an der griechischen Präpositionalformel und lässt die in der Fußnote genannte Deutung auf Gottes Willen offen.
  revised_text: Der aber die Herzen erforscht, weiß, was der Sinn des Geistes ist; denn der Geist tritt für die Heiligen Gott gemäß[a] ein.
  revised_footnotes:
  - marker: a
    text: 'Oder: „nach Gottes Willen“.'
    reason: lexical_alternative
  revision_rationale: Die Revision ersetzt das ungebräuchlichere „Sinnen“ durch „Sinn“, verdeutlicht den im Kontext impliziten Handlungsträger des Fürbittens und gibt κατὰ θεόν mit der knappen, theologisch nicht weiter ausdeutenden Formel „Gott gemäß“ wieder. Die Fußnote bewahrt die mögliche explizierende Deutung als Gottes Willen.
