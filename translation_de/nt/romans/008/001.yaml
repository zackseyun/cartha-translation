id: ROM.8.1
reference: Romans 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: de
  text: Also gibt es jetzt keine Verurteilung für die, die im Messias[b] Jesus sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige spätere Handschriften fügen hinzu: „die nicht nach dem Fleisch leben“. Die frühesten griechischen Textzeugen stützen hier die kürzere Lesart.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: keine
  rationale: Zusammen mit κατάκριμα ergibt die feminine Negation die natürliche und nachdrückliche Formulierung „keine Verurteilung“.
- source_word: ἄρα
  choice: Also
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Argumentation; „also“ gibt diese Schlussfolgerung im modernen Deutsch klar wieder.
- source_word: νῦν
  choice: jetzt
  rationale: Das Zeitadverb wird ausdrücklich beibehalten, weil Paulus eine nun bestehende Wirklichkeit bezeichnet.
- source_word: κατάκριμα
  choice: Verurteilung
  rationale: Gibt den gerichtlichen Sinn eines verurteilenden Urteils wieder und vermeidet eine Verengung auf ein bloß subjektives Schuldgefühl.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: für die, die im Messias Jesus sind
  rationale: Die Dativkonstruktion wird idiomatisch mit „für“ wiedergegeben; zugleich bleibt das paulinische „im … sein“ erhalten, ohne es erklärend aufzulösen.
- source_word: Χριστῷ
  choice: Messias
  rationale: Gibt den griechischen Titel Χριστός mit seiner inhaltlichen Bedeutung wieder; „im“ ist die reguläre Zusammenziehung von „in dem“.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Übliche deutsche Form des Eigennamens Ἰησοῦς.
theological_decisions:
- issue: Bedeutung der Wendung „im Messias Jesus“
  choice: Die Wendung bleibt als Zugehörigkeits- und Teilhabeformulierung „im Messias Jesus“ stehen.
  alternative: Eine erklärende Wiedergabe wie „durch den Messias Jesus“ oder „weil sie dem Messias Jesus gehören“.
  rationale: Das paulinische ἐν bezeichnet hier mehr als eine bloße Ursache. Die wörtlich-natürliche Wiedergabe bewahrt die theologische Weite und Spannung von Zugehörigkeit, Gemeinschaft und Eingliederung, ohne sie auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, vermeidet aber unnötige Wörtlichkeit. „Messias Jesus“ bewahrt den Titelcharakter von Χριστός; die geläufige Alternative „Christus“ wird in einer Fußnote genannt.
