id: ROM.8.23
reference: Romans 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: de
  text: Doch nicht nur sie, sondern auch wir selbst, die wir die Erstlingsgabe des Geistes[a] haben, seufzen in uns selbst und warten sehnsüchtig auf die Annahme als Söhne[b] – die Erlösung unseres Leibes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „den Geist als Erstlingsgabe“.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „die Annahme an Kindes statt“. Der griechische Ausdruck bezeichnet die Annahme in die Stellung eines Sohnes; gemeint sind alle Glaubenden.'
    reason: lexical_alternative
  - marker: c
    text: Der griechische Text hat den Singular „unseres Leibes“, der kollektiv oder auf den Leib jedes Einzelnen bezogen verstanden werden kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: Aber nicht nur sie, sondern
  rationale: Der ergänzte Rückverweis „sie“ nimmt im Zusammenhang die Schöpfung auf und gibt die fortführende Gegenüberstellung im Deutschen natürlich wieder.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: auch wir selbst
  rationale: Bewahrt die starke Betonung der Glaubenden als weiterer Gruppe, ohne die im Griechischen textkritisch bedingte Wiederholung im Deutschen schwerfällig zu verdoppeln.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: die Erstlingsgabe des Geistes
  rationale: „Erstlingsgabe“ bezeichnet verständlich den ersten Anteil, der die kommende Fülle verbürgt; der Genitiv bleibt bewusst offen zwischen einer Gabe des Geistes und dem Geist selbst als Erstlingsgabe.
- source_word: ἔχοντες
  choice: die wir … haben
  rationale: Ein Relativsatz gibt das Partizip in natürlichem modernem Deutsch wieder.
- source_word: ἐν ἑαυτοῖς
  choice: in uns selbst
  rationale: Gibt den inneren Ort des Seufzens direkt wieder.
- source_word: στενάζομεν
  choice: seufzen
  rationale: Bewahrt die sprachliche Verbindung zum Seufzen der Schöpfung im Kontext.
- source_word: υἱοθεσίαν
  choice: die Annahme als Söhne
  rationale: Bewahrt sowohl den Gedanken der Annahme in die Familie als auch das im griechischen Ausdruck enthaltene Sohnschafts- und Erbmotiv; Frauen sind als Glaubende gleichermaßen eingeschlossen.
- source_word: ἀπεκδεχόμενοι
  choice: warten sehnsüchtig auf
  rationale: Drückt das intensive, erwartungsvolle Warten idiomatisch aus.
- source_word: τὴν ἀπολύτρωσιν
  choice: die Erlösung
  rationale: Bewahrt den paulinischen theologischen Begriff und seine endzeitliche Tragweite.
- source_word: τοῦ σώματος ἡμῶν
  choice: unseres Leibes
  rationale: Folgt dem griechischen Singular, der gemeinschaftlich beziehungsweise distributiv verstanden werden kann, und klingt im gehobenen modernen Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe von υἱοθεσίαν mit dem Sohnschafts- und Erbmotiv bei zugleich umfassendem Bezug auf alle Glaubenden
  choice: Annahme als Söhne
  alternative: Annahme als Kinder; Adoption
  rationale: Der griechische Ausdruck enthält ausdrücklich das Sohnschaftselement, das im damaligen rechtlichen Erbkontext bedeutsam ist. Die Fußnote stellt klar, dass Frauen nicht ausgeschlossen sind.
- issue: Deutung von τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: Erstlingsgabe des Geistes
  alternative: den Geist als Erstlingsgabe
  rationale: Die Genitivkonstruktion lässt offen, ob eine vom Geist stammende Erstlingsgabe oder der Geist selbst als Erstlingsgabe gemeint ist; die alternative Deutung wird nicht stillschweigend ausgeschlossen.
- issue: Verhältnis von gegenwärtiger Gotteskindschaft und noch erwarteter υἱοθεσία
  choice: die Annahme als Söhne … die Erlösung unseres Leibes
  alternative: die vollständige Offenbarung unserer Sohnschaft
  rationale: Die Übersetzung wahrt die Spannung zwischen bereits empfangener Zugehörigkeit und ihrer noch ausstehenden leiblichen Vollendung, ohne sie durch eine erklärende Paraphrase aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erstlingsgabe“ und „Erlösung“ bewahren die biblisch-theologische Bild- und Begriffswelt; die Satzführung bleibt trotz der paulinischen Verdichtung gut verständlich.
