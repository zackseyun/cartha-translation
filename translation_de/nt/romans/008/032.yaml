  to: Er hat ja seinen eigenen Sohn nicht verschont, sondern ihn für uns alle[a] dahingegeben[b] – wie sollte er uns mit ihm nicht auch alles schenken[c]?
  rationale: Die Revision beschränkt sich auf χαρίσεται und die zugehörige Fußnote. „Schenken“ ist die idiomatische deutsche Kernwiedergabe und lässt den Gedanken des freien Gewährens stehen, ohne ihn als festgelegte Aussage über den Grund der Gabe zu erweitern. Die übrigen Formulierungen und Fußnotenanker bleiben sachgerecht erhalten.
