  - severity: low
    issue: Fußnote c enthält „frei schenken“
    rationale: „Frei schenken“ ist im modernen Deutschen weniger idiomatisch und gegenüber „schenken“ nahezu tautologisch. „Großzügig gewähren“ bietet eine klare lexikalische Alternative.
