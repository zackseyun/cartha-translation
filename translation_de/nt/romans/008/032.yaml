id: ROM.8.32
reference: Romans 8:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: de
  text: Er hat ja seinen eigenen Sohn nicht verschont, sondern ihn für uns alle[a] dahingegeben[b] – wie sollte er uns mit ihm nicht auch alles schenken[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugunsten von uns allen“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „übergeben“ beziehungsweise „ausgeliefert“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „uns auch alles großzügig gewähren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: Er hat ja
  rationale: ὅς verweist auf Gott im vorherigen Kontext; im Deutschen ist das Pronomen natürlich. γε verstärkt die Aussage und wird idiomatisch durch „ja“ wiedergegeben.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: seinen eigenen Sohn
  rationale: „eigenen“ bewahrt die Betonung der einzigartigen persönlichen Beziehung; „Sohn“ bezeichnet hier Jesus.
- source_word: οὐκ ἐφείσατο
  choice: nicht verschont
  rationale: Die geläufige deutsche Wendung erhält sowohl den Gedanken des Nicht-Zurückhaltens als auch den ernsten Opferkontext.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: für uns alle
  rationale: Die Formulierung gibt den Nutzen beziehungsweise das Handeln zugunsten aller wieder, ohne die Präposition unnötig dogmatisch zu präzisieren.
- source_word: παρέδωκεν αὐτόν
  choice: ihn dahingegeben
  rationale: „dahingegeben“ bringt das Ausliefern an Leiden und Tod würdig und prägnant zum Ausdruck; „ausgeliefert“ bleibt als deutlichere lexikalische Alternative in der Fußnote erhalten.
- source_word: πῶς οὐχὶ καὶ
  choice: wie sollte er … nicht auch
  rationale: Die deutsche rhetorische Frage bewahrt den nachdrücklichen Schluss vom größeren Geschenk auf alle weiteren Gaben.
- source_word: σὺν αὐτῷ
  choice: mit ihm
  rationale: Direkte und natürliche Wiedergabe des Begleitverhältnisses.
- source_word: τὰ πάντα
  choice: alles
  rationale: „alles“ ist im modernen Deutsch natürlicher als „alle Dinge“ und lässt den umfassenden Ausdruck des Griechischen bestehen.
- source_word: ἡμῖν χαρίσεται
  choice: uns … aus Gnade schenken
  rationale: Die Formulierung macht den in χαρίζομαι enthaltenen Gedanken des gnädigen, unverdienten Schenkens sichtbar und bleibt idiomatisch.
theological_decisions:
- issue: Ob ὑπὲρ ἡμῶν πάντων ausdrücklich als technische Aussage über Stellvertretung wiederzugeben ist
  choice: für uns alle
  alternative: zugunsten von uns allen
  rationale: Das Griechische bezeichnet klar ein Handeln zu unserem Wohl und trägt Opferanklänge, legt hier aber keine engere dogmatische Formulierung fest.
- issue: Umfang von τὰ πάντα
  choice: alles
  alternative: alle Dinge
  rationale: Der umfassende Ausdruck bleibt ohne einschränkende Ergänzung stehen; sein sachlicher Umfang ergibt sich aus dem Kontext und wird nicht vorab dogmatisch festgelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzform erhält den emphatischen Rückblick und die rhetorische Schlussfrage. „Aus Gnade schenken“ macht den Wortklang von χαρίζομαι sichtbar, ohne eine konfessionelle Sonderdeutung einzuführen.
