id: ROM.8.34
reference: Romans 8:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: de
  text: 'Wer ist es, der verurteilt? Der Messias[a] ist es, der gestorben ist – mehr noch: der auferweckt worden ist[b], der auch zur Rechten Gottes ist[c] und auch für uns eintritt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb steht im Passiv: „der auferweckt worden ist“. Auch möglich ist die aktive Wiedergabe: „der auferstanden ist“.'
    reason: alternative_reading
  - marker: c
    text: „Zur Rechten Gottes“ ist eine biblische Wendung für den Platz höchster Ehre und Vollmacht.
    reason: cultural_note
lexical_decisions:
- source_word: κατακρινῶν
  choice: der verurteilt
  rationale: Das substantivierte Präsenspartizip wird als natürlicher deutscher Relativsatz wiedergegeben; der rhetorische Charakter der Frage bleibt erhalten.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός bezeichnet hier den messianischen Titel. „Der Messias“ macht dessen Bedeutung im Deutschen unmittelbar sichtbar; die traditionelle Alternative wird in einer Fußnote genannt.
- source_word: ἀποθανών
  choice: der gestorben ist
  rationale: Das Aoristpartizip bezeichnet das vollzogene historische Geschehen und wird idiomatisch mit einem Relativsatz im Perfekt wiedergegeben.
- source_word: μᾶλλον δὲ
  choice: mehr noch
  rationale: Die Wendung steigert die Aussage vom Tod zur Auferweckung, statt den vorherigen Gedanken zu verwerfen.
- source_word: ἐγερθείς
  choice: der auferweckt worden ist
  rationale: Die passive Form des griechischen Verbs wird bewahrt und stellt die Auferweckung als an ihm vollzogenes Handeln dar.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: zur Rechten Gottes
  rationale: Die geläufige biblische Wendung wahrt das Bild des griechischen Ausdrucks und bezeichnet eine Stellung höchster Ehre und Vollmacht.
- source_word: ἐντυγχάνει
  choice: eintritt
  rationale: „Für uns eintritt“ gibt die Fürsprache in natürlichem, verständlichem Deutsch wieder, ohne unnötige Fachsprache.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Die knappe Formulierung entspricht dem griechischen Ausdruck und vermittelt den Gedanken stellvertretender Fürsprache im Kontext.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: Christus
  rationale: Der griechische Text hat Χριστός ohne Ἰησοῦ. Deshalb wird weder „Jesus“ ergänzt noch der Titel wie ein bloßer Eigenname behandelt; „Christus“ bleibt als traditionelle Alternative vermerkt.
- issue: Genus Verbi von ἐγερθείς
  choice: der auferweckt worden ist
  alternative: der auferstanden ist
  rationale: Das Passiv des Ausgangstextes bleibt ausdrücklich erhalten, sodass die Darstellung der Auferweckung als an dem Messias vollzogenes Handeln nicht eingeebnet wird.
- issue: Bedeutung der Stellung zur Rechten Gottes
  choice: zur Rechten Gottes
  alternative: an Gottes rechter Seite
  rationale: Die traditionelle Bildsprache wird beibehalten, ohne die Aussage im Haupttext auf eine einzige abstrakte Deutung zu reduzieren; eine Fußnote erklärt ihren kulturell-biblischen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die steigernde Abfolge von Tod, Auferweckung, Erhöhung und Fürsprache bleiben erhalten. Der deutsche Satz wird durch Doppelpunkt und Gedankenstrich gegliedert, ohne zusätzliche Personenbezeichnungen in den griechischen Text einzutragen.
