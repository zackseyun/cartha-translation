id: ROM.8.18
reference: Romans 8:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: de
  text: 'Denn ich bin überzeugt: Die Leiden der gegenwärtigen Zeit fallen nicht ins Gewicht gegenüber der kommenden Herrlichkeit, die an uns offenbart werden soll.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in uns offenbart werden soll“.'
    reason: εἰς ἡμᾶς lässt sowohl eine auf uns gerichtete als auch eine in uns geschehende Offenbarung anklingen.
lexical_decisions:
- source_word: Λογίζομαι
  choice: ich bin überzeugt
  rationale: Gibt ein begründetes Urteil wieder, nicht bloß ein Gefühl; im Deutschen klingt die Wendung natürlich und bestimmt.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende Verbindung zum vorausgehenden Gedankengang.
- source_word: οὐκ ἄξια … πρὸς
  choice: fallen nicht ins Gewicht gegenüber
  rationale: Drückt die im Griechischen bezeichnete Unverhältnismäßigkeit idiomatisch aus, ohne die Leiden an sich für bedeutungslos zu erklären.
- source_word: τὰ παθήματα
  choice: die Leiden
  rationale: Die übliche und kontextgerechte Wiedergabe für erlittene Bedrängnisse.
- source_word: τοῦ νῦν καιροῦ
  choice: der gegenwärtigen Zeit
  rationale: Gibt καιρός zeitlich wieder, ohne ausdrücklich den stärker eschatologisch gefärbten Begriff „Zeitalter“ einzuführen.
- source_word: τὴν μέλλουσαν δόξαν
  choice: der kommenden Herrlichkeit
  rationale: Bewahrt sowohl den Zukunftsbezug von μέλλουσαν als auch den gewichtigen biblischen Begriff δόξα.
- source_word: ἀποκαλυφθῆναι
  choice: die … offenbart werden soll
  rationale: Bewahrt den passiven und bevorstehenden Charakter der Offenbarung in natürlichem Deutsch.
- source_word: εἰς ἡμᾶς
  choice: an uns
  rationale: „An uns“ kann die auf die Glaubenden gerichtete Offenbarung bezeichnen und bleibt für eine sichtbar an ihnen hervortretende Herrlichkeit offen; die mögliche lokale Deutung wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von εἰς ἡμᾶς bei der Offenbarung der Herrlichkeit
  choice: an uns
  alternative: in uns
  rationale: Die Präpositionalphrase kann auf die Glaubenden als Ziel beziehungsweise Schauplatz der Offenbarung weisen. „An uns“ erhält diese Breite besser als eine eindeutige Festlegung; „in uns“ wird wegen seines möglichen partizipatorischen Sinnes als Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach „überzeugt“ gliedert den langen Satz natürlich. „Fallen nicht ins Gewicht gegenüber“ vermittelt den Vergleich idiomatisch, ohne das gegenwärtige Leiden zu verharmlosen.
