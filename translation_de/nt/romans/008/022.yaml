  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: de
  text: Denn wir wissen, dass die ganze Schöpfung[a] gemeinsam seufzt und gemeinsam in Geburtswehen liegt[b] – bis jetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gesamte Schöpfung“; möglich ist auch „alles Geschaffene“. Der Zusammenhang spricht eher für den umfassenden Sinn.'
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck bezeichnet Geburtswehen. Das Bild vermittelt nicht nur Schmerz, sondern kann auch neues Leben anklingen lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Das formal perfekte οἶδα hat hier präsentische Bedeutung und bezeichnet ein gemeinsames, feststehendes Wissen.
- source_word: γὰρ
  choice: denn
  rationale: Die begründende beziehungsweise erläuternde Verbindung zum vorhergehenden Gedankengang bleibt erhalten.
- source_word: πᾶσα ἡ κτίσις
  choice: die ganze Schöpfung
  rationale: Artikel und πᾶσα legen eine kollektive Bedeutung nahe. Im Zusammenhang von Römer 8 passt der umfassende Begriff „Schöpfung“ besser als eine Verengung auf einzelne Geschöpfe.
- source_word: συστενάζει
  choice: seufzt gemeinsam
  rationale: „Gemeinsam“ gibt die durch die Vorsilbe συν- ausgedrückte Verbundenheit des Seufzens wieder.
- source_word: συνωδίνει
  choice: liegt gemeinsam in Geburtswehen
  rationale: Die Formulierung bewahrt sowohl die συν-Vorsilbe als auch das konkrete Bild schmerzhafter Geburtswehen; sie reduziert den Ausdruck nicht auf allgemeines Leiden.
- source_word: ἄχρι τοῦ νῦν
  choice: bis jetzt
  rationale: Die knappe, natürliche Wendung gibt die bis zur Gegenwart reichende Dauer wieder.
theological_decisions:
- issue: Ob κτίσις als „Schöpfung“ oder als „Geschöpf/alles Geschaffene“ wiederzugeben ist
  choice: die ganze Schöpfung
  alternative: jedes Geschöpf; alles Geschaffene
  rationale: Römer 8,19–23 personifiziert die geschaffene Ordnung in umfassender Weise. „Die ganze Schöpfung“ wahrt diesen kosmischen Umfang, ohne genauer festzulegen, welche Teile der Schöpfung ein- oder ausgeschlossen sind.
- issue: Ob συνωδίνει lediglich allgemeines Leiden oder ausdrücklich Geburtswehen bezeichnet
  choice: liegt gemeinsam in Geburtswehen
  alternative: leidet gemeinsam; erduldet gemeinsam Schmerzen
  rationale: Das Geburtsbild gehört zum Bedeutungsgehalt des griechischen Verbs. Die Übersetzung bewahrt damit die Spannung zwischen gegenwärtigem Schmerz und der im Bild mitschwingenden Aussicht auf neues Leben, ohne diese Aussicht ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von „gemeinsam“ ist bewusst beibehalten, weil beide griechischen Verben die Vorsilbe συν- tragen. Der Gedankenstrich hebt die bis in die Gegenwart reichende Dauer hervor, ohne den Satz unnötig zu verkomplizieren.
