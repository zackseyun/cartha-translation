  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: de
  text: Wir wissen aber, dass denen, die Gott lieben, alles zum Guten zusammenwirkt[a] — denen, die nach dem Vorsatz berufen sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Gott bewirkt, dass alles zum Guten zusammenwirkt.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „nach seinem Vorsatz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Wir wissen
  rationale: Das Perfekt wird als gegenwärtiger Zustand gesicherten Wissens wiedergegeben; so klingt der Satz im Deutschen natürlich und bestimmt.
- source_word: δὲ
  choice: aber
  rationale: Die milde weiterführende beziehungsweise leicht kontrastierende Funktion der Partikel wird mit dem unbetonten deutschen „aber“ bewahrt.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: denen, die Gott lieben
  rationale: Der Dativ wird unmittelbar beibehalten und die Personengruppe klar bezeichnet.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural wird idiomatisch als umfassendes „alles“ wiedergegeben.
- source_word: συνεργεῖ
  choice: zusammenwirkt
  rationale: Der Singular entspricht der griechischen Form und lässt πάντα („alles“) als Subjekt stehen, ohne „Gott“ gegen den gebotenen Haupttext ausdrücklich einzufügen.
- source_word: εἰς ἀγαθόν
  choice: zum Guten
  rationale: Die Wendung gibt Ziel beziehungsweise Ergebnis natürlich wieder, ohne das Gute näher zu bestimmen.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: denen, die nach dem Vorsatz berufen sind
  rationale: Die zweite Dativgruppe wird als erläuternde Wiederaufnahme der ersten bewahrt; „nach dem Vorsatz“ fügt kein im Griechischen unausgesprochenes Possessivpronomen ein.
- source_word: πρόθεσιν
  choice: Vorsatz
  rationale: „Vorsatz“ bezeichnet hier einen gefassten Zweck oder Plan und wahrt zugleich die knappe Formulierung des Ausgangstextes.
- source_word: κλητοῖς
  choice: berufen
  rationale: „Berufen“ ist der kontextgemäße paulinische Ausdruck und vermeidet eine Verengung auf eine bloße Einladung.
theological_decisions:
- issue: Subjekt von συνεργεῖ
  choice: Im Haupttext wirkt „alles“ zum Guten zusammen.
  alternative: „Gott wirkt alles zum Guten zusammen.“
  rationale: Der vorgelegte SBLGNT-Text enthält θεός an dieser Stelle nicht als ausdrückliches Subjekt. Die abweichende Lesart wird in einer Fußnote dokumentiert, statt die Spannung im Haupttext aufzulösen.
- issue: Possessivbezug bei κατὰ πρόθεσιν
  choice: „nach dem Vorsatz“ ohne ergänztes Possessivpronomen
  alternative: „nach seinem Vorsatz“
  rationale: Der Zusammenhang legt Gottes Vorsatz nahe, doch im griechischen Ausdruck steht kein Possessivpronomen. Die Alternative wird deshalb als Fußnote geboten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau. Der Gedankenstrich kennzeichnet die zweite Dativgruppe als erläuternde Wiederaufnahme, ohne ihre genaue syntaktische Beziehung übermäßig festzulegen.
