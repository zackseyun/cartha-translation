  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: de
  text: Denn diejenigen, die er im Voraus erkannt hat,[a] hat er auch im Voraus dazu bestimmt, dem Bild seines Sohnes gleichgestaltet zu werden, damit er der Erstgeborene unter vielen Brüdern sei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vorher kannte“. Manche verstehen das Erkennen hier relational, etwa im Sinn von: „sich ihnen im Voraus zugewandt hat“.'
    reason: alternative_reading
  - marker: b
    text: „Brüder“ ist im Griechischen grammatisch männlich; in Gottes Familie können hier Männer und Frauen gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die erklärende Funktion des griechischen Bindeworts natürlich wieder.
- source_word: οὓς προέγνω
  choice: die, die er im Voraus erkannt hat
  rationale: Bewahrt sowohl den Personenbezug als auch die zeitliche Vorsilbe des Verbs, ohne die umstrittene Art dieses Erkennens dogmatisch festzulegen.
- source_word: καὶ προώρισεν
  choice: hat er auch im Voraus dazu bestimmt
  rationale: Gibt die zeitliche und zielgerichtete Bedeutung von προορίζω wieder. Die Ergänzung „dazu“ führt natürlich zum folgenden Ziel der Gleichgestaltung.
- source_word: συμμόρφους τῆς εἰκόνος
  choice: dem Bild … gleichgestaltet zu werden
  rationale: Drückt die Übereinstimmung der Gestalt beziehungsweise Form aus und bewahrt zugleich den biblisch bedeutsamen Begriff „Bild“.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: seines Sohnes
  rationale: Bewahrt den ausdrücklichen christologischen Sohnestitel direkt.
- source_word: εἰς τὸ εἶναι αὐτὸν
  choice: damit dieser … sei
  rationale: Gibt die Zweck- beziehungsweise Ergebnisrichtung der Konstruktion wieder. „Dieser“ macht den Rückbezug auf den Sohn im Deutschen eindeutig.
- source_word: πρωτότοκον
  choice: der Erstgeborene
  rationale: Bewahrt die biblische Metapher und ihre mitklingende Rang- und Vorrangbedeutung, ohne sie durch eine Deutung zu ersetzen.
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: unter vielen Brüdern
  rationale: „Unter“ ist im Deutschen idiomatisch; „Brüder“ bildet den grammatisch maskulinen Plural ab, während die mögliche Einbeziehung von Frauen in einer Fußnote erläutert wird.
theological_decisions:
- issue: Ob προέγνω so wiederzugeben ist, dass die Debatte über Vorherwissen und Erwählung entschieden wird.
  choice: „im Voraus erkannt hat“ ohne dogmatisch verengende Umschreibung
  alternative: „vorher kannte“ oder deutend „sich im Voraus zugewandt hatte“
  rationale: Die Formulierung hält den zeitlichen und personalen Gehalt fest, lässt aber offen, ob das Erkennen hier primär kognitiv, relational oder erwählend zu verstehen ist.
- issue: Ob προώρισεν mit einem theologischen Fachwort oder einer transparenten deutschen Wendung wiederzugeben ist.
  choice: „im Voraus dazu bestimmt“
  alternative: „vorherbestimmt“
  rationale: Die gewählte Formulierung ist verständlich und präzise, ohne durch ein stark konfessionell aufgeladenes Fachwort zusätzliche Festlegungen einzutragen.
- issue: Ob ἀδελφοῖς im Haupttext ausdrücklich inklusiv wiederzugeben ist.
  choice: „Brüdern“ im Haupttext mit erläuternder Fußnote
  alternative: „Brüdern und Schwestern“ oder „Geschwistern“
  rationale: Der grammatisch maskuline Ausdruck bleibt sichtbar; zugleich weist die Fußnote darauf hin, dass im Zusammenhang Gottes Familie Männer und Frauen gemeint sein können.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Wendungen „im Voraus erkannt“ und „im Voraus … bestimmt“ spiegeln die griechischen Verben, während „gleichgestaltet zu werden“ den transformierenden Sinn wahrt. Die Satzstruktur bleibt eng am Gedankengang des Ausgangstextes, ohne unnatürlich zu wirken.
