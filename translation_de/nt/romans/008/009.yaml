  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: de
  text: Ihr aber seid nicht im Fleisch[a], sondern im Geist, wenn wirklich Gottes Geist in euch wohnt. Wenn aber jemand den Geist des Messias[b] nicht hat, gehört er nicht zu ihm.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Fleisch« kann hier mehr als den körperlichen Aspekt des Menschen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Geist Christi«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »der ist nicht sein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: Fleisch
  rationale: Bewahrt Paulus’ prägnanten theologischen Begriff und die Vorstellung eines Lebensbereichs; gemeint ist hier nicht bloß der Körper.
- source_word: πνεῦμα
  choice: Geist
  rationale: Der unmittelbare Zusammenhang bestimmt πνεῦμα als Gottes Geist beziehungsweise den Geist des Messias.
- source_word: οἰκεῖ
  choice: wohnt
  rationale: Gibt die Vorstellung dauerhafter Einwohnung natürlich und quellennah wieder.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός wird hier als Titel verstanden; »Messias« macht seine Bedeutung für heutige Leser transparent.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: gehört er nicht zu ihm
  rationale: Natürliches modernes Deutsch für das griechische Zugehörigkeitsverhältnis, ohne den Bezug von »ihm« ausdrücklich festzulegen.
- source_word: εἴπερ
  choice: sofern
  rationale: Bewahrt die bedingende Form und lässt zugleich den rhetorisch voraussetzenden Unterton zu.
- source_word: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι
  choice: Ihr aber lebt nicht im Fleisch, sondern im Geist
  rationale: Das ergänzte »lebt« gibt die idiomatische Bereichs- oder Existenzformel ἐν ... εἶναι in verständlichem Deutsch wieder, ohne den Gegensatz auf bloße innere Neigungen zu reduzieren.
- source_word: τις ... οὗτος
  choice: jemand ... er
  rationale: Folgt dem generischen Singular des Griechischen und bleibt im Deutschen klar und knapp.
theological_decisions:
- issue: Paulus’ Gegensatz zwischen »im Fleisch« und »im Geist«
  choice: »Fleisch« und »Geist« als Bereiche beziehungsweise bestimmende Wirklichkeiten des Lebens beibehalten
  alternative: »sündige Natur« und ein vom Geist beherrschtes Leben
  rationale: Die Formulierung bewahrt Paulus’ eigene Kategorien und ihre theologische Spannung, statt sie durch eine engere Deutung zu ersetzen.
- issue: Bezug von »ihm« in der Schlussaussage
  choice: Das Pronomen bleibt unaufgelöst; der nächste grammatische Bezug ist der Messias
  alternative: Ausdrückliche Wiedergabe mit »Gott« oder »dem Messias«
  rationale: Der griechische Text nennt den Bezug nicht erneut. Die unaufgelöste Form vermeidet eine über den Wortlaut hinausgehende Festlegung.
- issue: Verhältnis von »Geist Gottes« und »Geist des Messias«
  choice: Beide Bezeichnungen werden unverändert nebeneinandergestellt
  alternative: Paraphrastische Harmonisierung zu einer einzigen erweiterten Bezeichnung
  rationale: So bleibt die enge Verbindung erhalten, ohne die theologische Aussage systematisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Ihr« bildet den ausdrücklich gesetzten griechischen Plural ab. »Lebt« sorgt für idiomatische Verständlichkeit; die Fußnote dokumentiert die formale Konstruktion. Die Schlüsselbegriffe »Fleisch« und »Geist« bleiben erhalten.
