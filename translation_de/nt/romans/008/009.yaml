  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die zentralen Begriffe und Beziehungen des griechischen Textes grundsätzlich zutreffend wieder: σάρξ/πνεῦμα bleiben als »Fleisch«/»Geist« erhalten, οἰκεῖ ist treffend mit »wohnt« wiedergegeben, und die Schlussformulierung wahrt die im Griechischen nicht erneut explizierte Bezugnahme von αὐτοῦ. »lebt« für ἐστὲ verschiebt die existentielle bzw. sphärische Aussage jedoch leicht in Richtung Lebensführung. »Wenn wirklich« gibt εἴπερ als bedingte, zugleich rhetorisch voraussetzende Einleitung angemessener wieder als »sofern«, das im Deutschen stärker eine einschränkende Voraussetzung nahelegen kann.'
  naturalness: Die direkte Formel »Ihr aber seid nicht im Fleisch, sondern im Geist« ist in diesem theologischen Kontext verständliches, würdiges modernes Standarddeutsch und genauer als die dynamisierende Umschreibung mit »lebt«. Die Satzfolge bleibt flüssig.
  terminology: »Fleisch«, »Geist«, »Gottes Geist« und »Geist des Messias« sind konsistent und quellennah. »Messias« ist für Χριστοῦ als Titel vertretbar. Die Fußnote zum ersten Ausdruck soll am Wort »Fleisch« statt am nachfolgenden »Geist« verankert werden; ihre bisherige Deutung ist zudem weitergehend als nötig.
