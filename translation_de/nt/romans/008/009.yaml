revisions:
- from: Ihr aber lebt nicht im Fleisch, sondern im Geist,[a] sofern Gottes Geist in euch wohnt. Wenn aber jemand den Geist des Messias[b] nicht hat, gehört er nicht zu ihm.[c]
  to: Ihr aber seid nicht im Fleisch[a], sondern im Geist, wenn wirklich Gottes Geist in euch wohnt. Wenn aber jemand den Geist des Messias[b] nicht hat, gehört er nicht zu ihm.[c]
  rationale: Die Revision stellt die griechische Seins- und Bereichsformel unmittelbar wieder her, gibt εἴπερ weniger einengend wieder und verlegt die Fußnotenmarke an den tatsächlich erläuterten Schlüsselbegriff. Die Fußnote zu »Fleisch« bewahrt die lexikalische Offenheit, ohne Paulus’ Ausdruck durch eine vollständige dogmatische Paraphrase zu ersetzen.
