    issue: »lebt nicht im Fleisch, sondern im Geist« statt »seid nicht im Fleisch, sondern im Geist«
    rationale: Das griechische ἐστὲ bezeichnet unmittelbar ein Sein in einem Bereich bzw. einer Sphäre. »lebt« ist möglich, macht die Aussage aber stärker zu einer Beschreibung des praktischen Lebenswandels.
  - severity: low
    issue: »sofern« für εἴπερ
    rationale: »Sofern« kann eine begrenzende Bedingung formulieren. »Wenn wirklich« erhält die Konditionalform und den bekräftigenden Unterton von εἴπερ ohne diese zusätzliche Nuance.
  - severity: low
