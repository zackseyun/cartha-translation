id: ROM.8.4
reference: Romans 8:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: de
  text: damit die gerechte Forderung des Gesetzes in uns erfüllt würde, die wir nicht nach dem Fleisch[b] leben, sondern nach dem Geist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Fleisch“ bezeichnet hier den von Gott abgewandten Menschen beziehungsweise eine von dieser Ausrichtung bestimmte Lebensweise; manche übersetzen „sündige Natur“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Geist“ im allgemeineren Sinn; im Zusammenhang von Römer 8 ist wahrscheinlich der Heilige Geist gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Gibt den Zweck beziehungsweise das beabsichtigte Ergebnis der griechischen Finalkonstruktion natürlich und präzise wieder.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: die gerechte Forderung des Gesetzes
  rationale: δικαίωμα bezeichnet hier wahrscheinlich die rechtmäßige und gerechte Forderung des Gesetzes; die Formulierung bewahrt sowohl den rechtlichen als auch den ethischen Gehalt.
- source_word: πληρωθῇ
  choice: erfüllt würde
  rationale: Bewahrt Passiv und Konjunktiv des Aorists in der ἵνα-Konstruktion, ohne die handelnde Instanz ausdrücklich festzulegen.
- source_word: ἐν ἡμῖν
  choice: in uns
  rationale: Entspricht der Präposition ἐν unmittelbar und vermeidet die stärkere, im Griechischen nicht ausdrücklich formulierte Aussage „durch uns“.
- source_word: περιπατοῦσιν
  choice: leben
  rationale: Das griechische Bild des Gehens bezeichnet die Lebensführung. „leben“ ist im heutigen Deutsch natürlich und bringt den idiomatischen Sinn klar zum Ausdruck.
- source_word: σάρξ
  choice: Fleisch
  rationale: Bewahrt den paulinischen Schlüsselbegriff und seine Bedeutungsbreite, statt ihn im Haupttext interpretierend auf „sündige Natur“ zu verengen.
- source_word: πνεῦμα
  choice: Geist
  rationale: Der Kontext von Römer 8 spricht wahrscheinlich vom Heiligen Geist; die Großschreibung gibt diese Kontextdeutung wieder, während eine Fußnote die formale Mehrdeutigkeit festhält.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: nach dem Fleisch ... nach dem Geist
  rationale: Gibt κατά in der ethischen Gegenüberstellung transparent wieder und erhält die parallele Struktur.
theological_decisions:
- issue: Bedeutung von δικαίωμα im Verhältnis zum Gesetz
  choice: gerechte Forderung des Gesetzes
  alternative: Forderung des Gesetzes
  rationale: Die gewählte Fassung lässt sowohl den normativen Charakter als auch die Gerechtigkeit dieser Forderung erkennen, ohne eine einzelne Satzung vorauszusetzen.
- issue: Ob πνεῦμα den menschlichen Geist oder den Heiligen Geist bezeichnet
  choice: Geist
  alternative: Geist im Sinn des menschlichen Geistes beziehungsweise „geistgemäß“
  rationale: Der unmittelbare Zusammenhang von Römer 8 stellt das Wirken und den Lebensbereich des Heiligen Geistes heraus. Da das griechische Wort selbst keine Großschreibung zur Unterscheidung kennt, wird die alternative Möglichkeit in einer Fußnote genannt.
- issue: Ob ἐν ἡμῖν eine Erfüllung durch uns, in uns oder unter uns meint
  choice: in uns
  alternative: durch uns / unter uns
  rationale: „in uns“ wahrt die naheliegende Bedeutung von ἐν und legt die menschliche Beteiligung beziehungsweise die genaue Art der Erfüllung nicht über den Wortlaut hinaus fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das idiomatische „leben“ ersetzt die im Deutschen weniger natürliche Metapher „wandeln“. Die paulinischen Schlüsselbegriffe „Fleisch“ und „Geist“ bleiben erhalten. Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken; eine eigene Fußnote zur bereits transparent übersetzten Wendung „gerechte Forderung“ ist nicht erforderlich.
