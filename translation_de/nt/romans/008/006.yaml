id: ROM.8.6
reference: Romans 8:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: de
  text: Denn die Gesinnung des Fleisches ist Tod, die Gesinnung des Geistes[a] aber ist Leben und Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des menschlichen Geistes“ beziehungsweise „des Geistes“ in einem allgemeineren Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Gibt die begründende beziehungsweise erläuternde Verbindung zum vorausgehenden Gedankengang knapp und natürlich wieder.
- source_word: φρόνημα
  choice: Gesinnung
  rationale: 'Bezeichnet mehr als bloßes Denken: eine bestimmende innere Ausrichtung oder Haltung. „Gesinnung“ bewahrt diese Bedeutung und ermöglicht zugleich die prägnante Wiederholung des griechischen Ausdrucks.'
- source_word: σάρξ
  choice: Fleisch
  rationale: Bewahrt den paulinischen Schlüsselbegriff und seine theologische Spannung, ohne ihn auf die stärker deutende Wiedergabe „sündige Natur“ festzulegen.
- source_word: θάνατος
  choice: Tod
  rationale: Direkte und gewichtige Entsprechung, die den knappen Gegensatz zu „Leben“ erhält.
- source_word: πνεῦμα
  choice: Geist
  rationale: Der Zusammenhang von Römer 8 legt den Heiligen Geist nahe; die deutsche Großschreibung entspricht dieser Deutung, während eine Fußnote die mögliche allgemeinere oder anthropologische Lesart wahrt.
- source_word: ζωή
  choice: Leben
  rationale: Direkte Wiedergabe, die den pointierten Gegensatz zu „Tod“ erhält.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Natürliche Standardentsprechung, die neben dem Verhältnis zu Gott auch die umfassendere Bedeutung des Begriffs offenhält.
theological_decisions:
- issue: Bezieht sich πνεῦμα auf den Heiligen Geist oder auf den menschlichen Geist?
  choice: Geist im Sinn des Heiligen Geistes
  alternative: menschlicher Geist oder Geist in einem allgemeineren Sinn
  rationale: Der unmittelbare Zusammenhang in Römer 8 beschreibt den Geist wiederholt als göttlichen Urheber des Lebens. Da der griechische Text selbst keine Großschreibung zur Unterscheidung bietet, wird die alternative Deutung in einer Fußnote offengehalten.
- issue: Wie ist σάρξ in diesem ethisch-theologischen Gegensatz zu verstehen?
  choice: Fleisch
  alternative: sündige Natur
  rationale: „Fleisch“ erhält den wiederkehrenden paulinischen Begriff und vermeidet, dessen vielschichtige Bedeutung durch eine erklärende Paraphrase vorab festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzform und die knappe Antithese des griechischen Textes bleiben erhalten. „Gesinnung“ ist gehoben, aber allgemein verständlich und erfasst die dauerhafte innere Ausrichtung besser als das rein intellektuelle „Denken“.
