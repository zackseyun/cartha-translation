id: ROM.8.33
reference: Romans 8:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: de
  text: Wer wird gegen die von Gott Erwählten[a] Anklage erheben? Gott ist es, der sie gerecht spricht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Gottes Auserwählte“.'
    reason: lexical_alternative
  - marker: b
    text: '„Gerecht sprechen“ ist hier im rechtlichen Sinn gemeint: Gott erklärt sie für gerecht.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Wer
  rationale: Das Fragepronomen leitet eine rhetorische Frage ein; „Wer“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: ἐγκαλέσει
  choice: wird … Anklage erheben
  rationale: Das Verb hat hier einen rechtlich-forensischen Sinn. „Anklage erheben“ bewahrt den Gerichtston deutlicher als das allgemeinere „anklagen“.
- source_word: κατὰ
  choice: gegen
  rationale: In Verbindung mit einem Verb des Anklagens bezeichnet κατά die Personen, gegen die sich die Anklage richtet.
- source_word: ἐκλεκτῶν θεοῦ
  choice: die von Gott Erwählten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die Gott erwählt hat. Die Formulierung ist transparent und vermeidet, einen späteren theologischen Fachbegriff vorauszusetzen.
- source_word: θεὸς ὁ δικαιῶν
  choice: Gott ist es, der sie gerecht spricht
  rationale: Die emphatische, im Griechischen knappe Wendung bezeichnet Gott als denjenigen, der rechtfertigt. „Gerecht spricht“ wahrt den forensischen Sinn und passt zum Bild von Anklage und Urteil.
theological_decisions:
- issue: Wiedergabe von ἐκλεκτῶν ohne Einengung auf ein späteres Lehrsystem
  choice: die von Gott Erwählten
  alternative: Gottes Auserwählte
  rationale: Die Übersetzung sagt aus, dass Gott sie erwählt hat, ohne die Aussage über den unmittelbaren Wortlaut hinaus systematisch zu bestimmen.
- issue: Forensischer Sinn von δικαιόω
  choice: gerecht spricht
  alternative: rechtfertigt
  rationale: 'Der Kontext einer erhobenen Anklage legt die gerichtliche Bedeutung nahe: Gott fällt das rechtsprechende Urteil. „Gerecht spricht“ macht dies verständlich, ohne die theologische Tragweite des Verbs zu verkürzen.'
- issue: Emphase und Ellipse in θεὸς ὁ δικαιῶν
  choice: Gott ist es, der sie gerecht spricht
  alternative: Gott, der sie gerecht spricht?
  rationale: Die Aussage wird als emphatische Antwort auf die vorausgehende rhetorische Frage verstanden. Die alternative Zeichensetzung als weitere rhetorische Frage ist grammatisch erwägenswert, im Zusammenhang jedoch weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Bildwelt des griechischen Textes bleibt durch „Anklage erheben“ und „gerecht sprechen“ erhalten; zugleich wird die emphatische Satzform natürlich wiedergegeben.
