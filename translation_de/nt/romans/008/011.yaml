id: ROM.8.11
reference: Romans 8:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: de
  text: Wenn aber der Geist dessen, der Jesus von den Toten auferweckt hat, in euch wohnt, dann wird der, der Christus Jesus[a] von den Toten auferweckt hat, auch eure sterblichen Körper lebendig machen – aufgrund seines Geistes, der in euch wohnt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Christus“ bedeutet „Messias“ und ist hier als Titel zu verstehen.
    reason: lexikalische Erläuterung
  - marker: b
    text: 'Auch möglich: „durch seinen Geist, der in euch wohnt“. Der Haupttext folgt dem kausalen Sinn der hier zugrunde gelegten griechischen Lesart.'
    reason: grammatische Alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: Geist
  rationale: In beiden Vorkommen bezeichnet das Wort im Zusammenhang den Geist Gottes; die Großschreibung verdeutlicht diesen Bezug, ohne den griechischen Ausdruck zu erweitern.
- source_word: ἐγείραντος / ἐγείρας
  choice: auferweckt hat
  rationale: „Auferwecken“ ist im Deutschen die natürliche und sachlich genaue Bezeichnung für Gottes Handeln bei der Auferstehung Jesu.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Die geläufige deutsche Wendung gibt das Hervorkommen aus dem Bereich der Toten idiomatisch wieder.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: wohnt / der … wohnt
  rationale: Die wiederholte Wortwahl bewahrt den Zusammenhang zwischen beiden Aussagen über das Wohnen des Geistes.
- source_word: Χριστὸν Ἰησοῦν
  choice: Christus Jesus
  rationale: Diese im Deutschen etablierte Namens- und Titelfolge bleibt der griechischen Wortstellung nahe; eine Fußnote macht die weiterhin erkennbare Titelfunktion von Χριστός transparent.
- source_word: ζῳοποιήσει
  choice: wird … lebendig machen
  rationale: Die Formulierung bewahrt Futur und aktive Lebensmitteilung und bezieht sich konkret auf die sterblichen Körper.
- source_word: θνητὰ σώματα
  choice: sterbliche Körper
  rationale: Die direkte Wiedergabe hält sowohl die leibliche Konkretheit als auch die gegenwärtige Sterblichkeit fest.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: aufgrund seines Geistes, der … wohnt
  rationale: διά mit dem Akkusativ bezeichnet in der vorliegenden SBLGNT-Lesart am natürlichsten den Grund; „aufgrund“ bildet diese kausale Beziehung klar und knapp ab.
theological_decisions:
- issue: Kausale oder instrumentale Deutung der Schlusswendung
  choice: aufgrund seines Geistes, der in euch wohnt
  alternative: durch seinen Geist, der in euch wohnt
  rationale: Der Haupttext folgt der vorgelegten SBLGNT-Lesart mit διά und Akkusativ und bewahrt daher deren naheliegenden kausalen Sinn. Die verbreitete instrumentale Wiedergabe wird in einer Fußnote offengehalten.
- issue: Wiedergabe von Χριστός als Titel
  choice: Christus Jesus
  alternative: Messias Jesus
  rationale: „Christus Jesus“ ist im modernen Standarddeutsch würdig und verständlich; die Fußnote weist darauf hin, dass „Christus“ hier den Titel „Messias“ wiedergibt und nicht als bloßer Familienname zu verstehen ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Dann“ macht die Folgerung des griechischen Bedingungssatzes natürlich hörbar; der Gedankenstrich hebt die abschließende Begründung hervor. Beide Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Stellen.
