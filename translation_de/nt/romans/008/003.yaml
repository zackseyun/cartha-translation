id: ROM.8.3
reference: Romans 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: de
  text: Denn was dem Gesetz unmöglich war[a], weil es durch das Fleisch schwach war[b], das tat Gott, indem er seinen eigenen Sohn in der Gestalt des von der Sünde geprägten Fleisches[c] und wegen der Sünde[d] sandte und die Sünde im Fleisch verurteilte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »das Unvermögen des Gesetzes«.'
    reason: lexical_alternative
  - marker: b
    text: »Fleisch« bezeichnet hier wahrscheinlich den Menschen in seiner durch die Sünde geschwächten Verfassung; die Übersetzung »sündige Natur« wäre stärker deutend.
    reason: lexical_alternative
  - marker: c
    text: Die Formulierung bekräftigt das wirkliche Menschsein des Sohnes und unterscheidet ihn zugleich von der Sünde selbst.
    reason: cultural_note
  - marker: d
    text: 'Oder: »für die Sünde«. Der griechische Ausdruck kann im biblischen Sprachgebrauch auch einen Opferbezug haben: »als Sündopfer«.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: was dem Gesetz unmöglich war
  rationale: Die substantivierte neutrale Wendung bezeichnet das Unvermögen des Gesetzes. Die deutsche Formulierung ist idiomatisch und bleibt nahe an der griechischen Satzstruktur.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: weil es durch das Fleisch geschwächt wurde
  rationale: ἐν ᾧ führt hier die Erklärung für das Unvermögen des Gesetzes ein. »Durch das Fleisch« bewahrt den paulinischen Schlüsselbegriff, ohne ihn vorschnell als »sündige Natur« auszulegen.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: seinen eigenen Sohn
  rationale: »Eigenen« gibt die Betonung durch ἑαυτοῦ wieder.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: in der Gestalt des von der Sünde geprägten Fleisches
  rationale: »Gestalt« gibt ὁμοίωμα in natürlichem Deutsch wieder; »von der Sünde geprägtes Fleisch« wahrt den Genitivausdruck, ohne dem Sohn selbst Sünde zuzuschreiben.
- source_word: περὶ ἁμαρτίας
  choice: um der Sünde willen
  rationale: Die Formulierung erhält die Weite des griechischen Ausdrucks. Sein möglicher opfertheologischer Sinn wird in einer Fußnote genannt, statt im Haupttext festgelegt zu werden.
- source_word: κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί
  choice: verurteilte so die Sünde im Fleisch
  rationale: »Verurteilte« bewahrt die gerichtliche Aussage des Verbs. »Im Fleisch« lässt die knappe und möglicherweise mehrschichtige Orts- beziehungsweise Sphärenangabe des Griechischen bestehen; »so« verdeutlicht lediglich den instrumentalen Zusammenhang des deutschen Satzes.
theological_decisions:
- issue: Bedeutung von σάρξ
  choice: Fleisch
  alternative: sündige Natur
  rationale: »Fleisch« bewahrt Paulus’ körperliche und anthropologische Bedeutungsebenen. Die interpretierende Wiedergabe »sündige Natur« würde diese Spannung verengen.
- issue: Bedeutung von περὶ ἁμαρτίας
  choice: um der Sünde willen
  alternative: als Sündopfer
  rationale: Der Ausdruck kann aufgrund des Septuaginta-Sprachgebrauchs einen Opferbezug tragen, kann aber auch allgemeiner »wegen/für die Sünde« bedeuten. Der Haupttext wahrt diese Mehrdeutigkeit, die Fußnote nennt den opfertheologischen Sinn.
- issue: Christologische Aussage von ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: in der Gestalt des von der Sünde geprägten Fleisches
  alternative: in der Gleichgestalt des Fleisches der Sünde
  rationale: Die Wiedergabe hält wirkliche menschliche Existenz und die sprachliche Unterscheidung des Sohnes von der Sünde zusammen, ohne die Aussage dogmatisch auszubauen.
- issue: Bezug von ἐν τῇ σαρκί
  choice: im Fleisch
  alternative: in seinem Fleisch
  rationale: Das Griechische enthält kein Possessivpronomen. Die knappe Formulierung bleibt deshalb im Haupttext erhalten, obwohl der Zusammenhang besonders an das Fleisch des gesandten Sohnes denken lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem griechischen Gedankengang, wird aber durch Doppelpunkt und die Wiederaufnahme »das tat Gott« für heutige Leser gegliedert. Die zentralen Begriffe »Gesetz«, »Fleisch«, »Sünde« und »verurteilen« bleiben ausdrücklich erhalten.
