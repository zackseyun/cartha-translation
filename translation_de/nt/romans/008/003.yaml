  to: Denn was dem Gesetz unmöglich war[a], weil es durch das Fleisch schwach war[b], das tat Gott, indem er seinen eigenen Sohn in der Gestalt des von der Sünde geprägten Fleisches[c] und wegen der Sünde[d] sandte und die Sünde im Fleisch verurteilte.
  rationale: Die Revision stellt die aktive Zustandsbeschreibung des griechischen ἠσθένει wieder her und ersetzt eine im Deutschen potenziell missverständliche Zweckformulierung durch »wegen der Sünde«. Die Satzführung macht deutlich, dass Gottes Handeln sowohl das Senden des Sohnes als auch die Verurteilung der Sünde umfasst. Die knappe Mehrdeutigkeit von »im Fleisch« und der mögliche Opferbezug von περὶ ἁμαρτίας bleiben erhalten.
