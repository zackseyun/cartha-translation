  variant: modern standard German
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: de
  text: Denn in Hoffnung sind wir gerettet worden.[a] Eine Hoffnung aber, die man sieht, ist keine Hoffnung; denn wer hofft auf das, was er sieht?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn durch Hoffnung sind wir gerettet worden.“'
    reason: Alternative Deutung des Dativs τῇ ἐλπίδι als Mittel statt als Bereich oder Art und Weise.
  - marker: b
    text: 'Das heißt: Hoffnung richtet sich auf das, was noch nicht zu sehen ist.'
    reason: Erläuterung des Gegensatzes zwischen Hoffnung und Sehen im unmittelbaren Zusammenhang.
lexical_decisions:
- source_word: τῇ γὰρ ἐλπίδι
  choice: Denn in Hoffnung
  rationale: Der Dativ wird als Bereich beziehungsweise Art und Weise verstanden. „In Hoffnung“ bewahrt die Spannung zwischen bereits geschehener Rettung und ihrer noch unsichtbaren Vollendung; γάρ wird mit „denn“ wiedergegeben.
- source_word: ἐσώθημεν
  choice: sind wir gerettet worden
  rationale: Das Aoristpassiv wird als vollzogene Rettung wiedergegeben, wobei das Passiv erhalten bleibt. Das deutsche Perfekt klingt im gegenwärtigen Standarddeutsch natürlicher als das Präteritum, ohne den Zukunftsaspekt der Hoffnung vorwegzunehmen.
- source_word: ἐλπὶς δὲ βλεπομένη
  choice: Eine Hoffnung aber, die man sieht
  rationale: Das Partizip wird durch einen natürlichen Relativsatz wiedergegeben. Das unpersönliche „man“ wahrt den allgemeinen Charakter der Aussage.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: ist keine Hoffnung
  rationale: Die qualitative Aussage wird knapp und idiomatisch wiedergegeben.
- source_word: ὃ γὰρ βλέπει
  choice: denn ... das, was er sieht
  rationale: Das sächliche Relativpronomen ὃ bezeichnet das Gesehene. „Das, was“ macht den Bezug im Deutschen eindeutig.
- source_word: τίς ἐλπίζει
  choice: wer hofft
  rationale: Die rhetorische, allgemein menschliche Frage bleibt in ihrer knappen Form erhalten.
theological_decisions:
- issue: Verhältnis von Rettung und Hoffnung in τῇ ἐλπίδι ἐσώθημεν
  choice: '„in Hoffnung sind wir gerettet worden“: Die Rettung ist wirklich geschehen, steht aber hinsichtlich ihrer sichtbaren Vollendung noch im Zeichen der Hoffnung.'
  alternative: „durch Hoffnung sind wir gerettet worden“ als instrumentale Deutung des Dativs
  rationale: Der Zusammenhang entfaltet die Spannung von schon gegenwärtiger Rettung und noch ausstehender, sichtbarer Vollendung. „In Hoffnung“ vermeidet es, die Hoffnung als wirkende Ursache der Rettung festzulegen.
- issue: Die Bedeutung der gesehenen Hoffnung
  choice: Die paradoxe Formulierung „Eine Hoffnung ..., die man sieht, ist keine Hoffnung“ bleibt stehen.
  alternative: 'Explizierende Wiedergabe: „Was bereits sichtbar da ist, darauf braucht man nicht mehr zu hoffen.“'
  rationale: Die quellennähere Form bewahrt die Prägnanz und theologische Spannung des griechischen Textes; die Erläuterung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, während „die man sieht“ idiomatischer klingt als eine substantivische oder wörtlich partizipiale Konstruktion. Die generische Aussage wird ohne unnötige geschlechtliche Markierung formuliert.
