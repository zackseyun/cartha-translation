id: ROM.8.38
reference: Romans 8:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: de
  text: Denn ich bin überzeugt, dass weder Tod noch Leben, weder Engel noch Herrschaftsgewalten[a], weder Gegenwärtiges noch Zukünftiges noch Kräfte
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Herrscher; gemeint sein können kosmische oder geistliche Autoritäten.'
    reason: Lexikalische Alternative und mögliche Referenz von ἀρχαί.
lexical_decisions:
- source_word: πέπεισμαι
  choice: ich bin überzeugt
  rationale: Das Perfekt bezeichnet eine gefestigte, bis in die Gegenwart anhaltende Überzeugung; die deutsche Formulierung gibt diesen gegenwärtigen Zustand natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage und bleibt im Deutschen als verbindendes »denn« ausdrücklich erhalten.
- source_word: οὔτε … οὔτε
  choice: weder … noch
  rationale: Die wiederholte Korrelativstruktur bewahrt Rhythmus und Nachdruck der griechischen Aufzählung.
- source_word: θάνατος
  choice: Tod
  rationale: Direkte, im Gegensatz zu »Leben« stehende Wiedergabe.
- source_word: ζωή
  choice: Leben
  rationale: Direkte Wiedergabe, die den Gegensatz zu »Tod« wahrt.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Im Zusammenhang kosmischer und übermenschlicher Größen ist »Engel« wahrscheinlicher als das allgemeinere »Boten«.
- source_word: ἀρχαί
  choice: Herrschaftsgewalten
  rationale: Der Ausdruck kann Herrschende, Herrschaften oder kosmische Mächte bezeichnen. »Herrschaftsgewalten« hält den Bezug auf Autorität fest, ohne ihn auf rein menschliche Machthaber zu beschränken.
- source_word: ἐνεστῶτα
  choice: Gegenwärtiges
  rationale: Das substantivierte Partizip bezeichnet gegenwärtige Wirklichkeiten; die substantivierte deutsche Form ist knapp und wahrt die Parallelität.
- source_word: μέλλοντα
  choice: Zukünftiges
  rationale: Das substantivierte Partizip bezeichnet kommende Wirklichkeiten und bildet eine natürliche Parallele zu »Gegenwärtiges«.
- source_word: δυνάμεις
  choice: Kräfte
  rationale: Die Wiedergabe lässt offen, ob persönliche beziehungsweise geistliche Mächte oder unpersönliche Kräfte gemeint sind, und unterscheidet den Begriff sprachlich von ἀρχαί.
theological_decisions:
- issue: Ob ἀρχαί und δυνάμεις als feststehende Bezeichnungen bestimmter geistlicher Wesen wiederzugeben sind
  choice: Die breiteren Ausdrücke »Herrschaftsgewalten« und »Kräfte« stehen im Haupttext.
  alternative: »Herrscher und Mächte« oder »Fürstentümer und Gewalten«
  rationale: Der Zusammenhang legt kosmische oder geistliche Mächte nahe, doch die griechischen Begriffe legen keine vollständig ausgearbeitete Rangordnung fest. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten »weder … noch«-Glieder erhalten den rhetorischen Rhythmus. Da der Satz in Vers 39 weitergeführt wird, steht am Ende kein abschließender Punkt.
