id: ROM.7.18
reference: Romans 7:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: de
  text: Denn ich weiß, dass in mir, das heißt in meinem Fleisch,[a] nichts Gutes wohnt. Das Wollen ist zwar bei mir vorhanden, aber das Gute zu vollbringen nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meiner sündigen Natur“.'
    reason: Lexikalische Deutungsalternative für σάρξ; der Haupttext behält die konkrete und theologisch offene Wiedergabe „Fleisch“ bei.
lexical_decisions:
- source_word: οἶδα
  choice: ich weiß
  rationale: Die Perfektform hat hier präsentische Bedeutung; „ich weiß“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: οἰκεῖ
  choice: wohnt
  rationale: „Wohnt“ bewahrt das paulinische Bild des Innewohnens und klingt im Deutschen natürlich.
- source_word: ἀγαθόν
  choice: nichts Gutes
  rationale: Das negierte substantivierte Adjektiv wird im Deutschen idiomatisch mit „nichts Gutes“ wiedergegeben.
- source_word: σάρξ
  choice: Fleisch
  rationale: Die wörtliche Wiedergabe bewahrt Paulus’ Formulierung und ihre theologische Spannung, ohne sie vorschnell als „sündige Natur“ auszulegen.
- source_word: τὸ θέλειν
  choice: das Wollen
  rationale: Der substantivierte Infinitiv wird formal und verständlich wiedergegeben.
- source_word: παράκειταί μοι
  choice: ist bei mir vorhanden
  rationale: Die Wendung bezeichnet Nähe beziehungsweise Verfügbarkeit und wahrt zugleich den persönlichen Dativ.
- source_word: τὸ κατεργάζεσθαι τὸ καλόν
  choice: das Gute zu vollbringen
  rationale: „Vollbringen“ gibt das wirksame Ausführen wieder; die Infinitivkonstruktion bleibt trotz idiomatischer deutscher Satzfügung erkennbar.
- source_word: οὔ
  choice: nicht
  rationale: Das knappe elliptische οὔ wird ebenso knapp wiedergegeben; „ist bei mir vorhanden“ ist aus dem ersten Satzglied mitzudenken.
theological_decisions:
- issue: Bedeutung von σάρξ im moralisch geprägten paulinischen Zusammenhang
  choice: Fleisch
  alternative: sündige Natur
  rationale: „Fleisch“ lässt die Reichweite des Begriffs offen und verhindert, dass eine bestimmte anthropologische Deutung in den Haupttext eingetragen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zwar … aber“ macht den griechischen Gegensatz natürlich deutlich. Der Schlusssatz bewahrt durch seine Ellipse die knappe rhetorische Wirkung des Originals.
