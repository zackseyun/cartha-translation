  terminology: „Gesetz“, „Geist“ und „Buchstabe“ sind passende, traditionsfähige und zugleich textnahe Begriffe. Die Groß-/Kleinschreibung kann im Deutschen bei „Geist“ die Auslegungsfrage nicht entscheiden; die Anmerkung sollte deshalb die mögliche Bezugnahme klar und knapp benennen.
