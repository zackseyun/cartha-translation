revisions:
- from: Jetzt aber sind wir vom Gesetz freigemacht worden, da wir dem gestorben sind, was uns gefangen hielt, sodass wir in der Neuheit des Geistes dienen und nicht in der Veraltetheit des Buchstabens.[a][b]
  to: Jetzt aber sind wir vom Gesetz befreit, da wir dem gestorben sind, was uns festhielt, sodass wir in der neuen Weise des Geistes dienen[a] und nicht in der alten Weise des Buchstabens.[b]
  rationale: „Befreit“ ist für κατηργήθημεν ἀπὸ τοῦ νόμου idiomatisch und wahrt den relationalen Sinn. „Was uns festhielt“ bildet die Bindungsmetaphorik von κατειχόμεθα knapper und genauer ab. Die parallele Formulierung „neue Weise / alte Weise“ ist modernes, natürliches Deutsch und vermeidet die unnötig wertende und sperrige „Veraltetheit“. Die Fußnoten werden an ihren tatsächlichen Bezugsausdrücken verankert.
