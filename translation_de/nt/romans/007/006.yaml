reference: Romans 7:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: de
  text: Jetzt aber sind wir vom Gesetz befreit, da wir dem gestorben sind, was uns festhielt, sodass wir in der neuen Weise des Geistes dienen[a] und nicht in der alten Weise des Buchstabens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geist“ kann hier auch den menschlichen Geist oder eine innere Haltung bezeichnen; im Zusammenhang ist jedoch auch der Heilige Geist möglich.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „der schriftlichen Ordnung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: sind wir vom Gesetz freigemacht worden
  rationale: Die Passivform mit ἀπό bezeichnet die Befreiung vom bindenden Anspruch des Gesetzes, nicht die Abschaffung des Gesetzes. „Freigemacht“ bewahrt diesen relationalen Sinn und klingt im Deutschen natürlich.
- source_word: ἀποθανόντες
  choice: da wir … gestorben sind
  rationale: Das Partizip bezieht sich auf das implizite Subjekt „wir“. Die kausal-temporale Wiedergabe ist im Deutschen flüssig und hält fest, dass die Glaubenden gestorben sind, nicht das Gesetz.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: dem …, was uns gefangen hielt
  rationale: Die Formulierung gibt das frühere Festgehalten- oder Gebundensein anschaulich wieder, ohne die schwierige griechische Konstruktion unnötig nachzuahmen.
- source_word: δουλεύειν
  choice: dienen
  rationale: „Dienen“ ist hier idiomatisch und lässt den Hintergrund des Sklavendienstes anklingen, während der Schwerpunkt auf der neuen Art des Dienstes liegt.
- source_word: καινότητι
  choice: in der Neuheit
  rationale: Das abstrakte Substantiv wahrt die rhetorische Parallelität mit παλαιότητι und ist in würdigem modernem Deutsch verständlich.
- source_word: πνεύματος
  choice: des Geistes
  rationale: Im paulinischen Gegensatz von Geist und Buchstabe ist der Heilige Geist wahrscheinlich gemeint. Die mögliche allgemeinere Lesart bleibt in einer Fußnote erhalten.
- source_word: παλαιότητι γράμματος
  choice: in der Veraltetheit des Buchstabens
  rationale: Die möglichst direkte Wiedergabe bewahrt sowohl die abstrakte Gegenüberstellung „Neuheit/Veraltetheit“ als auch Paulus’ prägnanten Ausdruck „Buchstabe“.
theological_decisions:
- issue: Ob das Gesetz oder die Glaubenden gestorben sind
  choice: Die Glaubenden sind dem gestorben, was sie gefangen hielt.
  alternative: Das Gesetz sei in Bezug auf die Glaubenden gestorben.
  rationale: ἀποθανόντες steht im Nominativ Plural und gehört zum Subjekt „wir“. Die Übersetzung folgt dieser Grammatik und erklärt nicht das Gesetz selbst für gestorben.
- issue: Ob πνεύματος den Heiligen Geist oder den menschlichen Geist bezeichnet
  choice: „des Geistes“ als Hinweis auf den Heiligen Geist
  alternative: „des Geistes“ im Sinn einer neuen inneren Haltung oder eines neuen menschlichen Geistes
  rationale: Der paulinische Gegensatz zwischen Geist und Buchstabe sowie der Zusammenhang des neuen Bundes sprechen eher für den Heiligen Geist; die grammatische Form allein erzwingt diese Deutung jedoch nicht.
- issue: Bedeutung von γράμματος
  choice: „des Buchstabens“
  alternative: „der schriftlichen Ordnung“
  rationale: „Buchstabe“ bewahrt Paulus’ theologisch spannungsreichen und knappen Ausdruck, statt ihn im Haupttext bereits als Gesetzeskodex auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. „Neuheit“ und „Veraltetheit“ sind bewusst etwas gehoben, um Paulus’ parallele Abstrakta zu erhalten. Die Fußnotenmarker stehen unmittelbar nach dem Satzteil, auf den beide Alternativen bezogen sind.
