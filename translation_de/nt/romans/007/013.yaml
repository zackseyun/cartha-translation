  to: Ist also das Gute für mich zum Tod geworden? Keineswegs! Vielmehr bewirkte die Sünde mir durch das Gute den Tod, damit sie als Sünde sichtbar würde, damit die Sünde durch das Gebot über die Maßen sündig würde.
  rationale: Die Revision gibt μοι unmittelbar als „mir“ wieder und entfernt die nicht quellengestützte Alternative „in mir“. Die Satzführung macht die Sünde eindeutig zum Subjekt des todbringenden Handelns, ohne die elliptische und personifizierende Argumentation des griechischen Textes inhaltlich zu verändern.
