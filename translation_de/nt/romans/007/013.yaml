  naturalness: 'Der überarbeitete Satz ist modernes, würdiges Standarddeutsch. Die explizite Wiederaufnahme von „die Sünde“ vermeidet das etwas schwerfällige „Vielmehr war es die Sünde: Sie sollte ...“ und bildet die personifizierte Handlung klar ab.'
