id: ROM.7.13
reference: Romans 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: de
  text: Ist also das Gute für mich zum Tod geworden? Keineswegs! Vielmehr bewirkte die Sünde mir durch das Gute den Tod, damit sie als Sünde sichtbar würde, damit die Sünde durch das Gebot über die Maßen sündig würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: das Gute
  rationale: Das substantivierte Neutrum bezeichnet das, was gut ist; „das Gute“ bewahrt die abstrakte Form und nimmt den unmittelbaren Kontext auf.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: für mich zum Tod geworden
  rationale: Die Formulierung erhält den Dativ der persönlichen Beziehung und die prädikative Verbindung von γίνομαι mit „Tod“, ohne dem Guten schuldhafte Wirksamkeit zuzuschreiben.
- source_word: μὴ γένοιτο
  choice: Keineswegs!
  rationale: Eine kräftige, natürliche deutsche Zurückweisung, die der paulinischen Formel entspricht, ohne altertümlich zu klingen.
- source_word: ἡ ἁμαρτία
  choice: die Sünde
  rationale: Das Abstraktum bleibt erhalten und kann auch im Deutschen als handelnde Macht personifiziert erscheinen.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: Sie sollte als Sünde sichtbar werden
  rationale: 'Die Wiederholung von ἁμαρτία hat prädikative Kraft: Die Sünde soll in ihrem wahren Charakter als Sünde offenbar werden.'
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: durch das Gute
  rationale: Die instrumentale διά-Konstruktion und der Rückbezug auf τὸ ἀγαθόν am Versanfang bleiben sichtbar.
- source_word: μοι κατεργαζομένη θάνατον
  choice: den Tod in mir bewirkte
  rationale: κατεργάζομαι bezeichnet das Hervorbringen eines Ergebnisses; „in mir“ gibt den persönlichen Dativ im Deutschen kontextgemäß wieder, wobei „für mich“ als mögliche Nuance vermerkt wird.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: über die Maßen sündig
  rationale: Die bewusst zugespitzte Verbindung von „Sünde“ und „sündig“ wird bewahrt; „über die Maßen“ gibt die außerordentliche Steigerung wieder.
- source_word: διὰ τῆς ἐντολῆς
  choice: durch das Gebot
  rationale: „Gebot“ ist im Deutschen die natürliche kontextuelle Wiedergabe von ἐντολή und erhält die instrumentale bzw. vermittelnde Rolle.
theological_decisions:
- issue: Verantwortung für den Tod und Güte des Gebots
  choice: Nicht das Gute selbst, sondern die Sünde bewirkt den Tod, wobei sie das Gute als Mittel gebraucht.
  alternative: Eine freiere Formulierung könnte das Gebot selbst als moralisch verantwortliche Todesursache erscheinen lassen.
  rationale: Der Gegensatz nach μὴ γένοιτο weist die handelnde Verantwortung ausdrücklich der Sünde zu. Zugleich bleibt die Spannung bestehen, dass sie gerade durch das Gute und durch das Gebot wirkt.
- issue: Zweck- oder Folgecharakter der ἵνα-Sätze
  choice: Die beiden ἵνα-Sätze werden mit zweckbetonten Formulierungen („sollte“, „damit“) wiedergegeben.
  alternative: Sie könnten stärker konsekutiv mit „sodass“ formuliert werden.
  rationale: ἵνα trägt hier eine Ziel- bzw. Offenbarungsrichtung, ohne dass eine scharfe Trennung von Zweck und Folge erzwungen werden sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche paulinische Zuspitzung „die Sünde … über die Maßen sündig“ bleibt bewusst erhalten, statt stilistisch geglättet zu werden.
