    issue: „durch das Gesetz“ kann als spezifischer Verweis auf das mosaische Gesetz verstanden werden.
    rationale: Das artikellose νόμῳ bezeichnet hier im unmittelbaren Kontext einen allgemeinen gesetzlichen beziehungsweise ehelichen Rechtsgrundsatz. „Kraft Gesetzes“ wahrt die Gesetzes-Terminologie, ohne eine spezifische Identifikation nahezulegen.
  - severity: medium
    issue: „vom Gesetz des Mannes“ klingt im modernen Deutschen nach einem Gesetz, das der Mann besitzt oder erlässt.
    rationale: Der griechische Genitiv ist komprimiert und meint wahrscheinlich die gesetzliche Bindung in Bezug auf den Ehemann. Die Formulierung „von diesem Gesetz“ macht den Bezug auf den zuvor genannten Rechtsgrundsatz klar; die Fußnote hält die wörtlichere Form fest.
