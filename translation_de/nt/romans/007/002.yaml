source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: de
  text: Denn eine verheiratete Frau ist kraft Gesetzes an ihren Mann gebunden, solange er lebt; wenn aber der Mann stirbt, ist sie von diesem Gesetz befreit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Gesetz des Mannes“. Gemeint ist wahrscheinlich die gesetzliche Bindung, die sie an ihren Mann band.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: eine verheiratete Frau
  rationale: Die Wendung bezeichnet eine Frau, die in einer rechtlich verbindlichen Ehe steht. Diese Wiedergabe ist klar und natürlich und bewahrt den ehelich-rechtlichen Sinn.
- source_word: τῷ ζῶντι ἀνδρί
  choice: an ihren Mann …, solange er lebt
  rationale: Die Auflösung des Partizips in einen Temporalsatz klingt im Deutschen natürlich und hebt hervor, dass die Bindung für die Lebenszeit des Mannes gilt.
- source_word: δέδεται
  choice: ist … gebunden
  rationale: Das griechische Perfekt Passiv bezeichnet einen fortdauernden Zustand, der aus dem Akt des Bindens hervorgegangen ist.
- source_word: νόμῳ
  choice: durch das Gesetz
  rationale: Gemeint ist im unmittelbaren Zusammenhang die rechtliche Ordnung beziehungsweise Bindung der Ehe. Der bestimmte Artikel ist im Deutschen idiomatisch, ohne damit zwingend das mosaische Gesetz festzulegen.
- source_word: κατήργηται
  choice: ist … entbunden
  rationale: Das Verb bezeichnet hier, dass die rechtliche Bindungswirkung aufgehoben ist. „Entbunden“ passt zur Rechts- und Ehemetaphorik, ohne das Verb wörtlich als „abgeschafft“ wiederzugeben.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: vom Gesetz des Mannes
  rationale: Die knappe Genitivverbindung wird bewusst formal bewahrt. Sie meint wahrscheinlich das Gesetz beziehungsweise Rechtsverhältnis, das die Frau an ihren Mann band, nicht ein vom Mann erlassenes Gesetz; die Fußnote erläutert diese mögliche Bedeutung.
theological_decisions:
- issue: Bezeichnet νόμῳ beziehungsweise τοῦ νόμου speziell das mosaische Gesetz oder allgemein die rechtliche Bindung der Ehe?
  choice: die allgemeine gesetzliche beziehungsweise eheliche Bindung
  alternative: das auf die Ehe angewandte mosaische Gesetz
  rationale: Der unmittelbare Ehekontext und das artikellose νόμῳ im ersten Satzteil sprechen für einen allgemeinen rechtlichen Grundsatz. Die Übersetzung wahrt dennoch das Wort „Gesetz“ und lässt damit die Verbindung zu Paulus’ übergeordnetem Gesetzesthema bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem argumentativen Aufbau des Griechischen; die etwas gedrängte Formulierung „Gesetz des Mannes“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
