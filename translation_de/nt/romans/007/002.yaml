review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die ehelich-rechtliche Bindung, ihre Geltung während des Lebens des Mannes und die Befreiung durch seinen Tod zutreffend wieder. „Gesetz des Mannes“ ist zwar formal nahe am Genitiv τοῦ ἀνδρός, legt im heutigen Deutschen jedoch leicht nahe, es handle sich um ein vom Mann selbst stammendes Gesetz. „Dieses Gesetz“ nimmt den im ersten Satz genannten allgemeinen Rechtsgrundsatz auf und vermittelt die im Kontext wahrscheinliche Bedeutung ohne diese Fehlassoziation.
  naturalness: „Kraft Gesetzes“ ist modernes, sachliches Standarddeutsch und gibt die generische, artikellose Verwendung von νόμῳ besser wieder als „durch das Gesetz“. Die Wiederaufnahme „von diesem Gesetz befreit“ ist klar, idiomatisch und bewahrt den juristischen Duktus.
  terminology: „Verheiratete Frau“, „an ihren Mann gebunden“, „solange er lebt“ und „befreit“ sind angemessen. Die Fußnote dokumentiert die wörtlichere Genitivform und erläutert deren wahrscheinlich gemeinte rechtliche Beziehung, ohne sie als unumstritten auszugeben.
  issues:
