  rationale: Die Revision beseitigt zwei im Deutschen naheliegende Missverständnisse, ohne den Sinn oder die rechtlich-eheliche Bildsprache des griechischen Textes zu verändern. Sie erhält die Terminologie „Gesetz“ sowie die kontextuelle, nicht ausdrücklich spezifizierte Reichweite von νόμος.
