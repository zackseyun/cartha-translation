  source_fidelity: Die Satzglieder und die Personifikation der Sünde sind im Entwurf im Wesentlichen zutreffend wiedergegeben. Die wiederholte instrumentale Beziehung zum Gebot wird jedoch am klarsten durch die ausdrückliche Wiederaufnahme von „durch das Gebot“ abgebildet.
  naturalness: „Ergriff durch das Gebot die Gelegenheit“ ist wegen des bestimmten Artikels und der Stellung etwas sperrig. „Ergriff durch das Gebot eine Gelegenheit“ ist idiomatischer. „Durch ebendieses“ wirkt im modernen Standarddeutsch unnötig demonstrativ und gehoben.
  terminology: „Sünde“, „Gebot“, „täuschte“ und „tötete“ sind angemessene, quellennah verständliche Wiedergaben. Die handelnde Rolle der Sünde und die instrumentale Rolle des Gebots bleiben klar unterschieden.
