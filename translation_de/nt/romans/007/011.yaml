  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: de
  text: Denn die Sünde ergriff durch das Gebot eine Gelegenheit, täuschte mich und tötete mich durch das Gebot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorherigen Vers in natürlichem Deutsch.
- source_word: ἡ ἁμαρτία
  choice: die Sünde
  rationale: Die übliche paulinische Bezeichnung bleibt erhalten; zugleich wird die im Satz angelegte Personifikation nicht abgeschwächt.
- source_word: ἀφορμὴν λαβοῦσα
  choice: ergriff … die Gelegenheit
  rationale: Gibt das Ausnutzen einer Gelegenheit oder eines Ansatzpunkts idiomatisch wieder und bewahrt die aktive Rolle der Sünde.
- source_word: διὰ τῆς ἐντολῆς
  choice: durch das Gebot
  rationale: Gibt den instrumentalen Sinn der Präposition wieder und wahrt den Singular.
- source_word: ἐξηπάτησέν με
  choice: täuschte mich
  rationale: Klare, direkte Wiedergabe des Verbs und seines persönlichen Objekts, ohne die mögliche Intensivierung künstlich auszubauen.
- source_word: δι’ αὐτῆς
  choice: durch ebendieses
  rationale: Das neutrale Demonstrativpronomen verweist eindeutig auf das sächliche Substantiv „Gebot“ und wahrt den instrumentalen Sinn.
- source_word: ἀπέκτεινεν
  choice: tötete mich
  rationale: Natürliche und unmittelbare Wiedergabe der tödlichen Wirkung, die Paulus der Sünde zuschreibt.
theological_decisions:
- issue: Grad der Personifikation der Sünde
  choice: Die Sünde bleibt handelndes Subjekt der Verben „ergriff“, „täuschte“ und „tötete“.
  alternative: Die Aussage als unpersönliche Wirkung der Sünde umschreiben.
  rationale: Der griechische Satz stellt die Sünde ausdrücklich als aktiv handelnde Größe dar. Die Übersetzung bewahrt diese rhetorische und theologische Spannung, ohne sie näher auszudeuten.
- issue: Rolle des Gebots beim Töten
  choice: „durch ebendieses“ wahrt das Gebot als Mittel, ohne das Gebot selbst zum handelnden Täter zu machen.
  alternative: „und das Gebot tötete mich“ oder eine erklärende Paraphrase.
  rationale: Grammatisches Subjekt bleibt die Sünde; αὐτῆς verweist auf ἐντολῆς. So bleibt die Unterscheidung zwischen handelnder Sünde und instrumental genanntem Gebot erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und nah am griechischen Gedankengang; „ebendieses“ vermeidet eine missverständliche Wiederholung und macht den Bezug des Pronomens deutlich.
