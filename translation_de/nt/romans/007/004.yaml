id: ROM.7.4
reference: Romans 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: de
  text: Darum seid auch ihr, meine Brüder und Schwestern,[a] durch den Leib des Messias[b] dem Gesetz gegenüber getötet worden, damit ihr einem anderen gehört,[c] nämlich dem, der von den Toten auferweckt worden ist, damit wir für Gott Frucht bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „meine Brüder“; diese Anrede kann auch Frauen einschließen.
    reason: lexical_alternative
  - marker: b
    text: Griechisch Christou; auch mit „Christus“ übersetzbar. „Messias“ gibt hier die Bedeutung des Titels wieder.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „damit ihr eines anderen werdet“. Die Formulierung führt das Ehebild aus dem vorhergehenden Zusammenhang fort.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorhergehenden Vergleich in natürlichem Deutsch.
- source_word: ἀδελφοί μου
  choice: meine Brüder und Schwestern
  rationale: Die maskuline griechische Anrede kann eine gemischte Gemeinschaft einschließen; die inklusive Wiedergabe macht den tatsächlichen Adressatenkreis im heutigen Deutsch deutlich, während die Form des Griechischen in einer Fußnote vermerkt wird.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: seid ... dem Gesetz gegenüber getötet worden
  rationale: Die passive Form von ἐθανατώθητε bleibt erhalten. „Dem Gesetz gegenüber“ verdeutlicht die relationale Kraft des Dativs, ohne sie als bloße Befreiung vom Gesetz auszudeuten.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: durch den Leib des Messias
  rationale: διά mit Genitiv bezeichnet hier das Mittel beziehungsweise die Vermittlung. „Leib“ bewahrt den körperlichen Bezug, und „Messias“ gibt Χριστός als Titel wieder.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: damit ihr einem anderen gehört
  rationale: Die Zweckangabe wird idiomatisch wiedergegeben und setzt zugleich das Ehebild des Zusammenhangs fort.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: dem, der von den Toten auferweckt worden ist
  rationale: Die substantivierte passive Partizipialform und die Auferweckung aus dem Bereich der Toten werden gewahrt.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: damit wir für Gott Frucht bringen
  rationale: Die Zweckbestimmung und das Bild des Fruchtbringens bleiben erhalten; auch der auffällige Wechsel von „ihr“ zu „wir“ wird nicht geglättet.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin den Charakter eines Titels. „Messias“ macht dessen Bedeutung sichtbar; die traditionelle Wiedergabe „Christus“ bleibt als vertretbare Alternative in der Fußnote genannt.
- issue: Beziehung zum Gesetz in ἐθανατώθητε τῷ νόμῳ
  choice: dem Gesetz gegenüber getötet worden
  alternative: dem Gesetz gestorben
  rationale: Die gewählte Form bewahrt sowohl das Passiv als auch die offene relationale Aussage des Dativs und legt nicht genauer fest, wer als Handelnder zu denken ist.
- issue: Ehemetaphorik in γενέσθαι ὑμᾶς ἑτέρῳ
  choice: einem anderen gehört
  alternative: eines anderen werden
  rationale: Die Formulierung hält den Gedanken eines neuen Zugehörigkeitsverhältnisses fest, ohne ihn ausdrücklich als Heirat oder Vereinigung auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der argumentativen Bewegung des griechischen Textes, wurde jedoch so geordnet, dass die beiden Zweckangaben und ihr Wechsel von „ihr“ zu „wir“ verständlich bleiben.
