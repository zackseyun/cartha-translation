id: ROM.7.23
reference: Romans 7:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: de
  text: Doch ich sehe ein anderes Gesetz in meinen Gliedern[a], das gegen das Gesetz meines Verstandes Krieg führt und mich im Gesetz der Sünde gefangen nimmt[b], das in meinen Gliedern ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Gliedern“ sind die Glieder beziehungsweise Teile des Körpers gemeint.
    reason: clarification
  - marker: b
    text: 'Wörtlich: „mich im Gesetz der Sünde gefangen nimmt“. Die Wendung kann die Gefangenschaft im Machtbereich des Gesetzes der Sünde bezeichnen. „Gesetz“ kann bei den wiederholten Vorkommen auch im Sinn von „Prinzip“ oder „Wirkkraft“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: ich sehe
  rationale: Die schlichte Präsensform bewahrt die unmittelbare, anschauliche Wahrnehmung.
- source_word: ἕτερον νόμον
  choice: ein anderes Gesetz
  rationale: Dies wahrt den Kontrast und zugleich die wiederholte Gesetzes-Terminologie des Verses.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: in meinen Gliedern
  rationale: „Glieder“ erhält das konkrete paulinische Körperbild, ohne es verengend mit „Körper“ wiederzugeben.
- source_word: ἀντιστρατευόμενον
  choice: das … Krieg führt
  rationale: Die militärische Bildsprache wird klar und würdig fortgeführt.
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: gegen das Gesetz meines Denkens
  rationale: „Denken“ bezeichnet hier verständlich die vernünftige und willentliche innere Ausrichtung; „Sinn“ wäre im heutigen Deutsch mehrdeutig, „Verstand“ möglicherweise zu eng.
- source_word: αἰχμαλωτίζοντά με
  choice: mich … gefangen hält
  rationale: Die Wiedergabe erhält das Gefangenschaftsbild und passt idiomatisch zur folgenden Wendung mit ἐν.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: im Gesetz der Sünde
  rationale: Die formal naheliegende Wiedergabe bewahrt die griechische Präposition und lässt offen, ob Zugehörigkeit, Herrschaftsbereich oder Mittel betont ist.
- source_word: ἁμαρτίας
  choice: Sünde
  rationale: Dies ist die sachlich genaue und etablierte deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung des wiederholten νόμος
  choice: Alle drei Vorkommen werden mit „Gesetz“ wiedergegeben.
  alternative: Je nach Stelle „Prinzip“, „Macht“ oder „Wirkkraft“.
  rationale: Die Wiederholung ist rhetorisch und theologisch bedeutsam. Eine einheitliche Wiedergabe wahrt die Spannung, statt die Metapher vorzeitig auszulegen.
- issue: Bezug und Sinn von ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: „im Gesetz der Sünde gefangen hält“
  alternative: „unter das Gesetz der Sünde gefangen nimmt“ oder „dem Gesetz der Sünde ausliefert“
  rationale: Die gewählte Fassung folgt eng dem griechischen ἐν und bewahrt dessen mögliche Nuancen; die Fußnote nennt die idiomatischere Deutung als Unterwerfung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung von „Gesetz“ und die militärische Bildfolge von Krieg und Gefangenschaft bleiben erhalten. „Glieder“ ist bewusst bibelsprachlich, aber weiterhin verständlich und wird in der Fußnote erläutert.
