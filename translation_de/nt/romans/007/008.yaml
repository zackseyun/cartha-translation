  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: de
  text: Doch die Sünde ergriff durch das Gebot eine Gelegenheit[a] und bewirkte in mir jedes Begehren.[b] Denn ohne das Gesetz ist die Sünde tot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahm durch das Gebot einen Anlass“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jede Begierde“; im Zusammenhang ist besonders das verbotene Begehren gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: Gelegenheit
  rationale: Das Wort bezeichnet hier einen Anlass oder Ansatzpunkt, den die personifizierte Sünde ausnutzt. „Gelegenheit“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: λαβοῦσα
  choice: ergriff
  rationale: Das Aoristpartizip beschreibt, wie die Sünde die Gelegenheit aktiv an sich nimmt. „Ergriff“ gibt diese zielgerichtete Handlung prägnant wieder.
- source_word: ἡ ἁμαρτία
  choice: die Sünde
  rationale: Die Sünde bleibt wie im Griechischen als handelnde Macht personifiziert.
- source_word: διὰ τῆς ἐντολῆς
  choice: durch das Gebot
  rationale: Der Singular verweist im Zusammenhang auf das zuvor angeführte Gebot; διά mit Genitiv bezeichnet hier das Mittel, dessen sich die Sünde bedient.
- source_word: κατειργάσατο
  choice: bewirkte
  rationale: Das Verb bezeichnet das Hervorbringen eines Ergebnisses. „Bewirkte“ ist klar und erhält die ursächliche Aussage.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: jede Art von Begierde
  rationale: Im unmittelbaren Zusammenhang mit dem Verbot des Begehrens hat ἐπιθυμία eine negative Bedeutung. „Jede Art von“ gibt πᾶσαν idiomatisch wieder, ohne nur eine einzelne Regung zu meinen.
- source_word: χωρὶς γὰρ νόμου
  choice: Denn ohne das Gesetz
  rationale: Die Formulierung ist im Deutschen natürlich und gibt den mit γάρ eingeleiteten Begründungssatz sowie den bestimmten Bezug auf das Gesetz im Kontext wieder.
- source_word: νεκρά
  choice: tot
  rationale: „Tot“ bewahrt Paulus’ zugespitzte Metapher und deutet sie nicht vorschnell als bloße Untätigkeit aus.
theological_decisions:
- issue: Personifizierung der Sünde und Bedeutung von „tot“
  choice: Die Sünde bleibt handelndes Subjekt, und νεκρά wird mit „tot“ wiedergegeben.
  alternative: Die Sünde abstrakt formulieren und „tot“ als „wirkungslos“ oder „inaktiv“ auslegen.
  rationale: Der griechische Text schildert die Sünde als handelnde Macht und verwendet bewusst die starke Todesmetapher. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, ohne unnatürlich zu wirken; die Personifizierung und die Todesmetapher werden unverändert bewahrt.
