id: ROM.7.24
reference: Romans 7:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: de
  text: Was für ein elender Mensch bin ich! Wer wird mich aus diesem Leib des Todes retten?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus dem Leib dieses Todes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „befreien“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: elender
  rationale: „Elend“ vermittelt die tiefe Not und Verzweiflung des Ausrufs kräftig und zugleich in natürlichem, würdigem Deutsch.
- source_word: ἐγὼ ἄνθρωπος
  choice: Mensch bin ich
  rationale: „Mensch“ gibt ἄνθρωπος unmittelbar wieder; die Formulierung bezieht sich durch „ich“ eindeutig auf Paulus, ohne mehr auszusagen als der griechische Text.
- source_word: τίς
  choice: Wer
  rationale: Das persönliche Fragewort fragt nach einem Retter und wird direkt mit „Wer“ wiedergegeben.
- source_word: ῥύσεται
  choice: wird … retten
  rationale: Das Verb bezeichnet die Befreiung aus Gefahr oder Gebundenheit. „Retten“ ist kräftig und allgemein verständlich; „befreien“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: ἐκ
  choice: aus
  rationale: „Aus“ bewahrt das räumlich geprägte Bild der Befreiung aus dem Leib und entspricht der Grundbedeutung der Präposition.
- source_word: σώματος
  choice: Leib
  rationale: „Leib“ bewahrt das konkrete Körperbild und passt in diesem feierlich-ernsten Zusammenhang besser als das im Deutschen mitunter sachlicher klingende „Körper“.
- source_word: τοῦ θανάτου τούτου
  choice: diesem Leib des Todes
  rationale: Die idiomatischere deutsche Wortstellung verbindet das Demonstrativum mit der Gesamtformulierung. Die formal genauere, aber sperrigere Fassung „dem Leib dieses Todes“ wird als Fußnote ausgewiesen.
theological_decisions:
- issue: Bezug des Demonstrativums τούτου in der Schlussformulierung
  choice: diesem Leib des Todes
  alternative: dem Leib dieses Todes
  rationale: Grammatisch bezieht sich τούτου auf „Tod“, doch die streng formale Fassung klingt im heutigen Deutsch ungewöhnlich. Der Haupttext wahrt Bild und Spannung in verständlicher Form; die Fußnote erhält die syntaktisch wörtlichere Möglichkeit.
- issue: Bedeutungsumfang von ῥύσεται
  choice: retten
  alternative: befreien
  rationale: „Retten“ lässt offen, auf welche Weise die Befreiung geschieht, und bewahrt den dringlichen Ton. „Befreien“ ist ebenfalls möglich, darf aber nicht dazu dienen, die im Kontext bestehende theologische Spannung vorzeitig aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, emotional eindringlichem Ton. Der einleitende Ausruf ist natürlich formuliert und bewahrt die Selbstbezeichnung als „elender Mensch“. Das konkrete Bild vom Leib und Tod bleibt stehen, ohne es anthropologisch oder konfessionell auszudeuten.
