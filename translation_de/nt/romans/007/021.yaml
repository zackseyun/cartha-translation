  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: de
  text: 'So finde ich das Gesetz: Wenn ich das Gute tun will, ist das Böse bei mir gegenwärtig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Prinzip« oder »Regel«.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὑρίσκω
  choice: entdecke ich
  rationale: Das Präsens bezeichnet eine gegenwärtige, fortdauernde Erkenntnis; »entdecken« gibt den Erkenntnisvorgang natürlich wieder.
- source_word: ἄρα
  choice: So
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Gedankengang in idiomatischem Deutsch.
- source_word: νόμον
  choice: Gesetz
  rationale: Bewahrt den ausdrücklichen νόμος-Wortlaut und seine Spannung, ohne vorschnell festzulegen, ob hier das mosaische Gesetz oder eine wirksame Regelmäßigkeit gemeint ist.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: Wenn ich das Gute tun will
  rationale: Gibt die schwerfällige griechische Dativkonstruktion klar wieder und bewahrt sowohl den Willensakt als auch das Tun des Guten.
- source_word: τὸ καλὸν
  choice: das Gute
  rationale: Der substantivierte Ausdruck lässt sich im Deutschen natürlich und quellennah mit »das Gute« wiedergeben.
- source_word: τὸ κακὸν
  choice: das Böse
  rationale: Entspricht dem substantivierten Adjektiv und erhält den bewussten Gegensatz zu »das Gute«.
- source_word: παράκειται
  choice: liegt mir nahe
  rationale: Gibt das Bild dessen wieder, was unmittelbar danebenliegt beziehungsweise gegenwärtig und verfügbar ist.
theological_decisions:
- issue: Ob νόμον das mosaische Gesetz oder ein wirksames Prinzip beziehungsweise eine Regelmäßigkeit bezeichnet
  choice: Im Haupttext steht »Gesetz«.
  alternative: »Prinzip« oder »Regel«
  rationale: Paulus verwendet ausdrücklich νόμος. »Gesetz« bewahrt den sprachlichen Anklang und die interpretative Spannung; die möglichen kontextuellen Bedeutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzstellung macht die Folgerung und den Gegensatz klar, ohne die Mehrdeutigkeit von νόμος aufzulösen.
