review_pass:
  verdict: revise
  source_fidelity: Die Schlussfolgerung, der Lebenszeit-Umstand, die rechtliche Freiheit nach dem Tod des Mannes und die zweimalige Bezeichnung als Ehebrecherin sind zutreffend wiedergegeben. „sich mit einem anderen Mann verbindet“ ist jedoch im modernen Deutsch semantisch zu weit und kann jede Art von Verbindung bezeichnen; γίνομαι mit ἀνδρί im vorliegenden ehelichen Rechtsvergleich meint eine Zuordnung als Frau zu einem anderen Mann.
  naturalness: Der Entwurf ist insgesamt verständlich. „vom Gesetz frei“ ist idiomatischer als „von dem Gesetz frei“. Die Formulierung „die Frau eines anderen Mannes wird“ ist klar, modern und im Kontext präziser als „sich verbindet“.
  terminology: „Ehebrecherin“ gibt μοιχαλίς präzise wieder. „Gesetz“ sollte im Haupttext nicht durch „Ehegesetz“ ersetzt werden; die Fußnote erläutert den unmittelbaren Bezug angemessen. Die eheliche Relation bei ἀνδρὶ ἑτέρῳ sollte im Haupttext erkennbar sein, ohne eine konfessionelle Auslegung einzutragen.
