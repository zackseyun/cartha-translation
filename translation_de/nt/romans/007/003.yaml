revisions:
- from: Solange ihr Mann lebt, wird sie also als Ehebrecherin bezeichnet, wenn sie sich mit einem anderen Mann verbindet[a]. Wenn der Mann aber stirbt, ist sie von dem Gesetz[b] frei, sodass sie keine Ehebrecherin ist, wenn sie sich mit einem anderen Mann verbindet.
  to: Also gilt sie, solange ihr Mann lebt, als Ehebrecherin, wenn sie die Frau eines anderen Mannes wird[a]. Stirbt ihr Mann aber, ist sie vom Gesetz[b] frei, sodass sie keine Ehebrecherin ist, wenn sie die Frau eines anderen Mannes wird.
  rationale: Die zentrale idiomatische Wendung γίνομαι mit Dativ wird mit „die Frau eines anderen Mannes wird“ wiedergegeben. Das macht die vom Kontext verlangte eheliche Relation deutlich, ohne den Ausdruck auf einen förmlichen Heiratsakt zu reduzieren. Beide Vorkommen bleiben konsistent; die Fußnotenanker und ihre Zuordnung bleiben vollständig erhalten.
