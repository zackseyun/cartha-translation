reference: Romans 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: de
  text: Also gilt sie, solange ihr Mann lebt, als Ehebrecherin, wenn sie die Frau eines anderen Mannes wird[a]. Stirbt ihr Mann aber, ist sie vom Gesetz[b] frei, sodass sie keine Ehebrecherin ist, wenn sie die Frau eines anderen Mannes wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn sie einem anderen Mann angehört“ oder „wenn sie sich mit einem anderen Mann verbindet“. Gemeint ist im Zusammenhang eine eheliche Zuordnung.'
    reason: lexical_alternative
  - marker: b
    text: „Das Gesetz“ bezieht sich hier zunächst auf die rechtliche Bindung, die für die Ehe gilt.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: also
  rationale: Die Partikelverbindung zieht eine Folgerung aus dem zuvor Gesagten. Die Stellung nach dem vorangestellten Zeitsatz ist im modernen Deutsch natürlich und bewahrt den schlussfolgernden Zusammenhang.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: Solange ihr Mann lebt
  rationale: Der Genitivus absolutus bezeichnet den gleichzeitigen Umstand. Das aus dem Kontext ergänzte Possessivpronomen macht die Beziehung im Deutschen eindeutig.
- source_word: μοιχαλὶς
  choice: Ehebrecherin
  rationale: Das Substantiv bezeichnet ausdrücklich eine Frau, die Ehebruch begeht; „Ehebrecherin“ ist die direkte und präzise deutsche Entsprechung.
- source_word: χρηματίσει
  choice: wird sie … als … bezeichnet
  rationale: Das Verb bedeutet hier, eine Bezeichnung oder einen Status zu tragen. Diese Wiedergabe erhält die futurische Aussage und klingt im Deutschen würdig und verständlich.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: wenn sie sich mit einem anderen Mann verbindet
  rationale: γίνομαι mit Dativ beschreibt hier das Eintreten in eine eheliche oder eheähnliche Verbindung. Die Formulierung wahrt den Beziehungscharakter, ohne das im Griechischen nicht ausdrücklich stehende Wort „Frau“ einzufügen.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: ist sie von dem Gesetz frei
  rationale: Die nahe am Wortlaut bleibende Formulierung bewahrt sowohl den Gedanken der Freiheit als auch Paulus’ mehrdeutige Verwendung von νόμος; der Kontext bestimmt den unmittelbaren Bezug.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: sodass sie keine Ehebrecherin ist
  rationale: Der artikulierte Infinitiv bezeichnet hier Folge oder Ergebnis. „Sodass“ gibt diesen logischen Zusammenhang natürlich wieder.
theological_decisions:
- issue: Reichweite von νόμος
  choice: „das Gesetz“ im Haupttext, mit unmittelbarem Bezug auf die rechtliche Bindung der Ehe
  alternative: „das Ehegesetz“ oder ein umfassender Bezug auf das mosaische Gesetz
  rationale: Der unmittelbare Kontext handelt vom rechtlichen Status der Frau während der Lebenszeit ihres Mannes und nach dessen Tod. Der unverengte Ausdruck „das Gesetz“ bewahrt jedoch Paulus’ Wortlaut und vermeidet eine dogmatische Vorentscheidung.
- issue: Art der Verbindung mit dem anderen Mann
  choice: „sich mit einem anderen Mann verbindet“
  alternative: „einen anderen Mann heiratet“ oder „einem anderen Mann gehört“
  rationale: Der griechische Ausdruck setzt eine eheliche beziehungsweise eheähnliche Zuordnung voraus, benennt aber weder ausdrücklich eine Hochzeit noch rechtfertigt er im modernen Deutsch die potenziell besitzhafte Formulierung „gehört“. Die gewählte Fassung wahrt die Offenheit des Ausdrucks.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt dem Gedankengang des Griechischen, ohne unnötig griechische Syntax nachzuahmen. Beide Vorkommen der Wendung für die Verbindung mit einem anderen Mann werden konsistent übersetzt; alle Fußnotenmarker stehen im Haupttext.
