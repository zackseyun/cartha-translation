id: ROM.7.9
reference: Romans 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: de
  text: Ich war einst ohne das Gesetz am Leben; als aber das Gebot kam, wurde die Sünde lebendig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: lebte die Sünde wieder auf.'
    reason: Lexikalische Alternative zu ἀνέζησεν; das Verb kann ausdrücklich ein Wiederaufleben bezeichnen.
lexical_decisions:
- source_word: ἔζων
  choice: war … am Leben
  rationale: Die prädikative Wiedergabe bewahrt den im Zusammenhang entfalteten Gegensatz von Leben und Tod besser als das bloße „lebte“.
- source_word: χωρὶς νόμου
  choice: ohne das Gesetz
  rationale: „Ohne“ gibt die trennende Bedeutung von χωρίς natürlich wieder; der bestimmte Artikel entspricht im Deutschen dem wahrscheinlichen Bezug auf das mosaische Gesetz.
- source_word: ποτέ
  choice: einst
  rationale: Das knappe Zeitadverb gibt den rückblickenden Sinn idiomatisch und in würdigem modernem Deutsch wieder.
- source_word: ἐλθούσης … τῆς ἐντολῆς
  choice: als aber das Gebot kam
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben; das ereignishafte „Kommen“ bleibt erhalten.
- source_word: ἐντολῆς
  choice: das Gebot
  rationale: „Gebot“ entspricht dem biblischen und paulinischen Sprachgebrauch und wahrt den Bezug zum Gesetz.
- source_word: ἁμαρτία
  choice: die Sünde
  rationale: Der Singular und die Personifizierung der Sünde werden beibehalten.
- source_word: ἀνέζησεν
  choice: wurde … lebendig
  rationale: Die Formulierung erhält das Bild der personifizierten Sünde, die zum Leben kommt, ohne im Haupttext ausdrücklich festzulegen, ob ein Wiederaufleben gemeint ist.
theological_decisions:
- issue: Ob die Ich-Aussage streng autobiografisch, repräsentativ oder heilsgeschichtlich zu verstehen ist
  choice: Die einfache erste Person bleibt ohne deutende Erweiterung erhalten.
  alternative: Ausdrückliche Deutung als persönliche Erfahrung des Paulus oder als stellvertretende Rede Israels beziehungsweise der Menschheit.
  rationale: Der griechische Wortlaut dieses Verses entscheidet die größere Auslegungsfrage nicht; die Übersetzung wahrt daher die Spannung.
- issue: Ob ἀνέζησεν ein erstmaliges Lebendigwerden oder ein Wiederaufleben bezeichnet
  choice: Im Haupttext steht das offenere „wurde … lebendig“.
  alternative: „lebte … wieder auf“
  rationale: Das Verb kann ein Aufleben beziehungsweise Wiederaufleben ausdrücken. Die offenere Hauptübersetzung und die Fußnote bewahren diese lexikalische Spannung.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzstruktur bewahrt den Kontrast der beiden mit δέ verbundenen Aussagen; das erste δέ wird im Deutschen nicht eigens markiert, während das zweite durch „aber“ wiedergegeben wird.
