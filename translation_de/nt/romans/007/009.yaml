  verdict: approve
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Kontrast des griechischen Textes vollständig wieder: ἔζων als „war ... am Leben“, χωρὶς νόμου als „ohne das Gesetz“, ποτέ als „einst“, der Genitivus absolutus als temporales „als ... kam“ und ἡ ἁμαρτία ἀνέζησεν mit beibehaltener Personifikation. Die mögliche Präfixnuance von ἀνά- wird angemessen in der Fußnote kenntlich gemacht, ohne den Haupttext zu überinterpretieren.'
  naturalness: „Ich war einst ohne das Gesetz am Leben; als aber das Gebot kam, wurde die Sünde lebendig“ ist klares, modernes und zugleich bibelangemessen würdiges Standarddeutsch. Die Stellung von „aber“ ist idiomatisch; die Formulierung „wurde ... lebendig“ ist verständlich und wahrt die metaphorische Belebung.
  terminology: „Gesetz“, „Gebot“ und „Sünde“ sind für den paulinischen Kontext sachgerecht und konsistent. Der bestimmte Artikel bei „dem Gesetz“ ist im Deutschen natürlich und legt keine über den Kontext hinausgehende dogmatische Deutung fest.
