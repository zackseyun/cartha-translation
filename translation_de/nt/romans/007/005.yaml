id: ROM.7.5
reference: Romans 7:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: de
  text: Denn als wir im Fleisch[a] waren, wirkten die sündigen Leidenschaften, die durch das Gesetz hervorgerufen wurden, in unseren Gliedern[b], um Frucht für den Tod zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in unserer sündigen Natur«; gemeint sein kann das Leben im gefallenen menschlichen Zustand.'
    reason: alternative_reading
  - marker: b
    text: Mit »Gliedern« sind hier die Teile beziehungsweise Fähigkeiten des Körpers als Werkzeuge des Handelns gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: im Fleisch
  rationale: Bewahrt Paulus’ theologisch vielschichtige Ausdrucksweise und deutet σάρξ nicht vorschnell als eine fest umrissene »sündige Natur« aus.
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: die sündigen Leidenschaften
  rationale: 'Gibt den Genitiv idiomatisch und qualitativ wieder: Gemeint sind von Sünde geprägte Regungen oder Triebe, nicht Leiden.'
- source_word: τὰ διὰ τοῦ νόμου
  choice: die durch das Gesetz hervorgerufen wurden
  rationale: Macht den Bezug auf die Leidenschaften klar und gibt διά als vermittelnde beziehungsweise ursächliche Beziehung wieder. »Hervorgerufen« passt zum Argument des Kontextes, ohne dem Gesetz selbst Sünde zuzuschreiben.
- source_word: ἐνηργεῖτο
  choice: wirkten
  rationale: Das Imperfekt bezeichnet eine fortdauernde Wirksamkeit in der Vergangenheit; der deutsche Plural richtet sich nach »Leidenschaften«.
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: in unseren Gliedern
  rationale: Bewahrt Paulus’ Bild für die Körperteile beziehungsweise körperlichen Fähigkeiten als Werkzeuge des Handelns.
- source_word: εἰς τὸ καρποφορῆσαι τῷ θανάτῳ
  choice: sodass sie dem Tod Frucht brachten
  rationale: Bewahrt das Bild des Fruchtbringens und versteht εἰς τό als Ergebnis beziehungsweise Zielrichtung; der Dativ τῷ θανάτῳ wird formal als »dem Tod« erhalten.
theological_decisions:
- issue: Bedeutung von ἐν τῇ σαρκί
  choice: im Fleisch
  alternative: in unserer sündigen Natur / in unserem gefallenen menschlichen Zustand
  rationale: Die Hauptfassung erhält die paulinische Spannung des Begriffs σάρξ. Die möglichen anthropologischen Deutungen werden in einer Fußnote genannt, statt im Text dogmatisch festgelegt zu werden.
- issue: Verhältnis der sündigen Leidenschaften zum Gesetz
  choice: durch das Gesetz hervorgerufen
  alternative: durch das Gesetz wirksam / die durch das Gesetz kamen
  rationale: Der Ausdruck verdeutlicht die vermittelnde Funktion des Gesetzes im unmittelbaren Gedankengang von Römer 7, ohne zu behaupten, das Gesetz selbst sei sündig. Eine rein formale Wiedergabe wäre im Deutschen unklar.
- issue: Ziel beziehungsweise Ergebnis des Fruchtbringens
  choice: dem Tod Frucht brachten
  alternative: Frucht für den Tod brachten / zum Tod führende Frucht brachten
  rationale: Der Dativ bleibt sichtbar, und die düstere Gegenüberstellung zum Fruchtbringen für Gott in Vers 4 wird gewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Im Fleisch« und »Glieder« bleiben wegen ihrer paulinischen Bildkraft im Haupttext, werden aber erläutert. Der Satzbau folgt dem griechischen Gedankengang, ohne im Deutschen schwerfällig zu wirken.
