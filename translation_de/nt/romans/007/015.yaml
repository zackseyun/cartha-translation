id: ROM.7.15
reference: Romans 7:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: de
  text: 'Denn ich verstehe nicht, was ich tue: Ich tue nämlich nicht das, was ich will, sondern gerade das, was ich hasse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: ich tue
  rationale: Das Verb bezeichnet hier das, was jemand vollbringt oder hervorbringt. Im Deutschen gibt „tun“ den Zusammenhang natürlich wieder und vermeidet eine unnötig technische Formulierung.
- source_word: οὐ γινώσκω
  choice: ich verstehe nicht
  rationale: γινώσκω kann „kennen/erkennen“ bedeuten; im Kontext beschreibt es fehlendes Begreifen des eigenen Handelns. „Ich verstehe nicht“ trifft den Sinn idiomatisch.
- source_word: πράσσω / ποιῶ
  choice: ich tue / ich tue
  rationale: Die griechischen Verben unterscheiden sich leicht im Aspekt und Sprachgebrauch, doch ein belastbarer inhaltlicher Gegensatz ist hier nicht eindeutig. Eine künstliche deutsche Unterscheidung würde mehr suggerieren, als der Text sicher trägt.
- source_word: τοῦτο
  choice: gerade das
  rationale: Die wiederholten Demonstrativpronomen betonen die konkrete Handlung. „Gerade das“ bildet die zugespitzte Schlusswendung natürlich ab.
theological_decisions:
- issue: Bezug und Funktion von γάρ
  choice: „Denn“ leitet die Begründung ein; „nämlich“ entfaltet anschließend, worin das Nichtverstehen besteht.
  alternative: Beide γάρ-Vorkommen mit „denn/weil“ ausdrücklich kausal wiedergeben.
  rationale: Die Übersetzung wahrt die argumentative Funktion beider Partikeln, ohne im Deutschen schwerfällig zu werden. Sie legt nicht zusätzlich fest, welche anthropologische oder heilsgeschichtliche Lage das sprechende Ich beschreibt.
- issue: Identität und geistlicher Zustand des sprechenden Ichs
  choice: Im Vers nicht näher bestimmen.
  alternative: Durch erklärende Zusätze als wiedergeborenen oder unerlösten Menschen kennzeichnen.
  rationale: Der griechische Vers selbst entscheidet diese größere Auslegungsfrage nicht; Zusätze würden eine theologische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Wiederholung von „tun“ bewahrt die eindringliche Selbstwidersprüchlichkeit des griechischen Satzes; der Doppelpunkt macht die erläuternde Struktur transparent.
