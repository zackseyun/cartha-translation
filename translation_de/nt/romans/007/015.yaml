  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: κατεργάζομαι ist mit „was ich tue“ idiomatisch erfasst, οὐ γινώσκω angemessen als „ich verstehe nicht“, und der Kontrast zwischen Wollen, Tun und Hassen bleibt vollständig erhalten. Das zweite γάρ wird mit „nämlich“ plausibel erläuternd wiedergegeben; dies entspricht der argumentativen Funktion, ohne eine überharte deutsche Kausalverknüpfung zu erzwingen.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem Register. Die Wiederholung von „tue“ wirkt hier nicht störend, sondern trägt die im Ausgangstext angelegte eindringliche Spannung. Der Doppelpunkt ist als deutsche Gliederung der anschließenden Erläuterung natürlich.
  terminology: „Verstehe“, „will“, „hasse“ und „tue“ sind treffend, nicht konfessionell aufgeladen und für den Kontext präzise. „Gerade das“ gibt die demonstrative Zuspitzung von τοῦτο sinnvoll wieder.
