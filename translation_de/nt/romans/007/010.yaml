  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: de
  text: Ich aber starb, und gerade dieses zum Leben bestimmte Gebot erwies sich für mich als zum Tod führend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ ἀπέθανον
  choice: Ich aber starb
  rationale: Der Aorist ἀπέθανον bezeichnet die eingetretene Folge unmittelbar als vergangenes Geschehen. Das betonte ἐγώ und das weiterführend-kontrastierende δέ werden mit „Ich aber“ wiedergegeben.
- source_word: εὑρέθη μοι
  choice: erwies sich für mich
  rationale: Diese idiomatische Wiedergabe bewahrt sowohl den passiven Entdeckungscharakter von εὑρέθη als auch den persönlichen Erfahrungsbezug des Dativs μοι, ohne im Deutschen hölzern zu klingen.
- source_word: ἡ ἐντολή
  choice: dieses Gebot
  rationale: „Gebot“ ist die übliche und kontextgerechte Wiedergabe des singularischen ἐντολή. „Dieses“ nimmt das nachgestellte Demonstrativpronomen αὕτη auf.
- source_word: ἡ εἰς ζωὴν αὕτη
  choice: gerade dieses Gebot, das zum Leben führen sollte
  rationale: „Gerade dieses“ gibt die hervorhebende Kraft von αὕτη wieder. Die Formulierung „zum Leben führen sollte“ drückt die Ziel- oder Ergebnisrichtung von εἰς ζωήν verständlich aus, ohne zu behaupten, das Gebot habe tatsächlich Leben hervorgebracht.
- source_word: εἰς θάνατον
  choice: als Weg zum Tod
  rationale: Die Formulierung erhält die Richtungsangabe „zum Tod“ und macht die prädikative Konstruktion im Deutschen idiomatisch. Der bewusste Gegensatz zwischen Leben und Tod bleibt deutlich.
theological_decisions:
- issue: Ob das Gebot ausdrücklich als Ursache des Todes dargestellt werden soll
  choice: „erwies sich für mich als Weg zum Tod“
  alternative: „brachte mir den Tod“
  rationale: Der griechische Text beschreibt, als was sich das Gebot für Paulus erwies, ohne hier die Kausalität näher auszudeuten. Die neutralere Formulierung bewahrt die theologische Spannung des Zusammenhangs.
- issue: Wie die Zielrichtung εἰς ζωήν verstanden werden soll
  choice: „das zum Leben führen sollte“
  alternative: „das zum Leben bestimmt war“
  rationale: Die gewählte Fassung lässt offen, ob vor allem Zweck, Richtung oder erwartetes Ergebnis gemeint ist, und vermeidet eine unnötig starke Aussage über eine ausdrücklich erklärte göttliche Bestimmung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die zugespitzte Gegenüberstellung „Leben – Tod“ und der persönliche Erfahrungsbezug bleiben erhalten.
