revisions:
- from: Ich aber starb, und gerade dieses Gebot, das zum Leben führen sollte, erwies sich für mich als Weg zum Tod.[a]
  to: Ich aber starb, und gerade dieses zum Leben bestimmte Gebot erwies sich für mich als zum Tod führend.
  rationale: Die Revision entfernt die zusätzliche Weg-Metapher und ersetzt die hypothetisch klingende Umschreibung durch eine idiomatische Wiedergabe der Zielrichtung. „Gerade dieses“ bewahrt die Hervorhebung von αὕτη; „zum Leben“ und „zum Tod führend“ erhalten den rhetorischen Kontrast des griechischen Textes.
