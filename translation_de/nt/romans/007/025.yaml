  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: de
  text: Dank sei Gott durch Jesus, den Messias, unseren Herrn! Demnach diene ich selbst mit dem Verstand dem Gesetz Gottes, mit dem Fleisch[a] aber dem Gesetz der Sünde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der sündigen Natur“ statt „mit dem Fleisch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Prinzip der Sünde“ statt „dem Gesetz der Sünde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Dank sei Gott
  rationale: Die exklamative Wendung mit dem Dativ bezeichnet hier idiomatisch den Dank an Gott, nicht die Gnade als Eigenschaft oder Gabe.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: durch Jesus, den Messias, unseren Herrn
  rationale: διά mit Genitiv wird mit „durch“ wiedergegeben. Χριστός wird als Titel „Messias“ übersetzt; die Apposition ist im Deutschen durch Kommas natürlich und eindeutig.
- source_word: Ἄρα οὖν
  choice: Demnach
  rationale: Die beiden Folgerungspartikeln leiten eine zusammenfassende Schlussfolgerung ein; „Demnach“ gibt diese Funktion knapp und in gehobenem, modernem Deutsch wieder.
- source_word: αὐτὸς ἐγώ
  choice: ich selbst
  rationale: Die betonte Verbindung hebt die eigene Person des Sprechers hervor.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: mit dem Verstand ... mit dem Fleisch aber
  rationale: Die parallelen Dative werden instrumental als die jeweiligen Bereiche oder Vermögen des Dienens wiedergegeben; μέν ... δέ erscheint als klare Gegenüberstellung.
- source_word: δουλεύω
  choice: diene
  rationale: „Dienen“ ist idiomatisch und wahrt zugleich den Sinn der Unterordnung; die mögliche stärkere Sklavereimetaphorik wird nicht überbetont.
- source_word: νόμῳ θεοῦ ... νόμῳ ἁμαρτίας
  choice: dem Gesetz Gottes ... dem Gesetz der Sünde
  rationale: Die Wiederholung von νόμος bleibt erhalten und bewahrt den bewusst gesetzten Parallelismus.
- source_word: σαρκί
  choice: Fleisch
  rationale: „Fleisch“ bewahrt den paulinischen Ausdruck und seine anthropologische wie theologische Spannung, ohne ihn vorschnell als „sündige Natur“ auszulegen.
theological_decisions:
- issue: Bedeutung von σάρξ im moralisch geprägten Kontext
  choice: Fleisch
  alternative: sündige Natur
  rationale: Der griechische Text nennt σάρξ und nicht ausdrücklich eine sündige Wesensart. „Fleisch“ hält die Spannung im Verhältnis von Verstand, Sünde und leiblich-menschlicher Existenz offen.
- issue: Bedeutung von νόμος in „νόμος der Sünde“
  choice: Gesetz der Sünde
  alternative: Prinzip der Sünde
  rationale: „Gesetz“ erhält die lexikalische Wiederholung und den Kontrast zum „Gesetz Gottes“; „Prinzip“ wäre bereits eine interpretierende Eingrenzung.
- issue: Titel Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Titelgehalt von Χριστός wird transparent wiedergegeben, ohne die im Deutschen ebenfalls traditionelle Namensform „Christus“ in den Haupttext zu übernehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus des griechischen Schlusssatzes und der Gegensatz zwischen Verstand und Fleisch bleiben sichtbar. Die Wortstellung vermeidet unnötige Archaismen, erhält aber den feierlichen Ausruf zu Beginn.
