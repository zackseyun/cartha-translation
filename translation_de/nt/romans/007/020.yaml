  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: de
  text: Wenn ich aber das tue, was ich nicht will, dann bewirke nicht mehr ich es[a], sondern die Sünde, die in mir wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollbringe nicht mehr ich es“.'
    reason: Lexikalische Alternative für κατεργάζομαι; „vollbringen“ betont stärker das Ausführen beziehungsweise Zustandebringen.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn … aber
  rationale: Gibt die Bedingung mit einem milden Gegensatz wieder und führt die Argumentation natürlich fort.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: ich das tue, was ich nicht will
  rationale: Bewahrt die relative Zuordnung des griechischen Satzes in klarem, heutigem Deutsch.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: dann bewirke nicht mehr ich es
  rationale: „Nicht mehr“ entspricht οὐκέτι; die Stellung von „ich“ erhält dessen ausdrückliche Hervorhebung. „Bewirken“ unterscheidet κατεργάζομαι vom vorherigen ποιῶ („tun“) und bezeichnet das Hervorbringen der Handlung.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: die Sünde, die in mir wohnt
  rationale: Bewahrt die personifizierende Rede von der Sünde und gibt das Partizip οἰκοῦσα natürlich als Relativsatz wieder.
theological_decisions:
- issue: Das Verhältnis zwischen dem handelnden „Ich“ und der in ihm wohnenden Sünde
  choice: Paulus’ zugespitzte Unterscheidung zwischen „ich“ und „der Sünde, die in mir wohnt“ bleibt unverändert stehen.
  alternative: Die Aussage durch eine erklärende Umschreibung abschwächen oder „Sünde“ als „sündige Natur“ wiedergeben.
  rationale: Der griechische Text nennt ausdrücklich ἁμαρτία („Sünde“) und lässt die Spannung hinsichtlich persönlicher Verantwortlichkeit und innewohnender Sünde bestehen; die Übersetzung soll sie nicht lehrmäßig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bewirken“ erhält den Unterschied zwischen ποιῶ und κατεργάζομαι, ohne den Satz unnötig fachsprachlich zu machen.
