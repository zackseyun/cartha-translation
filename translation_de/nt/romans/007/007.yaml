source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: de
  text: 'Was sollen wir nun sagen? Ist das Gesetz Sünde? Auf keinen Fall! Im Gegenteil: Ohne das Gesetz hätte ich die Sünde nicht erkannt. Denn ich hätte die Begierde[a] nicht erkannt, wenn das Gesetz nicht gesagt hätte: »Du sollst nicht begehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Verlangen. Das griechische Wort kann allgemein ein Verlangen bezeichnen; das unmittelbar folgende Gebot legt hier jedoch die spezifischere Bedeutung »Begierde« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Was sollen wir nun sagen?
  rationale: Gibt Paulus’ rhetorische Übergangsformel in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Der bestimmte Artikel und der Zusammenhang weisen auf das mosaische Gesetz; die übliche paulinische Bezeichnung bleibt erhalten.
- source_word: ἁμαρτία
  choice: Sünde
  rationale: Bewahrt die direkte theologische Gleichsetzung, die Paulus in seiner Frage entschieden zurückweist.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Eine kräftige, idiomatische Zurückweisung, die stärker ist als ein schlichtes »Nein«.
- source_word: ἀλλὰ
  choice: Im Gegenteil
  rationale: Markiert den starken korrigierenden Gegensatz nach der Zurückweisung.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: Ohne das Gesetz hätte ich die Sünde nicht erkannt
  rationale: Gibt die ausschließende Bedingung natürlich und präzise wieder; »erkannt« kann sowohl Kenntnis als auch Einsicht in den Charakter der Sünde ausdrücken.
- source_word: ἐπιθυμίαν
  choice: Begierde
  rationale: Der unmittelbar folgende Wortlaut des Gebots legt hier die negative Bedeutung des begehrlichen Verlangens nahe, obwohl das griechische Wort allgemein auch »Verlangen« bedeuten kann.
- source_word: οὐκ ᾔδειν
  choice: hätte ich nichts gewusst
  rationale: Bewahrt gegenüber ἔγνων den Wechsel zu einem Verb des Wissens und ergibt im Deutschen eine natürliche Formulierung.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Du sollst nicht begehren
  rationale: Entspricht der rechtlichen Kraft des Verbots und der im Deutschen vertrauten Form des Gebots.
theological_decisions:
- issue: Verhältnis von Gesetz und Sünde
  choice: Ist das Gesetz Sünde? Auf keinen Fall!
  alternative: Ist das Gesetz sündig? Keineswegs!
  rationale: Das griechische Prädikatsnomen fragt schärfer nach einer Gleichsetzung des Gesetzes mit der Sünde, nicht lediglich nach einer sündigen Eigenschaft des Gesetzes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Ton. Die bekannte Gebotsformulierung wird beibehalten; die beiden griechischen Verben für Erkennen und Wissen werden im Deutschen unterschieden.
