  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: de
  text: Denn nicht das Gute, das ich will, tue ich, sondern das Böse, das ich nicht will, das tue ich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verwendet im zweiten Satzteil ein anderes Verb als zuvor. Die Bedeutungsbereiche überschneiden sich jedoch weitgehend; beide sind hier mit „tue“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: will
  rationale: „Wollen“ gibt die bewusste Ausrichtung des Willens im modernen Deutschen natürlich wieder, ohne den Ausdruck unnötig zu philosophisieren.
- source_word: ποιῶ
  choice: tue
  rationale: „Tun“ ist die schlichte und direkte Entsprechung; zugleich bleibt ein sprachlicher Unterschied zum späteren πράσσω erhalten.
- source_word: ἀγαθόν
  choice: das Gute
  rationale: Die substantivierte Form bewahrt die gewichtige moralische Kategorie und bildet den Parallelismus zu „das Böse“ ab.
- source_word: κακὸν
  choice: das Böse
  rationale: „Das Böse“ erhält die starke ethische Gegenüberstellung des griechischen Textes und schwächt sie nicht zu bloß „dem Schlechten“ ab.
- source_word: πράσσω
  choice: vollbringe
  rationale: „Vollbringen“ bezeichnet das tatsächliche Ausführen und unterscheidet sich von ποιῶ, ohne einen zwingenden Gedanken gewohnheitsmäßiger Praxis einzutragen.
- source_word: τοῦτο
  choice: genau das
  rationale: „Genau das“ macht die hervorgehobene rückverweisende Funktion des Demonstrativpronomens im natürlichen Deutschen deutlich.
- source_word: οὐ γὰρ
  choice: Denn nicht
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorausgehenden Gedankengang; die Stellung von „nicht“ erhält den Kontrastfokus.
theological_decisions:
- issue: Stärke des moralischen Gegensatzes
  choice: „das Gute“ / „das Böse“
  alternative: „das Richtige“ / „das Falsche“ oder „das Gute“ / „das Schlechte“
  rationale: Die griechischen Ausdrücke tragen hier einen deutlichen moralischen Gehalt. Die kräftige Gegenüberstellung sollte nicht pragmatisch oder umgangssprachlich abgeschwächt werden.
- issue: Möglicher Unterschied zwischen ποιῶ und πράσσω
  choice: Die Verben mit „tun“ und „vollbringen“ unterscheiden, ohne daraus eine feste theologische Abstufung abzuleiten.
  alternative: Beide Verben mit „tun“ wiedergeben oder πράσσω als „praktizieren“ übersetzen.
  rationale: Die Bedeutungsfelder überschneiden sich erheblich. Ein leichter deutscher Unterschied bildet den griechischen Wechsel ab, darf aber weder Gewohnheitsmäßigkeit noch eine besondere moralpsychologische Theorie erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem pointierten Gegensatz des griechischen Textes; der Gedankenstrich hebt den nachgestellten demonstrativen Ausdruck hervor. Die moralischen Kategorien und die Spannung zwischen Wollen und Handeln bleiben unaufgelöst.
