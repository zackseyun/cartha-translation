id: ROM.7.12
reference: Romans 7:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: de
  text: Somit ist das Gesetz heilig, und das Gebot ist heilig, gerecht und gut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Somit
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Argumentation und klingt im modernen Standarddeutsch natürlich und würdig.
- source_word: νόμος
  choice: das Gesetz
  rationale: Bewahrt Paulus’ Formulierung, ohne den in diesem Zusammenhang naheliegenden Bezug auf das mosaische Gesetz ausdrücklich enger festzulegen.
- source_word: ἅγιος
  choice: heilig
  rationale: Gibt sowohl die Zugehörigkeit zu Gott als auch die sittliche Reinheit angemessen wieder und entspricht dem wiederholten griechischen Ausdruck.
- source_word: ἐντολή
  choice: das Gebot
  rationale: Bezeichnet hier ein bestimmtes Gebot innerhalb des Gesetzes; „Gebot“ ist im Deutschen präzise und geläufig.
- source_word: δικαία
  choice: gerecht
  rationale: Bewahrt die moralische Bewertung des Gebots und den paulinischen Wortzusammenhang von Gerechtigkeit.
- source_word: ἀγαθή
  choice: gut
  rationale: Gibt die sittliche Güte und den positiven Charakter des Gebots ohne interpretierende Erweiterung wieder.
- source_word: μὲν
  choice: nicht gesondert wiedergegeben
  rationale: Die Partikel setzt eine leichte Hervorhebung, besitzt hier aber kein ausdrückliches Gegenstück mit δέ; eine eigene Wiedergabe wäre im Deutschen unnötig schwerfällig.
theological_decisions:
- issue: Bezug von νόμος
  choice: „das Gesetz“ ohne nähere Bestimmung
  alternative: „das mosaische Gesetz“ oder „die Tora“
  rationale: Der Kontext legt das mosaische Gesetz nahe, doch der Vers selbst formuliert allgemeiner. Die Übersetzung bewahrt diese sprachliche Offenheit und vermeidet eine erklärende Einengung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Wiederholung von „heilig“ bleibt erhalten, ebenso die knappe dreifache Bewertung des Gebots.
