source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: de
  text: Denn wir wissen, dass das Gesetz geistlich ist; ich aber bin fleischlich[a], an die Sünde verkauft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Fleisch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Sklave unter die Herrschaft der Sünde verkauft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: wir wissen
  rationale: Gibt die gemeinsame, als feststehend vorausgesetzte Erkenntnis unmittelbar und natürlich wieder.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Entspricht der bestimmten griechischen Formulierung; im Römerbrief ist damit in diesem Zusammenhang das mosaische Gesetz gemeint.
- source_word: πνευματικός
  choice: geistlich
  rationale: Bewahrt den knappen Gegensatz zu σάρκινος und bezeichnet die Zugehörigkeit beziehungsweise Entsprechung zum Bereich des Geistes, ohne dies stärker auszudeuten.
- source_word: σάρκινός
  choice: fleischlich
  rationale: Gibt das Adjektiv sachnah wieder, erhält den Wortfeldkontrast zu „geistlich“ und vermeidet die weitergehende Deutung „von sündiger Natur“.
- source_word: πεπραμένος
  choice: verkauft
  rationale: Das Perfektpartizip bezeichnet einen durch Verkauf entstandenen Zustand; „verkauft“ bewahrt das prägnante Bild.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: unter die Sünde
  rationale: Folgt der ungewöhnlichen, aber verständlichen griechischen Unterwerfungsmetapher und lässt die Herrschaft der Sünde anklingen, ohne sie im Haupttext auszuschreiben.
theological_decisions:
- issue: Wie stark die Aussage „ich bin fleischlich“ anthropologisch auszudeuten ist
  choice: Die Fleisch-Terminologie bleibt als „fleischlich“ erhalten.
  alternative: „sündig“, „von sündiger Natur“ oder „ungeistlich“
  rationale: Der griechische Ausdruck bezeichnet nicht ausdrücklich eine „sündige Natur“. Die gewählte Fassung bewahrt die Spannung zwischen dem geistlichen Gesetz und dem fleischlichen Ich, ohne eine spätere Lehrformel einzutragen.
- issue: Wie ausdrücklich das Sklavereibild in πεπραμένος wiederzugeben ist
  choice: Im Haupttext steht knapp „unter die Sünde verkauft“; die Versklavungsnuance wird in einer Fußnote erläutert.
  alternative: „als Sklave unter die Herrschaft der Sünde verkauft“
  rationale: Die knappe Hauptfassung entspricht Form und Bild des Griechischen. Zugleich macht die Fußnote deutlich, dass Verkauf in die Sklaverei und Unterwerfung unter die Macht der Sünde gemeint sein können.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gegensatz, während „Denn wir wissen“ und „ich aber“ im Deutschen natürlich klingen. Die markierten Fußnoten stehen jeweils unmittelbar am erklärten Ausdruck.
