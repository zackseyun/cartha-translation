  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: de
  text: Nun aber bin nicht mehr ich es[a], der es tut, sondern die Sünde, die in mir wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nun aber vollbringe nicht mehr ich es, sondern die in mir wohnende Sünde.«'
    reason: Alternative, stärker am griechischen Satzbau und an der partizipialen Form orientierte deutsche Wiedergabe.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Doch nun
  rationale: Kennzeichnet den folgernden und zugleich kontrastierenden Übergang vom vorher Gesagten in natürlichem, gehobenem Deutsch.
- source_word: οὐκέτι ἐγὼ
  choice: nicht mehr ich
  rationale: Bewahrt die betonte Stellung des ausdrücklichen Pronomens ἐγώ und die scharfe Gegenüberstellung mit der Sünde.
- source_word: κατεργάζομαι
  choice: vollbringe
  rationale: Gibt das bewusste Ausführen beziehungsweise Bewirken der zuvor genannten Handlung wieder und wahrt den etwas gewichtigen Ton des griechischen Verbs.
- source_word: αὐτό
  choice: es
  rationale: Verweist knapp und natürlich auf das zuvor erwähnte Tun zurück.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: die in mir wohnende Sünde
  rationale: Bewahrt die partizipiale Form, den bestimmten Artikel und die anschauliche Personifikation der Sünde.
theological_decisions:
- issue: Die scharfe Unterscheidung zwischen dem »Ich« und der in ihm wohnenden Sünde könnte als Leugnung persönlicher Verantwortung missverstanden werden.
  choice: Die im griechischen Text vorhandene Gegenüberstellung bleibt ohne erklärende Abschwächung erhalten.
  alternative: Den Satz als bloße Beschreibung eines inneren Konflikts umschreiben oder ausdrücklich um einen Hinweis auf fortbestehende Verantwortung ergänzen.
  rationale: Der Vers formuliert die Spannung selbst bewusst scharf; eine erläuternde Glättung würde mehr festlegen, als der Wortlaut an dieser Stelle sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vollbringe« und »wohnende« erhalten den gewichtigen Ton und die Bildsprache des Ausgangstextes, ohne altertümlich zu wirken.
