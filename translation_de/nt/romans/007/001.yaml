id: ROM.7.1
reference: Romans 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: de
  text: Oder wisst ihr nicht, Brüder und Schwestern[a] – ich spreche ja zu Menschen, die das Gesetz kennen –, dass das Gesetz über einen Menschen herrscht, solange er lebt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“. Das griechische Wort kann in einer solchen Anrede Männer und Frauen einschließen.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: Oder
  rationale: Bewahrt den argumentativen Anschluss an den vorhergehenden Gedankengang.
- source_word: ἀγνοεῖτε
  choice: wisst ihr nicht
  rationale: Gibt die rhetorische Frage natürlich wieder und wahrt den Appell an gemeinsames Wissen.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline Plural bezeichnet in dieser Anrede die Glaubensgeschwister der gemischten römischen Gemeinde; die inklusive Bedeutung wird im modernen Deutschen ausdrücklich wiedergegeben.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: ich spreche ja zu Menschen, die das Gesetz kennen
  rationale: Das eingeschobene γάρ wird mit „ja“ wiedergegeben; die Formulierung bleibt klar und idiomatisch.
- source_word: νόμον / ὁ νόμος
  choice: das Gesetz
  rationale: Die einheitliche Wiedergabe lässt offen, ob hier vor allem das mosaische Gesetz oder Gesetz als allgemeiner Rechtsgrundsatz im Blick steht.
- source_word: κυριεύει
  choice: herrscht über
  rationale: Bewahrt den starken Gedanken von Herrschaft beziehungsweise Verfügungsgewalt, ohne ihn auf eine schwächere bloße Zuständigkeit zu reduzieren.
- source_word: τοῦ ἀνθρώπου
  choice: einen Menschen
  rationale: ἄνθρωπος ist hier allgemein und nicht geschlechtsspezifisch gebraucht.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: solange er lebt
  rationale: Gibt die zeitliche Begrenzung knapp und idiomatisch wieder; „er“ nimmt im Deutschen grammatisch „einen Menschen“ auf.
theological_decisions:
- issue: Bedeutungsumfang von νόμος
  choice: das Gesetz
  alternative: das mosaische Gesetz; Gesetz als allgemeiner Rechtsgrundsatz
  rationale: Der Kontext legt das mosaische Gesetz nahe, doch die Aussage ist allgemein formuliert. Die Übersetzung wahrt diese Spannung.
- issue: Stärke von κυριεύει
  choice: herrscht über
  alternative: hat Gewalt über; hat Autorität über
  rationale: „Herrscht über“ erhält den Herrschaftscharakter des Verbs und bleibt zugleich verständliches, würdiges Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erklärende Einschub wird durch Gedankenstriche kenntlich gemacht; die rhetorische Satzstruktur des Griechischen bleibt erhalten.
