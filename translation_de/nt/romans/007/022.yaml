  yaml_path: translation/nt/romans/007/022.yaml
  text: For I delight in the law of God in my inner man,[a]
translation:
  language: de
  text: Denn dem inneren Menschen nach habe ich Freude am Gesetz Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meinem Innersten“ oder „meinem inneren Wesen nach“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήδομαι
  choice: habe ich Freude an
  rationale: Die Wendung gibt freudige Zustimmung und Wohlgefallen wieder, nicht bloß verstandesmäßige Übereinstimmung.
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: am Gesetz Gottes
  rationale: „Gesetz“ bewahrt den etablierten paulinischen Sprachgebrauch und das theologische Gewicht; der Genitiv wird im Deutschen natürlich mit „Gottes“ wiedergegeben.
- source_word: κατὰ τὸν ἔσω ἄνθρωπον
  choice: meinem inneren Menschen nach
  rationale: Diese Formulierung bildet κατά eng mit „nach“ ab, bewahrt das paulinische Bild vom „inneren Menschen“ und macht durch den Dativ den Bezug auf das sprechende Ich idiomatisch deutlich, ohne ein eigenes Possessivpronomen als separates Inhaltselement hinzuzufügen.
theological_decisions:
- issue: Anthropologische Bedeutung von „der innere Mensch“
  choice: Das paulinische Bild wird als „meinem inneren Menschen nach“ beibehalten, ohne daraus ein technisches Modell der menschlichen Zusammensetzung abzuleiten.
  alternative: „in meinem Innersten“ oder „meinem inneren Wesen nach“
  rationale: Die bildhafte und theologisch spannungsreiche Ausdrucksweise des griechischen Textes bleibt erhalten; verständlichere Deutungen werden nur als Fußnotenalternativen genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die relativ formale Wendung „meinem inneren Menschen nach“ ist bewusst gewählt, um κατὰ und das paulinische Menschenbild quellennah wiederzugeben.
