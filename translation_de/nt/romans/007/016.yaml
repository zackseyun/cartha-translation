id: ROM.7.16
reference: Romans 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: de
  text: Wenn ich aber tue, was ich nicht will, stimme ich dem Gesetz zu, dass es gut ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn … aber
  rationale: Bewahrt die Bedingung von εἰ und gibt die leicht kontrastive beziehungsweise weiterführende Funktion von δέ in natürlichem Deutsch wieder.
- source_word: ὃ … τοῦτο
  choice: das …, was
  rationale: Die korrelative Konstruktion wird im Deutschen idiomatisch als »das, was« wiedergegeben; »gerade« hebt das im Griechischen vorangestellte τοῦτο natürlich hervor.
- source_word: θέλω
  choice: will
  rationale: »Will« ist hier die direkte, geläufige Wiedergabe des inneren Wollens, das dem tatsächlichen Tun gegenübersteht.
- source_word: ποιῶ
  choice: tue
  rationale: Das schlichte Präsens entspricht der unkomplizierten Ausdrucksweise des griechischen Verbs.
- source_word: σύμφημι
  choice: stimme … zu
  rationale: Die Formulierung gibt die Zustimmung zum Urteil des Gesetzes wieder und verbindet sich natürlich mit dem Dativ »dem Gesetz«.
- source_word: τῷ νόμῳ
  choice: dem Gesetz
  rationale: Der bestimmte Artikel bezeichnet das bereits bekannte Gesetz; die Übersetzung vermeidet eine erläuternde Präzisierung, die über den Vers hinausginge.
- source_word: καλός
  choice: gut
  rationale: »Gut« ist die direkte und sachlich offene Wiedergabe der positiven Bewertung des Gesetzes.
theological_decisions:
- issue: Ob Paulus hier das Gesetz selbst ausdrücklich positiv bewertet
  choice: »stimme ich dem Gesetz zu, dass es gut ist«
  alternative: »gebe ich dem Gesetz recht«
  rationale: Die gewählte Fassung bewahrt sowohl die Zustimmung zum Gesetz als auch die ausdrückliche Aussage ὅτι καλός, ohne die Spannung zwischen Wollen und Tun aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, klingt aber idiomatisch; »gerade« macht die Hervorhebung der korrelativen Konstruktion verständlich, ohne zusätzliche Deutung einzuführen.
