id: ROM.12.9
reference: Romans 12:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: de
  text: Die Liebe sei ohne Heuchelei.[a] Verabscheut das Böse; haltet am Guten fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Liebe sei aufrichtig.“ Wörtlich lautet das Griechische: „Die Liebe ohne Heuchelei.“'
    reason: Lexikalische Alternative und Hinweis auf den verblosen griechischen Wortlaut.
lexical_decisions:
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die natürliche und sachlich breite deutsche Entsprechung und bewahrt den ethischen Gehalt des Begriffs.
- source_word: ἀνυπόκριτος
  choice: ohne Heuchelei
  rationale: Die Wendung gibt den konkreten Sinn „nicht geheuchelt, nicht gespielt“ transparent wieder; die glattere Alternative „aufrichtig“ steht in der Fußnote.
- source_word: ἀποστυγοῦντες
  choice: verabscheut
  rationale: Das Verb bezeichnet starke Abneigung. „Verabscheut“ bewahrt diese Intensität in natürlichem modernem Deutsch.
- source_word: τὸ πονηρόν
  choice: das Böse
  rationale: Das substantivierte sächliche Adjektiv bezeichnet das Böse als umfassende moralische Kategorie, ohne es auf einzelne Taten einzuengen.
- source_word: κολλώμενοι
  choice: haltet ... fest
  rationale: Die Wendung drückt enge, beharrliche Bindung aus. „Am Guten festhalten“ ist idiomatisch und erhält den nachdrücklichen Sinn.
- source_word: τῷ ἀγαθῷ
  choice: am Guten
  rationale: Das substantivierte sächliche Adjektiv bildet den klaren Gegenpol zu „dem Bösen“ und bewahrt die breite moralische Bedeutung.
theological_decisions:
- issue: Aussagekraft des verblosen Anfangssatzes und der Partizipien im ermahnenden Zusammenhang
  choice: Der Anfang wird mit „sei“ und die Partizipien werden als direkte Aufforderungen wiedergegeben.
  alternative: „Liebe ohne Heuchelei, das Böse verabscheuend, dem Guten anhangend.“
  rationale: Der Zusammenhang von Römer 12 ist eine Folge von Ermahnungen. Die imperativische Wiedergabe vermittelt diese Funktion in natürlichem Deutsch, ohne eine besondere Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Aufforderungen und der starke Gegensatz zwischen dem Bösen und dem Guten bleiben erhalten.
