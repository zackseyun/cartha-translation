id: ROM.12.8
reference: Romans 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: de
  text: wer ermahnt[a], soll sich dem Ermahnen widmen; wer mit anderen teilt[b], soll es großzügig[c] tun; wer leitet[d], mit Eifer[e]; wer Barmherzigkeit übt, mit Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer ermutigt, soll sich dem Ermutigen widmen“. Das griechische Wortpaar kann sowohl Ermahnung als auch Ermutigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wer gibt“ beziehungsweise „wer etwas beisteuert“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aufrichtig“, „ohne Hintergedanken“ oder „in Schlichtheit“. Das griechische Wort kann sowohl Großzügigkeit als auch eine ungeteilte, aufrichtige Haltung bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „wer vorsteht“ beziehungsweise „wer verwaltet“.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: „mit Sorgfalt“ beziehungsweise „mit Ernsthaftigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: wer … soll
  rationale: Die elliptische Aufzählung aus dem vorhergehenden Vers wird im Deutschen durch eine knappe Zuordnung von Gabe und Ausübung wiedergegeben. Das ergänzte „soll“ macht den Satz verständlich, ohne eine zusätzliche Bedingung einzuführen.
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: wer ermahnt … dem Ermahnen
  rationale: Die Wiedergabe hält die Wortverwandtschaft des griechischen Verbs und Substantivs sichtbar. „Ermahnen“ trifft hier das aktive Zureden; die ebenfalls mögliche Bedeutung „ermutigen“ bleibt in der Fußnote erhalten.
- source_word: ὁ μεταδιδοὺς
  choice: wer mit anderen teilt
  rationale: Das Partizip bezeichnet das Weitergeben beziehungsweise Teilen eigener Mittel. Die Formulierung ist gegenwärtig und lässt offen, ob Geld, Besitz oder andere Güter gemeint sind.
- source_word: ἐν ἁπλότητι
  choice: großzügig
  rationale: Beim Teilen von Mitteln ist „großzügig“ kontextuell am wahrscheinlichsten. Die Grundvorstellung von Einfalt, ungeteilter Haltung oder Aufrichtigkeit wird als echte Bedeutungsalternative vermerkt.
- source_word: ὁ προϊστάμενος
  choice: wer leitet
  rationale: „Leiten“ gibt die Ausübung von Leitung oder Aufsicht allgemein wieder und legt kein bestimmtes kirchliches Amt fest.
- source_word: ἐν σπουδῇ
  choice: mit Eifer
  rationale: σπουδή bezeichnet Eifer, Ernsthaftigkeit und gewissenhafte Sorgfalt. „Mit Eifer“ bewahrt die innere Einsatzbereitschaft des Ausdrucks.
- source_word: ὁ ἐλεῶν
  choice: wer Barmherzigkeit übt
  rationale: Die aktive Formulierung entspricht dem Partizip und bezeichnet tätiges Erbarmen, nicht nur eine innere Haltung.
- source_word: ἐν ἱλαρότητι
  choice: mit Freude
  rationale: ἱλαρότης bezeichnet eine freudige, bereitwillige Haltung. „Mit Freude“ ist natürliches modernes Deutsch und passt zur tätigen Barmherzigkeit.
theological_decisions:
- issue: Reichweite von ὁ προϊστάμενος
  choice: allgemein als „wer leitet“ wiedergegeben
  alternative: „wer vorsteht“, „wer verwaltet“ oder die Bezeichnung eines bestimmten Gemeindeamtes
  rationale: Der Text nennt Gnadengaben in allgemeinen Partizipialformen und verwendet keine ausdrückliche Amtsbezeichnung. Die offene Wiedergabe vermeidet es, eine bestimmte Gemeindeverfassung in den Vers hineinzulesen.
- issue: Bedeutung von ἁπλότης beim Teilen
  choice: „großzügig“
  alternative: „aufrichtig“, „ohne Hintergedanken“ oder „in Schlichtheit“
  rationale: In Verbindung mit dem Teilen von Mitteln liegt die Bedeutung Großzügigkeit nahe. Da das Wort zugleich eine ungeteilte, aufrichtige Haltung bezeichnen kann, wird diese Spannung in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, aufzählende Form des griechischen Textes bleibt erhalten; nur das für einen verständlichen deutschen Satz nötige „soll“ beziehungsweise „soll es … tun“ wird ergänzt. Die Leitungsaussage bleibt bewusst allgemein und nicht amtstechnisch.
