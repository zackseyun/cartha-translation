  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: de
  text: Segnet die, die euch verfolgen[a]; segnet und verflucht sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch „nachjagen“ oder allgemein „verfolgen“ bedeuten; hier ist wahrscheinlich feindselige Verfolgung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Segnet
  rationale: Der Imperativ Plural wird mit dem natürlichen und zugleich religiös-ethisch offenen deutschen Ausdruck „Segnet“ wiedergegeben. Die Wiederholung bleibt erhalten und bewahrt den Nachdruck des griechischen Textes.
- source_word: τοὺς διώκοντας
  choice: die, die euch verfolgen
  rationale: Das substantivierte Partizip bezeichnet die Verfolgenden. „Verfolgen“ bewahrt im Deutschen sowohl die mögliche Grundbedeutung des Hinterherjagens als auch die im Kontext wahrscheinliche Bedeutung feindseliger Verfolgung. „Euch“ wird aus dem Ermahnungskontext ergänzt, damit der Satz im Deutschen eindeutig und natürlich klingt.
- source_word: καὶ
  choice: und
  rationale: Die einfache Konjunktion verbindet die wiederholte positive Aufforderung mit dem Verbot und wird entsprechend knapp wiedergegeben.
- source_word: μὴ καταρᾶσθε
  choice: verflucht sie nicht
  rationale: Der verneinte Imperativ wird als klares Verbot übersetzt. Das Pronomen „sie“ nimmt im Deutschen natürlich die zuvor genannten Verfolger auf und verhindert, dass „flucht nicht“ im Sinn von „gebraucht keine Schimpfwörter“ missverstanden wird.
theological_decisions:
- issue: Bedeutungsumfang von διώκω im Kontext
  choice: Als feindseliges Verfolgen verstanden, wobei die weitere lexikalische Bedeutung erkennbar bleibt
  alternative: denen, die euch nachjagen / hinter euch her sind
  rationale: διώκω kann allgemein „verfolgen“ oder „nachjagen“ bedeuten, bezeichnet jedoch im paulinischen und frühchristlichen Ermahnungskontext häufig Verfolgung durch Gegner. Der Gegensatz von Segnen und Verfluchen stützt diese Lesart, ohne die lexikalische Breite vollständig auszublenden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Mahncharakter. Die emphatische Wiederholung von „segnet“ und die einfache Satzverknüpfung des griechischen Textes bleiben erhalten.
