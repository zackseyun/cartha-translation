  source_fidelity: „Nehmt Anteil an den Nöten“ kann im heutigen Deutsch vor allem mitfühlende Anteilnahme ausdrücken. κοινωνοῦντες mit dem Dativ χρείαις bezeichnet hier hingegen tätige Beteiligung an bzw. Unterstützung bei den Bedürfnissen der Heiligen. „Setzt euch für die Bedürfnisse der Heiligen ein“ gibt diesen aktiven Sinn klar und idiomatisch wieder. „Strebt nach Gastfreundschaft“ bewahrt die zielgerichtete Kraft von διώκοντες ohne die Zusatzverstärkung „mit Nachdruck“.
  naturalness: Die überarbeitete Fassung ist modernes Standarddeutsch und knapp-paränetisch. „Bedürfnisse“ ist in diesem Kontext etwas unmittelbarer und weniger dramatisierend als „Nöte“; „strebt nach“ ist eine etablierte, natürliche Wiedergabe für ein aktives Anstreben.
  terminology: „Die Heiligen“ erhält den paulinischen Terminus ἅγιοι. Die Fußnote erläutert den gemeindlichen Bezug, ohne eine konfessionell festgelegte Deutung in den Text einzutragen. „Gastfreundschaft“ ist die übliche Entsprechung für φιλοξενία; die Fußnote hält deren besondere Ausrichtung auf Fremde fest.
