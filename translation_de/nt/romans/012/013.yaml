  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: de
  text: Setzt euch für die Bedürfnisse der Heiligen[a] ein; strebt nach Gastfreundschaft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint sind die an Christus Glaubenden als Gottes heiliges Volk. Auch möglich: „Beteiligt euch an den Bedürfnissen der Heiligen“ oder „Tragt zu ihrer Hilfe bei“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet besonders die gastliche Aufnahme von Fremden.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: Nöten
  rationale: χρεία bezeichnet hier konkrete Bedürfnisse oder Notlagen. „Nöte“ ist im Deutschen natürlich und lässt materielle wie andere praktische Bedürfnisse zu.
- source_word: ἁγίων
  choice: Heiligen
  rationale: Paulus bezeichnet mit οἱ ἅγιοι die an Christus Glaubenden als Gottes heiliges Volk. „Heilige“ bewahrt diesen paulinischen Identitätsbegriff, ohne ihn auf später kanonisierte Personen zu beschränken.
- source_word: κοινωνοῦντες
  choice: Nehmt Anteil an
  rationale: κοινωνέω kann Anteil nehmen, teilhaben oder beitragen bedeuten. In Verbindung mit den Nöten anderer schließt es tatkräftige Hilfe ein, ohne den Sinn auf Geldspenden zu verengen.
- source_word: φιλοξενίαν
  choice: Gastfreundschaft
  rationale: φιλοξενία bezeichnet die gastliche Aufnahme anderer, besonders Fremder. „Gastfreundschaft“ ist die geläufige deutsche Entsprechung; die nach außen gerichtete Bedeutung wird in einer Fußnote verdeutlicht.
- source_word: διώκοντες
  choice: bemüht euch mit Nachdruck um
  rationale: διώκω vermittelt ein zielstrebiges Verfolgen oder eifriges Suchen. Die Formulierung gibt die Intensität natürlicher wieder als das schwächere „übt“.
theological_decisions:
- issue: Bezug von „die Heiligen“
  choice: die an Christus Glaubenden als Gottes heiliges Volk
  alternative: Heilige im späteren, auf besonders anerkannte oder kanonisierte Personen beschränkten Sinn
  rationale: Im paulinischen Sprachgebrauch bezeichnet „die Heiligen“ grundsätzlich die Gemeinschaft der Glaubenden. Der traditionelle Ausdruck bleibt stehen, seine Bedeutung wird jedoch durch eine Fußnote geklärt.
translation_notes:
  register: Moderne, würdevolle Aufforderungssätze. „Nehmt Anteil“ bewahrt den Gedanken gemeinsamer Teilhabe und schließt praktische Unterstützung ein; „mit Nachdruck“ gibt die zielstrebige Kraft von διώκω wieder.
