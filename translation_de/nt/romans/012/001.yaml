id: ROM.12.1
reference: Romans 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: de
  text: Darum ermahne ich euch, Brüder[a], angesichts der Erbarmungen Gottes, eure Leiber als ein lebendiges, heiliges und Gott wohlgefälliges Opfer darzubringen – als euren vernünftigen Gottesdienst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann als Anrede eine gemischte Gruppe einschließen.
    reason: alternative_reading
  - marker: b
    text: Oder „euer geistlicher Gottesdienst“ beziehungsweise „euer vernunftgemäßer Dienst“; die griechische Wendung kann einen vernünftigen, angemessenen oder geistlichen Dienst beziehungsweise Gottesdienst bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ich ermahne
  rationale: Das Verb leitet hier einen eindringlichen apostolischen Aufruf ein. „Ermahnen“ bewahrt dessen Ernst und ist im modernen Deutschen verständlich, ohne altertümlich zu wirken.
- source_word: οὖν
  choice: Darum
  rationale: Das Wort kennzeichnet die Folgerung aus der vorangehenden Darlegung in Römer 1–11. „Darum“ stellt diesen logischen Anschluss natürlich her.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird quellennah beibehalten; dass sie im Kontext wahrscheinlich die gesamte Gemeinde einschließlich der Frauen umfasst, wird in einer Fußnote erläutert.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: angesichts der Erbarmungen Gottes
  rationale: διά mit Genitiv bezeichnet hier am ehesten die Grundlage des Aufrufs. „Angesichts“ gibt diesen begründenden Sinn idiomatisch wieder und bewahrt mit „Erbarmungen“ den griechischen Plural.
- source_word: παραστῆσαι
  choice: Bringt … dar
  rationale: παρίστημι hat im Opferzusammenhang den Sinn von darbieten oder zur Verfügung stellen. „Darbringen“ macht den kultischen Bezug im Deutschen klar.
- source_word: τὰ σώματα ὑμῶν
  choice: eure Körper
  rationale: Die konkrete Bezeichnung σώματα wird nicht zu „euch selbst“ verallgemeinert, auch wenn der ganze leibhaftige Mensch gemeint sein kann.
- source_word: θυσίαν ζῶσαν
  choice: als ein lebendiges … Opfer
  rationale: Die appositionale Wiedergabe ist im Deutschen natürlich und erhält das paradoxe Bild eines lebendigen Opfers.
- source_word: ἁγίαν
  choice: heiliges
  rationale: „Heilig“ gibt die Gott zugeeignete und ausgesonderte Beschaffenheit des Opfers prägnant wieder.
- source_word: εὐάρεστον τῷ θεῷ
  choice: Gott wohlgefälliges
  rationale: „Wohlgefällig“ drückt mehr als bloße Zulässigkeit aus und gibt die positive Bedeutung von εὐάρεστος präzise wieder.
- source_word: λογικὴν
  choice: vernünftiger
  rationale: λογικός kann vernünftig, dem Denken entsprechend, angemessen oder in manchen Deutungen geistlich bedeuten. „Vernünftig“ bleibt nahe am Wortlaut, ohne die umstrittene Bedeutung einseitig festzulegen.
- source_word: λατρείαν
  choice: Gottesdienst
  rationale: λατρεία bezeichnet den Gott erwiesenen kultischen Dienst. „Gottesdienst“ erhält sowohl den Dienst- als auch den Anbetungsbezug und passt zur Opfermetaphorik.
theological_decisions:
- issue: Anrede ἀδελφοί an eine wahrscheinlich gemischte Gemeinde
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die maskuline Form des Ausgangstextes bleibt im Haupttext sichtbar. Eine Fußnote erklärt transparent, dass die Anrede im damaligen Sprachgebrauch Frauen einschließen kann.
- issue: Bedeutung von λογικὴν λατρείαν
  choice: vernünftiger Gottesdienst
  alternative: geistlicher Gottesdienst; vernunftgemäßer Dienst
  rationale: Die griechische Wendung ist mehrdeutig. Die Hauptfassung wahrt den Bezug auf Vernunft beziehungsweise Angemessenheit; die Fußnote nennt die wesentlichen Alternativen, ohne die Spannung zugunsten einer bestimmten theologischen Deutung aufzulösen.
- issue: Bezug von τὴν λογικὴν λατρείαν ὑμῶν
  choice: Das ist euer vernünftiger Gottesdienst
  alternative: als euren vernünftigen Gottesdienst
  rationale: Die eigenständige Aussage macht die appositionale beziehungsweise erklärende Funktion der Wendung im Deutschen deutlich, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gliedert den einleitenden Appell und dessen Inhalt. „Körper“ bewahrt die konkrete Leiblichkeit des griechischen Ausdrucks; „Gottesdienst“ wird hier im weiteren Sinn des gesamten Gott dargebrachten Lebens verwendet.
