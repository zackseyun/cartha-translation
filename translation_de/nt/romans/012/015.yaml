  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: de
  text: Freut euch mit denen, die sich freuen; weint mit denen, die weinen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: Freut euch
  rationale: Der präsentische Infinitiv hat in dieser Reihe von Ermahnungen imperativische Funktion. Der deutsche Imperativ gibt diese Aufforderung natürlich wieder und bewahrt den Sinn von Freude.
- source_word: μετὰ
  choice: mit
  rationale: Mit dem Genitiv bezeichnet μετά Gemeinschaft oder begleitende Anteilnahme; „mit“ ist hier die genaue und idiomatische deutsche Entsprechung.
- source_word: χαιρόντων
  choice: denen, die sich freuen
  rationale: Das substantivierte Partizip Präsens im Genitiv Plural bezeichnet allgemein die sich Freuenden. Die Relativkonstruktion klingt im modernen Deutsch natürlich und erhält den verbalen Parallelismus.
- source_word: κλαίειν
  choice: weint
  rationale: Auch dieser Infinitiv ist imperativisch gebraucht. „Weint“ entspricht κλαίω unmittelbar und bildet eine klare, würdige Parallele zu „Freut euch“.
- source_word: κλαιόντων
  choice: denen, die weinen
  rationale: Das substantivierte Partizip Präsens bezeichnet diejenigen, die weinen. Die Formulierung ist verständlich und wahrt die Parallelstruktur des griechischen Satzes.
theological_decisions:
- issue: Imperativische Funktion der Infinitive in der Ermahnungsreihe
  choice: 'Beide Infinitive werden als deutsche Imperative wiedergegeben: „Freut euch …; weint …“'
  alternative: „Sich freuen mit denen, die sich freuen; weinen mit denen, die weinen.“
  rationale: Im Zusammenhang von Römer 12,9–21 dienen die Infinitive als Aufforderungen. Deutsche Imperative vermitteln diese Diskursfunktion natürlich, ohne den Inhalt theologisch zu erweitern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Ausdruck. Der enge Parallelismus des griechischen Textes bleibt erhalten; eine Fußnote ist nicht nötig, da die formalere Infinitivfassung im Deutschen unnatürlich wäre und keine wesentliche Bedeutungsalternative bietet.
