lexical_decisions:
- source_word: εἴτε διακονίαν
  choice: wenn es das Dienen ist
  rationale: Die konditionale, elliptische Form der Aufzählung wird beibehalten. „Dienen“ gibt διακονία weit und tätigkeitsbezogen wieder, ohne ein kirchliches Amt vorauszusetzen.
- source_word: ἐν τῇ διακονίᾳ
  choice: im Dienen
  rationale: Die Wiederholung desselben Wortstamms spiegelt die knappe griechische Parallelstruktur und bezeichnet den Bereich, in dem die Gabe ausgeübt werden soll.
- source_word: εἴτε ὁ διδάσκων
  choice: wer lehrt
  rationale: Das substantivierte Präsenspartizip wird funktional und verbal wiedergegeben; so wird kein festes Lehramt in den Text hineingelesen.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: im Lehren
  rationale: „Lehren“ bezeichnet hier natürlich die Tätigkeit und bewahrt zugleich die Parallelität zu „im Dienen“.
theological_decisions:
- issue: Ob διακονία mit kirchlich geprägter Amtssprache wiederzugeben ist
  choice: Dienen
  alternative: Dienst
  rationale: „Dienen“ hält die Bedeutung offen für praktische Hilfe und andere Formen des Dienstes, ohne den Ausdruck auf ein formelles kirchliches Amt zu verengen.
- issue: Ob ὁ διδάσκων als Amtsbezeichnung wiederzugeben ist
  choice: wer lehrt
  alternative: der Lehrer
  rationale: Die verbale Wiedergabe entspricht dem Partizip und betont die ausgeübte Funktion, während „der Lehrer“ leichter als feststehender Titel verstanden werden könnte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, elliptische Gestalt der griechischen Gabenliste und ihre parallele Struktur bleiben bewusst erhalten; der Zusammenhang mit dem vorausgehenden Vers ergänzt gedanklich die Aufforderung.
