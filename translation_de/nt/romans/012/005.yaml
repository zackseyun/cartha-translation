  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: de
  text: So sind wir, obwohl wir viele sind, ein Leib im Messias[a]; als Einzelne aber sind wir Glieder voneinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Knüpft vergleichend und folgernd an das Bild vom menschlichen Leib im vorherigen Vers an.
- source_word: οἱ πολλοὶ
  choice: obwohl wir viele sind
  rationale: Der Artikel mit dem Adjektiv bezeichnet hier die vielen Personen; das im Zusammenhang vorausgesetzte inklusive „wir“ wird im Deutschen ausdrücklich gemacht. „Obwohl“ verdeutlicht den im Kontext liegenden Gegensatz zur Einheit, ohne die Aussage inhaltlich aufzulösen.
- source_word: ἓν σῶμά
  choice: ein Leib
  rationale: Bewahrt die konkrete Körpermetapher und die hervorgehobene Einheit.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Gibt den Titel Χριστός mit seiner messianischen Bedeutung wieder und bewahrt zugleich die paulinische Wendung mit ἐν.
- source_word: τὸ δὲ καθ’ εἷς
  choice: als Einzelne aber
  rationale: Gibt die distributive Bedeutung „je einzeln“ idiomatisch wieder; „aber“ bewahrt den Gegensatz zwischen dem einen Leib und den einzelnen Gliedern.
- source_word: ἀλλήλων μέλη
  choice: untereinander Glieder
  rationale: Bewahrt sowohl die gegenseitige Beziehung von ἀλλήλων als auch das Körperbild von μέλη. Die knappe Formulierung lässt offen, wie diese wechselseitige Zugehörigkeit im Einzelnen zu bestimmen ist.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: Χριστός ist seinem Ursprung und Sinn nach ein Titel. „Messias“ macht diesen Titelsinn sichtbar, ohne die paulinische Aussage über die Gemeinschaft beziehungsweise Einheit „im Messias“ näher auszudeuten.
- issue: Wechselseitige Gliedschaft in ἀλλήλων μέλη
  choice: untereinander Glieder
  alternative: Glieder, die zueinander gehören
  rationale: Die kürzere Form bewahrt die auffällige Aussage, dass die Einzelnen Glieder voneinander sind, statt sie lediglich als allgemeine Zusammengehörigkeit zu paraphrasieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib“ und „Glieder“ erhalten die zusammenhängende Körpermetapher; die leicht gehobene Wendung „untereinander Glieder“ wahrt die Prägnanz und Spannung des griechischen Textes.
