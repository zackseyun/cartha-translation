    issue: „als Einzelne aber untereinander Glieder“ ist als Wiedergabe von τὸ δὲ καθ’ εἷς ἀλλήλων μέλη zu elliptisch und nicht ganz präzise.
    rationale: Das Griechische bezeichnet die einzelnen Personen als „Glieder voneinander/aneinander“. „Untereinander Glieder“ ist im Deutschen weniger klar und kann eher eine allgemeine Beziehung als die ausdrücklich reziproke Gliedschaft ausdrücken. Die Ergänzung des im Griechischen ausgelassenen Verbs ist im Deutschen erforderlich bzw. deutlich natürlicher.
