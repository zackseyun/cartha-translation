  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: de
  text: Lass dich nicht vom Bösen besiegen,[a] sondern besiege das Böse durch das Gute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass dich nicht von dem besiegen, was böse ist, sondern besiege das, was böse ist, durch das, was gut ist.“ Im Griechischen stehen substantivierte Adjektive im Neutrum, die sowohl allgemein mit „das Böse“ und „das Gute“ als auch umschreibend wiedergegeben werden können.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Lass dich nicht … besiegen
  rationale: Der verneinte Präsensimperativ Passiv der zweiten Person Singular wird im Deutschen natürlich mit „Lass dich nicht … besiegen“ wiedergegeben. So bleibt der passive Sinn und das Bild des Überwindens beziehungsweise Besiegens erhalten.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: vom Bösen
  rationale: ὑπό mit Genitiv bezeichnet hier das Wirkende. Das substantivierte Neutrum kann im Deutschen idiomatisch „das Böse“ oder „was böse ist“ heißen; „vom Bösen“ bewahrt die knappe moralische Gegenüberstellung.
- source_word: ἀλλὰ νίκα
  choice: sondern besiege
  rationale: ἀλλά bildet nach der Verneinung einen starken Gegensatz. Der aktive Imperativ νίκα wird mit „besiege“ wiedergegeben und nimmt dasselbe Wortfeld wie der erste Satzteil auf.
- source_word: ἐν τῷ ἀγαθῷ
  choice: durch das Gute
  rationale: ἐν mit Dativ bezeichnet hier am wahrscheinlichsten das Mittel. „Durch das Gute“ ist klares, natürliches Deutsch und bewahrt die substantivierte Form.
- source_word: τὸ κακόν
  choice: das Böse
  rationale: Das substantivierte neutrale Adjektiv bezeichnet allgemein das Böse beziehungsweise das, was böse ist. Die Wiederholung erhält die prägnante Antithese des griechischen Satzes.
theological_decisions:
- issue: Ob κακόν und ἀγαθόν als moralische Kategorien oder personalisiert zu verstehen sind
  choice: 'moralische Kategorien: „das Böse“ und „das Gute“'
  alternative: personalisierte Deutung, etwa „der Böse“
  rationale: Die neutralen Formen und der ethische Zusammenhang in Römer 12 sprechen für allgemeine moralische Kategorien. Eine ausdrückliche Gleichsetzung mit einer persönlichen bösen Macht würde mehr festlegen, als der Wortlaut verlangt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die zweimalige Verwendung von „besiegen“ bildet den Wechsel vom Passiv zum Aktiv ab; „das Böse“ und „das Gute“ erhalten die knappe rhetorische Gegenüberstellung.
