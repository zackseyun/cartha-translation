  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: de
  text: Freut euch in der Hoffnung, haltet stand in der Bedrängnis[a], bleibt beharrlich im Gebet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Not“; das Wort bezeichnet starken Druck, Bedrückung oder Leid.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „widmet euch beständig dem Gebet“; das Verb betont ausdauernde, feste Hingabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: in der Hoffnung
  rationale: Der Dativ bezeichnet den Bereich bzw. Grund der Freude. Die bestimmte Form ist im Deutschen natürlich und bewahrt die knappe Ausdrucksweise.
- source_word: χαίροντες
  choice: Freut euch
  rationale: Das Partizip steht in einer Reihe ermahnender Aussagen. Ein Imperativ gibt diese Funktion im modernen Deutschen natürlicher wieder als eine isolierte Partizipialkonstruktion.
- source_word: θλίψει
  choice: Bedrängnis
  rationale: θλῖψις bezeichnet starken Druck, Not oder Bedrückung. „Bedrängnis“ bewahrt das Gewicht des Ausdrucks und ist in gehobenem modernem Deutsch verständlich.
- source_word: ὑπομένοντες
  choice: haltet stand
  rationale: ὑπομένω bezeichnet standhaftes Ausharren unter Belastung. „Standhalten“ gibt dies knapp und idiomatisch wieder, ohne ausdrücklich eine emotionale Geduld einzutragen.
- source_word: προσευχῇ
  choice: im Gebet
  rationale: Der Dativ benennt den Bereich, in dem die beständige Hingabe erfolgt. „Im Gebet“ ist die natürliche deutsche Form.
- source_word: προσκαρτεροῦντες
  choice: bleibt beharrlich
  rationale: προσκαρτερέω bezeichnet beharrliches Festhalten, ausdauerndes Fortfahren oder hingebungsvolles Verweilen. Die Wendung wahrt den fortdauernden Charakter und passt zur ermahnenden Dreierreihe.
theological_decisions: []
