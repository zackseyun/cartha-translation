  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: de
  text: Denn wie wir an einem Körper viele Glieder[a] haben, die Glieder aber nicht alle dieselbe Funktion[b] haben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viele Körperteile“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dieselbe Tätigkeit“. Das griechische Wort kann Tätigkeit oder Funktion bezeichnen; im Zusammenhang der Körpermetapher gibt „Funktion“ den Sinn natürlich wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Denn wie
  rationale: „Denn“ bewahrt den begründenden Anschluss an den vorherigen Vers; „wie“ leitet den Vergleich ein, der im folgenden Vers fortgeführt wird.
- source_word: ἐν ἑνὶ σώματι
  choice: in einem einzigen Körper
  rationale: Die Formulierung gibt die körperliche Bildsprache unmittelbar wieder und hebt mit „einzigen“ die Einheit gegenüber den vielen Gliedern hervor.
- source_word: πολλὰ μέλη
  choice: viele Glieder
  rationale: „Glieder“ ist im Deutschen die natürliche traditionelle Bezeichnung für Körperteile innerhalb dieser paulinischen Metapher und ermöglicht zugleich ihre gemeinschaftliche Anwendung.
- source_word: ἔχομεν
  choice: wir … haben
  rationale: Das Präsens wird direkt und idiomatisch wiedergegeben.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: aber nicht alle Glieder
  rationale: 'Diese Wortstellung gibt den Kontrast und den Geltungsbereich der Verneinung natürlich wieder: Nicht jedes Glied hat dieselbe Aufgabe.'
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: dieselbe Aufgabe haben
  rationale: πρᾶξις kann Tätigkeit oder Funktion bezeichnen. „Aufgabe“ passt zur Körpermetapher und klingt im modernen Deutschen natürlicher als das technischere „Funktion“.
theological_decisions:
- issue: Ekklesiologische Bedeutung der Körpermetapher
  choice: Die Metapher wird schlicht als „ein einziger Körper“ mit „vielen Gliedern“ wiedergegeben, ohne die Gemeinde in diesem Vers ausdrücklich zu nennen.
  alternative: „ein Körper, nämlich die Gemeinde“
  rationale: Der folgende Vers wendet das Bild ausdrücklich auf die Gemeinschaft der Glaubenden an. Hier wird zunächst nur der Vergleich entfaltet; die Übersetzung wahrt diese gedankliche Abfolge.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satz bleibt wie im Griechischen zum folgenden Vers hin offen; deshalb endet er mit einem Komma. „Körper“ bezeichnet den physischen Leib in der Vergleichsebene klarer als „Leib“, während „Glieder“ die Bildsprache bewahrt.
