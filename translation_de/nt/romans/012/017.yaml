id: ROM.12.17
reference: Romans 12:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: de
  text: Vergeltet niemandem Böses mit Bösem. Seid darauf bedacht, was vor allen Menschen gut[a] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ehrenhaft« oder »edel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: niemandem
  rationale: Der Dativ Singular bezeichnet den Empfänger der Vergeltung und bewahrt den uneingeschränkten Geltungsbereich.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: Böses mit Bösem
  rationale: Die feste deutsche Wendung gibt den moralischen Gehalt von κακόν und den durch ἀντί ausgedrückten Vergeltungsgedanken natürlich wieder.
- source_word: ἀποδιδόντες
  choice: Vergeltet
  rationale: Das Partizip hat im Zusammenhang auffordernde Kraft; „vergelten“ drückt die erwidernde, hier negative Reaktion prägnant aus.
- source_word: προνοούμενοι
  choice: Seid darauf bedacht
  rationale: Die Formulierung bewahrt den Sinn bewusster, vorausschauender Sorge, ohne ihn auf materielle Fürsorge einzuengen.
- source_word: καλὰ
  choice: das Gute
  rationale: Die substantivierte Wiedergabe umfasst moralisch Gutes, kann im öffentlichen Zusammenhang aber auch Ehrenhaftes beziehungsweise Anständiges einschließen.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: vor allen Menschen
  rationale: Die natürliche deutsche Formulierung wahrt sowohl den öffentlichen Bezug als auch die inklusive Bedeutung von ἀνθρώπων.
theological_decisions:
- issue: Ethische Bedeutung von καλά im öffentlichen Zusammenhang
  choice: das Gute
  alternative: das Ehrenhafte / das Anständige
  rationale: „Das Gute“ hält die moralische Aussage weit und verhindert eine Verengung auf bloßen öffentlichen Anschein; die soziale Nuance wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden griechischen Partizipien werden als direkte Aufforderungen wiedergegeben, was ihrer Funktion im Mahnungszusammenhang entspricht. „Vor allen Menschen“ ist idiomatisch und bewahrt den Gedanken öffentlicher Wahrnehmbarkeit.
