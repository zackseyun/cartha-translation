  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: de
  text: Seid nicht träge im Eifer; seid glühend im Geist[a]; dient dem Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geist“ kann hier den menschlichen Geist beziehungsweise die innere Haltung meinen; möglich ist auch die Deutung auf den Heiligen Geist.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: im Eifer
  rationale: σπουδή bezeichnet hier eifrigen, ernsthaften Einsatz. „Eifer“ passt zum Gegensatz mit ὀκνηροί und klingt in der knappen Ermahnung natürlicher als „Fleiß“ oder „Sorgfalt“.
- source_word: ὀκνηροί
  choice: nicht nachlässig
  rationale: ὀκνηρός bezeichnet Trägheit, Zögerlichkeit oder mangelnden Einsatz. „Nicht nachlässig“ bildet zusammen mit „im Eifer“ eine klare und würdige deutsche Aufforderung.
- source_word: πνεύματι
  choice: im Geist
  rationale: Das artikellose πνεύματι kann den menschlichen Geist beziehungsweise die innere Haltung oder den Heiligen Geist bezeichnen. „Im Geist“ bewahrt diese Mehrdeutigkeit im Haupttext weitgehend.
- source_word: ζέοντες
  choice: seid glühend
  rationale: ζέω bedeutet wörtlich „sieden“ oder „kochen“ und wird hier bildlich für innere Intensität gebraucht. „Glühend“ erhält das lebendige Bild, ohne bloße Begeisterung auszudrücken.
- source_word: κυρίῳ
  choice: dem Herrn
  rationale: κύριος wird als der etablierte christliche Hoheitstitel „Herr“ wiedergegeben; im paulinischen Zusammenhang ist damit sehr wahrscheinlich Jesus Christus gemeint, ohne dass der Titel im Text näher bestimmt wird.
- source_word: δουλεύοντες
  choice: dient
  rationale: δουλεύω kann den Dienst eines Sklaven bezeichnen und betont verbindliche Zugehörigkeit und Gehorsam. In dieser Ermahnung gibt „dient“ den Sinn idiomatisch wieder, ohne die zugrunde liegende Hingabe unnötig zu verengen.
theological_decisions:
- issue: Bezug von πνεύματι in τῷ πνεύματι ζέοντες
  choice: Der Haupttext lässt „Geist“ ohne ausdrückliche Zuordnung stehen.
  alternative: „Durch den Geist entflammt“, verstanden als Wirken des Heiligen Geistes; oder „von glühendem Geist“, verstanden als menschliche innere Haltung.
  rationale: Der griechische Ausdruck benennt den Bezug nicht eindeutig. Der parallele Aufbau der Ermahnungen erlaubt eine Deutung auf den menschlichen Geist, während eine Beziehung auf den Heiligen Geist ebenfalls vertreten wird. Die Übersetzung entscheidet diese theologische Spannung nicht stillschweigend.
translation_notes:
  register: Knappe, rhythmische Ermahnungen in modernem, würdigem Standarddeutsch. Die wiederholte Form „Seid …; seid …; dient …“ bildet den parallelen Aufbau des Griechischen verständlich nach. Das Bild des Glühens bleibt erhalten.
