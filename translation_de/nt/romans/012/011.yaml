    rationale: „Nachlässig“ bezeichnet vor allem mangelnde Sorgfalt; ὀκνηρός meint hier träge, untätig oder widerwillig. „Träge“ gibt den lexikalischen Gegensatz zu σπουδῇ unmittelbarer wieder.
  revised_text: Seid nicht träge im Eifer; seid glühend im Geist[a]; dient dem Herrn.
