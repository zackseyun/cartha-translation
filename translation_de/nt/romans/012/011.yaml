review_pass:
  verdict: revise
  source_fidelity: Die drei parallelen Dativgruppen und die partizipialen Aufforderungen werden treffend wiedergegeben. „Eifer“ ist für σπουδῇ vertretbar. „Nachlässig“ trifft jedoch eher ein sorgfaltswidriges Verhalten, während ὀκνηροί unmittelbar Trägheit beziehungsweise fehlenden Antrieb bezeichnet. „Nicht träge“ wahrt diesen Kontrast zu σπουδῇ genauer. Die Mehrdeutigkeit von πνεύματι bleibt im Text und in der Anmerkung angemessen offen.
  naturalness: Der knappe, paränetische Rhythmus ist gutes modernes Standarddeutsch. „Seid nicht träge im Eifer“ ist idiomatischer und semantisch präziser als „Seid im Eifer nicht nachlässig“. „Glühend im Geist“ ist verständlich und bewahrt das Bild von ζέοντες.
  terminology: „Geist“, „Herr“ und „dient“ sind angemessen. Die Fußnote benennt beide möglichen Bezüge von πνεύματι, ohne den Heiligen Geist als alleinige Lesart festzulegen. Der englische Audit Trail bestätigt diese Ambiguität, auch wenn seine Dokumentation zu σπουδῇ widersprüchliche frühere Entscheidungen enthält; der griechische Kontext trägt die deutsche Wiedergabe direkt.
