review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes präzise wieder: das imperativisch gebrauchte Partizip mit reflexivem Bezug (μὴ ἑαυτοὺς ἐκδικοῦντες), die Anrede ἀγαπητοί, die bewusst knappe Wendung δότε τόπον τῇ ὀργῇ, die Schriftzitatformel sowie die emphatische Aussage über die göttliche Vergeltung. Insbesondere wird bei »dem Zorn« kein im Griechischen nicht ausdrücklich genannter Besitzer ergänzt.'
  naturalness: Die Fassung ist modernes, gehobenes Standarddeutsch und für ein Schriftzitat natürlich. »Rächt euch nicht selbst«, »gebt dem Zorn Raum« und »denn es steht geschrieben« sind klar und idiomatisch. »Mein ist die Rache« ist bewusst feierlich, aber im Zitatregister gut verständlich und angemessen.
  terminology: »Geliebte«, »Zorn«, »Rache«, »vergelten« und »der Herr« sind terminologisch stimmig. »Vergelten« wahrt den gerichtlichen Kontext von ἀνταποδώσω, ohne die Aussage zu einer bloß persönlichen Vergeltung umzudeuten.
