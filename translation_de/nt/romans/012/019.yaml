id: ROM.12.19
reference: Romans 12:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: de
  text: 'Rächt euch nicht selbst, Geliebte, sondern gebt dem Zorn Raum[a]; denn es steht geschrieben: »Mein ist die Rache; ich werde vergelten[b], spricht der Herr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist im Zusammenhang wahrscheinlich: Gebt Gottes Zorn Raum. Wörtlich steht nur »dem Zorn«; auch »lasst dem Zorn Raum« ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ich werde zurückzahlen« beziehungsweise »Vergeltung üben«.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Rächt euch nicht selbst
  rationale: Das mit μή verbundene Partizip hat im Zusammenhang imperativische Kraft. Die Formulierung bewahrt sowohl den Gedanken der Vergeltung als auch den reflexiven Bezug.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die Anrede bewahrt die herzliche und theologisch geprägte Bedeutung des griechischen Vokativs in würdigem, verständlichem Deutsch.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: sondern gebt dem Zorn Raum
  rationale: Die deutsche Wendung bildet das griechische Bild von τόπον διδόναι unmittelbar ab und lässt wie der Ausgangstext unausgesprochen, wessen Zorn gemeint ist.
- source_word: γέγραπται γάρ
  choice: denn es steht geschrieben
  rationale: Dies ist eine geläufige deutsche Wiedergabe der feststehenden Formel zur Einführung eines Schriftzitats und trägt dem resultativen Sinn des Perfekts Rechnung.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Mein ist die Rache
  rationale: Die vorangestellte possessive Konstruktion gibt die emphatische Dativform Ἐμοί knapp wieder und bewahrt den feierlichen Ton des Zitats.
- source_word: ἐγὼ ἀνταποδώσω
  choice: ich werde vergelten
  rationale: „Vergelten“ bezeichnet im Deutschen treffend die gerechte Gegenleistung beziehungsweise richterliche Ahndung und entspricht dem betonten ἐγώ.
- source_word: λέγει κύριος
  choice: spricht der Herr
  rationale: „Spricht der Herr“ ist eine natürliche, würdevolle deutsche Zitatformel; der bestimmte Artikel ist im Deutschen idiomatisch erforderlich.
theological_decisions:
- issue: Bezug von τῇ ὀργῇ
  choice: „dem Zorn“ bleibt im Haupttext ohne ausdrücklichen Besitzer; eine Fußnote nennt Gottes Zorn als im Kontext wahrscheinlichen Bezug.
  alternative: „dem Zorn Gottes“ ausdrücklich in den Haupttext aufnehmen oder die Wendung allgemein auf menschlichen Zorn beziehen.
  rationale: Das anschließende Zitat über Gottes ausschließliches Recht zur Vergeltung legt Gottes Zorn nahe. Da der griechische Text Gott an dieser Stelle jedoch nicht ausdrücklich nennt, wird diese verbleibende Offenheit nicht stillschweigend aufgelöst.
- issue: Göttliches Vorrecht auf Vergeltung
  choice: „Mein ist die Rache; ich werde vergelten“
  alternative: „Die Rache gehört mir; ich werde es heimzahlen“
  rationale: Die gewählte Fassung bewahrt die ausschließliche göttliche Zuständigkeit und den gerichtlichen Ernst, ohne durch das umgangssprachliche „heimzahlen“ einen Gedanken persönlicher Rachsucht einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Geliebte“ und die Schriftformel „es steht geschrieben“ bewahren den gehobenen biblischen Ton, ohne veraltete Grammatik zu verwenden. Das Zitat ist bewusst etwas feierlicher formuliert.
