source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: de
  text: 'Da wir aber unterschiedliche Gaben haben, entsprechend der Gnade, die uns gegeben wurde: sei es prophetisches Reden, im Verhältnis zum Glauben[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Verhältnis zum eigenen Glauben“; alternativ: „in Übereinstimmung mit dem Glauben“. Der griechische Ausdruck kann entweder das Maß des Glaubens der redenden Person oder die Übereinstimmung mit dem Inhalt des christlichen Glaubens bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: Wir haben
  rationale: Das Partizip führt den Gedankengang aus dem vorigen Vers fort. Ein selbstständiger deutscher Hauptsatz gibt den Zusammenhang natürlich wieder; δέ markiert hier nur einen milden Übergang und muss nicht eigens mit „aber“ wiedergegeben werden.
- source_word: χαρίσματα ... διάφορα
  choice: unterschiedliche Gaben
  rationale: χαρίσματα bezeichnet von Gottes Gnade verliehene Befähigungen; διάφορα beschreibt ihre Verschiedenheit. Die knappe Wortgruppe ist im Deutschen klar und idiomatisch.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: entsprechend der Gnade, die uns gegeben wurde
  rationale: κατά bezeichnet hier Entsprechung oder Maßgabe. „Gnade“ bewahrt den paulinischen Zusammenhang zwischen χάρις und χαρίσματα.
- source_word: εἴτε προφητείαν
  choice: Ist es prophetisches Reden
  rationale: Die griechische Wendung eröffnet eine elliptische Aufzählung. „Prophetisches Reden“ bezeichnet verständlich die Tätigkeit beziehungsweise Äußerung, ohne zusätzliche institutionelle Vorstellungen einzutragen.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: in einem der Glaubens entsprechenden Maß
  rationale: ἀναλογία bezeichnet Verhältnis, Entsprechung oder angemessenes Maß. Die Formulierung lässt offen, ob der persönliche Glaube oder der Inhalt des christlichen Glaubens gemeint ist; die Deutungsmöglichkeiten werden in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: in einem der Glaubens entsprechenden Maß
  alternative: im Verhältnis zum eigenen Glauben; in Übereinstimmung mit dem Glauben
  rationale: Der knappe griechische Ausdruck kann sich auf das Maß des Glaubens der redenden Person oder auf die Übereinstimmung mit dem Inhalt des christlichen Glaubens beziehen. Der Haupttext bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Aufzählung wird durch „Ist es …, dann …“ verständlich gemacht. Das Semikolon bewahrt den offenen Anschluss an Vers 7.
