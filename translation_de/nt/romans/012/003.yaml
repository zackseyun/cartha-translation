revisions:
- from: Denn kraft der Gnade, die mir gegeben wurde, sage ich jedem unter euch, nicht höher von sich zu denken, als er denken soll, sondern so zu denken, dass er besonnen urteilt,[a] wie Gott jedem ein Maß des Glaubens zugeteilt hat.[b]
  to: Denn durch die Gnade, die mir gegeben wurde, sage ich jedem unter euch, nicht höher von sich zu denken, als er denken soll, sondern mit Besonnenheit zu denken, wie Gott jedem ein Maß des Glaubens zugeteilt hat.[a]
  rationale: 'Die Revision glättet zwei stilistische und semantische Punkte, ohne den Sinn zu verändern: „durch die Gnade“ ist die geläufigere deutsche Wiedergabe des instrumentalen διά, und „mit Besonnenheit zu denken“ hält die griechische Wortverbindung und das φρονέω-Wortspiel enger zusammen. Die eigenständige Fußnote zu σωφρονεῖν ist nicht erforderlich, weil „Besonnenheit“ die Grundnuance ausreichend klar wiedergibt; die Fußnote zu μέτρον πίστεως bleibt an der betreffenden Stelle verankert.'
