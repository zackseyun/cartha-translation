source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: de
  text: Denn durch die Gnade, die mir gegeben wurde, sage ich jedem unter euch, nicht höher von sich zu denken, als er denken soll, sondern mit Besonnenheit zu denken, wie Gott jedem ein Maß des Glaubens zugeteilt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Maß des Glaubens“; möglicherweise auch: „ein Maß an Vertrauen“ oder „ein Maß der Treue“. Der griechische Ausdruck bezeichnet ein von Gott zugeteiltes, auf Glauben bezogenes Maß, ohne die genaue Bedeutung näher festzulegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: kraft der Gnade, die mir gegeben wurde
  rationale: διά mit dem Genitiv bezeichnet hier Mittel oder Grundlage. „Kraft der Gnade“ gibt knapp wieder, dass Paulus aufgrund der ihm verliehenen Gnade beziehungsweise Beauftragung spricht, ohne dies ausdeutend zu erweitern.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: jedem unter euch
  rationale: Die Formulierung bewahrt den distributiven Singular und bezeichnet jede einzelne Person innerhalb der Gemeinde.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: nicht höher von sich zu denken, als er denken soll
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken überhöhter Selbsteinschätzung als auch die Wiederholung des Wortfeldes „denken“. Das reflexive „von sich“ ist im Deutschen nötig, um den gemeinten Bezug der Selbsteinschätzung natürlich auszudrücken.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: sondern so zu denken, dass er besonnen urteilt
  rationale: „Besonnen urteilen“ verbindet vernünftige Selbsteinschätzung mit der in σωφρονεῖν enthaltenen Nüchternheit und Selbstbeherrschung. Die Konstruktion „so … dass“ spiegelt die Zielrichtung von εἰς τὸ, ohne im Deutschen schwerfällig zu wirken.
- source_word: ἐμέρισεν
  choice: zugeteilt hat
  rationale: Das Verb bezeichnet ein bewusstes Verteilen oder Zuweisen. „Zuge­teilt hat“ ist im Deutschen natürlich und erhält Gott als handelndes Subjekt.
- source_word: μέτρον πίστεως
  choice: ein Maß des Glaubens
  rationale: Der unbestimmte Ausdruck lässt offen, ob ein individuell zugeteiltes Maß, eine Befähigung oder ein anderer auf Glauben bezogener Maßstab gemeint ist. „Glaube“ ist hier die naheliegende Grundbedeutung von πίστις.
theological_decisions:
- issue: Bedeutung von μέτρον πίστεως
  choice: ein Maß des Glaubens
  alternative: das Maß des Glaubens; ein Maß an Vertrauen; ein Maß der Treue
  rationale: Der folgende Zusammenhang mit unterschiedlichen Gaben kann auf eine von Gott zugeteilte Befähigung zum Dienst hindeuten; der griechische Ausdruck legt diese Deutung jedoch nicht eindeutig fest. Die Übersetzung bewahrt daher die theologische und semantische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der distributive Singular „jedem … er“ folgt der griechischen Struktur. Die wiederholten Formen aus dem Wortfeld φρονέω werden soweit möglich durch „denken“ sichtbar gehalten; „besonnen urteilt“ gibt die besondere Nuance von σωφρονεῖν idiomatisch wieder.
