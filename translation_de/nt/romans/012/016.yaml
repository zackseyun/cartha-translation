  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: de
  text: Seid untereinander eines Sinnes[a]. Richtet euren Sinn nicht auf Hohes, sondern haltet euch zu den Niedrigen[b]. Haltet euch nicht selbst für klug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Denkt einander gegenüber dasselbe. Gemeint sein kann eine gemeinsame Haltung oder ein einträchtiges Miteinander.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Lasst euch auf das Niedrige ein. Das griechische Wort kann Menschen von niedrigem Status oder demütige Menschen, aber auch niedrige beziehungsweise einfache Dinge bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Seid untereinander auf dasselbe bedacht
  rationale: Die Wendung bezeichnet eine gemeinsame Haltung und das aufeinander ausgerichtete Denken in der Gemeinschaft, nicht zwingend völlige Übereinstimmung in jeder einzelnen Ansicht.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: Trachtet nicht nach Hohem
  rationale: Die Formulierung bewahrt das Bild des Hohen und kann sowohl stolzes Denken als auch das Streben nach hohem Rang oder angesehenen Dingen bezeichnen.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: lasst euch zu den Niedrigen hinziehen
  rationale: Die Wiedergabe lässt die Bewegungsbildlichkeit von συναπάγω erkennen. »Die Niedrigen« legt im Haupttext die im sozialen Zusammenhang naheliegende personale Lesart zugrunde; die ebenfalls mögliche sachliche Lesart wird in der Fußnote genannt.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: Haltet euch nicht selbst für klug
  rationale: Diese natürliche deutsche Wendung gibt die Warnung vor Klugheit nach dem eigenen Urteil und vor Selbstüberschätzung wieder; γίνεσθε hat im Imperativ hier die Kraft, eine solche Haltung nicht anzunehmen.
theological_decisions:
- issue: Deutung von τὰ ὑψηλά und τοῖς ταπεινοῖς innerhalb der Mahnung zur Demut
  choice: Der Haupttext verbindet das Streben nach Hohem mit der Hinwendung zu gesellschaftlich Niedrigen.
  alternative: 'Die Gegenüberstellung kann auch bedeuten: nicht hochmütig denken, sondern sich auf niedrige beziehungsweise einfache Dinge oder Aufgaben einlassen.'
  rationale: Das Griechische erlaubt sowohl eine soziale als auch eine auf Einstellungen und Dinge bezogene Deutung. Die Formulierung und die Fußnoten bewahren diese Spannung, ohne die Mahnung ausschließlich auf inneren Stolz oder ausschließlich auf sozialen Umgang festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Auf dasselbe bedacht sein« wahrt den Gedanken einer gemeinsamen Haltung, während »lasst euch … hinziehen« das Bewegungsbild des griechischen Verbs erhält. Die Schlussmahnung ist bewusst idiomatisch und unmittelbar formuliert.
