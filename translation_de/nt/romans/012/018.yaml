  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: de
  text: Wenn möglich[a], soweit es an euch liegt, lebt mit allen Menschen in Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn es möglich ist, dann lebt, soweit es an euch liegt, mit allen Menschen in Frieden.“'
    reason: Die griechische Bedingungsformel kann ausdrücklich mit „Wenn es möglich ist“ wiedergegeben werden; der Sinn bleibt derselbe.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Wenn möglich
  rationale: Die knappe Bedingungsformel wahrt die realistische Einschränkung und ist im modernen Deutschen natürlich.
- source_word: τὸ ἐξ ὑμῶν
  choice: soweit es an euch liegt
  rationale: Die idiomatische Wendung bezeichnet den Bereich der eigenen Möglichkeit und Verantwortung, ohne einen friedlichen Ausgang zu garantieren.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: mit allen Menschen
  rationale: ἄνθρωποι ist hier allgemein und nicht ausschließlich auf Männer bezogen; „alle Menschen“ gibt den umfassenden Geltungsbereich präzise wieder.
- source_word: εἰρηνεύοντες
  choice: lebt … in Frieden
  rationale: Das Partizip führt im Kontext die Aufforderungen fort und beschreibt eine anhaltende Lebensweise; die deutsche Verbform gibt diesen imperativischen Sinn natürlich wieder.
theological_decisions:
- issue: Reichweite und Begrenzung der Aufforderung
  choice: Die Glaubenden sollen gegenüber allen Menschen Frieden suchen, sind aber nur für das verantwortlich, was in ihrem Einflussbereich liegt.
  alternative: Die Aufforderung garantiere oder verlange ausnahmslos, dass Frieden tatsächlich erreicht wird.
  rationale: Sowohl εἰ δυνατόν als auch τὸ ἐξ ὑμῶν schränken die Verantwortung realistisch ein, während μετὰ πάντων ἀνθρώπων ihren universalen Adressatenkreis wahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken.
