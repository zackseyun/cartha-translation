  source_fidelity: Die Übersetzung gibt beide präpositionalen Bereichen und die gegenseitige Ausrichtung des griechischen Textes zuverlässig wieder. „Geschwisterliche Liebe“ entspricht φιλαδελφία, „herzlich zugetan“ trifft die warme, familienähnliche Zuneigung von φιλόστοργοι, und „übertretfft einander darin, einander Ehre zu erweisen“ gibt προηγούμενοι im Sinn eines gegenseitigen Vorangehens bzw. Überbietens beim Erweisen von τιμή angemessen wieder.
