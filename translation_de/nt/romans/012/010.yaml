  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: de
  text: Seid einander in geschwisterlicher Liebe herzlich zugetan; übertrefft einander darin, einander Ehre zu erweisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: geschwisterlicher Liebe
  rationale: Das Wort bezeichnet die Liebe unter Geschwistern und wird hier auf die Gemeinschaft der Glaubenden übertragen. „Geschwisterlich“ gibt die familiäre, gegenseitige Beziehung im heutigen Deutsch inklusiv wieder.
- source_word: φιλόστοργοι
  choice: herzlich zugetan
  rationale: Der Ausdruck bezeichnet innige, familiäre Zuneigung. „Herzlich zugetan“ ist natürlich, würdig und bewahrt den Gedanken einer warmen, beständigen Verbundenheit.
- source_word: τιμῇ
  choice: Ehre zu erweisen
  rationale: τιμή bezeichnet hier die Achtung und Wertschätzung, die anderen entgegengebracht wird. Die verbale Fassung ergibt zusammen mit dem Partizip einen klaren deutschen Satz.
- source_word: προηγούμενοι
  choice: übertrefft einander darin
  rationale: Das Partizip kann ein Vorangehen oder Zuvorkommen ausdrücken. „Übertrefft einander darin“ bewahrt den pointierten Aufruf, bei der Ehrung anderer miteinander zu wetteifern, ohne ihn als bloßes Bevorzugen abzuschwächen.
theological_decisions:
- issue: Familiäre Sprache für die Gemeinschaft
  choice: geschwisterlicher Liebe
  alternative: Bruderliebe
  rationale: Die Wahl bewahrt die Metapher einer geistlichen Familie, ohne den deutschen Ausdruck unnötig auf Männer einzuengen.
- issue: Bedeutung von προηγούμενοι bei der gegenseitigen Ehrerweisung
  choice: übertrefft einander darin, einander Ehre zu erweisen
  alternative: kommt einander in der Ehrerweisung zuvor
  rationale: Die gewählte Fassung erhält die bewusst spannungsreiche Vorstellung eines gegenseitigen Überbietens im Ehren der anderen. Die Alternative ist ebenfalls möglich, wirkt aber weniger unmittelbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Ermahnungsstil. Die zweimalige Verwendung von „einander“ spiegelt die starke Gegenseitigkeit des griechischen Textes.
