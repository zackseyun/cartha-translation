reference: Romans 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: de
  text: 'Und passt euch nicht diesem Zeitalter[a] an, sondern lasst euch durch die Erneuerung eures Denkens verwandeln, damit ihr erkennen könnt[b], was der Wille Gottes ist: das Gute, Wohlgefällige[c] und Vollkommene.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieser Welt«. Das griechische αἰών bedeutet genauer »Zeitalter« und bezeichnet hier die gegenwärtige Ordnung oder Epoche.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »damit ihr prüfen und gutheißen könnt, was der Wille Gottes ist«. Das griechische Verb kann sowohl das Prüfen als auch das Erkennen und Gutheißen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: »Wohlgefällig« kann »Gott wohlgefällig« bedeuten; auch die Übersetzung »annehmbar« ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: passt euch … an
  rationale: Die reflexive deutsche Wendung gibt das Verbot wieder, das äußere Muster des gegenwärtigen Zeitalters anzunehmen, und bildet einen klaren Gegensatz zu »verwandeln«.
- source_word: αἰῶνι τούτῳ
  choice: diesem Zeitalter
  rationale: αἰών bezeichnet hier eher die gegenwärtige Epoche und Ordnung als die geschaffene Welt; »Zeitalter« bewahrt diesen zeitlich-ethischen Akzent.
- source_word: μεταμορφοῦσθε
  choice: lasst euch … verwandeln
  rationale: Die Formulierung gibt den tiefgreifenden Wandel und zugleich die passive Bedeutung der griechischen Imperativform natürlich wieder.
- source_word: τῇ ἀνακαινώσει τοῦ νοός
  choice: durch die Erneuerung eures Denkens
  rationale: Der Dativ wird instrumental verstanden. »Denken« bezeichnet hier das erneuerte Wahrnehmungs- und Urteilsvermögen; das im Deutschen nötige Possessivpronomen ergibt sich aus den pluralischen Adressaten.
- source_word: εἰς τὸ δοκιμάζειν ὑμᾶς
  choice: damit ihr erkennen könnt
  rationale: Die Konstruktion drückt Zweck beziehungsweise Folge aus. »Erkennen« gibt im Zusammenhang das prüfende Erfassen dessen wieder, was sich als Gottes Wille bewährt; die breitere Bedeutung wird in der Fußnote offengelegt.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: was der Wille Gottes ist
  rationale: Die Formulierung bewahrt sowohl die indirekte Frage als auch den ausdrücklichen Genitiv.
- source_word: τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: das Gute, Wohlgefällige und Vollkommene
  rationale: Die substantivierte deutsche Adjektivreihe spiegelt die griechische Apposition eng wider, ohne ein zusätzliches Bezugswort einzuführen.
theological_decisions:
- issue: Ethischer Kontrast von αἰών
  choice: diesem Zeitalter
  alternative: dieser Welt / der gegenwärtigen Weltordnung
  rationale: »Zeitalter« vermeidet es, die geschaffene Welt selbst zum Gegenpol zu machen, und erhält den zeitlich-ethischen Rahmen des gegenwärtigen, von Erneuerung unterschiedenen Ordnungszusammenhangs.
- issue: Bedeutungsumfang von δοκιμάζειν gegenüber Gottes Willen
  choice: erkennen
  alternative: prüfen; prüfen und als bewährt erkennen
  rationale: Der Text spricht von einem durch Erneuerung ermöglichten prüfenden Erkennen und Gutheißen. Die Hauptfassung bleibt flüssig, während die Fußnote die Spannung zwischen Prüfen und Anerkennen bewahrt.
- issue: Bezug von εὐάρεστον
  choice: Wohlgefällige
  alternative: Annehmbare; Gott Wohlgefällige
  rationale: Das griechische Adjektiv nennt nicht ausdrücklich, wem etwas wohlgefällt. Die Übersetzung lässt diesen Bezug offen; im Kontext liegt Gottes Wohlgefallen nahe, wird aber nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Passt euch … an« und »lasst euch … verwandeln« bilden einen verständlichen Kontrast; »Wohlgefällige« ist bewusst etwas gehobener, bleibt aber im biblischen Register geläufig. Die Zeichensetzung mit Doppelpunkt kennzeichnet die abschließende Adjektivreihe als nähere Bestimmung des Willens Gottes.
