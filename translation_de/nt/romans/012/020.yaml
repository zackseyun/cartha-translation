source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: de
  text: Doch wenn dein Feind Hunger hat, gib ihm zu essen; wenn er Durst hat, gib ihm zu trinken. Denn indem du dies tust, wirst du glühende Kohlen auf seinem Kopf anhäufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Kohlen des Feuers“. Das Bild kann auf Beschämung hinweisen, die zur Umkehr führt, auf schmerzhafte Gewissensnot oder auf bevorstehendes Gericht. Der Haupttext lässt die Metapher bewusst ungedeutet.'
    reason: Lexikalische Alternative und Erhalt einer umstrittenen Metapher.
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Doch wenn
  rationale: ἀλλά setzt einen Gegensatz zum vorherigen Verbot der Vergeltung, während ἐάν die Bedingung einleitet. „Doch wenn“ gibt beides in natürlichem Deutsch wieder.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: dein Feind Hunger hat
  rationale: Die singularische Formulierung bleibt erhalten; „Hunger hat“ ist im modernen Deutsch natürlicher als „hungert“.
- source_word: ψώμιζε αὐτόν
  choice: gib ihm zu essen
  rationale: ψωμίζω bezeichnet das Versorgen mit Nahrung. Die Wendung ist konkret, idiomatisch und vermeidet die mögliche weitergehende Nuance von „ernähre ihn“.
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: wenn er Durst hat, gib ihm zu trinken
  rationale: Die parallele Bedingung und Aufforderung werden in geläufigem modernem Deutsch wiedergegeben; ποτίζω wird nicht unnötig auf Wasser eingeengt.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Denn wenn du das tust
  rationale: Die partizipiale Konstruktion begründet die Aufforderung und bezeichnet das Tun als Voraussetzung für die folgende Wirkung. Die deutsche Bedingungskonstruktion ist klar und natürlich.
- source_word: ἄνθρακας πυρὸς
  choice: glühende Kohlen
  rationale: Wörtlich steht „Kohlen des Feuers“. „Glühende Kohlen“ bewahrt das konkrete Bild in verständlichem Deutsch.
- source_word: σωρεύσεις
  choice: wirst du … anhäufen
  rationale: Der griechische Futur Indikativ wird als Zukunftsaussage wiedergegeben; „anhäufen“ bewahrt die Vorstellung des Aufschichtens.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: auf seinem Kopf
  rationale: Die konkrete Metapher bleibt erhalten. „Kopf“ ist gegenüber „Haupt“ die natürliche moderne Entsprechung.
theological_decisions:
- issue: Bedeutung des Bildes von glühenden Kohlen auf dem Kopf des Feindes
  choice: Das Bild wird im Haupttext ohne Festlegung seiner Bedeutung beibehalten.
  alternative: Das Bild ausdrücklich als Beschämung mit dem Ziel der Umkehr, als schmerzhafte Gewissensnot oder als bevorstehendes Gericht deuten.
  rationale: Die Metapher ist mehrdeutig und ihre genaue Aussage umstritten. Eine Deutung im Haupttext würde eine theologische Spannung auflösen, die der griechische Wortlaut offenlässt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallelen Aufforderungen sind bewusst knapp gehalten; das ungewöhnliche Schlussbild bleibt als Bildsprache erhalten.
