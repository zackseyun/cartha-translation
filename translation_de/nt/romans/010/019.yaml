id: ROM.10.19
reference: Romans 10:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: de
  text: 'Doch ich frage: Hat Israel etwa nicht verstanden[a]? Als Erster sagt Mose: »Ich werde euch durch das, was kein Volk ist[b], eifersüchtig machen; durch ein Volk ohne Einsicht werde ich euch zum Zorn reizen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hat Israel etwa nicht erkannt?« Das griechische Verb kann »kennen/erkennen« oder im Zusammenhang auch »verstehen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Zitat aus 5. Mose 32,21. »Was kein Volk ist« kann ein Volk bezeichnen, das nicht als wirkliches Volk gilt; im Zusammenhang wird die Wendung häufig auf die nichtjüdischen Völker bezogen.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: Hat Israel etwa nicht verstanden?
  rationale: Die rhetorische Frage und die doppelte Verneinung werden in natürlichem Deutsch mit »etwa nicht« wiedergegeben. »Verstanden« nimmt im Zusammenhang von Hören und Reagieren den Sinn auf, die Bedeutung des Gehörten zu erfassen; die mögliche Wiedergabe »erkannt/gewusst« bleibt in der Fußnote sichtbar.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Als Erster sagt Mose
  rationale: Bewahrt die Hervorhebung des Mose als ersten angeführten Schriftzeugen, ohne die Aussage unnötig auszudeuten.
- source_word: παραζηλώσω
  choice: werde euch … eifersüchtig machen
  rationale: Gibt den kausativen Sinn des Verbs in geläufigem modernem Deutsch wieder.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: durch das, was kein Volk ist
  rationale: Bewahrt die auffällige, rhetorisch zugespitzte Formulierung des Zitats und gibt ἐπί hier sinngemäß instrumental mit »durch« wieder.
- source_word: ἔθνει ἀσυνέτῳ
  choice: durch ein Volk ohne Einsicht
  rationale: Gibt ἀσύνετος transparent als Mangel an Einsicht wieder und vermeidet die stärker wertende Festlegung »töricht«.
- source_word: παροργιῶ
  choice: werde ich euch zum Zorn reizen
  rationale: Bewahrt den kausativen Sinn und die sprachliche Parallelität zum vorhergehenden Versteil.
theological_decisions:
- issue: Bezug von »was kein Volk ist« und »Volk ohne Einsicht«
  choice: Die Formulierung des Zitats bleibt im Haupttext ohne ausdrückliche Identifizierung des gemeinten Volkes erhalten.
  alternative: Ausdrückliche Deutung als die nichtjüdischen Völker oder als ein von Israel nicht als echtes Volk angesehenes Volk.
  rationale: Paulus zitiert Deuteronomium 32,21. Eine explizite Identifizierung im Haupttext würde die genuine Offenheit der Zitatwendung interpretierend festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Schärfe des alttestamentlichen Zitats bleibt erhalten; zugleich sorgen »etwa nicht«, »ohne Einsicht« und die klaren Satzbezüge für unmittelbare Verständlichkeit.
