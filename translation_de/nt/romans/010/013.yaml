  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: de
  text: Denn jeder, der den Namen des Herrn anruft, wird gerettet werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus zitiert Joel 3,5 (in manchen Bibelausgaben Joel 2,32). Dort bezieht sich „der HERR“ auf JHWH; hier wendet Paulus die Aussage im Zusammenhang auf Jesus an.
    reason: cross_reference
  - marker: b
    text: 'Oder: „sich auf den Namen des Herrn beruft“. Der griechische Ausdruck bezeichnet, den Herrn unter Anrufung seines Namens anzurufen oder sich an ihn zu wenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς … ὃς ἂν
  choice: jeder, der
  rationale: Die Verbindung ist verallgemeinernd und bezeichnet ausnahmslos jeden Menschen. „Jeder, der“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion führt die Schriftbegründung für die vorausgehende Aussage ein und bewahrt den argumentativen Zusammenhang.
- source_word: ἐπικαλέσηται
  choice: anruft
  rationale: In Verbindung mit „den Namen“ bezeichnet das Verb das vertrauensvolle Anrufen beziehungsweise Sich-Berufen auf den Herrn. „Anrufen“ wahrt den biblischen Sprachgebrauch und ist im Deutschen verständlich.
- source_word: τὸ ὄνομα
  choice: den Namen
  rationale: Die wörtliche Wiedergabe erhält die biblische Ausdrucksweise, in der der Name für die offenbarte Identität und Autorität der angerufenen Person steht.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der griechische Text nennt κύριος ohne ausdrückliche Erweiterung. „des Herrn“ bewahrt sowohl den Wortlaut des Joel-Zitats als auch seine christologische Anwendung im Kontext des Römerbriefs.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Das Futur Passiv bezeichnet hier im paulinischen Zusammenhang die rettende Heilstat Gottes. Die Formulierung ist klar und bewahrt das Passiv des Ausgangstextes.
theological_decisions:
- issue: Bezug von „Herr“ im aus Joel angeführten Schriftwort
  choice: Im Haupttext bleibt „Herr“ ohne erklärende Erweiterung stehen.
  alternative: „der HERR“ oder „der Herr Jesus“
  rationale: In Joel 3,5 nach deutscher Kapitelzählung (Joel 2,32 in vielen englischen Ausgaben) bezieht sich das Zitat auf JHWH; im unmittelbaren Kontext von Römer 10 wendet Paulus es auf Jesus an. Eine Erweiterung im Haupttext würde diese intertextuelle Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt knapp und schriftgemäß; „anruft“ bewahrt den etablierten biblischen Ausdruck, ohne altertümlich zu wirken.
