  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: de
  text: Denn der Messias ist das Ende des Gesetzes[a] – zur Gerechtigkeit für jeden, der glaubt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ziel des Gesetzes“, „Vollendung des Gesetzes“ oder „Abschluss des Gesetzes“. Das griechische Wort kann einen Endpunkt ebenso wie ein Ziel oder eine Vollendung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „zur Gerechtigkeit für jeden, der glaubt“. Die Wendung kann eine Ziel- oder Ergebnisrichtung ausdrücken, ohne dass die genaue Beziehung näher bestimmt wird.'
    reason: formal_equivalence
lexical_decisions:
- source_word: τέλος
  choice: Ende
  rationale: „Ende“ bewahrt die Mehrdeutigkeit des griechischen Wortes zwischen Abschluss und Ziel beziehungsweise Vollendung.
- source_word: νόμου
  choice: des Gesetzes
  rationale: Im paulinischen Zusammenhang bezeichnet der artikellose Genitiv das als bekannte Größe vorausgesetzte mosaische Gesetz; im Deutschen ist der bestimmte Artikel natürlich.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Hier ist der Titelcharakter aktiv, da Paulus Jesus auf Israels Gesetz und Bundeshoffnung bezieht.
- source_word: εἰς δικαιοσύνην
  choice: sodass … Gerechtigkeit erlangt
  rationale: Die Formulierung gibt die Ziel- oder Ergebnisrichtung von εἰς idiomatisch wieder, ohne die genaue Beziehung unnötig festzulegen.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die sachlich und sprachlich angemessene deutsche Wiedergabe und kann im Kontext sowohl den rechten Status als auch Gottes gerechtes Handeln anklingen lassen.
- source_word: παντὶ τῷ πιστεύοντι
  choice: jeder, der glaubt
  rationale: Die Wiedergabe erhält den substantivierten Partizipialsinn und betont wie das Griechische die uneingeschränkte Reichweite.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ kennzeichnet den Vers als Begründung beziehungsweise Erläuterung des vorausgehenden Gedankens.
theological_decisions:
- issue: Bedeutung von τέλος νόμου im Verhältnis zum mosaischen Gesetz
  choice: „Ende des Gesetzes“ im Haupttext
  alternative: „Ziel“, „Vollendung“ oder „Abschluss des Gesetzes“
  rationale: Das griechische τέλος kann sowohl einen Endpunkt als auch Ziel oder Vollendung bezeichnen. „Ende“ hält diese theologisch bedeutsame Spannung offen; die Alternativen werden in der Fußnote genannt.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Zusammenhang mit Israel, dem Gesetz und der Glaubensgerechtigkeit lässt den Titelcharakter deutlich hervortreten.
- issue: Beziehung von εἰς δικαιοσύνην zu παντὶ τῷ πιστεύοντι
  choice: 'Ergebnisbezogene Wiedergabe: „sodass jeder, der glaubt, Gerechtigkeit erlangt“'
  alternative: „zur Gerechtigkeit für jeden, der glaubt“
  rationale: Die deutsche Satzbildung macht die naheliegende Ziel- beziehungsweise Ergebnisrichtung verständlich, ohne festzulegen, ob εἰς ausschließlich Zweck oder ausschließlich Folge bezeichnet.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: gerechter Status / Rechtfertigung
  rationale: Der Haupttext behält den breiten Begriff bei und vermeidet es, ihn auf eine einzelne dogmatische Deutung zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die kompakte griechische Aussage wird leicht entfaltet, während die Mehrdeutigkeit von τέλος durch Haupttext und Fußnote erhalten bleibt.
