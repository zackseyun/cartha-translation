id: ROM.10.16
reference: Romans 10:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: de
  text: 'Doch nicht alle haben der guten Nachricht[a] Folge geleistet. Denn Jesaja sagt: »Herr, wer hat unserer Botschaft[b] geglaubt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Evangelium«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unserer Kunde«; wörtlich: »unserem Hören«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet knapp und natürlich den Gegensatz zum vorangehenden Gedankengang.
- source_word: οὐ πάντες
  choice: nicht alle
  rationale: Bewahrt die partielle Verneinung des Griechischen und behauptet keine ausnahmslose Ablehnung.
- source_word: ὑπήκουσαν
  choice: haben … gehorcht
  rationale: ὑπακούω bezeichnet Gehorsam und nicht bloßes Hören; das Perfekt ist im gegenwärtigen deutschen Zusammenhang idiomatisch.
- source_word: τῷ εὐαγγελίῳ
  choice: der guten Nachricht
  rationale: Gibt die Grundbedeutung von εὐαγγέλιον verständlich wieder; die traditionelle Wiedergabe »dem Evangelium« bleibt als Fußnote erhalten.
- source_word: Ἠσαΐας
  choice: Jesaja
  rationale: Übliche deutsche Namensform des Propheten.
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Schriftstelle als Begründung für die vorherige Aussage ein.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt das griechische Präsens und die Vorstellung der Schrift als gegenwärtig sprechender Stimme.
- source_word: Κύριε
  choice: Herr
  rationale: Natürliche und ehrerbietige Wiedergabe des Vokativs κύριε im heutigen Deutsch.
- source_word: τίς
  choice: wer
  rationale: Direkte Wiedergabe des Fragepronomens.
- source_word: ἐπίστευσεν
  choice: hat … geglaubt
  rationale: Das deutsche Perfekt gibt die im Rückblick betrachtete Reaktion auf die Verkündigung natürlich wieder.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: unserer Botschaft
  rationale: ἀκοή kann das Gehörte beziehungsweise die übermittelte Kunde bezeichnen. »Botschaft« ist im Kontext klar und idiomatisch; die wörtlichere Bedeutung bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Art der vom Evangelium geforderten Reaktion in ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: »der guten Nachricht gehorcht«
  alternative: »auf die gute Nachricht gehört« oder »der guten Nachricht Folge geleistet«
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Gehorsamssinn des Verbs und reduziert die Reaktion nicht auf bloßes Hören, ohne eine konfessionelle Heilsordnung einzutragen.
- issue: Bedeutung von ἀκοή im Jesajazitat
  choice: »Botschaft«
  alternative: »Kunde«, »Bericht« oder wörtlich »Hören«
  rationale: Gemeint sein kann sowohl das Hören als auch sein Inhalt. Im Zusammenhang ist der verkündete Inhalt am natürlichsten; die echte lexikalische Spannweite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Argumentationsgang, klingt jedoch natürlich. Die Schriftanführung steht im Präsens; die partielle Verneinung »nicht alle« und die Spannung zwischen Glauben und Gehorsam bleiben erhalten.
