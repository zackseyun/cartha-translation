id: ROM.10.8
reference: Romans 10:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: de
  text: Doch was sagt sie? »Das Wort ist dir nahe, in deinem Mund und in deinem Herzen.«[a] Damit ist das Wort des Glaubens gemeint, das wir verkünden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus greift hier 5. Mose 30,14 auf und bezieht dessen Worte auf die verkündete gute Botschaft.
    reason: cross_reference
  - marker: b
    text: 'Oder: »die Botschaft des Glaubens«. Das griechische Wort für »Glauben« kann je nach Zusammenhang auch »Vertrauen« oder »Treue« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Leitet den Gegensatz zum vorherigen Gedankengang natürlich und prägnant ein.
- source_word: τί λέγει
  choice: was sagt sie?
  rationale: Das feminine Pronomen nimmt im Deutschen sinngemäß die im Kontext sprechende Schrift auf, ohne »die Schrift« ausdrücklich in den Text einzufügen.
- source_word: Ἐγγύς σου
  choice: ist dir nahe
  rationale: Bewahrt die knappe räumlich-bildhafte Aussage des Zitats und klingt im Deutschen natürlich.
- source_word: τὸ ῥῆμα
  choice: das Wort
  rationale: Bewahrt die Wiederholung von ῥῆμα und lässt Paulus dessen Sinn anschließend näher bestimmen.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: in deinem Mund und in deinem Herzen
  rationale: Gibt die körperliche Bildsprache und die Parallelität des griechischen Textes direkt wieder.
- source_word: τοῦτ’ ἔστιν
  choice: Damit ist … gemeint
  rationale: Kennzeichnet idiomatisch, dass Paulus das angeführte Wort erläutert.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: das Wort des Glaubens
  rationale: Erhält sowohl die lexikalische Verbindung zum vorausgehenden »Wort« als auch die knappe, mehrdeutige Genitivkonstruktion.
- source_word: ὃ κηρύσσομεν
  choice: das wir verkünden
  rationale: Gibt den öffentlichen Herold- und Verkündigungscharakter von κηρύσσω in allgemein verständlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von πίστις in τὸ ῥῆμα τῆς πίστεως
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: »Glauben« entspricht hier dem üblichen paulinischen Sprachgebrauch, während die kompakte Genitivform offenlässt, ob der Glaube als Inhalt, Kennzeichen oder geforderte Antwort im Vordergrund steht.
- issue: Bezug des Schriftzitats
  choice: Im Haupttext bleibt der Sprecher nur durch »sie« angedeutet
  alternative: »Was sagt die Schrift?«
  rationale: Der griechische Text nennt die Schrift nicht ausdrücklich. Die Fußnote macht den Bezug auf 5. Mose 30,14 transparent, ohne die Ellipse im Haupttext vollständig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Schriftzitat bleibt bewusst knapp und bildhaft; »Wort des Glaubens« bewahrt die lexikalische Wiederholung und die theologische Offenheit des griechischen Genitivs.
