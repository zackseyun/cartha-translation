id: ROM.10.6
reference: Romans 10:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: de
  text: 'Die Gerechtigkeit[a] aber, die aus Glauben kommt, spricht so: »Sag nicht in deinem Herzen: ›Wer wird in den Himmel hinaufsteigen?‹«[b] – das heißt: den Messias[c] herabzuholen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gerechtigkeit“ kann hier auch den Gedanken von „Recht“ oder „Rechtschaffenheit“ einschließen.
    reason: lexical_alternative
  - marker: b
    text: Paulus greift 5. Mose 30,12 auf und bezieht die Aussage auf den Messias.
    reason: cross_reference
  - marker: c
    text: 'Griechisch: „Christus“; das Wort wird hier als Titel im Sinn von „Messias“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Der übliche paulinische Begriff bleibt erhalten und trägt im Deutschen sowohl die persönliche als auch die rechtlich-forensische Bedeutung.
- source_word: ἐκ πίστεως
  choice: die aus Glauben kommt
  rationale: Gibt ἐκ als Herkunft beziehungsweise Grundlage wieder und bildet einen natürlichen Gegensatz zur gesetzesbezogenen Gerechtigkeit im Kontext.
- source_word: πίστις
  choice: Glaube
  rationale: Hier bezeichnet das Wort am ehesten den Glauben beziehungsweise das Vertrauen; es liegt keine Genitivkonstruktion vor, die eine Wiedergabe mit „Treue“ nahelegen würde.
- source_word: οὕτως λέγει
  choice: spricht so
  rationale: Bewahrt die Personifikation der Gerechtigkeit und gibt die knappe griechische Wendung in natürlichem Deutsch wieder.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Sag nicht in deinem Herzen
  rationale: Nahe Wiedergabe der Schriftanknüpfung; „Herz“ bezeichnet hier das innere Denken und Wollen.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Wer wird in den Himmel hinaufsteigen?
  rationale: „Hinaufsteigen“ bewahrt die räumliche Bewegungsrichtung und den gehobenen Ton der Schriftanknüpfung.
- source_word: Χριστόν
  choice: den Messias
  rationale: Χριστός fungiert hier in der schriftbezogenen Argumentation als Titel; „Messias“ macht dessen Bedeutung transparent.
- source_word: καταγαγεῖν
  choice: herabzuholen
  rationale: Gibt die nach unten gerichtete Bewegung prägnant wieder und passt syntaktisch zur erläuternden Infinitivkonstruktion.
theological_decisions:
- issue: Personifikation der Gerechtigkeit aus Glauben
  choice: Die Gerechtigkeit spricht
  alternative: Das sagt die Gerechtigkeit aus Glauben
  rationale: δικαιοσύνη ist ausdrücklich das Subjekt von λέγει; die Personifikation und der rhetorische Gegensatz zum vorigen Vers bleiben erhalten.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle steht der Titel in einer heilsgeschichtlichen Auslegung der Schrift im Vordergrund. Eine Fußnote nennt die traditionelle, formnähere Wiedergabe.
- issue: Funktion des erklärenden Infinitivs τοῦτ’ ἔστιν … καταγαγεῖν
  choice: 'das heißt: um den Messias herabzuholen'
  alternative: das heißt, den Messias herabzuholen
  rationale: „Um … zu“ verdeutlicht, dass Paulus die unausgesprochene Folge beziehungsweise Zielrichtung der Frage erklärt, ohne zu behaupten, jemand könne den Messias tatsächlich herabholen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schriftton. Die direkte Rede und die Personifikation bleiben erhalten; „Sag“ vermeidet unnötig archaisches Deutsch, während „in deinem Herzen“ die biblische Bildsprache bewahrt.
