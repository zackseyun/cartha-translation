  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: de
  text: Also kommt der Glaube aus dem Hören, das Hören aber kommt durch das Wort des Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Wort über den Messias“ beziehungsweise „durch die Botschaft vom Messias“. Der griechische Genitiv kann verschieden verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Also
  rationale: Die Folgerungspartikel zieht einen Schluss aus dem vorangehenden Gedankengang; „also“ stellt diesen Zusammenhang im heutigen Deutsch klar und knapp her.
- source_word: πίστις
  choice: Glaube
  rationale: Im unmittelbaren Kontext bezeichnet das Wort die glaubende Antwort auf die verkündete Botschaft; „Glaube“ ist hier sachlich und sprachlich angemessen.
- source_word: ἐξ ἀκοῆς
  choice: kommt aus dem Hören
  rationale: ἐκ bezeichnet Ursprung oder Quelle. Das im griechischen Nominalsatz fehlende Verb wird im Deutschen idiomatisch mit „kommt“ ergänzt; „aus“ bewahrt die Herkunftsbeziehung.
- source_word: ἀκοή
  choice: Hören
  rationale: ἀκοή kann den Vorgang des Hörens oder das Gehörte bezeichnen. „Hören“ wahrt die Wiederholung beider Vorkommen und passt zum Zusammenhang von Verkündigung und glaubender Aufnahme.
- source_word: δὲ
  choice: aber
  rationale: δέ gliedert die zweite Aussage und setzt sie leicht von der ersten ab, ohne einen starken Gegensatz auszudrücken; das deutsche „aber“ bildet diese Struktur knapp ab.
- source_word: διὰ
  choice: durch
  rationale: διά mit dem Genitiv bezeichnet hier das Mittel beziehungsweise die Vermittlung; „durch“ entspricht dieser Beziehung direkt.
- source_word: ῥήματος
  choice: Wort
  rationale: ῥῆμα bezeichnet ein gesprochenes Wort oder eine Äußerung. „Wort“ bleibt nahe an der griechischen Ausdrucksweise und ist im Kontext verständlich.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός fungiert als Titel und wird daher mit „Messias“ wiedergegeben. Der Genitiv bleibt in der Hauptzeile formal als „des Messias“ erhalten; seine unterschiedliche mögliche Beziehung zu „Wort“ wird in der Fußnote erläutert.
theological_decisions:
- issue: Bedeutung von πίστις an dieser Stelle
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Römer 10,14–16 handelt von der menschlichen Antwort auf die gehörte Verkündigung. „Glaube“ gibt dies wieder, ohne den Begriff auf bloßes Fürwahrhalten einzuengen oder ihn als „Treue“ umzudeuten.
- issue: Beziehung des Genitivs Χριστοῦ zu ῥήματος
  choice: das Wort des Messias
  alternative: das Wort über den Messias; die Botschaft vom Messias
  rationale: Der griechische Genitiv kann auf ein vom Messias ausgehendes Wort oder auf ein Wort über den Messias bezogen werden. Die formal offene Hauptfassung und die Fußnote bewahren diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und die Wiederholung von „Hören“ bilden die rhetorische Form des griechischen Textes ab; die Genitivmehrdeutigkeit wird nicht stillschweigend aufgelöst.
