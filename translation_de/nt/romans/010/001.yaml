source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: de
  text: Brüder,[a] mein Herzenswunsch und mein Gebet zu Gott für sie gelten ihrer Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische maskuline Pluralform kann eine gemischte Gruppe anreden.
    reason: lexikalische Alternative und inklusive Reichweite der Anrede
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der griechische maskuline Plural ist eine übliche Anrede an die ganze Gemeinde. Im heutigen Deutschen gibt „Brüder und Schwestern“ die wahrscheinlich inklusive Anrede natürlich und eindeutig wieder; die formnähere Alternative steht in der Fußnote.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: der Wunsch meines Herzens
  rationale: εὐδοκία bezeichnet hier das innige Wollen oder Verlangen des Paulus. Die Genitivverbindung wird eng und würdevoll wiedergegeben.
- source_word: δέησις
  choice: Gebet
  rationale: Das Wort bezeichnet eine an Gott gerichtete Bitte oder ein Flehen. „Gebet“ ist im Satz natürlich; der Bittcharakter ergibt sich aus dem Ziel der Rettung.
- source_word: πρὸς τὸν θεόν
  choice: zu Gott
  rationale: πρός mit Akkusativ bezeichnet hier die Ausrichtung des Gebets.
- source_word: ὑπὲρ αὐτῶν
  choice: für sie
  rationale: ὑπέρ bezeichnet hier das Eintreten zugunsten anderer. Das Pronomen bleibt entsprechend dem griechischen Text erhalten; sein Bezug ergibt sich aus dem Kontext.
- source_word: εἰς σωτηρίαν
  choice: dass sie gerettet werden
  rationale: εἰς bezeichnet Ziel oder angestrebtes Ergebnis. Die finite deutsche Formulierung ist idiomatisch und macht den Bezug der Rettung auf „sie“ deutlich, ohne festzulegen, dass dieses Ziel bereits erreicht sei.
- source_word: μὲν
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel markiert leicht den Gedankengang beziehungsweise einen Kontrast, hat hier jedoch kein ausdrücklich korrespondierendes δέ. Eine eigene Wiedergabe würde im Deutschen unnötig schwer wirken.
theological_decisions:
- issue: Inklusive Reichweite der Anrede Ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Obwohl die griechische Form morphologisch maskulin ist, kann sie eine gemischte Gemeinde anreden. Die Haupttextfassung gibt diese kommunikative Reichweite im modernen Deutschen wieder; die formale Alternative wird in der Fußnote bewahrt.
- issue: Zielcharakter von εἰς σωτηρίαν
  choice: dass sie gerettet werden
  alternative: auf Rettung hin / zu ihrer Rettung
  rationale: Die Formulierung stellt die Rettung als Inhalt und Ziel von Wunsch und Gebet dar und behauptet nicht, dass die Errettung bereits eingetreten ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nah am griechischen Gedankengang, während der finale Ausdruck εἰς σωτηρίαν idiomatisch als Nebensatz wiedergegeben wird.
