revisions:
- from: 'Denn Mose schreibt über die Gerechtigkeit, die aus dem Gesetz kommt: »Der Mensch, der sie tut, wird durch sie leben.«[a][b]'
  to: 'Denn Mose schreibt über die Gerechtigkeit, die aus dem Gesetz kommt: »Der Mensch, der sie übt, wird in ihr leben.«[a][b]'
  rationale: Die Revision ersetzt die interpretierend-instrumentale Wendung »durch sie« durch die dem griechischen ἐν αὐτῇ entsprechende Formulierung »in ihr«. Zugleich wird »Gerechtigkeit tun« idiomatisch als »Gerechtigkeit üben« wiedergegeben, ohne den allgemeinen Aussagecharakter oder die Ambiguität des Zitats aufzulösen. Die Fußnote erläutert nun den tatsächlich im Text stehenden Singularbezug und die Anspielung auf 3. Mose 18,5.
