review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von γάρ, γράφει, δικαιοσύνη und »aus dem Gesetz« ist sachgerecht. Der vorliegende griechische Wortlaut hat jedoch ἐν αὐτῇ, wörtlich »in ihr«, mit femininem Singular; »durch sie« legt einen instrumentalen Sinn stärker fest, als der Text verlangt. Die Anlehnung an 3. Mose 18,5 rechtfertigt keine stillschweigende Angleichung an einen pluralischen Bezug.
  naturalness: »Gerechtigkeit üben« ist im modernen gehobenen Standarddeutsch eine natürlichere Verbindung als »Gerechtigkeit tun«. »In ihr leben« ist zwar bewusst nahe am Zitatwortlaut, aber verständlich und im biblisch-theologischen Register angemessen.
  terminology: »Gerechtigkeit« wahrt die paulinische Terminologie und die Verbindung zum unmittelbaren Kontext. »Der Mensch« gibt ἄνθρωπος als repräsentativen Singular angemessen wieder; die erläuternde Fußnote ist hilfreich.
  issues:
  - severity: medium
    issue: »durch sie« für ἐν αὐτῇ
    rationale: Die Präposition ἐν wird hier am sichersten mit »in« wiedergegeben. Eine instrumentale Übersetzung »durch« ist möglichkeitsbedingt, aber sie verengt den Sinn und entfernt sich vom Singularwortlaut des Textes.
  - severity: low
    issue: »der sie tut«
    rationale: Die Formulierung ist verständlich, klingt mit »Gerechtigkeit« jedoch weniger idiomatisch. »Der sie übt« erhält den allgemeinen, charakterisierenden Sinn des Partizips und ist im Deutschen natürlicher.
  - severity: low
    issue: Fußnote b bietet die quellentreuere Wiedergabe nur als Alternative
    rationale: Da »in ihr« die unmittelbare Form von ἐν αὐτῇ abbildet, sollte sie im Haupttext stehen; die Fußnote kann stattdessen die grammatische Singularform und das Levitenzitat erklären.
