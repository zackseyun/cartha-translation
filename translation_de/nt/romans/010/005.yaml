reference: Romans 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: de
  text: 'Denn Mose schreibt über die Gerechtigkeit, die aus dem Gesetz kommt: »Der Mensch, der sie übt, wird in ihr leben.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Der Mensch« bezeichnet hier allgemein jeden Menschen, der so handelt.
    reason: cultural_note
  - marker: b
    text: Das griechische Pronomen »ihr« ist feminin Singular und bezieht sich grammatisch auf »Gerechtigkeit«; Paulus greift 3. Mose 18,5 auf.
    reason: translation_note
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet die Begründung bzw. Erläuterung zum vorhergehenden Gedankengang und entspricht dem natürlichen deutschen Satzanschluss.
- source_word: γράφει
  choice: schreibt
  rationale: Bewahrt das Präsens der üblichen Schriftzitationsformel.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Der etablierte deutsche Ausdruck wahrt im Römerbrief sowohl den forensischen als auch den theologischen Bedeutungsgehalt.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: die aus dem Gesetz kommt
  rationale: Gibt ἐκ als Herkunft bzw. Quelle wieder und macht den Bezug auf δικαιοσύνη im Deutschen klar.
- source_word: νόμου
  choice: dem Gesetz
  rationale: Der Artikel und der paulinische Zusammenhang weisen auf das mosaische Gesetz als bekannte Größe.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: der Mensch, der sie tut
  rationale: Der substantivierte Aoristpartizip bezeichnet hier allgemein den Menschen, der die genannte Gerechtigkeit verwirklicht; das Präsens ist im Deutschen für diesen allgemeinen Grundsatz idiomatisch. Das Pronomen »sie« nimmt die feminine Singularform »Gerechtigkeit« auf.
- source_word: ζήσεται
  choice: wird … leben
  rationale: Entspricht dem Futur und bewahrt den Anklang an 3. Mose 18,5.
- source_word: ἐν αὐτῇ
  choice: durch sie
  rationale: Gibt ἐν instrumental wieder und bezieht das feminine Singularpronomen entsprechend dem vorliegenden griechischen Wortlaut auf die Gerechtigkeit; die formalere Wiedergabe »in ihr« bleibt in der Fußnote erhalten.
theological_decisions:
- issue: δικαιοσύνη im Gegensatz zwischen Gesetz und Glauben
  choice: Gerechtigkeit
  alternative: Recht bzw. gerechtes Handeln
  rationale: »Gerechtigkeit« bewahrt die zentrale Wortverbindung im Kontext von Römer 10 und legt nicht einseitig fest, ob Status, Handeln oder beides im Vordergrund steht.
- issue: Bezug von ποιήσας und αὐτῇ
  choice: der sie tut … durch sie
  alternative: der danach handelt … in ihr
  rationale: Der überlieferte Wortlaut hat ein feminines Singularpronomen, das sich grammatisch auf »Gerechtigkeit« beziehen lässt. Die Übersetzung folgt dieser Form, ohne den Satz stillschweigend an den pluralischen Wortlaut von 3. Mose 18,5 anzugleichen.
- issue: Repräsentative Bedeutung von ἄνθρωπος
  choice: der Mensch
  alternative: wer
  rationale: »Der Mensch« entspricht dem Singular des Ausgangstextes und ist im Deutschen allgemein auf jeden Menschen bezogen; die Fußnote verdeutlicht diese inklusive, repräsentative Funktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der syntaktischen und theologischen Spannung des griechischen Textes, vermeidet aber unnötig schwerfällige Nominalkonstruktionen.
