review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die beiden generalisierenden Verbformen idiomatisch mit „man“ wieder und bewahrt die instrumentale bzw. bezugsbezogene Parallelität von „mit dem Herzen“ und „mit dem Mund“. „Zur Gerechtigkeit“ und „zur Rettung“ bilden die parallelen εἰς-Wendungen angemessen ab, ohne deren Verhältnis als bloßes Ergebnis, Zweck oder Voraussetzung einseitig festzulegen.
  naturalness: „Denn mit dem Herzen glaubt man zur Gerechtigkeit, mit dem Mund aber bekennt man zur Rettung“ ist modernes, verständliches und zugleich dem würdigen paulinischen Register entsprechendes Standarddeutsch. Die leicht formale Kürze unterstützt die Struktur des griechischen Satzes.
  terminology: „Gerechtigkeit“ ist für δικαιοσύνη im Römerbrief die etablierte und ausreichend weite Wiedergabe. „Rettung“ gibt σωτηρία natürlich wieder und vermeidet eine unnötige dogmatische Verengung. „Bekennen“ trifft im Kontext des öffentlichen Bekenntnisses zu Jesus (V. 9) ὁμολογεῖται präzise. Die Fußnote ist korrekt verankert und weist sachgerecht auf die semantische Spannweite von δικαιοσύνη hin.
