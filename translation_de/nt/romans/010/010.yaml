id: ROM.10.10
reference: Romans 10:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: de
  text: Denn mit dem Herzen glaubt man zur Gerechtigkeit[a], mit dem Mund aber bekennt man zur Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl das Gerechtsein als auch Gerechtigkeit im Sinn von gerechtem Handeln oder Recht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: mit dem Herzen
  rationale: Der Dativ bezeichnet das Herz als den inneren Ort beziehungsweise das Organ des Glaubens. Die Formulierung bewahrt den Gegensatz zwischen innerem Glauben und äußerem Bekennen.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: πιστεύεται
  choice: glaubt man
  rationale: Die formal passive beziehungsweise mediale Verbform hat hier verallgemeinernde Bedeutung. Das unpersönliche „man glaubt“ ist im Deutschen natürlich und wahrt den allgemeinen Charakter der Aussage.
- source_word: εἰς δικαιοσύνην
  choice: zur Gerechtigkeit
  rationale: „Zur“ bewahrt knapp die Ziel- oder Ergebnisrichtung von εἰς, ohne das genaue Verhältnis zwischen Glauben und Gerechtigkeit weiter auszudeuten.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die sachlich und theologisch angemessene deutsche Entsprechung und kann sowohl den Status des Gerechtseins als auch gerechtes Handeln beziehungsweise Recht umfassen.
- source_word: στόματι
  choice: mit dem Mund
  rationale: Der Dativ steht parallel zu καρδίᾳ und bezeichnet den Mund als Organ des ausgesprochenen Bekenntnisses.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ macht die leichte Gegenüberstellung von innerem Glauben und äußerem Bekennen sichtbar, ohne beide gegeneinander auszuspielen.
- source_word: ὁμολογεῖται
  choice: bekennt man
  rationale: Die verallgemeinernde Form wird parallel zu πιστεύεται mit „man“ wiedergegeben. „Bekennen“ passt zum unmittelbaren Zusammenhang des Bekenntnisses zu Jesus als Herrn.
- source_word: εἰς σωτηρίαν
  choice: zur Rettung
  rationale: Die Formulierung erhält die Parallelität zu „zur Gerechtigkeit“ und lässt offen, ob εἰς vor allem Ziel oder Ergebnis bezeichnet.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: „Rettung“ ist eine natürliche, verständliche Wiedergabe von σωτηρία und bewahrt dessen gegenwärtige wie endzeitliche Bedeutungsweite.
theological_decisions:
- issue: Verhältnis von Glauben und Bekennen zu Gerechtigkeit und Rettung
  choice: Die beiden parallelen Aussagen werden ohne Erklärung einer heilslogischen Reihenfolge wiedergegeben.
  alternative: Das Bekennen lediglich als Beweis bereits empfangener Rettung oder als zusätzliches verdienstliches Werk auslegen.
  rationale: Der griechische Text verbindet beide Satzteile parallel durch εἰς. Die Übersetzung soll diese Zuordnung stehen lassen, ohne die theologische Spannung über den Wortlaut hinaus aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Wendung „zur Gerechtigkeit … zur Rettung“ ist bewusst leicht formal gehalten, um die Parallelstruktur und die offene Ziel-/Ergebnisbedeutung des griechischen εἰς zu bewahren.
