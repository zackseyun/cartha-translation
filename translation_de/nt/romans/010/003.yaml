id: ROM.10.3
reference: Romans 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: de
  text: Denn weil sie die Gerechtigkeit Gottes[a] nicht erkannten und ihre eigene Gerechtigkeit aufzurichten suchten, haben sie sich der Gerechtigkeit Gottes[b] nicht untergeordnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gerechtsein“ beziehungsweise „gerechtes Handeln“. Das griechische Wort kann Gerechtigkeit, einen rechten Stand vor Gott oder Gottes gerechtes Handeln bezeichnen; dies gilt für beide Vorkommen im Vers.'
    reason: lexical_alternative
  - marker: b
    text: „Gerechtigkeit Gottes“ kann auch als „Gerechtigkeit, die von Gott kommt“, oder als „Gottes eigene Gerechtigkeit“ verstanden werden. Die griechische Formulierung lässt mehrere miteinander verbundene Nuancen zu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: sie kannten … nicht
  rationale: Gibt den begleitenden, ursächlichen Umstand des griechischen Präsenspartizips natürlich wieder, ohne ausdrücklich vorsätzliche Ablehnung zu unterstellen.
- source_word: γὰρ
  choice: Denn
  rationale: Markiert den erklärenden Anschluss an den vorhergehenden Gedanken.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: Bewahrt den zentralen paulinischen Begriff, der sowohl Gottes Gerechtigkeit als auch das von Gott gewährte rechte Verhältnis zu ihm umfassen kann.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Die deutsche Genitivverbindung bleibt ebenso kompakt und lässt Besitz, Ursprung und Gottes rettendes gerechtes Handeln als mögliche Nuancen offen.
- source_word: ἰδίαν
  choice: ihre eigene
  rationale: Das substantivierte Adjektiv nimmt „Gerechtigkeit“ aus dem vorangehenden Ausdruck wieder auf, ohne die Wiederholung unnötig auszuschreiben.
- source_word: ζητοῦντες
  choice: suchten
  rationale: Bewahrt die Zielgerichtetheit des Präsenspartizips und lässt offen, wie erfolgreich oder bewusst dieses Streben war.
- source_word: στῆσαι
  choice: aufzurichten
  rationale: Entspricht dem bildhaften „hinstellen, aufrichten“ und bezeichnet hier den Versuch, die eigene Gerechtigkeit zu etablieren.
- source_word: ὑπετάγησαν
  choice: haben sie sich nicht untergeordnet
  rationale: Gibt die kontextuell medial verstandene Passivform idiomatisch wieder und bewahrt den Gedanken, sich nicht unter Gottes Gerechtigkeit zu stellen.
theological_decisions:
- issue: Bedeutung von „Gerechtigkeit Gottes“ im paulinischen Sprachgebrauch
  choice: Die mehrdeutige Genitivverbindung „Gerechtigkeit Gottes“ bleibt im Haupttext erhalten.
  alternative: „Gerechtigkeit von Gott“ oder „Gottes eigenes gerechtes Handeln“
  rationale: Der griechische Ausdruck kann Gottes eigene Gerechtigkeit, die von Gott kommende Gerechtigkeit und sein rettendes gerechtes Handeln anklingen lassen. Der Text soll diese theologische Spannung nicht auf eine einzige Deutung verengen.
- issue: Das Verhältnis zwischen Unkenntnis und fehlender Unterordnung
  choice: „kannten … nicht“ wird nicht als bloß schuldlose Unwissenheit oder ausdrücklich vorsätzliche Verwerfung präzisiert.
  alternative: „wollten nicht anerkennen“
  rationale: ἀγνοοῦντες bezeichnet fehlende Kenntnis oder fehlendes Erkennen; der Zusammenhang kann Verantwortung einschließen, doch der Wortlaut legt den Grad der Absicht nicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am argumentativen Zusammenhang des Griechischen; das Semikolon macht den Übergang von den beiden begleitenden Partizipien zur Hauptaussage klar. „Aufzurichten“ bewahrt die Bildlichkeit von στῆσαι, ohne eine bestimmte konfessionelle Deutung einzutragen.
