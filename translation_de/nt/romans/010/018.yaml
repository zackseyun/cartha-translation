id: ROM.10.18
reference: Romans 10:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: de
  text: 'Aber ich frage: Haben sie etwa nicht gehört? Doch, sehr wohl: »Über die ganze Erde ist ihr Schall ausgegangen[a] und ihre Worte bis an die Enden der bewohnten Welt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Stimme ist über die ganze Erde ausgegangen.«'
    reason: lexical_alternative
  - marker: b
    text: Paulus zitiert Psalm 19,5 (nach anderer Verszählung 19,4) und wendet dessen Sprache auf die Ausbreitung der Botschaft an.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: Haben sie etwa nicht gehört?
  rationale: Die rhetorische Frage erwartet eine bejahende Antwort. »Etwa nicht« gibt diese Erwartung im modernen Deutschen natürlich wieder; das Perfekt entspricht hier dem üblichen deutschen Erzähl- und Argumentationsstil.
- source_word: μενοῦνγε
  choice: Doch, sehr wohl
  rationale: Die nachdrückliche Partikel weist die unterstellte Verneinung entschieden zurück und bekräftigt, dass sie gehört haben.
- source_word: φθόγγος
  choice: Schall
  rationale: »Schall« gibt den hörbaren Klang wieder und wahrt gegenüber »Worte« den poetischen Parallelismus. »Stimme« bleibt als sinnvolle Alternative möglich.
- source_word: γῆ
  choice: Erde
  rationale: Im universal ausgerichteten Zitat bezeichnet γῆ die ganze Erde, nicht ein einzelnes Land.
- source_word: ἐξῆλθεν
  choice: ist … ausgegangen
  rationale: Das deutsche Perfekt gibt den Aorist idiomatisch wieder und lässt zugleich die fortwirkende Reichweite der Verkündigung erkennen, ohne sie zusätzlich auszudeuten.
- source_word: πέρατα
  choice: Enden
  rationale: Die feste Wendung »bis an die Enden« ist natürlich und erhält die poetische Bildsprache.
- source_word: οἰκουμένης
  choice: bewohnte Welt
  rationale: Die ausdrückliche Wiedergabe bewahrt die lexikalische Nuance der von Menschen bewohnten Welt.
- source_word: ῥήματα
  choice: Worte
  rationale: Die direkte Entsprechung wahrt den Parallelismus und vermeidet die interpretierende Festlegung auf »Botschaft«.
theological_decisions:
- issue: Bezug von »ihr« im Psalmzitat und in der Anwendung durch Paulus
  choice: Das Pronomen bleibt ohne erklärende Ergänzung stehen.
  alternative: »Ihr« ausdrücklich auf die Himmel aus Psalm 19 oder auf Verkündiger des Evangeliums beziehen.
  rationale: Paulus übernimmt die Sprache von Psalm 19 in seine Argumentation. Eine explizite Auflösung würde die intertextuelle und theologische Spannung beseitigen, die der griechische Text bestehen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Frage bleibt knapp und argumentativ; das Zitat behält seinen poetischen Parallelismus. »Bewohnte Welt« ist bewusst etwas formeller, um die Bedeutung von οἰκουμένη genau abzubilden.
