source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: de
  text: 'Über Israel aber sagt er[a]: »Den ganzen Tag habe ich meine Hände einem ungehorsamen[b] und widersprechenden[c] Volk entgegengestreckt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zu Israel aber sagt er.« Die griechische Wendung kann als Aussage über Israel oder als an Israel gerichtete Rede verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: »Ungehorsam« kann hier auch den Sinn »ungläubig« oder »nicht bereit, sich überzeugen zu lassen« einschließen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »sich widersetzenden«, »gegenredenden« oder »dagegen sprechenden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Über Israel aber
  rationale: πρός mit λέγει kann hier die Personengruppe bezeichnen, auf die sich die Aussage bezieht. »Über Israel« ist im Deutschen natürlich; die mögliche Auffassung als Rede an Israel bleibt in einer Fußnote erhalten.
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens der paulinischen Zitationsformel wird beibehalten. Das unausgesprochene Subjekt wird nicht ausdrücklich als Gott identifiziert.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Den ganzen Tag
  rationale: Natürliche deutsche Wiedergabe des Akkusativs der zeitlichen Ausdehnung.
- source_word: ἐξεπέτασα
  choice: habe ich … ausgestreckt
  rationale: Das deutsche Perfekt gibt die zitierte Handlung natürlich wieder und lässt ihre fortdauernde Bedeutung im Zusammenhang erkennen, ohne eine fortlaufende Verbform in den griechischen Aorist hineinzulesen.
- source_word: τὰς χεῖράς μου
  choice: meine Hände
  rationale: Die bildhafte, anthropomorphe Sprache des Ausgangstextes bleibt unverändert erhalten.
- source_word: πρὸς λαὸν
  choice: nach einem … Volk
  rationale: Bei »die Hände ausstrecken« bezeichnet »nach« im Deutschen idiomatisch die Richtung der zugewandten Geste.
- source_word: ἀπειθοῦντα
  choice: ungehorsamen
  rationale: Das Wort bezeichnet ein Nichtgehorchen beziehungsweise die Weigerung, sich überzeugen zu lassen. »Ungehorsam« bewahrt hier die willentliche und praktische Seite; die Überschneidung mit Unglauben wird angemerkt.
- source_word: ἀντιλέγοντα
  choice: widersprechenden
  rationale: Die Wiedergabe bewahrt den sprachlichen Aspekt von ἀντιλέγω, also das Gegenreden, und bringt zugleich aktive Opposition zum Ausdruck.
theological_decisions:
- issue: Charakterisierung der Reaktion Israels auf Gottes Zuwendung
  choice: »ungehorsamen und widersprechenden Volk«
  alternative: »ungläubigen und sich widersetzenden Volk«
  rationale: 'Die beiden Partizipien werden unterschieden wiedergegeben: Das erste umfasst verweigerten Glaubensgehorsam, das zweite aktives Gegenreden. So bleiben Gottes anhaltende Zuwendung und die menschliche Weigerung nebeneinander stehen, ohne weitergehende Aussagen über Israels Status in den Vers hineinzutragen.'
- issue: Bezug oder direkte Anrede Israels
  choice: »Über Israel aber sagt er«
  alternative: »Zu Israel aber sagt er«
  rationale: Die griechische Konstruktion lässt sowohl einen Bezug auf Israel als auch eine an Israel gerichtete Aussage zu. Der Haupttext wählt die im Kontext natürliche thematische Lesart; die andere Möglichkeit wird ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung lehnt sich an die paulinische Zitationsformel an, bleibt aber gut verständlich. Das Bild der ausgestreckten Hände und die beiden unterschiedlichen Formen des Widerstands werden bewahrt.
