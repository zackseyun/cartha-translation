  source_fidelity: 'Der Hauptsinn wird zutreffend wiedergegeben: Die Aussage bezieht sich auf Israel, die ausdauernde Geste des Sprechers bleibt erhalten, und beide Partizipien bezeichnen Ungehorsam sowie aktives Gegenreden. »Nach einem ... Volk« ist bei »die Hände ausstrecken« im heutigen Standarddeutsch jedoch nicht die natürlichste Richtungsangabe und kann eine nicht beabsichtigte Nuance des Ausstreckens nach etwas (etwa des Ergreifenwollens) nahelegen. »Einem ... Volk entgegengestreckt« gibt πρὸς λαόν idiomatisch und ohne Bedeutungszusatz wieder.'
  naturalness: »Einem ungehorsamen und widersprechenden Volk meine Hände entgegengestreckt« ist modernes, würdiges Deutsch und bewahrt das Bild. »Widersprechend« ist hier bewusst etwas formeller, aber verständlich und quellentreu.
