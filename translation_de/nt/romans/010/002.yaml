  source_fidelity: 'Der Satz gibt den griechischen Wortlaut insgesamt genau wieder: ζῆλον θεοῦ ist im Haupttext angemessen als auf Gott gerichteter Eifer verstanden, und „nicht nach Erkenntnis“ bewahrt die knappe, nicht weiter spezifizierte Aussage von οὐ κατ’ ἐπίγνωσιν. Allerdings bezeichnet αὐτοῖς bei μαρτυρῶ hier die Personen, über die Paulus Zeugnis ablegt, nicht die Adressaten eines Zeugnisses.'
