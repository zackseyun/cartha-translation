  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: de
  text: Denn ich bezeuge von ihnen, dass sie Eifer für Gott haben[a], aber nicht nach Erkenntnis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eifer Gottes“. Der griechische Genitiv kann so wörtlicher wiedergegeben werden; wahrscheinlich ist hier jedoch ein auf Gott gerichteter Eifer gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „nicht mit voller Erkenntnis“ oder „nicht auf Erkenntnis gegründet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: ich bezeuge
  rationale: Das Präsens und die unmittelbare Aussagekraft des Verbs bleiben erhalten; die Formulierung ist würdig und im Deutschen verständlich.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet den begründenden Anschluss an den vorhergehenden Vers knapp und natürlich.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet bei μαρτυρέω hier die Personen, denen Paulus ein Zeugnis ausstellt; die idiomatische deutsche Wendung „jemandem etwas bezeugen“ bewahrt den griechischen Dativ.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt des Zeugnisses direkt ein.
- source_word: ζῆλον
  choice: Eifer
  rationale: „Eifer“ gibt die Intensität religiöser Hingabe präzise und im modernen Standarddeutsch natürlich wieder.
- source_word: θεοῦ
  choice: für Gott
  rationale: 'Der Genitiv ist im Kontext wahrscheinlich objektiv zu verstehen: Der Eifer richtet sich auf Gott. Die echte grammatische Alternative wird in einer Fußnote bewahrt.'
- source_word: ἔχουσιν
  choice: sie haben
  rationale: Entspricht schlicht und direkt dem griechischen Präsens.
- source_word: ἀλλ’
  choice: aber
  rationale: Gibt den deutlichen Gegensatz zwischen anerkanntem Eifer und fehlender Erkenntnis wieder.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: nicht nach Erkenntnis
  rationale: Die knappe Formulierung wahrt die Konstruktion κατά mit Akkusativ und lässt offen, ob sachgemäße, wirkliche oder volle Erkenntnis gemeint ist.
theological_decisions:
- issue: Ausrichtung des Eifers Israels
  choice: Der Eifer richtet sich auf Gott, entspricht aber nicht der Erkenntnis.
  alternative: Sie haben einen „Eifer Gottes“ beziehungsweise einen von Gott stammenden Eifer.
  rationale: 'Im Zusammenhang ist θεοῦ am ehesten als objektiver Genitiv zu verstehen. So bleibt die Spannung bestehen: Die Ernsthaftigkeit ihres Eifers wird anerkannt, seine sachliche Angemessenheit jedoch verneint.'
- issue: Bedeutung von ἐπίγνωσις
  choice: Erkenntnis
  alternative: volle Erkenntnis; richtige Erkenntnis; eine auf Erkenntnis gegründete Haltung
  rationale: Der Haupttext vermeidet eine theologische Präzisierung, die über den Wortlaut hinausginge, und bewahrt die semantische Offenheit des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper paulinischer Argumentationsstruktur. „Nach Erkenntnis“ ist leicht gehoben, bewahrt aber die Form und Mehrdeutigkeit des griechischen Ausdrucks.
