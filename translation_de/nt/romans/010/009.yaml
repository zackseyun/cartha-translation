id: ROM.10.9
reference: Romans 10:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: de
  text: 'Denn wenn du mit deinem Mund bekennst: »Jesus ist der Herr«[a], und in deinem Herzen glaubst, dass Gott ihn von den Toten auferweckt hat, wirst du gerettet werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus als Herrn bekennst«; auch möglich: »den Herrn Jesus bekennst«.'
    reason: Die knappe griechische Verbindung κύριον Ἰησοῦν lässt eine prädikative Wiedergabe sowie kompaktere syntaktische Fassungen zu.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die kausale bzw. erläuternde Funktion im Deutschen natürlich wieder.
- source_word: ἐὰν
  choice: wenn
  rationale: Entspricht der real offenen Bedingung mit dem Konjunktiv; im Deutschen ist »wenn« hier idiomatischer als »falls«.
- source_word: ὁμολογήσῃς
  choice: bekennst
  rationale: Bewahrt den Sinn eines ausdrücklichen, mündlichen Bekennens beziehungsweise öffentlichen Anerkennens.
- source_word: ἐν τῷ στόματί σου
  choice: mit deinem Mund
  rationale: Gibt die instrumentale Wendung natürlich wieder und bewahrt zugleich das biblische Bild.
- source_word: κύριον Ἰησοῦν
  choice: »Jesus ist der Herr«
  rationale: Versteht den doppelten Akkusativ prädikativ und macht den Inhalt des Bekenntnisses im Deutschen ausdrücklich, ohne die kompaktere Deutung zu verschweigen.
- source_word: πιστεύσῃς
  choice: glaubst
  rationale: Ist bei dem folgenden Inhaltssatz die direkte und natürliche Entsprechung.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: in deinem Herzen
  rationale: Bewahrt die biblische Rede vom Herzen als Zentrum innerer Überzeugung, ohne sie psychologisch einzuengen.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Gott ihn ... auferweckt hat
  rationale: Das Perfekt ist im deutschen Inhaltssatz die natürliche Wiedergabe des griechischen Aorists für das vollzogene Auferweckungsgeschehen.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Etablierter deutscher Ausdruck für die Auferweckung aus dem Bereich beziehungsweise aus der Mitte der Toten.
- source_word: σωθήσῃ
  choice: wirst du gerettet werden
  rationale: Gibt das Futur Passiv wieder und erhält im paulinischen Zusammenhang den soteriologischen Sinn.
theological_decisions:
- issue: Wiedergabe von κύριος in der Bekenntnisformel
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« wahrt sowohl Jesu Autorität als auch die starke schriftbezogene Resonanz des Titels im unmittelbaren Zusammenhang, ohne dessen Bedeutung auf einen einzelnen Aspekt zu verengen.
- issue: Syntaktische Form von κύριον Ἰησοῦν
  choice: »Jesus ist der Herr«
  alternative: Jesus als Herrn
  rationale: Die Hauptfassung macht den Inhalt des Bekenntnisses als prädikative Aussage deutlich. Die grammatisch ebenfalls mögliche kompaktere Wiedergabe wird in der Fußnote erhalten.
- issue: Soteriologische Aussage von σωθήσῃ
  choice: wirst du gerettet werden
  alternative: wirst du befreit werden
  rationale: »Gerettet« entspricht dem Heilszusammenhang des Abschnitts, ohne näher festzulegen, wie die Rettung dogmatisch zu beschreiben ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede hebt den Bekenntnisinhalt klar hervor; die parallelen Wendungen »mit deinem Mund« und »in deinem Herzen« bleiben erhalten.
