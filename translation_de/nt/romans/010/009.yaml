  verdict: approve
  source_fidelity: Die Übersetzung gibt die Konditionalsatzstruktur sowie die beiden Inhalte von Bekenntnis und Herzensglauben zutreffend wieder. »Denn« ist für das anschließende ὅτι im Kontext angemessen. »Jesus ist der Herr« bringt die prädikative Deutung von κύριον Ἰησοῦν klar zum Ausdruck; »von den Toten auferweckt hat« und »wirst du gerettet werden« entsprechen dem griechischen Auferweckungs- bzw. Zukunftspassiv ohne sachliche Einengung.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Formulierung »mit deinem Mund bekennst« ist idiomatisch und wahrt die bewusste Parallelität zu »in deinem Herzen glaubst«. Die Zeichensetzung mit der als Bekenntnisinhalt markierten direkten Rede ist flüssig.
  terminology: Die Wiedergabe von κύριος durch »Herr« und von σωθήσῃ durch »gerettet werden« ist fachlich und im paulinischen Kontext treffend. Die Fußnote bietet die kompaktere syntaktische Alternative, ohne sie gegenüber der prädikativen Hauptfassung zu bevorzugen.
