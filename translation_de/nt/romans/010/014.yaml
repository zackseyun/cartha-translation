id: ROM.10.14
reference: Romans 10:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: de
  text: Wie sollen sie nun den anrufen, an den sie nicht geglaubt haben? Wie sollen sie aber an den glauben, von dem sie nichts gehört haben?[a] Wie sollen sie aber hören, ohne dass jemand verkündigt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie sollen sie aber an den glauben, über den sie nichts gehört haben?“'
    reason: Der griechische Genitiv bei ἀκούω kann hier mit „von dem“ oder ausdrücklich inhaltsbezogen mit „über den“ wiedergegeben werden; er bezeichnet nicht notwendig ein unmittelbares Hören der Person selbst.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Wie sollen sie nun
  rationale: „Wie sollen“ gibt den deliberativ-rhetorischen Konjunktiv im Deutschen natürlich wieder; „nun“ bewahrt die folgernde Kraft von οὖν.
- source_word: ἐπικαλέσωνται
  choice: anrufen
  rationale: „Anrufen“ bezeichnet hier das vertrauensvolle Anrufen bzw. Sich-Berufen auf den Herrn und wahrt den Anschluss an das vorangehende Schriftzitat.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: den, an den sie nicht geglaubt haben
  rationale: Die idiomatischen deutschen Konstruktionen „jemanden anrufen“ und „an jemanden glauben“ geben beide Beziehungen klar wieder; das Perfekt passt zur logischen Voraussetzung des Anrufens.
- source_word: πιστεύσωσιν
  choice: an den glauben
  rationale: „Glauben“ ist die sachlich und sprachlich naheliegende Wiedergabe von πιστεύω und erhält die paulinische Wort- und Gedankenkette.
- source_word: οὗ οὐκ ἤκουσαν
  choice: von dem sie nichts gehört haben
  rationale: Diese natürliche deutsche Formulierung gibt den wahrscheinlich gemeinten Inhalt des Hörens wieder, ohne die Person mit der Botschaft gleichzusetzen. Die mögliche Lesart des unmittelbaren Hörens dieser Person bleibt in der Fußnote erhalten.
- source_word: ἀκούσωσιν
  choice: hören
  rationale: „Hören“ ist die direkte Entsprechung und bewahrt die Wiederaufnahme des Verbs aus der vorherigen Frage.
- source_word: χωρὶς κηρύσσοντος
  choice: ohne dass jemand verkündigt
  rationale: Die finite deutsche Konstruktion gibt das substantivierte Partizip und die Tätigkeit des öffentlichen Verkündigens natürlich wieder, ohne ein bestimmtes Predigtamt vorauszusetzen.
theological_decisions:
- issue: Wiedergabe der πιστεύω-Wortgruppe
  choice: glauben / geglaubt haben
  alternative: vertrauen
  rationale: „Glauben“ wahrt die etablierte paulinische Begrifflichkeit und fügt keine zusätzliche Deutung des Verhältnisses hinzu.
- issue: Bezugsart des Hörens in οὗ οὐκ ἤκουσαν
  choice: von dem sie nichts gehört haben
  alternative: den sie nicht gehört haben
  rationale: Der griechische Genitiv bei ἀκούω lässt sowohl das Hören von jemandem als auch das Hören über jemanden zu. Der Haupttext verwendet die im Zusammenhang der Verkündigung natürlichere deutsche Lesart; die engere personale Möglichkeit wird nicht beseitigt, sondern in der Fußnote genannt.
- issue: κηρύσσοντος als Tätigkeit oder Amt
  choice: ohne dass jemand verkündigt
  alternative: ohne einen Verkündiger
  rationale: Das griechische Partizip hebt die vollzogene Tätigkeit hervor. Die Wiedergabe vermeidet daher, aus dem Vers ausdrücklich ein festes Amt abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache rhetorische Frage und ihre schrittweise Argumentation bleiben erhalten. Wiederholungen werden bewusst nicht geglättet; „verkündigt“ ist allgemein verständlich und gibt κηρύσσω präziser wieder als ein amtlich klingendes Substantiv.
