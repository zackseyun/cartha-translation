  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: de
  text: 'Doch Jesaja wagt es und sagt: »Ich wurde von denen gefunden[a], die mich nicht suchten; ich wurde denen sichtbar[b], die nicht nach mir fragten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich wurde unter denen gefunden, die mich nicht suchten.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich wurde denen offenbar« bzw. »ich gab mich denen zu erkennen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: wagt es sogar zu sagen
  rationale: Die Wendung gibt den Gedanken des kühnen, gewagten Redens natürlich wieder; καί verstärkt hier die Aussage.
- source_word: Εὑρέθην
  choice: Ich ließ mich finden
  rationale: Die deutsche Form bewahrt den passiven Sinn der göttlichen Selbstreferenz, klingt aber natürlicher als »Ich wurde gefunden« und vermeidet den Eindruck eines unbeabsichtigten Entdecktwerdens.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: von denen, die mich nicht suchten
  rationale: Obwohl ἐν formal »unter/bei« bedeutet, bezeichnet die Wendung im Zusammenhang idiomatisch die Menschen, von denen Gott gefunden wurde.
- source_word: ζητοῦσιν
  choice: suchten
  rationale: »Suchen« erhält die knappe Parallelität und den biblisch-theologischen Klang von ζητέω.
- source_word: ἐμφανὴς ἐγενόμην
  choice: ich wurde sichtbar
  rationale: Die Übersetzung bildet die prädikative Wendung eng ab und wahrt den Akzent auf dem Offenbarwerden, ohne sie ausdrücklich als reflexive Handlung zu paraphrasieren.
- source_word: ἐπερωτῶσιν
  choice: nach mir fragten
  rationale: »Nach mir fragen« gibt das Erkundigen wieder und passt natürlich zum parallelen »mich suchen«, ohne die speziellere Bedeutung »mich anrufen« einzutragen.
- source_word: δὲ
  choice: Doch
  rationale: »Doch« markiert knapp den Kontrast zum vorausgehenden Gedankengang.
- source_word: Ἠσαΐας
  choice: Jesaja
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
theological_decisions:
- issue: Göttliche Selbstoffenbarung im Jesajazitat
  choice: ich wurde denen sichtbar
  alternative: ich gab mich denen zu erkennen
  rationale: Die gewählte Fassung bewahrt die Form und Spannung von ἐμφανὴς ἐγενόμην, statt die Aussage ausdrücklich als reflexive göttliche Handlung auszulegen.
- issue: Passivform von Εὑρέθην
  choice: Ich ließ mich finden
  alternative: Ich wurde gefunden
  rationale: »Ließ mich finden« ist im Deutschen idiomatisch und bewahrt Gottes Selbsterschließung, ohne die paradoxe Aussage aufzuheben, dass ihn Menschen fanden, die ihn nicht suchten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Einleitung entspricht dem kühnen Charakter des Zitats; der Zitattext bleibt knapp und parallel gebaut.
