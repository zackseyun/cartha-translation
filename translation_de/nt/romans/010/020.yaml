    rationale: ἀποτολμᾷ bezeichnet das Wagnis bzw. kühne Reden; die zusätzliche Steigerung »sogar« ist möglich, aber nicht nötig. Die nähere Wiedergabe vermeidet eine nicht explizite Akzentuierung.
