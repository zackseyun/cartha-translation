  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: de
  text: 'oder: »Wer wird in den Abgrund[a] hinabsteigen?« – das heißt: den Messias[b] von den Toten heraufzuholen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Tiefe«. Paulus greift 5. Mose 30,13 auf, verwendet hier jedoch »Abgrund« und bezieht das Bild auf das Heraufholen des Messias von den Toten.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch »Christus«; hier als Titel mit »Messias« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: oder
  rationale: Leitet als einfache disjunktive Konjunktion die zweite rhetorische Frage ein und entspricht dem griechischen Satzfluss.
- source_word: Τίς καταβήσεται
  choice: Wer wird … hinabsteigen?
  rationale: Bewahrt die direkte rhetorische Frage und die Zukunftsform; „hinabsteigen“ erhält das räumliche Bild.
- source_word: εἰς τὴν ἄβυσσον
  choice: in den Abgrund
  rationale: Gibt ἄβυσσος konkret wieder und bewahrt sowohl den Anklang an eine unergründliche Tiefe als auch die im Kontext entstehende Nähe zum Totenreich, ohne beides gleichzusetzen.
- source_word: τοῦτ’ ἔστιν
  choice: das heißt
  rationale: Natürliche und genaue Wiedergabe der griechischen Erläuterungsformel.
- source_word: Χριστόν
  choice: den Messias
  rationale: Χριστός bezeichnet hier den Gesalbten als Titel; „Messias“ gibt den Bedeutungsgehalt wieder, statt das griechische Wort lediglich in eingedeutschter Form zu übernehmen.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Entspricht der etablierten deutschen Wiedergabe der idiomatischen Wendung und lässt sowohl den kollektiven als auch den zuständlichen Bezug anklingen.
- source_word: ἀναγαγεῖν
  choice: heraufzuholen
  rationale: Erhält die gerichtete räumliche Bewegung als Gegenstück zum Hinabsteigen. „Auferwecken“ wäre im Kontext sachlich naheliegend, würde den Wortlaut des Verbs jedoch stärker auslegen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: den Messias
  alternative: Christus
  rationale: An dieser Stelle funktioniert Χριστός als Titel. „Messias“ macht dessen semantischen Gehalt sichtbar, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Deutung von ἄβυσσος
  choice: Abgrund
  alternative: Tiefe; Totenreich
  rationale: „Abgrund“ bewahrt die Bildsprache und die Spannung zwischen dem Echo von 5. Mose 30,13 und der Anwendung auf das Heraufholen des Messias von den Toten. Eine Wiedergabe als „Totenreich“ würde die Metapher vorschnell festlegen.
- issue: Wiedergabe von ἀναγαγεῖν im Auferstehungskontext
  choice: heraufzuholen
  alternative: aufzuerwecken
  rationale: Die räumliche Bedeutung des Verbs wird erhalten; der Zusammenhang mit der Auferstehung bleibt durch „von den Toten“ klar, ohne ein spezifischeres Auferstehungsverb einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt knapp; „hinabsteigen“ und „heraufzuholen“ bewahren die gegenläufige räumliche Bildsprache des griechischen Textes.
