id: ROM.10.12
reference: Romans 10:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: de
  text: Denn es gibt keinen Unterschied zwischen Jude und Grieche[a]; denn derselbe Herr ist Herr über alle[b] und reich für alle, die ihn anrufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Grieche“; das Begriffspaar Jude/Grieche steht hier für den Gegensatz zwischen Juden und Nichtjuden. Manche Übersetzungen geben „Nichtjude“ wieder.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „derselbe Herr aller“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: Unterschied
  rationale: Das Substantiv bezeichnet hier die zwischen Gruppen gemachte Unterscheidung. „Unterschied“ ist im modernen Deutschen natürlich und bewahrt Paulus’ Aussage, ohne eine Wertung hinzuzufügen.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: Jude ... Grieche
  rationale: Der griechische Text nennt ausdrücklich den Griechen. Das Begriffspaar fungiert hier als Gegenüberstellung von Juden und Nichtjuden; die quellennähere Form bleibt im Haupttext erhalten.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: derselbe Herr ist Herr über alle
  rationale: Die Wiederholung von „Herr“ macht den nominalen Satz im Deutschen klar und würdig. „Über alle“ gibt πάντων idiomatisch wieder und bewahrt den Gedanken der Herrschaft.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ bewahrt den christologischen Titel und seine Resonanz im unmittelbaren Zusammenhang von Römer 10.
- source_word: πλουτῶν εἰς πάντας
  choice: reich für alle
  rationale: „Reich für alle“ erhält das Bild überströmender Fülle, klingt im Deutschen natürlicher als eine wörtliche Richtungsformulierung und lässt die folgende Bestimmung des Personenkreises stehen.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: die ihn anrufen
  rationale: „Anrufen“ ist die übliche und kontextgerechte Wiedergabe für das vertrauensvolle Rufen zum Herrn und verbindet den Vers mit Römer 10,13.
theological_decisions:
- issue: Bezug von „Herr“ im Kontext
  choice: Der Titel bleibt ohne erklärenden Zusatz stehen; im Zusammenhang verweist er auf den als Herrn bekannten Jesus und trägt zugleich den Schriftklang des Anrufens des Herrn.
  alternative: Allgemeiner Bezug auf Gott, ohne Christus näher zu bestimmen.
  rationale: Römer 10,9–13 spricht vom Bekenntnis zu Jesus als Herrn und zitiert anschließend Joel. Die Übersetzung legt den Bezug nicht durch eine Paraphrase fest, sondern lässt ihn aus dem Kontext hervortreten.
- issue: Reichweite von „alle“
  choice: „Alle“ wird durch „die ihn anrufen“ bestimmt.
  alternative: Eine uneingeschränkte Aussage über ausnahmslos jeden Menschen.
  rationale: Die Syntax verbindet die umfassende Zugänglichkeit über die Grenze zwischen Juden und Griechen hinweg mit der ausdrücklichen Bestimmung „die ihn anrufen“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die doppelte Begründung mit „denn“ folgt der Argumentationsstruktur des griechischen Textes; die Semikolonsetzung erleichtert den Satzfluss.
