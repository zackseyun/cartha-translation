source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: de
  text: 'Und wie sollen sie verkündigen, wenn sie nicht gesandt werden? Wie geschrieben steht: »Wie schön[a] sind die Füße derer, die Gutes als frohe Botschaft verkünden![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie willkommen« beziehungsweise »Wie passend zur rechten Zeit«. Das griechische Adjektiv kann neben Schönheit auch die willkommene, passende Ankunft des Boten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »die guten Dinge als frohe Botschaft verkünden«; sinngemäß auch: »die gute Nachricht bringen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: verkündigen
  rationale: Das Verb bezeichnet öffentliches Ausrufen oder Bekanntmachen. »Verkündigen« wahrt diesen breiten Sinn, ohne ihn auf eine förmliche Predigt einzuengen.
- source_word: ἀποσταλῶσιν
  choice: gesandt werden
  rationale: Der passive Aorist von ἀποστέλλω bezeichnet das Gesandtwerden durch einen anderen; die direkte Wiedergabe erhält die Abhängigkeit von einem Sender.
- source_word: καθὼς γέγραπται
  choice: Wie geschrieben steht
  rationale: Dies ist die geläufige, würdige deutsche Formel zur Einführung eines Schriftzitats.
- source_word: ὡραῖοι
  choice: schön
  rationale: Im Zitat bezeichnet das Adjektiv Schönheit oder Annehmlichkeit und kann zugleich den willkommenen, passenden Zeitpunkt der Ankunft anklingen lassen. »Schön« bewahrt das Bild am klarsten; die weitere Nuance steht in der Fußnote.
- source_word: πόδες
  choice: Füße
  rationale: Das konkrete Bild von den ankommenden Boten wird entsprechend dem griechischen Wortlaut beibehalten.
- source_word: εὐαγγελιζομένων
  choice: derer, die … als frohe Botschaft verkünden
  rationale: Das Partizip bezeichnet Menschen, die eine gute Nachricht überbringen oder verkünden. Die Formulierung passt zum Botenbild und vermeidet eine unnötige Einengung auf ein kirchliches Amt.
- source_word: τὰ ἀγαθά
  choice: Gutes
  rationale: Der substantivierte Plural bedeutet wörtlich »die guten Dinge« beziehungsweise »Gutes«. »Gutes« ist im Deutschen natürlich und unterscheidet den Inhalt der Botschaft vom Akt ihrer Verkündigung.
theological_decisions:
- issue: Bezug des Boten-Zitats auf die Evangeliumsverkündigung
  choice: Das aus Jesaja stammende Bild von gesandten Boten wird bewahrt, deren Ankunft wegen ihrer guten Nachricht begrüßt wird, ohne die Aussage auf ordinierte Prediger zu beschränken.
  alternative: κηρύξωσιν mit »predigen« und εὐαγγελιζομένων mit »das Evangelium predigen« wiederzugeben, was leichter an ein förmliches kirchliches Amt denken lässt.
  rationale: Paulus verbindet Sendung und Verkündigung; das Zitat selbst preist jedoch allgemein die Boten guter Nachricht. Die Übersetzung wahrt beides, ohne ein bestimmtes Amtsverständnis einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die rhetorische Frage und das anschauliche Schriftzitat bleiben erhalten. »Verkündigen« ist bewusst weiter als »predigen«; »Gutes als frohe Botschaft verkünden« bildet sowohl εὐαγγελίζομαι als auch τὰ ἀγαθά sichtbar ab.
