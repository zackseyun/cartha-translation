id: ROM.10.11
reference: Romans 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: de
  text: 'Denn die Schrift sagt: »Jeder, der an ihn glaubt, wird nicht beschämt werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer an ihn glaubt, wird nicht enttäuscht werden.«'
    reason: 'Lexikalische Alternative: καταισχύνω kann im Zusammenhang auch das Scheitern einer Hoffnung und damit ein Enttäuschtwerden ausdrücken; »Wer« ist eine natürliche Wiedergabe der generischen Konstruktion.'
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens steht in einer üblichen Zitationsformel und wird im Deutschen natürlich mit »die Schrift sagt« wiedergegeben.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorhergehende Aussage und bewahrt mit »Denn« den argumentativen Zusammenhang.
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: In der paulinischen Zitationsformel bezeichnet γραφή die Heilige Schrift; »die Schrift« ist die etablierte und natürliche deutsche Wiedergabe.
- source_word: Πᾶς ὁ πιστεύων
  choice: Jeder, der … glaubt
  rationale: Die substantivierte Partizipialkonstruktion ist allgemein und einschließlich gemeint. Diese Formulierung gibt ihren universalen Umfang in verständlichem Deutsch wieder.
- source_word: πιστεύων
  choice: glaubt
  rationale: πιστεύω bezeichnet hier den auf eine Person gerichteten Glauben beziehungsweise das Vertrauen; »glaubt« entspricht der geläufigen biblischen Ausdrucksweise.
- source_word: ἐπ’ αὐτῷ
  choice: an ihn
  rationale: ἐπί mit Dativ bezeichnet bei πιστεύω das vertrauende Sichstützen auf eine Person. Idiomatisches Deutsch verwendet dafür »an ihn glauben«.
- source_word: καταισχυνθήσεται
  choice: wird nicht beschämt werden
  rationale: Die passive Zukunftsform wird bewahrt. »Beschämt werden« lässt die öffentliche Schande beziehungsweise die ausbleibende Enttäuschung im Hintergrund des Jesajazitats anklingen.
theological_decisions:
- issue: Generische maskuline Form in Πᾶς ὁ πιστεύων
  choice: Jeder, der … glaubt
  alternative: Wer an ihn glaubt
  rationale: Das grammatische Maskulinum ist nicht auf Männer beschränkt, sondern hat generische Bedeutung. »Jeder« wahrt den ausdrücklich universalen Akzent von πᾶς.
- issue: Bezugswort von αὐτῷ
  choice: ihn
  alternative: den Herrn / Christus
  rationale: Der unmittelbare Zusammenhang bestimmt den Bezug, doch die Übersetzung behält das Pronomen des Zitats bei und fügt keine auslegende Identifizierung in den Haupttext ein.
- issue: Bedeutungsnuance von καταισχυνθήσεται
  choice: wird nicht beschämt werden
  alternative: wird nicht enttäuscht werden / wird sich nicht schämen müssen
  rationale: Die gewählte passive Form folgt der griechischen Grammatik und bewahrt die Spannung zwischen öffentlicher Beschämung, Schande und enttäuschter Hoffnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Zitat, ohne unnatürlich zu wirken. Der passive Ausdruck und die inhaltliche Mehrdeutigkeit von καταισχυνθήσεται werden im Haupttext beziehungsweise in der Fußnote erhalten.
