source:
  edition: SBLGNT
  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: de
  text: Das heißt jedoch nicht, dass das Wort Gottes versagt hätte. Denn nicht alle, die von Israel abstammen,[a] sind Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die aus Israel sind“. Die griechische Wendung bezeichnet hier Herkunft oder Abstammung.'
    reason: lexical_alternative
  - marker: b
    text: Das zweite „Israel“ wird offenbar enger gebraucht als das erste. Der Satz unterscheidet zwischen Abstammung von Israel und dem, was Paulus hier als „Israel“ bezeichnet; den genauen Umfang dieser Bezeichnung bestimmt er in diesem Satz nicht.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Doch es ist nicht so, als
  rationale: Die idiomatische Wendung weist eine mögliche Schlussfolgerung aus dem vorangehenden Zusammenhang zurück; die deutsche Formulierung ist natürlich und bewahrt den korrigierenden Charakter.
- source_word: ἐκπέπτωκεν
  choice: hinfällig geworden
  rationale: Das Perfekt bezeichnet einen eingetretenen Zustand. Im Blick auf Gottes Wort gibt die Wendung wieder, dass es nicht unwirksam geworden oder gescheitert ist.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die formnahe Wiedergabe lässt offen, ob besonders Gottes Verheißungswort oder sein Wort im weiteren Sinn gemeint ist.
- source_word: οὐ γὰρ πάντες
  choice: Denn nicht alle
  rationale: „Denn“ erhält die begründende Funktion von γάρ und führt Paulus’ Erklärung für die vorherige Aussage ein.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: die von Israel abstammen
  rationale: ἐξ bezeichnet hier Herkunft beziehungsweise Abstammung. Die ausdrückliche Wiedergabe ist im Deutschen klarer als das mehrdeutige „aus Israel“.
- source_word: οὗτοι Ἰσραήλ
  choice: sind Israel
  rationale: Die knappe Gleichsetzung bewahrt Paulus’ pointierten Kontrast zwischen der Abstammung von Israel und „Israel“ im engeren Sinn.
theological_decisions:
- issue: Bedeutung des zweiten Vorkommens von „Israel“
  choice: Der Haupttext lässt „Israel“ ohne erläuternden Zusatz stehen; die Fußnote weist lediglich auf den engeren Sinn hin.
  alternative: „Israel“ ausdrücklich als die Erwählten innerhalb des ethnischen Israel oder umfassend als das wahre Volk Gottes bestimmen.
  rationale: Der unmittelbare Kontext unterscheidet Abstammung von Israel und Israel im engeren, heilsgeschichtlichen Sinn, legt aber in diesem Satz dessen genauen Umfang nicht ausdrücklich fest. Diese Spannung soll nicht konfessionell aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinfällig geworden“ vermittelt das Bild eines Wortes, das seine Geltung oder Wirksamkeit verloren hätte, ohne λόγος vorschnell auf „Verheißung“ einzuengen. Die Marker stehen jeweils unmittelbar bei der erläuterten Aussage.
