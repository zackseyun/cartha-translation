id: ROM.9.22
reference: Romans 9:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: de
  text: Was aber, wenn Gott[a], der seinen Zorn erweisen und seine Macht[b] bekannt machen wollte, mit großer Geduld Gefäße des Zorns ertrug, die zum Verderben bereitet waren[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn aber“. Im Griechischen beginnt hier ein rhetorischer Bedingungssatz, der im nächsten Vers weitergeführt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was ihm möglich ist“ beziehungsweise „seine Kraft“. Gemeint ist hier Gottes Macht.'
    reason: lexical_alternative
  - marker: c
    text: Das Passiv „zum Verderben bereitet“ sagt nicht, wer diese Gefäße bereitet hat. Umstritten ist, ob Gottes Handeln, Selbstverhärtung oder lediglich ein Zustand der Bereitschaft zum Gericht gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Was aber, wenn
  rationale: Gibt die rhetorische Bedingung wieder, deren Satzgefüge erst im folgenden Vers weitergeführt wird, ohne Vers 22 künstlich zu einem vollständigen Satz zu machen.
- source_word: θέλων
  choice: der … wollte
  rationale: Die relative Formulierung gibt das auf Gott bezogene Partizip natürlich wieder und legt nicht fest, ob es kausal oder konzessiv zu verstehen ist.
- source_word: ἐνδείξασθαι τὴν ὀργήν
  choice: seinen Zorn erweisen
  rationale: „Erweisen“ bezeichnet hier das wirksame, erkennbare Zeigen; „Zorn“ bewahrt den gewichtigen, gerichtlichen Sinn des paulinischen Ausdrucks.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: seine Macht bekannt machen
  rationale: Die Formulierung gibt den kausativen Sinn von γνωρίσαι und die kontextuelle Bedeutung des substantivierten δυνατός klar und idiomatisch wieder.
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: mit großer Geduld … ertrug
  rationale: Im Zusammenhang bezeichnet φέρω geduldiges Ertragen; μακροθυμία wird in verständlichem Gegenwartsdeutsch als „Geduld“ wiedergegeben.
- source_word: σκεύη ὀργῆς
  choice: Gefäße des Zorns
  rationale: Bewahrt das Töpfer- und Gefäßbild des unmittelbaren Zusammenhangs sowie die knappe, nicht weiter ausgedeutete Genitivverbindung.
- source_word: κατηρτισμένα εἰς ἀπώλειαν
  choice: die zum Verderben bereitet waren
  rationale: Gibt den resultativen Zustand des Perfektpartizips wieder, ohne einen Urheber der Vorbereitung zu nennen; „Verderben“ drückt Ziel beziehungsweise Ausgang aus.
theological_decisions:
- issue: Urheberschaft bei κατηρτισμένα („bereitet“)
  choice: Das Passiv bleibt ohne Angabe dessen, der die Gefäße bereitet hat.
  alternative: Ausdrücklich Gott als Urheber nennen; Selbstverhärtung annehmen; oder lediglich ihre Eignung beziehungsweise Bereitschaft zum Gericht ausdrücken.
  rationale: Das griechische Perfekt Passiv beschreibt einen erreichten Zustand, nennt aber keinen Handelnden. Die Übersetzung bewahrt diese theologisch bedeutsame Offenheit.
- issue: Funktion des mit εἰ eröffneten, unvollständigen Bedingungssatzes
  choice: Die rhetorische Bedingung wird mit „Was aber, wenn“ eröffnet und über die Versgrenze hinweg offengehalten.
  alternative: „Wenn aber“ verwenden oder Vers 22 als direkte, in sich abgeschlossene Aussage formulieren.
  rationale: Der griechische Satz wird in Vers 23 fortgesetzt. Eine abgeschlossene Aussage in Vers 22 würde die syntaktische und rhetorische Spannung vorschnell auflösen.
- issue: Verhältnis des Partizips θέλων zum Hauptverb ἤνεγκεν
  choice: 'Neutrale relative Wiedergabe: „der … wollte“.'
  alternative: 'Kausal: „weil er … wollte“; konzessiv: „obwohl er … wollte“; temporal/begleitend: „während er … wollte“.'
  rationale: Das Partizip allein legt die logische Beziehung nicht eindeutig fest. Die relative Formulierung vermeidet eine dogmatisch relevante Überbestimmung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle Bild „Gefäße des Zorns“ bleibt wegen des unmittelbaren Töpfermotivs erhalten. Der Satz endet bewusst mit einem Komma, da die griechische Konstruktion in Römer 9,23 weiterläuft.
