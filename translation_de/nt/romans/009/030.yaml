source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: de
  text: Was sollen wir nun sagen? Dass die Nichtjuden[a], die nicht nach Gerechtigkeit[b] strebten, Gerechtigkeit erlangt haben – und zwar die Gerechtigkeit aus Glauben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Völker“; gemeint sind hier die nichtjüdischen Völker beziehungsweise Menschen.'
    reason: lexical_alternative
  - marker: b
    text: „Gerechtigkeit“ kann hier moralische Rechtschaffenheit, Recht beziehungsweise einen gerechten Stand vor Gott einschließen. Das gilt auch für die weiteren Vorkommen im Vers.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „die Gerechtigkeit, die durch Glauben kommt“; weniger wahrscheinlich ist hier: „die Gerechtigkeit aus Treue“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Was sollen wir nun sagen?
  rationale: Die Formulierung gibt die typische paulinische Übergangsfrage und den abwägenden Sinn des Futurs idiomatisch wieder.
- source_word: ἔθνη
  choice: die Nichtjuden
  rationale: Im Zusammenhang bezeichnet der Ausdruck die nichtjüdischen Menschen im Gegenüber zu Israel. „Nichtjuden“ ist im heutigen Deutsch klarer und weniger missverständlich als „Heiden“.
- source_word: τὰ μὴ διώκοντα
  choice: die nicht nach … strebten
  rationale: „Nach etwas streben“ gibt die zielgerichtete und anhaltende Bedeutung von διώκω natürlich wieder.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die moralische, rechtliche und relationale Weite des paulinischen Begriffs, ohne ihn auf eine einzelne dogmatische Deutung festzulegen.
- source_word: κατέλαβεν
  choice: erlangt haben
  rationale: Das Verb bezeichnet hier das Erreichen beziehungsweise Erlangen dessen, wonach zuvor nicht gestrebt wurde. Der deutsche Plural richtet sich grammatisch nach „Nichtjuden“.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: und zwar die Gerechtigkeit aus Glauben
  rationale: Die Wiederholung präzisiert die Art der Gerechtigkeit. „Und zwar“ gibt die erläuternd-einschränkende Funktion von δέ im Deutschen natürlicher wieder als ein stark kontrastierendes „aber“.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glauben“ ist hier die naheliegende Wiedergabe von πίστις; „aus Glauben“ hält sich eng an ἐκ πίστεως und vermeidet eine dogmatische Erweiterung.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im paulinischen Gedankengang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; gerechter Stand vor Gott; Bundesgerechtigkeit
  rationale: Der Vers entfaltet die genaue Art dieser Gerechtigkeit nicht vollständig. Die breite deutsche Entsprechung „Gerechtigkeit“ lässt die moralischen, forensischen und relationalen Aspekte offen.
- issue: Sinn von ἐκ πίστεως
  choice: aus Glauben
  alternative: durch Glauben; aus Treue
  rationale: Die möglichst direkte Wiedergabe bewahrt die Herkunfts- beziehungsweise Ursprungsbeziehung von ἐκ und vermeidet Zusätze wie „allein“, die nicht im griechischen Text stehen.
- issue: Funktion von δέ in der Schlusswendung
  choice: und zwar
  alternative: aber; nämlich
  rationale: Die wiederholte, durch den Artikel näher bestimmte „Gerechtigkeit“ präzisiert hier vor allem, welche Gerechtigkeit gemeint ist. Zugleich bleibt durch die erläuternde Hervorhebung die einschränkende Spannung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nichtjuden“ vermeidet die heute leicht abwertend oder religionsgeschichtlich anders verstandene Bezeichnung „Heiden“. Die Satzstruktur folgt der rhetorischen Frage und der anschließenden Präzisierung des griechischen Textes.
