id: ROM.9.21
reference: Romans 9:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: de
  text: Oder hat der Töpfer nicht die Vollmacht über den Ton[a][d], aus derselben Masse[b] das eine Gefäß zur Ehre und das andere zur Unehre zu machen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hat der Töpfer nicht das Recht, über den Ton zu verfügen?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus demselben Klumpen“ beziehungsweise „aus demselben Gemenge“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das eine Gefäß zu ehrenvollem Gebrauch und das andere zu gewöhnlichem Gebrauch“.'
    reason: alternative_reading
  - marker: d
    text: Das Bild erinnert an alttestamentliche Stellen über den Töpfer und den Ton, etwa Jesaja 29,16; 45,9 und Jeremia 18,1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet im Gedankengang des Paulus die nächste rhetorische Frage ein, ohne zusätzliche Betonung einzutragen.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: hat ... nicht die Vollmacht
  rationale: ἐξουσία bezeichnet hier eine rechtmäßige Befugnis oder Verfügungsgewalt, nicht bloß die Fähigkeit, etwas zu tun. „Vollmacht“ bewahrt diesen Sinn und passt zur rhetorischen Frage.
- source_word: ὁ κεραμεὺς
  choice: der Töpfer
  rationale: Die übliche und genaue Bezeichnung für den Handwerker, der Ton formt; zugleich bleibt das prophetische Töpfer-Ton-Bild erkennbar.
- source_word: τοῦ πηλοῦ
  choice: über den Ton
  rationale: Der Genitiv bei ἐξουσία wird im Deutschen idiomatisch mit „Vollmacht über“ wiedergegeben und bezeichnet den Bereich, über den der Töpfer verfügen darf.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: aus derselben Masse
  rationale: φύραμα bezeichnet eine vermischte oder zusammengefügte Masse. „Masse“ ist im Deutschen im Zusammenhang mit Ton natürlich und lässt die stoffliche Bedeutung offen.
- source_word: ποιῆσαι
  choice: zu machen
  rationale: Gibt das schlichte Verb ποιέω direkt und verständlich wieder, ohne die Art des Formens stärker auszudeuten.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: das eine ... und das andere
  rationale: Bildet die korrelative Gegenüberstellung des Griechischen klar und natürlich nach.
- source_word: εἰς τιμὴν
  choice: zur Ehre
  rationale: Bewahrt die ausdrückliche Ehr-Kategorie des griechischen Textes, ohne sie vorschnell als bestimmte Gebrauchsart auszulegen.
- source_word: σκεῦος
  choice: Gefäß
  rationale: Passt unmittelbar zum Bild des Töpfers und ist im heutigen Deutschen verständlich.
- source_word: εἰς ἀτιμίαν
  choice: zur Unehre
  rationale: Erhält den direkten Gegensatz zu τιμή und lässt die im Text bestehende Offenheit zwischen Status, Bestimmung und Gebrauch bestehen.
theological_decisions:
- issue: Ob ἐξουσία als „Vollmacht“, „Recht“ oder bloße „Macht“ wiederzugeben ist
  choice: Vollmacht
  alternative: Recht; Macht
  rationale: „Vollmacht“ bezeichnet rechtmäßige Verfügungsbefugnis und vermeidet es, den Vers entweder auf bloße Fähigkeit zu reduzieren oder mit einer weiter ausgearbeiteten Lehre über göttliche Souveränität und menschliche Verantwortung gleichzusetzen.
- issue: Ob εἰς τιμὴν / εἰς ἀτιμίαν funktional als ehrenvoller beziehungsweise gewöhnlicher Gebrauch erklärt werden soll
  choice: zur Ehre ... zur Unehre
  alternative: zu ehrenvollem Gebrauch ... zu gewöhnlichem Gebrauch
  rationale: Der griechische Wortlaut verwendet unmittelbar Ehr- und Unehre-Kategorien. Die gewählte Fassung erhält diese Spannung und engt das Bild nicht auf den häuslichen Gebrauch der Gefäße ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und das knappe Töpferbild bleiben erhalten. „Vollmacht“, „zur Ehre“ und „zur Unehre“ bewahren die rechtliche sowie die theologische Offenheit des griechischen Wortlauts; die Fußnoten nennen natürlichere oder stärker funktionale Alternativen.
