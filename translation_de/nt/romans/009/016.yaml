  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: de
  text: Folglich[a] kommt es nicht auf den an, der will, auch nicht auf den, der läuft[b], sondern auf Gott, der sich erbarmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Folglich also: nicht des Wollenden und auch nicht des Laufenden, sondern des sich erbarmenden Gottes.“ Der griechische Satz ist verkürzt; was genau nicht vom menschlichen Wollen oder Laufen abhängt, ergibt sich aus dem Zusammenhang von Gottes Vorsatz und Erbarmen.'
    reason: lexical_alternative
  - marker: b
    text: „Läuft“ steht wörtlich im griechischen Text und bezeichnet hier wahrscheinlich bildhaft menschliche Anstrengung oder eifriges Bemühen.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Also … nun
  rationale: Die beiden folgernden Partikeln kennzeichnen nachdrücklich die Schlussfolgerung aus dem vorangehenden Gedankengang. Die im Deutschen geteilte Wendung klingt natürlich und bewahrt diese logische Funktion.
- source_word: οὐ τοῦ θέλοντος
  choice: nicht auf den …, der will
  rationale: Das substantivierte Partizip bezeichnet den Wollenden. In Verbindung mit der ergänzten Wendung „es kommt auf … an“ wird der griechische Genitiv idiomatisch wiedergegeben, ohne den Gegenstand der Aussage enger festzulegen.
- source_word: οὐδὲ τοῦ τρέχοντος
  choice: und auch nicht auf den, der läuft
  rationale: τρέχω bedeutet wörtlich „laufen“. Das konkrete Bild bleibt im Haupttext erhalten, während die mögliche übertragene Bedeutung menschlichen Bemühens in der Fußnote erläutert wird.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der vorausgehenden Verneinung drückt „sondern“ den starken Gegensatz im Deutschen präzise und idiomatisch aus.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: auf Gott, der sich erbarmt
  rationale: Die Formulierung bewahrt den verbalen Charakter des Partizips und stellt Gottes Erbarmen als Handlung dar.
- source_word: implied predicate/expression
  choice: kommt es … auf … an
  rationale: Der griechische Satz ist elliptisch und enthält kein ausdrücklich genanntes Bezugswort oder Prädikat. Die deutsche Ergänzung gibt den Sinn verständlich wieder, ohne ausdrücklich „Rettung“, „Erwählung“ oder „Gottes Entscheidung“ einzusetzen.
theological_decisions:
- issue: Elliptischer Bezug und Umfang der Aussage
  choice: Die unpersönliche Wendung „es kommt … nicht auf … an“ verwenden und den Bezug im Haupttext nicht ausdrücklich benennen.
  alternative: „Es liegt also nicht am Wollenden oder Laufenden“ beziehungsweise eine ausdrückliche Ergänzung wie „Die Rettung hängt nicht …“ oder „Gottes Erwählung hängt nicht …“.
  rationale: Der unmittelbare Zusammenhang betrifft Gottes Vorsatz und Erbarmen, doch der griechische Wortlaut lässt das Bezugswort unausgesprochen. Die gewählte Fassung bewahrt diese Offenheit und vermeidet eine konfessionell verengende Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist für heutige Leser verständlich, erhält aber mit „läuft“ das konkrete paulinische Bild und mit der unpersönlichen Konstruktion die Ellipse des Ausgangstextes.
