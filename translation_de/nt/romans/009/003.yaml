id: ROM.9.3
reference: Romans 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: de
  text: Denn ich könnte wünschen, ich selbst wäre verflucht[b] und vom Messias getrennt – um meiner Brüder[a] willen, meiner Volksgenossen[c] nach der Abstammung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ meint Paulus hier seine israelitischen Volksgenossen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ein Fluch, getrennt vom Messias“ beziehungsweise „unter einem Fluch und vom Messias getrennt“. Die griechische Wendung verbindet den Gedanken des Verfluchtseins mit der Trennung vom Messias.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „meiner Verwandten dem Fleisch nach“. Gemeint sind die leibliche Abstammung beziehungsweise die ethnische Zugehörigkeit, nicht die „sündige Natur“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: ich könnte wünschen
  rationale: Der Imperfekt von εὔχομαι drückt hier im Zusammenhang einen hypothetischen, kaum aussprechbaren Wunsch aus, nicht einfach einen vergangenen Wunsch oder ein tatsächlich gesprochenes Gebet.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt die begründende Verbindung zum vorhergehenden Gedankengang.
- source_word: ἀνάθεμα
  choice: verflucht
  rationale: Gibt den Gedanken wieder, unter einem Fluch beziehungsweise dem Verderben preisgegeben zu sein, ohne das wenig verständliche Fremdwort „Anathema“ zu verwenden.
- source_word: αὐτὸς ἐγώ
  choice: selbst
  rationale: Erhält die starke persönliche Betonung des griechischen Ausdrucks in natürlichem Deutsch.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: vom Messias getrennt
  rationale: ἀπό bezeichnet hier Trennung; „vom Messias getrennt“ macht diesen Sinn ausdrücklich, während „Messias“ den Titelcharakter von Χριστός wahrt.
- source_word: ὑπὲρ
  choice: um ... willen
  rationale: Drückt den benefaktiven und stellvertretend klingenden Bezug in diesem Zusammenhang idiomatisch aus.
- source_word: τῶν ἀδελφῶν μου
  choice: meiner Brüder
  rationale: Bewahrt die grammatisch maskuline Form; aus dem folgenden Ausdruck geht hervor, dass Paulus seine israelitischen Volksgenossen meint.
- source_word: τῶν συγγενῶν μου κατὰ σάρκα
  choice: meiner leiblichen Verwandten
  rationale: Gibt die physische beziehungsweise ethnische Abstammung in gegenwärtigem Deutsch wieder und vermeidet die falsche Deutung als „sündige Natur“.
theological_decisions:
- issue: Tatsächliches Gebet oder hypothetischer Wunsch
  choice: „ich könnte wünschen“ als hypothetische Aussage
  alternative: „ich wünschte“ oder „ich betete“
  rationale: Die Formulierung bewahrt die außerordentliche Intensität der Aussage, ohne zu behaupten, Paulus habe tatsächlich um die Trennung vom Messias gebetet.
- issue: Verhältnis von ἀνάθεμα und ἀπὸ τοῦ Χριστοῦ
  choice: „verflucht und vom Messias getrennt“
  alternative: „vom Messias her verflucht“ oder „ein Fluch, fort vom Messias“
  rationale: Die gewählte Fassung gibt sowohl den Fluchgedanken als auch die durch ἀπό bezeichnete Trennung wieder. Eine Fußnote weist darauf hin, dass das Griechische beide enger miteinander verbinden kann.
- issue: Titelcharakter von Χριστός
  choice: „Messias“
  alternative: „Christus“
  rationale: Hier ist der messianische Titel sinnvoll erkennbar und wird daher übersetzt statt nur als namensähnliche Bezeichnung übernommen.
- issue: Bedeutung von σάρξ
  choice: physische beziehungsweise ethnische Verwandtschaft
  alternative: „sündige Natur“
  rationale: Paulus spricht von Abstammung und Volkszugehörigkeit, nicht von moralischer Beschaffenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den emotionalen Nachdruck und den Bezug des Opfers auf Paulus’ Volksgenossen lesbar. „Leibliche Verwandte“ ist natürlicher als die formale Wendung „Verwandte nach dem Fleisch“, während die Fußnote die paulinische Formulierung transparent hält.
