  terminology: „Mein Volk“ bewahrt die etablierte Bundesformel. „Söhne“ entspricht υἱοί und wird durch die sachgerechte Alternative „Kinder“ in der Fußnote ergänzt, ohne die Hauptfassung zu nivellieren. „Der lebendige Gott“ ist die übliche und präzise Wiedergabe.
