id: ROM.9.26
reference: Romans 9:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: de
  text: 'Und es wird geschehen: An dem Ort, an dem zu ihnen gesagt wurde: »Ihr seid nicht mein Volk«,[a] dort werden sie Söhne des lebendigen Gottes genannt werden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat bzw. Anspielung aus Hosea 2,1 (in anderer Verszählung Hosea 1,10); dort wird die Wiederherstellung des Gottesvolkes angekündigt.
    reason: cross_reference
  - marker: b
    text: 'Oder: »Kinder des lebendigen Gottes«. Wörtlich steht im Griechischen »Söhne«; diese Formulierung kann zugleich an Sohnschaft und Erbe erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἔσται
  choice: Und es wird geschehen
  rationale: Die Wendung führt das angekündigte zukünftige Geschehen ein und bewahrt zugleich den schriftsprachlich-prophetischen Klang des Zitats.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: An dem Ort, an dem
  rationale: Gibt die örtliche Beziehung klar und natürlich wieder; ein zusätzliches »gerade« ist im Griechischen nicht ausdrücklich vorhanden.
- source_word: ἐρρέθη αὐτοῖς
  choice: zu ihnen gesagt wurde
  rationale: Bewahrt das unpersönliche Passiv und lässt den Sprecher wie im Ausgangstext unausgesprochen.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Ihr seid nicht mein Volk
  rationale: Natürliches deutsches Satzgefüge, das die Bundesformel »mein Volk« unverändert erhält.
- source_word: ἐκεῖ
  choice: dort
  rationale: Markiert knapp und nachdrücklich die Umkehrung am selben Ort.
- source_word: κληθήσονται
  choice: werden sie … genannt werden
  rationale: Bewahrt Futur und Passiv, ohne den im Griechischen nicht genannten Handelnden zu ergänzen.
- source_word: υἱοὶ
  choice: Söhne
  rationale: Entspricht dem ausdrücklich maskulinen Plural und bewahrt mögliche Anklänge an Sohnschaft und Erbe; die umfassendere Bedeutung wird in einer Fußnote erläutert.
- source_word: θεοῦ ζῶντος
  choice: des lebendigen Gottes
  rationale: Die geläufige und genaue deutsche Wiedergabe des Genitivs mit adjektivisch gebrauchtem Partizip.
theological_decisions:
- issue: Wiedergabe von υἱοὶ als repräsentativer Plural
  choice: Söhne
  alternative: Kinder
  rationale: »Söhne« bewahrt die konkrete Wortwahl und mögliche Sohnschafts- und Erbvorstellungen. Da die Bezeichnung die gesamte wiederhergestellte Gottesgemeinschaft umfasst, wird »Kinder« als sachlich mögliche Wiedergabe vermerkt.
- issue: Bundesidentität in λαός μου
  choice: mein Volk
  alternative: mein eigenes Volk
  rationale: Die knappe Bundesformel aus Hosea wird nicht durch eine deutende Verstärkung erweitert.
- issue: Ungenannter Handelnder bei κληθήσονται
  choice: Passiv ohne Ergänzung
  alternative: von Gott Söhne genannt werden
  rationale: Das griechische Passiv kann göttliches Handeln nahelegen, nennt Gott als Handelnden aber nicht ausdrücklich; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Doppelpunkt macht die folgende prophetische Aussage lesbar. Die Wiederholung »werden … genannt werden« ist grammatisch korrekt und erhält sowohl Zukunft als auch Passiv des griechischen Textes.
