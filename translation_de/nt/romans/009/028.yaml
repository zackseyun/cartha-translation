  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: de
  text: Denn der Herr wird sein Wort[a] auf der Erde[c] ausführen, wobei er es vollendet und verkürzt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sache“ beziehungsweise „das Urteil“.'
    reason: lexical_alternative
  - marker: b
    text: „Verkürzen“ kann auch im Sinn von „kurz abschneiden“ oder sinngemäß „rasch ausführen“ verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Manche übersetzen „im Land“ und folgen damit dem Wortlaut von Jesaja in seinem ursprünglichen Zusammenhang; die griechische Fassung im Römerbrief lautet hier allgemein „auf der Erde“.
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: sein Wort
  rationale: λόγος bezeichnet hier das vom Herrn Gesagte beziehungsweise Beschlossene, das er verwirklicht. „Wort“ bewahrt den sprachlich-deklarativen Sinn; das Possessivpronomen wird im Deutschen aus dem Subjekt „der Herr“ natürlich ergänzt.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage und wird im argumentativen Zusammenhang knapp und idiomatisch mit „Denn“ wiedergegeben.
- source_word: συντελῶν
  choice: es vollenden
  rationale: 'Das Partizip beschreibt, wie der Herr sein Wort ausführt: Er bringt es vollständig zum vorgesehenen Abschluss.'
- source_word: καὶ συντέμνων
  choice: und verkürzen
  rationale: συντέμνω bedeutet wörtlich „verkürzen“ oder „kurz abschneiden“. „Verkürzen“ erhält die auffällige Bildlichkeit und legt die mögliche Folgerung einer schnellen Ausführung nicht schon im Haupttext fest.
- source_word: ποιήσει
  choice: ausführen
  rationale: ποιέω bedeutet grundsätzlich „tun, machen“. Mit λόγον als Objekt bezeichnet es hier die Verwirklichung dessen, was der Herr gesagt oder beschlossen hat; „ausführen“ ist dafür klares modernes Deutsch.
- source_word: κύριος
  choice: der Herr
  rationale: Die traditionelle und sachlich angemessene Wiedergabe von κύριος in diesem Schriftzitat ist „der Herr“.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die griechische Wendung im Römerbrief ist in ihrer naheliegenden, umfassenden Bedeutung „auf der Erde“ wiedergegeben. Die im ursprünglichen Jesajakontext mögliche Einengung auf „im Land“ bleibt als Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Art des göttlichen Handelns im Jesajazitat
  choice: Der Herr verwirklicht sein gesprochenes Wort entschlossen und bringt es zum Abschluss, ohne die Aussage auf ein bestimmtes theologisches System einzuengen.
  alternative: 'Der Herr vollstreckt ein Gerichtsurteil rasch und endgültig; oder: Er vollendet und verkürzt sein rettendes beziehungsweise richtendes Handeln.'
  rationale: Die Wortwahl kann gerichtliche und zeitliche Obertöne tragen. Der Haupttext bewahrt jedoch die Spannung zwischen gesprochenem Wort, Vollendung und Verkürzung, statt eine einzelne dogmatische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt die Hauptaussage klar voran und gibt die beiden Partizipien als begleitende Handlungen wieder. Die ungewöhnliche Formulierung „verkürzen“ bleibt bewusst erhalten und wird durch eine Fußnote erläutert.
