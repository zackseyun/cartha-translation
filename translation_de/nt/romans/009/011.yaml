  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: de
  text: Denn als die Kinder noch nicht geboren waren und noch nichts Gutes oder Schlechtes[a] getan hatten – damit Gottes Vorsatz gemäß der Erwählung[b] bestehen bleibt[c] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »etwas Gutes oder Böses«. Das griechische Wort kann etwas Schlechtes, Minderwertiges oder moralisch Böses bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gottes Erwählungsvorsatz«; wörtlicher: »der Vorsatz Gottes gemäß der Erwählung«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »bleibt« beziehungsweise »feststeht«. Das griechische Verb bedeutet grundsätzlich »bleiben« oder »fortbestehen« und kann hier den Gedanken festen Bestands einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω ... γεννηθέντων
  choice: noch bevor die Kinder geboren waren
  rationale: Die zeitliche Bedeutung »noch nicht geboren« wird im Deutschen idiomatisch mit »noch bevor ... geboren waren« wiedergegeben. Das ergänzte Subjekt »die Kinder« ergibt sich aus dem unmittelbaren Kontext und macht den Genitivus absolutus verständlich.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise erläuternde Verbindung zum vorausgehenden Satz.
- source_word: μηδὲ πραξάντων
  choice: und ... getan hatten
  rationale: In Verbindung mit »noch bevor« trägt die koordinierte Form die Verneinung sinngemäß mit; die deutsche Formulierung vermeidet ein schwerfälliges doppeltes »weder ... noch«.
- source_word: τι ἀγαθὸν ἢ φαῦλον
  choice: etwas Gutes oder Schlechtes
  rationale: Gibt die substantivierten Gegensätze natürlich wieder. φαῦλον kann Schlechtes, Minderwertiges oder moralisch Böses bezeichnen; »Schlechtes« bewahrt die lexikalische Breite.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die natürliche Zweckbedeutung wieder, ohne die umfassenderen theologischen Folgerungen der Aussage festzulegen.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: Gottes Vorsatz gemäß der Erwählung
  rationale: Bewahrt sowohl den Gottesgenitiv als auch die präpositionale Struktur κατ’ ἐκλογήν. »Vorsatz« bezeichnet hier einen gefassten Plan oder eine Absicht und ist präziser als das mehrdeutige »Zweck«.
- source_word: μένῃ
  choice: bestehen bleibt
  rationale: Verbindet die Grundbedeutung »bleiben« mit dem kontextuell möglichen Sinn des festen Fortbestehens, ohne stärker als der griechische Ausdruck von »feststehen« zu sprechen.
theological_decisions:
- issue: Bedeutung von ἵνα im Zusammenhang der Erwählung
  choice: 'Zwecksatz: »damit Gottes Vorsatz ... bestehen bleibt«'
  alternative: 'Folgesatz: »sodass Gottes Vorsatz ... bestehen bleibt«'
  rationale: ἵνα bezeichnet hier am natürlichsten Zweck oder Absicht. Die Übersetzung lässt offen, wie dieser Zweck in umfassendere Lehrsysteme über Erwählung und menschliches Handeln einzuordnen ist.
- issue: Wiedergabe von ἐκλογή
  choice: Erwählung
  alternative: Auswahl oder Wahl
  rationale: »Erwählung« entspricht dem gewichtigen paulinischen Gebrauch und ist im Deutschen etabliert, ohne den Vers durch eine erklärende Paraphrase konfessionell festzulegen.
- issue: Bezug und Funktion des Satzfragments
  choice: Gedankenstriche und auslautender Gedankenstrich zeigen die Einfügung innerhalb des über Vers 12 fortlaufenden Satzes
  alternative: Den Vers als selbstständigen vollständigen Satz formulieren
  rationale: Der griechische Satz ist in Vers 11 syntaktisch noch nicht abgeschlossen. Die typografische Offenheit bewahrt den Zusammenhang, statt einen künstlichen Satzschluss einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktisch offene Einfügung erkennbar, weil der Satz erst in Römer 9,12 weitergeführt wird. Fachlich geprägte, aber verständliche Begriffe wie »Vorsatz« und »Erwählung« bewahren die paulinische Ausdrucksweise und ihre theologische Spannung.
