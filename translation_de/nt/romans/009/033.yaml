  source_fidelity: Die Grundstruktur und der Sinn des griechischen Zitats sind zutreffend wiedergegeben. Allerdings trifft „an dem man sich stößt“ die Stolperbedeutung von προσκόμματος weniger genau und kann bloßes Anstoßen meinen. Zudem lautet die wörtliche Angabe zu ἐπ’ αὐτῷ wegen des griechischen Dativs nicht „auf ihn“, sondern „auf ihm“ bzw. idiomatisch „auf ihn/ihm vertrauen“.
  naturalness: Der Text ist insgesamt modernes, verständliches Standarddeutsch. „über den man stolpert“ ist für das erste Steinbild präziser und ebenso natürlich. Die Formulierung „an ihn glauben“ ist im Deutschen idiomatisch.
  terminology: „Zion“, „Felsen“ und „beschämt werden“ sind angemessen. Die Fassung bewahrt die bildhafte, im Zitat selbst noch nicht ausdrücklich ausgeführte personale bzw. sachliche Mehrdeutigkeit des Pronomens; die Anmerkung erläutert die paulinische Anwendung, ohne sie in den Wortlaut einzutragen.
