  - severity: low
    issue: Die Fußnote zu ἐπ’ αὐτῷ bezeichnet „auf ihn“ als wörtliche Wiedergabe.
    rationale: Der griechische Ausdruck steht mit ἐπί und Dativ (αὐτῷ). Eine formnahe deutsche Angabe lautet „auf ihm“; als Glaubensausdruck ist dies im Deutschen jedoch nicht idiomatisch. Die Fußnote sollte die griechische Form korrekt benennen.
