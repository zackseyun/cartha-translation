reference: Romans 9:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: de
  text: 'Wie geschrieben steht: »Sieh, ich lege in Zion einen Stein, über den man stolpert, und einen Felsen, an dem man zu Fall kommt[a]. Wer an ihn glaubt[b], wird nicht beschämt werden[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus verbindet hier Jesaja 8,14 und Jesaja 28,16.
    reason: cross_reference
  - marker: b
    text: 'Griechisch: „auf ihm“. Das Pronomen kann sich grammatisch auf den Stein oder Felsen beziehen; im Zusammenhang wendet Paulus das Bild auf den Messias an.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird nicht enttäuscht werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Wie geschrieben steht
  rationale: Die geläufige deutsche Einleitungsformel für ein Schriftzitat gibt die perfektische Bedeutung knapp und würdig wieder.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Bewahrt den auffordernden, hinweisenden Charakter, ohne das heute altertümlich wirkende „Siehe“ zu verwenden.
- source_word: τίθημι
  choice: ich lege
  rationale: Erhält das Präsens und passt natürlich zum Bild eines Steins, der an einem Ort niedergelegt wird.
- source_word: ἐν Σιὼν
  choice: in Zion
  rationale: Gibt die gewöhnliche lokale Bedeutung von ἐν wieder und entspricht dem prophetischen Ortsbezug.
- source_word: λίθον προσκόμματος
  choice: einen Stein, an dem man sich stößt
  rationale: Die Relativkonstruktion vermittelt im modernen Deutsch klar, dass der Stein zum Anstoß beziehungsweise Stolpern führt.
- source_word: πέτραν σκανδάλου
  choice: einen Felsen, an dem man zu Fall kommt
  rationale: Bewahrt die Parallelität, unterscheidet die zweite Wendung aber von bloßem Sichstoßen und bringt die Fallwirkung von σκάνδαλον zum Ausdruck.
- source_word: ὁ πιστεύων
  choice: Wer … glaubt
  rationale: Gibt das substantivierte Partizip allgemein und geschlechtsübergreifend in natürlichem Deutsch wieder.
- source_word: ἐπ’ αὐτῷ
  choice: an ihn
  rationale: „An jemanden glauben“ ist die natürliche deutsche Verbindung; „ihn“ lässt zugleich die personale, christologische Anwendung im Kontext erkennen.
- source_word: οὐ καταισχυνθήσεται
  choice: wird nicht beschämt werden
  rationale: Bewahrt Futur und Passiv sowie den Ehr-Schande-Aspekt des Verbs, ohne ihn auf bloße Enttäuschung zu verengen.
theological_decisions:
- issue: Bezug von αὐτῷ im zusammengesetzten Jesaja-Zitat
  choice: Personal als „ihn“ wiedergegeben
  alternative: Sachlich als „ihn“ im grammatischen Bezug auf den Stein verstanden oder sinngemäß unpersönlich formuliert
  rationale: Das griechische Maskulinum kann sich grammatisch auf λίθος beziehen; zugleich wendet Paulus das Steinbild im Zusammenhang auf den Messias an. Die personale deutsche Form wahrt diese Anwendung, ohne die Bildsprache aufzulösen.
- issue: Bedeutung von πέτραν σκανδάλου
  choice: „einen Felsen, an dem man zu Fall kommt“
  alternative: „einen Felsen des Anstoßes“ oder „einen Felsen, der Anstoß erregt“
  rationale: Die gewählte Fassung hält die konkrete Gefahren- und Fallmetaphorik fest. Die Alternative „Anstoß“ könnte im heutigen Deutsch vorwiegend als Ärgernis verstanden werden und die Bildhandlung abschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schriftzitatton. „Sieh“ vermeidet Archaismus; die beiden Steinbilder werden konkret und parallel wiedergegeben, ohne ihre unterschiedliche Wortwahl einzuebnen.
