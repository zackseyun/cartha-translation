  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: de
  text: 'Daraus folgt: Er erbarmt sich, über wen er will, und er verhärtet[a], wen er will.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Verhärtet“ kann auch mit „macht hartnäckig“ oder „macht verstockt“ wiedergegeben werden. Im Griechischen steht ein aktives Verb; die Aussage lautet nicht lediglich, dass Gott eine Verhärtung zulässt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Daraus folgt
  rationale: Die Verbindung beider Folgerungspartikeln leitet nachdrücklich die Schlussfolgerung aus dem vorangehenden Gedankengang ein; die deutsche Wendung ist natürlich und bewahrt die argumentative Kraft.
- source_word: ὃν θέλει
  choice: über wen er will
  rationale: Bei ἐλεεῖ wird der griechische Akkusativ im Deutschen idiomatisch mit „sich über jemanden erbarmen“ wiedergegeben. „will“ bewahrt die direkte Aussage über den göttlichen Willen und den würdevollen Ton.
- source_word: ἐλεεῖ
  choice: erbarmt sich
  rationale: Das Verb bezeichnet das Erweisen von Erbarmen. „sich erbarmen“ ist im modernen Standarddeutsch klar, präzise und dem biblischen Register angemessen.
- source_word: ὃν δὲ θέλει
  choice: und … wen er will
  rationale: δέ setzt die zweite Aussage in Kontrast zur ersten; im Deutschen ergibt sich der Gegensatz bereits aus den gegensätzlichen Verben, sodass „und“ die parallele Struktur flüssig erhält.
- source_word: σκληρύνει
  choice: verhärtet
  rationale: Das aktive Verb bedeutet „hart machen, verhärten“. Die Wiedergabe wahrt sowohl die aktive Zuschreibung als auch den Bezug zur Pharaoüberlieferung, ohne sie zu einer bloßen Erlaubnis abzuschwächen.
theological_decisions:
- issue: Göttliches Wollen in θέλει
  choice: Die direkte Aussage „wen er will“ wird in beiden Satzteilen beibehalten.
  alternative: „wen er möchte“ oder eine Umschreibung, die lediglich göttliche Zulassung ausdrückt
  rationale: Der griechische Text spricht ausdrücklich vom Wollen des Subjekts. Die Übersetzung lässt die Spannung zwischen göttlichem Handeln und menschlicher Verantwortung bestehen.
- issue: Handlungsträgerschaft bei σκληρύνει
  choice: 'Aktiv: „er verhärtet“'
  alternative: „er lässt sich verhärten“ oder „er lässt verhärtet werden“
  rationale: Die griechische Aktivform schreibt dem Subjekt die Handlung unmittelbar zu; eine permissive Umschreibung würde den Ausgangstext theologisch abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die aktive Form des griechischen Textes bleiben erhalten. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen Schlüsselbegriff er sich bezieht.
