    issue: Unnatürliche Konstruktion ‚an Gefäßen … erkennen zu lassen‘
    rationale: 'γνωρίσῃ bedeutet hier ‚bekannt machen/kundtun‘, nicht primär jemanden etwas erkennen lassen. Zudem ist bei der deutschen figurativen Wendung ein bestimmter Artikel erforderlich: Gottes Herrlichkeit wird an den betreffenden Gefäßen bekannt gemacht beziehungsweise sichtbar.'
