review_pass:
  verdict: revise
  source_fidelity: Der Zweckanschluss von καὶ ἵνα, der Reichtum der Herrlichkeit, die ‚Gefäße des Erbarmens‘ sowie Gottes aktives vorheriges Bereiten zur Herrlichkeit werden grundsätzlich zutreffend wiedergegeben. Die Wiedergabe von ἐπὶ als ‚an den Gefäßen‘ ist als offene, nicht überinterpretierende deutsche Entsprechung vertretbar.
  naturalness: ‚Den Reichtum seiner Herrlichkeit an Gefäßen … erkennen zu lassen‘ ist im Deutschen ohne Artikel und mit ‚erkennen lassen‘ nicht idiomatisch. ‚Bekannt zu machen‘ gibt γνωρίσῃ natürlich und präzise wieder; ‚an den Gefäßen‘ macht die beabsichtigte Bezugsrelation verständlich.
  terminology: ‚Gefäße des Erbarmens‘ bewahrt das paulinische Bild und die Terminologie im Kontext. ‚Herrlichkeit‘ und ‚im Voraus vorbereitet‘ sind angemessene, theologisch nicht einengende Wiedergaben.
