source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: de
  text: und um den Reichtum seiner Herrlichkeit an den Gefäßen des Erbarmens bekannt zu machen, die er im Voraus zur Herrlichkeit vorbereitet hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα γνωρίσῃ
  choice: um … erkennen zu lassen
  rationale: Gibt den finalen Sinn der ἵνα-Konstruktion und den kausativen Gehalt von γνωρίζω natürlich wieder; der Anschluss an den unvollständigen Satz aus dem vorherigen Vers bleibt erhalten.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: den Reichtum seiner Herrlichkeit
  rationale: Bewahrt die Singularform πλοῦτον und die Genitivverbindung eng am griechischen Ausdruck.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: an Gefäßen des Erbarmens
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bezugsfläche beziehungsweise die Empfänger, an denen Gottes Herrlichkeit offenbar wird. „An“ ist im Deutschen idiomatischer als das räumlich missverständliche „auf“.
- source_word: ἃ προητοίμασεν
  choice: die er im Voraus … bereitet hat
  rationale: Bewahrt das ausdrückliche Subjekt „er“, den Vorzeitigkeitssinn von προ- und den Bezug des Relativpronomens auf die Gefäße.
- source_word: εἰς δόξαν
  choice: zur Herrlichkeit
  rationale: Gibt die Zielrichtung von εἰς knapp und offen wieder, ohne die genaue Bedeutung von „Herrlichkeit“ weiter auszudeuten.
theological_decisions:
- issue: Verhältnis von Gottes Handeln und den Gefäßen des Erbarmens
  choice: „die er im Voraus zur Herrlichkeit bereitet hat“
  alternative: „die zur Herrlichkeit im Voraus bereitet waren“
  rationale: Das aktive Verb προητοίμασεν nennt Gott im Satzgefüge als Handelnden; die Übersetzung bewahrt dies, ohne über Zeitpunkt, Mittel oder individuelle beziehungsweise korporative Reichweite zu entscheiden.
- issue: Syntaktische Funktion von καὶ ἵνα
  choice: „und um … erkennen zu lassen“
  alternative: „und damit er … erkennen ließe“
  rationale: Der griechische Vers ist syntaktisch vom vorausgehenden Kontext abhängig. Die infinitivische Zweckform bildet diesen offenen Anschluss im Deutschen ab, ohne eine eigenständige Hauptsatzaussage zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gefäße des Erbarmens“ bewahrt das paulinische Bild und die Parallelität zu Römer 9,22. Das abschließende Komma signalisiert, dass der Satz in Vers 24 weitergeführt wird.
