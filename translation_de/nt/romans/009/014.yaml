  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: de
  text: Was sollen wir nun sagen? Ist Gott etwa ungerecht? Auf keinen Fall![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Möge es nicht geschehen!“ Eine besonders nachdrückliche Verneinung; auch möglich: „Keineswegs!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Was sollen wir nun sagen?
  rationale: Die geläufige paulinische Übergangsfrage wird im Deutschen natürlich wiedergegeben; „sollen“ vermittelt den abwägenden Charakter des griechischen Futurs.
- source_word: μὴ ἀδικία
  choice: Gibt es etwa Ungerechtigkeit
  rationale: μή kennzeichnet eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird. „etwa“ signalisiert diese Erwartung, ohne die Antwort vorwegzunehmen. „Ungerechtigkeit“ bewahrt den moralisch-rechtlichen Sinn von ἀδικία.
- source_word: παρὰ τῷ θεῷ
  choice: bei Gott
  rationale: Die Wendung bezeichnet hier Ungerechtigkeit auf Gottes Seite beziehungsweise in seinem Handeln. „bei Gott“ bleibt knapp, nah am Griechischen und lässt die Aussage bewusst unentfaltet.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Die feste paulinische Wendung ist eine nachdrückliche Zurückweisung. „Auf keinen Fall!“ gibt ihre Kraft in natürlichem, modernem Deutsch wieder.
theological_decisions:
- issue: Ob die rhetorische Frage durch eine ausdrückliche Aussage über Gottes Gerechtigkeit oder eine bestimmte Lehre von Erwählung erläutert werden soll.
  choice: Die knappe Frage nach Ungerechtigkeit bei Gott und ihre entschiedene Zurückweisung bleiben ohne dogmatische Ergänzung stehen.
  alternative: 'Man könnte deutender formulieren: „Ist Gott etwa ungerecht?“ oder Erklärungen zu Gottes Erwählung hinzufügen.'
  rationale: Der griechische Text formuliert den Einwand und weist ihn entschieden zurück, erklärt ihn aber in diesem Vers noch nicht. Die Übersetzung bewahrt diese Spannung und greift der folgenden Argumentation nicht vor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist für heutige Leser verständlich, bewahrt aber die knappe rhetorische Struktur und den starken Nachdruck des griechischen Textes.
