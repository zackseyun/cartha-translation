source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: de
  text: Zu ihnen gehören die Väter, und aus ihnen stammt, dem Fleisch nach[a], der Messias, der über allem ist, Gott, der in Ewigkeit gepriesen ist[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem Fleisch nach“; gemeint ist: seiner menschlichen Abstammung nach.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Schluss kann auch als eigenständiger Lobpreis verstanden werden: „Gott, der über allem ist, sei in Ewigkeit gepriesen. Amen.“ Dann wäre er nicht als Beschreibung des Messias zu lesen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: die Väter
  rationale: Die Wendung bezeichnet Israels verehrte Vorfahren und bewahrt zugleich die bund- und heilsgeschichtliche Sprache des Paulus. „Erzväter“ wäre enger und stärker auslegend.
- source_word: ἐξ ὧν
  choice: aus ihnen
  rationale: Das Relativpronomen verweist auf die Israeliten zurück. „Aus ihnen“ ist im Deutschen natürlich und gibt die Herkunft präzise wieder.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός steht hier als Titel inmitten der Vorrechte Israels; „Messias“ macht diesen Bezug für heutige Leser deutlich.
- source_word: τὸ κατὰ σάρκα
  choice: dem Fleisch nach
  rationale: Die traditionelle, knappe Wendung bewahrt die paulinische Ausdrucksweise und bezeichnet hier die menschliche Abstammung, nicht sündige Natur.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: der über allem ist
  rationale: Das substantivierte Partizip schließt sich syntaktisch natürlich als weitere Beschreibung an „der Messias“ an. Der Singular „allem“ gibt den umfassenden Herrschaftsbereich idiomatisch wieder.
- source_word: θεὸς εὐλογητὸς
  choice: Gott, gepriesen
  rationale: Die Wiedergabe lässt θεός appositionell auf den Messias bezogen sein und gibt εὐλογητός in einer im Deutschen natürlichen doxologischen Form wieder.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Dies ist eine geläufige und würdige deutsche Entsprechung der doxologischen Zeitformel.
- source_word: ἀμήν
  choice: Amen
  rationale: Die etablierte liturgische Transliteration wird beibehalten.
theological_decisions:
- issue: Ob „ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας“ den Messias beschreibt oder eine eigenständige Doxologie an Gott einleitet
  choice: 'Der Satzteil wird als fortgesetzte Beschreibung des Messias verstanden: „der über allem ist, Gott, gepriesen in Ewigkeit“.'
  alternative: 'Als eigenständige Doxologie: „Gott, der über allem ist, sei gepriesen in Ewigkeit.“'
  rationale: Der Anschluss des substantivierten Partizips ὁ ὢν an ὁ χριστός ist syntaktisch naheliegend. Da die ältesten Handschriften keine moderne Satzzeichensetzung vorgeben und die Abgrenzung seit Langem umstritten ist, wird die doxologische Deutung in einer Fußnote ausdrücklich offengehalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. „Die Väter“ und „dem Fleisch nach“ bewahren zentrale paulinische Formulierungen; die zweite Wendung wird durch eine Fußnote erläutert. Die strittige Zeichensetzung und christologische Zuordnung des Schlusses wird nicht verschwiegen.
