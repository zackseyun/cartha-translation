base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: de
  text: 'nicht aufgrund von Werken, sondern aufgrund dessen, der beruft[a], wurde ihr gesagt: »Der Ältere wird dem Jüngeren dienen.«[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nicht aus Werken, sondern von dem, der beruft«.'
    reason: lexical_alternative
  - marker: b
    text: Zitat aus 1. Mose 25,23.
    reason: cross_reference
  - marker: c
    text: 'Auch möglich: »Der Größere wird dem Geringeren dienen«; im Zusammenhang mit Jakob und Esau liegt die Wiedergabe als Altersverhältnis nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: nicht aus Werken
  rationale: ἐκ mit Genitiv bezeichnet hier Ursprung oder Grundlage. Die knappe Formulierung bewahrt den engen Gegensatz zu »aus dem Berufenden«.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: sondern aus dem Berufenden
  rationale: Das substantivierte Präsenspartizip bezeichnet den, der beruft, im Zusammenhang Gott. »Der Berufende« erhält die partizipiale Form und vermeidet eine erklärende Erweiterung.
- source_word: ἐρρέθη αὐτῇ
  choice: wurde ihr gesagt
  rationale: Die unpersönliche Passivform bildet den griechischen Aorist Passiv nach, ohne ein im Ausgangstext unausgesprochenes Subjekt hinzuzufügen.
- source_word: ὅτι
  choice: Doppelpunkt und direkte Rede
  rationale: ὅτι leitet hier die direkte Rede ein; im Deutschen wird dies natürlich durch Doppelpunkt und Anführungszeichen wiedergegeben.
- source_word: Ὁ μείζων
  choice: Der Ältere
  rationale: Im Kontext von Jakob und Esau bezeichnet der Komparativ den älteren Bruder; die Alternative »der Größere« bleibt in einer Fußnote sichtbar.
- source_word: δουλεύσει
  choice: wird dienen
  rationale: δουλεύω kann Sklavendienst bezeichnen, beschreibt im Zitat jedoch allgemein die Unterordnung. »Dienen« wahrt diese Bedeutung, ohne sie unnötig zu verengen.
- source_word: τῷ ἐλάσσονι
  choice: dem Jüngeren
  rationale: Im Geschwisterkontext bildet »der Jüngere« den idiomatischen Gegenbegriff zu »der Ältere«; die formalere Rangbedeutung wird als Alternative angemerkt.
theological_decisions:
- issue: Ob der Gegensatz zwischen Werken und dem Berufenden als ausdrückliche Lehraussage über bedingungslose Erwählung erweitert werden soll
  choice: Der knappe Gegensatz »nicht aus Werken, sondern aus dem Berufenden« bleibt ohne dogmatische Ergänzung erhalten.
  alternative: »nicht aufgrund von Werken, sondern aufgrund Gottes, der beruft«
  rationale: Der Vers stellt Werke und Gottes Berufung einander gegenüber. Weitergehende Schlussfolgerungen ergeben sich aus dem Zusammenhang und sollen nicht in den Einzelvers hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Satzstruktur folgt bewusst dem griechischen Fragment, das syntaktisch an den vorhergehenden Vers anschließt. »Der Berufende« ist leicht gehoben, bewahrt aber die substantivierte Partizipialform und die theologische Zurückhaltung des Ausgangstextes.
