    rationale: 'τοῦ καλοῦντος ist ein substantiviertes Partizip: »dessen/denjenigen, der beruft«. Das deutsche Substantiv »der Berufende« ist nicht die natürliche Entsprechung und kann eine andere Bedeutung nahelegen.'
  - severity: low
