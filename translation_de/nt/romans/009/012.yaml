review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den Kontrast οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος sowie die unpersönliche Passivform ἐρρέθη αὐτῇ grundsätzlich wieder. »aus dem Berufenden« ist jedoch im heutigen Deutsch keine tragfähige Wiedergabe des substantivierten Partizips und kann semantisch fehlleiten. »aufgrund dessen, der beruft« bildet die hier gemeinte Grundlage klar und ohne theologische Ausdeutung ab. Die Wiedergabe »Ältere/Jüngere« ist im Jakob-Esau-Kontext möglich, sollte aber durch die Fußnote nicht als einzig mögliche lexikalische Bedeutung ausgegeben werden.
  naturalness: »Der Berufende« ist als substantiviertes Partizip zwar verständlich, klingt aber unidiomatisch und kann an eine berufene Person statt an den Handelnden des Berufens denken lassen. »dessen, der beruft« ist modernes Standarddeutsch und bewahrt die Offenheit der griechischen Formulierung. Die bewusst satzfragmentarische Struktur bleibt erhalten, da der Vers an den vorherigen Satz anschließt.
  terminology: '»Werke«, »beruft«, »Ältere«, »Jüngere« und »dienen« sind angemessen. Die Alternativnote zu μείζων/ἐλάσσων sollte neutraler formuliert werden: Die griechischen Komparative können auch Rang bzw. Größe bezeichnen; der Kontext legt die Alterslesart nahe, ohne sie rein lexikalisch festzuschreiben.'
