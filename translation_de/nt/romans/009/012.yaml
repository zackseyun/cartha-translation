    rationale: μείζων und ἐλάσσων können allgemein »größer/geringer« bzw. im Kontext »älter/jünger« bedeuten. Die Kontextentscheidung ist vertretbar, die Alternative sollte jedoch als tatsächliche semantische Möglichkeit stehen bleiben.
