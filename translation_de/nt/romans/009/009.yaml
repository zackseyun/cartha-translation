  rationale: Die Übersetzung wird nur behutsam überarbeitet. „Um diese Zeit“ ist die im Deutschen natürlichere Entsprechung der zitierten Zeitformel. Die Fußnote unterscheidet klar zwischen dem Wortlaut von Römer 9,9 und einer möglichen, am Genesis-Hintergrund orientierten Übersetzungsweise, ohne eine textliche Variante oder einen bestimmten Genesis-Wortlaut zu behaupten.
