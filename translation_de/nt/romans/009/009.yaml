  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: de
  text: 'Denn dies ist das Wort der Verheißung: »Um diese Zeit werde ich kommen[a], und Sara wird einen Sohn haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wiederkommen«. Im griechischen Text steht hier »kommen«; manche Übersetzungen geben den Genesis-Hintergrund mit »wiederkommen« wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: der Verheißung
  rationale: Der Genitiv bestimmt λόγος näher. »Wort der Verheißung« ist im Deutschen natürlich und bewahrt den Akzent auf Gottes Zusage.
- source_word: λόγος
  choice: Wort
  rationale: Gemeint ist die zitierte Äußerung selbst; »Wort« ist knapp, würdig und nicht unnötig ausdeutend.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage und wird im Deutschen passend mit »Denn« wiedergegeben.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: Zu dieser Zeit
  rationale: Die Wendung bezeichnet den festgelegten Zeitpunkt der Erfüllung. »Zu dieser Zeit« ist idiomatisch und bleibt nahe am griechischen Wortlaut.
- source_word: ἐλεύσομαι
  choice: werde ich kommen
  rationale: Die Verbform von ἔρχομαι bedeutet hier unmittelbar »ich werde kommen«. Die mögliche Wiedergabe »wiederkommen« stammt aus dem Genesis-Hintergrund und wird daher als Fußnotenalternative genannt.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sara wird einen Sohn haben
  rationale: Die wörtliche Konstruktion »Sara wird ein Sohn sein« beziehungsweise »für Sara wird ein Sohn sein« drückt idiomatisch Besitz oder Zuordnung aus; im Deutschen gibt »wird einen Sohn haben« den Sinn natürlich wieder.
- source_word: Σάρρᾳ
  choice: Sara
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Schreibweise wiedergegeben.
- source_word: υἱός
  choice: Sohn
  rationale: Das Substantiv bezeichnet ausdrücklich einen männlichen Nachkommen; »Sohn« bewahrt diese für die Verheißung relevante Bestimmtheit.
theological_decisions:
- issue: Zitat der Verheißung an Abraham und göttliches Handeln
  choice: Die Verheißung wird ohne erklärende Zusätze als direkte Rede Gottes wiedergegeben; ἐλεύσομαι erscheint als »werde ich kommen«.
  alternative: »werde ich wiederkommen«, in Anlehnung an verbreitete Wiedergaben des Genesis-Hintergrunds
  rationale: Paulus stützt seine Aussage auf Gottes wirksame Verheißung. Die Übersetzung bewahrt diese Aussagekraft, folgt aber vorrangig dem tatsächlich vorliegenden griechischen Wortlaut des Römerbriefs.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Formulierung bleibt eng am griechischen Satzbau, glättet jedoch die semitisch-griechische Besitzkonstruktion zu natürlichem Deutsch. Der Fußnotenmarker [a] steht unmittelbar nach dem betroffenen Verb.
