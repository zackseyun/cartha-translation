  naturalness: '„Und nicht nur das: Auch“ ist modernes, verständliches Standarddeutsch. Die Folge „von einem einzigen Mann …, von unserem Vater Isaak“ klingt wegen des wiederholten „von“ jedoch schwerfällig und lässt die appositionale Identifizierung weniger klar hervortreten. „nämlich von unserem Vater Isaak“ ist natürlicher.'
