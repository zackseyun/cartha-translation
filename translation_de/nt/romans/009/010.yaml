  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: de
  text: 'Und nicht nur das: Auch Rebekka hatte von einem einzigen Mann empfangen[a], nämlich von unserem Vater Isaak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »von einem die Koite habend, Isaak, unserem Vater«; „Koite“ bedeutet „Lager“ und bezeichnet hier die Empfängnis durch geschlechtliche Vereinigung mit einem einzigen Mann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: 'Und nicht nur das: Auch'
  rationale: Die korrelative Wendung wird in natürlichem modernem Deutsch wiedergegeben und führt Paulus’ ergänzendes Argument weiter.
- source_word: Ῥεβέκκα
  choice: Rebekka
  rationale: Dies ist die im Deutschen übliche biblische Namensform.
- source_word: ἐξ ἑνός
  choice: von einem einzigen Mann
  rationale: Das substantivisch gebrauchte Zahlwort bezeichnet hier einen einzigen männlichen Elternteil. „Mann“ macht den im Griechischen vorausgesetzten Bezug verständlich, während „einzigen“ den argumentativen Nachdruck wahrt.
- source_word: κοίτην ἔχουσα
  choice: hatte … empfangen
  rationale: Die wörtlich auf Beischlaf beziehungsweise Ehebett bezogene Wendung bezeichnet im Zusammenhang die Empfängnis. Die deutsche Formulierung gibt diesen Sinn würdig und idiomatisch wieder.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: von unserem Vater Isaak
  rationale: Isaak steht als nähere Bestimmung zu dem einen Mann; „Vater“ bewahrt die unmittelbare angestammte beziehungsweise heilsgeschichtliche Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Wie ausdrücklich die Wendung für Geschlechtsgemeinschaft beziehungsweise Empfängnis in Paulus’ Argument wiederzugeben ist
  choice: Rebekka hatte von einem einzigen Mann empfangen
  alternative: Rebekka hatte mit einem Einzigen das Lager geteilt / Rebekka war von einem schwanger geworden
  rationale: Die Übersetzung benennt die im Kontext gemeinte Empfängnis und macht deutlich, dass beide Nachkommen denselben Vater hatten, ohne Kinder, Zwillinge oder eine weitergehende theologische Erklärung in den Vers einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die elliptische Fortführung des griechischen Gedankengangs lesbar ab; die Apposition „von unserem Vater Isaak“ bleibt erhalten.
