  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: de
  text: 'Wie geschrieben steht: »Jakob habe ich geliebt, Esau aber habe ich gehasst.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat aus Maleachi 1,2–3.
    reason: cross_reference
  - marker: b
    text: 'Oder: »habe ich verworfen« oder »habe ich weniger geliebt«. Manche verstehen »gehasst« hier als Verwerfung im Rahmen des Bundes oder als vergleichsweise geringere Zuwendung, nicht als Ausdruck emotionaler Feindseligkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Leitet die Schriftanführung in natürlichem Deutsch als Vergleichs- und Belegformel ein.
- source_word: γέγραπται
  choice: geschrieben steht
  rationale: Das griechische Perfekt Passiv bezeichnet in der üblichen Zitierformel einen geschriebenen Text mit fortdauernder Geltung; »geschrieben steht« gibt dies idiomatisch wieder.
- source_word: Ἰακώβ
  choice: Jakob
  rationale: Entspricht der etablierten deutschen Namensform.
- source_word: ἠγάπησα
  choice: habe ich geliebt
  rationale: Gibt den Aorist in der alttestamentlichen Rückschau natürlich wieder und bewahrt die direkte Bedeutung von ἀγαπάω.
- source_word: δὲ
  choice: aber
  rationale: Bringt den deutlichen Gegensatz zwischen Jakob und Esau zum Ausdruck.
- source_word: Ἠσαῦ
  choice: Esau
  rationale: Entspricht der etablierten deutschen Namensform.
- source_word: ἐμίσησα
  choice: habe ich gehasst
  rationale: Bewahrt die unmittelbare und starke Bedeutung von μισέω, ohne die theologische Spannung durch eine interpretierende Abschwächung aufzulösen.
theological_decisions:
- issue: Ob »habe ich gehasst« wegen der Diskussion über Erwählung, Bundesverwerfung oder vergleichende Bevorzugung abgeschwächt werden soll
  choice: Die direkte Wiedergabe »habe ich gehasst« bleibt im Haupttext.
  alternative: »habe ich verworfen« oder »habe ich weniger geliebt«
  rationale: Das griechische Zitat verwendet μισέω. Die direkte Übersetzung wahrt Wortlaut und Spannung; mögliche kontextuelle Deutungen werden in einer Fußnote genannt, statt in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Schriftformel »Wie geschrieben steht« und die Perfektformen passen zu einem angeführten früheren Ausspruch. Die starke Aussage des Ausgangstextes bleibt erhalten; erläuternde Alternativen stehen ausschließlich in der Fußnote.
