  verdict: approve
  source_fidelity: 'Der Text gibt die griechische Struktur und Aussage zuverlässig wieder: „Denn“ bewahrt den begründenden Anschluss, „die Schrift sagt zum Pharao“ die Personifikation der Schrift und das Präsens. „Eben dazu“ gibt die emphatische Zweckbestimmung εἰς αὐτὸ τοῦτο treffend wieder. „Habe ich dich auftreten lassen“ ist als bewusst weiter Ausdruck für ἐξήγειρά σε vertretbar und wird durch die lexikalische Fußnote sachgerecht abgesichert. Die beiden damit-Sätze geben die Zweckbestimmung von ὅπως wieder; die passive Verkündigung des Namens und der weltweite Horizont bleiben erhalten.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Formulierungen „an dir meine Macht erweise“ und „auf der ganzen Erde verkündet wird“ sind idiomatisch und behalten zugleich die Nähe zum Ausgangstext.
  terminology: „Schrift“, „Pharao“, „Macht“ und „Name“ sind angemessen und konsistent. Die Anmerkung zu „Name“ erläutert den biblischen Sinn als offenbartes Ansehen, ohne den Haupttext interpretierend zu erweitern. Die Alternativen zu ἐξήγειρά σε erhalten die relevante Bedeutungsweite und legen keine konfessionelle Deutung fest.
