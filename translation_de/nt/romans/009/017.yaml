id: ROM.9.17
reference: Romans 9:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: de
  text: 'Denn die Schrift sagt zum Pharao: „Eben dazu habe ich dich auftreten lassen[a], damit ich an dir meine Macht erweise und damit mein Name[b] auf der ganzen Erde verkündet wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „habe ich dich am Leben erhalten“ beziehungsweise „habe ich dich bestehen lassen“. Das griechische Verb kann in diesem Zusammenhang mehrere verwandte Bedeutungsnuancen tragen.'
    reason: lexical_alternative
  - marker: b
    text: Mit Gottes „Namen“ ist hier auch sein offenbartes Ansehen gemeint – wer er ist und wofür er bekannt wird, nicht nur eine Benennung.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: Denn die Schrift sagt zum Pharao
  rationale: Das Präsens und die personifizierte Schrift werden bewahrt; „Denn“ hält den begründenden Anschluss an den vorherigen Gedankengang fest.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Eben dazu
  rationale: Die knappe deutsche Form gibt sowohl den Zweck als auch die emphatische Hervorhebung von αὐτὸ τοῦτο natürlich wieder.
- source_word: ἐξήγειρά σε
  choice: habe ich dich auftreten lassen
  rationale: Die Formulierung vermittelt, dass Gott den Pharao für diese geschichtliche Rolle hervortreten ließ, ohne das Verb auf Erschaffung, Erhöhung oder bloßes Überleben einzuengen.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: damit ich an dir meine Macht erweise
  rationale: „An dir“ gibt ἐν σοὶ im Deutschen idiomatisch wieder und lässt offen, auf welche Weise Gottes Macht im Fall des Pharao sichtbar wird.
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: und damit mein Name verkündet wird
  rationale: Die passive Form und der öffentliche Bekanntmachungssinn von διαγγέλλω bleiben erhalten.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: auf der ganzen Erde
  rationale: Die Wendung wahrt den umfassenden, hier naheliegend weltweiten Horizont und ist im modernen Standarddeutsch natürlich.
theological_decisions:
- issue: Bedeutung von ἐξήγειρά σε im Verhältnis von Gottes Handeln und der Verantwortung des Pharao
  choice: „habe ich dich auftreten lassen“ mit bewusst weitem Sinn
  alternative: „habe ich dich am Leben erhalten“ oder „habe ich dich bestehen lassen“
  rationale: Der Wortlaut schreibt Gott zu, dass der Pharao für diesen Zweck hervortritt beziehungsweise bestehen bleibt, legt aber den genauen Vorgang nicht abschließend fest. So bleibt die Spannung zwischen göttlicher Souveränität und menschlicher Verantwortung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Begründungs- und Zwecksatzgefüge, während „an dir“ und „Eben dazu“ idiomatisches Deutsch gewährleisten.
