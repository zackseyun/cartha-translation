source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: de
  text: Ich sage die Wahrheit im Messias[a], ich lüge nicht, wobei mein Gewissen mir[b] im Heiligen Geist[c] zustimmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus“. Der griechische Titel Χριστός kann titelartig („Messias“) oder wie ein Name („Christus“) gebraucht werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wobei mein Gewissen gemeinsam mit mir Zeugnis ablegt“ oder „wobei mein Gewissen mir bezeugt, dass dies wahr ist“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „in einem heiligen Geist“; bei Paulus ist hier jedoch am ehesten der Heilige Geist gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Ich sage die Wahrheit
  rationale: Die idiomatische Verbindung von ἀλήθεια und λέγω bezeichnet wahrhaftiges Reden; die deutsche Wendung ist direkt, natürlich und feierlich.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός trägt hier weiterhin titularen Sinn. „Messias“ gibt den Titel des Gesalbten wieder; „in Christus“ bleibt als geläufige Alternative in der Fußnote erhalten.
- source_word: οὐ ψεύδομαι
  choice: ich lüge nicht
  rationale: Die knappe präsentische Verneinung entspricht dem griechischen Ausdruck und klingt im modernen Deutsch natürlich.
- source_word: συμμαρτυρούσης μοι
  choice: bezeugt es mit mir
  rationale: Die Formulierung bewahrt die Mitbedeutung des Präfixes συν- und gibt den Genitivus absolutus als begleitenden Umstand flüssig wieder. Das ergänzte „es“ nimmt die vorausgehende Wahrheitsaussage auf.
- source_word: τῆς συνειδήσεώς μου
  choice: mein Gewissen
  rationale: „Gewissen“ ist die übliche und kontextgerechte Wiedergabe von συνείδησις.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die anarthrische Wendung bezeichnet im paulinischen Sprachgebrauch am ehesten den Heiligen Geist. „Im“ bewahrt die Präposition ἐν, ohne sie vorschnell instrumental auszulegen.
theological_decisions:
- issue: Titularer oder namensähnlicher Gebrauch von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der griechische Ausdruck kann titel- oder namensähnlich verstanden werden. Die Hauptübersetzung macht den titularen Ursprung sichtbar, während die Fußnote die traditionelle deutsche Wiedergabe nennt.
- issue: Referent von πνεύματι ἁγίῳ
  choice: der Heilige Geist
  alternative: ein heiliger Geist beziehungsweise ein geheiligter menschlicher Geist
  rationale: Im paulinischen Kontext ist der Bezug auf Gottes Heiligen Geist am wahrscheinlichsten. Da der griechische Ausdruck formal artikellos ist, wird die weniger wahrscheinliche Möglichkeit in einer Fußnote offengehalten.
- issue: Funktion von ἐν in ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  alternative: durch den Heiligen Geist
  rationale: Die lokativ-sphärische Wiedergabe erhält die Mehrdeutigkeit der Präposition besser als eine ausschließlich instrumentale Übersetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers behält die feierliche, nachdrückliche Wahrheitsbeteuerung und die syntaktische Spannung des griechischen Satzes bei. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
