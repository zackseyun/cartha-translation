  terminology: „Messias“, „Gewissen“ und „Heiliger Geist“ sind angemessen. Die großgeschriebene Wiedergabe von πνεύματι ἁγίῳ folgt der im paulinischen Kontext wahrscheinlichsten Deutung; die Fußnote hält die artikellose Alternativlesart offen, ohne sie als zwingend darzustellen.
