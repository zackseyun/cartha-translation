  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: de
  text: 'Du wirst nun zu mir sagen: »Warum tadelt er dann noch? Denn wer hat sich seinem Willen[a] widersetzt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seiner Absicht« oder »seinem Vorsatz«.'
    reason: Das griechische βούλημα kann Wille, Absicht oder Vorsatz bedeuten.
lexical_decisions:
- source_word: Ἐρεῖς
  choice: Du wirst sagen
  rationale: Das Futur wird als rhetorisches Futur wiedergegeben und leitet den erwarteten Einwand ein.
- source_word: μοι
  choice: zu mir
  rationale: Der Dativ bezeichnet den Adressaten und wird im Deutschen ausdrücklich wiedergegeben.
- source_word: οὖν … οὖν
  choice: nun … dann
  rationale: Beide Vorkommen der folgernden Partikel werden natürlich wiedergegeben, ohne die deutsche Formulierung unnötig zu belasten.
- source_word: Τί οὖν ἔτι μέμφεται
  choice: Warum tadelt er dann noch?
  rationale: τί hat in dieser Verbindung begründend-fragenden Sinn; ἔτι wird mit »noch« bewahrt, μέμφεται knapp mit »tadelt« wiedergegeben.
- source_word: τῷ … βουλήματι αὐτοῦ
  choice: seinem Willen
  rationale: βούλημα bezeichnet hier einen gefassten Willen, eine Absicht oder einen Vorsatz. »Willen« ist im Deutschen idiomatisch; die echte Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: ἀνθέστηκεν
  choice: hat sich … widersetzt
  rationale: Die Perfektform wird mit deutschem Perfekt wiedergegeben; »sich widersetzen« entspricht der Verbindung des Verbs mit dem Dativ.
theological_decisions:
- issue: Wiedergabe von βούλημα im Zusammenhang von Gottes Souveränität und menschlicher Verantwortung
  choice: seinem Willen
  alternative: seiner Absicht / seinem Vorsatz
  rationale: »Willen« ergibt eine natürliche, starke Formulierung des vorgebrachten Einwands, ohne diesen zu bestätigen oder die Spannung des Abschnitts aufzulösen. Die alternativen Bedeutungsnuancen werden in der Fußnote genannt.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Ton. Die direkte Rede wahrt den Charakter eines von Paulus vorweggenommenen Einwands; die beiden rhetorischen Fragen bleiben zugespitzt.
