id: ROM.9.32
reference: Romans 9:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: de
  text: Warum? Weil es nicht aus Glauben geschah[a], sondern als ob es aus Werken käme[b]. Sie stolperten über den Stein des Anstoßes[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht aus Glauben“; möglich ist auch: „nicht aufgrund von Glauben“ oder „nicht durch Glauben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sondern wie aus Werken“. Das „als ob“ gibt die abschwächende beziehungsweise vergleichende Nuance des griechischen ὡς wieder.'
    reason: lexical_alternative
  - marker: c
    text: Anspielung auf Jesaja 8,14; siehe auch Jesaja 28,16 im folgenden Vers.
    reason: cross_reference
  - marker: d
    text: 'Oder: „an dem Stein, über den man stolpert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: Warum?
  rationale: Die knappe idiomatische Frage bewahrt die rhetorische Kraft des griechischen Ausdrucks.
- source_word: ὅτι
  choice: Weil
  rationale: Die Konjunktion leitet hier die Begründung für die vorangehende Frage ein.
- source_word: οὐκ ἐκ πίστεως
  choice: nicht aus Glauben
  rationale: Die Wiedergabe bewahrt die Präposition ἐκ und lässt offen, ob Herkunft, Grundlage oder Mittel im Vordergrund steht.
- source_word: πίστεως
  choice: Glauben
  rationale: Im paulinischen Gegensatz zu Werken ist „Glauben“ die sachlich und sprachlich naheliegende Wiedergabe, ohne den Begriff auf bloße Treue oder rein inneres Vertrauen festzulegen.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: sondern als ob es aus Werken käme
  rationale: „Als ob“ gibt ὡς ausdrücklich wieder und vermeidet die unzulässige Glättung zu „durch Werke“.
- source_word: ἔργων
  choice: Werken
  rationale: „Werke“ ist der etablierte und kontextuell passende Ausdruck für den paulinischen Gegensatz von Glaube und Werken.
- source_word: προσέκοψαν
  choice: Sie stießen sich an
  rationale: Die Formulierung wahrt sowohl das konkrete Bild des Anstoßens als auch dessen übertragene Bedeutung.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: an dem Stein des Anstoßes
  rationale: Die traditionelle, weiterhin verständliche Wendung erhält die Wortverwandtschaft und das Steinbild der Jesaja-Anspielung.
theological_decisions:
- issue: Bedeutung von πίστις im Gegensatz zu Werken
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Der Zusammenhang stellt Glauben und Werke als unterschiedliche Grundlagen gegenüber. „Glauben“ bewahrt den paulinischen Leitbegriff, ohne eine engere Auslegung festzuschreiben.
- issue: Funktion von ὡς vor ἐξ ἔργων
  choice: als ob es aus Werken käme
  alternative: aus Werken; durch Werke
  rationale: 'Das ausdrücklich wiedergegebene ὡς bewahrt die Spannung des Textes: Paulus sagt nicht schlicht, es sei tatsächlich aus Werken geschehen, sondern beschreibt das Vorgehen als entsprechend ausgerichtet.'
- issue: Bezug des unausgesprochenen Vorgangs in οὐκ ἐκ πίστεως
  choice: es … geschah
  alternative: sie strebten danach; sie gingen davon aus
  rationale: Das Deutsche benötigt eine verbale Ergänzung. Die unbestimmte Formulierung nimmt den Gedankengang aus Vers 31 auf, ohne eine einzelne syntaktische Deutung als sicher auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „Stein des Anstoßes“ ist geläufig und erhält zugleich die biblische Bildsprache. Die ungewöhnliche Wendung „aus Glauben“ bleibt wegen der theologischen und syntaktischen Bedeutung von ἐκ bewusst im Haupttext stehen und wird in der Fußnote erläutert.
