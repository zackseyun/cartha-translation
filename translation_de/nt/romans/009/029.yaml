id: ROM.9.29
reference: Romans 9:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: de
  text: 'Und wie Jesaja schon gesagt hat: »Hätte der Herr der Heerscharen[a] uns keine Nachkommen[b] übrig gelassen, wären wir wie Sodom geworden und Gomorra gleichgemacht worden.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herr Zebaoth«. Das griechische Σαβαώθ gibt einen hebräischen Gottestitel in Lautschrift wieder, der meist mit »der Heerscharen« oder »der Heere« übersetzt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Samen«; gemeint sind hier überlebende Nachkommen.'
    reason: lexical_alternative
  - marker: c
    text: Zitat aus Jesaja 1,9.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: Und wie
  rationale: Gibt den Anschluss und die vergleichende Entsprechung natürlich und quellennah wieder.
- source_word: προείρηκεν
  choice: schon gesagt hat
  rationale: Das Perfekt bezeichnet eine frühere, weiterhin maßgebliche Aussage; »schon gesagt hat« ist im Deutschen natürlich und vermeidet die unzutreffende Verengung auf eine Vorhersage.
- source_word: κύριος Σαβαὼθ
  choice: Herr der Heerscharen
  rationale: Σαβαώθ ist die griechische Umschrift eines hebräischen Gottestitels. Die traditionelle deutsche Bedeutungswiedergabe »der Heerscharen« ist würdig, verständlich und lässt den Titelcharakter erkennen.
- source_word: ἐγκατέλιπεν ἡμῖν
  choice: uns … übrig gelassen
  rationale: Bewahrt den Sinn des Zurück- beziehungsweise Übriglassens und macht im Zusammenhang deutlich, dass Nachkommenschaft erhalten blieb.
- source_word: σπέρμα
  choice: Nachkommen
  rationale: Das Wort bedeutet wörtlich »Samen«, bezeichnet hier aber überlebende Nachkommenschaft. »Nachkommen« ist natürlich und vermeidet, den im weiteren Zusammenhang vorhandenen Gedanken eines Restes direkt in dieses Lexem einzutragen.
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: wären wir wie Sodom geworden
  rationale: Gibt den irrealen Bedingungsfolgesatz und γίνομαι als »werden« präzise wieder.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: Gomorra gleichgemacht worden
  rationale: Erhält gegenüber »geworden« den passiven und lexikalisch abweichenden Ausdruck des zweiten Verbs.
theological_decisions:
- issue: Wiedergabe des Gottestitels κύριος Σαβαώθ
  choice: Herr der Heerscharen
  alternative: Herr Zebaoth; Herr der himmlischen Heere
  rationale: Der Haupttext übersetzt den Titel, statt die griechisch-hebräische Lautform bloß zu übernehmen. »Herr der Heerscharen« ist im Deutschen etabliert und bewahrt die Weite des Titels, ohne ihn ausschließlich militärisch oder ausschließlich auf Engel zu beziehen.
- issue: Deutung von σπέρμα im Kontext des Restgedankens
  choice: Nachkommen
  alternative: Samen; Rest
  rationale: »Nachkommen« gibt die kontextuelle Bedeutung des griechischen Wortes wieder. »Rest« würde den theologischen Zusammenhang explizit machen, ist aber nicht die unmittelbare lexikalische Entsprechung und wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kontrafaktische Satzform wird idiomatisch mit Konjunktiv II wiedergegeben. Die beiden griechischen Ergebnisverben bleiben durch »geworden« und »gleichgemacht worden« unterschieden.
