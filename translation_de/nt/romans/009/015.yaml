  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: de
  text: 'Denn er sagt zu Mose: »Ich werde Erbarmen schenken, wem ich Erbarmen schenke, und ich werde Mitleid haben, mit wem ich Mitleid habe.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat aus 2. Mose 33,19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: zu Mose
  rationale: Der Dativ bezeichnet den Adressaten von λέγει; »zu Mose« ist im Deutschen die natürliche Wiedergabe.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und bewahrt den argumentativen Zusammenhang.
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens der Zitierformel bleibt erhalten; aus dem Kontext von 2. Mose 33,19 ergibt sich Gott als Sprecher.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: Ich werde mich erbarmen … ich mich erbarme
  rationale: Die Wiederholung desselben deutschen Verbs bildet die Wiederholung von ἐλεέω ab und bewahrt die nachdrückliche Formulierung.
- source_word: ὃν ἂν
  choice: über wen / mit wem
  rationale: Relativpronomen mit ἄν bezeichnet hier einen unbestimmten Gegenstand. Die unterschiedlichen Präpositionen folgen dem idiomatischen deutschen Gebrauch der gewählten Verben.
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: ich werde Mitleid haben … ich Mitleid habe
  rationale: »Mitleid haben« unterscheidet οἰκτίρω von ἐλεέω und wahrt zugleich den parallelen, wiederholenden Satzbau.
theological_decisions:
- issue: Bestimmung des Sprechers in der Zitierformel
  choice: Persönlich mit »sagt er«, auf Gott bezogen
  alternative: 'Unpersönlich: »sagt die Schrift zu Mose«'
  rationale: Im Griechischen fehlt ein ausdrücklich genanntes Subjekt, doch das direkte Zitat aus 2. Mose 33,19 ist Gottes Rede. Die persönliche Form bewahrt diesen Kontext, ohne »Gott« in den Haupttext einzufügen.
- issue: Göttliche Freiheit im Erbarmen und Mitleid
  choice: Die repetitive Formulierung ohne erklärenden Zusatz bewahren
  alternative: 'Deutend erweitern: »über wen ich mich erbarmen will« oder »über wen ich mich zu erbarmen entscheide«'
  rationale: Der griechische Text enthält weder ein ausdrückliches »wollen« noch »entscheiden«. Die gewählte Fassung lässt die theologische Spannung bestehen, statt sie vorab auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und Wiederholung des griechischen Zitats bleiben erhalten. »Mitleid haben« ist gegenwärtig verständlich und markiert den lexikalischen Unterschied zwischen ἐλεέω und οἰκτίρω.
