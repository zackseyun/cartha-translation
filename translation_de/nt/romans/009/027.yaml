reference: Romans 9:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: de
  text: 'Jesaja aber ruft in Bezug auf Israel aus[a]: »Auch wenn die Zahl der Söhne Israels wie der Sand am Meer ist[b], wird nur der Überrest gerettet werden[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über Israel«; möglicherweise auch: »für Israel«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Wenn die Zahl der Söhne Israels wie der Sand des Meeres ist.« »Söhne Israels« ist eine traditionelle Bundesbezeichnung; gemeint sein können auch die »Kinder Israels« beziehungsweise die Israeliten.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »wird befreit werden«. Die Formulierung greift Jesajas Weissagung von einem verbleibenden Überrest auf.'
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet hier eine leichte Gegenüberstellung beziehungsweise den rhetorischen Fortgang gegenüber dem vorangehenden Gedanken.
- source_word: κράζει
  choice: ruft ... aus
  rationale: Bewahrt das anschauliche Präsens und die nachdrückliche, öffentliche Äußerung des Verbs.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: über Israel
  rationale: Im Zusammenhang des Prophetenwortes bedeutet ὑπέρ am ehesten »über/betreffend Israel«, nicht »zugunsten Israels«.
- source_word: Ἐὰν ᾖ
  choice: Auch wenn ... ist
  rationale: Gibt die im Kontext naheliegende konzessive Kraft der Bedingung wieder und wahrt zugleich deren konditionale Form deutlicher als ein bloßes »obwohl«.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Bewahrt die formale, traditionelle Bundesbezeichnung des griechischen Zitats; eine idiomatischere Alternative wird in der Fußnote genannt.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: wie der Sand am Meer
  rationale: Natürliches modernes Deutsch für das bekannte biblische Bild; »am Meer« bezeichnet idiomatisch den Meeressand.
- source_word: τὸ ὑπόλειμμα
  choice: der Rest
  rationale: Gibt die zurückbleibende Teilmenge verständlich und würdig wieder. »Überrest« wäre traditionssprachlich, klingt im heutigen allgemeinen Deutsch jedoch weniger natürlich.
- source_word: σωθήσεται
  choice: wird ... gerettet werden
  rationale: Bewahrt das theologische Gewicht des paulinischen Zusammenhangs, ohne die mögliche prophetische Nuance von Befreiung auszuschließen.
theological_decisions:
- issue: Sinn von Ἐὰν ᾖ im prophetischen Zitat
  choice: 'Konzessiv-konditional: »Auch wenn die Zahl ... ist«'
  alternative: 'Wörtlicher konditional: »Wenn die Zahl ... ist«'
  rationale: Der Satz stellt Israels große Zahl dem geretteten Rest gegenüber. »Auch wenn« macht diesen Gegensatz deutlich, ohne die griechische Bedingungsform vollständig aufzulösen.
- issue: Wiedergabe von σωθήσεται
  choice: »wird gerettet werden«
  alternative: »wird befreit werden«
  rationale: »Gerettet« entspricht dem Sprachgebrauch im Römerbrief und erhält die heilsgeschichtliche Spannung; »befreit« bleibt aufgrund des Jesaja-Hintergrunds möglich.
- issue: Wiedergabe von τὸ ὑπόλειμμα
  choice: »nur der Rest«
  alternative: »der Überrest«
  rationale: Der bestimmte Ausdruck bezeichnet den verbleibenden Teil Israels. Das aus dem Kontext erschlossene »nur« verdeutlicht den Gegensatz, ohne festzulegen, nach welchem theologischen Mechanismus dieser Rest gerettet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zitatstruktur und die traditionelle Bezeichnung »Söhne Israels« bleiben erhalten; erklärungsbedürftige lexikalische und syntaktische Möglichkeiten stehen in knappen Fußnoten.
