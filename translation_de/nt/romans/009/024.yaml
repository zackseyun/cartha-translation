  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: de
  text: uns, die er auch berufen hat – nicht nur aus den Juden, sondern auch aus den anderen Völkern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus den Völkern“; im Gegensatz zu den Juden sind hier die nichtjüdischen Völker gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: uns, die
  rationale: 'Das vorangestellte „uns“ gibt die appositionelle Identifizierung wieder: Die im vorherigen Vers genannten Menschen, denen Gott sein Erbarmen zeigen wollte, sind „wir“. Das Relativpronomen hält zugleich die syntaktische Verbindung zum vorherigen Satz aufrecht.'
- source_word: καὶ ἐκάλεσεν
  choice: auch berufen hat
  rationale: „Auch“ bewahrt die additive Kraft von καί; „berufen“ ist im paulinischen Zusammenhang die geläufige und theologisch angemessene Wiedergabe von καλέω.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: nicht nur ... sondern auch
  rationale: Die feste deutsche Korrelativkonstruktion bildet den griechischen Kontrast klar und natürlich ab.
- source_word: ἐξ Ἰουδαίων
  choice: aus den Juden
  rationale: ἐξ bezeichnet hier Herkunft beziehungsweise Zugehörigkeit zu einer Gruppe. Die Formulierung wahrt den direkten Gegensatz zur folgenden nichtjüdischen Gruppe.
- source_word: ἐξ ἐθνῶν
  choice: aus den anderen Völkern
  rationale: Wörtlich bezeichnet ἔθνη „Völker“; im Gegensatz zu den Juden sind die nichtjüdischen Völker gemeint. „Andere Völker“ macht diesen Gegensatz in natürlichem Deutsch verständlich, ohne den Grundbegriff durch einen kirchlichen Fachausdruck zu ersetzen.
theological_decisions:
- issue: Bezug auf die im vorherigen Vers genannten Gefäße des Erbarmens
  choice: uns, die er auch berufen hat
  alternative: die er auch berufen hat, nämlich uns
  rationale: Die gewählte Fassung identifiziert „uns“ mit der zuvor genannten Gruppe, lässt aber die syntaktische Abhängigkeit vom vorherigen Vers sichtbar und erklärt keine darüber hinausgehende Erwählungslehre in den Text hinein.
- issue: Jüdisch-nichtjüdischer heilsgeschichtlicher Gegensatz
  choice: aus den Juden ... aus den anderen Völkern
  alternative: aus Juden ... aus Heiden
  rationale: Die Übersetzung macht den ethnischen Gegensatz deutlich, ohne „Heiden“ zu verwenden, das im heutigen Deutsch abwertend oder religiös verengt verstanden werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bewahrt den Anschluss an den fortlaufenden Satz aus Vers 23; die Formulierung bleibt auch als Einzelvers verständlich.
