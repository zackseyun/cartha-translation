  source_fidelity: 'Die Übersetzung gibt die rhetorische Zurechtweisung treffend wieder: μενοῦνγε ist mit „Doch“ als adversativ-bekräftigende Wendung vertretbar erfasst; „wer bist du“ und „Gott widersprichst“ bewahren den herausfordernden bzw. oppositionellen Charakter von σὺ τίς εἶ und ἀνταποκρινόμενος τῷ θεῷ. „Wird etwa … sagen?“ gibt die auf Verneinung zielende Frage mit μή angemessen wieder. „Gebilde“ sowie „der es geformt hat“ erhalten das Formungsbild und die Verbindung von πλάσμα und πλάσαντι. Die abschließende Frage entspricht dem griechischen Wortlaut und lässt οὕτως offen.'
