source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: de
  text: 'Doch, Mensch, wer bist du, dass du Gott widersprichst? Wird etwa das Gebilde zu dem, der es geformt hat, sagen: »Warum hast du mich so gemacht?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Warum hast du mich so gemacht?« Die Frageformulierung ist bereits im Haupttext wörtlich wiedergegeben; »so« kann auch »auf diese Weise« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Doch
  rationale: Die Partikel bekräftigt und korrigiert zugleich den vorausgehenden Einwand. »Doch« gibt die adversative Wendung knapp und natürlich wieder.
- source_word: ὦ ἄνθρωπε
  choice: Mensch
  rationale: Der Vokativ richtet sich rhetorisch an einen einzelnen Menschen als Vertreter der Menschheit. Das deutsche »Mensch« bewahrt dies ohne unnötige Geschlechtsmarkierung.
- source_word: σὺ τίς εἶ
  choice: wer bist du
  rationale: Die Wendung ist eine scharfe rhetorische Herausforderung, keine sachliche Frage nach der Identität.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: dass du Gott widersprichst
  rationale: Das Partizip bezeichnet eine entgegnende, widerstreitende Antwort. »Widersprechen« bewahrt diesen oppositionellen Sinn besser als das neutrale »antworten«.
- source_word: μὴ ἐρεῖ
  choice: Wird etwa ... sagen
  rationale: μή mit Futur Indikativ leitet eine rhetorische Frage ein, die eine verneinende Antwort erwartet. »Etwa« macht diese Erwartung im Deutschen idiomatisch hörbar.
- source_word: τὸ πλάσμα
  choice: das Gebilde
  rationale: πλάσμα bezeichnet das Geformte oder Gestaltete. »Gebilde« wahrt den substantivischen Gegensatz zu dem, der formt.
- source_word: τῷ πλάσαντι
  choice: zu dem, der es geformt hat
  rationale: Die Formulierung erhält die Wortverbindung zwischen πλάσμα und πλάσαντι und bezeichnet klar den Urheber.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Warum hast du mich so gemacht?
  rationale: Dies gibt die knappe, natürliche Bedeutung des griechischen Satzes wieder; οὕτως bleibt mit »so« bewusst offen.
theological_decisions:
- issue: Repräsentative Bedeutung von ἄνθρωπε
  choice: Mit »Mensch« als allgemeiner Anrede wiedergegeben
  alternative: »O Mann« oder »du Mensch«
  rationale: Paulus spricht rhetorisch einen einzelnen Menschen als Geschöpf vor Gott an. »Mensch« erhält die allgemeine menschliche Bezogenheit des griechischen ἄνθρωπος.
- issue: Schärfe der Zurechtweisung
  choice: »Gott widersprichst«
  alternative: »Gott antwortest« oder »Gott eine Antwort gibst«
  rationale: Der griechische Ausdruck bezeichnet kein neutrales Antworten, sondern ein anmaßendes Entgegentreten. Die göttlich-menschliche Spannung wird daher nicht abgeschwächt.
- issue: Bild vom Geformten und Formenden
  choice: »Gebilde« und »geformt«
  alternative: »Werk« und »geschaffen«
  rationale: Die Übersetzung bewahrt das konkrete Formungsbild und löst es nicht vorschnell in eine allgemeinere Schöpfungsterminologie auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit scharfer rhetorischer Anrede. Das altertümlich wirkende »O Mensch« wurde vermieden; die Bildsprache vom Geformten und Formenden bleibt erhalten.
