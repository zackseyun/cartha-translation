review_pass:
  verdict: revise
  source_fidelity: Der Satzbau gibt die doppelte Abgrenzung von οὐδέ und ὅτι sowie den Gegensatz mit ἀλλά im Wesentlichen zutreffend wieder. Im Zitat ist jedoch „Durch Isaak“ gegenüber Ἐν Ἰσαὰκ weniger nah; „In Isaak“ bewahrt die Formulierung des griechischen Genesis-Zitats, ohne dessen Linienbezug auszudeuten.
  naturalness: „Auch sind nicht alle schon deshalb Kinder“ ist verständlich, aber die Stellung von „auch“ und „schon deshalb“ wirkt unnötig schwer. „Nicht alle sind Kinder, nur weil …“ ist modernes, natürliches Standarddeutsch. Die Formulierung „wird dir Nachkommenschaft genannt werden“ darf im Schriftzitat bewusst formal bleiben, ist aber mit „In Isaak“ klarer an die Vorlage gebunden.
  terminology: „Nachkommen“ und „Kinder“ sind angemessene, inklusive Wiedergaben von σπέρμα und τέκνα. Die Fußnotenalternative „berufen werden“ ist dagegen keine tragfähige lexikalische Alternative zu κληθήσεται; sie sollte durch „gerufen werden“ ersetzt werden. Interpretationen wie „bestimmt“ oder „zugerechnet“ gehören als mögliche kontextuelle Umschreibungen in die Anmerkung, nicht in den Text.
  issues:
  - severity: medium
    issue: Die Wiedergabe „Durch Isaak“ glättet Ἐν Ἰσαὰκ interpretierend.
    rationale: Im Abstammungszusammenhang kann „durch“ den Sinn treffend umschreiben, aber „in“ steht im griechischen Zitat und lässt die prägnante, traditionsgebundene Formulierung sowie ihre Auslegungsweite besser bestehen.
  - severity: medium
    issue: Die Fußnote bietet „berufen werden“ als Alternative zu „genannt werden“.
    rationale: „Berufen“ bedeutet im gegenwärtigen Deutsch gewöhnlich etwas anderes als das passive κληθήσεται („genannt/gerufen werden“) und kann eine theologisch spezifische Aussage nahelegen, die der Wortlaut nicht verlangt.
  - severity: low
    issue: Der Hauptsatz ist stilistisch schwerfällig.
    rationale: Die Umstellung zu „Nicht alle sind Kinder, nur weil …“ bewahrt die Logik und ist idiomatischer.
