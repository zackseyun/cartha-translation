  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: de
  text: 'Nicht alle sind Kinder, nur weil sie Abrahams Nachkommen[a] sind. Vielmehr heißt es: »In Isaak wird dir Nachkommenschaft genannt werden.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Same Abrahams“. Das griechische Wort steht im Singular, wird hier aber kollektiv für Nachkommenschaft beziehungsweise Nachkommen gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „In Isaak wird dir Nachkommenschaft gerufen werden.“ Das griechische „genannt werden“ kann im Zusammenhang auch im Sinn von „bestimmt“ oder „zugerechnet werden“ verstanden werden; die genaue Nuance bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Auch sind nicht alle schon deshalb …, weil
  rationale: οὐδέ führt die zusätzliche Verneinung aus dem vorherigen Gedankengang fort; die deutsche Satzform gibt die Folgerelation von ὅτι klar und natürlich wieder.
- source_word: σπέρμα Ἀβραάμ
  choice: Abrahams Nachkommen
  rationale: σπέρμα bezeichnet hier kollektiv die leibliche Nachkommenschaft. „Nachkommen“ ist im modernen Deutsch natürlich; die Alternative „Same“ wird in der Fußnote bewahrt.
- source_word: πάντες τέκνα
  choice: nicht alle … Kinder
  rationale: τέκνα ist geschlechtsübergreifend und wird sachgerecht mit „Kinder“ wiedergegeben. Der knappe Gegensatz zwischen Abstammung und Kindschaft bleibt bestehen.
- source_word: ἀλλ’
  choice: Vielmehr heißt es
  rationale: ἀλλά korrigiert die vorherige Annahme scharf. „Vielmehr“ bewahrt diese argumentative Funktion; „heißt es“ führt das Schriftzitat im Deutschen natürlich ein.
- source_word: Ἐν Ἰσαὰκ
  choice: Durch Isaak
  rationale: ἐν kann in diesem semitisch geprägten Abstammungskontext die Linie oder Vermittlung bezeichnen. „Durch Isaak“ ist verständlich, ohne die Aussage zu einer bloßen Herkunftserklärung auszuweiten.
- source_word: κληθήσεταί σοι σπέρμα
  choice: wird dir Nachkommenschaft genannt werden
  rationale: Die Formulierung bewahrt Passiv, Dativ und die Grundbedeutung „rufen/nennen“. Sie lässt offen, ob das Nennen hier Benennung, Bestimmung oder Zurechnung meint.
theological_decisions:
- issue: Verhältnis leiblicher Abstammung zur Kindschaft
  choice: Die Übersetzung unterscheidet Abrahams leibliche Nachkommen von den „Kindern“, ohne die Art dieser Kindschaft im Vers erklärend festzulegen.
  alternative: „Kinder der Verheißung“ oder „Bundeskinder“ ausdrücklich in den Text einsetzen
  rationale: Solche Erläuterungen passen zum Kontext, stehen jedoch nicht ausdrücklich in diesem Vers und würden die theologische Spannung vorzeitig auflösen.
- issue: Aussagekraft des Genesis-Zitats
  choice: „genannt werden“
  alternative: „zugerechnet werden“ oder „gelten“
  rationale: Die formalere Wiedergabe hält die Bedeutung von καλέω offen und vermeidet es, die paulinische Anwendung bereits in der Übersetzung auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Hauptsatz wurde gegenüber der griechischen Wortfolge umgestellt, um die logische Verneinung idiomatisch auszudrücken. Das Zitat bleibt bewusst etwas feierlich und formal, damit seine schriftsprachliche Prägung und semantische Offenheit erhalten bleiben.
