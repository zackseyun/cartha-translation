  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: de
  text: 'Wie er auch bei Hosea[a] sagt: »Ich werde die, die nicht mein Volk sind[b], ›mein Volk‹ nennen und die, die nicht geliebt ist, ›Geliebte‹ nennen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das Buch Hosea; vgl. Hosea 2,25. Die Verszählung kann je nach Bibelausgabe abweichen.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher der griechischen Einzahl folgend: »den, der nicht mein Volk ist«. Der Ausdruck »Volk« ist jedoch kollektiv gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »die Geliebte« beziehungsweise »die, die geliebt ist«. Das griechische Wort gehört zur Wortfamilie für »lieben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: Wie er auch
  rationale: Die Wendung leitet einen bestätigenden Schriftbeleg ein; die deutsche Form bewahrt sowohl den Vergleichs- als auch den ergänzenden Sinn.
- source_word: ἐν τῷ Ὡσηὲ
  choice: bei Hosea
  rationale: Dies ist eine natürliche deutsche Zitierformel, die auf die Hoseaschrift verweist, ohne den griechischen Ausdruck unnötig auszubauen.
- source_word: λέγει
  choice: sagt
  rationale: Das persönliche Verb bleibt erhalten; als unausgesprochenes Subjekt ist Gott zu verstehen, der in der Schrift spricht.
- source_word: Καλέσω
  choice: Ich werde … nennen
  rationale: „Nennen“ gibt hier die Benennung beziehungsweise die Zuerkennung eines neuen Status natürlich wieder und bewahrt das Futur.
- source_word: τὸν οὐ λαόν μου
  choice: die, die nicht mein Volk waren
  rationale: Die griechische Form steht grammatisch im Singular, hat mit λαός jedoch kollektiven Sinn. Der deutsche Plural macht diesen Bezug verständlich; „waren“ verdeutlicht den vorausgesetzten früheren Zustand.
- source_word: λαόν μου
  choice: mein Volk
  rationale: Die knappe, geläufige Bundesformel wird unmittelbar bewahrt.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: die, die nicht geliebt war
  rationale: Die feminine Singularform und der passive Sinn des Partizips bleiben sichtbar und damit auch der Bezug zur Hoseastelle.
- source_word: ἠγαπημένην
  choice: Geliebte
  rationale: Die substantivierte feminine Form ist im Deutschen natürlich, bewahrt den Gegensatz zu „nicht geliebt“ und lässt den Bezug auf eine weiblich dargestellte Größe erkennen.
theological_decisions:
- issue: Kollektiver oder individueller Sinn des Hoseazitats
  choice: Die erste singularische griechische Wendung wird kollektiv im Plural wiedergegeben; die zweite bleibt feminin und singularisch.
  alternative: Beide Wendungen streng singularisch wiedergeben oder als Eigennamen „Nicht-mein-Volk“ und „Nicht-Geliebte“ gestalten.
  rationale: Paulus führt Hoseas Wiederherstellungsaussage als Beleg für Gottes Berufung eines Volkes an. Der Plural entspricht beim ersten Ausdruck natürlichem Deutsch, während die feminine Einzahl des zweiten Ausdrucks für den Hosea-Hintergrund bedeutsam ist und daher nicht eingeebnet wird.
- issue: Wer in der Zitierformel spricht
  choice: Das Subjekt bleibt wie im Griechischen unausgesprochen und wird durch „er“ im einleitenden Satz aufgenommen.
  alternative: 'Unpersönlich formulieren: „wie es auch bei Hosea heißt“.'
  rationale: Die persönliche Redeweise des griechischen Textes wird bewahrt, ohne das Subjekt ausdrücklich als Gott zu ergänzen und damit stärker auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftzitat. Die Anführungszeichen innerhalb des Zitats kennzeichnen die von Gott verliehenen Bezeichnungen. Die kollektive Aussage der ersten Hälfte wird idiomatisch wiedergegeben, während das feminine Profil der zweiten Hälfte erhalten bleibt.
