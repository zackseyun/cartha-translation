  terminology: »mein Volk« bewahrt die zentrale biblische Bundesformel. »Geliebte« gibt ἠγαπημένην als feminine substantivierte Bezeichnung treffend wieder. Die Fußnote zur Einzahl muss jedoch das maskuline τὸν korrekt als »den, der« wiedergeben; »das, was« verfälscht das grammatische Profil des griechischen Ausdrucks.
