source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: de
  text: die Israeliten sind, denen die Annahme als Kinder[a], die Herrlichkeit[b], die Bündnisse, die Gesetzgebung, der Gottesdienst[c] und die Verheißungen gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sohnschaft“. Gemeint ist Israels Stellung als von Gott angenommenes Volk.'
    reason: lexical_alternative
  - marker: b
    text: Mit der „Herrlichkeit“ ist wahrscheinlich Gottes offenbarte Gegenwart unter Israel gemeint.
    reason: cross_reference
  - marker: c
    text: 'Das heißt: der kultische Dienst Israels vor Gott.'
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: die Israeliten sind
  rationale: Der Relativsatz setzt die Aussage des vorhergehenden Verses fort. Die schlichte Formulierung bewahrt diesen syntaktischen Anschluss und die geschichtlich-bundestheologische Bezeichnung.
- source_word: ὧν
  choice: Ihnen gehören
  rationale: Der Genitiv drückt Zugehörigkeit aus. Ein neuer deutscher Hauptsatz ist natürlich und gibt die possessive Beziehung eindeutig wieder.
- source_word: υἱοθεσία
  choice: die Annahme als Kinder
  rationale: Die Formulierung bewahrt das Bild der Aufnahme in den Kindesstand und bezeichnet hier Israels gemeinschaftliche Stellung vor Gott, ohne den Ausdruck auf individuelle Erlösung zu verengen.
- source_word: δόξα
  choice: die Herrlichkeit
  rationale: Die offene Formulierung des Griechischen bleibt erhalten; wahrscheinlich ist Gottes sichtbar offenbarte Gegenwart unter Israel gemeint.
- source_word: διαθῆκαι
  choice: die Bündnisse
  rationale: Der Plural des Ausgangstextes wird bewahrt. „Bündnisse“ ist die geläufige deutsche Wiedergabe im biblischen Zusammenhang.
- source_word: νομοθεσία
  choice: die Gesetzgebung
  rationale: Der Ausdruck bezeichnet die Gabe beziehungsweise Einsetzung des Gesetzes, nicht nur das Gesetz als solches.
- source_word: λατρεία
  choice: der Gottesdienst
  rationale: Gemeint ist der Israel anvertraute, geordnete Dienst vor Gott. „Gottesdienst“ bewahrt sowohl den Dienst- als auch den Anbetungsaspekt.
- source_word: ἐπαγγελίαι
  choice: die Verheißungen
  rationale: Der Plural wird beibehalten und verweist auf die Israel gegebenen Zusagen Gottes.
theological_decisions:
- issue: Bedeutung von υἱοθεσία für Israel
  choice: Annahme als Kinder
  alternative: Sohnschaft; Annahme an Sohnes statt
  rationale: Der Zusammenhang zählt die geschichtlichen Vorrechte Israels als Volk auf. Die Wiedergabe wahrt das familiäre Bundesbild, ohne spätere individual-soteriologische Aussagen in den Vers einzutragen.
- issue: Bezug von ἡ δόξα
  choice: die Herrlichkeit
  alternative: die Herrlichkeit Gottes; die Gegenwart der Herrlichkeit
  rationale: Wahrscheinlich ist Gottes offenbarte Gegenwart unter Israel gemeint; da der griechische Text nur „die Herrlichkeit“ sagt, bleibt die theologisch dichte Wendung im Haupttext unaufgelöst.
- issue: Umfang von λατρεία
  choice: der Gottesdienst
  alternative: der Tempeldienst; der Dienst vor Gott
  rationale: Der kultische Sinn ist im Zusammenhang naheliegend, doch der Ausdruck wird nicht unnötig allein auf Tempel oder Priestertum beschränkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Fortsetzung des Satzes aus dem vorhergehenden Vers erkennbar; der zweite Relativsatz wird zur besseren Lesbarkeit als Hauptsatz wiedergegeben. Die Aufzählung folgt eng der Reihenfolge des griechischen Textes.
