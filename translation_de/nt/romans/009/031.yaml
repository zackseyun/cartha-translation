id: ROM.9.31
reference: Romans 9:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: de
  text: Israel aber, das einem Gesetz der Gerechtigkeit nachjagte, gelangte nicht zu diesem Gesetz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „gelangte nicht zu einem Gesetz“ oder „erreichte das Gesetz nicht“. Die griechische Formulierung ist knapp und schwierig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραὴλ
  choice: Israel
  rationale: Die übliche Form des Eigennamens; im Zusammenhang bezeichnet er Israel als Volk.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zur unmittelbar zuvor genannten Situation der Nichtjuden.
- source_word: διώκων
  choice: nachjagte
  rationale: Gibt das aktive, zielgerichtete Streben des Partizips wieder, ohne die nicht ausdrücklich markierte konzessive Nuance „obwohl“ einzufügen.
- source_word: νόμον δικαιοσύνης
  choice: einem Gesetz der Gerechtigkeit
  rationale: Der fehlende Artikel wird mit „einem“ berücksichtigt. Der Genitiv bleibt bewusst knapp und offen, statt ihn etwa als „ein Gesetz, das zur Gerechtigkeit führt“ auszudeuten.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist im Deutschen die natürliche und in diesem paulinischen Zusammenhang sachlich offene Wiedergabe; sie kann sowohl gerechtes Handeln als auch den rechten Stand vor Gott bezeichnen.
- source_word: εἰς νόμον οὐκ ἔφθασεν
  choice: gelangte nicht zu diesem Gesetz
  rationale: „Gelangte … zu“ bildet die Zielrichtung von εἰς und das Nichterreichen bei ἔφθασεν ab. „diesem Gesetz“ versteht die Wiederholung resumptiv, ohne ein nicht genanntes „Ziel des Gesetzes“ einzuführen.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im paulinischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; ein Gesetz, das zur Gerechtigkeit führt
  rationale: Die Übersetzung bewahrt den zentralen theologischen Begriff und lässt offen, wie genau der Genitiv νόμον δικαιοσύνης zu bestimmen ist.
- issue: Bezug des zweiten νόμον
  choice: diesem Gesetz
  alternative: zum Gesetz; zu einem Gesetz
  rationale: Die resumptive Wiedergabe verbindet das zweite νόμον mit dem zuvor genannten Gesetz. Wegen der gedrängten und schwierigen griechischen Formulierung wird die wörtlichere Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nachjagte“ bewahrt die Intensität von διώκω; die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken. Der einzige Fußnotenmarker [a] steht unmittelbar nach der betroffenen Aussage.
