id: ROM.9.8
reference: Romans 9:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: de
  text: 'Das heißt: Nicht die Kinder des Fleisches sind Kinder Gottes, sondern die Kinder der Verheißung werden als Nachkommen angerechnet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »als Same«. Das griechische Wort bezeichnet hier im Zusammenhang mit Abraham seine Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Das heißt
  rationale: Leitet idiomatisch und präzise die Erläuterung der vorherigen Aussage ein.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: die Kinder des Fleisches
  rationale: Bewahrt den paulinischen Ausdruck und den ausdrücklichen Gegensatz zur Verheißung; gemeint ist hier die natürliche Abstammung.
- source_word: τέκνα τοῦ θεοῦ
  choice: Kinder Gottes
  rationale: Gibt den Genitiv natürlich wieder und bewahrt die theologische Bezeichnung ohne zusätzliche Deutung.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: die Kinder der Verheißung
  rationale: Erhält die parallele Genitivkonstruktion und bezeichnet Kinder, deren Stellung durch Gottes Verheißung bestimmt ist.
- source_word: λογίζεται εἰς σπέρμα
  choice: werden als Nachkommen angerechnet
  rationale: Das singularische Kollektivum σπέρμα bezeichnet im abrahamitischen Zusammenhang die Nachkommenschaft; λογίζεται wird als passivische Aussage des Anrechnens beziehungsweise Zurechnens wiedergegeben.
theological_decisions:
- issue: Gegensatz zwischen natürlicher Abstammung und der durch die Verheißung bestimmten Nachkommenschaft
  choice: Der Wortlaut unterscheidet Kinder des Fleisches von Kindern der Verheißung, die als Nachkommen angerechnet werden.
  alternative: Den Vers ausdrücklich ausschließlich korporativ-heilsgeschichtlich oder ausdrücklich individual-prädestinatianisch auszulegen.
  rationale: Der griechische Text formuliert den Gegensatz, entscheidet aber in diesem Vers allein nicht alle weitergehenden theologischen Fragen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Kinder des Fleisches« bleibt als markanter paulinischer Ausdruck erhalten; die Fußnote erläutert nur das potenziell missverständliche Kollektivum »Same«.
