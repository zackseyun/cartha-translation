  text: dass ich große Trauer und unaufhörlichen Schmerz in meinem Herzen habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: dass
  rationale: Leitet in Verbindung mit dem vorhergehenden Vers den Inhalt von Paulus’ feierlicher Aussage ein; „weil“ wäre hier weniger wahrscheinlich.
- source_word: λύπη
  choice: Trauer
  rationale: Bezeichnet tiefe Betrübnis oder Traurigkeit; „Trauer“ ist gewichtig, natürlich und lässt sich klar vom folgenden „Schmerz“ unterscheiden.
- source_word: μοί ἐστιν
  choice: ich … habe
  rationale: Die Verbindung aus Dativpronomen und εἰμί bezeichnet hier idiomatisch einen anhaltenden inneren Zustand; die deutsche Besitzkonstruktion gibt dies natürlich wieder.
- source_word: μεγάλη
  choice: große
  rationale: Bewahrt die schlichte und starke Intensivierung des Substantivs λύπη.
- source_word: καὶ
  choice: und
  rationale: Verbindet die beiden parallelen Ausdrücke des Leids ohne zusätzliche Deutung.
- source_word: ἀδιάλειπτος
  choice: unaufhörlichen
  rationale: Drückt die fortdauernde, nicht abreißende Beschaffenheit des Schmerzes aus.
- source_word: ὀδύνη
  choice: Schmerz
  rationale: Bezeichnet schweren inneren Schmerz oder Qual; „Schmerz“ ist direkt, verständlich und deutet weniger stark als „Qual“.
- source_word: τῇ καρδίᾳ μου
  choice: in meinem Herzen
  rationale: Das griechische Dativgefüge wird im Deutschen idiomatisch mit „in“ wiedergegeben; „Herz“ bewahrt das biblische Bild für das innere Empfinden.
