  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: de
  text: Nehmt den, der im Glauben schwach ist, auf,[a] nicht um über Auffassungen zu streiten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heißt den, der im Glauben schwach ist, willkommen.“ Das griechische Verb kann bedeuten, jemanden bei sich oder in die Gemeinschaft aufzunehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „nicht, um strittige Überlegungen zu beurteilen“ oder „nicht zu Auseinandersetzungen über Gedankengänge“. Die griechische Formulierung ist mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: den, der … schwach ist
  rationale: Das substantivierte Präsenspartizip bezeichnet eine Person, die schwach ist, ohne die Art der Schwäche über den folgenden Ausdruck hinaus näher festzulegen.
- source_word: τῇ πίστει
  choice: im Glauben
  rationale: Der Dativ bezeichnet den Bereich bzw. die Hinsicht der Schwäche. „Im Glauben“ bewahrt den theologischen Leitbegriff, ohne ausdrücklich einen objektiven Lehrbestand oder das Gewissen einzutragen.
- source_word: προσλαμβάνεσθε
  choice: nehmt … bei euch auf
  rationale: Der mediale Imperativ fordert dazu auf, die betreffende Person in die eigene Gemeinschaft aufzunehmen. Die deutsche Wendung gibt den gemeinschaftlichen Sinn natürlicher und genauer wieder als das isolierte „empfangt“.
- source_word: μὴ εἰς
  choice: aber nicht, um
  rationale: Die Konstruktion bezeichnet hier einen zu vermeidenden Zweck. Das ergänzte „aber“ macht den im δέ und in der Negation liegenden Kontrast im Deutschen natürlich erkennbar.
- source_word: διακρίσεις
  choice: zu streiten
  rationale: Im Zusammenhang meint das Wort kontroverse Beurteilungen bzw. Auseinandersetzungen, nicht bloß neutrale Unterscheidungen. Die verbale Formulierung ist im modernen Deutsch idiomatisch.
- source_word: διαλογισμῶν
  choice: über unterschiedliche Auffassungen
  rationale: Der Genitiv bezeichnet die Gedanken, Erwägungen oder Meinungen, die zum Gegenstand kontroverser Beurteilung werden. „Auffassungen“ bleibt verständlich, ohne den Ausdruck auf bloße Gewissensskrupel zu verengen.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen leichten Übergang bzw. Kontrast. Wegen des vorausgehenden Aufnahmegebots wird seine Kraft in der zweiten Satzhälfte natürlich durch „aber nicht“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Vertrauen; Glauben als persönliche Überzeugung; Glaubenstreue
  rationale: „Glauben“ wahrt den üblichen theologischen Begriff und die Offenheit des griechischen Ausdrucks. Der Kontext legt zwar praktische Überzeugungen nahe, doch der Vers nennt weder ausdrücklich das Gewissen noch einen abgeschlossenen Lehrbestand.
- issue: Ziel des Aufnahmegebots
  choice: Aufnahme ohne Streit über unterschiedliche Auffassungen
  alternative: Aufnahme ohne verurteilende Beurteilung von Gedankengängen
  rationale: Die schwierige Verbindung διακρίσεις διαλογισμῶν kann Auseinandersetzungen über Meinungen oder urteilendes Bewerten von Erwägungen bezeichnen. Der Haupttext wählt die im Kontext gut verständliche erste Möglichkeit; die Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bei euch aufnehmen“ bringt den gemeinschaftlichen Gehalt idiomatisch zum Ausdruck; die schwer eindeutige Schlusswendung wird lesbar wiedergegeben, während ihre echte Mehrdeutigkeit in der Fußnote bewahrt bleibt.
