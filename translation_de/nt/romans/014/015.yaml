id: ROM.14.15
reference: Romans 14:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: de
  text: Denn wenn dein Bruder wegen einer Speise betrübt wird[a], lebst du nicht mehr der Liebe entsprechend. Richte mit deiner Speise nicht den zugrunde[b], für den der Messias gestorben ist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Bruder oder deine Schwester“; das griechische Wort „Bruder“ kann hier stellvertretend einen anderen gläubigen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Verderbe nicht“ beziehungsweise „Lass nicht zugrunde gehen“. Das griechische Verb ist stark und kann schweren geistlichen Schaden oder Verderben bezeichnen; welche genaue lehrmäßige Tragweite gemeint ist, legt der Vers nicht fest.'
    reason: alternative_reading
  - marker: c
    text: Griechisch „Christus“; hier als Titel mit „der Messias“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: Speise / mit deiner Speise
  rationale: Das Wort bezeichnet hier Nahrung allgemein, nicht speziell Fleisch. „Speise“ bewahrt den weiten Sinn und passt zum sachlich-gehobenen Register; der Dativ bezeichnet Mittel oder Anlass.
- source_word: ἀδελφός
  choice: Bruder
  rationale: Die griechische Form ist maskulin Singular. „Bruder“ gibt sie genau wieder; die mögliche repräsentative Einbeziehung einer Schwester wird in der Fußnote erläutert.
- source_word: λυπεῖται
  choice: betrübt wird
  rationale: Die Form bezeichnet, dass jemand Kummer oder Schmerz erfährt. „Betrübt wird“ erhält sowohl die Passivform als auch das emotionale Gewicht, ohne die Art der Beeinträchtigung näher festzulegen.
- source_word: κατὰ ἀγάπην
  choice: der Liebe entsprechend
  rationale: Diese Formulierung gibt κατά als Maßstab wieder und klingt im Deutschen natürlicher als das wörtlichere „gemäß der Liebe“.
- source_word: περιπατεῖς
  choice: lebst
  rationale: Das griechische Bild des Gehens bezeichnet hier die Lebensführung. Im modernen Deutschen vermittelt „lebst“ den ethischen Sinn klarer als das missverständliche „wandelst“.
- source_word: ἀπόλλυε
  choice: richte ... nicht zugrunde
  rationale: Die Wendung bewahrt die Stärke des Verbs und lässt zugleich offen, ob zeitlicher geistlicher Ruin oder endgültiges Verderben gemeint ist.
- source_word: ἐκεῖνον
  choice: den
  rationale: Das deutsche Demonstrativpronomen verweist betont auf den bereits genannten Bruder und verbindet sich natürlich mit dem folgenden Relativsatz.
- source_word: ὑπὲρ οὗ
  choice: für den
  rationale: „Für den“ gibt ὑπέρ mit Genitiv idiomatisch wieder und bewahrt den stellvertretenden beziehungsweise hingebenden Bezug.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός ist hier als Titel gebraucht. „Der Messias“ macht dessen Bedeutung für heutige Leser transparent.
- source_word: ἀπέθανεν
  choice: gestorben ist
  rationale: Das Perfekt ist die natürliche deutsche Wiedergabe des griechischen Aorists in diesem Relativsatz und bezeichnet das vollzogene Sterben.
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: „Denn“ wahrt die argumentative Verbindung zum Vorhergehenden, während „wenn“ die Bedingungsstruktur erhält.
theological_decisions:
- issue: Tragweite von ἀπόλλυε für den Bruder
  choice: „Richte ... nicht zugrunde“ als ernste, aber nicht dogmatisch eingeengte Warnung
  alternative: „Verderbe nicht“ oder ausdrücklich „Führe nicht ins ewige Verderben“
  rationale: Das Verb ist stark, doch der Vers entscheidet nicht ausdrücklich zwischen schwerem geistlichem Schaden und endgültigem Verderben. Die Übersetzung bewahrt diese Spannung.
- issue: Referenz von ἀδελφός
  choice: Im Haupttext „Bruder“
  alternative: „Bruder oder Schwester“ beziehungsweise „Glaubensgeschwister“
  rationale: Die maskuline Singularform wird im Haupttext erhalten; ihre mögliche repräsentative Verwendung in der Gemeinde wird in einer Fußnote kenntlich gemacht.
- issue: Wiedergabe von Χριστός
  choice: „der Messias“
  alternative: „Christus“
  rationale: Das Wort trägt hier Titelcharakter. „Messias“ übersetzt den Titel, statt ihn lediglich in seiner traditionellen griechisch-lateinischen Form wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Speise“ hält den allgemeinen Sinn von βρῶμα fest, ohne ihn auf Fleisch zu verengen. Das heute ungebräuchliche ethische „wandeln“ wird zugunsten von „leben“ vermieden. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
