id: ROM.14.2
reference: Romans 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: de
  text: Der eine ist überzeugt, alles essen zu dürfen; der Schwache aber isst Gemüse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς μὲν
  choice: Der eine
  rationale: Die Wendung eröffnet den ersten Teil eines Gegensatzpaares und bezeichnet eine repräsentative Einzelperson, ohne ein Geschlecht hervorzuheben.
- source_word: πιστεύει
  choice: ist überzeugt
  rationale: Mit dem folgenden Infinitiv bezeichnet πιστεύει hier eine persönliche Überzeugung hinsichtlich des Essens, nicht ausdrücklich den rettenden Glauben. „Ist überzeugt“ gibt diesen Gebrauch im Deutschen natürlich wieder.
- source_word: φαγεῖν πάντα
  choice: alles essen zu dürfen
  rationale: Der Infinitiv nennt den Inhalt der Überzeugung. „Dürfen“ macht die im Kontext gemeinte Erlaubtheit der Speisen idiomatisch deutlich, ohne die Aussage auf bestimmte Lebensmittel einzuengen.
- source_word: ὁ δὲ
  choice: der andere aber
  rationale: Die Formulierung markiert den zweiten Teil des Gegensatzes. Das im Griechischen wörtlich mögliche „der aber“ wird im Deutschen durch „der andere aber“ verständlich und natürlich wiedergegeben.
- source_word: ἀσθενῶν
  choice: der schwach ist
  rationale: Das substantivierte Partizip bezeichnet die als schwach charakterisierte Person. Die Art der Schwäche wird im Haupttext nicht ergänzt, da sie erst aus dem Zusammenhang mit Römer 14,1 hervorgeht.
- source_word: λάχανα
  choice: Gemüse
  rationale: λάχανα bezeichnet Gartengewächse beziehungsweise Gemüse. „Gemüse“ ist die klare, gegenwärtige Standardentsprechung; „Kräuter“ wäre zu eng.
- source_word: ἐσθίει
  choice: isst
  rationale: Das Verb sagt schlicht aus, was die schwache Person isst. Ein ausdrückliches „nur“ wird nicht ergänzt, weil die Ausschließlichkeit zwar durch den Gegensatz nahegelegt, aber lexikalisch nicht ausgedrückt ist.
theological_decisions:
- issue: Art der mit ἀσθενῶν bezeichneten Schwäche
  choice: „der schwach ist“, ohne Ergänzung im Haupttext
  alternative: „der im Glauben schwach ist“
  rationale: Römer 14,1 ordnet die Schwäche dem Bereich des Glaubens beziehungsweise der gewissenhaften Beurteilung von Speisepraktiken zu. Vers 2 selbst nennt jedoch nur „den Schwachen“. Die knappe Wiedergabe bewahrt den Wortlaut und lässt den Kontext die nähere Bedeutung bestimmen.
- issue: Bedeutung von πιστεύει in Verbindung mit φαγεῖν πάντα
  choice: persönliche Überzeugung, alles essen zu dürfen
  alternative: „glaubt, alles essen zu können“
  rationale: Der Zusammenhang betrifft nicht körperliche Fähigkeit, sondern die Überzeugung, dass sämtliche Speisen erlaubt sind. „Dürfen“ macht diesen Bezug deutlich, ohne eine konfessionelle Speiseregel vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz bleibt erhalten; die grammatische Maskulinform „der eine/der andere“ ist hier generisch. Die Art der Schwäche wird nicht in den Vers hineinerklärt.
