id: ROM.14.17
reference: Romans 14:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: de
  text: Denn das Reich Gottes besteht nicht in Essen und Trinken, sondern in Gerechtigkeit[a], Frieden und Freude im Heiligen Geist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtschaffenheit“. Das griechische Wort kann sowohl rechtes Verhalten als auch Gerechtigkeit im umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: Reich
  rationale: „Reich Gottes“ ist im Deutschen die geläufige und in diesem Zusammenhang umfassende Wiedergabe; „Herrschaft“ wäre ebenfalls möglich, würde hier aber den etablierten Ausdruck unnötig auflösen.
- source_word: βρῶσις καὶ πόσις
  choice: Essen und Trinken
  rationale: Die beiden Tätigkeitsbegriffe werden parallel und idiomatisch wiedergegeben; dies passt zum Kontext der umstrittenen Speise- und Trinkpraktiken.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die Breite des griechischen Begriffs zwischen rechtem Verhalten, Rechtschaffenheit und gerechtem Handeln besser als eine einengende Paraphrase.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Die übliche Wiedergabe erfasst hier sowohl Frieden als auch gemeinschaftliche Eintracht.
- source_word: χαρά
  choice: Freude
  rationale: „Freude“ ist die natürliche und sachlich entsprechende deutsche Wiedergabe.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die Formulierung bewahrt die Präposition und damit die mögliche Bedeutungssphäre beziehungsweise Wirksamkeit des Heiligen Geistes.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ macht den begründenden Anschluss an den vorherigen Gedankengang deutlich.
theological_decisions:
- issue: Bedeutungsbreite von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ ist die umfassendere und traditionelle deutsche Entsprechung, während „Rechtschaffenheit“ den ethisch-persönlichen Aspekt hervorhebt; die Fußnote bewahrt diese Bedeutungsnuance.
- issue: Bezug von πνεῦμα ἅγιον
  choice: Heiliger Geist als personale göttliche Referenz
  alternative: heiliger Geist im qualitativen Sinn
  rationale: Der paulinische Sprachgebrauch spricht hier am ehesten für den Heiligen Geist; das Fehlen des Artikels erzwingt keinen unpersönlichen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Besteht nicht in“ gibt die griechische Nominalsatzkonstruktion natürlich wieder, ohne den Gegensatz abzuschwächen.
