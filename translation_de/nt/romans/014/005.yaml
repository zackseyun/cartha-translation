  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: de
  text: Der eine hält einen Tag für wichtiger als einen anderen[a], der andere hält alle Tage für gleich[b]. Jeder soll in seinem eigenen Urteil völlig überzeugt sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der eine misst einem Tag mehr Bedeutung bei als einem anderen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »jeden Tag«; im Zusammenhang ist gemeint, dass alle Tage gleich beurteilt werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Jeder soll in seinem eigenen Urteil völlig gewiss sein« beziehungsweise »volle Gewissheit haben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: hält … für
  rationale: κρίνω bezeichnet hier ein wertendes Urteil, nicht eine Verurteilung. Die deutsche Wendung gibt diese Einschätzung natürlich wieder.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: einen Tag für wichtiger als einen anderen
  rationale: Die Konstruktion mit παρά drückt einen Vergleich beziehungsweise eine Unterscheidung zwischen Tagen aus, ohne festzulegen, um welche Tage es sich handelt.
- source_word: πᾶσαν ἡμέραν
  choice: alle Tage für gleich
  rationale: Wörtlich steht »jeden Tag«; aus dem Gegensatz ergibt sich, dass die zweite Person zwischen den Tagen keinen wertenden Unterschied macht.
- source_word: ἕκαστος
  choice: Jeder
  rationale: Die distributive Einzahl wird im Deutschen knapp und natürlich wiedergegeben und schließt im Kontext jede einzelne Person ein.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: in seinem eigenen Denken
  rationale: νοῦς bezeichnet das Denken, den Verstand oder die innere Urteilsbildung. Die Formulierung bewahrt den persönlichen und reflexiven Akzent.
- source_word: πληροφορείσθω
  choice: soll … volle Gewissheit haben
  rationale: Der Imperativ fordert eine gefestigte, volle Überzeugung. Die Formulierung ist im heutigen Deutsch verständlich und vermeidet den missverständlichen Eindruck, jemand müsse bloß selbstsicher auftreten.
theological_decisions:
- issue: Welche Art von Tagen gemeint ist
  choice: Die Tage werden nicht näher bestimmt.
  alternative: Sabbate, jüdische Festtage, Fastentage oder besondere Andachtstage ausdrücklich nennen.
  rationale: Paulus benennt die betreffenden Tage nicht. Die Übersetzung bewahrt diese Offenheit und legt keine bestimmte historische oder konfessionelle Deutung fest.
- issue: Generisches Maskulinum in der Einzahl
  choice: »Jeder … in seinem eigenen Denken«
  alternative: »Alle … in ihrem eigenen Denken« oder eine unpersönliche Formulierung
  rationale: Die griechische Einzahl ist distributiv und repräsentativ. Die deutsche Einzahl erhält den Nachdruck auf der persönlichen Überzeugung, ohne den Personenkreis einzuschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallele Gegenüberstellung bleibt klar; weder bestimmte Feiertage noch Sabbate oder Fastentage werden in den Text hineingelesen.
