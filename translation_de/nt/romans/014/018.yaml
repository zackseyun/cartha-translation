  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: de
  text: Denn wer Christus auf diese Weise dient, ist Gott wohlgefällig und bei den Menschen anerkannt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: auf diese Weise
  rationale: Die Wendung nimmt den unmittelbar vorausgehenden Gedanken auf und bezeichnet die Art, wie Christus gedient wird; die Formulierung bleibt offen genug für den Bezug auf Gerechtigkeit, Frieden und Freude in Vers 17.
- source_word: δουλεύων τῷ Χριστῷ
  choice: wer Christus … dient
  rationale: Das deutsche „dienen“ gibt den Dienstcharakter von δουλεύω natürlich und würdig wieder, ohne die im Deutschen hier unnötig harte Konnotation „Sklave sein“ in den Vordergrund zu rücken.
- source_word: εὐάρεστος τῷ θεῷ
  choice: Gott wohlgefällig
  rationale: „Wohlgefällig“ bewahrt die Bedeutung, dass dieser Dienst Gottes Zustimmung und Gefallen findet.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: bei den Menschen anerkannt
  rationale: δόκιμος bezeichnet jemanden, der sich als bewährt beziehungsweise anerkennenswert erweist. „Bei den Menschen anerkannt“ ist idiomatisch und gibt τοῖς ἀνθρώποις generisch wieder.
theological_decisions:
- issue: Bezug von ἐν τούτῳ
  choice: auf diese Weise
  alternative: darin
  rationale: Die Übersetzung deutet einen modalen Bezug an, legt aber nicht enger fest, ob ausschließlich die drei Größen aus Vers 17 oder die gesamte dort beschriebene Lebensweise gemeint ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Menschen“ entspricht dem generischen ἄνθρωποι und schließt Frauen und Männer ein.
