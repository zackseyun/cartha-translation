  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: de
  text: Es ist gut, kein Fleisch zu essen, keinen Wein zu trinken und auch nichts zu tun, wodurch dein Bruder stolpert, Anstoß nimmt oder schwach wird.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dein Bruder“ kann hier im Zusammenhang auch eine Schwester im Glauben einschließen, also einen anderen Glaubenden bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lassen „Anstoß nimmt oder schwach wird“ aus.
    reason: textual_variant
lexical_decisions:
- source_word: καλὸν
  choice: Es ist gut
  rationale: καλός bewertet den Verzicht als sittlich angemessen und lobenswert; die schlichte deutsche Wendung bewahrt die Breite des Ausdrucks.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: kein Fleisch zu essen
  rationale: Der substantivierte Infinitiv bezeichnet die Handlung allgemein; „Fleisch“ ist im Speisekontext die natürliche deutsche Entsprechung.
- source_word: μηδὲ πιεῖν οἶνον
  choice: und keinen Wein zu trinken
  rationale: μηδέ reiht einen weiteren Verzicht an; die deutsche Koordination gibt den kumulativen Gedanken natürlich wieder.
- source_word: μηδὲ ἐν ᾧ
  choice: und auch nichts zu tun, woran
  rationale: Der griechische Ausdruck ist elliptisch. Im Deutschen wird die vorausgesetzte Handlung behutsam ergänzt, ohne ihren Umfang auf eine bestimmte Tätigkeit einzuengen.
- source_word: ὁ ἀδελφός σου
  choice: dein Bruder
  rationale: Die maskuline Singularform wird im Haupttext formgetreu wiedergegeben; im Zusammenhang ist ein Bruder im Glauben gemeint und die mögliche inklusive Reichweite wird in der Fußnote erläutert.
- source_word: προσκόπτει
  choice: Anstoß nimmt
  rationale: Das Verb bezeichnet bildlich ein Anstoßen oder Straucheln; „Anstoß nehmen“ bewahrt das deutsche Bild und passt zum ethischen Zusammenhang.
- source_word: σκανδαλίζεται
  choice: zu Fall kommt
  rationale: Die Passivform bezeichnet, dass jemand in eine Falle beziehungsweise zum Stolpern gebracht wird. „Zu Fall kommt“ unterscheidet den Ausdruck von προσκόπτει, ohne ihn auf bloßes Beleidigtsein zu reduzieren.
- source_word: ἀσθενεῖ
  choice: schwach wird
  rationale: Der Ausdruck kann ein Schwachsein oder Schwachwerden bezeichnen. Im Kontext geht es um eine Beeinträchtigung des Glaubens beziehungsweise Gewissens, die Übersetzung lässt diese Beziehung jedoch unausgedeutet.
theological_decisions:
- issue: Repräsentative Bedeutung von ἀδελφός
  choice: dein Bruder
  alternative: dein Bruder oder deine Schwester; ein anderer Glaubender
  rationale: Der Haupttext wahrt Genus und Numerus des griechischen Ausdrucks. Da „Bruder“ hier im Zusammenhang wahrscheinlich repräsentativ für ein Mitglied der Glaubensgemeinschaft steht, wird diese Reichweite in einer Fußnote kenntlich gemacht.
- issue: Verhältnis der drei Verben προσκόπτει, σκανδαλίζεται und ἀσθενεῖ
  choice: Anstoß nimmt, zu Fall kommt oder schwach wird
  alternative: stolpert, Anstoß nimmt oder schwach ist
  rationale: Die drei koordinierten Ausdrücke bleiben als unterscheidbare, aber inhaltlich überlappende Folgen erhalten. Die Übersetzung legt nicht fest, ob sie eine Steigerung oder weitgehend synonyme Beschreibungen darstellen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Ellipse wird für natürliches Deutsch knapp ergänzt; die dreifache Folge bleibt erhalten, ohne die theologische Spannung durch eine vereinheitlichende Paraphrase aufzulösen.
