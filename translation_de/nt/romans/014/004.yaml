id: ROM.14.4
reference: Romans 14:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: de
  text: Wer bist du, dass du den Haussklaven eines anderen richtest? Vor seinem eigenen Herrn steht oder fällt er.[a] Er wird aber aufrecht gehalten werden, denn der Herr hat die Macht, ihn aufrecht zu halten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann der Satz auch heißen: „Seinem eigenen Herrn steht oder fällt er.“ Gemeint ist: Sein eigener Herr entscheidet, ob er besteht.'
    reason: Übersetzungsalternative zur Dativkonstruktion und Erläuterung der Bildsprache.
  - marker: b
    text: „Der Herr“ meint hier wahrscheinlich den Herrn im theologischen Sinn; möglich ist jedoch, den Ausdruck weiterhin auf den Herrn des Haussklaven im Vergleich zu beziehen.
    reason: Bewahrung der möglichen Mehrdeutigkeit des Bezugs von κύριος.
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Wer bist du, dass du … richtest?
  rationale: Die idiomatische deutsche Frage bewahrt den Nachdruck des vorangestellten σὺ und den vorwurfsvollen Charakter der rhetorischen Herausforderung.
- source_word: ἀλλότριον οἰκέτην
  choice: den Haussklaven eines anderen
  rationale: οἰκέτης bezeichnet einen zum Haus gehörenden Diener oder Sklaven. „Haussklave“ macht das unfreie soziale Verhältnis sichtbar; ἀλλότριον bezeichnet die Zugehörigkeit zu einem anderen Herrn.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: vor seinem eigenen Herrn
  rationale: Der Dativ bezeichnet hier die Instanz, vor der der Haussklave besteht oder fällt. „Herrn“ erhält zugleich die Verbindung zur erneuten Verwendung von κύριος im letzten Satzteil.
- source_word: στήκει ἢ πίπτει
  choice: steht oder fällt
  rationale: Die knappe Gegenüberstellung wahrt das Bild und lässt offen, ob vor allem Bewährung, Anerkennung oder Bestand gemeint ist.
- source_word: σταθήσεται
  choice: wird … aufrecht gehalten werden
  rationale: Die passive Form wird ausdrücklich wiedergegeben und deutet auf eine von außen wirkende, im Folgesatz dem Herrn zugeschriebene Kraft. „Aufrecht gehalten“ klingt im Deutschen natürlicher als „zum Stehen gebracht“.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: denn der Herr hat die Macht, ihn aufrecht zu halten
  rationale: „Hat die Macht“ gibt δυνατεῖ kräftig und natürlich wieder. Die Wiederholung von „aufrecht halten“ verbindet den Infinitiv στῆσαι sichtbar mit dem vorausgehenden Passiv σταθήσεται.
theological_decisions:
- issue: Bezug von ὁ κύριος im Schlusssatz
  choice: „der Herr“ als theologische Bezeichnung, wahrscheinlich für Christus
  alternative: der menschliche Herr des Haussklaven innerhalb des Vergleichs
  rationale: Der bestimmte Ausdruck und der paulinische Zusammenhang sprechen eher für den göttlichen Herrn, dessen Macht das Bestehen des Glaubenden sichert. Weil κύριος zuvor auch den Herrn des Haussklaven bezeichnet, bleibt die bewusste Überblendung des Bildes im deutschen „Herr“ erhalten.
- issue: Sinn des Stehens und Fallens
  choice: Bildsprache ohne ausdrückliche Festlegung auf Annahme, Verurteilung oder geistliche Standhaftigkeit
  alternative: explizite Deutung als Bestehen beziehungsweise Verurteiltwerden im göttlichen Gericht
  rationale: Der griechische Text lässt die genaue Tragweite des Bildes unausgesprochen. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haussklave“ bewahrt den historischen Status ausdrücklich. Die wiederholte Bildsprache von Stehen und Aufrechthalten sowie die zweimalige Wiedergabe von κύριος als „Herr“ erhalten die sprachlichen und theologischen Verknüpfungen des griechischen Textes.
