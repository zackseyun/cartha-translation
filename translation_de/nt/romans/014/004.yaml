  terminology: „Herr“ bewahrt die Wiederaufnahme von κύριος und lässt zugleich den Übergang vom Bildbereich zum theologischen Bezug sichtbar. Die Fußnote zum möglichen Bezug von „der Herr“ wahrt die verbleibende Auslegungsfrage, ohne sie dogmatisch zu entscheiden.
