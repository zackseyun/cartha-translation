  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: de
  text: Den Glauben, den du hast, bewahre für dich vor Gott.[a] Glücklich ist, wer sich nicht selbst verurteilt durch das, was er gutheißt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Überzeugung, die du hast, bewahre für dich vor Gott.“ Das griechische Wort πίστις bedeutet gewöhnlich „Glaube“, kann hier aber die persönliche Überzeugung in einer strittigen Frage bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wer sich nicht selbst verurteilt bei dem, was er gutheißt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: Glauben
  rationale: Die Grundbedeutung und Schlüsselwortverbindung von πίστις wird bewahrt; im Zusammenhang bezeichnet das Wort die persönliche Glaubensüberzeugung in einer strittigen Frage.
- source_word: κατὰ σεαυτὸν ἔχε
  choice: behalte für dich
  rationale: Die Wendung fordert dazu auf, die eigene Überzeugung nicht anderen aufzudrängen. Die knappe deutsche Formulierung gibt den idiomatischen Sinn natürlich wieder.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die traditionelle und natürliche Wendung wahrt den Gedanken, dass die persönliche Überzeugung unter Gottes Blick und in Verantwortung vor ihm besteht.
- source_word: μακάριος
  choice: Glücklich
  rationale: Im Aussagesatz bezeichnet μακάριος den beneidenswert guten Zustand dessen, dessen Gewissen ihn nicht verurteilt. „Glücklich“ ist hier idiomatisch und verständlich, ohne den göttlichen Bezug des Zusammenhangs auszuschließen.
- source_word: κρίνων ἑαυτὸν
  choice: sich selbst verurteilt
  rationale: 'Obwohl κρίνω allgemein „richten/beurteilen“ heißen kann, verlangt der Zusammenhang hier den negativen Sinn: Das eigene Urteil führt zur Selbstverurteilung.'
- source_word: ἐν ᾧ δοκιμάζει
  choice: durch das, was er gutheißt
  rationale: δοκιμάζω meint hier das nach Prüfung für gut Befundene beziehungsweise Gebilligte; ἐν kann in diesem Zusammenhang das Mittel oder den Anlass der Selbstverurteilung bezeichnen.
theological_decisions:
- issue: Bedeutung von πίστις im Zusammenhang strittiger Verhaltensfragen
  choice: „Glaube“ als persönliche, vor Gott bestehende Glaubensüberzeugung
  alternative: „Überzeugung“ als rein kontextbezogene Wiedergabe
  rationale: Der unmittelbare Zusammenhang betrifft Gewissensentscheidungen in umstrittenen Fragen. „Glaube“ erhält den paulinischen Schlüsselbegriff, während die Fußnote den kontextuellen Sinn ausdrücklich erläutert.
- issue: Stärke von κρίνων ἑαυτόν
  choice: „sich selbst verurteilt“
  alternative: „über sich selbst urteilt“
  rationale: Der Satz preist denjenigen glücklich, dessen gebilligtes Handeln keinen negativen Gewissensspruch gegen ihn hervorruft. „Verurteilt“ macht diese im Kontext angelegte negative Bedeutung deutlich, ohne eine endgültige göttliche Verdammung zu behaupten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Anrede wechselt entsprechend dem griechischen Text von der direkten zweiten Person zum allgemeinen Relativsatz. „Vor Gott“ bleibt von „für dich“ getrennt, damit die beiden griechischen Verhältnisangaben nicht zu „zwischen dir und Gott“ verschmolzen werden.
