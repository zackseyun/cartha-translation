id: ROM.14.14
reference: Romans 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: de
  text: Ich weiß und bin im Herrn Jesus überzeugt, dass nichts an sich unrein ist. Nur für den, der etwas für unrein hält, ist es unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gemein«. Das griechische Wort bezeichnet hier etwas, das als kultisch unrein oder profan gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Ich weiß
  rationale: Die direkte und natürliche deutsche Entsprechung des kognitiven Verbs.
- source_word: πέπεισμαι
  choice: bin … überzeugt
  rationale: Das Perfekt bezeichnet eine gefestigte Überzeugung; die deutsche Zustandsform gibt dies natürlich wieder.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: im Herrn Jesus
  rationale: Bewahrt die Präposition und lässt die genaue Beziehung bewusst offen, statt sie etwa kausal mit „durch“ festzulegen.
- source_word: κοινόν
  choice: unrein
  rationale: Im Zusammenhang mit Speise- und Reinheitsfragen bezeichnet κοινός etwas als kultisch unrein beziehungsweise profan Geltendes. „Unrein“ vermittelt diesen Sinn im heutigen Deutsch; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: δι’ ἑαυτοῦ
  choice: an sich
  rationale: Idiomatiche deutsche Wiedergabe für den Gedanken, dass nichts seinem eigenen Wesen nach unrein ist.
- source_word: τῷ λογιζομένῳ
  choice: für den, der … für … hält
  rationale: λογίζομαι bezeichnet hier das Einschätzen oder Ansehen einer Sache als etwas; die Konstruktion ist im Deutschen klar und natürlich.
- source_word: τι
  choice: etwas
  rationale: Natürliche Wiedergabe des indefiniten Pronomens in diesem Bedingungssatz.
- source_word: ἐκείνῳ κοινόν
  choice: für den … ist es unrein
  rationale: Der Dativ bezeichnet die persönliche Geltung. Die Formulierung erhält die individualisierte Aussage, ohne über den griechischen Wortlaut hinauszugehen.
theological_decisions:
- issue: Bedeutung von κοινός im Zusammenhang von Speise und Reinheit
  choice: „unrein“ im Haupttext
  alternative: „gemein“, „gewöhnlich“ oder „profan“
  rationale: Paulus verneint eine der Sache innewohnende Unreinheit, hält aber an der Gewissensrelevanz für die betreffende Person fest. „Unrein“ macht den Reinheitskontext verständlich, ohne objektive Unreinheit zu behaupten; die Grundbedeutung wird in der Fußnote transparent gehalten.
- issue: Beziehung von ἐν κυρίῳ Ἰησοῦ zur Überzeugung des Paulus
  choice: „im Herrn Jesus“
  alternative: „durch den Herrn Jesus“
  rationale: Die formnahe Wiedergabe bewahrt die mögliche Bedeutungssphäre von Gemeinschaft, Zugehörigkeit oder Autorität und legt nicht einseitig eine instrumentale Offenbarung durch Jesus fest.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Wiederholung von „unrein“ erhält die argumentative Zuspitzung des griechischen Satzes; „an sich“ gibt die intrinsische Aussage idiomatisch wieder.
