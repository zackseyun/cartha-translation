id: ROM.14.10
reference: Romans 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: de
  text: Du aber, warum urteilst du über deinen Bruder[a]? Oder auch du, warum verachtest du deinen Bruder? Denn wir werden alle vor dem Richterstuhl Gottes stehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Bruder oder deine Schwester“; griechisch: „deinen Bruder“.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften lesen: „vor dem Richterstuhl Christi“.'
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Du aber
  rationale: Bewahrt den Gegensatz durch δέ und die Hervorhebung des ausdrücklich gesetzten Pronomens σύ in natürlichem Deutsch.
- source_word: τί κρίνεις
  choice: warum urteilst du über
  rationale: τί ist in dieser rhetorischen Frage idiomatisch mit „warum“ wiedergegeben. „Über jemanden urteilen“ wahrt die Bedeutung von κρίνω, ohne sie vorschnell auf „verurteilen“ zu verengen.
- source_word: τὸν ἀδελφόν σου
  choice: deinen Bruder
  rationale: Gibt den grammatisch maskulinen Singular unmittelbar wieder; im Zusammenhang ist ein Glaubensbruder gemeint. Die mögliche inklusive Geltung wird in einer Fußnote genannt.
- source_word: ἢ καὶ σὺ
  choice: Oder auch du
  rationale: Erhält sowohl die Gegenüberstellung durch ἤ als auch die additive und hervorhebende Wirkung von καί und σύ.
- source_word: τί ἐξουθενεῖς
  choice: warum verachtest du
  rationale: „Verachten“ bringt prägnant zum Ausdruck, dass jemand als unbedeutend oder gering behandelt wird.
- source_word: πάντες γὰρ
  choice: Denn wir werden alle
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder; „wir … alle“ macht deutlich, dass Paulus sich und seine Adressaten einschließt.
- source_word: παραστησόμεθα
  choice: werden … stehen
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Verb das zukünftige Stehen beziehungsweise Erscheinen vor einer richterlichen Instanz.
- source_word: τῷ βήματι
  choice: vor dem Richterstuhl
  rationale: „Richterstuhl“ bewahrt das konkrete Gerichtsbild des βῆμα und ist im Deutschen als Bezeichnung der richterlichen Instanz verständlich.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Folgt unmittelbar dem Genitiv und der Lesart des SBLGNT.
theological_decisions:
- issue: Vor wessen Richterstuhl alle stehen werden
  choice: Gottes
  alternative: Christi
  rationale: Der vorgegebene griechische Text liest τοῦ θεοῦ. Die abweichende Lesart „Christi“ wird wegen ihrer handschriftlichen Bezeugung in einer Fußnote bewahrt und nicht mit 2. Korinther 5,10 harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen rhetorischen Fragen und der Wechsel zwischen Urteilen und Verachten bleiben erhalten. „Richterstuhl“ bewahrt die gerichtliche Metapher, ohne die Aussage konfessionell auszudeuten.
