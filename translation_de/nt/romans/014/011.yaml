source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: de
  text: 'Denn es steht geschrieben: »So wahr ich lebe, spricht der Herr: Vor mir wird sich jedes Knie beugen, und jede Zunge wird Gott bekennen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott anerkennen« oder »Gott preisen«. Das griechische Verb kann je nach Zusammenhang Bekennen, Anerkennen oder Preisen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Die feste deutsche Einleitungsformel für ein Schriftzitat gibt den fortbestehenden autoritativen Status des Geschriebenen natürlich wieder.
- source_word: Ζῶ ἐγώ
  choice: So wahr ich lebe
  rationale: Die idiomatische Schwurformel bewahrt den feierlichen Nachdruck der göttlichen Selbstaussage besser als das wörtliche »Ich lebe«.
- source_word: κύριος
  choice: der Herr
  rationale: Dies entspricht unmittelbar dem griechischen κύριος; die Schreibung »HERR« würde eine Rückübertragung des Gottesnamens vornehmen, der im griechischen Text nicht steht.
- source_word: ἐμοὶ
  choice: vor mir
  rationale: Beim Beugen des Knies ist »vor mir« im Deutschen die natürliche Ausdrucksweise für die durch den Dativ bezeichnete Ausrichtung, ohne den Bezug auf den Sprecher zu verändern.
- source_word: κάμψει πᾶν γόνυ
  choice: wird sich jedes Knie beugen
  rationale: Die Formulierung bewahrt das körperliche Bild und klingt im modernen Standarddeutsch natürlich und würdig.
- source_word: πᾶσα γλῶσσα
  choice: jede Zunge
  rationale: Die wörtliche Metapher erhält den schriftsprachlichen Anklang und die Vorstellung eines öffentlichen mündlichen Bekenntnisses.
- source_word: ἐξομολογήσεται
  choice: wird … bekennen
  rationale: »Bekennen« bewahrt hier die öffentliche Anerkennung; da das Verb je nach Zusammenhang auch Danken oder Preisen ausdrücken kann, wird diese Bedeutungsbreite in einer Fußnote genannt.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der deutsche Dativ nach »bekennen« gibt τῷ θεῷ ohne zusätzliche Präposition wieder und erhält den Wechsel von »mir« zu »Gott«.
theological_decisions:
- issue: Verhältnis von »Herr« und »Gott« innerhalb des Zitats
  choice: Der Wortlaut »spricht der Herr … vor mir … Gott bekennen« bleibt mit seinem Referenzwechsel erhalten.
  alternative: Den Schluss zur glatteren Parallelität als »mich bekennen« wiederzugeben oder die christologische Identifikation im Übersetzungstext ausdrücklich auszulegen.
  rationale: Paulus' griechischer Wortlaut wechselt von der göttlichen Rede in der ersten Person zu »Gott«. Die Übersetzung soll diese sprachliche und theologische Spannung weder harmonisieren noch durch eine lehrhafte Ergänzung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter Schriftzitat-Formel. Das Bild von Knie und Zunge bleibt erhalten; altertümliche Verbformen und konfessionell festgelegte Deutungen werden vermieden.
