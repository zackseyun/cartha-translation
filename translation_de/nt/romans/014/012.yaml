  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des griechischen Satzes zutreffend wieder: „Folglich“ wahrt den inferenziellen Anschluss von ἄρα, „jeder von uns“ die distributive Aussage von ἕκαστος ἡμῶν, und „wird ... Rechenschaft ablegen“ entspricht der festen Wendung λόγον δώσει. „über sich selbst“ gibt περὶ ἑαυτοῦ in dieser Verbindung sachgerecht wieder, ohne eine über den Text hinausgehende Deutung einzutragen.'
