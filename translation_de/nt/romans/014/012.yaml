  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: de
  text: Folglich wird jeder von uns über sich selbst Rechenschaft ablegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „für sich selbst“. Wörtlich steht im Griechischen „in Bezug auf sich selbst“.'
    reason: Die Präpositionalwendung περὶ ἑαυτοῦ kann formal mit „über/in Bezug auf sich selbst“ und im Zusammenhang idiomatisch auch mit „für sich selbst“ wiedergegeben werden.
lexical_decisions:
- source_word: ἄρα
  choice: Folglich
  rationale: Kennzeichnet die Aussage als Schlussfolgerung aus dem vorangehenden Gedankengang und gibt die Folgerungsfunktion knapp und natürlich wieder.
- source_word: ἕκαστος ἡμῶν
  choice: jeder von uns
  rationale: Bewahrt die verteilende Bedeutung von ἕκαστος mit dem partitiven Genitiv ἡμῶν in geläufigem modernem Deutsch.
- source_word: περὶ ἑαυτοῦ
  choice: über sich selbst
  rationale: Gibt περί mit Genitiv als Gegenstand der Rechenschaft wieder und bewahrt den reflexiven, auf jeden Einzelnen bezogenen Sinn.
- source_word: λόγον δώσει
  choice: wird … Rechenschaft ablegen
  rationale: Die griechische Wendung bezeichnet das Ablegen von Rechenschaft, besonders in einem gerichtlichen oder bewertenden Zusammenhang. Die deutsche idiomatische Entsprechung ist natürlicher als eine wörtliche Wiedergabe mit „Wort“ und „geben“.
theological_decisions:
- issue: Individuelle Verantwortlichkeit im Gericht
  choice: über sich selbst Rechenschaft ablegen
  alternative: für sich selbst Rechenschaft ablegen
  rationale: „Über sich selbst“ macht deutlich, dass jeder hinsichtlich der eigenen Person beziehungsweise des eigenen Handelns Rechenschaft gibt. „Für sich selbst“ ist ebenfalls möglich, kann im Deutschen jedoch zusätzlich den missverständlichen Sinn „ohne Hilfe anderer“ annehmen.
- issue: Generisches maskulines Singularpronomen
  choice: jeder von uns … über sich selbst
  alternative: alle von uns … über sich selbst
  rationale: Die distributive Singularform des Griechischen wird bewahrt. Das geschlechtsneutrale deutsche Reflexivpronomen „sich selbst“ vermeidet dabei jede unnötige geschlechtliche Einengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rechenschaft ablegen“ ist die etablierte und allgemein verständliche deutsche Entsprechung der griechischen Wendung λόγον διδόναι; „Folglich“ hält den logischen Anschluss deutlich, ohne altertümlich zu wirken.
