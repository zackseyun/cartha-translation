source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: de
  text: 'Darum wollen wir einander nicht länger beurteilen. Entscheidet vielmehr dies: dem Bruder[a] keinen Stolperstein oder Fallstrick[b] in den Weg zu legen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Bruder oder der Schwester“; der griechische Text hat hier „Bruder“ im Singular und meint ein Glaubensgeschwister.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „keine Ursache zum Fallen“; gemeint ist etwas, das einen anderen zu einem Fehltritt oder zur Sünde verleitet, nicht bloß etwas, das Gefühle verletzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: Darum ... nicht länger
  rationale: „Darum“ kennzeichnet den Folgeschluss aus dem vorherigen Gedankengang; „nicht länger“ gibt die Beendigung einer bisherigen Praxis wieder.
- source_word: ἀλλήλους κρίνωμεν
  choice: wollen wir einander ... beurteilen
  rationale: Der hortative Konjunktiv wird als gemeinsame Aufforderung wiedergegeben. „Beurteilen“ bewahrt den Bezug zum wiederholten κρίνω, ohne hier vorschnell auf „verurteilen“ zu verengen.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Entscheidet vielmehr dies
  rationale: „Entscheidet“ gibt die zweite Verwendung von κρίνω in ihrem auf das eigene Handeln gerichteten Sinn natürlich wieder; „vielmehr“ entspricht μᾶλλον.
- source_word: τὸ μὴ τιθέναι
  choice: keinen ... in den Weg zu legen
  rationale: Der substantivierte Infinitiv nennt den Inhalt der Entscheidung. Die deutsche Wendung macht das Bild des Hindernisses idiomatisch deutlich.
- source_word: πρόσκομμα
  choice: Stolperstein
  rationale: Bewahrt das konkrete Bild von etwas, worüber jemand stolpert, und ist im Deutschen als ethisch-geistliche Metapher verständlich.
- source_word: τῷ ἀδελφῷ
  choice: dem Bruder
  rationale: Folgt dem maskulinen Singular des griechischen Textes; eine Fußnote erläutert den repräsentativen Bezug auf Glaubensgeschwister.
- source_word: ἢ σκάνδαλον
  choice: und keinen Fallstrick
  rationale: „Fallstrick“ vermittelt, dass σκάνδαλον etwas bezeichnet, das jemanden zu Fall beziehungsweise zur Sünde bringen kann. Das deutsche „und“ ist in der negierten Paarform natürlich, ohne die Begriffe gleichzusetzen.
theological_decisions:
- issue: Repräsentativer maskuliner Singular ἀδελφῷ
  choice: Bruder
  alternative: Bruder oder der Schwester; Glaubensgeschwister
  rationale: Der Haupttext bewahrt Genus und Numerus der griechischen Form. Die Fußnote macht deutlich, dass im Zusammenhang ein anderer glaubender Mensch allgemein gemeint ist.
- issue: Ethische Bedeutung von σκάνδαλον
  choice: Fallstrick
  alternative: Anstoß; Ursache zum Fallen
  rationale: „Fallstrick“ vermeidet das moderne Missverständnis eines bloß verletzten Gefühls und bewahrt die Vorstellung, dass jemand zum Fehltritt oder zur Sünde gebracht wird.
- issue: Verhältnis von πρόσκομμα und σκάνδαλον
  choice: Stolperstein und Fallstrick
  alternative: Stolperstein oder Anstoß
  rationale: Die zwei verwandten Bilder bleiben unterscheidbar, ohne eine übermäßig scharfe sachliche Trennung zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Wiederholung von κρίνω wird durch „beurteilen“ und „entscheidet“ sinngemäß nachvollzogen. Die Metaphorik beider Hindernisbegriffe bleibt erhalten; alle Fußnotenmarker stehen im Haupttext.
