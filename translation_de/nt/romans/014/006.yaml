  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: de
  text: Wer den Tag beachtet[a], beachtet ihn für den Herrn. Und wer isst, isst für den Herrn, denn er dankt Gott; und wer nicht isst, isst für den Herrn nicht und dankt Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer dem Tag besondere Bedeutung beimisst“; das griechische Verb kann bedeuten, seine Aufmerksamkeit auf etwas zu richten oder ihm besondere Beachtung zu schenken. Hier ist wahrscheinlich die praktische Beachtung eines Tages gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: beachtet / beachtet ihn
  rationale: Im Zusammenhang mit τὴν ἡμέραν bezeichnet φρονέω, dass jemand einem Tag besondere Beachtung schenkt. „Beachten“ bewahrt sowohl den inneren Stellenwert als auch die praktische Ausrichtung, ohne eine bestimmte Art religiöser Feier festzulegen.
- source_word: τὴν ἡμέραν
  choice: den Tag
  rationale: Der bestimmte Artikel und der unmittelbare Zusammenhang sprechen für „den Tag“. Welcher Tag gemeint ist, bleibt wie im Griechischen offen.
- source_word: κυρίῳ
  choice: für den Herrn
  rationale: Der Dativ bezeichnet hier die Ausrichtung des Handelns auf den Herrn. „Für den Herrn“ ist natürliches modernes Deutsch und passt in allen drei parallelen Aussagen.
- source_word: ὁ ἐσθίων / ἐσθίει
  choice: wer isst / isst
  rationale: Die Präsensformen beschreiben eine allgemeine oder wiederkehrende Praxis. Die schlichte Wiedergabe mit „isst“ erhält den Parallelismus.
- source_word: εὐχαριστεῖ τῷ θεῷ
  choice: dankt Gott
  rationale: Das deutsche Verb „danken“ regiert den Dativ und gibt daher Verb und Empfänger idiomatisch und vollständig wieder.
- source_word: ὁ μὴ ἐσθίων / οὐκ ἐσθίει
  choice: wer nicht isst / verzichtet ... darauf
  rationale: Der erste Ausdruck folgt eng der griechischen Formulierung. Im Hauptsatz macht „verzichtet ... darauf“ auf Deutsch natürlich deutlich, dass das Nichtessen eine bewusste Praxis ist, und vermeidet die schwerfällige Wiederholung „isst ... nicht“.
theological_decisions:
- issue: Bedeutung der Beachtung „des Tages“
  choice: Allgemeiner Hinweis darauf, einem bestimmten Tag im Streitfall von Römer 14 besondere Beachtung zu schenken
  alternative: Ausdrückliche Identifizierung als Sabbat, jüdischer Festtag oder Fasttag
  rationale: Der griechische Text nennt keine bestimmte Art von Tag. Die Übersetzung wahrt diese Offenheit und legt keine konfessionelle Deutung fest.
- issue: Referent von κύριος
  choice: der Herr
  alternative: Gott
  rationale: κύριος wird als „Herr“ wiedergegeben und nicht mit dem ausdrücklich genannten θεός gleichgesetzt. So bleibt die im Wortlaut vorhandene Unterscheidung erhalten.
- issue: Ausrichtung des Essens und Nichtessens
  choice: Beide Praktiken können „für den Herrn“ geschehen und sind jeweils mit Dank an Gott verbunden
  alternative: Eine der beiden Praktiken als geistlich überlegen darzustellen
  rationale: Der parallele Aufbau des Verses stellt beide Gewissensentscheidungen unter dieselbe Ausrichtung auf den Herrn; die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die relative Satzstruktur mit „wer“ klingt natürlicher als substantivierte Formen wie „der Essende“. Der Parallelismus des griechischen Textes bleibt weitgehend erhalten; die Bedeutung des Tages wird bewusst nicht näher bestimmt.
