  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: de
  text: Darum soll das Gute, das ihr habt, nicht schlechtgeredet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht verleumdet werden“ oder „nicht verlästert werden“. Das griechische Verb bezeichnet abfälliges, beleidigendes oder verleumderisches Reden; die wörtlichere Wiedergabe „verlästert werden“ kann im Deutschen zu eng religiös verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: soll … nicht verleumdet werden
  rationale: Der verneinte Präsensimperativ Passiv formuliert eine Aufforderung, zu verhindern, dass abfällig oder rufschädigend über das Gute geredet wird. „Verleumdet werden“ gibt den passiven und sprachlichen Charakter prägnant wieder, ohne die im Deutschen vorwiegend religiöse Bedeutung von „lästern“ aufzudrängen.
- source_word: οὖν
  choice: Darum
  rationale: Das Folgewort kennzeichnet eine Schlussfolgerung aus dem vorausgehenden Gedankengang; „Darum“ ist klar, gegenwärtig und würdevoll.
- source_word: ὑμῶν τὸ ἀγαθόν
  choice: das Gute, das ihr habt
  rationale: Das substantivierte neutrale Adjektiv mit Genitiv bezeichnet wörtlich „euer Gutes“. Die Relativform klingt im modernen Deutsch natürlicher, bewahrt aber den weiten, nicht ausdrücklich festgelegten Bezug.
theological_decisions:
- issue: Bezug von ὑμῶν τὸ ἀγαθόν
  choice: das Gute, das ihr habt
  alternative: eure Freiheit; euer Vorrecht; euer gutes Zeugnis
  rationale: Der griechische Ausdruck bestimmt nicht genauer, worin dieses Gute besteht. Die breite Wiedergabe lässt offen, ob Paulus besonders an Freiheit, Vorrecht oder ein umfassenderes Gut denkt, und bewahrt so die Spannung des Kontextes.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdevoller Satzführung. „Das Gute, das ihr habt“ ist natürlicher als „euer Gutes“ und vermeidet zugleich eine nicht im Ausgangstext enthaltene Festlegung des Bezugs.
