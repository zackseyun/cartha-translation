  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: de
  text: Denn keiner von uns lebt für sich selbst, und keiner stirbt für sich selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδεὶς
  choice: keiner
  rationale: Als Subjekt beider parallelen Aussagen gibt „keiner“ die umfassende Verneinung knapp und natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ bewahrt die begründende beziehungsweise erläuternde Verbindung zum vorangehenden Gedanken.
- source_word: ἡμῶν
  choice: von uns
  rationale: Der partitive Genitiv wird im Deutschen idiomatisch mit „keiner von uns“ wiedergegeben.
- source_word: ἑαυτῷ
  choice: für sich selbst
  rationale: Der reflexive Dativ bezeichnet im Kontext wahrscheinlich die Person als eigenen Bezugs- oder Zielpunkt. „Für sich selbst“ ist natürlich, ohne die mögliche wörtlichere Wiedergabe „sich selbst“ zu verschweigen.
- source_word: ζῇ
  choice: lebt
  rationale: Das einfache Präsens entspricht der allgemeinen, grundsätzlichen Aussage.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden parallelen Aussagen unmittelbar.
- source_word: ἀποθνῄσκει
  choice: stirbt
  rationale: Das einfache Präsens gibt die allgemeine Aussage wieder und wahrt den Parallelismus mit „lebt“.
theological_decisions:
- issue: Bedeutung des reflexiven Dativs ἑαυτῷ in beiden Satzteilen
  choice: für sich selbst
  alternative: sich selbst / um seiner selbst willen
  rationale: Der Zusammenhang stellt Leben und Sterben unter die Ausrichtung auf den Herrn (Vers 8). „Für sich selbst“ bewahrt diesen Ziel- und Bezugsaspekt, ohne zusätzliche Lehrbegriffe einzutragen.
- issue: Generische Personenreferenz
  choice: keiner … sich selbst
  alternative: niemand … für sich
  rationale: Das deutsche Reflexivpronomen ist nicht geschlechtsspezifisch; „keiner von uns“ folgt der singularischen Form und klingt in diesem Satz natürlich und würdevoll.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der Parallelismus des griechischen Textes bleibt erhalten.
