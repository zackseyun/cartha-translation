  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: de
  text: Denn dazu ist der Messias gestorben und wieder lebendig geworden[a], damit er über Tote und Lebende herrsche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „lebte“; im Zusammenhang ist das Leben nach dem Tod gemeint. Auch möglich: „wieder lebte“ oder ausdrücklicher: „zum Leben kam“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: dazu
  rationale: Die Wendung bezeichnet hier Ziel oder Zweck. „Dazu“ ist im Deutschen knapp, natürlich und bewahrt die Zielrichtung.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Aussage und wird im argumentativen Zusammenhang treffend mit „denn“ wiedergegeben.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός bezeichnet Jesus hier als den Gesalbten und hat titelhaften Charakter. „Der Messias“ gibt diese Bedeutung im modernen Deutsch verständlich wieder.
- source_word: ἀπέθανεν
  choice: ist gestorben
  rationale: Das Verb bezeichnet schlicht den Tod; eine weitergehende Ausdeutung ist nicht erforderlich.
- source_word: ἔζησεν
  choice: ist wieder lebendig geworden
  rationale: Wörtlich bezeichnet das Verb „leben“. In der Folge auf „ist gestorben“ und angesichts der Herrschaft über Tote und Lebende ist Auferstehungsleben gemeint. Die Formulierung macht diesen Zusammenhang natürlich verständlich; die engere Wiedergabe wird in der Fußnote bewahrt.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet einen Zweck- oder Zielsatz ein. „Damit“ entspricht dieser Funktion idiomatisch.
- source_word: νεκρῶν
  choice: Tote
  rationale: Das substantivierte Adjektiv bezeichnet die Verstorbenen und bildet den knappen Gegenpol zu „Lebende“.
- source_word: ζώντων
  choice: Lebende
  rationale: Das substantivierte Partizip bezeichnet die Lebenden und wahrt die symmetrische Gegenüberstellung mit den Toten.
- source_word: κυριεύσῃ
  choice: über … herrscht
  rationale: Das Verb bedeutet, Herrschaft auszuüben beziehungsweise Herr über jemanden zu sein. „Über … herrscht“ gibt die verbale Aussage direkt wieder und lässt zugleich den Anklang an κύριος erkennen.
theological_decisions:
- issue: Wiedergabe des auf die Auferstehung bezogenen ἔζησεν
  choice: „ist wieder lebendig geworden“, als Hinweis auf das Leben nach dem Tod
  alternative: „lebte“ oder „wieder lebte“
  rationale: Die unmittelbare Verbindung mit dem Sterben und der folgende Bezug auf Tote und Lebende weisen auf Auferstehungsleben. Die Fußnote hält fest, dass das griechische Verb selbst lediglich „lebte“ sagt.
- issue: Christologische Tragweite von κυριεύσῃ
  choice: „damit er über Tote und Lebende herrscht“
  alternative: „damit er Herr über Tote und Lebende sei“
  rationale: Die gewählte Formulierung bildet κυριεύσῃ als Herrschaftsverb unmittelbar ab, ohne die inhaltliche Aussage über die umfassende Herrschaft des Messias abzuschwächen oder zu einer ausdrücklichen Titelformulierung umzubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und argumentativ; „Tote und Lebende“ bewahrt die prägnante Gegenüberstellung des griechischen Textes.
