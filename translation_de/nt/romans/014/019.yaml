id: ROM.14.19
reference: Romans 14:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: de
  text: Lasst uns also nach dem streben, was dem Frieden dient und was dazu beiträgt, einander aufzubauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Dinge des Friedens und die Dinge des gegenseitigen Aufbauens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: also
  rationale: Die Kombination zweier folgernder Partikeln zieht eine Schlussfolgerung aus dem vorherigen Gedankengang. „Also“ gibt diese Funktion im heutigen Deutsch knapp und natürlich wieder.
- source_word: τὰ τῆς εἰρήνης
  choice: was dem Frieden dient
  rationale: Die substantivierte neutrale Pluralform mit Genitiv bezeichnet das, was zum Frieden gehört oder ihn fördert. Die gewählte Formulierung ist idiomatisch und bewahrt den friedensfördernden Sinn.
- source_word: διώκωμεν
  choice: Lasst uns … nach dem streben
  rationale: Der hortative Präsens Konjunktiv ruft die Gemeinschaft zu fortdauerndem, entschlossenem Handeln auf. „Nach etwas streben“ wahrt die Zielgerichtetheit von διώκω, ohne im Deutschen unnatürlich zu klingen.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: was dazu beiträgt, … aufzubauen
  rationale: οἰκοδομή bezeichnet wörtlich das Bauen und hier bildlich die Stärkung oder Förderung von Menschen. „Aufbauen“ erhält das griechische Bild in verständlichem modernem Deutsch.
- source_word: τῆς εἰς ἀλλήλους
  choice: einander
  rationale: Die Wendung beschreibt die gegenseitige Ausrichtung des Aufbauens innerhalb der Gemeinschaft. „Einander“ bringt diese Wechselseitigkeit prägnant zum Ausdruck.
theological_decisions:
- issue: Reichweite des gegenseitigen Aufbauens
  choice: 'Die Aufforderung gilt der Gemeinschaft: Ihre Mitglieder sollen Frieden fördern und einander aufbauen.'
  alternative: Eine individualistische Deutung, die ausschließlich die persönliche moralische Entwicklung betrifft.
  rationale: Die erste Person Plural in der Aufforderung und das reziproke ἀλλήλους weisen auf gemeinschaftliches Handeln hin. Die Übersetzung erhält diesen Bezug, ohne eine konfessionelle Sonderdeutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Formulierung vermeidet das kirchensprachlich enger wirkende „Erbauung“, bewahrt aber mit „aufbauen“ die Metapher des griechischen Textes.
