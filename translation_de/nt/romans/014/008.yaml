id: ROM.14.8
reference: Romans 14:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: de
  text: 'Denn wenn wir leben, leben wir dem Herrn[a]; und wenn wir sterben, sterben wir dem Herrn. Ob wir nun leben oder sterben: Wir gehören dem Herrn[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Herrn“. Der griechische Dativ kann Beziehung, Ausrichtung oder Vorteil ausdrücken; „dem Herrn“ bewahrt diese Nuance breiter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Wir sind des Herrn.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Denn wenn
  rationale: γάρ wird als begründendes „denn“ wiedergegeben und bindet den Vers an den vorherigen Gedankengang an. ἐάν τε leitet hier das erste Glied der ausgewogenen Bedingungsfolge ein.
- source_word: ζῶμεν / ζῶμεν
  choice: wir leben / leben wir
  rationale: ζάω wird an beiden Stellen einheitlich und natürlich mit „leben“ wiedergegeben; der unterschiedliche griechische Modus muss im Deutschen nicht eigens markiert werden.
- source_word: τῷ κυρίῳ
  choice: für den Herrn
  rationale: Der Dativ bezeichnet die Ausrichtung beziehungsweise Beziehung zum Herrn. „Für den Herrn“ ist im heutigen Deutsch natürlicher als „dem Herrn leben/sterben“, legt den Ausdruck aber etwas stärker auf eine Ausrichtung zugunsten des Herrn fest; die breitere Nuance wird deshalb in einer Fußnote vermerkt.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ bewahrt den gewichtigen Titel κύριος, ohne dessen Referenten im Vers ausdrücklich enger festzulegen, als es der griechische Text tut.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: wir sterben / sterben wir
  rationale: Die Präsensformen bezeichnen das Sterben allgemein und werden schlicht mit „sterben“ wiedergegeben.
- source_word: οὖν
  choice: nun
  rationale: In der Verbindung „Ob wir nun …“ markiert „nun“ die Folgerung idiomatisch, ohne den ausgewogenen Satzbau unnötig zu beschweren.
- source_word: τοῦ κυρίου ἐσμέν
  choice: Wir gehören dem Herrn
  rationale: Der Genitiv ist possessiv. „Wir gehören dem Herrn“ gibt diesen Sinn in modernem Deutsch klar wieder; die formal nähere Alternative „Wir sind des Herrn“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Referent und Aussagekraft von κύριος
  choice: Der Titel wird mit „Herr“ wiedergegeben, ohne den Referenten im Wortlaut weiter zu bestimmen.
  alternative: „Jesus Christus“ ausdrücklich einzusetzen oder „Gebieter“ zu schreiben.
  rationale: Der unmittelbare Kontext weist auf Christus, doch der Vers selbst sagt lediglich κύριος. „Herr“ bewahrt sowohl den christologischen Kontext als auch die weitere biblisch-theologische Resonanz.
- issue: Nuance des Dativs in τῷ κυρίῳ ζῶμεν / ἀποθνῄσκομεν
  choice: Im Haupttext steht idiomatisch „für den Herrn“, während eine Fußnote die breitere relationale Nuance offenhält.
  alternative: „dem Herrn leben/sterben“ oder „in Beziehung zum Herrn leben/sterben“.
  rationale: Der Dativ kann Beziehung, Ausrichtung oder Vorteil ausdrücken. Keine einzelne deutsche Formulierung bildet diese Spannweite vollständig ab; die Übersetzung verbindet daher natürliche Sprache mit einem Hinweis auf die genuine Mehrdeutigkeit.
- issue: Besitz- und Zugehörigkeitsaussage in τοῦ κυρίου ἐσμέν
  choice: „Wir gehören dem Herrn.“
  alternative: „Wir sind des Herrn.“
  rationale: Die klare Zugehörigkeitsaussage folgt aus dem possessiven Genitiv, ohne sie auf Dienst, Herrschaft oder Schutz allein zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Aufbau von Leben und Sterben bleibt erhalten. „Wir gehören dem Herrn“ ist gegenwärtig und verständlich; die formalere griechische Besitzkonstruktion wird in der Fußnote dokumentiert.
