source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: de
  text: Reiß nicht wegen einer Speise das Werk Gottes nieder. Zwar ist alles rein, doch böse ist es, wenn jemand so isst, dass er Anstoß erregt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „für den Menschen, der durch einen Anstoß isst“. Die griechische Wendung kann das Essen als Ursache eines Anstoßes oder als Essen im Zusammenhang mit einem Anstoß beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: wegen einer Speise
  rationale: ἕνεκεν mit dem Genitiv bezeichnet hier den Anlass; βρῶμα steht im Singular und meint im Zusammenhang Speise beziehungsweise Essen. Die Formulierung ist natürlich und wahrt den Kontrast zwischen dem geringfügigen Anlass und dem Werk Gottes.
- source_word: κατάλυε
  choice: reiß ... nieder
  rationale: Das Verb bewahrt das Bild des Abbrechens oder Niederreißens und bildet einen wirkungsvollen Gegensatz zu Gottes Werk.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: das Werk Gottes
  rationale: Die Genitivverbindung bleibt bewusst weit und bezeichnet Gottes Wirken am Mitmenschen beziehungsweise in der Gemeinschaft, ohne dies im Text festzulegen.
- source_word: πάντα μὲν καθαρά
  choice: Zwar ist alles rein
  rationale: πάντα bleibt entsprechend dem griechischen Wortlaut allgemein, ist im Kontext aber auf Speisen bezogen. μέν wird durch „zwar“ aufgenommen und kündigt den folgenden Gegensatz mit ἀλλά an; „rein“ wahrt die kultisch-ethische Begrifflichkeit.
- source_word: κακὸν
  choice: ist es böse
  rationale: „Böse“ erhält das moralische Gewicht von κακόν stärker als bloß „schlecht“ oder „falsch“.
- source_word: τῷ ἀνθρώπῳ
  choice: für den Menschen
  rationale: „Mensch“ gibt den generischen Singular natürlich und geschlechtsübergreifend wieder, ohne die grammatische Einzahl aufzulösen.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: der so isst, dass er Anstoß verursacht
  rationale: Die Wendung bewahrt die Anstoß-Metaphorik und gibt die ethische Folge beziehungsweise Art des Essens verständlich wieder. Die genaue Nuance von διά mit πρόσκομμα ist nicht völlig eindeutig und wird daher in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Reichweite der Aussage „alles ist rein“
  choice: Die allgemeine Formulierung „alles ist rein“ bleibt im Haupttext erhalten und wird durch den Zusammenhang auf Speisen bezogen.
  alternative: „Alle Speisen sind rein“ oder „Alles darf gegessen werden“.
  rationale: Der griechische Text nennt an dieser Stelle nicht ausdrücklich „Speisen“. Die breite Form wahrt sowohl die Reinheitssprache als auch die kontextuelle Spannung zwischen Freiheit und Rücksicht.
- issue: Bedeutung von διὰ προσκόμματος
  choice: Das Essen wird als ein Verhalten wiedergegeben, das Anstoß verursacht.
  alternative: „der trotz eines Anstoßes isst“ beziehungsweise „der mit Anstoß isst“.
  rationale: πρόσκομμα kann einen Stolperstein oder Anlass zum Straucheln bezeichnen. Im Zusammenhang liegt das Verursachen geistlichen Anstoßes nahe, doch die knappe griechische Wendung lässt eine gewisse Mehrdeutigkeit bestehen; deshalb wird eine Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Reiß ... nieder“ erhält das kräftige Bild des griechischen Verbs; „Speise“ passt zur biblischen Argumentation, ohne altertümlich zu wirken. Die Satzstellung mit „Zwar ... doch“ bildet μέν ... ἀλλά natürlich ab.
