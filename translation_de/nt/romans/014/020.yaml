  to: Reiß nicht wegen einer Speise das Werk Gottes nieder. Zwar ist alles rein, doch böse ist es, wenn jemand so isst, dass er Anstoß erregt.[a]
  rationale: Die Revision glättet die deutsche Satzfügung und ersetzt die ungenaue Alternative „trotz eines Anstoßes“ durch eine quellennahe Erläuterung der Mehrdeutigkeit von διὰ προσκόμματος. Die Haupttextdeutung bleibt kontextuell plausibel, während die Fußnote die umstrittene Nuance offenhält.
