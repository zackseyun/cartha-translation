  source_fidelity: Der erste Satz gibt μή + Präsensimperativ, ἕνεκεν βρώματος, κατάλυε und τὸ ἔργον τοῦ θεοῦ treffend wieder. „Zwar ist alles rein“ bewahrt die allgemeine Form von πάντα und die Reinheitsterminologie von καθαρά. Bei διὰ προσκόμματος ἐσθίοντι ist eine kausative Deutung im Kontext gut begründbar, doch die Wendung ist knapp und umstritten; die bisherige Fußnotenalternative „trotz eines Anstoßes“ ist keine hinreichend genaue Entsprechung.
  naturalness: „Für den Menschen ... ist es böse“ ist zwar verständlich, im modernen Standarddeutsch aber schwerfällig. „Böse ist es, wenn jemand ...“ ist idiomatischer und erhält das moralische Gewicht. „Anstoß erregt“ ist die natürliche deutsche Wiedergabe der Metapher.
  terminology: „Speise“, „Werk Gottes“, „rein“ und „Anstoß“ sind registergerecht und terminologisch passend. „Mensch“ gibt ἄνθρωπος angemessen generisch wieder.
