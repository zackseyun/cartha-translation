  to: Wer aber zweifelt, ist verurteilt, wenn er isst, weil er nicht aus Glauben[a] handelt; und alles, was nicht aus Glauben geschieht, ist Sünde.
  rationale: Die Revision stellt die mit ἐὰν markierte Bedingung durch „wenn er isst“ wieder her und entfernt die nicht ausdrücklich formulierte adversative Nuance von „trotzdem“. Der Fußnotenanker wird zu dem erläuterten Ausdruck „Glauben“ verschoben. Im Übrigen bleiben die angemessene Wiedergabe des unbestimmten Passivs und die theologisch offene Terminologie erhalten.
