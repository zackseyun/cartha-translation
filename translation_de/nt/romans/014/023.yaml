  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: de
  text: Wer aber zweifelt, ist verurteilt, wenn er isst, weil er nicht aus Glauben[a] handelt; und alles, was nicht aus Glauben geschieht, ist Sünde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „weil sein Handeln nicht aus einer festen Überzeugung vor Gott hervorgeht“. Wörtlich steht im Griechischen „aus Glauben“.'
    reason: Die Fußnote bewahrt die kontextuelle Bedeutungsnuance von πίστις, ohne den umfassenderen Begriff im Haupttext darauf zu verengen.
lexical_decisions:
- source_word: διακρινόμενος
  choice: wer aber Zweifel hat
  rationale: Das Partizip bezeichnet im Zusammenhang mit Speisebedenken ein inneres Schwanken oder Zweifeln, nicht einen Streit mit anderen. Die Formulierung ist idiomatisch und bewahrt diesen Sinn.
- source_word: ἐὰν φάγῃ
  choice: und trotzdem isst
  rationale: Die Verbindung mit dem vorausgehenden Zweifel macht deutlich, dass die betreffende Person trotz ihrer Bedenken isst. Das deutsche „trotzdem“ gibt diesen kontextuellen Gegensatz natürlich wieder; die Bedingungsbeziehung wird im deutschen Relativsatz idiomatisch ausgedrückt.
- source_word: κατακέκριται
  choice: ist verurteilt
  rationale: Das Perfekt Passiv bezeichnet den daraus hervorgehenden Zustand des Verurteiltseins. Der nicht näher bezeichnete Urheber des Urteils bleibt auch im Deutschen offen.
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: weil er nicht aus Glauben handelt
  rationale: „Weil“ gibt die Begründung klar wieder. „Aus Glauben“ bewahrt Paulus’ Ausdruck und seine theologische Weite; „handelt“ macht im Deutschen den elliptischen Bezug verständlich, ohne ihn auf bloß subjektive Überzeugung zu verengen.
- source_word: πᾶν δὲ ὃ οὐκ ἐκ πίστεως
  choice: und alles, was nicht aus Glauben geschieht
  rationale: „Alles, was“ bildet die umfassende neutrale Konstruktion natürlich ab. „Geschieht“ ergänzt die im Griechischen elliptische Aussage idiomatisch.
- source_word: ἁμαρτία ἐστίν
  choice: ist Sünde
  rationale: Die substantivische, kategorische Aussage wird direkt bewahrt und nicht zum schwächeren Adjektiv „sündig“ umgeformt.
theological_decisions:
- issue: Wiedergabe von πίστις im ethischen Zusammenhang
  choice: Glauben
  alternative: Überzeugung; Vertrauen; Treue
  rationale: Im unmittelbaren Zusammenhang schließt πίστις die vor Gott gewonnene Gewissheit ein, ist aber nicht darauf beschränkt. „Glauben“ erhält Paulus’ umfassendere Begrifflichkeit; die Fußnote nennt die kontextuelle Nuance.
- issue: Tragweite des Passivs κατακέκριται
  choice: ist verurteilt
  alternative: verurteilt sich selbst; steht vor Gott verurteilt da
  rationale: Das griechische Passiv nennt keinen Handelnden. Die Übersetzung legt deshalb nicht fest, ob Gottes Urteil, das Gewissen oder beides im Vordergrund steht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Der Satzbau bleibt nahe an der Argumentation des griechischen Textes, vermeidet aber unnatürliche Ellipsen. Die Ambiguität hinsichtlich des Urhebers der Verurteilung bleibt erhalten.
