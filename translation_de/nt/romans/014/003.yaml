  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: de
  text: Wer isst, soll den, der nicht isst, nicht verachten[a]; wer aber nicht isst, soll nicht über den urteilen, der isst[b], denn Gott hat ihn angenommen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht geringschätzen“ beziehungsweise „nicht mit Verachtung behandeln“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kein Urteil über ihn fällen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „willkommen geheißen“ beziehungsweise „aufgenommen“. Das Verb kann die Aufnahme in die Gemeinschaft ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: wer isst
  rationale: Das substantivierte Partizip bezeichnet allgemein die Person, die isst. „Wer isst“ ist im Deutschen natürlich und bewahrt den generischen Charakter.
- source_word: τὸν μὴ ἐσθίοντα
  choice: den, der nicht isst
  rationale: Die Formulierung bildet den griechischen Gegensatz eng nach, ohne den Verzicht näher als Vegetarismus oder rituelle Enthaltung zu bestimmen.
- source_word: ἐξουθενείτω
  choice: soll … nicht verachten
  rationale: Das Verb bezeichnet, jemanden geringschätzig für unbedeutend zu halten. „Verachten“ gibt die Stärke und moralische Stoßrichtung knapp wieder.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: wer aber nicht isst
  rationale: „Aber“ gibt die durch δέ markierte Gegenüberstellung der beiden Gruppen klar wieder.
- source_word: κρινέτω
  choice: soll … nicht verurteilen
  rationale: Im Zusammenhang bezeichnet κρίνω ein negatives Urteil über den anderen. „Verurteilen“ bringt diese zwischenmenschliche Wertung natürlicher zum Ausdruck als das im heutigen Deutsch missverständliche bloße „richten“.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ bewahrt die begründende Verbindung zu den beiden vorausgehenden Aufforderungen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen bleibt erhalten; dadurch wird sein unmittelbarer Bezug nicht erklärend ausgeweitet oder aufgelöst.
- source_word: προσελάβετο
  choice: hat … angenommen
  rationale: Das Verb bedeutet hier, jemanden anzunehmen beziehungsweise in Gemeinschaft aufzunehmen. „Angenommen“ ist idiomatisch und lässt den gemeinschaftlichen Sinn im Kontext bestehen.
theological_decisions:
- issue: Reichweite des Gegensatzes zwischen Essen und Nichtessen
  choice: Der Gegensatz bleibt allgemein als „isst“ und „nicht isst“ formuliert.
  alternative: Ausdrücklich „alles isst“ gegenüber „auf bestimmte Speisen verzichtet“.
  rationale: Der unmittelbare Kontext betrifft Speisepraktiken, doch der Vers selbst benennt keine bestimmten Lebensmittel oder Gründe für den Verzicht.
- issue: Bezug von αὐτόν in „Gott hat ihn angenommen“
  choice: Das singularische Pronomen „ihn“ bleibt ohne erklärende Auflösung stehen.
  alternative: „Diesen Menschen“ oder eine ausdrückliche Anwendung auf beide Parteien.
  rationale: Grammatisch steht der Essende unmittelbar zuvor; zugleich trägt die wechselseitige Argumentation weiter. Die Übersetzung wahrt diese Spannung, statt sie festzulegen.
- issue: Bedeutung von Gottes Annahme
  choice: „angenommen“
  alternative: „willkommen geheißen“ oder „in die Gemeinschaft aufgenommen“
  rationale: „Angenommen“ bewahrt sowohl die relationale als auch die gemeinschaftliche Dimension, ohne eine bestimmte kirchliche oder soteriologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur macht die gegenseitige Verpflichtung deutlich; „aber“ bewahrt den Kontrast. Fachsprachliche oder konfessionell geprägte Zusätze werden vermieden.
