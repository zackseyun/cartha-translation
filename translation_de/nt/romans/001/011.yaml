revisions:
- from: Denn ich sehne mich danach, euch zu sehen, um eine geistliche Gabe mit euch zu teilen[a], damit ihr gestärkt werdet.
  to: Denn ich sehne mich danach, euch zu sehen, um euch eine geistliche Gabe weiterzugeben[a], damit ihr gestärkt werdet.
  rationale: Die Revision stellt die im Griechischen klare Ausrichtung der Gabe auf die Adressaten wieder her (ὑμῖν), während „weiterzugeben“ den Sinn von μεταδῶ natürlich und ohne übermäßige theologische Festlegung ausdrückt. Das Passiv „ihr gestärkt werdet“ und die Offenheit von „geistliche Gabe“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:44:24Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den begründenden Anschluss (γάρ), das starke Verlangen, den Zweck und das Schluss-Passiv „damit ihr gestärkt werdet“ zutreffend wieder. „Mit euch zu teilen“ schwächt jedoch die im Griechischen durch ὑμῖν ausgedrückte Empfängerrichtung ab und kann eine wechselseitige Teilhabe bereits in Vers 11 hineinlesen. μεταδῶ bezeichnet hier ein Geben bzw. Gewähren an die Adressaten.
  naturalness: Der Satz ist insgesamt flüssig und modern. Die Verbindung „eine Gabe mit euch zu teilen“ ist im Deutschen jedoch weniger präzise und idiomatisch als eine Formulierung mit klarem Dativempfänger.
  terminology: „geistliche Gabe“ bewahrt die Offenheit von χάρισμα πνευματικόν angemessen; weder eine spezifische charismatische Gabe noch eine eng festgelegte Bezugnahme auf den Heiligen Geist wird erzwungen. „Weitergeben“ gibt μεταδῶ als Übermittlung/Gewährung wieder, ohne die Art der Gabe dogmatisch zu bestimmen.
  issues:
  - severity: medium
    issue: „mit euch zu teilen“ verwischt die Richtung von μεταδῶ ὑμῖν.
    rationale: Paulus beabsichtigt, den römischen Adressaten eine geistliche Gabe zu geben bzw. zukommen zu lassen. Die Formulierung „mit euch zu teilen“ kann eine symmetrische gemeinsame Teilhabe nahelegen; diese wird erst im folgenden Vers ausdrücklich entfaltet.
  - severity: low
    issue: Die Fußnote bietet derzeit als Alternative praktisch die passendere Grundübersetzung.
    rationale: Wenn der Haupttext auf „weiterzugeben“ korrigiert wird, muss die Fußnote eine tatsächlich unterscheidbare, zugleich quellengerechte Alternative bieten.
  revised_text: Denn ich sehne mich danach, euch zu sehen, um euch eine geistliche Gabe weiterzugeben[a], damit ihr gestärkt werdet.
  revised_footnotes:
  - marker: a
    text: 'Oder: euch an einer geistlichen Gabe teilhaben zu lassen.'
    reason: lexical_alternative
  revision_rationale: Die Revision stellt die im Griechischen klare Ausrichtung der Gabe auf die Adressaten wieder her (ὑμῖν), während „weiterzugeben“ den Sinn von μεταδῶ natürlich und ohne übermäßige theologische Festlegung ausdrückt. Das Passiv „ihr gestärkt werdet“ und die Offenheit von „geistliche Gabe“ bleiben erhalten.
