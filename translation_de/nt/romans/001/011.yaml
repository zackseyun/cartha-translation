  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: de
  text: Denn ich sehne mich danach, euch zu sehen, um euch eine geistliche Gabe weiterzugeben[a], damit ihr gestärkt werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: euch an einer geistlichen Gabe teilhaben zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: ich sehne mich danach
  rationale: Gibt das starke persönliche Verlangen in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden Anschluss an den vorausgehenden Zusammenhang.
- source_word: ἰδεῖν
  choice: zu sehen
  rationale: Entspricht dem unmittelbaren Wortsinn; ein Besuch ist im Zusammenhang mitgemeint, muss aber nicht ausdrücklich eingesetzt werden.
- source_word: ἵνα
  choice: um … zu
  rationale: Kennzeichnet den Zweck idiomatisch und klar.
- source_word: τι
  choice: eine
  rationale: Der unbestimmte Charakter bleibt durch den unbestimmten Artikel erhalten; „irgendeine“ könnte im Deutschen geringschätzig oder beliebig klingen.
- source_word: μεταδῶ
  choice: mit euch zu teilen
  rationale: Das Verb bezeichnet das Gewähren eines Anteils beziehungsweise das Weitergeben; „teilen“ ist natürlich und vermeidet den Eindruck, Paulus verfüge eigenmächtig über die Gabe.
- source_word: χάρισμα
  choice: Gabe
  rationale: Die knappe Wiedergabe ist im Deutschen verständlich und lässt den Gnadenbezug der Wortfamilie bestehen, ohne ihn erklärend auszubauen.
- source_word: πνευματικὸν
  choice: geistliche
  rationale: Bewahrt die mögliche Bedeutung einer geistlichen Gabe, ohne vorschnell auf eine bestimmte außergewöhnliche Geistesgabe einzuengen.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: damit ihr gestärkt werdet
  rationale: Gibt sowohl den Ziel- beziehungsweise Ergebnischarakter als auch die Passivform des griechischen Ausdrucks wieder.
theological_decisions:
- issue: Bezeichnet „geistliche Gabe“ eine besondere charismatische Befähigung oder einen weiter gefassten geistlichen Gewinn?
  choice: eine geistliche Gabe
  alternative: eine Gabe des Geistes
  rationale: Die griechische Formulierung legt keine enge technische Bedeutung fest. Die Übersetzung lässt daher offen, welcher Art die Gabe ist und wie unmittelbar πνευματικόν auf den Heiligen Geist zu beziehen ist.
- issue: Stellt Paulus die Gabe als einseitig von ihm vermittelt oder als mit den Römern geteilt dar?
  choice: mit euch zu teilen
  alternative: euch weiterzugeben
  rationale: μεταδίδω kann das Geben beziehungsweise Gewähren eines Anteils ausdrücken. „Teilen“ hält den Gedanken des Weitergebens fest und passt zugleich zur unmittelbar folgenden Einordnung gegenseitiger Ermutigung, ohne diese schon vollständig in Vers 11 einzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem argumentativen Aufbau des Griechischen, bleibt aber flüssig. Das Passiv „gestärkt werdet“ wurde bewusst erhalten.
