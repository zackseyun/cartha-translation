  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: de
  text: zu denen auch ihr gehört, Berufene Jesu, des Messias[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Berufene Jesu, des Messias“. Gemeint sein kann auch: „von Jesus, dem Messias, Berufene“ oder „Berufene, die Jesus, dem Messias, gehören“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν οἷς
  choice: zu denen
  rationale: Das Relativpronomen bezieht sich auf die zuvor genannten Völker; „zu denen“ drückt im Deutschen die Zugehörigkeit zu dieser Gruppe natürlich aus.
- source_word: ἐστε καὶ ὑμεῖς
  choice: auch ihr gehört
  rationale: Die Formulierung gibt das ausdrücklich betonte Einbezogensein der römischen Adressaten idiomatisch wieder, ohne den Aussagegehalt zu erweitern.
- source_word: κλητοὶ
  choice: Berufene
  rationale: Das substantivierte Adjektiv bewahrt die knappe Bezeichnung des griechischen Textes und vermeidet eine unnötige Festlegung darauf, wer beruft oder wozu berufen wird.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Beide Wörter stehen im Genitiv. „Jesu“ gibt den Personennamen wieder; „des Messias“ behandelt Χριστός als Titel und macht die Apposition im Deutschen deutlich.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: Berufene Jesu, des Messias
  rationale: Die knappe Genitivverbindung bleibt erhalten. Dadurch wird die im Griechischen offene Beziehung zwischen den Berufenen und Jesus nicht stillschweigend ausschließlich als Urheberschaft oder Zugehörigkeit gedeutet.
theological_decisions:
- issue: Bedeutung des Genitivs in κλητοὶ Ἰησοῦ Χριστοῦ
  choice: Berufene Jesu, des Messias
  alternative: von Jesus, dem Messias, Berufene; zum Eigentum Jesu, des Messias, Berufene
  rationale: Der bloße Genitiv kann Zugehörigkeit oder Beziehung ausdrücken und wird bisweilen als Urheberschaft verstanden. Die Hauptfassung bewahrt diese theologisch bedeutsame Mehrdeutigkeit; die Fußnote nennt die wichtigsten möglichen Auflösungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Berufene“ ist bewusst knapp und leicht gehoben, entspricht aber der verdichteten Ausdrucksweise des griechischen Textes. Das abschließende Komma zeigt, dass der Satz im folgenden Verszusammenhang weitergeht.
