  variant: modern standard German
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: de
  text: Denn obwohl sie Gott kannten, verherrlichten sie ihn nicht als Gott und dankten ihm nicht. Vielmehr verfielen sie mit ihren Überlegungen[a] der Nichtigkeit, und ihr unverständiges Herz[b] wurde verfinstert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in ihren Gedanken, Erwägungen oder Gedankengängen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht „Herz“ im Singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Begründung für die vorhergehende Aussage ein und bewahrt den logischen Zusammenhang.
- source_word: γνόντες τὸν θεὸν
  choice: obwohl sie Gott kannten
  rationale: 'Das Partizip wird im Kontext konzessiv verstanden: Trotz ihrer Gotteserkenntnis reagierten sie nicht angemessen.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: verherrlichten sie ihn nicht als Gott
  rationale: Bewahrt sowohl das theologische Gewicht von δοξάζω als auch die Aussage, dass Gott nicht die ihm als Gott gebührende Ehre erhielt.
- source_word: ἢ ηὐχαρίστησαν
  choice: und dankten ihm nicht
  rationale: Im Deutschen verbindet „und … nicht“ die beiden verneinten Handlungen natürlich und eindeutig; das im Griechischen implizite Objekt wird zur Klarheit als „ihm“ ausgedrückt.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: verfielen sie in ihren Überlegungen der Nichtigkeit
  rationale: Gibt das passive Eintreten in einen nichtigen, gehaltlosen Zustand wieder, ohne ausdrücklich einen Verursacher zu benennen. „Überlegungen“ erfasst den gedanklichen Vorgang von διαλογισμοί.
- source_word: ἐσκοτίσθη
  choice: wurde verfinstert
  rationale: Erhält Passivform und Bildsprache des griechischen Verbs.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: ihr unverständiges Herz
  rationale: „Unverständig“ bezeichnet fehlende Einsicht, nicht bloß geringe Intelligenz; der Singular „Herz“ wird entsprechend dem Griechischen bewahrt.
theological_decisions:
- issue: Konzessive Bedeutung von γνόντες
  choice: obwohl sie Gott kannten
  alternative: da sie Gott erkannt hatten / als sie Gott kannten
  rationale: Der Kontext stellt ihre tatsächliche Gotteserkenntnis ihrem unangemessenen Verhalten gegenüber. Die konzessive Wiedergabe macht diesen Gegensatz deutlich, ohne Art oder Umfang dieser Erkenntnis dogmatisch näher festzulegen.
- issue: Passiv von ἐματαιώθησαν und ἐσκοτίσθη
  choice: Ohne genannten Verursacher wiedergegeben
  alternative: Gott machte ihre Überlegungen nichtig und verfinsterte ihr Herz
  rationale: Der griechische Text verwendet Passivformen, nennt hier aber keinen Handelnden. Die Übersetzung wahrt diese Offenheit und importiert keine ausdrückliche Kausalzuweisung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt eng am Gedankengang des Griechischen, wird aber durch einen Satzpunkt für heutige Leser übersichtlich gegliedert.
