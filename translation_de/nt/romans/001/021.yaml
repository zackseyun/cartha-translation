review_pass:
  verdict: revise
  source_fidelity: Die konzessive Wiedergabe von γνόντες („obwohl sie Gott kannten“), die Negation beider Verben, „als Gott“, die nicht kausativ ausgelegten Passivformen sowie der Singular „Herz“ geben den griechischen Text sachgerecht wieder. „Der Nichtigkeit verfallen“ ist eine vertretbare idiomatische Wiedergabe von ἐματαιώθησαν und lässt den ungenannten Handelnden offen.
  naturalness: Der Satz ist gut verständlich und dem Register angemessen. „Unverständiges Herz“ bedeutet im heutigen Deutsch jedoch eher ein nicht verständliches Herz; für ἀσύνετος ist „unverständig“ (ohne -es- nach „verständ“) erforderlich.
  terminology: „verherrlichen“, „Gott“, „Nichtigkeit“, „Herz“ und „verfinstert“ sind in modernem Standarddeutsch treffend und bewahren den biblisch-theologischen Sprachgebrauch, ohne ihn auszudeuten.
