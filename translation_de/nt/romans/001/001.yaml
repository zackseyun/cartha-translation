id: ROM.1.1
reference: Romans 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: de
  text: Paulus, ein Sklave[a] des Messias Jesus[b], zum Apostel berufen[c], ausgesondert für Gottes Evangelium,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder traditionell: Christus Jesus.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: ein berufener Apostel.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Die im Deutschen eingebürgerte Form des Namens.
- source_word: δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet grundsätzlich einen Menschen, der einem Herrn gehört und unter dessen Verfügungsgewalt steht. „Sklave“ bewahrt diese in der Selbstbezeichnung des Paulus wichtige Schärfe; die im Deutschen geläufigere, aber schwächere Wiedergabe „Diener“ steht in der Fußnote.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός wird hier als Titel verstanden und deshalb mit „Messias“ wiedergegeben; die griechische Reihenfolge vor „Jesus“ bleibt erhalten.
- source_word: κλητὸς ἀπόστολος
  choice: zum Apostel berufen
  rationale: Diese idiomatische deutsche Form gibt den Sinn der knappen griechischen Verbindung aus Adjektiv und Substantiv wieder, ohne die Berufung lediglich als menschliche Bezeichnung erscheinen zu lassen.
- source_word: ἀφωρισμένος
  choice: ausgesondert
  rationale: Das Partizip bezeichnet ein Absondern beziehungsweise Bestimmen für eine besondere Aufgabe und bewahrt hier den passiven Sinn.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: für Gottes Evangelium
  rationale: „Für“ gibt die Ausrichtung beziehungsweise Bestimmung knapp wieder; „Gottes Evangelium“ ist eine natürliche deutsche Wiedergabe des griechischen Genitivs und lässt dessen genaue Beziehung offen.
theological_decisions:
- issue: Bedeutung von δοῦλος in der Selbstbezeichnung des Paulus
  choice: Sklave
  alternative: Diener
  rationale: „Sklave“ bildet das Verhältnis der Zugehörigkeit und Unterordnung deutlicher ab. „Diener“ ist traditionell und stilistisch milder, kann die Aussage aber abschwächen.
- issue: Wiedergabe von Χριστός als Titel oder eingebürgerte Namensform
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: „Messias“ macht den Titelgehalt von Χριστός sichtbar. Die traditionelle Form „Christus Jesus“ bleibt als vertretbare Alternative ausgewiesen.
- issue: Syntaktische Deutung von κλητὸς ἀπόστολος
  choice: zum Apostel berufen
  alternative: ein berufener Apostel
  rationale: Die gewählte Fassung ist im heutigen Deutsch klar und natürlich. Die Alternative folgt der knappen griechischen Adjektiv-Substantiv-Struktur formaler.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionale Briefanfangsstruktur und das abschließende Komma bleiben erhalten, da der Satz in den folgenden Versen weitergeführt wird. „Ausgesondert“ ist bewusst quellenah und etwas gehobener; „zum Apostel berufen“ sorgt innerhalb der dichten Reihung für natürliche Verständlichkeit.
