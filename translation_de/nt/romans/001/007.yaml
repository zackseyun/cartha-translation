source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: de
  text: 'An alle in Rom, die von Gott geliebt und als Heilige berufen sind[a]: Gnade und Frieden von Gott, unserem Vater, und dem Herrn Jesus, dem Messias, seien mit euch[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „berufene Heilige“ oder „dazu berufen, Heilige zu sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“; wörtlich: „der Gesalbte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: An alle in Rom
  rationale: Gibt den universalen Adressatenkreis und den Ort knapp und natürlich wieder; das griechische Partizip οὖσιν muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: ἀγαπητοῖς θεοῦ
  choice: die von Gott geliebt
  rationale: Bewahrt die passive Beziehung zu Gott und vermeidet das im heutigen Deutsch weniger natürliche substantivische „Geliebte Gottes“.
- source_word: κλητοῖς ἁγίοις
  choice: als Heilige berufen
  rationale: Gibt beide Adjektive wieder und lässt erkennen, dass ihre Heiligkeit mit Gottes Berufung verbunden ist. Das ergänzte „als“ macht die knappe griechische Fügung im Deutschen verständlich, ohne ausdrücklich ein zukünftiges Ziel („heilig zu werden“) festzulegen.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Gnade sei mit euch und Frieden
  rationale: Formuliert den elliptischen griechischen Gruß idiomatisch und bewahrt die paulinischen Schlüsselbegriffe „Gnade“ und „Frieden“.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Gott, unserem Vater
  rationale: Entspricht der griechischen Apposition und klingt in der deutschen Herkunftsangabe natürlich.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die sachlich und christologisch angemessene Wiedergabe von κύριος in dieser Grußformel.
- source_word: Χριστοῦ
  choice: dem Messias
  rationale: Gibt Χριστός als Titel („der Gesalbte“) in verständlichem Deutsch wieder; die Apposition mit Artikel ist im Deutschen idiomatisch.
theological_decisions:
- issue: Verhältnis von κλητοῖς und ἁγίοις
  choice: als Heilige berufen
  alternative: berufene Heilige / dazu berufen, Heilige zu sein
  rationale: Die griechische Fügung besteht aus zwei Adjektiven und enthält weder einen ausdrücklichen Infinitiv noch eine Zeitangabe. Die Übersetzung wahrt den Zusammenhang von Berufung und Heiligkeit, ohne zu entscheiden, ob vor allem Status, Identität oder Ziel der Berufung betont ist.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus / Gesalbter
  rationale: Hier ist Χριστός Teil der Bezeichnung Jesu und trägt weiterhin Titelbedeutung. „Messias“ vermittelt diese Bedeutung im Deutschen deutlicher; die traditionelle Form wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt knapp, während der elliptische Segensgruß durch „sei mit euch“ idiomatisch ergänzt wird. „Heilige“ wird in seinem neutestamentlichen Sinn als Bezeichnung der zu Gott Gehörenden verwendet, nicht als spätere kirchliche Ehrenbezeichnung.
