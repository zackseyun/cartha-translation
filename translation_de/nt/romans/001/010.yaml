  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: de
  text: Allezeit bitte ich in meinen Gebeten darum, ob es mir vielleicht nun endlich nach Gottes Willen gelingen wird, zu euch zu kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »ob mir vielleicht nun endlich nach Gottes Willen ein erfolgreicher Weg zu euch eröffnet wird« oder »ob ich vielleicht nun endlich nach Gottes Willen eine gute Reise zu euch haben werde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: allezeit
  rationale: Das Adverb betont die beständige Gebetspraxis des Paulus; »allezeit« ist würdevoll, verständlich und enger am griechischen Ausdruck als ein bloßes »oft«.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: in meinen Gebeten
  rationale: Diese im Deutschen natürliche Wendung gibt den Zusammenhang wieder, in dem Paulus seine Bitte regelmäßig vorbringt.
- source_word: δεόμενος
  choice: bitte ich … darum
  rationale: Das Partizip bezeichnet eine eindringliche Bitte. Die finite Form ergibt im Deutschen zusammen mit dem vorausgehenden Vers einen natürlichen Satzanschluss.
- source_word: εἴ πως
  choice: ob es mir … gelingen wird
  rationale: »Ob« bewahrt die abhängige Fragestruktur und die Ungewissheit, ob sich die erhoffte Möglichkeit eröffnet; das Element πως wird durch die offene Erfolgsformulierung mitgetragen.
- source_word: ἤδη ποτὲ
  choice: nun endlich
  rationale: Die Wortverbindung bringt die lange gehegte und jetzt erneut ausgesprochene Hoffnung des Paulus auf eine Gelegenheit zum Ausdruck.
- source_word: εὐοδωθήσομαι
  choice: es mir … gelingen wird
  rationale: Das passive Verb kann bedeuten, dass einem ein erfolgreicher Weg eröffnet wird. »Gelingen« ist im heutigen Deutsch natürlich und vermeidet den möglichen finanziellen Beiklang von »Wohlergehen«.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: durch Gottes Willen
  rationale: Die Formulierung stellt Gottes Willen als die bestimmende und ermöglichende Größe für die erhoffte Reise dar, ohne Paulus’ Erfolg als unabhängig davon erscheinen zu lassen.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: zu euch zu kommen
  rationale: Die Wiedergabe bleibt nah am einfachen Bewegungsverb und fügt nicht ausdrücklich den im Kontext naheliegenden, aber lexikalisch nicht enthaltenen Begriff »besuchen« hinzu.
theological_decisions:
- issue: Verhältnis von Paulus’ Reiseabsicht zu Gottes Willen
  choice: »durch Gottes Willen«
  alternative: »im Willen Gottes«
  rationale: »Durch« gibt Gottes Willen als maßgebliche Ermöglichung wieder, ohne eine besondere Lehre über Vorsehung oder menschliche Entscheidungsfreiheit in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Dabei« verbindet den als Satzfragment überlieferten Vers natürlich mit dem vorausgehenden Kontext. Die etwas formelle Wendung »allezeit« bewahrt den paulinischen Nachdruck; die Fußnote hält die Weg- und Passivbedeutung von εὐοδωθήσομαι sichtbar.
