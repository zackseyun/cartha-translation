id: ROM.1.25
reference: Romans 1:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: de
  text: Sie vertauschten die Wahrheit Gottes gegen die Lüge und verehrten und dienten der Schöpfung statt dem Schöpfer, der in Ewigkeit gepriesen ist. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: Sie
  rationale: Das Relativpronomen greift die zuvor genannten Menschen auf; im Deutschen ist ein neuer Hauptsatz mit „Sie“ natürlich und klar.
- source_word: μετήλλαξαν
  choice: vertauschten
  rationale: Gibt den bewussten Austausch einer Sache gegen eine andere prägnant wieder.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: die Wahrheit Gottes
  rationale: 'Bewahrt die formale Mehrdeutigkeit des Genitivs: Gottes Wahrheit beziehungsweise die Wahrheit über Gott.'
- source_word: ἐν τῷ ψεύδει
  choice: mit der Lüge
  rationale: Im Zusammenhang des Verbs bezeichnet ἐν den Gegenwert des Tauschs. Der bestimmte Artikel wird als „der Lüge“ bewahrt und kann die grundlegende religiöse Unwahrheit bezeichnen.
- source_word: ἐσεβάσθησαν
  choice: verehrten
  rationale: σέβομαι bezeichnet ehrfürchtige religiöse Verehrung; „verehrten“ unterscheidet dies passend vom nachfolgenden kultischen Dienen.
- source_word: ἐλάτρευσαν
  choice: dienten
  rationale: Das Wort bezeichnet hier religiösen beziehungsweise kultischen Dienst; „dienten“ wahrt die Verbparallelität, ohne eine unnötige Konfessionsfärbung.
- source_word: τῇ κτίσει
  choice: dem Geschaffenen
  rationale: κτίσις kann „Schöpfung“ oder „Geschaffenes“ bedeuten. „dem Geschaffenen“ bildet einen klaren Gegensatz zu „dem Schöpfer“ und umfasst geschaffene Dinge und Wesen.
- source_word: παρὰ τὸν κτίσαντα
  choice: statt dem Schöpfer
  rationale: παρά nach dem Vergleich beziehungsweise Kontrast kann „mehr als“ oder „anstelle von“ bedeuten. Im Kontext des Austauschs bringt „statt“ den Gegensatz natürlich zum Ausdruck.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: in Ewigkeit gepriesen
  rationale: Idiomatiche deutsche Doxologie, die die fortdauernde Segnung beziehungsweise Preiswürdigkeit ausdrückt.
theological_decisions:
- issue: Bezug der abschließenden Doxologie
  choice: Der Relativsatz bezieht sich grammatisch auf den Schöpfer.
  alternative: Eine allgemeinere doxologische Aussage über Gott.
  rationale: ὅς steht unmittelbar nach τὸν κτίσαντα und stimmt im Genus und Numerus damit überein; die Übersetzung wahrt diesen eindeutigen Bezug.
- issue: Bedeutung von παρά im Vergleich zwischen Geschaffenem und Schöpfer
  choice: „statt dem Schöpfer“
  alternative: „mehr als den Schöpfer“
  rationale: Beide Nuancen sind lexikalisch möglich. Der vorangehende Austausch und der scharfe Gegensatz legen hier Ersatz beziehungsweise Verdrängung nahe; „statt“ vermeidet zugleich die Vorstellung, der Schöpfer sei ebenfalls verehrt und nur geringer geachtet worden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Folge „verehrten und dienten“ spiegelt die beiden griechischen Verben und bleibt für gewöhnliche Leser verständlich. „In Ewigkeit“ ist eine natürliche, liturgisch vertraute Wiedergabe von εἰς τοὺς αἰῶνας.
