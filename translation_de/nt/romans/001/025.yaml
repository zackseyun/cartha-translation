  - severity: low
    issue: „dem Geschaffenen“ für τῇ κτίσει
    rationale: Die substantivierte Form kann ein einzelnes geschaffenes Wesen oder allgemein das Geschaffene bezeichnen. „der Schöpfung“ gibt κτίσις und den Gegensatz zum Schöpfer direkter wieder und stimmt mit dem englischen Audittext überein.
