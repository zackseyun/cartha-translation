  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: de
  text: das er zuvor durch seine Propheten in den heiligen Schriften[a] versprochen hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in heiligen Schriften«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: das
  rationale: Das sächliche Relativpronomen knüpft grammatisch an »Evangelium« in Römer 1,1 an und wahrt den fortlaufenden Satzbau.
- source_word: προεπηγγείλατο
  choice: zuvor … versprochen hatte
  rationale: Die Formulierung gibt sowohl die Verheißungsbedeutung des Verbs als auch das zeitliche Präfix προ- natürlich wieder; das Plusquamperfekt entspricht im deutschen Satzgefüge dem Rückbezug.
- source_word: διὰ
  choice: durch
  rationale: 'Mit dem Genitiv bezeichnet διά hier die vermittelnde Instanz: Gott gab die Verheißung durch seine Propheten.'
- source_word: τῶν προφητῶν αὐτοῦ
  choice: seine Propheten
  rationale: Die gebräuchliche deutsche Wendung gibt sowohl προφητῶν als auch den Gottesbezug des Possessivpronomens αὐτοῦ präzise wieder.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: in den heiligen Schriften
  rationale: »In« wahrt den wahrscheinlich lokativ-sphärischen Sinn von ἐν. »Heilige Schriften« vermittelt den schriftbezogenen Gebrauch von γραφαί, ohne die mögliche allgemeinere Wiedergabe »heilige Schriften« im Sinn einzelner heiliger Schriftstücke auszuschließen.
theological_decisions:
- issue: Ob γραφαῖς ἁγίαις als anerkannte »heilige Schriften« oder allgemeiner als »heilige Schriftstücke« zu verstehen ist
  choice: in den heiligen Schriften
  alternative: in heiligen Schriften
  rationale: Der paulinische Gebrauch von γραφαί und der bestimmte Bezug auf Gottes frühere Verheißung sprechen für die anerkannten heiligen Schriften. Da im Griechischen kein Artikel steht und auch einzelne heilige Schriftstücke im Blick sein können, wird die Alternative in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Relativsatz grammatisch mit Römer 1,1 verbunden; deshalb beginnt er kleingeschrieben und endet mit einem Komma.
