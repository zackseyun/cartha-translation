    reason: alternative_reading
  - marker: b
    text: 'Oder: „unter allen Nichtjuden“.'
    reason: lexical_alternative
  revision_rationale: Die Revision ersetzt die überstark kausative Formulierung „zu bewirken“ durch „zum“, das die mit εἰς ausgedrückte Zielrichtung bewahrt, ohne die umstrittene Beziehung zwischen Glauben und Gehorsam weiter auszulegen. Die Fußnotenanker werden an die erläuterten Wörter gesetzt.
