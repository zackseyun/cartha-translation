  variant: modern standard German
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: de
  text: Durch ihn haben wir Gnade und Apostelamt empfangen zum Glaubensgehorsam[a] unter allen Völkern[b] um seines Namens willen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gehorsam, der aus dem Glauben kommt“, oder: „Gehorsam, der im Glauben besteht“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „unter allen Nichtjuden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Durch ihn
  rationale: διά mit Genitiv bezeichnet hier die Vermittlung. Das deutsche Pronomen nimmt den unmittelbar zuvor genannten Jesus Christus natürlich auf.
- source_word: ἐλάβομεν
  choice: haben wir … empfangen
  rationale: Die erste Person Plural wird entsprechend dem griechischen Text bewahrt, ohne zu entscheiden, ob Paulus rhetorisch, repräsentativ oder gemeinschaftlich spricht.
- source_word: χάριν καὶ ἀποστολήν
  choice: Gnade und Apostelamt
  rationale: Die beiden koordinierten Substantive bleiben erhalten. „Apostelamt“ bezeichnet knapp und würdig den apostolischen Auftrag und Dienst.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: um … Glaubensgehorsam zu bewirken
  rationale: εἰς drückt Ziel oder Zweck aus. „Glaubensgehorsam“ ist im Deutschen eine natürliche, zugleich bewusst offene Wiedergabe der gedrängten Genitivverbindung.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: unter allen Völkern
  rationale: ἔθνη kann „Völker“ oder „Nichtjuden“ bedeuten. Die Hauptfassung bewahrt den umfassenden Horizont; die engere Möglichkeit steht in der Fußnote.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: um seines Namens willen
  rationale: Die feste deutsche Wendung gibt Beweggrund und Ziel wieder und bewahrt das biblische Gewicht des Namens als Ausdruck von Ehre und Ansehen.
theological_decisions:
- issue: Bedeutung von ὑπακοὴν πίστεως
  choice: Glaubensgehorsam
  alternative: „Gehorsam, der aus dem Glauben kommt“ oder „Gehorsam, der im Glauben besteht“
  rationale: Der griechische Genitiv lässt offen, ob der Glaube Quelle, Wesen oder nähere Bestimmung des Gehorsams ist. Das Kompositum hält diese theologische Spannung im Haupttext offen.
- issue: Reichweite von ἔθνη
  choice: alle Völker
  alternative: alle Nichtjuden
  rationale: Der Ausdruck kann allgemein die Völkerwelt oder spezifisch die nichtjüdischen Menschen bezeichnen; die Hauptfassung legt sich nicht auf die engere Lesart fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung wahrt den Zusammenhang von apostolischem Auftrag, weltweitem Ziel und der Ehre des Namens Jesu. Beide Fußnotenmarker erscheinen im Haupttext.
