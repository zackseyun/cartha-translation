revisions:
- from: Durch ihn haben wir Gnade und Apostelamt empfangen, um unter allen Völkern um seines Namens willen Glaubensgehorsam[a] zu bewirken.[b]
  to: Durch ihn haben wir Gnade und Apostelamt empfangen zum Glaubensgehorsam[a] unter allen Völkern[b] um seines Namens willen.
  rationale: Die Revision ersetzt die überstark kausative Formulierung „zu bewirken“ durch „zum“, das die mit εἰς ausgedrückte Zielrichtung bewahrt, ohne die umstrittene Beziehung zwischen Glauben und Gehorsam weiter auszulegen. Die Fußnotenanker werden an die erläuterten Wörter gesetzt.
