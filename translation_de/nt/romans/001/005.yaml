  timestamp: '2026-07-15T01:44:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbestandteile des griechischen Satzes sind zutreffend wiedergegeben: Vermittlung durch Christus, erste Person Plural, die koordinierte Gabe von Gnade und Apostelamt, der weltweite Bezug und das Handeln um seines Namens willen. „… Glaubensgehorsam zu bewirken“ legt jedoch stärker als εἰς ὑπακοὴν πίστεως eine vom Apostel hervorgebrachte Wirkung nahe. Der griechische Ausdruck bezeichnet zunächst Ziel bzw. Ausrichtung des empfangenen Auftrags.'
  naturalness: „Glaubensgehorsam“ ist ein verständlicher und im bibelsprachlich geprägten modernen Standarddeutsch etablierter Ausdruck. Die Fassung mit „zum Glaubensgehorsam“ ist knapper, natürlicher und näher an der zielgerichteten Konstruktion εἰς. Die Fußnotenmarker sollten unmittelbar an den jeweils erläuterten Ausdrücken stehen.
  terminology: „Gnade“, „Apostelamt“, „Glaubensgehorsam“, „Völker“ und „um seines Namens willen“ sind angemessen. „Völker“ bewahrt die Weite von ἔθνη; „Nichtjuden“ bleibt als sinnvolle lexikalische Alternative in der Fußnote. Die Fußnote zu Glaubensgehorsam erhält die Auslegungsbreite des Genitivs.
  issues:
  - severity: medium
    issue: „… Glaubensgehorsam zu bewirken“
    rationale: „Zu bewirken“ macht den Glaubensgehorsam zu einer kausal hergestellten Wirkung des apostolischen Handelns. Die griechische Präpositionalphrase εἰς ὑπακοὴν πίστεως benennt den Zweck bzw. das Ziel, ohne diese kausative Nuance ausdrücklich zu setzen.
  - severity: low
    issue: Position des Markers [b]
    rationale: Die Fußnote zu ἔθνη steht erst nach dem Satzschluss statt direkt bei „allen Völkern“. Eine unmittelbare Verankerung macht den Bezug eindeutig.
  revised_text: Durch ihn haben wir Gnade und Apostelamt empfangen zum Glaubensgehorsam[a] unter allen Völkern[b] um seines Namens willen.
