id: ROM.1.17
reference: Romans 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: de
  text: 'Denn darin wird Gottes Gerechtigkeit[a] offenbart: aus Glauben zu Glauben[b], wie geschrieben steht: „Der Gerechte wird aus Glauben leben.“[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann Gottes eigene Gerechtigkeit oder sein gerechtes Handeln bezeichnen, aber auch eine Gerechtigkeit, die von Gott kommt.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung „aus Glauben zu Glauben“ ist schwer zu deuten. Möglich sind unter anderem: „aus Glauben für Glauben“, „durch Glauben von Anfang bis Ende“ oder eine Bewegung von Treue zu Glauben. Die Hauptfassung bewahrt die Präpositionen und die Wiederholung des griechischen Wortlauts.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Wer aus Glauben gerecht ist, wird leben.“'
    reason: alternative_reading
  - marker: d
    text: 'Das griechische δέ kann auch ausdrücklich wiedergegeben werden: „Der Gerechte aber wird aus Glauben leben.“'
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη θεοῦ
  choice: Gottes Gerechtigkeit
  rationale: Die knappe Genitivverbindung bleibt erhalten. So wird nicht entschieden, ob vor allem Gottes eigene Gerechtigkeit, sein gerechtes Handeln oder eine von Gott kommende Gerechtigkeit gemeint ist.
- source_word: ἐν αὐτῷ
  choice: darin
  rationale: Das sächliche Pronomen verweist am natürlichsten auf das Evangelium in Römer 1,16. „Darin“ stellt diesen Rückbezug im Deutschen klar und idiomatisch her.
- source_word: ἀποκαλύπτεται
  choice: wird … offenbart
  rationale: Die passive Präsensform wird direkt und ohne zusätzliche Deutung ihres Aspekts wiedergegeben.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: aus Glauben zu Glauben
  rationale: Die Wiedergabe bewahrt beide Präpositionen und die auffällige Wiederholung von πίστις, ohne die viel diskutierte Wendung auf eine bestimmte Auslegung festzulegen.
- source_word: δίκαιος
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv im repräsentativen Singular wird knapp und in der für ein Schriftzitat angemessenen Form wiedergegeben.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: Die Formulierung bleibt nahe am Griechischen und bewahrt zugleich die mögliche syntaktische Zuordnung zu „gerecht“ oder „leben“.
- source_word: ζήσεται
  choice: wird … leben
  rationale: Das Futur wird in natürlichem, gegenwärtigem Standarddeutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη θεοῦ
  choice: Gottes Gerechtigkeit
  alternative: von Gott kommende Gerechtigkeit; Gottes gerechtes Handeln
  rationale: Der griechische Genitiv ist theologisch vieldeutig. Die Hauptfassung bewahrt seine offene Struktur, statt eine Herkunfts-, Besitz- oder Handlungsaussage festzuschreiben.
- issue: Sinn von ἐκ πίστεως εἰς πίστιν
  choice: aus Glauben zu Glauben
  alternative: aus Glauben für Glauben; durch Glauben von Anfang bis Ende
  rationale: Die notorisch schwierige Wendung kann verschieden verstanden werden. Die Hauptfassung spiegelt die Präpositionen und die Wiederholung, ohne eine Bewegung etwa von Gottes Treue zum menschlichen Glauben oder vom anfänglichen zum reifen Glauben einzutragen.
- issue: Zuordnung von ἐκ πίστεως im Habakuk-Zitat
  choice: Der Gerechte wird aus Glauben leben
  alternative: Wer aus Glauben gerecht ist, wird leben
  rationale: Die griechische Wortfolge lässt zu, ἐκ πίστεως entweder stärker mit „gerecht“ oder mit „leben“ zu verbinden. Die Hauptfassung wahrt diese Spannung weitgehend; die alternative Zuordnung wird in einer Fußnote ausdrücklich genannt.
- issue: Wiedergabe von δέ im Schriftzitat
  choice: im Haupttext nicht eigens wiedergegeben
  alternative: Der Gerechte aber wird aus Glauben leben
  rationale: δέ kann hier den Fortgang des Zitats markieren, ohne einen scharfen Gegensatz auszudrücken. Ein deutsches „aber“ könnte im Zusammenhang einen irreführenden Kontrast erzeugen; die formal mögliche Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „aus Glauben zu Glauben“ ist bewusst ungewöhnlich, weil die programmatische und mehrdeutige griechische Wendung nicht vorschnell geglättet werden soll. Das Schriftzitat bleibt knapp und feierlich, ohne altertümliches „soll leben“.
