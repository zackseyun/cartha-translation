id: ROM.1.4
reference: Romans 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: de
  text: und als Sohn Gottes in Macht eingesetzt[a] nach dem Geist der Heiligkeit[b] aufgrund der Auferstehung von den Toten – Jesus, der Messias, unser Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Sohn Gottes in Macht erwiesen“ oder „bestimmt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach dem Heiligen Geist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: eingesetzt
  rationale: Das Partizip kann ein Bestimmen, Einsetzen oder Kennzeichnen bezeichnen. „Eingesetzt“ bewahrt die kräftige Aussage des Verbs, ohne zu behaupten, Jesus sei erst bei der Auferstehung Gottes Sohn geworden; die Hauptalternativen stehen in der Fußnote.
- source_word: υἱοῦ θεοῦ
  choice: Sohn Gottes
  rationale: Direkte und im Deutschen etablierte Wiedergabe des christologischen Titels.
- source_word: ἐν δυνάμει
  choice: in Macht
  rationale: Die nahe Wiedergabe lässt offen, ob die Wendung vor allem den machtvollen Status, die Wirkungsweise oder die öffentliche Manifestation der Sohnschaft beschreibt.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: nach dem Geist der Heiligkeit
  rationale: Die ungewöhnliche griechische Formulierung wird transparent bewahrt und nicht vorschnell eindeutig mit dem Heiligen Geist gleichgesetzt.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: aufgrund der Auferstehung von den Toten
  rationale: „Aufgrund“ gibt ἐξ hier natürlich als Grundlage beziehungsweise entscheidenden Anlass wieder; „Auferstehung von den Toten“ wahrt die knappe griechische Ausdrucksweise.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, der Messias
  rationale: Χριστός wird als bedeutungsvoller Titel „Messias“ wiedergegeben; die deutsche Apposition macht den Titel idiomatisch erkennbar.
- source_word: κυρίου ἡμῶν
  choice: unser Herr
  rationale: „Herr“ ist die natürliche und traditionsübergreifend verständliche Wiedergabe von κύριος und bewahrt dessen christologisches Gewicht.
theological_decisions:
- issue: Ob ὁρισθέντος bedeutet, dass Jesus erst bei der Auferstehung Sohn Gottes wurde
  choice: „eingesetzt als Sohn Gottes in Macht“
  alternative: „als Sohn Gottes in Macht erwiesen“ oder „bestimmt“
  rationale: Die Übersetzung hält an der Aussage des griechischen Verbs und an der Verbindung „in Macht“ fest, ohne eine Entstehung der Sohnschaft erst bei der Auferstehung ausdrücklich hineinzulesen. Die Spannung bleibt erhalten.
- issue: Ob πνεῦμα ἁγιωσύνης ausdrücklich den Heiligen Geist bezeichnet
  choice: „nach dem Geist der Heiligkeit“
  alternative: „nach dem Heiligen Geist“
  rationale: Die ungewöhnliche Formulierung kann auf den Heiligen Geist weisen, ist aber nicht die übliche griechische Bezeichnung. Die Hauptfassung bewahrt daher die Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng am komprimierten griechischen Satzbau, ist aber durch den Doppelpunkt und die Apposition gut lesbar. Sämtliche Fußnotenmarker erscheinen im Haupttext.
