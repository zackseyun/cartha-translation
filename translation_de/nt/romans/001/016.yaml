id: ROM.1.16
reference: Romans 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: de
  text: 'Denn ich schäme mich der guten Nachricht[a] nicht; denn sie ist Gottes Kraft zur Rettung für jeden, der glaubt: für den Juden zuerst und ebenso für den Griechen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Evangeliums“.'
    reason: lexical_alternative
  - marker: b
    text: „Grieche“ kann hier weiter gefasst einen Nichtjuden bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: ich schäme mich … nicht
  rationale: Die Formulierung gibt das Empfinden von Scham beziehungsweise das Zurückweichen aus Scham idiomatisch wieder und bewahrt den öffentlichen, entschiedenen Ton der Aussage.
- source_word: εὐαγγέλιον
  choice: gute Nachricht
  rationale: Diese Wiedergabe macht den Wortsinn im heutigen Deutsch unmittelbar verständlich; der traditionelle Ausdruck „Evangelium“ wird als lexikalische Alternative in einer Fußnote genannt.
- source_word: δύναμις
  choice: Kraft
  rationale: „Kraft“ ist im Deutschen eine natürliche und theologisch nicht überladene Wiedergabe für Gottes wirksames rettendes Handeln.
- source_word: εἰς σωτηρίαν
  choice: zur Rettung
  rationale: Die Formulierung bewahrt die Ziel- beziehungsweise Wirkungsrichtung von εἰς und ist in modernem Deutsch klar.
- source_word: παντὶ τῷ πιστεύοντι
  choice: für jeden, der glaubt
  rationale: Die Wiedergabe erhält sowohl den verteilenden Sinn von παντί als auch die verbale Aussage des Partizips πιστεύοντι.
- source_word: Ἰουδαίῳ
  choice: für den Juden
  rationale: Im Gegensatz zu Ἕλλην bezeichnet das Wort hier am ehesten die ethnisch-religiöse Zugehörigkeit und nicht lediglich die geografische Herkunft aus Judäa.
- source_word: πρῶτον
  choice: zuerst
  rationale: „Zuerst“ bewahrt knapp die im griechischen Text ausgesagte Reihenfolge, ohne ihre genaue heilsgeschichtliche Bedeutung zusätzlich auszudeuten.
- source_word: Ἕλληνι
  choice: für den Griechen
  rationale: Der Haupttext bleibt bei der konkreten lexikalischen Bezeichnung des griechischen Ausgangstextes; der in diesem Zusammenhang mögliche weitere Sinn „Nichtjude“ wird in einer Fußnote erläutert.
- source_word: τε … καί
  choice: und ebenso
  rationale: Die Verbindung drückt nach der genannten Vorrangstellung die Einbeziehung der zweiten Gruppe aus und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutungsumfang von Ἕλληνι in der Wendung „dem Juden zuerst und ebenso dem Griechen“
  choice: „Griechen“ im Haupttext, mit Hinweis auf den möglichen weiteren Sinn „Nichtjude“ in der Fußnote
  alternative: „Nichtjuden“ im Haupttext
  rationale: So bleibt die konkrete Wortwahl des griechischen Textes sichtbar, ohne den bei Paulus häufig weiter gefassten, repräsentativen Gebrauch für die nichtjüdische Welt zu verschweigen.
- issue: Bedeutung von πρῶτον
  choice: Die Reihenfolge wird mit „zuerst“ bewahrt, aber nicht näher erklärt.
  alternative: Eine Ausdeutung als zeitlicher, heilsgeschichtlicher oder bleibender Vorrang im Haupttext
  rationale: Der Vers nennt eine Priorität, bestimmt hier jedoch nicht ausdrücklich deren genaue Art. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Begründung mit „denn“ spiegelt die argumentative Struktur des griechischen Textes. Der Doppelpunkt vor den beiden Gruppen verdeutlicht, auf wen sich „jeden, der glaubt“ bezieht, ohne eine zusätzliche Aussage einzuführen.
