  terminology: „Griechen“ und „Nichtgriechen“ bilden das historische Gegensatzpaar klar ab. „Weisen“ und „Unverständigen“ bewahren die semantische Breite von σοφοῖς und ἀνοήτοις; „verpflichtet“ vermittelt die hier gemeinte nichtfinanzielle Schuld- bzw. Pflichtbeziehung von ὀφειλέτης. Die Fußnote erläutert „Barbaren“ sachlich und ohne unnötige Wertung.
