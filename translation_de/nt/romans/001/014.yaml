  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: de
  text: Griechen wie Nichtgriechen[a], Weisen wie Unverständigen bin ich verpflichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Barbaren. Gemeint sind im damaligen griechischen Sprachgebrauch Menschen, die keine Griechen waren; das Wort bezeichnet hier nicht notwendigerweise unzivilisierte oder grausame Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: Griechen
  rationale: Die Dativform bezeichnet Griechen als ethnisch-kulturelle Gruppe und bildet den ersten Pol des zeitgenössischen Gegensatzpaares.
- source_word: βαρβάροις
  choice: Nichtgriechen
  rationale: Das Wort bezeichnet hier im geläufigen griechischen Kulturkontrast diejenigen, die keine Griechen sind. „Nichtgriechen“ gibt den gemeinten Gegensatz wieder, ohne die heute abwertende Nebenbedeutung von „Barbaren“ in den Haupttext zu tragen.
- source_word: σοφοῖς
  choice: Weisen
  rationale: Die direkte und prägnante Wiedergabe bewahrt den Gegensatz zu ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: Unverständigen
  rationale: Das Wort bezeichnet Menschen ohne Einsicht oder Verständnis. „Unverständige“ wahrt die Breite des Ausdrucks besser als das stärker wertende „Toren“ und enger als „Ungebildete“.
- source_word: ὀφειλέτης
  choice: bin ich verpflichtet
  rationale: Das Substantiv bedeutet wörtlich „Schuldner“, bezeichnet hier aber eine bestehende Verpflichtung. Die prädikative Formulierung klingt im modernen Deutschen natürlich und erhält den Nachdruck.
- source_word: τε ... καὶ / τε ... καὶ
  choice: wie ... / wie ...
  rationale: Die zweimalige korrelative Struktur wird durch die parallele deutsche Fügung „X wie Y“ knapp und rhetorisch ausgewogen wiedergegeben.
