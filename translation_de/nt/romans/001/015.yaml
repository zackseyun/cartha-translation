source:
  edition: SBLGNT
  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: de
  text: Darum bin ich meinerseits bereit, auch euch in Rom die gute Nachricht zu verkünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Evangelium zu verkünden.'
    reason: Lexikalische Alternative für εὐαγγελίσασθαι.
lexical_decisions:
- source_word: οὕτως
  choice: Darum
  rationale: Das Wort zieht hier eine folgernde Verbindung aus der vorangehenden Darlegung. „Darum“ gibt diese Funktion im Deutschen natürlich wieder; möglich wären auch „So“ oder „Daher“.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: bin ich meinerseits bereit
  rationale: Die griechische Wendung ist elliptisch und bezeichnet Paulus’ eigene willige Bereitschaft. Die Formulierung ist idiomatisch und wahrt mit „meinerseits“ die Begrenzung auf seinen Anteil.
- source_word: καὶ ὑμῖν
  choice: auch euch
  rationale: καί schließt die Menschen in Rom ausdrücklich in den Kreis derer ein, denen Paulus die gute Nachricht verkünden möchte.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: euch in Rom
  rationale: Die substantivierte Präpositionalwendung bestimmt die angesprochenen Empfänger. Im Deutschen ist die knappe Verbindung mit „euch“ natürlich und eindeutig.
- source_word: εὐαγγελίσασθαι
  choice: die gute Nachricht zu verkünden
  rationale: Das Verb bezeichnet das Verkünden einer guten Nachricht beziehungsweise des Evangeliums. Diese Wiedergabe bleibt verständlich und beschränkt die Tätigkeit nicht unnötig auf eine formelle Predigt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die griechische Ellipse wird idiomatisch aufgelöst, ohne Paulus’ persönliche Bereitschaft oder das einschließende „auch euch“ abzuschwächen.
