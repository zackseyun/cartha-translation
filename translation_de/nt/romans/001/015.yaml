  terminology: „Die gute Nachricht“ ist eine gut verständliche und semantisch tragfähige Wiedergabe im gegebenen Übersetzungsstil. Die Fußnote mit „das Evangelium“ bietet die geläufige kirchliche Terminologie als sachgerechte lexikalische Alternative.
