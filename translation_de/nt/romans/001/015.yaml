  source_fidelity: Die Übersetzung gibt die elliptische Wendung τὸ κατ’ ἐμὲ πρόθυμον idiomatisch als „bin ich meinerseits bereit“ wieder und bewahrt damit sowohl Paulus’ persönliche Bereitschaft als auch die Einschränkung auf seinen eigenen Anteil. „Darum“ gibt die rückverweisend-folgernde Funktion von οὕτως im Kontext angemessen wieder. „auch euch in Rom“ entspricht καὶ ὑμῖν τοῖς ἐν Ῥώμῃ, und „die gute Nachricht zu verkünden“ trifft εὐαγγελίσασθαι ohne eine bloß formale Predigtsituation vorauszusetzen.
