lexical_decisions:
- source_word: φάσκοντες
  choice: Während sie behaupteten
  rationale: Das Partizip bezeichnet ihr selbstbewusstes Behaupten. „Behaupteten“ gibt dies natürlich und ohne die stärkere Unterstellung von „gaben vor“ wieder; „während“ wahrt den begleitenden Umstand und lässt den ironischen Gegensatz hervortreten.
- source_word: εἶναι
  choice: zu sein
  rationale: Der Infinitiv bezeichnet unmittelbar den Inhalt ihrer Behauptung.
- source_word: σοφοὶ
  choice: weise
  rationale: Die knappe prädikative Form bewahrt die wertende Aussage und den Gegensatz zu „Narren“.
- source_word: ἐμωράνθησαν
  choice: wurden sie zu Narren
  rationale: Die Form bezeichnet den Eintritt in einen Zustand. Die substantivische Wendung bewahrt den scharfen rhetorischen Gegensatz zwischen angeblicher Weisheit und tatsächlicher Torheit.
theological_decisions:
- issue: Ob ἐμωράνθησαν als persönliche Bezeichnung oder als Eigenschaft wiederzugeben ist
  choice: wurden sie zu Narren
  alternative: wurden sie töricht
  rationale: „Zu Narren“ erhält die pointierte Antithese des griechischen Satzes. Die alternative Wiedergabe als Eigenschaft bleibt sachlich möglich und wird in der Fußnote genannt.
- issue: Ob die passive Form von ἐμωράνθησαν einen ausdrücklich handelnden Urheber bezeichnet
  choice: keinen Urheber ergänzen
  alternative: sie wurden zu Narren gemacht
  rationale: Die griechische Form erlaubt hier eine intransitiv-ergative Bedeutung des Werdens. Die Übersetzung soll keinen nicht ausdrücklich genannten Urheber eintragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Formulierung bleibt knapp und erhält die ironische Zuspitzung des griechischen Satzes.
