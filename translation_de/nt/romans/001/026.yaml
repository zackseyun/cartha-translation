source:
  edition: SBLGNT
  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: de
  text: Darum gab Gott sie schändlichen Leidenschaften preis; denn auch ihre Frauen vertauschten den natürlichen Geschlechtsverkehr mit dem, was gegen die Natur ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ihre weiblichen [Personen] vertauschten den natürlichen Gebrauch mit dem, was gegen die Natur ist.“'
    reason: Bewahrt die formnähere Wiedergabe von θήλειαι, χρῆσις und παρὰ φύσιν als lexikalische Alternative.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Deshalb
  rationale: Ein natürlicher deutscher Kausalanschluss, der den Vers eng mit der vorausgehenden Begründung verbindet.
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: gab Gott sie … preis
  rationale: „Preisgeben“ gibt den Vorgang des Auslieferns an die beschriebenen Folgen prägnant wieder, ohne zusätzliche Deutung einzutragen.
- source_word: πάθη ἀτιμίας
  choice: entehrenden Leidenschaften
  rationale: Die Formulierung bewahrt die wertende Kraft von ἀτιμία und klingt zugleich in modernem Deutsch würdig und verständlich.
- source_word: αἵ … θήλειαι αὐτῶν
  choice: ihre Frauen
  rationale: Im menschlichen Kontext ist „Frauen“ natürliches Deutsch; das griechische θήλειαι bezeichnet wörtlicher die weiblichen Wesen und steht im Kontrast zum männlichen Ausdruck des Folgeverses.
- source_word: μετήλλαξαν
  choice: vertauschten
  rationale: Das Verb bezeichnet einen bewussten Austausch; „vertauschten … mit“ bildet diese Bewegung idiomatisch ab.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: den natürlichen Verkehr
  rationale: χρῆσις heißt grundsätzlich „Gebrauch“, bezeichnet hier aber kontextbedingt den geschlechtlichen Umgang. „Verkehr“ ist knapp, verständlich und weniger missverständlich als eine wörtliche Wiedergabe mit „Gebrauch“.
- source_word: τὴν παρὰ φύσιν
  choice: dem widernatürlichen
  rationale: Die substantivierte Form nimmt „Verkehr“ elliptisch wieder auf und bewahrt die wertende Gegenüberstellung von φυσικός und παρὰ φύσιν.
theological_decisions:
- issue: Stärke der moralischen Wertung
  choice: Die Ausdrücke „entehrend“ und „widernatürlich“ werden ausdrücklich beibehalten.
  alternative: Die Wertung durch weichere Umschreibungen abschwächen oder durch moderne Kategorien näher bestimmen.
  rationale: 'Der griechische Text wertet selbst, nennt aber keine modernen Identitätskategorien. Die Übersetzung soll beides respektieren: die Wertung bewahren und keine weitergehende Systematisierung hinzufügen.'
- issue: Bedeutung von φύσις in der Wendung παρὰ φύσιν
  choice: Mit „widernatürlich“ übersetzen, ohne im Haupttext zu erläutern, welcher Naturbegriff vorausgesetzt ist.
  alternative: Interpretierend etwa „gegen die Schöpfungsordnung“ oder abschwächend „ungewöhnlich“ formulieren.
  rationale: παρὰ φύσιν bedeutet hier „gegen die Natur“. Eine genauere theologische Bestimmung des Naturbegriffs würde die im Einzelvers verbleibende Auslegungsfrage vorentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau. „Verkehr“ macht den sexuellen Kontext deutlich, ohne moderne Identitätsbegriffe einzutragen; die Fußnote dokumentiert die wörtlichere Ausdrucksweise.
