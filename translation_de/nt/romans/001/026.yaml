revisions:
- from: Deshalb gab Gott sie entehrenden Leidenschaften preis. Denn sogar ihre Frauen vertauschten den natürlichen Verkehr mit dem widernatürlichen.[a]
  to: Darum gab Gott sie schändlichen Leidenschaften preis; denn auch ihre Frauen vertauschten den natürlichen Geschlechtsverkehr mit dem, was gegen die Natur ist.[a]
  rationale: Die Revision behebt die unvollständige Ellipse im Haupttext und die strukturell wie stilistisch mangelhafte Fußnote. Sie behält den kausalen Zusammenhang, Gottes Preisgabe, die wertende Sprache und die begriffliche Offenheit von „gegen die Natur“ bei. Der sexuelle Sinn von χρῆσις wird im Kontext ausdrücklich, aber ohne zusätzliche theologische oder moderne kategorische Deutung wiedergegeben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:44:37Z'
review_pass:
  verdict: revise
  source_fidelity: Der Kausalanschluss, das gerichtliche „preisgeben“ und der Austauschgedanke entsprechen dem griechischen Text. „Frauen“ ist im menschlichen Kontext eine vertretbare idiomatische Wiedergabe von θήλειαι. Die aktuelle Ellipse „mit dem widernatürlichen“ gibt jedoch τὴν παρὰ φύσιν nicht vollständig und grammatisch sauber wieder; die griechische Wendung bezieht sich auf den ausgelassenen Gebrauch/Verkehr und bedeutet wörtlich „gegen die Natur“ bzw. „was gegen die Natur ist“.
  naturalness: „Entehrenden Leidenschaften“ ist verständlich, wirkt aber weniger idiomatisch und kann aktiv-kausativ („Leidenschaften, die entehren“) verstanden werden. „Schändlichen Leidenschaften“ gibt die abwertende Genitivqualifikation πάθη ἀτιμίας in modernem Standarddeutsch natürlicher wieder. „Natürlichen Geschlechtsverkehr“ macht den durch den Kontext bestimmten Sinn von χρῆσις klar, ohne moderne Identitätskategorien einzutragen.
  terminology: „Schändlich“ bewahrt die Wertung von ἀτιμία, ohne sie zu verschärfen. „Gegen die Natur“ bildet παρὰ φύσιν unmittelbar ab und lässt offen, wie Paulus’ Naturbegriff im größeren Argument zu bestimmen ist. Die Fußnote verwendet eine tatsächlich formnähere, zugleich grammatisch vollständige Alternative; „weibliche Wesen“ wird vermieden, da es im Deutschen für Menschen unnatürlich und potenziell entpersonalisierend klingt.
  issues:
  - severity: medium
    issue: Unvollständige bzw. unidiomatische Wiedergabe von τὴν παρὰ φύσιν im Haupttext
    rationale: „den natürlichen Verkehr mit dem widernatürlichen“ lässt das Bezugswort elliptisch aus und bildet den griechischen Ausdruck nicht klar ab. Eine vollständige Formulierung mit „was gegen die Natur ist“ erhält die syntaktische Offenheit des Griechischen.
  - severity: low
    issue: „entehrenden Leidenschaften“ ist semantisch weniger präzise und stilistisch schwerfällig
    rationale: πάθη ἀτιμίας bezeichnet Leidenschaften der Schande/Entehrung; „schändliche Leidenschaften“ ist im Deutschen die natürlichere attributive Wiedergabe, ohne die Wertung zu verändern.
  - severity: medium
    issue: Fußnote ist grammatisch unvollständig und enthält „weibliche Wesen“ als unnatürliche Personenbezeichnung
    rationale: „mit dem gegen die Natur“ benötigt ein Bezugswort bzw. eine vollständige substantivische Konstruktion. „Weibliche Wesen“ ist hier kein angemessenes modernes Standarddeutsch; „Frauen“ kann als idiomatische Haupttextlesart stehen, während die Fußnote die lexikalische Paarung mit „weiblich“ sachlich erläutert.
  revised_text: Darum gab Gott sie schändlichen Leidenschaften preis; denn auch ihre Frauen vertauschten den natürlichen Geschlechtsverkehr mit dem, was gegen die Natur ist.[a]
