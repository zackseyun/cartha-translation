  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: de
  text: Verleumder, Menschen, die Gott hassen[a], Unverschämte, Hochmütige, Prahler, Erfinder böser Taten, den Eltern ungehorsam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Gott gehasst“.'
    reason: Alternative Deutung des seltenen griechischen Wortes θεοστυγεῖς.
lexical_decisions:
- source_word: καταλάλους
  choice: Verleumder
  rationale: Das Wort bezeichnet Menschen, die abwesende Dritte herabsetzen oder verleumden. „Verleumder“ ist knapp, verständlich und bewahrt die ethische Schärfe.
- source_word: θεοστυγεῖς
  choice: Menschen, die Gott hassen
  rationale: Die aktive Deutung passt gut in die Reihe menschlicher Haltungen und Handlungen. Die umstrittene passive Deutung wird in einer Fußnote bewahrt.
- source_word: ὑβριστάς
  choice: Gewalttäter
  rationale: Der Ausdruck bezeichnet Menschen, die andere in überheblicher, frevelhafter Weise misshandeln; „Gewalttäter“ gibt den tätlichen und missbräuchlichen Aspekt natürlicher wieder als das im Deutschen missverständliche „Freche“.
- source_word: ὑπερηφάνους
  choice: Hochmütige
  rationale: „Hochmütige“ bezeichnet Menschen, die sich über andere erheben, und grenzt den Ausdruck von dem folgenden prahlerischen Auftreten ab.
- source_word: ἀλαζόνας
  choice: Prahler
  rationale: Der Ausdruck meint großsprecherische oder anmaßende Menschen; „Prahler“ ist prägnant und gegenwärtig verständlich.
- source_word: ἐφευρετὰς κακῶν
  choice: Erfinder böser Taten
  rationale: Die Formulierung bewahrt das anschauliche „Erfinder“ und macht deutlich, dass Menschen neue Formen bösen Handelns ersinnen.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: den Eltern ungehorsam
  rationale: Die Wiedergabe entspricht unmittelbar der Verbindung des Adjektivs mit dem Dativ und ist im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von θεοστυγεῖς
  choice: 'aktiv: „Menschen, die Gott hassen“'
  alternative: 'passiv: „von Gott gehasst“'
  rationale: Die aktive Bedeutung fügt sich in die Lasterreihe ein, die menschliche Einstellungen und Verhaltensweisen benennt. Da die seltene Form auch passiv verstanden worden ist, bleibt diese theologisch gewichtige Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Die nominale Reihung des griechischen Lasterkatalogs bleibt erhalten; „Menschen, die Gott hassen“ vermeidet das schwerfällige Kompositum „Gotteshasser“. Der abschließende Beistrich signalisiert, dass der Satz in Vers 31 weitergeht.
