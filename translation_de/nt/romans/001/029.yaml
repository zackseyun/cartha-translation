  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: de
  text: erfüllt von jeder Art Ungerechtigkeit[a], Bosheit, Habgier und Niedertracht, voll von Neid, Mord, Streit, Betrug und Tücke; Menschen, die heimlich schlecht über andere reden[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „von aller Ungerechtigkeit“; die griechische Wendung bezeichnet einen umfassenden Bereich.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Flüsterer“; gemeint sein können auch Menschen, die hinter dem Rücken anderer schlecht über sie reden oder Gerüchte verbreiten.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: erfüllt
  rationale: Das Partizip Perfekt Passiv bezeichnet einen bestehenden, aus einem vorausgehenden Geschehen resultierenden Zustand. „Erfüllt“ bewahrt diesen Sinn und schließt grammatisch an den vorangehenden Satz an.
- source_word: πάσῃ ἀδικίᾳ
  choice: von jeder Art Ungerechtigkeit
  rationale: Bei dem abstrakten Substantiv bringt „jeder Art“ den umfassenden Geltungsbereich von πάσῃ idiomatisch zum Ausdruck, ohne ihn auf soziale Ungerechtigkeit einzuengen.
- source_word: πονηρίᾳ
  choice: Bosheit
  rationale: „Bosheit“ bezeichnet allgemein moralisch Schlechtes und ist im Deutschen ein klares, würdiges Wort für diesen Lasterkatalog.
- source_word: πλεονεξίᾳ
  choice: Habgier
  rationale: „Habgier“ gibt das maßlose Verlangen nach immer mehr in modernem Standarddeutsch prägnant wieder.
- source_word: κακίᾳ
  choice: Niedertracht
  rationale: „Niedertracht“ hebt die böswillige Haltung gegenüber anderen hervor und unterscheidet den Ausdruck von der allgemeineren „Bosheit“ für πονηρίᾳ.
- source_word: μεστοὺς
  choice: voll von
  rationale: Die Formulierung gibt die Zustandsbeschreibung natürlich wieder und wahrt zugleich die sprachliche Variation gegenüber πεπληρωμένους („erfüllt“).
- source_word: φθόνου
  choice: Neid
  rationale: „Neid“ ist die direkte und im Lasterkatalog passende Entsprechung.
- source_word: φόνου
  choice: Mord
  rationale: Der moralisch bestimmte Kontext spricht für „Mord“ statt für das neutralere „Tötung“.
- source_word: ἔριδος
  choice: Streit
  rationale: „Streit“ bezeichnet knapp und verständlich den gemeinten konfliktstiftenden Zwist.
- source_word: δόλου
  choice: Betrug
  rationale: „Betrug“ vermittelt die Bedeutung absichtlicher Täuschung in geläufigem Deutsch.
- source_word: κακοηθείας
  choice: Tücke
  rationale: „Tücke“ bezeichnet eine böswillige, hinterhältige Gesinnung und hält den Ausdruck von κακίᾳ („Niedertracht“) unterscheidbar.
- source_word: ψιθυριστάς
  choice: heimliche Verleumder
  rationale: Das Wort bezeichnet Menschen, die flüsternd beziehungsweise hinter dem Rücken anderer abträglich über sie reden. „Heimliche Verleumder“ gibt die soziale Funktion natürlich wieder; die Fußnote bewahrt das Bild des Flüsterns und weitere mögliche Nuancen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Lasterkatalog mit knappen Substantiven. Die Akkusativ- und Partizipialkonstruktion sowie das abschließende Komma berücksichtigen, dass der Vers syntaktisch an den vorherigen und den folgenden Kontext anschließt. „Niedertracht“ und „Tücke“ vermeiden eine unnötige Gleichsetzung der benachbarten griechischen Begriffe κακία und κακοήθεια.
