id: ROM.1.13
reference: Romans 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: de
  text: 'Ich möchte aber, dass ihr darüber Bescheid wisst, Brüder und Schwestern[a]: Ich habe mir schon oft vorgenommen, zu euch zu kommen – bin jedoch bis heute daran gehindert worden –, damit ich auch unter euch etwas Frucht[b] gewinne, ebenso wie unter den übrigen Nichtjuden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brüder«; die Anrede kann hier die gesamte Glaubensgemeinschaft, Männer und Frauen, einschließen.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Frucht« ist der Ertrag oder das Ergebnis von Paulus’ Wirken unter ihnen gemeint.
    reason: metaphor_note
  - marker: c
    text: 'Wörtlich: »Völkern« oder »Nationen«; im paulinischen Zusammenhang sind Nichtjuden gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν
  choice: Ich möchte aber nicht, dass ihr nicht wisst
  rationale: Bewahrt die verneinte Formulierung des Griechischen und gibt δέ mit dem leichten Anschluss »aber« wieder, ohne ein nicht vorhandenes zeitliches »nun« einzuführen.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die maskuline Pluralform dient in der gemischten römischen Gemeinde als gemeinschaftliche Anrede; die inklusive Bedeutung wird in natürlichem modernem Deutsch im Haupttext ausgedrückt, während die formale Alternative in der Fußnote steht.
- source_word: πολλάκις προεθέμην
  choice: Ich habe mir schon oft vorgenommen
  rationale: Gibt die wiederholte, bewusste Absicht idiomatisch und zeitlich passend wieder.
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: bin jedoch bis heute daran gehindert worden
  rationale: Bewahrt das Passiv und den fortdauernden Charakter der Verhinderung bis zum Zeitpunkt des Schreibens.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: damit ich … einige Frucht erlange
  rationale: Erhält die landwirtschaftliche Metapher; »einige Frucht« entspricht dem unbestimmten τινὰ καρπόν, ohne die Art des Ergebnisses vorschnell festzulegen.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Bezeichnet idiomatisch den Wirkungsbereich innerhalb der römischen Gemeinde, ohne ein ausschließlich innerliches Verständnis von »in euch« nahezulegen.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: den übrigen Völkern
  rationale: Erhält die lexikalische Offenheit von ἔθνη; im paulinischen Zusammenhang sind besonders die nichtjüdischen Völker gemeint, was die Fußnote erläutert.
theological_decisions:
- issue: Bedeutung der Frucht
  choice: Die Metapher »Frucht« bleibt im Haupttext stehen.
  alternative: »Ertrag« oder »Ergebnisse meines Dienstes«
  rationale: Der griechische Text lässt offen, ob Paulus Bekehrungen, geistliche Stärkung, gegenseitige Ermutigung oder allgemein den Ertrag seines Wirkens meint; eine erklärende Auflösung würde diese Spannung verengen.
- issue: Bedeutung von ἔθνη
  choice: »Völker« im Haupttext
  alternative: »Nichtjuden«
  rationale: »Nichtjuden« ist kontextuell sehr wahrscheinlich, doch »Völker« bewahrt die sprachliche Breite und macht zugleich verständlich, dass Rom zu Paulus’ weiterem Wirkungsfeld unter den Völkern gehört.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Gedankenführung, wird aber durch Doppelpunkt und Gedankenstriche lesbar gegliedert. Die Metapher »Frucht« und die passive Verhinderung bleiben erhalten; unnötige kirchliche Fachsprache wird vermieden.
