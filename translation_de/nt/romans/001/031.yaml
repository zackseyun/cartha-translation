  text: ἀσυνέτους, ἀσυνθέτους, ⸀ἀστόργους, ἀνελεήμονας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: de
  text: unverständig, wortbrüchig[a], lieblos[b], erbarmungslos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „unzuverlässig“; gemeint sind Menschen, die Abmachungen oder Zusagen nicht einhalten.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist besonders das Fehlen natürlicher Zuneigung und Liebe innerhalb der Familie.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: unverständig
  rationale: Das Wort bezeichnet fehlendes Verständnis oder Urteilsvermögen. „Unverständig“ bewahrt die moralisch-geistige Aussage, ohne bloß geringe Intelligenz zu unterstellen.
- source_word: ἀσυνθέτους
  choice: wortbrüchig
  rationale: Gemeint sind Menschen, die Abmachungen oder Zusagen nicht einhalten. „Wortbrüchig“ gibt diesen Sinn im Deutschen präziser wieder als das mehrdeutige „treulos“.
- source_word: ἀστόργους
  choice: lieblos
  rationale: Das Wort verneint besonders die natürliche, vor allem familiäre Zuneigung. „Lieblos“ ist in der knappen Aufzählung natürlich; die engere Bedeutung wird in einer Fußnote erläutert.
- source_word: ἀνελεήμονας
  choice: erbarmungslos
  rationale: Das Wort bezeichnet das Fehlen von Erbarmen oder Mitgefühl. „Erbarmungslos“ ist eine klare und treffende moderne Entsprechung.
theological_decisions: []
