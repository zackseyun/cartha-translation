  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: de
  text: Denn was man von Gott erkennen kann, ist unter ihnen offenbar,[a] weil Gott es ihnen offenbar gemacht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihnen“ beziehungsweise „in ihrem Inneren“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Begründung für die vorherige Aussage ein und stellt im Deutschen einen natürlichen kausalen Anschluss her.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: was man von Gott erkennen kann
  rationale: Das substantivierte Adjektiv bezeichnet hier das von Gott Erkennbare; die Formulierung gibt den möglichen Sinn wieder, ohne einen bloßen vorhandenen Wissensbestand vorauszusetzen.
- source_word: φανερόν
  choice: offenbar
  rationale: Gibt die Bedeutung von etwas Klar-Erkennbarem oder Offen-Zutage-Liegendem wieder und bewahrt den sprachlichen Zusammenhang mit ἐφανέρωσεν.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: Gibt den öffentlichen beziehungsweise gemeinschaftlichen Sinn der Präpositionalphrase natürlich wieder; die mögliche innere Lokalisierung bleibt in der Fußnote erhalten.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: weil Gott es ihnen offenbar gemacht hat
  rationale: Bewahrt die kausale Funktion von γάρ und den Wortzusammenhang zwischen φανερόν und ἐφανέρωσεν in verständlichem Deutsch.
theological_decisions:
- issue: Bedeutung von ἐν αὐτοῖς
  choice: unter ihnen
  alternative: in ihnen / in ihrem Inneren
  rationale: Die griechische Wendung ist mehrdeutig. Der Haupttext folgt dem öffentlichen beziehungsweise gemeinschaftlichen Sinn, während die mögliche innere Offenbarung ausdrücklich in der Fußnote bewahrt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Offenbar“ wahrt die bewusste Wiederaufnahme desselben griechischen Wortfeldes, ohne unnötig fachsprachlich zu klingen.
