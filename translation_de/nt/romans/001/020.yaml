id: ROM.1.20
reference: Romans 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: de
  text: Denn seine unsichtbaren Eigenschaften[a], nämlich seine ewige Kraft und Göttlichkeit[b], werden seit der Erschaffung der Welt an dem, was geschaffen ist, mit dem Verstand erfasst und klar erkannt, sodass sie keine Entschuldigung haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Unsichtbare an ihm“; auch: „seine unsichtbaren Wesenszüge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „göttliches Wesen“. Das griechische Wort lautet hier θειότης, nicht der stärkere Ausdruck θεότης.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: seine unsichtbaren Eigenschaften
  rationale: Das substantivierte neutrale Plural bezeichnet allgemein das Unsichtbare an Gott. „Eigenschaften“ macht den Bezug verständlich, ohne ihn auf einzelne unsichtbare Gegenstände zu beziehen.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: seit der Erschaffung der Welt
  rationale: „Seit“ gibt den zeitlichen Ausgangspunkt und die bis in die Gegenwart reichende Geltung der Aussage natürlich wieder.
- source_word: τοῖς ποιήμασιν
  choice: an dem Geschaffenen
  rationale: Der Dativ bezeichnet hier das Geschaffene als das Mittel beziehungsweise den Wahrnehmungsgrund, an dem Gottes unsichtbare Eigenschaften erkannt werden.
- source_word: νοούμενα
  choice: mit dem Verstand erfasst
  rationale: Die Form bezeichnet geistiges Wahrnehmen oder Begreifen und erklärt, wie das Unsichtbare durch das Geschaffene erkannt wird.
- source_word: καθορᾶται
  choice: werden … klar erkannt
  rationale: Die Wiedergabe bewahrt die intensive Bedeutung des Verbs und den fortdauernden Charakter des griechischen Präsens.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: nämlich seine ewige Kraft
  rationale: Die Wendung erläutert, was zu Gottes unsichtbaren Eigenschaften gehört; „ewig“ gibt ἀΐδιος knapp und idiomatisch wieder.
- source_word: θειότης
  choice: Göttlichkeit
  rationale: „Göttlichkeit“ bezeichnet die göttliche Qualität oder das göttliche Wesen und wahrt eher als „Gottheit“ den Unterschied zum stärkeren Ausdruck θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: sodass sie keine Entschuldigung haben
  rationale: Die Konstruktion wird als Folge wiedergegeben. „Keine Entschuldigung haben“ ist verständlich und bleibt dem Sinn von ἀναπολόγητος nahe.
theological_decisions:
- issue: Wiedergabe von θειότης ohne Überzeichnung
  choice: Göttlichkeit
  alternative: göttliches Wesen; Gottheit
  rationale: Der Text sagt, dass sich in der Schöpfung wahrhaft Göttliches von Gott erkennen lässt. „Göttlichkeit“ wahrt zugleich den lexikalischen Unterschied zwischen θειότης und dem stärkeren θεότης.
- issue: Verhältnis von Offenbarung und menschlicher Verantwortlichkeit
  choice: Folgeformulierung „sodass sie keine Entschuldigung haben“
  alternative: „wodurch sie ohne Entschuldigung sind“
  rationale: Die Formulierung bewahrt die im griechischen εἰς τό liegende Ergebnisbeziehung, ohne eine weitergehende dogmatische Erklärung darüber einzutragen, wie diese Erkenntnis zustande kommt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem argumentativen Zusammenhang des griechischen Textes nahe; „mit dem Verstand erfasst und klar erkannt“ erhält sowohl die gedankliche Wahrnehmung als auch die intensive Sichtbarkeit.
