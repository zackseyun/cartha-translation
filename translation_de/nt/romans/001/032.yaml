  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: de
  text: Obwohl sie Gottes gerechtes Urteil[a] kennen – dass nämlich diejenigen, die solche Dinge tun, den Tod verdienen –, tun sie diese Dinge nicht nur selbst, sondern billigen auch diejenigen, die sie tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtsforderung“, „Rechtssatz“ oder „Urteil“.'
    reason: δικαίωμα besitzt hier eine rechtlich-normative Bedeutungsbreite, die sich nicht vollständig mit einem einzigen deutschen Ausdruck abdecken lässt.
lexical_decisions:
- source_word: οἵτινες
  choice: sie
  rationale: Das Relativpronomen greift die im vorherigen Zusammenhang beschriebenen Menschen auf. Im Deutschen ergibt die durch das konzessive Partizip eröffnete Satzform mit „sie“ einen natürlichen Anschluss.
- source_word: τὸ δικαίωμα τοῦ θεοῦ
  choice: Gottes gerechtes Urteil
  rationale: δικαίωμα bezeichnet hier Gottes rechtlich-moralische Feststellung, die der folgende dass-Satz erläutert. „Gerechtes Urteil“ bewahrt sowohl den juridischen als auch den normativen Gehalt.
- source_word: ἐπιγνόντες
  choice: obwohl sie … kennen
  rationale: 'Das Partizip ist im Zusammenhang konzessiv zu verstehen: Ihr Handeln und Billigen geschieht trotz ihrer Kenntnis. „Kennen“ gibt die bewusste Kenntnis idiomatisch wieder, ohne durch „vollständig erkennen“ zu überdeuten.'
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: die, die solche Dinge tun
  rationale: Die Formulierung bezeichnet Menschen, deren Handeln durch solche Dinge geprägt ist. Das natürliche deutsche „tun“ trägt den Sinn im Kontext, ohne unnötig eine institutionalisierte Praxis anzudeuten.
- source_word: ἄξιοι θανάτου
  choice: den Tod verdienen
  rationale: Diese Wendung gibt die gerichtliche Aussage des Griechischen klar und idiomatisch wieder.
- source_word: οὐ μόνον αὐτὰ ποιοῦσιν
  choice: tun sie sie nicht nur selbst
  rationale: „Tun“ entspricht ποιέω; „selbst“ verdeutlicht im Deutschen den Gegensatz zur anschließenden Billigung des Handelns anderer, ohne einen neuen Sachgehalt einzuführen.
- source_word: συνευδοκοῦσιν
  choice: billigen
  rationale: Das Verb bezeichnet zustimmendes Gutheißen oder Einverständnis. „Billigen“ ist präzise, knapp und stärker als bloßes passives Dulden.
- source_word: τοῖς πράσσουσιν
  choice: die, die sie tun
  rationale: Die Wiederholung von „tun“ ist im Deutschen klar und bewahrt den Bezug auf dieselben zuvor genannten Dinge.
theological_decisions:
- issue: Bedeutung von „den Tod verdienen“
  choice: Die Formulierung bleibt eine Aussage über Gottes gerichtliches Urteil, ohne die Art oder Reichweite des Todes näher festzulegen.
  alternative: Die Aussage ausdrücklich auf die irdische Todesstrafe oder ausdrücklich auf den eschatologischen Tod beziehen.
  rationale: Der Vers selbst bestimmt nicht näher, ob ausschließlich eine zivile Strafe, der eschatologische Tod oder eine umfassendere Todeswirklichkeit gemeint ist. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Der Satzbau bleibt nahe an der griechischen Argumentation, wird aber durch die konzessive Eröffnung natürlich gestaltet. Der Fußnotenmarker [a] steht unmittelbar beim betreffenden Ausdruck.
