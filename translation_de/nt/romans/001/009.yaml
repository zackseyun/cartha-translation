revisions:
- from: Denn Gott, dem ich in meinem Geist mit der guten Nachricht von seinem Sohn diene, ist mein Zeuge dafür, dass ich euch unablässig erwähne.[a]
  to: Denn Gott, dem ich in meinem Geist im Dienst an der guten Nachricht seines Sohnes diene, ist mein Zeuge dafür, dass ich euch unablässig erwähne.[a]
  rationale: Die Revision ersetzt die unnötig instrumentale und etwas unnatürliche Verbindung „mit der guten Nachricht“ durch „im Dienst an der guten Nachricht“. Damit wird der Dienst weiterhin eindeutig Gott zugeordnet, während die Rolle des Evangeliums als Bereich bzw. Kontext dieses Dienstes nachvollziehbar wiedergegeben wird. Zugleich bewahrt „seines Sohnes“ die offene Genitivbeziehung. Die Fußnotenmarke bleibt korrekt am Satzende verankert.
  reviewer_model: gpt-5.6-terra
