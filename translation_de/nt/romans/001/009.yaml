source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: de
  text: Denn Gott, dem ich in meinem Geist im Dienst an der guten Nachricht seines Sohnes diene, ist mein Zeuge dafür, dass ich euch unablässig erwähne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass ich unablässig Erwähnung von euch mache“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: Zeuge
  rationale: In der feierlichen Berufung auf Gott bezeichnet das Wort denjenigen, der die Wahrheit von Paulus’ Aussage bezeugt.
- source_word: λατρεύω
  choice: diene
  rationale: Das Verb bezeichnet religiösen Dienst beziehungsweise Verehrung; „diene“ bewahrt den weiten Sinn und klingt im Deutschen natürlich.
- source_word: ἐν τῷ πνεύματί μου
  choice: in meinem Geist
  rationale: Die Wiedergabe bleibt nah an der griechischen Präpositionalphrase und wahrt die mögliche Bedeutung von Bereich oder innerer Haltung, ohne sie auf ein bloßes Mittel festzulegen.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: mit der guten Nachricht
  rationale: Das erste ἐν wird eng an der Form, das zweite zur Vermeidung einer schwerfälligen Doppelung instrumental wiedergegeben; „gute Nachricht“ vermittelt den Wortsinn verständlich.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: von seinem Sohn
  rationale: Die Genitivform bleibt erhalten und legt nicht ausdrücklich fest, ob der Sohn Inhalt, Ursprung oder Bezug der guten Nachricht ist.
- source_word: ἀδιαλείπτως
  choice: unablässig
  rationale: Das Adverb bezeichnet fortgesetzte, nicht nachlassende Regelmäßigkeit und wird prägnant wiedergegeben.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: ich euch erwähne
  rationale: Die griechische Wendung bedeutet wörtlich „Erwähnung von euch machen“; die deutsche Form ist idiomatisch, ohne sie als bloßes Erinnern umzudeuten.
theological_decisions:
- issue: Bedeutung von ἐν τῷ πνεύματί μου
  choice: in meinem Geist
  alternative: mit meinem Geist / von ganzem Herzen
  rationale: Die räumlich beziehungsweise sphärisch klingende Form wahrt die Mehrdeutigkeit des Griechischen und vermeidet eine Festlegung auf Mittel oder innerliche Aufrichtigkeit.
- issue: Wiedergabe von εὐαγγέλιον
  choice: gute Nachricht
  alternative: Evangelium
  rationale: „Gute Nachricht“ erschließt den griechischen Wortsinn unmittelbar; die traditionelle kirchliche Bezeichnung bleibt sachlich mitgemeint.
- issue: Beziehung des Genitivs τοῦ υἱοῦ αὐτοῦ
  choice: von seinem Sohn
  alternative: über seinen Sohn
  rationale: Die formnahe Fassung bewahrt die offene Genitivbeziehung, statt den Sohn ausschließlich als Inhalt der Verkündigung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange Satzbau des Originals bleibt erkennbar, wird aber durch die deutsche Wortstellung gut lesbar gehalten. „Gute Nachricht“ vermeidet unnötige kirchliche Fachsprache; „in meinem Geist“ bewahrt die genuine Auslegungsweite.
