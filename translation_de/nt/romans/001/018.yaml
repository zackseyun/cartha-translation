id: ROM.1.18
reference: Romans 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: de
  text: Denn Gottes Zorn wird vom Himmel her gegen alle Gottlosigkeit und Ungerechtigkeit der Menschen offenbart, die die Wahrheit durch Ungerechtigkeit unterdrücken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die die Wahrheit in Ungerechtigkeit unterdrücken“.'
    reason: lexical_alternative
  - marker: b
    text: „Unterdrücken“ kann hier auch mit „niederhalten“ oder „zurückhalten“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: wird offenbart
  rationale: Das Präsens Passiv wird im Deutschen natürlich mit „wird offenbart“ wiedergegeben; der gegenwärtige beziehungsweise fortdauernde Vorgang bleibt im Kontext erkennbar.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die begründende Verknüpfung mit dem vorausgehenden Gedankengang.
- source_word: ὀργὴ θεοῦ
  choice: Gottes Zorn
  rationale: Die Formulierung gibt den Genitiv direkt wieder und bewahrt den persönlichen sowie richterlichen Gehalt von ὀργή, ohne ihn abzuschwächen.
- source_word: ἀπ’ οὐρανοῦ
  choice: vom Himmel her
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise Ausgangspunkt; „vom Himmel her“ klingt im Deutschen natürlich und präzise.
- source_word: ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν
  choice: gegen alle Gottlosigkeit und Ungerechtigkeit
  rationale: „Gegen“ gibt die feindlich-richterliche Ausrichtung von ἐπί mit Akkusativ im Zusammenhang wieder. „Gottlosigkeit“ und „Ungerechtigkeit“ bewahren die unterschiedlichen, aber verbundenen Begriffe.
- source_word: ἀνθρώπων
  choice: der Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, nicht ausschließlich Männer.
- source_word: τῶν τὴν ἀλήθειαν ... κατεχόντων
  choice: die die Wahrheit ... unterdrücken
  rationale: Das substantivierte Partizip wird als Relativsatz wiedergegeben. „Unterdrücken“ trifft im Kontext das aktive Niederhalten oder Zurückhalten der Wahrheit.
- source_word: ἐν ἀδικίᾳ
  choice: durch Ungerechtigkeit
  rationale: Die instrumentale Deutung als Mittel oder Art und Weise ergibt einen klaren deutschen Satz; die mögliche Bedeutung als Lebens- oder Handlungssphäre bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Ob Gottes Zorn als persönliche richterliche Reaktion oder als unpersönliche moralische Folge wiederzugeben ist
  choice: „Gottes Zorn“ bezeichnet Gottes eigenen, richterlichen Zorn.
  alternative: Eine unpersönliche Folge menschlichen Fehlverhaltens.
  rationale: Die Genitivverbindung ὀργὴ θεοῦ und der paulinische Gedankengang sprechen für eine persönliche göttliche Reaktion. Die Übersetzung bewahrt dieses Gewicht, ohne den Begriff auszudeuten.
- issue: Wie ἐν ἀδικίᾳ mit der Unterdrückung der Wahrheit zusammenhängt
  choice: „durch Ungerechtigkeit“ als Mittel oder Art und Weise
  alternative: „in ihrer Ungerechtigkeit“ als Sphäre oder Zustand
  rationale: Beide Deutungen sind grammatisch möglich. Der Haupttext wählt die im Zusammenhang naheliegende instrumentale Lesart; die alternative sphärische Lesart wird ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der paulinischen Argumentation, bleibt aber gut verständlich. Die Wiederholung von „Ungerechtigkeit“ entspricht der Wiederholung von ἀδικία im griechischen Text und wird bewusst nicht geglättet.
