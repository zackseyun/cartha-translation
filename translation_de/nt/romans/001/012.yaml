base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: de
  text: 'Das heißt: Unter euch möchte ich durch den Glauben, den wir miteinander teilen – euren und meinen –, gemeinsam mit euch ermutigt werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch den Glauben untereinander, euren und meinen“; die Formulierung betont die gegenseitige Ermutigung von Paulus und den Christen in Rom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: Das heißt
  rationale: Die Wendung erläutert und präzisiert die vorausgehende Aussage; „Das heißt“ gibt diese erklärende Funktion natürlich wieder.
- source_word: συμπαρακληθῆναι
  choice: gemeinsam mit euch ermutigt werden
  rationale: Das zusammengesetzte Verb bezeichnet gemeinsames beziehungsweise wechselseitiges Ermutigtwerden. Die Formulierung bewahrt zugleich Paulus als unausgesprochenes Subjekt des Infinitivs und die durch συν- ausgedrückte Gemeinschaftlichkeit.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Präpositionalphrase bezeichnet hier das soziale Umfeld beziehungsweise die Mitte der römischen Christen.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: durch den Glauben, den wir miteinander teilen
  rationale: διά bezeichnet das Mittel; ἐν ἀλλήλοις hebt die Gegenseitigkeit hervor. Die deutsche Formulierung ist verständlich, ohne die Beziehung auf einen bloß abstrakten gemeinsamen Glaubensinhalt zu verengen.
- source_word: πίστεως
  choice: Glauben
  rationale: Im Kontext ist das gläubige Vertrauen von Paulus und den römischen Christen gemeint; „Glauben“ ist die sachlich und sprachlich angemessene Wiedergabe.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: euren und meinen
  rationale: Die paarige Formulierung wahrt die ausgewogene Betonung des Glaubens der Adressaten und des Glaubens des Paulus.
theological_decisions:
- issue: Einseitige apostolische Stärkung oder gegenseitige Ermutigung
  choice: Paulus wird gemeinsam mit den römischen Christen durch den beiderseitigen Glauben ermutigt.
  alternative: Paulus stärkt vor allem die römischen Christen oder ein ausdrückliches pluralisches „wir werden ermutigt“.
  rationale: Das Präfix συν- in συμπαρακληθῆναι und „euren und meinen“ verlangen eine gegenseitige Dimension. Zugleich nennt der griechische Infinitiv kein ausdrückliches pluralisches Subjekt; im Zusammenhang bleibt Paulus die syntaktische Perspektive. Die Übersetzung bewahrt beides.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt „euren und meinen“ als erläuternde Präzisierung hervor. „Gemeinsam mit euch ermutigt werden“ vermeidet sowohl eine unbeholfene Verbindung von singularischem „ich“ mit „gegenseitig“ als auch ein im Griechischen nicht ausdrücklich gesetztes „wir“.
