  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: de
  text: Ebenso gaben auch die Männer[a] den natürlichen geschlechtlichen Verkehr mit der Frau[b] auf und wurden in ihrem Verlangen füreinander entflammt. Männer taten mit Männern das Schändliche[c] und empfingen an sich selbst die gebührende Vergeltung[d] für ihre Verirrung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht ein biologisch markierter Ausdruck: „die Männlichen“; auch: „die männlichen Personen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den natürlichen Gebrauch der weiblichen [Person]“. Auch: „den natürlichen geschlechtlichen Verkehr mit Frauen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „die Schamlosigkeit“ oder „das, was schändlich ist“.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „den gebührenden Lohn“ oder „die entsprechende Vergeltung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: die Männlichen / des Weiblichen
  rationale: Die substantivierten, biologisch markierten Ausdrücke des Griechischen werden bewahrt, statt sie stillschweigend in die stärker sozialen oder relationalen Begriffe „Männer“ und „Frauen“ umzudeuten.
- source_word: ἀφέντες
  choice: gaben ... auf
  rationale: Die deutsche Verbform gibt die dem Hauptgeschehen vorausgehende Handlung natürlich wieder und bewahrt den Sinn des Verlassens beziehungsweise Aufgebens.
- source_word: φυσικὴν χρῆσιν
  choice: den natürlichen Gebrauch
  rationale: „Gebrauch“ entspricht χρῆσις eng; der sexuelle Bezug ergibt sich aus dem Kontext, ohne dass eine im Ausdruck selbst nicht ausdrücklich genannte Beziehungsform ergänzt wird.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: wurden in ihrem Verlangen ... entflammt
  rationale: Die Bildsprache des Verbs und seine passive Form bleiben erhalten. „Verlangen“ gibt ὄρεξις wieder, ohne die Intensität durch „Lust“ unnötig festzulegen.
- source_word: εἰς ἀλλήλους
  choice: füreinander
  rationale: Dies gibt den wechselseitigen Bezug idiomatisch und eindeutig wieder.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: Männliche ... mit Männlichen
  rationale: Die Wiederholung der biologisch markierten Bezeichnung und ihre rhetorische Wirkung werden beibehalten.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: vollzogen ... das Schändliche
  rationale: Die substantivische moralische Wertung des griechischen Ausdrucks bleibt sichtbar, ohne die Handlung genauer zu benennen, als es der Text tut.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: die gebührende Vergeltung
  rationale: Die Formulierung bewahrt sowohl den Gedanken einer entsprechenden Gegenleistung beziehungsweise Folge als auch das in ἔδει ausgedrückte Gebührende.
- source_word: τῆς πλάνης αὐτῶν
  choice: für ihre Verirrung
  rationale: „Verirrung“ hält die mögliche Vorstellung des Abirrens fest und trägt zugleich den Sinn eines Irrtums.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: empfingen an sich selbst
  rationale: Die reflexive Wendung bleibt erhalten, ohne die genaue Art der erfahrenen Folge auszudeuten.
theological_decisions:
- issue: Biologisch markierte Begriffe oder relationale Alltagssprache
  choice: die Männlichen ... des Weiblichen ... Männliche mit Männlichen
  alternative: die Männer ... der Frauen ... Männer mit Männern
  rationale: Der griechische Text verwendet hier ἄρσην und θῆλυ statt der üblichen Bezeichnungen für Mann und Frau. Die ungewöhnliche deutsche Form bewahrt diese bewusste Wortwahl und fügt keine relationale Nuance hinzu.
- issue: Grad der ausdrücklichen moralischen und sexuellen Bestimmung
  choice: das Schändliche
  alternative: homosexuelle Handlungen oder schamlose Taten
  rationale: ἀσχημοσύνη enthält bereits eine moralische Wertung, benennt die Handlung aber nicht mit einer modernen Kategorie. Die Übersetzung erhält die Wertung, ohne sie weiter zu spezifizieren.
- issue: Art der empfangenen Folge
  choice: gebührende Vergeltung
  alternative: verdiente Strafe
  rationale: ἀντιμισθία bezeichnet eine entsprechende Gegenleistung oder Vergeltung. „Strafe“ wäre möglich, würde die Art der Folge jedoch stärker festlegen, als der Ausdruck allein verlangt.
translation_notes:
  register: Bewusst würdiger, quellennaher Stil. Die ungewöhnlichen substantivierten Formen „die Männlichen“ und „das Weibliche“ spiegeln die auffällige biologische Terminologie des griechischen Textes; Fußnoten bieten geläufigere deutsche Alternativen. Die Satzstruktur wurde für modernes Deutsch leicht gegliedert, ohne die Abfolge der Aussagen oder ihre theologische Spannung aufzulösen.
