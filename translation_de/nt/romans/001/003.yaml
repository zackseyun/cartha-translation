id: ROM.1.3
reference: Romans 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: de
  text: über seinen Sohn, der dem Fleisch nach aus der Nachkommenschaft Davids hervorgegangen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dem Fleisch nach“ bezeichnet hier die menschliche Abstammung beziehungsweise irdische Herkunft, nicht eine sündige Natur.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: über
  rationale: περί führt hier den Inhalt des zuvor erwähnten Evangeliums ein; „über“ ist im modernen Deutschen natürlich und präzise.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: seinen Sohn
  rationale: Die Wendung bezeichnet ausdrücklich Gottes Sohn. Die Großschreibung folgt der üblichen deutschen Schreibung für die christologische Bezeichnung.
- source_word: τοῦ γενομένου
  choice: der … hervorgegangen ist
  rationale: Das Partizip von γίνομαι bezeichnet hier Herkunft beziehungsweise Eintritt in eine geschichtliche Abstammungslinie. „Hervorgegangen ist“ bewahrt die verbale Aussage, ohne sie auf „geboren“ zu verengen.
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: aus der Nachkommenschaft Davids
  rationale: σπέρμα bedeutet wörtlich „Same“, bezeichnet hier aber Davids Nachkommenschaft beziehungsweise Abstammungslinie. Die gewählte Formulierung ist im Deutschen klar und würdig.
- source_word: κατὰ σάρκα
  choice: dem Fleisch nach
  rationale: Die formnahe Wiedergabe erhält den theologisch gewichtigen und potenziell mehrdeutigen Begriff σάρξ, statt ihn im Haupttext deutend als „menschlicher Abstammung nach“ aufzulösen.
theological_decisions:
- issue: Verhältnis von Gottessohnschaft und davidischer Abstammung
  choice: 'Beide Aussagen bleiben unverkürzt nebeneinander stehen: „seinen Sohn“ und „dem Fleisch nach aus der Nachkommenschaft Davids hervorgegangen“.'
  alternative: „seinen Sohn, der seiner menschlichen Natur nach von David abstammte“
  rationale: Der griechische Text verbindet Gottessohnschaft und wirkliche menschliche, davidische Herkunft, ohne ihr Verhältnis metaphysisch zu erklären. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von κατὰ σάρκα
  choice: „dem Fleisch nach“ im Haupttext, mit erläuternder Fußnote
  alternative: „seiner menschlichen Abstammung nach“
  rationale: Die formnahe Wendung wahrt die paulinische Begrifflichkeit; die Fußnote verhindert zugleich das Missverständnis, hier sei eine sündige Natur gemeint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt als abhängige Fortsetzung von Römer 1,1–2 offen; der abschließende Punkt dient hier nur der Darstellung des Einzelverses.
