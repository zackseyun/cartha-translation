  source_fidelity: Die Übersetzung gibt περὶ τοῦ υἱοῦ αὐτοῦ sachgerecht als „über seinen Sohn“ wieder und wahrt die christologische Bezugnahme durch die Großschreibung. „Der dem Fleisch nach aus der Nachkommenschaft Davids hervorgegangen ist“ bildet τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα vollständig ab. Insbesondere bleibt κατὰ σάρκα formnah erhalten, ohne die Aussage im Haupttext dogmatisch aufzulösen.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch und funktioniert angemessen als Fortsetzung des Satzes aus Römer 1,1–2. „Aus der Nachkommenschaft Davids hervorgegangen“ ist leicht gehoben, aber klar und für den biblischen Register passend.
  terminology: „Sohn“, „dem Fleisch nach“ und „Nachkommenschaft Davids“ sind terminologisch tragfähig. Die Fußnote erläutert die hier gemeinte menschlich-genealogische Dimension von „Fleisch“, ohne den griechischen Ausdruck im Haupttext zu ersetzen oder eine konfessionelle Deutung einzutragen.
