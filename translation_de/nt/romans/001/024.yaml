    issue: „untereinander“ verengt ἐν αὐτοῖς und ist in Verbindung mit „ihre Körper“ missverständlich.
    rationale: ἐν αὐτοῖς kann einen wechselseitigen, gruppenbezogenen oder reflexiven Bezug haben. „Untereinander“ bevorzugt die erste Möglichkeit; „ihre Körper untereinander entehrt“ kann zudem semantisch so wirken, als bezögen sich die Körper wechselseitig aufeinander. Die Hauptfassung soll die knappe Mehrdeutigkeit nicht unnötig entscheiden.
  revised_text: Darum hat Gott sie in den Begierden ihrer Herzen der Unreinheit preisgegeben, zur Entehrung ihrer Körper unter ihnen.[a]
