id: ROM.1.24
reference: Romans 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: de
  text: Darum hat Gott sie in den Begierden ihrer Herzen der Unreinheit preisgegeben, zur Entehrung ihrer Körper unter ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „untereinander“; möglicherweise: „an sich selbst“.'
    reason: Die Wendung ἐν αὐτοῖς ist syntaktisch knapp und kann wechselseitig, gruppenbezogen oder reflexiv verstanden werden.
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorhergehenden Gedankengang und stellt den logischen Zusammenhang knapp und natürlich her.
- source_word: παρέδωκεν
  choice: hat … preisgegeben
  rationale: Gibt das Ausliefern an eine beherrschende Macht oder einen Zustand wieder und bewahrt den ernsten, gerichtlichen Beiklang, ohne ihn dogmatisch auszuformulieren.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: in den Begierden ihrer Herzen
  rationale: Bewahrt die Präposition und lässt die Wendung als Bereich beziehungsweise wirksamen Zusammenhang der Preisgabe offen.
- source_word: ἐπιθυμίαις
  choice: Begierden
  rationale: Bezeichnet starke, ungeordnete Wünsche, ohne den Ausdruck hier bereits ausschließlich auf sexuelles Verlangen einzuengen.
- source_word: καρδιῶν
  choice: Herzen
  rationale: Bewahrt die biblisch-anthropologische Ausdrucksweise und ist im Deutschen verständlich und geläufig.
- source_word: ἀκαθαρσίαν
  choice: Unreinheit
  rationale: Gibt die moralische Unreinheit präzise wieder und bewahrt zugleich die biblische Begrifflichkeit.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: sodass … entehrt wurden
  rationale: Gibt den resultativen Sinn der Genitiv-Infinitiv-Konstruktion in natürlichem Deutsch wieder; eine substantivische Fassung wäre zwar formnäher, aber deutlich schwerfälliger.
- source_word: τὰ σώματα αὐτῶν
  choice: ihre Körper
  rationale: Bewahrt den konkreten körperlichen Bezug des griechischen Ausdrucks.
- source_word: ἐν αὐτοῖς
  choice: untereinander
  rationale: Gibt im Zusammenhang am ehesten den wechselseitigen beziehungsweise sozialen Sinn wieder; die knappe griechische Formulierung bleibt jedoch mehrdeutig.
theological_decisions:
- issue: Ob παρέδωκεν durch eine ausdrückliche Deutung wie „verließ sie im Gericht“ verstärkt werden soll
  choice: hat … preisgegeben
  alternative: hat sie verlassen; hat sie zur Strafe ausgeliefert
  rationale: Der Text spricht deutlich von Gottes Preisgabe, formuliert aber keine solche systematisch-theologische Erläuterung. Die Übersetzung bewahrt das Gewicht und die Spannung der Aussage.
- issue: Verhältnis von Gottes Preisgabe und der Entehrung der Körper
  choice: sodass ihre Körper … entehrt wurden
  alternative: zur Entehrung ihrer Körper
  rationale: Die resultative Wiedergabe ist im modernen Deutsch natürlich und lässt offen, wie Zweck und Folge innerhalb der griechischen Infinitivkonstruktion genau zu gewichten sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Begierden“, „Herzen“ und „Unreinheit“ bewahren die biblische Begriffswelt, bleiben aber für heutige Leser verständlich. Die Satzstruktur ist gegenüber dem Griechischen leicht geglättet, ohne die theologische Spannung zu erklären oder abzuschwächen.
