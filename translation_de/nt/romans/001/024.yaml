  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Διό als Folgerung, Gottes Preisgabe, die Begierden der Herzen, Unreinheit und die Entehrung der Körper. „Untereinander“ legt für ἐν αὐτοῖς jedoch stärker einen wechselseitigen Sinn fest, als die knappe griechische Wendung zwingend hergibt. Außerdem kann die deutsche Formulierung „ihre Körper untereinander entehrt“ nahelegen, die Körper selbst handelten wechselseitig.'
  naturalness: „Darum hat Gott sie … preisgegeben“ ist modernes, würdiges Standarddeutsch. Die nominale Wendung „zur Entehrung ihrer Körper unter ihnen“ ist etwas dichter, bildet aber die Konstruktion τοῦ ἀτιμάζεσθαι besser ab und vermeidet die missverständliche Anbindung von „untereinander“ an „Körper“.
  terminology: „Begierden“, „Herzen“, „Unreinheit“, „preisgegeben“ und „Körper“ sind angemessen, verständlich und begrifflich quellentreu. Keine dogmatische Verstärkung ist nötig.
  issues:
