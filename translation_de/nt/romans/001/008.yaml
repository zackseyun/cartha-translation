id: ROM.1.8
reference: Romans 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: de
  text: Zunächst danke ich meinem Gott durch Jesus, den Messias,[a] für euch alle, weil euer Glaube[b] in der ganzen Welt verkündet wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Jesus Christus.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: eure Treue; möglicherweise auch: euer Vertrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Zunächst
  rationale: Kennzeichnet den Beginn von Paulus’ Ausführungen. Das μὲν wird im natürlichen Deutschen in „zunächst“ mitaufgenommen, ohne dass ein ausdrücklich folgendes „zweitens“ vorausgesetzt wird.
- source_word: εὐχαριστῶ
  choice: danke ich
  rationale: Gibt den persönlichen Dank unmittelbar und in natürlichem Deutsch wieder.
- source_word: τῷ θεῷ μου
  choice: meinem Gott
  rationale: Bewahrt die Possessivkonstruktion und den persönlichen Andachtston des Paulus.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: διά mit dem Genitiv bezeichnet hier Vermittlung und wird daher mit „durch“ wiedergegeben. Χριστός wird als Titel bedeutungsorientiert mit „Messias“ übersetzt; die Apposition steht nach „durch“ idiomatisch im Akkusativ.
- source_word: περὶ πάντων ὑμῶν
  choice: für euch alle
  rationale: Im Zusammenhang des Dankens ist περί idiomatisch mit „für“ wiederzugeben; „euch alle“ bewahrt die umfassende Aussage.
- source_word: ἡ πίστις ὑμῶν
  choice: euer Glaube
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe für πίστις und bezeichnet den weithin bekannt gewordenen Glauben der römischen Christen. Mögliche Nuancen werden in einer Fußnote offengehalten.
- source_word: καταγγέλλεται
  choice: verkündet wird
  rationale: Bewahrt das Passiv und den öffentlichen Charakter des Bekanntmachens; die Präsensform lässt den Vorgang als gegenwärtig beziehungsweise fortdauernd erscheinen.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: in der ganzen Welt
  rationale: Gibt die rhetorisch weit gespannte Reichweite der Aussage knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in διὰ Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Χριστός ist ein christologischer Titel. „Messias“ macht dessen Bedeutung im Deutschen sichtbar; die traditionelle Form „Christus“ bleibt als Alternative in der Fußnote erhalten.
- issue: Wiedergabe von πίστις in ἡ πίστις ὑμῶν
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: Im Kontext passt „Glaube“ am besten zu der weithin bekannt gewordenen gläubigen Antwort der Adressaten. Da πίστις auch „Treue“ oder „Vertrauen“ bezeichnen kann, werden diese Bedeutungsnuancen nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne im Deutschen schwerfällig zu wirken. „Zunächst“ ist als natürlicher Diskursauftakt gewählt; „verkündet wird“ bewahrt Passiv und öffentlichen Aussagecharakter.
