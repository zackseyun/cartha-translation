id: ROM.1.28
reference: Romans 1:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: de
  text: Und ebenso wie sie es nicht für richtig hielten, Gott in ihrer Erkenntnis festzuhalten[a], gab Gott sie einem untauglichen Denken preis[b], sodass sie tun, was sich nicht gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott in ihrer Erkenntnis zu haben«; auch: »Gott anzuerkennen«.'
    reason: Die griechische Wendung kann stärker bildhaft oder idiomatisch verstanden werden.
  - marker: b
    text: 'Oder: »einem verdorbenen Sinn«. Das griechische Wort bezeichnet etwas, das die Prüfung nicht besteht oder sich als untauglich erweist; im Griechischen nimmt es das Wortfeld von »für richtig hielten« wieder auf.'
    reason: Die Bedeutungsbreite und das Wortspiel zwischen ἐδοκίμασαν und ἀδόκιμον lassen sich im Deutschen nicht vollständig zugleich wiedergeben.
lexical_decisions:
- source_word: καθὼς
  choice: ebenso, wie
  rationale: Die Wiedergabe erhält den vergleichenden Zusammenhang zwischen ihrer Weigerung und Gottes entsprechendem Gericht; eine kausale Deutung mit »weil« bleibt sinngemäß möglich.
- source_word: ἐδοκίμασαν
  choice: sie hielten es für richtig
  rationale: δοκιμάζω bezeichnet hier ein prüfendes Gutheißen. Die Formulierung ist im modernen Deutsch natürlich und lässt die wertende Weigerung erkennen.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: in ihrer Erkenntnis festzuhalten
  rationale: Die Wendung bewahrt das Bild, Gott im Bereich ihrer Erkenntnis zu haben beziehungsweise zu behalten, und vermeidet die stärkere interpretierende Verkürzung auf bloßes »anerkennen«.
- source_word: παρέδωκεν
  choice: gab sie … preis
  rationale: »Preisgeben« gibt den gerichtlichen Sinn der wiederholten Übergabeformel im Kontext klar und idiomatisch wieder.
- source_word: ἀδόκιμον νοῦν
  choice: einem untauglichen Denken
  rationale: ἀδόκιμος bezeichnet, was sich bei der Prüfung nicht bewährt beziehungsweise ungeeignet ist. »Untauglich« vermeidet die theologisch stärker aufgeladenen Wörter »verworfen« oder »verdorben«; »Denken« gibt νοῦς hier natürlich wieder.
- source_word: ποιεῖν
  choice: sodass sie tun
  rationale: Der Infinitiv kann Folge oder Zweck ausdrücken. »Sodass« macht im Deutschen die resultative Beziehung zum Preisgeben verständlich, ohne eine ausschließliche Zweckdeutung festzulegen.
- source_word: τὰ μὴ καθήκοντα
  choice: was sich nicht gehört
  rationale: Die geläufige deutsche Wendung gibt das moralisch Unangemessene und Ungehörige von μὴ καθήκοντα prägnant wieder.
theological_decisions:
- issue: Gerichtlicher Charakter von Gottes Preisgabe
  choice: gab Gott sie … preis
  alternative: überließ Gott sie
  rationale: Die aktive Form wahrt Gottes Handeln im Text, ohne über den Vers hinaus zu bestimmen, wie dieses Gericht metaphysisch zu verstehen ist.
- issue: Stärke der Aussage ἀδόκιμον νοῦν
  choice: untaugliches Denken
  alternative: verdorbener Sinn; verworfener Sinn
  rationale: Die gewählte Form bleibt nahe an der Vorstellung des Nichtbestehens einer Prüfung und vermeidet, spätere dogmatische Terminologie in den Ausdruck einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »In ihrer Erkenntnis festzuhalten« hält bewusst etwas von der ungewöhnlichen Bildlichkeit des griechischen Ausdrucks fest; »was sich nicht gehört« sorgt am Versende für klare Alltagssprache. Die Satzstruktur bewahrt die Entsprechung von menschlicher Weigerung und göttlicher Preisgabe.
