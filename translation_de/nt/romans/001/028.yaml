  naturalness: Der Satz ist modernes Standarddeutsch und insgesamt gut lesbar. Bei der festen vergleichenden Verbindung »ebenso wie« steht jedoch kein Komma zwischen »ebenso« und »wie«. Die Korrektur verbessert die standardsprachliche Zeichensetzung, ohne Bedeutung oder Register zu verändern.
  terminology: '»Preisgeben«, »Erkenntnis«, »untaugliches Denken« und »was sich nicht gehört« sind im Kontext verständlich und angemessen. Die Fußnote zu b sollte das griechische lexikalische Verhältnis präziser beschreiben: Nicht die deutschen Worte klängen unmittelbar aneinander an; vielmehr besteht der Anklang beziehungsweise das Wortspiel im Griechischen.'
