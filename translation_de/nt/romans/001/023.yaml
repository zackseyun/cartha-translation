id: ROM.1.23
reference: Romans 1:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: de
  text: und vertauschten die Herrlichkeit des unvergänglichen Gottes gegen Abbilder eines vergänglichen Menschen, von Vögeln, vierfüßigen Tieren und Kriechtieren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „gegen die Ähnlichkeit eines Bildes eines vergänglichen Menschen und von Vögeln, Vierfüßern und Kriechtieren“.'
    reason: Die griechische Wendung ἐν ὁμοιώματι εἰκόνος verbindet und verdichtet Begriffe für Ähnlichkeit und Bild; die Hauptfassung gibt dies idiomatisch als „Abbilder“ wieder.
lexical_decisions:
- source_word: ἤλλαξαν
  choice: vertauschten … mit
  rationale: Die deutsche Konstruktion „etwas mit etwas vertauschen“ gibt die bewusste Ersetzung wieder und entspricht dem durch ἐν bezeichneten Austauschgegenstand.
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die sachlich und theologisch angemessene Wiedergabe und bewahrt den Gegensatz zwischen Gottes Wesen und den geschaffenen Abbildern.
- source_word: ἀφθάρτου
  choice: unvergänglich
  rationale: Die Wahl bildet den ausdrücklichen Gegensatz zu φθαρτοῦ ab und bezeichnet, dass Gott keinem Verfall unterliegt.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: mit dem Abbild … und mit Darstellungen
  rationale: „Abbild“ bewahrt die Bildsprache der griechischen Wortgruppe, während die koordinierte Fortführung im Deutschen verständlich macht, dass auch die folgenden Tierarten Gegenstände bildlicher Darstellung sind. Die ungewöhnliche Verdichtung des Griechischen wird in der Fußnote sichtbar gehalten.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: eines vergänglichen Menschen
  rationale: „Vergänglich“ erhält den lexikalischen Gegensatz zu „unvergänglich“; „Mensch“ gibt den generischen Singular ἀνθρώπου natürlich und inklusiv wieder.
- source_word: πετεινῶν
  choice: Vögeln
  rationale: „Vögel“ ist die klare und natürliche deutsche Entsprechung.
- source_word: τετραπόδων
  choice: vierfüßigen Tieren
  rationale: Die Formulierung gibt die wörtliche Bedeutung verständlich wieder, ohne das fachsprachliche „Vierfüßer“ zu erzwingen.
- source_word: ἑρπετῶν
  choice: Kriechtieren
  rationale: „Kriechtiere“ wahrt die anschauliche Bedeutung von ἑρπετά und ist hier weniger eng als die moderne zoologische Kategorie „Reptilien“.
theological_decisions:
- issue: Gegensatz zwischen Schöpfer und vergänglichen Geschöpfen
  choice: „unvergänglichen Gottes“ gegenüber „vergänglichen Menschen“
  alternative: „unsterblichen Gottes“ gegenüber „sterblichen Menschen“
  rationale: Die gewählte Wortwiederholung bildet den griechischen Gegensatz ἀφθάρτου/φθαρτοῦ genauer ab und beschränkt ihn nicht auf Sterblichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung des vorhergehenden Zusammenhangs mit „und“ eröffnet. Die Hauptfassung vermeidet sowohl altertümliches „unverweslich“ als auch eine zoologisch zu enge Wiedergabe von ἑρπετά.
