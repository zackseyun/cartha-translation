  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: de
  text: Denn als ihr Sklaven der Sünde wart, wart ihr in Bezug auf die Gerechtigkeit frei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Gerechtigkeit frei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Der Ausdruck bezeichnet hier eine bindende Herrschaftsbeziehung. „Sklaven“ bewahrt den scharfen Gegensatz zwischen den beiden Herrschaften in Römer 6.
- source_word: τῆς ἁμαρτίας
  choice: der Sünde
  rationale: Der Genitiv stellt die Sünde als Herrin dar, der die Angesprochenen als Sklaven gehörten.
- source_word: ἐλεύθεροι
  choice: frei
  rationale: '„Frei“ erhält die zugespitzte, ironische Aussage: Unter der Herrschaft der Sünde waren sie der Gerechtigkeit gegenüber frei.'
- source_word: τῇ δικαιοσύνῃ
  choice: gegenüber der Gerechtigkeit
  rationale: Die Formulierung gibt den Dativ als Beziehung bzw. Hinsicht wieder und klingt im modernen Deutschen natürlich, ohne Gerechtigkeit ausdrücklich als unterdrückende Macht darzustellen.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorausgehenden Gedankengang.
theological_decisions:
- issue: Verhältnis zur Gerechtigkeit in Paulus’ Gegenüberstellung
  choice: frei gegenüber der Gerechtigkeit
  alternative: frei von der Gerechtigkeit
  rationale: Die gewählte Fassung bewahrt die Spannung des griechischen Dativs und Paulus’ zugespitzten Gegensatz, ohne die Beziehung eindeutiger als Trennung zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sklaven“ ist bewusst stärker als „Diener“ und entspricht dem Bild rivalisierender Herrschaftsverhältnisse im Zusammenhang.
