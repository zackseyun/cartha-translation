source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: de
  text: So haltet auch ihr euch der Sünde gegenüber für tot, Gott gegenüber aber für lebendig im Messias Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: So … auch
  rationale: Bewahrt den folgernden Rückbezug auf das Vorhergehende und klingt im Deutschen natürlich.
- source_word: λογίζεσθε
  choice: betrachtet
  rationale: Gibt die Aufforderung wieder, sich als etwas anzusehen beziehungsweise dafür zu halten, ohne sie auf bloßes Nachdenken zu reduzieren.
- source_word: ἑαυτοὺς εἶναι
  choice: euch als …
  rationale: Die deutsche Konstruktion „sich als … betrachten“ gibt das reflexive Pronomen und den infinitivischen Aussagegehalt idiomatisch wieder.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: für die Sünde tot
  rationale: „Für“ drückt hier die Beziehung zur Sünde verständlich aus; der Kontrast von μέν und δέ wird durch „aber“ getragen.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: für Gott aber lebendig
  rationale: Bewahrt die antithetische Entsprechung zu „tot“ und gibt den Dativ τῷ θεῷ als Beziehung zu Gott wieder.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: „Im“ bewahrt die paulinische ἐν-Formulierung und ihre mögliche Sphären- beziehungsweise Verbundenheitsbedeutung; Χριστός wird als Titel „Messias“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστῷ als Titel oder nameähnliche Bezeichnung
  choice: Messias
  alternative: Christus
  rationale: Χριστός behält hier erkennbaren Titelcharakter; „Messias“ macht diesen Gehalt transparent, ohne die Aussage weiter auszulegen.
- issue: Bedeutung von ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: durch den Messias Jesus
  rationale: Die örtlich-sphärische Formulierung wird bewahrt, damit die mögliche Aussage über Verbundenheit mit beziehungsweise Sein im Messias nicht kausal oder instrumental vereindeutigt wird.
- issue: Verhältnis zur Sünde und zu Gott in den Dativen
  choice: für die Sünde tot, für Gott aber lebendig
  alternative: der Sünde gegenüber tot, Gott aber lebend
  rationale: Die knappe relationale Gegenüberstellung bleibt erhalten; es wird nicht näher festgelegt, ob die Dative primär Beziehung, Hinsicht oder Zugehörigkeit ausdrücken.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche, aber theologisch wichtige Formulierung „im Messias Jesus“ bleibt erhalten. Der Imperativ richtet sich ausdrücklich an die Adressaten selbst.
