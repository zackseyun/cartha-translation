revisions:
- from: So betrachtet auch ihr euch als für die Sünde tot, für Gott aber lebendig im Messias Jesus.[a]
  to: So haltet auch ihr euch der Sünde gegenüber für tot, Gott gegenüber aber für lebendig im Messias Jesus.
  rationale: Die Revision ersetzt die im Deutschen unklare Präposition „für“ bei den beiden griechischen Dativen durch die idiomatische relationale Wendung „gegenüber“. Der Imperativ λογίζεσθε bleibt mit „haltet ... euch ... für“ direkt erhalten, der Kontrast μὲν ... δὲ durch „aber“, und die nicht weiter ausgedeutete ἐν-Formulierung durch „im Messias Jesus“. Die irreführende Fußnote wird entfernt.
  reviewer_model: gpt-5.6-terra
