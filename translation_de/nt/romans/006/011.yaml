    issue: Unidiomatische und potenziell missverständliche Wiedergabe der Dativergänzungen mit „für“.
    rationale: τῇ ἁμαρτίᾳ und τῷ θεῷ bezeichnen hier die Bezugsrelation. „Der Sünde gegenüber ... Gott gegenüber“ bewahrt diese Relation ohne eine Zweck- oder Vorteilsbedeutung nahezulegen.
  - severity: low
    issue: Die Fußnote bezeichnet eine freie und zugleich unnatürliche Formulierung als „wörtlich“.
    rationale: „Haltet euch für tot für die Sünde“ ist keine wörtliche deutsche Entsprechung und bietet keinen hilfreichen lexikalischen Alternativtext.
  revised_text: So haltet auch ihr euch der Sünde gegenüber für tot, Gott gegenüber aber für lebendig im Messias Jesus.
