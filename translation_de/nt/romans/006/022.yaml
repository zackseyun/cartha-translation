review_pass:
  verdict: revise
  source_fidelity: 'Die Grundentscheidungen sind zutreffend: der starke Kontrast von νυνὶ δέ, die passive Befreiung von der Sünde, das ungemilderte Sklavenbild gegenüber Gott, ἁγιασμός als „Heiligung“ und ζωὴ αἰώνιος als „ewiges Leben“ sind angemessen wiedergegeben. Die finite Umformung „Ihr bringt ... hervor“ entfernt jedoch die explizite Aussage ἔχετε („ihr habt“) und lockert die syntaktische Verknüpfung der beiden Partizipien mit der Hauptaussage. Eine näher am Griechischen bleibende, dennoch natürliche deutsche Konstruktion ist sicher möglich.'
  naturalness: „Doch jetzt, von der Sünde befreit und zu Sklaven Gottes gemacht, habt ihr eure Frucht, die zur Heiligung führt, und als Ende ewiges Leben“ ist modernes, würdevolles Standarddeutsch. Die Fruchtmetapher bleibt verständlich; „als Ende“ bildet die knappe, resultative Schlusswendung des griechischen Textes ab.
  terminology: '„Sünde“, „Sklaven Gottes“, „Heiligung“ und „ewiges Leben“ sind terminologisch sachgerecht. Die Alternative zu ἁγιασμός sollte nicht „die Heiligkeit hervorbringt“ lauten, da dies die Relation verändert: Die Frucht führt zur Heiligung, nicht die Heiligkeit wird hervorgebracht. „Heiligkeit“ ist als Alternativbegriff möglich. Für τέλος ist „Ziel“ als Fußnotenalternative passend.'
  issues:
  - severity: medium
    issue: Die Hauptaussage ἔχετε wird als „Ihr bringt ... Frucht hervor“ wiedergegeben.
    rationale: ἔχετε bedeutet „ihr habt“. „Frucht hervorbringen“ ist zwar idiomatisch, verschiebt aber die Aussage von vorhandenem Ertrag zu dessen Hervorbringen und löst die griechische Partizipialkonstruktion auf.
  - severity: medium
    issue: Fußnote a verändert die Aussagebeziehung von εἰς ἁγιασμόν.
    rationale: „die Heiligkeit hervorbringt“ macht die Heiligkeit zum hervorgebrachten Objekt. Der griechische Ausdruck bezeichnet dagegen die auf Heiligung beziehungsweise Heiligkeit gerichtete Frucht bzw. deren Ergebnis.
  - severity: low
    issue: Die Fußnote zu τέλος paraphrasiert den ganzen Schlusssatz statt eine unmittelbare lexikalische Alternative zu dokumentieren.
    rationale: „Ziel“ ist eine direkte, im Kontext tragfähige Alternative zu „Ende“ und entspricht dem angegebenen Übersetzungsentscheid besser.
  revised_text: Doch jetzt, von der Sünde befreit und zu Sklaven Gottes gemacht, habt ihr eure Frucht, die zur Heiligung führt[a], und als Ende ewiges Leben[b].
  revised_footnotes:
