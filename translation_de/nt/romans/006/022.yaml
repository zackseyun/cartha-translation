revisions:
- from: Doch jetzt seid ihr von der Sünde befreit und zu Sklaven Gottes gemacht worden. Ihr bringt nun Frucht hervor, die zur Heiligung führt[a], und das Ziel ist ewiges Leben[b].
  to: Doch jetzt, von der Sünde befreit und zu Sklaven Gottes gemacht, habt ihr eure Frucht, die zur Heiligung führt[a], und als Ende ewiges Leben[b].
  rationale: Die Revision bewahrt die passive, vorzeitige Partizipialstruktur und die Hauptaussage „ihr habt“ genauer. Sie erhält zugleich die starke Metapher und formuliert die Zielrichtung von εἰς ἁγιασμόν verständlich. Die Fußnoten werden auf echte, bedeutungsgleiche lexikalische Alternativen ausgerichtet.
  reviewer_model: gpt-5.6-terra
