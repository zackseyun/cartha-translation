  variant: modern standard German
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: de
  text: Doch jetzt, von der Sünde befreit und zu Sklaven Gottes gemacht, habt ihr eure Frucht, die zur Heiligung führt[a], und als Ende ewiges Leben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die zur Heiligkeit führt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Ziel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Doch jetzt
  rationale: Gibt den deutlichen Gegensatz zum früheren Zustand knapp und natürlich wieder.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: von der Sünde befreit
  rationale: Bewahrt den passiven, als vollzogen dargestellten Befreiungsakt und die Sünde als beherrschende Macht.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: zu Sklaven Gottes gemacht worden
  rationale: Erhält sowohl das Passiv als auch das bewusst starke Sklavenbild, das den Gegensatz zur Sklaverei unter der Sünde trägt.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: Ihr bringt nun Frucht hervor
  rationale: Bewahrt das Fruchtbild, formuliert die im Deutschen sonst schwer verständliche Wendung „eure Frucht haben“ jedoch idiomatisch.
- source_word: εἰς ἁγιασμόν
  choice: die zur Heiligung führt
  rationale: Gibt die Ziel- oder Ergebnisrichtung von εἰς wieder; „Heiligung“ bewahrt die mögliche Prozessbedeutung von ἁγιασμός.
- source_word: τὸ δὲ τέλος
  choice: und das Ziel ist
  rationale: τέλος bezeichnet hier den abschließenden Zielpunkt beziehungsweise Ausgang; „Ziel“ hält die Endperspektive fest, ohne bloße Beendigung nahezulegen.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Die etablierte und genaue deutsche Wiedergabe der eschatologisch gewichtigen Wendung.
theological_decisions:
- issue: Sklavenbild in der Beziehung zu Gott
  choice: zu Sklaven Gottes gemacht worden
  alternative: in den Dienst Gottes gestellt worden
  rationale: Paulus stellt die frühere Bindung an die Sünde einer neuen Herrschaftszugehörigkeit gegenüber. Eine Abschwächung zu bloßem Dienst würde die Härte und Spannung des Bildes mindern.
- issue: Bedeutung von ἁγιασμός
  choice: Heiligung
  alternative: Heiligkeit
  rationale: Der Kontext lässt sowohl den Vorgang als auch das Ergebnis des Heiligwerdens anklingen. „Heiligung“ steht im Haupttext; die statischere Ergebnisnuance wird als Alternative dokumentiert.
- issue: Bedeutung von τέλος
  choice: Ziel
  alternative: Ende
  rationale: „Ziel“ macht den resultativen Endpunkt im Zusammenhang verständlich, während „Ende“ die formal nähere und weiterhin mögliche Wiedergabe bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das starke Sklavenbild bleibt erhalten; Satzbau und Fruchtmetapher werden zugleich so formuliert, dass der Vers für heutige Leser unmittelbar verständlich ist.
