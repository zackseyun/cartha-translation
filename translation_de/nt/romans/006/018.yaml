  verdict: approve
  source_fidelity: 'Die Übersetzung gibt beide passiven Verbformen zutreffend wieder: Das vorzeitige aoristische Passivpartizip ἐλευθερωθέντες wird mit „Von der Sünde befreit“ knapp und idiomatisch erfasst, und ἐδουλώθητε mit „wurdet ihr zu Sklaven … gemacht“ wahrt die passive Übertragung in ein Sklavenverhältnis. „der Gerechtigkeit“ bildet den Dativ τῇ δικαιοσύνῃ angemessen als neue Zugehörigkeit bzw. Herrschaftsbeziehung ab. Das nicht ausdrücklich wiedergegebene δέ ist lediglich fortführend und im deutschen Satzfluss ausreichend berücksichtigt.'
  naturalness: „Von der Sünde befreit, wurdet ihr zu Sklaven der Gerechtigkeit gemacht“ ist modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Die partizipiale Eröffnung ist knapp, aber nicht künstlich.
  terminology: „Sünde“, „Sklaven“ und „Gerechtigkeit“ sind kontextgerecht. Insbesondere wird die prägnante und absichtlich spannungsvolle δουλόω-Metapher nicht durch eine mildere Dienstformulierung abgeschwächt. Für δικαιοσύνη ist „Gerechtigkeit“ im Deutschen die etablierte, ausreichend weite Entsprechung; eine Fußnote zu „justice“ ergibt hier keinen eigenständigen deutschen lexikalischen Gewinn.
