id: ROM.6.18
reference: Romans 6:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: de
  text: Von der Sünde befreit, wurdet ihr zu Sklaven der Gerechtigkeit gemacht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: von der Sünde befreit
  rationale: Das aoristische Passivpartizip bezeichnet eine empfangene, als abgeschlossen dargestellte Befreiung. Die knappe Partizipialkonstruktion bewahrt Form und Sinn des griechischen Ausdrucks.
- source_word: δὲ
  choice: durch den deutschen Satzzusammenhang wiedergegeben
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort. Ein ausdrückliches „aber“ würde den Gegensatz im Deutschen zu stark markieren; die asyndetische Fortführung ist natürlich und lässt den Zusammenhang erkennen.
- source_word: ἁμαρτίας
  choice: Sünde
  rationale: Der Singular mit Artikel bezeichnet in diesem Abschnitt die Sünde zugleich als Wirklichkeit und als herrschende Macht. „Sünde“ bewahrt beide Aspekte.
- source_word: ἐδουλώθητε
  choice: wurdet ihr zu Sklaven … gemacht
  rationale: Die passive Form von δουλόω und das drastische Sklavereibild werden ausdrücklich bewahrt und nicht zu „dienen“ oder „sich verpflichten“ abgeschwächt.
- source_word: δικαιοσύνῃ
  choice: der Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Entsprechung und kann sowohl moralische Richtigkeit als auch rechtlich-forensische und gemeinschaftsbezogene Aspekte umfassen. Der Dativ bezeichnet hier die neue Herrschaftszugehörigkeit.
theological_decisions:
- issue: Wiedergabe des Sklavereibildes
  choice: zu Sklaven der Gerechtigkeit gemacht
  alternative: in den Dienst der Gerechtigkeit gestellt
  rationale: Paulus beschreibt einen scharfen Wechsel der Herrschaft. Die gewählte Fassung erhält das anstößige und theologisch bedeutsame Bild, ohne es durch eine mildere Dienstmetapher zu ersetzen.
- issue: Verhältnis von Befreiung und neuer Bindung
  choice: beide Aussagen ohne erklärenden Zusatz nebeneinander stehen lassen
  alternative: die neue Bindung als freiwillige Verpflichtung erläutern
  rationale: Der Vers hält Befreiung von der Sünde und Versklavung an die Gerechtigkeit bewusst in Spannung. Die Übersetzung löst diese Spannung nicht durch eine zusätzliche Deutung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist bewusst knapp und erhält sowohl die passive Perspektive als auch die Härte des paulinischen Sklavereibildes.
