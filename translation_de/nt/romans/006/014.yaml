id: ROM.6.14
reference: Romans 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: de
  text: Denn die Sünde wird nicht über euch herrschen[a]; denn ihr seid nicht unter dem Gesetz, sondern unter der Gnade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird keine Herrschaft über euch haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: die Sünde
  rationale: Die übliche paulinische Wiedergabe. Der bestimmte Artikel ist im Deutschen idiomatisch; die Kleinschreibung vermeidet eine zusätzliche Deutung, während das Verb die Personifizierung als herrschende Macht bewahrt.
- source_word: κυριεύσει
  choice: wird über euch herrschen
  rationale: Gibt die Ausübung von Herrschaft klar und würdig wieder und erhält das Bild der Sünde als beherrschender Macht.
- source_word: ὑπὸ νόμον
  choice: unter dem Gesetz
  rationale: Die im Deutschen natürliche Formulierung gibt die Stellung unter der Autorität beziehungsweise dem Herrschaftsbereich des Gesetzes wieder. Obwohl νόμον im Griechischen artikellos ist, verlangt die idiomatische deutsche Wendung hier gewöhnlich den Artikel.
- source_word: χάριν
  choice: Gnade
  rationale: Der etablierte und kontextgemäße Ausdruck für den paulinischen Gegensatz zu Gesetz; „Gunst“ würde die theologische Tragweite hier zu schwach wiedergeben.
- source_word: γὰρ … γάρ
  choice: Denn … denn
  rationale: 'Beide Vorkommen werden sichtbar wiedergegeben: Das erste verbindet den Satz begründend mit dem Kontext, das zweite begründet die vorangehende Aussage.'
theological_decisions:
- issue: Personifizierung der Sünde als herrschende Macht
  choice: „die Sünde wird nicht über euch herrschen“
  alternative: „die Sünde wird keine Herrschaft über euch haben“
  rationale: Die Formulierung bewahrt die Personifizierung und den Zukunftsaspekt, ohne durch besondere Großschreibung oder eine stärkere Metapher zusätzliche dogmatische Festlegungen einzutragen.
- issue: Bedeutung von ὑπὸ νόμον
  choice: „unter dem Gesetz“
  alternative: „unter Gesetz“
  rationale: Die idiomatische deutsche Form wahrt den Gegensatz von Gesetz und Gnade, ohne im Haupttext genauer festzulegen, in welchem umfassenden theologischen Sinn Paulus den Herrschaftsbereich des Gesetzes versteht.
translation_notes:
  register: Modernes, standardsprachliches und würdiges Deutsch. Die wiederholte Begründungspartikel „denn“ hält die Struktur des griechischen Satzes sichtbar; die knappe Gegenüberstellung von Gesetz und Gnade bleibt erhalten.
