id: ROM.6.4
reference: Romans 6:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: de
  text: Wir wurden also durch die Taufe mit ihm in den Tod begraben, damit, wie der Messias[a] durch die Herrlichkeit des Vaters von den Toten auferweckt wurde, auch wir in der Neuheit des Lebens wandeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus.'
    reason: Alternative Wiedergabe des griechischen Titels Χριστός.
lexical_decisions:
- source_word: συνετάφημεν
  choice: wir wurden mit ihm begraben
  rationale: Der Aorist Passiv bezeichnet das Geschehen als vollzogen; die Mitbedeutung des Präfixes συν- wird im Deutschen natürlich durch „mit ihm“ ausgedrückt.
- source_word: οὖν
  choice: also
  rationale: „Also“ markiert in natürlichem Deutsch die Folgerung aus dem vorausgehenden Gedankengang.
- source_word: διὰ τοῦ βαπτίσματος
  choice: durch die Taufe
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „durch“ erhält diese instrumentale Bedeutung, ohne eine bestimmte Tauflehre festzulegen.
- source_word: εἰς τὸν θάνατον
  choice: in den Tod
  rationale: Die Richtungsbedeutung von εἰς bleibt erhalten und wird nicht zu einer bloßen Beziehung zum Tod abgeschwächt.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Ziel- beziehungsweise Zweckbeziehung im modernen Deutschen klar wieder.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Die Wiedergabe bewahrt den Titelcharakter von Χριστός; die geläufige Form „Christus“ wird als Alternative in der Fußnote genannt.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die übliche und genaue deutsche Wendung für die Auferweckung aus dem Bereich der Toten.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: durch die Herrlichkeit des Vaters
  rationale: „Durch“ bewahrt die instrumentale Konstruktion, während „Herrlichkeit“ die Weite von δόξα erhält und sie nicht vorschnell auf „Macht“ verengt.
- source_word: ἐν καινότητι ζωῆς
  choice: in der Neuheit des Lebens
  rationale: Die abstrakte und theologisch gehaltvolle Ausdrucksweise des Griechischen bleibt erhalten, statt sie glättend als „in einem neuen Leben“ wiederzugeben.
- source_word: περιπατήσωμεν
  choice: wir … wandeln
  rationale: „Wandeln“ bewahrt das paulinische Bild für die Lebensführung; trotz seines gehobenen Tons ist es in diesem biblischen Zusammenhang verständlich.
theological_decisions:
- issue: Ob διὰ τοῦ βαπτίσματος so wiederzugeben ist, dass eine bestimmte Sakramentslehre vorausgesetzt wird
  choice: durch die Taufe
  alternative: mittels der Taufe; kraft der Taufe
  rationale: Die grammatische Instrumentalität wird ausgedrückt, ohne näher zu bestimmen, auf welche Weise die Taufe mit der Verbindung mit dem Tod des Messias zusammenhängt.
- issue: Titelhafte Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: „Messias“ macht den Titelgehalt sichtbar; da „Christus“ im Deutschen ebenfalls sachlich möglich und traditionell geläufig ist, wird diese Alternative transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht gehobenem biblischem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber deutsch lesbar. „Wandeln“ erhält bewusst die Lebensweg-Metapher.
