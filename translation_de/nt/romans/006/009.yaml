  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: de
  text: Wir wissen, dass der Messias[a], von den Toten auferweckt, nicht mehr stirbt; der Tod herrscht nicht mehr über ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Christus“.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: wir wissen ja
  rationale: Das Partizip verweist auf ein gemeinsam vorausgesetztes Wissen, das die Aussage im Zusammenhang begründet. Die deutsche Formulierung ist natürlich und lässt die genaue logische Verknüpfung offen; „ja“ kennzeichnet das Wissen als bekannt, ohne ausdrücklich ein kausales „weil“ einzufügen.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός wird hier als bedeutungsvoller Titel verstanden. „Der Messias“ gibt diesen Titel für heutige Leser unmittelbar verständlich wieder; die traditionelle Wiedergabe „Christus“ bleibt in der Fußnote erhalten.
- source_word: ἐγερθεὶς
  choice: nachdem er … auferweckt worden ist
  rationale: Die Formulierung bewahrt das Passiv und macht deutlich, dass die Auferweckung dem Nicht-mehr-Sterben vorausgeht.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die übliche und klare deutsche Wiedergabe der Auferstehungsformel.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die zweimalige Wiedergabe erhält den Nachdruck und die Endgültigkeit der griechischen Aussage.
- source_word: ἀποθνῄσκει
  choice: stirbt
  rationale: Das Präsens bezeichnet die nun dauerhaft geltende Wirklichkeit, dass der Messias dem Tod nicht länger unterliegt.
- source_word: θάνατος
  choice: der Tod
  rationale: Die direkte Wiedergabe bewahrt den Tod als personifiziertes Subjekt des zweiten Satzteils.
- source_word: κυριεύει
  choice: herrscht … über
  rationale: Die Wendung gibt die Vorstellung von Herrschaft und Macht natürlich und zugleich kraftvoll wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός im paulinischen Sprachgebrauch
  choice: der Messias
  alternative: Christus
  rationale: An dieser Stelle lässt sich Χριστός als Titel mit eigenständigem Bedeutungsgehalt lesen. Die Hauptübersetzung macht diesen Gehalt sichtbar, während die geläufige traditionelle Form als echte lexikalische Alternative in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „wir wissen ja“ stellt den Anschluss an den vorherigen Gedankengang her, ohne die adverbiale Funktion des griechischen Partizips einseitig als kausal oder temporal festzulegen. Das Semikolon bewahrt die enge rhetorische Verbindung der beiden Aussagen.
