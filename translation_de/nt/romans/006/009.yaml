  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Aussagen des griechischen Textes zutreffend wieder: die gemeinsame Erkenntnis, den Titel Χριστός, die passive Auferweckung von den Toten, das zweimalige οὐκέτι sowie die personifizierte Herrschaft des Todes. Die Präsensformen „stirbt“ und „herrscht“ sind angemessen.'
  naturalness: „Nachdem er … auferweckt worden ist“ ist zwar verständlich, wirkt im Deutschen jedoch unnötig schwerfällig und legt mit dem Perfekt eine zeitliche Nuance nahe, die der aoristische Partizip nicht ausdrücklich verlangt. Die Partizipialfügung „von den Toten auferweckt“ ist idiomatischer und bewahrt Passiv und Vorzeitigkeit. Das zusätzliche „ja“ ist nicht erforderlich und trägt eine diskurspragmatische Bekräftigung ein, die der griechische Wortlaut nicht ausdrücklich markiert.
  terminology: „der Messias“ ist als Titelübersetzung von Χριστός hier vertretbar; die Fußnote mit „Christus“ dokumentiert die geläufige lexikalische Alternative. „Der Tod herrscht ... über ihn“ trifft κυριεύει natürlich und präzise.
