- from: 'Dabei wissen wir: Unser alter Mensch wurde mit ihm gekreuzigt, damit der Leib der Sünde[a] unwirksam gemacht würde[b], sodass wir der Sünde nicht länger als Sklaven dienen[c].'
  to: 'Wir wissen: Unser alter Mensch wurde mit ihm gekreuzigt, damit der Leib der Sünde[a] unwirksam gemacht wird[b], damit wir der Sünde nicht länger als Sklaven dienen[c].'
  rationale: Die Revision glättet den deutschen Satzbau und bildet die zwei zielgerichteten Konstruktionen des Griechischen mit zwei „damit“-Sätzen ab. Sie bewahrt die begriffliche Offenheit und die Sklaverei-Metapher, ohne eine spezifische theologische Deutung festzuschreiben.
