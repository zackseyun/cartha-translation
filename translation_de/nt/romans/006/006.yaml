  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: de
  text: 'Wir wissen: Unser alter Mensch wurde mit ihm gekreuzigt, damit der Leib der Sünde[a] unwirksam gemacht wird[b], damit wir der Sünde nicht länger als Sklaven dienen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint sein kann auch: der von der Sünde beherrschte Leib oder der sündige Leib.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: außer Kraft gesetzt beziehungsweise beseitigt wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: damit wir der Sünde nicht länger dienen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Dabei wissen wir
  rationale: Die partizipiale Wendung knüpft an den vorausgehenden Gedankengang an. „Dabei wissen wir“ bewahrt diesen Zusammenhang in natürlichem Deutsch, ohne das Verhältnis ausdrücklich als kausal festzulegen.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: unser alter Mensch
  rationale: Die paulinische anthropologische Wendung wird bildhaft und formal nah wiedergegeben. „Mensch“ bezeichnet hier nicht nur Männer, sondern die bisherige menschliche Existenz.
- source_word: συνεσταυρώθη
  choice: wurde mit ihm gekreuzigt
  rationale: „Mit ihm“ gibt die Bedeutung des Präfixes συν- ausdrücklich wieder; das im unmittelbaren Zusammenhang erkennbare Bezugswort ist Christus.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: der Leib der Sünde
  rationale: Die kompakte Genitivverbindung bleibt erhalten, damit nicht vorschnell entschieden wird, ob der von Sünde beherrschte Leib, ein sündiger Leib oder der Leib in seiner Beziehung zur Sünde gemeint ist.
- source_word: καταργηθῇ
  choice: unwirksam gemacht würde
  rationale: Die Wiedergabe bezeichnet das Außerkraftsetzen oder Entmachten, ohne zwingend eine vollständige Vernichtung auszusagen.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: sodass wir der Sünde nicht länger als Sklaven dienen
  rationale: δουλεύω trägt das Bild des Sklavendienstes unter einem Herrn. Die Formulierung bewahrt sowohl den Dienst- als auch den Unfreiheitsaspekt.
theological_decisions:
- issue: Anthropologische Bedeutung von ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: unser alter Mensch
  alternative: unser altes Selbst
  rationale: „Alter Mensch“ bewahrt das paulinische Bild und lässt offen, wie genau die frühere, von der Sünde bestimmte Existenz anthropologisch zu fassen ist.
- issue: Bedeutungsumfang von καταργηθῇ
  choice: unwirksam gemacht würde
  alternative: beseitigt würde / außer Kraft gesetzt würde
  rationale: Die Formulierung betont den Verlust wirksamer Herrschaft, ohne dem Verb zwingend den stärkeren Sinn vollständiger Vernichtung zu geben.
- issue: Verhältnis des letzten Zwecksatzes zum vorherigen Satzteil
  choice: sodass wir der Sünde nicht länger als Sklaven dienen
  alternative: damit wir der Sünde nicht länger als Sklaven dienen
  rationale: Der artikulierte Infinitiv mit τοῦ kann Zweck oder beabsichtigte Folge ausdrücken. „Sodass“ stellt die resultative Fortführung heraus, ohne die enge Zweckbeziehung aufzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Alter Mensch“ und „Leib der Sünde“ erhalten bewusst die markanten paulinischen Bilder; „als Sklaven dienen“ macht die Herrschaftsmetaphorik verständlich, ohne sie abzuschwächen.
