review_pass:
  verdict: revise
  source_fidelity: 'Die zentralen Begriffe sind treffend wiedergegeben: „unser alter Mensch“ wahrt die paulinische Metapher von ὁ παλαιὸς ἡμῶν ἄνθρωπος, „mit ihm gekreuzigt“ gibt συνεσταυρώθη wieder, und „Leib der Sünde“ erhält die offene Genitivverbindung. „Unwirksam gemacht“ ist für καταργηθῇ grundsätzlich möglich, sollte jedoch im Satzbau klarer als Zweckfolge stehen. Der letzte Ausdruck muss sowohl den Dienst- als auch den Sklaverei-Aspekt von δουλεύειν bewahren.'
  naturalness: „Dabei wissen wir“ ist ohne den vorausgehenden Kontext weniger klar als eine direkte deutsche Einleitung. Die Abfolge „damit … würde, sodass … dienen“ wirkt zudem unnötig schwerfällig. „Der Sünde als Sklaven dienen“ ist idiomatischer als „der Sünde nicht länger als Sklaven dienen“ und stellt die Zugehörigkeit der Sklavenmetapher syntaktisch eindeutig her.
  terminology: „Alter Mensch“, „Leib der Sünde“ und „als Sklaven dienen“ sind fachlich wie registermäßig angemessen. Die Fußnoten bleiben als echte lexikalische bzw. auslegungsbezogene Alternativen bestehen; „beseitigt“ ist als mögliche, stärkere Lesart von καταργηθῇ nur in der Anmerkung vertretbar.
  issues:
  - severity: medium
    issue: Unnatürliche und semantisch etwas lockere Anbindung des Schlusses
    rationale: Das griechische τοῦ μηκέτι δουλεύειν ist ein weiterer finaler Infinitiv und bezeichnet das Ziel, nicht bloß eine Folge. Die deutsche Fassung mit „sodass“ kann zu resultativ klingen; außerdem ist die Stellung von „als Sklaven“ stilistisch weniger klar.
  - severity: low
    issue: „Dabei wissen wir“ ist kontextabhängig und im isolierten Vers weniger präzise
    rationale: Das Partizip γινώσκοντες lässt sich im Deutschen schlicht mit „Wir wissen“ wiedergeben, ohne ein bestimmtes logisches Verhältnis zum vorherigen Kontext festzulegen.
