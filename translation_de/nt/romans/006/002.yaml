base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: de
  text: Auf keinen Fall! Wir, die wir der Sünde gestorben sind – wie könnten wir noch in ihr leben?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Keineswegs!«; eine nachdrückliche Zurückweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Die feste, idiomatische Zurückweisung gibt die starke paulinische Verneinung in natürlichem, modernem Deutsch wieder.
- source_word: οἵτινες
  choice: Wir, die wir
  rationale: Die Form kennzeichnet und charakterisiert die zuvor genannten Glaubenden; die inklusive erste Person bleibt erhalten.
- source_word: ἀπεθάνομεν
  choice: gestorben sind
  rationale: Das Perfekt ist im Deutschen die natürliche Wiedergabe des griechischen Aorists und bezeichnet hier ein als geschehen vorausgesetztes Ereignis.
- source_word: τῇ ἁμαρτίᾳ
  choice: für die Sünde
  rationale: Bei »sterben« bezeichnet der Dativ die Beziehung, hinsichtlich derer der Tod gilt. Die etablierte deutsche Wendung bewahrt die Metapher, ohne sie auszudeuten.
- source_word: πῶς ἔτι
  choice: wie könnten wir noch
  rationale: Der Konjunktiv in der rhetorischen Frage vermittelt sowohl die Unvereinbarkeit als auch den zeitlichen Sinn von ἔτι.
- source_word: ζήσομεν
  choice: leben
  rationale: Das griechische Futur steht in einer rhetorischen Frage. »Wie könnten wir … leben?« gibt dessen Aussagekraft idiomatisch wieder.
- source_word: ἐν αὐτῇ
  choice: in ihr
  rationale: Das feminine Pronomen verweist auf »die Sünde« und bewahrt deren Darstellung als Lebensbereich oder Herrschaftssphäre.
theological_decisions:
- issue: Ob Paulus eine moralische Verbesserung oder einen entscheidenden Bruch mit der Herrschaft der Sünde beschreibt
  choice: Die Metapher »für die Sünde gestorben« bleibt ohne erklärende Auflösung stehen.
  alternative: für die Sünde unempfindlich geworden; sich von der Sünde abgewandt
  rationale: Der griechische Text formuliert die Todesmetapher unmittelbar. Ihre Beibehaltung wahrt die theologische Spannung und legt den genauen Vorgang der Heiligung nicht konfessionell fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich erhält den rhetorischen Nachdruck; die Formulierung bleibt verständlich, ohne die paulinische Metapher zu glätten.
