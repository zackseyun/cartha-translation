id: ROM.6.16
reference: Romans 6:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: de
  text: 'Wisst ihr nicht: Wenn ihr euch jemandem als Sklaven zum Gehorsam zur Verfügung stellt, seid ihr Sklaven desjenigen, dem ihr gehorcht – entweder der Sünde, die zum Tod führt, oder des Gehorsams, der zur Gerechtigkeit[a] führt?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gerechtigkeit kann hier sowohl das, was vor Gott recht ist, als auch ein entsprechend gerechtes Leben bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: euch … zur Verfügung stellt
  rationale: Die Formulierung gibt das Sich-Hinstellen beziehungsweise Sich-Bereitstellen für den Dienst eines anderen natürlich wieder, ohne die konkrete Verfügung über die eigene Person abzuschwächen.
- source_word: δούλους / δοῦλοί
  choice: Sklaven
  rationale: „Sklaven“ bewahrt den für Paulus entscheidenden Gedanken umfassender Bindung und Herrschaft deutlicher als „Diener“.
- source_word: εἰς ὑπακοήν
  choice: zum Gehorsam
  rationale: Die Wendung wahrt die substantivische Form von ὑπακοή und gibt die Zielrichtung von εἰς knapp wieder.
- source_word: ᾧ ὑπακούετε
  choice: dessen, dem ihr gehorcht
  rationale: Die Formulierung erhält den Bezug auf denjenigen, dem Gehorsam geleistet wird, ohne ausdrücklich einen im Griechischen nicht genannten „Herrn“ einzufügen.
- source_word: ἁμαρτίας
  choice: der Sünde
  rationale: Die direkte Wiedergabe lässt die Personifizierung der Sünde aus dem Bild der Sklaverei hervorgehen, statt sie erklärend in den Text einzubauen.
- source_word: εἰς θάνατον
  choice: die zum Tod führt
  rationale: Damit wird die ziel- beziehungsweise folgebezogene Bedeutung von εἰς in gegenwärtigem, verständlichem Deutsch ausgedrückt.
- source_word: ὑπακοῆς
  choice: des Gehorsams
  rationale: Das abstrakte Substantiv bleibt erhalten und bildet wie im Griechischen den Gegenpol zur Sünde.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Entsprechung, die sowohl den theologischen als auch den ethischen Bedeutungsumfang des paulinischen Begriffs offenhält.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im paulinischen Gegensatz
  choice: Gerechtigkeit
  alternative: das, was recht ist / ein vor Gott rechtes Leben
  rationale: „Gerechtigkeit“ bewahrt die theologische Spannung zwischen einem von Gott bestimmten rechten Zustand und gerechtem Handeln. Eine ausschließlich soziale oder ausschließlich forensische Deutung wird nicht festgeschrieben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde durch einen Doppelpunkt entlastet; das Bild der Sklaverei und die parallelen Zielangaben „zum Tod“ und „zur Gerechtigkeit“ bleiben deutlich erhalten.
