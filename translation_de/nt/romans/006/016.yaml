    issue: Unnatürliche Bezugnahme mit „dessen, dem ihr gehorcht“
    rationale: Die Konstruktion ist grammatisch möglich, aber im heutigen Deutsch weniger flüssig als „desjenigen, dem ihr gehorcht“. Die Änderung betrifft nur Idiomatik, nicht den Sinn.
