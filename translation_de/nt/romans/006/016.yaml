revisions:
- from: 'Wisst ihr nicht: Wenn ihr euch jemandem als Sklaven zum Gehorsam zur Verfügung stellt, dann seid ihr Sklaven dessen, dem ihr gehorcht – entweder der Sünde, die zum Tod führt, oder des Gehorsams, der zur Gerechtigkeit[a] führt?'
  to: 'Wisst ihr nicht: Wenn ihr euch jemandem als Sklaven zum Gehorsam zur Verfügung stellt, seid ihr Sklaven desjenigen, dem ihr gehorcht – entweder der Sünde, die zum Tod führt, oder des Gehorsams, der zur Gerechtigkeit[a] führt?'
  rationale: Die einzige Änderung ersetzt die im Deutschen sperrige Formulierung „dessen, dem“ durch „desjenigen, dem“. Dadurch wird der personale Bezug von ᾧ ὑπακούετε natürlich ausgedrückt, ohne den im griechischen Text nicht ausdrücklich genannten Begriff „Herr“ hinzuzufügen. Fußnotenanker und Bedeutungsumfang von δικαιοσύνη bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:46:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Struktur und Bildsprache des griechischen Textes zuverlässig wieder: das Sich-zur-Verfügung-Stellen, die Sklavenmetapher, die Gegenüberstellung von Sünde und Gehorsam sowie die ziel-/folgebezogenen Angaben zum Tod und zur Gerechtigkeit. Die abstrakte Personifizierung von „Sünde“ und „Gehorsam“ bleibt angemessen erhalten.'
  naturalness: „Sklaven dessen, dem ihr gehorcht“ ist zwar verständlich, wirkt im modernen Standarddeutsch aber unnötig schwerfällig. „Sklaven desjenigen, dem ihr gehorcht“ ist idiomatischer und bewahrt den personalen Bezug des Relativpronomens.
  terminology: „Sklaven“ entspricht δούλοι sachgerecht und erhält die Herrschafts- und Bindungsmetapher. „Gerechtigkeit“ ist für δικαιοσύνη hier die natürliche, ausreichend offene deutsche Wiedergabe. Die Fußnote erläutert den möglichen Bedeutungsumfang, ohne eine einzelne dogmatische Deutung festzulegen.
  issues:
