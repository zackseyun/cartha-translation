  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: de
  text: Was sollen wir nun sagen? Sollen wir in der Sünde bleiben, damit die Gnade zunimmt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sollen wir an der Sünde festhalten, damit die Gnade überreich wird?“'
    reason: Lexikalische Alternativen für ἐπιμένω und πλεονάζω.
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Was sollen wir nun sagen?
  rationale: Gibt den folgernden Übergang οὖν und die rhetorisch-beratende Frage in natürlichem, modernem Deutsch wieder.
- source_word: ἐπιμένωμεν τῇ ἁμαρτίᾳ
  choice: Sollen wir in der Sünde bleiben
  rationale: ἐπιμένω mit Dativ bezeichnet hier das fortgesetzte Verharren in einem Bereich oder Zustand; „bleiben“ ist klar und wahrt den Aspekt eines anhaltenden Verhaltens.
- source_word: ἵνα
  choice: damit
  rationale: Bewahrt die im Gedankengang formulierte Ziel- beziehungsweise Zweckbeziehung, ohne sie abschwächend umzudeuten.
- source_word: ἡ χάρις πλεονάσῃ
  choice: die Gnade zunimmt
  rationale: „Gnade“ ist die sachgerechte Wiedergabe von χάρις; „zunimmt“ vermittelt die Steigerung, die πλεονάζω ausdrückt, in gegenwärtigem Standarddeutsch.
theological_decisions:
- issue: Ob Paulus nach Erlaubnis, Verpflichtung oder bloßer Möglichkeit fragt
  choice: 'Beratende moralische Frage: „Sollen wir in der Sünde bleiben?“'
  alternative: „Werden wir in der Sünde bleiben?“ / „Dürfen wir in der Sünde bleiben?“
  rationale: Der deliberative Konjunktiv fragt rhetorisch nach einem vorgeschlagenen Verhalten. „Sollen wir“ erhält diese Spannung, ohne bereits eine Erlaubnis oder eine Vorhersage hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Zuspitzung bleibt erhalten; die Formulierung ist verständlich, ohne den Einwand bereits in der Frage theologisch aufzulösen.
