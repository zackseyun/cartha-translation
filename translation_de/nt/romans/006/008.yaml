id: ROM.6.8
reference: Romans 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: de
  text: Wenn wir aber mit dem Messias[a] gestorben sind, glauben wir, dass wir auch mit ihm leben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Griechisch: Χριστῷ (Christō).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn … aber
  rationale: εἰ leitet die Bedingung ein; δέ führt den Gedankengang mit einem leichten Gegensatz beziehungsweise Übergang weiter. Die deutsche Nachstellung von „aber“ ist natürlich und bildet beides ab.
- source_word: ἀπεθάνομεν
  choice: wir … gestorben sind
  rationale: Der griechische Aorist bezeichnet hier das bereits geschehene Mitsterben. Im Deutschen ist das Perfekt in diesem Zusammenhang natürlicher als das Präteritum, ohne den Vergangenheitsbezug abzuschwächen.
- source_word: σὺν Χριστῷ
  choice: mit dem Messias
  rationale: σύν bezeichnet Gemeinschaft beziehungsweise Verbundenheit. Χριστός wird hier als Titel verstanden und daher mit „Messias“ wiedergegeben.
- source_word: πιστεύομεν
  choice: glauben wir
  rationale: „Glauben“ ist in diesem Aussagesatz die direkte und geläufige Entsprechung von πιστεύομεν.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt dessen ein, was geglaubt wird.
- source_word: καὶ
  choice: auch
  rationale: καί stellt dem Mitsterben die entsprechende künftige Lebensgemeinschaft zur Seite.
- source_word: συζήσομεν αὐτῷ
  choice: wir auch mit ihm leben werden
  rationale: Das zusammengesetzte Verb συζάω bedeutet „mit jemandem leben“; αὐτῷ nennt die Person, mit der dieses Leben geteilt wird. Die Formulierung bewahrt den Zukunftsbezug.
theological_decisions:
- issue: Wiedergabe von Χριστῷ
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός hat hier titularen Charakter. „Messias“ macht die Bedeutung des Titels für heutige Leser unmittelbar erkennbar; die traditionelle Alternative wird in einer Fußnote genannt.
- issue: Bedeutung des künftigen Lebens in συζήσομεν αὐτῷ
  choice: mit ihm leben werden
  alternative: mit ihm auferstehen und leben werden
  rationale: Der griechische Wortlaut spricht allgemein vom künftigen Leben mit ihm. Die Übersetzung legt nicht zusätzlich fest, ob ausschließlich Auferstehungsleben oder auch eine breitere Gemeinschaft mit dem Messias gemeint ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Ton. „Wenn wir aber“ bewahrt den Diskursanschluss; das deutsche Perfekt klingt idiomatisch und bezeichnet weiterhin ein bereits geschehenes Mitsterben.
