  naturalness: Die Formulierung ist modernes, flüssiges Standarddeutsch. Die Satzstellung „Wenn wir aber … gestorben sind, glauben wir“ ist klar und angemessen; „mit ihm leben werden“ ist eine natürliche Wiedergabe von συζήσομεν αὐτῷ.
  terminology: „Messias“ ist als Wiedergabe des titulären Χριστός vertretbar und wird durch die Fußnote mit der traditionellen Alternative „Christus“ transparent ergänzt. „Glauben“ und „leben“ sind treffend und ohne konfessionell einengende Ausdeutung gewählt.
