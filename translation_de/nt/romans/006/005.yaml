  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: de
  text: Denn wenn wir mit ihm in der Ähnlichkeit seines Todes verbunden geworden sind,[a] werden wir es auch in der Ähnlichkeit seiner Auferstehung sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihm zusammengewachsen sind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werden wir auch der Auferstehung sein“; „verbunden“ und „in der Ähnlichkeit“ werden aus dem ersten Satzglied ergänzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: mit ihm … verbunden
  rationale: Das Adjektiv bezeichnet eine enge, organische Verbundenheit oder gemeinsame Teilhabe. Die Formulierung ist im modernen Deutsch verständlich, ohne die Art dieser Verbindung näher festzulegen.
- source_word: γεγόναμεν
  choice: verbunden worden sind
  rationale: Das Perfekt bezeichnet einen eingetretenen Zustand mit fortdauerndem Ergebnis. Das deutsche Perfekt bildet dies natürlich ab.
- source_word: τῷ ὁμοιώματι
  choice: in der Gleichheit
  rationale: Die Wendung wahrt den qualifizierenden Begriff ὁμοίωμα und lässt die genaue Funktion des Dativs bewusst offen, statt sie als bloßes Mittel oder äußeres Abbild festzulegen.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: seines Todes
  rationale: Dies gibt die Genitivverbindung knapp und unmittelbar wieder.
- source_word: ἀλλὰ καὶ
  choice: gewiss auch
  rationale: Im Deutschen gibt „gewiss auch“ die nachdrückliche Steigerung und Folgerung natürlicher wieder als ein wörtliches „sondern auch“.
- source_word: τῆς ἀναστάσεως
  choice: in der Gleichheit seiner Auferstehung
  rationale: Die Parallelformulierung wird aus dem ersten Satzteil ergänzt. „Seiner“ ist im zweiten Glied nicht ausdrücklich wiederholt, ergibt sich aber aus dem parallelen Bezug auf Christus.
- source_word: ἐσόμεθα
  choice: werden wir es … sein
  rationale: Das griechische Futur lautet wörtlich „werden wir sein“; das Pronomen „es“ nimmt im Deutschen die zuvor genannte Verbundenheit auf und bewahrt zugleich die Ellipse des Ausgangstextes.
theological_decisions:
- issue: Art der Verbundenheit mit Christus in Tod und Auferstehung
  choice: Die Übersetzung spricht von Verbundenheit „in der Gleichheit“, ohne deren Wirkweise näher zu bestimmen.
  alternative: Die Aussage ausdrücklich sakramental, mystisch oder lediglich bildlich deuten.
  rationale: Der griechische Text verbindet wirkliche Teilhabe mit dem qualifizierenden Ausdruck ὁμοίωμα. Diese theologische Spannung bleibt erhalten.
- issue: Zeitlicher Bezug der Auferstehungsaussage
  choice: Das Futur „werden wir … sein“ bleibt stehen.
  alternative: Die Aussage ausschließlich auf gegenwärtiges neues Leben oder ausschließlich auf die künftige leibliche Auferstehung festlegen.
  rationale: Der Vers selbst lässt den genauen zeitlichen Umfang offen; der Kontext kann gegenwärtige und zukünftige Aspekte anklingen lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt paulinisch verdichtet, wird aber durch „werden wir es … sein“ idiomatisch verständlich. Beide Fußnotenmarker stehen an den jeweils einschlägigen Stellen im Haupttext.
