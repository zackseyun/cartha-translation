revisions:
- from: Denn wenn wir mit ihm in der Gleichheit seines Todes verbunden worden sind,[a] werden wir es gewiss auch in der Gleichheit seiner Auferstehung sein.[b]
  to: Denn wenn wir mit ihm in der Ähnlichkeit seines Todes verbunden geworden sind,[a] werden wir es auch in der Ähnlichkeit seiner Auferstehung sein.[b]
  rationale: Die Revision ersetzt das semantisch zu starke und im Deutschen unübliche „Gleichheit“ durch „Ähnlichkeit“. Sie lässt die organische Nuance von σύμφυτοι in der Alternative sichtbar, bewahrt die Perfektform, die Zukunftsaussage und die griechische Ellipse und vermeidet eine unnötige Verstärkung durch „gewiss“.
