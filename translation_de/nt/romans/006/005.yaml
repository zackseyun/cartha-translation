  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Perfekt-Futur-Struktur und die elliptische Wiederaufnahme im zweiten Satzglied grundsätzlich zutreffend wieder. „Gleichheit“ ist für ὁμοίωμα jedoch nicht passend: Es bezeichnet hier Ähnlichkeit/Gestalt, nicht Gleichheit im Sinn von Identität oder Ebenbürtigkeit. Das eingefügte „gewiss“ ist als Verstärkung möglich, aber nicht erforderlich und stärker als der griechische Wortlaut.'
  naturalness: „In der Gleichheit seines Todes“ ist im modernen Standarddeutsch weder idiomatisch noch semantisch klar. „In der Ähnlichkeit seines Todes“ wahrt die qualifizierende Formulierung und ist in einem würdigen biblischen Register verständlich. Die parallele Wiederholung im zweiten Glied macht die griechische Ellipse lesbar.
  terminology: „Mit ihm verbunden geworden“ ist eine sachgerechte, nicht konfessionell festlegende Wiedergabe von σύμφυτοι γεγόναμεν; die Fußnote bietet die organischere Alternative. „Ähnlichkeit“ gibt ὁμοίωμα besser wieder als „Gleichheit“. Das nicht wiederholte Bezugspronomen bei „seiner Auferstehung“ ist aufgrund des Parallelismus zulässig.
  issues:
  - severity: medium
    issue: „Gleichheit“ für ὁμοίωμα
    rationale: „Gleichheit“ kann Identität oder völlige Entsprechung ausdrücken. ὁμοίωμα bezeichnet demgegenüber Ähnlichkeit, Gestalt oder Abbild. Die Formulierung sollte diesen qualifizierenden Charakter bewahren.
  - severity: low
    issue: „gewiss“ als Wiedergabe von ἀλλὰ καί
    rationale: Die Verbindung bringt die zweite Aussage nachdrücklich hinzu, doch ein ausdrückliches „gewiss“ ist nicht nötig und kann die Aussage stärker absichern, als es der Text verlangt.
  - severity: low
    issue: Fußnote b bezeichnet eine interpretierende Ergänzung teilweise als wörtlich
    rationale: Die Ergänzung von „Verbundenheit“ und von „in der Ähnlichkeit“ ist für gutes Deutsch sinnvoll, gehört aber nicht zum Wortlaut des zweiten Satzglieds. Die Fußnote sollte Wortlaut und Ergänzung deutlicher unterscheiden.
