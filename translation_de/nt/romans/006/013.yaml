id: ROM.6.13
reference: Romans 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: de
  text: Und stellt eure Körperteile nicht der Sünde als Waffen[a] der Ungerechtigkeit zur Verfügung. Stellt vielmehr euch selbst Gott zur Verfügung, wie Menschen, die aus dem Tod zum Leben gekommen sind, und stellt eure Körperteile Gott als Waffen der Gerechtigkeit[b] zur Verfügung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Werkzeuge“.
    reason: lexical_alternative
  - marker: b
    text: Oder „des Rechts“.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: stellt … zur Verfügung
  rationale: Die Wendung gibt das wiederholte Verb verständlich wieder und bewahrt die Vorstellung, sich oder den eigenen Körper einer Macht zum Gebrauch zu überlassen.
- source_word: μέλη
  choice: Körperteile
  rationale: Im Kontext sind die Teile des Körpers gemeint. „Körperteile“ ist im heutigen Deutsch eindeutiger als „Glieder“, das auch Mitglieder einer Gemeinschaft bezeichnen kann.
- source_word: ὅπλα
  choice: Waffen
  rationale: „Waffen“ bewahrt das deutliche Kampf- und Herrschaftsbild; die allgemeinere Bedeutung „Werkzeuge“ wird in einer Fußnote genannt.
- source_word: ἀδικίας
  choice: Ungerechtigkeit
  rationale: Die Wiedergabe wahrt den begrifflichen Gegensatz zu δικαιοσύνης und lässt sowohl moralisches Unrecht als auch ungerechtes Handeln anklingen.
- source_word: ἁμαρτίᾳ
  choice: der Sünde
  rationale: Die direkte Wiedergabe erhält die Personifizierung der Sünde im Zusammenhang, ohne sie ausdrücklich als Macht auszudeuten.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: als Menschen, die aus den Toten heraus lebendig sind
  rationale: Die Formulierung bewahrt den vergleichenden Charakter sowie den Gegensatz von Tod und Leben und vermeidet die stärkere Festlegung auf „auferstanden“ oder „zum Leben erweckt“.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ entspricht dem paulinischen moralisch-theologischen Sprachgebrauch und bildet den direkten Gegenbegriff zu „Ungerechtigkeit“; „Recht“ bleibt als mögliche Bedeutungsnuance in der Fußnote erhalten.
theological_decisions:
- issue: Sünde und Gott als einander gegenüberstehende Herren
  choice: Die Dativbeziehungen werden mit „der Sünde“ und „Gott“ unmittelbar beibehalten; „zur Verfügung stellen“ macht die Ausrichtung verständlich, ohne einen zusätzlichen Dienstbegriff einzuführen.
  alternative: „im Dienst der Sünde … im Dienst Gottes“
  rationale: Der griechische Text legt Zugehörigkeit und Verfügbarkeit nahe, formuliert aber nicht ausdrücklich „dienen“. Die gewählte Fassung wahrt diese Spannung.
- issue: Auferstehungsgeprägte Aussage in ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: „als Menschen, die aus den Toten heraus lebendig sind“
  alternative: „als Menschen, die von den Toten auferstanden sind“
  rationale: Die Alternative wäre idiomatischer, würde die vergleichende Formulierung jedoch stärker als ausdrückliche Aussage einer bereits vollzogenen Auferstehung festlegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Körperteile“ vermeidet die heutige Mehrdeutigkeit von „Glieder“. Die Wiederholung von „zur Verfügung stellen“ bildet die zugespitzte Gegenüberstellung des griechischen Textes ab; Gedankenstriche entlasten den langen Satz und kennzeichnen die eingeschobene Lebens-Tod-Aussage.
