review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Gegenüberstellung von Sünde und Gott sind zutreffend wiedergegeben. „Körperteile“, „Waffen“, „Ungerechtigkeit/Gerechtigkeit“ und die wiederholte Aufforderung entsprechen dem griechischen Text gut. Die Wendung „aus den Toten heraus lebendig sind“ ist jedoch im Deutschen semantisch und syntaktisch schwer verständlich; die Vergleichspartikel ὡσεὶ sollte zugleich klar erkennbar bleiben.
  naturalness: „Stellt … zur Verfügung“ ist modern und verständlich, wirkt in der vorliegenden langen Satzkonstruktion aber durch die eingeschobene, unidiomatische Formulierung zum Leben aus den Toten schwerfällig. Eine klarere vergleichende Wendung und die Wiederaufnahme des Verbs im letzten Glied machen den Satz gut lesbar.
  terminology: „Körperteile“ ist für μέλη in modernem Deutsch angemessen. „Waffen“ erhält die Bildsprache von ὅπλα; „Werkzeuge“ ist eine sinnvolle lexikalische Alternative. „Gerechtigkeit“ und die Fußnotenalternative „Recht“ sind hier vertretbar, ohne den Begriff einseitig festzulegen.
  issues:
