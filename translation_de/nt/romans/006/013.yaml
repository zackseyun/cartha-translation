revisions:
- from: Und stellt eure Körperteile nicht der Sünde als Waffen[a] der Ungerechtigkeit zur Verfügung. Stellt vielmehr euch selbst Gott zur Verfügung – als Menschen, die aus den Toten heraus lebendig sind – und eure Körperteile Gott als Waffen der Gerechtigkeit[b].
  to: Und stellt eure Körperteile nicht der Sünde als Waffen[a] der Ungerechtigkeit zur Verfügung. Stellt vielmehr euch selbst Gott zur Verfügung, wie Menschen, die aus dem Tod zum Leben gekommen sind, und stellt eure Körperteile Gott als Waffen der Gerechtigkeit[b] zur Verfügung.
  rationale: Die Überarbeitung bewahrt die wiederholte Verfügbarkeits- und Waffenmetaphorik sowie die direkte Ausrichtung auf Sünde beziehungsweise Gott. „Wie Menschen, die aus dem Tod zum Leben gekommen sind“ gibt die Vergleichskraft von ὡσεὶ verständlich wieder und wahrt den Kontrast zwischen Tod und Leben, ohne den Begriff „Auferstehung“ ergänzend einzutragen. Die Verbwiederholung im zweiten Satz ist eine deutsche Klarstellung ohne Bedeutungsänderung.
