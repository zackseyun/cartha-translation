    issue: Die Formulierung „als Menschen, die aus den Toten heraus lebendig sind“ ist unidiomatisch und lässt offen, wie „lebendig“ zu „aus den Toten“ syntaktisch gehört.
    rationale: ὡσεὶ ἐκ νεκρῶν ζῶντας bezeichnet vergleichend Menschen, die aus dem Bereich des Todes zum Leben gelangt sind. Die deutsche Fassung soll dies verständlich ausdrücken, ohne ὡσεὶ zu einer uneingeschränkten Behauptung zu machen.
  - severity: low
    issue: Das abschließende „und eure Körperteile Gott als Waffen der Gerechtigkeit“ enthält im Deutschen kein ausgedrücktes Verb.
    rationale: Das Verb ist im Griechischen zwar nur einmal gesetzt und kann beide Objekte regieren; im Deutschen verbessert die Wiederholung von „stellt … zur Verfügung“ Klarheit und Parallelismus.
