  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: de
  text: Denn wer gestorben ist, ist von der Sünde freigesprochen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Sünde gerechtfertigt“; dem Zusammenhang nach auch: „von der Sünde befreit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: wer gestorben ist
  rationale: Der Artikel mit dem Aoristpartizip wird substantivisch gebraucht. Die deutsche Formulierung ist natürlich, geschlechtsneutral und bewahrt den allgemeinen beziehungsweise repräsentativen Sinn.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage; „Denn“ gibt diese Verknüpfung knapp und idiomatisch wieder.
- source_word: δεδικαίωται
  choice: ist freigesprochen
  rationale: Das Perfekt Passiv von δικαιόω besitzt eine gerichtliche Grundbedeutung. „Ist freigesprochen“ wahrt diese forensische Nuance und lässt im Zusammenhang zugleich die Befreiung vom Anspruch beziehungsweise von der Herrschaft der Sünde anklingen.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: von der Sünde
  rationale: Die Präposition ἀπό bezeichnet hier Trennung oder Entlassung. Der bestimmte Artikel wird im Deutschen natürlich wiedergegeben und passt zur personifizierten Sünde im Kontext von Römer 6.
theological_decisions:
- issue: Ob δικαιόω hier rein forensisch als „gerechtfertigt“ oder im Sinne einer Befreiung als „befreit“ wiederzugeben ist.
  choice: Im Haupttext steht „von der Sünde freigesprochen“.
  alternative: '„von der Sünde gerechtfertigt“; kontextuell auch: „von der Sünde befreit“'
  rationale: Römer 6 betont die Befreiung von der Herrschaft der Sünde, doch Paulus verwendet δικαιόω und damit ein Verb mit gerichtlicher Prägung. „Freigesprochen“ bewahrt diese Prägung, ohne die im Kontext liegende Loslösung von der Sünde auszublenden; die Fußnote erhält die echte lexikalische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform folgt der griechischen Begründungsstruktur; „wer“ vermeidet unnötige Geschlechtsmarkierung.
