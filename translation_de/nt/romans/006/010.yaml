  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: de
  text: Denn als er starb, starb er ein für alle Mal der Sünde[a]; doch indem er lebt, lebt er für Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Sünde“ oder „im Blick auf die Sünde“.'
    reason: Der Dativ τῇ ἁμαρτίᾳ bezeichnet eine Beziehung zur Sünde; die genaue Nuance ist umstritten.
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: Denn den Tod, den er starb
  rationale: Das neutrale Relativpronomen steht idiomatisch beim wiederholten Verb und bezeichnet das Geschehen seines Sterbens. Die Formulierung bewahrt die Hervorhebung und den erklärenden Anschluss durch γάρ.
- source_word: τῇ ἁμαρτίᾳ
  choice: der Sünde
  rationale: Der Dativ bezeichnet hier am ehesten die Beziehung zur Sünde. Der deutsche Dativ bewahrt die knappe Form und die Parallelität zu τῷ θεῷ, ohne die Beziehung vorschnell auszudeuten.
- source_word: ἐφάπαξ
  choice: ein für alle Mal
  rationale: Die Wendung bezeichnet ein einmaliges, nicht zu wiederholendes Geschehen mit bleibender Geltung.
- source_word: ὃ δὲ ζῇ
  choice: das Leben aber, das er lebt
  rationale: Die Wiedergabe spiegelt den parallelen Aufbau des ersten Satzteils und bringt mit „aber“ den Gegensatz zwischen Tod und Leben zum Ausdruck.
- source_word: τῷ θεῷ
  choice: für Gott
  rationale: Im Deutschen gibt „für Gott leben“ die Ausrichtung auf Gott natürlich wieder; zugleich bleibt die inhaltliche Gegenüberstellung zur Beziehung auf die Sünde erhalten.
theological_decisions:
- issue: Ob τῇ ἁμαρτίᾳ als „der Sünde“, „für die Sünde“ oder „im Blick auf die Sünde“ wiederzugeben ist
  choice: der Sünde
  alternative: für die Sünde; im Blick auf die Sünde
  rationale: Der bloße Dativ erhält die Spannung und den Gegensatz zu Gottesbezug im zweiten Halbvers, ohne Christus persönliche Sünde zuzuschreiben oder die Wendung ausschließlich als Sühneaussage festzulegen. Die möglichen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst markante Wendung „den Tod, den er starb“ erhält die rhetorische Parallelität des Griechischen; „ein für alle Mal“ ist verständlich und idiomatisch.
