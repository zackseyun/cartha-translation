id: ROM.6.17
reference: Romans 6:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: de
  text: Gott aber sei Dank, dass ihr zwar Sklaven der Sünde wart, aber von Herzen dem Muster[a] der Lehre gehorcht habt, dem ihr übergeben wurdet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Form der Lehre“ oder „dem Maßstab der Lehre“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „in das ihr übergeben wurdet“; εἰς kann die Richtung stärker hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Gott aber sei Dank
  rationale: Die feste Wendung bezeichnet hier an Gott gerichteten Dank, nicht »Gnade« als abstrakte Eigenschaft; die deutsche Formulierung bewahrt zugleich den feierlichen Ton.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: Sklaven der Sünde
  rationale: Das Sklavenbild von Herrschaft und Gebundenheit prägt den Gedankengang in Römer 6 und sollte nicht zum schwächeren »Diener« abgemildert werden.
- source_word: ὑπηκούσατε
  choice: gehorcht habt
  rationale: Das Verb bezeichnet tatsächlichen Gehorsam und nicht nur aufmerksames Hören.
- source_word: ἐκ καρδίας
  choice: von Herzen
  rationale: Die geläufige deutsche Wendung erhält das Bild des Herzens und betont den inneren, aufrichtigen Gehorsam.
- source_word: τύπον διδαχῆς
  choice: Muster der Lehre
  rationale: »Muster« gibt τύπος als prägende Form beziehungsweise verbindliches Modell wieder, ohne die Wendung auf eine rein abstrakte Lehrnorm einzuengen.
- source_word: παρεδόθητε
  choice: ihr übergeben wurdet
  rationale: 'Das Passiv und das auffällige Bild bleiben erhalten: Nicht die Lehre wird ihnen übergeben, sondern sie werden dem Muster der Lehre übergeben.'
- source_word: εἰς ὃν
  choice: dem
  rationale: Im Deutschen verbindet der Dativ das Muster natürlich sowohl mit »gehorchen« als auch mit »übergeben werden«; die wörtlichere räumliche Nuance von εἰς wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Ob δοῦλοι mit »Diener« abgeschwächt oder als »Sklaven« wiedergegeben werden soll
  choice: Sklaven der Sünde
  alternative: Diener der Sünde
  rationale: Paulus beschreibt in Römer 6 eine Herrschafts- und Eigentumsbindung. »Sklaven« erhält die Schärfe dieses theologischen Gegensatzes.
- issue: Ob die Passivkonstruktion so umgestellt werden soll, dass den Glaubenden die Lehre übergeben wurde
  choice: dem Muster der Lehre … dem ihr übergeben wurdet
  alternative: die Lehre, die euch überliefert wurde
  rationale: Der griechische Text stellt die Adressaten als diejenigen dar, die dem Lehrmuster übergeben wurden. Diese ungewöhnliche Bildrichtung wird nicht geglättet.
- issue: Wie die Spannung in ὅτι ἦτε … ὑπηκούσατε δὲ wiederzugeben ist
  choice: dass ihr zwar … wart, aber … gehorcht habt
  alternative: Ihr wart einst …; doch Gott sei Dank, dass ihr … gehorcht habt
  rationale: Die zwar-aber-Konstruktion bewahrt den grammatischen Zusammenhang des Dankes mit dem ganzen Satz, ohne den Eindruck zu erwecken, Paulus danke isoliert für die frühere Sklaverei unter der Sünde.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paulinischem Ton. Die ungewöhnliche Übergabe der Glaubenden an ein Lehrmuster bleibt bewusst erhalten; zwei knappe Fußnoten sichern die lexikalische und räumliche Mehrdeutigkeit.
