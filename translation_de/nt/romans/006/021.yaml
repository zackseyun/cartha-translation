id: ROM.6.21
reference: Romans 6:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: de
  text: Welche Frucht hattet ihr damals von den Dingen, für die ihr euch jetzt schämt? Denn das Ende[a] dieser Dinge ist der Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ausgang«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: welche
  rationale: Leitet die rhetorische Frage natürlich ein und fragt nach der Art beziehungsweise dem Wert der Frucht.
- source_word: καρπὸν
  choice: Frucht
  rationale: Bewahrt das paulinische Bild für das hervorgebrachte Ergebnis, statt es zu einem abstrakten Begriff abzuflachen.
- source_word: εἴχετε
  choice: hattet ihr
  rationale: Gibt den Imperfekt im Rückblick auf den früheren fortdauernden Zustand idiomatisch wieder.
- source_word: τότε
  choice: damals
  rationale: Markiert knapp und deutlich den zeitlichen Gegensatz zu »jetzt«.
- source_word: ἐφ’ οἷς
  choice: von den Dingen, für die
  rationale: »Von den Dingen« verbindet die Frucht mit den früheren Handlungen; bei »für die ihr euch schämt« gibt »für« den im Deutschen idiomatischen Bezug der Scham wieder.
- source_word: νῦν
  choice: jetzt
  rationale: Bewahrt den scharfen zeitlichen Gegensatz zu »damals«.
- source_word: ἐπαισχύνεσθε
  choice: ihr euch schämt
  rationale: Ist direkt, gegenwärtig und bewahrt das moralische Gewicht des Verbs.
- source_word: τέλος
  choice: Ende
  rationale: Bewahrt sowohl den Gedanken des Endpunkts als auch den des Ergebnisses; die mögliche Bedeutung »Ausgang« wird in der Fußnote genannt.
- source_word: ἐκείνων
  choice: dieser Dinge
  rationale: Nimmt die unmittelbar zuvor genannten Dinge im Deutschen eindeutig wieder auf.
- source_word: θάνατος
  choice: der Tod
  rationale: Ist die klare Standardentsprechung und bewahrt das theologische Gewicht der Aussage.
theological_decisions:
- issue: Ob τέλος als »Ende« oder deutender als »Ausgang« wiederzugeben ist
  choice: Ende
  alternative: Ausgang
  rationale: »Ende« erhält die Spannung zwischen Zielpunkt und Folge des früheren Lebenswandels, ohne die Aussage auf bloße Konsequenz zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Fruchtmetapher und der Gegensatz zwischen »damals« und »jetzt« bleiben erhalten; die rhetorische Frage wird nicht erklärend aufgelöst.
