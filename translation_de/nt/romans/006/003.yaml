source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: de
  text: Oder wisst ihr nicht, dass wir alle, die wir auf den Messias Jesus getauft wurden, auf seinen Tod getauft wurden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus Jesus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Bewahrt den argumentativen Anschluss an den vorhergehenden Gedankengang und den leicht mahnenden Ton der rhetorischen Frage.
- source_word: ἀγνοεῖτε
  choice: wisst ihr nicht
  rationale: Gibt die rhetorische Frage idiomatisch und unmittelbar wieder und setzt wie der griechische Text gemeinsames Wissen voraus.
- source_word: ὅσοι
  choice: wir alle, die wir
  rationale: Erfasst zusammen mit der ersten Person Plural des Verbs den umfassenden und einschließenden Sinn der Wendung.
- source_word: ἐβαπτίσθημεν
  choice: getauft wurden
  rationale: Gibt den Aorist Passiv schlicht als vollzogenes Geschehen wieder, ohne eine bestimmte konfessionelle Deutung der Taufe einzutragen.
- source_word: εἰς
  choice: in … hinein
  rationale: Bewahrt bei beiden Vorkommen die im Griechischen angelegte Ziel- und Eingliederungsrichtung deutlicher als ein bloßes „auf“ oder „in Bezug auf“.
- source_word: Χριστὸν Ἰησοῦν
  choice: den Messias Jesus
  rationale: Gibt Χριστός als Titel wieder; der bestimmte Artikel ist im Deutschen nötig, weil „Messias“ hier als Titel vor dem Namen steht.
- source_word: θάνατον
  choice: Tod
  rationale: Direkte und vollständige Wiedergabe ohne erklärende Erweiterung.
- source_word: αὐτοῦ
  choice: seinen
  rationale: Gibt den Genitiv natürlich als Possessivform wieder und bezieht ihn eindeutig auf den Messias Jesus.
theological_decisions:
- issue: Ob εἰς in Verbindung mit der Taufe sakramentale Wirksamkeit, symbolische Identifikation oder eine andere Form der Eingliederung bezeichnet.
  choice: Beide Vorkommen werden mit „in … hinein“ wiedergegeben.
  alternative: „auf“ beziehungsweise „in Beziehung zu“
  rationale: Die Formulierung erhält die starke Richtungs- und Eingliederungsbildlichkeit des griechischen Textes, ohne die genaue theologische Wirkweise der Taufe konfessionell festzulegen.
- issue: Ob Χριστός hier als Titel oder als namensähnliche Bezeichnung wiederzugeben ist.
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: „Messias“ macht die Titelbedeutung von Χριστός sichtbar; die traditionelle, namensähnliche Wiedergabe bleibt in der Fußnote zugänglich.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die zweimalige Formulierung „in … hinein getauft“ ist bewusst etwas markant: Sie wahrt die Wiederholung von εἰς und die Eingliederungsbildlichkeit des Ausgangstextes.'
