  rationale: Die Übersetzung wird ausschließlich bei der deutschen Wiedergabe von εἰς in der Taufkonstruktion geglättet. „Auf … getauft“ ist idiomatisches modernes Standarddeutsch, erhält die Wiederholung des griechischen Ausdrucks und lässt dessen theologische Tragweite offen. Die Titelübersetzung „Messias“ und die alternative Fußnote bleiben bestehen.
