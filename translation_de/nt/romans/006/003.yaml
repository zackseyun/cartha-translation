  source_fidelity: Der Entwurf gibt die rhetorische Frage, die inklusive erste Person Plural, das Passiv und die zweimalige Zuordnung durch εἰς insgesamt zutreffend wieder. Im deutschen Taufsprachgebrauch ist „auf“ jedoch die natürliche und zugleich quellentreue Entsprechung für εἰς; es wahrt die offene, nicht konfessionell festgelegte Bezugs- bzw. Eingliederungsrelation.
  naturalness: „In den Messias Jesus hinein getauft“ und besonders „in seinen Tod hinein getauft“ sind verständlich, wirken im modernen Standarddeutsch aber unnötig sperrig. Die feste bzw. etablierte Wendung „auf … getauft“ ist klarer und behält die Wiederholung des griechischen εἰς bei.
