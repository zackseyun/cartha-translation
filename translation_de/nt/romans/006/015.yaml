base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: de
  text: Was nun? Sollten wir sündigen, weil wir nicht unter dem Gesetz, sondern unter der Gnade sind? Auf keinen Fall![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sollen wir sündigen?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Keineswegs!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Was folgt daraus?
  rationale: Gibt den knappen folgernden Übergang in natürlichem modernem Deutsch wieder, ohne die im Griechischen nicht ausgedrückte Wendung „sollen wir sagen“ hinzuzufügen.
- source_word: ἁμαρτήσωμεν
  choice: Sollen wir sündigen
  rationale: Der deliberative Aorist Konjunktiv der ersten Person Plural wird als rhetorische Überlegung wiedergegeben; „Sollen wir sündigen?“ ist im Deutschen klar und idiomatisch.
- source_word: ὅτι
  choice: weil
  rationale: 'Kennzeichnet den vorgeschlagenen Grund für das Sündigen: den Umstand, nicht unter Gesetz, sondern unter Gnade zu sein.'
- source_word: ὑπὸ νόμον
  choice: unter dem Gesetz
  rationale: Die im Deutschen feste paulinische Wendung wahrt das Bild eines Herrschafts- beziehungsweise Geltungsbereichs. Der bestimmte Artikel ist im Deutschen idiomatisch und legt für sich genommen nicht fest, ob ausschließlich das mosaische Gesetz gemeint ist.
- source_word: ὑπὸ χάριν
  choice: unter der Gnade
  rationale: „Gnade“ ist hier die sachlich und theologisch angemessene Wiedergabe von χάρις; die parallele Formulierung bewahrt den Gegensatz zu Gesetz.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Die geläufige, nachdrückliche deutsche Zurückweisung gibt die starke ablehnende Kraft der griechischen Wendung wieder, ohne altertümlich zu klingen.
theological_decisions:
- issue: Bedeutungsumfang von νόμος im Gegensatz zwischen Gesetz und Gnade
  choice: Im Haupttext „unter dem Gesetz“ ohne erläuternde Eingrenzung wiedergeben.
  alternative: „unter Gesetz“ oder ausdrücklich „unter dem mosaischen Gesetz“
  rationale: Obwohl νόμος im Griechischen ohne Artikel steht, verlangt idiomatisches Deutsch hier gewöhnlich den Artikel. Die Übersetzung benennt das Gesetz dennoch nicht ausdrücklich als mosaisch und hält so den genauen theologischen Umfang für Kontext und Auslegung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Argumentation bleibt knapp und zugänglich; die traditionelle, heute jedoch gehoben-altertümliche Alternative „Das sei ferne!“ wird nur in der Fußnote genannt.
