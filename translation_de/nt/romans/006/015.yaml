  source_fidelity: Der Entwurf gibt die deliberative Frage ἁμαρτήσωμεν, die begründende Konjunktion ὅτι sowie den Gegensatz ὑπὸ νόμον / ὑπὸ χάριν sachgerecht wieder. „Unter dem Gesetz“ ist im modernen Deutschen idiomatisch und engt den im Griechischen artikellosen Ausdruck nicht zwingend auf eine bestimmte Auslegung ein. μὴ γένοιτο wird mit „Auf keinen Fall!“ nachdrücklich und angemessen wiedergegeben.
  naturalness: Der Satz ist insgesamt klar und modernes Standarddeutsch. „Was nun?“ ist jedoch die nähere und ebenso natürliche Entsprechung des knappen argumentativen Übergangs Τί οὖν als das etwas stärker explizierende „Was folgt daraus?“.
  terminology: „Gesetz“ und „Gnade“ bewahren die paulinische Gegenüberstellung ohne konfessionelle oder auslegende Präzisierung. Die Fußnotenalternative „Wollen wir etwa sündigen?“ verschiebt die deliberative Frage unnötig in Richtung einer Willensfrage und fügt mit „etwa“ eine nicht erforderliche Nuance hinzu.
