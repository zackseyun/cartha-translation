revisions:
- from: Ich rede menschlich wegen der Schwachheit eures Fleisches.[a] Denn wie ihr eure Glieder als Sklaven der Unreinheit und der Gesetzlosigkeit zur Gesetzlosigkeit hingestellt habt, so stellt eure Glieder jetzt als Sklaven der Gerechtigkeit[b] hin, zur Heiligung.
  to: Ich rede in menschlichen Kategorien wegen der Schwäche eures Fleisches.[a] Denn wie ihr eure Glieder als Sklaven der Unreinheit und der Gesetzlosigkeit zur Gesetzlosigkeit hingestellt habt, so stellt jetzt eure Glieder als Sklaven der Gerechtigkeit[b] zur Heiligung hin.
  rationale: Die Revision beschränkt sich auf sichere sprachliche Verbesserungen. Sie macht die einleitende idiomatische Wendung verständlich, modernisiert „Schwachheit“ zu „Schwäche“ und glättet die Stellung der Zielangabe. Die lexikalischen Wiederholungen, das Sklavenbild, die Ambiguität von „Fleisch“ und die Fußnotenanker bleiben erhalten.
