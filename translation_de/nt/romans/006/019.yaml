id: ROM.6.19
reference: Romans 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: de
  text: Ich rede in menschlichen Kategorien wegen der Schwäche eures Fleisches.[a] Denn wie ihr eure Glieder als Sklaven der Unreinheit und der Gesetzlosigkeit zur Gesetzlosigkeit hingestellt habt, so stellt jetzt eure Glieder als Sklaven der Gerechtigkeit[b] zur Heiligung hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fleisch“ kann hier auslegend auch als „sündige Natur“ verstanden werden; der griechische Ausdruck ist jedoch weiter.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rechtschaffenheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Ich rede menschlich
  rationale: Bewahrt die knappe griechische Wendung und bezeichnet eine der menschlichen Auffassung angepasste Redeweise, ohne sie ausdrücklich auf eine Analogie festzulegen.
- source_word: ἀσθένειαν
  choice: Schwachheit
  rationale: Gibt den weiten Sinn körperlicher oder moralischer Begrenztheit wieder, ohne ihn unnötig einzuengen.
- source_word: σάρξ
  choice: Fleisch
  rationale: Bewahrt die Breite und theologische Spannung des paulinischen Ausdrucks; „sündige Natur“ wäre stärker auslegend.
- source_word: παρεστήσατε / παραστήσατε
  choice: hingestellt habt / stellt ... hin
  rationale: Erhält die Wiederholung desselben Verbs und den Gegensatz zwischen dem früheren Verhalten und der jetzigen Aufforderung.
- source_word: μέλη
  choice: Glieder
  rationale: Ist die geläufige, würdige deutsche Wiedergabe für die Glieder beziehungsweise leiblichen Fähigkeiten des Menschen.
- source_word: δοῦλα
  choice: Sklaven
  rationale: Gibt die starke Herrschafts- und Zugehörigkeitsmetapher in Römer 6 klarer wieder als „Diener“.
- source_word: ἀκαθαρσίᾳ
  choice: Unreinheit
  rationale: Bewahrt den moralischen Sinn und entspricht der etablierten biblischen Begrifflichkeit in verständlichem Deutsch.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: Gesetzlosigkeit / Gesetzlosigkeit
  rationale: Erhält die bewusste lexikalische Wiederholung und die Steigerung von Gesetzlosigkeit zu weiterer Gesetzlosigkeit.
- source_word: εἰς τὴν ἀνομίαν
  choice: zur Gesetzlosigkeit
  rationale: Bewahrt die knappe Richtungs- beziehungsweise Ergebnisformulierung des Griechischen und lässt deren genaue Nuance offen.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: Ist die natürliche deutsche Hauptentsprechung und trägt hier sowohl die ethische Richtigkeit als auch den Gegensatz zur Gesetzlosigkeit.
- source_word: ἁγιασμόν
  choice: Heiligung
  rationale: Bewahrt den möglichen prozesshaften beziehungsweise resultativen Sinn und die Verbindung mit dem Heiligwerden.
theological_decisions:
- issue: Bedeutung von σάρξ in „Schwachheit eures Fleisches“
  choice: Fleisch
  alternative: sündige Natur
  rationale: Der Zusammenhang schließt die menschliche Anfälligkeit in der gefallenen leiblichen Existenz ein, verlangt aber nicht die engere Deutung „sündige Natur“.
- issue: Bedeutung von δικαιοσύνη im paulinischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ bewahrt den zentralen paulinischen Begriff und den unmittelbaren Gegensatz zur Gesetzlosigkeit; „Rechtschaffenheit“ würde den Sinn stärker auf persönliche Moral verengen.
- issue: Kraft des Sklavenbildes
  choice: Sklaven
  alternative: Diener
  rationale: Der Abschnitt handelt von bindender Herrschaft und Zugehörigkeit. „Sklaven“ erhält diese Härte, ohne die Metapher abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die Wiederholungen des griechischen Textes wurden bewusst erhalten. „Ich rede menschlich“ ist knapp und leicht ungewohnt, spiegelt aber die markierte Ausdrucksweise des Originals besser als eine erklärende Paraphrase.
