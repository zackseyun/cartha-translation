id: ROM.6.12
reference: Romans 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: de
  text: Darum soll die Sünde nicht in eurem sterblichen Körper herrschen, sodass ihr seinen Begierden gehorcht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „sodass ihr den Begierden der Sünde gehorcht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorhergehenden Gedankengang und stellt den logischen Zusammenhang in natürlichem Deutsch her.
- source_word: βασιλευέτω
  choice: soll ... nicht ... herrschen
  rationale: Gibt den verneinten Imperativ wieder und bewahrt zugleich das Bild königlicher Herrschaft.
- source_word: ἁμαρτία
  choice: die Sünde
  rationale: Die übliche Entsprechung bewahrt zusammen mit „herrschen“ die paulinische Personifizierung der Sünde als Macht.
- source_word: θνητῷ
  choice: sterblichen
  rationale: Präzise und knapp; bezeichnet den gegenwärtig dem Tod unterworfenen Zustand des Körpers.
- source_word: σώματι
  choice: Körper
  rationale: Gibt den körperlichen Bezug im heutigen Standarddeutsch unmittelbar wieder, ohne ihn deutend zu erweitern.
- source_word: εἰς τὸ ὑπακούειν
  choice: sodass ihr ... gehorcht
  rationale: Lässt die im griechischen Ausdruck mögliche Ziel- oder Folgebeziehung offen und klingt im Deutschen natürlich.
- source_word: ἐπιθυμίαις
  choice: Begierden
  rationale: Trägt hier die negative moralische Färbung, ohne die Bedeutung auf sexuelles Verlangen zu verengen.
- source_word: αὐτοῦ
  choice: seinen
  rationale: Das Pronomen stimmt grammatisch am natürlichsten mit dem sächlichen Singular σώμα („Körper“) überein. Der mögliche gedankliche Bezug auf die Sünde wird in einer Fußnote erhalten.
theological_decisions:
- issue: Sünde als einzelne Tat oder als herrschende Macht
  choice: 'Das Herrschaftsbild wird beibehalten: „die Sünde ... herrschen“.'
  alternative: Die Aussage als bloßes Überhandnehmen sündigen Verhaltens wiederzugeben.
  rationale: Das Verb βασιλεύω personifiziert die Sünde als regierende Macht; eine abstraktere Wiedergabe würde diese theologische Spannung abschwächen.
- issue: Bezugswort von αὐτοῦ
  choice: „seinen Begierden“ bezieht sich im Haupttext grammatisch auf den sterblichen Körper.
  alternative: „den Begierden der Sünde“, also ein gedanklicher Bezug des Pronomens auf die Sünde.
  rationale: Die maskulin-neutrale Singularform αὐτοῦ passt formal zu σώματι, nicht zur femininen ἁμαρτία. Da der Kontext auch eine gedankliche Zuordnung zur Sünde nahelegen kann, wird diese Möglichkeit in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die königliche Metapher und die Personifizierung der Sünde bleiben erhalten. „Sodass“ bewahrt die mögliche Nuance von Ziel oder Folge; die Pronomenmehrdeutigkeit wird nicht stillschweigend aufgelöst, sondern durch die Fußnote kenntlich gemacht.
