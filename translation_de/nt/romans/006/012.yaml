  source_fidelity: Der griechische verneinte Imperativ wird angemessen wiedergegeben; „Darum“ bildet οὖν ab, und „herrschen“ erhält die personifizierende Königsherrschaftsmetapher von βασιλευέτω. „sterblicher Körper“ entspricht θνητῷ σώματι. Die Konstruktion „sodass ihr … gehorcht“ gibt die mit εἰς τὸ ὑπακούειν ausgedrückte Ziel-/Folgebeziehung idiomatisch wieder, ohne sie übermäßig festzulegen. „seinen Begierden“ folgt der grammatisch möglichen und im vorliegenden Text naheliegenden Bezugnahme von αὐτοῦ auf σώμα.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und bewahrt einen würdevollen biblischen Registerton. „Soll … nicht herrschen“ ist als Wiedergabe eines Imperativs der dritten Person im Deutschen gut etabliert; „Begierden“ passt im Kontext und verengt nicht auf sexuelle Wünsche.
  terminology: „Sünde“, „herrschen“, „sterblich“, „Körper“, „gehorchen“ und „Begierden“ sind treffende, konsistente Entsprechungen. Die Fußnote wahrt die im Kontext diskutierte alternative gedankliche Zuordnung zu den Begierden der Sünde, ohne diese gegen die grammatische Form des Haupttexts durchzusetzen.
