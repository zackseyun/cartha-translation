id: ROM.6.23
reference: Romans 6:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: de
  text: Denn der Lohn der Sünde ist der Tod; die Gnadengabe Gottes aber ist ewiges Leben im Messias Jesus, unserem Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψώνια
  choice: Lohn
  rationale: Das griechische Pluralwort bezeichnet Sold beziehungsweise das, was als Entgelt ausgezahlt wird. Das im Deutschen idiomatische Singularwort „Lohn“ bewahrt den Gegensatz zwischen verdientem Entgelt und unverdienter Gabe.
- source_word: τῆς ἁμαρτίας
  choice: der Sünde
  rationale: Der Genitiv bleibt kompakt und lässt die Sünde als das erscheinen, wozu der Lohn gehört beziehungsweise was ihn auszahlt.
- source_word: θάνατος
  choice: der Tod
  rationale: Die direkte Wiedergabe bewahrt die volle wörtliche und theologische Tragweite, ohne die Art des Todes näher festzulegen.
- source_word: χάρισμα
  choice: Gnadengabe
  rationale: „Gnadengabe“ bringt sowohl den Geschenkcharakter als auch den in χάρισμα enthaltenen Gnadenbezug zum Ausdruck und bildet einen deutlichen Gegensatz zum verdienten Lohn.
- source_word: ζωὴ αἰώνιος
  choice: ewiges Leben
  rationale: Die geläufige und sachlich genaue Formulierung wahrt sowohl den zeitlichen als auch den theologischen Gehalt.
- source_word: ἐν
  choice: im
  rationale: Die Präposition wird als „in dem“ wiedergegeben und bewahrt so die paulinische Vorstellung von Bereich beziehungsweise Verbundenheit, ohne sie auf bloße Vermittlung einzuengen.
- source_word: Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Χριστός wird als Titel „Messias“ wiedergegeben; die Wortstellung des griechischen Textes bleibt erhalten.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ entspricht dem frühchristlichen Bekenntnisgebrauch und bewahrt das theologische Gewicht des Ausdrucks.
theological_decisions:
- issue: Bedeutung von ἐν Χριστῷ Ἰησοῦ
  choice: „im Messias Jesus“
  alternative: „durch den Messias Jesus“
  rationale: Das griechische ἐν bezeichnet hier am ehesten den Bereich oder die Verbundenheit mit dem Messias. „Im“ bewahrt diese theologische Spannung und legt den Ausdruck nicht einseitig instrumental aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon macht den scharfen Gegensatz zwischen verdientem Lohn und göttlicher Gnadengabe gut lesbar. Der ungewöhnliche, aber verständliche Titel „Messias Jesus“ folgt dem griechischen Χριστῷ Ἰησοῦ bewusst enger als die kirchlich geläufige Form „Christus Jesus“.
