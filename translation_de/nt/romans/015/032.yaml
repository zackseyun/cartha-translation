base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: de
  text: damit ich nach Gottes Willen mit Freude zu euch komme und zusammen mit euch neue Kraft schöpfe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusammen mit euch Erholung finde“ oder „mit euch gemeinsam erfrischt werde“. Das griechische Verb bezeichnet gemeinsames Ausruhen oder neue Stärkung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zwecksatz aus der vorangehenden Bitte ein und gibt die finale Bedeutung natürlich wieder.
- source_word: ἐν χαρᾷ
  choice: mit Freude
  rationale: Bewahrt das Substantiv und bezeichnet idiomatisch die begleitende innere Haltung.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: ich … zu euch komme
  rationale: Das Aoristpartizip wird dem deutschen Satzbau entsprechend in den von ἵνα abhängigen Verbalausdruck eingeordnet.
- source_word: διὰ θελήματος θεοῦ
  choice: nach Gottes Willen
  rationale: Bezeichnet Gottes Willen als bestimmenden Rahmen für das erhoffte Kommen; die Formulierung ist natürlich und lässt die genaue Nuance von διά mit Genitiv angemessen offen.
- source_word: συναναπαύσωμαι
  choice: zusammen mit euch neue Kraft schöpfe
  rationale: Gibt die gemeinsame Erholung und Stärkung des Verbs συναναπαύομαι verständlich wieder und bewahrt durch „zusammen mit euch“ die συν-Komponente.
theological_decisions:
- issue: Gegenseitigkeit der erhofften Gemeinschaft von Paulus und den Gläubigen in Rom
  choice: zusammen mit euch neue Kraft schöpfe
  alternative: bei euch Erholung finde
  rationale: Die gewählte Fassung stellt Paulus nicht nur als Gebenden dar, sondern als jemanden, der gemeinsam mit den Adressaten Erholung und Stärkung erfährt, ohne daraus einen besonderen theologischen Fachbegriff zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Neue Kraft schöpfen“ ist allgemein verständlich; die Fußnote hält die wörtlichere Ruhe- bzw. Erfrischungsnuance und die gegenseitige Dimension offen.
