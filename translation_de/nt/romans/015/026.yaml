source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: de
  text: Denn Mazedonien und Achaia haben sich entschlossen, für die Armen unter den Heiligen in Jerusalem einen Beitrag zu leisten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Teilhabe zu leisten“. Das griechische Wort kann Gemeinschaft oder Teilhabe bezeichnen und meint hier eine Gemeinschaft, die sich in materieller Unterstützung ausdrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: haben es für gut gehalten
  rationale: Die Wendung gibt sowohl die zustimmende Entscheidung als auch die bereitwillige Haltung des Aorists von εὐδοκέω wieder.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage und wird im Deutschen knapp und natürlich mit „Denn“ wiedergegeben.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: Mazedonien und Achaia
  rationale: Wie im Griechischen stehen die Gebietsnamen metonymisch für die dortigen christlichen Gemeinschaften; eine ausdrückliche Ergänzung wie „Gemeinden“ ist nicht nötig.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: eine Gabe der Gemeinschaft zu geben
  rationale: Die Formulierung macht den materiellen Beitrag verständlich und bewahrt zugleich den in κοινωνία enthaltenen Gedanken gemeinschaftlicher Teilhabe. Das indefinite τινά wird durch den unbestimmten Artikel wiedergegeben.
- source_word: εἰς τοὺς πτωχοὺς
  choice: für die Armen
  rationale: εἰς bezeichnet hier Ziel beziehungsweise Begünstigte der Gabe; „für die Armen“ ist die natürliche deutsche Form.
- source_word: τῶν ἁγίων
  choice: unter den Heiligen
  rationale: Der Genitiv ordnet die Armen der Gruppe der Heiligen zu. „Unter den Heiligen“ bildet diese Beziehung idiomatisch ab.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die Präpositionalgruppe bestimmt die Heiligen näher und wird unmittelbar als Ortsangabe wiedergegeben.
theological_decisions:
- issue: Wiedergabe von ἅγιοι im paulinischen Sprachgebrauch
  choice: Heilige
  alternative: die zu Gottes heiligem Volk gehören
  rationale: „Heilige“ bewahrt den paulinischen Leitbegriff für alle Glaubenden, ohne ihn auf später kanonisierte Einzelpersonen zu beschränken.
- issue: Bedeutungsumfang von κοινωνία im Sammlungskontext
  choice: Gabe der Gemeinschaft
  alternative: Beitrag
  rationale: Der Kontext verlangt materielle Unterstützung, doch κοινωνία bezeichnet zugleich Teilhabe und Gemeinschaft. Die gewählte Formulierung hält beide Aspekte zusammen, statt den Ausdruck allein finanziell zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die metonymischen Gebietsnamen bleiben erhalten. „Gabe der Gemeinschaft“ ist bewusst etwas markanter als „Beitrag“, um die Bedeutungsweite von κοινωνία sichtbar zu halten; die geläufigere Alternative steht in der Fußnote.
