  terminology: „Heilige“ ist als paulinischer Gruppenbegriff beizubehalten. „Beitrag“ trifft die materielle Funktion von κοινωνία in diesem Kontext, ohne eine konfessionell geprägte Deutung einzutragen. Die Fußnote soll die mögliche Nuance von Gemeinschaft bzw. Teilhabe erklären, nicht sie als unnatürlichen Bestandteil des deutschen Haupttexts erzwingen.
