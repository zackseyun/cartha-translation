  verdict: revise
  source_fidelity: 'Die Satzstruktur und die wesentlichen Bezüge werden zutreffend wiedergegeben: γάρ als „Denn“, die metonymischen Gebietsnamen, die Begünstigten sowie die Zuordnung der Armen zu den Heiligen in Jerusalem. „Eine Gabe der Gemeinschaft zu geben“ ist jedoch keine angemessene Wiedergabe von κοινωνίαν τινὰ ποιήσασθαι. Die Wendung ist im Deutschen unidiomatisch und verdoppelt mit „Gabe“/„geben“; zudem klingt „Gabe der Gemeinschaft“ wie eine feststehende religiöse Kategorie, die der griechische Ausdruck nicht verlangt. Im vorliegenden Sammlungskontext bezeichnet die Wendung einen materiellen Beitrag, wobei die Dimension des Teilhabens in einer Fußnote erläutert werden kann.'
