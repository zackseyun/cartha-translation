id: ROM.15.7
reference: Romans 15:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: de
  text: Darum nehmt einander an[a], wie auch Christus euch angenommen hat – zu Gottes Ehre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nehmt einander auf“ beziehungsweise „Heißt einander willkommen“.'
    reason: lexikalische Alternative für προσλαμβάνεσθε
  - marker: b
    text: 'Auch möglich: „zur Herrlichkeit Gottes“; die Wendung kann Ziel oder Ergebnis bezeichnen.'
    reason: Bedeutungsspielraum von εἰς δόξαν τοῦ θεοῦ
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang und stellt den logischen Zusammenhang knapp und natürlich her.
- source_word: προσλαμβάνεσθε ἀλλήλους
  choice: nehmt einander an
  rationale: Gibt den wechselseitigen, gemeinschaftlichen Sinn des Imperativs wieder. Die Formulierung bezeichnet tätige Annahme, ohne sie auf bloße Gastfreundschaft zu verengen.
- source_word: καθὼς καὶ
  choice: wie auch
  rationale: Bewahrt sowohl den Vergleich als auch die hinzufügende Kraft von καί in natürlichem Deutsch.
- source_word: ὁ Χριστός
  choice: Christus
  rationale: Die im Deutschen fest eingebürgerte Titelbezeichnung gibt Χριστός würdig und verständlich wieder; hier bleibt der titelartige Sinn erkennbar.
- source_word: προσελάβετο
  choice: angenommen hat
  rationale: Wiederholt denselben deutschen Verbstamm wie beim Imperativ und bewahrt so den von Paulus gesetzten Zusammenhang zwischen dem Handeln Christi und dem geforderten gegenseitigen Handeln.
- source_word: ὑμᾶς
  choice: euch
  rationale: Direkte Wiedergabe des Akkusativobjekts in der zweiten Person Plural.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: zu Gottes Ehre
  rationale: εἰς kann Ziel oder Ergebnis ausdrücken. Die Formulierung ist gegenwärtiges, würdiges Deutsch und lässt beide Nuancen offen.
theological_decisions:
- issue: Bedeutungsumfang von προσλαμβάνομαι im Gemeindekontext
  choice: einander annehmen
  alternative: einander aufnehmen / willkommen heißen
  rationale: „Annehmen“ umfasst die gemeinschaftliche Aufnahme über bestehende Unterschiede hinweg, ohne den Sinn auf einen einzelnen sozialen Akt zu beschränken.
- issue: Ziel- oder Ergebnisangabe in εἰς δόξαν τοῦ θεοῦ
  choice: zu Gottes Ehre
  alternative: zur Herrlichkeit Gottes / sodass Gott verherrlicht wird
  rationale: Die gewählte Fassung wahrt die mögliche Ziel- und Ergebnisrichtung, ohne ausdrücklich festzulegen, ob vor allem Gottes Ehre als Zweck oder als Folge gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Form. Der Gedankenstrich macht deutlich, dass die abschließende Ziel- beziehungsweise Ergebnisangabe den Vergleich und wahrscheinlich die gesamte Aufforderung umfasst, ohne die syntaktische Mehrdeutigkeit unnötig aufzulösen.
