  text: Διὸ καὶ ἐνεκοπτόμην τὰ πολλὰ τοῦ ἐλθεῖν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: de
  text: Deshalb wurde ich auch so oft daran gehindert, zu euch zu kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viele Male“ oder „immer wieder“; die griechische Wendung τὰ πολλὰ drückt eine häufige Wiederholung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Deshalb
  rationale: Kennzeichnet die Folgerung aus der unmittelbar vorausgehenden Begründung und stellt den logischen Zusammenhang natürlich her.
- source_word: καὶ
  choice: auch
  rationale: Fügt Paulus’ persönliche Lage an das zuvor Gesagte an und bewahrt die additive Bedeutung.
- source_word: ἐνεκοπτόμην
  choice: wurde ich … gehindert
  rationale: Das Imperfekt bezeichnet eine wiederholte oder fortdauernde Behinderung in der Vergangenheit; die passive Form lässt den Urheber wie im Griechischen unbestimmt.
- source_word: τὰ πολλὰ
  choice: so oft
  rationale: Die adverbiale Wendung bezeichnet hier häufige Wiederholung. „So oft“ ist idiomatisches modernes Deutsch und passt zum rückblickenden Zusammenhang.
- source_word: τοῦ ἐλθεῖν
  choice: daran …, zu … zu kommen
  rationale: Der artikulierte Infinitiv nach dem Verb des Hinderns bezeichnet die verhinderte Handlung; die deutsche Konstruktion mit „daran gehindert“ gibt dies natürlich wieder.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: πρός mit Akkusativ bezeichnet die Bewegung hin zu den Adressaten, ohne ausdrücklich einen Besuch oder dessen Zweck hinzuzufügen.
