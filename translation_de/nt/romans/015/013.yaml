id: ROM.15.13
reference: Romans 15:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: de
  text: Der Gott der Hoffnung aber erfülle euch mit aller Freude und allem Frieden im Glauben, damit ihr durch die Kraft des Heiligen Geistes überreich seid an Hoffnung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Der Gott der Hoffnung aber
  rationale: δὲ wird als milde Verknüpfung mit „aber“ wiedergegeben, ohne einen starken Gegensatz zu behaupten. Der Genitiv bleibt in der natürlichen und traditionsnahen Wendung „Gott der Hoffnung“ erhalten; sie kann Gott als Ursprung und Bezug der Hoffnung bezeichnen.
- source_word: πληρώσαι ὑμᾶς
  choice: erfülle euch
  rationale: Der Aoristoptativ drückt hier einen Segenswunsch aus. Der deutsche Konjunktiv I „erfülle“ bewahrt diese Gebets- und Wunschform knapp und würdig.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: mit aller Freude und allem Frieden
  rationale: Die Füllung wird im Deutschen idiomatisch mit „mit“ bezeichnet. Die Wiederholung von „allem“ vor „Frieden“ macht den umfassenden Sinn von πάσης klar und sorgt für grammatische Ausgewogenheit.
- source_word: ἐν τῷ πιστεύειν
  choice: im Glauben
  rationale: Die Verbindung aus ἐν und substantiviertem Infinitiv bezeichnet den Bereich oder Umstand des Glaubens. „Im Glauben“ ist im Deutschen natürlich und kann sowohl das Glauben als Vollzug als auch den Zustand vertrauenden Glaubens ausdrücken.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: damit ihr … überreich seid
  rationale: εἰς τό mit Infinitiv kann Zweck oder Folge ausdrücken. „damit“ lässt in diesem Segenswunsch die Zielrichtung hervortreten; „überreich seid“ gibt περισσεύειν als reichliches Vorhandensein wieder.
- source_word: ἐν τῇ ἐλπίδι
  choice: an Hoffnung
  rationale: Nach „überreich sein“ ist „an Hoffnung“ natürliches Deutsch. Die Wiederaufnahme von „Hoffnung“ bewahrt die lexikalische Verbindung zu θεὸς τῆς ἐλπίδος.
- source_word: ἐν δυνάμει
  choice: durch die Kraft
  rationale: Die Präpositionalfügung bezeichnet hier plausibel das Mittel, durch das die Hoffnung überreich wird. „durch die Kraft“ ist klar und idiomatisch.
- source_word: πνεύματος ἁγίου
  choice: des Heiligen Geistes
  rationale: Die übliche deutsche Wiedergabe des in diesem paulinischen Zusammenhang gemeinten göttlichen Heiligen Geistes verwendet bestimmten Artikel und Großschreibung.
theological_decisions:
- issue: Bezug von πνεύματος ἁγίου
  choice: des Heiligen Geistes
  alternative: heiligen Geistes / eines heiligen Geistes
  rationale: Im paulinischen Kontext bezeichnet die Wendung den göttlichen Heiligen Geist. Die deutsche Namensform macht diesen Bezug deutlich, ohne zusätzliche Aussagen über sein Wirken einzutragen.
- issue: Zweck oder Folge bei εἰς τὸ περισσεύειν
  choice: damit ihr … überreich seid
  alternative: sodass ihr … überreich seid
  rationale: Die griechische Konstruktion kann Zweck und Folge berühren. Im Rahmen des Segenswunsches ist die Zielangabe mit „damit“ gut begründet, ohne auszuschließen, dass zugleich das erhoffte Ergebnis gemeint ist.
- issue: Bedeutungsumfang von „Gott der Hoffnung“
  choice: Genitivform beibehalten
  alternative: Gott, der Hoffnung schenkt
  rationale: Die Genitivform bewahrt die Offenheit, ob Gott besonders als Ursprung, Geber oder Bezug der Hoffnung bezeichnet wird, statt diese Beziehung auf nur eine Deutung festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem Segensregister. Der Konjunktiv „erfülle“ hält die Wunschform des griechischen Optativs fest. Keine Fußnoten erforderlich.
