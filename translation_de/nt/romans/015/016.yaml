source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: de
  text: um als Diener des Messias Jesus für die Nichtjuden[a] zu wirken und das Evangelium Gottes priesterlich zu verkündigen[b], damit die Opfergabe der Nichtjuden[c] wohlgefällig werde, geheiligt durch den Heiligen Geist[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Völker“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „das Evangelium Gottes mit priesterlichem Dienst ausüben“ oder „am Evangelium Gottes Priesterdienst verrichten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Gemeint sind wahrscheinlich die Nichtjuden selbst, die Gott als Opfergabe dargebracht werden; möglich ist auch: „die von den Nichtjuden dargebrachte Opfergabe“.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: „im Heiligen Geist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: Diener
  rationale: Das Wort bezeichnet jemanden, der einen öffentlichen oder religiösen Dienst ausübt. „Diener“ bewahrt den Dienstgedanken; der ausdrücklich priesterliche Charakter wird durch ἱερουργοῦντα im folgenden Satzteil deutlich.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός trägt hier weiterhin seinen titularen Sinn „Messias“. Die Wiedergabe macht diesen Sinn sichtbar, statt ihn nur als traditionellen Namensbestandteil erscheinen zu lassen.
- source_word: εἰς τὰ ἔθνη
  choice: für die Nichtjuden
  rationale: Im Kontext des Römerbriefs bezeichnet ἔθνη hier die Menschen außerhalb des jüdischen Volkes. „Nichtjuden“ ist im heutigen Deutsch klar; „Völker“ bleibt als mögliche wörtlichere Wiedergabe in der Fußnote erhalten.
- source_word: ἱερουργοῦντα
  choice: am Evangelium Gottes priesterlichen Dienst zu tun
  rationale: Das Verb bezeichnet ausdrücklich priesterliches Handeln. Die Formulierung bewahrt das kultische Bild, ohne Paulus ein später definiertes kirchliches Priesteramt zuzuschreiben.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: das Evangelium Gottes
  rationale: Die vertraute paulinische Wendung bleibt erhalten. „Evangelium“ gibt den theologischen und verkündigenden Zusammenhang prägnant wieder.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: die Opfergabe der Nichtjuden
  rationale: Die griechische Genitivverbindung bleibt bewusst offen. Im Zusammenhang sind wahrscheinlich die Nichtjuden selbst die Gott dargebrachte Gabe; grammatisch ist aber auch eine von ihnen dargebrachte Gabe möglich.
- source_word: εὐπρόσδεκτος
  choice: wohlgefällig
  rationale: „Wohlgefällig“ passt zum Opferbild und bezeichnet eine Gabe, die von Gott günstig aufgenommen wird, ohne den im Griechischen unausgesprochenen Empfänger im Haupttext ausdrücklich einzufügen.
- source_word: ἡγιασμένη
  choice: geheiligt
  rationale: Das Partizip bezeichnet einen durch Heiligung entstandenen und fortbestehenden Zustand. „Geheiligt“ wahrt den theologischen Zusammenhang mit paulinischer Heiligkeitssprache.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: durch den Heiligen Geist
  rationale: ἐν kann hier instrumental die wirkende Kraft der Heiligung bezeichnen. Die ebenfalls mögliche lokale oder sphärische Deutung „im Heiligen Geist“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Paulus beschreibt seinen Dienst mit priesterlichen Begriffen
  choice: Das priesterliche Bild wird ausdrücklich bewahrt und auf den apostolischen Evangeliumsdienst des Paulus bezogen.
  alternative: Entweder eine formale priesterliche Amtsstellung aus späteren kirchlichen Strukturen einzulesen oder die kultische Bildsprache zu einem allgemeinen Dienst abzuschwächen.
  rationale: Die Verbindung von λειτουργός, ἱερουργέω und προσφορά ist deutlich priesterlich. Gegenstand ist jedoch der Evangeliumsdienst unter den Nichtjuden, nicht ein weiteres Sühnopfer.
- issue: Bezug der Wendung „Opfergabe der Nichtjuden“
  choice: Wahrscheinlich sind die Nichtjuden selbst die Opfergabe, die als Frucht des Evangeliumsdienstes Gott dargebracht wird.
  alternative: Die Wendung kann auch eine Opfergabe meinen, welche die Nichtjuden darbringen.
  rationale: Das priesterliche Gesamtbild und der Missionszusammenhang stützen die erste Deutung; der griechische Genitiv entscheidet die Frage jedoch nicht vollständig, weshalb die Mehrdeutigkeit angemerkt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultisch-priesterliche Bildsprache bleibt deutlich, ohne unnötig archaische Amtsbegriffe zu verwenden. Die syntaktische Form als Fortsetzung des vorausgehenden Satzes wird durch den kleingeschriebenen Beginn „um“ beibehalten.
