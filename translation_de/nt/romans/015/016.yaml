  source_fidelity: Der Entwurf gibt die Struktur und die kultisch-priesterliche Metaphorik des griechischen Textes insgesamt zutreffend wieder. Die Mehrdeutigkeit von προσφορὰ τῶν ἐθνῶν sowie die mögliche instrumentale bzw. sphärische Auffassung von ἐν πνεύματι ἁγίῳ bleiben angemessen erhalten.
