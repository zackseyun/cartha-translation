  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: de
  text: Darum habe ich in Jesus, dem Messias, Grund zum Rühmen in dem, was Gott betrifft[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »etwas, dessen ich mich rühmen kann« oder »Anlass zum Rühmen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: »in Christus Jesus«; Χριστός wird hier als Titel mit »Messias« wiedergegeben. Traditionell: »in Christus Jesus«.'
    reason: alternative_reading
  - marker: c
    text: 'Auch: »in den Dingen, die Gott betreffen« oder »in den Angelegenheiten Gottes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: habe ich
  rationale: Das Präsens in der ersten Person wird direkt wiedergegeben; zusammen mit »Grund zum Rühmen« ergibt sich eine natürliche deutsche Formulierung.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorher Gesagten und stellt den gedanklichen Anschluss in natürlichem Deutsch her.
- source_word: τὴν καύχησιν
  choice: Grund zum Rühmen
  rationale: Das Substantiv kann sowohl das Rühmen selbst als auch dessen Grundlage bezeichnen. Im Zusammenhang mit ἔχω gibt »Grund zum Rühmen haben« den idiomatischen Sinn verständlich wieder.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Messias Jesus
  rationale: ἐν bleibt als »in« erhalten und bezeichnet den bestimmenden Bereich beziehungsweise die Verbundenheit. Χριστός wird als Titel mit »Messias« übersetzt.
- source_word: τὰ πρὸς τὸν θεόν
  choice: in dem, was Gott betrifft
  rationale: Die Wendung bezeichnet Angelegenheiten, die auf Gott bezogen sind. Die Übersetzung bewahrt ihre Weite und verengt sie nicht ausdrücklich auf Gottesdienst oder priesterlichen Dienst.
- source_word: θεόν
  choice: Gott
  rationale: Die übliche und kontextgemäße Wiedergabe von θεός.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός ist hier als Titel mit dem Namen Jesus verbunden. »Messias« macht die Bedeutung des Titels sichtbar; die traditionelle Form »Christus Jesus« bleibt in der Fußnote genannt.
- issue: Aussagekraft von καύχησις
  choice: Paulus hat in der Verbundenheit mit Messias Jesus Grund zum Rühmen, soweit es um die auf Gott bezogenen Dinge geht.
  alternative: Paulus äußert lediglich allgemeines Selbstvertrauen oder persönliche Freude.
  rationale: Die beiden Bestimmungen »in Messias Jesus« und »was Gott betrifft« begrenzen das Rühmen, ohne die vorhandene Spannung zwischen legitimem Rühmen und Selbstruhm durch eine erklärende Erweiterung des Haupttextes aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch »Grund zum Rühmen haben« idiomatisch gestaltet. Die ungewöhnliche, jedoch verständliche Titelfolge »Messias Jesus« bewahrt die Reihenfolge des Ausgangstextes und macht Χριστός als Titel kenntlich.
