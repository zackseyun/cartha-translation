  rationale: Die einzige Änderung dient der natürlichen modernen deutschen Wiedergabe der Verbindung aus Personenname und Titel. Die appositionelle Fassung erhält die Reihenfolge nicht mechanisch, aber den vollständigen Sinn von Χριστῷ Ἰησοῦ und den bewussten Titelsinn von Χριστός. Satzbedeutung, Ambiguität und Fußnotenanker bleiben unverändert.
