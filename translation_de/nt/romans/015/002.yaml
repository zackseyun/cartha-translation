  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: de
  text: Jeder von uns soll seinem Nächsten gefallen, zu dessen Wohl und um ihn aufzubauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: Jeder von uns
  rationale: Gibt den distributiven Singular mit dem partitiven Genitiv natürlich und genau wieder.
- source_word: τῷ πλησίον
  choice: seinem Mitmenschen
  rationale: Bezeichnet hier ethisch den Nächsten beziehungsweise den anderen Menschen; „Mitmensch“ ist im modernen Deutschen verständlich und vermeidet eine unnötige geschlechtliche Festlegung.
- source_word: ἀρεσκέτω
  choice: soll ... gefallen
  rationale: Bringt den auffordernden Charakter des Imperativs idiomatisch zum Ausdruck, ohne bloßes Gefallenwollen oder Schmeicheln einzutragen.
- source_word: εἰς τὸ ἀγαθὸν
  choice: zu dessen Wohl
  rationale: Kennzeichnet Ziel und Nutzen des Gefallens und wahrt den Bezug auf den Mitmenschen; es geht um das Gute für ihn, nicht um unbedingte Anpassung.
- source_word: πρὸς οἰκοδομήν
  choice: um ihn aufzubauen
  rationale: Bewahrt das griechische Baumotiv in natürlichem Deutsch und gibt den Zweck des Stärkens und Förderns wieder.
theological_decisions:
- issue: Reichweite des Gefallens gegenüber dem Mitmenschen
  choice: Das Gefallen wird durch dessen Wohl und Aufbau bestimmt.
  alternative: Eine uneingeschränkte Aufforderung, anderen in allem zu gefallen.
  rationale: Die beiden Zielangaben εἰς τὸ ἀγαθὸν und πρὸς οἰκοδομήν begrenzen die Aufforderung ausdrücklich auf das, was dem anderen nützt und ihn aufbaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die qualifizierenden Zielangaben klar erkennbar. Die Metapher des Aufbauens bleibt erhalten; auf erklärende Zusätze und konfessionell geprägte Fachsprache wird verzichtet.
