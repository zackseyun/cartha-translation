review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt καὶ γάρ, ὁ Χριστός, die Verneinung und das Psalmzitat insgesamt zutreffend wieder. Die Übersetzung von ἤρεσεν mit „lebte ... zu Gefallen“ erweitert jedoch die knappe Aussage „gefiel ...“ um den Aspekt der gesamten Lebensführung. Außerdem ist ἐπέπεσαν Aorist und sollte ohne sachlichen Anlass nicht als deutsches Perfekt wiedergegeben werden.
  naturalness: „Denn auch der Messias ... gefiel nicht sich selbst“ ist modernes, idiomatisches Standarddeutsch und bleibt näher am griechischen Ausdruck als die umschreibende Lebensführungsformel. Das gehobene „Schmähungen“ passt zum Schriftzitat.
  terminology: „der Messias“ gibt ὁ Χριστός angemessen als Titel wieder; die Fußnotenalternative „Christus“ ist sinnvoll. „Schmähungen“ und „schmähten“ bewahren die im Griechischen vorhandene Wortstammwiederholung.
  issues:
  - severity: medium
    issue: „lebte nicht sich selbst zu Gefallen“ ist gegenüber οὐχ ἑαυτῷ ἤρεσεν interpretierend erweitert.
    rationale: Das griechische Verb ἀρέσκω bedeutet hier unmittelbar „gefallen/zu Gefallen sein“. Ein ausdrücklicher Bezug auf die gesamte Lebensführung steht nicht im Text.
  - severity: low
    issue: „sind auf mich gefallen“ glättet den griechischen Aorist zu einem deutschen Perfekt.
    rationale: „Fielen auf mich“ gibt ἐπέπεσαν als einfaches vergangenes Geschehen näher wieder und ist im Zitat natürlich.
  revised_text: 'Denn auch der Messias[a] gefiel nicht sich selbst, sondern, wie geschrieben steht: »Die Schmähungen derer, die dich schmähten, fielen auf mich.«'
