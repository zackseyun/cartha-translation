id: ROM.15.3
reference: Romans 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: de
  text: 'Denn auch der Messias[a] gefiel nicht sich selbst, sondern, wie geschrieben steht: »Die Schmähungen derer, die dich schmähten, fielen auf mich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«.'
    reason: Alternative Wiedergabe von Χριστός als traditioneller Titel beziehungsweise nameähnliche Bezeichnung.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: Die Verbindung begründet die vorangehende Aufforderung und hebt zugleich den Messias als maßgebendes Beispiel hervor.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Der Artikel und die beispielhafte, repräsentative Funktion sprechen hier für den Titel »Messias«; die traditionelle Wiedergabe »Christus« bleibt als Fußnotenalternative erhalten.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: lebte nicht sich selbst zu Gefallen
  rationale: Die Formulierung gibt das Verb des Gefallens und den reflexiven Bezug natürlich wieder. Das ergänzte »lebte« verdeutlicht im Deutschen, dass es um die Lebensausrichtung und nicht bloß um ein einzelnes Gefallen geht.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: sondern, wie geschrieben steht
  rationale: Dies ist die geläufige deutsche Wiedergabe der Schriftzitat-Formel und bewahrt die fortdauernde Geltung des griechischen Perfekts.
- source_word: ὀνειδισμοί
  choice: Schmähungen
  rationale: »Schmähungen« bezeichnet ehrverletzende Angriffe und wahrt den gehobenen, aber verständlichen Ton des Psalmzitats.
- source_word: τῶν ὀνειδιζόντων σε
  choice: derer, die dich schmähten
  rationale: Die Relativkonstruktion ist im Deutschen natürlich und bewahrt durch »Schmähungen/schmähten« die Wortwiederholung des griechischen Wortstamms.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: sind auf mich gefallen
  rationale: Das Perfekt ist im deutschen Zitat idiomatisch und entspricht zugleich dem Wortlaut der zugrunde liegenden Septuaginta-Tradition; »auf mich gefallen« bildet das griechische Bild direkt ab.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Χριστός erscheint hier mit Artikel und bezeichnet den Gesalbten in seiner repräsentativen Rolle als Vorbild. Die Alternative »Christus« wird nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Identität des Sprechers im Schriftzitat
  choice: Das Zitat bleibt ohne erklärenden Zusatz in der ersten Person stehen.
  alternative: Das »mich« im Haupttext ausdrücklich mit dem Messias identifizieren.
  rationale: Paulus bezieht das Psalmwort auf den Messias; der übersetzte Wortlaut soll jedoch nicht mehr festlegen als der zitierte Text selbst und so seine Spannung bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Psalmzitat bleibt formal genug, um als Schriftwort erkennbar zu sein, ohne veraltete Formen zu verwenden. Der Fußnotenmarker [a] steht unmittelbar bei der betroffenen Übersetzungsentscheidung.
