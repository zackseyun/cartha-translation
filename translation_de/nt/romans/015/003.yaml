revisions:
- from: 'Denn auch der Messias[a] lebte nicht sich selbst zu Gefallen, sondern, wie geschrieben steht: »Die Schmähungen derer, die dich schmähten, sind auf mich gefallen.«'
  to: 'Denn auch der Messias[a] gefiel nicht sich selbst, sondern, wie geschrieben steht: »Die Schmähungen derer, die dich schmähten, fielen auf mich.«'
  rationale: Die Revision entfernt die nicht ausdrücklich im Griechischen enthaltene Auslegung als Lebensausrichtung und gibt den Aorist im Psalmzitat als einfache Vergangenheit wieder. Titelwahl, Register, Schriftzitat-Formel, Wiederholung von „Schmähungen/schmähten“ und Fußnotenanker bleiben erhalten.
