  variant: modern standard German
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: de
  text: Denn sie haben es gern getan, und sie stehen auch in ihrer Schuld. Denn wenn die Nichtjuden[a] an ihren geistlichen Gütern[b] Anteil bekommen haben, sind sie auch verpflichtet, ihnen mit materiellen Gütern[c] zu dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Völker“. Gemeint sind hier die nichtjüdischen Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „an ihren geistlichen Dingen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in den fleischlichen Dingen“; gemeint ist hier materielle oder leibliche Unterstützung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: sie haben es gern getan
  rationale: Das Verb bezeichnet hier willige Zustimmung und Freude; das aus dem Zusammenhang ergänzte „es“ bezieht sich auf die zuvor genannte Sammlung.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: sie stehen auch in ihrer Schuld
  rationale: Die Formulierung gibt die von Paulus behauptete Verpflichtung idiomatisch wieder, ohne sie auf eine rein finanzielle Schuld zu verengen.
- source_word: τὰ ἔθνη
  choice: die Nichtjuden
  rationale: Im paulinischen Zusammenhang sind Menschen aus den Völkern im Gegensatz zu Juden gemeint. „Nichtjuden“ ist im heutigen Deutsch klarer und neutraler als „Heiden“.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: an ihren geistlichen Gütern
  rationale: Das substantivierte Adjektiv meint das, was geistlich ist und woran die Nichtjuden Anteil erhalten haben. „Güter“ macht den Gegensatz zu den materiellen Gütern verständlich; die wörtlichere Wiedergabe wird in einer Fußnote bewahrt.
- source_word: ἐκοινώνησαν
  choice: Anteil bekommen haben
  rationale: κοινωνέω bezeichnet Teilhabe. Die Formulierung ist natürlich und lässt offen, welche geistlichen Gaben oder Heilsgüter im Einzelnen gemeint sind.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: mit materiellen Gütern
  rationale: Im Kontext der Geldsammlung bezeichnet σαρκικός körperlich-materielle Belange und nicht sündiges Verhalten. Die Präposition wird im Deutschen idiomatisch mit „mit“ wiedergegeben.
- source_word: λειτουργῆσαι
  choice: zu dienen
  rationale: λειτουργέω bezeichnet einen Dienst und kann einen feierlich-religiösen Beiklang tragen. „Dienen“ bewahrt den Dienstcharakter, ohne ein kirchliches Amt vorauszusetzen.
theological_decisions:
- issue: Bedeutung von σαρκικοῖς im Gegensatz zu πνευματικοῖς
  choice: materielle Güter
  alternative: fleischliche Dinge
  rationale: Die unmittelbar zuvor erwähnte Sammlung für Jerusalem zeigt, dass materielle beziehungsweise leibliche Unterstützung gemeint ist, nicht sündhaftes oder „fleischliches“ Verhalten.
- issue: Bezug der Pronomen αὐτῶν und αὐτοῖς
  choice: Die Heiligen beziehungsweise jüdischen Gläubigen in Jerusalem
  alternative: Israel oder die Juden im weiteren heilsgeschichtlichen Sinn
  rationale: Der unmittelbare Zusammenhang in Römer 15,25–26 handelt von der Unterstützung der Heiligen in Jerusalem. Die weiter reichende heilsgeschichtliche Beziehung zu Israel bleibt als Hintergrund bestehen, wird aber nicht ausdrücklich in den Text eingesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtjuden“ vermeidet die heute leicht missverständliche Bezeichnung „Heiden“. Die parallele Formulierung „geistliche Güter“ und „materielle Güter“ macht den Gegensatz klar, während die Fußnoten die wörtlicheren Ausdrücke dokumentieren.
