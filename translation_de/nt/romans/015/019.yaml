id: ROM.15.19
reference: Romans 15:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: de
  text: durch die Kraft von Zeichen und Wundern, durch die Kraft des Geistes[a], sodass ich von Jerusalem aus und ringsum bis nach Illyrien das Evangelium des Messias in vollem Umfang verkündet habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine andere Lesart lautet: „des Heiligen Geistes“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher auch: „das Evangelium des Messias erfüllt habe“ oder „zur Fülle gebracht habe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: durch die Kraft
  rationale: Die wiederholte Präpositionalwendung bezeichnet hier das wirksame Mittel beziehungsweise die handelnde Kraft. „Durch die Kraft“ ist im Deutschen natürlich und bewahrt die Wiederholung.
- source_word: σημείων καὶ τεράτων
  choice: Zeichen und Wunder
  rationale: Die feste biblische Wortverbindung bezeichnet außergewöhnliche Taten, die Gottes Wirken bezeugen; die traditionelle deutsche Wiedergabe ist präzise und verständlich.
- source_word: πνεύματος
  choice: des Geistes
  rationale: Im Zusammenhang ist sehr wahrscheinlich Gottes Geist gemeint. „Des Geistes“ bleibt nah am anarthrischen griechischen Ausdruck und fügt „heilig“ nicht stillschweigend hinzu.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: von Jerusalem aus und ringsum
  rationale: κύκλῳ wird adverbial gebraucht und beschreibt den weiträumigen Umkreis der Mission. „Ringsum“ erhält das räumliche Bild, ohne einen genauen Reiseweg festzulegen.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: bis nach Illyrien
  rationale: μέχρι bezeichnet die geografische Ausdehnung. „Illyrien“ ist die geläufige deutsche Bezeichnung für das Illyricum.
- source_word: πεπληρωκέναι
  choice: in vollem Umfang verkündet habe
  rationale: Mit „Evangelium“ als Objekt bezeichnet πληρόω hier am ehesten, dass Paulus die Verkündigung in dem genannten Raum umfassend ausgeführt beziehungsweise zur Fülle gebracht hat. Die Wiedergabe ist idiomatisches Deutsch; die formal mögliche Fassung „erfüllt habe“ bleibt in der Fußnote erhalten.
- source_word: τὸ εὐαγγέλιον
  choice: das Evangelium
  rationale: „Evangelium“ ist im paulinischen Zusammenhang die prägnante und allgemein verständliche deutsche Wiedergabe.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός trägt hier in der Genitivverbindung mit „Evangelium“ erkennbar Titelbedeutung. „Messias“ macht diese Bedeutung für heutige Leser sichtbar und bewahrt zugleich die offene Beziehung des Genitivs.
theological_decisions:
- issue: Referent von πνεύματος
  choice: des Geistes, auf Gottes Heiligen Geist bezogen
  alternative: 'des Heiligen Geistes; oder allgemeiner: des Geistes'
  rationale: Der Zusammenhang von apostolischem Dienst, Zeichen und Wundern spricht deutlich für den Heiligen Geist. Der Haupttext vermeidet dennoch, das im SBLGNT nicht ausdrücklich vorhandene Adjektiv „heilig“ einzufügen.
- issue: Bedeutung von πεπληρωκέναι τὸ εὐαγγέλιον
  choice: das Evangelium in vollem Umfang verkündet haben
  alternative: das Evangelium erfüllt haben
  rationale: Die Verbindung meint im Kontext wahrscheinlich die umfassende Ausführung der Evangeliumsverkündigung im beschriebenen Gebiet. Da πληρόω formal „erfüllen“ oder „zur Fülle bringen“ heißen kann, wird diese Spannung in einer Fußnote offengehalten.
- issue: Genitiv τοῦ Χριστοῦ
  choice: des Messias
  alternative: von dem Messias; Christi
  rationale: Der Genitiv kann das Evangelium als vom Messias stammend oder ihn zum Inhalt habend kennzeichnen. Die knappe Genitivform legt diese Beziehung nicht unnötig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Formulierung „durch die Kraft“ bildet die rhetorische Wiederholung des Griechischen ab. „Ringsum“ hält die geografische Aussage bewusst weit, und „in vollem Umfang verkündet“ vermeidet die im Deutschen missverständliche Formulierung „das Evangelium erfüllt“, ohne sie als mögliche formale Wiedergabe zu verschweigen.
