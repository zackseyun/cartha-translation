source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: de
  text: Ich selbst aber bin im Blick auf euch überzeugt, meine Brüder und Schwestern[a], dass auch ihr selbst voller Güte und mit aller Erkenntnis erfüllt seid und einander ermahnen könnt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „meine Brüder“. Das griechische Wort kann Glaubende insgesamt anreden und schließt hier Frauen wie Männer ein.
    reason: lexical_alternative
  - marker: b
    text: Oder „einander unterweisen“, „einander zurechtweisen“ oder „einander warnen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: bin überzeugt
  rationale: Das Perfekt bezeichnet einen gefestigten gegenwärtigen Zustand; „bin überzeugt“ ist natürlich und bewahrt die nachdrückliche Zuversicht des Paulus.
- source_word: δέ
  choice: aber
  rationale: δέ markiert hier einen milden Übergang mit leichtem Kontrast; deutsches „aber“ fügt sich natürlich in den Gedankengang ein, ohne einen starken Gegensatz zu behaupten.
- source_word: ἀδελφοί μου
  choice: meine Brüder und Schwestern
  rationale: ἀδελφοί ist grammatisch maskulin, kann aber eine gemischte Gemeinschaft von Glaubenden anreden. Die inklusive Wiedergabe macht den tatsächlichen Adressatenkreis im heutigen Deutsch unmittelbar verständlich; die Form des Griechischen wird in der Fußnote erläutert.
- source_word: καὶ αὐτὸς ἐγώ
  choice: ich selbst
  rationale: Die emphatische Verbindung wird knapp und idiomatisch mit „ich selbst“ wiedergegeben.
- source_word: περὶ ὑμῶν
  choice: im Blick auf euch
  rationale: Dies gibt περί mit Genitiv natürlich wieder und vermeidet das im Deutschen leicht missverständliche „von euch überzeugt“.
- source_word: καὶ αὐτοί
  choice: auch ihr selbst
  rationale: „auch“ bewahrt die additive Kraft von καί, „selbst“ die Hervorhebung durch αὐτοί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: voller Güte seid
  rationale: μεστός mit Genitiv bedeutet „voll von“; „voller Güte“ ist würdig, verständlich und bewahrt den ethisch positiven Sinn von ἀγαθωσύνη.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: mit aller Erkenntnis erfüllt
  rationale: Die Perfektpartizipialform beschreibt einen bestehenden Zustand. „Erkenntnis“ entspricht dem hier gemeinten verstehenden Wissen und erhält die umfassende Formulierung πάσης.
- source_word: δυνάμενοι
  choice: könnt
  rationale: Die finite deutsche Form bindet die durch das Partizip ausgedrückte Fähigkeit natürlich in den Satz ein.
- source_word: ἀλλήλους
  choice: einander
  rationale: Direkte und idiomatische Wiedergabe des reziproken Pronomens.
- source_word: νουθετεῖν
  choice: zurechtweisen
  rationale: νουθετέω bezeichnet ein auf Einsicht zielendes, häufig korrigierendes Unterweisen. „Zurechtweisen“ bewahrt diesen korrektiven Zug besser als das allgemeinere „unterweisen“; weitere mögliche Nuancen stehen in der Fußnote.
theological_decisions:
- issue: Geschlecht der Anrede ἀδελφοί bei einer gemischten Gemeinde
  choice: meine Brüder und Schwestern
  alternative: meine Brüder
  rationale: Die Anrede gilt der römischen Glaubensgemeinschaft insgesamt und schließt Frauen ein. Die inklusive Haupttextform gibt den kommunikativen Umfang im modernen Deutsch wieder, während die Fußnote die grammatisch maskuline griechische Form transparent macht.
- issue: Bedeutungsbreite von νουθετεῖν
  choice: einander zurechtweisen
  alternative: einander unterweisen / einander ermahnen / einander warnen
  rationale: Das Verb verbindet Belehrung mit korrigierendem Zuspruch. „Zurechtweisen“ erhält den korrektiven Bestandteil, ohne den Ausdruck auf bloße Warnung zu verengen; die Fußnote wahrt die übrige Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem griechischen Gedankengang nahe, wird aber durch finite Koordination natürlich lesbar. Die Wiederholung der emphatischen Pronomen („ich selbst“, „auch ihr selbst“) bleibt erhalten; echte lexikalische Spannungen werden durch Fußnoten offengelegt.
