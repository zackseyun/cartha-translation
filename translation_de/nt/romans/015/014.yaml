  rationale: Die Revision beschränkt sich auf die Wiedergabe von νουθετεῖν und die zugehörige Fußnote. „Ermahnen“ ist im Deutschen ein etabliertes Wort für korrektiv-helfende Ansprache und wahrt die Bedeutungsweite des griechischen Verbs besser als „zurechtweisen“. Die alternative, stärker rügende Nuance bleibt in der Fußnote erhalten. Die geringfügig angepasste Wortstellung am Satzanfang verbessert zugleich den deutschen Lesefluss, ohne eine Bedeutungsverschiebung.
