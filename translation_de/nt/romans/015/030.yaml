id: ROM.15.30
reference: Romans 15:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: de
  text: Ich bitte euch aber, Brüder[a], bei unserem Herrn Jesus, dem Messias[b], und bei der Liebe des Geistes[c], gemeinsam mit mir zu kämpfen, indem ihr für mich zu Gott betet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ ist im Griechischen grammatisch männlich und kann hier die gesamte Glaubensgemeinschaft, also Brüder und Schwestern, ansprechen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“. Das griechische Christos ist ein Titel und bedeutet „Gesalbter“ oder „Messias“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „die Liebe, die der Geist wirkt“. Der griechische Genitiv kann sowohl die Liebe des Geistes selbst als auch die vom Geist hervorgebrachte Liebe bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Ich ermahne euch
  rationale: Das Verb bezeichnet hier einen eindringlichen Appell. „Ermahne“ bewahrt dessen Nachdruck, ohne die Bitte als bloßen Befehl wiederzugeben.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen leichten Übergang beziehungsweise eine Weiterführung. Das unbetonte „aber“ gibt dies im Deutschen knapp wieder, ohne einen starken Gegensatz zu erzwingen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird formal bewahrt; dass sie hier wahrscheinlich die ganze Glaubensgemeinschaft einschließt, wird in einer Fußnote erläutert.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: durch unseren Herrn Jesus, den Messias
  rationale: διά mit Genitiv bezeichnet hier die Grundlage beziehungsweise Vermittlung des Appells. Χριστός wird als Titel mit „Messias“ wiedergegeben.
- source_word: διὰ τῆς ἀγάπης τοῦ πνεύματος
  choice: durch die Liebe des Geistes
  rationale: Die formale Genitivkonstruktion bewahrt die Mehrdeutigkeit zwischen der Liebe des Geistes und einer vom Geist bewirkten Liebe.
- source_word: συναγωνίσασθαί μοι
  choice: Kämpft gemeinsam mit mir
  rationale: Die Wiedergabe erhält sowohl die intensive, kämpferische Bildsprache als auch das durch συν- bezeichnete gemeinsame Handeln.
- source_word: ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: indem ihr für mich zu Gott betet
  rationale: Die instrumentale beziehungsweise modale Funktion von ἐν wird im Deutschen natürlich als Nebensatz ausgedrückt; ὑπέρ bezeichnet die Fürbitte für Paulus und πρός deren Ausrichtung auf Gott.
theological_decisions:
- issue: Bezug und Genitivfunktion von τοῦ πνεύματος
  choice: „Geist“ als Heiliger Geist; die Genitivbeziehung bleibt offen
  alternative: menschlicher Geist; ausdrücklich „die Liebe, die der Geist wirkt“ oder „die Liebe des Geistes selbst“
  rationale: Der paulinische Sprachgebrauch legt den Heiligen Geist nahe. Die Großschreibung signalisiert dies, während die mehrdeutige Genitivkonstruktion nicht auf eine einzige Deutung festgelegt wird.
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: Χριστός ist hier der Titel des Herrn Jesus. „Messias“ macht dessen Bedeutung als „Gesalbter“ transparent; die traditionelle Wiedergabe wird in der Fußnote genannt.
- issue: Adressaten von ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die Form des griechischen Ausdrucks bleibt im Haupttext sichtbar, während die wahrscheinliche inklusive Reichweite in der Fußnote erläutert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den langen Satz natürlich. „Kämpft gemeinsam mit mir“ erhält die kraftvolle Bildsprache des griechischen Verbs; „indem ihr … betet“ macht deutlich, dass dieses gemeinsame Ringen im Gebet geschieht.
