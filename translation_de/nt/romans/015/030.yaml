  to: Ich bitte euch aber, Brüder[a], bei unserem Herrn Jesus, dem Messias[b], und bei der Liebe des Geistes[c], gemeinsam mit mir zu kämpfen, indem ihr für mich zu Gott betet.
  rationale: „Ich bitte euch“ ist für παρακαλῶ in diesem persönlichen Fürbittenappell idiomatischer als „Ich ermahne euch“, ohne den Nachdruck zu verlieren. Die Formel „bei … und bei …“ gibt die appellative Funktion der beiden διά-Phrasen natürlich wieder. Der abhängige Infinitiv „gemeinsam mit mir zu kämpfen“ entspricht der griechischen Konstruktion und lässt zugleich erkennen, dass das gemeinsame Ringen im Gebet geschieht.
