  terminology: Für δοξάσαι ist „verherrlichen“ die genauere Entsprechung und unterscheidet es sinnvoll von ἐξομολογήσομαί („preisen“). „Unter den Völkern“ für ἐν ἔθνεσι und „deinem Namen Loblieder singen“ für τῷ ὀνόματί σου ψαλῶ sind tragfähig. Eine Fußnote ist nicht erforderlich, da „Völker“ die im Zitat mitschwingende weitere Bedeutung von ἔθνη wahrt.
