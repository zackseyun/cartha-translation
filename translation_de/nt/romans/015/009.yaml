id: ROM.15.9
reference: Romans 15:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: de
  text: 'Die Völker aber Gott für sein Erbarmen verherrlichen. So steht es geschrieben: »Darum will ich dich unter den Völkern preisen und deinem Namen Loblieder singen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ δὲ ἔθνη
  choice: die Völker aber
  rationale: ἔθνη bezeichnet im Römerbrief häufig die nichtjüdischen Völker. „Die Völker“ ist im Deutschen natürlich, wahrt zugleich den Bezug auf die Nationen im Zitat und vermeidet den heute erklärungsbedürftigen Ausdruck „Heiden“.
- source_word: ὑπὲρ ἐλέους
  choice: für sein Erbarmen
  rationale: ὑπέρ mit Genitiv bezeichnet hier den Grund des Lobpreises. Das Possessivpronomen macht den im Zusammenhang eindeutigen Bezug auf Gottes Erbarmen verständlich.
- source_word: δοξάσαι
  choice: preisen
  rationale: Das Verb meint hier, Gott Ehre zu geben. „Preisen“ fügt sich natürlich in den deutschen Satz ein und verbindet den einleitenden Gedanken sprachlich mit dem folgenden Lobzitat.
- source_word: καθὼς γέγραπται
  choice: So steht es geschrieben
  rationale: Eine geläufige und würdevolle deutsche Wiedergabe der neutestamentlichen Schriftformel.
- source_word: ἐξομολογήσομαί σοι
  choice: will ich dich … preisen
  rationale: Im Kontext des öffentlichen Gotteslobs bezeichnet das Verb Preisen oder Danksagen, nicht das Bekennen von Sünde. „Dich preisen“ gibt das personale Objekt im Deutschen natürlich wieder.
- source_word: ἐν ἔθνεσι
  choice: unter den Völkern
  rationale: 'Die Präposition ist hier lokal beziehungsweise sozial zu verstehen: mitten unter den Völkern. Die Wiederholung von „Völker“ bewahrt die lexikalische Verbindung zu τὰ ἔθνη.'
- source_word: τῷ ὀνόματί σου ψαλῶ
  choice: deinem Namen Loblieder singen
  rationale: ψάλλω bezeichnet hier gesungenes Gotteslob. „Loblieder singen“ ist verständlich und bewahrt mit „deinem Namen“ die biblische Ausdrucksweise.
theological_decisions:
- issue: Syntaktische Abhängigkeit des eröffnenden Infinitivs
  choice: 'Der Vers wird als Fortsetzung von Vers 8 wiedergegeben: „die Völker aber Gott für sein Erbarmen preisen“.'
  alternative: 'Ein isoliertes Fragment: „und die Völker, Gott für Erbarmen zu verherrlichen“.'
  rationale: δοξάσαι hängt syntaktisch vom vorhergehenden Satz ab. Die fragmentarische Form wahrt bei Einzelversdarstellung diese Verbindung, ohne ein zusätzliches Modalverb einzuführen oder den Zusammenhang eigenmächtig zu vervollständigen.
- issue: Bedeutungsumfang von ἔθνη
  choice: „Völker“ an beiden Stellen
  alternative: „Nichtjuden“ im ersten Satz und „Völker“ im Zitat; traditionell auch „Heiden“.
  rationale: Paulus bezieht den Ausdruck auf Menschen außerhalb Israels, während das Schriftzitat zugleich den weiteren Sinn „Völker/Nationen“ trägt. Die einheitliche Wiedergabe erhält diese Spannung und die Wortverknüpfung im Argument.
- issue: Erbarmen gegenüber den Völkern
  choice: „für sein Erbarmen“
  alternative: „wegen des Erbarmens“ ohne ausdrücklichen Besitzer
  rationale: Der Zusammenhang identifiziert Gott als Ursprung des Erbarmens. Die Ergänzung „sein“ dient der deutschen Klarheit, ohne die Aussage konfessionell auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Völker“ ist gegenüber dem missverständlichen oder abwertend klingenden „Heiden“ vorzuziehen. Das eröffnende Satzfragment bildet bewusst die syntaktische Fortsetzung aus Römer 15,8 ab.
