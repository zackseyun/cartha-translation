  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: de
  text: Jetzt aber reise ich nach Jerusalem, um den Heiligen zu dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während ich den Heiligen diene“. Gemeint ist wahrscheinlich, dass Paulus ihnen die Sammlung als Unterstützung bringt; siehe Vers 26.'
    reason: Das Partizip διακονῶν kann den Zweck oder den Begleitumstand der Reise bezeichnen und meint hier im Kontext wohl praktische Hilfe.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Jetzt aber
  rationale: νυνί bezeichnet betont die gegenwärtige Zeit; δέ markiert einen leichten Gegensatz beziehungsweise Übergang. „Jetzt aber“ gibt beides knapp und natürlich wieder.
- source_word: πορεύομαι
  choice: reise ich
  rationale: Das Verb bezeichnet hier die Bewegung beziehungsweise bevorstehende Reise nach Jerusalem. „reise ich“ passt zum weiteren Weg und ist im Deutschen natürlicher als das unspezifische „gehe ich“.
- source_word: εἰς Ἰερουσαλὴμ
  choice: nach Jerusalem
  rationale: εἰς bezeichnet mit dem Städtenamen das Ziel der Bewegung; im Deutschen steht dafür idiomatisch „nach Jerusalem“.
- source_word: διακονῶν
  choice: um … zu dienen
  rationale: Das präsentische Partizip kann Begleitumstand oder Zweck ausdrücken. Im unmittelbaren Zusammenhang mit der Sammlung für Jerusalem liegt praktischer Dienst als Zweck der Reise nahe, ohne dass der Haupttext die konkrete Hilfe bereits ausdrücklich benennt.
- source_word: τοῖς ἁγίοις
  choice: den Heiligen
  rationale: In den Paulusbriefen bezeichnet οἱ ἅγιοι gewöhnlich die an Christus Glaubenden. „die Heiligen“ bewahrt die Wortwahl und ist als biblische Bezeichnung im Deutschen verständlich.
theological_decisions:
- issue: Bezug von „den Heiligen“
  choice: Die Formulierung bleibt im Haupttext allgemein und bezeichnet im Kontext die Glaubenden in Jerusalem, besonders die Bedürftigen unter ihnen.
  alternative: Explizit „den Glaubenden in Jerusalem“ oder „den Armen unter den Heiligen in Jerusalem“ zu schreiben.
  rationale: Der unmittelbare Kontext von Römer 15,26 klärt den Empfängerkreis, doch Vers 25 selbst sagt nur „den Heiligen“. Die Übersetzung bewahrt diese Textgrenze.
- issue: Art des Dienstes
  choice: „dienen“ im Haupttext, mit Erläuterung der wahrscheinlich gemeinten praktischen Hilfe in der Fußnote.
  alternative: „ihnen Hilfe zu bringen“ direkt im Haupttext.
  rationale: διακονῶν hat einen breiteren Bedeutungsumfang als allein das Überbringen der Sammlung. Der Kontext legt diese konkrete Handlung nahe, doch die lexikalische Offenheit soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „reisen“ gibt eine längere Wegbewegung idiomatisch wieder; „den Heiligen dienen“ bewahrt den paulinischen Sprachgebrauch, während die Fußnote die konkrete Hilfe und die grammatische Mehrdeutigkeit erklärt.
