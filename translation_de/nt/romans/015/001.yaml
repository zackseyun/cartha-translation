id: ROM.15.1
reference: Romans 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: de
  text: Wir aber, die Starken, sind verpflichtet, die Schwächen der Schwachen[a] zu tragen und nicht uns selbst zu gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Unzulänglichkeiten der Schwachen“. Das griechische Wort kann Schwächen, Begrenzungen oder Fehlleistungen bezeichnen; hier geht es wahrscheinlich um die im vorigen Kapitel behandelten Gewissensbedenken und Einschränkungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: sind verpflichtet
  rationale: Gibt die im Indikativ ausgedrückte moralische Verpflichtung klar und natürlich wieder; es ist verbindlicher als „sollten“, ohne die Aussage in einen direkten Imperativ umzuwandeln.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den leichten Übergang und zugleich den Gegensatz zum selbstbezogenen Verhalten im vorausgehenden Zusammenhang.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: wir aber, die Starken
  rationale: Bewahrt die Hervorhebung des Pronomens und den substantivischen Gebrauch des Adjektivs; „die Starken“ entspricht dem Gegensatz zu den Schwachen in Römer 14–15.
- source_word: τὰ ἀσθενήματα
  choice: die Schwächen
  rationale: Der Ausdruck kann Schwächen, Begrenzungen oder Fehlleistungen bezeichnen. „Schwächen“ bleibt weit genug und vermeidet eine unnötig moralische Verurteilung.
- source_word: τῶν ἀδυνάτων
  choice: der Schwachen
  rationale: Erhält den kontextuellen Gegensatz zwischen Starken und Schwachen; gemeint sind hier vor allem Unterschiede in der Gewissensfreiheit.
- source_word: βαστάζειν
  choice: zu tragen
  rationale: Bewahrt das Bild des Lastentragens und drückt mehr als bloßes Dulden aus.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: und nicht uns selbst zu gefallen
  rationale: Gibt die reflexive Konstruktion eng am Griechischen wieder und bewahrt den ethischen Gegensatz zur Rücksichtnahme auf andere.
theological_decisions:
- issue: Bedeutung von „die Starken“ und „die Schwachen“
  choice: Die Bezeichnungen beziehen sich im Zusammenhang vor allem auf Glaubende mit unterschiedlicher Gewissensfreiheit.
  alternative: Sozial Mächtige und Machtlose oder körperlich Starke und Schwache.
  rationale: Der unmittelbare Kontext in Römer 14 behandelt Streitfragen über Speisen und Tage; deshalb stehen Einschränkungen und Skrupel des Gewissens im Vordergrund, ohne dass die Begriffe in der Übersetzung erklärend verengt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarige Formulierung „die Starken … der Schwachen“ bewahrt den rhetorischen Gegensatz. „Uns selbst zu gefallen“ klingt bewusst etwas gehoben, bleibt aber gut verständlich und folgt der Bild- und Gedankenführung des Ausgangstextes.
