id: ROM.15.29
reference: Romans 15:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: de
  text: Ich weiß aber, dass ich, wenn ich zu euch komme, in der Fülle des Segens des Messias[a] kommen werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus.'
    reason: Alternative traditionelle Wiedergabe des Titels Χριστός.
lexical_decisions:
- source_word: οἶδα
  choice: ich weiß
  rationale: Gibt die von Paulus ausgedrückte Gewissheit direkt wieder, ohne sie zu einer bloßen Überzeugung abzuschwächen.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet hier eine leichte Weiterführung mit kontrastierendem Unterton; „aber“ ist im Zusammenhang natürlich, ohne einen scharfen Gegensatz zu erzwingen.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: wenn ich zu euch komme
  rationale: Das Partizip ist zeitlich auf das zukünftige Hauptverb bezogen. Der Nebensatz gibt diese Beziehung in natürlichem Deutsch wieder.
- source_word: ἐλεύσομαι
  choice: werde ich … kommen
  rationale: Bewahrt die einfache Zukunftsaussage des griechischen Verbs und die im Ausgangstext vorhandene Wiederaufnahme des Kommens.
- source_word: ἐν πληρώματι
  choice: in der ganzen Fülle
  rationale: Erhält das Bild von Vollständigkeit und Überfluss; „ganzen“ verdeutlicht idiomatisch den umfassenden Sinn von πλήρωμα.
- source_word: εὐλογίας
  choice: des Segens
  rationale: Der Genitiv bezeichnet den Inhalt beziehungsweise die Art der Fülle. Die bestimmte Form ist im Deutschen idiomatisch.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet hier den messianischen Titel. „Messias“ macht dessen Bedeutung transparent und der Genitiv bleibt hinsichtlich Quelle, Zugehörigkeit oder Prägung des Segens offen.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / von Christus
  rationale: Die Übersetzung als Titel wahrt die Bedeutung von Χριστός. Die traditionelle Wiedergabe „Christus“ ist möglich und wird in der Fußnote genannt; die Genitivbeziehung wird nicht enger bestimmt.
- issue: Beziehung zwischen εὐλογίας und Χριστοῦ
  choice: des Segens des Messias
  alternative: des vom Messias kommenden Segens
  rationale: Die doppelte Genitivkonstruktion bewahrt die Offenheit des Griechischen, statt Χριστοῦ ausschließlich als Herkunftsangabe auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt trotz der eingebetteten Zeitangabe gut verständlich und bewahrt die betonte Fülle sowie die Wiederholung des Verbs „kommen“.
