revisions:
- from: Wenn ich dies nun abgeschlossen und ihnen diesen Ertrag versiegelt[a] habe, werde ich über euch[b] nach Spanien reisen.
  to: Wenn ich dies also abgeschlossen und ihnen diesen Ertrag versiegelt[a] habe, werde ich über Rom[b] nach Spanien reisen.
  rationale: Die Änderung ersetzt allein die im Deutschen unidiomatische und räumlich missverständliche Wendung „über euch“ durch „über Rom“, den aus den Briefadressaten erschließbaren Ortsbezug. Die Fußnote wahrt die Formulierung des griechischen Textes. Außerdem gibt „also“ die inferentielle Funktion von οὖν klar wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:47:53Z'
review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur und die vorzeitigen Handlungen vor dem zukünftigen Aufbruch sind zutreffend wiedergegeben. „Über euch“ ist im Deutschen jedoch keine verständliche räumliche Wegangabe, wenn die Angesprochenen eine Gemeinde sind. Da der Brief an die Christen in Rom gerichtet ist und δι’ ὑμῶν hier den Weg über ihren Ort bezeichnet, macht „über Rom“ den impliziten Ortsbezug idiomatisch explizit. Die Fußnote bewahrt die wörtlichere Alternative und die begrenzte Auslegungsunsicherheit.
  naturalness: „Wenn ich dies also abgeschlossen ... habe“ ist modernes Standarddeutsch. „Über Rom nach Spanien reisen“ ist natürlich und verständlich; „über euch nach Spanien reisen“ ist es nicht.
  terminology: „versiegelt“ bewahrt die mehrdeutige Metapher von σφραγίζω. „Ertrag“ ist als übertragene Wiedergabe von καρπός möglich, wird aber durch die Fußnote sachgerecht als Sammlung erläutert. „Also“ gibt οὖν als Schlussfolgerung klarer wieder als das hier potenziell temporale „nun“.
  issues:
  - severity: medium
    issue: „über euch“ als Wiedergabe von δι’ ὑμῶν
    rationale: Im modernen Deutschen kann man nicht idiomatisch über eine Personengruppe reisen. Die Formulierung ist daher missverständlich und unnatürlich. Der durch den Briefkontext eindeutig identifizierbare Ortsbezug Rom kann im Haupttext genannt werden; die Fußnote dokumentiert die wörtlichere Formulierung „durch euch“.
  revised_text: Wenn ich dies also abgeschlossen und ihnen diesen Ertrag versiegelt[a] habe, werde ich über Rom[b] nach Spanien reisen.
  revised_footnotes:
