source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: de
  text: Wenn ich dies also abgeschlossen und ihnen diesen Ertrag versiegelt[a] habe, werde ich über Rom[b] nach Spanien reisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen diesen Ertrag sicher übergeben“. Mit „diesem Ertrag“ ist die Geldsammlung der nichtjüdischen Gläubigen für die Gläubigen in Jerusalem gemeint.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Wörtlich: „durch euch“. Paulus meint wahrscheinlich, dass er auf seiner Reise nach Spanien über Rom kommen will.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Wenn ich dies nun abgeschlossen habe
  rationale: Die temporale Konstruktion gibt die vorzeitige Handlung des Aoristpartizips gegenüber dem zukünftigen Hauptverb natürlich wieder; „nun“ markiert den folgernden Übergang, ohne ihn zu überbetonen.
- source_word: σφραγισάμενος αὐτοῖς
  choice: ihnen … versiegelt habe
  rationale: „Versiegelt“ bewahrt die konkrete, im Kontext jedoch mehrdeutige Metapher von σφραγίζω. Der Dativ αὐτοῖς wird mit „ihnen“ wiedergegeben.
- source_word: τὸν καρπὸν τοῦτον
  choice: diesen Ertrag
  rationale: „Ertrag“ erhält die Fruchtmetaphorik in einer im Deutschen natürlichen übertragenen Bedeutung; gemeint ist im Zusammenhang die Geldsammlung.
- source_word: ἀπελεύσομαι
  choice: werde ich … reisen
  rationale: Das zukünftige Weiterziehen wird im Reisezusammenhang idiomatisch mit „reisen“ ausgedrückt.
- source_word: δι’ ὑμῶν
  choice: über euch
  rationale: διά mit Genitiv bezeichnet hier wahrscheinlich den Reiseweg über die Adressaten beziehungsweise Rom. Die knappe Formulierung lässt mögliche Unterstützung durch sie unausgesprochen.
- source_word: εἰς Σπανίαν
  choice: nach Spanien
  rationale: Natürliche deutsche Richtungsangabe für das Reiseziel.
theological_decisions:
- issue: Bedeutung der Wendung, den Ertrag für die Empfänger zu „versiegeln“
  choice: Die Metapher „versiegelt“ bleibt im Haupttext erhalten.
  alternative: ihnen diesen Ertrag sicher übergeben / ihnen diese Gabe ordnungsgemäß aushändigen
  rationale: σφραγίζω kann hier die gesicherte oder förmlich bestätigte Übergabe der Sammlung bezeichnen. Da die genaue Nuance umstritten ist, soll der Haupttext sie nicht auf nur eine Deutung festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Versiegelungsmetapher wird zur Wahrung der Mehrdeutigkeit beibehalten und in einer Fußnote erläutert.
