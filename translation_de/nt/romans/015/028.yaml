    text: 'Oder: „ihnen diesen Ertrag sicher übergeben“. Mit „diesem Ertrag“ ist die Geldsammlung der nichtjüdischen Gläubigen für die Gläubigen in Jerusalem gemeint.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Wörtlich: „durch euch“. Paulus meint wahrscheinlich, dass er auf seiner Reise nach Spanien über Rom kommen will.'
    reason: lexical_alternative
