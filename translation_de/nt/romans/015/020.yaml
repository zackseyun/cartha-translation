  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: de
  text: Und dabei setze ich meinen Ehrgeiz darein, die gute Nachricht nicht dort zu verkünden, wo der Messias genannt worden ist, damit ich nicht auf dem Fundament eines anderen baue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Und dabei
  rationale: Verbindet den Satz natürlich mit der vorausgehenden Darstellung von Paulus’ Dienst und gibt den milden Anschluss durch δέ wieder.
- source_word: φιλοτιμούμενον
  choice: setze ich meine Ehre darein
  rationale: Die deutsche Wendung bewahrt sowohl den Gedanken persönlichen Ehrgeizes als auch den im Verb enthaltenen Bezug auf Ehre und ernsthaftes Streben.
- source_word: εὐαγγελίζεσθαι
  choice: die gute Nachricht zu verkünden
  rationale: Gibt den verbalen Charakter des griechischen Ausdrucks verständlich und ohne unnötige kirchliche Fachsprache wieder.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: nur dort ..., wo Christus noch nicht genannt worden ist
  rationale: Die positiv formulierte deutsche Wendung entspricht idiomatisch der griechischen Negation und bringt aus dem Kontext die bis dahin fehlende Verkündigung zum Ausdruck. Χριστός wird im erwartbaren deutschen Register des Römerbriefs als „Christus“ wiedergegeben.
- source_word: ἵνα μὴ
  choice: damit ich nicht
  rationale: Gibt den negierten Zwecksatz klar und unmittelbar wieder.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: auf dem Fundament eines anderen
  rationale: Bewahrt das Bild vom Bauen und vermeidet es, ein im Griechischen nicht ausdrücklich genanntes männliches Bezugswort einzufügen.
- source_word: οἰκοδομῶ
  choice: baue
  rationale: Erhält zusammen mit „Fundament“ die konkrete Baumetapher für apostolische Arbeit.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: der Messias
  rationale: Im Deutschen ist „Christus“ hier die natürliche und quellentreue Titelform. „Messias“ wäre sachlich möglich, würde jedoch gegenüber dem üblichen Sprachgebrauch des Römerbriefs stärker interpretierend wirken.
- issue: Reichweite von Paulus’ Missionsgrundsatz
  choice: als persönliche Zielsetzung des Paulus formuliert
  alternative: als allgemeines Verbot, an bereits evangelisierten Orten zu wirken
  rationale: Die erste Person und φιλοτιμούμενον kennzeichnen Paulus’ eigenes missionarisches Streben; der Text wird daher nicht zu einer universalen Vorschrift erweitert.
- issue: Bedeutung von ὠνομάσθη
  choice: noch nicht genannt worden ist
  alternative: noch nicht bekannt war / noch nicht verkündet worden ist
  rationale: Die wörtliche Namensmetaphorik bleibt erhalten, während „noch nicht“ die im Kontext vorausgesetzte missionarische Situation idiomatisch ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Baumetapher bleibt unverändert erhalten; der Satz ist flüssig, ohne die Aussage zu einer allgemeinen Missionsregel auszubauen.
