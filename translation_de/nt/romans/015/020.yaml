revisions:
- from: Und dabei setze ich meine Ehre darein, die gute Nachricht nur dort zu verkünden, wo Christus noch nicht genannt worden ist, damit ich nicht auf dem Fundament eines anderen baue.
  to: Und dabei setze ich meinen Ehrgeiz darein, die gute Nachricht nicht dort zu verkünden, wo der Messias genannt worden ist, damit ich nicht auf dem Fundament eines anderen baue.
  rationale: Die Revision folgt der griechischen Negation direkt, vermeidet nicht ausdrücklich gekennzeichnete zeitliche oder exklusive Zusätze und übernimmt die dokumentierte titelbezogene Wiedergabe von Χριστός als „der Messias“. Die Metapher von Fundament und Bauen sowie der persönliche Charakter von Paulus’ Zielsetzung bleiben erhalten.
