  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: de
  text: Der Gott des Friedens sei mit euch allen. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier nur schwach verbindend beziehungsweise überleitend. In der knappen deutschen Schlusssegnung ist kein ausdrückliches Bindewort nötig; insbesondere wäre ein zeitliches „nun“ sachlich irreführend.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: der Gott des Friedens
  rationale: Die genitivische Gottesbezeichnung wird direkt und in ihrer vertrauten paulinischen Form wiedergegeben.
- source_word: εἰρήνης
  choice: Frieden
  rationale: „Frieden“ ist die natürliche Entsprechung und lässt den umfassenderen Sinn von Heil, Wohlergehen und versöhnter Gemeinschaft offen mitschwingen.
- source_word: μετὰ πάντων ὑμῶν
  choice: sei mit euch allen
  rationale: Die griechische Segensformel ist verblos; „sei“ ergänzt im Deutschen idiomatisch den Wunschcharakter. „Euch allen“ bewahrt die ausdrückliche umfassende Reichweite von πάντων.
- source_word: ἀμήν
  choice: Amen
  rationale: Die eingebürgerte liturgische Schlussformel wird beibehalten.
theological_decisions:
- issue: Verbloser Satz als Feststellung oder Segenswunsch
  choice: 'Als Segenswunsch: „Der Gott des Friedens sei mit euch allen.“'
  alternative: „Der Gott des Friedens ist mit euch allen.“
  rationale: Obwohl im Griechischen kein Verb steht, legt die epistolische Schlussformel einen Wunsch beziehungsweise Segen nahe. Der deutsche Konjunktiv „sei“ gibt diese Funktion knapp wieder, ohne den Satz zu einer Tatsachenbehauptung umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und liturgisch natürlich. Keine Fußnoten erforderlich.
