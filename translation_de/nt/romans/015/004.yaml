id: ROM.15.4
reference: Romans 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: de
  text: Denn alles, was früher geschrieben wurde, wurde zu unserer Unterweisung geschrieben, damit wir durch die Standhaftigkeit und durch die Ermutigung der Schriften[a] Hoffnung haben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Trost der Schriften“ beziehungsweise „durch die Ermahnung der Schriften“; das griechische Wort kann Ermutigung, Trost oder Ermahnung bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit wir Hoffnung haben können“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: alles, was
  rationale: Die umfassende Bedeutung des neutralen Plurals wird im Deutschen natürlich und präzise mit „alles, was“ wiedergegeben.
- source_word: προεγράφη
  choice: früher geschrieben wurde
  rationale: Gibt die zeitliche Bedeutung des Präfixes προ- wieder und vermeidet die hier unpassende Bedeutung eines öffentlichen Bekanntmachens.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: zu unserer Unterweisung
  rationale: „Unterweisung“ bezeichnet den bildenden Zweck der früheren Schriften; „zu“ bewahrt die Zielrichtung von εἰς.
- source_word: ἐγράφη
  choice: wurde ... geschrieben
  rationale: Die Wiederholung von „geschrieben“ erhält die rhetorische Betonung des griechischen Satzes.
- source_word: ἵνα
  choice: damit
  rationale: Drückt den Zweck beziehungsweise das beabsichtigte Ergebnis idiomatisch aus.
- source_word: διὰ τῆς ὑπομονῆς
  choice: durch die Standhaftigkeit
  rationale: ὑπομονή meint beharrliches Ausharren unter Belastung; „Standhaftigkeit“ ist würdig und im Zusammenhang mit Hoffnung gut verständlich.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: durch die Ermutigung der Schriften
  rationale: „Ermutigung“ bewahrt die stärkende Funktion von παράκλησις, ohne den Ausdruck ausschließlich auf Trost oder Ermahnung festzulegen. Der Genitiv bleibt eng bei „Ermutigung“.
- source_word: τῶν γραφῶν
  choice: der Schriften
  rationale: Der bestimmte Ausdruck bezeichnet im paulinischen Kontext die heiligen Schriften; die Großschreibung kennzeichnet diesen Bezug.
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: Hoffnung haben
  rationale: Die artikellose deutsche Form ist bei dem abstrakten Substantiv idiomatisch; der Präsenskonjunktiv nach ἵνα wird durch den damit-Satz angemessen wiedergegeben.
theological_decisions:
- issue: Wie die Schriften Standhaftigkeit, Ermutigung und Hoffnung vermitteln
  choice: 'Die griechische Zuordnung wird beibehalten: „der Schriften“ steht unmittelbar bei „Ermutigung“, während der Satz offenlässt, in welchem genaueren Sinn Standhaftigkeit und Ermutigung durch die Schriften entstehen.'
  alternative: Man könnte ausdrücklich von der Standhaftigkeit und Ermutigung sprechen, „die die Schriften schenken“ oder „die aus den Schriften kommen“.
  rationale: Eine explizitere Formulierung würde die genitivische Beziehung auslegen und die echte syntaktische und theologische Offenheit des Ausgangstextes verengen.
- issue: Modalität von ἔχωμεν im Zwecksatz
  choice: „damit wir ... Hoffnung haben“
  alternative: „damit wir ... Hoffnung haben können“
  rationale: Der deutsche damit-Satz gibt den griechischen Konjunktiv bereits wieder. „Können“ würde zusätzlich eine Fähigkeitsnuance einführen, die im Ausgangstext nicht ausdrücklich vorhanden ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Formulierung „geschrieben wurde ... geschrieben“ und die parallelen Wendungen mit „durch“ wurden zur Wahrung der paulinischen Rhetorik beibehalten.
