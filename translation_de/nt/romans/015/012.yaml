id: ROM.15.12
reference: Romans 15:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: de
  text: 'Und weiter sagt Jesaja: »Die Wurzel Isais wird da sein, und der, der aufsteht, um über die Völker zu herrschen; auf ihn werden die Völker hoffen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: die Wurzel Isais
  rationale: Bewahrt das messianische Bild und den Namen in der im Deutschen etablierten Form.
- source_word: ἔσται
  choice: wird da sein
  rationale: Gibt das futurische Sein wieder, ohne es deutend zu »wird kommen« umzuschreiben; »da sein« klingt im Deutschen vollständiger als ein bloßes »sein«.
- source_word: ὁ ἀνιστάμενος
  choice: der, der aufsteht
  rationale: Bewahrt die Mehrdeutigkeit des Partizips und legt es nicht ausdrücklich auf Auftreten, Erhebung oder Auferstehung fest.
- source_word: ἄρχειν ἐθνῶν
  choice: um über die Völker zu herrschen
  rationale: Gibt den finalen Infinitiv und den Herrschaftssinn von ἄρχω natürlich wieder. ἔθνη bezeichnet hier im Jesaja-Zitat die nichtjüdischen Völker, doch »Völker« bewahrt den Wortlaut und Kontextbezug.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: auf ihn werden ... hoffen
  rationale: Entspricht der üblichen deutschen Verbindung »auf jemanden hoffen« und wahrt den personalen Bezug.
theological_decisions:
- issue: Beziehung zwischen »Wurzel Isais« und »der, der aufsteht«
  choice: mit »und« als zwei grammatisch verbundene Bezeichnungen wiedergegeben
  alternative: 'appositionell: »die Wurzel Isais, nämlich der, der aufsteht«'
  rationale: Das griechische καί wird beibehalten; die Identität der beiden Bezeichnungen wird nicht durch eine erklärende Apposition stärker festgelegt, als es der Wortlaut tut.
- issue: Möglicher Auferstehungsanklang von ἀνιστάμενος
  choice: »aufsteht«
  alternative: »sich erhebt« oder »auftritt«
  rationale: »Aufsteht« wahrt den möglichen Anklang, behauptet aber nicht ausdrücklich, dass hier die Auferstehung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche prophetische Bildsprache und die syntaktische Spannung des Zitats bleiben bewusst erhalten; »Völker« ist verständlich und weniger konfessionell vorgeprägt als »Heiden«.
