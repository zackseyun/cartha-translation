  naturalness: „Von den Heiligen wohlwollend angenommen wird“ ist modernes, natürliches Standarddeutsch und verdeutlicht zugleich, dass die Heiligen die Empfänger und Beurteilenden der Annahme sind. „Heilige“ ist als paulinischer Terminus im würdigen Register angemessen.
  terminology: „Ungehorsam“ bewahrt die semantische Weite von ἀπειθούντων; die Fußnote hält die kontextuell mögliche Bedeutung des Nichtglaubens offen. „Dienst“ und „Heilige“ sind passend und terminologisch konsistent.
