id: ROM.15.31
reference: Romans 15:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: de
  text: damit ich vor denen gerettet werde, die in Judäa ungehorsam sind,[a] und damit mein Dienst für Jerusalem von den Heiligen wohlwollend angenommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor denen in Judäa, die nicht glauben«. Das griechische Wort kann sowohl die Weigerung zu glauben als auch Ungehorsam bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit … und damit
  rationale: Leitet die beiden koordinierten Gebetsanliegen des Paulus ein; die Wiederholung von „damit“ macht ihren Zusammenhang im Deutschen klar.
- source_word: ῥυσθῶ
  choice: ich … gerettet werde
  rationale: Das passive Konjunktivverb bezeichnet die erbetene Rettung aus einer konkreten Gefahr, ohne die Art dieser Rettung näher festzulegen.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: vor denen …, die … ungehorsam sind
  rationale: ἀπειθέω kann sowohl Ungehorsam als auch die Weigerung zu glauben bezeichnen. „Ungehorsam“ bewahrt die weitere Bedeutung; die kontextuell mögliche Wiedergabe mit „nicht glauben“ steht in der Fußnote.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: in Judäa
  rationale: Gebräuchliche deutsche Bezeichnung des geografischen Gebiets; die Wendung wird natürlich in den Relativsatz eingebunden.
- source_word: διακονία
  choice: Dienst
  rationale: Bezeichnet hier den praktischen Dienst des Paulus im Zusammenhang mit der Gabe für Jerusalem, ohne ihn auf die Geldhilfe allein zu verengen.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: für Jerusalem
  rationale: Gibt die Ausrichtung des Dienstes auf Jerusalem idiomatisch wieder.
- source_word: εὐπρόσδεκτος
  choice: willkommen
  rationale: Drückt aus, dass der Dienst günstig und bereitwillig aufgenommen werden soll; das ist im heutigen Deutsch natürlicher als „annehmbar“.
- source_word: τοῖς ἁγίοις
  choice: bei den Heiligen
  rationale: Bewahrt die für Paulus typische Bezeichnung der Glaubenden und gibt den griechischen Dativ als Personenkreis wieder, bei dem der Dienst willkommen sein soll.
- source_word: γένηται
  choice: ist
  rationale: Im Deutschen drückt „damit … willkommen ist“ das erhoffte Eintreten dieses Zustands idiomatisch aus; ein wörtliches „willkommen werde“ wäre missverständlich.
theological_decisions:
- issue: Bedeutung von ἀπειθούντων für die Gegner des Paulus in Judäa
  choice: „die … ungehorsam sind“ im Haupttext
  alternative: „die … nicht glauben“
  rationale: Das Partizip kann die Weigerung zu glauben und den daraus hervorgehenden Ungehorsam bezeichnen. Der Haupttext hält die weitere lexikalische Bedeutung fest; die Fußnote bewahrt die verbreitete kontextuelle Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Zusammenhang der beiden Gebetsanliegen, während „bei den Heiligen willkommen“ natürlich und allgemein verständlich formuliert ist.
