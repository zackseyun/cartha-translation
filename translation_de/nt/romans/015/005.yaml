revisions:
- from: Der Gott aber, von dem Ausdauer und Ermutigung kommen, gebe euch, untereinander auf dasselbe bedacht zu sein[a], wie es dem Messias Jesus entspricht[b],
  to: Der Gott der Ausdauer und der Ermutigung aber gebe euch, untereinander gleichgesinnt zu sein[a], wie es dem Messias Jesus entspricht[b],
  rationale: Die Revision stellt die genitivische Gottesbezeichnung wieder her und ersetzt die missverständlicher mögliche Formulierung „auf dasselbe bedacht“ durch „gleichgesinnt“. Der Gebetswunsch, der wechselseitige Bezug und der normative Bezug auf den Messias Jesus bleiben erhalten. Die Fußnote zu a dokumentiert weiterhin die nähere, aber im Deutschen weniger klare Alternative.
