  - severity: low
    issue: Die Umschreibung der Gottesgenitive als Quellenangabe ist unnötig expansiv.
    rationale: „Der Gott der Ausdauer und der Ermutigung“ entspricht der griechischen Formulierung direkt und ist im Deutschen natürlich genug.
