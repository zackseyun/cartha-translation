id: ROM.15.5
reference: Romans 15:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: de
  text: Der Gott der Ausdauer und der Ermutigung aber gebe euch, untereinander gleichgesinnt zu sein[a], wie es dem Messias Jesus entspricht[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „untereinander dieselbe Gesinnung zu haben“ oder „untereinander auf dasselbe bedacht zu sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „gemäß dem Messias Jesus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Der Gott aber
  rationale: δέ knüpft mild an den vorherigen Gedanken an; „aber“ bewahrt diese Verbindung, ohne einen starken Gegensatz zu behaupten.
- source_word: τῆς ὑπομονῆς
  choice: von dem Ausdauer … kommt
  rationale: ὑπομονή bezeichnet standhaftes Ausharren unter Belastung. Die Umschreibung gibt den hier naheliegenden Gedanken wieder, dass Gott deren Quelle beziehungsweise Geber ist.
- source_word: τῆς παρακλήσεως
  choice: von dem … Ermutigung kommt
  rationale: παράκλησις kann Ermutigung, Trost oder Zuspruch bedeuten. „Ermutigung“ passt zum unmittelbaren Zusammenhang mit der durch die Schriften vermittelten Stärkung.
- source_word: δῴη
  choice: gebe
  rationale: Der Aorist Optativ steht in einem Gebetswunsch; der deutsche Konjunktiv „gebe“ wahrt diese feierliche Wunschform natürlich.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: auf dasselbe bedacht zu sein
  rationale: Die Formulierung bewahrt den Gedanken einer gemeinsamen Gesinnung oder Ausrichtung, ohne völlige Übereinstimmung in jeder Einzelfrage zu behaupten.
- source_word: ἐν ἀλλήλοις
  choice: untereinander
  rationale: „Untereinander“ bezeichnet natürlich die wechselseitige gemeinschaftliche Sphäre der gemeinsamen Ausrichtung.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: wie es dem Messias Jesus entspricht
  rationale: κατά bezeichnet hier Übereinstimmung mit einem Maßstab. „Messias“ übersetzt den Titelsinn von Χριστός, während „Jesus“ als Name wiedergegeben wird.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός trägt hier weiterhin den Titelsinn „Messias“ und wird daher bedeutungsorientiert übersetzt, ohne eine zusätzliche konfessionelle Deutung einzuführen.
- issue: Bedeutung von τὸ αὐτὸ φρονεῖν
  choice: gemeinsame Gesinnung beziehungsweise Ausrichtung
  alternative: vollständige Übereinstimmung in jeder Meinung
  rationale: Der Wortlaut fordert gemeinschaftliche Gleichgesinntheit, legt aber nicht ausdrücklich eine uniforme Meinung zu jeder einzelnen Frage fest.
- issue: Bezug von κατὰ Χριστὸν Ἰησοῦν
  choice: Übereinstimmung mit dem Messias Jesus als Maßstab
  alternative: nach dem Willen des Messias Jesus
  rationale: Die Übersetzung wahrt den offenen Vergleichs- beziehungsweise Normbezug von κατά und ergänzt nicht ausdrücklich „Willen“, was im Griechischen nicht steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetswunsch wird mit dem Konjunktiv „gebe“ ausgedrückt. Die genitivische Gottesbezeichnung wird zur besseren Verständlichkeit als Quellenangabe entfaltet; die Fußnoten bewahren relevante lexikalische und syntaktische Alternativen.
