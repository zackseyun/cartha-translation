id: ROM.15.23
reference: Romans 15:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: de
  text: Jetzt aber habe ich in diesen Gegenden keinen Raum mehr[a] und sehne mich schon seit vielen Jahren danach, zu euch zu kommen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »keinen weiteren Wirkungskreis mehr« beziehungsweise »keine Gelegenheit mehr«. Der griechische Ausdruck meint hier wahrscheinlich, dass Paulus dort keinen verbleibenden Raum für seinen Dienst sah, nicht dass es buchstäblich keinen Ort für ihn gab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Jetzt aber
  rationale: Gibt den zeitlichen Übergang und die leicht kontrastierende Kraft von δέ natürlich und quellennah wieder.
- source_word: μηκέτι
  choice: nicht mehr / keinen ... mehr
  rationale: Die deutsche Satzfügung mit »keinen Raum mehr« drückt das Ende der bisherigen Situation idiomatisch aus.
- source_word: τόπον ἔχων
  choice: habe ich ... keinen Raum
  rationale: Bewahrt das griechische Bild von τόπος und lässt erkennen, dass Paulus keinen verbleibenden Wirkungskreis sieht, ohne vorschnell nur »Gelegenheit« zu übersetzen.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: in diesen Gegenden
  rationale: κλίματα bezeichnet hier geografische Gebiete; »Gegenden« ist verständlich und natürlich.
- source_word: ἐπιποθίαν ... ἔχων
  choice: sehne mich ... danach
  rationale: Die verbale deutsche Wendung gibt das starke, anhaltende Verlangen natürlicher wieder als eine substantivische Konstruktion.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: zu euch zu kommen
  rationale: Entspricht unmittelbar dem Infinitiv und fügt gegenüber dem Ausgangstext nicht eigens den Begriff eines Besuchs hinzu.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: schon seit vielen Jahren
  rationale: Gibt die vom vergangenen Zeitpunkt bis zur Gegenwart reichende Dauer idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von τόπον ἔχων im missionarischen Zusammenhang
  choice: Das Bild »keinen Raum mehr« bleibt im Text erhalten und wird in einer Fußnote erläutert.
  alternative: »keine weitere Möglichkeit zu wirken«
  rationale: Die gewählte Form bewahrt die genuine lexikalische Offenheit zwischen Raum, Spielraum und Gelegenheit und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipialkonstruktionen wurden für einen natürlichen deutschen Satz verbal aufgelöst. Das abschließende Komma wurde beibehalten, da der Vers syntaktisch in Vers 24 weitergeführt wird.
