id: ROM.15.10
reference: Romans 15:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: de
  text: 'Und weiter heißt es: „Freut euch, ihr Völker, zusammen mit seinem Volk!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Freut euch, ihr Nichtjuden, zusammen mit seinem Volk!“'
    reason: lexikalische Alternative zu ἔθνη im paulinischen Kontext
lexical_decisions:
- source_word: πάλιν
  choice: weiter
  rationale: In der Reihe von Schriftzitaten führt πάλιν ein weiteres Zitat ein. „Weiter“ ist im modernen Deutschen als Zitierformel natürlicher als „wieder“.
- source_word: λέγει
  choice: heißt es
  rationale: Die unpersönliche deutsche Zitierformel gibt das griechische Präsens natürlich wieder und lässt offen, ob Gott, die Schrift oder der zitierte Text als sprechendes Subjekt verstanden wird.
- source_word: Εὐφράνθητε
  choice: Freut euch
  rationale: Die idiomatische Aufforderung gibt den Imperativ klar, würdig und in heutigem Deutsch wieder.
- source_word: ἔθνη
  choice: Völker
  rationale: „Völker“ ist die direkte und im alttestamentlichen Zitat natürliche Bedeutung; im Zusammenhang von Römer 15 sind damit besonders die Nichtjuden gemeint. Diese kontextuelle Bedeutung wird in der Fußnote festgehalten, ohne den Wortlaut im Haupttext einzuengen.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: zusammen mit seinem Volk
  rationale: „Zusammen mit“ verdeutlicht die durch μετά ausgedrückte gemeinsame Freude; „seinem Volk“ bewahrt die knappe Bundesbezeichnung des griechischen Textes.
- source_word: λαοῦ
  choice: Volk
  rationale: Der Singular wird bewahrt und nicht deutend zu „Israel“ erweitert, obwohl Israel im Zitat der naheliegende Bezug ist.
theological_decisions:
- issue: Bedeutung von ἔθνη im Zusammenhang der Einheit von Juden und Nichtjuden
  choice: Völker
  alternative: Nichtjuden
  rationale: „Völker“ wahrt die lexikalische Breite und den Klang des Schriftzitats. Paulus verwendet das Zitat im unmittelbaren Zusammenhang jedoch für die Beteiligung der Nichtjuden am Gotteslob; deshalb wird diese Lesart in einer Fußnote genannt.
- issue: Subjekt der Zitierformel λέγει
  choice: heißt es
  alternative: er sagt
  rationale: Im Griechischen ist das Subjekt nicht ausdrücklich genannt. Die unpersönliche deutsche Formel bewahrt diese Offenheit, statt Gott oder die Schrift ausdrücklich als Sprecher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zitierformel ist natürlich und lässt das unausgesprochene Subjekt offen; der Ausruf wahrt den auffordernden Charakter des Schriftzitats.
