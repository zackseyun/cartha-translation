source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: de
  text: 'Und wiederum: „Lobt den Herrn[a], ihr alle Nationen[b], und alle Völker sollen ihn preisen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den HERRN“. In der hebräischen Vorlage des Zitats steht der Gottesname, den die griechische Übersetzung mit κύριος („Herr“) wiedergibt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ihr alle Nichtjuden“. Das griechische Wort ἔθνη kann „Nationen“ oder „Nichtjuden“ bedeuten; das Zitat hat hier einen umfassenden Sinn und passt zugleich zu Paulus’ Ausführungen über die Nichtjuden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Und weiter heißt es
  rationale: Leitet einen weiteren Schriftbeleg in der Zitatreihe ein. Die idiomatische Formulierung gibt die fortführende Funktion von καὶ πάλιν wieder, ohne das Zitat selbst zu verändern.
- source_word: Αἰνεῖτε
  choice: Lobt
  rationale: Der Imperativ der zweiten Person Plural wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: πάντα τὰ ἔθνη
  choice: all ihr Nationen
  rationale: ἔθνη kann „Nationen“, „Völker“ oder im paulinischen Zusammenhang „Nichtjuden“ bedeuten. „Nationen“ bewahrt hier den umfassenden Sinn und zugleich die lexikalische Unterscheidung zu λαοί im zweiten Satzglied.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Gibt das griechische κύριος unmittelbar wieder. Dass im hebräischen Ursprungstext der Gottesname steht, wird in einer Fußnote kenntlich gemacht.
- source_word: ἐπαινεσάτωσαν
  choice: sollen … preisen
  rationale: Die Aufforderung der dritten Person Plural lässt sich im Deutschen natürlich mit „sollen“ ausdrücken; „preisen“ wahrt zudem die leichte Variation gegenüber αἰνεῖτε.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist eindeutig auf „den Herrn“ zurück und wird ohne unnötige Wiederholung wiedergegeben.
- source_word: πάντες οἱ λαοί
  choice: alle Völker
  rationale: „Völker“ ist die natürliche Wiedergabe von λαοί und wahrt durch die Abgrenzung von „Nationen“ den Wortwechsel im griechischen Parallelismus.
theological_decisions:
- issue: Wiedergabe von κύριος in einem alttestamentlichen Zitat, dessen hebräische Vorlage den Gottesnamen enthält
  choice: den Herrn
  alternative: den HERRN
  rationale: Der Haupttext folgt dem überlieferten griechischen Wort κύριος. Die Schreibweise „HERRN“ ist als Hinweis auf den Gottesnamen in der hebräischen Vorlage sachlich bedeutsam und wird deshalb als Alternative in der Fußnote bewahrt.
- issue: Wiedergabe von ἔθνη im Zusammenhang von Römer 15
  choice: Nationen
  alternative: Nichtjuden
  rationale: Das Zitat ruft umfassend die Nationen zum Lob auf. Zugleich kann ἔθνη in Paulus’ Argumentation die Nichtjuden bezeichnen; diese kontextuell wichtige Bedeutung wird nicht in den Haupttext eingetragen, sondern als Alternative genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zitatseinleitung ist idiomatisch formuliert; der parallele Aufbau und die Unterscheidung zwischen ἔθνη und λαοί bleiben durch „Nationen“ und „Völker“ sichtbar.
