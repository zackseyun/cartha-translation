  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: de
  text: damit ihr einmütig und mit einem Mund[a] den Gott und Vater unseres Herrn Jesus, des Messias[b] verherrlicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „wie aus einem Mund“. Wörtlich steht im Griechischen „mit einem Mund“; das Bild betont das gemeinsame Gotteslob.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „Jesus Christus“. Der griechische Titel Χριστός bedeutet „Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das angestrebte Ergebnis der vorausgehenden Ermahnung natürlich und präzise ein.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Bezeichnet die gemeinsame Gesinnung und Zielrichtung der Glaubenden; „einmütig“ bewahrt diesen gemeinschaftlichen Sinn.
- source_word: ἐν ἑνὶ στόματι
  choice: mit einem Mund
  rationale: Bewahrt das anschauliche griechische Bild der vereinten, gemeinsam ausgesprochenen Verherrlichung; die idiomatischere deutsche Wiedergabe wird in einer Fußnote genannt.
- source_word: δοξάζητε
  choice: verherrlicht
  rationale: Gibt den präsentischen Konjunktiv im durch „damit“ eingeleiteten Zielsatz natürlich wieder und entspricht dem doxologischen Zusammenhang.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: den Gott und Vater
  rationale: Der eine Artikel verbindet beide Bezeichnungen eng; die Wiedergabe wahrt die paulinische Formulierung, ohne das Verhältnis zusätzlich auszudeuten.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: Gibt Titel und Possessivbezug unmittelbar und in geläufiger biblischer Sprache wieder.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Übersetzt Χριστός als Titel „Messias“ und gestaltet die Apposition im Deutschen eindeutig und idiomatisch.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Namens- und Titelfolge Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: Χριστός bezeichnet den messianischen Titel. „des Messias“ macht dessen Bedeutung im Deutschen sichtbar, während eine Fußnote die traditionelle Form nennt.
- issue: Bezug von τὸν θεὸν καὶ πατέρα
  choice: den Gott und Vater unseres Herrn Jesus, des Messias
  alternative: Gott, nämlich den Vater unseres Herrn Jesus, des Messias
  rationale: Die knappe griechische Verbindung wird beibehalten; eine erklärende Gleichsetzung würde die syntaktische Beziehung stärker festlegen, als es der Ausgangstext verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Einmütig“ erhält den gemeinschaftlichen Sinn von ὁμοθυμαδόν; „mit einem Mund“ bewahrt bewusst das konkrete Bild des Ausgangstextes. Die Stellung des Verbs am Satzende entspricht einem natürlichen deutschen „damit“-Satz.
