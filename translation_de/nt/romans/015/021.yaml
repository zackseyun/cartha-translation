  source_fidelity: Die Übersetzung gibt den adversativen Anschluss (ἀλλά), die etablierte Zitationsformel, die dative Relativkonstruktion mit passivischer Nichtverkündigung, das Futur von „sehen“ und „verstehen“ sowie den perfekten Zustand des Nichtgehört-Habens sachgerecht wieder. Der offene Bezug von αὐτοῦ bleibt als „ihn“ erhalten.
  naturalness: „Sondern, wie geschrieben steht“ ist im biblisch-zitierenden, zugleich modernen Standarddeutsch idiomatisch. Der parallele Satzbau ist klar und würdevoll. „Die, denen …“ ist in diesem Register gut verständlich und natürlich.
  terminology: „Verkündet“ passt im Kontext, ohne αὐτοῦ interpretierend zu „Christus“ oder „Messias“ zu erweitern. „Verstehen“ ist eine treffende, nicht überdeutende Wiedergabe von συνήσουσιν.
