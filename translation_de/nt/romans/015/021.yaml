id: ROM.15.21
reference: Romans 15:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: de
  text: 'sondern, wie geschrieben steht: »Die, denen nichts über ihn verkündet worden ist, werden sehen,[a][b] und die, die nichts gehört haben, werden verstehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus zitiert Jesaja 52,15. Das Pronomen »ihn« bezieht sich dort auf die Gestalt des Knechtes; Paulus wendet die Aussage hier auf seine Verkündigung des Evangeliums an.
    reason: cross_reference
  - marker: b
    text: 'Auch möglich: »Die, denen über ihn nichts mitgeteilt wurde, werden sehen …«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Markiert den Gegensatz zum zuvor beschriebenen Dienst an Orten, an denen Christus bereits bekannt war; nach dem verneinten Zusammenhang in Vers 20 ist „sondern“ im Deutschen natürlich.
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Gängige deutsche Wiedergabe der neutestamentlichen Zitationsformel; das griechische Perfekt wird idiomatisch als fortbestehende Schriftgeltung ausgedrückt.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Die, denen nichts über ihn verkündet worden ist
  rationale: Bewahrt den Dativ des Relativpronomens und gibt das Passiv von ἀναγγέλλω als Mitteilung beziehungsweise Verkündigung wieder. „Nichts“ ist im Deutschen eine natürliche Ergänzung, die den Inhalt der nicht erfolgten Bekanntmachung ausdrückt.
- source_word: ὄψονται
  choice: werden sehen
  rationale: Gibt das Futur direkt wieder und bewahrt das Bild des Sehens, ohne es vorschnell als rein geistiges Erkennen auszulegen.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: die, die nichts gehört haben
  rationale: Das Perfekt bezeichnet den bis zur Gegenwart bestehenden Zustand des Nichtgehört-Habens; das deutsche Perfekt bildet dies verständlich ab.
- source_word: συνήσουσιν
  choice: werden verstehen
  rationale: Direkte und allgemein verständliche Wiedergabe des zukünftigen Verstehens.
theological_decisions:
- issue: Bezug von αὐτοῦ („ihn“) im Jesaja-Zitat
  choice: Das Pronomen „ihn“ bleibt im Haupttext unverändert.
  alternative: „über den Messias“ oder „über Christus“
  rationale: Der griechische Text nennt lediglich das Pronomen. Im Kontext von Jesaja bezieht es sich auf die Gestalt des Knechtes; Paulus verwendet das Zitat für seine Evangeliumsverkündigung. Eine ausdrückliche Ersetzung durch „Christus“ würde die Anwendung interpretierend in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zitationsformel und der Parallelismus bleiben erkennbar; „verkündet“ passt zum missionarischen Zusammenhang, ohne das allgemeinere Bedeutungsspektrum von ἀναγγέλλω völlig auf einen technischen Begriff festzulegen.
