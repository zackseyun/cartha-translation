  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: de
  text: Doch ich habe euch zum Teil etwas kühner geschrieben[a], um euch wieder daran zu erinnern, aufgrund der Gnade, die mir von Gott gegeben wurde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Doch ich habe euch stellenweise recht kühn geschrieben.« Die griechische Wortstellung lässt offen, ob sich »zum Teil« auf den Grad der Kühnheit oder auf bestimmte Teile beziehungsweise Punkte des Schreibens bezieht.'
    reason: lexical_alternative
  - marker: b
    text: Mit der ihm von Gott gegebenen »Gnade« meint Paulus hier besonders den ihm anvertrauten und von Gott ermöglichten Dienst; siehe Vers 16.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: recht kühn
  rationale: Die Wendung gibt den komparativischen beziehungsweise verstärkenden Sinn idiomatisch wieder, ohne im Deutschen einen ausdrücklich genannten Vergleichspunkt vorauszusetzen.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den milden Gegensatz beziehungsweise die Weiterführung nach der vorausgehenden anerkennenden Aussage.
- source_word: ἔγραψα
  choice: habe ... geschrieben
  rationale: Das deutsche Perfekt passt natürlich zum brieflichen Rückblick auf das soeben Geschriebene.
- source_word: ἀπὸ μέρους
  choice: stellenweise
  rationale: Die idiomatische Wiedergabe bezieht die Einschränkung plausibel auf bestimmte Teile oder Punkte des Schreibens; die mögliche Zuordnung zum Grad der Kühnheit wird in der Fußnote bewahrt.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: um euch wieder daran zu erinnern
  rationale: Gibt die erläuternde beziehungsweise finale Funktion des Partizips natürlich wieder. Das Präfix ἐπανα- stützt hier die Bedeutung des erneuten Erinnerns.
- source_word: διὰ τὴν χάριν
  choice: aufgrund der Gnade
  rationale: διά mit Akkusativ bezeichnet den Grund oder die Grundlage; „Gnade“ bewahrt den paulinischen Ausdruck, ohne ihn im Haupttext auf „Auftrag“ einzuengen.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: die mir von Gott gegeben wurde
  rationale: Die passive Form und Gottes persönliche Urheberschaft werden klar und natürlich ausgedrückt.
theological_decisions:
- issue: Bedeutung von χάρις im Zusammenhang
  choice: „Gnade“ im Haupttext, mit Hinweis auf den von Gott verliehenen Dienstauftrag
  alternative: allgemeine göttliche Gunst oder unmittelbar „Auftrag“
  rationale: Der folgende Vers verbindet die empfangene Gnade mit dem apostolischen Dienst des Paulus unter den Völkern. Der Haupttext bewahrt dennoch den weiteren theologischen Begriff und vermeidet eine interpretierende Ersetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zweiteilung in zwei Sätze vermeidet einen schwerfälligen Periodenbau. „Stellenweise“ ist lesernah, während Fußnote a die echte syntaktisch-lexikalische Mehrdeutigkeit von τολμηρότερον ... ἀπὸ μέρους offenhält.
