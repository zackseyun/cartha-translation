  naturalness: Der revidierte Satz ist modernes, würdiges Standarddeutsch und folgt dem Gedankengang des griechischen Satzes ohne den etwas unnötig abgesetzten Zusatz „Das tat ich“.
  terminology: „Gnade“ ist für χάρις beizubehalten. Die Fußnote erläutert sachgerecht den im Kontext dienstbezogenen Sinn, ohne den Haupttext auf „Auftrag“ oder „Dienst“ zu verengen. „Von Gott gegeben“ bildet die passive Konstruktion mit προσωπlicher Urheberschaft angemessen ab.
