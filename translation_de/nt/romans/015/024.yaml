  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: de
  text: wenn ich nach Spanien reise; denn ich hoffe, euch auf der Durchreise zu sehen und von euch dorthin weitergeleitet zu werden,[a] nachdem ich zuvor zumindest teilweise durch die Begegnung mit euch erfüllt worden bin—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von euch auf meiner Weiterreise dorthin unterstützt zu werden“; das griechische Verb kann ein Weitergeleiten mit Hilfe, Versorgung oder Begleitung für die Weiterreise bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι εἰς τὴν Σπανίαν
  choice: wenn ich nach Spanien reise
  rationale: ὡς ἄν mit dem Konjunktiv bezeichnet einen noch unbestimmten zukünftigen Zeitpunkt. Im Deutschen gibt „wenn ich … reise“ diese offene Zukunft natürlich wieder.
- source_word: ἐλπίζω γὰρ
  choice: Denn ich hoffe
  rationale: „Denn“ bewahrt die erklärende Funktion von γάρ; „hoffe“ verbindet wie ἐλπίζω Erwartung und Wunsch.
- source_word: διαπορευόμενος θεάσασθαι ὑμᾶς
  choice: euch auf der Durchreise zu sehen
  rationale: Das Partizip beschreibt Rom als Station auf dem Weg zu einem anderen Ziel. „Zu sehen“ bleibt näher am griechischen Verb als das stärker deutende „zu besuchen“.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: von euch für die Weiterreise dorthin ausgerüstet zu werden
  rationale: προπέμπω bezeichnet im Reisekontext das unterstützende Geleit oder die Versorgung für die Weiterreise. „Ausgerüstet“ vermittelt praktische Hilfe, ohne deren konkrete Form festzulegen.
- source_word: ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ
  choice: nachdem ich zuvor wenigstens eine Zeit lang eure Gemeinschaft genossen habe
  rationale: Die Wendung bedeutet wörtlich, „zum Teil von euch erfüllt“ zu werden. Die deutsche Fassung erschließt den relationalen Sinn und lässt durch „wenigstens eine Zeit lang“ die Begrenzung der Begegnung erkennen.
theological_decisions:
- issue: Art der erhofften Unterstützung durch die römischen Gläubigen
  choice: für die Weiterreise dorthin ausgerüstet zu werden
  alternative: von euch dorthin weitergeleitet oder begleitet zu werden
  rationale: Der Text kann Begleitung, Versorgung oder andere Reisehilfe einschließen, nennt aber keine bestimmte finanzielle oder gemeindliche Unterstützungsform.
- issue: Bedeutung der erhofften Erfüllung durch die Begegnung
  choice: wenigstens eine Zeit lang eure Gemeinschaft genossen habe
  alternative: mich zuvor zum Teil an euch gesättigt habe
  rationale: Die wörtliche Sättigungs- beziehungsweise Erfüllungsmetapher klingt im heutigen Deutschen in Verbindung mit Personen befremdlich. Die gewählte Formulierung gibt den wahrscheinlichen Gemeinschaftssinn wieder, während die Fußnote den Bildgehalt und die mögliche Bedeutung „zum Teil“ bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanschluss bleibt als Fortsetzung des vorherigen Verses erkennbar. Die schwer übertragbare Erfüllungsmetapher wird im Haupttext idiomatisch wiedergegeben und in der Fußnote offengelegt.
