review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Paulus spricht nur von dem, was der Messias durch ihn bewirkt hat. „Um die Menschen aus den Völkern zum Gehorsam zu führen“ entfaltet εἰς jedoch stärker als der griechische Ausdruck und macht aus der präpositionalen Zielangabe eine explizite Führungshandlung. Die knappere nominale Wiedergabe wahrt die Form und Offenheit des Ausgangstextes besser.'
  naturalness: „Menschen aus den Völkern“ ist zwar verständlich, klingt im modernen Standarddeutsch aber umständlich und kann den im Römerbrief naheliegenden Gegensatz von Juden und Nichtjuden verdecken. „Nichtjuden“ ist klar, sachlich und gegenwärtig. Die revidierte Satzfassung bleibt würdevoll und natürlich.
  terminology: „der Messias“ gibt Χριστός entsprechend der vorgegebenen Titelentscheidung angemessen wieder. „Nichtjuden“ gibt ἐθνῶν im paulinischen Kontext präziser wieder; die Fußnote hält „die Völker“ als lexikalische Alternative fest. „Wort und Tat“ ist eine idiomatische und quellengerechte Wiedergabe von λόγῳ καὶ ἔργῳ.
  issues:
  - severity: medium
    issue: Die Wiedergabe von εἰς ὑπακοὴν ἐθνῶν als „um die Menschen aus den Völkern zum Gehorsam zu führen“ ist zu explizit.
    rationale: Der griechische Ausdruck benennt das Ziel bzw. den Bezug „zum Gehorsam der Nichtjuden“, ohne das konkrete Verb „führen“ vorzugeben. Eine nominale Formulierung bewahrt die syntaktische und semantische Offenheit besser.
  - severity: low
    issue: „Menschen aus den Völkern“ ist im Deutschen sperrig und im Kontext weniger präzise.
    rationale: ἐθνῶν bezeichnet hier im paulinischen Sprachgebrauch wahrscheinlich Nichtjuden. Diese Wiedergabe ist klarer, während die Fußnote die wörtlichere Alternative dokumentiert.
  - severity: low
    issue: Fußnote b bietet eine präsensische Umformung („ich wage nicht“) als Alternative zum griechischen Futur an.
    rationale: Das Futur τολμήσω sollte in der Übersetzung erhalten bleiben. Die vorgeschlagene Fußnote ist weder für eine Textvariante noch für eine notwendige lexikalische Alternative erforderlich und sollte entfallen.
  revised_text: Denn ich werde es nicht wagen, von etwas anderem zu reden als von dem, was der Messias durch mich bewirkt hat – zum Gehorsam der Nichtjuden, durch Wort und Tat.
  revised_footnotes:
  - marker: a
    text: 'Oder: „der Völker“. Im Zusammenhang des Römerbriefs sind wahrscheinlich Nichtjuden gemeint.'
    reason: lexical_alternative
