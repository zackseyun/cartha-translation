source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: de
  text: Denn ich werde es nicht wagen, von etwas anderem zu reden als von dem, was der Messias durch mich bewirkt hat – zum Gehorsam der Nichtjuden, durch Wort und Tat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τολμήσω
  choice: ich werde es nicht wagen
  rationale: Das Futur mit οὐ bezeichnet Paulus’ erklärte Zurückhaltung; die Formulierung bewahrt den Gedanken des Wagens und klingt im modernen Deutsch natürlich.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: von etwas anderem zu reden als von dem, was
  rationale: Die griechische Konstruktion ist ihrem Sinn nach einschränkend. Die deutsche Wendung macht deutlich, dass Paulus ausschließlich von dem sprechen will, was der Messias durch ihn getan hat.
- source_word: κατειργάσατο
  choice: bewirkt hat
  rationale: Das Verb bezeichnet ein wirksames Hervorbringen oder Vollbringen. „Bewirkt hat“ wahrt zugleich den Messias als den eigentlich Handelnden.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός wird hier als Titel des durch Paulus Handelnden verstanden; „der Messias“ gibt diesen Titelsinn im Deutschen klar wieder.
- source_word: δι’ ἐμοῦ
  choice: durch mich
  rationale: 'διά mit Genitiv bezeichnet hier Vermittlung bzw. Instrumentalität: Der Messias handelt, Paulus ist sein Werkzeug.'
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: um die Menschen aus den Völkern zum Gehorsam zu führen
  rationale: Die finale Formulierung gibt εἰς idiomatisch wieder. „Menschen aus den Völkern“ bezeichnet im paulinischen Zusammenhang Nichtjuden, ohne das heute leicht missverständliche Wort „Heiden“ zu verwenden.
- source_word: λόγῳ καὶ ἔργῳ
  choice: durch Wort und Tat
  rationale: Die Dative bezeichnen wahrscheinlich die Mittel, durch die das Wirken geschah. Die geläufige Paarformel bewahrt die Verbindung von Verkündigung und Handeln.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Die Wiedergabe als Titel hebt die messianische Rolle Jesu hervor; „Christus“ wäre als stärker namensartige traditionelle Form ebenfalls möglich.
- issue: Bedeutung von ἐθνῶν
  choice: Menschen aus den Völkern
  alternative: Nichtjuden; die Völker; Heiden
  rationale: Im Römerbrief bezeichnet ἔθνη hier wahrscheinlich Menschen außerhalb Israels. Die gewählte Form bewahrt den Bezug zu den „Völkern“ und macht zugleich deutlich, dass Menschen gemeint sind.
- issue: Zielrichtung von εἰς ὑπακοὴν
  choice: um … zum Gehorsam zu führen
  alternative: für den Gehorsam der Menschen aus den Völkern
  rationale: Die idiomatische Zielformulierung ist im Deutschen klar, ohne näher festzulegen, worin der Gehorsam besteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Menschen aus den Völkern“ vermeidet das im heutigen Sprachgebrauch missverständliche „Heiden“. Der Gedankenstrich bindet „durch Wort und Tat“ klar an das Wirken des Messias durch Paulus, ohne die knappe griechische Form unnötig auszubauen.
