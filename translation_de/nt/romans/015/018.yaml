revisions:
- from: Denn ich werde es nicht wagen, von etwas anderem zu reden[b] als von dem, was der Messias durch mich bewirkt hat, um die Menschen aus den Völkern[a] zum Gehorsam zu führen – durch Wort und Tat.
  to: Denn ich werde es nicht wagen, von etwas anderem zu reden als von dem, was der Messias durch mich bewirkt hat – zum Gehorsam der Nichtjuden, durch Wort und Tat.
  rationale: Die Revision ersetzt die interpretierendere Umschreibung „um … zu führen“ durch die quellennähere, im Deutschen noch natürliche Zielangabe „zum Gehorsam der Nichtjuden“. Sie präzisiert ἐθνῶν kontextgerecht und bewahrt die wörtlichere Lesart in einer Fußnote. Die nicht quellengestützte präsensische Alternativfußnote wird entfernt. Der Gedankenstrich bleibt möglich, um die abschließende Mittelangabe lesbar zu gliedern.
