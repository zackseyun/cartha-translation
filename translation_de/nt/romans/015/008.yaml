  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: de
  text: 'Denn ich sage: Der Messias ist ein Diener der Beschnittenen geworden, um der Wahrheit Gottes willen[a], um die Verheißungen an die Väter zu bestätigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um der Wahrhaftigkeit Gottes willen“; gemeint sein kann Gottes Treue, mit der er seine Bundesverheißungen erfüllt.'
    reason: lexikalische Alternative und kontextuelle Bedeutungsnuance
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Denn ich sage
  rationale: γάρ knüpft begründend beziehungsweise erläuternd an den vorherigen Gedankengang an; „Denn“ wahrt diesen Zusammenhang, und „ich sage“ gibt λέγω schlicht wieder.
- source_word: Χριστόν
  choice: der Messias
  rationale: Χριστός ist hier im heilsgeschichtlichen Zusammenhang mit Beschneidung und Väterverheißungen als Titel zu verstehen. „Messias“ macht diesen Titelcharakter deutlich.
- source_word: διάκονον
  choice: ein Diener
  rationale: διάκονος bezeichnet hier jemanden, der einen Dienst ausübt. „Diener“ ist verständlich und vermeidet eine Einengung auf ein späteres kirchliches Amt.
- source_word: γεγενῆσθαι
  choice: ist … geworden
  rationale: Der Perfektinfinitiv von γίνομαι bezeichnet ein Gewordensein mit fortbestehendem Ergebnis; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: περιτομῆς
  choice: der Beschnittenen
  rationale: Der Genitiv bezeichnet hier kollektiv das beschnittene Volk, also Israel beziehungsweise die Juden. Die Genitivverbindung „Diener der Beschnittenen“ bewahrt die Form des Ausgangstextes, ohne die Beziehung übermäßig festzulegen.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: um der Wahrheit Gottes willen
  rationale: ὑπέρ bezeichnet hier den Beweggrund oder Zweck. ἀλήθεια θεοῦ kann Gottes Wahrheit oder seine Wahrhaftigkeit beziehungsweise Treue meinen; die Hauptfassung bleibt bewusst offen, die Fußnote nennt die kontextuell naheliegende Nuance.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: um … zu bestätigen
  rationale: Die Konstruktion drückt einen Zweck aus. βεβαιόω bedeutet hier, die Verheißungen als fest und gültig zu erweisen beziehungsweise zu bestätigen.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: die Verheißungen an die Väter
  rationale: Der Genitiv τῶν πατέρων wird im Zusammenhang als Bezug auf die den Vätern gegebenen Verheißungen verstanden. „An die Väter“ ist im Deutschen klar und idiomatisch, ohne „Väter“ interpretierend durch „Erzväter“ oder „Vorfahren“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Im Kontext von Beschneidung und den Verheißungen an die Väter tritt der Titelcharakter hervor. „Messias“ bewahrt die Verbindung zu Israels Hoffnung.
- issue: Bedeutungsnuance von ἀλήθεια θεοῦ
  choice: Wahrheit Gottes
  alternative: Wahrhaftigkeit Gottes / Treue Gottes
  rationale: Der Ausdruck kann allgemein Gottes Wahrheit oder konkret seine Verlässlichkeit beim Einlösen seiner Verheißungen bezeichnen. Die Hauptfassung erhält die Mehrdeutigkeit; die Fußnote erschließt die im Kontext starke Treuenuance.
- issue: Beziehung in διάκονον περιτομῆς
  choice: Diener der Beschnittenen
  alternative: Diener für die Beschnittenen
  rationale: Der griechische Genitiv lässt die Dienstbeziehung knapp stehen. Die gewählte Form bewahrt diese Struktur; die Alternative würde den Empfänger- beziehungsweise Nutzenaspekt deutlicher auslegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Der Messias“ und „die Väter“ bewahren den heilsgeschichtlichen Wortlaut; die zweimalige Zweckangabe mit „um … willen“ und „um … zu“ bleibt verständlich und bildet die griechische Argumentationsstruktur ab.
