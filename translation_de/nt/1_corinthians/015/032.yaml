id: 1CO.15.32
reference: 1 Corinthians 15:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: de
  text: Wenn ich, menschlich gesprochen,[a] in Ephesus mit wilden Tieren gekämpft habe, was nützt mir das? Wenn die Toten nicht auferweckt werden,[b] dann »lasst uns essen und trinken, denn morgen sterben wir«.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Wenn ich aus rein menschlicher Sicht in Ephesus mit wilden Tieren gekämpft habe …« Die Wendung kann die Redeweise des Paulus oder seine Perspektive näher bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: »Mit wilden Tieren gekämpft« kann wörtlich oder als Bild für den Kampf gegen brutale menschliche Gegner verstanden werden; der Haupttext bewahrt die Ausdrucksweise des Griechischen.
    reason: alternative_reading
  - marker: c
    text: Zitat oder Anspielung auf Jesaja 22,13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: menschlich gesprochen
  rationale: Die idiomatische Wendung bezeichnet wahrscheinlich die menschliche Rede- oder Betrachtungsweise. Die knappe deutsche Formulierung ist natürlich und lässt die genaue Zuordnung der Wendung offen.
- source_word: ἐθηριομάχησα
  choice: mit wilden Tieren gekämpft habe
  rationale: Die Übersetzung bewahrt das anschauliche Bild des griechischen Verbs, ohne im Haupttext festzulegen, ob ein buchstäblicher Tierkampf oder bildlich ein Kampf gegen brutale Gegner gemeint ist.
- source_word: ἐν Ἐφέσῳ
  choice: in Ephesus
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: τί μοι τὸ ὄφελος
  choice: was nützt mir das?
  rationale: Gibt die rhetorische Frage und den Gedanken des persönlichen Nutzens in natürlichem modernem Deutsch wieder.
- source_word: νεκροὶ
  choice: die Toten
  rationale: Die substantivierte Bezeichnung wird im Deutschen natürlich mit »die Toten« wiedergegeben.
- source_word: ἐγείρονται
  choice: auferweckt werden
  rationale: Die passive Form des Griechischen bleibt erhalten; »auferweckt« passt zum Auferstehungskontext, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: lasst uns essen und trinken
  rationale: Die Aufforderungsform gibt die beiden hortativen Konjunktive treffend wieder.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: denn morgen sterben wir
  rationale: Die präsentische griechische Form hat hier zukunftsbezogenen Sinn; diese Wiedergabe ist idiomatisch und wahrt den Anklang an Jesaja 22,13.
theological_decisions:
- issue: Ob ἐθηριομάχησα einen tatsächlichen Kampf mit Tieren oder bildlich heftigen Widerstand durch Menschen bezeichnet
  choice: Das lexikalische Bild »mit wilden Tieren gekämpft« bleibt im Haupttext erhalten.
  alternative: 'Bildlich übersetzen: »gegen brutale Gegner gekämpft«.'
  rationale: Der griechische Wortlaut entscheidet die historische Frage nicht eindeutig. Die bildhafte Formulierung bewahrt diese Spannung und vermeidet eine unbegründete Festlegung.
- issue: Bezug von κατὰ ἄνθρωπον
  choice: »menschlich gesprochen« wird als eingeschobene Wendung wiedergegeben.
  alternative: »Wenn ich aus rein menschlicher Sicht in Ephesus …«
  rationale: Die Wendung kann die Redeweise oder die Perspektive des Paulus näher bestimmen. Haupttext und Fußnote bewahren diese syntaktische Mehrdeutigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Schärfe und das Bild des griechischen Textes bleiben erhalten. Die Zeichensetzung stellt »menschlich gesprochen« als Einschub dar; die Fußnote nennt die mögliche perspektivische Lesart.
