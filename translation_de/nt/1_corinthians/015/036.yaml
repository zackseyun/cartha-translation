  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: de
  text: Du Unverständiger![a] Was du säst, wird nicht lebendig gemacht[b], wenn es nicht stirbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Du Narr!; Du Uneinsichtiger!'
    reason: lexikalische Alternative zu ἄφρων
  - marker: b
    text: 'Oder: kommt nicht zum Leben.'
    reason: idiomatische Alternative zum Passiv ζῳοποιεῖται
lexical_decisions:
- source_word: ἄφρων
  choice: Du Unvernünftiger!
  rationale: Die substantivierte Anrede gibt den scharfen, direkten Tadel des griechischen Vokativs wieder, ohne altertümlich zu klingen. Sie bezeichnet mangelnde Einsicht, nicht bloß fehlendes Wissen.
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen wird in der direkten Anrede und erneut in „du säst“ sichtbar wiedergegeben; so bleibt die persönliche Zuspitzung erhalten.
- source_word: ὃ σπείρεις
  choice: Was du säst
  rationale: Die Formulierung ist natürlich und bewahrt das landwirtschaftliche Bild sowie den lexikalischen Bezug zum Säen.
- source_word: ζῳοποιεῖται
  choice: wird nicht lebendig gemacht
  rationale: Die passive Verbform wird bewahrt. Zugleich bleibt offen, wer das Leben gibt, wie auch im griechischen Text.
- source_word: ἐὰν μὴ
  choice: wenn es nicht
  rationale: In diesem Satz ist die deutsche Bedingungsformulierung idiomatisch und bildet die notwendige Voraussetzung ab; „es sei denn“ wäre hier schwerfälliger.
- source_word: ἀποθάνῃ
  choice: es stirbt
  rationale: Der Aorist Konjunktiv in der Bedingung wird im Deutschen sachgerecht mit dem Präsens wiedergegeben. Ein Zusatz wie „zuerst“ wird vermieden.
theological_decisions:
- issue: Verhältnis von Sterben des Samens und Auferstehungsleben
  choice: Das landwirtschaftliche Bild bleibt ohne dogmatische Ausdeutung stehen.
  alternative: Den Satz ausdrücklich als Lehrformel über die leibliche Auferstehung formulieren.
  rationale: Paulus verwendet das Bild im Zusammenhang seiner Auferstehungsargumentation; der einzelne Vers benennt diese Deutung jedoch nicht ausdrücklich. Die Übersetzung bewahrt daher Bild und Spannung.
- issue: Urheber des Lebendigmachens
  choice: Das grammatische Passiv „wird lebendig gemacht“ bleibt erhalten.
  alternative: Mit „kommt zum Leben“ den Vorgang intransitiv ausdrücken oder Gott ausdrücklich als Handelnden nennen.
  rationale: Das Passiv entspricht dem Ausgangstext und lässt den Handelnden unausgesprochen. Eine ausdrückliche Nennung Gottes würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, klar verständlichem Register. Die direkte Anrede bleibt bewusst scharf; altertümliche Formulierungen werden vermieden. Das Passiv und das Bild vom Säen und Sterben werden quellennah bewahrt.
