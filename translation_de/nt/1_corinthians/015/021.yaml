  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: de
  text: Denn da durch einen Menschen der Tod kam[a][b], kam auch durch einen Menschen die Auferstehung der Toten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von einem Menschen“ in beiden Satzgliedern. Die griechische Präposition kann sowohl Vermittlung als auch Urheberschaft ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Aus dem Zusammenhang geht hervor, dass die beiden Menschen Adam und Christus sind (siehe 15,22.45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Denn weil
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder, während „weil“ die kausale Unterordnung durch ἐπειδή bewahrt. Die Verbindung ist im Deutschen verständlich und hält beide Elemente sichtbar.
- source_word: δι’ ἀνθρώπου
  choice: durch einen Menschen
  rationale: διά mit Genitiv bezeichnet hier Vermittlung und kann zugleich Mittel oder handelnde Ursache ausdrücken. „Durch einen Menschen“ bewahrt den anarthrischen Singular sowie die bewusste Parallele zwischen Adam und Christus.
- source_word: θάνατος
  choice: der Tod … kam
  rationale: Der griechische Satz ist nominal und enthält kein ausdrückliches Verb. Für natürliches Deutsch wird „kam“ ergänzt; es bezeichnet knapp das Eintreten des Todes und lässt sich parallel auch im zweiten Satzglied verwenden.
- source_word: καὶ
  choice: auch
  rationale: „Auch“ macht die Entsprechung des zweiten Satzglieds zum ersten deutlich und gibt die vergleichende Funktion von καί natürlich wieder.
- source_word: ἀνάστασις νεκρῶν
  choice: die Auferstehung der Toten
  rationale: Dies ist die direkte, geläufige Wiedergabe des paulinischen Ausdrucks und bewahrt den konkreten Bezug auf die Auferstehung der Gestorbenen.
- source_word: δι’ ἀνθρώπου
  choice: durch einen Menschen
  rationale: 'Die identische Wiederholung erhält den absichtlichen Parallelismus des griechischen Textes: Wie der Tod durch einen Menschen kam, so kommt auch die Auferstehung durch einen Menschen.'
theological_decisions:
- issue: Repräsentativer Gegensatz zwischen Adam und Christus
  choice: In beiden Satzgliedern steht „durch einen Menschen“, ohne die Personen im Haupttext ausdrücklich zu benennen.
  alternative: „durch einen einzigen Menschen“ oder „durch Adam … durch Christus“
  rationale: Der unmittelbare Kontext identifiziert die beiden Menschen, doch der Vers selbst nennt ihre Namen nicht und enthält auch kein ausdrückliches Zahlwort für „einen einzigen“. Die gewählte Form bewahrt die knappe Symmetrie und vermeidet erklärende Zusätze im Haupttext.
- issue: Bedeutung der Auferstehung
  choice: „die Auferstehung der Toten“
  alternative: „ein geistliches Erwachen“ oder „ein Leben nach dem Tod“
  rationale: Der Zusammenhang von 1. Korinther 15 handelt von der wirklichen Auferstehung der Toten. Die Formulierung hält diese konkrete Aussage fest, ohne sie zu vergeistigen oder zu verallgemeinern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus des griechischen Satzes wird durch die zweimalige Formulierung „kam … durch einen Menschen“ deutlich erhalten. „Mensch“ ist hier sachlich und geschlechtsgenau, da der Kontext auf Adam und Christus verweist.
