  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: de
  text: Wenn wir nur in diesem Leben auf den Messias gehofft haben[a][b], sind wir mehr zu bemitleiden als alle Menschen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Christus“. Das griechische Χριστός bedeutet als Titel „Messias“ und wird traditionell auch mit „Christus“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Wenn wir in diesem Leben allein auf den Messias gehofft haben“. μόνον („nur/allein“) kann im Satz verschieden zugeordnet werden; im Zusammenhang begrenzt es wahrscheinlich die Hoffnung auf dieses Leben.'
    reason: source_ambiguity
  - marker: c
    text: 'Wörtlicher mit dem griechischen Komparativ: „sind wir beklagenswerter als alle Menschen“. Idiomatisch auch: „sind wir von allen Menschen am meisten zu bemitleiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Wenn
  rationale: Leitet wie im Griechischen eine Bedingung ein.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: für dieses Leben
  rationale: Im Zusammenhang mit dem Hoffen bezeichnet die Wendung den auf das gegenwärtige Leben begrenzten Horizont der Hoffnung; „für dieses Leben“ ist im Deutschen klar und idiomatisch.
- source_word: ἐν Χριστῷ
  choice: auf den Messias
  rationale: Das deutsche Verb „hoffen“ verlangt idiomatisch „auf“. „Messias“ gibt Χριστός als Titel wieder; die paulinische Wendung „in Christus“ bleibt in einer Fußnote als formnähere Alternative sichtbar.
- source_word: ἠλπικότες ἐσμὲν
  choice: unsere Hoffnung … gesetzt haben
  rationale: Die Umschreibung gibt das periphrastische Perfekt als eine begründete und bis zur Gegenwart bestehende Hoffnung natürlich wieder.
- source_word: μόνον
  choice: nur
  rationale: „Nur“ wird so gestellt, dass die wahrscheinlich gemeinte Begrenzung der Hoffnung auf dieses Leben deutlich wird, ohne die griechische Wortstellung als allein mögliche Deutung auszugeben.
- source_word: ἐλεεινότεροι
  choice: beklagenswerter
  rationale: Bewahrt die griechische Komparativform und bezeichnet Menschen, die in höherem Maß Mitleid verdienen, nicht lediglich Menschen, die sich elend fühlen.
- source_word: πάντων ἀνθρώπων
  choice: als alle anderen Menschen
  rationale: Der Genitiv des Vergleichs wird im Deutschen mit „als“ wiedergegeben. „Andere“ macht den Vergleich idiomatisch deutlich, da die Sprechenden selbst Menschen sind; ἄνθρωποι ist geschlechtsübergreifend.
theological_decisions:
- issue: Wiedergabe von ἐν Χριστῷ in der paulinischen Formulierung
  choice: auf den Messias
  alternative: in Christus / im Messias
  rationale: „Messias“ bewahrt den Titelcharakter von Χριστός, während „auf … hoffen“ im Deutschen die natürliche Verbindung ist. Die formnahe, theologisch gewichtige Wendung „in Christus“ wird als Alternative dokumentiert.
- issue: Reichweite von μόνον
  choice: Die Hoffnung ist auf dieses Leben begrenzt
  alternative: Wenn wir in diesem Leben allein auf den Messias gehofft haben
  rationale: Der Kontext von 1 Korinther 15 legt nahe, dass „nur“ den zeitlichen Horizont „dieses Leben“ einschränkt. Wegen der möglichen Zuordnung in der griechischen Wortfolge wird eine formnähere Alternative in der Fußnote bewahrt.
- issue: Aussage über christliche Hoffnung und Auferstehung
  choice: Bedingte Aussage ohne dogmatische Erweiterung
  alternative: Ausdrückliche Paraphrase über ein Leben nach dem Tod
  rationale: Der Vers erklärt Menschen für besonders beklagenswert, falls ihre Hoffnung auf den Messias nur dieses Leben betrifft. Die Übersetzung ergänzt keine weitergehende Lehrformel, die der Satz selbst nicht ausdrücklich enthält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hauptfassung vermeidet missverständliche Wortstellung und klingt natürlich, wahrt aber durch die Fußnoten sowohl die traditionelle Christus-Terminologie als auch die syntaktische und komparative Form des griechischen Textes.
