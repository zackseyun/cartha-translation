revisions:
- from: Wenn wir nur für dieses Leben unsere Hoffnung auf den Messias gesetzt haben[a][b], sind wir beklagenswerter als alle anderen Menschen.[c]
  to: Wenn wir nur in diesem Leben auf den Messias gehofft haben[a][b], sind wir mehr zu bemitleiden als alle Menschen.[c]
  rationale: Die Revision ersetzt die leicht interpretierende Zeitangabe „für dieses Leben“ durch „in diesem Leben“, ordnet „nur“ klar dem zeitlichen Horizont zu und präzisiert den Ausdruck für das Mitleid-Verdienen. Die Fußnoten werden so bereinigt, dass sie die mögliche Skopusfrage bei μόνον dokumentieren, ohne die idiomatische deutsche Wiedergabe von ἐν Χριστῷ als angeblich formnah zu charakterisieren.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:50:34Z'
review_pass:
  verdict: revise
  source_fidelity: Die Hauptfassung gibt die bedingte Aussage, das Perfekt und den Vergleich grundsätzlich zutreffend wieder. „Für dieses Leben“ ist jedoch gegenüber ἐν τῇ ζωῇ ταύτῃ unnötig zielgerichtet und weniger formnah als „in diesem Leben“. Die Wiedergabe von ἐν Χριστῷ mit der im Deutschen idiomatischen Verbindung „auf den Messias hoffen“ ist vertretbar, sollte aber nicht durch eine Fußnote fälschlich als formnahe Wiedergabe von „in Christus“ dargestellt werden.
  naturalness: „Wenn wir nur in diesem Leben auf den Messias gehofft haben“ ist modernes, klares Standarddeutsch und macht den im Kontext gemeinten Skopus von μόνον deutlich. „Beklagenswerter“ ist verständlich, kann aber auch „bedauerlich“ im allgemeinen Sinn bedeuten; „mehr zu bemitleiden“ trifft ἐλεεινότεροι präziser und bleibt gut lesbar.
  terminology: „Messias“ entspricht der vorgegebenen Behandlung von Χριστός als Titel. Die Alternative „Christus“ gehört in die Fußnote. Die Präposition kann im Deutschen wegen der Valenz von „hoffen“ nicht wörtlich als „in dem Messias hoffen“ wiedergegeben werden; dies ist als idiomatische Anpassung zu beschreiben, nicht als Erhalt der paulinischen Formel.
  issues:
  - severity: medium
    issue: „für dieses Leben“ statt „in diesem Leben“
    rationale: ἐν τῇ ζωῇ ταύτῃ bezeichnet unmittelbar den zeitlichen Bereich „in diesem Leben“. „Für dieses Leben“ ist zwar kontextuell möglich, kann aber stärker nach Zweck bzw. Bestimmung klingen. „Nur in diesem Leben“ ist sowohl näher am Ausgangstext als auch idiomatisch.
  - severity: medium
    issue: Fußnote b bezeichnet „in Christus“ implizit als formnahe Alternative
    rationale: Die Fußnote und die zugehörige Entscheidung vermischen die Stellung von μόνον mit der Übersetzung von ἐν Χριστῷ. „auf den Messias hoffen“ ist eine notwendige deutsche Verbfügung; „in Christus“ wäre zwar präpositional formnäher, aber mit „hoffen“ keine vollständige natürliche deutsche Satzfügung. Die Fußnote sollte sich auf den Skopus von μόνον beschränken.
  - severity: low
    issue: „beklagenswerter“ ist semantisch etwas weiter als ἐλεεινότεροι
    rationale: Das Wort kann allgemein etwas Bedauerliches bezeichnen. „Mehr zu bemitleiden“ macht klarer, dass es um Menschen geht, die Mitleid verdienen, und bewahrt den griechischen Komparativ.
