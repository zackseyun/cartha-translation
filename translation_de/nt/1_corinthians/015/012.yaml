id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: de
  text: Wenn aber verkündet wird, dass der Messias[a] von den Toten auferweckt worden ist, wie können dann einige unter euch sagen, es gebe keine Auferstehung der Toten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Das griechische Χριστός kann sowohl mit „Messias“ übersetzt als auch mit „Christus“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός bezeichnet hier den messianischen Titel. „Der Messias“ gibt dessen Bedeutung wieder; der bestimmte Artikel wird für natürliches Deutsch ergänzt.
- source_word: κηρύσσεται
  choice: verkündet wird
  rationale: Das Präsens Passiv bezeichnet die fortdauernde öffentliche Verkündigung und bewahrt den heraldischen Sinn von κηρύσσω.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die übliche und natürliche deutsche Wiedergabe der Auferstehungsformel; der griechische Plural bezeichnet die Verstorbenen als Gruppe.
- source_word: ἐγήγερται
  choice: auferweckt worden ist
  rationale: Das Perfekt Passiv bezeichnet eine vollendete Handlung mit fortdauerndem Ergebnis und lässt den Handelnden, implizit Gott, unausgesprochen.
- source_word: πῶς
  choice: wie können dann
  rationale: Die Formulierung bringt die rhetorische Unvereinbarkeit der beiden Aussagen in natürlichem Deutsch zum Ausdruck.
- source_word: ἐν ὑμῖν τινες
  choice: einige unter euch
  rationale: Die Wendung bezeichnet eine Teilgruppe innerhalb der korinthischen Gemeinde.
- source_word: ἀνάστασις νεκρῶν
  choice: Auferstehung der Toten
  rationale: Die genitivische Wendung meint die allgemeine Auferstehung der Verstorbenen und wird mit der etablierten deutschen Formulierung wiedergegeben.
- source_word: οὐκ ἔστιν
  choice: es gebe keine
  rationale: Der existentielle Sinn von εἰμί wird idiomatisch wiedergegeben; der Konjunktiv markiert die indirekt angeführte Behauptung.
theological_decisions:
- issue: Wiedergabe von Χριστός im paulinischen Sprachgebrauch
  choice: der Messias
  alternative: Christus
  rationale: Im Argument fungiert Χριστός als messianischer Titel. Die Hauptfassung übersetzt dessen Bedeutung, während die traditionelle Transliteration als echte lexikalische Alternative in der Fußnote erhalten bleibt.
- issue: Passiv bei ἐγήγερται
  choice: auferweckt worden ist
  alternative: auferstanden ist
  rationale: Die passive Form bewahrt die grammatische Gestalt und den möglichen Hinweis auf Gottes Handeln, ohne den nicht ausdrücklich genannten Handelnden einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für flüssiges Deutsch leicht umgestellt, ohne die argumentative Spannung zwischen der verkündigten Auferweckung des Messias und der bestrittenen Auferstehung der Toten aufzulösen. Das griechische δέ wird mit „aber“ wiedergegeben.
