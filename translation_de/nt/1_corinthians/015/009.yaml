  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: de
  text: Denn ich bin der Geringste der Apostel, der nicht würdig[a] ist, Apostel genannt zu werden, weil ich die Gemeinde Gottes verfolgt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht geeignet“ oder „nicht befähigt“.'
    reason: 'Lexikalische Alternative: ἱκανός kann neben Würdigkeit auch Eignung, Tauglichkeit oder Befähigung bezeichnen.'
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Kennzeichnet natürlich und knapp die begründende Verbindung zum vorhergehenden Vers.
- source_word: ἐλάχιστος
  choice: der geringste
  rationale: Bezeichnet hier Paulus’ niedrige Selbsteinschätzung innerhalb des Apostelkreises, nicht körperliche Größe.
- source_word: ἀπόστολος / ἀποστόλων
  choice: Apostel / Aposteln
  rationale: Bewahrt die in diesem Zusammenhang gemeinte anerkannte Sendung und Funktion statt eines bloß allgemeinen Botenbegriffs.
- source_word: ἱκανός
  choice: würdig
  rationale: Im Zusammenhang mit der früheren Verfolgung gibt „würdig“ Paulus’ moralisch geprägte Selbsteinschätzung natürlich wieder; die mögliche Bedeutung von Eignung oder Befähigung bleibt in der Fußnote erhalten.
- source_word: καλεῖσθαι
  choice: genannt zu werden
  rationale: Gibt den passiven Infinitiv direkt und idiomatisch wieder.
- source_word: διότι
  choice: weil
  rationale: Leitet klar den ausdrücklich genannten Grund für Paulus’ Selbsteinschätzung ein.
- source_word: ἐδίωξα
  choice: ich … verfolgt habe
  rationale: Bezeichnet eindeutig Paulus’ früheres feindliches Vorgehen gegen die Glaubensgemeinschaft.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: die Gemeinde Gottes
  rationale: „Gemeinde“ bezeichnet im paulinischen Zusammenhang die Gemeinschaft der Glaubenden und bewahrt zugleich die Genitivverbindung „Gottes“.
- source_word: ὃς
  choice: und
  rationale: Die koordinierte deutsche Fassung gibt den Bezug auf Paulus idiomatisch wieder, ohne die Aussage inhaltlich aufzulösen.
theological_decisions:
- issue: Paulus’ Aussage über sein Apostelamt
  choice: Paulus zählt sich tatsächlich zu den Aposteln, bezeichnet sich aber wegen seiner früheren Verfolgung als den geringsten und als des Titels unwürdig.
  alternative: Paulus bestreitet sein Apostelamt grundsätzlich oder spricht ausschließlich von mangelnder formaler Befähigung.
  rationale: „Der geringste unter den Aposteln“ schließt Paulus in den Apostelkreis ein, während „nicht würdig“ seine demütige Selbsteinschätzung ausdrückt. Beide Seiten der Aussage bleiben bestehen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzverbindung mit „und“ vermeidet die im Deutschen schwerfällige wörtliche Relativkonstruktion „der ich …“; „Gemeinde Gottes“ entspricht geläufigem paulinischem Sprachgebrauch.
