source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: de
  text: Tag für Tag sterbe ich – so wahr ich mich in Messias Jesus, unserem Herrn, euer rühme.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die schwurähnliche griechische Wendung kann auch wiedergegeben werden: »bei dem Rühmen über euch, das ich in Messias Jesus, unserem Herrn, habe«; die genaue syntaktische Verbindung ist umstritten.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: »in Christus Jesus, unserem Herrn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die idiomatische Wendung gibt die wiederholte Bedeutung »jeden Tag/täglich« natürlich wieder und erhält zugleich die eindringliche Wortstellung.
- source_word: ἀποθνῄσκω
  choice: sterbe ich
  rationale: Das Präsens wird unmittelbar und bildkräftig wiedergegeben; »bin täglich dem Tod ausgesetzt« wäre bereits eine erklärende Deutung.
- source_word: νὴ
  choice: so wahr
  rationale: Die Partikel leitet eine beteuernde, schwurähnliche Aussage ein. »So wahr« bildet diese Funktion im Deutschen natürlicher ab als ein wörtliches »bei«.
- source_word: τὴν ὑμετέραν καύχησιν, ἣν ἔχω
  choice: ich mich euer rühme
  rationale: Die Relativkonstruktion wird im Deutschen idiomatisch zusammengezogen. Der Genitiv »euer« lässt erkennen, dass die Adressaten Gegenstand von Paulus’ Rühmen sind, ohne καύχησις zu »Stolz« abzuschwächen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Messias Jesus
  rationale: Χριστός wird als Titel mit »Messias« übersetzt; »in« bewahrt die prägnante paulinische Verhältnisbestimmung.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: unserem Herrn
  rationale: Die Apposition wird entsprechend dem deutschen Kasus nach »in« als »unserem Herrn« wiedergegeben.
theological_decisions:
- issue: Bezug und Funktion von καύχησις mit ὑμετέραν
  choice: Paulus rühmt sich der Korinther; die Wendung gehört zu einer Beteuerung.
  alternative: »bei eurem Rühmen« beziehungsweise »so gewiss wie das Rühmen, das ich euretwegen habe«
  rationale: ἣν ἔχω spricht stark dafür, dass Paulus das Rühmen besitzt und die Korinther dessen Gegenstand sind. Da Form und syntaktische Einbindung der schwurähnlichen Wendung umstritten bleiben, wird die Alternative in einer Fußnote offengehalten.
- issue: Χριστός als Titel oder traditionelle Namensform
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Die Übersetzung als »Messias« macht den Titelgehalt sichtbar; die traditionelle Wiedergabe wird als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, rhetorisch zugespitzte Aussage bleibt erhalten; die umstrittene schwurähnliche Konstruktion wird im Haupttext idiomatisch und in der Fußnote formnäher wiedergegeben.
