  terminology: „Messias Jesus“ entspricht der vorgegebenen Titelübersetzung; „Herr“ ist für κύριος passend. „sich euer rühmen“ ist gehobenes, aber modernes und dem rhetorischen Register entsprechendes Standarddeutsch. Die traditionelle Alternative „Christus Jesus“ ist sinnvoll dokumentiert.
