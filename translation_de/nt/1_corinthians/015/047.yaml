id: 1CO.15.47
reference: 1 Corinthians 15:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: de
  text: Der erste Mensch war von der Erde, aus Staub[a]; der zweite Mensch ist vom Himmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „irdisch“ beziehungsweise „aus Erde“. Das griechische Adjektiv χοϊκός erinnert an die Erschaffung Adams aus Staub.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: erste
  rationale: Die Ordnungszahl kennzeichnet Adam als das erste Glied in Paulus’ Gegenüberstellung und wird im Deutschen natürlich mit „erste“ wiedergegeben.
- source_word: ἄνθρωπος
  choice: Mensch
  rationale: Im Zusammenhang bezeichnet das Wort zunächst Adam und dann parallel dazu Christus als repräsentative Menschen. „Mensch“ bewahrt diese Aussage, ohne die Adam-Christus-Typologie durch einen Zusatz aufzulösen.
- source_word: ἐκ γῆς
  choice: von der Erde
  rationale: Die Wortgruppe bezeichnet Herkunft oder Ursprung und bewahrt den Anklang an die Erschaffung Adams aus der Erde.
- source_word: χοϊκός
  choice: aus Staub
  rationale: Das Adjektiv bezeichnet etwas Erdiges beziehungsweise aus Erde oder Staub Bestehendes und erinnert an die Erschaffung Adams. „Aus Staub“ gibt diesen stofflichen Sinn im heutigen Deutsch klar wieder.
- source_word: δεύτερος
  choice: zweite
  rationale: Die Ordnungszahl bildet den bewussten Parallelismus zu „der erste Mensch“ ab.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel
  rationale: Die Wendung bezeichnet himmlische Herkunft. „Vom Himmel“ ist idiomatisch und bewahrt den transzendenten Sinn des Zusammenhangs.
theological_decisions:
- issue: Christologische Bedeutung von „der zweite Mensch“
  choice: „der zweite Mensch“ ohne ausdrückliche Ergänzung „Christus“
  alternative: „der zweite Mensch, Christus“
  rationale: Der Kontext identifiziert den zweiten Menschen mit Christus, doch der Vers nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt daher Paulus’ knappe Formulierung und die Adam-Christus-Typologie.
- issue: Zeitbezug der verblosen Nominalsätze
  choice: Im ersten Satzteil „war“, im zweiten „ist“
  alternative: Beide Satzteile im Präsens oder beide ohne ausdrückliche Kopula
  rationale: Im Griechischen fehlt in beiden Satzteilen eine ausdrückliche Kopula. Die gewählte Wiedergabe macht den natürlichen zeitlichen Kontrast zwischen dem ersten Menschen und dem gegenwärtig beschriebenen zweiten Menschen verständlich, ohne dem zweiten Satzteil eine nicht geforderte Vergangenheitsform aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des griechischen Textes bleibt erhalten; „Mensch“ ist hier geschlechtsgenau, da Adam und Christus als die beiden repräsentativen Menschen gegenübergestellt werden.
