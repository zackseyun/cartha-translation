id: 1CO.15.48
reference: 1 Corinthians 15:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: de
  text: Wie der Mensch aus Staub ist, so sind auch die Menschen aus Staub; und wie der himmlische Mensch ist, so sind auch die Menschen himmlisch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Wie ... ist, so sind auch ...
  rationale: Die korrelative Konstruktion bezeichnet die Entsprechung zwischen dem repräsentativen Einzelnen und den Menschen, die zu ihm gehören. Die deutsche Fassung bewahrt Parallelismus und Aussageoffenheit.
- source_word: χοϊκός
  choice: aus Staub
  rationale: Das Adjektiv bezeichnet Herkunft beziehungsweise Beschaffenheit aus Erde oder Staub und greift im Kontext die Erschaffung Adams auf. „Aus Staub“ erhält diesen Anklang deutlicher als das allgemeinere „irdisch“.
- source_word: ὁ χοϊκός
  choice: der Mensch aus Staub
  rationale: Der substantivierte maskuline Singular steht im Zusammenhang für Adam als repräsentativen Menschen. Das ergänzte „Mensch“ macht den persönlichen Gegensatz im Deutschen natürlich verständlich.
- source_word: οἱ χοϊκοί
  choice: die Menschen aus Staub
  rationale: Der Plural bezeichnet Menschen, die dem Menschen aus Staub entsprechen. Die Wiederholung von „aus Staub“ erhält die lexikalische Verbindung zum Singular.
- source_word: ἐπουράνιος
  choice: himmlisch
  rationale: Das Adjektiv bedeutet „himmlisch“ beziehungsweise „zum Himmel gehörig“. Diese Wiedergabe bewahrt den adjektivischen Gegensatz zu χοϊκός, ohne hier die Formulierung „aus dem Himmel“ aus Vers 47 einzutragen.
- source_word: ὁ ἐπουράνιος
  choice: der himmlische Mensch
  rationale: Im unmittelbaren Kontext ist Christus als Gegenüber Adams gemeint. „Mensch“ wird zur natürlichen deutschen Verständlichkeit ergänzt und hält die Parallelität der beiden repräsentativen Personen fest.
- source_word: οἱ ἐπουράνιοι
  choice: die himmlischen Menschen
  rationale: Der Ausdruck bezeichnet im Kontext der Auferstehung Menschen, die dem himmlischen Menschen entsprechen, nicht himmlische Wesen. Die Formulierung bleibt eng am substantivierten Adjektiv.
theological_decisions:
- issue: Ob der Adam-Christus-Gegensatz durch das ergänzte Wort „Mensch“ in beiden Singularformen ausdrücklich gemacht werden soll
  choice: „der Mensch aus Staub“ und „der himmlische Mensch“
  alternative: „der aus Staub“ und „der Himmlische“
  rationale: Die Verse 45–49 stellen Adam und Christus als repräsentative Menschen einander gegenüber. Die Ergänzung macht den Bezug im Deutschen verständlich, ohne über den Kontext hinauszugehen.
- issue: Ob οἱ ἐπουράνιοι himmlische Wesen oder Menschen bezeichnet, die dem himmlischen Menschen entsprechen
  choice: 'menschlicher Bezug: „die himmlischen Menschen“'
  alternative: „die Himmlischen“
  rationale: Paulus spricht im Zusammenhang von der Auferstehung der Menschen und davon, das Bild des himmlischen Menschen zu tragen. Die gewählte Fassung verhindert eine naheliegende, aber kontextwidrige Deutung auf Engel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der strenge Parallelismus des griechischen Satzes und die wiederholten Schlüsselbegriffe bleiben erhalten; „aus Staub“ bewahrt den Anklang an Adams Erschaffung.
