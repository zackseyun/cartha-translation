id: 1CO.15.14
reference: 1 Corinthians 15:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: de
  text: Wenn aber der Messias[a] nicht auferweckt worden ist[b], dann ist unsere Verkündigung leer[c], und leer ist auch euer Glaube[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus (griechisch: Christos).'
    reason: alternative_reading
  - marker: b
    text: 'Oder: nicht auferstanden ist.'
    reason: theological_ambiguity
  - marker: c
    text: 'Oder: vergeblich; ebenso beim zweiten Vorkommen von „leer“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: Vertrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: der Messias
  rationale: Die Wiedergabe als Titel bewahrt den Bedeutungsgehalt von Χριστός („Gesalbter“) in Paulus’ Argumentation; „Christus“ bleibt als geläufige Alternative in der Fußnote erhalten.
- source_word: ἐγήγερται
  choice: auferweckt worden ist
  rationale: Das Perfekt Passiv wird ausdrücklich wiedergegeben. So bleiben sowohl die fortdauernde Folge der Auferweckung als auch die nicht genannte handelnde Instanz erkennbar.
- source_word: ἄρα
  choice: dann
  rationale: „Dann“ gibt die logische Folgerung innerhalb des Bedingungssatzes natürlich und präzise wieder.
- source_word: κήρυγμα
  choice: Verkündigung
  rationale: „Verkündigung“ erfasst sowohl die öffentliche Bekanntmachung als auch deren Inhalt, ohne den Ausdruck auf eine Predigtveranstaltung zu verengen.
- source_word: κενός / κενή
  choice: leer
  rationale: Die gleiche Wiedergabe an beiden Stellen wahrt den rhetorischen Parallelismus. „Leer“ bezeichnet hier etwas ohne tragfähigen Inhalt oder Geltung; „vergeblich“ ist ebenfalls möglich.
- source_word: πίστις
  choice: Glaube
  rationale: Im Zusammenhang bezeichnet πίστις die glaubende Antwort der Korinther. „Glaube“ ist dafür die natürliche und kontextgerechte deutsche Entsprechung; „Vertrauen“ bleibt möglich.
theological_decisions:
- issue: Formulierung und Handelnder bei der Auferstehung
  choice: nicht auferweckt worden ist
  alternative: nicht auferstanden ist
  rationale: Die passive Form des Griechischen wird bewahrt, ohne den im Satz nicht ausdrücklich genannten Handelnden einzusetzen. Dadurch wird die theologische Spannung des Textes nicht vorschnell aufgelöst.
- issue: Χριστός als Titel oder namensähnliche Bezeichnung
  choice: der Messias
  alternative: Christus
  rationale: „Der Messias“ macht den Titelcharakter und die Bedeutung „der Gesalbte“ transparent. Die traditionelle Form „Christus“ ist jedoch sprachlich und sachlich möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „leer“ folgt bewusst dem griechischen Parallelismus. „Auferweckt worden ist“ ist etwas formeller, aber verständlich und bildet Tempus und Passiv genauer ab.
