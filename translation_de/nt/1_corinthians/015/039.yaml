  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: de
  text: Nicht alles Fleisch ist von derselben Art[a], sondern eine Art Fleisch haben die Menschen, eine andere die Tiere, eine andere die Vögel und eine andere die Fische.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Nicht alles Fleisch ist dasselbe Fleisch.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: Fleisch
  rationale: Das Wort bezeichnet hier im Zusammenhang der verschiedenen Geschöpfe deren leibliche Beschaffenheit, nicht die metaphorische »Fleischesnatur«. »Fleisch« wahrt zudem Paulus’ wiederholten Leitbegriff.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Nicht alles Fleisch ist von derselben Art
  rationale: Die Formulierung gibt die kategoriale Verschiedenheit idiomatisch wieder. Das wörtlichere »Nicht alles Fleisch ist dasselbe Fleisch« wäre im modernen Deutschen schwerfällig; die Fußnote bewahrt diese formale Möglichkeit.
- source_word: ἄλλη … ἄλλη … ἄλλη … ἄλλη
  choice: von einer Art … von einer anderen … von einer anderen … von einer anderen
  rationale: Die wiederholte Wendung bildet den regelmäßigen Kontrast des griechischen ἄλλη ab und sorgt im Deutschen für einen klaren parallelen Satzbau.
- source_word: ἀνθρώπων
  choice: Menschen
  rationale: Der Genitiv bezeichnet Menschen allgemein und ist nicht auf männliche Personen beschränkt.
- source_word: κτηνῶν
  choice: Landtiere
  rationale: κτῆνος kann besonders vierfüßige beziehungsweise landlebende Tiere und auch Nutztiere bezeichnen. »Landtiere« hält die Kategorie gegenüber Vögeln und Fischen klar, ohne sie ausschließlich auf Vieh zu begrenzen.
- source_word: πτηνῶν
  choice: Vögel
  rationale: Im vorliegenden Geschöpfekatalog ist »Vögel« die natürliche deutsche Entsprechung für die fliegenden Tiere.
- source_word: ἰχθύων
  choice: Fische
  rationale: »Fische« entspricht dem generischen Genitiv Plural und ist im Deutschen die natürliche Bezeichnung dieser Tiergruppe.
theological_decisions:
- issue: Bedeutung von σάρξ in diesem paulinischen Zusammenhang
  choice: wörtlich »Fleisch«
  alternative: »Leib«, »Körper« oder metaphorisch »sündige Natur«
  rationale: Der Vers behandelt verschiedene geschaffene leibliche Daseinsformen im Rahmen der Auferstehungsargumentation. Daher ist σάρξ konkret zu verstehen; eine moralisch-theologische Bedeutung würde hier etwas in den Text hineintragen.
- issue: Art der Unterschiede zwischen den Geschöpfen
  choice: kategoriale Verschiedenheit der leiblichen Beschaffenheit
  alternative: Aussage über unterschiedlichen Wert oder Rang
  rationale: ἄλλη kennzeichnet hier verschiedene Arten beziehungsweise Kategorien. Der Text trifft keine ausdrückliche Aussage über den Wert oder Rang dieser Lebewesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Leitbegriff »Fleisch« bleibt erhalten, während »von derselben Art« die Aussage idiomatisch verständlich macht. Der zweite Satz folgt dem viergliedrigen Parallelismus des griechischen Textes; »Landtiere« verdeutlicht die Abgrenzung zu Vögeln und Fischen.
