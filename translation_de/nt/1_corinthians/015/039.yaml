  source_fidelity: 'Der Grundsinn und die wörtliche Bedeutung von σάρξ als „Fleisch“ sind zutreffend erfasst. „Landtiere“ ist für κτηνῶν jedoch zu eng: Das Wort bezeichnet hier Tiere bzw. Vieh/Beast im allgemeinen Kontrast zu Menschen, Vögeln und Fischen, ohne ausdrücklich eine landgebundene Kategorie festzulegen.'
