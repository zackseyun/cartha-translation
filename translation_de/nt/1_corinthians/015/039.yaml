  terminology: „Fleisch“, „Menschen“, „Vögel“ und „Fische“ sind passend. „Tiere“ ist als neutrale Wiedergabe von κτηνῶν vorzuziehen. Die Fußnote bewahrt sinnvoll die im Deutschen weniger idiomatische, aber formnähere Wiederholung von „Fleisch“.
