source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: de
  text: Dann erweisen wir uns sogar als falsche Zeugen gegen Gott[a], weil wir gegen Gott bezeugt haben, dass er den Messias[b] auferweckt hat – ihn, den er nicht auferweckt hat, wenn Tote tatsächlich nicht auferweckt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „falsche Zeugen über Gott“. Der griechische Genitiv kann Zeugnis bezeichnen, das Gott betrifft; die folgende Wendung „gegen Gott“ stützt jedoch die adversative Wiedergabe im Haupttext.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „den Christus“. Gemeint ist der Titel „der Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: wir erweisen uns
  rationale: Das Präsens Passiv bezeichnet hier, als was die Apostel aufgrund der angenommenen Voraussetzung dastehen beziehungsweise erkannt werden. „Wir erweisen uns“ gibt den resultativen Sinn im heutigen Deutsch natürlich wieder.
- source_word: δὲ καὶ
  choice: Dann … sogar
  rationale: „Dann“ macht die Folgerung aus dem vorhergehenden Argument deutlich; „sogar“ bewahrt die steigernde Kraft von καί.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: falsche Zeugen Gottes
  rationale: „Falsche Zeugen“ ist die präzise Wiedergabe von ψευδομάρτυρες. Der Genitiv „Gottes“ wahrt zunächst die knappe griechische Form; die Fußnote nennt die sachlich mögliche explizite Wiedergabe „über Gott“.
- source_word: ἐμαρτυρήσαμεν
  choice: wir … bezeugt haben
  rationale: Das Aorist verweist auf das bereits abgelegte apostolische Zeugnis. „Bezeugen“ erhält den Zeugnischarakter und klingt würdevoll, ohne veraltet zu sein.
- source_word: κατὰ τοῦ θεοῦ
  choice: gegen Gott
  rationale: κατά mit Genitiv hat regulär adversative Bedeutung. Unter der hypothetischen Leugnung der Auferstehung hätten die Apostel Gott eine Tat zugeschrieben, die er nicht getan hätte, und damit gegen ihn ausgesagt. Die alternative kontextuelle Deutung „über Gott“ wird in der Fußnote offengehalten.
- source_word: ἤγειρεν
  choice: auferweckt hat
  rationale: Im Auferstehungskontext ist „auferwecken“ die klare und idiomatische deutsche Entsprechung; das Perfekt klingt im modernen Deutsch natürlicher als das Präteritum und bezeichnet die behauptete vollendete Tat.
- source_word: τὸν Χριστόν
  choice: den Messias
  rationale: Der Artikel und der argumentative Zusammenhang lassen Χριστός hier als Titel erkennen. „Messias“ gibt diesen Titel für heutige Leser deutlicher wieder als das leicht namenhaft verstandene „Christus“.
- source_word: ὃν οὐκ ἤγειρεν
  choice: ihn, den er nicht auferweckt hat
  rationale: Die relative Konstruktion und die Wiederholung des Verbs bleiben erhalten und damit auch die rhetorische Schärfe des Satzes.
- source_word: εἴπερ ἄρα
  choice: wenn … tatsächlich
  rationale: Die Verbindung formuliert eine für das Argument angenommene Bedingung. „Wenn … tatsächlich“ gibt ihre nachdrückliche, folgernde Kraft natürlich wieder.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: Tote … nicht auferweckt werden
  rationale: „Tote“ gibt das substantivierte Adjektiv allgemein wieder. Das Passiv bleibt erhalten, sodass Auferweckung als an den Toten vollzogene Handlung ausgedrückt wird.
theological_decisions:
- issue: Bedeutung von κατὰ τοῦ θεοῦ
  choice: gegen Gott
  alternative: über Gott / von Gott
  rationale: Die normale adversative Bedeutung von κατά mit Genitiv passt zur Schärfe von Paulus’ hypothetischem Argument. Da die Wendung im Zusammenhang auch als Aussage über Gott verstanden werden kann, wird diese echte Auslegungsmöglichkeit nicht verschwiegen, sondern in der Fußnote genannt.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός fungiert hier im Zusammenhang der Auferstehungsargumentation als Titel. „Messias“ macht die Titelfunktion sichtbar; die traditionelle Wiedergabe „Christus“ bleibt in der Fußnote dokumentiert.
- issue: Passivische Aussage über die Auferweckung der Toten
  choice: Tote … auferweckt werden
  alternative: Tote auferstehen
  rationale: Das griechische Passiv wird bewahrt, ohne den Handelnden im letzten Satzteil ausdrücklich einzusetzen. So bleibt die Formulierung nahe am Text und fügt keine weitergehende theologische Präzisierung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Wir erweisen uns“ vermeidet die schwerfällige wörtliche Form „wir werden befunden“. Der Gedankenstrich gliedert den langen Satz, ohne seine logische und rhetorische Einheit aufzulösen. Die Wiederholung von „auferweckt“ und das Passiv im Schlusssatz bewahren die Argumentationsstruktur des Griechischen.
