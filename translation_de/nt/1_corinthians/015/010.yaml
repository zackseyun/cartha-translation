source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: de
  text: 'Doch durch Gottes Gnade bin ich, was ich bin, und seine Gnade an mir ist nicht wirkungslos geblieben.[a] Im Gegenteil: Ich habe mich mehr abgemüht als sie alle – doch nicht ich, sondern die Gnade Gottes, die mit mir ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ist nicht leer geworden«; auch: »ist nicht vergeblich gewesen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Doch durch Gottes Gnade
  rationale: Der Dativ χάριτι wird instrumental wiedergegeben. »Doch« bringt den milden Gegensatz zum vorherigen Kontext zum Ausdruck; »Gnade« bewahrt den zentralen paulinischen Begriff.
- source_word: εἰμι ὅ εἰμι
  choice: bin ich, was ich bin
  rationale: Die prägnante Wiederholung des Griechischen bleibt erhalten und bezeichnet den durch Gottes Gnade bestimmten gegenwärtigen Stand des Paulus.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: seine Gnade an mir
  rationale: Die Wendung gibt die auf Paulus gerichtete und an ihm wirksame Gnade in natürlichem Deutsch wieder, ohne sie auf den einmaligen Empfang zu beschränken.
- source_word: οὐ κενὴ ἐγενήθη
  choice: ist nicht wirkungslos geblieben
  rationale: κενός kann »leer«, »vergeblich« oder »ohne Ergebnis« bedeuten. »Nicht wirkungslos geblieben« drückt im Zusammenhang den sichtbaren Ertrag der Gnade aus und bewahrt in der Fußnote die wörtlicheren Möglichkeiten.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: 'Im Gegenteil: Ich habe mich mehr abgemüht als sie alle'
  rationale: κοπιάω bezeichnet anstrengende Arbeit; »mich abgemüht« bewahrt diese Intensität. Der Vergleich lässt offen, ob Paulus jeden Einzelnen oder die anderen insgesamt meint.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: doch nicht ich, sondern die Gnade Gottes
  rationale: Die scharfe Korrektur der vorherigen Ich-Aussage bleibt erhalten, ohne die zuvor ausdrücklich genannte Arbeit des Paulus zu leugnen.
- source_word: ἡ σὺν ἐμοί
  choice: die mit mir war
  rationale: Die substantivisch angeschlossene Präpositionalgruppe wird eng auf »die Gnade Gottes« bezogen. Die schlichte Wiedergabe bewahrt die mögliche Spannung zwischen Begleitung und wirksamer Gegenwart.
theological_decisions:
- issue: Verhältnis zwischen der Arbeit des Paulus und der göttlichen Gnade
  choice: Sowohl das wirkliche Mühen des Paulus als auch die entscheidende Wirksamkeit der Gnade Gottes werden ausdrücklich stehen gelassen.
  alternative: Die Aussage entweder als gleichrangiges Zusammenwirken von Gott und Paulus auszudeuten oder das wirkliche Handeln des Paulus sprachlich aufzulösen.
  rationale: Der griechische Text bejaht zunächst Paulus’ intensive Arbeit und korrigiert dann mit »doch nicht ich, sondern die Gnade Gottes«. Die Übersetzung bewahrt diese theologische Spannung, statt sie systematisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist gut verständlich, bewahrt aber die prägnante Wiederholung, den starken Gegensatz und die theologische Spannung des griechischen Textes.
