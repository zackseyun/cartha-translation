  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: de
  text: Wo, Tod, ist dein Sieg[a]? Wo, Tod, ist dein Stachel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen im ersten Satzteil: „Wo, Tod, ist dein Stachel?“ Diese Lesart liegt manchen traditionellen Übersetzungen zugrunde.'
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: Wo
  rationale: Das Frageadverb leitet eine spöttisch-herausfordernde rhetorische Frage ein. „Wo“ gibt die unmittelbare Kraft wieder, ohne eine im Griechischen nicht ausdrücklich vorhandene Verstärkung hinzuzufügen.
- source_word: σου
  choice: dein
  rationale: Der Genitiv des Personalpronomens bezeichnet hier Zugehörigkeit; im Deutschen ist das Possessivpronomen die natürliche Wiedergabe.
- source_word: θάνατε
  choice: Tod
  rationale: Der Vokativ spricht den personifizierten Tod unmittelbar an. Im Deutschen bewahren die Anrede „Tod“ und die Kommas die poetische Apostrophe natürlich; ein zusätzliches „o“ wäre möglich, klänge aber stärker altertümlich.
- source_word: νῖκος
  choice: Sieg
  rationale: νῖκος bezeichnet Sieg oder Triumph. „Sieg“ ist klar und greift den unmittelbaren Zusammenhang mit Vers 54 auf. Die abweichende Lesart „Stachel“ wird in der Fußnote dokumentiert.
- source_word: κέντρον
  choice: Stachel
  rationale: κέντρον kann einen Stachel oder Treibstachel bezeichnen. Im Bild vom personifizierten Tod und angesichts der Erklärung in Vers 56 ist „Stachel“ die treffende, idiomatische Wiedergabe.
theological_decisions:
- issue: Lesart im ersten Satzteil
  choice: νῖκος gemäß SBLGNT mit „Sieg“ wiedergeben
  alternative: Den ersten Satzteil nach einer handschriftlichen Variante mit „Stachel“ übersetzen
  rationale: Die vorgegebene griechische Ausgabe liest νῖκος und bildet damit die Folge „Sieg … Stachel“. Das entspricht zudem dem unmittelbaren Zusammenhang von Vers 54. Die traditionsgeschichtlich bekannte Variante bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede des personifizierten Todes bleibt erhalten; auf das heute feierlich bis altertümlich wirkende „o Tod“ wird zugunsten der natürlichen Anrede „Tod“ verzichtet. Der Fußnotenmarker steht nach dem gesamten Vers, da die Anmerkung die Lesart des ersten Satzteils erläutert.
