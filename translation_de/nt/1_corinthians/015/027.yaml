source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: de
  text: 'Denn: »Alles hat er unter seine Füße gelegt.« Wenn es aber heißt[a]: »Alles ist unterworfen«, dann ist klar, dass derjenige ausgenommen ist, der ihm alles unterworfen hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wenn er aber sagt: »Alles ist unterworfen«.'
    reason: Der Satzgegenstand von εἴπῃ ist im Griechischen nicht ausdrücklich genannt und kann auch personal auf Gott bezogen werden.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: alles
  rationale: Das substantivierte Neutrum bezeichnet umfassend alles Geschaffene beziehungsweise alle Dinge, nicht speziell alle Menschen. „Alles“ ist im Deutschen natürlich und bewahrt zugleich den weiten Bezug der Anspielung auf Psalm 8.
- source_word: ὑπέταξεν
  choice: hat … unterworfen
  rationale: Das Verb bezeichnet das Versetzen in eine untergeordnete Stellung. Das deutsche Perfekt gibt die vollzogene Unterwerfung mit ihrer bleibenden Bedeutung idiomatisch wieder.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: unter seine Füße
  rationale: Die wörtliche Wiedergabe bewahrt das biblische Bild für Herrschaft und Unterwerfung sowie den Anklang an Psalm 8.
- source_word: ὅταν δὲ εἴπῃ
  choice: Wenn es aber heißt
  rationale: Die unpersönliche Formulierung lässt die Aussage beziehungsweise die Schrift als Bezugspunkt erkennen, ohne den im Griechischen unausgesprochenen Satzgegenstand vorschnell mit Gott gleichzusetzen.
- source_word: ὑποτέτακται
  choice: ist unterworfen
  rationale: Das Perfekt Passiv beschreibt einen vollzogenen Vorgang mit fortbestehendem Ergebnis. Der deutsche Zustandspassiv bringt besonders den daraus entstandenen Zustand natürlich zum Ausdruck.
- source_word: δῆλον
  choice: dann ist klar
  rationale: Die Formulierung gibt die von Paulus als einsichtig dargestellte Schlussfolgerung schlicht und verständlich wieder.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: dass derjenige ausgenommen ist, der ihm alles unterworfen hat
  rationale: ἐκτός bezeichnet hier eine Ausnahme. Die Formulierung macht deutlich, dass der Unterwerfende selbst nicht zu dem „Alles“ gehört, das dem Sohn unterworfen ist.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet denjenigen, dem alles unterworfen wurde; im Zusammenhang ist damit Christus gemeint.
theological_decisions:
- issue: Verhältnis zwischen dem Sohn und dem, der ihm alles unterwirft
  choice: Derjenige, der Christus alles unterworfen hat, wird ausdrücklich von dem unterworfenen „Alles“ ausgenommen.
  alternative: Eine knappere Formulierung wie „außer dem, der ihm alles unterworfen hat“ wäre ebenfalls möglich.
  rationale: Die Übersetzung bewahrt sowohl die umfassende Herrschaft Christi als auch die im Vers ausdrücklich gesetzte Ausnahme und die personale Unterscheidung, ohne darüber hinausgehende dogmatische Folgerungen in den Text einzutragen.
- issue: Unausgesprochener Satzgegenstand von ὅταν … εἴπῃ
  choice: Die Hauptübersetzung gibt die Wendung unpersönlich mit „wenn es … heißt“ wieder.
  alternative: „Wenn er aber sagt“ kann den unausgesprochenen Satzgegenstand auf Gott beziehen.
  rationale: Das Griechische nennt den Satzgegenstand nicht ausdrücklich. Die Hauptfassung folgt dem Bezug auf die zitierte Schriftaussage; die Fußnote bewahrt die grammatisch mögliche personale Auffassung.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Standardsprache. Das Schriftzitat wird durch deutsche Anführungszeichen kenntlich gemacht; das traditionelle biblische Bild „unter seine Füße“ bleibt erhalten.
