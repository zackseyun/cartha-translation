  to: 'Denn: »Alles hat er unter seine Füße gelegt.« Wenn es aber heißt[a]: »Alles ist unterworfen«, dann ist klar, dass derjenige ausgenommen ist, der ihm alles unterworfen hat.'
  rationale: Die Revision ersetzt ausschließlich die im Deutschen unnatürliche Verbindung „unter seine Füße unterworfen“ durch die etablierte Bildformulierung „unter seine Füße gelegt“ und positioniert den Fußnotenanker bei der syntaktisch betroffenen Wendung. Die Ausnahme des Unterwerfenden und die im Ausgangstext bestehende Ambiguität des unausgesprochenen Satzgegenstands bleiben erhalten.
