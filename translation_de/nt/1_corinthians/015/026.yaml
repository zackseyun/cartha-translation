  text: ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/026.yaml
  text: The last enemy to be abolished is death[a].
translation:
  language: de
  text: Als letzter Feind wird der Tod beseitigt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Der letzte Feind, der vernichtet wird, ist der Tod.'
    reason: Lexikalische und syntaktische Übersetzungsalternative zu καταργεῖται und zur prädikativen Satzstellung.
lexical_decisions:
- source_word: ἔσχατος
  choice: letzter
  rationale: Das Adjektiv bezeichnet das letzte Glied einer Reihenfolge und bewahrt hier die endzeitliche Abfolge in Paulus’ Argumentation.
- source_word: ἐχθρὸς
  choice: Feind
  rationale: Das Substantiv bezeichnet einen Gegner oder eine feindliche Macht. „Feind“ ist klar und erhält die Personifizierung des Todes.
- source_word: καταργεῖται
  choice: wird … beseitigt
  rationale: Das Präsens Passiv bezeichnet, dass der Tod außer Wirksamkeit gesetzt beziehungsweise zu Ende gebracht wird. „Beseitigt“ gibt diese Bedeutungsbreite natürlich wieder, ohne zwingend eine Aussage über Vernichtung im metaphysischen Sinn einzutragen.
- source_word: ὁ θάνατος
  choice: der Tod
  rationale: Der bestimmte Artikel und der Kontext stellen den Tod als personifizierten letzten Feind dar; im Deutschen ist daher „der Tod“ angemessen.
theological_decisions:
- issue: Wiedergabe von καταργεῖται im Blick auf die endgültige Niederlage des Todes
  choice: wird … beseitigt
  alternative: wird vernichtet
  rationale: Die gewählte Formulierung bewahrt den Sinn, dass der Tod als wirksame Macht ein Ende findet, ohne die semantische Spannweite des Verbs unnötig auf vollständige Vernichtung zu verengen. Die traditionelle stärkere Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung „Als letzter Feind“ bildet die Reihenfolge des griechischen ἔσχατος nach und ergibt zugleich einen natürlichen deutschen Satz.
