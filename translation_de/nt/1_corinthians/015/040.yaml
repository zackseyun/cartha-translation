  source_fidelity: Der Entwurf gibt σώματα, ἐπουράνια/ἐπίγεια, den Kontrast durch ἀλλά und die Gegenüberstellung der unterschiedlichen δόξα grundsätzlich treffend wieder. Das einleitende καί sollte jedoch mit „Und“ wiedergegeben werden. Die Ellipse „der himmlischen ... der irdischen“ ist nach der vorherigen Nennung von „Körpern“ verständlich und bewahrt die Offenheit des griechischen Bezugs.
  naturalness: „Himmlische Körper“ und „irdische Körper“ sind im modernen Standarddeutsch verständlich und angemessen. Ein Semikolon bildet die enge griechische Verbindung der beiden Satzteile besser ab als ein Satzschluss. „Aber“ ist als schlichter adversativer Anschluss etwas unmittelbarer als „Doch“.
  terminology: „Körper“ wahrt die breite Referenz von σώματα; „Herrlichkeit“ bewahrt bei δόξα sowohl den Sinn von Glanz/Pracht als auch den paulinischen Sprachgebrauch. Die Fußnote sollte nur die mögliche lexikalische Alternative „Himmelskörper“ anbieten und nicht zugleich den Haupttext durch „Glanz“ und die umständliche Umschreibung „Körper auf der Erde“ mehrfach umgestalten.
