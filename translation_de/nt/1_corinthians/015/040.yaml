  rationale: Die Revision ergänzt den griechischen Anschluss mit „Und“, erhält die knappe Ellipse und den qualitativen Kontrast der Herrlichkeit und vereinfacht die Fußnote zu einer präzisen, nicht festlegenden lexikalischen Alternative.
