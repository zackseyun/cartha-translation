    rationale: Die bisherige Fußnote kombiniert mehrere Änderungen und verwendet „Körper auf der Erde“, das keine gleichwertige natürliche lexikalische Alternative zu „irdische Körper“ ist. Die mögliche astronomische Lesart lässt sich klarer durch „Himmelskörper“ markieren.
