reference: 1 Corinthians 15:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: de
  text: Und es gibt himmlische Körper und irdische Körper[a]; aber die Herrlichkeit der himmlischen ist eine andere als die der irdischen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Himmelskörper und irdische Körper“.'
    reason: „Himmelskörper“ macht die mögliche astronomische Lesart von ἐπουράνια ausdrücklich, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: σώματα
  choice: Körper
  rationale: „Körper“ gibt σῶμα direkt wieder und lässt den Bezug bewusst offen, ohne ihn auf Himmelskörper, Auferstehungsleiber oder Wesen einzuengen.
- source_word: ἐπουράνια
  choice: himmlische
  rationale: „Himmlisch“ bezeichnet das zum Himmel Gehörende und bewahrt die größere Bedeutungsbreite gegenüber dem enger astronomisch klingenden „Himmelskörper“.
- source_word: ἐπίγεια
  choice: irdische
  rationale: „Irdisch“ entspricht dem Gegensatz zu „himmlisch“ und vermeidet die fachsprachliche Färbung von „terrestrisch“.
- source_word: ἀλλὰ
  choice: Doch
  rationale: „Doch“ bringt den einfachen Gegensatz natürlich und würdig zum Ausdruck.
- source_word: ἑτέρα ... ἑτέρα
  choice: eine andere als die
  rationale: Die Formulierung bewahrt den qualitativen Unterschied, den die wiederholte Form von ἕτερος ausdrückt, und ist im Deutschen idiomatischer als eine starre Wiederholung.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt den theologischen Wortschatz des Paulus und kann hier zugleich Glanz, Pracht und besondere Auszeichnung bezeichnen.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: der himmlischen ... der irdischen
  rationale: Die substantivierten Adjektive bilden die Ellipse des Griechischen nach; „Körper“ ist aus dem ersten Satz eindeutig zu ergänzen.
theological_decisions:
- issue: Bezug von „himmlischen Körpern“ und „irdischen Körpern“
  choice: Die Wendungen werden allgemein als „himmlische Körper“ und „irdische Körper“ wiedergegeben.
  alternative: „Himmelskörper und irdische Körper“ oder „himmlische Wesen und irdische Wesen“
  rationale: Der griechische Text spricht von σώματα, also Körpern, lässt den genauen Bezug an dieser Stelle aber offen. Die Übersetzung soll weder ausschließlich astronomische Objekte noch ausdrücklich Engelwesen voraussetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung „Körper“ im ersten Satz folgt der griechischen Gegenüberstellung; der zweite Satz bleibt durch die substantivierten Adjektive knapp.
