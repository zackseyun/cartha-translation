  text: ἔσχατον δὲ πάντων ὡσπερεὶ τῷ ἐκτρώματι ὤφθη κἀμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: de
  text: Zuletzt aber erschien er auch mir, gleichsam einer Fehlgeburt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem unzeitig Geborenen“. Wörtlich bezeichnet das griechische Wort eine Fehlgeburt oder etwas Abgetriebenes; Paulus gebraucht ein schroffes, selbsterniedrigendes Bild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: Zuletzt von allen aber
  rationale: ἔσχατον ist adverbial gebraucht, πάντων bezeichnet die Gesamtheit der zuvor genannten Zeugen, und δέ führt die Reihe mit einer leichten Absetzung fort. Die Wortfolge ist im Deutschen würdevoll und bewahrt die Struktur des Griechischen.
- source_word: ὡσπερεὶ
  choice: gleichsam
  rationale: Die Partikel leitet einen annähernden Vergleich ein. „Gleichsam“ erhält diese abschwächende Vergleichskraft, ohne das Bild als buchstäbliche Aussage festzulegen.
- source_word: τῷ ἐκτρώματι
  choice: der Fehlgeburt
  rationale: ἔκτρωμα bezeichnet wörtlich eine Fehlgeburt beziehungsweise ein vorzeitig oder nicht lebensfähig geborenes Kind. Die markante, selbsterniedrigende Metapher wird nicht durch eine erklärende Umschreibung geglättet.
- source_word: ὤφθη
  choice: erschien er
  rationale: Der Aorist Passiv von ὁράω wird im Zusammenhang der Auferstehungserscheinungen idiomatisch mit „erschien“ wiedergegeben; das implizite Subjekt ist der auferstandene Christus.
- source_word: κἀμοί
  choice: auch mir
  rationale: Die Krasis aus καί und ἐμοί hat additive Kraft und reiht Paulus unter die Empfänger der Erscheinungen ein.
theological_decisions:
- issue: Paulus’ Selbstbezeichnung ἐκτρώματι
  choice: Die schroffe Metapher „der Fehlgeburt“ im Haupttext bewahren.
  alternative: „einem unzeitig Geborenen“ oder „einem ungewöhnlich Geborenen“
  rationale: Der griechische Ausdruck ist bewusst drastisch und in seiner genauen Anwendung auf Paulus mehrdeutig. Die Übersetzung bewahrt Selbsterniedrigung und Spannung, ohne eine bestimmte Deutung seiner Berufung oder Apostelschaft einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gleichsam“ ist leicht gehoben, aber allgemein verständlich und bildet die vorsichtige Vergleichspartikel präzise ab. Die Härte von „Fehlgeburt“ ist durch den griechischen Ausdruck begründet und wird in der Fußnote erläutert.
