  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: de
  text: Danach erschien er mehr als fünfhundert Brüdern[a] zugleich. Die meisten von ihnen leben bis heute; einige aber sind entschlafen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Geschwistern“. Im Griechischen steht „Brüdern“; im frühchristlichen Sprachgebrauch kann das Wort mitunter die weitere Gemeinschaft der Glaubenden einschließlich Frauen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sie sind gestorben. Paulus verwendet das Bild des Entschlafens für den Tod im Licht der Hoffnung auf Auferstehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Danach
  rationale: Kennzeichnet die zeitliche Abfolge der von Paulus aufgezählten Erscheinungen und klingt im Deutschen natürlich.
- source_word: ὤφθη
  choice: erschien er
  rationale: Der Aorist Passiv von ὁράω wird in Berichten von Auferstehungserscheinungen idiomatisch mit „erschien“ wiedergegeben; das aus dem Kontext erschlossene Subjekt ist Christus.
- source_word: ἐπάνω πεντακοσίοις
  choice: mehr als fünfhundert
  rationale: 'ἐπάνω bezeichnet bei einer Zahl ein Überschreiten: „mehr als“ beziehungsweise „über“.'
- source_word: ἀδελφοῖς
  choice: Brüdern
  rationale: Bewahrt die maskuline Form des griechischen Ausdrucks; dass damit im frühchristlichen Sprachgebrauch auch die gesamte Glaubensgemeinschaft gemeint sein kann, wird in einer Fußnote offengehalten.
- source_word: ἐφάπαξ
  choice: zugleich
  rationale: Bezeichnet hier die Gleichzeitigkeit der Erscheinung vor der großen Gruppe und ist knapper und natürlicher als „zu einem einzigen Zeitpunkt“.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: Die meisten von ihnen
  rationale: Gibt den partitiven Sinn idiomatisch wieder und wahrt die Aussage, dass die Mehrheit der genannten Personen gemeint ist.
- source_word: μένουσιν ἕως ἄρτι
  choice: leben bis heute noch
  rationale: μένουσιν bedeutet wörtlich „bleiben“; im Gegensatz zu den Entschlafenen bezeichnet es hier das Fortleben bis in die Gegenwart des Paulus. Die Übersetzung macht diesen kontextuellen Sinn im Deutschen verständlich.
- source_word: τινὲς δὲ
  choice: einige aber
  rationale: δέ setzt einen milden Gegensatz zwischen der noch lebenden Mehrheit und den bereits Verstorbenen.
- source_word: ἐκοιμήθησαν
  choice: sind entschlafen
  rationale: Bewahrt das Bild des Schlafes als Ausdruck für den Tod, das im Zusammenhang der Auferstehungsaussage theologisch und rhetorisch bedeutsam ist.
theological_decisions:
- issue: Möglicherweise gemischte Bezugsgruppe bei ἀδελφοῖς
  choice: Brüdern
  alternative: Brüdern und Schwestern; Geschwistern
  rationale: Die maskuline Form des Ausgangstextes bleibt im Haupttext sichtbar. Eine mögliche inklusive Verwendung für die weitere Gemeinschaft der Glaubenden wird in der Fußnote genannt, ohne sie stillschweigend festzulegen.
- issue: Schlafmetapher für den Tod in ἐκοιμήθησαν
  choice: sind entschlafen
  alternative: sind gestorben
  rationale: Die Schlafmetapher wird angesichts des Auferstehungsthemas des Kapitels nicht eingeebnet; eine Fußnote erklärt ihre Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Danach“, „zugleich“ und die Aufteilung in zwei Sätze sorgen für einen natürlichen Lesefluss; „entschlafen“ bewahrt bewusst die bildhafte Sprache des griechischen Textes.
