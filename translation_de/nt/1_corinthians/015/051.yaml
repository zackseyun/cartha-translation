lexical_decisions:
- source_word: ἰδοὺ
  choice: Seht
  rationale: Bewahrt die aufmerksamkeitslenkende und feierliche Kraft des griechischen Diskursmarkers in einer verständlichen, würdigen Form.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Bezeichnet bei Paulus eine zuvor verborgene, nun offenbarte göttliche Wahrheit, nicht bloß etwas Rätselhaftes.
- source_word: ὑμῖν λέγω
  choice: ich sage euch
  rationale: Gibt die direkte Anrede und den deklarativen Charakter knapp und idiomatisch wieder.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: Wir werden nicht alle entschlafen
  rationale: Die Stellung von οὐ bei πάντες ergibt »nicht alle«. »Entschlafen« bewahrt das neutestamentliche Bild des Schlafes für den Tod und passt zum Auferstehungskontext.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: aber wir werden alle verwandelt werden
  rationale: »Verwandelt werden« gibt die endzeitliche Veränderung direkt wieder; »aber« macht den Kontrast zwischen dem Nicht-alle-Sterben und der Verwandlung aller deutlich.
theological_decisions:
- issue: Bedeutung des Schlafbildes im Auferstehungskontext
  choice: Das Bild wird mit »entschlafen« als Bezeichnung für den körperlichen Tod beibehalten.
  alternative: 'Interpretierend: »sterben«'
  rationale: So bleibt die Bildsprache des Paulus samt ihrem Bezug zur künftigen Auferstehung erhalten, ohne daraus eine besondere Lehre über den Zustand der Seele abzuleiten.
- issue: Textkritische Spannung bei Aussage und Satzfolge
  choice: 'Der Haupttext folgt dem SBLGNT: »Wir werden nicht alle entschlafen, aber wir werden alle verwandelt werden.«'
  alternative: 'Eine bemerkenswerte Variante besagt sinngemäß: »Wir werden alle entschlafen, aber wir werden nicht alle verwandelt werden.«'
  rationale: Die vorgelegte griechische Textform wird unmittelbar übersetzt; die inhaltlich bedeutsame abweichende Lesart wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. »Seht« trägt den feierlichen Aufrufcharakter; »entschlafen« ist leicht gehoben, erhält hier jedoch bewusst die paulinische Schlafmetapher.
