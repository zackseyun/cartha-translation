id: 1CO.15.16
reference: 1 Corinthians 15:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: de
  text: Denn wenn die Toten nicht auferweckt werden, dann ist auch der Messias[a] nicht auferweckt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Der griechische Titel Χριστός kann sowohl mit „Messias“ als auch nach traditionellem Sprachgebrauch mit „Christus“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: Gibt die begründende Funktion von γάρ und die Bedingung εἰ in natürlichem Deutsch wieder und wahrt den argumentativen Zusammenhang.
- source_word: νεκροὶ
  choice: die Toten
  rationale: Das substantivierte Adjektiv bezeichnet verstorbene Menschen allgemein; „die Toten“ ist prägnant und idiomatisch.
- source_word: οὐκ ἐγείρονται
  choice: nicht auferweckt werden
  rationale: Bewahrt das Präsens Passiv und in diesem Auferstehungskontext auch den Gedanken, dass die Toten auferweckt werden, statt von selbst aufzuerstehen.
- source_word: οὐδὲ
  choice: dann ist auch … nicht
  rationale: 'Die deutsche Konstruktion gibt innerhalb des Bedingungssatzes die einschließende beziehungsweise steigernde Folgerung natürlich wieder: Nicht einmal der Messias wäre auferweckt worden.'
- source_word: Χριστὸς
  choice: der Messias
  rationale: Gibt den griechischen Titel semantisch wieder; der bestimmte Artikel ist im Deutschen für die titelartige Verwendung natürlich, auch wenn Griechisch hier keinen Artikel setzt.
- source_word: ἐγήγερται
  choice: ist … auferweckt worden
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Auferweckung mit fortbestehendem Ergebnis; das deutsche Perfekt Passiv bewahrt sowohl Genus Verbi als auch Ergebnisbezug.
theological_decisions:
- issue: Wiedergabe von Χριστός im Auferstehungsargument
  choice: der Messias
  alternative: Christus
  rationale: „Messias“ macht die Bedeutung des Titels transparent, ohne die Aussage konfessionell zu verengen. Die traditionelle Wiedergabe „Christus“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- issue: Agens der Auferweckung
  choice: Passivform ohne ausdrücklich genanntes Agens
  alternative: Gott weckt die Toten beziehungsweise den Messias auf
  rationale: Der griechische Text nennt das handelnde Subjekt nicht ausdrücklich. Die Passivform bewahrt diese Offenheit und vermeidet eine erläuternde Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „auferweckt“ bildet die strenge Logik und den verbalen Gleichklang des griechischen Satzes ab; „dann“ verdeutlicht die Folgerung, ohne einen zusätzlichen theologischen Gedanken einzuführen.
