id: 1CO.15.25
reference: 1 Corinthians 15:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: de
  text: Denn er muss als König herrschen, bis er alle seine Feinde unter seine Füße gelegt hat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis er alle seine Feinde unter seine Füße legt“. Die griechische Formulierung verlangt hier nicht zwingend eine Unterscheidung zwischen diesen deutschen Zeitformen.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild, Feinde „unter seine Füße“ zu legen, steht in der Bibel für ihre vollständige Unterwerfung; vergleiche Psalm 110,1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: muss
  rationale: Gibt die Notwendigkeit beziehungsweise göttliche Unausweichlichkeit knapp und treffend wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet die Begründung der vorausgehenden Aussage und bewahrt den argumentativen Zusammenhang.
- source_word: αὐτὸν
  choice: er
  rationale: Das griechische Akkusativsubjekt zum Infinitiv wird im natürlichen deutschen Hauptsatz als Subjekt wiedergegeben.
- source_word: βασιλεύειν
  choice: als König herrschen
  rationale: Bewahrt ausdrücklich den königlichen Sinn des Verbs und klingt im modernen Deutsch natürlicher und eindeutiger als das alleinstehende „herrschen“.
- source_word: ἄχρι οὗ
  choice: bis
  rationale: Bezeichnet einen zeitlichen Zielpunkt, ohne für sich genommen auszusagen, dass die Herrschaft danach endet.
- source_word: θῇ
  choice: gelegt hat
  rationale: τίθημι bedeutet hier „setzen/legen“; das Perfekt nach „bis“ stellt die vollendete Unterwerfung idiomatisch dar, ohne eine im Griechischen zwingende Aspektdifferenz zu behaupten.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: alle seine Feinde
  rationale: Gibt die umfassende Aussage natürlich wieder; das Possessivpronomen verdeutlicht den durch αὐτοῦ im Zusammenhang gegebenen Bezug.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: unter seine Füße
  rationale: Bewahrt das biblische Bild vollständiger Unterwerfung unmittelbar und erkennbar.
theological_decisions:
- issue: Zeitliche Tragweite von ἄχρι οὗ („bis“)
  choice: „bis“ ohne Aussage darüber, ob die Herrschaft danach endet
  alternative: Eine Formulierung, die nahelegt, dass die Herrschaft mit der Unterwerfung der Feinde aufhört
  rationale: Die Wendung bezeichnet den Zeitpunkt, bis zu dem die Herrschaft hier betrachtet wird, behauptet aber nicht von sich aus ihr anschließendes Ende.
- issue: Handelndes Subjekt von θῇ
  choice: „er ... gelegt hat“ und damit Christus als Subjekt beibehalten
  alternative: 'Passivische Wiedergabe: „bis alle seine Feinde unter seine Füße gelegt sind“'
  rationale: Die naheliegende syntaktische Fortführung nimmt αὐτόν als Subjekt sowohl von βασιλεύειν als auch von θῇ. Das Passiv könnte einen anderen Handelnden nahelegen, den der griechische Satz hier nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als König herrschen“ macht den königlichen Gehalt von βασιλεύειν verständlich; Satzbau und Bildsprache bleiben eng am griechischen Text.
