  source_fidelity: Der Entwurf gibt δεῖ γὰρ αὐτὸν βασιλεύειν präzise als „Denn er muss als König herrschen“ wieder. „bis“ entspricht ἄχρι οὗ, ohne ein Ende der Herrschaft nach dem genannten Zielpunkt zu behaupten. Die aktive Fortführung „bis er ... gelegt hat“ bildet θῇ sachgerecht ab; „alle seine Feinde unter seine Füße“ bewahrt Umfang, Bezug und Bildsprache des griechischen Textes.
  naturalness: Der Satz ist modernes, würdiges und idiomatisches Standarddeutsch. „Als König herrschen“ ist etwas expliziter als das griechische Einzelverb, stellt aber keine inhaltliche Erweiterung dar und macht dessen königliche Bedeutung klar.
  terminology: 'Die zentralen Begriffe sind treffend gewählt: „muss“ wahrt die Notwendigkeit von δεῖ, „herrschen“ die Königsherrschaft von βασιλεύειν und „unter seine Füße legen“ die etablierte biblische Unterwerfungsmetapher. Die Fußnotenmarker sind korrekt gesetzt und die Anmerkungen entsprechen dem englischen Audit-Trail, ohne eine konfessionelle Deutung einzutragen.'
