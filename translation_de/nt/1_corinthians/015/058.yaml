id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: de
  text: Darum, meine geliebten Brüder[a], werdet standhaft und unerschütterlich und setzt euch jederzeit in reichem Maß für das Werk des Herrn ein; denn ihr wisst, dass eure Mühe im Herrn nicht vergeblich ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Brüder“ kann je nach Zusammenhang die Glaubenden insgesamt, also auch Frauen, bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Darum
  rationale: Kennzeichnet die Schlussfolgerung aus der vorausgehenden Argumentation über die Auferstehung und klingt im modernen Deutsch natürlich.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: meine geliebten Brüder
  rationale: Bewahrt die grammatisch maskuline Anrede und gibt ἀγαπητοί direkt wieder; der im Gemeindekontext mögliche Einschluss von Frauen wird in einer Fußnote erläutert.
- source_word: ἑδραῖοι γίνεσθε
  choice: seid standhaft
  rationale: Das idiomatische deutsche Imperativgefüge gibt die Aufforderung wieder, einen festen, beständigen Stand einzunehmen. Das wörtlichere „werdet standhaft“ könnte im Deutschen unnötig nahelegen, die Angesprochenen seien bislang nicht standhaft gewesen.
- source_word: ἀμετακίνητοι
  choice: unerschütterlich
  rationale: Bezeichnet, dass man sich nicht von seinem Stand abbringen lässt. „Unbeweglich“ wäre im heutigen Deutsch leicht körperlich missverständlich.
- source_word: περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε
  choice: Setzt euch allezeit mit ganzer Kraft für das Werk des Herrn ein
  rationale: Gibt die fortdauernde, über das bloße Mindestmaß hinausgehende Hingabe idiomatisch wieder, ohne das Werk des Herrn auf ein bestimmtes Amt einzuengen.
- source_word: εἰδότες
  choice: denn ihr wisst
  rationale: Das Partizip hat hier begründende Kraft; ein deutsches „wissend“ wäre steif und unnatürlich.
- source_word: ὁ κόπος ὑμῶν
  choice: eure Mühe
  rationale: Bringt die mit Anstrengung und Ermüdung verbundene Arbeit zum Ausdruck.
- source_word: οὐκ ἔστιν κενός
  choice: nicht vergeblich ist
  rationale: „Nicht vergeblich“ ist die natürliche deutsche Wiedergabe für Arbeit, die nicht leer, fruchtlos oder ohne Ergebnis bleibt.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Bewahrt die für Paulus charakteristische, theologisch weit gefasste Wendung, ohne sie auf Mittel, Ursache oder Beziehung festzulegen.
theological_decisions:
- issue: Referenz von ἀδελφοί
  choice: „Brüder“ im Haupttext mit Hinweis auf den möglichen inklusiven Gemeindebezug
  alternative: „Brüder und Schwestern“
  rationale: Die griechische Form ist maskulin plural, kann in dieser Anrede an die ganze Gemeinde jedoch Frauen einschließen. Haupttext und Fußnote bewahren gemeinsam Form und kontextuellen Umfang.
- issue: Bezug von ἐν κυρίῳ am Versende
  choice: „eure Mühe im Herrn ist nicht vergeblich“
  alternative: „eure Mühe ist durch den Herrn nicht vergeblich“
  rationale: Die knappe Präpositionalphrase bleibt wie im Griechischen bei „Mühe“ stehen und bewahrt ihre paulinische Weite, statt sie eindeutig kausal oder instrumental auszulegen.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und kontextuell angemessene Wiedergabe, ohne die christologische Aussage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung und die begründende Verbindung „denn“ vermeiden schwerfällige Partizipialkonstruktionen. „Allezeit“ wahrt einen leicht gehobenen biblischen Ton, bleibt aber allgemein verständlich.
