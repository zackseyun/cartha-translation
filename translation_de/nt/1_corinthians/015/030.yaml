  text: Why are we also in danger every hour?[a]
translation:
  language: de
  text: Warum sind auch wir jede Stunde in Gefahr?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Was [ist es], dass auch wir jede Stunde in Gefahr sind?“ Im Zusammenhang: „Warum sind auch wir jede Stunde in Gefahr?“'
    reason: Lexikalische Alternative bei τί und formnähere Wiedergabe der griechischen Frage.
lexical_decisions:
- source_word: τί
  choice: Warum
  rationale: In der rhetorischen Frage bezeichnet τί den Grund beziehungsweise Sinn des Handelns. „Warum“ gibt die argumentative Kraft im Zusammenhang natürlich wieder.
- source_word: καὶ
  choice: auch
  rationale: καὶ fügt Paulus und seine Mitarbeiter den zuvor genannten Beispielen hinzu; „auch“ bewahrt diesen additiven Sinn.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten. Zusammen mit „auch“ tritt die gemeinte Gruppe hinreichend hervor.
- source_word: κινδυνεύομεν
  choice: bringen uns … in Gefahr
  rationale: κινδυνεύω bedeutet, in Gefahr zu sein beziehungsweise sich einer Gefahr auszusetzen. Die gewählte Formulierung ist im Deutschen idiomatisch, ohne die Gefahr ausdrücklich auf Lebensgefahr einzuengen.
- source_word: πᾶσαν ὥραν
  choice: jede Stunde
  rationale: Die Wendung bezeichnet eine fortwährende Gefährdung. „Jede Stunde“ bleibt eng am griechischen Wortlaut und ist zugleich verständlich.
theological_decisions:
- issue: Rhetorische Funktion innerhalb von Paulus’ Argumentation über die Auferstehung
  choice: Die Frage hebt hervor, wie sinnlos die fortwährende Gefährdung der apostolischen Verkündiger wäre, wenn Tote nicht auferweckt werden.
  alternative: Als sachliche Frage nach der Art der Gefahr oder als ausdrückliche Aussage über Lebensgefahr übersetzen.
  rationale: Wortlaut und unmittelbarer Zusammenhang tragen eine rhetorische Frage nach dem Grund beziehungsweise Sinn. Die Übersetzung bewahrt diese Spannung, ohne eine weitergehende Lehrfolgerung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist rhetorisch klar und eng am Ausgangstext; „jede Stunde“ bewahrt dessen anschauliche Ausdrucksweise.
