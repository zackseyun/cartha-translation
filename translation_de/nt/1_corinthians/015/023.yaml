id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: de
  text: 'Doch jeder in seiner eigenen Reihenfolge: der Messias als Erstlingsfrucht[a], danach die, die zum Messias gehören, bei seinem Kommen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«. Das griechische Χριστός bedeutet »Gesalbter« und ist hier ein Titel.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Ankunft« oder »Gegenwart«. In diesem Zusammenhang ist das zukünftige Kommen des Messias gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: jeder
  rationale: Das distributive Pronomen bezieht sich im Zusammenhang auf die Auferstehenden und gibt die Einzelaussage knapp und natürlich wieder.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: in seiner eigenen Reihenfolge
  rationale: τάγμα kann eine geordnete Stellung oder Abfolge bezeichnen; hier steht die zeitliche Ordnung der Auferstehung im Vordergrund, ohne dass ein militärischer Beiklang nötig ist.
- source_word: ἀπαρχή
  choice: die Erstlingsfrucht
  rationale: 'Die Wiedergabe bewahrt das Ernte- und Opferbild: Der erste Ertrag steht zugleich für den Anfang dessen, was noch folgt.'
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός tritt hier deutlich als Titel des Gesalbten hervor. »Der Messias« macht diesen Titelcharakter im heutigen Deutsch verständlich.
- source_word: οἱ τοῦ Χριστοῦ
  choice: die, die zum Messias gehören
  rationale: Der Genitiv bezeichnet Zugehörigkeit; diese Formulierung ist klar, gegenwärtig und bewahrt den relationalen Sinn.
- source_word: παρουσίᾳ
  choice: Kommen
  rationale: παρουσία kann Anwesenheit, Ankunft oder Kommen bedeuten. Im eschatologischen Ablauf dieses Verses bezeichnet es das zukünftige Kommen des Messias.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: Christus
  rationale: Im Gegensatz zwischen dem Messias und den zu ihm Gehörenden ist die Titelfunktion besonders deutlich. Die Fußnote hält die traditionelle Wiedergabe »Christus« sichtbar.
- issue: Wiedergabe von παρουσία im eschatologischen Zusammenhang
  choice: Kommen
  alternative: Ankunft oder Gegenwart
  rationale: »Kommen« bezeichnet den zukünftigen Vorgang verständlich, ohne die lexikalische Spannweite des griechischen Wortes zu leugnen.
- issue: Verhältnis Christi zur ἀπαρχή
  choice: 'appositionell: »der Messias, die Erstlingsfrucht«'
  alternative: »der Messias als Erstlingsfrucht«
  rationale: Das Griechische setzt beide Ausdrücke ohne ausdrückliches Vergleichs- oder Zuordnungswort nebeneinander. Die Apposition bewahrt diese knappe Identifikation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und folgt der griechischen Abfolge. »Erstlingsfrucht« bewahrt bewusst das biblische Erntebild, auch wenn das Wort im Alltagsdeutsch selten ist.
