  text: καὶ ὅτι ἐτάφη, καὶ ὅτι ἐγήγερται τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: de
  text: und dass er begraben wurde und dass er am dritten Tag gemäß den Schriften auferweckt worden ist[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auferweckt wurde“. Das griechische Perfekt kann die bleibende Bedeutung der Auferweckung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: er begraben wurde
  rationale: Der Aorist Passiv von θάπτω bezeichnet schlicht das Begrabenwerden. Die Formulierung ist im modernen Deutsch natürlich und bewahrt das Passiv, ohne Einzelheiten zur Bestattung hinzuzufügen.
- source_word: ἐγήγερται
  choice: er auferweckt worden ist
  rationale: Das Perfekt Passiv von ἐγείρω bezeichnet die vollzogene Auferweckung mit fortdauernder Bedeutung. Das deutsche Perfekt Passiv gibt sowohl den vollendeten Vorgang als auch die passive Form wieder.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: am dritten Tag
  rationale: Die temporale Dativfügung bedeutet idiomatisch „am dritten Tag“. Ein Zusatz wie „danach“ würde über den griechischen Wortlaut hinausgehen.
- source_word: κατὰ τὰς γραφάς
  choice: gemäß den Schriften
  rationale: Die Wendung bezeichnet die Übereinstimmung mit dem Zeugnis der Schriften. „Gemäß“ ist klar, würdig und erhält den formelhaften Zusammenhang mit Vers 3.
- source_word: γραφαί
  choice: die Schriften
  rationale: Der Ausdruck bezeichnet hier die als heilig anerkannten Schriften und nicht beliebige Schriftstücke.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet die einzelnen Aussagen der überlieferten Bekenntnisformel ein. Die Wiederholung von „dass“ bewahrt deren Gliederung.
- source_word: καί
  choice: und
  rationale: Die wiederholte Konjunktion verbindet die Aussagen der Formel; sie wird zur Wahrung ihres Rhythmus beibehalten.
theological_decisions:
- issue: Aspekt und Genus des Auferstehungsverbs
  choice: auferweckt worden ist
  alternative: auferweckt wurde; auferstanden ist
  rationale: Das griechische Perfekt Passiv stellt die Auferweckung als vollzogene Tat mit bleibender Geltung dar. Die gewählte Wiedergabe erhält zudem das Passiv und vermeidet es, dieses in eine aktive oder intransitive Aussage umzudeuten.
- issue: Bezug von „den Schriften“
  choice: den Schriften
  alternative: den heiligen Schriften; den jüdischen Schriften
  rationale: Paulus setzt den bekannten Schriftbestand voraus, ohne ihn an dieser Stelle näher zu bestimmen. Zusätze wie „heilig“ oder „jüdisch“ wären sachlich erklärend, stehen aber nicht ausdrücklich im griechischen Text.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bekenntnishaftem Rhythmus. Die wiederholte dass-Struktur und das Passiv des griechischen Textes bleiben erhalten. Der Vers ist als Fortsetzung des vorangehenden Satzes formuliert.
