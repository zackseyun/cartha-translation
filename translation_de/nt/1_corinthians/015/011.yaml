source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: de
  text: 'Ob nun ich oder sie: So verkündigen wir, und so habt ihr geglaubt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: ob ... oder
  rationale: Die korrelative Wendung stellt zwei Alternativen gegenüber und wird im Deutschen natürlich mit »ob … oder« wiedergegeben.
- source_word: οὖν
  choice: nun
  rationale: »Nun« kennzeichnet hier die folgernde Zusammenfassung des zuvor Gesagten, ohne den Zusammenhang stärker zu bestimmen als der griechische Text.
- source_word: ἐγὼ ... ἐκεῖνοι
  choice: ich ... sie
  rationale: Die Gegenüberstellung meint Paulus einerseits und die zuvor genannten anderen apostolischen Zeugen andererseits. »Sie« ist im Deutschen natürlich und aus dem Kontext eindeutig.
- source_word: οὕτως ... οὕτως
  choice: so ... so
  rationale: Die identische Wiedergabe bewahrt die bewusste Parallelität und lässt offen, ob vor allem Inhalt oder Art der Verkündigung und des Glaubens bezeichnet wird.
- source_word: κηρύσσομεν
  choice: verkündigen wir
  rationale: »Verkündigen« gibt den öffentlichen, autoritativen Charakter von κηρύσσω angemessen und im kirchlichen wie allgemeinen Sprachgebrauch verständlich wieder.
- source_word: ἐπιστεύσατε
  choice: habt ihr geglaubt
  rationale: Das Perfekt ist eine natürliche deutsche Wiedergabe des griechischen Aorists und bezeichnet den zurückliegenden Glaubensakt der Korinther, ohne ein zusätzliches Objekt einzuführen.
theological_decisions:
- issue: Einheit der apostolischen Verkündigung
  choice: Der Satz stellt Paulus und die anderen Zeugen als Träger derselben Verkündigung dar, auf die der Glaube der Korinther antwortete.
  alternative: 'Die Wiederholung von οὕτως kann stärker auf die Art und Weise verstanden werden: »Auf diese Weise verkündigen wir, und auf diese Weise habt ihr geglaubt.«'
  rationale: Die knappe Wiedergabe mit zweimaligem »so« bewahrt sowohl den Bezug auf den zuvor zusammengefassten Inhalt als auch eine mögliche modale Nuance, ohne weitergehende ekklesiologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die folgernde Hauptaussage nach der vorangestellten Alternative klar; die Wiederholung von »so« bildet die griechische Parallelstruktur knapp und hörbar nach.
