source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: de
  text: 'So steht es auch geschrieben: »Der erste Mensch, Adam, wurde zu einem lebendigen Wesen[a]«; der letzte Adam wurde zu einem Geist, der lebendig macht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einer lebendigen Seele«; so lautet die traditionelle Wiedergabe im Anklang an 1. Mose 2,7.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »zu einem lebenspendenden Geist«. Die Formulierung beschreibt den letzten Adam im Gegensatz zum ersten und identifiziert ihn nicht ausdrücklich mit dem Heiligen Geist als eigener Person.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: So steht es auch geschrieben
  rationale: Die geläufige deutsche Schriftformel »es steht geschrieben« gibt γέγραπται natürlich wieder; »auch« bewahrt die Verknüpfung mit der vorausgehenden Argumentation.
- source_word: Ἐγένετο
  choice: wurde zu
  rationale: Die Formulierung bezeichnet das Eintreten in einen Zustand und bewahrt mit »zu« die Konstruktion mit εἰς.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: der erste Mensch
  rationale: »Mensch« entspricht ἄνθρωπος im Deutschen idiomatisch und erhält den typologischen Bezug auf Adam.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Der Personenname folgt der üblichen deutschen biblischen Schreibweise.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: zu einem lebendigen Wesen
  rationale: Im Anklang an 1. Mose 2,7 bezeichnet ψυχή hier Adam als belebtes Lebewesen beziehungsweise als lebendige Person, nicht eindeutig eine vom Körper trennbare Seele. Die traditionelle Wiedergabe wird in der Fußnote genannt.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: der letzte Adam
  rationale: Die etablierte Wendung bewahrt den eschatologischen und typologischen Gegensatz zwischen Adam und Christus.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: zu einem Geist, der lebendig macht
  rationale: Die Relativsatzform gibt das substantivierte Partizip ζῳοποιοῦν klar wieder. Der unbestimmte Ausdruck »einem Geist« bewahrt den qualitativen Charakter der artikellosen griechischen Formulierung.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή im Zitat aus 1. Mose 2,7
  choice: »lebendiges Wesen«
  alternative: »lebendige Seele«
  rationale: Der Kontext spricht von Adam als einem belebten Menschen und legt keine präzise Lehre über eine immaterielle Teilsubstanz fest. Die alternative traditionelle Form bleibt in einer Fußnote sichtbar.
- issue: Bedeutung von πνεῦμα ζῳοποιοῦν für den letzten Adam
  choice: »ein Geist, der lebendig macht«
  alternative: »der Leben gebende Geist«
  rationale: Die artikellose griechische Wendung ist qualitativ und identifiziert Christus nicht ausdrücklich mit dem Heiligen Geist als eigener Person. Die Übersetzung wahrt den Gegensatz, ohne ihn dogmatisch einzuengen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Schriftformel ist bewusst idiomatisch gehalten; die Adam-Christus-Typologie und die Spannung zwischen ψυχή und πνεῦμα bleiben ohne konfessionelle Ausdeutung erhalten.
