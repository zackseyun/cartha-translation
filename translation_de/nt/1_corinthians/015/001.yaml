source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: de
  text: Ich mache euch aber, Brüder[a], die gute Nachricht bekannt, die ich euch verkündet habe, die ihr auch empfangen habt und in der ihr auch fest steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann als Anrede die ganze gläubige Gemeinschaft einschließlich der Frauen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: Ich teile euch mit
  rationale: Das Präsens bedeutet hier unmittelbar „bekannt machen“ bzw. „mitteilen“. Die Wiedergabe vermeidet das stärker deutende „ich erinnere euch“ und klingt im modernen Deutschen natürlich.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet einen leichten Übergang und keinen scharfen Gegensatz. „Aber“ bildet den Konnektor knapp ab; seine milde Funktion ergibt sich aus dem Zusammenhang.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird formnah wiedergegeben. Da sie im paulinischen Sprachgebrauch häufig die gesamte Gemeinde einschließlich der Frauen anspricht, erläutert dies eine Fußnote.
- source_word: τὸ εὐαγγέλιον
  choice: die gute Nachricht
  rationale: Die transparente Grundbedeutung von εὐαγγέλιον wird in allgemein verständlichem Deutsch ausgedrückt; „Evangelium“ wäre ebenfalls möglich, ist aber stärker kirchensprachlich geprägt.
- source_word: εὐηγγελισάμην
  choice: verkündet habe
  rationale: Das Verb bezeichnet das öffentliche Bekanntmachen der guten Nachricht. „Verkündet“ ist würdig und idiomatisch, ohne die Wortverwandtschaft im Deutschen gezwungen nachzuahmen.
- source_word: παρελάβετε
  choice: empfangen habt
  rationale: Das Verb bezeichnet hier das Empfangen einer überlieferten Botschaft. „Empfangen“ lässt offen, in welchem Maß Annahme oder Zustimmung mitgemeint ist.
- source_word: ἐν ᾧ
  choice: in der
  rationale: Die Präposition bezeichnet die gute Nachricht als den Bereich bzw. Grund, in dem die Adressaten stehen. Die feminine Form richtet sich nach „Nachricht“.
- source_word: ἑστήκατε
  choice: fest steht
  rationale: Das Perfekt beschreibt einen gegenwärtigen, aus einem früheren Geschehen hervorgegangenen Zustand. „Fest stehen“ gibt in diesem Kontext die Beständigkeit idiomatisch wieder.
theological_decisions:
- issue: Anrede ἀδελφοί an eine gemischte Gemeinde
  choice: „Brüder“ im Haupttext mit erläuternder Fußnote
  alternative: „Brüder und Schwestern“
  rationale: Die Form des griechischen Ausdrucks bleibt sichtbar, während die Fußnote seinen wahrscheinlich inklusiven gemeindlichen Bezug erklärt.
- issue: Bedeutung des Stehens in der guten Nachricht
  choice: „in der ihr auch fest steht“
  alternative: „durch die ihr ... steht“
  rationale: ἐν ᾧ wird räumlich-metaphorisch mit „in der“ wiedergegeben, ohne bereits die instrumentale Aussage des folgenden Verses vorwegzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber durch die Verbindung mit „und“ am Ende natürlich lesbar gehalten.
