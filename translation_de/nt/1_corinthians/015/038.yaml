source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: de
  text: Gott aber gibt ihm einen Körper, wie er wollte, und jedem Samenkorn seinen eigenen Körper.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jedem von den Samenkörnern seinen eigenen Körper“. Die griechische Formulierung kann distributiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: gibt ihm
  rationale: Das Präsens wird direkt mit „gibt“ wiedergegeben; „ihm“ nimmt das einzelne Samenkorn aus dem vorausgehenden Zusammenhang auf und bewahrt die Dativkonstruktion natürlich im Deutschen.
- source_word: σῶμα
  choice: Körper
  rationale: „Körper“ ist hier die natürliche Wiedergabe von σῶμα und hält die begriffliche Verbindung zur leiblichen Auferstehung im weiteren Kapitel aufrecht.
- source_word: καθὼς ἠθέλησεν
  choice: wie er gewollt hat
  rationale: Die Formulierung gibt den Aorist von θέλω als vollzogenen Willensentschluss wieder, ohne den Zeitpunkt näher festzulegen oder zusätzliche Deutung einzutragen.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: jedem Samenkorn
  rationale: Die idiomatische deutsche Einzahl nach „jedem“ gibt die distributive Bedeutung der griechischen Wendung wieder. „Samenkorn“ bezeichnet in diesem landwirtschaftlichen Bild eindeutig das einzelne Saatkorn.
- source_word: ἴδιον
  choice: seinen eigenen
  rationale: „Seinen eigenen“ bewahrt die individualisierende Kraft von ἴδιον und stimmt grammatisch mit „Samenkorn“ überein.
theological_decisions:
- issue: Gottes Handeln und Wollen im Bild von Saat und Körper
  choice: Die Übersetzung stellt heraus, dass Gott jedem Samenkorn den ihm eigenen Körper entsprechend seinem Willen gibt.
  alternative: Eine stärker deutende Fassung könnte von einer jeweils eigenen „Art“ oder „Gestalt“ sprechen.
  rationale: Der griechische Text betont Gottes Geben und Wollen sowie den jeweils eigenen Körper, nennt aber weder ausdrücklich biologische Arten noch erklärt er den Vorgang. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am Griechischen, ohne unnötig hölzern zu wirken; „Samenkorn“ hält das konkrete Bild lebendig.
