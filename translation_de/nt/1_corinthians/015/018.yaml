id: 1CO.15.18
reference: 1 Corinthians 15:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: de
  text: Folglich sind auch die, die im Messias entschlafen sind, verloren.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus“.'
    reason: alternative_reading
  - marker: b
    text: „Entschlafen“ ist eine griechische verhüllende Bezeichnung für den Tod, besonders für den Tod von Glaubenden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Folglich
  rationale: Die Folgerungspartikel zieht die Konsequenz aus der vorangehenden Argumentation und gibt den Gedankengang des Paulus natürlich wieder.
- source_word: καὶ
  choice: auch
  rationale: Das Wort fügt die im Messias Verstorbenen zu den bereits genannten Konsequenzen hinzu.
- source_word: οἱ κοιμηθέντες
  choice: die, die … entschlafen sind
  rationale: Die Formulierung bewahrt das griechische Bild des Schlafes als verhüllende Bezeichnung für den Tod; „entschlafen“ ist im Deutschen verständlich und würdevoll.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός bezeichnet den Gesalbten beziehungsweise Messias; zugleich bleibt die paulinische Verbindung mit ihm sprachlich erhalten.
- source_word: ἀπώλοντο
  choice: verloren
  rationale: ἀπόλλυμι bezeichnet hier das endgültige Verlorengehen als Konsequenz der angenommenen Nichterweckung. Das deutsche Resultatsprädikat „sind verloren“ gibt den aus dem Aorist folgenden Zustand idiomatisch wieder, ohne die Art des Verderbens näher festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in der paulinischen Wendung ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: „Messias“ übersetzt den Titel, während „Christus“ die kirchlich vertraute Form der paulinischen Wendung ist; die Alternative wird deshalb in einer Fußnote genannt.
- issue: Bedeutungsumfang von ἀπώλοντο
  choice: sind verloren
  alternative: sind zugrunde gegangen
  rationale: „Sind verloren“ bewahrt in diesem hypothetischen Argument den theologischen Ernst und den resultierenden Zustand, ohne das Verb unnötig als physische Vernichtung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem Deutschen, bewahrt aber die knappe Schlussfolgerung und die Schlafmetapher des griechischen Textes.
