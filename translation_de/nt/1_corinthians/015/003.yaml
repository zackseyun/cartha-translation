id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: de
  text: 'Denn ich habe euch vor allem weitergegeben, was ich auch empfangen habe: Der Messias[a] starb für unsere Sünden gemäß den Schriften.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“, kann aber auch mit der im Deutschen eingebürgerten Form „Christus“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „nach den Schriften“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: ich habe … weitergegeben
  rationale: Das Verb bezeichnet hier die verbindliche Weitergabe einer empfangenen Überlieferung. „Weitergegeben“ bildet diesen Vorgang im heutigen Deutsch natürlich ab.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion leitet eine Begründung beziehungsweise Erläuterung des vorausgehenden Gedankens ein.
- source_word: ἐν πρώτοις
  choice: vor allem
  rationale: Im Zusammenhang bezeichnet die Wendung am ehesten den besonderen Rang des Überlieferten. „Vor allem“ ist natürlich und lässt einen möglichen Anklang an die Reihenfolge offen.
- source_word: ὃ καὶ παρέλαβον
  choice: was ich auch empfangen habe
  rationale: Die Formulierung bewahrt die Parallelität zwischen dem Empfangen und dem Weitergeben der Überlieferung.
- source_word: ὅτι
  choice: Doppelpunkt mit folgendem Aussagesatz
  rationale: ὅτι führt den Inhalt der empfangenen und weitergegebenen Botschaft ein. Nach dem Doppelpunkt ist im Deutschen ein selbstständiger Aussagesatz klarer und würdiger als eine längere dass-Konstruktion.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός hat in dieser bekenntnishaften Zusammenfassung erkennbaren Titelcharakter. „Der Messias“ macht diesen jüdisch-messianischen Sinn transparent.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Das Präteritum gibt den griechischen Aorist als punktuelles vergangenes Geschehen knapp und angemessen wieder.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: für unsere Sünden
  rationale: Diese traditionelle und natürliche Wendung bewahrt die heilsgeschichtliche Aussage, ohne eine bestimmte Sühnetheorie über den griechischen Wortlaut hinaus festzulegen.
- source_word: κατὰ τὰς γραφάς
  choice: wie es in den Schriften vorausgesagt ist
  rationale: κατά bezeichnet hier die Übereinstimmung des Geschehens mit den Schriften. Die Formulierung macht diesen Bezug im modernen Deutsch verständlich; die wörtlichere Möglichkeit wird in einer Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: In der überlieferten Bekenntnisformel steht der Titelcharakter im Vordergrund. Die Alternative „Christus“ bleibt sachlich möglich und wird deshalb in einer Fußnote genannt.
- issue: Bedeutung von ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: für unsere Sünden
  alternative: unserer Sünden wegen
  rationale: „Für unsere Sünden“ lässt offen, ob besonders Stellvertretung, Veranlassung oder ein weiterer Heilszusammenhang betont wird, und vermeidet damit eine unnötige dogmatische Verengung.
- issue: Bezug von κατὰ τὰς γραφάς
  choice: wie es in den Schriften vorausgesagt ist
  alternative: gemäß den Schriften
  rationale: Die gewählte Fassung versteht die Schriften als vorwegnehmendes Zeugnis des Todes des Messias. Da κατά allgemeiner auch Übereinstimmung ausdrücken kann, wird die formalere Alternative in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bekenntnishaftem Ton. „Weitergegeben“ und „empfangen“ bewahren den Überlieferungscharakter; die knappe Satzfolge nach dem Doppelpunkt entspricht dem formelhaften Charakter des griechischen Textes.
