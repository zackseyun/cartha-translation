id: 1CO.15.57
reference: 1 Corinthians 15:57
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: de
  text: Gott aber sei Dank, der uns den Sieg gibt durch unseren Herrn Jesus, den Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »Jesus Christus«. Der griechische Titel Χριστός bedeutet »Messias« beziehungsweise »Gesalbter«.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: sei Dank
  rationale: In der elliptischen Dankformel τῷ θεῷ χάρις bezeichnet χάρις hier Dank, nicht Gnade. „Gott sei Dank“ gibt die doxologische Wendung natürlich und würdig wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert den Kontrast beziehungsweise die rhetorische Wende von der Macht des Todes zur Danksagung.
- source_word: τῷ διδόντι
  choice: der … gibt
  rationale: Das substantivierte Präsenspartizip bezeichnet Gott als den, der den Sieg gibt; das Präsens wahrt den allgemeinen beziehungsweise fortdauernden Sinn.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger des Sieges.
- source_word: τὸ νῖκος
  choice: den Sieg
  rationale: Der bestimmte Artikel verweist auf den im Zusammenhang beschriebenen Sieg über Tod und Vergänglichkeit.
- source_word: διὰ
  choice: durch
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise Mittel.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseren Herrn
  rationale: κύριος wird als christologischer Titel mit „Herr“ wiedergegeben; ἡμῶν erscheint idiomatisch als Possessivbegleiter.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  rationale: Χριστός ist der griechische Titel „Gesalbter/Messias“. Die Apposition „Jesus, den Messias“ macht den Titelsinn im Deutschen verständlich, ohne den Eigennamen Jesus zu verändern.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: „Jesus, den Messias“ im Haupttext
  alternative: „Jesus Christus“
  rationale: Χριστός trägt hier weiterhin den Sinn eines Titels. „Messias“ macht diesen transparent; die traditionelle, im Deutschen stark namensähnliche Form „Christus“ bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute Dankformel „Gott aber sei Dank“ bewahrt den feierlichen Ton; die Wortstellung bleibt klar und nahe am griechischen Satz.
