  source_fidelity: 'Die Übersetzung gibt sämtliche Elemente des griechischen Satzes zuverlässig wieder: die doppelte Betonung der Plötzlichkeit (ἐν ἀτόμῳ / ἐν ῥιπῇ ὀφθαλμοῦ), die letzte Posaune, das künftige Erschallen, die passive Auferweckung der Toten als Unvergängliche sowie die Verwandlung des ausdrücklich genannten „wir“. Die Passivformen bewahren angemessen, dass kein Handelnder ausdrücklich genannt wird.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „In einem Nu, in einem Wimpernschlag“ ist idiomatisch und bildet die rhetorisch verdoppelnde Kürze des Griechischen gut ab. Die Folge „werden unvergänglich auferweckt werden“ ist wegen des deutschen Futurpassivs stilistisch etwas schwer, aber grammatisch korrekt und für den sakral-literarischen Register des Verses vertretbar.
  terminology: „Letzte Posaune“, „die Toten“, „auferweckt“, „unvergänglich“ und „verwandelt“ sind fachlich wie bibelsprachlich geeignete Wiedergaben. Insbesondere legt „letzte Posaune“ kein bestimmtes endzeitliches System fest. „Wir“ bleibt, wie im griechischen Text, ohne interpretierende Ergänzung stehen.
