id: 1CO.15.52
reference: 1 Corinthians 15:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: de
  text: in einem Nu[a], in einem Wimpernschlag, bei der letzten Posaune. Denn die Posaune wird erschallen, und die Toten werden unvergänglich auferweckt werden, und wir werden verwandelt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „in einem Unteilbaren“; gemeint ist ein denkbar kurzer Zeitpunkt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: in einem Nu
  rationale: ἄτομος bezeichnet wörtlich etwas Unteilbares und hier einen denkbar kurzen Zeitpunkt. „In einem Nu“ gibt diese zeitliche Kürze in natürlichem, gehobenem Deutsch wieder.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: in einem Wimpernschlag
  rationale: Die Wendung bezeichnet eine äußerst schnelle Augenbewegung und damit äußerste Plötzlichkeit. „In einem Wimpernschlag“ ist im heutigen Deutsch anschaulich und idiomatisch.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: bei der letzten Posaune
  rationale: Die Präposition ἐν hat hier zeitlichen beziehungsweise begleitenden Sinn. „Bei der letzten Posaune“ bewahrt das eschatologische Bild, ohne den Ablauf näher festzulegen.
- source_word: σαλπίσει
  choice: die Posaune wird erschallen
  rationale: Das Verb bedeutet, eine Posaune zu blasen beziehungsweise dass ein Posaunensignal ertönt. Das unmittelbar zuvor genannte Instrument wird im Deutschen als Subjekt aufgenommen.
- source_word: οἱ νεκροὶ
  choice: die Toten
  rationale: Das substantivierte Adjektiv bezeichnet die verstorbenen Menschen als Gruppe; „die Toten“ ist die direkte und geläufige Wiedergabe.
- source_word: ἐγερθήσονται
  choice: werden auferweckt werden
  rationale: Der Futur Passiv von ἐγείρω bezeichnet im Kontext die Auferweckung der Toten. Die passive Form bleibt erhalten und deutet den Handelnden nicht über den Wortlaut hinaus aus.
- source_word: ἄφθαρτοι
  choice: unvergänglich
  rationale: ἄφθαρτος bezeichnet Freiheit von Verfall und Vergänglichkeit. „Unvergänglich“ ist verständlich und greift den zentralen Gegensatz des Kapitels auf.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und wahrt den Kontrast zu „den Toten“, ohne die Bezugsgruppe erläuternd zu erweitern.
- source_word: ἀλλαγησόμεθα
  choice: werden verwandelt werden
  rationale: Der Futur Passiv von ἀλλάσσω bezeichnet eine Veränderung. „Verwandelt werden“ klingt im Deutschen natürlich und bringt die tiefgreifende Veränderung im Auferstehungskontext zum Ausdruck.
theological_decisions:
- issue: Die letzte Posaune ohne Festlegung auf ein bestimmtes Endzeitsystem wiedergeben
  choice: bei der letzten Posaune
  alternative: bei der abschließenden Posaune
  rationale: ἐσχάτῃ wird direkt als „letzten“ wiedergegeben. Die Formulierung bewahrt die eschatologische Aussage, ohne eine detaillierte Abfolge endzeitlicher Ereignisse in den Text einzutragen.
- issue: Den Bezug des ausdrücklich genannten „wir“ offenlassen
  choice: und wir werden verwandelt werden
  alternative: und die von uns, die dann noch leben, werden verwandelt werden
  rationale: Die knappe erste Person Plural des griechischen Textes bleibt erhalten. Eine ausdrückliche Gleichsetzung mit den dann Lebenden wäre eine kontextuelle Erklärung, die über den Wortlaut dieses Satzes hinausgeht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nu“ und „Wimpernschlag“ vermitteln die doppelte Betonung äußerster Schnelligkeit anschaulich; die wiederholten Passivformen bewahren die Struktur und theologische Offenheit des griechischen Textes.
