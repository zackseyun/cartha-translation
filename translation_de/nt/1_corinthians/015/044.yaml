review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die passivischen Präsensformen σπείρεται und ἐγείρεται, den parallelen Gegensatz ψυχικόν/πνευματικόν sowie die konditionale und additive Form des Schlusssatzes sachgerecht wieder. „Natürlicher Leib“ und „geistlicher Leib“ bewahren die Terminologie und vermeiden einen unzutreffenden Gegensatz von körperlich und unkörperlich.
  naturalness: Die erste Satzhälfte ist als knappe, bibelsprachlich-würdige Inversion gut verständlich. Im letzten Satz ist die Auslassung des Substantivs nach „einen geistlichen“ im modernen Standarddeutsch jedoch missverständlich und stilistisch holprig, da „Geistlichen“ leicht personenbezogen verstanden werden kann.
  terminology: „Leib“ ist im Auferstehungskontext eine angemessene, etablierte Wiedergabe von σῶμα. „Natürlich“ und „geistlich“ sind hier gegenüber möglichen Alternativen wie „seelisch“ bzw. „spirituell“ die angemessensten Haupttextbegriffe. Die Fußnote erläutert den gemeinten Gegensatz zurückhaltend und ohne eine körperlose Auferstehung zu insinuieren.
