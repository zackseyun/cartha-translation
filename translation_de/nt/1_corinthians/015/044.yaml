  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: de
  text: Gesät wird ein natürlicher Leib; auferweckt wird ein geistlicher Leib. Wenn es einen natürlichen Leib gibt[a], gibt es auch einen geistlichen Leib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seelischen Leib“ … „geistlichen Leib“. Paulus stellt nicht einen materiellen Leib einem immateriellen gegenüber, sondern einen von gewöhnlichem menschlichem Leben bestimmten Leib einem vom Geist bestimmten Leib.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: Gesät wird
  rationale: Bewahrt das Passiv und führt das Saatbild des unmittelbaren Zusammenhangs fort.
- source_word: σῶμα
  choice: Leib
  rationale: Im Auferstehungskontext bezeichnet σῶμα den verkörperten Menschen. „Leib“ ist hier würdevoll und vermeidet eher als „Körper“ eine rein physikalische Engführung.
- source_word: ψυχικόν
  choice: natürlich
  rationale: Gibt den Gegensatz zu πνευματικόν wieder, ohne einen Gegensatz von materiell und immateriell zu behaupten. Gemeint ist der von gewöhnlichem menschlichem Leben bestimmte Leib.
- source_word: ἐγείρεται
  choice: auferweckt wird
  rationale: Entspricht dem Passiv und der im Kontext eindeutigen Auferstehungssprache.
- source_word: πνευματικόν
  choice: geistlich
  rationale: Bewahrt die theologisch offene Wortwahl des Griechischen. Das Wort bezeichnet hier keinen körperlosen Leib, sondern einen vom Geist bestimmten Leib.
- source_word: Εἰ
  choice: Wenn
  rationale: Erhält die konditionale Form des griechischen Satzes, statt sie deutend als „weil“ oder „da“ wiederzugeben.
- source_word: καὶ
  choice: auch
  rationale: Gibt die additive Aussage schlicht und genau wieder.
theological_decisions:
- issue: Gegensatz zwischen natürlichem und geistlichem Leib
  choice: Der Haupttext spricht von einem „natürlichen Leib“ und einem „geistlichen Leib“ und bewahrt damit den Gegensatz zwischen dem von gewöhnlichem menschlichem Leben und dem vom Geist bestimmten Leib.
  alternative: Ein Gegensatz zwischen einem materiellen Körper und einer immateriellen Existenz; alternativ die wörtlichere, aber im Deutschen missverständliche Form „seelischer Leib“.
  rationale: Paulus stellt hier nicht Leiblichkeit und Leiblosigkeit einander gegenüber, denn beide Seiten heißen ausdrücklich σῶμα. Die Übersetzung wahrt diese Spannung und erläutert sie knapp in der Fußnote.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die parallele Satzform bildet den griechischen Kontrast nach; „Leib“ hält den Auferstehungszusammenhang präsent. Der Fußnotenmarker [a] steht im Haupttext.
