    issue: Auslassung von „Leib“ im zweiten Teil des Bedingungssatzes
    rationale: Obwohl das Griechische bei πνευματικόν das bereits genannte σῶμα auslässt, ist „gibt es auch einen geistlichen“ im Deutschen nicht idiomatisch genug und kann „einen Geistlichen“ nahelegen. Die Wiederholung von „Leib“ stellt den Bezug eindeutig her, ohne den Sinn zu verändern.
