id: 1CO.15.41
reference: 1 Corinthians 15:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: de
  text: Anders ist die Herrlichkeit der Sonne[a], anders die Herrlichkeit des Mondes und anders die Herrlichkeit der Sterne; denn ein Stern unterscheidet sich vom anderen an Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Glanz“ beziehungsweise „Leuchtkraft“; entsprechend im ganzen Vers. Das griechische Wort δόξα kann hier die sichtbare Strahlkraft bezeichnen, während „Herrlichkeit“ Paulus’ wiederholte Wortwahl im Zusammenhang bewahrt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: anders ist … anders … anders
  rationale: Die dreifache Wiederholung wird in natürlichem Deutsch bewahrt und hebt die Verschiedenheit der jeweiligen Herrlichkeit hervor.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: Das Wort bezeichnet hier den sichtbaren Glanz der Himmelskörper, während „Herrlichkeit“ zugleich die Wortverbindung zu Paulus’ Argument über den Auferstehungsleib erhält.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: der Sonne / des Mondes / der Sterne
  rationale: Die Genitive werden direkt und parallel von „Herrlichkeit“ abhängig wiedergegeben.
- source_word: ἀστὴρ … ἀστέρος
  choice: ein Stern … vom anderen
  rationale: Die Gegenüberstellung einzelner Sterne bleibt erhalten; die deutsche Formulierung ist idiomatisch und macht die Unterschiede innerhalb derselben Gruppe deutlich.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ gibt die begründende beziehungsweise erläuternde Funktion der Partikel knapp und natürlich wieder.
- source_word: διαφέρει
  choice: unterscheidet sich
  rationale: Die Wiedergabe bezeichnet einen Unterschied, ohne die nicht zwingend enthaltene Vorstellung einer Rang- oder Wertüberlegenheit einzutragen.
- source_word: ἐν δόξῃ
  choice: an Herrlichkeit
  rationale: Die idiomatische deutsche Fügung bezeichnet den Gesichtspunkt des Unterschieds und wiederholt bewusst den Schlüsselbegriff „Herrlichkeit“.
theological_decisions:
- issue: Wiedergabe von δόξα im kosmologischen Vergleich innerhalb der Auferstehungsargumentation
  choice: Herrlichkeit
  alternative: Glanz oder Leuchtkraft
  rationale: Im unmittelbaren Bild geht es um sichtbaren Glanz, doch „Herrlichkeit“ bewahrt die rhetorische und theologische Verbindung zur Herrlichkeit der Auferstehungsleiber, ohne die Bildsprache darauf zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die Wiederholung von „Herrlichkeit“ spiegeln die Rhetorik des griechischen Textes; „an Herrlichkeit“ ist bewusst idiomatisch gewählt.
