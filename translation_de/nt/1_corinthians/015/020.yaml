id: 1CO.15.20
reference: 1 Corinthians 15:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: de
  text: 'Nun aber ist der Messias[a] von den Toten auferweckt worden: die Erstlingsgabe[b] derer, die entschlafen sind.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Das griechische Wort bedeutet „der Gesalbte“ und entspricht dem Titel „Messias“.'
    reason: alternative_reading
  - marker: b
    text: Die Erstlingsgabe war der erste Anteil einer Ernte, der Gott dargebracht wurde. Sie stand für den Beginn der ganzen noch folgenden Ernte.
    reason: cultural_note
  - marker: c
    text: „Entschlafen“ ist hier ein Bild für das Sterben beziehungsweise den Zustand der Toten, besonders im Blick auf die Auferstehung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Nun aber
  rationale: Kennzeichnet den entschiedenen Gegensatz zur zuvor erörterten Leugnung der Auferstehung und wendet sich zur gegenwärtig geltenden Wirklichkeit.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Gibt den griechischen Titel in seiner Bedeutung wieder; der bestimmte Artikel ist im Deutschen für diese Titelform idiomatisch.
- source_word: ἐγήγερται
  choice: ist … auferweckt worden
  rationale: Das Perfekt Passiv bezeichnet ein vollendetes Geschehen mit fortdauernder Wirkung. Die passive Form bleibt erhalten, ohne den Handelnden ausdrücklich zu benennen.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Natürliche deutsche Wiedergabe der üblichen griechischen Auferstehungsformel; der Plural bezeichnet die Verstorbenen.
- source_word: ἀπαρχὴ
  choice: die Erstlingsgabe
  rationale: Bewahrt das Bild vom ersten Gott dargebrachten Ernteanteil, der den Anfang der kommenden Gesamternte darstellt.
- source_word: τῶν κεκοιμημένων
  choice: derer, die entschlafen sind
  rationale: Erhält das im Auferstehungszusammenhang gebrauchte Schlafbild für den Tod und gibt zugleich den resultativen Aspekt des griechischen Perfektpartizips wieder.
theological_decisions:
- issue: Stimme und Handelnder bei der Auferstehung
  choice: ist auferweckt worden
  alternative: ist auferstanden
  rationale: Die passive Form des Griechischen wird bewahrt; Gottes Handeln bleibt angedeutet, ohne den im Satz nicht genannten Handelnden einzufügen.
- issue: Wiedergabe des christologischen Titels
  choice: der Messias
  alternative: Christus
  rationale: Χριστός wird hier als bedeutungsvoller Titel wiedergegeben. Die geläufige kirchliche Form „Christus“ bleibt als Übersetzungsalternative in der Fußnote sichtbar.
- issue: Bedeutung von ἀπαρχή
  choice: Erstlingsgabe
  alternative: Erstling
  rationale: „Erstlingsgabe“ hält das Ernte- und Opferbild deutlicher fest, ohne die im Kontext liegende Folgerung einer künftigen Gesamternte ausdrücklich in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die knappe griechische Apposition verständlich, ohne ein zusätzliches Verhältnis wie „als“ festzulegen. Das traditionelle, aber noch verständliche „entschlafen“ bewahrt die Metapher; die Fußnote erläutert sie.
