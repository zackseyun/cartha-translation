review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die starke adversative Wendung Νυνὶ δέ mit „Nun aber“ treffend wieder. „ist … auferweckt worden“ bewahrt das Perfektpassiv ἐγήγερται und dessen gegenwärtige Relevanz, ohne einen Handelnden hinzuzufügen. „von den Toten“ ist die idiomatische deutsche Entsprechung von ἐκ νεκρῶν. Die appositionelle Aussage ἀπαρχὴ τῶν κεκοιμημένων wird mit „die Erstlingsgabe derer, die entschlafen sind“ vollständig und ohne unzulässige Ausdeutung wiedergegeben.
  naturalness: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt stellt die knappe Apposition gut verständlich dar; „derer, die entschlafen sind“ ist in diesem auferstehungstheologischen Register natürlich und angemessen.
  terminology: „der Messias“ entspricht der hier titulären Verwendung von Χριστός und ist durch die Alternative „Christus“ transparent erläutert. „Erstlingsgabe“ erhält den kultisch-erntlichen Bildbereich von ἀπαρχή. Die Fußnoten sind sachlich, nicht konfessionell festlegend und ihre Anker stehen jeweils bei den erläuterten Ausdrücken.
