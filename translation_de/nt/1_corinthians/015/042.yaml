  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: de
  text: 'So ist es auch mit der Auferstehung der Toten: Gesät wird in Vergänglichkeit, auferweckt wird in Unvergänglichkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: So ist es auch mit
  rationale: Gibt die vergleichend-folgernde Verbindung zum vorausgehenden Gleichnis vom Samenkorn in natürlichem modernem Deutsch wieder.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: der Auferstehung der Toten
  rationale: Entspricht der griechischen Genitivverbindung und bezeichnet präzise die Auferstehung der Gestorbenen.
- source_word: σπείρεται
  choice: Gesät wird
  rationale: Bewahrt das Präsens Passiv und das Bild vom Säen; zugleich bleibt das grammatisch nicht ausdrücklich genannte Subjekt offen.
- source_word: ἐν φθορᾷ
  choice: in Vergänglichkeit
  rationale: Bezeichnet hier den dem Verfall und Tod unterworfenen Zustand. Das Wort bildet im Deutschen einen klaren Gegensatz zu »Unvergänglichkeit«.
- source_word: ἐγείρεται
  choice: auferweckt wird
  rationale: Bewahrt das Passiv und gibt im Auferstehungskontext die Handlung an dem Gestorbenen treffend wieder.
- source_word: ἐν ἀφθαρσίᾳ
  choice: in Unvergänglichkeit
  rationale: Gibt den unvergänglichen Zustand wieder und erhält die sprachliche Antithese zu φθορά.
theological_decisions:
- issue: Wesen und Kontinuität des Auferstehungsleibes
  choice: Das Bild von Säen und Auferwecken sowie beide Passivformen bleiben erhalten, ohne das unausgesprochene Subjekt ausdrücklich als »Leib« zu ergänzen.
  alternative: 'Dynamisch auslegen: »Der Leib wird vergänglich begraben und unvergänglich auferweckt.«'
  rationale: Der Zusammenhang handelt von leiblicher Auferstehung, doch der griechische Vers nennt den Leib hier nicht ausdrücklich. Die Fassung bewahrt daher sowohl den Kontext als auch die knappe, bildhafte Offenheit des Wortlauts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur »Gesät wird …, auferweckt wird …« wahrt den rhetorischen Gegensatz und vermeidet das missverständliche unpersönliche Pronomen »es«.
