  yaml_path: translation/nt/1_corinthians/015/033.yaml
  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: de
  text: 'Lasst euch nicht täuschen: Schlechter Umgang verdirbt gute Sitten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schlechte Gespräche verderben gute Sitten.“ Das griechische Wort kann sowohl den Umgang miteinander als auch Gespräche bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Lasst euch nicht täuschen
  rationale: Die Form kann passiv oder medial verstanden werden. Die Wiedergabe bewahrt diese Offenheit weitgehend und formuliert die Warnung im modernen Deutschen natürlich, ohne ausdrücklich Selbsttäuschung oder fremde Verführung festzulegen.
- source_word: φθείρουσιν
  choice: verdirbt
  rationale: Das Verb bezeichnet hier eine schädigende, sittliche Verschlechterung. „Verderben“ passt zum sprichwortartigen Satz und ist weniger absolut als „zerstören“.
- source_word: ἤθη
  choice: Sitten
  rationale: Das Substantiv bezeichnet eingeprägte Verhaltensweisen beziehungsweise den sittlichen Charakter. „Gute Sitten“ erhält den ethischen Sinn und die knappe, sprichwortartige Form; gemeint ist nicht bloß gesellschaftliche Etikette.
- source_word: χρηστὰ
  choice: gute
  rationale: Das Adjektiv qualifiziert ἤθη positiv und ethisch. „Gut“ ist die schlichte und treffende deutsche Entsprechung.
- source_word: ὁμιλίαι
  choice: Umgang
  rationale: Das Wort kann gemeinschaftlichen Umgang, Verbindung oder auch Gespräch bezeichnen. Im Zusammenhang warnt Paulus vor schädlichem Kontakt beziehungsweise Einfluss; „Umgang“ gibt diesen weiteren Beziehungssinn im Deutschen idiomatisch wieder, während die engere Möglichkeit „Gespräche“ in der Fußnote erhalten bleibt.
- source_word: κακαί
  choice: schlechter
  rationale: Das Adjektiv kennzeichnet den Umgang als moralisch oder praktisch schädlich. „Schlecht“ ist im Deutschen natürlich und vermeidet die stärkere Festlegung auf „böse“.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, sprichwortartigem Klang. Der geläufige Ausdruck „schlechter Umgang“ erfasst den Zusammenhang, ohne die mögliche Gesprächsbedeutung des griechischen Wortes zu verschweigen.
