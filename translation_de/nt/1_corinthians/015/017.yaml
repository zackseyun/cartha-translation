source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: de
  text: Wenn aber der Messias nicht auferweckt worden ist[a], ist euer Glaube vergeblich[b]; ihr seid noch in euren Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus ist nicht auferstanden.“'
    reason: Alternative Wiedergabe von Χριστός und ἐγήγερται.
  - marker: b
    text: 'Oder: „nutzlos“ beziehungsweise „leer“.'
    reason: Lexikalische Bedeutungsbreite von ματαία.
lexical_decisions:
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός wird hier als Titel des Gesalbten verstanden. „Der Messias“ gibt diesen titularen Sinn im modernen Deutschen verständlich wieder; „Christus“ wäre die traditionelle Alternative.
- source_word: ἐγήγερται
  choice: auferweckt worden ist
  rationale: Das griechische Perfekt wird passiv und mit fortwirkender Bedeutung wiedergegeben. Die Formulierung bewahrt die im Text nicht ausdrücklich genannte göttliche Urheberschaft, ohne den Handelnden hinzuzufügen.
- source_word: ματαία
  choice: vergeblich
  rationale: „Vergeblich“ bezeichnet hier einen Glauben, der sein Ziel nicht erreicht und ohne tragfähige Grundlage wäre. Es ist würdig, geläufig und kontextgemäß.
- source_word: πίστις
  choice: Glaube
  rationale: Gemeint ist hier der glaubende Bezug der Korinther auf die Auferstehungsbotschaft, nicht vorrangig ihre Treue.
- source_word: ἔτι
  choice: noch
  rationale: „Noch“ drückt den fortbestehenden Zustand aus, der nach Paulus gelten würde, wenn der Messias nicht auferweckt worden wäre.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: in euren Sünden
  rationale: Die räumlich formulierte griechische Wendung wird bewahrt. Sie bezeichnet das fortdauernde Verhaftetsein in den Sünden, ohne die Aussage durch eine engere dogmatische Umschreibung festzulegen.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel setzt diese Folgerung in einen klaren Gegensatz zum vorausgehenden Gedankengang.
theological_decisions:
- issue: Auferstehungsformulierung und Urheberschaft
  choice: nicht auferweckt worden ist
  alternative: nicht auferstanden ist
  rationale: Die passive Wiedergabe entspricht der Form und dem paulinischen Sprachgebrauch, ohne Gott als Handelnden ausdrücklich in den Text einzusetzen. Die alternative deutsche Formulierung kann reflexiv beziehungsweise intransitiv verstanden werden und wird deshalb in einer Fußnote genannt.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: An dieser Stelle trägt Χριστός den Sinn eines Titels. „Der Messias“ macht diesen Gehalt transparent, während „Christus“ als traditionelle Wiedergabe in der Fußnote erhalten bleibt.
- issue: Bedeutung von ματαία
  choice: vergeblich
  alternative: nutzlos
  rationale: „Vergeblich“ wahrt sowohl die Wirkungslosigkeit als auch die fehlende tragfähige Grundlage des Glaubens unter der genannten Voraussetzung; „nutzlos“ wäre enger und sachlicher.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nah am griechischen Konditionalsatz; traditionelle, aber weiterhin klare Wendungen wie „in euren Sünden“ werden beibehalten.
