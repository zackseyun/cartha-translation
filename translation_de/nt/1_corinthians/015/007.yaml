  text: ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: de
  text: Danach erschien er Jakobus[a], dann allen Aposteln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wurde er von Jakobus gesehen … von allen Aposteln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Danach
  rationale: Das temporale Adverb leitet das nächste Ereignis in der Abfolge der Auferstehungserscheinungen ein. „Danach“ gibt die zeitliche Folge natürlich wieder.
- source_word: ὤφθη
  choice: erschien er
  rationale: Der Aorist Passiv von ὁράω wird hier idiomatisch für eine Erscheinung gebraucht. „Er erschien“ ist im Deutschen natürlich und entspricht dem Sprachgebrauch für Auferstehungserscheinungen; die wörtlichere Passivform wird in der Fußnote bewahrt.
- source_word: Ἰακώβῳ
  choice: Jakobus
  rationale: Der Dativ bezeichnet die Person, der Christus erschien. „Jakobus“ ist die übliche deutsche Namensform im Neuen Testament.
- source_word: εἶτα
  choice: dann
  rationale: Das zweite temporale Adverb setzt die schrittweise Aufzählung fort. „Dann“ wahrt die Abfolge ohne unnötige stilistische Variation.
- source_word: ἀποστόλοις
  choice: Aposteln
  rationale: In diesem Zusammenhang bezeichnet das Wort anerkannte apostolische Zeugen und nicht allgemein Boten oder Gesandte. Die etablierte Bezeichnung „Apostel“ bewahrt diesen Sinn.
- source_word: πᾶσιν
  choice: allen
  rationale: Das Wort betont die Gesamtheit der genannten Apostel. „Allen Aposteln“ ist direkt und idiomatisch.
theological_decisions:
- issue: Identität und Umfang von „allen Aposteln“ im Verhältnis zu Jakobus
  choice: Die Wendung wird ohne nähere Eingrenzung als „allen Aposteln“ wiedergegeben.
  alternative: Gemeint sein könnten speziell die Zwölf oder eine größere Gruppe beauftragter Zeugen, die von den Zwölf unterschieden ist.
  rationale: Der griechische Text bestimmt die genaue Zusammensetzung dieser Gruppe nicht. Die Übersetzung bewahrt daher die offene Formulierung und den von Paulus dargestellten Unterschied zwischen der Erscheinung vor Jakobus und der anschließenden Erscheinung vor allen Aposteln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, aufzählende Struktur des griechischen Textes bleibt erhalten; „erschien“ bietet eine natürliche deutsche Wiedergabe des idiomatischen Passivs.
