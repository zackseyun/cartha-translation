id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: de
  text: Dann kommt das Ende[a], wenn er das Reich Gott, dem Vater, übergibt[b], wenn er jede Herrschaft und jede Gewalt und Macht unwirksam macht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Vollendung“ oder „das Ziel“. Das griechische Wort τέλος kann Ende, Ziel oder Vollendung bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wenn er das Reich Gott und Vater übergibt“. Die griechische Wendung kann im Deutschen als „Gott, dem Vater“ verstanden werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „beseitigt“, „abschafft“ oder „zunichtemacht“. Gemeint ist, dass jede Herrschaft, Gewalt und Macht ihre Wirksamkeit verliert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Dann
  rationale: Kennzeichnet knapp und natürlich die nächste Stufe in der von Paulus beschriebenen Abfolge.
- source_word: τὸ τέλος
  choice: das Ende
  rationale: Bewahrt den naheliegenden zeitlich-eschatologischen Sinn, ohne die ebenfalls mögliche Bedeutung Ziel oder Vollendung auszuschließen.
- source_word: ὅταν παραδιδῷ
  choice: wenn er … übergibt
  rationale: Gibt das zukünftige Geschehen und die Übertragung königlicher Herrschaft idiomatisch wieder.
- source_word: τὴν βασιλείαν
  choice: das Reich
  rationale: Ist die geläufigste deutsche Wiedergabe und lässt zugleich den dynamischen Sinn von Königsherrschaft mitschwingen.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Gott, dem Vater
  rationale: Versteht die Wendung appositionell, wahrt jedoch durch die Kommas die erkennbare Struktur des Griechischen.
- source_word: ὅταν καταργήσῃ
  choice: wenn er … unwirksam macht
  rationale: καταργέω bezeichnet hier die Aufhebung der Wirksamkeit beziehungsweise Geltung; die Übersetzung vermeidet die engere Behauptung einer Vernichtung.
- source_word: πᾶσαν ἀρχὴν
  choice: jede Herrschaft
  rationale: Gibt ἀρχή innerhalb der Reihung als herrschende Gewalt beziehungsweise Herrschaftsgröße wieder und bewahrt die mögliche abstrakte oder personale Dimension.
- source_word: πᾶσαν ἐξουσίαν
  choice: jede Gewalt
  rationale: Bezeichnet ausgeübte oder verliehene Autorität und passt als geläufiger Ausdruck in die Dreierreihe.
- source_word: δύναμιν
  choice: Macht
  rationale: Ist die natürliche breite Entsprechung für δύναμις und erhält die feierliche Reihung.
theological_decisions:
- issue: Verhältnis von θεῷ und πατρί
  choice: 'Appositionell: „Gott, dem Vater“'
  alternative: 'Koordiniert beziehungsweise formnäher: „Gott und Vater“'
  rationale: Der Kontext bezeichnet den Vater als Empfänger des Reiches. Die appositionelle Wiedergabe ist im Deutschen klar, ohne über die Aussage des Verses hinaus christologische Folgerungen einzutragen.
- issue: Bedeutung von καταργήσῃ für die genannten Mächte
  choice: „unwirksam macht“ als Aufhebung ihrer Wirksamkeit und Geltung
  alternative: „beseitigt“, „abschafft“ oder „zunichtemacht“
  rationale: Die Formulierung bewahrt die starke Aussage vom Ende ihrer Wirksamkeit, legt sich aber nicht unnötig auf metaphysische Vernichtung fest.
- issue: Referent von ἀρχή
  choice: „Herrschaft“ mit offener abstrakter oder personaler Dimension
  alternative: „Herrscher“ oder „Herrschaftsgewalt“
  rationale: Die griechische Dreierreihe kann Machtbereiche oder personifizierte Mächte bezeichnen. „Herrschaft“ lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der eschatologischen Abfolge des griechischen Textes. „Herrschaft, Gewalt und Macht“ erhält den feierlichen Dreiklang und lässt offen, ob abstrakte Machtbereiche oder personale Mächte im Blick sind.
