review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die zeitliche Abfolge von εἶτα sowie die beiden ὅταν-Sätze präzise wieder. „das Ende“ ist für τὸ τέλος die naheliegende, nicht überdeutende Wiedergabe. „das Reich Gott, dem Vater, übergibt“ gibt die appositionelle Lesart von τῷ θεῷ καὶ πατρί idiomatisch wieder. „jede Herrschaft und jede Gewalt und Macht“ bewahrt die offene, möglicherweise sowohl abstrakte als auch personale Referenz der griechischen Dreierreihe. „unwirksam macht“ ist eine treffende Wiedergabe von καταργήσῃ, die nicht unbegründet Vernichtung behauptet.
  naturalness: Modernes, verständliches und zugleich dem Kontext angemessen würdiges Standarddeutsch. Die Wiederholung von „wenn“ bildet die griechische Struktur klar nach, ohne im Deutschen schwerfällig zu wirken. Die Reihung „Herrschaft, Gewalt und Macht“ ist geläufig und stilistisch passend.
  terminology: „Reich“, „Gott, dem Vater“ und „Herrschaft, Gewalt und Macht“ sind terminologisch konsistent und theologisch nicht einengend. Die Fußnoten bieten sinnvolle lexikalische Alternativen; insbesondere bewahren sie bei τέλος und καταργέω die vorhandene Bedeutungsbreite.
