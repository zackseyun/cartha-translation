id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: de
  text: Denn wie in Adam alle sterben, so werden auch im Messias alle lebendig gemacht werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Christus«. Der griechische Titel Χριστός kann mit »Messias« übersetzt oder traditionell als »Christus« wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: Bewahrt sowohl die begründende beziehungsweise anknüpfende Funktion von γάρ als auch den Vergleich von ὥσπερ in natürlichem Deutsch.
- source_word: ἐν τῷ Ἀδὰμ
  choice: in Adam
  rationale: Gibt die knappe repräsentative beziehungsweise korporative Formulierung wieder, ohne ἐν vorschnell instrumental oder als ausdrückliche Vereinigung auszulegen.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt den uneingeschränkten Wortlaut und die genaue Parallelität beider Vorkommen.
- source_word: ἀποθνῄσκουσιν
  choice: sterben
  rationale: Das Präsens bezeichnet hier eine allgemeine Wirklichkeit; das deutsche Präsens gibt diesen gnomischen Sinn natürlich wieder.
- source_word: οὕτως καὶ
  choice: so ... auch
  rationale: Entspricht der korrelativen Struktur und bewahrt die hinzufügende Kraft von καί in idiomatischem Deutsch.
- source_word: ἐν τῷ Χριστῷ
  choice: im Messias
  rationale: Χριστός fungiert hier als Titel. »Messias« gibt dessen Bedeutung wieder und erhält zugleich die Parallele zu »in Adam«.
- source_word: ζῳοποιηθήσονται
  choice: werden lebendig gemacht werden
  rationale: Bewahrt Futur und Passiv sowie die Aussage, dass das Lebendigmachen an den Betroffenen vollzogen wird.
theological_decisions:
- issue: Reichweite von »alle« in beiden Satzhälften
  choice: »alle« bleibt an beiden Stellen uneingeschränkt stehen.
  alternative: Das zweite »alle« ausdrücklich auf alle Glaubenden begrenzen oder beide Vorkommen ausdrücklich als die gesamte Menschheit in genau demselben Sinn erklären.
  rationale: Der griechische Text setzt πάντες ... πάντες bewusst parallel, erläutert in diesem Vers aber weder Mechanismus noch genaue Reichweite. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Bedeutung von ἐν in »in Adam« und »im Messias«
  choice: Die Präposition wird mit »in« wiedergegeben.
  alternative: »durch Adam/den Messias« oder »in Gemeinschaft mit Adam/dem Messias«.
  rationale: Die wörtlich nahe Wiedergabe vermeidet es, die kompakte korporative beziehungsweise repräsentative Beziehung auf Instrumentalität oder eine ausdrücklich formulierte Vereinigung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur hält den paulinischen Vergleich knapp und parallel; »lebendig gemacht werden« bewahrt trotz der im Deutschen etwas markierten Doppelung von »werden« präzise Futur und Passiv.
