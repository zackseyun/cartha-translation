id: 1CO.15.49
reference: 1 Corinthians 15:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: de
  text: Und wie wir das Bild des aus Staub gemachten Menschen getragen haben, so werden wir auch das Bild des himmlischen Menschen tragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „So lasst uns auch das Bild des himmlischen Menschen tragen.“'
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: wie … so
  rationale: Die deutsche Vergleichskonstruktion „wie … so“ gibt die Entsprechung zwischen der gegenwärtigen, von Adam geprägten Existenz und der künftigen himmlischen Gestalt natürlich und deutlich wieder.
- source_word: ἐφορέσαμεν
  choice: getragen haben
  rationale: Das Perfekt verbindet die bisherige Erfahrung mit dem gegenwärtigen Zustand und gibt φορέω in Verbindung mit „Bild“ idiomatisch wieder.
- source_word: εἰκόνα
  choice: Bild
  rationale: „Bild“ ist die übliche und kontextgemäße Wiedergabe von εἰκών und bewahrt den typologischen Gegensatz, ohne ihn auszudeuten.
- source_word: τοῦ χοϊκοῦ
  choice: des aus Staub gemachten Menschen
  rationale: Die Formulierung bewahrt den deutlichen Anklang an die Erschaffung Adams aus Staub und macht den im Kontext vorausgesetzten menschlichen Bezug explizit.
- source_word: φορέσομεν
  choice: werden wir … tragen
  rationale: Der im SBLGNT gedruckte Futur-Indikativ bezeichnet die zukünftige Angleichung bei der Auferstehung; die wichtige Variante wird in der Fußnote erhalten.
- source_word: τοῦ ἐπουρανίου
  choice: des himmlischen Menschen
  rationale: „Himmlisch“ entspricht ἐπουράνιος; die Ergänzung „Menschen“ wahrt die Parallelität zum unmittelbar zuvor genannten Menschen aus Staub.
- source_word: καὶ
  choice: auch
  rationale: Das zweite καί hat additive Kraft und wird im Deutschen natürlich mit „auch“ wiedergegeben.
theological_decisions:
- issue: Futur-Indikativ oder hortatorischer Konjunktiv beim zweiten Verb
  choice: so werden wir auch … tragen
  alternative: so lasst uns auch … tragen
  rationale: Der SBLGNT-Haupttext liest φορέσομεν als Futur-Indikativ und formuliert damit eine zukünftige Aussage. Die textkritisch bedeutsame auffordernde Lesart wird nicht stillschweigend verworfen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Formulierung „wie … so“ erhält den rhetorischen Parallelismus; „aus Staub gemacht“ bewahrt den Genesis-Anklang verständlicher als das ungewöhnliche „staubartig“.
