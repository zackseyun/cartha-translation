  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: de
  text: Denn dieser vergängliche Körper muss Unvergänglichkeit anziehen[a], und dieser sterbliche Körper muss Unsterblichkeit anziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: „Denn dieses Vergängliche muss Unvergänglichkeit anziehen, und dieses Sterbliche muss Unsterblichkeit anziehen.“ Im Griechischen steht in diesem Vers nicht ausdrücklich „Körper“; aus dem Zusammenhang ist jedoch klar, dass der Körper gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: muss
  rationale: Gibt die von Paulus bezeichnete Notwendigkeit beziehungsweise Unausweichlichkeit klar und natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorhergehenden Vers.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: dieser vergängliche Körper
  rationale: Das substantivierte Neutrum bezeichnet im Zusammenhang den der Vergänglichkeit unterworfenen Körper. „Körper“ wird zur natürlichen Verständlichkeit aus dem Kontext ergänzt.
- source_word: ἐνδύσασθαι
  choice: anziehen
  rationale: Erhält das griechische Bild des Ankleidens in einer knappen, geläufigen deutschen Form.
- source_word: ἀφθαρσίαν
  choice: Unvergänglichkeit
  rationale: Bewahrt den unmittelbaren Gegensatz zu „vergänglich“ und ist im modernen theologischen Deutsch verständlich.
- source_word: καὶ
  choice: und
  rationale: Verbindet die beiden parallelen Aussagen schlicht und genau.
- source_word: τὸ θνητὸν τοῦτο
  choice: dieser sterbliche Körper
  rationale: Bezeichnet den dem Tod unterworfenen Körper; die kontextuelle Ergänzung „Körper“ schafft Klarheit und hält den Parallelismus aufrecht.
- source_word: ἀθανασίαν
  choice: Unsterblichkeit
  rationale: Ist die übliche und präzise Wiedergabe für den Zustand, nicht mehr dem Tod unterworfen zu sein.
theological_decisions:
- issue: Ergänzung von „Körper“, obwohl σώμα in diesem Vers nicht ausdrücklich steht
  choice: „dieser vergängliche Körper“ und „dieser sterbliche Körper“
  alternative: „dieses Vergängliche … dieses Sterbliche“
  rationale: Der unmittelbare Zusammenhang handelt ausdrücklich von der Auferstehung und Verwandlung des Körpers. Die Ergänzung verdeutlicht den Bezug, ohne eine zusätzliche Lehrbehauptung einzuführen; die formalere Wiedergabe wird in der Fußnote offengelegt.
- issue: Bildsprache von ἐνδύσασθαι
  choice: „Unvergänglichkeit/Unsterblichkeit anziehen“
  alternative: „mit Unvergänglichkeit/Unsterblichkeit bekleidet werden“
  rationale: Die aktive Infinitivform und das Kleidungsbild bleiben erhalten, ohne festzulegen, wie menschliches und göttliches Handeln bei der Verwandlung zueinander stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarweisen Gegensätze „vergänglich/Unvergänglichkeit“ und „sterblich/Unsterblichkeit“ sowie das Bild des Anziehens werden bewahrt. „Körper“ wird zur Verständlichkeit aus dem unmittelbaren Kontext ergänzt und durch eine Fußnote transparent gemacht.
