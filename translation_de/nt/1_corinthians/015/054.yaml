id: 1CO.15.54
reference: 1 Corinthians 15:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: de
  text: 'Wenn aber dieses Vergängliche Unvergänglichkeit anzieht und dieses Sterbliche Unsterblichkeit anzieht, dann wird das geschriebene Wort Wirklichkeit werden[a]: »Der Tod ist im Sieg verschlungen worden.«[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dann wird das geschriebene Wort geschehen“; sinngemäß auch: „dann wird das geschriebene Wort erfüllt werden“.'
    reason: alternative_reading
  - marker: b
    text: Zitat aus Jesaja 25,8 in einer Form, die der von Paulus angeführten griechischen Überlieferung entspricht.
    reason: cross_reference
  - marker: c
    text: Für „im Sieg“ ist auch die Wiedergabe „zum Sieg“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθαρτὸν
  choice: das Vergängliche
  rationale: Das substantivierte Adjektiv bezeichnet das, was dem Verfall unterliegt, im Zusammenhang den gegenwärtigen Leib. „Das Vergängliche“ ist prägnant und bildet einen klaren Gegensatz zu „Unvergänglichkeit“.
- source_word: ἐνδύσηται
  choice: anzieht
  rationale: Die Wiedergabe bewahrt das Bild des Ankleidens und lässt wie der griechische Medium-Aorist offen, wie genau die Verwandlung vollzogen wird.
- source_word: ἀφθαρσίαν
  choice: Unvergänglichkeit
  rationale: Der Ausdruck gibt den Gegensatz zu φθαρτόν unmittelbar wieder und ist im modernen Deutsch verständlicher als „Unverweslichkeit“.
- source_word: θνητὸν
  choice: das Sterbliche
  rationale: Das substantivierte Adjektiv bezeichnet das dem Tod unterworfene Dasein beziehungsweise den sterblichen Leib und entspricht formal wie idiomatisch dem Griechischen.
- source_word: ἀθανασίαν
  choice: Unsterblichkeit
  rationale: Dies ist die direkte und geläufige Entsprechung für den Zustand, dem Tod nicht mehr unterworfen zu sein.
- source_word: γενήσεται
  choice: wird Wirklichkeit werden
  rationale: Die Formulierung gibt in natürlichem Deutsch wieder, dass das geschriebene Wort eintreten wird, ohne ausdrücklich die stärkere Erfüllungsterminologie einzuführen.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: das geschriebene Wort
  rationale: Die Formulierung bewahrt λόγος als „Wort“ und bezeichnet natürlich die nachfolgend zitierte schriftliche Aussage.
- source_word: Κατεπόθη
  choice: ist … verschlungen worden
  rationale: Das Perfekt Passiv ist im Deutschen innerhalb der zukunftsbezogenen Aussage idiomatisch und stellt den dann vollendeten Sieg über den Tod dar, ohne einen Handelnden zu nennen.
- source_word: εἰς νῖκος
  choice: im Sieg
  rationale: Die knappe Formulierung wahrt die ungewöhnliche Bildsprache der griechischen Wendung und vermeidet es, den Sieg grammatisch zum ausdrücklich genannten Handelnden zu machen.
theological_decisions:
- issue: Verhältnis von γενήσεται zum Schriftzitat
  choice: „wird Wirklichkeit werden“
  alternative: „wird erfüllt werden“ oder wörtlicher „wird geschehen“
  rationale: γίνομαι bezeichnet hier das Eintreten der zitierten Aussage. Die gewählte Fassung ist verständlich, wahrt aber den Abstand zu einer im Verb selbst nicht ausdrücklich enthaltenen Erfüllungsformel.
- issue: Zeitform des Zitats Κατεπόθη ὁ θάνατος
  choice: „Der Tod ist … verschlungen worden“
  alternative: „Der Tod wurde … verschlungen“ oder „Der Tod wird … verschlungen“
  rationale: Paulus spricht von einem künftigen Zeitpunkt, an dem die zitierte Aussage als vollendete Wirklichkeit gilt. Das deutsche Perfekt bringt diese Perspektive zum Ausdruck, ohne den griechischen Aorist in ein ausdrückliches Futur umzudeuten.
- issue: Bedeutung von εἰς νῖκος
  choice: „im Sieg“
  alternative: „zum Sieg“ oder idiomatischer „vom Sieg“
  rationale: „Vom Sieg“ würde den Sieg als Handelnden des Passivs markieren, obwohl der griechische Ausdruck mit εἰς diese Agensbeziehung nicht ausdrücklich formuliert. „Im Sieg“ erhält die Spannung und Bildhaftigkeit der Wendung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das Kleidungsbild des griechischen Textes bleiben erhalten. Die ungewöhnliche Wendung „im Sieg“ wurde bewusst nicht zu einer ausdrücklichen Agensangabe („vom Sieg“) geglättet.
