  naturalness: Der Text ist modernes, würdiges Standarddeutsch. Die Wiederholung von „anzieht“ entspricht dem griechischen Parallelismus und ist stilistisch tragfähig. „Das geschriebene Wort wird Wirklichkeit werden“ ist verständlich und natürlich genug für den gehobenen biblischen Registerbereich.
