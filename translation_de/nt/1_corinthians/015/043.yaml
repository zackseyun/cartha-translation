base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: de
  text: Es wird in Unehre gesät, es wird in Herrlichkeit auferweckt; es wird in Schwäche gesät, es wird in Kraft auferweckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: es wird gesät
  rationale: Das Passiv Präsens wird bewahrt; „säen“ erhält das im Zusammenhang entfaltete Bild von Saat und Leib.
- source_word: ἀτιμίᾳ
  choice: Unehre
  rationale: „Unehre“ bildet den direkten Gegensatz zu „Herrlichkeit“ und vermeidet eine Verengung auf ein subjektives Schamgefühl.
- source_word: ἐγείρεται
  choice: es wird auferweckt
  rationale: Im Auferstehungszusammenhang gibt „auferweckt“ die Bedeutung präzise wieder. Das Passiv lässt den im Griechischen nicht ausdrücklich genannten göttlichen Urheber unausgesprochen.
- source_word: δόξῃ
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die sachlich und theologisch angemessene Wiedergabe und wahrt den Gegensatz zu „Unehre“.
- source_word: ἀσθενείᾳ
  choice: Schwachheit
  rationale: Die direkte Wiedergabe umfasst im Kontext die Hinfälligkeit des sterblichen Leibes, ohne den Begriff darauf zu beschränken.
- source_word: δυνάμει
  choice: Kraft
  rationale: „Kraft“ ist im Deutschen der natürliche Gegenbegriff zu „Schwachheit“ und kann die wirksame Lebenskraft des Auferstehungsleibes ausdrücken.
theological_decisions:
- issue: Handelnder bei der Auferweckung
  choice: Die Passivform „es wird auferweckt“ bleibt erhalten.
  alternative: „Gott weckt es auf“
  rationale: Der griechische Text nennt den Handelnden nicht ausdrücklich. Das Passiv wahrt diese Form und lässt die göttliche Urheberschaft implizit.
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das deutsche Pronomen „es“ nimmt den im unmittelbaren Zusammenhang genannten Leib auf.
  alternative: „Der Leib wird gesät … der Leib wird auferweckt“
  rationale: „Es“ entspricht dem aus dem Kontext ergänzten singularischen Subjekt und vermeidet eine im Vers selbst nicht vorhandene ausdrückliche Wiederholung von „der Leib“.
translation_notes:
  register: Moderne, würdige Standardsprache mit strengem Parallelismus. Die vier Passivformen und die beiden Gegensatzpaare Unehre/Herrlichkeit sowie Schwachheit/Kraft bleiben deutlich erkennbar.
