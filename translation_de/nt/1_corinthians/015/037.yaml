source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: de
  text: 'Und was du säst: Du säst nicht den Leib, der entstehen wird, sondern ein bloßes Samenkorn – etwa von Weizen oder einer anderen Art.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sondern ein nacktes Korn – vielleicht Weizen oder etwas anderes“.'
    reason: Bewahrt mögliche wörtlichere beziehungsweise idiomatische Alternativen für γυμνὸν κόκκον, εἰ τύχοι und τινος τῶν λοιπῶν.
lexical_decisions:
- source_word: σπείρεις
  choice: du säst
  rationale: Das landwirtschaftliche Verb bedeutet „säen“ und bewahrt das Saatbild sowie den sprachlichen Zusammenhang des Abschnitts.
- source_word: σῶμα
  choice: Leib
  rationale: „Leib“ gibt den in der Auferstehungsargumentation zentralen paulinischen Begriff wieder und vermeidet die abschwächende Wiedergabe „Gestalt“.
- source_word: τὸ γενησόμενον
  choice: der erst entstehen wird
  rationale: Die Formulierung gibt das zukünftige Ins-Dasein-Kommen wieder. „Erst“ verdeutlicht natürlich den Gegensatz zwischen dem gesäten Korn und dem künftigen Leib, ohne den Vorgang auf Pflanzenwachstum zu verengen.
- source_word: γυμνὸν κόκκον
  choice: ein bloßes Korn
  rationale: „Bloß“ bezeichnet hier das Korn für sich, noch ohne die spätere Gestalt. Es ist im Deutschen natürlicher als „nackt“, bewahrt aber den Gegensatz zum künftigen Leib.
- source_word: εἰ τύχοι
  choice: etwa
  rationale: Die idiomatische Wendung führt ein mögliches Beispiel an; „etwa“ drückt diese Unbestimmtheit knapp und natürlich aus.
- source_word: σίτου
  choice: ein Weizenkorn
  rationale: σῖτος bezeichnet hier am ehesten Weizen; die Wiederaufnahme von „Korn“ ergibt im Deutschen eine klare und natürliche Fügung.
- source_word: τινος τῶν λοιπῶν
  choice: eines von den übrigen
  rationale: Die Wiedergabe bleibt nahe an der griechischen Formulierung und lässt offen, welche anderen Korn- oder Samenarten gemeint sind.
theological_decisions:
- issue: Verhältnis des Samenkorns zum Auferstehungsleib
  choice: „Leib“ und die zukunftsgerichtete Formulierung werden beibehalten, ohne das Bild weiter auszudeuten.
  alternative: 'Dynamisch: „die Pflanze, die daraus wachsen wird“'
  rationale: Paulus spricht innerhalb eines landwirtschaftlichen Vergleichs ausdrücklich vom künftigen σῶμα. Die Übersetzung wahrt damit sowohl die Verwandlung als auch den Bezug zur leiblichen Auferstehung, ohne eine umfassendere dogmatische Erklärung in den Vers einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Doppelpunkt bildet die hervorgehobene griechische Konstruktion καὶ ὃ σπείρεις ab; der Gedankenstrich macht das angefügte Beispiel lesbar.
