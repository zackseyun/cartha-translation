    issue: „erst“ in „der erst entstehen wird“
    rationale: Das griechische τὸ γενησόμενον bezeichnet das künftig Entstehende, ohne ausdrücklich das deutsche Zusatzmoment „erst“ zu setzen. Die Streichung bewahrt die Zukunftsaussage ohne zusätzliche zeitliche Akzentuierung.
  - severity: low
    issue: „eines von den übrigen“
    rationale: Die Formulierung lässt offen, worauf sich „eines“ bezieht, und klingt im Deutschen unvollständig. „Von Weizen oder einer anderen Art“ stellt die im Kontext gemeinte andere Samenart klar, ohne sie näher zu bestimmen.
