  verdict: revise
  source_fidelity: 'Die Grundstruktur und die maßgeblichen Begriffe sind zutreffend wiedergegeben: σπείρεις als „säst“, σῶμα als „Leib“, γυμνὸν κόκκον als „bloßes Samenkorn“ und σῖτος als Weizen. „Erst“ in „der erst entstehen wird“ fügt jedoch eine zeitliche Zuspitzung hinzu, die der bloße Zukunftspartizip τὸ γενησόμενον nicht ausdrücklich enthält. „Eines von den übrigen“ ist zudem im Deutschen elliptisch und weniger klar als die im Griechischen gemeinte andere Samenart.'
  naturalness: Die Satzführung mit Doppelpunkt und Gedankenstrich ist gut lesbar und angemessen. „Ein bloßes Samenkorn“ ist gegenüber „ein bloßes Korn“ genauer und idiomatisch. „Etwa von Weizen oder einer anderen Art“ gibt das beispielhafte, offene εἰ τύχοι natürlich wieder.
  terminology: „Leib“ ist im Kontext der paulinischen Auferstehungsargumentation als etablierter, theologisch relevanter Ausdruck vertretbar und wahrt die terminologische Verbindung im Abschnitt. Die Revision deutet das Bild nicht über den Wortlaut hinaus.
  issues:
