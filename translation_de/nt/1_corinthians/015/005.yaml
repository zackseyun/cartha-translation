id: 1CO.15.5
reference: 1 Corinthians 15:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτι ὤφθη Κηφᾷ, εἶτα τοῖς δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/005.yaml
  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: de
  text: und dass er Kephas[a][b] erschien, dann den Zwölf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Kephas gesehen wurde“. Das griechische Verb steht formal im Passiv, wird im Zusammenhang mit Auferstehungserscheinungen jedoch häufig mit „erschien“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: Kephas ist der aramäische Name, dem der Name Petrus entspricht.
    reason: cross_reference
  - marker: c
    text: „Die Zwölf“ ist die feste Bezeichnung für den Kreis der Apostel Jesu, auch wenn die Gruppe nicht zu jedem Zeitpunkt tatsächlich aus zwölf Personen bestand.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: erschien
  rationale: Der formal passive Aorist von ὁράω wird im Zusammenhang mit Auferstehungserscheinungen im Deutschen idiomatisch mit „erschien“ wiedergegeben. Die Alternative „wurde gesehen“ bewahrt zwar die Passivform, klingt hier jedoch weniger natürlich und kann den Charakter einer sichtbaren Selbstbekundung verdunkeln.
- source_word: Κηφᾷ
  choice: Kephas
  rationale: Die Dativform des Eigennamens Κηφᾶς wird als „Kephas“ transliteriert und nicht mit dem geläufigeren entsprechenden Namen „Petrus“ harmonisiert.
- source_word: εἶτα
  choice: dann
  rationale: Das Wort kennzeichnet die zeitliche Abfolge innerhalb der überlieferten Reihe und wird knapp und natürlich mit „dann“ wiedergegeben.
- source_word: τοῖς δώδεκα
  choice: den Zwölf
  rationale: Die Wendung wird als feste Bezeichnung für den apostolischen Kreis beibehalten, ohne sie historisierend zu „den Elf“ oder verallgemeinernd zu „den Aposteln“ umzuformen.
- source_word: καὶ ὅτι
  choice: und dass
  rationale: Beide Partikeln werden wiedergegeben, sodass die Fortsetzung der in den vorangehenden Versen begonnenen Reihe von Inhaltssätzen sichtbar bleibt.
theological_decisions:
- issue: Sprache der Auferstehungserscheinung
  choice: er erschien
  alternative: er wurde von Kephas gesehen
  rationale: „Erschien“ gibt den in Auferstehungsberichten üblichen Sinn natürlich wieder, ohne die Art der Erscheinung näher zu bestimmen. Die formal passive Alternative wird in einer Fußnote bewahrt.
- issue: Bezeichnung „die Zwölf“ trotz der Abwesenheit des Judas
  choice: den Zwölf
  alternative: den Elf / den Aposteln
  rationale: Der griechische Text verwendet die feste Gruppenbezeichnung τοῖς δώδεκα. Sie wird nicht anhand anderer Berichte harmonisiert oder erklärend ersetzt.
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die Satzstruktur schließt bewusst mit „und dass“ an den vorangehenden Überlieferungssatz an. Eigennamen und die feste Gruppenbezeichnung bleiben quellennah erhalten.
