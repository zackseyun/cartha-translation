id: 1CO.15.35
reference: 1 Corinthians 15:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: de
  text: 'Doch jemand wird sagen: »Wie werden die Toten auferweckt[a], und mit was für einem Leib kommen sie?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie stehen die Toten auf?« Das griechische Verb steht im Passiv, wörtlich »werden auferweckt«, was auf göttliches Handeln hindeuten kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den kontrastierenden Übergang zu einem erwarteten Einwand oder einer rhetorischen Frage, ohne einen übermäßig starken Gegensatz zu erzeugen.
- source_word: ἐρεῖ τις
  choice: jemand wird sagen
  rationale: Bewahrt den Futur Indikativ und die unbestimmte Person; die Formulierung führt idiomatisch einen gedachten Gesprächspartner ein.
- source_word: Πῶς
  choice: Wie
  rationale: Gibt die Frage nach Weise oder Möglichkeit unmittelbar wieder.
- source_word: ἐγείρονται
  choice: werden ... auferweckt
  rationale: Bewahrt das grammatische Passiv und lässt die im Auferstehungskontext mögliche göttliche Urheberschaft unausgesprochen mitschwingen.
- source_word: οἱ νεκροί
  choice: die Toten
  rationale: Natürliche und präzise Wiedergabe des substantivierten Adjektivs.
- source_word: ποίῳ ... σώματι
  choice: mit was für einem Leib
  rationale: Gibt die qualitative Bedeutung von ποίῳ wieder und bildet den Dativ idiomatisch mit »mit« ab; »Leib« passt zum würdevollen Auferstehungskontext, ohne σώμα näher auszudeuten.
- source_word: δὲ
  choice: und
  rationale: Verbindet hier die zweite Frage mit der ersten, ohne einen deutlichen Gegensatz zu markieren.
- source_word: ἔρχονται
  choice: kommen sie
  rationale: Bewahrt das konkrete Verb ἔρχομαι, statt es deutend durch »erscheinen« oder erneut durch »auferstehen« zu ersetzen.
theological_decisions:
- issue: Formulierung der Auferstehung und ihre Urheberschaft
  choice: Wie werden die Toten auferweckt
  alternative: Wie stehen die Toten auf
  rationale: Das Passiv des griechischen Textes bleibt erhalten. So wird eine mögliche göttliche Urheberschaft nicht beseitigt, aber auch nicht ausdrücklich ergänzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Leib« erhält die theologische und anthropologische Offenheit von σώμα; die etwas markierte, aber natürliche Wendung »mit was für einem Leib« bewahrt die qualitative Frage und das Verb »kommen«.
