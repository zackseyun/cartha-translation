review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die argumentative Einleitung Ἐπεὶ mit „sonst“, die rhetorischen Fragen, die Verstärkung „überhaupt“ und das Passiv von ἐγείρονται zutreffend wieder. „Für die Toten“ bewahrt die umstrittene, nicht weiter festgelegte Beziehung von ὑπέρ mit Genitiv. Im zweiten Satz erzeugt die doppelte Verwendung von „sie“ jedoch eine erhebliche deutsche Bezugsunklarheit: Sie kann fälschlich die Toten als Subjekt erscheinen lassen, während im Griechischen klar dieselben Täuflinge gemeint sind.'
  naturalness: Modernes und würdiges Standarddeutsch. „Sich taufen lassen“ ist idiomatisch. Die Wiederaufnahme mit „jene“ und die Wiederholung von „die Toten“ machen den zweiten Fragesatz klar und natürlich, ohne die griechische Aussage auszudeuten.
  terminology: „Tote/auferweckt“ entspricht der paulinischen Auferstehungssprache. „Für die Toten“ bleibt bewusst offen; die Fußnote dokumentiert zulässige Deutungsrichtungen, ohne eine Praxis oder Lehre zu behaupten.
  issues:
  - severity: medium
    issue: Unklarer Bezug von „sie“ im zweiten Satz
    rationale: In „warum lassen sie sich dann für sie taufen?“ ist weder das Subjekt noch das Objektpronomen ohne Weiteres eindeutig. Das griechische βαπτίζονται verweist auf die zuvor genannten Täuflinge, während αὐτῶν auf die Toten zurückverweist. Im Deutschen sollte dies explizit unterschieden werden.
  revised_text: Was werden sonst diejenigen tun, die sich für die Toten taufen lassen?[a] Wenn Tote überhaupt nicht auferweckt werden, warum lassen sich jene dann für die Toten taufen?
