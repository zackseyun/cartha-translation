source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: de
  text: Was werden sonst diejenigen tun, die sich für die Toten taufen lassen?[a] Wenn Tote überhaupt nicht auferweckt werden, warum lassen sich jene dann für die Toten taufen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellvertretend für die Toten“, „wegen der Toten“ oder, weniger wahrscheinlich, „über den Toten“. Die griechische Präposition kann hier unterschiedlich verstanden werden; welche Praxis Paulus genau meint, ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: sonst
  rationale: Im argumentativen Zusammenhang leitet ἐπεί die Konsequenz aus der zuvor erörterten Leugnung der Auferstehung ein; „sonst“ gibt diesen Übergang natürlich wieder.
- source_word: τί ποιήσουσιν
  choice: was werden ... tun
  rationale: Die offene Bedeutung von ποιέω und die rhetorische Frage bleiben erhalten, ohne sie zu „was erreichen“ oder „was wird aus ihnen“ zu verengen.
- source_word: οἱ βαπτιζόμενοι
  choice: diejenigen, die sich ... taufen lassen
  rationale: Die deutsche Wendung gibt das Passiv und den gegenwärtigen beziehungsweise wiederholten Charakter idiomatisch wieder, ohne die Praxis zu bewerten.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: für die Toten
  rationale: „Für“ ist eine natürliche, bewusst offene Wiedergabe von ὑπέρ mit Genitiv. Sie lässt sowohl eine stellvertretende als auch eine weiter gefasste Beziehung zu den Toten zu.
- source_word: εἰ ὅλως
  choice: wenn ... überhaupt nicht
  rationale: „überhaupt“ bewahrt die verstärkende Wirkung von ὅλως in natürlichem Deutsch.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: Tote ... nicht auferweckt werden
  rationale: Das Passiv wird beibehalten und entspricht der Auferstehungssprache des Zusammenhangs, ohne den unausgesprochenen Handelnden eigens einzufügen.
- source_word: τί καὶ
  choice: warum ... dann
  rationale: Die idiomatische Wiedergabe macht die Folgerung der wiederholten rhetorischen Frage deutlich.
- source_word: ὑπὲρ αὐτῶν
  choice: für sie
  rationale: Das Pronomen verweist knapp auf die Toten zurück; zugleich bleibt die gleiche semantische Offenheit wie beim ersten ὑπέρ erhalten.
theological_decisions:
- issue: Bedeutung der Taufe „für die Toten“
  choice: Die umstrittene Formulierung wird mit „sich für die Toten taufen lassen“ bewusst wenig deutend wiedergegeben.
  alternative: „sich stellvertretend für die Toten taufen lassen“, „sich wegen der Toten taufen lassen“ oder „sich über den Toten taufen lassen“
  rationale: Der Vers benennt eine schwer sicher zu bestimmende Praxis und verwendet sie rhetorisch im Argument für die Auferstehung. Die Übersetzung soll weder eine bestimmte historische Rekonstruktion noch eine konfessionelle Lehre bestätigen. Daher steht die natürlich offene Formulierung im Text; mögliche Bedeutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich taufen lassen“ ist idiomatischer als das steife Passiv „getauft werden“ und wahrt dennoch, dass die Betreffenden die Taufe empfangen. Die zweimalige Formulierung mit „für“ erhält die Parallelität des griechischen Textes.
