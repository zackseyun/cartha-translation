  terminology: »gerettet«, »Botschaft«, »als gute Nachricht verkündet«, »festhaltet« und »vergeblich geglaubt« sind registergerecht und semantisch tragfähig. Die Fußnoten sind korrekt verankert und geben echte Übersetzungsalternativen bzw. Auslegungsnuancen wieder.
