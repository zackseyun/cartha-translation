source:
  edition: SBLGNT
  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: de
  text: Durch sie werdet ihr auch gerettet[a], wenn ihr an der Botschaft festhaltet, die ich euch als gute Nachricht verkündet habe[b] – es sei denn, ihr habt vergeblich geglaubt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seid ihr gerettet«. Das griechische Präsens kann als fortdauernder Vorgang oder allgemeiner als gegenwärtiger Zustand verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wenn ihr festhaltet, mit welchem Wort / in welcher Form ich euch die gute Nachricht verkündet habe«. Die griechische Wendung kann den Inhalt oder den Wortlaut der Verkündigung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: durch sie
  rationale: διά mit dem Genitiv bezeichnet hier das Mittel; das Pronomen verweist auf die zuvor genannte gute Nachricht beziehungsweise das Evangelium zurück.
- source_word: σῴζεσθε
  choice: werdet ihr gerettet
  rationale: Die deutsche Präsensform kann den gegenwärtigen beziehungsweise fortdauernden Vorgang wiedergeben, ohne eine bestimmte Lehrauffassung zum zeitlichen Verlauf der Rettung festzuschreiben.
- source_word: τίνι λόγῳ
  choice: an der Botschaft, die
  rationale: λόγος bezeichnet im Zusammenhang den Inhalt beziehungsweise Wortlaut der Verkündigung. Die idiomatische Einbindung in den Konditionalsatz ist im Deutschen klarer als eine starre Wiedergabe mit »welchem Wort«; die mögliche Nuance der Form oder des Wortlauts wird in einer Fußnote bewahrt.
- source_word: εὐηγγελισάμην
  choice: als gute Nachricht verkündet habe
  rationale: Die Formulierung macht den Bedeutungsgehalt des Verbs – eine gute Nachricht bekannt machen – transparent und vermeidet die mögliche Verengung von »predigen« auf eine bestimmte Redeform.
- source_word: κατέχετε
  choice: festhaltet
  rationale: κατέχω bezeichnet hier das fortdauernde Bewahren und Festhalten an der empfangenen Botschaft.
- source_word: ἐκτὸς εἰ μὴ
  choice: es sei denn
  rationale: Die Wendung leitet eine Ausnahme oder Einschränkung ein; »es sei denn« gibt diese Funktion natürlich und präzise wieder.
- source_word: εἰκῇ
  choice: vergeblich
  rationale: Das Adverb bezeichnet hier einen Glauben ohne Ergebnis oder Zweck und bewahrt mit »vergeblich« die warnende Zuspitzung.
- source_word: ἐπιστεύσατε
  choice: ihr habt geglaubt
  rationale: Der Aorist blickt auf den vollzogenen Glaubensakt der Adressaten zurück; das deutsche Perfekt ist dafür im modernen Standarddeutsch natürlich.
theological_decisions:
- issue: Aspekt der Rettung in σῴζεσθε
  choice: werdet ihr gerettet
  alternative: seid ihr gerettet
  rationale: Die Präsensform lässt einen gegenwärtigen beziehungsweise fortdauernden Rettungsvorgang erkennen. Die Übersetzung bewahrt diese Perspektive, ohne die paulinische Spannung zwischen vollzogener und fortdauernder Rettung lehrsystematisch aufzulösen.
- issue: Bedingung εἰ κατέχετε
  choice: wenn ihr … festhaltet
  alternative: sofern ihr … festhaltet; da ihr … festhaltet
  rationale: Die reale Bedingungsform bleibt bestehen. Sie wird weder als bloßer Beweis echten Glaubens erklärt noch als selbstverständlich erfüllt vorausgesetzt.
- issue: Warnung ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε
  choice: es sei denn, ihr habt vergeblich geglaubt
  alternative: wenn ihr nicht etwa ohne Grund zum Glauben gekommen seid
  rationale: Die knappe Warnung bleibt in ihrer theologischen Schärfe und möglichen Mehrdeutigkeit erhalten; der Text entscheidet nicht vorab, worin die Vergeblichkeit bestünde.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. »Gute Nachricht« macht den Sinn von εὐαγγελίζομαι unmittelbar verständlich; »Botschaft« sorgt im Konditionalsatz für natürliche Lesbarkeit. Der Gedankenstrich bildet die abrupte Ausnahmeformel des griechischen Satzes ab.
