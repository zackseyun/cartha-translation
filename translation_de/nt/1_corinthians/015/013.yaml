  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: de
  text: Wenn es aber keine Auferstehung der Toten gibt, dann ist nicht einmal der Messias auferweckt worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann ist nicht einmal Christus auferweckt worden.“ Das griechische Χριστός kann als „Messias“ oder „Christus“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn es aber
  rationale: εἰ leitet die Bedingung ein; δέ markiert einen leichten Gegensatz beziehungsweise die argumentative Weiterführung. Die deutsche Wortstellung gibt beides natürlich wieder.
- source_word: ἀνάστασις νεκρῶν
  choice: Auferstehung der Toten
  rationale: Die etablierte deutsche Wendung bewahrt den Genitiv und bezeichnet die Toten als die Gruppe, deren Auferstehung zur Debatte steht.
- source_word: οὐκ ἔστιν
  choice: es keine … gibt
  rationale: Die existenzielle Verneinung wird im Deutschen idiomatisch mit „es gibt keine“ ausgedrückt.
- source_word: οὐδὲ
  choice: dann … auch … nicht
  rationale: Im Bedingungsgefüge macht „dann“ die Folgerung deutlich; „auch nicht“ gibt die einschließende Verneinung von οὐδέ natürlich wieder.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός ist hier als Titel des Gesalbten zu verstehen. „Messias“ bewahrt den Titelcharakter im modernen Deutschen.
- source_word: ἐγήγερται
  choice: ist … auferweckt worden
  rationale: Das Perfekt Passiv von ἐγείρω bezeichnet ein vollzogenes, weiterhin bedeutsames Geschehen. Die passive Form bleibt erhalten, ohne Gott als im Satz nicht ausdrücklich genannten Handelnden einzufügen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Im Auferstehungsargument hat Χριστός weiterhin erkennbaren Titelcharakter. „Der Messias“ gibt die Bedeutung des griechischen Titels wieder; „Christus“ wäre im Deutschen konventioneller, wirkt jedoch stärker wie ein Eigenname.
- issue: Passivform von ἐγήγερται
  choice: ist auferweckt worden
  alternative: ist auferstanden
  rationale: Die gewählte Form bewahrt das grammatische Passiv und lässt den Handelnden unausgesprochen, wie es der griechische Text tut. Die Alternative ist idiomatisch, verwischt aber die Passivform.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem knappen logischen Bedingungsschluss des griechischen Textes; „auferweckt worden“ ist bewusst etwas formeller, um das Passiv präzise zu bewahren.
