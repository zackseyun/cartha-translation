  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: de
  text: Doch nicht das Geistliche kommt zuerst[a], sondern das Natürliche[b]; danach das Geistliche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nicht der geistliche Leib kommt zuerst, sondern der natürliche Leib; danach der geistliche Leib.“ Paulus lässt das Wort „Leib“ hier aus, obwohl es im unmittelbaren Zusammenhang ausdrücklich steht.'
    reason: alternative_reading
  - marker: b
    text: '„Natürlich“ gibt das griechische psychikon wieder und bezeichnet das, was zum gewöhnlichen beseelten Leben gehört; wörtlicher auch: „seelisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: kommt zuerst
  rationale: Das adverbial gebrauchte Wort bezeichnet die zeitliche beziehungsweise sachliche Reihenfolge. Mit „kommt zuerst“ wird diese Abfolge im Deutschen natürlich und deutlich ausgedrückt.
- source_word: πνευματικόν
  choice: das Geistliche
  rationale: Das substantivierte, artikulierte Adjektiv bleibt entsprechend der knappen griechischen Form ohne das im Kontext naheliegende Substantiv „Leib“. So wird die Aussage nicht unnötig eingeengt.
- source_word: ψυχικόν
  choice: das Natürliche
  rationale: Das Wort bezeichnet hier das, was zum gewöhnlichen beseelten Leben gehört, im Gegensatz zu dem vom Geist bestimmten endzeitlichen Dasein. „Das Natürliche“ ist verständlich und vermeidet sowohl die körperliche Verengung von „das Physische“ als auch eine vorschnell moralische Wertung.
- source_word: ἔπειτα
  choice: danach
  rationale: Das Wort markiert die folgende Stufe der Abfolge; „danach“ gibt dies knapp und idiomatisch wieder.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Doch nicht ... sondern
  rationale: Die deutsche Konstruktion bildet die korrigierende Gegenüberstellung des Griechischen klar und natürlich ab.
theological_decisions:
- issue: Bedeutung des Gegensatzes zwischen ψυχικόν und πνευματικόν
  choice: Eine zeitliche Abfolge zwischen dem natürlichen, beseelten Dasein und dem geistlichen Dasein im Auferstehungsargument des Paulus.
  alternative: Ein ausschließlich auf den natürlichen und den geistlichen Leib bezogener Gegensatz oder ein Gegensatz zwischen ungeistlichen und geistlichen Menschen.
  rationale: Vers 44 nennt ausdrücklich den natürlichen und den geistlichen Leib; Vers 46 lässt „Leib“ jedoch aus und formuliert knapper. Die Übersetzung bewahrt diese Offenheit, ohne den Zusammenhang mit der Auferstehung zu lösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe substantivische Gegenüberstellung des Griechischen bleibt erhalten; die ergänzte Verbform „kommt“ macht die Reihenfolge im Deutschen idiomatisch verständlich.
