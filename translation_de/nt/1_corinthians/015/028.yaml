  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: de
  text: Wenn ihm aber alles unterworfen ist[a], dann wird auch der Sohn selbst dem unterworfen sein, der ihm alles unterworfen hat, damit Gott alles in allem sei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn ihm aber alle Dinge unterworfen sein werden.« Das griechische τὰ πάντα bedeutet umfassend »alles« oder »alle Dinge«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »alles in allen«. Das griechische πᾶσιν steht im Plural; die knappe Wendung lässt offen, ob der Bezug personal (»in allen Menschen«) oder umfassender zu verstehen ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Wenn … aber
  rationale: ὅταν leitet den zeitlichen Nebensatz ein; δέ markiert einen leichten Gegensatz beziehungsweise den nächsten Gedankenschritt. Die deutsche Nachstellung von »aber« ist natürlich und präzise.
- source_word: ὑποταγῇ
  choice: unterworfen ist
  rationale: Der Aorist Passiv Konjunktiv bezeichnet im zeitlichen Satz die vollzogene Unterordnung. »Unterworfen ist« bewahrt das Passiv und klingt im Deutschen natürlicher als eine schwerfällige Formulierung mit »worden sein wird«.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Pronomen verweist im Zusammenhang auf den Sohn und wahrt die Richtung der Unterordnung.
- source_word: τὰ πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural hat hier umfassenden, kosmischen Umfang. »Alles« ist die natürliche deutsche Entsprechung und wird in beiden Vorkommen wiederholt.
- source_word: τότε
  choice: dann
  rationale: Das Zeitadverb kennzeichnet die folgende Stufe des Geschehens knapp und idiomatisch.
- source_word: αὐτὸς ὁ υἱὸς
  choice: der Sohn selbst
  rationale: Das vorangestellte αὐτός hebt den Sohn persönlich hervor; »selbst« erhält diese Betonung.
- source_word: ὑποταγήσεται
  choice: wird … unterworfen sein
  rationale: Das Futur Passiv wird als zukünftiger Zustand beziehungsweise Vorgang wiedergegeben und bleibt lexikalisch mit dem ersten Vorkommen von ὑποτάσσω verbunden. Ein zusätzliches »auch« macht im Deutschen die Einbeziehung des Sohnes in die zuvor beschriebene Unterordnung deutlich, ohne das Verb aktiv als freiwilliges »sich unterordnen« umzudeuten.
- source_word: τῷ ὑποτάξαντι
  choice: dem …, der … unterworfen hat
  rationale: Der artikulierte Aoristpartizip wird als substantivische Relativkonstruktion wiedergegeben; der Aorist bezeichnet die vollzogene Handlung.
- source_word: ἵνα ᾖ
  choice: damit … sei
  rationale: ἵνα mit Konjunktiv lässt Zweck und Ergebnis anklingen. »Damit … sei« bewahrt diese Offenheit in gehobenem, aber verständlichem Deutsch.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte Wiedergabe des nominativischen Subjekts.
- source_word: πάντα ἐν πᾶσιν
  choice: alles in allen
  rationale: Die knappe paulinische Wendung wird möglichst formal bewahrt. Sie erhält die Wiederholung des umfassenden πᾶς-Wortfeldes und legt nicht fest, ob πᾶσιν personal oder umfassender zu verstehen ist.
theological_decisions:
- issue: Unterordnung des Sohnes
  choice: Die zukünftige Unterordnung des Sohnes wird ohne abschwächende oder erklärende Zusätze direkt wiedergegeben.
  alternative: Die Aussage als freiwilliges Sich-Unterordnen paraphrasieren oder ausdrücklich auf eine funktionale beziehungsweise heilsgeschichtliche Unterordnung begrenzen.
  rationale: Der griechische Text verwendet eine passive Form und formuliert eine eschatologische Unterordnung. Die Übersetzung bewahrt diese theologische Spannung, ohne Aussagen über das Wesen des Sohnes hinzuzufügen oder die personale Unterscheidung aufzulösen.
- issue: Umfang von τὰ πάντα und πάντα ἐν πᾶσιν
  choice: Die umfassende Wiederholung wird mit »alles« und »alles in allen« erhalten.
  alternative: Die Schlusswendung eindeutig personal als »alles in jedem« oder sachlich als »alles in allem« auslegen.
  rationale: Die πᾶς-Formen tragen den kosmischen Umfang des Gedankengangs. Der knappe deutsche Ausdruck bewahrt die Mehrdeutigkeit des Dativ Plural und vermeidet eine ungerechtfertigte Einengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wortfamilie von ὑποτάσσω wird konsequent mit »unterwerfen/unterworfen« wiedergegeben. Der Satzbau bleibt nahe am griechischen Gedankengang, ohne im Deutschen unnötig schwerfällig zu werden.
