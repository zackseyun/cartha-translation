  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. Die Änderung zu „alles in allem“ verbessert die idiomatische Verständlichkeit deutlich. In Fußnote a ist „die Gesamtheit des Geschaffenen“ eine nicht ausdrücklich im Ausdruck τὰ πάντα enthaltene Eingrenzung und sollte vermieden werden.
  terminology: „unterworfen“ hält die passive Ausdrucksweise und die Wiederholung von ὑποτάσσω angemessen fest. „Sohn“ und „Gott“ sind korrekt. Die Schlussformel wird als „alles in allem“ wiedergegeben; die Fußnote hält fest, dass das griechische πᾶσιν Plural ist und seine genaue Bezugsweite offenlässt.
