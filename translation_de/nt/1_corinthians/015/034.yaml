  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: de
  text: Werdet nüchtern, wie es recht ist[a], und sündigt nicht weiter[b]; denn einige haben keine Kenntnis von Gott. Das sage ich zu eurer Beschämung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb bezeichnet wörtlich das Ernüchtern nach einem Rausch und ist hier wahrscheinlich bildlich für die Rückkehr zu klarem Denken gebraucht.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „sündigt nicht“ oder „hört auf zu sündigen“. Die griechische Präsensform kann fortdauerndes oder wiederholtes Handeln im Blick haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Werdet wieder nüchtern
  rationale: Der Aoristimperativ fordert eine entschiedene Rückkehr zu klarem Denken. Die Formulierung bewahrt das anschauliche Bild des Ernüchterns, das hier metaphorisch gebraucht wird.
- source_word: δικαίως
  choice: richtig
  rationale: Das Adverb bestimmt die Aufforderung näher und bezeichnet ein angemessenes, rechtes Verhalten, ohne unnötig einen technischen Begriff von Gerechtigkeit einzutragen.
- source_word: μὴ ἁμαρτάνετε
  choice: sündigt nicht weiter
  rationale: Der Präsensimperativ mit μή kann fortdauerndes oder wiederholtes Handeln untersagen. Die Wiedergabe bringt diese mögliche Verlaufsnuance zum Ausdruck, ohne sie als einzig mögliche Deutung auszugeben.
- source_word: ἀγνωσίαν ... θεοῦ
  choice: kennen Gott nicht
  rationale: Die natürliche deutsche Formulierung gibt den Mangel an Gotteserkenntnis idiomatisch wieder. Der griechische Genitiv bezeichnet hier das, worauf sich die Unkenntnis bezieht.
- source_word: τινες
  choice: einige
  rationale: Die Form bezeichnet unbestimmt einen Teil der angesprochenen oder mit ihnen verbundenen Menschen.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: zu eurer Beschämung
  rationale: Die Wendung bewahrt den scharfen Tadel und lässt offen, ob Beschämung eher als beabsichtigte Wirkung oder als Ergebnis verstanden wird.
- source_word: λαλῶ
  choice: Das sage ich
  rationale: Im Deutschen verweist diese diskursgerechte Formulierung natürlich auf den unmittelbar vorausgehenden Tadel.
theological_decisions:
- issue: Moralische Tragweite von δικαίως
  choice: richtig
  alternative: in rechter Weise; gerecht
  rationale: „Richtig“ erhält die ethische Färbung, ohne dem Adverb einen stärker ausgeprägten paulinischen Gerechtigkeitsbegriff aufzuerlegen.
- issue: Art der Unkenntnis Gottes
  choice: einige kennen Gott nicht
  alternative: einige haben keine Erkenntnis Gottes
  rationale: Die idiomatische Wiedergabe drückt tatsächlichen Mangel an Gotteserkenntnis aus, ohne zu entscheiden, ob Paulus vor allem intellektuelle Unwissenheit, fehlende Beziehung oder schuldhafte Verkennung meint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem Mahnton. Das Bild des Ernüchterns bleibt erhalten; erklärungsbedürftige Aspekte werden knapp in Fußnoten erläutert.
