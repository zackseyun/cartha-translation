  variant: modern standard German
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: de
  text: 'Das aber sage ich, Brüder[a]: Fleisch und Blut können das Reich Gottes[b] nicht erben, und das Vergängliche erbt die Unvergänglichkeit nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“. Das griechische Wort lautet „Brüder“, kann hier aber die ganze Gemeinde einschließen.'
    reason: lexical_alternative
  - marker: b
    text: „Fleisch und Blut“ ist eine feste Wendung für das sterbliche menschliche Leben in seinem gegenwärtigen Zustand; sie verneint nicht die leibliche Auferstehung.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Das aber sage ich
  rationale: Gibt Τοῦτο und φημι direkt wieder und bewahrt mit „aber“ die weiterführende beziehungsweise folgernde Kraft von δέ, ohne ein nicht ausdrücklich vorhandenes zeitliches „nun“ einzufügen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die grammatisch maskuline Anrede; dass sie im paulinischen Gemeindekontext die ganze Gemeinde einschließen kann, wird in einer Fußnote kenntlich gemacht.
- source_word: σὰρξ καὶ αἷμα
  choice: Fleisch und Blut
  rationale: Erhält die feste Wendung und ihre Bildkraft. Im Kontext bezeichnet sie das sterbliche menschliche Dasein in seinem gegenwärtigen Zustand.
- source_word: βασιλείαν θεοῦ
  choice: das Reich Gottes
  rationale: Geläufige, transparente Wiedergabe, die die Genitivverbindung und das theologische Gewicht der Wendung wahrt.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: erben / erbt
  rationale: Bewahrt sowohl die Erbmetaphorik als auch den Parallelismus der beiden Satzhälften.
- source_word: οὐ δύναται
  choice: können … nicht
  rationale: Natürliches modernes Deutsch für die ausgesagte Unfähigkeit; das Pluralverb entspricht dem zusammengesetzten Ausdruck „Fleisch und Blut“ im Deutschen.
- source_word: ἡ φθορά
  choice: das Vergängliche
  rationale: Bezeichnet hier das dem Verfall unterworfene Dasein und bildet im Deutschen einen klaren Gegensatz zu „die Unvergänglichkeit“.
- source_word: τὴν ἀφθαρσίαν
  choice: die Unvergänglichkeit
  rationale: Bewahrt den abstrakten Charakter des griechischen Substantivs und den präzisen Gegensatz zu φθορά, ohne es mit „Unsterblichkeit“ gleichzusetzen.
theological_decisions:
- issue: Bedeutung von „Fleisch und Blut“ im Verhältnis zur Auferstehung
  choice: Die Wendung bleibt als Ausdruck für das sterbliche, vergängliche menschliche Dasein in seinem gegenwärtigen Zustand stehen.
  alternative: Die Aussage als grundsätzlichen Ausschluss jeder Körperlichkeit aus Gottes Reich verstehen.
  rationale: Der unmittelbare Zusammenhang handelt von der Verwandlung des vergänglichen Leibes in Unvergänglichkeit, nicht von der Aufgabe leiblicher Existenz. Die Fußnote verhindert eine vorschnelle antikörperliche Deutung, ohne die Bildsprache im Haupttext aufzulösen.
- issue: Adressatenbezeichnung ἀδελφοί
  choice: „Brüder“ im Haupttext, mit Hinweis auf den möglichen inklusiven Gemeindebezug.
  alternative: „Brüder und Schwestern“ unmittelbar im Haupttext.
  rationale: So bleibt die Form des griechischen Ausdrucks sichtbar, während sein wahrscheinlich umfassender Bezug auf die Gemeinde transparent gemacht wird.
- issue: φθορά und ἀφθαρσία
  choice: „das Vergängliche“ und „die Unvergänglichkeit“
  alternative: „Verweslichkeit“ und „Unverweslichkeit“ oder „das Vergängliche“ und „das Unvergängliche“
  rationale: Die gewählte Form wahrt den Gegensatz und zugleich die substantivische Abstraktheit von ἀφθαρσία. Sie lässt offen, ob Paulus primär Zustand, Qualität oder Sphäre akzentuiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Wortlaut und Parallelismus des griechischen Textes. Die traditionelle Wendung „Fleisch und Blut“ bleibt erhalten; erklärungsbedürftige inklusive und kontextuelle Aspekte stehen in knappen Fußnoten.
