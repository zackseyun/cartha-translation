  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: de
  text: Der Stachel des Todes ist die Sünde, und die Macht[a] der Sünde ist das Gesetz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kraft“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wahrscheinlich besonders das mosaische Gesetz; die Formulierung lässt jedoch auch den weiteren Gedanken zu, dass das Gesetz Sünde aufdeckt und verstärkt.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: Stachel
  rationale: Das Wort bezeichnet eine scharfe Spitze oder einen Treibstachel. Im Bild vom personifizierten Tod gibt „Stachel“ am natürlichsten das verletzende Werkzeug des Todes wieder und knüpft an den vorausgehenden Spottvers an.
- source_word: θανάτου
  choice: des Todes
  rationale: 'Der Genitiv wird als Zugehörigkeit wiedergegeben: der Stachel, der dem Tod eigen ist.'
- source_word: ἁμαρτία
  choice: Sünde
  rationale: Der Singular bleibt erhalten, da Paulus Sünde hier als wirksame Macht oder Größe und nicht bloß einzelne Sünden bezeichnet.
- source_word: δύναμις
  choice: Macht
  rationale: „Macht“ bezeichnet hier die Wirkkraft, die der Sünde zukommt. „Kraft“ ist ebenfalls möglich und wird in einer Fußnote genannt.
- source_word: νόμος
  choice: das Gesetz
  rationale: Die bestimmte Form bewahrt den wahrscheinlichen Bezug auf das mosaische Gesetz, ohne die weiter reichende paulinische Aussage über die Rolle des Gesetzes bei Sünde ausdrücklich darauf zu beschränken.
- source_word: δὲ … δὲ
  choice: … und …
  rationale: Die Partikeln gliedern und erläutern hier eher, als dass sie einen starken Gegensatz ausdrücken. Ein schlichtes „und“ verbindet die beiden parallelen Aussagen in natürlichem Deutsch.
theological_decisions:
- issue: Bedeutung von „das Gesetz“ als Macht der Sünde
  choice: „das Gesetz“ bleibt ohne erklärende Eingrenzung im Haupttext stehen.
  alternative: Eine ausdrückliche Wiedergabe als „das mosaische Gesetz“ oder eine Verallgemeinerung zu „Gesetzlichkeit“.
  rationale: Der Zusammenhang legt besonders das mosaische Gesetz nahe; die Formulierung kann jedoch zugleich dessen umfassendere Rolle beim Aufdecken und Verstärken der Sünde anklingen lassen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Parallelstruktur des griechischen Satzes bleibt gewahrt; ein nicht ausdrücklich vorhandenes einleitendes „Nun“ wird nicht ergänzt.
