id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: de
  text: 'Denn die Weisheit dieser Welt ist in Gottes Augen Torheit.[a] Denn es steht geschrieben: »Er fängt die Weisen in ihrer Gerissenheit.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bei Gott«; gemeint ist: nach Gottes Sicht und Urteil.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »durch ihre Gerissenheit«.'
    reason: source_ambiguity
lexical_decisions:
- source_word: σοφία
  choice: Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe; gemeint ist die von der Welt beanspruchte Weisheit.
- source_word: κόσμου τούτου
  choice: dieser Welt
  rationale: κόσμος bezeichnet hier die gegenwärtige, an weltlichen Maßstäben ausgerichtete Ordnung; »dieser Welt« gibt den Gegensatz zu Gottes Urteil natürlich wieder.
- source_word: μωρία
  choice: Torheit
  rationale: Die würdige, im paulinischen Zusammenhang geläufige Wiedergabe bewahrt den scharfen Gegensatz zur Weisheit.
- source_word: παρὰ τῷ θεῷ
  choice: in Gottes Augen
  rationale: Die Wendung bezeichnet Gottes Sicht und Urteil. Diese Wiedergabe ist im modernen Deutsch natürlicher als das wörtliche »bei Gott«.
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Entspricht der perfektischen Schriftformel und ist im Deutschen idiomatisch.
- source_word: δρασσόμενος
  choice: fängt
  rationale: Das Partizip bezeichnet ein Ergreifen oder Einfangen; »fängt« vermittelt im Zitat knapp, dass Gott die vermeintlich Weisen überführt und zu Fall bringt.
- source_word: σοφοὺς
  choice: die Weisen
  rationale: Die substantivierte Form bezeichnet weise Personen, ohne das Geschlecht unnötig festzulegen.
- source_word: πανουργίᾳ
  choice: Gerissenheit
  rationale: Das Wort bezeichnet hier negativ gefärbte, skrupellose Schlauheit; »Gerissenheit« bewahrt diese moralische Wertung.
theological_decisions:
- issue: Gottes Bewertung der Weisheit dieser Welt
  choice: in Gottes Augen Torheit
  alternative: bei Gott Torheit
  rationale: 'Die Formulierung macht den evaluativen Sinn von παρὰ τῷ θεῷ verständlich, ohne die Aussage abzuschwächen: Gottes Urteil steht der Selbsteinschätzung der Welt entgegen.'
- issue: Wiedergabe des articularen Partizips in der Anführung aus Hiob 5,13
  choice: Er fängt die Weisen
  alternative: Der die Weisen fängt
  rationale: Das im Kontext auf Gott bezogene Subjekt wird durch »Er« natürlich ausgedrückt. So bleibt die Aussage direkt, ohne einen zusätzlichen theologischen Gedanken einzuführen.
- issue: Bedeutung von ἐν bei der Gerissenheit der Weisen
  choice: in ihrer Gerissenheit
  alternative: durch ihre Gerissenheit
  rationale: Die gewählte Fassung folgt der räumlich-bildhaften Form des Griechischen; die Fußnote bewahrt die mögliche instrumentale Deutung, nach der gerade ihre eigene Gerissenheit zum Mittel ihres Ergriffenwerdens wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Begründung mit »Denn« bildet das zweimalige γάρ ab. Die Schriftanführung bleibt knapp und sprichwortartig; »Gerissenheit« bewahrt die negative Färbung des griechischen Ausdrucks.
