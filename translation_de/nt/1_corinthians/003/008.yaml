id: 1CO.3.8
reference: 1 Corinthians 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: de
  text: Wer pflanzt und wer begießt, sind eins[a]; doch jeder wird seinen eigenen Lohn entsprechend seiner eigenen Mühe empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind vereint“ oder „verfolgen dasselbe Ziel“.'
    reason: Lexikalische und sinngemäße Alternativen für das knappe griechische ἕν εἰσιν.
lexical_decisions:
- source_word: ὁ φυτεύων
  choice: wer pflanzt
  rationale: Das substantivierte Partizip wird im Deutschen natürlich mit einem freien Relativsatz wiedergegeben und bewahrt das landwirtschaftliche Bild.
- source_word: ὁ ποτίζων
  choice: wer begießt
  rationale: Die Formulierung entspricht parallel zu ὁ φυτεύων einem substantivisch gebrauchten Partizip; „begießen“ ist im Bild von Anbau und Pflanzen idiomatisch.
- source_word: ἕν
  choice: eins
  rationale: Das substantivierte Neutrum bezeichnet Einheit, nicht personale Identität. „Ist eins“ bewahrt die knappe und bewusst offene Formulierung des Griechischen.
- source_word: ἕκαστος
  choice: jeder
  rationale: Die singularische Form gibt die individuelle Verantwortlichkeit jedes Mitarbeiters klar wieder.
- source_word: τὸν ἴδιον μισθὸν
  choice: seinen eigenen Lohn
  rationale: „Lohn“ umfasst hier die Vergeltung für geleistete Arbeit, ohne sie zwingend auf eine Geldzahlung zu beschränken; „eigenen“ erhält die Betonung von ἴδιον.
- source_word: λήμψεται
  choice: wird … empfangen
  rationale: Das einfache Futur gibt die zukünftige Zuerkennung angemessen und in würdigem modernem Deutsch wieder.
- source_word: κατὰ
  choice: entsprechend
  rationale: „Entsprechend“ bildet die Beziehung zwischen dem empfangenen Lohn und der jeweils aufgewandten Mühe ab, ohne eine präzise Berechnungsformel einzutragen.
- source_word: τὸν ἴδιον κόπον
  choice: seiner eigenen Mühe
  rationale: κόπος bezeichnet anstrengende, mühevolle Arbeit. „Mühe“ ist natürlich und bewahrt diesen Aspekt besser als das allgemeinere „Arbeit“.
theological_decisions:
- issue: Bedeutung von ἕν εἰσιν
  choice: „ist eins“ als Aussage ihrer Einheit
  alternative: „sind vereint“ oder „verfolgen dasselbe Ziel“
  rationale: Das Neutrum ἕν spricht gegen personale Identität und weist auf Einheit hin. Der Haupttext lässt offen, ob besonders gemeinsame Ausrichtung, Zusammengehörigkeit oder gleicher Dienststatus betont ist; die Fußnote nennt sinnvolle Deutungen, ohne die Spannung einseitig aufzulösen.
- issue: Art des Lohns
  choice: Die Art des „Lohns“ wird nicht näher bestimmt.
  alternative: Ausdrückliche Deutung als himmlische Belohnung oder als Bezahlung
  rationale: Der Vers spricht von μισθός, legt hier aber weder dessen genaue Gestalt noch eine konfessionell bestimmte Lehre der Belohnung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen freien Relativsätze sind verständlich und vermeiden schwerfällige Bildungen wie „der Pflanzende“. Der Singular „ist“ folgt der griechischen Aussage, dass beide zusammen „eins“ sind; „doch“ gibt den Kontrast des zweiten δέ wieder.
