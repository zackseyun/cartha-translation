  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: de
  text: Daher ist weder der, der pflanzt, etwas, noch der, der begießt, sondern Gott, der das Wachstum bewirkt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sondern Gott, der wachsen lässt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Daher
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Gedankengang natürlich und prägnant.
- source_word: ὁ φυτεύων
  choice: der, der pflanzt
  rationale: Gibt das substantivierte Partizip transparent wieder und wahrt die Parallelität.
- source_word: ἐστίν τι
  choice: ist … etwas
  rationale: Bewahrt die knappe griechische Wendung, ohne sie interpretierend zu „zählt etwas“ auszuweiten.
- source_word: ὁ ποτίζων
  choice: der, der begießt
  rationale: Entspricht im landwirtschaftlichen Zusammenhang dem Bewässern der Pflanzung und steht parallel zu „der, der pflanzt“.
- source_word: ἀλλ’
  choice: sondern
  rationale: Nach der doppelten Verneinung bringt „sondern“ den scharfen Gegensatz zu den menschlichen Mitarbeitern idiomatisch zum Ausdruck.
- source_word: ὁ αὐξάνων
  choice: der das Wachstum bewirkt
  rationale: Drückt aus, dass Gott das Wachsen hervorbringt; das substantivierte Partizip wird als Relativsatz wiedergegeben.
- source_word: θεός
  choice: Gott
  rationale: Bewahrt die nachdrückliche Nennung Gottes am Ende des griechischen Satzes soweit in natürlichem Deutsch möglich.
theological_decisions:
- issue: Verhältnis menschlicher Mitarbeit zu Gottes Wirken
  choice: Die menschlichen Arbeiter werden als „nicht etwas“ bezeichnet, während Gott als derjenige hervorgehoben wird, der das Wachstum bewirkt.
  alternative: 'Freier: Die menschlichen Arbeiter „zählen nichts“.'
  rationale: Die Übersetzung bewahrt Paulus’ zugespitzten Gegensatz, ohne daraus eine weitergehende Aussage über den Wert menschlicher Mitarbeit abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Form „der, der …“ erhält die rhetorische Parallelität; „begießt“ ist im Bildfeld von Pflanzen natürlicher als das allgemeinere „wässert“.
