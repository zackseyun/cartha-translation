  terminology: „Gottes Mitarbeiter“ wahrt die im Kontext naheliegende Zuordnung bzw. den Dienst für Gott. Die Fußnote muss die echte alternative Deutung als Zusammenarbeit mit Gott klar und ohne eine unnötig weite Paraphrase kennzeichnen. Der Marker gehört unmittelbar an „Mitarbeiter“, das die betreffende griechische Wortgruppe wiedergibt.
