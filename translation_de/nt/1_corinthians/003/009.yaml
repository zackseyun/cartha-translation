  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: de
  text: Denn wir sind Gottes Mitarbeiter[a]; ihr seid Gottes Ackerfeld, Gottes Bauwerk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir sind Mitarbeiter zusammen mit Gott.“'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Bewahrt die begründende und erläuternde Verbindung zum vorhergehenden Gedankengang.
- source_word: συνεργοί
  choice: Mitarbeiter
  rationale: Eine natürliche, heute verständliche Wiedergabe für gemeinsam Arbeitende; der Plural bleibt erhalten.
- source_word: θεοῦ (bei συνεργοί)
  choice: Gottes
  rationale: Der Genitiv wird im unmittelbaren Zusammenhang am ehesten als Zugehörigkeit zu Gott beziehungsweise Dienst für ihn verstanden; die ebenfalls mögliche Deutung „Mitarbeiter Gottes“ wird in der Fußnote bewahrt.
- source_word: γεώργιον
  choice: Ackerfeld
  rationale: Gibt das landwirtschaftlich bearbeitete Land anschaulich wieder und erhält das Bild aus dem Kontext.
- source_word: οἰκοδομή
  choice: Bauwerk
  rationale: Bewahrt sowohl das errichtete Gebäude als auch den Anschluss an das Bau-Bild der folgenden Verse.
- source_word: ἐστε
  choice: ihr seid
  rationale: Gibt die ausdrücklich vorhandene zweite Person Plural direkt wieder.
theological_decisions:
- issue: Ob θεοῦ συνεργοί „Gottes Mitarbeiter“ im Sinn der Zugehörigkeit oder „Mitarbeiter Gottes“ im Sinn des Mitwirkens mit Gott bezeichnet
  choice: Gottes Mitarbeiter
  alternative: Mitarbeiter Gottes / Mitarbeiter zusammen mit Gott
  rationale: Die Hauptfassung betont im Kontext, dass Paulus und Apollos Gott gehören und in seinem Dienst stehen, ohne sie Gott gleichzuordnen. Da der griechische Genitiv auch als Zusammenarbeit mit Gott verstanden werden kann, bleibt diese echte Mehrdeutigkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ackerfeld“ macht das landwirtschaftliche Bild deutlicher als das allgemeinere „Feld“; „Bauwerk“ leitet natürlich zum folgenden Bau-Bild über. Der Fußnotenmarker steht am Versende, weil die Fußnote die Deutung des ersten Satzglieds betrifft, zugleich aber den ganzen Satz zur Verdeutlichung wiedergibt.
