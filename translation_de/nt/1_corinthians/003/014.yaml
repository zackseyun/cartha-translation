id: 1CO.3.14
reference: 1 Corinthians 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: de
  text: Wenn das Werk, das jemand darauf gebaut hat, bestehen bleibt[a], wird er Lohn[b] empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „standhält“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Belohnung“ oder „Vergeltung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Wenn
  rationale: Leitet einen einfachen Bedingungssatz ein; „wenn“ gibt dies im Deutschen unmittelbar wieder.
- source_word: τινος τὸ ἔργον
  choice: das Werk, das jemand
  rationale: Die Genitivverbindung bedeutet wörtlich „jemandes Werk“. Die Umformung mit Relativsatz ist natürliches Deutsch und bewahrt den unbestimmten Personenbezug.
- source_word: ἔργον
  choice: Werk
  rationale: „Werk“ passt zur Baumetapher und bleibt zugleich offen genug, um weder Handlung noch Dienstleistung zu eng festzulegen.
- source_word: μενεῖ
  choice: bestehen bleibt
  rationale: Das Futur von μένω bezeichnet hier das Fortbestehen nach der Prüfung; „bestehen bleibt“ ist idiomatisch und bewahrt die Aussage, ohne das Bild ausdrücklich zu „überleben“ zuzuspitzen.
- source_word: ὃ ἐποικοδόμησεν
  choice: das jemand darauf gebaut hat
  rationale: Das Relativpronomen bezieht sich auf „Werk“. „Darauf gebaut“ gibt die im Kompositum ἐποικοδομέω enthaltene Vorstellung des Bauens auf einer Grundlage wieder; „darauf“ nimmt den im Kontext genannten Grund auf, ohne ihn erneut auszuschreiben.
- source_word: μισθὸν
  choice: Lohn
  rationale: „Lohn“ gibt den Gedanken einer für Arbeit gewährten Vergeltung direkt wieder und kann im Deutschen sowohl Entlohnung als auch Belohnung bezeichnen.
- source_word: λήμψεται
  choice: wird er … empfangen
  rationale: Gibt das Futur von λαμβάνω präzise und in einem würdigen, geläufigen Register wieder; das Pronomen nimmt „jemand“ auf.
theological_decisions:
- issue: Art der zugesagten Vergeltung
  choice: Lohn
  alternative: Belohnung
  rationale: Der griechische Ausdruck μισθός bezeichnet eine Vergeltung bzw. Entlohnung, legt deren genaue Art aber nicht fest. „Lohn“ bewahrt diese Offenheit, ohne eine besondere Heils- oder Verdienstlehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht den unbestimmten Personenbezug natürlich und erhält zugleich die Baumetapher sowie die Spannung zwischen Fortbestand des Werkes und anschließendem Lohn.
