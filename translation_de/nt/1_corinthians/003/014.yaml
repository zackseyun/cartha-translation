review_pass:
  verdict: approve
  source_fidelity: Der Bedingungssatz, der unbestimmte Personenbezug, das auf einer Grundlage errichtete Werk, dessen Fortbestand, und die künftige Zuerkennung von μισθός sind vollständig und ohne sachliche Zusatzannahmen wiedergegeben. „Darauf“ macht die in ἐποικοδόμησεν enthaltene Bezugnahme auf den im Kontext genannten Grund sichtbar, ohne ihn unnötig zu wiederholen.
  naturalness: „Wenn das Werk, das jemand darauf gebaut hat, bestehen bleibt, wird er Lohn empfangen“ ist klares, modernes und zugleich dem Briefregister angemessenes Standarddeutsch. Die Satzführung ist natürlich und eindeutig.
  terminology: „Werk“ bewahrt die Bau-Metapher und die semantische Offenheit von ἔργον. „Lohn“ gibt μισθός angemessen wieder, ohne dessen genaue Art theologisch zu bestimmen. Die Alternativen „standhält“ und „Belohnung“ sind tragfähig; „Vergeltung“ ist als weitere lexikalische Möglichkeit vertretbar, auch wenn es im Deutschen häufiger einen retributiven Beiklang haben kann.
