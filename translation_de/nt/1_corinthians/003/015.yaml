  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: de
  text: Wenn das Werk eines Menschen verbrennt, wird er Verlust erleiden; er selbst aber wird gerettet werden, doch wie durch Feuer hindurch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch nur wie durch Feuer hindurch“; oder: „doch wie jemand, der durch Feuer hindurch entkommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Wenn jemandes
  rationale: Die einfache Bedingung und der unbestimmte Genitiv werden knapp und natürlich wiedergegeben.
- source_word: τὸ ἔργον
  choice: Werk
  rationale: „Werk“ bewahrt den weiten Sinn und den Bezug auf das im Kontext errichtete Arbeitsergebnis.
- source_word: κατακαήσεται
  choice: verbrennt
  rationale: Das Verb bezeichnet ein Verbrennen bis zur Zerstörung; im Deutschen bringt „verbrennt“ dies hier natürlich zum Ausdruck, ohne die Metapher auszudeuten.
- source_word: ζημιωθήσεται
  choice: wird er Verlust erleiden
  rationale: Die Formulierung gibt den Verlust beziehungsweise die Einbuße wieder, ohne eine bestimmte Strafe oder ausdrücklich einen Lohnverlust einzutragen.
- source_word: αὐτὸς δὲ σωθήσεται
  choice: er selbst aber wird gerettet werden
  rationale: „Er selbst“ wahrt die Betonung von αὐτός und den Gegensatz zwischen dem untergehenden Werk und der Rettung der Person.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: doch so wie durch Feuer
  rationale: Die knappe, bildhafte Wendung bleibt erhalten, ohne festzulegen, ob ausschließlich ein knappes Entkommen oder eine andere Nuance gemeint ist.
theological_decisions:
- issue: Ob die Schlusswendung zugunsten einer bestimmten Lehre oder als bloßes knappes Entkommen ausgedeutet werden soll.
  choice: doch so wie durch Feuer
  alternative: doch nur wie durch Feuer; doch wie jemand, der durchs Feuer entkommt
  rationale: Der griechische Text entfaltet das Bild nicht näher. Die Übersetzung bewahrt deshalb seine theologische Spannung und legt weder eine reinigende Wirkung noch ausschließlich ein knappes Entkommen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt mit „er selbst aber“ den Kontrast des griechischen Textes hervor; die Feuer-Metapher bleibt bewusst knapp und mehrdeutig.
