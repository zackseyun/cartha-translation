review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Kondition, den Kontrast zwischen Werkverlust und Rettung der Person sowie die bildhafte Offenheit der Schlusswendung grundsätzlich treffend wieder. Die Schlussformel sollte jedoch idiomatischer und genauer als „wie durch Feuer hindurch“ formuliert werden; dies entspricht ὡς διὰ πυρός besser als „so wie durch Feuer“.
  naturalness: „Jemandes Werk“ ist verständlich, wirkt im modernen Standarddeutsch aber leicht steif. „Das Werk eines Menschen“ ist flüssiger. Die Wendung „so wie durch Feuer“ ist ohne „hindurch“ weniger natürlich und kann unnötig wie ein bloßer Vergleich klingen.
  terminology: „Werk“, „Verlust erleiden“ und „gerettet werden“ sind sachgerecht. „Er selbst aber“ bewahrt die Betonung von αὐτός und den adversativen Übergang δέ. Die Feuerformel darf nicht als Läuterungslehre oder bloßes Entkommen festgelegt werden.
  issues:
  - severity: medium
    issue: Die Schlusswendung „doch so wie durch Feuer“ ist sprachlich und semantisch unpräzise.
    rationale: Ὡς διὰ πυρός bezeichnet bildhaft Rettung „wie durch Feuer hindurch“. „Durch Feuer hindurch“ macht die räumlich-bildhafte Konstruktion im Deutschen verständlich, ohne ihre umstrittene nähere Deutung festzulegen.
  - severity: low
    issue: „Jemandes Werk“ wirkt leicht gehoben bzw. steif.
    rationale: „Das Werk eines Menschen“ gibt den unbestimmten Genitiv τινος idiomatischer wieder und erhält die allgemeine Aussage.
  revised_text: Wenn das Werk eines Menschen verbrennt, wird er Verlust erleiden; er selbst aber wird gerettet werden, doch wie durch Feuer hindurch.[a]
