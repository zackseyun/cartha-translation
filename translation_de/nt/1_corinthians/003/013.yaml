reference: 1 Corinthians 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: de
  text: Das Werk eines jeden wird offenbar werden; denn der Tag[a] wird es ans Licht bringen, weil er im Feuer[b] offenbart wird. Und das Feuer selbst wird prüfen, welcher Art das Werk eines jeden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „der Tag“ ist wahrscheinlich der künftige Tag der göttlichen Prüfung oder des Gerichts gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „durch Feuer“. Die griechische Wendung kann „im Feuer“ oder im instrumentalen Sinn „durch Feuer“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: eines jeden
  rationale: Der distributive Genitiv im Singular betont die individuelle Zuordnung und lässt sich im würdigen modernen Deutsch knapp mit „eines jeden“ wiedergeben.
- source_word: τὸ ἔργον
  choice: das Werk
  rationale: „Werk“ bezeichnet hier umfassend das Ergebnis beziehungsweise die Beschaffenheit des jeweiligen Bauens und bleibt näher am griechischen Ausdruck als eine einengende Umschreibung.
- source_word: φανερὸν γενήσεται
  choice: wird offenbar werden
  rationale: Die Wendung bewahrt sowohl den zukünftigen Eintritt als auch den Gedanken des Sichtbar- oder Erkennbarwerdens.
- source_word: ἡ ἡμέρα
  choice: der Tag
  rationale: Der bestimmte Artikel und der Zusammenhang weisen auf den künftigen Tag göttlicher Prüfung; im Deutschen genügt die bestimmte Formulierung, ohne durch Großschreibung eine zusätzliche typografische Deutung einzutragen.
- source_word: δηλώσει
  choice: wird es ans Licht bringen
  rationale: Die idiomatische Formulierung gibt das Offenlegen oder Klarmachen natürlich wieder und unterscheidet das Verb sprachlich vom folgenden ἀποκαλύπτεται.
- source_word: ἐν πυρὶ
  choice: im Feuer
  rationale: Die örtliche beziehungsweise sphärische Wiedergabe wahrt die Form des griechischen Ausdrucks; die ebenfalls mögliche instrumentale Bedeutung „durch Feuer“ wird in einer Fußnote festgehalten.
- source_word: ἀποκαλύπτεται
  choice: offenbart wird
  rationale: Die passive Form und der Gedanke des Enthüllens bleiben erhalten; das Subjekt ist aufgrund des unmittelbar vorausgehenden „der Tag“ im Deutschen mit „er“ aufgenommen.
- source_word: ὁποῖόν ἐστιν
  choice: welcher Art … ist
  rationale: Die Wendung fragt nach Art beziehungsweise Qualität des Werkes, nicht bloß nach seinem Vorhandensein.
- source_word: τὸ πῦρ αὐτὸ
  choice: das Feuer selbst
  rationale: „Selbst“ bewahrt die Hervorhebung durch αὐτό.
- source_word: δοκιμάσει
  choice: wird prüfen
  rationale: Das Verb bezeichnet eine Prüfung, durch die Beschaffenheit oder Bewährung festgestellt wird.
theological_decisions:
- issue: Bezug von ἡ ἡμέρα
  choice: „der Tag“ als bestimmter künftiger Tag göttlicher Offenlegung und Prüfung
  alternative: ein gewöhnlicher oder unbestimmter Tag
  rationale: Der Zusammenhang mit der endgültigen Prüfung des Werkes legt den eschatologischen Bezug nahe; die Übersetzung lässt ihn durch den bestimmten Artikel erkennen, ohne eine ausführende Deutung in den Haupttext einzubauen.
- issue: Bedeutung von ἐν πυρί
  choice: „im Feuer“
  alternative: „durch Feuer“
  rationale: Die griechische Präpositionalphrase kann örtlich/sphärisch oder instrumental verstanden werden. Der Haupttext folgt der formal unmittelbaren Wiedergabe, während die echte Mehrdeutigkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am argumentativen Aufbau des Griechischen, wird jedoch durch zwei Hauptsätze lesbar gegliedert. Die Fußnotenmarker stehen unmittelbar bei den erklärungsbedürftigen Ausdrücken.
