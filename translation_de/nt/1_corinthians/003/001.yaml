- from: Auch ich, Brüder und Schwestern[a], konnte zu euch nicht wie zu geistlichen Menschen reden, sondern nur wie zu Menschen aus Fleisch, wie zu Unmündigen in Christus.
  to: Auch ich, Brüder und Schwestern[a], konnte nicht zu euch reden wie zu geistlichen Menschen, sondern wie zu Menschen aus Fleisch, wie zu Säuglingen im Messias.
  rationale: Die Revision entfernt die nicht im Ausgangstext ausgedrückte Einschränkung „nur“, gibt νηπίοις bild- und lexemnah als „Säuglingen“ wieder und übernimmt für Χριστός die im Audit trail festgelegte Titelform „Messias“. Die inklusive Anrede bleibt mit transparent machender Fußnote erhalten.
