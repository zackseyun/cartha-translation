source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: de
  text: Auch ich, Brüder und Schwestern[a], konnte nicht zu euch reden wie zu geistlichen Menschen, sondern wie zu Menschen aus Fleisch, wie zu Säuglingen im Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“; im Zusammenhang ist die ganze Gemeinde angesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: Auch ich
  rationale: Bewahrt sowohl die verbindende Kraft von καί als auch das ausdrücklich gesetzte ἐγώ und klingt im Deutschen natürlich.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die griechische maskuline Pluralform bezeichnet hier die angesprochene Gemeinde insgesamt; die inklusive Wiedergabe macht diesen kommunikativen Umfang im heutigen Deutsch deutlich, während die Fußnote die Form des Ausgangstextes nennt.
- source_word: οὐκ ἠδυνήθην
  choice: konnte … nicht
  rationale: Gibt die im Aorist ausgedrückte Unfähigkeit knapp und idiomatisch wieder.
- source_word: λαλῆσαι ὑμῖν
  choice: zu euch … reden
  rationale: Eine natürliche und quellennah bleibende Wiedergabe von Infinitiv und Dativobjekt.
- source_word: πνευματικοῖς
  choice: geistlichen Menschen
  rationale: Das substantivisch gebrauchte Adjektiv wird im Deutschen durch „Menschen“ verdeutlicht, ohne näher festzulegen, worin ihre Geistlichkeit besteht.
- source_word: σαρκίνοις
  choice: Menschen aus Fleisch
  rationale: Bewahrt den ausdrücklichen Bezug auf σάρξ und vermeidet stärker wertende Deutungen wie „weltlich“ oder „sündig“; zugleich bleibt die mögliche Bedeutung von menschlicher Schwachheit beziehungsweise Unreife offen.
- source_word: νηπίοις
  choice: Unmündigen
  rationale: Erhält die Metapher fehlender Reife in würdigem, verständlichem Deutsch; „Säuglinge“ wäre körperlich konkreter, im übertragenen Gebrauch aber weniger natürlich.
- source_word: ἐν Χριστῷ
  choice: in Christus
  rationale: Die feste paulinische Wendung wird im Deutschen idiomatisch und traditionsübergreifend als „in Christus“ wiedergegeben; der Titelursprung bleibt in „Christus“ erkennbar.
theological_decisions:
- issue: Bedeutung von σαρκίνοις im Gegensatz zu πνευματικοῖς
  choice: Menschen aus Fleisch
  alternative: fleischlichen Menschen; weltlichen Menschen
  rationale: Die gewählte Form bewahrt das konkrete Bild und die theologische Spannung, ohne den Ausdruck vorschnell ausschließlich moralisch zu deuten.
- issue: Wiedergabe von ἐν Χριστῷ
  choice: in Christus
  alternative: im Messias
  rationale: In der paulinischen Formel fungiert Χριστός hier im Deutschen natürlich als „Christus“. „Im Messias“ würde den Titelcharakter stärker hervorheben, klingt in dieser festen Wendung jedoch weniger idiomatisch.
- issue: Metapher von νηπίοις
  choice: Unmündigen
  alternative: Säuglingen; kleinen Kindern
  rationale: „Unmündige“ hebt die im Kontext entscheidende geistliche Unreife hervor, ohne das Bild in eine bestimmte Altersstufe zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem griechischen Gegensatz zwischen „geistlich“ und „aus Fleisch“ eng verbunden, ist aber idiomatisch geglättet. „Nur“ verdeutlicht die mit ἀλλά gesetzte Beschränkung, ohne eine zusätzliche theologische Aussage einzuführen.
