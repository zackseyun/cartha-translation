review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Kontraste des griechischen Satzes sind zutreffend wiedergegeben. Allerdings fügt „nur“ eine im griechischen ἀλλά nicht ausdrücklich enthaltene Einschränkung hinzu. „Unmündigen“ gibt die Metapher von νηπίοις eher abstrakt bzw. rechtssprachlich wieder und sollte durch die konkrete Säuglingsmetapher ersetzt werden. Für ἐν Χριστῷ wahrt „im Messias“ zudem die im englischen Audit festgehaltene Titelfunktion von Χριστός.
  naturalness: Der Satz ist nach Umstellung von „konnte ... nicht“ flüssig und modernes Standarddeutsch. „Säuglingen im Messias“ ist in diesem würdevollen paulinischen Bildfeld natürlich genug und genauer als „Unmündigen“.
  terminology: „Geistlichen Menschen“ und „Menschen aus Fleisch“ erhalten den Gegensatz πνευματικοῖς/σαρκίνοις ohne moralisierende Zuspitzung. „Messias“ entspricht der projektspezifischen Entscheidung, Χριστός bei erkennbarer Titelfunktion als „Messiah/Messias“ wiederzugeben.
  issues:
  - severity: medium
    issue: Zusatz „nur“
    rationale: ἀλλά markiert den Gegensatz „sondern“, enthält aber kein eigenes Äquivalent für „nur“. Der Zusatz verengt die Aussage leicht und ist daher zu streichen.
  - severity: medium
    issue: „Unmündigen“ für νηπίοις
    rationale: νηπίοις bezeichnet konkret Säuglinge bzw. sehr kleine Kinder. „Unmündige“ abstrahiert die Metapher und kann im heutigen Deutsch rechtlich konnotiert sein.
  - severity: medium
    issue: „Christus“ statt „Messias“
    rationale: Der englische POB-Audit trail entscheidet hier ausdrücklich für die Wiedergabe der Titelfunktion als „Messiah“. Die deutsche Fassung sollte diese Schlüsselterminologie als „Messias“ nachvollziehen.
  revised_text: Auch ich, Brüder und Schwestern[a], konnte nicht zu euch reden wie zu geistlichen Menschen, sondern wie zu Menschen aus Fleisch, wie zu Säuglingen im Messias.
