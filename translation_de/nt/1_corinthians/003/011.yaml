id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: de
  text: 'Denn niemand kann ein anderes Fundament legen als das, das bereits gelegt ist: Jesus, der Messias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“.'
    reason: Alternative traditionelle Wiedergabe von Ἰησοῦς Χριστός.
lexical_decisions:
- source_word: θεμέλιον
  choice: Fundament
  rationale: Das Substantiv bezeichnet im fortlaufenden Bild vom Bauen die tragende Grundlage; „Fundament“ ist im modernen Deutschen anschaulich und idiomatisch.
- source_word: γὰρ
  choice: denn
  rationale: Die Partikel begründet die vorausgehende Aussage und wird mit der entsprechenden deutschen Begründungskonjunktion wiedergegeben.
- source_word: ἄλλον
  choice: ein anderes
  rationale: Die Form bezeichnet hier ein zusätzliches beziehungsweise davon verschiedenes Fundament.
- source_word: οὐδεὶς δύναται θεῖναι
  choice: niemand kann … legen
  rationale: Die Wendung gibt sowohl die umfassende Verneinung als auch das im Baukontext übliche Verb „ein Fundament legen“ knapp und natürlich wieder.
- source_word: παρὰ τὸν κείμενον
  choice: als das, das bereits gelegt ist
  rationale: παρά hat hier ausschließende Bedeutung; das Partizip beschreibt das Fundament als schon vorhanden. „Bereits“ verdeutlicht diesen resultativen Zustand, ohne zusätzliche Aussage einzutragen.
- source_word: ὅς ἐστιν Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  rationale: Der Doppelpunkt gibt die Identifikation des Fundaments klar wieder. Χριστός wird als bedeutungsvoller Titel mit „der Messias“ übersetzt; „Jesus Christus“ bleibt als traditionelle Wiedergabe in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von Χριστός in Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  alternative: Jesus Christus
  rationale: Χριστός bezeichnet Jesus hier mit seinem messianischen Titel. Die Übersetzung macht dessen Bedeutung sichtbar, ohne die traditionelle Namensform auszuschließen.
- issue: Identifikation des Fundaments mit Jesus
  choice: Wiedergabe durch einen Doppelpunkt
  alternative: „welches Jesus, der Messias, ist“
  rationale: Der Doppelpunkt bewahrt die ausdrückliche Identifikation, vermeidet aber im Deutschen einen schwerfälligen Relativsatz und löst die theologische Aussage nicht weiter auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bau-Metapher bleibt durch „Fundament“ und „legen“ erhalten; die Satzstruktur ist klar und für eine öffentliche Lesung geeignet.
