lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Argumentation knapp und natürlich.
- source_word: μηδεὶς καυχάσθω
  choice: soll sich niemand … rühmen
  rationale: Gibt den allgemeinen verneinten Imperativ in würdigem, heutigem Deutsch wieder.
- source_word: ἐν ἀνθρώποις
  choice: mit Menschen
  rationale: Bei καυχάομαι bezeichnet ἐν den Gegenstand oder Bezug des Rühmens. „Mit Menschen rühmen“ ist im Deutschen idiomatischer als „in Menschen rühmen“, ohne die kontextuelle Zuspitzung auf menschliche Leiter in den Haupttext einzutragen.
- source_word: πάντα
  choice: alles
  rationale: Bewahrt den umfassenden Sinn des substantivierten Neutrums in natürlichem Deutsch.
- source_word: γὰρ
  choice: denn
  rationale: Leitet die Begründung für das Verbot ein.
- source_word: ὑμῶν ἐστιν
  choice: gehört euch
  rationale: Drückt den possessiven Genitiv klar und idiomatisch aus.
theological_decisions:
- issue: Bezug von ἀνθρώποις im Zusammenhang der Parteiungen um Paulus, Apollos und Kephas
  choice: Im Haupttext allgemein „Menschen“
  alternative: „menschlichen Leitern“
  rationale: Der Kontext legt insbesondere menschliche Leiter nahe, doch der griechische Ausdruck selbst bleibt allgemeiner. Diese Spannung wird durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdiger Syntax. Das generische ἀνθρώποις wird geschlechtsneutral als „Menschen“ wiedergegeben; die kontextuell engere Deutung steht in der Fußnote.
