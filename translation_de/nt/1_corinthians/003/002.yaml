id: 1CO.3.2
reference: 1 Corinthians 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: de
  text: Ich gab euch Milch zu trinken, keine feste Nahrung[a], denn ihr wart noch nicht dazu imstande. Aber selbst jetzt seid ihr noch nicht dazu imstande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nahrung“ oder „Speise“; „feste Nahrung“ verdeutlicht hier den Gegensatz zur Milch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: Milch
  rationale: Die direkte Entsprechung bewahrt das Bild und den Gegensatz zu gehaltvollerer Nahrung.
- source_word: ἐπότισα
  choice: gab … zu trinken
  rationale: Das Verb bezeichnet das Geben von etwas zu trinken. Diese Formulierung ist im Deutschen natürlich und gibt das griechische Bild genauer wieder als das allgemeinere „ernährte“.
- source_word: βρῶμα
  choice: feste Nahrung
  rationale: Das Wort bedeutet allgemein „Nahrung“ oder „Speise“. Im ausdrücklichen Gegensatz zu Milch macht „feste Nahrung“ den gemeinten Kontrast im modernen Deutschen klar; die allgemeinere Grundbedeutung wird in der Fußnote genannt.
- source_word: οὔπω γὰρ ἐδύνασθε
  choice: denn ihr wart noch nicht dazu imstande
  rationale: Die Formulierung gibt die damals noch fehlende Fähigkeit wieder, ohne über den Gegenstand dieser Fähigkeit hinauszugehen.
- source_word: ἀλλ’ οὐδὲ ἔτι νῦν δύνασθε
  choice: Aber selbst jetzt seid ihr noch nicht dazu imstande
  rationale: „Selbst jetzt“ und „noch nicht“ bringen sowohl die Hervorhebung der Gegenwart als auch das Fortbestehen der Unfähigkeit zum Ausdruck und wahren die Parallele zum vorigen Satz.
theological_decisions:
- issue: Deutung des Bildes von Milch und Nahrung
  choice: Das konkrete Bild bleibt ohne erklärende Ausdeutung stehen.
  alternative: Interpretierend von grundlegender und fortgeschrittener Lehre sprechen.
  rationale: Der griechische Text formuliert metaphorisch. Eine abstrakte Erklärung im Haupttext würde die Anwendung enger festlegen, als es dieser Vers selbst tut.
- issue: Nicht ausdrücklich genanntes Ergänzungsobjekt zu δύνασθε
  choice: Mit „dazu imstande“ auf die zuvor genannte feste Nahrung zurückverweisen, ohne ein zusätzliches Verb wie „vertragen“ oder „aufnehmen“ einzufügen.
  alternative: „Ihr konntet sie noch nicht vertragen“ oder „aufnehmen“.
  rationale: Der griechische Text lässt die konkrete Art der Fähigkeit unausgesprochen. Die gewählte Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die Wiederholung „dazu imstande“ bildet den griechischen Tempuswechsel und die rhetorische Parallelität deutlich ab.
