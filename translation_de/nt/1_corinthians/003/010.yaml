source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: de
  text: Gemäß der Gnade Gottes, die mir gegeben wurde, habe ich wie ein weiser Baumeister[a] ein Fundament gelegt; ein anderer baut darauf weiter. Jeder[b] aber soll darauf achten, wie er weiterbaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Architekt“. Das griechische Wort bezeichnet einen leitenden, fachkundigen Baumeister, der die Bauarbeiten plant oder beaufsichtigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Maskulinum im Singular ist hier allgemein und stellvertretend gebraucht: Gemeint ist jeder Mensch, der auf dem Fundament weiterbaut.'
    reason: cultural_note
lexical_decisions:
- source_word: Κατὰ
  choice: Gemäß
  rationale: Die Präposition bezeichnet hier die Übereinstimmung mit beziehungsweise das Maß der Paulus verliehenen Gnade, nicht bloß das Mittel seines Handelns.
- source_word: χάριν
  choice: Gnade
  rationale: Der etablierte paulinische Begriff bewahrt sowohl den Gedanken unverdienter göttlicher Zuwendung als auch den der dadurch verliehenen Befähigung.
- source_word: τὴν δοθεῖσάν μοι
  choice: die mir gegeben wurde
  rationale: Die Relativsatzkonstruktion gibt das Partizip im Deutschen klar und natürlich wieder und kennzeichnet die Gnade als Gabe Gottes.
- source_word: ὡς
  choice: wie
  rationale: „Wie“ lässt den vergleichenden Sinn offen und klingt in Verbindung mit der folgenden Berufsbezeichnung natürlich.
- source_word: σοφὸς ἀρχιτέκτων
  choice: weiser Baumeister
  rationale: „Baumeister“ bezeichnet im antiken Zusammenhang einen leitenden, fachkundigen Bauausführenden; „weise“ bewahrt zugleich die ethisch-theologische Färbung von σοφός.
- source_word: θεμέλιον ἔθηκα
  choice: ein Fundament gelegt
  rationale: Die indefinite Wiedergabe entspricht dem artikellosen griechischen Substantiv, und „ein Fundament legen“ ist die idiomatische deutsche Verbindung.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: ein anderer baut darauf weiter
  rationale: Das zusammengesetzte Verb bezeichnet das Weiterbauen auf einem bereits gelegten Fundament. „Darauf“ macht den im Griechischen impliziten Bezug deutlich.
- source_word: ἕκαστος δὲ βλεπέτω
  choice: Jeder aber soll darauf achten
  rationale: „Jeder“ gibt den distributiven, allgemein geltenden Sinn wieder; „soll darauf achten“ vermittelt die warnende Kraft des Imperativs in natürlichem Deutsch.
- source_word: πῶς ἐποικοδομεῖ
  choice: wie er weiterbaut
  rationale: Die Wiederholung von „weiterbaut“ spiegelt das griechische Verb, während der bereits eindeutige Bezug auf das Fundament nicht nochmals ausdrücklich genannt werden muss.
theological_decisions:
- issue: Göttliche Gnade als Grundlage von Paulus’ Bauarbeit
  choice: „Gemäß der Gnade Gottes, die mir gegeben wurde“
  alternative: „Durch die Gnade Gottes“
  rationale: „Gemäß“ bewahrt den möglichen Gedanken von Maß beziehungsweise Entsprechung und legt die Formulierung nicht einseitig auf reine Instrumentalität fest.
- issue: Allgemeine Reichweite des maskulinen Singulars ἕκαστος
  choice: „Jeder … wie er weiterbaut“ mit erläuternder Fußnote
  alternative: „Jede und jeder … wie sie oder er weiterbaut“
  rationale: Die knappe Singularform entspricht der griechischen Konstruktion und ist im Deutschen generisch verständlich; die Fußnote stellt ausdrücklich klar, dass die Mahnung nicht auf Männer beschränkt ist.
- issue: Bild des leitenden Baukundigen
  choice: „Baumeister“
  alternative: „Architekt“
  rationale: Der antike ἀρχιτέκτων konnte Planung, Leitung und Ausführung umfassen. „Baumeister“ vermeidet die moderne Verengung auf reine Planung, ohne eine besondere kirchliche Amtslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das durchgehende Bau-Bild bleibt erhalten; „weiterbauen“ verdeutlicht knapp den Bezug auf das bereits gelegte Fundament. Die Wortstellung mit „aber“ bewahrt den Kontrast des griechischen δέ, ohne altertümlich zu wirken.
