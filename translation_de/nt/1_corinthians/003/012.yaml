  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: de
  text: Wenn aber jemand auf das Fundament Gold, Silber, kostbare Steine, Holz, Heu, Stroh baut,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ
  choice: wenn aber
  rationale: εἰ leitet die Bedingung ein; δέ führt den Gedankengang leicht weiter und wird im Deutschen natürlich mit „aber“ wiedergegeben, ohne einen starken Gegensatz zu erzwingen.
- source_word: τις
  choice: jemand
  rationale: Das unbestimmte Singularpronomen hat allgemeinen, offenen Bezug; „jemand“ ist die natürliche deutsche Entsprechung.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: auf das Fundament … baut
  rationale: Die Formulierung bewahrt das Bild des Weiterbauens auf einem bereits gelegten Fundament; die deutsche Wortstellung bindet die Baustoffliste natürlich ein.
- source_word: χρυσόν, ἄργυρον
  choice: Gold, Silber
  rationale: Direkte Bezeichnungen der Materialien.
- source_word: λίθους τιμίους
  choice: kostbare Steine
  rationale: τιμίους bezeichnet wertvolle oder kostbare Steine; „kostbare Steine“ wahrt den möglichen Bezug auf hochwertige Baumaterialien, ohne die Bedeutung auf Edelsteine zu verengen.
- source_word: ξύλα
  choice: Holz
  rationale: Im Deutschen steht für den Baustoff idiomatisch der Kollektivbegriff „Holz“.
- source_word: χόρτον
  choice: Heu
  rationale: Im Gegensatz der Baumaterialien bezeichnet „Heu“ natürlich trockenes pflanzliches Material und passt zum Bild leicht brennbarer Stoffe.
- source_word: καλάμην
  choice: Stroh
  rationale: Im Zusammenhang der Baustoffliste ist „Stroh“ die verständlichste Wiedergabe; mögliche Grundbedeutungen wie Halm, Schilf oder Stoppel werden hier kontextuell eingegrenzt.
