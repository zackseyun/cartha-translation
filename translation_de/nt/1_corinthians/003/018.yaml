  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: de
  text: Niemand soll sich selbst täuschen. Wenn jemand unter euch meint, in diesem Zeitalter[a] weise zu sein, soll er töricht werden[b], damit er weise wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den Maßstäben dieses Zeitalters weise zu sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Narren werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Niemand soll sich selbst täuschen
  rationale: Die deutsche Aufforderungsform gibt das verneinte Imperativgefüge natürlich wieder; das ausdrückliche Reflexivpronomen bleibt erhalten.
- source_word: δοκεῖ
  choice: meint
  rationale: Im Zusammenhang bezeichnet das Verb die eigene Einschätzung; „meint“ ist im Deutschen natürlicher und treffender als „scheint“.
- source_word: σοφὸς
  choice: weise
  rationale: Die übliche Wiedergabe bewahrt das für den Abschnitt zentrale Bedeutungsfeld der Weisheit.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Dies bezeichnet idiomatisch die Zugehörigkeit zur angesprochenen Gemeinschaft.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: in diesem Zeitalter
  rationale: „Zeitalter“ erhält die zeitlich-theologische Nuance von αἰών und den Gegensatz zwischen gegenwärtiger Weisheit und Gottes Weisheit.
- source_word: μωρὸς γενέσθω
  choice: soll er töricht werden
  rationale: Die Formulierung bewahrt den Aufforderungscharakter und die paradoxe Aussage; das prädikative Adjektiv wird nicht unnötig zu einer festen Personenbezeichnung gemacht.
- source_word: ἵνα γένηται σοφός
  choice: damit er weise wird
  rationale: Die Zweckangabe mit ἵνα und das Wortspiel mit „werden“ bleiben knapp und klar erhalten.
theological_decisions:
- issue: Bedeutung von αἰών im paulinischen Gegensatz
  choice: „Zeitalter“
  alternative: „Welt“ oder „nach den Maßstäben dieses Zeitalters“
  rationale: „Zeitalter“ bewahrt die eschatologisch-zeitliche Dimension. Zugleich lässt der griechische Ausdruck kontextuell auch eine Beziehung zu den Maßstäben dieses Zeitalters erkennen, die in einer Fußnote genannt wird.
- issue: Paradox des Törichtwerdens
  choice: „töricht werden“
  alternative: „zum Narren werden“
  rationale: Die adjektivische Wiedergabe folgt der griechischen Prädikatsform und vermeidet eine stärkere Identitätsbezeichnung, ohne die theologische Spannung zwischen menschlicher Torheit und wahrer Weisheit aufzulösen.
- issue: Generisches Maskulinum
  choice: „jemand … er“
  alternative: Geschlechtsneutrale Umformung, etwa „wer … diese Person“
  rationale: Die grammatisch maskuline Singularform mit allgemeiner, repräsentativer Bedeutung wird im Deutschen klar und quellentreu wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Satzführung. Der Vers bewahrt die knappe Warnung und das bewusste Paradox des griechischen Textes.
