  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: de
  text: Wisst ihr nicht, dass ihr Gottes Tempel[a][b] seid und dass Gottes Geist in euch[c] wohnt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottes Heiligtum“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr“ steht im Plural; Paulus spricht die Gemeinde als Gemeinschaft an.
    reason: cultural_note
  - marker: c
    text: 'Oder: „unter euch“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Wisst ihr nicht
  rationale: Bewahrt die rhetorische Frage des griechischen Textes in natürlichem, würdigem Deutsch.
- source_word: ναὸς θεοῦ
  choice: Gottes Tempel
  rationale: ναός bezeichnet den Tempel beziehungsweise das eigentliche Heiligtum, nicht allgemein den gesamten Tempelbezirk. „Gottes Tempel“ ist klar und erhält das Bild eines heiligen Wohnortes.
- source_word: ἐστε
  choice: ihr seid
  rationale: Die zweite Person Plural wird ausdrücklich wiedergegeben; Paulus spricht die Gemeinde an.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Gottes Geist
  rationale: Die deutsche Genitivverbindung gibt die Zugehörigkeitsbeziehung knapp und natürlich wieder.
- source_word: οἰκεῖ
  choice: wohnt
  rationale: Das Präsens von οἰκέω bezeichnet bleibendes Wohnen und passt zum Tempelbild.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Gibt die Präposition unmittelbar wieder, ohne die mögliche gemeinschaftliche Bedeutung des pluralischen „euch“ auszuschließen.
theological_decisions:
- issue: Bezieht sich das Tempelbild vor allem auf einzelne Gläubige oder gemeinschaftlich auf die Gemeinde?
  choice: Der Haupttext verwendet das pluralische „ihr“, ohne einen Zusatz wie „gemeinsam“ einzufügen; eine Fußnote macht den gemeinschaftlichen Kontext sichtbar.
  alternative: „Ihr alle zusammen seid Gottes Tempel“ oder individualisierend „Jeder von euch ist Gottes Tempel“.
  rationale: Die griechische Anrede ist pluralisch und im Zusammenhang auf die korinthische Gemeinde bezogen. Da jedoch kein ausdrückliches Wort für „gemeinsam“ steht, wird die Aussage weder verstärkt noch individualisiert.
- issue: Räumliche Bedeutung von ἐν ὑμῖν
  choice: „in euch“ im Haupttext
  alternative: „unter euch“
  rationale: ἐν mit dem Plural kann hier sowohl das Innewohnen in der angesprochenen Gemeinschaft als auch die Gegenwart unter ihr ausdrücken. Der Haupttext bleibt nah an der Formulierung; die Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Ton. Die rhetorische Frage und das Tempelbild bleiben erhalten; die gemeinschaftliche Dimension wird erläutert, ohne sie durch einen nicht ausdrücklich vorhandenen Zusatz in den Haupttext einzutragen.
