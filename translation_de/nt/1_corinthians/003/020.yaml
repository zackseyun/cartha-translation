id: 1CO.3.20
reference: 1 Corinthians 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: de
  text: 'Und weiter: »Der Herr kennt die Überlegungen der Weisen; er weiß, dass sie nichtig sind.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat aus Psalm 94,11 (in der Septuaginta Psalm 93,11). Für »Überlegungen« ist auch »Gedanken« oder »Vernunftschlüsse« möglich; für »nichtig« auch »vergeblich« oder »leer«.
    reason: cross_reference_and_lexical_alternatives
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Und weiter
  rationale: Leitet ein zweites Schriftzitat als weiteren Beleg ein; im modernen Deutsch klingt dies natürlicher als „Und wiederum“.
- source_word: Κύριος
  choice: der Herr
  rationale: Die übliche und kontextgemäße Wiedergabe von κύριος; der bestimmte Artikel entspricht natürlichem Deutsch.
- source_word: γινώσκει
  choice: kennt
  rationale: Gibt das schlichte und direkte γινώσκει wieder; zusammen mit dem Akkusativ bezeichnet es Gottes Kenntnis der Überlegungen.
- source_word: διαλογισμοὺς
  choice: Überlegungen
  rationale: Erfasst hier die gedanklichen Erwägungen oder Vernunftschlüsse und ist im Deutschen natürlicher als „Gedankenführungen“.
- source_word: τῶν σοφῶν
  choice: der Weisen
  rationale: Gibt das substantivierte Adjektiv geschlechtsübergreifend und im Zusammenhang mit der Weisheitsthematik des Abschnitts wieder.
- source_word: ὅτι
  choice: er weiß, dass
  rationale: Kennzeichnet den Inhalt dessen, was der Herr weiß. Die Wiederaufnahme mit „er weiß“ macht die griechische Konstruktion im Deutschen klar, ohne ihren Sinn zu verändern.
- source_word: μάταιοι
  choice: nichtig
  rationale: Bezeichnet etwas Leeres, Wertloses oder Zweckloses; „nichtig“ bewahrt den gehobenen Schriftton und die inhaltliche Breite.
theological_decisions:
- issue: Bezug und Funktion von ὅτι
  choice: 'Inhaltssatz: „er weiß, dass sie nichtig sind“'
  alternative: 'Kausalsatz: „weil sie nichtig sind“'
  rationale: 'ὅτι erläutert am natürlichsten den Inhalt der göttlichen Erkenntnis: Der Herr kennt die Überlegungen und weiß um ihre Nichtigkeit. Die kausale Lesart ist grammatisch möglich, im Zitatkontext jedoch weniger wahrscheinlich.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und weiter“ markiert knapp den zweiten Schriftbeleg. „Nichtig“ hält die Aussage pointiert und bewahrt zugleich die Bedeutungsbreite von μάταιοι.
