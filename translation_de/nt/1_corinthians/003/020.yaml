  source_fidelity: 'Der Entwurf gibt die Struktur und Aussage des griechischen Textes zuverlässig wieder: πάλιν leitet einen weiteren Schriftbeleg ein, κύριος ist angemessen mit »der Herr« wiedergegeben, und »kennt die Überlegungen der Weisen; er weiß, dass sie nichtig sind« vermittelt den Inhaltscharakter von ὅτι. Die explizite Wiederaufnahme »er weiß« ist eine natürliche deutsche Entfaltung, keine Sinnaddition.'
  naturalness: Modernes, würdiges Standarddeutsch. »Und weiter« funktioniert als Einleitung eines weiteren Zitats; die Formulierung mit Semikolon ist klar und idiomatisch. »Überlegungen der Weisen« ist verständlich und wahrt den Bezug zur Weisheitsthematik des Kontextes.
  terminology: »Der Herr« entspricht Κύριος. »Weisen« bewahrt die substantivische und im Kontext möglicherweise ironische Bezeichnung σοφῶν. »Nichtig« deckt für μάταιοι den Bereich leer, wertlos bzw. vergeblich in angemessen gehobenem Register ab, ohne eine engere Deutung festzulegen.
