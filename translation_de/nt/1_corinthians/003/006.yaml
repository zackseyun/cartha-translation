  text: ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: de
  text: Ich pflanzte, Apollos begoss, doch Gott ließ es wachsen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch Gott bewirkte das Wachstum.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen trägt den Kontrast zwischen Paulus, Apollos und Gott; „Ich“ bewahrt ihn im Deutschen ohne unnötige Verstärkung.
- source_word: ἐφύτευσα
  choice: pflanzte
  rationale: φυτεύω bezeichnet hier das Pflanzen. Die knappe Form erhält das landwirtschaftliche Bild und den punktuellen Rückblick des Aorists.
- source_word: Ἀπολλῶς
  choice: Apollos
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: ἐπότισεν
  choice: begoss
  rationale: ποτίζω bezeichnet im Bild die Versorgung der Pflanze mit Wasser. „begoss“ ist knapp, natürlich und führt die Metapher weiter.
- source_word: ἀλλὰ
  choice: doch
  rationale: ἀλλά setzt Gottes Wirken deutlich von den menschlichen Tätigkeiten ab. „doch“ gibt diesen starken Gegensatz in natürlichem Deutsch wieder.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Gott steht als entscheidend handelndes Subjekt den menschlichen Dienern gegenüber; im Deutschen ist kein Artikel erforderlich.
- source_word: ηὔξανεν
  choice: ließ es wachsen
  rationale: Das kausativ gebrauchte αὐξάνω besagt, dass Gott das Wachstum bewirkte. Die deutsche Formulierung ist natürlich und bewahrt durch das Präteritum im Kontext den Hintergrundcharakter des griechischen Imperfekts, ohne eine überdeutliche Verlaufsangabe einzufügen.
theological_decisions:
- issue: Göttliches Wirken im Verhältnis zum menschlichen Dienst
  choice: Paulus pflanzte und Apollos begoss, doch Gott bewirkte das Wachstum.
  alternative: „Gott gab das Wachstum.“
  rationale: Die Übersetzung wahrt sowohl die wirklichen Aufgaben der menschlichen Diener als auch Gottes entscheidendes, fortdauernd gedachtes Wirken. Sie macht daraus keine weitergehende Lehrformel.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Das landwirtschaftliche Bild bleibt knapp erhalten; die parallelen Präteritumsformen vermeiden unnötige Umschreibungen.
