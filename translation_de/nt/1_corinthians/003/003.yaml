revisions:
- from: Denn ihr seid noch fleischlich. Wo nämlich Eifersucht und Streit unter euch herrschen, seid ihr da nicht fleischlich und lebt nach Menschenart?[a]
  to: Denn ihr seid noch fleischlich. Denn wo es unter euch Eifersucht und Streit gibt, seid ihr da nicht fleischlich und lebt nach Menschenart?[a]
  rationale: Die Revision entfernt die hinzugefügte Nuance von „herrschen“, spiegelt die beiden begründenden γάρ mit „Denn“ und fasst die Fußnotenalternative so, dass sie die kontextuelle Bedeutung von κατὰ ἄνθρωπον erläutert, ohne durch „rein“ weiter zuzuspitzen. Bedeutung, Register und theologische Offenheit bleiben erhalten.
  reviewer_model: gpt-5.6-terra
