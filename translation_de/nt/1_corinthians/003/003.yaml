review_pass:
  verdict: revise
  source_fidelity: Die Grundwiedergabe trifft die rhetorische Struktur, σαρκικοί („fleischlich“), ζῆλος/ἔρις („Eifersucht und Streit“) sowie die ethische Bedeutung von περιπατεῖτε gut. „Herrschen“ fügt jedoch gegenüber ἐν ὑμῖν ... [εἰσίν] eine nicht ausgedrückte Vorstellung des Vorherrschens hinzu. Die Wiederholung von γάρ sollte zudem besser als „Denn“ erkennbar bleiben.
  naturalness: Die Formulierung ist überwiegend modernes, würdiges Standarddeutsch. „Wo es unter euch Eifersucht und Streit gibt“ ist idiomatisch und näher am griechischen Aussagegehalt als „Wo ... herrschen“. „Nach Menschenart leben“ ist natürlich genug und wahrt die knappe, offene Wendung.
  terminology: „Fleischlich“ bewahrt die erkennbare paulinische Fleisch-Terminologie, ohne sie konfessionell einzuengen. „Nach Menschenart“ ist eine angemessene, nicht überdeutende Wiedergabe von κατὰ ἄνθρωπον. Die Fußnote sollte keine zusätzliche Nuance wie „rein“ setzen, die im griechischen Wortlaut nicht ausdrücklich vorhanden ist.
  issues:
  - severity: low
    issue: „herrschen“ in der zweiten Satzhälfte
    rationale: Das griechische ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ἔρις formuliert das Vorhandensein von Eifersucht und Streit, nicht deren Herrschaft oder Dominanz. „Gibt es“ hält den Umfang der Aussage offen.
  - severity: low
    issue: 'Fußnote: „rein menschlichen Maßstäben“'
    rationale: „Rein“ verstärkt die alternative Deutung. Eine Fußnote darf die idiomatische Möglichkeit zeigen, sollte aber die Aussage nicht stärker festlegen als κατὰ ἄνθρωπον.
  revised_text: Denn ihr seid noch fleischlich. Denn wo es unter euch Eifersucht und Streit gibt, seid ihr da nicht fleischlich und lebt nach Menschenart?[a]
