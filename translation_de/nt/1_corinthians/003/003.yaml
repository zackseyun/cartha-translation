source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: de
  text: Denn ihr seid noch fleischlich. Denn wo es unter euch Eifersucht und Streit gibt, seid ihr da nicht fleischlich und lebt nach Menschenart?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: und lebt auf bloß menschliche Weise?'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: noch
  rationale: Kennzeichnet den fortdauernden Zustand und bewahrt den vorwurfsvollen Ton des Paulus.
- source_word: γὰρ
  choice: denn / nämlich
  rationale: Gibt in beiden Vorkommen die begründende beziehungsweise erläuternde Funktion wieder, ohne den Gedankengang unnötig zu glätten.
- source_word: σαρκικοί
  choice: fleischlich
  rationale: Bewahrt die erkennbare Beziehung zu σάρξ („Fleisch“) und vermeidet deutende Erweiterungen wie „von der sündigen Natur beherrscht“.
- source_word: ὅπου
  choice: wo
  rationale: 'Erhält den örtlich formulierten Ausgangstext: Das Vorhandensein von Eifersucht und Streit unter den Korinthern belegt ihren Zustand.'
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Im negativen Zusammenhang mit Streit bezeichnet das Wort keine positive Leidenschaft, sondern missgünstige oder rivalisierende Eifersucht.
- source_word: ἔρις
  choice: Streit
  rationale: Gibt den allgemeinen Sinn von Zwietracht und Auseinandersetzung knapp und natürlich wieder.
- source_word: οὐχὶ
  choice: seid ihr da nicht
  rationale: Bewahrt die rhetorische Frage, die eine zustimmende Antwort erwartet; „da“ stellt im Deutschen den Folgerungsbezug natürlich her.
- source_word: κατὰ ἄνθρωπον
  choice: nach Menschenart
  rationale: Gibt die ungewöhnliche griechische Wendung mit dem generischen Singular knapp wieder und erhält den Gegensatz zu einem vom Geist geprägten Leben, ohne ihn auszudeuten.
- source_word: περιπατεῖτε
  choice: lebt
  rationale: Gibt die ethische Bedeutung der griechischen Metapher des Gehens in natürlichem modernem Deutsch wieder; ein wörtliches „wandelt“ wäre heute deutlich altertümlich.
theological_decisions:
- issue: Wiedergabe der σάρξ-Sprache in σαρκικοί
  choice: fleischlich
  alternative: weltlich; vom Fleisch bestimmt
  rationale: „Fleischlich“ hält die paulinische Fleisch-Terminologie sichtbar und lässt ihre moralische und theologische Spannung bestehen, statt sie als „sündig“ oder „von der sündigen Natur beherrscht“ festzulegen.
- issue: Wiedergabe von κατὰ ἄνθρωπον
  choice: nach Menschenart
  alternative: nach rein menschlichen Maßstäben
  rationale: Die Hauptfassung bleibt nahe an der offenen griechischen Formulierung. Die Fußnote bietet eine idiomatischere Deutung, ohne diese im Haupttext verbindlich zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fleischlich“ ist bewusst theologisch geprägt, aber verständlich und quellentreu. „Lebt“ vermeidet das veraltete „wandelt“, während „nach Menschenart“ die markante Formulierung des Ausgangstextes erhält.
