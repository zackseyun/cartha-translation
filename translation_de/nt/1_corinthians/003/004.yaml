source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: de
  text: 'Denn wenn einer sagt: »Ich gehöre zu Paulus«, und ein anderer: »Ich zu Apollos«, seid ihr dann nicht bloß Menschen?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Seid ihr nicht Menschen?« Möglich ist auch: »Verhaltet ihr euch da nicht nach Menschenart?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Im Deutschen gibt »wenn« zusammen mit der allgemeinen, wiederholbaren Situation die indefinite Bedeutung natürlich wieder; »sooft« wäre möglich, klänge hier jedoch unnötig schwer.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden Anschluss an den vorhergehenden Gedankengang.
- source_word: λέγῃ τις
  choice: einer sagt
  rationale: Gibt die unbestimmte Einzahl knapp und idiomatisch wieder.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Ich gehöre zu Paulus
  rationale: Der Genitiv bezeichnet hier die beanspruchte Zugehörigkeit beziehungsweise Parteibindung; diese Wendung ist im modernen Deutsch klarer als das unnatürliche »Ich bin des Paulus«.
- source_word: ἕτερος δέ
  choice: und ein anderer
  rationale: Gibt den durch μέν … δέ hergestellten Gegensatz in natürlichem Deutsch wieder.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Ich zu Apollos
  rationale: Die im Griechischen aus dem vorherigen Satzglied übernommene Verbform bleibt auch im Deutschen elliptisch und verständlich.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: seid ihr dann nicht bloß Menschen?
  rationale: »Menschen« bewahrt den ausdrücklichen Wortlaut; »bloß« macht die tadelnde rhetorische Kraft deutlich, ohne die Aussage auf eine bestimmte Deutung wie »fleischlich« festzulegen.
theological_decisions:
- issue: Bedeutung des Menschseins in der rhetorischen Frage
  choice: bloß Menschen
  alternative: verhaltet ihr euch da nicht nach Menschenart?
  rationale: Die Übersetzung erhält die ontologische Form »seid ihr«, während sie zugleich erkennen lässt, dass Paulus ein rein menschlich bestimmtes Verhalten tadelt. Sie vermeidet es, den Ausdruck unmittelbar mit einem theologischen Fachbegriff gleichzusetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Zugehörigkeitsformeln werden idiomatisch wiedergegeben; die Ellipse im zweiten Zitat bleibt erhalten. Die Fußnote dokumentiert den wörtlicheren Ausdruck und die mögliche verhaltensbezogene Lesart.
