  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: de
  text: Was ist also Apollos, und was ist Paulus?[a] Diener[b], durch die ihr gläubig geworden seid, und zwar so, wie der Herr es jedem gegeben hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wer ist also Apollos, und wer ist Paulus?“ Im Griechischen steht wörtlich „was“; dadurch wird ihre Rolle statt ihrer persönlichen Identität hervorgehoben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dienende“. Das griechische Wort bezeichnet hier Diener beziehungsweise Beauftragte und nicht notwendig das kirchliche Amt eines Diakons.'
    reason: lexical_alternative
  - marker: c
    text: 'Der letzte Satzteil ist im Griechischen verkürzt formuliert; wörtlich etwa: „und jedem, wie der Herr gab“. Das Objekt zu „gab“ bleibt ungenannt. Möglich ist auch die Deutung: „jedem entsprechend dem, was der Herr ihm zugeteilt hat“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: Was
  rationale: Das sächliche Fragewort richtet den Blick auf Stellung und Aufgabe von Apollos und Paulus, nicht auf ihre persönliche Identität. „Was“ bildet diese rhetorische Zuspitzung unmittelbar ab.
- source_word: οὖν
  choice: also
  rationale: „Also“ gibt den folgernden und zugleich überleitenden Charakter in natürlichem Deutsch wieder.
- source_word: δέ
  choice: und
  rationale: δέ verbindet hier die parallelen Fragen mit nur schwachem Kontrast; „und“ klingt im Deutschen am natürlichsten.
- source_word: διάκονοι
  choice: Diener
  rationale: Gemeint sind Personen, die einen Dienst ausüben. Der Kontext bezeichnet nicht notwendig das kirchliche Amt eines Diakons.
- source_word: δι’ ὧν
  choice: durch die
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise Mittel und wird mit „durch die“ präzise wiedergegeben.
- source_word: ἐπιστεύσατε
  choice: ihr zum Glauben gekommen seid
  rationale: Die Form bezeichnet ihr Gläubigwerden. Die idiomatische deutsche Wendung macht den Eintritt in den Glauben deutlich, ohne den Inhalt des Glaubens näher festzulegen.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: jeder so, wie der Herr es ihm gegeben hat
  rationale: Die Formulierung wahrt die knappe, elliptische Aussage weitgehend. Das grammatisch nötige „es“ benennt weder Auftrag noch Gabe ausdrücklich und lässt damit offen, was der Herr jeweils gegeben hat.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die sachgemäße und im neutestamentlichen Sprachgebrauch etablierte Wiedergabe; der Haupttext legt den Bezug nicht zusätzlich aus.
theological_decisions:
- issue: Bezugsgröße des sächlichen Frageworts
  choice: Die Fragen lauten „Was ist …?“ und betonen Rolle und Stellung der beiden Verkündiger.
  alternative: „Wer ist Apollos, und wer ist Paulus?“
  rationale: Das griechische τί ist sächlich. Die ungewöhnliche, aber verständliche deutsche Frage bewahrt Paulus’ Herabstufung menschlicher Leiter auf ihre dienende Funktion.
- issue: Bedeutung von διάκονοι
  choice: Diener
  alternative: Mitarbeiter; Amtsträger; Diakone
  rationale: „Diener“ wahrt den allgemeinen Dienstcharakter und vermeidet, an dieser Stelle ein förmliches Kirchenamt oder eine überhöhte Leitungsstellung einzutragen.
- issue: Ellipse in der abschließenden Wendung
  choice: „jeder so, wie der Herr es ihm gegeben hat“ ohne ausdrückliche Benennung des Gegebenen
  alternative: „jedem entsprechend der Aufgabe, die der Herr ihm zugewiesen hat“
  rationale: Der griechische Text nennt kein Objekt zu „gegeben hat“. Die Übersetzung ergänzt daher weder „Aufgabe“ noch „Rolle“ oder „Gabe“ und bewahrt die inhaltliche Offenheit.
- issue: Bezug von κύριος
  choice: Der Haupttext belässt die Bezeichnung bei „der Herr“.
  alternative: Ausdrückliche Präzisierung als Jesus Christus oder als Gott
  rationale: Im Zusammenhang liegt ein Bezug auf den Herrn Jesus nahe; die Übersetzung vermeidet jedoch eine Präzisierung, die im Vers selbst nicht ausdrücklich vorgenommen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Frage „Was ist …?“ wurde trotz ihrer Ungewöhnlichkeit beibehalten, weil sie verständlich ist und den rhetorischen Schwerpunkt des griechischen Textes trägt. Der Gedankenstrich gliedert die elliptische Schlusswendung, ohne ihren Inhalt durch ein ausdrücklich genanntes Objekt festzulegen.
