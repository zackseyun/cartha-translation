base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: de
  text: Wenn jemand den Tempel Gottes zerstört[a], wird Gott ihn zerstören. Denn der Tempel Gottes ist heilig – und dieser Tempel seid ihr[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verdirbt“ beziehungsweise „schändet“; dasselbe griechische Verb steht auch bei „wird … zerstören“.'
    reason: lexical_alternative
  - marker: b
    text: '„Ihr“ steht in der Mehrzahl: Paulus bezeichnet die Gemeinde als Gemeinschaft, als den einen Tempel Gottes.'
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: Tempel
  rationale: „Tempel“ ist im Deutschen die natürliche und geläufige Wiedergabe für das Heiligtum als Wohnstätte Gottes; im Zusammenhang bezeichnet der Singular bildlich die Gemeinde.
- source_word: φθείρει / φθερεῖ
  choice: zerstört / wird zerstören
  rationale: Die gleiche Wiedergabe in beiden Satzhälften bewahrt die eindringliche Wiederholung und die Entsprechung von Tat und Gericht. Das Verb kann auch „verderben“ oder „schänden“ bedeuten; diese Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- source_word: τοῦτον
  choice: ihn
  rationale: Das Pronomen greift die einzelne, unbestimmt bezeichnete Person („jemand“) auf und erhält die direkte Form der Warnung.
- source_word: ἅγιος
  choice: heilig
  rationale: „Heilig“ gibt sowohl die Zugehörigkeit zu Gott als auch die besondere, ausgesonderte Stellung des Tempels knapp und traditionsübergreifend wieder.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: und dieser Tempel seid ihr
  rationale: Die idiomatische Formulierung macht den Bezug des Relativsatzes deutlich, ohne die Aussage zu erweitern. Das ausdrückliche „ihr“ bewahrt den Nachdruck und die Mehrzahl.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Die deutsche Form kennzeichnet anders als englisches „you“ eindeutig den Plural und unterstützt so den gemeinschaftlichen Sinn des Bildes.
theological_decisions:
- issue: Bezeichnet Gottes Tempel hier vor allem einzelne Gläubige oder die Gemeinde als Gemeinschaft?
  choice: 'Der Haupttext versteht den Singular „Tempel“ zusammen mit dem pluralischen „ihr“ kollektiv: Die Gemeinde ist Gottes Tempel.'
  alternative: Die Aussage kann aufgrund anderer biblischer Zusammenhänge auch auf den einzelnen Gläubigen bezogen werden.
  rationale: Die Grammatik des Verses verbindet den einen Tempel ausdrücklich mit den mehreren Angesprochenen; zudem behandelt der nähere Kontext den Aufbau und die Gefährdung der Gemeinde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die klare Satzstruktur wahrt den warnenden Ton; der Gedankenstrich hebt die abschließende Identifikation hervor. Die Wiederholung von „Tempel“ und „zerstören“ bildet die markante Struktur des griechischen Textes ab.
