id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: de
  text: Ob Paulus, Apollos oder Kephas, ob die Welt, das Leben oder der Tod, ob Gegenwärtiges oder Zukünftiges – alles gehört euch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: ob … oder
  rationale: Die wiederholte griechische Verknüpfung führt eine umfassende Reihe von Alternativen an. „Ob … oder“ bildet diese rhetorische Struktur im modernen Deutschen natürlich ab; die Dreiergruppen vermeiden dabei schwerfällige Wiederholungen.
- source_word: Παῦλος
  choice: Paulus
  rationale: Übliche deutsche Form des Personennamens.
- source_word: Ἀπολλῶς
  choice: Apollos
  rationale: Übliche deutsche Wiedergabe des griechischen Personennamens.
- source_word: Κηφᾶς
  choice: Kephas
  rationale: Bewahrt die im griechischen Text verwendete semitische Namensform, statt sie durch den bedeutungsgleichen Namen „Petrus“ zu ersetzen.
- source_word: κόσμος
  choice: die Welt
  rationale: „Welt“ ist die natürliche und hinreichend weite Wiedergabe für den Welt- beziehungsweise Schöpfungsbereich in Paulus’ Argumentation.
- source_word: ζωή
  choice: das Leben
  rationale: Direkte und idiomatische Wiedergabe des Substantivs.
- source_word: θάνατος
  choice: der Tod
  rationale: Direkte lexikalische Entsprechung; auch der Tod wird in die umfassende Aussage einbezogen.
- source_word: ἐνεστῶτα
  choice: Gegenwärtiges
  rationale: Das substantivierte Partizip bezeichnet gegenwärtige Gegebenheiten oder Wirklichkeiten. „Gegenwärtiges“ ist knapp und bildet ein klares Gegenpaar zu „Zukünftiges“.
- source_word: μέλλοντα
  choice: Zukünftiges
  rationale: Das substantivierte Partizip bezeichnet das, was künftig ist beziehungsweise kommen wird. „Zukünftiges“ bewahrt die knappe Parallelität.
- source_word: πάντα
  choice: alles
  rationale: Das Neutrum Plural fasst die gesamte vorangehende Aufzählung zusammen. Das deutsche Singularwort „alles“ gibt diese totalisierende Kraft idiomatisch wieder.
- source_word: ὑμῶν
  choice: gehört euch
  rationale: Der Genitiv drückt hier Zugehörigkeit aus. „Gehört euch“ ist im heutigen Deutsch klarer und natürlicher als „ist euer“, ohne die Aussage näher zu bestimmen.
theological_decisions:
- issue: Art und Tragweite der Zugehörigkeit
  choice: Die knappe Aussage „alles gehört euch“ bleibt ohne erklärenden Zusatz stehen.
  alternative: „Alles dient euch“ oder „alles ist zu eurem Besten“
  rationale: Der Genitiv ὑμῶν bezeichnet Zugehörigkeit, erklärt aber nicht ausdrücklich, in welchem Sinn Paulus diese versteht. Eine funktionale Deutung würde die im Text vorhandene theologische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, rhetorisch ausgewogenem Satzbau. Die drei mit „ob“ eingeleiteten Gruppen bewahren den aufzählenden Nachdruck, ohne im Deutschen unnötig schwerfällig zu wirken.
