lexical_decisions:
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das Personalpronomen der zweiten Person Plural wird im Deutschen direkt und ohne zusätzliche Hervorhebung wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Das zweimalige δέ führt die Zugehörigkeitskette mit einem jeweils leicht kontrastierenden Anschluss fort. Die Stellung von »aber« bewahrt im Deutschen die knappe rhetorische Symmetrie.
- source_word: Χριστοῦ / Χριστός
  choice: dem Messias / der Messias
  rationale: Χριστός wird hier als Titel verstanden und daher mit »Messias« wiedergegeben. Im ersten Glied verlangt die natürliche Konstruktion mit »gehören« den Dativ; im zweiten steht »der Messias« als Subjekt.
- source_word: θεοῦ
  choice: Gott
  rationale: Der Genitiv bezeichnet hier Zugehörigkeit beziehungsweise Beziehung. Das deutsche Verb »gehören« gibt dies natürlich mit dem Dativ »Gott« wieder.
theological_decisions:
- issue: Wiedergabe der beiden elliptischen Genitivkonstruktionen Χριστοῦ und θεοῦ
  choice: 'Beide Glieder werden parallel mit »gehören« wiedergegeben: »Ihr aber gehört dem Messias, der Messias aber Gott.«'
  alternative: »Ihr aber seid des Messias, der Messias aber Gottes.«
  rationale: Die griechische Formulierung ist knapp und lässt die Art der Zugehörigkeit unerklärt. »Gehören« macht die im Deutschen sonst ungewohnte Ellipse verständlich, ohne das Verhältnis näher zu bestimmen oder die theologische Spannung aufzulösen.
translation_notes:
  register: Knappe, würdevolle Standardsprache. Die parallele Satzstruktur und das zweimalige »aber« spiegeln den pointierten griechischen Aufbau; »gehören« vermeidet zugleich eine heute altertümlich wirkende Genitivkonstruktion.
