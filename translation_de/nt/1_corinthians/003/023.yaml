  source_fidelity: Die Übersetzung gibt die elliptischen Zugehörigkeitsgenitive Χριστοῦ und θεοῦ idiomatisch und inhaltlich genau durch »gehört dem …« wieder. Das zweimalige δέ ist mit »aber« angemessen erfasst; die parallele, knappe Struktur des Griechischen bleibt erhalten, ohne die Beziehung inhaltlich zu präzisieren.
  naturalness: »Ihr aber gehört dem Messias, der Messias aber Gott« ist klares, modernes Standarddeutsch. Die Wiederholung von »aber« ist hier wegen der rhetorischen Parallelität bewusst und nicht unnatürlich.
  terminology: »Messias« gibt Χριστός entsprechend der vorgegebenen Titelentscheidung konsistent wieder. Die Fußnote zur traditionellen Wiedergabe »Christus« ist sachlich. Die wörtlichere Genitivfassung in Fußnote b ist korrekt gekennzeichnet und bewahrt die griechische Kürze.
