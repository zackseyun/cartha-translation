  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: de
  text: Ihr aber gehört dem Messias[a], der Messias aber Gott.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird Χριστός oft mit »Christus« wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Ihr aber seid des Messias, der Messias aber Gottes.«'
