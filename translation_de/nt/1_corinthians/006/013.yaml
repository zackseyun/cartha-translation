reference: 1 Corinthians 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: de
  text: Die Speisen sind für den Magen da und der Magen für die Speisen[a] – Gott aber wird sowohl dem Magen als auch den Speisen ein Ende setzen.[b] Der Körper aber ist nicht für sexuelle Unmoral da, sondern für den Herrn, und der Herr für den Körper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Viele Ausleger verstehen „Die Speisen sind für den Magen da und der Magen für die Speisen“ als ein Schlagwort der Korinther, das Paulus hier aufgreift und anschließend einschränkt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Gott aber wird sowohl den Magen als auch die Speisen beseitigen.“ Das griechische Verb kann auch „vernichten“, „abschaffen“ oder „außer Wirksamkeit setzen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: Speisen
  rationale: Der griechische Plural wird im Deutschen natürlich und präzise mit „Speisen“ wiedergegeben; so bleibt auch der Rückbezug durch ταῦτα erkennbar.
- source_word: κοιλίᾳ / κοιλία
  choice: Magen
  rationale: Im Zusammenhang mit Speisen und körperlichem Verlangen bezeichnet das Wort den Verdauungsbereich. „Magen“ ist im modernen Standarddeutsch klarer und weniger umgangssprachlich als „Bauch“.
- source_word: καταργήσει
  choice: wird … ein Ende setzen
  rationale: Die Wendung drückt aus, dass Gott die Funktion beziehungsweise den Bestand der Speisen-Magen-Ordnung beenden wird, ohne zwingend eine völlige Vernichtung zu behaupten.
- source_word: ταύτην καὶ ταῦτα
  choice: sowohl dem Magen als auch den Speisen
  rationale: Die Bezugswörter werden wiederholt, da eine wörtliche pronominale Wiedergabe im Deutschen schwerfällig und potenziell missverständlich wäre.
- source_word: σῶμα
  choice: Körper
  rationale: „Körper“ ist die übliche und kontextgemäße Wiedergabe für den konkreten menschlichen Leib, dessen theologische Bedeutung der Vers entfaltet.
- source_word: πορνείᾳ
  choice: sexuelle Unmoral
  rationale: Die Formulierung gibt die breite Kategorie unerlaubten sexuellen Verhaltens verständlich wieder. „Unzucht“ wäre traditionell, wirkt heute jedoch veraltet und kann enger verstanden werden.
- source_word: κυρίῳ / κύριος
  choice: Herr
  rationale: „Herr“ bewahrt den üblichen paulinischen Titel und das christologische Gewicht der Aussage.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ macht den Kontrast zwischen der Speisen-Magen-Aussage und der Aussage über den Körper deutlich.
theological_decisions:
- issue: Ob der erste Satz ein von Paulus zitiertes korinthisches Schlagwort ist
  choice: Der Satz steht ohne Anführungszeichen oder ergänzende Einleitungsformel im Haupttext.
  alternative: Den Satz als Zitat in Anführungszeichen setzen oder mit „Ihr sagt“ einleiten.
  rationale: Der griechische Text kennzeichnet kein Zitat ausdrücklich. Der Gedankenstrich lässt die anschließende Korrektur beziehungsweise Einschränkung hervortreten, ohne die verbreitete Schlagwort-Deutung verbindlich festzuschreiben.
- issue: Bedeutung von καταργήσει für Speisen und Magen
  choice: Die künftige Beendigung wird mit „ein Ende setzen“ ausgedrückt.
  alternative: „vernichten“, „abschaffen“ oder „außer Wirksamkeit setzen“.
  rationale: Die gewählte Formulierung bewahrt die Aussage, dass diese Ordnung vergänglich ist, ohne stärker als der griechische Ausdruck eine materielle Vernichtung zu behaupten.
- issue: Aussagekraft von „der Herr für den Körper“
  choice: Die knappe wechselseitige Formulierung bleibt ohne erklärenden Zusatz erhalten.
  alternative: „Der Herr sorgt für den Körper“ oder „der Herr ist zum Wohl des Körpers da“.
  rationale: Der griechische Wortlaut ist bewusst knapp und parallel gebaut. Eine Ergänzung würde die genaue Art der Beziehung stärker auslegen, als es der Text selbst tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele und knappe Satzstruktur des Griechischen bleibt weitgehend erhalten; „da sein für“ gibt die elliptischen Dativkonstruktionen natürlich wieder. Der erste Satz wird nicht ausdrücklich als Zitat markiert, und die reziproke Aussage über Herrn und Körper wird nicht ausdeutend erweitert.
