source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: de
  text: »Alles ist mir erlaubt«[a] – aber nicht alles ist förderlich.[b] »Alles ist mir erlaubt« – aber ich werde mich von nichts beherrschen lassen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ohne Anführungszeichen: Alles ist mir erlaubt. Viele verstehen diese Worte als eine Parole der Korinther, die Paulus aufgreift und einschränkt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: nützlich; hilfreich.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: Aber ich werde von nichts beherrscht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: Alles ist mir erlaubt
  rationale: Die umfassende Aussage wird im Deutschen idiomatisch mit dem substantivierten Singular »alles« wiedergegeben. »Erlaubt« trifft die Bedeutung dessen, was gestattet beziehungsweise zulässig ist, und bewahrt die prägnante, zweimal wiederholte Formulierung.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: aber nicht alles ist förderlich
  rationale: συμφέρει bezeichnet hier das, was nützt, zum Guten beiträgt oder einen hilfreichen Ertrag hat. »Förderlich« gibt diesen wertenden Sinn wieder, ohne ihn auf finanziellen Nutzen einzuengen.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: aber ich werde mich … nicht beherrschen lassen
  rationale: Das Futur Passiv bezeichnet, unter die Macht oder Herrschaft von etwas zu geraten. Die reflexive deutsche Formulierung ist natürlich, erhält die Betonung auf »ich« und gibt zugleich den Gedanken des Beherrschtwerdens wieder.
- source_word: ὑπό τινος
  choice: von nichts
  rationale: Das indefinite Pronomen kann Personen oder Sachen bezeichnen. Im Zusammenhang mit Handlungen, Bedürfnissen und Begierden ist die sachbezogene Wiedergabe »von nichts« am nächstenliegend, ohne den Grundsatz unnötig einzuengen.
theological_decisions:
- issue: Ob Πάντα μοι ἔξεστιν als korinthische Parole gekennzeichnet werden soll
  choice: Die zweimalige Aussage steht in Anführungszeichen und wird damit als wahrscheinlich zitierte Parole dargestellt.
  alternative: Die Aussage ohne Anführungszeichen als eigene, jeweils unmittelbar eingeschränkte Feststellung des Paulus lesen.
  rationale: Die griechischen Handschriften enthalten keine Anführungszeichen. Die Deutung als korinthische Parole erklärt jedoch die rhetorische Abfolge gut. Da sie plausibel, aber nicht textlich eindeutig ist, bleibt der Wortlaut unverändert und die andere Lesart wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wiederholung und der Gegensatz der griechischen Satzglieder bleiben erhalten. Deutsche Anführungszeichen markieren die wahrscheinliche, jedoch nicht sichere Parolenzitation; der Gedankenstrich macht die jeweilige Einschränkung gut lesbar.
