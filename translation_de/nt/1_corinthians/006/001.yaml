  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: de
  text: Wagt es jemand von euch, wenn er gegen einen anderen einen Rechtsstreit hat, sich vor den Ungerechten[a] richten zu lassen und nicht vor den Heiligen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den Unrechten“. Manche Übersetzungen deuten den Ausdruck als „vor Ungläubigen“; im Griechischen steht jedoch die moralisch wertende Bezeichnung „die Ungerechten“.'
    reason: lexical_alternative
  - marker: b
    text: „Die Heiligen“ bezeichnet hier Gottes heiliges Volk, also die Glaubenden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: Wagt es
  rationale: Bewahrt die rhetorische Frage und den vorwurfsvollen Klang des Verbs τολμάω.
- source_word: τις ὑμῶν
  choice: jemand von euch
  rationale: Gibt das indefinite Singularpronomen mit dem partitiven Genitiv natürlich und genau wieder.
- source_word: πρᾶγμα ἔχων
  choice: wenn er einen Rechtsstreit … hat
  rationale: Der gerichtliche Zusammenhang legt eine konkrete Streitsache nahe; „Rechtsstreit“ ist verständlich, ohne den Vorgang unnötig zu spezifizieren.
- source_word: πρὸς τὸν ἕτερον
  choice: mit einem anderen
  rationale: Bezeichnet hier die Gegenpartei beziehungsweise ein anderes Mitglied der Gemeinschaft; die deutsche Verbindung „Rechtsstreit mit“ ist idiomatisch.
- source_word: κρίνεσθαι
  choice: sich … richten zu lassen
  rationale: Gibt den passiven Infinitiv und seinen gerichtlichen Sinn wieder, ohne ihn interpretierend durch „vor Gericht gehen“ zu ersetzen.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: vor den Ungerechten
  rationale: Bewahrt die moralisch-theologische Bezeichnung ἄδικοι; „Ungläubige“ wäre eine kontextuell plausible, aber interpretierende Konkretisierung.
- source_word: καὶ οὐχὶ
  choice: und nicht
  rationale: Gibt den ausdrücklichen Gegensatz knapp wieder; die rhetorische Frage trägt bereits die Betonung.
- source_word: ἐπὶ τῶν ἁγίων
  choice: vor den Heiligen
  rationale: Bewahrt die paulinische Bezeichnung ἅγιοι und die parallele gerichtliche Formulierung mit „vor“.
theological_decisions:
- issue: Gegensatz zwischen ἀδίκων und ἁγίων
  choice: den Ungerechten … den Heiligen
  alternative: den Ungläubigen … den Gläubigen
  rationale: Der griechische Text verwendet moralisch und theologisch geprägte Bezeichnungen. Die Übersetzung erhält diese Spannung, statt die gemeinte Gruppenzugehörigkeit unmittelbar auszudeuten.
- issue: Repräsentatives maskulines Singular bei ἔχων
  choice: wenn er … hat
  alternative: wenn jemand … hat / wenn sie … haben
  rationale: Das Pronomen „er“ nimmt das grammatisch maskuline, repräsentative Singular des Partizips auf. Die Aussage betrifft ihrem Sinn nach jedes Mitglied der angesprochenen Gemeinde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten. „Rechtsstreit“ macht den gerichtlichen Kontext klar; „die Ungerechten“ und „die Heiligen“ bewahren bewusst die geprägten Gegenbegriffe des griechischen Textes.
