  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: de
  text: Das sage ich zu eurer Beschämung. Ist es wirklich so, dass es unter euch keinen einzigen Weisen gibt, der zwischen seinem Bruder und dem anderen entscheiden kann?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text nennt ausdrücklich nur eine Streitpartei: „zwischen seinem Bruder“. Die zweite Partei wird aus dem Zusammenhang ergänzt. „Bruder“ bezeichnet hier ein Gemeindeglied und kann in diesem Zusammenhang auch eine Schwester einschließen.'
    reason: Die griechische Wendung ist am Versende elliptisch und verwendet zugleich familiäre maskuline Sprache für Angehörige der Gemeinde.
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: Zu eurer Beschämung
  rationale: Die Wendung bezeichnet die auf die Adressaten gerichtete beschämende Wirkung der Zurechtweisung. „Zu eurer Beschämung“ bewahrt diese Kraft, ohne ausdrücklich eine Absicht („um euch zu beschämen“) festzulegen.
- source_word: οὕτως
  choice: Ist es wirklich so
  rationale: Die rhetorische Frage gibt den entrüsteten Ton des Zusammenhangs in natürlichem Deutsch wieder.
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφός
  choice: dass es unter euch keinen einzigen Weisen gibt
  rationale: „Unter euch“ bezeichnet die Gemeinde; „keinen einzigen“ bringt die nachdrückliche Verneinung zum Ausdruck. „Weisen“ erhält die substantivierte maskuline Singularform des Griechischen.
- source_word: ὃς δυνήσεται διακρῖναι
  choice: der … entscheiden kann
  rationale: Im Zusammenhang innergemeindlicher Rechtsstreitigkeiten bedeutet διακρίνω, zwischen Parteien zu urteilen bzw. eine Entscheidung zu treffen. Das deutsche Präsens mit Modalverb bezeichnet die in der rhetorischen Frage bestrittene Fähigkeit natürlich; der griechische Futuraspekt muss hier nicht mechanisch mit „wird entscheiden können“ wiedergegeben werden.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: zwischen seinem Bruder und dem anderen
  rationale: Nach „zwischen“ ist die griechische Formulierung elliptisch und nennt ausdrücklich nur „seinen Bruder“. „Und dem anderen“ ergänzt knapp die notwendige zweite Streitpartei, ohne sie näher zu bestimmen.
theological_decisions:
- issue: Maskuline Gemeinde- und Verwandtschaftssprache in einer gemischten Gemeinde
  choice: keinen einzigen Weisen … seinem Bruder
  alternative: keinen einzigen weisen Menschen … einem anderen Gemeindeglied
  rationale: Die Übersetzung bewahrt die maskulinen Singularformen des Ausgangstextes. Eine Fußnote erläutert, dass „Bruder“ im Kontext ein Gemeindeglied bezeichnet und daher Brüder wie Schwestern einschließen kann.
- issue: Elliptische Bezeichnung der Streitparteien
  choice: zwischen seinem Bruder und dem anderen
  alternative: zwischen seinen Brüdern
  rationale: Der Singular τοῦ ἀδελφοῦ αὐτοῦ wird beibehalten; die zweite Partei wird nur so weit ergänzt, wie es die deutsche Konstruktion „zwischen“ erfordert. Damit wird die Ellipse transparent und nicht als griechischer Plural wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlich zurechtweisendem Ton. Der Satzbau bleibt nahe am Griechischen, wird aber für heutige Leser idiomatisch gestaltet. Die echte Ellipse am Versende wird im Haupttext minimal ergänzt und in der Fußnote offengelegt.
