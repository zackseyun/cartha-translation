source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: de
  text: Oder wisst ihr nicht, dass euer Leib ein Tempel des Heiligen Geistes ist, der in euch ist, den ihr von Gott habt? Und ihr gehört nicht euch selbst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Im Griechischen steht „Leib“ im Singular, „euer“ jedoch im Plural. Das kann auf den Leib jedes Einzelnen bezogen oder repräsentativ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet als rhetorische Alternative beziehungsweise Fortführung den Gedanken aus dem vorausgehenden Zusammenhang ein und bewahrt Paulus’ zugespitzten Übergang.
- source_word: οὐκ οἴδατε
  choice: wisst ihr nicht
  rationale: Gibt die geläufige paulinische rhetorische Formel eng und zugleich natürlich wieder.
- source_word: τὸ σῶμα ὑμῶν
  choice: euer Leib
  rationale: Bewahrt den Singular von σῶμα bei pluralischem ὑμῶν. „Leib“ ist in diesem Zusammenhang verständlich und bezeichnet den konkreten menschlichen Körper, ohne auf bloße Körperlichkeit zu verengen.
- source_word: ναὸς
  choice: Tempel
  rationale: Bezeichnet das Heiligtum beziehungsweise Tempelgebäude; „Tempel“ vermittelt die sakrale Kraft des Bildes klar und idiomatisch.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: des Heiligen Geistes …, der in euch ist
  rationale: Die Genitivverbindung bestimmt „Tempel“ näher; der eingeschobene Relativsatz gibt ἐν ὑμῖν natürlich wieder und macht den Bezug eindeutig.
- source_word: οὗ
  choice: den
  rationale: Das Relativpronomen bezieht sich grammatisch auf den Heiligen Geist. Die persönliche Wiedergabe entspricht dem Referenten; wegen des Akkusativs nach „haben“ steht im Deutschen „den“.
- source_word: ἔχετε ἀπὸ θεοῦ
  choice: den ihr von Gott habt
  rationale: Bewahrt das präsentische „habt“ und gibt ἀπὸ θεοῦ knapp als Herkunftsangabe wieder, ohne ausdrücklich „empfangen“ einzufügen.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: Und ihr gehört nicht euch selbst
  rationale: Gibt die idiomatische Bedeutung der griechischen Genitivkonstruktion im heutigen Deutsch klar und präzise wieder.
theological_decisions:
- issue: Bezug und persönliche Wiedergabe von οὗ
  choice: Das Pronomen wird auf den Heiligen Geist bezogen und persönlich mit „den“ wiedergegeben.
  alternative: Eine unpersönliche Wiedergabe oder eine Umstellung, die den Bezug weniger deutlich macht.
  rationale: οὗ knüpft grammatisch an ἁγίου πνεύματός an. Die persönliche Form folgt diesem Bezug, ohne zusätzliche dogmatische Begriffe in den Text einzutragen.
- issue: Singular „Leib“ bei pluralischer Anrede
  choice: Der Singular „euer Leib“ bleibt erhalten.
  alternative: „Eure Leiber“ oder „eure Körper“.
  rationale: Der griechische Text verbindet den Singular τὸ σῶμα mit dem pluralischen ὑμῶν. Die Beibehaltung wahrt die mögliche distributive oder repräsentative Bedeutung, statt sie festzulegen.
- issue: Bedeutung von „nicht euch selbst“
  choice: 'Als Zugehörigkeitsaussage: „ihr gehört nicht euch selbst“.'
  alternative: 'Wörtlicher, aber im Deutschen missverständlich: „ihr seid nicht euer selbst/eure eigenen“.'
  rationale: Der Genitiv ἑαυτῶν drückt hier idiomatisch Zugehörigkeit aus. Die gewählte Form wahrt den Sinn und die Spannung zum folgenden Vers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leib“ bewahrt den biblischen Ton und den Singular der Vorlage; „gehört nicht euch selbst“ ist gegenüber einer formalen Nachbildung klarer und natürlich. Alle Fußnotenmarker stehen unmittelbar an den einschlägigen Textstellen.
