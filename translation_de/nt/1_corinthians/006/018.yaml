id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: de
  text: Flieht vor sexueller Unmoral! Jede Sünde, die ein Mensch begeht, ist außerhalb des Körpers[a]; wer aber sexuelle Unmoral begeht, sündigt gegen den eigenen Körper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage „ist außerhalb des Körpers“ ist in ihrer genauen Bedeutung umstritten. Manche verstehen sie als einen von Paulus aufgegriffenen korinthischen Leitsatz; der griechische Text kennzeichnet sie jedoch nicht ausdrücklich als Zitat.
    reason: Bewahrt die exegetische Spannung, ohne im Haupttext eine umstrittene Deutung festzuschreiben.
lexical_decisions:
- source_word: φεύγετε
  choice: Flieht vor
  rationale: Der Präsensimperativ in der zweiten Person Plural fordert nachdrücklich zum Meiden auf. „Flieht vor“ ist im heutigen Deutsch natürlicher als ein transitives „flieht“ und bewahrt die Dringlichkeit.
- source_word: πορνείαν / πορνεύων
  choice: sexuelle Unmoral / sexuelle Unmoral begeht
  rationale: πορνεία bezeichnet unerlaubtes sexuelles Verhalten in einem breiten Sinn. „Sexuelle Unmoral“ gibt diese Weite wieder; die wiederholte Formulierung erhält die sprachliche Verbindung zwischen Substantiv und Partizip.
- source_word: πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: Jede Sünde, die ein Mensch begeht
  rationale: „Jede Sünde“ bewahrt die umfassende Aussage. „Ein Mensch“ gibt den generischen Sinn von ἄνθρωπος im Deutschen natürlich und geschlechtsübergreifend wieder; der konditional-allgemeine Sinn der griechischen Konstruktion ist in der deutschen Relativkonstruktion enthalten.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: ist außerhalb des Körpers
  rationale: Die räumlich-metaphorische Formulierung wird eng am Griechischen wiedergegeben, ohne die exegetisch schwierige Aussage abzuschwächen oder aufzulösen.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: sündigt gegen den eigenen Körper
  rationale: „Gegen“ gibt in diesem Zusammenhang die Zielrichtung von εἰς idiomatisch wieder. „Den eigenen Körper“ bewahrt die rückbezügliche Betonung von ἴδιον, ohne im Deutschen unnötig ein Geschlecht festzulegen.
theological_decisions:
- issue: Bedeutung der Aussage, jede Sünde sei außerhalb des Körpers
  choice: Die Aussage wird unmittelbar und ohne harmonisierende Ergänzung übersetzt.
  alternative: Die Worte als korinthischen Leitsatz kennzeichnen oder ihren Geltungsbereich erklärend einschränken.
  rationale: Der griechische Text kennzeichnet die Aussage nicht ausdrücklich als Zitat. Die Übersetzung bewahrt deshalb die exegetische Spannung; eine mögliche Zitatdeutung wird nur in der Fußnote erwähnt.
- issue: Generischer Sinn von ἄνθρωπος
  choice: ein Mensch
  alternative: ein Mann; jemand
  rationale: ἄνθρωπος bezeichnet hier repräsentativ einen Menschen allgemein. „Ein Mensch“ entspricht sowohl der Wortbedeutung als auch natürlichem modernem Deutsch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Imperativ bleibt eindringlich; abstrakte theologische Fachsprache und konfessionell geprägte Zusätze werden vermieden.
