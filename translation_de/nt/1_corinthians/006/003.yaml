id: 1CO.6.3
reference: 1 Corinthians 6:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ἀγγέλους κρινοῦμεν, μήτιγε βιωτικά;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: de
  text: Wisst ihr nicht, dass wir Engel richten werden? Wie viel mehr[a] die Angelegenheiten dieses Lebens!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um wie viel eher die Angelegenheiten dieses Lebens“; sinngemäß auch: „geschweige denn die Angelegenheiten dieses Lebens“.'
    reason: Lexikalische und idiomatische Alternative für μήτιγε.
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Wisst ihr nicht
  rationale: Bewahrt die für Paulus typische rhetorische Frageform und klingt zugleich natürlich und verständlich.
- source_word: ὅτι
  choice: dass
  rationale: Leitet als gewöhnliche Konjunktion den Inhalt dessen ein, was die Adressaten wissen sollen.
- source_word: ἀγγέλους
  choice: Engel
  rationale: Im eschatologischen Gerichtskontext sind himmlische Wesen gemeint, nicht menschliche Boten.
- source_word: κρινοῦμεν
  choice: wir ... richten werden
  rationale: Das Futur wird ausdrücklich wiedergegeben; „richten“ erhält die gerichtliche Bedeutung, ohne die Art oder Reichweite dieses Richtens näher festzulegen.
- source_word: μήτιγε
  choice: wie viel mehr
  rationale: 'Kennzeichnet den Schluss vom Größeren auf das Geringere: Wenn die Glaubenden Engel richten werden, gilt dies erst recht für alltägliche Angelegenheiten.'
- source_word: βιωτικά
  choice: die Angelegenheiten dieses Lebens
  rationale: Das substantivierte Adjektiv bezeichnet Belange des gewöhnlichen irdischen Lebens; die Wiedergabe bleibt breit genug für die Streitfälle des Zusammenhangs.
theological_decisions:
- issue: Das Richten von Engeln durch die Glaubenden
  choice: „wir Engel richten werden“ ohne erläuternde Erweiterung
  alternative: „wir über Engel herrschen werden“ oder „wir gefallene Engel richten werden“
  rationale: Der griechische Text bestimmt weder die genaue Art des Richtens noch ausdrücklich, welche Engel gemeint sind. Die direkte Wiedergabe bewahrt diese theologische Offenheit.
- issue: Rhetorischer Schluss bei μήτιγε
  choice: „Wie viel mehr“
  alternative: „geschweige denn“ oder „um wie viel eher“
  rationale: Der Zusammenhang führt vom Größeren, dem Richten von Engeln, zum vergleichsweise Geringeren, den Angelegenheiten dieses Lebens. „Wie viel mehr“ bildet diese Argumentationsrichtung verständlich ab.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die rhetorische Zuspitzung und die knappe, elliptische Form des zweiten Satzes bleiben erhalten.
