  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: de
  text: Wenn ihr nun über Angelegenheiten dieses Lebens[a] zu richten habt, setzt ihr dann ausgerechnet diejenigen als Richter ein, die in der Gemeinde nichts gelten?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über Angelegenheiten des Alltags“; gemeint sind gewöhnliche irdische oder bürgerliche Angelegenheiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die in der Gemeinde verachtet werden“. Der griechische Ausdruck kann ironisch Menschen bezeichnen, die innerhalb der Gemeinde als unbedeutend gelten, oder solche, die aus Sicht der Gemeinde kein Ansehen haben.'
    reason: alternative_reading
  - marker: c
    text: 'Manche verstehen den Satz als sarkastische Aufforderung: „Dann setzt diejenigen als Richter ein, die in der Gemeinde nichts gelten!“'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: Angelegenheiten dieses Lebens
  rationale: Bezeichnet gewöhnliche irdische beziehungsweise bürgerliche Angelegenheiten; die Formulierung vermeidet den moralisch abwertenden Beiklang von „weltlich“.
- source_word: κριτήρια
  choice: zu richten
  rationale: Das Substantiv kann Gerichte, Rechtssachen oder gerichtliche Entscheidungen bezeichnen. Zusammen mit ἔχητε wird die funktionale Wiedergabe „zu richten habt“ im Deutschen natürlich und bewahrt den Bezug auf Rechtsstreitigkeiten.
- source_word: ἐὰν ἔχητε
  choice: wenn ihr … zu richten habt
  rationale: Gibt die konditionale Konstruktion idiomatisch wieder, ohne ihr mehr Gewissheit beizulegen, als der griechische Wortlaut ausdrückt.
- source_word: τοὺς ἐξουθενημένους
  choice: diejenigen …, die … nichts gelten
  rationale: Das Partizip bezeichnet Menschen, die geringgeschätzt oder für unbedeutend gehalten werden. „Nichts gelten“ bewahrt die soziale Wertung, ohne eindeutig zwischen verachteten Gemeindegliedern und Außenstehenden ohne Ansehen bei der Gemeinde zu entscheiden.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: in der Gemeinde
  rationale: „Gemeinde“ bezeichnet hier die örtliche christliche Gemeinschaft. Die Präpositionalphrase bleibt so offen dafür, ob die Betreffenden innerhalb der Gemeinde oder nach deren Einschätzung nichts gelten.
- source_word: τούτους καθίζετε
  choice: setzt ihr dann ausgerechnet diejenigen als Richter ein
  rationale: καθίζω bedeutet wörtlich „setzen“ und kann im gerichtlichen Zusammenhang das Einsetzen als Richter meinen. „Ausgerechnet“ vermittelt die hervorgehobene, ironische Stellung von τούτους, ohne die Satzart zu verändern.
theological_decisions:
- issue: 'Satzart: rhetorische Frage oder sarkastischer Imperativ'
  choice: 'Rhetorische Frage: „setzt ihr dann … als Richter ein?“'
  alternative: 'Sarkastischer Imperativ: „Dann setzt diejenigen als Richter ein, die in der Gemeinde nichts gelten!“'
  rationale: Die griechische Syntax lässt beide Deutungen zu; die Zeichensetzung des SBLGNT und der tadelnde Zusammenhang stützen die Frage. Eine Fußnote hält die imperative Deutung sichtbar.
- issue: Identität der als gering geltenden Personen
  choice: Die Hauptfassung lässt offen, ob es sich um geringgeschätzte Personen innerhalb der Gemeinde oder um Personen ohne Ansehen aus Sicht der Gemeinde handelt.
  alternative: Eindeutige Identifikation als außenstehende weltliche Richter oder als unbedeutende Gemeindeglieder
  rationale: ἐν τῇ ἐκκλησίᾳ und ἐξουθενημένους erlauben mehrere Bezüge. Die Übersetzung soll diese echte Auslegungsunsicherheit nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gemeinde“ ist im neutestamentlichen Kontext natürlicher als „Kirche“; „Angelegenheiten dieses Lebens“ bewahrt den Gegensatz zum kommenden Leben und bleibt allgemein verständlich. Die rhetorische Schärfe wird durch „ausgerechnet“ wiedergegeben.
