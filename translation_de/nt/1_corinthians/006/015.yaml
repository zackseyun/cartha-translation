id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: de
  text: Wisst ihr nicht, dass eure Körper Glieder des Messias[a] sind? Soll ich also die Glieder des Messias nehmen und zu Gliedern einer Prostituierten machen? Auf keinen Fall![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Das griechische Χριστός kann sowohl als übersetzter Titel („Messias“) als auch als namensähnliche Bezeichnung („Christus“) gebraucht werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Keineswegs!“ Die griechische Wendung μὴ γένοιτο drückt eine entschiedene Zurückweisung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: Körper
  rationale: Der Plural bezeichnet die wirklichen leiblichen Existenzen der Glaubenden. „Körper“ ist im heutigen Standarddeutsch natürlich und konkret.
- source_word: μέλη
  choice: Glieder
  rationale: „Glieder“ bewahrt das Körperbild und zugleich den Gedanken der Zugehörigkeit zu einem größeren Ganzen; außerdem bleibt die bewusste Wiederholung des griechischen Wortes erhalten.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet den Gesalbten und kann als Titel verstanden werden. „Messias“ macht diesen Titelgehalt sichtbar, ohne die alternative, im Deutschen geläufige Wiedergabe „Christus“ auszuschließen.
- source_word: ἄρας
  choice: nehmen
  rationale: 'Das Partizip gehört zur rhetorisch erwogenen Handlung: Die Glieder des Messias werden genommen, um sie einer anderen Verbindung zuzuführen.'
- source_word: ποιήσω
  choice: zu … machen
  rationale: Die Formulierung gibt die schockierende rhetorische Vorstellung direkt wieder und verbindet sich im Deutschen natürlich mit „zu Gliedern“.
- source_word: πόρνης
  choice: einer Prostituierten
  rationale: πόρνη bezeichnet hier spezifisch eine Prostituierte. Die Wiedergabe ist modern, präzise und nicht beschönigend.
- source_word: μὴ γένοιτο
  choice: Das darf niemals geschehen!
  rationale: Die Wendung ist eine nachdrückliche Zurückweisung. Diese deutsche Formulierung bewahrt sowohl ihre starke Ablehnung als auch den auf ein Geschehen bezogenen, volitiven Klang.
- source_word: οὐκ οἴδατε
  choice: Wisst ihr nicht
  rationale: Die Formulierung erhält die rhetorische Frage und den Appell an bereits vorausgesetztes Wissen in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Aussage über die leibliche Zugehörigkeit
  choice: Messias
  alternative: Christus
  rationale: „Messias“ bewahrt den Titelgehalt von Χριστός; da das Wort hier auch namensartig verstanden werden kann und „Christus“ im Deutschen fest etabliert ist, wird diese echte Übersetzungsalternative in einer Fußnote genannt.
- issue: Stärke und Form von μὴ γένοιτο
  choice: Das darf niemals geschehen!
  alternative: Auf keinen Fall! / Keineswegs!
  rationale: Die gewählte Form gibt nicht nur eine Verneinung, sondern die empörte Zurückweisung der vorgestellten Handlung wieder, ohne zusätzliche theologische Aussagen einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen, die Wiederholung von „Glieder“ und die scharfe Schlusswendung bleiben erhalten; „Prostituierte“ ist gegenwärtig und lexikalisch genau.
