  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: de
  text: Überhaupt ist es für euch schon eine Niederlage, dass ihr untereinander Rechtsstreitigkeiten habt.[a] Warum lasst ihr euch nicht lieber Unrecht tun? Warum lasst ihr euch nicht lieber übervorteilen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Verlust“ beziehungsweise „ein Versagen“ statt „eine Niederlage“; für „Rechtsstreitigkeiten“ auch: „Gerichtsverfahren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich berauben lassen“ beziehungsweise „sich um etwas bringen lassen“. Das griechische Wort kann bedeuten, dass jemandem etwas vorenthalten wird, dass er beraubt oder betrogen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: nun überhaupt schon
  rationale: Die Formulierung gibt den folgernden Übergang, die zeitliche Aussage und die verstärkende Gesamtbeurteilung wieder, ohne die deutsche Satzstruktur unnötig zu belasten.
- source_word: ἥττημα
  choice: Niederlage
  rationale: 'Das Wort bezeichnet einen Verlust beziehungsweise eine Niederlage. „Niederlage“ bewahrt die rhetorische Schärfe: Schon das Vorhandensein solcher Prozesse ist ein Scheitern, unabhängig vom gerichtlichen Ausgang.'
- source_word: ὑμῖν ἐστιν
  choice: ist ... für euch
  rationale: Bewahrt den Dativ des Bezugs und fügt keine im Ausgangstext nicht ausdrücklich genannte Kategorie wie „Schande“ hinzu.
- source_word: κρίματα
  choice: Rechtsstreitigkeiten
  rationale: Im Kontext bezeichnet das Wort vor Gericht ausgetragene Streitfälle. „Rechtsstreitigkeiten“ ist präzise, verständlich und weniger auf das einzelne Verfahren verengt als „Prozesse“.
- source_word: μεθ’ ἑαυτῶν
  choice: untereinander
  rationale: Gibt den wechselseitigen Konflikt innerhalb der Gemeinde natürlich wieder.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Warum ... nicht lieber
  rationale: Bewahrt die rhetorische Frage und den vergleichenden Gedanken von μᾶλλον.
- source_word: ἀδικεῖσθε
  choice: lasst ihr euch ... Unrecht tun
  rationale: Gibt die passive Form und den ethischen Gehalt idiomatisch wieder.
- source_word: ἀποστερεῖσθε
  choice: lasst ihr euch ... übervorteilen
  rationale: Das Verb kann berauben, vorenthalten oder betrügen bedeuten. „Übervorteilen“ passt zum rechtlich-materiellen Zusammenhang und lässt die genaue Art des Verlusts offen.
theological_decisions:
- issue: Paulus’ Bewertung innergemeindlicher Rechtsstreitigkeiten
  choice: ἥττημα wird als „Niederlage“ wiedergegeben.
  alternative: „Verlust“ oder „Versagen“
  rationale: Die Übersetzung bewahrt die starke moralische Beurteilung des Textes, ohne eine zusätzliche dogmatische Kategorie einzuführen.
- issue: Die beiden rhetorischen Fragen als Aufforderung zum Ertragen von Unrecht
  choice: 'Die passive und vergleichende Form bleibt erhalten: „Warum lasst ihr euch nicht lieber ...?“'
  alternative: Eine ausdrückliche Deutung als absolutes Verbot jeder rechtlichen Gegenwehr
  rationale: Paulus’ zugespitzte Aufforderung wird unverändert wiedergegeben; ihr Anwendungsbereich wird nicht über den unmittelbaren Zusammenhang hinaus festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte rhetorische Frage und die scharfe Bewertung werden bewahrt. „Übervorteilen“ ist leicht gehoben, aber allgemein verständlich und hält die Bandbreite des griechischen Verbs besser offen als das engere „betrügen“.
