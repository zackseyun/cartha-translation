  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: de
  text: Denn ihr seid um einen Preis erkauft worden.[a] Verherrlicht also[b] Gott in eurem Körper![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn ihr seid für einen Preis gekauft worden.“ Der griechische Ausdruck hält am Bild eines Kaufs und des dafür gezahlten Preises fest.'
    reason: lexical_alternative
  - marker: b
    text: „Also“ gibt die nachdrückliche Partikel δή wieder; je nach Zusammenhang kann sie auch mit „nun“ übersetzt oder im Deutschen unausgedrückt bleiben.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „mit eurem Körper“. Das griechische ἐν kann hier den Bereich oder das Mittel des Verherrlichens bezeichnen.'
    reason: genuine_ambiguity
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: ihr seid … erkauft worden
  rationale: Der Aorist Passiv von ἀγοράζω bezeichnet ein Kaufen oder Erwerben. „Erkauft“ bewahrt das Bild eines Kaufvorgangs und klingt im Deutschen würdig und verständlich.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aufforderung. „Denn“ gibt diese rückbezügliche Begründung knapp und natürlich wieder.
- source_word: τιμῆς
  choice: um einen Preis
  rationale: Der Genitiv bezeichnet bei ἀγοράζω den gezahlten Preis. Die Formulierung erhält die Kosten- und Kaufmetaphorik, ohne den nicht genannten Preis näher zu bestimmen.
- source_word: δοξάσατε
  choice: Verherrlicht
  rationale: Der Aorist Imperativ fordert zu entschiedenem Handeln auf. „Verherrlicht“ entspricht δοξάζω und bewahrt dessen theologisches Gewicht.
- source_word: δὴ
  choice: also
  rationale: δή verstärkt hier den folgernden beziehungsweise dringlichen Charakter der Aufforderung. „Also“ stellt den natürlichen Schluss aus der Begründung her.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: in eurem Körper
  rationale: Die Wiedergabe mit „in“ bewahrt die mögliche lokale oder sphärische Bedeutung von ἐν und vermeidet es, die Formulierung ausschließlich instrumental zu verstehen. Der Singular mit dem pluralischen Possessiv wird im Deutschen distributiv verstanden.
theological_decisions:
- issue: Bild des käuflichen Erwerbs
  choice: Die Kaufmetapher wird mit „um einen Preis erkauft worden“ beibehalten.
  alternative: „um einen hohen Preis erlöst worden“
  rationale: Paulus verwendet ausdrücklich Marktsprache. „Erlöst“ würde die Metapher deuten, und „hoch“ beziehungsweise „teuer“ steht nicht ausdrücklich im griechischen Wortlaut.
- issue: Folgernde und dringliche Kraft von δή
  choice: δή wird mit „also“ ausdrücklich wiedergegeben.
  alternative: Die Partikel unübersetzt lassen oder mit „nun“ wiedergeben.
  rationale: „Also“ macht die Folgerung aus dem vorher Gesagten sichtbar; die Fußnote hält fest, dass die Partikel auch anders nuanciert oder im Deutschen unausgedrückt bleiben kann.
- issue: Leibliche Lebensführung
  choice: σῶμα wird konkret mit „Körper“ übersetzt.
  alternative: „Leib“, „Leben“ oder „Selbst“
  rationale: Der unmittelbare Zusammenhang betrifft körperliches sexuelles Verhalten. „Körper“ wahrt diesen konkreten Bezug; allgemeinere Umschreibungen würden die Aussage ausweiten.
- issue: Bedeutungsbreite von ἐν
  choice: „in eurem Körper“ bewahrt die räumlich-sphärische Formulierung.
  alternative: „mit eurem Körper“ oder „durch euren Körper“
  rationale: Eine instrumentale Deutung ist möglich, aber nicht zwingend. Die engere Wiedergabe mit „in“ lässt die griechische Bedeutungsbreite bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erkauft“ bewahrt die Kaufmetapher, ohne das altertümlichere „teuer erkauft“ zu verwenden. „Körper“ ist im heutigen Deutsch unmittelbar verständlich und entspricht dem konkreten ethischen Zusammenhang. Der pluralische Adressatenkreis bleibt in „ihr/eurem“ sichtbar.
