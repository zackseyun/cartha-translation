  verdict: approve
  source_fidelity: Der Text gibt die forensische Bedeutung von κρίνεται im Kontext zutreffend mit »zieht … vor Gericht« wieder. »Ein Bruder gegen einen Bruder« bewahrt die Wiederholung von ἀδελφός und den kontrastiven Streitbezug von μετὰ im Rechtskontext. »Und das vor Ungläubigen?« entspricht καὶ τοῦτο ἐπὶ ἀπίστων und fügt keine im Griechischen nicht ausdrücklich genannten Richter hinzu. »Stattdessen« gibt ἀλλά im Anschluss an Vers 5 angemessen stark adversativ wieder.
  naturalness: Die Formulierung ist modernes, idiomatisches Standarddeutsch. Der Gedankenstrich unterstützt die rhetorische Zuspitzung; die abschließende Frage ist im Deutschen ebenso natürlich wie im griechischen Kontext.
  terminology: »Bruder« erhält die paulinische Familienmetaphorik und die maskuline Singularwiederholung. Die Anmerkung erklärt den gemeindlichen Bezug, ohne den Haupttext zu erweitern. »Ungläubige« wahrt den Gegensatz von ἄπιστοι zur Gemeinde; die Fußnote unterscheidet angemessen zwischen dem wahrscheinlichen Gerichtskontext und dem weiteren griechischen Wortlaut.
