id: 1CO.6.6
reference: 1 Corinthians 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: de
  text: Stattdessen zieht ein Bruder gegen einen Bruder vor Gericht – und das vor Ungläubigen?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor den Ungläubigen«. Gemeint sind wahrscheinlich weltliche Gerichte, die mit Menschen außerhalb der Gemeinde besetzt waren; im Griechischen steht jedoch lediglich »vor Ungläubigen«.'
    reason: lexical_alternative
  - marker: b
    text: Die wiederholte Bezeichnung »Bruder« meint Mitglieder der christlichen Gemeinde.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Stattdessen
  rationale: Die starke adversative Partikel stellt der in Vers 5 vorausgesetzten innergemeindlichen Rechtsprechung die tatsächliche Praxis gegenüber.
- source_word: ἀδελφὸς μετὰ ἀδελφοῦ
  choice: ein Bruder gegen einen Bruder
  rationale: Die Wiederholung des singularischen ἀδελφός und die familiäre Sprache des Paulus bleiben erhalten; μετά bezeichnet im Rechtsstreit die gegnerische Beziehung.
- source_word: κρίνεται
  choice: zieht … vor Gericht
  rationale: Im unmittelbaren Zusammenhang bezeichnet κρίνω einen Rechtsstreit. Die deutsche Wendung gibt den forensischen Sinn natürlich wieder, ohne eine passive Verurteilung nahezulegen.
- source_word: καὶ τοῦτο
  choice: und das
  rationale: Die idiomatische Wendung hebt den zusätzlichen, für Paulus anstößigen Umstand rhetorisch hervor.
- source_word: ἐπὶ ἀπίστων
  choice: vor Ungläubigen
  rationale: ἐπί mit Genitiv bezeichnet hier den Personenkreis, vor dem der Rechtsstreit ausgetragen wird. Die Formulierung bewahrt die Allgemeinheit des Griechischen und ergänzt nicht ausdrücklich »Richtern«.
theological_decisions:
- issue: Repräsentative Bedeutung von ἀδελφός innerhalb der Gemeinde
  choice: Bruder
  alternative: Glaubensgeschwister; Bruder oder Schwester
  rationale: Die maskuline Singularform und die wiederholte Verwandtschaftsbezeichnung werden bewahrt. Im Zusammenhang bezeichnet sie Gemeindemitglieder repräsentativ, ohne dass diese Erklärung in den Haupttext eingetragen wird.
- issue: Bedeutungsumfang von ἀπίστων
  choice: Ungläubigen
  alternative: ungläubigen Richtern; Außenstehenden
  rationale: Die Übersetzung erhält den Gegensatz zwischen der Gemeinde und Menschen außerhalb des Glaubens, ohne den griechischen Ausdruck auf Amtsträger zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vor Gericht ziehen« macht den juristischen Zusammenhang verständlich; Gedankenstrich und rhetorische Frage erhalten die empörte Zuspitzung des griechischen Satzes.
