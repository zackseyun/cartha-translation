  text: ἀλλὰ ὑμεῖς ἀδικεῖτε καὶ ἀποστερεῖτε, καὶ ⸀τοῦτο ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: de
  text: Doch ihr selbst tut Unrecht und übervorteilt eure Geschwister[a] – und das auch noch!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort lautet „Brüder“ und kann hier die Glaubensgeschwister insgesamt bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den scharfen Gegensatz zum vorher Gesagten und klingt im Deutschen natürlich und nachdrücklich.
- source_word: ὑμεῖς
  choice: ihr selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist emphatisch; „ihr selbst“ bewahrt den Nachdruck auf dem Verhalten der Angesprochenen.
- source_word: ἀδικεῖτε
  choice: tut Unrecht
  rationale: Gibt den breiten Sinn ungerechten Handelns knapp und idiomatisch wieder, ohne ein bestimmtes Objekt hinzuzufügen.
- source_word: ἀποστερεῖτε
  choice: übervorteilt andere
  rationale: Bezeichnet das Vorenthalten dessen, was jemandem zusteht, beziehungsweise betrügerische Benachteiligung. „Übervorteilt“ passt zum rechtlich-wirtschaftlichen Zusammenhang; „andere“ macht im Deutschen das beim transitiven Verb erforderliche Objekt allgemein deutlich.
- source_word: καὶ τοῦτο
  choice: – und das
  rationale: Hebt rhetorisch hervor, gegen wen sich dieses Verhalten richtet; der Gedankenstrich bewahrt den pointierten Nachtrag.
- source_word: ἀδελφούς
  choice: unter Geschwistern
  rationale: Das griechische maskuline Pluralwort kann im paulinischen Gemeindekontext die Glaubensgeschwister insgesamt bezeichnen. „Unter Geschwistern“ ist im modernen Deutsch natürlich und lässt die genaue Reichweite durch die Fußnote erkennen.
theological_decisions:
- issue: Wiedergabe von ἀδελφούς im gemeindlichen Kontext
  choice: unter Geschwistern
  alternative: an Brüdern; an Glaubensgeschwistern
  rationale: Der griechische Ausdruck ist grammatisch maskulin, kann hier aber Angehörige der christlichen Gemeinschaft beiderlei Geschlechts umfassen. Die Übersetzung gibt diese wahrscheinliche gemeinschaftliche Bedeutung wieder, während die Fußnote die Form des Ausgangstextes transparent macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers behält den scharfen Kontrast, die Betonung auf „ihr selbst“ und den rhetorischen Nachdruck von καὶ τοῦτο bei.
