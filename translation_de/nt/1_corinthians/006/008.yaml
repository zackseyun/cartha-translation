review_pass:
  verdict: revise
  source_fidelity: 'Die vorliegende Fassung gibt Kontrast, Emphase und die beiden Verben grundsätzlich zutreffend wieder. „unter Geschwistern“ verändert jedoch die syntaktische Funktion von ἀδελφούς: Im Griechischen bezeichnet es die Personen, denen Unrecht geschieht bzw. die übervorteilt werden, nicht bloß den sozialen Rahmen des Handelns. „andere“ bleibt zudem unnötig unbestimmt, obwohl der Nachtrag die Betroffenen benennt.'
  naturalness: „Doch ihr selbst“ und „tut Unrecht“ sind natürliches modernes Standarddeutsch. Die überarbeitete Fassung macht die Geschwister direkt zu den Betroffenen und gibt den pointierten Nachtrag mit „und das auch noch!“ idiomatisch wieder.
  terminology: „Geschwister“ ist im gegenwärtigen gemeindlichen Deutsch eine natürliche kontextuelle Wiedergabe von ἀδελφούς und kann Frauen und Männer einschließen. Die Fußnote legt transparent offen, dass im Griechischen die maskuline Form „Brüder“ steht, ohne die im Kontext wahrscheinliche inklusive Referenz einzuengen.
  issues:
  - severity: medium
    issue: „unter Geschwistern“ statt einer direkten Bezeichnung der Geschädigten
    rationale: ἀδελφούς steht als Akkusativ bei ἀδικεῖτε καὶ ἀποστερεῖτε und benennt die Personen, gegen die das Unrecht bzw. die Übervorteilung geschieht. Die Wendung „unter Geschwistern“ macht daraus einen bloßen Bereich oder Umstand und schwächt damit die Aussage.
  - severity: low
    issue: Fußnote bezeichnet „an Brüdern“ als wörtlich
    rationale: Der griechische Text lautet lediglich „Brüder“ im Akkusativ; „an“ ist eine deutsche, syntaktisch bedingte Ergänzung und daher nicht wörtlich.
  revised_text: Doch ihr selbst tut Unrecht und übervorteilt eure Geschwister[a] – und das auch noch!
