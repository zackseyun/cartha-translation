- from: Doch ihr selbst tut Unrecht und übervorteilt andere – und das unter Geschwistern.[a]
  to: Doch ihr selbst tut Unrecht und übervorteilt eure Geschwister[a] – und das auch noch!
  rationale: Die Revision stellt wieder her, dass die Geschwister die unmittelbar Betroffenen beider Handlungen sind. Sie bewahrt den emphatischen Gegensatz („Doch ihr selbst“) sowie die rhetorische Zuspitzung von καὶ τοῦτο und erläutert die grammatisch maskuline griechische Form präzise in der Fußnote.
