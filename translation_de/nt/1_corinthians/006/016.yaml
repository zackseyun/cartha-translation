source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: de
  text: Oder wisst ihr nicht, dass wer sich mit einer Prostituierten verbindet, ein Leib mit ihr ist? Denn, wie es heißt:[a] »Die zwei werden ein Fleisch sein.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »denn, sagt er«; das Zitat stammt aus 1. Mose 2,24.'
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet als rhetorische Fortführung eine Alternative zum vorherigen Gedankengang ein und bewahrt den argumentativen Zusammenhang.
- source_word: οὐκ οἴδατε
  choice: wisst ihr nicht
  rationale: Entspricht der paulinischen rhetorischen Formel und gibt οἶδα unmittelbar und natürlich wieder.
- source_word: ὁ κολλώμενος
  choice: derjenige, der sich … verbindet
  rationale: κολλάομαι bezeichnet hier ein Sich-Verbinden beziehungsweise Sich-Anschließen; die reflexive Formulierung ist im sexuellen Zusammenhang klar, ohne über den Wortlaut hinauszugehen.
- source_word: τῇ πόρνῃ
  choice: mit einer Prostituierten
  rationale: πόρνη bezeichnet spezifisch eine Prostituierte; der griechische Artikel ist hier generisch, weshalb im Deutschen der unbestimmte Artikel natürlich ist.
- source_word: ἓν σῶμά ἐστιν
  choice: ein Leib mit ihr ist
  rationale: Bewahrt den körperlich-theologischen Ausdruck »ein Leib« und macht die im Griechischen implizite Beziehung idiomatisch deutlich.
- source_word: Ἔσονται γάρ
  choice: Denn … werden … sein
  rationale: Das Futur von εἰμί mit εἰς kann ein Ergebnis ausdrücken; »werden … sein« hält sich eng an die Form und klingt im Zitat würdig und verständlich.
- source_word: φησίν
  choice: es heißt
  rationale: Das unbestimmte griechische »er/sie/es sagt« führt ein Schriftzitat ein. »Es heißt« ist im Deutschen natürlich und vermeidet, einen im Text nicht genannten Sprecher festzulegen.
- source_word: οἱ δύο
  choice: Die zwei
  rationale: Gibt die substantivierte Zahl direkt und knapp wieder.
- source_word: εἰς σάρκα μίαν
  choice: ein Fleisch
  rationale: Bewahrt die feste, konkrete und relationale Wendung aus Genesis 2,24, ohne σάρξ als »sündige Natur« umzudeuten.
theological_decisions:
- issue: Bedeutung des Genesis-Zitats für die sexuelle Verbindung außerhalb der Ehe
  choice: Das Zitat begründet unmittelbar die Aussage, dass die sexuelle Verbindung mit einer Prostituierten eine reale leibliche Einheit schafft.
  alternative: Das Zitat ausschließlich auf die Ehe beziehen oder zusätzliche moraltheologische Folgerungen ausdrücklich in die Übersetzung aufnehmen.
  rationale: Paulus wendet Genesis 2,24 hier analog auf den Verkehr mit einer Prostituierten an. Die Übersetzung bewahrt diese Spannung, ohne die Aussage auszuweiten oder abzuschwächen.
- issue: Nicht genannter Sprecher bei φησίν
  choice: Unpersönlich mit »es heißt« wiedergeben und die Herkunft des Zitats in einer Fußnote nennen.
  alternative: »Er sagt«, »Gott sagt« oder »die Schrift sagt«.
  rationale: Das Griechische nennt das Subjekt nicht ausdrücklich. »Es heißt« wahrt diese Offenheit; die Fußnote liefert die sachliche Querverbindung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Leib« und »Fleisch« bleiben als unterschiedliche griechische Schlüsselbegriffe erhalten. Die Satzstellung ist natürlich, ohne die rhetorische Schärfe oder die Spannung zwischen sexueller Verbindung und dem Genesis-Zitat abzuschwächen.
