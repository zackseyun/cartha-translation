  source_fidelity: 'Der Vers gibt die wesentlichen griechischen Ausdrücke treffend wieder: κολλώμενος als reflexives Sich-Verbinden, πόρνῃ als „einer Prostituierten“, ἓν σῶμα als „ein Leib“ und die Genesisformel als „ein Fleisch“. Die unpersönliche Haupttextformulierung „es heißt“ glättet φησίν jedoch stärker als nötig; die Fußnote kennzeichnet zugleich eine wörtliche Formulierung, die im Haupttext nicht steht.'
