reference: 1 Corinthians 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: de
  text: 'Oder wisst ihr nicht, dass die Ungerechten das Reich Gottes nicht erben werden? Täuscht euch nicht: Weder Menschen, die sexuell unmoralisch leben, noch Götzendiener, noch Ehebrecher, noch verweichlichte Männer[a] noch Männer, die mit Männern Geschlechtsverkehr haben,[b] werden es erben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „weiche Männer“. Gemeint sein können verweichlichte oder weiblich auftretende Männer, moralisch willensschwache Männer oder in diesem Zusammenhang möglicherweise männliche Prostituierte beziehungsweise passive Partner beim Geschlechtsverkehr zwischen Männern. Die genaue Bedeutung ist umstritten.
    reason: lexical_alternative
  - marker: b
    text: Das seltene griechische Wort kann auch mit „Männer, die unerlaubten Sex mit männlichen Personen haben“ wiedergegeben werden. Viele bringen es mit dem griechischen Wortlaut von 3. Mose 18,22 und 20,13 in Verbindung; ob es jede männlich-männliche sexuelle Handlung oder enger ausbeuterische beziehungsweise verbotene Formen bezeichnet, ist umstritten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Oder
  rationale: Leitet eine zugespitzte rhetorische Fortführung des vorherigen Gedankens ein.
- source_word: οὐκ οἴδατε
  choice: wisst ihr nicht
  rationale: Bewahrt die für Paulus typische rhetorische Frage und gibt οἶδα direkt und natürlich wieder.
- source_word: ἄδικοι
  choice: die Ungerechten
  rationale: Bezeichnet eine umfassende moralische Kategorie und nicht nur einzelne unrechte Handlungen.
- source_word: θεοῦ βασιλείαν
  choice: das Reich Gottes
  rationale: Entspricht der Genitivverbindung und bewahrt die vertraute biblische Ausdrucksweise.
- source_word: οὐ κληρονομήσουσιν
  choice: nicht erben werden
  rationale: Bewahrt die mit κληρονομέω verbundenen Bundes- und Zukunftsanklänge.
- source_word: μὴ πλανᾶσθε
  choice: Täuscht euch nicht
  rationale: Im Deutschen ist die reflexive Warnung knapp und natürlich; sie lässt sowohl Selbsttäuschung als auch Irreführung im Hintergrund anklingen.
- source_word: πόρνοι
  choice: Menschen, die sexuell unmoralisch leben
  rationale: Gibt den breiten sexuellen Sinn wieder, ohne das veraltete oder enger wirkende „Unzüchtige“ zu verwenden.
- source_word: εἰδωλολάτραι
  choice: Götzendiener
  rationale: Direkte, geläufige und prägnante Entsprechung.
- source_word: μοιχοὶ
  choice: Ehebrecher
  rationale: Gibt den ausdrücklich auf Ehebruch bezogenen Begriff genau wieder.
- source_word: μαλακοὶ
  choice: verweichlichte Männer
  rationale: Bleibt nahe am Grundsinn „weich“ und legt die in diesem Zusammenhang umstrittene genauere Bedeutung nicht stillschweigend fest.
- source_word: ἀρσενοκοῖται
  choice: Männer, die mit Männern Geschlechtsverkehr haben
  rationale: Gibt die wahrscheinlich gemeinte männlich-männliche sexuelle Handlung beschreibend wieder, ohne eine moderne Identitätskategorie einzuführen.
theological_decisions:
- issue: Bedeutung von μαλακοί in der Lasterliste
  choice: verweichlichte Männer
  alternative: passive Partner beim Geschlechtsverkehr zwischen Männern; männliche Prostituierte; moralisch willensschwache Männer
  rationale: Der Ausdruck bedeutet wörtlich „weich“ und kann Verweichlichung, weiblich konnotiertes Auftreten, moralische Schwäche oder in sexuellem Zusammenhang möglicherweise die passive Rolle beim Verkehr zwischen Männern bezeichnen. Die Hauptfassung bewahrt diese Unschärfe; die Fußnote dokumentiert die engeren Deutungen.
- issue: Bedeutung von ἀρσενοκοῖται
  choice: Männer, die mit Männern Geschlechtsverkehr haben
  alternative: Männer, die unerlaubten Sex mit männlichen Personen haben; Männer, die andere Männer sexuell ausbeuten
  rationale: Das seltene Wort wird häufig mit dem griechischen Wortlaut von 3. Mose 18,22 und 20,13 verbunden. Seine genaue Reichweite ist dennoch umstritten; deshalb wird eine handlungsbezogene, nicht identitätsbezogene Formulierung verwendet und die Debatte in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe und die wiederholte Struktur der Lasterliste bleiben erhalten. Der abschließende Zusatz „werden es erben“ vervollständigt die im Griechischen elliptische Aufzählung für natürliches Deutsch, ohne den Sinn zu verändern. Bei den beiden umstrittenen Bezeichnungen wird moderne Identitätssprache vermieden und die lexikalische Unsicherheit ausdrücklich in Fußnoten bewahrt.
