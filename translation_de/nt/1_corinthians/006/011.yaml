id: 1CO.6.11
reference: 1 Corinthians 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: de
  text: Und solche waren einige von euch. Aber ihr wurdet reingewaschen[a], aber ihr wurdet geheiligt, aber ihr wurdet gerecht gesprochen – im Namen des Herrn Jesus und im Geist unseres Gottes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Form kann auch reflexiv verstanden werden: „ihr habt euch reingewaschen“. Im Zusammenhang mit „ihr wurdet geheiligt“ und „ihr wurdet gerecht gesprochen“ wird sie häufig als Teil einer Folge von Gottes rettendem Handeln verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch den Geist unseres Gottes“. Das griechische „in“ kann hier auch das Mittel beziehungsweise den Handelnden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: Und solche waren einige von euch
  rationale: Die idiomatische deutsche Formulierung verweist klar auf die zuvor genannten Gruppen von Menschen und bewahrt zugleich den demonstrativen Rückbezug von ταῦτα.
- source_word: ἀλλὰ
  choice: aber
  rationale: Die dreimalige Wiederholung bewahrt den starken Kontrast und den eindringlichen Rhythmus des griechischen Textes.
- source_word: ἀπελούσασθε
  choice: ihr wurdet reingewaschen
  rationale: Die passive Wiedergabe fügt sich in die Folge der beiden eindeutig passiven Verben ein und bezeichnet eine wirksame Reinigung; die mögliche reflexive Deutung der griechischen Mittelform wird in einer Fußnote erhalten.
- source_word: ἡγιάσθητε
  choice: ihr wurdet geheiligt
  rationale: „Geheiligt“ ist präzise, verständlich und wahrt die Verbindung zum neutestamentlichen Wortfeld von Heiligkeit und Heiligung.
- source_word: ἐδικαιώθητε
  choice: ihr wurdet gerecht gesprochen
  rationale: Die Formulierung gibt den rechtfertigenden beziehungsweise forensischen Sinn von δικαιόω in natürlichem modernem Deutsch wieder, ohne das Verb mit einer bloßen moralischen Veränderung gleichzusetzen.
- source_word: ἐν τῷ ὀνόματι
  choice: im Namen
  rationale: Die feste deutsche Wendung wahrt die Offenheit von ἐν für Sphäre, Autorität und Mittel.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: im Geist unseres Gottes
  rationale: Die formnahe Wiedergabe erhält die Parallelität der beiden ἐν-Fügungen und legt deren genaue semantische Funktion nicht unnötig fest.
theological_decisions:
- issue: Diathese und Handelnder bei ἀπελούσασθε
  choice: 'Passivisch: „ihr wurdet reingewaschen“'
  alternative: 'Reflexiv: „ihr habt euch reingewaschen“'
  rationale: Die Mittelform lässt eine reflexive Nuance zu; die anschließenden Passivformen sprechen jedoch dafür, die Reinigung als Teil einer Folge rettenden Handelns wiederzugeben. Die Alternative bleibt ausdrücklich in der Fußnote sichtbar.
- issue: Bedeutung von ἐν beim Geist Gottes
  choice: „im Geist unseres Gottes“
  alternative: „durch den Geist unseres Gottes“
  rationale: „Im Geist“ bewahrt die grammatische Parallelität und die mögliche räumlich-sphärische Bedeutung; „durch den Geist“ bringt die ebenfalls mögliche instrumentale Bedeutung deutlicher zum Ausdruck.
- issue: Referenz von πνεῦμα
  choice: Gottes Geist
  alternative: eine allgemein geistliche Sphäre
  rationale: Die Genitivverbindung „Geist unseres Gottes“ bezeichnet im paulinischen Zusammenhang am natürlichsten Gottes Geist; die Übersetzung fügt dennoch nicht ausdrücklich „Heiliger“ hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „aber“ ist bewusst beibehalten, um den rhetorischen Nachdruck des Originals hörbar zu machen. „Reingewaschen“ und „gerecht gesprochen“ sind verständliche, zugleich theologisch präzise Formulierungen.
