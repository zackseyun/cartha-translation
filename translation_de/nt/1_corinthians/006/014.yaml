id: 1CO.6.14
reference: 1 Corinthians 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: de
  text: Gott aber hat den Herrn auferweckt und wird auch uns durch seine Macht auferwecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ verbindet den Satz mit dem vorausgehenden Gedankengang und trägt hier zugleich eine leichte Gegenüberstellung; „aber“ gibt diese Nuance im Deutschen knapp und natürlich wieder.
- source_word: θεὸς
  choice: Gott
  rationale: Die übliche und kontextgemäße Wiedergabe von θεός; Gott ist ausdrücklich das handelnde Subjekt der Auferweckung.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος bezeichnet hier Jesus als christologischen Titel; „der Herr“ ist die etablierte, würdevolle Wiedergabe.
- source_word: ἤγειρεν
  choice: hat … auferweckt
  rationale: Der Aorist bezeichnet Gottes geschehene Auferweckung Jesu von den Toten. Das Perfekt ist im modernen Deutschen für dieses vergangene, gegenwartsrelevante Handeln natürlich.
- source_word: ἡμᾶς
  choice: uns
  rationale: Das Pronomen bezeichnet Paulus und die angesprochenen Glaubenden einschließlich.
- source_word: ἐξεγερεῖ
  choice: wird … auferwecken
  rationale: Das Futur bezeichnet die künftige Auferweckung. „Auferwecken“ wahrt die klare Parallele zu Gottes Auferweckung des Herrn, ohne einen unbelegten Bedeutungsunterschied durch das Präfix ἐξ- zu konstruieren.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: durch seine Macht
  rationale: διά mit Genitiv bezeichnet hier das Mittel, durch das Gott handelt. „Durch seine Macht“ ist präzise und idiomatisch.
theological_decisions:
- issue: Bezug der künftigen Auferweckung
  choice: künftige leibliche Auferweckung der Glaubenden
  alternative: allgemeine göttliche Rechtfertigung oder bildliche geistliche Erweckung
  rationale: Der unmittelbare Zusammenhang handelt vom Leib (1 Kor 6,13–20), und die Parallele zur Auferweckung des Herrn spricht deutlich für die wirkliche künftige Auferweckung der Glaubenden. Die Übersetzung belässt diese Aussage knapp, ohne sie erklärend auszubauen.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdevollem Bibelstil. Die parallele Satzstruktur des Griechischen bleibt sichtbar; es sind keine Fußnoten erforderlich.
