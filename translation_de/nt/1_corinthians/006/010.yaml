    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: Diebe
  rationale: Die geläufige und genaue deutsche Bezeichnung für Menschen, die stehlen; sie passt zum knappen Stil der Lasterliste.
- source_word: πλεονέκται
  choice: Habgierige
  rationale: Bezeichnet Menschen, die von dem Verlangen geprägt sind, immer mehr zu besitzen oder zu gewinnen. „Habgierige“ ist im heutigen Deutsch verständlich und bewahrt den charakterisierenden Sinn.
- source_word: μέθυσοι
  choice: Trunkenbolde
  rationale: Das Substantiv bezeichnet Menschen, deren Lebensweise von Trunkenheit geprägt ist, nicht jeden, der sich einmal betrunken hat. „Trunkenbolde“ gibt die knappe Form der Lasterliste wieder.
- source_word: λοίδοροι
  choice: Menschen, die andere beschimpfen
  rationale: Der Ausdruck meint Personen, die andere verbal herabsetzen oder beleidigen. Die Umschreibung ist moderner und genauer als das engere „Verleumder“.
- source_word: ἅρπαγες
  choice: Ausbeuter
  rationale: Das Wort bezeichnet Menschen, die an sich reißen und andere zum eigenen Vorteil ausnutzen. „Ausbeuter“ hält diese räuberisch-ausnutzende Bedeutungsbreite offen, ohne sie auf körperlichen Raub oder Erpressung zu beschränken.
- source_word: βασιλείαν θεοῦ
  choice: das Reich Gottes
  rationale: Die etablierte deutsche Wiedergabe bewahrt sowohl den Gedanken von Gottes Herrschaft als auch den eines Reiches, an dem Menschen Anteil erhalten.
- source_word: κληρονομήσουσιν
  choice: werden … erben
  rationale: Bewahrt das Bild vom Erbe und damit den eschatologischen Gedanken, künftig Anteil am Reich Gottes zu erhalten.
theological_decisions:
- issue: Charakterisierende Kraft der Lasterliste
  choice: Die Personenbezeichnungen werden als Bezeichnungen für Menschen wiedergegeben, die durch die genannten Verhaltensweisen gekennzeichnet sind.
  alternative: Die Aussage auf jeden einzelnen entsprechenden Fehltritt zu beziehen.
  rationale: Die substantivischen Pluralformen bezeichnen in einer Lasterliste Personengruppen. Zusätze wie „unbußfertig“ oder „dauerhaft“ werden dennoch nicht in den Haupttext eingefügt, weil sie nicht ausdrücklich im griechischen Wortlaut stehen.
- issue: Erben des Reiches Gottes
  choice: Das Erbbild bleibt im Haupttext erhalten.
  alternative: 'Sinngemäß: „werden keinen Anteil am Reich Gottes erhalten“.'
  rationale: „Erben“ bewahrt die biblisch-theologische Spannung zwischen zukünftiger Gabe, Zugehörigkeit und Anteil, ohne das Bild erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Konstruktion „weder … noch“ bildet die Aufzählung natürlich ab. Die ersten drei Glieder bleiben knapp und nominal; bei λοίδοροι dient eine verständliche Umschreibung der lexikalischen Genauigkeit. Keine konfessionellen Deutungszusätze wurden in den Text aufgenommen.
