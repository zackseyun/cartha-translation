    rationale: ἅρπαγες bezeichnet primär Personen, die an sich reißen bzw. rauben; es kann im Kontext ausbeuterisches oder erpresserisches Vorgehen umfassen. „Ausbeuter“ allein kann auch nicht-räuberische Formen wirtschaftlicher oder sozialer Ausnutzung meinen und verdeckt die Kernkomponente des Aneignens.
  - severity: low
