base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: de
  text: weder Diebe noch Habgierige[a], noch Trunkenbolde, noch Menschen, die andere beschimpfen[b], noch Räuber[c] werden das Reich Gottes erben[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Habsüchtige“ beziehungsweise „Menschen, die immer mehr haben wollen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schmäher“; gemeint sind Menschen, die andere beleidigen und verbal herabsetzen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Erpresser“ beziehungsweise „Ausbeuter“. Das griechische Wort bezeichnet Menschen, die an sich reißen oder sich auf räuberische bzw. ausbeuterische Weise bereichern.'
    reason: lexical_alternative
