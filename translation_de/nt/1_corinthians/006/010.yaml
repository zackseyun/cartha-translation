  source_fidelity: Der Entwurf gibt alle sechs griechischen Personengruppen und die Zukunftsaussage σωiegend wieder. „Ausbeuter“ ist als Wiedergabe von ἅρπαγες vertretbar, kann im heutigen Deutsch jedoch zu allgemein sein und die Grundbedeutung des gewaltsamen bzw. räuberischen Aneignens abschwächen. „Menschen, die andere beschimpfen“ trifft λοίδοροι präzise, ohne es unzulässig auf Verleumdung einzuengen.
  naturalness: Die Satzstruktur mit einem zweiten „weder“ nach dem Komma wirkt in der deutschen Reihung etwas uneinheitlich. Eine durchgehende Folge von „weder … noch … noch“ ist natürlicher und bildet die griechische Negationsreihe klar ab. „Trunkenbolde“ ist verständlich, aber leicht salopp; „Trinker“ kann dagegen bloß regelmäßigen Alkoholkonsum bezeichnen. Die Beibehaltung von „Trunkenbolde“ ist daher hier möglich.
  terminology: „Habgierige“, „Reich Gottes“ und „erben“ sind treffend und registergerecht. Für ἅρπαγες ist „Räuber“ als Haupttextwort quellennäher und klar vom vorhergehenden „Diebe“ unterscheidbar, sofern die Fußnote die weitergehende ausbeuterisch-erpresserische Nuance erläutert.
