source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: de
  text: Oder wisst ihr nicht, dass die Heiligen die Welt richten werden? Und wenn die Welt durch euch[a] gerichtet wird, seid ihr dann etwa unfähig, die geringsten Streitfälle[b] zu entscheiden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter euch“. Die griechische Wendung kann wörtlicher so verstanden werden; im Zusammenhang geht es darum, dass die Heiligen am Gericht über die Welt beteiligt sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über die unbedeutendsten Rechtssachen“. Das griechische Wort kann ein Gericht beziehungsweise eine Rechtssache bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet als rhetorische Alternative die Fortführung des vorherigen Arguments ein und bewahrt den scharfen Gedankengang.
- source_word: οὐκ οἴδατε
  choice: wisst ihr nicht
  rationale: Gibt die bei Paulus übliche rhetorische Formel eng und zugleich idiomatisch wieder.
- source_word: οἱ ἅγιοι
  choice: die Heiligen
  rationale: Bezeichnet im paulinischen Sprachgebrauch gewöhnlich die zu Gott gehörenden Gläubigen insgesamt, nicht eine später kanonisierte Sondergruppe.
- source_word: τὸν κόσμον
  choice: die Welt
  rationale: Ist die natürliche und hinreichend weite Wiedergabe von κόσμος in diesem endzeitlichen Gerichtszusammenhang.
- source_word: κρινοῦσιν
  choice: richten werden
  rationale: Bewahrt sowohl den gerichtlichen Kern von κρίνω als auch die Zukunftsform, ohne die genaue Art der Beteiligung festzulegen.
- source_word: ἐν ὑμῖν
  choice: durch euch
  rationale: Bringt im Deutschen die instrumentale beziehungsweise assoziative Bedeutung im Zusammenhang klar zum Ausdruck; die wörtlichere Möglichkeit „unter euch“ wird in einer Fußnote bewahrt.
- source_word: κρίνεται
  choice: gerichtet wird
  rationale: Entspricht dem Passiv und passt im Bedingungssatz zur allgemein beziehungsweise zukünftig verstandenen Aussage.
- source_word: ἀνάξιοί ἐστε
  choice: seid ihr dann nicht würdig
  rationale: Bewahrt den wertenden Gehalt von ἀνάξιος und formuliert die rhetorische Frage natürlich auf Deutsch.
- source_word: κριτηρίων ἐλαχίστων
  choice: über die geringsten Streitfälle zu urteilen
  rationale: Im Kontext geht es eher um geringfügige Rechtssachen als um räumlich kleine Gerichte; die Wiedergabe macht den gerichtlichen Sinn idiomatisch deutlich, ohne ausdrücklich staatliche Gerichtshöfe einzutragen.
theological_decisions:
- issue: Identität der „Heiligen“
  choice: die Gläubigen als Gottes heiliges Volk insgesamt
  alternative: eine engere Gruppe besonders heiliger Gläubiger
  rationale: Der paulinische Sprachgebrauch bezeichnet damit gewöhnlich die Christen als Gemeinschaft. Der traditionelle Ausdruck bleibt stehen, ohne eine elitäre Teilgruppe anzudeuten.
- issue: Beteiligung der Heiligen am Gericht über die Welt
  choice: wirkliche Beteiligung am zukünftigen Gericht, deren genaue Form offenbleibt
  alternative: nur metaphorische moralische Beurteilung oder völlig unabhängige richterliche Vollmacht
  rationale: Der Text behauptet die künftige Beteiligung deutlich, erklärt aber nicht ihre genaue Ausübung. Die Übersetzung wahrt diese Spannung.
- issue: Bedeutung von ἐν ὑμῖν
  choice: 'instrumental beziehungsweise assoziativ: „durch euch“'
  alternative: 'lokal: „unter euch“'
  rationale: Der argumentative Zusammenhang betont die Beteiligung der Heiligen am Richten. Weil die griechische Präposition auch wörtlicher lokal verstanden werden kann, wird diese Möglichkeit nicht verschwiegen, sondern vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Heiligen“ wahrt den paulinischen Sammelbegriff; der Kontext verhindert das Missverständnis einer kanonisierten Elite. Die zweite Frage wurde idiomatisch entfaltet, damit κριτήριον nicht missverständlich als bloßer Gerichtsort erscheint.
