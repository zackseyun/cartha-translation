  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: de
  text: Wer sich dagegen mit dem Herrn verbindet[a], ist mit ihm[b] ein Geist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Herrn verbunden ist“ beziehungsweise „dem Herrn anhängt“. Die griechische Form kann reflexiv oder passivähnlich verstanden werden und bezeichnet eine enge Bindung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht nur: „ist ein Geist“. „Mit ihm“ ist im Griechischen aus dem Zusammenhang mit dem Herrn erschließbar und wurde zur Verdeutlichung ergänzt.'
    reason: lexical_alternative
  - marker: c
    text: „Geist“ kann hier die geistliche Einheit des Menschen mit dem Herrn bezeichnen; manche beziehen „Geist“ auf den Heiligen Geist. Anders als im Englischen lässt sich diese Auslegungsfrage im Deutschen nicht durch Groß- oder Kleinschreibung anzeigen, da Substantive immer großgeschrieben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: sich mit … verbindet
  rationale: Das Partizip bezeichnet eine enge Bindung oder Verbindung. Die reflexive Formulierung ist im modernen Deutsch natürlich und bewahrt im Zusammenhang den Kontrast zur leiblichen Verbindung in Vers 16, ohne eine bloß lockere Zugehörigkeit auszudrücken.
- source_word: τῷ κυρίῳ (κύριος)
  choice: mit dem Herrn
  rationale: „Herr“ entspricht dem paulinischen Gebrauch und bezeichnet hier den auferstandenen Jesus. Die Präposition „mit“ ergibt sich idiomatisch aus dem deutschen Verb „sich verbinden“.
- source_word: ἓν
  choice: ein
  rationale: Das Zahlwort drückt Einheit aus, nicht lediglich Übereinstimmung oder ein gemeinsames Ziel.
- source_word: πνεῦμα
  choice: Geist
  rationale: „Geist“ gibt πνεῦμα unmittelbar wieder. Da deutsche Substantive stets großgeschrieben werden, kann die Schreibung die Frage, ob hier der menschliche Geist, eine geistliche Einheit oder der Heilige Geist gemeint ist, nicht entscheiden.
- source_word: ὁ δὲ … ἐστιν
  choice: Wer sich dagegen …, ist
  rationale: Der substantivierte Singular wird durch das im Deutschen allgemein und inklusiv verwendbare „wer“ natürlich wiedergegeben. „Dagegen“ macht den Kontrast zum vorangehenden Satz deutlich.
theological_decisions:
- issue: Art der mit „ein Geist“ bezeichneten Einheit
  choice: Die Formulierung beschreibt eine wirkliche geistliche Einheit mit dem Herrn, ohne die Unterscheidung zwischen Mensch und Herrn aufzuheben.
  alternative: Mystische Wesensverschmelzung; oder lediglich gleiche Gesinnung und gemeinsames Ziel
  rationale: Paulus stellt die leibliche Vereinigung aus Vers 16 der Verbindung mit dem Herrn gegenüber. „Mit ihm ein Geist“ wahrt die Stärke dieser Aussage, ohne eine Identität der Beteiligten festzulegen.
- issue: Ergänzung von „mit ihm“
  choice: „mit ihm“ wird zur Verdeutlichung in den Text aufgenommen.
  alternative: 'Wörtlicher: „ist ein Geist“'
  rationale: Im Griechischen ist das Gegenüber der Einheit aus „mit dem Herrn“ erschließbar. Die Ergänzung macht die Beziehung im Deutschen eindeutig und vermeidet ein unvollständig wirkendes Prädikat.
- issue: Bezug von πνεῦμα
  choice: Die Übersetzung lässt „Geist“ stehen und erläutert die Auslegungsfrage in einer Fußnote.
  alternative: Explizit „mit ihm geistlich eins“ oder „ein Geist im Heiligen Geist“
  rationale: Der griechische Text selbst enthält keine Groß-/Kleinschreibung, die den Heiligen Geist eindeutig kennzeichnen würde. Eine stärker deutende Wiedergabe würde die vorhandene Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wer“ vermeidet eine unnötig männlich markierte Formulierung, bleibt aber dem substantivierten griechischen Singular entsprechend. „Sich verbinden“ ist verständlich und bewahrt den engen inhaltlichen Anschluss an Vers 16; die stärker traditionelle Möglichkeit „anhängen“ wird in der Fußnote genannt.
