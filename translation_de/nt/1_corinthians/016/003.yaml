  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: de
  text: Wenn ich dann komme, werde ich diejenigen, die ihr durch Briefe als geeignet bestätigt, nach Jerusalem schicken, damit sie eure Gabe[a] dorthin bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „eure Gnadengabe“. Das griechische Wort kann „Gnade“ bedeuten, bezeichnet hier aber die für Jerusalem bestimmte Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Wenn ich dann angekommen bin
  rationale: ὅταν mit dem Aorist Konjunktiv bezeichnet ein erwartetes zukünftiges Eintreffen. „Wenn“ gibt dies natürlich wieder; „dann“ nimmt das leicht weiterführende δέ auf, ohne einen starken Gegensatz einzutragen.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: die von euch ausgewählten Männer
  rationale: δοκιμάζω bezeichnet hier die nach Prüfung erfolgende Anerkennung beziehungsweise Auswahl der Abgesandten. „Ausgewählt“ ist im Deutschen in diesem Zusammenhang natürlich; „Männer“ macht den auf Personen bezogenen maskulinen Plural verständlich, ohne Namen oder Ämter hinzuzufügen.
- source_word: δι’ ἐπιστολῶν
  choice: mit Briefen
  rationale: διά mit Genitiv bezeichnet das begleitende Mittel. Der Inhalt der Briefe wird nicht ausdrücklich genannt; deshalb wird „Empfehlungsschreiben“ nicht in den Haupttext aufgenommen.
- source_word: τούτους πέμψω
  choice: werde ich … schicken
  rationale: τούτους greift die zuvor genannten ausgewählten Personen wieder auf. Die deutsche Satzbildung integriert das Objekt natürlich, ohne die griechische Wiederaufnahme eigens nachzubilden.
- source_word: ἀπενεγκεῖν
  choice: damit sie … dorthin bringen
  rationale: Der Infinitiv drückt den Zweck des Sendens aus. Ein Zwecksatz ist hier klares, idiomatisches Deutsch; „dorthin“ verdeutlicht das Ziel Jerusalem.
- source_word: τὴν χάριν ὑμῶν
  choice: eure Gabe
  rationale: χάρις bezeichnet im Kontext der Sammlung die konkrete Zuwendung, lässt aber den Beiklang gnädiger beziehungsweise großzügiger Güte erkennen. „Gabe“ ist würdig und verständlich; die weitere Bedeutungsnuance wird in einer Fußnote bewahrt.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei Städtenamen ist „nach“ die natürliche deutsche Wiedergabe der Zielangabe mit εἰς.
theological_decisions:
- issue: Bedeutung von χάρις im Zusammenhang der Sammlung
  choice: konkrete Gabe für Jerusalem
  alternative: Gnadengabe; Ausdruck eurer Gnade oder Großzügigkeit
  rationale: Der unmittelbare Zusammenhang handelt von der Sammlung für die Heiligen. Daher bezeichnet χάρις hier die materielle Zuwendung, ohne dass die sprachliche Verbindung zu Gnade und großzügigem Handeln völlig verloren gehen soll.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Stellung von „mit Briefen“ macht deutlich, dass die Abgesandten mit Briefen ausgestattet werden, ohne deren genaue Art über den Ausgangstext hinaus festzulegen.
