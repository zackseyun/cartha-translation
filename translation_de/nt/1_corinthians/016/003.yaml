    rationale: Das Maskulinum kann zwar im Kontext männliche Delegierte einschließen, aber der Text sagt lediglich „diejenigen, die ihr bestätigt“. Eine geschlechtliche Einschränkung ist hier nicht nötig.
  revised_text: Wenn ich dann komme, werde ich diejenigen, die ihr durch Briefe als geeignet bestätigt, nach Jerusalem schicken, damit sie eure Gabe[a] dorthin bringen.
