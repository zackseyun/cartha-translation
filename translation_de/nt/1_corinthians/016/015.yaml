source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: de
  text: 'Ich bitte euch aber, Brüder und Schwestern[a]: Ihr kennt die Hausgemeinschaft des Stephanas; sie ist die Erstlingsgabe Achajas[b], und sie haben sich dem Dienst für die Heiligen gewidmet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; die griechische Anrede kann hier die ganze Gemeinde, also Brüder und Schwestern, einschließen.
    reason: lexical_alternative
  - marker: b
    text: „Erstlingsgabe“ bezeichnet wahrscheinlich die ersten Gläubigen in Achaja und bewahrt zugleich das Bild eines ersten Anteils, der Gott gehört.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ δὲ ὑμᾶς
  choice: Ich ermahne euch aber
  rationale: παρακαλέω bezeichnet hier einen eindringlichen Appell; „ermahne“ wahrt dessen Gewicht. δέ markiert einen leichten Übergang und wird mit dem unbetonten „aber“ wiedergegeben.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die maskuline griechische Anrede kann im gemeindlichen Zusammenhang die gesamte, gemischte Gemeinde einschließen. Die inklusive deutsche Wiedergabe macht diesen kommunikativen Umfang natürlich verständlich; die Form des Griechischen wird in der Fußnote genannt.
- source_word: οἴδατε τὴν οἰκίαν Στεφανᾶ
  choice: Ihr kennt das Haus des Stephanas
  rationale: οἰκία meint hier nicht nur ein Gebäude, sondern die Hausgemeinschaft. „Haus“ bewahrt die knappe, traditionsreiche Bezeichnung und lässt diesen sozialen Umfang offen.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: die Erstlingsgabe Achajas
  rationale: „Erstlingsgabe“ erhält das Bild von ἀπαρχή und dessen mögliche Bedeutung als erster, Gott zugehöriger Anteil, statt es lediglich als „erste Bekehrte“ auszudeuten.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: dem Dienst für die Heiligen
  rationale: διακονία wird allgemein als „Dienst“ wiedergegeben, ohne ein späteres kirchliches Amt vorauszusetzen; τοῖς ἁγίοις bezeichnet die begünstigten Glaubenden.
- source_word: ἔταξαν ἑαυτούς
  choice: sie haben sich … gewidmet
  rationale: Die reflexive Wendung bezeichnet die bewusste Ausrichtung auf eine Aufgabe. „Sich widmen“ ist im Deutschen natürlich und vermittelt nachhaltigen Einsatz, ohne eine formelle Selbsternennung anzudeuten.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Im Griechischen steht die maskuline Pluralform, die als übliche Gemeindeanrede auch Frauen einschließen kann. Die Hauptfassung gibt den wahrscheinlichen Adressatenkreis wieder, während die Fußnote die formale Alternative bewahrt.
- issue: Bedeutung von ἀπαρχὴ τῆς Ἀχαΐας
  choice: die Erstlingsgabe Achajas
  alternative: die ersten Gläubigen Achajas
  rationale: Die bildhafte Sprache wird erhalten, sodass sowohl der zeitliche Vorrang als auch der mögliche Gedanke eines Gott geweihten ersten Anteils hörbar bleiben.
- issue: Numeruswechsel bei οἰκία … ἔταξαν ἑαυτούς
  choice: es ist … und sie haben sich
  alternative: sie sind … und haben sich
  rationale: Der griechische Text behandelt οἰκία zunächst grammatisch als Singular, wechselt dann beim Handeln der Mitglieder in den Plural. Die deutsche Fassung bewahrt diesen bedeutungsvollen Wechsel zwischen Hausgemeinschaft als Einheit und ihren Personen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Argumentationsfolge. „Erstlingsgabe“ ist bewusst bildhaft; „Haus“ bezeichnet kontextuell die Hausgemeinschaft. Alle Fußnotenmarker stehen im Haupttext.
