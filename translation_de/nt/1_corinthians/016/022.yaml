  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: de
  text: Wenn jemand den Herrn nicht liebt, der sei verflucht.[a] Marana tha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »Anathema«; das heißt: unter einem Fluch.'
    reason: lexical_alternative
  - marker: b
    text: 'Aramäisch. Möglicherweise: »Unser Herr, komm!« oder: »Unser Herr ist gekommen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: liebt
  rationale: φιλέω bezeichnet hier persönliche Liebe und Zuneigung zum Herrn. »liebt« ist im Deutschen natürlich und bewahrt die Aussagekraft, ohne die Art der Zuneigung unnötig einzuengen.
- source_word: κύριον
  choice: den Herrn
  rationale: κύριος ist in diesem paulinischen Zusammenhang ein christologisch gewichtiger Titel für Jesus. »Herr« bewahrt sowohl den Titelcharakter als auch den vertrauten neutestamentlichen Sprachgebrauch.
- source_word: ἤτω
  choice: der sei
  rationale: Der Imperativ Präsens von εἰμί hat hier auffordernden beziehungsweise urteilenden Sinn. Die Konstruktion »der sei« gibt diese feierlich-ernste Kraft idiomatisch wieder.
- source_word: ἀνάθεμα
  choice: verflucht
  rationale: ἀνάθεμα bezeichnet hier einen Menschen, der dem Fluch beziehungsweise dem göttlichen Gericht verfallen ist. »verflucht« ist verständliches heutiges Deutsch und bewahrt die Schärfe der Aussage; der traditionelle Ausdruck »Anathema« steht in der Fußnote.
- source_word: Μαράνα θά
  choice: Marana tha
  rationale: Die aramäische Wendung ist im griechischen Text in Umschrift erhalten. Da ihre Worttrennung und genaue Bedeutung umstritten sind, bleibt sie im Haupttext transliteriert; die wichtigsten Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung der aramäischen Wendung Μαράνα θά
  choice: Im Haupttext als »Marana tha« beibehalten.
  alternative: »Unser Herr, komm!« oder »Unser Herr ist gekommen.«
  rationale: Je nach Worttrennung und Verständnis des Aramäischen kann die Wendung als Bitte um das Kommen des Herrn oder als Aussage über sein Gekommensein verstanden werden. Die Transliteration bewahrt diese echte Mehrdeutigkeit und den liturgischen Charakter der Wendung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »der sei verflucht« bewahrt den feierlichen und urteilenden Ton des griechischen Satzes; die aramäische Formel bleibt wegen ihrer echten Mehrdeutigkeit unübersetzt.
