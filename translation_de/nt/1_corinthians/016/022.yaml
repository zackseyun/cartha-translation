  source_fidelity: Der Entwurf gibt εἴ τις οὐ φιλεῖ τὸν κύριον mit „Wenn jemand den Herrn nicht liebt“ präzise wieder. „Der sei verflucht“ wahrt die jussiv-gerichtliche Kraft von ἤτω ἀνάθεμα, ohne den Aussagegehalt unnötig zu erweitern. „Marana tha“ lässt die im griechischen Text bewahrte aramäische Formel sowie deren umstrittene Worttrennung und Deutung offen.
  naturalness: „Wenn jemand den Herrn nicht liebt, der sei verflucht“ ist würdiges, gut verständliches modernes Standarddeutsch und passt zum feierlich-gerichtlichen Register. Die Zeichensetzung und die knappe Satzfolge sind idiomatisch.
  terminology: „Herr“ bewahrt den etablierten christologisch gewichtigen Titel κύριος. „Verflucht“ ist eine klare und angemessen starke Wiedergabe von ἀνάθεμα; die Fußnote nennt den traditionellen Fachausdruck „Anathema“. Die Fußnote zu „Marana tha“ gibt die wesentlichen Deutungsmöglichkeiten neutral wieder, ohne eine strittige Auslegung festzulegen.
