base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: de
  text: Denn sie haben meinem Geist und eurem neue Kraft gegeben. Erkennt daher solche Männer an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Würdigt solche Männer“; die griechische Form ist männlich und bezieht sich hier auf die unmittelbar zuvor genannten Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: haben … erquickt
  rationale: Das Verb bezeichnet hier bildlich innere Entlastung und neue Kraft, nicht wörtliche Ruhe. „Erquickt“ bewahrt diesen Sinn prägnant und in würdigem Deutsch.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Würdigung und wird mit dem natürlichen deutschen Begründungsanschluss „Denn“ wiedergegeben.
- source_word: πνεῦμα
  choice: Geist
  rationale: Gemeint ist hier der menschliche Geist beziehungsweise das innere Befinden, nicht der Heilige Geist. „Geist“ erhält zugleich die paulinische Ausdrucksweise.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: meinen Geist und auch euren
  rationale: Beim zweiten Glied ist „Geist“ im Griechischen elliptisch ausgelassen. Die deutsche Form bewahrt die knappe Parallelität und macht die Zuordnung eindeutig.
- source_word: ἐπιγινώσκετε
  choice: Erkennt … an
  rationale: Das Verb fordert in diesem Zusammenhang nicht bloß Identifikation, sondern gebührende Anerkennung. „Anerkennen“ trifft diese Bedeutung, ohne sie zu „ehren“ zu verstärken.
- source_word: οὖν
  choice: daher
  rationale: Das Wort kennzeichnet die Folgerung aus der zuvor genannten erquickenden Wirkung ihres Dienstes.
- source_word: τοὺς τοιούτους
  choice: solche Männer
  rationale: Die maskuline Wendung verweist im unmittelbaren Zusammenhang auf die zuvor genannten Männer Stephanas, Fortunatus und Achaikus. Die Übersetzung gibt diese konkrete Referenz wieder.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von τοὺς τοιούτους
  choice: solche Männer
  alternative: solche Menschen / Menschen wie diese
  rationale: Obwohl die Wendung anderswo allgemein gebraucht werden kann, verweist sie hier auf die unmittelbar zuvor genannten männlichen Mitarbeiter. Daher wird die konkrete maskuline Referenz erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erquickt“ ist leicht gehoben, aber allgemein verständlich und bildet die bildliche innere Stärkung präziser ab als das umständliche „zur Ruhe gebracht“. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die Bedeutungsalternative bezieht.
