source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: de
  text: Darum soll ihn niemand gering schätzen. Helft ihm vielmehr, in Frieden weiterzureisen, damit er zu mir kommt; denn ich erwarte ihn mit den Brüdern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Brüder« kann hier auch eine weitere Gruppe von Glaubensgeschwistern oder Mitarbeitenden einschließen, darunter Frauen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: Darum soll ihn niemand
  rationale: μή mit dem Aorist Konjunktiv formuliert ein Verbot; »darum« gibt den folgernden Zusammenhang von οὖν natürlich wieder.
- source_word: ἐξουθενήσῃ
  choice: geringschätzen
  rationale: Das Verb bezeichnet, jemanden für unbedeutend zu halten oder verächtlich zu behandeln. »Geringschätzen« bewahrt sowohl die innere Bewertung als auch den starken abwertenden Sinn.
- source_word: προπέμψατε
  choice: Helft ihm … weiterzureisen
  rationale: Das Verb kann das Geleitgeben und die praktische Unterstützung für die Weiterreise bezeichnen. Die Formulierung macht diesen Reisesinn im heutigen Deutsch verständlich.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Die relativ formnahe Wendung bezeichnet hier eine friedliche, ungehinderte und wohlwollend unterstützte Abreise.
- source_word: ἵνα ἔλθῃ πρός με
  choice: damit er zu mir kommt
  rationale: ἵνα mit dem Konjunktiv drückt hier den Zweck der Unterstützung bei seiner Weiterreise aus.
- source_word: ἐκδέχομαι
  choice: ich erwarte
  rationale: Das Präsens bezeichnet eine gegenwärtige, fortdauernde Erwartung.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: zusammen mit den Brüdern
  rationale: ἀδελφῶν ist grammatisch maskuliner Plural. Die Übersetzung wahrt diese Form, ohne durch eine Paraphrase vorab zu entscheiden, ob ausschließlich Männer oder eine breitere Gruppe von Glaubensgeschwistern gemeint ist.
theological_decisions:
- issue: Bezug und Umfang von μετὰ τῶν ἀδελφῶν
  choice: zusammen mit den Brüdern
  alternative: zusammen mit den Brüdern und Schwestern / zusammen mit den Glaubensgeschwistern
  rationale: Der griechische Ausdruck ist maskuliner Plural, kann im frühchristlichen Sprachgebrauch aber je nach Referent auch eine gemischte Gruppe von Glaubenden oder Mitarbeitenden einschließen. Die Hauptübersetzung bewahrt die grammatische Form; die Fußnote hält den möglichen inklusiven Bezug offen.
- issue: Syntaktischer Bezug von μετὰ τῶν ἀδελφῶν
  choice: Paul erwartet Timotheus zusammen mit den Brüdern
  alternative: Paul erwartet Timotheus, der zusammen mit den Brüdern kommt
  rationale: Die unmittelbare Stellung bei ἐκδέχομαι αὐτόν legt nahe, dass Paulus ihn gemeinsam mit den Brüdern erwartet. Eine Zuordnung der Brüder zu Timotheus als Reisebegleiter ist sprachlich möglich, wird aber nicht ausdrücklich festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Helft ihm … weiterzureisen« ist natürlicher als das missverständliche »Schickt ihn weiter« und gibt den unterstützenden Reisesinn von προπέμπω wieder. Das Semikolon hält den Begründungszusammenhang klar.
