  text: The grace of the Lord Jesus be with you.
translation:
  language: de
  text: Die Gnade des Herrn Jesus sei mit euch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ ist die etablierte und sachlich passende Wiedergabe des paulinischen Segensbegriffs; sie bezeichnet hier die unverdiente Zuwendung und den Segen des Herrn.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ entspricht dem neutestamentlichen Titelgebrauch und bewahrt dessen christologisches Gewicht; „Gebieter“ wäre in dieser Segensformel weniger natürlich.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: μεθ’ ὑμῶν
  choice: sei mit euch
  rationale: Wörtlich steht nur „mit euch“. Das ergänzte „sei“ bringt den im griechischen Segenswunsch vorausgesetzten verbalen Sinn in natürlichem Deutsch zum Ausdruck.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: des Herrn Jesus
  rationale: Der Genitiv wird als Zugehörigkeits- beziehungsweise Herkunftsangabe innerhalb der Nominalgruppe bewahrt. So bleibt die griechische Struktur erkennbar, ohne die mögliche Herkunftsbedeutung unnötig festzulegen.
theological_decisions:
- issue: Verblose Segensformel
  choice: Das im Griechischen ausgelassene Verb wird als „sei“ ergänzt.
  alternative: „Die Gnade des Herrn Jesus mit euch.“
  rationale: Die Ergänzung macht den Segenswunsch im Deutschen vollständig und natürlich, ohne einen zusätzlichen theologischen Gedanken einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Segensformel ist allgemein verständlich und folgt der knappen Struktur des griechischen Textes.
