  text: ⸀ἐπιμενῶ δὲ ἐν Ἐφέσῳ ἕως τῆς πεντηκοστῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: de
  text: Ich werde aber bis Pfingsten[a] in Ephesus bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Wochenfest“.'
    reason: Lexikalische Alternative, welche die jüdische Festbezeichnung hinter πεντηκοστή ausdrücklich wiedergibt.
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: werde … bleiben
  rationale: Das Futur Aktiv von ἐπιμένω bezeichnet im Zusammenhang mit Paulus’ Reiseplänen das weitere Verweilen an einem Ort. „Bleiben“ ist im modernen Deutschen natürlich und präzise.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Gegensatz beziehungsweise Übergang gegenüber den zuvor genannten Reiseplänen. „Aber“ gibt diese Nuance knapp wieder.
- source_word: ἐν Ἐφέσῳ
  choice: in Ephesus
  rationale: ἐν mit dem Dativ ist eindeutig lokal gebraucht; der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: bis Pfingsten
  rationale: ἕως mit dem Genitiv bezeichnet den zeitlichen Endpunkt. πεντηκοστή ist die im Neuen Testament übliche Bezeichnung für das jüdische Wochenfest; „Pfingsten“ ist dafür die etablierte und verständliche deutsche Benennung.
theological_decisions: []
