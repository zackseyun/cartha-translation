source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: de
  text: 'Was aber den Bruder Apollos betrifft: Ich habe ihn nachdrücklich gebeten, mit den Brüdern zu euch zu kommen. Doch er wollte jetzt keinesfalls kommen.[a] Er wird aber kommen, wenn sich ihm eine Gelegenheit bietet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Doch es war keinesfalls Wille, dass er jetzt käme.« Gemeint ist dem Zusammenhang nach der Wille des Apollos.'
    reason: Die Fußnote bewahrt die ungewöhnliche substantivische Formulierung mit θέλημα und macht zugleich deutlich, dass der Besitzer des Willens im Griechischen nur aus dem Zusammenhang erschlossen wird.
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: Was aber Apollos, den Bruder, betrifft
  rationale: Die Formulierung gibt den Themenwechsel Περὶ δὲ natürlich wieder und bewahrt bei τοῦ ἀδελφοῦ den bestimmten Artikel, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: πολλὰ παρεκάλεσα αὐτόν
  choice: Ich habe ihn nachdrücklich gebeten
  rationale: πολλά verstärkt das Bitten bzw. Zureden. „Nachdrücklich gebeten“ ist im Deutschen natürlich und hält die Bedeutung offen zwischen eindringlicher Bitte und starkem Drängen.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: mit den Brüdern zu euch zu kommen
  rationale: Der Infinitiv gibt den Inhalt des ἵνα-Satzes idiomatisch wieder. „Brüder“ entspricht dem maskulinen Plural und bezeichnet hier wahrscheinlich die konkreten männlichen Reisegefährten.
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: Doch er wollte jetzt keinesfalls kommen
  rationale: πάντως verstärkt die Verneinung; „keinesfalls“ bringt diese Emphase zum Ausdruck. Die natürliche deutsche Verbform gibt das substantivische θέλημα verständlich wieder, während eine Fußnote die wörtlichere Struktur dokumentiert.
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: Er wird aber kommen, sobald sich ihm eine Gelegenheit bietet
  rationale: εὐκαιρέω bezeichnet eine passende oder günstige Gelegenheit. Die Wendung vermeidet den Beiklang bloßer persönlicher Bequemlichkeit; „sobald“ gibt den unbestimmten künftigen Zeitpunkt flüssig wieder.
theological_decisions:
- issue: Bezug von οὐκ ἦν θέλημα
  choice: Die Aussage bezieht sich auf den Willen des Apollos.
  alternative: Es war nicht Gottes Wille, dass Apollos jetzt kam.
  rationale: Apollos ist der nächstliegende Bezugspunkt. Der Kontext enthält keinen Hinweis auf einen Wechsel zu Gottes Willen; eine solche Deutung würde eine nicht ausdrücklich genannte theologische Aussage eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den Themenwechsel natürlich. „Den Bruder“ ist bewusst quellentreu und vermeidet das ergänzte „unseren“; „nachdrücklich gebeten“ und „sobald sich ihm eine Gelegenheit bietet“ sind idiomatische, aber semantisch eng geführte Wiedergaben.
