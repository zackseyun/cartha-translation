  text: ἐὰν δὲ ⸂ἄξιον ᾖ⸃ τοῦ κἀμὲ πορεύεσθαι, σὺν ἐμοὶ πορεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: de
  text: Und wenn es angemessen ist, dass auch ich reise,[a] werden sie mit mir reisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn es sich lohnt, dass auch ich reise“. Der griechische Ausdruck kann bezeichnen, was unter den gegebenen Umständen angemessen, gerechtfertigt oder lohnend ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Und wenn
  rationale: ἐάν leitet die Bedingung ein; δέ verbindet hier nur leicht mit dem Vorhergehenden und muss keinen deutlichen Gegensatz ausdrücken.
- source_word: ἄξιον ᾖ
  choice: es angemessen ist
  rationale: Die unpersönliche Wendung bezeichnet hier, was unter den Umständen passend, gerechtfertigt oder der Sache wert ist. „Angemessen“ passt zum praktischen Zusammenhang, ohne einen Wertmaßstab zu stark festzulegen.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: dass auch ich reise
  rationale: Der artikulierte Infinitiv benennt den Inhalt dessen, was als angemessen beurteilt wird; κἀμέ bewahrt mit „auch ich“ den additiven Sinn.
- source_word: σὺν ἐμοὶ
  choice: mit mir
  rationale: σύν mit Dativ bezeichnet schlicht die Begleitung.
- source_word: πορεύσονται
  choice: werden sie … reisen
  rationale: Das Futur bezeichnet die Reise der Beauftragten. Die Wiederholung von „reisen“ bildet die Wiederholung von πορεύεσθαι/πορεύσονται im Griechischen ab.
theological_decisions:
- issue: Sinn der Bedingung für die Teilnahme des Paulus an der Reise
  choice: Paulus sagt, dass die Beauftragten mit ihm reisen werden, falls auch seine eigene Reise als den Umständen angemessen gilt.
  alternative: Die Gabe sei bedeutend genug, dass Paulus selbst reist; oder Paulus selbst sei würdig zu reisen.
  rationale: ἄξιον ist hier unpersönlich gebraucht, und der Infinitiv bezeichnet die zu beurteilende Handlung. Die Aussage betrifft daher die Angemessenheit seiner Mitreise, nicht seine persönliche Würdigkeit. Wie genau diese Angemessenheit bestimmt wird, bleibt offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Reisen“ erhält die verbale Wiederholung des Ausgangstextes; „angemessen“ ist natürlich und bewahrt zusammen mit der Fußnote die Bedeutungsbreite von ἄξιον.
