source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: de
  text: Wenn Timotheus kommt, sorgt dafür, dass er ohne Furcht bei euch sein kann; denn er tut das Werk des Herrn, ebenso wie ich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: Wenn Timotheus kommt
  rationale: Die Verbindung aus ἐάν und Aorist Konjunktiv bezeichnet eine künftige Möglichkeit. Das schwach weiterführende δέ muss im Deutschen nicht eigens wiedergegeben werden; „Wenn“ eröffnet den Satz natürlich und ohne einen im Griechischen nicht vorhandenen zeitlichen Ausdruck.
- source_word: βλέπετε ἵνα
  choice: sorgt dafür, dass
  rationale: βλέπετε fordert hier zu tätiger Fürsorge auf, und ἵνα führt das angestrebte Ergebnis ein. „Sorgt dafür, dass“ ist im modernen Deutsch klarer und natürlicher als das wörtlichere „seht zu, dass“.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: er ohne Furcht bei euch sein kann
  rationale: Die Formulierung bewahrt den Zustand der Furchtlosigkeit in Timotheus’ Gegenwart bei der Gemeinde. „sein kann“ gibt den durch ἵνα und den Konjunktiv bezeichneten angestrebten Zustand idiomatisch wieder, ohne ihn bloß als inneres Sicherheitsgefühl auszulegen.
- source_word: τὸ ἔργον κυρίου ἐργάζεται
  choice: er tut das Werk des Herrn
  rationale: Die bewusste Wiederholung von ἔργον und ἐργάζεται bleibt durch „tut das Werk“ erkennbar. Der Genitiv κυρίου wird formal als „des Herrn“ wiedergegeben.
- source_word: ὡς κἀγώ
  choice: ebenso wie ich
  rationale: κἀγώ bedeutet καὶ ἐγώ, „auch ich“. Das im Griechischen ausgelassene Verb kann im Deutschen ebenfalls unausgesprochen bleiben; so bleibt die knappe Gleichstellung von Timotheus’ und Paulus’ Dienst erhalten.
theological_decisions:
- issue: Bezug von κυρίου
  choice: „des Herrn“ ohne ausdrückliche Identifizierung
  alternative: „des Herrn Jesus“
  rationale: Im paulinischen Zusammenhang ist wahrscheinlich Jesus gemeint, doch der griechische Text nennt lediglich „den Herrn“. Die Übersetzung wahrt diese Ausdrucksweise und fügt keine nähere Bestimmung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist pastoral und direkt; „sorgt dafür“ vermittelt die Verantwortung der Gemeinde, ohne unnötig amtlich oder altertümlich zu klingen.
