  variant: modern standard German
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: de
  text: 'Was aber die Sammlung für die Heiligen[a] betrifft: Wie ich die Gemeinden Galatiens angewiesen habe, so sollt auch ihr handeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für Gottes Volk«.'
    reason: Lexikalische Alternative, die die gemeinschaftsbezogene Bedeutung von ἅγιοι verständlich macht und ein mögliches modernes Missverständnis von »Heilige« vermeidet.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Was aber … betrifft
  rationale: Leitet in natürlichem Deutsch einen neuen Themenabschnitt ein und gibt sowohl περί als auch die weiterführende Kraft von δέ wieder, ohne ein zeitliches »nun« einzufügen.
- source_word: λογείας
  choice: Sammlung
  rationale: Bezeichnet hier das Einsammeln von Geld; »Sammlung« bleibt sachlich und legt keine kultische Opferhandlung nahe.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: für die Heiligen
  rationale: Gibt Ziel beziehungsweise Empfänger der Sammlung wieder und bewahrt Paulus’ übliche Bezeichnung für die Glaubenden.
- source_word: διέταξα
  choice: ich … angeordnet habe
  rationale: Bringt die verbindliche Weisung des Verbs zum Ausdruck, ohne den unnötig schroffen Klang von »befohlen«.
- source_word: ἐκκλησίαις
  choice: Gemeinden
  rationale: Bezeichnet im paulinischen Zusammenhang örtliche christliche Gemeinschaften; »Gemeinden« ist im modernen Deutsch klarer als »Kirchen«, wenn mehrere lokale Versammlungen gemeint sind.
- source_word: Γαλατίας
  choice: Galatiens
  rationale: Übliche deutsche Form des geografischen Namens im Genitiv.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: so sollt auch ihr es tun
  rationale: Gibt den vergleichenden Bezug von οὕτως und die direktive Kraft des Aoristimperativs in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von ἅγιοι im Zusammenhang finanzieller Hilfe
  choice: die Heiligen
  alternative: Gottes Volk / die Gläubigen
  rationale: »Die Heiligen« bewahrt Paulus’ charakteristische Gemeinschaftsbezeichnung und deren theologische Kontinuität, ohne sie auf später kirchlich kanonisierte Einzelpersonen zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Themenstruktur, wird aber durch einen Doppelpunkt lesefreundlich gegliedert. »Gemeinden« ist für lokale christliche Gemeinschaften idiomatisch; »die Heiligen« bleibt als paulinischer Schlüsselbegriff erhalten und wird durch die Fußnote erläutert.
