  verdict: revise
  source_fidelity: 'Die Übertragung trifft Themenwechsel, Sammlung, Empfängerbezeichnung, Galatien und den direktiven Vergleich grundsätzlich gut. Allerdings gibt »für die Gemeinden Galatiens angeordnet« die Dativadressaten von ταῖς ἐκκλησίαις nicht korrekt wieder: Paulus hat den Gemeinden Anweisungen gegeben, nicht etwas zu ihrem Nutzen angeordnet.'
  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. Die Revision beseitigt zugleich die unidiomatische bzw. semantisch verschobene Verbindung »für die Gemeinden ... angeordnet«.
  terminology: »Sammlung«, »die Heiligen«, »Gemeinden« und »Galatiens« sind angemessen. Die Fußnotenalternative ist als lexikalisch-kommunikative Erläuterung vertretbar; die griechische Formenangabe wird auf das tatsächlich einschlägige Lemma ἅγιοι berichtigt.
  issues:
  - severity: medium
    issue: »für die Gemeinden Galatiens angeordnet«
    rationale: ταῖς ἐκκλησίαις ist Dativ und bezeichnet die Adressaten der Weisung. »Für« kann im Deutschen Nutznießer oder Zweck ausdrücken und verschiebt daher die Relation. »die Gemeinden ... angewiesen« gibt die Konstruktion und die Autorität von διέταξα sachgerecht wieder.
  - severity: low
    issue: Fußnotenbegründung nennt οἱ ἅγιοι
    rationale: Im vorliegenden Text steht τοὺς ἁγίους. Die Erklärung sollte besser neutral auf ἅγιοι verweisen, damit sie die tatsächlich zugrunde liegende Wortform nicht falsch bezeichnet.
  revised_text: 'Was aber die Sammlung für die Heiligen[a] betrifft: Wie ich die Gemeinden Galatiens angewiesen habe, so sollt auch ihr handeln.'
