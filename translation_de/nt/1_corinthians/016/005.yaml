base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: de
  text: Ich werde aber zu euch kommen, wenn ich Mazedonien durchquert habe[a]; denn ich reise durch Mazedonien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich durch Mazedonien reise“. Der griechische Aorist kann hier die Durchreise als Ganzes beziehungsweise als vor dem Besuch abgeschlossen darstellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: Ich werde kommen
  rationale: Das Futur von ἔρχομαι bezeichnet hier die beabsichtigte zukünftige Ankunft des Paulus bei den Korinthern; wegen πρὸς ὑμᾶς ist im Deutschen „zu euch kommen“ deiktisch und idiomatisch passend.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet einen leichten Übergang beziehungsweise Gegensatz zu den vorausgehenden Reiseüberlegungen; „aber“ gibt dies knapp wieder, ohne einen starken Widerspruch auszudrücken.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: πρός mit Akkusativ bezeichnet nach einem Bewegungsverb die Bewegung auf Personen zu; „zu euch“ ist die natürliche deutsche Formulierung.
- source_word: ὅταν
  choice: wenn
  rationale: ὅταν mit dem Aorist Konjunktiv bezeichnet hier einen zukünftigen Zeitpunkt; im konkreten Reiseplan ist „wenn“ natürlicher als das allgemeinere „wann immer“.
- source_word: Μακεδονίαν
  choice: Mazedonien
  rationale: Dies ist die etablierte deutsche Form des Namens der römischen Provinz.
- source_word: διέλθω
  choice: ich Mazedonien durchquert habe
  rationale: Der Aorist Konjunktiv unter ὅταν stellt die Durchreise als vor dem angekündigten Besuch abgeschlossen dar. Das deutsche Perfekt im Nebensatz bildet diese zeitliche Abfolge klar ab.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die angekündigte Reihenfolge der Reise; „denn“ bewahrt den erklärenden Zusammenhang.
- source_word: διέρχομαι
  choice: ich reise durch
  rationale: Das Präsens bezeichnet die vorgesehene beziehungsweise bereits festgelegte Reiseroute. „Ich reise durch“ ist im Deutschen natürlich und hält den Unterschied zum abgeschlossenen „durchquert habe“ aufrecht.
