  naturalness: Die Formulierung ist modernes, idiomatisches Standarddeutsch. Die Wiederholung von „Mazedonien“ ist im Deutschen zwar stilistisch markiert, aber quellentreu und im Kontext verständlich. „Durchqueren“ ist hier eine natürliche Bezeichnung für die Reise durch eine Region.
