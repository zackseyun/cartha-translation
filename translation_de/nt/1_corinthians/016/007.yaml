source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: de
  text: Denn ich möchte euch jetzt nicht im Vorbeigehen sehen; denn ich hoffe, einige Zeit bei euch zu bleiben, wenn der Herr es erlaubt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ θέλω
  choice: ich möchte … nicht
  rationale: Die Wendung bezeichnet hier Paulus’ Wunsch beziehungsweise Absicht. „Ich möchte … nicht“ klingt im modernen Deutschen natürlich und bewahrt den persönlichen Ton.
- source_word: ἄρτι
  choice: jetzt
  rationale: ἄρτι verweist auf den gegenwärtigen Zeitpunkt beziehungsweise die derzeitige Reiseplanung.
- source_word: ἐν παρόδῳ
  choice: nur im Vorbeigehen
  rationale: Die Wendung bezeichnet einen kurzen Besuch auf der Durchreise. Das ergänzte „nur“ macht im Deutschen den Gegensatz zu dem erhofften längeren Aufenthalt deutlich, ohne den Sinn zu verändern.
- source_word: ἰδεῖν
  choice: sehen
  rationale: Die wörtliche Bedeutung ist „sehen“; im Zusammenhang ist ein persönlicher Besuch gemeint. Die deutsche Formulierung bleibt sowohl natürlich als auch nah am griechischen Ausdruck.
- source_word: ἐλπίζω
  choice: ich hoffe
  rationale: Paulus äußert eine zuversichtliche Erwartung, ohne Gewissheit zu beanspruchen.
- source_word: χρόνον τινά
  choice: einige Zeit
  rationale: Der Ausdruck bezeichnet eine unbestimmte, aber nennenswerte Zeitspanne.
- source_word: ἐπιμεῖναι
  choice: zu bleiben
  rationale: ἐπιμένω bezeichnet das weitere Verweilen an einem Ort; „bleiben“ ist dafür die natürliche deutsche Entsprechung.
- source_word: πρὸς ὑμᾶς
  choice: bei euch
  rationale: In Verbindung mit „bleiben“ bezeichnet πρὸς mit Personen den Aufenthalt bei ihnen. „Bei euch“ ist im Deutschen idiomatischer als „mit euch“.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: wenn der Herr es erlaubt
  rationale: Die Bedingung stellt Paulus’ Reiseabsicht unter die Verfügung des Herrn. „Wenn“ gibt den realen Zukunftsvorbehalt des griechischen ἐάν-Satzes natürlich wieder.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die übliche Entsprechung von κύριος und lässt den im Vers nicht ausdrücklich bestimmten Referenten offen.
theological_decisions:
- issue: Referent von „der Herr“
  choice: Der Herr
  alternative: der Herr Jesus; Gott
  rationale: Der griechische Text nennt κύριος ohne nähere Bestimmung. Die Übersetzung legt daher nicht fest, ob ausdrücklich Jesus oder Gott der Vater gemeint ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem brieflichem Ton. Das Semikolon verdeutlicht den Gegensatz zwischen einem flüchtigen Besuch und einem längeren Aufenthalt; „vielmehr“ gibt diesen im Zusammenhang angelegten Gegensatz idiomatisch wieder.
