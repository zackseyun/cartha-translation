- from: Denn ich möchte euch jetzt nicht nur im Vorbeigehen[a] sehen; ich hoffe vielmehr, einige Zeit bei euch zu bleiben, wenn der Herr es erlaubt.
  to: Denn ich möchte euch jetzt nicht im Vorbeigehen sehen; denn ich hoffe, einige Zeit bei euch zu bleiben, wenn der Herr es erlaubt.
  rationale: Die Revision entfernt die nicht ausdrücklich markierte Einschränkung „nur“ und gibt das zweite γάρ mit „denn“ wieder. Damit bleibt der vorübergehende Charakter des Besuchs erhalten, ohne den begründenden Zusammenhang oder die Aussage weiter auszudeuten.
