    issue: „nur“ in „nicht nur im Vorbeigehen“
    rationale: ἐν παρόδῳ bezeichnet zwar einen flüchtigen Besuch, enthält aber kein eigenständiges „nur“. Die deutsche Konstruktion „nicht nur“ kann außerdem eine zusätzliche, nicht ausgedrückte Alternative implizieren.
  - severity: low
    issue: „vielmehr“ statt einer Begründungsverknüpfung
    rationale: Das zweite γάρ ist begründend („denn“). Zwar besteht sachlich ein Kontrast, doch „vielmehr“ formuliert ihn stärker als der griechische Wortlaut.
  revised_text: Denn ich möchte euch jetzt nicht im Vorbeigehen sehen; denn ich hoffe, einige Zeit bei euch zu bleiben, wenn der Herr es erlaubt.
