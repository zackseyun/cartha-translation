base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: de
  text: Seid wachsam, steht fest im Glauben, seid mutig[a], werdet stark[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann das zugrunde liegende griechische Bild mit „verhaltet euch wie Männer“ wiedergegeben werden; gemeint ist: Handelt mutig und entschlossen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lasst euch stärken.“ Die griechische Verbform kann passiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Seid wachsam
  rationale: Der präsentische Imperativ fordert zu anhaltender Wachsamkeit auf; die Wendung ist natürlich und bewahrt den Bildgehalt.
- source_word: στήκετε
  choice: steht fest
  rationale: στήκω bezeichnet hier bildlich standhaftes, unbeirrtes Feststehen.
- source_word: ἐν τῇ πίστει
  choice: im Glauben
  rationale: Der Artikel und der paulinische Zusammenhang erlauben ein Verständnis des Glaubens als Bereich und Inhalt christlicher Bindung; die deutsche Wendung bewahrt zugleich eine gewisse Offenheit.
- source_word: ἀνδρίζεσθε
  choice: seid mutig
  rationale: Das von ἀνήρ („Mann“) abgeleitete Verb ist eine feste Aufforderung zu mutigem, entschlossenem Handeln. Eine wörtlich geschlechtsspezifische Wiedergabe wäre im heutigen Deutsch leicht als Beschränkung auf Männer missverständlich; die Fußnote bewahrt das zugrunde liegende Bild.
- source_word: κραταιοῦσθε
  choice: werdet stark
  rationale: Die mediale/passive Form kann das Erlangen beziehungsweise Empfangen von Stärke ausdrücken. „Werdet stark“ wahrt diese Bewegungsrichtung natürlicher als das statische „seid stark“.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: im Glauben
  alternative: in dem Glauben / im christlichen Glauben
  rationale: Die Formulierung kann den überlieferten Glauben bezeichnen, ohne subjektives Vertrauen völlig auszuschließen; die Übersetzung vermeidet eine unnötige dogmatische Verengung.
- issue: Geschlechtsspezifisches Bild in ἀνδρίζεσθε
  choice: seid mutig
  alternative: verhaltet euch wie Männer
  rationale: Der idiomatische Sinn ist eine Aufforderung an die gesamte Gemeinde zu Mut. Das männliche Wortbild wird nicht in den Haupttext gezwungen, aber in der Fußnote offengelegt.
- issue: Stimme von κραταιοῦσθε
  choice: werdet stark
  alternative: lasst euch stärken / seid stark
  rationale: Die Form ist formal medial oder passiv. „Werdet stark“ erhält die Spannung zwischen Aufforderung und empfangener Stärkung, während die Fußnote die ausdrücklich passive Lesart nennt.
translation_notes:
  register: Kurze, rhythmische Imperative in modernem, würdigem Standarddeutsch. Die Übersetzung folgt dem griechischen Satzbau, wo dies natürlich bleibt, und kennzeichnet echte lexikalische beziehungsweise grammatische Alternativen in Fußnoten.
