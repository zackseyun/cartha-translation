  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: de
  text: Alle Brüder lassen euch grüßen.[a] Grüßt einander mit einem heiligen Kuss.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Brüder und Schwestern lassen euch grüßen“, da das griechische Wort hier die Glaubensgeschwister insgesamt bezeichnen kann.'
    reason: lexical_alternative
  - marker: b
    text: Der „heilige Kuss“ war unter Glaubenden eine übliche Begrüßungsform, geprägt von Heiligkeit und gegenseitiger Gemeinschaft.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: lassen … grüßen
  rationale: Im deutschen Briefstil gibt diese Wendung das Übermitteln von Grüßen natürlich wieder; der Unterschied zum anschließenden direkten Grußgebot wird idiomatisch ausgedrückt.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: Alle Brüder und Schwestern
  rationale: Das maskuline Pluralwort ἀδελφοί kann in der Gemeinde die Glaubensgeschwister beider Geschlechter bezeichnen. Die ausgeschriebene Paarform macht diesen kollektiven Sinn im heutigen Deutsch klar, ohne auf das weniger unmittelbare „Gläubigen“ auszuweichen.
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Imperativ bezeichnet das gegenseitige Begrüßen und wird knapp und natürlich wiedergegeben.
- source_word: ἀλλήλους
  choice: einander
  rationale: „Einander“ ist die übliche präzise Wiedergabe des reziproken Pronomens.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: mit einem heiligen Kuss
  rationale: Die Formulierung bewahrt sowohl die konkrete Grußhandlung als auch ihre Kennzeichnung als heilig; ἐν bezeichnet hier Mittel oder Art und Weise.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοί im Gemeindekontext
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Obwohl die griechische Form grammatisch maskulin ist, kann sie eine gemischte Gemeinschaft von Glaubensgeschwistern einschließen. Der Haupttext gibt diesen wahrscheinlichen gemeinschaftlichen Bezug verständlich wieder; die formnähere Alternative bleibt in der Fußnote erhalten.
- issue: Charakter des heiligen Kusses
  choice: Konkrete, als heilig bezeichnete Grußhandlung
  alternative: Allgemeiner Ausdruck herzlicher Gemeinschaft
  rationale: Der Text nennt ausdrücklich einen Kuss. Die Übersetzung verallgemeinert diesen nicht zu bloßer Herzlichkeit und macht auch keine über den Wortlaut hinausgehende Vorschrift über heutige Grußformen daraus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lassen euch grüßen“ ist im deutschen Briefstil natürlicher als eine formale Parallelwiedergabe beider Formen von ἀσπάζομαι. Die Paarform „Brüder und Schwestern“ verdeutlicht den möglichen inklusiven Gemeindebezug; die grammatisch formnähere Wiedergabe steht in der Fußnote.
