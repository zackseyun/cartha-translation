  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: de
  text: dass auch ihr euch solchen Menschen unterordnet und jedem, der mitarbeitet[b] und sich abmüht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als selbstständige Aufforderung: „Ordnet auch ihr euch solchen Menschen unter …“'
    reason: Die mit ἵνα eingeleitete Konstruktion hängt grammatisch vom vorherigen Vers ab, kann in einer versweisen Wiedergabe aber auch als direkte Aufforderung formuliert werden.
  - marker: b
    text: 'Oder: „als Mitarbeiter tätig ist“; auch „mit anderen zusammenarbeitet“ ist möglich.'
    reason: συνεργέω kann gemeinsames Mitarbeiten, Zusammenarbeit oder die Tätigkeit als Mitarbeiter bezeichnen.
lexical_decisions:
- source_word: ἵνα
  choice: dass
  rationale: Die Konjunktion führt den Inhalt beziehungsweise das Ziel der im vorherigen Vers begonnenen Aufforderung ein. „Dass“ bewahrt den syntaktischen Anschluss, statt den Vers zu einem selbstständigen Imperativ umzuformen.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Bewahrt die einbeziehende und leicht hervorgehobene Funktion der Wortgruppe in natürlichem Deutsch.
- source_word: ὑποτάσσησθε
  choice: euch … unterordnet
  rationale: Die reflexive Form gibt den Gedanken wieder, sich freiwillig einer anerkannten Ordnung oder Leitung unterzustellen, ohne bloß einen passiven Zustand auszudrücken.
- source_word: τοῖς τοιούτοις
  choice: solchen Menschen
  rationale: Die Wendung bezeichnet Menschen von der zuvor beschriebenen Art. Die geschlechtsneutrale Formulierung vermeidet eine sachlich unnötige Einschränkung.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: jedem, der mitarbeitet
  rationale: Die substantivierte Partizipialkonstruktion bleibt verbal wiedergegeben; „mitarbeitet“ bewahrt den Gedanken gemeinsamer Tätigkeit, ohne einen nicht genannten Arbeitsbereich zu ergänzen.
- source_word: καὶ κοπιῶντι
  choice: und sich abmüht
  rationale: „Sich abmühen“ bringt die mit κοπιάω verbundene anstrengende, hingebungsvolle Arbeit deutlicher zum Ausdruck als das allgemeinere „arbeiten“.
theological_decisions:
- issue: Art der geforderten Unterordnung
  choice: Aufforderung zur freiwilligen Unterordnung unter Menschen wie die zuvor genannten sowie unter weitere engagierte Mitarbeiter
  alternative: Allgemeines Gebot uneingeschränkter hierarchischer Unterordnung
  rationale: Der unmittelbare Zusammenhang betrifft das Haus des Stephanas und diejenigen, die sich an der Arbeit beteiligen. Die Übersetzung erhält die Stärke von ὑποτάσσησθε, ohne daraus eine umfassendere institutionelle oder absolute Gehorsamspflicht abzuleiten.
- issue: Funktion von ἵνα
  choice: Inhalt beziehungsweise Ziel der vorausgehenden Ermahnung, syntaktisch mit „dass“ angeschlossen
  alternative: 'Selbstständiger Imperativ: „Ordnet auch ihr euch … unter“'
  rationale: Beide Wiedergaben vermitteln im Zusammenhang eine Aufforderung; der Haupttext bewahrt jedoch die formale Abhängigkeit vom vorherigen Satz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Kleinschreibungsbeginn mit „dass“ zeigt den syntaktischen Anschluss an Vers 15. „Sich abmühen“ ist kräftig, aber allgemein verständlich; „solchen Menschen“ ist sachgerecht und vermeidet unnötige Geschlechtsspezifizierung.
