id: 1CO.16.19
reference: 1 Corinthians 16:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: de
  text: Die Gemeinden in Asia grüßen euch.[a] Aquila und Prisca[b] samt der Gemeinde in ihrem Haus grüßen euch herzlich im Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Asia“ bezeichnet hier die römische Provinz im Westen Kleinasiens, nicht den heutigen Kontinent Asien.
    reason: cultural_note
  - marker: b
    text: Im griechischen Text steht „Prisca“; andernorts wird sie auch „Priscilla“ genannt (zum Beispiel Apostelgeschichte 18,2.18.26; Römer 16,3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: grüßen
  rationale: ἀσπάζομαι bezeichnet hier das Grüßen beziehungsweise das Übermitteln von Grüßen. „Grüßen“ ist im Deutschen natürlich und wahrt in beiden Satzteilen die lexikalische Entsprechung.
- source_word: αἱ ἐκκλησίαι
  choice: die Gemeinden
  rationale: ἐκκλησία bezeichnet im paulinischen Sprachgebrauch örtliche christliche Versammlungen. „Gemeinden“ ist im modernen Deutsch klarer und weniger auf Gebäude bezogen als „Kirchen“.
- source_word: τῆς Ἀσίας
  choice: in Asia
  rationale: Ἀσία meint die römische Provinz Asia. „in Asia“ entspricht natürlichem deutschem Sprachgebrauch; eine Fußnote grenzt die antike Provinz vom heutigen Kontinent ab.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die feste paulinische Wendung bleibt eng am griechischen Wortlaut und bewahrt ihre theologische wie gemeinschaftliche Bedeutung, ohne sie auszudeuten.
- source_word: πολλὰ
  choice: herzlich
  rationale: Das adverbial gebrauchte πολλὰ verstärkt den Gruß. Das deutsche „herzlich“ gibt diese Intensivierung idiomatisch wieder.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Aquila und Prisca
  rationale: Die Namen werden in ihrer hier bezeugten Form wiedergegeben. Πρίσκα ist die kürzere Namensform; die ebenfalls bekannte Form „Priscilla“ wird in einer Fußnote erwähnt.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: samt der Gemeinde in ihrem Haus
  rationale: Die Formulierung gibt die Hausgemeinde eng und natürlich wieder. Sie vermeidet im Haupttext die ausdrückliche Ergänzung „die sich versammelt“, obwohl diese sachlich naheliegt.
theological_decisions:
- issue: Bedeutung von ἐκκλησία im häuslichen Umfeld
  choice: „die Gemeinde in ihrem Haus“ bezeichnet eine örtliche christliche Gemeinde, die mit dem Haus von Aquila und Prisca verbunden ist
  alternative: bloß der Haushalt beziehungsweise die Familie von Aquila und Prisca
  rationale: Der paulinische Gebrauch von ἐκκλησία und die Wendung κατ’ οἶκον sprechen am ehesten für eine Gemeinde, die in einem Privathaus zusammenkommt. Die knappe Übersetzung wahrt dabei die Ausdrucksweise des Ausgangstextes.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und sachlich angemessene Wiedergabe von κύριος in dieser paulinischen Formel und erhält deren christologischen und gemeinschaftlichen Gehalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gemeinden“ vermeidet die mögliche Vorstellung von Kirchengebäuden. Die Satzstellung hält die beiden Grüße klar auseinander; „herzlich“ gibt die Verstärkung durch πολλὰ idiomatisch wieder.
