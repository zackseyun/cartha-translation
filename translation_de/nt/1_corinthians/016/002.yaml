    rationale: Die deutsche Wendung verweist gewöhnlich auf das persönliche Wohlergehen. εὐοδῶται bezeichnet hier das Gelingen bzw. die wirtschaftliche Möglichkeit, nach der sich der zurückgelegte Betrag richtet.
  - severity: low
    issue: Die Ambiguität von „bei sich“ ist nicht durch eine Fußnote kenntlich gemacht.
    rationale: παρ’ ἑαυτῷ kann „bei/für sich selbst“ und möglicherweise eine private bzw. häusliche Aufbewahrung meinen. Der Text soll keine dieser Deutungen als sicher festlegen.
