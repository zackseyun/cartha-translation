base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: de
  text: An jedem ersten Tag der Woche soll jeder von euch bei sich[a] etwas zurücklegen und ansparen, je nachdem, wie es ihm gelingt,[b] damit nicht erst dann Sammlungen stattfinden, wenn ich komme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei sich“ oder „für sich“. Dies kann bedeuten, dass jeder den Betrag persönlich, möglicherweise zu Hause, zurücklegt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „entsprechend dem, wie es ihm ergeht“ beziehungsweise „nach Maßgabe dessen, worin er Erfolg hat“. Gemeint ist, dass jeder entsprechend seinen jeweiligen Möglichkeiten etwas zurücklegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: An jedem ersten Tag der Woche
  rationale: κατά mit dem Akkusativ hat hier distributive Kraft und bezeichnet eine regelmäßig wiederkehrende wöchentliche Praxis. Die Formulierung gibt dies im heutigen Deutsch klar wieder.
- source_word: ἕκαστος ὑμῶν
  choice: jeder von euch
  rationale: Die distributive Wendung richtet die Anweisung einzeln an alle Angehörigen der Gemeinde.
- source_word: παρ’ ἑαυτῷ
  choice: bei sich
  rationale: Die Wendung bedeutet wörtlich „bei sich“ beziehungsweise „für sich“. Sie kann persönliches Zurücklegen, möglicherweise zu Hause, bezeichnen, ohne dass der Ort völlig eindeutig wäre.
- source_word: τιθέτω θησαυρίζων
  choice: soll … zurücklegen und ansparen
  rationale: Der Imperativ fordert zu fortlaufendem Handeln auf; das Partizip θησαυρίζων beschreibt das Zurückgelegte als sich ansammelnden Vorrat. Die koordinierte deutsche Formulierung klingt natürlich und bewahrt beide Aspekte.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: je nachdem, wie es ihm gut geht
  rationale: Die indefinite Bedingung bindet den zurückgelegten Betrag an das jeweilige Wohlergehen beziehungsweise Gedeihen. Die Formulierung vermeidet die nicht ausdrücklich genannte Einengung auf Verdienst oder Einkommen und bewahrt die offene Bildlichkeit des Verbs.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: damit nicht erst dann Sammlungen stattfinden, wenn ich komme
  rationale: Die Zweckkonstruktion soll kurzfristige Sammlungen bei Paulus’ Ankunft verhindern. „erst dann“ gibt das hervorgehobene τότε idiomatisch wieder; λογεῖαι bezeichnet hier Geldsammlungen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wochenpraxis wird ausdrücklich gemacht. „Bei sich“ wahrt die mögliche private beziehungsweise häusliche Dimension, ohne „zu Hause“ als sicheren Ort festzulegen. Die wirtschaftliche Aussage bleibt bewusst weiter als „je nachdem, was er verdient“.
