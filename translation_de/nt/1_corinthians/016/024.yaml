  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: de
  text: Meine Liebe sei mit euch allen in Jesus, dem Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus Jesus“. Der griechische Titel Χριστός kann mit „Messias“ übersetzt oder in der traditionellen Form „Christus“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: Liebe
  rationale: Bezeichnet hier die persönliche, hingebungsvolle Liebe des Paulus; „Liebe“ ist im heutigen Deutsch klar und natürlich.
- source_word: μου
  choice: meine
  rationale: Gibt das Possessivpronomen direkt wieder und betont die persönliche Zuneigung des Paulus.
- source_word: μετὰ πάντων ὑμῶν
  choice: sei mit euch allen
  rationale: Der griechische Satz ist ohne ausdrückliches Verb. Das ergänzte „sei“ entspricht dem Wunsch- und Segenscharakter des Briefschlusses; „euch allen“ bewahrt den umfassenden Bezug.
- source_word: ἐν
  choice: in
  rationale: Die Wiedergabe „in“ erhält die für Paulus charakteristische, bewusst weit gefasste Aussage über die Verbundenheit beziehungsweise den Lebensbereich im Messias.
- source_word: Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird als Titel mit „Messias“ übersetzt, während Ἰησοῦ als Name wiedergegeben wird. Durch die Verschmelzung von „in dem“ zu „im“ bleibt die Formulierung knapp.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Schlussformel ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: in Christus Jesus
  rationale: „Messias“ macht den Titelgehalt von Χριστός transparent; die traditionelle Form „Christus Jesus“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- issue: Ergänzung eines Verbs im nominalen griechischen Satz
  choice: Meine Liebe sei mit euch allen
  alternative: Meine Liebe ist mit euch allen
  rationale: Da im Griechischen kein Verb steht, wahrt der Konjunktiv „sei“ den naheliegenden Charakter eines abschließenden Wunsches, ohne die Aussage ausdrücklich als Feststellung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Segensformel des griechischen Briefschlusses bleibt erhalten; „Messias Jesus“ ist bewusst titelbetont, während die geläufigere traditionelle Form in der Fußnote genannt wird.
