source:
  edition: SBLGNT
  text: πρὸς ὑμᾶς δὲ τυχὸν ⸀παραμενῶ ἢ ⸀καὶ παραχειμάσω, ἵνα ὑμεῖς με προπέμψητε οὗ ἐὰν πορεύωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: de
  text: Vielleicht bleibe ich aber bei euch oder überwintere sogar bei euch, damit ihr mich für die Weiterreise unterstützt, wohin ich auch immer reise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit ihr mir das Geleit gebt“. Das griechische Verb kann sowohl Begleitung und Verabschiedung als auch praktische oder materielle Hilfe für die Weiterreise einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: bei euch
  rationale: Bei einem Verb des Bleibens bezeichnet πρός mit Akkusativ hier den Aufenthalt bei Personen; „bei euch“ ist im Deutschen natürlich und präzise.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen milden Übergang beziehungsweise eine leichte Gegenüberstellung innerhalb der Reiseplanung; „aber“ gibt dies ohne starke Kontrastwirkung wieder.
- source_word: τυχὸν
  choice: vielleicht
  rationale: Der adverbiale Gebrauch drückt Möglichkeit und Ungewissheit aus; „vielleicht“ ist knapp und idiomatisch.
- source_word: παραμενῶ
  choice: bleibe ich eine Zeit lang
  rationale: παραμένω bedeutet hier, sich weiterhin beziehungsweise für eine gewisse Zeit aufzuhalten. Der Zusatz „eine Zeit lang“ macht den Aspekt des Verweilens im Deutschen natürlich deutlich, ohne eine bestimmte Dauer festzulegen.
- source_word: ἢ καὶ
  choice: oder ... sogar
  rationale: 'Die Verbindung steigert die zweite Möglichkeit: Paulus könnte nicht nur eine Weile bleiben, sondern sogar den ganzen Winter dort verbringen.'
- source_word: παραχειμάσω
  choice: verbringe ... den Winter
  rationale: Das Verb bezeichnet ausdrücklich das Überwintern beziehungsweise Verbringen der Winterzeit an einem Ort.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet hier den Zweck des geplanten Aufenthalts ein.
- source_word: προπέμψητε
  choice: ihr mich für die Weiterreise ausrüstet
  rationale: προπέμπω kann im Reisekontext das Geleitgeben, Verabschieden und praktische beziehungsweise materielle Unterstützen für die Weiterreise umfassen. „Für die Weiterreise ausrüsten“ bringt die Unterstützung gut zum Ausdruck, ohne ihre genaue Form festzulegen.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: wohin ich auch reisen werde
  rationale: Relativadverb mit ἐάν und Konjunktiv bezeichnet ein noch unbestimmtes, zukünftiges Reiseziel. „Wohin ... auch“ bewahrt diese Offenheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reiseunbestimmtheit und der Bedeutungsumfang von προπέμπω bleiben erhalten; die Fußnote nennt die wichtige Alternative.
