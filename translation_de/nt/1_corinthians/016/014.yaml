  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: Alles
  rationale: Das substantivierte Neutrum Plural wird umfassend wiedergegeben und bewahrt den uneingeschränkten Geltungsbereich.
- source_word: ὑμῶν
  choice: was ihr tut
  rationale: Der Genitiv bei πάντα ist elliptisch (wörtlich etwa „alles von euch“). Im Deutschen bringt „was ihr tut“ den gemeinten Bezug auf das Handeln der Adressaten natürlich zum Ausdruck.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Die Wendung kann Art und Weise oder Sphäre bezeichnen. „In Liebe“ folgt der griechischen Form eng und ist zugleich idiomatisches, würdiges Deutsch.
- source_word: γινέσθω
  choice: soll … geschehen
  rationale: Der Imperativ der dritten Person formuliert eine umfassende Aufforderung. „soll … geschehen“ gibt diese Kraft natürlich wieder, ohne den Satz unnötig zu verschärfen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, mahnendem und würdigem Ton. Die Formulierung bewahrt die umfassende Reichweite und die mögliche Bedeutung von ἐν als Art und Weise oder Sphäre.
