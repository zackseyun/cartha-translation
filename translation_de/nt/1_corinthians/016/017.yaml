  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: de
  text: Ich freue mich aber über die Ankunft von Stephanas, Fortunatus und Achaikus[a], denn sie haben ausgeglichen, was von euch fehlte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „denn sie haben eure Abwesenheit wettgemacht“. Gemeint ist wahrscheinlich, dass die Korinther nicht persönlich bei Paulus sein konnten, nicht ein moralisches Versagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Ich freue mich
  rationale: Das Präsens und die persönliche Aussage werden in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: δέ ist hier ein leichter weiterführender beziehungsweise absetzender Konnektor; „aber“ wahrt diese Nuance, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: über die Ankunft
  rationale: παρουσία bezeichnet hier das persönliche Eintreffen der drei Männer; „Ankunft“ vermeidet eine eschatologische Deutung.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Stephanas, Fortunatus und Achaikus
  rationale: Die Personennamen werden nach geläufigen deutschen Transliterationsformen wiedergegeben.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt den Grund für die Freude ein; „denn“ verbindet die beiden Aussagen idiomatisch.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: was von euch fehlte
  rationale: Die Formulierung bewahrt die lexikalische Offenheit von ὑστέρημα („Mangel“, „das Fehlende“), statt sie im Haupttext eindeutig als bloße Abwesenheit auszulegen.
- source_word: οὗτοι
  choice: sie
  rationale: Das demonstrative Pronomen verweist hervorgehoben auf die unmittelbar genannten drei Männer; im Deutschen ist „sie“ hier klar und natürlich.
- source_word: ἀνεπλήρωσαν
  choice: haben ... ausgefüllt
  rationale: Die Wiedergabe hält das Bild des Auffüllens beziehungsweise Ergänzens fest und verbindet sich natürlich mit „was ... fehlte“.
theological_decisions:
- issue: Bedeutung des von den Korinthern Fehlenden
  choice: Die offene Formulierung „was von euch fehlte“ bleibt im Haupttext erhalten.
  alternative: „Sie haben eure Abwesenheit wettgemacht.“
  rationale: Der Zusammenhang legt nahe, dass die drei Männer die fehlende persönliche Gegenwart der Gemeinde ersetzten. Der griechische Ausdruck benennt jedoch allgemeiner einen Mangel beziehungsweise etwas Fehlendes; die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit persönlichem, brieflichem und zugleich würdigem Ton. Die etwas markante Wendung „das ausgefüllt, was von euch fehlte“ folgt bewusst der Bildsprache und Offenheit des griechischen Textes; die wahrscheinlich gemeinte Abwesenheit wird in der Fußnote erläutert.
