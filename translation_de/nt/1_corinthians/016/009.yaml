  edition: SBLGNT
  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: de
  text: Denn mir steht eine große und wirksame Tür offen[a], und es gibt viele Gegner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn mir hat sich eine große und wirksame Gelegenheit eröffnet.« Paulus gebraucht »Tür« bildlich für eine Möglichkeit zum Wirken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: Tür
  rationale: Das wörtliche »Tür« bewahrt das paulinische Bild für eine Gelegenheit zum Wirken, statt es bereits deutend aufzulösen.
- source_word: γάρ
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang die zuvor genannten Reisepläne; »Denn« gibt diese Funktion knapp und natürlich wieder.
- source_word: μοι
  choice: mir
  rationale: Der Dativ bezeichnet den persönlichen Bezug zu Paulus und lässt sich mit »mir steht … offen« idiomatisch wiedergeben.
- source_word: ἀνέῳγεν
  choice: steht … offen
  rationale: Die Perfektform beschreibt den gegenwärtigen Zustand infolge eines Öffnens. »Steht offen« bewahrt diesen Zustandsaspekt, ohne den Handelnden festzulegen.
- source_word: μεγάλη
  choice: große
  rationale: »Große« erhält die qualitative und umfangbezogene Aussage des griechischen Adjektivs innerhalb des Türbildes.
- source_word: ἐνεργής
  choice: wirksame
  rationale: »Wirksam« gibt wieder, dass die eröffnete Möglichkeit Kraft entfaltet beziehungsweise fruchtbares Wirken ermöglicht, und bleibt dabei nah am griechischen Ausdruck.
- source_word: ἀντικείμενοι
  choice: Gegner
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Menschen, die Paulus und seinem Wirken entgegentreten; »Gegner« ist knapp und natürlich.
- source_word: πολλοί
  choice: viele
  rationale: »Viele« entspricht unmittelbar dem quantitativen Sinn des griechischen Wortes.
theological_decisions:
- issue: Die metaphorische »Tür« als Möglichkeit zum Dienst
  choice: Das Bild »Tür« bleibt im Haupttext erhalten.
  alternative: Denn mir hat sich eine große und wirksame Gelegenheit eröffnet.
  rationale: Der griechische Text verwendet das paulinische Türbild. Seine Beibehaltung bewahrt die Bildsprache und vermeidet, die gemeinte Gelegenheit zum Wirken schon im Haupttext interpretierend festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Satzbau. »Mir steht … offen« klingt idiomatisch und bildet den resultierenden Zustand des griechischen Perfekts ab; die Spannung zwischen großer Wirkungsmöglichkeit und vielen Gegnern bleibt unverändert bestehen.
