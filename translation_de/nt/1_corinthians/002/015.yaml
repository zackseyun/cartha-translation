source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: de
  text: Der vom Geist geprägte Mensch[b] aber beurteilt alles[a]; er selbst jedoch wird von niemandem beurteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „prüft“, „unterscheidet“ oder „richtet“; entsprechend auch in der zweiten Satzhälfte.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht ein substantivisch gebrauchtes Adjektiv in der männlichen Einzahl. Gemeint ist allgemein ein Mensch, der durch den Geist gekennzeichnet ist.
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: der vom Geist geprägte Mensch
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet hier allgemein einen Menschen, der durch den Geist gekennzeichnet ist. Die Formulierung ist geschlechtsübergreifend verständlich und vermeidet die mögliche Verengung von „geistlich“ auf Frömmigkeit oder kirchlichen Stand.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: beurteilt / wird beurteilt
  rationale: „Beurteilen“ gibt die sorgfältige Prüfung und Einschätzung im Zusammenhang natürlich wieder. Derselbe deutsche Wortstamm in beiden Satzhälften bewahrt die auffällige Wiederholung des griechischen Verbs.
- source_word: τὰ πάντα
  choice: alles
  rationale: Die uneingeschränkte Formulierung des Griechischen bleibt erhalten; eine ausdrückliche Begrenzung auf geistliche Dinge wird nicht in den Haupttext eingefügt.
- source_word: αὐτὸς
  choice: er selbst
  rationale: „Selbst“ wahrt die Hervorhebung des Pronomens. Das grammatische „er“ greift „der Mensch“ auf, ohne die Aussage auf Männer zu beschränken.
- source_word: ὑπ’ οὐδενὸς
  choice: von niemandem
  rationale: Die Formulierung gibt die absolute Verneinung knapp und idiomatisch wieder.
theological_decisions:
- issue: Reichweite der Aussage über den vom Geist geprägten Menschen
  choice: Die unbeschränkten Aussagen „alles“ und „von niemandem“ bleiben im Haupttext stehen.
  alternative: Die Aussage ausdrücklich auf geistliche Dinge oder auf Menschen ohne den Geist begrenzen.
  rationale: Der griechische Wortlaut formuliert uneingeschränkt; der Zusammenhang darf die Aussage näher bestimmen, doch eine solche Begrenzung sollte nicht stillschweigend in den Vers eingefügt werden.
- issue: Bezug von πνευματικὸς auf den Geist
  choice: „vom Geist geprägt“ mit großgeschriebenem „Geist“
  alternative: „geistlicher Mensch“ oder allgemein „spiritueller Mensch“
  rationale: Im unmittelbaren Zusammenhang ist Gottes Geist gemeint. Die gewählte Formulierung macht diesen Bezug verständlich, ohne eine besondere konfessionelle Definition einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Wiederholung von „beurteilt“ bilden die griechische Gegenüberstellung ab; das Semikolon macht den engen Kontrast der beiden Teilsätze sichtbar.
