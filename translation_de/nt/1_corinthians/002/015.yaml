  source_fidelity: 'Der Text gibt die Struktur und die semantische Spannung des Griechischen zuverlässig wieder: πνευματικός ist angemessen personenbezogen und generisch formuliert, τὰ πάντα bleibt uneingeschränkt als „alles“ erhalten, αὐτός wird durch „er selbst“ hervorgehoben, und ὑπ’ οὐδενός wird treffend mit „von niemandem“ wiedergegeben. Die Wiederholung von ἀνακρίνω wird mit „beurteilt“ / „wird ... beurteilt“ nachvollziehbar bewahrt.'
  naturalness: „Der vom Geist geprägte Mensch aber beurteilt alles; er selbst jedoch wird von niemandem beurteilt“ ist modernes, würdiges und gut verständliches Standarddeutsch. Der Satzbau bildet den griechischen Kontrast klar ab.
