    issue: „kennen“ für εἰδέναι
    rationale: Im Kontext meint εἰδέναι das, worauf Paulus sein Wissen bzw. seine Verkündigung bewusst beschränkt, nicht primär persönliches Kennen. „Wissen“ wahrt die semantische Weite und den idiomatischen Anschluss an die Aussage besser.
  - severity: low
    issue: Abgesetztes „– und ihn als Gekreuzigten“
    rationale: Die Formulierung ist verständlich, aber die Funktion von καὶ τοῦτον als nachdrückliche Präzisierung wird mit „und zwar ihn“ direkter und im Deutschen geschlossener wiedergegeben.
  revised_text: Denn ich beschloss, unter euch nichts anderes zu wissen als Jesus, den Messias[a], und zwar ihn als Gekreuzigten.
