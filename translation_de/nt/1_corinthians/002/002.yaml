source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: de
  text: Denn ich beschloss, unter euch nichts anderes zu wissen als Jesus, den Messias[a], und zwar ihn als Gekreuzigten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“. Griechisch: „Jesus Messias“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: ich beschloss
  rationale: κρίνω bezeichnet hier keine richterliche Beurteilung, sondern einen festen Entschluss. „Ich beschloss“ ist im Deutschen klar, natürlich und entspricht dem Aorist.
- source_word: τι εἰδέναι
  choice: nichts anderes zu kennen
  rationale: In Verbindung mit οὐ und εἰ μὴ entsteht eine ausschließende Aussage. Da sich das Wissen auf die Person Jesu richtet, ist „kennen“ im Deutschen natürlicher als „wissen“; „nichts anderes“ macht die Einschränkung idiomatisch deutlich.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung bezeichnet Paulus’ Gegenwart und Wirken inmitten der korinthischen Gemeinde. „Unter euch“ bewahrt diesen sozialen und räumlichen Bezug knapp.
- source_word: εἰ μὴ
  choice: als
  rationale: Nach der verneinten Wendung „nichts anderes“ gibt „als“ die griechische Ausnahmeformel im Deutschen idiomatisch wieder.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, den Messias
  rationale: Χριστός hat hier erkennbaren Titelcharakter. Die Apposition „den Messias“ macht diesen Sinn in natürlichem Deutsch sichtbar; die traditionelle Wiedergabe „Jesus Christus“ wird in der Fußnote genannt.
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: – und ihn als Gekreuzigten
  rationale: „Ihn“ nimmt die nachdrückliche Rückverweisung τοῦτον auf. Das substantivierte „als Gekreuzigten“ bewahrt die knappe, gewichtige Aussage des Perfektpartizips und stellt Jesu Kreuzigung in den Mittelpunkt.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: den Messias
  alternative: Jesus Christus
  rationale: In diesem Zusammenhang bezeichnet Χριστός Jesu messianische Würde, während Paulus zugleich sein Gekreuzigtsein hervorhebt. „Messias“ erhält den Titelcharakter, ohne die Spannung zwischen messianischer Identität und Kreuzigung aufzulösen; die traditionelle Form steht in der Fußnote.
- issue: Bedeutung von „ihn als Gekreuzigten“
  choice: Die Formulierung beschreibt Jesus in seiner bleibend maßgeblichen Identität als den Gekreuzigten.
  alternative: Nur das historische Ereignis mit „dass er gekreuzigt wurde“ wiederzugeben.
  rationale: Das Perfektpartizip ἐσταυρωμένον legt nicht nur das vergangene Ereignis, sondern den daraus hervorgegangenen und weiterhin bedeutsamen Zustand nahe. Die knappe nominale Form vermeidet eine weitergehende theologische Ausdeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt bewusst knapp und rhetorisch zugespitzt. Der Gedankenstrich bildet die nachdrückliche Erweiterung καὶ τοῦτον ab, ohne zusätzliche Erklärung in den Vers einzutragen.
