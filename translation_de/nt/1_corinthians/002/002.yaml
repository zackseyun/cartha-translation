review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur gibt den Entschluss (ἔκρινα), den Wirkungsbereich „unter euch“, die ausschließende Formulierung und die hervorgehobene Bezugnahme auf Jesus als den Gekreuzigten zutreffend wieder. „Kennen“ verschiebt εἰδέναι jedoch im Deutschen in Richtung persönlicher Vertrautheit; „wissen“ ist hier die nähere und zugleich idiomatische Entsprechung. Die Fassung „als Gekreuzigten“ ist möglich, aber ohne das betonte „ihn“ weniger klar an τοῦτον gebunden.
  naturalness: „Nichts anderes zu wissen“ ist im heutigen Standarddeutsch natürlich. „Und zwar ihn als Gekreuzigten“ bewahrt die rhetorische Nachdrücklichkeit und ist klarer als die abgetrennte Formulierung „– und ihn als Gekreuzigten“.
  terminology: „Messias“ ist als Titel für Χριστός angemessen; „Jesus, den Messias“ ist eine natürliche deutsche Apposition. Die Fußnote bietet mit „Jesus Christus“ die etablierte lexikalische Alternative und ist korrekt verankert.
  issues:
