id: 1CO.2.6
reference: 1 Corinthians 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: de
  text: Doch unter den Gereiften[a] reden wir Weisheit – allerdings keine Weisheit dieses Zeitalters und auch nicht die der Herrscher dieses Zeitalters[b], die entmachtet werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vollkommenen“; hier wahrscheinlich Menschen, die geistlich gereift sind.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Herrschern dieses Zeitalters“ können menschliche Machthaber, geistliche Mächte oder beide gemeint sein.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „die vergehen“, „die beseitigt werden“ oder „die zunichtegemacht werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν δὲ λαλοῦμεν
  choice: Doch … reden wir Weisheit
  rationale: „Doch“ gibt den Gegensatz zum vorherigen Zusammenhang wieder; „Weisheit reden“ bewahrt die Wiederaufnahme von σοφίαν und den allgemeinen Sinn von λαλοῦμεν, ohne daraus ausdrücklich „verkündigen“ zu machen.
- source_word: ἐν τοῖς τελείοις
  choice: unter den Gereiften
  rationale: ἐν bezeichnet hier den Kreis, in dem gesprochen wird. „Gereifte“ gibt τέλειοις als Menschen wieder, die zur Reife gelangt sind, ohne sündlose Vollkommenheit festzuschreiben.
- source_word: σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου
  choice: allerdings keine Weisheit dieses Zeitalters
  rationale: Das zweite δέ führt eine Einschränkung beziehungsweise einen erneuten Gegensatz ein. „Zeitalter“ wahrt den zeitlich-heilsgeschichtlichen Sinn von αἰών und vermeidet eine Gleichsetzung mit κόσμος („Welt“).
- source_word: τῶν ἀρχόντων τοῦ αἰῶνος τούτου
  choice: der Herrscher dieses Zeitalters
  rationale: „Herrscher“ ist eine direkte, hinreichend breite Wiedergabe von ἄρχοντες und lässt offen, ob menschliche Machthaber, geistliche Mächte oder beide gemeint sind.
- source_word: τῶν καταργουμένων
  choice: die entmachtet werden
  rationale: Das Präsenspartizip wird als andauernder Vorgang wiedergegeben. „Entmachtet werden“ erfasst hier das Außerkraftsetzen beziehungsweise Unwirksammachen, ohne bereits völlige Vernichtung auszudrücken.
theological_decisions:
- issue: Bezug der „Herrscher dieses Zeitalters“
  choice: Die Übersetzung bleibt beim umfassenden Ausdruck „Herrscher“ und legt deren Identität nicht fest.
  alternative: Menschliche politische oder religiöse Machthaber; geistliche Mächte; oder beide zugleich.
  rationale: Der griechische Ausdruck entscheidet die Frage nicht eindeutig. Die offene Formulierung bewahrt die exegetische und theologische Spannung.
- issue: Bedeutung von τέλειοις
  choice: „Gereiften“
  alternative: „Vollkommenen“
  rationale: Im Zusammenhang bezeichnet das Wort wahrscheinlich geistliche Reife. Die Fußnote hält jedoch die stärker formale Alternative offen, statt sie auszuschließen.
- issue: Wirkung von καταργουμένων
  choice: „entmachtet werden“
  alternative: „vergehen“, „beseitigt werden“ oder „zunichtegemacht werden“
  rationale: Die gewählte Formulierung betont das fortschreitende Unwirksammachen der Herrscher. Da das Verb mehrere Nuancen zulässt, werden wichtige Alternativen in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Wendung „Weisheit reden“ hält sich eng an die griechische Ausdrucksweise und bewahrt die Wiederholung des Schlüsselbegriffs. Der Gedankenstrich macht die Einschränkung im zweiten Satzteil lesbar, ohne den argumentativen Gegensatz abzuschwächen.
