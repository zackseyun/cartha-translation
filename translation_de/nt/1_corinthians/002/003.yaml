base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: de
  text: Und ich war bei euch in Schwachheit, in Furcht und mit großem Zittern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich kam in Schwachheit, in Furcht und mit großem Zittern zu euch.“'
    reason: Die Wendung ἐγενόμην πρὸς ὑμᾶς kann sowohl Paulus’ Dasein bei den Korinthern als auch sein Kommen zu ihnen in den Blick nehmen.
lexical_decisions:
- source_word: κἀγώ
  choice: Und ich
  rationale: Die Verschmelzung von καί und ἐγώ verbindet den Satz mit dem Vorhergehenden und nennt Paulus ausdrücklich, ohne eine im Deutschen unnötige zusätzliche Betonung einzuführen.
- source_word: ἐν ἀσθενείᾳ
  choice: in Schwachheit
  rationale: Die Wiedergabe bewahrt die Bedeutungsbreite von ἀσθένεια als Schwäche oder Gebrechlichkeit und klingt zugleich würdig und verständlich.
- source_word: ἐν φόβῳ
  choice: in Furcht
  rationale: Die direkte Wiedergabe lässt offen, worauf sich die Furcht richtet, und schwächt sie nicht zu bloßer Ehrfurcht oder Vorsicht ab.
- source_word: ἐν τρόμῳ πολλῷ
  choice: mit großem Zittern
  rationale: „Zittern“ gibt τρόμος konkret wieder; „großem“ bewahrt die verstärkende Wirkung von πολλῷ. Der Wechsel zu „mit“ ist im modernen Deutschen idiomatischer als eine dreifache Wiederholung von „in“.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: ich war bei euch
  rationale: Im unmittelbaren Zusammenhang bezeichnet die Formulierung plausibel Paulus’ Auftreten und Zustand unter den Korinthern. Die ebenfalls mögliche, stärker auf sein Kommen bezogene Wiedergabe wird in der Fußnote bewahrt.
