  source_fidelity: 'Die Übersetzung gibt κἀγώ angemessen als anschließendes „Und ich“ wieder und bewahrt die drei Zustandsangaben: ἐν ἀσθενείᾳ („in Schwachheit“), ἐν φόβῳ („in Furcht“) und ἐν τρόμῳ πολλῷ („mit großem Zittern“). „Ich war bei euch“ ist im Kontext eine vertretbare Wiedergabe von ἐγενόμην πρὸς ὑμᾶς; die ebenfalls mögliche, stärker auf die Ankunft zielende Deutung ist sachgerecht in der Fußnote ausgewiesen.'
