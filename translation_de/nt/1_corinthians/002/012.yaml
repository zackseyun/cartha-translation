  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: de
  text: Wir aber haben nicht den Geist der Welt empfangen, sondern den Geist, der von Gott kommt, damit wir erkennen[a], was Gott uns aus Gnade geschenkt hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir verstehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was Gott uns frei geschenkt hat“ oder „was Gott uns als Geschenk gegeben hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: Geist / Geist
  rationale: „Geist“ gibt beide Vorkommen wieder. Da deutsche Substantive stets großgeschrieben werden, kann die Unterscheidung zwischen dem Geist der Welt und dem Heiligen Geist nicht wie im Englischen allein durch Großschreibung markiert werden; der jeweilige Zusatz macht den Gegensatz deutlich.
- source_word: κόσμου
  choice: Welt
  rationale: „Welt“ ist die naheliegende Wiedergabe und bezeichnet hier die gegenwärtige menschliche Weltordnung im Gegensatz zu Gott.
- source_word: ἐλάβομεν
  choice: haben … empfangen
  rationale: Das deutsche Perfekt bezeichnet den Empfang als geschehen und für die gegenwärtige Aussage weiterhin relevant.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: der von Gott kommt
  rationale: Die Relativkonstruktion ist natürliches modernes Deutsch und bewahrt die mit ἐκ bezeichnete Herkunft aus Gott, ohne die Wendung zu „Gottes Geist“ zu verdichten.
- source_word: ἵνα εἰδῶμεν
  choice: damit wir erkennen
  rationale: Die Zweckangabe bleibt ausdrücklich erhalten; „erkennen“ gibt den kognitiven Sinn wieder und passt natürlich zum folgenden Inhaltssatz.
- source_word: χαρισθέντα
  choice: aus Gnade geschenkt
  rationale: Die Form von χαρίζομαι bezeichnet ein gnädiges, als Geschenk gewährtes Geben. Die Wendung erhält sowohl den Gnaden- als auch den Geschenkcharakter.
- source_word: τὰ … χαρισθέντα ἡμῖν
  choice: was Gott uns aus Gnade geschenkt hat
  rationale: Das substantivierte sächliche Pluralwort wird im Deutschen idiomatisch mit „was“ wiedergegeben und bleibt umfassend, statt es auf einzelne Geistesgaben einzuschränken. Die aktive Formulierung nennt Gott als den im griechischen Passiv ausdrücklich bezeichneten Handelnden.
theological_decisions:
- issue: Ob πνεῦμα τὸ ἐκ τοῦ θεοῦ ausdrücklich den Heiligen Geist bezeichnet
  choice: „den Geist, der von Gott kommt“
  alternative: „den Geist aus Gott“ oder ausdrücklich „den Heiligen Geist“
  rationale: Der Kontext legt den Heiligen Geist nahe, doch das griechische Wort lautet lediglich πνεῦμα. Die gewählte Formulierung wahrt den Gegensatz zum „Geist der Welt“, bezeichnet die göttliche Herkunft und vermeidet zugleich eine über den Wortlaut hinausgehende Ergänzung „heilig“.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gegensatz und der Zweckangabe, während die Schlusswendung idiomatisch ins Deutsche übertragen wird.
