id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: de
  text: Denn wer hat den Sinn des Herrn erkannt, dass er ihn unterweisen könnte?[a] Wir aber haben den Sinn des Messias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus greift hier Jesaja 40,13 auf.
    reason: cross_reference
  - marker: b
    text: 'Oder: „den Sinn Christi“; auch: „die Gesinnung Christi“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἔγνω
  choice: Denn wer hat … erkannt
  rationale: Gibt die einleitende rhetorische Frage und den begründenden Anschluss durch γάρ in natürlichem Deutsch wieder.
- source_word: νοῦν κυρίου
  choice: den Sinn des Herrn
  rationale: „Sinn“ erfasst hier Denken, Einsicht und innere Ausrichtung und bewahrt zugleich den Anklang an Jesaja 40,13.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: sodass er ihn unterweisen könnte
  rationale: συμβιβάζω bezeichnet im Zitat das Unterweisen oder Anleiten; der Konjunktiv verdeutlicht den rhetorisch gedachten Anspruch, den Herrn belehren zu können.
- source_word: ἡμεῖς δὲ
  choice: Wir aber
  rationale: Bewahrt den nachdrücklichen Gegensatz zur vorausgehenden rhetorischen Frage.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: haben den Sinn des Messias
  rationale: Die schlichte Aussageform von ἔχομεν bleibt erhalten; „Messias“ gibt Χριστός als Titel wieder.
theological_decisions:
- issue: Bedeutung von νοῦς in den beiden Vershälften
  choice: Sinn
  alternative: Denken; Gesinnung
  rationale: Die identische Wiedergabe wahrt die bewusste Verbindung zwischen „Sinn des Herrn“ und „Sinn des Messias“, ohne den Begriff einseitig auf Verstand oder Haltung festzulegen.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi; von Christus
  rationale: Χριστός trägt hier Titelfunktion. „Messias“ macht diese Bedeutung transparent, während die geläufige Alternative in der Fußnote genannt wird.
- issue: Referent von αὐτόν
  choice: ihn
  alternative: den Herrn
  rationale: Das Pronomen wird entsprechend dem griechischen Text bewahrt. Sein Bezug auf den Herrn ergibt sich aus dem Zusammenhang, ohne dass der Name wiederholt werden muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am griechischen rhetorischen Aufbau; „unterweisen könnte“ klingt natürlich und bewahrt die uneingelöste Möglichkeit der Frage. Beide Vorkommen von νοῦς werden bewusst gleich übersetzt.
