  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: de
  text: 'Sondern wie geschrieben steht: „Was kein Auge gesehen und kein Ohr gehört hat und was in keines Menschen Herz gekommen ist – das hat Gott denen bereitet, die ihn lieben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sondern
  rationale: Kennzeichnet den Gegensatz zum vorhergehenden Gedanken; „sondern“ setzt diesen im Deutschen knapp und natürlich fort.
- source_word: καθὼς γέγραπται
  choice: es ist, wie geschrieben steht
  rationale: Bewahrt die formelhafte Einführung eines Schriftzitats und gibt den bleibenden Geltungsaspekt des Perfekts natürlich wieder.
- source_word: Ἃ ... ὅσα
  choice: Was ... all das
  rationale: Gibt die korrelative und wiederaufnehmende Struktur verständlich wieder; „all das“ nimmt die drei vorangehenden Aussagen zusammenfassend auf.
- source_word: ὀφθαλμὸς ... οὖς
  choice: Auge ... Ohr
  rationale: Bewahrt die generischen Singularformen und den poetischen Parallelismus.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: in keinem menschlichen Herzen aufgestiegen ist
  rationale: Erhält sowohl das biblische Bild des Herzens als auch die Aufwärtsbewegung von ἀνέβη; „menschlich“ macht die generische Bedeutung von ἀνθρώπου im heutigen Deutsch deutlich.
- source_word: ἡτοίμασεν
  choice: hat ... bereitet
  rationale: Gibt die abgeschlossene Handlung des Aorists idiomatisch wieder; „bereitet“ passt zum würdigen, schriftsprachlichen Register.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: denen, die ihn lieben
  rationale: Gibt das substantivierte Präsenspartizip als fortdauernde Kennzeichnung natürlich wieder.
theological_decisions:
- issue: Generische Bedeutung von ἀνθρώπου
  choice: in keinem menschlichen Herzen
  alternative: in keines Menschen Herz
  rationale: Die Formulierung bezeichnet die Menschheit allgemein. „Menschliches Herz“ bewahrt den anthropologischen Ausdruck „Herz“, ohne im modernen Deutschen eine ausschließlich männliche Lesart nahezulegen.
- issue: Bedeutungsumfang von καρδία
  choice: Herzen
  alternative: Sinn
  rationale: „Herz“ bewahrt die biblische Anthropologie und die Bildsprache des Ausgangstextes; die mögliche Bedeutung „in den Sinn kommen“ wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst poetischem Parallelismus. Die ungewöhnliche, aber verständliche Wendung „im Herzen aufgestiegen“ bewahrt das Bild des griechischen Textes; die idiomatischere Deutung steht in der Fußnote.
