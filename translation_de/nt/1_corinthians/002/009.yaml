  source_fidelity: 'Der Sinn des griechischen Zitats wird insgesamt zutreffend wiedergegeben: die dreigliedrige negative Aussage und ihre zusammenfassende Zuordnung zu dem, was Gott für die ihn Liebenden bereitet hat, bleiben erhalten. Die Wendung „in keinem menschlichen Herzen aufgestiegen ist“ bildet zwar ἀνέβη ab, ist im Deutschen jedoch keine natürliche Metapher. „In keines Menschen Herz gekommen ist“ gibt die etablierte idiomatische Bedeutung wieder und bewahrt zugleich „Herz“ und die generische Aussage von ἀνθρώπου.'
  naturalness: „Sondern es ist, wie geschrieben steht“ ist im modernen Standarddeutsch als Zitatformel unnötig schwerfällig. „Sondern wie geschrieben steht“ ist idiomatisch und entspricht der griechischen Formel direkt. Auch „in keines Menschen Herz gekommen ist“ ist wesentlich natürlicher als „in keinem menschlichen Herzen aufgestiegen ist“.
  terminology: „Herz“, „Gott“, „bereitet“ und „denen, die ihn lieben“ sind angemessen, registergerecht und theologisch nicht einengend. „Keines Menschen“ vermittelt die generische Reichweite von ἀνθρώπου ohne eine künstliche Formulierung.
