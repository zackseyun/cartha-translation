    issue: Unidiomatische Haupttextformulierung „in keinem menschlichen Herzen aufgestiegen ist“.
    rationale: Die wörtlichere Bewegungsmetapher ist im heutigen Deutsch nicht geläufig und kann ein körperliches Aufsteigen im Inneren nahelegen. Die idiomatische Wendung „in keines Menschen Herz gekommen ist“ trifft den Sinn der griechischen Redewendung und erhält das Bildfeld „Herz“.
  - severity: low
    issue: Schwerfällige Zitatformel „Sondern es ist, wie geschrieben steht“.
    rationale: Das zusätzliche „es ist“ hat im Deutschen keine klare syntaktische Funktion. Die knappe Formel „Sondern wie geschrieben steht“ ist natürlich und quellentreu.
