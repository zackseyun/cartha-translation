- from: Und als ich zu euch kam, Brüder und Schwestern[a], kam ich nicht mit überragender Rede oder Weisheit, um euch das Zeugnis Gottes[b] zu verkünden.
  to: Und als ich zu euch kam, Brüder und Schwestern[a], trat ich euch nicht mit hoher Redekunst oder Weisheit entgegen, indem ich euch das Zeugnis Gottes[b] verkündete.
  rationale: Die Revision vermeidet die missverständliche Zweckkonstruktion und gibt das begleitende Partizip mit „indem“ wieder. „Trat ich euch nicht … entgegen“ bringt die negative Aussage über Paulus’ Auftreten beim Kommen idiomatisch zum Ausdruck. Die Textvariante und die genitivische Offenheit von „Zeugnis Gottes“ bleiben erhalten.
