id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: de
  text: Und als ich zu euch kam, Brüder und Schwestern[a], trat ich euch nicht mit hoher Redekunst oder Weisheit entgegen, indem ich euch das Zeugnis Gottes[b] verkündete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Brüder. Die Anrede kann die Glaubenden insgesamt einschließen, also auch die Frauen in der Gemeinde.'
    reason: cultural_note
  - marker: b
    text: 'Einige Handschriften lesen: das Geheimnis Gottes.'
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: Und als ich
  rationale: Das καί wird durch „Und“ aufgenommen; das ausdrücklich gesetzte ἐγώ bleibt im deutschen „ich“ erkennbar, ohne die Betonung künstlich zu verstärken.
- source_word: ἐλθὼν … ἦλθον
  choice: als ich … kam, kam ich
  rationale: Die Wiederholung des Verbs bildet die griechische Partizip-Hauptverb-Konstruktion nachvollziehbar ab und bleibt im Deutschen verständlich.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline Plural dient hier als Anrede der gesamten gemischten Gemeinde; die inklusive Wiedergabe vermittelt den gemeinten Adressatenkreis in heutigem Deutsch. Eine Fußnote weist auf die wörtliche Form hin.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: mit überragender Rede oder Weisheit
  rationale: „Überragend“ wahrt den Gedanken von Vorrang beziehungsweise herausragender Qualität, ohne die Wendung ausschließlich auf einen hochtrabenden Stil festzulegen.
- source_word: καταγγέλλων
  choice: um … zu verkünden
  rationale: Der Infinitivsatz ordnet das begleitende Partizip idiomatisch dem Kommen des Paulus zu und bewahrt den öffentlichen, nachdrücklichen Sinn von καταγγέλλω.
- source_word: μαρτύριον
  choice: Zeugnis
  rationale: Folgt der Lesart des SBLGNT und erhält das gewichtige, aber nicht weiter eingeengte Substantiv.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv bewahrt die mögliche Mehrdeutigkeit, ob das Zeugnis von Gott stammt, Gott betrifft oder ihm zugehört.
theological_decisions:
- issue: Textvariante bei μαρτύριον
  choice: das Zeugnis Gottes
  alternative: das Geheimnis Gottes
  rationale: Der SBLGNT-Haupttext bietet μαρτύριον („Zeugnis“); die bedeutsame Variante μυστήριον („Geheimnis“) wird in der Fußnote dokumentiert.
- issue: Bedeutung des Genitivs τοῦ θεοῦ
  choice: Gottes
  alternative: von Gott / über Gott
  rationale: Der formal entsprechende Genitiv lässt offen, ob Herkunft, Inhalt oder Zugehörigkeit im Vordergrund steht, und vermeidet eine theologische Vorentscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken; die inklusive Gemeindeanrede wird transparent erläutert. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
