id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: de
  text: Uns nämlich hat Gott dies durch den Geist offenbart[a]; denn der Geist erforscht alles, selbst die Tiefen Gottes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht kein direktes Objekt; „dies“ ergibt sich aus dem vorausgehenden Zusammenhang.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die tiefen Dinge Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet am natürlichsten die Empfänger der Offenbarung.
- source_word: ἀπεκάλυψεν
  choice: hat ... offenbart
  rationale: Das deutsche Perfekt gibt die vollzogene Offenbarung mit ihrer gegenwärtigen Bedeutung natürlich wieder.
- source_word: '[implizites Objekt von ἀπεκάλυψεν]'
  choice: dies
  rationale: Im Griechischen bleibt das direkte Objekt unausgesprochen; „dies“ nimmt den vorausgehenden Zusammenhang knapp auf, ohne ihn näher auszudeuten.
- source_word: διὰ τοῦ πνεύματος
  choice: durch den Geist
  rationale: διά mit Genitiv bezeichnet hier das Mittel beziehungsweise die vermittelnde Wirksamkeit.
- source_word: πνεῦμα
  choice: Geist
  rationale: Der Zusammenhang spricht vom Geist, durch den Gott offenbart und der die Tiefen Gottes kennt; daher ist der Geist Gottes gemeint.
- source_word: ἐραυνᾷ
  choice: erforscht
  rationale: „Erforscht“ bewahrt die aktive, eindringende Bedeutung des Verbs und klingt im Deutschen natürlicher als „durchsucht“.
- source_word: πάντα
  choice: alles
  rationale: Die umfassende Reichweite wird im modernen Deutsch prägnant und vollständig wiedergegeben.
- source_word: καὶ
  choice: selbst
  rationale: καί wirkt hier steigernd und hebt die Tiefen Gottes als den zugespitzten Umfang des Erforschens hervor.
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: die Tiefen Gottes
  rationale: Die Tiefenmetapher bleibt formal und theologisch offen erhalten.
theological_decisions:
- issue: Bezieht sich πνεῦμα auf den Heiligen Geist oder auf den menschlichen Geist?
  choice: Gottes Geist in beiden Vorkommen
  alternative: der menschliche Geist in allgemeinem Sinn
  rationale: Gott offenbart durch diesen Geist, und dieser erforscht sogar Gottes Tiefen; der unmittelbare Zusammenhang spricht daher deutlich für Gottes Geist.
- issue: Wie ist das unausgesprochene Objekt von ἀπεκάλυψεν wiederzugeben?
  choice: „dies“ als knapper Rückverweis auf den vorausgehenden Inhalt
  alternative: Kein ausdrückliches Objekt oder „diese Dinge“
  rationale: Das Griechische lässt das Objekt implizit. Im Deutschen ist ein knapper Rückverweis verständlicher, ohne den Bezug dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt argumentativ eng am Griechischen; „selbst“ gibt die steigernde Kraft von καί wieder. Die Wiederholung von „Geist“ und die Metapher der „Tiefen“ bleiben erhalten.
