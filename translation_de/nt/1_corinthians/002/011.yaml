id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: de
  text: Denn wer unter den Menschen weiß, was in einem Menschen ist,[a] außer dem Geist dieses Menschen, der in ihm ist? Ebenso hat niemand erkannt, was in Gott ist,[b] außer dem Geist Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „was zum Menschen gehört“; möglich ist im Zusammenhang auch: „die Gedanken eines Menschen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „was zu Gott gehört“; die Wendung ist weiter als nur „Gottes Gedanken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: Menschen / einem Menschen
  rationale: Die Substantive bezeichnen Menschen allgemein und haben hier keine spezifisch männliche Bedeutung.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: was in einem Menschen ist
  rationale: Die substantivierte Wendung bezeichnet die einem Menschen eigenen inneren Angelegenheiten. Die Wiedergabe ist im Deutschen natürlich und bewahrt den Bezug auf das Innere, ohne ihn allein auf Gedanken zu verengen.
- source_word: πνεῦμα τοῦ ἀνθρώπου
  choice: der Geist dieses Menschen
  rationale: Die Formulierung bewahrt den Gegensatz zwischen dem menschlichen Geist und dem Geist Gottes; „dieses Menschen“ stellt den Rückbezug eindeutig her.
- source_word: τὸ ἐν αὐτῷ
  choice: der in ihm ist
  rationale: Die Relativkonstruktion gibt die griechische attributive Wendung eng wieder, ohne den stärkeren theologischen Begriff „innewohnen“ einzutragen.
- source_word: οὕτως καὶ
  choice: Ebenso
  rationale: „Ebenso“ markiert knapp und idiomatisch die enge Analogie zwischen beiden Satzhälften.
- source_word: ἔγνωκεν
  choice: hat … erkannt
  rationale: Das Perfekt wird als deutsches Perfekt wiedergegeben. „Erkannt“ kann dabei ein erlangtes und fortbestehendes Wissen ausdrücken.
- source_word: τὰ τοῦ θεοῦ
  choice: was in Gott ist
  rationale: Die Formulierung erhält die Parallelität zur ersten Vershälfte und bezeichnet Gottes eigene, dem Menschen unzugängliche Wirklichkeit; die breitere, formalere Alternative wird in der Fußnote genannt.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: der Geist Gottes
  rationale: Der unmittelbare Zusammenhang spricht von Gottes eigenem Geist, der erforscht und offenbart. Die Großschreibung von „Geist“ folgt der deutschen Schreibung des Substantivs und entscheidet für sich genommen keine zusätzliche dogmatische Frage.
theological_decisions:
- issue: Ob πνεῦμα τοῦ θεοῦ als persönliche göttliche Bezeichnung oder unpersönlich verstanden werden soll
  choice: der Geist Gottes
  alternative: Gottes Geist im Sinn einer unpersönlichen Wirkkraft
  rationale: Der Kontext von 1. Korinther 2 beschreibt den Geist als erkennend, erforschend und offenbarend. Die Übersetzung wahrt diese personale Ausdrucksweise, ohne weitere trinitarische Einzelheiten in den Vers einzutragen.
- issue: Umfang von τὰ τοῦ ἀνθρώπου und τὰ τοῦ θεοῦ
  choice: was in einem Menschen / in Gott ist
  alternative: die Gedanken eines Menschen / Gottes
  rationale: Die griechischen Wendungen sind weiter als „Gedanken“. Die Übersetzung lässt ihre inhaltliche Breite bestehen und vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Vergleich, während „was in … ist“ die im Deutschen schwerfällige Formulierung „die Dinge des …“ vermeidet. Die generische Aussage wird mit „Menschen“ wiedergegeben; das anschließende „ihm“ bezieht sich grammatisch auf den singularischen „Menschen“.
