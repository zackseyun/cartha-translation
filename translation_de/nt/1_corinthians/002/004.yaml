review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe hält die Gegenüberstellung von Paulus’ Rede/Verkündigung mit dem Erweis von Geist und Kraft grundsätzlich gut fest. „Bestanden nicht in“ ist jedoch gegenüber dem griechischen Prädikat („waren nicht in …, sondern in …“) unnötig stärker und kann durch die direktere Formulierung ersetzt werden. Die anarthrische und in ihrer genauen Nuance umstrittene Fügung πειθοῖ σοφίας wird mit „überzeugender Weisheitsrede“ vertretbar knapp wiedergegeben; die Ergänzung „Worten“ gehört nur in die Alternative.
  naturalness: „Rede“, „Verkündigung“, „Erweis“ und „Kraft“ ergeben ein würdiges, verständliches modernes Standarddeutsch. „Waren nicht …, sondern …“ ist hier natürlicher und näher am Satzbau der Vorlage als „bestanden nicht in …“.
  terminology: Die Unterscheidung von λόγος („Rede“) und κήρυγμα („Verkündigung“) ist sinnvoll. „Geist“ mit bestimmtem Artikel folgt der im Kontext naheliegenden Bezugnahme auf Gottes Geist, sollte aber in der Fußnote als Auslegung kenntlich gemacht werden. Die bisherige Fußnotenalternative „des Geistes im allgemeineren Sinn“ ist nicht wirklich alternativ zum Haupttext und wird präzisiert.
  issues:
