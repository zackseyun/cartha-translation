    issue: Die Formulierung „bestanden nicht in“ verstärkt die Aussage gegenüber dem griechischen „waren nicht in“ und ist weniger direkt.
    rationale: Der Ausgangstext beschreibt, worin Rede und Verkündigung nicht bzw. vielmehr bestanden; eine unmittelbare Wiedergabe mit „waren nicht …, sondern …“ bewahrt die Form und den Kontrast ohne zusätzliche Nuance.
  - severity: medium
    issue: Fußnote b bietet mit „des Geistes im allgemeineren Sinn“ keine vom Haupttext unterscheidbare deutsche Lesart.
    rationale: Da Deutsch den Unterschied nicht über Groß- und Kleinschreibung markiert, muss die offenere, nicht spezifisch auf Gottes Geist bezogene Möglichkeit beispielsweise durch „eines Geistes“ und eine erläuternde Umschreibung kenntlich werden.
