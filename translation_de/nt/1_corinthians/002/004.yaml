- from: Und meine Rede und meine Verkündigung bestanden nicht in überzeugender Weisheitsrede[a], sondern in einem Erweis des Geistes[b] und der Kraft.
  to: Und meine Rede und meine Verkündigung waren nicht in überzeugender Weisheitsrede[a], sondern in einem Erweis des Geistes[b] und der Kraft.
  rationale: Die Revision beseitigt die leichte Bedeutungsverstärkung durch „bestanden“, erhält die knappe Wiedergabe von πειθοῖ σοφίας und formuliert die Fußnote zu πνεύματος als echte, verständliche Alternative. Die Zuordnung von „Geist“ und „Kraft“ bleibt bewusst als parallele Genitive stehen.
