source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: de
  text: Und meine Rede und meine Verkündigung waren nicht in überzeugender Weisheitsrede[a], sondern in einem Erweis des Geistes[b] und der Kraft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in überzeugenden Worten der Weisheit“.'
    reason: Die knappe griechische Fügung kann mit einer ausdrücklich genannten Rede bzw. mit „Worten“ wiedergegeben werden; der Haupttext ergänzt dieses Wort nicht.
  - marker: b
    text: 'Oder: „eines Geistes“, im allgemeinen, nicht ausdrücklich auf Gottes Geist bezogenen Sinn.'
    reason: πνεύματος ist ohne Artikel; im Zusammenhang ist Gottes Geist naheliegend, doch die allgemeinere Lesart wird nicht ausgeschlossen.
lexical_decisions:
- source_word: λόγος
  choice: Rede
  rationale: Im rhetorischen Zusammenhang bezeichnet λόγος hier die Redeweise bzw. das Reden des Paulus. „Rede“ hält den Begriff von κήρυγμα („Verkündigung“) auseinander.
- source_word: κήρυγμα
  choice: Verkündigung
  rationale: „Verkündigung“ bewahrt den öffentlichen, heroldartigen Sinn und ist im modernen kirchlichen wie allgemeinen Deutsch verständlich.
- source_word: πειθοῖ σοφίας
  choice: überzeugende Weisheitsrede
  rationale: Die knappe und textkritisch schwierige griechische Fügung verbindet rhetorische Überzeugung mit Weisheit. „Weisheitsrede“ gibt das im Deutschen kompakt wieder, ohne „Worte“ ausdrücklich in den Haupttext einzufügen.
- source_word: ἀποδείξει
  choice: Erweis
  rationale: „Erweis“ bezeichnet ein sichtbar oder wirksam bestätigendes Aufzeigen und bildet einen prägnanten Gegensatz zu rhetorischer Überzeugung.
- source_word: πνεύματος
  choice: des Geistes
  rationale: Der nähere Zusammenhang weist auf Gottes Geist als handelnde göttliche Wirklichkeit; die Großschreibung entspricht diesem Verständnis. Die grammatisch mögliche allgemeinere Lesart bleibt in einer Fußnote erhalten.
- source_word: δυνάμεως
  choice: der Kraft
  rationale: „Kraft“ ist eine natürliche und in diesem Zusammenhang treffende Wiedergabe von δύναμις; die parallele Genitivkonstruktion des Griechischen bleibt erhalten.
theological_decisions:
- issue: Bezeichnet πνεύματος den Geist Gottes oder allgemein Geist?
  choice: des Geistes
  alternative: des Geistes im allgemeineren Sinn bzw. „von Geist“
  rationale: Der weitere Gedankengang in 1. Korinther 2 spricht ausdrücklich von Gottes Geist und stützt daher die personale Lesart. Da das Wort selbst hier ohne ausdrückliche nähere Bestimmung steht, wird die offenere Möglichkeit in der Fußnote dokumentiert.
- issue: Wie ist das Verhältnis von Geist und Kraft im Erweis zu verstehen?
  choice: 'Beide Genitive werden gleichgeordnet wiedergegeben: „des Geistes und der Kraft“.'
  alternative: Eine deutende Wiedergabe wie „durch Geist und Kraft“
  rationale: Die formale Parallelität bewahrt die Spannung, ob Geist und Kraft Inhalt, Ursprung oder Mittel des Erweises sind, statt diese syntaktisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Weisheitsrede“ ist bewusst kompakt und leicht gehoben, um die knappe griechische Fügung ohne unnötige Ausdeutung abzubilden. Die Wiederholung „in … sondern in …“ erhält den syntaktischen Gegensatz des Ausgangstextes.
