id: 1CO.2.13
reference: 1 Corinthians 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: de
  text: Davon reden wir auch – nicht mit Worten, die menschliche Weisheit lehrt, sondern mit Worten, die der Geist lehrt, indem wir Geistliches durch Geistliches erklären.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung kann auch bedeuten: „indem wir geistliche Dinge geistlichen Menschen erklären“ oder „indem wir Geistliches mit geistlichen Worten ausdrücken“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: Davon
  rationale: Das Relativpronomen greift inhaltlich auf die zuvor genannten, von Gott geschenkten Dinge zurück; „davon“ stellt diesen Rückbezug im Deutschen natürlich her.
- source_word: λαλοῦμεν
  choice: reden wir
  rationale: „Reden“ bewahrt den mündlichen Aussagecharakter von λαλέω und fügt sich idiomatisch in die Verbindung „davon reden“ ein.
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: nicht mit Worten, die menschliche Weisheit lehrt
  rationale: „Mit“ gibt das instrumentale ἐν natürlich wieder; die Formulierung wahrt menschliche Weisheit als Quelle der Belehrung.
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: sondern mit Worten, die der Geist lehrt
  rationale: Das im zweiten Glied ausgelassene λόγοις wird für klares Deutsch wiederholt. Der Kontext identifiziert πνεῦμα mit Gottes Geist.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: indem wir Geistliches durch Geistliches erklären
  rationale: Die neutrale Wiedergabe erhält die formale Wiederholung und lässt offen, worauf das zweite „Geistliches“ konkret zielt. συγκρίνω kann im Kontext das Zusammenbringen beziehungsweise Erklären bezeichnen.
theological_decisions:
- issue: Referent von πνεύματος
  choice: der Geist
  alternative: Geist im unpersönlichen oder allgemeinen Sinn
  rationale: Der unmittelbare Zusammenhang spricht wiederholt von Gottes Geist als dem Handelnden, der offenbart und lehrt.
- issue: Deutung von πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: Geistliches durch Geistliches erklären
  alternative: Geistliche Dinge geistlichen Menschen erklären; Geistliches mit geistlichen Worten ausdrücken; Geistliches mit Geistlichem vergleichen
  rationale: Kasus, Genus und Bedeutungsbreite von συγκρίνω erlauben mehrere Deutungen. Der Haupttext bewahrt die Spannung möglichst knapp; die Fußnote nennt die wichtigsten syntaktischen Alternativen, ohne eine davon dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert den langen Kontrast. Die Wiederholung von „Worten“ schafft Klarheit, während die schwierige Schlusswendung bewusst nicht auf nur eine mögliche Deutung verengt wird.
