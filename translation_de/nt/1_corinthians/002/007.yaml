revisions:
- from: Sondern wir sprechen Gottes Weisheit im Geheimnis[a], die verborgene, die Gott vor den Zeitaltern zu unserer Herrlichkeit vorherbestimmt[b] hat.
  to: Sondern wir reden von Gottes Weisheit als einem Geheimnis[a], der verborgenen Weisheit, die Gott vor den Zeitaltern zu unserer Herrlichkeit vorherbestimmt[b] hat.
  rationale: Die Revision ersetzt die im heutigen Deutsch missverständliche Wendung „im Geheimnis“ durch „als einem Geheimnis“ und wiederholt „Weisheit“ in der Apposition. Dadurch bleibt der Bezug der verborgenen Weisheit deutlich, während die Aussage über Gottes vorherige Bestimmung, die Zeitalter und unsere Herrlichkeit unverändert erhalten bleibt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:48:09Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes im Wesentlichen zutreffend wieder. „Vor den Zeitaltern“ entspricht πρὸ τῶν αἰώνων, und „zu unserer Herrlichkeit“ bewahrt εἰς δόξαν ἡμῶν. Bei ἐν μυστηρίῳ ist „im Geheimnis“ jedoch im heutigen Deutsch semantisch schief und kann ein heimliches Sprechen nahelegen, statt die Weisheit als Gottes offenbarungsbezogenes „Geheimnis“ zu kennzeichnen.
  naturalness: „Sondern wir reden von Gottes Weisheit als einem Geheimnis“ ist modernes, verständliches Standarddeutsch und bildet die appositionale Verbindung mit „der verborgenen Weisheit“ natürlich ab. Die im Entwurf substantivierte Ellipse „die verborgene“ ist zwar möglich, wirkt hier aber unnötig abgebrochen.
  terminology: „Geheimnis“, „vorherbestimmt“, „Zeitalter“ und „Herrlichkeit“ sind angemessene, theologisch nicht einengende Wiedergaben. Die Formulierung „als einem Geheimnis“ vermeidet die falsche Konnotation von „im Geheimnis“, ohne die syntaktische Funktion der Präpositionalphrase übermäßig festzulegen.
  issues:
  - severity: medium
    issue: „im Geheimnis“
    rationale: Im modernen Deutsch bezeichnet die Wendung gewöhnlich die Umstände eines heimlichen Vorgangs. Das griechische ἐν μυστηρίῳ steht hier im Zusammenhang der als μυστήριον charakterisierten Weisheit; „als einem Geheimnis“ vermittelt dies klarer.
  - severity: low
    issue: Ellipse „die verborgene“
    rationale: Das feminine Partizip bezieht sich auf σοφίαν, doch die bloße Ellipse klingt im Deutschen weniger flüssig. Die Wiederaufnahme „der verborgenen Weisheit“ macht den Bezug explizit und bewahrt den griechischen Sinn.
  revised_text: Sondern wir reden von Gottes Weisheit als einem Geheimnis[a], der verborgenen Weisheit, die Gott vor den Zeitaltern zu unserer Herrlichkeit vorherbestimmt[b] hat.
