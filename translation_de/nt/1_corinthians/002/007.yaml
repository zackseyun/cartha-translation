  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: de
  text: Sondern wir reden von Gottes Weisheit als einem Geheimnis[a], der verborgenen Weisheit, die Gott vor den Zeitaltern zu unserer Herrlichkeit vorherbestimmt[b] hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Geheimnis“; das griechische Wort bezeichnet bei Paulus oft Gottes einst verborgenen, nun offenbarten Plan.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Voraus bestimmt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: wir sprechen
  rationale: Die schlichte Wiedergabe entspricht dem üblichen Sinn von λαλέω und verstärkt die Aussage nicht unnötig zu einer förmlichen Verkündigung.
- source_word: θεοῦ σοφίαν
  choice: Gottes Weisheit
  rationale: Der Genitiv wird im Deutschen natürlich possessiv wiedergegeben; die Weisheit gehört Gott und kommt von ihm.
- source_word: ἐν μυστηρίῳ
  choice: im Geheimnis
  rationale: Diese im Deutschen idiomatische Formulierung bewahrt den paulinischen Gedanken eines zuvor verborgenen göttlichen Plans besser als „im Verborgenen“, ohne bloße Rätselhaftigkeit auszudrücken.
- source_word: τὴν ἀποκεκρυμμένην
  choice: die verborgene
  rationale: Das substantivierte feminine Partizip nimmt „Weisheit“ auf. Die knappe Apposition bildet die griechische Struktur nach und bleibt im Deutschen verständlich.
- source_word: προώρισεν
  choice: vorherbestimmt hat
  rationale: Die Wiedergabe erhält die starke Bedeutung einer vorgängigen göttlichen Festlegung, ohne sie durch eine konfessionelle Systematik näher zu bestimmen.
- source_word: πρὸ τῶν αἰώνων
  choice: vor den Zeitaltern
  rationale: „Zeitalter“ gibt αἰῶνες direkt wieder und bewahrt den zeitlich-kosmischen Horizont der Aussage.
- source_word: εἰς δόξαν ἡμῶν
  choice: zu unserer Herrlichkeit
  rationale: Die Formulierung gibt Zielrichtung und theologisches Gewicht von εἰς δόξαν unmittelbar wieder, ohne auf „Ehre“ abzuschwächen oder „Verherrlichung“ interpretierend einzusetzen.
theological_decisions:
- issue: Wiedergabe von προώρισεν im theologisch gewichtigen paulinischen Zusammenhang
  choice: vorherbestimmt hat
  alternative: im Voraus bestimmt hat
  rationale: „Vorherbestimmt“ bewahrt die lexikalische Stärke des Verbs als vorgängige Festlegung Gottes. Der Vers selbst wird nicht über seine Aussage hinaus auf ein bestimmtes Lehrsystem eingeengt.
- issue: Bezug und Sinn von ἐν μυστηρίῳ
  choice: Gottes Weisheit „im Geheimnis“
  alternative: Gottes Weisheit „als Geheimnis“
  rationale: Die gewählte Form erhält die syntaktische Offenheit der Präpositionalphrase und den paulinischen Sinn eines einst verborgenen göttlichen Plans, ohne eindeutig festzulegen, ob die Wendung Art, Inhalt oder Sphäre des Sprechens bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Orientierung an der griechischen Syntax. Die ungewöhnliche, aber verständliche Wendung „vor den Zeitaltern“ bewahrt bewusst das kosmisch-zeitliche Bild des Ausgangstextes.
