  source_fidelity: Die Wiedergabe von ψυχικὸς ἄνθρωπος, δέχεται, μωρία, γνῶναι und πνευματικῶς ἀνακρίνεται ist im Grundsatz treffend. Allerdings legt „was vom Geist Gottes kommt“ den Genitiv τοῦ πνεύματος τοῦ θεοῦ vorwiegend als Ursprung fest, während die griechische Wendung zunächst offen von dem spricht, was zum Geist Gottes gehört bzw. ihn betrifft. „Was zum Geist Gottes gehört“ bewahrt diese Breite besser. Das Passiv „geistlich beurteilt wird“ ist als mögliche Wiedergabe von πνευματικῶς ἀνακρίνεται vertretbar.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch mit angemessenem Bibelregister. Die Umstellung auf einen Strichpunkt macht die enge Verknüpfung von Unvermögen und Begründung klar, ohne den Sinn zu verändern.
  terminology: „Der natürliche Mensch“, „Geist Gottes“, „Torheit“, „erkennen“ und „geistlich“ sind konsistent und terminologisch angemessen. Die Fußnoten werden an die jeweils erläuterten Ausdrücke gesetzt; die Alternative zu γνῶναι und jene zu ἀνακρίνεται sollen nicht unter derselben, nur bei „erkennen“ stehenden Anmerkung vermischt werden.
