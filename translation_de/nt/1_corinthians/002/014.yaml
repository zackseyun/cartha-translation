source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: de
  text: Der natürliche Mensch aber nimmt nicht an, was zum Geist Gottes gehört,[a] denn es ist für ihn Torheit; er kann es auch nicht erkennen,[b] weil es geistlich beurteilt wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was vom Geist Gottes kommt«; wörtlich: »die Dinge des Geistes Gottes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verstehen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »geistlich geprüft« oder »geistlich untersucht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: natürliche
  rationale: ψυχικός steht hier im Gegensatz zu πνευματικός. »Natürlich« bewahrt diese Spannung, ohne den Ausdruck durch »ohne den Geist« stärker auszudeuten als der griechische Text.
- source_word: ἄνθρωπος
  choice: Mensch
  rationale: »Mensch« gibt den generischen Singular im Deutschen würdig und natürlich wieder, ohne ihn auf Männer zu beschränken.
- source_word: δέχεται
  choice: nimmt nicht an
  rationale: δέχομαι bezeichnet hier nicht nur passives Empfangen, sondern das Annehmen beziehungsweise Anerkennen dessen, was vom Geist kommt.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: was vom Geist Gottes kommt
  rationale: Die Formulierung gibt die breite griechische Wendung natürlich wieder und lässt offen, ob Zugehörigkeit, Ursprung oder vermittelte Wirklichkeit im Vordergrund steht.
- source_word: μωρία
  choice: Torheit
  rationale: »Torheit« ist eine prägnante, im Zusammenhang des 1. Korintherbriefs konsistente Wiedergabe des Gegensatzes zwischen Gottes Weisheit und menschlichem Urteil.
- source_word: γνῶναι
  choice: erkennen
  rationale: »Erkennen« bewahrt den Bedeutungsumfang von γινώσκω zwischen Kennen, Verstehen und Einsicht und klingt hier natürlicher als »wissen«.
- source_word: πνευματικῶς
  choice: geistlich
  rationale: Das Adverb bezeichnet die geistliche Weise oder Sphäre des Beurteilens; »geistlich« ist die direkte und im Kontext verständliche Entsprechung.
- source_word: ἀνακρίνεται
  choice: beurteilt wird
  rationale: ἀνακρίνω kann prüfen, untersuchen, beurteilen oder unterscheiden bedeuten. »Beurteilt« erhält den evaluativen Sinn; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von ψυχικὸς ἄνθρωπος im Gegensatz zu geistlichem Urteilen
  choice: der natürliche Mensch
  alternative: der ungeistliche Mensch; der Mensch ohne den Geist
  rationale: »Der natürliche Mensch« erhält den ausdrücklichen Gegensatz zu πνευματικός, ohne bereits zu entscheiden, wie genau das Verhältnis dieses Menschen zum Geist dogmatisch zu bestimmen ist.
- issue: Bezug und Bedeutung von πνευματικῶς ἀνακρίνεται
  choice: weil es geistlich beurteilt wird
  alternative: weil es durch den Geist beurteilt wird; weil es geistlich erkannt wird
  rationale: Die adverbiale Form wird formal als »geistlich« bewahrt. So bleibt offen, ob vor allem die Art, die Sphäre oder mittelbar das Wirken des Geistes bezeichnet wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. Der generische Singular »Mensch« und das anschließende Pronomen »ihn« folgen der Bildlichkeit des griechischen Textes. Die Satzteilung erhöht die Lesbarkeit, ohne die argumentative Verbindung aufzulösen.
