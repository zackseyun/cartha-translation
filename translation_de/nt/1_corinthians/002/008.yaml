id: 1CO.2.8
reference: 1 Corinthians 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: de
  text: die keiner von den Herrschern dieses Zeitalters[a] erkannt hat. Denn wenn sie sie erkannt hätten, hätten sie den Herrn der Herrlichkeit nicht gekreuzigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Herrschern dieses Zeitalters« können menschliche Machthaber, geistliche Mächte oder beide gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: die
  rationale: Das feminine Relativpronomen bezieht sich auf die zuvor genannte »Weisheit« und bewahrt Geschlecht und Satzverknüpfung des Griechischen.
- source_word: ἀρχόντων
  choice: Herrschern
  rationale: »Herrscher« bezeichnet Personen oder Mächte, die Herrschaft ausüben, ohne die mögliche menschliche oder geistliche Referenz einzuengen.
- source_word: αἰῶνος τούτου
  choice: dieses Zeitalters
  rationale: »Zeitalter« gibt den zeitlich und heilsgeschichtlich geprägten Sinn von αἰών genauer wieder als »Welt«.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: erkannt hat / erkannt hätten
  rationale: »Erkennen« gibt γινώσκω direkt wieder und kann hier sowohl Kenntnis als auch das Erfassen der Bedeutung einschließen. Der Konjunktiv Plusquamperfekt entspricht der irrealen Bedingung.
- source_word: κύριον
  choice: Herrn
  rationale: »Herr« ist die übliche, theologisch gewichtige Wiedergabe von κύριος.
- source_word: δόξης
  choice: Herrlichkeit
  rationale: »Herrlichkeit« ist die etablierte und dem biblischen Register angemessene Wiedergabe von δόξα.
- source_word: κύριον τῆς δόξης
  choice: den Herrn der Herrlichkeit
  rationale: Die Genitivverbindung bleibt erhalten und bewahrt die feierliche, pointierte Formulierung des Ausgangstextes.
- source_word: ἐσταύρωσαν
  choice: gekreuzigt
  rationale: »Kreuzigen« ist die direkte, historisch bestimmte Wiedergabe von σταυρόω.
theological_decisions:
- issue: Identität der »Herrscher dieses Zeitalters«
  choice: Die Formulierung bleibt im Haupttext bewusst offen.
  alternative: Menschliche politische oder religiöse Machthaber; geistliche beziehungsweise dämonische Mächte; oder beide Ebenen zugleich.
  rationale: Der griechische Ausdruck lässt im paulinischen Zusammenhang mehrere Deutungen zu. Die Übersetzung entscheidet nicht, was der Vers selbst offenlässt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von »erkannt« und die Wendung »Herr der Herrlichkeit« bewahren bewusst Struktur und theologisches Gewicht des griechischen Textes.
