id: 1CO.2.5
reference: 1 Corinthians 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: de
  text: damit euer Glaube nicht auf menschlicher Weisheit beruht, sondern auf Gottes Kraft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zwecksatz natürlich ein und bewahrt dessen Zielrichtung.
- source_word: ἡ πίστις ὑμῶν
  choice: euer Glaube
  rationale: Bezeichnet hier den Glauben der korinthischen Gemeinde; „Glaube“ ist die sachlich und kontextuell passende Wiedergabe von πίστις.
- source_word: μὴ ᾖ ἐν
  choice: nicht auf … beruht
  rationale: Die idiomatische deutsche Formulierung gibt wieder, worin der Glaube seinen Grund beziehungsweise seine tragende Basis hat, und erhält den Parallelismus mit dem zweiten Satzglied.
- source_word: σοφίᾳ ἀνθρώπων
  choice: menschlicher Weisheit
  rationale: ἀνθρώπων bezeichnet hier Menschen allgemein. „Menschlich“ gibt den inklusiven Sinn im modernen Deutschen präzise und natürlich wieder.
- source_word: δυνάμει θεοῦ
  choice: Gottes Kraft
  rationale: Bewahrt den Gegensatz zwischen menschlicher Weisheit und der wirksamen Kraft Gottes; „Kraft“ ist eine natürliche Wiedergabe von δύναμις.
theological_decisions:
- issue: Bedeutung der Präposition ἐν bei der Grundlage des Glaubens
  choice: „auf … beruht“
  alternative: „in … ist“
  rationale: Das Deutsche verwendet hier idiomatisch „auf etwas beruhen“. Dies bringt die Grundlage des Glaubens zum Ausdruck, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Generischer Sinn von ἀνθρώπων
  choice: „menschlicher Weisheit“
  alternative: „Weisheit der Menschen“
  rationale: Beide Wiedergaben sind inklusiv; „menschliche Weisheit“ ist knapper, natürlich und stellt Gottes Kraft klar der Weisheit gegenüber, die ihren Ursprung bei Menschen hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der ausgewogene Gegensatz des griechischen Satzes bleibt durch die parallele Konstruktion „auf … beruht, sondern auf …“ klar erhalten.
