source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: de
  text: 'Was nun das Essen von Speisen betrifft, die Götzen geopfert wurden: Wir wissen, dass ein Götze in der Welt nichts ist[a] und dass es keinen Gott außer einem gibt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ein Götze in der Welt keine wirkliche Existenz hat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass es keinen Gott außer dem einen gibt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: das Essen
  rationale: Das Substantiv bezeichnet hier den Vorgang des Essens; die Wiedergabe bewahrt diesen verbalen Sinn und klingt im Deutschen natürlich.
- source_word: εἰδωλοθύτων
  choice: Speisen, die Götzen geopfert wurden
  rationale: Die Form bezeichnet Opfergaben beziehungsweise Speisen aus heidnischen Opfern, ohne den Bezug unnötig auf Fleisch zu verengen.
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Die Perfektform hat hier präsentische Bedeutung und greift ein von Paulus und den Korinthern beanspruchtes gemeinsames Wissen auf.
- source_word: οὐδὲν εἴδωλον
  choice: ein Götze … nichts ist
  rationale: Die knappe Prädikatsaussage des Griechischen bleibt erhalten. Sie kann die Nichtigkeit oder fehlende reale Existenz eines Götzen ausdrücken; diese Ambiguität wird in der Fußnote sichtbar gemacht.
- source_word: ἐν κόσμῳ
  choice: in der Welt
  rationale: Dies ist die natürliche deutsche Entsprechung und bezeichnet hier den Bereich der Wirklichkeit beziehungsweise der geschaffenen Welt.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: es keinen Gott gibt außer dem einen
  rationale: Die Formulierung gibt die ausschließliche Aussage des griechischen Textes wieder. „Dem einen“ ist im Deutschen idiomatisch und weist auf den einen Gott, ohne die Aussage über den Wortlaut hinaus auszubauen.
- source_word: οὖν
  choice: Was nun … betrifft
  rationale: In Verbindung mit περὶ markiert οὖν die folgernde Rückkehr zum Thema. Die deutsche Wendung verbindet den Vers natürlich mit dem vorhergehenden Gedankengang.
theological_decisions:
- issue: Nichtigkeit beziehungsweise fehlende Existenz eines Götzen
  choice: „ein Götze in der Welt nichts ist“ im Haupttext
  alternative: „ein Götze in der Welt keine wirkliche Existenz hat“
  rationale: Der Haupttext wahrt die prägnante und mehrdeutige Aussage οὐδὲν εἴδωλον; die explizit ontologische Deutung steht als mögliche Wiedergabe in der Fußnote.
- issue: Monotheistische Aussage und Großschreibung von θεός
  choice: „keinen Gott … außer dem einen“
  alternative: „keinen Gott außer einem“ oder „keinen Gott außer dem einen Gott“
  rationale: Die gewählte Formulierung bewahrt die starke monotheistische Aussage und den Kontrast zu den Götzen, ohne „Gott“ am Ende erklärend zu wiederholen. Die mögliche Kleinschreibung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die thematische Einleitung ist bewusst natürlich formuliert; die beiden theologisch gewichtigen Aussagen bleiben eng am griechischen Wortlaut. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Aussagen.
