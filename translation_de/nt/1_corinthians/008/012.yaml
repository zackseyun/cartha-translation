id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: de
  text: Indem ihr auf diese Weise gegen die Brüder[a] sündigt und ihr schwaches Gewissen verletzt, sündigt ihr gegen den Messias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ bezeichnet hier Glaubensgeschwister; der Zusammenhang kann Männer und Frauen einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“. Das griechische Wort Χριστός ist ein Titel und bedeutet „Gesalbter“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Wenn ihr so
  rationale: οὕτως weist auf die zuvor beschriebene Handlungsweise zurück. Die konditionale Satzfügung mit „wenn“ gibt die beiden Partizipien im Deutschen natürlich als Umstand wieder; δέ verbindet hier nur leicht mit dem vorigen Gedankengang und muss nicht eigens durch „aber“ markiert werden.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: gegen die Brüder sündigt
  rationale: εἰς bezeichnet nach ἁμαρτάνω die gegen Personen gerichtete Verfehlung. „Brüder“ wahrt die grammatisch maskuline Form; eine Fußnote erläutert den im gemeindlichen Zusammenhang weiteren Bezug.
- source_word: τύπτοντες
  choice: verletzt
  rationale: τύπτω bedeutet wörtlich „schlagen“, wird hier jedoch bildlich auf das Gewissen bezogen. „Verletzt“ bewahrt die schädigende Wirkung und ist im modernen Deutschen idiomatisch.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: ihr schwaches Gewissen
  rationale: Der griechische Singular „das Gewissen“ steht mit einem pluralischen Possessivbezug und kann distributiv verstanden werden. Der deutsche Singular erhält diese Form und bleibt verständlich.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: sündigt ihr gegen den Messias
  rationale: εἰς hat erneut die Bedeutung „gegen“. Der Präsens wird als „sündigt“ wiedergegeben; Χριστός wird in seiner Titelfunktion mit „Messias“ übersetzt.
theological_decisions:
- issue: Bezug von ἀδελφοὺς im gemeindlichen Kontext
  choice: Brüder
  alternative: Brüder und Schwestern; Glaubensgeschwister
  rationale: Die griechische Form ist maskulin pluralisch, kann in der Anrede der Gemeinde jedoch Glaubende beider Geschlechter einschließen. Der Haupttext wahrt die Form, die Fußnote erläutert den möglichen Umfang.
- issue: Wiedergabe von Χριστόν
  choice: Messias
  alternative: Christus
  rationale: Χριστός ist der griechische Titel für den Gesalbten. „Messias“ macht den Titelgehalt sichtbar; die geläufige traditionelle Wiedergabe wird in der Fußnote genannt.
- issue: Verhältnis der Partizipien zum Hauptverb
  choice: 'konditionale Umstandsangabe: „Wenn ihr … sündigt und … verletzt“'
  alternative: 'modal: „Indem ihr … sündigt und … verletzt“'
  rationale: Die Partizipien beschreiben die Umstände beziehungsweise die Art des im Hauptsatz genannten Sündigens. Das Deutsche „wenn“ gibt die Aussage natürlich wieder, ohne die sachliche Verknüpfung aufzulösen; „indem“ wäre ebenfalls möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konditionale Satzform vermeidet eine schwerfällige Häufung von Partizipialkonstruktionen. „Verletzt“ ist bei einem Gewissen natürlicher als das wörtlichere „schlagt“, lässt aber die im griechischen Verb enthaltene Schädigung deutlich hervortreten.
