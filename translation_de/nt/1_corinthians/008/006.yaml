source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: de
  text: Doch für uns gibt es nur einen Gott, den Vater, von dem alles kommt und für den wir da sind,[a] und nur einen Herrn, Jesus, den Messias,[b] durch den alles ist und durch den auch wir da sind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und mit stärkerer Zielrichtung kann die Wendung auch wiedergegeben werden: „und wir auf ihn hin“. Das griechische εἰς kann Richtung, Ziel oder Zweck ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jesus Christus“. Das griechische Χριστός kann als Titel („Messias“) oder als namensähnliche Bezeichnung („Christus“) gebraucht werden.'
    reason: alternative_reading
  - marker: c
    text: Die parallelen Aussagen „von dem alles kommt“ und „durch den alles ist“ unterscheiden den Vater als Ursprung von Jesus, dem Messias, als dem Vermittler. Die knappe griechische Wendung „und wir durch ihn“ lässt offen, ob besonders unsere Existenz, unser Leben oder unser Heil gemeint ist; die deutsche Ergänzung „auch wir da sind“ dient der Verständlichkeit.
    reason: theological_and_elliptical_clarification
lexical_decisions:
- source_word: ἀλλ’
  choice: doch
  rationale: Kennzeichnet den Gegensatz zu den zuvor genannten sogenannten Göttern und Herren und fügt sich natürlich in das deutsche Bekenntnis ein.
- source_word: ἡμῖν
  choice: für uns
  rationale: Der Dativ bezeichnet hier den Standpunkt beziehungsweise Bezugsrahmen der Glaubenden.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: nur einen Gott, den Vater
  rationale: „Einen Gott“ bewahrt die monotheistische Aussage; das im Deutschen ergänzte „nur“ macht im Kontext unmissverständlich, dass nicht einer unter mehreren gemeint ist. „Den Vater“ identifiziert diesen einen Gott appositionell.
- source_word: ἐξ οὗ τὰ πάντα
  choice: von dem alles kommt
  rationale: ἐξ bezeichnet Ursprung oder Quelle. Die Formulierung ist gegenwärtiges, verständliches Deutsch und lässt den umfassenden Bezug von τὰ πάντα bestehen.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: und für den wir da sind
  rationale: εἰς kann Richtung, Ziel oder Zweck bezeichnen. „Für den wir da sind“ gibt die Ausrichtung auf Gott als Ziel wieder, ohne sie enger festzulegen.
- source_word: καὶ εἷς κύριος
  choice: und nur einen Herrn
  rationale: Bewahrt die Parallelität zu „einen Gott“ und gibt κύριος mit dem theologisch gewichtigen und im Deutschen üblichen „Herr“ wieder.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, den Messias
  rationale: Χριστός hat hier in der bekenntnishaften Apposition gut erkennbaren Titelcharakter. Die Formulierung macht die Bedeutung des griechischen Titels verständlich; die herkömmliche Wiedergabe „Jesus Christus“ bleibt in einer Fußnote erhalten.
- source_word: δι’ οὗ τὰ πάντα
  choice: durch den alles ist
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Wirkursache. „Durch den alles ist“ bewahrt diese Relation und vermeidet eine unnötige Festlegung darauf, ob ausschließlich Schöpfung, Fortbestand oder die gesamte Wirklichkeit im Blick ist.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: und durch den auch wir da sind
  rationale: Die Ergänzung „da sind“ macht die griechische Ellipse in natürlichem Deutsch verständlich. Sie lässt offen, ob Paulus besonders an Existenz, neues Leben oder Heil denkt.
theological_decisions:
- issue: Verhältnis von „einem Gott“ und „einem Herrn“ innerhalb des monotheistischen Bekenntnisses
  choice: Die parallele Aussage über den einen Gott, den Vater, und den einen Herrn, Jesus, den Messias, bleibt ohne abschwächende oder dogmatisch erweiternde Paraphrase stehen.
  alternative: „Herr“ weniger gewichtig wiedergeben oder eine spätere trinitarische Begrifflichkeit ausdrücklich in den Vers eintragen.
  rationale: Der griechische Text verbindet eine strenge Einheitsaussage mit einer Unterscheidung zwischen dem Vater und Jesus. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Unterschiedliche Präpositionen für den Vater und Jesus
  choice: ἐξ wird mit „von“, εἰς mit „für“ und διά mit „durch“ wiedergegeben.
  alternative: Die Beziehungen durch eine einheitliche oder erklärend erweiterte Formulierung einebnen.
  rationale: Die Präpositionen stellen den Vater als Ursprung und Ziel sowie Jesus als vermittelnd Handelnden dar. Diese Unterscheidung gehört zur Aussageform des Verses.
- issue: Bedeutung von Χριστός
  choice: Titelhaft als „Messias“ wiedergegeben.
  alternative: Die eingebürgerte namensähnliche Form „Christus“.
  rationale: Beides ist sprachlich möglich. In der bekenntnishaften Wendung „ein Herr, Jesus Christus“ ist der Titelcharakter gut begründet, darf aber nicht als einzig mögliche Deutung ausgegeben werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer bekenntnishafter Parallelstruktur. „Da sein“ macht die Ellipsen für heutige Leser verständlich, ohne ihren Sinn unnötig auf Schöpfung oder Erlösung zu verengen. Die Wiederholung von „nur einen“ entspricht natürlichem deutschem Ausdruck und verdeutlicht die exklusive Einheitsaussage im Kontext.
