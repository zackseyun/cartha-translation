source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: de
  text: Doch Nahrung wird uns bei Gott keinen Vorzug verschaffen; denn weder haben wir mehr, wenn wir essen, noch fehlt uns etwas, wenn wir nicht essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: Nahrung
  rationale: Der allgemeine Ausdruck bezeichnet Essen bzw. Nahrung, nicht speziell Fleisch oder eine bestimmte Mahlzeit.
- source_word: παραστήσει τῷ θεῷ
  choice: wird uns vor Gott keinen Vorzug verschaffen
  rationale: παρίστημι kann hier das Hinstellen bzw. Präsentieren vor Gott bezeichnen; im Kontext legt die folgende Gegenüberstellung nahe, dass Nahrung keinen Vorteil im Verhältnis zu Gott bewirkt. Die Formulierung ist idiomatisch, ohne eine rein räumliche Annäherung festzulegen.
- source_word: περισσεύομεν
  choice: haben wir mehr
  rationale: Bewahrt den Gedanken des Überflusses oder Vorteils und bildet einen knappen Gegensatz zu ὑστερούμεθα.
- source_word: ὑστερούμεθα
  choice: fehlt uns etwas
  rationale: Gibt den Gedanken des Mangels oder Zurückstehens natürlich wieder und erhält die antithetische Struktur.
- source_word: δὲ ... γὰρ
  choice: Doch ... denn
  rationale: „Doch“ markiert den milden Gegensatz, „denn“ leitet die Begründung ein.
theological_decisions:
- issue: Bezeichnet παραστήσει die Präsentation vor Gott oder einen geistlichen Vorzug?
  choice: Die Hauptfassung drückt aus, dass Nahrung vor Gott keinen Vorzug verschafft.
  alternative: „Nahrung wird uns nicht vor Gott hinstellen.“
  rationale: Die wörtlichere Alternative bewahrt die forensisch-kultische Bildsprache, klingt im Deutschen jedoch unklar. Der Kontext und die anschließenden Verben sprechen für fehlenden Gewinn oder Verlust, ohne genauer zu bestimmen, ob rituelle Annahme oder allgemeiner geistlicher Stand gemeint ist.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die parallele Struktur „weder … noch“ bleibt erhalten; die Fußnote dokumentiert die formalere Wiedergabe.
