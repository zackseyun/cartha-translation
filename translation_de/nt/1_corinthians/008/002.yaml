base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: de
  text: Wenn jemand meint, etwas erkannt zu haben,[a] hat er noch nicht in der Weise erkannt, wie man erkennen soll.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn jemand meint, etwas zu wissen, weiß er noch nicht so, wie man wissen soll.“'
    reason: 'Lexikalische Alternative: γινώσκω kann hier idiomatisch auch mit „wissen“ wiedergegeben werden; „erkannt zu haben“ bildet den Perfektinfinitiv deutlicher ab.'
lexical_decisions:
- source_word: εἴ τις
  choice: Wenn jemand
  rationale: Gibt die generische Bedingung natürlich und ohne Einschränkung auf ein bestimmtes Geschlecht wieder.
- source_word: δοκεῖ
  choice: meint
  rationale: Bezeichnet hier die subjektive Einschätzung, Wissen erlangt zu haben; „meint“ passt zur Warnung vor Selbstgewissheit.
- source_word: ἐγνωκέναι
  choice: erkannt zu haben
  rationale: Der Perfektinfinitiv bezeichnet einen beanspruchten erreichten Erkenntnisstand. Die deutsche Perfektform bewahrt diesen Aspekt.
- source_word: τι
  choice: etwas
  rationale: Gibt das unbestimmte Objekt der Erkenntnis knapp und idiomatisch wieder.
- source_word: οὔπω ἔγνω
  choice: hat er noch nicht … erkannt
  rationale: „Noch nicht“ erhält den zeitlichen beziehungsweise unabgeschlossenen Zug; das Perfekt ist im Deutschen in diesem Satz natürlich.
- source_word: καθὼς δεῖ γνῶναι
  choice: so …, wie man erkennen soll
  rationale: Bewahrt den Maßstabs- und Modalcharakter von καθὼς sowie die normative Kraft von δεῖ, ohne die Aussage auf bloße Wissensmenge zu verengen.
theological_decisions:
- issue: Generischer Personenbezug
  choice: jemand … er … man
  alternative: wer … der; eine Person … sie
  rationale: τις ist generisch. „Jemand“ schließt alle Menschen ein; das rückbezügliche „er“ ist grammatisch bedingt und bezeichnet keinen ausschließlich männlichen Referenten. Das generische „man“ gibt den allgemeinen Maßstab im Schlusssatz natürlich wieder.
- issue: Art von Paulus’ Kritik
  choice: Kritik an selbstgewisser und unzureichender Erkenntnis
  alternative: grundsätzliche Verneinung menschlicher Erkenntnis
  rationale: Der Vers bestreitet nicht jede Erkenntnis, sondern stellt infrage, ob sie bereits der gebotenen Weise oder dem gebotenen Maß entspricht. Die wiederholte Wiedergabe mit „erkennen“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „erkennen“ spiegelt die Wortfamilie γινώσκω in allen drei Formen und erhält den rhetorischen Zusammenhang. Das Komma vor dem Fußnotenzeichen folgt der Satzstruktur; der Marker steht unmittelbar nach der betroffenen Formulierung.
