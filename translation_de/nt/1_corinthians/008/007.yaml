id: 1CO.8.7
reference: 1 Corinthians 8:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: de
  text: Doch nicht alle haben diese Erkenntnis. Manche essen aufgrund ihrer bis heute bestehenden Verbindung mit dem Götzen[a] Speise als Götzenopferfleisch, und ihr Gewissen wird, weil es schwach ist, befleckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck ist schwierig und kann wörtlicher etwa mit »aufgrund der Gewöhnung an den Götzen bis jetzt« wiedergegeben werden. Einige Handschriften bieten in dieser Wortgruppe eine abweichende Lesart mit »Gewissen«; andere damit zusammenhängende Lesarten sprechen vom »Gewissen des Götzen«. Der Haupttext folgt dem griechischen SBLGNT-Text.
    reason: Die Fußnote kennzeichnet sowohl die ungewöhnliche Syntax von τῇ συνηθείᾳ ἕως ἄρτι τοῦ εἰδώλου als auch die einschlägige Textvariation, ohne deren umstrittene syntaktische Einordnung im Haupttext festzulegen.
lexical_decisions:
- source_word: γνῶσις
  choice: Erkenntnis
  rationale: Bewahrt den Bezug zum Wissen und Erkennen im unmittelbaren Zusammenhang und klingt im paulinischen Gedankengang natürlich.
- source_word: συνήθεια
  choice: Gewöhnung
  rationale: Bezeichnet hier eine durch den bisherigen Umgang mit dem Götzenkult eingeprägte Vertrautheit oder Gewohnheit; die Formulierung lässt offen, wie genau diese frühere Verbindung beschaffen war.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: an den Götzen bis heute fortwirkend
  rationale: Gibt sowohl den Bezug auf den Götzen als auch ἕως ἄρτι wieder, ohne die syntaktisch schwierige griechische Wendung künstlich zu glätten.
- source_word: εἰδωλόθυτον
  choice: Götzenopferfleisch
  rationale: Im Kontext geht es um Speise, besonders Fleisch, das einem Götzen geopfert wurde; der etablierte deutsche Ausdruck ist knapp und präzise.
- source_word: συνείδησις
  choice: Gewissen
  rationale: Die übliche und sachlich passende Wiedergabe für das moralische Bewusstsein in diesem paulinischen Zusammenhang.
- source_word: ἀσθενής
  choice: schwach
  rationale: Bewahrt Paulus’ wiederkehrende Bezeichnung in diesem Kapitel, ohne sie als bloße Empfindlichkeit umzudeuten.
- source_word: μολύνεται
  choice: wird befleckt
  rationale: Gibt das Passiv und das Bild moralischer Verunreinigung wieder, ohne eine stärkere endgültige Verderbnis zu behaupten.
theological_decisions:
- issue: Kultische Bedeutung der Speise, obwohl ein Götze keine wirkliche Gottheit ist
  choice: sie essen es als Götzenopferfleisch
  alternative: sie essen ein Opfer für einen Götzen
  rationale: Die Formulierung beschreibt, welche kultische Bedeutung die Essenden der Speise beimessen, ohne dem Götzen tatsächliche Göttlichkeit zuzuschreiben. So bleibt die Spannung des Zusammenhangs erhalten.
- issue: Schwäche des Gewissens
  choice: ihr Gewissen wird, weil es schwach ist, befleckt
  alternative: ihr empfindliches Gewissen wird verunreinigt
  rationale: Die attributive Deutung als »empfindlich« würde die paulinische Kategorie abschwächen oder psychologisieren; die nähere Form wahrt den Gedankengang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Götzenopferfleisch« ist als verständlicher biblischer Fachausdruck beibehalten; die schwierige Ausgangsformulierung wird im Haupttext lesbar wiedergegeben und in der Fußnote transparent gemacht.
