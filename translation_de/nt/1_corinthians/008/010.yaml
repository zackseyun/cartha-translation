  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: de
  text: Denn wenn jemand dich, der du Erkenntnis hast, in einem Götzentempel zu Tisch liegen sieht, wird dann nicht sein Gewissen, weil er schwach ist, darin bestärkt werden, Götzenopferfleisch zu essen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Begründet bzw. veranschaulicht die vorausgehende Warnung und wahrt den argumentativen Zusammenhang.
- source_word: τις ... ἴδῃ
  choice: wenn jemand ... sieht
  rationale: Die Verbindung von ἐὰν mit dem Aorist Konjunktiv bezeichnet einen hypothetischen Fall; im Deutschen ist das Präsens im Konditionalsatz natürlich.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: dich, der du Erkenntnis hast
  rationale: Gibt die auf den Angeredeten bezogene substantivierte Partizipialfügung natürlich wieder und bewahrt das Leitwort Erkenntnis.
- source_word: ἐν εἰδωλείῳ
  choice: in einem Götzentempel
  rationale: Bezeichnet einen Tempel oder Kultraum, der einer heidnischen Gottheit bzw. einem Götzenbild zugeordnet ist.
- source_word: κατακείμενον
  choice: beim Essen liegen
  rationale: Das Verb bezeichnet das Liegen zu Tisch; diese Formulierung bewahrt das konkrete antike Bild und macht zugleich den Mahlkontext verständlich.
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: sein Gewissen, weil er schwach ist
  rationale: Bezieht die Schwäche entsprechend dem Genitiv auf die beobachtende Person; die kausale Wiedergabe ist im Deutschen klar und lässt sein Gewissen als Subjekt des Hauptverbs erkennen.
- source_word: οἰκοδομηθήσεται
  choice: wird ... aufgebaut
  rationale: Bewahrt bewusst Paulus’ übliches Wortfeld des Aufbauens, das hier wahrscheinlich ironisch für eine schädliche Ermutigung gebraucht wird.
- source_word: εἰδωλόθυτα
  choice: Götzenopferfleisch
  rationale: Bezeichnet Speisen, insbesondere Fleisch, das Götzen geopfert worden war; der etablierte deutsche Ausdruck ist prägnant und kontextgerecht.
theological_decisions:
- issue: Ironischer Gebrauch von οἰκοδομηθήσεται bei einer schädlichen Handlung
  choice: dazu aufgebaut
  alternative: dazu ermutigt / darin bestärkt
  rationale: Die wörtlichere Wiedergabe erhält die Spannung zu Paulus’ sonst positivem Sprachgebrauch des Aufbauens, ohne die Ironie stillschweigend aufzulösen; die idiomatische Bedeutung wird in der Fußnote genannt.
- issue: Bezug von ἀσθενοῦς ὄντος
  choice: weil er schwach ist
  alternative: sein schwaches Gewissen
  rationale: Die griechische Konstruktion beschreibt grammatisch die Person als schwach. Die Übersetzung vermeidet es daher, die Schwäche ausschließlich als Eigenschaft des Gewissens darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Beim Essen liegen“ bewahrt die historische Tischsitte, ohne das heute missverständliche bloße „liegen“ zu verwenden. Die rhetorische Frage erwartet eine bejahende Antwort.
