revisions:
- from: Denn wenn jemand dich, der du Erkenntnis hast, in einem Götzentempel beim Essen liegen sieht, wird dann nicht sein Gewissen, weil er schwach ist, dazu aufgebaut[a], Götzenopferfleisch zu essen?
  to: Denn wenn jemand dich, der du Erkenntnis hast, in einem Götzentempel zu Tisch liegen sieht, wird dann nicht sein Gewissen, weil er schwach ist, darin bestärkt werden, Götzenopferfleisch zu essen?
  rationale: Die Revision beseitigt die unidiomatische und semantisch schwer verständliche Fügung „dazu aufgebaut“, ohne den Sinn der rhetorischen Frage zu verändern. Die Fußnote erhält die wörtliche, vermutlich ironische Aufbaumetaphorik. „Zu Tisch liegen“ ist die natürliche deutsche Wiedergabe der antiken Mahlhaltung.
