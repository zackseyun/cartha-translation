  - severity: low
    issue: „beim Essen liegen“ klingt weniger idiomatisch als „zu Tisch liegen“.
    rationale: „Zu Tisch liegen“ bezeichnet im Deutschen klar die antike, liegende Mahlhaltung und vermeidet einen unnötig umständlichen Ausdruck.
