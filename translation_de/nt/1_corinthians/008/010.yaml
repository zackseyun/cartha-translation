  source_fidelity: Der Entwurf gibt die bedingte rhetorische Frage, die Kennzeichnung des Angeredeten als eines Erkenntnis Habenden, den kultischen Ort, die antike Mahlhaltung sowie den Bezug der Schwäche auf die beobachtende Person sachgerecht wieder. Das Ergebnis der Handlung wird jedoch durch „dazu aufgebaut“ im Deutschen nicht verständlich und idiomatisch ausgedrückt.
  naturalness: „Beim Essen liegen“ ist verständlich, aber „zu Tisch liegen“ ist die geläufigere und zugleich präzise Bezeichnung für die antike Mahlhaltung. Entscheidend ist die Korrektur von „dazu aufgebaut“ zu der natürlichen, kontextuell zutreffenden Formulierung „darin bestärkt werden“.
  terminology: „Erkenntnis“, „Götzentempel“, „Gewissen“ und „Götzenopferfleisch“ sind treffend und im Register angemessen. Die Fußnote soll die wörtliche Bildsprache von οἰκοδομηθήσεται und ihre wahrscheinliche Ironie weiterhin transparent machen.
