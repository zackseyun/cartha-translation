    rationale: Diese Form legt im Deutschen stärker einen abgeschlossenen Vorgang nahe und bildet den resultativen Zustandsaspekt des griechischen Perfektpassivs weniger gut ab. Eine Erläuterung des fortdauernden Zustands ist präziser.
