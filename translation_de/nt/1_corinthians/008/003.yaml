translation:
  language: de
  text: Wenn aber jemand Gott liebt, ist er von ihm erkannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ist ihm bekannt“ oder „ist von ihm anerkannt“. Das griechische Perfektpassiv kann einen bleibenden Zustand ausdrücken: Gott hat diese Person erkannt und kennt sie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Wenn aber
  rationale: εἰ leitet die Bedingung ein, während δέ einen leichten Gegensatz zum vorherigen Gedanken markiert. „Wenn aber“ gibt beides natürlich wieder.
- source_word: τις
  choice: jemand
  rationale: Das indefinite Pronomen ist allgemein und inklusiv gebraucht; „jemand“ entspricht dem im modernen Deutschen.
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: Die direkte Wiedergabe des Präsens von ἀγαπάω ist klar, natürlich und bewahrt den Bezug zur Liebe im Kontext.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Der bestimmte griechische Ausdruck wird im Deutschen idiomatisch ohne Artikel als „Gott“ wiedergegeben.
- source_word: οὗτος
  choice: dieser
  rationale: Das Demonstrativpronomen hebt die eben beschriebene Person hervor. „Dieser“ bewahrt diese Betonung, ohne ein männliches Geschlecht festzulegen.
- source_word: ἔγνωσται
  choice: ist erkannt
  rationale: Das Perfekt Passiv bezeichnet einen gegenwärtigen Zustand als Ergebnis eines Erkennens. „Ist erkannt“ bewahrt Form und mögliche relationale Tiefe, auch wenn es bewusst etwas markanter klingt als „ist bekannt“.
- source_word: ὑπ’ αὐτοῦ
  choice: von ihm
  rationale: Das Pronomen verweist unmittelbar auf Gott zurück. Die pronominale Form bewahrt den Zusammenhang des griechischen Satzes.
theological_decisions:
- issue: Bedeutung des göttlichen Erkennens
  choice: „ist von ihm erkannt“ lässt relationale Anerkennung und bleibendes Gekanntsein offen
  alternative: „ist von ihm anerkannt“ oder „ist ihm bekannt“
  rationale: γινώσκω kann bei Gott als Handelndem mehr als bloßes Wissen ausdrücken, etwa relationale Anerkennung. Der griechische Text legt jedoch keine engere dogmatische Deutung zwingend fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wendung „ist dieser von ihm erkannt“ bewahrt die demonstrative Hervorhebung und die theologische Offenheit des griechischen Wortlauts.
