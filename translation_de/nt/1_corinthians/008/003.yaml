  naturalness: „ist dieser von ihm erkannt“ wirkt im modernen Standarddeutsch unnötig demonstrativ und syntaktisch sperrig. „ist er von ihm erkannt“ ist deutlich natürlicher; die Hervorhebung des griechischen Demonstrativs bleibt durch die Satzstruktur und den Bezug auf die unmittelbar genannte Person ausreichend gewahrt.
  terminology: „Gott liebt“ und „von ihm erkannt“ sind angemessen. „Erkannt“ bewahrt zudem die mögliche Anspielung auf das vorangehende Erkenntnis-Thema, ohne γινώσκω dogmatisch zu „anerkannt“ oder „gerettet“ zu verengen. Die Fußnote sollte das griechische Perfektpassiv genauer erklären und keine unnötig hölzerne deutsche Vorgangspassiv-Alternative als Hauptalternative hervorheben.
