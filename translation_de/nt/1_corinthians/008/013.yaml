id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: de
  text: 'Darum: Wenn eine Speise meinen Bruder zu Fall bringt, werde ich für immer kein Fleisch essen, damit ich meinen Bruder nicht zu Fall bringe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Darum
  rationale: Gibt die nachdrückliche Schlussfolgerung aus dem vorherigen Gedankengang knapp und natürlich wieder.
- source_word: βρῶμα
  choice: eine Speise
  rationale: Bezeichnet allgemein Nahrung bzw. ein Nahrungsmittel; der unbestimmte Ausdruck entspricht dem konditionalen Zusammenhang.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: zu Fall bringt / zu Fall bringe
  rationale: Bewahrt das Bild eines geistlich oder moralisch schädlichen Anstoßes und vermeidet das im heutigen Deutsch oft nur als Verärgerung verstandene „Anstoß erregen“.
- source_word: οὐ μὴ φάγω
  choice: werde ich … kein … essen
  rationale: Die emphatische Verneinung wird durch die entschiedene Zukunftsaussage zusammen mit „in Ewigkeit“ wiedergegeben.
- source_word: κρέα
  choice: Fleisch
  rationale: Bezeichnet hier Fleisch als Nahrung und unterscheidet sich bewusst vom allgemeineren βρῶμα.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Gibt die starke, wörtliche Zeitangabe wieder, ohne sie auf das bloße „wieder“ abzuschwächen.
- source_word: ἀδελφόν
  choice: Bruder
  rationale: Entspricht der maskulinen Einzahl des griechischen Textes und dem konkreten Beispiel des Paulus.
theological_decisions:
- issue: Reichweite des Fleischverzichts
  choice: „in Ewigkeit“
  alternative: „nie wieder“ / „solange ich lebe“
  rationale: Die Übersetzung bewahrt die uneingeschränkte Formulierung εἰς τὸν αἰῶνα und lässt ihren rhetorischen Nachdruck stehen, statt sie interpretierend zeitlich einzugrenzen.
- issue: Bedeutung von σκανδαλίζω
  choice: „zu Fall bringen“
  alternative: „Anstoß geben“
  rationale: Der Kontext betrifft nicht bloß persönliche Kränkung, sondern die Gefahr, dass ein Glaubender gegen sein Gewissen handelt und geistlich Schaden nimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „Darum“ markiert die zugespitzte persönliche Schlussfolgerung. Die Wiederholung von „meinen Bruder … zu Fall bringe“ erhält den Nachdruck und die Struktur des griechischen Satzes.
