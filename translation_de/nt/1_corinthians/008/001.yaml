id: 1CO.8.1
reference: 1 Corinthians 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: de
  text: 'Was nun Speisen betrifft, die Götzen geopfert wurden: Wir wissen, dass wir alle Erkenntnis haben.[a] Die Erkenntnis bläht auf, die Liebe aber baut auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Wir alle haben Erkenntnis“ greift Paulus möglicherweise eine Losung der Korinther auf.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Was nun … betrifft
  rationale: Eine natürliche deutsche Themenüberleitung; „nun“ gibt hier die fortführende Diskursfunktion von δέ wieder, nicht eine zeitliche Bedeutung.
- source_word: τῶν εἰδωλοθύτων
  choice: das Götzenopferfleisch
  rationale: Der im Deutschen geläufige Ausdruck bezeichnet hier Speise, besonders Fleisch, das Götzen geopfert wurde; die mögliche weitere Bedeutung wird in der Fußnote genannt.
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Direkte und idiomatische Wiedergabe des Verbs mit präsentischer Bedeutung.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: dass wir alle Erkenntnis haben
  rationale: Bewahrt die inklusive Formulierung und die lexikalische Verbindung zum folgenden „die Erkenntnis“, ohne die mögliche rhetorische Distanzierung im Haupttext festzulegen.
- source_word: ἡ γνῶσις
  choice: die Erkenntnis
  rationale: Gibt den abstrakten Begriff wieder und erhält die Wiederaufnahme von γνῶσιν.
- source_word: φυσιοῖ
  choice: bläht auf
  rationale: Bewahrt Paulus’ anschauliches Bild statt es zu „macht hochmütig“ zu verflachen.
- source_word: ἡ δὲ ἀγάπη
  choice: die Liebe aber
  rationale: Stellt den griechischen Gegensatz natürlich und würdevoll dar.
- source_word: οἰκοδομεῖ
  choice: baut auf
  rationale: Bewahrt die Baumetapher in verständlichem modernem Deutsch.
theological_decisions:
- issue: Ob „wir alle haben Erkenntnis“ als uneingeschränkte Aussage des Paulus oder als Aufnahme einer korinthischen Losung zu verstehen ist
  choice: Die Aussage bleibt im Haupttext ohne distanzierende Anführungszeichen stehen.
  alternative: '„Wir wissen: ‚Wir alle haben Erkenntnis.‘“ oder eine Kennzeichnung als korinthische Losung'
  rationale: Der griechische Text enthält keine eindeutigen Zitatzeichen oder ausdrücklichen Distanzmarker. Die Übersetzung bewahrt daher die rhetorische und theologische Spannung; die mögliche Losung wird in der Fußnote erwähnt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallelen Bilder „bläht auf“ und „baut auf“ bleiben erhalten. Der Fachausdruck „Götzenopferfleisch“ ist im biblischen Kontext präzise; zugleich lässt der Kontext grundsätzlich auch andere Götzen geopferte Speisen oder Opfergaben zu.
