id: 1CO.8.11
reference: 1 Corinthians 8:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: de
  text: Denn durch deine Erkenntnis geht der Schwache zugrunde[a] – der Bruder[b], für den der Messias[c] gestorben ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird vernichtet“ oder „kommt um“. Das griechische Verb bezeichnet schweres Verderben, legt hier aber nicht eindeutig fest, ob gegenwärtiger geistlicher Ruin, endgültiges Verderben oder beides gemeint ist.'
    reason: alternative_reading
  - marker: b
    text: „Bruder“ bezeichnet hier einen Mitglaubenden; der Sache nach kann die Aussage ebenso eine Schwester im Glauben betreffen.
    reason: lexical_alternative
  - marker: c
    text: Griechisch „Christus“; hier als Titel mit „Messias“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: geht zugrunde
  rationale: Das Präsens bezeichnet das eintretende bzw. sich vollziehende Verderben. „Geht zugrunde“ gibt die Schwere des Verbs wieder, ohne ausdrücklich festzulegen, ob zeitlicher geistlicher Ruin, endgültiges Verderben oder beides gemeint ist.
- source_word: γάρ
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Warnung ein.
- source_word: ὁ ἀσθενῶν
  choice: der Schwache
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der schwach ist; die knappe Form bewahrt den Singular und greift „Bruder“ nicht vor.
- source_word: ἐν τῇ σῇ γνώσει
  choice: durch deine Erkenntnis
  rationale: ἐν bezeichnet hier den Zusammenhang bzw. das Mittel, durch das der Schwache Schaden nimmt. „Durch“ ist im Deutschen natürlich und erhält zugleich die ironische Gegenüberstellung von Erkenntnis und zerstörerischer Wirkung.
- source_word: γνῶσις
  choice: Erkenntnis
  rationale: Bewahrt den paulinischen Leitbegriff des unmittelbaren Zusammenhangs (8,1.7.10) und seinen leicht zugespitzten Klang.
- source_word: ὁ ἀδελφός
  choice: der Bruder
  rationale: Gibt den maskulinen Singular der Vorlage genau wieder; im Kontext ist ein Glaubensbruder, also ein anderer Gläubiger, gemeint.
- source_word: δι’ ὃν
  choice: für den
  rationale: διά mit Akkusativ bezeichnet hier die Person, zu deren Gunsten bzw. für die der Messias starb.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός fungiert hier als Titel und wird deshalb mit „Messias“ wiedergegeben.
- source_word: ἀπέθανεν
  choice: gestorben ist
  rationale: Das deutsche Perfekt ist in modernem Standarddeutsch eine natürliche Wiedergabe des abgeschlossenen vergangenen Geschehens.
theological_decisions:
- issue: Ob ἀπόλλυται ausdrücklich das endgültige eschatologische Verderben eines Gläubigen bezeichnet
  choice: „geht zugrunde“ im Haupttext, ohne die Art oder Endgültigkeit des Verderbens festzulegen
  alternative: „wird vernichtet“, „wird zugrunde gerichtet“ oder „kommt um“
  rationale: Das Verb ist stark, doch der Vers allein entscheidet nicht eindeutig zwischen schwerem gegenwärtigem geistlichem Schaden und endgültigem Verderben. Die Formulierung wahrt diese Spannung.
- issue: Ob ἀδελφός im Haupttext geschlechtsneutral wiederzugeben ist
  choice: „der Bruder“ mit erläuternder Fußnote
  alternative: „der Mitglaubende“ oder „der Bruder oder die Schwester“
  rationale: Die Übersetzung bewahrt die grammatisch maskuline Einzahl der Vorlage und erklärt zugleich den kontextuellen Sinn als Glaubensgeschwister.
- issue: Ob Χριστός als Name oder Titel wiederzugeben ist
  choice: „der Messias“
  alternative: „Christus“
  rationale: An dieser Stelle trägt Χριστός titularen Sinn und hebt die heilsgeschichtliche Bedeutung seines Todes hervor.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Satzstellung folgt der rhetorischen Zuspitzung der griechischen Vorlage: Erst wird „der Schwache“ genannt, dann nachdrücklich als „der Bruder, für den der Messias gestorben ist“ bestimmt. Der Gedankenstrich macht diese Apposition verständlich, ohne die Spannung abzuschwächen.'
