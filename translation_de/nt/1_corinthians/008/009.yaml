id: 1CO.8.9
reference: 1 Corinthians 8:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: de
  text: Doch achtet darauf, dass dieses euer Recht nicht etwa den Schwachen zum Stolperstein wird.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese eure Freiheit“. Das griechische Wort kann „Vollmacht“, „Recht“ oder „Freiheit“ bedeuten; hier geht es um die Freiheit, die einige Glaubende beim Essen von Speisen beanspruchten, die mit Götzen in Verbindung standen.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Schwachen“ sind hier diejenigen gemeint, deren Gewissen in dieser Frage schwach ist.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: achtet darauf
  rationale: Der Imperativ fordert zu wachsamer Vorsicht auf; „achtet darauf“ ist natürliches, gegenwärtiges Deutsch und bewahrt den warnenden Ton.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den leichten Gegensatz beziehungsweise die mahnende Wendung gegenüber dem Vorhergehenden.
- source_word: μή πως
  choice: dass … nicht etwa
  rationale: Gibt die negative Vorsorge gegen einen möglichen Ausgang idiomatisch wieder und bewahrt mit „etwa“ das Moment der Möglichkeit.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: dieses euer Recht
  rationale: ἐξουσία kann Vollmacht, Recht oder Freiheit bezeichnen. Im Zusammenhang geht es um den von einigen beanspruchten Handlungsspielraum beim Essen von Speisen mit Götzenbezug; „Recht“ trifft diesen konkreten Anspruch, ohne die lexikalische Breite zu verschweigen.
- source_word: πρόσκομμα
  choice: Stolperstein
  rationale: Bewahrt das Bild eines Hindernisses, durch das jemand zu Fall kommt, und ist im Deutschen als geistlich-ethische Metapher verständlich.
- source_word: γένηται
  choice: wird
  rationale: Gibt das Entstehen beziehungsweise Sich-Entwickeln in der deutschen Konstruktion knapp und natürlich wieder.
- source_word: τοῖς ἀσθενέσιν
  choice: den Schwachen
  rationale: Folgt der knappen Ausdrucksweise des Griechischen. Der Kapitelzusammenhang bestimmt die Schwäche als eine Schwäche des Gewissens in dieser Sache.
theological_decisions:
- issue: Bedeutung von ἐξουσία im Zusammenhang
  choice: Das von den Korinthern beanspruchte Recht beziehungsweise ihre Freiheit hinsichtlich der mit Götzen verbundenen Speisen.
  alternative: Allgemeine Vollmacht oder Machtbefugnis.
  rationale: Der unmittelbare Zusammenhang von 1. Korinther 8 behandelt den Umgang mit Götzenopferfleisch. „Recht“ bildet die konkrete ethische Frage ab, ohne eine institutionelle Vollmacht einzutragen; die mögliche Wiedergabe „Freiheit“ bleibt in der Fußnote sichtbar.
- issue: Bedeutung von τοῖς ἀσθενέσιν
  choice: Menschen, deren Gewissen in dieser Frage schwach und verletzlich ist.
  alternative: Schwache Menschen in einem allgemeinen oder körperlichen Sinn.
  rationale: Das Kapitel verbindet „schwach“ ausdrücklich mit dem Gewissen. Der Haupttext behält dennoch die offene, knappe Bezeichnung „die Schwachen“ bei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wortstellung „dieses euer Recht“ erhält die Betonung des griechischen Ausdrucks, bleibt aber verständlich. „Stolperstein“ bewahrt die Bildsprache des Ausgangstextes.
