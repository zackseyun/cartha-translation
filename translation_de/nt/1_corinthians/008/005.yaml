  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: de
  text: Denn selbst wenn es sogenannte Götter[a] gibt, sei es im Himmel oder auf der Erde – wie es ja viele Götter und viele Herren[b] gibt –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götter, die so genannt werden“. Das griechische Partizip kann neutral „genannt“ bedeuten; „sogenannte“ bringt im Zusammenhang Paulus’ Distanz zu ihrem Anspruch deutlicher zum Ausdruck.'
    reason: lexical_alternative
  - marker: b
    text: „Herren“ übersetzt den Plural desselben griechischen Wortes, das häufig mit „Herr“ wiedergegeben wird. Hier bezeichnet es die vielen Wesen oder Mächte, denen dieser Titel gegeben wird, im Unterschied zu dem einen Herrn in Vers 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn selbst
  rationale: „Denn“ bewahrt den begründenden Anschluss von γάρ; „selbst“ gibt die zusätzliche Hervorhebung durch καί im Zusammenhang mit der folgenden Einräumung natürlich wieder.
- source_word: εἴπερ
  choice: wenn
  rationale: εἴπερ leitet hier eine zugestandene Bedingung ein. Zusammen mit „selbst“ wird die verstärkende Nuance ausgedrückt, ohne die Aussage vorschnell als Tatsachenbehauptung wiederzugeben.
- source_word: λεγόμενοι θεοὶ
  choice: sogenannte Götter
  rationale: Das Partizip bezeichnet eine Benennung oder Zuschreibung. „Sogenannte“ lässt Paulus’ Distanz zu ihrem Anspruch erkennen; die mögliche neutralere Wiedergabe „Götter genannt werden“ bleibt in der Fußnote erhalten.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: sei es im Himmel oder auf der Erde
  rationale: Die feste deutsche Paarformel gibt die beiden Alternativen und ihren kosmologischen Umfang klar und würdig wieder.
- source_word: ὥσπερ
  choice: wie es ja
  rationale: Die Wendung führt eine bestätigende, parenthetische Einräumung ein. „Ja“ vermittelt die bestätigende Nuance, ohne die Art der Existenz dieser Mächte näher festzulegen.
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: viele Götter und viele Herren
  rationale: Die Wiederholung von πολλοί wird natürlich wiedergegeben. „Herren“ wahrt die lexikalische Verbindung von κύριος zum „Herrn“ in Vers 6, während Kleinschreibung und Plural den Unterschied anzeigen.
theological_decisions:
- issue: Paulus’ rhetorische Distanz zu heidnischen Gottheiten
  choice: λεγόμενοι θεοὶ mit „sogenannte Götter“ wiedergeben
  alternative: „Götter genannt werden“
  rationale: Der Zusammenhang von Vers 4–6 unterscheidet solche Benennungen von dem Bekenntnis zu dem einen Gott. „Sogenannte“ bringt diese Distanz zum Ausdruck, ohne die im weiteren Satz zugestandene Existenz vieler verehrter Mächte zu beseitigen.
- issue: Die vielen κύριοι im Kontrast zu dem einen κύριος in Vers 6
  choice: „Herren“ im Plural
  alternative: „Herrscher“ oder „Gebieter“
  rationale: „Herren“ erhält die bewusste sprachliche Verbindung zu dem einen „Herrn“ in Vers 6. Die Formulierung entscheidet nicht, ob damit geistliche Wesen, politische Mächte, Kulttitel oder mehrere dieser Kategorien gemeint sind.
- issue: Status der vielen Götter und Herren
  choice: Die zugestandene Formulierung „wie es ja … gibt“ beibehalten
  alternative: Explizit ergänzen, dass sie nur in der Vorstellung oder Verehrung von Menschen existieren
  rationale: 'Der griechische Satz enthält eine wirkliche rhetorische Spannung: Paulus spricht von „sogenannten“ Göttern und sagt zugleich, dass es viele Götter und Herren gibt. Die Übersetzung erklärt diese Spannung nicht konfessionell oder metaphysisch weg.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Gedankenstrich bewahrt den parenthetischen Charakter der bestätigenden Einräumung; das abschließende Komma zeigt, dass der Satz in Vers 6 weitergeführt wird. Alle Fußnotenmarker stehen unmittelbar bei ihrem jeweiligen Ausdruck.
