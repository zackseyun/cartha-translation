  text: For man is not from woman[a], but woman from man.
translation:
  language: de
  text: Denn der Mann stammt nicht von der Frau[a], sondern die Frau vom Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn der Ehemann stammt nicht von der Ehefrau, sondern die Ehefrau vom Ehemann.“ Die griechischen Wörter können sowohl „Mann/Frau“ als auch „Ehemann/Ehefrau“ bedeuten; hier wird wegen des Bezugs auf die Schöpfung der weitere Sinn bevorzugt.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt den argumentativen Zusammenhang knapp und natürlich wieder.
- source_word: ἀνὴρ / ἀνδρός
  choice: der Mann / vom Mann
  rationale: Im Rückgriff auf die Schöpfung bezeichnen die Wörter hier am wahrscheinlichsten Mann und Frau als Geschlechter; die mögliche Bedeutung „Ehemann“ bleibt in der Fußnote erhalten.
- source_word: ἐκ / ἐξ
  choice: stammt von / vom
  rationale: Die Präposition bezeichnet Herkunft oder Ursprung. „stammt von“ macht diesen Sinn im Deutschen idiomatisch deutlich; in der parallelen zweiten Satzhälfte kann das Verb natürlich mitgedacht werden.
- source_word: γυναικός / γυνὴ
  choice: der Frau / die Frau
  rationale: Der schöpfungstheologische Zusammenhang spricht für „Frau“ im allgemeinen Sinn; die mögliche Bedeutung „Ehefrau“ wird als Alternative dokumentiert.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung bildet „sondern“ im Deutschen den präzisen und natürlichen Gegensatz.
- source_word: ἐστιν
  choice: stammt
  rationale: Zusammen mit ἐκ drückt das Verb eine Aussage über Herkunft aus; „stammt“ ist im modernen Deutsch klarer als eine formale Wiedergabe mit „ist von“.
theological_decisions:
- issue: Wiedergabe von ἀνήρ und γυνή als „Mann/Frau“ oder „Ehemann/Ehefrau“
  choice: Mann/Frau
  alternative: Ehemann/Ehefrau
  rationale: Die Aussage verweist auf den Ursprung der Frau aus dem Mann in der Schöpfungserzählung und hat daher wahrscheinlich den weiteren geschlechtlichen Sinn. Da die griechischen Wörter je nach Kontext auch Ehepartner bezeichnen können, wird diese echte lexikalische Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stammt von“ gibt die Herkunftsaussage natürlich wieder; die Ellipse in „sondern die Frau vom Mann“ wahrt die knappe Parallelstruktur des Griechischen.
