base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: de
  text: Denn jeder nimmt beim Essen seine eigene Mahlzeit vorweg[a], und der eine hungert, der andere betrinkt sich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »isst seine eigene Mahlzeit vor den anderen«; das griechische Verb kann betonen, dass jemand etwas vorher nimmt oder vorangeht, ohne auf die anderen zu warten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Der eine ist hungrig, der andere ist betrunken.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: jeder
  rationale: Bewahrt die distributive Aussage über die einzelnen Teilnehmenden und klingt im Deutschen natürlich.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den Vers als Begründung der vorangehenden Zurechtweisung.
- source_word: τὸ ἴδιον δεῖπνον
  choice: seine eigene Mahlzeit
  rationale: ἴδιον betont den privaten Besitz im Gegensatz zum gemeinsamen Mahl; »Mahlzeit« gibt δεῖπνον im Kontext natürlich wieder, ohne die Tageszeit unnötig festzulegen.
- source_word: προλαμβάνει
  choice: nimmt … vorweg
  rationale: Gibt sowohl den zeitlichen Aspekt des Vorhernehmens als auch das eigenmächtige Handeln wieder; die mögliche Nuance »vor den anderen« wird in der Fußnote erhalten.
- source_word: ἐν τῷ φαγεῖν
  choice: beim Essen
  rationale: Die Konstruktion mit substantiviertem Infinitiv ist temporal; »beim Essen« ist knapp, quellennah und idiomatisch.
- source_word: ὃς μὲν … ὃς δὲ
  choice: der eine … der andere
  rationale: Gibt die korrelative Gegenüberstellung zweier verschiedener Gruppen bzw. Fälle klar wieder.
- source_word: πεινᾷ
  choice: bleibt hungrig
  rationale: Im Zusammenhang hebt die Form den fortbestehenden Mangel als Ergebnis des gemeinschaftswidrigen Verhaltens hervor.
- source_word: μεθύει
  choice: betrinkt sich
  rationale: Bezeichnet unmissverständlich tatsächliche Trunkenheit und kann im Deutschen den Vorgang bzw. das erreichte Ergebnis ausdrücken.
theological_decisions:
- issue: Individueller Besitz gegenüber dem gemeinsamen Mahl
  choice: jeder seine eigene Mahlzeit
  alternative: alle ihre eigene Mahlzeit
  rationale: Die singularische, distributive Form des Griechischen wird bewahrt; im Deutschen ist »jeder … seine« grammatisch und natürlich, ohne eine weitergehende geschlechtsspezifische Aussage einzutragen.
- issue: Art des Missstands beim Mahl des Herrn
  choice: betrinkt sich
  alternative: ist betrunken
  rationale: Der Text spricht offen von Trunkenheit und darf nicht zu bloßer Übermäßigkeit abgeschwächt werden. Zugleich bleibt die Zustandsübersetzung als echte lexikalische Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gegenüberstellung bildet die scharfe Kritik des Ausgangstextes ab. »Mahlzeit« ist allgemeinverständlich; die genuine Bedeutungsbreite von προλαμβάνει und der Zustands- bzw. Vorgangsaspekt der beiden Schlussverben werden durch Fußnoten offengehalten.
