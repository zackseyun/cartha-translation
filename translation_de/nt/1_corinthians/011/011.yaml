source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: de
  text: Doch im Herrn ist weder die Frau ohne den Mann noch der Mann ohne die Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist weder die Ehefrau ohne den Ehemann noch der Ehemann ohne die Ehefrau.“ Die griechischen Wörter können sowohl Frau/Mann als auch Ehefrau/Ehemann bedeuten. Hier wird die allgemeinere Bedeutung bevorzugt, weil die Aussage offenbar nicht auf die Ehe beschränkt ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Kennzeichnet nach dem vorangehenden Gedankengang eine einschränkende und ausgleichende Wendung; „Doch“ ist im Deutschen knapp, natürlich und würdevoll.
- source_word: γυνή
  choice: Frau
  rationale: Das Wort kann „Frau“ oder „Ehefrau“ bedeuten. Da der Zusammenhang von Frau und Mann in Schöpfung und Gottesdienst handelt und der Satz allgemein formuliert ist, wird die weitere Bedeutung gewählt.
- source_word: ἀνήρ
  choice: Mann
  rationale: Das Wort kann „Mann“ oder „Ehemann“ bedeuten. Parallel zu γυνή und angesichts der allgemeinen Aussage ist „Mann“ hier vorzuziehen.
- source_word: χωρίς
  choice: ohne
  rationale: Bezeichnet hier das Getrennt- oder Unabhängigsein. „Ohne“ bildet die knappe griechische Form natürlich ab, ohne die Art der gegenseitigen Bezogenheit näher festzulegen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Bewahrt die übliche paulinische Wendung und ihre mögliche Bedeutung als Sphäre oder Beziehung zum Herrn.
- source_word: οὔτε ... οὔτε
  choice: weder ... noch
  rationale: Die deutsche Korrelativkonstruktion gibt die ausgewogene Verneinung und den Parallelismus beider Satzglieder präzise wieder.
theological_decisions:
- issue: Wiedergabe von γυνή / ἀνήρ als Frau/Mann oder Ehefrau/Ehemann
  choice: Frau/Mann
  alternative: Ehefrau/Ehemann
  rationale: Der unmittelbare Zusammenhang behandelt Frau und Mann in Schöpfung und Gottesdienst; Vers 11 formuliert eine ausgleichende Aussage über ihre gegenseitige Bezogenheit „im Herrn“. Die breitere Wiedergabe wahrt diesen Umfang, während die ebenso mögliche eheliche Lesart in einer Fußnote erhalten bleibt.
- issue: Bedeutung von ἐν κυρίῳ
  choice: im Herrn
  alternative: in Beziehung zum Herrn
  rationale: Die wörtlich-nahe, im Deutschen etablierte Formulierung bewahrt die paulinische theologische Dichte und legt nicht einseitig fest, ob primär Zugehörigkeit, Gemeinschaft oder Geltungsbereich gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdevoller Syntax. Der ausgeglichene Parallelismus des griechischen Satzes bleibt erhalten; die genuine lexikalische Mehrdeutigkeit von Frau/Ehefrau und Mann/Ehemann wird durch die Fußnote kenntlich gemacht.
