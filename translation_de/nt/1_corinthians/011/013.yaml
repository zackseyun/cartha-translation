  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: de
  text: 'Urteilt selbst: Ist es angemessen, dass eine Frau mit unbedecktem Kopf zu Gott betet?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Ehefrau“, falls γυνή im weiteren Zusammenhang dieses Abschnitts im ehelichen Sinn verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: selbst
  rationale: Die idiomatische Wendung verstärkt den Aufruf an die Korinther, nach ihrem eigenen Urteil zu entscheiden. „Urteilt selbst“ gibt dies im Deutschen natürlich und knapp wieder.
- source_word: κρίνατε
  choice: Urteilt
  rationale: Der Aoristimperativ fordert unmittelbar zu einer Beurteilung auf. „Urteilt“ bewahrt die direkte rhetorische Kraft.
- source_word: πρέπον ἐστὶν
  choice: Ist es angemessen
  rationale: Die Wendung fragt danach, ob etwas als schicklich oder passend gelten kann. „Angemessen“ ist gegenwärtiges, verständliches Standarddeutsch und vermeidet einen unnötig altertümlichen Ton.
- source_word: γυναῖκα
  choice: eine Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Da der Vers keinen Ehemann ausdrücklich nennt und die Frage allgemein formuliert ist, steht „eine Frau“ im Haupttext; die eheliche Bedeutung bleibt in der Fußnote erhalten.
- source_word: ἀκατακάλυπτον
  choice: mit unbedecktem Kopf
  rationale: Das Adjektiv bedeutet wörtlich „unbedeckt“. Der unmittelbare Zusammenhang zeigt, dass die Bedeckung des Kopfes gemeint ist; die Ergänzung macht dies im Deutschen klar.
- source_word: τῷ θεῷ
  choice: zu Gott
  rationale: Der Dativ nach προσεύχομαι bezeichnet hier den Adressaten des Gebets. „Zu Gott“ ist die direkte und natürliche Wiedergabe.
- source_word: προσεύχεσθαι
  choice: betet
  rationale: Der Infinitiv „zu beten“ ist in die deutsche dass-Konstruktion eingebettet. Das finite Verb „betet“ ergibt einen natürlichen Fragesatz.
theological_decisions:
- issue: Bedeutung von γυνή in der Erörterung über die Kopfbedeckung
  choice: eine Frau
  alternative: eine Ehefrau
  rationale: Der einzelne Vers stellt keinen ausdrücklichen Bezug zu einem Ehemann her. Deshalb wird die allgemeinere Bedeutung im Haupttext verwendet, ohne die im weiteren Zusammenhang mögliche eheliche Bedeutung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte rhetorische Appell und die Frageform des griechischen Textes bleiben erhalten; die mögliche Mehrdeutigkeit von γυνή wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote bewahrt.
