    rationale: „Zurechtweisen“ bezeichnet im Deutschen vor allem einen Tadel oder Verweis. παιδεύω umfasst hier korrigierende, erzieherische Disziplin. „werden wir erzogen“ gibt diese Bedeutung genauer wieder und bewahrt den Unterschied zur bloßen Beurteilung bzw. zum Gericht.
  - severity: low
    issue: „beurteilt“ für κρινόμενοι
    rationale: Die Wiedergabe ist möglich, doch der Kontext und der spätere Ausdruck κατακριθῶμεν sind gerichtssprachlich. „gerichtet“ macht die lexikalische und kontextuelle Beziehung klarer, ohne κρίνω mit der endgültigen Verurteilung gleichzusetzen.
