revisions:
- from: Wenn wir aber vom Herrn beurteilt werden[a], werden wir zurechtgewiesen, damit wir nicht zusammen mit der Welt verurteilt werden.
  to: Wenn wir aber vom Herrn gerichtet werden[a], werden wir erzogen, damit wir nicht zusammen mit der Welt verurteilt werden.
  rationale: Die Revision ersetzt die zu enge Bedeutung „zurechtgewiesen“ durch „erzogen“, um den erzieherisch-korrigierenden Gehalt von παιδευόμεθα abzubilden. „Gerichtet“ wahrt den gerichtlichen Sinn von κρινόμενοι und hebt zugleich den Unterschied zur endgültigen „Verurteilung“ in κατακριθῶμεν hervor. Die temporale Hauptlesart, der Zweckzusammenhang und die theologische Offenheit des griechischen Textes bleiben erhalten.
