base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: de
  text: Wenn wir aber vom Herrn gerichtet werden[a], werden wir erzogen, damit wir nicht zusammen mit der Welt verurteilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vom Herrn gerichtet, werden wir erzogen.“ Die griechischen Präsensformen können einen fortdauernden Vorgang betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: wenn wir ... beurteilt werden
  rationale: Das präsentische Passivpartizip wird im Zusammenhang temporal verstanden. „Beurteilt“ bewahrt den gerichtlichen Sinn, ohne bereits die in κατακριθῶμεν ausgedrückte Verurteilung vorwegzunehmen.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert einen milden Gegensatz zur Warnung des vorhergehenden Verses.
- source_word: ὑπὸ κυρίου
  choice: vom Herrn
  rationale: ὑπό mit Genitiv bezeichnet den Handelnden. „Herr“ gibt κύριος ohne erklärende Erweiterung wieder.
- source_word: παιδευόμεθα
  choice: werden wir zurechtgewiesen
  rationale: παιδεύω bezeichnet hier eine erzieherische, korrigierende Maßnahme. „Zurechtgewiesen“ klingt im modernen Deutsch natürlich und wahrt den bessernden statt ausschließlich strafenden Sinn.
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: Die Formulierung gibt den Zweck beziehungsweise das beabsichtigte Ergebnis idiomatisch wieder.
- source_word: σὺν τῷ κόσμῳ
  choice: zusammen mit der Welt
  rationale: σύν bezeichnet die gemeinsame Beteiligung am selben Geschick; κόσμος bleibt entsprechend dem kollektiven Ausdruck des Ausgangstextes „die Welt“.
- source_word: κατακριθῶμεν
  choice: verurteilt werden
  rationale: κατακρίνω bezeichnet ein negatives Gerichtsurteil. „Verurteilt“ hält den Unterschied zum vorherigen κρίνω („beurteilen“) erkennbar.
theological_decisions:
- issue: Verhältnis zwischen gegenwärtigem göttlichem Gericht und Verurteilung mit der Welt
  choice: Die Formulierung unterscheidet die korrigierende Zurechtweisung durch den Herrn von der Verurteilung zusammen mit der Welt.
  alternative: Der Satz könnte allgemeiner als zeitliche Bestrafung verstanden werden, ohne eine ausdrückliche Unterscheidung zwischen Glaubenden und Nichtglaubenden vorauszusetzen.
  rationale: Der Gegensatz zwischen κρινόμενοι und κατακριθῶμεν, das Verb παιδευόμεθα und der Zwecksatz ἵνα μὴ sprechen für eine gegenwärtige, bessernde Maßnahme, die vor der späteren Verurteilung bewahren soll. Die Übersetzung legt darüber hinaus kein bestimmtes Lehrsystem fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zurechtgewiesen“ vermeidet das veraltete „gezüchtigt“ und bringt den erzieherisch-korrigierenden Sinn zum Ausdruck; der Unterschied zwischen „beurteilt“ und „verurteilt“ bildet die griechische Wortwahl transparent ab.
