id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: de
  text: Wenn jemand Hunger hat, soll er zu Hause essen, damit ihr nicht zum Gericht zusammenkommt.[a] Das Übrige aber werde ich regeln, wenn ich komme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit euer Zusammenkommen euch nicht zur Verurteilung führt«. Das griechische Wort κρίμα kann »Gericht«, »Urteil« oder »Verurteilung« bedeuten. Hier passt »Gericht« am besten zum unmittelbaren Zusammenhang, in dem Paulus vom gegenwärtigen Zurechtbringen durch den Herrn spricht und dieses von der Verurteilung mit der Welt unterscheidet (Verse 29–32).'
    reason: lexikalische Alternative und Bewahrung der theologischen Bedeutungsbreite
lexical_decisions:
- source_word: πεινᾷ
  choice: Hunger hat
  rationale: Die präsentische Zustandsangabe wird im modernen Deutschen idiomatisch mit »Hunger haben« wiedergegeben.
- source_word: ἐν οἴκῳ
  choice: zu Hause
  rationale: Gemeint ist das Essen im häuslichen Rahmen statt während der Gemeindeversammlung; »zu Hause« ist die natürliche deutsche Entsprechung.
- source_word: ἐσθιέτω
  choice: soll er … essen
  rationale: Der Imperativ der dritten Person wird im Deutschen klar und natürlich durch »soll er essen« ausgedrückt.
- source_word: εἰς κρίμα
  choice: zum Gericht
  rationale: Die Wendung bewahrt den Ernst einer göttlichen Beurteilung, ohne κρίμα eindeutig auf die endgültige Verdammnis festzulegen.
- source_word: συνέρχησθε
  choice: ihr … zusammenkommt
  rationale: »Zusammenkommen« erhält die im Abschnitt wiederkehrende Bezeichnung für die Versammlung der Gemeinde.
- source_word: Τὰ δὲ λοιπὰ
  choice: Das Übrige aber
  rationale: Die Formulierung bezeichnet die noch ausstehenden Angelegenheiten und bewahrt zugleich die Übergangsfunktion von δέ.
- source_word: ὡς ἂν ἔλθω
  choice: wenn ich komme
  rationale: Die Wendung verweist auf den erwarteten, zeitlich noch nicht näher bestimmten Besuch des Paulus.
- source_word: διατάξομαι
  choice: werde ich regeln
  rationale: Das Futur bezeichnet hier das verbindliche Ordnen noch offener praktischer Fragen; »regeln« ist prägnant und im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von κρίμα in der Warnung vor dem Zusammenkommen beim Mahl des Herrn
  choice: Gericht, im Kontext als göttliches, auch gegenwärtiges Gericht offen gehalten
  alternative: Verdammnis; richterliches Urteil im weiteren Sinn
  rationale: Der unmittelbare Zusammenhang in den Versen 29–32 spricht vom gegenwärtigen Richten und Zurechtbringen durch den Herrn und unterscheidet es von der Verurteilung mit der Welt. »Gericht« wahrt diese Spannung, ohne die Bedeutung auf endgültige Verdammnis zu verengen.
- issue: Wiedergabe des unbestimmten Singulars τις mit dem Imperativ
  choice: Wenn jemand … soll er
  alternative: Wer Hunger hat, soll zu Hause essen; Wenn jemand … soll diese Person
  rationale: Die Formulierung erhält den grammatischen Singular und klingt im modernen Standarddeutsch natürlich; das maskuline Pronomen nimmt das grammatisch indefinite »jemand« wieder auf, ohne das Geschlecht der gemeinten Person festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während »Hunger haben«, »zu Hause« und »regeln« idiomatisch formuliert sind. Der Fußnotenmarker [a] steht unmittelbar nach dem vollständigen Warnsatz, da sich die Anmerkung auf »zum Gericht« und dessen Verhältnis zum Zusammenkommen bezieht.
