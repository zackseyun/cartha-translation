source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: de
  text: 'Denn ich habe vom Herrn empfangen, was ich auch euch weitergegeben habe: Der Herr Jesus nahm in der Nacht, in der er ausgeliefert wurde,[a] Brot'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „in der er verraten wurde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: empfangen habe
  rationale: Bezeichnet hier den Empfang der überlieferten Unterweisung; „empfangen“ bewahrt zudem die formale Beziehung zum anschließenden Weitergeben.
- source_word: ἀπὸ τοῦ κυρίου
  choice: vom Herrn
  rationale: Gibt die Quelle natürlich und ohne erklärende Erweiterung wieder; der folgende Satz nennt ausdrücklich den Herrn Jesus.
- source_word: παρέδωκα
  choice: weitergegeben habe
  rationale: Natürliches modernes Deutsch für die Weitergabe einer Überlieferung. Zugleich wird eine irreführende unmittelbare Gleichsetzung mit dem späteren passiven παρεδίδετο vermieden.
- source_word: ὅτι
  choice: ':'
  rationale: Im Deutschen führt der Doppelpunkt den Inhalt dessen, was weitergegeben wurde, idiomatisch und klar ein; ein ausdrückliches „dass“ würde einen schwerfälligen Nebensatz erzeugen.
- source_word: κύριος
  choice: Herr
  rationale: Bewahrt die ehrerbietige und christologische Bedeutung des griechischen Titels.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: in der Nacht, in der
  rationale: Nahe am griechischen Ausdruck und zugleich natürliches, würdevolles Standarddeutsch.
- source_word: παρεδίδετο
  choice: ausgeliefert wurde
  rationale: Das Imperfekt Passiv bezeichnet das Geschehen des Übergebens bzw. Auslieferns. Diese Wiedergabe wahrt die größere Bedeutungsbreite, ohne die Handlung allein als Verrat zu deuten.
- source_word: ἔλαβεν ἄρτον
  choice: nahm ... Brot
  rationale: Direkte und liturgisch vertraute Wiedergabe; das artikellose ἄρτον verlangt im Deutschen weder einen unbestimmten Artikel noch ausdrücklich „einen Laib“.
theological_decisions:
- issue: Wiedergabe von παρεδίδετο im Einsetzungsbericht
  choice: ausgeliefert wurde
  alternative: verraten wurde
  rationale: παραδίδωμι kann je nach Kontext „übergeben“, „ausliefern“ oder „verraten“ bedeuten. Der Haupttext bewahrt mit „ausgeliefert“ die Spannung zwischen menschlichem Verrat und dem umfassenderen Passionsgeschehen; die traditionelle engere Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt nah an der paulinischen Überlieferungssprache, wird aber durch „weitergegeben“ und den Doppelpunkt natürlich lesbar. Die Fußnotenmarke steht unmittelbar nach der strittigen Wendung.
