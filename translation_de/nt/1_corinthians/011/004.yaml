  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: de
  text: Jeder Mann, der betet oder prophetisch redet und dabei etwas auf dem Kopf hat, entehrt sein Haupt[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditioneller: „mit bedecktem Haupt“. Wörtlich steht im Griechischen ungefähr: „etwas vom Kopf herab habend“; die Art der Bedeckung wird nicht genannt.'
    reason: lexical_alternative
  - marker: b
    text: „Sein Haupt“ kann seinen eigenen Kopf bezeichnen und zugleich an die relationale Bedeutung von „Haupt“ im Zusammenhang anknüpfen.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Jeder Mann
  rationale: ἀνήρ kann je nach Zusammenhang „Mann“ oder „Ehemann“ bedeuten. Die allgemeine Formulierung und die Entsprechung zu „jede Frau“ in Vers 5 sprechen hier für die weniger festlegende Wiedergabe „jeder Mann“.
- source_word: προσευχόμενος
  choice: der betet
  rationale: Das Präsenspartizip bezeichnet einen Mann während des Betens; der deutsche Relativsatz ist natürlich und klar.
- source_word: προφητεύων
  choice: oder prophetisch redet
  rationale: Das Partizip bezeichnet prophetisches Reden. „Prophetisch redet“ ist im heutigen Deutsch verständlicher und natürlicher als das mögliche, aber weniger geläufige „prophezeit“.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: und dabei etwas auf dem Kopf hat
  rationale: Die Wendung sagt wörtlich ungefähr, dass jemand etwas am beziehungsweise vom Kopf herab hat, ohne den Gegenstand ausdrücklich zu benennen. Die Übersetzung wahrt diese Unbestimmtheit.
- source_word: καταισχύνει
  choice: entehrt
  rationale: Das Verb bezeichnet Beschämung oder Entehrung. „Entehrt“ passt zum Ehr-und-Schande-Kontext und lässt sich im Deutschen natürlich mit „Haupt“ verbinden.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: sein Haupt
  rationale: „Haupt“ bewahrt besser als „Kopf“ die mögliche Doppelbedeutung zwischen dem körperlichen Kopf und dem relational gebrauchten „Haupt“ im Kontext von Vers 3.
theological_decisions:
- issue: Ob κεφαλή im Schlusssatz ausdrücklich körperlich oder relational zu verstehen ist
  choice: Die Mehrdeutigkeit wird mit „sein Haupt“ bewahrt.
  alternative: „seinen eigenen Kopf“ oder „den, der sein Haupt ist“
  rationale: Paulus kann mit dem körperlichen Kopf zugleich an die relationale Verwendung von „Haupt“ im unmittelbaren Kontext anknüpfen. Der Haupttext soll diese rhetorische und theologische Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Prophetisch redet“ vermeidet das im heutigen Sprachgebrauch missverständliche „prophezeit“. Die Wiederholung von „Kopf“ und „Haupt“ bildet die griechische Wiederholung von κεφαλή nicht formal ab, bewahrt aber durch „Haupt“ im Schlusssatz deren kontextuelle Doppelbedeutung.
