source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: de
  text: Wenn aber jemand meint, streitsüchtig zu sein, dann haben wir keinen solchen Brauch[a], ebenso wenig die Gemeinden Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Einen solchen Brauch“ kann sich entweder auf die Streitsucht oder auf die in den vorangehenden Versen umstrittene Praxis beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: meint
  rationale: In der Verbindung mit dem Infinitiv kann δοκεῖ sowohl den Anschein als auch die eigene Auffassung oder Neigung ausdrücken. „Meint“ ist hier natürlich und lässt offen, ob die Person sich dazu berechtigt sieht oder diese Haltung erkennen lässt.
- source_word: φιλόνεικος
  choice: streitsüchtig
  rationale: Das Adjektiv bezeichnet eine Neigung zu Streit und Auseinandersetzung. „Streitsüchtig“ gibt diese dauerhafte kämpferische Haltung prägnant wieder.
- source_word: τοιαύτην
  choice: einen solchen
  rationale: Die Formulierung wahrt den rückverweisenden, aber nicht ausdrücklich bestimmten Charakter des griechischen Demonstrativpronomens.
- source_word: συνήθειαν
  choice: Brauch
  rationale: Das Substantiv bezeichnet eine Gewohnheit, übliche Praxis oder einen etablierten Brauch. „Brauch“ passt zum gemeinschaftlichen Zusammenhang und lässt den umstrittenen Bezug offen.
- source_word: οὐκ ἔχομεν
  choice: wir haben … nicht
  rationale: Die unmittelbare Wiedergabe vermeidet stärkere Deutungen wie „wir dulden“ oder „wir befolgen“.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: die Gemeinden Gottes
  rationale: „Gemeinden“ ist im neutestamentlichen Kontext eine natürliche deutsche Wiedergabe von ἐκκλησίαι und bewahrt mit „Gottes“ den Genitiv.
theological_decisions:
- issue: Bezug von „einen solchen Brauch“
  choice: Die Übersetzung bestimmt nicht ausdrücklich, ob damit Streitsucht oder die in den vorangehenden Versen behandelte Praxis gemeint ist.
  alternative: „Wir pflegen keine Streitsucht“ oder „Einen anderen Brauch kennen wir nicht“ mit ausdrücklichem Bezug auf die zuvor behandelte Praxis.
  rationale: τοιαύτην συνήθειαν ist knapp formuliert und sein Bezug ist umstritten. Die allgemeine Wendung bewahrt die echte Mehrdeutigkeit des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet den Übergang von der Bedingung zum nachdrücklichen gemeinschaftlichen Einwand ab. „Ebenso wenig“ gibt οὐδέ idiomatisch wieder.
