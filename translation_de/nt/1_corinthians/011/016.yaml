  source_fidelity: Die Übersetzung gibt φιλόνεικος, τοιαύτην συνήθειαν und die appellative Gegenüberstellung mit den Gemeinden Gottes im Wesentlichen treffend wieder. „… sein zu müssen“ hat jedoch im Griechischen keine Entsprechung und fügt eine Modalität des Sich-gezwungen-Sehens hinzu. Das muss entfallen.
  naturalness: „Wenn aber jemand meint, streitsüchtig zu sein“ ist modernes, verständliches Standarddeutsch und gibt die Verbindung δοκεῖ + Infinitiv ohne zusätzliche Nuance wieder. „Wir haben keinen solchen Brauch“ ist idiomatischer als die getrennte Negation. Der Doppelpunkt ist nicht nötig.
  terminology: „Streitsüchtig“, „Brauch“ und „Gemeinden Gottes“ sind passende, registergerechte Wiedergaben. Der unbestimmte Rückverweis von τοιαύτην bleibt erhalten; die Anmerkung bewahrt die kontextuelle Mehrdeutigkeit.
