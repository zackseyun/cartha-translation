revisions:
- from: Denn wer isst und trinkt, isst und trinkt sich selbst ein Gericht, weil er den Leib nicht unterscheidet.[a][b]
  to: Denn wer isst und trinkt, isst und trinkt sich selbst zum Gericht, ohne den Leib[a] zu unterscheiden.[b]
  rationale: Die Revision ersetzt die unidiomatische Verbindung „sich selbst ein Gericht essen und trinken“ durch die natürliche und quellennähere Wendung „sich selbst zum Gericht essen und trinken“. Sie gibt das negierte Partizip offen als „ohne ... zu unterscheiden“ wieder, statt mit „weil“ eine spezifische logische Beziehung festzuschreiben. „Gericht“ und „Leib“ bleiben unverändert, da sie die Wortwahl und Auslegungsoffenheit des griechischen Textes sachgerecht bewahren. Die Fußnotenanker werden unmittelbar an der jeweils erläuterten Formulierung platziert; die alternative Lesart und die semantische Offenheit werden ohne konfessionelle Festlegung erläutert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:49:46Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die zentrale Wiederholung von ἐσθίει καὶ πίνει, κρίμα und das unbestimmte τὸ σῶμα grundsätzlich treffend wieder. Die kausale Einengung durch „weil“ legt jedoch eine vom griechischen negierten Partizip nicht ausdrücklich markierte Beziehung fest. Außerdem ist „sich selbst ein Gericht essen und trinken“ im heutigen Standarddeutsch nicht idiomatisch.
  naturalness: „Sich selbst zum Gericht essen und trinken“ ist eine etablierte, klare und zugleich nahe am Griechischen bleibende deutsche Wendung. Die partizipiale Wiedergabe „ohne den Leib zu unterscheiden“ ist natürlich und wahrt die syntaktische Offenheit des Ausgangstextes.
  terminology: „Gericht“ ist für κρίμα angemessen und vermeidet die zu starke Festlegung auf endgültige „Verdammnis“. „Leib“ bewahrt die absichtliche Kürze und Mehrdeutigkeit von τὸ σῶμα. Die Fußnote zur Lesart „des Herrn“ ist korrekt. Die Deutungshilfe zur Bedeutung des Leibes sollte die möglichen Bezüge erläutern, ohne einen davon als gemeint festzulegen.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe des reflexiven Dativs
    rationale: „isst und trinkt sich selbst ein Gericht“ ist grammatisch zwar verständlich, klingt aber im modernen Standarddeutsch künstlich. „isst und trinkt sich selbst zum Gericht“ entspricht der üblichen deutschen Konstruktion und bildet die nachteilige Folge für die handelnde Person präzise ab.
  - severity: medium
    issue: „Weil“ legt die Partizipialbeziehung kausal fest
    rationale: μὴ διακρίνων ist als Partizip nicht eigens als Kausalsatz markiert. „Ohne den Leib zu unterscheiden“ gibt die modale/begleitende Form wieder und lässt die vom Kontext getragene Begründungsrelation erkennbar, ohne sie syntaktisch zu erzwingen.
  - severity: low
