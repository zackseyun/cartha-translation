    rationale: Wenn der Haupttext bereits „ohne den Leib zu unterscheiden“ lautet, sollte die Fußnote stattdessen die mögliche Bedeutung von διακρίνω als angemessenes Erkennen bzw. Beurteilen und die bewusst offene Referenz von „Leib“ erläutern.
