  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: de
  text: Denn wer isst und trinkt, isst und trinkt sich selbst zum Gericht, ohne den Leib[a] zu unterscheiden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben statt „den Leib“: „den Leib des Herrn“.'
    reason: textual_variant
  - marker: b
    text: Das Verb kann auch „erkennen“ oder „angemessen beurteilen“ bedeuten. Mit „dem Leib“ kann der Leib Christi im Herrenmahl, die versammelte Gemeinde als Leib Christi oder beides gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: Gericht
  rationale: κρίμα bezeichnet hier ein göttliches Urteil bzw. dessen Folge. „Gericht“ bleibt weiter als „Verdammnis“ und passt zum Zusammenhang, in dem Vers 32 zwischen gegenwärtiger Züchtigung und der Verurteilung mit der Welt unterscheidet.
- source_word: ἑαυτῷ
  choice: sich selbst
  rationale: Der reflexive Dativ bezeichnet die Person, die durch ihr eigenes Essen und Trinken das Gericht auf sich zieht; die deutsche Wendung „sich selbst ein Gericht essen und trinken“ bildet dies knapp und verständlich ab.
- source_word: διακρίνων
  choice: unterscheidet
  rationale: διακρίνω kann hier ein angemessenes Unterscheiden, Beurteilen oder Erkennen bezeichnen. „Unterscheiden“ wahrt den Grundsinn und legt nicht fest, worin die geforderte Erkenntnis genau besteht.
- source_word: τὸ σῶμα
  choice: den Leib
  rationale: Der SBLGNT-Text lautet lediglich „den Leib“. Die knappe Formulierung bewahrt die mögliche Beziehung sowohl auf Christi Leib im Mahl als auch auf die versammelte Gemeinde als Leib Christi.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: wer isst und trinkt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden, der so handelt. Die deutsche Konstruktion mit „wer“ ist natürlich und bewahrt den generischen Singular.
- source_word: μὴ διακρίνων
  choice: weil er ... nicht unterscheidet
  rationale: Das Partizip benennt den begleitenden und sachlich begründenden Umstand des Gerichts. Der Nebensatz macht diesen Zusammenhang in natürlichem Deutsch deutlich, ohne die Bedeutung des „Leibes“ festzulegen.
theological_decisions:
- issue: Bedeutung von „dem Leib“ im Zusammenhang des Herrenmahls
  choice: Die mehrdeutige Formulierung „den Leib“ bleibt im Haupttext stehen.
  alternative: „den Leib des Herrn“ oder ausdrücklich „die Gemeinde als Leib“
  rationale: Der griechische Ausgangstext sagt nur τὸ σῶμα. Der Zusammenhang betrifft sowohl das Mahl in Bezug auf Jesus als auch den Umgang der Korinther miteinander; daher darf die Übersetzung die theologische Spannung nicht einseitig auflösen.
- issue: Bedeutungsumfang von κρίμα
  choice: „Gericht“
  alternative: „Verdammnis“
  rationale: „Verdammnis“ würde im Kontext zu stark auf das endgültige Urteil festlegen. Vers 32 spricht von göttlicher Züchtigung, damit die Betroffenen nicht mit der Welt verurteilt werden.
- issue: Beziehung des negierten Partizips zum Hauptsatz
  choice: 'kausale Wiedergabe: „weil er den Leib nicht unterscheidet“'
  alternative: 'modal: „ohne den Leib zu unterscheiden“; konditional: „wenn er den Leib nicht unterscheidet“'
  rationale: Das griechische Partizip ist nicht ausdrücklich kausal oder konditional markiert. Im Satz erklärt es jedoch sachlich, weshalb das Essen und Trinken Gericht bringt; die Fußnote bewahrt die mögliche modalere Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gericht“ und „Leib“ bewahren den biblisch-theologischen Ton, während die „wer“-Konstruktion und der kausale Nebensatz für heutige Leser natürlich verständlich sind. Die Fußnotenmarker stehen in der Reihenfolge [a][b] unmittelbar nach der auslegungsbedürftigen Aussage.
