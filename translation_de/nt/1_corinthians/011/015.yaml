id: 1CO.11.15
reference: 1 Corinthians 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: de
  text: Wenn aber eine Frau[a] langes Haar trägt, gereicht es ihr zur Ehre; denn das lange Haar ist ihr anstelle einer Umhüllung[b] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ehefrau«. Das griechische Wort kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »als Umhüllung«. Die griechische Präposition kann Ersetzung oder Entsprechung ausdrücken; die Formulierung allein entscheidet nicht, ob das Haar die Umhüllung ersetzt oder als eine solche dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: eine Frau
  rationale: γυνή kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten. Hier ist die Aussage allgemein formuliert; daher passt »Frau« am besten, während die mögliche Bedeutung »Ehefrau« in einer Fußnote erhalten bleibt.
- source_word: κομᾷ
  choice: langes Haar trägt
  rationale: κομάω bezeichnet das Tragen beziehungsweise Haben langen Haars. »Langes Haar trägt« ist im modernen Deutsch natürlich und gibt die aktive Ausdrucksweise des Verbs wieder.
- source_word: δόξα
  choice: gereicht es ihr zur Ehre
  rationale: δόξα bezeichnet hier etwas, das Ehre oder Ansehen verleiht. Die idiomatische Wendung bewahrt die rhetorische Aussage, ohne das im Deutschen leicht missverständliche »Herrlichkeit« zu erzwingen.
- source_word: κόμη
  choice: das lange Haar
  rationale: κόμη bezeichnet das Kopfhaar, häufig mit dem Beiklang langen oder gewachsenen Haars. Die Wiederholung von »langes Haar« macht den Bezug im Deutschen eindeutig.
- source_word: ἀντί
  choice: anstelle
  rationale: ἀντί kann Substitution oder Entsprechung ausdrücken. »Anstelle« gibt die gewöhnliche substitutive Bedeutung wieder; die ebenfalls mögliche Wiedergabe »als« wird in der Fußnote genannt.
- source_word: περιβολαίου
  choice: einer Umhüllung
  rationale: περιβόλαιον ist allgemein etwas, das umgelegt wird oder umhüllt. »Umhüllung« bleibt weiter als »Schleier« und legt nicht fest, welche konkrete Art von Bedeckung gemeint ist.
- source_word: δέδοται
  choice: ist ihr … gegeben
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Gabe mit fortbestehendem Ergebnis. Die deutsche Formulierung wahrt Passiv und Ergebniszustand.
theological_decisions:
- issue: Ob περιβόλαιον speziell einen Schleier bezeichnet und ob das Haar selbst die in diesem Abschnitt verlangte Kopfbedeckung ist.
  choice: Der allgemeine Ausdruck »Umhüllung« wird verwendet, ohne die größere Auslegungsfrage im Haupttext zu entscheiden.
  alternative: »Schleier« oder »Bedeckung«
  rationale: Das griechische Substantiv ist nicht auf einen Schleier beschränkt. Die allgemeinere Wiedergabe vermeidet es, eine bestimmte kulturelle oder lehrmäßige Deutung in den Text einzutragen.
- issue: Ob ἀντί hier strikte Ersetzung oder funktionale Entsprechung ausdrückt.
  choice: Im Haupttext steht »anstelle«; die mögliche Wiedergabe »als« wird in einer Fußnote bewahrt.
  alternative: »als Umhüllung«
  rationale: ἀντί hat gewöhnlich substitutive Kraft, kann in diesem Zusammenhang aber auch eine Entsprechung bezeichnen. Die Fußnote erhält diese echte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Gereicht es ihr zur Ehre« bewahrt den gehobenen rhetorischen Ton, bleibt aber allgemein verständlich. »Umhüllung« vermeidet die gegenüber dem Griechischen zu enge Festlegung auf einen Schleier.
