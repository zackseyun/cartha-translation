  terminology: „Anordnen“ ist als Wiedergabe von παραγγέλλω vertretbar, auch wenn „anweisen“ etwas weniger administrativ klingt. „Loben“ trifft ἐπαινῶ direkt. „Zum Besseren/zum Schlechteren“ bewahrt die knappe, antithetische Vergleichsform des Griechischen.
