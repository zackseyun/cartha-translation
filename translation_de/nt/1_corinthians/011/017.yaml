  rationale: Die Revision entfernt die nicht im Griechischen angelegte Bedingung und Modalität. „Während ich euch dies anordne“ gibt die begleitende Funktion des Partizips παραγγέλλων wieder, ohne dessen autoritativen Charakter abzuschwächen. Die direkte Wiedergabe „ihr kommt … zusammen“ entspricht συνέρχεσθε und erhält die rhetorische Anrede. Der Fußnotenanker bleibt an „anordne“; die Alternativen dokumentieren die lexikalische Spannweite ohne eine konfessionelle Deutung festzulegen.
