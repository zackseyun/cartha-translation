  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: de
  text: Doch während ich euch dies anordne, lobe ich euch nicht, denn ihr kommt nicht zum Besseren, sondern zum Schlechteren zusammen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: Doch wenn ich euch dies
  rationale: Das Demonstrativpronomen verweist voraus auf die folgende Anordnung. δέ markiert hier den Übergang zu einem deutlichen Gegensatz gegenüber dem Lob in Vers 2; „Doch“ gibt diesen Wechsel natürlich wieder.
- source_word: παραγγέλλων
  choice: anordne
  rationale: Das Partizip von παραγγέλλω bezeichnet ein autoritatives Anweisen, Anordnen oder Gebieten. Die konditionale deutsche Fügung „wenn ich … anordne“ gibt den begleitenden Umstand idiomatisch wieder, ohne die apostolische Autorität abzuschwächen.
- source_word: οὐκ ἐπαινῶ
  choice: kann ich euch nicht loben
  rationale: ἐπαινέω bedeutet „loben“ oder „anerkennen“. Die deutsche Wendung drückt in diesem Zusammenhang eine begründete Verweigerung des Lobes aus und stellt den Bezug zum Lob in Vers 2 her.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt den Grund dafür ein, dass Paulus die Gemeinde nicht lobt. „Denn“ verbindet den begründenden Satz im Deutschen flüssig mit dem vorangehenden Urteil.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: nicht zum Besseren, sondern zum Schlechteren
  rationale: Die parallelen substantivierten Komparative werden formal und prägnant bewahrt. Die Wendung lässt offen, ob vor allem Ergebnis, Wirkung oder Zielrichtung der Zusammenkünfte gemeint ist.
- source_word: συνέρχεσθε
  choice: eure Zusammenkünfte dienen
  rationale: Das Verb bezeichnet hier das Zusammenkommen der Gemeinde. Die nominale deutsche Fassung macht den Bezug auf die Versammlungen klar und erlaubt eine natürliche Wiedergabe der εἰς-Konstruktion, ohne den Sinn auf einen bestimmten Gottesdiensttyp einzuengen.
theological_decisions:
- issue: Autoritativer Ton von παραγγέλλων
  choice: anordne
  alternative: unterweise; gebiete
  rationale: „Anordnen“ bewahrt den verbindlichen Charakter apostolischer Weisung, ohne den Ausdruck unnötig zu verschärfen. Die Fußnote weist auf die mögliche stärkere Wiedergabe hin.
- issue: Wirkung oder Zweck der Zusammenkünfte
  choice: dienen nicht zum Besseren, sondern zum Schlechteren
  alternative: führen nicht zum Besseren, sondern zum Schlechteren
  rationale: Die griechische Konstruktion εἰς + substantivierter Komparativ kann Zielrichtung oder Ergebnis ausdrücken. „Dienen … zum“ hält diese Spannung eher offen als eine ausschließlich resultative Formulierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antithetische Struktur „nicht … sondern …“ und die substantivierten Komparative des Ausgangstextes bleiben erhalten. Der Satz ist für die öffentliche Lesung klar gegliedert.
