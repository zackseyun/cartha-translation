  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: de
  text: Ich lobe euch aber dafür, dass ihr in allem an mich denkt und an den Überlieferungen festhaltet, so wie ich sie euch weitergegeben habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lehren“ oder „Anweisungen“; das griechische Wort bezeichnet das, was weitergegeben beziehungsweise überliefert wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Ich lobe
  rationale: Direkte und natürliche Wiedergabe des positiven Lobes; „ich erkenne euch an“ wäre weniger unmittelbar.
- source_word: δὲ
  choice: aber
  rationale: Gibt den milden weiterführenden beziehungsweise kontrastierenden Anschluss wieder, ohne ein im Griechischen nicht vorhandenes zeitliches „nun“ einzuführen.
- source_word: πάντα μου μέμνησθε
  choice: ihr in allem an mich denkt
  rationale: Natürliches Deutsch für das umfassende, fortdauernde Gedenken an Paulus; „euch in allem an mich erinnert“ wäre hier schwerfälliger.
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: so wie ich sie euch weitergegeben habe
  rationale: Bewahrt den Gedanken der Weitergabe und klingt im modernen Deutschen natürlicher als „überliefert habe“ direkt neben „Überlieferungen“.
- source_word: τὰς παραδόσεις
  choice: die Überlieferungen
  rationale: Lexikalisch transparente Wiedergabe dessen, was weitergegeben wurde; sie wahrt die Kategorie apostolischer Übermittlung, ohne spätere konfessionelle Vorstellungen einzutragen.
- source_word: κατέχετε
  choice: an ... festhaltet
  rationale: Drückt aktives Bewahren und verbindliches Festhalten idiomatisch aus.
theological_decisions:
- issue: Wiedergabe von παραδόσεις im gemeindlichen Zusammenhang
  choice: Überlieferungen
  alternative: Lehren; Anweisungen
  rationale: „Überlieferungen“ erhält den Zusammenhang mit dem Weitergeben und lässt offen, welche Formen die übermittelten Inhalte im Einzelnen hatten. Dadurch wird der Ausdruck weder zu allgemeiner Lehre verflacht noch mit späteren konfessionellen Traditionsbegriffen gleichgesetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Formulierung „weitergegeben“ vermeidet eine unschöne Wiederholung von „Überlieferungen/überliefert“, während die Fußnote die lexikalische Beziehung erklärt.
