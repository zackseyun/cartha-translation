id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: de
  text: Werdet meine Nachahmer, so wie auch ich Christus nachahme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »so wie auch ich [Nachahmer] Christi [bin]«; im Griechischen ist der entsprechende Ausdruck im zweiten Satzteil ausgelassen.'
    reason: Die Fußnote macht die griechische Ellipse sichtbar, die im Haupttext für natürliches Deutsch mit »nachahme« aufgelöst wird.
lexical_decisions:
- source_word: μιμηταί μου
  choice: meine Nachahmer
  rationale: Die Wendung bezeichnet Menschen, die sich Paulus in seinem Verhalten zum Vorbild nehmen. »Nachahmer« bewahrt den ausdrücklichen Gedanken des Nachahmens genauer als das weiter gefasste »Nachfolger«.
- source_word: γίνεσθε
  choice: Werdet
  rationale: Der Imperativ von γίνομαι hat hier die Kraft von »werdet« beziehungsweise »entwickelt euch zu«. »Werdet« gibt diesen dynamischen Aspekt genauer wieder als bloßes »seid«.
- source_word: καθὼς κἀγώ
  choice: so wie auch ich
  rationale: Die Formulierung bewahrt sowohl den ausdrücklichen Vergleich durch καθὼς als auch die additive Betonung von καί in κἀγώ.
- source_word: Χριστοῦ
  choice: Christus
  rationale: Χριστοῦ ist der Genitiv zu Χριστός. Im Deutschen ist »Christus« die geläufige, zugleich titelhaltige Bezeichnung; in der idiomatisch aufgelösten Ellipse steht es als Objekt zu »nachahme«.
theological_decisions:
- issue: Paulus als nachzuahmendes Vorbild
  choice: Paulus soll in dem Maß nachgeahmt werden, in dem er Christus nachahmt
  alternative: Eine uneingeschränkte Aufforderung, Paulus unabhängig von seinem Christusbezug nachzuahmen
  rationale: Der Vergleichssatz bindet Paulus’ Vorbildfunktion ausdrücklich an seine eigene Nachahmung Christi. Die Übersetzung lässt diese Beziehung stehen, ohne sie durch eine zusätzliche Einschränkungsformel auszudeuten.
- issue: Wiedergabe von Χριστοῦ
  choice: Christus
  alternative: der Messias
  rationale: Beide Wiedergaben erfassen den Titel Χριστός. »Christus« ist im modernen Standarddeutsch natürlich und bewahrt die traditionelle Titelform, ohne hier entscheiden zu müssen, wie stark der Ausdruck bereits namenartig gebraucht wird.
- issue: Ellipse im zweiten Satzteil
  choice: mit »Christus nachahme« idiomatisch ergänzt
  alternative: wie auch ich [Nachahmer] Christi [bin]
  rationale: Im Griechischen ist das Prädikat beziehungsweise die Bezeichnung »Nachahmer« im zweiten Satzteil ausgelassen und aus dem ersten zu ergänzen. Die verbale Auflösung gibt den Sinn im Deutschen klar wieder; die formalere Struktur wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. »Nachahmer« hält die zentrale Wortfamilie des griechischen Textes fest; die zweite Satzhälfte wird zur Vermeidung einer schwerfälligen deutschen Ellipse verbal formuliert.
