  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: de
  text: Deshalb sind viele unter euch schwach und krank, und nicht wenige sind entschlafen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Sie sind gestorben. Paulus gebraucht „entschlafen“ als Bild für den Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: Die Formulierung bewahrt den ausdrücklichen ursächlichen Rückbezug auf den vorausgehenden Missbrauch beim Mahl des Herrn und klingt im Deutschen natürlich.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Gemeint sind Zustände innerhalb der korinthischen Gemeinde, nicht ein innerer Zustand der Einzelnen.
- source_word: πολλοὶ
  choice: viele
  rationale: Die substantivisch gebrauchte Mengenangabe wird knapp und unmittelbar wiedergegeben.
- source_word: ἀσθενεῖς
  choice: schwach
  rationale: „Schwach“ erhält gegenüber dem folgenden „krank“ die mögliche Abstufung von körperlicher Schwäche zu deutlicher Erkrankung.
- source_word: ἄρρωστοι
  choice: krank
  rationale: Die allgemein verständliche Wiedergabe bezeichnet körperliche Erkrankung und bleibt von „schwach“ unterschieden.
- source_word: κοιμῶνται
  choice: sind entschlafen
  rationale: „Entschlafen“ bewahrt das im frühchristlichen Sprachgebrauch naheliegende Bild des Schlafes als Bezeichnung für den Tod; das Perfekt gibt den resultativen Sinn im Deutschen natürlich wieder.
- source_word: ἱκανοί
  choice: nicht wenige
  rationale: Die Wendung bezeichnet eine beträchtliche Anzahl, vermeidet eine mechanische Wiederholung von „viele“ und entspricht würdigem, natürlichem Deutsch.
theological_decisions:
- issue: Ob κοιμῶνται wörtlichen Schlaf oder metaphorisch den Tod bezeichnet
  choice: Metaphorischer Bezug auf den Tod, im Haupttext als „sind entschlafen“ bildhaft bewahrt
  alternative: „schlafen“ oder ausdrücklich „sind gestorben“
  rationale: Der Zusammenhang mit göttlichem Gericht sowie die Folge schwach – krank – entschlafen sprechen deutlich für den Tod. Die bildhafte Wiedergabe erhält jedoch Paulus’ Ausdrucksweise, ohne sie im Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entschlafen“ ist etwas gehobener als die Alltagssprache, bewahrt hier aber das Quellbild verständlich und ohne konfessionelle Zusätze.
