reference: 1 Corinthians 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: de
  text: 'Ich möchte aber, dass ihr wisst: Das Haupt[a] jedes Mannes ist der Messias, das Haupt einer Frau ist der Mann[b], und das Haupt des Messias ist Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haupt“ kann hier auch im Sinn von „Ursprung“ oder „Autorität über“ verstanden werden; im Haupttext bleibt die griechische Metapher erhalten.
    reason: lexical_alternative
  - marker: b
    text: „Frau“ und „Mann“ können hier auch als „Ehefrau“ und „Ehemann“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Ich möchte aber, dass ihr wisst
  rationale: Gibt die persönliche Absicht des Paulus und den milden Übergang natürlich und zugleich eng am griechischen Satz wieder.
- source_word: παντὸς ἀνδρός
  choice: jedes Mannes
  rationale: ἀνήρ kann Mann oder Ehemann bedeuten. In der ersten, allgemein formulierten Parallelaussage liegt „Mann“ näher.
- source_word: κεφαλή
  choice: Haupt
  rationale: Bewahrt die griechische Metapher, ohne die umstrittene Bedeutung vorschnell als Ursprung oder Autorität festzulegen. „Haupt“ klingt im Deutschen würdevoll und ist für metaphorischen Gebrauch geeigneter als das stärker körperlich wirkende „Kopf“.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Χριστός hat hier aufgrund des Artikels und der prädikativen Konstruktion deutlich Titelfunktion.
- source_word: γυναικός
  choice: einer Frau
  rationale: γυνή kann Frau oder Ehefrau bedeuten. Die allgemeine Wiedergabe erhält die lexikalische Offenheit; die eheliche Lesart wird in einer Fußnote genannt.
- source_word: ὁ ἀνήρ
  choice: der Mann
  rationale: Die Wiedergabe entspricht der parallelen Formulierung und lässt die mögliche Bedeutung „Ehemann“ offen, die in der Fußnote ausgewiesen wird.
- source_word: ὁ θεός
  choice: Gott
  rationale: Direkte und übliche Wiedergabe des prädikativen Subjekts.
theological_decisions:
- issue: Bedeutung von κεφαλή in den drei parallelen Aussagen
  choice: Die Metapher wird als „Haupt“ beibehalten.
  alternative: „Ursprung“ oder „Autorität über“
  rationale: Die Bedeutung der Metapher ist exegetisch und theologisch umstritten. Der Haupttext soll diese Spannung nicht durch eine auslegende Festlegung auflösen.
- issue: Bedeutung von ἀνήρ und γυνή
  choice: Im Haupttext stehen „Mann“ und „Frau“.
  alternative: „Ehemann“ und „Ehefrau“
  rationale: Die Syntax erlaubt eine allgemeine Aussage, während Wortbedeutung und Kontext auch eine eheliche Lesart zulassen. Diese wird deshalb in einer Fußnote bewahrt.
- issue: Aussage, dass Gott das Haupt des Messias ist
  choice: Die Aussage wird ohne abschwächenden oder erklärenden Zusatz wörtlich wiedergegeben.
  alternative: Eine Paraphrase, die das Verhältnis ausdrücklich als bloß funktionale Ordnung deutet.
  rationale: Die Übersetzung bewahrt die Aussage des griechischen Textes und importiert weder eine subordinatianische Deutung noch eine dogmatische Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gliedert die einleitende Wissensformel und die drei parallelen Aussagen klar. „Haupt“ erhält die biblische Metapher, ohne ihre strittige genaue Bedeutung festzulegen.
