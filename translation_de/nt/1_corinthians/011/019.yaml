id: 1CO.11.19
reference: 1 Corinthians 11:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: de
  text: Denn es muss unter euch auch Parteiungen[a] geben, damit auch die Bewährten[b] unter euch erkennbar werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Spaltungen“, „Parteien“ oder „Sekten“; im späteren Sprachgebrauch auch „Häresien“. Hier sind wahrscheinlich Parteiungen innerhalb der Gemeinde gemeint.
    reason: lexical_alternative
  - marker: b
    text: „Die Bewährten“ kann auch mit „die als echt Erwiesenen“ oder „diejenigen, die die Prüfung bestanden haben“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: es muss … geben
  rationale: Bewahrt die starke Aussage der Notwendigkeit, ohne festzulegen, ob sie göttliche Notwendigkeit, praktische Unvermeidlichkeit oder beides bezeichnet.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den Vers als Begründung beziehungsweise Erläuterung des vorher Gesagten.
- source_word: καὶ αἱρέσεις
  choice: auch Parteiungen
  rationale: Bezeichnet hier am ehesten gegeneinander stehende Gruppen innerhalb der Gemeinde. „Parteiungen“ wahrt diesen Sinn, ohne die spätere fachtheologische Bedeutung „Häresien“ in den Text einzutragen.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Gibt den gemeinschaftlichen Bezug idiomatisch wieder und wird an beiden Stellen beibehalten.
- source_word: ἵνα
  choice: damit
  rationale: Lässt die im Griechischen mögliche Spannung zwischen Zweck und Ergebnis bestehen.
- source_word: καὶ οἱ δόκιμοι
  choice: auch die Bewährten
  rationale: δόκιμοι bezeichnet Menschen, die sich in einer Prüfung als echt beziehungsweise zuverlässig erwiesen haben. „Die Bewährten“ ist knapp und bewahrt das zweite καί als „auch“.
- source_word: φανεροὶ γένωνται
  choice: erkennbar werden
  rationale: Gibt den Vorgang wieder, durch den jemand offen sichtbar beziehungsweise als solcher kenntlich wird, und klingt im modernen Deutsch natürlicher als „offenbar werden“.
theological_decisions:
- issue: Wiedergabe von αἱρέσεις
  choice: Parteiungen
  alternative: Spaltungen; Parteien; Sekten; Häresien
  rationale: Der unmittelbare Zusammenhang betrifft innere Gruppenbildung in der korinthischen Gemeinde. Die Übersetzung vermeidet es, die erst später vorherrschende Bedeutung „Häresien“ vorauszusetzen.
- issue: Aussagekraft von δεῖ
  choice: 'Die Notwendigkeit bleibt unbestimmt: „es muss … geben“'
  alternative: göttliche Notwendigkeit; praktische Unvermeidlichkeit
  rationale: Paulus erklärt an dieser Stelle nicht, worin die Notwendigkeit begründet ist. Die Übersetzung entscheidet daher nicht zwischen Vorsehung und situativer Unvermeidlichkeit.
- issue: Funktion von ἵνα
  choice: damit
  alternative: sodass
  rationale: „Damit“ kann hier den Zusammenhang von Zweck und Ergebnis ausdrücken, ohne die theologische Spannung darüber aufzulösen, ob die Parteiungen beabsichtigtes Mittel oder faktischer Anlass des Sichtbarwerdens sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Parteiungen“ ist bewusst präziser als das politisch leicht missverständliche „Parteien“; „erkennbar werden“ vermeidet unnötig altertümliche Sprache. Die Wiederholung von „unter euch“ und beide Vorkommen von καί („auch“) bleiben erhalten.
