  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: δεῖ mit „es muss“, die beiden Vorkommen von καί mit „auch“, αἱρέσεις kontextgerecht mit „Parteiungen“, ἵνα mit „damit“, δόκιμοι mit „die Bewährten“ und φανεροὶ γένωνται mit „erkennbar werden“. Die zweimalige gemeinschaftliche Rahmung ἐν ὑμῖν ist treffend als „unter euch“ erhalten. Die Ursache bzw. Art der durch δεῖ bezeichneten Notwendigkeit wird zu Recht nicht interpretiert.'
  naturalness: „Denn es muss unter euch auch Parteiungen geben, damit auch die Bewährten unter euch erkennbar werden“ ist flüssiges, modernes Standarddeutsch mit angemessen würdigem Register. „Parteiungen“ ist hier präziser als „Parteien“ und weniger anachronistisch-doktrinär als „Häresien“.
  terminology: Die Terminologie ist sachgerecht. „Parteiungen“ trifft αἱρέσεις im Zusammenhang innergemeindlicher Gruppierungen. „Die Bewährten“ gibt das substantivierte δόκιμοι knapp und verständlich wieder, ohne eine spezifische theologische Deutung einzutragen. Die Fußnoten benennen relevante lexikalische Alternativen und erläutern die spätere Bedeutung von „Häresien“ angemessen.
