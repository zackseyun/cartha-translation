id: 1CO.11.7
reference: 1 Corinthians 11:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: de
  text: Denn ein Mann soll sein Haupt nicht bedecken[a], weil er Gottes Bild und Herrlichkeit ist; die Frau aber ist die Herrlichkeit des Mannes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ein Ehemann soll sein Haupt nicht bedecken …; die Ehefrau aber ist die Herrlichkeit ihres Ehemannes.“ Die griechischen Wörter für „Mann“ und „Frau“ können je nach Zusammenhang auch „Ehemann“ und „Ehefrau“ bedeuten. Das Verb kann auch mit „verhüllen“ wiedergegeben werden.'
    reason: Lexikalische Alternativen und mögliche eheliche Lesart.
lexical_decisions:
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: Die unbestimmte, generische Form gibt den Mann als Vertreter des männlichen Geschlechts wieder. „Ehemann“ ist möglich, würde den Zusammenhang jedoch stärker auf die Ehe eingrenzen, als es der Text eindeutig verlangt.
- source_word: ὀφείλει
  choice: soll
  rationale: „Soll“ drückt die normative Verpflichtung idiomatisch aus, ohne die Formulierung unnötig zu einem absoluten Befehl zu verschärfen.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: sein Haupt nicht bedecken
  rationale: Die Wendung wird konkret und ohne Festlegung auf eine bestimmte Art der Bedeckung wiedergegeben. „Verhüllen“ wäre enger als das griechische Verb.
- source_word: εἰκὼν
  choice: Bild
  rationale: „Bild“ ist die geläufige theologische Entsprechung und bewahrt den wahrscheinlichen Bezug zur Schöpfungssprache.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ wahrt in beiden Vorkommen die Breite und das theologische Gewicht des Begriffs; „Ehre“ wäre enger.
- source_word: ὑπάρχων
  choice: weil er … ist
  rationale: Das Partizip begründet die vorangehende Aussage. „Weil“ macht diese kausale Beziehung in natürlichem Deutsch deutlich.
- source_word: ἡ γυνὴ
  choice: die Frau
  rationale: „Die Frau“ bezeichnet hier generisch die weibliche Seite des Gegensatzes. „Ehefrau“ bleibt lexikalisch möglich, ist kontextuell aber nicht zwingend.
- source_word: ἀνδρός
  choice: des Mannes
  rationale: Der generische Sinn entspricht dem ersten ἀνήρ und bewahrt den Parallelismus. „Ihres Ehemannes“ würde eine nicht ausdrücklich markierte Beziehung hinzufügen.
theological_decisions:
- issue: Ob ἀνήρ und γυνή als Mann/Frau oder Ehemann/Ehefrau wiederzugeben sind
  choice: Mann/Frau
  alternative: Ehemann/Ehefrau
  rationale: Der unmittelbare Gedankengang verbindet den Geschlechtergegensatz mit Schöpfungssprache und ist daher nicht eindeutig auf das Eheverhältnis beschränkt. Die mögliche eheliche Lesart wird in der Fußnote offengehalten.
- issue: Paulus’ asymmetrische Aussage über die Herrlichkeit
  choice: „die Frau aber ist die Herrlichkeit des Mannes“ unverändert direkt wiedergeben
  alternative: „die Frau spiegelt die Herrlichkeit des Mannes wider“ oder „die Frau ist die Ehre des Mannes“
  rationale: Der griechische Text formuliert mit ἐστιν und δόξα unmittelbar. Eine abschwächende oder erklärende Paraphrase würde die theologische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haupt“ wurde statt „Kopf“ gewählt, weil es im argumentativen Zusammenhang natürlich an das Leitwort „Haupt“ in 1. Korinther 11 anschließt, ohne altertümlich unverständlich zu sein. Die wiederholte „Herrlichkeit“ bewahrt die markante Parallelität des Ausgangstextes.
