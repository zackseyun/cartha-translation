  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: de
  text: Wenn ihr nun an einem Ort zusammenkommt, ist es nicht möglich, das Mahl des Herrn zu essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann esst ihr nicht das Mahl des Herrn.“ Paulus tadelt im Zusammenhang die spaltende Art ihres gemeinsamen Essens; dadurch kann das, was sie essen, nicht als Mahl des Herrn gelten.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: wenn ihr … zusammenkommt
  rationale: Der Genitivus absolutus mit ὑμῶν hat temporalen Sinn. „Wenn ihr zusammenkommt“ gibt die gemeinsame Versammlung natürlich und genau wieder.
- source_word: οὖν
  choice: nun
  rationale: οὖν knüpft folgernd an die zuvor beanstandeten Spaltungen an. „Nun“ wahrt diesen Zusammenhang in idiomatischem Deutsch, ohne die Folgerung unnötig stark zu markieren.
- source_word: ἐπὶ τὸ αὐτό
  choice: am selben Ort
  rationale: Die Wendung bezeichnet hier das Zusammenkommen an einem Ort beziehungsweise in einer gemeinsamen Versammlung. „Am selben Ort“ bewahrt die räumliche Nuance und vermeidet eine bloße Wiederholung von „zusammenkommt“.
- source_word: οὐκ ἔστιν … φαγεῖν
  choice: esst ihr nicht
  rationale: Die komprimierte griechische Konstruktion lässt sich im Deutschen nicht natürlich wörtlich mit „es ist nicht, … zu essen“ wiedergeben. „Esst ihr nicht“ bewahrt die Verneinung und lässt im Kontext offen, ob Paulus ihre Handlung grundsätzlich verneint oder ihr die angemessene Bezeichnung abspricht.
- source_word: κυριακὸν
  choice: des Herrn
  rationale: Das Adjektiv bezeichnet die Zugehörigkeit zum Herrn. Der deutsche Genitiv gibt diese Beziehung klar und in der etablierten Wendung wieder.
- source_word: δεῖπνον
  choice: Mahl
  rationale: δεῖπνον bezeichnet eine Haupt- oder Abendmahlzeit. „Mahl“ passt zur gemeinschaftlichen Feier und ist im modernen Deutsch würdig und verständlich; „Abendessen“ wäre zu alltäglich und zeitlich enger.
- source_word: κυριακὸν δεῖπνον
  choice: das Mahl des Herrn
  rationale: Die Formulierung bildet die Zugehörigkeit zum Herrn transparent ab und vermeidet, den griechischen Ausdruck ohne Not vorschnell mit einem späteren festen Sakramentsbegriff gleichzusetzen.
theological_decisions:
- issue: Ob Paulus das Essen des Herrenmahls schlechthin verneint oder erklärt, dass das Verhalten der Gemeinde ihr Essen als Mahl des Herrn disqualifiziert
  choice: Der Haupttext lautet knapp „esst ihr nicht das Mahl des Herrn“ und bewahrt damit die zugespitzte Verneinung.
  alternative: „Dann kann man nicht das Mahl des Herrn essen“ beziehungsweise „Dann ist das, was ihr esst, nicht das Mahl des Herrn.“
  rationale: Der unmittelbare Kontext in den Versen 21–22 zeigt, dass Paulus die spaltende und beschämende Art des Essens tadelt. Zugleich ist οὐκ ἔστιν … φαγεῖν syntaktisch gedrängt. Der Haupttext wahrt diese Spannung; die Fußnote nennt die naheliegende qualifizierende Deutung, ohne sie zum allein möglichen Sinn zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Wortstellung bleibt klar und mündlich lesbar. „Mahl des Herrn“ wahrt die konkrete Bedeutung von δεῖπνον und die Zugehörigkeitsbedeutung von κυριακόν, ohne eine konfessionell geprägte Terminologie aufzudrängen.
