  source_fidelity: 'Die Grundbedeutung ist getroffen: Paulus spricht das Zusammenkommen der Gemeinde und das „Mahl des Herrn“ an. Jedoch gibt „esst ihr nicht“ die unpersönlich-komprimierte Konstruktion οὐκ ἔστιν ... φαγεῖν zu stark als bloße Tatsachenfeststellung wieder. Der griechische Wortlaut besagt im Kontext, dass unter diesen Umständen ein Essen als Mahl des Herrn nicht möglich bzw. nicht angemessen zu bezeichnen ist.'
