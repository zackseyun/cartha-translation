id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: de
  text: Denn jedes Mal, wenn ihr dieses Brot esst und aus dem Kelch trinkt,[a] verkündet ihr den Tod des Herrn, bis er kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dieses Brot esst und den Kelch trinkt“. Gemeint ist das Trinken aus dem Kelch; im Griechischen steht hier „der Kelch“, nicht „dieser Kelch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: jedes Mal, wenn
  rationale: Die Verbindung bezeichnet ein unbestimmt wiederholtes Geschehen. „Jedes Mal, wenn“ gibt den iterativen Sinn im modernen Deutschen natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet oder erläutert die vorangehende Anweisung; „denn“ ist hier die direkte und idiomatische deutsche Entsprechung.
- source_word: ἐσθίητε
  choice: ihr ... esst
  rationale: Der Präsens-Konjunktiv in der indefiniten Temporalkonstruktion wird im Deutschen natürlich mit dem Präsens wiedergegeben.
- source_word: τὸν ἄρτον τοῦτον
  choice: dieses Brot
  rationale: ἄρτος bedeutet hier „Brot“; das Demonstrativpronomen τοῦτον wird ausdrücklich mit „dieses“ wiedergegeben.
- source_word: τὸ ποτήριον πίνητε
  choice: aus dem Kelch trinkt
  rationale: Im Deutschen verlangt „trinken“ bei einem Gefäß üblicherweise „aus“. Der bestimmte Artikel des griechischen Textes bleibt erhalten; ein nicht vorhandenes Demonstrativpronomen wird nicht ergänzt.
- source_word: καταγγέλλετε
  choice: verkündet
  rationale: καταγγέλλω bezeichnet öffentliches Bekanntmachen oder Verkünden. „Verkündet“ bewahrt den feierlichen, deklarativen Sinn.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: den Tod des Herrn
  rationale: Die Genitivverbindung wird im Deutschen natürlich und würdig als „den Tod des Herrn“ wiedergegeben.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: bis er kommt
  rationale: Die Wendung bezeichnet die zeitliche Grenze. Der griechische Aorist-Konjunktiv wird in dieser deutschen Temporalkonstruktion idiomatisch mit Präsens wiedergegeben.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in ἄχρι οὗ ἔλθῃ
  choice: „er“ bezieht sich auf den Herrn Jesus.
  alternative: Das Subjekt unbestimmt lassen.
  rationale: Der unmittelbar vorausgehende „Herr“ ist der nächstliegende Bezug, und die Formulierung entspricht der paulinischen Erwartung seines Kommens.
- issue: Theologische Deutung des Herrenmahls
  choice: Die Handlungen und ihre verkündigende Bedeutung werden ohne weitergehende konfessionelle Erklärung wiedergegeben.
  alternative: Eine ausdrücklich sakramentale oder rein memorialistische Deutung in die Übersetzung aufnehmen.
  rationale: Der Vers sagt, dass Essen und Trinken den Tod des Herrn verkünden, entfaltet aber keine vollständige Abendmahlstheologie. Diese Offenheit bleibt gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jedes Mal, wenn“ ist natürlicher als das gehobenere „sooft“. „Kelch“ bewahrt den liturgischen und kontextuellen Ton, ohne eine konfessionelle Deutung hinzuzufügen.
