  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: de
  text: Wenn wir uns aber selbst richteten[a], würden wir nicht gerichtet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „prüften“. Das griechische Verb kann je nach Zusammenhang prüfen, unterscheiden oder beurteilen bedeuten. „Richteten“ bewahrt hier die Verbindung zu „gerichtet werden“ im zweiten Satzteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn … aber
  rationale: εἰ leitet die Bedingung ein, während δέ einen milden Gegensatz beziehungsweise Übergang markiert. Die deutsche Wortstellung mit „aber“ im Mittelfeld ist natürlich und bewahrt beides.
- source_word: ἑαυτοὺς
  choice: uns selbst
  rationale: Das Akkusativobjekt ist reflexiv; „uns selbst“ ist die natürliche moderne deutsche Entsprechung.
- source_word: διεκρίνομεν
  choice: beurteilten
  rationale: διακρίνω bezeichnet hier eine unterscheidende, prüfende Bewertung der eigenen Person. „Beurteilten“ bewahrt zugleich die begriffliche Verbindung zu ἐκρινόμεθα, ohne die Bedeutung vorschnell auf bloße Selbstprüfung einzuengen.
- source_word: οὐκ ἂν
  choice: würden … nicht
  rationale: Zusammen mit dem Imperfekt kennzeichnet ἄν die Folge einer irrealen Bedingung; der deutsche Konjunktiv II gibt dies idiomatisch wieder.
- source_word: ἐκρινόμεθα
  choice: würden … beurteilt
  rationale: κρίνω bezeichnet im Kontext das Gericht beziehungsweise die richtende Zurechtweisung des Herrn. „Beurteilt“ erhält die Wortverbindung zum ersten Satzteil und vermeidet die stärkere, hier nicht ausdrücklich geforderte Aussage „verurteilt“.
theological_decisions:
- issue: Ob der zweite Satzteil die endgültige Verdammnis oder ein gegenwärtiges göttliches Gericht beziehungsweise erziehende Zurechtweisung meint
  choice: Die Art des Gerichts wird nicht ausdrücklich festgelegt; übersetzt wird neutral mit „beurteilt“.
  alternative: „verurteilt“ als Hinweis auf endgültige Verdammnis
  rationale: Vers 32 unterscheidet das Gericht und die Zurechtweisung des Herrn von der Verurteilung zusammen mit der Welt. Daher sollte ἐκρινόμεθα hier nicht zu „verurteilt“ verschärft werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gebrauch von „beurteilen“ bewahrt das Wortspiel der beiden verwandten griechischen Verben; die Fußnote nennt die wichtigsten Bedeutungsalternativen.
