base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: de
  text: 'Nachdem er Dank gesagt hatte, brach er es und sagte: „Das ist mein Leib für euch[a][b]. Tut dies immer wieder zu meinem Gedenken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch zugute“, „für euch zuliebe“ oder „an eurer Stelle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften fügen „gebrochen“ hinzu: „Das ist mein Leib, der für euch gebrochen wird.“'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: Nachdem er Dank gesagt hatte
  rationale: Das vorzeitige Aoristpartizip bezeichnet eine Handlung, die dem Brechen vorausgeht. Die Formulierung ist in modernem Deutsch klar und bewahrt die zeitliche Abfolge.
- source_word: ἔκλασεν
  choice: brach er es
  rationale: Das Verb bedeutet „brechen“. Das Pronomen „es“ nimmt das Brot aus dem Zusammenhang auf und ergibt natürliches Deutsch.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Das ist mein Leib
  rationale: Die kopulative Aussage wird direkt wiedergegeben. „Bedeutet“ oder „steht für“ würde eine Deutung eintragen, die der griechische Wortlaut nicht ausdrücklich festlegt.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: der für euch ist
  rationale: Ὑπέρ mit Genitiv bezeichnet hier Nutzen beziehungsweise stellvertretenden Bezug. „Für euch“ bewahrt diese Weite, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: τοῦτο ποιεῖτε
  choice: Tut dies immer wieder
  rationale: Der Präsensimperativ kann im Einsetzungskontext eine fortgesetzte beziehungsweise wiederholte Praxis ausdrücken. „Immer wieder“ macht diesen Aspekt in natürlichem Deutsch sichtbar.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: zu meinem Gedenken
  rationale: Ἀνάμνησις bezeichnet erinnerndes Gedenken. Die gewählte Wendung ist würdig und verständlich und vermeidet eine unnötige Festlegung darauf, ob vor allem die innere Erinnerung oder der kultische Gedächtnisakt gemeint ist.
theological_decisions:
- issue: Bedeutung von „Das ist mein Leib“ im Zusammenhang des Herrenmahls
  choice: Die Aussage wird wörtlich als „Das ist mein Leib“ wiedergegeben.
  alternative: Deutende Wiedergaben wie „Das stellt meinen Leib dar“ oder eine ausdrückliche Erklärung der Gegenwartsweise.
  rationale: Der griechische Text erläutert hier nicht die Art der Beziehung zwischen Brot und Leib. Die direkte Übersetzung bewahrt die theologische Spannung, ohne eine spätere konfessionelle Position einzutragen.
- issue: Bedeutungsumfang von ὑπὲρ ὑμῶν
  choice: für euch
  alternative: euch zugute; für euch zuliebe; an eurer Stelle
  rationale: „Für euch“ umfasst den benefaktiven und möglichen stellvertretenden Bezug, ohne den knappen griechischen Ausdruck dogmatisch zu verengen.
- issue: Wiederholungsaspekt von ποιεῖτε
  choice: Tut dies immer wieder
  alternative: Tut dies
  rationale: Der Präsensimperativ lässt im Einsetzungskontext eine wiederkehrende Praxis erkennen. Die Übersetzung macht diesen Aspekt deutlich, ohne Häufigkeit oder Ritus näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib“ bleibt wegen des feierlichen Herrenmahlskontexts und der etablierten biblischen Ausdrucksweise erhalten; „Körper“ wäre zwar alltagssprachlicher, klänge hier jedoch stärker anatomisch. Die Satzstellung folgt natürlichem Deutsch, ohne die knappe Feierlichkeit der Rede aufzugeben.
