source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: de
  text: Habt ihr denn keine Häuser, um zu essen und zu trinken? Oder verachtet ihr die Gemeinde Gottes und beschämt die, die nichts haben[a]? Was soll ich euch sagen? Soll ich euch loben? Darin lobe ich euch nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Armen“ oder „die nichts zu essen haben“; wörtlich: „die, die nicht haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: Häuser
  rationale: Bezeichnet private häusliche Räume im Gegensatz zur versammelten Gemeinde; „Häuser“ bewahrt diesen Kontrast unmittelbar.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: um zu essen und zu trinken
  rationale: Die Konstruktion bezeichnet den Zweck; die deutsche Infinitivgruppe gibt ihn natürlich und genau wieder.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: Gemeinde Gottes
  rationale: Im paulinischen Zusammenhang ist die Gott gehörende versammelte Gemeinschaft gemeint; „Gemeinde“ ist im modernen Deutsch klar, ohne unnötig eine Institution zu betonen.
- source_word: καταφρονεῖτε
  choice: verachtet
  rationale: Bewahrt die moralische Schärfe des Verbs, das eine geringschätzige Behandlung bezeichnet.
- source_word: καταισχύνετε
  choice: beschämt
  rationale: Gibt das Verursachen von Scham knapp und unmittelbar wieder, ohne die Intensität interpretierend zu steigern.
- source_word: τοὺς μὴ ἔχοντας
  choice: die, die nichts haben
  rationale: Folgt dem offenen griechischen Ausdruck „die Nicht-Habenden“ und lässt den Kontext erkennen, dass materiell Bedürftige beziehungsweise Menschen ohne ausreichende Speise gemeint sind.
- source_word: τί εἴπω ὑμῖν;
  choice: Was soll ich euch sagen?
  rationale: Gibt den deliberativen Konjunktiv als natürliche rhetorische Frage im Deutschen wieder.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Soll ich euch loben?
  rationale: Bewahrt die rhetorische Frage und ihren erwarteten negativen Sinn.
- source_word: ἐν τούτῳ
  choice: Darin
  rationale: Verweist knapp auf das unmittelbar behandelte Verhalten und klingt im Deutschen natürlicher als „in diesem“.
- source_word: οὐκ ἐπαινῶ
  choice: lobe ich euch nicht
  rationale: Die Wiederholung von „loben“ bildet die Wiederholung von ἐπαινέσω/ἐπαινῶ und damit die rhetorische Zuspitzung nach.
theological_decisions:
- issue: Bezug von τοὺς μὴ ἔχοντας im Zusammenhang des Herrenmahls
  choice: die, die nichts haben
  alternative: die Armen; die nichts zu essen haben
  rationale: Der Zusammenhang weist deutlich auf materiell benachteiligte Gemeindeglieder hin, doch der griechische Ausdruck bleibt wörtlich weiter. Der Haupttext erhält diese Offenheit; die Fußnote nennt die sachlich möglichen engeren Wiedergaben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter rhetorischer Schärfe. Die parallelen Fragen und die Wiederholung von „loben“ bleiben erhalten; „Gemeinde Gottes“ vermeidet eine unnötig institutionelle Verengung.
