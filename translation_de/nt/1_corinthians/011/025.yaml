id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: de
  text: 'Ebenso nahm er nach dem Essen auch den Becher und sagte: »Dieser Becher ist der neue Bund[a] in meinem Blut. Tut dies immer wieder, sooft ihr daraus trinkt[b], zur Erinnerung an mich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das neue Testament«. Das griechische Wort kann »Bund« oder »Testament« bedeuten; hier entspricht »Bund« am besten dem biblischen Hintergrund.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich auch möglich: »sooft ihr trinkt«. Der Becher als Bezug des Trinkens ist im Griechischen unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ τὸ ποτήριον
  choice: Ebenso nahm er … auch den Becher
  rationale: ὡσαύτως καί stellt die Entsprechung zur vorausgehenden Handlung mit dem Brot her. Das im Griechischen elliptisch ausgesparte Verb wird aus dem unmittelbaren Parallelzusammenhang als „nahm er“ ergänzt, damit der deutsche Satz vollständig und natürlich ist.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: nach dem Essen
  rationale: Die Konstruktion mit μετά und substantiviertem Infinitiv bezeichnet den Zeitpunkt nach der Mahlzeit. „Nach dem Essen“ ist im heutigen Deutsch klar und näher am Verb δειπνέω als das stärker traditionssprachliche „nach dem Mahl“.
- source_word: ποτήριον
  choice: Becher
  rationale: „Becher“ gibt den gewöhnlichen Gegenstand ohne einen vom Griechischen nicht geforderten liturgischen Beiklang wieder. „Kelch“ wäre in diesem Zusammenhang vertraut, ist aber register- und traditionsgebundener.
- source_word: ἡ καινὴ διαθήκη
  choice: der neue Bund
  rationale: διαθήκη bezeichnet hier vor dem Hintergrund des biblischen Bundesmotivs den neuen Bund. „Testament“ ist zwar traditionsgeschichtlich möglich, wird im modernen Deutsch jedoch leicht als letztwillige Verfügung verstanden.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: in meinem Blut
  rationale: Die Wiedergabe mit „in“ wahrt die knappe Formulierung und legt nicht aus, ob die Präposition instrumental („durch“) oder in einem anderen Sinn zu verstehen ist.
- source_word: τοῦτο ποιεῖτε
  choice: Tut dies immer wieder
  rationale: Der Präsensimperativ kann eine fortgesetzte oder wiederholte Praxis bezeichnen; „immer wieder“ macht diesen Aspekt zusammen mit dem folgenden Wiederholungssatz im Deutschen sichtbar.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: sooft ihr daraus trinkt
  rationale: Die Wendung bezeichnet wiederkehrende Gelegenheiten. „Daraus“ nimmt den Becher idiomatisch auf; ein ausdrückliches Objekt steht im Griechischen nicht.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: zur Erinnerung an mich
  rationale: ἀνάμνησις bezeichnet erinnerndes Gedenken. Die Formulierung ist im heutigen Deutsch verständlich und lässt den aktiven Gedächtnischarakter erkennen.
theological_decisions:
- issue: Bedeutung von διαθήκη im Einsetzungswort
  choice: Bund
  alternative: Testament
  rationale: Der Zusammenhang von Bund und Blut sowie der alttestamentliche Hintergrund sprechen für „Bund“. Die alternative traditionssprachliche Wiedergabe wird in einer Fußnote genannt, ohne sie in den Haupttext einzutragen.
- issue: Verhältnis des Bechers zum neuen Bund
  choice: Die direkte Aussage „Dieser Becher ist der neue Bund in meinem Blut“ bleibt erhalten.
  alternative: „Dieser Becher steht für den neuen Bund“ oder „Dieser Becher ist der durch mein Blut eingesetzte neue Bund“
  rationale: Der griechische Text formuliert eine direkte Identifikation und erklärt weder symbolisch noch ontologisch, wie sie zu verstehen ist. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Sinn der Gedächtnishandlung
  choice: „zur Erinnerung an mich“
  alternative: „als mein Gedächtnismahl“
  rationale: Die gewählte Formulierung gibt den Zweck der wiederholten Handlung wieder, ohne eine bestimmte konfessionelle Deutung des Mahls vorwegzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Anrede im Plural („ihr“) und die direkte Rede bleiben erhalten. Traditionssprachliche Ausdrücke wie „Kelch“ und „zu meinem Gedächtnis“ wurden zugunsten allgemein verständlicher Formulierungen vermieden; die für die Abendmahlsdeutung entscheidende direkte Aussage wurde jedoch nicht paraphrasiert.
