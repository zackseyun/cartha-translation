review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes zuverlässig wieder: die Entsprechung zur vorigen Brot-Handlung (ὡσαύτως καί), den zeitlichen Anschluss nach dem Mahl, den Becher, die direkte Bundes-Aussage, die wiederholte Aufforderung und den Zweck des Erinnerns. Das ergänzte „nahm er“ ist wegen der griechischen Ellipse und des unmittelbaren Parallelkontexts gerechtfertigt. „Daraus trinkt“ macht das im Griechischen unausgesprochene, aber kontextuell eindeutige Bezugsobjekt idiomatisch sichtbar.'
  naturalness: „Ebenso nahm er nach dem Essen auch den Becher und sagte“ ist modernes, verständliches Standarddeutsch. „Becher“, „nach dem Essen“, „sooft ihr daraus trinkt“ und „zur Erinnerung an mich“ sind natürlich und vermeiden unnötig liturgische oder altertümliche Sprache. Der würdige Ton der Einsetzungsworte bleibt gewahrt.
  terminology: „Der neue Bund“ ist für διαθήκη im vorliegenden biblischen Kontext die sachgerechte Hauptwiedergabe. Die Fußnote vermerkt „Testament“ angemessen als mögliche, aber im heutigen Deutsch leicht missverständliche Alternative. „In meinem Blut“ bewahrt die offene Formulierung des Griechischen und legt keine konfessionelle Sakramentsdeutung fest.
