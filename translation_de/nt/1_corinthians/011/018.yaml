source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: de
  text: Denn zunächst höre ich, wenn ihr als Gemeinde zusammenkommt[a], dass es unter euch Spaltungen gibt, und zum Teil glaube ich es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Gemeinde“ oder „in der Versammlung“. Das griechische Wort bezeichnet hier die zusammengekommene Gemeinde, nicht eigens ein Gebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν γὰρ
  choice: Denn zunächst
  rationale: „Denn“ bewahrt den begründenden Anschluss, während „zunächst“ den ersten Punkt der Argumentation markiert, ohne eine im Griechischen nicht ausgeführte formale Aufzählung zu erzwingen.
- source_word: συνερχομένων ὑμῶν
  choice: wenn ihr … zusammenkommt
  rationale: Der Genitivus absolutus wird seinem zeitlichen Sinn entsprechend natürlich wiedergegeben.
- source_word: ἐν ἐκκλησίᾳ
  choice: als Gemeinde
  rationale: Gemeint ist die versammelte Gemeinde, nicht ein Kirchengebäude. „Als Gemeinde“ drückt den gemeinschaftlichen Charakter idiomatisch aus.
- source_word: ἀκούω
  choice: höre ich
  rationale: Das Präsens und der Charakter einer Paulus zugetragenen Nachricht bleiben erhalten.
- source_word: σχίσματα
  choice: Spaltungen
  rationale: Der Ausdruck bezeichnet Risse beziehungsweise Trennungen innerhalb der Gemeinschaft, ohne zwingend fest organisierte Parteien vorauszusetzen.
- source_word: ἐν ὑμῖν ὑπάρχειν
  choice: dass es unter euch … gibt
  rationale: Diese idiomatische deutsche Existenzkonstruktion gibt den AcI mit ὑπάρχειν klar wieder.
- source_word: καὶ μέρος τι πιστεύω
  choice: und zum Teil glaube ich es
  rationale: Die Formulierung bewahrt Paulus’ eingeschränkte Zustimmung zum Gehörten und löst die verbleibende Spannung nicht weiter auf.
theological_decisions:
- issue: Bedeutung von ἐκκλησία im Zusammenhang
  choice: die konkret versammelte Gemeinde („als Gemeinde“)
  alternative: „in der Gemeinde“ oder „in der Versammlung“
  rationale: Der Zusammenhang handelt vom Zusammenkommen der korinthischen Christen zum gemeinsamen Mahl. Die Übersetzung vermeidet sowohl eine Beschränkung auf ein Gebäude als auch eine rein institutionelle Deutung.
- issue: Reichweite von καὶ μέρος τι πιστεύω
  choice: Paulus glaubt die Meldung nur zum Teil
  alternative: Paulus glaubt, dass sie zumindest teilweise zutrifft
  rationale: Die knappe griechische Aussage lässt offen, ob die Einschränkung den Wahrheitsgrad der Meldung oder das Ausmaß der Spaltungen betrifft; der Haupttext bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die Meldung über die Spaltungen in den Vordergrund; „als Gemeinde zusammenkommt“ ist im Deutschen natürlich und erklärt den Versammlungscharakter ohne konfessionelle Zusatzdeutung.
