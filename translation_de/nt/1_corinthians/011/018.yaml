  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente zuverlässig wieder: den begründenden Anschluss (γάρ), die einleitende Rangfolge (πρῶτον μέν), das Zusammenkommen der Gemeinde, die berichteten Spaltungen und Paulus'' eingeschränktes Für-wahr-Halten. In der vorliegenden deutschen Satzstellung kann der Nebensatz „wenn ihr ... zusammenkommt“ jedoch zunächst an „höre ich“ statt an die berichtete Existenz der Spaltungen anschließen. Eine Voranstellung bildet den griechischen Zusammenhang eindeutiger ab.'
  naturalness: „Denn zunächst höre ich, wenn ihr als Gemeinde zusammenkommt, dass es unter euch Spaltungen gibt“ ist modernes, gut verständliches Standarddeutsch und bewahrt die Reihenfolge der Aussage. „Zum Teil glaube ich es“ ist idiomatisch und lässt die griechische Reichweite der Einschränkung offen.
  terminology: „Spaltungen“ ist für σχίσματα treffend. „Als Gemeinde“ vermittelt ἐν ἐκκλησίᾳ im Sinn der versammelten Gemeinschaft ohne Gebäudebedeutung oder konfessionelle Festlegung. Die Fußnote sollte nicht mit „Wörtlich auch“ eingeleitet werden, weil sie Alternativübersetzungen, nicht durchweg wörtliche Wiedergaben, bietet.
