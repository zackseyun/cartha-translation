  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: de
  text: Darum, meine Brüder[a], wenn ihr zusammenkommt, um zu essen, wartet aufeinander.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Brüder und Schwestern“. Im Griechischen steht „Brüder“; die maskuline Form kann eine gemischte Gemeinde anreden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nehmt einander auf“. Das griechische Verb kann sowohl „warten auf“ als auch „empfangen/aufnehmen“ bedeuten; der Zusammenhang legt hier „warten“ nahe.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ὥστε
  choice: Darum
  rationale: Die folgernde Konjunktion zieht aus der vorausgehenden Zurechtweisung eine praktische Konsequenz. „Darum“ gibt diese Schlussfolgerung natürlich und knapp wieder.
- source_word: ἀδελφοί μου
  choice: meine Brüder
  rationale: Der griechische Vokativ ist grammatisch maskulin und lautet wörtlich „meine Brüder“. Im gemeindlichen Kontext kann er Frauen einschließen; dies wird in einer Fußnote erläutert.
- source_word: συνερχόμενοι
  choice: wenn ihr zusammenkommt
  rationale: Das adverbial gebrauchte Partizip bezeichnet den Umstand, unter dem die Aufforderung gilt, und knüpft an die wiederholte Sprache vom Zusammenkommen in diesem Kapitel an.
- source_word: εἰς τὸ φαγεῖν
  choice: um zu essen
  rationale: Die Präposition mit substantiviertem Infinitiv drückt hier den Zweck des Zusammenkommens aus. Die deutsche Infinitivgruppe bildet dies klar und idiomatisch ab.
- source_word: ἀλλήλους
  choice: aufeinander
  rationale: Das reziproke Pronomen wird zusammen mit „warten“ im Deutschen idiomatisch durch „aufeinander“ wiedergegeben.
- source_word: ἐκδέχεσθε
  choice: wartet
  rationale: Angesichts dessen, dass einige vor den anderen aßen (Vers 21), ist „warten“ die wahrscheinlichste kontextuelle Bedeutung. Die ebenfalls mögliche Bedeutung „empfangen/aufnehmen“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Repräsentativ maskuline Anrede ἀδελφοί
  choice: „meine Brüder“ im Haupttext mit Hinweis auf die mögliche Einbeziehung von Frauen
  alternative: „meine Brüder und Schwestern“
  rationale: Die Form des Ausgangstextes bleibt erkennbar, ohne ihre im frühchristlichen Gemeindegebrauch wahrscheinlich inklusive Reichweite zu verschweigen.
- issue: Bedeutung von ἐκδέχεσθε beim Herrenmahl
  choice: „wartet aufeinander“
  alternative: „nehmt einander auf“ oder „empfangt einander“
  rationale: Der unmittelbare Zusammenhang mit dem voreiligen Essen einiger Gemeindeglieder stützt „warten“. Da das Verb auch „empfangen/aufnehmen“ bedeuten kann, wird die lexikalische Spannung nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der Doppelpunkt markiert den Übergang von der persönlichen Anrede zur abschließenden Aufforderung.
