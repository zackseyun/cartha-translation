source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: de
  text: Jede Frau aber, die mit unbedecktem Kopf betet oder prophezeit, entehrt ihren Kopf[a][b]; denn das ist ein und dasselbe, als wäre sie kahl geschoren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jede Ehefrau, die … entehrt ihren Mann beziehungsweise ihr Haupt.« Das griechische Wort gynē kann »Frau« oder »Ehefrau« bedeuten; »Kopf/Haupt« kann hier wörtlich oder im Licht des Zusammenhangs übertragen verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: »Unbedeckt« legt nicht fest, um welche Art von Bedeckung es geht. Umstritten ist, ob Paulus insbesondere einen Schleier oder allgemeiner einen unbedeckten Kopf beziehungsweise eine bestimmte Haartracht meint.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: Frau
  rationale: γυνή kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten. Die allgemeine Formulierung »jede Frau« wird im Haupttext beibehalten; die mögliche Bedeutung »Ehefrau« wird in einer Fußnote genannt.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: die … betet oder prophetisch redet
  rationale: Die präsentischen Partizipien bezeichnen Tätigkeiten, die sie ausübt. Der deutsche Relativsatz ist natürlich und gibt beide Handlungen klar wieder; »prophetisch reden« ist verständlicher als das weniger alltägliche »prophezeien«.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: mit unbedecktem Kopf
  rationale: Die Dativfügung beschreibt den Zustand beziehungsweise Begleitumstand. »Unbedeckt« legt nicht fest, ob Paulus einen Schleier, eine andere Bedeckung oder eine bestimmte Haartracht meint.
- source_word: καταισχύνει
  choice: entehrt
  rationale: Das Verb bezeichnet Beschämung beziehungsweise Schande. »Entehrt« passt zum sozialen Ehr- und Schandkontext und lässt sich im Deutschen sowohl auf den wörtlichen als auch auf einen übertragenen »Kopf« beziehen.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: ihren Kopf
  rationale: 'Die wörtliche Wiedergabe erhält die im Zusammenhang bestehende Mehrdeutigkeit: Gemeint sein kann ihr eigener physischer Kopf oder ihr »Haupt« im übertragenen Sinn.'
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: denn das ist ein und dasselbe
  rationale: Die Wendung betont die Gleichsetzung. Die deutsche Formulierung bewahrt diesen Nachdruck.
- source_word: τῇ ἐξυρημένῃ
  choice: als wäre sie kahl geschoren
  rationale: Das substantivierte Perfektpartizip bezeichnet eine Frau im Ergebniszustand des Geschorenseins. »Kahl geschoren« macht im Deutschen deutlich, dass das Scheren des Kopfes gemeint ist.
theological_decisions:
- issue: Bedeutung des zweiten κεφαλή in »entehrt ihren Kopf«
  choice: Die mehrdeutige Formulierung »ihren Kopf« bleibt im Haupttext erhalten.
  alternative: Ihr physischer Kopf; oder ihr »Haupt«, also im Rahmen der Argumentation möglicherweise ihr Mann beziehungsweise Ehemann.
  rationale: Der unmittelbare Wortlaut lässt die körperliche Bedeutung zu, während der weitere Zusammenhang eine übertragene relationale Bedeutung nahelegen kann. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
- issue: Art der Bedeckung
  choice: Allgemein mit »unbedeckt« wiedergeben.
  alternative: Ohne Schleier; oder mit offenem beziehungsweise aufgelöstem Haar.
  rationale: Das griechische Adjektiv bezeichnet den unbedeckten Zustand, bestimmt aber nicht ausdrücklich, worin die Bedeckung besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Prophetisch redet« ist für heutige Leser unmittelbar verständlich. Die Formulierung wahrt sowohl die lexikalische Mehrdeutigkeit von γυνή und κεφαλή als auch die Offenheit hinsichtlich der konkreten Kopfbedeckung.
