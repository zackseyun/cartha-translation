  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: de
  text: Lehrt euch nicht einmal die Natur selbst[b], dass es für einen Mann eine Schande ist, wenn er langes Haar trägt[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn er sein Haar lang wachsen lässt«; auch möglich: »wenn er langes Haar hat«. Das griechische Verb bezeichnet das Tragen beziehungsweise Haben von langem Haar.'
    reason: lexical_alternative
  - marker: b
    text: »Die Natur selbst« kann sich auf die Schöpfungsordnung, auf allgemeines menschliches Empfinden oder auf das beziehen, was eine Kultur als von Natur aus angemessen ansieht. Der griechische Text legt dies hier nicht genauer fest.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Lehrt ... nicht schon
  rationale: Gibt die verneinte rhetorische Frage samt ihrer verstärkenden und weiterführenden Kraft in natürlichem Deutsch wieder.
- source_word: ἡ φύσις αὐτὴ
  choice: die Natur selbst
  rationale: Bewahrt die ausdrückliche Hervorhebung durch αὐτή und lässt offen, ob Schöpfungsordnung, allgemeines Empfinden oder kulturell geprägte Angemessenheit gemeint ist.
- source_word: διδάσκει ὑμᾶς
  choice: lehrt euch
  rationale: Entspricht unmittelbar dem didaktischen Sinn des griechischen Verbs und ist im Deutschen verständlich und würdig.
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: Hier geht es um den Gegensatz zwischen Mann und Frau, nicht eigens um die Rolle als Ehemann.
- source_word: μέν
  choice: nicht eigens wiedergegeben
  rationale: Das Wort kündigt den im folgenden Vers fortgesetzten Gegensatz an; eine ausdrückliche Wiedergabe wie »einerseits« wäre in diesem Einzelvers schwerfällig.
- source_word: ἐὰν κομᾷ
  choice: wenn er langes Haar trägt
  rationale: Das Verb bezeichnet, langes Haar zu tragen beziehungsweise das Haar lang wachsen zu lassen; die gewählte Formulierung ist knapp und idiomatisch.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: es für einen Mann eine Schande ist
  rationale: Gibt die Aussage über Unehre oder Schande idiomatisch wieder, ohne ihre soziale und wertende Kraft abzuschwächen.
theological_decisions:
- issue: Bedeutung von φύσις in der Argumentation des Paulus
  choice: »die Natur selbst« ohne nähere Festlegung
  alternative: Schöpfungsordnung; allgemeines menschliches Empfinden; kulturell geprägte Vorstellung dessen, was als natürlich passend gilt
  rationale: Der griechische Ausdruck legt hier nicht eindeutig fest, welcher dieser Aspekte gemeint ist. Die Übersetzung bewahrt diese Auslegungsspannung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die rhetorische Frage bleibt erhalten; die Mehrdeutigkeit von »Natur« wird nicht im Haupttext aufgelöst.
