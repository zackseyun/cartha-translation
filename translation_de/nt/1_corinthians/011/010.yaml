id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: de
  text: Deshalb soll die Frau Vollmacht auf ihrem Kopf haben[a] – wegen der Engel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker deutend: „Deshalb soll die Frau ein Zeichen der Vollmacht auf ihrem Kopf tragen.“ Im Griechischen steht „Vollmacht“; von einem „Zeichen“ oder einer „Bedeckung“ ist nicht ausdrücklich die Rede.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wegen der Boten“; „Engel“ ist hier jedoch wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: Gibt den folgernden Zusammenhang knapp und natürlich wieder.
- source_word: ὀφείλει
  choice: soll
  rationale: Drückt eine aus der Argumentation folgende Verpflichtung aus, ohne sie unnötig als absoluten Gesetzesbefehl zu verschärfen.
- source_word: ἡ γυνὴ
  choice: die Frau
  rationale: Bewahrt den generischen Singular und engt γυνή nicht ohne zwingenden Grund auf „Ehefrau“ ein.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Gibt den griechischen Begriff selbst wieder, ohne die im Text nicht ausdrücklich genannten Wörter „Zeichen“ oder „Bedeckung“ einzufügen.
- source_word: ἔχειν
  choice: haben
  rationale: Entspricht unmittelbar dem Infinitiv; „tragen“ wäre bereits eine kontextuelle Deutung.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: auf ihrem Kopf
  rationale: Bewahrt die räumliche Formulierung und deren ungewöhnliche Offenheit.
- source_word: διὰ τοὺς ἀγγέλους
  choice: wegen der Engel
  rationale: διά mit Akkusativ bezeichnet hier den Grund; ἄγγελοι meint wahrscheinlich himmlische Engel, kann lexikalisch aber auch Boten bezeichnen.
theological_decisions:
- issue: Bedeutung von ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: „Vollmacht auf ihrem Kopf haben“ im Haupttext beibehalten
  alternative: „ein Zeichen der Vollmacht auf ihrem Kopf tragen“ beziehungsweise „eine Kopfbedeckung als Zeichen der Vollmacht tragen“
  rationale: Der griechische Wortlaut enthält weder „Zeichen“ noch „Bedeckung“. Die schwer verständliche und umstrittene Formulierung wird daher nicht stillschweigend aufgelöst.
- issue: Referent von ἀγγέλους
  choice: Engel
  alternative: Boten
  rationale: Der unqualifizierte Plural bezeichnet im paulinischen Sprachgebrauch eher himmlische Wesen; die lexikalische Alternative bleibt in einer Fußnote sichtbar.
- issue: Bedeutungsumfang von γυνή
  choice: Frau
  alternative: Ehefrau
  rationale: Der größere Zusammenhang behandelt Mann und Frau repräsentativ; eine Beschränkung auf verheiratete Frauen ist hier nicht zwingend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung des griechischen Textes bleibt im Haupttext bewusst erhalten; der Gedankenstrich macht den abschließenden Begründungszusatz lesbar, ohne ihn auszudeuten.
