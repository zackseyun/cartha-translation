id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: de
  text: Denn wenn eine Frau ihr Haupt nicht bedeckt[a], soll sie sich auch das Haar abschneiden lassen. Wenn es aber für eine Frau eine Schande ist, sich das Haar abschneiden oder sich den Kopf kahl scheren zu lassen, soll sie ihr Haupt bedecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ehefrau« im ganzen Vers. Das griechische Wort gynē kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: ihr Haupt nicht bedeckt / soll sie ihr Haupt bedecken
  rationale: Das Verb bezeichnet ein Bedecken oder Verhüllen. Das im Kontext vorausgesetzte Haupt wird im Deutschen ausdrücklich genannt, ohne eine bestimmte Art der Bedeckung festzulegen.
- source_word: γυνή
  choice: Frau
  rationale: γυνή kann »Frau« oder »Ehefrau« bedeuten. Da der Vers keinen Ehemann ausdrücklich erwähnt und allgemein formuliert ist, wahrt »Frau« den weiteren möglichen Bezug; die Alternative steht in der Fußnote.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: sich das Haar abschneiden lassen
  rationale: Das Verb bezeichnet das Scheren beziehungsweise kurze Abschneiden des Haars. Die Formulierung ist natürliches heutiges Deutsch und hält den Unterschied zum anschließenden Kahlscheren aufrecht.
- source_word: καί
  choice: auch
  rationale: '»Auch« bewahrt die rhetorische Folgerung: Wer auf die Bedeckung verzichtet, soll ebenso den weiteren Schritt hinnehmen.'
- source_word: αἰσχρόν
  choice: eine Schande
  rationale: Die Wendung gibt die soziale Ehr- und Schanddimension des griechischen Ausdrucks idiomatisch und mit angemessener Stärke wieder.
- source_word: ξυρᾶσθαι
  choice: sich den Kopf kahl scheren zu lassen
  rationale: Das Verb bezeichnet Rasieren beziehungsweise Kahlscheren. »Den Kopf« verdeutlicht im Deutschen den kontextuell gemeinten Bezug und unterscheidet die Handlung klar vom bloßen Abschneiden des Haars.
- source_word: γὰρ ... δέ
  choice: Denn ... aber
  rationale: Die Konjunktionen markieren Begründung und Gegenüberstellung im Gedankengang des Paulus.
theological_decisions:
- issue: Bedeutung von γυνή als Frau oder Ehefrau
  choice: Frau
  alternative: Ehefrau
  rationale: Der unmittelbare Vers erwähnt keinen Ehemann und lässt eine allgemeine Aussage über Frauen zu. »Frau« vermeidet daher eine unbegründete Einengung; die kontextuell mögliche eheliche Bedeutung wird in einer Fußnote erhalten.
- issue: Art der in κατακαλύπτω gemeinten Bedeckung
  choice: das Haupt bedecken
  alternative: sich verhüllen / verschleiert sein
  rationale: Der Kontext legt eine Bedeckung des Hauptes nahe, bestimmt aber hier weder Kleidungsstück noch genaue Form. Die Übersetzung macht den impliziten Körperteil deutlich, ohne eine besondere Schleierform vorzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haupt« wird statt des alltäglicheren »Kopf« bei der Bedeckung verwendet, weil es den biblischen Diskussionszusammenhang präzise und ohne Festlegung auf ein bestimmtes Kleidungsstück wiedergibt; beim Kahlscheren ist »Kopf« idiomatischer. Die Parallelität der beiden Bedingungssätze und die argumentative Folge werden bewahrt.
