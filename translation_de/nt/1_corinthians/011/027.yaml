id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: de
  text: Wer daher in unwürdiger Weise[a] das Brot isst oder den Kelch des Herrn trinkt, wird sich am Leib und Blut des Herrn schuldig machen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In unwürdiger Weise“ gibt ein Adverb wieder und beschreibt, wie jemand isst oder trinkt, nicht den Wert der Person an sich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wird des Leibes und Blutes des Herrn schuldig sein“. Die griechische Konstruktion bezeichnet Schuld oder Haftbarkeit in Bezug auf Leib und Blut des Herrn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: daher
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Erörterung des Herrenmahls und klingt im modernen Standarddeutsch natürlich.
- source_word: ὃς ἂν
  choice: wer
  rationale: Das Relativpronomen mit ἄν hat verallgemeinernden Sinn; „wer“ gibt diese offene Bedingung idiomatisch wieder.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: das Brot isst
  rationale: Bewahrt den bestimmten Artikel und den Bezug auf das zuvor behandelte Brot des Herrenmahls.
- source_word: ἢ
  choice: oder
  rationale: Gibt die ausdrücklich disjunktive Konjunktion wieder, ohne sie traditionsbedingt zu „und“ anzugleichen.
- source_word: πίνῃ τὸ ποτήριον τοῦ κυρίου
  choice: den Kelch des Herrn trinkt
  rationale: Bewahrt die im Griechischen übliche metonymische Rede vom Trinken des Kelches und den Genitiv der Zugehörigkeit.
- source_word: ἀναξίως
  choice: in unwürdiger Weise
  rationale: Die adverbiale Form beschreibt die Art und Weise des Essens oder Trinkens, nicht den inneren Wert der teilnehmenden Person. Die Voranstellung lässt den Ausdruck eindeutig für beide Verben gelten.
- source_word: ἔνοχος ἔσται
  choice: wird sich … schuldig machen
  rationale: Drückt die zukünftige Schuld beziehungsweise Haftbarkeit in natürlichem, ernstem Deutsch aus.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: am Leib und Blut des Herrn
  rationale: Die deutsche Verbindung „sich an etwas schuldig machen“ gibt den Genitiv bei ἔνοχος sachgerecht wieder, ohne die genaue rechtliche Nuance übermäßig festzulegen.
theological_decisions:
- issue: Bedeutung von ἀναξίως beim Herrenmahl
  choice: Der Vers verurteilt das Essen oder Trinken in unwürdiger Weise.
  alternative: Der Vers bezeichne die teilnehmende Person selbst als unwürdig.
  rationale: ἀναξίως ist ein Adverb und bestimmt die Verben „isst“ und „trinkt“. Die Übersetzung macht diesen grammatischen Bezug deutlich, ohne spätere Lehren über die persönliche Würdigkeit einzutragen.
- issue: Bedeutung von ἢ zwischen Essen und Trinken
  choice: Die Warnung gilt, wenn eine der beiden Handlungen in unwürdiger Weise geschieht.
  alternative: Essen und Trinken seien als festes Paar mit dem Sinn von „und“ wiederzugeben.
  rationale: Der griechische Text verwendet die disjunktive Konjunktion ἢ; die Übersetzung bewahrt diese Spannung gegenüber liturgischer oder übersetzerischer Tradition.
- issue: Schuld hinsichtlich Leib und Blut des Herrn
  choice: „sich am Leib und Blut des Herrn schuldig machen“
  alternative: „des Leibes und Blutes des Herrn schuldig sein“ oder „hinsichtlich des Leibes und Blutes des Herrn schuldig sein“
  rationale: Die gewählte deutsche Fügung wahrt die ernste Aussage persönlicher Schuld und lässt zugleich offen, wie die Beziehung zu Leib und Blut im Einzelnen theologisch zu bestimmen ist.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzstellung stellt sicher, dass „in unwürdiger Weise“ sowohl das Essen als auch das Trinken bestimmt. Der traditionelle Ausdruck „sich an etwas schuldig machen“ bleibt allgemein verständlich und bewahrt den feierlich-ernsten Ton.
