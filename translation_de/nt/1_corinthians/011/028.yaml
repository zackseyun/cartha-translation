source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: de
  text: Jeder aber prüfe sich selbst, und so esse er von dem Brot und trinke aus dem Kelch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος
  choice: jeder
  rationale: ἄνθρωπος bezeichnet hier allgemein den einzelnen Menschen, nicht spezifisch einen Mann. „Jeder“ gibt den distributiven Sinn im natürlichen modernen Deutsch wieder; „sich selbst“ bewahrt den Singularbezug.
- source_word: δοκιμαζέτω
  choice: prüfe
  rationale: Der Imperativ bezeichnet ein prüfendes Beurteilen der eigenen Person. „Prüfen“ bewahrt diese Bedeutung, ohne eine bestimmte Methode der Selbstprüfung hinzuzufügen.
- source_word: οὕτως
  choice: so
  rationale: „So“ erhält den Bezug auf die vorausgehende Selbstprüfung und lässt offen, ob vor allem die Weise oder die daraus folgende Voraussetzung des Essens und Trinkens gemeint ist.
- source_word: ἐκ τοῦ ἄρτου … ἐκ τοῦ ποτηρίου
  choice: von dem Brot … aus dem Kelch
  rationale: 'Die wiederholte Präposition ἐκ wird in idiomatischem Deutsch passend differenziert wiedergegeben: Man isst „von dem Brot“ und trinkt „aus dem Kelch“.'
theological_decisions:
- issue: Reichweite von ἄνθρωπος
  choice: geschlechtsübergreifend „jeder“
  alternative: „ein Mensch“ oder „ein Mann“
  rationale: Der griechische Ausdruck ist im Kontext generisch und richtet die Aufforderung an jede teilnehmende Person. Eine ausschließlich männliche Wiedergabe würde den möglichen Adressatenkreis unnötig verengen.
- issue: Verhältnis von Selbstprüfung und Teilnahme
  choice: „und so esse er … und trinke“
  alternative: „erst dann soll er …“
  rationale: Die Übersetzung bewahrt die knappe Verbindung des Griechischen und fügt weder ein ausdrückliches zeitliches „erst dann“ noch ein Verbot der Teilnahme hinzu.
translation_notes:
  register: Klares, würdiges Standarddeutsch. Der auffordernde dritte-Person-Imperativ wird mit „prüfe“ und „esse/trinke er“ formal bewahrt; die Satzstellung folgt dem griechischen Gedankengang, bleibt aber natürlich verständlich.
