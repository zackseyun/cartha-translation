id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: de
  text: Denn wie die Frau vom Mann stammt[a], so kommt auch der Mann durch die Frau; alles aber kommt von Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ehefrau« und »Ehemann«, wenn der Zusammenhang enger auf die eheliche statt allgemein auf die Beziehung zwischen Frau und Mann bezogen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: Gibt die begründende Funktion von γάρ und die mit ὥσπερ eingeleitete Entsprechung in natürlichem Deutsch wieder.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: γυνή kann »Frau« oder »Ehefrau« bedeuten. Der Bezug auf Schöpfung und Geburt spricht hier für den allgemeinen Sinn.
- source_word: ἐκ τοῦ ἀνδρός
  choice: vom Mann stammt
  rationale: ἐκ bezeichnet Herkunft oder Ursprung. »stammt vom Mann« macht den Schöpfungsbezug verständlich und bewahrt den Ursprungssinn.
- source_word: ὁ ἀνήρ
  choice: der Mann
  rationale: ἀνήρ kann »Mann« oder »Ehemann« bedeuten; die allgemeine, wechselseitige Aussage legt hier »Mann« nahe.
- source_word: διὰ τῆς γυναικός
  choice: durch die Frau
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Mittel. Die Formulierung wahrt den Unterschied zu ἐκ und verweist darauf, dass der Mann durch eine Frau zur Welt kommt.
- source_word: τὰ δὲ πάντα
  choice: alles aber
  rationale: δέ markiert hier einen leichten Gegensatz beziehungsweise eine weiterführende Wendung; »alles aber« leitet zum umfassenden göttlichen Ursprung über.
- source_word: ἐκ τοῦ θεοῦ
  choice: kommt von Gott
  rationale: ἐκ bezeichnet erneut den Ursprung. »kommt von Gott« ist idiomatisch und erhält die abschließende Aussage, dass Gott der letzte Ursprung von allem ist.
theological_decisions:
- issue: Bedeutung von γυνή und ἀνήρ
  choice: allgemein »Frau« und »Mann«
  alternative: »Ehefrau« und »Ehemann«
  rationale: Die Verbindung von Schöpfungsursprung und menschlicher Geburt reicht über die Ehebeziehung eines einzelnen Paares hinaus. Die Fußnote bewahrt dennoch die lexikalisch mögliche engere Deutung.
- issue: Unterschied zwischen ἐκ und διά
  choice: »vom Mann stammt« gegenüber »durch die Frau«
  alternative: beide Beziehungen einheitlich mit »von« wiedergeben
  rationale: Die Übersetzung erhält die Unterscheidung zwischen Ursprung in der Schöpfung und Vermittlung bei der Geburt und damit die wechselseitige Spannung des Textes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Satzstruktur wird bewahrt; »stammt« verdeutlicht beim ersten ἐκ den Schöpfungsursprung, während »durch« die andere Präposition ausdrücklich erhält.
