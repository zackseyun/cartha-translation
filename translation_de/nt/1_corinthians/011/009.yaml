id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: de
  text: Denn der Mann wurde ja nicht um der Frau willen geschaffen, sondern die Frau um des Mannes willen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen der Frau … wegen des Mannes“ beziehungsweise „für die Frau … für den Mann“. Die griechische Präposition kann Grund, Zweck oder Ausrichtung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn … ja
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder; das eingeschobene „ja“ nimmt die leichte Bekräftigung durch καί natürlich im Deutschen auf.
- source_word: οὐκ ἐκτίσθη
  choice: wurde … nicht geschaffen
  rationale: Die passive Form und die Negation werden direkt wiedergegeben; „geschaffen“ entspricht κτίζω und hält den Bezug auf die Schöpfung deutlich.
- source_word: ἀνὴρ / γυνὴ
  choice: der Mann / die Frau
  rationale: Im Rückgriff auf die Schöpfungserzählung sind die Begriffe allgemein als Mann und Frau zu verstehen, nicht enger als Ehemann und Ehefrau.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: um der Frau willen / um des Mannes willen
  rationale: διά mit Akkusativ kann Grund, Zweck oder Ausrichtung bezeichnen. Die deutsche Wendung bewahrt diese Offenheit besser als eine eindeutig kausale oder rein zweckbestimmte Formulierung.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten ersten Aussage ist „sondern“ im Deutschen die natürliche und präzise adversative Verbindung.
theological_decisions:
- issue: Bedeutung von ἀνήρ und γυνή
  choice: Mann und Frau
  alternative: Ehemann und Ehefrau
  rationale: Der Hinweis auf das Geschaffenwerden verankert die Aussage in der Schöpfungserzählung. Daher bleibt der weitere Bezug auf Mann und Frau erhalten, ohne den Vers auf die Ehe zu verengen.
- issue: Bedeutungsumfang von διά mit Akkusativ
  choice: um … willen
  alternative: wegen; für
  rationale: Die gewählte Formulierung lässt Grund, Zweck und Ausrichtung anklingen und legt die theologische Beziehung nicht genauer fest, als es der griechische Ausdruck tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzform bewahrt den pointierten Gegensatz des griechischen Textes; „um … willen“ ist gehoben, aber allgemein verständlich und erhält die semantische Offenheit.
