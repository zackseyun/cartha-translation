  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: de
  text: Wo ist der Weise?[a] Wo ist der Schriftgelehrte? Wo ist der Streitredner dieses Zeitalters?[b] Hat Gott nicht die Weisheit der Welt zur Torheit gemacht?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der weise Mensch“. Die griechische Form ist männlicher Singular, steht hier aber wahrscheinlich repräsentativ.'
    reason: lexical_alternative
  - marker: b
    text: „Dieses Zeitalters“ übersetzt einen anderen griechischen Begriff als „der Welt“ im letzten Satz des Verses.
    reason: cross_reference
  - marker: c
    text: 'Oder: „Hat Gott die Weisheit der Welt nicht als töricht erwiesen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Wo ist
  rationale: Gibt die dreifache rhetorische Herausforderung natürlich und unmittelbar wieder.
- source_word: σοφός
  choice: der Weise
  rationale: Bewahrt den maskulinen Singular und kann im Deutschen zugleich repräsentativ für einen Typus verstanden werden.
- source_word: γραμματεύς
  choice: der Schriftgelehrte
  rationale: Ist die etablierte, historisch konkrete Wiedergabe und vermeidet die zu allgemeine Bedeutung von „Gelehrter“.
- source_word: συζητητής
  choice: der Wortführer
  rationale: Bezeichnet hier einen Vertreter gelehrter Auseinandersetzung; „Wortführer“ ist verständlich und würdevoll, ohne das Wort auf eine formelle Debatte einzuengen.
- source_word: τοῦ αἰῶνος τούτου
  choice: dieses Zeitalters
  rationale: Bewahrt αἰών als „Zeitalter“ und unterscheidet es vom späteren κόσμος, „Welt“.
- source_word: οὐχὶ ἐμώρανεν
  choice: Hat ... nicht ... zur Torheit gemacht?
  rationale: Die Frage erwartet Zustimmung; „zur Torheit gemacht“ bewahrt die starke kausative Formulierung des griechischen Verbs.
- source_word: σοφίαν τοῦ κόσμου
  choice: die Weisheit der Welt
  rationale: Entspricht der üblichen Bedeutung und hält κόσμος von αἰών terminologisch getrennt.
theological_decisions:
- issue: Unterscheidung zwischen αἰών und κόσμος
  choice: αἰών mit „Zeitalter“, κόσμος mit „Welt“ wiedergegeben
  alternative: Beide Begriffe mit „Welt“ wiedergeben
  rationale: Paulus verwendet im selben Vers zwei verschiedene Begriffe. Die Unterscheidung erhält die Spannung zwischen dem gegenwärtigen Zeitalter und der Weisheit der Welt.
- issue: Kausative oder deklarative Bedeutung von ἐμώρανεν
  choice: „zur Torheit gemacht“
  alternative: „als töricht erwiesen“
  rationale: Die gewählte Fassung bewahrt vorrangig die kausative Kraft des Verbs; die deklarative Nuance bleibt als mögliche Übersetzung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Rhythmus. Die dreifache Frageform des Ausgangstextes bleibt erhalten; „Zeitalter“ und „Welt“ werden bewusst unterschieden.
