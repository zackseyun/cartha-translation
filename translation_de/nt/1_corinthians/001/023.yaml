  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: de
  text: Wir dagegen verkünden den gekreuzigten Messias[a], für Juden ein Anstoß, für die Völker[b] eine Torheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus, den Gekreuzigten“.'
    reason: alternative_reading
  - marker: b
    text: Gemeint sind hier die nichtjüdischen Völker, im Gegensatz zu den Juden.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: verkünden
  rationale: Das Verb bezeichnet öffentliches, heroldartiges Ausrufen; „verkünden“ ist im modernen Deutschen natürlich und wahrt diesen Nachdruck.
- source_word: Χριστόν
  choice: den Messias
  rationale: Hier steht Χριστός als Titel und Inhalt der apostolischen Verkündigung; „Messias“ macht diese Funktion deutlich.
- source_word: ἐσταυρωμένον
  choice: den gekreuzigten
  rationale: Das attributive Partizip gibt den gekreuzigten und weiterhin als solchen bestimmten Messias wieder, ohne die deutsche Formulierung zu überladen.
- source_word: Ἰουδαίοις
  choice: für Juden
  rationale: Im ausdrücklichen Gegensatz zu den Völkern ist die ethnisch-religiöse Bezeichnung „Juden“ sachgerecht.
- source_word: σκάνδαλον
  choice: ein Anstoß
  rationale: „Anstoß“ bewahrt den Gedanken eines Hindernisses, an dem man sich stößt, und klingt würdevoller und natürlicher als das moderne Lehnwort „Skandal“.
- source_word: ἔθνεσιν
  choice: für die Völker
  rationale: Die Grundbedeutung lautet „Völker“; im Kontext sind damit die nichtjüdischen Völker im Gegensatz zu den Juden gemeint. Die Übersetzung bewahrt diese lexikalische Breite und erläutert sie in der Fußnote.
- source_word: μωρίαν
  choice: eine Torheit
  rationale: „Torheit“ entspricht dem wertenden Begriff und wahrt die begriffliche Verbindung zu Paulus’ Argument über vermeintliche Weisheit und Torheit.
theological_decisions:
- issue: Χριστός als Titel oder als namensähnliche Bezeichnung
  choice: den Messias
  alternative: Christus
  rationale: Der Zusammenhang hebt den Inhalt der Verkündigung und den messianischen Anspruch hervor; daher wird die Titelfunktion sichtbar gemacht.
- issue: Bedeutung von ἔθνεσιν im Gegensatz zu Ἰουδαίοις
  choice: die Völker, mit erläuternder Fußnote
  alternative: die Nichtjuden
  rationale: „Völker“ gibt die griechische Form unmittelbar wieder, während die Fußnote die hier gemeinte Gegenüberstellung von Juden und Nichtjuden eindeutig macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang „Wir dagegen“ bildet den Kontrast von ἡμεῖς δέ ab. Der Doppelpunkt macht im Deutschen die anschließende Zuordnung zu Juden und Völkern übersichtlich, ohne die knappe rhetorische Struktur aufzulösen.
