id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: de
  text: Er wird euch auch bis ans Ende festigen[a], sodass ihr am Tag unseres Herrn Jesus, des Messias[c], ohne Anklage dasteht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bestätigen“ oder „stärken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „untadelig“ oder „über jeden Vorwurf erhaben“.'
    reason: lexical_alternative
  - marker: c
    text: Griechisch Christos; hier mit „Messias“ wiedergegeben, um die Bedeutung des Titels auszudrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: wird … festigen
  rationale: Das Verb bezeichnet das Festmachen oder Bestärken. „Festigen“ bewahrt diesen stabilisierenden Sinn und klingt im heutigen Deutsch natürlich.
- source_word: ἕως τέλους
  choice: bis ans Ende
  rationale: Die Wendung bezeichnet die fortdauernde Bewahrung bis zum endzeitlichen Zielpunkt.
- source_word: ἀνεγκλήτους
  choice: ohne Anklage dasteht
  rationale: Das Adjektiv meint, dass gegen jemanden keine Anklage erhoben werden kann. Die Formulierung bewahrt diesen rechtlichen Beiklang und ist zugleich verständlich.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: am Tag
  rationale: „Am Tag“ ist die natürliche deutsche Wiedergabe der biblischen Wendung für den künftigen Tag der Rechenschaft.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die etablierte und kontextgemäße Wiedergabe des Titels κύριος.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός wird als bedeutungsvoller Titel wiedergegeben; der deutsche Artikel und die Apposition machen die Verbindung mit dem Namen Jesus idiomatisch deutlich.
theological_decisions:
- issue: Bezug von ὃς („der/welcher“)
  choice: Das Pronomen wird im Deutschen mit „Er“ aufgenommen und auf den unmittelbar zuvor genannten Herrn Jesus, den Messias, bezogen.
  alternative: Ein weiter gefasster Bezug auf Gott aus dem vorherigen Zusammenhang ist möglich.
  rationale: Der nächstliegende grammatische Bezug ist der maskuline Singular „unser Herr Jesus, der Messias“ am Ende von Vers 7. „Er“ ergibt im Deutschen einen selbstständig lesbaren Vers, ohne den Bezug zusätzlich dogmatisch auszudeuten.
- issue: Verhältnis von Festigung und Schuldlosigkeit
  choice: „sodass“ gibt ἀνεγκλήτους als den Zustand beziehungsweise das Ergebnis wieder, in dem die Angesprochenen am Tag des Herrn dastehen.
  alternative: 'Eine knappere, formalere Apposition wäre: „bis ans Ende festigen – untadelig am Tag …“'
  rationale: Der griechische Akkusativ ist prädikativ auf „euch“ bezogen. Die deutsche Ergebniskonstruktion macht diesen Bezug klar, ohne eine zusätzliche Heilsbedingung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bis ans Ende“ und „am Tag“ bewahren die biblisch-endzeitliche Ausdrucksweise; „ohne Anklage dasteht“ macht den rechtlichen Beiklang von ἀνεγκλήτους für heutige Leser unmittelbar verständlich.
