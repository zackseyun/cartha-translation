  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: de
  text: 'Damit meine ich: Jeder von euch sagt: „Ich gehöre zu Paulus“, „Ich gehöre zu Apollos“, „Ich gehöre zu Kephas“ oder „Ich gehöre zum Messias[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich gehöre zu Christus.“'
    reason: Nennt die geläufige alternative Wiedergabe von Χριστοῦ, ohne die Übersetzung „Messias“ als Titel aufzugeben.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: 'Damit meine ich:'
  rationale: Gibt die erläuternde Wendung knapp und idiomatisch wieder; der Doppelpunkt führt den mit ὅτι eingeleiteten Inhalt ein.
- source_word: ἕκαστος ὑμῶν λέγει
  choice: Jeder von euch sagt
  rationale: Bewahrt die distributive Aussage von ἕκαστος und den präsentischen Charakter von λέγει in natürlichem Deutsch.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: Ich gehöre zu Paulus … ich zu Apollos … ich zu Kephas … ich zum Messias
  rationale: „Zu jemandem gehören“ gibt den Genitiv der Zugehörigkeit beziehungsweise Gruppenbindung verständlich wieder. Die Ellipsen in den folgenden Gliedern entsprechen natürlichem Deutsch, ohne Inhalt auszulassen.
- source_word: Κηφᾶ
  choice: Kephas
  rationale: Transliteriert den von Paulus gebrauchten aramäischen Namen, statt ihn durch „Petrus“ zu ersetzen.
- source_word: Χριστοῦ
  choice: zum Messias
  rationale: Gibt Χριστός als Titel wieder und bewahrt zugleich die parallele Zugehörigkeitsformel der vier Aussagen.
theological_decisions:
- issue: Χριστοῦ innerhalb einer Reihe korinthischer Zugehörigkeitsaussagen
  choice: zum Messias
  alternative: zu Christus
  rationale: Χριστός wird als Titel übersetzt. Ob die letzte Aussage ebenfalls eine problematische Parteiparole ist oder einen anders gelagerten Anspruch ausdrückt, wird durch die parallele, unkommentierte Wiedergabe bewusst nicht entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte, kontrastive Satzstruktur bleibt erkennbar; nach dem ersten vollständigen Satzglied werden im Deutschen natürliche Ellipsen verwendet.
