id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: de
  text: Denn der Messias hat mich nicht gesandt, um zu taufen, sondern um die gute Nachricht zu verkünden – nicht mit Weisheit der Rede[a], damit das Kreuz des Messias nicht entleert werde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in Weisheit des Wortes«; auch: »mit wortgewandter Weisheit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »nicht zunichtegemacht werde« oder, im Sinnzusammenhang, »nicht seiner Wirkung beraubt werde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: der Messias / des Messias
  rationale: Χριστός wird als bedeutungsvoller Titel übersetzt; die gleiche Wiedergabe an beiden Stellen bewahrt die Kohärenz des Verses.
- source_word: βαπτίζειν
  choice: zu taufen
  rationale: Der etablierte deutsche Ausdruck ist präzise und vermeidet eine unnötige Festlegung auf eine bestimmte Taufweise.
- source_word: εὐαγγελίζεσθαι
  choice: die gute Nachricht zu verkünden
  rationale: Die Formulierung gibt den verbalen Charakter und den Inhalt des griechischen Ausdrucks verständlich und idiomatisch wieder.
- source_word: σοφίᾳ λόγου
  choice: mit Redeweisheit
  rationale: Das kompakte deutsche Kompositum erhält die Verbindung von Weisheit und sprachlich-rhetorischer Darbietung, ohne bloß Eloquenz einzutragen.
- source_word: κενωθῇ
  choice: seiner Wirkung beraubt wird
  rationale: Die idiomatische Wendung gibt im Kontext die Folge eines 'Leer-Machens' wieder; die konkrete griechische Bildsprache bleibt in einer Fußnote sichtbar.
- source_word: σταυρὸς
  choice: das Kreuz
  rationale: Dies ist die direkte, etablierte und im paulinischen Zusammenhang angemessene Wiedergabe.
theological_decisions:
- issue: Χριστός als übersetzter Titel oder als traditionelles Fremdwort
  choice: Messias
  alternative: Christus
  rationale: Die Übersetzung macht den Titelgehalt des griechischen Wortes erkennbar, ohne ihn zu einem bloßen Eigennamen werden zu lassen.
- issue: Bedeutung von κενωθῇ in Bezug auf das Kreuz
  choice: seiner Wirkung beraubt wird
  alternative: leer gemacht wird / zunichtegemacht wird
  rationale: Die Hauptfassung ist im Deutschen natürlich und bezeichnet die im Kontext gemeinte Wirkungslosigkeit, ohne zu erklären, worin die Kraft des Kreuzes besteht; die wörtlichere Bildsprache wird als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem argumentativen Kontrast des Griechischen. »Redeweisheit« ist bewusst knapp und leicht gehoben; die Fußnote erschließt die genuine Mehrdeutigkeit der Wendung. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
