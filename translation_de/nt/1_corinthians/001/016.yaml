base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: de
  text: Ich habe auch die Hausgemeinschaft des Stephanas[a] getauft. Im Übrigen weiß ich nicht, ob ich noch jemand anderen getauft habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Haus des Stephanas“. Gemeint ist seine Hausgemeinschaft, nicht nur das Gebäude; dazu konnten Familie, Angehörige und weitere im Haus lebende Personen gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: getauft
  rationale: Das Verb bezeichnet hier die Spendung der Taufe. „Getauft“ ist die übliche, klare Wiedergabe und legt keine bestimmte Taufweise fest.
- source_word: δὲ καὶ
  choice: auch
  rationale: Die Verbindung fügt das Haus des Stephanas als nachträgliche Ergänzung zur vorausgehenden Aufzählung hinzu; im Deutschen gibt „auch“ diese Funktion natürlich wieder.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: das Haus des Stephanas
  rationale: „Haus“ kann im Deutschen wie οἶκος die gesamte Hausgemeinschaft bezeichnen und bewahrt deren möglichen Umfang besser als das enger wirkende „Familie“.
- source_word: λοιπὸν
  choice: Im Übrigen
  rationale: Die Wendung leitet die verbleibende Aussage nach der ergänzenden Ausnahme ein und entspricht dem knappen, sich selbst korrigierenden Gedankengang.
- source_word: οὐκ οἶδα
  choice: weiß ich nicht
  rationale: Diese Wiedergabe folgt dem ausdrücklichen Wortlaut; dass Paulus sich nicht erinnert, ergibt sich aus dem Zusammenhang, wird aber nicht in den Text hineingetragen.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: ob ich noch jemand anderen getauft habe
  rationale: Das indirekte „ob“ drückt die im griechischen εἴ-Satz enthaltene Ungewissheit im modernen Deutschen idiomatisch aus; „noch jemand anderen“ gibt τινα ἄλλον wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze Nachtrag und die erkennbare Unsicherheit des Paulus bleiben erhalten; „Haus“ wahrt die soziale Breite von οἶκος, wobei die Fußnote ein rein räumliches Missverständnis verhindert.
