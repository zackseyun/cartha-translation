  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: de
  text: Und das gesellschaftlich Niedrigstehende in der Welt und das Verachtete[a], das, was nicht ist, hat Gott erwählt, um das, was ist, zunichtezumachen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das für nichts Geachtete“.'
    reason: Lexikalische Alternative zu ἐξουθενημένα, die dessen abwertende Behandlung ausdrücklich macht.
  - marker: b
    text: 'Oder: „um das, was etwas gilt, unwirksam zu machen“.'
    reason: Die Alternative verdeutlicht den gesellschaftlichen Sinn des Gegensatzes und die Bedeutung von καταργήσῃ, während der Haupttext die markante Form des Griechischen bewahrt.
lexical_decisions:
- source_word: ἀγενῆ
  choice: was in der Welt als unbedeutend gilt
  rationale: Das Wort bezeichnet das Unedle beziehungsweise sozial Niedrigstehende. Die Formulierung gibt den Statusbezug in natürlichem modernem Deutsch wieder, ohne eine konkrete niedrige Abstammung zu behaupten.
- source_word: ἐξουθενημένα
  choice: verachtet wird
  rationale: Das perfekte Passiv bezeichnet, was geringschätzig behandelt oder für wertlos gehalten worden ist; „verachtet“ bewahrt diese starke Abwertung knapp und verständlich.
- source_word: τὰ μὴ ὄντα
  choice: das, was nicht ist
  rationale: Die enge Wiedergabe erhält Paulus’ zugespitzten Gegensatz und lässt offen, ob primär gesellschaftliche Bedeutungslosigkeit oder eine weiter reichende Aussage anklingt.
- source_word: τὰ ὄντα
  choice: das, was ist
  rationale: Die parallele Formulierung bewahrt die rhetorische Antithese zu „das, was nicht ist“.
- source_word: καταργήσῃ
  choice: zunichtezumachen
  rationale: Das Verb meint, etwas unwirksam werden zu lassen oder seiner Geltung zu berauben. „Zunichtemachen“ erhält die kräftige Aussage, ohne zwingend Vernichtung im ontologischen Sinn festzulegen.
- source_word: ἐξελέξατο
  choice: hat … erwählt
  rationale: „Erwählen“ ist hier eine natürliche, würdige Wiedergabe von Gottes bewusstem Auswählen und greift die Wiederholung im unmittelbaren Kontext auf.
theological_decisions:
- issue: Deutung von τὰ μὴ ὄντα / τὰ ὄντα als gesellschaftliche Kategorien oder ontologische Aussagen
  choice: Im Haupttext bleibt der wörtliche Gegensatz „das, was nicht ist“ / „das, was ist“ erhalten.
  alternative: 'Dynamisch: „die nichts gelten“ / „die etwas gelten“.'
  rationale: Der Kontext betrifft eindeutig weltlichen Rang und gesellschaftliches Ansehen; die bewusst umfassende und provokante griechische Ausdrucksweise sollte jedoch nicht auf diese Erklärung verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Ausdruck wird idiomatisch auf gesellschaftlichen Status bezogen; die anschließende Seins-Antithese bleibt bewusst formal und spannungsreich. Gedankenstriche markieren die appositionelle Zuspitzung.
