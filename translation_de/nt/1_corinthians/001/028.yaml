    rationale: ἀγενῆ („gesellschaftlich Niedrigstehende“) und ἐξουθενημένα („Verachtete“) sind jeweils eigene koordinierte Objekte. Eine getrennte Wiedergabe erhält die Reihung und die Nuance beider Begriffe deutlicher.
  - severity: low
    issue: Die Gedankenstriche können „das, was nicht ist“ als bloße Erläuterung des unmittelbar Vorangehenden verstehen lassen.
    rationale: τὰ μὴ ὄντα ist grammatisch ein weiterer koordinierter Ausdruck. Kommata bewahren die zugespitzte Folge, ohne die Beziehung stärker festzulegen als der griechische Text.
