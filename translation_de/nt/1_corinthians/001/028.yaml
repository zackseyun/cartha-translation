  verdict: revise
  source_fidelity: Der Entwurf gibt Gottes Erwählen, die soziale Niedrigkeit, das Verachtetwerden sowie die bewusst paradoxe Antithese „das, was nicht ist“ / „das, was ist“ im Wesentlichen zutreffend wieder. Allerdings verbindet er ἀγενῆ und ἐξουθενημένα zu einer einzigen Relativkonstruktion und hebt τὰ μὴ ὄντα durch Gedankenstriche als nähere Apposition hervor. Im Griechischen stehen drei koordinierte neutrale Ausdrücke; die Revision stellt diese Reihung klarer heraus.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „gesellschaftlich Niedrigstehende“ gibt den Statusbezug von ἀγενῆ präziser wieder als „als unbedeutend gilt“, ohne die folgende markante Seins-Antithese zu dynamisieren.
  terminology: „Erwählt“ entspricht ἐξελέξατο. „Verachtete“ bewahrt die abwertende Kraft von ἐξουθενημένα. „zunichtezumachen“ ist für καταργήσῃ vertretbar; die Fußnote bietet mit „unwirksam zu machen“ eine weniger bildhafte lexikalische Alternative. Die wörtliche Spannung von τὰ μὴ ὄντα und τὰ ὄντα bleibt erhalten.
  issues:
