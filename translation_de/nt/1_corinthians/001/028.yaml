revisions:
- from: Und was in der Welt als unbedeutend gilt und verachtet wird, das hat Gott erwählt – das, was nicht ist –, um das, was ist, zunichtezumachen.[a]
  to: Und das gesellschaftlich Niedrigstehende in der Welt und das Verachtete[a], das, was nicht ist, hat Gott erwählt, um das, was ist, zunichtezumachen.[b]
  rationale: 'Die Revision trennt die drei von Gott erwählten Kategorien entsprechend der griechischen Koordination: das gesellschaftlich Niedrigstehende, das Verachtete und „das, was nicht ist“. Sie vermeidet zugleich eine Auslegung der letzten Kategorie als bloße Apposition und erhält die offene, rhetorisch scharfe Seins-Antithese. Die Fußnoten sind unmittelbar an den jeweils erläuterten Ausdrücken verankert.'
