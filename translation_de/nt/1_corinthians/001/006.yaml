  text: καθὼς τὸ μαρτύριον τοῦ Χριστοῦ ἐβεβαιώθη ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/006.yaml
  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: de
  text: so wie das Zeugnis über den Messias[a] unter euch bestätigt wurde[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zeugnis des Messias“ (beziehungsweise „das Zeugnis, das vom Messias stammt“).'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in euch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: so wie
  rationale: Leitet eine Entsprechung zum vorausgehenden Gedanken ein und gibt die vergleichende Kraft natürlich wieder.
- source_word: μαρτύριον
  choice: Zeugnis
  rationale: Bewahrt sowohl den Sinn einer bezeugenden Aussage als auch den Bezug auf die verkündigte Botschaft, ohne zu paraphrasieren.
- source_word: τοῦ Χριστοῦ
  choice: über den Messias
  rationale: 'Der Genitiv wird im Haupttext objektiv verstanden: Das Zeugnis hat den Messias zum Inhalt. Χριστός wird hier als Titel mit „Messias“ wiedergegeben.'
- source_word: ἐβεβαιώθη
  choice: bestätigt wurde
  rationale: Die passive Form bezeichnet, dass etwas gefestigt, bekräftigt oder als zuverlässig erwiesen wurde; „bestätigt wurde“ ist präzise und idiomatisch.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Bei der pluralischen Anrede bezeichnet die Wendung wahrscheinlich das Wirksamwerden innerhalb der korinthischen Gemeinschaft; die wörtlichere Möglichkeit bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Genitivfunktion von τοῦ Χριστοῦ
  choice: 'objektiver Genitiv: „das Zeugnis über den Messias“'
  alternative: 'subjektiver oder herkunftsbezogener Genitiv: „das Zeugnis des Messias“'
  rationale: Im Zusammenhang liegt das apostolische Zeugnis über Jesus nahe. Da der griechische Genitiv jedoch mehrdeutig bleibt, wird die andere Deutung nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzanschluss „so wie“ und das abschließende Komma bleiben erhalten, weil der Vers grammatisch an den vorhergehenden und folgenden Zusammenhang gebunden ist.
