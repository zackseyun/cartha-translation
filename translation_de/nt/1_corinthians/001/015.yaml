translation:
  language: de
  text: damit niemand sagen kann, ihr seiet auf meinen Namen getauft worden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meinem Namen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Kennzeichnet hier Zweck beziehungsweise beabsichtigte Folge und wird im modernen Deutsch natürlich mit „damit“ wiedergegeben.
- source_word: μή τις
  choice: niemand
  rationale: Die verneinte indefinite Person wird im Deutschen idiomatisch und klar mit „niemand“ ausgedrückt.
- source_word: εἴπῃ
  choice: sagen kann
  rationale: Der Aorist Konjunktiv nach ἵνα bezeichnet eine mögliche Äußerung; „sagen kann“ gibt diesen prospektiven Sinn natürlich wieder.
- source_word: εἰς
  choice: auf
  rationale: Im Deutschen ist „auf einen Namen taufen“ die natürliche, zugleich eng am griechischen εἰς orientierte Wendung; sie bewahrt den Gedanken der Zuordnung zu beziehungsweise Identifikation mit dem Namen.
- source_word: τὸ ἐμὸν ὄνομα
  choice: meinen Namen
  rationale: Die possessive Konstruktion wird schlicht und präzise mit „meinen Namen“ wiedergegeben.
- source_word: ἐβαπτίσθητε
  choice: ihr seiet … getauft worden
  rationale: Bewahrt das ausdrücklich passive Verb und stellt es als Inhalt einer möglichen Behauptung in indirekter Rede dar; „taufen“ ist hier die sachlich neutrale Standardwiedergabe.
theological_decisions:
- issue: Wiedergabe von εἰς τὸ ἐμὸν ὄνομα im Taufzusammenhang
  choice: auf meinen Namen
  alternative: in meinem Namen
  rationale: „Auf meinen Namen“ entspricht im Deutschen der mit εἰς gebildeten Taufformel und bewahrt die relationale Bedeutung der Zuordnung, ohne sie dogmatisch näher festzulegen. „In meinem Namen“ ist ebenfalls möglich, kann jedoch stärker nach Bevollmächtigung klingen und wird daher als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv I kennzeichnet die indirekte Rede klar; die Formulierung bleibt eng am griechischen Satzbau, ohne unnatürlich zu wirken.
