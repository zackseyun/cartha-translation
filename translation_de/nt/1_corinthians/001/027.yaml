  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: de
  text: Sondern das, was in den Augen der Welt töricht ist, hat Gott erwählt, um die Weisen zu beschämen; und das, was in den Augen der Welt schwach ist, hat Gott erwählt, um das Starke zu beschämen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sondern
  rationale: Setzt den starken Gegensatz zum vorangehenden Zusammenhang natürlich fort.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: was vor der Welt töricht ist
  rationale: Das substantivierte Neutrum Plural wird ohne vorschnelle Festlegung auf Dinge oder Menschen wiedergegeben; „vor der Welt“ bringt die weltliche Bewertung idiomatisch zum Ausdruck.
- source_word: ἐξελέξατο
  choice: hat … erwählt
  rationale: „Erwählen“ gibt die bewusste göttliche Wahl in würdigem, biblisch vertrautem Deutsch wieder.
- source_word: ἵνα καταισχύνῃ
  choice: um … zu beschämen
  rationale: Die Infinitivkonstruktion gibt den Zweck der griechischen ἵνα-Klausel klar und natürlich wieder.
- source_word: τοὺς σοφούς
  choice: die Weisen
  rationale: Bewahrt den substantivischen Personenbezug und den rhetorischen Gegensatz.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: was vor der Welt schwach ist
  rationale: Bewahrt wie im ersten Satzglied das substantivierte Neutrum und die offene Referenz.
- source_word: τὰ ἰσχυρά
  choice: das Starke
  rationale: Das substantivierte Neutrum wird formal erkennbar gehalten und steht prägnant im Gegensatz zum Schwachen.
theological_decisions:
- issue: Referenz der substantivierten Neutra τὰ μωρά, τὰ ἀσθενῆ und τὰ ἰσχυρά
  choice: Neutrale Formulierungen mit „was … ist“ beziehungsweise „das Starke“
  alternative: „die törichten/schwachen/starken Menschen“ oder „die törichten/schwachen/starken Dinge“
  rationale: Der griechische Text lässt die Referenz rhetorisch offen; eine ausdrückliche Beschränkung auf Menschen oder Sachen würde diese Offenheit unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und der Kontrast des griechischen Satzes bleiben erhalten; „vor der Welt“ ist idiomatischer als das missverständliche „der Welt“ und markiert eine Bewertung aus Sicht der Welt.
