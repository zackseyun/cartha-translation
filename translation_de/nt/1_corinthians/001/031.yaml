  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: de
  text: 'damit, wie geschrieben steht: »Wer sich rühmt, soll sich des Herrn rühmen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das Ergebnis des vorausgehenden Gedankens ein und bewahrt die finale Kraft knapp und natürlich.
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Die geläufige deutsche Zitierformel gibt die Übereinstimmung mit der Schrift und den fortdauernden Geltungsanspruch des griechischen Perfekts idiomatisch wieder.
- source_word: Ὁ καυχώμενος
  choice: Wer sich rühmt
  rationale: Gibt das substantivierte Partizip natürlich und allgemein wieder; »sich rühmen« bewahrt zudem die Wiederholung des griechischen Verbs.
- source_word: ἐν κυρίῳ
  choice: des Herrn
  rationale: Im Deutschen ist »sich des Herrn rühmen« die idiomatische Verbindung. Der Genitiv bezeichnet hier den Bezug beziehungsweise Gegenstand des Rühmens, ohne den theologischen Fokus zu verändern.
- source_word: καυχάσθω
  choice: soll sich rühmen
  rationale: Der Imperativ der dritten Person wird in modernem Deutsch klar mit »soll« wiedergegeben; dies bewahrt den auffordernden und normativen Charakter.
theological_decisions:
- issue: Aufforderungskraft von καυχάσθω
  choice: soll sich rühmen
  alternative: rühme sich
  rationale: »Soll sich rühmen« ist heutiges, verständliches Deutsch und erhält die normative Kraft des Imperativs, ohne sie unnötig zu verschärfen.
- issue: Wiedergabe von κύριος im Schriftzitat
  choice: der Herr
  alternative: Herr
  rationale: »Herr« entspricht κύριος und wahrt die theologische Offenheit des Zitats in seinem paulinischen Zusammenhang; der bestimmte Artikel ist im Deutschen in dieser Fügung erforderlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung »sich des Herrn rühmen« ist hier zugleich idiomatisch und quellennah; keine Fußnote ist erforderlich.
