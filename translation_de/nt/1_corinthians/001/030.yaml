    rationale: „Durch“ legt im Deutschen stärker ein Mittel bzw. einen Handelnden nahe. ἐκ/ἐξ bezeichnet hier die Herkunft bzw. den Ursprung des Seins der Glaubenden in Jesus, dem Messias.
  - severity: low
    issue: 'Die Fußnote „Oder: Recht“ ist als Alternative für δικαιοσύνη missverständlich.'
    rationale: „Recht“ bezeichnet im modernen Deutsch meist das Rechtssystem, einen Rechtsanspruch oder eine Norm. Es deckt die Bedeutung von δικαιοσύνη weniger präzise ab als „Rechtschaffenheit“.
