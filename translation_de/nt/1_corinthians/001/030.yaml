source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: de
  text: Von ihm her aber seid ihr in Messias Jesus, der für uns Weisheit von Gott geworden ist, Gerechtigkeit[a] und Heiligung und Erlösung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtschaffenheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: durch ihn
  rationale: Die Wendung bezeichnet Gott als Ursprung des Daseins der Glaubenden in Messias Jesus. „Durch ihn“ ist im heutigen Deutsch natürlich und bewahrt den Gedanken, dass dies von Gott ausgeht.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Messias Jesus
  rationale: „In“ bewahrt die prägnante paulinische Formulierung, ohne sie durch „mit ihm verbunden“ bereits auszudeuten. Χριστός wird als Titel mit „Messias“ wiedergegeben.
- source_word: ἐγενήθη
  choice: geworden ist
  rationale: Dies gibt γίνομαι unmittelbar wieder und lässt die Aussage stehen, was Messias Jesus für die Glaubenden geworden ist.
- source_word: σοφία ἡμῖν ἀπὸ θεοῦ
  choice: für uns Weisheit von Gott
  rationale: Die Wortfolge bleibt nahe am Griechischen und bewahrt Gott als Ursprung der Weisheit, ohne die syntaktische Beziehung zu den folgenden Begriffen eindeutig festzulegen.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die übliche und kontextuell passende Wiedergabe; die mögliche Bedeutung „Recht“ wird in einer Fußnote genannt.
- source_word: ἁγιασμός
  choice: Heiligung
  rationale: „Heiligung“ gibt den Vorgang beziehungsweise Zustand des Geheiligtseins präzise und im paulinischen Zusammenhang verständlich wieder.
- source_word: ἀπολύτρωσις
  choice: Erlösung
  rationale: „Erlösung“ ist die etablierte deutsche Wiedergabe und bewahrt den Gedanken befreiender Loslösung.
theological_decisions:
- issue: Beziehung von „Weisheit von Gott“ zu „Gerechtigkeit, Heiligung und Erlösung“
  choice: Die vier Begriffe werden in einer fortlaufenden Reihe wiedergegeben, wobei „von Gott“ unmittelbar bei „Weisheit“ steht.
  alternative: Die drei folgenden Begriffe könnten ausdrücklich als Erklärung der Weisheit markiert werden; ebenso könnte „von Gott“ auf alle vier Begriffe bezogen werden.
  rationale: Die schlichte Reihung folgt der griechischen Syntax und legt nicht fest, ob die letzten drei Substantive die Weisheit erläutern oder gleichgeordnet neben ihr stehen.
- issue: Bedeutung von ἐξ αὐτοῦ
  choice: „durch ihn“ bezeichnet Gott als den Ursprung beziehungsweise Urheber des Daseins in Messias Jesus.
  alternative: „von ihm her“ oder „aus ihm“ würden den Ursprung formaler ausdrücken, klängen im modernen Deutsch jedoch ungewohnt oder könnten missverständlich wirken.
  rationale: Die Formulierung wahrt den Vorrang göttlichen Handelns, ohne einen besonderen Mechanismus der Vereinigung mit Messias Jesus zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konjunktion „und“ vor Heiligung und Erlösung bildet die nachdrückliche griechische Reihung ab; die paulinische Wendung „in Messias Jesus“ bleibt bewusst unaufgelöst.
