id: 1CO.1.7
reference: 1 Corinthians 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: de
  text: sodass euch keine Gnadengabe fehlt, während ihr sehnsüchtig auf die Offenbarung unseres Herrn Jesus Christus wartet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine Gabe“ oder „keine geistliche Gabe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf das Erscheinen unseres Herrn Jesus Christus“. „Jesus Christus“ kann auch mit „Jesus, der Messias“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet die Folge der zuvor beschriebenen Gnade Gottes ein und schließt im Deutschen natürlich an den Kontext an.
- source_word: ὑστερεῖσθαι
  choice: euch … fehlt
  rationale: Gibt den Gedanken des Mangels idiomatisch und präzise wieder.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: keine Gnadengabe
  rationale: Bewahrt sowohl den Gabe- als auch den Gnadenbezug von χάρισμα, ohne den Ausdruck vorschnell auf eine bestimmte Art geistlicher Befähigung einzuengen.
- source_word: ἀπεκδεχομένους
  choice: während ihr sehnsüchtig … wartet
  rationale: Das Partizip bezeichnet ein andauerndes, erwartungsvolles Warten; „sehnsüchtig“ bringt dessen verstärkten Charakter natürlich zum Ausdruck.
- source_word: ἀποκάλυψιν
  choice: Offenbarung
  rationale: Ist die direkte Entsprechung und bewahrt den paulinischen Gedanken, dass Jesus Christus enthüllt beziehungsweise sichtbar offenbar wird.
- source_word: κυρίου
  choice: Herrn
  rationale: Die übliche und kontextgemäße Wiedergabe von κύριος als Hoheitstitel.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: Die Verbindung erscheint hier als vertraute, namenähnliche Bezeichnung; „Christus“ bewahrt zugleich den griechischen Titel in seiner im Deutschen etablierten Form.
theological_decisions:
- issue: Bedeutungsumfang von χάρισμα
  choice: Gnadengabe
  alternative: Gabe; geistliche Gabe
  rationale: „Gnadengabe“ macht den Bezug zur unverdienten göttlichen Zuwendung sichtbar, ohne χάρισμα ausschließlich als außergewöhnliche Geistesgabe zu bestimmen.
- issue: Bedeutung von ἀποκάλυψις im endzeitlichen Kontext
  choice: Offenbarung
  alternative: Erscheinen
  rationale: „Offenbarung“ hält sich enger an das Substantiv und lässt offen, ob der Akzent auf Enthüllung oder sichtbarem Erscheinen liegt.
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  alternative: Jesus, der Messias
  rationale: In dieser festen Verbindung ist der Ausdruck namenähnlich. Die Alternative macht den ursprünglichen Titelcharakter für heutige Leser ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Folgesatz; „während“ macht den begleitenden Sinn des Partizips verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
