source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: de
  text: 'Denn es steht geschrieben: »Ich werde die Weisheit der Weisen vernichten und den Verstand der Verständigen verwerfen[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »außer Kraft setzen«; auch: »zurückweisen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Die feste deutsche Formel für die perfektisch-passive Einleitung eines Schriftzitats bewahrt den gegenwärtigen Geltungsanspruch.
- source_word: γάρ
  choice: Denn
  rationale: Kennzeichnet die Begründung für die vorausgehende Aussage und stellt den Zusammenhang knapp und natürlich her.
- source_word: Ἀπολῶ
  choice: ich werde … vernichten
  rationale: Gibt das Futur von ἀπόλλυμι direkt und mit der angemessenen Kraft wieder, ohne es zusätzlich auszudeuten.
- source_word: τὴν σοφίαν τῶν σοφῶν
  choice: die Weisheit der Weisen
  rationale: Bewahrt sowohl die Genitivkonstruktion als auch die rhetorische Wiederholung des verwandten Wortstamms.
- source_word: τὴν σύνεσιν τῶν συνετῶν
  choice: den Verstand der Verständigen
  rationale: Die deutsche Wortverwandtschaft von »Verstand« und »Verständigen« bildet das griechische Wortspiel und den Parallelismus mit »Weisheit der Weisen« prägnant nach.
- source_word: ἀθετήσω
  choice: ich werde … verwerfen
  rationale: ἀθετέω bezeichnet hier das Zurückweisen oder Außerkraftsetzen; »verwerfen« ist würdig, verständlich und lässt die genaue Wirkungsweise offen.
theological_decisions:
- issue: Wiedergabe des Jesaja-Zitats als Begründung für Gottes Umgang mit menschlicher Weisheit
  choice: Die beiden Futurformen werden direkt als »vernichten« und »verwerfen« wiedergegeben.
  alternative: Stärker deutende Formulierungen wie »zunichtemachen« oder »vereiteln«
  rationale: Die direkte Wiedergabe erhält die scharfe rhetorische Gegenüberstellung, ohne über die griechischen Verben hinaus eine bestimmte theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Einleitungsformel »es steht geschrieben« bleibt wegen ihrer Klarheit und ihrer Funktion als Kennzeichnung eines Schriftzitats erhalten. Der Parallelismus und die Wortstammwiederholungen des Griechischen werden möglichst weitgehend bewahrt.
