id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: de
  text: Ich ermahne euch aber, Brüder[a], im Namen unseres Herrn Jesus, des Messias[b], dass ihr alle dasselbe sagt und dass es unter euch keine Spaltungen gibt, sondern dass ihr in derselben Denkweise und derselben Überzeugung[d] fest verbunden seid.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Anrede lautet wörtlich „Brüder“, kann hier aber die ganze Glaubensgemeinschaft, also Brüder und Schwestern, einschließen.
    reason: cultural_note
  - marker: b
    text: 'Messias: traditionell „Christus“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wiederhergestellt“ beziehungsweise „zurechtgebracht“. Das griechische Wort kann auch das Flicken oder richtige Zusammenfügen bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: „Überzeugung“ kann hier auch „Urteil“, „Auffassung“ oder „Entschluss“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Ich ermahne euch
  rationale: παρακαλέω bezeichnet hier einen eindringlichen pastoralen Appell. „Ermahnen“ wahrt sowohl den Ernst als auch den persönlichen Charakter der Aufforderung.
- source_word: δὲ
  choice: aber
  rationale: Die schwach kontrastierende beziehungsweise weiterführende Partikel wird mit „aber“ wiedergegeben; sie verbindet den Appell mit dem vorausgehenden Zusammenhang, ohne eine zeitliche Bedeutung einzuführen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird formal wiedergegeben. Dass im gemeindlichen Zusammenhang die gesamte Glaubensgemeinschaft angesprochen sein kann, wird in einer Fußnote erläutert.
- source_word: διὰ τοῦ ὀνόματος
  choice: im Namen
  rationale: διά mit Genitiv bezeichnet hier die Grundlage beziehungsweise Autorität des Appells. „Im Namen“ ist im Deutschen die natürliche Entsprechung.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist ein Titel und bedeutet „Messias“. Die Apposition macht diesen Titel im modernen Deutschen verständlich und würdevoll.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: Sagt alle dasselbe
  rationale: Die konkrete Redeform des Griechischen bleibt erhalten; sie wird nicht auf das allgemeinere „Seid euch einig“ reduziert.
- source_word: σχίσματα
  choice: Spaltungen
  rationale: „Spaltungen“ bezeichnet klar die trennenden Parteiungen innerhalb der Gemeinde, ohne den stärker fachsprachlichen Klang von „Schismen“.
- source_word: κατηρτισμένοι
  choice: fest zusammengefügt
  rationale: Das passive καταρτίζω kann ein Wiederherstellen, Zurechtbringen oder Zusammenfügen bezeichnen. Im Zusammenhang der Spaltungen hebt „zusammengefügt“ die wiedergewonnene Einheit hervor; „fest“ gibt den resultativen Zustand idiomatisch wieder.
- source_word: νοῒ
  choice: Denkweise
  rationale: νοῦς bezeichnet das Denken beziehungsweise den inneren Verstand. „Denkweise“ ist verständlich und bleibt von γνώμη unterscheidbar.
- source_word: γνώμῃ
  choice: Überzeugung
  rationale: γνώμη kann Urteil, Auffassung, Entschluss oder Überzeugung meinen. „Überzeugung“ bewahrt die innere Ausrichtung, ohne eine rein intellektuelle Bedeutung festzulegen.
theological_decisions:
- issue: Wiedergabe des christologischen Titels Χριστός
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: Die Übersetzung macht die Bedeutung des Titels sichtbar, statt ihn nur in seiner traditionell latinisierten Form wiederzugeben. Der Referent bleibt unverändert.
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder im Haupttext, mit inklusiver Erläuterung in der Fußnote
  alternative: Brüder und Schwestern
  rationale: Die grammatische Form des Ausgangstextes bleibt sichtbar, während die mögliche pragmatische Einbeziehung der Frauen in der ganzen Gemeinde ausdrücklich vermerkt wird.
- issue: Art der von Paulus geforderten Einheit
  choice: dieselbe Denkweise und dieselbe Überzeugung
  alternative: derselbe Sinn und dasselbe Urteil
  rationale: Die beiden griechischen Begriffe werden unterschieden, ohne die geforderte Einheit als völlige Gleichförmigkeit in jeder nebensächlichen Frage auszudeuten. Der Text selbst fordert eine gemeinsame innere und urteilende Ausrichtung im Kontext der Parteiungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt und die anschließenden Imperative geben die griechischen ἵνα-Sätze als natürlichen deutschen Appell wieder. Die Formulierung bleibt nah an den konkreten Bildern und Schlüsselbegriffen des Ausgangstextes, vermeidet jedoch unnötig kirchliche Fachsprache.
