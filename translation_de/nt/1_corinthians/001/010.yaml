  naturalness: „Sagt alle dasselbe“ und „lasst keine Spaltungen unter euch bestehen“ sind verständlich, aber als aufeinanderfolgende Imperative leicht kantig. „Dass ihr alle dasselbe sagt und dass es unter euch keine Spaltungen gibt“ ist modernes, natürliches Standarddeutsch und wahrt den konkreten Wortlaut. Die Fußnotenmarker sollen unmittelbar an den jeweiligen Bezugsstellen stehen.
  terminology: „Brüder“ mit inklusiver Erläuterung, „Herr“, „Messias“, „Spaltungen“, „Denkweise“ und „Überzeugung“ sind vertretbar und angemessen. Die Wiedergabe „des Messias“ erhält den Titelcharakter von Χριστός; die traditionelle Form wird korrekt als Alternative notiert.
