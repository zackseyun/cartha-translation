review_pass:
  verdict: revise
  source_fidelity: Die Absenderangabe ist insgesamt eng am griechischen Text. »Paulus«, »berufener Apostel«, »des Messias Jesus« und »Sosthenes, der Bruder« geben Wortlaut und offene Satzstruktur angemessen wieder. Bei διὰ θελήματος θεοῦ bezeichnet διά mit Genitiv jedoch die vermittelnde Grundlage bzw. Wirkursache der Berufung; »nach dem Willen Gottes« kann im Deutschen eher bloße Übereinstimmung mit Gottes Willen ausdrücken.
  naturalness: Der Satz ist würdevoll und für eine briefliche Absenderformel gut verständlich. »Durch Gottes Willen« ist sowohl idiomatisch als auch semantisch genauer als »nach dem Willen Gottes«. Die knappe Apposition »Sosthenes, der Bruder« bleibt bewusst offen, da der Satz in V. 2 weitergeführt wird.
  terminology: »Messias Jesus« wahrt den Titelcharakter von Χριστός und die griechische Reihenfolge. »Berufener Apostel« ist für κλητὸς ἀπόστολος treffend. »Der Bruder« bildet ὁ ἀδελφός formal ab; die Fußnote erläutert zurückhaltend die im Briefkontext mögliche idiomatische Lesart »unser Bruder«, ohne sie dem Text aufzuzwingen.
  issues:
  - severity: medium
    issue: »nach dem Willen Gottes« für διὰ θελήματος θεοῦ
    rationale: Die Formulierung ist zwar möglich, kann aber ein Handeln in Übereinstimmung mit Gottes Willen nahelegen. Das griechische διά mit Genitiv beschreibt hier Gottes Willen als Grundlage bzw. vermittelnde Ursache der apostolischen Berufung. »durch Gottes Willen« bringt dies genauer zum Ausdruck.
  revised_text: Paulus, ein berufener Apostel des Messias Jesus durch Gottes Willen, und Sosthenes, der Bruder,[a]
  revised_footnotes:
  - marker: a
    text: 'Oder sinngemäß: unser Bruder.'
    reason: Der griechische Ausdruck lautet wörtlich »der Bruder«, kann im brieflichen Gemeinschaftskontext aber idiomatisch »unser Bruder« bedeuten.
