  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: de
  text: Paulus, ein berufener Apostel des Messias Jesus durch Gottes Willen, und Sosthenes, der Bruder,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: unser Bruder.'
    reason: Der griechische Ausdruck lautet wörtlich »der Bruder«, kann im brieflichen Gemeinschaftskontext aber idiomatisch »unser Bruder« bedeuten.
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Die im Deutschen etablierte Form des griechischen Personennamens.
- source_word: κλητὸς ἀπόστολος
  choice: ein berufener Apostel
  rationale: Gibt die attributive Verbindung direkt und in natürlichem Deutsch wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes »zu sein« einzufügen.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός wird hier als Titel verstanden und daher mit »Messias« wiedergegeben; die Reihenfolge des griechischen Textes bleibt erhalten.
- source_word: διὰ θελήματος θεοῦ
  choice: nach dem Willen Gottes
  rationale: Idiatische deutsche Wiedergabe der göttlichen Bestimmung beziehungsweise Beauftragung, die διά mit Genitiv hier ausdrückt.
- source_word: Σωσθένης
  choice: Sosthenes
  rationale: Im Deutschen gebräuchliche Transliteration des Personennamens.
- source_word: ὁ ἀδελφὸς
  choice: der Bruder
  rationale: Entspricht formal dem bestimmten Artikel und dem maskulinen Verwandtschaftsbegriff im Ausgangstext; der kontextuell mögliche gemeinschaftliche Sinn wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von Χριστός in der paulinischen Absenderangabe
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Die Verbindung bezeichnet Jesus unter seinem messianischen Titel. »Messias« macht den Titelcharakter sichtbar, während »Christus Jesus« die traditionelle kirchliche Form wäre.
- issue: Bezug von ὁ ἀδελφός
  choice: der Bruder
  alternative: unser Bruder
  rationale: Der griechische Text enthält keinen Possessivartikel oder ein Possessivpronomen. Die wörtlichere Form bewahrt dies; im brieflichen Zusammenhang kann der bestimmte Artikel jedoch idiomatisch einen der Gemeinschaft bekannten Bruder bezeichnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung folgt der knappen Absenderangabe des griechischen Briefanfangs und lässt den Satz wegen der Fortsetzung in Vers 2 offen.
