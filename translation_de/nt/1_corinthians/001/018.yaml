id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: de
  text: Denn die Botschaft vom Kreuz[a] ist für die, die zugrunde gehen, Torheit; für uns aber, die gerettet werden[b], ist sie Gottes Kraft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wort vom Kreuz“.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Formulierung stellt die Rettung hier als gegenwärtige, fortdauernde Wirklichkeit dar.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: Botschaft
  rationale: Gemeint ist der verkündigte Inhalt über das Kreuz. „Botschaft“ ist im heutigen Deutsch natürlicher als „Wort“, während die wörtlichere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: σταυροῦ
  choice: vom Kreuz
  rationale: Die knappe Formulierung bewahrt das Bild und die theologische Aussage des griechischen Ausdrucks, ohne ihn erklärend zu „Kreuzigung“ auszuweiten.
- source_word: ἀπολλυμένοις
  choice: die zugrunde gehen
  rationale: Das substantivierte Präsenspartizip bezeichnet Menschen in einem gegenwärtigen, fortschreitenden Zustand. „Zugrunde gehen“ gibt dies natürlicher und genauer wieder als das statische „verloren sind“.
- source_word: μωρία
  choice: Torheit
  rationale: „Torheit“ ist eine würdige, verständliche Entsprechung und bewahrt den scharfen Gegensatz zu Gottes Kraft.
- source_word: σῳζομένοις
  choice: die gerettet werden
  rationale: Die passive und fortdauernde Aussage des Präsenspartizips bleibt erhalten; das ausdrückliche ἡμῖν wird mit „für uns“ wiedergegeben.
- source_word: δύναμις θεοῦ
  choice: Gottes Kraft
  rationale: Die idiomatische deutsche Genitivfügung bewahrt Bedeutung und Nachdruck des griechischen Prädikats.
theological_decisions:
- issue: Zeitlicher Aspekt der Rettung in σῳζομένοις
  choice: die gerettet werden
  alternative: die gerettet sind
  rationale: Das griechische Präsenspartizip stellt Rettung hier als gegenwärtige beziehungsweise fortdauernde Wirklichkeit dar. Die Übersetzung legt sie daher nicht ausschließlich als bereits abgeschlossenes Ereignis aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der Gegensatz zwischen „Torheit“ und „Gottes Kraft“ werden klar bewahrt; das ergänzte „sie“ macht den zweiten Satzteil im Deutschen flüssig, ohne den Sinn zu verändern.
