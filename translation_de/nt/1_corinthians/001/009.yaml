    issue: Überflüssiges zweites „mit“ vor „Jesus“
    rationale: In „… mit seinem Sohn …, mit Jesus …“ erscheint Jesus wie eine zusätzliche Person neben dem Sohn. Im Griechischen ist Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν eine nähere Bestimmung von „seinem Sohn“, nicht ein weiterer präpositionaler Anschluss.
