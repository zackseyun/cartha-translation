  source_fidelity: Der Entwurf gibt πιστὸς („treu“), δι’ οὗ („durch ihn“), das Aoristpassiv ἐκλήθητε („berufen worden seid“), κοινωνία („Gemeinschaft“) sowie die Titel „Messias“ und „Herr“ sachgerecht wieder. Die zweite Präposition „mit“ vor „Jesus“ ist jedoch nicht im Griechischen angelegt und verunklärt die Apposition zu „seinem Sohn“.
  naturalness: „Gott ist treu; durch ihn …“ ist modernes, würdiges Standarddeutsch. Die Apposition „seinem Sohn, Jesus, dem Messias, unserem Herrn“ ist grammatisch eindeutig und vermeidet die im Entwurf entstandene doppelte „mit“-Konstruktion.
  terminology: „Gemeinschaft“, „Messias“ und „Herr“ bewahren die offene bzw. titular geprägte Terminologie des Ausgangstextes. Die Dativformen „dem Messias“ und „unserem Herrn“ stimmen mit der Apposition zu „seinem Sohn“ überein.
  issues:
