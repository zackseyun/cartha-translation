reference: 1 Corinthians 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: de
  text: Gott ist treu; durch ihn seid ihr zur Gemeinschaft mit seinem Sohn, Jesus, dem Messias, unserem Herrn, berufen worden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸς
  choice: treu
  rationale: Das prädikative Adjektiv bezeichnet Gottes verlässliches Wesen; „treu“ ist im Deutschen natürlich und bewahrt das theologische Gewicht.
- source_word: δι’ οὗ
  choice: durch ihn
  rationale: διά mit Genitiv bezeichnet hier die vermittelnde beziehungsweise wirkende Person. „Durch ihn“ gibt die griechische Form direkt und idiomatisch wieder.
- source_word: ἐκλήθητε
  choice: seid ihr … berufen worden
  rationale: Das Aoristpassiv von καλέω bezeichnet Gottes Ruf. „Berufen“ wahrt den paulinischen Sprachgebrauch besser als das schwächere „eingeladen“.
- source_word: κοινωνίαν
  choice: Gemeinschaft
  rationale: κοινωνία umfasst persönliche Gemeinschaft und gemeinsame Teilhabe. „Gemeinschaft“ ist verständlich und lässt diese Bedeutungsbreite offen.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: mit seinem Sohn
  rationale: Der von κοινωνία abhängige Genitiv wird im Deutschen idiomatisch als Gemeinschaft „mit“ einer Person ausgedrückt.
- source_word: Χριστοῦ
  choice: dem Messias
  rationale: Χριστός trägt hier in der Namens- und Titelfolge weiterhin Titelcharakter. „Messias“ übersetzt den Titel, und der Artikel ermöglicht natürliches Deutsch.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die etablierte, kontextgerechte Wiedergabe des christologischen Titels κύριος.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ als „Christus“ oder als übersetzter Titel „Messias“
  choice: Messias
  alternative: Christus
  rationale: Obwohl „Jesus Christus“ im Deutschen formelhafter klingt, ist Χριστός semantisch ein Titel. „Jesus, dem Messias“ macht diesen Titel verständlich, ohne zusätzliche Lehraussagen einzutragen.
- issue: Bedeutungsumfang von κοινωνία
  choice: Gemeinschaft
  alternative: Teilhabe
  rationale: „Gemeinschaft“ bewahrt die personale Beziehung zum Sohn, während der partizipative Aspekt des griechischen Wortes nicht ausgeschlossen wird. Eine Festlegung auf eine sakramentale Bedeutung wäre enger als der Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste griechische Hauptsatz wird als eigener kurzer Satz wiedergegeben. Die Wiederaufnahme „mit Jesus“ verdeutlicht im Deutschen, dass „Jesus, der Messias“ den Sohn näher bestimmt, ohne den Aussagegehalt zu erweitern.
