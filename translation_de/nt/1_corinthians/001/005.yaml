  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: de
  text: Denn in ihm seid ihr in jeder Hinsicht reich gemacht worden, in aller Rede und aller Erkenntnis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion begründet im Zusammenhang den Dank aus dem vorhergehenden Vers; „denn“ gibt diesen kausalen Anschluss natürlich wieder.
- source_word: ἐν παντὶ
  choice: in jeder Hinsicht
  rationale: Die umfassende idiomatische Wendung wird im Deutschen natürlicher so wiedergegeben als mit dem wörtlicheren „in allem“.
- source_word: ἐπλουτίσθητε
  choice: seid ... reich gemacht worden
  rationale: Die Form ist Aorist Passiv. Die Wiedergabe bewahrt sowohl das Empfangen als auch das Bild des Reichmachens, ohne es auf materiellen Reichtum zu verengen.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Formulierung wahrt die räumlich-relationale Sprache des Paulus und löst sie nicht vorschnell in „durch ihn“ auf.
- source_word: ἐν παντὶ λόγῳ
  choice: in allem Reden
  rationale: λόγος kann Wort, Botschaft oder Rede bezeichnen. In der Verbindung mit Erkenntnis liegt hier das sprachliche Äußern nahe; „Reden“ ist verständlich und lässt den genauen Umfang offen.
- source_word: πάσῃ γνώσει
  choice: aller Erkenntnis
  rationale: „Erkenntnis“ entspricht dem paulinischen und theologischen Sprachgebrauch von γνῶσις besser als das allgemeinere „Wissen“ und erhält den Parallelismus.
theological_decisions:
- issue: Bedeutung von ἐν αὐτῷ
  choice: in ihm
  alternative: durch ihn
  rationale: „In ihm“ bewahrt die mögliche Aussage über die Beziehung beziehungsweise Verbundenheit mit Christus, statt ausschließlich ein instrumentales Verständnis festzulegen.
- issue: Umfang von λόγος und γνῶσις
  choice: allem Reden und aller Erkenntnis
  alternative: jeder Rede und jeder Erkenntnis
  rationale: Die kollektive Formulierung gibt die umfassende Aussage wieder, ohne bestimmte Geistesgaben ausdrücklich einzutragen, die der Vers selbst nicht benennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Passivkonstruktion ist bewusst erhalten; der Satz schließt mit „denn“ an Vers 4 an.
