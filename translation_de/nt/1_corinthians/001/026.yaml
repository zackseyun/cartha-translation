reference: 1 Corinthians 1:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: de
  text: 'Denn seht euch eure Berufung an, Brüder und Schwestern[a]: Nicht viele von euch sind nach menschlichen Maßstäben weise, nicht viele mächtig, nicht viele von vornehmer Herkunft.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“. Die Anrede gilt hier der ganzen Gemeinde und schließt gläubige Frauen mit ein.'
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: seht euch … an
  rationale: Die Form kann als Imperativ oder Indikativ verstanden werden. Im Zusammenhang liegt die auffordernde Bedeutung nahe; die Wendung fordert die Gemeinde natürlich und anschaulich zur Betrachtung ihrer eigenen Situation auf.
- source_word: κλῆσιν
  choice: Berufung
  rationale: Gemeint ist Gottes Ruf, durch den die Glaubenden zu seinem Volk gehören, nicht ein Beruf oder gesellschaftlicher Stand.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline griechische Plural dient hier als Anrede der gesamten Gemeinde. Die inklusive deutsche Wiedergabe macht den tatsächlichen Adressatenkreis unmittelbar verständlich; eine Fußnote dokumentiert die Form des Ausgangstextes.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: Nicht viele von euch sind … weise
  rationale: Das im Griechischen aus dem Zusammenhang erschlossene „von euch“ wird für idiomatisches Deutsch ergänzt. Das Präsens entspricht der elliptischen Nominalkonstruktion und vermeidet eine unnötige zeitliche Festlegung.
- source_word: κατὰ σάρκα
  choice: nach menschlichen Maßstäben
  rationale: Die Wendung bezeichnet hier die Beurteilung nach rein menschlichen Kriterien. Eine wörtliche Wiedergabe mit „Fleisch“ wäre im heutigen Deutsch leicht körperlich oder ethisch misszuverstehen.
- source_word: δυνατοί
  choice: mächtig
  rationale: Das Wort bezeichnet gesellschaftliche oder politische Macht beziehungsweise Einfluss, ohne die konkrete Art näher festzulegen.
- source_word: εὐγενεῖς
  choice: von vornehmer Herkunft
  rationale: Das Wort verweist auf angesehene Abstammung beziehungsweise hohen gesellschaftlichen Rang; die Formulierung ist klarer als das heute missverständliche „wohlgeboren“.
theological_decisions:
- issue: Bedeutung von κατὰ σάρκα
  choice: nach menschlichen Maßstäben
  alternative: dem Fleisch nach
  rationale: Im Kontext kontrastiert Paulus menschliche Statusurteile mit Gottes Handeln. Die gewählte Fassung vermittelt diese Perspektive, ohne „Fleisch“ fälschlich als Leiblichkeit oder sündige Natur auszulegen.
- issue: Zeitbezug der dreifachen Aussage
  choice: sind
  alternative: waren
  rationale: Der griechische Text enthält in den drei Gliedern kein ausdrückliches Verb. Das deutsche Präsens beschreibt die Zusammensetzung und gesellschaftliche Stellung der Gemeinde, ohne eine im Ausgangstext nicht festgelegte Vergangenheit einzutragen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung „nicht viele“ bewahrt den rhetorischen Rhythmus und lässt zugleich die wichtige Einschränkung stehen: Paulus sagt nicht „keine“.'
