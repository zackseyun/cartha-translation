  verdict: approve
  source_fidelity: Die Wiedergabe trifft den Sinn des imperativischen Βλέπετε angemessen. „Berufung“ gibt κλῆσις im paulinischen Kontext korrekt wieder; „nach menschlichen Maßstäben“ erschließt κατὰ σάρκα kontextgerecht, ohne eine ethische Bedeutung von „Fleisch“ einzutragen. Die dreifache Einschränkung οὐ πολλοί bleibt vollständig erhalten. Das ergänzte Präsens ist bei der im Griechischen elliptischen Konstruktion eine zulässige, nicht sinnverändernde deutsche Auflösung.
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die Wiederholung von „nicht viele“ bewahrt die rhetorische Struktur des Satzes. „Seht euch eure Berufung an“ ist idiomatisch und als direkte Aufforderung klar.
  terminology: „Brüder und Schwestern“ gibt den tatsächlichen Adressatenkreis der Gemeinde verständlich wieder; die Fußnote dokumentiert transparent, dass der griechische Wortlaut „Brüder“ hat. „Mächtig“ und „von vornehmer Herkunft“ treffen die sozialen Konnotationen von δυνατοί und εὐγενεῖς, ohne sie zu stark einzuengen.
