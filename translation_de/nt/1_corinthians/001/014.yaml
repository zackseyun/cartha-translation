  text: ⸀εὐχαριστῶ ὅτι οὐδένα ὑμῶν ἐβάπτισα εἰ μὴ Κρίσπον καὶ Γάϊον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: de
  text: Ich bin dankbar, dass ich keinen von euch getauft habe außer Krispus und Gaius.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Ich bin dankbar
  rationale: Gibt die präsentische Dankbarkeit des Paulus in natürlichem, modernem Deutsch wieder; „Ich danke“ wäre formaler, verlangt im Deutschen hier aber leicht eine ergänzte Angabe des Adressaten.
- source_word: ὅτι
  choice: dass
  rationale: Leitet hier den Inhalt der Dankbarkeit ein und entspricht der griechischen Konstruktion idiomatisch.
- source_word: οὐδένα ὑμῶν
  choice: keinen von euch
  rationale: Bewahrt die direkte Verneinung und spricht die korinthischen Adressaten klar an.
- source_word: ἐβάπτισα
  choice: getauft habe
  rationale: „Taufen“ ist die etablierte, konfessionell möglichst neutrale deutsche Wiedergabe von βαπτίζω und legt die Taufweise nicht fest.
- source_word: εἰ μὴ
  choice: außer
  rationale: Gibt die ausschließende Ausnahmeformel knapp und idiomatisch wieder.
- source_word: Κρίσπον
  choice: Krispus
  rationale: Der Personenname wird nach geläufiger deutscher biblischer Namensform wiedergegeben.
- source_word: Γάϊον
  choice: Gaius
  rationale: Der Personenname wird nach geläufiger deutscher biblischer Namensform wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wortstellung hält die Betonung auf der sehr begrenzten Zahl der von Paulus selbst Getauften, ohne eine Bewertung der Taufe einzutragen.
