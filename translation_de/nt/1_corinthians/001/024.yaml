  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: de
  text: Für diejenigen aber, die berufen sind – sowohl Juden als auch Griechen –, ist der Messias[a] Gottes Kraft und Gottes Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: die berufen sind
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die durch Gottes Ruf gekennzeichnet sind. Die verbale Formulierung ist im heutigen Deutsch natürlicher und bewahrt den Rufcharakter.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: Juden wie Griechen
  rationale: Die Paarung gibt die ausdrückliche ethnisch-religiöse Gegenüberstellung des griechischen Textes knapp wieder; „Griechen“ wird nicht deutend zu „Nichtjuden“ erweitert.
- source_word: Χριστόν
  choice: Messias
  rationale: Χριστός ist hier als Titel gebraucht. „Messias“ macht dessen Bedeutungsgehalt im Deutschen sichtbar; „Christus“ bleibt als geläufige Alternative in der Fußnote erhalten.
- source_word: θεοῦ δύναμιν καὶ θεοῦ σοφίαν
  choice: Gottes Kraft und Gottes Weisheit
  rationale: Die wiederholte Genitivverbindung wird durch die zweimalige Nennung von „Gottes“ bewahrt und klingt zugleich natürlich und würdig.
- source_word: implicit copula / verbless predicate relation
  choice: ist der Messias Gottes Kraft und Gottes Weisheit
  rationale: Der griechische Satz ist elliptisch und schließt syntaktisch an den vorherigen Vers an. Das ergänzte „ist“ gibt die prädikative Beziehung verständlich wieder, ohne zusätzliche Aussage einzuführen.
theological_decisions:
- issue: Wiedergabe von Χριστός als christologischem Titel
  choice: Messias
  alternative: Christus
  rationale: „Messias“ übersetzt den Titel semantisch, statt ihn lediglich in seiner traditionellen griechisch-lateinischen Form wiederzugeben. Die geläufige Form „Christus“ wird als echte Übersetzungsalternative ausgewiesen.
- issue: Beziehung des Messias zu Gottes Kraft und Weisheit
  choice: prädikative Aussage mit „ist“
  alternative: 'elliptische Fortführung: „verkündigen wir den Messias als Gottes Kraft und Gottes Weisheit“'
  rationale: Der unmittelbare Kontext erlaubt die Fortführung von „wir verkündigen“, doch die prädikative Wiedergabe wahrt die knappe Aussage des Verses und entspricht der erkennbaren Satzbeziehung, ohne die christologische Spannung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Juden wie Griechen“ ist knapp und idiomatisch; die Wiederholung „Gottes … Gottes“ erhält den rhetorischen Parallelismus.
