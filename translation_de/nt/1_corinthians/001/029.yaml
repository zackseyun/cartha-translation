  text: so that no flesh may boast before God[a].
translation:
  language: de
  text: damit sich kein Mensch vor Gott rühmen kann[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »damit sich kein Fleisch vor Gott rühmt«; gemeint ist: kein Mensch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet einen Zweck- beziehungsweise Ergebnissatz ein und gibt die Zielrichtung im modernen Deutsch natürlich wieder.
- source_word: μὴ … πᾶσα σὰρξ
  choice: kein Mensch
  rationale: Die Verneinung im Zwecksatz schließt jeden Menschen ein. Das griechische »alles Fleisch« bezeichnet hier die Menschheit in ihrer geschöpflichen Schwäche; die idiomatische Wiedergabe vermeidet im Deutschen das mögliche Missverständnis von »Fleisch« als Körper oder Nahrungsmittel.
- source_word: καυχήσηται
  choice: sich … rühmen kann
  rationale: Der Aorist Konjunktiv im ὅπως-Satz wird mit »kann« natürlich ausgedrückt; das reflexive »sich rühmen« entspricht dem medialen Verb und bezeichnet Selbstruhm.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Knappes, idiomatisches Deutsch für das Handeln in Gottes Gegenwart beziehungsweise vor seinem Angesicht.
theological_decisions:
- issue: Wiedergabe von πᾶσα σὰρξ im paulinischen Kontext
  choice: kein Mensch
  alternative: kein Fleisch
  rationale: Gemeint ist nicht eine sündige Wesenskomponente im Menschen, sondern ausnahmslos jeder Mensch in seiner geschöpflichen Begrenztheit vor Gott. »Kein Mensch« vermittelt diesen Bezug im Deutschen klar, während eine Fußnote den wörtlichen Ausdruck und seine biblische Bildsprache bewahrt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Hauptzeile setzt natürliche Verständlichkeit vor formale Nachbildung; die Fußnote bewahrt den markanten griechischen Ausdruck »alles Fleisch« unter der Verneinung.
