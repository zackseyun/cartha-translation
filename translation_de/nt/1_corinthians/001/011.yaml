id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: de
  text: Denn über euch, meine Brüder[a], ist mir von Chloës Leuten berichtet worden, dass es Streitigkeiten unter euch gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Brüder und Schwestern“. Im Griechischen steht „Brüder“; die Anrede kann hier die ganze glaubende Gemeinschaft einschließlich der Frauen umfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: ist mir berichtet worden
  rationale: Die passive Form bezeichnet eine Mitteilung an Paulus. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt das Passiv.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ erhält den begründenden Anschluss an die vorangehende Ermahnung.
- source_word: περὶ ὑμῶν
  choice: über euch
  rationale: Dies gibt die Bedeutung der Präpositionalphrase im heutigen Standarddeutsch knapp und natürlich wieder.
- source_word: ἀδελφοί μου
  choice: meine Brüder
  rationale: Die Übersetzung bildet den maskulinen griechischen Plural formal ab; der wahrscheinlich inklusive Bezug auf die ganze Gemeinde wird in der Fußnote erläutert.
- source_word: ὑπὸ τῶν Χλόης
  choice: von Chloës Leuten
  rationale: Die Wendung bezeichnet Personen, die Chloe zugeordnet sind. „Leute“ vermeidet die nicht ausdrücklich im Text enthaltene Festlegung auf ihren Haushalt.
- source_word: ἔριδες
  choice: Streitigkeiten
  rationale: Der Plural bezeichnet konkrete zwischenmenschliche Konflikte. „Streitigkeiten“ ist gegenwärtig, verständlich und präziser als das weiter gefasste „Spaltungen“.
- source_word: ἐν ὑμῖν εἰσιν
  choice: es ... unter euch gibt
  rationale: Die existenziale Aussage wird so idiomatisch und bedeutungsgetreu ins Deutsche übertragen.
theological_decisions:
- issue: Wiedergabe von ἀδελφοί im Kontext einer wahrscheinlich gemischtgeschlechtlichen Gemeinde
  choice: meine Brüder
  alternative: meine Brüder und Schwestern
  rationale: Der Haupttext bewahrt die grammatisch maskuline Form des Griechischen. Dass die Anrede wahrscheinlich die gesamte glaubende Gemeinschaft einschließlich der Frauen umfasst, wird ausdrücklich in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält den erklärenden Zusammenhang und die Herkunft der Nachricht deutlich fest, ohne das etwas ungewöhnliche griechische „die von Chloe“ durch „Haushalt“ zu überdeuten.
