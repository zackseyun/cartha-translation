id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: de
  text: Denn da die Welt in der Weisheit Gottes Gott nicht durch Weisheit erkannte, gefiel es Gott, durch die Torheit der Verkündigung[a] die zu retten, die glauben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Torheit des Predigens“. Das griechische Wort kann die verkündete Botschaft bezeichnen und zugleich den Vorgang des Verkündigens anklingen lassen. „Torheit“ beschreibt, wie die Welt diese Verkündigung beurteilt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Denn da
  rationale: „Denn“ wahrt den erklärenden Rückbezug von γάρ, während „da“ den begründenden beziehungsweise umstandsbezogenen Sinn von ἐπειδή natürlich wiedergibt.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: in der Weisheit Gottes
  rationale: 'Die formal nahe Wiedergabe erhält die Mehrdeutigkeit von ἐν: Das Geschehen kann im Bereich, im Rahmen oder gemäß der Weisheit Gottes verstanden werden, ohne vorschnell eine instrumentale Deutung festzulegen.'
- source_word: οὐκ ἔγνω ὁ κόσμος … τὸν θεόν
  choice: die Welt … Gott nicht … erkannte
  rationale: „Erkennen“ bewahrt sowohl die gedankliche als auch die personale Dimension von γινώσκω; „die Welt“ ist die geläufige und offene Wiedergabe von κόσμος.
- source_word: διὰ τῆς σοφίας
  choice: durch Weisheit
  rationale: „Durch“ gibt διά mit Genitiv als Mittel wieder. Der Verzicht auf „ihre“ vermeidet eine im griechischen Text nicht ausdrücklich enthaltene Festlegung.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: gefiel es Gott
  rationale: Diese Wendung bewahrt den Gedanken des göttlichen Wohlgefallens und ist im Deutschen würdevoll und verständlich.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: durch die Torheit der Verkündigung
  rationale: „Verkündigung“ kann sowohl die verkündete Botschaft als auch den Vorgang des öffentlichen Verkündigens anklingen lassen. „Torheit“ erhält Paulus’ bewusst anstößige Formulierung.
- source_word: σῶσαι
  choice: zu retten
  rationale: „Retten“ ist die klare, übliche Wiedergabe von σῴζω und bewahrt dessen umfassende heilsgeschichtliche Bedeutung.
- source_word: τοὺς πιστεύοντας
  choice: die, die glauben
  rationale: Die substantivierte Präsenspartizipialform wird in natürlichem, allgemein verständlichem Deutsch wiedergegeben, ohne zusätzliche lehrmäßige Aussagen einzutragen.
theological_decisions:
- issue: Bedeutung von διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: „die Torheit der Verkündigung“ mit Schwerpunkt auf der verkündeten Botschaft, jedoch offen für den Vorgang des Verkündigens
  alternative: „die Torheit des Predigens“
  rationale: κήρυγμα bezeichnet häufig den Inhalt dessen, was öffentlich ausgerufen wird, kann im Zusammenhang aber den Verkündigungsvorgang mitschwingen lassen. Die gewählte Formulierung und die Fußnote erhalten diese Spannung. Die Botschaft ist dabei aus Sicht der Welt töricht; der Text sagt nicht, dass Gott sie für töricht hält.
- issue: Bezug von ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: „in der Weisheit Gottes“
  alternative: „durch die Weisheit Gottes“ oder „nach Gottes weisem Plan“
  rationale: Die griechische Präposition lässt mehr als eine Nuance zu. Eine formal offene Wiedergabe vermeidet es, Gottes Weisheit ausschließlich als Mittel oder als Plan zu deuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Satzbau. Die Wiederholung von „Welt“ beziehungsweise „Gott“ und „Weisheit“ wird als Teil der paulinischen Argumentation bewahrt. Die Formulierung bleibt bei theologischen und syntaktischen Mehrdeutigkeiten bewusst zurückhaltend.
