  terminology: „Weisheit“, „Welt“, „Torheit“, „Verkündigung“ und „retten“ sind fachlich wie allgemeinsprachlich passende Wiedergaben. Die Fußnote bietet die legitime Alternative „des Predigens“ und erläutert die mögliche Doppelbedeutung ohne eine konfessionelle Auslegung festzuschreiben.
