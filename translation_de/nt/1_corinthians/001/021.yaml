  source_fidelity: Der Entwurf gibt die kausale Verbindung von ἐπειδὴ γάρ mit „Denn da“ angemessen wieder und bewahrt die offene Nuance von ἐν τῇ σοφίᾳ τοῦ θεοῦ durch „in der Weisheit Gottes“. „Die Welt ... Gott nicht durch Weisheit erkannte“ entspricht dem griechischen Satzbau und den Wiederholungen. „Gefiel es Gott“ trifft εὐδόκησεν idiomatisch; „durch die Torheit der Verkündigung“ wahrt die in κήρυγμα enthaltene Spannung zwischen Botschaft und Verkündigungsvorgang. „Die zu retten, die glauben“ gibt σῶσαι τοὺς πιστεύοντας vollständig wieder.
