id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: de
  text: Ist der Messias[a] geteilt worden? Ist etwa Paulus für euch gekreuzigt worden? Oder seid ihr auf den Namen des Paulus getauft worden?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „in den Namen des Paulus hinein getauft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: ist … geteilt worden
  rationale: Das deutsche Perfekt Passiv gibt die griechische Perfektform wieder und bezeichnet eine vollzogene Teilung mit fortbestehendem Ergebnis.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Der Artikel hebt hier den Titelcharakter hervor; „Messias“ gibt die Bedeutung des griechischen Titels transparent wieder.
- source_word: μὴ
  choice: etwa
  rationale: „Etwa“ kennzeichnet im Deutschen natürlich die rhetorische Frage, auf die eine verneinende Antwort erwartet wird.
- source_word: ἐσταυρώθη ὑπὲρ ὑμῶν
  choice: für euch gekreuzigt worden
  rationale: Die Formulierung bewahrt das Passiv und gibt ὑπέρ knapp und ohne dogmatische Überbestimmung mit „für“ wieder.
- source_word: εἰς τὸ ὄνομα Παύλου
  choice: auf den Namen des Paulus
  rationale: „Auf den Namen … taufen“ ist im Deutschen eine natürliche, etablierte Wiedergabe der Taufformel und bewahrt den Bezug auf Zugehörigkeit beziehungsweise Bindung; die stärker räumliche Form wird in der Fußnote genannt.
- source_word: ἐβαπτίσθητε
  choice: seid ihr … getauft worden
  rationale: Das deutsche Perfekt Passiv entspricht der passiven griechischen Form und klingt in der direkten Frage natürlich.
theological_decisions:
- issue: Wiedergabe von ὁ Χριστός in der rhetorischen Frage
  choice: der Messias
  alternative: der Christus
  rationale: Die artikulierte Form ist hier deutlich als Titel verständlich. „Messias“ macht dessen Bedeutung für heutige Leser sichtbar, während die traditionelle Alternative in einer Fußnote erhalten bleibt.
- issue: Bedeutung der Taufe εἰς τὸ ὄνομα
  choice: auf den Namen des Paulus
  alternative: in den Namen des Paulus hinein
  rationale: Die Hauptfassung bleibt idiomatisch und lässt die möglichen Nuancen von Zugehörigkeit, Bindung und Beauftragung offen; die Fußnote bewahrt die Richtungsbedeutung von εἰς, ohne sie im Haupttext unnatürlich zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei zugespitzten Fragen und ihre rhetorische Wirkung bleiben erhalten; „etwa“ macht die durch μή erwartete verneinende Antwort sichtbar.
