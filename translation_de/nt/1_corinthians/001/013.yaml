  naturalness: Modernes, würdiges Standarddeutsch. Die Formulierungen sind klar und die Abfolge der kurzen rhetorischen Fragen wirkt natürlich. Die etwas stärkere, richtungsbezogene Alternative zu εἰς ist sinnvoll in der Fußnote statt im Haupttext untergebracht.
  terminology: „der Messias“ gibt den titulären Gebrauch von ὁ Χριστός transparent wieder; die traditionelle Alternative „der Christus“ ist korrekt verankert. „Paulus“, „gekreuzigt“ und die Taufterminologie sind konsistent und registergerecht.
