  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: de
  text: Ich danke meinem Gott immer für euch[a] wegen der Gnade Gottes, die euch in Jesus, dem Messias[b], gegeben wurde.
  philosophy: optimal-equivalence
  footnotes:
