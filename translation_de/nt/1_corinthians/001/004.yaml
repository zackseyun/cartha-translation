  source_fidelity: 'Der Entwurf gibt alle Satzelemente zuverlässig wieder: προσωπliches Danken an Gott, die fortdauernde Zeitangabe, den Bezug auf die Adressaten, den Anlass in Gottes Gnade, deren passive Gabe an die Adressaten, sowie die offene relationale Bedeutung von ἐν. Die Wiedergabe von Χριστός als „Messias“ ist sachgerecht und wahrt den Titelcharakter.'
  naturalness: „Allezeit“ ist verständlich, wirkt im modernen Standarddeutsch jedoch leicht archaisierend. Vor allem ist „im Messias Jesus“ als Personenbezeichnung im Deutschen ungewohnt und kann den Lesefluss stören. „in Jesus, dem Messias“ ist idiomatischer, erhält „in“ und macht den Titel transparent.
  terminology: „Gnade Gottes“ und „Messias“ sind angemessen. Die appositionelle Form „Jesus, dem Messias“ ist im Deutschen die natürliche Weise, den Titel ohne die stark konventionalisierte, aber weniger übersetzende Form „Christus Jesus“ wiederzugeben.
