lexical_decisions:
- source_word: Εὐχαριστῶ τῷ θεῷ μου
  choice: Ich danke meinem Gott
  rationale: Das griechische Präsens wird natürlich als deutsches Präsens wiedergegeben. „Meinem Gott“ bewahrt das ausdrücklich vorhandene Possessivpronomen und entspricht dem deutschen Sprachgebrauch mit „danken“.
- source_word: πάντοτε
  choice: allezeit
  rationale: „Allezeit“ gibt den umfassenden zeitlichen Sinn prägnant wieder und passt zum würdevollen, zugleich verständlichen Register eines paulinischen Dankgebets.
- source_word: περὶ ὑμῶν
  choice: für euch
  rationale: In einer Danksagungsformel ist „für euch“ die natürlichste deutsche Wiedergabe; die stärker gegenstandsbezogene Alternative „euretwegen“ bleibt in der Fußnote erhalten.
- source_word: ἐπὶ τῇ χάριτι τοῦ θεοῦ
  choice: wegen der Gnade Gottes
  rationale: ἐπί mit dem Dativ bezeichnet hier den Grund oder Anlass des Dankes. „Wegen“ macht diese Beziehung klar, ohne den Genitiv „Gottes“ unnötig als reine Herkunftsangabe festzulegen.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: die euch … gegeben worden ist
  rationale: Die passive Partizipialkonstruktion wird als natürlicher deutscher Relativsatz wiedergegeben. Das Passiv bleibt erhalten und lässt Gott im Zusammenhang als Geber erkennen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: „Messias“ gibt die titulare Bedeutung von Χριστός wieder; „in“ wird bewahrt, da die paulinische Wendung mehr als bloß Vermittlung oder Zugehörigkeit ausdrücken kann.
theological_decisions:
- issue: Bedeutung der Wendung ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: durch den Messias Jesus; in Gemeinschaft mit dem Messias Jesus
  rationale: Die knappe räumlich-relationale Formulierung bewahrt die theologische Bedeutungsbreite von ἐν, statt sie ausschließlich als Mittel oder Gemeinschaft zu deuten.
- issue: Wiedergabe des Titels Χριστός
  choice: Messias
  alternative: Christus
  rationale: „Messias“ macht den Sinn des griechischen Titels für heutige Leser unmittelbar sichtbar. Die kirchlich vertraute Form „Christus Jesus“ wird als lexikalische Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Allezeit“ ist leicht gehoben, aber allgemein verständlich. „Im Messias Jesus“ ist bewusst näher am Titelgehalt des griechischen Χριστός; die geläufigere kirchliche Form steht in der Fußnote.
