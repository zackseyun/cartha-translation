source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: de
  text: an die Gemeinde Gottes in Korinth, an die, die in Christus Jesus geheiligt und zu Heiligen berufen sind, zusammen mit allen, die an jedem Ort den Namen unseres Herrn Jesus Christus anrufen, bei ihnen wie bei uns:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an jedem Ort, ihrem und unserem“. Die knappe griechische Formulierung kann sich auf die Orte beziehen („bei ihnen wie bei uns“) oder auf den Herrn („ihr und unser Herr“).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: Gemeinde Gottes
  rationale: „Gemeinde“ bezeichnet im modernen Deutschen natürlich die örtliche Gemeinschaft der Glaubenden und bewahrt den gemeinschaftlichen Sinn von ἐκκλησία.
- source_word: ἡγιασμένοις
  choice: die … geheiligt sind
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Heiligung mit fortdauernder Wirkung; die Formulierung erhält sowohl das passive Handeln als auch das Ergebnis.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Christus Jesus
  rationale: „Christus Jesus“ ist im Deutschen die natürliche und etablierte Wiedergabe der paulinischen Namens- und Titelformel; „Messias Jesus“ wäre hier unidiomatisch.
- source_word: κλητοῖς ἁγίοις
  choice: zu Heiligen berufen
  rationale: Die Wendung gibt die beiden adjektivischen Bestimmungen verständlich wieder, ohne Heiligkeit als besondere kirchliche Auszeichnung misszuverstehen.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: die … den Namen … anrufen
  rationale: „Den Namen anrufen“ bewahrt den biblischen Sprachgebrauch und die Bedeutung von Gebet, Bekenntnis und Verehrung.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die sachlich und traditionell angemessene Wiedergabe von κύριος in diesem christologischen Bekenntnis.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: Im modernen deutschen Bibelregister ist „Jesus Christus“ die natürliche Form, wobei „Christus“ weiterhin den messianischen Titel trägt.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: an jedem Ort … – ihres und unseres Herrn
  rationale: Die Genitive αὐτῶν καὶ ἡμῶν können grammatisch am ehesten auf κύριος bezogen werden; die Zeichensetzung macht diese Lesart verständlich, während eine Fußnote die syntaktische Mehrdeutigkeit wahrt.
theological_decisions:
- issue: Bedeutung von κλητοῖς ἁγίοις
  choice: zu Heiligen berufen
  alternative: berufene Heilige
  rationale: Die gewählte Formulierung ist im Deutschen verständlicher und bringt Berufung und geheiligte Zugehörigkeit zusammen, ohne eine spätere kanonisierte Heiligenklasse anzudeuten.
- issue: Bezug von αὐτῶν καὶ ἡμῶν
  choice: ihres und unseres Herrn
  alternative: an jedem Ort – ihrem und unserem
  rationale: Die Nähe und Kasusübereinstimmung erlauben den Bezug auf „Herrn“; weil die komprimierte griechische Syntax auch anders gegliedert werden kann, wird die Unsicherheit ausdrücklich vermerkt.
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: Messias
  rationale: Im Deutschen ist „Christus“ die geläufige, würdevolle Wiedergabe in diesen paulinischen Formeln und bleibt als Titel verständlich; „Messias Jesus“ beziehungsweise „Jesus, der Messias“ würde die Formel stärker explizieren als der griechische Wortlaut.
translation_notes:
  register: Moderner, würdevoller deutscher Briefstil. „Gemeinde“, „geheiligt“, „zu Heiligen berufen“ und „den Namen … anrufen“ sind verständlich, bewahren aber den theologischen und kultischen Gehalt des griechischen Textes. Der Vers ist als Fortsetzung der Absenderangabe in Vers 1 formuliert.
