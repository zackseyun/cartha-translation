  naturalness: 'Der Briefstil ist insgesamt natürlich und angemessen. „an jedem Ort den Namen … anrufen – ihres und unseres Herrn“ ist jedoch im Deutschen syntaktisch schwer nachvollziehbar: Der Nachtrag kann zunächst wie eine erneute Bestimmung zu „Ort“ wirken, während „Herrn“ schon vorangeht. „bei ihnen wie bei uns“ ist idiomatischer und gibt die naheliegende Ortslesart wieder.'
  terminology: „Gemeinde Gottes“, „in Christus Jesus geheiligt“, „zu Heiligen berufen“, „den Namen … anrufen“ und „Herrn Jesus Christus“ sind im modernen deutschen Bibelregister tragfähig. „Christus“ ist in diesen festen paulinischen Formeln eine natürliche deutsche Wiedergabe; gegenüber der englischen Audit-Trail-Entscheidung „Messiah“ ist dies keine sachwidrige Bedeutungsänderung.
