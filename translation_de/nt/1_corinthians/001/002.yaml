  to: an die Gemeinde Gottes in Korinth, an die, die in Christus Jesus geheiligt und zu Heiligen berufen sind, zusammen mit allen, die an jedem Ort den Namen unseres Herrn Jesus Christus anrufen, bei ihnen wie bei uns:[a]
  rationale: Die Revision bewahrt den natürlichen deutschen Briefstil und sämtliche wesentlichen Begriffe, ohne den mehrdeutigen Schlussgenitiv auf „Herrn“ festzulegen. Die Ortslesung „bei ihnen wie bei uns“ ist im Deutschen klar und wird durch eine Fußnote ergänzt, die die alternative Herr-Lesung ausdrücklich erhält. Der Fußnotenanker wurde an die tatsächlich betroffene Formulierung gesetzt.
