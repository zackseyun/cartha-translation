id: 1CO.1.25
reference: 1 Corinthians 1:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: de
  text: Denn das Törichte Gottes ist weiser als die Menschen, und das Schwache Gottes ist stärker als die Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Begründet die vorausgehende Aussage; im Deutschen ist „Denn“ hier natürlich und wahrt den argumentativen Zusammenhang.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: das Törichte Gottes
  rationale: Die substantivierte Adjektivform bleibt erhalten und wird nicht zur abstrakteren „Torheit Gottes“ umgedeutet.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: weiser als die Menschen
  rationale: Der griechische Komparativ mit Genitiv wird idiomatisch wiedergegeben; ἄνθρωποι bezeichnet Menschen allgemein.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: das Schwache Gottes
  rationale: Bewahrt die Parallelstruktur und die bewusst zugespitzte Formulierung des Ausgangstextes.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: stärker als die Menschen
  rationale: Gibt den Komparativ klar und parallel zum ersten Satzglied wieder.
theological_decisions:
- issue: Die paradoxen Genitivverbindungen „das Törichte Gottes“ und „das Schwache Gottes“
  choice: Wörtlich-paradox stehen lassen
  alternative: „Was an Gott töricht/schwach erscheint“
  rationale: Der griechische Text erklärt die Paradoxie nicht ausdrücklich. Eine Ergänzung wie „erscheint“ würde die theologische Spannung interpretierend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die strenge Zweigliedrigkeit und der rhetorische Parallelismus des griechischen Satzes bleiben erhalten.
