  text: ἐπειδὴ καὶ Ἰουδαῖοι ⸀σημεῖα αἰτοῦσιν καὶ Ἕλληνες σοφίαν ζητοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/022.yaml
  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: de
  text: Denn die Juden bitten um Zeichen[a], und die Griechen suchen Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zeichen“ kann hier auch als „Wunderzeichen“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: Denn
  rationale: Leitet hier die Begründung für den Zusammenhang ein und gibt den kausalen Sinn im Deutschen natürlich wieder.
- source_word: Ἰουδαῖοι
  choice: die Juden
  rationale: Bezeichnet hier die jüdische Gruppe im kulturell-religiösen Kontrast zu den Griechen.
- source_word: σημεῖα
  choice: Zeichen
  rationale: Bewahrt die Breite des griechischen Ausdrucks; im Zusammenhang sind übernatürliche Beglaubigungszeichen mitgemeint, ohne dass dies im Haupttext ausdrücklich ergänzt werden muss.
- source_word: αἰτοῦσιν
  choice: fordern
  rationale: Gibt das erwartungsvolle Verlangen in diesem rhetorischen Zusammenhang idiomatisch wieder; „bitten um“ wäre möglich, klingt hier jedoch zu schwach.
- source_word: Ἕλληνες
  choice: die Griechen
  rationale: Bewahrt den spezifischen kulturellen Rahmen des griechischen Wortlauts, der durch die anschließende Suche nach Weisheit unterstrichen wird.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Ist die direkte und ausreichend breite Entsprechung, ohne den Begriff vorschnell auf Philosophie einzuengen.
- source_word: ζητοῦσιν
  choice: suchen
  rationale: Entspricht dem griechischen Verb eng und bewahrt den durativen Sinn der Präsensform.
