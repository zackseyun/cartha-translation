translation:
  language: de
  text: Gnade euch und Frieden von Gott, unserem Vater, und dem Herrn Jesus, dem Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Herrn Jesus Christus“.'
    reason: Lexikalische Alternative für Χριστός.
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ ist der geläufige und inhaltlich gewichtige Ausdruck für den paulinischen Grußbegriff; „Gunst“ wäre hier zu eng und zu nüchtern.
- source_word: ὑμῖν
  choice: seien mit euch
  rationale: Die knappe Dativformel wird als natürlicher deutscher Segensgruß wiedergegeben. Das ergänzte Verb macht den im Griechischen verblosen Satz verständlich.
- source_word: εἰρήνη
  choice: Frieden
  rationale: „Frieden“ bewahrt sowohl den allgemeinen Sinn als auch die gemeinschaftliche und heilsgeschichtliche Resonanz des Wortes.
- source_word: ἀπὸ
  choice: von
  rationale: „Von“ kennzeichnet knapp und unmittelbar den Ursprung von Gnade und Frieden.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Gott, unserem Vater
  rationale: Die Apposition gibt die griechische Verbindung natürlich wieder, ohne daraus die anders gebaute Formulierung „unserem Gott und Vater“ zu machen.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die natürliche deutsche Wiedergabe des Titels und bewahrt dessen theologisches Gewicht.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: Χριστός wird als Titel „Messias“ wiedergegeben. Die appositionale Form mit Artikel ist im Deutschen idiomatisch und macht den Titelcharakter deutlich.
theological_decisions:
- issue: Gemeinsamer Ursprung von Gnade und Frieden in Gott dem Vater und dem Herrn Jesus
  choice: Ein einziges „von“ regiert sowohl „Gott, unserem Vater“ als auch „dem Herrn Jesus, dem Messias“.
  alternative: Das „von“ vor dem Herrn Jesus wiederholen oder die Zuordnung syntaktisch abschwächen.
  rationale: Auch im Griechischen stehen beide unter derselben Präposition ἀπό. Die Übersetzung erhält diese Koordination, ohne sie dogmatisch auszudeuten.
- issue: Wiedergabe von Χριστός als Titel oder konventioneller Namensbestandteil
  choice: Messias
  alternative: Christus
  rationale: Die Wiedergabe als „Messias“ bewahrt die erkennbare Bedeutung des griechischen Titels; die traditionelle Form „Christus“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im Griechischen fehlende Kopula wird mit „seien mit euch“ ergänzt; der Gedankenstrich hält den Segenswunsch flüssig und lässt zugleich erkennen, dass sowohl Gnade als auch Frieden von den beiden koordinierten Genannten ausgehen.
