  - severity: low
    issue: Der Gedankenstrich ist für die Herkunftsangabe unnötig stark.
    rationale: Die griechische Präpositionalphrase schließt unmittelbar an den Gruß an. Ein Komma entspricht dem deutschen Briefstil und der griechischen Gliederung unauffälliger.
