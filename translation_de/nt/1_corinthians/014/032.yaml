base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/032.yaml
  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: de
  text: Und die Geister der Propheten ordnen sich den Propheten unter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die den Propheten zugehörigen Geister ordnen sich den Propheten unter.“ Die Wendung kann prophetische Impulse oder geistliches Wirken bezeichnen, das mit Propheten verbunden ist, und hebt hervor, dass prophetisches Reden nicht mit Kontrollverlust einhergeht.'
    reason: Lexikalische und syntaktische Mehrdeutigkeit der Wendung πνεύματα προφητῶν.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche Anschluss führt einen weiteren begründenden Satz in Paulus’ Gedankengang ein.
- source_word: πνεύματα
  choice: Geister
  rationale: 'Die formnahe Wiedergabe bewahrt die Mehrdeutigkeit: Gemeint sein können die den Propheten zugehörigen Geister, prophetische Impulse oder geistliches Wirken; eine erklärende Paraphrase im Haupttext wäre zu eng.'
- source_word: προφητῶν
  choice: der Propheten
  rationale: Der Genitiv Plural wird natürlich und formal entsprechend wiedergegeben, ohne seine genaue Beziehung zu „Geister“ vorschnell festzulegen.
- source_word: προφήταις
  choice: den Propheten
  rationale: Der Dativ bezeichnet bei ὑποτάσσεται diejenigen, denen sich die Geister unterordnen. Die deutsche Konstruktion „sich jemandem unterordnen“ bildet dies klar ab.
- source_word: ὑποτάσσεται
  choice: ordnen sich … unter
  rationale: Die mediale beziehungsweise passive Form lässt sich im Deutschen idiomatisch reflexiv wiedergeben. Beim griechischen Neutrum Plural steht das Verb im Singular; Deutsch verlangt hier den Plural.
theological_decisions:
- issue: Bedeutung von „Geister der Propheten“ im Blick auf prophetische Selbstkontrolle
  choice: Die Formulierung bleibt wörtlich genug, um prophetische Impulse oder geistliches Wirken, das mit Propheten verbunden ist, einzuschließen, und betont zugleich deren Unterordnung.
  alternative: Gemeint sind ausschließlich die menschlichen Geister der Propheten, die anderen Propheten unterstehen, oder prophetische Botschaften, die von Propheten beurteilt werden.
  rationale: Der Zusammenhang von 1. Korinther 14,29–33 betrifft geordnete prophetische Rede. Die Übersetzung soll die Verantwortlichkeit und Beherrschbarkeit prophetischen Wirkens erkennen lassen, ohne die mehrdeutige Genitivverbindung durch eine dogmatisch engere Deutung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich unterordnen“ ist verständlich und bildet die Unterordnungsrelation genauer ab als freiere Formulierungen wie „lassen sich beherrschen“. Die Fußnote bewahrt die sachliche Mehrdeutigkeit.
