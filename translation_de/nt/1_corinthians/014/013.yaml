  source_fidelity: Der Schlussfolgerungscharakter von Διό, die generische Person, die Aufforderung zu beten und das Ziel der Auslegung sind zutreffend erfasst. Die griechische Singularform von γλώσσῃ muss im Deutschen jedoch nicht mechanisch als „in einer Zunge“ nachgebildet werden, da diese Formulierung unidiomatisch ist. Das im Deutschen etablierte „in Zungen reden“ bewahrt die im Kontext offene, fachsprachlich geprägte Bedeutung besser.
  naturalness: „Wer in einer Zunge redet“ ist im modernen Standarddeutsch nicht natürlich; „in Zungen reden“ ist die geläufige und verständliche Wendung. Außerdem ist „darum beten“ nach dem bereits vorangestellten „Deshalb“ missverständlich. „Beten, damit er sie auslegen kann“ gibt den finalen Zusammenhang klar wieder.
  terminology: „Zungen“ und „auslegen“ sind im Zusammenhang von 1. Korinther 12–14 angemessen und legen die Art der Rede nicht auf gewöhnliche Fremdsprachen oder auf eine bestimmte theologische Deutung fest. Die Fußnote soll die griechische Singularform als sprachliche Alternative erläutern, ohne die deutsche Hauptformulierung als wörtliche Wiedergabe auszugeben.
