  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: de
  text: Deshalb soll, wer in Zungen[a] redet, beten, damit er sie auslegen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einer Sprache«. Wörtlich steht im Griechischen »in einer Zunge« (Singular). »In Zungen reden« ist im Deutschen die übliche Wendung für die in diesem Kapitel behandelte Rede, die ausgelegt werden muss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Deshalb
  rationale: Die Folgerungspartikel zieht eine Schlussfolgerung aus dem vorangehenden Gedankengang; »Deshalb« gibt diese logische Funktion in natürlichem Gegenwartsdeutsch wieder.
- source_word: ὁ λαλῶν
  choice: wer … redet
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein die redende Person. Die Konstruktion mit »wer« bewahrt den generischen Singular und klingt im Deutschen natürlich.
- source_word: γλώσσῃ
  choice: in einer Zunge
  rationale: Der Dativ Singular wird beibehalten. »Zunge« erhält den charakteristischen Sprachgebrauch dieses Kapitels und legt nicht vorschnell fest, ob eine menschliche Fremdsprache, ekstatische Rede oder eine weiter gefasste Erscheinung gemeint ist.
- source_word: προσευχέσθω
  choice: soll … beten
  rationale: Der Imperativ der dritten Person hat auffordernden Charakter. »soll … beten« ist klar, würdig und in modernem Deutsch idiomatisch.
- source_word: ἵνα
  choice: dass
  rationale: Die Konjunktion führt hier Ziel beziehungsweise Inhalt des Gebets ein. Nach »darum beten« ist »dass« die natürlichste deutsche Entsprechung und lässt die finale Nuance bestehen.
- source_word: διερμηνεύῃ
  choice: sie auslegt
  rationale: Das Verb bezeichnet das verständliche Wiedergeben der Zungenrede für andere. »auslegen« passt zum Zusammenhang des Gottesdienstes, ohne den Vorgang auf eine gewöhnliche Übersetzung einzuengen; »sie« nimmt die Zungenrede auf.
theological_decisions:
- issue: Bedeutung von γλώσσῃ in 1. Korinther 12–14
  choice: Zunge
  alternative: Sprache
  rationale: »Zunge« bewahrt die literarische und theologische Verbindung innerhalb des Abschnitts und lässt offen, welcher Art die auslegungsbedürftige Rede genau ist.
- issue: Generischer maskuliner Singular
  choice: wer … er
  alternative: wer … diese Person
  rationale: Die griechischen Formen stehen im maskulinen Singular, sind hier jedoch repräsentativ gemeint. Die deutsche Konstruktion bewahrt den Singular; eine Fußnote verdeutlicht, dass die Aussage nicht auf Männer beschränkt ist.
- issue: Art der Wiedergabe von διερμηνεύῃ
  choice: auslegt
  alternative: übersetzt
  rationale: Der Zusammenhang verlangt, dass die Rede für die Gemeinde verständlich gemacht wird. »Auslegen« lässt die genaue Art dieses Vorgangs offen, während »übersetzen« eine bestimmte Auffassung der Zungenrede nahelegen könnte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist knapp und folgt dem griechischen Gedankengang, während die generische »wer«-Konstruktion natürlich verständlich bleibt.
