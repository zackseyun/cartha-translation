  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: de
  text: Wer in Zungen redet[a], baut sich selbst auf; wer aber prophetisch redet, baut die Gemeinde auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch Singular: „in einer Zunge“ oder „in einer Sprache“. Im Zusammenhang dieses Kapitels ist die Gabe der Zungenrede gemeint; die genaue Art dieser Rede ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Versammlung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Wer … redet
  rationale: Der substantivierte Präsenspartizip bezeichnet allgemein eine Person, die diese Handlung ausübt. Die deutsche Wer-Konstruktion ist natürlich und bewahrt die Parallelität beider Satzhälften.
- source_word: γλώσσῃ
  choice: in einer Sprache
  rationale: Der artikellose Dativ Singular kann wörtlich eine Sprache oder Zunge bezeichnen. „In einer Sprache reden“ ist im modernen Deutsch verständlich; eine Fußnote weist darauf hin, dass im Kontext die besondere Sprachrede gemeint sein dürfte, ohne deren genaue Art festzulegen.
- source_word: ἑαυτὸν
  choice: sich selbst
  rationale: Das deutsche Reflexivpronomen gibt den Rückbezug auf die redende Person genau und ohne unnötige Geschlechtsmarkierung wieder.
- source_word: οἰκοδομεῖ
  choice: baut … auf
  rationale: Die Formulierung bewahrt das griechische Bild des Bauens und bezeichnet hier Stärkung beziehungsweise Förderung.
- source_word: ὁ δὲ προφητεύων
  choice: wer aber prophetisch redet
  rationale: „Prophetisch reden“ gibt das Verb verständlich als Tätigkeit wieder; „aber“ markiert den durch δέ ausgedrückten Kontrast.
- source_word: ἐκκλησίαν
  choice: die Gemeinde
  rationale: Im Zusammenhang des gemeinschaftlichen Gottesdienstes bezeichnet ἐκκλησία die versammelte christliche Gemeinschaft. „Gemeinde“ ist dafür im Deutschen natürlicher als „Kirche“, lässt aber „Versammlung“ als mögliche Nuance zu.
theological_decisions:
- issue: Bedeutung von γλώσσῃ in 1. Korinther 12–14
  choice: „in einer Sprache“ mit erläuternder Fußnote zur besonderen Sprachrede
  alternative: „in einer Zunge“, „in Zungen“ oder ausdrücklicher „in einer unbekannten Sprache“
  rationale: Der Kontext handelt von einer besonderen Geistesgabe, doch die genaue Beschaffenheit der Rede bleibt umstritten. Die Übersetzung hält die lexikalische Bedeutung offen und die Fußnote benennt den Kontext, ohne zwischen Fremdsprache und ekstatischer Rede zu entscheiden.
- issue: Kontrast zwischen persönlicher und gemeinschaftlicher Auferbauung
  choice: Den parallelen Ausdruck „baut … auf“ in beiden Satzhälften bewahren
  alternative: „stärkt sich selbst / stärkt die Gemeinde“
  rationale: Die Wiederholung entspricht dem griechischen Text und lässt Paulus’ Spannung zwischen Nutzen für die einzelne Person und Nutzen für die Gemeinde bestehen, ohne die erste Aussage moralisch weiter zu bewerten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Griechischen bleibt erhalten. „Prophetisch reden“ ist geläufiger als das mögliche, aber markiertere „prophezeien“; „Gemeinde“ bezeichnet hier die versammelte christliche Gemeinschaft.
