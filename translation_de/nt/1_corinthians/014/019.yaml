  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: de
  text: Doch in der Gemeinde will ich lieber fünf Worte mit meinem Verstand reden, damit ich auch andere unterweise, als zehntausend Worte in einer Sprache[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in einer Zunge“. Das griechische Wort kann „Zunge“ oder „Sprache“ bedeuten; hier bezeichnet es die in 1. Korinther 12–14 behandelte Art des Redens.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: in der Gemeinde
  rationale: Gemeint ist die zum Gottesdienst versammelte christliche Gemeinschaft. „Gemeinde“ ist im modernen Deutschen natürlich und gibt den gemeinschaftlichen Sinn wieder.
- source_word: θέλω … ἢ
  choice: will ich lieber … als
  rationale: θέλω bezeichnet wörtlich ein Wollen; zusammen mit dem Vergleich ἢ drückt es hier eine klare Vorliebe aus. „will ich lieber … als“ bewahrt sowohl den Willensaspekt als auch die Vergleichsstruktur.
- source_word: πέντε λόγους
  choice: fünf Worte
  rationale: Die konkrete Zahl und die einfache Wiedergabe „Worte“ erhalten den zugespitzten Gegensatz zu den zehntausend Worten.
- source_word: τῷ νοΐ μου
  choice: mit meinem Verstand
  rationale: νοῦς bezeichnet hier den verständigen, bewusst eingesetzten Verstand und steht im Zusammenhang dem nicht verstandenen Zungenreden gegenüber. „Mit meinem Verstand“ bleibt nah am griechischen Ausdruck.
- source_word: λαλῆσαι
  choice: reden
  rationale: λαλέω bedeutet in diesem Zusammenhang öffentlich sprechen oder reden. „reden“ fügt sich natürlich in die Formulierung „Worte … reden“ ein.
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: damit ich auch andere unterweise
  rationale: κατηχέω meint mündlich unterrichten oder anleiten. „unterweisen“ gibt diesen Bildungssinn wieder, ohne den späteren Fachbegriff „katechisieren“ einzutragen.
- source_word: μυρίους λόγους
  choice: zehntausend Worte
  rationale: μύριοι bezeichnet grundsätzlich zehntausend und kann zugleich eine überwältigend große Zahl ausdrücken. Die genaue Zahl bewahrt Paulus’ eindrücklichen Gegensatz zu fünf Worten.
- source_word: ἐν γλώσσῃ
  choice: in einer Zunge
  rationale: Die wörtlich gehaltene Wendung bewahrt den Leitbegriff γλῶσσα und legt nicht fest, ob damit eine menschliche Sprache oder eine besondere Form geistgewirkten Redens gemeint ist. Eine Fußnote erläutert die sprachliche Alternative.
theological_decisions:
- issue: Bedeutung von γλῶσσα in 1. Korinther 12–14
  choice: in einer Zunge
  alternative: in einer Sprache
  rationale: Die Übersetzung erhält die im Kapitel bestehende Spannung und bestimmt die Art des bezeichneten Redens nicht näher. Sie vermeidet sowohl die Festlegung auf eine gewöhnliche Fremdsprache als auch eine deutende Umschreibung wie „ekstatische Rede“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die klare Zahlengegenüberstellung und die syntaktische Vergleichsstruktur des griechischen Textes bleiben erhalten; eine mögliche begriffliche Fremdheit bei „Zunge“ wird bewusst zugunsten der inhaltlichen Offenheit beibehalten und durch die Fußnote erläutert.
