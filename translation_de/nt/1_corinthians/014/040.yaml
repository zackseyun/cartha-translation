  text: But let everything be done decently and in order[a].
translation:
  language: de
  text: Doch alles soll angemessen[a] und geordnet geschehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: anständig; das griechische Wort bezeichnet, was sich schickt oder der Situation entspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural hat umfassenden Sinn; »alles« ist im Deutschen natürlich und bewahrt die Reichweite der Anweisung.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel kennzeichnet hier einen milden Gegensatz beziehungsweise einen zusammenfassenden Übergang von der vorausgehenden Erörterung zur abschließenden Anweisung.
- source_word: εὐσχημόνως
  choice: angemessen
  rationale: Das Adverb bezeichnet ein Verhalten, das sich schickt und der Situation entspricht. »Angemessen« ist gegenwärtiges, klares Deutsch und vermeidet die mögliche moralische Verengung von »anständig«.
- source_word: κατὰ τάξιν
  choice: geordnet
  rationale: Die Wendung bezeichnet ein Geschehen gemäß einer geordneten Anordnung oder Abfolge. »Geordnet« gibt dies knapp und idiomatisch wieder.
- source_word: γινέσθω
  choice: soll … geschehen
  rationale: Der Imperativ der dritten Person formuliert eine allgemeine Anweisung. »Soll … geschehen« gibt seine verpflichtende Kraft im Deutschen natürlich wieder.
theological_decisions:
- issue: Reichweite der Anweisung im Zusammenhang des Gottesdienstes
  choice: Eine allgemeine Anweisung, dass in der versammelten Gemeinde alles angemessen und geordnet geschehen soll, ohne ein bestimmtes liturgisches Modell festzulegen.
  alternative: Eine Vorschrift für eine feststehende Gottesdienstordnung oder ein uneingeschränkt auf jede kirchliche Praxis ausgedehntes Prinzip.
  rationale: Der Vers fasst die vorausgehende Erörterung über Redebeiträge und Ordnung in der Gemeindeversammlung zusammen. Die allgemeine Formulierung des Griechischen bleibt erhalten, ohne konfessionelle Strukturen in den Text einzutragen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die knappe Satzform bewahrt den Charakter einer abschließenden, umfassenden Anweisung.
