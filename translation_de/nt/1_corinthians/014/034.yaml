id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: de
  text: Die Frauen sollen in den Gemeinden schweigen[a]; denn es ist ihnen nicht erlaubt zu reden[b], sondern sie sollen sich unterordnen, wie auch das Gesetz sagt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Ehefrauen sollen in den Gemeinden schweigen“; das griechische Wort kann je nach Kontext „Frau“ oder „Ehefrau“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Der Vers selbst sagt nicht, welche Art des Redens gemeint ist; manche verstehen die Aussage aufgrund des Zusammenhangs enger.
    reason: lexical_alternative
  - marker: c
    text: Mit „dem Gesetz“ kann speziell das mosaische Gesetz oder allgemeiner die Schrift gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: die Frauen
  rationale: γυνή kann je nach Kontext „Frau“ oder „Ehefrau“ bedeuten. Da der Vers selbst keine Ehemänner nennt, steht die allgemeinere Wiedergabe im Haupttext; die engere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: ἐκκλησίαις
  choice: Gemeinden
  rationale: ἐκκλησία bezeichnet hier die örtlichen christlichen Versammlungen beziehungsweise Gemeinden. „Gemeinden“ ist im modernen Deutsch natürlich und vermeidet die mögliche Verengung von „Kirchen“ auf Gebäude.
- source_word: σιγάτωσαν
  choice: sollen … schweigen
  rationale: Der Imperativ fordert im beschriebenen Rahmen Schweigen. Die Formulierung entspricht dem wiederholten Gebrauch desselben Verbs in 1 Korinther 14.
- source_word: ἐπιτρέπεται
  choice: es ist ihnen nicht erlaubt
  rationale: Die unpersönliche Passivform bezeichnet verweigerte Erlaubnis und wird im Deutschen klar und nah am griechischen Satzbau wiedergegeben.
- source_word: λαλεῖν
  choice: zu reden
  rationale: λαλεῖν ist ein allgemeines Verb des Sprechens. „Reden“ ist neutral und legt nicht fest, welche Art des Redens gemeint ist.
- source_word: ὑποτασσέσθωσαν
  choice: sie sollen sich unterordnen
  rationale: Die mediale beziehungsweise passive Imperativform bezeichnet eine Haltung oder Handlung der Unterordnung. Die reflexive Formulierung ist im Deutschen natürlich, ohne das Verhältnis näher zu bestimmen, als es der Vers tut.
- source_word: νόμος
  choice: das Gesetz
  rationale: „Das Gesetz“ bewahrt den möglichen Bezug auf das mosaische Gesetz, ohne durch eine erklärende Erweiterung auszuschließen, dass Paulus die Schrift allgemeiner im Blick hat.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: wie auch das Gesetz sagt
  rationale: Die Wiedergabe erhält sowohl den vergleichenden Sinn von καθὼς als auch die zusätzliche Bekräftigung durch καί.
theological_decisions:
- issue: Referenz von γυναῖκες
  choice: Frauen in den Gemeinden
  alternative: Ehefrauen in den Gemeinden
  rationale: Das griechische Wort lässt beide Bedeutungen zu. Weil der unmittelbare Wortlaut keine Ehemänner nennt, wird die weitere Bedeutung im Haupttext verwendet und die engere in der Fußnote genannt.
- issue: Umfang des Verbots zu reden
  choice: Im Haupttext ohne Eingrenzung als „zu reden“ wiedergegeben
  alternative: Nur störendes Reden oder das Beurteilen prophetischer Rede
  rationale: Der Vers selbst nennt keine bestimmte Art des Redens. Eine kontextuelle Eingrenzung ist umstritten und wird deshalb nicht in den Übersetzungstext aufgenommen.
- issue: Referenz von ὁ νόμος
  choice: das Gesetz
  alternative: das mosaische Gesetz im engeren Sinn oder die Schrift im weiteren Sinn
  rationale: Der genaue Bezug wird nicht ausdrücklich genannt. Die Übersetzung bewahrt diese Spannung und erläutert sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem kirchlichem Grundwortschatz. Der Satz bleibt nahe an der knappen und nachdrücklichen griechischen Formulierung. Die Fußnotenmarker stehen jeweils unmittelbar bei der Aussage, die sie erläutern.
