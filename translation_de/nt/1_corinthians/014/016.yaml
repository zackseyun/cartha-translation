reference: 1 Corinthians 14:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: de
  text: Denn wenn du im Geist lobpreist[b], wie soll dann der, der den Platz eines Unkundigen einnimmt[a], bei deinem Dankgebet[c] das Amen sagen? Denn er weiß nicht, was du sagst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „eines Außenstehenden“, „eines gewöhnlichen Menschen“, „eines Laien“ oder „eines Ungelehrten“. Das griechische Wort kann hier jemanden bezeichnen, dem die nötige Kenntnis oder Vertrautheit fehlt.
    reason: lexical_alternative
  - marker: b
    text: Oder „mit dem Geist“. Das Griechische legt hier nicht genauer fest, wie der Geistbezug zu verstehen ist.
    reason: alternative_reading
  - marker: c
    text: „Dankgebet“ bezeichnet hier das Aussprechen von Dank und nicht notwendigerweise die später so genannte „Eucharistie“.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Denn wenn
  rationale: Die Verbindung führt eine begründende, bedingte Folgerung aus dem vorherigen Gedankengang ein. „Denn wenn“ gibt dies im Deutschen natürlich wieder.
- source_word: εὐλογῇς
  choice: einen Lobpreis sprichst
  rationale: εὐλογέω bezeichnet hier einen gesprochenen Segen beziehungsweise Lobpreis im Gottesdienst. Die Formulierung bewahrt den mündlichen Charakter, ohne ein nicht ausdrücklich genanntes Objekt einzufügen.
- source_word: πνεύματι
  choice: im Geist
  rationale: Der Dativ kann einen Bereich oder ein Mittel bezeichnen. „Im Geist“ lässt offen, ob der menschliche Geist oder geistgewirktes Reden gemeint ist.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: derjenige, der den Platz eines Unkundigen einnimmt
  rationale: Die Formulierung gibt das räumlich-rollenbezogene Bild des griechischen Ausdrucks wieder. „Unkundiger“ betont passend zum Zusammenhang, dass die betreffende Person das Gesagte nicht versteht.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: wie soll ... das Amen sagen
  rationale: Der bestimmte Artikel vor Ἀμήν weist auf die bekannte zustimmende Antwort der versammelten Gemeinde hin. „Das Amen sagen“ erhält diesen gottesdienstlichen Sprachgebrauch.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: zu deinem Dankgebet
  rationale: εὐχαριστία bezeichnet hier das ausgesprochene Danken. „Dankgebet“ ist im Deutschen natürlich und vermeidet die spätere fachsprachliche Bedeutung „Eucharistie“.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: Er weiß ja nicht, was du sagst
  rationale: Die eigenständige Satzform klingt im Deutschen natürlich; „ja“ verdeutlicht den begründenden Sinn von ἐπειδή, ohne die Aussage zu verstärken.
theological_decisions:
- issue: Bedeutung von πνεύματι im Zusammenhang geistgewirkten Redens
  choice: im Geist
  alternative: mit dem Geist; durch den Geist
  rationale: Der griechische Dativ legt nicht eindeutig fest, ob vom menschlichen Geist, vom Heiligen Geist oder von geistgewirktem Reden die Rede ist. Die Übersetzung lässt diese Spannung bestehen.
- issue: Bedeutung von εὐχαριστίᾳ
  choice: Dankgebet
  alternative: Danksagung; Eucharistie
  rationale: Im unmittelbaren Zusammenhang geht es um verständlich ausgesprochenen Dank und die Antwort „Amen“. Die Wiedergabe als „Eucharistie“ würde eine spätere sakramentale Fachbedeutung in den Vers hineintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist gegenüber dem Griechischen leicht gegliedert, damit die Begründung klar verständlich bleibt. Gottesdienstliche Begriffe wie „Amen“ werden beibehalten, während spätere konfessionelle Fachbedeutungen vermieden werden.
