  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: de
  text: 'So ist es auch bei euch: Wenn ihr mit der Zunge keine verständliche Rede[a] hervorbringt, wie soll man dann verstehen, was gesagt wird? Denn ihr werdet in die Luft reden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deutlich erkennbare Rede« oder »eine klare Botschaft«. Der griechische Ausdruck bezeichnet eine Äußerung, die für die Hörenden erkennbar und verständlich ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: So ist es auch bei euch
  rationale: Stellt den Vergleich mit den vorangehenden Beispielen her und richtet die Anwendung unmittelbar an die Korinther; im Deutschen natürlich und inhaltlich nah am Griechischen.
- source_word: διὰ τῆς γλώσσης
  choice: mit der Zunge
  rationale: Bewahrt das konkrete Bild der Zunge und gibt den instrumentalen Sinn von διά natürlich wieder, ohne vorschnell als »Sprache« zu deuten.
- source_word: εὔσημον λόγον
  choice: verständliche Rede
  rationale: εὔσημος bezeichnet etwas deutlich Erkennbares beziehungsweise Verständliches; »Rede« erfasst λόγος hier besser als das zu enge »Wort«.
- source_word: δῶτε
  choice: hervorbringt
  rationale: Das wörtliche »gebt« wäre mit »Rede« im heutigen Deutsch unnatürlich. »Hervorbringt« vermittelt den Sinn einer geäußerten Lautfolge, ohne die Aussage näher auszudeuten.
- source_word: πῶς γνωσθήσεται
  choice: wie soll man dann verstehen
  rationale: Das unpersönliche »man« gibt den offenen Agens des Passivs wieder; im Zusammenhang bezeichnet γινώσκω das Verstehen durch die Hörenden.
- source_word: τὸ λαλούμενον
  choice: was gesagt wird
  rationale: Natürliche Wiedergabe des substantivierten Passivpartizips, wobei der passive Sinn erhalten bleibt.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Denn ihr werdet in den Wind reden
  rationale: Die geläufige deutsche Wendung bewahrt das Bild wirkungslosen, von niemandem verstandenen Redens. Wörtlicher wäre »in die Luft reden«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Metapher »mit der Zunge« bleibt erhalten; der Schlusssatz wird mit der natürlichen deutschen Redewendung »in den Wind reden« wiedergegeben.
