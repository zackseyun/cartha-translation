id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: de
  text: Wenn sie aber etwas lernen wollen, sollen sie zu Hause ihre eigenen Ehemänner fragen; denn es ist für eine Frau[a] beschämend, in der Gemeindeversammlung[b] zu sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für eine Ehefrau“. Das griechische Wort kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Gemeinde“. Das griechische Wort bezeichnet hier die versammelte Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: lernen
  rationale: Der Infinitiv bezeichnet hier unmittelbar das Lernen oder In-Erfahrung-Bringen; „lernen“ ist die klare und natürliche deutsche Entsprechung.
- source_word: ἐν οἴκῳ
  choice: zu Hause
  rationale: Die idiomatische Wiedergabe „zu Hause“ bewahrt den Gegensatz zur versammelten Gemeinde, ohne das Griechische hölzern als „im Haus“ wiederzugeben.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: ihre eigenen Ehemänner
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. In Verbindung mit ἰδίους („ihre eigenen“) und dem häuslichen Rahmen ist die eheliche Bedeutung am wahrscheinlichsten.
- source_word: ἐπερωτάτωσαν
  choice: sollen sie … fragen
  rationale: Diese Form gibt den Imperativ im natürlichen modernen Deutsch wieder und lässt das Fragen oder Sich-Erkundigen unverkürzt stehen.
- source_word: αἰσχρὸν
  choice: beschämend
  rationale: Das Wort bezeichnet etwas als schändlich oder anstößig. „Beschämend“ bewahrt diese starke sozial-moralische Wertung in würdigem Gegenwartsdeutsch.
- source_word: γυναικὶ
  choice: für eine Frau
  rationale: γυνή kann je nach Zusammenhang „Frau“ allgemein oder „Ehefrau“ bedeuten. Der Haupttext wahrt mit „Frau“ die allgemeine Formulierung; die eheliche Lesart wird in einer Fußnote genannt.
- source_word: λαλεῖν
  choice: zu sprechen
  rationale: „Sprechen“ entspricht der breiten Bedeutung von λαλέω und legt nicht schon übersetzerisch fest, welche Art des Sprechens gemeint ist.
- source_word: ἐν ἐκκλησίᾳ
  choice: in der Gemeindeversammlung
  rationale: ἐκκλησία bezeichnet hier die versammelte Gemeinde. „Gemeindeversammlung“ macht den Zusammenkunftscharakter deutlich und vermeidet die mögliche Deutung eines Kirchengebäudes.
theological_decisions:
- issue: Reichweite der Aussage über das Sprechen von Frauen
  choice: Die Aussage wird ohne Einschränkung auf eine bestimmte Art des Sprechens übersetzt.
  alternative: Die Aussage auf störende Rückfragen oder auf die Beurteilung prophetischer Rede beschränken beziehungsweise als Zitat einer korinthischen Position auffassen.
  rationale: Der griechische Satz selbst bestimmt die Art des Sprechens nicht näher. Die Übersetzung bewahrt deshalb die Spannung und überlässt eine genauere Eingrenzung der Auslegung.
- issue: Wiedergabe von γυνή und ἀνήρ als Frau/Ehefrau beziehungsweise Mann/Ehemann
  choice: Im Haupttext steht „Ehemänner“ für ἄνδρας und „Frau“ für γυναικί; „Ehefrau“ wird als mögliche Lesart in der Fußnote erhalten.
  alternative: Durchgehend „Ehefrauen/Ehemänner“ oder allgemeiner „Frauen/Männer“ wiedergeben.
  rationale: „Ihre eigenen“ und der häusliche Zusammenhang stützen bei ἄνδρας deutlich die Bedeutung „Ehemänner“. Das folgende γυναικί kann dagegen sowohl allgemein „Frau“ als auch kontextuell „Ehefrau“ bedeuten; diese Ambiguität wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, während „zu Hause“ und „sollen sie … fragen“ idiomatisches Deutsch gewährleisten. „Gemeindeversammlung“ verdeutlicht, dass die Zusammenkunft und nicht ein Gebäude gemeint ist.
