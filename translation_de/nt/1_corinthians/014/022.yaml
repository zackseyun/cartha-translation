id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: de
  text: 'Daraus folgt: Das Reden in Zungen[a] ist nicht für die Glaubenden, sondern für die Ungläubigen ein Zeichen[b]; die prophetische Rede dagegen ist nicht für die Ungläubigen, sondern für die Glaubenden bestimmt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »Sprachen« bedeuten. In 1. Korinther 12–14 lässt »Reden in Zungen« offen, welche Art sprachlichen Redens genau gemeint ist.
    reason: lexical_alternative
  - marker: b
    text: Im Licht des vorangehenden Zitats aus Jesaja 28,11–12 kann »Zeichen« hier auch als Zeichen des Gerichts verstanden werden.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Daraus folgt
  rationale: Kennzeichnet eine Schlussfolgerung aus dem vorangehenden Gedankengang und gibt die logische Verbindung in natürlichem modernem Deutsch wieder.
- source_word: αἱ γλῶσσαι
  choice: das Reden in Zungen
  rationale: Bewahrt den im Abschnitt etablierten paulinischen Ausdruck, ohne festzulegen, ob fremde Sprachen oder eine andere Form geistgewirkten Redens gemeint ist.
- source_word: εἰς σημεῖόν
  choice: ein Zeichen
  rationale: Gibt die Funktion beziehungsweise Wirkung knapp wieder; die Konstruktion mit »ist … ein Zeichen« entspricht dem griechischen εἰς σημεῖον, ohne die Art des Zeichens näher zu bestimmen.
- source_word: τοῖς πιστεύουσιν
  choice: für die Glaubenden
  rationale: Das substantivierte Partizip wird verbal-transparent wiedergegeben und bleibt im direkten Kontrast zu den Ungläubigen.
- source_word: τοῖς ἀπίστοις
  choice: für die Ungläubigen
  rationale: Gibt den religiös-gemeinschaftlichen Gegensatz zu den Glaubenden knapp und geläufig wieder.
- source_word: ἡ δὲ προφητεία
  choice: die prophetische Rede dagegen
  rationale: »Prophetische Rede« bezeichnet hier verständlich die Gabe beziehungsweise Tätigkeit; »dagegen« bringt den Kontrast von δέ klar zum Ausdruck.
theological_decisions:
- issue: Bedeutung von γλῶσσαι im charismatischen Zusammenhang
  choice: »Reden in Zungen« ohne nähere Bestimmung der sprachlichen Erscheinung
  alternative: »Reden in fremden Sprachen« oder »ekstatisches Reden«
  rationale: Die genaue Art des Phänomens ist umstritten. Die Übersetzung erhält den etablierten Ausdruck und legt keine konfessionelle Deutung fest.
- issue: Bedeutung von σημεῖον für die Ungläubigen
  choice: neutral als »ein Zeichen«
  alternative: »ein bestätigendes Zeichen« oder »ein Zeichen des Gerichts«
  rationale: Im Licht des unmittelbar zuvor angeführten Textes aus Jesaja kann ein Gerichtszeichen gemeint sein; der griechische Wortlaut bestimmt die Art des Zeichens jedoch nicht ausdrücklich.
- issue: Elliptische zweite Satzhälfte
  choice: »ist … bestimmt« zur natürlichen Ergänzung des Gegensatzes
  alternative: Wiederholung von »ist … ein Zeichen«
  rationale: Der griechische Text lässt das Prädikat in der zweiten Hälfte aus. Die deutsche Ergänzung wahrt die Zuordnung der prophetischen Rede zu den Glaubenden, ohne ausdrücklich festzulegen, dass auch sie in genau demselben Sinn »ein Zeichen« genannt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. »Daraus folgt« macht den Schlusscharakter deutlich; die parallelen Gegenüberstellungen bleiben erhalten. Die Fußnoten markieren echte lexikalische und theologische Deutungsspielräume, ohne sie im Haupttext aufzulösen.
