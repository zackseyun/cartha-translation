  source_fidelity: Die Satzglieder und die regulierende Kraft der beiden Imperative werden im Entwurf grundsätzlich zutreffend wiedergegeben. Die singularische, wörtlich angelehnte Formulierung „in einer Zunge“ ist im modernen Deutschen jedoch nicht die übliche Bezeichnung für das in 1. Korinther 12–14 gemeinte Phänomen und kann irreführend wie das Sprechen einer bestimmten einzelnen Sprache wirken. Das idiomatische „in Zungen reden“ wahrt die vom griechischen γλώσσῃ gelassene Sachfrage besser.
  naturalness: „In Zungen reden“ ist die etablierte und auch für heutige Leser verständliche deutsche biblische Wendung. Eine explizite Wiederaufnahme von „reden“ nach „zwei oder höchstens drei“ macht klar, dass die Zahl die Redenden begrenzt. „Einer nach dem anderen“ ist natürlich und trifft ἀνὰ μέρος.
  terminology: „Zungen reden“ und „auslegen“ sind im deutschen biblischen Register sachgemäß. „Auslegen“ lässt wie διερμηνεύειν offen, ob eine Übersetzung oder eine sinngemäße Deutung im Blick ist. Die Fußnote erhält „Sprache“ als lexikalische Alternative, ohne die umstrittene Natur der Gabe festzulegen.
