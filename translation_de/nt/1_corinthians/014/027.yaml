base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: de
  text: Wenn jemand in Zungen redet[a], sollen zwei oder höchstens drei reden, einer nach dem anderen; und einer soll auslegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einer Sprache«. Das griechische Wort kann »Zunge« oder »Sprache« bedeuten. Die Wendung »in Zungen reden« bewahrt die in diesem Kapitel etablierte Bezeichnung, ohne die Art dieser Gabe näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: in einer Zunge
  rationale: Die Wiedergabe bewahrt den in 1. Korinther 12–14 geprägten Ausdruck für das Charisma, ohne festzulegen, ob menschliche Fremdsprachen oder eine andere Art von Rede gemeint sind. Die idiomatischere Alternative »in einer Sprache« wird in der Fußnote genannt.
- source_word: τις
  choice: jemand
  rationale: Das Indefinitpronomen hat allgemeinen, nicht näher bestimmten Bezug und wird im Deutschen natürlich mit »jemand« wiedergegeben.
- source_word: λαλεῖ
  choice: redet
  rationale: Der Präsensindikativ steht in einer allgemeinen Bedingung; das einfache deutsche Präsens gibt dies angemessen wieder.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: sollen es zwei oder höchstens drei sein
  rationale: Die elliptische griechische Wendung begrenzt die Zahl der Redenden. Die Ergänzung »sollen es ... sein« macht die regelnde Aussage im Deutschen klar, ohne ihren Inhalt auszuweiten.
- source_word: ἀνὰ μέρος
  choice: einer nach dem anderen
  rationale: Die Wendung bezeichnet ein getrenntes, abwechselndes Reden statt gleichzeitigen Sprechens.
- source_word: εἷς
  choice: einer
  rationale: Das substantivisch gebrauchte Zahlwort bezeichnet eine einzelne Person, die auslegen soll.
- source_word: διερμηνευέτω
  choice: soll auslegen
  rationale: Der Imperativ verlangt, dass die Zungenrede für die Gemeinde verständlich wiedergegeben wird. »Auslegen« ist im deutschen biblischen Sprachgebrauch etabliert und legt sich weniger stark als »übersetzen« auf gewöhnliche menschliche Sprachen fest.
theological_decisions:
- issue: Bedeutung von γλώσσῃ im Zusammenhang der Geistesgaben
  choice: Im Haupttext steht »in einer Zunge« als Bezeichnung des in 1. Korinther 12–14 behandelten Phänomens, ohne dessen Art näher zu bestimmen.
  alternative: »in einer Sprache«; spezifisch ekstatische Rede; spezifisch eine fremde menschliche Sprache
  rationale: Der unmittelbare Zusammenhang betrifft die Zungenrede, doch der Vers entscheidet nicht, ob es sich dabei um menschliche oder himmlische beziehungsweise andersartige Rede handelt. Die gewählte Formulierung hält diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfügung ist klar und gemeindlich vorlesbar; »Zunge« und »auslegen« bewahren zugleich den etablierten biblischen Wortgebrauch und die Offenheit des griechischen Textes.
