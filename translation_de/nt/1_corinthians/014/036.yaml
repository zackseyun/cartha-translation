id: 1CO.14.36
reference: 1 Corinthians 14:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: de
  text: Oder ist das Wort Gottes etwa von euch ausgegangen,[a] oder ist es allein zu euch gelangt?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat das Wort Gottes etwa bei euch seinen Ursprung?«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »oder ist es nur bis zu euch gekommen?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Das disjunktive ἤ leitet die rhetorische Zurechtweisung direkt ein; die Schärfe ergibt sich aus den Fragen, ohne dass ein zusätzliches »Was!« eingeführt wird.
- source_word: ἀφ’ ὑμῶν
  choice: von euch
  rationale: ἀπό mit Genitiv bezeichnet hier Herkunft oder Ausgangspunkt. »Von euch« bewahrt diese Mehrdeutigkeit knapp und natürlich.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die geläufige, würdevolle Wendung erhält die inhaltliche Breite des griechischen Ausdrucks und legt ihn weder ausschließlich auf das Evangelium noch auf eine prophetische Äußerung fest.
- source_word: ἐξῆλθεν
  choice: ist … ausgegangen
  rationale: Die Wiedergabe bewahrt das Bild des Herausgehens und passt im Deutschen zur Frage nach dem Ursprung beziehungsweise Ausgangspunkt des Wortes.
- source_word: εἰς ὑμᾶς μόνους
  choice: allein zu euch
  rationale: Die Stellung von »allein« macht die exklusive Bedeutung von μόνους deutlich und klingt in der rhetorischen Frage natürlich.
- source_word: κατήντησεν
  choice: ist … gelangt
  rationale: καταντάω bezeichnet das Ankommen oder Gelangen an ein Ziel. Das deutsche Perfekt gibt den erreichten Zielpunkt idiomatisch wieder.
theological_decisions:
- issue: Bezugsumfang von »das Wort Gottes«
  choice: Der Ausdruck bleibt allgemein und unaufgelöst.
  alternative: Ausdrückliche Festlegung auf die Evangeliumsbotschaft oder auf prophetische Rede in der Gemeinde.
  rationale: Im Zusammenhang weist Paulus den Anspruch zurück, die Korinther seien Ursprung oder einzige Empfänger der maßgeblichen Botschaft Gottes. Der griechische Ausdruck erlaubt einen breiteren Bezug; die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Etwa« verdeutlicht die erwartete Verneinung der ersten rhetorischen Frage, ohne das griechische ἤ exklamativ umzudeuten. Die parallele Satzstruktur bewahrt den scharfen Kontrast zwischen angeblichem Ursprung und angeblich exklusivem Empfang.
