  terminology: »Das Wort Gottes« ist die etablierte und zugleich ausreichend offene Wiedergabe von ὁ λόγος τοῦ θεοῦ. Sie legt weder einen ausschließlich evangelistischen noch einen ausschließlich gemeindlich-prophetischen Bezug fest. Die Fußnoten sind korrekt verankert und bieten tragfähige lexikalische Alternativen.
