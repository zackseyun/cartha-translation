id: 1CO.14.2
reference: 1 Corinthians 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: de
  text: Denn wer in einer Sprache spricht, spricht nicht zu Menschen, sondern zu Gott; denn niemand versteht, was er sagt.[a] Vielmehr spricht er im Geist Geheimnisse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn niemand hört“. Das griechische Verb kann sowohl „hören“ als auch in diesem Zusammenhang „verstehen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in seinem Geist“. Der griechische Ausdruck kann sich auf den Heiligen Geist oder auf den Geist des Sprechenden beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: wer … spricht
  rationale: Der substantivierte Partizipialausdruck bezeichnet allgemein jede Person, die so spricht. Die deutsche Konstruktion mit „wer“ ist natürlich und vermeidet eine unnötige Geschlechtsfestlegung.
- source_word: γλώσσῃ
  choice: in einer Sprache
  rationale: Der Dativ Singular bezeichnet hier das Sprachphänomen. „In einer Sprache“ gibt den Singular wieder und bleibt verständlicher als das im heutigen Deutsch ungewohnte „in einer Zunge“, ohne durch „Fremdsprache“ oder „unbekannte Sprache“ mehr festzulegen als der griechische Text.
- source_word: ἀνθρώποις
  choice: zu Menschen
  rationale: Der Plural ist allgemein und nicht geschlechtsspezifisch gemeint.
- source_word: θεῷ
  choice: zu Gott
  rationale: Der Dativ bezeichnet das Gegenüber des Sprechens und lässt sich unmittelbar wiedergeben.
- source_word: ἀκούει
  choice: versteht, was er sagt
  rationale: ἀκούω bedeutet zunächst „hören“, kann im Zusammenhang aber das verstehende Erfassen bezeichnen. Da es hier um nicht verständliche Rede geht, gibt diese Formulierung den kontextuellen Sinn in natürlichem Deutsch wieder; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: δὲ
  choice: vielmehr
  rationale: Die Partikel führt hier den Gegensatz beziehungsweise die nähere Erklärung zur vorangehenden Aussage fort.
- source_word: πνεύματι
  choice: im Geist
  rationale: Der Dativ bleibt hinsichtlich des Bezugs und der Funktion mehrdeutig. „Im Geist“ ist knapp und lässt sich auf Gottes Geist beziehen, ohne die stärker instrumentale Deutung „durch den Geist“ festzuschreiben.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: „Geheimnisse“ bewahrt das theologische Gewicht des paulinischen Begriffs und vermeidet eine erklärende Verengung auf bloß geheime Informationen.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: im Geist
  alternative: in seinem Geist; durch den Geist
  rationale: Der griechische Ausdruck kann den Heiligen Geist oder den Geist des Sprechenden meinen; außerdem kann der Dativ unterschiedlich aufgefasst werden. Der Haupttext bietet eine plausible Lesart, während die Fußnote die echte Mehrdeutigkeit ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Spricht“ sorgt für einen natürlichen Satzfluss; „Geheimnisse“ bewahrt die paulinische Ausdrucksweise. Die Umschreibung „versteht, was er sagt“ macht den kontextuellen Sinn idiomatisch deutlich, während die wörtlichere Wiedergabe in der Fußnote erhalten bleibt.
