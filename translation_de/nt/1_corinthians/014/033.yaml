  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: de
  text: Denn Gott ist nicht ein Gott der Unordnung, sondern des Friedens,[a] wie in allen Gemeinden der Heiligen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Gott ist nicht ein Gott der Verwirrung, sondern des Friedens.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „wie es in allen Gemeinden von Gottes heiligem Volk der Fall ist“. Manche verbinden diese Wendung statt mit diesem Vers mit dem folgenden Vers.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: Unordnung
  rationale: Der Genitiv beschreibt, was Gott kennzeichnet. „Unordnung“ passt zum unmittelbaren Zusammenhang eines geordneten Gottesdienstes und verengt den Ausdruck nicht auf bloße gedankliche Verwirrung.
- source_word: εἰρήνης
  choice: Frieden
  rationale: „Frieden“ ist die übliche und sachlich passende Wiedergabe; hier bezeichnet das Wort den Gegenpol zu Unordnung und schließt ein harmonisches Miteinander ein.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Die bestimmte, persönliche Bezeichnung wird im Deutschen idiomatisch ohne Artikel wiedergegeben; in der Prädikatsfügung steht jedoch natürlich „ein Gott“.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ gibt die begründende Funktion der Partikel im Anschluss an die vorausgehenden Anweisungen knapp und natürlich wieder.
- source_word: ὡς
  choice: wie in
  rationale: Die kompakte Formulierung bewahrt den Vergleich beziehungsweise den Hinweis auf die allgemeine Praxis, ohne die syntaktische Beziehung stärker auszudeuten als der griechische Text.
- source_word: ἐκκλησίαις
  choice: Gemeinden
  rationale: „Gemeinden“ ist im modernen Standarddeutsch die natürliche Bezeichnung für örtliche christliche Gemeinschaften und vermeidet die mögliche Verengung von „Kirchen“ auf Gebäude oder Institutionen.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: „Der Heiligen“ bewahrt die geläufige paulinische Bezeichnung für die Gläubigen sowie den theologischen Sprachklang des Originals.
theological_decisions:
- issue: Zuordnung von ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Die Wendung wird als Vergleich beziehungsweise Hinweis auf die Praxis aller Gemeinden an Vers 33 angeschlossen.
  alternative: Die Wendung kann mit dem folgenden Vers verbunden und als Einleitung der dortigen Aussage verstanden werden.
  rationale: Die überlieferte Zeichensetzung und die syntaktische Zuordnung sind umstritten. Entsprechend der vorgelegten SBLGNT-Interpunktion bleibt die Wendung bei Vers 33; die andere mögliche Verbindung wird in einer Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung folgt der griechischen Satzstruktur, bleibt aber idiomatisch. „Gemeinden“ ist für heutige Leser natürlicher als „Kirchen“, während „der Heiligen“ die paulinische Terminologie bewusst erhält.
