  variant: modern standard German
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: de
  text: Strebt nach der Liebe und bemüht euch eifrig um das, was vom Geist kommt,[a] vor allem aber darum, prophetisch zu reden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um die geistlichen Dinge“; im Zusammenhang sind besonders Wirkungen oder Gaben des Geistes in der Gemeinde gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor allem aber, dass ihr prophetisch redet“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: Διώκετε
  choice: Strebt nach
  rationale: Das Verb bezeichnet ein aktives, beharrliches Verfolgen eines Ziels. „Strebt nach“ gibt diesen fortdauernden Einsatz in natürlichem Deutsch wieder.
- source_word: τὴν ἀγάπην
  choice: der Liebe
  rationale: „Liebe“ ist die übliche und sachlich passende Wiedergabe von ἀγάπη und hält die Verbindung zum unmittelbar vorausgehenden Kapitel 13 fest.
- source_word: ζηλοῦτε
  choice: bemüht euch eifrig um
  rationale: Die Form bezeichnet hier ein starkes, positives Verlangen. Die Wiedergabe erhält sowohl den Eifer als auch den Aufforderungscharakter.
- source_word: τὰ πνευματικά
  choice: das, was vom Geist kommt
  rationale: Der substantivierte sächliche Plural ist weiter als „Geistesgaben“. Die Formulierung bleibt entsprechend offen, macht im Zusammenhang aber den Bezug auf den Geist verständlich.
- source_word: μᾶλλον δὲ
  choice: vor allem aber
  rationale: Die Formulierung drückt eine hervorgehobene Präferenz aus und bewahrt mit „aber“ zugleich die weiterführende beziehungsweise leicht kontrastierende Kraft von δέ.
- source_word: ἵνα προφητεύητε
  choice: darum, prophetisch zu reden
  rationale: Der ἵνα-Satz benennt hier besonders den Inhalt beziehungsweise das Ziel des eifrigen Bemühens. „Prophetisch reden“ ist im heutigen Deutsch verständlicher als das seltene Verb „prophezeien“ und wahrt die Tätigkeit des προφητεύειν.
theological_decisions:
- issue: Bedeutungsumfang von τὰ πνευματικά
  choice: das, was vom Geist kommt
  alternative: die Geistesgaben; die geistlichen Dinge; die geistlichen Wirklichkeiten
  rationale: Die griechische Wendung ist grammatisch breiter als „Gaben“, während der Zusammenhang von 1. Korinther 12–14 auf Wirkungen beziehungsweise Befähigungen des Geistes in der Gemeinde weist. Die gewählte Fassung wahrt diese Offenheit, ohne den Kontext zu verschleiern.
- issue: Gewichtung des prophetischen Redens
  choice: vor allem aber darum, prophetisch zu reden
  alternative: vielmehr, dass ihr prophetisch redet; besonders aber, dass ihr prophetisch redet
  rationale: μᾶλλον δὲ hebt das prophetische Reden gegenüber anderen geistgewirkten Erscheinungen hervor, erklärt es aber nicht zur einzig gültigen Ausprägung. Die Übersetzung erhält diese vergleichende Priorität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen bleiben erhalten; „das, was vom Geist kommt“ vermeidet eine unnötige Verengung des griechischen Ausdrucks auf „Gaben“. „Prophetisch reden“ ist verständlich und bewahrt den etablierten biblischen Begriff, ohne altertümlich zu wirken.
