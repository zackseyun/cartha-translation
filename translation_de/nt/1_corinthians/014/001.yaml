review_pass:
  verdict: approve
  source_fidelity: Die beiden Imperative Διώκετε und ζηλοῦτε sind mit „Strebt nach“ und „bemüht euch eifrig um“ treffend wiedergegeben. „das, was vom Geist kommt“ hält den offenen, sächlichen Plural τὰ πνευματικά bewusst weiter als „Geistesgaben“, bleibt aber durch den Kontext verständlich. „vor allem aber darum, prophetisch zu reden“ gibt die bevorzugende Kraft von μᾶλλον δέ sowie den Inhalt des ἵνα-Satzes angemessen wieder.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und hat einen sachlich-würdigen Registerton. Die Infinitivkonstruktion „darum, prophetisch zu reden“ ist idiomatisch; sie ist gegenüber dem alternativen dass-Satz nicht weniger klar.
  terminology: „Liebe“ bewahrt die Verbindung zu Kapitel 13. „Geist“ und „prophetisch reden“ sind im kirchlich-biblischen Deutsch verständlich und nicht konfessionell verengt. Die Fußnote zu τὰ πνευματικά benennt sowohl die wörtliche Breite als auch die kontextuelle Ausrichtung, ohne diese zur allein möglichen lexikalischen Bedeutung zu machen.
