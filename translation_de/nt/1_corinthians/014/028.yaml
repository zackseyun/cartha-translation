review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt den Konditionalsatz ἐὰν δὲ μὴ ᾖ, διερμηνευτής, das Schweigegebot σιγάτω ἐν ἐκκλησίᾳ sowie die doppelte Ausrichtung ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ vollständig und ohne sachliche Ergänzung wieder. „Ausleger“ ist in diesem Kontext eine tragfähige Wiedergabe von διερμηνευτής; die Formulierung legt weder Art noch Lautstärke des anschließenden Sprechens fest.
  naturalness: „Wenn aber kein Ausleger da ist, soll er in der Gemeinde schweigen und zu sich selbst und zu Gott sprechen“ ist natürliches, modernes und würdiges Standarddeutsch. Die Satzverknüpfung und die Wiederholung von „zu“ sind klar und gut lesbar.
  terminology: „Gemeinde“ passt für ἐκκλησία im Zusammenhang der versammelten Gemeinde. „Ausleger“ ist bibelsprachlich etabliert und hier gegenüber alltagssprachlichem „Dolmetscher“ passend. „schweigen“ und „sprechen“ treffen Register und Direktive des griechischen Textes angemessen.
