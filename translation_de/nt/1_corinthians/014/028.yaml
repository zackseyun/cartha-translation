source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: de
  text: Wenn aber kein Ausleger da ist, soll er in der Gemeinde schweigen und zu sich selbst und zu Gott sprechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερμηνευτής
  choice: Ausleger
  rationale: Bezeichnet hier jemanden, der die Zungenrede für andere verständlich wiedergibt. „Ausleger“ ist im deutschen bibelsprachlichen Kontext geläufig; „Dolmetscher“ wäre ebenfalls möglich, könnte aber stärker an gewöhnliche Fremdsprachenübertragung denken lassen.
- source_word: σιγάτω
  choice: soll er … schweigen
  rationale: Der Imperativ der dritten Person wird in natürlichem modernem Deutsch als verbindliche Anweisung wiedergegeben.
- source_word: ἐν ἐκκλησίᾳ
  choice: in der Gemeinde
  rationale: Gemeint ist im Kontext die versammelte christliche Gemeinde. „Gemeinde“ bezeichnet im Deutschen sowohl die Gemeinschaft als auch ihre Zusammenkunft angemessen.
- source_word: ἑαυτῷ
  choice: zu sich selbst
  rationale: Gibt das reflexive Dativobjekt unmittelbar wieder, ohne durch Zusätze wie „leise“ oder „privat“ die Art des Sprechens näher festzulegen.
- source_word: λαλείτω
  choice: sprechen
  rationale: Neutrale, würdevolle Wiedergabe des Imperativs, die weder Lautstärke noch Dauer überinterpretiert.
- source_word: τῷ θεῷ
  choice: zu Gott
  rationale: Direkte Wiedergabe des Dativobjekts nach dem Verb des Sprechens.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Wenn aber kein … da ist
  rationale: Natürliche deutsche Wiedergabe der konditionalen Wendung mit dem Gedanken, dass kein Ausleger anwesend beziehungsweise verfügbar ist.
theological_decisions:
- issue: Reichweite des Schweigegebots in der Gemeindeversammlung
  choice: Das Gebot untersagt ohne Ausleger das an die versammelte Gemeinde gerichtete Reden, lässt aber das Sprechen zu sich selbst und zu Gott ausdrücklich stehen.
  alternative: Der Sprecher müsse jedes Sprechen vollständig einstellen; oder er dürfe weiterhin hörbar zur Gemeinde sprechen.
  rationale: Der Gegensatz zwischen dem Schweigen „in der Gemeinde“ und dem Sprechen „zu sich selbst und zu Gott“ begrenzt die öffentliche Äußerung, ohne Lautstärke, genaue Vollzugsweise oder eine konfessionelle Lehre über Geistesgaben festzulegen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Formulierung bleibt eng am griechischen Satzbau, klingt aber natürlich. Kein Fußnotenmarker ist nötig, da „Gemeinde“ den versammelten Kontext im Deutschen treffend ausdrückt; die englische Fußnote betrifft offenbar versehentlich ἐκκλησίᾳ statt διερμηνευτής.
