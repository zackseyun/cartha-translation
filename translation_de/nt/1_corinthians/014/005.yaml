source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: de
  text: Ich möchte, dass ihr alle in Zungen redet[a], noch mehr aber, dass ihr prophetisch redet. Wer prophetisch redet, ist größer als der, der in Zungen redet – es sei denn, er legt es aus[b] –, damit die Gemeinde aufgebaut wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in Sprachen reden“. Das griechische Wort kann „Zungen“ oder „Sprachen“ bedeuten; im Zusammenhang von 1 Korinther 12–14 ist „in Zungen reden“ die etablierte Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „es sei denn, jemand legt es aus“. Das griechische Verb steht im Singular; es kann sich auf den Sprecher selbst beziehen oder im weiteren Zusammenhang darauf, dass überhaupt jemand die Äußerung auslegt.'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω
  choice: Ich möchte
  rationale: Gibt den gegenwärtigen persönlichen Wunsch des Paulus direkt und in natürlichem modernem Deutsch wieder.
- source_word: πάντας ὑμᾶς
  choice: dass ihr alle
  rationale: Bewahrt die ausdrücklich umfassende Anrede an die ganze Gemeinde.
- source_word: λαλεῖν γλώσσαις
  choice: in Sprachen reden
  rationale: Bewahrt die Grundbedeutung von γλῶσσα und entspricht dem Sprachgebrauch des Abschnitts; die traditionelle Wiedergabe „in Zungen reden“ wird in einer Fußnote genannt.
- source_word: μᾶλλον δὲ
  choice: noch mehr aber
  rationale: Bezeichnet eine gesteigerte Bevorzugung, ohne das Reden in Sprachen abzulehnen.
- source_word: ἵνα προφητεύητε
  choice: dass ihr prophetisch redet
  rationale: Gibt den Inhalt des Wunsches verständlich wieder. „Prophetisch reden“ ist im heutigen Deutsch natürlicher und transparenter als „weissagen“.
- source_word: μείζων
  choice: größer
  rationale: Bewahrt den offenen Vergleich des griechischen Textes, ohne ihn bereits als Rang, Heiligkeit oder bloße Nützlichkeit auszudeuten.
- source_word: ὁ προφητεύων
  choice: Wer prophetisch redet
  rationale: Natürliche generische Wiedergabe des substantivierten Partizips.
- source_word: ὁ λαλῶν γλώσσαις
  choice: der, der in Sprachen redet
  rationale: Erhält die Parallelität des Vergleichs und den generischen Singular.
- source_word: ἐκτὸς εἰ μὴ
  choice: es sei denn
  rationale: Idiomatiche deutsche Wiedergabe der Ausnahmebedingung.
- source_word: διερμηνεύῃ
  choice: er legt das Gesagte aus
  rationale: Der unausgedrückte Singular als Subjekt bezieht sich zunächst am natürlichsten auf den zuvor genannten Sprecher; „auslegen“ passt zur verständlichen Erschließung der Äußerung für die Gemeinde.
- source_word: ἡ ἐκκλησία
  choice: die Gemeinde
  rationale: Bezeichnet hier die versammelte christliche Gemeinschaft und ist im Deutschen kontextgerecht.
- source_word: οἰκοδομὴν λάβῃ
  choice: aufgebaut wird
  rationale: Gibt das Bild der οἰκοδομή natürlich und klar wieder, ohne das schwerfällige „Erbauung empfängt“.
theological_decisions:
- issue: Die relative Größe dessen, der prophetisch redet
  choice: „größer“ bleibt im Haupttext stehen; der Zweck des Aufbaus der Gemeinde bestimmt den unmittelbaren Zusammenhang.
  alternative: „wichtiger“ oder „nützlicher“; beziehungsweise größer an geistlichem Rang oder an Heiligkeit
  rationale: Der griechische Komparativ wird nicht abgeschwächt. Zugleich wird keine Rangordnung persönlicher Würde in die Übersetzung eingeführt; der abschließende Zwecksatz stellt den Nutzen für die Gemeinde in den Vordergrund.
- issue: Subjekt von διερμηνεύῃ
  choice: 'Im Haupttext ist der Sprecher selbst das Subjekt: „er legt … aus“.'
  alternative: Jemand anderes legt aus; beziehungsweise es wird eine Auslegung gegeben.
  rationale: Ohne ausdrücklich genanntes neues Subjekt liegt der Rückbezug auf den singularischen Sprecher am nächsten. Der weitere Kontext lässt jedoch zu, dass ein anderer auslegt; diese echte Offenheit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Griechischen, wird aber durch Gedankenstriche lesbar gegliedert. „Prophetisch reden“ und „aufgebaut werden“ vermeiden veraltete oder kirchensprachlich schwer verständliche Formulierungen.
