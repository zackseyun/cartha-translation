reference: 1 Corinthians 14:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: de
  text: Darum, meine Brüder und Schwestern,[a] bemüht euch darum, prophetisch zu reden, und hindert das Reden in Sprachen nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „meine Brüder“; die griechische Anrede kann hier die ganze Gemeinde einschließlich der Frauen umfassen.
    reason: lexikalische Alternative und transparente Wiedergabe der grammatischen Form
lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Die folgernde Konjunktion zieht eine zusammenfassende Konsequenz aus der vorausgehenden Erörterung; „Darum“ gibt diese Funktion natürlich und knapp wieder.
- source_word: ἀδελφοί μου
  choice: meine Brüder und Schwestern
  rationale: Der grammatisch maskuline Plural bezeichnet in diesem gemeindlichen Zusammenhang sehr wahrscheinlich die gesamte angeredete Gemeinschaft. Die inklusive Wiedergabe macht den heutigen Lesenden den kommunikativen Umfang unmittelbar deutlich; die Fußnote dokumentiert die Form des Griechischen.
- source_word: ζηλοῦτε
  choice: bemüht euch darum
  rationale: Der Präsensimperativ fordert zu anhaltendem, ernsthaftem Streben auf. „Bemüht euch darum“ ist verständlich und gibt den positiven Aufforderungscharakter wieder.
- source_word: τὸ προφητεύειν
  choice: prophetisch zu reden
  rationale: Der substantivierte Infinitiv bezeichnet die Tätigkeit des prophetischen Redens. Diese Formulierung ist im modernen Deutsch natürlicher und verständlicher als das weniger geläufige Verb „prophezeien“.
- source_word: μὴ κωλύετε
  choice: hindert … nicht
  rationale: Der verneinte Präsensimperativ untersagt, die betreffende Praxis zu behindern oder zu unterbinden. „Hindert … nicht“ bewahrt den direkten Wortlaut, ohne ein förmliches Verbot vorauszusetzen.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: das Reden in Sprachen
  rationale: Die Wendung bezeichnet die im Kapitel behandelte Sprachengabe. „Reden in Sprachen“ hält die Bedeutung von γλῶσσαις offen und vermeidet eine vorschnelle Festlegung durch einen stärker kirchlich geprägten Fachausdruck.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί in einer gemischtgeschlechtlichen Gemeinde
  choice: meine Brüder und Schwestern
  alternative: meine Brüder
  rationale: Obwohl die griechische Form maskulin ist, kann ἀδελφοί eine gesamte Gemeinschaft einschließlich der Frauen anreden. Die inklusive Haupttextfassung vermittelt die wahrscheinliche pragmatische Bedeutung; die formale Gestalt wird in der Fußnote transparent gemacht.
- issue: Deutung von γλώσσαις
  choice: in Sprachen
  alternative: in Zungen
  rationale: Das griechische γλῶσσα kann „Zunge“ oder „Sprache“ bedeuten. Im Kontext geht es um eine Form des Sprechens; „Sprachen“ ist gegenwärtiges Standarddeutsch und lässt die genaue Art dieser Rede offen, ohne sie dogmatisch näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und ermahnend. „Prophetisch reden“ und „Reden in Sprachen“ sind verständliche, nicht konfessionell verengte Formulierungen.
