id: 1CO.14.12
reference: 1 Corinthians 14:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: de
  text: 'So ist es auch bei euch: Da ihr eifrig nach geistlichen Gaben[a] strebt, bemüht euch darum, zum Aufbau der Gemeinde in reichem Maß beizutragen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „Geister“; je nach Verständnis auch „Geistiges“ oder „Wirkungen des Geistes“. Der Zusammenhang legt geistliche Gaben nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: So ist es auch bei euch
  rationale: Nimmt den Vergleich aus dem vorausgehenden Gedankengang auf und klingt im modernen Deutschen natürlich.
- source_word: ἐπεὶ ζηλωταί ἐστε
  choice: Da ihr eifrig … strebt
  rationale: Gibt die kausale Verknüpfung und den anhaltenden Eifer idiomatisch wieder.
- source_word: πνευμάτων
  choice: geistlichen Gaben
  rationale: Der Kontext von 1. Korinther 12–14 weist auf geistgewirkte Gaben oder Erscheinungsformen hin; die knappere und mehrdeutige Formulierung des Griechischen wird in der Fußnote kenntlich gemacht.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: zum Aufbau der Gemeinde
  rationale: Bewahrt das paulinische Baumotiv und gibt ἐκκλησία hier als örtliche christliche Gemeinschaft wieder.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: bemüht euch darum, … in reichem Maß beizutragen
  rationale: Gibt den Imperativ sowie das Überfließen oder Reichlichsein zielgerichtet wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt wie „in ihnen“ einzufügen.
theological_decisions:
- issue: Bedeutung von πνευμάτων
  choice: geistliche Gaben
  alternative: Geistiges; Geister; Wirkungen des Geistes
  rationale: Der unmittelbare Kontext behandelt Gaben und Äußerungen des Geistes, besonders Prophetie und Sprachenrede. Da πνευμάτων wörtlich mehrdeutig bleibt, werden Alternativen in der Fußnote bewahrt.
- issue: Bezug von περισσεύητε
  choice: in reichem Maß zum Aufbau beitragen
  alternative: darin überreich sein; überfließen
  rationale: Die Übersetzung wahrt die Zielrichtung auf den Gemeindeaufbau, ohne den unausgesprochenen Bezug grammatisch eindeutig auf die Gaben festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufbau“ bewahrt die Metapher von οἰκοδομή; „Gemeinde“ bezeichnet hier die versammelte christliche Gemeinschaft.
