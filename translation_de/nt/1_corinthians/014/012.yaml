review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die argumentative Anknüpfung von οὕτως καὶ ὑμεῖς, den kausalen Satz mit ἐπεὶ sowie den Imperativ ζητεῖτε angemessen wieder. „in reichem Maß beizutragen“ vermittelt περισσεύητε als reichliches Wirksamsein, ohne entgegen dem griechischen Text ein ausdrückliches Objekt wie „in diesen Gaben“ einzutragen. Die Ausrichtung πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας bleibt klar erhalten.
  naturalness: Modernes, flüssiges Standarddeutsch mit sachlich-würdigem Register. „Zum Aufbau der Gemeinde“ ist idiomatisch und bewahrt das Bildfeld von οἰκοδομή. Die Wiederholung von „strebt“ im Kausalsatz und „bemüht euch“ im Hauptsatz ist semantisch unterscheidbar und nicht störend.
  terminology: „Geistliche Gaben“ ist im Kontext von 1 Korinther 12–14 eine gut begründete kontextuelle Wiedergabe von πνευμάτων. Die Fußnote markiert zutreffend, dass der griechische Ausdruck knapper und auslegungsfähig ist. „Gemeinde“ ist hier für ἐκκλησία angemessen.
