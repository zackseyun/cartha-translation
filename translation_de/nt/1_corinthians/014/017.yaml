  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: de
  text: Denn du dankst zwar gut, aber der andere wird nicht aufgebaut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht gestärkt“.'
    reason: Die Alternative gibt den übertragenen Sinn wieder, während der Haupttext die Metapher des Aufbaus bewahrt.
lexical_decisions:
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen wird als Singular beibehalten und unterstreicht die direkte Anrede.
- source_word: μὲν γὰρ
  choice: denn ... zwar
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder; „zwar“ eröffnet entsprechend μέν den durch ἀλλά folgenden Gegensatz.
- source_word: καλῶς
  choice: gut
  rationale: Das Adverb bewertet das Dankgebet positiv, ohne daraus eine Aussage über seine Verständlichkeit oder seinen Nutzen für andere zu machen.
- source_word: εὐχαριστεῖς
  choice: sprichst ... ein Dankgebet
  rationale: Im Zusammenhang bezeichnet das Verb ein an Gott gerichtetes Danken im Gottesdienst. Die Formulierung ist im Deutschen natürlich und wahrt den Gebetskontext.
- source_word: ἀλλ’
  choice: aber
  rationale: Die adversative Konjunktion führt den entscheidenden Gegensatz ein.
- source_word: ὁ ἕτερος
  choice: der andere
  rationale: Die substantivierte Bezeichnung bleibt bewusst allgemein und bezeichnet den jeweils anderen Beteiligten beziehungsweise Zuhörer.
- source_word: οὐκ οἰκοδομεῖται
  choice: wird nicht aufgebaut
  rationale: Die passive Form und das paulinische Bild des Aufbauens werden erhalten; gemeint ist der geistliche Nutzen beziehungsweise die Stärkung des anderen.
theological_decisions:
- issue: Metapher οἰκοδομέω im Zusammenhang der Gemeindeversammlung
  choice: wird nicht aufgebaut
  alternative: wird nicht gestärkt
  rationale: Die Übersetzung bewahrt das paulinische Baubild und legt nicht enger fest, worin der geistliche Nutzen besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dankgebet“ macht den gottesdienstlichen Gebetsakt idiomatisch deutlich; „aufgebaut“ erhält zugleich die zentrale paulinische Metapher.
