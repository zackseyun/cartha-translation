source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: de
  text: 'Nun aber, Brüder[a]: Wenn ich zu euch komme und in Zungen[b] rede, was nütze ich euch, wenn ich nicht zu euch rede – sei es durch Offenbarung oder durch Erkenntnis oder durch prophetische Rede oder durch Lehre?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort „Brüder“ kann eine gemischte Gemeinde anreden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Sprachen“; das griechische Wort kann „Sprachen“ bedeuten, bezeichnet hier jedoch das in 1. Korinther 12–14 behandelte Phänomen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Nun aber
  rationale: Kennzeichnet den Übergang zu einer konkreten Anwendung und bewahrt mit „aber“ die leichte argumentative Gegenüberstellung.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Gibt die grammatisch maskuline Anrede formal wieder; im paulinischen Gemeindezusammenhang kann sie Frauen einschließen, was die Fußnote erläutert.
- source_word: γλώσσαις λαλῶν
  choice: in Zungen rede
  rationale: „In Zungen reden“ ist im Deutschen die geläufige Bezeichnung für das in 1 Korinther 12–14 behandelte Phänomen, ohne dessen genaue Art näher festzulegen.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: was nütze ich euch
  rationale: Natürliches, knappes Deutsch, das den Gedanken des praktischen Nutzens für die Gemeinde erhält.
- source_word: ἐὰν μὴ
  choice: wenn ich nicht
  rationale: Im deutschen Satzbau ist die explizite konditionale Wiedergabe hier natürlicher als „es sei denn“ und bewahrt die Bedingungsstruktur.
- source_word: ἐν ἀποκαλύψει
  choice: durch Offenbarung
  rationale: 'Gibt ἐν modal beziehungsweise instrumental wieder: verständliche Rede vermittelt Offenbarung.'
- source_word: ἐν γνώσει
  choice: durch Erkenntnis
  rationale: Bewahrt die Parallelität und lässt offen, ob Erkenntnis als Inhalt, Gabe oder vermitteltes Wissen gemeint ist.
- source_word: ἐν προφητείᾳ
  choice: durch prophetische Rede
  rationale: Macht im heutigen Deutsch deutlich, dass es um eine Form verständlicher Äußerung geht; die Wiedergabe entscheidet nicht über Reichweite oder Wesen der Prophetie.
- source_word: ἐν διδαχῇ
  choice: durch Lehre
  rationale: Entspricht der Bedeutung von διδαχή als Lehre beziehungsweise Unterweisung und hält die Reihung knapp.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder im Haupttext mit inklusiver Erläuterung in der Fußnote
  alternative: Brüder und Schwestern
  rationale: Die formale Gestalt des griechischen Ausdrucks bleibt sichtbar, während sein möglicher Bezug auf die gesamte gemischte Gemeinde ausdrücklich festgehalten wird.
- issue: Bedeutung von γλώσσαις
  choice: Zungen
  alternative: Sprachen
  rationale: Der Ausdruck bezeichnet hier das in 1 Korinther 12–14 diskutierte geistgewirkte Sprachphänomen. „Zungen“ wahrt den kontextuellen Fachgebrauch, ohne die strittige Frage nach seiner genauen Natur zu entscheiden.
- issue: Wiedergabe der vier ἐν-Fügungen
  choice: durch
  alternative: in / mit
  rationale: „Durch“ drückt die modale oder instrumentale Funktion im Deutschen verständlich aus. Die Übersetzung lässt dabei das genaue Verhältnis zwischen Redeform und Redeinhalt offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach der Anrede gliedert den längeren Fragesatz; die Gedankenstriche markieren die vier parallelen Möglichkeiten. „Prophetische Rede“ ist für heutige Leser klarer als das abstraktere „Prophetie“, ohne die theologische Spannung aufzulösen.
