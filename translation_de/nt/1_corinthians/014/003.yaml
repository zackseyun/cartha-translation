  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: de
  text: Wer dagegen prophetisch redet, spricht zu Menschen und baut sie auf, ermutigt und tröstet sie.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „spricht zu Menschen Auferbauung“; οἰκοδομή bedeutet bildlich auch „Stärkung“.'
    reason: lexical_alternative
  - marker: b
    text: „Ermutigt“ gibt παράκλησις wieder; je nach Zusammenhang kann das Wort auch „ermahnt“ oder „tröstet“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Tröstet“ gibt παραμυθία wieder; auch „spendet Trost“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Wer dagegen prophetisch redet
  rationale: Das substantivierte Präsenspartizip bezeichnet die Person, die diese Handlung ausübt. „Prophetisch redet“ bewahrt die Weite des griechischen Begriffs, ohne ihn auf Predigt oder Zukunftsvoraussage zu verengen; „dagegen“ gibt den milden Kontrast von δέ zum vorhergehenden Vers wieder.
- source_word: ἀνθρώποις
  choice: zu Menschen
  rationale: Der Dativ bezeichnet die Empfänger der Rede und ist allgemein, nicht ausschließlich männlich, zu verstehen.
- source_word: λαλεῖ
  choice: spricht
  rationale: Eine direkte und natürliche Wiedergabe des Präsens von λαλέω.
- source_word: οἰκοδομὴν
  choice: baut sie auf
  rationale: οἰκοδομή bezeichnet hier bildlich die geistliche Stärkung beziehungsweise Auferbauung. Die verbale Formulierung ist im heutigen Deutsch natürlicher und macht die Wirkung der Rede deutlich.
- source_word: παράκλησιν
  choice: ermutigt
  rationale: παράκλησις kann Ermutigung, Ermahnung oder Trost bezeichnen. „Ermutigt“ unterscheidet den Ausdruck vom folgenden παραμυθία, ohne seine auffordernde Nuance auszuschließen.
- source_word: παραμυθίαν
  choice: tröstet
  rationale: παραμυθία bezeichnet tröstenden, beruhigenden Zuspruch. „Tröstet“ ist gegenwärtig, verständlich und wahrt die Unterscheidung zu παράκλησις.
theological_decisions:
- issue: Bedeutung des prophetischen Redens im Gemeindekontext
  choice: „prophetisch redet“ ohne weitere Einengung
  alternative: „predigt“ oder „spricht eine Offenbarung aus“
  rationale: Der Vers beschreibt prophetisches Reden anhand seiner Wirkung auf Menschen. Die Übersetzung wahrt die begriffliche und theologische Offenheit, statt eine konfessionell bestimmte Definition einzutragen.
- issue: Funktion der drei Akkusative nach λαλεῖ
  choice: als Wirkungen der Rede verbal wiedergegeben
  alternative: 'substantivisch: „zur Auferbauung, Ermutigung und zum Trost“'
  rationale: Der griechische Satz lässt die genaue syntaktische Beziehung knapp. Die verbale Wiedergabe drückt die naheliegende wirkungsbezogene Bedeutung idiomatisch aus, ohne die drei Aspekte miteinander zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben ergeben einen klaren, mündlich gut verständlichen Dreiklang. Der Fachausdruck „prophetisch reden“ bleibt erhalten, während das weniger geläufige „Auferbauung“ im Haupttext idiomatisch als „aufbauen“ erscheint.
