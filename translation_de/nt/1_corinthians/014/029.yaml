  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes zutreffend wieder: προφῆται als „Propheten“, δύο ἢ τρεῖς als „zwei oder drei“, die beiden Imperative als „sollen sprechen“ bzw. „sollen ... prüfen“ und οἱ ἄλλοι als bewusst offene Bezeichnung „die anderen“. Die Ergänzung „das Gesagte“ ist im Deutschen nötig bzw. sehr naheliegend und bezieht sich kontextgerecht auf die prophetischen Beiträge, ohne den Kreis der Prüfenden näher festzulegen.'
  naturalness: Der Satz ist klares, modernes Standarddeutsch und hat einen angemessen sachlich-anweisenden Registerton. Die Wiederholung von „sollen“ bildet die parallele Struktur der zwei griechischen Imperative natürlich ab.
  terminology: „Propheten“ ist die direkte und kontextgerechte Wiedergabe. „Das Gesagte prüfen“ trifft διακρινέτωσαν im Sinn eines unterscheidenden Bewertens prophetischer Rede gut, ohne unangemessen einen richterlich-verurteilenden Sinn einzutragen. Die Fußnote bietet sinnvolle lexikalische Alternativen.
