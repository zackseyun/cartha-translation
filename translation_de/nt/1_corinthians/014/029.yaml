  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: de
  text: Zwei oder drei Propheten sollen sprechen, und die anderen sollen das Gesagte prüfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beurteilen“, „unterscheiden“ oder „abwägen“. Das griechische Verb bezeichnet hier die prüfende Beurteilung prophetischer Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: Propheten
  rationale: Die direkte Wiedergabe bezeichnet prophetisch redende Personen und passt zu Paulus’ Regelung der Gemeindeversammlung.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier lediglich einen leichten Übergang innerhalb einer Reihe von Anweisungen; im Deutschen ist die unmarkierte Fortführung natürlich.
- source_word: δύο ἢ τρεῖς
  choice: zwei oder drei
  rationale: Die einfache Zahlenangabe wird unmittelbar wiedergegeben.
- source_word: λαλείτωσαν
  choice: sollen sprechen
  rationale: Der Imperativ der dritten Person wird im heutigen Deutsch natürlich und mit angemessener Anweisungsstärke durch „sollen“ wiedergegeben.
- source_word: οἱ ἄλλοι
  choice: die anderen
  rationale: Die Formulierung bewahrt die Offenheit des griechischen Textes hinsichtlich der Frage, ob andere Propheten, bestimmte Gemeindeglieder oder die übrige Versammlung gemeint sind.
- source_word: διακρινέτωσαν
  choice: sollen das Gesagte prüfen
  rationale: διακρίνω bezeichnet hier das unterscheidende Beurteilen prophetischer Rede. „Das Gesagte prüfen“ ist verständlich, sachlich und vermeidet den Beiklang einer verurteilenden Gerichtsentscheidung.
theological_decisions:
- issue: Identität der „anderen“ in der Gemeindeversammlung
  choice: Allgemein als „die anderen“ wiedergegeben
  alternative: „die anderen Propheten“ oder „die übrige Gemeinde“
  rationale: Der griechische Text bestimmt die Bezugsgruppe nicht ausdrücklich. Die Übersetzung lässt diese ekklesiologisch bedeutsame Frage daher offen.
- issue: Gegenstand des Prüfens
  choice: „das Gesagte“ als im Kontext erschlossene Ergänzung
  alternative: Nur „sollen prüfen“
  rationale: Das Objekt steht im Griechischen nicht ausdrücklich da, ist aber aus dem prophetischen Reden zu erschließen. Die Ergänzung macht den deutschen Satz verständlich, ohne die Art oder das Ergebnis der Prüfung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Anweisungsform bleibt erhalten; „die anderen“ wahrt die echte Mehrdeutigkeit des Ausgangstextes.
