  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: de
  text: Wenn aber einem anderen, der dasitzt, etwas offenbart wird, soll der Erste schweigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Der zuerst Redende soll aufhören zu sprechen, damit der andere sprechen kann.'
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Wenn aber
  rationale: ἐὰν leitet die Bedingung ein, während δὲ einen leichten Gegensatz beziehungsweise eine Weiterführung markiert. „Wenn aber“ gibt beides im Deutschen knapp und natürlich wieder.
- source_word: ἄλλῳ
  choice: einem anderen
  rationale: Der Dativ Singular bezeichnet einen anderen Beteiligten als den gerade Redenden.
- source_word: ἀποκαλυφθῇ
  choice: etwas offenbart wird
  rationale: Der Aorist Passiv Konjunktiv von ἀποκαλύπτω wird unmittelbar als unpersönliche Passivkonstruktion wiedergegeben. „Etwas“ macht den im Deutschen erforderlichen Satzgegenstand kenntlich, ohne den Inhalt oder den Urheber der Offenbarung näher festzulegen.
- source_word: καθημένῳ
  choice: der dasitzt
  rationale: Das Partizip Präsens bezieht sich auf „einem anderen“ und beschreibt ihn als einen Sitzenden in der Versammlung. Die Formulierung ist anschaulich, knapp und gegenwartsnah.
- source_word: ὁ πρῶτος
  choice: der Erste
  rationale: Die wörtliche Bezeichnung bleibt erhalten. Aus dem Zusammenhang ist ersichtlich, dass der zuerst beziehungsweise bislang Redende gemeint ist.
- source_word: σιγάτω
  choice: soll ... schweigen
  rationale: Der Imperativ der dritten Person fordert den ersten Redner auf, mit dem Reden aufzuhören. „Soll ... schweigen“ gibt die Anweisung in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Art und Urheber des Offenbarungsgeschehens in der versammelten Gemeinde
  choice: „etwas offenbart wird“, ohne den Urheber ausdrücklich zu nennen
  alternative: „eine Offenbarung gegeben wird“ oder „Gott einem anderen etwas offenbart“
  rationale: Die Passivform bezeichnet ein Offenbarungsgeschehen, nennt an dieser Stelle aber weder ausdrücklich Gott als Handelnden noch verwendet sie ein Substantiv für „Offenbarung“. Die Übersetzung wahrt diese Zurückhaltung und die Offenheit hinsichtlich des konkret Offenbarten.
translation_notes:
  register: Modernes Standarddeutsch in einem knappen, würdigen Anweisungsstil. Die Satzstellung folgt dem griechischen Gedankengang, bleibt aber idiomatisch; „der Erste“ bewahrt die knappe Ausdrucksweise des Ausgangstextes, während die Fußnote den Bezug auf den ersten Redner erläutert.
