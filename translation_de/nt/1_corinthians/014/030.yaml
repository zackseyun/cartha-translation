  source_fidelity: '„Wenn aber einem anderen, der dasitzt, etwas offenbart wird“ gibt ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ präzise wieder: Bedingung, leichter Kontrast, der andere Beteiligte, das unpersönlich-passiv formulierte Offenbarungsgeschehen und dessen Bezug auf den Sitzenden bleiben erhalten. „soll der Erste schweigen“ gibt den Imperativ σιγάτω angemessen wieder, ohne über den knappen Bezug von ὁ πρῶτος hinauszugehen.'
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch und bewahrt zugleich den knappen anweisenden Ton des Kontextes. „Der dasitzt“ ist eine zulässige, anschauliche Wiedergabe des Partizips und im Satz nicht missverständlich.
  terminology: „Offenbart wird“ wahrt die Offenbarungsterminologie und nennt, wie der griechische Text, keinen ausdrücklich handelnden Urheber. „Der Erste“ bewahrt die Ausdrucksweise des Ausgangstextes; die Fußnote klärt zurückhaltend, dass der zuerst Redende gemeint ist.
