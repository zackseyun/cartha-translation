  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: de
  text: Was folgt daraus? Ich werde mit dem Geist[a] beten, aber ich werde auch mit dem Verstand beten; ich werde mit dem Geist lobsingen[b], aber ich werde auch mit dem Verstand lobsingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „im Geist“ oder „durch den Geist“. Der griechische Text lässt offen, ob hier speziell der Heilige Geist, der menschliche Geist des Betenden oder geistgewirktes Reden gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „singen“ oder „Musik machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Was folgt daraus?
  rationale: Die rhetorische Frage leitet die praktische Folgerung ein. Diese Wiedergabe ist im modernen Deutschen natürlich und gibt die Funktion der griechischen Wendung wieder, ohne unnötig zu ergänzen.
- source_word: προσεύξομαι
  choice: ich werde … beten
  rationale: Das Futur von προσεύχομαι wird direkt und idiomatisch wiedergegeben; das Medium verlangt hier keine besondere reflexive Form.
- source_word: τῷ πνεύματι
  choice: mit dem Geist
  rationale: „Mit“ bewahrt die mögliche instrumentale beziehungsweise modale Bedeutung des Dativs sowie die formale Parallele zu „mit dem Verstand“. Die Großschreibung legt im Deutschen zwar häufig den Heiligen Geist nahe; die Fußnote hält die im Kontext bestehende Referenzfrage ausdrücklich offen.
- source_word: τῷ νοΐ
  choice: mit dem Verstand
  rationale: νοῦς bezeichnet hier das Vermögen bewussten Denkens und Verstehens. „Verstand“ bildet einen klaren, natürlichen Kontrast zu „Geist“, ohne bereits zu „verständlichen Worten“ auszudeuten.
- source_word: ψαλῶ
  choice: ich werde … Loblieder singen
  rationale: ψάλλω bezeichnet in diesem gottesdienstlichen Zusammenhang das Singen zum Lob Gottes. „Loblieder singen“ ist gegenwärtiges, verständliches Deutsch und wahrt den kultischen Sinn.
- source_word: δὲ καὶ
  choice: aber ich werde auch
  rationale: Die Formulierung bringt sowohl die Hinzufügung als auch den milden Kontrast zwischen den beiden Weisen des Betens und Singens zum Ausdruck.
theological_decisions:
- issue: Referenz von πνεῦμα im Gegensatz zu νοῦς
  choice: Im Haupttext steht „Geist“, ohne durch „mein“ oder eine erklärende Umschreibung eindeutig festzulegen, wessen Geist gemeint ist.
  alternative: „der Heilige Geist“, „mein Geist“ oder „geistgewirktes Reden“
  rationale: Der griechische Text benennt nicht ausdrücklich, ob Paulus den menschlichen Geist, den Heiligen Geist oder geistgewirktes Äußern meint. Die Übersetzung soll diese exegetische und theologische Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der Verben und die parallele Satzstruktur wurden beibehalten, weil sie die ausgewogene Gegenüberstellung des griechischen Textes tragen. „Loblieder“ verdeutlicht den gottesdienstlichen Sinn, ohne eine bestimmte musikalische Form vorauszusetzen.
