reference: 1 Corinthians 14:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: de
  text: 'das Verborgene seines Herzens wird offenbar, und so wird er auf sein Angesicht fallen, Gott anbeten und bekennen: »Gott ist wirklich unter euch[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in euch«.'
    reason: Die griechische Wendung ἐν ὑμῖν kann sowohl Gottes Gegenwart inmitten der Gemeinde als auch sein Sein in ihr ausdrücken.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: das Verborgene
  rationale: Die substantivierte Mehrzahl bezeichnet die verborgenen Gedanken und Beweggründe im Inneren des Menschen. Der deutsche Kollektivausdruck ist natürlich und wahrt die begriffliche Weite.
- source_word: τῆς καρδίας αὐτοῦ
  choice: seines Herzens
  rationale: »Herz« bewahrt den biblischen Ausdruck für das innere Denken, Wollen und Empfinden, ohne ihn durch eine auslegende Umschreibung einzuengen.
- source_word: φανερὰ γίνεται
  choice: wird offenbar
  rationale: Die Formulierung gibt sowohl das Sichtbarwerden als auch den inchoativen Zug von γίνεται knapp und idiomatisch wieder.
- source_word: καὶ οὕτως
  choice: und so
  rationale: Die Wendung verbindet das Offenbarwerden des Inneren mit der daraus folgenden Reaktion.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: wird er auf sein Angesicht fallen
  rationale: Die bildhafte Körperhaltung der Niederwerfung bleibt erhalten; »Angesicht« ist hier würdevoll und als feste Wendung gut verständlich.
- source_word: προσκυνήσει τῷ θεῷ
  choice: Gott anbeten
  rationale: Im Bezug auf Gott bezeichnet das Verb religiöse Verehrung. Die körperliche Niederwerfung ist bereits im vorausgehenden Ausdruck sichtbar.
- source_word: ἀπαγγέλλων
  choice: bekennen
  rationale: Das Partizip bezeichnet die ausdrückliche Mitteilung seiner gewonnenen Überzeugung. »Bekennen« passt im Deutschen zu dieser anerkennenden Aussage, ohne eine öffentliche Verkündigung vorauszusetzen.
- source_word: Ὄντως
  choice: wirklich
  rationale: Das Adverb bekräftigt die Wahrheit der Feststellung in natürlichem modernem Deutsch.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Im Zusammenhang der versammelten Gemeinde bezeichnet die Wendung am wahrscheinlichsten Gottes Gegenwart in ihrer Mitte; die ebenso mögliche räumlich-innerliche Wiedergabe wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von ἐν ὑμῖν im abschließenden Bekenntnis
  choice: unter euch
  alternative: in euch
  rationale: Der unmittelbare Zusammenhang handelt von der versammelten Gemeinde und davon, dass ein Außenstehender Gottes Gegenwart an ihrem prophetischen Reden erkennt. »Unter euch« gibt diesen gemeinschaftlichen Sinn wieder. Da ἐν auch »in« bedeuten kann und damit eine stärkere Aussage über Gottes Innewohnen möglich bleibt, wird diese Lesart in einer Fußnote festgehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche Niederwerfungsformel bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser gut zugänglich.
