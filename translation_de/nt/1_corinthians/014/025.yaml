  source_fidelity: 'Die Übersetzung gibt den griechischen Satzbau und Sinn präzise wieder: τὰ κρυπτὰ als Kollektivsingular »das Verborgene«, φανερὰ γίνεται als »wird offenbar«, die Folgebeziehung von καὶ οὕτως sowie Niederfallen, Anbetung und das begleitende Bekenntnis. »Unter euch« ist im Gemeindekontext die naheliegende Wiedergabe von ἐν ὑμῖν; die mögliche Alternative »in euch« ist angemessen vermerkt.'
  naturalness: Der Text ist gut verständliches, zugleich würdiges modernes Standarddeutsch. Die Formel »auf sein Angesicht fallen« ist leicht gehoben bzw. biblisch geprägt, aber als bewusste Wiedergabe der dargestellten Niederwerfung idiomatisch und im Register der Passage passend.
  terminology: »Herz«, »offenbar«, »Gott anbeten« und »bekennen« sind sachgerecht. »Bekennen« vermittelt hier eine ausdrückliche anerkennende Erklärung und überdeutet ἀπαγγέλλων nicht. Die Fußnote erhält die semantische Offenheit von ἐν ὑμῖν ohne eine theologische Festlegung.
