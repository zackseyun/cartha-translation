source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: de
  text: 'Was nun, Brüder und Schwestern?[a] Wenn ihr zusammenkommt, hat jeder etwas: einen Psalm, eine Lehre, eine Offenbarung, eine Zungenrede[b], eine Auslegung. Alles soll zur Erbauung geschehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Brüder«. Der griechische Ausdruck kann in einer gemischten Gemeinschaft Frauen und Männer gemeinsam ansprechen.
    reason: lexical_alternative
  - marker: b
    text: Auch »Sprachenrede« oder »Sprache«. Das griechische Wort kann »Zunge« oder »Sprache« bedeuten; die genaue Art dieser Rede wird hier nicht festgelegt.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Was folgt daraus
  rationale: Gibt die rhetorische Überleitung idiomatisch und gegenwartsnah wieder, ohne den praktischen Folgerungscharakter zu verlieren.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Das grammatisch maskuline Pluralwort bezeichnet hier die versammelte Gemeinde insgesamt; die inklusive Wiedergabe macht den gemeinten Adressatenkreis im modernen Deutschen unmittelbar verständlich.
- source_word: ὅταν συνέρχησθε
  choice: Wenn ihr zusammenkommt
  rationale: Natürliche deutsche Wiedergabe des wiederholbaren zeitlichen Geschehens einer Gemeindeversammlung.
- source_word: ἕκαστος … ἔχει
  choice: hat jeder etwas
  rationale: Bewahrt den distributiven Sinn und führt die anschließende Aufzählung in natürlichem Deutsch ein; das ergänzte »etwas« wird durch die Liste erläutert.
- source_word: ψαλμόν
  choice: einen Psalm
  rationale: Behält den spezifischen Begriff bei, statt ihn zu dem allgemeineren »Lied« zu erweitern.
- source_word: διδαχήν
  choice: eine Lehre
  rationale: Bezeichnet hier einen lehrenden Beitrag; »Lehre« ist knapp und verständlich, ohne zwingend ein Lehrsystem zu meinen.
- source_word: ἀποκάλυψιν
  choice: eine Offenbarung
  rationale: Entspricht dem etablierten und transparenten deutschen Begriff für eine offenbarende Mitteilung.
- source_word: γλῶσσαν
  choice: eine Sprachenrede
  rationale: Kennzeichnet das in 1 Korinther 12–14 behandelte Phänomen, ohne festzulegen, ob eine bekannte menschliche Sprache oder eine andere Art von Rede gemeint ist.
- source_word: ἑρμηνείαν
  choice: eine Auslegung
  rationale: Passt zum unmittelbaren Zusammenhang, in dem die Sprachenrede für die Gemeinde verständlich wiedergegeben wird.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Alles soll der Erbauung dienen
  rationale: Gibt die umfassende Anweisung idiomatisch wieder und bewahrt mit »Erbauung« das Bild des Aufbaus der Gemeinde.
theological_decisions:
- issue: Inklusive Bedeutung der Anrede ἀδελφοί
  choice: Brüder und Schwestern im Haupttext
  alternative: Brüder, mit einer erklärenden Fußnote
  rationale: Im Kontext ist die ganze Gemeinde angesprochen. Die deutsche Paarform gibt den tatsächlichen Adressatenkreis klar wieder; eine Fußnote dokumentiert die maskuline Form des griechischen Ausdrucks.
- issue: Bedeutung von γλῶσσα in 1 Korinther 14
  choice: Sprachenrede
  alternative: Zungenrede; Sprache
  rationale: »Sprachenrede« lässt die genaue Art des Phänomens offen und vermeidet, die Spannung des Textes zugunsten einer bestimmten theologischen Deutung aufzulösen.
- issue: Verhältnis der aufgezählten Beiträge
  choice: oder vor dem letzten Glied
  alternative: durchgehend unverbundene Aufzählung wie im Griechischen
  rationale: Das deutsche »oder« macht deutlich, dass nicht jeder Einzelne notwendig alle genannten Beiträge mitbringt. Die distributive Aussage bleibt erhalten, ohne eine starre Gottesdienstordnung aus dem Vers abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestaltung ist mündlich verständlich und behält zugleich die paulinischen Schlüsselbegriffe »Offenbarung« und »Erbauung« bei.
