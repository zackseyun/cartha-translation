id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: de
  text: Wenn aber alle prophetisch reden und ein Ungläubiger oder ein Unkundiger[a] hereinkommt, wird er von allen überführt und von allen geprüft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Außenstehender“. Der griechische Ausdruck kann einen Menschen bezeichnen, dem die nötige Kenntnis oder Vertrautheit fehlt oder der nicht zu der betreffenden Gruppe gehört.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: alle
  rationale: Der umfassende Quantor wird direkt wiedergegeben und bezeichnet im Zusammenhang die prophetisch Redenden in der Versammlung.
- source_word: προφητεύωσιν
  choice: prophetisch reden
  rationale: Die Formulierung bewahrt die paulinische Kategorie der Prophetie, klingt im modernen Deutschen jedoch natürlicher als das selten gebrauchte Verb „prophezeien“.
- source_word: ἄπιστος
  choice: Ungläubiger
  rationale: Im Kontext bezeichnet das Wort einen Menschen, der nicht glaubt; die substantivierte Form ist knapp und geläufig.
- source_word: ἰδιώτης
  choice: Unkundiger
  rationale: Das Wort bezeichnet hier jemanden, dem die einschlägige Kenntnis oder Vertrautheit mit dem Geschehen in der Versammlung fehlt. „Unkundiger“ lässt offen, ob die Person völlig außerhalb der Gemeinde steht.
- source_word: ἐλέγχεται
  choice: wird … überführt
  rationale: „Überführt“ umfasst das Aufdecken und Bewusstmachen des inneren Zustands, ohne den Vorgang auf bloße Zurechtweisung oder endgültige Verurteilung zu verengen.
- source_word: ἀνακρίνεται
  choice: wird … geprüft
  rationale: Das Verb bezeichnet eine prüfende Untersuchung oder Beurteilung. „Geprüft“ wahrt diese Bedeutung, ohne eine endgültige Verdammung auszudrücken.
- source_word: ὑπὸ πάντων
  choice: von allen
  rationale: Die zweimalige identische Wiedergabe erhält die auffällige Wiederholung des griechischen Textes.
- source_word: δέ
  choice: aber / und
  rationale: Das erste δέ markiert den Gegensatz zum vorherigen Szenario und wird mit „aber“ wiedergegeben; das zweite verbindet im Deutschen natürlich den Bedingungssatz.
- source_word: τις
  choice: ein
  rationale: Der unbestimmte Charakter wird im Deutschen durch den unbestimmten Artikel vor den beiden alternativen Bezeichnungen natürlich ausgedrückt.
theological_decisions:
- issue: Bedeutung von ἰδιώτης im Zusammenhang der Versammlung
  choice: „Unkundiger“ im Haupttext
  alternative: „Außenstehender“
  rationale: Der unmittelbare Zusammenhang betont fehlendes Verständnis und mangelnde Vertrautheit. „Unkundiger“ legt nicht fest, dass die Person der Gemeinde vollständig fernsteht; die plausible Lesart „Außenstehender“ wird in der Fußnote bewahrt.
- issue: Wirkung der prophetischen Rede in ἐλέγχεται und ἀνακρίνεται
  choice: „überführt“ und „geprüft“
  alternative: „zurechtgewiesen“ und „gerichtet“
  rationale: Die gewählte Fassung erhält sowohl die aufdeckende als auch die prüfende Wirkung, ohne eine formelle Zurechtweisung oder ein endgültiges Gericht in den Wortlaut hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die Wiederholung „von allen“ folgen der rhetorischen Form des griechischen Textes. „Prophetisch reden“ ist verständlicher als „prophezeien“, ohne den Begriff inhaltlich auszudeuten.
