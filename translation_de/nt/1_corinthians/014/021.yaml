source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: de
  text: 'Im Gesetz steht geschrieben: »Durch Menschen anderer Sprache und durch die Lippen Fremder werde ich zu diesem Volk reden[a], und nicht einmal so werden sie auf mich hören[b]«[c], sagt der Herr[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in anderen Sprachen und mit den Lippen anderer«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werden sie mir Gehör schenken«.'
    reason: lexical_alternative
  - marker: c
    text: Das Zitat greift Jesaja 28,11–12 auf.
    reason: cross_reference
  - marker: d
    text: Da in dem Zitat der Gott Israels spricht, geben manche Übersetzungen den hebräischen Hintergrund mit »sagt der HERR« wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: Im Gesetz
  rationale: νόμος bezeichnet hier weiter gefasst die jüdische Heilige Schrift, obwohl das Zitat aus Jesaja stammt. Die übliche Formulierung »im Gesetz« bewahrt diesen paulinischen Sprachgebrauch.
- source_word: γέγραπται
  choice: steht geschrieben
  rationale: Die deutsche Standardformel für die perfektische passive Einleitung eines Schriftzitates gibt sowohl den bleibenden Geltungsanspruch als auch die griechische Form natürlich wieder.
- source_word: ἐν ἑτερογλώσσοις
  choice: durch Anderssprachige
  rationale: Das substantivisch gebrauchte Wort bezeichnet Menschen, die eine andere beziehungsweise fremde Sprache sprechen. »Anderssprachige« ist knapp, verständlich und erhält den Bezug zum Thema der Sprachenrede im Kontext.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: durch die Lippen Fremder
  rationale: Die körperliche Metapher »Lippen« bleibt erhalten; »Fremder« macht den Zusammenhang mit einer anderen Sprache beziehungsweise Volkszugehörigkeit deutlich, ohne ihn übermäßig auszudeuten.
- source_word: λαλήσω
  choice: werde ich … reden
  rationale: Das Futur von λαλέω wird schlicht und in einem göttlichen Ausspruch angemessen wiedergegeben.
- source_word: τῷ λαῷ τούτῳ
  choice: zu diesem Volk
  rationale: λαός bedeutet im Schriftzitat »Volk«, besonders mit Blick auf Gottes Volk; »Nation« wäre hier weniger natürlich.
- source_word: οὐδ’ οὕτως
  choice: nicht einmal so
  rationale: 'Die knappe Formulierung bewahrt die emphatische Aussage: Selbst auf diese ungewöhnliche Weise wird das Volk nicht reagieren.'
- source_word: εἰσακούσονταί μου
  choice: werden sie auf mich hören
  rationale: εἰσακούω bezeichnet hier nicht nur akustisches Hören, sondern aufmerksames Hören mit möglichem Beiklang des Gehorchens. »Auf mich hören« trägt diese Bedeutungsbreite im modernen Deutschen.
- source_word: λέγει κύριος
  choice: sagt der Herr
  rationale: Die präsentische Zitatabschlussformel wird natürlich wiedergegeben; κύριος erscheint entsprechend dem griechischen Wortlaut als »der Herr«.
theological_decisions:
- issue: Wiedergabe von κύριος in einem Schriftzitat mit Gott als Sprecher
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text bietet κύριος und wird daher im Haupttext als »der Herr« wiedergegeben. Da das Jesajazitat im hebräischen Hintergrund den Gott Israels sprechen lässt, wird die traditionelle Schreibweise »der HERR« als mögliche Wiedergabe in einer Fußnote genannt.
- issue: Bedeutungsumfang von εἰσακούσονταί μου
  choice: werden sie auf mich hören
  alternative: werden sie mir Gehör schenken
  rationale: Die Hauptfassung lässt sowohl Hören als auch Beachten beziehungsweise Gehorchen anklingen, ohne die ablehnende Reaktion ausschließlich als Ungehorsam auszulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schriftzitatton. Die Formulierung bleibt eng am Griechischen, vermeidet konfessionelle Zusätze und bewahrt durch Fußnoten die lexikalischen sowie theologischen Alternativen.
