  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: de
  text: Wenn jemand meint, ein Prophet oder geistlich zu sein, soll er anerkennen, dass das, was ich euch schreibe, des Herrn ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „des Herrn ist“. Die elliptische Formulierung kann im Zusammenhang bedeuten: „ein Gebot des Herrn ist“; das Wort „Gebot“ steht jedoch nicht ausdrücklich im griechischen Text.'
    reason: Die griechische Formulierung κυρίου ἐστίν ist elliptisch. Die Fußnote erläutert die naheliegende kontextuelle Ergänzung, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: δοκεῖ
  choice: meint
  rationale: Im Zusammenhang bezeichnet das Verb die Selbsteinschätzung oder den Anspruch einer Person; „meint“ ist natürlich und bewahrt den möglicherweise korrigierenden Unterton.
- source_word: προφήτης
  choice: Prophet
  rationale: Die übliche und kontextgerechte Wiedergabe im Abschnitt über Geistesgaben und prophetisches Reden.
- source_word: πνευματικός
  choice: geistlich
  rationale: Die substantivisch gebrauchte Personenbezeichnung bleibt im Griechischen bewusst knapp und kann eine vom Geist geprägte oder geistbegabte Person meinen. „geistlich“ bewahrt diese Offenheit.
- source_word: ἐπιγινωσκέτω
  choice: soll er erkennen
  rationale: Der Imperativ fordert dazu auf, die Autorität des Geschriebenen anzuerkennen; „erkennen“ gibt dies verständlich wieder, ohne die Bedeutung unnötig zu erweitern.
- source_word: ἃ γράφω ὑμῖν
  choice: das, was ich euch schreibe
  rationale: Natürliche Wiedergabe des Relativsatzes und des epistolischen Präsens.
- source_word: κυρίου ἐστίν
  choice: vom Herrn ist
  rationale: Die knappe Genitivkonstruktion wird formal bewahrt. Sie lässt offen, ob ausdrücklich ein „Gebot“ ergänzt werden soll, und erhält so die echte Ellipse des griechischen Textes.
theological_decisions:
- issue: Elliptische Bedeutung von κυρίου ἐστίν
  choice: „vom Herrn ist“
  alternative: „ein Gebot des Herrn ist“ / „dem Herrn gehört“
  rationale: Im Kontext wird die Autorität des Herrn beansprucht, doch im griechischen Text steht kein Substantiv für „Gebot“. Die gewählte Fassung bewahrt die theologisch bedeutsame Spannung und vermeidet eine stillschweigende Auflösung der Ellipse.
- issue: Generisches Maskulinum in τις … προφήτης … πνευματικός
  choice: „jemand … er“
  alternative: „wer … diese Person“ oder eine vollständig geschlechtsneutrale Umformung
  rationale: Die grammatisch maskuline Singularform wird als generische Einzelperson wiedergegeben; zugleich beginnt der Satz mit dem inklusiven „jemand“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gut verständlich, während die knappe und mehrdeutige Schlussformulierung des Ausgangstextes bewusst erhalten bleibt.
