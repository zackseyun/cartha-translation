source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: de
  text: Brüder[a], werdet in eurem Denken nicht zu Kindern, sondern seid im Bösen[b] Säuglinge; in eurem Denken aber werdet reif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Brüder und Schwestern«; das griechische Wort lautet wörtlich »Brüder« und dient hier als Anrede der Gemeinde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in der Bosheit«; das griechische Wort kann Böses, Schlechtigkeit oder Bosheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Vokativ Plural wird formgetreu wiedergegeben; im Kontext ist die ganze Gemeinde angesprochen, was die Fußnote erläutert.
- source_word: παιδία
  choice: Kinder
  rationale: Das Wort bezeichnet Kinder allgemein und bildet den ersten Teil des Gegensatzes zu νηπιάζετε und τέλειοι.
- source_word: γίνεσθε
  choice: werdet
  rationale: Die Wiedergabe bewahrt bei beiden Vorkommen die dynamische Bedeutung von γίνομαι und die rhetorische Entsprechung.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: in eurem Denken
  rationale: φρήν bezeichnet hier Denk- und Urteilsvermögen; die Formulierung ist im modernen Deutsch natürlich und lässt die Wiederholung sichtbar.
- source_word: τῇ κακίᾳ
  choice: im Bösen
  rationale: κακία bezeichnet hier am ehesten den allgemeinen Bereich des Bösen; die engere Bedeutung „Bosheit“ bleibt in einer Fußnote erhalten.
- source_word: νηπιάζετε
  choice: seid wie unmündige Kinder
  rationale: Die Wendung vermittelt das Bild kindlicher Unreife, ohne das im Deutschen unnatürlich wirkende „seid Säuglinge“ zu erzwingen.
- source_word: τέλειοι
  choice: mündig
  rationale: τέλειος meint hier geistige Reife und Urteilsfähigkeit, nicht sündlose Vollkommenheit; „mündig“ greift zudem den Gegensatz zur Unmündigkeit auf.
- source_word: ἀλλὰ ... δὲ
  choice: vielmehr ... aber
  rationale: Die Kontrastpartikeln strukturieren die doppelte Aufforderung klar und idiomatisch.
theological_decisions:
- issue: Geschlechtsspezifische Gemeindeanrede
  choice: „Brüder“ im Haupttext mit inklusiver Erläuterung in der Fußnote
  alternative: „Brüder und Schwestern“
  rationale: Die griechische maskuline Form bleibt sichtbar, während die Fußnote erklärt, dass sie hier als Anrede der gesamten Gemeinde gebraucht wird.
- issue: Bedeutung von τέλειοι
  choice: „mündig“ im Sinn geistiger Reife
  alternative: „vollkommen“
  rationale: Der unmittelbare Gegensatz zu kindlichem Denken betrifft Reife und Urteilsvermögen, nicht moralische oder sündlose Vollkommenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „in eurem Denken“ bildet die griechische Rahmung nach. „Mündig“ und „unmündige Kinder“ machen den Reifekontrast verständlich, ohne τέλειοι als sündlose Vollkommenheit zu deuten.
