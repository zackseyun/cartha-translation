  source_fidelity: Der Entwurf gibt die Satzstruktur, die wiederholte Bezugnahme auf das Denken (ταῖς φρεσίν) und die Aufforderung zur Reife insgesamt zutreffend wieder. „Wie unmündige Kinder“ schwächt jedoch das spezifische Bild von νηπιάζετε ab, das ausdrücklich das Säuglings-/Kleinkindsein bezeichnet. Außerdem steht die Fußnotenmarke b derzeit bei „Kinder“, obwohl die Anmerkung κακία („im Bösen“) erläutert.
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch. „Seid im Bösen Säuglinge“ ist trotz seiner Bildhaftigkeit idiomatisch genug und gibt den pointierten Gegensatz des griechischen Satzes genauer wieder. „Werdet reif“ ist hier eine natürliche Wiedergabe von τέλειοι.
  terminology: „Brüder“ mit erläuternder Fußnote bewahrt die maskuline Anredeform bei zugleich kenntlich gemachter Gemeindeweite. „Im Bösen“ hält die breite Bedeutung von κακία offen; „reif“ bezeichnet den in diesem Kontext gemeinten Gegensatz zu kindlichem Denken, ohne „Vollkommenheit“ im Sinn moralischer Fehlerlosigkeit nahezulegen.
