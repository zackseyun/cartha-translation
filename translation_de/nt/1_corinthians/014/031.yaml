id: 1CO.14.31
reference: 1 Corinthians 14:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: de
  text: Denn ihr könnt alle einer nach dem anderen[a] prophetisch reden, damit alle lernen und alle ermutigt werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeweils einer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ermahnt“ oder „getröstet werden“; das griechische Verb kann je nach Zusammenhang Ermutigung, Ermahnung oder Trost bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: ihr könnt
  rationale: Die Form bezeichnet Fähigkeit oder Möglichkeit. „Ihr könnt“ ist im heutigen Deutsch natürlich und passt zu Paulus’ praktischer Anweisung.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert die vorangehende Anweisung; „Denn“ bewahrt diesen Zusammenhang knapp.
- source_word: καθ’ ἕνα
  choice: einer nach dem anderen
  rationale: Die Wendung bezeichnet eine geordnete Abfolge einzelner Sprecher. Die gewählte Formulierung ist idiomatisch und lässt sich auch als „jeweils einer“ verstehen.
- source_word: πάντες
  choice: alle
  rationale: Das dreimal wiederholte Wort wird jeweils mit „alle“ wiedergegeben, um Nachdruck und Umfang zu bewahren, ohne die jeweilige Bezugsgruppe enger festzulegen als der griechische Text.
- source_word: προφητεύειν
  choice: prophetisch reden
  rationale: Die Wiedergabe bewahrt die paulinische Kategorie des prophetischen Redens und ist im modernen Deutsch klarer als das missverständliche „prophezeien“, das oft nur als Zukunftsvorhersage verstanden wird.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck- bzw. Zielbezug der Aussage natürlich wieder.
- source_word: μανθάνωσιν
  choice: lernen
  rationale: Im mit „damit“ eingeleiteten Satz gibt der deutsche Indikativ die griechische Zweckkonstruktion natürlich wieder und bewahrt den allgemeinen Sinn des Lernens.
- source_word: παρακαλῶνται
  choice: ermutigt werden
  rationale: παρακαλέω kann je nach Zusammenhang ermutigen, ermahnen oder trösten bedeuten. „Ermutigt werden“ erfasst hier die breite, aufbauende Wirkung prophetischen Redens, ohne sie auf Ermahnung oder Trost zu verengen.
theological_decisions:
- issue: Bezugsbereich von πάντες („alle“) in der Gemeindeversammlung
  choice: Die dreifache Wiederholung wird jeweils als „alle“ bewahrt, ohne die erste Gruppe ausdrücklich als „ihr alle“ oder „alle Propheten“ festzulegen.
  alternative: „ihr alle“ beziehungsweise „alle Propheten“ für das erste πάντες
  rationale: Das erste „alle“ bezieht sich im Zusammenhang wahrscheinlich auf diejenigen, die prophetisch reden können, während die späteren Vorkommen die Lernenden und Ermutigten bezeichnen. Die Übersetzung lässt diese Bezugsbereiche wie der griechische Text vom Kontext bestimmen.
- issue: Bedeutungsumfang von παρακαλῶνται
  choice: „ermutigt werden“ im Haupttext, mit den Alternativen „ermahnt“ und „getröstet“ in der Fußnote
  alternative: „ermahnt werden“ oder „getröstet werden“ im Haupttext
  rationale: Der Kontext des Aufbaus der Gemeinde begünstigt „ermutigt“, doch das griechische Verb trägt einen weiteren Bedeutungsumfang. Die Fußnote bewahrt diese theologisch und pastoral relevante Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, bleibt aber idiomatisch. Die Wiederholung von „alle“ wurde bewusst beibehalten. „Prophetisch reden“ vermeidet die im heutigen Deutsch häufige Verengung von „prophezeien“ auf Zukunftsvorhersagen.
