  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: de
  text: Ich danke Gott, dass ich mehr als ihr alle in Zungen rede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich mehr als ihr alle in Sprachen rede“. Das griechische Wort kann „Sprachen“ bedeuten; im Zusammenhang von 1. Korinther 12–14 bezeichnet es die dort behandelte Erscheinung, die traditionell als „Zungenreden“ bezeichnet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Ich danke
  rationale: Das Präsens Aktiv in der ersten Person Singular wird im modernen Deutschen direkt und natürlich mit „Ich danke“ wiedergegeben.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet bei εὐχαριστέω die Person, der gedankt wird; die deutsche Konstruktion „jemandem danken“ bewahrt den Dativ ohne zusätzliche Präposition.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: mehr als ihr alle
  rationale: Der Genitiv beim Komparativ μᾶλλον drückt den Vergleich mit der gesamten angesprochenen Gruppe aus. „Mehr als ihr alle“ ist idiomatisch und lässt offen, ob die Gruppe kollektiv oder jedes einzelne Mitglied vergleichend im Blick steht.
- source_word: γλώσσαις
  choice: in Sprachen
  rationale: γλῶσσα kann „Zunge“ oder „Sprache“ bedeuten. „In Sprachen reden“ ist im Deutschen verständlich, bewahrt den sprachlichen Bezug und legt die genaue Art des in 1 Korinther 12–14 behandelten Phänomens nicht fest.
- source_word: λαλῶ
  choice: rede
  rationale: Das einfache Präsens gibt die gegenwärtige allgemeine Aussage angemessen wieder. Zusammen mit „in Sprachen“ entspricht „reden“ dem wiederkehrenden Ausdruck des Kontextes.
theological_decisions:
- issue: Wiedergabe von γλώσσαις im Zusammenhang der Geistesgabe
  choice: in Sprachen
  alternative: in Zungen
  rationale: „In Sprachen“ gibt eine reguläre lexikalische Bedeutung von γλῶσσα wieder, während die Fußnote die traditionelle Bezeichnung „in Zungen“ nennt. Keine der Formulierungen soll entscheiden, ob es sich um bekannte menschliche Sprachen, ekstatische Rede oder eine weiter gefasste Erscheinung handelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt erkennbar; die umstrittene Art des bezeichneten Phänomens wird nicht näher bestimmt.
