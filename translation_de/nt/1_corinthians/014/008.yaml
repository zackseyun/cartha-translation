  text: καὶ γὰρ ἐὰν ἄδηλον ⸂φωνὴν σάλπιγξ⸃ δῷ, τίς παρασκευάσεται εἰς πόλεμον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: de
  text: Denn wenn die Trompete einen undeutlichen Ton gibt, wer wird sich dann zum Kampf bereitmachen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn
  rationale: Die Partikelverbindung führt eine begründende Erläuterung ein; „Denn“ gibt diese Funktion im Deutschen natürlich und knapp wieder.
- source_word: ἐὰν
  choice: wenn
  rationale: Mit dem Konjunktiv δῷ bildet ἐὰν einen Bedingungssatz. In diesem allgemeinen Beispiel ist „wenn“ idiomatischer als „falls“.
- source_word: ἄδηλον
  choice: undeutlichen
  rationale: Das Adjektiv bezeichnet etwas nicht klar Erkennbares. Bei einem akustischen Signal ist „undeutlich“ eine natürliche und genaue Wiedergabe.
- source_word: φωνὴν
  choice: Ton
  rationale: Im Zusammenhang mit einer Trompete bezeichnet φωνή den hervorgebrachten Klang beziehungsweise Signalton. „Ton“ ist hier idiomatisch und verständlich.
- source_word: σάλπιγξ
  choice: die Trompete
  rationale: Obwohl das griechische Substantiv artikellos ist, bezeichnet es hier beispielhaft das Instrument als Gattung; der bestimmte Artikel ist im Deutschen dafür natürlich.
- source_word: δῷ
  choice: gibt
  rationale: Die Wiedergabe bewahrt die Bildsprache von δίδωμι und entspricht der geläufigen Verbindung „einen Ton geben“.
- source_word: τίς
  choice: wer
  rationale: Das Interrogativpronomen leitet eine rhetorische Frage ein und wird direkt mit „wer“ wiedergegeben.
- source_word: παρασκευάσεται
  choice: wird sich bereitmachen
  rationale: Die mediale Form legt nahe, dass die betreffende Person sich selbst vorbereitet. Die reflexive Formulierung macht diese Nuance im Deutschen ausdrücklich.
- source_word: εἰς πόλεμον
  choice: zum Kampf
  rationale: Wörtlich bezeichnet πόλεμος Krieg; im Zusammenhang mit einem militärischen Trompetensignal meint die Wendung das Bereitmachen für den Kampf. „Zum Kampf“ ist präzise und idiomatisch.
