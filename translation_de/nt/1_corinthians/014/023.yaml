id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: de
  text: 'Wenn nun die ganze Gemeinde an einem Ort zusammenkommt und alle in Zungen[a] reden und Unkundige[b] oder Ungläubige hereinkommen, werden sie dann nicht sagen: Ihr seid von Sinnen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Sprachen“. Das griechische Wort kann „Sprachen“ bedeuten; „Zungen“ bewahrt hier die geläufige Bezeichnung, ohne die umstrittene Art des Phänomens festzulegen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Außenstehende“. Gemeint sind wahrscheinlich Menschen, die mit den Vorgängen in der Gemeinde nicht vertraut oder darin nicht unterwiesen sind; sie werden hier von den „Ungläubigen“ unterschieden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet hier die Folgerung aus dem vorherigen Gedankengang; „nun“ verbindet natürlich und bewahrt den folgernden Übergang.
- source_word: ἐκκλησία ὅλη
  choice: die ganze Gemeinde
  rationale: Im paulinischen Zusammenhang bezeichnet ἐκκλησία die christliche Gemeinde; ὅλη betont ihre Gesamtheit. „Gemeinde“ ist im Deutschen natürlich und passt zum konkreten Zusammenkommen.
- source_word: συνέλθῃ ... ἐπὶ τὸ αὐτό
  choice: an einem Ort zusammenkommt
  rationale: Gibt sowohl das Versammeln als auch den räumlichen Sinn der Wendung ἐπὶ τὸ αὐτό wieder, ohne unnötige Wiederholung.
- source_word: λαλῶσιν γλώσσαις
  choice: in Zungen reden
  rationale: Die etablierte deutsche Wendung wahrt die Offenheit hinsichtlich der genauen Art des in 1. Korinther 12–14 behandelten Sprachphänomens.
- source_word: ἰδιῶται
  choice: Unkundige
  rationale: Bezeichnet Personen, die mit der betreffenden Praxis oder dem Gemeindegeschehen nicht vertraut beziehungsweise darin nicht unterwiesen sind. Der Ausdruck hält sie sprachlich von den anschließend genannten Ungläubigen unterscheidbar.
- source_word: ἄπιστοι
  choice: Ungläubige
  rationale: Die übliche und sachgerechte Wiedergabe für Menschen, die nicht glauben; sie bewahrt die ausdrückliche Unterscheidung von ἰδιῶται.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: werden sie dann nicht sagen
  rationale: Bewahrt Futur und rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: μαίνεσθε
  choice: ihr seid von Sinnen
  rationale: Gibt den Vorwurf des Verrücktseins würdig und idiomatisch wieder, ohne unnötig umgangssprachlich oder klinisch zu klingen.
theological_decisions:
- issue: Art der γλώσσαι in 1. Korinther 14
  choice: Im Haupttext steht „Zungen“.
  alternative: „Sprachen“
  rationale: γλῶσσαι kann Sprachen bezeichnen, fungiert in diesem Abschnitt aber zugleich als Bezeichnung des umstrittenen charismatischen Phänomens. „Zungen“ hält offen, ob menschliche Fremdsprachen, ekstatische Rede oder eine andere Erscheinungsform gemeint ist.
- issue: Verhältnis von ἰδιῶται und ἄπιστοι
  choice: Die Gruppen werden als „Unkundige“ und „Ungläubige“ unterschieden.
  alternative: ἰδιῶται als „Außenstehende“ wiederzugeben
  rationale: Der griechische Text nennt beide Begriffe nebeneinander. „Unkundige“ bewahrt eher die mögliche Differenz, während „Außenstehende“ leicht mit „Ungläubigen“ zusammenfallen könnte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen Bedingungsstruktur, bleibt aber gut sprechbar. „Gemeinde“, „in Zungen reden“ und „von Sinnen“ sind verständlich und im biblischen Register etabliert, ohne altertümlich zu wirken.
