id: 1CO.14.14
reference: 1 Corinthians 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: de
  text: Denn wenn ich in einer Sprache[a] bete, betet mein Geist, aber mein Verstand[b] ist unfruchtbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „in einer Zunge“. Das griechische Wort kann eine menschliche Sprache bezeichnen oder die in diesem Kapitel behandelte, vom Geist ermöglichte Redeweise.'
    reason: lexikalische Alternative und kontextuelle Mehrdeutigkeit
  - marker: b
    text: 'Oder: „mein Denken“ beziehungsweise „mein Verständnis“.'
    reason: lexikalische Bedeutungsbreite von νοῦς
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Denn wenn
  rationale: γάρ führt die Begründung für den vorherigen Gedankengang ein, während ἐάν den Bedingungssatz eröffnet. „Denn wenn“ gibt beides im Deutschen natürlich wieder.
- source_word: προσεύχωμαι
  choice: ich bete
  rationale: Der Präsenskonjunktiv nach ἐάν wird in diesem allgemeinen Bedingungssatz idiomatisch mit dem deutschen Präsens wiedergegeben.
- source_word: γλώσσῃ
  choice: in einer Sprache
  rationale: γλῶσσα kann sowohl „Zunge“ als auch „Sprache“ bezeichnen. „In einer Sprache“ ist im heutigen Deutschen verständlich und bewahrt den Singular; die Fußnote hält die besondere Verwendung des Wortes in diesem Kapitel offen.
- source_word: τὸ πνεῦμά μου
  choice: mein Geist
  rationale: Die wörtliche Wiedergabe wahrt durch das Possessivpronomen den naheliegenden Bezug auf den Geist des Betenden, ohne die Mitwirkung des Heiligen Geistes auszuschließen oder ausdrücklich einzutragen.
- source_word: προσεύχεται
  choice: betet
  rationale: Das schlichte Präsens entspricht der griechischen Form und bildet die Wiederholung des Verbs aus dem Bedingungssatz ab.
- source_word: ὁ δὲ νοῦς μου
  choice: aber mein Verstand
  rationale: νοῦς bezeichnet hier das menschliche Denk- und Erkenntnisvermögen. „Verstand“ bildet einen klaren, natürlichen Gegensatz zu „mein Geist“, ohne den Begriff auf bloßes Wissen zu verengen.
- source_word: ἄκαρπός ἐστιν
  choice: ist unfruchtbar
  rationale: Die Formulierung gibt das Prädikatsadjektiv eng wieder und erhält Paulus’ Bild vom fehlenden Fruchtbringen.
theological_decisions:
- issue: Bezug von τὸ πνεῦμά μου („mein Geist“)
  choice: der eigene Geist des Betenden
  alternative: der Heilige Geist im Betenden
  rationale: Das Possessivpronomen „mein“ und die Gegenüberstellung mit „mein Verstand“ sprechen zunächst für eine anthropologische Aussage über den Betenden. Die Übersetzung bleibt jedoch bei der offenen Formulierung des griechischen Textes und bestreitet damit keine Wirkung des Heiligen Geistes.
- issue: Art der mit γλώσσῃ bezeichneten Rede
  choice: mehrdeutig als „Sprache“ wiedergegeben und in der Fußnote erläutert
  alternative: ausdrücklich „Zungenrede“ oder ausschließlich eine gewöhnliche menschliche Fremdsprache
  rationale: Der griechische Ausdruck kann „Zunge“ oder „Sprache“ bedeuten; sein Gebrauch in diesem Kapitel weist zugleich auf eine besondere, geistgewirkte Redeweise. Eine eindeutige Festlegung würde die sprachliche und theologische Spannung des Textes stärker auflösen als das Original.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der knappen Gegenüberstellung des griechischen Textes. „Sprache“ ist verständlicher als das im Deutschen ungewöhnliche „eine Zunge“; die traditionelle Rede von „Zungen“ wird in der Fußnote transparent gemacht.
