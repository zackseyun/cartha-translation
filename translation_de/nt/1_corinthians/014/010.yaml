  text: Es gibt wohl so viele Arten von Lauten in der Welt, und keine davon ist ohne Bedeutung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „… und nichts ist ohne Laut“ oder „… und nichts ist stimmlos“. φωνή kann „Laut“, „Stimme“ oder „Sprache“ bedeuten; im Zusammenhang ist der Sinn wohl, dass keine Laut- oder Sprachart ohne Bedeutung ist.'
    reason: Die Anmerkung wahrt das Wortspiel zwischen φωνή und ἄφωνος und dokumentiert die wörtlichere, im Deutschen sonst missverständliche Formulierung.
lexical_decisions:
- source_word: τοσαῦτα
  choice: so viele
  rationale: Die Wendung bezeichnet eine große, nicht näher bestimmte Zahl und weist auf γένη voraus.
- source_word: εἰ τύχοι
  choice: wie es sich trifft
  rationale: Die idiomatische Einschränkung bleibt erkennbar, ohne sie zu einer bloßen Unsicherheitsangabe zu verengen.
- source_word: γένη
  choice: Arten
  rationale: „Arten“ gibt die Einteilung in verschiedene Klassen natürlich und präzise wieder.
- source_word: φωνῶν
  choice: von Lauten
  rationale: φωνή kann Laut, Stimme oder Sprache bedeuten. „Laute“ bewahrt hier die lexikalische Breite; die kontextuelle Deutung als Sprachen wird in der Fußnote genannt.
- source_word: ἐν κόσμῳ
  choice: in der Welt
  rationale: Dies ist die direkte und im Zusammenhang natürliche Wiedergabe.
- source_word: οὐδὲν ἄφωνον
  choice: keiner ist ohne Stimme
  rationale: Die Formulierung bewahrt das Wortspiel zwischen φωνή und ἄφωνος. Gemeint sein kann im Zusammenhang, dass keiner bedeutungslos ist; diese Deutung steht in der Fußnote.
