id: 1CO.14.7
reference: 1 Corinthians 14:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: de
  text: 'Auch leblose Dinge, die einen Klang hervorbringen – sei es eine Flöte oder eine Leier[a] –: Wenn sie keine unterscheidbaren Töne geben, wie soll man dann erkennen, was auf der Flöte oder der Leier gespielt wird?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische κιθάρα war ein antikes Saiteninstrument, genauer eine Kithara beziehungsweise eine Form der Leier; manche Übersetzungen geben das Wort mit „Harfe“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Auch
  rationale: Leitet hier ein weiteres, verstärkendes Beispiel ein und verbindet es natürlich mit dem vorangehenden Gedankengang.
- source_word: τὰ ἄψυχα
  choice: leblose Dinge
  rationale: Bewahrt den allgemeinen Ausdruck für unbelebte Gegenstände, der hier durch die genannten Instrumente konkretisiert wird.
- source_word: φωνὴν διδόντα
  choice: die einen Klang hervorbringen
  rationale: Gibt die wörtliche Vorstellung des Hervorbringens eines Lautes in natürlichem modernem Deutsch wieder.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: sei es eine Flöte oder eine Leier
  rationale: αὐλός wird verständlich als Flöte wiedergegeben; κιθάρα bezeichnet ein antikes Saiteninstrument und wird historisch genauer mit Leier übersetzt.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: wenn sie keine unterscheidbaren Töne geben
  rationale: διαστολή bezeichnet Unterscheidung, φθόγγοι einzelne Klänge oder Töne. Die Formulierung macht deutlich, dass die Töne voneinander abgehoben sein müssen.
- source_word: πῶς γνωσθήσεται
  choice: wie soll man dann erkennen
  rationale: 'Das unpersönliche deutsche Aktiv gibt den Sinn des griechischen Passivs idiomatisch wieder: Das Gespielte kann nur anhand unterscheidbarer Töne erkannt werden.'
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: was auf der Flöte oder der Leier gespielt wird
  rationale: Die substantivierten Passivpartizipien bezeichnen das auf den jeweiligen Instrumenten Gespielte; die gemeinsame Formulierung vermeidet schwerfällige Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der instrumentale Vergleich bleiben erhalten; „unterscheidbare Töne“ vermittelt den Gedanken klarer als die wörtlichere Wendung „eine Unterscheidung bei den Tönen“.
