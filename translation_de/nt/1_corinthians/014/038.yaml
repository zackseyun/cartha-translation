    rationale: Diese Wendung ist möglich, bildet die aktive/passive Wortfigur aber weniger klar ab. Eine Fußnote mit „nicht weiß / nicht erkannt“ und „nicht anerkennt / nicht anerkannt“ erklärt die Spannweite und die rhetorische Wiederholung zuverlässiger.
