translation:
  language: de
  text: Wenn aber jemand es nicht anerkennt[b][a], wird er nicht anerkannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: »Wenn jemand unwissend ist, soll er unwissend bleiben.« Der hier zugrunde gelegte Text hat statt des Imperativs ein Passiv: »Wenn aber jemand nicht weiß beziehungsweise nicht anerkennt, wird er nicht erkannt beziehungsweise nicht anerkannt.«'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Wenn aber jemand es nicht weiß, wird er nicht erkannt.« Das griechische Verb kann „nicht wissen“, „nicht anerkennen“ oder „ignorieren“ bedeuten; es steht zuerst im Aktiv und dann im Passiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: wenn
  rationale: Leitet schlicht eine Bedingung ein, ohne ihren Wahrheitsgehalt über den griechischen Satz hinaus festzulegen.
- source_word: δέ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zur Aufforderung im vorhergehenden Vers, Paulus’ Worte als Gebot des Herrn anzuerkennen.
- source_word: τις
  choice: jemand
  rationale: Gibt das indefinite Singularpronomen natürlich und allgemein wieder.
- source_word: ἀγνοεῖ
  choice: nicht anerkennt
  rationale: Im Anschluss an Vers 37 bezeichnet das Verb hier am ehesten die verweigerte Anerkennung; die Verneinungsform ermöglicht zugleich eine natürliche Entsprechung zum Passiv.
- source_word: ἀγνοεῖται
  choice: wird nicht anerkannt
  rationale: Bewahrt das Passiv des angenommenen Textes und den rhetorischen Gleichklang desselben griechischen Verbs in Aktiv und Passiv, ohne den Handelnden ausdrücklich zu bestimmen.
theological_decisions:
- issue: Bedeutung des Passivs ἀγνοεῖται
  choice: Wer die apostolische Weisung nicht anerkennt, wird seinerseits nicht anerkannt.
  alternative: 'Er ist unbekannt; nach einer Textvariante: Er bleibe unwissend.'
  rationale: Der SBLGNT bietet ein passives Indikativ, keinen Imperativ. Die Übersetzung wahrt die wechselseitige beziehungsweise gerichtliche Pointe, lässt aber offen, ob Gott, die Gemeinde oder beide als unausgesprochener Handelnder zu verstehen sind.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. »Anerkennen« knüpft an Vers 37 an und erhält die bewusste Wiederholung; beide Fußnotenmarker stehen unmittelbar bei der strittigen Wendung im Haupttext.
