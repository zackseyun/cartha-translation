    rationale: Der SBLGNT-Text lautet εἰ δέ τις ἀγνοεῖ, ἀγνοεῖται. Die negative bzw. verweigernde Nuance ist kontextuell begründet, aber nicht durch ein οὐ/μή im Text markiert. Die Fußnote soll die Lesart präzise beschreiben und die Übersetzungsentscheidung nicht als Textform ausgeben.
  - severity: low
    issue: „das“ als Objekt im Haupttext ist stärker demonstrativ als erforderlich.
    rationale: Das Objekt ist im Griechischen nicht ausgedrückt. „es“ verweist ausreichend auf die vorausgehende Weisung und klingt im modernen Deutsch natürlicher.
  - severity: low
