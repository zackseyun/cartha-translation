  verdict: revise
  source_fidelity: Die Übersetzung gibt die Bedingung, den Kontrast und die aktive/passive Wiederholung von ἀγνοεῖ zutreffend wieder. Allerdings ist das im Deutschen im Haupttext ergänzte Objekt „das“ nicht im griechischen Wortlaut ausgedrückt; es wird zwar durch den Kontext von V. 37 nahegelegt, doch die knappe Formulierung kann es ohne Verlust auslassen. Die Fußnote a bezeichnet die Lesart des zugrunde gelegten Textes zudem ungenau, weil sie „nicht anerkennt“ als griechische Lesart formuliert, obwohl ἀγνοεῖ ohne Negationspartikel steht und semantisch „nicht wissen / nicht anerkennen / ignorieren“ bedeutet.
  naturalness: „Wenn aber jemand es nicht anerkennt, wird er nicht anerkannt“ ist natürliches modernes Standarddeutsch und erhält die prägnante rhetorische Parallele. Das Pronomen „es“ ist gegenüber „das“ idiomatischer und stellt zugleich klar, dass es sich um eine kontextuelle Ergänzung handelt.
  terminology: „Anerkennen“ ist im Kontext von V. 37 eine tragfähige, registergerechte Wiedergabe und wahrt die Wortwiederholung. Die Alternativfußnote sollte jedoch nicht mit der etwas hölzernen und semantisch verschobenen Wendung „zur Kenntnis nehmen“ arbeiten, sondern die lexikalischen Möglichkeiten „nicht weiß / nicht anerkennt“ und „nicht erkannt / nicht anerkannt“ transparent benennen.
  issues:
