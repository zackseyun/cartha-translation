id: 1CO.14.11
reference: 1 Corinthians 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: de
  text: Wenn ich also die Bedeutung des Lautes[a] nicht kenne, werde ich für den Redenden ein Fremder sein, und der Redende wird für mich ein Fremder sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »die Kraft des Lautes«; gemeint ist seine Bedeutung oder Aussagekraft.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch »ein Barbar«; hier ist damit jemand gemeint, dessen Rede fremd oder unverständlich ist, nicht unbedingt ein unzivilisierter Mensch.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν μὴ εἰδῶ
  choice: Wenn ich also … nicht kenne
  rationale: Gibt die Bedingung mit ἐὰν, den Folgerungscharakter von οὖν und den Grundsinn von οἶδα in natürlichem modernem Deutsch wieder.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: die Bedeutung des Lautes
  rationale: δύναμις bezeichnet hier die vermittelte Bedeutung oder Aussagekraft; φωνή knüpft im Zusammenhang an hörbare Laute an, ohne die Wendung vorschnell auf eine bestimmte Sprache einzuengen.
- source_word: τῷ λαλοῦντι
  choice: für den Redenden
  rationale: Bewahrt den substantivierten Partizipialausdruck und gibt den relationalen Dativ idiomatisch wieder.
- source_word: βάρβαρος
  choice: ein Fremder
  rationale: Bezeichnet hier jemanden, dessen Rede dem anderen fremd beziehungsweise unverständlich ist; das deutsche „Barbar“ wäre irreführend abwertend.
- source_word: ἐν ἐμοὶ
  choice: für mich
  rationale: Gibt die relationale Perspektive der Wendung in der wechselseitigen Aussage natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „ein Fremder sein“ erhält die betonte Gegenseitigkeit des griechischen Satzes; „Laut“ wahrt den Anschluss an den unmittelbaren Kontext hörbarer Laute.
