  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: de
  text: Nun aber hat Gott die Glieder – jedes einzelne von ihnen – im Leib angeordnet[a], wie er es wollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an ihren Platz gestellt; eingesetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nun aber
  rationale: Die Wendung nimmt die vorausgehenden hypothetischen Aussagen kontrastierend auf und kehrt zur tatsächlichen Ordnung zurück. „Nun aber“ bewahrt sowohl den Gegensatz als auch den Übergang im Gedankengang.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und natürliche Wiedergabe des griechischen Subjekts.
- source_word: ἔθετο
  choice: angeordnet
  rationale: Das Verb kann „setzen“, „stellen“ oder „platzieren“ bedeuten. Im Bild vom Leib bringt „angeordnet“ die bewusste Platzierung und Zuordnung der einzelnen Glieder im Ganzen zum Ausdruck.
- source_word: τὰ μέλη
  choice: die Glieder
  rationale: „Glieder“ ist im Bild eines Leibes präzise und idiomatisch; „Körperteile“ wäre sachlicher, aber weniger würdevoll, „Gliedmaßen“ wäre zu eng.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: jedes einzelne von ihnen
  rationale: 'Die Formulierung bewahrt den starken distributiven Nachdruck: Ausnahmslos jedes Glied ist einzeln einbezogen.'
- source_word: ἐν τῷ σώματι
  choice: im Leib
  rationale: „Leib“ passt natürlich zu „Glieder“ und erhält das Körperbild, das im weiteren Zusammenhang auf die Gemeinde bezogen wird.
- source_word: καθὼς ἠθέλησεν
  choice: wie er es wollte
  rationale: Die Formulierung gibt Gottes eigenen Willen beziehungsweise seine Absicht klar und in natürlichem modernem Deutsch wieder, ohne die Aussage systematisch auszuweiten.
theological_decisions:
- issue: Gottes Absicht bei der Zuordnung der Glieder im Leib
  choice: Gott hat jedes einzelne Glied bewusst im Leib angeordnet, wie er es wollte.
  alternative: Gott hat die Glieder lediglich an einen Ort gesetzt, ohne dass eine zweckvolle Ordnung ausdrücklich anklingt.
  rationale: Der Zusammenhang betont, dass die Verschiedenheit der Glieder nicht zufällig ist. „Angeordnet“ und „wie er es wollte“ bewahren diese göttliche Absicht, ohne über die Aussage des Verses hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt den distributiven Nachdruck von ἓν ἕκαστον αὐτῶν hervor. „Leib“ wahrt die etablierte Bildsprache und bildet mit „Glieder“ eine natürliche Verbindung.
