  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: de
  text: 'Und wenn das Ohr sagt: »Weil ich kein Auge bin, gehöre ich nicht zum Leib«, gehört es deshalb nicht etwa nicht zum Leib.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische wiederholt »vom Leib« und weist den Schluss mit einer doppelten Verneinung zurück: wörtlich etwa »ist es deshalb nicht nicht vom Leib«.'
    reason: Die Fußnote erläutert die im Deutschen bewusst rhetorisch wiedergegebene Negationsstruktur sowie die Wiederholung der griechischen Wendung.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt das zweite Beispiel aus dem Körpervergleich fort.
- source_word: ἐὰν εἴπῃ
  choice: wenn … sagt
  rationale: ἐάν mit Aorist Konjunktiv bezeichnet hier einen allgemeinen hypothetischen Fall; die deutsche Präsensform gibt ihn natürlich wieder.
- source_word: τὸ οὖς
  choice: das Ohr
  rationale: Die gewöhnliche anatomische Bezeichnung wahrt die Personifikation des Körperteils.
- source_word: Ὅτι
  choice: Weil
  rationale: ὅτι führt die Aussage des Ohrs ein und hat dabei kausalen Sinn.
- source_word: ὀφθαλμός
  choice: Auge
  rationale: Die direkte anatomische Entsprechung passt zur Gegenüberstellung der Körperteile.
- source_word: ἐκ τοῦ σώματος
  choice: zum Leib gehören
  rationale: In diesem Zusammenhang bezeichnet ἐκ τοῦ σώματος die Zugehörigkeit zum Leib. Die Formulierung wird in beiden Vershälften wiederholt, um Paulus’ rhetorische Wiederaufnahme sichtbar zu halten.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: gehört es deshalb nicht weniger zum Leib
  rationale: Die idiomatische deutsche doppelte Verneinung gibt die Zurückweisung des falschen Schlusses wieder, ohne die Aussage in eine positive Paraphrase aufzulösen.
theological_decisions:
- issue: Leibmetapher und Zugehörigkeit
  choice: Die wiederholte Zugehörigkeitsformulierung »zum Leib gehören« bleibt in beiden Satzhälften erhalten.
  alternative: »Das macht es nicht weniger zu einem Teil des Körpers.«
  rationale: Die gewählte Fassung bewahrt Paulus’ rhetorische Wiederholung und lässt die ekklesiologische Anwendung im Kontext entstehen, statt sie erklärend in den Vers einzutragen.
- issue: Wiedergabe von σῶμα
  choice: Leib
  alternative: Körper
  rationale: »Leib« ist im Deutschen für die paulinische Metapher natürlich und würdig und bezeichnet weiterhin klar den menschlichen Körper, ohne eine konfessionelle Sonderdeutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt schlicht und anschaulich; »nicht weniger« vermittelt die doppelte Verneinung verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der erläuterten Schlussaussage.
