id: 1CO.12.25
reference: 1 Corinthians 12:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: de
  text: damit es im Leib keine Spaltung gibt, sondern die Glieder in gleicher Weise füreinander sorgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieselbe Sorge füreinander haben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den beabsichtigten Zweck beziehungsweise das Ergebnis ein und entspricht in diesem Zusammenhang natürlichem modernem Deutsch.
- source_word: σχίσμα
  choice: Spaltung
  rationale: Bezeichnet einen Riss oder eine Trennung. »Spaltung« bewahrt sowohl das Bild eines zerrissenen Leibes als auch den Bezug auf Uneinigkeit in der Gemeinde, ohne einen späteren kirchengeschichtlichen Fachbegriff vorauszusetzen.
- source_word: σῶμα
  choice: Leib
  rationale: Bewahrt Paulus’ Körpermetapher. »Leib« ist im biblisch-gemeindlichen Zusammenhang würdevoll und geläufig, ohne unverständlich zu sein.
- source_word: τὸ αὐτό
  choice: in gleicher Weise
  rationale: Die Wendung steht bei μεριμνῶσι und bezeichnet die Gleichheit beziehungsweise Gegenseitigkeit der Sorge. Die adverbiale Wiedergabe ist im Deutschen idiomatisch und lässt offen, ob besonders gleiche Sorge oder dasselbe gemeinsame Anliegen betont wird.
- source_word: ὑπὲρ ἀλλήλων
  choice: füreinander
  rationale: Gibt die wechselseitige Ausrichtung der Sorge knapp und natürlich wieder; hier liegt kein stellvertretender Sinn vor.
- source_word: μεριμνῶσι
  choice: sorgen
  rationale: Das Verb bezeichnet hier positive Anteilnahme und Fürsorge, nicht angstvolles Sichsorgen. Zusammen mit »füreinander« vermittelt es aktive gegenseitige Fürsorge.
- source_word: μέλη
  choice: die Glieder
  rationale: Passt genau zur Leibmetapher und kann zugleich die einzelnen Angehörigen der Gemeinde bezeichnen.
theological_decisions:
- issue: Wiedergabe von σχίσμα innerhalb der Metapher vom Leib und der Gemeinde
  choice: Spaltung
  alternative: Trennung; Zwiespalt
  rationale: »Spaltung« bildet den möglichen Grundsinn eines Risses ebenso wie die Uneinigkeit der Gemeinde ab, ohne dem Wort einen späteren konfessionellen oder kirchenrechtlichen Fachsinn aufzuerlegen.
- issue: Bezug von τὸ αὐτό bei der gegenseitigen Sorge
  choice: in gleicher Weise füreinander sorgen
  alternative: dieselbe Sorge füreinander haben
  rationale: Die gewählte Fassung betont die gleichmäßige gegenseitige Fürsorge, wahrt aber durch die Fußnote die grammatisch mögliche Nuance eines gemeinsamen oder gleichen Anliegens.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. »Leib« und »Glieder« erhalten die durchgehende paulinische Metapher; der Satzbau bleibt knapp und gut verständlich.
