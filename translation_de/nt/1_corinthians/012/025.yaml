  naturalness: Der Satz ist klares, modernes Standarddeutsch und hat einen angemessen würdigen biblischen Registerton. Die Verbindung „füreinander sorgen“ ist natürlich; „in gleicher Weise“ vermittelt die Gleichheit der gegenseitigen Fürsorge verständlich.
