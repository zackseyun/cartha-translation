  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: de
  text: einem anderen Wunderwirkungen[a], einem anderen prophetische Rede, einem anderen Unterscheidungen von Geistern, einem anderen Arten von Zungenrede[b], einem anderen die Auslegung von Zungenrede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wirkungen von Kräften“; oder: „Wirkungen von Krafttaten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder hier und im letzten Ausdruck: „Arten von Sprachen“ und „die Auslegung von Sprachen“. Das griechische Wort kann sowohl „Zungen“ als auch „Sprachen“ bedeuten; „Zungenrede“ lässt die genaue Art des Phänomens offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: das Wirken von Wundern
  rationale: Die Wendung bezeichnet Wirkungen beziehungsweise Betätigungen göttlicher Kraft und kann in diesem Zusammenhang auf Wundertaten bezogen werden. Die deutsche Formulierung ist verständlich und gibt den wahrscheinlichen Sinn wieder; die wörtlicheren Möglichkeiten werden in der Fußnote bewahrt.
- source_word: προφητεία
  choice: prophetische Rede
  rationale: Diese Wiedergabe bezeichnet die hier genannte Geistesgabe, ohne den Begriff auf Vorhersagen einzuengen.
- source_word: διακρίσεις πνευμάτων
  choice: Unterscheidungen von Geistern
  rationale: Der Plural von διακρίσεις bleibt erhalten. Zugleich wird nicht festgelegt, ob mit den Geistern geistliche Einflüsse, Wesen, menschliche Geister oder die Quellen geistlicher Äußerungen gemeint sind.
- source_word: γένη γλωσσῶν
  choice: verschiedene Arten von Zungenrede
  rationale: γένη bezeichnet Arten oder Gattungen. „Zungenrede“ ist im Deutschen für diesen Zusammenhang verständlich und lässt die Frage offen, ob bekannte Sprachen oder andere Formen geistgewirkten Redens gemeint sind.
- source_word: ἑρμηνεία γλωσσῶν
  choice: die Auslegung von Zungenrede
  rationale: ἑρμηνεία bezeichnet hier das verständliche Wiedergeben oder Erschließen des Inhalts. „Auslegung“ vermeidet die vorschnelle Festlegung auf gewöhnliche Übersetzung.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: einem anderen
  rationale: Beide Dativformen verteilen die Gaben auf unterschiedliche Personen. Die einheitliche Wiedergabe ist im Deutschen natürlich; der Wechsel der griechischen Wörter verlangt hier keinen hervorgehobenen Bedeutungsunterschied.
theological_decisions:
- issue: Bedeutung von δυνάμεων in der Aufzählung der Geistesgaben
  choice: Als „Wunder“ im Ausdruck „das Wirken von Wundern“ wiedergegeben.
  alternative: „Kräfte“ oder „Machttaten“
  rationale: δυνάμεις kann konkrete machtvolle beziehungsweise wunderbare Taten bezeichnen. Die Hauptfassung gibt den im Kontext wahrscheinlichen Bezug verständlich wieder, während die formaleren Alternativen in der Fußnote genannt werden.
- issue: Bedeutung von γλωσσῶν
  choice: In beiden Fällen mit „Zungenrede“ wiedergegeben.
  alternative: „Sprachen“
  rationale: Der griechische Begriff kann Zungen oder Sprachen bezeichnen. „Zungenrede“ bewahrt im Zusammenhang der Geistesgaben die theologische und sachliche Offenheit; die mögliche Wiedergabe „Sprachen“ steht in der Fußnote.
- issue: Bezug von πνευμάτων
  choice: Die offene Formulierung „von Geistern“ bleibt bestehen.
  alternative: „geistliche Äußerungen“, „die hinter Äußerungen stehenden Geister“, „menschliche Geister“ oder „böse Geister“
  rationale: Der griechische Text bestimmt den genauen Bezug nicht. Eine nähere Festlegung würde eine Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „einem anderen“ bildet die Verteilung der Gaben ab. Fachlich geprägte, aber verständliche Ausdrücke wie „Zungenrede“ und „Unterscheidungen von Geistern“ erhalten die Mehrdeutigkeit des griechischen Textes.
