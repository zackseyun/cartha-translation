revisions:
- from: einem anderen das Wirken von Wundern[a], einem anderen prophetische Rede, einem anderen Unterscheidungen von Geistern, einem anderen verschiedene Arten von Zungenrede[b], einem anderen die Auslegung von Zungenrede.
  to: einem anderen Wunderwirkungen[a], einem anderen prophetische Rede, einem anderen Unterscheidungen von Geistern, einem anderen Arten von Zungenrede[b], einem anderen die Auslegung von Zungenrede.
  rationale: Die Revision korrigiert die pluralische und semantische Wiedergabe von ἐνεργήματα δυνάμεων, strafft die Wiedergabe von γένη und präzisiert die lexikalischen Alternativen in den Fußnoten. Sie legt weder die Natur der Geister noch die Art der Zungenrede fest.
