  text: For the body is not one member, but many.
translation:
  language: de
  text: Denn auch der Körper besteht nicht aus einem Teil, sondern aus vielen Teilen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Denn auch
  rationale: Die Partikelverbindung führt eine begründende Erläuterung des vorherigen Gedankens ein; „Denn auch“ gibt sowohl den erklärenden als auch den ergänzenden Sinn natürlich wieder.
- source_word: τὸ σῶμα
  choice: der Körper
  rationale: „Körper“ bewahrt das konkrete Bild und ist im modernen Standarddeutsch allgemein verständlich. Die im Kontext gemeinte Gemeinde wird nicht erklärend in den Haupttext eingesetzt.
- source_word: οὐκ ἔστιν ἓν μέλος
  choice: besteht nicht aus einem einzigen Teil
  rationale: Die griechische Kopulakonstruktion wird im Deutschen idiomatisch als Aussage über die Zusammensetzung des Körpers wiedergegeben. „Einzigen“ bringt die Betonung von ἓν zum Ausdruck; „Teil“ bezeichnet hier ein Körperteil, ohne das veraltend wirkende „Glied“ zu erzwingen.
- source_word: ἀλλὰ πολλά
  choice: sondern aus vielen
  rationale: Das substantivisch gebrauchte Neutrum Plural nimmt μέλος auf. Die deutsche Ellipse bewahrt die knappe Gegenüberstellung und bleibt eindeutig.
theological_decisions:
- issue: Metaphorischer Bezug von τὸ σῶμα
  choice: Das Körperbild bleibt ohne erklärenden Zusatz stehen.
  alternative: „der Leib Christi“ oder „die Gemeinde“
  rationale: Der weitere Zusammenhang bezieht das Bild auf die Gemeinde, doch dieser Vers sagt lediglich „der Körper“. Eine ausdrückliche Deutung im Haupttext würde mehr festlegen, als der griechische Wortlaut an dieser Stelle ausspricht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Körper“ und „Teil“ vermeiden unnötig altertümliche Sprache; die Konstruktion „besteht aus“ gibt den natürlichen deutschen Sinn der griechischen Aussage wieder.
