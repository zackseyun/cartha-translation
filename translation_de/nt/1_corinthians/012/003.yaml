reference: 1 Corinthians 12:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: de
  text: 'Darum teile ich euch mit: Niemand, der durch den Geist Gottes redet, sagt: »Jesus sei verflucht«[a], und niemand kann sagen: »Jesus ist Herr«[b], außer durch den Heiligen Geist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus ist verflucht.« Der griechische Ausruf enthält kein ausdrückliches Verb und kann als Verfluchungsformel oder als Feststellung verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen: »Herr Jesus«; im Zusammenhang ist die Formulierung als Bekenntnis zu verstehen: »Jesus ist Herr.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang klar und natürlich.
- source_word: γνωρίζω ὑμῖν
  choice: mache ich euch bekannt
  rationale: Gibt die kausative Bedeutung von γνωρίζω transparent wieder, ohne einen im Griechischen nicht ausdrücklich genannten Willensaspekt hinzuzufügen.
- source_word: ἐν πνεύματι θεοῦ
  choice: durch den Geist Gottes
  rationale: Gibt ἐν hier als Mittel beziehungsweise wirkende Befähigung wieder; die Formulierung bleibt zugleich mit einem Reden im Wirkungsbereich des Geistes vereinbar.
- source_word: λαλῶν λέγει
  choice: der … redet, sagt
  rationale: Bewahrt den Unterschied zwischen der allgemeinen Tätigkeit des Redens und der konkreten Äußerung, ohne im Deutschen unnatürlich zu klingen.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Jesus sei verflucht
  rationale: Gibt den verblosen griechischen Ausruf als deutsche Verfluchungsformel wieder. Da kein ausdrücklicher Imperativ vorliegt, wird die alternative Feststellung in der Fußnote genannt.
- source_word: δύναται εἰπεῖν
  choice: kann sagen
  rationale: Ist die natürliche moderne deutsche Wiedergabe der ausgedrückten Fähigkeit beziehungsweise Möglichkeit.
- source_word: Κύριος Ἰησοῦς
  choice: Jesus ist Herr
  rationale: Gibt die nominativische, bekenntnishafte Aussage mit der im Deutschen erforderlichen Kopula wieder.
- source_word: εἰ μὴ
  choice: außer
  rationale: Bezeichnet nach der universalen Verneinung die einzige Ausnahme idiomatisch und präzise.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: durch den Heiligen Geist
  rationale: Gibt wie zuvor die Befähigung beziehungsweise Wirksamkeit des Geistes wieder und wahrt die Parallelität.
theological_decisions:
- issue: Bedeutung von κύριος in Κύριος Ἰησοῦς
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« bewahrt sowohl den gewöhnlichen Titelsinn als auch das christologische Gewicht des paulinischen Bekenntnisses, ohne die Aussage näher dogmatisch festzulegen.
- issue: Geistgewirktes Bekenntnis zu Jesus als Herrn
  choice: Die Aussage über die Befähigung durch den Heiligen Geist bleibt uneingeschränkt stehen.
  alternative: Beschränkung auf bloß aufrichtige Rede oder Ausweitung zu einer vollständigen Lehre über Bekehrung und Wiedergeburt
  rationale: Der Vers verbindet das Bekenntnis zur Herrschaft Jesu mit dem Wirken des Heiligen Geistes. Die Übersetzung bewahrt diese Spannung, ohne »sagen« auf bloße Lautbildung zu reduzieren oder ein umfassenderes Lehrsystem in den Satz einzutragen.
- issue: Kraft der Formel Ἀνάθεμα Ἰησοῦς
  choice: Jesus sei verflucht
  alternative: Jesus ist verflucht
  rationale: Die gewählte Form gibt die mögliche Kraft eines Verfluchungsausrufs gut wieder; weil der griechische verblöse Satz auch als Feststellung verstanden werden kann, wird diese Möglichkeit ausdrücklich in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, während Doppelpunkt und idiomatische Kopulasätze die beiden Äußerungen für heutige Leser klar erkennbar machen.
