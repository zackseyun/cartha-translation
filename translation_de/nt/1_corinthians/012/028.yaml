source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: de
  text: 'Und Gott hat in der Gemeinde eingesetzt: erstens Apostel, zweitens Propheten, drittens Lehrer, dann Wunder[a], dann Gaben zu Heilungen, Hilfeleistungen, Leitungsdienste[b], verschiedene Arten von Zungenrede[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kraftwirkungen“ oder „Machttaten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lenkungen“, „Leitungsformen“ oder „Fähigkeiten zur Leitung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verschiedene Arten von Sprachen“. Das griechische γλῶσσαι kann „Zungen“ oder „Sprachen“ bedeuten; die Haupttextfassung lässt offen, wie das Phänomen genauer zu verstehen ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: hat … eingesetzt
  rationale: Das Aoristverb τίθημι bezeichnet hier Gottes Einsetzung oder Zuordnung von Personen, Gaben und Aufgaben in der Gemeinde. Das Perfekt klingt im modernen Deutsch natürlich und lässt die fortdauernde Bedeutung erkennen.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: in der Gemeinde
  rationale: ἐκκλησία bezeichnet hier die Gemeinschaft der Glaubenden. „Gemeinde“ ist im paulinischen Zusammenhang präzise und vermeidet die mögliche Verengung von „Kirche“ auf Gebäude oder Institution.
- source_word: πρῶτον … δεύτερον … τρίτον
  choice: erstens … zweitens … drittens
  rationale: Die Wiedergabe bildet die ausdrücklich geordnete Folge ab, ohne zu entscheiden, ob sie Rang, zeitliche Abfolge oder funktionale Bedeutung ausdrückt.
- source_word: ἀποστόλους
  choice: Apostel
  rationale: Im gemeindlichen Gabenkatalog bezeichnet das Wort die anerkannte apostolische Aufgabe und nicht lediglich allgemeine Boten.
- source_word: προφήτας
  choice: Propheten
  rationale: Die übliche und kontextgerechte Bezeichnung für Menschen mit prophetischer Aufgabe.
- source_word: διδασκάλους
  choice: Lehrer
  rationale: Direkte, verständliche Wiedergabe der Lehrenden in der Gemeinde.
- source_word: δυνάμεις
  choice: Machttaten
  rationale: Der Plural bezeichnet hier machtvolle, übernatürliche Wirkungen. „Machttaten“ bleibt näher am Grundwort δύναμις als „Wunder“, während die Fußnote die geläufigere Deutung nennt.
- source_word: χαρίσματα ἰαμάτων
  choice: Gaben der Heilungen
  rationale: Beide griechischen Substantive stehen im Plural. Die leicht ungewöhnliche Formulierung bewahrt diese auffällige Gestalt des Ausgangstextes.
- source_word: ἀντιλήμψεις
  choice: Hilfeleistungen
  rationale: Das Wort bezeichnet helfende Unterstützung oder entsprechende Befähigungen. „Hilfeleistungen“ passt als pluralische Funktion in die Aufzählung.
- source_word: κυβερνήσεις
  choice: Leitungsdienste
  rationale: Das bildlich vom Steuern herkommende Wort meint Formen des Lenkens oder Leitens. „Leitungsdienste“ gibt die gemeindliche Funktion wieder, ohne ein bestimmtes hierarchisches Amt vorauszusetzen.
- source_word: γένη γλωσσῶν
  choice: verschiedene Arten von Zungenrede
  rationale: γένη bezeichnet Arten oder Gattungen; γλῶσσαι kann Zungen oder Sprachen bedeuten. „Zungenrede“ bewahrt den etablierten Ausdruck für das in diesem Kapitel behandelte Phänomen, ohne es im Haupttext einfach mit gewöhnlichen Fremdsprachen gleichzusetzen.
theological_decisions:
- issue: Bedeutung der Reihenfolge „erstens … zweitens … drittens … dann“
  choice: Die Reihenfolge wird ausdrücklich und ohne erklärenden Zusatz wiedergegeben.
  alternative: Sie könnte als Rangordnung, zeitliche Abfolge oder rhetorische Gewichtung verstanden werden.
  rationale: Der Vers ordnet die ersten Glieder deutlich, erklärt aber nicht, welcher Art diese Ordnung ist. Die Übersetzung lässt diese Spannung bestehen.
- issue: Bedeutung von γλῶσσαι
  choice: Im Haupttext steht „Zungenrede“.
  alternative: „Sprachen“ oder „Rede in verschiedenen Sprachen“.
  rationale: Der nähere Zusammenhang lässt die genaue Art des Phänomens umstritten. „Zungenrede“ wahrt die paulinische Terminologie; die lexikalische Alternative wird in der Fußnote genannt.
- issue: Personen und Wirkungen innerhalb derselben Aufzählung
  choice: 'Die grammatisch gemischte Liste bleibt erhalten: Personen werden neben Machttaten, Gaben und Diensten genannt.'
  alternative: Alle Glieder könnten zur Glättung als Ämter, Personengruppen oder Gaben formuliert werden.
  rationale: Der griechische Text wechselt selbst von Personenbezeichnungen zu Wirkungen und Funktionen. Eine Vereinheitlichung würde Paulus stärker auslegen, als der Wortlaut erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die folgende Einsetzungsliste übersichtlich. Die fachsprachlich vertrauten Wörter „Apostel“, „Propheten“ und „Zungenrede“ bleiben erhalten; seltenere griechische Pluralformen werden möglichst sichtbar gemacht, ohne die Verständlichkeit unnötig zu beeinträchtigen.
