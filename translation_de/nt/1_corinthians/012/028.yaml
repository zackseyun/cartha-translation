  naturalness: Der Satzbau und das Register sind gut. „Wunder“ und „Gaben zu Heilungen“ sind im heutigen Standarddeutsch klarer. „Verschiedene Arten von Zungenrede“ kann als etablierte kontextuelle Terminologie stehen bleiben; die Fußnote muss jedoch präzise von der Bedeutung von γλῶσσαι sprechen, nicht pauschal von einem einzelnen griechischen Wort ohne Bezug zur Formulierung.
  terminology: „Gemeinde“, „Apostel“, „Propheten“, „Lehrer“, „Hilfeleistungen“ und „Leitungsdienste“ passen zum paulinischen Kontext. „Zungenrede“ wahrt die in 1 Kor 12–14 relevante Ambiguität gegenüber „Sprachen“, ohne die Erscheinung konfessionell festzulegen.
