  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: de
  text: Nun aber sind es viele Glieder, doch ein Leib.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Nun aber
  rationale: Im Zusammenhang nimmt die Wendung den Gegensatz zum hypothetischen Fall des vorhergehenden Verses auf und bezeichnet die tatsächliche Lage. „Nun aber“ gibt sowohl die Folgerung als auch den milden Kontrast knapp wieder.
- source_word: πολλὰ μέλη
  choice: viele Glieder
  rationale: μέλη bezeichnet im Bild des Körpers dessen einzelne Glieder oder Teile. „Glieder“ bewahrt im Deutschen die anatomische Bildsprache und zugleich ihre übertragene Bedeutung für die zur Gemeinschaft Gehörenden.
- source_word: μὲν … δὲ
  choice: viele … doch ein
  rationale: Das Partikelpaar stellt die Vielheit der Glieder der Einheit des Leibes gegenüber. „Doch“ drückt diesen ausgleichenden Gegensatz natürlich aus, ohne die griechische Konstruktion schematisch nachzubilden.
- source_word: ἓν … σῶμα
  choice: ein Leib
  rationale: „Ein“ erhält die betonte Einheit gegenüber der Vielheit; „Leib“ bewahrt das durchgehende Körperbild und dessen theologische Aussagekraft.
theological_decisions:
- issue: Wiedergabe von μέλη im Bild vom Leib
  choice: Glieder
  alternative: Körperteile
  rationale: „Glieder“ ist im Deutschen sowohl anatomisch als auch auf die Angehörigen einer Gemeinschaft bezogen verständlich und bewahrt dadurch die beabsichtigte Doppelwirkung des Bildes. „Körperteile“ wäre alltagssprachlicher, würde aber die übertragene Ebene weniger unmittelbar anklingen lassen.
- issue: Wiedergabe von σῶμα
  choice: Leib
  alternative: Körper
  rationale: „Leib“ hält die traditionelle und im Kontext gut verständliche Bildsprache zusammen, ohne die Einheit konfessionell näher zu bestimmen. „Körper“ wäre ebenfalls lexikalisch möglich, klingt hier jedoch stärker rein anatomisch.
translation_notes:
  register: Knapper, würdiger Standardsatz in modernem Deutsch. Die ausgewogene Gegenüberstellung „viele Glieder, doch ein Leib“ folgt der rhetorischen Form des Griechischen; auf ein ergänztes „nur“ wird verzichtet, da es im Ausgangstext nicht ausdrücklich steht.
