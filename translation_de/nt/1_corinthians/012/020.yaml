  source_fidelity: Die Übersetzung gibt die argumentative Wendung νῦν δέ („Nun aber“) sowie die Gegenüberstellung πολλὰ μὲν μέλη, ἓν δὲ σῶμα sachgerecht wieder. Das im Griechischen elliptische Prädikat wird durch „sind es“ idiomatisch ergänzt, ohne zusätzliche Aussage einzutragen. „Doch“ bildet die durch μέν … δέ markierte Kontrastierung angemessen ab.
  naturalness: „Nun aber sind es viele Glieder, doch ein Leib“ ist ein knapper, gut verständlicher Satz in modernem Standarddeutsch. „Glieder“ und „Leib“ sind im paulinischen Bildfeld weiterhin geläufig; die Formulierung wahrt zugleich einen würdigen, nicht unnötig archaischen Registerton.
  terminology: „Glieder“ gibt μέλη sowohl anatomisch als auch in seiner metaphorischen Anschlussfähigkeit treffend wieder. „Leib“ für σῶμα erhält das im Kontext fortlaufende Bild und ist theologisch neutral; es wird keine über den Text hinausgehende konfessionelle Deutung festgelegt.
