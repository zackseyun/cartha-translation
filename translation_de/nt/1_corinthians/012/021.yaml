id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: de
  text: 'Aber das Auge kann nicht zur Hand sagen: »Ich brauche dich nicht«, und ebenso wenig der Kopf zu den Füßen: »Ich brauche euch nicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: kann nicht
  rationale: Gibt Negation und Fähigkeit natürlich wieder und bewahrt den Sinn der Unmöglichkeit, nicht nur den einer Unangemessenheit.
- source_word: δὲ
  choice: Aber
  rationale: Markiert den Gegensatz zur vorausgehenden Erörterung der gegenseitigen Abhängigkeit der Körperteile.
- source_word: ὁ ὀφθαλμός
  choice: das Auge
  rationale: Bewahrt das für Paulus’ Argument wesentliche Körperbild wörtlich.
- source_word: εἰπεῖν τῇ χειρί
  choice: zur Hand sagen
  rationale: Natürliche deutsche Wiedergabe des Infinitivs und des Dativs als Adressat.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Ich brauche dich nicht
  rationale: Idiomatiche, genaue Wiedergabe von χρείαν … οὐκ ἔχω; im Deutschen wirkt „Ich habe dich nicht nötig“ leicht schärfer und abwertender.
- source_word: ἢ πάλιν
  choice: und ebenso wenig
  rationale: Leitet im Deutschen flüssig das zweite, gleichartige Beispiel unter der fortwirkenden Verneinung „kann nicht“ ein.
- source_word: ἡ κεφαλὴ τοῖς ποσίν
  choice: der Kopf zu den Füßen
  rationale: Bewahrt die Körpermetapher und gibt den Dativ als Adressat wieder.
- source_word: Χρείαν ὑμῶν οὐκ ἔχω
  choice: Ich brauche euch nicht
  rationale: Das deutsche „euch“ macht die im Griechischen ausdrücklich plurale Anrede der Füße ohne Fußnote sichtbar.
theological_decisions:
- issue: Körpermetapher für die gegenseitige Abhängigkeit in der Gemeinde
  choice: Die einzelnen Körperteile werden ohne erklärende Erweiterung wörtlich wiedergegeben.
  alternative: Die Körperteile im Haupttext ausdrücklich als Gemeindeglieder deuten.
  rationale: Paulus entfaltet seinen theologischen Gedanken durch die Metapher selbst; eine ausdrückliche Deutung wäre Kommentar statt Übersetzung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Unterscheidung zwischen singularischem „dich“ und pluralischem „euch“ entspricht dem griechischen Text und macht die englische Fußnote im Deutschen überflüssig.
