review_pass:
  verdict: approve
  source_fidelity: Der Text gibt den griechischen Satzbau und die Körpermetapher zuverlässig wieder. „kann nicht“ trifft οὐ δύναται als Unmöglichkeit; „zur Hand/zu den Füßen sagen“ gibt die Dative angemessen wieder. Die Anrede wechselt korrekt von Singular („dich“, σου) zu Plural („euch“, ὑμῶν). „Und ebenso wenig“ stellt den zweiten parallelen Fall idiomatisch dar und wahrt die unter „kann nicht“ fortwirkende Verneinung von ἢ πάλιν.
  naturalness: Modernes, flüssiges Standarddeutsch mit einem dem Kontext angemessenen sachlich-würdigen Register. Die elliptische Wiederaufnahme bei „und ebenso wenig der Kopf“ ist klar und natürlich.
  terminology: „Auge“, „Hand“, „Kopf“ und „Füße“ erhalten die wörtliche Bildsprache. „Ich brauche dich/euch nicht“ ist eine natürliche und semantisch angemessene Wiedergabe von Χρείαν ... οὐκ ἔχω, ohne den schärferen Beiklang von „habe nicht nötig“.
