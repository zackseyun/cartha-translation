  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: de
  text: Doch unsere ansehnlichen Körperteile brauchen das nicht. Vielmehr hat Gott den Körper zu einer Einheit zusammengefügt[a] und dem Teil, dem es an Ehre fehlte, größere Ehre gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat den Körper zu einem Ganzen vermischt“. Das griechische Verb kann das Verbinden oder Vermischen zu einem einheitlichen Ganzen betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: ansehnlichen Körperteile
  rationale: Das Adjektiv bezeichnet im Gegensatz zu den vorher genannten weniger ansehnlichen Teilen diejenigen, die nach außen als schicklich oder vorzeigbar gelten. „Körperteile“ wird aus dem Zusammenhang ergänzt.
- source_word: χρείαν ἔχει
  choice: brauchen das nicht
  rationale: Gibt die geläufige Wendung natürlich wieder; „das“ verweist auf die besondere ehrende Behandlung aus dem unmittelbaren Zusammenhang.
- source_word: συνεκέρασεν
  choice: zu einer Einheit zusammengefügt
  rationale: Bewahrt den Gedanken des Zusammenmischens beziehungsweise Verbindens zu einem Ganzen und vermeidet eine rein mechanische Vorstellung.
- source_word: σῶμα
  choice: den Körper
  rationale: Erhält Paulus’ leitendes Körperbild ohne zusätzliche Ausdeutung.
- source_word: τῷ ὑστεροῦντι
  choice: dem Teil, dem es an Ansehen fehlte
  rationale: Das Partizip bezeichnet ein Fehlen oder Zurückstehen. Im Kontext fehlt dem betreffenden Teil nicht eigener Wert, sondern gesellschaftlich wahrgenommenes Ansehen beziehungsweise Ehre.
- source_word: περισσοτέραν τιμήν
  choice: größere Ehre
  rationale: Gibt die komparative Aussage klar und idiomatisch wieder.
- source_word: δοὺς
  choice: gegeben
  rationale: Das Partizip erläutert, wie Gott den Körper zusammengefügt hat; die deutsche Koordination ist natürlich und wahrt den instrumentalen Zusammenhang.
theological_decisions:
- issue: Bedeutung von Gottes Handeln am Körper
  choice: Gott fügt den Körper bewusst zu einer Einheit zusammen und gibt dem zuvor weniger angesehenen Teil größere Ehre.
  alternative: Die Aussage beschreibt lediglich das physische Vermischen beziehungsweise Anordnen menschlicher Körperteile.
  rationale: Der unmittelbare Zusammenhang verbindet die natürliche Körperanschauung mit Paulus’ Bild von der Gemeinde als Leib. Die Übersetzung bewahrt dieses Ineinandergreifen, ohne die Aussage ausschließlich auf Anatomie oder ausschließlich auf die Gemeinde festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ansehnlich“ hält den Bezug auf äußere Schicklichkeit fest; „Ansehen“ schafft im zweiten Satz einen natürlichen Übergang zu „Ehre“. Der Fußnotenmarker steht unmittelbar bei der betreffenden Verbform.
