id: 1CO.12.6
reference: 1 Corinthians 12:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: de
  text: Und es gibt verschiedene Wirkungen, aber es ist derselbe Gott, der alles in allen wirkt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „in allen“. Das Griechische nennt kein Bezugswort ausdrücklich; im Zusammenhang sind wahrscheinlich alle Gemeindeglieder gemeint, in denen Gott diese Wirkungen hervorbringt.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: verschiedene
  rationale: Das Adjektiv gibt im Deutschen natürlich wieder, dass es unterschiedliche Ausprägungen gibt, ohne Trennung oder Streit anzudeuten.
- source_word: ἐνεργημάτων
  choice: Wirkungen
  rationale: „Wirkungen“ bezeichnet Äußerungen oder Ergebnisse wirksamer Tätigkeit und bewahrt zusammen mit „wirkt“ die Wortverbindung zu ἐνεργῶν.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: aber es ist derselbe Gott
  rationale: „Aber“ gibt den milden Gegensatz zwischen der Vielfalt der Wirkungen und der Einheit ihres göttlichen Ursprungs wieder. Das ergänzte „es ist“ macht den im Griechischen verblosen Satz im Deutschen vollständig und natürlich.
- source_word: ὁ ἐνεργῶν
  choice: der … wirkt
  rationale: Der Relativsatz ist idiomatisches Deutsch und erhält die aktive, fortdauernde Bedeutung sowie den sprachlichen Bezug zu „Wirkungen“.
- source_word: τὰ πάντα
  choice: alles
  rationale: „Alles“ wahrt die umfassende Formulierung des Griechischen, ohne sie ausdrücklich auf die unmittelbar zuvor genannten Gaben zu verengen.
- source_word: ἐν πᾶσιν
  choice: in allen
  rationale: Die Wiedergabe lässt wie der griechische Text das Bezugswort unausgesprochen und bewahrt dadurch dessen formale Offenheit; im Zusammenhang sind wahrscheinlich alle Glieder der Gemeinde gemeint.
theological_decisions:
- issue: Reichweite von Gottes Wirken in τὰ πάντα ἐν πᾶσιν
  choice: „der alles in allen wirkt“
  alternative: „der all dies in allen Menschen wirkt“
  rationale: Die breite Aussage von τὰ πάντα bleibt erhalten, während der Zusammenhang mit den geistlichen Gaben nicht durch eine erklärende Einengung in den Haupttext festgeschrieben wird. „In allen“ bewahrt zugleich die im Griechischen vorhandene Auslassung des Bezugsworts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortfolge „Wirkungen … wirkt“ bildet die griechische Verbindung zwischen ἐνεργημάτων und ἐνεργῶν sichtbar nach. Die Formulierung „in allen“ wahrt die Mehrdeutigkeit des Ausgangstextes.
