reference: 1 Corinthians 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: de
  text: Denn wie der Körper einer ist und viele Glieder hat, alle Glieder des Körpers aber, obwohl sie viele sind, ein Körper sind, so ist auch der Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „so auch der Messias“. Im Griechischen fehlt in diesem Schlusssatz ein ausgedrücktes Verb. Paulus verwendet eine stark verdichtete Formulierung, die in den folgenden Versen anhand der vielen Glieder des einen Körpers entfaltet wird.'
    reason: Die Fußnote dokumentiert die elliptische griechische Ausdrucksweise, ohne „Messias“ als „Gemeinde“ oder „Leib des Messias“ auszudeuten.
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Denn wie
  rationale: Bewahrt sowohl die begründende Verknüpfung durch γάρ als auch den Vergleich durch καθάπερ in natürlichem Deutsch.
- source_word: τὸ σῶμα
  choice: der Körper
  rationale: „Körper“ macht das Bild eines menschlichen Organismus im modernen Deutsch unmittelbar verständlich und vermeidet eine vorschnelle Deutung als Gemeinde.
- source_word: ἕν
  choice: einer / ein
  rationale: Gibt die zahlenmäßige Einheit wieder; die Form wird dem jeweiligen deutschen Genus und Satzbau angepasst.
- source_word: μέλη
  choice: Glieder
  rationale: „Glieder“ ist im Körperbild natürlich, bewahrt zugleich aber die im Kontext bedeutsame übertragene Verwendung.
- source_word: πάντα δὲ τὰ μέλη τοῦ σώματος
  choice: alle Glieder des Körpers aber
  rationale: Das nachgestellte „aber“ gibt die leicht kontrastierende beziehungsweise weiterführende Funktion von δέ wieder.
- source_word: πολλὰ ὄντα
  choice: obwohl sie viele sind
  rationale: Drückt den im Zusammenhang naheliegenden konzessiven Sinn des Partizips klar aus.
- source_word: ἕν ἐστιν σῶμα
  choice: ein Körper sind
  rationale: Bewahrt die Aussage, dass die vielen Glieder zusammen eine Einheit bilden, in idiomatischer deutscher Kongruenz.
- source_word: οὕτως καὶ ὁ Χριστός
  choice: so ist es auch mit dem Messias
  rationale: Gibt die Vergleichsfolgerung natürlich wieder, erhält „Messias“ als Titel und ergänzt weder „Leib“ noch „Gemeinde“.
theological_decisions:
- issue: Wiedergabe von ὁ Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Χριστός trägt hier als artikulierter Titel die Bedeutung „der Gesalbte/Messias“. „Messias“ lässt diesen Titelcharakter im Deutschen deutlich hervortreten.
- issue: Verdichtete Aussage οὕτως καὶ ὁ Χριστός
  choice: so ist es auch mit dem Messias
  alternative: so ist auch der Messias / so ist es auch mit dem Leib des Messias / so ist es auch mit der Gemeinde
  rationale: Die Formulierung bewahrt die auffällige Identifikation, ohne erklärend „Leib“ oder „Gemeinde“ in den Text einzutragen. Das unidiomatische „so ist auch der Messias“ wird dabei vermieden; die theologische Spannung bleibt durch die unveränderte Bezugsgröße „Messias“ erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Körper“ hält zunächst das konkrete Körperbild fest; „Glieder“ wahrt die zentrale Metapher. Der Satz folgt der griechischen Argumentationsbewegung, bleibt aber trotz seiner Länge gut verständlich.
