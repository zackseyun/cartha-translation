id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: de
  text: Denn dem einen wird durch den Geist eine Botschaft der Weisheit[a] gegeben, einem anderen aber eine Botschaft der Erkenntnis[b] gemäß demselben Geist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Wort der Weisheit“ bzw. „eine Äußerung der Weisheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Wort der Erkenntnis“ bzw. „eine Äußerung der Erkenntnis“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „durch denselben Geist“. Im Griechischen steht hier eine andere Präposition als zuvor bei „durch den Geist“; sie kann die Übereinstimmung mit dem einen Geist als gemeinsamer Quelle hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν
  choice: dem einen
  rationale: Die dativische, verteilende Konstruktion bezeichnet den einen innerhalb der Gemeinschaft und wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: διὰ τοῦ πνεύματος
  choice: durch den Geist
  rationale: διά mit Genitiv bezeichnet hier Mittel oder Vermittlung; „durch“ bewahrt diese Nuance und unterscheidet die Wendung von dem späteren κατά.
- source_word: πνεύματος / πνεῦμα
  choice: Geist
  rationale: Der Zusammenhang von 1. Korinther 12 weist auf den Heiligen Geist als den Geber der Gaben. Die Großschreibung entspricht dem deutschen Gebrauch.
- source_word: δίδοται
  choice: wird gegeben
  rationale: Das Präsens Passiv wird natürlich wiedergegeben und lässt erkennen, dass die Gabe verliehen und nicht selbst hervorgebracht wird.
- source_word: λόγος σοφίας
  choice: eine Botschaft der Weisheit
  rationale: λόγος kann hier eine mitgeteilte Aussage oder Botschaft bezeichnen, nicht lediglich ein einzelnes Wort. Die Genitivverbindung bleibt bewusst offen.
- source_word: ἄλλῳ δὲ
  choice: einem anderen aber
  rationale: Die parallele Dativform und der Gegensatz zur ersten Person werden im Deutschen klar bewahrt.
- source_word: λόγος γνώσεως
  choice: eine Botschaft der Erkenntnis
  rationale: Die Wiedergabe von λόγος bleibt parallel zu λόγος σοφίας; γνώσις wird hier mit „Erkenntnis“ übersetzt.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: gemäß demselben Geist
  rationale: κατά mit Akkusativ kann Übereinstimmung oder Maßgabe ausdrücken. „Gemäß“ bewahrt diese Bedeutung und die Abweichung von der zuvor verwendeten Präposition διά.
theological_decisions:
- issue: Bezug von „Geist“
  choice: der Heilige Geist
  alternative: der menschliche Geist
  rationale: Der unmittelbare Zusammenhang behandelt die verschiedenen Gaben, die von dem einen göttlichen Geist zugeteilt werden. Die Übersetzung macht diesen kontextuellen Bezug durch die Großschreibung kenntlich, ohne eine zusätzliche Lehrbestimmung einzufügen.
- issue: Bedeutung von λόγος in den Gabenbezeichnungen
  choice: Botschaft
  alternative: Wort oder Äußerung
  rationale: „Botschaft“ vermittelt für heutige Leser verständlich den Gedanken einer mitgeteilten Aussage. Da λόγος auch traditionell und formnäher mit „Wort“ oder „Äußerung“ wiedergegeben werden kann, bleiben diese Möglichkeiten in den Fußnoten erhalten.
- issue: Verhältnis von κατά zum Geist
  choice: gemäß demselben Geist
  alternative: durch denselben Geist
  rationale: Die gewählte Fassung erhält die mögliche Nuance der Übereinstimmung und unterscheidet κατά von διά. Die instrumentale Deutung bleibt als Übersetzungsalternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verteilende Gegenüberstellung „dem einen … einem anderen“ bleibt erhalten. „Botschaft“ ist allgemein verständlich; die formnäheren und traditionell vertrauten Wiedergaben von λόγος stehen in den Fußnoten. Die etwas markante Formulierung „gemäß demselben Geist“ bewahrt bewusst die Präpositionsvariation des griechischen Textes.
