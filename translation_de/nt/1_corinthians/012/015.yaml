id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: de
  text: 'Wenn der Fuß sagt: »Weil ich keine Hand bin, gehöre ich nicht zum Leib[a]«, gehört er deshalb etwa nicht zum Leib?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher steht im Griechischen: »bin ich nicht vom Leib«; gemeint ist die Zugehörigkeit zum Leib.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Wenn ... sagt
  rationale: ἐάν mit Aorist Konjunktiv formuliert hier einen hypothetischen allgemeinen Fall. Das deutsche Präsens nach »wenn« gibt diesen Sinn natürlich wieder.
- source_word: ὁ πούς
  choice: der Fuß
  rationale: Das konkrete Körperbild wird beibehalten, da der Gegensatz zwischen Fuß und Hand für Paulus’ Vergleich wesentlich ist.
- source_word: Ὅτι
  choice: Weil
  rationale: ὅτι gibt hier innerhalb der direkten Rede den Grund für die Behauptung des Fußes an.
- source_word: χείρ
  choice: eine Hand
  rationale: Die wörtliche Bezeichnung bewahrt den anschaulichen Gegensatz zum Fuß.
- source_word: ἐκ τοῦ σώματος
  choice: zum Leib gehören
  rationale: Die griechische Wendung bezeichnet in diesem Zusammenhang die Zugehörigkeit zum Leib. »Zum Leib gehören« ist im Deutschen klar und idiomatisch; die Wiederholung in beiden Satzhälften bleibt erhalten.
- source_word: οὐ παρὰ τοῦτο
  choice: deshalb etwa nicht
  rationale: »Deshalb« gibt den bestrittenen Grund wieder; »etwa« kennzeichnet die rhetorische Frage, deren erwartete Antwort Nein lautet.
theological_decisions:
- issue: Grad der sprachlichen Glättung bei der Leib-Metapher
  choice: Die Zugehörigkeit wird idiomatisch mit »zum Leib gehören« ausgedrückt, während Wiederholung und rhetorische Frage erhalten bleiben.
  alternative: Die griechische Form enger als »vom Leib sein« und mit doppelter Verneinung wiederzugeben.
  rationale: 'Eine formnahe Wiedergabe wäre im heutigen Deutsch missverständlich und schwerfällig. Die gewählte Fassung bewahrt Paulus’ Argument: Die Selbsteinschätzung eines Gliedes hebt seine tatsächliche Zugehörigkeit nicht auf.'
- issue: Wiedergabe von σῶμα
  choice: Leib
  alternative: Körper
  rationale: »Leib« ist in diesem ausgeführten Bild eines aus vielen Gliedern bestehenden Ganzen natürlich und bewahrt zugleich den im Kontext entstehenden gemeinschaftlichen Bezug, ohne ihn ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede, das konkrete Bild und die rhetorische Frage bleiben erhalten; die griechische doppelte Verneinung wird zugunsten einer natürlichen deutschen Frage idiomatisch wiedergegeben.
