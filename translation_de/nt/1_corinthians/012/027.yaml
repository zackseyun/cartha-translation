  source_fidelity: Die Übersetzung gibt Ὑμεῖς δέ mit „Ihr aber“ angemessen wieder, bewahrt σῶμα Χριστοῦ als „der Leib des Messias“ und trifft den im Kontext distributiven Sinn von καὶ μέλη ἐκ μέρους mit „und als Einzelne Glieder dieses Leibes“. Die Ergänzung „dieses Leibes“ macht einen aus dem unmittelbaren Bild erschließbaren Bezug explizit, ohne die Aussage zu verändern.
  naturalness: „Ihr aber seid der Leib des Messias und als Einzelne Glieder dieses Leibes“ ist verständliches, modernes Standarddeutsch mit würdigem biblischem Register. „Leib“ und „Glieder“ erhalten das Körperbild und seine gemeinschaftliche Dimension.
  terminology: „Messias“ entspricht der vorgegebenen titelhaften Wiedergabe von Χριστός; die traditionelle Alternative „Christus“ ist sachgerecht in Fußnote a vermerkt. „Glieder“ ist für μέλη im paulinischen Leibbild die naheliegende deutsche Entsprechung. Die Fußnotenanker stehen an den passenden Bezugsstellen.
