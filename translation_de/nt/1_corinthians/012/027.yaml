reference: 1 Corinthians 12:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: de
  text: Ihr aber seid der Leib des Messias[a] und als Einzelne Glieder dieses Leibes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Leib des Christus“. Der griechische Titel Χριστός kann mit „Messias“ oder „Christus“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher etwa: „und Glieder, jedes zu seinem Teil“. Gemeint ist, dass jeder Einzelne als Glied zu dem einen Leib gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen bezeichnet die Gemeinde als Mehrzahl und erhält durch die Anfangsstellung ein angemessenes Gewicht.
- source_word: δέ
  choice: aber
  rationale: Die Partikel leitet die Anwendung des zuvor entfalteten Leibbildes auf die Angesprochenen über. „Aber“ bewahrt den leichten Kontrast, ohne einen starken Gegensatz zu erzwingen.
- source_word: σῶμα Χριστοῦ
  choice: der Leib des Messias
  rationale: Im Zusammenhang bezeichnet die artikellose Prädikatsverbindung eindeutig den einen Leib, mit dem Paulus die Gemeinde identifiziert. „Leib“ wahrt das durchgehende Körperbild.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός trägt hier weiterhin den Sinn des messianischen Titels; „Messias“ macht diesen Gehalt im Deutschen sichtbar. Die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
- source_word: μέλη
  choice: Glieder
  rationale: „Glieder“ bezeichnet im Deutschen sowohl Körperteile als auch Angehörige einer Gemeinschaft und erhält dadurch die doppelte Wirkung des griechischen Bildes.
- source_word: ἐκ μέρους
  choice: als Einzelne
  rationale: 'Die Wendung ist hier distributiv zu verstehen: Gemeinsam sind die Angesprochenen der Leib, jeweils einzeln sind sie Glieder innerhalb dieses Ganzen. „Als Einzelne“ vermeidet das missverständliche „zum Teil“.'
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Aussage über die Gemeinde
  choice: Messias
  alternative: Christus
  rationale: Die Übersetzung als Titel bewahrt den Bedeutungsgehalt von Χριστός, ohne die Aussage über die Gemeinde als seinen Leib konfessionell weiter auszudeuten.
- issue: Bezug und Sinn von ἐκ μέρους
  choice: 'distributiv: „als Einzelne Glieder dieses Leibes“'
  alternative: „Glieder, jedes zu seinem Teil“ oder wörtlicher „Glieder aus einem Teil“
  rationale: Der unmittelbare Zusammenhang stellt den einen Leib und seine vielen Glieder gegenüber. Die gewählte Formulierung macht den distributiven Sinn verständlich; die Fußnote bewahrt die ungewöhnlichere Form des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib“ und „Glieder“ bewahren das Körperbild und zugleich dessen gemeinschaftliche Bedeutung. Die Ergänzung „dieses Leibes“ macht den im Griechischen aus dem Zusammenhang erschlossenen Bezug natürlich verständlich.
