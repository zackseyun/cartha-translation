base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: de
  text: Ihr wisst, dass ihr, als ihr noch Heiden wart, zu den stummen Götzen fortgerissen wurdet, wie auch immer ihr geführt wurdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ihr jeweils geführt wurdet“. Das Griechische betont mit der passiven Form, dass sie unter früherem Einfluss fortgeführt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: Ihr wisst
  rationale: Gibt den direkten Rückgriff auf das gemeinsame Wissen der Adressaten natürlich und prägnant wieder.
- source_word: ἔθνη
  choice: Heiden
  rationale: Im Kontext bezeichnet der Ausdruck den früheren nichtjüdischen und vom Götzendienst geprägten Zustand der korinthischen Christen; „Völker“ wäre im Deutschen missverständlich, „Nichtjuden“ ließe den religiösen Kontext weniger deutlich hervortreten.
- source_word: πρὸς τὰ εἴδωλα τὰ ἄφωνα
  choice: zu den stummen Götzen
  rationale: Bewahrt sowohl die Bewegungsrichtung von πρός als auch den rhetorischen Gegensatz zwischen den sprachlosen Götzen und den geistgewirkten Äußerungen im Zusammenhang.
- source_word: ἀπαγόμενοι
  choice: fortgerissen
  rationale: Bringt die verstärkende Vorstellung des Weggeführtwerdens und die passive Macht des früheren Einflusses idiomatisch zum Ausdruck, ohne einen ausdrücklich genannten Akteur einzuführen.
- source_word: ὡς ἂν ἤγεσθε
  choice: wie auch immer ihr euch führen ließt
  rationale: Gibt die unbestimmte modale Bedeutung von ὡς ἂν wieder. Die reflexive deutsche Form klingt natürlich, während die Fußnote auf die streng passive Wiedergabe hinweist.
theological_decisions:
- issue: Bedeutung von ἔθνη für das frühere Leben der Korinther
  choice: Heiden
  alternative: Nichtjuden; Angehörige der Völker
  rationale: „Heiden“ erhält hier die ethnisch-religiöse Spannung des paulinischen Sprachgebrauchs und passt zum ausdrücklich genannten Götzendienst, ohne eine weitergehende Lehrdeutung einzutragen.
- issue: Gegensatz zwischen den stummen Götzen und geistgewirktem Reden
  choice: stumme Götzen
  alternative: Götzen, die nicht sprechen können
  rationale: Die knappe Formulierung bewahrt den im Kontext wichtigen rhetorischen Gegensatz, ohne ihn erklärend auszuweiten.
- issue: Passivität unter dem früheren Einfluss
  choice: wurdet ... fortgerissen, wie auch immer ihr euch führen ließt
  alternative: wurdet ... fortgeführt, wie ihr jeweils geführt wurdet
  rationale: Die Übersetzung erhält das doppelte Motiv des Geführt- beziehungsweise Fortgeführtwerdens, vermeidet aber im Haupttext eine schwerfällige Wiederholung; die formnähere Möglichkeit wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet den erinnernden Einsatz von οἴδατε ὅτι natürlich ab. „Noch“ verdeutlicht idiomatisch den vergangenen Zustand, ohne eine zusätzliche Aussage einzuführen.
