review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von οἴδατε, ἔθνη, τὰ εἴδωλα τὰ ἄφωνα und der Bewegungsrichtung zu den Götzen ist grundsätzlich treffend. Die Formulierung „wie auch immer ihr euch führen ließt“ gibt jedoch die Passivität von ἤγεσθε nicht wieder und ist zudem in dieser Form orthografisch/grammatisch nicht passend. Das Reflexivum legt ein Sich-führen-Lassen nahe, das im griechischen Passiv nicht steht.
  naturalness: „Ihr wisst, dass …“ ist modernes, natürliches Standarddeutsch. Die revidierte Wiederholung von „geführt“ ist zwar bewusst formnah, aber verständlich und erhält die im Griechischen vorhandene Doppelung von ἤγεσθε und ἀπαγόμενοι.
  terminology: „Heiden“ ist hier als ethnisch-religiöse Bezeichnung kontextgerecht; „stumme Götzen“ bewahrt die Aussage von ἄφωνα. „Fortgerissen“ gibt die verstärkende wegführende Bewegung von ἀπαγόμενοι angemessen wieder, ohne einen Akteur festzulegen.
  issues:
  - severity: high
    issue: „ihr euch führen ließt“ verfälscht die passive Konstruktion von ἤγεσθε.
    rationale: ἤγεσθε ist Imperfekt Passiv („ihr wurdet geführt“), nicht eine reflexive oder voluntative Wendung wie „ihr ließet euch führen“. Die deutsche Form verschiebt daher die Aussage von erlittener Führung zu einem möglichen Einverständnis der Betroffenen.
  - severity: medium
    issue: Die Fußnote beschreibt zwar die passive Lesart, kann aber die Abweichung des Haupttexts nicht ausreichend ausgleichen.
    rationale: Eine Fußnote darf eine lexikalische Alternative erläutern, soll aber keine grammatische Kernbedeutung korrigieren, die der Haupttext verfehlt.
  revised_text: Ihr wisst, dass ihr, als ihr noch Heiden wart, zu den stummen Götzen fortgerissen wurdet, wie auch immer ihr geführt wurdet.[a]
