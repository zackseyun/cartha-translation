  source_fidelity: Die Wiedergabe trifft den Sinn des griechischen Satzes zuverlässig. »Was … betrifft« gibt περί idiomatisch wieder, ohne δέ künstlich als zeitliches »nun« zu übersetzen. »Gaben des Geistes« ist zwar gegenüber τῶν πνευματικῶν kontextuell konkretisierend, doch die Fußnote legt offen, dass »Gaben« nicht ausdrücklich im griechischen Wortlaut steht, und bewahrt die weitere Lesart.
  naturalness: Der Satz ist modernes, flüssiges Standarddeutsch. Die Stellung der Anrede »Brüder« und die Wendung »will ich nicht, dass ihr darüber im Unklaren seid« sind natürlich und dem sachlich-würdigen Register angemessen.
  terminology: »Gaben des Geistes« ist im Kontext von 1 Korinther 12 klar und etablert, ohne eine konfessionelle Deutung aufzuzwingen. Die Fußnote behandelt die substantivierte Mehrdeutigkeit von πνευματικῶν angemessen. »Brüder« wahrt die maskuline griechische Anredeform; die ergänzende Anmerkung zur wahrscheinlich gemeindlichen Reichweite ist sachgerecht.
