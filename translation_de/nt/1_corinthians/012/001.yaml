id: 1CO.12.1
reference: 1 Corinthians 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: de
  text: Was die Gaben des Geistes[a] betrifft, Brüder[b], will ich nicht, dass ihr darüber im Unklaren seid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und weiter gefasst: »die geistlichen Dinge« oder »das, was vom Geist kommt«; das griechische Wort nennt die Gaben nicht ausdrücklich. Im folgenden Zusammenhang stehen jedoch die vom Geist gegebenen Gaben und Wirkungen im Mittelpunkt.'
    reason: alternative_reading
  - marker: b
    text: Mit »Brüder« spricht Paulus hier wahrscheinlich die ganze Gemeinde an, also auch die Frauen.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Was … betrifft
  rationale: Die Wendung leitet ein neues Thema ein. Die deutsche Konstruktion gibt περί natürlich wieder; die leichte Übergangsfunktion von δέ ergibt sich aus dem Themenwechsel, ohne ein zeitliches »nun« einzuführen.
- source_word: τῶν πνευματικῶν
  choice: die Gaben des Geistes
  rationale: Das substantivierte Adjektiv ist im Griechischen weiter und mehrdeutig. Der folgende Zusammenhang handelt jedoch vor allem von Wirkungen und Gaben, die der Geist zuteilt. Die kontextuell klare Wiedergabe steht im Haupttext; die weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die maskuline Anredeform wird formal genau wiedergegeben. Dass Paulus damit wahrscheinlich die gesamte Gemeinde einschließlich der Frauen anspricht, wird in einer Fußnote erläutert.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: will ich nicht, dass ihr darüber im Unklaren seid
  rationale: Die paulinische Wendung bedeutet, dass die Angesprochenen nicht ohne Kenntnis oder Verständnis bleiben sollen. »Im Unklaren sein« ist gegenwärtiges, natürliches Deutsch und vermeidet den heute abwertenden Klang von »unwissend«.
theological_decisions:
- issue: Bedeutung von τῶν πνευματικῶν
  choice: Im Haupttext als »Gaben des Geistes« wiedergegeben
  alternative: »geistliche Dinge«, möglicherweise auch »geistliche Menschen«
  rationale: Die griechische Form nennt »Gaben« nicht ausdrücklich und bleibt grammatisch offen. Der unmittelbare Kontext von 1 Korinther 12–14, besonders 12,4–11, legt jedoch Gaben und Wirkungen des Geistes nahe. Die echte Mehrdeutigkeit wird deshalb durch die Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Gaben des Geistes« ist im Deutschen klarer als das missverständliche »geistliche Gaben«; »im Unklaren sein« gibt die Aussage natürlich wieder. Die beiden Fußnoten bewahren die lexikalische Weite und erläutern die gemeindliche Anrede.
