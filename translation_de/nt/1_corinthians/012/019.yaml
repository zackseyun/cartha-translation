  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: de
  text: Wenn aber alles ein einziges Körperteil wäre, wo bliebe dann der Körper?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Wenn
  rationale: Leitet die hypothetische Bedingung ein und entspricht im Deutschen natürlich der rhetorischen Argumentation.
- source_word: δὲ
  choice: aber
  rationale: Gibt den milden kontrastierenden Anschluss an den vorherigen Gedankengang wieder, ohne ihn zu überbetonen.
- source_word: ἦν
  choice: wäre
  rationale: Der deutsche Konjunktiv II bringt die hypothetische, der Wirklichkeit widersprechende Vorstellung präzise zum Ausdruck.
- source_word: τὰ πάντα
  choice: alles
  rationale: Bezeichnet im Kontext die Gesamtheit der zuvor genannten Körperteile; das knappe „alles“ bewahrt zugleich die Formulierung des Griechischen.
- source_word: ἓν μέλος
  choice: ein einziges Körperteil
  rationale: „Körperteil“ gibt μέλος in der konkreten Körpermetapher für heutige Leser klar wieder; „ein einziges“ hebt die im Argument entscheidende Einheit gegenüber der notwendigen Vielfalt hervor.
- source_word: ποῦ τὸ σῶμα
  choice: wo bliebe dann der Körper?
  rationale: Die idiomatische rhetorische Frage drückt aus, dass unter dieser Voraussetzung kein Körper vorhanden wäre. „Dann“ macht den Folgezusammenhang natürlich deutlich, ohne zusätzliche theologische Aussage einzuführen.
theological_decisions:
- issue: Reichweite der Körpermetapher
  choice: „der Körper“ ohne ausdrücklichen Zusatz „Christi“ oder „der Gemeinde“
  alternative: „der Leib Christi“ beziehungsweise „die Gemeinde als Leib“
  rationale: Der weitere Zusammenhang handelt von der Gemeinde als Leib Christi, doch dieser Vers selbst sagt lediglich τὸ σῶμα. Die Übersetzung bewahrt die Metapher, ohne ihre Deutung in den Wortlaut einzutragen.
- issue: Wiedergabe von μέλος
  choice: „Körperteil“
  alternative: „Glied“
  rationale: „Körperteil“ ist in modernem Standarddeutsch unmittelbar verständlich und hält die anatomische Metapher deutlich. „Glied“ wäre traditioneller und könnte zugleich an ein Gemeindemitglied denken lassen, wodurch die metaphorische Spannung stärker ausgelegt würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp und rhetorisch; „wo bliebe dann“ klingt natürlich und bewahrt den hypothetischen Nachdruck. Keine Fußnote erforderlich.
