base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: de
  text: Sind etwa alle Apostel? Sind etwa alle Propheten? Sind etwa alle Lehrer? Wirken etwa alle Wunder?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sind etwa alle Kräfte/Machttaten?“ Das griechische Wort bezeichnet hier verkürzt machtvolle, wunderhafte Taten oder deren Ausübung.'
    reason: lexikalische Alternative und Erläuterung der metonymischen Ausdrucksweise
lexical_decisions:
- source_word: μὴ
  choice: etwa ...?
  rationale: Das in Fragen verwendete μή lässt eine verneinende Antwort erwarten. Die deutsche Frage mit „etwa“ gibt diese Erwartung natürlich wieder, ohne die Antwort ausdrücklich vorwegzunehmen.
- source_word: πάντες
  choice: alle
  rationale: „Alle“ bewahrt die vierfache rhetorische Wiederholung und betont, dass nicht jedes Glied des Leibes dieselbe Aufgabe oder Gabe hat.
- source_word: ἀπόστολοι
  choice: Apostel
  rationale: Im paulinischen Zusammenhang bezeichnet das Wort hier die anerkannte Aufgabe beziehungsweise Personengruppe der Apostel, nicht bloß Boten im allgemeinen Sinn.
- source_word: προφῆται
  choice: Propheten
  rationale: Dies ist die geläufige und kontextgemäße Bezeichnung für Menschen, die prophetisch reden.
- source_word: διδάσκαλοι
  choice: Lehrer
  rationale: „Lehrer“ ist die klare, natürliche Bezeichnung für die entsprechende Aufgabe in der Gemeinde.
- source_word: δυνάμεις
  choice: Machttaten vollbringen
  rationale: Das Substantiv bedeutet wörtlich „Kräfte“ und kann mächtige beziehungsweise wunderhafte Taten bezeichnen. Hier steht es verkürzt innerhalb einer Aufzählung von Personen und ausgeübten Gaben; die verbale Fassung macht diesen Sinn im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe von δυνάμεις innerhalb der Aufzählung von Diensten und Gaben
  choice: Vollbringen etwa alle Machttaten?
  alternative: Sind etwa alle mit Wunderkräften begabt? / Wirken etwa alle Wunder?
  rationale: Die Formulierung gibt die metonymische Kürze des Griechischen verständlich wieder, ohne Menschen wörtlich als „Kräfte“ zu bezeichnen. „Machttaten“ hält zugleich offen, dass δυνάμεις nicht nur das moderne Konzept spektakulärer „Wunder“ meint.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die vier kurzen Fragen bewahren den eindringlichen Parallelismus des griechischen Textes; „etwa“ signalisiert jeweils die erwartete Antwort: Nein.'
