  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: de
  text: Und wenn ein Glied leidet, leiden alle Glieder mit; wenn ein Glied geehrt wird[a], freuen sich alle Glieder mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: verherrlicht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: wenn … wenn
  rationale: Die wiederholte Formulierung gibt die beiden beispielhaften Fälle im Deutschen natürlich wieder und bewahrt ihre parallele Struktur.
- source_word: πάσχει
  choice: leidet
  rationale: Das Verb bezeichnet allgemein das Erleiden von Schmerz oder Not, ohne die Art des Leidens näher festzulegen.
- source_word: ἓν μέλος / μέλος
  choice: ein Glied
  rationale: „Glied“ bewahrt das Bild des menschlichen Körpers und bezeichnet zugleich ein einzelnes Element des Ganzen. Im zweiten Satzteil steht im griechischen Haupttext kein Zahlwort, doch „ein Glied“ gibt den unbestimmten Singular im Deutschen angemessen wieder.
- source_word: συμπάσχει
  choice: leiden … mit
  rationale: Das zusammengesetzte Verb drückt ausdrücklich gemeinsames Leiden aus. Die deutsche Verbfügung „mitleiden“ wird in der Satzstellung natürlich als „leiden … mit“ wiedergegeben.
- source_word: πάντα τὰ μέλη
  choice: alle Glieder
  rationale: Die identische Wiedergabe in beiden Satzteilen erhält die rhetorische Wiederholung und das Körperbild.
- source_word: δοξάζεται
  choice: geehrt wird
  rationale: Im Zusammenhang der gegenseitigen Fürsorge innerhalb eines Körpers bezeichnet das Verb hier am ehesten, dass einem Glied Ehre oder Ansehen zuteilwird. Die mögliche wörtlichere Wiedergabe wird in einer Fußnote bewahrt.
- source_word: συγχαίρει
  choice: freuen sich … mit
  rationale: Das Verb bezeichnet Mitfreude beziehungsweise gemeinsame Freude. Die Formulierung ist im modernen Deutschen natürlich und erhält den Gedanken solidarischer Anteilnahme.
theological_decisions:
- issue: Bedeutung von δοξάζεται im Bild vom Leib
  choice: geehrt wird
  alternative: verherrlicht wird
  rationale: Der unmittelbare Zusammenhang handelt von gegenseitiger Anteilnahme und Fürsorge unter den Gliedern. „Geehrt wird“ gibt daher den sozialen Sinn wahrscheinlich am klarsten wieder, ohne die mögliche stärkere Bedeutung des griechischen Verbs auszuschließen; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die zweimalige Wiederholung von „alle Glieder“ folgen der rhetorischen Gestalt des griechischen Textes. Das einleitende καί wird mit „Und“ wiedergegeben.
