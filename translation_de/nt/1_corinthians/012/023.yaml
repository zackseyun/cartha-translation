    issue: Die Wendung „werden mit umso größerem Anstand behandelt“ ersetzt die Prädikation „haben größere Schicklichkeit/Angemessenheit“ durch einen passiven Behandlungsvorgang.
    rationale: Das Passiv und „behandelt“ stehen nicht im griechischen Text. Sie ziehen zudem die Handlung des Bedeckens bzw. Versorgens in den Haupttext hinein, obwohl sie nur als kontextuelle Folgerung verstanden werden kann.
  - severity: medium
    issue: „Unanständigen Teile“ kann im modernen Deutsch eine moralische Bewertung nahelegen.
    rationale: ἀσχήμονα bezeichnet hier wahrscheinlich das gesellschaftlich nicht zur Schau Gestellte, nicht moralisch verwerfliche Körperteile. „Nicht vorzeigbar“ wahrt diesen Sinn genauer.
