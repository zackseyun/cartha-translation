  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: de
  text: Und den Teilen des Körpers, die wir für weniger ehrenhaft halten, erweisen wir größere Ehre; und unsere nicht vorzeigbaren Teile haben ein höheres Maß an Schicklichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere weniger ansehnlichen Teile haben größere Ansehnlichkeit“. Wörtlich: „unsere nicht anständigen Teile haben größere Schicklichkeit“. Die griechischen Begriffe können sich auf das beziehen, was nicht öffentlich gezeigt wird, und auf eine angemessene Erscheinung oder Präsentation.'
    reason: Die Fußnote erläutert die Bedeutungsbreite von ἀσχήμονα und εὐσχημοσύνη, ohne eine konkrete Art der Bedeckung oder Behandlung in den Text einzutragen.
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: die wir … halten
  rationale: Die Wendung gibt eine menschliche Einschätzung wieder, keine objektive Eigenschaft. „Für … halten“ ist im Deutschen natürlich und bewahrt diesen Unterschied.
- source_word: ἀτιμότερα
  choice: weniger ehrenhaft
  rationale: Der Komparativ steht im Gegensatz zu τιμὴν περισσοτέραν. „Weniger ehrenhaft“ bewahrt die Abstufung, ohne unnötig zu verschärfen.
- source_word: τοῦ σώματος
  choice: des Körpers
  rationale: Der Genitiv bezeichnet das Ganze, zu dem die Teile gehören; das konkrete Körperbild bleibt erhalten.
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: erweisen wir umso größere Ehre
  rationale: περιτίθημι bedeutet wörtlich, etwas herum- oder anzulegen, bezeichnet hier aber idiomatisch das Zuteilen von Ehre. „Umso größere“ gibt den verstärkten Vergleich im Deutschen flüssig wieder.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: unsere unanständigen Teile
  rationale: ἀσχήμων bezeichnet hier Körperteile, deren öffentliche Sichtbarkeit als unschicklich gilt. „Unanständig“ wahrt den sozialen Scham- und Anstandsbezug, ohne ausdrücklich moralische Schuld zu behaupten.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: werden mit umso größerem Anstand behandelt
  rationale: Wörtlich heißt es, dass diese Teile größere Wohlanständigkeit oder Schicklichkeit „haben“. Die passive deutsche Form macht den aus dem ersten Satzteil erschließbaren Vorgang des angemessenen Bedeckens verständlich, ohne ihn näher auszumalen.
theological_decisions:
- issue: Konkretes Körperbild und soziale Ehre
  choice: Die konkreten Körperteile und ihre unterschiedliche Behandlung bleiben im Text sichtbar.
  alternative: Direkte Paraphrase auf schwächere oder geringer angesehene Gemeindeglieder.
  rationale: Paulus entwickelt die Aussage zunächst anhand des menschlichen Körpers und überträgt sie im Zusammenhang auf die Gemeinde. Die Übersetzung sollte diese Anwendung nicht vorwegnehmen.
- issue: Bedeutung von ἀσχήμονα und εὐσχημοσύνη
  choice: Wiedergabe als Gegensatz von „unanständig“ und „Anstand“ im Sinn gesellschaftlich angemessener Präsentation.
  alternative: „nicht vorzeigbar“ und „ansehnlicher“ beziehungsweise „größere Schicklichkeit“.
  rationale: Der Gegensatz betrifft hier vor allem Schamgefühl, Bedeckung und angemessenes Auftreten, nicht notwendig moralische Verwerflichkeit oder körperliche Schönheit. Eine Fußnote hält die Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gerade“ und „umso“ bilden den argumentativen Nachdruck natürlich ab. Die konkrete Körpermetaphorik bleibt erhalten; die etwas sensible Wortwahl wird durch eine textnahe Fußnote erläutert.
