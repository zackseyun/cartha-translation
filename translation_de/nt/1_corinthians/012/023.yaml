revisions:
- from: Und gerade den Teilen des Körpers, die wir für weniger ehrenhaft halten, erweisen wir umso größere Ehre; und unsere unanständigen Teile werden mit umso größerem Anstand behandelt.[a]
  to: Und den Teilen des Körpers, die wir für weniger ehrenhaft halten, erweisen wir größere Ehre; und unsere nicht vorzeigbaren Teile haben ein höheres Maß an Schicklichkeit.[a]
  rationale: Die Revision hält die konkrete Körpermetaphorik, die menschliche Einschätzung und den Vergleich von geringerer und größerer Ehre bei. Sie beseitigt zugleich die semantische Verschiebung durch das passive „werden ... behandelt“ und vermeidet die im Deutschen stärker moralisch gefärbte Bezeichnung „unanständig“.
  reviewer_model: gpt-5.6-terra
