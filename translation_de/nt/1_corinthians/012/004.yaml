id: 1CO.12.4
reference: 1 Corinthians 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: de
  text: Es gibt verschiedene Gnadengaben[a], aber es ist derselbe Geist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unterschiedliche Zuteilungen von Gaben“ bzw. „verschiedene Arten von Gaben“. Das griechische Wort betont hier die Vielfalt der Gaben, nicht Spaltungen in der Gemeinde.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: verschiedene
  rationale: Das Substantiv bezeichnet hier Unterschiede bzw. verschiedene Arten innerhalb eines Ganzen. Die attributive Wiedergabe „verschiedene“ klingt im Deutschen natürlich und vermeidet den irreführenden Eindruck von Spaltungen in der Gemeinde.
- source_word: δὲ … δὲ
  choice: aber
  rationale: Das erste δέ hat eine schwache weiterführende Funktion und muss im Deutschen nicht eigens wiedergegeben werden; das zweite markiert den Kontrast zwischen Vielfalt und Einheit und wird mit „aber“ übersetzt.
- source_word: χαρισμάτων
  choice: Gnadengaben
  rationale: χάρισμα bezeichnet eine aus Gnade verliehene Gabe. „Gnadengaben“ ist im Zusammenhang geistgewirkter Befähigungen verständlich und bewahrt den Bezug zu χάρις deutlicher als das allgemeinere „Gaben“.
- source_word: τὸ … αὐτὸ
  choice: derselbe
  rationale: Die Wendung betont die Identität des Geistes trotz der Vielfalt der Gaben. „Derselbe“ gibt dies knapp und idiomatisch wieder.
- source_word: πνεῦμα
  choice: Geist
  rationale: Der unmittelbare Zusammenhang in 1 Korinther 12 meint den göttlichen, Heiligen Geist; die Großschreibung kennzeichnet diesen Bezug, ohne den Vers auszuweiten.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: der Heilige Geist, im Haupttext als „Geist“ wiedergegeben
  alternative: menschlicher Geist oder unpersönliche geistliche Kraft
  rationale: In 1 Korinther 12,3–11 wird der Geist als der handelnde Geber und Verteiler der Gaben beschrieben. Die personale und göttliche Referenz ergibt sich aus dem Kontext; „Geist“ bewahrt zugleich die knappe Form des griechischen Textes.
- issue: Verhältnis von Vielfalt und Einheit
  choice: Unterschiedlichkeit der Gnadengaben bei Identität ihres geistlichen Ursprungs
  alternative: Spaltungen innerhalb der Gemeinde
  rationale: Διαιρέσεις bezeichnet in diesem Zusammenhang die unterschiedlichen Arten bzw. Zuteilungen von Gaben. Der Gegensatz zu „derselbe Geist“ hebt legitime Vielfalt hervor, nicht gemeindliche Parteiungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gnadengaben“ bewahrt den Gnadenbezug des griechischen χαρίσματα und ist im kirchlichen wie allgemein bibelkundlichen Sprachgebrauch verständlich. Die Satzstellung stellt die Vielfalt und die Einheit klar gegenüber.
