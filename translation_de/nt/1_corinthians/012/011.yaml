id: 1CO.12.11
reference: 1 Corinthians 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: de
  text: Dies alles aber bewirkt ein und derselbe Geist[a], der jedem Einzelnen zuteilt[b], wie er will.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der eine und derselbe Geist«; die Formulierung betont den gemeinsamen Ursprung der verschiedenen Gaben.'
    reason: cross_reference
  - marker: b
    text: 'Oder: »verteilt« beziehungsweise »teilt … zu«; gemeint ist die Zuweisung an jeden Einzelnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »wie er entscheidet« beziehungsweise »wie er es möchte«. Das griechische Verb kann Wollen, Entscheiden oder Begehren ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Dies alles aber
  rationale: Die Wendung bewahrt die Betonung der Gesamtheit der zuvor genannten Gaben; »aber« gibt den milden Übergang beziehungsweise Kontrast von der Vielfalt zu ihrem einen Ursprung wieder.
- source_word: ἐνεργεῖ
  choice: bewirkt
  rationale: Das Verb bezeichnet hier wirksames Hervorbringen oder Tätigsein. »Bewirkt« ist im Deutschen natürlich und gibt die aktive Verursachung prägnant wieder.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: ein und derselbe Geist
  rationale: Die Formulierung hebt hervor, dass die verschiedenen Gaben auf genau denselben Geist zurückgehen. Die Großschreibung kennzeichnet im paulinischen Zusammenhang den Heiligen Geist.
- source_word: διαιροῦν
  choice: der … zuteilt
  rationale: Das Partizip erläutert, wie der Geist wirkt. Ein deutscher Relativsatz ist flüssig; »zuteilen« bewahrt den Gedanken einer gezielten Verteilung, ohne eine negative Vorstellung des Teilens nahezulegen.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: jedem Einzelnen
  rationale: Die Verbindung betont die individuelle Zuweisung an jede einzelne Person. »Jedem Einzelnen« gibt beide Elemente knapp und idiomatisch wieder.
- source_word: καθὼς βούλεται
  choice: wie er will
  rationale: Die Wendung bezeichnet den Willen beziehungsweise die Entscheidung des Geistes als Maßstab der Zuteilung und wahrt seine persönliche Handlungsfähigkeit.
theological_decisions:
- issue: Bezug und personale Handlungsfähigkeit von πνεῦμα / βούλεται
  choice: »Geist« bezeichnet den Heiligen Geist; das Pronomen »er« gibt seine im Kontext ausgesagte personale Willensausübung wieder.
  alternative: Unpersönlich oder ohne ausdrückliches Pronomen formulieren, etwa »wie es gewollt ist« oder »nach Belieben«.
  rationale: Obwohl πνεῦμα im Griechischen grammatisch sächlich ist, schreibt βούλεται dem Geist eigenes Wollen zu. Das deutsche Genus von »Geist« ist zudem maskulin. Die Wiedergabe mit »er« folgt daher sowohl dem natürlichen Deutschen als auch der personalen Darstellung im Text, ohne mehr als diese Aussage festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Gedankengang, klingt jedoch natürlich. »Bewirkt« vermittelt die aktive Wirksamkeit des Geistes; der Relativsatz löst das griechische Partizip idiomatisch auf.
