  source_fidelity: Der Text gibt πάντα δὲ ταῦτα mit „Dies alles aber“ zutreffend wieder und bewahrt sowohl die Gesamtheit als auch die mild fortführende bzw. kontrastierende Funktion von δέ. „bewirkt“ entspricht ἐνεργεῖ als aktivem Hervorbringen. „ein und derselbe Geist“ trifft die nachdrückliche Identität in τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα. Der Relativsatz gibt das modale Partizip διαιροῦν idiomatisch wieder; „jedem Einzelnen“ wahrt den distributiven und individuellen Sinn von ἰδίᾳ ἑκάστῳ. „wie er will“ gibt καθὼς βούλεται präzise und ohne zusätzliche dogmatische Festlegung wieder.
