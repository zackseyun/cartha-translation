  terminology: „Geist“ mit Großschreibung ist im paulinischen Kontext angemessen. „bewirkt“ und „zuteilt“ sind sachlich präzise und im Register des Abschnitts passend. Die Fußnoten bieten echte lexikalische Alternativen und ihre Marker sind eindeutig an den relevanten Stellen verankert.
