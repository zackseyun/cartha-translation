  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: de
  text: 'Im Gegenteil: Gerade die Teile des Körpers, die schwächer zu sein scheinen, sind notwendig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind unentbehrlich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: 'Im Gegenteil: Gerade'
  rationale: Die Wendung markiert einen nachdrücklichen Gegensatz. „Im Gegenteil“ gibt die korrigierende Kraft von ἀλλά wieder; „gerade“ macht die Verstärkung πολλῷ μᾶλλον in natürlichem Deutsch ausdrücklich hörbar.
- source_word: τὰ δοκοῦντα
  choice: die ... zu sein scheinen
  rationale: δοκέω bezeichnet hier den Eindruck oder die Wahrnehmung, nicht eine feststehende Eigenschaft.
- source_word: μέλη τοῦ σώματος
  choice: die Teile des Körpers
  rationale: „Teile des Körpers“ bewahrt das konkrete Körperbild und klingt im heutigen Deutsch natürlicher als „Glieder des Körpers“.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: schwächer zu sein
  rationale: Die Formulierung gibt den Komparativ und die von δοκοῦντα abhängige Infinitivkonstruktion klar und idiomatisch wieder.
- source_word: ἀναγκαῖά ἐστιν
  choice: sind notwendig
  rationale: „Notwendig“ entspricht dem Grundsinn eng; „unentbehrlich“ wäre eine mögliche, etwas stärkere Wiedergabe.
theological_decisions:
- issue: Kraft des Körperbildes im Zusammenhang mit der Gemeinde
  choice: Das konkrete Körperbild bleibt im Vers erhalten.
  alternative: „Glieder“ könnte zugleich Körperteile und Gemeindeglieder anklingen lassen.
  rationale: Der Kontext bezieht das Bild auf die Gemeinde, doch der Vers selbst spricht zunächst von Körperteilen. Die Übersetzung erklärt die Metapher nicht über den Wortlaut hinaus.
- issue: Wahrgenommene oder tatsächliche Schwäche
  choice: „die schwächer zu sein scheinen“
  alternative: „die als schwächer gelten“
  rationale: Die Übersetzung lässt offen, ob die betreffenden Teile tatsächlich schwächer sind oder nur so wahrgenommen werden, und bewahrt damit die Spannung des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht den starken Gegensatz gut lesbar; „Gerade“ bildet die ausdrückliche griechische Verstärkung ab, ohne eine schwerfällige wörtliche Formulierung wie „um vieles mehr“ zu verwenden.
