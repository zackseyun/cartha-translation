revisions:
- from: Strebt aber eifrig nach den größeren Gnadengaben.[a] Und ich zeige euch einen Weg, der alles noch weit übertrifft.[b]
  to: Strebt aber eifrig nach den größeren Gnadengaben.[a] Und ich zeige euch einen noch weit besseren Weg.[b]
  rationale: Die Revision entfernt die nicht im Ausgangstext genannte Totalisierung „alles“ und gibt die starke komparative Aussage von καθ’ ὑπερβολὴν mit natürlichem modernem Deutsch wieder. Präsens („ich zeige“), Wegmetapher und die grammatische Mehrdeutigkeit von ζηλοῦτε bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:50:01Z'
review_pass:
  verdict: revise
  source_fidelity: Die imperativische Hauptlesart „Strebt ... nach“ gibt ζηλοῦτε angemessen wieder; die echte Möglichkeit eines Indikativs ist korrekt in Anmerkung a erhalten. „Gnadengaben“ und „größeren“ sind quellentreu. Die Umschreibung „der alles noch weit übertrifft“ macht jedoch ein nicht ausdrücklich genanntes Vergleichsobjekt („alles“) explizit und verschiebt die Konstruktion von der Kennzeichnung des Weges zu einer umfassenden Vergleichsaussage.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Einen noch weit besseren Weg“ ist für καθ’ ὑπερβολὴν idiomatischer und präziser als „einen Weg, der alles noch weit übertrifft“; letzteres klingt zudem absoluter, als der griechische Wortlaut verlangt.
  terminology: „Gnadengaben“ wahrt den Bezug von χαρίσματα zu Gnade und ist in diesem Kontext verständlich. „Weg“ erhält die Metapher von ὁδός. Die Terminologie erfordert keine weiteren Änderungen.
  issues:
  - severity: medium
    issue: Die zweite Satzhälfte fügt mit „alles“ ein absolutes, im Griechischen nicht ausgedrücktes Vergleichsobjekt ein.
    rationale: καθ’ ὑπερβολὴν beschreibt den Weg als in außergewöhnlichem Maß überlegen; der Text sagt nicht ausdrücklich, dass er „alles“ übertrifft. Eine komparative deutsche Formulierung bewahrt die Steigerung ohne diese Erweiterung.
  - severity: low
    issue: Anmerkung b bezeichnet eine semantisch freie deutsche Umschreibung als „wörtlicher“.
    rationale: „Einen noch weit überragenderen Weg“ ist keine wörtlichere Wiedergabe und im Deutschen stilistisch schwerfällig. Die Anmerkung sollte nur eine tragfähige lexikalische Alternative nennen.
  revised_text: Strebt aber eifrig nach den größeren Gnadengaben.[a] Und ich zeige euch einen noch weit besseren Weg.[b]
