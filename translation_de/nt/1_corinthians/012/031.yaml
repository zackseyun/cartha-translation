  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: de
  text: Strebt aber eifrig nach den größeren Gnadengaben.[a] Und ich zeige euch einen noch weit besseren Weg.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr strebt aber eifrig nach den größeren Gnadengaben.“ Die griechische Form ζηλοῦτε kann hier als Aufforderung oder als Feststellung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „einen noch weit vortrefflicheren Weg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: strebt eifrig nach
  rationale: Das Verb bezeichnet ein starkes, engagiertes Verlangen. Die Wiedergabe fasst die Form im Haupttext als Imperativ auf, bewahrt aber die ebenfalls mögliche indikativische Lesart in einer Fußnote.
- source_word: χαρίσματα
  choice: Gnadengaben
  rationale: χάρισμα bezeichnet eine aus Gnade gewährte Gabe. „Gnadengaben“ ist im Deutschen verständlich, wahrt den Bezug zur Gnade und vermeidet den Zusatz „geistlich“, der in diesem Satzglied nicht ausdrücklich steht.
- source_word: μείζονα
  choice: größeren
  rationale: Der Komparativ wird direkt wiedergegeben, ohne vorwegzunehmen, nach welchem Maßstab die Gaben größer oder bedeutender sind.
- source_word: καὶ ἔτι
  choice: Und … noch
  rationale: Die Verbindung führt den folgenden Weg als weiterführende und steigernde Aussage ein.
- source_word: καθ’ ὑπερβολὴν
  choice: der alles … weit übertrifft
  rationale: Die Wendung bezeichnet ein außergewöhnliches, überragendes Maß. Die idiomatische deutsche Formulierung erhält die starke Steigerung, ohne das unnatürliche „mehr überragend“ zu verwenden.
- source_word: ὁδὸν
  choice: einen Weg
  rationale: Die Wegmetapher für eine Lebens- oder Handlungsweise wird im Deutschen unmittelbar bewahrt.
- source_word: δείκνυμι
  choice: ich zeige
  rationale: Der griechische Präsens wird formal und zugleich natürlich wiedergegeben; Paulus beginnt unmittelbar anschließend, diesen Weg darzulegen.
theological_decisions:
- issue: Aussageweise von ζηλοῦτε
  choice: 'Imperativ: „Strebt … nach“'
  alternative: 'Indikativ: „Ihr strebt … nach“'
  rationale: Die Form ζηλοῦτε kann morphologisch sowohl Imperativ als auch Indikativ sein. Der Imperativ passt zum ermahnenden Zusammenhang, doch die alternative Lesart bleibt wegen der echten grammatischen Mehrdeutigkeit in der Fußnote sichtbar.
- issue: Verhältnis der Gnadengaben zum überragenden Weg
  choice: „einen Weg, der alles noch weit übertrifft“
  alternative: „einen noch weit überragenderen Weg“ oder traditionell „einen noch vortrefflicheren Weg“
  rationale: Die Formulierung bewahrt die Steigerung und den Übergang zum Thema Liebe, ohne Liebe vorschnell als weitere Gnadengabe einzuordnen oder die genaue Bezugsgröße dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gnadengaben“ hält den Gnadenbezug des griechischen Wortes fest; die zweite Satzhälfte ist idiomatisch formuliert, bewahrt jedoch Wegmetapher, Präsens und starke Steigerung.
