  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: de
  text: Haben etwa alle Gaben für Heilungen[a]? Reden etwa alle in Sprachen[b]? Legen etwa alle aus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gaben von Heilungen“; im Griechischen stehen sowohl „Gaben“ als auch „Heilungen“ im Plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „in Zungen“. Das griechische Wort kann „Zungen“ oder „Sprachen“ bedeuten und bezeichnet hier die entsprechende Geistesgabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: etwa alle …?
  rationale: Die mit μή eingeleiteten rhetorischen Fragen erwarten jeweils eine verneinende Antwort. Die Formulierung mit „etwa“ gibt diese Erwartung im heutigen Deutschen natürlich wieder und bewahrt den Nachdruck auf der Vielfalt der Gaben.
- source_word: χαρίσματα
  choice: Gaben
  rationale: χάρισμα bezeichnet hier eine aus Gnade verliehene Befähigung. „Gaben“ ist im Zusammenhang von 1. Korinther 12 klar, natürlich und ohne unnötige Ausdeutung.
- source_word: ἰαμάτων
  choice: für Heilungen
  rationale: Der griechische Genitiv Plural bezeichnet Heilungen als Wirkungsbereich der Gaben. „Gaben für Heilungen“ bewahrt den Plural und ist im Deutschen verständlicher als das sehr formale „Gaben der Heilungen“.
- source_word: γλώσσαις λαλοῦσιν
  choice: in Sprachen reden
  rationale: γλῶσσα kann „Zunge“ oder „Sprache“ bedeuten und bezeichnet hier die charismatische Redeform. „In Sprachen reden“ ist modern und wahrt die lexikalische Bedeutung; die traditionelle Bezeichnung wird in einer Fußnote genannt.
- source_word: διερμηνεύουσιν
  choice: legen … aus
  rationale: Im Zusammenhang bezeichnet διερμηνεύω das verständliche Wiedergeben beziehungsweise Deuten der Sprachenrede. „Auslegen“ lässt offen, ob dies als Übersetzung oder als deutende Wiedergabe zu verstehen ist.
theological_decisions:
- issue: Rhetorische Fragen mit μή
  choice: Als Fragen formuliert, die eine verneinende Antwort erwarten
  alternative: Als neutrale Fragen ohne erkennbare Antworterwartung formulieren
  rationale: Die griechische Syntax unterstreicht, dass nicht alle dieselben Gaben besitzen. Die Übersetzung bewahrt damit Paulus’ Aussage über die Vielfalt innerhalb des einen Leibes, ohne über den Text hinauszugehen.
- issue: Verständnis von γλώσσαις und διερμηνεύουσιν
  choice: „in Sprachen reden“ und „auslegen“
  alternative: „in Zungen reden“ und „übersetzen“
  rationale: Die gewählte Fassung hält sowohl den charismatischen Kontext als auch die sprachliche Offenheit der Begriffe fest. Sie entscheidet nicht unnötig, ob die Rede ausschließlich als menschliche Fremdsprache zu verstehen ist oder ob διερμηνεύω technisch eine Übersetzung bezeichnet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die dreifache rhetorische Parallelstruktur des griechischen Textes bleibt erhalten; „etwa“ signalisiert jeweils die erwartete Antwort „Nein“. Die ungewöhnliche Mehrzahl bei den Heilungen wird im Text nicht eingeebnet und in der Fußnote erläutert.
