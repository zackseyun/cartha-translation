source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: de
  text: Denn in einem Geist[a] sind wir alle zu einem Leib getauft worden – ob Juden oder Griechen, ob Sklaven oder Freie – und uns allen wurde ein Geist zu trinken gegeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch einen Geist“. Das griechische ἐν kann hier den Bereich oder das Mittel beziehungsweise die Wirkursache bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher bzw. bildhafter möglich: „wir alle sind mit einem Geist getränkt worden“. Das griechische πνεῦμα kann hier auch weniger spezifisch verstanden werden; im Zusammenhang liegt jedoch ein Bezug auf den Heiligen Geist nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn
  rationale: Das begründende γάρ wird natürlich mit „denn“ wiedergegeben; καί verstärkt hier den Anschluss, ohne dass im Deutschen ein zusätzliches „ja“ zwingend nötig ist.
- source_word: ἐν ἑνὶ πνεύματι
  choice: in einem Geist
  rationale: „In einem Geist“ bewahrt die Form und Offenheit der griechischen Wendung, deren ἐν sowohl den Bereich als auch Mittel oder Wirkursache bezeichnen kann.
- source_word: ἡμεῖς πάντες
  choice: wir alle
  rationale: Die ausdrückliche Verbindung von Pronomen und πάντες hebt die uneingeschränkte Gemeinsamkeit hervor.
- source_word: εἰς ἓν σῶμα
  choice: zu einem Leib
  rationale: „Zu einem Leib“ gibt das Ziel beziehungsweise Ergebnis der Eingliederung idiomatisch wieder und bewahrt Paulus’ Bild vom einen Leib.
- source_word: ἐβαπτίσθημεν
  choice: sind ... getauft worden
  rationale: „Taufen“ ist der etablierte und kontextgerechte Ausdruck; eine Wiedergabe als „untertauchen“ würde hier die Taufweise unnötig in den Vordergrund rücken.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: Juden oder Griechen
  rationale: Die konkrete ethnisch-religiöse Gegenüberstellung wird erhalten; „Griechen“ ist näher am Wortlaut als das weiter gefasste „Nichtjuden“.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: Sklaven oder Freie
  rationale: Im ausdrücklichen Gegensatz zum freien Rechts- und Sozialstatus bezeichnet δοῦλοι versklavte Menschen, nicht allgemein Diener.
- source_word: ἓν πνεῦμα
  choice: einem Geist
  rationale: Der unmittelbare Kontext spricht stark für den Heiligen Geist; die Großschreibung macht diese wahrscheinlichste Referenz sichtbar, ohne den Artikel einzufügen.
- source_word: ἐποτίσθημεν
  choice: sind ... getränkt worden
  rationale: Das Passiv von ποτίζω wird mit einem deutschen Passiv wiedergegeben und bewahrt das Bild des gemeinsamen Trinkens beziehungsweise Getränktwerdens.
theological_decisions:
- issue: Bereich oder Wirkursache bei ἐν ἑνὶ πνεύματι
  choice: in einem Geist
  alternative: durch einen Geist
  rationale: Die griechische Präposition lässt beide Nuancen zu. Der Haupttext bleibt möglichst formnah; die instrumentale Deutung wird in einer Fußnote genannt, statt die theologische Spannung aufzulösen.
- issue: Bezug von ἓν πνεῦμα im zweiten Satzteil
  choice: einem Geist
  alternative: einem geistlichen Trank beziehungsweise einem Geist als getrunkenem Inhalt
  rationale: Die Parallelität und der Kontext weisen auf den Heiligen Geist. Zugleich kann die Bildkonstruktion unterschiedlich verstanden werden; dies wird in der Fußnote transparent gemacht.
- issue: Sozialer Status bei δοῦλοι
  choice: Sklaven
  alternative: Diener
  rationale: Der Gegensatz zu „Freie“ macht rechtliche und soziale Unfreiheit ausdrücklich zum Thema; „Diener“ wäre zu schwach.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leib“ bewahrt das paulinische Gemeindebild besser als „Körper“. Die Gedankenstriche bilden die eingeschobenen Gegensatzpaare klar ab; „getränkt worden“ erhält das griechische Passiv und die Trinkmetapher.
