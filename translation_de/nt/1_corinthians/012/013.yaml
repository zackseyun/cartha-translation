revisions:
- from: Denn wir alle sind in einem Geist[a] zu einem Leib getauft worden – ob Juden oder Griechen, ob Sklaven oder Freie – und wir alle sind mit einem Geist getränkt worden.[b]
  to: Denn in einem Geist[a] sind wir alle zu einem Leib getauft worden – ob Juden oder Griechen, ob Sklaven oder Freie – und uns allen wurde ein Geist zu trinken gegeben.[b]
  rationale: Die Revision ersetzt die potenziell missverständliche Haupttextformulierung „mit einem Geist getränkt worden“ durch eine deutsche passive Konstruktion, welche die in ἐποτίσθημεν enthaltene Handlung des Zu-trinken-Gebens unmittelbar abbildet. Die bisherige bildhafte Form bleibt als Alternative in der Fußnote erhalten. Zugleich wird die kontextuell naheliegende, aber nicht vollständig erzwingbare Referenz von πνεῦμα transparent und zurückhaltend erläutert.
