  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: de
  text: einem anderen Glaube[a] durch denselben Geist, einem anderen Gaben, Heilungen zu bewirken[b], durch den einen Geist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Treue“ oder „Vertrauen“ für „Glaube“ (πίστις).
