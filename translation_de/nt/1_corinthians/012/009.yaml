lexical_decisions:
- source_word: ἑτέρῳ
  choice: einem anderen
  rationale: Der Dativ setzt die Verteilung aus dem vorherigen Vers fort. Die natürliche deutsche Wiedergabe bewahrt den distributiven Sinn, ohne einen fraglichen Bedeutungsunterschied zu ἄλλῳ zu erzwingen.
- source_word: πίστις
  choice: Glaube
  rationale: „Glaube“ ist die übliche und kontextuell passende Wiedergabe. Hier bezeichnet das Wort eine vom Geist gegebene Gabe; mögliche Bedeutungsnuancen werden in der Fußnote bewahrt.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: durch denselben Geist
  rationale: Das instrumentale „durch“ gibt den Geist als wirkende beziehungsweise vermittelnde Instanz idiomatisch wieder; „denselben“ bewahrt αὐτῷ.
- source_word: ἄλλῳ
  choice: einem anderen
  rationale: Der Dativ führt die Reihe der unterschiedlichen Empfänger fort. Eine künstliche Abgrenzung von ἑτέρῳ wäre im Deutschen überinterpretierend.
- source_word: χαρίσματα
  choice: Gaben
  rationale: Die knappe Standardwiedergabe bezeichnet gnädig verliehene Befähigungen und erhält den Plural.
- source_word: ἰαμάτων
  choice: von Heilungen
  rationale: Die ungewöhnlichere Pluralform folgt dem griechischen Plural und bewahrt eine echte Nuance der Formulierung.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: durch den einen Geist
  rationale: „Durch“ gibt ἐν instrumental wieder; „den einen Geist“ erhält die ausdrückliche Einheit in ἑνί und die Variation gegenüber „demselben“.
theological_decisions:
- issue: Bedeutung von πίστις im Zusammenhang der Geistesgaben
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: Der Kontext kennzeichnet den Glauben als Gabe des Geistes, legt aber keine besondere konfessionelle Theorie dieser Gabe fest. Die lexikalischen Alternativen bleiben in einer Fußnote sichtbar.
- issue: Referenz von πνεύματι
  choice: Geist, großgeschrieben als Heiliger Geist
  alternative: Geist, kleingeschrieben
  rationale: Der Zusammenhang von 1. Korinther 12 identifiziert den Geist als den Geber der Gaben. Die Großschreibung macht diesen Referenten sichtbar, ohne zusätzliche Lehraussagen einzuführen.
- issue: Numerus in χαρίσματα ἰαμάτων
  choice: Gaben von Heilungen
  alternative: Gaben der Heilung
  rationale: Beide griechischen Substantive stehen im Plural. Die formal nähere Wiedergabe bewahrt diese auffällige Form, ohne ihre theologische Bedeutung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Satzfortsetzung fragmentarisch und endet mit Komma, entsprechend dem gelieferten Versabschnitt. Die Parallelstruktur und die griechische Variation zwischen „demselben Geist“ und „dem einen Geist“ werden erhalten.
