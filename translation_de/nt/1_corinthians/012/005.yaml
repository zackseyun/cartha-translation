  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: de
  text: Und es gibt verschiedene Dienste[a], und es ist derselbe Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Arten des Dienens“; auch: „Dienstaufgaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und … aber
  rationale: Das erste καί verbindet den Satz mit Vers 4; das zweite stellt innerhalb der parallelen Aussage die Vielfalt der Dienste der Einheit ihres Herrn gegenüber. Im natürlichen Deutschen gibt „aber“ diesen Zusammenhang klar wieder, ohne einen Widerspruch zu behaupten.
- source_word: διαιρέσεις
  choice: verschiedene
  rationale: Im Zusammenhang von Vers 4–6 bezeichnet das Wort Unterschiede beziehungsweise vielfältige Arten, nicht Spaltungen. „Verschiedene“ ist idiomatisch und vermeidet den irreführenden Eindruck von Parteiungen.
- source_word: διακονιῶν
  choice: Dienste
  rationale: Der Plural bezeichnet unterschiedliche Weisen oder Aufgaben des Dienens. „Dienste“ bewahrt die Breite des griechischen Ausdrucks und ist weniger institutionell als „Ämter“.
- source_word: εἰσιν
  choice: es gibt
  rationale: Die Existenzkonstruktion wird im Deutschen natürlich mit „es gibt“ wiedergegeben.
- source_word: ὁ αὐτὸς
  choice: derselbe
  rationale: „Derselbe“ betont entsprechend der parallelen Formulierungen in Vers 4–6 die Einheit des Herrn bei unterschiedlichen Diensten.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ bewahrt den üblichen paulinischen Titel und lässt den im Kontext sehr wahrscheinlichen Bezug auf Jesus Christus bestehen, ohne ihn im Text erläuternd auszuschreiben.
theological_decisions:
- issue: Bezug von „Herr“ in der dreigliedrigen Formulierung von 1. Korinther 12,4–6
  choice: Der Titel „Herr“ bleibt ohne erläuternde Ergänzung stehen; im Kontext bezieht er sich sehr wahrscheinlich auf Jesus Christus.
  alternative: Allgemeiner Bezug auf den Herrn beziehungsweise auf Gott.
  rationale: Die Abfolge „Geist“ (Vers 4), „Herr“ (Vers 5) und „Gott“ (Vers 6) legt einen christologischen Bezug nahe. Die Übersetzung bewahrt dennoch Paulus’ knappe Formulierung und löst die verbleibende referenzielle Offenheit nicht durch einen Zusatz auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzform der Verse 4–6 bleibt erkennbar; „Dienste“ ist allgemeinverständlich und vermeidet eine unnötige Festlegung auf kirchliche Ämter.
