review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt διαιρέσεις διακονιῶν mit „verschiedene Dienste“ treffend wieder und bewahrt die Aussage von Vielfalt bei bleibender Einheit. „Herr“ ist für κύριος angemessen und lässt den knappen, im Kontext wahrscheinlich christologischen Bezug ohne interpretierende Erweiterung stehen. Allerdings entspricht das adversative „aber“ dem zweiten καί nicht: Der griechische Text reiht die beiden Aussagen mit „und“ parallel an, ohne einen ausdrücklichen Gegensatz zu markieren.'
  naturalness: „Und es gibt verschiedene Dienste, und es ist derselbe Herr“ ist modernes, verständliches Standarddeutsch. Die Wiederholung von „es ist“ macht die im Griechischen elliptische zweite Satzhälfte im Deutschen vollständig und natürlich.
  terminology: „Dienste“ gibt διακονίαι breit und nicht institutionell verengt wieder. „Herr“ ist der etablierte und sachgerechte deutsche Wiedergabe von κύριος. Die Fußnote bietet sinnvolle lexikalische Alternativen, ohne die Hauptübersetzung einzuengen.
  issues:
  - severity: medium
    issue: „aber“ für das zweite καί
    rationale: Der Ausgangstext hat erneut καί („und“), nicht δέ oder ἀλλά. Zwar kann der gedankliche Kontrast zwischen Vielfalt und Einheit im Deutschen wahrnehmbar sein, doch „aber“ verstärkt ihn und verändert die ausdrücklich parallele, additive Struktur von Vers 4–6. Daher sollte „und“ stehen.
  revised_text: Und es gibt verschiedene Dienste[a], und es ist derselbe Herr.
