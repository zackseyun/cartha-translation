  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: de
  text: Wenn der ganze Körper ein Auge wäre, wo wäre dann das Gehör[a]? Wenn er ganz Gehör wäre, wo wäre dann der Geruchssinn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, auf Organe bezogen: »Wo wäre dann das Ohr? … Wo wäre dann die Nase?« Im Griechischen ist wörtlich von den Fähigkeiten des Hörens und Riechens die Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: der ganze Körper
  rationale: Die Wendung gibt die vollständige Ausdehnung des Körpers wieder und bewahrt das hypothetische Bild eines Körpers, der nur aus einem einzigen Körperteil bestünde.
- source_word: ὀφθαλμός
  choice: ein Auge
  rationale: Das prädikative Substantiv wird im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben; der Singular des Körperteilbildes bleibt erhalten.
- source_word: ποῦ
  choice: wo wäre dann ...?
  rationale: ποῦ bedeutet „wo?“. Der Konjunktiv „wäre“ nimmt die hypothetische Bedingung im Deutschen idiomatisch auf; „dann“ verdeutlicht den Folgezusammenhang, ohne den Sinn zu erweitern.
- source_word: ἀκοή
  choice: das Gehör / Gehör
  rationale: Das Wort bezeichnet hier die Fähigkeit des Hörens, nicht ausdrücklich das Ohr. In der ersten Frage steht es mit Artikel; in der zweiten Bedingung wird es entsprechend der artikellosen prädikativen Verwendung ohne Artikel wiedergegeben.
- source_word: ὅλον
  choice: er ganz
  rationale: Das allein stehende ὅλον greift elliptisch den ganzen Körper auf. Das Pronomen „er“ stellt diesen Bezug im Deutschen klar, während „ganz“ die Ellipse knapp bewahrt.
- source_word: ὄσφρησις
  choice: der Geruchssinn
  rationale: Das Substantiv bezeichnet die Fähigkeit zu riechen. „Geruchssinn“ ist im modernen Deutschen klar und entspricht der funktionalen Ausdrucksweise von ἀκοή.
theological_decisions:
- issue: Körpermetapher mit Sinnesfähigkeiten oder Sinnesorganen
  choice: ἀκοή und ὄσφρησις werden als Sinnesfähigkeiten („Gehör“, „Geruchssinn“) übersetzt.
  alternative: 'Eine organbezogene Wiedergabe wäre: „Ohr“ und „Nase“.'
  rationale: Der griechische Text nennt die Fähigkeiten des Hörens und Riechens, nicht die anatomischen Bezeichnungen für Ohr und Nase. Die funktionale Wiedergabe bleibt näher am Wortlaut und konkretisiert das Bild nicht unnötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen rhetorischen Fragen bleiben knapp; der zweite Satz nimmt „der ganze Körper“ durch „er“ auf, um eine im Deutschen unnatürliche substantivierte Ellipse zu vermeiden.
