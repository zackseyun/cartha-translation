id: 1CO.12.7
reference: 1 Corinthians 12:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: de
  text: Jedem aber wird die Offenbarung des Geistes zum gemeinsamen Nutzen gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für das, was nützlich ist«; oder: »zum Nutzen aller«.'
    reason: Die griechische Wendung πρὸς τὸ συμφέρον kann allgemein das Förderliche bezeichnen; der Zusammenhang legt den gemeinsamen Nutzen nahe.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: jedem
  rationale: 'Der Dativ Singular bewahrt die verteilende Aussage: Jedes einzelne Glied empfängt etwas.'
- source_word: δὲ
  choice: aber
  rationale: Das Wort kennzeichnet hier einen leichten Gegensatz beziehungsweise den Übergang von der Vielfalt der Gaben zu ihrer Zuteilung an jeden Einzelnen.
- source_word: δίδοται
  choice: wird … gegeben
  rationale: Die passive Form des griechischen Verbs wird unmittelbar und natürlich wiedergegeben; zugleich bleibt der Geschenkcharakter erhalten.
- source_word: ἡ φανέρωσις
  choice: die Offenbarung
  rationale: Gemeint ist das Sichtbar- oder Erkennbarwerden des Wirkens des Geistes. »Offenbarung« ist würdig und verständlich, ohne den Ausdruck auf eine bestimmte einzelne Gabe einzuengen.
- source_word: τοῦ πνεύματος
  choice: des Geistes
  rationale: Der unmittelbare Zusammenhang weist auf den Heiligen Geist. Wie im Griechischen wird »heilig« nicht ergänzt; die Großschreibung macht den Bezug im Deutschen deutlich.
- source_word: πρὸς τὸ συμφέρον
  choice: zum gemeinsamen Nutzen
  rationale: Die Wendung bezeichnet das Förderliche oder Nützliche. Im Zusammenhang des einen Leibes steht der Nutzen für die Gemeinschaft im Vordergrund, während eine Fußnote die allgemeinere lexikalische Möglichkeit offenhält.
theological_decisions:
- issue: Bezug von »Geist«
  choice: Die Wendung bezeichnet den Heiligen Geist.
  alternative: ein nicht näher bestimmter Geist oder menschlicher Geist
  rationale: In 1. Korinther 12,4–11 ist wiederholt derselbe Geist als Geber und Urheber der Gaben genannt. Dennoch wird »heilig« nicht in den Haupttext eingefügt, weil es an dieser Stelle im griechischen Wortlaut fehlt.
- issue: Reichweite von συμφέρον
  choice: Der Nutzen ist gemeinschaftlich ausgerichtet.
  alternative: das allgemein Nützliche, ohne ausdrückliche Festlegung auf den Nutzen aller
  rationale: Der weitere Gedankengang über den Leib und seine Glieder stützt »gemeinsamer Nutzen«. Da die griechische Formulierung für sich genommen allgemeiner sein kann, wird diese echte Bedeutungsbreite in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Text, ist aber idiomatisch. »Offenbarung des Geistes« bewahrt die sachliche und theologische Spannung zwischen dem Wirken des Geistes und dessen sichtbarer Ausprägung, ohne vorschnell »Geistesgabe« einzusetzen.
