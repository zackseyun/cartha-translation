  source_fidelity: 'Der Haupttext gibt alle Elemente des griechischen Satzes angemessen wieder: die individuelle Verteilung (ἑκάστῳ), den leichten Anschluss (δέ), das Passiv von δίδοται, φανέρωσις τοῦ πνεύματος und die Zielbestimmung πρὸς τὸ συμφέρον. „Zum gemeinsamen Nutzen“ ist im Kontext von 1 Korinther 12 eine gut begründete kontextuelle Wiedergabe; die Fußnote bewahrt die allgemeinere lexikalische Möglichkeit.'
  naturalness: „Jedem aber wird die Offenbarung des Geistes zum gemeinsamen Nutzen gegeben“ ist würdiges, modernes Standarddeutsch und syntaktisch klar. „Offenbarung des Geistes“ ist in diesem kirchlich-theologischen Register eine etablierte und verständliche Wiedergabe von φανέρωσις τοῦ πνεύματος.
  terminology: „Geist“ mit Großschreibung wahrt den im Kontext eindeutigen Bezug auf den Heiligen Geist, ohne das im griechischen Text nicht vorhandene „heilig“ zu ergänzen. „Offenbarung“ ist für φανέρωσις vertretbar und vermeidet die interpretierende Einengung auf eine einzelne „Gabe“. Der Fußnotenanker steht an der sachlich passenden Stelle.
