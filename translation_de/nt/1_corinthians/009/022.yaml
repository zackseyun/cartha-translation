  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „auf jede mögliche Weise“ ist verständlich, aber weniger knapp und rhetorisch markant als „auf alle Weise“. Die bisherige Erklärung in Fußnote b („der Einsatz jeder möglichen Weise“) ist grammatisch und idiomatisch nicht gelungen.
