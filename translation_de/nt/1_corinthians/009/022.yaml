  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: de
  text: Den Schwachen bin ich ein Schwacher geworden[a], um die Schwachen zu gewinnen. Allen bin ich alles geworden, um auf alle Weise[b] einige zu retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den im Gewissen Schwachen«; im 1. Korintherbrief kann der Ausdruck besonders Menschen bezeichnen, deren Gewissen leicht verunsichert wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit allen Mitteln« oder »auf jede mögliche Weise«; gemeint ist, alle möglichen Wege zur Erreichung des Ziels einzusetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: bin ich … geworden
  rationale: Das Aorist von γίνομαι bezeichnet hier Paulus’ bewusstes Eingehen auf die Lage anderer; die deutsche Perfektform ist natürlich und bewahrt den Gedanken des Annehmens einer Haltung.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: den Schwachen / ein Schwacher / die Schwachen
  rationale: Die Wiederholung von »schwach« bewahrt die rhetorische Wirkung des Griechischen. Der Ausdruck kann im Kontext Gewissensschwäche einschließen, bleibt im Vers selbst aber weiter gefasst.
- source_word: κερδήσω
  choice: zu gewinnen
  rationale: Im missionarischen Zusammenhang bedeutet κερδαίνω, Menschen zu gewinnen; diese Wiedergabe ist im Deutschen natürlich und hält den Zweckcharakter fest.
- source_word: τοῖς πᾶσιν
  choice: allen
  rationale: Der substantivierte Dativ bezeichnet alle Menschen beziehungsweise Gruppen im Kontext. »Allen« ist knapp, idiomatisch und benötigt im Deutschen keine ausdrückliche Ergänzung.
- source_word: γέγονα
  choice: bin ich … geworden
  rationale: Das Perfekt beschreibt eine entstandene und fortbestehende Haltung. Die deutsche Perfektform gibt dies natürlich wieder.
- source_word: πάντα
  choice: alles
  rationale: »Allen … alles« bewahrt die prägnante Parallelität und umfassende Ausdrucksweise des griechischen Textes.
- source_word: πάντως
  choice: auf jede mögliche Weise
  rationale: Hier bezeichnet πάντως den Einsatz aller möglichen Mittel zur Erreichung des Ziels. Die Formulierung vermeidet den möglichen Beiklang moralisch fragwürdiger Mittel bei »um jeden Preis«.
- source_word: τινὰς
  choice: einige
  rationale: Das indefinite Pronomen bleibt bewusst zurückhaltend; Paulus behauptet nicht, alle zu retten.
- source_word: σώσω
  choice: zu retten
  rationale: σῴζω trägt hier echte Heilsaussage. »Retten« bewahrt das theologische Gewicht, ohne die im weiteren Kontext vorausgesetzte instrumentale Rolle des Paulus eigens auszudeuten.
theological_decisions:
- issue: Bedeutung von »die Schwachen«
  choice: Im Haupttext allgemein als »die Schwachen« wiedergeben.
  alternative: »die im Gewissen Schwachen« oder »die Kraftlosen«
  rationale: Im 1. Korintherbrief kann der Ausdruck besonders Menschen mit einem empfindlichen Gewissen bezeichnen; der Wortlaut dieses Verses bleibt jedoch allgemein. Eine Präzisierung im Haupttext würde die vorhandene Offenheit unnötig auflösen.
- issue: Aussage »einige zu retten«
  choice: Das direkte Rettungsverb beibehalten.
  alternative: »einige zur Rettung zu führen« oder »zur Rettung einiger beizutragen«
  rationale: Der griechische Text schreibt Paulus ausdrücklich das Handeln mit σώσω zu. Eine abschwächende Umschreibung würde die Aussage mindern; zugleich ist aus dem Kontext keine Behauptung abzuleiten, Paulus sei der letzte Ursprung der Rettung.
- issue: Umfang von »allen alles geworden«
  choice: Die umfassende rhetorische Formulierung ohne ethische Einschränkung im Haupttext bewahren.
  alternative: »mich allen in allem angepasst«
  rationale: Die griechische Wendung ist zugespitzt und sollte nicht durch eine erklärende Paraphrase eingeengt werden. Der Zweckzusammenhang beschreibt missionarische Anpassung, nicht ausdrücklich grenzenlosen oder unlauteren Kompromiss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholungen und die Parallelität des griechischen Satzes werden möglichst bewahrt; erläuternde Präzisierungen stehen in den Fußnoten, nicht im Haupttext.
