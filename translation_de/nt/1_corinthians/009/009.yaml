  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: de
  text: 'Denn im Gesetz des Mose steht geschrieben: »Du sollst einem Ochsen beim Dreschen[a] nicht das Maul zubinden.« Kümmert sich Gott etwa um die Ochsen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »während er das Getreide austritt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Denn im Gesetz des Mose
  rationale: Die Wendung gibt ἐν mit dem Genitivverhältnis natürlich wieder und bewahrt die geläufige biblische Bezeichnung. γάρ wird mit »Denn« als Begründungspartikel sichtbar gemacht.
- source_word: γέγραπται
  choice: steht geschrieben
  rationale: Die deutsche Schriftformel gibt das griechische Perfekt idiomatisch wieder und bringt den fortdauernden Geltungsanspruch des Zitats zum Ausdruck.
- source_word: Οὐ κημώσεις
  choice: Du sollst … nicht das Maul zubinden
  rationale: Der als Verbot gebrauchte Futur wird in der üblichen deutschen Gesetzessprache mit »Du sollst nicht« wiedergegeben. »Das Maul zubinden« bezeichnet das Verhindern des Fressens verständlich und ohne unnötigen Fachausdruck.
- source_word: βοῦν
  choice: einem Ochsen
  rationale: »Ochse« ist hier die präzise und traditionelle Bezeichnung für das als Arbeitstier eingesetzte Rind; der deutsche Dativ ergibt sich aus der Konstruktion »jemandem das Maul zubinden«.
- source_word: ἀλοῶντα
  choice: beim Dreschen
  rationale: Das präsentische Partizip bezeichnet die gleichzeitig andauernde Tätigkeit des Ochsen. »Beim Dreschen« ist knapp und natürlich; die konkretere Vorstellung des Austretens von Getreide wird als lexikalische Alternative in der Fußnote genannt.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Kümmert sich Gott etwa um die Ochsen?
  rationale: Die Formulierung bewahrt die rhetorische Frage und gibt μή durch das erwartungslenkende »etwa« wieder. Sie fügt weder »nur« hinzu noch löst sie die Spannung hinsichtlich von Gottes Fürsorge für Tiere auf.
theological_decisions:
- issue: Paulus’ rhetorische Frage nach Gottes Sorge für die Ochsen
  choice: Die Frage wird direkt und ohne deutenden Zusatz als »Kümmert sich Gott etwa um die Ochsen?« wiedergegeben.
  alternative: »Geht es Gott etwa nur um die Ochsen?«
  rationale: Das griechische μή lässt eine verneinende Antwort erwarten, enthält aber kein ausdrückliches »nur«. Die gewählte Fassung bewahrt deshalb die argumentative Schärfe und zugleich die theologische Spannung, statt eine ausschließlich vergleichende Bedeutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schriftformel »steht geschrieben« und die Rechtsform »Du sollst … nicht« bewahren den biblisch-rechtlichen Ton, während »das Maul zubinden« und »Kümmert sich Gott etwa …?« allgemein verständlich bleiben.
