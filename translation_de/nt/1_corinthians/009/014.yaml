  - severity: low
    issue: Die Formulierung „die, die“ ist stilistisch weniger glatt; der Fußnotenanker steht nach einem nicht erforderlichen Komma.
    rationale: Beides betrifft nicht die Bedeutung, doch „diejenigen, die“ ist im modernen Standarddeutsch leseflüssiger und erlaubt eine sauber gesetzte Fußnotenposition.
