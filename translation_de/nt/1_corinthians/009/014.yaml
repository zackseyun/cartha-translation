source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: de
  text: So hat auch der Herr angeordnet, dass diejenigen, die das Evangelium verkünden[a], vom Evangelium leben sollen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die das Evangelium predigen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt im Kontext: ihren Lebensunterhalt aus der Verkündigung des Evangeliums erhalten.'
    reason: clarification
lexical_decisions:
- source_word: οὕτως
  choice: Ebenso
  rationale: Kennzeichnet knapp und natürlich die Analogie zu den vorausgehenden Beispielen.
- source_word: καὶ
  choice: auch (im Deutschen nicht eigens ausgedrückt)
  rationale: Die additive Beziehung ist durch „Ebenso“ bereits hinreichend bezeichnet; ein zusätzliches „auch“ wäre möglich, klänge hier aber schwerfälliger.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Bewahrt die übliche paulinische Bezeichnung und lässt die im Kontext naheliegende Beziehung auf Jesus bestehen, ohne den Namen ergänzend einzutragen.
- source_word: διέταξεν
  choice: hat angeordnet
  rationale: Gibt die autoritative Weisung wieder; „angeordnet“ ist würdig und etwas weniger obrigkeitssprachlich als „befohlen“.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: die, die ... verkünden
  rationale: Gibt das substantivierte Partizip natürlich wieder; „verkünden“ bewahrt den öffentlichen Bekanntmachungscharakter des Verbs.
- source_word: τὸ εὐαγγέλιον
  choice: das Evangelium
  rationale: Ist im paulinischen Zusammenhang die etablierte und allgemein verständliche Wiedergabe.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: vom Evangelium
  rationale: Bewahrt die prägnante Quellenangabe des Griechischen; der Zusammenhang macht deutlich, dass es um den Lebensunterhalt aus dem Dienst am Evangelium geht.
- source_word: ζῆν
  choice: leben sollen
  rationale: Gibt den abhängigen Infinitiv und den normativen Gehalt der Anordnung in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Bezug von „der Herr“
  choice: Die Übersetzung belässt „der Herr“; im paulinischen Kontext ist wahrscheinlich Jesus gemeint.
  alternative: Eine allgemeinere Gottesbezeichnung.
  rationale: Der wahrscheinliche Bezug auf Jesus darf nicht durch die ausdrückliche Ergänzung seines Namens zur einzigen sprachlich möglichen Lesart gemacht werden.
- issue: Bedeutung von „vom Evangelium leben“
  choice: Materieller Lebensunterhalt für Menschen, die das Evangelium verkünden.
  alternative: Geistliches Leben, das aus dem Evangelium stammt.
  rationale: Der unmittelbare Zusammenhang behandelt den Anspruch von Verkündigern auf materielle Unterstützung. Die knappe Ausgangsformulierung bleibt dennoch erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am griechischen Satzbau, ohne unnatürlich zu wirken; die materielle Bedeutung von „leben“ wird in einer Fußnote erläutert.
