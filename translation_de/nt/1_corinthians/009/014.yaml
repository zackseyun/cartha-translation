  source_fidelity: 'Die Kernaussage wird zutreffend wiedergegeben: Der Herr hat Verkündigern des Evangeliums verbindlich zugesprochen, davon zu leben. Allerdings bleibt das additive καί in der vorliegenden Satzfassung unmarkiert. „Ebenso“ gibt οὕτως gut wieder, ersetzt aber nicht ohne Weiteres das zusätzlich hervorgehobene „auch“.'
  naturalness: „So hat auch der Herr angeordnet“ ist modernes, natürliches Standarddeutsch und bildet sowohl den Anschluss an den vorherigen Vergleich als auch die additive Hervorhebung ab. „Diejenigen, die“ vermeidet die etwas sperrige Doppelung „die, die“.
  terminology: „der Herr“, „Evangelium“, „verkünden“ und „vom Evangelium leben“ sind angemessen, fachsprachlich etabliert und quellentreu. Die Erläuterung zur materiellen Versorgung ist angesichts des Kontextes sachgerecht, sollte jedoch ausdrücklich als kontextuelle Erläuterung formuliert werden.
