  source_fidelity: 'Die Grundstruktur und die wesentlichen Begriffe entsprechen dem griechischen Text: die rhetorische Frage mit πάντως, die zweimalige Begründung „um unseretwillen“, die Wiederholung von „pflügen“ sowie die offene Teilhabe beim Dreschenden. Die im Deutschen ergänzte finite Konstruktion „soll ... dreschen“ ist durch den Parallelismus gedeckt. „Anteil zu erhalten“ ist jedoch gegenüber μετέχειν etwas zu eng auf den Empfang ausgerichtet; „Anteil zu haben“ wahrt besser die Bedeutung von Teilhabe, ohne einen Gegenstand zu ergänzen.'
  naturalness: Der Vers ist überwiegend flüssig und registergerecht. Die Folge „in der Hoffnung dreschen, Anteil zu erhalten“ ist jedoch syntaktisch schwerfällig und lässt den Infinitivsatz zunächst wie eine Zweckbestimmung des Dreschens wirken. „in der Hoffnung auf Anteil dreschen“ ist idiomatischer und bildet die griechische Hoffnung-auf-Teilhabe-Konstruktion klar ab.
  terminology: „Um unseretwillen“, „in Hoffnung“ und „soll“ sind angemessen und bewahren den gehobenen, aber verständlichen Bibelton. „Anteil“ ist als offene Wiedergabe von μετέχειν geeignet; ein ausdrücklich genannter Ernteertrag sollte im Haupttext nicht ergänzt werden.
