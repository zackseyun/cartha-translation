source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: de
  text: 'Oder sagt er das ganz und gar um unseretwillen?[a] Denn um unseretwillen wurde es geschrieben: Wer pflügt, soll in Hoffnung pflügen, und wer drischt, soll in der Hoffnung auf Anteil dreschen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Oder sagt er das gewiss um unseretwillen?“ Das griechische Adverb kann die Aussage als vollständig oder als gewiss hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich bleibt unausgesprochen, woran der Dreschende Anteil hat; aus dem Bildzusammenhang sind Ernte oder Ertrag gemeint.
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: ganz und gar
  rationale: Die Wendung gibt die verstärkende Kraft des Adverbs in der rhetorischen Frage wieder, ohne sie eindeutig nur als Gewissheitsmarker festzulegen.
- source_word: δι’ ἡμᾶς
  choice: um unseretwillen
  rationale: διά mit Akkusativ bezeichnet hier den Bezug auf den Nutzen beziehungsweise die Bestimmung für Paulus und seine Mitarbeiter; „um unseretwillen“ ist präzise und würdevoll.
- source_word: ἐγράφη
  choice: wurde es geschrieben
  rationale: Das Präteritum Passiv entspricht dem griechischen Aorist und ist in deutscher Schriftauslegung natürlich.
- source_word: ὀφείλει
  choice: soll
  rationale: „Soll“ bewahrt den Gedanken berechtigter beziehungsweise normativer Erwartung, ohne eine stärkere äußere Verpflichtung als nötig einzutragen.
- source_word: ἐπ’ ἐλπίδι
  choice: in Hoffnung / in der Hoffnung
  rationale: Die Formulierung beschreibt die erwartungsvolle Haltung, in der die Arbeit geschieht; die leichte deutsche Variation dient dem natürlichen Satzbau.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: Wer pflügt, soll in Hoffnung pflügen
  rationale: Die generische Relativkonstruktion gibt das substantivierte Partizip natürlich und ohne unnötige Geschlechtsfestlegung wieder; die Wiederholung von „pflügen“ bleibt erhalten.
- source_word: ὁ ἀλοῶν … τοῦ μετέχειν
  choice: wer drischt, soll in der Hoffnung dreschen, Anteil zu erhalten
  rationale: Die parallele Verbalkonstruktion wird im Deutschen vervollständigt; „Anteil erhalten“ gibt μετέχειν wieder, ohne den im Griechischen unausgesprochenen Gegenstand im Haupttext festzulegen.
theological_decisions:
- issue: Bedeutung von πάντως in der rhetorischen Frage
  choice: Als „ganz und gar“ wiedergegeben
  alternative: „gewiss“ oder „sicherlich“
  rationale: Das Adverb kann hier Vollständigkeit oder nachdrückliche Gewissheit ausdrücken. Der Haupttext folgt der Lesart „ganz und gar“, während die Fußnote die echte lexikalische Mehrdeutigkeit offenhält.
- issue: Unausgesprochener Gegenstand bei μετέχειν
  choice: Keinen bestimmten Gegenstand ergänzt
  alternative: „Anteil an der Ernte zu erhalten“
  rationale: Der landwirtschaftliche Zusammenhang legt Ernte oder Ertrag nahe, doch der griechische Text nennt den Gegenstand nicht. Die offene Formulierung vermeidet eine unnötige Festlegung und bewahrt zugleich Paulus’ Argument über Teilhabe am Arbeitsertrag.
- issue: Elliptische Form des zweiten Satzglieds
  choice: „soll … dreschen“ zur Verdeutlichung der Parallelität ergänzt
  alternative: „und wer drischt, in der Hoffnung, Anteil zu erhalten“
  rationale: Das Griechische lässt das Prädikat des zweiten Glieds elliptisch beziehungsweise verkürzt stehen. Die Ergänzung ist aus dem Parallelismus eindeutig erschließbar und ergibt einen verständlichen deutschen Satz.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Um unseretwillen“ bewahrt die rhetorische Prägung des Verses; generische Wer-Sätze vermeiden unnötige Geschlechtsmarkierung. Die Wiederholung der landwirtschaftlichen Verben erhält den Parallelismus.
