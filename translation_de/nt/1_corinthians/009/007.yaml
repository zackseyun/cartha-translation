id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: de
  text: Wer leistet je auf eigene Kosten Kriegsdienst?[a] Wer pflanzt einen Weinberg und isst nicht von dessen Frucht? Und wer hütet eine Herde und trinkt nicht von der Milch der Herde?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von seinem eigenen Sold“. Das griechische Wort bezeichnet besonders den Sold oder die Verpflegung eines Soldaten; gemeint ist, dass ein Soldat die Kosten seines Dienstes nicht selbst trägt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „isst nicht von der Milch der Herde“. Im Deutschen sagt man bei Milch gewöhnlich „trinken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: leistet Kriegsdienst
  rationale: Das Verb bezeichnet das Ausüben militärischen Dienstes. „Kriegsdienst leisten“ gibt die beruflich-militärische Analogie wieder, ohne den Ausdruck auf einen einzelnen Kampf zu verengen.
- source_word: ἰδίοις ὀψωνίοις
  choice: auf eigene Kosten
  rationale: ὀψώνιον kann besonders den Sold oder die Verpflegung eines Soldaten bezeichnen. Im Zusammenhang zielt die Frage darauf, dass ein Soldat seinen Dienst nicht selbst finanziert; „auf eigene Kosten“ vermittelt diesen Sinn im heutigen Deutsch klar.
- source_word: ποτέ
  choice: je
  rationale: In der rhetorischen Frage bedeutet ποτέ „jemals“; „je“ ist knapp und idiomatisch.
- source_word: φυτεύει ἀμπελῶνα
  choice: pflanzt einen Weinberg
  rationale: Die Formulierung bildet das landwirtschaftliche Bild unmittelbar und verständlich ab.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: von dessen Frucht
  rationale: καρπός bezeichnet hier den Ertrag des Weinbergs. „Frucht“ bewahrt das konkrete Bild und den Singular des griechischen Textes.
- source_word: ποιμαίνει ποίμνην
  choice: hütet eine Herde
  rationale: ποιμαίνω bedeutet eine Herde zu weiden, zu hüten oder als Hirte zu betreuen. „Eine Herde hüten“ ist natürliches Deutsch und erhält das Hirtenbild.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: von der Milch der Herde
  rationale: Die Wendung bezeichnet den Anteil beziehungsweise Nutzen aus der Milch, welche die Herde liefert. Die Übersetzung bleibt nahe an der Quellenangabe des griechischen Ausdrucks.
- source_word: ἐσθίει
  choice: isst / trinkt
  rationale: Das Verb bedeutet wörtlich in beiden Fragen „isst“. Bei Milch verlangt natürliches modernes Deutsch jedoch „trinkt“; die Fußnote weist auf die wörtliche Parallelität hin.
theological_decisions:
- issue: Generisch gebrauchte männliche Einzahl in den wiederholten τίς-Sätzen
  choice: Mit dem geschlechtsübergreifenden deutschen Fragepronomen „wer“ und den sachbezogenen Formulierungen wiedergegeben
  alternative: Explizit männliche Bezeichnungen wie „welcher Soldat“ oder pluralische, geschlechtsneutrale Umformulierungen
  rationale: Das griechische τίς stellt allgemeine rhetorische Fragen in der Einzahl. Das deutsche „wer“ bewahrt Einzahl und Allgemeingültigkeit, ohne dem Text eine zusätzliche geschlechtliche Festlegung aufzuzwingen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die drei rhetorischen Fragen und ihre beruflichen beziehungsweise landwirtschaftlichen Bilder bleiben erhalten; unnötige Fachsprache wurde vermieden.
