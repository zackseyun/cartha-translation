  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: de
  text: Für die Menschen ohne Gesetz wurde ich wie einer ohne Gesetz – obwohl ich Gott gegenüber nicht ohne Gesetz bin, sondern unter dem Gesetz des Messias stehe –, damit ich die Menschen ohne Gesetz gewinne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Gesetzlosen … wie ein Gesetzloser … die Gesetzlosen«. Gemeint sind hier Menschen, die nicht unter dem mosaischen Gesetz stehen, nicht notwendigerweise Menschen ohne moralische Bindung. »Unter dem Gesetz des Messias« kann auch mit »im Gesetz des Messias« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: denen ohne das Gesetz / einer ohne das Gesetz / die ohne das Gesetz
  rationale: Im Zusammenhang bezeichnet ἄνομος Menschen, die nicht unter dem mosaischen Gesetz stehen, nicht allgemein sittenlose oder gesetzlose Menschen. Die dreifache Wiederholung wird bewahrt.
- source_word: ὡς
  choice: wie
  rationale: Kennzeichnet Paulus’ anpassendes Verhalten, ohne zu behaupten, er sei uneingeschränkt gesetzlos geworden.
- source_word: μὴ ὢν
  choice: obwohl ich nicht … bin
  rationale: Die Partizipialkonstruktion schränkt die vorausgehende Aussage konzessiv ein und wird so in natürlichem Deutsch wiedergegeben.
- source_word: ἔννομος Χριστοῦ
  choice: unter dem Gesetz des Messias stehe
  rationale: ἔννομος bezeichnet das Stehen innerhalb eines Gesetzesverhältnisses beziehungsweise die Unterordnung darunter. Die Formulierung erhält den Gegensatz zu »ohne das Gesetz« und gibt Χριστοῦ als titelhaftes »des Messias« wieder.
- source_word: ἵνα κερδάνω
  choice: damit ich … gewinne
  rationale: ἵνα bezeichnet den Zweck; κερδαίνω meint hier, Menschen für die Botschaft beziehungsweise für den Messias zu gewinnen.
theological_decisions:
- issue: Bedeutung von ἄνομος
  choice: Menschen ohne das mosaische Gesetz
  alternative: gesetzlose oder sittlich rebellische Menschen
  rationale: Der unmittelbare Zusammenhang stellt diese Gruppe den Juden und denen unter dem Gesetz gegenüber. Paulus’ anschließende Einschränkung schließt moralische Gesetzlosigkeit ausdrücklich aus.
- issue: Bedeutung von ἔννομος Χριστοῦ
  choice: unter dem Gesetz des Messias stehen
  alternative: im Gesetz des Messias sein / dem Messias gesetzmäßig verbunden sein
  rationale: Die Übersetzung wahrt die rechtliche Beziehung und Paulus’ bleibende Bindung an Gottes Willen, ohne näher festzulegen, wie »Gesetz des Messias« theologisch vollständig zu bestimmen ist.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Hier ist Χριστός in der relationalen Wendung »Gesetz des Messias« als Titel erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »ohne das Gesetz« bildet die markante Wiederholung des griechischen ἄνομος ab; »stehe« ergänzt idiomatisch das bei ἔννομος vorausgesetzte Verhältnis.
