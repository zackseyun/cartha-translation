    issue: Die Formulierung „nicht ohne Gottes Gesetz“ bildet ἄνομος θεοῦ weniger genau ab.
    rationale: Der griechische Ausdruck beschreibt primär Paulus’ Stellung Gott gegenüber („nicht ohne Gesetz vor/gegenüber Gott“) und wird durch den Gegensatz zu ἔννομος Χριστοῦ näher bestimmt. Die Revision wahrt diese relationale Aussage.
  - severity: low
    issue: Die Fußnote beginnt mit der unidiomatischen Formulierung „Wörtlich auch“.
    rationale: „Oder“ leitet eine lexikalische Alternative klarer ein. Die Erklärung soll zugleich deutlich machen, dass „gesetzlos“ hier nicht notwendig moralische Zügellosigkeit bezeichnet.
