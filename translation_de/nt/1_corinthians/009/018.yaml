source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: de
  text: Was ist also mein Lohn? Dass ich beim Verkünden der guten Nachricht die gute Nachricht unentgeltlich anbiete, um mein Recht im Dienst der guten Nachricht nicht voll auszuschöpfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθός
  choice: Lohn
  rationale: „Lohn“ gibt die rhetorische Frage prägnant wieder und kann hier wie das griechische Wort sowohl Entgelt als auch die paradoxe Belohnung bezeichnen, unentgeltlich zu verkünden.
- source_word: εὐαγγελιζόμενος
  choice: beim Verkünden der guten Nachricht
  rationale: Die Formulierung bewahrt den verbalen Charakter des Partizips und bezeichnet eine zur Haupthandlung gleichzeitige Tätigkeit.
- source_word: ἀδάπανον
  choice: unentgeltlich
  rationale: Das Adjektiv bedeutet „ohne Kosten/Aufwand“; im Zusammenhang ist gemeint, dass Paulus für die Verkündigung keine Bezahlung verlangt.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: die gute Nachricht anbiete
  rationale: Das wörtliche „die gute Nachricht setze“ ist im Deutschen unverständlich. „Anbiete“ gibt idiomatisch wieder, dass Paulus sie den Menschen ohne Entgelt zugänglich macht.
- source_word: εὐαγγέλιον
  choice: gute Nachricht
  rationale: Die transparente moderne Wiedergabe entspricht der Grundbedeutung des griechischen Ausdrucks; „Evangelium“ bleibt als mögliche traditionelle Wiedergabe implizit, erfordert hier aber keine eigene Fußnote.
- source_word: καταχρήσασθαι
  choice: keinen vollen Gebrauch mache
  rationale: Das Verb kann das vollständige Ausschöpfen einer Möglichkeit oder eines Rechts bezeichnen. Die Wiedergabe vermeidet die unbegründete Unterstellung eines missbräuchlichen Handelns.
- source_word: ἐξουσίᾳ
  choice: Recht
  rationale: Im Kontext von 1 Korinther 9 geht es konkret um den legitimen Anspruch auf materielle Unterstützung, nicht nur allgemein um Autorität.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: im Dienst der guten Nachricht
  rationale: Die knappe griechische Wendung bezeichnet hier wahrscheinlich den Bereich der Verkündigung bzw. den Dienst an der guten Nachricht. Die leicht explizierende Wiedergabe ist im Deutschen natürlicher.
theological_decisions:
- issue: Art von Paulus’ ἐξουσία
  choice: Ein legitimes Recht auf Unterstützung im Dienst der guten Nachricht, das Paulus freiwillig nicht voll ausschöpft
  alternative: Allgemeine apostolische Vollmacht oder ein potenziell missbräuchlicher Gebrauch von Autorität
  rationale: Der unmittelbare Zusammenhang behandelt wiederholt den Anspruch der Apostel auf materielle Versorgung. Deshalb stehen „Recht“ und „keinen vollen Gebrauch machen“, ohne einen Missbrauch anzudeuten.
- issue: Bezug von εἰς τὸ μὴ καταχρήσασθαι
  choice: Die Zweck- bzw. Ergebnisangabe wird mit „und so“ wiedergegeben
  alternative: „damit ich … keinen vollen Gebrauch mache“ oder als nähere Erklärung des unentgeltlichen Angebots
  rationale: Die griechische Konstruktion kann Zweck oder beabsichtigtes Ergebnis ausdrücken. „Und so“ wahrt den engen Zusammenhang, ohne die logische Beziehung übermäßig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „gute Nachricht“ bildet die Wiederaufnahme des griechischen Wortstamms ab. „Unentgeltlich“ ist präzise und vermeidet den möglichen Eindruck, die Botschaft selbst habe keinen Wert. Der einzige Fußnotenmarker [a] steht unmittelbar nach der betreffenden Wendung.
