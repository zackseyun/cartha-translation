  terminology: „das Gesetz“ bewahrt den bestimmten, im Folgevers auf das mosaische Gesetz bezogenen Schriftverweis. „Aus menschlicher Sicht“ gibt κατὰ ἄνθρωπον natürlich wieder, ohne die Formulierung auf einen bestimmten theologischen oder philosophischen Sinn zu verengen.
