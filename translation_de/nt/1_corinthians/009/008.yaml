  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: de
  text: Sage ich das etwa nur aus menschlicher Sicht[a], oder sagt nicht auch das Gesetz dasselbe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach menschlicher Art“; „nach menschlichem Ermessen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: etwa … nur
  rationale: Die Partikel leitet eine rhetorische Frage ein, auf die eine verneinende Antwort erwartet wird. Im Deutschen gibt „etwa“ diese Erwartung natürlich wieder; „nur“ gehört zugleich zur Wiedergabe des Gegensatzes in κατὰ ἄνθρωπον.
- source_word: κατὰ ἄνθρωπον
  choice: nach menschlichem Ermessen
  rationale: Die Wendung bezeichnet hier einen bloß menschlichen Maßstab beziehungsweise eine menschliche Sichtweise. Die Formulierung bewahrt den Gegensatz zum Zeugnis des Gesetzes, ohne eine bestimmte Deutung wie „auf menschliche Autorität hin“ festzuschreiben.
- source_word: ταῦτα
  choice: hier
  rationale: Das griechische Demonstrativpronomen verweist auf die vorausgehenden Aussagen. Im natürlichen deutschen Satz bündelt „hier“ diesen Rückbezug; die wörtlichere Wiedergabe „diese Dinge“ wäre verständlich, aber weniger idiomatisch.
- source_word: λαλῶ
  choice: Rede ich
  rationale: Das Präsens bezeichnet Paulus’ gegenwärtiges Reden beziehungsweise Argumentieren. „Rede ich“ ist würdig, direkt und näher am griechischen Verb als eine stärker auslegende Form wie „argumentiere ich“.
- source_word: ἢ
  choice: oder
  rationale: Die Konjunktion führt schlicht die alternative beziehungsweise ergänzende Berufung auf das Gesetz ein.
- source_word: καὶ
  choice: auch
  rationale: Das Gesetz wird als weiterer Zeuge neben der vorausgehenden menschlichen Überlegung angeführt.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Der bestimmte Ausdruck verweist im Zusammenhang auf das mosaische Gesetz, aus dem der folgende Vers zitiert. „Das Gesetz“ erhält den Schriftbezug, ohne ihn im Haupttext auszuweiten.
- source_word: οὐ λέγει
  choice: sagt das nicht
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung. Die deutsche Wortstellung bewahrt diese rhetorische Form und vermeidet eine Glättung zur bloßen Aussage.
theological_decisions:
- issue: Bezug von „das Gesetz“
  choice: Das mosaische Gesetz beziehungsweise der entsprechende Teil der Schrift
  alternative: Gesetz als allgemeiner Grundsatz
  rationale: Der unmittelbar folgende Vers zitiert Deuteronomium 25,4. Daher ist der konkrete Schriftbezug sachlich geboten, ohne weitere dogmatische Folgerungen in die Übersetzung einzutragen.
- issue: Verhältnis von menschlicher Überlegung und Schriftzeugnis
  choice: Die rhetorische Gegenüberstellung bleibt erhalten
  alternative: Paulus verwerfe jede menschliche Überlegung grundsätzlich
  rationale: Der Vers stellt eine bloß menschliche Grundlage dem zusätzlichen Zeugnis des Gesetzes gegenüber. Die Übersetzung sollte daraus keine umfassende Abwertung menschlichen Denkens machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Nach menschlichem Ermessen“ ist idiomatisch und lässt die Reichweite des griechischen Ausdrucks offen. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
