    rationale: In „oder sagt das nicht auch das Gesetz?“ kann „das“ beim Lesen zunächst unklar wirken. Die Stellung „oder sagt nicht auch das Gesetz dasselbe?“ macht Subjekt und Inhaltsbezug unmittelbar deutlich.
