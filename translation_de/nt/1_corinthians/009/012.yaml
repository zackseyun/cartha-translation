id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: de
  text: Wenn andere an diesem Anrecht euch gegenüber[a] Anteil haben, haben nicht wir erst recht Anteil daran? Doch wir haben von diesem Anrecht keinen Gebrauch gemacht, sondern ertragen alles, damit wir dem Evangelium des Messias kein Hindernis bereiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an diesem Anspruch an euch« beziehungsweise »an dieser Vollmacht euch gegenüber«. Gemeint ist wahrscheinlich das Anrecht der Apostel auf materielle Unterstützung durch die Korinther.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: Anrecht
  rationale: Im Zusammenhang bezeichnet das Wort den legitimen Anspruch der Apostel auf materielle Unterstützung. »Anrecht« gibt diese Berechtigung im Deutschen natürlicher wieder als »Vollmacht« oder »Autorität«.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: diesem Anrecht euch gegenüber
  rationale: 'Der Genitiv ὑμῶν beschreibt hier wahrscheinlich die Beziehung zu den Korinthern: Es geht um ein ihnen gegenüber bestehendes Anrecht, nicht um ein Recht, das sie selbst besitzen.'
- source_word: μετέχουσιν
  choice: teilhaben
  rationale: Die Wiedergabe wahrt den Gedanken, dass andere an diesem Anrecht beteiligt sind beziehungsweise davon Gebrauch machen können.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: nicht erst recht wir?
  rationale: Die knappe rhetorische Frage bewahrt die steigernde Kraft von μᾶλλον und klingt im modernen Deutschen natürlich.
- source_word: ἐχρησάμεθα
  choice: haben ... keinen Gebrauch gemacht
  rationale: χράομαι bezeichnet hier das Inanspruchnehmen oder Ausüben eines bestehenden Rechts.
- source_word: πάντα
  choice: alles
  rationale: Die umfassende Aussage des griechischen Neutrums Plural wird knapp und idiomatisch wiedergegeben.
- source_word: στέγομεν
  choice: ertragen
  rationale: Im Kontext geht es um das Tragen von Belastungen und Entbehrungen, nicht um das wörtliche Bedecken.
- source_word: τινα ἐγκοπὴν
  choice: kein Hindernis
  rationale: ἐγκοπή bezeichnet ein Hemmnis oder Hindernis. Die deutsche Formulierung gibt den Zweck der Rücksichtnahme klar wieder.
- source_word: δῶμεν
  choice: bereiten
  rationale: Das griechische »geben« bildet mit »Hindernis« eine idiomatische Verbindung; im Deutschen ist »ein Hindernis bereiten« natürlicher als »ein Hindernis geben«.
- source_word: εὐαγγελίῳ
  choice: Evangelium
  rationale: »Evangelium« ist in paulinischem Zusammenhang die etablierte und inhaltlich angemessene deutsche Entsprechung.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Mit Artikel und Genitivattribut hat Χριστός hier klaren Titelcharakter; »Messias« bewahrt diese Bedeutung.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Χριστός ist hier als Titel zu verstehen. »Des Messias« macht die messianische Bedeutung sichtbar, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Kürze der ersten Frage und die Spannung zwischen bestehendem Anrecht und freiwilligem Verzicht bleiben erhalten.
