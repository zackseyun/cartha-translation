  text: μὴ οὐκ ἔχομεν ἐξουσίαν φαγεῖν καὶ ⸀πεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: de
  text: Haben wir nicht das Recht, zu essen und zu trinken?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Befugnis, zu essen und zu trinken“. Mit dem „Recht“ ist hier ein berechtigter Anspruch oder eine legitime Freiheit gemeint, im Zusammenhang wahrscheinlich das Recht auf materielle Versorgung.'
    reason: lexikalische Alternative und kontextuelle Erläuterung
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Haben wir nicht …?
  rationale: Die Partikelverbindung leitet eine rhetorische Frage ein, auf die eine bejahende Antwort erwartet wird. Die deutsche Form bewahrt sowohl den Fragecharakter als auch diese Erwartung.
- source_word: ἔχομεν
  choice: haben
  rationale: Das Präsens wird direkt und natürlich wiedergegeben.
- source_word: ἐξουσίαν
  choice: das Recht
  rationale: Im Zusammenhang bezeichnet das Wort eine legitime Befugnis oder einen berechtigten Anspruch, nicht bloß Macht oder Amtsgewalt. „Das Recht“ trifft diesen praktischen Sinn im Deutschen am besten.
- source_word: φαγεῖν
  choice: zu essen
  rationale: Der Infinitiv wird nach „das Recht haben“ idiomatisch mit „zu“ wiedergegeben.
- source_word: καὶ πεῖν
  choice: und zu trinken
  rationale: Die Wiederholung von „zu“ ist im Deutschen bei den koordinierten Infinitiven natürlich und sorgt für einen ausgewogenen Satzrhythmus.
theological_decisions:
- issue: Umfang des apostolischen Anspruchs im Kontext
  choice: Paulus spricht vom legitimen Recht der Apostel beziehungsweise Verkündiger auf Essen und Trinken, wahrscheinlich als materielle Versorgung durch die Menschen, denen sie dienen.
  alternative: Eine allgemeine Aussage über die gewöhnliche Freiheit jedes Menschen, zu essen und zu trinken.
  rationale: Der unmittelbare Zusammenhang von 1. Korinther 9 behandelt die Rechte des Paulus als Apostel, besonders seinen Anspruch auf Versorgung durch die Gemeinden. Die Hauptübersetzung lässt dies bewusst unausgesprochen und bewahrt so die knappe Form des griechischen Textes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem rhetorischem Ton. Die Frageform und ihre erwartete bejahende Antwort bleiben erhalten; die kontextuell wahrscheinliche materielle Versorgung wird nicht in den Haupttext hineingelesen.
