id: 1CO.9.25
reference: 1 Corinthians 9:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: de
  text: Jeder aber, der an einem Wettkampf teilnimmt, übt in allem Selbstbeherrschung. Sie tun es, um einen vergänglichen Siegeskranz[a] zu erhalten, wir aber einen unvergänglichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kranz“; das griechische Wort bezeichnet hier den Kranz, der dem Sieger eines sportlichen Wettkampfs verliehen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: Jeder
  rationale: Der generische Singular bezeichnet ausnahmslos jeden Wettkämpfer und lässt sich im Deutschen knapp und natürlich mit „Jeder“ wiedergeben.
- source_word: δὲ
  choice: aber
  rationale: Die Konjunktion markiert hier eine leichte Weiterführung beziehungsweise einen Bezug zum vorausgehenden Gedankengang; „aber“ bewahrt diese Verbindung, ohne ein nicht vorhandenes Zeitwort einzuführen.
- source_word: ὁ ἀγωνιζόμενος
  choice: der an einem Wettkampf teilnimmt
  rationale: Im unmittelbaren sportlichen Bild bezeichnet das Partizip jemanden, der sich im Wettkampf misst. Die Formulierung ist allgemein verständlich und wahrt den Wettkampfbezug.
- source_word: πάντα
  choice: in allem
  rationale: Der Akkusativ bezeichnet den umfassenden Bereich der Selbstbeherrschung, ohne ihn etwa auf Ernährung oder körperliches Training einzuengen.
- source_word: ἐγκρατεύεται
  choice: übt … Selbstbeherrschung
  rationale: Die Form beschreibt praktizierte, fortgesetzte Enthaltsamkeit beziehungsweise Selbstkontrolle; „übt Selbstbeherrschung“ gibt diesen aktiven Sinn natürlich wieder.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: Sie tun es
  rationale: Das Pronomen verweist auf die genannten Wettkämpfer zurück. Das im Griechischen mitgedachte Handeln wird für idiomatisches Deutsch aufgenommen; der folgende Gegensatz zu „wir aber“ bleibt deutlich.
- source_word: ἵνα
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion gibt den Zweck der Selbstbeherrschung klar wieder.
- source_word: φθαρτὸν
  choice: vergänglich
  rationale: „Vergänglich“ bildet mit „unvergänglich“ ein direktes, natürliches Gegensatzpaar und bezeichnet den zeitlich begrenzten Wert des Preises.
- source_word: στέφανον
  choice: Siegeskranz
  rationale: Im sportlichen Zusammenhang ist στέφανος der Kranz, der dem Sieger verliehen wurde. „Siegeskranz“ macht diesen historischen Bildgehalt klarer als das mehrdeutige deutsche „Krone“.
- source_word: λάβωσιν
  choice: zu erhalten
  rationale: Der Aorist Konjunktiv nach ἵνα bezeichnet das beabsichtigte Erlangen des Preises; „erhalten“ passt zur Verleihung eines Siegeskranzes.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: wir aber einen unvergänglichen
  rationale: Wie im Griechischen wird „Siegeskranz“ im zweiten Glied nicht wiederholt, sondern sinngemäß ergänzt. Die Gegenüberstellung der beiden Gruppen und der beiden Preise bleibt erhalten.
theological_decisions:
- issue: Bedeutung des unvergänglichen Preises
  choice: Das sportliche Bild bleibt als unvergänglicher Siegeskranz stehen, ohne seinen theologischen Bezug näher festzulegen.
  alternative: Den Siegeskranz ausdrücklich als ewiges Leben oder als himmlischen Lohn bestimmen.
  rationale: Der Vers selbst entfaltet die genaue Bedeutung des Bildes nicht. Eine ausdrückliche Gleichsetzung würde eine dogmatische Präzisierung in den Text eintragen, die hier nicht ausgesprochen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das sportliche Bild wird deutlich und ohne archaische Ausdrucksweise wiedergegeben. Der Satzbau wahrt die pointierte Gegenüberstellung zwischen den Wettkämpfern und „wir“.
