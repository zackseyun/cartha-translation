  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: de
  text: Denn obwohl ich von allen frei bin, habe ich mich allen zum Sklaven gemacht, um mehr Menschen zu gewinnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: frei
  rationale: Gibt den Gegensatz zur nachfolgenden Sklavereimetapher klar und natürlich wieder.
- source_word: ἐκ πάντων
  choice: von allen
  rationale: Bewahrt die knappe Formulierung und den rhetorischen Parallelismus mit πᾶσιν; gemeint ist Freiheit gegenüber allen Menschen.
- source_word: πᾶσιν
  choice: allen
  rationale: Bezeichnet die Menschen, denen Paulus sich freiwillig unterordnet, und entspricht im Deutschen prägnant dem vorangehenden „von allen“.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: habe ich mich … zum Sklaven gemacht
  rationale: Erhält die ausdrückliche Sklavereisprache und damit den zentralen Gegensatz zwischen Freiheit und freiwilliger Selbstunterordnung.
- source_word: ἵνα
  choice: um … zu
  rationale: Gibt den finalen Sinn im modernen Deutschen natürlich und eindeutig wieder.
- source_word: τοὺς πλείονας
  choice: mehr Menschen
  rationale: Drückt die größere Zahl von Personen idiomatisch aus, ohne die stärkere Deutung „so viele wie möglich“ einzutragen.
- source_word: κερδήσω
  choice: zu gewinnen
  rationale: Bewahrt die metaphorische Bedeutung des Gewinnens von Menschen im missionarischen Zusammenhang.
theological_decisions:
- issue: Wiedergabe der Sklavereisprache in δουλόω
  choice: zum Sklaven gemacht
  alternative: zum Diener gemacht
  rationale: Der ausdrückliche Gegensatz zu „frei“ trägt die Aussage des Verses. „Diener“ würde die Schärfe der freiwilligen Selbstunterordnung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakte Gegenüberstellung „von allen frei“ / „allen zum Sklaven“ bewahrt die rhetorische Spannung des Griechischen. Das konzessive Partizip wird natürlich mit „obwohl“ wiedergegeben.
