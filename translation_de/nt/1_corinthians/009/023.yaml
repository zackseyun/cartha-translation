  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: de
  text: Doch all das tue ich um der guten Nachricht willen[a], damit ich gemeinsam mit anderen an ihr Anteil gewinne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um des Evangeliums willen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit ich an ihr teilhabe“ oder „damit ich ihr Mitteilhaber werde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: das alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend alles zuvor beschriebene Handeln; „das alles“ stellt im Deutschen den Kontextbezug natürlich her.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier einen milden Gegensatz beziehungsweise eine Weiterführung mit adversativer Färbung.
- source_word: ποιῶ
  choice: tue ich
  rationale: Das Präsens beschreibt Paulus’ fortdauerndes beziehungsweise gewöhnliches Handeln; die deutsche Präsensform gibt dies angemessen wieder.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: um der guten Nachricht willen
  rationale: διά mit Akkusativ bezeichnet hier Beweggrund oder Zielorientierung. Die Wendung bewahrt diesen Sinn; „gute Nachricht“ gibt εὐαγγέλιον verständlich wieder, ohne den traditionellen Ausdruck „Evangelium“ auszuschließen.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die finale Bedeutung der ἵνα-Konstruktion idiomatisch wieder.
- source_word: συγκοινωνὸς αὐτοῦ γένωμαι
  choice: damit ich an ihr teilhabe
  rationale: συγκοινωνός bezeichnet jemanden, der gemeinsam mit anderen Anteil an etwas hat. Die verbale deutsche Form ist natürlicher als „Mitteilhaber werde“ und lässt offen, ob der Anteil vor allem die Segnungen, die Ausbreitung oder den Dienst der guten Nachricht betrifft.
theological_decisions:
- issue: Art der Teilhabe an der guten Nachricht
  choice: Die Übersetzung lässt den Gegenstand und Umfang der Teilhabe offen.
  alternative: „damit ich ihr Mitteilhaber werde“ beziehungsweise eine ausdrückliche Deutung als Anteil an ihren Segnungen oder an ihrer Verbreitung
  rationale: Der griechische Ausdruck συγκοινωνὸς αὐτοῦ kann eine gemeinsame Beteiligung an der guten Nachricht, ihren Segnungen oder ihrem Auftrag bezeichnen. Der Text soll diese theologische und semantische Weite nicht auf eine bestimmte Lehrdeutung verengen.
- issue: Bezug von αὐτοῦ
  choice: Das Pronomen wird auf εὐαγγέλιον bezogen und mit „an ihr“ wiedergegeben.
  alternative: Ein persönlicher Bezug im Sinn von „an ihm“
  rationale: Der unmittelbare sachliche Bezug auf εὐαγγέλιον ist syntaktisch und kontextuell am naheliegendsten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das alles“ knüpft flüssig an den vorausgehenden Gedankengang an. Die traditionelle Wiedergabe „Evangelium“ und die stärker formale Fassung des Schlusses werden in den Fußnoten dokumentiert.
