revisions:
- from: Doch das alles tue ich um der guten Nachricht willen[a], damit ich an ihr teilhabe[b].
  to: Doch all das tue ich um der guten Nachricht willen[a], damit ich gemeinsam mit anderen an ihr Anteil gewinne[b].
  rationale: Die Revision bewahrt den umfassenden Bezug von πάντα und die offene, nicht doktrinär verengte Teilhabe am Evangelium. Zugleich bringt sie sowohl das Werden bzw. Anteilgewinnen (γένωμαι) als auch den gemeinsamen Charakter von συγκοινωνός zum Ausdruck. Die Fußnoten bleiben an ihren Ankern und dokumentieren die idiomatischere sowie die formnähere Alternative.
