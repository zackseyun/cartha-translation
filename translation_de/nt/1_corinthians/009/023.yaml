    issue: Der Entstehungs- bzw. Erwerbsaspekt von γένωμαι fehlt.
    rationale: „Damit ich an ihr teilhabe“ formuliert einen bestehenden Zustand. Das aoristische γένωμαι im finalen Nebensatz zielt darauf, dass Paulus zu einem Mitteilhabenden wird bzw. Anteil gewinnt.
  - severity: low
    issue: Das Mit-Element von συγκοινωνός ist im Haupttext nicht erkennbar.
    rationale: Teilhabe allein gibt den Grundgedanken wieder, lässt aber das Präfix συν- unmarkiert. „Gemeinsam mit anderen“ macht diesen Aspekt ohne unnötige theologische Präzisierung sichtbar.
