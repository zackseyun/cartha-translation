source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: de
  text: Für die Juden wurde ich wie ein Jude, um Juden zu gewinnen[a]; für die, die unter dem Gesetz stehen[b], wurde ich wie einer, der unter dem Gesetz steht – obwohl ich selbst nicht unter dem Gesetz stehe –, um die zu gewinnen, die unter dem Gesetz stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann auch „als Gewinn erlangen“ bedeuten; hier ist „gewinnen“ im Blick auf Menschen gemeint.
    reason: lexical_alternative
  - marker: b
    text: Mit „dem Gesetz“ ist hier sehr wahrscheinlich das mosaische Gesetz gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: bin ich ... geworden
  rationale: Das Aorist von γίνομαι beschreibt hier, dass Paulus sich im Umgang mit verschiedenen Gruppen auf deren Lebensweise einstellte. „Bin ... geworden“ gibt die Formulierung direkt und natürlich wieder.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: Den Juden ... wie ein Jude
  rationale: Der Dativ bezeichnet die Gruppe, auf die Paulus sich einstellt; ὡς behält mit „wie“ seine vergleichende Kraft. So wird nicht unterstellt, Paulus habe seine jüdische Herkunft abgelegt oder neu angenommen.
- source_word: ἵνα ... κερδήσω
  choice: um ... zu gewinnen
  rationale: κερδαίνω kann wörtlich „Gewinn erzielen“ oder „gewinnen“ bedeuten und bezeichnet hier im missionarischen Zusammenhang das Gewinnen von Menschen.
- source_word: τοῖς ὑπὸ νόμον
  choice: denen, die unter dem Gesetz stehen
  rationale: Die substantivierte Präpositionalgruppe wird im Deutschen am klarsten als Relativsatz wiedergegeben. „Unter dem Gesetz stehen“ ist idiomatisch und bewahrt das Bild rechtlicher Unterstellung.
- source_word: ὡς ὑπὸ νόμον
  choice: wie einer, der unter dem Gesetz steht
  rationale: Die Ergänzung „einer, der“ macht die knappe griechische Wendung auf Deutsch verständlich und hält zugleich die Parallele zu „wie ein Jude“ fest.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: obwohl ich selbst nicht unter dem Gesetz stehe
  rationale: Das präsentische Partizip formuliert einen gleichzeitigen, kontrastierenden Vorbehalt. Das Präsens bewahrt die Aussage über Paulus’ eigenen gegenwärtigen Stand.
- source_word: αὐτός
  choice: ich selbst
  rationale: „Selbst“ erhält die Hervorhebung des griechischen αὐτός.
- source_word: νόμος
  choice: das Gesetz
  rationale: Im Zusammenhang mit den Juden ist wahrscheinlich das mosaische Gesetz gemeint. Die Hauptübersetzung bewahrt jedoch die weniger explizite Formulierung des griechischen Textes.
theological_decisions:
- issue: Paulus’ Aussage, er stehe nicht unter dem Gesetz
  choice: Die Aussage wird ohne erklärenden Zusatz als „obwohl ich selbst nicht unter dem Gesetz stehe“ wiedergegeben.
  alternative: „obwohl ich selbst nicht unter dem Gesetz des Mose stehe“ oder eine Ergänzung aus Vers 21
  rationale: Der Vers selbst sagt nur, dass Paulus nicht unter dem Gesetz steht. Eine nähere Bestimmung oder Harmonisierung mit dem folgenden Vers würde die im Ausgangstext bestehende theologische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „unter dem Gesetz stehen“ macht die griechische Struktur verständlich, ohne sie theologisch auszudeuten. Der Gedankenstrich kennzeichnet den parenthetischen Vorbehalt.
