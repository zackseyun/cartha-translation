review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die Struktur und den Sinn des Griechischen präzise wieder: Die concessive Gegenüberstellung εἰ ... οὐκ ... ἀλλά γε wird mit „Wenn ... kein Apostel bin, so bin ich es doch ganz gewiss ...“ angemessen abgebildet. „für andere“ gibt den relationalen Dativ ἄλλοις idiomatisch wieder, ohne die rhetorische Offenheit des Satzes einzuengen. „Siegel meines Apostelamtes“ bewahrt sowohl σφραγίς als Bild der Beglaubigung als auch ἀποστολή als apostolische Beauftragung bzw. Stellung. „im Herrn“ entspricht ἐν κυρίῳ wörtlich und lässt den genauen syntaktischen Bezug angemessen offen.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die leicht gehobene Konstruktion „so bin ich es doch ganz gewiss“ passt zum argumentativen Register des Paulus und wirkt nicht unnatürlich. Die Satzgliederung mit Semikolon ist klar.
  terminology: „Apostel“, „Apostelamt“, „Siegel“ und „im Herrn“ sind für den paulinischen Kontext sachgerecht und konsistent. Die Fußnote erläutert die metaphorische Evidenzfunktion von „Siegel“, ohne den Text zu ersetzen oder eine theologische Deutung vorzuschreiben.
