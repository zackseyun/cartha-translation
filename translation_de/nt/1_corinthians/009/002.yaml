id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: de
  text: Wenn ich für andere kein Apostel bin, so bin ich es doch ganz gewiss für euch; denn das Siegel[a] meines Apostelamtes seid ihr im Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bestätigung“ oder „Echtheitszeichen“. Im Griechischen steht „Siegel“ – ein Bild für etwas, das die Echtheit bestätigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: Apostel
  rationale: Bei der Selbstbezeichnung des Paulus meint das Wort seine besondere Beauftragung und nicht nur einen Boten im allgemeinen Sinn.
- source_word: ἀλλά γε
  choice: so bin ich es doch ganz gewiss
  rationale: Die Formulierung gibt sowohl den Gegensatz als auch die verstärkende Wirkung von γε in natürlichem Deutsch wieder.
- source_word: σφραγίς
  choice: Siegel
  rationale: Das Bild eines Siegels, das Echtheit bestätigt, bleibt erhalten; der Zusammenhang erschließt zugleich seine beweiskräftige Funktion.
- source_word: ἀποστολή
  choice: Apostelamt
  rationale: Hier bezeichnet das Wort die apostolische Beauftragung und Tätigkeit des Paulus. „Apostelamt“ ist im Deutschen knapp und verständlich, ohne das Bild des Siegels aufzugeben.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die prägnante paulinische Wendung bleibt erhalten und legt nicht einseitig fest, ob sie besonders die Existenz der Gemeinde oder die gesamte Aussage näher bestimmt.
- source_word: ἄλλοις
  choice: für andere
  rationale: Der Dativ bezeichnet hier die Beziehung, in der Paulus als Apostel anerkannt ist beziehungsweise wirkt; „für andere“ ist dafür idiomatisches Deutsch.
theological_decisions:
- issue: Tragweite der Aussage über das Apostelsein des Paulus
  choice: Paulus räumt rhetorisch ein, dass sein Apostelsein im Blick auf andere bestritten werden mag, behauptet es gegenüber den Korinthern jedoch nachdrücklich.
  alternative: Paulus beschränkt sein Apostelamt tatsächlich auf die Gemeinde in Korinth.
  rationale: Der argumentative Zusammenhang ist eine Verteidigung seines Apostelamtes. Die korinthische Gemeinde gilt als dessen Bestätigung, nicht als Grenze seiner Beauftragung.
- issue: Bezug von „im Herrn“
  choice: Die griechische Stellung wird weitgehend bewahrt, sodass die Wendung die Korinther als Siegel innerhalb ihrer Beziehung zum Herrn kennzeichnet und zugleich zur Gesamtaussage gehören kann.
  alternative: „Im Herrn“ bezeichnet ausschließlich, dass der Herr Paulus zum Apostel gemacht hat.
  rationale: ἐν κυρίῳ bezeichnet hier eher den Bereich der Christusbeziehung als bloß die handelnde Ursache; eine engere syntaktische Festlegung wäre unnötig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Gegenüberstellung bleibt hörbar; die paulinische Wendung „im Herrn“ und das konkrete Siegelbild werden nicht paraphrasierend aufgelöst.
