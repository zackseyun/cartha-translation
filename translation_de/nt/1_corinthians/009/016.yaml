source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: de
  text: Denn wenn ich das Evangelium verkünde[a], habe ich keinen Grund, mich zu rühmen; denn eine Notwendigkeit liegt auf mir. Denn wehe mir, wenn ich das Evangelium nicht verkünde!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die gute Nachricht verkünde«; so auch am Ende des Verses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: das Evangelium verkünde
  rationale: Das Verb bezeichnet das Verkünden einer guten Botschaft. Im paulinischen Zusammenhang ist das Evangelium als Inhalt mitgemeint; die gewählte Formulierung ist im Deutschen natürlich und bewahrt den öffentlichen Verkündigungscharakter. Beide Vorkommen werden einheitlich wiedergegeben.
- source_word: καύχημα
  choice: Grund, mich zu rühmen
  rationale: Das Substantiv bezeichnet hier einen Anlass oder eine Grundlage des Rühmens. Die Formulierung macht deutlich, dass Paulus nicht bloß das Reden über eigene Leistungen, sondern einen berechtigten Grund dazu verneint.
- source_word: ἀνάγκη
  choice: Notwendigkeit
  rationale: Das Wort bezeichnet eine auferlegte Notwendigkeit oder einen Zwang. „Notwendigkeit“ wahrt die Offenheit darüber, welcher Art und Herkunft dieser Druck ist.
- source_word: ἐπίκειται
  choice: liegt auf mir
  rationale: Das Verb beschreibt etwas, das auf jemandem liegt oder ihn bedrängt. Die Wendung vermittelt Last und Verpflichtung, ohne deren Ursprung näher auszudeuten.
- source_word: οὐαί
  choice: Wehe
  rationale: „Wehe“ bewahrt den ernsten, prophetisch klingenden Ausdruck drohenden Unheils und ist gegenüber dem bloß emotionalen „Ach“ sachlich angemessener.
- source_word: ἐὰν μή
  choice: wenn … nicht
  rationale: Die direkte Bedingungsform gibt die griechische Konstruktion klar und natürlich wieder.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ erhält die begründende Verknüpfung mit dem vorausgehenden Gedankengang und innerhalb des Satzes.
theological_decisions:
- issue: Art und Ursprung von Paulus’ Verpflichtung zur Verkündigung
  choice: „eine Notwendigkeit liegt auf mir“
  alternative: „ich stehe unter Zwang“ oder „Gott hat mir diese Aufgabe auferlegt“
  rationale: Der griechische Text sagt, dass eine Notwendigkeit auf Paulus liegt, benennt in diesem Vers aber weder deren Ursprung noch ihre genaue Art. Die Übersetzung bewahrt diese Offenheit und trägt keine weitergehende theologische Erklärung in den Wortlaut ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das Evangelium verkünden“ ist kirchlich vertraut, zugleich allgemein verständlich und näher am Verkündigungsverb als das stärker institutionell geprägte „predigen“. Die Wiederholung des Ausdrucks und das zweimalige begründende „denn“ bleiben erhalten.
