  text: Ἡ ἐμὴ ἀπολογία τοῖς ἐμὲ ἀνακρίνουσίν ⸂ἐστιν αὕτη⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/003.yaml
  text: This is my defense to those who examine me[a].
translation:
  language: de
  text: Das ist meine Verteidigung gegenüber denen, die mich prüfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist meine Verteidigung vor denen, die über mich urteilen.“'
    reason: 'Lexikalische und syntaktische Alternative: ἀνακρίνω kann hier stärker als „beurteilen“ verstanden werden, und der Dativ kann mit „vor“ wiedergegeben werden.'
lexical_decisions:
- source_word: ἀπολογία
  choice: Verteidigung
  rationale: Das Wort bezeichnet hier Paulus’ Erwiderung auf die kritische Prüfung seines apostolischen Rechts und Verhaltens. „Verteidigung“ gibt den forensischen Anklang wieder, ohne ein Schuldeingeständnis nahezulegen.
- source_word: ἀνακρίνουσίν
  choice: prüfen
  rationale: Das Partizip bezeichnet eine kritische Untersuchung oder Beurteilung. „Prüfen“ bewahrt diese Bedeutungsbreite und klingt weniger nach einem abschließenden Urteil als „richten“.
- source_word: Ἡ ἐμὴ
  choice: meine
  rationale: Das Possessivpronomen wird im Deutschen natürlich und ausreichend mit „meine“ wiedergegeben; „meine eigene“ würde die Betonung unnötig verstärken.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: gegenüber denen, die mich prüfen
  rationale: Der Dativ bezeichnet die Personen, vor beziehungsweise gegenüber denen Paulus seine Verteidigung vorbringt. „Gegenüber“ ist im Deutschen bei „Verteidigung“ idiomatischer als ein wörtliches „zu“.
- source_word: ἐστιν αὕτη
  choice: Das ist
  rationale: Die deutsche Wortfolge gibt die identifizierende Aussage natürlich wieder und lässt wie der griechische Satz offen, ob auf das Vorhergehende oder auf das Folgende verwiesen wird.
theological_decisions:
- issue: Charakter der Prüfung durch Paulus’ Kritiker
  choice: prüfen
  alternative: richten / verhören
  rationale: Der Text beschreibt kritische Begutachtung, legt aber weder zwingend ein endgültiges Gerichtsurteil noch ein förmliches Verhör fest. Die Übersetzung hält diese Spannung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Verteidigung“ bewahrt den sachlich-forensischen Charakter; „prüfen“ vermeidet eine konfessionell oder juristisch überpräzisierte Deutung.
