  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: de
  text: Ich aber habe von alledem keinen Gebrauch gemacht.[a] Das habe ich jedoch nicht geschrieben, damit es bei mir so geschieht. Denn lieber würde ich sterben als—mein Rühmen wird niemand zunichtemachen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem Zusammenhang entsprechend ausdrücklicher: „von keinem dieser Rechte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen bricht der Satz nach „als—“ ab und setzt dann neu ein: „Mein Rühmen wird niemand zunichtemachen.“ Sinngemäß geglättet: „Lieber würde ich sterben, als mein Rühmen zunichtemachen zu lassen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: habe … Gebrauch gemacht
  rationale: Das Perfekt bezeichnet, dass Paulus die zuvor erörterten Möglichkeiten beziehungsweise Rechte nicht in Anspruch genommen hat. Die deutsche Wendung ist natürlich und vermeidet den möglichen negativen Beiklang von „ausnutzen“.
- source_word: οὐδενὶ τούτων
  choice: von alledem keinen
  rationale: Die Formulierung gibt das wörtliche „von keinem dieser Dinge“ idiomatisch wieder, ohne den kontextuellen Bezug auf die zuvor genannten Rechte bereits in den Haupttext einzutragen.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: damit es auch bei mir so geschieht
  rationale: Die komprimierte griechische Wendung meint, dass Paulus mit dem Geschriebenen keine entsprechende Behandlung für den eigenen Fall herbeiführen will. „Geschieht“ bewahrt die relativ offene Ausdrucksweise des Originals.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: Denn lieber würde ich sterben
  rationale: Diese natürliche deutsche Präferenzformulierung gibt den Sinn von καλὸν … μᾶλλον wieder und bewahrt die nachdrückliche Entschlossenheit.
- source_word: τὸ καύχημά μου
  choice: meinen Ruhm
  rationale: καύχημα kann den Gegenstand oder Grund des Rühmens bezeichnen. „Meinen Ruhm“ ist knapp, traditionsverständlich und lässt die genaue Nuance offen; gemeint ist im Zusammenhang Paulus’ Grund, sich zu rühmen.
- source_word: κενώσει
  choice: wird … zunichtemachen
  rationale: Das Verb bedeutet wörtlich „leeren“ und metaphorisch „wirkungslos, inhaltslos oder nichtig machen“. „Zunichtemachen“ gibt die Metapher im Deutschen verständlich wieder, ohne eine bestimmte handelnde Ursache zu ergänzen.
theological_decisions:
- issue: Abgebrochene Satzkonstruktion nach ἤ („als“)
  choice: 'Der Gedankenabbruch wird durch einen Gedankenstrich sichtbar bewahrt: „lieber würde ich sterben als—meinen Ruhm wird niemand zunichtemachen.“'
  alternative: 'Glättend könnte man übersetzen: „Lieber würde ich sterben, als mir von jemandem meinen Ruhm zunichtemachen zu lassen.“'
  rationale: Der griechische Satz bricht nach ἤ ab und setzt mit einer neuen Konstruktion ein. Die unregelmäßige Form trägt zur rhetorischen Eindringlichkeit bei und sollte nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von alledem Gebrauch machen“ und „auch bei mir so geschieht“ sind allgemein verständlich; der auffällige Gedankenabbruch des Ausgangstextes bleibt bewusst erhalten.
