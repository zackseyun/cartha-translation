  to: Ich aber habe von alledem keinen Gebrauch gemacht.[a] Das habe ich jedoch nicht geschrieben, damit es bei mir so geschieht. Denn lieber würde ich sterben als—mein Rühmen wird niemand zunichtemachen.[b]
  rationale: Die Revision beseitigt die unmarkierte Zusatznuance „auch“ und ersetzt „Ruhm“ durch „Rühmen“, damit die Bedeutung von καύχημα im unmittelbaren Kontext nicht zu Ansehen oder Berühmtheit verschoben wird. Der rhetorische Gedankenabbruch, die Zukunftsaussage und die Fußnotenanker bleiben erhalten.
