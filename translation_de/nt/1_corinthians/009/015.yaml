    rationale: „Ruhm“ bezeichnet im heutigen Deutsch vor allem Ansehen oder Berühmtheit. Im Kontext meint Paulus sein Rühmen beziehungsweise dessen Grundlage. „Mein Rühmen“ wahrt diese Bedeutung ohne den konkreten Grund ergänzend festzulegen.
  - severity: low
    issue: „auch bei mir“ für ἐν ἐμοί
    rationale: Das „auch“ kann im Deutschen eine zusätzliche Vergleichsnuance nahelegen, die der griechische Text nicht ausdrücklich setzt. „bei mir“ genügt.
