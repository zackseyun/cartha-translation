    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Darum
  rationale: Kennzeichnet den folgernden Übergang von der vorangehenden Wettkampfmetapher zu Paulus’ persönlicher Anwendung; im Deutschen gibt „Darum“ die Schlussfolgerung natürlich und knapp wieder.
- source_word: οὕτως … οὕτως
  choice: so … so, dass
  rationale: Die Wiederholung verweist jeweils auf die Art und Weise. Die deutsche Satzgestaltung bewahrt die parallele Bewegung, ohne unnatürlich wörtlich zu klingen.
- source_word: τρέχω
  choice: laufe ich
  rationale: Bewahrt die Laufmetapher und das Präsens als anschauliche Beschreibung von Paulus’ Handeln.
- source_word: ἀδήλως
  choice: ohne klares Ziel
  rationale: Das Adverb kann fehlende Klarheit oder fehlende bestimmte Ausrichtung bezeichnen. Innerhalb des Laufbildes drückt die Formulierung verständlich aus, dass Paulus zielgerichtet läuft.
- source_word: πυκτεύω
  choice: ich kämpfe mit den Fäusten
  rationale: Bezeichnet spezifisch den Faustkampf beziehungsweise das Boxen. Die Formulierung ist im modernen Deutsch natürlicher und würdevoller als das verbale „ich boxe“.
- source_word: ἀέρα δέρων
  choice: in die Luft schlage
  rationale: Gibt das konkrete Bild wirkungsloser Schläge wieder und entspricht einer geläufigen deutschen Wendung.
