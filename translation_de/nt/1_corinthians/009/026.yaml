  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: de
  text: Darum laufe ich so, nicht ohne klares Ziel[a]; so kämpfe ich mit den Fäusten, nicht als schlüge ich in die Luft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
