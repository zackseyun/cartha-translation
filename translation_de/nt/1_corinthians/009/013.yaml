id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: de
  text: Wisst ihr nicht, dass diejenigen, die den heiligen Dienst verrichten, von dem essen, was aus dem Tempel kommt,[a] und dass diejenigen, die am Altar Dienst tun, ihren Anteil vom Altar erhalten?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »diejenigen, die mit den heiligen Dingen arbeiten, essen die Dinge aus dem Tempel«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »teilen mit dem Altar«; gemeint ist, dass sie einen Anteil an den dort dargebrachten Opfern erhalten.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Wisst ihr nicht
  rationale: Bewahrt die für Paulus typische rhetorische Frage und klingt zugleich natürlich und würdig.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: diejenigen, die den heiligen Dienst verrichten
  rationale: Gibt den Bezug auf kultische Tätigkeiten wieder, ohne den Ausdruck auf einen bloßen Arbeitsort zu verengen.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: von dem essen, was aus dem Tempel kommt
  rationale: Bewahrt sowohl das konkrete Verb »essen« als auch die Herkunftsangabe und ergänzt nur das im Griechischen substantivierte Neutrum idiomatisch.
- source_word: ἱεροῦ
  choice: Tempel
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise den Tempelbezirk und nicht spezifisch das innere Heiligtum.
- source_word: οἱ τῷ θυσιαστηρίῳ παρεδρεύοντες
  choice: diejenigen, die am Altar Dienst tun
  rationale: Vermittelt das stationierte Dienen am Altar natürlicher als eine räumlich-wörtliche Wiedergabe wie »danebensitzen«.
- source_word: συμμερίζονται
  choice: ihren Anteil … erhalten
  rationale: Drückt die Beteiligung an einer zugeteilten Portion verständlich aus; die ungewöhnlichere wörtliche Konstruktion »mit dem Altar teilen« bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Kultischer Dienst als Grundlage materieller Versorgung
  choice: Die Formulierung zeigt, dass Tempel- und Altardiener aus dem Bereich ihres heiligen Dienstes Nahrung beziehungsweise einen Anteil erhalten.
  alternative: Der letzte Satzteil kann formnäher als »mit dem Altar teilen« wiedergegeben werden.
  rationale: Paulus begründet eine Analogie materieller Versorgung aus heiligem Dienst. Die Übersetzung macht diesen Zusammenhang verständlich, ohne spätere kirchliche Amtsstrukturen oder eine bestimmte Opfertheologie einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die parallele Satzstruktur des griechischen Textes bleibt erhalten; kultische Fachsprache wird sparsam und klar verwendet.
