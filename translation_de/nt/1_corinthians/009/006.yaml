  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: de
  text: Oder haben nur ich und Barnabas nicht das Recht, auf Arbeit zu verzichten?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht zu arbeiten“. Im Zusammenhang geht es um das Recht, auf eigene Arbeit zum Lebensunterhalt zu verzichten und im Dienst unterstützt zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet eine weitere rhetorische Alternative in der Argumentation ein und bewahrt den knappen Anschluss des Griechischen.
- source_word: μόνος
  choice: nur
  rationale: Bezieht sich auf das verbundene Subjekt „ich und Barnabas“ und hebt dessen Ausschließlichkeit hervor.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: ich und Barnabas
  rationale: Bewahrt die griechische Reihenfolge; sie ist auch im Deutschen natürlich und verständlich.
- source_word: οὐκ ἔχομεν
  choice: haben … nicht
  rationale: Gibt die verneinte Präsensform in der rhetorischen Frage direkt und idiomatisch wieder.
- source_word: ἐξουσίαν
  choice: das Recht
  rationale: Bezeichnet hier einen legitimen apostolischen Anspruch beziehungsweise eine Befugnis, nicht primär Herrschaftsgewalt.
- source_word: μὴ ἐργάζεσθαι
  choice: auf Erwerbsarbeit zu verzichten
  rationale: Macht im Kontext deutlich, dass es um den Verzicht auf Arbeit zum eigenen Lebensunterhalt geht, ohne die Aussage zu einer generellen Arbeitsverweigerung auszuweiten.
theological_decisions:
- issue: Bedeutung von ἐξουσία im Zusammenhang
  choice: Paulus spricht vom apostolischen Recht, auf Erwerbsarbeit zum eigenen Unterhalt zu verzichten und Unterstützung zu erhalten.
  alternative: Paulus spricht allgemein von Vollmacht oder Freiheit, ohne besonderen Bezug auf materielle Unterstützung.
  rationale: Der unmittelbare Zusammenhang behandelt die Rechte der Apostel, besonders ihren Anspruch auf Lebensunterhalt, sowie den freiwilligen Verzicht darauf. Die Übersetzung lässt diesen Zusammenhang erkennen, ohne die materielle Unterstützung ausdrücklich in den Vers einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erwerbsarbeit“ verhindert das mögliche Missverständnis, Paulus beanspruche ein Recht auf völlige Untätigkeit; die Fußnote bewahrt zugleich die knappere, formal nähere Wiedergabe.
