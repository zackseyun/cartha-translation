revisions:
- from: Wenn wir für euch das Geistliche gesät haben, ist es dann zu viel, wenn wir von euch das Irdische[a] ernten?
  to: Wenn wir bei euch das Geistliche gesät haben, ist es dann zu viel verlangt, von euch materielle Güter[a] zu ernten?
  rationale: Die Revision stellt den Bezug von ὑμῖν mit „bei euch“ genauer dar und setzt für τὰ σαρκικά die kontextuell klare Wiedergabe „materielle Güter“ in den Haupttext. Die alternative, stärker kontrastierende Formulierung „das Irdische“ bleibt in der Fußnote erhalten. Bedeutung, rhetorische Form und Metaphorik des griechischen Textes bleiben gewahrt.
