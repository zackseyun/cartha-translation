review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die rhetorische Frage und das Bildfeld von Säen und Ernten im Wesentlichen. „Für euch“ schwächt jedoch den lokalen bzw. auf die Gemeinde bezogenen Dativ ὑμῖν ab; „bei euch“ bildet „unter euch“ angemessener ab. τὰ σαρκικά meint im Kontext konkrete materielle Versorgung; „das Irdische“ kann im Deutschen unnötig abstrakt oder weltabgewandt klingen.
  naturalness: Der Satz ist gut verständlich und hat ein angemessen würdiges modernes Register. „Ist es dann zu viel verlangt, von euch materielle Güter zu ernten?“ ist idiomatischer und konkretisiert den im Kontext gemeinten Anspruch auf Versorgung, ohne das landwirtschaftliche Bild aufzugeben.
  terminology: „Das Geistliche“ wahrt die offene substantivische Form von τὰ πνευματικά. „Materielle Güter“ gibt τὰ σαρκικά in diesem Kontext präzise wieder, ohne die moralisch missverständliche Bedeutung „fleischlich“ nahezulegen. Die Fußnote hält „das Irdische“ als mögliche, aber weniger konkrete Alternative fest.
  issues:
  - severity: medium
    issue: ὑμῖν mit „für euch“ wiedergegeben
    rationale: Der Dativ bezeichnet beim Säen hier die Gemeinde als den Bereich bzw. die Empfänger des Dienstes. „Bei euch“ entspricht dem Sinn von „unter euch“ und vermeidet die mögliche Lesart eines bloßen Handelns zu ihren Gunsten.
  - severity: medium
    issue: τὰ σαρκικά als „das Irdische“ im Haupttext
    rationale: Obwohl die Wendung den Kontrast aufnimmt, ist sie im heutigen Deutsch abstrakter und potenziell stärker religiös aufgeladen als der Kontext erlaubt. Gemeint sind Güter für den materiellen bzw. körperlichen Lebensunterhalt.
