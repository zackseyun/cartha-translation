  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: de
  text: Wenn wir bei euch das Geistliche gesät haben, ist es dann zu viel verlangt, von euch materielle Güter[a] zu ernten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Irdische“. Gemeint sind Güter für das körperliche oder materielle Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: das Geistliche
  rationale: Das substantivierte Neutrum bewahrt die breite Bedeutung geistlicher Güter beziehungsweise geistlichen Wirkens, ohne den Gegenstand unnötig einzuengen.
- source_word: ἐσπείραμεν
  choice: gesät haben
  rationale: Das Perfekt im deutschen Konditionalsatz gibt die vorausgegangene, weiterhin relevante Tätigkeit natürlich wieder und erhält das Bild vom Säen.
- source_word: ὑμῖν
  choice: für euch
  rationale: Der Dativ bezeichnet hier die Empfänger beziehungsweise Nutznießer des geistlichen Säens. „Für euch“ ist im Deutschen natürlich und lässt die Beziehung offen genug.
- source_word: μέγα
  choice: zu viel
  rationale: In der rhetorischen Frage bezeichnet μέγα etwas Übermäßiges oder Unzumutbares; „zu viel“ gibt diesen Sinn idiomatisch wieder.
- source_word: τὰ σαρκικὰ
  choice: das Irdische
  rationale: Gemeint sind Güter des gewöhnlichen körperlich-materiellen Lebens, besonders der Lebensunterhalt. „Das Irdische“ wahrt den Gegensatz zum Geistlichen, ohne fälschlich sündhaftes Verhalten anzudeuten.
- source_word: θερίσομεν
  choice: ernten
  rationale: Der Ausdruck führt das landwirtschaftliche Bild fort. Die deutsche Konstruktion mit „wenn“ gibt die erwartete beziehungsweise mögliche künftige Ernte natürlich wieder.
- source_word: ὑμῶν
  choice: von euch
  rationale: Der Genitiv nach θερίζω bezeichnet hier die Quelle der empfangenen Unterstützung; im Deutschen wird dies natürlich mit „von euch“ ausgedrückt.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen trägt den Kontrast zwischen dem Dienst der Apostel und ihrem Anspruch auf Unterstützung. Die Wiederholung von „wir“ erhält diese Betonung.
theological_decisions:
- issue: Bedeutung von τὰ σαρκικὰ im Gegensatz zu τὰ πνευματικὰ
  choice: Güter des irdischen, körperlich-materiellen Lebens, insbesondere Unterstützung zum Lebensunterhalt
  alternative: „das Fleischliche“ im moralisch negativen Sinn
  rationale: Der Zusammenhang behandelt das Recht der Apostel auf materielle Versorgung. Der Gegensatz betrifft geistlichen Dienst und zeitliche beziehungsweise materielle Unterstützung, nicht heiliges gegenüber sündhaftem Verhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivierten Ausdrücke „das Geistliche“ und „das Irdische“ erhalten die knappe Gegenüberstellung und die Bildsprache des griechischen Textes; die Fußnote verdeutlicht den materiellen Sinn von „das Irdische“.
