id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: de
  text: Haben wir nicht das Recht, eine gläubige Ehefrau[a] mitzunehmen, wie auch die übrigen Apostel, die Brüder des Herrn und Kephas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Schwester, eine Ehefrau“; gemeint ist eine Ehefrau, die zugleich eine Schwester im Glauben ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: das Recht
  rationale: Im Zusammenhang bezeichnet das Wort einen legitimen apostolischen Anspruch, nicht abstrakte Autorität; „das Recht“ ist im Deutschen natürlich und präzise.
- source_word: ἀδελφὴν γυναῖκα
  choice: eine Schwester als Ehefrau
  rationale: 'Die Wiedergabe bewahrt beide Bestandteile der ungewöhnlichen griechischen Fügung: Gemeint ist eine Ehefrau, die zugleich Schwester im Glauben ist, ohne dies im Haupttext stärker auszudeuten.'
- source_word: περιάγειν
  choice: mitzunehmen
  rationale: Der Infinitiv bezeichnet hier das Mitnehmen auf Reisen; „mitzunehmen“ ist im Deutschen idiomatisch und passt zum praktischen Zusammenhang.
- source_word: ὡς καὶ
  choice: wie auch
  rationale: Die Formulierung bewahrt sowohl den Vergleich als auch dessen additiven Charakter.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: die übrigen Apostel
  rationale: „Die übrigen“ gibt λοιποί genau wieder und grenzt die genannten Personen von anderen Angehörigen derselben Gruppe ab.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: die Brüder des Herrn
  rationale: Die direkte Wiedergabe wahrt den griechischen Wortlaut, ohne die genaue Art des verwandtschaftlichen Verhältnisses festzulegen.
- source_word: Κηφᾶς
  choice: Kephas
  rationale: Der im griechischen Text verwendete Namensform wird beibehalten, statt sie durch „Petrus“ zu ersetzen.
theological_decisions:
- issue: Bedeutung von „die Brüder des Herrn“
  choice: Die Wendung wird unmittelbar als „die Brüder des Herrn“ übersetzt.
  alternative: Leibliche Brüder Jesu, Stiefbrüder oder nähere Verwandte.
  rationale: Der griechische Wortlaut bezeichnet sie als Brüder des Herrn, entscheidet aber nicht ausdrücklich spätere Debatten über das genaue Verwandtschaftsverhältnis.
- issue: Sinn von ἀδελφὴν γυναῖκα
  choice: „eine Schwester als Ehefrau“
  alternative: „eine gläubige Ehefrau“ oder „eine christliche Ehefrau“
  rationale: Die formnahe Wiedergabe erhält beide Elemente und die ungewöhnliche Ausdrucksweise des Originals. Die Fußnote erklärt den im Kontext naheliegenden Sinn, ohne die Formulierung im Haupttext stillschweigend zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird mit „etwa nicht“ natürlich wiedergegeben. Die ungewöhnliche griechische Fügung bleibt im Haupttext erkennbar und wird durch eine knappe Fußnote erläutert.
