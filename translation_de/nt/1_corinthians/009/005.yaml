  verdict: revise
  source_fidelity: Die Übersetzung gibt ἐξουσίαν, περιάγειν, die Vergleichsgruppe und den Namen Κηφᾶς sachgerecht wieder. Die Verbindung ἀδελφὴν γυναῖκα bezeichnet idiomatisch eine Ehefrau, die Glaubensschwester ist; die gegenwärtige Haupttextformulierung bildet die griechische Form zwar nach, transportiert diesen Sinn im Deutschen jedoch nicht zuverlässig.
  naturalness: „Eine Schwester als Ehefrau“ ist im modernen Standarddeutsch missverständlich und klingt, ohne die Fußnote gelesen zu haben, nach einer Schwester, die zur Ehefrau gemacht wird. „Eine gläubige Ehefrau“ ist idiomatisch, klar und bewahrt die kontextuell gemeinte Glaubenszugehörigkeit.
  terminology: „Das Recht“, „übrigen Apostel“, „Brüder des Herrn“ und „Kephas“ sind angemessen. „Gläubige Ehefrau“ vermeidet sowohl das anachronistische „christliche Ehefrau“ als auch die missverständliche wörtliche Konstruktion.
