source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: de
  text: Denn wenn ich dies freiwillig tue, habe ich Lohn; wenn aber unfreiwillig, ist mir ein Verwaltungsauftrag anvertraut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Mir ist eine Haushalterschaft anvertraut.'
    reason: Lexikalische Alternative zu „ein Verwaltungsauftrag“; οἰκονομία kann eine anvertraute Verwaltung oder Haushalterschaft bezeichnen.
lexical_decisions:
- source_word: ἑκὼν
  choice: freiwillig
  rationale: Das adverbial gebrauchte Adjektiv bezeichnet ein Handeln aus eigenem Willen und bildet den knappen, direkten Gegensatz zu ἄκων.
- source_word: τοῦτο πράσσω
  choice: dies tue
  rationale: Die Wendung verweist allgemein auf die zuvor behandelte Ausübung des Verkündigungsdienstes, ohne sie im Deutschen stärker auszudeuten als im Griechischen.
- source_word: μισθὸν
  choice: Lohn
  rationale: μισθός kann Bezahlung oder Belohnung bezeichnen. „Lohn“ bewahrt diese Bedeutungsbreite und den Gedanken einer Gegenleistung, ohne ihn auf ein Gehalt zu verengen.
- source_word: ἄκων
  choice: unfreiwillig
  rationale: Die Wiedergabe erhält den formalen Gegensatz zu ἑκών und fügt keine stärkere Gefühlsnuance wie Widerwillen hinzu.
- source_word: οἰκονομίαν
  choice: ein Verwalteramt
  rationale: οἰκονομία bezeichnet hier eine anvertraute Verwaltungsverantwortung. „Verwalteramt“ bewahrt das Bild eines Beauftragten, der fremdes Gut verantwortlich verwaltet.
- source_word: πεπίστευμαι
  choice: ist mir … anvertraut
  rationale: Die deutsche Passivkonstruktion gibt den griechischen Perfektpassiv und den daraus fortbestehenden Zustand einer übertragenen Verantwortung natürlich wieder.
theological_decisions:
- issue: Art des Dienstes des Paulus im zweiten Satzteil
  choice: Auch bei unfreiwilligem Handeln bleibt Paulus Träger eines ihm anvertrauten Verwalteramts.
  alternative: Der zweite Satzteil könnte stärker als bloßer Auftrag oder auferlegte Pflicht gegenüber dem Lohn freiwilligen Dienstes verstanden werden.
  rationale: Der Gegensatz zwischen μισθὸν ἔχω und οἰκονομίαν πεπίστευμαι wird beibehalten. Die Übersetzung erklärt weder das Verhältnis von Lohn und Pflicht abschließend noch trägt sie eine bestimmte Amtslehre in den Text ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelität „freiwillig … unfreiwillig“ folgt dem griechischen Gegensatz; „Verwalteramt“ hält die Metapher der anvertrauten Verantwortung fest. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
