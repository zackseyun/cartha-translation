id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: de
  text: Sondern ich diszipliniere meinen Körper streng[a] und mache ihn zum Sklaven[b], damit ich nicht etwa, nachdem ich anderen gepredigt habe, selbst disqualifiziert werde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich schlage meinen Körper hart“; das griechische Verb bezeichnet wörtlich einen Schlag unter das Auge und wird hier bildlich für strenge Selbstdisziplin gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „versklave ihn“ beziehungsweise „zwinge ihn, mir wie ein Sklave zu dienen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als nicht bewährt dastehe“ beziehungsweise „verworfen werde“. „Disqualifiziert“ greift das Bild des Wettkampfs im Zusammenhang auf.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: diszipliniere … streng
  rationale: Das Verb bezeichnet wörtlich einen Schlag unter das Auge, wird hier aber im Bild des Wettkampfs für harte körperliche Selbstdisziplin gebraucht. Die Wiedergabe vermittelt die Schärfe des Bildes in natürlichem Deutsch, ohne eine konkrete Form der Selbstverletzung zum Textsinn zu machen.
- source_word: σῶμα
  choice: Körper
  rationale: Der konkrete Bezug auf den Körper bleibt erhalten und wird nicht verallgemeinernd als „Selbst“ wiedergegeben.
- source_word: δουλαγωγῶ
  choice: mache ihn zum Sklaven
  rationale: Das starke Verb bedeutet, jemanden zu versklaven beziehungsweise zum Sklaven zu machen. Die Übersetzung bewahrt die drastische Metapher, statt sie zu „halte ihn unter Kontrolle“ abzuschwächen.
- source_word: μή πως
  choice: damit ich nicht etwa
  rationale: Die Formulierung gibt die befürchtete negative Folge beziehungsweise das negative Ziel idiomatisch wieder und erhält das Moment ernster Vorsicht.
- source_word: ἄλλοις
  choice: anderen
  rationale: Der Dativ bezeichnet die Menschen, an die sich die Verkündigung richtet.
- source_word: κηρύξας
  choice: nachdem ich anderen gepredigt habe
  rationale: Das Aoristpartizip bezeichnet hier eine der Hauptaussage vorausgehende Handlung. „Predigen“ gibt das öffentliche Verkündigen im Kontext treffend wieder.
- source_word: ἀδόκιμος
  choice: disqualifiziert
  rationale: Im unmittelbaren Zusammenhang von Lauf, Selbstbeherrschung und Siegespreis nimmt „disqualifiziert“ das Wettkampfbild auf. Zugleich legt es nicht fest, ob ausschließlich Dienst, Lohn oder endgültiges Heil betroffen ist.
- source_word: γένωμαι
  choice: werde
  rationale: Der Konjunktiv beschreibt die befürchtete mögliche Folge; im Deutschen wird dies in der damit-Konstruktion natürlich durch „werde“ ausgedrückt.
- source_word: ἀλλά
  choice: Sondern
  rationale: Nach der Verneinung beziehungsweise Gegenüberstellung im vorangehenden Zusammenhang markiert „sondern“ den kräftigen Kontrast idiomatisch.
theological_decisions:
- issue: Bedeutung der Befürchtung des Paulus, ἀδόκιμος zu werden
  choice: „disqualifiziert“ als ernste, vom Wettkampf geprägte Warnung, ohne ihren theologischen Umfang festzulegen
  alternative: „von Gott endgültig verworfen“ oder lediglich „für Dienst beziehungsweise Lohn nicht zugelassen“
  rationale: Der sportliche Kontext stützt „disqualifiziert“, doch der Vers selbst entscheidet nicht ausdrücklich zwischen den engeren theologischen Deutungen. Die Übersetzung bewahrt daher die Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Diszipliniere … streng“ vermeidet unnötig altertümliches „züchtige“, während die Fußnote das drastische griechische Bild offenlegt. Die Sklavenmetapher und die theologische Offenheit von ἀδόκιμος bleiben erhalten.
