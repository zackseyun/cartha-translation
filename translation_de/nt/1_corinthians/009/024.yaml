id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: de
  text: Wisst ihr nicht, dass die Läufer im Stadion zwar alle laufen, aber nur einer den Siegespreis erhält? Lauft so, dass ihr ihn erlangt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lauft so, dass ihr ihn gewinnt“ beziehungsweise „ergreift“. Das griechische Wort kann „erlangen“, „ergreifen“ oder „gewinnen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Wisst ihr nicht
  rationale: Bewahrt die paulinische rhetorische Frage und den Grundsinn von οἶδα in natürlichem Deutsch.
- source_word: οἱ ἐν σταδίῳ τρέχοντες
  choice: die Läufer im Stadion
  rationale: Gibt den konkreten Ort des Wettlaufs wieder; die substantivische Formulierung ist im Deutschen natürlicher als „die im Stadion Laufenden“.
- source_word: πάντες μὲν τρέχουσιν, εἷς δὲ
  choice: zwar alle laufen, aber nur einer
  rationale: Bildet den μέν-δέ-Gegensatz idiomatisch ab; „nur“ verdeutlicht den im Kontrast liegenden Ausschluss, ohne das Bild zu verändern.
- source_word: λαμβάνει
  choice: erhält
  rationale: Entspricht dem direkten Sinn von λαμβάνω und vermeidet die stärker deutende Wiedergabe „gewinnt“.
- source_word: τὸ βραβεῖον
  choice: den Siegespreis
  rationale: Bezeichnet im sportlichen Zusammenhang klar den Preis für den Sieger und ist im Deutschen natürlicher und eindeutiger als das allgemeinere „Preis“.
- source_word: οὕτως τρέχετε
  choice: Lauft so
  rationale: Bewahrt den knappen, eindringlichen Imperativ und den Rückbezug auf das zuvor beschriebene Wettlaufen.
- source_word: ἵνα καταλάβητε
  choice: dass ihr ihn erlangt
  rationale: καταλαμβάνω kann hier „erlangen“, „gewinnen“ oder „ergreifen“ bedeuten. „Erlangen“ passt zum Siegespreis, ohne den Ausgang stärker festzulegen als der griechische Ausdruck.
theological_decisions:
- issue: Das sportliche Wettkampfbild als Aufforderung zu beharrlichem Einsatz
  choice: Das Wettbewerbsbild bleibt erhalten, ohne den Siegespreis ausdrücklich mit Heil, Lohn oder einer bestimmten Heilsordnung gleichzusetzen.
  alternative: 'Deutender übersetzen: „Lauft, um zu gewinnen.“'
  rationale: Der Vers fordert durch ein sportliches Bild zu zielgerichtetem Einsatz auf. Die Übersetzung soll daraus keine Aussage über Verdienst, Erwählung oder den Verlust des Heils ableiten, die der Vers selbst nicht ausdrücklich macht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, kraftvollem Ton. Das konkrete Bild des Stadions und die Wiederholung des Laufens bleiben erhalten; schwerfällige Partizipialformen werden vermieden.
