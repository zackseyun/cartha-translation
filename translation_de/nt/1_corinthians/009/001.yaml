id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: de
  text: Bin ich nicht frei? Bin ich nicht ein Apostel? Habe ich nicht Jesus, unseren Herrn, gesehen? Seid nicht ihr mein Werk im Herrn?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: frei
  rationale: Die direkte Wiedergabe greift im Zusammenhang Paulus’ Freiheit und die damit verbundenen Rechte auf, ohne den Begriff auf bloße Unabhängigkeit einzuengen.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: Hier bezeichnet das Wort Paulus’ anerkannten apostolischen Auftrag und nicht nur allgemein einen Boten oder Gesandten.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jesus, unseren Herrn
  rationale: Diese Wortfolge folgt dem Griechischen und bleibt im Deutschen natürlich; das Komma macht die Apposition eindeutig.
- source_word: ἑόρακα
  choice: habe ... gesehen
  rationale: Das deutsche Perfekt gibt die vollendete Wahrnehmung mit ihrer fortdauernden Bedeutung für Paulus’ Apostelanspruch angemessen wieder.
- source_word: ἔργον
  choice: Werk
  rationale: Die korinthische Gemeinde wird als Ergebnis von Paulus’ apostolischer Arbeit bezeichnet; »Werk« bewahrt zugleich die knappe Bildsprache.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die vertraute paulinische Formulierung wahrt die Beziehung beziehungsweise den Wirkungsbereich, in dem die Korinther Paulus’ Werk sind.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Bin ich nicht ...? / Habe ich nicht ...? / Seid nicht ihr ...?
  rationale: Die negativen rhetorischen Fragen erwarten jeweils Zustimmung. Bei der letzten Frage bildet »ihr« den im Griechischen hervorgehobenen Gegensatz.
theological_decisions:
- issue: Bedeutung von Paulus’ Aussage, Jesus gesehen zu haben
  choice: Die schlichte Aussage »Habe ich nicht Jesus, unseren Herrn, gesehen?« bleibt im Haupttext stehen.
  alternative: Ausdrücklich ergänzen, dass Paulus den auferstandenen Jesus gesehen habe.
  rationale: Im Zusammenhang stützt die Begegnung Paulus’ Apostelanspruch und dürfte sich auf den auferstandenen Jesus beziehen; da »auferstanden« im griechischen Wortlaut jedoch nicht ausdrücklich steht, wird es nicht in die Übersetzung eingefügt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Folge der vier knappen rhetorischen Fragen und die Hervorhebung von »ihr« in der Schlussfrage werden bewahrt.
