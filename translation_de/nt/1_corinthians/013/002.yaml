revisions:
- from: Und wenn ich prophetische Rede habe und alle Geheimnisse und alle Erkenntnis weiß, und wenn ich allen Glauben habe, sodass ich Berge versetzen kann, aber keine Liebe habe, bin ich nichts.
  to: Und wenn ich prophetische Rede hätte und alle Geheimnisse verstünde und alle Erkenntnis besäße, und wenn ich allen Glauben hätte, sodass ich Berge versetzen könnte, aber keine Liebe hätte, wäre ich nichts.
  rationale: Die Revision ist auf die notwendige idiomatische Korrektur von „Erkenntnis wissen“ und auf eine einheitliche deutsche Konditionalform beschränkt. Sie ergänzt keine Auslegung und erhält die paulinische Hyperbel sowie die begriffliche Unterscheidung zwischen Geheimnissen und Erkenntnis.
  reviewer_model: gpt-5.6-terra
