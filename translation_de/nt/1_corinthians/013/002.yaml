review_pass:
  verdict: revise
  source_fidelity: 'Die Aussagefolge und die zentralen Begriffe entsprechen dem griechischen Text: prophetische Befähigung, umfassendes Verstehen/Erkennen, außergewöhnlicher Glaube, Bergeversetzen, Liebe und die abschließende Selbstnegation. Die Überarbeitung gibt die beiden Konditionalsätze und die durch ὥστε ausgedrückte Folge im Deutschen stimmiger wieder.'
  naturalness: „Alle Geheimnisse und alle Erkenntnis weiß“ ist im modernen Standarddeutsch nicht idiomatisch, insbesondere die Verbindung „Erkenntnis wissen“. Die Formulierung mit „verstünde“ und „besäße“ ist natürlich, bewahrt aber die umfassende Hyperbel. Der Konjunktiv („hätte … könnte“) bildet die hypothetische Wenn-Satz-Struktur konsistent ab.
  terminology: „Prophetische Rede“, „Geheimnisse“, „Erkenntnis“, „Glaube“ und „Liebe“ sind sachgerecht. Für πίστις ist „Glaube“ im Kontext des Bergeversetzens die naheliegende Wiedergabe. Eine Fußnote ist nicht erforderlich, da „Vertrauen“ hier keine eigenständige, für den deutschen Leser notwendige alternative Lesart eröffnet und „Treue“ kontextuell fernliegt.
  issues:
  - severity: medium
    issue: Unidiomatische Verbindung „alle Erkenntnis weiß“
    rationale: Das griechische εἰδῶ umfasst sowohl μυστήρια als auch γνῶσιν, doch deutsches „Erkenntnis wissen“ ist keine natürliche Kollokation. Eine idiomatische Entfaltung durch „alle Geheimnisse verstünde und alle Erkenntnis besäße“ erhält den Sinn und die Totalitätsaussage.
  - severity: low
    issue: Uneinheitliche Konditionalmodalität
    rationale: Bei „wenn ich … habe“ wirkt „sodass ich Berge versetzen kann“ zwar verständlich, aber „hätte … könnte“ ist für die hypothetische Konstruktion stilistisch geschlossen und präziser.
  revised_text: Und wenn ich prophetische Rede hätte und alle Geheimnisse verstünde und alle Erkenntnis besäße, und wenn ich allen Glauben hätte, sodass ich Berge versetzen könnte, aber keine Liebe hätte, wäre ich nichts.
