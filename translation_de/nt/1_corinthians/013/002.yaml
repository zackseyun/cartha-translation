source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: de
  text: Und wenn ich prophetische Rede hätte und alle Geheimnisse verstünde und alle Erkenntnis besäße, und wenn ich allen Glauben hätte, sodass ich Berge versetzen könnte, aber keine Liebe hätte, wäre ich nichts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προφητείαν
  choice: prophetische Rede
  rationale: Das Substantiv bezeichnet hier im Zusammenhang der Geistesgaben prophetisches Reden beziehungsweise Prophetie. „Prophetische Rede“ ist im heutigen Deutsch verständlich, ohne Amt oder Vorgang unnötig festzulegen.
- source_word: εἰδῶ
  choice: weiß
  rationale: Das griechische Verb bedeutet grundsätzlich „wissen/kennen“. Mit den Akkusativen „alle Geheimnisse und alle Erkenntnis“ bewahrt „weiß“ die parallele, umfassende Aussage, auch wenn die Verbindung mit „Erkenntnis“ im Deutschen bewusst zugespitzt klingt.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: „Geheimnisse“ ist der etablierte paulinische Ausdruck für verborgene beziehungsweise offenbarte göttliche Wahrheiten und vermeidet eine erklärende Verengung.
- source_word: γνῶσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt den theologischen und kognitiven Sinn von γνῶσις wieder und hält den nominalen Ausdruck vom Verb εἰδῶ unterscheidbar.
- source_word: πᾶσαν τὴν πίστιν
  choice: allen Glauben
  rationale: Die direkte Wiedergabe bewahrt die umfassende, hyperbolische Formulierung. Im Zusammenhang bezeichnet sie einen außergewöhnlichen, Berge versetzenden Glauben, ohne daraus eine technische Aussage über rettenden Glauben zu machen.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: sodass ich Berge versetzen kann
  rationale: Die Formulierung gibt die Folge beziehungsweise Befähigung natürlich wieder und bewahrt das markante Bild des Bergeversetzens.
- source_word: ἀγάπην
  choice: Liebe
  rationale: „Liebe“ ist die natürliche und in diesem Kapitel sachlich umfassende Wiedergabe von ἀγάπη.
- source_word: οὐθέν εἰμι
  choice: bin ich nichts
  rationale: Die knappe, wörtliche Formulierung bewahrt die scharfe Selbstaussage des griechischen Textes ohne abschwächende Deutung.
theological_decisions:
- issue: Bedeutung von πίστις im Zusammenhang außergewöhnlicher Wunderkraft
  choice: Glauben
  alternative: 'Vertrauen; weniger wahrscheinlich: Treue'
  rationale: Der unmittelbare Zusatz „sodass ich Berge versetzen kann“ spricht für außergewöhnlichen Glauben beziehungsweise außergewöhnliches Vertrauen. „Treue“ gehört zwar zum Bedeutungsspektrum von πίστις, passt hier aber weniger gut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wenn-Konstruktion und die hyperbolischen Totalitätsausdrücke werden beibehalten. Es ist keine Fußnote nötig, da „Glauben“ im Kontext eindeutig genug ist und die weniger wahrscheinlichen lexikalischen Möglichkeiten den Lesefluss nicht belasten sollen.
