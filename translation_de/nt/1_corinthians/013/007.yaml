  language: de
  text: Sie erträgt alles[a], sie glaubt alles[b], sie hofft alles, sie hält allem stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie bedeckt alles« beziehungsweise »sie schützt alles«; das griechische Wort kann sowohl »bedecken« oder »schützen« als auch »ertragen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sie vertraut allem«. Gemeint ist keine Leichtgläubigkeit, sondern die Bereitschaft zu vertrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: alles / allem
  rationale: Das wiederholte substantivierte Neutrum wird umfassend wiedergegeben. Beim letzten Glied verlangt idiomatisches Deutsch mit »standhalten« den Dativ »allem«; die vierfache Wiederholung bleibt dennoch deutlich.
- source_word: στέγει
  choice: erträgt
  rationale: στέγω kann »bedecken« und übertragen »ertragen« bedeuten. »Erträgt« passt zum Zusammenhang und bewahrt die knappe Parallelstruktur; die echte Alternative »deckt alles zu« wird in einer Fußnote erhalten.
- source_word: πιστεύει
  choice: glaubt
  rationale: πιστεύω bedeutet »glauben« oder »vertrauen«. »Glaubt« ist die direkte, knappe Wiedergabe; »vertraut« wird als mögliche Nuance in der Fußnote genannt.
- source_word: ἐλπίζει
  choice: hofft
  rationale: Die Form beschreibt eine für die Liebe charakteristische Haltung. »Hofft« gibt sie unmittelbar und prägnant wieder.
- source_word: ὑπομένει
  choice: hält stand
  rationale: ὑπομένω bezeichnet beharrliches Ausharren unter Belastung. »Hält allem stand« ist natürliches modernes Deutsch und bringt die standhafte Ausdauer deutlich zum Ausdruck.
theological_decisions:
- issue: Bedeutung der vierfachen πάντα-Aussage über die Liebe
  choice: Die umfassende rhetorische Aussage bleibt mit der vierfachen Wiederholung von »alles/allem« erhalten.
  alternative: Die Aussage als uneingeschränkte Leichtgläubigkeit oder als Billigung ausnahmslos jeder Sache zu verstehen.
  rationale: Der poetische Zusammenhang beschreibt den beständigen Charakter der Liebe. Die Übersetzung bewahrt die Weite und Spannung der Formulierung, ohne moralische Unterscheidungslosigkeit oder Naivität in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, rhythmischer Viererstruktur. Das wiederholte Pronomen »sie« macht den Bezug auf die Liebe im Deutschen klar. Die Fußnotenmarker stehen unmittelbar an den jeweils mehrdeutigen Verben.
