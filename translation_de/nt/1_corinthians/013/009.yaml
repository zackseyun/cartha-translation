  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: de
  text: Denn wir erkennen nur zum Teil[a], und wir prophezeien nur zum Teil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »teilweise«. Die griechische Wendung lautet wörtlich »aus einem Teil« und wird in beiden Satzgliedern nachdrücklich wiederholt.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: nur zum Teil
  rationale: Die Wendung bedeutet »zum Teil« bzw. »teilweise«. Das ergänzte »nur« macht im Deutschen die Begrenztheit natürlich deutlich; die Wiederholung in beiden Satzgliedern bewahrt den Nachdruck und bereitet den Gegensatz zum Vollkommenen im folgenden Kontext vor.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert die vorherige Aussage. »Denn« gibt diesen Zusammenhang im Deutschen präzise und würdig wieder.
- source_word: γινώσκομεν
  choice: wir erkennen
  rationale: γινώσκω bezeichnet hier ein begrenztes Erkennen oder Wissen. »Erkennen« ist im biblisch-theologischen Zusammenhang idiomatisch und vermeidet die mögliche Verengung von »wissen« auf bloßen Faktenbesitz.
- source_word: καὶ
  choice: und
  rationale: Die einfache Verbindung erhält den Parallelismus der beiden Satzglieder.
- source_word: προφητεύομεν
  choice: wir prophezeien
  rationale: Die direkte Wiedergabe wahrt den Bezug auf die Geistesgabe und legt die Tätigkeit weder auf Zukunftsvorhersage noch auf gewöhnliche Predigt fest.
theological_decisions:
- issue: Bedeutung prophetischer Tätigkeit in der Gemeinde
  choice: »wir prophezeien« ohne nähere Eingrenzung
  alternative: »wir sagen zukünftige Ereignisse voraus« oder »wir predigen«
  rationale: Im unmittelbaren Zusammenhang geht es um Geistesgaben. Der griechische Ausdruck bezeichnet prophetisches Reden umfassender als bloße Zukunftsvorhersage und darf nicht ohne Textgrund mit allgemeiner Predigt gleichgesetzt werden.
- issue: Art der Begrenztheit von Erkenntnis und Prophetie
  choice: Die parallele Formulierung »nur zum Teil« bleibt in beiden Satzgliedern stehen.
  alternative: Eine erklärende Wiedergabe wie »unvollkommen«
  rationale: Der Ausgangstext spricht bildhaft bzw. idiomatisch von einem Teil und entfaltet erst im Kontext den Gegensatz zum Vollkommenen. »Unvollkommen« würde diesen Gegensatz bereits interpretierend vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Wiederholung des griechischen Ausdrucks bleiben erhalten; die Formulierung ist zugleich für heutige Leser unmittelbar verständlich.
