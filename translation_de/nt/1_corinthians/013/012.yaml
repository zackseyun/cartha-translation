source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: de
  text: Denn jetzt sehen wir durch einen Spiegel, rätselhaft, dann aber von Angesicht zu Angesicht. Jetzt erkenne ich zum Teil, dann aber werde ich ganz erkennen, so wie auch ich ganz erkannt worden bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπομεν
  choice: wir sehen
  rationale: Bewahrt die anschauliche Metapher und gibt den präsentischen Indikativ schlicht und natürlich wieder.
- source_word: ἄρτι
  choice: jetzt
  rationale: Markiert den gegenwärtigen Zustand im klaren zeitlichen Gegensatz zu τότε („dann“).
- source_word: δι’ ἐσόπτρου
  choice: in einem Spiegel
  rationale: διά mit Genitiv bezeichnet hier die vermittelte Wahrnehmung mithilfe eines Spiegels. Im Deutschen gibt „in einem Spiegel sehen“ das Bild natürlich wieder und vermeidet die missverständliche Vorstellung, man sehe durch durchsichtiges Glas hindurch.
- source_word: ἐν αἰνίγματι
  choice: nur rätselhaft
  rationale: αἴνιγμα bezeichnet ein Rätsel beziehungsweise eine rätselhafte, indirekte Wahrnehmung. Die adverbiale Wiedergabe ist im Deutschen natürlich; die Fußnote bewahrt die wörtlichere Form.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: von Angesicht zu Angesicht
  rationale: Die feste, würdevolle deutsche Wendung gibt die unmittelbare Begegnung im Gegensatz zur vermittelten Sicht wieder.
- source_word: γινώσκω ἐκ μέρους
  choice: ich erkenne nur zum Teil
  rationale: ἐκ μέρους bedeutet „zum Teil“. „Erkennen“ passt zum Zusammenhang von Wahrnehmung und Erkenntnis und erhält die Parallele zu ἐπιγινώσκω.
- source_word: ἐπιγνώσομαι
  choice: ich werde ganz erkennen
  rationale: Gibt die gegenüber γινώσκω verstärkte Erkenntnis wieder, ohne daraus Allwissenheit oder erschöpfendes Wissen abzuleiten.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: so wie auch ich ganz erkannt worden bin
  rationale: Erhält die lexikalische Entsprechung zu ἐπιγνώσομαι und lässt wie der griechische Passivsatz offen, wer der Erkennende ist.
theological_decisions:
- issue: Umfang der zukünftigen Erkenntnis
  choice: „werde ich ganz erkennen“
  alternative: „werde ich alles vollständig wissen“
  rationale: Der Text stellt gegenwärtige teilweise Erkenntnis einer künftigen vollen Erkenntnis gegenüber, behauptet aber nicht ausdrücklich eine erschöpfende oder göttliche Allwissenheit.
- issue: Identität dessen, der Paulus erkannt hat
  choice: Das Passiv bleibt ohne ausdrücklich genanntes Subjekt.
  alternative: „so wie Gott mich ganz erkannt hat“
  rationale: Gott ist im Zusammenhang naheliegend, wird in diesem Satz jedoch nicht ausdrücklich genannt. Die Übersetzung bewahrt diese grammatische Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die geläufige Wendung „von Angesicht zu Angesicht“ wurde wegen ihrer Prägnanz beibehalten; schwerfällige Fachsprache und konfessionelle Deutungszusätze wurden vermieden.
