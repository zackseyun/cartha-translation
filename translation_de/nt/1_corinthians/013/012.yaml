review_pass:
  verdict: revise
  source_fidelity: 'Die zeitliche und antithetische Struktur sowie die Personalwechsel sind zutreffend wiedergegeben. Korrigiert werden sollte jedoch δι’ ἐσόπτρου: „in einem Spiegel“ ist eine natürliche Deutung des Bildes, gibt die durch διά ausgedrückte vermittelte Sicht aber weniger genau wieder als „durch einen Spiegel“. Das ergänzende „nur“ bei „rätselhaft“ ist interpretativ und im Griechischen nicht ausdrücklich vorhanden.'
  naturalness: „Durch einen Spiegel, rätselhaft“ ist modernes, verständliches Standarddeutsch und bewahrt zugleich die bewusst bildhafte, leicht spannungsvolle Formulierung des Ausgangstextes. „Von Angesicht zu Angesicht“ ist eine geläufige und angemessen würdige Wendung.
  terminology: „Erkennen … ganz erkennen“ bildet γινώσκω/ἐπιγινώσκω sinnvoll ab, ohne Allwissenheit zu behaupten. Das ungenannte Subjekt des Passivs bleibt zu Recht offen. Die Fußnote bewahrt den nominalen Charakter von ἐν αἰνίγματι und erläutert ihn ohne konfessionelle Festlegung.
  issues:
  - severity: medium
    issue: „in einem Spiegel“ statt „durch einen Spiegel“
    rationale: δι’ ἐσόπτρου verwendet διά mit Genitiv und bezeichnet die vermittelte Wahrnehmung durch bzw. mittels eines Spiegels. Die idiomatische Deutung „in einem Spiegel“ ist möglich, verschiebt aber die Konstruktion stärker als nötig.
  - severity: low
    issue: Das Wort „nur“ in „nur rätselhaft“
    rationale: Die Einschränkung ergibt sich aus dem Kontrast zum künftigen unmittelbaren Sehen, wird in ἐν αἰνίγματι aber nicht mit einem eigenständigen Ausdruck für „nur“ formuliert. Das Weglassen wahrt die knappe Bildsprache.
  revised_text: Denn jetzt sehen wir durch einen Spiegel, rätselhaft, dann aber von Angesicht zu Angesicht. Jetzt erkenne ich zum Teil, dann aber werde ich ganz erkennen, so wie auch ich ganz erkannt worden bin.
