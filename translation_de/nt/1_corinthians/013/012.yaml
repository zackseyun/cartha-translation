- from: Denn jetzt sehen wir in einem Spiegel nur rätselhaft[a], dann aber von Angesicht zu Angesicht. Jetzt erkenne ich nur zum Teil, dann aber werde ich ganz erkennen, so wie auch ich ganz erkannt worden bin.
  to: Denn jetzt sehen wir durch einen Spiegel, rätselhaft, dann aber von Angesicht zu Angesicht. Jetzt erkenne ich zum Teil, dann aber werde ich ganz erkennen, so wie auch ich ganz erkannt worden bin.
  rationale: Die Revision stellt die durch δι’ ἐσόπτρου ausgedrückte Vermittlung ausdrücklich wieder her und entfernt die nicht ausdrücklich markierte Verstärkung „nur“. Die Fußnote bleibt als lexikalische Hilfe zu ἐν αἰνίγματι bestehen; ihr Anker [a] gehört nach „rätselhaft“.
