id: 1CO.13.1
reference: 1 Corinthians 13:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: de
  text: Wenn ich in den Sprachen der Menschen und der Engel rede[a], aber keine Liebe habe, bin ich zu tönendem Erz[b] oder einem lärmenden Becken geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Zungen der Menschen und der Engel“. Das griechische Wort kann sowohl „Zungen“ als auch „Sprachen“ bedeuten und knüpft an die korinthische Diskussion über Zungenrede an.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „klingendem Metall“. Das griechische Wort bezeichnet Kupfer, Bronze oder ein daraus bestehendes Metallstück, ohne hier ein bestimmtes Instrument zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Wenn
  rationale: Leitet ein hypothetisches Szenario ein. „Wenn“ ist im Deutschen natürlich und bewahrt den rhetorischen Aufbau.
- source_word: ταῖς γλώσσαις
  choice: in den Sprachen
  rationale: γλῶσσα kann „Zunge“ oder „Sprache“ bedeuten. „Sprachen“ gibt die kommunikative Bedeutung in modernem Deutsch klar wieder; die Fußnote bewahrt die traditionelle Wiedergabe und den Bezug zur korinthischen Diskussion über Zungenrede.
- source_word: τῶν ἀνθρώπων
  choice: der Menschen
  rationale: ἄνθρωποι bezeichnet hier die Menschheit im Gegensatz zu den Engeln. „Menschen“ ist präzise, inklusiv und gegenwärtiges Standarddeutsch.
- source_word: λαλῶ
  choice: ich … rede
  rationale: Das Präsens im Konditionalsatz wird im Deutschen idiomatisch mit dem einfachen Präsens wiedergegeben.
- source_word: καὶ τῶν ἀγγέλων
  choice: und der Engel
  rationale: Der Gegensatz zu Menschen und die rhetorische Steigerung sprechen für himmlische Engel, nicht allgemein für Boten.
- source_word: ἀγάπην
  choice: Liebe
  rationale: „Liebe“ ist die klare und etablierte moderne Wiedergabe von ἀγάπη, ohne eine engere konfessionelle Deutung einzutragen.
- source_word: δὲ μὴ ἔχω
  choice: aber keine Liebe habe
  rationale: „Aber“ bewahrt den Gegensatz; die deutsche Formulierung gibt das fehlende Haben natürlich und deutlich wieder.
- source_word: γέγονα
  choice: bin ich … geworden
  rationale: Das Perfekt bezeichnet einen eingetretenen Zustand. „Bin … geworden“ bewahrt diese resultative Nuance besser als schlicht „bin ich“.
- source_word: χαλκὸς ἠχῶν
  choice: tönendes Erz
  rationale: χαλκός bezeichnet kupferhaltiges Metall, ohne ausdrücklich ein bestimmtes Instrument zu nennen; ἠχῶν beschreibt dessen Tönen. „Tönendes Erz“ bleibt dem offenen Bild nahe.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: oder einem lärmenden Becken
  rationale: κύμβαλον bezeichnet ein Schlagbecken; ἀλαλάζον hebt seinen lauten, aufdringlichen Klang hervor. „Lärmendes Becken“ ist verständlich und bewahrt das harte Klangbild.
theological_decisions:
- issue: Die „Sprachen der Menschen und der Engel“
  choice: Die Formulierung wird als rhetorischer Gegensatz zwischen menschlichen und engelhaften Sprachen wiedergegeben, ohne über deren genaue Art zu entscheiden.
  alternative: Sie ausdrücklich als wirkliche himmlische Sprachen oder ausschließlich als Übertreibung zu erklären.
  rationale: Der griechische Text lässt offen, ob Paulus tatsächliche Engelsprachen voraussetzt oder die höchstmögliche Redeweise rhetorisch ausmalt. Die Übersetzung bewahrt diese Spannung.
- issue: Die Funktion der Liebe
  choice: ἀγάπη wird ohne erläuternden Zusatz mit „Liebe“ wiedergegeben.
  alternative: Eine nähere Bestimmung wie „göttliche Liebe“, „Nächstenliebe“ oder „selbstlose Liebe“.
  rationale: Solche Zusätze könnten zutreffende Aspekte entfalten, würden den Begriff im Vers aber stärker festlegen als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Konditionalsatz; traditionelle Bildsprache wird dort beibehalten, wo sie verständlich ist, und durch knappe Fußnoten abgesichert.
