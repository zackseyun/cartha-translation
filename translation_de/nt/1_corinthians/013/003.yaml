id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: de
  text: Und wenn ich meinen ganzen Besitz verschenke und wenn ich meinen Körper hingebe, damit ich verbrannt werde[a], aber keine Liebe habe, nützt es mir nichts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben hier: »damit ich mich rühme« statt: »damit ich verbrannt werde«.'
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: verschenke
  rationale: Das Verb bezeichnet hier das stückweise Austeilen von Besitz. Zusammen mit »meinen ganzen Besitz« gibt »verschenke« den wohltätigen und vollständigen Verzicht natürlich und verständlich wieder.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: meinen ganzen Besitz
  rationale: Die Wendung bezeichnet das gesamte Eigentum bzw. die materiellen Güter einer Person. »Meinen ganzen Besitz« ist im modernen Deutschen klar und konkret.
- source_word: παραδῶ
  choice: hingebe
  rationale: »Hingebe« bewahrt den Gedanken des Auslieferns oder Übergebens, ohne bereits eine bestimmte Deutung wie »opfere« einzutragen.
- source_word: τὸ σῶμά μου
  choice: meinen Körper
  rationale: Die konkrete Nominalphrase wird unmittelbar wiedergegeben; eine metaphorische Erweiterung ist nicht erforderlich.
- source_word: ἵνα καυθήσομαι
  choice: damit ich verbrannt werde
  rationale: Die Zweck- bzw. Zielbeziehung wird mit »damit« ausgedrückt, während das Passiv von καίω direkt als »verbrannt werde« erscheint.
- source_word: ἀγάπην
  choice: Liebe
  rationale: »Liebe« ist die natürliche und umfassende moderne Entsprechung für ἀγάπη und vermeidet die heute enger verstandene oder altertümlich wirkende Wiedergabe »Liebestätigkeit«.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: nützt es mir nichts
  rationale: Die Formulierung bewahrt den persönlichen Nutzen- bzw. Gewinnaspekt des Passivs und klingt im Deutschen idiomatisch.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: Und wenn ... und wenn
  rationale: Die wiederholte Bedingungsstruktur bleibt erhalten und trägt die steigernde Rhetorik des Satzes.
theological_decisions:
- issue: Textvariante im Zwecksatz
  choice: Die SBLGNT-Lesart καυθήσομαι wird im Haupttext mit »damit ich verbrannt werde« wiedergegeben.
  alternative: Die Variante καυχήσωμαι bedeutet »damit ich mich rühme«.
  rationale: Da die vorgegebene griechische Ausgabe καυθήσομαι liest, folgt der Haupttext dieser Lesart. Die inhaltlich bedeutsame Variante wird in einer Fußnote offengelegt, weil sie die Deutung von körperlichem Leiden hin zum Rühmen verschiebt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Konditionalsätze und die Zuspitzung bleiben erhalten; unnötige kirchliche Fachsprache und konfessionelle Deutungen werden vermieden.
