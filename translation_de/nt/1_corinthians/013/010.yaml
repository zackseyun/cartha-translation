  source_fidelity: Der Entwurf gibt die temporale, auf ein zukünftiges Ereignis gerichtete Konstruktion ὅταν … ἔλθῃ treffend mit „Wenn … kommt“ wieder. „Das Vollkommene“ bewahrt den substantivierten neutralen und absichtlich nicht näher bestimmten Ausdruck τὸ τέλειον. „Das Stückwerk“ gibt τὸ ἐκ μέρους idiomatisch und im Kontext prägnant wieder. Für καταργηθήσεται ist eine passive bzw. passivnahe Wiedergabe angemessen; „abgetan“ vermittelt das Beenden bzw. Außerkraftsetzen ohne eine Vernichtung zu behaupten.
  naturalness: „Wird das Stückwerk weggetan werden“ ist zwar verständlich, wirkt im modernen Standarddeutsch wegen der doppelten Form „werden“ jedoch schwerfällig. „Wird das Stückwerk abgetan“ ist deutlich idiomatischer; der Zukunftsbezug ergibt sich eindeutig aus dem einleitenden Temporalsatz.
  terminology: Die etablierten und zugleich ausreichend offenen Begriffe „das Vollkommene“ und „das Stückwerk“ sind beizubehalten. Die Fußnote zu τὸ τέλειον wahrt die Auslegungsvielfalt, ohne eine konfessionelle Deutung festzulegen. Die alternative Formulierung „das zur Reife Gekommene“ ist im Deutschen natürlicher als „das zur Reife Gelangte“.
