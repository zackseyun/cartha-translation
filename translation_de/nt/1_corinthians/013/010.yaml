  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: de
  text: Wenn aber das Vollkommene[a] kommt, wird das Stückwerk[b] abgetan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Vollständige“ oder „das zur Reife Gekommene“. Worauf „das Vollkommene“ (griechisch: to teleion) zielt, ist umstritten; möglich sind Vollständigkeit, Reife oder die endzeitliche Vollendung im Gegensatz zum gegenwärtig Stückhaften.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „außer Wirksamkeit gesetzt“, „beseitigt“ oder „ein Ende haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet mit dem Aorist Konjunktiv ein erwartetes zukünftiges Geschehen ein; „wenn“ ist im Deutschen natürlich und nicht wiederholend wie „wann immer“.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den milden Gegensatz zwischen dem gegenwärtig Stückhaften und dem kommenden Vollkommenen.
- source_word: ἔλθῃ
  choice: kommt
  rationale: Der Aorist Konjunktiv nach ὅταν verweist hier auf ein künftiges Eintreten; im deutschen Temporalsatz steht idiomatisch das Präsens.
- source_word: τὸ τέλειον
  choice: das Vollkommene
  rationale: Die substantivierte neutrale Form kann das Vollkommene, Vollständige oder zur Reife Gelangte bezeichnen. „Das Vollkommene“ erhält die lexikalische und theologische Offenheit, ohne den Bezug festzulegen.
- source_word: τὸ ἐκ μέρους
  choice: das Stückwerk
  rationale: Die substantivierte Wendung bezeichnet das nur teilweise Vorhandene. „Das Stückwerk“ ist eine verständliche, würdige deutsche Entsprechung und bildet einen klaren Gegensatz zu „dem Vollkommenen“.
- source_word: καταργηθήσεται
  choice: wird weggetan werden
  rationale: Das Futur Passiv bezeichnet, dass das Stückhafte außer Wirksamkeit gesetzt oder beendet wird. „Weggetan werden“ bewahrt das Passiv und legt keine Vernichtung nahe.
theological_decisions:
- issue: Bezug von τὸ τέλειον
  choice: Im Haupttext allgemein als „das Vollkommene“ wiedergegeben, ohne den Bezug näher zu bestimmen.
  alternative: „das Vollständige“, „das zur Reife Gelangte“ oder eine endzeitliche Vollendung; manche deuten die Wendung auf den abgeschlossenen Schriftkanon.
  rationale: Der griechische Wortlaut benennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt daher die echte Mehrdeutigkeit und entscheidet die umstrittene theologische Frage nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stückwerk“ ist geläufig und prägnant; die beiden Fußnoten bewahren die lexikalische Bandbreite und die ungelöste theologische Spannung.
