  verdict: approve
  source_fidelity: Der Haupttext gibt νυνὶ δέ, μένει sowie die Dreierreihe πίστις, ἐλπίς, ἀγάπη zuverlässig wieder. „Diese drei“ bildet τὰ τρία ταῦτα angemessen ab; „die größte unter ihnen“ gibt die im Kontext superlativische Funktion von μείζων mit τούτων idiomatisch wieder. Die beiden δέ werden mit „aber“ und „doch“ jeweils als milde Kontrast- bzw. Weiterführungssignale vertretbar abgebildet.
  naturalness: „Nun aber bleiben Glaube, Hoffnung und Liebe – diese drei“ ist modernes, würdiges und gut verständliches Standarddeutsch. Der Gedankenstrich ist als knappe nachtragende Zusammenfassung stilistisch passend. „Die größte unter ihnen ist die Liebe“ klingt natürlich und bewahrt den nachdrücklichen Schlusssatz.
  terminology: Die etablierten Begriffe „Glaube, Hoffnung und Liebe“ sind im paulinischen Dreiklang treffend gewählt. Die Fußnote zu „Glaube“ wahrt die mögliche weitere Nuance „Vertrauen“, ohne den Haupttext unnötig umzudeuten. Die Alternativen zu μένει sind sachgerecht. Die Fußnotenanker stehen an den jeweils einschlägigen Stellen.
