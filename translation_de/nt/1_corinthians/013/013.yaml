id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: de
  text: Nun aber[a] bleiben[b] Glaube[c], Hoffnung und Liebe – diese drei. Doch die größte unter ihnen ist die Liebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Bindewort kann hier auch schwach weiterführend wiedergegeben werden: „Und nun“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bestehen fort“ beziehungsweise „dauern an“.'
    reason: lexical_alternative
  - marker: c
    text: „Glaube“ kann hier auch im weiteren Sinn von „Vertrauen“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nun aber
  rationale: νυνί bezeichnet den gegenwärtigen beziehungsweise nun erreichten Sachverhalt; δέ verbindet weiterführend oder leicht gegensätzlich. „Nun aber“ bewahrt beide Möglichkeiten im natürlichen Deutschen.
- source_word: μένει
  choice: bleiben
  rationale: μένω bezeichnet hier das Fortbestehen oder Andauern im Gegensatz zu dem, was vergeht. „Bleiben“ ist klar, gegenwärtig und entspricht der offenen zeitlichen Aussage des griechischen Textes.
- source_word: πίστις
  choice: Glaube
  rationale: In der paulinischen Dreierformel ist „Glaube“ die etablierte und kontextuell naheliegende Wiedergabe; die ebenfalls mögliche Bedeutung „Vertrauen“ wird in einer Fußnote bewahrt.
- source_word: ἐλπίς
  choice: Hoffnung
  rationale: „Hoffnung“ gibt den üblichen paulinischen Sinn von ἐλπίς natürlich und prägnant wieder.
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die sachlich und sprachlich angemessene moderne Wiedergabe von ἀγάπη und vermeidet veraltete oder verengende Begriffe.
- source_word: τὰ τρία ταῦτα
  choice: diese drei
  rationale: Die Wendung verweist zusammenfassend auf die drei unmittelbar genannten Größen; „diese drei“ bildet dies knapp und idiomatisch ab.
- source_word: μείζων δὲ τούτων
  choice: Doch die größte unter ihnen
  rationale: Obwohl μείζων formal ein Komparativ ist, bezeichnet die Vergleichskonstruktion die höchste Stellung innerhalb einer Dreiergruppe. Der deutsche Superlativ gibt diesen Sinn idiomatisch wieder.
theological_decisions:
- issue: Bedeutungsumfang von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Die Verbindung mit Hoffnung und Liebe spricht hier am stärksten für „Glaube“. „Vertrauen“ bleibt lexikalisch möglich; „Treue“ ist in diesem Zusammenhang weniger wahrscheinlich und wird nicht in den Haupttext eingetragen.
- issue: Rangbezeichnung durch μείζων
  choice: die größte unter ihnen ist die Liebe
  alternative: die Liebe ist größer als diese
  rationale: Der Komparativ mit τούτων ordnet die Liebe innerhalb der genannten drei ein. Die idiomatische deutsche Superlativform macht diese Rangordnung deutlich, ohne ihre theologische Begründung über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper Satzform. Der Gedankenstrich hebt die zusammenfassende Wendung „diese drei“ hervor. Die traditionellen Kernbegriffe „Glaube, Hoffnung und Liebe“ bleiben erhalten, während Fußnoten echte lexikalische Spielräume des griechischen Textes sichtbar machen.
