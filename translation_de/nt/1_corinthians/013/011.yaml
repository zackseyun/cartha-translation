source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: de
  text: Als ich ein Kind war, redete ich wie ein Kind, dachte ich wie ein Kind und überlegte ich wie ein Kind. Als ich ein Mann geworden bin, habe ich abgelegt, was zu einem Kind gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Dinge des Kindes“; auch möglich: „kindliche Dinge“ oder „die Art eines Kindes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: Kind
  rationale: νήπιος bezeichnet ein kleines beziehungsweise noch unmündiges Kind und hebt hier die Unreife im Gegensatz zum erwachsenen Mann hervor. „Kind“ ist im Deutschen natürlich und legt das Alter nicht unnötig eng auf einen Säugling fest.
- source_word: ἐλάλουν
  choice: redete ich
  rationale: λαλέω bedeutet „reden“ oder „sprechen“. „redete ich“ wahrt den rhythmischen, persönlichen Rückblick und klingt in dieser Reihung natürlich.
- source_word: ἐφρόνουν
  choice: dachte ich
  rationale: φρονέω kann Denken, Gesinnung oder innere Einstellung bezeichnen. In der dreigliedrigen Reihe gibt „dachte ich“ den Sinn knapp und verständlich wieder.
- source_word: ἐλογιζόμην
  choice: urteilte ich
  rationale: λογίζομαι bezeichnet erwägendes Denken, Berechnen oder Schlussfolgern. „urteilte ich“ unterscheidet den Ausdruck von ἐφρόνουν und bewahrt den Gedanken geistiger Beurteilung.
- source_word: γέγονα
  choice: geworden bin
  rationale: Die Perfektform beschreibt den Eintritt in einen fortbestehenden Zustand. Das deutsche Perfekt „geworden bin“ gibt diesen Übergang idiomatisch wieder.
- source_word: ἀνήρ
  choice: Mann
  rationale: ἀνήρ bezeichnet ausdrücklich einen erwachsenen Mann. Paulus spricht autobiografisch; „Mann“ erhält daher den konkreten maskulinen Gegensatz zu „Kind“, ohne daraus eine allgemeine Aussage über männliche Überlegenheit zu machen.
- source_word: κατήργηκα
  choice: habe ich abgelegt
  rationale: καταργέω bedeutet etwas außer Wirksamkeit setzen, beseitigen oder abschaffen. Im Bild des Erwachsenwerdens drückt „abgelegt“ natürlich aus, dass frühere kindliche Verhaltensweisen zurückgelassen wurden; das Perfekt entspricht zudem der griechischen Zeitform.
- source_word: τὰ τοῦ νηπίου
  choice: was zu einem Kind gehört
  rationale: Die substantivierte Wendung bedeutet wörtlich „die Dinge des Kindes“. Die gewählte Formulierung bleibt offen genug für Reden, Denken und Urteilen und ist zugleich in modernem Deutsch verständlich.
theological_decisions:
- issue: Geschlechtsspezifischer Gegensatz bei ἀνήρ
  choice: Mann
  alternative: Erwachsener
  rationale: Der griechische Text verwendet im autobiografischen Vergleich ausdrücklich das maskuline ἀνήρ. Die Übersetzung bewahrt diese Form, ohne den illustrativen Vergleich als Lehraussage über den Wert oder die Reife der Geschlechter zu deuten.
- issue: Umfang dessen, was abgelegt wird
  choice: was zu einem Kind gehört
  alternative: kindliche Dinge; die Art eines Kindes
  rationale: τὰ τοῦ νηπίου bleibt absichtlich allgemein und kann die zuvor genannten Weisen des Redens, Denkens und Urteilens zusammenfassen. Die Übersetzung schränkt die Aussage nicht auf einen einzelnen Bereich ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung „wie ein Kind“ erhält den rhetorischen Nachdruck des griechischen Textes; vor dem letzten Glied steht im Deutschen ein natürliches „und“. Der Wechsel vom Präteritum zum Perfekt spiegelt den früheren kindlichen Zustand und den erreichten, fortbestehenden Zustand des Erwachsenseins.
