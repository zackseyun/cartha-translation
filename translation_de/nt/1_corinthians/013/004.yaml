  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: de
  text: Die Liebe ist geduldig, die Liebe ist gütig. Sie ist nicht neidisch[a], sie prahlt nicht, sie bläht sich nicht auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eifersüchtig“. Das griechische Verb kann je nach Zusammenhang Eifer, Eifersucht oder Neid bezeichnen; hier spricht der negative Zusammenhang für „neidisch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: Sie wird nicht hochmütig oder überheblich. Paulus gebraucht das Bild des Aufgeblähtseins durch Stolz.'
    reason: metaphor_explanation
lexical_decisions:
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die natürliche, umfassende deutsche Entsprechung und wahrt den ethischen und theologischen Bedeutungsumfang des griechischen Wortes.
- source_word: μακροθυμεῖ
  choice: ist geduldig
  rationale: Das Verb bezeichnet lang anhaltende Geduld, besonders im Umgang mit anderen. „Ist geduldig“ ist klar, gegenwärtig und idiomatisch.
- source_word: χρηστεύεται
  choice: ist gütig
  rationale: Das seltene Verb beschreibt tätige Güte und freundliches Verhalten. „Ist gütig“ bewahrt die knappe Prädikatsform und den würdevollen Ton.
- source_word: ζηλοῖ
  choice: ist neidisch
  rationale: Das Verb kann Eifer, Eifersucht oder Neid ausdrücken. Die Verneinung und die Reihe negativer Verhaltensweisen legen hier „neidisch“ nahe.
- source_word: περπερεύεται
  choice: prahlt
  rationale: Das Verb bezeichnet großsprecherische Selbstdarstellung. „Prahlt“ ist prägnant, verständlich und weder altertümlich noch unnötig umgangssprachlich.
- source_word: φυσιοῦται
  choice: bläht sich auf
  rationale: Die Formulierung erhält das paulinische Bild des durch Stolz Aufgeblähtseins, statt es lediglich mit „ist überheblich“ auszudeuten.
- source_word: ἡ ἀγάπη … ἡ ἀγάπη … ⸂ἡ ἀγάπη⸃
  choice: Die Liebe … die Liebe … Sie
  rationale: Die Wiederholung in den ersten beiden Aussagen bleibt als rhetorische Betonung erhalten. Danach führt das Pronomen die Reihe im Deutschen natürlich fort; die textkritisch unsichere dritte Wiederholung verändert den Bezug nicht.
- source_word: οὐ
  choice: nicht
  rationale: Die wiederholte Verneinung wird in jeder negativen Aussage ausdrücklich wiedergegeben.
theological_decisions:
- issue: Wiedergabe von ἀγάπη in diesem ethisch-theologischen Abschnitt
  choice: Liebe
  alternative: Nächstenliebe
  rationale: „Liebe“ bewahrt den umfassenden Sinn des griechischen Begriffs. „Nächstenliebe“ wäre enger und würde den Bezug unnötig auf eine bestimmte Ausprägung der Liebe beschränken.
- issue: Bildsprache in φυσιοῦται
  choice: bläht sich nicht auf
  alternative: ist nicht überheblich
  rationale: Die bildhafte Formulierung bewahrt Paulus’ charakteristische Metapher für hochmütige Selbstüberschätzung, ohne ihre Bedeutung fest auf nur einen abstrakten Begriff zu verengen.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Sprache. Die anaphorische Wiederholung von „die Liebe“ bleibt zu Beginn erhalten; anschließend sorgt „sie“ für einen natürlichen deutschen Satzfluss. Die aktive Reihung der griechischen Verben wird möglichst prägnant wiedergegeben.
