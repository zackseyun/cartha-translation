base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: de
  text: Sie verhält sich nicht unanständig[a], sie sucht nicht das Ihre[b], sie lässt sich nicht zum Zorn reizen[c], sie rechnet das Böse nicht an[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie handelt nicht unschicklich“ bzw. „sie benimmt sich nicht ungehörig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie sucht nicht das Ihre“; gemeint ist eigennütziges Streben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Sie lässt sich nicht aufreizen“ bzw. „sie wird nicht zornig“. Das im Deutschen bisweilen ergänzte „leicht“ steht nicht ausdrücklich im griechischen Text.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: „Sie rechnet erlittenes Unrecht nicht an“ bzw. „sie führt nicht Buch über das Unrecht“. Wörtlich steht eine Wendung aus der Sprache des Rechnens: „das Böse nicht berechnen/anrechnen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: verhält sich nicht unanständig
  rationale: Das Verb bezeichnet ein unschickliches, schändliches oder gegen den gebotenen Anstand verstoßendes Verhalten. „Unanständig“ wahrt die moralische und soziale Weite, ohne den Sinn auf bloße Unhöflichkeit zu verengen.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: sucht nicht das Ihre
  rationale: Die Formulierung bildet das griechische Idiom „die eigenen Dinge suchen“ knapp nach und bezeichnet eigennütziges Streben, ohne es auf das Durchsetzen des eigenen Willens zu beschränken.
- source_word: παροξύνεται
  choice: lässt sich nicht zum Zorn reizen
  rationale: Das Verb beschreibt ein scharfes Gereizt- oder Erregtwerden. Die Wiedergabe macht den emotionalen Sinn im Deutschen deutlich, fügt aber kein dem Griechischen fehlendes „leicht“ hinzu.
- source_word: λογίζεται τὸ κακόν
  choice: rechnet das Böse nicht an
  rationale: λογίζεται gehört zur Sprache des Rechnens und Anrechnens; τὸ κακόν kann „das Böse“ oder im zwischenmenschlichen Zusammenhang „erlittenes Unrecht“ bezeichnen. „Rechnet … nicht an“ bewahrt die Rechnungsmetapher und klingt im Deutschen natürlich.
- source_word: ἀγάπη (aus dem Kontext ergänztes Subjekt)
  choice: sie
  rationale: Das feminine Pronomen nimmt die im vorausgehenden Kontext genannte „Liebe“ auf und führt deren Personifizierung natürlich fort.
theological_decisions:
- issue: Ob παροξύνεται durch „leicht“ verstärkt werden soll
  choice: lässt sich nicht zum Zorn reizen
  alternative: wird nicht leicht zornig
  rationale: Im griechischen Text steht kein Adverb mit der Bedeutung „leicht“. Die Übersetzung vermeidet daher diese interpretierende Einschränkung.
- issue: Ob λογίζεται τὸ κακόν als fortlaufendes Verzeichnis erlittener Verfehlungen ausgedeutet werden soll
  choice: rechnet das Böse nicht an
  alternative: führt nicht Buch über erlittenes Unrecht
  rationale: Die Alternative verdeutlicht zwar die Rechnungsmetapher, ergänzt jedoch ein fortlaufendes Buchführen und legt τὸ κακόν ausschließlich als erlittenes Unrecht aus. Die Hauptfassung erhält die Mehrdeutigkeit zwischen Bösem und Unrecht besser.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzstruktur folgt der rhetorischen Reihung des griechischen Textes. Das feminine „sie“ bezieht sich auf „die Liebe“ aus Vers 4. Die Formulierungen bleiben quellennah, während Fußnoten echte lexikalische Spielräume offenlegen.
