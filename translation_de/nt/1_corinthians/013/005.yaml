  source_fidelity: Die Übersetzung gibt die vier negierten Prädikate des griechischen Textes vollständig und in derselben Reihung wieder. „Sie sucht nicht das Ihre“ bewahrt die offene, idiomatische Formulierung ζητεῖ τὰ ἑαυτῆς. „Sie lässt sich nicht zum Zorn reizen“ gibt die Bedeutung von παροξύνεται ohne die im Grundtext nicht ausgedrückte Verstärkung „leicht“ wieder. „Sie rechnet das Böse nicht an“ erhält sowohl die Rechnungsmetapher von λογίζεται als auch die bewusst allgemein gehaltene Singularform τὸ κακόν.
  naturalness: Die Formulierungen sind verständliches, würdevolles modernes Standarddeutsch und tragen die knappe rhetorische Reihung des Verses. „Das Ihre“ und „das Böse“ haben einen leicht gehobenen, aber für diesen literarisch-biblischen Kontext passenden Ton.
  terminology: Das feminine „sie“ nimmt korrekt auf „die Liebe“ Bezug. „Unanständig“ deckt im Deutschen auch ein unschickliches beziehungsweise sozial unangemessenes Verhalten ab; die Fußnote hält passend weiter gefasste Alternativen offen. Die Wiedergabe von τὸ κακόν als „das Böse“ vermeidet eine nicht zwingende Festlegung auf ausschließlich erlittenes Unrecht.
