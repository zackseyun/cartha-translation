  naturalness: Die vorgeschlagene Form „werden außer Kraft gesetzt werden“ ist zwar formal möglich, im modernen Standarddeutsch jedoch unnötig schwerfällig. Außerdem klingt „außer Kraft setzen“ bei prophetischen Botschaften und besonders bei „Erkenntnis“ administrativ bzw. rechtssprachlich. „werden aufgehoben“ ist deutlich idiomatischer und bewahrt die passivische, den Handelnden nicht nennende Form.
  terminology: „Liebe“, „prophetische Botschaften“, „Zungenreden“ und „Erkenntnis“ sind sachgerecht. „Aufgehoben“ ist für καταργηθήσονται / καταργηθήσεται in beiden Fällen einheitlich und bezeichnet das Außerkrafttreten bzw. Beseitigtwerden, ohne eine Lehraussage über die genaue Weise oder den Zeitpunkt zu ergänzen.
