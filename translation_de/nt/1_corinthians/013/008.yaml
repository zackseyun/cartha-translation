source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: de
  text: Die Liebe versagt nie[a]. Seien es aber prophetische Botschaften, sie werden aufgehoben; seien es Zungenreden[b], sie werden aufhören; sei es Erkenntnis, sie wird aufgehoben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Die Liebe fällt niemals“ oder „Die Liebe hört niemals auf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sprachen“.'
    reason: alternative_reading
  - marker: c
    text: Im Griechischen steht hier dasselbe Verb wie bei den prophetischen Botschaften.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die natürliche und in diesem Zusammenhang umfassende deutsche Entsprechung; es beschränkt den Begriff nicht auf Wohltätigkeit oder eine bestimmte Form der Zuneigung.
- source_word: οὐδέποτε πίπτει
  choice: versagt nie
  rationale: Die idiomatische Wiedergabe bringt die bleibende Verlässlichkeit der Liebe zum Ausdruck, ohne πίπτει mit den nachfolgenden Verben für das Aufhören gleichzusetzen.
- source_word: εἴτε δὲ
  choice: Seien es aber / sei es
  rationale: Die wiederholte korrelative Wendung bildet die griechische Reihung ab und macht zugleich den Gegensatz zur bleibenden Liebe deutlich.
- source_word: προφητεῖαι
  choice: prophetische Botschaften
  rationale: Der Ausdruck bezeichnet hier prophetische Äußerungen beziehungsweise Botschaften; diese Wiedergabe ist für heutige Leser klarer als das möglicherweise nur auf Zukunftsvorhersagen bezogene „Prophezeiungen“.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: werden / wird außer Kraft gesetzt werden
  rationale: Die einheitliche Wiedergabe des in beiden Satzteilen verwendeten Verbs bezeichnet das Ende ihrer Wirksamkeit, ohne eine Vernichtung zu behaupten.
- source_word: γλῶσσαι
  choice: Zungenreden
  rationale: Der Ausdruck wahrt den besonderen Zusammenhang der Geistesgabe in 1. Korinther 12–14, ohne die umstrittene genaue Art des Phänomens festzulegen.
- source_word: παύσονται
  choice: werden aufhören
  rationale: „Aufhören“ gibt das Verb natürlich wieder und wahrt den sprachlichen Unterschied zu καταργέω in den benachbarten Satzteilen.
- source_word: γνῶσις
  choice: Erkenntnis
  rationale: „Erkenntnis“ entspricht dem paulinischen Sprachgebrauch und passt zum anschließenden Gedanken des stückweisen Erkennens.
theological_decisions:
- issue: Bedeutung von πίπτει in der Aussage über die Liebe
  choice: Die Liebe versagt nie
  alternative: Die Liebe kommt nie zu Fall / Die Liebe hört niemals auf
  rationale: „Versagt nie“ drückt die bleibende Zuverlässigkeit der Liebe aus, ohne das Verb mit den späteren Aussagen über das Aufhören der Gaben zu verschmelzen. Die wörtlichere Bildsprache und die zeitliche Deutung bleiben in der Fußnote sichtbar.
- issue: Bedeutung von γλῶσσαι in diesem Kapitel
  choice: Zungenreden
  alternative: Sprachen
  rationale: „Zungenreden“ erhält den im Abschnitt erkennbaren Bezug auf eine Geistesgabe, legt aber nicht fest, ob ausschließlich bekannte menschliche Sprachen oder eine andere Form des Redens gemeint ist.
- issue: Bedeutung von καταργέω bei prophetischen Botschaften und Erkenntnis
  choice: außer Kraft gesetzt werden
  alternative: beseitigt werden / unwirksam werden
  rationale: Die Formulierung betont das Ende der Wirksamkeit oder Geltung und vermeidet die stärkere Behauptung vollständiger Vernichtung; beide Vorkommen werden bewusst gleich wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion „seien es / sei es“ bewahrt die rhetorische Reihung des griechischen Textes. Die Passivformen bleiben erhalten, da der griechische Text den Handelnden nicht ausdrücklich nennt.
