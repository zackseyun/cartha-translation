revisions:
- from: Die Liebe versagt nie[a]. Seien es aber prophetische Botschaften, sie werden außer Kraft gesetzt werden; seien es Zungenreden[b], sie werden aufhören; sei es Erkenntnis, sie wird außer Kraft gesetzt werden[c].
  to: Die Liebe versagt nie[a]. Seien es aber prophetische Botschaften, sie werden aufgehoben; seien es Zungenreden[b], sie werden aufhören; sei es Erkenntnis, sie wird aufgehoben[c].
  rationale: Die Revision ersetzt ausschließlich die unidiomatische Wendung „außer Kraft gesetzt werden“ durch das natürliche passive „werden aufgehoben“. Dadurch bleiben die Zukunftsaussage im Kontext, die unterschiedliche Verbwahl gegenüber „werden aufhören“ und die identische Wiedergabe der beiden Formen von καταργέω erhalten. Die Fußnote zu πίπτει wird sprachlich präzisiert.
