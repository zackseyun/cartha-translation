id: 1CO.13.6
reference: 1 Corinthians 13:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ χαίρει ἐπὶ τῇ ἀδικίᾳ, συγχαίρει δὲ τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/006.yaml
  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: de
  text: Sie freut sich nicht über das Unrecht[a], sondern freut sich mit der Wahrheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über Ungerechtigkeit« oder »über unrechtes Handeln«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »freut sich über die Wahrheit« beziehungsweise »freut sich an der Wahrheit«. Das griechische Verb kann gemeinsame Freude oder Freude über etwas ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: freut sich
  rationale: Die geläufige deutsche Wendung gibt Freude beziehungsweise Gefallen wieder und wahrt die verbale Parallele zu συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: über das Unrecht
  rationale: Bei χαίρω bezeichnet ἐπί mit Dativ den Anlass der Freude. »Über« ist im Deutschen idiomatisch; ἀδικία bleibt mit »Unrecht« bewusst weit und umfasst ungerechtes wie moralisch falsches Handeln.
- source_word: συγχαίρει
  choice: freut sich mit
  rationale: Die Wiedergabe macht die durch συν- ausgedrückte Mitfreude sichtbar, ohne die mögliche Bedeutung »sich über/an etwas freuen« auszuschließen.
- source_word: δὲ
  choice: sondern
  rationale: Nach der Verneinung bildet δέ einen klaren Gegensatz; im Deutschen ist »sondern« dafür natürlicher und präziser als »aber«.
- source_word: τῇ ἀληθείᾳ
  choice: der Wahrheit
  rationale: »Der Wahrheit« bewahrt den Artikel und die offene moralische wie sachliche Bedeutung von ἀλήθεια im Gegensatz zu ἀδικία.
theological_decisions:
- issue: Bedeutungsumfang von ἀδικία im paulinischen ethischen Gegensatz
  choice: Unrecht
  alternative: Ungerechtigkeit; unrechtes Handeln
  rationale: »Unrecht« bewahrt die moralische und relationale Weite des Ausdrucks, ohne ihn auf soziale Ungerechtigkeit, einzelne Taten oder eine bestimmte dogmatische Kategorie zu verengen.
- issue: Bezug von συγχαίρει zur Wahrheit
  choice: freut sich mit der Wahrheit
  alternative: freut sich über die Wahrheit; freut sich an der Wahrheit
  rationale: Die Übersetzung bildet das συν-Präfix formal ab und erhält die personifizierende Spannung des griechischen Ausdrucks. Da das Verb hier auch Freude über die Wahrheit bezeichnen kann, wird diese Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Das wiederholte »freut sich« bewahrt die rhetorische Parallelität; »mit der Wahrheit« erhält bewusst die ungewöhnliche Bildhaftigkeit und Mehrdeutigkeit des griechischen Textes.
