source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: de
  text: Doch wegen der sexuellen Unmoral[a] soll jeder Mann seine eigene Frau haben und jede Frau ihren eigenen Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht der Plural, wörtlich etwa: „wegen sexueller Unmoral(en)“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Doch wegen
  rationale: διά mit Akkusativ bezeichnet hier den Grund; δέ führt eine leicht kontrastierende Weiterentwicklung gegenüber Vers 1 ein. „Doch wegen“ gibt beides knapp und natürlich wieder.
- source_word: τὰς πορνείας
  choice: der sexuellen Unmoral
  rationale: πορνεία bezeichnet sexuell unmoralisches Verhalten. Im Deutschen wird das Abstraktum idiomatisch meist im Singular gebraucht; eine Fußnote weist auf den griechischen Plural hin.
- source_word: ἕκαστος
  choice: jeder Mann
  rationale: Das maskuline ἕκαστος steht parallel zu ἑκάστη und bezieht sich hier auf Männer; „jeder Mann“ macht diese Zuordnung im Deutschen klar.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: seine eigene Frau
  rationale: γυνή bedeutet im ehelichen Zusammenhang „Ehefrau/Frau“; ἑαυτοῦ betont die Zuordnung zur eigenen Frau.
- source_word: ἐχέτω
  choice: soll ... haben
  rationale: Der Imperativ der dritten Person wird im modernen Deutschen natürlich mit „soll ... haben“ wiedergegeben. Dies bewahrt den Aufforderungscharakter, ohne ausdrücklich „heiraten“ oder ehelichen Verkehr in den Wortlaut einzutragen.
- source_word: καὶ ἑκάστη
  choice: und jede Frau
  rationale: Die feminine distributive Form entspricht der ersten Satzhälfte und wahrt die auffällige Gegenseitigkeit der Aussage.
- source_word: τὸν ἴδιον ἄνδρα
  choice: ihren eigenen Mann
  rationale: ἀνήρ bezeichnet in dieser ehelichen Paarung den Ehemann; ἴδιον hebt hervor, dass es der jeweils eigene Mann ist.
theological_decisions:
- issue: Ob der Vers als Aufforderung zur Eheschließung oder als Anweisung über die eheliche Beziehung auszulegen ist
  choice: Das griechische „haben“ wird unmittelbar mit „soll ... haben“ wiedergegeben.
  alternative: Interpretierend „soll heiraten“ oder „soll den ehelichen Pflichten nachkommen“.
  rationale: ἐχέτω bedeutet wörtlich „soll haben“ und verwendet weder ein ausdrückliches Verb für das Heiraten noch für ehelichen Verkehr. Die Übersetzung lässt daher die im Kontext bestehende Deutungsspannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung für Mann und Frau bleibt erhalten; „Frau“ und „Mann“ sind im Zusammenhang eindeutig ehelich gemeint. Der griechische Plural bei πορνείας wird wegen der im Deutschen natürlicheren Singularform in einer Fußnote dokumentiert.
