id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: de
  text: Brüder[a], jeder soll in der Lebenslage, in der er berufen wurde, bei Gott[b] bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ ist hier die ganze Gemeinde angesprochen, auch die Frauen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „vor Gott“ beziehungsweise „in Gottes Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: jeder
  rationale: Das distributive Singularwort richtet die Weisung ausdrücklich an jede einzelne Person; „jeder“ ist im Deutschen knapp und natürlich.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: in der Lebenslage, in der
  rationale: Die korrespondierenden Präpositionalwendungen bezeichnen im Zusammenhang die gesellschaftliche oder persönliche Situation, in der jemand berufen wurde. „Lebenslage“ gibt dies natürlicher und klarer wieder als das abstraktere „Zustand“.
- source_word: ἐκλήθη
  choice: berufen wurde
  rationale: Das Passiv bleibt erhalten, ohne den im paulinischen Zusammenhang naheliegenden göttlichen Handelnden ausdrücklich in den Text einzufügen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die Anrede ist im Griechischen grammatisch maskulin. „Brüder“ bewahrt diese Form; eine Fußnote erläutert, dass die ganze Gemeinde einschließlich der Frauen angesprochen ist.
- source_word: μενέτω
  choice: soll ... bleiben
  rationale: Der Imperativ fordert dazu auf, in der genannten Lebenslage zu verbleiben. Die deutsche Konstruktion mit „soll“ ist würdig, verständlich und gibt den auffordernden Charakter wieder.
- source_word: παρὰ θεῷ
  choice: bei Gott
  rationale: παρά mit Dativ kann Nähe oder eine Beziehung ausdrücken. „Bei Gott“ bewahrt die knappe Formulierung und lässt sowohl das Leben in Beziehung zu Gott als auch das Stehen vor ihm anklingen.
theological_decisions:
- issue: Der nicht genannte Handelnde bei ἐκλήθη
  choice: Das Passiv „berufen wurde“ ohne Zusatz beibehalten
  alternative: „von Gott berufen wurde“
  rationale: Der Zusammenhang legt Gottes Berufung nahe, doch der griechische Satz nennt den Handelnden nicht ausdrücklich. Die Übersetzung vermeidet daher eine erklärende Ergänzung im Haupttext.
- issue: Die Bedeutung von παρὰ θεῷ
  choice: „bei Gott“
  alternative: „vor Gott“ oder „in Gottes Gegenwart“
  rationale: Die gedrängte griechische Wendung kann Beziehung beziehungsweise Nähe zu Gott oder das Leben vor Gott bezeichnen. „Bei Gott“ erhält diese Spannung; die anderen sachlich möglichen Wiedergaben werden in der Fußnote genannt.
- issue: Die maskuline Gemeindeanrede ἀδελφοί
  choice: „Brüder“ mit erläuternder Fußnote
  alternative: „Brüder und Schwestern“ oder „Geschwister“
  rationale: Die gewählte Form bildet die grammatische Gestalt des Ausgangstextes ab, während die Fußnote die im Kontext umfassende Anrede der Gemeinde verdeutlicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Lebenslage“ erschließt den sozialen und persönlichen Zusammenhang des Abschnitts, ohne ihn auf einen einzelnen Status einzuengen. Die Satzstellung ist natürlich deutsch, bewahrt aber die enge Verbindung zwischen Berufung, Lebenslage und Bleiben.
