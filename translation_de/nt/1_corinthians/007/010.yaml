source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: de
  text: 'Den Verheirateten aber gebiete ich – nicht ich, sondern der Herr: Eine Frau soll sich nicht von ihrem Mann trennen[a] –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich nicht von ihrem Mann scheiden lassen“. Das griechische Verb kann eine eheliche Trennung bezeichnen, die im Zusammenhang auch eine Scheidung einschließen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Den Verheirateten aber
  rationale: Das substantivierte Partizip bezeichnet Menschen, die verheiratet sind; der Dativ wird als Adressat des Gebots bewahrt. δέ markiert einen Übergang und wird mit dem zurückhaltenden „aber“ wiedergegeben.
- source_word: παραγγέλλω
  choice: gebiete ich
  rationale: Das Verb bezeichnet eine verbindliche, autoritative Anweisung. „Gebieten“ ist im Deutschen knapp, verständlich und dem feierlichen Kontext angemessen.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: nicht ich, sondern der Herr
  rationale: Die betonte Gegenüberstellung wird formal bewahrt, ohne daraus eine Aussage über unterschiedliche Grade von Autorität abzuleiten.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: Eine Frau … von ihrem Mann
  rationale: Im Ehekontext bezeichnen γυνή und ἀνήρ die Ehefrau und ihren Ehemann. Das Possessivpronomen macht die Beziehung im Deutschen natürlich deutlich.
- source_word: μὴ χωρισθῆναι
  choice: soll sich nicht … trennen
  rationale: Obwohl die griechische Form passiv ist, kann χωρίζομαι intransitiv beziehungsweise medial verstanden werden. „Sich trennen“ bewahrt den Sinn ehelicher Trennung, ohne ihn vorschnell auf eine rechtliche Scheidung einzuengen.
theological_decisions:
- issue: Bedeutung von „nicht ich, sondern der Herr“
  choice: Die wörtliche Gegenüberstellung bleibt stehen und weist auf eine Weisung des Herrn hin.
  alternative: Paulus spreche seinen eigenen Worten jede Autorität ab.
  rationale: Der unmittelbare Zusammenhang unterscheidet zwischen einer bereits vom Herrn gegebenen Weisung und Paulus’ anschließender apostolischer Behandlung weiterer Fälle. Die Übersetzung selbst löst diese Spannung nicht über den Wortlaut hinaus auf.
- issue: Bedeutungsumfang von χωρισθῆναι
  choice: trennen
  alternative: sich scheiden lassen
  rationale: „Trennen“ lässt offen, ob vor allem das Getrenntleben, die Auflösung der Ehe oder beides im Blick ist, und entspricht damit der semantischen Weite des griechischen Verbs im Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich am Versende wird beibehalten, da der Satz in Vers 11 weitergeführt wird. „Gebieten“ wahrt die Verbindlichkeit von παραγγέλλω; „sich trennen“ erhält die lexikalische und rechtlich-soziale Offenheit des Ausgangstextes.
