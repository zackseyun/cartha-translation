review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: die Anrede an Verheiratete, den anschließenden Übergang durch „aber“, die autoritative Weisung, den Kontrast „nicht ich, sondern der Herr“ sowie das Verbot ehelicher Trennung. „Sich trennen“ wahrt die im Kontext bestehende Offenheit von χωρισθῆναι gegenüber einer ausschließlich rechtlichen Bedeutung „sich scheiden lassen“.'
  naturalness: '„Den Verheirateten aber gebiete ich – nicht ich, sondern der Herr: Eine Frau soll sich nicht von ihrem Mann trennen[a] –“ ist modernes, verständliches und würdiges Standarddeutsch. Die Satzstellung ist leicht gehoben, aber für den paulinischen Briefstil angemessen. Der Schlussgedankenstrich bildet den Fortgang in Vers 11 korrekt ab.'
  terminology: „Herr“, „Frau“, „Mann“, „gebiete“ und „sich trennen“ sind kontextgerecht und terminologisch konsistent. Die Übersetzung vermeidet es zutreffend, χωρισθῆναι dogmatisch oder rechtlich auf „Scheidung“ einzuengen. Die Fußnote dokumentiert die naheliegende alternative Lesart, ohne den Haupttext zu überladen.
