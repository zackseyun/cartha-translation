  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: de
  text: Wenn aber jemand meint, sich gegenüber seiner Jungfrau[a] ungehörig zu verhalten, wenn sie über die Blüte der Jugend hinaus ist und es so sein muss, dann soll er tun, was er will; er sündigt nicht. Sie sollen heiraten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Verlobten“ beziehungsweise „einer ihm verlobten Jungfrau gegenüber“; traditionell auch auf seine jungfräuliche Tochter bezogen. Der griechische Ausdruck ist mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: sich … gegenüber ungehörig zu verhalten
  rationale: Das Verb bezeichnet ein unschickliches oder unangemessenes Verhalten. „Sich ungehörig verhalten“ gibt den moralisch-sozialen Sinn wieder, ohne ihn unnötig zu verschärfen.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: seiner Jungfrau gegenüber
  rationale: παρθένος bedeutet „Jungfrau“. Die Beziehung, die αὐτοῦ ausdrückt, bleibt im Griechischen mehrdeutig; die bewusst knappe Wiedergabe bewahrt diese Offenheit, während die Fußnote die wichtigsten Deutungen nennt.
- source_word: ὑπέρακμος
  choice: über die Blüte ihrer Jugend hinaus
  rationale: Das Adjektiv bezeichnet das Überschreiten der jugendlichen Blüte beziehungsweise des üblichen heiratsfähigen Alters. Die Formulierung wahrt das Bild, ohne eine genaue Altersgrenze einzutragen.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: und es so sein muss
  rationale: ὀφείλει drückt Notwendigkeit oder Verpflichtung aus, während γίνεσθαι allgemein bleibt. Die Übersetzung konkretisiert weder den Anlass noch die Art der Notwendigkeit.
- source_word: ὃ θέλει ποιείτω
  choice: dann soll er tun, was er will
  rationale: Der Imperativ erlaubt dem Betreffenden, entsprechend seinem Willen zu handeln; die deutsche Formulierung erhält diese Erlaubnis klar und natürlich.
- source_word: οὐχ ἁμαρτάνει
  choice: er sündigt nicht
  rationale: Die direkte Wiedergabe bewahrt die ausdrückliche moralische Beurteilung des Handelns.
- source_word: γαμείτωσαν
  choice: Sie sollen heiraten
  rationale: Der Imperativ der dritten Person Plural bezieht sich auf beide Beteiligten und fordert zur Eheschließung auf.
theological_decisions:
- issue: Identität und Verhältnis der „Jungfrau“ (παρθένον αὐτοῦ)
  choice: Der Haupttext bewahrt mit „seiner Jungfrau“ die Mehrdeutigkeit.
  alternative: Gemeint sein kann seine Verlobte beziehungsweise die ihm versprochene Jungfrau; traditionell wurde die Wendung auch auf seine jungfräuliche Tochter bezogen.
  rationale: Der griechische Ausdruck benennt die Beziehung nicht eindeutig. Eine Festlegung im Haupttext würde eine der historisch vertretenen Auslegungen ausschließen, obwohl der Ausgangstext diese Entscheidung nicht ausdrücklich trifft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewöhnliche Wendung „seiner Jungfrau“ wurde bewusst beibehalten, um die echte Mehrdeutigkeit des griechischen Ausdrucks nicht zugunsten einer einzelnen Auslegung aufzulösen.
