  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: de
  text: Was aber die Jungfrauen[a] betrifft, habe ich kein Gebot vom Herrn. Ich gebe jedoch meine Einschätzung[b] ab als jemand, dem der Herr Erbarmen erwiesen hat und der vertrauenswürdig[c] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die unverheirateten Frauen«; nach manchen Deutungen des Zusammenhangs: »die jungfräulichen Töchter«. Im Griechischen steht »Jungfrauen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mein Urteil« oder »meinen Rat«. Paulus stellt hier seine wohlüberlegte Einschätzung einem ausdrücklichen »Gebot vom Herrn« gegenüber.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »treu«. Das griechische Wort kann sowohl »treu« als auch »vertrauenswürdig/zuverlässig« bedeuten. Im Zusammenhang kann es die Verlässlichkeit von Paulus’ Urteil hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Was aber … betrifft
  rationale: Die geläufige deutsche Themenformel gibt den durch περί und δέ markierten Übergang wieder, ohne ein zeitliches »nun« einzuführen.
- source_word: τῶν παρθένων
  choice: die Jungfrauen
  rationale: παρθένος bezeichnet grundsätzlich eine jungfräuliche Person, hier im Plural wahrscheinlich unverheiratete Frauen. Die wörtlichere Wiedergabe vermeidet eine vorschnelle Festlegung auf eine umstrittene genauere Bezugsgruppe.
- source_word: ἐπιταγὴν κυρίου
  choice: Gebot vom Herrn
  rationale: ἐπιταγή bezeichnet ein Gebot oder eine verbindliche Anordnung; »vom Herrn« kennzeichnet den Ursprung natürlich und klar.
- source_word: γνώμην δὲ δίδωμι
  choice: Ich gebe jedoch meine Einschätzung ab
  rationale: γνώμη bezeichnet hier ein überlegtes Urteil oder einen Rat im Gegensatz zu einem ausdrücklichen Gebot. »Einschätzung« bewahrt diesen Unterschied, ohne die Aussage als bloß beiläufige Privatmeinung abzuwerten.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: durch das Erbarmen des Herrn
  rationale: Das Perfektpartizip bezeichnet Paulus als jemanden, dem der Herr Erbarmen erwiesen hat. Die deutsche Formulierung drückt knapp aus, dass seine Zuverlässigkeit auf dem Erbarmen des Herrn beruht.
- source_word: πιστὸς εἶναι
  choice: vertrauenswürdig ist
  rationale: πιστός kann sowohl »treu« als auch »vertrauenswürdig/zuverlässig« bedeuten. Im Zusammenhang begründet Paulus damit die Verlässlichkeit seiner Einschätzung; die alternative Bedeutung bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Verhältnis zwischen einem Gebot des Herrn und Paulus’ eigener Einschätzung
  choice: Paulus erklärt, dass ihm für diese Frage kein ausdrückliches Gebot des Herrn vorliegt, gibt aber als durch das Erbarmen des Herrn vertrauenswürdiger Ratgeber seine Einschätzung ab.
  alternative: Man könnte »Einschätzung« als unverbindliche Privatmeinung verstehen oder annehmen, Paulus verweise indirekt auf ein anderweitig unbekanntes Herrenwort.
  rationale: Der Gegensatz zwischen ἐπιταγή und γνώμη wird bewahrt. Zugleich verhindert die Selbstbeschreibung als πιστός, dass Paulus’ Aussage ohne Textgrund als belanglos abgewertet wird; ihre Autorität wird aber auch nicht mit einem unmittelbaren Herrenwort gleichgesetzt.
- issue: Bedeutung von πιστός
  choice: vertrauenswürdig
  alternative: treu
  rationale: Beide Bedeutungen sind sprachlich möglich. »Vertrauenswürdig« passt besonders zur Begründung, warum Paulus eine verlässliche Einschätzung geben kann; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Themenformel ist idiomatisch, ohne ein im Griechischen nicht vorhandenes zeitliches »nun«. Die Aufteilung in zwei Sätze erhöht die Verständlichkeit, während der Gegensatz zwischen fehlendem ausdrücklichem Herrenwort und Paulus’ begründeter Einschätzung erhalten bleibt.
