source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: de
  text: Wer aber in seinem Herzen fest entschlossen ist und unter keinem Zwang steht[a], sondern über seinen eigenen Willen bestimmen kann und in seinem eigenen Herzen beschlossen hat, seine Jungfrau[b] unverheiratet zu lassen, der handelt gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „keine Notwendigkeit hat“ oder „keiner zwingenden Lage unterliegt“.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Jungfrau“ kann sich entweder auf seine jungfräuliche Tochter oder auf seine Verlobte beziehen; die griechische Formulierung ist umstritten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν … ἑδραῖος
  choice: fest entschlossen ist
  rationale: Die Verbindung bezeichnet einen gefestigten, beständigen inneren Entschluss. Die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne die beiden griechischen Ausdrücke unnötig doppelt abzubilden.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: in seinem Herzen
  rationale: καρδία bezeichnet hier das innere Zentrum des Wollens und Entscheidens. Das biblische Bild bleibt im Deutschen verständlich und wird entsprechend der Wiederholung im griechischen Text zweimal beibehalten.
- source_word: μὴ ἔχων ἀνάγκην
  choice: unter keinem Zwang steht
  rationale: ἀνάγκη kann Notwendigkeit, Zwang oder bedrängende Umstände bezeichnen. Im Kontrast zur eigenen Entscheidungsbefugnis ist „unter keinem Zwang stehen“ klares und quellennahes Deutsch.
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: sondern über seinen eigenen Willen bestimmen kann
  rationale: ἐξουσία bezeichnet Befugnis oder Verfügungsgewalt, θέλημα den eigenen Willen beziehungsweise Entschluss. Die Wiedergabe drückt die vorhandene Entscheidungsfreiheit aus, ohne eine spezielle Ursache des möglichen Zwangs festzulegen.
- source_word: κέκρικεν
  choice: beschlossen hat
  rationale: Das Perfekt bezeichnet einen bereits gefassten und fortgeltenden Entschluss. „Beschlossen hat“ ist dafür idiomatisches, würdiges Deutsch.
- source_word: τηρεῖν
  choice: zu bewahren
  rationale: τηρέω bedeutet bewahren, erhalten oder in einem Zustand belassen. „Bewahren“ bleibt bewusst knapp und legt die genaue Beziehung zur παρθένος nicht zusätzlich aus.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: seine Jungfrau
  rationale: Die wörtliche, im Deutschen ungewohnte Wendung erhält die echte Unklarheit des griechischen Ausdrucks darüber, ob eine jungfräuliche Tochter oder eine Verlobte gemeint ist. Die möglichen Bezüge werden in der Fußnote erläutert.
- source_word: καλῶς ποιήσει
  choice: der handelt gut
  rationale: Die Wendung bezeichnet ein anerkennenswertes oder richtiges Handeln. „Handelt gut“ ist natürlich und vermeidet die mögliche deutsche Fehlbedeutung von „wird es gut machen“.
theological_decisions:
- issue: Bezug von τὴν ἑαυτοῦ παρθένον
  choice: Die mehrdeutige Formulierung „seine Jungfrau“ bleibt im Haupttext erhalten.
  alternative: „seine jungfräuliche Tochter“ oder „seine Verlobte“
  rationale: Der griechische Text entscheidet nicht eindeutig, ob Paulus von einem Vater beziehungsweise Vormund und einer Tochter oder von einem Mann und seiner Verlobten spricht. Eine Festlegung im Haupttext würde eine umstrittene Auslegung zur Übersetzung machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem gedanklichen Verlauf des griechischen Textes, wird aber durch „und“ sowie die abschließende Wiederaufnahme mit „der“ im Deutschen lesbar gehalten. Die ungewöhnliche Wendung „seine Jungfrau“ ist bewusst beibehalten, weil eine glattere Formulierung den umstrittenen Bezug vorentscheiden würde.
