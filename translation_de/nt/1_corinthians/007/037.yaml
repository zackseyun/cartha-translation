revisions:
- from: Wer aber in seinem Herzen fest entschlossen ist und unter keinem Zwang steht[a], sondern über seinen eigenen Willen bestimmen kann, und in seinem eigenen Herzen beschlossen hat, seine Jungfrau zu bewahren[b], der handelt gut.
  to: Wer aber in seinem Herzen fest entschlossen ist und unter keinem Zwang steht[a], sondern über seinen eigenen Willen bestimmen kann und in seinem eigenen Herzen beschlossen hat, seine Jungfrau[b] unverheiratet zu lassen, der handelt gut.
  rationale: Die Revision ersetzt allein die im modernen Deutsch missverständliche Verbindung „seine Jungfrau zu bewahren“ durch „seine Jungfrau unverheiratet zu lassen“ und setzt den Fußnotenanker an die erläuterte Nominalgruppe. Der Haupttext lässt weiterhin offen, ob die Jungfrau eine Tochter oder eine Verlobte ist; diese echte Auslegungsfrage wird ausschließlich in der Fußnote benannt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:49:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur, den gefestigten Entschluss, die fehlende ἀνάγκη, die Entscheidungsbefugnis und den bereits gefassten Beschluss insgesamt zuverlässig wieder. Bei τηρεῖν ist „bewahren“ zwar lexikalisch möglich, in Verbindung mit „seine Jungfrau“ jedoch im heutigen Deutsch missverständlich: Es kann nahelegen, ihre Jungfräulichkeit zu schützen, statt die im Kontext gemeinte Beibehaltung ihres unverheirateten Status auszudrücken. Die Formulierung „unverheiratet zu lassen“ gibt die kontextuelle Funktion von τηρεῖν wieder, ohne den umstrittenen Bezug auf Tochter oder Verlobte im Haupttext aufzulösen.'
  naturalness: Der Satz ist grundsätzlich modernes, würdiges Standarddeutsch. „Seine Jungfrau zu bewahren“ ist jedoch keine natürliche gegenwärtige deutsche Ausdrucksweise und erzeugt eine semantisch abweichende Lesart. Die Stellung des Fußnotenzeichens sollte zudem unmittelbar bei der mehrdeutigen Nominalgruppe stehen.
  terminology: „Herz“, „Zwang“, „eigenen Willen“ und „beschlossen hat“ sind passend. „Seine Jungfrau“ bewahrt die umstrittene griechische Bezugnahme bewusst; die Fußnote muss klarstellen, dass sowohl die Tochter- als auch die Verlobtenlesart vertreten wird. „Unverheiratet zu lassen“ ist hier keine konfessionelle Festlegung, sondern beschreibt die durch den Kontext bestimmte Handlung von τηρεῖν.
  issues:
  - severity: medium
    issue: „seine Jungfrau zu bewahren“ ist im modernen Deutsch missverständlich.
    rationale: Die Wendung klingt unidiomatisch und kann als Schutz ihrer sexuellen Unberührtheit verstanden werden. Im Kontext von 1 Kor 7 bezeichnet τηρεῖν die Aufrechterhaltung des unverheirateten Zustands; „unverheiratet zu lassen“ vermittelt dies verständlich, ohne die genaue Beziehung festzulegen.
  - severity: low
    issue: Fußnotenanker b steht am Verb statt bei der mehrdeutigen Bezeichnung.
    rationale: Die Fußnote erläutert τὴν ἑαυτοῦ παρθένον, nicht primär τηρεῖν. Der Anker soll daher direkt nach „seine Jungfrau“ stehen.
  revised_text: Wer aber in seinem Herzen fest entschlossen ist und unter keinem Zwang steht[a], sondern über seinen eigenen Willen bestimmen kann und in seinem eigenen Herzen beschlossen hat, seine Jungfrau[b] unverheiratet zu lassen, der handelt gut.
  revised_footnotes:
