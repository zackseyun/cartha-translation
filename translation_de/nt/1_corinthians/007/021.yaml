id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: de
  text: Wurdest du als Sklave berufen? Lass dich davon nicht beunruhigen. Doch wenn du tatsächlich frei werden kannst, dann nutze es lieber.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch selbst wenn du frei werden kannst, mach lieber von deinem gegenwärtigen Stand Gebrauch“, das heißt: Bleib, wie du bist. Im Griechischen bleibt bei „nutze es“ das Objekt unausgesprochen; die Wendung wird daher unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet hier einen rechtlich und sozial gebundenen Status; die unmittelbar erwähnte Möglichkeit, frei zu werden, macht diesen Sinn deutlich. „Diener“ wäre zu unbestimmt.
- source_word: ἐκλήθης
  choice: wurdest du … berufen
  rationale: Die knappe Formulierung bewahrt den paulinischen Gedanken der Berufung, ohne „von Gott“ oder „zum Glauben“ erklärend in den Haupttext einzufügen.
- source_word: μή σοι μελέτω
  choice: Lass dich davon nicht beunruhigen
  rationale: Die Wendung betrifft Sorge oder innere Beunruhigung. Die deutsche Formulierung ist natürlich und erhält den seelsorgerlichen Ton.
- source_word: ἐλεύθερος γενέσθαι
  choice: frei werden
  rationale: Dies gibt den Wechsel aus dem Sklavenstand in die Freiheit direkt und idiomatisch wieder.
- source_word: μᾶλλον χρῆσαι
  choice: dann nutze es lieber
  rationale: χράομαι bedeutet „gebrauchen/nutzen“, doch das Objekt bleibt unausgesprochen. Im Haupttext bezieht sich „es“ am ehesten auf die unmittelbar zuvor genannte Möglichkeit, frei zu werden; die andere traditionsreiche Deutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Mehrdeutigkeit von μᾶλλον χρῆσαι
  choice: Paulus ermutigt dazu, eine mögliche Freilassung zu nutzen.
  alternative: Paulus fordert dazu auf, den gegenwärtigen Stand zu nutzen, also als Sklave zu bleiben.
  rationale: Der unmittelbare Zusammenhang legt als unausgesprochenes Objekt die Möglichkeit des Freiwerdens nahe. Da der griechische Text das Objekt jedoch nicht nennt und beide Deutungen vertreten wurden, wird die Alternative ausdrücklich in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. „Sklave“ bildet den sozialen Status präzise ab. Die bewusst etwas offene Formulierung „nutze es“ erhält zusammen mit der Fußnote die Mehrdeutigkeit des griechischen Textes.
