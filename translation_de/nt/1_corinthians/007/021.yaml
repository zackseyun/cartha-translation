  verdict: approve
  source_fidelity: Der Haupttext gibt Δοῦλος mit „Sklave“ sozialgeschichtlich präzise wieder und bewahrt bei „berufen“ den knappen paulinischen Ausdruck ohne ergänzende Auslegung. „Lass dich davon nicht beunruhigen“ trifft μή σοι μελέτω idiomatisch. „frei werden“ entspricht ἐλεύθερος γενέσθαι. Die elliptische Wendung μᾶλλον χρῆσαι wird mit „nutze es lieber“ bewusst offen wiedergegeben; die Fußnote dokumentiert die gewichtige alternative Deutung.
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen seelsorgerlichem, nicht beschönigendem Register. Die direkte Anrede und der Satzrhythmus sind natürlich. Das demonstrative „es“ ist zwar absichtlich elliptisch, bleibt aber im Zusammenhang verständlich und trägt die griechische Offenheit angemessen mit.
  terminology: „Sklave“ ist hier gegenüber „Diener“ sachgerecht, da der rechtlich gebundene Status und die mögliche Freilassung im Vers ausdrücklich vorausgesetzt werden. „Berufen“, „frei werden“ und „gegenwärtiger Stand“ sind terminologisch stimmig. Die Fußnote wahrt die umstrittene Bezugnahme von χρῆσαι, ohne eine konfessionelle Auslegung zur alleinigen Lesart zu machen.
