  terminology: „ist nicht versklavt“ bewahrt die Wortwahl von δουλόω und vermeidet, die Aussage durch „gebunden“ zu einer technischen Eherechtsformel zu machen. „Bruder oder Schwester“ und „in Frieden berufen“ sind angemessen. Die Fußnoten sind korrekt verankert und die textkritische Anmerkung zu „euch“ bleibt erhalten.
