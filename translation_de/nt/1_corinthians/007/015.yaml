revisions:
- from: Wenn sich aber der ungläubige Teil[a] trennt, soll er sich trennen. Der Bruder oder die Schwester ist unter solchen Umständen nicht versklavt[b]; Gott hat uns[c] vielmehr in Frieden berufen.
  to: Wenn sich aber der ungläubige Ehepartner[a] trennt, soll er sich trennen. Der Bruder oder die Schwester ist unter solchen Umständen nicht versklavt[b]; aber Gott hat uns[c] in Frieden berufen.
  rationale: Die Revision ersetzt die unnatürliche und potenziell missverständliche Wendung „der ungläubige Teil“ durch die im Kontext präzise, geschlechtsübergreifende Formulierung „der ungläubige Ehepartner“. Die Fußnote macht weiterhin kenntlich, dass das griechische Substantiv selbst lediglich „der Ungläubige“ lautet. Außerdem wird das überstarke „vielmehr“ durch „aber“ ersetzt. Die Aussage über das Nicht-Versklavtsein bleibt bewusst ohne weitergehende Folgerung zu Eheauflösung oder Wiederheirat.
