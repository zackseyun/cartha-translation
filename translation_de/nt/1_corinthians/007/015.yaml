  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: de
  text: Wenn sich aber der ungläubige Ehepartner[a] trennt, soll er sich trennen. Der Bruder oder die Schwester ist unter solchen Umständen nicht versklavt[b]; aber Gott hat uns[c] in Frieden berufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Ungläubige“; im Zusammenhang ist der ungläubige Ehepartner gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ist nicht gebunden“. Das griechische Verb gehört zu δουλόω („versklaven“), nicht zu dem üblicheren Verb für „binden“.'
    reason: lexical_alternative
  - marker: c
    text: Einige Handschriften haben „euch“ statt „uns“.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: der ungläubige Teil
  rationale: Der substantivierte Ausdruck bezeichnet im Zusammenhang den nicht an Christus glaubenden Ehepartner. „Teil“ wahrt die geschlechtliche Offenheit, ohne „Ehepartner“ ausdrücklich in den Text einzutragen.
- source_word: χωρίζεται / χωριζέσθω
  choice: sich trennt / soll er sich trennen
  rationale: Die Wiederholung desselben deutschen Verbs bildet die griechische Wiederholung ab und legt nicht fest, ob eine räumliche Trennung oder eine rechtliche Scheidung gemeint ist. Der Imperativ lässt die Trennung zu, statt sie als anzustrebendes Ziel zu formulieren.
- source_word: οὐ δεδούλωται
  choice: ist nicht versklavt
  rationale: δουλόω bedeutet „versklaven“ und ist nicht das üblichere Verb δέω, „binden“. Die Formulierung bleibt lexikalisch nah am Ausgangstext und bestimmt den Umfang der damit bezeichneten Freiheit nicht näher.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: Der Bruder oder die Schwester
  rationale: Die ausdrückliche Nennung beider Formen bewahrt Paulus’ Bezeichnung der glaubenden Person als Bruder beziehungsweise Schwester.
- source_word: ἐν τοῖς τοιούτοις
  choice: unter solchen Umständen
  rationale: Die idiomatische Wendung verweist auf Fälle wie den soeben beschriebenen und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: ἐν δὲ εἰρήνῃ
  choice: vielmehr in Frieden
  rationale: „In Frieden“ wahrt die Präposition ἐν und lässt offen, ob Frieden vor allem den Bereich, die Weise oder die Ausrichtung der Berufung bezeichnet; „vielmehr“ bringt den Kontrast von δέ zur Geltung.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: Gott hat uns berufen
  rationale: Das deutsche Perfekt gibt den vollendeten Ruf mit fortdauernder Bedeutung natürlich wieder. „Uns“ folgt dem SBLGNT-Haupttext.
theological_decisions:
- issue: Bedeutung von οὐ δεδούλωται für Auflösung der Ehe und Wiederheirat
  choice: Lexikalisch als „ist nicht versklavt“ wiedergegeben, ohne daraus im Wortlaut eine umfassende Regel zur Wiederheirat abzuleiten.
  alternative: „ist nicht gebunden“ als technische Aussage über die Auflösung des Ehebandes; oder Freiheit lediglich von der Pflicht, dem fortgehenden Partner nachzugehen.
  rationale: Der Vers benennt Freiheit von Versklavung, erläutert aber deren gesamten rechtlichen oder theologischen Umfang nicht. Die Übersetzung bewahrt diese Spannung.
- issue: Referent von ὁ ἄπιστος
  choice: „der ungläubige Teil“, im Kontext der ungläubige Ehepartner
  alternative: „der Ungläubige“ oder ausdrücklich „der ungläubige Ehepartner“
  rationale: Der unmittelbare Zusammenhang macht die Ehebeziehung klar; die gewählte Form bleibt dennoch näher an der impliziten Ausdrucksweise des Griechischen und umfasst beide Geschlechter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „sich trennen“ und die Sklavereimetapher bleiben erhalten. „Der ungläubige Teil“ ist geschlechtsübergreifend und vermeidet eine unnötige Festlegung auf einen Ehemann; die Fußnote erklärt den wörtlicheren Ausdruck.
