reference: 1 Corinthians 7:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: de
  text: 'Daraus folgt: Wer seine Jungfrau[a] verheiratet, handelt gut; wer sie aber nicht verheiratet, wird besser handeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer seine jungfräuliche Verlobte heiratet, handelt gut; wer sie aber nicht heiratet, wird besser handeln.“ Eine weitere verbreitete Deutung versteht den Ausdruck als „seine jungfräuliche Tochter“. Das griechische Verb bedeutet hier eher „in die Ehe geben“ oder „verheiraten“; deshalb bewahrt der Haupttext diesen Sinn, ohne das genaue Verhältnis näher festzulegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Daraus folgt
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Erörterung und klingt im heutigen Deutschen natürlich.
- source_word: γαμίζων / μὴ γαμίζων
  choice: verheiratet / nicht verheiratet
  rationale: Das kausative Verb γαμίζω bedeutet hier am ehesten „in die Ehe geben“ beziehungsweise „verheiraten“ und wird daher nicht mit dem nichtkausativen „heiraten“ gleichgesetzt.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: seine Jungfrau
  rationale: Die knappe Wiedergabe bewahrt die Unbestimmtheit des griechischen Ausdrucks hinsichtlich des genauen Verhältnisses zwischen dem Mann und der Jungfrau; die möglichen Deutungen werden in der Fußnote genannt.
- source_word: καλῶς ποιεῖ
  choice: handelt gut
  rationale: Gibt das positive Werturteil idiomatisch wieder, ohne daraus ein absolutes Gebot zu machen.
- source_word: κρεῖσσον ποιήσει
  choice: wird besser handeln
  rationale: Bewahrt sowohl das Futur als auch den Komparativ κρεῖσσον und vermeidet die übersteigernde Wiedergabe „am besten“.
theological_decisions:
- issue: Bezug von „seine Jungfrau“ und Bedeutung von γαμίζω
  choice: Der Haupttext behält den kausativen Sinn „verheiraten“ bei und legt nicht fest, ob die Jungfrau eine Tochter oder eine andere dem Mann zugeordnete Person ist.
  alternative: 'Möglich ist die Deutung: „Wer seine jungfräuliche Verlobte heiratet, handelt gut; wer sie nicht heiratet, wird besser handeln.“ Häufig wird außerdem ausdrücklich an seine jungfräuliche Tochter gedacht.'
  rationale: 1. Korinther 7,36–38 ist in dieser Hinsicht umstritten. γαμίζω spricht eher für „verheiraten/in die Ehe geben“, während τὴν παρθένον ἑαυτοῦ das genaue soziale Verhältnis nicht ausdrücklich benennt. Die Übersetzung wahrt diese Spannung, statt eine bestimmte Rekonstruktion in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seine Jungfrau“ ist bewusst knapp und leicht ungewohnt, um die echte Mehrdeutigkeit des griechischen Ausdrucks nicht durch „Tochter“, „Mündel“ oder „Verlobte“ vorzeitig aufzulösen.
