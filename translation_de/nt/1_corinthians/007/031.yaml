  verdict: revise
  source_fidelity: 'Der Haupttext trifft χρώμενοι („gebrauchen“) und die Steigerung καταχρώμενοι („voll ausschöpfen/ausnutzen“) insgesamt gut. παράγει ist mit „vergeht“ angemessen wiedergegeben. Bei σχῆμα ist „Gestalt“ möglich, aber im heutigen Deutsch etwas zu offen und weniger präzise als „gegenwärtige Form“ für die vorübergehende Erscheinungsweise/Ordnung. Die Fußnote zu a gibt die missbräuchliche Lesart grammatisch und semantisch unzutreffend wieder: Nicht „als missbrauchten sie sie nicht“, sondern im Rahmen der Vergleichskonstruktion „als würden sie sie nicht missbrauchen“ bzw. als lexikalische Alternative zum Partizip „nicht missbrauchend“.'
  naturalness: „und die, die …“ ist verständlich, wirkt jedoch unnötig schwerfällig. „und wer …“ ist modernes, natürliches Standarddeutsch und bewahrt den generischen Charakter des griechischen Plurals. „von der Welt Gebrauch machen“ ist idiomatisch; „sie nicht voll ausschöpfen“ ist im Zusammenspiel damit prägnant und macht die Intensivierung hörbar.
  terminology: „Welt“ wahrt die Offenheit von κόσμος und ist korrekt. „gegenwärtige Form dieser Welt“ gibt σχῆμα und τούτου klar wieder, ohne eine Aussage über das Wesen der Schöpfung zu machen. Die alternative Bedeutung von καταχράομαι als missbräuchlicher Gebrauch wird in einer korrekt formulierten Fußnote bewahrt.
