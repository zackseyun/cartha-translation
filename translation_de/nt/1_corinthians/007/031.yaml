- from: und die, die von der Welt Gebrauch machen, als nutzten sie sie nicht voll aus[a]; denn die Gestalt[b] dieser Welt vergeht.
  to: und wer von der Welt Gebrauch macht, als würde er sie nicht voll ausschöpfen[a]; denn die gegenwärtige Form[b] dieser Welt vergeht.
  rationale: Die Überarbeitung glättet die Satzführung, erhält das Wortspiel zwischen „Gebrauch machen“ und „voll ausschöpfen“ und korrigiert die semantisch misslungene Alternativformulierung der ersten Fußnote. „Gegenwärtige Form“ präzisiert σχῆμα als vergängliche Erscheinungsweise der Welt, ohne deren Wesen zu bestimmen.
