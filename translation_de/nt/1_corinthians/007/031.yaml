source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: de
  text: und wer von der Welt Gebrauch macht, als würde er sie nicht voll ausschöpfen[a]; denn die gegenwärtige Form[b] dieser Welt vergeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als würde er sie nicht völlig gebrauchen“; das Verb kann auch den Sinn von „missbrauchen“ haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die äußere Form“ oder „die Erscheinungsweise“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: von … Gebrauch machen
  rationale: Gibt den üblichen Sinn von χράομαι natürlich wieder und ermöglicht zugleich, das Wortspiel mit καταχρώμενοι erkennbar zu halten.
- source_word: τὸν κόσμον
  choice: von der Welt
  rationale: κόσμος bezeichnet hier die gegenwärtige soziale und materielle Weltordnung; die knappe Wiedergabe „die Welt“ bewahrt die Offenheit des griechischen Ausdrucks.
- source_word: ὡς μὴ καταχρώμενοι
  choice: als nutzten sie sie nicht voll aus
  rationale: Die Formulierung erhält die Verstärkung gegenüber χρώμενοι und lässt die im Verb mögliche Bedeutung des vollständigen Nutzens erkennen, ohne den Sinn vorschnell auf Missbrauch einzuengen.
- source_word: παράγει
  choice: vergeht
  rationale: Das Präsens beschreibt den bereits stattfindenden vergänglichen Prozess; „vergeht“ ist im Deutschen knapp, gegenwärtig und idiomatisch.
- source_word: σχῆμα
  choice: Gestalt
  rationale: „Gestalt“ bezeichnet die wahrnehmbare beziehungsweise gegenwärtige Erscheinungs- und Ordnungsform, ohne sie mit dem eigentlichen Wesen der Welt gleichzusetzen.
- source_word: τοῦ κόσμου τούτου
  choice: dieser Welt
  rationale: Der Demonstrativ τούτου wird ausdrücklich wiedergegeben und hebt die gegenwärtige, vergängliche Weltordnung hervor.
theological_decisions:
- issue: Sinn von καταχρώμενοι im Verhältnis zu χρώμενοι
  choice: Die Welt gebrauchen, ohne sie voll auszunutzen
  alternative: Die Welt nicht missbrauchen
  rationale: Das Wortspiel zwischen χράομαι und καταχράομαι legt hier eine Steigerung nahe. Der Haupttext bewahrt den Gedanken begrenzten Gebrauchs; die Fußnote hält die mögliche Bedeutung „missbrauchen“ offen.
- issue: Bedeutung von σχῆμα
  choice: die vergängliche Gestalt beziehungsweise gegenwärtige Erscheinungsform der Welt
  alternative: nur der äußere Schein der Welt oder ihr eigentliches Wesen
  rationale: σχῆμα bezeichnet die derzeitige Form oder Verfassung. „Gestalt“ wahrt den eschatologischen Akzent, ohne eine Abwertung der Schöpfung oder eine Aussage über ihr Wesen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „von der Welt Gebrauch machen“ ist etwas gehobener, bewahrt aber das griechische Wortspiel besser als eine stärker paraphrasierende Fassung. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
