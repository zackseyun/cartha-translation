    rationale: '„als missbrauchten sie sie nicht“ vertauscht die semantische Richtung: Der griechische Ausdruck verneint καταχράομαι. Als deutsche Vergleichskonstruktion muss die Alternative etwa „als würden sie sie nicht missbrauchen“ lauten.'
  - severity: low
    issue: „Gestalt“ ist für σχῆμα weniger präzise und im modernen Deutsch leicht stilistisch markiert.
    rationale: „gegenwärtige Form“ gibt den zeitlich vorläufigen, äußeren bzw. konfigurativen Sinn kontextgerecht wieder und entspricht dem englischen Audit trail, ohne ihn zu überdeuten.
  revised_text: und wer von der Welt Gebrauch macht, als würde er sie nicht voll ausschöpfen[a]; denn die gegenwärtige Form[b] dieser Welt vergeht.
