source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: de
  text: Die Beschneidung ist nichts[a], und das Unbeschnittensein ist nichts, sondern das Halten der Gebote Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zählt nichts“; ebenso beim zweiten Vorkommen von „ist nichts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: Beschneidung
  rationale: Das übliche deutsche Substantiv bewahrt den Bezug auf das äußere Bundes- und Identitätsmerkmal sowie die Parallelität zum folgenden Gegenbegriff.
- source_word: οὐδέν ἐστιν
  choice: ist nichts
  rationale: Die bewusst schroffe, zweimal wiederholte Formulierung entspricht der griechischen Struktur. Die idiomatischere Alternative „zählt nichts“ wird in der Fußnote genannt.
- source_word: ἀκροβυστία
  choice: Unbeschnittensein
  rationale: Im Deutschen bezeichnet „Unbeschnittensein“ den hier gemeinten Zustand klarer und natürlicher als das fachsprachlich mögliche „Unbeschnittenheit“ und bleibt symmetrisch zur Beschneidung.
- source_word: ἀλλά
  choice: sondern
  rationale: Nach den beiden verneinten Aussagen markiert „sondern“ im Deutschen den starken Gegensatz zu dem, worauf es ankommt.
- source_word: τήρησις
  choice: das Halten
  rationale: Die substantivierte Wendung bildet das griechische Nomen nach und verbindet sich natürlich mit „Gebote“, ohne den Ausdruck zu „Gehorsam“ zu verallgemeinern.
- source_word: ἐντολῶν θεοῦ
  choice: der Gebote Gottes
  rationale: Die Formulierung wahrt den konkreten Plural und gibt die Genitivverbindung formal und in würdigem Standarddeutsch wieder.
theological_decisions:
- issue: Paulus’ Bewertung von Beschneidung und Unbeschnittensein
  choice: Beide äußeren Statusmerkmale werden gegenüber dem Halten der Gebote Gottes als „nichts“ bezeichnet.
  alternative: Die Aussage als Aufhebung jeder denkbaren moralischen Bedeutung der Beschneidung auslegen.
  rationale: Die Übersetzung erhält die Spannung des Verses und beschränkt sich auf Paulus’ ausdrücklichen Kontrast, ohne weitergehende konfessionelle Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Wiederholung und der substantivische Satzbau bewahren die markante rhetorische Form des Griechischen; die Fußnote bietet die idiomatischere deutsche Bedeutungsalternative.
