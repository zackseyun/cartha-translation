source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: de
  text: Das sage ich zu eurem eigenen Besten, nicht um euch eine Schlinge anzulegen, sondern im Blick auf das, was angemessen ist, und darauf, dem Herrn beständig und ohne Ablenkung zugewandt zu sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: Besten
  rationale: Bezeichnet das, was nützt oder zuträglich ist; „zu eurem eigenen Besten“ ist natürliches modernes Deutsch.
- source_word: βρόχον
  choice: Schlinge
  rationale: Bewahrt das konkrete und scharfe Bild einer Schlinge, statt es zu einem bloßen „Zwang“ oder „Hindernis“ abzuschwächen.
- source_word: εὔσχημον
  choice: das, was angemessen ist
  rationale: Gibt den Gedanken des Schicklichen, Anständigen oder geordnet Angemessenen wieder, ohne unnötig moralistisch zu verengen.
- source_word: εὐπάρεδρον
  choice: zu dienen
  rationale: Das seltene Wort bezeichnet ein beständiges Dabeisitzen beziehungsweise eine hingebungsvolle Verfügbarkeit; im Zusammenhang ist „dem Herrn … dienen“ verständlich, benötigt aber wegen der Textvariante und Bedeutungsbreite eine Fußnote.
- source_word: ἀπερισπάστως
  choice: ungeteilt und ohne Ablenkung
  rationale: Bringt sowohl die innere Ungeteiltheit als auch das Freisein von ablenkender Beanspruchung zum Ausdruck.
theological_decisions:
- issue: Ziel von Paulus’ Rat zum unverheirateten Leben
  choice: Als Förderung angemessenen, ungeteilten Dienstes am Herrn formuliert
  alternative: Als allgemeine Vorschrift oder geistliche Höherbewertung der Ehelosigkeit formulieren
  rationale: Der Vers erklärt ausdrücklich, dass Paulus keine Schlinge auferlegen will. Die Übersetzung lässt daher den Rat als Nutzen und Ermöglichung erscheinen, ohne eine bindende asketische Norm einzuführen.
- issue: Verhältnis von εὔσχημον und εὐπάρεδρον
  choice: Beide mit καί verbundenen Zielaspekte bleiben erkennbar
  alternative: Beide Begriffe zu einer einzigen Wendung wie „angemessene Hingabe“ verschmelzen
  rationale: 'Die koordinierte Struktur des griechischen Textes wird bewahrt: das Angemessene und die unabgelenkte Ausrichtung auf den Herrn.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet den erklärenden Gegensatz klar ab. Das kräftige Bild „eine Schlinge überwerfen“ bleibt erhalten; die abschließende Wendung ist idiomatisch formuliert und durch eine textnahe Fußnote abgesichert.
