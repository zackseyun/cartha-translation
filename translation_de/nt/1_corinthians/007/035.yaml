revisions:
- from: Das sage ich zu eurem eigenen Besten – nicht, um euch eine Schlinge überzuwerfen, sondern im Blick auf das, was angemessen ist und euch ermöglicht, dem Herrn ungeteilt und ohne Ablenkung zu dienen.[a]
  to: Das sage ich zu eurem eigenen Besten, nicht um euch eine Schlinge anzulegen, sondern im Blick auf das, was angemessen ist, und darauf, dem Herrn beständig und ohne Ablenkung zugewandt zu sein.
  rationale: Die Revision bewahrt die metaphorische Schärfe von βρόχον, die Koordination von „dem Angemessenen“ und der dem Herrn geltenden beständigen Zuwendung sowie den Sinn von ἀπερισπάστως. Sie vermeidet zugleich eine nicht im griechischen Text ausgedrückte Ermöglichungsaussage und entfernt die unpräzise Fußnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:50:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Grundgedanke ist zutreffend: Paulus spricht zum Nutzen der Adressaten, nicht um ihnen eine „Schlinge“ aufzuerlegen, sondern im Hinblick auf angemessenes Verhalten und eine unablässige, unabgelenkte Ausrichtung auf den Herrn. Die Fassung „euch ermöglicht, dem Herrn ... zu dienen“ macht jedoch aus der Zielbestimmung unnötig eine Ermöglichungsaussage und fasst die beiden koordinierten Zielaspekte zu stark zusammen.'
  naturalness: Modernes Deutsch und der würdige Registerton sind weitgehend gelungen. „Eine Schlinge überwerfen“ ist jedoch im Deutschen weniger idiomatisch als „eine Schlinge anzulegen“. Eine unmittelbarere Wiedergabe der abschließenden Zielbestimmung liest sich klarer.
  terminology: „zu eurem eigenen Besten“, „Schlinge“ und „angemessen“ sind angemessen. εὐπάρεδρον bezeichnet hier beständige Verfügbarkeit bzw. zugewandte Hingabe an den Herrn; zusammen mit ἀπερισπάστως lässt sich dies natürlich als „dem Herrn beständig und ohne Ablenkung zugewandt zu sein“ ausdrücken. Die vorhandene Fußnote ist nicht erforderlich und ihre Behauptung einer abweichenden Handschriftenformulierung ist zu unbestimmt.
  issues:
  - severity: medium
    issue: Die Zielkonstruktion wird umgedeutet.
    rationale: „... und euch ermöglicht, ... zu dienen“ fügt ein kausatives „ermöglicht“ ein, das πρὸς nicht ausdrückt, und verschmilzt τὸ εὔσχημον und εὐπάρεδρον zu weitgehend.
  - severity: low
    issue: Die Fußnote ist sprachlich und textkritisch nicht hinreichend präzise.
    rationale: Die Umschreibung „beständige[s] Dabeisein“ ist kein gutes modernes Deutsch; zudem wird eine Handschriftenabweichung erwähnt, ohne Lesart oder Auswirkung verlässlich zu benennen. Für den Text der SBLGNT ist keine Fußnote nötig.
  - severity: low
    issue: „eine Schlinge überwerfen“ ist unidiomatisch.
    rationale: „Eine Schlinge anzulegen“ bewahrt das Bild von βρόχος und ist im modernen Standarddeutsch geläufiger.
  revised_text: Das sage ich zu eurem eigenen Besten, nicht um euch eine Schlinge anzulegen, sondern im Blick auf das, was angemessen ist, und darauf, dem Herrn beständig und ohne Ablenkung zugewandt zu sein.
  revised_footnotes: []
