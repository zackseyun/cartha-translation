  rationale: Die geringfügige stilistische Anpassung macht die Aussage flüssiger, ohne die freiwillige Zustimmung des Mannes oder die allgemeine Bedingung abzuschwächen. Die überarbeitete Fußnote wahrt die lexikalische Offenheit von ἀφίημι und erläutert zugleich behutsam seinen ehelichen Kontext, ohne eine bestimmte rechtliche Form der Scheidung vorzuschreiben.
