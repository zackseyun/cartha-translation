source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: de
  text: Und wenn eine Frau einen ungläubigen Mann hat und dieser bereit ist, mit ihr zusammenzuleben, soll sie ihren Mann nicht verlassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch „entlassen“ oder „fortschicken“ bedeuten. Im ehelichen Zusammenhang bezeichnet es das Beenden der ehelichen Beziehung und kann daher auch mit „sich trennen“ umschrieben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Durch ἔχει ἄνδρα und den Zusammenhang ist eine verheiratete Frau gemeint; „eine Frau … einen Mann hat“ ist im Deutschen natürlich und eindeutig ehelich.
- source_word: εἴ τις
  choice: wenn eine Frau
  rationale: Die unbestimmte Bedingung beschreibt einen allgemeinen Fall. „Wenn eine Frau“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: ἄνδρα / τὸν ἄνδρα
  choice: Mann / ihren Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ heißen. Der eheliche Zusammenhang verlangt hier „Mann“ im Sinn von „Ehemann“; beim zweiten Vorkommen verdeutlicht das Possessivpronomen den bereits genannten Ehepartner.
- source_word: ἄπιστον
  choice: ungläubigen
  rationale: Gemeint ist ein Ehemann, der den christlichen Glauben seiner Frau nicht teilt. „Ungläubig“ vermeidet die mögliche Fehlbedeutung ehelicher Untreue.
- source_word: οὗτος
  choice: dieser
  rationale: Das Demonstrativpronomen verweist ausdrücklich auf den soeben genannten ungläubigen Ehemann. „Dieser“ bildet diesen Rückverweis knapp und klar ab.
- source_word: συνευδοκεῖ
  choice: damit einverstanden ist
  rationale: Das Verb bezeichnet zustimmende Bereitschaft. Die Wendung ist in modernem Deutsch natürlich und bewahrt den Gedanken freiwilliger Zustimmung.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: mit ihr zusammenzuleben
  rationale: Die Wendung bezeichnet das fortgesetzte gemeinsame häusliche beziehungsweise eheliche Leben. „Zusammenzuleben“ gibt dies klar und idiomatisch wieder.
- source_word: μὴ ἀφιέτω
  choice: soll … nicht verlassen
  rationale: ἀφίημι kann „verlassen“, „fortschicken“ oder „entlassen“ bedeuten. Im ehelichen Zusammenhang geht es um die Beendigung der Beziehung; „nicht verlassen“ bleibt nahe am griechischen Ausdruck, ohne ihn vorschnell auf einen bestimmten rechtlichen Scheidungsvorgang festzulegen.
theological_decisions:
- issue: Bedeutung von ἀφιέτω in einer Ehe zwischen einer gläubigen und einer ungläubigen Person
  choice: „soll sie ihren Mann nicht verlassen“
  alternative: „soll sie sich nicht von ihrem Mann scheiden lassen“ oder „soll sie ihren Mann nicht entlassen“
  rationale: Die Anweisung zielt darauf, die Ehe nicht zu beenden, wenn der ungläubige Partner zum Zusammenleben bereit ist. „Verlassen“ bewahrt die lexikalische Offenheit des Verbs und vermeidet eine nicht ausdrücklich markierte Festlegung auf ein bestimmtes rechtliches Scheidungsverfahren; die Fußnote erläutert den ehelichen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Bedingungssatz, bleibt aber flüssig. Die Wiederholung von „Mann“ erhält die ausdrückliche Rückbindung des Ausgangstextes; die Fußnote bewahrt die Bedeutungsbreite von ἀφίημι.
