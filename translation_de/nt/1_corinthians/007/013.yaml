  naturalness: „Damit einverstanden ist, mit ihr zusammenzuleben“ ist zwar verständlich, aber im modernen Standarddeutsch unnötig schwerfällig. Ohne „damit“ ist die Infinitivkonstruktion idiomatischer. „Bereit ist“ gibt die willentliche Zustimmung von συνευδοκεῖ natürlich wieder.
  terminology: '„Ungläubiger Mann“ ist im paulinischen Kontext als nicht an den christlichen Glauben glaubender Ehepartner angemessen. „Mann“ und „ihren Mann“ machen den ehelichen Bezug hinreichend deutlich. Die Fußnote sollte die Alternative präziser darstellen: „sich trennen“ ist keine unmittelbare lexikalische Übersetzung des aktiven ἀφίημι, sondern eine kontextuelle Umschreibung.'
