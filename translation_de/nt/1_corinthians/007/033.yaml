id: 1CO.7.33
reference: 1 Corinthians 7:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: de
  text: Der verheiratete Mann aber sorgt sich um die Dinge der Welt[a], wie er seiner Frau gefallen kann,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weltliche Angelegenheiten« oder »die Angelegenheiten der Welt«.'
    reason: Lexikalische Alternativen für τὰ τοῦ κόσμου.
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: der verheiratete Mann aber
  rationale: Das substantivierte Partizip im maskulinen Singular bezeichnet im Gegensatz zum unverheirateten Mann des Kontexts einen verheirateten Mann. Die deutsche Formulierung ist natürlich und bewahrt mit »aber« den Kontrast.
- source_word: μεριμνᾷ
  choice: sorgt sich um
  rationale: Das Verb kann Sorge, Besorgnis oder fürsorgliche Beschäftigung ausdrücken. »Sorgt sich um« lässt diese Spannweite offen, ohne die ehelichen Pflichten notwendig als sündhafte Angst darzustellen.
- source_word: τὰ τοῦ κόσμου
  choice: die Dinge der Welt
  rationale: Die Wiedergabe folgt der griechischen nominalen Konstruktion eng und bezeichnet Angelegenheiten des gewöhnlichen Lebens, ohne κόσμος vorschnell moralisch negativ zu deuten.
- source_word: πῶς ἀρέσῃ
  choice: wie er … gefallen kann
  rationale: Die Konstruktion bezeichnet den Inhalt seiner Sorge, nämlich wie er seiner Frau gefallen kann. »Kann« gibt den griechischen Konjunktiv in natürlichem Deutsch wieder.
- source_word: τῇ γυναικί
  choice: seiner Frau
  rationale: γυνή bedeutet im ehelichen Zusammenhang eindeutig »Ehefrau/Frau«. Das Possessivpronomen ist im Deutschen idiomatisch und aus dem Kontext erschlossen.
theological_decisions:
- issue: Ob κόσμος hier moralisch abwertend wiederzugeben ist
  choice: Neutral als »die Dinge der Welt« wiedergegeben
  alternative: Abwertend als »weltliche Dinge« oder »weltliche Angelegenheiten«
  rationale: Im Zusammenhang stellt Paulus die praktischen Bindungen des Ehelebens der ungeteilten Hinwendung zum Herrn gegenüber; er verurteilt damit weder die Ehe noch alltägliche Verantwortung pauschal. Die neutrale Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Griechischen, ist aber idiomatisch; das abschließende Komma berücksichtigt, dass der Gedankengang im folgenden Vers weitergeführt wird.
