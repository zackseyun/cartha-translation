  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: de
  text: Wenn sie sich aber nicht beherrschen können, sollen sie heiraten; denn es ist besser zu heiraten als zu brennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfach: „als zu brennen“. Das Griechische sagt nicht ausdrücklich, worin dieses Brennen besteht; im Zusammenhang ist sehr wahrscheinlich sexuelles Verlangen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: sich beherrschen können
  rationale: Das Verb bezeichnet hier sexuelle Selbstbeherrschung. Mit der Verneinung gibt die deutsche Formulierung natürlich wieder, dass diese Selbstbeherrschung nicht gelingt, ohne daraus eine feste Eigenschaft zu machen.
- source_word: γαμησάτωσαν
  choice: sollen sie heiraten
  rationale: Der Imperativ der dritten Person Plural wird im modernen Deutschen klar und würdig mit „sollen sie heiraten“ wiedergegeben.
- source_word: κρεῖττον
  choice: besser
  rationale: „Besser“ ist die unmittelbare und idiomatische Entsprechung des prädikativ gebrauchten Komparativs.
- source_word: γαμῆσαι
  choice: zu heiraten
  rationale: Der Infinitiv wird direkt und natürlich wiedergegeben.
- source_word: πυροῦσθαι
  choice: vor Verlangen zu brennen
  rationale: Das Passiv/Medium bewahrt das Bild des Brennens; „vor Verlangen“ macht den im Zusammenhang sehr wahrscheinlichen sexuellen Bezug verständlich, ohne das Bild aufzugeben.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ kennzeichnet den milden Gegensatz zur vorausgehenden Aussage.
theological_decisions:
- issue: Bedeutung von πυροῦσθαι im Zusammenhang
  choice: vor sexuellem Verlangen brennen
  alternative: brennen; im Gericht brennen
  rationale: Der unmittelbare Zusammenhang stellt mangelnde Selbstbeherrschung und Heirat einander gegenüber; daher ist sexuelles Verlangen am wahrscheinlichsten. Die Fußnote erhält dennoch die knappere, im Griechischen ausdrücklichere Formulierung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der knappe Satzbau und die argumentative Gegenüberstellung des Griechischen bleiben erhalten.
