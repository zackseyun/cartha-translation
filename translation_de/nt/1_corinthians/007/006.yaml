source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: de
  text: Das aber sage ich als Zugeständnis[a], nicht als Gebot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Sinne eines Zugeständnisses« oder »als Erlaubnis«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Das
  rationale: Das Demonstrativpronomen verweist auf die im Zusammenhang stehende Aussage, ohne festzulegen, ob der Rück- oder Vorverweis im Vordergrund steht.
- source_word: δὲ
  choice: aber
  rationale: Das Wort markiert hier einen milden Gegensatz beziehungsweise Übergang und leitet die Abgrenzung vom verbindlichen Gebot ein.
- source_word: λέγω
  choice: sage ich
  rationale: Der einfache Präsens entspricht dem griechischen Präsens Indikativ und klingt im Deutschen natürlich.
- source_word: κατὰ συγγνώμην
  choice: als Zugeständnis
  rationale: Die Wendung bezeichnet hier eine einräumende Erlaubnis und steht ausdrücklich im Gegensatz zu einer verbindlichen Anordnung.
- source_word: συγγνώμην
  choice: Zugeständnis
  rationale: In diesem Zusammenhang bedeutet das Substantiv nicht Vergebung, sondern ein erlaubendes Entgegenkommen. »Zugeständnis« bewahrt den Gegensatz zu ἐπιταγήν klar.
- source_word: οὐ
  choice: nicht
  rationale: Dies ist die natürliche deutsche Wiedergabe der Verneinung.
- source_word: κατ’ ἐπιταγήν
  choice: als Gebot
  rationale: Die Wendung bezeichnet eine autoritative Anordnung. »Als Gebot« ist klar und bildet einen prägnanten Gegensatz zu »als Zugeständnis«.
- source_word: ἐπιταγήν
  choice: Gebot
  rationale: »Gebot« gibt den Gedanken einer verbindlichen Anordnung würdig und verständlich wieder, ohne den Ausdruck unnötig zu verschärfen.
theological_decisions:
- issue: Ob Paulus hier lediglich eine persönliche Erlaubnis erteilt oder ein weniger verbindliches göttliches Gebot ausspricht
  choice: Paulus kennzeichnet die Aussage ausdrücklich als Zugeständnis und nicht als verbindliches Gebot.
  alternative: Die Aussage kann dennoch mittelbare apostolische Autorität besitzen.
  rationale: Der Wortlaut stellt Zugeständnis und Gebot einander gegenüber. Die Übersetzung bewahrt diese Unterscheidung, ohne weitergehend über den Umfang der apostolischen Autorität zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Formulierung »Das aber« bewahrt sowohl den milden Gegensatz als auch die mögliche Rück- oder Vorverweisung des griechischen Demonstrativpronomens.
