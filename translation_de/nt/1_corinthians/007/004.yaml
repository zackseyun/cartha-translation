  rationale: Die Revision präzisiert die im Kontext ehelichen Bezeichnungen und gibt ἐξουσιάζει mit „hat ... Verfügungsgewalt über“ wieder. Dadurch bleibt die beidseitige, exakt parallele Autoritätsaussage des griechischen Textes erhalten. Die entbehrliche und missverständliche Fußnote wird entfernt, da die Hauptübersetzung die relevante Bedeutung ausreichend klar ausdrückt.
