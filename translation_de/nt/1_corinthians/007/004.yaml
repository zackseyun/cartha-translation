review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die syntaktische und semantische Parallelität des griechischen Textes im Wesentlichen zutreffend wieder. Im ehelichen Kontext sind „Frau“ und „Mann“ verständlich, doch „Ehefrau“ und „Ehemann“ machen die durch γυνή und ἀνήρ hier eindeutig bestimmte Beziehung explizit. Für ἐξουσιάζει ist „hat keine Verfügungsgewalt über“ näher an der Aussage des Verbs als das etwas weitere „verfügt nicht über“ und erhält die Aussage über Autorität klarer.
  naturalness: Die Satzstruktur ist flüssig und modern. Mit „hat keine Verfügungsgewalt über“ bleibt sie idiomatisch, auch wenn der Ausdruck etwas formeller ist; dies passt zum würdigen Register und verhindert eine Lesart bloßen Besitzens.
  terminology: '„Verfügungsgewalt“ trifft den Autoritätsaspekt von ἐξουσιάζει angemessen und wahrt die wechselseitige Aussage ohne hierarchische oder zwangsförmige Zusätze. Die Fußnote des Entwurfs ist jedoch semantisch fehlerhaft formuliert: Das Verb bezeichnet nicht den „Besitz“ von Vollmacht als Gegenbegriff zur Ausübung, sondern das Innehaben bzw. Ausüben von Autorität. Außerdem sollte die Fußnote die im Haupttext gewählte Nuance nicht als bloße Alternative doppeln.'
  issues:
