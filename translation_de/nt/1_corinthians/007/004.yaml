    issue: Die Fußnote erklärt ἐξουσιάζει mit „Besitz ... von Vollmacht“.
    rationale: Diese Formulierung ist missverständlich und nicht die präziseste Wiedergabe der verbalen Bedeutung. Gemeint ist, Autorität bzw. Verfügungsgewalt innezuhaben oder auszuüben.
  - severity: low
    issue: „Frau“ und „Mann“ bleiben im Deutschen theoretisch weiter als die ehelichen Rollenbezeichnungen.
    rationale: Der Kontext klärt den Sinn, aber „Ehefrau“ und „Ehemann“ geben die kontextuell spezifische Bedeutung von γυνή und ἀνήρ ohne Zusatzdeutung unmittelbar wieder.
