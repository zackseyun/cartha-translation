  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: de
  text: Die Ehefrau hat keine Verfügungsgewalt über ihren eigenen Körper, sondern der Ehemann; ebenso hat auch der Ehemann keine Verfügungsgewalt über seinen eigenen Körper, sondern die Ehefrau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γυνή
  choice: die Frau
  rationale: Im unmittelbaren Ehekontext bezeichnet γυνή die Ehefrau. Im Deutschen ist „die Frau“ in der Gegenüberstellung mit „der Mann“ natürlich und eindeutig ehelich zu verstehen.
- source_word: ὁ ἀνήρ
  choice: der Mann
  rationale: Im Ehekontext bezeichnet ἀνήρ den Ehemann. „Der Mann“ bildet im Deutschen die natürliche, parallele Entsprechung zu „die Frau“.
- source_word: τοῦ ἰδίου σώματος
  choice: über ihren/seinen eigenen Körper
  rationale: ἴδιος betont den eigenen, der jeweiligen Person zugehörigen Körper; „eigenen Körper“ bewahrt diesen Nachdruck.
- source_word: ἐξουσιάζει
  choice: verfügt über
  rationale: Das Verb bezeichnet das Haben oder Ausüben von Vollmacht beziehungsweise Verfügungsgewalt. „Verfügt über“ ist im Deutschen idiomatisch, wahrt die relationale Kraft und vermeidet eine unnötig herrschaftliche Zuspitzung.
- source_word: ἀλλά
  choice: sondern
  rationale: Nach der Verneinung gibt ἀλλά den ausschließenden Gegensatz natürlich mit „sondern“ wieder.
- source_word: ὁμοίως δὲ καὶ
  choice: ebenso … auch
  rationale: Diese Formulierung erhält die betonte, wechselseitige Parallelität der beiden Satzhälften.
theological_decisions:
- issue: Art der ehelichen Vollmacht im Vers
  choice: Die Aussage wird als vollkommen wechselseitige Verfügungsbefugnis formuliert, ohne über den Wortlaut hinaus Hierarchie oder Zwang einzutragen.
  alternative: „gehört nicht sich selbst“ oder stärker „wird vom Ehepartner beherrscht“
  rationale: Der griechische Satz stellt beide Ehepartner in exakt parallelen Aussagen nebeneinander. Die Übersetzung bewahrt diese Gegenseitigkeit und lässt offen, ob ἐξουσιάζει primär den Besitz oder die Ausübung von Vollmacht hervorhebt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzstruktur des griechischen Textes wird möglichst genau erhalten; „Frau“ und „Mann“ sind durch den Ehekontext als Ehefrau und Ehemann bestimmt.
