translation:
  language: de
  text: Denn woher weißt du als Frau, ob du deinen Mann retten wirst?[a] Oder woher weißt du als Mann, ob du deine Frau retten wirst?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „Denn woher kannst du als Frau wissen, ob du deinen Mann retten kannst?“ Das Griechische verwendet in der indirekten Frage ein Futur („retten wirst“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Denn woher weißt du
  rationale: τί mit οἶδας ist hier idiomatisch als Frage nach der Erkenntnismöglichkeit zu verstehen. „Woher weißt du“ ist im Deutschen natürlich und bewahrt den rhetorischen Charakter; „denn“ gibt die begründende Funktion von γάρ wieder.
- source_word: γύναι
  choice: Frau
  rationale: Im Ehekontext bezeichnet γυνή die Ehefrau. In direkter Anrede ist „Frau“ im Deutschen natürlicher als „Ehefrau“, während der folgende Ausdruck „deinen Mann“ die eheliche Beziehung eindeutig macht.
- source_word: ἄνερ
  choice: Mann
  rationale: Im Ehekontext bezeichnet ἀνήρ den Ehemann. Die direkte Anrede „Mann“ erhält die knappe Parallelität des griechischen Textes; „deine Frau“ verdeutlicht den ehelichen Bezug.
- source_word: σώσεις
  choice: du ... retten wirst
  rationale: Die Wiedergabe mit Futur bewahrt die Form des griechischen Futurindikativs. In der mit εἰ eingeleiteten indirekten Frage wird damit keine sichere Vorhersage ausgesprochen, sondern eine offene Möglichkeit zur Frage gestellt.
- source_word: τὸν ἄνδρα
  choice: deinen Mann
  rationale: Der bestimmte Artikel verweist im Kontext auf den jeweiligen Ehepartner. Das Deutsche drückt diese Beziehung idiomatisch mit dem Possessivpronomen aus.
- source_word: τὴν γυναῖκα
  choice: deine Frau
  rationale: Der bestimmte Artikel verweist auf die Ehefrau des angeredeten Mannes; im Deutschen ist die possessive Form natürlich und eindeutig.
- source_word: ἢ
  choice: Oder
  rationale: „Oder“ gibt die disjunktive Verbindung der beiden streng parallelen Fragen direkt wieder.
theological_decisions:
- issue: Bedeutung von σῴζω im Ehekontext
  choice: „retten“ beibehalten
  alternative: „zum Glauben führen“ oder „die Ehe bewahren“
  rationale: „Retten“ bewahrt die mögliche heilsgeschichtliche beziehungsweise geistliche Tragweite des Verbs, ohne sie durch eine engere Deutung auf Bekehrung oder Erhaltung der Ehe festzulegen.
- issue: Gewissheit oder Möglichkeit im Futur σώσεις
  choice: Das Futur im Haupttext formal bewahren und seine offene Funktion in einer Fußnote erläutern
  alternative: Im Haupttext „retten kannst“ oder „vielleicht retten wirst“
  rationale: Die indirekte Frage mit εἰ lässt den Ausgang offen. Die formnahe Wiedergabe wahrt zugleich die grammatische Gestalt und die theologische Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die parallele Anrede und das griechische Futur bleiben erhalten; die Fußnote erläutert die im Deutschen mögliche idiomatischere Lesart.
