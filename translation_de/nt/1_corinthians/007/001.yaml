  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: de
  text: 'Was aber das betrifft, worüber ihr geschrieben habt: Es ist gut für einen Mann, eine Frau nicht zu berühren.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Eine Frau berühren“ kann hier eine Umschreibung für sexuellen Kontakt sein. Möglicherweise greift Paulus dabei eine Aussage aus dem Brief der Korinther auf.
    reason: Erläutert den wahrscheinlichen Euphemismus und bewahrt zugleich die Unsicherheit darüber, ob der Satz ein Zitat der Korinther ist.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Zu dem, was ihr geschrieben habt
  rationale: Gibt den Themenwechsel und den Rückbezug auf den Brief der Gemeinde natürlich wieder, ohne ein zeitliches „nun“ einzufügen.
- source_word: καλόν
  choice: Es ist gut
  rationale: Bewahrt die knappe wertende Aussage des griechischen Textes, ohne sie als Gebot zu verschärfen.
- source_word: ἀνθρώπῳ
  choice: für einen Mann
  rationale: Obwohl ἄνθρωπος allgemein „Mensch“ heißen kann, legt die Gegenüberstellung mit γυνή hier die Bedeutung „Mann“ nahe.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: eine Frau nicht zu berühren
  rationale: Bewahrt die konkrete und möglicherweise euphemistische Ausdrucksweise des Ausgangstextes; eine explizite Wiedergabe als „keinen Geschlechtsverkehr haben“ würde die Deutung im Haupttext festlegen.
theological_decisions:
- issue: Mögliche sexuelle Bedeutung von „berühren“
  choice: Die wörtliche Formulierung bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
  alternative: „keine sexuellen Beziehungen mit einer Frau zu haben“
  rationale: Das Verb kann in diesem Zusammenhang ein Euphemismus für sexuellen Kontakt sein, doch die Bildsprache und ihre gewisse Offenheit sollen nicht stillschweigend beseitigt werden.
- issue: Mögliches Zitat aus dem Brief der Korinther
  choice: Der Haupttext setzt keine Anführungszeichen; die Möglichkeit eines Zitats wird in der Fußnote genannt.
  alternative: „Es ist gut für einen Mann, eine Frau nicht zu berühren.“ als ausdrücklich markiertes Zitat
  rationale: Der griechische Text enthält keine eindeutige Zitatmarkierung. Ob Paulus eine Aussage der Korinther zitiert oder selbst formuliert, bleibt umstritten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „ihr“ entspricht dem gemeindlichen Plural. Die knappe Satzstruktur und die mögliche Doppeldeutigkeit des Ausgangstextes bleiben erhalten.
