  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: de
  text: 'Den Übrigen aber sage ich – ich, nicht der Herr –: Wenn ein Bruder eine ungläubige Frau hat und sie einverstanden ist, mit ihm zusammenzuleben, soll er sich nicht von ihr trennen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll er sie nicht verlassen“, „soll er sie nicht fortschicken“ oder „soll er sich nicht von ihr scheiden lassen“. Das griechische Verb kann „verlassen“ oder „fortschicken“ bedeuten; hier geht es um die Beendigung der Ehe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Den Übrigen aber
  rationale: „Die Übrigen“ bezeichnet die noch nicht behandelte Gruppe; „aber“ gibt δέ als leichten Übergang beziehungsweise Kontrast wieder.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: sage ich – ich, nicht der Herr
  rationale: Das ausdrücklich gesetzte ἐγώ wird durch die Wiederholung von „ich“ betont. Die Gedankenstriche bewahren den parenthetischen Charakter, ohne die Aussage als bloße Privatmeinung auszulegen.
- source_word: ἀδελφὸς
  choice: Bruder
  rationale: Der maskuline Singular bezeichnet hier konkret einen männlichen Glaubenden im Gegenüber zu seiner Frau; „Bruder“ wahrt diese Form und den gemeindlichen Sprachgebrauch.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: eine ungläubige Frau hat
  rationale: Die Wendung bezeichnet eine Ehefrau. „Ungläubig“ bezieht sich in diesem Zusammenhang auf den christlichen Glauben und nicht auf eheliche Untreue.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: und sie einverstanden ist
  rationale: συνευδοκέω drückt Zustimmung beziehungsweise Bereitschaft aus. Die Formulierung ist im modernen Deutschen natürlich und wahrt den willentlichen Aspekt.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: mit ihm zusammenzuleben
  rationale: Gemeint ist das gemeinsame häusliche und eheliche Leben; „zusammenzuleben“ gibt dies knapp und idiomatisch wieder.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: soll er sich nicht von ihr trennen
  rationale: ἀφίημι kann „fortschicken“, „verlassen“ oder im ehelichen Zusammenhang „sich trennen/scheiden“ bedeuten. „Sich von ihr trennen“ bewahrt im Deutschen etwas mehr von der lexikalischen Breite als ausschließlich „sich scheiden lassen“.
theological_decisions:
- issue: Paulus’ Aussage „ich, nicht der Herr“
  choice: Die wörtliche Unterscheidung zwischen Paulus’ eigener Weisung und einer Weisung des Herrn wird bewahrt.
  alternative: Die Aussage als bloße, unverbindliche Privatmeinung des Paulus zu formulieren oder ausdrücklich als Hinweis auf ein fehlendes überliefertes Jesuswort zu erklären.
  rationale: Der griechische Text markiert eine Spannung, erläutert sie aber an dieser Stelle nicht. Die Übersetzung soll weder apostolische Autorität bestreiten noch eine bestimmte Erklärung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am griechischen Gedankengang, wird aber durch Gedankenstrich und Doppelpunkt gut lesbar gegliedert. Der Fußnotenmarker steht unmittelbar nach der betroffenen Wendung.
