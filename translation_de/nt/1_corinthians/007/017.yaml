source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: de
  text: Nur soll jeder so leben[a], wie der Herr es ihm zugeteilt[b] hat und wie Gott ihn berufen hat. Und so ordne ich es in allen Gemeinden an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gehen“ oder „wandeln“; gemeint ist die Lebensführung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zugemessen“ beziehungsweise „zugewiesen“. Das griechische Verb bezeichnet das, was der Herr jedem Einzelnen gegeben oder zugeteilt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Doch
  rationale: Die Wendung leitet hier keine eigentliche Bedingung ein, sondern einen einschränkenden beziehungsweise adversativen Grundsatz nach der vorangehenden Einzelfallbesprechung.
- source_word: ἑκάστῳ / ἕκαστον
  choice: jeder / ihm / ihn
  rationale: Die deutsche Satzgestalt bewahrt den distributiven Bezug auf jeden Einzelnen, ohne die griechische Wiederholung unnatürlich nachzubilden.
- source_word: ἐμέρισεν
  choice: zugeteilt
  rationale: Das Verb bezeichnet hier das vom Herrn einem Menschen zugewiesene oder zugemessene Lebensverhältnis. „Zugeteilt“ bleibt nahe am Bild des Verteilens, ohne den möglichen Umfang vorschnell festzulegen.
- source_word: κέκληκεν
  choice: berufen hat
  rationale: „Berufen“ gibt den paulinischen Gebrauch von καλέω angemessen wieder; das deutsche Perfekt kann den vollzogenen Ruf mit fortdauernder Bedeutung ausdrücken.
- source_word: περιπατείτω
  choice: soll so leben
  rationale: Das griechische „gehen/wandeln“ ist eine Metapher für die Lebensführung. Im modernen Deutschen vermittelt „leben“ die gemeinte Aufforderung klarer; die Metapher wird in einer Fußnote kenntlich gemacht.
- source_word: διατάσσομαι
  choice: ordne ich … an
  rationale: Die Formulierung gibt den autoritativen Charakter der apostolischen Weisung wieder, ohne den Ton unnötig zu verschärfen.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: in allen Gemeinden
  rationale: „Gemeinden“ bezeichnet im paulinischen Kontext natürlich und präzise die örtlichen christlichen Gemeinschaften.
theological_decisions:
- issue: Unterscheidung zwischen „der Herr“ und „Gott“
  choice: Beide Bezeichnungen werden in den parallelen Satzteilen getrennt beibehalten.
  alternative: Beide Bezeichnungen als bloße stilistische Variation angleichen.
  rationale: Der griechische Text setzt ὁ κύριος und ὁ θεός ausdrücklich nebeneinander; die Übersetzung harmonisiert diese Unterscheidung nicht.
- issue: Bezug von Zuteilung und Berufung auf die Lebenssituation
  choice: Die Satzverknüpfung bleibt offen genug, um sowohl die zugeteilte Lage als auch den Ruf Gottes zur Lebensführung zu erfassen.
  alternative: Die Berufung ausschließlich als Berufung innerhalb eines bestimmten gesellschaftlichen Standes auslegen.
  rationale: Der Zusammenhang legt die bestehende Lebenslage nahe, doch der Wortlaut sollte nicht stärker dogmatisch oder sozial festgelegt werden als das Griechische.
- issue: Metaphorischer Gebrauch von περιπατέω
  choice: Im Haupttext steht idiomatisch „leben“, während die wörtliche Metapher in der Fußnote genannt wird.
  alternative: Wörtlich „wandeln“ schreiben.
  rationale: „Wandeln“ wirkt im heutigen Standarddeutsch stark bibelsprachlich und kann missverständlich sein; „leben“ wahrt die ethische Reichweite der Aufforderung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax wurde gegenüber der griechischen Wortfolge behutsam geglättet. „Gemeinden“ ist im Deutschen natürlicher als „Kirchen“ für örtliche christliche Gemeinschaften; „ordne … an“ bewahrt den verbindlichen Charakter der Aussage.
