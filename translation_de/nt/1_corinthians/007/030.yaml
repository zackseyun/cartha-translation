  verdict: revise
  source_fidelity: 'Die drei parallelen Gruppen und die wiederholte ὡς μή-Konstruktion sind grundsätzlich zutreffend wiedergegeben. Im letzten Glied ist „als besäßen sie nichts“ jedoch zu weitgehend: Das Griechische sagt nicht, dass die Kaufenden überhaupt keinen Besitz hätten, sondern setzt im Kontrast zum Kaufen das Erworbene als nicht fest besessen voraus. „Es“ macht den im Kontext von ἀγοράζοντες naheliegenden Bezug deutlich.'
  naturalness: „Die weinen / die sich freuen / die kaufen“ ist im modernen Standarddeutsch natürlicher als die substantivierten Partizipien „die Weinenden / die sich Freuenden / die Kaufenden“, ohne die rhetorische Reihung zu verlieren. Die Vergleichssätze mit „als“ und Konjunktiv sind idiomatisch.
  terminology: „weinen“, „sich freuen“, „kaufen“ und „besitzen“ geben κλαίω, χαίρω, ἀγοράζω und κατέχω angemessen wieder. Die Formulierung vermeidet sowohl eine asketische Verschärfung als auch eine Leugnung der genannten Erfahrungen.
  issues:
