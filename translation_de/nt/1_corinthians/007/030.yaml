source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: de
  text: und die weinen, als weinten sie nicht,[a] und die sich freuen, als freuten sie sich nicht, und die kaufen, als besäßen sie es nicht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie nicht Weinende … wie nicht sich Freuende … wie nicht Besitzende“. Das wiederholte griechische „wie nicht“ beschreibt die Haltung beziehungsweise Weise des Handelns; es bestreitet nicht, dass tatsächlich geweint, sich gefreut oder gekauft wird. „Es“ im letzten Glied bezieht sich auf das Erworbene; im Griechischen ist das Objekt nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: die Weinenden
  rationale: Das substantivierte Präsenspartizip bezeichnet Menschen, die weinen. „Die Weinenden“ ist knapp, würdevoll und bewahrt die griechische Parallelstruktur.
- source_word: ὡς μὴ κλαίοντες
  choice: als weinten sie nicht
  rationale: Die idiomatische deutsche Wendung gibt eine Lebensweise oder Haltung wieder, ohne das tatsächliche Weinen zu leugnen.
- source_word: χαίροντες
  choice: die sich Freuenden
  rationale: „Sich freuen“ ist im modernen Standarddeutsch natürlicher als „frohlocken“ und entspricht dem konkreten Gegensatz zu „weinen“.
- source_word: ὡς μὴ χαίροντες
  choice: als freuten sie sich nicht
  rationale: Die wiederholte Konstruktion bewahrt den rhetorischen Gleichlauf und bezeichnet eine Haltung, nicht die Verneinung der Freude.
- source_word: ἀγοράζοντες
  choice: die Kaufenden
  rationale: „Kaufen“ ist die direkte und natürliche Wiedergabe des gewöhnlichen wirtschaftlichen Handelns.
- source_word: κατέχοντες
  choice: besäßen
  rationale: Im Gegensatz zum Kaufen bezeichnet κατέχω hier das Haben beziehungsweise feste Besitzen des Erworbenen. Der Konjunktiv in „als besäßen sie“ ist idiomatisches Deutsch.
- source_word: καὶ
  choice: und
  rationale: Das wiederholte „und“ erhält die kumulative, rhythmische Reihung des griechischen Textes.
theological_decisions:
- issue: Aussagekraft der wiederholten Konstruktion ὡς μή mit Partizip
  choice: Die Formulierung ruft zu einer innerlich gelösten Haltung gegenüber Trauer, Freude und Besitz auf, ohne diese Erfahrungen oder Handlungen zu verbieten oder für unwirklich zu erklären.
  alternative: Eine streng asketische Deutung, nach der Weinen, Freude oder Kaufen an sich unangemessen wären.
  rationale: ὡς μή mit dem Partizip beschreibt hier die Weise, in der man sich zu diesen Erfahrungen verhält. Der Zusammenhang von 1. Korinther 7,26–31 stellt dies in den Horizont der gegenwärtigen Bedrängnis und der vergänglichen Gestalt dieser Welt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die substantivierten Partizipien bewahren den verdichteten paulinischen Parallelismus; die mit „als“ und Konjunktiv gebildeten Vergleichssätze klingen im Deutschen natürlich. Das Schlusskomma zeigt, dass der Vers syntaktisch in Vers 31 weitergeführt wird.
