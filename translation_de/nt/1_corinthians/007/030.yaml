    rationale: Diese Formulierung legt nahe, die Kaufenden hätten keinerlei Besitz. Das objektlos gebrauchte κατέχοντες steht hier im Kontrast zum Kaufen und bezieht sich kontextuell auf das Erworbene; „als besäßen sie es nicht“ wahrt diesen Bezug.
  - severity: low
    issue: Substantivierte Partizipien im Haupttext
    rationale: „Die Weinenden“, „die sich Freuenden“ und besonders „die Kaufenden“ sind verständlich, wirken im modernen Standarddeutsch aber unnötig artifiziell. Relativsätze sind natürlicher und behalten die Parallelität.
