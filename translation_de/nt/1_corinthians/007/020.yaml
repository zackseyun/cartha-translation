  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: de
  text: Jeder soll in der Berufung[a], in der er[b] berufen wurde, bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lebenslage“, „Situation“ oder „Stand“. Im Griechischen steht „Berufung“; dadurch entsteht ein Wortspiel mit „berufen wurde“ im selben Vers.'
    reason: lexical_alternative
  - marker: b
    text: Die männliche Singularform ist hier stellvertretend gebraucht; die Aufforderung gilt jedem Glaubenden.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: Jeder
  rationale: Bewahrt den distributiven Singular und wendet die Aufforderung auf jeden Einzelnen an.
- source_word: κλήσει
  choice: Berufung
  rationale: Bewahrt die wörtliche Bedeutung und das Wortspiel mit ἐκλήθη („berufen wurde“), ohne die im Zusammenhang mitgemeinte Lebenslage vorschnell festzulegen.
- source_word: ᾗ ἐκλήθη
  choice: in der er berufen wurde
  rationale: Gibt die relative Konstruktion mit ἐν wieder und lässt das göttliche Passiv bestehen, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: μενέτω
  choice: soll … bleiben
  rationale: Gibt den präsentischen Imperativ als fortdauernde Aufforderung in natürlichem, heutigem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von κλῆσις im Zusammenhang
  choice: „Berufung“ im Haupttext beibehalten
  alternative: „Lebenslage“, „Stand“ oder „Situation“
  rationale: Der Zusammenhang betrifft konkrete Lebensverhältnisse, doch die Verbindung von κλήσει mit ἐκλήθη erzeugt bewusst eine Spannung zwischen Gottes Ruf und der Lage, in der jemand berufen wurde. „Berufung“ bewahrt diese Spannung und das Wortspiel.
- issue: Generischer maskuliner Singular
  choice: „Jeder … er“
  alternative: „Alle … sie“ oder eine wiederholte substantivische Formulierung ohne Pronomen
  rationale: Der griechische maskuline Singular ist repräsentativ gebraucht. Die deutsche Wiedergabe erhält Numerus und Satzstruktur; eine Fußnote verdeutlicht, dass alle Glaubenden gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wortstellung erhält die enge Verbindung zwischen „Berufung“ und „berufen wurde“, ohne unnatürlich oder altertümlich zu wirken.
