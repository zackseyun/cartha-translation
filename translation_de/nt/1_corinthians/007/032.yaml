  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: de
  text: Ich möchte aber, dass ihr frei von Sorgen seid. Der unverheiratete Mann sorgt sich um die Dinge des Herrn[a], wie er dem Herrn gefallen kann;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der unverheiratete Mensch sorgt sich um die Dinge des Herrn.“ Im Griechischen steht die maskuline Einzahl („der unverheiratete Mann“); im weiteren Zusammenhang spricht Paulus jedoch umfassender über unverheiratete und verheiratete Lebensstände.'
    reason: lexikalische Alternative und Erläuterung der grammatischen Geschlechtsform
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Ich möchte aber
  rationale: θέλω bezeichnet hier einen Wunsch bzw. ein Wollen; δέ markiert einen leichten Gegensatz oder Übergang. „Aber“ nimmt den Gedankengang des vorherigen Zusammenhangs natürlich auf.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: dass ihr frei von Sorgen seid
  rationale: ἀμέριμνος bedeutet, ohne Sorge oder belastende Besorgnis zu sein. Die Formulierung ist idiomatisch und vermeidet den Eindruck völliger Gleichgültigkeit.
- source_word: ὁ ἄγαμος
  choice: Der unverheiratete Mann
  rationale: Das substantivierte Adjektiv steht im griechischen Text maskulin Singular. Die Wiedergabe bewahrt diese Form, während eine Fußnote auf die im weiteren Zusammenhang behandelten unverheirateten und verheirateten Lebensstände hinweist.
- source_word: μεριμνᾷ
  choice: sorgt sich um
  rationale: Das Verb kann „sich sorgen um“ oder „bedacht sein auf“ bedeuten. „Sorgt sich um“ erhält die lexikalische Verbindung zu ἀμερίμνους, ohne hier zwingend eine sündhafte oder übermäßige Angst auszudrücken.
- source_word: τὰ τοῦ κυρίου
  choice: die Dinge des Herrn
  rationale: Die substantivierte Wendung bezeichnet umfassend das, was den Herrn betrifft oder ihm gehört. Die nahe Wiedergabe bewahrt diese semantische Breite.
- source_word: κυρίου / κυρίῳ
  choice: Herrn
  rationale: κύριος ist hier der christologische Hoheitstitel „Herr“; dieselbe Wiedergabe wird bei beiden Vorkommen beibehalten.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: darum, wie er dem Herrn gefallen kann
  rationale: πῶς leitet den Gesichtspunkt bzw. das Ziel seines Sorgens ein; der Konjunktiv ἀρέσῃ wird mit „gefallen kann“ als vorgestellte Möglichkeit bzw. Ausrichtung wiedergegeben.
theological_decisions:
- issue: Maskuliner Singular in Paulus’ Gegenüberstellung unverheirateter und verheirateter Lebensstände
  choice: Im Haupttext „Der unverheiratete Mann“
  alternative: „Der unverheiratete Mensch“ oder „Wer unverheiratet ist“
  rationale: ὁ ἄγαμος ist grammatisch maskulin Singular, und die anschließenden Verse behandeln männliche und weibliche Fälle gesondert. Die Übersetzung bewahrt deshalb die Form des Ausgangstextes, ohne die breitere Relevanz des Abschnitts zu leugnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Struktur, ist aber im Deutschen flüssig; das Semikolon am Versende wahrt den Anschluss an den folgenden Satz.
