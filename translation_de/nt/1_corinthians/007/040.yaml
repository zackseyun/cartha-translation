id: 1CO.7.40
reference: 1 Corinthians 7:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: de
  text: Doch nach meinem Urteil ist sie glücklicher[a], wenn sie so bleibt. Und ich meine, dass auch ich den Geist Gottes habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „mehr gesegnet“. Der griechische Komparativ μακαριωτέρα kann sowohl größeres Glück als auch einen stärker gesegneten Zustand bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: glücklicher
  rationale: Der Komparativ bezeichnet hier im Zusammenhang eines seelsorgerlichen Rates einen günstigeren beziehungsweise glücklicheren Zustand. „Glücklicher“ ist im modernen Deutsch natürlich; die ebenfalls mögliche religiös gefärbte Bedeutung wird in einer Fußnote bewahrt.
- source_word: ἐὰν οὕτως μείνῃ
  choice: wenn sie so bleibt
  rationale: μένω bedeutet „bleiben“, und οὕτως verweist auf ihren zuvor beschriebenen unverheirateten beziehungsweise verwitweten Zustand, ohne ihn erneut ausdrücklich festzulegen.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: nach meinem Urteil
  rationale: γνώμη bezeichnet hier eine überlegte Einschätzung. „Nach meinem Urteil“ gibt den abgewogenen Rat würdig wieder und klingt weniger beiläufig als „meiner Meinung nach“.
- source_word: δοκῶ
  choice: ich meine
  rationale: Die Formulierung wahrt den rhetorisch zurückhaltenden Ton, ohne Paulus eine echte Unsicherheit über den Geist zuzuschreiben.
- source_word: κἀγὼ
  choice: auch ich
  rationale: Die Krasis bedeutet „und auch ich / auch ich“; „auch ich“ erhält den additiven Nachdruck und lässt einen möglichen Seitenblick auf andere geistliche Autoritätsansprüche offen.
- source_word: πνεῦμα θεοῦ
  choice: den Geist Gottes
  rationale: Die Wendung bezeichnet im paulinischen Sprachgebrauch hier am ehesten Gottes Geist und nicht lediglich eine geistliche Haltung. Der bestimmte Artikel ist im Deutschen für diese personale Referenz idiomatisch.
- source_word: ἔχειν
  choice: habe
  rationale: Das schlichte Verb „haben“ gibt den Infinitiv direkt und natürlich wieder; „besitzen“ wäre unnötig stark und förmlich.
theological_decisions:
- issue: Bezeichnet πνεῦμα θεοῦ den Heiligen Geist oder nur eine geistliche Haltung?
  choice: „den Geist Gottes“ als personale Bezugnahme auf Gottes Geist
  alternative: „einen Geist von Gott“ oder „göttliche geistliche Einsicht“
  rationale: Im paulinischen Gebrauch bezeichnet πνεῦμα θεοῦ gewöhnlich Gottes Geist. Im Zusammenhang bekräftigt Paulus damit die geistliche Legitimität seines Urteils, ohne seinen Rat als ausdrückliches Herrenwort darzustellen.
- issue: Aussagekraft von δοκῶ … πνεῦμα θεοῦ ἔχειν
  choice: rhetorisch zurückhaltender, aber wirklicher Anspruch auf geistgeleitetes Urteil
  alternative: echte Unsicherheit darüber, ob Paulus den Geist hat, oder ein ausdrücklich ironischer Einwand gegen Gegner
  rationale: „Ich meine“ erhält die zurückhaltende Form, schwächt die Aussage jedoch nicht zu Zweifel ab. Eine eindeutig ironische Deutung wird vom Wortlaut nicht erzwungen und daher nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von „nach meinem Urteil“ vermeidet eine schwerfällige nachgestellte Einschubformel. Zwei Hauptsätze geben den Gedankengang klar wieder; „Und“ bewahrt die additive Verbindung, ohne den rhetorischen Ton unnötig zu verschärfen.
