  terminology: „Unverheirateten“ und „Witwen“ entsprechen den griechischen Begriffen. Die Fußnote zu ἀγάμοις legt die maskuline Pluralform und die mögliche repräsentative Verwendung transparent offen. „Gut“ bewahrt die nicht-komparative Wertung von καλόν. Die Fußnote zu κἀγώ hält die additive Nuance fest, ohne sie im Haupttext unnötig schwerfällig zu machen.
