  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des griechischen Satzes sachgerecht wieder: δέ als zurückhaltendes „aber“, die beiden Dativgruppen, καλόν mit „gut“, αὐτοῖς mit „für sie“, den Konditionalsatz und den Vergleich mit Paulus. Das ergänzte „so“ ist im Deutschen zur natürlichen Verknüpfung von „bleiben“ und „wie ich“ sinnvoll und präzisiert keine über den griechischen Text hinausgehende Biografie des Paulus.'
