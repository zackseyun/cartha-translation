base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: de
  text: 'Den Unverheirateten[a] und den Witwen aber sage ich: Es ist gut für sie, wenn sie so bleiben wie ich[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den unverheirateten Männern“; die griechische Form ist maskuliner Plural, kann im Zusammenhang aber auch repräsentativ gebraucht sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie auch ich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: aber sage ich
  rationale: δέ kennzeichnet hier einen milden Übergang beziehungsweise Gegensatz. Die nachgestellte Wiedergabe mit „aber“ bewahrt diese Funktion, ohne sie zu überbetonen.
- source_word: τοῖς ἀγάμοις
  choice: den Unverheirateten
  rationale: ἄγαμος bezeichnet unverheiratete Personen. Die substantivierte deutsche Form ist natürlich und kann hier entsprechend dem Kontext übergreifend verstanden werden, während die maskuline griechische Form in einer Fußnote kenntlich gemacht wird.
- source_word: ταῖς χήραις
  choice: den Witwen
  rationale: χήρα bezeichnet ausdrücklich eine Witwe; die eigene Nennung dieser Gruppe bleibt erhalten.
- source_word: καλὸν
  choice: Es ist gut
  rationale: καλός drückt hier aus, dass etwas gut, angemessen oder empfehlenswert ist, nicht ausdrücklich, dass es besser als eine Alternative sei.
- source_word: αὐτοῖς
  choice: für sie
  rationale: Der Dativ nach καλόν wird im Deutschen idiomatisch mit „für sie“ wiedergegeben.
- source_word: ἐὰν μείνωσιν
  choice: wenn sie so bleiben
  rationale: μένω bedeutet bleiben oder in einem Zustand verbleiben. „so“ stellt im Deutschen natürlich den Bezug auf Paulus’ eigenen Zustand her.
- source_word: ὡς κἀγώ
  choice: wie ich
  rationale: κἀγώ entspricht καὶ ἐγώ, wörtlich „auch ich“. Im Deutschen ist „wie ich“ in diesem Satz idiomatisch; die additive Nuance wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutungsumfang von ἀγάμοις neben „Witwen“
  choice: „den Unverheirateten“ als übergreifende Bezeichnung, bei ausdrücklicher Beibehaltung der Witwen als eigens genannter Gruppe
  alternative: „den unverheirateten Männern“ entsprechend der maskulinen griechischen Form
  rationale: Die maskuline Pluralform kann spezifisch auf Männer bezogen sein, kann aber auch repräsentativ gebraucht werden. Die Hauptfassung wahrt den wahrscheinlichen weiteren Sinn, während die Fußnote die grammatische Mehrdeutigkeit offenlegt.
- issue: Aussagekraft von καλὸν
  choice: „Es ist gut“
  alternative: „Es ist besser“ oder „Es ist geboten“
  rationale: Der griechische Positiv enthält weder einen ausdrücklichen Vergleich noch formuliert er hier für sich genommen ein Gebot. Die Übersetzung bewahrt daher den beratenden, aber positiv wertenden Wortlaut.
- issue: Paulus’ mit ὡς κἀγώ bezeichneter Zustand
  choice: Den Zustand nicht näher bestimmen, sondern „so bleiben wie ich“ übersetzen
  alternative: „unverheiratet bleiben wie ich“ oder Paulus ausdrücklich als Witwer beziehungsweise nie Verheirateten bestimmen
  rationale: Der Vers setzt Paulus’ gegenwärtigen ehelosen Zustand voraus, legt aber seine Vorgeschichte nicht fest. Die Übersetzung vermeidet eine unbelegte Präzisierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung bildet den milden Übergang durch δέ ab; „so bleiben wie ich“ ist idiomatisch und lässt Paulus’ genaueren biografischen Status offen.
