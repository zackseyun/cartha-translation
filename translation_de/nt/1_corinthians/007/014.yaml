source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: de
  text: Denn der ungläubige Mann ist durch seine Frau geheiligt, und die ungläubige Frau ist durch den Bruder[a] geheiligt. Sonst wären eure Kinder unrein; nun aber sind sie heilig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dem Bruder“ ist wahrscheinlich der gläubige Ehemann gemeint; Paulus bezeichnet Mitchristen häufig als Brüder.
    reason: lexical_alternative
  - marker: b
    text: „Geheiligt“ und „heilig“ bezeichnen hier einen besonderen, Gott zugeordneten Status innerhalb von Ehe und Familie. Der Vers sagt nicht, dass der ungläubige Ehepartner dadurch ohne eigenen Glauben persönlich gerettet ist.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: ist geheiligt
  rationale: Das deutsche Perfektpassiv „ist geheiligt“ gibt sowohl die vorausgehende Handlung als auch den daraus bestehenden Zustand wieder und bewahrt die Wortverbindung zu „heilig“ am Versende.
- source_word: ἄπιστος
  choice: ungläubig
  rationale: Im Zusammenhang bezeichnet das Adjektiv einen Menschen, der nicht glaubt; „treulos“ wäre hier irreführend.
- source_word: ἐν
  choice: durch
  rationale: „Durch“ gibt den relationalen beziehungsweise vermittelnden Sinn in der ehelichen Verbindung natürlich wieder, ohne die Art der Heiligung abschließend festzulegen.
- source_word: ἀνήρ / γυνή
  choice: Mann / Frau
  rationale: Der Ehekontext macht deutlich, dass Ehemann und Ehefrau gemeint sind; die im Deutschen übliche Paarform „Mann und Frau“ klingt natürlich und würdig.
- source_word: ἀδελφῷ
  choice: dem Bruder
  rationale: Die ausdrücklich abweichende griechische Bezeichnung wird bewahrt; eine Fußnote erläutert, dass Paulus damit wahrscheinlich den gläubigen Ehemann als Glaubensbruder meint.
- source_word: ἐπεὶ ἄρα
  choice: sonst
  rationale: „Sonst“ drückt die erschlossene Folge aus, falls die vorherige Aussage nicht gelten sollte.
- source_word: ἀκάθαρτα
  choice: unrein
  rationale: „Unrein“ bewahrt den kultisch-religiösen Bedeutungsanklang und den Gegensatz zu „heilig“.
- source_word: νῦν δὲ
  choice: nun aber
  rationale: Die wörtlich-nahe und idiomatische Wendung kennzeichnet den tatsächlichen Zustand im Gegensatz zur gedachten Folge.
- source_word: ἅγια
  choice: heilig
  rationale: „Heilig“ erhält die lexikalische Verbindung zu „geheiligt“ und lässt die genaue Art dieses Status offen.
theological_decisions:
- issue: Bedeutung der Heiligung des ungläubigen Ehepartners
  choice: Die Formulierung „ist … geheiligt“ bleibt ohne nähere dogmatische Bestimmung im Haupttext stehen.
  alternative: Die Wendung ausdrücklich als persönlichen Heilsbesitz oder lediglich als eheliche Legitimität deuten.
  rationale: Paulus verbindet die Heiligung mit Ehepartner und Kindern. Der Wortlaut bezeichnet einen geheiligten beziehungsweise ausgesonderten Status, sagt jedoch nicht ausdrücklich, dass der ungläubige Ehepartner dadurch persönlich gerettet ist.
- issue: Bezug von ἀδελφῷ
  choice: „dem Bruder“ wird im Haupttext beibehalten und in der Fußnote als wahrscheinlich gläubiger Ehemann erläutert.
  alternative: Zur Herstellung strenger Symmetrie direkt „durch ihren gläubigen Mann“ übersetzen.
  rationale: Der griechische Text verwendet hier ausdrücklich „Bruder“ statt „Mann“. Die quellennähere Form bewahrt diese Besonderheit, während die Fußnote den wahrscheinlichen Bezug verständlich macht.
- issue: Modalität bei „unrein“
  choice: „Sonst wären eure Kinder unrein“
  alternative: „Sonst sind eure Kinder unrein“
  rationale: Obwohl ἐστιν formal Präsens ist, steht die Aussage als Folge einer nicht zutreffenden Voraussetzung. Der deutsche Konjunktiv macht diese hypothetische Logik idiomatisch sichtbar, ohne den behaupteten Gegensatz zu verändern.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Die Wiederholung von „geheiligt“ und „heilig“ bewahrt den inneren Wortzusammenhang. „Der Bruder“ bleibt aus Quellentreue erhalten und wird erläutert.
