review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentrale, bewusst paradoxe Gegenüberstellung sachgerecht wieder: δοῦλος ist zutreffend mit „Sklave“, ἀπελεύθερος mit „Freigelassener“, ἐλεύθερος mit „Freier“ und Χριστοῦ als Titel mit „des Messias“ übersetzt. „Im Herrn“ bewahrt die offene paulinische Wendung ἐν κυρίῳ. Die Umstellung zu „im Herrn als Sklave berufen“ verdeutlicht im Deutschen, dass die Berufung im Herrn geschieht, nicht eine nähere Bestimmung des sozialen Status vorliegt.'
  naturalness: „Der als Freier Berufene“ ist verständlich, wirkt im modernen Standarddeutsch aber unnötig nominal und leicht schwerfällig. Die finite, passive Form „der als Freier berufen wurde“ ist idiomatischer und erhält die parallele Aussage.
  terminology: „Sklave“, „Freigelassener“, „Freier“, „Herr“ und „Messias“ sind konsequent und angemessen. Die bisherige Fußnotenalternative „ein vom Herrn Freigelassener“ legt die genitivische Beziehung von κυρίου stärker als ein Freilassen durch den Herrn aus. Eine Alternative mit „freie Person des Herrn“ gibt dagegen die breitere mögliche Wiedergabe von ἀπελεύθερος wieder, ohne diese Beziehung einseitig zu bestimmen.
  issues:
  - severity: low
    issue: Schwerfällige substantivierte Partizipialform in der zweiten Satzhälfte
    rationale: „der als Freier Berufene“ ist zwar grammatisch möglich, aber weniger natürlich als „der als Freier berufen wurde“.
  - severity: medium
    issue: Die Fußnotenalternative überdeutet die Genitivbeziehung
    rationale: „vom Herrn Freigelassener“ interpretiert κυρίου als Urheber des Freilassens. „des Herrn“ kann hier ebenso Zugehörigkeit ausdrücken; die Fußnote soll diese Deutung nicht festlegen.
  revised_text: Denn wer im Herrn als Sklave berufen wurde, ist ein Freigelassener des Herrn[a]; ebenso ist der als Freier berufen wurde, ein Sklave des Messias.
