id: 1CO.7.22
reference: 1 Corinthians 7:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: de
  text: Denn wer im Herrn als Sklave berufen wurde, ist ein Freigelassener des Herrn[a]; ebenso ist der als Freier berufen wurde, ein Sklave des Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine freie Person des Herrn“. Das griechische Wort bezeichnet genauer einen Menschen, der aus der Sklaverei freigelassen worden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Der rechtlich und sozial gebundene Status ist für den bewusst zugespitzten Gegensatz des Verses wesentlich; „Diener“ würde ihn abschwächen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die im Deutschen geläufige paulinische Wendung bewahrt die mögliche Bedeutung von Lebenssphäre beziehungsweise Verbundenheit, ohne sie einseitig festzulegen.
- source_word: κληθεὶς
  choice: berufen wurde / Berufene
  rationale: Die passive Bedeutung des Aoristpartizips und der Bezug auf Gottes Ruf bleiben erhalten; in der zweiten Satzhälfte dient die substantivierte Form der natürlichen Parallelführung.
- source_word: ἀπελεύθερος
  choice: Freigelassener
  rationale: Das Wort bezeichnet spezifisch einen aus der Sklaverei freigelassenen Menschen und erhält damit den sozialrechtlichen Gegensatz zu δοῦλος.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal und idiomatisch wiedergegeben und lässt das Zugehörigkeitsverhältnis bestehen.
- source_word: ὁμοίως
  choice: ebenso
  rationale: Die knappe Entsprechung bewahrt die symmetrische Gegenüberstellung beider Satzhälften.
- source_word: ἐλεύθερος
  choice: Freier
  rationale: Die Bezeichnung benennt den damaligen sozialen Status und entspricht der grammatisch maskulinen, repräsentativen Einzahl.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός wird hier als Hoheitstitel verstanden; „Messias“ macht diesen Titelcharakter im modernen Deutsch sichtbar.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ bewahrt den theologisch gewichtigen Titel und verengt ihn nicht auf ein bloß gesellschaftliches Herr-Sklave-Verhältnis.
theological_decisions:
- issue: Der paradoxe Gegensatz zwischen gesellschaftlichem und geistlichem Status
  choice: Die scharfe Umkehrung wird mit „Sklave“, „Freigelassener“ und erneut „Sklave“ beibehalten.
  alternative: Die Begriffe mit „Diener“ oder allgemein „freier Mensch“ abschwächen.
  rationale: Paulus relativiert den irdischen Status durch die Zugehörigkeit zum Herrn beziehungsweise Messias. Die sozialrechtlichen Begriffe tragen die Pointe und dürfen nicht eingeebnet werden.
- issue: Wiedergabe des Titels Χριστός
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle bleibt der Titelcharakter des Gesalbten erkennbar; „Messias“ gibt ihn transparent wieder, ohne die Aussage weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historisch konkreten Statusbegriffe werden trotz ihrer Härte bewahrt, weil sie den Gedankengang tragen. Die leicht variierte Wiedergabe von κληθεὶς vermeidet schwerfällige Wiederholung, ohne die Parallelität aufzugeben.
