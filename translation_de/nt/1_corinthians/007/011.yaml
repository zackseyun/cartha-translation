  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: de
  text: Wenn sie sich aber trennt[a], soll sie unverheiratet bleiben oder sich mit ihrem Mann versöhnen. Und ein Mann soll sich nicht von seiner Frau scheiden lassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn sie sich aber auch trennt“ oder „Selbst wenn sie sich trennt.“ Das Griechische kann hier einen leicht einräumenden Sinn haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „soll seine Frau nicht fortschicken“ oder „entlassen“. In diesem ehelichen Zusammenhang kann das Verb die Scheidung beziehungsweise das Verstoßen der Ehefrau bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Wenn sie sich aber doch
  rationale: Die Formulierung gibt die Bedingung wieder und lässt durch „doch“ die mögliche konzessive Nuance von καί anklingen, ohne sie mit „selbst wenn“ zu stark festzulegen.
- source_word: χωρισθῇ
  choice: sich trennt
  rationale: χωρίζω bezeichnet hier die Trennung vom Ehepartner. „Sich trennt“ bewahrt den Unterschied zum späteren ἀφιέναι und legt nicht vorschnell eine förmliche Scheidung fest.
- source_word: μενέτω ἄγαμος
  choice: soll sie unverheiratet bleiben
  rationale: Der Imperativ μενέτω wird als klare Anweisung wiedergegeben; ἄγαμος bezeichnet präzise den unverheirateten Familienstand.
- source_word: τῷ ἀνδρὶ καταλλαγήτω
  choice: sich mit ihrem Mann versöhnen
  rationale: καταλλάσσω bezeichnet die Wiederherstellung der Beziehung. Die deutsche reflexive Wendung gibt den passiven Imperativ natürlich und verständlich wieder.
- source_word: ἄνδρα
  choice: ein Mann
  rationale: ἀνήρ bezeichnet im ehelichen Zusammenhang den Ehemann; die generische Form „ein Mann“ entspricht der anarthrischen griechischen Form und steht parallel zur Anweisung an die Frau.
- source_word: γυναῖκα
  choice: seiner Frau
  rationale: γυνή bedeutet im vorliegenden ehelichen Zusammenhang „Ehefrau“. Das Possessivpronomen macht die Beziehung im Deutschen idiomatisch deutlich.
- source_word: μὴ ἀφιέναι
  choice: soll sich nicht von seiner Frau scheiden lassen
  rationale: Die Konstruktion setzt die vorausgehende Anweisung fort und hat verbietende Kraft. In diesem Ehekontext vermittelt „sich scheiden lassen“ die gemeinte Auflösung der Ehe verständlich, während die wörtlichere Bedeutung in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Ob χωρισθῇ und ἀφιέναι mit demselben deutschen Ausdruck wiederzugeben sind
  choice: χωρισθῇ mit „sich trennen“, ἀφιέναι mit „sich scheiden lassen“ wiedergeben
  alternative: Beide Verben einheitlich mit „sich trennen“ oder „sich scheiden lassen“ übersetzen
  rationale: Paulus verwendet zwei verschiedene Verben. Ihre Unterscheidung bewahrt die mögliche Differenz zwischen Trennung und Scheidung, ohne für χωρισθῇ eine rechtliche Präzision einzutragen, die der griechische Ausdruck nicht zwingend besitzt.
- issue: Wie die im ersten Satz nur aus dem Zusammenhang erkennbare weibliche Person bezeichnet wird
  choice: Das Pronomen „sie“ verwenden
  alternative: Explizit „die Frau“ sagen
  rationale: Der unmittelbare Zusammenhang richtet die erste Anweisung an die Ehefrau. „Sie“ macht das im Deutschen nötige Subjekt deutlich, ohne einen im griechischen Satz nicht wiederholten Ausdruck einzufügen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die beiden griechischen Verben für Trennung und Entlassung werden bewusst unterschiedlich wiedergegeben. Der Gedankenstrich des griechischen Textes wird durch einen neuen Satz ersetzt, um die paarweise Anweisung an Mann und Frau im Deutschen übersichtlich auszudrücken.
