id: 1CO.7.3
reference: 1 Corinthians 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: de
  text: Der Mann soll seiner Frau geben, was er ihr schuldet[a], ebenso auch die Frau ihrem Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Schuld« oder »das Geschuldete«. Im Zusammenhang ist die eheliche, insbesondere geschlechtliche Verpflichtung gemeint, die beide einander schulden.'
    reason: lexikalische Alternative und kontextuelle Erläuterung
lexical_decisions:
- source_word: γυναικί
  choice: Frau
  rationale: Im unmittelbaren Ehekontext bezeichnet γυνή die Ehefrau; im Deutschen ist »seiner Frau« eindeutig und natürlich.
- source_word: ἀνήρ
  choice: Mann
  rationale: In der Verbindung »der Mann … seiner Frau« bezeichnet ἀνήρ eindeutig den Ehemann, ohne dass das im Deutschen schwerfällige »Ehemann« nötig ist.
- source_word: ὀφειλήν
  choice: was er ihr schuldet
  rationale: Die Formulierung bewahrt die Grundbedeutung von ὀφειλή als Schuld beziehungsweise geschuldete Verpflichtung. Der Zusammenhang in Vers 2 und 4–5 macht deutlich, dass die eheliche, insbesondere geschlechtliche Verpflichtung gemeint ist, ohne dies im Haupttext stärker auszudeuten als das griechische Substantiv selbst.
- source_word: ἀποδιδότω
  choice: soll … geben
  rationale: Der Imperativ bezeichnet eine fortdauernde Verpflichtung. »Soll … geben« klingt in modernem Deutsch natürlich und gibt ἀποδίδωμι angemessen wieder.
- source_word: ὁμοίως
  choice: ebenso
  rationale: »Ebenso« bringt die ausdrücklich wechselseitige und gleichartige Verpflichtung beider Ehepartner knapp zum Ausdruck.
- source_word: δὲ καὶ
  choice: auch
  rationale: »Auch« gibt die additive Hervorhebung der zweiten, parallelen Aussage natürlich wieder; zusammen mit »ebenso« bleibt die Symmetrie erhalten.
theological_decisions:
- issue: Wie ausdrücklich die mit ὀφειλή bezeichnete eheliche Verpflichtung wiederzugeben ist
  choice: Im Haupttext steht »was er ihr schuldet«; eine Fußnote erläutert den ehelichen Zusammenhang.
  alternative: »die eheliche Pflicht« oder »was ihr zusteht«
  rationale: Die gewählte Fassung bleibt näher an der lexikalischen Weite von ὀφειλή und bewahrt die Spannung zwischen der allgemeinen Bedeutung »das Geschuldete« und der im Kontext erkennbaren ehelich-geschlechtlichen Anwendung. Zugleich stellt der parallele Satz die gegenseitige Verpflichtung von Mann und Frau klar heraus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ausgewogene Satzstruktur des Griechischen und die Gegenseitigkeit der Verpflichtung werden bewahrt; die Formulierung vermeidet sowohl altertümliches »entrichten« als auch eine übermäßig explizite Ausdeutung im Haupttext.
