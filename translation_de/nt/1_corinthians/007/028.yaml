review_pass:
  verdict: revise
  source_fidelity: 'Die beiden Konditionalsätze und die Verneinung von Sünde sind zutreffend wiedergegeben. „Die Jungfrau“ bewahrt die konkrete, im griechischen Text stehende Bezeichnung παρθένος. Bei τῇ σαρκί ist „im leiblichen Leben“ eine zu stark entfaltende Umschreibung: Das Substantiv „Leben“ steht nicht im Ausgangstext, und die Formulierung ist weder besonders idiomatisch noch näher am Bildbereich von σάρξ. „Bedrängnis am eigenen Leib erfahren“ gibt die nichtethische, leiblich-konkrete Dimension idiomatisch wieder, ohne sie auf eine bestimmte Art von Not festzulegen. Für φείδομαι ist „will euch schonen“ eine natürliche und unmittelbare Wiedergabe der erkennbaren Absicht; die direkte Lesart bleibt in der Fußnote erhalten.'
  naturalness: Der Entwurf ist insgesamt würdig und verständlich. „Bedrängnis im leiblichen Leben haben“ klingt jedoch im modernen Standarddeutsch sperrig. Die Verbindung „Bedrängnis am eigenen Leib erfahren“ ist idiomatisch und bewahrt den gehobenen Registerton. „Ich aber will euch schonen“ ist weniger abgeschwächt als „möchte euch schonen“ und im Kontext klar.
  terminology: „Bedrängnis“ ist für θλῖψις angemessen und vermeidet eine unnötig endzeitlich festgelegte Bedeutung. Die Hauptfassung deutet σάρξ nicht als „sündige Natur“. Die Fußnote soll die wörtliche Bildsprache korrekt als „im Fleisch“ benennen; „am Fleisch“ ist hierfür keine überzeugende wörtliche deutsche Entsprechung.
  issues:
  - severity: medium
    issue: τῇ σαρκί als „im leiblichen Leben“
    rationale: Die Wiedergabe fügt den Begriff „Leben“ hinzu und löst sich dadurch unnötig vom konkreten Bildbereich von σάρξ. Zudem ist „Bedrängnis im leiblichen Leben haben“ stilistisch schwerfällig. „Bedrängnis am eigenen Leib erfahren“ ist idiomatisch und lässt die genaue Art der Bedrängnis offen.
  - severity: low
    issue: 'Fußnote a: „Wörtlicher: Bedrängnis am Fleisch“'
    rationale: Die griechische Wendung lautet wörtlich eher „Bedrängnis im Fleisch“; „am Fleisch“ ist keine geeignete wörtliche Glosse. Die Fußnote sollte außerdem klarstellen, dass die Hauptfassung eine idiomatische Wiedergabe ist.
  - severity: low
    issue: „möchte euch schonen“ für φείδομαι
    rationale: „Möchte“ kann im Deutschen unnötig unverbindlich oder höflich klingen. „Will euch schonen“ gibt die pastorale Zielsetzung direkter wieder, ohne eine vollendete Schonung zu behaupten.
