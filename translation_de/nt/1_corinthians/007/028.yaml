revisions:
- from: Doch selbst wenn du heiratest, begehst du keine Sünde; und wenn die Jungfrau heiratet, begeht sie keine Sünde. Solche Menschen werden jedoch Bedrängnis im leiblichen Leben haben[a]; ich aber möchte euch schonen.[b]
  to: Doch selbst wenn du heiratest, begehst du keine Sünde; und wenn die Jungfrau heiratet, begeht sie keine Sünde. Solche Menschen werden jedoch Bedrängnis am eigenen Leib erfahren[a]; ich aber will euch schonen.[b]
  rationale: Die Revision beschränkt sich auf eine idiomatischere und quellennahe Wiedergabe von τῇ σαρκί sowie auf eine direktere, im Deutschen natürliche Wiedergabe von φείδομαι. Sie legt weder die Art der angekündigten Bedrängnis noch eine theologische Bedeutung von „Fleisch“ fest. Die Fußnotenanker bleiben an den jeweils erläuterten Textstellen.
