source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: de
  text: Doch selbst wenn du heiratest, begehst du keine Sünde; und wenn die Jungfrau heiratet, begeht sie keine Sünde. Solche Menschen werden jedoch Bedrängnis am eigenen Leib erfahren[a]; ich aber will euch schonen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Bedrängnis im Fleisch“. Gemeint sind wahrscheinlich Belastungen des irdischen oder leiblichen Daseins; die Formulierung bezeichnet hier nicht ausdrücklich die „sündige Natur“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ich aber schone euch“. Paulus nennt damit seinen pastoralen Beweggrund für diese Warnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς / γήμῃ
  choice: heiratest / heiratet
  rationale: Die Konditionalsätze mit ἐάν und Aorist Konjunktiv bezeichnen einen möglichen künftigen Fall. Das schlichte deutsche Präsens ist hier natürlich und wahrt die Parallelität.
- source_word: οὐχ ἥμαρτες / οὐχ ἥμαρτεν
  choice: begehst du keine Sünde / begeht sie keine Sünde
  rationale: Der griechische Aorist beurteilt den möglichen Schritt zur Ehe als nicht sündhaft. Die deutsche Wendung gibt diese moralische Bewertung im Konditionalsatz klar wieder, ohne eine vergangene Handlung vorauszusetzen.
- source_word: ἡ παρθένος
  choice: die Jungfrau
  rationale: Die konkrete Bezeichnung παρθένος wird beibehalten und nicht allgemeiner als „unverheiratete Frau“ wiedergegeben.
- source_word: θλῖψιν
  choice: Bedrängnis
  rationale: „Bedrängnis“ bewahrt die Stärke und Bedeutungsbreite von θλῖψις besser als das schwächere „Schwierigkeiten“, ohne zwingend eine endzeitliche Deutung festzulegen.
- source_word: τῇ σαρκί
  choice: im leiblichen Leben
  rationale: Die Wendung bezeichnet hier wahrscheinlich Belastungen des irdischen, verkörperten Lebens. Diese Wiedergabe ist im modernen Deutsch verständlicher als das missverständliche „im Fleisch“, während eine Fußnote die Formulierung des Ausgangstextes erkennen lässt.
- source_word: οἱ τοιοῦτοι
  choice: solche Menschen
  rationale: Die Formulierung verweist allgemein auf Menschen der gerade genannten Art, also auf diejenigen, die heiraten, ohne den Bezug unnötig enger festzulegen.
- source_word: φείδομαι
  choice: möchte euch schonen
  rationale: Das Verb kann gegenwärtiges Schonen oder die Absicht ausdrücken, jemanden vor einer Belastung zu bewahren. „Möchte“ macht den pastoralen Beweggrund im Kontext natürlich verständlich, ohne einen sicheren Erfolg zu behaupten.
theological_decisions:
- issue: Bedeutung von σάρξ in τῇ σαρκί
  choice: leibliches beziehungsweise irdisches Leben
  alternative: Fleisch; sündige Natur
  rationale: Paulus warnt hier vor Bedrängnissen, die Menschen in ihren konkreten Lebensumständen treffen. Der Zusammenhang gibt keinen hinreichenden Grund, σάρξ als „sündige Natur“ zu deuten; zugleich bleibt durch die Fußnote die wörtlichere Ausdrucksweise sichtbar.
- issue: Art der angekündigten Bedrängnis
  choice: allgemein formulierte Bedrängnis für Verheiratete
  alternative: ausschließlich eheliche Alltagsprobleme oder ausschließlich endzeitliche Verfolgung
  rationale: Der Vers bestimmt die genaue Art der θλῖψις nicht ausdrücklich. Die Übersetzung lässt deshalb offen, ob vor allem praktische, zeitgeschichtliche oder weiter reichende Belastungen gemeint sind.
- issue: Aussageabsicht von φείδομαι
  choice: pastorale Absicht, die Angesprochenen zu schonen
  alternative: Feststellung, dass Paulus sie bereits schont
  rationale: Das griechische Präsens erlaubt eine direkte Feststellung, doch im argumentativen Zusammenhang kann es zugleich den Beweggrund seines Rates ausdrücken. Die Hauptfassung gibt diese Absicht wieder; die Fußnote bewahrt die formal direktere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten. „Bedrängnis“ wahrt das Gewicht von θλῖψις, während „im leiblichen Leben“ eine im Deutschen leicht missverständliche wörtliche Rede vom „Fleisch“ behutsam erschließt.
