  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: de
  text: 'Das aber sage ich, Brüder und Schwestern[a]: Die Zeit ist knapp geworden; von jetzt an sollen auch die, die Frauen haben, so sein, als hätten sie keine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“. Der griechische maskuline Plural kann hier Brüder und Schwestern der Glaubensgemeinschaft gemeinsam ansprechen.'
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: Das aber sage ich
  rationale: Gibt die paulinische Einleitungsformel eng am Griechischen und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline griechische Plural kann hier die gesamte gemischte Gemeinschaft der Glaubenden ansprechen; die inklusive Wiedergabe macht den gemeinten Adressatenkreis im modernen Deutschen deutlich.
- source_word: ὁ καιρὸς συνεσταλμένος ἐστίν
  choice: Die verbleibende Zeit ist kurz geworden
  rationale: καιρός bezeichnet hier die entscheidende beziehungsweise verfügbare Zeit; das periphrastische Perfekt beschreibt einen gegenwärtigen Zustand infolge einer Verkürzung. „Verbleibende“ verdeutlicht im Deutschen den kontextuellen Gedanken, ohne die Dringlichkeit abzuschwächen.
- source_word: τὸ λοιπὸν
  choice: Darum … von nun an
  rationale: Die syntaktische Zuordnung ist wegen der Zeichensetzung und Wortstellung nicht völlig eindeutig. Die Wiedergabe verbindet den Ausdruck idiomatisch mit der folgenden Konsequenz und erhält seinen zeitlichen Sinn.
- source_word: ἵνα
  choice: Darum sollen
  rationale: Drückt die aus der verkürzten Zeit folgende Ziel- beziehungsweise Konsequenzbeziehung natürlich aus, ohne sie streng auf Zweck oder Ergebnis festzulegen.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: die, die eine Frau haben
  rationale: Bewahrt die konkrete griechische Formulierung, in der γυναῖκας im Zusammenhang Ehefrauen bezeichnet, statt sie allgemeiner mit „Verheiratete“ wiederzugeben.
- source_word: ὡς μὴ ἔχοντες
  choice: so sein, als hätten sie keine
  rationale: Erhält die zugespitzte Vergleichsformulierung und ihren Rückbezug auf „eine Frau“, ohne sie interpretierend zu mildern.
theological_decisions:
- issue: Pastorale und theologische Aussage über die Ehe
  choice: Die zugespitzte Aufforderung wird ohne Abschwächung wiedergegeben.
  alternative: 'Interpretierend formulieren: „sich innerlich nicht an die Ehe binden“ oder „leben, als sei die Ehe nicht das Wichtigste“.'
  rationale: Paulus relativiert angesichts der kurzen verbleibenden Zeit gewöhnliche Lebensverhältnisse. Die Spannung zu ehelichen Pflichten und zu seiner positiven Sicht der Ehe an anderer Stelle soll im Vers selbst bestehen bleiben.
- issue: Bezug von τὸ λοιπὸν und Funktion von ἵνα
  choice: „Darum sollen von nun an“ gibt die zeitliche und folgernde Verbindung wieder.
  alternative: „Die Zeit ist zusammengedrängt, sodass künftig …“ oder „Im Übrigen sollen …“.
  rationale: Der griechische Satz lässt durch seine Wortstellung und die editorisch gesetzte Interpunktion unterschiedliche Gliederungen zu. Die gewählte Fassung ist idiomatisch, legt aber Zweck und Folge nicht dogmatisch fest.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. Die Satzfügung bleibt nahe am griechischen Gedankengang, wird aber durch „Darum“ lesbar gegliedert. Die eschatologische Dringlichkeit und die Spannung der Aussage werden nicht durch eine pastorale Paraphrase aufgelöst.
