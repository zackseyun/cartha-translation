  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Am Körper als auch am Geist“ ist jedoch weniger idiomatisch als „an Körper und Geist“, und die gegenwärtigen Indikative „ist“ und „gefällt“ schwächen die griechische Ziel- bzw. Möglichkeitsnuance ab.
  terminology: „Jungfrau“, „heilig“, „Herr“, „Welt“ und „Mann“ sind sachgerecht. „Anliegen“ ist für τὰ τοῦ κυρίου / τὰ τοῦ κόσμου eine mögliche natürliche Wiedergabe und erhält den Parallelismus ohne unnötig abwertende Konnotation.
