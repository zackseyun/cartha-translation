source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: de
  text: Und er ist geteilt. Und die unverheiratete Frau, das heißt die Jungfrau,[a] kümmert sich um die Anliegen des Herrn, damit sie an Körper und Geist heilig sei. Die verheiratete Frau dagegen kümmert sich um die Anliegen der Welt, nämlich darum, wie sie ihrem Mann gefallen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die unverheiratete Frau und die Jungfrau kümmern sich um die Anliegen des Herrn.“ Der griechische Text kann so verstanden werden, dass zwei Gruppen genannt werden, statt dass „die Jungfrau“ die unverheiratete Frau näher erläutert.'
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: er ist geteilt
  rationale: Das Perfekt Passiv bewahrt den resultativen Sinn und das Bild geteilter Interessen. Das maskuline Pronomen stellt den Anschluss an den verheirateten Mann im vorangehenden Vers her.
- source_word: γυνὴ ἡ ἄγαμος
  choice: die unverheiratete Frau
  rationale: γυνή bezeichnet hier im Gegensatz zur verheirateten Frau eine Frau, die nicht verheiratet ist.
- source_word: παρθένος
  choice: die Jungfrau
  rationale: „Jungfrau“ gibt die lexikalische Bestimmtheit von παρθένος wieder, ohne sie zum allgemeineren Begriff „junge Frau“ abzuschwächen.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: die unverheiratete Frau, das heißt die Jungfrau
  rationale: Die komprimierte Syntax lässt eine Apposition zu; dafür spricht besonders das singularische μεριμνᾷ. Die ebenfalls mögliche koordinierte Lesart wird in der Fußnote erhalten.
- source_word: μεριμνᾷ
  choice: kümmert sich um
  rationale: Das Verb bezeichnet hier Sorge beziehungsweise konzentrierte Aufmerksamkeit, nicht zwingend belastende Angst.
- source_word: τὰ τοῦ κυρίου
  choice: die Anliegen des Herrn
  rationale: „Anliegen“ gibt idiomatisch wieder, was den Herrn und seinen Dienst betrifft, und bewahrt den parallelen Gegensatz zu den Anliegen der Welt.
- source_word: ἵνα ᾖ ἁγία
  choice: damit sie … heilig ist
  rationale: „Damit“ bildet die Zweck- oder Ergebnisnuance von ἵνα mit Konjunktiv ab; „heilig“ bewahrt den ausdrücklichen Heiligkeitsbegriff.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: sowohl am Körper als auch am Geist
  rationale: Die Dative bezeichnen die Hinsichten, in denen die Heiligkeit gelten soll. „Sowohl … als auch“ bildet καὶ … καὶ ab, ohne eine weitergehende Anthropologie festzulegen.
- source_word: ἡ δὲ γαμήσασα
  choice: die verheiratete Frau dagegen
  rationale: Das substantivierte Aoristpartizip bezeichnet idiomatisch die Frau im Ehestand; δέ markiert den Gegensatz.
- source_word: τὰ τοῦ κόσμου
  choice: die Anliegen der Welt
  rationale: Die Formulierung entspricht strukturell „den Anliegen des Herrn“ und vermeidet die unnötig abwertende Konnotation von „weltlichen Dingen“.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: nämlich darum, wie sie ihrem Mann gefällt
  rationale: ἀνήρ bedeutet im ehelichen Zusammenhang „Mann“ im Sinn von Ehemann. „Nämlich darum“ bindet den abhängigen Fragesatz im Deutschen natürlich an „kümmert sich“ an.
theological_decisions:
- issue: Ob „die unverheiratete Frau“ und „die Jungfrau“ zwei Gruppen oder eine appositionell erläuterte Gruppe bezeichnen
  choice: 'Appositionell: „die unverheiratete Frau, das heißt die Jungfrau“'
  alternative: 'Koordiniert: „die unverheiratete Frau und die Jungfrau“'
  rationale: Die griechische Syntax ist mehrdeutig. Das singularische Verb unterstützt eine einheitliche Subjektgruppe beziehungsweise Apposition, doch die koordinierte Lesart bleibt grammatisch möglich und wird deshalb in einer Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Anliegen“ vermittelt den parallelen Gegensatz natürlich und ohne eine unnötig negative Wertung der ehelichen Verantwortung. Der Satzanfang bleibt eng am griechischen Anschluss; sein Bezug auf den verheirateten Mann ergibt sich aus dem vorhergehenden Vers.
