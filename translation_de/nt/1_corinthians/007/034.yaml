revisions:
- from: Und er ist geteilt. Auch die unverheiratete Frau, das heißt die Jungfrau,[a] kümmert sich um die Anliegen des Herrn, damit sie sowohl am Körper als auch am Geist heilig ist. Die verheiratete Frau dagegen kümmert sich um die Anliegen der Welt, nämlich darum, wie sie ihrem Mann gefällt.
  to: Und er ist geteilt. Und die unverheiratete Frau, das heißt die Jungfrau,[a] kümmert sich um die Anliegen des Herrn, damit sie an Körper und Geist heilig sei. Die verheiratete Frau dagegen kümmert sich um die Anliegen der Welt, nämlich darum, wie sie ihrem Mann gefallen kann.
  rationale: Die Revision korrigiert die deutsche Wiedergabe der finalen Konjunktivkonstruktion ἵνα ᾖ sowie der auf ein mögliches Gefallen zielenden Frage πῶς ἀρέσῃ. Die umstrittene Beziehung von „unverheiratete Frau“ und „Jungfrau“ bleibt im Haupttext appositionell und in der Fußnote als koordinierte Alternative erhalten. Der einleitende Anschluss wird ohne das leicht verstärkende „Auch“ näher am griechischen καί wiedergegeben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:48:58Z'
