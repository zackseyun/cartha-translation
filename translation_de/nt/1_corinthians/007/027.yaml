base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: de
  text: Bist du an eine Ehefrau gebunden? Suche keine Loslösung[a]. Bist du von einer Ehefrau losgelöst? Suche keine Ehefrau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutender: »Bist du verheiratet? Suche keine Scheidung. Bist du geschieden? Suche keine Ehefrau.« Der griechische Text spricht wörtlicher davon, »gebunden« und »losgelöst« zu sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: bist du … gebunden
  rationale: Das Perfekt von δέω bezeichnet einen fortbestehenden Zustand des Gebundenseins. »Gebunden« bewahrt das Bild und die Entsprechung zu λύσιν und λέλυσαι.
- source_word: γυναικί
  choice: an eine Frau
  rationale: γυνή kann »Frau« oder »Ehefrau« bedeuten. In diesem Ehekontext ist die Ehefrau gemeint; die natürliche deutsche Verbindung lautet »an eine Frau gebunden« und lässt das Bindungsbild bestehen.
- source_word: μὴ ζήτει
  choice: suche keine
  rationale: Die verneinte Präsensimperativform wird knapp und ihrem Aufforderungscharakter entsprechend wiedergegeben.
- source_word: λύσιν
  choice: Lösung
  rationale: »Lösung« bezeichnet hier das Lösen einer Bindung und erhält im Deutschen die Wortverwandtschaft mit »gelöst«. Das enger deutende »Scheidung« steht nur als Auslegungsmöglichkeit in der Fußnote.
- source_word: λέλυσαι
  choice: bist du … gelöst
  rationale: Das Perfekt von λύω beschreibt den bestehenden Zustand nach einer Lösung. »Gelöst« wahrt die bewusste Gegenüberstellung zu »gebunden« und legt nicht fest, ob Scheidung, Verwitwung oder ein anderer ehefreier Zustand gemeint ist.
- source_word: ἀπὸ γυναικός
  choice: von einer Frau
  rationale: ἀπό wird regulär mit »von« wiedergegeben; γυνή ist im Zusammenhang ehelich zu verstehen, während die Formulierung das Bild des Gelöstseins bewahrt.
- source_word: γυναῖκα
  choice: eine Frau
  rationale: Im Zusammenhang bedeutet die Wendung, eine Ehefrau beziehungsweise die Ehe zu suchen. »Eine Frau suchen« ist im Deutschen verständlich und bleibt nahe an der griechischen Ausdrucksweise.
theological_decisions:
- issue: Ob die Bindungs- und Lösungsmetaphorik ausdrücklich als Ehe und Scheidung wiederzugeben ist
  choice: Die Bilder »gebunden«, »Lösung« und »gelöst« bleiben im Haupttext erhalten.
  alternative: Bist du verheiratet? Suche keine Scheidung. Bist du geschieden? Suche keine Frau.
  rationale: Der griechische Text verwendet δέω/λύω-Wortschatz und nicht ausdrücklich die engeren Begriffe für Heirat oder Scheidung. Die bildhafte Wiedergabe bewahrt daher sowohl den Wortlaut als auch die mögliche Reichweite der Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Fragen und Aufforderungen spiegeln die zugespitzte Form des griechischen Textes. »Lösung« ist hier bewusst im Sinn des Lösens einer ehelichen Bindung gebraucht; die Fußnote erläutert die geläufigere, aber engere Deutung.
