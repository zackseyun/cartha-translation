revisions:
- from: Bist du an eine Frau gebunden? Suche keine Lösung[a]. Bist du von einer Frau gelöst? Suche keine Frau.
  to: Bist du an eine Ehefrau gebunden? Suche keine Loslösung[a]. Bist du von einer Ehefrau losgelöst? Suche keine Ehefrau.
  rationale: Die Revision präzisiert den ehelichen Sinn von γυνή und ersetzt die im Deutschen missverständliche „Lösung“ durch „Loslösung“. Sie bewahrt dabei die im griechischen δέω/λύω-Wortfeld angelegte Entsprechung und legt weder Scheidung noch Verwitwung als alleinige Bedeutung von „losgelöst“ fest. Die Fußnotenmarkierung bleibt unmittelbar an der auslegungsbedürftigen Wiedergabe von λύσιν verankert.
