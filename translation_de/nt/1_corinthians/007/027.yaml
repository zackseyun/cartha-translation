review_pass:
  verdict: revise
  source_fidelity: Die bindungs-/lösungsbezogene Wortwahl des griechischen Textes wird grundsätzlich zutreffend bewahrt. Im gegebenen Ehekontext bezeichnet γυνή jedoch jeweils „Ehefrau“. Die bloße Wiedergabe „Frau“ ist besonders in „von einer Frau gelöst“ und „suche keine Frau“ im heutigen Deutsch unnötig mehrdeutig und kann das eheliche Bezugsfeld abschwächen.
  naturalness: „Lösung“ ist im modernen Deutsch ohne Ergänzung primär eine Antwort auf ein Problem und lässt die gemeinte Lösung einer Bindung nicht klar erkennen. „Loslösung“ ist hier verständlich, idiomatisch genug und bewahrt sowohl die metaphorische Ebene als auch die Verwandtschaft zu „losgelöst“.
  terminology: „Ehefrau“ gibt γυνή im vorliegenden Kontext präzise wieder, ohne die bewusst offene Bedeutung von λύσις/λέλυσαι auf „Scheidung“ einzuengen. Die Fußnote bietet die engere, interpretative Lesart weiterhin nur als Alternative an.
  issues:
  - severity: medium
    issue: „Frau“ statt „Ehefrau“ in allen drei Vorkommen
    rationale: γυνή kann zwar allgemein „Frau“ heißen, meint hier aufgrund des unmittelbaren Ehekontexts eine Ehefrau. Die deutsche Formulierung „eine Frau suchen“ kann außerhalb eines klaren Ehebegriffs missverständlich wirken.
  - severity: medium
    issue: „Suche keine Lösung“ ist semantisch unklar
    rationale: Im heutigen Deutsch wird „Lösung“ gewöhnlich als Problemlösung verstanden. „Loslösung“ bezeichnet deutlich das Lösen aus einer Bindung und erhält dennoch die absichtlich nicht auf Scheidung beschränkte Bildsprache.
  revised_text: Bist du an eine Ehefrau gebunden? Suche keine Loslösung[a]. Bist du von einer Ehefrau losgelöst? Suche keine Ehefrau.
