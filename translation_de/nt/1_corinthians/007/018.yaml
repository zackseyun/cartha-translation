  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: de
  text: Wurde jemand als Beschnittener berufen? Er soll nicht versuchen, die Beschneidung rückgängig zu machen.[a] Wurde jemand als Unbeschnittener berufen? Er soll sich nicht beschneiden lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann den Versuch bezeichnen, die sichtbaren Merkmale der Beschneidung zu verbergen oder rückgängig zu machen.
    reason: Erklärung der seltenen lexikalischen Nuance von ἐπισπάσθω ohne ungenaue Kennzeichnung als wörtliche Wiedergabe.
lexical_decisions:
- source_word: περιτετμημένος
  choice: als Beschnittener
  rationale: Das Perfektpartizip bezeichnet den fortbestehenden Zustand nach vollzogener Beschneidung. „Als Beschnittener“ gibt diesen Zustand im Deutschen natürlich wieder und entspricht parallel dem folgenden „als Unbeschnittener“.
- source_word: ἐκλήθη / κέκληταί
  choice: wurde … berufen
  rationale: „Berufen“ bewahrt den paulinischen Begriff für Gottes Ruf in das christliche Leben, ohne ihn durch „bekehrt“ erklärend einzuengen. Die unterschiedliche griechische Tempusform wird wegen der parallelen Aussage im Deutschen nicht künstlich hervorgehoben.
- source_word: ἐπισπάσθω
  choice: soll die Beschneidung nicht rückgängig zu machen suchen
  rationale: Das seltene Verb bezeichnet das Wiederherstellen beziehungsweise Vortäuschen einer Vorhaut und damit das Verbergen der Beschneidungsmerkmale. Die Übersetzung vermittelt den praktischen Sinn; die wörtlichere Wiedergabe steht in der Fußnote.
- source_word: ἐν ἀκροβυστίᾳ
  choice: als Unbeschnittener
  rationale: Die Wendung bezeichnet den unbeschnittenen Zustand zum Zeitpunkt der Berufung. „Als Unbeschnittener“ ist idiomatisch und wahrt die Parallelität des Satzes.
- source_word: περιτεμνέσθω
  choice: soll sich nicht beschneiden lassen
  rationale: Der verneinte Präsensimperativ drückt eine Anweisung aus. Die reflexiv-kausative deutsche Form bezeichnet natürlich, dass keine Beschneidung an ihm vorgenommen werden soll.
theological_decisions:
- issue: Bedeutung von „berufen“ in beiden Satzhälften
  choice: von Gott in das christliche Leben berufen, während der Betreffende beschnitten beziehungsweise unbeschnitten war
  alternative: lediglich allgemein gerufen oder aufgefordert
  rationale: Im unmittelbaren Zusammenhang von 1. Korinther 7 bezeichnet Paulus mit der Berufung den Ruf Gottes, der den Menschen in einer bestimmten Lebenslage erreichte. Die Übersetzung belässt es bei „berufen“ und vermeidet damit eine stärker deutende Paraphrase wie „bekehrt“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die rhetorischen Fragen und die parallele Struktur des griechischen Textes bleiben erhalten; Fachsprache zur antiken körperlichen Praxis wird im Haupttext vermieden und in der Fußnote erläutert.
