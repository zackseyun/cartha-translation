  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: de
  text: Ihr seid für einen Preis erkauft worden; werdet nicht zu Sklaven von Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: für einen Preis
  rationale: Der Genitiv bei ἀγοράζω bezeichnet den Kaufpreis beziehungsweise die Kosten. Die Formulierung bewahrt die Aussage eines tatsächlich geleisteten Preises, ohne dessen Art hier näher zu bestimmen.
- source_word: ἠγοράσθητε
  choice: ihr seid … erkauft worden
  rationale: Der Aorist Passiv, zweite Person Plural, bezeichnet einen vollzogenen Kauf. „Erkauft“ erhält sowohl das Kaufbild als auch dessen erlösungsbezogenen Klang im paulinischen Zusammenhang.
- source_word: μὴ γίνεσθε
  choice: werdet nicht
  rationale: γίνομαι bedeutet hier „werden“. Die Verneinung mit dem Präsensimperativ untersagt, in den bezeichneten Zustand einzutreten oder sich weiter in ihn hineinzubegeben.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Das Wort bezeichnet rechtlich und sozial Gebundene. Da der Satz mit Kauf und Zugehörigkeit arbeitet, ist „Sklaven“ präziser als das schwächere „Diener“.
- source_word: ἀνθρώπων
  choice: von Menschen
  rationale: Der Genitiv hängt von δοῦλοι ab. „Menschen“ gibt den allgemeinen, nicht auf männliche Personen beschränkten Sinn natürlich wieder und erhält den Gegensatz zwischen menschlicher Herrschaft und der Zugehörigkeit zum Herrn.
theological_decisions:
- issue: Wiedergabe von δοῦλοι ἀνθρώπων im Zusammenhang von Kauf, Zugehörigkeit und menschlicher Herrschaft
  choice: Sklaven von Menschen
  alternative: Diener von Menschen
  rationale: 'Das Bild beruht auf Besitz- und Herrschaftsverhältnissen: Die Angesprochenen sind erkauft worden und sollen sich daher nicht unter menschliche Verfügungsgewalt begeben. „Sklaven“ bewahrt diese Spannung; „Diener“ würde sie abschwächen. Der Satz verbietet damit nicht jeden menschlichen Dienst, sondern warnt im Bild vor versklavender menschlicher Herrschaft, ohne diese Deutung in den Haupttext einzutragen.'
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die knappe Parallelität und das Kauf-/Sklavereibild des griechischen Textes bleiben erhalten. „Menschen“ ist im heutigen Deutschen sachlich inklusiv, sodass keine Fußnote erforderlich ist.
