  source_fidelity: 'Der Text gibt τιμῆς ἠγοράσθητε als vollzogenen Kauf im Passiv wieder und bewahrt mit „für einen Preis“ die im Griechischen nicht näher bestimmte Preisangabe. „Werdet nicht zu Sklaven von Menschen“ entspricht μὴ γίνεσθε δοῦλοι ἀνθρώπων präzise: Der prozessuale Charakter von γίνεσθε, die gebundene Stellung von δοῦλοι und der umfassende Bezug von ἀνθρώπων bleiben erhalten.'
  naturalness: Die Formulierung ist klares modernes Standarddeutsch. Das Passiv „seid … erkauft worden“ und der anschließende Imperativ sind idiomatisch; das Semikolon bildet die knappe antithetische Struktur des griechischen Satzes angemessen nach.
  terminology: „Erkauft“ bewahrt das Kauf- und Erlösungsbild, ohne den im Vers nicht genannten Käufer zu ergänzen. „Sklaven“ ist für δοῦλοι im vorliegenden Besitz- und Zugehörigkeitsbild sachgerecht. „Menschen“ ist eine natürliche inklusive Wiedergabe von ἀνθρώπων und benötigt keine erläuternde Fußnote.
