source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: de
  text: Entzieht euch einander nicht – außer vielleicht im gegenseitigen Einvernehmen für eine Zeit –, damit ihr euch dem Gebet widmet und danach wieder zusammen seid[a], damit Satan euch nicht wegen eurer mangelnden Selbstbeherrschung versucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wieder zusammen seid“. Im Zusammenhang bezieht sich die Wendung auf die Wiederaufnahme des ehelichen Zusammenseins; die damit verbundene intime Dimension bleibt indirekt ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: entzieht euch
  rationale: Das Verb bezeichnet hier, dem Ehepartner etwas ihm Zustehendes vorzuenthalten. „Entzieht euch einander nicht“ gibt den ehelichen Zusammenhang natürlich und mit der ethischen Schärfe des griechischen Ausdrucks wieder, ohne einen unpassenden wirtschaftlichen Beiklang.
- source_word: ἀλλήλους
  choice: einander
  rationale: Die reziproke Form wahrt die ausdrückliche Gegenseitigkeit der Anweisung.
- source_word: εἰ μήτι ἂν
  choice: es sei denn vielleicht
  rationale: Die Formulierung führt eine vorsichtig qualifizierte Ausnahme ein. „Vielleicht“ bewahrt den zurückhaltenden Ton, statt die Ausnahme absolut zu formulieren.
- source_word: ἐκ συμφώνου
  choice: im gegenseitigen Einvernehmen
  rationale: Der Ausdruck bezeichnet die gemeinsame Zustimmung beider Ehepartner; „gegenseitig“ macht die beiderseitige Entscheidung deutlich.
- source_word: πρὸς καιρόν
  choice: für eine gewisse Zeit
  rationale: Die Wendung bezeichnet einen begrenzten, vorübergehenden Zeitraum.
- source_word: σχολάσητε
  choice: euch … widmet
  rationale: Im Zusammenhang bedeutet das Verb, für etwas frei zu sein und sich ihm bewusst zu widmen. Diese Wiedergabe ist im modernen Deutsch klar und idiomatisch.
- source_word: τῇ προσευχῇ
  choice: dem Gebet
  rationale: Der Singular entspricht dem griechischen Text und bezeichnet das Gebet als Praxis.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: danach wieder zusammen seid
  rationale: Die Wiedergabe bewahrt die zurückhaltende Ausdrucksweise des Originals und lässt die im Kontext erkennbare Wiederaufnahme des ehelichen Zusammenlebens einschließlich der körperlichen Gemeinschaft mitschwingen.
- source_word: πειράζῃ
  choice: versuchen
  rationale: In Verbindung mit Satan geht es um Verführung zur Sünde, nicht um eine neutrale Erprobung.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: ἀκρασίαν
  choice: mangelnde Selbstbeherrschung
  rationale: Das Substantiv bezeichnet fehlende Fähigkeit zur Selbstkontrolle. Die Formulierung ist verständlich, modern und wahrt den Bezug zum sexuellen Kontext.
theological_decisions:
- issue: Ob πάλιν ἐπὶ τὸ αὐτὸ ἦτε ausdrücklich als Wiederaufnahme sexueller Beziehungen oder allgemeiner als erneutes Zusammensein wiederzugeben ist
  choice: „danach wieder zusammen seid“, mit Erläuterung in einer Fußnote
  alternative: „danach wieder Geschlechtsverkehr habt“
  rationale: Der Zusammenhang schließt die eheliche Intimität ein, doch Paulus formuliert selbst indirekt. Die Übersetzung bewahrt diese sprachliche Zurückhaltung und löst die mögliche Bedeutungsbreite nicht unnötig auf.
- issue: Ob ὁ Σατανᾶς als Personenname oder allgemein als „der Widersacher“ wiederzugeben ist
  choice: Satan
  alternative: der Widersacher
  rationale: Im paulinischen Sprachgebrauch bezeichnet der Ausdruck hier das persönliche Wesen Satan. Die übliche Namensform wahrt diesen Bezug, ohne zusätzliche Aussagen einzutragen.
- issue: Verhältnis zwischen zeitweiliger Enthaltsamkeit, Gebet und ehelicher Gemeinschaft
  choice: Die Ausnahme bleibt zeitlich begrenzt, an gegenseitiges Einvernehmen gebunden und auf das Gebet ausgerichtet
  alternative: Die Aussage als allgemeine Empfehlung sexueller Enthaltsamkeit zu verstehen
  rationale: Die grammatische Ausnahmeform und die anschließende Aufforderung zum erneuten Zusammensein setzen klare Grenzen, ohne eine darüber hinausgehende Ehelehre in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gegenseitige Verantwortung beider Ehepartner und die zurückhaltende Ausdrucksweise des griechischen Textes bleiben erhalten. Der abschließende Zwecksatz wurde als eigener Satz formuliert, um die lange griechische Satzstruktur im Deutschen klar lesbar wiederzugeben.
