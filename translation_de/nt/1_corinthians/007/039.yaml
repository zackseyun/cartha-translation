source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: de
  text: Eine Frau ist gebunden, solange ihr Mann lebt. Wenn ihr Mann aber entschlafen ist,[a] steht es ihr frei, zu heiraten, wen sie will – nur im Herrn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet wörtlich „eingeschlafen“ und ist hier eine geläufige Umschreibung für „gestorben“.
    reason: lexical_alternative
  - marker: b
    text: „Nur im Herrn“ wird häufig so verstanden, dass sie nur einen Menschen heiraten darf, der zum Herrn gehört, also einen Mitchristen. Die knappe Formulierung kann zugleich eine Eheschließung im Einklang mit der Zugehörigkeit zum Herrn bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: eine Frau
  rationale: Im Zusammenhang bezeichnet γυνή eine verheiratete Frau. Das natürliche deutsche „eine Frau“ trägt hier durch die Erwähnung „ihr Mann“ eindeutig die Bedeutung „Ehefrau“.
- source_word: δέδεται
  choice: ist gebunden
  rationale: Das Perfekt Passiv bezeichnet einen fortdauernden Zustand rechtlich-relationaler Bindung; „ist gebunden“ gibt dies ohne erklärenden Zusatz wieder.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: solange … lebt
  rationale: Die knappe deutsche Zeitangabe entspricht der griechischen Wendung für die gesamte Dauer des Lebens.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: ihr Mann
  rationale: ἀνήρ bedeutet in diesem ehelichen Zusammenhang „Ehemann“; „ihr Mann“ ist natürliches modernes Deutsch.
- source_word: κοιμηθῇ
  choice: entschlafen ist
  rationale: „Entschlafen“ bewahrt den griechischen Todeseuphemismus, ist im Deutschen verständlich und zugleich würdevoll; eine Fußnote nennt die unmittelbare Bedeutung.
- source_word: ἐλευθέρα ἐστίν
  choice: steht es ihr frei
  rationale: Die idiomatische deutsche Formulierung bezeichnet klar ihre Freiheit von der bisherigen ehelichen Bindung.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: zu heiraten, wen sie will
  rationale: Obwohl γαμηθῆναι formal passiv ist, drückt „zu heiraten“ im Deutschen denselben Vorgang natürlich aus; „wen sie will“ bewahrt ihre ausdrücklich genannte Wahlfreiheit.
- source_word: μόνον ἐν κυρίῳ
  choice: nur im Herrn
  rationale: Die knappe paulinische Einschränkung wird formal bewahrt, ohne ihre interpretativ verdichtete Bedeutung im Haupttext auf eine einzige Auslegung festzulegen.
theological_decisions:
- issue: Bedeutung von „im Herrn“ bei der Wiederheirat
  choice: Die Formulierung „nur im Herrn“ bleibt im Haupttext erhalten.
  alternative: nur einen Mitchristen / nur in einer dem Herrn entsprechenden Weise
  rationale: ἐν κυρίῳ ist theologisch gehaltvoll und kann sowohl die Zugehörigkeit eines möglichen Ehepartners zum Herrn als auch die Ausrichtung der Eheschließung am Herrn anklingen lassen. Die wörtliche Form bewahrt diese Spannung; die verbreitete Deutung wird in der Fußnote genannt.
- issue: Todeseuphemismus κοιμηθῇ
  choice: „entschlafen ist“ bewahrt das Bild im Haupttext.
  alternative: gestorben ist
  rationale: Paulus verwendet ein Schlafwort als geläufigen Euphemismus für den Tod. Das deutsche „entschlafen“ erhält dieses Bild, während die Fußnote den Sinn ausdrücklich erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist klar und knapp; „entschlafen“ wahrt bewusst die Metapher des Ausgangstextes, während „nur im Herrn“ wegen seiner theologischen Verdichtung unaufgelöst bleibt.
