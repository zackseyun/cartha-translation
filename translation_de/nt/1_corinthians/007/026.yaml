id: 1CO.7.26
reference: 1 Corinthians 7:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: de
  text: 'Darum halte ich dies wegen der gegenwärtigen Bedrängnis[a] für gut: Es ist gut für einen Menschen[b], so zu bleiben, wie er ist[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen der gegenwärtigen Not“ beziehungsweise „wegen der bestehenden Notwendigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für einen Mann“. Das griechische Wort kann hier auch allgemein einen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „so zu sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: halte ich … für
  rationale: Gibt das persönliche, abgewogene Urteil des Paulus idiomatisch wieder, ohne daraus ein absolutes Gebot zu machen.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet natürlich und klar die Folgerung aus dem vorausgehenden Gedankengang.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: halte ich dies … für gut
  rationale: Die Infinitivkonstruktion wird im Deutschen idiomatisch in die Wendung „für gut halten“ überführt; „gut“ bewahrt die Wiederholung von καλόν.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: wegen der gegenwärtigen Bedrängnis
  rationale: ἀνάγκη kann Not, Zwang oder Notwendigkeit bezeichnen; „Bedrängnis“ erfasst hier eine belastende Lage. ἐνεστῶσαν bezeichnet sie als gegenwärtig.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen flüssig den Inhalt des Urteils ein, den ὅτι hier wahrscheinlich markiert, ohne eine kausale Deutung festzuschreiben.
- source_word: καλὸν
  choice: Es ist gut
  rationale: Bewahrt die ausdrücklich wiederholte Wertung des griechischen Textes und vermeidet eine stärkere Auslegung wie „vorteilhaft“.
- source_word: ἀνθρώπῳ
  choice: für einen Menschen
  rationale: ἄνθρωπος kann generisch einen Menschen bezeichnen. Die neutrale deutsche Wiedergabe bewahrt diesen möglichen Umfang, ohne das kontextuelle Geschlecht vorzuentscheiden.
- source_word: τὸ οὕτως εἶναι
  choice: so zu bleiben, wie er ist
  rationale: Das wörtliche „so zu sein“ verweist im Zusammenhang auf den bestehenden Lebensstand; „bleiben“ macht die Fortdauer idiomatisch deutlich, während eine Fußnote den Wortlaut offenlegt.
theological_decisions:
- issue: Charakter der Aussage des Paulus
  choice: Ein situationsbezogenes, persönlich formuliertes Urteil angesichts gegenwärtiger Bedrängnis
  alternative: Eine zeitlose allgemeine Bevorzugung der Ehelosigkeit oder ein Verbot der Ehe
  rationale: „Ich halte … für“ und die Begründung mit der gegenwärtigen Bedrängnis sprechen für pastoralen Rat in einer konkreten Lage. Der Text selbst formuliert hier kein allgemeines Eheverbot.
- issue: Bezug von ἀνθρώπῳ
  choice: Generisch als „für einen Menschen“
  alternative: Spezifisch als „für einen Mann“
  rationale: Die griechische Form kann generisch gebraucht sein. Da der unmittelbare Zusammenhang verschiedene Lebensstände und Adressaten behandelt, wird die mögliche Allgemeingültigkeit nicht auf männliche Personen verengt; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und pastoral zurückhaltend. Die Wiederholung von „gut“ entspricht dem griechischen Text; die Ambiguitäten bei ἀνάγκη, ἀνθρώπῳ und τὸ οὕτως εἶναι werden in Fußnoten erhalten.
