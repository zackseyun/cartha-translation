  naturalness: Die vorgeschlagene Fassung ist flüssig und hat einen angemessen würdigen, modernen Ton. „Ich möchte aber, dass … so wären“ ist idiomatisch und bewahrt die Spannung von persönlichem Wunsch und der anschließenden Einschränkung.
