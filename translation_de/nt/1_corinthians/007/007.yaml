id: 1CO.7.7
reference: 1 Corinthians 7:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: de
  text: Ich möchte aber, dass alle Menschen so wären wie ich selbst. Doch jeder hat seine eigene Gnadengabe von Gott, der eine so, der andere so.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: Ich wünschte
  rationale: Im Zusammenhang bezeichnet Paulus einen Wunsch, nicht einen Befehl; die deutsche Wunschform gibt diese pragmatische Nuance natürlich wieder.
- source_word: πάντας ἀνθρώπους
  choice: alle Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein; der Kontext beschränkt die Aussage nicht ausdrücklich auf Männer.
- source_word: χάρισμα
  choice: Gnadengabe
  rationale: Der Begriff bezeichnet eine von Gott geschenkte Befähigung oder Lebensgabe und bewahrt durch „Gnade“ den Geschenkcharakter.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: der eine so, der andere so
  rationale: Die knappe Gegenüberstellung des Griechischen bleibt erhalten, ohne die jeweiligen Gaben interpretierend festzulegen.
theological_decisions:
- issue: Worauf sich „so wie ich selbst“ bezieht
  choice: Die Formulierung bleibt unbestimmt.
  alternative: Ausdrückliche Wiedergabe als unverheiratet oder enthaltsam
  rationale: Der nähere Kontext legt Paulus’ unverheirateten beziehungsweise enthaltsamen Lebensstand nahe, doch der Vers selbst benennt ihn nicht ausdrücklich.
- issue: Art der jeweiligen Gnadengabe
  choice: „der eine so, der andere so“
  alternative: Explizite Zuordnung zu Ehelosigkeit und Ehe
  rationale: Die elliptische Form wahrt die genuine Offenheit des Ausgangstextes und vermeidet eine dogmatische Präzisierung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Zwar … doch“ bildet die Spannung zwischen persönlichem Wunsch und unterschiedlichen göttlichen Gaben flüssig ab.
