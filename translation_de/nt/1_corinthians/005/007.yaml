source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: de
  text: Fegt den alten Sauerteig aus, damit ihr ein neuer Teig seid, wie ihr ja ungesäuert seid. Denn auch unser Passahlamm[a], der Messias[b], ist geopfert worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unser Passah“. Gemeint sein kann auch „unser Passahopfer“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch Christos; hier als Titel „der Messias“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Fegt … aus
  rationale: Der Aoristimperativ fordert die Gemeinde nachdrücklich dazu auf, etwas gründlich zu entfernen. „Ausfegen“ ist im Deutschen natürlich und führt zugleich das Bild aus Haushalt und Backstube fort.
- source_word: παλαιὰν ζύμην
  choice: den alten Sauerteig
  rationale: „Sauerteig“ bewahrt sowohl das konkrete Bild als auch den Zusammenhang mit dem Passafest und dem ungesäuerten Brot.
- source_word: ἵνα ἦτε
  choice: damit ihr … seid
  rationale: Die Formulierung gibt den Zweck bzw. das beabsichtigte Ergebnis wieder und wahrt die Spannung zur unmittelbar folgenden Aussage über den bereits bestehenden Status der Gemeinde.
- source_word: νέον φύραμα
  choice: ein neuer Teig
  rationale: φύραμα bezeichnet eine geknetete Teigmasse. „Teig“ ist im Deutschen idiomatisch und hält das Backbild klar erkennbar.
- source_word: καθώς ἐστε ἄζυμοι
  choice: wie ihr ja ungesäuert seid
  rationale: „Wie“ entspricht καθώς; „ja“ macht den bestätigenden Bezug auf die bestehende Identität der Gemeinde natürlich hörbar, ohne ihn zu einer bloßen Begründung umzudeuten.
- source_word: τὸ πάσχα ἡμῶν
  choice: unser Passahlamm
  rationale: Wörtlich steht „unser Passa“. Da das folgende Verb das Schlachten eines Opfertiers bezeichnet, macht „Passahlamm“ den im Kontext vorausgesetzten Opferbezug verständlich; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: ἐτύθη
  choice: ist geopfert worden
  rationale: Der Aorist Passiv von θύω bezeichnet hier das rituelle Schlachten. „Ist geopfert worden“ drückt den Opfercharakter deutlich aus, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός steht hier in einer hervorgehobenen, deutenden Beziehung zum Passaopfer. „Der Messias“ gibt den Titelsinn im jüdischen Passakontext deutlich wieder.
theological_decisions:
- issue: Wiedergabe von πάσχα in der Beziehung zum Messias
  choice: unser Passahlamm
  alternative: unser Passa; unser Passaopfer
  rationale: Der griechische Text sagt knapp „unser Passa“, doch ἐτύθη verweist auf ein geschlachtetes Opfer. „Passahlamm“ erschließt den gemeinten Opferbezug, während die Fußnote die formale Offenheit des Ausdrucks bewahrt.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Im Passakontext tritt der Titelcharakter hervor. „Der Messias“ bewahrt diesen Sinn; „Christus“ wäre als traditionelle, stärker namensartige Wiedergabe ebenfalls möglich.
- issue: Spannung zwischen Aufforderung und bestehender Identität
  choice: „damit ihr ein neuer Teig seid, wie ihr ja ungesäuert seid“
  alternative: „damit ihr ein neuer Teig werdet, weil ihr ungesäuert seid“
  rationale: 'Die Übersetzung bewahrt die Spannung des griechischen Textes: Die Gemeinde soll in der Praxis werden bzw. sein, was sie ihrem Status nach bereits ist. Sie löst καθώς nicht eindeutig kausal auf.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das anschauliche „ausfegen“ und die Begriffe „Sauerteig“, „Teig“ und „ungesäuert“ erhalten die durchgehende Bildwelt. Die Schlussklausel bleibt knapp und feierlich; die Apposition „der Messias“ verdeutlicht die Identifikation, ohne die Passatypologie weiter auszudeuten.
