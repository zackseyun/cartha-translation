id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: de
  text: Damit meinte ich keineswegs die sexuell unmoralischen Menschen dieser Welt oder die Habgierigen und Ausbeuter[a] oder Götzendiener. Sonst müsstet ihr ja die Welt verlassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Räuber“ oder „Erpresser“. Das griechische Wort bezeichnet Menschen, die anderen durch Gewalt oder Ausbeutung etwas wegnehmen.'
    reason: lexical_alternative
  - marker: b
    text: Paulus stellt klar, dass er nicht meinte, Gläubige müssten jeden Kontakt mit unmoralisch lebenden Menschen außerhalb der Gemeinde meiden; vergleiche 1. Korinther 5,11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Damit meinte ich keineswegs
  rationale: Der Ausdruck schränkt im Zusammenhang eine frühere Anweisung ein. Die Ergänzung „Damit meinte ich“ macht diesen im Griechischen elliptisch vorausgesetzten Bezug im Deutschen verständlich, während „keineswegs“ die nachdrückliche Verneinung bewahrt.
- source_word: τοῖς πόρνοις τοῦ κόσμου τούτου
  choice: die sexuell unmoralischen Menschen dieser Welt
  rationale: πόρνοις bezeichnet Menschen, die sexuelle Unmoral praktizieren; die Formulierung bleibt sexuell spezifisch. „Dieser Welt“ gibt den gesellschaftlichen Bereich außerhalb der Gemeinde wieder, ohne ihn näher auszudeuten.
- source_word: τοῖς πλεονέκταις
  choice: die Habgierigen
  rationale: πλεονέκτης bezeichnet einen Menschen, der immer mehr haben will, häufig auf Kosten anderer. „Habgierig“ ist gegenwärtig, verständlich und präzise.
- source_word: καὶ ἅρπαξιν
  choice: und Ausbeuter
  rationale: ἅρπαξ kann Menschen bezeichnen, die sich fremdes Gut gewaltsam oder durch ausbeuterisches Handeln aneignen. „Ausbeuter“ wahrt diese Breite besser als das engere „Räuber“ oder „Erpresser“.
- source_word: εἰδωλολάτραις
  choice: Götzendiener
  rationale: Die traditionelle deutsche Bezeichnung ist knapp, verständlich und entspricht Menschen, die Götzen verehren.
- source_word: ἐπεὶ ὠφείλετε ἄρα
  choice: Sonst müsstet ihr ja
  rationale: ἐπεί mit ἄρα führt hier die unausweichliche Folge einer absoluten Auslegung an; „sonst … ja“ bildet diese folgernde, leicht zugespitzte Argumentation natürlich ab.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: die Welt verlassen
  rationale: 'Die Formulierung erhält die bewusst drastische Konsequenz: Eine vollständige Trennung von solchen Menschen würde erfordern, aus der Welt hinauszugehen.'
theological_decisions:
- issue: Umfang der geforderten Absonderung
  choice: Paulus verneint, dass seine frühere Anweisung eine vollständige Trennung von sexuell unmoralischen und anderen sündig handelnden Menschen außerhalb der Gemeinde verlangte.
  alternative: Paulus verlange den vollständigen gesellschaftlichen Rückzug von allen solchen Menschen.
  rationale: Die Folgerung, man müsste sonst die Welt verlassen, begrenzt die frühere Anweisung ausdrücklich. Die Übersetzung macht diese Klarstellung sichtbar, ohne die Anwendung über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Satzanschluss macht die griechische Ellipse für heutige Leser verständlich. Die Aufzählung bleibt sachlich und direkt; „die Welt verlassen“ bewahrt die zugespitzte Wirkung des Originals. Sämtliche Fußnotenmarker stehen im Haupttext.
