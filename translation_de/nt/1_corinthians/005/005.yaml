id: 1CO.5.5
reference: 1 Corinthians 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: de
  text: einen solchen Mann dem Satan zu übergeben, zum Verderben des Fleisches[a], damit der Geist am Tag des Herrn[b] gerettet wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Vernichtung des Fleisches“. Die Wendung kann ein schweres körperliches Gericht bezeichnen oder, bildlich verstanden, das Ende der fleischlichen beziehungsweise sündigen Ausrichtung dieses Mannes.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften haben statt „des Herrn“: „unseres Herrn Jesus“ oder „des Herrn Jesus“.'
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: zu übergeben
  rationale: Der Aoristinfinitiv bezeichnet die von Paulus verlangte Handlung. „Übergeben“ gibt παραδίδωμι natürlich und mit der nötigen Ernsthaftigkeit wieder.
- source_word: τὸν τοιοῦτον
  choice: einen solchen Menschen
  rationale: Die Formulierung verweist auf den konkreten männlichen Täter und behält zugleich den kategorisierenden Ton bei; „Menschen“ klingt im heutigen Deutsch natürlicher als „Mann“, ohne den Bezug zu verändern.
- source_word: Σατανᾷ
  choice: dem Satan
  rationale: Der Eigenname wird nach üblicher deutscher Konvention wiedergegeben; der Dativ entspricht der griechischen Konstruktion.
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: damit das Fleisch vernichtet wird
  rationale: Die zielgerichtete Konstruktion εἰς ὄλεθρον wird als beabsichtigte Folge ausgedrückt. „Fleisch“ bewahrt die Mehrdeutigkeit von σάρξ zwischen dem körperlichen Leben und der sündig-fleischlichen Ausrichtung.
- source_word: ἵνα
  choice: sodass
  rationale: Leitet das beabsichtigte Ergebnis ein. „Sodass“ stellt den Zusammenhang im Deutschen klar dar, ohne Zweck und Folge scharf gegeneinander abzugrenzen.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Wie im Griechischen wird kein Possessivpronomen ergänzt. So bleibt die sprachliche Zurückhaltung des Ausgangstextes erhalten.
- source_word: σωθῇ
  choice: gerettet wird
  rationale: Das passive Verb bewahrt die Heilssprache des griechischen σωθῇ und gibt das beabsichtigte Ergebnis natürlich wieder.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: am Tag
  rationale: „Am Tag“ ist die idiomatische moderne deutsche Wiedergabe der temporalen Wendung.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Folgt genau dem SBLGNT-Text κυρίου, ohne die in manchen Handschriften bezeugten Erweiterungen einzufügen.
theological_decisions:
- issue: Bedeutung von „Vernichtung des Fleisches“
  choice: Die mehrdeutige Bezeichnung „das Fleisch vernichtet wird“ bleibt im Haupttext stehen.
  alternative: Schwere körperliche Züchtigung oder Tod; alternativ die Beseitigung der sündig-fleischlichen Ausrichtung des Menschen.
  rationale: Der griechische Ausdruck legt eine ernste Gerichts- beziehungsweise Zuchtmaßnahme nahe, entscheidet aber nicht eindeutig zwischen körperlicher Schädigung und einer übertragenen Bedeutung. Die Übersetzung löst diese Spannung daher nicht auf.
- issue: Bezug von „der Geist“
  choice: „der Geist“ ohne ergänztes Possessivpronomen
  alternative: „sein Geist“
  rationale: Der Kontext legt zwar den Geist des Betroffenen nahe, doch der griechische Text enthält kein ausdrückliches Possessivpronomen.
- issue: Eschatologische Wendung „Tag des Herrn“
  choice: „am Tag des Herrn“ gemäß dem Ausgangstext
  alternative: „am Tag unseres Herrn Jesus“ oder „am Tag des Herrn Jesus“
  rationale: Der vorgelegte SBLGNT-Text liest lediglich κυρίου. Die Übersetzung übernimmt keine Erweiterung aus anderen Handschriften.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem argumentativen Verlauf des Griechischen nahe, wird aber idiomatisch formuliert. Umstrittene Aussagen über „Fleisch“ und „Geist“ werden nicht konfessionell oder dogmatisch vereindeutigt.
