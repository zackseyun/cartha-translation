  naturalness: „Einen solchen Mann dem Satan zu übergeben, zum Verderben des Fleisches, damit der Geist am Tag des Herrn gerettet wird“ ist würdiges, modernes Standarddeutsch und bewahrt die bewusst unvollständige Infinitivsatzstruktur des griechischen Kontextanschlusses.
  terminology: „Verderben des Fleisches“ wahrt die Ambiguität von ὄλεθρος und σάρξ besser als „das Fleisch vernichtet wird“. „Herr“, „Satan“, „Geist“ und „gerettet“ sind terminologisch sachgerecht. „Mann“ gibt die maskuline Referenz von τὸν τοιοῦτον expliziter wieder als das hier potenziell geschlechtsneutral lesbare „Menschen“.
