id: 1CO.5.4
reference: 1 Corinthians 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: de
  text: Im Namen unseres Herrn Jesus[a], wenn ihr versammelt seid und mein Geist bei euch ist, zusammen mit der Kraft unseres Herrn Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder in anderer Satzverbindung: „Wenn ihr im Namen unseres Herrn Jesus versammelt seid und mein Geist bei euch ist, zusammen mit der Kraft unseres Herrn Jesus …“ Der griechische Satz ist stark verdichtet, sodass die genaue Zuordnung von „im Namen unseres Herrn Jesus“ offenbleibt.'
    reason: syntaktische Alternative
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: Im Namen
  rationale: Die geläufige deutsche Wendung bewahrt die griechische Formulierung und kann zugleich das Handeln unter Jesu Vollmacht ausdrücken.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ entspricht dem neutestamentlichen Titel κύριος und bewahrt dessen christologisches Gewicht.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Personenname wird nach üblicher deutscher Konvention wiedergegeben.
- source_word: συναχθέντων ὑμῶν
  choice: wenn ihr versammelt seid
  rationale: Der Genitivus absolutus mit Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben, ohne eine genaue zeitliche Abfolge festzulegen.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: mein Geist bei euch ist
  rationale: Die im Griechischen knappe Konstruktion wird für verständliches Deutsch behutsam ergänzt und drückt Paulus’ nicht körperliche Gegenwart aus, ohne deren Art näher zu bestimmen.
- source_word: σὺν
  choice: zusammen mit
  rationale: Die Wiedergabe macht die Begleitung deutlich und verhindert, dass „mit“ unmittelbar nur auf Paulus’ Geist bezogen wird.
- source_word: δυνάμει
  choice: Kraft
  rationale: „Kraft“ bewahrt die Grundbedeutung von δύναμις und bezeichnet hier die wirksame Kraft bei der angekündigten Handlung, ohne sie auf bloße Amtsvollmacht einzuengen.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: unseres Herrn Jesus
  rationale: Der Genitiv wird direkt beibehalten und lässt offen, ob vor allem Zugehörigkeit, Ursprung oder Wirksamkeit gemeint ist.
theological_decisions:
- issue: Art der Gegenwart des Paulus in der Versammlung
  choice: Paulus sagt, dass sein Geist bei der Gemeinde ist, obwohl er körperlich abwesend ist.
  alternative: „Geist“ könnte lediglich seine Gesinnung oder Absicht bezeichnen oder eine stärker mystische Gegenwart meinen.
  rationale: Der Text behauptet eine nicht körperliche Beteiligung des Paulus, erklärt aber deren metaphysische Art nicht. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung der Kraft des Herrn Jesus
  choice: Die Formulierung wird als „Kraft unseres Herrn Jesus“ wiedergegeben.
  alternative: Man könnte stärker deutend „Vollmacht unseres Herrn Jesus“ übersetzen.
  rationale: „Kraft“ entspricht δύναμις unmittelbarer und lässt offen, wie wirksame Kraft und Autorität hier zusammenhängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bewusst eng am griechischen, unvollständigen Satzanschluss, da Vers 4 in Vers 5 weitergeführt wird. Das Komma am Ende signalisiert diese Fortsetzung.
