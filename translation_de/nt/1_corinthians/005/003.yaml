  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: de
  text: Denn ich bin zwar dem Körper nach abwesend, dem Geist nach aber anwesend[a] und habe bereits, als wäre ich anwesend, über den, der dies so getan hat, geurteilt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Geist“ ist hier wahrscheinlich Paulus’ eigener Geist gemeint, nicht der Heilige Geist.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „habe bereits das Urteil gesprochen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorausgehenden Zusammenhang.
- source_word: ἀπὼν τῷ σώματι
  choice: dem Körper nach abwesend
  rationale: Gibt den Dativ als Angabe der Hinsicht wieder und vermeidet die mögliche Vorstellung einer Trennung vom Körper im Tod.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: dem Geist nach aber anwesend
  rationale: Erhält den knappen Gegensatz zwischen körperlicher Abwesenheit und geistiger Anwesenheit, ohne die genaue Art dieser Anwesenheit auszudeuten.
- source_word: ἤδη κέκρικα
  choice: habe bereits … geurteilt
  rationale: Das Perfekt bezeichnet ein schon gefälltes und weiterhin geltendes Urteil; „urteilen“ bleibt nahe an κρίνω.
- source_word: ὡς παρὼν
  choice: als wäre ich anwesend
  rationale: Gibt die vergleichende Kraft von ὡς idiomatisch wieder.
- source_word: τὸν … κατεργασάμενον
  choice: über den, der … getan hat
  rationale: Das substantivierte Partizip bezeichnet den Täter; die deutsche Konstruktion mit „über“ ist bei „urteilen“ natürlich.
- source_word: οὕτως τοῦτο
  choice: so etwas
  rationale: Die idiomatische deutsche Wendung bildet sowohl den Rückbezug auf die konkrete Tat als auch deren außergewöhnliche beziehungsweise anstößige Art ab, ohne die schwerfällige Formulierung „dies auf solche Weise“ zu erzwingen.
theological_decisions:
- issue: Bedeutung von „dem Geist nach anwesend“
  choice: Die Formulierung bleibt auf Paulus’ nichtkörperliche Anwesenheit bezogen, ohne deren genaue Art festzulegen.
  alternative: πνεύματι könnte als Hinweis auf die Gegenwart oder Offenbarung des Heiligen Geistes oder auf eine stärkere mystische Anwesenheit verstanden werden.
  rationale: Der unmittelbare Gegensatz zwischen σώματι und πνεύματι legt Paulus’ eigenen Geist nahe. Die Übersetzung bewahrt dennoch die Spannung und führt keine Theorie geistlicher Anwesenheit ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem argumentativen Aufbau des Griechischen, wird jedoch durch die Wendung „so etwas“ natürlich lesbar gehalten.
