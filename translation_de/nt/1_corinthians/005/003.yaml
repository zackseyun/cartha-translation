  naturalness: „Dem Körper nach abwesend, dem Geist nach aber anwesend“ ist verständliches, würdiges modernes Standarddeutsch und wahrt die bewusst parallele Formulierung. „Über den … geurteilt“ ist in diesem Kontext idiomatisch. „Der dies so getan hat“ ist ebenso natürlich und bildet die beiden Elemente des griechischen Ausdrucks genauer ab als „der so etwas getan hat“.
  terminology: „Körper“ und „Geist“ bewahren den körperlich/geistlichen Kontrast, ohne eine bestimmte Lehre über geistliche Gegenwart einzutragen. „Geurteilt“ entspricht κέκρικα angemessen. Die Fußnoten sind sachlich, nicht konfessionell festlegend und ihre Anker stehen an den jeweils passenden Übersetzungselementen.
