revisions:
- from: Denn ich bin zwar dem Körper nach abwesend, dem Geist nach aber anwesend[a] und habe bereits, als wäre ich anwesend, über den, der so etwas getan hat, geurteilt.[b]
  to: Denn ich bin zwar dem Körper nach abwesend, dem Geist nach aber anwesend[a] und habe bereits, als wäre ich anwesend, über den, der dies so getan hat, geurteilt.[b]
  rationale: Die einzige Änderung ersetzt „so etwas“ durch „dies so“. Dadurch bleiben sowohl der konkrete Rückverweis auf die Tat als auch die im Griechischen ausgedrückte Art bzw. Nachdrücklichkeit der Tat sichtbar. Satzregister, Ambiguität von „Geist“ und die bestehenden Fußnoten bleiben erhalten.
