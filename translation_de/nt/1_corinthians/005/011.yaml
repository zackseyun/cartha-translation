revisions:
- from: 'Nun aber habe ich euch geschrieben: Habt keinen Umgang mit jemandem, der Bruder genannt wird und sexuell unmoralisch lebt oder habgierig, ein Götzendiener, ein Verleumder, ein Trunkenbold oder ein Ausbeuter[a] ist. Mit einem solchen Menschen sollt ihr nicht einmal zusammen essen.'
  to: 'Nun aber schreibe ich euch: Habt keinen Umgang mit jemandem, der Bruder genannt wird, wenn er sexuell unmoralisch lebt oder habgierig ist oder ein Götzendiener, Beschimpfer, Trunkenbold oder Räuber[a] ist. Mit einem solchen sollt ihr nicht einmal zusammen essen.'
  rationale: Die Revision ersetzt zwei semantisch zu enge beziehungsweise zu breite Personenbezeichnungen und glättet die Aufzählung. „der Bruder genannt wird“ bewahrt die offene Formulierung ἀδελφὸς ὀνομαζόμενος. „Nun aber schreibe ich“ gibt den in einem Brief möglichen epistolaren Aorist ἔγραψα idiomatisch wieder, ohne über die genaue Referenz des vorherigen Schreibens zu entscheiden. Die Aussage über das gemeinsame Essen bleibt bewusst allgemein.
