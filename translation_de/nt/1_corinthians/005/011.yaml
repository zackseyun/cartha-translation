  variant: modern standard German
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: de
  text: 'Nun aber schreibe ich euch: Habt keinen Umgang mit jemandem, der Bruder genannt wird, wenn er sexuell unmoralisch lebt oder habgierig ist oder ein Götzendiener, Beschimpfer, Trunkenbold oder Räuber[a] ist. Mit einem solchen sollt ihr nicht einmal zusammen essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Erpresser; das griechische Wort bezeichnet einen Menschen, der sich fremdes Gut räuberisch oder erpresserisch aneignet.'
    reason: ἅρπαξ umfasst neben dem unmittelbaren Sinn „Räuber“ auch erpresserisches beziehungsweise gewaltsames Aneignen.
lexical_decisions:
- source_word: συναναμίγνυσθαι
  choice: Umgang haben
  rationale: Gibt das bewusste gesellschaftliche Sich-Einlassen natürlich wieder, ohne jede unvermeidliche Begegnung auszuschließen.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: der Bruder genannt wird
  rationale: Bewahrt die offene Formulierung des Griechischen und entscheidet nicht vorweg, ob die Bezeichnung berechtigt oder nur beansprucht ist.
- source_word: πόρνος
  choice: sexuell unmoralisch lebt
  rationale: Bezeichnet hier eine Person, deren Verhalten von sexueller Unmoral geprägt ist; die verbale Wiedergabe ist im heutigen Deutsch klarer als ein substantivisches Etikett.
- source_word: πλεονέκτης
  choice: habgierig
  rationale: Trifft das ungezügelte Habenwollen und unterscheidet es von dem räuberisch-ausbeuterischen Sinn von ἅρπαξ.
- source_word: λοίδορος
  choice: Verleumder
  rationale: Bezeichnet jemanden, der andere mit herabsetzender, schmähender Rede angreift; „Verleumder“ ist verständlich und personbezogen.
- source_word: μέθυσος
  choice: Trunkenbold
  rationale: Gibt nicht bloß gelegentlichen Alkoholkonsum, sondern die charakteristische Trunksucht der Personenbezeichnung wieder.
- source_word: ἅρπαξ
  choice: Ausbeuter
  rationale: Erfasst eine Person, die andere raubgierig oder erpresserisch um ihren Besitz bringt, ohne die Bedeutung auf einen bestimmten Straftatbestand zu verengen.
- source_word: συνεσθίειν
  choice: zusammen essen
  rationale: Entspricht der konkreten Aussage des Verbs und lässt den genauen sozialen oder gemeindlichen Rahmen unbestimmt.
theological_decisions:
- issue: Status der als „Bruder“ bezeichneten Person
  choice: 'Neutral: „der Bruder genannt wird“'
  alternative: „der sich Bruder nennt“ oder „der angeblich ein Bruder ist“
  rationale: Der Text beschreibt die Benennung, erklärt aber nicht ausdrücklich, ob sie Selbstbezeichnung, Anerkennung der Gemeinde oder bloßer Anspruch ist.
- issue: Reichweite des gemeinsamen Essens
  choice: Die allgemeine Formulierung „zusammen essen“ beibehalten
  alternative: Auf das Abendmahl oder ausschließlich auf private Mahlzeiten festlegen
  rationale: συνεσθίειν nennt gemeinsames Essen, bestimmt hier aber nicht ausdrücklich eine einzige Art von Mahlzeit; eine konfessionelle Eingrenzung wäre unbegründet.
- issue: Zeitwert von ἔγραψα
  choice: „habe ich euch geschrieben“
  alternative: „schreibe ich euch“
  rationale: Der griechische Aorist lautet formal „ich schrieb/habe geschrieben“, kann jedoch briefsprachlich auf das gegenwärtige Schreiben weisen. Die gewählte Form wahrt die formale Gestalt, ohne den Bezug dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem Imperativ. Die Aufzählung folgt der griechischen Struktur, wird aber für natürliche deutsche Syntax teilweise verbal wiedergegeben. Keine konfessionelle Festlegung zum Mahl oder zum geistlichen Status der bezeichneten Person.
