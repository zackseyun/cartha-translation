    issue: „unter den Völkern“ für ἐν τοῖς ἔθνεσιν
    rationale: Im gegebenen Kontext meint ἔθνη die nichtjüdischen Völker/Gentiles. Die deutsche Formulierung kann sämtliche Völker einschließen und verschiebt damit den Kontrast. „Unter den Nichtjuden“ ist genauer und neutral.
  - severity: low
    issue: Fußnote b nennt eine „partnerschaftliche beziehungsweise sexuelle Beziehung“
    rationale: Der Kontext und der Ausdruck ἔχειν weisen auf eine sexuelle Beziehung. „Partnerschaftlich“ ist nicht im Text ausgedrückt und kann die Aussage unnötig abschwächen oder anders bestimmen.
