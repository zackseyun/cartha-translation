  source_fidelity: 'Der Entwurf gibt die emphatische Meldung, die Wiederholung von πορνεία und die euphemistische Kürze von ἔχειν im Wesentlichen zutreffend wieder. „Unter den Völkern“ ist jedoch im deutschen Haupttext zu weit bzw. missverständlich: ἐν τοῖς ἔθνεσιν bezeichnet in diesem paulinischen Kontext die nichtjüdischen Völker, nicht sämtliche Völker einschließlich Israels. „Unter den Nichtjuden“ bildet diese Referenz ohne die potenziell wertende Konnotation von „Heiden“ genauer ab.'
  naturalness: „Tatsächlich hört man“ und die Satzgliederung sind modernes, natürliches Standarddeutsch. Die Wiederholung „von sexueller Unmoral … von einer solchen sexuellen Unmoral“ wirkt etwas schwerfällig; eine direkte Wiederholung ohne das zweite „von“ ist flüssiger und wahrt den Nachdruck des Griechischen.
  terminology: „Sexuelle Unmoral“ ist als breite, moderne Wiedergabe von πορνεία vertretbar. „Die Frau seines Vaters“ wahrt bewusst die nicht weiter spezifizierte griechische Bezeichnung und sollte gegenüber „Stiefmutter“ im Haupttext beibehalten werden. Die Fußnote zu ἔχειν sollte nicht eine bloß „partnerschaftliche“ Beziehung nahelegen, sondern die sexuelle euphemistische Bedeutung klar benennen.
