source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: de
  text: 'Tatsächlich hört man von sexueller Unmoral unter euch – und zwar von solcher sexuellen Unmoral, wie sie nicht einmal unter den Nichtjuden[a] vorkommt: Einer hat die Frau seines Vaters[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Völkern“; traditionell auch: „unter den Heiden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Frau seines Vaters zu haben“; euphemistisch ist eine sexuelle Beziehung mit der Frau seines Vaters gemeint, möglicherweise seiner Stiefmutter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: Tatsächlich
  rationale: Das Adverb drückt hier nachdrückliches Erstaunen aus, nicht eine mengenmäßige Bedeutung wie „insgesamt“.
- source_word: ἀκούεται
  choice: hört man
  rationale: Die unpersönlich-passive Aussage bezeichnet, dass etwas als Nachricht bekannt wird; „hört man“ bleibt quellennah und klingt im Deutschen natürlich.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung bezeichnet das Vorkommen innerhalb der korinthischen Gemeinschaft.
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: Der Ausdruck bezeichnet unerlaubtes sexuelles Verhalten allgemein; die Wiedergabe ist modern und vermeidet die engere oder altertümliche Bedeutung von „Unzucht“.
- source_word: καὶ τοιαύτη πορνεία
  choice: und zwar von einer solchen sexuellen Unmoral
  rationale: „Und zwar“ führt idiomatisch die nähere, durch τοιαύτη hervorgehobene Art des Vergehens ein.
- source_word: ἥτις οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: wie sie nicht einmal unter den Völkern vorkommt
  rationale: Die qualitative Relativkonstruktion wird natürlich wiedergegeben. „Vorkommt“ ergänzt das im Griechischen elliptisch ausgelassene Prädikat, ohne den Sinn einzuengen; „Völker“ bewahrt die Grundbedeutung von ἔθνη und lässt den paulinischen Bezug auf Nichtjuden erkennen.
- source_word: ὥστε
  choice: ':'
  rationale: Die Konjunktion führt hier die konkrete Gestalt des gemeldeten Verhaltens ein; im Deutschen erfüllt ein Doppelpunkt diese erläuternde Funktion prägnant.
- source_word: γυναῖκά τινα τοῦ πατρὸς ἔχειν
  choice: Einer hat die Frau seines Vaters
  rationale: „Hat“ bewahrt die knappe euphemistische Ausdrucksweise für eine partnerschaftliche beziehungsweise sexuelle Beziehung. „Die Frau seines Vaters“ vermeidet die nicht ausdrücklich im Text stehende Festlegung auf „Stiefmutter“.
theological_decisions:
- issue: Bedeutung von ἔθνεσιν
  choice: unter den Völkern
  alternative: unter den Nichtjuden; unter den Heiden
  rationale: „Völker“ ist lexikalisch unmittelbar und nicht abwertend. Im paulinischen jüdisch-christlichen Sprachrahmen sind damit die nichtjüdischen Völker gemeint; die Fußnote macht dies deutlich, ohne im Haupttext „Heiden“ mit möglichen abwertenden Nebenklängen zu verwenden.
- issue: Identität der Frau
  choice: die Frau seines Vaters
  alternative: seine Stiefmutter
  rationale: Der griechische Text verwendet keinen besonderen Verwandtschaftsbegriff. Die gewählte Form bewahrt die ausdrückliche Formulierung und lässt offen, ob „Stiefmutter“ in jeder Hinsicht die passende heutige Einordnung ist.
- issue: Bedeutung von ἔχειν in der Beziehungsaussage
  choice: hat
  alternative: lebt mit ihr in einer sexuellen Beziehung; lebt mit ihr zusammen
  rationale: Die knappe, euphemistische Spannung des griechischen Ausdrucks bleibt erhalten. Eine ausführlichere Wiedergabe würde Art und äußere Form der Beziehung stärker festlegen, als es der Satz selbst tut.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und nachdrücklichem Ton. Der Gedankenstrich gibt die steigernde Wirkung von καί τοιαύτη wieder; der Doppelpunkt leitet die konkrete Erläuterung ein. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
