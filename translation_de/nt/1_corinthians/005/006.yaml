source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: de
  text: Euer Rühmen ist nicht gut. Wisst ihr nicht, dass ein wenig Sauerteig den ganzen Teig[a] durchsäuert?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die ganze Teigmasse.'
    reason: Lexikalische Alternative für φύραμα; „Teigmasse“ bildet den Aspekt des Vermengten etwas ausdrücklicher ab.
lexical_decisions:
- source_word: καλὸν
  choice: gut
  rationale: καλός bewertet hier das Rühmen der Korinther; „gut“ gibt die knappe moralisch-praktische Wertung natürlich und direkt wieder.
- source_word: καύχημα
  choice: Rühmen
  rationale: Das Substantiv bezeichnet hier das Rühmen beziehungsweise den Gegenstand des Stolzes. „Rühmen“ bewahrt den vorwurfsvollen Ton, ohne die Bedeutung unnötig auf „Prahlen“ zu verengen.
- source_word: οὐκ οἴδατε
  choice: Wisst ihr nicht
  rationale: Die rhetorische Frage entspricht unmittelbar der griechischen Formulierung und bewahrt den für Paulus typischen Ausdruck.
- source_word: μικρὰ ζύμη
  choice: ein wenig Sauerteig
  rationale: „Ein wenig Sauerteig“ ist im Deutschen verständlich, idiomatisch und erhält das antike Backbild sowie dessen sprichwörtliche Kraft.
- source_word: ὅλον τὸ φύραμα
  choice: den ganzen Teig
  rationale: φύραμα bezeichnet die vermengte Teigmasse; „den ganzen Teig“ ist eine klare, natürliche Wiedergabe und bewahrt die Betonung der Gesamtheit durch ὅλον.
- source_word: ζυμοῖ
  choice: durchsäuert
  rationale: „Durchsäuert“ gibt die Wirkung des Sauerteigs präzise wieder und erhält die sprachliche Verbindung zu „Sauerteig“.
theological_decisions:
- issue: Bild vom Sauerteig
  choice: Das Bild wird ohne erklärende Ausdeutung beibehalten.
  alternative: 'Interpretierend wiedergeben: „Ein wenig Sünde verdirbt die ganze Gemeinde.“'
  rationale: Paulus formuliert ein sprichwörtliches Bild. Der Zusammenhang legt seine Anwendung nahe, doch der Vers selbst benennt weder ausdrücklich die Sünde noch die Gemeinde; diese Spannung soll nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem und knappem Ton. Die rhetorische Frage und das traditionelle, weiterhin verständliche Bild des Sauerteigs bleiben erhalten.
