source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: de
  text: Die Außenstehenden aber richtet Gott.[a][b] Entfernt den Bösen aus eurer Mitte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die, die draußen sind«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb steht im Präsens (»richtet«); vom Zusammenhang her übersetzen manche mit »wird richten«.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Schafft den bösen Mann aus eurer Mitte.« Die Formulierung greift die alttestamentliche Bundesformel zur Beseitigung des Bösen auf (vgl. 5. Mose).'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: die Außenstehenden
  rationale: Das substantivisch gebrauchte Adverb bezeichnet Menschen außerhalb der Gemeinde. »Die Außenstehenden« ist im Deutschen klar und bewahrt den relationalen Bezug, ohne ihn weiter auszudeuten.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel setzt Gottes Richten der Außenstehenden in einen milden Kontrast zur Verantwortung der Gemeinde für die Menschen in ihrer Mitte.
- source_word: κρίνει
  choice: richtet
  rationale: Der griechische Präsensindikativ wird als allgemeingültige Aussage im Präsens wiedergegeben. »Richtet« bewahrt den gerichtlichen Sinn, ohne das Ergebnis des Urteils vorwegzunehmen.
- source_word: ἐξάρατε
  choice: Entfernt
  rationale: Der Aoristimperativ fordert zu entschlossenem Handeln auf. »Entfernt« gibt die Aussonderung aus der Gemeinschaft wieder, ohne ein späteres kirchenrechtliches Verfahren in den Text einzutragen.
- source_word: τὸν πονηρὸν
  choice: den Bösen
  rationale: Der substantivierte maskuline Singular bezeichnet im unmittelbaren Zusammenhang den betreffenden Mann und greift zugleich die deuteronomische Formel zur Beseitigung des Bösen auf.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: aus eurer Mitte
  rationale: Die Wendung bezeichnet die Entfernung aus der eigenen Gemeinschaft. »Aus eurer Mitte« ist natürliches, prägnantes Deutsch und erhält den gemeinschaftlichen Bezug.
theological_decisions:
- issue: Art des Auftrags zur Gemeindezucht
  choice: Die Gemeinde soll den betreffenden Bösen aus ihrer Gemeinschaft entfernen, während Gott die Außenstehenden richtet.
  alternative: Der Auftrag kann allgemeiner als Aufforderung verstanden werden, das Böse aus der Gemeinschaft zu beseitigen, ohne dass eine formelle Ausschließung ausdrücklich benannt wird.
  rationale: Im Zusammenhang von 1. Korinther 5 geht es um einen konkreten Fall innerhalb der Gemeinde. Die Übersetzung bringt die geforderte gemeinschaftliche Abgrenzung zum Ausdruck, vermeidet aber spätere kirchenrechtliche Fachbegriffe.
- issue: Zeitbezug von κρίνει
  choice: Gottes Richten wird entsprechend der griechischen Präsensform als gegenwärtige beziehungsweise allgemeingültige Aussage wiedergegeben.
  alternative: Aus dem eschatologischen Zusammenhang kann die Aussage futurisch verstanden und mit »wird richten« übersetzt werden.
  rationale: Die Form κρίνει ist Präsens. Da der Zusammenhang keinen zwingenden Wechsel ins Futur verlangt, bleibt die grammatische Spannung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Die Außenstehenden« ist allgemeinverständlich; »richtet« wahrt den biblisch-gerichtlichen Klang und die Offenheit von κρίνει. »Den Bösen« erhält den maskulinen Bezug des griechischen Ausdrucks und seinen formelhaften alttestamentlichen Nachhall.
