translation:
  language: de
  text: Denn was geht es mich an, über die Außenstehenden zu urteilen?[a] Urteilt nicht ihr über die, die drinnen sind?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn was habe ich damit zu tun, über die Außenstehenden zu urteilen?“'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die innerhalb der Gemeinde.
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: Denn was geht es mich an
  rationale: Die deutsche Wendung gibt die idiomatische Frage danach wieder, was den Sprecher betrifft oder in seinen Zuständigkeitsbereich fällt. „Denn“ bewahrt den begründenden Anschluss von γάρ.
- source_word: τοὺς ἔξω
  choice: die Außenstehenden
  rationale: Der substantivierte Ausdruck bezeichnet Menschen außerhalb der christlichen Gemeinschaft. „Außenstehende“ ist im Deutschen natürlich und wahrt den sozialen Gegensatz zu denen, die „drinnen“ sind.
- source_word: κρίνειν / κρίνετε
  choice: über … urteilen
  rationale: κρίνω bezeichnet hier im Zusammenhang das Fällen eines Urteils, insbesondere im Rahmen gemeindlicher Verantwortung. „Über … urteilen“ bleibt breit genug und klingt im modernen Deutsch natürlicher als das stärker bibelsprachliche „richten“.
- source_word: οὐχὶ
  choice: Seid nicht …?
  rationale: οὐχί leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. Die deutsche Form erhält diese Erwartung, ohne sie ausdrücklich als Behauptung wiederzugeben.
- source_word: τοὺς ἔσω
  choice: die, die drinnen sind
  rationale: Die räumliche Metapher des griechischen Gegenbegriffs zu „den Außenstehenden“ bleibt erhalten. Eine Fußnote erläutert, dass damit die Zugehörigkeit zur Gemeinde gemeint ist.
- source_word: ὑμεῖς κρίνετε
  choice: Seid nicht ihr es, die über die urteilen
  rationale: Die Formulierung hebt wie das ausdrücklich gesetzte ὑμεῖς das „ihr“ hervor. Zugleich bewahrt sie die rhetorische Aussageform des griechischen Indikativs und legt ihn nicht ausschließlich als Gebot aus.
theological_decisions:
- issue: Bezieht sich der Gegensatz auf gemeindliche Disziplin oder auf jedes moralische Urteil?
  choice: Die Übersetzung wahrt den Gegensatz zwischen Außenstehenden und Menschen innerhalb der Gemeinde und lässt den unmittelbaren Zusammenhang gemeindlicher Verantwortung erkennen.
  alternative: Den Vers als allgemeine Aussage über jedes moralische Urteilen gegenüber Nichtchristen zu formulieren.
  rationale: Der Kontext in 1. Korinther 5,9–13 behandelt den Umgang der Gemeinde mit ihren eigenen Mitgliedern. Die Übersetzung weitet die Aussage nicht über diesen Zusammenhang hinaus aus.
- issue: Ist ὑμεῖς κρίνετε beschreibend oder verpflichtend zu verstehen?
  choice: Die rhetorische Frage wird mit einer deutschen Indikativkonstruktion wiedergegeben.
  alternative: „Sollt nicht ihr … urteilen?“ oder „Ihr habt … zu urteilen.“
  rationale: Der Kontext kann eine Verpflichtung nahelegen, doch die griechische Form ist ein Präsens Indikativ. Die gewählte Fassung bewahrt diese Spannung, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Gegenüberstellung von „Außenstehenden“ und denen, die „drinnen“ sind, bleibt erhalten; die zweite Frage wahrt zudem die Betonung von „ihr“ und die indikativische Form des griechischen Textes.
