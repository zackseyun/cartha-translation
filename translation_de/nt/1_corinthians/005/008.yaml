source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: de
  text: Darum lasst uns das Fest feiern[a], nicht mit altem Sauerteig und auch nicht mit dem Sauerteig der Böswilligkeit und Bosheit, sondern mit dem ungesäuerten Brot[b] der Aufrichtigkeit und Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lasst uns feiern“ beziehungsweise „lasst uns das Fest begehen“. Das Griechische führt das Bild des Passahfestes aus dem vorhergehenden Vers weiter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit den ungesäuerten [Dingen] der Aufrichtigkeit und Wahrheit“. „Brot“ ist aus dem Passahbild ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang und klingt im modernen Deutschen natürlich.
- source_word: ἑορτάζωμεν
  choice: lasst uns das Fest feiern
  rationale: Der hortative Präsenskonjunktiv wird als gemeinsame Aufforderung wiedergegeben. „Das Fest feiern“ bewahrt den Passahbezug aus Vers 7.
- source_word: ζύμῃ παλαιᾷ
  choice: mit altem Sauerteig
  rationale: „Sauerteig“ erhält das konkrete Passahbild; „mit“ gibt ἐν in diesem bildlichen Zusammenhang idiomatisch wieder.
- source_word: κακίας καὶ πονηρίας
  choice: Böswilligkeit und Bosheit
  rationale: 'Die beiden verwandten Begriffe bleiben unterscheidbar: κακία bezeichnet hier besonders eine böse Gesinnung, πονηρία umfassender moralische Bosheit.'
- source_word: ἀζύμοις
  choice: mit dem ungesäuerten Brot
  rationale: Das substantivierte Adjektiv bedeutet wörtlich „mit den ungesäuerten [Dingen]“. „Brot“ wird aus dem Passahkontext ergänzt, damit das Bild im Deutschen klar und natürlich bleibt.
- source_word: εἰλικρινείας
  choice: Aufrichtigkeit
  rationale: Gibt die Vorstellung unverfälschter, lauterer Gesinnung verständlich wieder und bildet den Gegenpol zum durchsäuernden Bösen.
- source_word: ἀληθείας
  choice: Wahrheit
  rationale: Direkte und natürliche Wiedergabe, die sowohl objektive Wahrheit als auch wahrhaftiges Verhalten offenhält.
theological_decisions:
- issue: Passah- und Festbild in der Aufforderung
  choice: „lasst uns das Fest feiern“ und „mit dem ungesäuerten Brot“
  alternative: „lasst uns feiern“ und „mit Aufrichtigkeit und Wahrheit, die ohne Sauerteig sind“
  rationale: Der unmittelbare Zusammenhang nennt Christus das Passahlamm. Die gewählte Fassung erhält deshalb das Fest- und Sauerteigbild, ohne die Aufforderung auf eine bestimmte spätere kirchliche Festpraxis festzulegen.
- issue: Ergänzung von „Brot“ bei ἀζύμοις
  choice: „ungesäuertes Brot“ ausdrücklich nennen
  alternative: substantivisch „das Ungesäuerte“
  rationale: Der griechische Ausdruck lässt das Bezugswort unausgesprochen. Im Passahkontext ist Brot naheliegend; eine Fußnote macht die Ergänzung transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Passahbild bleibt deutlich, während die Fußnoten sowohl die mögliche allgemeinere Wiedergabe des Verbs als auch die Ergänzung von „Brot“ offenlegen.
