  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: de
  text: Und ihr seid aufgeblasen! Hättet ihr nicht vielmehr trauern sollen, damit derjenige, der diese Tat begangen hat, aus eurer Mitte entfernt würde[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus eurer Mitte weggenommen würde“. Im Zusammenhang ist wahrscheinlich die Entfernung aus der Gemeinde durch eine Maßnahme der Gemeinde gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: aufgeblasen
  rationale: Die bildhafte Rede vom Aufgeblasensein bleibt erhalten und gibt den durch die Perfektform bezeichneten anhaltenden Zustand des Hochmuts wieder. Zugleich greift sie den wiederholten paulinischen Sprachgebrauch in diesem Brief auf.
- source_word: οὐχὶ μᾶλλον ἐπενθήσατε
  choice: Hättet ihr nicht vielmehr trauern sollen
  rationale: Die Formulierung bewahrt den vorwurfsvollen Charakter der rhetorischen Frage. „Trauern“ gibt die starke Sprache des Klagens wieder und bezeichnet mehr als bloßes Bedauern.
- source_word: ἵνα ἀρθῇ
  choice: damit … entfernt würde
  rationale: „Damit“ gibt Ziel oder beabsichtigte Folge wieder; „entfernt würde“ wahrt das Passiv und passt zum Zusammenhang, ohne ausdrücklich festzulegen, wer die Entfernung vollzieht.
- source_word: ἐκ μέσου ὑμῶν
  choice: aus eurer Mitte
  rationale: Die gebräuchliche deutsche Wendung bewahrt den gemeinschaftlichen Bezug und bleibt näher am griechischen Bild als eine ausdrückliche Deutung als Gemeindeausschluss.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: der, der diese Tat begangen hat
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet den Täter; „diese Tat begangen“ ist natürliches, würdevolles Deutsch und bewahrt den ernsten Ton von ἔργον.
theological_decisions:
- issue: Art der geforderten Entfernung des Täters
  choice: aus eurer Mitte entfernt würde
  alternative: 'aus eurer Mitte weggenommen würde; ausdrücklich: aus der Gemeinde ausgeschlossen würde; als göttliches Gericht weggenommen würde'
  rationale: Der unmittelbare Zusammenhang in 1 Korinther 5 spricht für eine Entfernung aus der Gemeinschaft. Die passive, nicht näher bestimmte Formulierung des Griechischen wird jedoch beibehalten, sodass weder ein förmlicher Gemeindeausschluss noch ein unmittelbares göttliches Eingreifen ausdrücklich in den Text hineingelesen wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Ausruf nach dem ersten Satz macht den scharfen Gegensatz zwischen dem selbstgefälligen Zustand der Gemeinde und der gebotenen Trauer deutlich. Die Bildsprache „aufgeblasen“ und die Unbestimmtheit des Passivs bleiben erhalten.
