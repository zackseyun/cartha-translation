  naturalness: Die Konstruktion „Ich schrieb euch …, keinen Umgang … zu haben“ ist verständlich, aber im heutigen Standarddeutsch syntaktisch weniger glatt und kann kurzzeitig wie eine Aussage über Paulus selbst wirken. Ein dass-Satz mit „haben sollt“ ist natürlich und präzise. Die Fußnotenmarker werden unmittelbar bei den jeweiligen Bezugsausdrücken verankert.
  terminology: „Menschen, die sexuell unmoralisch leben“ ist verständlich, modern und wahrt die personenbezogene, charakterisierende Bedeutung von πόρνοις. Die Fußnote bietet die knapper am griechischen Ausdruck liegende Alternative „sexuell Unmoralischen“, ohne das veraltete und potenziell enger verstandene „Unzüchtige“ zur Hauptübersetzung zu machen.
