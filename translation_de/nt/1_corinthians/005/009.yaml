lexical_decisions:
- source_word: Ἔγραψα
  choice: Ich schrieb
  rationale: Der Aorist wird zunächst als einfache Vergangenheitsform wiedergegeben. So bleibt offen, ob Paulus auf einen früheren Brief oder auf eine frühere Stelle des gegenwärtigen Schreibens verweist.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger des Schreibens.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: in dem Brief
  rationale: Die bestimmte Form wird bewahrt, ohne festzulegen, um welchen Paulusbrief es sich handelt. „Brief“ ist im heutigen Deutsch natürlicher als „Epistel“.
- source_word: μὴ συναναμίγνυσθαι
  choice: keinen Umgang mit … zu haben
  rationale: Die Wendung gibt das soziale Sichverbinden oder Verkehren idiomatisch wieder, ohne bereits zu bestimmen, wie weit das Verbot reicht.
- source_word: πόρνοις
  choice: Menschen …, die sexuell unmoralisch leben
  rationale: Das Substantiv bezeichnet Personen, die durch sexuelle Unmoral gekennzeichnet sind. Die Formulierung ist verständlich, personbezogen und weiter als das heute oft zu eng verstandene „Unzüchtige“.
theological_decisions:
- issue: Bezug von „dem Brief“
  choice: Die Übersetzung bezeichnet einen bestimmten, den Korinthern bekannten Brief, legt aber dessen Identität nicht fest.
  alternative: Gemeint ist entweder ein früherer, heute nicht erhaltener Brief oder eine frühere Stelle im ersten Korintherbrief.
  rationale: ἐν τῇ ἐπιστολῇ ist bestimmt formuliert, entscheidet die historische Frage aber nicht. Die echte Mehrdeutigkeit bleibt erhalten.
- issue: Reichweite des Umgangsverbots
  choice: „keinen Umgang … haben“ gibt die Anweisung allgemein wieder.
  alternative: „sich nicht vermischen mit“ oder „keine Gemeinschaft haben mit“
  rationale: Der Vers selbst erklärt noch nicht, welche Formen sozialen Kontakts gemeint sind; der folgende Kontext präzisiert die Aussage. Die Übersetzung soll hier nicht mehr festlegen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ich schrieb“ bewahrt den schlichten Vergangenheitsbezug; „in dem Brief“ erhält die historische Mehrdeutigkeit. Die drei Fußnotenmarker stehen an der inhaltlich passenden Stelle am Versende.
