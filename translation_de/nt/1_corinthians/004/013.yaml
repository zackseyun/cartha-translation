source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: de
  text: Werden wir verleumdet[a], reden wir ihnen gut zu; wir sind wie der Unrat der Welt geworden, der Abschaum von allem[b] – bis jetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Werden wir beschimpft“. Das griechische Wort bezeichnet üble oder rufschädigende Rede gegen jemanden.'
    reason: lexical_alternative
  - marker: b
    text: Die beiden seltenen und sehr starken Ausdrücke bezeichnen etwas, das beim Reinigen entfernt, abgewischt oder abgeschabt wird. Sie stellen die Apostel als völlig verachtet und wertlos behandelt dar; mögliche kultische Nebenklänge sind umstritten.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Werden wir verleumdet
  rationale: Das passive Partizip bezeichnet hier, dass über die Apostel gehässig und rufschädigend gesprochen wird. Die konditional-temporale Wiedergabe fügt sich natürlich in die Kontrastreihe des Zusammenhangs ein.
- source_word: παρακαλοῦμεν
  choice: reden wir ihnen gut zu
  rationale: παρακαλέω bezeichnet hier als Reaktion auf Verleumdung ein eindringliches, versöhnliches Zureden. Die Formulierung vermeidet den im Griechischen nicht ausdrücklich vorhandenen Zusatz „sanft“ und lässt offen, ob Ermahnen, Bitten oder Beschwichtigen im Vordergrund steht.
- source_word: ὡς
  choice: wie
  rationale: Kennzeichnet den folgenden Ausdruck als Vergleich, ohne die starke Aussage über die gesellschaftliche Erniedrigung abzuschwächen.
- source_word: περικαθάρματα
  choice: Unrat
  rationale: Das seltene Wort bezeichnet etwas, das beim Reinigen entfernt und als wertlos weggeworfen wird. „Unrat“ ist verständlich, kräftig und bewahrt das Bild des bei einer Säuberung Beseitigten.
- source_word: τοῦ κόσμου
  choice: der Welt
  rationale: Gibt den Genitiv knapp und idiomatisch wieder.
- source_word: ἐγενήθημεν
  choice: sind ... geworden
  rationale: Das deutsche Perfekt bringt den eingetretenen und bis zur Gegenwart fortbestehenden Zustand passend zum abschließenden ἕως ἄρτι zum Ausdruck.
- source_word: πάντων
  choice: von allem
  rationale: Bewahrt die umfassende und grammatisch nicht eindeutig auf Personen eingeengte Aussage.
- source_word: περίψημα
  choice: Abschaum
  rationale: Das seltene Wort bezeichnet Abgewischtes oder Abgeschabtes und damit verachteten Rückstand. „Abschaum“ erhält die drastische soziale Abwertung.
- source_word: ἕως ἄρτι
  choice: bis heute
  rationale: Gibt die Fortdauer bis zum Zeitpunkt des Schreibens natürlich und prägnant wieder.
theological_decisions:
- issue: Bedeutung des Wortpaars περικαθάρματα / περίψημα
  choice: Als drastische Bilder gesellschaftlicher Verachtung mit „Unrat“ und „Abschaum“ wiedergeben
  alternative: Die Wörter als technische Bezeichnungen für sühnende Opfer oder Sündenböcke deuten
  rationale: Im unmittelbaren Zusammenhang schildert Paulus die Erniedrigung und Verachtung der Apostel. Mögliche kultische oder reinigungsbezogene Nebenklänge sind unsicher und dürfen nicht als bestimmte Aussage über ein Sühneopfer in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur bewahrt die zugespitzte Rhetorik. „Unrat“ und „Abschaum“ sind bewusst drastisch, aber allgemein verständlich; der Gedankenstrich hebt die bis in die Gegenwart reichende Erniedrigung hervor.
