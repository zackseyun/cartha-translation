  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: de
  text: Aber ich werde bald zu euch kommen, wenn der Herr will, und ich werde herausfinden, nicht was die Aufgeblasenen sagen, sondern welche Kraft sie haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Doch ich werde bald zu euch kommen
  rationale: Das Futur wird als schlichte Zukunft wiedergegeben; δέ setzt einen milden Gegensatz, und ταχέως bezeichnet hier am natürlichsten den nahen Zeitpunkt.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: wenn der Herr will
  rationale: Die geläufige deutsche Formulierung wahrt die Bedingung und die Abhängigkeit vom Willen des Herrn, ohne dessen Referenz näher festzulegen.
- source_word: γνώσομαι
  choice: werde ich … kennenlernen
  rationale: Im Kontext meint das Verb, dass Paulus bei seinem Besuch Art und Wirklichkeit der betreffenden Personen aus eigener Anschauung feststellen wird.
- source_word: τὸν λόγον
  choice: die Worte
  rationale: λόγος bezeichnet hier das Reden beziehungsweise die Äußerungen und steht pointiert der Kraft gegenüber; „Worte“ bleibt nah am griechischen Ausdruck und klingt im Deutschen natürlich.
- source_word: τῶν πεφυσιωμένων
  choice: der Aufgeblasenen
  rationale: Die substantivierte Form bewahrt das wiederkehrende paulinische Bild für Menschen, die von Hochmut erfüllt sind, in knapper und verständlicher Sprache.
- source_word: τὴν δύναμιν
  choice: ihre Kraft
  rationale: „Kraft“ erhält den offenen Sinn von δύναμις. Das Possessivpronomen macht die im Griechischen durch die Parallelkonstruktion nahegelegte Zuordnung im Deutschen verständlich.
theological_decisions:
- issue: Referenz von ὁ κύριος
  choice: der Herr
  alternative: der Herr Jesus; Gott
  rationale: Der griechische Text bestimmt die Referenz nicht ausdrücklich näher. Die Übersetzung bewahrt daher die christologisch und theologisch offene Titulatur.
- issue: Gegensatz zwischen λόγος und δύναμις
  choice: Worte gegenüber Kraft
  alternative: Rhetorik gegenüber apostolischer Vollmacht; Lehrinhalt gegenüber Wunderkraft
  rationale: Der knappe Gegensatz bleibt bewusst weit und wird nicht auf eine bestimmte Art von Kraft oder Autorität eingeengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufgeblasene“ bewahrt das anschauliche Bild des griechischen Partizips; der Satzbau folgt weitgehend der pointierten Struktur des Originals.
