review_pass:
  verdict: revise
  source_fidelity: 'Der Grundsinn wird überwiegend getroffen: Paulus kündigt einen baldigen, vom Willen des Herrn abhängigen Besuch an und stellt das Reden der „Aufgeblasenen“ ihrer Kraft gegenüber. „kennenlernen“ ist für γνώσομαι in dieser Konstruktion jedoch nicht passend; Paulus will bei seinem Besuch etwas ermitteln bzw. feststellen, nicht Worte oder Kraft „kennenlernen“.'
  naturalness: Der Satz ist insgesamt verständlich, aber „die Worte … kennenlernen“ klingt im modernen Standarddeutsch semantisch unnatürlich. „herausfinden, nicht was … sagen, sondern welche Kraft sie haben“ gibt den investigativen Zukunftssinn idiomatisch wieder.
  terminology: „der Herr“ bewahrt die offene Referenz von ὁ κύριος. „Aufgeblasene“ erhält das paulinische Bild von πεφυσιωμένοι. Die Umschreibung von λόγος als „was … sagen“ und von δύναμις als „welche Kraft sie haben“ macht die im Griechischen durch den Genitiv und den Kontext nahegelegte Zuordnung verständlich, ohne die Art dieser Kraft dogmatisch einzuengen.
  issues:
  - severity: medium
    issue: „kennenlernen“ für γνώσομαι
    rationale: Das Verb bezeichnet hier das Erkennen bzw. Feststellen dessen, was sich bei einem Besuch erweisen wird. Im Deutschen bedeutet „Worte/Kraft kennenlernen“ gewöhnlich, mit ihnen vertraut zu werden, und verfehlt daher die Aussagefunktion des griechischen Verbs.
  - severity: low
    issue: Possessivpronomen „ihre“ samt erläuternder Fußnote
    rationale: Die Zuordnung der Kraft zu den betreffenden Personen ist kontextuell naheliegend, aber nicht ausdrücklich durch ein Possessivpronomen im Griechischen markiert. Eine natürliche Umschreibung kann sie ohne eine als „wörtlich“ bezeichnete Fußnote wiedergeben.
  revised_text: Aber ich werde bald zu euch kommen, wenn der Herr will, und ich werde herausfinden, nicht was die Aufgeblasenen sagen, sondern welche Kraft sie haben.
  revised_footnotes: []
  revision_rationale: Die Revision ersetzt die semantisch unpassende Verbindung „Worte … kennenlernen“ durch eine natürliche deutsche Wiedergabe des kontextuellen Sinns von γνώσομαι. Sie bewahrt den Kontrast zwischen λόγος und δύναμις, die offene Referenz von „der Herr“ und das metaphorische „Aufgeblasene“. Die entfallene Fußnote war nur zur Rechtfertigung einer im Haupttext ergänzten Zuordnung erforderlich; die revidierte Formulierung macht diese Zuordnung idiomatisch und kontextgerecht deutlich.
