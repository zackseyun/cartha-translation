revisions:
- from: Doch ich werde bald zu euch kommen, wenn der Herr will, und dann werde ich nicht die Worte der Aufgeblasenen kennenlernen, sondern ihre Kraft.[a]
  to: Aber ich werde bald zu euch kommen, wenn der Herr will, und ich werde herausfinden, nicht was die Aufgeblasenen sagen, sondern welche Kraft sie haben.
  rationale: Die Revision ersetzt die semantisch unpassende Verbindung „Worte … kennenlernen“ durch eine natürliche deutsche Wiedergabe des kontextuellen Sinns von γνώσομαι. Sie bewahrt den Kontrast zwischen λόγος und δύναμις, die offene Referenz von „der Herr“ und das metaphorische „Aufgeblasene“. Die entfallene Fußnote war nur zur Rechtfertigung einer im Haupttext ergänzten Zuordnung erforderlich; die revidierte Formulierung macht diese Zuordnung idiomatisch und kontextgerecht deutlich.
