lexical_decisions:
- source_word: παρακαλῶ
  choice: ermahne ich
  rationale: Das Verb hat hier im paulinischen Zusammenhang die Kraft einer eindringlichen Aufforderung. „Ermahnen“ ist im modernen Deutschen klar, würdig und stärker als ein bloßes „bitten“.
- source_word: οὖν
  choice: Darum
  rationale: Die Konjunktion zieht eine Folgerung aus dem vorhergehenden Gedankengang. „Darum“ stellt diesen Zusammenhang natürlich und deutlich her.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Akkusativpronomen bezeichnet die angesprochene Gemeinde im Plural und wird direkt mit „euch“ wiedergegeben.
- source_word: μιμηταί
  choice: Nachahmer
  rationale: Das Substantiv bezeichnet Menschen, die sich an einer Person als Vorbild orientieren und sie nachahmen. „Nachahmer“ bewahrt den direkten Bezug auf Paulus besser als das allgemeinere „Anhänger“.
- source_word: μου
  choice: meine
  rationale: Der Genitiv bezeichnet Paulus als denjenigen, der nachgeahmt werden soll. Im Deutschen ist „meine Nachahmer“ die natürliche substantivische Formulierung.
- source_word: γίνεσθε
  choice: Werdet
  rationale: Der präsentische Imperativ von γίνομαι fordert dazu auf, in einen Zustand oder eine Haltung einzutreten. „Werdet“ gibt diesen Aspekt genauer wieder als bloßes „Seid“.
theological_decisions:
- issue: Paulus fordert ausdrücklich dazu auf, ihn selbst nachzuahmen; isoliert gelesen kann dies stärker wirken als seine spätere christusbezogene Präzisierung in 1. Korinther 11,1.
  choice: Die Aufforderung wird direkt als „Werdet meine Nachahmer“ übersetzt.
  alternative: „Folgt meinem Beispiel.“
  rationale: Der griechische Wortlaut nennt Paulus eindeutig als unmittelbares Vorbild. Die direkte Wiedergabe bewahrt diese theologische Spannung; der weitere christusbezogene Zusammenhang wird nicht in den Haupttext hineingetragen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, unmittelbar verständlichem Ton. Der Doppelpunkt bildet die eindringliche Aufforderung natürlich ab. „Nachahmer“ ist bewusst lexikalisch transparent und bewahrt die zugespitzte Aussage des Ausgangstextes.
