  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: de
  text: Was wollt ihr? Soll ich mit der Rute[a] zu euch kommen oder mit Liebe und einem sanften Geist[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Stock“ oder „mit dem Stab“. Gemeint ist bildlich strenge Zurechtweisung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Liebe und einem Geist der Sanftmut“. Der Ausdruck kann die sanfte Haltung des Paulus bezeichnen; manche verstehen „Geist“ hier als indirekten Hinweis auf das Wirken des Heiligen Geistes.'
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Was wollt ihr?
  rationale: Die direkte rhetorische Frage entspricht dem Griechischen und klingt in modernem Deutsch natürlich und eindringlich.
- source_word: ἐν ῥάβδῳ
  choice: mit dem Stock
  rationale: ῥάβδος bezeichnet wörtlich einen Stock oder Stab. „Stock“ bewahrt das scharfe Bild von Zurechtweisung, ohne es durch „Strafe“ oder „Disziplin“ auszudeuten.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Soll ich … zu euch kommen
  rationale: Die deliberative Frage mit dem Aorist Konjunktiv wird im Deutschen idiomatisch durch „Soll ich … kommen?“ wiedergegeben.
- source_word: ἢ
  choice: oder
  rationale: Gibt den einfachen Gegensatz zwischen den beiden Arten des Kommens wieder.
- source_word: ἐν ἀγάπῃ
  choice: mit Liebe
  rationale: Das instrumentale „mit“ stellt die Parallelität zu „mit dem Stock“ her; ἀγάπη wird schlicht mit „Liebe“ wiedergegeben.
- source_word: πνεύματί τε πραΰτητος
  choice: und einem Geist der Sanftmut
  rationale: Die Formulierung bewahrt sowohl πνεῦμα als auch die Genitivverbindung mit πραΰτης und lässt offen, ob vor allem die innere Haltung des Paulus oder eine vom Heiligen Geist gewirkte Sanftmut gemeint ist.
theological_decisions:
- issue: Bedeutung von πνεύματι in πνεύματί τε πραΰτητος
  choice: „einem Geist der Sanftmut“, primär als Haltung oder Gesinnung des Paulus verstanden
  alternative: „dem Geist der Sanftmut“ als ausdrücklicher Hinweis auf den Heiligen Geist oder „mit Liebe und Sanftmut“ als stärker idiomatische Wiedergabe
  rationale: 'Der unmittelbare Zusammenhang stellt zwei Weisen des Kommens gegenüber: strenge Zurechtweisung oder liebevolle Sanftmut. Der artikellose Ausdruck bezeichnet wahrscheinlich die Haltung des Paulus; die Übersetzung vermeidet jedoch eine Festlegung, die eine Wirkung des Heiligen Geistes ausschließen würde.'
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe rhetorische Schärfe des Verses und das konkrete Bild des griechischen ῥάβδος bleiben erhalten; die Mehrdeutigkeit von πνεῦμα wird nicht dogmatisch aufgelöst.
