reference: 1 Corinthians 4:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: de
  text: Darum urteilt über nichts vor der Zeit[a], bis der Herr kommt. Er wird auch das im Dunkeln Verborgene ans Licht bringen und die Absichten der Herzen[b] offenbar machen.[c] Dann wird jeder sein Lob von Gott erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem rechten Zeitpunkt“ oder „voreilig“. Die griechische Wendung bezeichnet ein Urteilen vor der dafür angemessenen Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Vorhaben der Herzen“ beziehungsweise „die Beweggründe der Herzen“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist die endgültige Beurteilung durch den Herrn bei seinem Kommen, wenn er das Verborgene aufdeckt.
    reason: contextual_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang und klingt im modernen Deutschen natürlich.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: urteilt über nichts vor der Zeit
  rationale: Gibt die umfassende Verneinung und den zeitlichen Vorbehalt eng wieder, ohne durch „festgesetzte Zeit“ mehr Bestimmung einzutragen, als καιρός ausdrücklich enthält.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: bis der Herr kommt
  rationale: Bewahrt die zeitliche Grenze des Verbots und den titularen Gebrauch von κύριος im eschatologischen Zusammenhang.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: wird auch das im Dunkeln Verborgene ans Licht bringen
  rationale: Die deutsche Wendung „ans Licht bringen“ gibt die metaphorische Enthüllung natürlich wieder; „im Dunkeln verborgen“ bewahrt beide Bildelemente, ohne das missverständliche „Verborgenes der Finsternis“ zu erzwingen.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: die Absichten der Herzen offenbar machen
  rationale: „Absichten“ wahrt die mögliche Bedeutung von βουλαί als innere Vorhaben oder Intentionen. Der Plural „Herzen“ folgt dem Griechischen und bezeichnet das innere Wollen der einzelnen Menschen.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: Dann wird jeder sein Lob von Gott erhalten
  rationale: Natürliches Deutsch für die Aussage, dass jedem Einzelnen das ihm zukommende Lob von Gott zuteilwird; die Herkunftsangabe ἀπὸ τοῦ θεοῦ bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Umfang und Zeitpunkt des Urteilens
  choice: Verboten ist das vorzeitige menschliche Urteil angesichts der künftigen Offenlegung durch den Herrn.
  alternative: Ein ausnahmsloses Verbot jeder Form von Beurteilung oder Unterscheidung.
  rationale: Der Satz formuliert das Verbot weit, begrenzt es aber ausdrücklich zeitlich mit „bis der Herr kommt“. Die Übersetzung bewahrt diese Spannung, ohne andere neutestamentliche Aussagen über Urteilsvermögen in den Vers hineinzulesen.
- issue: Identität des Herrn
  choice: Der Titel „der Herr“ bleibt unergänzt stehen und bezeichnet im paulinischen, eschatologischen Zusammenhang am natürlichsten Jesus.
  alternative: Eine allgemeine Bezeichnung Gottes ohne spezifischen Bezug auf Jesus.
  rationale: Die Übersetzung erhält den griechischen Titel ὁ κύριος unverändert in seiner christologischen Aussagekraft, ohne den Namen erklärend in den Haupttext einzufügen.
- issue: Das Lob für jeden
  choice: Der Text sagt, dass jeder das ihm zukommende Lob von Gott erhalten wird.
  alternative: Der Vers garantiere unabhängig von Gottes Offenlegung uneingeschränktes Lob für jede Handlung jedes Menschen.
  rationale: ἑκάστῳ ist distributiv, während der bestimmte Ausdruck ὁ ἔπαινος im Zusammenhang mit Gottes wahrer Beurteilung steht. Die Übersetzung lässt die positive und zugleich gerichtliche Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Der Haupttext ist gut vorlesbar und wahrt die Bildsprache sowie die eschatologische Spannung des griechischen Textes. Die Satzteilung nach „kommt“ vermeidet einen schwerfälligen deutschen Relativsatz, ohne die logische Verbindung zu lösen.
