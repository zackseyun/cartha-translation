  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: de
  text: Ich schreibe euch dies nicht, um euch zu beschämen, sondern um euch als meine geliebten Kinder zu ermahnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… als meine geliebten Kinder zurechtzuweisen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: um euch zu beschämen
  rationale: Die mit οὐκ verneinte Partizipialform bezeichnet hier am natürlichsten die verneinte Absicht des Schreibens. „Beschämen“ bewahrt den Bezug auf Schande und Ehre.
- source_word: γράφω ταῦτα
  choice: Ich schreibe dies
  rationale: Das Präsens wird als gegenwärtiges briefliches Schreiben wiedergegeben. Das deutsche Sammelpronomen „dies“ verweist natürlich auf die zuvor geschriebenen Ausführungen.
- source_word: ἀλλ’
  choice: sondern
  rationale: Nach der verneinten Aussage kennzeichnet „sondern“ im Deutschen den deutlichen Gegensatz besonders idiomatisch.
- source_word: ὡς
  choice: als
  rationale: „Als“ bewahrt die relationale Einordnung, in der Paulus seine Zurechtweisung ausspricht.
- source_word: τέκνα μου ἀγαπητὰ
  choice: meine geliebten Kinder
  rationale: „Kinder“ ist geschlechtsübergreifend und erhält das Bild der familiären Beziehung; „geliebt“ gibt die Wärme von ἀγαπητά würdig und verständlich wieder.
- source_word: νουθετῶν
  choice: um euch ... zurechtzuweisen
  rationale: „Zurechtweisen“ umfasst korrigierende Unterweisung und Warnung, ohne unnötig hart zu klingen. Die deutsche Infinitivkonstruktion stellt den positiven Zweck parallel zum verneinten Zweck dar.
theological_decisions:
- issue: Der pastorale Charakter der Korrektur
  choice: „um euch als meine geliebten Kinder zurechtzuweisen“
  alternative: „indem ich euch als meine geliebten Kinder ermahne“
  rationale: Die Fassung erhält sowohl die korrigierende Kraft als auch die liebevolle, elterliche Beziehung. Sie deutet die geistliche Vaterschaft nicht über den im Vers gegebenen Wortlaut hinaus aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist für ein breites Publikum verständlich; „zurechtweisen“ wahrt den korrigierenden Gehalt, während „geliebte Kinder“ den warmen pastoralen Ton erhält.
