  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: de
  text: Für mich aber ist es von sehr geringer Bedeutung, dass ich von euch oder von einem menschlichen Gericht[a] beurteilt werde; doch ich beurteile nicht einmal mich selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von einem menschlichen Tag«. Die Wendung bezeichnet wahrscheinlich menschliche Beurteilung; sie kann auch an eine menschliche Gerichtsinstanz denken lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν
  choice: Für mich ist es jedoch von sehr geringer Bedeutung
  rationale: Die Wendung bezeichnet etwas als äußerst unbedeutend; die deutsche Formulierung bewahrt Paulus’ persönliche Perspektive und klingt zugleich natürlich und würdig.
- source_word: ἵνα
  choice: ob
  rationale: Nach einer Aussage über die geringe Bedeutung gibt „ob“ im Deutschen den Inhalt idiomatisch wieder, ohne dem griechischen ἵνα hier eine strenge Zweckbedeutung aufzuzwingen.
- source_word: ἀνακριθῶ / ἀνακρίνω
  choice: beurteilt werde / beurteile
  rationale: ἀνακρίνω bezeichnet hier prüfendes Untersuchen oder Beurteilen, nicht notwendig ein endgültiges Verurteilen. Die gemeinsame Wortwurzel wird im Deutschen durch „beurteilen“ in beiden Satzteilen gewahrt.
- source_word: ὑφ’ ὑμῶν
  choice: von euch
  rationale: Gibt die mit ὑπό bezeichnete handelnde Instanz unmittelbar wieder; ein distributives „von einem von euch“ steht nicht im Text.
- source_word: ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: von einem menschlichen Gericht
  rationale: Wörtlich steht „von einem menschlichen Tag“. Im Kontext bezeichnet die ungewöhnliche Wendung eine menschliche Instanz beziehungsweise menschliche Beurteilung im Gegensatz zum Gericht des Herrn.
- source_word: ἀλλ’ οὐδὲ ἐμαυτὸν
  choice: ja, ich … nicht einmal selbst
  rationale: „Ja“ bringt die steigernde Weiterführung natürlich zum Ausdruck; „nicht einmal“ bewahrt die Kraft von οὐδέ und ἐμαυτόν wird reflexiv wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀνθρωπίνης ἡμέρας
  choice: menschliches Gericht
  alternative: menschlicher Tag; menschliche Beurteilung
  rationale: Die idiomatische Wiedergabe vermittelt den sachlichen Kontrast zwischen menschlicher Prüfung und dem Gericht des Herrn im Kontext. Die Fußnote bewahrt zugleich die auffällige wörtliche Form und die darin liegende Anspielung auf den Tag des Herrn.
- issue: Reichweite von ἀνακρίνω
  choice: beurteilen
  alternative: prüfen; untersuchen; richten
  rationale: „Beurteilen“ hält die Spannung zwischen prüfender Bewertung und gerichtlichem Kontext offen, ohne das Wort vorschnell als endgültiges göttliches Richten zu deuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang; die ungewöhnliche Wendung „menschlicher Tag“ wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
