  to: Schon seid ihr satt; schon seid ihr reich geworden; ohne uns seid ihr zur Herrschaft gelangt. Wenn ihr doch wirklich zur Herrschaft gelangt wäret, damit auch wir mit euch herrschen könnten![a]
  rationale: Die Wiederholung von »Könige geworden« wird durch »zur Herrschaft gelangt« ersetzt, damit das griechische Verb βασιλεύω als Herrschaftsausübung beziehungsweise erreichte Herrschaft wiedergegeben wird, ohne die nicht ausdrücklich enthaltene Nuance eines bloßen Eintritts in einen königlichen Stand einzutragen. Die alternative Fußnote ist nach der Anpassung nicht mehr erforderlich; die Ironie-Anmerkung bleibt an einem eindeutigen, strukturell korrekten Anker erhalten.
