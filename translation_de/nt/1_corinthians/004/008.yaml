  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: de
  text: Schon seid ihr satt; schon seid ihr reich geworden; ohne uns seid ihr zur Herrschaft gelangt. Wenn ihr doch wirklich zur Herrschaft gelangt wäret, damit auch wir mit euch herrschen könnten![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Paulus spricht ironisch: Die Korinther verhalten sich, als seien sie bereits satt, reich und zur Herrschaft gelangt.'
    reason: Der unmittelbare Zusammenhang macht den rhetorischen Gegensatz zwischen dem Selbstbild der Korinther und dem leidvollen Dienst der Apostel deutlich.
lexical_decisions:
- source_word: ἤδη
  choice: schon
  rationale: Die Wiederholung bewahrt die zugespitzte zeitliche Betonung und den ironischen Ton.
- source_word: κεκορεσμένοι ἐστέ
  choice: seid ihr satt
  rationale: Die periphrastische Perfektform bezeichnet einen erreichten, gegenwärtigen Zustand der Sättigung; die knappe deutsche Wendung erhält die Ironie.
- source_word: ἐπλουτήσατε
  choice: seid ihr reich geworden
  rationale: Bewahrt den verbalen Gedanken des Reichwerdens statt ihn zum bloßen Zustand „ihr seid reich“ abzuflachen.
- source_word: χωρὶς ἡμῶν
  choice: ohne uns
  rationale: Gibt die Trennung beziehungsweise Unabhängigkeit von den Aposteln natürlich und unmittelbar wieder.
- source_word: ἐβασιλεύσατε
  choice: seid ihr Könige geworden
  rationale: Erhält das königliche Bild und folgt dem punktuellen verbalen Ausdruck, ohne die nicht ausdrücklich vorhandene Bedeutung „angefangen“ einzutragen.
- source_word: ὄφελόν γε
  choice: Ja, wärt ihr doch wirklich
  rationale: Die deutsche Wunschform mit „doch“ gibt den unerfüllten Wunsch wieder; „ja“ und „wirklich“ vermitteln die verstärkende Kraft von γε und den Übergang von Ironie zu echtem Verlangen.
- source_word: συμβασιλεύσωμεν
  choice: damit auch wir mit euch herrschen könnten
  rationale: „Mit euch herrschen“ bewahrt die durch συν- ausgedrückte gemeinsame Königsherrschaft; der Konjunktiv entspricht dem vom unerfüllten Wunsch abhängigen Zweck beziehungsweise Ergebnis.
theological_decisions:
- issue: Ironischer Ton der ersten drei Aussagen
  choice: Als zugespitzte ironische Behauptungen formuliert
  alternative: Als nüchterne oder lobende Feststellungen verstanden
  rationale: Der Zusammenhang in 1 Kor 4,7–13 stellt die vermeintliche Vollendung der Korinther dem Leiden der Apostel gegenüber. Die Übersetzung lässt die Ironie im Haupttext wirken, ohne sie durch erklärende Zusätze festzulegen.
- issue: Bedeutung des Königseins und Mitherrschens
  choice: Das ausdrückliche königliche Herrschaftsbild bleibt erhalten
  alternative: Allgemeiner mit Erfolg, Macht oder hohem Ansehen wiedergeben
  rationale: βασιλεύω und συμβασιλεύω tragen ein klares königliches, möglicherweise endzeitliches Bild. Eine allgemeinere Wiedergabe würde die theologische und rhetorische Spannung abschwächen.
- issue: Verhältnis von Ironie und ernstem Wunsch in ὄφελόν γε
  choice: Der Wunsch wird als ernstes Verlangen innerhalb der ironischen Zurechtweisung wiedergegeben
  alternative: Die gesamte Aussage ausschließlich als Sarkasmus auffassen
  rationale: Die Formulierung kann die Ironie fortführen und zugleich den echten Wunsch ausdrücken, die verheißene Herrschaft möge tatsächlich eingetreten sein. Die Übersetzung lässt beide Aspekte nebeneinander stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper rhetorischer Parallelität. Die wiederholte Spitzenstellung von „Schon“ und das königliche Bild bleiben erhalten. Die Ausrufeform im zweiten Satz trägt sowohl den Wunsch als auch die ironische Spannung.
