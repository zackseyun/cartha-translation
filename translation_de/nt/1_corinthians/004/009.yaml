id: 1CO.4.9
reference: 1 Corinthians 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: de
  text: Denn ich meine, Gott hat uns, die Apostel, als die Letzten öffentlich vorgeführt, wie zum Tod Verurteilte[a]. Denn wir sind der Welt zum Schauspiel geworden[b], sowohl Engeln als auch Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Menschen, die dem Tod geweiht sind“. Das griechische Wort bezeichnet Personen, denen der Tod bestimmt ist, wahrscheinlich mit dem Bild einer öffentlichen Arena.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zum Theater“. Gemeint ist ein öffentliches Schauspiel, das von anderen betrachtet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Denn ich meine
  rationale: Gibt die persönliche Einschätzung des Paulus natürlich wieder und bewahrt mit „denn“ den begründenden Anschluss an den Kontext.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: uns, die Apostel
  rationale: 'Bewahrt die appositionelle Bestimmung: Paulus bezeichnet die gemeinte Gruppe ausdrücklich als die Apostel.'
- source_word: ἐσχάτους
  choice: als die Letzten
  rationale: Erhält die zugespitzte Vorstellung des letzten und niedrigsten Platzes; im Zusammenhang kann zugleich die Reihenfolge einer öffentlichen Vorführung anklingen.
- source_word: ἀπέδειξεν
  choice: öffentlich vorgeführt
  rationale: Drückt die öffentliche Zurschaustellung aus und passt zur folgenden Bildsprache eines Schauspiels.
- source_word: ὡς ἐπιθανατίους
  choice: wie zum Tod Verurteilte
  rationale: Bezeichnet Menschen, denen der Tod bestimmt ist, und lässt die wahrscheinliche Arena- beziehungsweise Hinrichtungsbildlichkeit erkennen.
- source_word: θέατρον ἐγενήθημεν
  choice: wir sind ... zum Schauspiel geworden
  rationale: Gibt die Metapher verständlich wieder, ohne θέατρον auf ein Theatergebäude zu verengen.
- source_word: τῷ κόσμῳ
  choice: der Welt
  rationale: Der Dativ bezeichnet den Kreis, vor dessen Augen die Apostel zum Schauspiel geworden sind.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: sowohl Engeln als auch Menschen
  rationale: Bewahrt die koordinierte Gegenüberstellung der himmlischen und menschlichen Zuschauer.
theological_decisions:
- issue: Bedeutung von ἀγγέλοις
  choice: Engel als himmlische Wesen
  alternative: Boten im allgemeineren Sinn
  rationale: In der Verbindung mit „Welt“ und „Menschen“ liegt ein kosmischer Zuschauerkreis und damit die Bedeutung himmlischer Wesen am nächsten; der Text wird nicht weiter dogmatisch ausgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Öffentlich vorgeführt“ und „zum Schauspiel geworden“ halten die zusammenhängende Bildwelt öffentlicher Zurschaustellung fest. Die Wiederholung von „Denn“ bildet die beiden griechischen Begründungspartikeln γάρ und ὅτι sichtbar ab, ohne ihre genaue logische Beziehung übermäßig festzulegen.
