source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: de
  text: Wir sind Narren um des Messias willen[a], ihr aber seid klug im Messias[b]; wir sind schwach, ihr aber seid stark; ihr seid angesehen[c], wir aber ohne Ansehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wegen des Messias“ oder „für Christus“. Die griechische Wendung διὰ Χριστόν kann einen Grund oder ein Handeln um seinetwillen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „in Christus“. Das Griechische verwendet hier die häufige paulinische Wendung ἐν Χριστῷ.'
    reason: lexical_alternative
  - marker: c
    text: „Angesehen“ und „ohne Ansehen“ beziehen sich hier wahrscheinlich auf öffentliche Anerkennung und gesellschaftliche Schande, nicht nur auf innere Empfindungen.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: Narren
  rationale: Die substantivische Wiedergabe bewahrt die Schärfe der ironischen Gegenüberstellung zu den vermeintlich klugen Korinthern.
- source_word: διὰ Χριστόν
  choice: um des Messias willen
  rationale: διά mit Akkusativ bezeichnet hier Grund beziehungsweise Beweggrund; die Formulierung gibt sowohl den Bezug auf den Messias als auch den um seinetwillen getragenen Zustand natürlich wieder.
- source_word: φρόνιμοι
  choice: klug
  rationale: Die direkte Entsprechung bildet einen klaren rhetorischen Gegensatz zu „Narren“.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Die paulinische Wendung mit ἐν wird bewusst beibehalten, ohne ihre mögliche räumlich-metaphorische oder relationale Bedeutung auf eine einzige Deutung festzulegen.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: schwach / stark
  rationale: Das geläufige Gegensatzpaar erhält den knappen Parallelismus und legt die Art der Schwäche beziehungsweise Stärke nicht unnötig fest.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: angesehen / verachtet
  rationale: Im Zusammenhang bezeichnet das Gegensatzpaar vor allem öffentliche Anerkennung gegenüber gesellschaftlicher Geringschätzung; die deutsche Formulierung ist natürlich und rhetorisch prägnant.
- source_word: ἡμεῖς / ὑμεῖς
  choice: wir / ihr
  rationale: Die ausdrücklich gesetzten Pronomen bleiben erhalten, da sie den zugespitzten Kontrast zwischen den Aposteln und den Korinthern tragen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός wird hier als Titel verstanden. „Messias“ macht diesen Titelcharakter sichtbar, während die Fußnoten die traditionelle Wiedergabe „Christus“ nennen.
- issue: Bedeutung von ἐν Χριστῷ
  choice: im Messias
  alternative: durch den Messias / in Bezug auf den Messias
  rationale: Die formal offene paulinische Wendung wird nicht paraphrasierend auf Ursache, Mittel oder bloßen Bezug eingeengt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller und bewusst zugespitzter Rhetorik. Der dreifache Gegensatz zwischen „wir“ und „ihr“ sowie der ironische Ton bleiben erhalten.
