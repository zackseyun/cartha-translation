  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: de
  text: Denn das Reich Gottes besteht nicht in Worten[a], sondern in Kraft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Rede“; gemeint sein können bloße Worte im Gegensatz zu wirksamer Kraft.'
    reason: lexikalische Alternative und Erläuterung des Gegensatzes
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn ... nicht
  rationale: γάρ begründet die vorausgehende Aussage; „denn“ gibt diesen Zusammenhang im Deutschen knapp und natürlich wieder. οὐ verneint die Aussage.
- source_word: ἐν λόγῳ
  choice: besteht nicht in Worten
  rationale: λόγος kann hier „Wort“, „Rede“ oder „Gerede“ bezeichnen. Der deutsche Plural „Worte“ macht den Gegensatz zu wirksamer Kraft idiomatisch verständlich, ohne die Wendung durch „bloße“ bereits im Haupttext auszudeuten.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Das Reich Gottes“ ist die geläufige und sachlich angemessene Wiedergabe. Sie lässt sowohl den Aspekt der Herrschaft als auch den ihres Wirkungsbereichs offen.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: sondern in Kraft
  rationale: δύναμις bezeichnet Kraft oder Macht. „Kraft“ bildet im Deutschen einen prägnanten Gegensatz zu „Worten“ und lässt offen, in welcher konkreten Weise sich diese Kraft zeigt.
theological_decisions:
- issue: Art des Gegensatzes zwischen λόγος und δύναμις
  choice: Der Text stellt Worte oder Rede der wirksamen Kraft gegenüber, ohne diese Kraft näher festzulegen.
  alternative: Die Kraft ausschließlich als Wunderkraft, als verwandeltes Leben und Gemeindezucht oder als apostolische Vollmacht zu bestimmen.
  rationale: Der griechische Wortlaut nennt nur den allgemeinen Gegensatz. Die Übersetzung wahrt diese theologische Offenheit und engt den Bezug von δύναμις nicht über den Text hinaus ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Besteht ... in“ gibt die griechische ἐν-Konstruktion idiomatisch wieder; die knappe Antithese des Ausgangstextes bleibt erhalten.
