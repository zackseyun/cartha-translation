  source_fidelity: Die Übersetzung gibt den begründenden Anschluss von γάρ („Denn“), die Negation, die Antithese ἐν λόγῳ / ἐν δυνάμει sowie „das Reich Gottes“ sachgerecht wieder. „Besteht nicht in ... sondern in ...“ ist eine idiomatische deutsche Entsprechung der knappen griechischen Prädikation und legt die Art der Kraft nicht näher fest.
  naturalness: „Denn das Reich Gottes besteht nicht in Worten, sondern in Kraft“ ist flüssiges, modernes und zugleich würdevolles Standarddeutsch. Der Plural „Worten“ ist in dieser deutschen Gegenüberstellung idiomatisch und wahrt den Sinn von λόγος im Kontext.
  terminology: „Reich Gottes“ ist die etablierte, präzise Wiedergabe von ἡ βασιλεία τοῦ θεοῦ. „Kraft“ für δύναμις erhält die gewollte Offenheit; weder Wunderkraft noch apostolische Vollmacht oder ethische Wirkung werden unzulässig eingeengt. Die Fußnote bietet „in Rede“ als tragfähige lexikalische Alternative und erläutert den Kontrast zurückhaltend.
