  text: ὡς μὴ ἐρχομένου δέ μου πρὸς ὑμᾶς ἐφυσιώθησάν τινες·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: de
  text: Einige jedoch haben sich aufgebläht[a][b], als käme ich nicht zu euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Einige sind überheblich geworden, als käme ich nicht zu euch.“'
    reason: lexical_alternative
  - marker: b
    text: Paulus verwendet im 1. Korintherbrief wiederholt das Bild des Aufgeblähtseins für selbstgefälligen Stolz; siehe 1 Kor 4,6.19; 5,2; 8,1; 13,4.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: als
  rationale: Mit dem Konjunktiv „käme“ leitet „als“ eine nur angenommene, tatsächlich unzutreffende Voraussetzung ein und bewahrt so die hypothetische Kraft des griechischen Ausdrucks.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: käme ich nicht zu euch
  rationale: Die von ὡς abhängige Genitivkonstruktion mit Partizip und μή bezeichnet eine angenommene Situation, keine unmittelbare Tatsachenbehauptung. Der deutsche Konjunktiv gibt dies natürlich wieder.
- source_word: δέ
  choice: jedoch
  rationale: δέ verbindet den Satz mit dem vorherigen Gedankengang und markiert hier einen leichten Gegensatz. „Jedoch“ bildet diese Funktion ab, ohne sie zu überbetonen.
- source_word: ἐφυσιώθησάν
  choice: haben sich aufgebläht
  rationale: Die Formulierung bewahrt das von Paulus in 1 Korinther wiederholt verwendete Bild des Sich-Aufblähens und bezeichnet zugleich den daraus entstandenen Zustand selbstgefälligen Stolzes.
- source_word: τινες
  choice: Einige
  rationale: Das unbestimmte Pluralpronomen bezeichnet einen Teil der Gemeinde. „Einige“ ist knapp, natürlich und sachlich genau.
theological_decisions:
- issue: Wiedergabe von Paulus’ Kritik am Stolz einiger Korinther
  choice: Das Bild „haben sich aufgebläht“ wird beibehalten.
  alternative: „Einige sind überheblich geworden“ oder „Einige sind arrogant“.
  rationale: Die bildhafte Wiedergabe folgt dem griechischen Ausdruck und macht die sprachliche Verbindung zu den weiteren Vorkommen desselben Verbs im Brief sichtbar, ohne die Aussage auf einen abstrakten Charakterzug zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Konjunktiv wahrt den hypothetischen Sinn; das ungewöhnlichere, aber klare Bild „aufgebläht“ erhält Paulus’ wiederkehrende Metapher.
