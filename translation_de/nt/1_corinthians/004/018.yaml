  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Satzes zutreffend wieder: τινες als „Einige“, ἐφυσιώθησαν als bildhaftes „haben sich aufgebläht“ und die von ὡς mit μή abhängige vermeintliche Annahme mit „als käme ich nicht zu euch“. Der Konjunktiv wahrt, dass Paulus nicht seine Nichtankunft behauptet, sondern die irrige Voraussetzung der Betreffenden beschreibt. „Jedoch“ gibt δέ als leichte Verbindung angemessen wieder.'
  naturalness: Der Satz ist in modernem Standarddeutsch verständlich und flüssig. „Sich aufblähen“ ist hier absichtlich bildhaft und im Kontext einer Paulusübersetzung gut verständlich; die Erläuterungsfußnote unterstützt die ungewöhnlichere Metapher.
