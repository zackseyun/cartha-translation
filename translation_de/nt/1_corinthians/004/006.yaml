source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: de
  text: 'Dies aber, Brüder und Schwestern[a], habe ich um euretwillen auf mich und Apollos übertragen, damit ihr an uns lernt: »Nicht über das hinaus, was geschrieben steht!«[b] Damit sich keiner von euch zugunsten des einen gegen den anderen aufbläht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brüder«; die griechische Anrede kann Männer und Frauen gemeinsam meinen.'
    reason: cultural_note
  - marker: b
    text: 'Der griechische Wortlaut ist verkürzt, etwa: »das ›Nicht über das hinaus, was geschrieben steht‹«. Möglicherweise handelt es sich um einen Merksatz oder eine bekannte Redewendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα δέ
  choice: Dies aber
  rationale: Der Singular »Dies« fasst die vorausgehende Darlegung im Deutschen natürlich zusammen; »aber« gibt δέ als fortführend-kontrastive Verknüpfung wieder, ohne ein nicht vorhandenes »nun« einzufügen.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der griechische maskuline Plural kann in dieser Anrede die gemischte Gemeinde bezeichnen. Die inklusive deutsche Wiedergabe macht den gemeinten Adressatenkreis unmittelbar verständlich; die Form des Griechischen wird in einer Fußnote erläutert.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: habe ich ... auf mich und Apollos übertragen
  rationale: Das Verb bezeichnet hier die rhetorische Übertragung bzw. Anwendung der vorausgehenden Ausführungen auf Paulus und Apollos. »übertragen« wahrt das Bild und ist im Kontext verständlich.
- source_word: δι’ ὑμᾶς
  choice: um euretwillen
  rationale: διά mit Akkusativ bezeichnet hier den Nutzen bzw. die Absicht zugunsten der Adressaten.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: damit ihr an uns ... lernt
  rationale: »an uns« bewahrt die verdichtete Vorstellung, dass Paulus und Apollos als Anschauungsbeispiel dienen, und klingt natürlicher als das formale »in uns«.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'den Grundsatz: »Nicht über das hinaus, was geschrieben steht!«'
  rationale: Die griechische Formulierung ist elliptisch. Die nominale Einleitung »den Grundsatz« und der verblosennahe deutsche Merksatz erhalten diese Kürze, ohne ausdrücklich ein im Griechischen fehlendes Verb einzusetzen.
- source_word: φυσιοῦσθε
  choice: sich ... aufblähen
  rationale: Die Wiedergabe erhält Paulus’ wiederkehrendes Bild des Aufgeblasenseins statt es zur bloßen Arroganz zu verflachen.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: zugunsten des einen und gegen den anderen
  rationale: Die Formulierung bildet die parteiliche Bevorzugung der einen Person gegenüber einer anderen genau ab.
theological_decisions:
- issue: Bedeutung der elliptischen Wendung τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'Als knapper Grundsatz: »Nicht über das hinaus, was geschrieben steht!«'
  alternative: 'Als ausdrückliche Aufforderung: »Geht nicht über das hinaus, was geschrieben steht.«'
  rationale: Die Wendung funktioniert wahrscheinlich als Mahnung oder Merksatz, enthält aber kein ausdrückliches Verb. Die knappe Fassung wahrt diese echte sprachliche Ellipse und legt nicht fest, ob Paulus eine bekannte Maxime zitiert.
- issue: Bezug von ἃ γέγραπται
  choice: Offen als »was geschrieben steht« wiedergeben
  alternative: Ausdrücklich als »die Schrift« bzw. »die Heilige Schrift« identifizieren
  rationale: Die Formel kann auf zuvor angeführte Schrifttexte oder allgemeiner auf das Geschriebene zielen. Der Text selbst nennt den Umfang nicht ausdrücklich; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die inklusive Anrede ist lesernah und wird philologisch transparent erläutert. Der paulinische Ausdruck »aufblähen« sowie die ungewöhnlich knappe Maxime bleiben erhalten; der zweite ἵνα-Satz wird mit »Dann« als beabsichtigte Folge natürlich angeschlossen.
