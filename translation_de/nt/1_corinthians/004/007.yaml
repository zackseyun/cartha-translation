reference: 1 Corinthians 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: de
  text: Denn wer macht dich anders als die anderen?[a] Und was hast du, das du nicht empfangen hast? Wenn du es aber doch empfangen hast, warum rühmst du dich, als hättest du es nicht empfangen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn wer unterscheidet dich?“ Das griechische Verb kann „unterscheiden“, „einen Unterschied machen“ oder „als verschieden erkennbar machen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Denn wer macht dich anders als die anderen?
  rationale: Das transitive διακρίνει fragt hier, wodurch oder durch wen sich der Angesprochene von anderen unterscheidet. Die Formulierung gibt den vergleichenden Sinn und die rhetorische Schärfe natürlich wieder; „Denn“ bildet das begründende γάρ ab. Die lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: τί δὲ ἔχεις
  choice: Und was hast du
  rationale: δέ verbindet hier die aufeinanderfolgenden Fragen nur leicht. „Und“ entspricht dem natürlichen deutschen Gedankenfluss besser als ein stark gegensätzliches „Aber“.
- source_word: ὃ οὐκ ἔλαβες
  choice: das du nicht empfangen hast
  rationale: „Empfangen“ bewahrt den Gegensatz zwischen Erhaltenem und selbst erworbenem Besitz. Das deutsche Perfekt klingt in dieser rhetorischen Frage natürlich und stellt den gegenwärtigen Besitz als Ergebnis des Empfangens dar.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: Wenn du es aber doch empfangen hast
  rationale: „Doch“ gibt die bekräftigende Kraft von καί in der Bedingung wieder; „es“ nimmt sinngemäß das zuvor Genannte auf. „Aber“ markiert die Folgerung beziehungsweise den Kontrast zur vorherigen Frage, ohne ihn zu überzeichnen.
- source_word: τί καυχᾶσαι
  choice: warum rühmst du dich
  rationale: „Sich rühmen“ ist eine natürliche und im paulinischen Sprachgebrauch treffende Wiedergabe von καυχᾶσθαι; die Präsensform bezeichnet die beanstandete gegenwärtige Haltung.
- source_word: ὡς μὴ λαβών
  choice: als hättest du es nicht empfangen
  rationale: 'Der deutsche Konjunktiv in der irrealen Vergleichskonstruktion gibt die Art des Rühmens präzise wieder: Der Angesprochene verhält sich, als sei er kein Empfänger gewesen.'
theological_decisions:
- issue: Reichweite der Aussage über menschliche Vorzüge und empfangene Gaben
  choice: 'Die Formulierung bleibt allgemein: Was immer den Angesprochenen auszeichnet oder was er besitzt, ist empfangen und nicht selbst hervorgebracht.'
  alternative: Die Aussage ausdrücklich auf Geistesgaben und Dienstaufgaben beschränken oder ausdrücklich auf jede Fähigkeit, jeden Rang und jede Segnung ausweiten.
  rationale: Der unmittelbare Zusammenhang betrifft apostolischen Dienst, Parteienstolz und Selbstruhm; der Wortlaut des Verses ist jedoch umfassender. Die Übersetzung bewahrt diese Offenheit, ohne die Aussage konfessionell oder systematisch einzuengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, unmittelbar verständlichem Stil. Die Folge der drei rhetorischen Fragen und der wiederholte Gedanke des Empfangens bleiben erhalten; unnötige theologische Präzisierungen werden vermieden.
