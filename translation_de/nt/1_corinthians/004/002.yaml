  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: de
  text: In diesem Fall wird nun von Verwaltern verlangt, dass jemand als treu befunden wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hier nun wird unter den Verwaltern gesucht, dass jemand als treu befunden wird.“ „Gesucht“ bezeichnet hier, was von Verwaltern erwartet oder verlangt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: Was nun
  rationale: Die Wendung führt die Folgerung aus dem zuvor beschriebenen Bild der Verwalter weiter. „Was nun …“ gibt diese diskursive Funktion im Deutschen natürlich wieder, ohne zwei schwerfällige Übergangswörter anzuhäufen.
- source_word: ζητεῖται
  choice: verlangt wird
  rationale: Das Passiv von ζητέω bedeutet in dieser Konstruktion idiomatisch, was erwartet oder gefordert wird; „verlangt wird“ ist klar und wahrt die passive Form.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: von Verwaltern
  rationale: Mit dem Passiv bezeichnet ἐν hier den Personenkreis, an den die Erwartung gerichtet ist. „Von Verwaltern“ ist im Deutschen idiomatisch.
- source_word: οἰκονόμοις
  choice: Verwaltern
  rationale: „Verwalter“ bewahrt das Bild einer Person, der fremdes Gut zur verantwortlichen Verwaltung anvertraut ist, und ist heute allgemein verständlich.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: dass sich jeder als treu erweist
  rationale: Die Formulierung gibt den Inhaltsgehalt von ἵνα nach ζητεῖται sowie das Ergebnis einer Prüfung in εὑρεθῇ natürlich wieder. „Jeder“ drückt den unbestimmten repräsentativen Singular ohne geschlechtliche Einschränkung aus.
theological_decisions:
- issue: Repräsentativer Singular und geschlechtergerechte Wiedergabe
  choice: dass sich jeder als treu erweist
  alternative: dass jemand als treu befunden wird
  rationale: τις ist unbestimmt und nicht auf Männer beschränkt. „Jeder“ bezieht die Aussage auf jeden einzelnen Verwalter; die Alternative bildet den griechischen Wortlaut formaler ab.
- issue: Bedeutung von πιστός
  choice: treu
  alternative: zuverlässig
  rationale: „Treu“ umfasst hier Zuverlässigkeit bei einem anvertrauten Auftrag und bewahrt zugleich die ethisch-theologische Bedeutungsweite des griechischen Adjektivs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgestaltung ist bewusst idiomatisch; die Fußnote dokumentiert die formnähere Wiedergabe und die Mehrdeutigkeit der Übergangswörter.
