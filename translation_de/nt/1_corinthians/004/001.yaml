id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: de
  text: 'So soll man uns betrachten: als Diener des Messias[a] und als Verwalter der Geheimnisse Gottes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: So
  rationale: Leitet die Art und Weise ein, wie Paulus und seine Mitarbeiter eingeschätzt werden sollen; „So“ ist knapp, natürlich und bewahrt den demonstrativen Bezug.
- source_word: ἡμᾶς
  choice: uns
  rationale: Direktes Objekt von λογιζέσθω; im Zusammenhang sind Paulus und die mit ihm dienenden Verkündiger gemeint.
- source_word: λογιζέσθω
  choice: soll … betrachten
  rationale: Gibt den Imperativ als verbindliche Aufforderung wieder und bezeichnet hier die Einschätzung, die andere von ihnen haben sollen.
- source_word: ἄνθρωπος
  choice: man
  rationale: Das griechische Singularwort ist hier allgemein gebraucht. Das deutsche Indefinitpronomen „man“ gibt diesen generischen Sinn natürlich wieder, ohne das Geschlecht unnötig festzulegen.
- source_word: ὡς
  choice: als
  rationale: Bezeichnet die Eigenschaft oder Stellung, in der Paulus und seine Mitarbeiter betrachtet werden sollen.
- source_word: ὑπηρέτας
  choice: Diener
  rationale: Bezeichnet untergeordnete Helfer oder Beauftragte und trägt nicht von sich aus die rechtliche Bedeutung von Sklavenstatus.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet den Gesalbten; „Messias“ lässt den Titelcharakter erkennen. „Christus“ bleibt als geläufige Alternative in der Fußnote erhalten.
- source_word: οἰκονόμους
  choice: Verwalter
  rationale: Bezeichnet Personen, denen die verantwortliche Verwaltung eines Hauses oder anvertrauter Güter übertragen ist.
- source_word: μυστηρίων
  choice: Geheimnisse
  rationale: Bewahrt den paulinischen Ausdruck für Gottes zuvor verborgene und von ihm erschlossene Heilswahrheiten, ohne ihn im Haupttext auszudeuten.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv kennzeichnet die Geheimnisse als zu Gott gehörig beziehungsweise von ihm stammend.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / des Christus
  rationale: In dieser Verbindung ist der Titel „der Gesalbte“ weiterhin wahrnehmbar. „Messias“ macht diesen Sinn deutlich; die traditionelle Wiedergabe „Christus“ ist jedoch ebenfalls sprachlich und sachlich möglich und wird deshalb vermerkt.
- issue: Generischer Gebrauch von ἄνθρωπος
  choice: man
  alternative: jeder Mensch / eine Person
  rationale: Das Subjekt ist nicht auf Männer beschränkt. Das deutsche „man“ drückt die allgemeine Geltung idiomatisch aus und vermeidet zugleich eine schwerfällige Ausformulierung.
- issue: Bedeutung von μυστηρίων θεοῦ
  choice: Geheimnisse Gottes
  alternative: Gottes verborgene Wahrheiten
  rationale: Die offen formulierte Genitivverbindung und der theologisch gewichtige Ausdruck „Geheimnisse“ bleiben erhalten, statt bereits in der Übersetzung auf eine einzige Erklärung eingeengt zu werden.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Fokus: zuerst die geforderte Einschätzung, danach die beiden parallelen Rollen. „Man“ ist im Deutschen eindeutig generisch; daher ist hierzu keine zusätzliche Fußnote nötig.'
