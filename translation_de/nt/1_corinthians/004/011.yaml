  verdict: approve
  source_fidelity: Die Übersetzung gibt alle Glieder der griechischen Präsens-Reihung sachgerecht wieder. „Bis zu dieser Stunde“ gibt ἄχρι τῆς ἄρτι ὥρας idiomatisch wieder; „leiden wir Hunger und Durst“, „sind unzureichend gekleidet“, „werden geschlagen“ und „ziehen ohne festen Wohnort umher“ entsprechen den fortdauernden Entbehrungen bzw. Misshandlungen. Besonders γυμνιτεύομεν wird angemessen nicht auf völlige Nacktheit festgelegt, und ἀστατοῦμεν behält den Aspekt fehlender fester Bleibe und Unstetigkeit.
  naturalness: Modernes, verständliches Standarddeutsch mit einem dem Kontext angemessen würdigen Ton. Die Satzverknüpfung wirkt trotz der kumulativen Aufzählung flüssig und bildet die wiederholten griechischen καί sinnvoll nach.
  terminology: „Unzureichend gekleidet“ ist für γυμνιτεύομεν präzise und zurückhaltend. „Geschlagen“ gibt κολαφιζόμεθα ausreichend weit wieder, ohne eine bestimmte Art des Schlages unnötig festzulegen. „Ohne festen Wohnort umherziehen“ ist eine natürliche Wiedergabe von ἀστατοῦμεν.
