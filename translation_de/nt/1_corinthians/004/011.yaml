  text: ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: de
  text: Bis zu dieser Stunde leiden wir Hunger und Durst, sind unzureichend gekleidet[a], werden geschlagen und ziehen ohne festen Wohnort umher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind nackt“. Das griechische Wort kann auch unzureichende Bekleidung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „haben keine feste Bleibe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Bis zu dieser Stunde
  rationale: Die Wendung bezeichnet den bis in die Gegenwart reichenden Zeitraum. „Dieser Stunde“ bewahrt das konkrete ὥρα und klingt im Deutschen natürlich und nachdrücklich.
- source_word: πεινῶμεν καὶ διψῶμεν
  choice: leiden wir Hunger und Durst
  rationale: Die Präsensformen beschreiben fortdauernde Entbehrung. Die feste deutsche Verbindung gibt beide Zustände klar und würdig wieder.
- source_word: γυμνιτεύομεν
  choice: sind unzureichend gekleidet
  rationale: Das Verb kann Mangel an ausreichender Kleidung bezeichnen, ohne völlige Nacktheit vorauszusetzen. Die Formulierung vermeidet daher eine unnötige Festlegung.
- source_word: κολαφιζόμεθα
  choice: werden geschlagen
  rationale: Das passive Präsens bezeichnet fortgesetzte körperliche Misshandlung. „Geschlagen“ ist gegenwärtig, verständlich und nicht enger als der griechische Ausdruck.
- source_word: ἀστατοῦμεν
  choice: ziehen ohne festen Wohnort umher
  rationale: Das Verb bezeichnet ein unstetes Leben ohne festen Aufenthaltsort. Die Wiedergabe erhält sowohl die fehlende Bleibe als auch den Aspekt des Umherziehens.
- source_word: καὶ … καὶ … καὶ …
  choice: fortlaufende Reihung mit „und“
  rationale: Die wiederholten καί verleihen der Aufzählung kumulative Kraft. Im Deutschen werden die Glieder deshalb nicht zu einer bloßen kommagetrennten Liste eingeebnet.
theological_decisions:
- issue: Art der apostolischen Selbstbeschreibung
  choice: Konkrete, fortdauernde Entbehrung und Misshandlung
  alternative: Vorwiegend rhetorische oder hyperbolische Darstellung
  rationale: Die Präsensformen nennen die Nöte unmittelbar. Die Übersetzung verstärkt oder verharmlost sie nicht und lässt ihre rhetorische Funktion im Zusammenhang offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die kumulative Reihung der Notlagen bleibt erhalten; erklärungsbedürftige Bedeutungsbreiten werden in Fußnoten ausgewiesen.
