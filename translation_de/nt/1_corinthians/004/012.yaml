id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: de
  text: und mühen uns ab, indem wir mit unseren eigenen Händen arbeiten. Werden wir beschimpft, segnen wir; werden wir verfolgt, halten wir aus;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: mühen uns ab
  rationale: Bezeichnet anstrengende, ermüdende Arbeit und ist stärker als ein bloßes „arbeiten“.
- source_word: ἐργαζόμενοι
  choice: indem wir … arbeiten
  rationale: Das Partizip erläutert, wie die Mühe geschieht; die Formulierung gibt diesen modalen Zusammenhang natürlich wieder.
- source_word: ταῖς ἰδίαις χερσίν
  choice: mit unseren eigenen Händen
  rationale: Bewahrt die Betonung durch ἰδίαις und bezeichnet ausdrücklich körperliche Eigenarbeit.
- source_word: λοιδορούμενοι
  choice: Werden wir beschimpft
  rationale: Gibt das passive Partizip als Situation wieder, auf die die Apostel mit Segnen reagieren; „beschimpfen“ ist modern und umfasst verbale Schmähung.
- source_word: εὐλογοῦμεν
  choice: segnen wir
  rationale: Bewahrt den zentralen biblischen Begriff und den Gegensatz zur Beschimpfung, ohne die Reaktion erläuternd auszubauen.
- source_word: διωκόμενοι
  choice: werden wir verfolgt
  rationale: Der feindselige Sinn von διώκω ist im paulinischen Zusammenhang klar; die parallele passive Form bleibt erhalten.
- source_word: ἀνεχόμεθα
  choice: halten wir aus
  rationale: Gibt das Ertragen fortgesetzter feindseliger Behandlung idiomatisch wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt hinzuzufügen.
theological_decisions:
- issue: Ethische Reaktion auf Misshandlung
  choice: 'Der Vers beschreibt die apostolische Praxis: Auf Beschimpfung folgt Segnen, unter Verfolgung halten die Apostel aus.'
  alternative: Die Aussagen als ausdrückliches allgemeines Gebot formulieren.
  rationale: Der griechische Text berichtet in der ersten Person Plural von apostolischem Verhalten. Seine ethische Kraft bleibt erkennbar, ohne den Bericht grammatisch in ein Gebot umzuwandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Satzglieder und die knappe antithetische Struktur des griechischen Textes bleiben erhalten. Der Vers beginnt entsprechend dem überlieferten Satzanschluss mit „und“ und endet mit einem Semikolon, da der Gedankengang im folgenden Vers weiterläuft.
