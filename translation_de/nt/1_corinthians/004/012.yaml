  source_fidelity: 'Der Text gibt die Abfolge und den Aspekt der griechischen Aussagen zuverlässig wieder: κοπιῶμεν als anstrengendes Sich-Abmühen, das erläuternde Partizip ἐργαζόμενοι, die Hervorhebung von ταῖς ἰδίαις χερσίν sowie die beiden passiven Bedrängungssituationen mit den jeweiligen Reaktionen. „halten wir aus“ gibt ἀνεχόμεθα ohne einen im Griechischen nicht ausgedrückten Gegenstand angemessen wieder.'
