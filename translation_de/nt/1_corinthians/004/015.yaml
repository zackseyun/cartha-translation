revisions:
- from: Denn selbst wenn ihr zehntausend[a] Betreuer[b] im Messias hättet, habt ihr doch nicht viele Väter; denn im Messias Jesus habe ich euch durch das Evangelium gezeugt.[c]
  to: Denn selbst wenn ihr zehntausend[a] Betreuer[b] im Messias habt, habt ihr doch nicht viele Väter; denn im Messias Jesus bin ich durch das Evangelium euer Vater geworden.[c]
  rationale: Die Revision beseitigt die unnatürliche Mischung aus Konjunktiv II und Indikativ, ohne die rhetorische Konzession des griechischen Satzes abzuschwächen. Sie ersetzt die im heutigen Deutsch missverständliche biologische Formulierung „euch gezeugt“ im Haupttext durch eine natürliche Wiedergabe, die das Vaterbild ausdrücklich bewahrt. Die wörtlichere Form bleibt in der Fußnote dokumentiert.
