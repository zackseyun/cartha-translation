  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: de
  text: Denn selbst wenn ihr zehntausend[a] Betreuer[b] im Messias habt, habt ihr doch nicht viele Väter; denn im Messias Jesus bin ich durch das Evangelium euer Vater geworden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unzählige“. Das griechische Wort bedeutet wörtlich „zehntausend“, kann aber auch eine sehr große Zahl bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Aufsichtspersonen, die ein Kind begleiteten, beaufsichtigten und erzogen; nicht in erster Linie Lehrer im heutigen Sinn.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: „habe ich euch gezeugt“. Das Bild bezeichnet Paulus’ Rolle dabei, dass sie durch das Evangelium zum Glauben kamen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυρίους
  choice: zehntausend
  rationale: Die konkrete Grundbedeutung bleibt erhalten; im Zusammenhang bezeichnet die Zahl rhetorisch eine außerordentlich große Menge, worauf die Fußnote hinweist.
- source_word: παιδαγωγοὺς
  choice: Betreuer
  rationale: Der παιδαγωγός war im griechisch-römischen Umfeld vor allem mit Aufsicht, Begleitung und Erziehung eines Kindes betraut, nicht in erster Linie ein schulischer Lehrer. „Betreuer“ gibt diese umfassendere Rolle in heutigem Deutsch am ehesten wieder.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός wird als Titel „Messias“ wiedergegeben. Die paulinische Wendung mit ἐν bleibt bewusst als „im Messias“ erhalten, ohne ihre mögliche Beziehungs- oder Zugehörigkeitsbedeutung auszudeuten.
- source_word: πατέρας
  choice: Väter
  rationale: Das ausdrückliche Vaterbild des griechischen Textes bleibt unverändert und wird nicht durch den erklärenden Zusatz „geistliche“ eingeengt.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: durch das Evangelium
  rationale: 'διά mit Genitiv bezeichnet hier das Mittel: Das Evangelium war das Mittel, durch das Paulus die Korinther zum Glauben brachte.'
- source_word: ἐγέννησα
  choice: habe ich euch gezeugt
  rationale: Die aktive väterliche Metapher des Verbs γεννάω wird unmittelbar bewahrt. Das im Deutschen markierte biologische Bild ist hier beabsichtigt und wird durch den Zusammenhang metaphorisch verstanden.
theological_decisions:
- issue: Paulus’ väterliche Metapher und seine Rolle bei der Entstehung der korinthischen Gemeinde
  choice: „habe ich euch durch das Evangelium gezeugt“
  alternative: „bin ich durch das Evangelium euer Vater geworden“
  rationale: Die gewählte Form folgt dem Verb γεννάω enger und bewahrt die zugespitzte Metapher. Sie beschreibt Paulus als menschliches Werkzeug durch das Evangelium, ohne daraus zusätzliche sakramentale, amtstheologische oder konfessionelle Aussagen abzuleiten.
- issue: Bedeutungsweite der paulinischen Wendung ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: „im Messias“ / „im Messias Jesus“
  alternative: „in Gemeinschaft mit dem Messias“ / „durch den Messias Jesus“
  rationale: Die knappe Präpositionalwendung bleibt stehen, damit ihre Beziehungs-, Zugehörigkeits- und Sphärenbedeutung nicht auf nur eine Deutung festgelegt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt den starken Gegensatz zwischen vielen Betreuern und wenigen Vätern. „Im Messias“ und „gezeugt“ sind bewusst markierte, textnahe Formulierungen, die die paulinische Ausdrucksweise und ihre theologische Spannung erhalten.
