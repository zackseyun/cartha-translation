source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: de
  text: Denn ich bin mir keiner Schuld bewusst[a]; doch dadurch bin ich nicht gerechtfertigt[b]. Der mich aber prüft[c], ist der Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich weiß nichts gegen mich selbst“; gemeint ist, dass Paulus sich keiner belastenden Sache bewusst ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dadurch bin ich nicht freigesprochen“ beziehungsweise „nicht als gerecht erwiesen“. Das griechische Wort ist ein forensischer Ausdruck und wird bei Paulus auch für „rechtfertigen“ gebraucht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Der mich aber beurteilt“. Das griechische Verb kann prüfen, untersuchen oder in einem gerichtlichen Zusammenhang beurteilen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: Denn ich bin mir keiner Schuld bewusst
  rationale: Die idiomatische Verbindung σύνοιδα mit dem Reflexivpronomen bezeichnet hier, dass Paulus nichts Belastendes auf seinem Gewissen weiß. „Keiner Schuld bewusst“ ist natürliches Deutsch und macht den moralisch-forensischen Zusammenhang deutlich, ohne Sündlosigkeit zu behaupten.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: doch dadurch … nicht
  rationale: '„Dadurch“ gibt den instrumentalen beziehungsweise begründenden Sinn von ἐν τούτῳ idiomatisch wieder: Das unbelastete eigene Bewusstsein bildet nicht die Grundlage des Urteils.'
- source_word: δεδικαίωμαι
  choice: bin ich nicht gerechtfertigt
  rationale: Das Perfekt Passiv von δικαιόω trägt forensisches Gewicht. „Gerechtfertigt“ bewahrt zugleich die paulinische Begrifflichkeit und die Spannung zwischen Gewissen und maßgeblichem Urteil.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: Der mich aber prüft
  rationale: ἀνακρίνω kann prüfen, untersuchen oder gerichtlich beurteilen bedeuten. „Prüft“ wahrt die Breite des Vorgangs und legt nicht vorschnell ein abschließendes Urteil fest.
- source_word: κύριός
  choice: der Herr
  rationale: Die bestimmte Bezeichnung wird ohne im Vers nicht ausdrücklich genannte Erweiterung wiedergegeben.
theological_decisions:
- issue: Forensische Bedeutung von δεδικαίωμαι im Verhältnis zur Selbsteinschätzung des Paulus
  choice: „dadurch bin ich nicht gerechtfertigt“
  alternative: „dadurch bin ich nicht freigesprochen“ oder „dadurch bin ich nicht als gerecht erwiesen“
  rationale: Der unmittelbare Zusammenhang handelt von Prüfung und Urteil. Die gewählte Fassung bewahrt den forensischen und paulinischen Schlüsselbegriff, ohne den Satz zu einer über seinen Kontext hinausgehenden Lehrformel auszubauen.
- issue: Reichweite der Aussage über das eigene Gewissen
  choice: „ich bin mir keiner Schuld bewusst“
  alternative: „ich weiß nichts gegen mich“ oder „ich bin mir nichts bewusst“
  rationale: Paulus spricht über sein Bewusstsein, nicht über objektive Schuldlosigkeit. Der folgende Satz hält ausdrücklich offen, dass sein eigenes Urteil nicht entscheidend ist.
- issue: Identität von κύριος
  choice: „der Herr“
  alternative: „der Herr Jesus“
  rationale: Der griechische Text nennt nur κύριος. Eine ausdrücklichere Identifizierung wird daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem argumentativen Gegensatz des Griechischen; „Schuld“ verdeutlicht die idiomatische Gewissensrede, während Fußnote [a] die wörtlicheren Möglichkeiten dokumentiert. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
