reference: 1 Corinthians 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: de
  text: Darum habe ich Timotheus zu euch gesandt. Er ist mein geliebtes und treues Kind[a] im Herrn. Er wird euch an meine Wege in Jesus, dem Messias,[b] erinnern, so wie ich sie überall in jeder Gemeinde lehre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein geliebter und treuer Sohn im Herrn“. Das griechische Wort τέκνον bedeutet wörtlicher „Kind“, kann in diesem Zusammenhang aber auch mit „Sohn“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Christus Jesus“. Das griechische Χριστός bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den rückwärtsweisenden kausalen Zusammenhang knapp und natürlich wieder.
- source_word: ἔπεμψα
  choice: habe ich … gesandt
  rationale: Das deutsche Perfekt eignet sich in einem Brief natürlich für die bereits veranlasste Sendung; „gesandt“ bewahrt den würdigen Ton.
- source_word: Τιμόθεον
  choice: Timotheus
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: τέκνον
  choice: Kind
  rationale: Das Wort bezeichnet geschlechtsneutral ein Kind und bewahrt Paulus’ familiäres Bild, ohne es unnötig zu „Sohn“ zu verengen.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: geliebtes und treues
  rationale: Bewahrt sowohl die herzliche Verbundenheit als auch die Verlässlichkeit des Timotheus.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Entspricht der paulinischen Wendung und bezeichnet die Beziehung beziehungsweise den Lebensbereich im Herrn.
- source_word: ἀναμνήσει
  choice: wird … erinnern
  rationale: Gibt das Futur und die beabsichtigte Aufgabe des Timotheus unmittelbar wieder.
- source_word: τὰς ὁδούς μου
  choice: meine Wege
  rationale: Bewahrt die Metapher für Paulus’ Lebens-, Dienst- und Lehrpraxis, ohne sie auf bloße Reiserouten oder nur auf Verhalten zu beschränken.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: in Jesus, dem Messias
  rationale: Gibt Χριστός als Titel mit seiner Bedeutung „Messias“ wieder und formuliert die Verbindung im Deutschen natürlicher als „im Messias Jesus“.
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: so wie ich sie überall in jeder Gemeinde lehre
  rationale: Bewahrt den Vergleich und den umfassenden Geltungsanspruch; das ergänzte Pronomen „sie“ macht den Bezug auf Paulus’ Wege im Deutschen klar.
theological_decisions:
- issue: Wiedergabe von Χριστός in ἐν Χριστῷ Ἰησοῦ
  choice: in Jesus, dem Messias
  alternative: in Christus Jesus
  rationale: Χριστός trägt hier weiterhin titularen Sinn. Die gewählte Form übersetzt den Titel und bleibt zugleich in natürlichem Deutsch verständlich; die traditionelle Form wird in der Fußnote genannt.
- issue: Bedeutung von „meine Wege“
  choice: Die Metapher bleibt offen und umfasst Paulus’ Lebens-, Dienst- und Lehrpraxis in Verbindung mit Jesus, dem Messias.
  alternative: meine Lebensweise / mein Verhalten
  rationale: ὁδοί ist im Zusammenhang bildlich gebraucht. „Wege“ bewahrt die Breite des Ausdrucks und legt ihn nicht allein auf persönliches Verhalten fest.
- issue: Bezug von ἐν κυρίῳ
  choice: 'Die Wendung bleibt unmittelbar bei der Beschreibung des Timotheus: „mein … Kind im Herrn“.'
  alternative: „treu im Herrn“ als ausschließlicher Bezug nur auf πιστόν
  rationale: Die griechische Fügung lässt eine enge Verbindung mit „treu“ zu, kann aber auch die gesamte geistliche Beziehung „Kind im Herrn“ charakterisieren. Die deutsche Stellung bewahrt diese gewisse Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Briefstil. Der lange griechische Relativsatz wurde in zwei Sätze gegliedert, ohne seinen Aussagegehalt zu verändern. Die Metapher „meine Wege“ und die paulinische Wendung „im Herrn“ wurden bewusst beibehalten.
