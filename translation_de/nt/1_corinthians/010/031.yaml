  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: de
  text: 'Ob ihr nun esst oder trinkt oder was ihr auch tut: Tut alles zur Ehre Gottes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: Ob ... oder ... oder
  rationale: Die korrelativen Konjunktionen führen verschiedene mögliche Fälle an. „Ob ... oder ... oder“ bildet diese Struktur im Deutschen natürlich ab.
- source_word: οὖν
  choice: nun
  rationale: οὖν zieht eine Folgerung aus der vorangehenden Erörterung. Im Zusammenhang gibt „nun“ den folgernden Übergang idiomatisch und würdig wieder.
- source_word: ἐσθίετε
  choice: ihr esst
  rationale: Das Präsens bezeichnet hier allgemein übliches Handeln und nicht notwendig einen gerade ablaufenden Vorgang.
- source_word: πίνετε
  choice: trinkt
  rationale: Wie bei ἐσθίετε ist das Präsens generisch. Das Subjekt „ihr“ wird im koordinierten deutschen Satz sinnvoll vom ersten Verb mitgeführt.
- source_word: τι
  choice: was ... auch
  rationale: Das indefinite τι erweitert in der Wendung εἴτε τι ποιεῖτε den Blick über Essen und Trinken hinaus. „was ihr auch tut“ gibt diese umfassende Offenheit idiomatisch wieder.
- source_word: ποιεῖτε
  choice: tut / Tut
  rationale: ποιέω bezeichnet hier allgemein jedes Handeln. Die Wiederholung im Ausgangstext bleibt in Nebensatz und Aufforderung erhalten.
- source_word: πάντα
  choice: alles
  rationale: Der substantivierte Akkusativ Neutrum Plural hat umfassende Bedeutung; „alles“ ist die natürliche moderne deutsche Entsprechung.
- source_word: εἰς δόξαν
  choice: zur Ehre
  rationale: εἰς mit δόξαν bezeichnet Ziel oder Zweck. Die feste deutsche Wendung „zur Ehre Gottes“ drückt diese Ausrichtung klar aus.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird unmittelbar durch den deutschen Genitiv wiedergegeben und bewahrt die kompakte, gewichtige Formulierung.
theological_decisions:
- issue: Reichweite der Aufforderung des Paulus
  choice: Die umfassenden Ausdrücke „was ihr auch tut“ und „alles“ bleiben uneingeschränkt und formulieren eine allgemeine Ausrichtung allen Handelns auf Gottes Ehre.
  alternative: Die Aufforderung könnte eng auf die unmittelbar behandelten Fragen von Essen und Trinken begrenzt verstanden werden.
  rationale: Der Vers erwächst aus der konkreten Diskussion über Speise und Trank, weitet sie aber durch τι und πάντα ausdrücklich aus. Die Übersetzung bewahrt sowohl den Kontextbezug als auch die sprachlich umfassende Reichweite.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Aufforderungsstil. Der Doppelpunkt macht den Übergang von den angeführten Fällen zur zusammenfassenden Aufforderung sichtbar, ohne dem griechischen Text zusätzliche Bedeutung hinzuzufügen.
