source:
  edition: SBLGNT
  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: de
  text: Und alle wurden auf Mose[a] getauft, in der Wolke und im Meer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in Mose hinein«; möglich ist auch: »mit Mose verbunden« oder »Mose zugeordnet«. Der ungewöhnliche griechische Ausdruck bewahrt die typologische Parallele zur Taufe.'
    reason: alternative_reading
  - marker: b
    text: Paulus sagt »im Meer«, nicht »durch das Meer«, und bewahrt damit den Parallelismus zu »in der Wolke«.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: alle
  rationale: Der Nominativ Plural bezeichnet zusammenfassend alle zuvor genannten Israeliten und bewahrt die wiederholte Betonung von »alle« im Zusammenhang.
- source_word: εἰς τὸν Μωϋσῆν
  choice: auf Mose
  rationale: »Auf Mose getauft« ist im Deutschen eine verständliche, zugleich eng am ungewöhnlichen griechischen εἰς orientierte Taufformulierung. Sie wahrt die typologische Parallele, ohne die Beziehung zu Mose einseitig als Identifikation oder Gefolgschaft auszudeuten.
- source_word: ἐβαπτίσαντο
  choice: wurden … getauft
  rationale: Die idiomatische Passivform gibt den Aorist Medium im Kontext angemessen wieder. Sie bewahrt den etablierten Sinn von βαπτίζω und vermeidet die irreführende Vorstellung, die Israeliten hätten sich selbst getauft.
- source_word: ἐν τῇ νεφέλῃ
  choice: in der Wolke
  rationale: Die Wiedergabe mit »in« erhält sowohl das Exodusbild als auch die mögliche Mehrdeutigkeit von Bereich, Mittel oder begleitendem Umstand.
- source_word: ἐν τῇ θαλάσσῃ
  choice: im Meer
  rationale: »Im Meer« entspricht ἐν und hält den sprachlichen Parallelismus mit »in der Wolke« aufrecht; »durch das Meer« würde die Präposition interpretierend verändern.
theological_decisions:
- issue: Bedeutung der Taufe »auf Mose«
  choice: Die typologische und repräsentative Formulierung bleibt im Haupttext stehen, ohne weiter aufgelöst zu werden.
  alternative: »mit Mose verbunden«, »auf die Gefolgschaft gegenüber Mose verpflichtet« oder formal »in Mose hinein«
  rationale: Paulus stellt Israels Exodus-Erfahrung in eine typologische Beziehung zur christlichen Taufe. Die Übersetzung soll diese theologische Spannung bewahren und nicht auf eine einzige Erklärung festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Deutschen geläufige Wendung »auf Mose getauft« verbindet Verständlichkeit mit formaler Nähe zum griechischen εἰς τὸν Μωϋσῆν. Die beiden Präpositionalgruppen bleiben bewusst parallel.
