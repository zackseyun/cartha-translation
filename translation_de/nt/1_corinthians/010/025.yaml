source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: de
  text: Esst alles, was auf dem Fleischmarkt verkauft wird, ohne wegen des Gewissens Nachforschungen anzustellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne etwas zu prüfen“ oder „ohne nachzufragen“; gemeint ist, die Herkunft des Fleisches nicht zu untersuchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: alles, was ... verkauft wird
  rationale: Die substantivierte sächliche Wendung bezeichnet umfassend alles dort zum Verkauf Angebotene. Die deutsche Formulierung ist natürlich und bewahrt diese umfassende Bedeutung.
- source_word: ἐν μακέλλῳ
  choice: auf dem Fleischmarkt
  rationale: μάκελλον bezeichnet hier nicht allgemein einen Markt, sondern einen Verkaufsort für Fleisch. „Fleischmarkt“ macht den für den Zusammenhang wichtigen konkreten Bezug deutlich.
- source_word: ἐσθίετε
  choice: Esst
  rationale: Der Präsensimperativ der zweiten Person Plural wird direkt und idiomatisch als deutscher Imperativ wiedergegeben.
- source_word: μηδὲν ἀνακρίνοντες
  choice: ohne ... Nachforschungen anzustellen
  rationale: ἀνακρίνω kann prüfen, untersuchen oder nachfragen bedeuten. Im Kontext geht es darum, die Herkunft beziehungsweise Vorgeschichte des Fleisches nicht zu ermitteln.
- source_word: διὰ τὴν συνείδησιν
  choice: wegen des Gewissens
  rationale: διά mit Akkusativ bezeichnet hier den Beweggrund oder Gesichtspunkt. Die Formulierung lässt offen, wessen Gewissen gemeint ist, wie es auch der griechische Vers tut.
theological_decisions:
- issue: Bezug von „Gewissen“
  choice: „des Gewissens“ ohne nähere Zuordnung
  alternative: „eures Gewissens“ oder „des Gewissens des anderen“
  rationale: Im griechischen Text steht lediglich der bestimmte Ausdruck „das Gewissen“. Der einzelne Vers legt den Bezug nicht ausdrücklich fest; deshalb wird die Spannung nicht vorzeitig aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. „Nachforschungen anstellen“ gibt den kontextuellen Sinn präzise wieder; die Fußnote bewahrt die engeren lexikalischen Alternativen.
