  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: de
  text: Darum, meine Geliebten, flieht vor dem Götzendienst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götzenverehrung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Darum
  rationale: Die folgernde Konjunktion zieht eine nachdrückliche Schlussfolgerung aus dem vorangehenden Gedankengang. „Darum“ ist im modernen Deutschen natürlich und bewahrt diesen logischen Bezug.
- source_word: ἀγαπητοί μου
  choice: meine Geliebten
  rationale: Die vokativische Anrede drückt persönliche Zuneigung aus. „Meine Geliebten“ wahrt den vertrauten paulinischen Klang und bleibt zugleich würdevoll.
- source_word: φεύγετε
  choice: flieht
  rationale: Der Imperativ im Präsens fordert eindringlich dazu auf, sich von einer Gefahr fernzuhalten. „Flieht“ erhält die Stärke und Dringlichkeit des griechischen Verbs.
- source_word: ἀπὸ
  choice: vor
  rationale: Nach „fliehen“ bezeichnet ἀπό die Trennung von dem, was gemieden werden soll. Die deutsche Verbindung „vor etwas fliehen“ ist idiomatisch und gibt die Bewegungsrichtung weg vom Götzendienst wieder.
- source_word: τῆς εἰδωλολατρίας
  choice: dem Götzendienst
  rationale: εἰδωλολατρία bezeichnet Verehrung beziehungsweise kultischen Dienst an Götzen. „Götzendienst“ ist eine präzise, geläufige deutsche Entsprechung; „Götzenverehrung“ verdeutlicht als Alternative den kultischen Sinn.
theological_decisions:
- issue: Reichweite des Verbots
  choice: Unmittelbare Aufforderung, Götzendienst einschließlich der damit verbundenen kultischen Beteiligung zu meiden
  alternative: Eine engere Warnung ausschließlich vor innerer Hingabe an Götzen
  rationale: Im Zusammenhang warnt Paulus vor der Beteiligung an heidnischen Kultmahlzeiten und Praktiken. Der allgemeine Ausdruck „Götzendienst“ bewahrt die Reichweite des griechischen Begriffs, ohne das Verbot auf eine bloß innere Haltung einzuengen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die knappe Satzform und der dringliche Imperativ des griechischen Textes bleiben erhalten.
