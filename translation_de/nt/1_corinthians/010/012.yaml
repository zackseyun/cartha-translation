id: 1CO.10.12
reference: 1 Corinthians 10:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: de
  text: Wer also meint, er stehe, soll aufpassen, dass er nicht fällt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum soll derjenige, der meint, festzustehen, achtgeben, dass er nicht fällt.“'
    reason: Alternative Wiedergabe der Folgerung, des substantivierten Partizips und des Zustandsverbs; „festzustehen“ verdeutlicht den Sinn, fügt jedoch eine leichte Betonung hinzu.
lexical_decisions:
- source_word: ὥστε
  choice: also
  rationale: Die folgernde Konjunktion zieht aus den vorangehenden Warnbeispielen eine Schlussfolgerung; „also“ ist im Deutschen knapp und natürlich.
- source_word: ὁ δοκῶν
  choice: wer meint
  rationale: Das substantivierte Partizip bezeichnet verallgemeinernd denjenigen, der diese Einschätzung von sich hat. „Wer meint“ gibt dies idiomatisch wieder, ohne die mögliche Selbstüberschätzung ausdrücklich hinzuzufügen.
- source_word: ἑστάναι
  choice: er stehe
  rationale: Der Perfektinfinitiv bezeichnet den Zustand des Stehens. Der Konjunktiv in der indirekten Rede nach „meint“ ist gehobenes, aber geläufiges Standarddeutsch und bewahrt die Aussage als Selbsteinschätzung.
- source_word: βλεπέτω
  choice: soll aufpassen
  rationale: Der Imperativ fordert zu anhaltender Wachsamkeit auf. „Soll aufpassen“ ist modern und gibt den warnenden Aufforderungscharakter klar wieder.
- source_word: μὴ πέσῃ
  choice: dass er nicht fällt
  rationale: μή mit Aoristkonjunktiv nach dem Imperativ drückt eine Warnung beziehungsweise negative Zielrichtung aus. Die deutsche Konstruktion ist natürlich und lässt „fallen“ bewusst unbestimmt.
theological_decisions:
- issue: Bedeutung des Fallens
  choice: Das allgemeine „fällt“ bleibt ohne nähere Bestimmung stehen.
  alternative: „in Sünde fällt“, „dem Gericht verfällt“ oder „vom Glauben abfällt“
  rationale: Der Zusammenhang warnt anhand des Versagens Israels vor Selbstsicherheit, doch πέσῃ legt nicht eindeutig fest, ob moralisches Versagen, Abfall oder Gericht gemeint ist. Die offene Formulierung bewahrt die theologische Spannung.
- issue: Generisches Maskulinum im Singular
  choice: „wer … er“
  alternative: Pluralische oder ausdrücklich geschlechtsneutrale Formulierung
  rationale: Der griechische Text steht im grammatisch maskulinen Singular und ist repräsentativ gemeint. Die deutsche Form wahrt Numerus und Bildführung und ist dabei allgemein auf jede Person bezogen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp und warnend; „er stehe“ bewahrt einen leicht gehobenen biblischen Ton, ohne altertümlich zu wirken.
