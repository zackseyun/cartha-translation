  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: de
  text: so wie auch ich allen in allem gefalle[a], wobei ich nicht meinen eigenen Vorteil suche, sondern den der vielen[b], damit sie gerettet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mich in allem auf alle einstelle«. Wörtlicher heißt es im Griechischen: »allen in allem«; gemeint ist eine weitreichende Rücksichtnahme zum Wohl anderer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »nicht meinen eigenen Nutzen, sondern den Nutzen der vielen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: so wie auch ich
  rationale: Bewahrt den vergleichenden Anschluss an die vorausgehende Aufforderung und gibt das in κἀγώ enthaltene »auch ich« wieder.
- source_word: πάντα πᾶσιν
  choice: allen in allem
  rationale: Die Verbindung aus neutralem Akkusativ Plural und personalem Dativ Plural bezeichnet eine weitreichende Rücksichtnahme. Die knappe Formulierung bleibt nahe am griechischen Ausdruck, ohne den anderslautenden Wortlaut von 1. Korinther 9,22 einzutragen.
- source_word: ἀρέσκω
  choice: zu gefallen suche
  rationale: ἀρέσκω bedeutet hier »gefallen« beziehungsweise sich auf andere einzustellen. Die idiomatische deutsche Wendung vermeidet das unnatürliche »ich gefalle allen«, während der folgende Satzteil deutlich macht, dass nicht Schmeichelei oder das Streben nach Anerkennung gemeint ist.
- source_word: μὴ ζητῶν
  choice: wobei ich nicht … suche
  rationale: Das präsentische Partizip beschreibt die begleitende Haltung beziehungsweise das Motiv. »Wobei« stellt diesen Zusammenhang im Deutschen klar dar.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: meinen eigenen Vorteil
  rationale: σύμφορον bezeichnet das, was nützt oder vorteilhaft ist. »Vorteil« wahrt den Gegensatz zum Wohl der vielen und den Bezug auf das Nützliche im Kapitel.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: sondern den der vielen
  rationale: Die Ellipse wird entsprechend dem vorausgehenden »Vorteil« ergänzt. »Die vielen« bleibt erhalten, statt den Ausdruck verallgemeinernd durch »die anderen« zu ersetzen.
- source_word: ἵνα σωθῶσιν
  choice: damit sie gerettet werden
  rationale: Die Konstruktion mit ἵνα und passivem Konjunktiv drückt den Zweck aus. Das Passiv bleibt gewahrt, ohne den Handelnden ausdrücklich zu ergänzen.
theological_decisions:
- issue: Bedeutungsumfang von σωθῶσιν
  choice: »damit sie gerettet werden« im gewöhnlichen paulinischen Sinn der Rettung
  alternative: »damit ihnen geholfen wird« oder »damit sie bewahrt werden«
  rationale: Der Sprachgebrauch im 1. Korintherbrief und der evangelistische Zusammenhang sprechen für den heilsgeschichtlichen Sinn. Die passive Form wird beibehalten, ohne die im Satz nicht genannte Urheberschaft auszudeuten.
- issue: Sinn von Paulus’ Gefallenwollen
  choice: Rücksichtnahme zum Wohl anderer
  alternative: Streben nach menschlicher Anerkennung oder kompromissbereite Gefälligkeit
  rationale: Die unmittelbar folgende Erläuterung – nicht den eigenen Vorteil, sondern den der vielen zu suchen – bestimmt den Sinn von ἀρέσκω. Der lexikalische Gehalt »gefallen« bleibt sichtbar, während der Kontext ein bloßes Buhlen um Zustimmung ausschließt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Kleinschreibung am Anfang bewahrt den syntaktischen Anschluss des Verses an die vorausgehende Aufforderung. Die Formulierung bleibt quellennah, löst die Ellipse jedoch so auf, dass der Satz für heutige Leser unmittelbar verständlich ist.
