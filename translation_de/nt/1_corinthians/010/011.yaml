  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: de
  text: Dies geschah ihnen als Beispiel[a]; dies wurde aber zu unserer Ermahnung aufgeschrieben[b] – für uns, zu denen die Enden der Zeitalter gekommen sind[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Vorbilder“ oder „typologisch“; Paulus stellt diese Ereignisse als Muster dar, die für spätere Gläubige belehrende Bedeutung haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu unserer Unterweisung“ oder „zu unserer Warnung“; das griechische Wort umfasst ermahnende, korrigierende Unterweisung und Warnung.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht im Griechischen der Plural: „die Enden der Zeitalter“. Möglich wäre sinngemäß auch: „das Ende der Zeitalter ist gekommen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: beispielhaft
  rationale: Das Adverb beschreibt die Ereignisse als Muster mit belehrender Bedeutung. „Beispielhaft“ ist verständlich und wahrt den Bezug zu Vers 6; die fachsprachlichen Alternativen „typologisch“ oder „als Typen“ werden in einer Fußnote genannt.
- source_word: συνέβαινεν
  choice: widerfuhr
  rationale: Das Imperfekt bezeichnet das damalige Geschehen. „Widerfuhr ihnen“ gibt mit dem Dativ ἐκείνοις natürlich wieder, dass diese Dinge jene Wüstengeneration trafen, ohne eine im Deutschen schwer darstellbare Verlaufsnuance zu erzwingen.
- source_word: ἐκείνοις
  choice: ihnen
  rationale: Das Pronomen verweist knapp und eindeutig auf die zuvor behandelte Wüstengeneration.
- source_word: ἐγράφη
  choice: es wurde … aufgeschrieben
  rationale: Die griechische Verbform steht im Singular. Das unpersönliche deutsche „es wurde aufgeschrieben“ bewahrt diesen Numerus und bezieht sich natürlich auf den berichteten Geschehenszusammenhang.
- source_word: πρὸς νουθεσίαν
  choice: zu unserer Zurechtweisung
  rationale: νουθεσία umfasst mahnende, korrigierende Unterweisung. „Zurechtweisung“ erhält diese korrigierende Kraft deutlicher als das allgemeinere „Belehrung“; die Spannweite wird in der Fußnote erläutert.
- source_word: εἰς οὓς
  choice: zu denen
  rationale: Die Formulierung hält die Richtungsbedeutung von εἰς fest und verbindet sich idiomatisch mit „gelangt sind“.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: die Enden der Zeitalter
  rationale: Beide griechischen Substantive stehen im Plural. Die formnahe Wiedergabe bewahrt Paulus’ ungewöhnliche heilsgeschichtliche und eschatologische Ausdrucksweise.
- source_word: κατήντηκεν
  choice: gelangt sind
  rationale: Das Perfekt bezeichnet ein erfolgtes Eintreffen mit gegenwärtiger Bedeutung. Wegen des pluralischen deutschen Subjekts steht „sind“ im Plural, obwohl das griechische Neutrum Plural ein Verb im Singular hat.
theological_decisions:
- issue: Paulus’ heilsgeschichtliche Wendung τὰ τέλη τῶν αἰώνων
  choice: die Enden der Zeitalter … gelangt sind
  alternative: das Ende der Zeitalter ist gekommen / die Vollendung der Zeitalter ist gekommen
  rationale: Der doppelte Plural und die ungewöhnliche Bildsprache bleiben erhalten. Dadurch wird die eschatologische Spannung nicht in eine glattere singularische oder deutende Aussage aufgelöst.
- issue: Die Funktion der früheren Ereignisse
  choice: beispielhaft
  alternative: als Vorbilder / typologisch
  rationale: Die Übersetzung macht ihre Muster- und Warnfunktion deutlich, ohne ein ausgearbeitetes typologisches System in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „die Enden der Zeitalter“ bleibt bewusst erhalten, während Fußnoten die lexikalischen Alternativen erläutern. Die Marker stehen jeweils unmittelbar an der einschlägigen Formulierung.
