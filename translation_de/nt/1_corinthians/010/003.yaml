  text: and all ate the same spiritual food[a]
translation:
  language: de
  text: Und alle aßen dieselbe geistliche Speise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übernatürliche Speise“. Die Wendung spielt wahrscheinlich auf das Manna in der Wüste an und kann im Zusammenhang typologische Bedeutung haben.'
    reason: Lexikalische Alternative und kontextuelle Anspielung.
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die gewöhnliche koordinierende Konjunktion verbindet den Satz mit dem vorausgehenden Zusammenhang.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt die betonte Gesamtheit der Israeliten, ohne ein im Griechischen nicht ausdrücklich gesetztes Pronomen hinzuzufügen.
- source_word: τὸ αὐτὸ
  choice: dieselbe
  rationale: Die Verbindung bezeichnet Identität beziehungsweise Gleichheit; im Deutschen stimmt das Pronomen mit „Speise“ überein.
- source_word: πνευματικὸν
  choice: geistliche
  rationale: „Geistlich“ entspricht dem paulinischen Sprachgebrauch und lässt offen, in welchem genauen Sinn die Speise durch Gottes Wirken geprägt ist.
- source_word: βρῶμα
  choice: Speise
  rationale: „Speise“ gibt den allgemeinen Sinn von Nahrung direkt wieder und bildet eine natürliche, würdige Verbindung mit „geistlich“.
- source_word: ἔφαγον
  choice: aßen
  rationale: Der Aorist berichtet schlicht von einer vergangenen Handlung; das Präteritum ist hier die passende deutsche Erzählform.
theological_decisions:
- issue: Bedeutung der „geistlichen Speise“ in der Wüstentypologie des Paulus
  choice: Die Formulierung „geistliche Speise“ bleibt im Haupttext stehen, ohne sie ausdrücklich mit dem Manna oder dem Abendmahl gleichzusetzen.
  alternative: „übernatürliche Speise“, „vom Geist gegebene Speise“ oder eine ausdrückliche Identifikation mit dem Manna beziehungsweise dem Abendmahl
  rationale: Der Zusammenhang spielt wahrscheinlich auf das Manna an und kann typologische Bedeutung tragen. Die direkte Wiedergabe bewahrt jedoch die theologische Spannung und vermeidet eine einengende Deutung.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Form. „Geistliche Speise“ bewahrt den traditionellen biblischen Ausdruck, bleibt verständlich und gibt die Mehrdeutigkeit von πνευματικός besser wieder als eine erklärende Paraphrase.
