source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: de
  text: Lasst uns auch keine sexuelle Unmoral begehen, wie einige von ihnen sexuelle Unmoral begingen und an einem einzigen Tag dreiundzwanzigtausend[b] fielen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „starben“ beziehungsweise „wurden niedergestreckt“. Wörtlich steht im Griechischen „fielen“, eine geläufige Ausdrucksweise für den Tod unter dem Gericht.'
    reason: lexical_alternative
  - marker: b
    text: In 4. Mose 25,9 werden vierundzwanzigtausend genannt. Paulus sagt hier, dass dreiundzwanzigtausend „an einem einzigen Tag“ fielen. Damit könnte zwischen den an jenem Tag Gestorbenen und der höheren Gesamtzahl unterschieden werden; die Übersetzung bewahrt jedoch Paulus’ Wortlaut, ohne die Angaben anzugleichen.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Auch lasst uns keine
  rationale: In Verbindung mit dem hortativen Konjunktiv führt μηδέ die Reihe der Warnungen fort. Die Formulierung ist im Deutschen natürlich und bewahrt den anschließenden Charakter.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: sexuelle Unmoral begehen / begingen
  rationale: πορνεύω bezeichnet sexuell unmoralisches Verhalten. Die wiederholte Wiedergabe erhält die bewusste lexikalische Wiederholung des griechischen Textes, ohne den Begriff unnötig zu verengen.
- source_word: καθώς
  choice: wie
  rationale: καθώς leitet den Vergleich mit dem Verhalten einiger Israeliten ein.
- source_word: τινες αὐτῶν
  choice: einige von ihnen
  rationale: Die Wendung verweist schlicht auf einen Teil der Wüstengeneration Israels.
- source_word: ἔπεσαν
  choice: fielen
  rationale: Die wörtliche Bedeutung wird bewahrt; im Zusammenhang bezeichnet das Fallen den Tod unter dem Gericht. Diese Bedeutung wird in einer Fußnote erläutert.
- source_word: μιᾷ ἡμέρᾳ
  choice: an einem einzigen Tag
  rationale: Die Zeitangabe hebt die Konzentration des Gerichts auf einen Tag hervor und ist idiomatisches modernes Deutsch.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: dreiundzwanzigtausend
  rationale: Die Zahl wird entsprechend dem griechischen Text direkt und im Fließtext ausgeschrieben wiedergegeben.
theological_decisions:
- issue: Verhältnis zur Zahl in 4. Mose 25,9
  choice: Paulus’ Angabe „dreiundzwanzigtausend“ bleibt im Haupttext unverändert.
  alternative: Die Angabe an die „vierundzwanzigtausend“ aus 4. Mose 25,9 angleichen oder beide Zahlen im Haupttext harmonisieren.
  rationale: Der griechische Text von 1. Korinther 10,8 nennt eindeutig dreiundzwanzigtausend. Die Übersetzung bewahrt diese Angabe und löst die Spannung zum alttestamentlichen Bericht nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sexuelle Unmoral“ ist verständlich und breit genug für πορνεύω; die Wiederholung ist bewusst erhalten. „Fielen“ wahrt das Bild des griechischen Textes, während die Fußnote die idiomatische Todesbedeutung erklärt.
