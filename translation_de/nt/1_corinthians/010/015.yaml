  source_fidelity: 'Der Sinn des griechischen Textes ist weitgehend korrekt wiedergegeben: Paulus redet die Korinther als urteilsfähige Menschen an und fordert sie mit betontem ὑμεῖς zur eigenen Beurteilung auf. Die Verbindung „zu euch als verständigen Menschen“ ist jedoch syntaktisch weniger eindeutig als die griechische Anredeform und kann im Deutschen unnötig nahelegen, Paulus rede in der Rolle eines verständigen Menschen. „wie zu verständigen Menschen“ gibt die adressierende Vergleichsform ὡς ... λέγω klarer wieder.'
