  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: de
  text: Ich spreche zu euch wie zu verständigen Menschen[a]. Beurteilt selbst, was ich sage.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „klugen Menschen“ oder „besonnenen Menschen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder mit stärkerer Wiedergabe des betonten Pronomens: „Ihr selbst sollt beurteilen, was ich sage.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: als
  rationale: ὡς kennzeichnet hier, in welcher Eigenschaft Paulus die Angesprochenen anspricht; die natürliche deutsche Wendung lautet „als verständige Menschen“.
- source_word: φρονίμοις
  choice: verständigen Menschen
  rationale: φρόνιμος bezeichnet praktische Einsicht, Besonnenheit und Urteilsfähigkeit. „Verständig“ bewahrt diesen Sinn in würdigem, heutigem Deutsch, ohne die stärkere Wertung von „weise“ festzuschreiben.
- source_word: λέγω
  choice: Ich rede
  rationale: λέγω kann „sagen“ oder „reden“ bedeuten. „Ich rede zu euch als …“ gibt die Anrede idiomatisch wieder und vermeidet die schwerfällige Wiederholung von „sagen“.
- source_word: κρίνατε
  choice: Beurteilt
  rationale: Der Aorist-Imperativ fordert zu einer prüfenden Bewertung auf. „Beurteilt“ ist im Deutschen in diesem Zusammenhang natürlicher als „richtet“, ohne den evaluativen Gehalt von κρίνω abzuschwächen.
- source_word: ὑμεῖς
  choice: selbst
  rationale: 'Das ausdrücklich gesetzte Pronomen ist emphatisch. „Selbst“ gibt den Nachdruck knapp wieder: Die Angesprochenen sollen ihr eigenes Urteil bilden.'
- source_word: ὅ
  choice: was
  rationale: Das substantivierte Neutrum des Relativpronomens ist als Gegenstand des Sagens natürlich mit „was“ wiederzugeben.
- source_word: φημι
  choice: ich sage
  rationale: φημί bedeutet hier „sagen/behaupten“. „Was ich sage“ ist präzise und idiomatisch.
theological_decisions:
- issue: Rhetorische Charakterisierung der Adressaten
  choice: Paulus spricht die Korinther als Menschen mit Urteilsvermögen an, ohne damit ihr gesamtes Verhalten gutzuheißen.
  alternative: Die Anrede könnte ironisch gemeint sein oder sie ausdrücklich als weise loben.
  rationale: Der Wortlaut lädt sie zur Prüfung seiner Aussage ein. „Verständige Menschen“ hält die positive, aber maßvolle Charakterisierung fest und entscheidet weder für Ironie noch für ein uneingeschränktes Lob.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Ton. Die knappe rhetorische Aufforderung und die Betonung des eigenen Urteils der Adressaten bleiben erhalten.
