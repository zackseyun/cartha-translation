  terminology: „Verständige Menschen“ trifft φρόνιμοις angemessen als praktische Einsicht und Urteilsfähigkeit, ohne die mögliche rhetorische oder ironische Nuance festzulegen. „Beurteilt“ bewahrt den evaluativen Charakter von κρίνατε. Die Fußnoten sind inhaltlich passend; die zweite Alternative wird sprachlich geglättet.
