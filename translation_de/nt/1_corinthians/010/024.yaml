  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: de
  text: Niemand soll das Seine suchen, sondern das des anderen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: „Niemand soll das eigene Wohl suchen, sondern das Wohl des anderen.“'
    reason: Die griechischen Wendungen sind elliptisch und lassen offen, ob besonders Wohl, Nutzen, Vorteil oder allgemein die eigenen beziehungsweise fremden Belange gemeint sind.
lexical_decisions:
- source_word: μηδεὶς
  choice: Niemand soll
  rationale: Gibt die allgemeine Verneinung zusammen mit dem Imperativ ζητείτω als natürliches deutsches Verbot wieder.
- source_word: ζητείτω
  choice: suchen
  rationale: Bewahrt die schlichte und breite Bedeutung von ζητέω; im Zusammenhang geht es darum, worauf jemand sein Handeln ausrichtet.
- source_word: τὸ ἑαυτοῦ
  choice: das Seine
  rationale: Die substantivierte Wendung erhält die Ellipse des Griechischen und ist im Deutschen verständlich, ohne sie vorschnell auf Nutzen, Besitz oder Wohlergehen festzulegen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung bildet „sondern“ im Deutschen den klaren adversativen Gegensatz ab.
- source_word: τὸ τοῦ ἑτέρου
  choice: das des anderen
  rationale: Entspricht der parallelen elliptischen Formulierung und bezeichnet im Gegensatz zum eigenen Belang den des jeweils anderen Menschen.
theological_decisions:
- issue: Ergänzung des unausgesprochenen Bezugs in τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: Die Ellipse als „das Seine … das des anderen“ bewahren
  alternative: „das eigene Wohl … das Wohl des anderen“ oder „den eigenen Vorteil … den des anderen“
  rationale: Der Kontext legt Wohl beziehungsweise Nutzen nahe, doch der griechische Wortlaut nennt keinen bestimmten Gegenstand. Die offene deutsche Form wahrt daher die inhaltliche Breite und die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und die Ellipse des griechischen Textes bleiben erhalten; „das Seine“ ist leicht gehoben, aber allgemein verständlich.
