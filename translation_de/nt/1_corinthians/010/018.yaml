  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: de
  text: 'Betrachtet Israel nach dem Fleisch[a]: Haben nicht diejenigen, die von den Opfern essen, Anteil am Altar[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Israel seiner leiblichen beziehungsweise natürlichen Abstammung nach; auch: das leibliche Israel.'
