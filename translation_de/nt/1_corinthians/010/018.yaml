  - marker: b
    text: 'Auch: stehen sie nicht in Gemeinschaft mit dem Altar?'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Betrachtet
  rationale: Der Imperativ fordert hier zu aufmerksamer, nachdenklicher Betrachtung im Rahmen von Paulus’ Argumentation auf; „Betrachtet“ ist natürlicher als ein rein visuelles „Seht“.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: Israel nach dem Fleisch
  rationale: Die Wiedergabe bewahrt Paulus’ konkrete und theologisch spannungsreiche Formulierung. Im Zusammenhang bezeichnet sie Israel hinsichtlich leiblicher beziehungsweise natürlicher Abstammung, ohne darüber hinausgehende Aussagen über Israel und die Gemeinde festzulegen.
- source_word: οὐχ ... εἰσίν;
  choice: Haben nicht ...?
  rationale: Die mit οὐχ eingeleitete rhetorische Frage erwartet eine bejahende Antwort; die deutsche Wortstellung gibt dies idiomatisch wieder.
- source_word: οἱ ἐσθίοντες
  choice: diejenigen, die ... essen
  rationale: Gibt das substantivierte Präsenspartizip natürlich wieder und bewahrt den konkreten Vorgang des Essens.
- source_word: τὰς θυσίας
  choice: die Opfer
  rationale: „Opfer“ ist die direkte, im kultischen Zusammenhang klare und geläufige Entsprechung.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: Anteil am Altar
  rationale: „Anteil haben an“ gibt κοινωνός mit Genitiv im Deutschen natürlich wieder und bezeichnet wirkliche Beteiligung an der durch den Altar dargestellten Opfergemeinschaft, ohne den Altar selbst als bloßen Gegenstand des Besitzes zu behandeln.
theological_decisions:
- issue: Bedeutung von „Israel nach dem Fleisch“
  choice: Die paulinische Formulierung bleibt im Haupttext erhalten; im Kontext verweist sie auf Israel nach leiblicher beziehungsweise natürlicher Abstammung.
  alternative: „das leibliche Israel“ oder „Israel seiner natürlichen Abstammung nach“
  rationale: Die wörtlichere Form bewahrt die Spannung des Ausdrucks und vermeidet es, umfassendere theologische Fragen zum Verhältnis Israels und der Gemeinde in der Übersetzung vorzuentscheiden.
- issue: Art der Gemeinschaft mit dem Altar
  choice: „Anteil am Altar“
  alternative: „Gemeinschaft mit dem Altar“ oder „Teilhaber des Altars“
  rationale: Paulus beschreibt eine reale kultische Beteiligung, die durch das Essen von den Opfern entsteht. „Anteil am Altar“ ist zugleich quellennah und im Deutschen verständlich, ohne die genaue Art dieser Beteiligung über den Text hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt deutlich, und die paulinische Wendung „nach dem Fleisch“ wird trotz ihrer leichten Fremdheit beibehalten und durch eine Fußnote erschlossen.
