  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: de
  text: Weil es ein Brot gibt, sind wir, die vielen, ein Leib; denn wir alle haben Anteil an dem einen Brot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aussage ein und gibt den erklärend-kausalen Zusammenhang im Deutschen natürlich wieder.
- source_word: εἷς ἄρτος
  choice: ein Brot
  rationale: Bewahrt sowohl den konkreten Bezug auf das geteilte Brot als auch den im Zusammenhang anklingenden Bezug zum Mahl; die mögliche Bedeutung „ein Brotlaib“ wird in der Fußnote genannt.
- source_word: ἓν σῶμα
  choice: ein Leib
  rationale: „Leib“ ist in diesem paulinischen Zusammenhang die geläufige, theologisch dichte Wiedergabe von σῶμα und wahrt den Bezug zwischen gemeinschaftlicher Einheit und dem Mahl.
- source_word: οἱ πολλοί
  choice: wir, die vielen
  rationale: Erhält den betonten Gegensatz zwischen den vielen Personen und dem einen Leib, ohne die Wendung zu einer bloßen Mengenangabe abzuschwächen.
- source_word: ἐσμεν
  choice: sind
  rationale: Gibt die Kopula unmittelbar wieder und verbindet „wir, die vielen“ mit „ein Leib“.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet den zweiten Satzteil als Begründung der Aussage, dass die vielen ein Leib sind.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt die ausdrückliche Einbeziehung der gesamten angesprochenen Gemeinschaft.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: an dem einen Brot
  rationale: In Verbindung mit μετέχομεν bezeichnet ἐκ die gemeinsame Teilhabe aus derselben Quelle; die idiomatische deutsche Konstruktion „Anteil haben an“ gibt dies klar wieder.
- source_word: μετέχομεν
  choice: haben Anteil
  rationale: Drückt wirkliche gemeinsame Teilhabe aus, bleibt in modernem Deutsch natürlich und legt keine spätere konfessionelle Deutung fest.
theological_decisions:
- issue: Verhältnis zwischen dem einen Brot und dem einen Leib
  choice: Die Formulierung bewahrt die von Paulus gesetzte Verbindung zwischen der gemeinsamen Teilhabe am Brot und der Einheit der Glaubenden.
  alternative: Man könnte die Aussage entweder stärker symbolisch als Darstellung bereits bestehender Einheit oder stärker sakramental als durch das Brot bewirkte Gemeinschaft auslegen.
  rationale: Der griechische Text verbindet beides kausal, bestimmt aber nicht mit der Präzision späterer Lehrsysteme, wie diese Beziehung ontologisch zu erklären ist. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wir, die vielen“ erhält die rhetorische Gegenüberstellung von Vielheit und Einheit; „Anteil haben“ ist verständlich und wahrt die sachliche sowie theologische Dichte des griechischen Ausdrucks.
