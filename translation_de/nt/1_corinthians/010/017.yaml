review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die zentrale Gegenüberstellung von dem einen Brot, den vielen und dem einen Leib sowie die begründende zweite Satzhälfte grundsätzlich zutreffend wieder. Die einleitende Fassung „Denn ein Brot ist es:“ bildet jedoch die elliptische griechische Konstruktion nicht idiomatisch ab und klingt im modernen Deutschen unnötig künstlich.
  naturalness: „Ein Brot ist es“ ist kein natürlicher deutscher Satzanschluss. „Weil es ein Brot gibt“ löst die griechische Ellipse mit einer im Deutschen erforderlichen verbalen Form auf und macht den Kausalzusammenhang klar. „Wir, die vielen“ kann als bewusst markierte rhetorische Gegenüberstellung stehen bleiben.
  terminology: „Leib“ ist für σώμα im paulinischen Kontext angemessen und bewahrt die dichte, nicht konfessionell festgelegte Aussage. „Anteil haben an“ ist eine natürliche und semantisch passende Wiedergabe von μετέχειν. Die Fußnote zu „Brotlaib“ ist sachlich und erhält die lexikalische Alternative.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe des einleitenden Satzteils
    rationale: „Denn ein Brot ist es:“ ist im modernen Standarddeutsch syntaktisch und stilistisch holprig. Der griechische elliptische Nominalsatz verlangt im Deutschen eine natürliche Auflösung, ohne dass dadurch eine theologische Deutung hinzugefügt wird.
  revised_text: Weil es ein Brot gibt, sind wir, die vielen, ein Leib; denn wir alle haben Anteil an dem einen Brot.
  revised_footnotes:
  - marker: a
    text: 'Oder: „ein Brotlaib“; ebenso am Ende des Verses. Das griechische Wort ἄρτος kann Brot allgemein oder einen einzelnen Brotlaib bezeichnen. „Brotlaib“ hebt das Bild hervor, dass viele von ein und demselben Brot essen.'
