source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: de
  text: 'Nein, vielmehr: Was sie opfern, opfern sie Dämonen und nicht Gott. Ich will aber nicht, dass ihr Gemeinschaft mit Dämonen habt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass ihr Teilhaber der Dämonen werdet“; gemeint ist Teilhabe beziehungsweise Gemeinschaft mit Dämonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Nein, sondern
  rationale: Die Wendung korrigiert im Zusammenhang ein mögliches Missverständnis aus dem vorhergehenden Vers. „Nein, sondern“ gibt diesen adversativ-korrigierenden Sinn im Deutschen natürlich wieder.
- source_word: ἃ θύουσιν
  choice: was sie opfern
  rationale: Das sächliche Relativpronomen bezeichnet allgemein die Opfergaben, ohne sie näher festzulegen.
- source_word: θύουσιν
  choice: opfern
  rationale: Das Verb hat hier eindeutig kultischen Sinn; „opfern“ ist knapp und präzise.
- source_word: δαιμονίοις
  choice: Dämonen
  rationale: δαιμόνιον bezeichnet im neutestamentlichen Sprachgebrauch dämonische Wesen, nicht wertneutral niedere Gottheiten.
- source_word: καὶ οὐ θεῷ
  choice: und nicht Gott
  rationale: Der Kontext stellt die Dämonen dem einen wahren Gott gegenüber; der artikellose Dativ wird daher bestimmt wiedergegeben.
- source_word: οὐ θέλω δὲ
  choice: Ich will aber nicht
  rationale: δέ führt den persönlichen Einspruch des Paulus mit leichter Gegenüberstellung weiter; „aber“ bewahrt diese Nuance.
- source_word: κοινωνοὺς
  choice: Teilhaber
  rationale: κοινωνός bezeichnet Personen, die an etwas teilhaben oder Gemeinschaft damit haben. „Teilhaber“ wahrt den realen Beteiligungscharakter und den Bezug zur Argumentation in den Versen 16–18.
- source_word: τῶν δαιμονίων
  choice: der Dämonen
  rationale: Der Genitiv bei κοινωνός lässt sich formal als „Teilhaber der Dämonen“ wiedergeben. Diese Formulierung bewahrt die im Griechischen offene Spannung zwischen Teilhabe und Gemeinschaft; idiomatisches „Gemeinschaft mit Dämonen“ ist als Alternative vermerkt.
- source_word: γίνεσθαι
  choice: werdet
  rationale: γίνομαι bezeichnet das Eintreten in einen Zustand. „werdet“ bewahrt diesen dynamischen Aspekt.
theological_decisions:
- issue: Wesen heidnischer Opfer
  choice: Die Opfer gelten Dämonen und nicht Gott.
  alternative: Die Aussage bezeichnet nur rhetorisch die soziale Bedeutung heidnischer Opfermahlzeiten oder verwendet „Dämonen“ rein metaphorisch.
  rationale: Der ausdrückliche Gegensatz „Dämonen und nicht Gott“ wird ungeschwächt wiedergegeben, ohne über die Aussage des Verses hinauszugehen.
- issue: Bedeutung von κοινωνοὺς τῶν δαιμονίων
  choice: Reale Teilhabe beziehungsweise Gemeinschaft mit Dämonen
  alternative: Bloß gesellschaftlicher Umgang mit Götzenverehrern oder uneingeschränkte kultische Gefolgschaft gegenüber Dämonen
  rationale: Der unmittelbare Kontext spricht von wirklicher Teilhabe, doch der Text setzt diese nicht ausdrücklich mit vollständiger Gefolgschaft gleich. „Teilhaber“ wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „opfern“ bildet die griechische Struktur ab und unterstreicht den Gegensatz. „Teilhaber“ ist bewusst etwas gehobener, bleibt aber allgemein verständlich; die Fußnote nennt natürlichere Alternativen.
