id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: de
  text: Denn ich will nicht, dass euch unbekannt ist, Brüder und Schwestern,[a] dass unsere Väter alle unter der Wolke waren und alle durch das Meer hindurchzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brüder«; das griechische Wort kann hier die ganze Gemeinde, Männer und Frauen, anreden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: ich will nicht, dass euch unbekannt ist
  rationale: Bewahrt die verneinte griechische Formulierung und gibt die paulinische Wendung in natürlichem, würdigem Deutsch wieder, ohne das härtere »unwissend sein« zu verwenden.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den begründenden beziehungsweise erläuternden Anschluss an den vorausgehenden Gedankengang.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline griechische Plural kann eine gemischte Gemeinde als Ganze anreden. Die ausgeschriebene deutsche Form macht den kontextuell eingeschlossenen Personenkreis natürlich und unmissverständlich sichtbar; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Erhält die familiäre und heilsgeschichtliche Sprache, mit der Paulus die Gemeinde in Israels Geschichte einbezieht; »Vorfahren« wäre allgemeiner.
- source_word: πάντες
  choice: alle
  rationale: Die zweimalige Wiederholung wird bewahrt, da sie für den rhetorischen Nachdruck des Abschnitts wesentlich ist.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: alle unter der Wolke waren
  rationale: Gibt die räumliche Formulierung direkt wieder und erhält die Anspielung auf die Wolke beim Auszug.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: alle durch das Meer hindurchzogen
  rationale: Drückt die Bewegung durch das Meer aus; »hindurchzogen« ist präzise und bewahrt das Bild des Exodus.
theological_decisions:
- issue: Anrede ἀδελφοί an eine gemischte Gemeinde
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Die Anrede gilt im Kontext der gesamten korinthischen Gemeinde. Die inklusive Bedeutung wird im Haupttext natürlich wiedergegeben, während die grammatisch wörtliche Form in der Fußnote erhalten bleibt.
- issue: Gemeinschaftliche Identifikation der Gemeinde mit Israel in οἱ πατέρες ἡμῶν
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die familiäre Formulierung lässt die von Paulus gesetzte Verbindung mit Israels Geschichte stehen und schwächt sie nicht zu einer rein genealogischen Bezeichnung ab.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelstil. Die Wiederholung von »alle« und die negative Formulierung des griechischen Ausgangstextes bleiben erhalten.
