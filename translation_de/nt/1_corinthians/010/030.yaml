translation:
  language: de
  text: Wenn ich mit Dankbarkeit daran teilhabe[a], warum werde ich wegen dessen verunglimpft, wofür ich danke?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ich durch Gnade daran teilhabe, warum werde ich wegen dessen verunglimpft, wofür ich danke?“ Das griechische χάριτι kann „durch Gnade“ bedeuten; wegen des folgenden „ich danke“ verstehen es hier jedoch viele im Sinn von „mit Dankbarkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: mit Dankbarkeit
  rationale: Der Dativ bezeichnet hier am wahrscheinlichsten die dankbare Haltung, die das Essen begleitet; dafür spricht besonders das folgende εὐχαριστῶ. Die echte Alternative „durch Gnade“ wird in der Fußnote bewahrt.
- source_word: μετέχω
  choice: daran teilhabe
  rationale: Im Zusammenhang geht es um das Essen der betreffenden Speise. „Daran teilhaben“ ist gegenwärtiges, würdiges Deutsch und bewahrt den Bezug, ohne das im Griechischen nicht ausdrücklich wiederholte Objekt einzusetzen.
- source_word: βλασφημοῦμαι
  choice: werde ich … verurteilt
  rationale: Bei einem Menschen als Ziel bezeichnet das Verb hier abwertendes, anklagendes Reden. „Verurteilt“ gibt den öffentlichen Tadel idiomatisch wieder, ohne den für Rede gegen Gott üblichen deutschen Ausdruck „gelästert“ zu verwenden.
- source_word: ὑπὲρ οὗ
  choice: wegen etwas, wofür
  rationale: Die Wendung nennt den Anlass beziehungsweise Grund des Tadels. Die deutsche Formulierung unterscheidet diesen kausalen Bezug klar vom Gegenstand des Dankens.
- source_word: εὐχαριστῶ
  choice: ich danke
  rationale: Die schlichte Wiedergabe lässt den im Griechischen nicht ausdrücklich genannten Empfänger des Dankes unausgesprochen.
- source_word: τί
  choice: warum
  rationale: In der rhetorischen Frage hat τί die idiomatische Bedeutung „warum?“.
- source_word: ἐγὼ … ἐγὼ
  choice: ich … ich
  rationale: Die beiden ausdrücklichen griechischen Pronomen unterstreichen die Person des Sprechers. Im Deutschen bleibt die Wiederholung erhalten, ohne künstliche Hervorhebung.
theological_decisions:
- issue: Bedeutung von χάριτι beim Essen und Danken
  choice: mit Dankbarkeit
  alternative: durch Gnade
  rationale: Der unmittelbare Zusammenhang mit εὐχαριστῶ legt Dankbarkeit als begleitende Haltung nahe. Da „durch Gnade“ sprachlich möglich bleibt, wird diese Lesart nicht ausgeschlossen, sondern als Fußnotenalternative genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Formulierung wahrt die rhetorische Frage, den Dankbezug und die lexikalische Mehrdeutigkeit von χάριτι.
