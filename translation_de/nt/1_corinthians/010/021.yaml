id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: de
  text: Ihr könnt nicht den Kelch des Herrn und den Kelch der Dämonen trinken; ihr könnt nicht am Tisch des Herrn und am Tisch der Dämonen teilhaben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: ihr könnt nicht
  rationale: Gibt die wiederholte, kategorische Unvereinbarkeit direkt und idiomatisch wieder, ohne sie zu einer bloßen Aufforderung abzuschwächen.
- source_word: ποτήριον
  choice: Kelch
  rationale: „Kelch“ ist im biblisch-kultischen Zusammenhang natürlich und bewahrt die feierliche sowie gemeinschaftsbezogene Bildsprache.
- source_word: κυρίου
  choice: des Herrn
  rationale: Die Genitivkonstruktion wird parallel zu „der Dämonen“ wiedergegeben und erhält den rhythmischen Aufbau.
- source_word: πίνειν
  choice: trinken
  rationale: Entspricht dem Infinitiv schlicht und idiomatisch; eine Verlaufsbedeutung ist nicht erforderlich.
- source_word: δαιμονίων
  choice: Dämonen
  rationale: Die direkte, transparente Entsprechung bewahrt den personal-geistlichen Sinn des griechischen Ausdrucks.
- source_word: τραπέζης
  choice: Tisch
  rationale: Bewahrt die kultische und gemeinschaftliche Bildsprache, ohne durch „Altartisch“ eine nicht ausdrücklich genannte Deutung einzutragen.
- source_word: μετέχειν
  choice: teilhaben
  rationale: Bezeichnet wirkliche Beteiligung beziehungsweise Anteilnahme und ist im modernen Standarddeutsch zugleich verständlich und würdig.
- source_word: καὶ
  choice: und
  rationale: Erhält die parallele Struktur und den rhetorischen Nachdruck des griechischen Satzes.
theological_decisions:
- issue: Art der Verneinung im Verhältnis zwischen dem Mahl des Herrn und heidnischem Kult
  choice: Kategorische Unvereinbarkeit der Teilnahme am Tisch des Herrn mit der Teilnahme an dämonischem Kult
  alternative: Bloße rhetorische Warnung oder nachdrückliche Abratung
  rationale: Das zweimalige οὐ δύνασθε in streng parallelen Sätzen bezeichnet eine grundsätzliche Unvereinbarkeit. „Ihr könnt nicht“ bewahrt diese Spannung, ohne sie durch zusätzliche Lehrsätze auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. „Kelch“ wahrt den kultisch-biblischen Ton; „teilhaben“ ist genauer und natürlicher als das heute altertümlich wirkende „teilnehmen an/partizipieren“ oder „genießen“.
