source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: de
  text: Doch an den meisten von ihnen hatte Gott kein Gefallen; denn sie wurden in der Wüste hingestreckt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie lagen in der Wüste ausgestreckt«; auch: »wurden in der Wüste ausgestreut«.'
    reason: Gibt die bildhafte Bedeutung von κατεστρώθησαν wieder, ohne die Art des tödlichen Gerichts näher zu bestimmen.
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Markiert den starken Gegensatz zu den Vorrechten Israels in den vorangehenden Versen und klingt im Deutschen natürlich und nachdrücklich.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: an den meisten von ihnen … kein Gefallen
  rationale: Gibt die Verbindung von εὐδοκέω mit ἐν idiomatisch wieder und bewahrt zugleich die quantitative Aussage »die meisten«.
- source_word: ηὐδόκησεν
  choice: hatte … kein Gefallen
  rationale: Entspricht der Bedeutung »Gefallen haben, Wohlgefallen finden« und bewahrt die persönliche Bewertung durch Gott.
- source_word: ὁ θεός
  choice: Gott
  rationale: Direkte und sachgemäße Wiedergabe des nominativischen Subjekts.
- source_word: κατεστρώθησαν
  choice: wurden … niedergestreckt
  rationale: Vermittelt im Kontext Tod und Gericht, bewahrt aber das anschauliche Bild des Niederwerfens besser als eine bloße Aussage, dass sie starben.
- source_word: γὰρ
  choice: denn
  rationale: Leitet die Begründung beziehungsweise den sichtbaren Beleg für Gottes Missfallen ein.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: Ist die geläufige deutsche Bezeichnung für den Schauplatz der Wüstenwanderung und bewahrt den biblischen Bezug.
theological_decisions:
- issue: Art des in κατεστρώθησαν bezeichneten Gerichts
  choice: Das Verb wird als tödliches Niedergestrecktwerden in der Wüste wiedergegeben.
  alternative: 'Neutraler: »sie wurden in der Wüste dahingestreckt« oder bildhafter: »sie lagen in der Wüste verstreut«.'
  rationale: Der Kontext stellt das Geschehen als Folge von Gottes Missfallen und als Warnung dar. »Niedergestreckt« lässt diesen Gerichtscharakter erkennen, ohne ausdrücklich zu ergänzen, wer sie niederschlug oder auf welche Weise sie starben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung hält Gott als handelndes beziehungsweise wertendes Subjekt deutlich fest; das Semikolon bewahrt den engen begründenden Zusammenhang der beiden Satzteile.
