  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: de
  text: Oder reizen wir den Herrn zur Eifersucht? Sind wir etwa stärker als er?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: zur Eifersucht reizen
  rationale: Gibt die kausative Bedeutung des Verbs wieder und bewahrt den alttestamentlich geprägten Gedanken, Gottes Eifersucht durch Untreue herauszufordern.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Entspricht der üblichen neutestamentlichen Wiedergabe von κύριος und lässt den Bezug im unmittelbaren Kontext unverengt bestehen.
- source_word: μὴ
  choice: etwa
  rationale: Kennzeichnet in der rhetorischen Frage die erwartete verneinende Antwort natürlich im Deutschen.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: stärker als er
  rationale: Gibt den Komparativ mit dem Genitiv des Vergleichs direkt und verständlich wieder.
theological_decisions:
- issue: Göttliche Eifersucht
  choice: Eifersucht
  alternative: Zorn
  rationale: Der Quelltext nennt mit παραζηλόω ausdrücklich das Reizen zur Eifersucht; eine Wiedergabe mit „Zorn“ würde das Bild verengen und die Anspielung auf Israels Bundesuntreue abschwächen.
- issue: Bezug von „Herr“
  choice: Herr ohne erklärenden Zusatz
  alternative: Jesus oder Gott ausdrücklich benennen
  rationale: κύριος wird übersetzt, ohne eine im Satz selbst nicht ausdrücklich aufgelöste Referenz dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei knappen rhetorischen Fragen und die erwartete verneinende Antwort der zweiten Frage bleiben erhalten.
