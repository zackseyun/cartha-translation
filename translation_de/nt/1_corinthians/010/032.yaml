  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: de
  text: Gebt weder Juden noch Griechen[a] noch der Gemeinde Gottes Anlass zum Anstoß.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Griechen“ bezeichnet hier wahrscheinlich allgemein Nichtjuden im damaligen Umfeld des Paulus; im griechischen Text steht ausdrücklich „Griechen“.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „Verhaltet euch gegenüber … so, dass ihr keinen Anstoß erregt“ oder „Seid … ohne Anstoß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: keinen Anlass zum Anstoß geben
  rationale: Das Adjektiv bezeichnet hier ein Verhalten, das anderen keinen Anstoß bereitet oder sie nicht zu Fall bringt. Die verbale deutsche Wendung gibt den relationalen Sinn im Zusammenhang natürlich wieder.
- source_word: γίνεσθε
  choice: Gebt
  rationale: Der Imperativ von γίνομαι bildet zusammen mit ἀπρόσκοποι eine fortdauernde Aufforderung. Im Deutschen wird die Aussage idiomatisch als Handlungsaufforderung wiedergegeben.
- source_word: Ἰουδαίοις
  choice: Juden
  rationale: Gemeint ist hier das jüdische Volk als ethnisch-religiöse Gruppe, nicht lediglich die Bevölkerung Judäas.
- source_word: Ἕλλησιν
  choice: Griechen
  rationale: Die konkrete Bezeichnung des griechischen Textes bleibt erhalten, obwohl sie in diesem Zusammenhang wahrscheinlich weiter gefasst Nichtjuden bezeichnet.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: der Gemeinde Gottes
  rationale: Gemeinde ist im deutschen paulinischen Sprachgebrauch eine natürliche Bezeichnung für die Gemeinschaft der Glaubenden; der Genitiv wird unmittelbar als Gottes wiedergegeben.
theological_decisions:
- issue: Zuordnung der genannten Gruppen in der ethischen Aufforderung
  choice: Juden, Griechen und die Gemeinde Gottes werden als drei ausdrücklich genannte Bezugsgruppen bewahrt.
  alternative: Griechen könnte verallgemeinernd als Nichtjuden wiedergegeben werden; die Aufforderung könnte vorwiegend als missionarische Strategie verstanden werden.
  rationale: Der Vers nennt drei Gruppen, ohne selbst das Verhältnis zwischen missionarischer Rücksicht und allgemeinem ethischem Grundsatz abschließend zu bestimmen. Die Übersetzung löst diese Spannung nicht auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die idiomatische Aufforderung vermeidet das im Deutschen missverständliche „Seid anstößig“, bewahrt aber den Gedanken, anderen keinen Anstoß zu bereiten.
