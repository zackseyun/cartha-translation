source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: de
  text: Murrt auch nicht, wie einige von ihnen murrten und durch den Verderber[a] umkamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch den vernichtenden Engel«. Im Griechischen steht »der Verderber«; damit kann auf den Vollstrecker des Gerichts während Israels Wüstenzeit angespielt sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: auch nicht
  rationale: Im Zusammenhang einer Reihe von Warnungen schließt μηδέ dieses Verbot an die vorhergehenden an; „auch nicht“ gibt diese verbindende Kraft im Deutschen natürlich wieder.
- source_word: γογγύζετε
  choice: murrt
  rationale: „Murren“ bezeichnet unzufriedenes, aufbegehrendes Klagen und bewahrt den biblischen Anklang an Israels Verhalten in der Wüste, ohne unverständlich zu sein.
- source_word: καθάπερ
  choice: wie
  rationale: „Wie“ führt den warnenden Vergleich idiomatisch und klar ein; ein verstärkendes „genauso wie“ wäre möglich, ist hier aber nicht nötig.
- source_word: τινὲς αὐτῶν
  choice: einige von ihnen
  rationale: Die Formulierung gibt den partitiven Ausdruck direkt wieder und verweist auf einen Teil der zuvor erwähnten Israeliten.
- source_word: ἐγόγγυσαν
  choice: murrten
  rationale: Die Wiederholung desselben deutschen Verbs bewahrt die bewusste lexikalische Verbindung zum vorangehenden Verbot.
- source_word: ἀπώλοντο
  choice: umkamen
  rationale: „Umkamen“ gibt den Untergang der Betroffenen natürlich wieder; die anschließende Agensangabe „durch den Verderber“ macht die verursachende Einwirkung deutlich.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: durch den Verderber
  rationale: Der griechische Text nennt substantivisch „den Verderber“, ohne ihn ausdrücklich als Engel zu identifizieren. „Durch“ bezeichnet im Deutschen bei einem Geschehen dieser Art den Urheber idiomatisch.
theological_decisions:
- issue: Identität von ὁ ὀλοθρευτής
  choice: der Verderber
  alternative: der vernichtende Engel
  rationale: Der Haupttext bewahrt die unbestimmte Bezeichnung des griechischen Textes und legt die Gestalt nicht ausdrücklich als Engel fest. Die verbreitete Deutung wird nur in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Murren“ ist bewusst gewählt, weil es den biblischen Wüstenkontext prägnanter wiedergibt als das allgemeinere „sich beschweren“. Die Satzstruktur bleibt knapp und warnend.
