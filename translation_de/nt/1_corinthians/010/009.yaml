  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: de
  text: Lasst uns auch nicht den Messias[a] auf die Probe stellen, wie einige von ihnen ihn auf die Probe stellten und durch die Schlangen umkamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »den Herrn« statt »den Messias«.
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Auch wir wollen … nicht
  rationale: Führt die Reihe der Warnungen fort und gibt den auffordernden Konjunktiv in natürlichem Deutsch wieder.
- source_word: ἐκπειράζωμεν
  choice: auf die Probe stellen
  rationale: Bezeichnet hier ein unangemessenes Herausfordern oder Erproben; »versuchen« wäre bei einer Person als Objekt missverständlich.
- source_word: τὸν Χριστόν
  choice: den Messias
  rationale: Χριστός wird hier als Titel verstanden und daher mit »Messias« übersetzt.
- source_word: καθώς τινες αὐτῶν ἐπείρασαν
  choice: wie einige von ihnen es taten
  rationale: Die elliptische Form vermeidet eine schwerfällige unmittelbare Wiederholung; »es« nimmt das Auf-die-Probe-Stellen auf, ohne das im Griechischen nur implizite Objekt eigens festzulegen.
- source_word: ὑπὸ τῶν ὄφεων
  choice: durch die Schlangen
  rationale: »Schlangen« ist die natürliche moderne Entsprechung für ὄφεις; »durch« bezeichnet hier die Ursache ihres Todes.
- source_word: ἀπώλλυντο
  choice: kamen um
  rationale: Gibt das tödliche Zugrundegehen idiomatisch wieder. Das griechische Imperfekt betrachtet das Geschehen in seinem Verlauf; »dann« bindet die Folge natürlich an das vorausgehende Handeln an.
theological_decisions:
- issue: Referent und Textform von τὸν Χριστόν
  choice: den Messias
  alternative: den Herrn
  rationale: Der SBLGNT-Haupttext liest Χριστόν und verbindet damit den Messias mit dem, den Israel in der Wüste auf die Probe stellte. Die bedeutsame Variante κύριον wird in einer Fußnote genannt, ohne die Spannung des Haupttextes aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist für die öffentliche Lesung geeignet; »auf die Probe stellen« bewahrt den negativen Sinn des Verbs, und »umkamen« vermeidet ein unnötig abstraktes »vernichtet wurden«.
