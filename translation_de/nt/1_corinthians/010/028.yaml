  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: de
  text: 'Wenn aber jemand zu euch sagt: »Das ist als Opfer dargebracht worden«[a], dann esst nicht davon – aus Rücksicht auf den, der euch darauf hingewiesen hat, und auf das Gewissen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das ist Opferfleisch.« Das griechische Adjektiv bezeichnet etwas, das als Opfer dargebracht wurde.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Gewissen des anderen, nicht das eigene; siehe den folgenden Vers.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Wenn aber jemand zu euch sagt
  rationale: ἐὰν mit dem Aorist Konjunktiv bezeichnet einen möglichen Fall; τις bleibt mit »jemand« unbestimmt, und δέ markiert durch »aber« den Gegensatz zum vorausgehenden Szenario.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Das ist als Opfer dargebracht worden
  rationale: ἱερόθυτος bezeichnet etwas, das als Opfer dargebracht wurde, im Kontext wohl Fleisch. Die Formulierung gibt den kultischen Bezug wieder, ohne »Götze« ausdrücklich in das hier verwendete Wort hineinzutragen.
- source_word: μὴ ἐσθίετε
  choice: dann esst nicht davon
  rationale: Der verneinte Präsensimperativ formuliert das Verbot. »Davon« nimmt im Deutschen natürlich auf die zuvor bezeichnete Speise Bezug.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: aus Rücksicht auf den, der euch darauf hingewiesen hat
  rationale: διά mit Akkusativ bezeichnet hier den Beweggrund beziehungsweise die Rücksicht auf eine Person. μηνύω bedeutet bekannt machen, mitteilen oder anzeigen; »darauf hingewiesen« ist in diesem Zusammenhang natürlich.
- source_word: καὶ τὴν συνείδησιν
  choice: und auf das Gewissen
  rationale: συνείδησις wird direkt mit »Gewissen« wiedergegeben. Die elliptische Verknüpfung wird im Deutschen durch die Fortführung von »aus Rücksicht auf« verständlich, ohne im Haupttext vorwegzunehmen, wessen Gewissen gemeint ist.
theological_decisions:
- issue: Wessen Gewissen mit τὴν συνείδησιν gemeint ist
  choice: Im Haupttext bleibt »das Gewissen« knapp und zunächst offen; eine Fußnote erläutert den Bezug auf das Gewissen des anderen.
  alternative: Das Gewissen des Essenden oder eine völlig unbestimmte allgemeine Gewissensinstanz.
  rationale: Vers 29 erklärt ausdrücklich, dass nicht das eigene, sondern das Gewissen des anderen gemeint ist. Die Übersetzung bewahrt dennoch den Gedankengang des Paulus, indem sie diese Klärung nicht vorzeitig in den Haupttext einbaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Als Opfer dargebracht« wahrt den kultischen Sinn, ohne das im unmittelbaren Ausdruck nicht enthaltene Wort »Götze« zu ergänzen. Der Gedankenstrich macht die Begründung des Verbots gut lesbar.
