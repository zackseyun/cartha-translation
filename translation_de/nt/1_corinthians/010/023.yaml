id: 1CO.10.23
reference: 1 Corinthians 10:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: de
  text: „Alles ist erlaubt“[a] – aber nicht alles ist förderlich. „Alles ist erlaubt“ – aber nicht alles baut auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ohne Anführungszeichen als Aussage des Paulus: Alles ist erlaubt. Die griechischen Handschriften markieren keine Zitate; vermutlich greift Paulus hier ein korinthisches Schlagwort auf und schränkt es ein. „Erlaubt“ kann auch mit „zulässig“ oder „rechtmäßig“ wiedergegeben werden.'
    reason: interpretive_and_lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Alles
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet umfassend „alles“. Die knappe Form wahrt den kategorischen, sloganartigen Klang und lässt sich im Deutschen natürlich wiederholen.
- source_word: ἔξεστιν
  choice: ist erlaubt
  rationale: Das Verb bezeichnet, was gestattet oder zulässig ist. „Ist erlaubt“ ist in modernem Deutsch klar und weniger juristisch gefärbt als „ist rechtmäßig“.
- source_word: ἀλλ’
  choice: aber
  rationale: Die einfache adversative Konjunktion wird durch „aber“ knapp und unmittelbar wiedergegeben.
- source_word: συμφέρει
  choice: ist förderlich
  rationale: Das Verb bezeichnet hier, was nützt oder zuträglich ist. „Förderlich“ bewahrt den ethischen und gemeinschaftlichen Sinn, ohne einen wirtschaftlichen Beiklang wie „einträglich“.
- source_word: οἰκοδομεῖ
  choice: baut auf
  rationale: Die Wiedergabe erhält das bei Paulus wichtige Bild des Bauens und ist zugleich in modernem Deutsch als Ausdruck für Stärkung verständlich. Die griechische Singularform passt idiomatisch zum sächlichen Plural; das deutsche „alles“ verlangt ebenfalls den Singular.
theological_decisions:
- issue: Ob Πάντα ἔξεστιν als korinthisches Schlagwort zu kennzeichnen ist
  choice: 'Die wiederholte Aussage steht in Anführungszeichen: „Alles ist erlaubt“.'
  alternative: Ohne Anführungszeichen als unmarkierte Aussage des Paulus wiedergeben.
  rationale: Der Zusammenhang und die wiederholte Form sprechen wahrscheinlich für ein von Paulus aufgegriffenes und eingeschränktes korinthisches Schlagwort. Da die griechischen Handschriften keine modernen Anführungszeichen bieten, bleibt dies eine interpretierende Zeichensetzung; die Fußnote macht die Unsicherheit sichtbar.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der parallele Satzbau und die zweimalige Wiederholung von „Alles ist erlaubt“ bewahren die rhetorische Prägnanz des Griechischen; „baut auf“ erhält die paulinische Baumetapher.
