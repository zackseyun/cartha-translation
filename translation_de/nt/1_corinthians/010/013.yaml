id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: de
  text: Keine Versuchung[a] hat euch ergriffen außer einer, wie sie Menschen begegnet.[b] Doch Gott ist treu. Er wird nicht zulassen, dass ihr über eure Kraft hinaus versucht werdet, sondern er wird mit der Versuchung auch den Ausweg[c] schaffen, sodass ihr sie ertragen könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Prüfung“ oder „Erprobung“ bedeuten; entsprechend kann „versucht werdet“ auch mit „geprüft werdet“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „außer einer menschlichen“; das heißt, einer Versuchung oder Prüfung, die zur menschlichen Erfahrung gehört.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Ausgang“ beziehungsweise „das Entkommen“. Gemeint ist Gottes Bereitstellung eines Weges, der das Ertragen ermöglicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: Versuchung / versucht werden
  rationale: Die Wortgruppe kann Versuchung, Prüfung oder Erprobung bezeichnen. Wegen der vorausgehenden Warnungen vor sündigem Begehren und Götzendienst steht hier die moralische Bedeutung im Vordergrund; die weitere Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: εἴληφεν
  choice: hat ergriffen
  rationale: Das Perfekt von λαμβάνω beschreibt eine Versuchung, die die Adressaten erfasst hat. „Hat ergriffen“ ist im Deutschen anschaulich und quellennah.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: außer einer, wie sie Menschen begegnet
  rationale: ἀνθρώπινος bezeichnet etwas Menschliches beziehungsweise zur menschlichen Erfahrung Gehörendes. Die Formulierung ist natürlich, inklusiv und vermeidet die mögliche Fehlannahme, jede Versuchung treffe alle Menschen gleichermaßen.
- source_word: πιστός
  choice: treu
  rationale: „Treu“ gibt Gottes Verlässlichkeit in diesem Zusammenhang prägnant und theologisch offen wieder.
- source_word: οὐκ ἐάσει
  choice: wird nicht zulassen
  rationale: ἐάω bedeutet erlauben oder zulassen. Die gewählte Formulierung ist klar und bewahrt Gottes aktive Begrenzung des Geschehens.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: über eure Kraft hinaus
  rationale: Die idiomatische deutsche Wendung drückt die durch δύνασθε bezeichnete Grenze des Vermögens aus, ohne bereits zu erläutern, worin dieses Vermögen besteht.
- source_word: ποιήσει
  choice: wird … schaffen
  rationale: ποιέω bedeutet hier machen oder herbeiführen. Zusammen mit ἔκβασις bezeichnet es Gottes aktives Bereiten eines Ausgangs.
- source_word: σὺν τῷ πειρασμῷ
  choice: mit der Versuchung
  rationale: 'σύν bezeichnet Begleitung: Gottes Bereitstellung geschieht zusammen mit der Versuchung und bedeutet nicht notwendig deren sofortige Beseitigung.'
- source_word: ἔκβασιν
  choice: den Ausweg
  rationale: ἔκβασις kann Ausweg, Ausgang oder Entkommen bezeichnen. „Ausweg“ ist verständlich und idiomatisch; der folgende Zwecksatz zeigt, dass dieser Weg zum standhaften Ertragen befähigt.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: sodass ihr sie ertragen könnt
  rationale: Der artikulierte Infinitiv kann Zweck oder Folge ausdrücken. „Sodass“ lässt diese leichte Spannung bestehen; das im Deutschen nötige Pronomen bezieht sich auf die Versuchung.
theological_decisions:
- issue: Bedeutung von πειρασμός im Verhältnis zu Gottes Treue
  choice: Im Haupttext steht „Versuchung“, während „Prüfung“ und „Erprobung“ als mögliche Wiedergaben genannt werden.
  alternative: Prüfung / Erprobung
  rationale: Der unmittelbare Kontext betont die Gefahr sündigen Handelns, doch das griechische Wort umfasst auch belastende Prüfungen. Die Übersetzung behauptet nicht, Gott verleite zum Bösen, sondern hält sich an die Aussage, dass er die Erfahrung begrenzt und einen Ausweg schafft.
- issue: Verhältnis von Ausweg und Ausharren
  choice: Der „Ausweg“ wird durch den Zwecksatz als Gottes Ermöglichung des Ertragens beschrieben.
  alternative: „Ausgang“ oder „Entkommen“ als Hinweis auf eine vollständige Beendigung der Prüfung
  rationale: Die Verbindung von ἔκβασις mit ὑπενεγκεῖν hält Ausweg und Ausharren zusammen. Daher wird weder eine sofortige Befreiung noch bloß inneres Durchhaltevermögen zum alleinigen Sinn erklärt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Die direkte Anrede im Plural und die knappen Aussagesätze bewahren den seelsorgerlich-mahnenden Charakter. Lexikalische und theologische Mehrdeutigkeiten werden nicht im Haupttext übererklärt, sondern in den Fußnoten offengehalten.
