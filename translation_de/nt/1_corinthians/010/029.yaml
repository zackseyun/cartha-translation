  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: de
  text: Ich meine aber nicht dein eigenes Gewissen, sondern das des anderen.[a] Denn warum wird meine Freiheit von einem anderen Gewissen beurteilt?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nicht sein eigenes, sondern das des anderen“. Der Zusammenhang legt den Sinn „nicht dein eigenes, sondern das des anderen“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: Die rhetorische Frage kann entweder als eigene Frage von Paulus oder als ein von ihm aufgegriffener Einwand verstanden werden; im Griechischen stehen keine ausdrücklichen Anführungszeichen.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: Gewissen
  rationale: Der Ausdruck bezeichnet hier das moralische Bewusstsein, nach dem Handlungen beurteilt werden. „Gewissen“ ist die natürliche und präzise deutsche Entsprechung.
- source_word: δὲ λέγω
  choice: Ich meine aber
  rationale: λέγω erläutert die vorausgehende Aussage; δέ markiert dabei einen leichten Kontrast. „Ich meine aber“ gibt diese klarstellende Funktion natürlich wieder.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: nicht dein eigenes Gewissen, sondern das des anderen
  rationale: Der Kontext bezieht die Aussage auf den angesprochenen Leser und den anderen Menschen. Die Ergänzung „Gewissen“ macht den deutschen Satz eindeutig; eine Fußnote bewahrt die formale Besonderheit von ἑαυτοῦ.
- source_word: ἱνατί γὰρ
  choice: Denn warum
  rationale: „Denn“ erhält die begründende Verbindung von γάρ, während „warum“ die rhetorische Frage von ἱνατί wiedergibt.
- source_word: ἐλευθερία
  choice: Freiheit
  rationale: „Freiheit“ ist die klare moderne Entsprechung und passt zum Zusammenhang erlaubter Handlungen.
- source_word: κρίνεται
  choice: sollte … beurteilt werden
  rationale: „Beurteilt werden“ bewahrt die breite Bedeutung von κρίνω, ohne sie vorschnell als Verurteilung festzulegen. Die Konstruktion mit „sollte“ gibt die rhetorische Nuance im Deutschen idiomatisch wieder.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: von einem anderen Gewissen
  rationale: Die Formulierung bleibt eng am Griechischen und lässt offen, ob stärker an das Gewissen selbst oder an dessen Träger gedacht ist.
theological_decisions:
- issue: Bezug des Possessivkontrasts im ersten Satz
  choice: „dein eigenes Gewissen“ gegenüber „dem des anderen“
  alternative: „sein eigenes Gewissen“ gegenüber „dem des anderen“
  rationale: ἑαυτοῦ ist formal dritte Person Singular, doch der Zusammenhang richtet die Klarstellung an die korinthischen Leser. Die Hauptübersetzung folgt dem Diskursbezug, während die Fußnote die wörtlichere Möglichkeit nennt.
- issue: Sprecherrolle der rhetorischen Frage
  choice: Die Frage bleibt ohne Anführungszeichen als rhetorische Frage stehen.
  alternative: Sie kann als von Paulus aufgegriffener Einwand eines Gesprächspartners verstanden werden.
  rationale: Der griechische Text kennzeichnet keinen Sprecherwechsel. Daher entscheidet die Übersetzung nicht, ob Paulus selbst fragt oder einen Einwand aufgreift.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist klar und idiomatisch; die begründende Verbindung und die offene rhetorische Spannung des griechischen Textes bleiben erhalten.
