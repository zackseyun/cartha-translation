  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: de
  text: 'Werdet auch nicht zu Götzendienern, wie einige von ihnen es wurden. Es steht geschrieben: »Das Volk setzte sich hin, um zu essen und zu trinken, und sie standen auf, um zu spielen[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um ausgelassen zu feiern«. Die angeführten Worte stammen aus 2. Mose 32,6; dort gehört das »Spielen« zu Israels götzendienerischem Fest um das goldene Kalb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: auch nicht
  rationale: Die Wendung führt im Zusammenhang eine Reihe von Warnungen fort; »auch nicht« gibt diesen anschließenden Charakter im Deutschen natürlich wieder.
- source_word: εἰδωλολάτραι γίνεσθε
  choice: Werdet … nicht zu Götzendienern
  rationale: »Werdet« bewahrt den dynamischen Sinn von γίνεσθε, während »Götzendiener« die Personenbezeichnung εἰδωλολάτραι knapp und geläufig wiedergibt.
- source_word: καθώς τινες αὐτῶν
  choice: wie einige von ihnen
  rationale: Die knappe Form folgt dem Griechischen; das Prädikat ist aus »wurden zu Götzendienern« sinngemäß zu ergänzen, ohne im Deutschen unnötig wiederholt zu werden.
- source_word: ὥσπερ γέγραπται
  choice: so wie geschrieben steht
  rationale: Die traditionelle Zitierformel gibt sowohl den Vergleich als auch die fortdauernde Geltung des Geschriebenen wieder.
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: Das Volk setzte sich hin, um zu essen und zu trinken
  rationale: Die kollektive Einzahl und die beiden Zweckinfinitive werden eng am griechischen Wortlaut und zugleich idiomatisch wiedergegeben.
- source_word: καὶ ἀνέστησαν παίζειν
  choice: und sie standen auf, um zu spielen
  rationale: Der Wechsel zur Mehrzahl wird bewahrt. »Spielen« entspricht der Grundbedeutung von παίζειν und lässt dessen kontextuelle Färbung zunächst offen.
theological_decisions:
- issue: Kontextuelle Bedeutung von παίζειν im Zitat aus 2. Mose 32,6
  choice: Im Haupttext steht »spielen«; die mögliche Bedeutung »ausgelassen feiern« wird in einer Fußnote erläutert.
  alternative: »ausgelassen feiern« oder »sich vergnügen« unmittelbar im Haupttext
  rationale: Das Verb bezeichnet grundsätzlich Spielen oder Sichvergnügen, steht hier aber im Zusammenhang des Festes um das goldene Kalb. Die wörtlichere Wiedergabe bewahrt die Anspielung und ihre Mehrdeutigkeit; die Fußnote macht den wahrscheinlichen kultisch-ausgelassenen Unterton sichtbar, ohne ihn zur einzig möglichen Übersetzung zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht bibelsprachlichem Klang in der Zitierformel. Der Numeruswechsel von »das Volk« zu »sie« folgt bewusst dem griechischen Zitat. Die Fußnotenmarkierung steht unmittelbar bei der mehrdeutigen Wendung, auf die sie sich bezieht.
