source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: de
  text: Diese Ereignisse wurden für uns zu Beispielen[a], damit wir nicht nach Bösem verlangen, wie auch jene danach verlangten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Mustern für uns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Diese Ereignisse
  rationale: Das substantivierte neutrale Demonstrativpronomen verweist auf die zuvor geschilderten Geschehnisse in der Wüste. „Ereignisse“ macht diesen Rückbezug im Deutschen natürlich deutlich.
- source_word: δὲ
  choice: unübersetzt
  rationale: Die Partikel markiert hier einen Übergang beziehungsweise eine Weiterführung. Im Deutschen wird diese Funktion durch den Satzanschluss ausreichend vermittelt; ein ausdrückliches „nun“ wäre unnötig.
- source_word: τύποι
  choice: warnende Beispiele
  rationale: τύποι bezeichnet hier prägende Muster beziehungsweise Beispiele. Der Zusammenhang hebt ihre mahnende Funktion hervor; „warnende Beispiele“ gibt diese Funktion verständlich wieder, ohne einen technischen typologischen Sinn festzulegen.
- source_word: ἡμῶν
  choice: für uns
  rationale: Der Genitiv bezeichnet die Bezugsgruppe, für die diese Ereignisse beispielhafte Bedeutung haben.
- source_word: ἐγενήθησαν
  choice: wurden zu
  rationale: Die Form von γίνομαι bezeichnet das Eintreten in eine Funktion oder Bedeutung und wird daher nicht bloß mit „waren“ wiedergegeben.
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: damit wir nicht
  rationale: Die Konstruktion drückt Zweck beziehungsweise beabsichtigte Folge aus. Im Deutschen ist die direkte Formulierung natürlicher als „damit wir nicht Menschen seien, die …“.
- source_word: ἐπιθυμητὰς κακῶν
  choice: nach Bösem verlangen
  rationale: Das Substantiv ἐπιθυμητάς bezeichnet Begehrende, während κακῶν das Begehrte nennt. Die verbale Wiedergabe ist idiomatisches Deutsch und bewahrt die allgemein moralische, nicht speziell sexuelle Bedeutung.
- source_word: καθὼς κἀκεῖνοι
  choice: wie jene
  rationale: „Wie“ führt den Vergleich ein; „jene“ verweist auf die zuvor erwähnte Wüstengeneration. Das in κἀκεῖνοι enthaltene καί muss im Deutschen nicht eigens mit „auch“ ausgedrückt werden.
- source_word: ἐπεθύμησαν
  choice: danach verlangten
  rationale: Die Wiedergabe greift bewusst dasselbe Verb „verlangen“ auf und erhält so die Wortverbindung mit ἐπιθυμητάς. „Danach“ nimmt „Bösem“ idiomatisch wieder auf.
theological_decisions:
- issue: Bedeutung von τύποι für Israels Erfahrungen in der Wüste
  choice: warnende Beispiele
  alternative: Vorbilder; Typen; Muster
  rationale: Der unmittelbare Zusammenhang verwendet die vergangenen Ereignisse zur ethischen Mahnung der Gemeinde. Die Übersetzung wahrt den Beispielcharakter, ohne einen engeren technischen typologischen Lehrbegriff einzuführen. Eine Fußnote erhält die weiteren möglichen Nuancen.
- issue: Bedeutungsumfang der Sprache des Begehrens
  choice: nach Bösem verlangen
  alternative: Böses begehren; nach Bösem gieren
  rationale: Die Formulierung bezeichnet allgemein schuldhaftes Verlangen. Sie wird nicht auf sexuelles Begehren verengt und nicht durch „gieren“ unnötig gesteigert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist direkt und gut verständlich; „jene“ hält den Rückverweis auf die Wüstengeneration knapp. Der Zusatz „warnenden“ verdeutlicht die im Kontext erkennbare mahnende Funktion von τύποι, während die Fußnote dessen breiteres Bedeutungsspektrum bewahrt.
