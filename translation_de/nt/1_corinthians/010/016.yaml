id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: de
  text: 'Der Becher des Segens, den wir segnen: Ist er nicht eine Teilhabe[a] am Blut des Messias[b]? Das Brot, das wir brechen: Ist es nicht eine Teilhabe am Leib des Messias?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Beteiligung an“; traditionell: „Gemeinschaft mit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: Christou; hier mit „Messias“ wiedergegeben, weil Christos als Titel gebraucht wird. Traditionell: „Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: der Kelch
  rationale: „Kelch“ ist im Deutschen die natürliche und würdige Bezeichnung für das Trinkgefäß in diesem Mahlkontext; es ist geläufig, ohne die Aussage unnötig auszudeuten.
- source_word: τῆς εὐλογίας
  choice: des Segens
  rationale: Die Genitivverbindung wird unmittelbar wiedergegeben und bewahrt den sprachlichen Zusammenhang mit dem folgenden Verb εὐλογοῦμεν.
- source_word: ὃ εὐλογοῦμεν
  choice: den wir segnen
  rationale: Die direkte Wiedergabe erhält die Wiederholung von εὐλογία und εὐλογέω und legt die Handlung nicht einseitig als Danksagung aus.
- source_word: οὐχὶ
  choice: ist er/es nicht
  rationale: Die rhetorische Frage, die eine bejahende Antwort erwartet, bleibt in Form und Aussagekraft erhalten.
- source_word: κοινωνία
  choice: Teilhabe an
  rationale: „Teilhabe an“ bezeichnet eine wirkliche Beteiligung, ohne die Art dieser Teilhabe konfessionell festzulegen; mit dem bestimmten Artikel verschmilzt „an dem“ idiomatisch zu „am“.
- source_word: τοῦ αἵματος
  choice: am Blut
  rationale: Die direkte Wiedergabe bewahrt die opfer- und bundestheologische Aussage, ohne sie interpretierend zu erweitern.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός hat hier weiterhin Titelcharakter und wird daher mit „Messias“ wiedergegeben; die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
- source_word: τὸν ἄρτον
  choice: das Brot
  rationale: „Brot“ ist die genaue und allgemein verständliche Wiedergabe; der Vers selbst verlangt nicht die spezifischere Übersetzung „Brotlaib“.
- source_word: ὃν κλῶμεν
  choice: das wir brechen
  rationale: Die konkrete Handlung wird schlicht und ohne liturgische Zusätze wiedergegeben.
- source_word: τοῦ σώματος
  choice: am Leib
  rationale: „Leib“ ist in diesem Zusammenhang eine natürliche, würdige Wiedergabe von σῶμα und bewahrt dessen christologisches und mahltheologisches Gewicht.
theological_decisions:
- issue: Wiedergabe von κοινωνία im Mahlkontext
  choice: Teilhabe an
  alternative: Gemeinschaft mit; Anteil an; Kommunion mit
  rationale: „Teilhabe an“ wahrt den partizipatorischen Gehalt des Ausdrucks, ohne die Aussage auf bloße Geselligkeit zu reduzieren oder eine bestimmte Lehre über die Weise der Gegenwart Christi festzuschreiben.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: In der Verbindung „Blut/Leib des Χριστός“ bleibt die Bedeutung als Titel des Gesalbten erkennbar. „Messias“ macht dies transparent; „Christus“ bleibt als traditionelle Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die beiden rhetorischen Fragen des griechischen Textes bleiben erhalten. Der Gedankenstrich markiert jeweils den Übergang vom Gegenstand des Mahls zur rhetorischen Aussage, ohne zusätzliche Deutung einzuführen.
