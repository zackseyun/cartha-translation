  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: de
  text: Denn dem Herrn gehört die Erde und alles, was sie erfüllt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Zitat aus Psalm 24,1. Wörtlicher: „und ihre Fülle“.'
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: dem Herrn gehört
  rationale: Der Genitiv τοῦ κυρίου bezeichnet Zugehörigkeit bzw. Besitz. Die deutsche Konstruktion „dem Herrn gehört die Erde“ ist natürlich, würdevoll und bewahrt den Sinn des Psalmzitats.
- source_word: γάρ
  choice: Denn
  rationale: γάρ begründet die vorangehende Aussage mit einem Schriftzitat; „Denn“ gibt diesen erklärenden Zusammenhang knapp und idiomatisch wieder.
- source_word: γῆ
  choice: Erde
  rationale: Im Zusammenhang mit τὸ πλήρωμα αὐτῆς und dem Zitat aus Psalm 24,1 ist die umfassende Bedeutung „Erde“ gegenüber „Land“ vorzuziehen.
- source_word: πλήρωμα
  choice: alles, was sie erfüllt
  rationale: πλήρωμα bezeichnet hier die Gesamtheit dessen, was die Erde erfüllt. Diese Wiedergabe ist im modernen Deutsch verständlicher als das substantivische „ihre Fülle“ und erhält zugleich das Bild des griechischen Ausdrucks.
- source_word: αὐτῆς
  choice: sie
  rationale: Das Pronomen bezieht sich auf die feminine γῆ („Erde“); in der Relativkonstruktion wird dieser Bezug natürlich durch „sie“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe von κύριος in einem theologisch gewichtigen Schriftzitat
  choice: Herr
  alternative: HERR
  rationale: Paulus zitiert den Psalm auf Griechisch mit κύριος. „Herr“ bewahrt den neutestamentlichen Wortlaut, ohne die im Deutschen häufig eigens für den hebräischen Gottesnamen verwendete Schreibweise „HERR“ in den griechischen Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die vorangestellte Zugehörigkeitskonstruktion betont wie der griechische Text, dass die Erde dem Herrn gehört.
