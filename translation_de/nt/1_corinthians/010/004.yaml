reference: 1 Corinthians 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: de
  text: Und alle tranken denselben geistlichen Trank; denn sie tranken aus einem geistlichen Felsen, der ihnen folgte, und der Fels war der Messias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: geistlichen Trank
  rationale: Bewahrt Paulus’ Ausdruck und die Parallele zur »geistlichen Speise« im vorhergehenden Vers. »Geistlich« lässt die Beziehung zum Wirken des Geistes und zur göttlichen Versorgung offen, ohne sie auf »symbolisch« oder »übernatürlich« zu verengen.
- source_word: ἔπιον
  choice: tranken
  rationale: Der Aorist fasst die gemeinsame Erfahrung der Wüstengeneration zusammen; das einfache Präteritum ist im Deutschen natürlich.
- source_word: ἔπινον
  choice: sie tranken
  rationale: Der Imperfekt bezeichnet einen andauernden oder wiederholten Vorgang. Eine deutsche Verlaufsumschreibung wäre schwerfällig; der Zusammenhang vermittelt den fortdauernden Sinn hinreichend.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: aus einem geistlichen Felsen, der ihnen folgte
  rationale: Der unbestimmte Artikel entspricht dem artikellosen πέτρας; »der ihnen folgte« gibt das präsentische Partizip natürlich wieder, ohne dessen fortdauernden Sinn auszuschließen.
- source_word: πέτρα
  choice: Fels
  rationale: πέτρα bezeichnet einen Felsen, nicht einen kleinen Stein; »Fels« bewahrt zudem die typologische Bildkraft.
- source_word: ἡ πέτρα δὲ ἦν
  choice: und der Fels war
  rationale: δέ verbindet hier erklärend und nur schwach kontrastierend. »Und« bewahrt den fließenden Gedankengang.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Χριστός steht in dieser prädikativen, typologischen Aussage als Titel. »Messias« macht den Titelcharakter im heutigen Deutsch deutlich.
- source_word: πάντες τὸ αὐτὸ
  choice: alle ... denselben
  rationale: Bewahrt Paulus’ Betonung, dass die gesamte Gruppe dieselbe Erfahrung teilte.
theological_decisions:
- issue: Identitätsaussage »der Fels war der Messias«
  choice: Die direkte Gleichsetzung wird als »der Fels war der Messias« bewahrt.
  alternative: »Der Fels stellte den Messias dar« oder eine bloße Anspielung auf die Überlieferung von einem mitziehenden Felsen.
  rationale: Die griechische Äquativkonstruktion ἡ πέτρα δὲ ἦν ὁ Χριστός formuliert eine starke christologische Identifikation. Die Übersetzung soll diese Spannung weder zu einer rein materiellen Gleichsetzung erklären noch auf bloße Symbolik abschwächen.
- issue: Bedeutung von πνευματικός bei Trank und Fels
  choice: »geistlich«
  alternative: »symbolisch«, »übernatürlich« oder »vom Geist gegeben«
  rationale: »Geistlich« erhält Paulus’ wiederholte, theologisch gewichtige Bezeichnung und legt nicht vorschnell fest, ob vor allem göttliche Herkunft, Wirkung des Geistes oder typologische Bedeutung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Trank« ist gegenüber »Getränk« leicht gehoben, entspricht aber der biblischen Bildsprache und der Parallelität mit »Speise«. Die Wiederholung von »tranken« spiegelt den griechischen Wechsel von Aorist und Imperfekt, auch wenn der Aspektunterschied im Deutschen nicht vollständig markiert werden kann.
