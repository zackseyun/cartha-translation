  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: de
  text: Was sage ich also? Dass Götzenopferspeise[a] etwas ist oder dass ein Götze etwas ist?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas, das einem Götzen geopfert wurde“; auch: „ein Götzenopfer“.'
    reason: lexical_alternative
  - marker: b
    text: Paulus behauptet damit nicht, dass Götzen eine wirkliche göttliche Existenz hätten oder dass Götzenopferspeise an sich eine besondere geistliche Bedeutung habe. Siehe auch 1. Korinther 8,4.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Was will ich damit sagen?
  rationale: Gibt die einleitende rhetorische Frage in natürlichem modernem Deutsch wieder. „Damit“ stellt den argumentativen Bezug her; „will ich sagen“ bewahrt den Sinn von φημί, ohne bereits eine bestimmte Deutung zu behaupten.
- source_word: ὅτι
  choice: Etwa, dass
  rationale: „Dass“ leitet den möglichen Inhalt von Paulus’ Aussage ein. Das idiomatische „etwa“ macht den rhetorisch verneinenden Charakter der Frage im Deutschen deutlich, ohne ihn als ausdrückliche Verneinung auszuformulieren.
- source_word: εἰδωλόθυτόν
  choice: Götzenopferfleisch
  rationale: Im Zusammenhang von 1. Korinther 8–10 geht es um Speise, besonders Fleisch, das im Rahmen eines Götzenopfers geopfert wurde. Das geläufige Kompositum ist knapp und kontextgenau; die allgemeinere Bedeutung wird in einer Fußnote genannt.
- source_word: τί ἐστιν
  choice: etwas ist
  rationale: Bewahrt die knappe und bewusst offene Formulierung des Griechischen. Sie kann Existenz, Bedeutung oder Wirksamkeit betreffen, ohne diese Spannung im Haupttext aufzulösen.
- source_word: ἢ
  choice: oder
  rationale: Gibt die einfache disjunktive Verbindung der beiden parallelen Satzglieder unmittelbar wieder.
- source_word: εἴδωλον
  choice: ein Götze
  rationale: Bezeichnet im Kontext einen kultisch verehrten Götzen und nicht lediglich ein neutrales Bild. Der unbestimmte Artikel entspricht der allgemeinen Aussage.
theological_decisions:
- issue: Ob Paulus Götzen oder Götzenopferspeise eine reale Existenz beziehungsweise geistliche Bedeutung zuschreibt
  choice: 'Die beiden Möglichkeiten werden als offene rhetorische Fragen formuliert: „dass Götzenopferfleisch etwas ist oder dass ein Götze etwas ist?“'
  alternative: „dass Götzenopferfleisch wirkliche geistliche Bedeutung hat oder dass ein Götze wirklich existiert?“
  rationale: Das griechische τί ἐστιν bleibt absichtlich knapp. Die Übersetzung legt weder philosophisch fest, in welchem Sinn ein Götze „ist“, noch spricht sie der Opferspeise ausdrücklich jede mögliche Wirkung ab. So bleibt die Spannung zum folgenden Vers erhalten, in dem Paulus den Götzen nicht als Gott anerkennt, die Opfer aber mit Dämonen in Verbindung bringt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Wendung „etwas ist“ erhält den Parallelismus und die genuine Bedeutungsweite des griechischen τί ἐστιν. „Götzenopferfleisch“ ist im deutschen Bibel- und Allgemeingebrauch verständlich, wird aber wegen der weiteren lexikalischen Möglichkeit durch eine Fußnote ergänzt.
