base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: de
  text: Wenn euch jemand von den Ungläubigen einlädt und ihr hingehen wollt, dann esst alles, was euch vorgesetzt wird, ohne Nachforschungen anzustellen, um des Gewissens willen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne etwas zu prüfen“ beziehungsweise „ohne Nachfragen zu stellen“. Gemeint ist, die Herkunft des Essens nicht zu untersuchen. Wessen Gewissen im Blick ist, wird im folgenden Vers näher erläutert.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: Ungläubigen
  rationale: Der substantivierte Genitiv Plural bezeichnet hier Menschen, die nicht zum christlichen Glauben gehören. „Ungläubige“ ist knapp und bewahrt die Unterscheidung des Textes, ohne zusätzliche Wertung einzutragen.
- source_word: καλεῖ
  choice: einlädt
  rationale: Im Zusammenhang einer Mahlzeit bezeichnet καλέω eine Einladung, nicht bloß ein Rufen.
- source_word: θέλετε πορεύεσθαι
  choice: ihr hingehen wollt
  rationale: Die Wendung drückt den Wunsch beziehungsweise die Bereitschaft aus, die Einladung anzunehmen; die deutsche Formulierung ist natürlich und bewahrt die Bedingtheit.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: alles, was euch vorgesetzt wird
  rationale: Das substantivierte Partizip meint das bei der Mahlzeit angebotene Essen. „Alles“ gibt den umfassenden Sinn von πᾶν wieder.
- source_word: ἐσθίετε
  choice: esst
  rationale: Der Präsensimperativ formuliert eine allgemeine Handlungsanweisung; der einfache deutsche Imperativ gibt sie angemessen wieder.
- source_word: μηδὲν ἀνακρίνοντες
  choice: ohne … Nachforschungen anzustellen
  rationale: ἀνακρίνω kann prüfen, untersuchen oder nachfragen bedeuten. Hier geht es darum, die Herkunft des Essens nicht zu erforschen.
- source_word: διὰ τὴν συνείδησιν
  choice: wegen des Gewissens
  rationale: διά mit Akkusativ bezeichnet hier den maßgeblichen Grund oder Gesichtspunkt. Die knappe Formulierung lässt wie das Griechische zunächst offen, wessen Gewissen gemeint ist.
theological_decisions:
- issue: Bezug von συνείδησις
  choice: „Gewissen“ bleibt im Haupttext ohne nähere Zuordnung.
  alternative: Ausdrückliche Zuordnung zum eigenen Gewissen oder zum Gewissen der anderen Person.
  rationale: Der Vers selbst nennt keinen Besitzer des Gewissens; erst der folgende Vers erläutert den Bezug näher. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Nachforschungen anstellen“ bildet den untersuchenden Sinn von ἀνακρίνω ab; die Stellung von „wegen des Gewissens“ bewahrt den Zusammenhang zwischen dem Unterlassen der Nachforschung und dem Gewissen.
