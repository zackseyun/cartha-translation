revisions:
- from: Denn viele gehen ihren Weg als Feinde des Kreuzes des Messias[a] – von ihnen habe ich euch oft gesprochen, und jetzt spreche ich sogar weinend von ihnen.
  to: Denn viele gehen ihren Weg als Feinde des Kreuzes des Messias[a]. Von ihnen habe ich euch oft erzählt, und nun sage ich es euch sogar weinend.
  rationale: Die Feindschaft gegenüber dem Kreuz wird wieder ausdrücklich als Kennzeichnung der vielen formuliert. „Von ihnen habe ich euch oft erzählt“ gibt die wiederholte vergangene Bezugnahme idiomatisch wieder; „nun sage ich es euch sogar weinend“ bewahrt Präsens, den Kontrast von νῦν δέ und die begleitende Handlung κλαίων. Die Satzteilung ist eine natürliche deutsche Umstellung ohne Bedeutungsänderung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:34:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbegriffe sind zutreffend wiedergegeben: γάρ als „denn“, die Lebenswandelmetapher von περιπατεῖν als „gehen ihren Weg“, ἐχθροί als „Feinde“, σταυρός als „Kreuz“ und der Titel Χριστός als „Messias“. Die derzeitige Satzfassung schwächt jedoch die syntaktische und semantische Funktion von τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ: „spreche ... von ihnen“ macht die Feindschaft nicht ausdrücklich zum Inhalt der gegenwärtigen Aussage. Die Revision stellt wieder klar heraus, dass diese vielen als Feinde des Kreuzes des Messias charakterisiert werden.'
  naturalness: „Gehen ihren Weg“ ist verständliches, würdiges modernes Standarddeutsch und erhält die paulinische Wegmetapher. Die Umstellung in zwei Sätze vermeidet eine im Deutschen schwerfällige, griechisch nachgebildete Einschubkonstruktion und macht den Bezug von „es“ eindeutig.
  terminology: „Kreuz des Messias“ gibt τοῦ σταυροῦ τοῦ Χριστοῦ sachgerecht wieder. Die Fußnote mit „des Christus“ dokumentiert die traditionelle alternative Titelwiedergabe, ohne den gewählten Titelbegriff zu verdrängen.
  issues:
  - severity: medium
    issue: Der zweite Teilsatz „jetzt spreche ich sogar weinend von ihnen“ gibt den prädikativen Akkusativ „[als] Feinde des Kreuzes ...“ nicht als Inhalt des gegenwärtigen Sagens wieder.
    rationale: Im Griechischen werden die Betreffenden als „Feinde des Kreuzes des Christus“ bezeichnet; „von ihnen sprechen“ kann im Deutschen bloß bedeuten, dass Paulus sie erneut erwähnt. Die explizite Prädikation muss daher im deutschen Satz stehen.
  revised_text: Denn viele gehen ihren Weg als Feinde des Kreuzes des Messias[a]. Von ihnen habe ich euch oft erzählt, und nun sage ich es euch sogar weinend.
  revised_footnotes:
