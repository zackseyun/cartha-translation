id: PHP.3.18
reference: Philippians 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: de
  text: Denn viele gehen ihren Weg als Feinde des Kreuzes des Messias[a]. Von ihnen habe ich euch oft erzählt, und nun sage ich es euch sogar weinend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Christus“.'
    reason: Alternative Wiedergabe des Titels Χριστός.
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet ohne weitere Einschränkung eine größere Mehrzahl; „viele“ ist die direkte und natürliche Wiedergabe.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet die vorhergehende Mahnung; „denn“ bewahrt diese erläuternde Funktion.
- source_word: περιπατοῦσιν
  choice: gehen ihren Weg
  rationale: Das Verb bezeichnet bei Paulus bildlich die Lebensführung. „gehen ihren Weg“ bewahrt das Wegmotiv und ist im modernen Deutschen verständlich.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: von ihnen habe ich euch oft gesprochen
  rationale: Das Imperfekt zusammen mit πολλάκις drückt wiederholtes Reden in der Vergangenheit aus. Die Präpositionalfügung gibt das im Griechischen knappe Relativgefüge idiomatisch wieder.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: jetzt spreche ich sogar weinend von ihnen
  rationale: Das Präsenspartizip κλαίων beschreibt Paulus während des Sprechens. „weinend“ bewahrt Bild, Gleichzeitigkeit und emotionale Unmittelbarkeit.
- source_word: ἐχθροὺς
  choice: Feinde
  rationale: Das Wort bezeichnet Menschen, die einer Sache feindlich gegenüberstehen; „Feinde“ erhält die Stärke der Aussage.
- source_word: σταυροῦ
  choice: Kreuz
  rationale: σταυρός bezeichnet hier den Kreuzestod und dessen theologische Bedeutung; „Kreuz“ ist die direkte etablierte Entsprechung.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier als Titel im Genitiv gebraucht. „des Messias“ gibt den Titelgehalt ausdrücklich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ als Titel in der Wendung τοῦ σταυροῦ τοῦ Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Der Kontext verlangt keinen eindeutig namenartigen Gebrauch. „Messias“ bewahrt die Bedeutung des griechischen Titels; die traditionelle Wiedergabe „Christus“ bleibt als Fußnotenalternative sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wegmetapher von περιπατέω bleibt erhalten. Der griechische Satzbau wurde behutsam umgeordnet, damit die Bezugsverhältnisse im Deutschen klar sind, ohne die Aussage abzuschwächen.
