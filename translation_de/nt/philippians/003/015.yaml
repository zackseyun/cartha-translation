  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: de
  text: Daher lasst uns alle, die wir reif[a] sind, diese Haltung einnehmen. Und wenn ihr in irgendeinem Punkt anders denkt, wird Gott euch auch das[b] offenbaren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vollkommen.'
    reason: lexical_alternative
  - marker: b
    text: „Auch das“ kann sich auf den betreffenden abweichenden Punkt oder auf die dazu nötige rechte Einsicht beziehen.
    reason: referential_ambiguity
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang, ohne im Deutschen unnötig schwer zu wirken.
- source_word: ὅσοι
  choice: wir alle, die wir
  rationale: Gibt den umfassenden und durch die erste Person Plural einschließenden Bezug natürlich wieder.
- source_word: τέλειοι
  choice: reif
  rationale: Bezeichnet hier angesichts von Vers 12 am ehesten geistliche Reife und nicht bereits erreichte absolute Vollkommenheit; die wörtlich mögliche Alternative wird in der Fußnote bewahrt.
- source_word: τοῦτο φρονῶμεν
  choice: sollen so denken
  rationale: Gibt den auffordernden Konjunktiv und den Rückbezug auf die zuvor beschriebene Haltung in natürlichem Deutsch wieder.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: wenn ihr in irgendeinem Punkt anders denkt
  rationale: Bewahrt die offene Bedingung, den unbestimmten Geltungsbereich und den Wechsel zur zweiten Person Plural.
- source_word: ἀποκαλύψει
  choice: wird … offenbaren
  rationale: Entspricht unmittelbar dem griechischen Verb und bewahrt den Gedanken göttlicher Offenbarung.
theological_decisions:
- issue: Bedeutung von τέλειοι im Zusammenhang
  choice: reif
  alternative: vollkommen
  rationale: Paulus hat kurz zuvor erklärt, dass er noch nicht vollendet ist. „Reif“ gibt daher wahrscheinlich die gemeinte geistliche Reife wieder, während die Fußnote die lexikalische und rhetorische Spannung zu „vollkommen“ offenhält.
- issue: Bezug von καὶ τοῦτο
  choice: auch das
  alternative: auch hierin
  rationale: 'Das Demonstrativpronomen bleibt bewusst offen: Es kann auf den abweichenden Punkt oder auf die rechte Einsicht darüber zurückweisen. Die Übersetzung legt den genauen Bezug nicht fest.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom einschließenden „wir“ zur direkten Anrede „ihr“ sowie die knappe Zuversicht der Aussage bleiben erhalten.
