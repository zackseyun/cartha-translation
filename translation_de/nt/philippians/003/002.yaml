  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: de
  text: Nehmt euch in Acht vor den Hunden, nehmt euch in Acht vor den bösen Arbeitern, nehmt euch in Acht vor der Zerschneidung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus gebraucht hier ein abwertendes Wort für »Zerschneidung« als scharfen Gegensatz zu »Beschneidung« im folgenden Vers. Auch die Übersetzung »Verstümmelung« ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Nehmt euch in Acht vor
  rationale: Der dreimal wiederholte Präsensimperativ warnt eindringlich. Die Formulierung ist in modernem Deutsch natürlich und bewahrt durch ihre dreifache Wiederholung den nachdrücklichen Rhythmus.
- source_word: τοὺς κύνας
  choice: den Hunden
  rationale: Das harte polemische Bild wird wörtlich bewahrt und nicht durch erklärende Zusätze abgeschwächt oder ausgedeutet.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: den bösen Arbeitern
  rationale: Die Wiedergabe erhält sowohl die moralische Wertung von κακούς als auch die gewöhnliche Bedeutung von ἐργάτας, ohne die Gruppe näher zu bestimmen, als der griechische Text es tut.
- source_word: τὴν κατατομήν
  choice: der Zerschneidung
  rationale: Das abstrakte Substantiv bezeichnet ein Zerschneiden beziehungsweise eine Verstümmelung. „Zerschneidung“ bewahrt die Substantivform und lässt das scharfe Wortspiel mit περιτομή („Beschneidung“) im folgenden Vers erkennen.
theological_decisions:
- issue: Wiedergabe von κατατομήν im Verhältnis zur Beschneidungssprache des folgenden Verses
  choice: der Zerschneidung
  alternative: den Verstümmlern; der Verstümmelung; der falschen Beschneidung
  rationale: Paulus verwendet bewusst nicht das übliche Wort für „Beschneidung“, sondern einen abwertenden Gegenbegriff. „Zerschneidung“ erhält diese polemische Spannung und die sprachliche Nähe zu „Beschneidung“, ohne das abstrakte Substantiv in eine Personenbezeichnung umzudeuten oder „falsch“ hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache identische Warnformel bildet die rhetorische Wiederholung des griechischen Textes ab; die harten polemischen Bezeichnungen werden nicht geglättet.
