revisions:
- from: Ich jage auf das Ziel zu, um den Siegespreis der Berufung Gottes nach oben zu gewinnen – in Christus Jesus.[a][b]
  to: Ich jage auf das Ziel zu, dem Siegespreis der Berufung Gottes nach oben in Christus Jesus entgegen.[a][b]
  rationale: Die Umformulierung macht den Siegespreis eindeutig zum Ziel des Jagens und bindet »nach oben« klar an »Berufung«. Sie bewahrt die Reihenfolge der zentralen Begriffe, die Wettkampfmetaphorik sowie die mögliche Reichweite von »in Christus Jesus«, ohne eine dogmatische Deutung festzuschreiben.
