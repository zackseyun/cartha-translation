  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: de
  text: Ich jage auf das Ziel zu, dem Siegespreis der Berufung Gottes nach oben in Christus Jesus entgegen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der himmlischen Berufung« oder »der Berufung von oben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: »in Christus Jesus«. Die Wendung kann sich eng auf die »Berufung Gottes nach oben« beziehen und bezeichnet zugleich den Bereich des Handelns Gottes in Christus Jesus.'
    reason: translation_clarity
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: auf das Ziel zu
  rationale: Die Wendung bezeichnet im Bild eines Wettlaufs die zielgerichtete Bewegung auf ein festes Ziel hin.
- source_word: διώκω
  choice: ich jage
  rationale: Das Verb drückt energisches, ausdauerndes Verfolgen aus und bewahrt hier die Wettkampfmetaphorik.
- source_word: εἰς τὸ βραβεῖον
  choice: um den Siegespreis … zu gewinnen
  rationale: εἰς bezeichnet hier das Ziel des Strebens; die deutsche Formulierung macht die Funktion im Wettlauf idiomatisch deutlich.
- source_word: ἄνω
  choice: nach oben
  rationale: Die räumliche Bedeutung bleibt erhalten, ohne die möglichen Bedeutungen »himmlisch« oder »von oben« stillschweigend festzulegen.
- source_word: κλήσεως τοῦ θεοῦ
  choice: der Berufung Gottes
  rationale: Die Genitivkonstruktion wird knapp und formal entsprechend wiedergegeben; Gott ist Quelle beziehungsweise Urheber der Berufung.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Christus Jesus
  rationale: Die paulinische Wendung wird unmittelbar bewahrt. Im Deutschen ist »Christus« die etablierte Wiedergabe des Titels Χριστός und bleibt hier als Titel erkennbar.
theological_decisions:
- issue: Bedeutung von ἄνω κλήσεως
  choice: Berufung … nach oben
  alternative: himmlische Berufung; Berufung von oben
  rationale: »Nach oben« bewahrt die räumliche Bildlichkeit und lässt zugleich offen, ob stärker das Ziel der Berufung oder ihre Herkunft von oben betont ist.
- issue: Zuordnung von ἐν Χριστῷ Ἰησοῦ
  choice: durch Gedankenstrich an die gesamte Aussage angebunden
  alternative: unmittelbar als Attribut zu »Berufung Gottes«
  rationale: Die griechische Wortstellung erlaubt einen engen Bezug zur Berufung, doch die Wendung kann auch den umfassenderen Bereich des göttlichen Handelns und Strebens bezeichnen. Der Gedankenstrich wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wettkampfmetapher wird mit »Ziel«, »jage« und »Siegespreis« deutlich erhalten; die Mehrdeutigkeit von ἄνω und die syntaktische Reichweite der Schlusswendung werden nicht dogmatisch eingeengt.
