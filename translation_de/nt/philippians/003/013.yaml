id: PHP.3.13
reference: Philippians 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: de
  text: 'Brüder[a], ich selbst bin nicht der Ansicht, es ergriffen zu haben. Doch eines: Ich vergesse, was hinter mir liegt, und strecke mich nach dem aus, was vor mir liegt,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ gibt die maskuline griechische Anrede adelphoi wieder. Paulus verwendet sie häufig für die ganze Glaubensgemeinschaft, Frauen eingeschlossen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die maskuline griechische Anrede wird formal sichtbar gehalten; dass Paulus damit hier die gesamte, auch Frauen umfassende Glaubensgemeinschaft anspricht, wird in der Fußnote erläutert.
- source_word: λογίζομαι
  choice: bin … der Ansicht
  rationale: Die Wendung gibt die persönliche Einschätzung in natürlichem, modernem Deutsch wieder. „Ich selbst“ bewahrt die Betonung von ἐγὼ ἐμαυτόν.
- source_word: κατειληφέναι
  choice: es ergriffen zu haben
  rationale: „Ergriffen“ bewahrt das Bild des Erfassens beziehungsweise In-Besitz-Nehmens aus dem unmittelbaren Zusammenhang; „es“ macht das im Griechischen unausgesprochene Objekt verständlich.
- source_word: ἓν δέ
  choice: Doch eines
  rationale: Die knappe Ellipse des Griechischen bleibt erhalten, ohne sie bereits an dieser Stelle durch eine zusätzliche verbale Aussage auszudeuten.
- source_word: τὰ μὲν ὀπίσω
  choice: was hinter mir liegt
  rationale: Die idiomatische deutsche Formulierung bewahrt die räumliche Rückwärtsmetapher, ohne das Gemeinte näher festzulegen.
- source_word: ἐπιλανθανόμενος
  choice: Ich vergesse
  rationale: „Vergessen“ entspricht dem unmittelbaren Wortsinn. Wegen der deutschen Idiomatik wird das Partizip als finites Verb wiedergegeben.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: was vor mir liegt
  rationale: Die Formulierung bildet einen klaren Gegenpol zu „was hinter mir liegt“ und bewahrt die räumliche Vorwärtsmetapher.
- source_word: ἐπεκτεινόμενος
  choice: strecke mich nach … aus
  rationale: Die reflexive Wendung vermittelt die aktive, zielgerichtete Vorwärtsbewegung des griechischen Verbs, ohne sie unnötig zu verstärken.
theological_decisions:
- issue: Unausgesprochenes Objekt von κατειληφέναι
  choice: Das neutrale Pronomen „es“ wird ergänzt, ohne seinen Bezug näher zu bestimmen.
  alternative: Das Ziel als „Vollkommenheit“, „Christus“ oder „Auferstehung“ ausdrücklich benennen.
  rationale: Der griechische Satz lässt das Objekt unausgesprochen; eine konkrete Benennung würde die im Zusammenhang bestehende Deutungsspannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Zäsur „Doch eines:“ bewahrt den abrupten Übergang des griechischen Textes; die beiden griechischen Partizipien werden für einen natürlichen deutschen Satz als finite Verben wiedergegeben.
