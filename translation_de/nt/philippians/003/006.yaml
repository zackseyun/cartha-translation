  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: de
  text: 'was den Eifer betrifft: die Gemeinde verfolgend; was die Gerechtigkeit nach dem Gesetz[a] betrifft: untadelig geworden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Gesetz“; gemeint ist die Gerechtigkeit im Bereich bzw. nach dem Maßstab des Gesetzes.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: untadelig innerhalb des zuvor genannten Maßstabs, nicht notwendig vollkommen sündlos.'
    reason: theological_clarification
lexical_decisions:
- source_word: κατὰ
  choice: was … betrifft
  rationale: κατά führt jeweils den Bereich an, in dem Paulus beurteilt wird. Die wiederholte Wendung bewahrt die rhetorische Parallelität und klingt im modernen Deutschen natürlich.
- source_word: ζῆλος
  choice: Eifer
  rationale: „Eifer“ gibt die intensive religiöse Hingabe wieder, die hier durch die Verfolgung der Gemeinde konkretisiert wird.
- source_word: διώκων
  choice: ein Verfolger
  rationale: Das substantivische Prädikat bewahrt innerhalb der Aufzählung den partizipialen Charakter und bezeichnet eindeutig feindliches Verfolgen.
- source_word: ἐκκλησίαν
  choice: der Gemeinde
  rationale: Im paulinischen Zusammenhang ist die Gemeinschaft der an Christus Glaubenden gemeint. „Gemeinde“ ist im Deutschen klar und vermeidet eine unnötige Verengung auf eine Institution oder ein Gebäude.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die sachlich und theologisch offene Standardwiedergabe und kann hier die am Gesetz gemessene Rechtschaffenheit bezeichnen.
- source_word: ἐν νόμῳ
  choice: im Gesetz
  rationale: Die formal nahe Wiedergabe erhält die mögliche Bedeutung des Gesetzes als Bereich oder Maßstab, ohne diese im Haupttext vorschnell festzulegen.
- source_word: γενόμενος
  choice: geworden
  rationale: „Geworden“ bildet den Aoristpartizip-Ausdruck ab und lässt dessen rückblickenden, resultativen Zug bestehen.
- source_word: ἄμεμπτος
  choice: untadelig
  rationale: „Untadelig“ bezeichnet Freiheit von einem begründeten Vorwurf innerhalb des genannten Beurteilungsrahmens, ohne absolute Sündlosigkeit auszusagen.
theological_decisions:
- issue: Reichweite der behaupteten Untadeligkeit
  choice: Paulus bezeichnet sich hinsichtlich der Gerechtigkeit im Gesetz als untadelig.
  alternative: Paulus beansprucht uneingeschränkte moralische Vollkommenheit oder spricht lediglich ironisch.
  rationale: Grammatisch ist „untadelig“ auf die unmittelbar genannte „Gerechtigkeit im Gesetz“ bezogen. Die Aussage bleibt daher an diesen Beurteilungsrahmen gebunden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die elliptische Aufzählungsform und die zweimalige Bereichsangabe des Griechischen bleiben erhalten; Doppelpunkte verdeutlichen die Struktur, ohne die Fragmente zu vollständigen Sätzen auszubauen.
