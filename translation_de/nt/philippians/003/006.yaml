  terminology: „Eifer“, „Gemeinde“, „Gerechtigkeit“ und „untadelig“ sind passende, registergerechte Wiedergaben. „Nach dem Gesetz“ bezeichnet hier idiomatisch den gesetzlichen Maßstab beziehungsweise Bereich, ohne eine weitergehende theologische Deutung festzulegen.
