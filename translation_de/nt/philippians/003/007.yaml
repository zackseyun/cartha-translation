  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: de
  text: Doch alles, was mir Gewinn war, habe ich wegen des Messias als Verlust angesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um des Messias willen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zu den zuvor genannten Gründen für menschliches Vertrauen und wirkt im Deutschen würdig und natürlich.
- source_word: ἅτινα
  choice: was auch immer
  rationale: Gibt das indefinite Relativpronomen wieder und umfasst sämtliche zuvor aufgezählten Vorzüge.
- source_word: ἦν μοι κέρδη
  choice: für mich Gewinn war
  rationale: Bewahrt den wirtschaftlichen Bildbereich. Der griechische Plural bezeichnet mehrere Gewinnposten; im natürlichen Deutschen kann das zusammenfassende „Gewinn“ als Kollektivbegriff stehen.
- source_word: ἥγημαι
  choice: habe ich … angesehen
  rationale: Das Perfekt bezeichnet eine vollzogene Neubewertung mit fortdauerndem Ergebnis; das deutsche Perfekt bildet dies verständlich ab.
- source_word: διὰ τὸν Χριστὸν
  choice: um des Messias willen
  rationale: διά mit Akkusativ kann hier den Beweggrund ausdrücken. „Messias“ gibt Χριστός als Titel bedeutungstragend wieder.
- source_word: ζημίαν
  choice: als Verlust
  rationale: Bewahrt den buchhalterischen Gegensatz zu κέρδη und die zusammenfassende Einzahl des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von Χριστόν
  choice: des Messias
  alternative: Christi / wegen Christus
  rationale: Χριστός wird hier als bedeutungsvoller Titel verstanden; „Messias“ erhält diesen Titelcharakter, ohne eine konfessionelle Sonderdeutung einzuführen.
- issue: Bedeutung von διὰ τὸν Χριστόν
  choice: um des Messias willen
  alternative: wegen des Messias
  rationale: Die Formulierung kann Beweggrund beziehungsweise Ursache ausdrücken. Der Haupttext wählt die idiomatische Zweck-/Motivangabe; die Fußnote bewahrt die kausale Alternative.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die Handelsmetapher von Gewinn und Verlust bleibt erhalten; die Satzstellung folgt dem rhetorischen Kontrast des griechischen Textes, ohne unnatürlich wörtlich zu wirken.
