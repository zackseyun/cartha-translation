  terminology: „Messias“ ist als bedeutungstragende Wiedergabe von Χριστός angemessen. Die Fußnotenformulierung „wegen Christus“ ist stilistisch und syntaktisch weniger passend als eine Formulierung mit „des Messias“; die alternative Wendung wird klar und ohne unnötigen Titelwechsel angegeben.
