source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: de
  text: Denn unser Bürgerrecht[a] ist im Himmel[b]; von dort erwarten wir auch sehnsüchtig einen Retter, den Herrn Jesus, den Messias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unser Gemeinwesen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in den Himmeln“.'
    reason: source_form
  - marker: c
    text: 'Oder: „den Herrn Jesus Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολίτευμα
  choice: Bürgerrecht
  rationale: Der Ausdruck bezeichnet hier die staatsbürgerliche Zugehörigkeit beziehungsweise das Gemeinwesen der Glaubenden. „Bürgerrecht“ bewahrt den politischen Klang und bildet den Gegensatz zur irdischen Ausrichtung im Kontext verständlich ab.
- source_word: ἐν οὐρανοῖς
  choice: im Himmel
  rationale: Obwohl im Griechischen der Plural steht, ist „im Himmel“ die natürliche deutsche Bezeichnung für diesen Bereich; die Form des Ausgangstextes wird in einer Fußnote sichtbar gehalten.
- source_word: ὑπάρχει
  choice: ist
  rationale: „Ist“ gibt die gegenwärtige Wirklichkeit idiomatisch wieder, ohne die Aussage durch das schwerfällige „existiert“ unnötig zu markieren.
- source_word: ἐξ οὗ
  choice: von dort
  rationale: Das Relativadverb verweist räumlich auf den Himmel zurück. „Von dort“ ist im Deutschen klar und natürlich.
- source_word: ἀπεκδεχόμεθα
  choice: erwarten wir auch sehnsüchtig
  rationale: Das Verb bezeichnet anhaltendes, erwartungsvolles Warten. „Sehnsüchtig erwarten“ bringt diese intensive Ausrichtung in natürlichem Deutsch zum Ausdruck; καί wird mit „auch“ wiedergegeben.
- source_word: σωτῆρα
  choice: einen Retter
  rationale: „Retter“ ist die direkte und im modernen Deutsch verständliche Wiedergabe des christologisch gewichtigen Begriffs, ohne dessen Bedeutung einzuengen.
- source_word: κύριον
  choice: den Herrn
  rationale: „Herr“ entspricht dem neutestamentlichen christologischen Titel und identifiziert den erwarteten Retter in der folgenden Apposition.
- source_word: Χριστόν
  choice: den Messias
  rationale: Χριστός hat in der Titelfolge weiterhin den Sinn „Gesalbter/Messias“. Der deutsche Artikel macht den Titel nach „Jesus“ idiomatisch erkennbar.
theological_decisions:
- issue: Bedeutung von πολίτευμα
  choice: „Bürgerrecht“ im Haupttext
  alternative: „Gemeinwesen“
  rationale: „Bürgerrecht“ betont die Zugehörigkeit der Glaubenden; „Gemeinwesen“ ist ebenfalls lexikalisch möglich und wird daher als Alternative genannt, ohne zwischen individueller Zugehörigkeit und korporativer Gemeinschaft dogmatisch zu entscheiden.
- issue: Wiedergabe von Χριστόν in κύριον Ἰησοῦν Χριστόν
  choice: „den Herrn Jesus, den Messias“
  alternative: „den Herrn Jesus Christus“
  rationale: „Messias“ legt den Titelgehalt offen, während „Christus“ die traditionelle, stärker namenähnliche Form ist. Die Alternative wird in einer Fußnote bewahrt.
- issue: Beziehung zwischen σωτῆρα und κύριον Ἰησοῦν Χριστόν
  choice: Identifizierende Apposition nach einem Doppelpunkt
  alternative: Fortlaufende Apposition mit Kommas
  rationale: Der Doppelpunkt macht in natürlichem Deutsch deutlich, dass der erwartete Retter der Herr Jesus, der Messias, ist, ohne zusätzliche theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Gedankengang, wird aber durch Semikolon und Doppelpunkt für heutige Leser klar gegliedert. Politische und christologische Schlüsselbegriffe bleiben samt ihren echten Übersetzungsalternativen sichtbar.
