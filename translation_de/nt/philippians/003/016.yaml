  text: πλὴν εἰς ὃ ἐφθάσαμεν, τῷ αὐτῷ ⸀στοιχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: de
  text: Doch lasst uns entsprechend dem, was wir erreicht haben, weitergehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch lasst uns bei dem, was wir erreicht haben, in derselben Richtung weitergehen.“ Wörtlich bleibt die Bezugsgröße bei „demselben“ unausgesprochen.'
    reason: 'Die griechische Formulierung ist elliptisch: Sie verbindet den erreichten Stand mit der Aufforderung, weiterhin danach geordnet zu gehen, ohne eine „Regel“ oder einen „Maßstab“ ausdrücklich zu nennen.'
lexical_decisions:
- source_word: πλήν
  choice: Doch
  rationale: πλήν leitet hier eine einschränkende beziehungsweise zusammenfassende Mahnung ein. „Doch“ gibt den Übergang im Deutschen knapp und natürlich wieder.
- source_word: εἰς ὃ
  choice: an dem, was
  rationale: Die Wendung bezeichnet den bereits erreichten Stand, an dem sich das weitere Verhalten ausrichten soll. Zusammen mit στοιχεῖν ist „an dem, was“ idiomatisch.
- source_word: ἐφθάσαμεν
  choice: wir erreicht haben
  rationale: Der Aorist bezeichnet den Stand, bis zu dem die Angesprochenen bereits gelangt sind; das deutsche Perfekt bringt dessen fortdauernde Bedeutung natürlich zum Ausdruck.
- source_word: τῷ αὐτῷ
  choice: an dem
  rationale: Das substantivierte „demselben“ verweist auf den zuvor genannten erreichten Stand. Die deutsche Formulierung bindet die Mahnung daran zurück, ohne ein im SBLGNT nicht ausdrücklich vorhandenes Substantiv wie „Regel“ einzufügen.
- source_word: στοιχεῖν
  choice: festhalten
  rationale: στοιχεῖν bezeichnet ein geordnetes Sich-Ausrichten beziehungsweise Weitergehen nach einer Linie oder einem Maßstab. „Festhalten“ vermittelt hier verständlich die Aufforderung, dem erreichten Stand entsprechend weiterzuleben; die Schritt-Metapher wird in der Fußnote sichtbar gemacht.
theological_decisions:
- issue: Ob bei τῷ αὐτῷ ein Substantiv wie „Regel“ oder „Maßstab“ ergänzt werden soll
  choice: Im Haupttext kein solches Substantiv ergänzen, sondern den Bezug auf den erreichten Stand idiomatisch mit „an dem festhalten“ ausdrücken.
  alternative: „nach derselben Regel leben“ oder „sich weiter nach demselben Maßstab richten“
  rationale: Der kürzere griechische Text lässt das Bezugswort unausgesprochen. Eine ausdrückliche „Regel“ würde den Text stärker festlegen und kann außerdem an spätere erweiterte Lesarten erinnern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufforderung bleibt erhalten; die schwer wörtlich wiederzugebende Schritt- beziehungsweise Linienmetapher wird im Haupttext idiomatisch und in der Fußnote formnäher dargestellt.
