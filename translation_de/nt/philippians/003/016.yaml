  naturalness: „Doch lasst uns entsprechend dem, was wir erreicht haben, weitergehen“ ist modernes, würdiges und idiomatisches Standarddeutsch. Es bewahrt den exhortativen Charakter und die Bewegungsmetapher besser als „an dem ... festhalten“.
  terminology: „Entsprechend dem“ gibt die implizite Bezugsgröße bei τῷ αὐτῷ wieder, ohne eine im griechischen Kurztext nicht genannte „Regel“ oder einen „Maßstab“ als Substantiv festzulegen. „Weitergehen“ ist für στοιχεῖν angemessener als „festhalten“.
