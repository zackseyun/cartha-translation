  source_fidelity: Der Entwurf gibt die Satzstruktur, die Kontrastierung der eigenen, aus dem Gesetz stammenden Gerechtigkeit mit der durch Glauben vermittelten Gerechtigkeit sowie die umstrittene Genitivkonstruktion πιστεως Χριστου sachgerecht wieder. Die Fußnote a bewahrt zutreffend die alternative Lesart „Treue des Messias“.
