id: PHP.3.9
reference: Philippians 3:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: de
  text: und in ihm gefunden werde, ohne meine eigene Gerechtigkeit[b] zu haben, die aus dem Gesetz stammt, sondern die durch den Glauben an den Messias[a] kommt – die von Gott kommende Gerechtigkeit aufgrund des Glaubens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch die Treue des Messias«.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort kann auch im Sinn von »Recht« oder »gerechtem Handeln« verstanden werden; ebenso beim zweiten Vorkommen in diesem Vers.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ ἐν αὐτῷ
  choice: in ihm gefunden werde
  rationale: Bewahrt die Passivform und die für Paulus zentrale, theologisch weit gefasste Wendung »in ihm«, ohne sie durch eine erklärende Umschreibung einzuengen.
- source_word: μὴ ἔχων
  choice: wobei ich nicht … habe
  rationale: Gibt das begleitende Partizip verständlich wieder und lässt den Gegensatz zwischen der eigenen und der von Gott kommenden Gerechtigkeit klar hervortreten.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« ist die natürliche und semantisch breite deutsche Entsprechung; eine mögliche Akzentuierung als »Recht« oder »gerechtes Handeln« wird in einer Fußnote genannt.
- source_word: τὴν ἐκ νόμου
  choice: die aus dem Gesetz kommt
  rationale: Kennzeichnet das Gesetz klar als Ursprung und entspricht natürlichem modernem Deutsch.
- source_word: διὰ πίστεως Χριστοῦ
  choice: durch den Glauben an den Messias
  rationale: Gibt die objektive Genitivdeutung im Haupttext wieder. Die grammatisch mögliche Deutung als Treue des Messias bleibt in der Fußnote erhalten.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Gibt Χριστός hier als bedeutungsvollen Titel wieder und vermeidet, ihn lediglich wie einen Eigennamen zu behandeln.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: die Gerechtigkeit aus Gott
  rationale: Bewahrt die knappe Wiederaufnahme des griechischen Textes und hebt Gott als Ursprung hervor.
- source_word: ἐπὶ τῇ πίστει
  choice: aufgrund des Glaubens
  rationale: Drückt die durch ἐπί mit Dativ bezeichnete Grundlage knapp und idiomatisch aus.
theological_decisions:
- issue: Bedeutung von πίστεως Χριστοῦ
  choice: Glaube an den Messias
  alternative: Treue des Messias
  rationale: Der Genitiv ist tatsächlich mehrdeutig. Der Haupttext folgt der verbreiteten objektiven Deutung, während die subjektive Deutung ausdrücklich in der Fußnote bewahrt wird.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht bzw. gerechtes Handeln
  rationale: »Gerechtigkeit« wahrt die traditionelle paulinische Begrifflichkeit und zugleich die Breite des griechischen Wortes; die mögliche rechtlich-ethische Akzentuierung wird nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch »wobei« und den Gedankenstrich für heutige Leser übersichtlich gegliedert.
