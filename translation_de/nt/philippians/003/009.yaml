  to: und in ihm gefunden werde, ohne meine eigene Gerechtigkeit[b] zu haben, die aus dem Gesetz stammt, sondern die durch den Glauben an den Messias[a] kommt – die von Gott kommende Gerechtigkeit aufgrund des Glaubens.
