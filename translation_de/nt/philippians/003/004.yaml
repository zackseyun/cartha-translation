  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: de
  text: 'Obwohl ich selbst auch auf das Fleisch vertraue. Wenn jemand anders meint, auf das Fleisch[a] zu vertrauen, dann ich erst recht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: auf menschliche Vorzüge oder äußere Stellung. Wörtlich: „auf das Fleisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Obwohl
  rationale: Gibt die konzessive Einleitung klar und natürlich wieder.
- source_word: ἐγὼ ἔχων πεποίθησιν
  choice: auch ich Grund hätte, … zu vertrauen
  rationale: Die deutsche Wendung bringt den vorhandenen Anlass zur Zuversicht idiomatisch zum Ausdruck; der Konjunktiv passt zum argumentativen Zugeständnis im Zusammenhang.
- source_word: καὶ ἐν σαρκί
  choice: auf das Fleisch
  rationale: Bewahrt den paulinischen Schlüsselbegriff und das zusätzliche καί durch „auch“, ohne ihn im Haupttext auf äußere Vorzüge einzuengen.
- source_word: δοκεῖ
  choice: meint
  rationale: Entspricht hier dem urteilenden oder annehmenden Sinn und klingt im modernen Deutsch natürlich.
- source_word: πεποιθέναι ἐν σαρκί
  choice: auf das Fleisch vertrauen zu können
  rationale: Gibt den Infinitiv in natürlicher deutscher Syntax wieder; „vertrauen“ wahrt den Bezug von πεποίθησις/πέποιθα.
- source_word: μᾶλλον
  choice: dann ich noch mehr
  rationale: Erhält die knappe, zugespitzte Vergleichsaussage; der Doppelpunkt öffnet zu den Belegen in den Folgeversen.
theological_decisions:
- issue: Bedeutung von σάρξ in Philipper 3,4
  choice: „Fleisch“ im Haupttext beibehalten
  alternative: „menschliche Vorzüge“ oder „äußere Stellung“
  rationale: Die Verse 5–6 zeigen, dass hier menschliche Herkunft, religiöser Status und Leistungen gemeint sind, nicht unmittelbar eine „sündige Natur“. Der Quellbegriff bleibt sichtbar, während die Fußnote den Kontext erläutert.
- issue: Sinn von πεποίθησις als Vertrauen oder Vertrauensgrund
  choice: „Grund hätte, … zu vertrauen“ im ersten Satz; „vertrauen zu können“ im zweiten
  alternative: durchgehend „Zuversicht haben“
  rationale: So bleibt das Wortfeld des Vertrauens erkennbar, und zugleich wird verständlich, dass Paulus von vorzeigbaren menschlichen Voraussetzungen spricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fleisch“ wird als theologisch und rhetorisch bedeutsamer Quellbegriff bewahrt; die Satzführung bleibt verständlich und leitet mit dem abschließenden Doppelpunkt natürlich zur Aufzählung ab Vers 5 über.
