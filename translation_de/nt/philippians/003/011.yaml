lexical_decisions:
- source_word: εἴ πως
  choice: ob ich so irgendwie
  rationale: Die Formulierung bewahrt den tastenden, zielgerichteten Charakter der griechischen Wendung, ohne daraus einen Zweifel an Gottes Verheißung abzuleiten. Im Zusammenhang knüpft „so“ an den vorausgehenden Weg der Christusgemeinschaft an.
- source_word: καταντήσω
  choice: ich … gelange
  rationale: Das Verb bezeichnet das Erreichen eines Ziels. „Gelange“ gibt den Aorist Konjunktiv nach εἴ πως natürlich und ohne eine Leistungsaussage wieder.
- source_word: εἰς
  choice: zur
  rationale: Die Verschmelzung „zur“ ist im Deutschen die idiomatische Wiedergabe der auf ein Ziel gerichteten Präposition εἰς.
- source_word: ἐξανάστασιν
  choice: Auferstehung
  rationale: Das seltene Substantiv bezeichnet hier die Auferstehung. Eine künstliche Bildung wie „Herausauferstehung“ wäre im Haupttext unnatürlich; die besondere Wortform wird in der Fußnote sichtbar gemacht.
- source_word: τὴν ἐκ νεκρῶν
  choice: aus den Toten
  rationale: Diese vergleichsweise formnahe Wiedergabe bewahrt die Vorstellung des Auferstehens aus der Mitte der Toten und bleibt im Deutschen verständlich.
theological_decisions:
- issue: Ob ἐξανάστασις gegenüber dem gewöhnlicheren ἀνάστασις als besondere oder gesonderte Auferstehung auszulegen ist
  choice: Im Haupttext steht „Auferstehung aus den Toten“.
  alternative: „Herausauferstehung aus der Mitte der Toten“
  rationale: Die ungewöhnliche griechische Wortbildung darf wahrnehmbar bleiben, rechtfertigt aber keine dogmatisch festgelegte Sonderkategorie. Haupttext und Fußnote bewahren gemeinsam die mögliche Nuance, ohne sie zu überdehnen.
- issue: Ob εἴ πως Zweifel am Eintreten der Auferstehung ausdrückt
  choice: Die vorsichtige Formulierung „ob ich so irgendwie … gelange“ bleibt stehen.
  alternative: Eine sichernde Umschreibung wie „damit ich gewiss … gelange“
  rationale: Der griechische Text formuliert bewusst tastend. Die Übersetzung erklärt diese Spannung nicht weg und legt nicht fest, ob sie sich auf den Weg, die persönliche Demut oder das Erreichen des Ziels bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung hält die vorsichtige Aussage des Originals fest; „aus den Toten“ ist bewusst formnäher als das geläufigere „von den Toten“.
