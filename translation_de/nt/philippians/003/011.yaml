translation:
  language: de
  text: ob ich irgendwie zur Auferstehung aus den Toten[a] gelange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zur Heraus-Auferstehung aus der Mitte der Toten“.'
