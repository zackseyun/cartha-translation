  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: de
  text: ihn zu erkennen und die Kraft seiner Auferstehung und die Teilhabe an seinen Leiden[a], wobei ich seinem Tod gleichgestaltet werde[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gemeinschaft seiner Leiden“ beziehungsweise „die Beteiligung an seinen Leiden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wobei ich seinem Tod angeglichen werde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: zu erkennen
  rationale: Der Aoristinfinitiv führt das Ziel des vorausgehenden Strebens weiter. „Erkennen“ bewahrt sowohl den persönlichen als auch den erfahrungsbezogenen Sinn.
- source_word: δύναμιν
  choice: Kraft
  rationale: „Kraft“ ist die natürliche und präzise Wiedergabe für die wirksame Macht, die sich in seiner Auferstehung zeigt.
- source_word: ἀναστάσεως
  choice: Auferstehung
  rationale: Der etablierte Ausdruck bezeichnet hier eindeutig die Auferstehung des Messias.
- source_word: κοινωνίαν
  choice: Teilhabe
  rationale: Das Substantiv bewahrt die nominale Struktur des Griechischen und bezeichnet wirkliche Beteiligung, ohne den möglicherweise abstrakten modernen Beiklang von „Gemeinschaft“ aufzudrängen.
- source_word: παθημάτων
  choice: Leiden
  rationale: „Leiden“ gibt den persönlichen und christusbezogenen Sinn von πάθημα direkt wieder.
- source_word: συμμορφιζόμενος
  choice: indem ich … gleichgestaltet werde
  rationale: Das Präsenspartizip beschreibt einen fortdauernden Vorgang. Die Passivform wahrt, dass Paulus diese Gleichgestaltung erfährt, ohne den Handelnden ausdrücklich festzulegen.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: seinem Tod
  rationale: Der Dativ ist die Ergänzung zu συμμορφιζόμενος; „seinem Tod gleichgestaltet“ bildet die griechische Konstruktion präzise und verständlich ab.
theological_decisions:
- issue: Bedeutung von κοινωνίαν παθημάτων αὐτοῦ
  choice: wirkliche Teilhabe an seinen Leiden
  alternative: Gemeinschaft seiner Leiden
  rationale: κοινωνία bezeichnet hier Beteiligung beziehungsweise Anteilnahme am Leiden des Messias, nicht nur gefühlsmäßige Verbundenheit. „Teilhabe“ wahrt diese partizipative Aussage, ohne sie konfessionell einzuengen.
- issue: Stimme und Verlauf von συμμορφιζόμενος
  choice: indem ich seinem Tod gleichgestaltet werde
  alternative: wobei ich seinem Tod gleichförmig werde
  rationale: Die Wiedergabe lässt den fortdauernden Prozess und die mediale/passive Spannung des Partizips bestehen, statt eigenmächtige Selbstangleichung vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Anschluss an den vorhergehenden Vers und das abschließende Komma werden entsprechend der vorgelegten Versform beibehalten. Die erste Person beim Partizip wird aus dem syntaktischen Bezug auf Paulus verdeutlicht.
