id: PHP.3.19
reference: Philippians 3:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: de
  text: Ihr Ende ist das Verderben, ihr Gott ist der Bauch[a], und ihre Ehre liegt in ihrer Schande – sie sind auf das Irdische bedacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Gott ist ihr Appetit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: Ende
  rationale: „Ende“ gibt den knappen griechischen Ausdruck wieder und kann sowohl den Abschluss als auch den endgültigen Ausgang bezeichnen.
- source_word: ἀπώλεια
  choice: Verderben
  rationale: „Verderben“ bewahrt die ernste, wahrscheinlich eschatologische Tragweite, ohne die mögliche Bedeutung unnötig auf Vernichtung im ontologischen Sinn festzulegen.
- source_word: κοιλία
  choice: Bauch
  rationale: „Bauch“ erhält das konkrete und scharfe Körperbild des griechischen Textes; die Deutung als Begierde oder Appetit bleibt offen.
- source_word: δόξα
  choice: Ehre
  rationale: „Ehre“ ist im Deutschen in dieser Konstruktion natürlich und bewahrt den ironischen Gegensatz zur Schande.
- source_word: αἰσχύνη
  choice: Schande
  rationale: „Schande“ bezeichnet treffend den entehrenden und moralisch beschämenden Charakter dessen, worin sie ihre Ehre suchen.
- source_word: τὰ ἐπίγεια
  choice: das Irdische
  rationale: Die substantivierte Wendung ist knapp, würdig und entspricht dem griechischen neutralen Plural als Sammelbezeichnung.
- source_word: φρονοῦντες
  choice: sind ... bedacht
  rationale: Die Formulierung bezeichnet eine anhaltende innere Ausrichtung und nicht lediglich einzelne Gedanken.
- source_word: ὧν ... ὧν
  choice: ihr ... ihr
  rationale: Die wiederholten deutschen Possessivformen beziehen sich natürlich auf die im vorherigen Zusammenhang genannten Menschen und erhalten die parallele Charakterisierung.
theological_decisions:
- issue: Bildhafte Aussage „ihr Gott ist der Bauch“
  choice: Das konkrete Bild „Bauch“ bleibt im Haupttext erhalten.
  alternative: „Ihr Gott ist ihr Appetit“ oder „ihre Begierde“
  rationale: Der griechische Text benennt den Bauch und lässt die genaue Reichweite des Bildes offen. Eine abstrakte Wiedergabe würde es vorschnell auf Esslust oder Begierde festlegen.
- issue: Bedeutung von ἀπώλεια
  choice: „Verderben“
  alternative: „Vernichtung“ oder „Untergang“
  rationale: „Verderben“ wahrt die starke gerichtliche und eschatologische Aussage, ohne über die Art dieses Endes mehr zu behaupten, als der Ausdruck selbst festlegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der Parallelismus des Griechischen und der abschließende charakterisierende Nachsatz bleiben erhalten.
