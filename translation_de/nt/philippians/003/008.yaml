reference: Philippians 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: de
  text: 'Ja, mehr noch: Ich halte alles für Verlust wegen des alles übertreffenden Wertes der Erkenntnis von Christus Jesus, meinem Herrn. Seinetwegen habe ich den Verlust von allem erlitten und halte es für Unrat[a], damit ich Christus gewinne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet stark abwertend wertlosen Abfall oder Unrat und kann je nach Zusammenhang auch „Kot“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Ja, mehr noch
  rationale: Die Partikelfolge verstärkt und steigert die vorherige Aussage; die Wendung gibt diese fortschreitende Bekräftigung in natürlichem Deutsch wieder.
- source_word: ἡγοῦμαι
  choice: ich halte … für
  rationale: Das Verb bezeichnet eine bewusste Einschätzung oder Wertung und lässt sich an beiden Stellen idiomatisch mit „für etwas halten“ wiedergeben.
- source_word: πάντα / τὰ πάντα
  choice: alles
  rationale: „Alles“ wahrt den umfassenden Geltungsbereich und klingt im Deutschen natürlicher als „alle Dinge“.
- source_word: ζημίαν
  choice: Verlust
  rationale: Die Wahl erhält die ökonomische Gegenüberstellung von Verlust und Gewinn.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: wegen des alles übertreffenden Wertes, … zu kennen
  rationale: Das substantivierte ὑπερέχον bezeichnet die überragende Vorzüglichkeit beziehungsweise den überragenden Wert; der Infinitiv „zu kennen“ gibt γνώσεως im Deutschen natürlich wieder, ohne den persönlichen Erkenntnisbezug auf bloßes Sachwissen einzuengen.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Christus Jesus
  rationale: Im modernen deutschen Bibel- und Allgemeingebrauch ist „Christus“ die verständliche, würdevolle Wiedergabe des Titels Χριστός; die Wortstellung des Griechischen bleibt erhalten.
- source_word: τοῦ κυρίου μου
  choice: meinen Herrn
  rationale: „Herr“ bewahrt die personale Zuordnung und das christologische Gewicht von κύριος.
- source_word: δι’ ὃν
  choice: Seinetwegen
  rationale: Die knappe deutsche Form gibt den personalen Grund beziehungsweise die Ausrichtung des Verlustes idiomatisch wieder.
- source_word: ἐζημιώθην
  choice: habe ich … verloren
  rationale: Die Form bezeichnet tatsächlich erlittenen Verlust. Das deutsche Perfekt ist natürlich und wahrt den Ergebnisbezug; die griechische Passivnuance tritt dabei etwas zurück.
- source_word: σκύβαλα
  choice: Unrat
  rationale: „Unrat“ ist kräftig und abwertend und umfasst wertlosen Abfall beziehungsweise Schmutz, ohne die mögliche derbe Bedeutung unnötig festzulegen.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: damit ich Christus gewinne
  rationale: „Damit“ bewahrt den Zwecksinn von ἵνα, und „gewinne“ führt das Bild von Verlust und Gewinn fort.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: Messias
  rationale: Χριστός ist Titel und kann sachlich „Messias“ bedeuten. Im deutschen Ausdruck „Christus Jesus“ ist „Christus“ jedoch etabliert, verständlich und weiterhin als Titel erkennbar; die Übersetzung legt keine zusätzliche konfessionelle Deutung fest.
- issue: Art der Erkenntnis in τῆς γνώσεως
  choice: Christus Jesus … zu kennen
  alternative: die Erkenntnis Christi Jesu
  rationale: Die Infinitivformulierung bewahrt den persönlichen, relational möglichen Sinn und bleibt zugleich offen dafür, dass γνῶσις mehr als bloße Bekanntschaft umfasst. Die formalere Alternative könnte im Deutschen stärker nach abstraktem Wissen klingen.
- issue: Zweckbeziehung von ἵνα
  choice: damit ich Christus gewinne
  alternative: um Christus zu gewinnen
  rationale: Beide Formen drücken Zweck aus. „Damit“ lässt den Satz trotz des vorangehenden Infinitivs klar und würdevoll ausklingen, ohne die theologische Spannung des Gewinnens Christi zu erklären oder aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Verlust-Gewinn-Metaphorik und die starke Abwertung durch σκύβαλα bleiben erhalten; unnötige Fachsprache und konfessionelle Zusätze werden vermieden.
