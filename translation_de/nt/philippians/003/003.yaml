id: PHP.3.3
reference: Philippians 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: de
  text: 'Denn wir sind die Beschneidung: Wir dienen Gott durch Gottes Geist[a], rühmen uns in Messias Jesus[b] und vertrauen nicht auf das Fleisch[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine abweichende Textlesart lässt sich wiedergeben: »die Gott im Geist dienen«.'
    reason: textual_variant
  - marker: b
    text: »Messias« gibt den Titel Christos wieder, der auch mit »Christus« übersetzt werden kann.
    reason: lexical_alternative
  - marker: c
    text: »Fleisch« bezeichnet hier körperliche oder menschliche Gründe für Selbstvertrauen, etwa Beschneidung, Herkunft oder religiösen Status.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: die Beschneidung
  rationale: Der konkrete Bundesbegriff bleibt erhalten. So bleibt auch Paulus’ zugespitzte Aussage bestehen, dass nicht bloß das körperliche Merkmal bestimmt, wer »die Beschneidung« ist.
- source_word: πνεύματι θεοῦ
  choice: durch Gottes Geist
  rationale: Der Dativ wird instrumental wiedergegeben und bezeichnet bei der Lesart des SBLGNT am natürlichsten Gottes Geist als die Kraft, durch die der Gottesdienst geschieht.
- source_word: λατρεύοντες
  choice: Gott dienen
  rationale: Das Verb bezeichnet religiösen beziehungsweise gottesdienstlichen Dienst. Das im Griechischen nicht ausdrücklich genannte, sachlich vorausgesetzte Objekt »Gott« macht die Wendung im Deutschen natürlich verständlich.
- source_word: καυχώμενοι
  choice: uns … rühmen
  rationale: Die Formulierung bewahrt den rhetorischen Gegensatz zwischen dem Ruhm im Messias und dem Vertrauen auf menschliche Vorzüge.
- source_word: Χριστῷ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός wird hier als lebendiger messianischer Titel verstanden und daher mit »Messias« wiedergegeben; der Genitiv nach »sich rühmen« ergibt natürliches Deutsch.
- source_word: σαρκί
  choice: das Fleisch
  rationale: Die konkrete Metapher bleibt stehen und umfasst im Zusammenhang körperliche und menschliche Vorzüge wie Beschneidung, Herkunft und religiösen Status.
- source_word: πεποιθότες
  choice: vertrauen
  rationale: Das deutsche Verb bringt die gefestigte Zuversicht beziehungsweise das Sichverlassen auf eine Grundlage knapp und idiomatisch zum Ausdruck.
- source_word: γάρ
  choice: Denn
  rationale: »Denn« bewahrt den begründenden Anschluss an die vorausgehende Warnung.
theological_decisions:
- issue: Bedeutung von σάρξ
  choice: »Fleisch« bezeichnet hier vor allem körperliche und menschliche Gründe für religiöses Selbstvertrauen.
  alternative: »Sündige Natur« als inneres moralisches Prinzip.
  rationale: Der folgende Zusammenhang nennt Beschneidung, Abstammung, Gesetzestreue und Ansehen. Deshalb steht hier die menschlich vorweisbare Identität im Vordergrund, ohne die weitere Bedeutungsbreite von σάρξ auszuschließen.
- issue: Bedeutung von πνεύματι θεοῦ
  choice: Gottes Geist ist die Kraft beziehungsweise der Wirkungsbereich des Gottesdienstes.
  alternative: Der menschliche Geist oder ein rein innerlich-geistiger Gottesdienst.
  rationale: Mit der SBLGNT-Lesart θεοῦ verweist die Wendung am natürlichsten auf den Geist Gottes; der Dativ lässt sowohl Mittel als auch Sphäre anklingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt löst die griechische Partizipialkonstruktion verständlich auf, ohne ihre beschreibende Funktion zu verändern. Die wiederholte Nennung von »Gott« ist im Deutschen idiomatischer als ein objektloses »dienen« und hält zugleich »Gottes Geist« klar als eigene Wortgruppe erkennbar.
