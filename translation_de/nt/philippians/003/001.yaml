id: PHP.3.1
reference: Philippians 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: de
  text: Im Übrigen[a], meine Brüder[b], freut euch im Herrn. Euch dasselbe zu schreiben, ist für mich nicht lästig[c], gibt euch aber Sicherheit[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was das Weitere betrifft« oder »Von nun an«; auch die traditionelle Wiedergabe »Schließlich« ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: »Brüder« bezeichnet hier die Gemeinde als Ganze, also Brüder und Schwestern.
    reason: cultural_note
  - marker: c
    text: 'Oder: »macht mir keine Mühe« oder »ist für mich nicht ermüdend«.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: »ist für euch sicher«; oder: »dient euch zur Absicherung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Im Übrigen
  rationale: Die Wendung markiert einen Übergang im Gedankengang. »Im Übrigen« ist im Deutschen natürlich und vermeidet den möglichen Fehlschluss, Paulus leite bereits den unmittelbaren Briefschluss ein.
- source_word: ἀδελφοί μου
  choice: meine Brüder
  rationale: Die grammatisch maskuline Anrede wird formal bewahrt; dass sie hier die ganze Gemeinde einschließlich der Frauen anspricht, wird in einer Fußnote erläutert.
- source_word: χαίρετε
  choice: freut euch
  rationale: Der pluralische Imperativ wird als direkte Aufforderung wiedergegeben und bewahrt den für Paulus charakteristischen Gedanken der Freude.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die Präpositionalphrase wird knapp und traditionsnah wiedergegeben, ohne ihre mögliche Beziehungs- oder Verbundenheitsbedeutung einzuengen.
- source_word: τὰ αὐτά
  choice: dasselbe
  rationale: Die offene Bezugnahme des griechischen Ausdrucks bleibt erhalten; der Text legt nicht ausdrücklich fest, welche bereits genannten Inhalte Paulus wiederholt.
- source_word: γράφειν
  choice: zu schreiben
  rationale: Der griechische Infinitiv wird in der deutschen Konstruktion unmittelbar als Infinitiv wiedergegeben.
- source_word: οὐκ ὀκνηρόν
  choice: ist für mich nicht lästig
  rationale: Die Formulierung vermittelt, dass das wiederholte Schreiben Paulus weder belastet noch davon abhält, ohne die Bedeutung auf bloße Langeweile zu verengen.
- source_word: ἀσφαλές
  choice: gibt euch aber Sicherheit
  rationale: Eine rein formale Wiedergabe als »ist für euch sicher« wäre im heutigen Deutsch missverständlich. Die gewählte Formulierung bringt die schützende beziehungsweise festigende Wirkung idiomatisch zum Ausdruck, ohne deren genaue Art festzulegen.
theological_decisions:
- issue: Geschlechtsspezifische Anrede der Gemeinde
  choice: meine Brüder
  alternative: meine Brüder und Schwestern
  rationale: Der Haupttext bewahrt die grammatisch maskuline Form des Griechischen. Die inklusive Bezugnahme auf die ganze Gemeinde wird ausdrücklich in der Fußnote kenntlich gemacht.
- issue: Schützende Wirkung der wiederholten Unterweisung
  choice: gibt euch aber Sicherheit
  alternative: ist für euch sicher; dient euch aber zur Absicherung
  rationale: Die Übersetzung hält am Schutz- und Sicherheitsgedanken fest, bestimmt aber nicht näher, ob Paulus vor allem an Schutz vor Irrlehre, an Festigung im Glauben oder an eine andere Art von Sicherheit denkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem deutschen Sprachgebrauch, während der Gegensatz »für mich … für euch aber« und die offene Bezugnahme von »dasselbe« erhalten bleiben.
