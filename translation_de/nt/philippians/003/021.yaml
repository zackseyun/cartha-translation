review_pass:
  verdict: revise
  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: Christus wird den gegenwärtig niedrigen Leib verwandeln und ihn seinem herrlichen Leib gleichgestalten. Der Entwurf enthält jedoch in der Gleichgestaltungs-Konstruktion einen Tempus- und Syntaxfehler: „sodass er … gleichgestaltet ist“ setzt ein Präsens voraus, während das griechische Futur die zukünftige Gleichgestaltung ausdrückt. „Nach der wirksamen Kraft“ gibt κατὰ τὴν ἐνέργειαν genauer wieder als „durch die wirksame Kraft“ und bewahrt die modale Zuordnung der Kraft zu Christi Fähigkeit.'
  naturalness: „Unseren niedrigen Leib“ und „seinem herrlichen Leib gleichgestalten“ sind modernes, würdiges und gut verständliches Standarddeutsch. Die revidierte Satzfügung ist grammatisch geschlossen und vermeidet die im Entwurf missglückte resultative Präsensform.
  terminology: „Leib“, „verwandeln“, „gleichgestalten“, „Herrlichkeit“ und „sich selbst alles unterwerfen“ entsprechen dem paulinischen Register und den maßgeblichen griechischen Ausdrücken. „Herrlicher Leib“ ist im Haupttext idiomatisch; die Fußnote erhält die wörtliche Genitivfügung „Leib seiner Herrlichkeit“.
  issues:
  - severity: high
    issue: Die Formulierung „sodass er seinem Leib in Herrlichkeit gleichgestaltet ist“ steht im Präsens und ist syntaktisch nicht passend an das Futur „verwandeln wird“ angeschlossen.
    rationale: σύμμορφον bezeichnet das Ergebnis der zukünftigen Verwandlung. Die Übersetzung muss daher ebenfalls eine zukünftige Gleichgestaltung ausdrücken, ohne den Bezug des Pronomens „er“ missverständlich zu machen.
  - severity: medium
    issue: „Durch die wirksame Kraft“ schwächt die Bedeutung von κατὰ („gemäß/nach/entsprechend“) ab.
    rationale: Die Präposition beschreibt die Verwandlung als entsprechend der wirksamen Kraft bzw. Wirksamkeit, durch die Christus alles unterwerfen kann. „Nach der wirksamen Kraft“ wahrt diesen Zusammenhang natürlicher und genauer.
  - severity: low
    issue: Die Fußnote c ist als „Oder“ gekennzeichnet, obwohl sie im Wesentlichen eine stärker formnahe Wiedergabe der gewählten Aussage bietet.
    rationale: Eine Kennzeichnung als wörtliche Wiedergabe ist für die strukturelle Entsprechung von κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι hilfreicher.
  revised_text: der unseren niedrigen Leib seinem herrlichen Leib gleichgestalten wird, nach der wirksamen Kraft, mit der er sich sogar alles unterwerfen kann.[a][b][c]
