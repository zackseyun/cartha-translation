    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: verwandeln wird
  rationale: Das Verb bezeichnet eine wirkliche Veränderung der Gestalt oder Beschaffenheit; „verwandeln“ gibt die zukünftige Handlung klar und kraftvoll wieder.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: unseren niedrigen Leib
  rationale: Die Genitivfügung bezeichnet den Leib in seinem gegenwärtigen Zustand der Niedrigkeit. „Unseren niedrigen Leib“ ist im Deutschen natürlich und bewahrt diesen Gegensatz zur Herrlichkeit.
- source_word: σύμμορφον
  choice: sodass er … gleichgestaltet ist
  rationale: „Gleichgestaltet“ wahrt die starke Entsprechung der Form, während die resultative Fügung den Zusammenhang mit „verwandeln“ idiomatisch ausdrückt.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: seinem Leib in Herrlichkeit
  rationale: Diese Wiedergabe hält die ungewöhnliche Genitivverbindung „Leib seiner Herrlichkeit“ erkennbar, klingt aber im modernen Deutschen verständlicher als eine rein wörtliche Form.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: durch die wirksame Kraft
  rationale: ἐνέργεια bezeichnet hier wirksame, tätige Kraft. Die Formulierung verbindet natürliche deutsche Sprache mit dem Gedanken tatsächlich ausgeübter Macht.
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: mit der er … kann
  rationale: Die Konstruktion erläutert Christi wirksame Kraft durch sein Vermögen; „mit der er … kann“ stellt diesen Bezug klar her.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: sich sogar alles unterwerfen
  rationale: „Unterwerfen“ bewahrt die starke verbale Aussage, und „alles“ erhält den uneingeschränkten Umfang von τὰ πάντα.
theological_decisions:
- issue: Verhältnis der gegenwärtigen leiblichen Niedrigkeit zur zukünftigen Herrlichkeit
  choice: Der Vers beschreibt die zukünftige Verwandlung des gegenwärtig niedrigen Leibes der Glaubenden zur Gleichgestalt mit Christi Leib in Herrlichkeit.
  alternative: Die Übersetzung könnte ausdrücklich von Auferstehung sprechen.
  rationale: Der griechische Text bezeugt klar eine leibliche Verwandlung und Gleichgestaltung, benennt hier aber nicht ausdrücklich deren Vorgang als Auferstehung. Diese Spannung bleibt erhalten.
- issue: Bedeutung der Unterwerfung aller Dinge
  choice: Die umfassende Aussage „alles“ bleibt ohne nähere Einschränkung stehen.
  alternative: Man könnte interpretierend „alles unter seine Herrschaft bringen“ schreiben.
  rationale: Die direkte Wiedergabe vermeidet eine unnötige Auslegung und bewahrt sowohl die Universalität als auch die Kraft von ὑποτάσσω.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib“ wurde statt „Körper“ gewählt, weil es im paulinischen Zusammenhang natürlich und theologisch unbelastet die personale Leiblichkeit bezeichnet. Die Hauptfassung ist verständlich gehalten; die Fußnoten sichern die markanten Genitivfügungen und die formellere Wiedergabe von ἐνέργεια.
