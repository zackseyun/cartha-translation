base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: de
  text: der unseren niedrigen Leib seinem herrlichen Leib gleichgestalten wird, nach der wirksamen Kraft, mit der er sich sogar alles unterwerfen kann.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
