reference: Philippians 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: de
  text: Ahmt mich gemeinsam nach, Geschwister,[a] und achtet auf diejenigen, die so leben, wie ihr uns zum Vorbild habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen eine maskuline Pluralform („Brüder“), die hier wahrscheinlich die ganze Gemeinde anspricht.
    reason: cultural_note
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: Werdet gemeinsam meine Nachahmer
  rationale: Die Verbindung aus Συμμιμηταί und γίνεσθε fordert dazu auf, Paulus gemeinsam nachzuahmen. „Gemeinsam“ bewahrt den im Präfix συν- liegenden gemeinschaftlichen Sinn, während „werdet … Nachahmer“ den Imperativ und seine mögliche Entwicklungskomponente wiedergibt.
- source_word: ἀδελφοί
  choice: Geschwister
  rationale: Der maskuline griechische Plural kann in diesem Anredegebrauch die gesamte Gemeinde einschließen. Das deutsche „Geschwister“ ist eine natürliche, würdevolle Sammelbezeichnung; eine Fußnote weist auf die Form des griechischen Ausdrucks hin.
- source_word: σκοπεῖτε
  choice: achtet auf
  rationale: Das Verb bezeichnet aufmerksames Beobachten bzw. Beachten. „Achtet auf“ ist im modernen Deutsch klar und lässt sowohl das Wahrnehmen als auch die Orientierung an diesen Menschen anklingen.
- source_word: οὕτω περιπατοῦντας
  choice: die so leben
  rationale: περιπατέω ist hier bildlich für die Lebensführung gebraucht. „So leben“ gibt den gemeinten Sinn natürlicher wieder als das im Deutschen potenziell missverständliche „so wandeln“.
- source_word: τύπον
  choice: Vorbild
  rationale: τύπος bezeichnet hier ein nachahmenswertes Muster oder Beispiel. „Vorbild“ passt idiomatisch zur Wendung „jemanden zum Vorbild haben“ und bewahrt die exemplarische Funktion.
- source_word: ἡμᾶς
  choice: uns
  rationale: Der Plural wird beibehalten und nicht auf Paulus allein verengt; er kann Paulus und seine Mitarbeiter umfassen.
theological_decisions:
- issue: Inklusiver Bezug von ἀδελφοί
  choice: „Geschwister“ im Haupttext mit Hinweis auf die grammatisch maskuline griechische Form
  alternative: „Brüder“ im Haupttext und Erläuterung der möglichen Einbeziehung von Frauen in einer Fußnote
  rationale: Obwohl die Form grammatisch maskulin ist, dient ἀδελφοί in der gemeindlichen Anrede sehr wahrscheinlich der gesamten versammelten Glaubensgemeinschaft. „Geschwister“ bildet diesen pragmatischen Bezug im heutigen Deutsch präzise ab, ohne eine ausschließlich männliche Adressatengruppe zu behaupten.
- issue: Wer als Vorbild dient
  choice: Den griechischen Plural „uns“ beibehalten
  alternative: Sinngemäß auf Paulus allein beziehen und mit „mich“ übersetzen
  rationale: Der Text wechselt ausdrücklich von „meine Nachahmer“ zum Plural ἡμᾶς. Diese Spannung darf nicht eingeebnet werden; der Plural kann Paulus zusammen mit seinen Mitarbeitern bezeichnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die ungewöhnliche gemeinschaftliche Kraft von Συμμιμηταί wird durch „gemeinsam“ sichtbar gemacht. Die paulinische Metapher des Wandelns wird zugunsten des im Deutschen klaren Lebensbezugs sinnvoll wiedergegeben; der Wechsel vom Singular „meine“ zum Plural „uns“ bleibt erhalten.
