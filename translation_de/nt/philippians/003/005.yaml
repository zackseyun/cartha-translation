  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: de
  text: am achten Tag beschnitten, aus dem Volk Israel, aus dem Stamm Benjamin, ein Hebräer von Hebräern[a]; dem Gesetz nach ein Pharisäer,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Hebräer aus Hebräern“; die Wendung unterstreicht Paulus’ hebräische Herkunft und Zugehörigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: am achten Tag beschnitten
  rationale: Die natürliche deutsche Wendung gibt die knappe griechische Formulierung präzise wieder und bewahrt den jüdischen Bundesbezug der Beschneidung.
- source_word: ἐκ γένους Ἰσραήλ
  choice: aus dem Volk Israel
  rationale: γένος bezeichnet hier Abstammung und Volkszugehörigkeit. „Aus dem Volk Israel“ ist im modernen Deutsch klar und würdevoll.
- source_word: φυλῆς Βενιαμίν
  choice: aus dem Stamm Benjamin
  rationale: Die Genitivverbindung bezeichnet die Stammeszugehörigkeit; im Deutschen ist „aus dem Stamm Benjamin“ idiomatisch und eindeutig.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: ein Hebräer von Hebräern
  rationale: Die knappe, betonte Formulierung bleibt nahe am Griechischen und bewahrt die mögliche Verbindung von hebräischer Abstammung und Identität, ohne sie im Haupttext einseitig auszulegen.
- source_word: κατὰ νόμον
  choice: dem Gesetz nach
  rationale: Die idiomatische deutsche Wendung bezeichnet den Gesichtspunkt beziehungsweise Maßstab, unter dem Paulus sich als Pharisäer einordnet.
- source_word: Φαρισαῖος
  choice: ein Pharisäer
  rationale: „Pharisäer“ ist die etablierte deutsche Bezeichnung der jüdischen Gruppierung.
theological_decisions:
- issue: Bedeutung von Ἑβραῖος ἐξ Ἑβραίων
  choice: ein Hebräer von Hebräern
  alternative: ein als Hebräer geborener Sohn von Hebräern
  rationale: Der Haupttext wahrt die Dichte und Mehrdeutigkeit des griechischen Ausdrucks; die mögliche Betonung von Herkunft und Geburt wird in der Fußnote erläutert, statt fest in den Text eingebaut zu werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die aufzählende Struktur und der abschließende Gedankenanschluss des Versfragments bleiben erhalten.
