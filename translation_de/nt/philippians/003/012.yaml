id: PHP.3.12
reference: Philippians 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: de
  text: Nicht, dass ich es schon erlangt hätte oder schon vollendet wäre[a]. Ich strebe aber danach, ob ich es auch ergreifen kann, weil auch ich von Christus[b] ergriffen worden bin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schon vollkommen wäre“; auch: „schon zur Vollendung gebracht worden wäre“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch Christos; auch: „Messias“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wozu auch ich von Christus ergriffen worden bin“. Die griechische Wendung kann den Grund oder das Ziel bezeichnen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἔλαβον
  choice: es schon erlangt hätte
  rationale: Das im Griechischen unausgesprochene Objekt ergibt sich aus dem Zusammenhang. „Erlangt“ passt zum noch nicht erreichten Ziel und ist im Deutschen natürlicher als „empfangen“.
- source_word: τετελείωμαι
  choice: schon vollendet wäre
  rationale: Die Form bezeichnet einen erreichten Zustand und ist formal passiv; „vollendet wäre“ bewahrt diese Offenheit, ohne eine spätere Lehre von Sündlosigkeit einzutragen.
- source_word: διώκω
  choice: ich jage ihm aber nach
  rationale: „Nachjagen“ gibt die energische, fortdauernde Verfolgung eines Zieles wieder und nimmt durch „ihm“ das aus dem Kontext erschlossene Ziel auf.
- source_word: καταλάβω
  choice: um es vielleicht zu ergreifen
  rationale: „Ergreifen“ bewahrt die konkrete Bildsprache und die Wortverbindung mit dem folgenden Passiv κατελήμφθην.
- source_word: εἰ καί
  choice: um es vielleicht
  rationale: Im Zusammenhang drückt die Wendung ein angestrebtes, noch nicht als erreicht vorausgesetztes Ziel aus; „vielleicht“ erhält dieses Moment der Offenheit.
- source_word: ἐφ’ ᾧ
  choice: weil
  rationale: Die Wendung kann hier kausal oder zielbezogen verstanden werden. Im Haupttext steht die gut mögliche kausale Lesart; die zielbezogene Alternative wird in einer Fußnote bewahrt.
- source_word: κατελήμφθην
  choice: ich … ergriffen worden bin
  rationale: Das Passiv bleibt ausdrücklich erhalten, und „ergriffen“ wahrt das Wortspiel mit „ergreifen“.
- source_word: Χριστοῦ
  choice: Christus
  rationale: Bei Paulus wird Χριστός häufig wie eine Namensbezeichnung gebraucht; „Christus“ ist im Deutschen die natürliche Wiedergabe, während die Titelbedeutung „Messias“ in der Fußnote genannt wird.
theological_decisions:
- issue: Ob τετελείωμαι eine Lehre sündloser Vollkommenheit bezeichnet
  choice: schon vollendet wäre
  alternative: schon vollkommen wäre / schon zur Vollendung gebracht worden wäre
  rationale: Paulus verneint, den bezeichneten Endzustand bereits erreicht zu haben. Die Übersetzung lässt offen, wie dieser Zustand systematisch-theologisch zu bestimmen ist.
- issue: Deutung von ἐφ’ ᾧ als Grund oder Ziel
  choice: weil auch ich von Christus ergriffen worden bin
  alternative: wozu auch ich von Christus ergriffen worden bin
  rationale: Beide Deutungen sind sprachlich möglich. Die kausale Lesart versteht Christi Ergreifen als Grundlage für das Streben des Paulus; die Fußnote hält die zielbezogene Lesart ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „ergreifen/ergriffen“ bildet das griechische Wortspiel ab. Der Konjunktiv in „erlangt hätte“ folgt natürlich auf „Nicht, dass …“; „ihm nachjagen“ bewahrt die Bewegungsmetaphorik.
