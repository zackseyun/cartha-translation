revisions:
- from: Nicht, dass ich es schon erlangt hätte oder schon vollendet wäre[a]; ich jage ihm aber nach, um es vielleicht zu ergreifen, weil auch ich von Christus[b] ergriffen worden bin.[c]
  to: Nicht, dass ich es schon erlangt hätte oder schon vollendet wäre[a]. Ich strebe aber danach, ob ich es auch ergreifen kann, weil auch ich von Christus[b] ergriffen worden bin.[c]
  rationale: Die Revision ersetzt die zu unbestimmte Wiedergabe von εἰ καί durch eine deutsche ob-Satz-Konstruktion und glättet den Rückverweis auf das implizite Ziel. Die kausale Haupttextlesart von ἐφ’ ᾧ wird nicht als alleinige Deutung ausgegeben; die Zieldeutung bleibt ausdrücklich in der Fußnote erhalten. Das griechische Wortspiel bleibt mit „ergreifen/ergriffen“ bestehen.
  reviewer_model: gpt-5.6-terra
