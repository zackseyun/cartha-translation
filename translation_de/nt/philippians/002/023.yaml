  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτον μὲν οὖν ἐλπίζω πέμψαι ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ ἐξαυτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: de
  text: Ihn hoffe ich nun zu euch zu schicken, sobald ich klar sehe, wie es um mich steht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihn hoffe ich nun zu euch zu schicken, sobald ich meine Lage klar überblicke.“'
    reason: Die Verbindung ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ ἐξαυτῆς kann entweder näher an ihrem Bild („klar sehe, wie es um mich steht“) oder zusammenfassend als klares Erfassen der eigenen Lage wiedergegeben werden.
lexical_decisions:
- source_word: τοῦτον
  choice: ihn
  rationale: Das Demonstrativpronomen verweist im unmittelbaren Zusammenhang auf Timotheus; im modernen Deutschen ist das Personalpronomen natürlich und eindeutig.
- source_word: μὲν οὖν
  choice: nun
  rationale: Die Partikelverbindung führt folgernd zum nächsten Gedanken über. „Nun“ gibt diesen Übergang idiomatisch wieder, ohne ihn mit einem starken „deshalb“ zu überzeichnen.
- source_word: ἐλπίζω πέμψαι
  choice: hoffe ich … zu schicken
  rationale: Die Verbindung bezeichnet Paulus’ Hoffnung beziehungsweise Erwartung, Timotheus zu senden; die deutsche Infinitivkonstruktion entspricht dem Sinn und klingt natürlich.
- source_word: ὡς ἂν ἀφίδω
  choice: sobald ich klar sehe
  rationale: Die Konstruktion bezeichnet einen noch unbestimmten zukünftigen Zeitpunkt, der davon abhängt, dass Paulus seine Lage überblickt; „sobald“ bewahrt zugleich den zeitlichen und erwartenden Sinn.
- source_word: ἀφίδω
  choice: ich klar sehe
  rationale: Das Verb kann ein genaues Sehen oder Erkennen bezeichnen. „klar sehe“ erhält das Bild und vermittelt, dass Paulus zunächst Gewissheit über seine Lage gewinnen will.
- source_word: τὰ περὶ ἐμέ
  choice: wie es um mich steht
  rationale: Die substantivierte Wendung meint die Paulus betreffenden Umstände. Die gewählte Formulierung ist gegenwärtiges, verständliches Deutsch.
- source_word: ἐξαυτῆς
  choice: sobald
  rationale: Das Adverb betont die Unmittelbarkeit. Im Deutschen lässt sich diese am natürlichsten in die temporale Konjunktion „sobald“ einbeziehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung von „ihn“ bewahrt die rückverweisende Hervorhebung des griechischen τοῦτον; „zu euch“ wird aus dem Kontext als Ziel des Sendens ergänzt, damit der deutsche Satz natürlich und eindeutig ist.
