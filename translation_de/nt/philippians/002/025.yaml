id: PHP.2.25
reference: Philippians 2:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: de
  text: 'Doch ich hielt es für nötig, Epaphroditus zu euch zu senden: meinen Bruder, Mitarbeiter und Mitstreiter, zugleich aber euren Gesandten[a] und den, der mir bei dem dient, was ich brauche[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Apostel« – das heißt hier: einer, den ihr ausgesandt habt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Diener für meinen Bedarf«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: für nötig
  rationale: Gibt die von Paulus beurteilte Notwendigkeit in natürlichem Deutsch wieder.
- source_word: ἡγησάμην
  choice: ich hielt es
  rationale: Drückt zusammen mit »für nötig« das abwägende Urteil des Aorists von ἡγέομαι idiomatisch aus.
- source_word: πέμψαι
  choice: zu senden
  rationale: Gibt den Infinitiv ohne die kontextuell mögliche, aber nicht ausdrücklich im Verb enthaltene Ergänzung »zurück« wieder.
- source_word: ἀδελφὸν
  choice: Bruder
  rationale: Bewahrt die familiäre Bezeichnung für einen Glaubensbruder, ohne sie erklärend auszuweiten.
- source_word: συνεργὸν
  choice: Mitarbeiter
  rationale: Ist die natürliche deutsche Bezeichnung für jemanden, der gemeinsam mit Paulus arbeitet.
- source_word: συστρατιώτην
  choice: Mitstreiter
  rationale: Bewahrt die militärische Metapher, klingt im Deutschen jedoch natürlicher als »Mitsoldat«.
- source_word: ἀπόστολον
  choice: Gesandten
  rationale: Bezeichnet hier plausibel den von der Gemeinde entsandten Vertreter, ohne zwingend das besondere Apostelamt anzunehmen.
- source_word: λειτουργὸν τῆς χρείας μου
  choice: den, der mir in meiner Notlage dient
  rationale: Gibt den würdevollen Dienst an Paulus und den Bezug auf seinen konkreten Bedarf in verständlichem, nicht bürokratischem Deutsch wieder.
theological_decisions:
- issue: Ob ἀπόστολον technisch als »Apostel« oder allgemein als »Gesandter« zu verstehen ist
  choice: Gesandter
  alternative: Apostel
  rationale: Der Zusammenhang beschreibt Epaphroditus als den von den Philippern zu Paulus Gesandten. »Gesandter« wahrt diesen Sinn, während die Fußnote die echte lexikalische und theologische Möglichkeit »Apostel« offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die nachgestellte Beschreibung Epaphroditus’ übersichtlich; »zugleich aber« bildet den Wechsel von Paulus’ Beziehung zu ihm zu seiner Beauftragung durch die Philipper ab. Die Formulierung vermeidet sowohl ein modernes kirchliches Amtsverständnis von »Diener« als auch die vorschnelle Festlegung von ἀπόστολος auf das besondere Apostelamt.
