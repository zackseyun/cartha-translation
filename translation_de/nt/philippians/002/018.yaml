  source_fidelity: 'Der Grundsinn ist zutreffend: τὸ δὲ αὐτὸ wird sinnvoll adverbial mit „Ebenso“ wiedergegeben, und die beiden semantisch verwandten Imperative werden erkennbar wiederholt. „sollt ... euch freuen“ schwächt jedoch die zwei griechischen Präsensimperative unnötig zu einer modalen Aussage ab.'
