  yaml_path: translation/nt/philippians/002/018.yaml
  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: de
  text: Ebenso freut auch ihr euch und freut euch mit mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Freut auch ihr euch ebenso und freut euch mit mir.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: Ebenso
  rationale: Die Wendung τὸ αὐτό wird hier adverbial gebraucht und knüpft mit δέ an den vorausgehenden Gedanken gemeinsamer Freude an. „Ebenso“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: χαίρετε
  choice: sollt ... euch freuen
  rationale: Der Präsensimperativ in der zweiten Person Plural wird als Aufforderung wiedergegeben. Die Konstruktion mit „sollt“ ist im Satzfluss idiomatisch und bewahrt den auffordernden Charakter.
- source_word: συγχαίρετέ
  choice: euch mit mir freuen
  rationale: Das zusammengesetzte Verb bezeichnet mitgeteilte beziehungsweise gemeinsam empfundene Freude. „Sich mit mir freuen“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: μοι
  choice: mit mir
  rationale: Der Dativ bezeichnet Paulus als denjenigen, mit dem die Adressaten die Freude teilen sollen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von „freuen“ bleibt erhalten, weil sie die Wortverwandtschaft von χαίρετε und συγχαίρετέ sichtbar macht.
