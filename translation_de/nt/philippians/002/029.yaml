  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: de
  text: Nehmt ihn also im Herrn mit großer Freude auf und haltet Menschen wie ihn in Ehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδέχεσθε
  choice: Nehmt … auf
  rationale: Der Imperativ bezeichnet hier eine bereitwillige, herzliche Aufnahme; „aufnehmen“ ist im Deutschen natürlich und bewahrt zugleich die Grundbedeutung.
- source_word: οὖν
  choice: also
  rationale: „Also“ gibt die folgernde Funktion im Zusammenhang idiomatisch wieder.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die knappe paulinische Wendung bleibt erhalten, ohne ihre relationale und geistliche Bedeutung durch eine Paraphrase festzulegen.
- source_word: μετὰ πάσης χαρᾶς
  choice: mit großer Freude
  rationale: Im Deutschen bringt „mit großer Freude“ die volle, uneingeschränkte Freude idiomatischer zum Ausdruck als das ungewöhnliche „mit aller Freude“.
- source_word: τοὺς τοιούτους
  choice: Menschen wie ihn
  rationale: Die Wendung bezeichnet Personen dieser Art und stellt Epaphroditus als konkretes Beispiel heraus. Das grammatische Maskulinum kann im Griechischen generisch gebraucht werden.
- source_word: ἐντίμους ἔχετε
  choice: haltet … in Ehren
  rationale: Die feste deutsche Wendung gibt den Sinn wieder, solche Menschen als ehrenwert anzusehen und entsprechend zu behandeln.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle paulinische Formel „im Herrn“ wurde wegen ihrer inhaltlichen Dichte beibehalten; der übrige Satz ist bewusst unmittelbar und allgemein verständlich formuliert.
