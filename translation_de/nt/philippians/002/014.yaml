  text: Πάντα ποιεῖτε χωρὶς γογγυσμῶν καὶ διαλογισμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/014.yaml
  text: Do everything without grumbling or arguing[b][a],
translation:
  language: de
  text: Tut alles, ohne zu murren oder zu streiten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne zu murren oder Einwände zu erheben“; das letzte Wort kann auch Zweifel, Überlegungen oder Auseinandersetzungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: alles
  rationale: Das substantivisch gebrauchte Akkusativ Plural Neutrum von πᾶς bezeichnet umfassend alles, was getan wird; „alles“ ist im Deutschen natürlich und bewahrt den uneingeschränkten Geltungsbereich.
- source_word: ποιεῖτε
  choice: Tut
  rationale: Der Präsensimperativ fordert zu einer fortlaufend geprägten Handlungsweise auf. „Tut“ gibt den direkten Imperativ knapp, würdig und idiomatisch wieder.
- source_word: χωρὶς
  choice: ohne
  rationale: χωρίς mit Genitiv bezeichnet hier das, was beim Handeln fehlen soll; „ohne“ ist die klare und natürliche deutsche Entsprechung.
- source_word: γογγυσμῶν
  choice: Murren
  rationale: γογγυσμός bezeichnet unzufriedenes, oft halblautes Klagen. „Murren“ bewahrt zudem den möglichen Anklang an Israels Murren in der Wüste.
- source_word: διαλογισμῶν
  choice: Streiten
  rationale: διαλογισμός kann Überlegungen, Zweifel oder Auseinandersetzungen bezeichnen. Im vorliegenden Mahnkontext ist streitendes Diskutieren wahrscheinlich; „Streiten“ ist verständlich und lässt sich natürlich mit „Murren“ verbinden.
theological_decisions:
- issue: Bedeutungsumfang von διαλογισμῶν
  choice: streiten
  alternative: Zweifeln, Einwände oder Auseinandersetzungen
  rationale: Der Kontext legt zwischenmenschliche, widerstrebende Auseinandersetzungen nahe, doch das Wort kann auch innere Überlegungen oder Zweifel bezeichnen. Diese Mehrdeutigkeit wird in der Fußnote offengelegt und nicht dogmatisch verengt.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit würdigem biblischem Ton. „Murren“ ist geläufig, aber leicht gehoben und bewahrt die alttestamentliche Resonanz; die mögliche Bedeutungsbreite von διαλογισμῶν wird durch eine Fußnote sichtbar gemacht.
