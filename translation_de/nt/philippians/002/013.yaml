review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt γάρ, den Plural ἐν ὑμῖν sowie die parallelen articularen Infinitive τὸ θέλειν und τὸ ἐνεργεῖν sachgerecht wieder. Der Schlussausdruck ὑπὲρ τῆς εὐδοκίας bezeichnet einen Ziel- bzw. Bezugsaspekt; »zu seinem Wohlgefallen« ist hierfür im Deutschen idiomatisch und wahrt den Bezug auf Gottes Wohlgefallen, ohne eine weitergehende theologische Deutung einzutragen.
  naturalness: '»in euch beides wirkt: das Wollen und das Wirken« ist verständlich, aber die Verbindung »das Wollen wirken« wirkt im modernen Standarddeutsch unnötig sperrig. »sowohl das Wollen als auch das Wirken bewirkt« bildet die griechische Parallelität klar und natürlich ab. Der Gedankenstrich vor »für sein Wohlgefallen« schwächt zudem die enge Anbindung des Schlussausdrucks an den gesamten Doppelbegriff.'
  terminology: »Wollen« und »Wirken« sind als parallele Wiedergaben der beiden Infinitive angemessen; »bewirkt« für ἐνεργῶν erlaubt die bewusste Beibehaltung von »Wirken« für ἐνεργεῖν. »Wohlgefallen« ist ein etablierter, registergerechter Ausdruck für εὐδοκία.
