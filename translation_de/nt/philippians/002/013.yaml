  - severity: low
    issue: Wiedergabe und Anbindung von ὑπὲρ τῆς εὐδοκίας
    rationale: »Zu seinem Wohlgefallen« ist im Deutschen die natürlichere zielbezogene Wiedergabe. Ohne Gedankenstrich wird deutlicher, dass der Ausdruck den ganzen vorherigen Vorgang betrifft.
