  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: de
  text: Denn Gott ist es, der in euch sowohl das Wollen als auch das Wirken zu seinem Wohlgefallen bewirkt[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sowohl zu wollen als auch zu wirken«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für sein Wohlgefallen« oder »gemäß seinem Wohlgefallen«. Im Griechischen steht kein ausdrückliches Possessivpronomen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Kennzeichnet die Aussage als Begründung der vorausgehenden Ermahnung und bewahrt den argumentativen Anschluss.
- source_word: ὁ ἐνεργῶν
  choice: der … wirkt
  rationale: Das substantivierte Präsenspartizip bezeichnet Gott als den fortdauernd Wirkenden; die deutsche Relativkonstruktion ist natürlich und erhält die verbale Aussage.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Bewahrt die mögliche individuelle wie gemeinschaftliche Reichweite des griechischen Plurals, ohne sie auf eine der beiden Deutungen festzulegen.
- source_word: τὸ θέλειν
  choice: das Wollen
  rationale: Der substantivierte Infinitiv bezeichnet den Willensvollzug und steht parallel zu »das Wirken«.
- source_word: τὸ ἐνεργεῖν
  choice: das Wirken
  rationale: Bewahrt die lexikalische Verbindung zu ἐνεργῶν und die Parallelität der beiden substantivierten Infinitive; »Vollbringen« wäre idiomatischer, würde den Sinn aber stärker auf den erfolgreichen Abschluss verengen.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: für sein Wohlgefallen
  rationale: Gibt ὑπέρ mit dem Genitiv als Ziel- beziehungsweise Zweckbezug wieder. »Sein« bezieht das Wohlgefallen verständlich auf Gott, bleibt aber wegen des im Griechischen fehlenden Possessivpronomens in einer Fußnote transparent.
theological_decisions:
- issue: Göttliches Wirken und menschliches Wollen und Wirken
  choice: Beide Bereiche, Wollen und Wirken, werden ausdrücklich als Gegenstand von Gottes Wirken bezeichnet.
  alternative: Gott schenkt nur den Wunsch oder lediglich die Fähigkeit zum Handeln.
  rationale: Der griechische Text nennt beide substantivierten Infinitive parallel und erklärt weder das menschliche Handeln für unwirklich noch begrenzt er Gottes Wirken auf nur einen Bereich.
- issue: Bezug von εὐδοκία
  choice: Das Wohlgefallen wird im Haupttext auf Gott bezogen.
  alternative: Unbestimmt »für das Wohlgefallen« oder modal »gemäß dem Wohlgefallen«.
  rationale: Der unmittelbare Bezug auf Gott macht die possessive Wiedergabe kontextuell plausibel; die sprachliche Offenheit hinsichtlich der Präposition und des nicht ausdrücklich gesetzten Possessivs wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »wirkt … Wirken« ist bewusst beibehalten, um die Wortverbindung zwischen ἐνεργῶν und ἐνεργεῖν sichtbar zu machen. Der Doppelpunkt verdeutlicht idiomatisch, worauf sich »beides« bezieht; der Gedankenstrich hebt den abschließenden Zielbezug ab.
