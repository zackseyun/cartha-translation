  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: de
  text: Jeder achte nicht nur auf das Eigene[a], sondern auch auf das der anderen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jeder achte nicht auf die eigenen Dinge, sondern auch auf die der anderen.“ Gemeint sind nicht nur Besitztümer, sondern allgemein eigene und fremde Angelegenheiten oder Belange.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: achte auf
  rationale: Das Verb bezeichnet hier das aufmerksame Beachten und Berücksichtigen. „Auf etwas achten“ ist im Deutschen natürlich und bewahrt den Gedanken bewusster Zuwendung.
- source_word: τὰ ἑαυτῶν
  choice: das Eigene
  rationale: Die substantivierte Wendung ist weiter als bloßer Besitz und umfasst eigene Angelegenheiten, Interessen und Belange. „Das Eigene“ hält diese Breite fest.
- source_word: ἕκαστοι
  choice: Jeder
  rationale: Die distributive Form nimmt die Angesprochenen einzeln in die Pflicht. „Jeder“ gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: ἀλλὰ καὶ
  choice: nicht nur … sondern auch
  rationale: Obwohl im überlieferten griechischen Wortlaut beim ersten Glied kein ausdrückliches μόνον steht, ergibt sich aus μὴ … ἀλλὰ καὶ idiomatisch die ergänzende Gegenüberstellung „nicht nur … sondern auch“; die eigenen Belange werden also nicht ausgeschlossen.
- source_word: τὰ ἑτέρων
  choice: das der anderen
  rationale: Die parallele substantivierte Wendung meint die Angelegenheiten, Interessen oder Belange anderer. Die Ellipse „das der anderen“ erhält die formale Parallelität und semantische Offenheit.
theological_decisions:
- issue: Verhältnis zwischen eigenen und fremden Belangen
  choice: „nicht nur … sondern auch“
  alternative: „nicht auf das Eigene, sondern auch auf das der anderen“
  rationale: Die Formulierung vermeidet den Eindruck, eigene Angelegenheiten müssten völlig unbeachtet bleiben. Das καί kennzeichnet die Belange anderer als hinzukommenden Gegenstand der Aufmerksamkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Eigene“ und „das der anderen“ bewahren die Weite und Parallelität der griechischen substantivierten Neutra; die Fußnote erläutert die wörtlichere Form.
