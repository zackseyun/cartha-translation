id: PHP.2.11
reference: Philippians 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: de
  text: und jede Zunge bekennen soll, dass Jesus Christus Herr ist – zur Ehre Gottes, des Vaters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und jede Zunge bekennen soll, dass Jesus, der Messias, Herr ist – zur Ehre Gottes, des Vaters.“'
    reason: Bewahrt die ausdrücklich übersetzte Titelfunktion von Χριστός.
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: jede Zunge
  rationale: Die körperliche Metapher des Griechischen bleibt erhalten und ist im Deutschen als Ausdruck des universalen Bekennens verständlich.
- source_word: ἐξομολογήσηται
  choice: bekennt
  rationale: „Bekennen“ gibt den öffentlichen, erklärenden Charakter des Verbs wieder. Der deutsche Konjunktiv „bekenne“ wäre isoliert missverständlich; im Zusammenhang mit Vers 10–11 bezeichnet der Indikativ natürlich das Ziel beziehungsweise Ergebnis.
- source_word: κύριος
  choice: der Herr
  rationale: „Herr“ bewahrt sowohl die christologische Aussage als auch den wahrscheinlichen Anklang an die Schriftensprache; der bestimmte Artikel ist im Deutschen in dieser prädikativen Aussage idiomatisch.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus Christus
  rationale: „Christus“ ist im modernen deutschen Bibel- und Allgemeingebrauch die natürliche, würdevolle Wiedergabe der festen Verbindung; die Titelfunktion wird in einer Fußnote mit „der Messias“ sichtbar gemacht.
- source_word: εἰς δόξαν
  choice: zur Ehre
  rationale: „Zur Ehre“ gibt die Zielrichtung von εἰς δόξαν idiomatisch wieder. „Zur Herrlichkeit“ wäre formaler, klingt hier im Deutschen jedoch weniger natürlich.
- source_word: θεοῦ πατρός
  choice: Gottes, des Vaters
  rationale: Die Apposition entspricht der knappen griechischen Form und vermeidet eine unnötige Auflösung der Beziehung.
theological_decisions:
- issue: Wiedergabe von Χριστός im christologischen Bekenntnis
  choice: Jesus Christus
  alternative: Jesus, der Messias
  rationale: Χριστός trägt weiterhin Titelbedeutung. Im Deutschen ist „Jesus Christus“ jedoch die etablierte und natürliche Form; die transparente Titelübersetzung „der Messias“ wird als echte Alternative in der Fußnote bewahrt.
- issue: Satzbezug des Konjunktivs ἐξομολογήσηται
  choice: bekennt
  alternative: bekennen soll
  rationale: Der griechische Aorist Konjunktiv hängt von der in Vers 10 einsetzenden Zweck- beziehungsweise Ergebniskonstruktion ab. Da der Einzelvers auf Deutsch mit „soll“ leicht wie eine moralische Aufforderung klingt, wird der Zusammenhang durch einen natürlichen Indikativ wiedergegeben, ohne die Aussage als Gebot umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt markiert den Inhalt des Bekenntnisses klar; der Gedankenstrich hebt die abschließende Zielangabe hervor. Der Vers beginnt entsprechend dem griechischen καί und seinem Zusammenhang mit Vers 10 kleingeschrieben.
