lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: in Gottes Gestalt
  rationale: „Gestalt“ bewahrt den Ausdruck μορφή, ohne ihn auf eine spätere metaphysische Formel oder bloß äußere Erscheinung zu verengen.
- source_word: ὑπάρχων
  choice: obwohl er … existierte
  rationale: Das Partizip bezeichnet einen bestehenden Zustand und kann im Zusammenhang konzessiv verstanden werden. „Obwohl“ macht den Kontrast zu Vers 7 sichtbar; die stative Alternative bleibt in der Fußnote erhalten.
- source_word: ἁρπαγμὸν
  choice: etwas, das man ergreifen müsse
  rationale: Die umstrittene Wendung wird möglichst nah und zugleich verständlich wiedergegeben. Sie lässt offen, ob an Aneignung, Festhalten oder eigennützige Nutzung gedacht ist; wichtige Alternativen stehen in der Fußnote.
- source_word: ἡγήσατο
  choice: sah … an
  rationale: „Als etwas ansehen“ gibt die wertende Bedeutung von ἡγέομαι in natürlichem modernem Deutsch wieder.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: Gott gleich zu sein
  rationale: Die Infinitivkonstruktion und der ausdrückliche Gleichheitsgedanke werden unmittelbar wiedergegeben.
theological_decisions:
- issue: Christologische Aussage von ἐν μορφῇ θεοῦ
  choice: „in Gottes Gestalt“ im Haupttext
  alternative: „in Gottes Wesen“ oder „von göttlicher Natur“
  rationale: Die Formulierung bewahrt den hohen christologischen Gehalt und zugleich die konkrete Ausdrucksweise des griechischen Textes, ohne spätere dogmatische Terminologie einzutragen.
- issue: Bedeutung von ἁρπαγμός hinsichtlich der Gleichheit mit Gott
  choice: „etwas, das man ergreifen müsse“ im Haupttext
  alternative: „etwas, woran er festhalten musste“ oder „etwas, das er zu seinem eigenen Vorteil ausnutzen sollte“
  rationale: ἁρπαγμός ist eine echte Auslegungsfrage. Die relativ formale Hauptfassung entscheidet nicht stillschweigend zwischen Aneignung, Festhalten und Ausnutzen; die Deutungsmöglichkeiten werden in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am griechischen Satz, wird jedoch für deutsche Leser geordnet. Die Fußnoten kennzeichnen die echte Mehrdeutigkeit des Partizips und besonders von ἁρπαγμός.
