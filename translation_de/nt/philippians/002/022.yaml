  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: de
  text: 'Doch ihr wisst, wie er sich bewährt hat[a]: Wie ein Kind seinem Vater, so hat er mit mir für das Evangelium gedient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr kennt seine Bewährung“; gemeint ist eine durch Erprobung erwiesene Qualität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Gibt den leichten Gegensatz beziehungsweise Übergang im Zusammenhang natürlich wieder.
- source_word: δοκιμὴν αὐτοῦ γινώσκετε
  choice: ihr wisst, wie er sich bewährt hat
  rationale: Vermittelt idiomatisch, dass Timotheus seine Echtheit und Zuverlässigkeit in der Erprobung gezeigt hat; die wörtlichere substantivische Fassung wird in der Fußnote bewahrt.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt macht im Deutschen natürlich kenntlich, dass das Folgende den Inhalt beziehungsweise Beleg seiner Bewährung entfaltet.
- source_word: ὡς πατρὶ τέκνον
  choice: Wie ein Kind mit seinem Vater
  rationale: Bewahrt den Vergleich und übersetzt τέκνον geschlechtsneutral als „Kind“, ohne es unnötig auf „Sohn“ festzulegen.
- source_word: σὺν ἐμοὶ
  choice: zusammen mit mir
  rationale: Bringt die enge Gemeinschaft im Dienst klar und natürlich zum Ausdruck.
- source_word: ἐδούλευσεν
  choice: hat ... gedient
  rationale: Entspricht dem Dienstgedanken des Verbs, ohne im Deutschen die hier unnatürliche Formulierung „als Sklave gearbeitet“ aufzuzwingen.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: für das Evangelium
  rationale: Gibt Zielrichtung und Zweck des gemeinsamen Dienstes knapp und idiomatisch wieder.
theological_decisions: []
