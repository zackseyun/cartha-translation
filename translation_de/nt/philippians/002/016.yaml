  source_fidelity: 'Die Übersetzung gibt die griechische Satzführung und den Sinn zuverlässig wieder: λόγον ζωῆς als „Wort des Lebens“, ἐπέχοντες als „festhaltet“, die doppelte Formel οὐκ εἰς κενόν als „nicht vergeblich“ sowie die parallelen Bilder von Laufen und Mühen bleiben erhalten. „So werde ich ... Grund zum Ruhm haben“ legt den Ergebnisbezug von εἰς καύχημα ἐμοὶ idiomatisch aus, ohne den Sinn wesentlich einzuengen.'
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. Der Anschluss mit „indem“ ist als verseübergreifender Partizipialanschluss natürlich. „Am Tag des Messias“ ist im Deutschen idiomatischer als eine wörtliche Wiedergabe mit „in“.
  terminology: „Messias“ gibt Χριστός hier angemessen als eschatologischen Titel wieder. „Wort des Lebens“ bewahrt die prägnante und bewusst offene Genitivverbindung. Die Fußnoten dokumentieren sowohl die alternative Bedeutung von ἐπέχοντες als auch die traditionelle Wiedergabe „Christus“ sachgerecht.
