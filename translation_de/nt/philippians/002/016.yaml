id: PHP.2.16
reference: Philippians 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: de
  text: indem ihr am Wort des Lebens festhaltet[a]. So werde ich am Tag des Messias[b] Grund zum Ruhm haben, weil ich nicht vergeblich gelaufen bin und mich nicht vergeblich abgemüht habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem ihr das Wort des Lebens darbietet“ beziehungsweise „weitergebt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „am Tag des Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: Wort des Lebens
  rationale: Die knappe Genitivverbindung bleibt erhalten und kann sowohl das Leben schenkende Wort als auch das Wort über das Leben bezeichnen.
- source_word: ἐπέχοντες
  choice: indem ihr … festhaltet
  rationale: ἐπέχω kann hier das beharrliche Festhalten bezeichnen und passt zum vorausgehenden Aufruf zu Treue und untadeligem Leben. Die ebenfalls mögliche nach außen gerichtete Bedeutung wird in einer Fußnote bewahrt.
- source_word: καύχημα
  choice: Grund zum Ruhm
  rationale: Die Wendung gibt natürlich wieder, dass die Gemeinde für Paulus Anlass zu berechtigtem Rühmen sein wird, ohne den Ausdruck als selbstgefälligen Stolz umzudeuten.
- source_word: ἡμέραν Χριστοῦ
  choice: Tag des Messias
  rationale: Χριστός trägt in dieser eschatologischen Wendung Titelcharakter; „Messias“ bewahrt diesen königlich-eschatologischen Sinn.
- source_word: οὐκ εἰς κενὸν
  choice: nicht vergeblich
  rationale: Die geläufige deutsche Wendung erhält die Bedeutung erfolgloser oder zweckloser Mühe und bewahrt die Wiederholung des Griechischen.
- source_word: ἔδραμον
  choice: gelaufen bin
  rationale: Die Laufmetapher für den apostolischen Dienst bleibt unmittelbar erhalten.
- source_word: ἐκοπίασα
  choice: mich … abgemüht habe
  rationale: Die Formulierung bringt die anstrengende, erschöpfende Arbeit zum Ausdruck und klingt im modernen Deutsch natürlicher als das substantivische „gearbeitet“ oder „Mühe gehabt“.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der eschatologischen Titelwendung
  choice: des Messias
  alternative: des Christus
  rationale: In „Tag des Messias“ ist Χριστός nicht bloß namensartig, sondern als eschatologischer Titel gebraucht. Die traditionelle Wiedergabe wird in der Fußnote genannt.
- issue: Bezug von καύχημα auf Paulus
  choice: So werde ich … Grund zum Ruhm haben
  alternative: mir zum Ruhm für den Tag des Messias
  rationale: Die gewählte Fassung macht den Ziel- bzw. Ergebnisbezug von εἰς καύχημα ἐμοὶ verständlich, ohne zu behaupten, das Rühmen sei bereits gegenwärtig oder menschlich-selbstgefällig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden paulinischen Bilder des Laufens und der mühevollen Arbeit sowie die rhetorische Wiederholung „nicht vergeblich“ bleiben erhalten. Der einleitende Partizipialanschluss „indem“ setzt den syntaktischen Zusammenhang mit dem vorhergehenden Vers voraus.
