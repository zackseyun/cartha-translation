  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: de
  text: Tut nichts aus selbstsüchtigem Ehrgeiz oder eitler Ruhmsucht[a], sondern achtet in Demut einander höher als euch selbst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „leerem Geltungsdrang“; wörtlich: „leerem Ruhm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „haltet einander für wichtiger als euch selbst“ beziehungsweise „haltet einander euch gegenüber für überlegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Tut nichts
  rationale: Die knappe deutsche Aufforderung gibt den umfassenden negativen Ausdruck idiomatisch und mit dem ermahnenden Ton des Zusammenhangs wieder.
- source_word: κατ’ ἐριθείαν
  choice: aus selbstsüchtigem Ehrgeiz
  rationale: ἐριθεία bezeichnet hier eigennütziges, rivalisierendes Streben; „aus“ bewahrt die Angabe des Beweggrundes.
- source_word: κατὰ κενοδοξίαν
  choice: oder eitler Ruhmsucht
  rationale: κενοδοξία meint wörtlich leeren Ruhm und bezeichnet hohles Streben nach Ansehen. „Eitle Ruhmsucht“ ist verständlich und bewahrt sowohl die Nichtigkeit als auch die Selbstüberhebung.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: in Demut
  rationale: Der Dativ beschreibt Haltung oder Art und Weise; „in Demut“ ist natürlich, prägnant und würdevoll.
- source_word: ἀλλήλους ἡγούμενοι
  choice: achtet … einander
  rationale: ἡγέομαι hat hier den Sinn eines bewussten Einschätzens oder Ansehens; „achten“ trägt zugleich den relationalen Ton der gegenseitigen Haltung.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: höher als euch selbst
  rationale: Die Formulierung erhält den Vergleich und lässt offen, ob der Akzent auf Vorrang, Bedeutung oder Überlegenheit liegt, statt ihn unnötig einzuengen.
theological_decisions:
- issue: Art der geforderten Höherachtung anderer
  choice: einander höher als euch selbst
  alternative: einander für wichtiger als euch selbst halten
  rationale: Die offenere Wendung bewahrt die Spannung des griechischen ὑπερέχοντας, ohne eine Aussage über den ontologischen Wert von Personen festzuschreiben.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Ermahnungssprache. „Ruhmsucht“ ist leicht gehoben, aber allgemein verständlich; die Fußnote erschließt die wörtliche Bildgebung und eine zeitgemäßere Alternative.
