id: PHP.2.17
reference: Philippians 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: de
  text: Doch selbst wenn ich als Trankopfer über dem Opfer und dem Dienst eures Glaubens[a][b] ausgegossen werde[c], freue ich mich und freue mich mit euch allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eurer Treue“.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort kann „Dienst“ oder „Amt“ bedeuten; in diesem Zusammenhang mit Opferbegriffen hat es einen kultisch-gottesdienstlichen Klang.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als Libation ausgegossen werde“. Gemeint ist ein ausgegossenes Trankopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἰ καὶ
  choice: Doch selbst wenn
  rationale: Gibt den adversativen Übergang und die konzessive Bedingung natürlich und präzise wieder.
- source_word: σπένδομαι
  choice: ich als Trankopfer … ausgegossen werde
  rationale: Bewahrt das kultische Bild des Ausgießens einer Libation; „Trankopfer“ macht die Metapher im modernen Deutschen verständlich.
- source_word: ἐπὶ
  choice: über
  rationale: Bewahrt die räumlich-kultische Vorstellung, dass Paulus als zusätzliches Trankopfer über dem Opfer ausgegossen wird; eine allgemeinere Verbindung bleibt als Alternative möglich.
- source_word: θυσίᾳ
  choice: Opfer
  rationale: Der übliche deutsche Ausdruck für den kultischen Opferbegriff und passend zum Bild des Trankopfers.
- source_word: λειτουργίᾳ
  choice: Gottesdienst
  rationale: Erhält in diesem von Opfersprache geprägten Zusammenhang den kultischen Klang, ohne die Handelnden ausdrücklich als Priester zu bezeichnen.
- source_word: πίστεως
  choice: Glaubens
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe; „Treue“ bleibt lexikalisch möglich und wird in einer Fußnote genannt.
- source_word: χαίρω καὶ συγχαίρω
  choice: freue ich mich und freue mich mit
  rationale: Spiegelt die Wortverwandtschaft und den Übergang von eigener zu gemeinsamer Freude unmittelbar wider.
- source_word: πᾶσιν ὑμῖν
  choice: mit euch allen
  rationale: Bewahrt die ausdrückliche Einbeziehung der gesamten Gemeinde in idiomatischem Deutsch.
theological_decisions:
- issue: Kultische Deutung eines möglichen Todes des Paulus
  choice: Paulus stellt sein Ergehen als ein Trankopfer dar, das über dem Opfer und Gottesdienst der Gemeinde ausgegossen wird.
  alternative: Paulus wird lediglich im Zusammenhang mit ihrem Dienst ausgegossen, ohne die Vorstellung eines zusätzlichen Opfers besonders zu betonen.
  rationale: Die Häufung von σπένδομαι, θυσία und λειτουργία verlangt, die Opfer- und Gottesdienstsprache im Haupttext zu bewahren.
- issue: Genitiv τῆς πίστεως ὑμῶν
  choice: „eures Glaubens“ bleibt formal mehrdeutig in seiner Beziehung zu „Opfer und Gottesdienst“.
  alternative: Eine explizite Deutung wie „das Opfer, das aus eurem Glauben besteht“ oder „euer durch den Glauben geleisteter Gottesdienst“.
  rationale: Der griechische Genitiv lässt die genaue Beziehung offen; der Text soll diese theologische und syntaktische Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Bildwelt wird durch „Trankopfer“, „Opfer“ und „Gottesdienst“ erhalten. Die bewusst wiederholte Formulierung „freue ich mich und freue mich mit“ bildet das griechische Wortspiel ab, ohne es stilistisch zu glätten.
