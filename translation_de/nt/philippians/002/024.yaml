  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: de
  text: Ich bin jedoch im Herrn zuversichtlich, dass auch ich selbst bald kommen werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθα
  choice: ich vertraue … darauf
  rationale: Das Perfekt bezeichnet einen gefestigten gegenwärtigen Zustand des Vertrauens. Die deutsche Fügung mit „darauf“ ist natürlich und leitet den folgenden Inhaltssatz klar ein.
- source_word: δὲ
  choice: Doch
  rationale: Der milde weiterführende beziehungsweise leicht kontrastierende Anschluss wird im Deutschen mit „Doch“ wiedergegeben.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Bewahrt die paulinische Wendung und lässt sowohl den Bereich als auch die Grundlage des Vertrauens anklingen.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt des Vertrauens ein.
- source_word: καὶ αὐτὸς
  choice: auch ich selbst
  rationale: „Auch“ erhält den additiven Sinn von καί im Verhältnis zu Timotheus, während „ich selbst“ die persönliche Hervorhebung durch αὐτός wiedergibt.
- source_word: ταχέως
  choice: bald
  rationale: Im Kontext bezeichnet das Adverb zeitliche Nähe, nicht die Geschwindigkeit der Reise.
- source_word: ἐλεύσομαι
  choice: kommen werde
  rationale: Bewahrt die deiktische Perspektive des griechischen ἔρχομαι gegenüber den Adressaten.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ ist hier die natürliche und traditionsübergreifende Wiedergabe von κύριος im paulinischen Sprachgebrauch.
theological_decisions:
- issue: Art von Paulus’ Zuversicht in Beziehung zum Herrn
  choice: „ich vertraue im Herrn darauf“
  alternative: „ich vertraue dem Herrn, dass …“
  rationale: Die gewählte Formulierung lässt Paulus’ Erwartung im Herrn gegründet sein, ohne daraus eine ausdrückliche göttliche Zusage oder Offenbarung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Herrn“ bleibt als prägnante paulinische Wendung erhalten; „auch ich selbst“ bewahrt sowohl Addition als auch persönliche Hervorhebung.
