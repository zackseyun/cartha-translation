lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Gibt die begründende bzw. erläuternde Verbindung zum vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: οὐδένα … ἔχω
  choice: ich habe niemanden
  rationale: Entspricht unmittelbar der griechischen Konstruktion, ohne ein nicht ausdrücklich vorhandenes „sonst“ hinzuzufügen.
- source_word: ἰσόψυχον
  choice: wie ihn
  rationale: Im Zusammenhang ist Timotheus gemeint. Die Formulierung ist im modernen Deutsch natürlich und vermittelt, dass Paulus niemanden mit einer vergleichbaren inneren Haltung hat; die bildhaftere Grundbedeutung wird in der Fußnote bewahrt.
- source_word: ὅστις
  choice: der
  rationale: Das deutsche Relativpronomen gibt die griechische Konstruktion klar und idiomatisch wieder.
- source_word: γνησίως
  choice: aufrichtig
  rationale: Bezeichnet die echte, unverstellte Art der Fürsorge und passt zum würdigen modernen Register.
- source_word: τὰ περὶ ὑμῶν
  choice: euer Wohlergehen
  rationale: Gibt die Belange und die Lage der Adressaten idiomatisch wieder, ohne die pastorale Fürsorge des Zusammenhangs zu verlieren.
- source_word: μεριμνήσει
  choice: sich … kümmern wird
  rationale: Drückt hier positive, tätige Sorge aus und vermeidet die im Deutschen naheliegende Bedeutung belastender Ängstlichkeit.
theological_decisions:
- issue: Bezugspunkt von ἰσόψυχον
  choice: „wie ihn“ mit Timotheus als kontextuellem Bezugspunkt
  alternative: „gleichgesinnt“ bzw. „der so denkt und fühlt wie ich“
  rationale: Das Adjektiv bezeichnet eine Übereinstimmung der inneren Haltung, lässt den Vergleichspunkt grammatisch jedoch unausgesprochen. Der Haupttext folgt dem unmittelbaren Kontext, während die Fußnote die lexikalische Offenheit sichtbar hält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am Griechischen, während ungebräuchliche Bildsprache und die weitere Bedeutung von τὰ περὶ ὑμῶν in Fußnoten dokumentiert werden.
