  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: de
  text: Denn ich habe niemanden, der so gleichgesinnt ist,[a] der sich aufrichtig um euer Wohlergehen kümmern wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mir in seiner Gesinnung gleich ist“; wörtlicher: „gleich an Seele“.'
