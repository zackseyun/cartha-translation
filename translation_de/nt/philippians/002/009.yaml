  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: de
  text: Darum hat Gott ihn auch über alle Maßen erhöht und ihm aus Gnade den Namen[b] geschenkt[a], der über jedem Namen steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verliehen“.'
    reason: lexical_alternative
  - marker: b
    text: „Der Name“ kann außer einem gesprochenen Namen auch eine Würdestellung, einen Rang oder einen Titel bezeichnen; welcher Name gemeint ist, sagt dieser Vers noch nicht ausdrücklich.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Darum … auch
  rationale: „Darum“ bewahrt die folgernde Bedeutung von διό; „auch“ gibt die hinzufügende Kraft von καί in natürlicher deutscher Wortstellung wieder.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Das griechische Subjekt ist ausdrücklich und bestimmt; im Deutschen steht die Gottesbezeichnung üblicherweise ohne Artikel.
- source_word: ὑπερύψωσεν
  choice: über alle Maßen erhöht
  rationale: Die Formulierung bringt die verstärkende Bedeutung des zusammengesetzten Verbs zum Ausdruck, ohne einen räumlichen „höchsten Platz“ einzutragen, den das Verb nicht ausdrücklich nennt.
- source_word: ἐχαρίσατο
  choice: aus Gnade … geschenkt
  rationale: Die Wiedergabe macht sowohl den Akt des Gebens als auch den Anklang an χάρις, „Gnade“, sichtbar. „Verliehen“ bleibt als knappere Alternative möglich.
- source_word: τὸ ὄνομα
  choice: den Namen
  rationale: Der griechische Text sagt ausdrücklich „Name“. Die Übersetzung legt nicht vorzeitig fest, ob damit ein gesprochener Name, ein Titel, Rang oder eine Würdestellung gemeint ist.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: der über jedem Namen steht
  rationale: Die relative Formulierung bewahrt die Aussage, dass dieser Name allen anderen Namen übergeordnet ist, und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Identität des „Namens“
  choice: Im Haupttext bleibt die offene Bezeichnung „der Name“ erhalten.
  alternative: Ausdrückliche Identifikation mit „Jesus“ oder mit dem in Vers 11 genannten Hoheitstitel „Herr“.
  rationale: Vers 9 selbst nennt den Namen nicht ausdrücklich. Die Übersetzung greift daher der möglichen Deutung durch die folgenden Verse nicht vor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Über alle Maßen erhöht“ wahrt die intensive Aussage des griechischen Verbs; „aus Gnade … geschenkt“ hält dessen Gnadenton erkennbar. Die Satzstruktur bleibt verständlich und nahe am Gedankengang des Ausgangstextes.
