id: PHP.2.1
reference: Philippians 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: de
  text: Wenn es also irgendeine Ermutigung im Messias gibt, wenn es irgendeinen Trost aus Liebe gibt, wenn es irgendeine Gemeinschaft des Geistes[a] gibt, wenn es irgendeine herzliche Zuneigung und irgendein Mitgefühl gibt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Teilhabe am Geist“; weniger wahrscheinlich: „Gemeinschaft im Geist“.'
    reason: Der Genitiv πνεύματος kann Gemeinschaft, die der Geist bewirkt, oder Teilhabe am Geist bezeichnen; auch ein Bezug auf den menschlichen Geist ist grammatisch möglich, aber kontextuell weniger wahrscheinlich.
lexical_decisions:
- source_word: παράκλησις
  choice: Ermutigung
  rationale: Der Ausdruck bezeichnet hier stärkenden Zuspruch und passt zu den geistlichen und zwischenmenschlichen Beweggründen für die folgende Aufforderung zur Einmütigkeit.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: ἐν wird mit „in“ wiedergegeben; Χριστός wird als Titel verstanden und daher entsprechend der Projektlinie mit „Messias“ übersetzt.
- source_word: παραμύθιον
  choice: Trost
  rationale: Das Wort bezeichnet tröstenden Zuspruch. „Trost“ erhält zugleich die begriffliche Unterscheidung gegenüber παράκλησις („Ermutigung“).
- source_word: ἀγάπης
  choice: der Liebe
  rationale: 'Der kompakte Genitiv bleibt bewusst offen: Gemeint sein kann Trost, der von Liebe ausgeht, oder Trost, der in Liebe besteht bzw. durch sie vermittelt wird.'
- source_word: κοινωνία
  choice: Gemeinschaft
  rationale: „Gemeinschaft“ gibt die relationale und gemeinschaftliche Bedeutung wieder, ohne die mögliche Nuance der Teilhabe auszuschließen.
- source_word: πνεύματος
  choice: des Geistes
  rationale: Wahrscheinlich ist der Heilige Geist gemeint. Die genaue Beziehung des Genitivs zu κοινωνία bleibt jedoch mehrdeutig und wird in der Fußnote kenntlich gemacht.
- source_word: σπλάγχνα
  choice: herzliche Zuneigung
  rationale: Das wörtlich auf die inneren Organe bezogene Bild bezeichnet idiomatisch tiefes, herzliches Empfinden. Die Wiedergabe ist modern und bewahrt die emotionale Intensität.
- source_word: οἰκτιρμοί
  choice: Barmherzigkeit
  rationale: Der Plural bezeichnet Regungen des Erbarmens oder Mitgefühls. Der deutsche Sammelbegriff klingt in der Aufzählung natürlich und würdevoll.
- source_word: οὖν
  choice: also
  rationale: „Also“ markiert den folgernden Anschluss an den vorausgehenden Gedankengang in natürlichem Deutsch.
theological_decisions:
- issue: Ob πνεύματος den Heiligen Geist bezeichnet und wie der Genitiv bei κοινωνία zu verstehen ist
  choice: Gemeinschaft des Geistes
  alternative: 'Teilhabe am Geist; weniger wahrscheinlich: Gemeinschaft im Geist bzw. im menschlichen Geist'
  rationale: Im paulinischen Zusammenhang ist ein Bezug auf den Heiligen Geist am wahrscheinlichsten. Der griechische Genitiv legt jedoch nicht eindeutig fest, ob der Geist Ursprung und Urheber der Gemeinschaft oder derjenige ist, an dem die Glaubenden Anteil haben; diese Spannung bleibt in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konditionale Reihung des griechischen Satzes bleibt erhalten; das abschließende Komma zeigt, dass Vers 1 syntaktisch in die Aufforderung des folgenden Verses übergeht.
