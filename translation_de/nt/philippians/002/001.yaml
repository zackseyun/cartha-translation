revisions:
- from: Wenn es also irgendeine Ermutigung im Messias gibt, wenn irgendeinen Trost der Liebe, wenn irgendeine Gemeinschaft des Geistes[a], wenn irgendeine herzliche Zuneigung und Barmherzigkeit,
  to: Wenn es also irgendeine Ermutigung im Messias gibt, wenn es irgendeinen Trost aus Liebe gibt, wenn es irgendeine Gemeinschaft des Geistes[a] gibt, wenn es irgendeine herzliche Zuneigung und irgendein Mitgefühl gibt,
  rationale: Die Existenzkonstruktion wird in jeder Konditionalphrase wiederholt, um die griechische Reihung idiomatisch und grammatisch korrekt abzubilden. „Aus Liebe“ gibt den offenen, hier naheliegenden Quell- bzw. Vermittlungsbezug des Genitivs ἀγάπης natürlich wieder. „Mitgefühl“ modernisiert οἰκτιρμοί, während die Paarung mit σπλάγχνα erhalten bleibt. Das Schlusskomma bleibt stehen, da der Satz in Vers 2 fortgesetzt wird.
