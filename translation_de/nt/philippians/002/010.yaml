id: PHP.2.10
reference: Philippians 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/010.yaml
  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: de
  text: damit sich beim Namen Jesu[a] jedes Knie derer beugt, die im Himmel, auf der Erde und unter der Erde sind[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „im Namen Jesu“.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „der Himmlischen, Irdischen und Unterirdischen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das Ergebnis des vorausgehenden Gedankens ein und gibt den finalen Sinn natürlich wieder.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: beim Namen Jesu
  rationale: Passt im Zusammenhang mit der Huldigung gut zum Vorgang des Kniebeugens. Die mögliche Wiedergabe „im Namen Jesu“ bleibt in einer Fußnote erhalten.
- source_word: πᾶν γόνυ
  choice: jedes Knie
  rationale: Bewahrt das anschauliche körperliche Bild umfassender Huldigung, statt es zu „jeder Mensch“ zu verallgemeinern.
- source_word: κάμψῃ
  choice: sich … beugt
  rationale: Gibt das Kniebeugen als Zeichen der Huldigung in natürlichem, würdigem Deutsch wieder; der Konjunktiv nach ἵνα wird im deutschen damit-Satz idiomatisch durch den Indikativ ausgedrückt.
- source_word: ἐπουρανίων
  choice: derer, die im Himmel … sind
  rationale: Gibt das substantivierte Genitivadjektiv als Gruppe wieder, ohne deren Identität näher festzulegen.
- source_word: ἐπιγείων
  choice: die … auf der Erde … sind
  rationale: Bewahrt den zweiten Bereich der dreifachen kosmischen Gliederung in natürlicher deutscher Ausdrucksweise.
- source_word: καταχθονίων
  choice: die … unter der Erde sind
  rationale: Erhält das räumliche Bild des Griechischen und vermeidet die stärker deutende Bezeichnung „Unterwelt“.
theological_decisions:
- issue: Umfang der dreifachen Wendung ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: Die universale, kosmische Reichweite wird durch „die im Himmel, auf der Erde und unter der Erde sind“ bewahrt, ohne die Gruppen genauer zu bestimmen.
  alternative: Eine ausdrücklichere Deutung als Engel, Menschen und Tote oder als Engel, Menschen und Dämonen.
  rationale: Der Text betont die umfassende Huldigung vor Jesus, benennt jedoch die einzelnen Gruppen nicht genauer. Die Übersetzung wahrt diese Offenheit.
- issue: Bedeutung von ἐν τῷ ὀνόματι Ἰησοῦ
  choice: „beim Namen Jesu“ als Auslöser beziehungsweise Bezugspunkt der Huldigung.
  alternative: „im Namen Jesu“ als wörtlichere, möglicherweise instrumentale oder sphärische Wiedergabe.
  rationale: Der Zusammenhang des Kniebeugens stützt „beim Namen“, doch die griechische Präposition lässt „im Namen“ zu; deshalb wird die Alternative ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Genitivbeziehung der drei substantivierten Adjektive zu „jedes Knie“ wird durch „jedes Knie derer, die … sind“ ausdrücklich erhalten; zugleich vermeidet die Formulierung eine nicht vom Text geforderte Bestimmung der Wesen in den drei Bereichen.
