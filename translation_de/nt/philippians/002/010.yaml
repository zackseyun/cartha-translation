review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die Final-/Folgerungsrelation von ἵνα mit „damit“ angemessen wieder. „jedes Knie derer, die im Himmel, auf der Erde und unter der Erde sind“ erhält sowohl das Bild von πᾶν γόνυ als auch die genitivische Zuordnung der drei substantivierten Adjektive. Die drei Gruppen werden nicht über die Aussage des griechischen Textes hinaus identifiziert.
  naturalness: „Damit sich beim Namen Jesu jedes Knie … beugt“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Formulierung „derer, die … sind“ ist etwas formell, aber im biblisch-feierlichen Register natürlich und dient hier der genauen Wiedergabe der Genitivbeziehung.
  terminology: „beim Namen Jesu“ ist im Kontext der Huldigung eine tragfähige Wiedergabe von ἐν τῷ ὀνόματι Ἰησοῦ; die Fußnote nennt zutreffend „im Namen Jesu“ als mögliche Alternative. „unter der Erde“ bewahrt die räumliche Bildsprache von καταχθονίων und vermeidet eine unbegründet spezifische Deutung.
