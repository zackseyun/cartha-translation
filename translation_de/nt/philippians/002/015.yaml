id: PHP.2.15
reference: Philippians 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: de
  text: damit ihr untadelig und lauter werdet, Kinder Gottes ohne Makel, mitten in einer verkehrten und verdrehten Generation.[a] Unter ihnen leuchtet[b] ihr wie Lichter[c] in der Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Verkehrte und verdrehte Generation“ spielt wahrscheinlich auf 5. Mose 32,5 an und stellt die Kinder Gottes einer verdorbenen Generation gegenüber.
    reason: cross_reference
  - marker: b
    text: 'Oder: „erscheint“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Himmelslichter“; auch „Gestirne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Ziel- beziehungsweise Folgesatz natürlich ein und bewahrt dessen Zweckcharakter.
- source_word: γένησθε
  choice: ihr … werdet
  rationale: Gibt den dynamischen Sinn von γίνομαι wieder und erhält die auf Veränderung zielende Kraft der Mahnung.
- source_word: ἄμεμπτοι
  choice: untadelig
  rationale: Bezeichnet ein Leben, das keinen berechtigten Anlass zum Tadel gibt, und entspricht dem ethischen Zusammenhang.
- source_word: ἀκέραιοι
  choice: lauter
  rationale: Drückt moralische Reinheit und ungeteilte Aufrichtigkeit in würdigem, verständlichem Deutsch aus.
- source_word: τέκνα θεοῦ
  choice: Kinder Gottes
  rationale: τέκνα ist geschlechtsübergreifend und bezeichnet Kinder, nicht speziell Söhne.
- source_word: ἄμωμα
  choice: ohne Makel
  rationale: Bewahrt gegenüber dem vorausgehenden „untadelig“ die besondere Makel-Metaphorik und lässt den möglichen alttestamentlichen Anklang erkennen.
- source_word: μέσον γενεᾶς
  choice: mitten in einer … Generation
  rationale: Gibt die räumlich-soziale Einordnung der Kinder Gottes innerhalb ihres Umfelds idiomatisch wieder.
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: verkehrten und verdrehten
  rationale: Erhält die kräftige moralische Charakterisierung und den sprachlichen Anklang an 5. Mose 32,5, ohne moderne Nebenbedeutungen von „pervers“ einzutragen.
- source_word: ἐν οἷς
  choice: unter ihnen
  rationale: Bezieht das Relativpronomen sinngemäß auf die Menschen der genannten Generation.
- source_word: φαίνεσθε
  choice: ihr leuchtet
  rationale: Im Zusammenhang mit φωστῆρες liegt die Bedeutung des Leuchtens nahe; die ebenfalls mögliche Bedeutung „erscheinen“ wird in einer Fußnote bewahrt.
- source_word: φωστῆρες
  choice: Lichter
  rationale: Ist verständlich und bewahrt den weiten Bildbereich des griechischen Wortes, ohne ihn unnötig auf Sterne zu verengen.
- source_word: ἐν κόσμῳ
  choice: in der Welt
  rationale: κόσμος bezeichnet hier am natürlichsten die menschliche Welt, in der die Glaubenden sichtbar leben.
theological_decisions:
- issue: Bezug von ἄμωμα und möglicher Anklang an 5. Mose 32,5
  choice: „Kinder Gottes ohne Makel“ wird eng zusammengehalten; der Gegensatz zur „verkehrten und verdrehten Generation“ bleibt im Haupttext unausgedeutet.
  alternative: „Ohne Makel“ könnte allgemeiner auf die gesamte vorausgehende Beschreibung bezogen oder der Bezug zu 5. Mose 32,5 im Haupttext ausdrücklich gemacht werden.
  rationale: Die griechische Wortstellung verbindet ἄμωμα natürlich mit „Kinder Gottes“. Zugleich soll der wahrscheinlich beabsichtigte bundesgeschichtliche Kontrast erkennbar bleiben, ohne eine intertextuelle Deutung als zwingend in den Text einzubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lauter“ ist leicht gehoben, aber im ethischen Zusammenhang verständlich und präzise. Die Satzteilung nach „Generation“ verbessert die Lesbarkeit, ohne die syntaktische Verbindung oder den Kontrast des griechischen Satzes aufzulösen.
