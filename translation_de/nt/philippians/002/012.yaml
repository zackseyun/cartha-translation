    rationale: Der griechische Wortlaut fordert κατεργάζεσθε τὴν ἑαυτῶν σωτηρίαν und erläutert in diesem Vers nicht ausdrücklich das Verhältnis dieser Aufforderung zu einem möglichen „Verdienen“. Eine solche Einordnung kann aus dem weiteren Kontext begründet werden, soll aber nicht als lexikalische Bedeutung des Verbs ausgegeben werden.
  - severity: low
    issue: „Meine Geliebten“ wirkt als moderne deutsche Anrede etwas unüblich.
    rationale: „Meine Lieben“ ist eine natürliche, warme und würdige Entsprechung für ἀγαπητοί μου.
  - severity: low
    issue: Fußnote c fügt „vor Gott“ als expliziten Bezug hinzu.
    rationale: Die Wendung mit φόβου καὶ τρόμου ist im Kontext religiös geprägt, doch Gott wird in diesem Vers nicht genannt. Die Erläuterung sollte die Spannweite der Wendung benennen, ohne den Bezug im Wortlaut zu explizieren.
  revised_text: Darum[a], meine Lieben, wie ihr immer gehorcht habt – nicht nur in meiner Gegenwart, sondern jetzt in meiner Abwesenheit noch viel mehr –, arbeitet mit Furcht und Zittern[c] eure eigene Rettung aus[b].
