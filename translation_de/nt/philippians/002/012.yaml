source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: de
  text: Darum[a], meine Lieben, wie ihr immer gehorcht habt – nicht nur in meiner Gegenwart, sondern jetzt in meiner Abwesenheit noch viel mehr –, arbeitet mit Furcht und Zittern[c] eure eigene Rettung aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Daher“ beziehungsweise „Also“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch „vollbringt“ oder „führt zu Ende“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Furcht und Zittern“ ist eine eindringliche Wendung für Furcht, Ehrfurcht und tiefen Ernst.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorhergehenden Abschnitt und stellt den gedanklichen Zusammenhang in natürlichem Deutsch her.
- source_word: ἀγαπητοί μου
  choice: meine Geliebten
  rationale: Bewahrt die herzliche, seelsorgerliche Anrede und zugleich den würdigen Ton.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: Wie ihr immer gehorcht habt
  rationale: Gibt ihr bisheriges, weiterhin bedeutsames Verhalten als zusammenfassenden Rückblick wieder.
- source_word: μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου
  choice: nicht nur in meiner Gegenwart, sondern jetzt, in meiner Abwesenheit, umso mehr
  rationale: Erhält den Gegensatz von Gegenwart und Abwesenheit sowie die deutliche Steigerung πολλῷ μᾶλλον.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: mit Furcht und Zittern
  rationale: Bewahrt die eindringliche, traditionelle Wendung, ohne ihre ernste emotionale Kraft abzuschwächen.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: an eurer eigenen Rettung
  rationale: σωτηρία wird mit dem theologisch gewichtigen und allgemein verständlichen „Rettung“ wiedergegeben; „eigenen“ bewahrt das Reflexivpronomen, ohne ausdrücklich Individualismus festzuschreiben.
- source_word: κατεργάζεσθε
  choice: arbeitet … an
  rationale: Ist im heutigen Deutsch verständlich und gibt den fortdauernden, verantwortlichen Einsatz wieder. Die Fußnote weist darauf hin, dass das griechische Verb auch das Vollbringen beziehungsweise Zu-Ende-Führen bezeichnet und nicht mit „verdienen“ gleichzusetzen ist.
theological_decisions:
- issue: Bedeutung der Aufforderung, an der eigenen Rettung zu arbeiten
  choice: Die Formulierung lässt den ernsthaften menschlichen Vollzug und das Zu-Ende-Führen der Rettung hervortreten, ohne zu behaupten, Rettung werde verdient.
  alternative: Die Rettung aus eigener Kraft erwerben oder verdienen.
  rationale: κατεργάζεσθε kann das Bewirken, Vollbringen oder Durchführen bezeichnen. Der Wortlaut soll seine Spannung behalten; zugleich verbietet der Vers nicht ausdrücklich jede stärkere Lesart, und Vers 13 stellt Gottes Wirken unmittelbar daneben.
- issue: Bedeutung von „Furcht und Zittern“
  choice: Die kräftige Wendung wird wörtlich als Ausdruck ernster, demütiger Gottesfurcht beibehalten.
  alternative: Bloße panische Angst oder lediglich abgeschwächter Respekt.
  rationale: Die feste Wortverbindung trägt sowohl Ehrfurcht als auch tiefen Ernst; eine glättende Umschreibung würde ihre Spannung mindern.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der lange griechische Satz wird durch Doppelpunkt und Gedankenstriche gegliedert. Die traditionelle Wendung „Furcht und Zittern“ bleibt erhalten; „arbeitet … an“ vermeidet archaisches „wirkt“ oder „schaffet“, während die Fußnote die stärkere Bedeutungsbreite des griechischen Verbs offenlegt.
