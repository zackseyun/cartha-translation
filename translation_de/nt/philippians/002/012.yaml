  timestamp: '2026-07-15T02:34:39Z'
review_pass:
  verdict: revise
  source_fidelity: Der Grundsinn und die Satzstruktur sind weitgehend getroffen. „an eurer eigenen Rettung arbeiten“ ist als idiomatische Wiedergabe möglich, gibt κατεργάζεσθε jedoch etwas weniger bestimmt wieder als „arbeitet ... aus“ und kann stärker nach einem bloßen Arbeitsprozess klingen. Die erläuternde Behauptung, die Aufforderung meine ausdrücklich nicht, Rettung zu verdienen, geht über den Wortlaut dieses Verses hinaus.
  naturalness: „Meine Geliebten“ ist verständlich, aber im modernen Standarddeutsch als Anrede weniger idiomatisch als „meine Lieben“. Die revidierte Satzstellung gliedert den langen Satz klar und bewahrt seinen würdigen, gegenwartsnahen Ton.
  terminology: „Rettung“ kann σωτηρία angemessen wiedergeben; „eure eigene“ bewahrt ἑαυτῶν. „Furcht und Zittern“ ist die passende etablierte Wendung. Die Fußnoten sollen Bedeutungsalternativen erläutern, ohne eine theologische Folgerung als Bestandteil des Verses festzulegen.
