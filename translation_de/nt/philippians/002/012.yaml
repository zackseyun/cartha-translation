revisions:
- from: 'Darum[a], meine Geliebten: Wie ihr immer gehorcht habt – nicht nur in meiner Gegenwart, sondern jetzt, in meiner Abwesenheit, umso mehr –, so arbeitet mit Furcht und Zittern[c] an eurer eigenen Rettung[b].'
  to: Darum[a], meine Lieben, wie ihr immer gehorcht habt – nicht nur in meiner Gegenwart, sondern jetzt in meiner Abwesenheit noch viel mehr –, arbeitet mit Furcht und Zittern[c] eure eigene Rettung aus[b].
  rationale: Die Revision ersetzt die weniger idiomatische Anrede, gibt die transitive und auf Vollzug bzw. Durchführung zielende Kraft von κατεργάζεσθε mit „arbeitet ... aus“ deutlicher wieder und entfernt aus den Fußnoten Deutungen, die der Vers selbst nicht ausdrücklich festlegt. Der Kontrast von Gegenwart und Abwesenheit, die Steigerung „noch viel mehr“, die persönliche Verantwortung in „eure eigene Rettung“ und die gewichtige Formel „Furcht und Zittern“ bleiben erhalten.
