  variant: modern standard German
source:
  edition: SBLGNT
  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: de
  text: Darum habe ich ihn umso eifriger geschickt, damit ihr euch freut, wenn ihr ihn wiederseht, und auch ich weniger bekümmert bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: umso dringlicher
  rationale: Der Komparativ bezeichnet gesteigerten Eifer beziehungsweise erhöhte Dringlichkeit. „Umso dringlicher“ gibt den Bezug zum vorausgehenden Grund natürlich wieder, ohne die Formulierung auf bloße Eile zu verengen.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Schilderung und klingt in modernem Deutsch klar und natürlich.
- source_word: ἔπεμψα
  choice: habe ich ... geschickt
  rationale: Der griechische Aorist bezeichnet hier die Sendung als vollzogene Handlung. Das deutsche Perfekt ist in gegenwärtigem Standarddeutsch die natürliche Erzählform und passt zur brieflichen Perspektive.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die Zweckbeziehung knapp und idiomatisch wieder.
- source_word: ἰδόντες
  choice: wenn ihr ihn wiederseht
  rationale: Das Aoristpartizip bezeichnet die Wahrnehmung, die der Freude vorausgeht. Ein temporaler Nebensatz bildet diesen Zusammenhang im Deutschen natürlich ab.
- source_word: πάλιν
  choice: wieder
  rationale: Bezeichnet das erneute Sehen des Epaphroditus und verbindet sich im Deutschen idiomatisch mit „wiedersehen“.
- source_word: χαρῆτε
  choice: ihr euch freut
  rationale: Der Konjunktiv Aorist steht unter ἵνα. „Sich freuen“ bewahrt den Sinn und die paulinische Freude-Thematik in natürlichem Deutsch.
- source_word: κἀγὼ
  choice: und auch ich
  rationale: Die Krasis aus καί und ἐγώ wird mit „und auch ich“ wiedergegeben; „auch“ macht die koordinierende Einbeziehung des Paulus sichtbar.
- source_word: ἀλυπότερος
  choice: weniger bekümmert
  rationale: Der Komparativ bezeichnet eine Verringerung von Kummer oder Betrübnis, nicht deren völliges Ende. „Bekümmert“ erhält diese emotionale Bedeutung, ohne sie speziell als Angst zu deuten.
- source_word: ὦ
  choice: bin
  rationale: Der Präsenskonjunktiv von εἰμί gehört zur von ἵνα abhängigen Zweck- beziehungsweise Ergebnisaussage. Im deutschen damit-Satz ist die indikativisch gleiche Form „bin“ idiomatisch.
theological_decisions:
- issue: Grad der verbleibenden Betrübnis des Paulus
  choice: weniger bekümmert
  alternative: nicht mehr bekümmert
  rationale: Der griechische Komparativ ἀλυπότερος sagt ausdrücklich „weniger bekümmert“ und lässt eine verbleibende Belastung offen; eine vollständige Aufhebung des Kummers wäre eine theologische und psychologische Überpräzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Zweckstruktur, wird aber durch „wenn ihr ihn wiederseht“ natürlich lesbar. Keine Fußnoten erforderlich.
