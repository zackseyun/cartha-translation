base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: de
  text: Denn er sehnte sich nach euch allen und war tief beunruhigt, weil ihr gehört hattet, dass er krank war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Denn
  rationale: Leitet den erklärenden Grund dafür ein, dass Epaphroditus zurückgesandt werden soll, und schließt im Deutschen natürlich an den vorherigen Vers an.
- source_word: ἐπιποθῶν ἦν
  choice: er sehnte sich
  rationale: Die Umschreibung aus Partizip Präsens und Imperfekt bezeichnet ein in der Vergangenheit anhaltendes Verlangen; das deutsche Präteritum gibt diesen Zustand idiomatisch wieder.
- source_word: πάντας ὑμᾶς
  choice: nach euch allen
  rationale: Bewahrt die ausdrückliche Betonung, dass seine Sehnsucht der gesamten Gemeinde galt.
- source_word: ἀδημονῶν
  choice: war tief beunruhigt
  rationale: Das Wort bezeichnet starke innere Bedrängnis und mehr als bloße Besorgnis, ohne zwingend körperliche Qual auszudrücken.
- source_word: διότι
  choice: weil
  rationale: Gibt die kausale Beziehung unmittelbar und natürlich wieder.
- source_word: ἠκούσατε
  choice: ihr gehört hattet
  rationale: Das Plusquamperfekt macht im Deutschen klar, dass die Gemeinde bereits vor seiner Beunruhigung von der Krankheit erfahren hatte.
- source_word: ὅτι ἠσθένησεν
  choice: dass er krank war
  rationale: ἀσθενέω bezeichnet hier körperliche Krankheit. Die Formulierung ist natürlich und legt den Aorist nicht unnötig auf den Beginn der Erkrankung fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung mit „Denn“ wahrt den erklärenden Anschluss an den Kontext; die emotionale Stärke von ἀδημονῶν bleibt erhalten. Die englische Alternativlesart mit einem zusätzlichen Hören des Epaphroditus wurde nicht übernommen, da sie im vorliegenden griechischen Text keine ausdrückliche Entsprechung hat.
