id: PHP.2.27
reference: Philippians 2:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: de
  text: Denn er war tatsächlich krank und dem Tod nahe[a]. Aber Gott hatte Erbarmen mit ihm – und nicht nur mit ihm, sondern auch mit mir –, damit ich nicht Kummer über Kummer hätte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis nahe an den Tod“ oder „bis an die Schwelle des Todes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kummer über Kummer“; die Wendung bezeichnet sich häufenden, zusätzlichen Kummer.'
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: war krank
  rationale: Das Verb ἀσθενέω bezeichnet hier im Zusammenhang die körperliche Erkrankung des Epaphroditus. „War krank“ ist klar, natürlich und legt nicht unnötig fest, wann die Krankheit einsetzte.
- source_word: παραπλήσιον θανάτῳ
  choice: dem Tod nahe
  rationale: Die Wendung bezeichnet eine lebensbedrohliche Nähe zum Tod, ohne zu behaupten, der Tod sei bereits eingetreten. Die knappe deutsche Formulierung bewahrt diese Aussage.
- source_word: ἠλέησεν αὐτόν
  choice: hatte Erbarmen mit ihm
  rationale: „Erbarmen haben“ gibt den persönlichen und theologisch gewichtigen Sinn von ἐλεάω wieder, ohne ihn auf Mitleid oder ausdrücklich auf Heilung zu verengen.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: und nicht nur mit ihm, sondern auch mit mir
  rationale: Die Formulierung übernimmt das Erbarmen aus dem vorangehenden Satzteil und bewahrt den Kontrast zwischen Epaphroditus und Paulus.
- source_word: ἵνα μὴ
  choice: damit ich nicht
  rationale: „Damit“ bewahrt die negative Ziel- beziehungsweise Zweckbeziehung der griechischen Konstruktion in natürlichem modernem Deutsch.
- source_word: λύπην ἐπὶ λύπην
  choice: Kummer über Kummer
  rationale: Die Wiederholung wird beibehalten und bringt die Häufung beziehungsweise Steigerung des Kummers zum Ausdruck.
- source_word: σχῶ
  choice: hätte
  rationale: Die Form von ἔχω wird zusammen mit „Kummer“ idiomatisch durch „hätte“ wiedergegeben; der abhängige Konjunktiv passt zur mit „damit“ eingeleiteten Aussage.
theological_decisions:
- issue: Art des göttlichen Erbarmens
  choice: „Gott hatte Erbarmen mit ihm“
  alternative: „Gott heilte ihn“
  rationale: Der Zusammenhang legt Genesung nahe, doch der griechische Text nennt ausdrücklich Gottes Erbarmen und nicht das Verb „heilen“. Die Übersetzung vermeidet daher eine unnötige Präzisierung.
- issue: Zweckbeziehung in ἵνα μὴ
  choice: „damit ich nicht“
  alternative: „sodass ich nicht“
  rationale: Die gewählte Fassung erhält die mögliche Zweckbedeutung und damit die Aussage über Gottes barmherziges Handeln, ohne weiter zu erklären, wie göttliche Absicht und menschliches Erleben zusammenhängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den eingeschobenen Kontrast lesbar, ohne die Satzstruktur aufzulösen. Die Wiederholung „Kummer über Kummer“ bleibt als bewusstes rhetorisches Bild erhalten.
