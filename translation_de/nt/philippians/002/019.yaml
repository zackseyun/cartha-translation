source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: de
  text: Ich hoffe aber im Herrn Jesus, Timotheus bald zu euch zu senden, damit auch ich zuversichtlich werde, wenn ich erfahre, wie es euch geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wenn ich erfahre, was euch betrifft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλπίζω
  choice: Ich hoffe
  rationale: Das Präsens bezeichnet die gegenwärtige Hoffnung beziehungsweise Erwartung des Paulus; „ich hoffe“ ist direkt und natürlich.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen leichten Übergang oder Gegensatz zum vorherigen Zusammenhang; „aber“ wahrt diese Diskursfunktion.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: im Herrn Jesus
  rationale: Die paulinische Wendung wird relational und theologisch offen bewahrt; ἐν wird nicht zu einer bloßen instrumentalen Aussage umgedeutet.
- source_word: Τιμόθεον
  choice: Timotheus
  rationale: Der Personenname folgt der etablierten deutschen Form.
- source_word: ταχέως
  choice: bald
  rationale: Hier liegt die zeitliche Bedeutung „bald“ näher als eine Betonung der Ausführungsgeschwindigkeit.
- source_word: πέμψαι ὑμῖν
  choice: zu euch zu senden
  rationale: Die Infinitivkonstruktion und das Ziel der Sendung werden in natürlichem Deutsch wiedergegeben.
- source_word: ἵνα κἀγὼ
  choice: damit auch ich
  rationale: „damit“ bewahrt den Zwecksinn von ἵνα; „auch ich“ gibt die Hervorhebung von κἀγώ wieder.
- source_word: εὐψυχῶ
  choice: neuen Mut fasse
  rationale: Das seltene Verb bezeichnet das Gewinnen guter Zuversicht beziehungsweise guten Mutes; diese Formulierung ist idiomatisch und konkreter als das passive „ermutigt werde“.
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: wenn ich erfahre, wie es euch geht
  rationale: Das Aoristpartizip wird als zeitlicher Nebensatz wiedergegeben; τὰ περὶ ὑμῶν bezeichnet idiomatisch die Nachrichten über ihre Lage. Die wörtlichere Breite wird in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von κύριος in ἐν κυρίῳ Ἰησοῦ
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist der etablierte und sachlich angemessene christologische Titel; der Vers bietet keinen Grund, ihn abzuschwächen oder umzudeuten.
- issue: Sinn von ἐν in ἐν κυρίῳ Ἰησοῦ
  choice: im Herrn Jesus
  alternative: durch den Herrn Jesus
  rationale: Die Übersetzung wahrt die genuine relationale beziehungsweise sphärische Offenheit der Wendung, statt sie eindeutig instrumental zu fassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Neuen Mut fasse“ gibt εὐψυχῶ anschaulich wieder; die idiomatische Haupttextfassung von τὰ περὶ ὑμῶν wird durch eine wörtlichere Fußnote ergänzt.
