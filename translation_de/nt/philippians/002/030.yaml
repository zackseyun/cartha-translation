source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: de
  text: Denn wegen des Werkes des Messias[a] kam er dem Tod nahe und setzte sein Leben aufs Spiel, um zu ergänzen, was an eurem Dienst für mich noch fehlte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Griechisch: „das Werk des Christus/Messias“.'
    reason: alternative_reading
  - marker: b
    text: Das, „was … noch fehlte“, bezeichnet den Dienst, den die Philipper wegen ihrer Abwesenheit nicht persönlich leisten konnten; es unterstellt ihnen keine mangelnde Bereitschaft.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι διὰ τὸ ἔργον Χριστοῦ
  choice: Denn für das Werk des Messias
  rationale: ὅτι begründet die vorausgehende Aussage und wird natürlich mit „denn“ wiedergegeben. διά mit Akkusativ bezeichnet hier den Grund beziehungsweise das, wofür Epaphroditus die Gefahr auf sich nahm. „Für das Werk“ ist im Deutschen natürlich und bewahrt die knappe Formulierung. Χριστός wird in seiner Titelfunktion als „Messias“ übersetzt.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: kam er dem Tod nahe
  rationale: Die Wendung besagt, dass er bis an die Schwelle des Todes gelangte. Die deutsche Formulierung bleibt dem Bild des griechischen Verbs nahe und ist zugleich gut verständlich.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: setzte sein Leben aufs Spiel
  rationale: Das Partizip beschreibt die bewusste Gefährdung des eigenen Lebens. ψυχή bezeichnet hier das irdische Leben, nicht eigens die immaterielle Seele.
- source_word: ἵνα ἀναπληρώσῃ
  choice: um zu ergänzen
  rationale: ἵνα kennzeichnet den Zweck. ἀναπληρόω meint hier, das praktisch Fehlende auszufüllen beziehungsweise zu ergänzen.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: was an eurem Dienst für mich noch fehlte
  rationale: ὑστέρημα bezeichnet das, was aufgrund der Abwesenheit der Philipper praktisch noch ausstand, ohne ihnen damit mangelnde Bereitschaft vorzuwerfen.
- source_word: τῆς πρός με λειτουργίας
  choice: an eurem Dienst für mich
  rationale: λειτουργία bezeichnet in diesem Zusammenhang die konkrete Hilfeleistung der Gemeinde für Paulus. „Dienst“ wahrt zugleich die weiter gefasste Bedeutung des Wortes.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in einer paulinischen Wendung
  choice: des Messias
  alternative: Christi
  rationale: Χριστός trägt hier weiterhin den Sinn des Titels „Messias“. Die Übersetzung macht diesen Titel hörbar, ohne die Aussage konfessionell näher festzulegen.
- issue: Bedeutung des Mangels im Dienst der Philipper
  choice: ein praktisch noch fehlender Dienst, den Epaphroditus ergänzte
  alternative: ein moralisches Versagen oder mangelnde Hilfsbereitschaft der Philipper
  rationale: Der Kontext stellt Epaphroditus als ihren Abgesandten dar. Gemeint ist daher die Hilfe, die sie Paulus wegen ihrer räumlichen Abwesenheit nicht persönlich leisten konnten, nicht ein Vorwurf gegen ihre Bereitschaft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kam dem Tod nahe“ bewahrt das griechische Bild; „setzte sein Leben aufs Spiel“ gibt die riskante Selbstgefährdung idiomatisch wieder. Die Formulierung vermeidet sowohl unnötige Altertümlichkeit als auch einen unbeabsichtigten Vorwurf an die Philipper.
