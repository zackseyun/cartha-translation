source:
  edition: SBLGNT
  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: de
  text: sondern er entleerte sich selbst[a], indem er die Gestalt eines Sklaven[b] annahm und den Menschen gleich wurde[c]; und seiner äußeren Erscheinung nach wurde er als Mensch erkannt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte sich selbst zu nichts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Gestalt eines Dieners“. Das griechische Wort bezeichnet gewöhnlich einen Sklaven, also einen Menschen in gebundener, abhängiger Stellung.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „indem er in der Gleichgestalt von Menschen wurde“. Das griechische Wort bezeichnet Ähnlichkeit bzw. Gleichgestalt; für sich genommen legt es weder bloßen Anschein noch eine weitergehende begriffliche Bestimmung fest.'
    reason: source_clarification
  - marker: d
    text: 'Oder: „und der Erscheinung nach als Mensch vorgefunden wurde“. Das griechische Wort für „Mensch“ ist hier allgemein und nicht geschlechtsspezifisch gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten Aussage des vorangehenden Verses führt ἀλλά einen starken Gegensatz ein; im Deutschen ist „sondern“ dafür die natürliche Entsprechung.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: er entleerte sich selbst
  rationale: Bewahrt das Bild von κενόω und den reflexiven Nachdruck, ohne eine bestimmte Theorie darüber einzutragen, worin die Entleerung bestand.
- source_word: μορφὴν δούλου λαβών
  choice: indem er die Gestalt eines Sklaven annahm
  rationale: „Gestalt“ erhält die Entsprechung zu μορφή und deren bewussten Gegensatz zu Vers 6. „Sklave“ gibt den rechtlich und sozial gebundenen Status von δοῦλος deutlicher wieder als „Diener“. Das einleitende „indem“ macht die modale Funktion des Partizips λαβών verständlich.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: und den Menschen gleich wurde
  rationale: Gibt das Werden und die Gleichheit mit Menschen in natürlichem Deutsch wieder. Der Plural ἀνθρώπων bezeichnet Menschen allgemein; die Formulierung behauptet keine bloße Scheinmenschlichkeit.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: und seiner äußeren Erscheinung nach wurde er als Mensch erkannt
  rationale: „Äußere Erscheinung“ unterscheidet σχῆμα von μορφή. „Als Mensch“ gibt das generische ἄνθρωπος wieder; „erkannt wurde“ vermittelt εὑρεθείς idiomatisch, ohne das Aussehen mit dem ganzen Menschsein gleichzusetzen.
theological_decisions:
- issue: Bedeutung der Selbstentleerung (ἑαυτὸν ἐκένωσεν)
  choice: Das Bild „entleerte sich selbst“ bleibt stehen; die folgenden Partizipien beschreiben, wie dies geschah.
  alternative: „machte sich selbst zu nichts“ oder eine ausdrückliche Aufgabe göttlicher Eigenschaften
  rationale: Der griechische Text nennt hier nicht ausdrücklich den Verlust göttlicher Eigenschaften. Die bildhafte Aussage und ihre Spannung sollen erhalten bleiben, statt durch eine kenotische Theorie erklärt zu werden.
- issue: Bedeutung von ὁμοίωμα in Bezug auf die Menschwerdung
  choice: Die Gleichheit mit den Menschen wird ausgedrückt, ohne sie als bloßen Anschein zu verstehen.
  alternative: „nur dem Schein nach menschlich“ oder eine stärkere Gleichsetzung, welche die besondere Wortwahl des Paulus beseitigt
  rationale: ὁμοίωμα wahrt eine sprachliche Spannung, leugnet aber im Zusammenhang nicht das wirkliche Menschsein. Die Übersetzung sollte weder Scheinmenschlichkeit nahelegen noch die Formulierung überpräzisieren.
- issue: Verhältnis von μορφή und σχῆμα
  choice: μορφή wird mit „Gestalt“, σχῆμα mit „äußere Erscheinung“ wiedergegeben.
  alternative: Beide Wörter einheitlich mit „Gestalt“ oder „Form“ wiederzugeben
  rationale: Die unterschiedliche Wiedergabe bewahrt die erkennbare lexikalische Unterscheidung im griechischen Text, ohne daraus eine starre metaphysische Definition abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber durch „indem“ idiomatisch gegliedert. „Sklave“ ist bewusst direkt und sozialgeschichtlich präzise; „äußere Erscheinung“ verhindert eine Vermischung von μορφή und σχῆμα.
