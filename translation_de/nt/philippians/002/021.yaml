  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: de
  text: Denn sie alle suchen ihre eigenen Interessen, nicht die von Jesus, dem Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“.'
    reason: Traditionelle Wiedergabe des Titels Χριστός und mögliche nameartige Lesart der festen Verbindung Ἰησοῦ Χριστοῦ.
lexical_decisions:
- source_word: οἱ πάντες
  choice: sie alle
  rationale: Der substantivierte Plural bezeichnet die gesamte hier gemeinte Personengruppe; „sie alle“ bewahrt den kollektiven Nachdruck.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ gibt die begründende Verbindung zum vorhergehenden Vers knapp und natürlich wieder.
- source_word: τὰ ἑαυτῶν
  choice: ihren eigenen Vorteil
  rationale: Der substantivierte neutrale Plural meint idiomatisch das, was den Betreffenden selbst nützt oder angeht. „Ihren eigenen Vorteil“ macht den eigennützigen Gegensatz im heutigen Deutsch verständlich.
- source_word: ζητοῦσιν
  choice: suchen
  rationale: „Suchen“ entspricht dem Grundsinn des Verbs und bewahrt dessen moralische Aussagekraft.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: das, was Jesus, dem Messias, dient
  rationale: Der zweite substantivierte neutrale Plural nimmt elliptisch das Gegenstück zu den eigenen Interessen auf. Die Formulierung gibt diesen Sinn natürlich wieder, ohne einen einzelnen konkreten Gegenstand zu unterstellen; „Messias“ bewahrt Χριστός als Titel.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  alternative: Jesus Christus
  rationale: Χριστός bezeichnet den Gesalbten und ist hier als Titel verständlich. Die traditionelle deutsche Namensform „Jesus Christus“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- issue: Bedeutung von τὰ Ἰησοῦ Χριστοῦ
  choice: das, was Jesus, dem Messias, dient
  alternative: die Interessen von Jesus, dem Messias
  rationale: Der griechische Ausdruck bleibt elliptisch und kann das betreffen, was Jesus angeht, ihm gehört oder seinem Anliegen dient. Die gewählte Fassung wahrt den Gegensatz zu selbstsüchtigem Vorteilsstreben, ohne ihn konfessionell weiter auszugestalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist idiomatisch und verständlich; die elliptische Gegenüberstellung des Griechischen wird behutsam entfaltet. Der Fußnotenmarker [a] steht unmittelbar nach der betreffenden Wendung.
