  yaml_path: translation/nt/philippians/002/005.yaml
  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: de
  text: 'Habt untereinander diese Haltung[a], die auch in Messias Jesus war[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denkt untereinander so.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Habt untereinander diese Haltung, die ihr auch in Messias Jesus habt.“ Das Griechische ist knapp und kann sowohl auf Jesu vorbildliche Haltung als auch auf die Haltung der mit ihm Verbundenen bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο φρονεῖτε
  choice: Habt … diese Haltung
  rationale: 'φρονέω bezeichnet hier mehr als bloßes Denken: eine innere Ausrichtung oder Haltung. Die Formulierung gibt den auffordernden Sinn des Präsensimperativs natürlich wieder; τοῦτο weist auf die folgende Darstellung voraus.'
- source_word: ἐν ὑμῖν
  choice: untereinander
  rationale: Das pluralische ὑμῖν und der gemeinschaftliche Zusammenhang in 2,1–4 sprechen für eine auf das Miteinander bezogene Wiedergabe.
- source_word: ὃ καὶ
  choice: die auch
  rationale: Das Relativpronomen verbindet die geforderte Haltung knapp mit der Haltung Jesu, ohne die komprimierte griechische Konstruktion unnötig auszubauen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Messias Jesus
  rationale: Χριστός hat hier Titelfunktion und wird daher mit „Messias“ wiedergegeben. Das „in“ bleibt erhalten, damit die genaue Beziehung nicht stärker festgelegt wird als im Griechischen.
theological_decisions:
- issue: Bezeichnet der Relativsatz die von Jesus vorgelebte Haltung oder die Haltung, die Glaubende in Verbundenheit mit ihm haben?
  choice: 'Exemplarische Lesart: „die auch in Messias Jesus war“'
  alternative: 'Partizipatorische Lesart: „die ihr auch in Messias Jesus habt“'
  rationale: Der anschließende Abschnitt stellt Jesu Selbsterniedrigung als maßgebliches Beispiel dar. Die knappe griechische Formulierung erlaubt jedoch auch eine auf die Verbundenheit mit dem Messias bezogene Ergänzung; diese Möglichkeit wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haltung“ erfasst die umfassende innere Ausrichtung von φρονεῖτε; „untereinander“ betont den gemeinschaftlichen Zusammenhang. Der Doppelname „Messias Jesus“ wahrt die griechische Reihenfolge und die Titelfunktion von Χριστός.
