  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: de
  text: Macht meine Freude dadurch vollkommen, dass ihr dieselbe Gesinnung[a] habt, dieselbe Liebe habt, einmütig[b] seid und auf das Eine bedacht[c] seid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dasselbe im Sinn habt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „gleich beseelt“; auch: „eines Herzens und einer Seele“.'
    reason: lexical_imagery
  - marker: c
    text: 'Oder: „auf ein und dasselbe Ziel ausgerichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: Macht meine Freude vollkommen
  rationale: Der Aoristimperativ fordert dazu auf, Paulus’ Freude zu ihrem vollen Maß zu bringen. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt das Bild des Vollmachens.
- source_word: ἵνα
  choice: indem
  rationale: ἵνα bezeichnet hier eng miteinander verbunden den Inhalt und die Weise, durch die Paulus’ Freude vollkommen werden soll. „Indem“ gibt diesen Zusammenhang im Deutschen klar wieder, ohne ihn ausschließlich als Folge oder Zweck festzulegen.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: ihr gleichgesinnt seid
  rationale: φρονέω bezeichnet hier nicht bloß einzelne Gedanken, sondern eine gemeinsame innere Ausrichtung. „Gleichgesinnt“ ist prägnant, würdig und im modernen Standarddeutsch verständlich.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: dieselbe Liebe habt
  rationale: Die Formulierung folgt eng der griechischen Wendung und bewahrt ἀγάπη als „Liebe“, ohne die gegenseitige oder gemeinschaftliche Bezugsrichtung näher festzulegen.
- source_word: σύμψυχοι
  choice: einmütig
  rationale: Das seltene zusammengesetzte Adjektiv bezeichnet eine tiefe innere Verbundenheit. „Einmütig“ ist idiomatisch und bewahrt den Gedanken gemeinsamer innerer Ausrichtung; das Seelenbild wird in der Fußnote sichtbar gemacht.
- source_word: τὸ ἓν φρονοῦντες
  choice: auf das Eine bedacht
  rationale: Die Wendung steigert den Einheitsgedanken und nimmt φρονέω erneut auf. „Auf das Eine bedacht“ bewahrt sowohl die substantivische Offenheit von τὸ ἕν als auch die bewusste Ausrichtung, ohne ein bestimmtes Ziel in den Text einzutragen.
theological_decisions:
- issue: Wie die wiederholte φρονέω-Sprache und der Einheitsappell wiederzugeben sind
  choice: „gleichgesinnt“ und „auf das Eine bedacht“
  alternative: „dasselbe im Sinn haben“ und „eines Sinnes sein“ beziehungsweise „auf ein gemeinsames Ziel ausgerichtet sein“
  rationale: Die Übersetzung gibt die Wiederholung durch verwandte Gesinnungs- und Ausrichtungssprache wieder, vermeidet aber die Behauptung vollständiger gedanklicher Uniformität. Das offene „das Eine“ wird nicht als bestimmtes institutionelles oder lehrmäßiges Programm erklärt.
- issue: Verhältnis von ἵνα zum Imperativ
  choice: modal-inhaltlich mit „indem“
  alternative: final oder konsekutiv mit „damit“ beziehungsweise inhaltlich mit „dass“
  rationale: Im Zusammenhang beschreibt die ἵνα-Konstruktion, worin die Vervollständigung der Freude besteht beziehungsweise wodurch sie geschieht. „Indem“ wahrt diese enge Verbindung, ohne die grammatische Nuance unnötig zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt knapp und rhythmisch; die vier parallelen Einheitsaussagen des Griechischen werden erhalten. „Das Eine“ ist bewusst großgeschrieben, weil der substantivierte Ausdruck offenbleibt und nicht vorschnell auf ein ausdrücklich genanntes Ziel eingeengt werden soll.
