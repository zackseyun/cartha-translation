lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: erniedrigte
  rationale: Das geläufige deutsche Äquivalent gibt die aktive, freiwillige Selbsterniedrigung klar und würdig wieder.
- source_word: ἑαυτὸν
  choice: sich selbst
  rationale: Das ausdrückliche Reflexivpronomen wird beibehalten, weil es die freiwillige Selbsterniedrigung hervorhebt.
- source_word: γενόμενος
  choice: und wurde
  rationale: Die koordinierte Formulierung klingt im Deutschen natürlich und wahrt den engen Zusammenhang zwischen Selbsterniedrigung und Gehorsam, ohne die genaue Beziehung des Partizips unnötig festzulegen.
- source_word: ὑπήκοος
  choice: gehorsam
  rationale: „Gehorsam“ ist das direkte und im Zusammenhang klare Äquivalent.
- source_word: μέχρι θανάτου
  choice: bis zum Tod
  rationale: 'Die Wendung bewahrt die mögliche Reichweite des Ausdrucks: Sein Gehorsam erstreckte sich bis in den Tod.'
- source_word: δὲ
  choice: ja, bis
  rationale: In der knappen Schlusswendung markiert „ja“ idiomatisch die rhetorische Steigerung zur besonderen Todesart.
- source_word: σταυροῦ
  choice: am Kreuz
  rationale: Die natürliche deutsche Wiedergabe des Genitivs benennt die konkrete Todesart, ohne zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Bedeutung von μέχρι θανάτου
  choice: „bis zum Tod“
  alternative: „bis in den Tod“
  rationale: „Bis zum Tod“ erhält die genuine Offenheit, ob vor allem die äußerste Grenze oder der Eintritt in den Tod betont wird; die Fußnote erläutert die Reichweite.
- issue: Kraft von θανάτου δὲ σταυροῦ
  choice: 'emphatische Steigerung: „ja, bis zum Tod am Kreuz“'
  alternative: „und zwar zum Tod am Kreuz“
  rationale: Die Formulierung bewahrt den rhetorischen Höhepunkt, ohne eine weitergehende theologische Erklärung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, hymnische Steigerung des griechischen Satzes bleibt erhalten; keine konfessionell geprägte Zusatzdeutung wird eingeführt.
