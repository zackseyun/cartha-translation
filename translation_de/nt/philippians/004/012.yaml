  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: de
  text: 'Ich weiß, mit wenig auszukommen, und ich weiß, Überfluss zu haben. In jeder Lage und in allem bin ich in das Geheimnis eingeweiht worden[a]: satt zu sein und zu hungern, Überfluss zu haben und Mangel zu leiden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich bin eingeweiht worden.« Paulus gebraucht die Sprache einer Einweihung bildlich für das Erlernen eines Geheimnisses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: ich weiß, wie es ist
  rationale: Mit den folgenden Infinitiven bezeichnet οἶδα praktische, durch Erfahrung erworbene Kenntnis. Die Formulierung ist im Deutschen natürlich und bewahrt den wiederholten Satzbau.
- source_word: ταπεινοῦσθαι
  choice: erniedrigt zu werden
  rationale: Die passive Form beschreibt, in niedrige oder bedrängte Verhältnisse gebracht zu werden, ohne die Bedeutung auf eine innere demütige Haltung zu verengen.
- source_word: περισσεύειν
  choice: Überfluss zu haben
  rationale: Die Wendung bezeichnet, mehr als genug zu haben, und bleibt breit genug, um nicht ausschließlich finanziellen Wohlstand auszudrücken.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: in jeder Lage und in allem
  rationale: Die Wiedergabe bewahrt die zwei rhetorisch verbundenen Ausdrücke und klingt zugleich in modernem Deutsch natürlich.
- source_word: μεμύημαι
  choice: bin ich in das Geheimnis eingeweiht worden
  rationale: Das Perfekt Passiv und die Bildsprache einer Einweihung werden unmittelbar wiedergegeben. Im Kontext meint Paulus die erlernte Befähigung, unter allen Lebensbedingungen zu bestehen.
- source_word: χορτάζεσθαι
  choice: satt zu sein
  rationale: Im Gegensatz zu πεινᾶν steht die konkrete Bedeutung des Sattseins im Vordergrund.
- source_word: πεινᾶν
  choice: zu hungern
  rationale: Die schlichte Formulierung bildet den klaren Gegensatz zu »satt zu sein«.
- source_word: ὑστερεῖσθαι
  choice: Mangel zu leiden
  rationale: Die Wendung bezeichnet Entbehrung allgemein und bildet einen natürlichen Gegensatz zu »Überfluss zu haben«, ohne sie auf Geldmangel zu beschränken.
theological_decisions:
- issue: Metaphorische Einweihungssprache in μεμύημαι
  choice: in das Geheimnis eingeweiht worden
  alternative: das Geheimnis gelernt
  rationale: Die formalere Wiedergabe erhält das ungewöhnliche Bild des griechischen Verbs, ohne daraus eine religiöse Geheimlehre abzuleiten; eine Fußnote erläutert den metaphorischen Gebrauch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarweise Struktur und die Gegensätze des griechischen Textes bleiben erhalten; die ungewöhnliche Einweihungsmetapher wird im Haupttext sichtbar und in der Fußnote knapp erläutert.
