  terminology: „im Herrn“ ist für ἐν κυρίῳ terminologisch etabliert und erhält die im griechischen Ausdruck angelegte relationale beziehungsweise sphärische Offenheit. „Freut euch“ gibt χαίρετε an beiden Stellen konsistent wieder. Die Fußnoten bieten jeweils vertretbare lexikalische beziehungsweise formnahe Alternativen.
