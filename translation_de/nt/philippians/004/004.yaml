  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes angemessen wieder: den pluralischen Imperativ Χαίρετε, die relationale Offenheit von ἐν κυρίῳ, πάντοτε als „allezeit“ sowie die betonte Wiederaufnahme πάλιν ἐρῶ, χαίρετε. „Noch einmal will ich sagen“ bewahrt die Futurform ἐρῶ idiomatisch, ohne sie in ein bloßes Präsens aufzulösen.'
