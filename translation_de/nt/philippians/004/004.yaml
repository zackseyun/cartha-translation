id: PHP.4.4
reference: Philippians 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: de
  text: 'Freut euch allezeit im Herrn[a]! Noch einmal will ich sagen[b]: Freut euch!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid allezeit fröhlich im Herrn.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wiederum werde ich sagen: Freut euch.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Freut euch
  rationale: Der griechische Präsensimperativ in der zweiten Person Plural wird im modernen Standarddeutsch natürlich und mit klarer Aufforderungskraft wiedergegeben. „Freut euch“ passt zudem zum paulinischen Ermahnungsstil.
- source_word: ἐν
  choice: im
  rationale: „Im Herrn“ bewahrt die räumlich-relationale Weite der griechischen Wendung und legt sie weder ausschließlich kausal noch instrumental aus.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ ist die etablierte, sachgerechte Wiedergabe von κύριος und bezieht sich hier im paulinischen Sprachgebrauch auf Christus.
- source_word: πάντοτε
  choice: allezeit
  rationale: „Allezeit“ gibt die umfassende zeitliche Bedeutung prägnant wieder und entspricht dem würdevollen biblischen Register, ohne unverständlich zu sein.
- source_word: πάλιν
  choice: Noch einmal
  rationale: Die Formulierung macht die emphatische Wiederholung im Deutschen natürlich deutlich.
- source_word: ἐρῶ
  choice: will ich sagen
  rationale: Die Futurform von λέγω bleibt erhalten; „will ich sagen“ ist idiomatischer als das missverständliche deutsche „werde ich sagen“ und bewahrt den angekündigten erneuten Ausspruch.
- source_word: χαίρετε
  choice: Freut euch
  rationale: Die Wiederholung wird gleichlautend wiedergegeben, damit die rhetorische Verstärkung des griechischen Textes erhalten bleibt.
theological_decisions:
- issue: Bedeutung von „im Herrn“
  choice: 'Die relationale beziehungsweise sphärische Aussage bleibt offen: Die Freude geschieht in der Beziehung und Zugehörigkeit zum Herrn.'
  alternative: „Freut euch wegen des Herrn“ oder „durch den Herrn“
  rationale: ἐν κυρίῳ bezeichnet bei Paulus häufig eine Beziehungssphäre. Die wörtlich-nahe Wendung „im Herrn“ bewahrt die theologische Breite, ohne eine ausschließlich kausale oder instrumentale Deutung festzulegen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Ausrufezeichen bilden den auffordernden Charakter ab. „Allezeit“ hält ein leicht gehobenes biblisches Register; „immer“ wäre eine alltagssprachlichere Alternative.
