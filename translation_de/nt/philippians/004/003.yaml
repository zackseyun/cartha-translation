source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: de
  text: 'Ja, auch dich bitte ich, du treuer Gefährte[a]: Hilf diesen Frauen! Sie haben gemeinsam mit mir im Dienst des Evangeliums gekämpft[b], zusammen mit Klemens und meinen übrigen Mitarbeitern, deren Namen im Buch des Lebens stehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „echter Jochgefährte“; manche verstehen das Wort als Eigennamen: „Syzygus“.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Sie haben im Evangelium Seite an Seite mit mir gerungen“ oder „Sie haben gemeinsam mit mir für das Evangelium gekämpft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Ja
  rationale: Bewahrt den bekräftigenden, unmittelbaren Übergang am Anfang der persönlichen Bitte.
- source_word: ἐρωτῶ
  choice: bitte ich
  rationale: Gibt den schlichten Sinn der persönlichen Bitte wieder, ohne ihn zu einem stärkeren Ermahnen zu steigern.
- source_word: γνήσιε σύζυγε
  choice: du treuer Gefährte
  rationale: Versteht σύζυγος als beschreibende Anrede und gibt die enge, verlässliche Zusammenarbeit in natürlichem Deutsch wieder; die wörtlichere Metapher und die mögliche Deutung als Eigenname stehen in der Fußnote.
- source_word: συλλαμβάνου
  choice: Steh … bei
  rationale: Drückt die geforderte aktive Hilfe idiomatisch und würdig aus.
- source_word: αὐταῖς
  choice: diesen Frauen
  rationale: Macht den femininen Plural und den Rückbezug auf Evodia und Syntyche im Deutschen eindeutig.
- source_word: συνήθλησάν μοι
  choice: haben gemeinsam mit mir … gekämpft
  rationale: Erhält das Bild gemeinsamen Ringens oder Wettkampfs, ohne im Deutschen unnatürlich zu wirken.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: für das Evangelium
  rationale: Gibt den gemeinten Wirkungsbereich beziehungsweise Einsatz idiomatisch wieder; die engere Formulierung „im Evangelium“ bleibt als lexikalische Möglichkeit in der Fußnote erkennbar.
- source_word: συνεργῶν
  choice: Mitarbeitern
  rationale: Eine klare, geläufige Wiedergabe der paulinischen Bezeichnung für Menschen, die mit ihm gemeinsam arbeiten.
- source_word: βίβλῳ ζωῆς
  choice: Buch des Lebens
  rationale: Bewahrt die etablierte biblische Wendung verständlich und ohne zusätzliche Auslegung.
theological_decisions:
- issue: Deutung von γνήσιε σύζυγε
  choice: 'Beschreibende Anrede an einen nicht namentlich genannten Gefährten: „du treuer Gefährte“'
  alternative: Eigenname „Syzygos“ oder wörtlicher „echter Jochgefährte“
  rationale: Die Verbindung mit γνήσιε lässt sich natürlich als beschreibende Anrede verstehen. Da sowohl die Metapher als auch die Deutung als Eigenname ernsthaft möglich sind, werden sie in einer Fußnote bewahrt.
- issue: Bezug von μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου
  choice: Klemens und die übrigen Mitarbeiter werden als weitere Beteiligte am gemeinsamen Einsatz genannt.
  alternative: Die Wendung könnte syntaktisch enger mit der Aufforderung zum Beistehen verbunden verstanden werden.
  rationale: Die Stellung im Satz spricht am natürlichsten dafür, Klemens und die übrigen Mitarbeiter dem gemeinsamen Ringen für das Evangelium zuzuordnen; die griechische Satzfügung bleibt jedoch gedrängt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der energische Imperativ bleiben erhalten. „Für das Evangelium gekämpft“ bewahrt das Wettkampf- und Ringensbild des griechischen Verbs, während die Fußnote die ungewöhnlichere, formal nähere Fassung dokumentiert.
