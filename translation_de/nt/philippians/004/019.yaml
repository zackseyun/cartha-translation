source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: de
  text: Und mein Gott wird euren ganzen Bedarf decken nach seinem Reichtum in Herrlichkeit im Messias Jesus.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus Jesus“.'
    reason: lexical_alternative
  - marker: b
    text: „Nach seinem Reichtum“ bezeichnet den Maßstab von Gottes Versorgung, nicht lediglich ihre Quelle.
    reason: alternative_reading
  - marker: c
    text: „In Herrlichkeit“ kann möglicherweise auch „herrlich“ bedeuten; die genaue Zuordnung der Wendung bleibt im Griechischen offen.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρώσει
  choice: wird … erfüllen
  rationale: Das Futur von πληρόω bezeichnet hier, dass Gott das Fehlende deckt. „Erfüllen“ bleibt nahe am griechischen Bild und ist in Verbindung mit „Bedarf“ verständlich.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: jeden Bedarf von euch
  rationale: χρεία bezeichnet Bedarf oder Notwendigkeit; πᾶσαν hat distributive Kraft. Die Formulierung bewahrt zudem den möglichen Bezug auf das tatsächlich Benötigte, ohne Wünsche einzuschließen.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: nach seinem Reichtum
  rationale: κατά mit Akkusativ bezeichnet hier Maßstab oder Entsprechung, nicht nur die Quelle. „Nach seinem Reichtum“ gibt diese Maßgabe knapp wieder.
- source_word: ἐν δόξῃ
  choice: in Herrlichkeit
  rationale: Die formale Wiedergabe erhält die im Griechischen offene syntaktische und semantische Zuordnung, statt sie vorschnell als „herrlich“ zu deuten.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός ist hier ein messianischer Titel. „Messias“ übersetzt seinen Sinn; die traditionelle Wiedergabe „Christus Jesus“ wird in einer Fußnote genannt.
- source_word: ὁ δὲ θεός μου
  choice: Und mein Gott
  rationale: δέ knüpft hier leicht an den vorausgehenden Gedankengang an. „Und“ vermeidet einen zu starken Gegensatz und bewahrt den persönlichen Ausdruck „mein Gott“.
theological_decisions:
- issue: Wiedergabe von Χριστός in ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: in Christus Jesus
  rationale: Der griechische Ausdruck verwendet Χριστός als Titel. Die Hauptfassung übersetzt dessen Bedeutung, während die kirchlich vertraute Form als echte lexikalische Alternative in der Fußnote erhalten bleibt.
- issue: Bezug und Nuance von ἐν δόξῃ
  choice: in Herrlichkeit
  alternative: herrlich
  rationale: Die Präpositionalphrase kann Gottes Reichtum, die Art der Erfüllung oder den Bereich der Erfüllung näher bestimmen. Die formale Fassung wahrt diese theologische und syntaktische Offenheit.
- issue: Verhältnis von ἐν δόξῃ und ἐν Χριστῷ Ἰησοῦ
  choice: fortlaufende Wiedergabe ohne auflösende Umstellung
  alternative: „im Messias Jesus in Herrlichkeit“ oder eine adverbiale Auflösung
  rationale: Die griechische Reihung lässt die genaue Zuordnung der beiden Präpositionalphrasen offen. Die Übersetzung erhält diese Spannung, statt eine einzige Analyse festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bedarf“ ist bewusst gewählt, um χρεία präzise als das Benötigte wiederzugeben. Die etwas dichte Folge „nach seinem Reichtum in Herrlichkeit im Messias Jesus“ bewahrt die genuine Mehrdeutigkeit der griechischen Präpositionalphrasen; Fußnoten erläutern sie, ohne den Haupttext konfessionell festzulegen.
