review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzglieder und die zentrale Nuance von κατά mit Akkusativ („nach/gemäß“, Maßstab der Versorgung) grundsätzlich zutreffend wieder. „In Herrlichkeit“ und „im Messias Jesus“ erhalten die im griechischen Satz nicht abschließend aufgelöste Zuordnung der Präpositionalphrasen. πληρώσει bezeichnet hier jedoch idiomatisch das Decken des Bedarfs, nicht das Erfüllen eines Bedarfs.
  naturalness: „Jeden Bedarf von euch erfüllen“ ist im modernen Standarddeutsch sowohl wegen der Genitivumschreibung „von euch“ als auch wegen der Verbindung „Bedarf erfüllen“ unnatürlich. „Euren ganzen Bedarf decken“ ist idiomatisch, wahrt den kollektiven Singular von χρεία und bringt die umfassende Kraft von πᾶσαν angemessen zum Ausdruck. Die dichte Folge der Präpositionalphrasen bleibt bewusst erhalten.
  terminology: „Messias Jesus“ gibt Χριστός als Titel wieder; „im Messias Jesus“ ist dabei grammatisch korrekt. „Reichtum“, „Herrlichkeit“ und „Bedarf“ sind sachgerecht. Die Fußnoten erläutern die traditionelle Alternative, den Maßstabscharakter von κατά und die offene Nuance von ἐν δόξῃ ohne eine dogmatische Auslegung festzulegen.
  issues:
