    issue: Unidiomatische Wiedergabe von πᾶσαν χρείαν ὑμῶν und πληρώσει
    rationale: „jeden Bedarf von euch erfüllen“ ist keine natürliche deutsche Verbindung. Bedarf wird gedeckt; die possessive Beziehung wird idiomatisch durch „euren ... Bedarf“ ausgedrückt.
