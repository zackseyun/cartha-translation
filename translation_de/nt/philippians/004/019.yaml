revisions:
- from: Und mein Gott wird jeden Bedarf von euch erfüllen nach seinem Reichtum in Herrlichkeit im Messias Jesus.[a][b][c]
  to: Und mein Gott wird euren ganzen Bedarf decken nach seinem Reichtum in Herrlichkeit im Messias Jesus.[a][b][c]
  rationale: 'Die Revision beschränkt sich auf eine sichere idiomatische Korrektur: Gottes zukünftiges Decken des gesamten Bedarfs entspricht hier dem Sinn von πληρόω im Kontext besser als „Bedarf erfüllen“. Die Reihenfolge und damit die offene Beziehung der beiden abschließenden Präpositionalphrasen werden nicht umgestellt.'
  reviewer_model: gpt-5.6-terra
