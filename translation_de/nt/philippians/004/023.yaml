base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: de
  text: Die Gnade des Herrn Jesus Christus sei mit eurem Geist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Handschriften haben: „mit euch allen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Der etablierte paulinische Segensbegriff bewahrt sowohl das unverdiente göttliche Wohlwollen als auch sein theologisches Gewicht.
- source_word: κυρίου
  choice: Herrn
  rationale: κύριος ist hier der christologische Titel Jesu; „Herr“ ist die natürliche und traditionsübergreifend verständliche deutsche Entsprechung.
- source_word: Χριστοῦ
  choice: Christus
  rationale: In der festen Verbindung „Herr Jesus Christus“ wirkt Χριστός stark namenähnlich. „Christus“ ist im Deutschen natürlich und bewahrt zugleich den bekannten messianischen Titel.
- source_word: μετὰ
  choice: mit
  rationale: μετά mit Genitiv bezeichnet hier Begleitung beziehungsweise Gegenwart; „mit“ gibt dies unmittelbar wieder.
- source_word: πνεύματος
  choice: Geist
  rationale: Gemeint ist am ehesten der menschliche Geist beziehungsweise das gemeinsame innere Leben der Adressaten, nicht ausdrücklich der Heilige Geist.
- source_word: ὑμῶν
  choice: eurem
  rationale: Das Possessivpronomen ist im Griechischen pluralisch. „Eurem“ macht die Mehrzahl der Angesprochenen im Deutschen ausdrücklich sichtbar.
theological_decisions:
- issue: Ist πνεύματος als menschlicher Geist oder als Heiliger Geist zu verstehen?
  choice: menschlicher Geist, daher „Geist“ kleingeschrieben
  alternative: Heiliger Geist beziehungsweise „Geist“ als Bezeichnung des göttlichen Geistes
  rationale: Das Possessivpronomen „eurem“ und die paulinische Segensformel sprechen am ehesten für den menschlichen Geist, möglicherweise kollektiv als das gemeinsame innere Leben der Gemeinde. Die Formulierung bleibt dennoch knapp und legt die genaue anthropologische Nuance nicht weiter fest.
- issue: Soll Χριστοῦ als „Christus“ oder „Messias“ wiedergegeben werden?
  choice: Christus
  alternative: Messias
  rationale: Obwohl Χριστός ursprünglich ein Titel ist, ist die vollständige Formel „Herr Jesus Christus“ bei Paulus stark etabliert und namenähnlich. „Christus“ klingt im modernen Deutschen würdig und natürlich, ohne den messianischen Hintergrund auszuschließen.
- issue: Textvariante beim Possessivpronomen
  choice: „eurem Geist“ nach ὑμῶν
  alternative: „dem Geist“ ohne Possessivpronomen
  rationale: Der SBLGNT-Haupttext enthält ὑμῶν, doch eine bedeutende Textvariante lässt das Pronomen aus. Die Übersetzung folgt dem vorgegebenen Haupttext und nennt die Variante in einer Fußnote.
translation_notes:
  register: Moderne, würdige Segensformel. Der Konjunktiv „sei“ gibt den im griechischen Nominalsatz vorausgesetzten Segenswunsch natürlich wieder. Das pluralische „eurem“ verhindert, dass die Anrede irrtümlich als Singular verstanden wird.
