    issue: Die Fußnote beschreibt die Textvariante unzutreffend.
    rationale: Die wesentliche abweichende Lesart lautet nicht einfach „mit dem Geist“ durch Wegfall von ὑμῶν, sondern „mit euch allen“ (μετὰ πάντων ὑμῶν) anstelle von „mit eurem Geist“. Die Fußnote muss diese Alternative korrekt und vollständig wiedergeben.
