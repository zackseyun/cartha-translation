    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Kennzeichnet einen milden Gegensatz zum vorher Gesagten, ohne die Anerkennung der Gemeinde abzuschwächen. „Doch“ ist im modernen Deutschen knapp und natürlich.
- source_word: καλῶς ἐποιήσατε
  choice: habt ihr gut daran getan
  rationale: Die feste deutsche Wendung gibt die positive Bewertung der Handlung idiomatisch wieder und entspricht dem Aorist.
- source_word: συγκοινωνήσαντές
  choice: Anteil zu nehmen
  rationale: Bringt die aktive Beteiligung und Verbundenheit mit Paulus zum Ausdruck, ohne die Art der Hilfe enger festzulegen, als es der griechische Text tut.
- source_word: μου τῇ θλίψει
  choice: an meiner Bedrängnis
  rationale: „Bedrängnis“ bewahrt das Gewicht von θλῖψις und lässt sowohl äußere Not als auch persönlichen Druck anklingen; μου wird natürlich als Zugehörigkeit zu Paulus wiedergegeben.
theological_decisions:
- issue: Art der Beteiligung an der Bedrängnis des Paulus
  choice: Allgemein als „Anteil nehmen“ wiedergegeben
  alternative: Konkret als finanzielle Unterstützung oder als gemeinsames Leiden deuten
  rationale: Der unmittelbare Zusammenhang betrifft zwar die Gabe der Philipper, doch συγκοινωνέω bezeichnet umfassender Beteiligung oder Gemeinschaft. Die Übersetzung lässt diese Spannung bestehen und verengt die Aussage nicht ausschließlich auf Geldhilfe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist gut verständlich und bewahrt den milden Gegensatz sowie den Gedanken aktiver Teilhabe.
