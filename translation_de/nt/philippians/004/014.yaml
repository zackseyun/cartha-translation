  text: πλὴν καλῶς ἐποιήσατε συγκοινωνήσαντές μου τῇ θλίψει.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/014.yaml
  text: Nevertheless[b][a], you did well by sharing in my affliction.
translation:
  language: de
  text: Doch[a] habt ihr gut daran getan, an meiner Bedrängnis[b] teilzuhaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dennoch“ oder „Jedoch“.'
