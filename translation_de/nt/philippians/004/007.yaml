id: PHP.4.7
reference: Philippians 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: de
  text: Und der Frieden Gottes, der alles Verstehen übersteigt, wird eure Herzen und eure Gedanken im Messias Jesus bewahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Christus Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: Frieden
  rationale: „Frieden“ ist die klare und natürliche deutsche Entsprechung und lässt die innere wie auch die zwischenmenschliche Dimension des Begriffs offen.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird unmittelbar als „Gottes“ wiedergegeben; eine mögliche Herkunftsbedeutung wird nicht erklärend in den Haupttext eingetragen.
- source_word: ἡ ὑπερέχουσα
  choice: der … übersteigt
  rationale: Die Formulierung gibt das Übertreffen oder Hinausragen idiomatisch und präzise wieder.
- source_word: πάντα νοῦν
  choice: alles Verstehen
  rationale: νοῦς kann „Sinn“, „Verstand“ oder „Denken“ bezeichnen. In dieser Wendung ist „alles Verstehen“ natürlich und bewahrt den Bezug auf die Grenzen menschlichen Begreifens.
- source_word: φρουρήσει
  choice: wird … bewahren
  rationale: Das Verb bezeichnet schützendes Bewachen, auch mit militärischem Hintergrund. „Bewahren“ klingt im Deutschen natürlich und erhält den Schutzgedanken.
- source_word: τὰς καρδίας ὑμῶν
  choice: eure Herzen
  rationale: „Herzen“ bewahrt die biblische Bezeichnung für das innere Leben und die Mitte der Person.
- source_word: τὰ νοήματα ὑμῶν
  choice: eure Gedanken
  rationale: νοήματα bezeichnet Gedanken, Überlegungen oder gedankliche Vorgänge. „Gedanken“ unterscheidet den Ausdruck sachgerecht von νοῦς im vorausgehenden Satzteil.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird als Titel mit „Messias“ übersetzt. Die Präposition ἐν bezeichnet hier die Sphäre der Zugehörigkeit und Geborgenheit in Jesus als dem Messias.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in der paulinischen Wendung ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: in Christus Jesus
  rationale: Die Wiedergabe als „Messias“ macht den Titelgehalt von Χριστός sichtbar, ohne die Wendung auf einen bloßen Eigennamen zu reduzieren. „Im“ bewahrt zugleich die für Paulus charakteristische Vorstellung einer Lebens- und Zugehörigkeitssphäre.
- issue: Reichweite von πάντα νοῦν
  choice: alles Verstehen
  alternative: jeden Verstand
  rationale: Die Wendung kann formal auf „jeden Verstand“ bezogen werden; im Kontext liegt jedoch das Übersteigen aller menschlichen Erkenntnisfähigkeit nahe. „Alles Verstehen“ gibt dies wieder, ohne näher festzulegen, auf welche Weise Gottes Frieden das Begreifen übersteigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, während „alles Verstehen“ und „eure Gedanken“ natürlich und verständlich formuliert sind. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Gesamtausdruck am Versende.
