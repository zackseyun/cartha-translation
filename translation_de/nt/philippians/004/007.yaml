  source_fidelity: 'Der Text gibt alle Bestandteile des griechischen Satzes genau wieder: καὶ ist mit „Und“ erhalten; der Genitiv τοῦ θεοῦ als „Gottes“; ἡ ὑπερέχουσα πάντα νοῦν als „der alles Verstehen übersteigt“; das Futur φρουρήσει als „wird … bewahren“; und die beiden Objekte καρδίας und νοήματα als „Herzen“ und „Gedanken“. „Im Messias Jesus“ wahrt die präpositionale Wendung ἐν Χριστῷ Ἰησοῦ und übersetzt den Titel Χριστός sinnvoll. Die militärisch schützende Nuance von φρουρήσει bleibt mit „bewahren“ angemessen erkennbar, ohne künstlich zu wirken.'
