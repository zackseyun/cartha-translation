id: PHP.4.6
reference: Philippians 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: de
  text: Macht euch um nichts Sorgen[a], sondern bringt in jeder Lage durch Gebet und Flehen[b], verbunden mit Dank, eure Anliegen vor Gott[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seid um nichts besorgt.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »inständiges Bitten« statt »Flehen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »zu Gott hin«; auch möglich: »Gott gegenüber«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Macht euch um nichts Sorgen
  rationale: Die Formulierung gibt das umfassende Verbot idiomatisch und verständlich wieder; μεριμνάω bezeichnet hier belastendes Sorgen oder ängstliche Unruhe.
- source_word: ἐν παντί
  choice: in jeder Lage
  rationale: Die Wendung bewahrt den umfassenden Sinn und macht deutlich, dass jede Situation gemeint ist, ohne den griechischen Ausdruck unnötig einzuengen.
- source_word: τῇ προσευχῇ
  choice: Gebet
  rationale: Dies ist die übliche, breite Bezeichnung für das Reden zu Gott.
- source_word: τῇ δεήσει
  choice: Flehen
  rationale: Das Wort bezeichnet ein dringliches, auf ein konkretes Bedürfnis gerichtetes Bitten und bleibt so von dem allgemeineren »Gebet« unterscheidbar.
- source_word: μετ’ εὐχαριστίας
  choice: verbunden mit Dank
  rationale: Die Wiedergabe lässt den Dank als begleitende Haltung des Betens und Flehens erkennen und klingt im modernen Deutschen natürlich.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: eure Anliegen
  rationale: »Anliegen« bezeichnet verständlich die konkreten Dinge, um die gebeten wird, und vermeidet eine schwerfällige Wiederholung von »Bitten« neben »Flehen«.
- source_word: γνωριζέσθω
  choice: bringt ... vor
  rationale: Der griechische passive Imperativ fordert dazu auf, die Anliegen Gott bekannt werden zu lassen. Die aktive deutsche Wendung ist idiomatisch und bewahrt die Aufforderung, ohne anzudeuten, Gott müsse erst informiert werden.
- source_word: πρὸς τὸν θεόν
  choice: vor Gott
  rationale: In Verbindung mit Anliegen ist »vor Gott bringen« eine natürliche deutsche Entsprechung, die die Ausrichtung des Gebets auf Gott ausdrückt.
theological_decisions:
- issue: Gottes Wissen und das Bekanntmachen der Anliegen
  choice: bringt ... eure Anliegen vor Gott
  alternative: lasst eure Anliegen Gott bekannt werden
  rationale: Die natürliche deutsche Wendung bewahrt den Sinn der Aufforderung, ohne aus dem Vers eine Aussage darüber abzuleiten, ob Gott die Anliegen zuvor kennt oder nicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Macht euch um nichts Sorgen« ist idiomatischer als eine streng formale Nachbildung; »Flehen« erhält die Unterscheidung zwischen dem allgemeinen Gebet und der konkreten, dringlichen Bitte. Die Satzstellung bindet den Dank klar an Gebet und Flehen.
