  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: de
  text: Unserem Gott und Vater sei die Ehre für immer und ewig[a]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in die Zeitalter der Zeitalter“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel markiert hier nur leicht den Übergang zur abschließenden Doxologie. Ein deutsches „aber“ würde einen zu starken Gegensatz ausdrücken; „nun“ könnte fälschlich zeitlich verstanden werden.
- source_word: τῷ θεῷ καὶ πατρὶ ἡμῶν
  choice: unserem Gott und Vater
  rationale: Die Wendung bezeichnet in natürlichem Deutsch eine Person; „unserem“ bezieht sich sinngemäß auf beide Bezeichnungen.
- source_word: ἡ δόξα
  choice: sei die Ehre
  rationale: Die griechische Nominalklausel enthält kein ausgesprochenes Verb. Das ergänzte „sei“ entspricht der doxologischen Funktion und klingt im Deutschen würdig und natürlich.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die idiomatische deutsche Wendung gibt die unbegrenzte Dauer und den feierlichen Klang der griechischen Formel wieder.
- source_word: ἀμήν
  choice: Amen
  rationale: Die etablierte liturgische Lehnform bleibt erhalten und bringt die bestätigende Bekräftigung zum Ausdruck.
theological_decisions:
- issue: Ergänzung des in der Doxologie unausgesprochenen Verbs
  choice: sei die Ehre
  alternative: ist die Ehre / gehört die Ehre
  rationale: Der griechische Satz ist verblos und lässt grammatisch Aussage oder Wunschformel zu. Im Kontext einer Doxologie gibt „sei die Ehre“ die wahrscheinlichste Funktion wieder, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem doxologischem Ton. „Ehre“ ist hier natürlicher als das ebenfalls mögliche „Herrlichkeit“ und bezeichnet die Gott zukommende Verherrlichung.
