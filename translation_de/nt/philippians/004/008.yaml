id: PHP.4.8
reference: Philippians 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: de
  text: 'Im Übrigen, Brüder[a]: Was wahr ist, was ehrbar, was gerecht, was rein, was liebenswert, was anerkennenswert ist, wenn es irgendeine Tugend und wenn es irgendein Lob gibt – darauf seid bedacht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort „Brüder“ kann die gesamte glaubende Gemeinschaft ansprechen.'
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Im Übrigen
  rationale: Gibt den überleitenden Ausdruck wieder, ohne zwingend anzunehmen, dass Paulus bereits seinen letzten Punkt einleitet; auch „Schließlich“ wäre möglich.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die maskuline Pluralform der direkten Anrede; im damaligen Sprachgebrauch kann sie die gesamte glaubende Gemeinschaft einschließlich der Frauen bezeichnen.
- source_word: ὅσα
  choice: was
  rationale: Die wiederholte neutrale Relativform lässt sich im Deutschen natürlich und unter Wahrung des katalogartigen Rhythmus mit „was“ wiedergeben.
- source_word: ἀληθῆ
  choice: wahr
  rationale: Bezeichnet in der ethischen Aufzählung umfassend das Wahre und Wahrhaftige.
- source_word: σεμνά
  choice: ehrbar
  rationale: Vermittelt Würde und moralische Achtbarkeit in knapper, gegenwärtig verständlicher Form.
- source_word: δίκαια
  choice: gerecht
  rationale: Bewahrt die ethische Bedeutung dessen, was recht und gerecht ist, ohne sie auf bloße Fairness einzuengen.
- source_word: ἁγνά
  choice: rein
  rationale: Erhält sowohl die moralische als auch die innere Dimension des griechischen Begriffs.
- source_word: προσφιλῆ
  choice: liebenswert
  rationale: Gibt wieder, was Zuneigung hervorruft oder der Liebe wert ist; „angenehm“ wäre schwächer.
- source_word: εὔφημα
  choice: anerkennenswert
  rationale: Erfasst, was einen guten Ruf hat oder wovon man gut sprechen kann, ohne bereits das nachfolgende „Lob“ vorwegzunehmen.
- source_word: εἴ τις ἀρετὴ
  choice: wenn es irgendeine Tugend gibt
  rationale: Bewahrt die konditionale Form und den kompakten ethischen Begriff ἀρετή; gemeint sein kann auch sittliche Vortrefflichkeit.
- source_word: εἴ τις ἔπαινος
  choice: wenn es irgendein Lob gibt
  rationale: Gibt die parallele Bedingungsform sowie die Grundbedeutung von ἔπαινος direkt wieder.
- source_word: ταῦτα λογίζεσθε
  choice: darauf seid bedacht
  rationale: Drückt die anhaltende, bewusste gedankliche Ausrichtung des Imperativs idiomatisch und würdig aus; es geht um mehr als einen flüchtigen Gedanken.
theological_decisions:
- issue: Adressatenumfang von ἀδελφοί
  choice: Im Haupttext „Brüder“, ergänzt durch eine Fußnote zum einschließenden antiken Gebrauch
  alternative: „Brüder und Schwestern“
  rationale: So bleibt die grammatische Form sichtbar, während zugleich klargestellt wird, dass die Anrede die ganze glaubende Gemeinschaft umfassen kann.
- issue: Konditionale Form εἴ τις … εἴ τις
  choice: Die zweimalige Form „wenn es irgendeine … gibt“ wird bewahrt
  alternative: Zusammenfassend „was tugendhaft und lobenswert ist“
  rationale: Die wörtliche Bedingungsform wirkt rhetorisch und stellt Tugend und Lob als zusammenfassende Prüfkategorien heraus; sie sollte nicht stillschweigend geglättet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rhythmischer Wiederholung. Die knappen Adjektive folgen der Form des griechischen Tugendkatalogs. „Im Übrigen“ wahrt die mögliche Bedeutung einer allgemeinen Überleitung besser als das stärker abschließend klingende „Schließlich“.
