id: PHP.4.9
reference: Philippians 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: de
  text: Was ihr auch gelernt und empfangen und gehört und an mir gesehen habt[b] – das setzt in die Tat um[a]. Und der Gott des Friedens wird mit euch sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das tut«.'
    reason: lexical_alternative
  - marker: b
    text: „An mir gesehen“ kann auch mit „an meinem Beispiel gesehen“ oder „in meinem Leben gesehen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: Was
  rationale: Das substantivisch gebrauchte Relativpronomen leitet den gesamten Inhalt der Ermahnung ein. „Was“ ist im Deutschen natürlich und wird durch das rückverweisende „das“ aufgenommen.
- source_word: ἐμάθετε
  choice: gelernt
  rationale: Bezeichnet das, was die Philipper von Paulus gelernt haben; die schlichte Wiedergabe wahrt den Parallelismus.
- source_word: παρελάβετε
  choice: empfangen
  rationale: Kann die Annahme vermittelter Lehre oder Überlieferung bezeichnen. „Empfangen“ lässt diese Bedeutungsbreite bestehen, ohne „Überlieferung“ ausdrücklich einzutragen.
- source_word: ἠκούσατε
  choice: gehört
  rationale: Gibt das Verb direkt und parallel zu den übrigen Verben der Reihe wieder.
- source_word: εἴδετε ἐν ἐμοί
  choice: an mir gesehen
  rationale: „An mir“ ist im Deutschen natürlicher als das wörtlichere „in mir“ und bezeichnet dennoch offen das, was an Paulus selbst wahrnehmbar war, ohne es im Haupttext auf sein „Vorbild“ oder seine „Lebensführung“ festzulegen.
- source_word: ταῦτα πράσσετε
  choice: das setzt in die Tat um
  rationale: Die Formulierung bringt den auffordernden und auf gelebte Praxis zielenden Sinn von πράσσετε in natürlichem Deutsch zum Ausdruck. Das rückverweisende „das“ fasst die mehreren zuvor genannten Inhalte kollektiv zusammen.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: der Gott des Friedens
  rationale: Bewahrt die geläufige paulinische Genitivverbindung, ohne sie deutend zu „der Gott, der Frieden gibt“ zu erweitern.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: wird mit euch sein
  rationale: Direkte Wiedergabe der zukünftigen Zusage der Gegenwart Gottes.
theological_decisions:
- issue: Verhältnis zwischen dem Tun der Ermahnung und Gottes Gegenwart
  choice: Die Aufforderung und die Zusage werden mit „Und“ verbunden, ohne eine ausdrückliche Wenn-dann-Bedingung zu formulieren.
  alternative: Die Aussage als eindeutige kausale oder konditionale Verknüpfung wiederzugeben.
  rationale: Das griechische καί koordiniert die beiden Aussagen, formuliert aber keine ausdrückliche Bedingung. So bleiben die pastorale Verheißung und die theologische Spannung des Textes erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Verknüpfungen mit „und“ bewahren die nachdrückliche Reihung des griechischen Textes; der Gedankenstrich markiert den Übergang von den Relativsätzen zur Aufforderung.
