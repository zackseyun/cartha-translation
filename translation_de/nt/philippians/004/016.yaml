lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die Aussage im Zusammenhang ein und klingt im Deutschen als Satzanschluss natürlich.
- source_word: ἐν Θεσσαλονίκῃ
  choice: als ich in Thessalonich war
  rationale: Gibt den lokativen Ausdruck im Deutschen natürlich wieder; aus dem Zusammenhang ist Paulus derjenige, der sich dort befand.
- source_word: ἅπαξ καὶ δὶς
  choice: mehr als einmal
  rationale: Die griechische Wendung bedeutet idiomatisch eine wiederholte Handlung; diese Wiedergabe ist im modernen Deutschen klar und natürlich.
- source_word: εἰς τὴν χρείαν μοι
  choice: für meinen Bedarf
  rationale: Bewahrt den Singular von χρεία und bezeichnet die Unterstützung, die auf Paulus’ konkrete Bedarfslage gerichtet war.
- source_word: ἐπέμψατε
  choice: habt ihr mir … etwas geschickt
  rationale: Das im Griechischen unausgesprochene Objekt wird durch „etwas“ zurückhaltend ergänzt, damit der Satz im Deutschen vollständig und natürlich klingt, ohne die Art der Gabe festzulegen.
