source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: de
  text: Nicht dass ich das aus Mangel sage; denn ich habe gelernt, in jeder Lage zufrieden zu sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mir selbst zu genügen«; das griechische Wort kann Selbstgenügsamkeit bezeichnen, meint hier im Zusammenhang jedoch eher Zufriedenheit in jeder Lage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: aus Mangel
  rationale: Die Wendung bezeichnet ein Reden aufgrund von Entbehrung oder Mangel. »Aus Mangel« ist knapp, natürlich und lässt offen, welcher konkrete Mangel gemeint ist.
- source_word: λέγω
  choice: ich sage
  rationale: Das Präsens wird unmittelbar und idiomatisch wiedergegeben; der Rückbezug auf das zuvor Gesagte wird durch »das« deutlich.
- source_word: ἔμαθον
  choice: ich habe gelernt
  rationale: Das deutsche Perfekt bringt einen abgeschlossenen Lernprozess mit fortdauernder Bedeutung für die Gegenwart natürlich zum Ausdruck.
- source_word: ἐν οἷς εἰμι
  choice: in jeder Lage
  rationale: Die wörtlich relative Formulierung meint idiomatisch die jeweiligen Lebensumstände. »In jeder Lage« ist verständlich und bewahrt die umfassende Aussage.
- source_word: αὐτάρκης
  choice: zufrieden
  rationale: Im Zusammenhang bezeichnet das Adjektiv eine erlernte Genügsamkeit unabhängig von wechselnden Umständen. »Zufrieden« klingt im modernen Deutsch natürlich, ohne autonome Selbstgenügsamkeit zur Hauptaussage zu machen.
theological_decisions:
- issue: Mögliche philosophische Nuance von αὐτάρκης
  choice: Im Haupttext mit »zufrieden« wiedergegeben.
  alternative: »sich selbst genügend« beziehungsweise »selbstgenügsam«
  rationale: Das Wort kann innere Genügsamkeit oder Selbstgenügsamkeit bezeichnen. Im Kontext passt »zufrieden« besser zu Paulus’ erlernter Haltung und vermeidet, uneingeschränkte Unabhängigkeit von Gott oder anderen Menschen einzulesen; die lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Satzstruktur folgt dem griechischen Gedankengang; »in jeder Lage« ist idiomatischer als eine formale Nachbildung des Relativsatzes.
