  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: de
  text: Nicht, dass ich nach der Gabe strebe; vielmehr strebe ich nach der Frucht, die sich auf eurem Konto mehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Frucht, die euch reichlicher gutgeschrieben wird.“'
    reason: Die Verbindung πλεονάζοντα εἰς λόγον ὑμῶν kann entweder mit dem Bild eines wachsenden Kontostands oder stärker als Gutschrift zugunsten der Empfänger ausgedrückt werden.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: strebe ich nach
  rationale: Das Verb bezeichnet ein nachdrückliches Suchen oder Verlangen. Die wiederholte Formulierung wahrt den Kontrast des griechischen Satzes und klingt im Deutschen natürlich.
- source_word: δόμα
  choice: der Gabe
  rationale: δόμα meint hier die von den Philippern gewährte Gabe. „Gabe“ ist direkt und lässt den konkreten Charakter im Kontext erkennen, ohne „selbst“ hinzuzufügen, das im Griechischen nicht ausdrücklich steht.
- source_word: καρπὸν
  choice: der Frucht
  rationale: „Frucht“ bewahrt das Bild für Ertrag oder Ergebnis und lässt es bewusst mit der anschließenden kaufmännischen Kontosprache zusammentreffen.
- source_word: πλεονάζοντα
  choice: die sich … mehrt
  rationale: Das Partizip beschreibt zunehmenden oder überreichen Ertrag. „Sich mehren“ gibt den fortlaufenden Zuwachs idiomatisch wieder.
- source_word: εἰς λόγον ὑμῶν
  choice: auf eurem Konto
  rationale: Im Kontext kaufmännischer Abrechnung bezeichnet λόγος ein Konto beziehungsweise eine Abrechnung. Die Formulierung bewahrt dieses Bild und drückt aus, dass der Ertrag ihnen zugerechnet wird.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Nicht, dass …; vielmehr
  rationale: Die Wendung kennzeichnet eine klarstellende Gegenüberstellung. „Vielmehr“ gibt ἀλλά nach dem verneinten Vordersatz im modernen Deutschen natürlich wieder.
theological_decisions:
- issue: Verhältnis von Fruchtbild und kaufmännischer Bildsprache
  choice: 'Beide Metaphern werden nebeneinandergestellt: „Frucht, die sich auf eurem Konto mehrt“.'
  alternative: Die Aussage vereinheitlichen als „Gewinn, der euch gutgeschrieben wird“.
  rationale: Der griechische Text verbindet καρπός mit Kontosprache. Diese Spannung soll nicht zugunsten einer rein finanziellen oder rein geistlichen Deutung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „strebe ich nach“ spiegelt die rhetorische Struktur; „Gabe“, „Frucht“ und „Konto“ erhalten die konkreten Bilder des Ausgangstextes.
