  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: de
  text: Grüßt jeden Heiligen im Messias Jesus. Die Brüder, die bei mir sind, grüßen euch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier im weiteren Sinn die Glaubensgeschwister bei Paulus bezeichnen, also auch eine gemischte Gruppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Grüßt
  rationale: Der Imperativ bezeichnet im brieflichen Schlussgruß das Ausrichten eines Grußes; „Grüßt“ ist knapp, natürlich und direkt.
- source_word: πάντα ἅγιον
  choice: jeden Heiligen
  rationale: Der Singular mit πᾶς hat distributive Bedeutung. „Jeden Heiligen“ bildet diese Struktur natürlich ab und bezeichnet die einzelnen Angehörigen des geheiligten Gottesvolkes.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός ist hier als Titel zu verstehen. „Messias“ gibt diesen Titel transparent wieder; die Präposition ἐν bleibt mit „im“ erhalten.
- source_word: ἀσπάζονται
  choice: grüßen
  rationale: Im brieflichen Zusammenhang ist „grüßen“ die natürliche deutsche Wiedergabe des medialen Verbs.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Die Brüder, die bei mir sind
  rationale: Die Formulierung bewahrt das grammatisch maskuline ἀδελφοί und gibt σὺν ἐμοί in natürlichem Deutsch als Relativsatz wieder; eine mögliche kontextuelle Einbeziehung von Glaubensschwestern wird in der Fußnote kenntlich gemacht.
theological_decisions: []
