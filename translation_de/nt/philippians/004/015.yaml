id: PHP.4.15
reference: Philippians 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: de
  text: Ihr selbst wisst aber auch, Philipper, dass zu Beginn der Verkündigung des Evangeliums, als ich Mazedonien verließ, keine Gemeinde sich mit mir in der Angelegenheit des Gebens und Empfangens[a] beteiligte außer ihr allein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer Rechnung des Gebens und Empfangens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: Ihr wisst ja auch selbst
  rationale: Gibt das präsentische Wissen, die weiterführende Partikel δέ sowie die additive und emphatische Kraft von καὶ ὑμεῖς in natürlichem Deutsch wieder.
- source_word: Φιλιππήσιοι
  choice: ihr Philipper
  rationale: Die direkte Anrede wird im Deutschen idiomatisch und würdevoll beibehalten.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: Als die Verkündigung des Evangeliums begann
  rationale: Macht verständlich, dass der Anfang der Evangeliumsverkündigung beziehungsweise der damit verbundenen Missionsarbeit gemeint ist, ohne den Bezug enger festzulegen.
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: ich aus Mazedonien aufbrach
  rationale: „Aufbrechen“ bezeichnet den konkreten vergangenen Weggang natürlich und mit angemessenem Register.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: beteiligte sich keine andere Gemeinde
  rationale: κοινωνέω bezeichnet hier eine konkrete Beteiligung beziehungsweise Partnerschaft; „andere“ ist im Deutschen durch die anschließende Ausnahme idiomatisch erforderlich und verändert die Aussage nicht.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: an der Abrechnung über Geben und Empfangen
  rationale: λόγος kann in diesem finanziellen Zusammenhang ein Konto oder eine Abrechnung bezeichnen; die Formulierung erhält zugleich die ungewöhnliche wechselseitige Rede von Geben und Empfangen.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: als ihr allein
  rationale: Bewahrt die nachdrückliche Ausschließlichkeit der griechischen Wendung.
theological_decisions:
- issue: Reichweite von „Anfang des Evangeliums“
  choice: Als die Verkündigung des Evangeliums begann
  alternative: am Anfang des Evangeliums
  rationale: Die Übersetzung deutet εὐαγγέλιον hier als Evangeliumsverkündigung im geschichtlichen Zusammenhang, legt aber weder einen exakten Zeitpunkt noch eine besondere theologische Phase fest.
- issue: Finanzielle Bildsprache von Geben und Empfangen
  choice: Abrechnung über Geben und Empfangen
  alternative: Sache des Gebens und Empfangens
  rationale: Der mögliche buchhalterische Sinn von λόγος wird sichtbar gemacht, ohne die Beteiligung auf ein rein geschäftliches Verhältnis zu reduzieren.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Briefstil. Die direkte Anrede und die emphatische Ausschließlichkeit bleiben erhalten; die wirtschaftliche Metaphorik wird im Haupttext sichtbar gemacht und ihre allgemeinere Deutung in der Fußnote bewahrt.
