revisions:
- from: 'Ihr wisst ja auch selbst, ihr Philipper: Als die Verkündigung des Evangeliums begann und ich aus Mazedonien aufbrach, beteiligte sich keine andere Gemeinde an der Abrechnung über Geben und Empfangen[a] als ihr allein.'
  to: Ihr selbst wisst aber auch, Philipper, dass zu Beginn der Verkündigung des Evangeliums, als ich Mazedonien verließ, keine Gemeinde sich mit mir in der Angelegenheit des Gebens und Empfangens[a] beteiligte außer ihr allein.
  rationale: Die Revision stellt die griechische Satzstruktur und den offenen Charakter von ἐν ἀρχῇ τοῦ εὐαγγελίου genauer dar. Sie ersetzt die missverständliche „Abrechnung“ durch eine idiomatische, semantisch weitere Formulierung und bewahrt den möglichen buchhalterischen Sinn von λόγος in der Fußnote. Die emphatische Anrede, die zeitliche Einordnung, die Beteiligung der Gemeinden und die ausschließliche Stellung der Philipper bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:35:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist weitgehend getroffen: Die Philipper werden emphatisch angesprochen, Paulus'' Weggang aus Mazedonien und die ausschließliche materielle Partnerschaft werden wiedergegeben. „Als die Verkündigung des Evangeliums begann“ macht jedoch aus der präpositionalen Zeitbestimmung ἐν ἀρχῇ τοῦ εὐαγγελίου einen eigenständigen Ereignissatz und legt den Bezug unnötig auf den Beginn der Verkündigung fest. „Abrechnung über“ ist als deutsche Wiedergabe von εἰς λόγον ... zu eng und stilistisch missverständlich; der mögliche Rechnungs-/Kontosinn soll als Alternative in der Anmerkung stehen.'
  naturalness: Die Satzführung des Entwurfs ist verständlich, doch „an der Abrechnung über Geben und Empfangen“ klingt im heutigen Standarddeutsch unidiomatisch. „In der Angelegenheit des Gebens und Empfangens“ ist natürlich, bewahrt die offene Bedeutung und lässt den wirtschaftlich-buchhalterischen Unterton in der Fußnote sichtbar werden.
  terminology: „Philipper“, „Mazedonien“, „Gemeinde“ und „Evangelium“ sind angemessen. Die Ausnahme sollte ohne das ergänzende „andere“ formuliert werden; zwar ist dieses logisch impliziert, aber der griechische Wortlaut sagt schlicht, dass keine Gemeinde außer den Philippern beteiligt war.
  issues:
  - severity: medium
    issue: Die Wiedergabe von ἐν ἀρχῇ τοῦ εὐαγγελίου als „Als die Verkündigung des Evangeliums begann“ ist zu explizit.
    rationale: Die griechische Formulierung ist eine Nominalphrase („am/zu Beginn des Evangeliums“) und lässt den genauen Bezug von εὐαγγέλιον offen. Eine deutsche Zeitbestimmung bewahrt dies besser.
  - severity: medium
    issue: „an der Abrechnung über Geben und Empfangen“ ist zu eng und unidiomatisch.
    rationale: λόγος kann in diesem Kontext einen Rechnungs- oder Kontobegriff tragen, bezeichnet aber nicht notwendig eine konkrete Abrechnung. Der allgemeinere Haupttext mit einer Fußnote zur Rechnungsmetaphorik bildet die Ambiguität besser ab.
  - severity: low
    issue: „keine andere Gemeinde“ fügt „andere“ hinzu.
    rationale: Die Ausnahme εἰ μὴ ὑμεῖς μόνοι macht die Exklusivität bereits deutlich. Die Ergänzung ist nicht erforderlich und kann entfallen.
  revised_text: Ihr selbst wisst aber auch, Philipper, dass zu Beginn der Verkündigung des Evangeliums, als ich Mazedonien verließ, keine Gemeinde sich mit mir in der Angelegenheit des Gebens und Empfangens[a] beteiligte außer ihr allein.
  revised_footnotes:
