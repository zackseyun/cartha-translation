revisions:
- from: 'Doch ich habe alles erhalten[a] und habe mehr als genug. Ich bin bestens versorgt, seit ich von Epaphroditus empfangen habe, was von euch kam: einen wohlriechenden Duft, ein willkommenes Opfer, das Gott gefällt.'
  to: Doch ich habe alles erhalten[a] und habe mehr als genug. Ich bin völlig versorgt, denn ich habe von Epaphroditus empfangen, was von euch kam – ein wohlriechender Duft, ein Opfer, das angenommen wird und Gott gefällt.
  rationale: Die Revision ersetzt die unnötig zeitlich fortdauernde Nuance von „seit“ durch eine kausale Begründung, glättet die deutsche Syntax der Apposition und gibt die beiden griechischen Prädikate δεκτήν und εὐάρεστον τῷ θεῷ getrennt und verständlich wieder. Die Opfermetaphorik, die Reihenfolge der Aussagen und die mögliche geschäftliche Nuance von ἀπέχω bleiben erhalten.
