source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: de
  text: Doch ich habe alles erhalten[a] und habe mehr als genug. Ich bin völlig versorgt, denn ich habe von Epaphroditus empfangen, was von euch kam – ein wohlriechender Duft, ein Opfer, das angenommen wird und Gott gefällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe es vollständig erhalten“; möglicherweise im geschäftlichen Sinn: „Ich bestätige den vollständigen Empfang.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: ich habe … erhalten
  rationale: Im Zusammenhang mit der materiellen Unterstützung bezeichnet das Verb, dass Paulus alles vollständig empfangen hat. Die natürliche Formulierung lässt den möglichen geschäftlichen Beiklang offen; die Fußnote nennt ihn.
- source_word: πάντα
  choice: alles
  rationale: Das umfassende Akkusativobjekt bezieht sich idiomatisch auf die gesamte Gabe der Philipper.
- source_word: περισσεύω
  choice: ich habe mehr als genug
  rationale: Die Wendung gibt den Gedanken des Überflusses in klarem, modernem Deutsch wieder und passt zur anschließenden Aussage völliger Versorgung.
- source_word: πεπλήρωμαι
  choice: ich bin bestens versorgt
  rationale: Das Perfekt beschreibt den gegenwärtigen Zustand, der durch die empfangene Gabe entstanden ist. Im Kontext materieller Unterstützung ist diese Wiedergabe natürlicher als das wörtlichere „ich bin erfüllt“.
- source_word: δεξάμενος
  choice: seit ich … empfangen habe
  rationale: Die zeitlich-erklärende Wiedergabe des Partizips zeigt, wodurch Paulus nun bestens versorgt ist, ohne einen streng punktuellen Zeitablauf zu erzwingen.
- source_word: παρὰ Ἐπαφροδίτου
  choice: von Epaphroditus
  rationale: Epaphroditus wird als unmittelbarer Überbringer beziehungsweise menschlicher Vermittler der Gabe bezeichnet; der folgende Ausdruck nennt die Philipper als deren Ursprung.
- source_word: τὰ παρ’ ὑμῶν
  choice: was von euch kam
  rationale: Die Formulierung ist natürlich und hält fest, dass die Gabe von den Philippern stammte, ohne im Text ausdrücklich „gesandt“ zu ergänzen.
- source_word: ὀσμὴν εὐωδίας
  choice: einen wohlriechenden Duft
  rationale: Die Wendung bewahrt das aus der Opfersprache bekannte Duftbild in verständlichem, würdigem Deutsch.
- source_word: θυσίαν δεκτήν
  choice: ein willkommenes Opfer
  rationale: „Willkommen“ drückt aus, dass das Opfer angenommen und günstig aufgenommen wird, ohne die unmittelbar folgende Aussage „das Gott gefällt“ unnötig zu verdoppeln.
- source_word: εὐάρεστον τῷ θεῷ
  choice: das Gott gefällt
  rationale: Die Relativsatzform ist idiomatisch und gibt Gottes Wohlgefallen klar und unmittelbar wieder.
theological_decisions:
- issue: Opferbild für die materielle Gabe der Philipper
  choice: 'Die dreigliedrige Opfersprache bleibt erhalten: „einen wohlriechenden Duft, ein willkommenes Opfer, das Gott gefällt“.'
  alternative: 'Das Bild zu einer allgemeinen Dankes- oder Annahmeaussage abzuflachen, etwa: „eine Gabe, die Gott gern annimmt“.'
  rationale: Paulus deutet die materielle Unterstützung bewusst mit Sprache aus dem Opferkult als Gottesverehrung. Die Übersetzung bewahrt diese theologische Bildkraft, ohne eine bestimmte Opferlehre hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Sätze bilden die Steigerung von vollständigem Empfang über Überfluss bis zur völligen Versorgung ab. Die kultische Metaphorik bleibt deutlich, klingt aber nicht altertümlich.
