  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: de
  text: Ich habe mich im Herrn sehr gefreut, dass eure Fürsorge für mich nun endlich wieder aufgeblüht ist.[a] Ihr wart zwar auf mich bedacht,[b] hattet aber keine Gelegenheit dazu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass ihr im Blick auf mich wieder aufgeblüht seid“; gemeint ist das erneute sichtbare Aufleben ihrer Fürsorge.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihr habt an mich gedacht“. Das griechische Verb kann bedeuten, an jemanden zu denken, auf ihn bedacht zu sein oder sich um ihn zu kümmern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Ich habe mich gefreut
  rationale: Das griechische Aoristverb bezeichnet Paulus’ konkrete Freude; das deutsche Perfekt ist in modernem Standarddeutsch natürlich und bewahrt die persönliche Reaktion.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die vertraute paulinische Wendung bleibt erhalten und kann sowohl den Bereich als auch den Grund der Freude anklingen lassen.
- source_word: μεγάλως
  choice: sehr
  rationale: „Sehr“ gibt die starke adverbiale Betonung idiomatisch und ohne unnötig gehobenen Klang wieder.
- source_word: ἤδη ποτὲ
  choice: nun endlich wieder
  rationale: Die Wendung weist auf ein erneutes Sichtbarwerden nach längerer Zeit hin. „Endlich“ bezeichnet den zeitlichen Abstand, ohne den Philippern notwendig einen Vorwurf zu machen; „wieder“ verbindet sich mit dem Wiederaufblühen.
- source_word: ἀνεθάλετε
  choice: wieder aufgeblüht ist
  rationale: Die Formulierung bewahrt das lebendige Bild des erneuten Blühens und lässt sich im Deutschen natürlich auf „Fürsorge“ beziehen.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: eure Fürsorge für mich
  rationale: φρονεῖν bezeichnet hier nicht bloß einen Gedanken, sondern eine auf Paulus gerichtete Haltung, die sich im Kontext praktisch äußert.
- source_word: ἐφ’ ᾧ
  choice: zwar
  rationale: In Verbindung mit dem folgenden δέ wird die klarstellende Gegenüberstellung idiomatisch als „zwar … aber“ wiedergegeben.
- source_word: ἐφρονεῖτε
  choice: ihr wart stets auf mich bedacht
  rationale: Die Wiedergabe wahrt den Bezug zum vorherigen φρονεῖν und macht deutlich, dass ihre innere Zuwendung fortbestand. „Stets“ drückt hier den durativen Aspekt aus, ohne eine neue Handlung zu behaupten.
- source_word: ἠκαιρεῖσθε
  choice: hattet aber keine Gelegenheit dazu
  rationale: Das Verb bezeichnet das Fehlen einer passenden Gelegenheit, nicht mangelnden Willen oder mangelnde Fürsorge.
theological_decisions:
- issue: Bezug der Freude „im Herrn“
  choice: im Herrn
  alternative: durch den Herrn / wegen des Herrn
  rationale: Die knappe griechische Wendung lässt Sphäre und Grund offen; die Übersetzung bewahrt diese theologische Mehrdeutigkeit.
- issue: Art der fortbestehenden Haltung der Philipper
  choice: auf mich bedacht
  alternative: um mich besorgt
  rationale: „Bedacht“ wahrt die Bedeutungsbreite von φρονέω zwischen Denken, Gesinnung und tätiger Fürsorge, ohne Sorge im Sinn von Ängstlichkeit einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das botanische Bild von ἀναθάλλω bleibt im Haupttext erhalten; die zweite Satzhälfte vermeidet einen Vorwurf und stellt klar, dass nicht die Zuwendung, sondern die Gelegenheit fehlte.
