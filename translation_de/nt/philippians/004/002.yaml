id: PHP.4.2
reference: Philippians 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: de
  text: Ich ermahne Evodia, und ich ermahne Syntyche, im Herrn eines Sinnes zu sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Herrn gleichgesinnt zu sein“; möglicherweise auch: „sich im Herrn einig zu sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Evodia
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben und nicht nach seiner möglichen Bedeutung übersetzt.
- source_word: παρακαλῶ
  choice: ich ermahne
  rationale: „Ermahnen“ gibt hier den eindringlichen, persönlichen Appell wieder. Die Wiederholung des Verbs wird beibehalten, weil Paulus sich ausdrücklich und in gleicher Weise an jede der beiden Frauen wendet.
- source_word: Συντύχην
  choice: Syntyche
  rationale: Der Personenname wird in der im Deutschen üblichen Transkription wiedergegeben und nicht übersetzt.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: eines Sinnes zu sein
  rationale: Die Wendung bewahrt sowohl den Gedanken der Gemeinsamkeit als auch die auf Haltung und Gesinnung bezogene Bedeutung von φρονέω. Sie ist im Deutschen würdevoll und verständlich, ohne die Aussage auf bloße sachliche Übereinstimmung zu verengen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die knappe Formulierung bleibt erhalten, weil sie die geforderte Einmütigkeit in der Beziehung zum Herrn verankert und ihre genaue Beziehung zur Aufforderung nicht unnötig ausdeutet.
theological_decisions:
- issue: Art und Grundlage der geforderten Einheit
  choice: „im Herrn eines Sinnes zu sein“
  alternative: „sich im Herrn zu einigen“
  rationale: Die gewählte Fassung lässt den umfassenderen Sinn von φρονεῖν als Denken, Haltung oder Gesinnung bestehen. Zugleich bleibt offen, wie genau „im Herrn“ diese Einheit bestimmt; eine bloße Einigung in einer Streitfrage wäre enger als der griechische Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung „ich ermahne“ wird entsprechend dem griechischen Text bewahrt und unterstreicht die gleichmäßige persönliche Zuwendung zu beiden Frauen.
