base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: de
  text: Es grüßen euch alle Heiligen, besonders aber die zum Haushalt des Kaisers gehören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die aus dem Haushalt des Kaisers“. Gemeint sind Personen, die zum kaiserlichen Haushalt gehörten oder mit ihm verbunden waren, nicht notwendigerweise Angehörige der Familie des Kaisers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: grüßen
  rationale: Das Verb bezeichnet hier den üblichen brieflichen Gruß. „Grüßen“ ist im Deutschen natürlich und bewahrt den direkten zwischenmenschlichen Sinn.
- source_word: πάντες οἱ ἅγιοι
  choice: alle Heiligen
  rationale: ἅγιοι ist eine geläufige paulinische Bezeichnung für die Glaubenden. „Heilige“ wahrt den Schlüsselbegriff, ohne ihn durch eine erklärende Umschreibung aufzulösen.
- source_word: μάλιστα δὲ
  choice: besonders aber
  rationale: Die Wendung hebt innerhalb der größeren Gruppe einen Teil besonders hervor; „besonders aber“ gibt sowohl die Hervorhebung als auch den Anschluss durch δέ wieder.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: die aus dem Haus des Kaisers
  rationale: Die Formulierung bildet die Zugehörigkeit beziehungsweise Verbindung zum kaiserlichen Haushalt ab, ohne festzulegen, ob Familienangehörige, Bedienstete, Freigelassene oder Amtsträger gemeint sind.
- source_word: Καίσαρος
  choice: des Kaisers
  rationale: Καῖσαρ fungiert hier als Herrschertitel. „Kaiser“ ist die natürliche deutsche Wiedergabe und bewahrt den historischen Bezug.
theological_decisions:
- issue: Bedeutung von „Heilige“ im paulinischen Sprachgebrauch
  choice: Als Bezeichnung für die Glaubenden beziehungsweise die geheiligte christliche Gemeinschaft, lexikalisch mit „Heilige“ wiedergegeben.
  alternative: „Gottes Volk“ oder „die Glaubenden“
  rationale: Der Ausdruck bezeichnet hier nicht nur eine besonders fromme Elite. Die Beibehaltung von „Heilige“ wahrt jedoch Paulus’ theologischen Schlüsselbegriff, ohne seine Bedeutung im Haupttext paraphrasierend festzulegen.
- issue: Umfang des „Hauses des Kaisers“
  choice: Personen, die mit dem kaiserlichen Haushalt verbunden sind, ohne nähere Festlegung ihrer Stellung.
  alternative: Ausschließlich leibliche Angehörige der kaiserlichen Familie
  rationale: Die griechische Wendung οἱ ἐκ τῆς Καίσαρος οἰκίας kann einen weiteren Kreis des kaiserlichen Haushalts bezeichnen. Der Text erlaubt keine Beschränkung auf Verwandte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper brieflicher Satzführung. Der etablierte paulinische Schlüsselbegriff „Heilige“ bleibt erhalten; die mögliche Mehrdeutigkeit von „Haus des Kaisers“ wird in der Fußnote erläutert.
