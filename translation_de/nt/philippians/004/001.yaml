id: PHP.4.1
reference: Philippians 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: de
  text: 'Darum, meine geliebten und ersehnten Brüder[a], meine Freude und mein Kranz[b]: Steht auf diese Weise fest im Herrn, ihr Geliebten!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ gibt die maskuline griechische Anrede wieder; im Zusammenhang spricht Paulus die Glaubenden der ganzen Gemeinde an, nicht nur Männer.
    reason: cultural_note
  - marker: b
    text: Gemeint ist der Siegerkranz, der einem Gewinner als Auszeichnung verliehen wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Kennzeichnet natürlich und klar die folgernde Verbindung zum vorausgehenden Gedankengang.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Gibt die grammatisch maskuline Anrede genau wieder; dass die ganze Gemeinde angesprochen ist, wird in einer Fußnote erläutert.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Bewahrt den starken Zuneigungsausdruck und seine bewusste Wiederholung am Anfang und Ende des Verses.
- source_word: ἐπιπόθητοι
  choice: ersehnt
  rationale: Gibt die tiefe Sehnsucht des Ausdrucks knapp wieder und lässt sich mit „geliebt“ koordinieren.
- source_word: χαρά
  choice: Freude
  rationale: Die übliche und unmittelbare Wiedergabe; die Gemeindeglieder selbst werden als Freude des Paulus bezeichnet.
- source_word: στέφανος
  choice: Kranz
  rationale: Gibt das Bild des als Auszeichnung verliehenen Siegerkranzes genauer wieder als das im Deutschen meist königlich verstandene Wort „Krone“.
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Bewahrt den ausdrücklichen Hinweis auf die zuvor beschriebene Weise, im Herrn standzuhalten, ohne ihn in der Aufforderung aufgehen zu lassen.
- source_word: στήκετε
  choice: steht fest
  rationale: Eine klare, gegenwärtige Wiedergabe der Aufforderung zu standhafter Beharrlichkeit.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Bewahrt die für Paulus charakteristische räumlich-relationale Formulierung, ohne sie deutend auszuweiten.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: Im Haupttext steht die grammatisch genaue Form „Brüder“; eine Fußnote erklärt, dass im Zusammenhang die Glaubenden der gesamten Gemeinde gemeint sind.
  alternative: „Brüder und Schwestern“ oder „Geschwister“
  rationale: So bleibt die maskuline Form der griechischen Anrede sichtbar, während ihr im Kontext umfassender gemeindlicher Bezug nicht verschwiegen wird.
- issue: Bezug von οὕτως
  choice: „auf diese Weise“ bleibt ausdrücklich stehen und wird am natürlichsten auf die vorausgehenden Mahnungen und das dort beschriebene Verhalten bezogen.
  alternative: Das Wort nur als allgemeine Verstärkung („so“) zu verstehen oder auf das Folgende zu beziehen.
  rationale: Die Stellung am Abschluss des vorausgehenden Abschnitts legt den rückwärtsweisenden Bezug nahe; die Übersetzung lässt dennoch offen, welche Einzelheiten des vorherigen Gedankengangs Paulus besonders meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Anrede und die Wiederholung von „geliebt“ bleiben erhalten. Der Doppelpunkt gliedert die lange Anrede von der eigentlichen Aufforderung, ohne den Sinn zu verändern.
