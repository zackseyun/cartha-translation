  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: de
  text: Alles vermag ich durch den, der mich stärkt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Allen Lebenslagen bin ich gewachsen“; im Zusammenhang geht es um die Fähigkeit, in jeder Lage zurechtzukommen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht nur „der mich stärkt“; Christus wird in diesem Vers nicht ausdrücklich genannt, doch der Zusammenhang legt diesen Bezug nahe.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend „alles“. Der Zusammenhang bezieht dies auf die unterschiedlichen Lebenslagen, die Paulus zuvor nennt; die Übersetzung bewahrt dennoch die weitere Formulierung des Griechischen.
- source_word: ἰσχύω
  choice: vermag ich
  rationale: Das Verb bezeichnet Kraft oder Fähigkeit. „Vermag ich“ gibt die befähigte Handlungsfähigkeit knapp und würdig wieder, ohne eine vom Zusammenhang losgelöste Erfolgsgarantie auszudrücken.
- source_word: ἐν
  choice: durch
  rationale: Obwohl ἐν wörtlich oft „in“ bedeutet, bezeichnet es hier in Verbindung mit einer Person am natürlichsten die vermittelnde Kraft oder Befähigung. Im Deutschen gibt „durch“ diesen Sinn klar wieder.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: den, der mich stärkt
  rationale: Das substantivierte Partizip wird als „der, der …“ wiedergegeben. „Stärkt“ bewahrt den verbalen und fortdauernden Sinn und fügt keinen im Vers selbst ungenannten Namen ein.
theological_decisions:
- issue: Unausgesprochener Bezug von „der mich stärkt“
  choice: Im Haupttext bleibt die Person unbenannt.
  alternative: „durch Christus, der mich stärkt“
  rationale: Der nähere und weitere Zusammenhang weist auf Christus hin, doch der griechische Wortlaut dieses Verses nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese sprachliche Gegebenheit und erläutert den wahrscheinlichen Bezug in einer Fußnote.
- issue: Reichweite von „alles“
  choice: Die umfassende Formulierung wird beibehalten und durch den Kontext erläutert.
  alternative: „Allen Lebenslagen bin ich gewachsen“
  rationale: Der Zusammenhang spricht vom Zurechtkommen mit Mangel und Überfluss, während πάντα für sich weiter formuliert ist. Die Hauptübersetzung erhält diese Spannung, ohne den Satz als uneingeschränkte Zusage beliebiger Leistungen auszulegen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. „Vermag“ ist leicht gehoben, aber allgemein verständlich und bewahrt die prägnante Form des griechischen Satzes. Die Fußnoten verhindern sowohl eine Verengung des Wortlauts als auch eine kontextlose Überdehnung.
