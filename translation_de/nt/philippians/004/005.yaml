  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: de
  text: Eure Güte soll allen Menschen bekannt werden.[a] Der Herr ist nahe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Milde“, „Nachsicht“ oder „Entgegenkommen“.
    reason: lexical_alternative
  - marker: b
    text: „Der Herr ist nahe“ kann bedeuten, dass der Herr gegenwärtig und ganz in der Nähe ist, dass sein Kommen bevorsteht oder beides.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: Güte
  rationale: Das substantivierte Adjektiv bezeichnet ein rücksichtsvolles, mildes und zum Entgegenkommen bereites Verhalten, nicht nur ein sanftes Temperament. „Güte“ gibt diese umfassende ethische Haltung in natürlichem, würdigem Deutsch wieder; die genaueren Bedeutungsnuancen werden in der Fußnote offengehalten.
- source_word: γνωσθήτω
  choice: soll bekannt werden
  rationale: Der passive Aoristimperativ fordert dazu auf, dass diese Haltung für andere erkennbar wird. Die deutsche Konstruktion mit „soll“ gibt den Aufforderungscharakter idiomatisch wieder, ohne das Passiv aufzulösen.
- source_word: πᾶσιν ἀνθρώποις
  choice: allen Menschen
  rationale: Die Wendung ist umfassend und wird im modernen Deutschen natürlich und ohne unnötige geschlechtliche Einschränkung wiedergegeben.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die übliche und theologisch gewichtige Wiedergabe des Titels κύριος.
- source_word: ἐγγύς
  choice: nahe
  rationale: „Nahe“ bewahrt die im Griechischen mögliche räumliche beziehungsweise gegenwärtige und zeitliche beziehungsweise eschatologische Bedeutung, ohne sich auf eine davon festzulegen.
theological_decisions:
- issue: Bedeutung von ὁ κύριος ἐγγύς
  choice: Der Herr ist nahe.
  alternative: Der Herr ist ganz in der Nähe; Der Herr kommt bald.
  rationale: Die griechische Aussage kann sowohl die gegenwärtige Nähe des Herrn als auch die zeitliche Nähe seines Kommens bezeichnen oder beides zugleich anklingen lassen. Die Hauptübersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Satzstruktur des griechischen Textes bleibt erhalten; echte lexikalische und theologische Mehrdeutigkeit wird durch die Hauptübersetzung und die Fußnoten bewahrt.
