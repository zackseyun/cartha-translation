id: PHP.1.29
reference: Philippians 1:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: de
  text: Denn euch ist es um des Messias willen[a] geschenkt worden, nicht nur an ihn zu glauben[b], sondern auch für ihn zu leiden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um Christi willen“. Das griechische Χριστός bedeutet „Messias“ beziehungsweise „Christus“.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Oder: „ihm zu vertrauen“.'
    reason: lexikalische Alternative
  - marker: c
    text: 'Oder: „um seinetwillen zu leiden“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die Aussage des vorhergehenden Verses; „Denn“ stellt diesen Zusammenhang im Deutschen natürlich her.
- source_word: ἐχαρίσθη
  choice: ist … geschenkt worden
  rationale: Das Verb bezeichnet ein freies, gnädiges Gewähren. „Geschenkt worden“ bewahrt den Gabecharakter und lässt die im Griechischen unausgesprochene göttliche Urheberschaft bestehen.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: um des Messias willen
  rationale: ὑπέρ bezeichnet hier den Messias als Grund und Bezugspunkt der gewährten Gabe. „Messias“ gibt Χριστός als Titel wieder; die geläufige Form „Christus“ wird in der Fußnote genannt.
- source_word: πιστεύειν εἰς αὐτόν
  choice: an ihn zu glauben
  rationale: Dies ist die geläufige deutsche Wiedergabe für den auf eine Person gerichteten Glauben; die Vertrauensdimension bleibt als lexikalische Alternative in der Fußnote sichtbar.
- source_word: πάσχειν
  choice: zu leiden
  rationale: Die direkte Wiedergabe entspricht dem schlichten Infinitiv und schwächt die Aussage nicht ab.
- source_word: ὑπὲρ αὐτοῦ
  choice: für ihn
  rationale: Die knappe Form bezeichnet Leiden seinetwegen beziehungsweise um seinetwillen, ohne die Beziehung unnötig festzulegen.
theological_decisions:
- issue: Ob sowohl der Glaube als auch das Leiden als gewährte Gabe dargestellt werden
  choice: Die Gabeformulierung umfasst ausdrücklich sowohl das Glauben als auch das Leiden.
  alternative: ἐχαρίσθη schwächer als bloße Erlaubnis wiedergeben oder den Bezug der Gabe auf das Leiden verdecken.
  rationale: Die beiden substantivierten Infinitive stehen parallel unter ἐχαρίσθη. Die theologische Spannung, dass auch das Leiden als geschenkt gilt, wird deshalb nicht abgeschwächt.
- issue: Funktion von Χριστός
  choice: „Messias“ als Titel im Haupttext
  alternative: „Christus“ als traditionell eingebürgerte Wiedergabe
  rationale: Χριστός ist hier als Titel zu verstehen. „Messias“ macht diesen Titelcharakter im modernen Deutschen deutlicher; „Christus“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „ist … geschenkt worden“ ist bewusst stärker als „wurde erlaubt“ und hält zugleich die göttliche Urheberschaft implizit, wie es der griechische Passivsatz tut. Die parallele Struktur „nicht nur …, sondern auch …“ bildet die beiden Infinitive klar ab.
