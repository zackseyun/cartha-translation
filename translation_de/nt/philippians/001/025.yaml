  naturalness: „Und in dieser Überzeugung weiß ich“ und „bleiben und weiterhin bei euch allen sein“ sind modernes, würdiges Standarddeutsch. „Zu eurem Fortschritt und zu eurer Freude im Glauben“ ist idiomatisch und näher an der Struktur des griechischen Satzes.
