source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: de
  text: Und in dieser Überzeugung weiß ich, dass ich bleiben und weiterhin bei euch allen sein werde – zu eurem Fortschritt und zu eurer Freude im Glauben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Freude des Glaubens“ oder „Freude, die aus dem Glauben kommt“.'
    reason: Der Genitiv τῆς πίστεως bei χαρά kann unterschiedlich verstanden werden. Die Hauptfassung wahrt eine natürliche, nicht festlegende Wiedergabe; die Alternativen machen die genitivische Mehrdeutigkeit sichtbar.
lexical_decisions:
- source_word: πεποιθὼς
  choice: überzeugt
  rationale: Das Perfektpartizip bezeichnet einen gefestigten Zustand der Überzeugung; „überzeugt“ ist im modernen Deutsch natürlich und präzise.
- source_word: μενῶ
  choice: ich werde bleiben
  rationale: Die Wiedergabe bewahrt die Futurform und die Grundbedeutung von μένω.
- source_word: παραμενῶ
  choice: bei euch allen bleiben
  rationale: Das Kompositum bezeichnet hier ein fortgesetztes Verbleiben bei den Adressaten. Die Wiederholung von „bleiben“ gibt die enge Wortverwandtschaft der beiden griechischen Verben wieder, während „bei euch“ den relationalen Zusatz ausdrückt.
- source_word: πᾶσιν ὑμῖν
  choice: bei euch allen
  rationale: „Euch allen“ gibt πᾶσιν ausdrücklich wieder; „bei“ drückt die mit παραμενῶ bezeichnete fortdauernde Anwesenheit aus.
- source_word: προκοπὴν
  choice: Fortschritte macht
  rationale: προκοπή bezeichnet Vorankommen. Die verbale deutsche Formulierung ist natürlich und macht deutlich, dass es um den Fortschritt der Philipper geht.
- source_word: χαρὰν τῆς πίστεως
  choice: im Glauben … Freude habt
  rationale: Diese idiomatische Formulierung verbindet sowohl Fortschritt als auch Freude mit dem Glauben, ohne das Genitivverhältnis unnötig eng kausal festzulegen.
- source_word: πίστεως
  choice: Glauben
  rationale: Im Kontext bezeichnet πίστις am ehesten den Glauben beziehungsweise das gläubige Leben der Gemeinde.
theological_decisions:
- issue: Bedeutung des Genitivs in χαρὰν τῆς πίστεως
  choice: Freude im Glauben
  alternative: Freude des Glaubens; Freude, die aus dem Glauben kommt
  rationale: Der griechische Genitiv ist mehrdeutig. Der Haupttext bietet eine natürliche deutsche Fassung, während die Fußnote die attributive beziehungsweise kausale Deutung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für natürliche Verständlichkeit leicht verbalisiert. Die Wiederholung „bleiben … bleiben“ ist bewusst beibehalten, um μένω und παραμένω erkennbar aufeinander zu beziehen.
