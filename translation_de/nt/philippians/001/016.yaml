id: PHP.1.16
reference: Philippians 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: de
  text: Die einen verkünden Christus aus Liebe[a], weil sie wissen, dass ich dazu bestimmt bin, die gute Nachricht zu verteidigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die einen aus Liebe“; „verkünden Christus“ ist aus dem Zusammenhang ergänzt.'
    reason: Im griechischen Satz ist die Handlung elliptisch ausgelassen und aus Vers 15 zu erschließen.
  - marker: b
    text: 'Oder: „dass ich zur Verteidigung der guten Nachricht eingesetzt bin“.'
    reason: Die alternative Formulierung bildet die Nominalkonstruktion εἰς ἀπολογίαν τοῦ εὐαγγελίου und den idiomatischen Sinn von κεῖμαι formaler ab.
lexical_decisions:
- source_word: οἱ μὲν
  choice: Die einen verkünden Christus
  rationale: Die griechische Wendung eröffnet den Gegensatz zu οἱ δέ im folgenden Vers. Das im Griechischen ausgelassene Prädikat wird aus Philipper 1,15 ergänzt, damit der Satz im Deutschen vollständig und verständlich ist.
- source_word: ἐξ ἀγάπης
  choice: aus Liebe
  rationale: Die Präposition ἐξ bezeichnet hier den Beweggrund; „aus Liebe“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: εἰδότες
  choice: weil sie wissen
  rationale: Das Partizip nennt den Grund beziehungsweise die Grundlage ihres Handelns. Ein Nebensatz gibt diesen Zusammenhang im modernen Deutsch klar wieder.
- source_word: εἰς ἀπολογίαν
  choice: zu verteidigen
  rationale: ἀπολογία bezeichnet eine begründete, gegebenenfalls auch rechtliche Verteidigung. Die verbale Formulierung ist im Deutschen natürlich und bewahrt den Zweckgedanken von εἰς.
- source_word: τοῦ εὐαγγελίου
  choice: die gute Nachricht
  rationale: εὐαγγέλιον bezeichnet die christliche Heilsbotschaft. „Gute Nachricht“ gibt die Wortbedeutung transparent und allgemein verständlich wieder.
- source_word: κεῖμαι
  choice: dazu bestimmt bin
  rationale: κεῖμαι bedeutet hier idiomatisch, dass Paulus für diese Aufgabe eingesetzt beziehungsweise dazu bestimmt ist; die Wiedergabe vermeidet das im Deutschen irreführende wörtliche „liege“.
theological_decisions:
- issue: Handelnde Instanz bei κεῖμαι
  choice: dazu bestimmt bin
  alternative: dazu eingesetzt bin / hierfür hier bin
  rationale: Die Formulierung lässt erkennen, dass Paulus diese Aufgabe zugewiesen ist, nennt aber keine handelnde Instanz, da sie im griechischen Satz nicht ausdrücklich genannt wird.
- issue: Gegenüberstellung durch οἱ μὲν
  choice: Die einen
  alternative: Jene / die Ersteren
  rationale: „Die einen“ bewahrt die korrelative Gegenüberstellung mit „die anderen“, ohne eine möglicherweise irreführende Rückverweisung auf eine feste Reihenfolge der zuvor genannten Gruppen zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ergänzung „verkünden Christus“ macht die griechische Ellipse transparent; die Fußnote dokumentiert sie. „Gute Nachricht“ ist verständlich und quellennah, während „verteidigen“ den sachlich-rechtfertigenden Sinn von ἀπολογία wahrt.
