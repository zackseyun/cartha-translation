revisions:
- from: Wenn aber das Weiterleben im Fleisch für mich Frucht der Arbeit bedeutet[a], dann weiß ich nicht, was ich wählen soll.
  to: Wenn aber das Leben im Fleisch für mich Frucht der Arbeit ist, weiß ich nicht, was ich wählen werde.
  rationale: Die Revision entfernt die nicht ausdrücklich im Griechischen markierte Folgerung „dann“ und gibt das Futur αἱρήσομαι mit „wählen werde“ wieder. „Das Leben“ ist näher an τὸ ζῆν als das kontextuell mögliche, aber leicht verstärkende „Weiterleben“. Die Wiedergabe bleibt dabei natürliches modernes Deutsch und wahrt die Unentschiedenheit des Paulus.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:34:28Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt τὸ ζῆν, ἐν σαρκί und καρπὸς ἔργου im Wesentlichen treffend wieder. Der Anschluss mit „dann“ interpretiert jedoch das griechische καί als ausdrückliche Folgerung, und „was ich wählen soll“ schwächt bzw. verändert das futurische αἱρήσομαι („was ich wählen werde“).
  naturalness: „Wenn aber das Leben im Fleisch für mich Frucht der Arbeit ist, weiß ich nicht, was ich wählen werde“ ist modernes, verständliches Standarddeutsch. Es glättet die im Griechischen verdichtete bzw. anacoluthische Syntax behutsam, ohne eine Entscheidung des Paulus vorwegzunehmen.
  terminology: „Im Fleisch“ ist hier als paulinische Bezeichnung des leiblich-irdischen Lebens angemessen; die Fußnote zu „fruchtbare Arbeit“ ist als lexikalische Alternative passend. „Frucht der Arbeit“ bewahrt die knappe Genitivverbindung des Ausgangstextes.
  issues:
  - severity: medium
    issue: „dann“ als Folgerungsmarker
    rationale: Das griechische καί bedeutet hier primär „und“; ein ausdrückliches „dann“ macht aus der verdichteten Verbindung eine stärker logische Folgerung, die der Text nicht ausdrücklich formuliert.
  - severity: medium
    issue: „was ich wählen soll“ für τί αἱρήσομαι
    rationale: 'αἱρήσομαι ist Futur: Paulus sagt, dass er nicht weiß, was er wählen wird. „Soll“ kann im Deutschen eine Verpflichtung oder Angemessenheit nahelegen und gibt den Tempuswert nicht präzise wieder.'
  revised_text: Wenn aber das Leben im Fleisch für mich Frucht der Arbeit ist, weiß ich nicht, was ich wählen werde.
  revised_footnotes:
  - marker: a
    text: 'Oder: „fruchtbare Arbeit“.'
    reason: lexical_alternative
  revision_rationale: Die Revision entfernt die nicht ausdrücklich im Griechischen markierte Folgerung „dann“ und gibt das Futur αἱρήσομαι mit „wählen werde“ wieder. „Das Leben“ ist näher an τὸ ζῆν als das kontextuell mögliche, aber leicht verstärkende „Weiterleben“. Die Wiedergabe bleibt dabei natürliches modernes Deutsch und wahrt die Unentschiedenheit des Paulus.
