  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: de
  text: Wenn aber das Leben im Fleisch für mich Frucht der Arbeit ist, weiß ich nicht, was ich wählen werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ζῆν
  choice: das Weiterleben
  rationale: Der substantivierte Infinitiv bezeichnet hier im Zusammenhang das Fortdauern des gegenwärtigen Lebens; „Weiterleben“ gibt dies natürlich und knapp wieder.
- source_word: ἐν σαρκί
  choice: im Fleisch
  rationale: Die wörtliche paulinische Ausdrucksweise bleibt erhalten. Im Kontext bezeichnet sie das leibliche, irdische Leben und nicht eine sündige Natur.
- source_word: καρπὸς ἔργου
  choice: Frucht der Arbeit
  rationale: Die komprimierte Genitivverbindung wird bewusst formal wiedergegeben und bewahrt die mögliche Bedeutungsnuance zwischen dem Ergebnis der Arbeit und fruchtbarer Arbeit.
- source_word: αἱρήσομαι
  choice: ich wählen soll
  rationale: Das futurische Medium bezeichnet die Wahl zwischen den im Kontext genannten Möglichkeiten; im Deutschen gibt die idiomatische Wendung mit „soll“ die gegenwärtige Ungewissheit über diese Wahl wieder.
- source_word: οὐ γνωρίζω
  choice: ich weiß nicht
  rationale: Obwohl γνωρίζω häufig „bekannt machen“ bedeutet, drückt es hier im Zusammenhang Ungewissheit aus.
theological_decisions:
- issue: Bedeutung von σάρξ in diesem Vers
  choice: leibliches irdisches Dasein („im Fleisch“)
  alternative: sündige Natur
  rationale: Der Zusammenhang stellt das fortgesetzte irdische Leben dem Aufbrechen und Bei Christus Sein gegenüber; daher bezeichnet σάρξ hier die leibliche Existenz, nicht moralische Verdorbenheit.
- issue: Syntaktische Spannung von εἰ δὲ … καὶ τί
  choice: Bedingungssatz mit sinngemäß ergänztem Folgesatz („dann“)
  alternative: Die griechische Anakoluth-Struktur ohne ausdrückliche Ergänzung formal nachbilden
  rationale: Der griechische Satz ist abgebrochen beziehungsweise stark verdichtet. „Dann“ macht die logische Beziehung im natürlichen Deutschen verständlich, ohne festzulegen, ob Paulus leben oder sterben wählen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Im Fleisch“ bewahrt die paulinische Ausdrucksweise; die Fußnote erschließt die verdichtete Wendung „Frucht der Arbeit“. Die syntaktische Unebenheit des Griechischen wird zugunsten eines verständlichen deutschen Satzes behutsam geglättet.
