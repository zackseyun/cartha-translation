    issue: „noch immer“ ergänzt eine nicht ausdrücklich im griechischen Text stehende Fortdauer.
    rationale: νῦν markiert das gegenwärtige Hören im Kontrast zum früheren Sehen. Der Kontext kann Kontinuität implizieren, aber die Übersetzung sollte diese nicht als eigene explizite Aussage hinzufügen.
  - severity: low
    issue: „bei mir gesehen“ ist weniger idiomatisch und weniger präzise als „an mir gesehen“.
    rationale: Für etwas, das die Adressaten am Beispiel bzw. Schicksal einer Person wahrgenommen haben, ist „an mir gesehen“ im Deutschen die natürliche Formulierung.
  revised_text: Dabei führt ihr denselben Kampf, den ihr an mir gesehen habt und von dem ihr jetzt hört, dass ich ihn führe.
