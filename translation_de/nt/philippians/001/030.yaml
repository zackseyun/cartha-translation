translation:
  language: de
  text: Dabei führt ihr denselben Kampf, den ihr an mir gesehen habt und von dem ihr jetzt hört, dass ich ihn führe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: Kampf
  rationale: Bezeichnet hier das konfliktreiche Ringen und Leiden für den Glauben; „Kampf“ gibt das Bild klar und würdig wieder.
- source_word: ἔχοντες
  choice: führt ihr
  rationale: Das wörtliche „habend“ wird idiomatisch als „einen Kampf führen“ wiedergegeben. Das einleitende „Dabei“ wahrt den partizipialen Anschluss an den vorhergehenden Satz.
- source_word: ἐν ἐμοί
  choice: bei mir / dass ich ihn … führe
  rationale: Die erste Wendung bezeichnet das an Paulus beobachtete Geschehen. Bei der zweiten macht die natürliche deutsche Formulierung deutlich, dass die Gemeinde nun davon hört, ohne den sachlichen Bezug zu Paulus zu verändern.
- source_word: νῦν
  choice: jetzt
  rationale: Gibt den zeitlichen Gegensatz zum früher Gesehenen unmittelbar wieder.
theological_decisions:
- issue: Fortdauer von Paulus’ Kampf
  choice: noch immer führe
  alternative: jetzt führe
  rationale: Im Zusammenhang mit dem früher Gesehenen und dem gegenwärtig Gehörten bringt „noch immer“ die erkennbare Fortdauer natürlich zum Ausdruck, ohne die Art des Kampfes näher festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Dabei“ bindet den Vers als Fortsetzung an Philipper 1,27–29 an; die Art des Kampfes bleibt entsprechend dem griechischen Text offen.
