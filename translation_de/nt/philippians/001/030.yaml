  source_fidelity: 'Der Grundsinn ist zutreffend: Die Philipper stehen in demselben Kampf wie Paulus, den sie früher an ihm wahrgenommen haben und von dem sie gegenwärtig hören. „Noch immer“ ist jedoch keine ausdrückliche Entsprechung von νῦν („jetzt/nun“); eine Fortdauer kann der Kontext nahelegen, wird im griechischen Wortlaut aber nicht eigens behauptet. Die zweite Wendung ἐν ἐμοί wird besser nicht durch eine zusätzliche Fortdauer-Aussage ausgelegt.'
  naturalness: „Einen Kampf führen“ ist idiomatisches modernes Standarddeutsch. „An mir gesehen“ ist für das beobachtete Leiden bzw. Ringen des Paulus natürlicher und genauer als „bei mir gesehen“.
  terminology: „Kampf“ gibt ἀγών angemessen wieder und bewahrt die offene Bedeutung eines konflikthaften Ringens. Es sind keine terminologischen oder theologischen Änderungen erforderlich.
  issues:
