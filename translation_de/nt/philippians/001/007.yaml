id: PHP.1.7
reference: Philippians 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: de
  text: Denn es ist nur recht, dass ich so von euch allen denke, weil ich euch im Herzen trage[a]. Sowohl in meiner Gefangenschaft als auch bei der Verteidigung und Bekräftigung des Evangeliums habt ihr alle gemeinsam mit mir Anteil an der Gnade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil ihr mich im Herzen tragt“. Der griechische Satz lässt beide Zuordnungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: es ist nur recht
  rationale: Die Wendung bezeichnet hier, was angemessen und berechtigt ist. „Es ist nur recht“ klingt im heutigen Deutsch natürlich und bewahrt den ethischen Unterton.
- source_word: φρονεῖν ὑπὲρ πάντων ὑμῶν
  choice: so von euch allen denke
  rationale: φρονέω umfasst Denken, Gesinnung und innere Haltung. Die idiomatische deutsche Wendung lässt diese Bedeutungsbreite offen und bezieht ὑπέρ klar auf Paulus’ Haltung gegenüber allen Adressaten.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: weil ich euch im Herzen trage
  rationale: Wegen der beiden Akkusative bei ἔχειν ist grammatisch auch die umgekehrte Zuordnung möglich. Die Hauptfassung entspricht dem unmittelbaren Zusammenhang von Paulus’ Zuneigung; die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: δεσμοῖς
  choice: Gefangenschaft
  rationale: δεσμοί bezeichnet wörtlich Fesseln, im Kontext aber Paulus’ Haft. „Gefangenschaft“ vermittelt die konkrete Situation im modernen Deutsch klarer als die potenziell missverständliche Wendung „in meinen Fesseln“.
- source_word: ἀπολογίᾳ
  choice: Verteidigung
  rationale: Das Wort bezeichnet eine begründete Verteidigung, möglicherweise auch in einem formellen oder gerichtlichen Zusammenhang. Die Übersetzung lässt den genauen Rahmen offen.
- source_word: βεβαιώσει
  choice: Bekräftigung
  rationale: βεβαίωσις bezeichnet das Festmachen, Bestätigen oder Erweisen der Geltung des Evangeliums. „Bekräftigung“ passt natürlich zur gekoppelten „Verteidigung“, ohne einen ausschließlich juristischen Sinn festzulegen.
- source_word: συγκοινωνούς μου τῆς χάριτος
  choice: gemeinsam mit mir Anteil an der Gnade
  rationale: συγκοινωνός bezeichnet gemeinsame Teilhabe. Die Formulierung gibt sowohl das gemeinschaftliche Element als auch den Genitiv τῆς χάριτος idiomatisch wieder, ohne die Art dieser Gnade unnötig einzuengen.
- source_word: χάριτος
  choice: Gnade
  rationale: „Gnade“ bewahrt den zentralen theologischen Begriff χάρις. Der Kontext verbindet diese Gnade mit Paulus’ Haft und seinem Dienst für das Evangelium, bestimmt ihren Umfang jedoch nicht abschließend.
theological_decisions:
- issue: Mehrdeutigkeit der Herz-Klausel
  choice: weil ich euch im Herzen trage
  alternative: weil ihr mich im Herzen tragt
  rationale: Im griechischen Infinitivsatz können με und ὑμᾶς formal unterschiedlich als Subjekt und Objekt zugeordnet werden. Paulus’ zuvor ausgedrückte Zuneigung stützt die Hauptfassung; die gegenseitige Verbundenheit im folgenden Satzteil macht die Alternative jedoch sinnvoll, weshalb sie ausdrücklich vermerkt wird.
- issue: Bedeutungsumfang der gemeinsam empfangenen Gnade
  choice: Anteil an der Gnade
  alternative: Teilhabe an der Gnade meines Dienstes beziehungsweise meines Leidens
  rationale: Der Genitiv nennt die Gnade als Gegenstand gemeinsamer Teilhabe, während der Kontext Haft sowie Verteidigung und Bekräftigung des Evangeliums einschließt. Die Übersetzung konkretisiert die Gnade nicht stärker als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und idiomatisch, hält aber die Schlüsselbegriffe „Evangelium“ und „Gnade“ fest. Der lange griechische Satz wurde zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert; der logische Zusammenhang bleibt erhalten.
