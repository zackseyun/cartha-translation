  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: de
  text: 'Doch ich bin von beiden Seiten bedrängt: Ich habe das Verlangen, aufzubrechen[a] und beim Messias[b] zu sein, denn das ist bei Weitem besser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist: zu sterben. Wörtlich: aufzubrechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Christus. Griechisch: der Gesalbte.'
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέχομαι
  choice: ich werde bedrängt
  rationale: Die passive Form bezeichnet, dass Paulus von zwei Seiten unter Druck steht. „Ich werde bedrängt“ bewahrt dieses Bild und klingt im Deutschen würdig und verständlich.
- source_word: ἐκ τῶν δύο
  choice: von beidem
  rationale: Gemeint sind die beiden zuvor genannten Möglichkeiten. „Von beidem“ gibt die griechische Konstruktion knapp wieder, ohne den inneren Konflikt stärker auszudeuten als der Ausgangstext.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: ich habe das Verlangen
  rationale: Die Wiedergabe erhält das ausdrückliche Substantiv ἐπιθυμία und überführt die Partizipialkonstruktion in einen natürlichen deutschen Hauptsatz.
- source_word: ἀναλῦσαι
  choice: aufzubrechen
  rationale: Das Verb kann das Aufbrechen beziehungsweise Fortgehen bezeichnen und dient hier als verhüllender Ausdruck für den Tod. „Aufzubrechen“ bewahrt das Bild; die Bedeutung wird in der Fußnote erläutert.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός ist hier als Titel zu verstehen. „Messias“ macht die Bedeutung „der Gesalbte“ transparent und vermeidet, den Titel ungekennzeichnet wie einen Eigennamen zu behandeln.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: denn das wäre bei Weitem besser
  rationale: „Bei Weitem besser“ gibt die starke Steigerung des griechischen Vergleichs natürlich wieder. Der Konjunktiv „wäre“ passt im Deutschen zur erwogenen Möglichkeit.
theological_decisions:
- issue: Gemeinschaft mit dem Messias nach dem Tod
  choice: aufzubrechen und beim Messias zu sein
  alternative: zu sterben und sofort in den Himmel zu kommen
  rationale: 'Die Übersetzung sagt nur das ausdrücklich im Griechischen Gesagte: Aufbruch und Sein beim Messias. Sie ergänzt weder eine Ortsangabe noch eine ausgearbeitete Lehre über Zeitpunkt oder Zustand nach dem Tod.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt löst die griechische Partizipialfügung lesbar auf. Die Metapher „aufzubrechen“ sowie die starke Vergleichsform bleiben erhalten; erläuternde Fußnoten kennzeichnen lexikalische Alternativen.
