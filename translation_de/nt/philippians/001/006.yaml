  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: de
  text: 'Gerade davon bin ich überzeugt: Derjenige, der unter euch[a] ein gutes Werk begonnen hat, wird es bis zum Tag des Messias Jesus[b] vollenden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in euch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „Christus Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς αὐτὸ τοῦτο
  choice: Ich bin gerade davon überzeugt
  rationale: Das Partizip wird im Zusammenhang als Aussage aus der Ich-Perspektive wiedergegeben; „gerade davon“ bewahrt die nachdrückliche Rückverweisung von αὐτὸ τοῦτο in natürlichem Deutsch.
- source_word: ὁ ἐναρξάμενος
  choice: Der, der … begonnen hat
  rationale: Die substantivierte Partizipialform bezeichnet den Handelnden persönlich, ohne den im Griechischen nur implizierten Bezug auf Gott ausdrücklich einzufügen.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Das Pronomen steht im Plural und richtet sich an die Gemeinde; „unter euch“ wahrt den gemeinschaftlichen Sinn. Die ebenfalls mögliche Wiedergabe „in euch“ wird in einer Fußnote genannt.
- source_word: ἔργον ἀγαθὸν
  choice: ein gutes Werk
  rationale: Direkte, im Deutschen natürliche Wiedergabe ohne inhaltliche Ausweitung.
- source_word: ἐπιτελέσει
  choice: wird es … vollenden
  rationale: Bezeichnet das erfolgreiche Zu-Ende-Führen des begonnenen Werkes und vermeidet unnötige Zusatzformulierungen.
- source_word: ἄχρι ἡμέρας
  choice: bis zum Tag
  rationale: Entspricht dem zeitlichen Grenzausdruck ἄχρι und bewahrt dessen mögliche Spannung zwischen fortdauerndem Wirken und eschatologischer Vollendung.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός wird hier als Titel mit „Messias“ wiedergegeben; die griechische Namens- und Titelfolge bleibt erhalten.
theological_decisions:
- issue: Individueller oder gemeinschaftlicher Umfang des guten Werkes
  choice: „unter euch“ im Haupttext
  alternative: „in euch“
  rationale: Der Plural und die Anrede der Gemeinde sprechen für eine gemeinschaftliche Lesart, ohne eine Anwendung auf Einzelne auszuschließen.
- issue: Zeitlicher Bezug der Vollendung
  choice: „bis zum Tag“
  alternative: „am Tag“ oder „bis zum Tag hin“
  rationale: ἄχρι bezeichnet ausdrücklich eine zeitliche Grenze. Die Übersetzung legt nicht über den Wortlaut hinaus fest, ob ausschließlich fortdauerndes Wirken bis dahin oder die endgültige Vollendung an jenem Tag betont wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und zuversichtlich; weder der implizite Handelnde noch der genaue Umfang des Werkes wird erklärend erweitert.
