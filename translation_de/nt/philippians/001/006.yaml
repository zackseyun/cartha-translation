  rationale: Die Revision beseitigt die zeitliche Fehlassoziation von „gerade“ und verbessert die Satzführung, ohne den Nachdruck des griechischen αὐτὸ τοῦτο oder den impliziten Handelnden auszubauen. Die zeitliche Offenheit von ἄχρι ἡμέρας bleibt mit „bis zum Tag“ gewahrt. Die Fußnoten werden an ihren jeweiligen Bezugswörtern verankert.
