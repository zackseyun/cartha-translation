id: PHP.1.26
reference: Philippians 1:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: de
  text: damit durch mein erneutes Kommen zu euch euer Rühmen[a] in Messias Jesus[b] wegen mir[c] immer reichlicher wird.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euer Grund, euch zu rühmen“ beziehungsweise „euer Anlass zum Rühmen“.'
    reason: lexical_alternative
  - marker: b
    text: „Messias“ bedeutet „Gesalbter“. Die Wortgruppe „in Messias Jesus“ kann auch zum folgenden „immer reichlicher wird“ gezogen werden.
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Wörtlich: „in mir“; je nach Verständnis auch „an mir“ oder „durch mich“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „durch meine erneute Anwesenheit bei euch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die erwartete Folge der vorhergehenden Aussage ein und entspricht dem griechischen Finalsatz natürlich.
- source_word: τὸ καύχημα ὑμῶν
  choice: euer Rühmen
  rationale: Bewahrt die substantivische Form und lässt offen, ob stärker der Vollzug des Rühmens oder dessen Anlass und Grund gemeint ist.
- source_word: περισσεύῃ
  choice: noch größer wird
  rationale: Gibt die Vorstellung des Zunehmens oder Überreichwerdens in natürlichem Deutsch wieder; der Konjunktiv steht im Deutschen bereits im durch „damit“ eingeleiteten Zielsatz.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Christus Jesus
  rationale: Bewahrt die paulinische Wendung und den Titel Χριστός in der im Deutschen eingebürgerten Form „Christus“, ohne die syntaktische Zuordnung zum Rühmen aufzulösen.
- source_word: ἐν ἐμοὶ
  choice: meinetwegen
  rationale: Gibt den wahrscheinlich gemeinten Anlassbezug idiomatisch wieder; die wörtlichere Wiedergabe „in mir“ bleibt als Alternative in der Fußnote erhalten.
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: durch mein erneutes Kommen zu euch
  rationale: Gibt διά instrumental-kausal wieder und versteht παρουσία im Kontext als das persönliche Wiederkommen des Paulus; „Anwesenheit“ bleibt lexikalisch möglich.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Christus Jesus
  alternative: Messias Jesus / Jesus, der Messias
  rationale: „Christus“ ist im modernen deutschen Bibelregister die natürliche und würdevolle Form des griechischen Titels. Eine Fußnote macht dessen Bedeutung „Messias“ transparent, ohne die Wendung im Haupttext unnötig fremd klingen zu lassen.
- issue: Bezug von ἐν Χριστῷ Ἰησοῦ
  choice: auf „euer Rühmen“ bezogen
  alternative: auf „noch größer wird“ bezogen
  rationale: Die Wortstellung und der häufige paulinische Sprachgebrauch sprechen für „Rühmen in Christus Jesus“; die griechische Folge lässt jedoch eine gewisse syntaktische Offenheit bestehen, die in der Fußnote kenntlich gemacht wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Häufung der griechischen Präpositionalgruppen wird in natürlicher deutscher Reihenfolge wiedergegeben, ohne ihre Beziehungen unnötig festzulegen. „Rühmen“ bewahrt die theologisch spannungsreiche positive Verwendung des sonst oft negativ verstandenen Begriffs.
