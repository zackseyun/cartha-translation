  text: πάντοτε ἐν πάσῃ δεήσει μου ὑπὲρ πάντων ὑμῶν, μετὰ χαρᾶς τὴν δέησιν ποιούμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/004.yaml
  text: always in every prayer of mine for all of you, praying with joy,
translation:
  language: de
  text: indem ich allezeit in jedem meiner Gebete für euch alle mit Freude bete,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: allezeit
  rationale: Gibt die umfassende zeitliche Aussage knapp und in einem würdigen, noch gut verständlichen Register wieder.
- source_word: ἐν πάσῃ δεήσει μου
  choice: in jedem meiner Gebete
  rationale: δεήσις bezeichnet hier ein bittendes Gebet; im Deutschen ist „Gebet“ im Satzfluss natürlich und vermeidet die schwerfällige Wiederholung „Bitte … bittend“.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: für euch alle
  rationale: Bewahrt sowohl den Fürbittebezug von ὑπέρ als auch die ausdrückliche Gesamtheit πάντων.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Direkte und natürliche Entsprechung der modalen Wendung.
- source_word: τὴν δέησιν ποιούμενος
  choice: bete
  rationale: Die griechische Umschreibung „das Gebet verrichtend“ wird idiomatisch verbal wiedergegeben; das Partizip wird durch „indem“ syntaktisch an Vers 3 angebunden.
theological_decisions:
- issue: Bezug der Freude
  choice: „mit Freude“ bestimmt den Vollzug des Betens.
  alternative: Die Freude als eigenständige Aussage oder allgemein als Gemütszustand des Paulus wiederzugeben.
  rationale: Die Stellung von μετὰ χαρᾶς bei τὴν δέησιν ποιούμενος verbindet die Freude am natürlichsten mit dem Beten, ohne darüber hinaus eine theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist im Griechischen syntaktisch Teil des in Vers 3 begonnenen Satzes; „indem“ hält diese Anbindung sichtbar. Die Wiederholung des Gebetsbegriffs im Ausgangstext wird zugunsten eines natürlichen deutschen Satzes leicht geglättet.
