source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: de
  text: und euch in keiner Weise von denen einschüchtern lasst, die sich euch entgegenstellen[a]. Das ist für sie ein Anzeichen ihres Verderbens, für euch aber eurer Rettung – und dies kommt von Gott[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erschrecken“ oder „in Angst geraten“.'
    reason: lexical_alternative
  - marker: c
    text: „Dies kommt von Gott“ kann sich speziell auf die Rettung oder weiter auf das gesamte zuvor genannte Anzeichen beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: euch einschüchtern lasst
  rationale: Das Verb bezeichnet ein Erschreckt- oder Eingeschüchtertwerden. Die reflexive deutsche Wendung ist natürlich und bewahrt im Zusammenhang die Aufforderung, sich durch Widerstand nicht einschüchtern zu lassen.
- source_word: ἐν μηδενί
  choice: in keiner Weise
  rationale: 'Die idiomatische Wendung hat umfassenden Sinn: in nichts beziehungsweise in keiner Hinsicht.'
- source_word: τῶν ἀντικειμένων
  choice: denen, die sich euch entgegenstellen
  rationale: Das substantivierte Partizip bezeichnet Personen, die aktiv Widerstand leisten. Die Relativkonstruktion gibt diesen fortdauernden Gegensatz transparent wieder; das Objekt „euch“ ist aus dem Kontext ergänzt.
- source_word: ἔνδειξις
  choice: Anzeichen
  rationale: Das Wort bezeichnet einen erkennbaren Hinweis oder Beleg. „Anzeichen“ ist verständlich und lässt offen, wie zwingend diese Evidenz aufgefasst wird.
- source_word: ἀπωλείας
  choice: Verderben
  rationale: „Verderben“ bewahrt den eschatologischen Ernst von ἀπώλεια, ohne die genaue Art oder den Ablauf des Gerichts näher festzulegen.
- source_word: σωτηρίας
  choice: Rettung
  rationale: „Rettung“ ist eine klare, gegenwärtige Wiedergabe von σωτηρία und bewahrt hier den Gegensatz zum Verderben.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: und dies kommt von Gott
  rationale: Die Formulierung gibt den demonstrativen Rückverweis ausdrücklich wieder und lässt dessen Reichweite bewusst offen.
theological_decisions:
- issue: Bezugswort von τοῦτο („dies“)
  choice: 'Der Rückverweis bleibt im Haupttext absichtlich mehrdeutig: „und dies kommt von Gott“.'
  alternative: „Dies“ kann sich enger auf die Rettung oder weiter auf das zuvor genannte Anzeichen beziehungsweise den gesamten dargestellten Sachverhalt beziehen.
  rationale: Der griechische Satz legt den Bezug nicht eindeutig fest; die Übersetzung soll diese theologisch bedeutsame Offenheit nicht auflösen.
- issue: Bedeutung von ἀπωλείας und σωτηρίας
  choice: „Verderben“ und „Rettung“ werden als gewichtiger Gegensatz wiedergegeben.
  alternative: Situative Wiedergaben wie „Niederlage“ und „Befreiung“ wären sprachlich denkbar.
  rationale: Der paulinische Kontext trägt wahrscheinlich eschatologisches Gewicht. Die gewählten Begriffe bewahren dieses, ohne über den Wortlaut hinaus Einzelheiten festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich entgegenstellen“ ist allgemeinverständlich und bildet das aktive Partizip ab. „Einschüchtern lassen“ klingt natürlicher als eine wörtliche Passivkonstruktion. Der Gedankenstrich erhält die nachgestellte, betonte Gottesangabe.
