  - severity: low
    issue: Die Zuordnung von Verderben und Rettung bleibt im deutschen Satz etwas locker.
    rationale: Die Genitive ἀπωλείας und σωτηρίας werden durch „ihres Verderbens“ und „eurer Rettung“ idiomatisch und parallel wiedergegeben, ohne die Frage zu entscheiden, worauf sich „dies“ abschließend bezieht.
