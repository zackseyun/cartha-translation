  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: de
  text: erfüllt mit der Frucht der Gerechtigkeit[a], die durch Jesus, den Messias,[b] gewirkt wird, zur Ehre und zum Lob Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frucht des Rechts“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Jesus Christus“; „Messias“ gibt Christos als Titel wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: erfüllt
  rationale: Das Perfektpartizip bezeichnet einen herbeigeführten, fortbestehenden Zustand und schließt als Partizip an den vorhergehenden Satzteil an.
- source_word: καρπὸν
  choice: Frucht
  rationale: Die geläufige metaphorische Wiedergabe bewahrt das Bild eines sichtbaren geistlichen und ethischen Ergebnisses.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: Die deutsche Entsprechung deckt hier sowohl rechtes Verhalten als auch den theologisch geprägten Begriff ab; die genaue Funktion des Genitivs bleibt offen.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: die durch Jesus, den Messias, kommt
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Mittel. Die Relativkonstruktion ist im Deutschen natürlich und lässt offen, wie genau die Frucht durch Jesus vermittelt oder hervorgebracht wird.
- source_word: Χριστοῦ
  choice: den Messias
  rationale: Die Wiedergabe als Titel macht den Bedeutungsgehalt von Χριστός sichtbar; die Apposition ist idiomatisches Deutsch.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: zur Ehre und zum Lob Gottes
  rationale: εἰς bezeichnet Ziel oder Ergebnis; diese Formulierung gibt die Ausrichtung auf Gottes Ehre und Lob natürlich wieder.
theological_decisions:
- issue: Bedeutung von „Frucht der Gerechtigkeit“
  choice: Die Genitivverbindung wird unverändert als „Frucht der Gerechtigkeit“ wiedergegeben.
  alternative: „Frucht, die in gerechtem Handeln besteht“ oder „Frucht, die als Gerechtigkeit angerechnet wird“
  rationale: Der griechische Genitiv erlaubt mehrere Beziehungen. Die Übersetzung bewahrt diese Spannung, statt die Frucht ausschließlich als ethisches Verhalten, als Wesensmerkmal oder als angerechnete Gerechtigkeit festzulegen.
- issue: Bezug und Wirkung von διὰ Ἰησοῦ Χριστοῦ
  choice: „die durch Jesus, den Messias, kommt“
  alternative: „die Jesus, der Messias, bewirkt“ oder „durch Jesus Christus“
  rationale: Die gewählte Form wahrt die vermittelnde Bedeutung von διά, ohne die Art der Wirksamkeit Jesu enger als der Ausgangstext zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Form bleibt als partizipialer Anschluss an den vorausgehenden Vers erhalten. „Jesus, den Messias“ kennzeichnet Χριστός idiomatisch als Titel.
