  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: de
  text: damit ihr beurteilen könnt, was das Beste ist[a], damit ihr rein und untadelig seid für den Tag des Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „worauf es ankommt“, „was wesentlich ist“ oder, wörtlicher, „was sich unterscheidet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „für den Tag Christi“.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: prüfen und erkennen
  rationale: Das Verb bezeichnet ein prüfendes Beurteilen, das zur Anerkennung des Bewährten führt. Die verbale Verbindung gibt diesen Vorgang im Deutschen natürlicher und vollständiger wieder als nur „erkennen“ oder „gutheißen“.
- source_word: τὰ διαφέροντα
  choice: worauf es ankommt
  rationale: Wörtlich sind es „die Dinge, die sich unterscheiden“. Im Zusammenhang kann die Wendung das Wesentliche, Vorzüglichere oder moralisch Bessere bezeichnen. „Worauf es ankommt“ ist verständlich und bewahrt den Gedanken einer gewichtenden Unterscheidung.
- source_word: εἰλικρινεῖς
  choice: rein
  rationale: Das Adjektiv kann Reinheit, Lauterkeit oder Aufrichtigkeit ausdrücken. „Rein“ passt zum ethischen Zusammenhang und lässt die innere Unversehrtheit anklingen.
- source_word: ἀπρόσκοποι
  choice: untadelig
  rationale: Das Wort kann bedeuten, nicht zu Fall zu kommen oder anderen keinen Anstoß zu geben. In der Verbindung mit εἰλικρινεῖς fasst „untadelig“ die ethische Zielrichtung knapp zusammen, ohne eine der beiden möglichen Richtungen ausdrücklich festzulegen.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: für den Tag des Messias
  rationale: εἰς bezeichnet hier die Ausrichtung auf den kommenden eschatologischen Tag. Χριστός wird als Titel mit „Messias“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der eschatologischen Wendung εἰς ἡμέραν Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: Χριστός hat hier in der Bezeichnung des eschatologischen Tages erkennbar titularen Gehalt. „Messias“ macht die Bedeutung des Titels sichtbar; die kirchlich vertraute Wiedergabe „Christus“ bleibt in der Fußnote erhalten.
- issue: Bedeutungsrichtung von ἀπρόσκοποι
  choice: untadelig
  alternative: ohne Anstoß / ohne zu Fall zu kommen
  rationale: Der griechische Ausdruck kann sowohl die eigene Standfestigkeit als auch das Vermeiden eines Anstoßes für andere betreffen. Die Hauptübersetzung entscheidet diese Mehrdeutigkeit nicht ausdrücklich; die Fußnote dokumentiert sie.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Prüfen und erkennen“ verdeutlicht den bewertenden Vorgang, ohne die idiomatische Wendung zu überladen. Die Satzstruktur wahrt beide griechischen Zweck- beziehungsweise Zielangaben.
