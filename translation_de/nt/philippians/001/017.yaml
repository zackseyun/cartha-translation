  - severity: low
    issue: Die vorhandene Fußnote verbindet zwei unterschiedliche lexikalische Hinweise unter einem erst am Satzende gesetzten Anker.
    rationale: Die Alternative „Christus“ gehört zu „Messias“, die Erklärung der Metonymie zu „Gefangenschaft“. Getrennte Anker verbessern die Zuordnung.
