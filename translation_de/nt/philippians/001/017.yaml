source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: de
  text: Die anderen aber verkünden den Messias[a] aus selbstsüchtigem Ehrgeiz, nicht aus lauteren Motiven, und meinen, mir in meiner Gefangenschaft[b] Bedrängnis zu bereiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „meinen Fesseln“. „Fesseln“ steht hier metonymisch für die Gefangenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: selbstsüchtigem Ehrgeiz
  rationale: Der Ausdruck bezeichnet eigennütziges, von Rivalität oder Parteigeist geprägtes Streben; „selbstsüchtiger Ehrgeiz“ gibt diesen Beweggrund in modernem Deutsch prägnant wieder.
- source_word: Χριστόν
  choice: den Messias
  rationale: Hier bezeichnet Χριστός den Inhalt der Verkündigung und ist daher deutlich als Titel gebraucht.
- source_word: καταγγέλλουσιν
  choice: verkünden
  rationale: „Verkünden“ bewahrt den öffentlichen Bekanntmachungscharakter, ohne den Vorgang auf eine formelle Predigt einzuengen.
- source_word: οὐχ ἁγνῶς
  choice: nicht aus lauteren Motiven
  rationale: Das Adverb bezieht sich im Zusammenhang auf die Unreinheit ihrer Beweggründe; die idiomatische Wendung macht dies ausdrücklich.
- source_word: οἰόμενοι
  choice: Sie meinen
  rationale: Die finite Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn einer Annahme beziehungsweise Absicht.
- source_word: θλῖψιν ἐγείρειν
  choice: die Bedrängnis noch zu verschärfen
  rationale: Die Wendung bedeutet wörtlich, Bedrängnis hervorzurufen oder zu erwecken. Im Kontext zielt ihr Handeln darauf, Paulus zusätzliche Not zu bereiten; „verschärfen“ gibt dies idiomatisch wieder.
- source_word: τοῖς δεσμοῖς μου
  choice: in der Gefangenschaft
  rationale: „Fesseln“ bezeichnet metonymisch die Haft. Die Hauptfassung nennt den gemeinten Zustand, während die Fußnote die konkrete Bildsprache bewahrt.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Da es hier um den Inhalt der Verkündigung geht, tritt die titularische Bedeutung hervor; „Christus“ bleibt als mögliche traditionelle Wiedergabe bestehen.
- issue: Bezug von τοῖς δεσμοῖς μου bei θλῖψιν ἐγείρειν
  choice: meine Bedrängnis in der Gefangenschaft noch zu verschärfen
  alternative: meinen Fesseln Bedrängnis hinzuzufügen
  rationale: Der Dativ lässt sich semantisch auf Paulus in seinem Haftzustand beziehen. Die Übersetzung bewahrt die Vorstellung zusätzlicher Not, ohne eine unnatürliche deutsche Verbindung mit „Fesseln“ zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische Satz bleibt in seiner scharfen Gegenüberstellung erhalten; die Motivangabe und die zusätzliche Bedrängnis werden idiomatisch, aber quellennah formuliert.
