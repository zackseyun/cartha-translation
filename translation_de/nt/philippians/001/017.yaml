revisions:
- from: Die anderen aber verkünden den Messias aus selbstsüchtigem Ehrgeiz, nicht aus lauteren Motiven. Sie meinen, dadurch meine Bedrängnis in der Gefangenschaft noch zu verschärfen.[a]
  to: Die anderen aber verkünden den Messias[a] aus selbstsüchtigem Ehrgeiz, nicht aus lauteren Motiven, und meinen, mir in meiner Gefangenschaft[b] Bedrängnis zu bereiten.
  rationale: Die Revision wahrt die Aussage, dass die anderen aus eigennützigem Ehrgeiz verkündigen und damit Paulus während seiner Haft Bedrängnis verursachen wollen. Sie entfernt die nicht ausdrücklich markierte Steigerung „noch“ und die possessive Festlegung „meine Bedrängnis“. Die Fußnoten werden ihren jeweiligen Bezugswörtern eindeutig zugeordnet.
