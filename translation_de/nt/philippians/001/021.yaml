  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: de
  text: Denn für mich ist das Leben Christus und das Sterben Gewinn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμοὶ
  choice: für mich
  rationale: Der Dativ bezeichnet die persönliche Perspektive des Paulus. „Für mich“ ist im Deutschen idiomatisch und bewahrt die betonte Voranstellung.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert den vorausgehenden Gedanken. „Denn“ gibt diesen argumentativen Anschluss knapp und natürlich wieder.
- source_word: τὸ ζῆν
  choice: das Leben
  rationale: Der substantivierte Infinitiv bezeichnet hier das Leben beziehungsweise den Vorgang des Lebens. „Das Leben“ bildet im Deutschen eine prägnante, ausgewogene Parallele zu „das Sterben“.
- source_word: Χριστὸς
  choice: Christus
  rationale: Χριστός wird in diesem paulinischen Satz am natürlichsten mit der im Deutschen etablierten Bezeichnung „Christus“ wiedergegeben. Der Ausdruck kann titularen und namensähnlichen Charakter zugleich tragen.
- source_word: τὸ ἀποθανεῖν
  choice: das Sterben
  rationale: Der substantivierte Aoristinfinitiv bezeichnet den Eintritt des Todes. „Das Sterben“ wahrt die kompakte Parallelstruktur mit „das Leben“, ohne den Satz unnötig auszudeuten.
- source_word: κέρδος
  choice: Gewinn
  rationale: „Gewinn“ gibt den Sinn eines Vorteils oder Zugewinns prägnant wieder und erhält die zugespitzte Formulierung des griechischen Textes.
theological_decisions:
- issue: Bezug von „Christus“ in der elliptischen Aussage „das Leben Christus“
  choice: Die knappe Gleichsetzung bleibt ohne ergänzendes Verb oder erklärende Umschreibung stehen.
  alternative: „Christus ist mein Leben“ oder „zu leben heißt für mich Christus“
  rationale: Der griechische Text ist bewusst verdichtet und lässt offen, in welchem umfassenden Sinn Christus das Leben des Paulus bestimmt. Eine ausdeutende Umschreibung würde diese theologische Spannung einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und zugleich natürliche Formulierung bewahrt die Kürze, Parallelität und rhetorische Kraft des griechischen Satzes.
