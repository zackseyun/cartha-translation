  - severity: low
    issue: Schwerfällige Satzstellung
    rationale: Die Konstruktion „von Gott, unserem Vater, und dem Herrn Jesus, dem Messias, seien mit euch“ bündelt mehrere Einschübe und klingt weniger flüssig als eine direkte Grußformel mit „euch“ vor der Quellenangabe.
