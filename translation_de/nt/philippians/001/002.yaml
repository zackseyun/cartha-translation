  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: de
  text: Gnade und Frieden euch von Gott, unserem Vater, und dem Herrn Jesus, dem Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ ist die natürliche und theologisch gehaltvolle deutsche Wiedergabe des paulinischen Grußwortes, ohne es auf bloße Gunst oder eine einzelne Gabe einzuengen.
- source_word: ὑμῖν
  choice: seien mit euch
  rationale: Der Dativ wird in der deutschen Gruß- und Segensformel idiomatisch mit „mit euch“ wiedergegeben; das im Griechischen ausgelassene Verb wird für einen vollständigen deutschen Satz ergänzt.
- source_word: εἰρήνη
  choice: Frieden
  rationale: „Frieden“ bewahrt sowohl den gewöhnlichen Sinn als auch den jüdischen und frühchristlichen Resonanzraum des Grußes.
- source_word: ἀπό
  choice: von
  rationale: „Von“ bezeichnet unmittelbar und idiomatisch den Ursprung von Gnade und Frieden.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Gott, unserem Vater
  rationale: Die Apposition gibt Gott als unseren Vater wieder und bewahrt die enge griechische Verbindung ohne die alternative Lesart „unserem Gott und Vater“ unnötig einzuführen.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die etablierte, kontextuell angemessene Wiedergabe von κύριος und bewahrt dessen christologisches Gewicht.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: „Messias“ macht die Bedeutung des Titels Χριστός transparent; die Apposition mit Artikel ist im Deutschen natürlicher als „Jesus Messias“.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der paulinischen Grußformel
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός kann in paulinischen Formeln nahezu namensartig wirken, bezeichnet aber weiterhin den Gesalbten. Der Haupttext macht den Titelsinn mit „Messias“ sichtbar; die traditionelle Wiedergabe „Christus“ bleibt in der Fußnote erhalten.
- issue: Beziehung der Präposition ἀπό zu Gott und dem Herrn Jesus
  choice: Gnade und Frieden stammen gemeinsam von Gott, unserem Vater, und dem Herrn Jesus
  alternative: Die Quellenangabe nur auf „Frieden“ beziehen
  rationale: Wortstellung und feste Grußformel sprechen dafür, ἀπό auf beide Segensgüter und beide koordinierten Personen zu beziehen. Die deutsche Umstellung stellt diesen Bezug klar dar, ohne die beiden Geber voneinander zu trennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Umstellung der Grußformel zu „Gnade und Frieden von … seien mit euch“ vermeidet eine altertümliche Dativkonstruktion und macht zugleich deutlich, dass sowohl Gnade als auch Frieden von den beiden genannten Personen ausgehen.
