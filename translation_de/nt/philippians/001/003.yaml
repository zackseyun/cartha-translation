  text: I thank my God at every remembrance of you,[a]
translation:
  language: de
  text: Ich danke meinem Gott bei jeder Erinnerung an euch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich danke meinem Gott für jede Erinnerung an euch.“'
    reason: 'Lexikalisch-grammatische Alternative: ἐπί mit Dativ kann den Anlass auch kausaler im Sinn von „für“ bezeichnen.'
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Ich danke
  rationale: Das Präsens Aktiv Indikativ in der ersten Person Singular wird direkt und idiomatisch wiedergegeben.
- source_word: τῷ θεῷ μου
  choice: meinem Gott
  rationale: Der Dativ bei εὐχαριστέω entspricht im Deutschen der üblichen Verbindung „jemandem danken“; das Possessivpronomen bleibt erhalten.
- source_word: ἐπὶ πάσῃ
  choice: bei jeder
  rationale: ἐπί mit Dativ bezeichnet hier am ehesten den Anlass oder begleitenden Umstand des Dankens. „Bei jeder“ bewahrt diese Offenheit, ohne eindeutig eine Ursache festzulegen.
- source_word: τῇ μνείᾳ
  choice: Erinnerung
  rationale: „Erinnerung“ gibt das substantivische μνεία wieder und lässt den Zusammenhang mit Gedenken oder Erwähnen erkennen.
- source_word: ὑμῶν
  choice: an euch
  rationale: In Verbindung mit „Erinnerung“ ist dies die natürliche deutsche Wiedergabe des Genitivs und versteht die Adressaten als Gegenstand der Erinnerung.
theological_decisions:
- issue: Bezug des Genitivs ὑμῶν und Funktion von ἐπί
  choice: '„bei jeder Erinnerung an euch“: Paulus erinnert sich an die Adressaten, und dies ist der Anlass seines Dankes.'
  alternative: '„für all euer Gedenken“: Paulus dankt Gott dafür, dass die Adressaten an ihn denken.'
  rationale: Die gewählte Lesart passt am besten zum unmittelbaren Dankgebetszusammenhang und zum gewöhnlichen Verständnis der Wortgruppe, doch Grammatik und Wortschatz lassen die alternative Deutung grundsätzlich zu; sie wird daher in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die nominale Formulierung bewahrt die knappe Struktur und die echte Mehrdeutigkeit des griechischen Ausdrucks besser als die freiere Wiedergabe „jedes Mal, wenn ich an euch denke“.
