    rationale: Der Doppelpunkt nach der eingeschobenen Anrede trennt den ὅτι-Satz unnötig ab. Eine Formulierung mit „sich vielmehr ... ausgewirkt hat“ ist idiomatischer und bringt den unerwarteten Ergebnissinn von μᾶλλον sowie die resultative Aussage des Perfekts gut zur Geltung.
