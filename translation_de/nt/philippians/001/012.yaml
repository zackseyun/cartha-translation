source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: de
  text: Ich möchte euch aber wissen lassen, Brüder und Schwestern[a], dass das, was mir widerfahren ist, sich vielmehr zum Fortschritt der guten Nachricht[b] ausgewirkt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Brüder; die griechische Anrede kann die ganze glaubende Gemeinschaft einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: des Evangeliums.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... ὑμᾶς βούλομαι
  choice: Ich möchte, dass ihr wisst
  rationale: Gibt die geläufige briefliche Mitteilungsformel im modernen Deutschen natürlich wieder und bewahrt die persönliche Absicht des Verfassers.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier einen leichten Übergang. Im Deutschen wird dieser durch den neuen Satz und die Wortstellung ausreichend angezeigt; ein vorangestelltes „Nun“ könnte fälschlich zeitlich verstanden werden.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die Anrede bezeichnet in diesem Gemeindebrief wahrscheinlich die gesamte glaubende Gemeinschaft. Die inklusive Wiedergabe macht den pragmatischen Umfang im heutigen Deutsch deutlich; die wörtliche Form wird in der Fußnote genannt.
- source_word: τὰ κατ’ ἐμὲ
  choice: Was mir widerfahren ist
  rationale: Die Wendung bezeichnet die Paulus betreffenden Ereignisse beziehungsweise seine gegenwärtige Lage. Diese Formulierung ist natürlich und lässt den genauen Umfang offen.
- source_word: μᾶλλον
  choice: vielmehr
  rationale: Drückt den unerwarteten, einer möglichen gegenteiligen Erwartung widersprechenden Ausgang aus.
- source_word: εἰς προκοπὴν τοῦ εὐαγγελίου
  choice: zur Ausbreitung der guten Nachricht beigetragen
  rationale: προκοπή bezeichnet Fortschritt oder Vorankommen. In Verbindung mit der guten Nachricht ist „Ausbreitung“ idiomatisch, während „beigetragen“ die Konstruktion mit εἰς und ἐλήλυθεν natürlich wiedergibt.
- source_word: τοῦ εὐαγγελίου
  choice: der guten Nachricht
  rationale: Gibt die Grundbedeutung von εὐαγγέλιον verständlich wieder; die traditionelle Alternative „Evangelium“ bleibt in einer Fußnote erhalten.
- source_word: ἐλήλυθεν
  choice: hat ... beigetragen
  rationale: Das Perfekt beschreibt einen eingetretenen Sachverhalt mit fortdauerndem Ergebnis. Das deutsche Perfekt vermittelt dies im Zusammenhang natürlich.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Im Kontext ist die ganze Gemeinde angesprochen. Die inklusive Bedeutung wird im Haupttext ausgedrückt, ohne zu behaupten, dass im Griechischen beide Substantive stehen; darüber informiert die Fußnote.
- issue: Wiedergabe von εὐαγγέλιον
  choice: gute Nachricht
  alternative: Evangelium
  rationale: „Gute Nachricht“ bewahrt die transparente Wortbedeutung und vermeidet eine unnötige konfessionelle Einengung; „Evangelium“ ist die etablierte traditionelle Entsprechung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt für gewöhnliche Leser verständlich, wahrt den milden Gegensatz von μᾶλλον und setzt den Vers entsprechend der griechischen Vorlage mit einem weiterführenden Satzzeichen fort.
