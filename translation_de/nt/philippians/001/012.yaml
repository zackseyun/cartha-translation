    rationale: „Ausbreitung“ kann eine Folge des Fortschritts sein, bezeichnet aber spezifisch räumliche oder zahlenmäßige Verbreitung. προκοπή bleibt weiter und meint das Vorankommen beziehungsweise den Fortschritt der guten Nachricht.
  - severity: low
