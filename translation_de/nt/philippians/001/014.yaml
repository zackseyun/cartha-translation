id: PHP.1.14
reference: Philippians 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: de
  text: Und die meisten der Brüder[a], die im Herrn durch meine Fesseln Zuversicht gewonnen haben, wagen es umso mehr, das Wort furchtlos zu reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; wahrscheinlich sind hier die Glaubensgeschwister insgesamt gemeint.'
    reason: lexikalische Alternative und wahrscheinlicher inklusiver Bezugsumfang
lexical_decisions:
- source_word: πλείονας
  choice: die meisten
  rationale: Mit Artikel und partitivem Genitiv bezeichnet der Ausdruck die Mehrheit beziehungsweise den größeren Teil der Brüder, nicht lediglich eine zunehmende Zahl.
- source_word: ἀδελφῶν
  choice: der Brüder
  rationale: Die grammatisch maskuline Pluralform wird im Haupttext genau wiedergegeben; der wahrscheinlich weitere Bezug auf Glaubensgeschwister beiderlei Geschlechts wird in einer Fußnote erläutert.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die für Paulus charakteristische Wendung bleibt erhalten und bezeichnet hier den tragenden Bezugs- oder Vertrauensraum der gewonnenen Zuversicht.
- source_word: πεποιθότας
  choice: haben … Zuversicht gewonnen
  rationale: 'Die Formulierung gibt den resultativen Sinn des Perfektpartizips wieder: Ein vorausgegangenes Geschehen hat zu einer nun bestehenden Zuversicht geführt.'
- source_word: τοῖς δεσμοῖς μου
  choice: durch meine Fesseln
  rationale: Die konkrete Bildsprache von δεσμοί bleibt erhalten. Die Präposition „durch“ lässt die Fesseln als Anlass beziehungsweise Ursache der Zuversicht erkennen, ohne sie abstrakt als „Gefangenschaft“ wiederzugeben.
- source_word: περισσοτέρως
  choice: umso mehr
  rationale: Diese idiomatische Wendung bringt die gesteigerte Bereitschaft im Deutschen natürlich zum Ausdruck.
- source_word: τολμᾶν
  choice: wagen es
  rationale: „Wagen“ bewahrt den Gedanken entschlossenen Handelns angesichts einer möglichen Gefahr.
- source_word: ἀφόβως
  choice: furchtlos
  rationale: Das Adverb bezeichnet ausdrücklich das Fehlen von Furcht und wird daher genauer mit „furchtlos“ als mit dem allgemeineren „mutig“ wiedergegeben.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: Die knappe Formulierung des griechischen Textes bleibt bestehen. Gemeint ist wahrscheinlich die verkündigte Botschaft, doch ein Zusatz wie „Gottes“ steht im zugrunde gelegten Text nicht.
- source_word: λαλεῖν
  choice: zu reden
  rationale: Das allgemeine Verb für das Sprechen wird direkt wiedergegeben; „verkündigen“ wäre im Deutschen zwar geläufiger, würde die Aussage aber stärker spezifizieren als der griechische Wortlaut.
theological_decisions:
- issue: Bezugsumfang von ἀδελφοί
  choice: Im Haupttext steht „Brüder“, mit einer Fußnote zum wahrscheinlich umfassenderen Bezug.
  alternative: „Brüder und Schwestern“ oder „Glaubensgeschwister“
  rationale: Die grammatische Form ist maskulin, kann im damaligen Sprachgebrauch jedoch eine gemischte Gruppe von Glaubenden einschließen. Haupttext und Fußnote bewahren gemeinsam sowohl die Form als auch den wahrscheinlichen Bezugsumfang.
- issue: Bezug von ἐν κυρίῳ
  choice: „im Herrn“ wird mit dem Gewinnen von Zuversicht verbunden.
  alternative: Die Wendung könnte syntaktisch enger als Kennzeichnung der Brüder verstanden werden.
  rationale: Die Stellung beim Partizip πεποιθότας und der paulinische Sprachgebrauch sprechen dafür, dass ihre Zuversicht „im Herrn“ verankert ist; die knappe griechische Wortstellung lässt jedoch eine gewisse strukturelle Nähe zu „Brüder“ bestehen.
- issue: Inhalt von τὸν λόγον
  choice: „das Wort“ ohne ergänzende nähere Bestimmung
  alternative: „die Botschaft“, „das Wort Gottes“ oder „das Wort des Herrn“
  rationale: Im Kontext ist wahrscheinlich die Evangeliumsbotschaft gemeint. Da die vorgelegte Textform nur τὸν λόγον bietet, wird keine ausdrücklich theologische Ergänzung in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfügung ist gegenüber dem griechischen Partizipialbau für natürliches Deutsch entfaltet, während zentrale paulinische Wendungen wie „im Herrn“, das konkrete Bild der „Fesseln“ und die knappe Bezeichnung „das Wort“ erhalten bleiben.
