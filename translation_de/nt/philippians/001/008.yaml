id: PHP.1.8
reference: Philippians 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: de
  text: Denn Gott ist mein Zeuge, wie sehr ich mich nach euch allen sehne – mit der innigen Zuneigung des Messias Jesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus Jesus.«'
    reason: Alternative Wiedergabe des Titels Χριστός.
  - marker: b
    text: 'Oder: »mit dem Erbarmen des Messias Jesus.«'
    reason: σπλάγχνα kann neben tiefer Zuneigung auch herzliches Mitgefühl oder Erbarmen bezeichnen.
lexical_decisions:
- source_word: μάρτυς
  choice: Zeuge
  rationale: Die feste Wendung »Gott ist mein Zeuge« gibt den feierlichen Appell an Gott als Garanten für die Aufrichtigkeit des Paulus natürlich und genau wieder.
- source_word: γάρ
  choice: denn
  rationale: »Denn« bewahrt die begründende Verbindung zum vorhergehenden Zusammenhang.
- source_word: ὡς
  choice: wie sehr
  rationale: Die Formulierung bringt hier Inhalt und Intensität des Sehnens zum Ausdruck und ist im Deutschen idiomatisch.
- source_word: ἐπιποθῶ
  choice: ich sehne mich nach
  rationale: Dies vermittelt das starke persönliche Verlangen ohne altertümlich oder übersteigert zu klingen.
- source_word: πάντας ὑμᾶς
  choice: euch allen
  rationale: Die Wiedergabe erhält die ausdrückliche Einbeziehung aller Adressaten und klingt zugleich natürlich.
- source_word: ἐν σπλάγχνοις
  choice: mit der innigen Zuneigung
  rationale: Das wörtliche Bild der inneren Organe bezeichnet den Sitz tiefer Gefühle. »Innige Zuneigung« gibt diese emotionale Tiefe im gegenwärtigen Deutschen verständlich wieder; die mögliche Nuance des Erbarmens wird in einer Fußnote bewahrt.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός wird als bedeutungstragender Titel mit »Messias« übersetzt, während Ἰησοῦ als Name erscheint. Der Genitiv wird formal bewahrt und nicht vorschnell als bloßer Vergleich oder als Ursprung der Zuneigung aufgelöst.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der paulinischen Titel-Namen-Verbindung
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: »Messias« macht den Titelgehalt von Χριστός transparent. Die im Deutschen kirchlich vertraute Form »Christus Jesus« bleibt als Alternative in der Fußnote erhalten.
- issue: Beziehung der Zuneigung des Paulus zu Christus in ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ
  choice: mit der innigen Zuneigung des Messias Jesus
  alternative: mit dem Erbarmen des Messias Jesus
  rationale: Der griechische Genitiv lässt eine enge Zugehörigkeits- oder Ursprungsbeziehung erkennen, ohne sie näher festzulegen. Die Übersetzung bewahrt diese Spannung, statt ausdrücklich »wie Jesus« oder »von Jesus geschenkt« zu formulieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Gedankenstrich hebt die präzisierende Wendung hervor, ohne die griechische Aussage inhaltlich aufzulösen.
