id: PHP.1.18
reference: Philippians 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: de
  text: Was also? Es kommt nur darauf an, dass der Messias[b] auf jede Weise verkündigt wird, sei es zum Schein[a] oder in Wahrheit. Darüber freue ich mich. Ja, und ich werde mich freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Vorwand“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Was also?
  rationale: Bewahrt die knappe rhetorische Wendung, ohne die im Zusammenhang naheliegende Bedeutung „Was macht das schon?“ ausdrücklich in den Text einzutragen.
- source_word: πλὴν ὅτι
  choice: Es kommt nur darauf an, dass
  rationale: Gibt die einschränkende und zugleich auf den entscheidenden Punkt hinführende Funktion im natürlichen Deutschen wieder.
- source_word: παντὶ τρόπῳ
  choice: auf jede Weise
  rationale: Bewahrt den umfassenden Sinn der griechischen Dativwendung.
- source_word: προφάσει
  choice: zum Schein
  rationale: Bezeichnet eine nur vorgeschobene oder unaufrichtige Haltung, ohne die konkreten Beweggründe weiter auszudeuten.
- source_word: ἀληθείᾳ
  choice: in Wahrheit
  rationale: Erhält den knappen begrifflichen Gegensatz zu „zum Schein“.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Gibt Χριστός hier als den verkündigten Titel wieder; die traditionelle Wiedergabe „Christus“ bleibt in einer Fußnote sichtbar.
- source_word: καταγγέλλεται
  choice: verkündigt wird
  rationale: Bewahrt das Passiv und bezeichnet die öffentliche Bekanntmachung der Botschaft.
- source_word: ἐν τούτῳ
  choice: Darüber
  rationale: Natürliches Deutsch, das die Freude unmittelbar auf die zuvor genannte Verkündigung bezieht.
- source_word: χαίρω
  choice: freue ich mich
  rationale: Gibt die gegenwärtige Freude klar und idiomatisch wieder.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Ja, und ich werde mich freuen
  rationale: Bewahrt die bekräftigende Weiterführung und den Futur, ohne durch „weiterhin“ ausdrücklich eine fortlaufende Dauer in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Im Zusammenhang der Verkündigung kann Χριστός als Titel verstanden werden. „Der Messias“ macht diesen Titelgehalt sichtbar; „Christus“ ist als traditionelle und möglicherweise stärker namenartige Wiedergabe in der Fußnote vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Eröffnung und der Wechsel vom Präsens zum Futur bleiben erhalten; interpretierende Zusätze zu den Beweggründen oder zur Dauer der Freude werden vermieden.
