id: PHP.1.24
reference: Philippians 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: de
  text: Doch im Fleisch zu bleiben ist um euretwillen notwendiger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch im Körper weiterzuleben ist euretwegen notwendiger.“'
    reason: Lexikalische Alternative zu „im Fleisch zu bleiben“; sie verdeutlicht den hier gemeinten Fortbestand des leiblichen Lebens.
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: zu bleiben
  rationale: Der substantivierte Infinitiv bezeichnet das Fortdauern von Paulus’ gegenwärtigem Leben; „zu bleiben“ ist natürlich und wahrt den Bezug zum vorausgehenden Gegensatz.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier den Gegensatz zu dem zuvor genannten Wunsch, aufzubrechen und bei Christus zu sein.
- source_word: ἐν τῇ σαρκὶ
  choice: im Fleisch
  rationale: Die Wendung bezeichnet in diesem Zusammenhang das leibliche irdische Dasein, nicht eine moralisch verstandene „sündige Natur“. Die wörtliche Form bewahrt zugleich Paulus’ Ausdrucksweise.
- source_word: ἀναγκαιότερον
  choice: notwendiger
  rationale: Der Komparativ des griechischen Ausdrucks wird direkt erhalten.
- source_word: δι’ ὑμᾶς
  choice: um euretwillen
  rationale: Die Formulierung bringt den auf die Philipper bezogenen Nutzen beziehungsweise Anlass knapp und idiomatisch zum Ausdruck, ohne ihn stärker als Zweck festzulegen.
theological_decisions:
- issue: Bedeutung von σάρξ in diesem Vers
  choice: wörtlich-leibliches irdisches Leben („im Fleisch“)
  alternative: moralische Bedeutung („sündige Natur“) oder erklärende Wiedergabe („in dieser Welt weiterzuleben“)
  rationale: Der Zusammenhang stellt das Aufbrechen und Bei-Christus-Sein dem Fortbestehen von Paulus’ gegenwärtigem leiblichem Leben gegenüber. Eine moralische Deutung ist hier nicht durch den Kontext begründet.
- issue: Bezug des Komparativs ἀναγκαιότερον
  choice: Den offenen Vergleich mit „notwendiger“ bewahren
  alternative: Ergänzend deuten, etwa „notwendiger als das Sterben“ oder „dringender nötig“
  rationale: Das Griechische nennt den Vergleichsmaßstab nicht ausdrücklich; die Übersetzung soll diese knappe Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ bildet den Kontrast klar ab; „im Fleisch“ bewahrt den paulinischen Ausdruck, während die Fußnote die gemeinte leibliche Existenz verständlich macht. „Umetwillen“ ist gehoben, aber im heutigen Bibeldeutsch gut verständlich.
