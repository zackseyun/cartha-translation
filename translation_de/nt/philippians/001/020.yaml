id: PHP.1.20
reference: Philippians 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: de
  text: entsprechend meiner sehnsüchtigen Erwartung und Hoffnung, dass ich in keiner Hinsicht beschämt werde[a], sondern dass in aller Offenheit und mit allem Mut – wie immer, so auch jetzt – der Messias[b] an meinem Leib als groß erwiesen wird, sei es durch Leben oder durch Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich mich in keiner Hinsicht schäme“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: entsprechend
  rationale: κατά bezeichnet hier die Übereinstimmung mit der Erwartung und Hoffnung des Paulus; „entsprechend“ ist knapp, natürlich und anschlussfähig an den vorherigen Satz.
- source_word: ἀποκαραδοκίαν
  choice: sehnsüchtige Erwartung
  rationale: Das seltene, intensive Substantiv beschreibt eine gespannt nach vorn gerichtete Erwartung; „sehnsüchtige Erwartung“ bewahrt sowohl Intensität als auch Zukunftsbezug.
- source_word: ἐλπίδα
  choice: Hoffnung
  rationale: „Hoffnung“ gibt den üblichen paulinischen Sinn zuverlässig wieder und verbindet sich natürlich mit „Erwartung“.
- source_word: ἐν οὐδενὶ
  choice: in keiner Hinsicht
  rationale: Die Wendung drückt eine umfassende Verneinung aus; „in keiner Hinsicht“ ist im Deutschen klarer und idiomatischer als das wörtlichere „in nichts“.
- source_word: αἰσχυνθήσομαι
  choice: ich werde beschämt
  rationale: Die Wiedergabe erhält den möglichen passiven, öffentlichen Aspekt des Verbs. Die ebenfalls mögliche mediale Bedeutung „mich schämen“ wird in einer Fußnote genannt.
- source_word: παρρησίᾳ
  choice: in aller Offenheit und mit allem Mut
  rationale: παρρησία umfasst freies, offenes Reden und furchtlosen Mut. Die zweigliedrige deutsche Formulierung macht beide Aspekte verständlich, ohne die öffentliche Zeugnis-Situation einseitig festzulegen.
- source_word: μεγαλυνθήσεται
  choice: wird als groß erwiesen
  rationale: Die Formulierung bewahrt die Bedeutung „groß machen/als groß zeigen“, vermeidet aber das im Deutschen missverständliche körperliche „vergrößern“ und unterscheidet das Verb von δοξάζω.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός ist hier als bedeutungstragender Titel hörbar. „Der Messias“ gibt diesen Titel wieder; die traditionelle Alternative „Christus“ steht in der Fußnote.
- source_word: ἐν τῷ σώματί μου
  choice: an meinem Leib
  rationale: „An meinem Leib“ ist natürliches Deutsch und bewahrt den Gedanken, dass die Größe des Messias im leiblichen Ergehen des Paulus sichtbar wird.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: sei es durch Leben oder durch Tod
  rationale: Die parallele Fassung erhält διά mit Genitiv als Mittel beziehungsweise Umstand und lässt offen, ob Paulus sein Leben und seinen Tod oder Leben und Tod als jeweilige Zustände hervorhebt.
theological_decisions:
- issue: Wiedergabe von Χριστός im paulinischen Kontext
  choice: der Messias
  alternative: Christus
  rationale: 'An dieser Stelle bleibt die Titelfunktion erkennbar: Die messianische Würde Jesu soll am Leib des Paulus sichtbar groß erwiesen werden. „Christus“ ist sachlich möglich und wird als traditionelle Alternative vermerkt.'
- issue: Bedeutung von αἰσχυνθήσομαι
  choice: ich werde beschämt
  alternative: ich werde mich schämen
  rationale: Der Kontext erlaubt sowohl eine öffentliche Beschämung beziehungsweise ein Zuschandenwerden als auch das persönliche Sich-Schämen. Der Haupttext bewahrt den passiven öffentlichen Akzent; die Fußnote hält die echte Mehrdeutigkeit offen.
- issue: Wie der Messias am Leib des Paulus groß erwiesen wird
  choice: offene Formulierung ohne Festlegung auf Leben oder Martyrium
  alternative: ausschließliche Deutung auf mutiges Zeugnis oder Märtyrertod
  rationale: Der Text nennt ausdrücklich sowohl Leben als auch Tod. Die Übersetzung löst diese Spannung nicht zugunsten nur eines möglichen Ausgangs auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als syntaktischer Anschluss an den vorherigen Vers kleingeschrieben. „Leib“ wahrt den biblisch-leiblichen Bezug, ohne altertümlich zu wirken. Die Gedankenstriche gliedern den langen Satz und machen den Einschub „wie immer, so auch jetzt“ gut erfassbar.
