revisions:
- from: 'Nur: Führt euer Leben[a] so, wie es der guten Nachricht vom Messias entspricht, damit ich – ob ich nun komme und euch sehe oder fernbleibe – von euch höre, dass ihr in einem Geist[b] feststeht und mit einer Seele[c] Seite an Seite für den Glauben der guten Nachricht kämpft[d].'
  to: 'Entscheidend ist nur dies: Führt euer Leben[a] so, wie es dem Evangelium des Messias entspricht, damit ich – ob ich nun komme und euch sehe oder fernbleibe – von euch höre, dass ihr in einem Geist[b] feststeht und als eine Seele[c] Seite an Seite für den Glauben an das Evangelium kämpft[d].'
  rationale: Die Revision verbessert die idiomatische deutsche Satzführung und ersetzt die missverständliche Genitivkonstruktion am Satzende. Die bürgerlichen Untertöne von πολιτεύεσθε, die mögliche Bezugnahme von πνεύματι auf den Heiligen Geist und die nicht abschließend entscheidbare Beziehung von πίστει und τοῦ εὐαγγελίου bleiben in den Fußnoten dokumentiert.
