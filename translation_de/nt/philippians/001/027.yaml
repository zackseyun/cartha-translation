id: PHP.1.27
reference: Philippians 1:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: de
  text: 'Entscheidend ist nur dies: Führt euer Leben[a] so, wie es dem Evangelium des Messias entspricht, damit ich – ob ich nun komme und euch sehe oder fernbleibe – von euch höre, dass ihr in einem Geist[b] feststeht und als eine Seele[c] Seite an Seite für den Glauben an das Evangelium kämpft[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch mit »Lebt als Bürger« wiedergegeben werden und hat staatsbürgerliche Anklänge.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in einem Geist« im Sinn des Heiligen Geistes; die Formulierung kann auch die gemeinsame Haltung der Gemeinde bezeichnen.'
    reason: theological_ambiguity
  - marker: c
    text: 'Wörtlich: »mit einer Seele«. Oder: »einmütig« beziehungsweise »mit einem Sinn«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »Seite an Seite für den Glauben kämpfen, der durch das Evangelium geprägt ist«.'
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: Μόνον
  choice: 'Nur:'
  rationale: Die vorangestellte Partikel hebt die eine alles bestimmende Aufforderung hervor; der Doppelpunkt gibt diese Funktion im Deutschen natürlich wieder.
- source_word: ἀξίως
  choice: so, wie es ... entspricht
  rationale: Die Wendung gibt den adverbialen Sinn idiomatisch und mit seiner ethischen Kraft wieder, ohne einen menschlichen Verdienst zu unterstellen.
- source_word: πολιτεύεσθε
  choice: Führt euer Leben
  rationale: Dies ist im modernen Deutsch natürlich; die im Verb mitschwingende staatsbürgerliche Bedeutung wird in einer Fußnote bewahrt.
- source_word: εὐαγγελίου
  choice: gute Nachricht
  rationale: Die transparente deutsche Wiedergabe bewahrt den grundlegenden Verkündigungscharakter von εὐαγγέλιον.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Χριστός bezeichnet hier in der Genitivverbindung den messianischen Titel.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: von euch höre
  rationale: Natürliche deutsche Wiedergabe der Wendung für das, was Paulus über die Gemeinde erfährt.
- source_word: στήκετε
  choice: feststeht
  rationale: Bewahrt den Gedanken standhafter Beständigkeit.
- source_word: ἐν ἑνὶ πνεύματι
  choice: in einem Geist
  rationale: Die Formulierung lässt im Haupttext offen, ob gemeinsamer menschlicher Geist oder Gottes Geist gemeint ist.
- source_word: μιᾷ ψυχῇ
  choice: mit einer Seele
  rationale: Bewahrt das konkrete Bild von ψυχή und die Parallelität zu 'in einem Geist'.
- source_word: συναθλοῦντες
  choice: Seite an Seite ... kämpft
  rationale: Gibt das gemeinsame Ringen und den im Verb enthaltenen Wettkampfklang anschaulich wieder.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: für den Glauben der guten Nachricht
  rationale: Bleibt nahe an der Genitivkonstruktion und vermeidet, deren Beziehung im Haupttext vorschnell eindeutig festzulegen.
theological_decisions:
- issue: Bezeichnet πνεύματι den Heiligen Geist oder den gemeinsamen menschlichen Geist?
  choice: in einem Geist
  alternative: in dem einen Geist / durch den einen Geist
  rationale: Der Parallelismus mit 'mit einer Seele' legt gemeinschaftliche Einmütigkeit nahe; ein Bezug auf den Heiligen Geist bleibt jedoch möglich und wird ausdrücklich vermerkt.
- issue: Wie ist der Genitiv in τῇ πίστει τοῦ εὐαγγελίου zu verstehen?
  choice: für den Glauben der guten Nachricht
  alternative: für den Glauben an die gute Nachricht
  rationale: Die formnahe Wiedergabe erhält die mögliche Bedeutung 'der durch die gute Nachricht bestimmte Glaube'; die Alternative versteht den Genitiv objektiv.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Plural bleibt deutlich. Der Satzbau folgt dem griechischen Gedankengang, wird aber durch Gedankenstriche und klare Gliederung lesbar gehalten; echte lexikalische und theologische Mehrdeutigkeiten stehen in den Fußnoten.
