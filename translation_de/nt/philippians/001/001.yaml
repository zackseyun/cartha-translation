id: PHP.1.1
reference: Philippians 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: de
  text: 'Paulus und Timotheus, Sklaven[a] des Messias Jesus[b], an alle Heiligen im Messias Jesus, die in Philippi sind, zusammen mit den Aufsehern[c] und Diakonen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“ beziehungsweise „Knechte“. Das griechische Wort bezeichnet Menschen, die einem Herrn gehören und ihm dienen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus Jesus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Bischöfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Die Wiedergabe bewahrt den im griechischen Wort enthaltenen Status der Zugehörigkeit und Abhängigkeit deutlicher als das allgemeinere „Diener“. Eine Fußnote nennt geläufige Alternativen.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: des Messias Jesus / im Messias Jesus
  rationale: Χριστός ist seinem Ursprung und Sinn nach ein Titel. „Messias“ macht diesen Titelgehalt im Deutschen sichtbar; „Jesus“ bleibt als Name unverändert.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: an alle Heiligen
  rationale: „Heilige“ ist die knappe, etablierte deutsche Wiedergabe der paulinischen Bezeichnung für die zu Gott gehörenden Glaubenden, ohne einen zusätzlichen Ausdruck wie „Gottes Volk“ einzufügen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Das wiederholte ἐν wird mit „in/im“ bewahrt, damit die für Paulus wichtige Formulierung der Verbundenheit mit dem Messias nicht paraphrasiert wird.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: die in Philippi sind
  rationale: Der griechische Partizipialausdruck wird als natürliche deutsche Relativkonstruktion wiedergegeben, wobei die ausdrückliche Ortsangabe erhalten bleibt.
- source_word: σὺν
  choice: zusammen mit
  rationale: „Zusammen mit“ bringt die Bedeutung der begleitenden Zuordnung deutlicher zum Ausdruck als ein bloßes „mit“.
- source_word: ἐπισκόποις
  choice: Aufsehern
  rationale: „Aufseher“ gibt die Grundbedeutung transparent wieder und legt nicht ungefragt die späteren institutionellen Vorstellungen nahe, die mit „Bischof“ verbunden sein können.
- source_word: διακόνοις
  choice: Diakonen
  rationale: In der Paarung mit ἐπισκόποις bezeichnet das Wort wahrscheinlich einen anerkannten Dienst in der Gemeinde; „Diakone“ ist dafür die klare und etablierte deutsche Bezeichnung.
theological_decisions:
- issue: Wiedergabe von Χριστός in der paulinischen Anredeformel
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: „Messias“ bewahrt den Titelcharakter von Χριστός und macht dessen Bedeutung für heutige Leser sichtbar. Die traditionelle Wiedergabe „Christus Jesus“ bleibt als Fußnotenalternative genannt.
- issue: Wiedergabe von δοῦλοι in Philipper 1,1
  choice: Sklaven
  alternative: Diener oder Knechte
  rationale: „Sklaven“ bildet die rechtlich-soziale Bindung des griechischen Ausdrucks am deutlichsten ab. Da das deutsche Wort starke moderne Assoziationen trägt, werden weniger scharfe traditionelle Alternativen in einer Fußnote angegeben.
- issue: Amtsbezeichnung ἐπισκόποις
  choice: Aufseher
  alternative: Bischöfe
  rationale: Die transparente Funktionsbezeichnung vermeidet es, die voll entwickelte spätere Gestalt des Bischofsamtes in den Text hineinzulesen; die kirchengeschichtlich etablierte Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Briefanrede mit enger Bindung an die griechische Satzstruktur. Die bewusst markanten Ausdrücke „Sklaven“ und „Messias Jesus“ bewahren den sozialen beziehungsweise titularen Gehalt des Ausgangstextes; Fußnoten bieten die im deutschen Bibel- und Kirchengebrauch vertrauteren Alternativen. Der Doppelpunkt erhält den offenen Charakter der Briefeinleitung.
