  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: Die Gefangenschaft/Fesseln des Paulus wurden im ganzen Prätorium und darüber hinaus bekannt. „Sodass“, „im gesamten Prätorium“ und „bei allen anderen“ entsprechen dem konsekutiven Satzbau und den jeweiligen griechischen Ausdrücken gut. „Um des Messias willen“ ist eine plausible, aber interpretierende Wiedergabe von ἐν Χριστῷ; die alternative, sphärische Lesart muss korrekt und verständlich abgesichert werden.'
  naturalness: 'Der Haupttext ist modernes, würdiges Standarddeutsch und flüssig lesbar. Die Fußnote a ist jedoch syntaktisch unvollständig: Innerhalb des Zitats fehlt nach „Oder“ die einleitende Konjunktion „dass“. Zudem ist „im Messias“ im Deutschen zwar formnah, aber ohne Kennzeichnung als wörtliche Alternative unnötig sperrig.'
  terminology: „Messias“ wahrt den Titelcharakter von Χριστός. „Prätorium“ ist wegen der sachlichen Unsicherheit von πραιτώριον angemessen; Fußnote b erklärt die möglichen Referenten sachgerecht. „Fesseln“ in der alternativen Formulierung entspricht δεσμοί genauer als eine bloße abstrakte Wiedergabe von Gefangenschaft.
