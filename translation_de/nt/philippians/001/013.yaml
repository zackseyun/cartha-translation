  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: de
  text: sodass im gesamten Prätorium[b] und bei allen anderen bekannt geworden ist, dass ich um des Messias willen[a] in Ketten liege,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlich: „dass meine Fesseln in dem Messias bekannt geworden sind“.'
    reason: alternative_reading
  - marker: b
    text: Der Ausdruck kann die gesamte kaiserliche Garde oder das ganze kaiserliche Hauptquartier beziehungsweise die Residenz bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet die Folge des vorher Gesagten ein und gibt den konsekutiven Sinn natürlich wieder.
- source_word: τοὺς δεσμούς μου
  choice: dass ich … in Ketten liege
  rationale: Bewahrt das konkrete Bild der Fesseln, formuliert es im Deutschen aber idiomatisch als Zustand der Gefangenschaft.
- source_word: φανεροὺς … γενέσθαι
  choice: bekannt geworden ist
  rationale: 'Gibt den resultativen Vorgang wieder: Der Grund beziehungsweise die christologische Bestimmung von Paulus’ Gefangenschaft wurde öffentlich bekannt.'
- source_word: ἐν Χριστῷ
  choice: um des Messias willen
  rationale: Im Kontext bezeichnet die Wendung wahrscheinlich den erkennbaren Grund seiner Gefangenschaft. Die alternative, stärker sphärische Wiedergabe bleibt in einer Fußnote erhalten.
- source_word: Χριστῷ
  choice: Messias
  rationale: Gibt Χριστός als christologischen Titel wieder und bewahrt dessen Bedeutung.
- source_word: πραιτωρίῳ
  choice: Prätorium
  rationale: Der griechische Begriff kann die Prätorianergarde oder das kaiserliche Hauptquartier beziehungsweise die Residenz bezeichnen. Die formnahe Wiedergabe vermeidet eine unbegründete Festlegung; die Bedeutungsbreite wird erklärt.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: bei allen anderen
  rationale: Gibt die Ausweitung über das Prätorium hinaus vollständig und in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von ἐν Χριστῷ in Bezug auf Paulus’ Fesseln
  choice: um des Messias willen
  alternative: meine Fesseln im Messias
  rationale: Der Zusammenhang legt nahe, dass bekannt wurde, weshalb Paulus gefangen ist. Da ἐν Χριστῷ zugleich eine sphärische Beziehung ausdrücken kann, wird diese echte Mehrdeutigkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In Ketten liegen“ bewahrt das anschauliche Bild des Ausgangstextes; „Prätorium“ erhält die sachliche Mehrdeutigkeit, statt vorschnell nur die Garde oder nur ein Gebäude zu benennen.
