    rationale: „Freispruch“ legt einen spezifisch gerichtlichen Ausgang stärker fest, als σωτηρίαν hier verlangt. „Rechtfertigung“ bewahrt die mögliche Bedeutung von „vindication“, ohne sie unnötig zu spezifizieren.
