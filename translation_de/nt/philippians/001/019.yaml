  - severity: low
    issue: Anker der Fußnote zur Genitivmehrdeutigkeit
    rationale: Die bestehende Fußnote a erläutert die Beziehung von ἐπιχορηγίας und πνεύματος, ihr Marker steht aber nur bei „Messias“. Der Marker wird an „Beistand“ gesetzt, damit sein Bezug nachvollziehbar ist.
