id: PHP.1.19
reference: Philippians 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: de
  text: Denn ich weiß, dass dies durch euer Gebet und den Beistand[a] des Geistes Jesu, des Messias, zu meiner Rettung[b] führen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „der Versorgung des Geistes Jesu Christi“. Die Formulierung kann sowohl den vom Geist gewährten Beistand als auch die Zuteilung des Geistes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu meinem Heil“ oder „zu meiner Rechtfertigung“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδα
  choice: ich weiß
  rationale: Das formal perfekte οἶδα hat präsentische Bedeutung und drückt hier die feste Zuversicht des Paulus aus.
- source_word: τοῦτό
  choice: dies
  rationale: Das Demonstrativpronomen verweist zusammenfassend auf die gegenwärtige Lage des Paulus, ohne sie näher festzulegen.
- source_word: ἀποβήσεται εἰς
  choice: wird … führen
  rationale: Die Wendung bezeichnet den Ausgang oder das Ergebnis einer Lage; die deutsche Formulierung ist natürlich und bewahrt den Zukunftsbezug.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: „Rettung“ passt zum Kontext der Gefangenschaft, lässt aber zugleich den weiteren Bedeutungsraum von Heil und Rechtfertigung offen.
- source_word: δεήσεως
  choice: Gebet
  rationale: Das Wort bezeichnet eine inständige Bitte; „Gebet“ ist im Deutschen klar und idiomatisch.
- source_word: ἐπιχορηγίας
  choice: Unterstützung
  rationale: Das Substantiv bezeichnet gewährte Hilfe, Versorgung oder Bereitstellung. „Unterstützung“ ist verständlich und lässt die genitivische Beziehung zum Geist möglichst offen.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: des Geistes Jesu, des Messias
  rationale: Die Genitivkonstruktion wird formal bewahrt; Χριστός wird als Titel „Messias“ wiedergegeben, während die Fußnote die traditionelle Form „Christus“ nennt.
theological_decisions:
- issue: Bedeutung von σωτηρίαν im Zusammenhang der Gefangenschaft des Paulus
  choice: Rettung
  alternative: Heil; Rechtfertigung oder Freispruch
  rationale: Der unmittelbare Kontext legt eine Rettung beziehungsweise einen günstigen Ausgang nahe. Die mögliche Anspielung auf umfassendes Heil oder öffentliche Rechtfertigung wird jedoch nicht ausgeschlossen und deshalb in der Fußnote bewahrt.
- issue: Beziehung des Genitivs τοῦ πνεύματος zu ἐπιχορηγίας
  choice: die Unterstützung des Geistes
  alternative: die Gabe des Geistes; die vom Geist gewährte Unterstützung
  rationale: Der griechische Genitiv kann sowohl die Gabe beziehungsweise Zuteilung des Geistes als auch die vom Geist kommende Hilfe nahelegen. Die knappe Genitivkonstruktion löst diese Spannung nicht unnötig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber durch „wird … führen“ natürlich lesbar. „Messias“ macht Χριστός als Titel sichtbar; die traditionelle Wiedergabe „Christus“ steht in der Fußnote.
