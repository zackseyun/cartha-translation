- from: Denn ich weiß, dass dies durch euer Gebet und die Unterstützung des Geistes Jesu, des Messias,[a] zu meiner Rettung[b] führen wird.
  to: Denn ich weiß, dass dies durch euer Gebet und den Beistand[a] des Geistes Jesu, des Messias, zu meiner Rettung[b] führen wird.
  rationale: Die Revision präzisiert ἐπιχορηγία mit „Beistand“, ohne die umstrittene beziehungsweise mehrdeutige Genitivbeziehung festzulegen. Die zugehörige Fußnote wird an den sachlich passenden Ausdruck gesetzt und erläutert beide sprachlich möglichen Verständnisse. Bei σωτηρία wird die mögliche Deutung als Rechtfertigung in der Fußnote beibehalten, ohne mit „Freispruch“ eine engere gerichtliche Lesart vorzuziehen.
