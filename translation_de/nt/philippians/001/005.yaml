  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: de
  text: wegen eurer Gemeinschaft am Evangelium vom ersten Tag an bis heute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Evangelium“. Die griechische Wendung kann sowohl den Bereich ihrer gemeinsamen Teilhabe als auch deren Ziel oder Zweck bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: wegen eurer Gemeinschaft
  rationale: ἐπί mit dem Dativ bezeichnet hier im Zusammenhang den Grund für den Dank des Paulus. „Gemeinschaft“ gibt κοινωνία als tätige gemeinsame Teilhabe wieder und bleibt zugleich offen für ihre relationale Dimension.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: am Evangelium
  rationale: „am Evangelium“ ist im Deutschen eine natürliche Verbindung mit „Gemeinschaft“ und kann die gemeinsame Teilhabe im Bereich des Evangeliums ausdrücken; die mögliche Zielrichtung „für das Evangelium“ wird in der Fußnote bewahrt.
- source_word: εὐαγγέλιον
  choice: Evangelium
  rationale: Der etablierte paulinische Begriff ist würdig, verständlich und bewahrt das theologische Gewicht des griechischen Wortes.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: vom ersten Tag an
  rationale: Die Wendung bezeichnet den zeitlichen Ausgangspunkt und wird so idiomatisch ins Deutsche übertragen.
- source_word: ἄχρι τοῦ νῦν
  choice: bis heute
  rationale: Die Formulierung bezeichnet die ununterbrochene Fortdauer bis zur Gegenwart des Paulus und klingt im modernen Deutsch natürlicher als „bis jetzt“.
theological_decisions:
- issue: Bezug von εἰς τὸ εὐαγγέλιον
  choice: Gemeinschaft am Evangelium
  alternative: Gemeinschaft für das Evangelium
  rationale: Das Griechische kann sowohl den Bereich beziehungsweise Inhalt der gemeinsamen Teilhabe als auch deren Ziel und Zweck bezeichnen. Der Haupttext entscheidet sich für die natürliche deutsche Formulierung, ohne die zielgerichtete Lesart auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Da der Vers syntaktisch an den vorausgehenden Kontext anschließt, bleibt er entsprechend als Satzteil formuliert. „Gemeinschaft“ ist kirchlich vertraut, hier jedoch im aktiven Sinn gemeinsamer Teilhabe zu verstehen.
