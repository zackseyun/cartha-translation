    issue: „Und darum“ für καὶ τοῦτο
    rationale: „Darum“ fügt einen kausalen bzw. folgernden Bezug hinzu. καὶ τοῦτο bedeutet hier schlicht „und dies“ und verweist auf den folgenden Gebetsinhalt.
  - severity: low
    issue: Soll-Satz für ἵνα
    rationale: „Eure Liebe soll … werden“ kann im Deutschen auch als Anweisung oder Zukunftsaussage gelesen werden. Ein dass-Satz mit Konjunktiv I bildet den erbetenen Inhalt eindeutiger ab.
