revisions:
- from: 'Und darum bete ich: Eure Liebe soll noch mehr und mehr überreich werden an Erkenntnis und allem Urteilsvermögen.[a][b]'
  to: 'Und dies bete ich: dass eure Liebe immer mehr und mehr überreich werde an Erkenntnis und aller Einsicht.[a][b]'
  rationale: Die Revision beseitigt die nicht im griechischen Text ausgedrückte Folgerung in „darum“ und macht den ἵνα-Gebetsinhalt im Deutschen eindeutig. Sie bewahrt die Steigerung („immer mehr und mehr“), die Fülle von περισσεύῃ („überreich“) sowie die semantische Offenheit der Präpositionalverbindung und von αἴσθησις durch die Fußnoten.
