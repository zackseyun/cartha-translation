id: PHP.1.9
reference: Philippians 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: de
  text: 'Und dies bete ich: dass eure Liebe immer mehr und mehr überreich werde an Erkenntnis und aller Einsicht.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Erkenntnis« oder »mit Erkenntnis«; die griechische Präposition kann den Bereich oder eine enge Begleitung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »aller Einsicht« beziehungsweise »jeder sittlichen Wahrnehmungsfähigkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: Und darum
  rationale: 'Im Deutschen leitet dies natürlich vom Dank zum Inhalt des Gebets über. Das demonstrative τοῦτο wird auf den folgenden ἵνα-Satz bezogen; wörtlicher wäre: »Und dies bete ich«.'
- source_word: προσεύχομαι
  choice: bete ich
  rationale: Das Präsens bezeichnet hier passend das gegenwärtige beziehungsweise fortdauernde Beten des Paulus.
- source_word: ἵνα
  choice: ': … soll'
  rationale: Der Doppelpunkt mit einem deutschen Soll-Satz gibt den Inhalt und zugleich die Zielrichtung des Gebets natürlich wieder, ohne zwischen Inhalts- und Finalnuance unnötig zu entscheiden.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: eure Liebe
  rationale: Gibt die normale Bedeutung von ἀγάπη und den Genitiv ὑμῶν knapp und verständlich wieder.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: noch mehr und mehr
  rationale: Bewahrt sowohl ἔτι als auch die wiederholte Steigerung μᾶλλον … καὶ μᾶλλον.
- source_word: περισσεύῃ
  choice: überreich werden
  rationale: Bewahrt stärker als das bloße »zunehmen« die Vorstellung von überströmender Fülle; der Soll-Satz vertritt den griechischen Konjunktiv im Gebetsinhalt.
- source_word: ἐν ἐπιγνώσει
  choice: an Erkenntnis
  rationale: Die deutsche Verbindung »überreich werden an« ist idiomatisch und stellt Erkenntnis als den Bereich beziehungsweise die begleitende Qualität dar, in der die Liebe wächst.
- source_word: πάσῃ αἰσθήσει
  choice: allem Urteilsvermögen
  rationale: αἴσθησις bezeichnet hier Wahrnehmungs- und Unterscheidungsfähigkeit, besonders im praktischen oder sittlichen Bereich; »Urteilsvermögen« ist im modernen Deutsch klar und würdig.
theological_decisions:
- issue: Bezug von ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει auf das Überreichwerden der Liebe
  choice: Die Liebe wird »an Erkenntnis und allem Urteilsvermögen« überreich.
  alternative: Die Liebe wird »in/mit Erkenntnis und jeder Einsicht« überreich.
  rationale: Die Übersetzung lässt offen, ob ἐν stärker den Bereich, das Mittel oder die enge Begleitung bezeichnet, und vermeidet es, Liebe und Erkenntnis gegeneinander auszuspielen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die Wortstellung ist natürlich deutsch; »überreich werden« erhält das Bild der Fülle, während die Fußnoten die Mehrdeutigkeit der Präposition und von αἴσθησις sichtbar machen.
