id: PHP.1.15
reference: Philippians 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: de
  text: Einige verkünden Christus aus Neid und Rivalität, andere dagegen aus gutem Willen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Einige … andere dagegen
  rationale: Die Wiedergabe bezeichnet zwei gegensätzliche Gruppen und bildet den Kontrast von μέν … δέ in natürlichem Deutsch ab.
- source_word: διὰ φθόνον
  choice: aus Neid
  rationale: διά mit Akkusativ bezeichnet hier den Beweggrund; „aus Neid“ ist knapp und idiomatisch.
- source_word: ἔριν
  choice: Streitsucht
  rationale: Im Zusammenhang bezeichnet ἔρις eine von Konkurrenz und Konflikt geprägte Haltung. „Streitsucht“ gibt den verwerflichen Beweggrund natürlicher wieder als das allgemeinere „Streit“.
- source_word: δι’ εὐδοκίαν
  choice: aus gutem Willen
  rationale: Die Wendung steht im Gegensatz zu Neid und Streitsucht und bezeichnet daher den positiven Beweggrund beziehungsweise die wohlwollende Absicht.
- source_word: τὸν Χριστόν
  choice: Christus
  rationale: „Christus“ ist im modernen deutschen Bibel- und Allgemeingebrauch die natürliche Wiedergabe des griechischen Titels Χριστός und bleibt hier als Titel erkennbar.
- source_word: κηρύσσουσιν
  choice: verkünden
  rationale: „Verkünden“ bewahrt den öffentlichen, heroldartigen Sinn von κηρύσσω, ohne ihn auf eine institutionelle Predigt einzuengen.
theological_decisions:
- issue: Titel oder namensähnlicher Gebrauch von Χριστός
  choice: Christus
  alternative: der Messias
  rationale: Der Artikel kann den Titel markieren, zwingt im Deutschen aber nicht zur Wiedergabe „der Messias“. „Christus“ wahrt den traditionellen Titel und lässt die im Kontext mögliche namensähnliche Verwendung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und erhält den deutlichen Gegensatz der beiden Gruppen; das zweite καί wird nicht eigens wiedergegeben, da ein zusätzliches „auch“ im Deutschen unnötig schwerfällig wäre.
