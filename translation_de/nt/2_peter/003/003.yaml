  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: de
  text: 'Dabei sollt ihr vor allem wissen: In den letzten Tagen werden Spötter mit Spott[a] kommen, die ihren eigenen Begierden[b] folgen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Spötter werden mit Spott kommen.“ Im Griechischen stehen zwei verwandte Wörter, um den Spott hervorzuheben.'
    reason: lexical_alternative
  - marker: b
    text: „Begierden“ kann auch mit „Verlangen“ wiedergegeben werden. Das griechische Wort bezeichnet starke Wünsche allgemein und ist nicht auf sexuelles Begehren beschränkt.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Dabei sollt ihr vor allem wissen
  rationale: Die griechische Partizipialkonstruktion knüpft an den Zusammenhang an und trägt auffordernden Sinn. Die Wiedergabe ist im Deutschen natürlich und bewahrt den Vorrang, den πρῶτον ausdrückt, ohne zwingend eine zeitliche Reihenfolge zu behaupten.
- source_word: ἐλεύσονται
  choice: werden … kommen
  rationale: Die einfache Zukunftsform gibt das griechische ἐλεύσονται unmittelbar und idiomatisch wieder.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: in den letzten Tagen
  rationale: Dies ist die natürliche deutsche Wiedergabe der zeitlichen und eschatologischen Wendung, ohne sie auf ein bestimmtes Endzeitsystem festzulegen.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: Spötter …, die voller Spott sind
  rationale: Die Formulierung bewahrt die emphatische Verbindung der verwandten griechischen Wörter ἐμπαιγμονή und ἐμπαίκτης, bleibt dabei aber in modernem Deutsch verständlich.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: ihren eigenen Begierden
  rationale: „Begierden“ erhält den negativen moralischen Klang und bezeichnet starke, ungeordnete Wünsche, ohne den Ausdruck auf Sexualität zu verengen. Das verstärkende Besitzverhältnis wird durch „ihren eigenen“ bewahrt.
- source_word: πορευόμενοι
  choice: folgen
  rationale: Das Partizip beschreibt hier die Lebensführung. „Ihren eigenen Begierden folgen“ gibt die idiomatische Bedeutung im Deutschen klar wieder, auch wenn die wörtliche Bewegungsmetapher nicht beibehalten wird.
theological_decisions:
- issue: Eschatologische Wendung ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: in den letzten Tagen
  alternative: am Ende der Tage
  rationale: Die konventionelle eschatologische Bedeutung wird erhalten, ohne Dauer, Beginn oder genaue heilsgeschichtliche Einordnung der „letzten Tage“ näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Aufforderung ist klar formuliert; die griechische Wortwiederholung bei „Spötter/Spott“ bleibt erkennbar. Die Lebenswandelmetapher von πορευόμενοι wird zugunsten der natürlichen deutschen Verbindung „Begierden folgen“ idiomatisch wiedergegeben.
