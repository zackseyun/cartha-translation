  source_fidelity: 'Die Grundentscheidungen sind überwiegend zutreffend: „Ankunft“, „Tag Gottes“, „Himmel“, „Elemente“ und „schmelzen“ geben den griechischen Text angemessen wieder. Allerdings bezieht sich δι’ ἣν aufgrund des femininen Relativpronomens auf παρουσίαν („Ankunft“), nicht auf ἡμέρας („Tag“). „Um dieses Tages willen“ verfehlt daher den grammatischen Bezug. Außerdem darf zwischen den beiden von προσδοκῶντας und σπεύδοντας abhängigen Teilen kein Satzschluss stehen.'
  naturalness: Der Entwurf ist im Ansatz modernes Standarddeutsch, doch der Punkt nach Fußnote [a] zerreißt die Satzkonstruktion. „Wegen deren“ ist als Rückbezug auf die feminine „Ankunft“ korrekt, aber stilistisch schwerfällig; „wegen der“ ist klar und idiomatisch. „In Flammen stehen“ gibt πυρούμενοι natürlich wieder.
  terminology: Die beabsichtigte Mehrdeutigkeit von σπεύδοντας bleibt mit „beschleunigt“ im Haupttext und der Alternative „sehnlich erwartet“ in der Fußnote erhalten. „Elemente“ bewahrt die umstrittene Bedeutung von στοιχεῖα; die Fußnote stellt die mögliche Deutung als Himmelskörper sachgerecht dar. „Tag Gottes“ ist beizubehalten und nicht durch „Tag des Herrn“ zu ersetzen.
