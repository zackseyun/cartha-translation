id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: de
  text: während ihr die Ankunft des Tages Gottes erwartet und beschleunigt[a], wegen der die Himmel in Flammen stehen und aufgelöst werden und die Elemente im Feuer schmelzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während ihr die Ankunft des Tages Gottes sehnlich erwartet“. Das griechische Verb kann sowohl „beschleunigen“ als auch „eifrig oder sehnlich erwarten“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Mit „Elemente“ können die Grundbestandteile der Welt oder möglicherweise die Himmelskörper gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: erwartet
  rationale: Das Partizip bezeichnet ein fortdauerndes, erwartungsvolles Warten und führt die Ermahnung des vorigen Verses weiter.
- source_word: σπεύδοντας
  choice: beschleunigt
  rationale: Mit dem Akkusativobjekt τὴν παρουσίαν ist die Bedeutung „beschleunigen“ grammatisch naheliegend; die ebenfalls mögliche Bedeutung „sehnlich erwarten“ wird in Fußnote [a] bewahrt.
- source_word: παρουσίαν
  choice: Ankunft
  rationale: Im endzeitlichen Zusammenhang bezeichnet παρουσία das Eintreffen beziehungsweise Kommen; „Ankunft“ passt zudem natürlich zum Verb „beschleunigen“.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: des Tages Gottes
  rationale: Die formnahe Wiedergabe bewahrt die ungewöhnliche Wendung und unterscheidet sie vom geläufigeren „Tag des Herrn“.
- source_word: δι’ ἣν
  choice: Um dieses Tages willen
  rationale: διά mit Akkusativ bezeichnet hier am ehesten den Grund beziehungsweise Anlass; die Formulierung stellt einen klaren Rückbezug auf den Tag Gottes her.
- source_word: οὐρανοὶ
  choice: die Himmel
  rationale: Der griechische Plural wird beibehalten und bezeichnet in diesem kosmischen Zusammenhang die Himmel.
- source_word: πυρούμενοι
  choice: in Brand geraten
  rationale: 'Die Wendung gibt den passiven Sinn des Partizips natürlich wieder: Die Himmel werden dem Feuer ausgesetzt beziehungsweise entzündet.'
- source_word: λυθήσονται
  choice: aufgelöst werden
  rationale: Das Verb bezeichnet hier ein Loslösen oder Zerfallen; „aufgelöst“ vermeidet die stärkere Festlegung auf vollständige Vernichtung.
- source_word: στοιχεῖα
  choice: die Elemente
  rationale: Die breite Wiedergabe bewahrt die mögliche Referenz auf Grundbestandteile der Welt oder Himmelskörper, ohne eine bestimmte Kosmologie festzulegen.
- source_word: καυσούμενα
  choice: in der Glut
  rationale: Die Wendung vermittelt knapp und idiomatisch, dass die Elemente starker Hitze beziehungsweise Feuer ausgesetzt sind.
- source_word: τήκεται
  choice: werden ... schmelzen
  rationale: Der Sinn des durch Hitze bewirkten Schmelzens wird klar wiedergegeben; das Futur entspricht der Zukunftsorientierung des Satzes, obwohl im Griechischen formal Präsens steht.
theological_decisions:
- issue: Bedeutung von σπεύδοντας τὴν παρουσίαν
  choice: die Ankunft ... beschleunigt
  alternative: die Ankunft ... sehnlich erwartet
  rationale: Die Konstruktion erlaubt sowohl ein Beschleunigen der Ankunft als auch ein eifriges Erwarten. Der Haupttext behält die grammatisch direkte transitive Lesart, während Fußnote [a] die theologisch bedeutsame Alternative offenhält.
- issue: Referent von στοιχεῖα
  choice: die Elemente
  alternative: die Himmelskörper
  rationale: Der genaue Bezug des Wortes in diesem endzeitlichen Zusammenhang ist umstritten. Die allgemeinere Wiedergabe vermeidet eine nicht durch den Text erzwungene kosmologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktion wird als anschließender Nebensatz mit „während“ wiedergegeben. Die ungewöhnliche Formulierung „Tag Gottes“ und die beiden wesentlichen Mehrdeutigkeiten des Ausgangstextes bleiben erhalten.
