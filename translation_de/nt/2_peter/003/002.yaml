source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: de
  text: damit ihr euch an die von den heiligen Propheten zuvor gesprochenen Worte und an das euch durch eure Apostel übermittelte Gebot des Herrn und Retters erinnert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an das Gebot eurer Apostel, das vom Herrn und Retter stammt“. Die griechische Genitivverbindung kann unterschiedlich zugeordnet werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνησθῆναι
  choice: damit ihr euch … erinnert
  rationale: Das passive Aoristinfinitiv von μιμνῄσκομαι hat hier aktive Bedeutung und setzt den Zweckgedanken aus Vers 1 fort. Die deutsche Konstruktion mit „damit“ ist im Zusammenhang natürlich.
- source_word: προειρημένων ῥημάτων
  choice: die … im Voraus gesprochenen Worte
  rationale: Die Wiedergabe bewahrt den zeitlichen Sinn von προλέγω, ohne die Worte unnötig auf konkrete Vorhersagen einzuengen.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: von den heiligen Propheten
  rationale: Die Agensangabe und das attributive Adjektiv werden direkt und idiomatisch wiedergegeben.
- source_word: ἐντολῆς
  choice: Gebot
  rationale: „Gebot“ bezeichnet eine verbindliche autoritative Weisung und bewahrt den Singular des griechischen Textes.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: durch eure Apostel übermittelt
  rationale: ὑμῶν wird entsprechend der naheliegenden Wortstellung mit „Apostel“ verbunden. „Durch … übermittelt“ macht ihre vermittelnde Rolle im Deutschen verständlich, ohne sie zur Quelle des Gebots zu erklären.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: des Herrn und Retters
  rationale: Der Genitiv wird an „Gebot“ angeschlossen und bezeichnet dessen Urheber beziehungsweise Zugehörigkeit. Der eine Artikel verbindet beide Titel mit derselben Person.
theological_decisions:
- issue: Bezug von ὑμῶν in τῶν ἀποστόλων ὑμῶν
  choice: „eure“ bestimmt „Apostel“
  alternative: „das euch von den Aposteln gegebene Gebot“
  rationale: Wortstellung und unmittelbare Nachbarschaft sprechen am ehesten dafür, ὑμῶν auf ἀποστόλων zu beziehen. Gemeint sind die mit den Adressaten verbundenen beziehungsweise zu ihnen gesandten Apostel.
- issue: Syntaktischer Bezug von τοῦ κυρίου καὶ σωτῆρος
  choice: „des Herrn und Retters“ bestimmt „Gebot“; die Apostel vermitteln es
  alternative: Die Apostel werden als zum Herrn und Retter gehörig bezeichnet
  rationale: 'Der Anschluss an ἐντολῆς ergibt die sachlich stimmige Abfolge: prophetische Worte und das durch die Apostel vermittelte Gebot, dessen Urheber der Herr und Retter ist. Wegen der möglichen Mehrdeutigkeit der Genitivfolge wird die Alternative in einer Fußnote genannt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Voraus gesprochen“ erhält die zeitliche Aussage, ohne zwingend „vorhergesagt“ zu bedeuten. Die Satzform setzt den Zweckgedanken aus 2 Petrus 3,1 fort.
