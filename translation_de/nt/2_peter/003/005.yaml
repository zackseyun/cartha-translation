id: 2PE.3.5
reference: 2 Peter 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: de
  text: Denn sie wollen bewusst nicht wahrhaben[a], dass es schon vor langer Zeit Himmel gab und dass die Erde[b] durch Gottes Wort[c] aus Wasser und durch Wasser gebildet wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Denn dies entgeht ihnen, weil sie es wollen“; sinngemäß: „Denn sie übersehen dies absichtlich.“ Der griechische Ausdruck verbindet Nichtwahrnehmen mit einer willentlichen Haltung.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht „Erde“ ohne Artikel. Gemeint sein kann die Erde als geschaffener Bereich; eine Wiedergabe mit „eine Erde“ wäre formal möglich, klingt im Deutschen jedoch leicht missverständlich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „durch Gottes Befehl“. Wörtlicher lautet die Wendung „durch das Wort Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Denn sie wollen bewusst nicht wahrhaben
  rationale: Die Formulierung verbindet ein Nichtwahrnehmen bzw. Übersehen mit einer willentlichen Haltung. „Bewusst nicht wahrhaben wollen“ gibt beide Aspekte in natürlichem modernem Deutsch wieder.
- source_word: οὐρανοὶ
  choice: Himmel
  rationale: Der griechische Plural bleibt erhalten. Das artikellose „Himmel“ klingt im Deutschen in dieser Existenzkonstruktion natürlich.
- source_word: ἔκπαλαι
  choice: schon vor langer Zeit
  rationale: Diese Wendung gibt den zeitlichen Rückblick klar und ohne altertümlichen Ton wieder.
- source_word: γῆ
  choice: die Erde
  rationale: Obwohl das griechische Substantiv keinen Artikel trägt, bezeichnet es im Zusammenhang die geschaffene Erde. Im Deutschen ist der bestimmte Artikel idiomatisch; „eine Erde“ würde hier leicht eine Mehrzahl von Erden nahelegen.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: aus Wasser und durch Wasser
  rationale: Die Wiedergabe bewahrt den Unterschied zwischen ἐκ („aus“) und διά („durch“) sowie die auffällige Parallelität des griechischen Ausdrucks.
- source_word: συνεστῶσα
  choice: gebildet wurde
  rationale: Das Partizip beschreibt im Schöpfungszusammenhang die Konstituierung der Erde. „Gebildet wurde“ ist verständlich und lässt die beiden Wasserangaben auf diesen Vorgang bezogen sein.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: durch Gottes Wort
  rationale: Der instrumentale Dativ wird mit „durch“ wiedergegeben. „Gottes Wort“ wahrt die Formulierung des Ausgangstextes, ohne λόγος vorschnell als bloßen Befehl oder ausdrücklich als persönlichen Logos festzulegen.
theological_decisions:
- issue: Ob λόγῳ ausdrücklich als persönlicher Logos oder lediglich als Befehl verstanden werden soll
  choice: durch Gottes Wort
  alternative: durch Gottes Befehl
  rationale: Im Zusammenhang ist Gottes wirksames Schöpfungswort gemeint; der Vers bezeichnet λόγος jedoch nicht ausdrücklich als persönlichen Titel. Die gewählte Formulierung bewahrt diese Offenheit.
- issue: Wie die anarthrische Form γῆ im Deutschen wiederzugeben ist
  choice: die Erde
  alternative: eine Erde
  rationale: Der fehlende griechische Artikel verlangt im Deutschen keinen unbestimmten Artikel. „Die Erde“ ist kontextgemäß und idiomatisch, ohne eine zusätzliche kosmologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung ist gegenüber dem Griechischen leicht gegliedert, damit die beiden Existenz- und Schöpfungsaussagen klar verständlich bleiben. Die ungewöhnliche Unterscheidung „aus Wasser und durch Wasser“ wird bewusst bewahrt.
