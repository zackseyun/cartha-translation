  source_fidelity: Die Übersetzung gibt die willentliche Nichtbeachtung in λανθάνει ... θέλοντας angemessen wieder und bewahrt die Inhaltsangabe mit ὅτι. „Himmel“ entspricht dem griechischen Plural οὐρανοί; „schon vor langer Zeit“ trifft ἔκπαλαι. „Aus Wasser und durch Wasser“ erhält den gezielten Unterschied von ἐξ und διά. „Durch Gottes Wort“ gibt den instrumentalen Dativ τῷ τοῦ θεοῦ λόγῳ treffend wieder, ohne eine christologische Personifikation einzutragen. „Die Erde“ ist trotz des fehlenden griechischen Artikels idiomatisches Deutsch und kontextuell gerechtfertigt.
