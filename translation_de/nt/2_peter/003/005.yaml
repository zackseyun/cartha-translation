  terminology: 'Die zentralen Begriffe sind konsistent und sachgerecht: „Gottes Wort“ wahrt die Offenheit von λόγος, und die bewusst beibehaltene Formulierung „aus Wasser und durch Wasser“ vermeidet eine interpretierende Vereinfachung. Die Fußnoten erläutern die maßgeblichen Alternativen ohne den Haupttext zu überlasten.'
