  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: de
  text: Durch die[a] die damalige Welt, vom Wasser überflutet, zugrunde ging[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „die“ steht im Plural und bezieht sich auf die im vorigen Vers genannten Mittel bzw. Gegebenheiten; der genaue Bezug bleibt offen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurde vernichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Durch diese
  rationale: διά mit dem Genitiv bezeichnet hier Mittel oder Vermittlung. Das pluralische Demonstrativpronomen bewahrt den Rückbezug auf die im vorigen Vers genannten Gegebenheiten, ohne ihn enger festzulegen.
- source_word: ὁ τότε κόσμος
  choice: die damalige Welt
  rationale: Die Formulierung bezeichnet die Welt, wie sie zu jener Zeit bestand, und erhält den zeitlichen Gegensatz zur gegenwärtigen Welt im Kontext.
- source_word: ὕδατι
  choice: vom Wasser
  rationale: Der Dativ bezeichnet das Mittel, durch das die Überflutung geschah. Im Deutschen verbindet sich „vom Wasser überflutet“ natürlich mit dem Passivpartizip.
- source_word: κατακλυσθεὶς
  choice: überflutet
  rationale: Das Partizip bezeichnet das Überwältigtwerden durch eine Flut. Die partizipiale Fügung bleibt erhalten und klingt im modernen Deutsch natürlich.
- source_word: ἀπώλετο
  choice: ging zugrunde
  rationale: Die intransitive Wendung gibt den Untergang der damaligen Welt wieder, ohne eine metaphysische Vernichtung zu behaupten.
theological_decisions:
- issue: Art des Flutgerichts
  choice: ging zugrunde
  alternative: wurde vernichtet
  rationale: Der griechische Ausdruck bezeichnet ein katastrophales Zugrundegehen, verlangt aber nicht die Aussage vollständiger Auslöschung. Die Übersetzung bewahrt Schwere und Offenheit des Textes.
- issue: Bezug von δι’ ὧν
  choice: Durch diese
  alternative: durch welche
  rationale: Der Plural verweist auf zuvor genannte Mittel oder Gegebenheiten; der genaue Bezug bleibt umstritten. Die Übersetzung legt ihn nicht auf nur Gottes Wort oder nur das Wasser fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die damalige Welt“ ist allgemein verständlich; „ging zugrunde“ wahrt die intransitive Aussage. Die knappe Satzstruktur folgt dem griechischen Gedankengang, ohne unnatürlich zu wirken.
