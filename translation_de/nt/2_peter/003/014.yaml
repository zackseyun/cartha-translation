id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: de
  text: 'Darum, ihr Geliebten: Weil ihr dies erwartet, setzt alles daran, dass ihr von ihm[a] in Frieden als makellos und untadelig befunden werdet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor ihm“. Der griechische Dativ kann hier den Handelnden („von ihm“) oder den Bezug beziehungsweise die Gegenwart („vor ihm“) bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Darum
  rationale: Leitet aus der vorausgehenden Erwartung eines neuen Himmels und einer neuen Erde eine Folgerung ab; „Darum“ ist natürlich und prägnant.
- source_word: ἀγαπητοί
  choice: ihr Geliebten
  rationale: Bewahrt die herzliche Anrede und den würdevollen Briefstil; das ergänzte „ihr“ entspricht natürlichem modernem Deutsch.
- source_word: ταῦτα προσδοκῶντες
  choice: Weil ihr dies erwartet
  rationale: Gibt das fortdauernde Erwarten und den wahrscheinlich begründenden Bezug des Partizips zum Imperativ wieder, ohne den Rückverweis näher festzulegen.
- source_word: σπουδάσατε
  choice: setzt alles daran
  rationale: Vermittelt den nachdrücklichen Aufruf zu ernsthaftem Bemühen in geläufigem Gegenwartsdeutsch.
- source_word: ἄσπιλοι
  choice: makellos
  rationale: Bewahrt das Bild des Freiseins von Flecken und eignet sich idiomatisch für sittliche Reinheit.
- source_word: ἀμώμητοι
  choice: untadelig
  rationale: Bezeichnet eine Verfassung, an der kein berechtigter Tadel haftet, und bildet mit „makellos“ ein natürliches Begriffspaar.
- source_word: αὐτῷ
  choice: von ihm
  rationale: Versteht den Dativ als Bezeichnung des Handelnden beim passiven Infinitiv; die ebenfalls mögliche relationale Lesart „vor ihm“ wird in der Fußnote erhalten.
- source_word: εὑρεθῆναι
  choice: befunden werdet
  rationale: Gibt den passiven Infinitiv und den Gedanken einer künftigen Feststellung oder Beurteilung passend wieder.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Bleibt formal nahe am Griechischen und lässt offen, ob vor allem versöhnter Stand, innere Ruhe oder gemeinschaftlicher Friede gemeint ist.
theological_decisions:
- issue: Funktion und Bezug von αὐτῷ im endzeitlichen Zusammenhang
  choice: „von ihm“; der Bezug der Pronomenform bleibt wie im Vers unausgesprochen.
  alternative: „vor ihm“ oder „in seinen Augen“
  rationale: Der Dativ kann bei εὑρεθῆναι den Handelnden oder den Bezug beziehungsweise die Gegenwart bezeichnen. Die Hauptfassung wählt die gut mögliche Agenslesart, während die Fußnote die echte Mehrdeutigkeit bewahrt; weder „Gott“ noch „der Herr“ wird ausdrücklich ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert die Anrede natürlich; „setzt alles daran“ vermeidet altertümliches „befleißigt euch“. Die Stellung von „in Frieden“ vor dem prädikativen Begriffspaar macht es im Deutschen plausibel als Zustandsangabe, ohne seinen genauen Bedeutungsumfang festzulegen.
