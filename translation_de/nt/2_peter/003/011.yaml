  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: de
  text: Da dies alles auf diese Weise aufgelöst wird, was für Menschen müsst ihr dann in heiliger Lebensführung und Gottesfurcht sein,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Die griechischen Ausdrücke für „Lebensführung“ und „Gottesfurcht“ stehen im Plural und können die vielfältigen konkreten Ausdrucksformen eines heiligen, Gott ergebenen Lebens hervorheben.
    reason: grammar
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: dies alles
  rationale: Die Genitivphrase verweist auf die zuvor genannten Bestandteile der gegenwärtigen Schöpfungsordnung. „Dies alles“ ist im Deutschen natürlich und wahrt den Rückbezug.
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Die Wendung gibt die modale Bedeutung des Adverbs wieder, ohne sie auf ein bloß folgerndes „also“ zu reduzieren.
- source_word: λυομένων
  choice: aufgelöst wird
  rationale: Das passive Partizip von λύω bezeichnet hier das Lösen beziehungsweise Zerfallen der gegenwärtigen Ordnung. „Aufgelöst“ bewahrt dieses Bild und deutet es nicht vorschnell als vollständige Vernichtung.
- source_word: ποταποὺς
  choice: was für Menschen
  rationale: ποταπός fragt rhetorisch nach Art und Beschaffenheit der Angesprochenen. Die deutsche Formulierung bewahrt den ethischen Nachdruck.
- source_word: δεῖ
  choice: müsst
  rationale: δεῖ drückt Notwendigkeit aus. Im rhetorisch-mahnenden Zusammenhang gibt „müsst“ diese Kraft im heutigen Deutsch klar wieder.
- source_word: ὑπάρχειν
  choice: sein
  rationale: In der Verbindung mit δεῖ und dem Akkusativ ὑμᾶς ist „sein“ die natürliche deutsche Entsprechung.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: in heiliger Lebensführung
  rationale: ἀναστροφή bezeichnet Verhalten beziehungsweise Lebensweise. Der kollektive Singular ist im Deutschen idiomatisch, während „Lebensführung“ die umfassende ethische Bedeutung erhält.
- source_word: εὐσεβείαις
  choice: Gottesfurcht
  rationale: εὐσέβεια bezeichnet ehrfürchtige, im Leben sichtbare Hingabe an Gott. „Gottesfurcht“ ist eine verständliche und im biblischen Sprachgebrauch verankerte Wiedergabe, ohne bloß äußere Religiosität anzudeuten.
theological_decisions:
- issue: Eschatologisches Geschick der gegenwärtigen Weltordnung
  choice: „aufgelöst wird“
  alternative: „vernichtet wird“
  rationale: Das griechische λύω spricht unmittelbar vom Lösen oder Auflösen. Die Übersetzung bewahrt diese Bildsprache und entscheidet nicht über den Wortlaut hinaus, ob völlige Vernichtung oder tiefgreifende Umgestaltung gemeint ist.
- issue: Rhetorische Funktion von ποταπούς
  choice: „was für Menschen müsst ihr dann sein“
  alternative: „wie müsst ihr euch auszeichnen“
  rationale: Die gewählte Fassung erhält die grammatische Frage nach der Beschaffenheit der Personen. Die alternative exklamative Deutung ist möglich, wird aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird durch einen Gedankenstrich gegliedert und mit einem Ausrufezeichen als eindringliche Mahnung markiert. Die kollektivischen deutschen Singulare vermeiden unnatürliche Abstraktpluralformen, während Fußnote [b] die Form des griechischen Textes dokumentiert.
