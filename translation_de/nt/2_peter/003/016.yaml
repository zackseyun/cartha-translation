id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: de
  text: So spricht er auch in allen seinen Briefen über diese Dinge. In ihnen ist manches schwer zu verstehen, was die Unwissenden[a] und Ungefestigten verdrehen, wie auch die übrigen Schriften[b], zu ihrem eigenen Verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ungelehrten“ beziehungsweise „nicht Unterwiesenen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die anderen Schriften“. Der griechische Ausdruck kann „die übrigen“ oder „die anderen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: Briefen
  rationale: „Briefe“ ist die natürliche moderne Bezeichnung für schriftliche Korrespondenz und gibt den griechischen Ausdruck unmittelbar wieder.
- source_word: λαλῶν
  choice: spricht
  rationale: Das wörtliche „spricht“ bewahrt die Ausdrucksweise des Griechischen; aus dem Zusammenhang ist klar, dass Paulus durch seine Briefe spricht.
- source_word: περὶ τούτων
  choice: über diese Dinge
  rationale: Die Formulierung erhält den demonstrativen Rückbezug auf die zuvor behandelten Themen.
- source_word: δυσνόητά τινα
  choice: manches schwer zu verstehen
  rationale: „Manches“ gibt das indefinite τινα knapp und idiomatisch wieder; „schwer zu verstehen“ entspricht δυσνόητα in verständlichem Gegenwartsdeutsch.
- source_word: ἀμαθεῖς
  choice: Unwissenden
  rationale: Der Ausdruck bezeichnet Menschen, denen Wissen oder Unterweisung fehlt, ohne notwendig formale Ungebildetheit oder Analphabetismus zu behaupten.
- source_word: ἀστήρικτοι
  choice: Ungefestigten
  rationale: „Ungefestigt“ bringt den Gedanken mangelnder Festigkeit oder Standhaftigkeit zum Ausdruck und passt zum neutestamentlichen Gebrauch.
- source_word: στρεβλοῦσιν
  choice: verdrehen
  rationale: „Verdrehen“ bewahrt das anschauliche Bild, etwas gewaltsam aus seiner richtigen Gestalt oder Bedeutung zu bringen.
- source_word: τὰς λοιπὰς γραφὰς
  choice: die übrigen Schriften
  rationale: „Schriften“ entspricht dem im Neuen Testament üblichen Gebrauch von γραφαί für heilige Schriften; „die übrigen“ bewahrt die natürliche Einordnung in dieselbe Vergleichsgruppe.
- source_word: ἀπώλειαν
  choice: Verderben
  rationale: „Verderben“ ist eine würdige, geläufige Wiedergabe für den schwerwiegenden Ausgang, ohne dessen genaue theologische Tragweite weiter festzulegen.
theological_decisions:
- issue: Einordnung der Paulusbriefe durch τὰς λοιπὰς γραφὰς
  choice: „die übrigen Schriften“
  alternative: „die anderen Schriften“ oder generisch „die übrigen Schriften/Werke“
  rationale: Der neutestamentliche Plural γραφαί bezeichnet gewöhnlich die heiligen Schriften. λοιπάς kann „übrig“ oder „andere“ bedeuten; „die übrigen Schriften“ erhält die natürliche Implikation, dass die erwähnten Briefe mit anderen Schriften derselben Kategorie verglichen werden, ohne eine weitergehende Lehrformel hinzuzufügen.
- issue: Tragweite von ἀπώλεια
  choice: „Verderben“
  alternative: „Untergang“ oder „Vernichtung“
  rationale: Die Übersetzung wahrt den ernsten theologischen Ausgang, legt aber nicht genauer fest, ob der Begriff Vernichtung, endgültigen Untergang oder umfassendes Verderben bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, gut verständlichen Sätzen. „Ungefestigten“ erhält den Gedanken fehlender innerer Festigkeit; „Schriften“ wahrt den sachlichen und theologischen Sprachgebrauch des Ausgangstextes.
