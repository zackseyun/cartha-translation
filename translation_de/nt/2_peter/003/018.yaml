id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: de
  text: Wachst aber in der Gnade und Erkenntnis unseres Herrn und Retters Jesus, des Messias.[a] Ihm gebührt die Herrlichkeit jetzt und bis zum Tag der Ewigkeit.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Jesus Christus“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „jetzt und in alle Ewigkeit“. Wörtlicher lautet das Griechische: „jetzt und bis zum Tag der Ewigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: Wachst
  rationale: Der präsentische Imperativ in der zweiten Person Plural fordert zu fortdauerndem Wachstum auf; „Wachst“ ist im Deutschen natürlich und knapp.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet im Zusammenhang einen milden Gegensatz zu den vorangehenden Warnungen.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: in der Gnade und Erkenntnis
  rationale: Die Präposition ἐν bezieht sich auf beide Substantive. Die Formulierung wahrt den Bereich, in dem das Wachstum geschieht, ohne ihn näher auszudeuten.
- source_word: χάριτι
  choice: Gnade
  rationale: Entspricht dem etablierten und hier sachgemäßen neutestamentlichen Sinn.
- source_word: γνώσει
  choice: Erkenntnis
  rationale: Bezeichnet hier die auf Christus bezogene Kenntnis; „Erkenntnis“ ist im biblischen deutschen Sprachgebrauch präzise, ohne sie auf bloße Information zu beschränken.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: unseres Herrn und Retters Jesus, des Messias
  rationale: Der eine Artikel verbindet „Herr“ und „Retter“ mit derselben Person. Χριστός wird als Titel mit „Messias“ wiedergegeben; die Apposition macht dies in natürlichem Deutsch deutlich.
- source_word: αὐτῷ ἡ δόξα
  choice: Ihm gebührt die Herrlichkeit
  rationale: Gibt die Doxologie mit ihrem im Griechischen ergänzten Prädikat würdig und idiomatisch wieder.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: jetzt und bis zum Tag der Ewigkeit
  rationale: Bewahrt die ungewöhnliche ausdrückliche Erwähnung des „Tages“ sowie die zeitliche Zielrichtung von εἰς, statt die Wendung vorschnell zu „für immer“ zu glätten.
- source_word: ἀμήν
  choice: Amen
  rationale: Die herkömmliche Transliteration ist in einer Doxologie verständlich und angemessen.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, der Messias
  alternative: Jesus Christus
  rationale: Χριστός trägt hier Titelfunktion. „Messias“ übersetzt den Titel, während „Christus“ die traditionelle Transliteration darstellt; die Fußnote bewahrt diese geläufige Alternative.
- issue: Bezug von „unseres Herrn und Retters“
  choice: Beide Titel bezeichnen die eine Person Jesus, den Messias
  alternative: Eine weniger eindeutige deutsche Formulierung
  rationale: Der gemeinsame griechische Artikel vor κύριος und σωτήρ weist darauf hin, dass beide Bezeichnungen denselben Referenten haben.
- issue: Zeitliche Doxologie εἰς ἡμέραν αἰῶνος
  choice: bis zum Tag der Ewigkeit
  alternative: in alle Ewigkeit
  rationale: Die Hauptfassung erhält das auffällige Wort ἡμέρα („Tag“) und lässt die genaue Vorstellung der Wendung offen; die geläufigere idiomatische Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Schlusswendung bleibt in der Hauptfassung sichtbar; vertrautere kirchliche Formulierungen werden nicht ohne Kennzeichnung eingesetzt.
