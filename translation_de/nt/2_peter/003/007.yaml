source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: de
  text: Doch die jetzigen Himmel und die Erde sind durch dasselbe Wort aufgespart und für das Feuer bewahrt bis zum Tag des Gerichts und der Vernichtung der gottlosen Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Doch die jetzigen Himmel und die Erde
  rationale: δέ stellt den Gegensatz zur früheren Welt im Kontext her und wird mit „Doch“ wiedergegeben. νῦν bezeichnet die gegenwärtige Schöpfungsordnung. Der Plural οὐρανοί bleibt als „Himmel“ erhalten.
- source_word: τῷ αὐτῷ λόγῳ
  choice: durch dasselbe Wort
  rationale: Der Dativ wird instrumental verstanden. „Dasselbe“ bewahrt den Rückbezug auf Gottes wirksames Wort im vorangehenden Zusammenhang.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: sind … aufgespart
  rationale: Die periphrastische Perfektform bezeichnet einen gegenwärtigen Zustand als Ergebnis einer bereits erfolgten Handlung. „Aufgespart“ wahrt zugleich die Bildsprache des Verbs und unterscheidet sich von τηρούμενοι.
- source_word: πυρὶ τηρούμενοι
  choice: werden für das Feuer bewahrt
  rationale: τηρέω bezeichnet hier das Bewahren beziehungsweise Bereithalten für einen bestimmten Zweck. Der bestimmte Artikel ist im Deutschen bei „für das Feuer“ idiomatisch und legt kein im Griechischen ausdrücklich markiertes Einzelereignis über den Kontext hinaus fest.
- source_word: εἰς ἡμέραν κρίσεως
  choice: bis zum Tag des Gerichts
  rationale: εἰς hat hier eine zeitlich-zielgerichtete Bedeutung. „Bis zum“ bezeichnet verständlich den Endpunkt des Bewahrens.
- source_word: καὶ ἀπωλείας
  choice: und der Vernichtung
  rationale: ἀπώλεια wird im Gerichtskontext klar mit „Vernichtung“ wiedergegeben, ohne die Art oder metaphysische Reichweite näher zu bestimmen.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: der gottlosen Menschen
  rationale: „Gottlos“ gibt ἀσεβής im Sinn fehlender Ehrfurcht vor Gott wieder. „Menschen“ entspricht dem generisch gebrauchten ἀνθρώπων natürlich und geschlechtsübergreifend.
theological_decisions:
- issue: Art des kommenden feurigen Endes
  choice: Der Vers sagt, dass die gegenwärtigen Himmel und die Erde für das Feuer bewahrt werden, und nennt die gottlosen Menschen als Bezugsgröße der Vernichtung.
  alternative: Vollständige kosmische Auslöschung oder reinigende Erneuerung der Schöpfung.
  rationale: Der Wortlaut bekräftigt ein zukünftiges feuriges Gericht, entscheidet in diesem Vers aber nicht ausdrücklich zwischen kosmischer Auslöschung und verwandelnder Erneuerung. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird jedoch durch die koordinierte Form „sind … und werden …“ im Deutschen klar und natürlich lesbar.
