id: 2PE.3.8
reference: 2 Peter 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: de
  text: 'Doch dies eine soll euch nicht entgehen, Geliebte[a]: Beim Herrn ist ein Tag wie tausend Jahre[b][c] und tausend Jahre wie ein Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darüber sollt ihr euch nicht im Unklaren sein, Geliebte.“'
    reason: lexical_alternative
  - marker: b
    text: Anklang an Psalm 90,4.
    reason: cross_reference
  - marker: c
    text: Das Wort „wie“ bezeichnet einen Vergleich; ein Tag und tausend Jahre werden nicht wörtlich gleichgesetzt.
    reason: cultural_note
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: Doch dies eine
  rationale: Die Wiedergabe bewahrt sowohl den Gegensatz beziehungsweise Übergang durch δέ als auch die Hervorhebung eines bestimmten einzelnen Punktes durch Ἓν ... τοῦτο.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: soll euch nicht entgehen
  rationale: Die Formulierung gibt den verneinten Imperativ und den Sinn von λανθάνω als ‚unbemerkt bleiben, der Aufmerksamkeit entgehen‘ natürlich und knapp wieder.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die substantivierte Anrede bewahrt den herzlichen, gemeindlichen Ton des griechischen Vokativs und bleibt in würdigem modernem Deutsch verständlich.
- source_word: παρὰ κυρίῳ
  choice: beim Herrn
  rationale: παρά mit Dativ bezeichnet hier die Perspektive beziehungsweise Gegenwart des Herrn. ‚Beim Herrn‘ ist prägnant und lässt diese Bedeutungsbreite offen.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: ein Tag wie tausend Jahre
  rationale: ὡς kennzeichnet einen Vergleich, keine mathematische Gleichsetzung. Die deutsche Formulierung erhält die knappe Vergleichsstruktur.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: und tausend Jahre wie ein Tag
  rationale: Die spiegelbildliche, im Griechischen verblose zweite Hälfte wird im Deutschen ebenso knapp und ausgewogen wiedergegeben.
- source_word: χίλια ἔτη
  choice: tausend Jahre
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe der Kardinalzahl, ohne symbolische Deutung in den Text einzutragen.
theological_decisions:
- issue: Art des zeitlichen Vergleichs
  choice: Die Aussage wird als Vergleich über das Verhältnis des Herrn zur Zeit wiedergegeben.
  alternative: Ein Tag wird wörtlich mit tausend Jahren gleichgesetzt oder als prophetischer Umrechnungsschlüssel verstanden.
  rationale: Das zweimalige ὡς (‚wie‘) bezeichnet ausdrücklich eine Analogie. Die Übersetzung bewahrt den Vergleich, ohne ein eschatologisches Berechnungsschema einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Geliebte“ erhält den warmen gemeindlichen Ton; die ausgewogene Satzform bewahrt den rhetorischen Parallelismus des griechischen Textes.
