  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Satzes angemessen wieder: δέ mit „Doch“, die hervorgehobene Einheit Ἓν ... τοῦτο mit „dies eine“, den verneinten Imperativ μὴ λανθανέτω ὑμᾶς mit „soll euch nicht entgehen“, die Anrede ἀγαπητοί sowie beide parallelen χρονologischen Vergleiche. „Beim Herrn“ ist für παρὰ κυρίῳ möglich und bewahrt die offene Nähe- bzw. Perspektivbedeutung. Das zweimalige „wie“ erhält den ausdrücklich vergleichenden Charakter von ὡς.'
