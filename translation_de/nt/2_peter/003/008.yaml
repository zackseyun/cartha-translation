  terminology: „Geliebte“ trifft den warmen, gemeindlichen Ton der Anrede, ohne ihn umgangssprachlich abzuschwächen. „Herr“ ist als Wiedergabe von κύριος konsistent. Die Fußnoten unterscheiden zutreffend zwischen Psalmanklang und der Erklärung, dass „wie“ keine Gleichsetzung ausdrückt; die Marker sind korrekt an den jeweiligen Ankern gesetzt.
