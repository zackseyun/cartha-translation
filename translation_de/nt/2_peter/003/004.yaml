reference: 2 Peter 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: de
  text: 'und sagen: »Wo ist die Verheißung seiner Ankunft[a]? Denn seit die Väter entschlafen sind[b], bleibt alles so, wie es von Anfang der Schöpfung an gewesen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »Gegenwart«, »Anwesenheit« oder »Kommen« bedeuten. Hier bezeichnet es die erwartete künftige Wiederkunft Christi.
    reason: lexical_alternative
  - marker: b
    text: »Entschlafen« ist hier eine beschönigende Redeweise für »sterben«.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: und sagen
  rationale: Das Präsenspartizip wird im Deutschen idiomatisch als koordinierter finiter Ausdruck wiedergegeben und schließt an die Beschreibung der Spötter im vorherigen Vers an.
- source_word: ἐπαγγελία τῆς παρουσίας αὐτοῦ
  choice: seine verheißene Ankunft
  rationale: Der Genitiv bezeichnet die zugesagte Ankunft. Diese natürliche deutsche Formulierung vermeidet das missverständliche »Verheißung seiner Ankunft«, ohne den Inhalt der Zusage zu verändern.
- source_word: παρουσίας
  choice: Ankunft
  rationale: παρουσία kann Gegenwart, Anwesenheit oder Ankunft bezeichnen; im eschatologischen Zusammenhang steht die erwartete künftige Ankunft Christi im Vordergrund.
- source_word: ἀφ’ ἧς
  choice: seit
  rationale: Die Wendung bezeichnet den vergangenen Zeitpunkt, von dem an der behauptete Zustand fortbesteht.
- source_word: οἱ πατέρες
  choice: die Väter
  rationale: Bewahrt die bestimmte, aber nicht ausdrücklich possessive Form des Griechischen und lässt offen, welche frühere Generation genau gemeint ist.
- source_word: ἐκοιμήθησαν
  choice: entschlafen sind
  rationale: Bewahrt den im Griechischen üblichen Euphemismus für das Sterben in einer verständlichen, würdevollen deutschen Form.
- source_word: πάντα οὕτως διαμένει
  choice: bleibt doch alles so
  rationale: Gibt die umfassende Behauptung der Spötter idiomatisch wieder; »doch« trägt im Fragesatz den begründenden und herausfordernden Ton von γάρ mit.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: seit dem Anfang der Schöpfung
  rationale: Eine klare und quellennah formulierte Wiedergabe des zeitlichen Ausgangspunkts.
theological_decisions:
- issue: Bedeutung von παρουσία im endzeitlichen Zusammenhang
  choice: seine verheißene Ankunft
  alternative: die Verheißung seiner Gegenwart / seines Kommens
  rationale: Der Kontext handelt von der verspotteten Erwartung der künftigen Wiederkunft Christi. »Ankunft« gibt die dynamische Bedeutung wieder, während die Fußnote die echte lexikalische Breite festhält.
- issue: Todesmetapher ἐκοιμήθησαν
  choice: entschlafen sind
  alternative: gestorben sind
  rationale: Die griechische Metapher wird bewahrt, ohne daraus über den euphemistischen Sprachgebrauch hinaus eine besondere Lehraussage abzuleiten.
- issue: Identität der »Väter«
  choice: die Väter
  alternative: die Vorfahren / unsere Väter
  rationale: Da der griechische Text kein Possessivpronomen enthält und der genaue Bezug diskutiert werden kann, bleibt die formal offene Bezeichnung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt bewusst spöttisch und herausfordernd. »Wo bleibt …?« ist im Deutschen die natürliche Entsprechung der rhetorischen Frage nach dem Ausbleiben der Zusage. Beide Fußnotenmarker stehen unmittelbar bei den erklärungsbedürftigen Ausdrücken.
