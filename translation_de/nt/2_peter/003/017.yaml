source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: de
  text: Ihr also, Geliebte, die ihr dies im Voraus wisst, seid auf der Hut, damit ihr nicht durch den Irrtum der Gesetzlosen mitgerissen werdet und dadurch euren eigenen festen Stand verliert[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »aus eurem eigenen festen Stand fallt«. Das griechische ἐκπίπτω bedeutet »herausfallen« oder »von etwas fallen«; die Übersetzung »verliert« gibt das Bild in natürlichem Deutsch wieder.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »eure eigene Standfestigkeit«. Das griechische στηριγμός kann Festigkeit, sicheren Stand oder Standhaftigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Ihr nun … deshalb
  rationale: Das ausdrückliche »ihr« bewahrt die betonte Anrede; »deshalb« gibt den folgernden Sinn von οὖν in natürlichem Deutsch wieder.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Bewahrt die herzliche pastorale Anrede und den würdevollen Briefstil, ohne eine bestimmte Beziehung wie Freundschaft oder Geschwisterschaft hinzuzufügen.
- source_word: προγινώσκοντες
  choice: wisst dies im Voraus
  rationale: Gibt die vorausgehende Kenntnis beziehungsweise Vorwarnung wieder; »dies« wird aus dem Zusammenhang ergänzt.
- source_word: φυλάσσεσθε
  choice: Seid … auf der Hut
  rationale: Eine natürliche deutsche Wiedergabe des präsentischen medialen Imperativs, der fortdauernde persönliche Wachsamkeit fordert.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: vom Irrtum der Gesetzlosen
  rationale: »Irrtum« erfasst πλάνη als irreführende Abweichung; »Gesetzlose« bewahrt bei ἀθέσμων den Gedanken der Missachtung verbindlicher Normen.
- source_word: συναπαχθέντες
  choice: mitgerissen werdet
  rationale: Bewahrt die passive Bedeutung sowie den Gedanken, zusammen mit anderen fortgezogen zu werden.
- source_word: ἐκπέσητε
  choice: verliert
  rationale: Im Deutschen verbindet sich das wörtliche Bild des Herausfallens nur schwer natürlich mit στηριγμός. »Verliert« gibt den drohenden Verlust des festen Standes wieder, ohne ihn ausdrücklich als Abfall vom Heil zu bestimmen.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: euren eigenen festen Stand
  rationale: »Fester Stand« gibt Festigkeit und sichere Stellung idiomatisch wieder; »eigenen« bewahrt die Betonung durch ἰδίου.
theological_decisions:
- issue: Ob ἐκπέσητε den Verlust des Heils beziehungsweise einen Glaubensabfall bezeichnet
  choice: euren eigenen festen Stand verliert
  alternative: von eurer eigenen Standfestigkeit abfallt
  rationale: Die Formulierung erhält die ernste Warnung vor dem Verlust einer gefestigten Stellung, legt aber nicht fest, ob damit endgültiger Glaubensabfall oder ein allgemeineres Abkommen von der Festigkeit gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede »Geliebte« wahrt den Briefstil; »Seid auf der Hut« ist gegenwärtig und allgemein verständlich. Die Satzteilung verhindert eine schwerfällige Partizipialkonstruktion, ohne den Gedankengang zu verändern.
