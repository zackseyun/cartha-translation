id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: de
  text: Doch seiner Verheißung gemäß erwarten wir neue Himmel und eine neue Erde, in denen Gerechtigkeit wohnt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: neue Himmel und eine neue Erde
  rationale: καινός bezeichnet hier Neues in Art oder Beschaffenheit. Die Wiedergabe bewahrt sowohl den Plural οὐρανούς als auch die kosmische Sprache und vermeidet die weitergehende Deutung „erneuerte Himmel“.
- source_word: δὲ
  choice: Doch
  rationale: δέ setzt die Erwartung der neuen Schöpfung in einen milden Gegensatz zur zuvor beschriebenen Auflösung der gegenwärtigen Welt.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: seiner Verheißung gemäß
  rationale: κατά mit Akkusativ drückt Übereinstimmung oder Maßgabe aus; ἐπάγγελμα bezeichnet eine verbindliche Verheißung.
- source_word: προσδοκῶμεν
  choice: erwarten wir
  rationale: Das Präsens bezeichnet eine fortdauernde, auf die Zukunft gerichtete Erwartung. „Erwarten“ ist im Deutschen natürlich und umfasst sowohl Warten als auch hoffnungsvolle Erwartung.
- source_word: ἐν οἷς
  choice: in denen
  rationale: Das plurale Relativpronomen bezieht sich auf die zusammengehörige neue Wirklichkeit aus Himmeln und Erde; „in denen“ bewahrt die grammatische Zahl des Griechischen.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ umfasst im Deutschen sowohl rechtes Sein und Handeln vor Gott als auch gerechte Verhältnisse und bewahrt damit die Bedeutungsbreite des griechischen Ausdrucks ohne künstliche Aufspaltung.
- source_word: κατοικεῖ
  choice: wohnt
  rationale: κατοικέω bezeichnet dauerhaftes Wohnen oder Ansässigsein. „Wohnt“ ist knapp, würdig und erhält die personifizierende Ausdrucksweise.
theological_decisions:
- issue: Bedeutungsbreite von δικαιοσύνη im eschatologischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; gerechte Ordnung
  rationale: Das deutsche „Gerechtigkeit“ kann sowohl die Gott entsprechende Rechtschaffenheit als auch das gerechte Gepräge der neuen Schöpfung bezeichnen. Dadurch bleibt die theologische Spannung des Ausgangstextes erhalten, ohne sie auf eine ausschließlich persönliche oder gesellschaftliche Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Pluralform „neue Himmel“ folgt bewusst dem griechischen Text; die Stellung „seiner Verheißung gemäß“ ist gehoben, aber weiterhin allgemein verständlich.
