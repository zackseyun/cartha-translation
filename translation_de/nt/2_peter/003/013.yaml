review_pass:
  verdict: approve
  source_fidelity: 'Der Entwurf gibt alle maßgeblichen Elemente des griechischen Textes zutreffend wieder: den leichten Kontrast von δέ („Doch“), die Ausrichtung an Gottes Verheißung, die fortdauernde Erwartung, den Plural „neue Himmel“, „eine neue Erde“ sowie das dauerhafte Wohnen der δικαιοσύνη. „In denen“ bewahrt die Pluralform von ἐν οἷς und ist im Deutschen auf die gemeinsam genannte neue kosmische Wirklichkeit verständlich bezogen.'
  naturalness: „Doch seiner Verheißung gemäß erwarten wir neue Himmel und eine neue Erde, in denen Gerechtigkeit wohnt“ ist modernes, würdiges und flüssiges Standarddeutsch. Die leicht gehobene Stellung „seiner Verheißung gemäß“ passt zum Register und bleibt klar.
  terminology: „Neue Himmel und eine neue Erde“ erhält die biblisch-kosmische Ausdrucksweise, ohne „καινός“ durch „erneuert“ vorzuinterpretieren. „Gerechtigkeit“ ist eine angemessene, breit genug gehaltene Wiedergabe von δικαιοσύνη; sie erzwingt weder eine ausschließlich individuelle noch eine ausschließlich gesellschaftlich-rechtliche Deutung. „Wohnt“ trifft κατοικεῖ prägnant und mit dem Aspekt bleibender Gegenwart.
