source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: de
  text: Ihr Lieben, dies ist nun schon der zweite Brief, den ich euch schreibe. In beiden Briefen rufe ich durch Erinnerung eure lautere Gesinnung wach,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euer reines Denken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ihr Lieben
  rationale: Die Anrede bewahrt den herzlichen und zugleich würdevollen Ton; im modernen Standarddeutsch klingt sie natürlicher als das substantivierte „Geliebte“.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: dies ist nun schon der zweite Brief
  rationale: Die deutsche Satzstellung gibt die Identifizierung des gegenwärtigen Schreibens als zweiten Brief natürlich wieder; „nun schon“ bildet ἤδη idiomatisch ab.
- source_word: γράφω
  choice: den ich euch schreibe
  rationale: Das Präsens bezeichnet den gegenwärtigen Schreibvorgang und wird im Deutschen unverändert natürlich ausgedrückt.
- source_word: ἐν αἷς
  choice: In beiden
  rationale: Das feminine Pluralpronomen bezieht sich grammatisch am ehesten auf die beiden Briefe; „in beiden“ macht diesen Bezug knapp und eindeutig.
- source_word: διεγείρω
  choice: wecke ich
  rationale: Das Verb bezeichnet ein Aufwecken beziehungsweise Wachrufen und passt bildlich zum erneuten Aktivieren des Denkens.
- source_word: ἐν ὑπομνήσει
  choice: durch Erinnerung
  rationale: Die Wendung gibt das Mittel des Wachrufens wieder, ohne den griechischen Ausdruck unnötig auszubauen.
- source_word: εἰλικρινῆ διάνοιαν
  choice: euer aufrichtiges Denken
  rationale: „Denken“ bildet διάνοια als Denkvermögen beziehungsweise Denkweise verständlich ab; „aufrichtig“ wahrt die moralische und intellektuelle Integrität von εἰλικρινής, während die mögliche Nuance „rein“ in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bezug des pluralischen Relativpronomens ἐν αἷς
  choice: Es bezieht sich auf beide Briefe an die Empfänger.
  alternative: Bezug nur auf den vorliegenden Brief bei lockerem pluralischem Sprachgebrauch.
  rationale: Genus und Numerus weisen am natürlichsten auf die zwei genannten beziehungsweise vorausgesetzten Briefe zurück. Die Übersetzung macht diesen grammatischen Bezug sichtbar, ohne darüber hinausgehende Aussagen über den ersten Brief festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und würdiges Standarddeutsch. Die herzliche Anrede ist gegenwärtig formuliert; Satzbau und Wortwahl bleiben nahe an der griechischen Bildsprache, ohne hölzern zu wirken.
