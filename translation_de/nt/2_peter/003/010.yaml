id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: de
  text: Doch der Tag des Herrn wird kommen wie ein Dieb, an dem die Himmel mit Getöse vergehen werden, die Elemente[a] im Feuer aufgelöst werden und die Erde und die Werke auf ihr gefunden werden.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Himmelskörper“. Das griechische Wort kann in diesem Zusammenhang auch die Bestandteile des Kosmos bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Manche verstehen „werden gefunden werden“ im Sinn von „werden bloßgelegt“ oder „werden aufgedeckt“.
    reason: alternative_reading
  - marker: c
    text: Viele Handschriften haben statt „werden gefunden werden“ eine Lesart mit dem Sinn „wird verbrannt werden“.
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: wird kommen
  rationale: Das Futur von ἥκω bezeichnet hier das Kommen bzw. Eintreffen; „wird kommen“ ist im eschatologischen Zusammenhang natürlich und präzise.
- source_word: ἡμέρα κυρίου
  choice: der Tag des Herrn
  rationale: Die feste prophetisch-eschatologische Wendung wird bewahrt und nicht als Bezeichnung eines wöchentlichen Gottesdiensttages verstanden.
- source_word: κλέπτης
  choice: ein Dieb
  rationale: Das Bild betont das unerwartete Kommen; „Dieb“ ist die geläufige und sachlich passende Wiedergabe.
- source_word: ἐν ᾗ
  choice: An diesem Tag
  rationale: Die deutsche Form nimmt den zuvor genannten Tag eindeutig auf und gibt den zeitlichen Zusammenhang idiomatisch wieder.
- source_word: οἱ οὐρανοὶ
  choice: die Himmel
  rationale: Der griechische Plural bleibt im kosmischen Gerichtszusammenhang erhalten.
- source_word: ῥοιζηδόν
  choice: mit Getöse
  rationale: Das seltene Adverb bezeichnet ein sausendes, rauschendes oder dröhnendes Geräusch; „mit Getöse“ ist anschaulich, würdig und legt die genaue Geräuschart nicht unnötig fest.
- source_word: παρελεύσονται
  choice: werden vergehen
  rationale: παρέρχομαι hat hier im eschatologischen Zusammenhang den Sinn „vergehen“ und bewahrt zugleich den biblischen Sprachklang.
- source_word: στοιχεῖα
  choice: die Elemente
  rationale: Der Ausdruck kann die Bestandteile des Kosmos oder genauer die Himmelskörper bezeichnen. „Elemente“ hält die Referenz bewusst offen.
- source_word: καυσούμενα
  choice: brennend
  rationale: Die partizipiale Form beschreibt den mit der Auflösung einhergehenden Brandvorgang, ohne ausdrücklich einen Handelnden einzuführen.
- source_word: λυθήσεται
  choice: werden aufgelöst werden
  rationale: λύω bezeichnet hier ein Lösen bzw. Zerfallenlassen; „aufgelöst“ bildet die kosmische Desintegration genauer ab als das allgemeinere „vernichtet“.
- source_word: γῆ
  choice: die Erde
  rationale: Der Zusammenhang mit Himmeln und Elementen verlangt die kosmische Bedeutung „Erde“, nicht das örtlich begrenzte „Land“.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: die Werke auf ihr
  rationale: Die knappe Form bleibt nahe am Griechischen und lässt offen, ob vor allem menschliche Taten, Hervorgebrachtes oder beides im Blick ist.
- source_word: εὑρεθήσεται
  choice: werden gefunden werden
  rationale: Die überlieferte Form bedeutet unmittelbar „wird gefunden werden“. Die bewusst schwierige Aussage wird nicht durch eine deutende Glättung ersetzt.
theological_decisions:
- issue: Bedeutung der Schlussaussage καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: Die schwierige Lesart „die Erde und die Werke auf ihr werden gefunden werden“ bleibt im Haupttext erhalten.
  alternative: '„werden bloßgelegt/aufgedeckt werden“; nach einer Textvariante: „werden verbrennen/verbrannt werden“'
  rationale: εὑρεθήσεται bedeutet am unmittelbarsten „wird gefunden werden“. Da sowohl die Deutung als auch die Textüberlieferung umstritten sind, darf die Übersetzung die Spannung nicht stillschweigend zugunsten einer bestimmten Endzeitlehre auflösen.
- issue: Referenz von στοιχεῖα
  choice: „Elemente“ ohne nähere kosmologische Festlegung
  alternative: „Himmelskörper“; „Grundbestandteile des Kosmos“
  rationale: Der Kontext erlaubt mehrere sachliche Bestimmungen. Die allgemeinere Wiedergabe bewahrt die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an die griechische Bildsprache. „Mit Getöse“ ist verständlich und gewichtig; „brennend aufgelöst“ wahrt den partizipialen Zusammenhang. Die schwierige Schlussklausel bleibt absichtlich ungeglättet, während Fußnoten die wesentlichen lexikalischen, interpretativen und textkritischen Alternativen transparent machen.
