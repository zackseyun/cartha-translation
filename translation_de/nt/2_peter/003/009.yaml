source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: de
  text: Der Herr ist nicht säumig, was die Verheißung betrifft, wie manche es für Säumigkeit halten, sondern hat Geduld mit euch[a][b], weil er nicht will, dass irgendjemand verloren geht, sondern dass alle zur Umkehr gelangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „sondern ist euch gegenüber geduldig“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text lässt den Bezugsumfang von „euch“, „irgendjemand“ und „alle“ offen. Gemeint sein können insbesondere die angesprochenen Leser oder, weiter gefasst, alle Menschen.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ βραδύνει κύριος τῆς ἐπαγγελίας
  choice: Der Herr zögert die Erfüllung der Verheißung nicht hinaus
  rationale: Das Verb bezeichnet Verzögerung oder Langsamkeit. Im Deutschen benötigt die Genitivverbindung eine idiomatische Ergänzung; „die Erfüllung“ macht den sachlich vorausgesetzten Bezug verständlich, ohne den Inhalt der Verheißung näher festzulegen.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: wie manche es für ein Zögern halten
  rationale: Die Formulierung gibt ἡγέομαι als „für etwas halten“ wieder und bewahrt durch „zögern/Zögern“ die Wortwiederholung des Griechischen.
- source_word: μακροθυμεῖ εἰς ὑμᾶς
  choice: er hat Geduld mit euch
  rationale: μακροθυμέω bezeichnet lang anhaltende Geduld und Zurückhaltung. „Geduld mit euch haben“ ist im modernen Deutschen natürlicher als das räumlich nähere „euch gegenüber geduldig sein“.
- source_word: μὴ βουλόμενός
  choice: Er will nicht
  rationale: βούλομαι drückt Wollen beziehungsweise Begehren aus. Die Wiedergabe vermeidet eine technische Festlegung auf spätere Kategorien des göttlichen Willens.
- source_word: τινας ἀπολέσθαι
  choice: dass irgendwelche verloren gehen
  rationale: Das unbestimmte τινας bleibt bewusst ohne ergänzendes Bezugswort wiedergegeben. ἀπόλλυμαι bedeutet hier „verloren gehen/umkommen“; „verloren gehen“ bewahrt den heilsgeschichtlichen Ernst ohne eine äußerlich verursachte Vernichtung zu behaupten.
- source_word: πάντας εἰς μετάνοιαν χωρῆσαι
  choice: dass alle zur Umkehr gelangen
  rationale: μετάνοια wird mit dem etablierten, verständlichen „Umkehr“ wiedergegeben; χωρέω bezeichnet hier das Gelangen in einen Zustand. „Zur Umkehr gelangen“ wahrt diese Bewegungsnuance.
theological_decisions:
- issue: Bezugsweite von „euch“, „irgendwelche“ und „alle“
  choice: Die unbestimmte und umfassende Ausdrucksweise des Griechischen bleibt ohne Einschränkung stehen.
  alternative: „Irgendwelche von euch“ beziehungsweise „alle Menschen“ ausdrücklich ergänzen.
  rationale: Der griechische Text bestimmt nicht ausdrücklich, ob τινας und πάντας allein auf die angesprochenen Leser oder weiter auf die Menschheit bezogen sind. Die Übersetzung entscheidet diese theologische Streitfrage nicht.
- issue: Aussagekraft von βουλόμενος für Gottes Willen
  choice: „Er will nicht“
  alternative: „Er hat nicht beschlossen“ oder „Er wünscht nicht“
  rationale: „Will“ gibt die Volition klar wieder, ohne sie entweder zu einem technischen Dekret zu verstärken oder zu einem bloßen Wunsch abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Wiederholung von βραδύνει/βραδύτητα wird durch „zögert/Zögern“ erhalten. Kurze Hauptsätze machen den Gegensatz zwischen vermeintlicher Verzögerung und göttlicher Geduld gut erfassbar.
