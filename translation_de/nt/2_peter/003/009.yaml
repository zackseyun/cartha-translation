revisions:
- from: Der Herr zögert die Erfüllung der Verheißung nicht hinaus, wie manche es für ein Zögern halten, sondern er hat Geduld mit euch[a]. Er will nicht, dass irgendwelche verloren gehen, sondern dass alle zur Umkehr gelangen.[b]
  to: Der Herr ist nicht säumig, was die Verheißung betrifft, wie manche es für Säumigkeit halten, sondern hat Geduld mit euch[a][b], weil er nicht will, dass irgendjemand verloren geht, sondern dass alle zur Umkehr gelangen.
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Wortlaut enthaltene Ergänzung „Erfüllung“, ersetzt das im Deutschen unnatürliche „irgendwelche“ und positioniert die Anmerkung zur umstrittenen Bezugsweite an ihrem sachlichen Bezugspunkt. Die Aussage bleibt in ihrer theologischen Reichweite bewusst offen.
