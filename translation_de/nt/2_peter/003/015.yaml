id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: de
  text: Und betrachtet die Geduld unseres Herrn als Rettung[a], so wie auch unser geliebter Bruder Paulus euch nach der ihm gegebenen Weisheit[b] geschrieben hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Langmut“. Gemeint ist, dass der Herr das Gericht aus rettender Absicht aufschiebt, nicht aus Gleichgültigkeit.'
    reason: lexical_alternative
  - marker: b
    text: Mit der „ihm gegebenen Weisheit“ ist wahrscheinlich von Gott gegebene Weisheit gemeint; im Griechischen bleibt der Geber jedoch ungenannt.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: Geduld
  rationale: Das Substantiv bezeichnet geduldiges Zurückhalten, besonders den Aufschub des Gerichts. „Geduld“ ist im heutigen Deutsch natürlich und passt zum Zusammenhang der verzögerten Wiederkunft.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: Im endzeitlichen Zusammenhang bezeichnet das Wort Gottes rettendes Handeln; „Rettung“ bewahrt die direkte prädikative Aussage und ist allgemein verständlich.
- source_word: ἡγεῖσθε
  choice: betrachtet ... als
  rationale: Der Imperativ fordert dazu auf, etwas in einer bestimmten Weise einzuschätzen. „Betrachtet ... als“ gibt die Konstruktion mit dem prädikativen Akkusativ klar wieder.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: „Herr“ bewahrt den Titel und seine theologische Bedeutung; im Kontext ist Jesus gemeint.
- source_word: ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς
  choice: unser geliebter Bruder
  rationale: Die Formulierung erhält sowohl die herzliche Wertschätzung als auch die geschwisterliche Bezeichnung des Paulus.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: nach der ihm gegebenen Weisheit
  rationale: „Nach“ drückt hier die Übereinstimmung mit der verliehenen Weisheit aus. Das Passiv bleibt erhalten, ohne den nicht ausdrücklich genannten Geber einzusetzen.
- source_word: ἔγραψεν ὑμῖν
  choice: euch ... geschrieben hat
  rationale: Das deutsche Perfekt verweist natürlich auf den für die Leser weiterhin maßgeblichen Brief, ohne den Sinn des griechischen Aorists zu verändern.
- source_word: καθὼς καὶ
  choice: so wie auch
  rationale: Die Wendung bewahrt sowohl den Vergleich als auch den hinzufügenden Akzent.
theological_decisions:
- issue: Urheber der Paulus gegebenen Weisheit
  choice: Das Passiv „ihm gegeben“ bleibt stehen, ohne „von Gott“ im Haupttext zu ergänzen.
  alternative: „nach der Weisheit, die Gott ihm gegeben hat“
  rationale: Göttliche Urheberschaft ist wahrscheinlich vorausgesetzt, doch der griechische Text nennt den Handelnden nicht ausdrücklich.
- issue: Sinn der verzögerten Handlung des Herrn
  choice: „Geduld ... als Rettung“
  alternative: „Langmut ... als Gelegenheit zur Rettung“
  rationale: Die Übersetzung erhält die zugespitzte Gleichsetzung des griechischen Textes, statt sie erklärend auf eine bloße Gelegenheit zur Umkehr zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aussage „als Rettung“ und das unpersönliche Passiv „ihm gegeben“ bewahren die theologische Spannung und die Zurückhaltung des Ausgangstextes.
