  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: de
  text: und den gerechten Lot rettete, der durch den ausschweifenden Lebenswandel der Gesetzlosen schwer bedrängt wurde[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der durch den ausschweifenden Lebenswandel der Gesetzlosen geplagt wurde« oder »der unter dem ausschweifenden Lebenswandel der Gesetzlosen litt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Einfaches Bindewort, das die Satzfolge aus dem vorhergehenden Vers fortsetzt.
- source_word: δίκαιον Λὼτ
  choice: den gerechten Lot
  rationale: Bewahrt die ausdrückliche positive Beurteilung Lots und die syntaktische Einbindung als Objekt von »rettete«.
- source_word: καταπονούμενον
  choice: der ... litt
  rationale: Gibt den anhaltenden, durch fremdes Verhalten verursachten schweren Druck in natürlichem Deutsch wieder; stärkere Alternativen werden in der Fußnote genannt.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: unter dem ... Lebenswandel
  rationale: »Unter ... leiden« bezeichnet idiomatisch die Ursache der Belastung; »Lebenswandel« erfasst das gewohnheitsmäßige Verhalten von ἀναστροφή.
- source_word: τῶν ἀθέσμων
  choice: der Gesetzlosen
  rationale: Bewahrt die moralisch-rechtliche Nuance von Menschen, die sich über das Gebotene hinwegsetzen.
- source_word: ἐν ἀσελγείᾳ
  choice: ausschweifenden
  rationale: Bezeichnet schamlose moralische und häufig sexuelle Zügellosigkeit, ohne den Begriff unnötig auf einen einzigen Bereich zu verengen.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Gibt die vollzogene Befreiung aus Gefahr klar und unmittelbar wieder.
theological_decisions:
- issue: Lots moralische Bezeichnung im Verhältnis zum Genesisbericht
  choice: »den gerechten Lot« ohne Abschwächung oder Einschränkung
  alternative: Die Wertung neutralisieren oder wegen problematischer Handlungen Lots erläuternd relativieren
  rationale: Der griechische Text bezeichnet Lot ausdrücklich als δίκαιος. Diese Spannung zum Genesisbericht bleibt bestehen und wird nicht harmonisierend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Lebenswandel« ist leicht gehoben, aber geläufig und bildet die habituelle Bedeutung von ἀναστροφή genauer ab als das allgemeinere »Verhalten«. Der Gedankenstrich wahrt den syntaktischen Anschluss an den folgenden Vers.
