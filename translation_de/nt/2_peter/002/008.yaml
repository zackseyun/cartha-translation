  terminology: „Gerechte“, „gerechte Seele“ und „gesetzlose Taten“ sind sachgerecht und bewahren die Wiederholung sowie den rechtlich-moralischen Akzent des Griechischen. „Seele“ wird nicht über eine anthropologische Aussage hinaus festgelegt. Die Fußnoten sind korrekt verankert und erläutern die alternative syntaktische Auffassung, ohne sie als zwingend auszugeben.
