source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: de
  text: Denn durch das, was er sah und hörte,[a] quälte dieser Gerechte, der unter ihnen wohnte, Tag für Tag[b] seine gerechte Seele mit ihren gesetzlosen Taten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Denn während dieser Gerechte unter ihnen wohnte, quälte er sich durch die gesetzlosen Taten, die er sah und hörte, Tag für Tag in seiner gerechten Seele.“ Die griechische Wortstellung nennt „durch Sehen und Hören“ am Anfang und „mit gesetzlosen Taten“ später; ihr genaues syntaktisches Verhältnis ist daher nicht völlig eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „von Tag zu Tag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι … καὶ ἀκοῇ
  choice: durch das, was er sah und hörte
  rationale: Die beiden Dative bezeichnen Wahrnehmung beziehungsweise das Mittel oder den Anlass der Qual. Die konkrete Wiedergabe ist im heutigen Deutsch natürlicher als „durch Sehen und Hören“.
- source_word: ὁ δίκαιος
  choice: dieser Gerechte
  rationale: Das substantivierte Adjektiv verweist auf Lot im vorhergehenden Vers. „Dieser“ macht den Rückbezug deutlich, ohne „Mann“ ausdrücklich in den griechischen Text einzutragen.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: der unter ihnen wohnte
  rationale: Das Partizip beschreibt Lots andauernden Aufenthalt in ihrer Mitte. Ein Relativsatz klingt im Deutschen natürlich und bewahrt den Begleitumstand.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: Tag für Tag
  rationale: Die Wendung bezeichnet eine fortgesetzte, wiederkehrende Handlung und wird idiomatisch wiedergegeben.
- source_word: ψυχὴν δικαίαν
  choice: seine gerechte Seele
  rationale: „Seele“ gibt ψυχή unmittelbar wieder und bezeichnet hier Lots inneres Leben beziehungsweise seine Person, ohne eine bestimmte anthropologische Theorie festzulegen. Das Possessivpronomen ergibt sich aus dem Bezug auf das Subjekt.
- source_word: ἀνόμοις ἔργοις
  choice: mit ihren gesetzlosen Taten
  rationale: Der Dativ bezeichnet wahrscheinlich Mittel oder Ursache. „Gesetzlose Taten“ bewahrt den moralisch-rechtlichen Gehalt; „ihren“ macht den aus dem Kontext eindeutigen Bezug auf die Bewohner kenntlich.
- source_word: ἐβασάνιζεν
  choice: quälte
  rationale: Das Imperfekt bezeichnet eine fortdauernde Handlung in der Vergangenheit. Die aktive Form und die Intensität des Verbs bleiben erhalten; eine Abschwächung zu „war betrübt“ wird vermieden.
theological_decisions:
- issue: Bedeutung von ψυχή für das Menschenbild
  choice: „Seele“ als Bezeichnung für Lots inneres Selbst beziehungsweise Leben
  alternative: „sich selbst“ oder „sein Innerstes“
  rationale: Der Vers beschreibt Lots innere moralische Qual, formuliert aber keine ausgearbeitete Lehre über das Verhältnis von Körper und Seele. Die direkte Wiedergabe lässt diese Offenheit bestehen.
- issue: Aktive Form von ἐβασάνιζεν
  choice: „quälte … seine gerechte Seele“
  alternative: „wurde in seiner gerechten Seele gequält“ oder „litt Qualen“
  rationale: Die ungewöhnliche aktive Aussage des griechischen Textes wird nicht in eine passive oder bloß emotionale Form umgedeutet. Zugleich bleibt offen, wie genau Lots Wahrnehmung und die gesetzlosen Taten als Ursache beziehungsweise Mittel zusammenwirken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „gerecht“ folgt bewusst dem griechischen Text. Die etwas markante aktive Wendung „quälte … seine Seele“ bewahrt Form, Intensität und Spannung des Ausgangstextes; die Fußnote erläutert die mögliche alternative Zuordnung der Satzglieder.
