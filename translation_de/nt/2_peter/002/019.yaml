  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: de
  text: Sie versprechen ihnen Freiheit, obwohl sie selbst Sklaven des Verderbens[a] sind. Denn wodurch jemand überwältigt worden ist, dadurch ist er auch versklavt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Verdorbenheit; das griechische Wort kann moralische Verderbtheit, Verfall und Verderben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: Freiheit
  rationale: Die übliche und natürliche deutsche Entsprechung; sie bewahrt den scharfen Gegensatz zur tatsächlichen Versklavung.
- source_word: ἐπαγγελλόμενοι
  choice: Sie versprechen
  rationale: Gibt die Bedeutung des Partizips als ausdrückliches Versprechen klar und idiomatisch wieder.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Der Status der Gebundenheit ist für den Gegensatz zwischen versprochener Freiheit und wirklicher Knechtschaft zentral; „Diener“ wäre zu schwach.
- source_word: ὑπάρχοντες
  choice: obwohl sie selbst ... sind
  rationale: Verdeutlicht den gleichzeitigen und widersprüchlichen Zustand derjenigen, die Freiheit versprechen.
- source_word: φθορᾶς
  choice: Verderbens
  rationale: „Verderben“ lässt sowohl moralische Verdorbenheit als auch ruinöse Zerstörung anklingen, ohne den Sinn einseitig festzulegen.
- source_word: ᾧ γάρ τις ἥττηται
  choice: Denn wovon jemand überwältigt worden ist
  rationale: Bewahrt den allgemeinen Grundsatz, den Singular und den passiven Sinn des Besiegt- beziehungsweise Beherrschtwerdens.
- source_word: τούτῳ καὶ δεδούλωται
  choice: davon ist er auch versklavt worden
  rationale: Der Rückbezug „davon“ entspricht der griechischen Korrelativkonstruktion; das Perfekt Passiv bezeichnet eine eingetretene Versklavung mit fortdauerndem Ergebnis.
theological_decisions:
- issue: Wiedergabe von δοῦλοι/δεδούλωται im Gegensatz von Freiheit und Gebundenheit
  choice: „Sklaven“ und „versklavt worden“
  alternative: „Diener“ und „dienstbar geworden“
  rationale: Die kräftige Wortwahl erhält die bewusste Ironie und die Aussage, dass das Verderben tatsächlich Herrschaft über einen Menschen ausübt.
- issue: Bedeutung von φθορά
  choice: „Verderben“ mit erklärender Fußnote
  alternative: „Verdorbenheit“, „Verfall“ oder „Zerstörung“
  rationale: Der griechische Ausdruck kann moralische Verderbtheit, Verfall und schließliches Verderben umfassen. Die Übersetzung soll diese Spannung nicht vorschnell auf nur einen Aspekt reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sklaven“ ist bewusst deutlich, weil der griechische Text den Gegensatz zur Freiheit hervorhebt. Der generische Singular wird mit „jemand ... er“ formnah beibehalten.
