  rationale: 'Die Revision glättet zwei sprachliche Unebenheiten, ohne den Sinn zu verändern: Die Städte werden idiomatisch als Städte „von Sodom und Gomorra“ bezeichnet, und τεθεικώς wird als „zu einem Beispiel machte“ wiedergegeben. „Künftige Gottlose“ wahrt den personalen Charakter von ἀσεβέσιν sowie den Zukunftsbezug von μελλόντων und ist knapper als die Umschreibung im Entwurf. Die Konditionalform und das abschließende Komma bleiben erhalten, da der Satz zum Folgekontext weiterführt.'
