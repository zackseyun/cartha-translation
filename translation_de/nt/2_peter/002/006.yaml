  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: de
  text: und wenn er die Städte von Sodom und Gomorra zu Asche machte[a] und zur Vernichtung verurteilte und sie damit zu einem Beispiel für künftige Gottlose machte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einäscherte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: zu Asche werden ließ
  rationale: Das Aoristpartizip bezeichnet das vollständige Zu-Asche-Machen. Die Formulierung gibt sowohl den Vorgang als auch sein Ergebnis wieder.
- source_word: καταστροφῇ
  choice: zur Vernichtung
  rationale: 'Der Dativ wird als Ergebnis beziehungsweise Inhalt des Urteils verstanden: Er verurteilte die Städte zur Vernichtung.'
- source_word: κατέκρινεν
  choice: verurteilte
  rationale: Das Verb hat hier gerichtlichen Sinn und bezeichnet ein verurteilendes Urteil.
- source_word: ὑπόδειγμα
  choice: als Beispiel
  rationale: Die schlichte Wiedergabe bewahrt den Bedeutungsumfang von ‚Beispiel/Vorbild‘; der Gerichtskontext macht die warnende Funktion deutlich.
- source_word: μελλόντων ἀσεβέσιν
  choice: für die Menschen, die künftig gottlos sein würden
  rationale: Die Formulierung bewahrt sowohl den Zukunftsbezug von μελλόντων als auch den personalen, adjektivischen Sinn von ἀσεβέσιν, ohne ihn auf eine bestimmte Form gottlosen Handelns einzuengen.
- source_word: τεθεικώς
  choice: hinstellte
  rationale: Das Perfektpartizip von τίθημι beschreibt das Setzen beziehungsweise Hinstellen als Beispiel mit bleibender Wirkung.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: die Städte Sodom und Gomorra
  rationale: Dies ist die natürliche deutsche Wiedergabe der Genitivkonstruktion und bewahrt den Plural ‚Städte‘.
theological_decisions:
- issue: Unausgesprochenes Subjekt aus dem Zusammenhang
  choice: er
  alternative: Gott; der Herr
  rationale: Der Satz führt die Reihe göttlicher Gerichte aus dem Kontext fort. Das Pronomen bewahrt den Textfluss, ohne einen in diesem Teilsatz nicht ausdrücklich genannten Titel einzufügen.
- issue: Bedeutung von ἀσεβέσιν
  choice: die Menschen, die künftig gottlos sein würden
  alternative: die künftigen Gottlosen
  rationale: Die Wiedergabe erhält den personalen und religiös-ethischen Sinn des Ausdrucks und lässt offen, worin die Gottlosigkeit konkret besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konditionale Satzform und das abschließende Komma bleiben erhalten, weil der Vers syntaktisch zum folgenden Hauptsatz gehört. Die Formulierung vermeidet konfessionelle Zusätze und bewahrt den Zukunftsbezug sowie die gerichtliche Spannung des griechischen Textes.
