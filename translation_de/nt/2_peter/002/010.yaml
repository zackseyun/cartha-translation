  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: de
  text: besonders aber diejenigen, die dem Fleisch nachgehen in der Begierde nach Verunreinigung[a] und Herrschaft verachten[b]. Verwegen und eigenwillig, schrecken sie nicht davor zurück, Herrlichkeiten[c] zu lästern[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Begierde nach Unreinheit«.'
