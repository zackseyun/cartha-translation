    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Herrlichkeiten«. Gemeint sind wahrscheinlich herrliche himmlische Wesen oder Mächte, möglicherweise Engel.'
    reason: alternative_reading
  - marker: d
    text: 'Auch möglich: »sie zittern nicht, während sie Herrlichkeiten lästern«.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: besonders
  rationale: Kennzeichnet innerhalb des im vorherigen Vers genannten Gerichts eine besonders hervorgehobene Gruppe.
- source_word: ὀπίσω σαρκὸς
  choice: dem Fleisch nachgehen
  rationale: Bewahrt das Bild des Hinterhergehens und den theologisch vielschichtigen Begriff σάρξ, ohne ihn vorschnell als »sündige Natur« auszulegen.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: in Begierde nach Befleckung
  rationale: Gibt die negative Begierde und die Vorstellung moralischer Verunreinigung eng am griechischen Ausdruck wieder.
- source_word: πορευομένους
  choice: nachgehen
  rationale: Verbindet sich im Deutschen natürlich mit »dem Fleisch« und bildet zusammen mit ὀπίσω das Verhalten als ein Hinterhergehen ab.
- source_word: κυριότητος
  choice: Herrschaft
  rationale: Bewahrt die Bedeutung von Herrschaft beziehungsweise Hoheit und lässt offen, ob allgemeine, göttliche oder himmlische Herrschaft gemeint ist.
- source_word: καταφρονοῦντας
  choice: verachten
  rationale: Drückt die aktive Geringschätzung in angemessener Stärke aus.
- source_word: Τολμηταί
  choice: verwegen
  rationale: Gibt den kontextuell negativen Sinn dreister Kühnheit prägnant wieder.
- source_word: αὐθάδεις
  choice: eigenwillig
  rationale: Bezeichnet selbstherrliche, auf dem eigenen Willen bestehende Menschen und wahrt die knappe Charakterisierung.
- source_word: δόξας
  choice: Herrlichkeiten
  rationale: Übersetzt den ungewöhnlichen Plural formal und lässt die Identität der damit bezeichneten herrlichen Wesen oder Mächte offen.
- source_word: οὐ τρέμουσιν, βλασφημοῦντες
  choice: schrecken sie nicht davor zurück, Herrlichkeiten zu lästern
  rationale: Gibt das furchtlose beziehungsweise ehrfurchtslose Lästern idiomatisch wieder; die partizipiale Beziehung wird als unmittelbarer Bezug zum Lästern verstanden.
theological_decisions:
- issue: Bezug von κυριότης
  choice: Herrschaft ohne bestimmten Referenten
  alternative: die Herrschaft des Herrn; eine himmlische Herrschaft; Obrigkeit
  rationale: Der griechische Ausdruck legt den Referenten nicht eindeutig fest. »Herrschaft« erhält diese Offenheit besser als eine ausdrücklich christologische oder politische Festlegung.
- issue: Bezug von δόξας
  choice: Herrlichkeiten, in der Hauptübersetzung nicht näher bestimmt
  alternative: herrliche Wesen; Engel; hohe Mächte
  rationale: Der folgende Vers spricht von Engeln und legt einen himmlischen Bezug nahe, doch δόξας selbst benennt sie nicht ausdrücklich. Die formale Wiedergabe wahrt diese Spannung.
- issue: Verhältnis von οὐ τρέμουσιν und βλασφημοῦντες
  choice: Sie schrecken nicht davor zurück, Herrlichkeiten zu lästern
  alternative: Sie zittern nicht, während sie Herrlichkeiten lästern
  rationale: Das Partizip kann begleitend verstanden werden; im Zusammenhang beschreibt es besonders ihre dreiste Furchtlosigkeit beim Lästern. Die deutsche Fassung ist idiomatisch, ohne einen anderen Gegenstand der Furcht einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst dichter, an der griechischen Satzstruktur orientierter Formulierung. »Fleisch«, »Herrschaft« und »Herrlichkeiten« bewahren die begriffliche und theologische Offenheit des Ausgangstextes; Fußnoten erläutern weniger geläufige Formulierungen.
