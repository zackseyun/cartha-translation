  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: de
  text: Aus Habgier werden sie euch mit erfundenen Worten ausbeuten.[a] Das Urteil über sie ist seit Langem nicht untätig, und ihr Verderben schläft nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „euch zum Handelsgut machen“ – das griechische Verb gebraucht ein kaufmännisches Bild dafür, Menschen zum eigenen Gewinn auszunutzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: Aus Habgier
  rationale: Die Wendung bezeichnet hier den Beweggrund ihres Handelns. „Aus Habgier“ ist im modernen Deutsch natürlich und bewahrt die moralische Schärfe.
- source_word: πλαστοῖς λόγοις
  choice: mit erfundenen Worten
  rationale: πλαστός bezeichnet etwas Geformtes beziehungsweise Erdichtetes. Die Übersetzung macht deutlich, dass es sich um bewusst zurechtgemachte Aussagen handelt.
- source_word: ἐμπορεύσονται
  choice: werden sie euch … ausbeuten
  rationale: 'Das Verb enthält ein kaufmännisches Bild: Menschen werden als Mittel zum Gewinn behandelt. „Ausbeuten“ gibt die übertragene Bedeutung klar wieder; das Bild wird in der Fußnote erläutert.'
- source_word: κρίμα
  choice: das Urteil über sie
  rationale: κρίμα bezeichnet ein richterliches Urteil beziehungsweise Gericht. „Über sie“ verdeutlicht den Bezug des griechischen Relativpronomens, ohne die Art der Strafe näher festzulegen.
- source_word: ἔκπαλαι οὐκ ἀργεῖ
  choice: ist seit Langem nicht untätig
  rationale: Die Formulierung bewahrt sowohl den zeitlichen Sinn von ἔκπαλαι als auch die Personifikation von ἀργέω, statt sie ausschließlich als Verzögerung zu deuten.
- source_word: ἀπώλεια
  choice: Verderben
  rationale: „Verderben“ bezeichnet Untergang oder Vernichtung, ohne die genaue Beschaffenheit oder Dauer des angekündigten Strafgerichts dogmatisch festzulegen.
- source_word: οὐ νυστάζει
  choice: schläft nicht
  rationale: Die anschauliche Personifikation des griechischen Verbs bleibt erhalten und klingt im Deutschen knapp und verständlich.
theological_decisions:
- issue: Art des angekündigten Gerichts
  choice: Die Aussage wird als gewisses göttliches Urteil und kommendes Verderben wiedergegeben, ohne dessen genaue Form oder Dauer festzulegen.
  alternative: „Verderben“ ausdrücklich als endgültige Vernichtung oder lediglich als zeitweiligen Ruin auslegen.
  rationale: Der Vers betont die Gewissheit des Gerichts, definiert aber an dieser Stelle weder dessen Mechanik noch Dauer. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Personifikationen – das Urteil ist nicht untätig, das Verderben schläft nicht – bleiben erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der sinngemäßen Wiedergabe des kaufmännischen Bildes.
