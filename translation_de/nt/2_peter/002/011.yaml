  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: de
  text: während Engel, obwohl sie an Stärke und Macht überlegen sind, kein verleumderisches[a] Urteil gegen sie[b] vorbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lästerndes“ oder „schmähendes“. Das griechische Adjektiv kann missbräuchliche, schmähende oder verleumderische Rede bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Sie“ bezieht sich wahrscheinlich auf die „Herrlichkeiten“ im vorherigen Vers; Petrus bestimmt hier nicht genauer, wer damit gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: während
  rationale: ὅπου stellt hier im Zusammenhang eher einen Kontrast zum Verhalten der zuvor Genannten her, als einen Ort zu bezeichnen. „Während“ gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Der Zusammenhang weist auf himmlische Wesen, nicht auf menschliche Boten.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: an Stärke und Macht
  rationale: Die beiden Dative bezeichnen den Bereich, in dem die Engel überlegen sind; das Wortpaar bewahrt die verstärkende Häufung des Griechischen.
- source_word: μείζονες ὄντες
  choice: obwohl sie … größer sind
  rationale: 'Das Partizip ist im Kontext konzessiv: Trotz ihrer Überlegenheit tun die Engel nicht, was die zuvor beschriebenen Menschen tun.'
- source_word: οὐ φέρουσιν
  choice: bringen … nicht vor
  rationale: φέρω mit κρίσιν bezeichnet hier das Vorbringen oder Aussprechen eines Urteils. „Vorbringen“ passt zum rechtlich-gerichtlichen Klang.
- source_word: κατ’ αὐτῶν
  choice: gegen sie
  rationale: Das Pronomen bleibt ebenso wenig ausdrücklich bestimmt wie im Griechischen und verweist wahrscheinlich auf die „Herrlichkeiten“ des vorherigen Verses.
- source_word: βλάσφημον
  choice: verleumderisches
  rationale: βλάσφημος kann schmähende, lästernde oder verleumderische Rede bezeichnen. „Verleumderisch“ vermittelt hier klar den abwertend-diffamierenden Charakter, ohne die Bedeutung auf Gotteslästerung einzuengen.
- source_word: κρίσιν
  choice: Urteil
  rationale: κρίσις bezeichnet hier eine gerichtliche Beurteilung oder einen Urteilsspruch; „Urteil“ ist die breiteste und unmittelbar verständliche Wiedergabe.
theological_decisions:
- issue: Bezug von αὐτῶν auf die „Herrlichkeiten“ im vorherigen Vers
  choice: Das Pronomen bleibt im Haupttext als „sie“ unbestimmt.
  alternative: Gefallene Engelwesen, menschliche Würdenträger oder himmlische Herrlichkeitswesen ausdrücklich benennen.
  rationale: Der Vers selbst bestimmt den Bezug nicht genauer. Die unbestimmte Wiedergabe wahrt die Spannung des griechischen Textes und vermeidet eine konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt den Kontrast und die konzessive Aussage des griechischen Textes; die unklare pronominale Bezugnahme bleibt bewusst erhalten.
