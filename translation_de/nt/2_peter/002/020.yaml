- from: Denn wenn Menschen den Befleckungen der Welt durch die Erkenntnis des Herrn und Retters Jesus Christus entkommen sind, sich dann aber wieder darin verstricken und davon überwältigt werden, ist ihr letzter Zustand schlimmer geworden als der erste.
  to: Denn wenn sie den Verunreinigungen der Welt durch die Erkenntnis des Herrn und Retters Jesus Christus entkommen sind, sich aber wieder in sie verstricken und von ihnen überwältigt werden, ist ihr letzter Zustand schlimmer geworden als der erste.
  rationale: Die Revision entfernt die nicht im Ausgangstext ausgedrückte Verallgemeinerung „Menschen“ und schärft den pronominalen Rückbezug auf die Verunreinigungen. Die Aussage über die Art der Erkenntnis und die theologisch umstrittene Frage des Abfalls bleibt bewusst unentschieden.
