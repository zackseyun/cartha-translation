id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: de
  text: Denn wenn sie den Verunreinigungen der Welt durch die Erkenntnis des Herrn und Retters Jesus Christus entkommen sind, sich aber wieder in sie verstricken und von ihnen überwältigt werden, ist ihr letzter Zustand schlimmer geworden als der erste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: entkommen sind
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem erneuten Verstricken vorausgeht; das deutsche Perfekt gibt diese Vorzeitigkeit natürlich wieder.
- source_word: μιάσματα
  choice: Befleckungen
  rationale: Der Ausdruck bewahrt sowohl den Gedanken moralischer Verunreinigung als auch das Bild einer beschmutzenden Einwirkung.
- source_word: ἐν ἐπιγνώσει
  choice: durch die Erkenntnis
  rationale: ἐν bezeichnet hier plausibel das Mittel oder den Zusammenhang des Entkommens. „Erkenntnis“ lässt offen, welcher Art oder Tiefe diese Erkenntnis ist.
- source_word: κυρίου καὶ σωτῆρος
  choice: des Herrn und Retters
  rationale: Die beiden koordinierten Titel werden knapp und traditionsübergreifend auf Jesus bezogen.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: Im modernen deutschen Sprachgebrauch ist „Jesus Christus“ die natürliche und würdevolle Wiedergabe; „Christus“ lässt zugleich den messianischen Titel erkennen.
- source_word: τούτοις
  choice: darin
  rationale: Das Pronomen verweist auf die zuvor genannten Befleckungen; „darin“ stellt den Rückbezug im Deutschen idiomatisch her.
- source_word: πάλιν ἐμπλακέντες
  choice: sich dann aber wieder darin verstricken
  rationale: „Verstricken“ erhält das Bild erneuter Verwicklung oder Gefangenschaft; „wieder“ gibt πάλιν wieder.
- source_word: ἡττῶνται
  choice: davon überwältigt werden
  rationale: Das Passiv bezeichnet Unterliegen oder Beherrschtwerden. „Davon“ verdeutlicht den Bezug, ohne den Sinn auszudeuten.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: ihr letzter Zustand schlimmer geworden als der erste
  rationale: Die substantivierten Neutra bezeichnen idiomatisch den späteren beziehungsweise früheren Zustand; die Wiedergabe vermeidet eine unnötig eschatologische Festlegung.
theological_decisions:
- issue: Art der Erkenntnis und ihr Verhältnis zum Abfall
  choice: „Erkenntnis“ ohne nähere Bestimmung
  alternative: „volle Erkenntnis“, „rettende Erkenntnis“ oder „bloße äußere Kenntnis“
  rationale: ἐπίγνωσις bezeichnet wirkliche Erkenntnis, entscheidet aber für sich genommen nicht die umstrittene Frage nach Wiedergeburt oder endgültigem Abfall. Die Übersetzung wahrt diese Spannung.
- issue: Identität der beschriebenen Personen
  choice: „Menschen“ als neutrales, im Deutschen erforderliches Bezugswort
  alternative: „sie“ ohne ausdrücklich genanntes Bezugswort
  rationale: Das Griechische lässt das Subjekt des Partizips implizit. „Menschen“ macht den Satz im Deutschen selbstständig verständlich, ohne die Gruppe näher zu bestimmen.
- issue: Worauf der schlechtere letzte Zustand zielt
  choice: „letzter Zustand“
  alternative: „Ende“ oder „letzte Dinge“
  rationale: Die Formulierung hält offen, ob primär die gegenwärtige moralische Lage, das endgültige Geschick oder beides gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Konditionalsatz bleibt als Einheit erhalten, wird aber durch natürliche deutsche Wortstellung lesbar gemacht. Keine konfessionelle Deutung der umstrittenen Aussage wird in den Text eingebaut.
