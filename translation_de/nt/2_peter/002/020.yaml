    issue: Das Bezugswort „Menschen“ wird ergänzt.
    rationale: Das griechische Partizip hat ein kontextuell bestimmtes, aber nicht ausdrücklich genanntes Subjekt. „Menschen“ ist zwar sachlich nicht falsch, löst den Vers jedoch unnötig vom Kontext und kann die bezeichnete Gruppe verallgemeinern.
  - severity: low
    issue: Der Rückbezug bei „davon überwältigt“ ist weniger unmittelbar als möglich.
    rationale: τούτοις verweist auf die zuvor genannten μιάσματα. „von ihnen überwältigt“ stellt diese Referenz im Deutschen präzise her.
