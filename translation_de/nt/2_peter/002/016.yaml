id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: de
  text: 'Doch wegen seines eigenen Gesetzesbruchs wurde er zurechtgewiesen: ein stummes Lasttier[a] sprach mit menschlicher Stimme[b] und gebot dem Wahnsinn des Propheten Einhalt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ein „Lasttier“; gemeint ist Bileams Eselin (4. Mose 22,28–30).
    reason: cross_reference
  - marker: b
    text: 'Oder: „mit der Stimme eines Menschen“. Gemeint ist eine menschliche Stimme im Gegensatz zu einem sonst stummen Tier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν δὲ ἔσχεν
  choice: Doch … wurde er zurechtgewiesen
  rationale: Die deutsche Passivform gibt die idiomatische Wendung wörtlich ‚eine Zurechtweisung erhalten‘ natürlich wieder; δέ markiert den Gegensatz zum vorangehenden Zusammenhang.
- source_word: ἰδίας παρανομίας
  choice: wegen seines eigenen Gesetzesbruchs
  rationale: παρανομία bezeichnet eine Übertretung beziehungsweise ein Handeln gegen das Gesetz; ‚Gesetzesbruch‘ wahrt die rechtliche Schärfe, während ‚eigenen‘ die persönliche Schuld betont.
- source_word: ὑποζύγιον ἄφωνον
  choice: ein stummes Lasttier
  rationale: ὑποζύγιον ist allgemein ein Last- oder Zugtier und wird daher nicht schon im Haupttext als Esel präzisiert. ‚Stumm‘ hebt den beabsichtigten Gegensatz zum anschließenden Sprechen hervor.
- source_word: ἐν ἀνθρώπου φωνῇ φθεγξάμενον
  choice: sprach mit menschlicher Stimme
  rationale: Die Partizipialkonstruktion wird als natürlicher deutscher Hauptsatz wiedergegeben. ἀνθρώπου bezeichnet hier das Menschliche im Gegensatz zum Tierischen, nicht speziell eine männliche Stimme.
- source_word: ἐκώλυσεν
  choice: gebot … Einhalt
  rationale: Die feste Wendung drückt kräftig aus, dass das Verhalten gehemmt beziehungsweise aufgehalten wurde, ohne mehr als der griechische Text über den weiteren Verlauf zu behaupten.
- source_word: τὴν τοῦ προφήτου παραφρονίαν
  choice: dem Wahnsinn des Propheten
  rationale: παραφρονία ist ein starkes Wort für irrationalen Wahn oder Wahnsinn; der Genitiv wird natürlich mit ‚des Propheten‘ wiedergegeben.
theological_decisions:
- issue: Soll ὑποζύγιον aufgrund von 4. Mose 22 ausdrücklich mit ‚Eselin‘ übersetzt werden?
  choice: Im Haupttext bleibt die allgemeine Bezeichnung ‚Lasttier‘ stehen.
  alternative: Eselin
  rationale: Der Bezug auf Bileams Eselin ist eindeutig, doch 2. Petrus verwendet selbst den allgemeineren Ausdruck ὑποζύγιον. Die konkrete Identifizierung gehört deshalb in die Fußnote.
- issue: Bezeichnet ἀνθρώπου eine männliche oder allgemein eine menschliche Stimme?
  choice: menschliche Stimme
  alternative: Stimme eines Mannes
  rationale: Der Gegensatz besteht zwischen einem stummen Tier und menschlichem Sprechen, nicht zwischen den Geschlechtern. ‚Menschlich‘ gibt die Funktion von ἄνθρωπος hier präzise wieder.
- issue: Wie stark soll παραφρονία wiedergegeben werden?
  choice: Wahnsinn
  alternative: Torheit
  rationale: ‚Wahnsinn‘ bewahrt die starke Wertung des griechischen Ausdrucks und schwächt die irrationale Verblendung des Propheten nicht zu bloßer Unklugheit ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit behutsam geglättet; die markanten Gegensätze zwischen Zurechtweisung, stummem Tier, menschlicher Stimme und prophetischem Wahnsinn bleiben erhalten.
