id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: de
  text: Doch es traten auch falsche Propheten unter dem Volk auf, ebenso wie es unter euch falsche Lehrer geben wird. Sie werden heimlich Irrlehren einführen, die ins Verderben führen[a], und sogar den Gebieter verleugnen, der sie erkauft hat[b]. Damit ziehen sie sich selbst ein rasches Verderben zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verderbliche Parteiungen“. Das griechische Wort kann Irrlehren, Parteien oder Sekten bezeichnen; hier sind Bewegungen oder Lehren gemeint, die ins Verderben führen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Herr, der sie erlöst hat“. Wörtlich steht im Griechischen: „der Gebieter, der sie erkauft hat“. Damit bleibt die Kaufmetapher erhalten, ohne die theologischen Fragen nach Art und Umfang dieses Erkaufens zu entscheiden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: es traten ... auf
  rationale: Die Wendung gibt das historische Auftreten der falschen Propheten idiomatisch wieder, ohne den Vorgang unnötig auszudeuten.
- source_word: ψευδοπροφῆται
  choice: falsche Propheten
  rationale: Direkte und im Deutschen geläufige Wiedergabe des griechischen Kompositums.
- source_word: ἐν τῷ λαῷ
  choice: unter dem Volk
  rationale: Bewahrt die bestimmte Bezeichnung des Bundesvolkes im alttestamentlichen Rückblick, ohne im Haupttext ausdrücklich ‚Israel‘ zu ergänzen.
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: ebenso wie es unter euch ... geben wird
  rationale: Erhält den Vergleich zwischen dem früheren Auftreten falscher Propheten und dem künftigen Auftreten falscher Lehrer in der angesprochenen Gemeinschaft.
- source_word: ψευδοδιδάσκαλοι
  choice: falsche Lehrer
  rationale: Transparente Wiedergabe, die den Parallelismus zu den falschen Propheten wahrt.
- source_word: παρεισάξουσιν
  choice: werden heimlich ... einführen
  rationale: Gibt sowohl die zukünftige Handlung als auch den im Verb enthaltenen Gedanken des verdeckten Einschleusens wieder.
- source_word: αἱρέσεις ἀπωλείας
  choice: Irrlehren ..., die ins Verderben führen
  rationale: ‚Irrlehren‘ bezeichnet hier verständlich die verderbliche Lehre; der Relativsatz bewahrt die resultative Kraft von ἀπωλείας. Die ebenfalls mögliche Bedeutung ‚Gruppierungen/Parteiungen‘ wird in der Fußnote offengehalten.
- source_word: τὸν ... δεσπότην
  choice: den Gebieter
  rationale: ‚Gebieter‘ wahrt die Unterscheidung von δεσπότης gegenüber κύριος und bringt den Anspruch unumschränkter Autorität in würdiger, verständlicher Sprache zum Ausdruck.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: der sie erkauft hat
  rationale: Bewahrt die Kaufmetapher von ἀγοράζω und vermeidet es, sie durch die theologisch stärker festgelegte Wiedergabe ‚erlöst‘ aufzulösen.
- source_word: ἀρνούμενοι
  choice: verleugnen
  rationale: Gibt die bewusste Zurückweisung des Gebieters direkt und mit dem angemessenen theologischen Gewicht wieder.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: Damit ziehen sie sich selbst ein rasches Verderben zu
  rationale: Bewahrt den reflexiven Gedanken und die Folge ihres Handelns; ‚rasch‘ entspricht ταχινή, ohne zwingend eine ausschließlich zeitliche Naherwartung auszudeuten.
theological_decisions:
- issue: Bedeutung von αἱρέσεις im Kontext
  choice: Irrlehren
  alternative: verderbliche Parteiungen oder Sekten
  rationale: Das heimliche Einführen und die Verleugnung des Gebieters rücken den lehrmäßigen Gehalt in den Vordergrund. Da αἵρεσις zugleich Gruppen oder Parteiungen bezeichnen kann, wird diese echte Bedeutungsbreite in der Fußnote bewahrt.
- issue: Aussage von τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: den Gebieter, der sie erkauft hat
  alternative: den Herrn, der sie erlöst hat
  rationale: Die Übersetzung hält an der ausdrücklichen Kaufmetapher und am Objekt ‚sie‘ fest. So bleibt die theologische Spannung hinsichtlich Art und Umfang dieses Erkaufens bestehen, statt durch eine dogmatisch engere Formulierung entschieden zu werden.
- issue: Unterscheidung von δεσπότης und κύριος
  choice: Gebieter
  alternative: Herr oder souveräner Herrscher
  rationale: ‚Gebieter‘ bildet δεσπότης eigenständig ab und vermeidet die Einebnung mit dem gewöhnlich als ‚Herr‘ übersetzten κύριος.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, übersichtliche Sätze machen die Warnung gut verständlich. ‚Gebieter‘ ist bewusst etwas gehobener, aber allgemein verständlich und lexikalisch präziser als eine Einebnung zu ‚Herr‘. Beide Fußnotenmarker [a] und [b] stehen im Haupttext.
