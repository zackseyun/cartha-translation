  source_fidelity: Die Übersetzung gibt den Vergleich zwischen den falschen Propheten im Volk und den zukünftigen falschen Lehrern unter den Adressaten zutreffend wieder. „heimlich ... einführen“ erfasst παρεισάξουσιν, „Irrlehren, die ins Verderben führen“ die destruktive/resultative Kraft von αἱρέσεις ἀπωλείας, und „den Gebieter ... der sie erkauft hat“ bewahrt sowohl δεσπότης als auch die Kaufmetapher von ἀγοράσαντα. „ziehen sie sich selbst ... zu“ gibt die reflexive Folge von ἐπάγοντες ἑαυτοῖς angemessen wieder.
