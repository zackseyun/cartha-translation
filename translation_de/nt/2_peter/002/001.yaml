  terminology: „Falsche Propheten“, „falsche Lehrer“, „Irrlehren“, „Gebieter“, „verleugnen“, „erkauft“ und „Verderben“ sind terminologisch konsistent und quellentreu. Die Fußnoten bewahren die lexikalische Alternative bei αἵρεσις sowie die theologische Offenheit der Kaufmetapher, ohne sie dogmatisch aufzulösen. Beide Marker sind passend verankert.
