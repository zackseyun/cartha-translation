  source_fidelity: 'Der Text gibt die Satzstruktur und die wesentlichen Formen des Griechischen zuverlässig wieder: „viele“ für πολλοί, Futur in „werden ... folgen“, die possessive Zuordnung der pluralischen ἀσέλγειαι zu den falschen Lehrern, kausales „ihretwegen“, die Genitivmetapher „der Weg der Wahrheit“ und das Futurpassiv von βλασφημηθήσεται. „Ausschweifungen“ wahrt den breiten Bereich schamloser, ungezügelter Verhaltensweisen einschließlich möglicher sexueller Konnotationen.'
