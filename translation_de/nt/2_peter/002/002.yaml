id: 2PE.2.2
reference: 2 Peter 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: de
  text: Und viele werden ihren Ausschweifungen[a] folgen, und ihretwegen wird der Weg der Wahrheit[b] gelästert werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ihrer Zügellosigkeit“ beziehungsweise „ihrem schamlosen Treiben“. Der griechische Ausdruck bezeichnet schamloses, ungezügeltes Verhalten, oft mit sexuellen Untertönen.
    reason: lexical_alternative
  - marker: b
    text: Oder „der Wahrheitsweg“. Gemeint ist wahrscheinlich der christliche Glaube und die ihm entsprechende Lebensweise als der Weg, der von der Wahrheit bestimmt ist.
    reason: lexical_alternative
  - marker: c
    text: Oder „geschmäht“, „verleumdet“ beziehungsweise „in Verruf gebracht werden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Die übliche und natürliche Wiedergabe des Mengenbegriffs; sie bewahrt dessen Gewicht, ohne ihn zu verstärken.
- source_word: ἐξακολουθήσουσιν
  choice: werden … folgen
  rationale: Das Futur und das Bild des Nachfolgens auf einem eingeschlagenen Weg bleiben erhalten.
- source_word: αὐτῶν ταῖς ἀσελγείαις
  choice: ihren Ausschweifungen
  rationale: Das Possessivpronomen bezieht sich im Kontext auf die falschen Lehrer. Der griechische Plural wird beibehalten; „Ausschweifungen“ bezeichnet schamloses, ungezügeltes Verhalten und lässt sowohl sexuelle als auch weitere moralische Aspekte zu.
- source_word: δι’ οὓς
  choice: ihretwegen
  rationale: διά mit Akkusativ bezeichnet hier den verursachenden Anlass. „Ihretwegen“ gibt dies knapp und idiomatisch wieder.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: der Weg der Wahrheit
  rationale: Die Genitivverbindung und die Wegmetapher werden bewahrt. Die Formulierung kann sowohl die christliche Botschaft als auch die ihr entsprechende Lebensweise bezeichnen.
- source_word: βλασφημηθήσεται
  choice: wird … gelästert werden
  rationale: Die Wiedergabe erhält Futur, Passiv und die Schwere abwertender, ehrverletzender Rede gegen etwas Heiliges oder als heilig Geltendes.
theological_decisions:
- issue: Bedeutung von „der Weg der Wahrheit“
  choice: Die frühchristliche Wegbezeichnung wird wörtlich als „der Weg der Wahrheit“ wiedergegeben.
  alternative: „der wahre Weg“ oder eine ausdrückliche Paraphrase wie „der christliche Glaube und Lebenswandel“
  rationale: Die wörtliche Fassung wahrt die Metapher und lässt offen, ob vor allem Botschaft, Glaube, Lebensführung oder deren Einheit gemeint ist.
- issue: Moralischer Umfang von ἀσέλγεια
  choice: „Ausschweifungen“
  alternative: „Zügellosigkeit“, „Schamlosigkeiten“ oder „zügelloses Verhalten“
  rationale: Der Begriff hat häufig sexuelle Untertöne, ist aber nicht zwingend darauf beschränkt. „Ausschweifungen“ bewahrt die Breite ungezügelten und schamlosen Verhaltens.
- issue: Stärke von βλασφημέω
  choice: „gelästert werden“
  alternative: „verleumdet“, „geschmäht“ oder „in Verruf gebracht werden“
  rationale: „Lästern“ bewahrt die besondere Schwere des griechischen Verbs, ohne festzulegen, dass ausschließlich Gotteslästerung im engeren Sinn gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas gewichtige Passivform „wird … gelästert werden“ bildet das griechische Futur Passiv transparent ab. Die Wiederholung der Wegmetapher und die Mehrdeutigkeit zwischen christlicher Botschaft und Lebensweise bleiben erhalten.
