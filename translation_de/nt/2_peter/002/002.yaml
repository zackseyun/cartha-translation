  terminology: „Ausschweifungen“, „Weg der Wahrheit“ und „gelästert werden“ sind terminologisch tragfähig. Sie vermeiden sowohl eine unzulässige Beschränkung von ἀσέλγεια auf Sexualität als auch eine konfessionell verengende Auslegung des „Wegs der Wahrheit“. Die Fußnoten bieten sinnvolle Alternativen und kennzeichnen die wahrscheinliche, nicht zwingende christliche Referenz vorsichtig.
