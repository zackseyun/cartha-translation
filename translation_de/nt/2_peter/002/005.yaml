  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: de
  text: und wenn er die Welt der Urzeit nicht verschonte, sondern Noah als einen von acht[a], einen Verkünder[b] der Gerechtigkeit[c], bewahrte, als er eine Flut über eine Welt gottloser Menschen hereinbrechen ließ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Noah als Achten“ beziehungsweise „Noah, den Achten“. Die griechische Wendung ist stark verdichtet und besagt wahrscheinlich, dass Noah zusammen mit sieben weiteren Menschen bewahrt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Prediger“. Das griechische Wort bezeichnet einen öffentlichen Ausrufer oder Verkünder.'
    reason: lexical_alternative
  - marker: c
    text: Für „Gerechtigkeit“ ist hier auch „Rechtschaffenheit“ möglich; das griechische Wort kann sowohl den rechten Zustand als auch das rechte Handeln bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: die Welt der Urzeit
  rationale: Bezeichnet die frühere, vorsintflutliche Welt. „Welt der Urzeit“ ist im Deutschen natürlich und macht den zeitlichen Bezug deutlich.
- source_word: οὐκ ἐφείσατο
  choice: nicht verschonte
  rationale: φείδομαι bedeutet im Zusammenhang göttlichen Gerichts „verschonen“; die knappe gerichtliche Aussage bleibt erhalten.
- source_word: ὄγδοον Νῶε
  choice: Noah als Achten
  rationale: Die ungewöhnlich knappe Ordinalkonstruktion wird formal bewahrt. Sie bezeichnet Noah als den Achten beziehungsweise als einen von insgesamt acht Geretteten, ohne diese Auslegung stillschweigend in den Haupttext einzutragen.
- source_word: δικαιοσύνης κήρυκα
  choice: einen Verkünder der Gerechtigkeit
  rationale: κῆρυξ bezeichnet einen öffentlichen Ausrufer oder Verkünder. „Gerechtigkeit“ ist die übliche und im Kontext offene Wiedergabe von δικαιοσύνη.
- source_word: ἐφύλαξεν
  choice: bewahrte
  rationale: φυλάσσω beschreibt hier Noahs Bewahrung durch das Gericht hindurch; „bewahrte“ gibt dies würdig und knapp wieder.
- source_word: κατακλυσμὸν
  choice: eine Flut
  rationale: Das artikellose κατακλυσμός bezeichnet eine Flut; der bekannte Bezug auf die Sintflut ergibt sich aus Noahs Erwähnung.
- source_word: κόσμῳ ἀσεβῶν
  choice: über eine Welt gottloser Menschen
  rationale: Die Dativverbindung bezeichnet das Ziel des hereinbrechenden Gerichts, der Genitiv eine von Gottlosen geprägte Welt. Die personale Bedeutung von ἀσεβῶν wird ausdrücklich wiedergegeben.
- source_word: ἐπάξας
  choice: als er … hereinbrechen ließ
  rationale: Das Aoristpartizip wird als begleitender zeitlicher Umstand zum Bewahren Noahs ausgedrückt; „hereinbrechen ließ“ vermittelt die Verursachung und die Wucht der Flut.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ wahrt die theologische und moralische Bedeutungsbreite des griechischen Ausdrucks. „Rechtschaffenheit“ könnte ihn stärker auf menschliches Verhalten verengen.
- issue: Verhältnis Noahs zu den acht Geretteten
  choice: Noah als Achten
  alternative: Noah als einen von acht
  rationale: Die griechische Formulierung ist verdichtet und lässt sich als ordinaler Ausdruck verstehen, der Noah zusammen mit sieben weiteren Personen erfasst. Der Haupttext bewahrt diese auffällige Form; die Fußnote erläutert die naheliegende Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wegen seines Zusammenhangs mit der seit Vers 4 laufenden Bedingungsreihe syntaktisch offen und endet daher mit einem Komma. Die ungewöhnliche Formulierung „als Achten“ erhält bewusst die Verdichtung und Mehrdeutigkeit des griechischen Textes.
