  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: de
  text: 'Dabei erleiden sie selbst Unrecht als Vergeltung für ihr Unrecht[a]. Ausschweifung am helllichten Tag halten sie für ein Vergnügen. Flecken und Makel sind sie: Sie schwelgen in ihren Täuschungen[b], während sie mit euch gemeinsam essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Sie empfangen den Lohn für ihr Unrecht.«'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften haben »Liebesmahle« statt »Täuschungen«: »Sie schwelgen bei ihren Liebesmahlen, während sie mit euch gemeinsam essen.«'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: sie erleiden Unrecht
  rationale: Die passive Form wird ausdrücklich wiedergegeben und zugleich mit dem folgenden Lohnmotiv verbunden. So bleibt das Wortspiel mit ἀδικία erhalten, ohne das Partizip bloß als aktives »empfangen« wiederzugeben.
- source_word: μισθὸν ἀδικίας
  choice: als Lohn für ihr Unrecht
  rationale: μισθός bezeichnet Lohn oder Vergeltung; der Genitiv ἀδικίας wird natürlich als das Unrecht wiedergegeben, für das der Lohn erfolgt. Die Formulierung bewahrt die moralische Schärfe und das Wortspiel mit ἀδικούμενοι.
- source_word: ἡδονὴν ἡγούμενοι
  choice: halten sie für ein Vergnügen
  rationale: ἡγέομαι mit doppeltem Akkusativ bedeutet hier »für etwas halten«; ἡδονή wird unmittelbar mit »Vergnügen« wiedergegeben.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: Ausschweifung am helllichten Tag
  rationale: τρυφή bezeichnet luxuriöse, selbstbezogene Genusssucht oder Ausschweifung. »Am helllichten Tag« macht die in ἐν ἡμέρᾳ liegende demonstrative Schamlosigkeit in natürlichem Deutsch hörbar.
- source_word: σπίλοι καὶ μῶμοι
  choice: Schandflecken und Makel
  rationale: Die beiden Ausdrücke bezeichnen beschmutzende Flecken beziehungsweise Mängel. »Schandflecken« bringt die moralische Wertung zum Ausdruck, während »Makel« das zweite Bild knapp bewahrt.
- source_word: ἐντρυφῶντες
  choice: sie schwelgen
  rationale: Das Verb bezeichnet genussvolles, maßloses Sich-Ergehen und greift das Motiv der τρυφή wieder auf. »Schwelgen« ist idiomatisch und wahrt den tadelnden Ton.
- source_word: ἐν ταῖς ἀπάταις αὐτῶν
  choice: in ihren Täuschungen
  rationale: Der SBLGNT-Text liest ἀπάταις, also »Täuschungen/Betrügereien«. »In ihren Täuschungen« bleibt nah an der Präpositionalfügung und passt zum Zusammenhang der irreführenden Lehrer.
- source_word: συνευωχούμενοι ὑμῖν
  choice: während sie mit euch tafeln
  rationale: Das Verb bezeichnet gemeinsames Festessen. Die temporale Wiedergabe des Partizips zeigt, dass ihr Schwelgen während der gemeinsamen Mahlzeit geschieht, ohne die Art des Mahls über den Text hinaus festzulegen.
theological_decisions:
- issue: Mehrdeutigkeit von ἀδικούμενοι in Verbindung mit μισθὸν ἀδικίας
  choice: »sie erleiden Unrecht als Lohn für ihr Unrecht«
  alternative: »sie empfangen den Lohn für ihr Unrecht«
  rationale: Die gewählte Fassung nimmt die passive Form des überlieferten SBLGNT-Textes ernst und bewahrt das auffällige Wortspiel. Der Zusammenhang legt Vergeltung nahe, doch die grammatische Spannung wird nicht durch eine rein aktive Umschreibung beseitigt.
- issue: Textvariante ἀπάταις / ἀγάπαις
  choice: 'ἀπάταις: »in ihren Täuschungen« im Haupttext'
  alternative: 'ἀγάπαις: »bei ihren Liebesmahlen«'
  rationale: Der vorgegebene SBLGNT-Text bietet ἀπάταις. Die inhaltlich bedeutsame Variante ἀγάπαις wird in einer Fußnote dokumentiert, statt stillschweigend übernommen oder ausgelassen zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Am helllichten Tag« vermittelt die demonstrative Schamlosigkeit idiomatisch; »tafeln« hält den festlichen Charakter des gemeinsamen Essens fest, ohne es konfessionell oder liturgisch näher zu bestimmen. Die Wiederholung von »Unrecht« bewahrt bewusst das griechische Wortspiel.
