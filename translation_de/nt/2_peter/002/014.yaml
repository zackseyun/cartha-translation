source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: de
  text: Sie haben Augen voll von einer Ehebrecherin[a] und können von der Sünde nicht ablassen[b]; sie locken ungefestigte Menschen an. Ihr Herz ist in Habgier geübt. Kinder des Fluches!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „voll von einer Ehebrecherin“; sinngemäß auch: „voll von Ehebruch“ oder „voll ehebrecherischer Begierde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „hören nicht auf zu sündigen“; stärker deutend: „sind unersättlich nach Sünde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: voll von einer Ehebrecherin
  rationale: Bewahrt das konkrete und ungewöhnliche Bild des griechischen Genitivs Singular, statt es stillschweigend zu „Ehebruch“ zu verallgemeinern.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: können von der Sünde nicht ablassen
  rationale: Gibt den Gedanken des Nichtaufhörens idiomatisch wieder und vermeidet die stärker deutende Vorstellung einer unstillbaren Begierde.
- source_word: δελεάζοντες
  choice: locken ... an
  rationale: Trifft den Sinn des Köderns oder Verlockens und bewahrt den räuberischen Unterton in natürlichem Deutsch.
- source_word: ψυχὰς ἀστηρίκτους
  choice: ungefestigte Menschen
  rationale: ψυχαί bezeichnet hier verletzliche Personen; „Menschen“ ist im heutigen Deutsch klarer als „Seelen“, während „ungefestigt“ ἀστήρικτος genau wiedergibt.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: Ihr Herz ist in Habgier geübt
  rationale: „Geübt“ erhält das Trainingsbild von γεγυμνασμένην; „Habgier“ ist eine klare, gegenwärtige Wiedergabe von πλεονεξία.
- source_word: κατάρας τέκνα
  choice: Kinder des Fluches
  rationale: Bewahrt die markante Genitivfügung und ihre Aussage, dass diese Menschen vom Fluch gekennzeichnet beziehungsweise ihm verfallen sind.
- source_word: ἔχοντες ... ἔχοντες
  choice: Sie haben ... Ihr Herz ist
  rationale: Die Partizipien werden für natürliches modernes Deutsch in finite Sätze überführt; die anklagende Reihung bleibt erhalten.
theological_decisions:
- issue: Ob das sexuelle Bild von μοιχαλίδος geglättet werden soll
  choice: Das konkrete Bild „von einer Ehebrecherin“ bleibt im Haupttext erhalten.
  alternative: „voll von Ehebruch“ oder „voll ehebrecherischer Begierde“
  rationale: Der griechische Wortlaut ist bewusst konkret und scharf. Die ungewöhnliche Formulierung soll nicht ohne Kennzeichnung interpretierend verallgemeinert werden.
- issue: Wie ἀκαταπαύστους ἁμαρτίας zu verstehen ist
  choice: „können von der Sünde nicht ablassen“
  alternative: „sind unersättlich nach Sünde“ oder „hören nicht auf zu sündigen“
  rationale: Die gewählte Fassung bleibt nahe beim Grundgedanken des Nichtablassens, ohne die mögliche Beziehung des Adjektivs zu den „Augen“ oder den gesamten Personen dogmatisch festzulegen.
- issue: Wie κατάρας τέκνα wiederzugeben ist
  choice: „Kinder des Fluches“
  alternative: „verfluchte Kinder“ oder „Menschen unter dem Fluch“
  rationale: Die bildhafte Wendung wird bewahrt und nicht auf eine einzige Erklärung — Wesenskennzeichnung oder Ziel des Fluches — eingeengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Anklage wird durch kurze, aneinandergereihte Sätze und den abschließenden Ausruf bewahrt. Ungewöhnliche Originalbilder bleiben im Haupttext stehen und werden in Fußnoten erläutert.
