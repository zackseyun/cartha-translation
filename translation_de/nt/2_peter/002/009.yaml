  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: de
  text: Dann weiß der Herr, wie er die Gottesfürchtigen aus der Prüfung[a] retten und die Ungerechten, während sie bestraft werden, bis zum Tag des Gerichts verwahren kann[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Versuchung“. Das griechische Wort kann sowohl Versuchung als auch Prüfung oder Erprobung bedeuten; hier spricht der Zusammenhang eher für eine Prüfung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Ungerechten für den Tag des Gerichts zur Bestrafung verwahren“. Das griechische Partizip kann eine bereits andauernde Bestrafung oder eine mit dem kommenden Gericht verbundene Bestrafung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: weiß, wie er … kann
  rationale: Mit den Infinitiven bezeichnet οἶδεν hier praktisches Wissen beziehungsweise Vermögen. Die deutsche Konstruktion gibt diese idiomatische Funktion natürlich wieder.
- source_word: κύριος
  choice: der Herr
  rationale: Die etablierte und kontextgerechte Wiedergabe von κύριος ist „der Herr“.
- source_word: εὐσεβεῖς
  choice: die Gottesfürchtigen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, deren Leben von Ehrfurcht und Hingabe an Gott geprägt ist. „Gottesfürchtige“ ist würdig und allgemein verständlich.
- source_word: ἐκ πειρασμοῦ
  choice: aus der Prüfung
  rationale: πειρασμός kann Versuchung, Erprobung oder Bedrängnis bezeichnen. Im Rückblick auf Noah und Lot steht eine belastende Prüfungssituation im Vordergrund; die mögliche Bedeutung „Versuchung“ bleibt in einer Fußnote erhalten.
- source_word: ῥύεσθαι
  choice: retten
  rationale: ῥύομαι bezeichnet das Herausretten aus Gefahr oder Not. „Retten“ ist prägnant und im Deutschen natürlich.
- source_word: ἀδίκους
  choice: die Ungerechten
  rationale: Die substantivische Wiedergabe bewahrt sowohl den moralischen als auch den gerichtlichen Gehalt von ἄδικος.
- source_word: εἰς ἡμέραν κρίσεως
  choice: bis zum Tag des Gerichts
  rationale: In Verbindung mit τηρεῖν bezeichnet εἰς das zeitliche Ziel des Verwahrens. „Bis zum“ gibt diese Ausrichtung idiomatisch wieder, ohne die alternative syntaktische Zuordnung auszuschließen.
- source_word: κολαζομένους
  choice: unter Strafe
  rationale: Das Präsenspartizip kann einen andauernden Strafzustand während des Verwahrens ausdrücken. „Unter Strafe“ erhält diesen durativen Sinn knapp und lässt die syntaktische Mehrdeutigkeit bestehen.
- source_word: τηρεῖν
  choice: verwahren
  rationale: τηρέω bedeutet hier bewahren, festhalten oder für einen bestimmten Zeitpunkt aufbehalten. „Verwahren“ passt zum gerichtlichen Zusammenhang und zur Konstruktion mit dem Tag des Gerichts.
theological_decisions:
- issue: Bedeutung von πειρασμός
  choice: Prüfung beziehungsweise Erprobung
  alternative: Versuchung
  rationale: Die vorausgehenden Beispiele handeln von Rettung aus bedrängenden Gerichtssituationen. Daher passt „Prüfung“ im Kontext besser, ohne die lexikalisch mögliche Bedeutung „Versuchung“ zu leugnen.
- issue: Syntaktische Funktion von κολαζομένους
  choice: Die Ungerechten werden bis zum Gerichtstag in einem andauernden Strafzustand verwahrt.
  alternative: Die Ungerechten werden für den Gerichtstag aufbewahrt, um dann bestraft zu werden.
  rationale: Das Präsenspartizip legt eine gegenwärtig andauernde Bestrafung nahe, doch die Konstruktion lässt auch einen Bezug der Bestrafung auf das künftige Gericht zu. Die Hauptfassung folgt der erstgenannten Deutung, während die Fußnote die echte Ambiguität offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Parallelismus, wird aber durch „weiß, wie er … kann“ idiomatisch gestaltet. „Gottesfürchtige“, „unter Strafe“ und „Tag des Gerichts“ bewahren den religiös-gerichtlichen Ton ohne konfessionelle Präzisierung.
