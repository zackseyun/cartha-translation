  naturalness: '„Unter Strafe verwahren“ ist im heutigen Standarddeutsch missverständlich: Es bezeichnet eher ein Verwahren aufgrund einer Strafmaßnahme als einen Zustand des Bestraftwerdens. „Während sie bestraft werden, verwahren“ ist idiomatisch und gibt den durativen Charakter des Partizips präzise wieder.'
  terminology: „der Herr“, „die Gottesfürchtigen“, „Prüfung“, „die Ungerechten“ und „Tag des Gerichts“ sind sachgerecht, registerangemessen und theologisch nicht überdeutet. „Verwahren“ passt im gerichtlichen Kontext.
