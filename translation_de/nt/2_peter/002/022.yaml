  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: de
  text: 'Auf sie trifft zu, was das wahre Sprichwort sagt: »Ein Hund kehrt zu seinem eigenen Erbrochenen zurück«, und[a] »Eine gewaschene Sau wälzt sich im Schlamm.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ein Hund, der zu seinem eigenen Erbrochenen zurückgekehrt ist«, und: »eine gewaschene Sau zum Wälzen im Schlamm.« Die erste Aussage greift Sprüche 26,11 auf.'
    reason: Formale Alternative und Querverweis; zugleich wird die elliptische Gestalt des griechischen Zitats sichtbar gemacht.
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: Auf sie trifft zu
  rationale: Das Perfekt bezeichnet einen eingetretenen, nun bestehenden Sachverhalt. Die deutsche Wendung gibt idiomatisch wieder, dass sich der Inhalt des Sprichworts an ihnen bewahrheitet hat.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: was das wahre Sprichwort sagt
  rationale: Die griechische Konstruktion ist elliptisch. Diese Wiedergabe macht den gemeinten Inhalt verständlich, ohne die Aussage über die Anwendung des Sprichworts hinaus auszudeuten.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Ein Hund kehrt zu seinem eigenen Erbrochenen zurück
  rationale: Die generische sprichwörtliche Aussage wird im Deutschen natürlich mit dem unbestimmten Artikel formuliert. »Erbrochenes« gibt ἐξέραμα deutlich und würdig wieder; die finite Form entspricht dem Sinn des elliptischen Zitats und dem Anklang an Sprüche 26,11.
- source_word: Ὗς λουσαμένη
  choice: Ein gewaschenes Schwein
  rationale: Ὗς kann Sau oder Schwein bedeuten. »Schwein« ist im heutigen Standarddeutsch die natürliche generische Bezeichnung; das feminine Genus ist für das Bild sachlich nicht entscheidend.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: wälzt sich wieder im Schlamm
  rationale: κυλισμός bezeichnet das Wälzen, βόρβορος Schlamm oder Morast. Das im Griechischen elliptisch fehlende Verb wird für einen vollständigen deutschen Satz aus dem Bild ergänzt; »wieder« bringt die Rückkehr zum früheren Zustand zum Ausdruck.
theological_decisions:
- issue: Kraft und Anwendung des elliptischen Sprichwortzitats
  choice: Der Inhalt des Sprichworts trifft auf die zuvor beschriebenen Personen zu und zeichnet ihre Rückkehr zum früheren Zustand bildhaft nach.
  alternative: Das wahre Sprichwort selbst ist ihnen widerfahren.
  rationale: Die gewählte idiomatische Form bewahrt die Warnung vor dem Rückfall, ohne festzulegen, welche weitergehende dogmatische Kategorie auf die Betroffenen anzuwenden ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, anschaulichem Ton. Die drastischen Bilder des Ausgangstextes bleiben erhalten; altertümliche Wörter wie »Kot« oder »Morast« werden vermieden.
