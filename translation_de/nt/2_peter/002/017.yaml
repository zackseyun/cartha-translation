id: 2PE.2.17
reference: 2 Peter 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: de
  text: Diese Menschen sind wasserlose Quellen und Nebelschwaden, die vom Sturm dahingetrieben werden. Für sie ist das Dunkel der Finsternis aufbewahrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für sie ist die Schwärze der Finsternis vorbehalten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: wasserlose Quellen
  rationale: πηγή bezeichnet gewöhnlich eine Quelle und nicht einen gegrabenen Brunnen; ἄνυδρος bedeutet „ohne Wasser“. Die Formulierung bewahrt das eindringliche Bild enttäuschter Erwartung.
- source_word: ὁμίχλαι
  choice: Nebelschwaden
  rationale: ὁμίχλη bezeichnet Nebel oder Dunst. „Nebelschwaden“ ist im Deutschen anschaulich und passt zum Plural sowie zum Bild flüchtiger, vom Sturm getriebener Erscheinungen.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: die vom Sturm dahingetrieben werden
  rationale: λαῖλαψ bezeichnet einen heftigen Sturm; das passive ἐλαυνόμεναι drückt aus, dass die Nebelschwaden von ihm getrieben werden.
- source_word: οἷς
  choice: für sie
  rationale: Das Relativpronomen verweist sachlich auf die mit „Diese Menschen“ bezeichneten Irrlehrer, nicht auf die dazwischenstehenden Bildwörter.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: das Dunkel der Finsternis
  rationale: Die Wiedergabe erhält die zweigliedrige, verstärkende Wendung aus ζόφος und σκότος, ohne sie zu einer erklärenden Umschreibung zu glätten.
- source_word: τετήρηται
  choice: ist aufbewahrt
  rationale: Das Perfekt Passiv von τηρέω bezeichnet etwas, das aufbewahrt beziehungsweise vorbehalten worden ist und weiterhin bereitsteht. „Ist aufbewahrt“ erhält sowohl das Passiv als auch den fortbestehenden Zustand.
theological_decisions:
- issue: Gerichtsaussage im Schlusssatz
  choice: Das Passiv bleibt ohne ausdrückliche Nennung des Handelnden stehen.
  alternative: „Gott hat für sie … aufbewahrt“ oder „… ist ihnen vorbehalten“.
  rationale: Der griechische Text deutet göttliches Gericht an, nennt Gott als Handelnden jedoch nicht ausdrücklich. Die Übersetzung fügt den Handelnden deshalb nicht ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Diese Menschen“ macht den persönlichen Bezug des einleitenden Οὗτοι klar. „Nebelschwaden“ gibt ὁμίχλαι genauer wieder als das breitere „Wolken“. Der Fußnotenmarker steht unmittelbar nach der betreffenden Schlussaussage.
