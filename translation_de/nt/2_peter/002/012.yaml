id: 2PE.2.12
reference: 2 Peter 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: de
  text: Doch diese sind wie Tiere ohne Vernunft, von Natur aus dazu geboren, eingefangen und vernichtet zu werden. Sie lästern über das, was sie nicht verstehen[a], und werden in ihrem Verderben ebenfalls verderben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie schmähen, was sie nicht kennen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht hier eine Wiederholung verwandter Wörter: „in ihrem Verderben werden sie auch verderben“. Gemeint sein kann ihr Untergang; „Verderben“ kann zugleich den Beiklang von Verderbtheit tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: Tiere ohne Vernunft
  rationale: Die Wendung bezeichnet Tiere, denen vernünftige Einsicht fehlt. „Tiere ohne Vernunft“ ist im modernen Deutsch klar und bewahrt den polemischen Vergleich.
- source_word: γεγεννημένα φυσικὰ
  choice: von Natur aus dazu geboren
  rationale: Die knappe griechische Verbindung von Partizip und Adjektiv beschreibt Wesen, deren angeborene Natur ihr Verhalten bestimmt. Die Formulierung erhält sowohl den Geburtsgedanken als auch den Bezug auf die Natur.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: eingefangen und vernichtet zu werden
  rationale: εἰς bezeichnet hier Ziel oder Bestimmung; ἅλωσις meint das Gefangenwerden, φθορά die Vernichtung beziehungsweise den Untergang.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: über das, was sie nicht verstehen
  rationale: Das sächliche Relativpronomen verweist wahrscheinlich auf Sachverhalte. „Nicht verstehen“ gibt die gemeinte Unkenntnis im Zusammenhang ihrer anmaßenden Rede natürlich wieder.
- source_word: βλασφημοῦντες
  choice: sie lästern
  rationale: βλασφημέω bezeichnet verleumderische, schmähende oder gotteslästerliche Rede. „Lästern“ bewahrt die Stärke des Ausdrucks, ohne den im Vers ungenannten Gegenstand näher festzulegen.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: werden in ihrem Verderben ebenfalls verderben
  rationale: Die Wiederholung von φθορά und dem verwandten Verb φθείρω wird durch „Verderben/verderben“ sichtbar gehalten. „Ebenfalls“ gibt καί wieder.
theological_decisions:
- issue: Bedeutung von βλασφημοῦντες
  choice: „lästern“ als starker, aber hinsichtlich des Gegenstands offener Ausdruck
  alternative: „schmähen“ oder „verleumden“
  rationale: Der griechische Ausdruck kann gotteslästerliche wie allgemein schmähende Rede bezeichnen. Die Übersetzung soll die Schwere der Aussage nicht abschwächen, aber auch keinen Gegenstand ergänzen.
- issue: Bedeutung von φθορά und φθαρήσονται
  choice: Wiedergabe mit „Verderben/verderben“
  alternative: „Vernichtung/vernichtet werden“ oder „Verderbnis/verdorben werden“
  rationale: Das Bild vom Einfangen und Vernichten spricht für Untergang beziehungsweise Gericht; die verwandten deutschen Wörter bewahren zugleich das auffällige griechische Wortspiel und lassen den genauen Charakter des Verderbens offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, deutlich polemischem Ton. Die ungewöhnliche Wiederholung „Verderben … verderben“ ist bewusst beibehalten, um das griechische Wortspiel und seine Spannung sichtbar zu machen.
