source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: de
  text: Denn für sie wäre es besser gewesen, den Weg der Gerechtigkeit[a] nicht erkannt zu haben, als sich, nachdem sie ihn erkannt hatten, wieder von dem heiligen Gebot abzuwenden[b], das ihnen überliefert worden war[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Pfad der Gerechtigkeit“. δικαιοσύνη kann auch „Recht“ bedeuten; hier passt „Gerechtigkeit“ am besten zum Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem heiligen Gebot den Rücken zu kehren“ oder „sich vom heiligen Gebot abzuwenden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das ihnen weitergegeben worden war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον … ἦν
  choice: es wäre … besser gewesen
  rationale: Die idiomatische deutsche Form gibt den rückblickenden Vergleich und den irrealen Sinn der Konstruktion natürlich wieder.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: erkannt zu haben / nachdem sie ihn erkannt hatten
  rationale: Die Wiederholung von ἐπιγινώσκω bleibt sichtbar. „Erkennen“ bezeichnet hier ein tatsächliches Kennenlernen, ohne die Vorsilbe durch „vollständig“ zu überdeuten.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: den Weg der Gerechtigkeit
  rationale: „Weg“ bewahrt das Bild für Lebensführung oder Lebensrichtung; „Gerechtigkeit“ entspricht dem ethisch-religiösen Sinn von δικαιοσύνη in diesem Zusammenhang.
- source_word: ὑποστρέψαι ἐκ
  choice: sich … von … abzuwenden
  rationale: Die Formulierung gibt die Abkehr von dem zuvor Erkannten in natürlichem Deutsch wieder; die mögliche Nuance einer Rückwendung wird in der Fußnote kenntlich gemacht.
- source_word: παραδοθείσης
  choice: übergeben worden war
  rationale: Das passive Partizip bezeichnet die Weitergabe beziehungsweise Übermittlung des Gebots, ohne eine besondere Traditions- oder Treuhänderschaftslehre einzutragen.
- source_word: ἁγίας ἐντολῆς
  choice: dem heiligen Gebot
  rationale: Der Singular und das religiös-moralische Gewicht des Ausdrucks bleiben erhalten.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ macht die begründende Verbindung zum vorausgehenden Vers knapp und idiomatisch deutlich.
theological_decisions:
- issue: Abfall vom Glauben oder nur oberflächliches Bekenntnis
  choice: Die Übersetzung spricht von wirklichem Erkennen und anschließender Abkehr, ohne daraus ausdrücklich den Verlust des Heils abzuleiten.
  alternative: Die Formulierung entweder zu verstärken, sodass sie eindeutig Heilsverlust lehrt, oder abzuschwächen, sodass sie nur oberflächliche Bekanntschaft bezeichnet.
  rationale: Der griechische Text stellt Erkenntnis und Umkehr vom übergebenen heiligen Gebot fest, entscheidet aber die weitergehende konfessionelle Frage nicht ausdrücklich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am griechischen Vergleich, wird aber durch die deutsche Nebensatzstellung natürlich lesbar. Das Pronomen „ihn“ nimmt eindeutig „den Weg“ auf.
