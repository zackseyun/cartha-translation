  to: Denn für sie wäre es besser gewesen, den Weg der Gerechtigkeit[a] nicht erkannt zu haben, als sich, nachdem sie ihn erkannt hatten, wieder von dem heiligen Gebot abzuwenden[b], das ihnen überliefert worden war[c].
