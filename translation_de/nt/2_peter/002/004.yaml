id: 2PE.2.4
reference: 2 Peter 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: de
  text: Denn wenn Gott die Engel nicht verschonte, als sie sündigten, sondern sie in den Tartaros[a] hinabstürzte und sie in Ketten der Finsternis[b] zur Verwahrung für das Gericht übergab,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Hölle hinabstürzte“. Das griechische Verb bedeutet genauer, jemanden in den Tartaros zu verstoßen.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften haben statt „Ketten der Finsternis“: „Gruben der Finsternis“.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: verschonte nicht
  rationale: Die geläufige deutsche Wendung gibt im Zusammenhang des Gerichts wieder, dass Gott von der Bestrafung nicht absah.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: die Engel …, als sie sündigten
  rationale: Der Genitiv mit Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben; dadurch bleibt der ereignishafte Sinn erhalten.
- source_word: ταρταρώσας
  choice: sie in den Tartaros hinabstürzte
  rationale: Das seltene Verb ταρταρόω bezeichnet spezifisch das Verstoßen in den Tartaros. Die Wiedergabe bewahrt dieses besondere Bild, statt es mit dem allgemeineren Begriff „Hölle“ gleichzusetzen.
- source_word: σειραῖς ζόφου
  choice: in Ketten der Finsternis
  rationale: σειραί bezeichnet Ketten; ζόφος meint bedrückende, düstere Finsternis. Die knappe Genitivverbindung erhält das verdichtete Bild und legt nicht fest, ob die Ketten wörtlich oder bildlich zu verstehen sind.
- source_word: παρέδωκεν
  choice: übergab
  rationale: παραδίδωμι bezeichnet hier das Übergeben in Gewahrsam und passt zum folgenden Gerichtsmotiv.
- source_word: εἰς κρίσιν
  choice: dem Gericht …, für das
  rationale: κρίσις bezeichnet das bevorstehende Gericht, ohne das Urteil bereits als Verurteilung festzulegen.
- source_word: τηρουμένους
  choice: sie verwahrt werden
  rationale: Das passive Präsenspartizip beschreibt ihren fortdauernden Gewahrsam bis zum bevorstehenden Gericht.
theological_decisions:
- issue: Wiedergabe von ταρταρώσας ohne spätere dogmatische Begriffe in den Text einzutragen
  choice: in den Tartaros hinabstürzte
  alternative: in die Hölle hinabstürzte
  rationale: Der spezifische griechische Ausdruck wird beibehalten. „Hölle“ wäre verständlicher, würde das antike Bild aber verallgemeinern und möglicherweise mit späteren Vorstellungen gleichsetzen.
- issue: Verhältnis zwischen Tartaros, Ketten der Finsternis und dem Verwahrtwerden für das Gericht
  choice: hinabstürzte und sie in Ketten der Finsternis dem Gericht übergab, für das sie verwahrt werden
  alternative: in Ketten der Finsternis in den Tartaros stürzte, wo sie bis zum Gericht verwahrt werden
  rationale: Die gewählte Fassung bewahrt die gedrängte Abfolge und vermeidet eine zusätzliche räumliche Festlegung durch „wo“. Zugleich bleibt offen, ob die Ketten instrumental, örtlich oder bildlich gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tartaros“ bleibt als erklärungsbedürftiger, aber quellennaher Begriff erhalten; die Fußnote bietet die geläufigere Alternative. Der Vers endet mit einem Komma, weil der mit „wenn“ eröffnete Bedingungssatz im folgenden Kontext weitergeführt wird.
