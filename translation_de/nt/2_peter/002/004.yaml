  to: Denn wenn Gott die Engel nicht verschonte, als sie sündigten, sondern sie in den Tartaros[a] hinabstürzte und sie in Ketten der Finsternis[b] zur Verwahrung für das Gericht übergab,
  rationale: Die Änderung ordnet „für das Gericht“ der Verwahrung zu und bewahrt damit die syntaktische und semantische Beziehung von παρέδωκεν, εἰς κρίσιν und τηρουμένους. Sie ergänzt keine Aussage über Art oder Ort der Ketten und erhält den offenen, fortlaufenden Bedingungssatz.
