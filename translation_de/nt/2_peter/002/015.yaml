id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: de
  text: Sie verließen den geraden Weg und gingen in die Irre, indem sie dem Weg Bileams, des Sohnes Bosors,[a] folgten, der den Lohn der Ungerechtigkeit liebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht »Bosor«; im Alten Testament wird Bileam gewöhnlich als Sohn Beors bezeichnet.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: sie haben … verlassen
  rationale: Das Aoristpartizip bezeichnet eine dem Hauptgeschehen vorausgehende Handlung. »Verlassen« gibt den bewussten Abschied vom Weg natürlich und ohne unnötige Verstärkung wieder.
- source_word: εὐθεῖαν ὁδὸν
  choice: den geraden Weg
  rationale: Die wörtliche Wegmetapher bleibt erhalten; »gerade« gibt εὐθεῖαν präziser wieder als die stärker deutende Wiedergabe »richtig«.
- source_word: ἐπλανήθησαν
  choice: sind in die Irre gegangen
  rationale: Die Form wird intransitiv wiedergegeben und behält ihren moralisch-religiösen Sinn, ohne einen im Satz nicht genannten Verführer einzuführen.
- source_word: ἐξακολουθήσαντες
  choice: indem sie … folgten
  rationale: Die Wiedergabe lässt das Partizip als Begleitumstand beziehungsweise Mittel des Irrgehens verstehen und ergibt zugleich einen natürlichen deutschen Satz.
- source_word: τῇ ὁδῷ τοῦ Βαλαὰμ
  choice: dem Weg Bileams
  rationale: Die erneute Verwendung von »Weg« bewahrt die bewusste Gegenüberstellung der beiden Wege.
- source_word: τοῦ Βοσὸρ
  choice: des Sohnes Bosors
  rationale: Der zweite Genitiv wird im Kontext als Abstammungsangabe verständlich gemacht; die im griechischen Text stehende Namensform »Bosor« bleibt erhalten.
- source_word: μισθὸν ἀδικίας
  choice: den Lohn der Ungerechtigkeit
  rationale: Die knappe Genitivverbindung bewahrt sowohl die Vorstellung einer Gegenleistung als auch die moralisch-theologische Tragweite von ἀδικία.
- source_word: ἠγάπησεν
  choice: liebte
  rationale: Die direkte Wiedergabe entspricht dem Aorist von ἀγαπάω und erhält die starke Aussage über Bileams Zuneigung zu diesem Lohn.
theological_decisions:
- issue: Moralische Wegmetaphorik
  choice: »den geraden Weg« und »dem Weg Bileams«
  alternative: »den richtigen Weg« und »Bileams Lebensweise«
  rationale: Die wiederholte Wegsprache des griechischen Textes wird bewahrt, ohne sie als abstrakte Lehraussage oder bloße Lebensführung auszudeuten.
- issue: Namensform Βοσόρ
  choice: Bosor im Haupttext, Beor in der Fußnote
  alternative: Beor im Haupttext
  rationale: Originalsprachliche Priorität verlangt die Wiedergabe der griechischen Form; die aus dem Alten Testament vertraute Form wird zur Identifikation transparent in der Fußnote genannt.
- issue: Verhältnis des Partizips ἐξακολουθήσαντες zum Hauptverb
  choice: 'instrumental beziehungsweise modal: »indem sie … folgten«'
  alternative: 'zeitlich: »nachdem sie … gefolgt waren«'
  rationale: Der Zusammenhang legt nahe, dass das Folgen des Weges Bileams ihr Irrgehen näher beschreibt beziehungsweise bewirkt. Die Wiedergabe behauptet jedoch keine ausdrücklich genannte äußere Verursachung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die konkrete Wegmetapher und die knappe theologische Formulierung »Lohn der Ungerechtigkeit« bleiben erhalten.
