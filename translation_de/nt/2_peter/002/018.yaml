source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: de
  text: Denn indem sie hochtrabende, inhaltsleere Reden führen, locken sie durch Begierden des Fleisches und Ausschweifungen diejenigen an, die den Menschen, die im Irrtum leben, kaum entkommen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gerade erst den Menschen entkommen, die im Irrtum leben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch fleischliche Begierden und Ausschweifungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: hochtrabende, inhaltsleere Reden
  rationale: ὑπέρογκα bezeichnet übermäßig aufgeblasene oder prahlerische Äußerungen; ματαιότητος kennzeichnet sie als leer und gehaltlos. „Reden“ wird aus dem Zusammenhang mit φθεγγόμενοι ergänzt.
- source_word: φθεγγόμενοι
  choice: sie führen … Reden
  rationale: Das Partizip beschreibt die Art und Weise ihres Lockens. Die deutsche Wendung gibt den Sprechakt natürlich wieder.
- source_word: δελεάζουσιν
  choice: locken … an
  rationale: Das Verb bezeichnet das Anlocken wie mit einem Köder und bewahrt hier die verführerische Wirkung.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: durch Begierden des Fleisches
  rationale: ἐν wird als Mittel verstanden. Die Formulierung bewahrt die Metapher von σάρξ, ohne sie durch eine dogmatisch stärker festgelegte Wendung wie „sündige Natur“ zu ersetzen.
- source_word: ἀσελγείαις
  choice: Ausschweifungen
  rationale: Der Plural bezeichnet zügellose, schamlose Verhaltensweisen; „Ausschweifungen“ wahrt den Handlungsbezug und die grammatische Mehrzahl.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: kaum entkommen
  rationale: Nach dem hier gedruckten Text modifiziert ὀλίγως das Entkommen und bezeichnet es als knapp oder prekär. Das Präsenspartizip wird im Deutschen idiomatisch wiedergegeben, ohne einen endgültig abgeschlossenen Heilszustand zu behaupten.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: den Menschen, die im Irrtum leben
  rationale: ἀναστρεφομένους bezeichnet die Lebensführung, πλάνη einen Zustand des Irrtums oder der Verführung. Die Wiedergabe ist idiomatisch und lässt die moralisch-geistliche Dimension offen.
theological_decisions:
- issue: Bedeutung von σάρξ im moralischen Zusammenhang
  choice: Begierden des Fleisches
  alternative: fleischliche Begierden; Begierden der sündigen Natur
  rationale: Die wörtlich-metaphorische Formulierung bewahrt die theologische Spannung des griechischen Ausdrucks und vermeidet die Festlegung auf eine systematische Lehre von der „sündigen Natur“.
- issue: Status der Angelockten
  choice: die … kaum entkommen
  alternative: die gerade erst entkommen; die tatsächlich entkommen sind
  rationale: Die Formulierung bewahrt den prekären, möglicherweise noch andauernden Charakter ihres Entkommens und trifft keine weitergehende Aussage über ihren Heilsstatus.
- issue: Bezugsgruppe des Entkommens
  choice: den Menschen, die im Irrtum leben
  alternative: dem Irrtum selbst
  rationale: Die Syntax bezieht das zweite τοὺς am natürlichsten auf die Personengruppe, der die Angelockten entkommen; die Übersetzung vermeidet eine darüber hinausgehende theologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hochtrabend“ und „inhaltsleer“ vermitteln die aufgeblasene und zugleich nichtige Rede verständlich; „Ausschweifungen“ ist gehoben, aber allgemein verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
