  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: de
  text: und in der Erkenntnis die Selbstbeherrschung, und in der Selbstbeherrschung die Standhaftigkeit[a] und in der Standhaftigkeit die Frömmigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Ausdauer“, „Beharrlichkeit“ oder „geduldiges Ausharren“ für „Standhaftigkeit“ (ὑπομονή).
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen ist die Formulierung verkürzt; sie setzt die Tugendkette aus dem vorhergehenden Vers fort: Zu jeder Eigenschaft ist jeweils die nächste hinzuzufügen.'
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt γνῶσις in diesem Tugendkatalog unmittelbar wieder und fügt sich in die fortlaufende Kette ein.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: Selbstbeherrschung
  rationale: Der Ausdruck bezeichnet die Herrschaft über eigene Wünsche und Impulse; „Selbstbeherrschung“ ist im heutigen Deutsch klar und ethisch treffend.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: Standhaftigkeit
  rationale: ὑπομονή bezeichnet beständiges Ausharren unter Belastungen. „Standhaftigkeit“ wahrt sowohl den aktiven als auch den ausdauernden Aspekt.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Gemeint ist eine ehrfürchtige, im Leben sichtbare Hinwendung zu Gott. „Gottesfurcht“ bringt den Gottesbezug deutlicher zum Ausdruck als das heute teils missverständliche „Frömmigkeit“.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: und in der ... die ...
  rationale: Die wiederholte Präposition und die elliptische Gestalt des griechischen Tugendkatalogs bleiben erhalten; der aus Vers 5 zu ergänzende Gedanke wird nicht paraphrasierend ausgebaut.
- source_word: δέ
  choice: und
  rationale: δέ verbindet hier die Glieder der Aufzählung und bezeichnet keinen ausgeprägten Gegensatz.
theological_decisions:
- issue: Elliptische Syntax der Tugendkette
  choice: Die knappe Struktur „in der … die …“ wird beibehalten.
  alternative: „Ergänzt eure Erkenntnis durch Selbstbeherrschung …“
  rationale: Der griechische Text setzt die Aufforderung aus dem vorhergehenden Vers voraus. Die komprimierte Form bewahrt den Zusammenhang, ohne zusätzliche Beziehungen zwischen den Tugenden festzulegen.
- issue: Wiedergabe von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit; Gottesverehrung; ein Leben in Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ wahrt die ehrfürchtige Ausrichtung auf Gott und vermeidet sowohl einen rein äußerlichen Frömmigkeitsbegriff als auch eine ausdeutende Umschreibung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele, knappe Satzform des griechischen Tugendkatalogs bleibt hörbar; veraltete Begriffe wie „Mäßigkeit“ werden vermieden.
