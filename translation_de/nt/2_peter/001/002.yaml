  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: de
  text: Gnade und Frieden mögen euch in der Erkenntnis Gottes und Jesu, unseres Herrn, reichlich zuteilwerden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch die Erkenntnis Gottes und Jesu, unseres Herrn«. Die griechische Präposition kann den Bereich (»in«) oder das Mittel (»durch«, »mittels«) bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »volle Erkenntnis« beziehungsweise »genaue Erkenntnis«. Das griechische Wort kann eine vertiefte oder vollständigere Erkenntnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Bewahrt den üblichen neutestamentlichen Gruß- und Segensbegriff sowie den theologischen Sinn göttlicher Zuwendung.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Entspricht dem geläufigen Grußwort und erhält dessen umfassenden, wahrscheinlich semitisch geprägten Sinn.
- source_word: πληθυνθείη
  choice: sollen … immer reicher zuteilwerden
  rationale: Gibt den Optativ als Segenswunsch wieder und bewahrt mit „zuteilwerden“ die passive Bedeutung; „immer reicher“ drückt die erbetene Mehrung natürlich aus.
- source_word: ἐν
  choice: in
  rationale: Die direkte Wiedergabe lässt offen, ob Erkenntnis als Bereich oder als Mittel der Mehrung verstanden wird.
- source_word: ἐπιγνώσει
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist im Deutschen natürlich und kann mehr als bloßes Faktenwissen bezeichnen, ohne die mögliche verstärkte Bedeutung ausdrücklich festzulegen.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: Gottes und Jesu, unseres Herrn
  rationale: Beide Genitive werden von „Erkenntnis“ abhängig wiedergegeben; die Apposition kennzeichnet Jesus als „unseren Herrn“, ohne die Beziehung der beiden genannten Personen umzudeuten.
theological_decisions:
- issue: Bedeutungsnuance von ἐπίγνωσις
  choice: Erkenntnis
  alternative: volle Erkenntnis; genaue Erkenntnis
  rationale: Der Ausdruck kann eine vertiefte oder vollständige Erkenntnis bezeichnen. Der Haupttext vermeidet jedoch eine Festlegung, die über den unmittelbaren Wortlaut hinausgeht; die stärkere Nuance steht in der Fußnote.
- issue: Funktion von ἐν bei ἐπιγνώσει
  choice: in der Erkenntnis
  alternative: durch die Erkenntnis; mittels der Erkenntnis
  rationale: Das Griechische erlaubt sowohl eine lokale beziehungsweise bereichsbezogene als auch eine instrumentale Deutung. „In“ bewahrt diese Spannung am ehesten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Segensformel ist idiomatisch formuliert; „sollen … zuteilwerden“ macht den Wunschcharakter des griechischen Optativs deutlich. Die Fußnotenmarker stehen gesammelt am Satzende und sind vollständig im Haupttext vorhanden.
