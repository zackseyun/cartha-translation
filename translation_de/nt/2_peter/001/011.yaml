id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: de
  text: Denn auf diese Weise wird euch der Eintritt[a] in das ewige Reich unseres Herrn und Retters Jesus, des Messias,[b] reichlich gewährt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Eingang“. Das griechische Wort kann sowohl den Eintritt als Vorgang als auch den Eingang beziehungsweise Zugang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „Jesus Christus“. Das griechische Χριστός bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: Denn so
  rationale: „Denn“ bewahrt den begründenden Anschluss von γάρ an den vorherigen Vers; „so“ gibt den rückverweisenden Charakter von οὕτως knapp und natürlich wieder.
- source_word: πλουσίως
  choice: reichlich
  rationale: Das Adverb bezeichnet eine Fülle beziehungsweise Großzügigkeit und lässt sich im Deutschen idiomatisch mit „reichlich gewährt“ verbinden.
- source_word: ἐπιχορηγηθήσεται
  choice: wird … gewährt werden
  rationale: Die Form ist Futur Passiv. „Gewährt werden“ bewahrt das Passiv und passt natürlich zum Eingang in ein Reich, ohne ausdrücklich festzulegen, wer ihn gewährt.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ wird unmittelbar mit „euch“ wiedergegeben und bezeichnet die Begünstigten.
- source_word: ἡ εἴσοδος
  choice: der Eingang
  rationale: εἴσοδος kann sowohl den Vorgang des Eintretens als auch den Eingang beziehungsweise Zugang bezeichnen. „Der Eingang“ bewahrt diese Bildhaftigkeit und entspricht dem bestimmten Artikel.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: in das ewige Reich
  rationale: Eine direkte und im biblischen Deutsch geläufige Wiedergabe; „ewig“ entspricht hier dem eschatologischen Sinn von αἰώνιος.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: unseres Herrn und Retters
  rationale: Die gemeinsame Artikelkonstruktion verbindet beide Titel mit derselben Person. „Retter“ ist eine klare, moderne Wiedergabe von σωτήρ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός wird seiner Bedeutung entsprechend als Titel „Messias“ übersetzt. Die Apposition mit Artikel ist im Deutschen idiomatisch und macht den Titel erkennbar.
theological_decisions:
- issue: Bezug von „unseres Herrn und Retters“
  choice: Beide Titel beziehen sich auf Jesus, den Messias.
  alternative: Eine lockerere Lesart könnte die Titel auf verschiedene Referenten beziehen.
  rationale: Der eine griechische Artikel vor zwei durch καί verbundenen singularischen Personenbezeichnungen und der anschließende Name sprechen deutlich für einen einzigen Referenten. Diese syntaktische Aussage wird bewahrt, ohne darüber hinausgehende dogmatische Formulierungen einzutragen.
- issue: Bedeutung von Χριστός
  choice: Als bedeutungstragenden Titel „Messias“ übersetzt.
  alternative: 'Traditionell: „Christus“.'
  rationale: Χριστός ist die griechische Entsprechung des Titels „Messias“ beziehungsweise „Gesalbter“. „Messias“ bewahrt den Titelcharakter für heutige Leser deutlicher; die traditionelle Form wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt weitgehend dem griechischen Aufbau, bleibt aber flüssig. „Reichlich gewährt werden“ erhält sowohl das Passiv als auch die Füllebedeutung des Adverbs. Alle Fußnotenmarker stehen im Haupttext.
