  naturalness: „Ihr tut gut daran, darauf zu achten wie auf eine Lampe“ ist modernes, würdiges Deutsch. „Und so steht das prophetische Wort umso fester“ ist deutlich natürlicher als „besitzen wir ... umso fester“ und bindet die Steigerung eindeutig an das prophetische Wort. Der Marker zur Anmerkung über den Morgenstern sollte direkt bei „Morgenstern“ stehen, nicht am Satzende.
  terminology: „prophetisches Wort“, „Lampe“, „dunkler Ort“, „Morgenstern“ und „Herzen“ sind sachgerecht und registergerecht. Die Fußnote zu βεβαιότερον bewahrt die legitime syntaktisch-kontextuelle Mehrdeutigkeit. Die zurückhaltende Formulierung eines möglichen messianischen Anklangs beim „Morgenstern“ legt keine Deutung fest.
