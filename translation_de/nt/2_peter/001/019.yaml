revisions:
- from: Und so besitzen wir das prophetische Wort umso fester[a]. Ihr tut gut daran, darauf zu achten wie auf eine Lampe, die an einem dunklen Ort leuchtet, bis der Tag anbricht und der Morgenstern in euren Herzen aufgeht.[b]
  to: Und so steht das prophetische Wort umso fester[a], und ihr tut gut daran, darauf zu achten wie auf eine Lampe, die an einem dunklen Ort leuchtet, bis der Tag anbricht und der Morgenstern[b] in euren Herzen aufgeht.
  rationale: Die Revision löst die im Deutschen missverständliche Verbindung von „besitzen“ und „umso fester“ auf, indem sie die Festigkeit klar dem prophetischen Wort zuschreibt. „Und so“ und „umso“ erhalten den vom Kontext nahegelegten Bezug, ohne ausdrücklich zu entscheiden, ob die Steigerung eine Bestätigung durch das Augenzeugenzeugnis oder eine Hervorhebung der eigenen Gewissheit des prophetischen Wortes ausdrückt. Der Marker [b] wird an seinen sachlichen Bezugspunkt versetzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:48:43Z'
