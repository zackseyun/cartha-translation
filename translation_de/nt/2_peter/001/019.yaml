id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: de
  text: Und so steht das prophetische Wort umso fester[a], und ihr tut gut daran, darauf zu achten wie auf eine Lampe, die an einem dunklen Ort leuchtet, bis der Tag anbricht und der Morgenstern[b] in euren Herzen aufgeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und wir haben das festere prophetische Wort.“ Der griechische Wortlaut kann so verstanden werden, dass das prophetische Wort durch das apostolische Zeugnis bestätigt wird, oder so, dass seine besondere Zuverlässigkeit hervorgehoben wird.'
    reason: alternative_reading
  - marker: b
    text: „Morgenstern“ kann an ein messianisches Bild anklingen; vergleiche Offenbarung 22,16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: umso fester
  rationale: Der Komparativ bleibt sichtbar und kann im Zusammenhang eine zusätzliche Bestätigung des prophetischen Wortes durch das zuvor geschilderte apostolische Zeugnis ausdrücken, ohne ausdrücklich ein Bewirktwerden in den griechischen Text einzutragen.
- source_word: τὸν προφητικὸν λόγον
  choice: das prophetische Wort
  rationale: Eine natürliche, formal nahe Wiedergabe, die sowohl λόγος als auch die adjektivische Bestimmung bewahrt.
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: Ihr tut gut daran, darauf zu achten
  rationale: Gibt die anerkennende Wendung καλῶς ποιεῖτε und das aufmerksame Sich-Richten auf etwas verständlich und idiomatisch wieder.
- source_word: λύχνῳ φαίνοντι
  choice: eine Lampe, die ... leuchtet
  rationale: Bewahrt den Vergleich und den fortdauernden Charakter des Partizips in natürlichem Deutsch.
- source_word: ἐν αὐχμηρῷ τόπῳ
  choice: an einem dunklen Ort
  rationale: Passt zur Lichtmetaphorik und gibt den Sinn von düster, finster oder schummrig klar wieder.
- source_word: ἕως οὗ ἡμέρα διαυγάσῃ
  choice: bis der Tag anbricht
  rationale: Eine idiomatische Wiedergabe der zeitlichen Fügung und des Bildes vom beginnenden Tageslicht.
- source_word: φωσφόρος
  choice: der Morgenstern
  rationale: Im astralen Bild bezeichnet das Wort den lichtbringenden Morgenstern; die Wiedergabe ist geläufig und lässt mögliche messianische Bezüge offen.
- source_word: ἀνατείλῃ
  choice: aufgeht
  rationale: Für ein Gestirn ist „aufgehen“ die natürliche deutsche Entsprechung und bewahrt die Bildsprache.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: in euren Herzen
  rationale: Direkte, idiomatische Wiedergabe, ohne den biblisch weiten Sinn von „Herz“ interpretierend einzuengen.
theological_decisions:
- issue: Bezug und Sinn des Komparativs βεβαιότερον
  choice: „das prophetische Wort umso fester“
  alternative: „das festere prophetische Wort“ oder „das prophetische Wort als noch zuverlässiger“
  rationale: Die Formulierung lässt erkennen, dass das prophetische Wort im Licht des apostolischen Augenzeugenzeugnisses zusätzlich bestätigt beziehungsweise umso feststehender ist. Zugleich behauptet sie nicht ausdrücklich, es sei zuverlässiger als dieses Zeugnis, und trägt kein im Griechischen unausgesprochenes „gemacht“ ein.
- issue: Referent des Morgensterns
  choice: Das Bild „Morgenstern“ bleibt im Haupttext ohne ausdrückliche Identifizierung stehen.
  alternative: Ausdrückliche Deutung auf Christus oder auf endzeitliche Erleuchtung
  rationale: Der Kontext und weitere neutestamentliche Stellen können einen messianischen Nachklang nahelegen, doch der Vers selbst identifiziert das Bild nicht ausdrücklich. Die Übersetzung bewahrt daher die theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Umso fester“ hält den Komparativ idiomatisch fest; „darauf zu achten“ ist gegenwärtig und allgemein verständlich. Die Satzgliederung vermeidet einen überlangen deutschen Satz, ohne den Gedankengang zu verändern. Alle Fußnotenmarker stehen im Haupttext.
