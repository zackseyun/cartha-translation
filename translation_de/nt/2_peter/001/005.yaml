  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: de
  text: Und gerade deshalb setzt allen Eifer daran, euren Glauben um Tugend[a] und die Tugend um Erkenntnis zu ergänzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: πίστις („Glaube“) kann je nach Zusammenhang auch „Vertrauen“ oder „Treue“ bedeuten. Für ἀρετή („Tugend“) ist auch „moralische Vortrefflichkeit“ möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher kann die Abfolge lauten: „Stellt in eurem Glauben Tugend bereit, in der Tugend aber Erkenntnis.“ Das hier mit „ergänzen“ wiedergegebene Verb kann auch „bereitstellen“, „darbieten“ oder „hinzufügen“ bedeuten und kann reichliches Ausstatten anklingen lassen.'
    reason: source_structure_and_lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Und eben deshalb
  rationale: Die Wendung knüpft nachdrücklich an die vorausgehende Begründung an; „eben deshalb“ gibt dies in natürlichem Deutsch wieder.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: setzt allen Eifer daran
  rationale: Das Partizip bezeichnet den vollen, ernsthaften Einsatz, der die Aufforderung begleitet. Die deutsche Verbform ist idiomatisch und bewahrt den Nachdruck.
- source_word: ἐπιχορηγήσατε
  choice: ergänzt … durch
  rationale: Das Verb bedeutet bereitstellen, darbieten oder reichlich hinzufügen. In Verbindung mit der wiederholten ἐν-Konstruktion lässt „ergänzt … durch“ die fortschreitende Reihe im Deutschen klar hervortreten, ohne sie als bloß mechanisches Addieren zu verengen.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: euren Glauben durch
  rationale: Das griechische ἐν kann hier die enge Verbindung bezeichnen, in der eine Eigenschaft zur anderen tritt. Die gewählte deutsche Konstruktion ist natürlich; die formnähere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: πίστει
  choice: Glauben
  rationale: „Glaube“ trifft die lexikalische Grundbedeutung von πίστις in diesem Zusammenhang; „Vertrauen“ oder „Treue“ bleiben mögliche Nuancen.
- source_word: ἀρετήν
  choice: charakterliche Tüchtigkeit
  rationale: ἀρετή bezeichnet hier sittliche beziehungsweise charakterliche Vortrefflichkeit. „Charakterliche Tüchtigkeit“ ist verständlicher und präziser als das im heutigen Deutsch teils missverständliche „Tugend“.
- source_word: γνῶσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt γνῶσις knapp wieder und passt zur Abfolge der genannten Eigenschaften.
theological_decisions:
- issue: Bedeutung von πίστις in der Aufzählung
  choice: Glaube
  alternative: Vertrauen oder Treue
  rationale: Der Kontext erlaubt überlappende Bedeutungsnuancen. Der Haupttext verwendet die gewöhnliche Wiedergabe „Glaube“, ohne die Alternativen auszuschließen.
- issue: Verhältnis der Eigenschaften in der wiederholten ἐν-Konstruktion
  choice: eine Eigenschaft durch die nächste ergänzen
  alternative: die nächste Eigenschaft in der jeweils vorigen bereitstellen
  rationale: Die Syntax bezeichnet eine enge Verbindung und fortschreitende Entfaltung. Die idiomatische deutsche Fassung vermeidet eine dogmatische Festlegung darauf, ob eine Eigenschaft zeitlich oder ursächlich aus der anderen hervorgeht; die formnähere Lesart steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Setzt allen Eifer daran“ bewahrt den Nachdruck des griechischen Ausdrucks. Die wiederholte Kette wird idiomatisch mit „ergänzen durch“ gestaltet, während die formnähere Struktur in der Fußnote dokumentiert ist.
