id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: de
  text: Da seine göttliche Kraft uns alles geschenkt hat, was zum Leben und zur Gottesfurcht gehört, durch die Erkenntnis dessen, der uns durch seine eigene Herrlichkeit und Vortrefflichkeit berufen hat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu seiner eigenen Herrlichkeit und Vortrefflichkeit“. Die griechische Dativformulierung kann unterschiedlich verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Da
  rationale: Leitet den Grund für die folgende Aufforderung ein. „Da“ gibt den wahrscheinlich begründenden Zusammenhang im modernen Deutschen natürlich wieder, ohne den Satz vom Folgenden abzulösen.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: alles, was zum Leben und zur Gottesfurcht gehört
  rationale: Die Konstruktion τὰ πρὸς bezeichnet alles, was sich auf diese Bereiche bezieht oder dafür erforderlich ist. Die Formulierung wahrt den umfassenden Sinn von πάντα, ohne ausdrücklich „nötig“ hinzuzufügen.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: seine göttliche Kraft
  rationale: Gibt die Genitivkonstruktion idiomatisch wieder; θεῖος bezeichnet hier die Gott eigene, göttliche Kraft.
- source_word: δεδωρημένης
  choice: geschenkt hat
  rationale: Das Perfekt von δωρέομαι bezeichnet eine gnädige Gabe mit fortdauernder Wirkung. Das deutsche Perfekt ist natürlich und bewahrt den Gabecharakter.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: durch die Erkenntnis
  rationale: „Erkenntnis“ gibt ἐπίγνωσις im religiösen Zusammenhang angemessen wieder, ohne die mögliche Nuance einer vertieften Erkenntnis zu überladen.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: dessen, der uns ... berufen hat
  rationale: Das substantivierte Partizip wird persönlich und mit seiner verbalen Aussage wiedergegeben. „Berufen“ wahrt den theologischen Klang von καλέω, ohne dessen Inhalt näher festzulegen.
- source_word: ἰδίᾳ
  choice: seine eigene
  rationale: „Eigene“ erhält die betonte Zugehörigkeit, die ἴδιος gegenüber einem bloßen Possessivpronomen ausdrückt.
- source_word: δόξῃ
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte und sachlich passende Wiedergabe für die göttliche Majestät beziehungsweise deren Offenbarwerden.
- source_word: ἀρετῇ
  choice: Vortrefflichkeit
  rationale: ἀρετή kann Tugend oder hervorragende Qualität bezeichnen. Bei Gott vermeidet „Vortrefflichkeit“ eine Verengung auf menschliche Moral und bewahrt den Sinn göttlicher Exzellenz.
- source_word: ζωὴν
  choice: Leben
  rationale: Die unbestimmte Weite des griechischen Wortes bleibt erhalten und lässt gegenwärtige wie endzeitliche Bezüge offen.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Bezeichnet eine auf Gott ausgerichtete, ehrfürchtige Lebenshaltung. „Gottesfurcht“ ist verständlich und wahrt stärker als das teils kulturell verengte „Frömmigkeit“ den Gottesbezug.
theological_decisions:
- issue: Funktion des Dativs in ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: durch seine eigene Herrlichkeit und Vortrefflichkeit
  alternative: zu seiner eigenen Herrlichkeit und Vortrefflichkeit
  rationale: 'Beim vorliegenden SBLGNT-Text lässt sich der Dativ am natürlichsten instrumental verstehen: Der Berufende beruft kraft beziehungsweise mittels seiner Herrlichkeit und Vortrefflichkeit. Da auch ein Zielbezug vertreten wird, bleibt diese Möglichkeit in der Fußnote sichtbar.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als begründender, zum Folgesatz hin offener Nebensatz stehen, wie es der griechische Zusammenhang nahelegt. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Schlussformulierung.
