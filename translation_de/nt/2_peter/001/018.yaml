id: 2PE.1.18
reference: 2 Peter 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: de
  text: Und diese Stimme, die vom Himmel her getragen wurde, hörten wir selbst, als wir mit ihm auf dem heiligen Berg waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: diese Stimme
  rationale: φωνή bezeichnet hier die in Vers 17 wiedergegebene göttliche Äußerung; „Stimme“ ist daher treffender als das allgemeinere „Laut“.
- source_word: ἡμεῖς
  choice: wir selbst
  rationale: Das ausdrückliche Personalpronomen ist im Griechischen betont und unterstreicht den Augenzeugencharakter der Aussage.
- source_word: ἠκούσαμεν
  choice: hörten
  rationale: Der Aorist bezeichnet das konkrete Ereignis des Hörens, nicht ein fortdauerndes Zuhören.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel her
  rationale: Die Formulierung gibt Herkunft und Richtung der Stimme idiomatisch wieder.
- source_word: ἐνεχθεῖσαν
  choice: ergehen
  rationale: Das passive Partizip von φέρω beschreibt, dass die Stimme vom Himmel her übermittelt wurde. „Eine Stimme ergeht“ ist im Deutschen natürlich und würdevoll, lässt den passiven Vermittlungsgedanken jedoch weniger ausdrücklich erkennen; deshalb wird die wörtlichere Möglichkeit in der Fußnote genannt.
- source_word: σὺν αὐτῷ ὄντες
  choice: als wir mit ihm … waren
  rationale: Die Partizipialkonstruktion wird ihrem zeitlichen Sinn entsprechend natürlich ins Deutsche übertragen.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: auf dem heiligen Berg
  rationale: Bei einem Berg ist „auf“ im Deutschen idiomatisch; „heilig“ bewahrt die sakrale Bedeutung, ohne den Berg näher zu identifizieren.
theological_decisions:
- issue: Identität des „heiligen Berges“
  choice: Beschreibender Verweis auf den Berg der Verklärung Jesu, ohne geografische Identifizierung
  alternative: Ausdrückliche Identifizierung mit dem Berg Tabor oder dem Hermon
  rationale: Der griechische Text nennt keinen Eigennamen. Eine konkrete Identifizierung würde eine Tradition oder Hypothese in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Augenzeugenaussage wird durch „wir selbst“ bewahrt; „ergehen“ vermeidet die im Deutschen unnatürliche Formulierung, eine Stimme sei „gebracht“ worden.
