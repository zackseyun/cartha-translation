id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: de
  text: 'Simeon Petrus, Sklave und Apostel von Jesus, dem Messias, an diejenigen, die einen Glauben empfangen haben, der ebenso kostbar ist wie der unsere[a], in der Gerechtigkeit[b] unseres Gottes und Retters, Jesus, des Messias[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Glauben, der den gleichen Rang wie der unsere hat“. Das Adjektiv kann gleichen Wert, gleiche Ehre oder gleiche Stellung beziehungsweise Teilhabe hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch die Gerechtigkeit“ beziehungsweise „aufgrund der Gerechtigkeit“. Die Präposition kann einen Bereich oder ein Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Der griechische Wortlaut ist am natürlichsten auf eine Person zu beziehen: Jesus, der Messias, wird „unser Gott und Retter“ genannt. Weniger wahrscheinlich ist die Deutung: „unseres Gottes und des Retters Jesus, des Messias“, bei der von zwei Personen die Rede wäre.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Simeon Petrus
  rationale: „Simeon“ gibt die im SBLGNT stehende Namensform Συμεών wieder; „Petrus“ ist die im Deutschen etablierte Form von Πέτρος.
- source_word: δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet hier nicht bloß einen Helfer, sondern einen Menschen, der seinem Herrn vollständig gehört. „Sklave“ bewahrt diese starke Bindung, auch wenn das Wort im Deutschen hart klingt.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: „Apostel“ ist die etablierte und in diesem Zusammenhang präzise Bezeichnung für einen bevollmächtigten Gesandten.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird als Titel „Messias“ wiedergegeben. Die Apposition „des Messias“ ist im Deutschen würdig und macht den Titelcharakter sichtbar.
- source_word: τοῖς ... λαχοῦσιν
  choice: an alle, die ... empfangen haben
  rationale: λαγχάνω bezeichnet ein Erlangen oder Zugewiesenbekommen. „Empfangen“ vermeidet den Eindruck, der Glaube sei durch eigene Leistung erworben worden.
- source_word: ἰσότιμον ἡμῖν ... πίστιν
  choice: einen Glauben ..., der ebenso kostbar ist wie der unsere
  rationale: ἰσότιμος kann gleichen Wert, gleiche Ehre oder gleiche Stellung ausdrücken. Die Hauptfassung betont den gleichen Wert; die weitere Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: πίστιν
  choice: Glauben
  rationale: Im Kontext bezeichnet πίστις den von den Empfängern mit den Aposteln geteilten Glauben.
- source_word: ἐν δικαιοσύνῃ
  choice: in der Gerechtigkeit
  rationale: Die formal nahe Wiedergabe lässt offen, ob ἐν eher den Bereich oder das Mittel bezeichnet. Instrumentale Alternativen stehen in der Fußnote.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die sachlich und theologisch angemessene Standardwiedergabe; „Recht“ oder „Gerechtsein“ wären hier weniger präzise.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: unseres Gottes und Retters Jesus, des Messias
  rationale: 'Der eine Artikel vor den beiden durch καί verbundenen Personenbezeichnungen spricht am natürlichsten für einen einzigen Bezug: Jesus wird sowohl Gott als auch Retter genannt.'
theological_decisions:
- issue: Beziehen sich „unser Gott“ und „Retter“ auf eine oder auf zwei Personen?
  choice: 'Ein Bezug: Jesus, der Messias, wird als „unser Gott und Retter“ bezeichnet.'
  alternative: 'Zwei Bezüge: „unser Gott“ bezeichnet den Vater, „der Retter Jesus, der Messias“ eine zweite Person.'
  rationale: Ein einziger Artikel bestimmt die beiden singularischen Personenbezeichnungen θεός und σωτήρ, die durch καί verbunden sind; der nachgestellte Name Ἰησοῦ Χριστοῦ identifiziert daher am natürlichsten denselben einen Bezug. Wegen der theologischen Tragweite wird die weniger wahrscheinliche Zwei-Personen-Deutung in einer Fußnote genannt.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Briefformular. „Sklave“ ist bewusst stärker als „Diener“; „Messias“ hält Χριστός als Titel erkennbar. Die ungewöhnliche Wendung „in der Gerechtigkeit“ wahrt die Mehrdeutigkeit der griechischen Präposition und wird durch die Fußnote erläutert.
