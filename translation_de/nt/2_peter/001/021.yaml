  naturalness: Der Satz ist grundsätzlich modernes Standarddeutsch. Eine leicht gestraffte Wortstellung mit „nicht ... sondern“ und „sprachen“ klingt jedoch idiomatischer und bildet die kontrastive Struktur des Griechischen klarer ab. Die explizite Partizipialgruppe vermeidet zudem jede mögliche lockere Anbindung von „getragen“.
  terminology: '„Prophetie“, „Menschen“, „Gott“ und „Heiliger Geist“ sind sachgerecht. „Menschen“ gibt ἄνθρωποι im Deutschen natürlich und ohne unangebrachte geschlechtliche Einengung wieder. Die Fußnote a ist allerdings fehlerhaft: Sie bietet mit „wurde hervorgebracht“ keine echte Alternative zur bereits gewählten Wiedergabe.'
