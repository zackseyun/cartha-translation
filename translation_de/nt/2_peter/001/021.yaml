source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: de
  text: Denn niemals wurde eine Prophetie durch menschlichen Willen hervorgebracht[a], sondern Menschen sprachen von Gott her, getragen vom Heiligen Geist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „kam zustande“. Das griechische Verb steht im Passiv und ist mit dem späteren „getragen“ verwandt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „während sie vom Heiligen Geist getragen wurden“; das Bild betont die wirksame Führung durch den Geist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: durch den Willen eines Menschen
  rationale: Der Dativ bezeichnet bei dem Passivsatz das Mittel beziehungsweise den Ursprung in menschlichem Wollen. Die Formulierung bewahrt den Singular und klingt im modernen Deutschen natürlich.
- source_word: ἠνέχθη
  choice: wurde … hervorgebracht
  rationale: Das Aoristpassiv von φέρω wird ausdrücklich passiv wiedergegeben und bezeichnet hier das Hervortreten beziehungsweise Zustandekommen der Prophetie; zugleich bleibt die Wortverwandtschaft mit φερόμενοι erkennbar.
- source_word: προφητεία
  choice: Prophetie
  rationale: Der etablierte deutsche Ausdruck lässt offen, ob besonders der prophetische Ausspruch, die Botschaft oder das Phänomen als solches im Blick steht.
- source_word: ποτέ
  choice: niemals
  rationale: Zusammen mit οὐ ergibt sich eine nachdrückliche zeitliche Verneinung.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: vom Heiligen Geist
  rationale: ὑπό mit Genitiv bezeichnet die handelnde Kraft; der bestimmte deutsche Ausdruck ist in diesem Kontext sachgemäß.
- source_word: φερόμενοι
  choice: getragen
  rationale: Das Partizip von φέρω beschreibt die aktive Führung beziehungsweise Bewegung durch den Geist und bewahrt das konkrete Bild, ohne es als mechanisches Diktat auszulegen.
- source_word: ἐλάλησαν
  choice: redeten
  rationale: Die schlichte Wiedergabe entspricht λαλέω und wahrt die wirkliche menschliche Sprechhandlung.
- source_word: ἀπὸ θεοῦ
  choice: von Gott her
  rationale: Die Wendung gibt ἀπό als Herkunft oder Quelle wieder und unterscheidet diese Nuance von der durch ὑπό bezeichneten Wirksamkeit des Heiligen Geistes.
- source_word: ἄνθρωποι
  choice: Menschen
  rationale: Im Deutschen gibt „Menschen“ den repräsentativen Sinn von ἄνθρωποι natürlich wieder, ohne eine sachlich nicht geforderte Beschränkung auf Männer einzutragen.
theological_decisions:
- issue: Verhältnis von göttlichem und menschlichem Handeln in der Prophetie
  choice: Die Prophetie entspringt nicht menschlichem Wollen; dennoch sind es Menschen, die von Gott her reden, während der Heilige Geist sie trägt.
  alternative: Die Aussage als mechanisches Diktat oder als gemeinsames Hervorbringen aus menschlicher Initiative und göttlichem Einfluss zu deuten.
  rationale: Der griechische Text hält menschliches Reden und entscheidende göttliche Herkunft beziehungsweise Führung zusammen. Die Übersetzung bewahrt diese Spannung, ohne eine weitergehende Inspirationstheorie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von Gott her“ bewahrt die Herkunftsnuance von ἀπό; „getragen“ hält das konkrete Bild und die Verbindung der beiden Formen von φέρω fest.
