  to: Denn niemals wurde eine Prophetie durch menschlichen Willen hervorgebracht[a], sondern Menschen sprachen von Gott her, getragen vom Heiligen Geist[b].
  rationale: Die Revision korrigiert die inhaltlich redundante Fußnote a und glättet den Hauptsatz, ohne die Bedeutung zu verändern. „Menschlichen Willen“ gibt den generischen Singular ἀνθρώπου im Deutschen idiomatisch wieder; die Übersetzung wahrt weiterhin die Unterscheidung zwischen Gottes Herkunftsquelle („von Gott her“) und der Wirksamkeit des Heiligen Geistes („getragen vom Heiligen Geist“).
