id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: de
  text: Ich halte es aber für richtig, euch, solange ich in diesem Zelt[a] bin, durch Erinnern wachzurütteln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Behausung« oder »Leib«; griechisch »Zelt«. Bildlich für Petrus’ gegenwärtiges sterbliches Leben im Leib.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: richtig
  rationale: In Verbindung mit ἡγοῦμαι bezeichnet das Wort ein Urteil darüber, was angemessen oder geboten ist. »Richtig« ist natürlich und bewahrt den ethischen Beiklang.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert einen leichten Gegensatz beziehungsweise eine Weiterführung gegenüber dem vorherigen Gedanken; »aber« gibt dies knapp wieder.
- source_word: ἡγοῦμαι
  choice: ich halte es für
  rationale: Die Wendung drückt eine wohlüberlegte Einschätzung aus und entspricht idiomatischem modernem Deutsch.
- source_word: ἐφ’ ὅσον
  choice: solange
  rationale: 'Mit εἰμί ist die Wendung temporal zu verstehen: für die Dauer, in der der Sprecher in diesem Zelt ist.'
- source_word: σκηνώματι
  choice: Zelt
  rationale: »Zelt« bewahrt die konkrete Metapher für das gegenwärtige, vergängliche körperliche Dasein und bereitet die Bildsprache des folgenden Verses vor.
- source_word: διεγείρειν
  choice: wachzurütteln
  rationale: Das Verb bedeutet aufwecken oder aufrütteln. »Wachzurütteln« vermittelt hier die nachdrückliche geistige Anregung in natürlichem Deutsch.
- source_word: ἐν ὑπομνήσει
  choice: durch Erinnerung
  rationale: 'Die Präpositionalphrase bezeichnet Mittel oder Art und Weise: Das Wachrütteln geschieht, indem Petrus die Leser erinnert.'
theological_decisions:
- issue: Metaphorischer Bezug von »diesem Zelt«
  choice: Die Körpermetapher wird unmittelbar als »dieses Zelt« wiedergegeben.
  alternative: »dieser Leib« oder »diese Behausung«
  rationale: Der griechische Text nennt nicht ausdrücklich den Leib, sondern gebraucht ein Bild für das vergängliche körperliche Leben. Die direkte Wiedergabe erhält die Bildspannung zum Ablegen des Zeltes im folgenden Vers, ohne sie im Haupttext auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wurde für gute Verständlichkeit leicht geordnet, während die Zeltmetapher und der Zweckcharakter des Erinnerns erhalten bleiben.
