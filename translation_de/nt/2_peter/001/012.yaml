id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: de
  text: '**2. Petrus 1,12**


    Darum werde ich euch immer wieder an diese Dinge erinnern, obwohl ihr sie kennt und in der gegenwärtigen Wahrheit[a] gefestigt seid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Wahrheit, die ihr jetzt habt“.'
    reason: Lexikalische Alternative für ἐν τῇ παρούσῃ ἀληθείᾳ; παρούσῃ kann sich auf die den Lesern gegenwärtig verfügbare beziehungsweise bei ihnen vorhandene Wahrheit beziehen.
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Die Folgerungspartikel verbindet den Vers mit der vorausgehenden Argumentation. „Darum“ ist im Deutschen klar und natürlich.
- source_word: μελλήσω ἀεὶ … ὑπομιμνῄσκειν
  choice: werde ich euch immer wieder … erinnern
  rationale: μέλλω mit Infinitiv bezeichnet hier das auf die Zukunft gerichtete Vorhaben; ἀεί gibt dem Erinnern einen fortgesetzten beziehungsweise wiederholten Charakter. „Immer wieder“ drückt dies im Deutschen idiomatisch aus.
- source_word: περὶ τούτων
  choice: an diese Dinge
  rationale: Beim deutschen Verb „erinnern“ wird der Inhalt natürlich mit „an“ angeschlossen; der Rückbezug auf das zuvor Gesagte bleibt offen und deutlich.
- source_word: καίπερ εἰδότας
  choice: obwohl ihr sie kennt
  rationale: Die konzessive Partizipialkonstruktion wird als natürlicher deutscher Nebensatz wiedergegeben. „Sie“ bezieht sich auf „diese Dinge“.
- source_word: ἐστηριγμένους
  choice: gefestigt seid
  rationale: Das Perfekt Passiv bezeichnet einen durch vorausgegangene Festigung entstandenen, fortdauernden Zustand. Die deutsche Zustandsform wahrt diesen Ergebnissinn, ohne den Vorgang unnötig hervorzuheben.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: in der gegenwärtigen Wahrheit
  rationale: Die Formulierung bleibt nahe am mehrdeutigen Ausdruck παρούσῃ und legt nicht fest, ob die Wahrheit als zeitlich gegenwärtig, bei den Lesern vorhanden oder ihnen verfügbar gemeint ist.
theological_decisions:
- issue: Bedeutung von „der gegenwärtigen Wahrheit“
  choice: in der gegenwärtigen Wahrheit
  alternative: in der Wahrheit, die ihr jetzt habt
  rationale: Der griechische Ausdruck bezeichnet keine ausdrücklich definierte heilsgeschichtliche oder konfessionelle Kategorie. Die bewusst offene Haupttextfassung bewahrt seine ungewöhnliche Formulierung; die Fußnote nennt eine naheliegende relationale Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Immer wieder“ vermeidet ein schwerfälliges „stets bereit sein“ und gibt den fortgesetzten Vorsatz natürlich wieder. Die ungewöhnliche Wendung „gegenwärtige Wahrheit“ bleibt wegen ihrer echten semantischen Offenheit im Haupttext erhalten.
