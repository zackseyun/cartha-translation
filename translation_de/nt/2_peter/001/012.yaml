  verdict: approve
  source_fidelity: 'Der Text gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: Διὸ als Folgerung („Darum“), die zukunftsgerichtete Absicht mit μελλήσω, die Wiederholung bzw. Dauer mit ἀεί („immer wieder“), den Bezug von περὶ τούτων sowie die konzessive Aussage über das Wissen und Gefestigtsein der Adressaten. „Gefestigt seid“ gibt den resultativen Zustand des Perfektpassivs ἐστηριγμένους angemessen wieder.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „Darum werde ich euch immer wieder an diese Dinge erinnern“ ist idiomatisch und klar. Die Wendung „in der gegenwärtigen Wahrheit“ ist im Deutschen bewusst etwas markiert, spiegelt aber die ebenfalls auffällige und auslegungsfähige griechische Formulierung, ohne sie unnötig zu glätten.
  terminology: „Wahrheit“ und „gefestigt“ sind sachgerecht und konfessionell nicht einengend. Die Fußnote bietet die plausible relationale Lesart von παρούσῃ, ohne aus dem Ausdruck eine technische theologische Kategorie zu machen. Der Fußnotenanker steht an der einschlägigen Stelle.
