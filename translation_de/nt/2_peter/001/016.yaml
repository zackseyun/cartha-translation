id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: de
  text: Denn wir haben euch die Macht und das Kommen[a] unseres Herrn Jesus, des Messias[b], nicht bekannt gemacht, weil wir raffiniert ausgedachten Mythen folgten, sondern weil wir Zeugen seiner Majestät geworden sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gegenwart“ beziehungsweise „die Ankunft“. Das griechische παρουσία kann Gegenwart, Ankunft oder Kommen bezeichnen und bezieht sich im Neuen Testament häufig auf das Kommen des Messias.'
    reason: alternative_reading
  - marker: b
    text: Griechisch Χριστός; traditionell „Christus“. Das Wort bedeutet „Messias“ beziehungsweise „Gesalbter“ und wird hier als Titel verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: raffiniert ausgedachten Mythen
  rationale: Die Form bezeichnet kunstvoll oder geschickt ersonnene Erzählungen. „Raffiniert ausgedacht“ bewahrt sowohl den Gedanken bewusster Gestaltung als auch den abwertenden Unterton.
- source_word: ἐξακολουθήσαντες
  choice: dass wir … folgten
  rationale: Die finite Nebensatzkonstruktion gibt das griechische Partizip in natürlichem Deutsch wieder und hält den Gegensatz zu ἐπόπται γενηθέντες deutlich.
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: wir haben euch … bekannt gemacht
  rationale: „Bekannt machen“ entspricht der Grundbedeutung von γνωρίζω und bildet den Dativ ὑμῖν unmittelbar ab.
- source_word: δύναμιν
  choice: Macht
  rationale: „Macht“ ist hier die direkte und im christologischen Zusammenhang natürliche Wiedergabe von δύναμις.
- source_word: παρουσίαν
  choice: Kommen
  rationale: παρουσία kann Gegenwart, Ankunft oder Kommen bezeichnen und hat im Neuen Testament bei Christus häufig endzeitlichen Bezug. „Kommen“ lässt diesen Bezug erkennen, ohne ausdrücklich „Wiederkunft“ in den Text einzutragen.
- source_word: κυρίου
  choice: Herrn
  rationale: κύριος wird in seiner titulären Verwendung für Jesus sachgemäß mit „Herr“ wiedergegeben.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet hier den Titel „Messias“. Die deutsche Apposition mit bestimmtem Artikel ist idiomatisch und macht den Titelcharakter deutlich.
- source_word: ἐπόπται
  choice: Augenzeugen
  rationale: ἐπόπτης bezeichnet Menschen, die etwas selbst gesehen haben. „Augenzeugen“ bewahrt die Beweiskraft des Ausdrucks im Gegensatz zu erfundenen Mythen.
- source_word: γενηθέντες
  choice: dass wir … geworden waren
  rationale: „Geworden waren“ bewahrt den Bedeutungsbestandteil von γίνομαι und zeigt, dass die unmittelbare Anschauung der Bekanntmachung vorauslag.
- source_word: μεγαλειότητος
  choice: Majestät
  rationale: „Majestät“ gibt die erhabene Größe und Herrlichkeit von μεγαλειότης knapp und würdig wieder.
- source_word: ἐκείνου
  choice: seiner
  rationale: Das Demonstrativpronomen verweist auf Jesus zurück; im Deutschen ist das Possessivpronomen die natürliche Form.
theological_decisions:
- issue: Bedeutung von παρουσία im christologischen Zusammenhang
  choice: Kommen
  alternative: Gegenwart; Ankunft; Wiederkunft
  rationale: Der Begriff besitzt ein breites Bedeutungsspektrum, wird im Neuen Testament für Jesus jedoch oft mit endzeitlicher Bedeutung gebraucht. „Kommen“ wahrt diesen möglichen Bezug, während die Fußnote die lexikalische Mehrdeutigkeit offenhält. „Wiederkunft“ wäre eindeutiger, als das griechische Wort selbst verlangt.
- issue: Χριστός als Titel oder verfestigter Namensbestandteil
  choice: des Messias
  alternative: Christus
  rationale: In der Wendung bezeichnet Χριστός den gesalbten König als Titel. „Messias“ macht diese Bedeutung transparent; „Christus“ bleibt als traditionelle Wiedergabe in der Fußnote dokumentiert.
- issue: Verhältnis von Macht und Kommen
  choice: die Macht und das Kommen
  alternative: das machtvolle Kommen
  rationale: Die koordinierte Wiedergabe folgt den beiden griechischen Substantiven und entscheidet nicht, ob sie als eng verbundene Einheit beziehungsweise als Hendiadyoin zu verstehen sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die symmetrische Konstruktion „nicht dadurch … sondern dadurch“ macht den Gegensatz der beiden griechischen Partizipien verständlich, ohne die Aussage in eine freiere Paraphrase aufzulösen. Die ungewöhnliche, aber sachlich präzise Wendung „Augenzeugen seiner Majestät“ bleibt nahe am griechischen Ausdruck.
