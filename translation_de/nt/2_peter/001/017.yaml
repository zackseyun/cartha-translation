source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: de
  text: 'Denn er empfing von Gott, dem Vater, Ehre und Herrlichkeit, als eine Stimme folgenden Wortlauts von der majestätischen Herrlichkeit an ihn erging: „Das ist mein Sohn, mein Geliebter[b], an dem ich Gefallen gefunden habe[c]“ –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Auch möglich: „mein geliebter Sohn“. Wörtlicher steht im Griechischen: „mein Sohn, mein Geliebter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „an dem ich Wohlgefallen habe“ oder „an dem ich Gefallen fand“. Wörtlich steht eine Vergangenheitsform; die Wendung bezeichnet Gottes Gefallen und klingt an die Berichte von Jesu Taufe und Verklärung an.'
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ
  choice: Denn er empfing
  rationale: Das begründende γάρ wird mit „denn“ wiedergegeben. Das Aoristpartizip λαβών wird im Deutschen als finites Verb ausgedrückt; der Zusammenhang mit dem folgenden Genitivus absolutus bleibt durch den als-Satz erhalten.
- source_word: παρὰ θεοῦ πατρὸς
  choice: von Gott, dem Vater
  rationale: παρά mit Genitiv bezeichnet die Quelle. Die Apposition „dem Vater“ bewahrt beide griechischen Substantive und klingt im Deutschen natürlich.
- source_word: τιμὴν καὶ δόξαν
  choice: Ehre und Herrlichkeit
  rationale: Beide inhaltlich gewichtigen Substantive werden getrennt und unmittelbar wiedergegeben.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: als … folgende Stimme an ihn erging
  rationale: Der Genitivus absolutus wird als temporaler Nebensatz wiedergegeben. „erging“ vermittelt die Bewegung beziehungsweise Übermittlung von ἐνεχθείσης in natürlichem, gehobenem Deutsch.
- source_word: τοιᾶσδε
  choice: folgende
  rationale: Das vorausweisende Demonstrativwort kündigt den unmittelbar anschließenden Wortlaut der Stimme an; „folgende“ ist dafür im Deutschen idiomatisch.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: von der majestätischen Herrlichkeit
  rationale: Die Formulierung bewahrt das ehrfürchtige Umschreiben der göttlichen Gegenwart. „von“ lässt im Deutschen sowohl Herkunft als auch, im Passivzusammenhang, Urheberschaft erkennen.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Das ist mein Sohn, mein Geliebter
  rationale: Die appositionale Struktur und das wiederholte μου werden bewahrt. „Das ist“ ist die natürliche deutsche Form der hinweisenden Identifikation.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: an dem ich Gefallen gefunden habe
  rationale: „an dem“ gibt die im Deutschen übliche Verbindung mit Gefallen wieder; das Perfekt bewahrt den Vergangenheitsaspekt des Aorists, ohne eine fortdauernde Zustimmung auszuschließen.
theological_decisions:
- issue: Göttliche Umschreibung τῆς μεγαλοπρεποῦς δόξης
  choice: der majestätischen Herrlichkeit
  alternative: der erhabenen Herrlichkeit; der herrlichen Majestät
  rationale: Die Übersetzung lässt die ehrfürchtige Umschreibung für Gott beziehungsweise seine offenbarte Gegenwart stehen, ohne sie durch eine ausdrückliche Benennung interpretierend aufzulösen.
- issue: Wortlaut der göttlichen Aussage über den Sohn
  choice: Das ist mein Sohn, mein Geliebter
  alternative: Das ist mein geliebter Sohn
  rationale: Die gewählte Fassung bewahrt die griechische Apposition und das zweimalige Possessivpronomen, ohne zusätzliche christologische Terminologie einzuführen.
- issue: Zeitwert von εὐδόκησα
  choice: an dem ich Gefallen gefunden habe
  alternative: an dem ich Wohlgefallen habe; an dem ich Gefallen fand
  rationale: Der Aorist wird formal ernst genommen, während die Fußnote die traditionelle präsentische Wiedergabe und die idiomatische Bedeutungsbreite offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht gehobenem Ton. Die Satzstruktur bleibt dem feierlichen griechischen Satz nahe, vermeidet aber unnatürliche Partizipialkonstruktionen. Der Gedankenstrich am Versende zeigt, dass der Satz im folgenden Vers weitergeführt wird.
