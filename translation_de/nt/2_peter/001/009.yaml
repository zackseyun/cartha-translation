id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: de
  text: Denn wem diese Dinge fehlen, der ist blind und kurzsichtig[a] und hat die Reinigung von seinen früheren Sünden vergessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nur das Naheliegende sehend“; das griechische Wort kann Kurz- beziehungsweise Nahsichtigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: Denn wem diese Dinge fehlen
  rationale: Die unpersönliche Konstruktion mit dem Dativ bezeichnet den Menschen, bei dem die zuvor genannten Tugenden nicht vorhanden sind. „Diese Dinge“ bleibt formal offen und verweist auf den vorhergehenden Zusammenhang.
- source_word: τυφλός ἐστιν
  choice: der ist blind
  rationale: Die prädikative Metapher wird unmittelbar und verständlich wiedergegeben.
- source_word: μυωπάζων
  choice: kurzsichtig
  rationale: Das seltene Verb bezeichnet eingeschränktes Sehen, wahrscheinlich Kurz- oder Nahsichtigkeit. Die knappe Wiedergabe erhält das spannungsvolle Nebeneinander von Blindheit und Kurzsichtigkeit.
- source_word: λήθην λαβών
  choice: hat … vergessen
  rationale: Die wörtliche Wendung „Vergessen erlangt/hingenommen habend“ wird als deutsches Idiom wiedergegeben; das Partizip bezeichnet einen eingetretenen Zustand.
- source_word: τοῦ καθαρισμοῦ
  choice: die Reinigung von
  rationale: Der Genitiv bezeichnet den Gegenstand des Vergessens. „Reinigung“ bewahrt das Bild der Beseitigung von Verunreinigung, ohne den theologischen Vorgang näher festzulegen.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: seinen früheren Sünden
  rationale: πάλαι kennzeichnet die Sünden als zeitlich zurückliegend. Das Possessiv bleibt wie im Griechischen singularisch, wird durch die deutsche Konstruktion jedoch generisch verstanden.
theological_decisions:
- issue: Verhältnis von „blind“ und μυωπάζων
  choice: blind und kurzsichtig
  alternative: blind, da er nur das Naheliegende sieht
  rationale: Die semantische Spannung des griechischen Textes wird nicht harmonisiert. Das zweite Wort kann die Blindheit näher bestimmen oder zuspitzen; die Übersetzung lässt dieses Verhältnis offen.
- issue: Bedeutung der Reinigung von früheren Sünden
  choice: die Reinigung von seinen früheren Sünden
  alternative: dass er von seinen früheren Sünden gereinigt wurde
  rationale: Die nominale Form des Ausgangstextes wird beibehalten, damit weder Zeitpunkt noch Mittel oder genauer theologischer Vollzug der Reinigung ergänzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Form „wem …, der …“ gibt den generischen Singular natürlich wieder. Das „und“ vor „kurzsichtig“ vermeidet ein schwerfälliges Partizip, ohne die Bildspannung aufzulösen.
