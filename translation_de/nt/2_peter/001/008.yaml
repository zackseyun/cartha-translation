id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: de
  text: Denn wenn diese Dinge bei euch vorhanden sind und zunehmen[a], lassen sie euch in der Erkenntnis[b] unseres Herrn Jesus, des Messias,[c] weder untätig noch unfruchtbar sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reichlich vorhanden sind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der vollen Erkenntnis“.'
    reason: lexical_alternative
  - marker: c
    text: 'Griechisch: „Jesus Christus“; „Christus“ ist die griechische Entsprechung zu „Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: dies alles
  rationale: Der Rückverweis gilt den in V. 5–7 genannten Eigenschaften. „Dies alles“ wahrt den anaphorischen Bezug, ohne das allgemeinere „Dinge“ unnötig zu wiederholen.
- source_word: ὑμῖν ὑπάρχοντα
  choice: bei euch vorhanden ist
  rationale: Die Verbindung bezeichnet, dass die genannten Eigenschaften bei den Lesern vorhanden sind. Die Formulierung wahrt die mögliche Nuance von Gegenwart beziehungsweise Besitz, ohne sie ausschließlich als inneren Zustand festzulegen.
- source_word: πλεονάζοντα
  choice: zunimmt
  rationale: Das Partizip kann Zunahme oder reichliches Vorhandensein bezeichnen. „Zunimmt“ passt zum Zusammenhang fortschreitender ethischer Entwicklung; die Bedeutungsalternative wird in einer Fußnote erhalten.
- source_word: ἀργούς
  choice: untätig
  rationale: Das Wort bezeichnet hier fehlende Tätigkeit oder Wirksamkeit. „Untätig“ bleibt näher am griechischen Ausdruck als „wirkungslos“ und bildet mit „unfruchtbar“ eine natürliche Paarung.
- source_word: ἀκάρπους
  choice: unfruchtbar
  rationale: Bewahrt das im Griechischen vorhandene Bild fehlender Frucht und ist im Deutschen verständlich.
- source_word: καθίστησιν
  choice: lässt es euch … weder … noch … sein
  rationale: Der resultative Sinn des Verbs wird zusammen mit der doppelten Verneinung natürlich wiedergegeben. Das singularische „es“ nimmt das als Einheit verstandene „dies alles“ auf.
- source_word: εἰς τὴν … ἐπίγνωσιν
  choice: in der Erkenntnis
  rationale: Die Präpositionalverbindung bezeichnet hier den Bereich beziehungsweise Bezug, in dem Untätigkeit und Fruchtlosigkeit vermieden werden.
- source_word: ἐπίγνωσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist in diesem theologischen Zusammenhang natürlich und lässt offen, ob eine vertiefte oder volle Erkenntnis mitgemeint ist; diese Nuance erscheint in der Fußnote.
- source_word: κυρίου
  choice: Herrn
  rationale: Gibt κύριος als christologischen Titel in der üblichen und würdigen deutschen Form wieder.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός wird seinem Titelsinn entsprechend als „Messias“ übersetzt. Die deutsche Apposition macht deutlich, dass es sich um den Titel handelt; die traditionelle Form „Jesus Christus“ wird als Alternative vermerkt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: Die Übersetzung „Messias“ legt die Bedeutung des griechischen Titels offen, ohne eine christologische Aussage hinzuzufügen oder abzuschwächen. „Jesus Christus“ ist die traditionelle, stärker namenähnliche Wiedergabe.
- issue: Bedeutungsumfang von ἐπίγνωσις
  choice: Erkenntnis
  alternative: volle Erkenntnis
  rationale: Der griechische Ausdruck kann vertiefte oder volle Erkenntnis nahelegen, verlangt diese Verstärkung hier aber nicht eindeutig. Der Haupttext bewahrt deshalb die offenere Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Ursache-Folge-Gefüge, wird aber für flüssige deutsche Lesbarkeit leicht geglättet. Die Metapher „unfruchtbar“ und die Spannung zwischen Zunahme und Fülle bleiben erhalten.
