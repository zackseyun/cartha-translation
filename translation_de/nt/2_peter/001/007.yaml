source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: de
  text: zur Gottesfurcht aber die geschwisterliche Zuneigung und zur geschwisterlichen Zuneigung die Liebe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: Gottesfurcht
  rationale: εὐσέβεια bezeichnet eine auf Gott ausgerichtete, im Leben sichtbare ehrfürchtige Haltung. „Gottesfurcht“ ist im Deutschen würdig und verständlich und bewahrt sowohl die Gottesbeziehung als auch die ethische Dimension.
- source_word: φιλαδελφίαν
  choice: geschwisterliche Zuneigung
  rationale: φιλαδελφία meint die herzliche Verbundenheit unter Geschwistern, im christlichen Gebrauch besonders unter Glaubensgeschwistern. „Geschwisterliche Zuneigung“ schließt Frauen ausdrücklich ein und hält den Begriff von der folgenden ἀγάπη unterscheidbar.
- source_word: ἀγάπην
  choice: Liebe
  rationale: „Liebe“ ist die natürliche und sachlich angemessene Wiedergabe von ἀγάπη. Nach der geschwisterlichen Zuneigung steht der Begriff ohne einschränkenden Zusatz und behält so seine weitere Tragweite.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: zur ... aber die ... und zur ... die ...
  rationale: Im Zusammenhang der Aufforderung aus Vers 5 gibt die deutsche Konstruktion „zur ... die ...“ idiomatisch wieder, dass jede weitere Tugend hinzukommen soll. Die parallele Struktur des Griechischen bleibt erkennbar.
- source_word: δέ
  choice: aber / und
  rationale: δέ verbindet hier die Glieder der Tugendreihe und ist nicht stark gegensätzlich. Beim ersten Vorkommen greift „aber“ die wiederholte griechische Form auf; beim zweiten sorgt „und“ im Deutschen für einen natürlichen Anschluss.
theological_decisions:
- issue: Unterscheidung von φιλαδελφία und ἀγάπη in der Tugendreihe
  choice: φιλαδελφία als „geschwisterliche Zuneigung“, ἀγάπη als „Liebe“
  alternative: φιλαδελφία als „Geschwisterliebe“ und ἀγάπη als „Liebe“
  rationale: Der griechische Text setzt zwei verwandte, aber verschiedene Begriffe nacheinander. „Geschwisterliche Zuneigung“ wahrt diese Unterscheidung und lässt die Bewegung von der herzlichen Verbundenheit unter Glaubensgeschwistern zur umfassender bezeichneten Liebe erkennen, ohne deren Reichweite dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung setzt syntaktisch die Aufforderung und Tugendreihe aus 2 Petrus 1,5–6 fort. „Geschwisterlich“ ist inklusiver und heute natürlicher als „brüderlich“; „Zuneigung“ vermeidet eine Einebnung der beiden griechischen Liebesbegriffe.
