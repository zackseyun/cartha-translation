  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: de
  text: 'Das sollt ihr vor allem wissen: Keine Weissagung der Schrift entsteht aus eigener Deutung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das sollt ihr vor allem wissen: Jede Weissagung der Schrift kommt nicht aus eigener Auslegung zustande.« Der griechische Ausdruck kann sich auf Ursprung, Hervorbringung oder Auslegung der Weissagung beziehen; wessen »eigene« Deutung gemeint ist, wird nicht ausdrücklich gesagt.'
    reason: Die Formulierung ἰδίας ἐπιλύσεως und der Gebrauch von γίνεται sind auslegungsfähig. Die Fußnote bewahrt diese echte Mehrdeutigkeit, ohne sie im Haupttext konfessionell festzulegen.
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Dabei sollt ihr vor allem wissen
  rationale: Die partizipiale Wendung wird als natürliche deutsche Aufforderung wiedergegeben; πρῶτον bezeichnet hier den Vorrang beziehungsweise die grundlegende Bedeutung.
- source_word: πᾶσα προφητεία γραφῆς
  choice: Keine Weissagung der Schrift
  rationale: Das griechische πᾶσα mit nachgestellter Verneinung kann im Deutschen idiomatisch als »keine« wiedergegeben werden. »Weissagung der Schrift« bewahrt die mögliche Beziehung auf eine in der Schrift enthaltene beziehungsweise schriftgewordene prophetische Aussage.
- source_word: ἰδίας ἐπιλύσεως
  choice: aus eigener Deutung
  rationale: ἰδίας lässt offen, wessen eigene Deutung gemeint ist; daher wird kein ausdrückliches Subjekt wie »des Propheten« oder »des Lesers« ergänzt. ἐπίλυσις bezeichnet Deutung oder Auslegung.
- source_word: οὐ γίνεται
  choice: entsteht nicht
  rationale: γίνεται beschreibt hier das Zustandekommen oder Hervorgehen der Weissagung. »Entsteht« passt zum folgenden Vers, der ihren Ursprung im Wirken des Heiligen Geistes erläutert.
theological_decisions:
- issue: Bezug der »eigenen Deutung«
  choice: Das Subjekt der eigenen Deutung bleibt unbestimmt.
  alternative: »aus der eigenen Deutung des Propheten« oder »durch eigenmächtige Auslegung«
  rationale: Der griechische Wortlaut nennt weder den Propheten noch den Leser ausdrücklich. Der Zusammenhang mit Vers 21 legt den Ursprung der Weissagung nahe, ohne alle anderen syntaktischen Deutungen eindeutig auszuschließen.
- issue: Reichweite der Verneinung bei πᾶσα ... οὐ
  choice: »Keine Weissagung ...«
  alternative: »Jede Weissagung ... entsteht nicht«
  rationale: Im Deutschen ist die vorgezogene Gesamtverneinung klarer und natürlicher. Sie gibt die übliche distributive Bedeutung der griechischen Konstruktion wieder, ohne eine unidiomatische Stellung der Verneinung nachzuahmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Weissagung« wurde statt des abstrakteren »Prophetie« gewählt, weil hier eine konkrete prophetische Aussage im Blick steht. Die Syntax ist lesbar gestaltet, während die Unbestimmtheit von ἰδίας bewusst erhalten bleibt.
