  source_fidelity: Der Entwurf gibt σπουδάσω, die Zielkonstruktion mit ἔχειν + Infinitiv, ἑκάστοτε, den euphemistischen Ausdruck μετὰ τὴν ἐμὴν ἔξοδον und die Erinnerungswendung insgesamt zutreffend wieder. Das im deutschen Satz bei „nach meinem Abschied“ stehende „auch“ verschiebt jedoch die Funktion von καί leicht auf den Zeitpunkt nach dem Abschied. Im Griechischen gehört καί zur ergänzenden Bekräftigung des Vorhabens bzw. der fortgesetzten Erinnerungsmöglichkeit, nicht speziell zu „nach“.
  naturalness: „Alles daransetzen“ und „sich jederzeit an diese Dinge erinnern können“ sind modernes, würdiges und gut verständliches Standarddeutsch. Eine Umstellung von „auch“ vor „alles daransetzen“ macht den Satzfluss und den Bezug klarer.
  terminology: „Abschied“ ist als metaphorische Wiedergabe von ἔξοδος vertretbar und wahrt die euphemistische Ausdrucksweise. Die Fußnote erklärt den gemeinten Tod angemessen. „Fortgang“ ist zwar lexikalisch möglich, im heutigen Standarddeutsch aber unnötig ungebräuchlich; „Weggang“ ist als alternative wörtliche Umschreibung klarer.
