  - severity: low
    issue: Fußnotenalternative „Fortgang“
    rationale: „Fortgang“ ist im modernen Deutsch deutlich weniger geläufig und kann andere Nuancen haben. „Weggang“ erläutert die Grundbedeutung von ἔξοδος verständlicher, ohne den Haupttext zu verändern.
