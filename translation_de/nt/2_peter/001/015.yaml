  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: de
  text: Und ich werde auch alles daransetzen, dass ihr euch nach meinem Abschied[a] jederzeit an diese Dinge erinnern könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutlicher: „nach meinem Tod“. Im Griechischen steht „nach meinem Abschied“ beziehungsweise „Weggang“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: ich werde alles daransetzen
  rationale: Die Zukunftsform von σπουδάζω bezeichnet ernsthaftes, entschlossenes Bemühen. „Alles daransetzen“ ist im heutigen Deutsch natürlich und bewahrt die Intensität.
- source_word: δὲ
  choice: Und
  rationale: δέ führt hier den Gedanken aus dem vorherigen Vers weiter und drückt keinen starken Gegensatz aus.
- source_word: καὶ
  choice: auch
  rationale: καί lässt sich hier natürlich auf die fortdauernde Möglichkeit nach dem Abschied beziehen; die Zielrichtung der Infinitivkonstruktion wird im Deutschen durch „dass“ ausgedrückt.
- source_word: ἑκάστοτε
  choice: jederzeit
  rationale: ἑκάστοτε meint „bei jeder Gelegenheit“ beziehungsweise „wann immer es nötig ist“. „Jederzeit“ gibt diesen praktischen Sinn knapp und idiomatisch wieder.
- source_word: ἔχειν ὑμᾶς
  choice: dass ihr … könnt
  rationale: ἔχειν mit Infinitiv kann Möglichkeit oder Gelegenheit ausdrücken. Die Konstruktion mit „könnt“ ist klares, natürliches Deutsch.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: nach meinem Abschied
  rationale: ἔξοδος bedeutet wörtlich „Ausgang“ oder „Fortgang“ und bezeichnet hier verhüllend den bevorstehenden Tod des Verfassers. „Abschied“ bewahrt die Metapher und ist im Deutschen verständlich.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: euch an diese Dinge erinnern
  rationale: Die Wendung μνήμην ποιεῖσθαι bedeutet, etwas ins Gedächtnis zu rufen. „Sich an … erinnern“ gibt das Idiom natürlich wieder.
- source_word: τούτων
  choice: diese Dinge
  rationale: Das Pronomen verweist auf die unmittelbar zuvor behandelten Inhalte. „Diese Dinge“ ist direkt und transparent.
theological_decisions:
- issue: Bedeutung von ἔξοδος für das bevorstehende Lebensende des Petrus
  choice: Abschied
  alternative: Tod; Fortgang; Exodus
  rationale: Der griechische Text verwendet eine metaphorische Bezeichnung für den Tod. Der Haupttext wahrt dieses Bild; die Fußnote nennt den gemeinten Sinn ausdrücklich, ohne zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist flüssig und allgemein verständlich; die Metapher des griechischen ἔξοδος bleibt im Haupttext erhalten.
