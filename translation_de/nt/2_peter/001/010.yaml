source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: de
  text: Darum, Brüder[a], bemüht euch umso mehr darum, eure Berufung und Erwählung festzumachen. Denn wenn ihr diese Dinge tut, werdet ihr ganz gewiss niemals straucheln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann hier die gesamte Glaubensgemeinschaft einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Ermahnung und stellt den logischen Anschluss natürlich her.
- source_word: μᾶλλον
  choice: umso mehr
  rationale: Verstärkt die Aufforderung und gibt die komparative Bedeutung im Deutschen idiomatisch wieder.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die grammatisch maskuline Anrede des griechischen Textes; die mögliche inklusive Bedeutung für die ganze Glaubensgemeinschaft wird in der Fußnote genannt.
- source_word: σπουδάσατε
  choice: bemüht euch
  rationale: Drückt den nachdrücklichen Aufruf zu ernsthaftem Einsatz in natürlichem, gegenwärtigem Deutsch aus.
- source_word: βεβαίαν ... ποιεῖσθαι
  choice: festzumachen
  rationale: Gibt die Wendung kompakt als festigen beziehungsweise bestätigen wieder, ohne ausdrücklich zu entscheiden, auf welche Weise Berufung und Erwählung fest werden.
- source_word: κλῆσιν
  choice: Berufung
  rationale: Ist die übliche und lexikalisch genaue Wiedergabe für Gottes Ruf.
- source_word: ἐκλογὴν
  choice: Erwählung
  rationale: Bezeichnet präzise Gottes Wählen und wahrt die theologische Spannung des Ausdrucks.
- source_word: ταῦτα ... ποιοῦντες
  choice: wenn ihr dies tut
  rationale: Gibt das Partizip mit seinem hier naheliegenden konditionalen Sinn idiomatisch wieder und verweist auf die zuvor genannten Tugenden und Handlungen.
- source_word: οὐ μὴ ... ποτε
  choice: ganz gewiss niemals
  rationale: Bewahrt die starke emphatische Verneinung des griechischen Ausdrucks.
- source_word: πταίσητέ
  choice: zu Fall kommen
  rationale: Erhält das Bild des Strauchelns beziehungsweise Fallens, ohne es auf jede einzelne Sünde oder ausschließlich auf den endgültigen Abfall festzulegen.
theological_decisions:
- issue: Bedeutung von „eure Berufung und Erwählung festzumachen“
  choice: Die Formulierung bleibt eine Aufforderung, Berufung und Erwählung durch ernsthaftes Handeln festzumachen beziehungsweise zu bestätigen.
  alternative: Die Aufforderung so zu formulieren, als bewirke menschliche Leistung erst Gottes Berufung und Erwählung, oder sie ausschließlich als subjektive Heilsgewissheit zu erklären.
  rationale: Der griechische Text verbindet ποιεῖσθαι mit βεβαίαν, während Berufung und Erwählung als vorgegebene Größen erscheinen. „Festzumachen“ wahrt diese Spannung, ohne ein konfessionelles System einzutragen.
- issue: Tragweite von „ganz gewiss niemals zu Fall kommen“
  choice: Die starke Zusage und das Bild des Fallens werden bewahrt, ohne die genaue Art oder Endgültigkeit des Falls näher zu bestimmen.
  alternative: Die Aussage als Garantie völliger Sündlosigkeit oder ausdrücklich nur als Garantie gegen endgültigen Glaubensabfall auszulegen.
  rationale: πταίω bezeichnet ein Straucheln oder Zu-Fall-Kommen. Der Vers selbst legt nicht eindeutig eine der engeren systematischen Deutungen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und gut vorlesbar; etablierte biblisch-theologische Begriffe wie „Berufung“ und „Erwählung“ bleiben erhalten. „Festzumachen“ und „zu Fall kommen“ bewahren die Bildhaftigkeit und theologische Offenheit des Ausgangstextes.
