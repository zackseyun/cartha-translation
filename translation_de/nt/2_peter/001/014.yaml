source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: de
  text: Denn ich weiß, dass das Ablegen meines Zeltes bald bevorsteht[a][b], wie mir auch unser Herr Jesus, der Messias, klargemacht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rasch geschehen wird“. Das griechische Wort kann sowohl die zeitliche Nähe als auch das schnelle Eintreten hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Ablegen meines Zeltes“ spricht Petrus bildhaft von seinem bevorstehenden Tod; möglich ist auch die Wiedergabe „das Wegnehmen meines Zeltes“.
    reason: metaphor_clarification
lexical_decisions:
- source_word: εἰδὼς
  choice: Denn ich weiß
  rationale: Das Partizip knüpft an den vorherigen Satz an. Im Deutschen gibt ein selbstständiger Satz mit „Denn ich weiß“ den begründenden Zusammenhang natürlich wieder, ohne den Inhalt stärker auszudeuten.
- source_word: ταχινή
  choice: bald bevorsteht
  rationale: Das Adjektiv bezeichnet hier die zeitliche Nähe beziehungsweise das rasche Eintreten des Vorgangs. „bald bevorsteht“ ist idiomatisches Deutsch und wahrt den Gedanken der Unmittelbarkeit.
- source_word: ἀπόθεσις
  choice: Ablegen
  rationale: „Ablegen“ bewahrt die konkrete Metapher des griechischen Substantivs und vermeidet die direkte Auflösung in „Tod“.
- source_word: σκηνώματός
  choice: meines Zeltes
  rationale: „Zelt“ gibt die Vorstellung einer vorübergehenden Behausung verständlich wieder; „Leib“ würde das Bild auflösen, „Stiftshütte“ wäre hier missverständlich.
- source_word: καθὼς καὶ
  choice: wie … auch
  rationale: Diese deutsche Konstruktion gibt den vergleichenden und bestätigenden Anschluss natürlich wieder.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die übliche und kontextgerechte Wiedergabe des christologischen Titels.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  rationale: Χριστός wird seinem Titelgehalt entsprechend mit „der Messias“ wiedergegeben. Die Apposition ist im Deutschen idiomatisch und macht deutlich, dass es sich nicht um einen Familiennamen handelt.
- source_word: ἐδήλωσέν
  choice: klargemacht hat
  rationale: Das Verb bezeichnet das Deutlich- oder Bekanntmachen. „klargemacht“ ist verständlich und behauptet nicht mehr als der griechische Ausdruck.
- source_word: μοι
  choice: mir
  rationale: Der Dativ wird als indirektes Objekt natürlich mit „mir“ wiedergegeben.
theological_decisions:
- issue: Bild für den bevorstehenden Tod des Petrus
  choice: das Ablegen meines Zeltes
  alternative: mein Tod; mein Abschied
  rationale: Der griechische Text spricht bildhaft vom Leib beziehungsweise irdischen Leben als Zelt. Die Übersetzung erhält dieses Bild und lässt seine Deutung aus dem Zusammenhang hervorgehen.
- issue: Wiedergabe von Χριστός
  choice: Jesus, der Messias
  alternative: Jesus Christus
  rationale: Die Übersetzung bewahrt den erkennbaren Titelgehalt von Χριστός, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Zeitliche Nuance von ταχινή
  choice: bald bevorsteht
  alternative: rasch geschehen wird
  rationale: Das griechische Wort kann die Nähe oder Schnelligkeit des Ereignisses hervorheben. Der Haupttext wählt die im Kontext naheliegende zeitliche Deutung; die Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zeltmetapher bleibt erhalten; zugleich sorgt „bald bevorsteht“ für einen natürlichen deutschen Satz. „Jesus, der Messias“ behandelt Χριστός erkennbar als Titel.
