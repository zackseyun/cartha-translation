source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: de
  text: Durch sie hat er uns die kostbaren und überaus großen Verheißungen geschenkt, damit ihr durch diese Teilhaber der göttlichen Natur werdet[a], nachdem ihr der Verderbnis entkommen seid, die infolge der Begierde in der Welt ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der göttlichen Natur Anteil bekommt“. Die Wendung bezeichnet Teilhabe an der göttlichen Natur.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Verderbnis, die in der Welt in der Begierde ist“. Das griechische Wort für „Begierde“ kann allgemein „Verlangen“ bedeuten, ist hier im Zusammenhang mit Verderbnis jedoch negativ gefärbt. Die genaue Beziehung zwischen Begierde und Verderbnis bleibt sprachlich offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Durch sie
  rationale: διά mit Genitiv bezeichnet hier Vermittlung oder Mittel. Das Pronomen hält den Rückbezug auf die in Vers 3 genannten Gegebenheiten offen, ohne seinen Bezug genauer festzulegen.
- source_word: τίμια καὶ μέγιστα
  choice: die kostbaren und überaus großen
  rationale: „Kostbar“ gibt τίμια natürlich wieder; „überaus groß“ vermittelt die verstärkende Kraft des Superlativs μέγιστα idiomatisch.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der gewährten Verheißungen.
- source_word: ἐπαγγέλματα
  choice: Verheißungen
  rationale: „Verheißungen“ ist im biblischen Zusammenhang eine klare und etablierte Wiedergabe für ἐπαγγέλματα.
- source_word: δεδώρηται
  choice: hat er … geschenkt
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit fortdauernder Bedeutung; „geschenkt“ bringt den unverdienten, großzügigen Charakter von δωρέομαι zum Ausdruck. Das im Griechischen unausgesprochene Subjekt wird aus Vers 3 ergänzt.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ bewahrt die Ziel- beziehungsweise Zweckbeziehung des griechischen Satzes.
- source_word: διὰ τούτων
  choice: durch diese
  rationale: Die Formulierung gibt die instrumentale Bedeutung wieder und verweist am natürlichsten auf die unmittelbar zuvor genannten Verheißungen.
- source_word: γένησθε
  choice: Anteil bekommt
  rationale: Die Wendung bezeichnet, dass die Angesprochenen zu Teilhabenden werden, und bewahrt so den Veränderungsaspekt von γίνομαι in natürlichem Deutsch.
- source_word: θείας κοινωνοὶ φύσεως
  choice: an der göttlichen Natur Anteil bekommt
  rationale: Die Formulierung bewahrt die starke Aussage wirklicher Teilhabe, ohne sie durch eine spätere dogmatische Begrifflichkeit auszudeuten.
- source_word: ἀποφυγόντες
  choice: nachdem ihr … entkommen seid
  rationale: „Nachdem“ gibt die dem Hauptgeschehen vorausgehende Handlung des Aoristpartizips verständlich wieder.
- source_word: φθορᾶς
  choice: dem Verderben
  rationale: „Verderben“ kann sowohl den sittlichen Verfall als auch dessen zerstörerische Folge ausdrücken und passt daher zum Kontext.
- source_word: ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ
  choice: das durch Begierde in der Welt herrscht
  rationale: „Begierde“ trägt im Deutschen hier bereits eine negative moralische Färbung. „Durch“ gibt den wahrscheinlichen ursächlichen beziehungsweise vermittelnden Sinn von ἐν wieder; die Fußnote hält die sprachlich mögliche weniger bestimmte Fassung offen.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως und die Teilhabe am Göttlichen
  choice: an der göttlichen Natur Anteil bekommt
  alternative: Teilhaber der göttlichen Natur werdet
  rationale: Die Übersetzung erhält die theologisch gewichtige Aussage über reale Teilhabe, ohne sie abzuschwächen oder mit einer bestimmten späteren Lehre gleichzusetzen. Die Fußnote grenzt lediglich das mögliche Missverständnis aus, Menschen würden dem Wesen nach göttlich.
- issue: Moralische Bedeutung von ἐπιθυμία
  choice: Begierde
  alternative: Verlangen
  rationale: ἐπιθυμία kann an sich auch neutral „Verlangen“ bedeuten, ist hier durch die Verbindung mit dem Verderben jedoch negativ bestimmt. „Begierde“ vermittelt diese Kontextbedeutung ohne eine ausschließlich sexuelle Verengung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Verheißungen“, „göttliche Natur“ und „Verderben“ bewahren die begriffliche Dichte des Ausgangstextes; der Satzbau bleibt trotz der engen Anlehnung an die griechische Gedankenführung flüssig.
