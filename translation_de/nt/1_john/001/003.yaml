source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: de
  text: Was wir gesehen und gehört haben, das verkünden wir auch euch, damit auch ihr Gemeinschaft mit uns habt. Unsere Gemeinschaft aber ist mit dem Vater und mit seinem Sohn, Jesus, dem Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: Was …, das
  rationale: Das substantivierte Relativpronomen nimmt den vorangehenden Inhalt auf, ohne den Bezug vorschnell auf eine Person einzuengen; die Wiederaufnahme mit „das“ ist im Deutschen klar und natürlich.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: wir gesehen und gehört haben
  rationale: Das deutsche Perfekt gibt den griechischen Perfektformen angemessen wieder und betont das fortdauernd bedeutsame Zeugnis über vergangene Wahrnehmungen.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: das verkünden wir auch euch
  rationale: „Verkünden“ vermittelt das berichtende und öffentliche Bekanntmachen; „auch“ bildet καί ab und bezieht die Adressaten in den Empfängerkreis ein.
- source_word: ἵνα καὶ ὑμεῖς
  choice: damit auch ihr
  rationale: „Damit“ bezeichnet den Zweck, während „auch ihr“ die ausdrückliche Einbeziehung der Leser wiedergibt.
- source_word: κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: Gemeinschaft mit uns habt
  rationale: „Gemeinschaft“ bewahrt sowohl die relationale als auch die partizipative Bedeutung von κοινωνία, ohne sie rein sozial oder sakramental festzulegen.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: Und unsere Gemeinschaft ist tatsächlich
  rationale: „Tatsächlich“ gibt die bestätigende beziehungsweise erläuternde Kraft von δέ in diesem Zusammenhang idiomatisch wieder.
- source_word: μετὰ τοῦ πατρὸς
  choice: mit dem Vater
  rationale: „Der Vater“ ist hier die personale Gottesbezeichnung und wird entsprechend titulär wiedergegeben.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: mit seinem Sohn
  rationale: Die natürliche deutsche Possessivkonstruktion bewahrt die im griechischen Text ausgedrückte Vater-Sohn-Beziehung.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: Χριστός bezeichnet hier den Titel des Gesalbten; die Apposition „Jesus, dem Messias“ macht die Titelfunktion in idiomatischem Deutsch sichtbar.
theological_decisions:
- issue: Bedeutung von κοινωνία
  choice: Gemeinschaft
  alternative: Teilhabe; Verbundenheit; Gemeinschaftsanteil
  rationale: „Gemeinschaft“ lässt die Spannung zwischen gemeinsamer Teilhabe, Beziehung und gemeinsamem Leben bestehen und passt sowohl zur Gemeinschaft mit den Zeugen als auch mit dem Vater und dem Sohn.
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: In Ἰησοῦ Χριστοῦ bleibt Χριστός als messianischer Titel verständlich. „Messias“ legt die Bedeutung offen, ohne eine weitergehende konfessionelle Deutung einzutragen.
- issue: Bezug der Gemeinschaft
  choice: Gemeinschaft mit den Zeugen, die tatsächlich mit dem Vater und seinem Sohn besteht
  alternative: Zwei voneinander getrennte Gemeinschaften
  rationale: Die Satzverknüpfung wird bewahrt, ohne die genaue Art des Verhältnisses zwischen der Gemeinschaft der Glaubenden und der Gemeinschaft mit Gott systematisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber durch einen Punkt lesbarer gegliedert. „Gemeinschaft“ und „Messias“ sind allgemein verständlich; die Fußnote nennt die traditionelle Alternative.
