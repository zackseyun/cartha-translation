  naturalness: Der deutsche Text ist insgesamt modernes, würdiges Standarddeutsch. Die Umstellung zu „Unsere Gemeinschaft aber“ ist idiomatisch und bildet die Satzverknüpfung ohne die semantische Verstärkung durch „tatsächlich“ ab.
  terminology: „Gemeinschaft“ gibt κοινωνία offen und sachgerecht wieder. „der Messias“ ist als Übersetzung des Titels Χριστός angemessen; „Jesus, dem Messias“ ist aufgrund der Rektion von „mit“ korrekt. Die Fußnote nennt mit „Jesus Christus“ eine brauchbare traditionelle Alternative.
