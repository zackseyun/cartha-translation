  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: de
  text: und das Leben ist offenbar geworden[a], und wir haben es gesehen und bezeugen es und verkünden euch das ewige Leben[b], das beim Vater war und uns offenbar geworden ist –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist erschienen“; „ist sichtbar geworden“.'
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck „das ewige Leben“ ist grammatisch sachlich formuliert, bezieht sich im Zusammenhang aber persönlich auf den Sohn, der beim Vater war und uns offenbar geworden ist.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: das Leben / das ewige Leben
  rationale: Der bestimmte Artikel bleibt erhalten. So erscheint das Leben nicht nur als abstrakter Begriff, sondern als die bestimmte Wirklichkeit, die im Zusammenhang auf den Sohn bezogen ist.
- source_word: ἐφανερώθη
  choice: ist offenbar geworden
  rationale: Die Form gibt den Aorist Passiv sinngemäß und in natürlichem, würdigem Deutsch wieder. Sie lässt sowohl das Sichtbarwerden als auch das Offenbarwerden anklingen.
- source_word: ἑωράκαμεν
  choice: wir haben es gesehen
  rationale: Das deutsche Perfekt bewahrt die abgeschlossene Augenzeugenerfahrung mit bleibender Bedeutung. Das ergänzte Pronomen „es“ ist im Deutschen für einen natürlichen Satzbau erforderlich und verweist auf „das Leben“.
- source_word: μαρτυροῦμεν
  choice: bezeugen es
  rationale: „Bezeugen“ wahrt den Zeugnischarakter des Verbs und ist im heutigen Deutsch prägnant und verständlich.
- source_word: ἀπαγγέλλομεν
  choice: verkünden
  rationale: „Verkünden“ unterscheidet die öffentliche Mitteilung vom vorausgehenden Bezeugen und entspricht dem feierlichen Zusammenhang.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: das ewige Leben
  rationale: Die bestimmte Form wird beibehalten und bezeichnet hier eine konkrete, in Beziehung zum Vater stehende Wirklichkeit.
- source_word: ἥτις
  choice: das
  rationale: Das Relativpronomen richtet sich grammatisch nach „das ewige Leben“. Dadurch bleibt die vom griechischen Text gewahrte Spannung zwischen sachlicher Ausdrucksform und persönlichem Bezug bestehen.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: beim Vater war
  rationale: „Beim Vater“ ist eine idiomatische deutsche Wiedergabe für die persönliche Nähe und Beziehung, ohne die Formulierung deutend auszuweiten.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ wird knapp und natürlich wiedergegeben und unterstreicht den apostolischen Augenzeugenbezug.
theological_decisions:
- issue: Sachliche oder ausdrücklich persönliche Wiedergabe von „Leben“
  choice: „das Leben“ und „das ewige Leben“ bleiben im Haupttext erhalten
  alternative: „er“ oder eine ausdrückliche Einfügung wie „der Sohn“
  rationale: Der Zusammenhang bezieht die Bezeichnung persönlich auf den Sohn, doch der griechische Text verwendet das Substantiv „Leben“. Die Übersetzung erhält diese johanneische Ausdrucksweise und löst ihre Spannung nicht stillschweigend auf.
- issue: Wiedergabe der Präexistenz und Beziehung zum Vater
  choice: „beim Vater war“
  alternative: „in der Gegenwart des Vaters war“
  rationale: Die gewählte Formulierung bezeugt die vorausgehende Beziehung zum Vater, bleibt aber eng am griechischen Ausdruck und vermeidet eine dogmatisch erweiternde Paraphrase.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem johanneischem Klang. Die wiederholten „und“ bewahren den eindringlichen Satzrhythmus des griechischen Textes; der abschließende Gedankenstrich zeigt an, dass der Satz in Vers 3 weitergeführt wird.
