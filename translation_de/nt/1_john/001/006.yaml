id: 1JN.1.6
reference: 1 John 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: de
  text: Wenn wir sagen, dass wir Gemeinschaft mit ihm haben, und zugleich in der Finsternis leben[a], lügen wir und tun nicht die Wahrheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in der Finsternis umhergehen«. Gemeint ist die Lebensführung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »handeln wir nicht nach der Wahrheit« oder »leben wir die Wahrheit nicht aus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Wenn wir sagen
  rationale: Bewahrt die Bedingungsform ohne die zusätzliche Wertung, die »behaupten« eintragen könnte.
- source_word: κοινωνίαν ἔχομεν
  choice: Gemeinschaft mit ihm haben
  rationale: Gibt die griechische Verbindung unmittelbar und in natürlichem, biblisch vertrautem Deutsch wieder.
- source_word: ἐν τῷ σκότει
  choice: in der Finsternis
  rationale: Der bestimmte Artikel und das Substantiv bewahren den johanneischen Gegensatz zwischen Licht und Finsternis als moralisch-geistlichen Bereichen.
- source_word: περιπατῶμεν
  choice: leben
  rationale: Das griechische Bild bedeutet hier die Lebensführung. »Leben« ist im heutigen Deutsch klarer als das missverständliche wörtliche »wandeln«; die Bildform wird in der Fußnote genannt.
- source_word: ψευδόμεθα
  choice: lügen wir
  rationale: Eine direkte, natürliche Wiedergabe des Präsens, die den Gegensatz zur Wahrheit erhält.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: tun nicht die Wahrheit
  rationale: Bewahrt bewusst die auffällige johanneische Formulierung und ihre Spannung, statt sie vollständig als »nach der Wahrheit leben« auszudeuten.
theological_decisions:
- issue: Moralisch-geistliche Metapher der Finsternis
  choice: »in der Finsternis leben«
  alternative: »in Sünde leben«
  rationale: Die johanneische Metapher umfasst Böses, Unwahrheit und Entfremdung von Gott und darf nicht auf eine einzelne dogmatische Deutung verengt werden.
- issue: Johanneische Wendung »die Wahrheit tun«
  choice: Die konkrete Wendung im Haupttext bewahren
  alternative: »nicht nach der Wahrheit leben«
  rationale: Die ungewöhnliche Verbindung von Wahrheit und Tun betont, dass Wahrheit nicht nur ausgesprochen, sondern praktisch vollzogen wird; eine Glättung würde diese Spannung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gemeinschaft« und »Finsternis« erhalten die tragenden johanneischen Begriffe; »leben« vermeidet das heute altertümliche oder missverständliche »wandeln«. Die markierte, ungewöhnliche Wendung »die Wahrheit tun« bleibt wegen ihrer theologischen und rhetorischen Kraft stehen.
