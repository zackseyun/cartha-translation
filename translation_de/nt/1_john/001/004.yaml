  text: καὶ ταῦτα γράφομεν ⸀ἡμεῖς ἵνα ἡ χαρὰ ἡμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: de
  text: Und dies schreiben wir, damit unsere Freude vollkommen werde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „eure Freude“ statt „unsere Freude“.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Ein natürlicher Anschluss an das zuvor Gesagte; die koordinierende Funktion bleibt erhalten.
- source_word: ταῦτα
  choice: dies
  rationale: Das deutsche Sammelpronomen „dies“ verweist natürlich auf den Inhalt des Geschriebenen; ein wörtliches „diese Dinge“ wäre hier weniger idiomatisch.
- source_word: γράφομεν ἡμεῖς
  choice: schreiben wir
  rationale: Das Präsens bezeichnet den gegenwärtigen Schreibvorgang. Die Verb-Endung gibt das Subjekt wieder; die deutsche Nachstellung von „wir“ trägt im Zusammenhang eine leichte Hervorhebung, ohne unnatürlich zu wirken.
- source_word: ἵνα
  choice: damit
  rationale: Kennzeichnet Ziel beziehungsweise beabsichtigte Folge klar und idiomatisch.
- source_word: ἡ χαρὰ ἡμῶν
  choice: unsere Freude
  rationale: Folgt unmittelbar der Lesart ἡμῶν im SBLGNT und bewahrt den zentralen Begriff „Freude“.
- source_word: ᾖ πεπληρωμένη
  choice: vollkommen ist
  rationale: Die Umschreibung aus Konjunktiv von εἰμί und Perfektpartizip bezeichnet einen erreichten Zustand der Fülle. „Vollkommen ist“ gibt diesen Zustand in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Pronomen in ἡ χαρὰ ἡμῶν
  choice: unsere Freude
  alternative: eure Freude
  rationale: Der vorgegebene griechische Haupttext liest ἡμῶν („unsere“). Die bedeutende Variante „eure“ wird nicht in den Haupttext übernommen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Briefstil. „Dies“ vermeidet das im Deutschen schwerfällige „diese Dinge“; die Satzstruktur bleibt eng am griechischen Gedankengang.
