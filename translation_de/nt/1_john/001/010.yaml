source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: de
  text: Wenn wir sagen, dass wir nicht gesündigt haben[a], machen wir ihn zum Lügner, und sein Wort[b] ist nicht in uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Perfekt blickt auf begangene Sünde mit ihrer gegenwärtigen Bedeutung zurück. Es sagt nicht ausdrücklich: „Wir haben niemals gesündigt.“'
    reason: verbal_aspect
  - marker: b
    text: 'Oder: „seine Botschaft“. Das griechische λόγος kann beides bedeuten; „Wort“ bewahrt den johanneischen Sprachgebrauch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Wenn wir sagen
  rationale: Die Verbindung aus ἐάν und Aorist Konjunktiv leitet eine reale, offen gedachte Bedingung ein. „Wenn wir sagen“ gibt dies natürlich wieder, ohne die stärkere Deutung „wenn wir behaupten“ in den Haupttext einzutragen.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: wir nicht gesündigt haben
  rationale: Das griechische Perfekt bezeichnet begangene Sünde mit gegenwärtiger Relevanz. Das deutsche Perfekt ist hier natürlich; „niemals gesündigt“ würde den Wortlaut unnötig verstärken.
- source_word: ψεύστην ποιοῦμεν αὐτὸν
  choice: machen wir ihn zum Lügner
  rationale: ψεύστης ist das Substantiv „Lügner“, und ποιέω mit doppeltem Akkusativ bezeichnet hier, dass jemand als etwas hingestellt wird. Die direkte, anstößige Aussagekraft bleibt erhalten.
- source_word: ὁ λόγος αὐτοῦ
  choice: sein Wort
  rationale: λόγος kann „Wort“, „Botschaft“ oder „Aussage“ bedeuten. „Sein Wort“ ist im Deutschen verständlich und bewahrt zugleich den johanneischen Sprachgebrauch sowie die Bedeutungsweite.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: ist nicht in uns
  rationale: Die wörtliche räumliche Formulierung bewahrt den für den Brief typischen inneren und relationalen Sinn. „Wohnt nicht in uns“ würde ein im Verb nicht ausdrücklich vorhandenes Bild ergänzen.
theological_decisions:
- issue: Bezug von αὐτόν und αὐτοῦ
  choice: Die Pronomen „ihn“ und „sein“ bleiben stehen; aus dem Zusammenhang ist Gott der Bezug.
  alternative: Den Bezug im Haupttext ausdrücklich als „Gott“ wiederzugeben.
  rationale: Im unmittelbaren Zusammenhang wird Gottes Zeugnis beziehungsweise Botschaft bestritten. Da der griechische Text dennoch Pronomen verwendet, bewahrt die Übersetzung diese Form und löst den Bezug nicht unnötig im Haupttext auf.
- issue: Reichweite der Sündenleugnung
  choice: „nicht gesündigt haben“
  alternative: „niemals gesündigt haben“
  rationale: Der Zusammenhang betrifft die Leugnung begangener Sünde, doch das Perfekt allein verlangt nicht das ausdrücklich verstärkende „niemals“. Die Übersetzung wahrt diese sprachliche Zurückhaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die direkte Wendung „zum Lügner machen“ und die johanneische Formulierung „sein Wort ist nicht in uns“ werden bewusst nicht abgeschwächt.
