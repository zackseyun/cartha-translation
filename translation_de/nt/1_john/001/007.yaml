reference: 1 John 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: de
  text: Wenn wir aber im Licht wandeln, wie er selbst im Licht ist, haben wir Gemeinschaft miteinander[a], und das Blut Jesu, seines Sohnes, reinigt uns von jeder Sünde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „untereinander“. Manche verstehen die Wendung als Gemeinschaft zwischen den Glaubenden und Gott; der reziproke griechische Ausdruck bezeichnet jedoch am natürlichsten die gegenseitige Gemeinschaft unter den Glaubenden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „aller Sünde“. Das Griechische kann distributiv („jede Sünde“) oder kollektiv („alle Sünde“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Wenn wir aber
  rationale: Das nachgestellte „aber“ gibt den Gegensatz zur Aussage über das Wandeln in der Finsternis im vorherigen Vers natürlich wieder.
- source_word: ἐν τῷ φωτὶ
  choice: im Licht
  rationale: Die feste Wendung bewahrt das johanneische Bild und gibt den griechischen Artikel idiomatisch wieder.
- source_word: περιπατῶμεν
  choice: wandeln
  rationale: „Wandeln“ erhält die ethische Wegmetapher des griechischen Verbs, ohne sie vorschnell als bloßes „Leben“ auszulegen.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: wie er selbst im Licht ist
  rationale: „Er selbst“ spiegelt die leichte Hervorhebung durch αὐτός; „wie“ wahrt den Vergleich, ohne ihn näher zu bestimmen.
- source_word: κοινωνίαν ἔχομεν
  choice: haben wir Gemeinschaft
  rationale: „Gemeinschaft“ bezeichnet angemessen die gemeinsame Teilhabe und Beziehung, ohne die Aussage auf einen speziell sakramentalen Sinn festzulegen.
- source_word: μετ’ ἀλλήλων
  choice: miteinander
  rationale: Die natürliche deutsche Wiedergabe des reziproken Ausdrucks bewahrt dessen Gegenseitigkeit.
- source_word: τὸ αἷμα Ἰησοῦ
  choice: das Blut Jesu
  rationale: Die formnahe Genitivkonstruktion erhält „Blut“ als Subjekt und bewahrt das theologische Gewicht der Aussage.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: seines Sohnes
  rationale: Die Formulierung bezieht Jesus natürlich auf Gott als dessen Sohn, ohne zusätzlichen Inhalt einzutragen.
- source_word: καθαρίζει
  choice: reinigt
  rationale: „Reinigt“ erfasst die moralischen und kultischen Bedeutungsanteile von καθαρίζω. Das deutsche Präsens lässt den fortdauernden beziehungsweise charakteristischen Sinn offen.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: von jeder Sünde
  rationale: Die distributive Wiedergabe ist bei πάσης mit dem Singular ἁμαρτίας gut möglich; die ebenfalls mögliche kollektive Lesart wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von μετ’ ἀλλήλων („miteinander“)
  choice: gegenseitige Gemeinschaft unter den Glaubenden
  alternative: Gemeinschaft der Glaubenden mit Gott
  rationale: Das reziproke ἀλλήλων bezeichnet am natürlichsten eine gegenseitige Beziehung. Der weitere Kontext schließt Gemeinschaft mit Gott ein, doch diese Wendung wird nicht entsprechend vereindeutigt.
- issue: Aspekt des Präsens καθαρίζει
  choice: fortdauernde oder charakteristische Reinigung im einfachen Präsens
  alternative: einmalige Reinigung oder ausdrücklich „reinigt uns immer weiter“
  rationale: Das griechische Präsens kann einen fortdauernden beziehungsweise charakteristischen Vorgang ausdrücken. Das einfache deutsche Präsens bewahrt diese Möglichkeit, ohne sie durch eine erweiternde Umschreibung festzuschreiben.
- issue: Umfang von πάσης ἁμαρτίας
  choice: 'distributiv: „jede Sünde“'
  alternative: 'kollektiv: „alle Sünde“'
  rationale: Beide Auffassungen sind grammatisch möglich. Der Haupttext verwendet die im modernen Deutsch natürliche distributive Form; die kollektive Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle, aber weiterhin verständliche Wegmetapher „im Licht wandeln“ bleibt erhalten. Satzbau und Wortwahl sind formnah, ohne unnatürlich zu wirken; echte Auslegungsalternativen werden durch Fußnoten offengehalten.
