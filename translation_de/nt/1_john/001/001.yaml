    issue: Unbegründete Gedankenstriche vor und nach „über das Wort des Lebens“
    rationale: περὶ τοῦ λόγου τῆς ζωῆς ist im griechischen Satz nicht parenthetisch abgesetzt. Der Schlussgedankenstrich nach „Lebens“ gibt den offenen Satzschluss wieder, aber der zusätzliche eröffnende Gedankenstrich erzeugt im Deutschen eine nicht im Ausgangstext vorhandene Einschaltung und schwächt den syntaktischen Zusammenhang.
  - severity: low
    issue: 'Formulierung in Fußnote a: „mit ‚der‘ zu bezeichnen“'
    rationale: Die Anmerkung will eine maskuline Personalisierung kontrastieren. „Er“ ist dafür im Deutschen klarer und idiomatischer als das bloße Relativpronomen „der“.
