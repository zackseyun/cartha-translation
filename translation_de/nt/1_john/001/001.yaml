source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: de
  text: Was von Anfang an war[a], was wir gehört haben, was wir mit unseren Augen gesehen haben, was wir aufmerksam betrachtet und mit unseren Händen berührt haben, über das Wort des Lebens—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das, was von Anfang an war.“ Das Griechische verwendet ein sächliches Relativpronomen. Es kann umfassend auf das apostolische Zeugnis über den Sohn weisen, statt ihn unmittelbar als „er“ zu bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Was
  rationale: Das wiederholte sächliche Relativpronomen bezeichnet umfassend den Gegenstand des apostolischen Zeugnisses. „Was“ wahrt diese grammatische Weite; „Der“ oder „Er, der“ würde den persönlichen Bezug im Haupttext stärker festlegen als das Griechische.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: von Anfang an war
  rationale: Die schlichte Wiedergabe erhält den johanneischen Anklang und die zeitliche Tiefe des Imperfekts, ohne zusätzliche Bedeutungsnuancen einzutragen.
- source_word: ἀκηκόαμεν
  choice: wir gehört haben
  rationale: Das deutsche Perfekt gibt das griechische Perfekt natürlich wieder und lässt die bleibende Bedeutung des gehörten Zeugnisses erkennen.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: wir mit unseren Augen gesehen haben
  rationale: Die ausdrückliche Nennung der Augen bleibt erhalten und unterstreicht die konkrete Augenzeugenschaft.
- source_word: ἐθεασάμεθα
  choice: wir aufmerksam betrachtet haben
  rationale: θεάομαι bezeichnet hier mehr als ein flüchtiges Sehen. „Aufmerksam betrachtet“ vermittelt bewusstes, eingehendes Anschauen in natürlichem modernem Deutsch.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: mit unseren Händen berührt haben
  rationale: ψηλαφάω kann „betasten“, „befühlen“ oder „berühren“ bedeuten. „Mit unseren Händen berührt“ bewahrt die körperliche Konkretheit, ohne eine längere oder grobe Handlung vorauszusetzen.
- source_word: περὶ
  choice: über
  rationale: περὶ führt den Gegenstand des Zeugnisses ein. „Über“ ist hier im Deutschen natürlicher als das förmlichere „hinsichtlich“.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: das Wort des Lebens
  rationale: „Wort“ erhält sowohl den möglichen persönlichen Anklang an den johanneischen Logos als auch die Bedeutung einer verkündigten Botschaft. Die Kleinschreibung des Artikels legt die Personifizierung typografisch nicht fest; das Substantiv wird im Deutschen regelhaft großgeschrieben.
theological_decisions:
- issue: Bezug der sächlichen Relativsätze
  choice: Die Reihe wird mit „Was“ wiedergegeben.
  alternative: „Der von Anfang an war“ oder „Er, der von Anfang an war“
  rationale: Obwohl der Zusammenhang christologisch ist, stehen im Griechischen sächliche Relativpronomen. Die Übersetzung hält daher den umfassenden Bezug auf das bezeugte Geschehen beziehungsweise den Sohn und das Zeugnis über ihn offen.
- issue: Bedeutung von λόγος in „τοῦ λόγου τῆς ζωῆς“
  choice: „das Wort des Lebens“
  alternative: „die Botschaft des Lebens“ oder eine ausdrücklich personale Wiedergabe
  rationale: Die Formulierung kann auf den Sohn in Resonanz mit Johannes 1,1 oder auf die lebensspendende Botschaft über ihn weisen. „Wort des Lebens“ bewahrt diese Spannung, soweit es die deutsche Substantivschreibung zulässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anaphorische Wiederholung von „was“ und der unabgeschlossene Satzbau mit Gedankenstrich bleiben als Merkmale des Prologs erhalten. „Aufmerksam betrachtet“ hebt den Unterschied zum vorherigen bloßen Sehen hervor, ohne archaisches „geschaut“ oder „erblickt“ zu verwenden.
