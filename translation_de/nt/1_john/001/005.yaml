id: 1JN.1.5
reference: 1 John 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: de
  text: 'Und das ist die Botschaft, die wir von ihm gehört haben und euch verkünden: Gott ist Licht, und in ihm ist keinerlei Finsternis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: Botschaft
  rationale: „Botschaft“ ist im modernen Deutschen natürlich und bezeichnet hier treffend den empfangenen und weitergegebenen Inhalt.
- source_word: ἀκηκόαμεν
  choice: wir gehört haben
  rationale: 'Das Perfekt gibt den griechischen Perfektaspekt angemessen wieder: Das frühere Hören bleibt für das gegenwärtige Verkünden maßgeblich.'
- source_word: ἀπ’ αὐτοῦ
  choice: von ihm
  rationale: Das Pronomen bleibt wie im Griechischen unaufgelöst; eine ausdrückliche Ergänzung wie „von Jesus“ würde die kontextuelle Zuordnung in den Übersetzungstext eintragen.
- source_word: ἀναγγέλλομεν
  choice: verkünden
  rationale: „Verkünden“ drückt die autoritative Weitergabe einer empfangenen Botschaft natürlich und würdig aus. Eine formale deutsche Wortverwandtschaft mit „Botschaft“ lässt sich nicht ohne unnatürliche Sprache bewahren.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen den Inhalt der Botschaft klar und idiomatisch ein und erfüllt hier dieselbe Funktion wie das griechische ὅτι.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Gott ist Licht
  rationale: Die artikellose Prädikatsbestimmung wird unmittelbar wiedergegeben und bewahrt die qualitative, metaphorische Aussage, ohne „das Licht“ oder eine erklärende Eigenschaft einzufügen.
- source_word: σκοτία
  choice: Finsternis
  rationale: „Finsternis“ wahrt sowohl das Bild als auch seine ethisch-theologische Resonanz und bildet stilistisch ein starkes Gegenstück zu „Licht“.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Formulierung gibt die räumlich-metaphorische Ausdrucksweise direkt wieder, ohne sie auszudeuten.
- source_word: οὐδεμία
  choice: keinerlei
  rationale: „Keinerlei“ bewahrt die nachdrückliche vollständige Verneinung und klingt in diesem würdigen Kontext natürlich.
theological_decisions:
- issue: Metaphorische Wesensaussage „Gott ist Licht“
  choice: Die Metapher wird unverändert als „Gott ist Licht“ wiedergegeben.
  alternative: „Gott ist das Licht“, „Gott ist reines Licht“ oder „Gott ist heiliges Licht“
  rationale: Der griechische Text formuliert die Metapher ohne Artikel und ohne erklärenden Zusatz. Die direkte Wiedergabe bewahrt ihre theologische Weite und vermeidet eine einengende Auslegung.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdigen Briefstil. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber durch die Stellung „in ihm ist keinerlei Finsternis“ idiomatisch gestaltet. Keine Fußnote ist nötig; die im englischen Beratungstext angegebene Fußnote ist offenkundig falsch platziert und bezeichnet lediglich eine dortige lexikalische Alternative zu „announce“.
