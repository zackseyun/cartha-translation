id: 1JN.1.9
reference: 1 John 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: de
  text: Wenn wir unsere Sünden bekennen, ist er treu und gerecht[a], dass er uns die Sünden vergibt und uns von aller Ungerechtigkeit reinigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl moralische Rechtschaffenheit als auch Gerechtigkeit im rechtlichen Sinn bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: wenn
  rationale: Gibt die Bedingung natürlich wieder, ohne eine regelmäßige Wiederholung wie bei „wann immer“ vorauszusetzen.
- source_word: ὁμολογῶμεν
  choice: wir … bekennen
  rationale: „Bekennen“ bezeichnet im Zusammenhang mit Sünden deren ausdrückliches Eingestehen und bewahrt den ernsten Charakter des Verbs.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: unsere Sünden
  rationale: Direkte und idiomatische Wiedergabe von Objekt und Possessivpronomen.
- source_word: πιστός
  choice: treu
  rationale: Bezeichnet Gottes Verlässlichkeit und entspricht im Deutschen der etablierten Verbindung „treu und gerecht“.
- source_word: δίκαιος
  choice: gerecht
  rationale: Bewahrt die moralische und rechtliche Bedeutungsbreite des griechischen Wortes, ohne den Sinn einseitig forensisch festzulegen.
- source_word: ἵνα
  choice: sodass
  rationale: Gibt die hier mögliche Ziel- beziehungsweise Folgebeziehung zu Vergebung und Reinigung in natürlichem Deutsch wieder, ohne sie genauer festzulegen, als der griechische Satz es tut.
- source_word: ἀφῇ
  choice: vergibt
  rationale: Im Zusammenhang mit Sünden ist „vergeben“ die klare und übliche Bedeutung von ἀφίημι.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: uns die Sünden vergibt
  rationale: Idiomatiche deutsche Wiedergabe der Dativkonstruktion mit direktem Objekt.
- source_word: καθαρίσῃ
  choice: reinigt
  rationale: Erhält das Bild der Beseitigung moralischer Verunreinigung und steht parallel zu „vergibt“.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: von aller Ungerechtigkeit
  rationale: Bewahrt die umfassende moralisch-theologische Bedeutung von ἀδικία und zugleich den sprachlichen Gegensatz zu „gerecht“.
theological_decisions:
- issue: Bedeutung von δίκαιος als Grundlage göttlicher Vergebung
  choice: gerecht
  alternative: rechtschaffen; im Recht
  rationale: „Gerecht“ umfasst sowohl moralische Rechtschaffenheit als auch rechtliche Gerechtigkeit. Damit bleibt offen, in welchem genauen Sinn Gottes Gerechtigkeit mit Vergebung und Reinigung verbunden ist.
- issue: Verhältnis von Gottes Treue und Gerechtigkeit zu Vergebung und Reinigung
  choice: sodass
  alternative: um … zu; dass
  rationale: Die Konstruktion mit ἵνα kann Ziel oder erwartete Folge ausdrücken. „Sodass“ wahrt diesen Zusammenhang, ohne eine bestimmte dogmatische Erklärung dafür einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertrauten Begriffe „Sünden bekennen“, „treu und gerecht“, „vergeben“ und „reinigen“ bleiben erhalten. Der Satzbau ist flüssig, während die Ziel- beziehungsweise Folgebeziehung von ἵνα und die Bedeutungsbreite von δίκαιος sichtbar bleiben.
