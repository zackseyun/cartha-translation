review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Bedingung (ἐὰν), das Bekennen der eigenen Sünden, Gottes Treue und Gerechtigkeit sowie Vergebung und Reinigung von jeder Ungerechtigkeit sachgerecht wieder. Die deutsche Konjunktion „sodass“ legt jedoch stärker eine tatsächliche Folge nahe. Das griechische ἵνα beschreibt hier die auf Vergebung und Reinigung gerichtete Folge bzw. Zielbestimmung; „dass“ gibt die im Deutschen etablierte und weniger festlegende Verbindung nach „treu und gerecht“ besser wieder.
  naturalness: Der Vers ist in modernem, würdigem Standarddeutsch flüssig. „Wenn wir unsere Sünden bekennen“, „treu und gerecht“, „uns die Sünden vergibt“ und „von aller Ungerechtigkeit reinigt“ sind idiomatisch und registergerecht. Die Änderung von „sodass“ zu „dass“ verbessert zugleich die natürliche Nähe zur traditionellen deutschen Satzfügung.
  terminology: „Sünden“, „bekennen“, „treu“, „gerecht“, „vergeben“, „reinigen“ und „Ungerechtigkeit“ sind treffend. „Gerecht“ für δίκαιος wahrt die moralische wie rechtliche Spannweite; die Fußnote erläutert dies angemessen, ohne eine theologische Deutung vorzuschreiben.
  issues:
