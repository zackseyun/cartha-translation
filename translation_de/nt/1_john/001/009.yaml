  rationale: Eine begrenzte syntaktische Korrektur ersetzt „sodass“ durch „dass“, um die Funktion von ἵνα weniger einseitig als reine Folge zu bestimmen. Alle sonstigen Formulierungen bleiben erhalten, da sie quellennah, idiomatisch und terminologisch angemessen sind.
