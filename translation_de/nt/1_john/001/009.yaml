    issue: „sodass“ für ἵνα
    rationale: „Sodass“ kennzeichnet im heutigen Deutsch vor allem eine Konsequenz und kann daher die semantische Offenheit von ἵνα unnötig einengen. „Dass“ lässt den Zusammenhang von Gottes Treue und Gerechtigkeit mit Vergebung und Reinigung offener und entspricht der etablierten deutschen Wiedergabe dieses Satzes besser.
  revised_text: Wenn wir unsere Sünden bekennen, ist er treu und gerecht[a], dass er uns die Sünden vergibt und uns von aller Ungerechtigkeit reinigt.
