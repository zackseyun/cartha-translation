id: 1JN.1.8
reference: 1 John 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: de
  text: Wenn wir sagen, dass wir keine Sünde haben[a], täuschen wir uns selbst, und die Wahrheit ist nicht in uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker deutend: „nicht sündig sind“; wörtlich steht im Griechischen: „keine Sünde haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Wenn wir sagen
  rationale: Die Verbindung aus ἐὰν und Aorist Konjunktiv bildet eine offene Bedingung; im modernen Deutschen ist „Wenn wir sagen“ natürlich und präzise.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: dass wir keine Sünde haben
  rationale: Die artikellose Einzahl bezeichnet hier Sünde als vorhandene Wirklichkeit, nicht notwendig eine einzelne Tat. Die Formulierung bewahrt zudem den Unterschied zu der Aussage über begangene Sünde in Vers 10.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: täuschen wir uns selbst
  rationale: Im reflexiven Zusammenhang bezeichnet πλανάω Selbsttäuschung; die deutsche Formulierung ist klar und idiomatisch.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Der Artikel wird wiedergegeben. „Die Wahrheit“ bewahrt die johanneische Bedeutungsweite zwischen objektiver göttlicher Wahrheit und subjektiver Wahrhaftigkeit.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: ist nicht in uns
  rationale: Die knappe, natürliche Wiedergabe erhält sowohl die räumliche Metapher als auch ihre innere, persönliche Dimension.
theological_decisions:
- issue: Bedeutung von „Sünde haben“
  choice: „keine Sünde haben“ als Leugnung der gegenwärtigen Wirklichkeit von Sünde
  alternative: „keine Sünde begangen haben“ oder interpretierend „nicht sündig sein“
  rationale: Der griechische Text spricht vom Haben der Sünde und nicht vom Begehen einzelner Sünden. Die Übersetzung wahrt die Spannung sowie den Unterschied zu Vers 10.
- issue: Bedeutung von „die Wahrheit ist nicht in uns“
  choice: Die kompakte Formulierung wird unverändert bewahrt.
  alternative: „Gottes Wahrheit ist nicht in uns“ oder „wir leben nicht in der Wahrheit“
  rationale: Der Ausdruck kann sowohl Gottes offenbarte Wahrheit als auch Wahrhaftigkeit umfassen. Eine Erweiterung würde die im Griechischen offene Bedeutungsfülle einengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die traditionelle Formulierung „Sünde haben“ wurde trotz ihrer leichten Fremdheit beibehalten, weil sie die Ausdrucksweise und theologische Spannung des griechischen Textes präzise wahrt.
