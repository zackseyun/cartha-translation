id: 1JN.3.17
reference: 1 John 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: de
  text: Wer aber die Güter dieser Welt hat und sieht, dass sein Bruder Not leidet,[a] ihm aber sein Herz verschließt:[b] Wie bleibt die Liebe Gottes in ihm?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sein Bruder oder seine Schwester Not leidet“. Das griechische Wort lautet „Bruder“ und kann hier stellvertretend einen anderen Gläubigen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seine inneren Organe vor ihm verschließt“; dies ist ein Bild dafür, dass jemand sein tief empfundenes Mitgefühl verweigert.'
    reason: lexical_alternative
  - marker: c
    text: „Die Liebe Gottes“ kann Gottes Liebe meinen, die in ihm gegenwärtig ist, oder seine Liebe zu Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: die Güter dieser Welt
  rationale: βίος bezeichnet hier angesichts der Not des Bruders die materiellen Mittel zum Lebensunterhalt. „Die Güter dieser Welt“ ist natürliches Deutsch und bewahrt den Bezug auf irdischen Besitz.
- source_word: θεωρῇ
  choice: sieht
  rationale: Das Verb bezeichnet bewusstes Wahrnehmen oder Beobachten. „Sieht“ drückt die unmittelbare Kenntnis der Not schlicht und treffend aus.
- source_word: ἀδελφὸν αὐτοῦ
  choice: sein Bruder
  rationale: Der griechische Ausdruck steht im maskulinen Singular. Die breitere repräsentative Bedeutung innerhalb der Glaubensgemeinschaft wird in einer Fußnote erläutert.
- source_word: χρείαν ἔχοντα
  choice: Not leidet
  rationale: Die Wendung bedeutet wörtlich „Bedarf hat“. „Not leidet“ ist idiomatisches Deutsch und bezeichnet hier das Fehlen notwendiger Lebensgüter.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: ihm aber sein Herz verschließt
  rationale: σπλάγχνα bezeichnet wörtlich die inneren Organe und bildlich inniges Mitgefühl. Die deutsche Herzmetapher gibt die bewusste Verweigerung des Mitgefühls natürlich wieder; der Dativ „ihm“ bringt die Abwendung vom Bedürftigen zum Ausdruck.
- source_word: πῶς
  choice: Wie
  rationale: Die direkte rhetorische Frage bewahrt die griechische Form, ohne durch „wie kann“ eine zusätzliche Modalität einzutragen.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: die Liebe Gottes
  rationale: Diese formnahe Wiedergabe lässt offen, ob Gottes Liebe im Menschen oder die Liebe des Menschen zu Gott gemeint ist.
- source_word: μένει ἐν αὐτῷ
  choice: bleibt ... in ihm
  rationale: „Bleiben“ ist die natürliche deutsche Entsprechung des johanneischen Schlüsselverbs μένω und wahrt dessen fortdauernden Sinn.
theological_decisions:
- issue: Genitivische Mehrdeutigkeit von ἡ ἀγάπη τοῦ θεοῦ
  choice: die Liebe Gottes
  alternative: Gottes Liebe zu ihm; seine Liebe zu Gott
  rationale: Der griechische Genitiv kann als Liebe von Gott oder als Liebe zu Gott verstanden werden. Die Hauptfassung bewahrt diese theologisch bedeutsame Spannung.
- issue: Geschlechtsbezogene Wiedergabe von ἀδελφόν
  choice: sein Bruder
  alternative: sein Bruder oder seine Schwester; ein Glaubensgeschwister
  rationale: Der Ausgangstext verwendet den maskulinen Singular. Eine Fußnote macht kenntlich, dass „Bruder“ repräsentativ auch eine Schwester beziehungsweise einen anderen Gläubigen bezeichnen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Gegenüberstellung von vorhandenem Besitz, erkannter Not und bewusst verweigertem Mitgefühl. Die rhetorische Schlussfrage sowie die Mehrdeutigkeit von „Liebe Gottes“ bleiben erhalten.
