id: 1JN.3.10
reference: 1 John 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: de
  text: Daran sind die Kinder Gottes und die Kinder des Teufels zu erkennen:[a] Jeder, der nicht gerecht handelt,[b] ist nicht aus Gott, ebenso wenig derjenige, der seinen Bruder nicht liebt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Hierin“ oder „Hieran“. Die griechische Wendung kann die Grundlage oder das Merkmal bezeichnen, woran diese Unterscheidung erkannt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „nicht Gerechtigkeit tut“; auch: „nicht recht handelt“. Das griechische Wort kann Gerechtigkeit oder Recht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder dem Sinn nach: „seinen Bruder oder seine Schwester“, also einen anderen Glaubenden. Im Griechischen steht die maskuline Singularform „seinen Bruder“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Daran
  rationale: Die Wendung bezeichnet hier das Erkennungsmerkmal beziehungsweise die Grundlage, an der die folgende Unterscheidung sichtbar wird, ohne die mögliche Nuance von „hierin“ auszuschließen.
- source_word: φανερά ἐστιν
  choice: sind … zu erkennen
  rationale: Die idiomatische deutsche Formulierung gibt den Zustand des Offenbar- oder Erkennbarseins natürlich wieder.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: die Kinder Gottes und die Kinder des Teufels
  rationale: Die ausdrückliche familiäre Bildsprache und der scharfe Gegensatz des griechischen Textes bleiben erhalten.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: Jeder, der nicht gerecht handelt
  rationale: Das substantivierte Präsenspartizip bezeichnet kennzeichnendes Verhalten. „Gerecht handeln“ ist im modernen Deutsch natürlicher als „Gerechtigkeit tun“ und bewahrt die ethische Bedeutung.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: ist nicht aus Gott
  rationale: „Aus Gott“ bewahrt die johanneische Sprache von Ursprung und Zugehörigkeit, ohne sie interpretierend auf eine einzige dogmatische Kategorie festzulegen.
- source_word: καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: ebenso wenig derjenige, der seinen Bruder nicht liebt
  rationale: Die Ellipse des Verbs wird im Deutschen verständlich wiedergegeben; „Bruder“ erhält die maskuline Singularform des Ausgangstextes.
theological_decisions:
- issue: Familiäre Bezeichnungen geistlicher Zugehörigkeit
  choice: Kinder Gottes und Kinder des Teufels
  alternative: Menschen, die zu Gott beziehungsweise zum Teufel gehören
  rationale: τέκνα ist ausdrücklich familiär und prägt die Theologie des Abschnitts; eine verallgemeinernde Umschreibung würde das Bild abschwächen.
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: gerecht handelt
  alternative: Gerechtigkeit übt / Recht tut
  rationale: Im Kontext geht es um eine kennzeichnende, mit Gottes Wesen übereinstimmende Lebensführung. Die Übersetzung hält den ethischen Sinn offen, ohne ihn auf gesellschaftliche Rechtspflege zu verengen.
- issue: Generischer oder ausschließlich männlicher Bezug von ἀδελφός
  choice: seinen Bruder
  alternative: seinen Bruder oder seine Schwester / sein Glaubensgeschwister
  rationale: Der Haupttext folgt der grammatisch maskulinen Singularform. Die im Kontext mögliche umfassendere Beziehung zu anderen Glaubenden wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „zu erkennen“ ist idiomatisch, während „aus Gott“ bewusst die prägnante johanneische Ursprungssprache bewahrt. Der Doppelpunkt leitet die Erklärung der zuvor genannten Erkennbarkeit ein.
