  source_fidelity: 'Der deutsche Text gibt die Struktur und Aussage des griechischen Textes zuverlässig wieder: ἐν τούτῳ ist mit „Daran“ angemessen offen wiedergegeben, φανερά ἐστιν mit der idiomatischen Form „sind … zu erkennen“, und die beiden Gruppen bleiben ausdrücklich „Kinder Gottes“ beziehungsweise „Kinder des Teufels“. „Jeder, der nicht gerecht handelt“ vermittelt den generisch-kennzeichnenden Sinn des Präsenspartizips hinreichend. „Ist nicht aus Gott“ bewahrt die prägnante johanneische Herkunfts- und Zugehörigkeitssprache. Die elliptische zweite Negativaussage wird in „ebenso wenig derjenige, der seinen Bruder nicht liebt“ sachgerecht fortgeführt.'
