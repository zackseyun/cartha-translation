id: 1JN.3.24
reference: 1 John 3:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: de
  text: 'Und wer seine Gebote hält, bleibt in ihm, und er bleibt in ihm. Daran erkennen wir, dass er in uns bleibt: an dem Geist[a], den er uns gegeben hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Geist“. Die griechische Präposition kann neben der Grundlage oder dem Erkennungsmerkmal auch die Herkunft betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: hält
  rationale: „Gebote halten“ ist im Deutschen eine natürliche, inhaltlich genaue Wiedergabe von τηρέω und umfasst sowohl Gehorsam als auch treues Beachten.
- source_word: ἐντολάς
  choice: Gebote
  rationale: „Gebote“ entspricht dem johanneischen Gebrauch von ἐντολή und bewahrt dessen verbindlichen moralischen Gehalt.
- source_word: μένει
  choice: bleibt
  rationale: „Bleibt“ gibt das johanneische Schlüsselwort μένω klar und einheitlich wieder und bewahrt den Gedanken einer fortdauernden Beziehung.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Daran erkennen wir
  rationale: Die Formulierung ist idiomatisches modernes Deutsch und bezeichnet das anschließende Erkennungsmerkmal beziehungsweise die Grundlage der Erkenntnis.
- source_word: ἐκ τοῦ πνεύματος
  choice: an dem Geist
  rationale: Im Zusammenhang bezeichnet ἐκ den Geist als Grundlage oder Erkennungszeichen. „An dem Geist“ schließt natürlich an „Daran erkennen wir“ an; die mögliche Betonung der Herkunft wird in der Fußnote bewahrt.
- source_word: πνεύματος
  choice: Geist
  rationale: Der Kontext verweist auf den von Gott gegebenen Heiligen Geist. Die Großschreibung macht diesen Bezug kenntlich, ohne „heilig“ ausdrücklich hinzuzufügen.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: den er uns gegeben hat
  rationale: Das Relativpronomen stimmt im Deutschen mit „Geist“ überein. Das deutsche Perfekt gibt die vollzogene Gabe natürlich wieder, ohne ihren fortdauernden Bezug auszuschließen.
theological_decisions:
- issue: Bezug der Pronomen αὐτῷ und αὐτός sowie des Subjekts von μένει ἐν ἡμῖν
  choice: Die Pronomen bleiben als „ihm“ beziehungsweise „er“ stehen; im unmittelbaren Zusammenhang beziehen sie sich auf Gott.
  alternative: Die Aussage über das Wohnen in den Glaubenden kann innerhalb der johanneischen Theologie auch christologisch mitgehört werden.
  rationale: Der griechische Text verwendet Pronomen und nennt den Bezug hier nicht erneut ausdrücklich. Die Übersetzung bewahrt diese Form und legt die weiter reichende theologische Beziehung nicht unnötig fest.
- issue: Identität von πνεῦμα
  choice: „Geist“ wird großgeschrieben und als Gottes Geist verstanden.
  alternative: „geist“ als unpersönliche geistige Gabe oder menschlicher Geist.
  rationale: Die Wendung „den er uns gegeben hat“ und der johanneische Kontext sprechen für Gottes Geist. Die Übersetzung fügt dennoch weder „Heiliger“ noch „sein“ hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreimalige Wiedergabe von μένω mit „bleiben“ bewahrt die johanneische Wortwiederholung. Die Pronomen werden nicht durch „Gott“ oder „Christus“ ersetzt, sodass die Ausdrucksweise und mögliche theologische Spannung des Ausgangstextes erhalten bleiben.
