id: 1JN.3.18
reference: 1 John 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: de
  text: Kinder[a], lasst uns nicht mit Worten oder mit der Zunge[b] lieben, sondern in Tat und Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Anrede ist eine liebevolle Verkleinerungsform; sinngemäß auch „liebe Kinder“.
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: im Reden; griechisch wörtlich „mit der Zunge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Kinder
  rationale: Die Anrede ist die liebevolle Verkleinerungsform von τέκνον. Im heutigen Standarddeutsch gibt es dafür keine natürliche, würdige Diminutivform; „Kinder“ bewahrt die familiäre Anrede, ohne das im Griechischen nicht ausdrücklich vorhandene Possessiv „meine“ einzufügen.
- source_word: μὴ ἀγαπῶμεν
  choice: lasst uns nicht … lieben
  rationale: Der Präsens Konjunktiv mit μή formuliert eine Aufforderung in der ersten Person Plural. „Lasst uns nicht … lieben“ gibt diese gemeinschaftliche Mahnung unmittelbar wieder.
- source_word: λόγῳ
  choice: mit Worten
  rationale: λόγος bezeichnet hier sprachlichen Ausdruck. Der deutsche Plural „mit Worten“ ist idiomatischer als das wörtlichere „im Wort“ und erhält den Gegensatz zur tätigen Liebe.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: oder mit der Zunge
  rationale: γλῶσσα bedeutet wörtlich „Zunge“ und steht hier metonymisch für das Reden. Die konkrete Bildsprache bleibt erhalten; „oder“ ist nach der deutschen Verneinung natürlich.
- source_word: ἀλλὰ ἐν ἔργῳ
  choice: sondern in Tat
  rationale: ἀλλά setzt einen starken Gegensatz, und ἔργον bezeichnet eine Tat oder Handlung. „Sondern in Tat“ ist knapp und bildet zusammen mit „Wahrheit“ eine prägnante Gegenüberstellung zu bloßen Worten.
- source_word: καὶ ἀληθείᾳ
  choice: und Wahrheit
  rationale: ἀλήθεια wird mit „Wahrheit“ wiedergegeben, damit sowohl die Echtheit der Liebe als auch die für den Ersten Johannesbrief charakteristische umfassendere Bedeutung von Wahrheit offenbleibt.
theological_decisions:
- issue: Bedeutung von ἀλήθεια in „in Tat und Wahrheit“
  choice: Wahrheit
  alternative: Aufrichtigkeit; Echtheit
  rationale: '„Aufrichtigkeit“ oder „Echtheit“ würde den Sinn auf subjektive Lauterkeit verengen. „Wahrheit“ bewahrt die mögliche Doppelaussage: Liebe soll sich konkret erweisen und zugleich der Wahrheit Gottes entsprechen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Anrede bleibt schlicht; die konkrete Wendung „mit der Zunge“ und die johanneische Spannung in „Tat und Wahrheit“ werden bewahrt.
