id: 1JN.3.3
reference: 1 John 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: de
  text: Und jeder, der diese Hoffnung auf ihn setzt[a], reinigt sich selbst, so wie er[b] rein ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „der diese Hoffnung in ihm hat“. Die griechische Wendung kann die Person bezeichnen, auf die sich die Hoffnung richtet, oder den Grund, auf dem sie beruht.'
    reason: lexical_alternative
  - marker: b
    text: „Er“ bezieht sich im Zusammenhang sehr wahrscheinlich auf den Sohn beziehungsweise Christus; der griechische Text nennt den Bezug jedoch nur durch ein Pronomen.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: jeder, der … setzt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden Menschen, auf den die Aussage zutrifft. Die Verbindung mit „setzt“ ergibt im Deutschen eine natürliche Wiedergabe der gesamten Wendung „die Hoffnung auf jemanden haben/setzen“.
- source_word: τὴν ἐλπίδα ταύτην
  choice: diese Hoffnung
  rationale: Die demonstrative Form verweist auf die unmittelbar zuvor genannte Hoffnung; „diese Hoffnung“ gibt dies knapp und idiomatisch wieder.
- source_word: ἐπ’ αὐτῷ
  choice: auf ihn
  rationale: ἐπί mit Dativ bezeichnet hier am ehesten die Person, auf die sich die Hoffnung richtet oder auf der sie beruht. „Auf ihn“ wahrt diese Ausrichtung, ohne den pronominalen Bezug durch einen Titel festzulegen.
- source_word: ἁγνίζει ἑαυτὸν
  choice: reinigt sich selbst
  rationale: „Reinigt“ bewahrt die ethisch-religiöse Bedeutung von ἁγνίζω und zusammen mit „rein“ die Wortverwandtschaft zu ἁγνός. „Sich selbst“ gibt das Reflexivpronomen ausdrücklich wieder.
- source_word: καθὼς
  choice: so wie
  rationale: Die Wendung markiert den Vergleich klar und klingt in modernem Standarddeutsch natürlich.
- source_word: ἐκεῖνος
  choice: er
  rationale: Das griechische Demonstrativpronomen hebt den bereits Gemeinten hervor. Das wörtlichere „jener“ wäre im heutigen Deutsch unnötig distanzierend; „er“ bewahrt den nicht ausdrücklich benannten Bezug in natürlicher Sprache.
- source_word: ἁγνός
  choice: rein
  rationale: „Rein“ entspricht dem ethisch verstandenen ἁγνός und erhält die erkennbare Verbindung zu „reinigt“.
theological_decisions:
- issue: Bezug von αὐτῷ und ἐκεῖνος
  choice: Die Pronomen bleiben als „ihn“ und „er“ stehen; im Zusammenhang beziehen sie sich am ehesten auf den Sohn beziehungsweise Christus.
  alternative: αὐτῷ kann auf Gott den Vater bezogen werden; möglicherweise bleibt der Bezug zwischen Vater und Sohn bewusst offen.
  rationale: Der vorausgehende Zusammenhang, besonders die Erwartung, ihn zu sehen, wie er ist, spricht stark für Christus. Da der griechische Text jedoch keinen Titel nennt, wird der Bezug in der Übersetzung nicht ausdrücklich festgelegt.
- issue: Eigenes Reinigen und göttliche Reinheit
  choice: „reinigt sich selbst“ wird ohne abschwächenden oder erklärenden Zusatz wiedergegeben.
  alternative: Eine Umschreibung könnte das Reinigen als bloßes Streben nach Reinheit darstellen.
  rationale: Der Text formuliert eine wirkliche ethische Tätigkeit des Hoffenden und stellt sie neben die Reinheit des Bezugsgegenübers. Eine Erklärung ihres Verhältnisses zu Gottes Wirken würde über den Vers hinausgehen.
- issue: Generischer Singular
  choice: „jeder … sich selbst“
  alternative: „alle … sich selbst“ oder eine unpersönliche Formulierung
  rationale: Der generische Singular des griechischen Textes lässt sich im Deutschen mit „jeder“ genau und allgemein verständlich wiedergeben, ohne den Aussagebereich auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die Wortverbindung „reinigt … rein“ werden bewahrt. „Er“ ist gegenüber dem formnäheren „jener“ im heutigen Deutsch natürlicher und lässt den im Griechischen nicht ausdrücklich benannten Bezug offen.
