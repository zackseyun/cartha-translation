  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: de
  text: Wer Sünde tut, tut auch Gesetzlosigkeit[a]; und Sünde ist Gesetzlosigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Präsensformen können hier ein fortgesetztes oder kennzeichnendes Tun ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Wer Sünde praktiziert
  rationale: Die substantivierte Präsenspartizipialform ist allgemein gemeint. „Wer“ gibt diesen generischen Bezug im Deutschen natürlich wieder. „Praktiziert“ lässt im Zusammenhang kennzeichnendes oder fortgesetztes Tun anklingen, ohne den Satz auf eine einzelne Tat zu beschränken.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: praktiziert auch Gesetzlosigkeit
  rationale: Die Wiederholung von „praktiziert“ bewahrt die auffällige verbale Parallelität von ποιῶν und ποιεῖ. „Gesetzlosigkeit“ gibt ἀνομία direkt wieder und vermeidet die engere Auslegung als bloßen einzelnen Gesetzesverstoß.
- source_word: ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: Sünde ist Gesetzlosigkeit
  rationale: Die artikulierten abstrakten Substantive stehen in einer zugespitzten definierenden Aussage. Im Deutschen werden sie hier idiomatisch ohne Artikel wiedergegeben.
theological_decisions:
- issue: Ob die griechischen Präsensformen als einzelnes Tun oder als kennzeichnendes beziehungsweise fortgesetztes Handeln wiederzugeben sind
  choice: „praktiziert“ als Hinweis auf kennzeichnendes oder fortgesetztes Handeln
  alternative: „tut“ oder „begeht“
  rationale: Der unmittelbare Zusammenhang legt eine Lebenspraxis beziehungsweise kennzeichnendes Verhalten nahe. Die Formulierung behauptet jedoch nicht, das griechische Präsens bezeichne technisch immer Gewohnheit; die wörtlichere Möglichkeit wird in der Fußnote offengehalten.
- issue: Bedeutung von ἀνομία in der definierenden Aussage
  choice: Gesetzlosigkeit
  alternative: Gesetzesübertretung; Unrecht
  rationale: „Gesetzlosigkeit“ bewahrt den Bezug zu νόμος und die theologische Spannung der knappen Gleichsetzung, ohne eigenmächtig festzulegen, welches Gesetz im Einzelnen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst markante Wiederholung von „praktiziert“ folgt der Parallelität des griechischen Satzes; „Gesetzlosigkeit“ bleibt als theologischer Schlüsselbegriff unumschrieben.
