  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: de
  text: Wundert euch nicht, Brüder[a], wenn die Welt euch hasst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ gibt die maskuline Pluralform des griechischen Wortes wieder; hier ist wahrscheinlich die ganze Gemeinschaft der Glaubenden einschließlich der Frauen angesprochen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Wundert euch nicht
  rationale: Der verneinte Präsensimperativ wird als natürliche deutsche Aufforderung wiedergegeben. „Sich wundern“ trifft hier den Sinn von θαυμάζω, ohne altertümlich oder unnötig erklärend zu wirken.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Vokativ Plural wird formal bewahrt. Im Zusammenhang ist wahrscheinlich die ganze Gemeinschaft der Glaubenden einschließlich der Frauen angesprochen; dies wird in einer Fußnote erläutert.
- source_word: εἰ
  choice: wenn
  rationale: εἰ leitet formal eine Bedingung ein. Im Deutschen gibt „wenn“ die als reale Möglichkeit beziehungsweise Erfahrung vorausgesetzte Situation natürlicher wieder als „falls“, ohne sie zu einer ausdrücklich zeitlichen Aussage umzudeuten.
- source_word: μισεῖ
  choice: hasst
  rationale: Das Präsens wird schlicht mit „hasst“ wiedergegeben und bezeichnet die gegenwärtige beziehungsweise allgemeine Haltung der Welt.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: „Die Welt“ bewahrt den charakteristischen johanneischen Ausdruck und seine theologische Bedeutungsbreite, statt ihn im Haupttext als gottfeindliche Gesellschaft oder Weltordnung auszudeuten.
theological_decisions:
- issue: Repräsentativ maskuline Anrede ἀδελφοί
  choice: „Brüder“ im Haupttext beibehalten
  alternative: „Brüder und Schwestern“ oder „Geschwister“
  rationale: Die grammatisch maskuline Form der Quelle bleibt sichtbar. Dass die Anrede wahrscheinlich die gesamte Glaubensgemeinschaft einschließt, wird erläutert, statt die Form im Haupttext stillschweigend zu neutralisieren.
- issue: Johanneische Bedeutung von κόσμος
  choice: „die Welt“ ohne interpretierende Erweiterung
  alternative: „die gottfeindliche Weltordnung“ oder „die von Gott entfremdete Gesellschaft“
  rationale: Der Kontext trägt die mögliche Bedeutung einer Gott widerstehenden Menschheit. Die knappe Wiedergabe bewahrt jedoch die Mehrdeutigkeit und den vertrauten johanneischen Sprachgebrauch.
- issue: Bedingungssatz mit εἰ
  choice: „wenn“
  alternative: „falls“ oder „dass“
  rationale: „Wenn“ wahrt die konditionale Form und lässt zugleich offen, wie stark der Verfasser mit dem tatsächlichen Hass der Welt rechnet. „Dass“ würde die Bedingung auflösen, „falls“ könnte sie zu ungewiss erscheinen lassen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Satzführung. Die traditionelle johanneische Wendung „die Welt“ bleibt erhalten; die Anrede wird formal genau und durch eine inklusive Sachklärung in der Fußnote wiedergegeben.
