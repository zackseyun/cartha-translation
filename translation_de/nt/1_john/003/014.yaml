source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: de
  text: Wir wissen, dass wir aus dem Tod ins Leben hinübergegangen sind, weil wir die Brüder lieben.[a] Wer nicht liebt, bleibt im Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Brüder und Schwestern«; im Griechischen steht »die Brüder«, womit hier wahrscheinlich die Glaubensgeschwister insgesamt gemeint sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Die Perfektform οἶδα wird im Koine-Griechischen als präsentisches Zustandsverb gebraucht; »wir wissen« ist die natürliche deutsche Entsprechung.
- source_word: μεταβεβήκαμεν
  choice: wir sind … hinübergegangen
  rationale: Das Perfekt bezeichnet einen vollzogenen Übergang mit fortdauerndem Ergebnis. »Hinübergegangen« bewahrt sowohl die Bewegungsvorstellung als auch den erreichten Zustand.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: aus dem Tod ins Leben
  rationale: Die Präpositionen ἐκ und εἰς bezeichnen die Bewegung aus einem Bereich heraus und in einen anderen hinein; »aus … ins« bildet dies prägnant ab.
- source_word: ἀγαπῶμεν
  choice: wir … lieben
  rationale: Das Präsens beschreibt hier ein fortdauerndes beziehungsweise kennzeichnendes Verhalten; »lieben« ist die klare und sachgerechte Wiedergabe.
- source_word: τοὺς ἀδελφούς
  choice: die Brüder
  rationale: Die griechische Form ist maskulin plural. Der Haupttext erhält diese Form; eine Fußnote nennt den im Zusammenhang wahrscheinlich mitgemeinten umfassenden Kreis der Glaubensgeschwister.
- source_word: ὁ μὴ ἀγαπῶν
  choice: Wer nicht liebt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein einen Menschen, der nicht liebt. Die deutsche Formulierung ist idiomatisch und erhält den generischen Sinn.
- source_word: μένει
  choice: bleibt
  rationale: »Bleibt« ist eine natürliche Wiedergabe des johanneischen Schlüsselverbs μένω und bezeichnet hier das Fortbestehen eines Zustands.
- source_word: ἐν τῷ θανάτῳ
  choice: im Tod
  rationale: Die knappe metaphorische Wendung bleibt unaufgelöst und bewahrt so die Aussage vom Verbleiben im Bereich des Todes.
theological_decisions:
- issue: Referent und Geschlechtsbezug von ἀδελφοί
  choice: Im Haupttext steht »die Brüder«; eine Fußnote weist auf den wahrscheinlich umfassenden Bezug auf Glaubensgeschwister hin.
  alternative: die Brüder und Schwestern; die Glaubensgeschwister
  rationale: Die griechische Form ist grammatisch maskulin plural, bezeichnet im johanneischen Kontext aber wahrscheinlich die Gemeinschaft der Glaubenden einschließlich der Frauen. Haupttext und Fußnote bewahren gemeinsam Form und wahrscheinlichen Umfang.
- issue: Bedeutung von »Tod« und »Leben«
  choice: Die Begriffe bleiben ohne erklärenden Zusatz als »Tod« und »Leben« stehen.
  alternative: geistlicher Tod und ewiges Leben; Bereich des Todes und Bereich des Lebens
  rationale: Der Text beschreibt einen tiefgreifenden theologischen Übergang, bestimmt dessen Begriffe hier jedoch nicht ausdrücklich näher. Eine Ausdeutung würde die kompakte Metaphorik unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Hinübergegangen« erhält das Übergangsbild des griechischen Perfekts; »bleibt« ist zugänglich und wahrt zugleich den johanneischen Sprachgebrauch.
