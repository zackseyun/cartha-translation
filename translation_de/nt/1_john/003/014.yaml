  terminology: „Tod“, „Leben“, „lieben“ und „bleibt“ sind konsistent und theologisch nicht überdeutet. „Die Brüder“ bildet die maskuline griechische Form ab; die Fußnote erläutert angemessen den im Kontext wahrscheinlich umfassenderen Bezug. Der Fußnotenanker ist vorhanden und die Fußnote ist inhaltlich zutreffend.
