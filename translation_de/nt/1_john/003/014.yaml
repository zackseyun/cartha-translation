  source_fidelity: Die Übersetzung gibt οἴδαμεν präsentisch korrekt mit „Wir wissen“ wieder und bewahrt mit „aus dem Tod ins Leben hinübergegangen“ sowohl die Richtungsbewegung von ἐκ … εἰς als auch die resultative Kraft des Perfekts μεταβεβήκαμεν. Die kausale Verbindung des zweiten ὅτι („weil“) sowie der generische Charakter von ὁ μὴ ἀγαπῶν („Wer nicht liebt“) sind zutreffend. „Bleibt im Tod“ ist eine knappe, genaue Wiedergabe von μένει ἐν τῷ θανάτῳ, ohne die Metapher auszudeuten.
