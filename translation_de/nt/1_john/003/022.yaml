source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: de
  text: Und worum wir auch bitten, das empfangen wir von ihm, weil wir seine Gebote halten und tun, was in seinen Augen[a] wohlgefällig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor ihm; oder: in seiner Gegenwart.'
    reason: Lexikalische Alternativen für ἐνώπιον αὐτοῦ.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: worum … auch
  rationale: Die Verbindung aus Relativpronomen und ἐάν bildet einen indefiniten Relativsatz. Mit dem auf das Bitten bezogenen „worum … auch“ wird dieser im Deutschen natürlich wiedergegeben.
- source_word: αἰτῶμεν
  choice: wir bitten
  rationale: αἰτέω bezeichnet hier das bittende Ersuchen, besonders im Gebetszusammenhang. „Bitten“ ist im Deutschen treffender als das allgemeinere „fragen“.
- source_word: λαμβάνομεν
  choice: das empfangen wir
  rationale: Das Präsens bezeichnet eine allgemeine Aussage. „Empfangen“ bewahrt den Gedanken des Empfangens von Gott und passt zum würdevollen Register.
- source_word: ἀπ’ αὐτοῦ
  choice: von ihm
  rationale: 'ἀπό mit Genitiv kennzeichnet die Quelle: Das Erbetene wird von ihm empfangen.'
- source_word: ὅτι
  choice: weil
  rationale: ὅτι begründet hier ausdrücklich die vorherige Aussage. „Weil“ erhält diese kausale Verknüpfung.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: seine Gebote
  rationale: „Gebote“ entspricht dem johanneischen Gebrauch von ἐντολή und wahrt dessen ethisch-theologische Begrifflichkeit.
- source_word: τηροῦμεν
  choice: wir … halten
  rationale: τηρέω kann bewahren, beachten oder halten bedeuten. „Gebote halten“ ist idiomatisch und weniger ausdeutend als „gehorchen“.
- source_word: τὰ ἀρεστὰ
  choice: was … wohlgefällig ist
  rationale: Das substantivierte Neutrum Plural bezeichnet das, was gefällt. „Wohlgefällig“ gibt den ethischen und auf Gott bezogenen Sinn prägnant wieder.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: ἐνώπιον bedeutet „vor“ beziehungsweise „im Angesicht von“. „Vor ihm“ ist knapp, transparent und bewahrt das räumlich-metaphorische Bild.
- source_word: ποιοῦμεν
  choice: tun
  rationale: ποιέω ist das gewöhnliche Verb für „tun“. Die Übersetzung vermeidet eine zusätzliche Deutung als dauerhaftes Praktizieren.
theological_decisions:
- issue: Zusammenhang zwischen erhörtem Gebet und Gehorsam
  choice: 'Die mit ὅτι formulierte Begründung bleibt ausdrücklich kausal: Wir empfangen, weil wir seine Gebote halten und das vor ihm Wohlgefällige tun.'
  alternative: Die Aussage lediglich als lose Verbindung oder Begleiterscheinung wiederzugeben.
  rationale: Der griechische Text nennt ausdrücklich einen Grund. Die Übersetzung wahrt diese theologische Spannung, ohne daraus eine mechanische Garantie für jede beliebige Bitte zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Form „worum … auch, das“ ist klar und natürlich; „wohlgefällig“ ist leicht gehoben, im religiös-ethischen Zusammenhang jedoch verständlich und präzise.
