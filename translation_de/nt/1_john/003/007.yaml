  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: de
  text: Kinder[a], lasst euch von niemandem täuschen[b]. Wer Gerechtigkeit übt[c], ist gerecht, genauso wie jener gerecht ist[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „Kinderchen“; eine liebevolle Anrede.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in die Irre führen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gerecht handelt“; gemeint ist ein kennzeichnendes, fortgesetztes Tun.'
    reason: lexical_alternative
  - marker: d
    text: Mit „jener“ ist wahrscheinlich Christus gemeint; manche beziehen das Wort auf Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Ihr Kinder
  rationale: Die Anrede ist liebevoll und familiär. „Ihr Kinder“ klingt im heutigen Standarddeutsch natürlich und würdevoll; das wörtlichere „Kinderchen“ wäre zwar diminutiv, wirkt heute aber leicht verniedlichend oder altertümlich.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: lasst euch von niemandem täuschen
  rationale: Die deutsche Konstruktion gibt das Verbot idiomatisch wieder. πλανάω kann sowohl Täuschung als auch Irreführung bezeichnen; im Zusammenhang geht es um irreführende moralisch-theologische Behauptungen.
- source_word: ὁ ποιῶν τὴν δικαιοσύνην
  choice: Wer Gerechtigkeit übt
  rationale: Das substantivierte Präsenspartizip bezeichnet charakteristisches beziehungsweise fortgesetztes Handeln. „Gerechtigkeit übt“ wahrt den Bezug zu δικαιοσύνη und klingt natürlicher als „die Gerechtigkeit tut“.
- source_word: δίκαιός ἐστιν
  choice: ist gerecht
  rationale: „Gerecht“ bewahrt die Wortverwandtschaft und den gedanklichen Zusammenhang mit „Gerechtigkeit“.
- source_word: καθὼς
  choice: genauso wie
  rationale: Die Formulierung bringt die ausdrückliche Entsprechung beziehungsweise den Vergleichsmaßstab klar zum Ausdruck.
- source_word: ἐκεῖνος
  choice: jener
  rationale: „Jener“ erhält den demonstrativen Charakter des griechischen Pronomens und legt den göttlichen Bezug nicht unnötig auf Christus oder Gott den Vater fest.
theological_decisions:
- issue: Bezug von ἐκεῖνος
  choice: Das Pronomen bleibt mit „jener“ im Haupttext offen; im unmittelbaren Zusammenhang ist Christus wahrscheinlich gemeint.
  alternative: Gott beziehungsweise der Vater als Bezugsgröße.
  rationale: Im Ersten Johannesbrief verweist ἐκεῖνος in Zusammenhängen ethischer Nachahmung häufig auf Jesus. Der griechische Wortlaut nennt den Bezug hier jedoch nicht ausdrücklich, daher wird die Spannung nicht durch einen eingefügten Eigennamen aufgelöst.
- issue: Verhältnis zwischen gerechtem Handeln und Gerechtsein
  choice: Die knappe Aussage des griechischen Textes wird ohne erklärenden Zusatz wiedergegeben.
  alternative: Eine Auslegung, die das Handeln ausdrücklich als Ursache, Beweis oder Folge des Gerechtseins bestimmt.
  rationale: Der Vers verbindet das Üben der Gerechtigkeit mit dem Gerechtsein, legt aber in diesem Satz allein die genaue dogmatische Relation nicht ausdrücklich fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die liebevolle Anrede wird ohne das heute leicht verniedlichende „Kinderchen“ wiedergegeben. „Gerechtigkeit üben“ erhält die johanneische Verbindung zwischen δικαιοσύνη und δίκαιος, während „jener“ die im Ausgangstext verbleibende Referenzoffenheit wahrt.
