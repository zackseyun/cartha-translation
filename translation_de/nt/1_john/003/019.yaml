  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: de
  text: Daran werden wir erkennen, dass wir aus der Wahrheit sind[a], und vor ihm werden wir unser Herz beruhigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass wir zur Wahrheit gehören“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werden wir unser Herz überzeugen“. Oder: „werden wir unserem Herzen Gewissheit geben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Daran
  rationale: Die Wendung bezeichnet das Mittel oder Kennzeichen, an dem die folgende Erkenntnis gewonnen wird; „daran“ ist im Deutschen natürlich und bewahrt den demonstrativen Bezug.
- source_word: γνωσόμεθα
  choice: werden wir erkennen
  rationale: Das Futur von γινώσκω wird direkt wiedergegeben, ohne eine zusätzliche ingressive Bedeutung wie „werden wir erkennen lernen“ einzutragen.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: wir aus der Wahrheit sind
  rationale: „Aus“ bewahrt den möglichen Herkunfts- oder Ursprungsbezug von ἐκ und lässt die johanneische Aussage bewusst offen, statt sie mit „zur Wahrheit gehören“ auszudeuten.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: vor ihm
  rationale: Die knappe räumlich-relationale Formulierung entspricht dem Griechischen und kann zugleich die Bedeutung „in seiner Gegenwart“ tragen.
- source_word: πείσομεν
  choice: werden wir … überzeugen
  rationale: „Überzeugen“ bildet die Grundbedeutung von πείθω unmittelbarer ab als „beruhigen“ oder „Gewissheit geben“ und vermeidet eine vorschnelle Festlegung des im Zusammenhang umstrittenen Sinnes.
- source_word: τὴν καρδίαν ἡμῶν
  choice: unser Herz
  rationale: Der griechische Singular wird bewahrt. Im biblischen Sprachgebrauch bezeichnet „Herz“ das innere Selbst; „Gewissen“ wäre eine interpretierende Verengung.
theological_decisions:
- issue: Bedeutung von ἐκ τῆς ἀληθείας
  choice: aus der Wahrheit sind
  alternative: zur Wahrheit gehören
  rationale: Die Formulierung hält Herkunft, Wesensbezug und Zugehörigkeit als mögliche Nuancen offen und ersetzt sie nicht durch eine ausdrücklichere dogmatische Aussage.
- issue: Bedeutung von πείσομεν in Verbindung mit „Herz“
  choice: unser Herz überzeugen
  alternative: unser Herz beruhigen / unserem Herzen Gewissheit geben
  rationale: Der unmittelbare Kontext kann auf innere Beruhigung oder Gewissheit weisen, doch das Verb selbst bedeutet zunächst „überzeugen“. Die Hauptfassung bewahrt diese Spannung; die kontextuell glatteren Deutungen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Text. Der Singular „unser Herz“ und das formalere „überzeugen“ bewahren die sprachliche und theologische Spannung; beide erklärungsbedürftigen Stellen sind knapp mit Alternativen versehen.
