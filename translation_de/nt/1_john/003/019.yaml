  to: Daran werden wir erkennen, dass wir aus der Wahrheit sind[a], und vor ihm werden wir unser Herz beruhigen[b].
  rationale: Die Änderung betrifft ausschließlich πείσομεν. „Beruhigen“ ist in dieser Verbindung idiomatisches modernes Deutsch und entspricht dem kontextuellen Sinn, ohne die Aussage dogmatisch zu erweitern. Die formal nähere, im Deutschen jedoch ungeschickte Lesart „unser Herz überzeugen“ bleibt transparent in der Fußnote dokumentiert. Die übrigen bewussten formalen Spannungen und der griechische Singular bleiben erhalten.
