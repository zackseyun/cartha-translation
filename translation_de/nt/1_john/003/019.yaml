  verdict: revise
  source_fidelity: Die Übersetzung gibt ἐν τούτῳ, das futurische γνωσόμεθα, ἐκ τῆς ἀληθείας ἐσμέν, ἔμπροσθεν αὐτοῦ und den Singular τὴν καρδίαν ἡμῶν grundsätzlich zutreffend wieder. Für πείσομεν ist im vorliegenden Zusammenhang „beruhigen“ die im Deutschen sachgerechte kontextuelle Wiedergabe; eine rein wörtliche Übertragung mit „überzeugen“ kann als Alternative ausgewiesen werden.
  naturalness: „Unser Herz überzeugen“ ist zwar formal nachvollziehbar, im modernen Standarddeutsch aber ohne ergänzten Inhalt unidiomatisch und missverständlich. „Unser Herz beruhigen“ ist natürlich und gibt die hier naheliegende Bedeutung von πείθειν mit „Herz“ wieder. Der kollektive Singular „unser Herz“ kann beibehalten werden.
  terminology: „Wahrheit“ bewahrt den johanneischen Schlüsselbegriff. „Aus der Wahrheit sind“ ist bewusst eng am Griechischen und theologisch nicht einengend, auch wenn die Formulierung im Deutschen markiert wirkt. „Vor ihm“ bewahrt den offenen Bezug des griechischen Pronomens.
