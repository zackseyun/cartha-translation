source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: de
  text: Wer Sünde tut,[a] ist vom Teufel,[b] denn der Teufel sündigt von Anfang an. Der Sohn Gottes ist dazu erschienen,[c] die Werke des Teufels zu zerstören.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wer die Sünde tut“. Das griechische Präsenspartizip kann ein fortdauerndes oder charakteristisches Handeln bezeichnen, nicht nur eine einzelne Tat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ist aus dem Teufel“. Gemeint ist Herkunft beziehungsweise Zugehörigkeit in moralisch-geistlichem Sinn.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „ist offenbart worden“. Das griechische Verb bezeichnet ein Offenbarwerden oder Sichtbarwerden.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „aufzulösen“. Das Verb bedeutet wörtlich „lösen“ und kann hier „zerschlagen“, „unwirksam machen“ oder „zerstören“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Wer die Sünde praktiziert
  rationale: Das substantivierte Präsenspartizip bezeichnet hier am ehesten ein fortdauerndes oder charakteristisches Tun. „Die Sünde praktiziert“ macht diesen Aspekt sichtbar, ohne die Aussage auf eine einzelne Tat zu beziehen.
- source_word: ἐκ τοῦ διαβόλου ἐστίν
  choice: stammt vom Teufel
  rationale: ἐκ bezeichnet Quelle oder Herkunft. „Stammt vom Teufel“ bewahrt dieses Bild in moralisch-geistlichem Sinn, ohne eine leibliche oder ontologische Abstammung zu behaupten.
- source_word: ἀπ’ ἀρχῆς ... ἁμαρτάνει
  choice: sündigt von Anfang an
  rationale: Das griechische Präsens bezeichnet die fortdauernde, charakteristische Tätigkeit des Teufels. Im Deutschen drückt das Präsens zusammen mit „von Anfang an“ diese Dauer natürlich aus.
- source_word: εἰς τοῦτο
  choice: Dazu
  rationale: Die Wendung weist voraus auf den mit ἵνα angegebenen Zweck. „Dazu“ ist knapp, natürlich und zielgerichtet.
- source_word: ἐφανερώθη
  choice: ist ... erschienen
  rationale: φανερόω kann das Offenbarwerden beziehungsweise sichtbare Erscheinen bezeichnen. „Ist erschienen“ ist im Deutschen natürlich und bewahrt hier den Gedanken des geschichtlichen Offenbarwerdens des Sohnes.
- source_word: ἵνα λύσῃ
  choice: um ... zu zerstören
  rationale: λύω bedeutet grundlegend lösen oder auflösen und bezeichnet bei den Werken des Teufels deren wirksame Zerschlagung beziehungsweise Vernichtung. „Zerstören“ gibt die kontextuelle Wirkung klar wieder.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: die Werke des Teufels
  rationale: Die Formulierung bewahrt den Plural und die breite Bedeutung von ἔργα, die sowohl das böse Wirken als auch seine Hervorbringungen und Folgen umfassen kann.
theological_decisions:
- issue: Aussagekraft der präsentischen Sündensprache
  choice: Fortdauerndes oder charakteristisches Sündigen wird durch „die Sünde praktiziert“ ausgedrückt.
  alternative: Die Aussage auf jede einzelne Sündentat beziehen.
  rationale: Das Präsenspartizip legt eine anhaltende oder kennzeichnende Praxis nahe. So bleibt die Spannung zu 1 Joh 1,8–2,2 bestehen, ohne einen Widerspruch durch eine punktuelle Wiedergabe zu erzeugen.
- issue: Bedeutung der Herkunft vom Teufel
  choice: Moralisch-geistliche Herkunft beziehungsweise Ausrichtung.
  alternative: Wörtliche oder ontologische Abstammung vom Teufel.
  rationale: ἐκ bewahrt das johanneische Herkunftsbild, verlangt aber keine Aussage über buchstäbliche Zeugung oder ontologische Ableitung.
- issue: Zweck des Erscheinens des Sohnes Gottes
  choice: Die Werke des Teufels wirksam zerstören beziehungsweise auflösen.
  alternative: Die Werke des Teufels lediglich sichtbar machen oder entlarven.
  rationale: Der Zwecksatz mit ἵνα und λύσῃ bezeichnet ein entscheidendes Aufheben oder Zerschlagen, nicht bloß eine Offenlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und relativ nah an der griechischen Struktur. „Praktiziert“ markiert bewusst den fortdauernden beziehungsweise charakteristischen Aspekt; die Fußnote nennt die formalere Alternative. Die Marker stehen jeweils unmittelbar bei der betreffenden Wendung.
