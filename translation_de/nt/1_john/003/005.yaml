id: 1JN.3.5
reference: 1 John 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: de
  text: Und ihr wisst, dass er erschienen ist, um die Sünden wegzunehmen[a], und in ihm ist keine Sünde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sünden fortzutragen“. Das griechische Verb kann „wegnehmen“, „beseitigen“ oder „(fort)tragen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: ihr wisst
  rationale: Das formal perfekte οἶδα hat im Koine-Griechischen gewöhnlich präsentische Bedeutung; „ihr wisst“ ist die natürliche deutsche Entsprechung.
- source_word: ἐκεῖνος
  choice: er
  rationale: Das Demonstrativpronomen bezeichnet im johanneischen Zusammenhang nachdrücklich Jesus Christus. „Er“ ist im Deutschen idiomatisch und lässt den Bezug aus dem Kontext hervorgehen.
- source_word: ἐφανερώθη
  choice: erschienen ist
  rationale: Das Passiv von φανερόω bezeichnet hier das geschichtliche Erscheinen Christi. „Erschienen ist“ ist verständlich und würdevoll; „offenbart wurde“ würde die Passivform deutlicher abbilden, klingt hier aber weniger natürlich.
- source_word: ἵνα
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion gibt den Zweck der Erscheinung natürlich und eindeutig wieder.
- source_word: τὰς ἁμαρτίας
  choice: die Sünden
  rationale: Der bestimmte Artikel und der Plural werden bewahrt; gemeint sind Sünden in ihrer konkreten Vielheit.
- source_word: ἄρῃ
  choice: wegzunehmen
  rationale: αἴρω kann aufheben, tragen oder entfernen bedeuten. „Wegnehmen“ bringt hier die Beseitigung der Sünden zum Ausdruck, ohne den Vorgang auf ein bestimmtes Sühnemodell festzulegen.
- source_word: ἁμαρτία
  choice: Sünde
  rationale: Der artikellose Singular wird schlicht mit „Sünde“ wiedergegeben und bezeichnet das völlige Fehlen von Sünde in ihm.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Wendung bewahrt die johanneische Ausdrucksweise und ihre theologische Aussagekraft.
theological_decisions:
- issue: Bezug von ἐκεῖνος
  choice: Bezug auf Jesus Christus, im Text durch „er“ ausgedrückt
  alternative: das betonte „jener“
  rationale: Der unmittelbare Zusammenhang identifiziert den Erschienenen, der Sünden wegnimmt und in dem keine Sünde ist, als Jesus Christus. Das Pronomen „er“ macht den Satz natürlich, ohne den Namen erläuternd in den Text einzufügen.
- issue: Bedeutung von αἴρω in Verbindung mit Sünden
  choice: die Sünden wegnehmen
  alternative: die Sünden tragen beziehungsweise forttragen
  rationale: „Wegnehmen“ bewahrt den Schwerpunkt auf der Beseitigung der Sünden. Die mögliche Bedeutung „tragen/forttragen“ wird in einer Fußnote offengehalten, damit keine bestimmte Deutung des Sühnegeschehens stillschweigend festgelegt wird.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Register. Die Wortstellung „erschienen ist“ hält den Zweckzusammenhang klar. Auf eine Fußnote zu ἐφανερώθη wurde verzichtet, da „offenbart wurde“ im Deutschen leicht eine andere Nuance nahelegt und „erschienen ist“ den Kontext zuverlässig wiedergibt.
