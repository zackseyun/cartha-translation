source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: de
  text: Nicht wie Kain[a], der vom Bösen war und seinen Bruder ermordete. Und weshalb ermordete er ihn? Weil seine Taten böse waren, die seines Bruders aber gerecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Bösen«. Der griechische Ausdruck kann abstrakt verstanden werden; im johanneischen Sprachgebrauch bezeichnet »der Böse« jedoch häufig den personifizierten Bösen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ καθὼς
  choice: Nicht wie
  rationale: Gibt den verneinten Vergleich knapp und idiomatisch wieder und knüpft an die vorausgehende Aufforderung an.
- source_word: ἐκ τοῦ πονηροῦ
  choice: aus dem Bösen
  rationale: Bewahrt mit „aus“ die Herkunfts- bzw. Ursprungsangabe von ἐκ. „Dem Bösen“ lässt im Deutschen eine personale Deutung zu, ohne die im Griechischen mögliche abstraktere Lesart völlig auszuschließen.
- source_word: ἔσφαξεν
  choice: abschlachtete
  rationale: Das starke, bildhafte Verb σφάζω bezeichnet gewaltsames Töten; „abschlachten“ bewahrt diese Schärfe besser als das allgemeinere „töten“ oder das rechtlich-moralisch akzentuierte „ermorden“.
- source_word: ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Natürliche und genaue Wiedergabe; die Bruderbeziehung ist für den ethischen Gegensatz zentral.
- source_word: χάριν τίνος
  choice: weshalb
  rationale: Idiomatiche moderne Wiedergabe der Frage nach dem Grund.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: seine Taten böse waren
  rationale: „Taten“ klingt im gegenwärtigen Deutsch natürlicher als „Werke“ und erfasst hier den ethischen Sinn von ἔργα.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: die seines Bruders aber gerecht
  rationale: Bewahrt die griechische Ellipse, indem „Taten“ nicht wiederholt wird. „Gerecht“ erhält den ethisch-theologischen Gegensatz zu „böse“.
theological_decisions:
- issue: Ob τοῦ πονηροῦ personal („der Böse“) oder abstrakt („das Böse“) zu verstehen ist
  choice: „aus dem Bösen“ im Haupttext, mit Hinweis auf die personale Deutung
  alternative: „von dem Bösen“ bzw. „vom Bösen her“ oder „aus dem Bösen“ rein abstrakt verstanden
  rationale: Der substantivierte Ausdruck bezeichnet im johanneischen Sprachgebrauch häufig den personifizierten Bösen. Die deutsche Formulierung „dem Bösen“ wahrt jedoch die echte sprachliche Spannung besser als eine ausdrückliche Einfügung wie „dem Teufel“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die starke Bildhaftigkeit von σφάζω wird bewusst mit „abschlachten“ erhalten. Die knappe Ellipse im Schlusssatz folgt dem griechischen Satzbau, bleibt aber im Deutschen verständlich.
