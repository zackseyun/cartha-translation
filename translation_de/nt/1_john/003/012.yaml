revisions:
- from: Nicht wie Kain, der aus dem Bösen[a] war und seinen Bruder abschlachtete. Und weshalb schlachtete er ihn ab? Weil seine Taten böse waren, die seines Bruders aber gerecht.
  to: Nicht wie Kain[a], der vom Bösen war und seinen Bruder ermordete. Und weshalb ermordete er ihn? Weil seine Taten böse waren, die seines Bruders aber gerecht.
  rationale: Die Revision ersetzt die unidiomatische Formulierung »aus dem Bösen war« durch »vom Bösen war« und ordnet die abstrakte Möglichkeit in einer Fußnote ein. Zugleich wird das in diesem Kontext natürlichere »ermordete« verwendet. Satzbau, Wiederholung des Verbs, Kains Brudermord und der ethische Kontrast bleiben vollständig erhalten.
