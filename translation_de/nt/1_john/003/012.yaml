    rationale: Das Verb ist zwar an der Bildhaftigkeit von σφάζω orientiert, wirkt für eine menschliche Tötung im modernen Standarddeutsch unnötig tierbezogen. »ermordete« ist natürlicher und benennt die gewaltsame, schuldhafte Tötung im Kontext.
