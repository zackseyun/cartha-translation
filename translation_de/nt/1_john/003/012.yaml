    issue: »aus dem Bösen war«
    rationale: Diese Formulierung ist im Deutschen unnatürlich und legt eine abstrakte Herkunft stärker nahe, obwohl τοῦ πονηροῦ im johanneischen Sprachgebrauch häufig personal verstanden wird.
  - severity: low
    issue: Haupttext und Fußnote behandeln die Lesart nicht klar genug
    rationale: Die Fußnote nennt »von dem Bösen« als Alternative, obwohl dies die im Kontext naheliegende personale und idiomatischere deutsche Wiedergabe ist. Die alternative abstrakte Nuance sollte stattdessen als »aus dem Bösen« erläutert werden.
  - severity: low
