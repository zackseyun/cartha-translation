  source_fidelity: Der verneinte Vergleich, die zweimalige Wiederaufnahme des starken Verbs σφάζω, die kausale Frage und die Ellipse im Schlusssatz sind grundsätzlich zutreffend wiedergegeben. Bei ἐκ τοῦ πονηροῦ ist jedoch »aus dem Bösen« im Deutschen sowohl unidiomatisch als auch stärker abstrakt als der im johanneischen Kontext naheliegende personale Gebrauch. »vom Bösen« wahrt die griechische Formulierung und lässt die umstrittene abstrakte Deutung in der Anmerkung offen.
  naturalness: »der aus dem Bösen war« klingt im modernen Standarddeutsch nicht natürlich. »der vom Bösen war« ist knapp, idiomatisch und entspricht dem gehobenen biblischen Register. »abschlachtete« gibt die Bildkraft von σφάζω wieder, ist aber für die Tötung eines Menschen im Deutschen unnötig tierbezogen und stilistisch hart; »ermordete« ist hier die natürliche, klare Wiedergabe der gewaltsamen Tötung, ohne den Sinn zu verändern.
  terminology: Die Großschreibung in »der Böse« markiert die personale Lesart, ohne sie mit einer ausdrücklichen Identifikation zu überdeuten. »böse« und »gerecht« geben πονηρά und δίκαια im ethischen Gegensatz angemessen wieder. Die Ellipse »die seines Bruders aber gerecht« bleibt verständlich erhalten.
  issues:
