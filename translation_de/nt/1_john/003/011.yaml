id: 1JN.3.11
reference: 1 John 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: de
  text: 'Denn das ist die Botschaft, die ihr von Anfang an gehört habt: Wir sollen einander lieben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir einander lieben“; auch möglich: „Lasst uns einander lieben“.'
    reason: ἵνα mit dem Konjunktiv kann hier als Inhaltsangabe, Zielangabe oder auffordernd verstanden werden.
lexical_decisions:
- source_word: Ὅτι
  choice: Denn
  rationale: Ὅτι führt im Zusammenhang eine Begründung beziehungsweise Erläuterung des Vorhergehenden ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: das ist die Botschaft
  rationale: Die Formulierung bewahrt die direkte demonstrative Aussage; „Botschaft“ ist eine klare, gegenwärtige Entsprechung für ἀγγελία.
- source_word: ἣν ἠκούσατε ἀπ’ ἀρχῆς
  choice: die ihr von Anfang an gehört habt
  rationale: Das deutsche Perfekt klingt natürlich und bezeichnet die früher empfangene, weiterhin maßgebliche Botschaft. „Von Anfang an“ wahrt den johanneischen Ausdruck.
- source_word: ἵνα ἀγαπῶμεν
  choice: Wir sollen lieben
  rationale: ἵνα mit dem Konjunktiv bezeichnet hier am ehesten den ethischen Inhalt der Botschaft. Der selbstständige Satz nach dem Doppelpunkt gibt die Verpflichtung idiomatisch wieder, ohne die mögliche Zielnuance zu verschweigen.
- source_word: ἀλλήλους
  choice: einander
  rationale: „Einander“ ist die natürliche deutsche Wiedergabe des reziproken Pronomens und bewahrt den gemeinschaftlichen Bezug.
theological_decisions:
- issue: Bedeutung von ἵνα ἀγαπῶμεν ἀλλήλους
  choice: 'Als ethischer Inhalt der Botschaft wiedergegeben: „Wir sollen einander lieben.“'
  alternative: „damit wir einander lieben“ oder „Lasst uns einander lieben“
  rationale: Im Kontext nennt der Satz vor allem den Inhalt beziehungsweise die ethische Stoßrichtung der von Anfang an gehörten Botschaft. Die gewählte Fassung bewahrt den verpflichtenden Charakter, während eine Fußnote die echte Spannweite zwischen Inhalts-, Ziel- und Aufforderungssinn sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denn“ stellt den erklärenden Anschluss her; der Doppelpunkt leitet den Inhalt der Botschaft klar ein. Keine konfessionell geprägte Terminologie.
