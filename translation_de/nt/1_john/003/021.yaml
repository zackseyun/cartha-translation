  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: de
  text: Ihr Lieben, wenn unser Herz uns nicht verurteilt, haben wir Zuversicht vor Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ihr Lieben
  rationale: Die substantivierte Anrede gibt den liebevollen Plural natürlich und würdig wieder und bewahrt den Zusammenhang mit der Liebessprache des Briefes.
- source_word: ἐὰν
  choice: wenn
  rationale: Die konditionale Konjunktion mit Konjunktiv wird im Deutschen idiomatisch mit „wenn“ wiedergegeben.
- source_word: ἡ καρδία
  choice: unser Herz
  rationale: „Herz“ bewahrt die Metapher des Ausgangstextes; gemeint ist hier das innere Selbst in seiner moralischen Selbstbeurteilung, ohne es vorschnell auf „Gewissen“ einzuengen.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: uns nicht verurteilt
  rationale: καταγινώσκω bezeichnet hier ein gegen jemanden gerichtetes Urteil oder Verdammen. „verurteilt“ erhält die moralisch-juristische Färbung und knüpft an den unmittelbaren Kontext an.
- source_word: παρρησίαν
  choice: Zuversicht
  rationale: παρρησία bezeichnet Offenheit, Freimütigkeit oder vertrauensvolle Gewissheit. „Zuversicht“ klingt im Verhältnis zu Gott natürlich und vermeidet einen konfrontativen Beiklang.
- source_word: πρὸς τὸν θεόν
  choice: vor Gott
  rationale: In Verbindung mit παρρησία beschreibt πρός die vertrauensvolle Stellung beziehungsweise Beziehung zu Gott; „vor Gott“ ist dafür eine prägnante und idiomatische Wiedergabe.
theological_decisions:
- issue: Die durch καρδία bezeichnete innere Instanz
  choice: Herz
  alternative: Gewissen
  rationale: „Herz“ bewahrt die johanneische Bildsprache und die Weite des Begriffs. Die Funktion ähnelt hier dem Gewissen, doch eine direkte Wiedergabe als „Gewissen“ würde die Metapher enger auslegen, als es der griechische Wortlaut verlangt.
- issue: Die Bedeutung von παρρησία gegenüber Gott
  choice: Zuversicht vor Gott
  alternative: Freimütigkeit gegenüber Gott; Gewissheit vor Gott
  rationale: Die Formulierung bezeichnet eine offene, unbeschämte und vertrauensvolle Haltung in Gottes Gegenwart. „Zuversicht“ wahrt dabei sowohl den freien Zugang als auch die Ehrfurcht und legt keine rein subjektive Heilsgewissheit fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ihr Lieben“ ist als herzliche Anrede natürlich und erhält den Bezug zum Leitmotiv der Liebe. Die Satzstruktur bleibt knapp und nahe am griechischen Text.
