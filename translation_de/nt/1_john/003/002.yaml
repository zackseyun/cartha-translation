id: 1JN.3.2
reference: 1 John 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: de
  text: 'Geliebte, jetzt sind wir Kinder Gottes, und noch ist nicht offenbar geworden, was wir sein werden. Wir wissen: Wenn er offenbar wird,[a] werden wir ihm ähnlich sein, weil wir ihn sehen werden, wie er ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn es offenbar wird“, bezogen auf das, was wir sein werden. Im Griechischen ist das Subjekt nicht ausdrücklich genannt; der Zusammenhang spricht eher für „er“, also Christus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die substantivierte Anrede bewahrt sowohl den herzlichen Ton als auch die sprachliche Verbindung zu Liebe; sie klingt würdig und ist im biblischen Register verständlich.
- source_word: νῦν
  choice: jetzt
  rationale: Markiert knapp den gegenwärtigen Stand im Gegensatz zur noch ausstehenden Offenbarung.
- source_word: τέκνα θεοῦ
  choice: Kinder Gottes
  rationale: Gibt die Zugehörigkeits- und Kindschaftsbeziehung wieder, ohne eine im Griechischen nicht vorhandene Geschlechtsmarkierung einzuführen.
- source_word: οὔπω ἐφανερώθη
  choice: noch ist nicht offenbar geworden
  rationale: Bewahrt den passiven Sinn von φανερόω und die Wortverbindung zum späteren φανερωθῇ.
- source_word: τί ἐσόμεθα
  choice: was wir sein werden
  rationale: Gibt die zukünftige Beschaffenheit oder Daseinsweise der Glaubenden direkt wieder.
- source_word: οἴδαμεν
  choice: Wir wissen
  rationale: Der Perfektform mit präsentischer Bedeutung entspricht im Deutschen natürlich das Präsens.
- source_word: ἐὰν φανερωθῇ
  choice: wenn er offenbar wird
  rationale: Das implizite Subjekt wird kontextgemäß auf Christus bezogen; die passive bzw. mediale Erscheinungsweise und die lexikalische Wiederholung werden bewahrt. Das deutsche „wenn“ kann die griechische Eventualität natürlich ausdrücken, ohne Zweifel am Eintreten zu behaupten.
- source_word: ὅμοιοι αὐτῷ
  choice: ihm ähnlich
  rationale: Bezeichnet wirkliche Ähnlichkeit, nicht Identität; die Formulierung ist präzise und natürlich.
- source_word: ὀψόμεθα αὐτὸν
  choice: wir ihn sehen werden
  rationale: Gibt das Futur und das direkte Objekt schlicht und genau wieder.
- source_word: καθώς ἐστιν
  choice: wie er ist
  rationale: Bewahrt den Vergleich der Wahrnehmung mit seiner wirklichen Seinsweise.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in ἐὰν φανερωθῇ
  choice: '„wenn er offenbar wird“: Das Subjekt wird auf Christus bezogen.'
  alternative: '„wenn es offenbar wird“: Bezug auf das, was die Glaubenden sein werden.'
  rationale: Das anschließende „ihm ähnlich“ und „ihn sehen“ spricht stark für Christus. Da das griechische Subjekt jedoch unausgesprochen bleibt, wird die sachlich mögliche Alternative in einer Fußnote erhalten.
- issue: Art der zukünftigen Ähnlichkeit der Glaubenden
  choice: „ihm ähnlich“ bezeichnet eine wirkliche Ähnlichkeit mit Christus, ohne Wesensidentität zu behaupten.
  alternative: Stärkere Formulierungen wie „wir werden sein wie er“ könnten leichter als Gleichheit missverstanden werden.
  rationale: ὅμοιοι drückt Ähnlichkeit aus. Die Übersetzung wahrt sowohl die starke Verwandlungszusage als auch den Unterschied zwischen Christus und den Glaubenden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „offenbar“ bildet das wiederholte φανερόω ab. „Geliebte“ ist bewusst etwas feierlicher als „liebe Freunde“, erhält dafür aber die Liebeswortgruppe. Der Fußnotenmarker steht unmittelbar an der mehrdeutigen Wendung.
