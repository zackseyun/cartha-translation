  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: gegenwärtige Gotteskindschaft, noch nicht offenbarte zukünftige Wirklichkeit, künftige Ähnlichkeit mit ihm und das Sehen seiner wahren Gestalt. „Offenbar geworden/wird“ bewahrt zudem die Wiederaufnahme von φανερόω. Das mit „wenn“ wiedergegebene ἐάν ist möglich und wahrt die griechische Form, ohne die Erfüllung der Aussage zu bestreiten.'
  naturalness: „Geliebte“ ist als feierlich-warme Anrede in modernem bibelsprachlichem Standarddeutsch gut verständlich. Der übrige Satzbau ist idiomatisch, klar und angemessen würdig. „Ihm ähnlich“ ist eine besonders natürliche und präzise Wiedergabe.
  terminology: „Kinder Gottes“ und „ihm ähnlich“ sind terminologisch treffend. Letzteres gibt ὅμοιοι als Ähnlichkeit wieder, ohne Gleichheit oder Wesensidentität zu behaupten. Die Fußnote behandelt den nicht ausgedrückten Bezug von φανερωθῇ sachlich und erhält die mögliche Alternative.
