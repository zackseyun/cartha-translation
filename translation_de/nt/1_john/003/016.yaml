reference: 1 John 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: de
  text: 'Daran haben wir die Liebe erkannt: Er hat sein Leben für uns hingegeben, und auch wir sind verpflichtet, unser Leben für die Geschwister[a] hinzugeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für die Brüder“; im gemeindlichen Zusammenhang sind wahrscheinlich die Glaubensgeschwister insgesamt gemeint, Frauen eingeschlossen.'
    reason: lexikalische und kulturelle Erläuterung
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Daran
  rationale: Die Wendung verweist auf den folgenden Satz als Grundlage und Erkennungszeichen der Liebe. „Daran“ ist im Deutschen natürlich und bewahrt diese erklärende Funktion.
- source_word: ἐγνώκαμεν
  choice: haben wir … erkannt
  rationale: Das Perfekt bezeichnet eine gewonnene Erkenntnis, die fortbesteht. Das deutsche Perfekt gibt dies hier idiomatisch wieder.
- source_word: τὴν ἀγάπην
  choice: die Liebe
  rationale: Der bestimmte Artikel wird beibehalten; gemeint ist die Liebe in ihrem durch Christi Hingabe erkennbaren Wesen.
- source_word: ἐκεῖνος
  choice: Er
  rationale: Das betonte Pronomen verweist im johanneischen Zusammenhang auf Jesus. Die Großschreibung macht den kontextuellen Bezug im Deutschen kenntlich, ohne den Namen ergänzend in den Text einzutragen.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: „Für uns“ bewahrt den Gedanken stellvertretungsnaher, zugunsten anderer geschehender Hingabe, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: hat sein Leben … hingegeben
  rationale: ψυχή bezeichnet in dieser festen Wendung das Leben; „sein Leben hingeben“ ist im modernen Deutschen natürlich und drückt freiwillige Selbsthingabe aus.
- source_word: ὀφείλομεν
  choice: sind … verpflichtet
  rationale: Das Verb bezeichnet eine wirkliche moralische Verpflichtung. Diese Wiedergabe ist klarer und gewichtiger als ein bloß empfehlendes „sollten“.
- source_word: τῶν ἀδελφῶν
  choice: die Geschwister[a]
  rationale: ἀδελφοί ist grammatisch maskulin, kann im gemeindlichen Kontext aber die Glaubensgeschwister insgesamt bezeichnen. „Geschwister“ gibt diese kontextuelle Gruppenbezeichnung im heutigen Deutsch präzise und natürlich wieder; die Form des Griechischen wird in der Fußnote erläutert.
- source_word: τὰς ψυχὰς θεῖναι
  choice: unser Leben … hinzugeben
  rationale: Die gleiche deutsche Wendung wie im ersten Satzteil erhält die bewusste lexikalische Parallelität. Im Deutschen steht „unser Leben“ bei einem kollektiven Subjekt idiomatisch im Singular.
theological_decisions:
- issue: Referent von ἐκεῖνος
  choice: Das Pronomen wird auf Jesus bezogen und mit „Er“ wiedergegeben.
  alternative: Das formal demonstrativere „jener“ ohne typografisch kenntlich gemachten Bezug.
  rationale: Der Kontext des 1. Johannesbriefs und die johanneische Wendung von der Hingabe des Lebens weisen auf Jesus. Der Name wird dennoch nicht erläuternd in den Haupttext eingefügt.
- issue: Reichweite von τῶν ἀδελφῶν
  choice: „die Geschwister“ als Bezeichnung für die Glaubensgeschwister insgesamt.
  alternative: „die Brüder“, mit einer Fußnote zum wahrscheinlichen Einschluss von Frauen.
  rationale: Im gemeindlichen Kontext kann der maskuline Plural repräsentativ für Männer und Frauen stehen. „Geschwister“ bewahrt im Deutschen den familiär-gemeindlichen Sinn, ohne Frauen aus dem angesprochenen Kreis auszublenden; die grammatische Form wird transparent annotiert.
- issue: Art der Verpflichtung in ὀφείλομεν
  choice: „sind … verpflichtet“
  alternative: „sollen“ oder „sollten“
  rationale: Die Aussage stellt Christi Hingabe als verbindlichen Maßstab dar. Die Übersetzung wahrt die moralische Forderung, ohne zu behaupten, menschliche Hingabe sei in jeder theologischen Hinsicht mit Christi Tod identisch.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Doppelpunkt erhält die erklärende Struktur des griechischen Satzes. Die Wiederholung von „Leben … hingeben“ bildet die bewusste Entsprechung zwischen Christi Tat und der Verpflichtung der Glaubenden ab.
