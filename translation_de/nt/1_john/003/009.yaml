source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: de
  text: Jeder, der aus Gott geboren ist, lebt nicht in der Sünde[a], denn Gottes Same bleibt in ihm; und er kann nicht fortgesetzt sündigen[b], weil er aus Gott geboren ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „tut keine Sünde“ oder „begeht keine Sünde“. Die griechische Formulierung meint im Zusammenhang wahrscheinlich ein fortgesetztes, für das Leben kennzeichnendes Sündigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „er kann nicht sündigen“. Der griechische Infinitiv im Präsens kann hier fortgesetztes Sündigen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Jeder, der … geboren ist
  rationale: Die substantivierte Perfektpartizipialkonstruktion bezeichnet allgemein jeden Menschen dieser Gruppe; die deutsche Formulierung bewahrt den universalen Umfang und den fortdauernden Zustand.
- source_word: ἐκ τοῦ θεοῦ
  choice: aus Gott
  rationale: ἐκ bezeichnet in der johanneischen Rede von der Geburt den Ursprung. „Aus Gott geboren“ ist im Deutschen natürlich und quellentreu.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: lebt nicht in der Sünde
  rationale: Die wörtliche Wendung „tut keine Sünde“ klingt im Deutschen unnatürlich und leicht absolut. Im Zusammenhang bezeichnet das Präsens am ehesten eine fortdauernde oder kennzeichnende Lebenspraxis.
- source_word: σπέρμα αὐτοῦ
  choice: Gottes Same
  rationale: Die konkrete Metapher σπέρμα bleibt erhalten, da ihr genauer Bezug im Text nicht ausdrücklich bestimmt wird. Das explizite „Gottes“ beseitigt im Deutschen lediglich eine vermeidbare Pronomenmehrdeutigkeit.
- source_word: ἐν αὐτῷ μένει
  choice: bleibt in ihm
  rationale: „Bleibt“ gibt μένει klar, gegenwärtig und mit seiner durativen Bedeutung wieder.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: er kann nicht in der Sünde weiterleben
  rationale: Der präsentische Infinitiv bezeichnet im Kontext wahrscheinlich fortgesetztes Sündigen. Die Wiedergabe wahrt zugleich die zugespitzte Aussage von οὐ δύναται und vermeidet, sie auf einen einzelnen Fehltritt zu beziehen.
- source_word: γεγέννηται
  choice: ist … geboren
  rationale: Das deutsche Zustandspassiv gibt den aus der vollzogenen Geburt hervorgegangenen und fortbestehenden Zustand idiomatisch wieder.
theological_decisions:
- issue: Lehrt der Vers absolute Sündlosigkeit oder die Unvereinbarkeit der Gottesgeburt mit fortgesetztem Leben in Sünde?
  choice: Der Haupttext bezieht die Aussage auf ein fortgesetztes, kennzeichnendes Leben in der Sünde.
  alternative: „tut keine Sünde“ und „kann nicht sündigen“, verstanden als absolute Unfähigkeit zu jeder einzelnen Sünde
  rationale: Die präsentischen Formen ποιεῖ und ἁμαρτάνειν können im Zusammenhang fortdauerndes beziehungsweise kennzeichnendes Handeln bezeichnen. Diese Wiedergabe harmonisiert die Spannung zu 1 Joh 1,8–2,1 nicht weg, sondern vermeidet, das Deutsche eindeutiger absolut klingen zu lassen als der griechische Zusammenhang.
- issue: Bedeutung von σπέρμα αὐτοῦ
  choice: Die Metapher „Gottes Same“ bleibt ohne nähere Deutung stehen.
  alternative: Gottes Wort, Gottes Leben oder Gottes Natur
  rationale: Der Vers selbst legt den genauen Bezug des Samens nicht ausdrücklich fest; eine interpretierende Ersetzung würde eine umstrittene theologische Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In der Sünde leben“ ist allgemein verständlich und bringt den wahrscheinlich fortdauernden Sinn zum Ausdruck. Die Metapher „Same“ und die starke Wendung „kann nicht“ bleiben erhalten; Fußnoten dokumentieren die formaleren Alternativen.
