source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: de
  text: 'Seht, was für eine Liebe[a] uns der Vater geschenkt hat: dass wir Kinder Gottes genannt werden – und wir sind es.[b] Darum kennt die Welt uns nicht[c], weil sie ihn nicht kannte.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „welcher Art von Liebe“. Der Ausdruck betont staunend die besondere Art und Beschaffenheit der Liebe des Vaters, nicht nur ihr Ausmaß.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lassen „und wir sind es“ aus.
    reason: textual_variant
  - marker: c
    text: 'Oder: „Darum erkennt die Welt uns nicht“; ebenso: „weil sie ihn nicht erkannte“.'
    reason: lexical_alternative
  - marker: d
    text: „Ihn“ bezieht sich hier am ehesten auf den Vater; im johanneischen Zusammenhang verstehen manche die Aussage als Hinweis auf Christus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Seht
  rationale: Der Aoristimperativ Plural ruft die Leser unmittelbar zur Aufmerksamkeit auf; „Seht“ ist modern, würdig und direkt.
- source_word: ποταπὴν ἀγάπην
  choice: was für eine Liebe
  rationale: Die Formulierung bewahrt das qualitative Staunen über die Art der Liebe und verengt die Aussage nicht auf ihre Größe.
- source_word: δέδωκεν ἡμῖν
  choice: uns geschenkt hat
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit fortdauernder Wirkung. „Geschenkt“ klingt im Deutschen bei Liebe natürlicher als das wörtlichere „gegeben“.
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: Wir sollen Kinder Gottes genannt werden
  rationale: Der Doppelpunkt macht den Inhalt beziehungsweise das Ergebnis der geschenkten Liebe deutlich; „Kinder“ gibt das geschlechtsübergreifende τέκνα genau wieder.
- source_word: καὶ ἐσμέν
  choice: und wir sind es
  rationale: Die knappe emphatische Bestätigung des griechischen Textes bleibt erhalten; „es“ nimmt die Bezeichnung „Kinder Gottes“ natürlich auf.
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Kennzeichnet prägnant die Folgerung beziehungsweise Begründungsverknüpfung mit dem Vorhergehenden.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: Der johanneische Ausdruck bleibt unaufgelöst stehen, statt ihn interpretierend auf eine bestimmte Menschengruppe einzuengen.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: kennt die Welt uns nicht
  rationale: „Kennen“ bildet die direkte semantische Parallele zum folgenden ἔγνω ab; die mögliche Nuance „erkennen“ wird in einer Fußnote genannt.
- source_word: οὐκ ἔγνω αὐτόν
  choice: weil sie ihn nicht erkannt hat
  rationale: „Erkannt hat“ gibt den Aorist wieder und erlaubt neben bloßer Kenntnis auch die johanneische Nuance fehlender Anerkennung.
theological_decisions:
- issue: Bezugswort von αὐτόν
  choice: „ihn“ bezieht sich im unmittelbaren Satzgefüge am ehesten auf den Vater
  alternative: Bezug auf Christus
  rationale: Der Vater ist im Vers das nächste ausdrücklich genannte männliche Bezugswort. Da im weiteren johanneischen Zusammenhang auch Christus gemeint sein kann, wird diese Spannung nicht dogmatisch aufgelöst, sondern in der Fußnote offengelegt.
- issue: Textbestand von καὶ ἐσμέν
  choice: „und wir sind es“ im Haupttext
  alternative: Auslassung der Wendung
  rationale: Der vorgegebene SBLGNT-Text enthält die Worte; ihre emphatische Aussage wird daher übersetzt. Die Auslassung in einigen Handschriften wird dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Auftakt bleibt als direkter Aufruf erhalten. Der Doppelpunkt verdeutlicht idiomatisch den Inhalt der väterlichen Liebesgabe, ohne die Ziel- beziehungsweise Ergebnisnuance von ἵνα unnötig festzulegen. Sämtliche Fußnotenmarker stehen im Haupttext.
