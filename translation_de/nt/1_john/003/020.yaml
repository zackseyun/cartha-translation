  source_fidelity: Der deutsche Text gibt die bedingende Struktur von ἐὰν καταγινώσκῃ sowie die begründende Aussage über Gottes Größe und sein allumfassendes Wissen sachgerecht wieder. „Denn“ ist für das erste ὅτι im Kontext angemessen; das zweite ὅτι ist durch die deutsche Satzfügung idiomatisch mitgetragen, ohne eine umstrittene syntaktische Nuance festzulegen.
