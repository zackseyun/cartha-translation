  terminology: „Herz“ bewahrt καρδία ohne einengende Umdeutung zu „Gewissen“. „Verurteilt“ gibt den urteilenden Charakter von καταγινώσκῃ vertretbar wieder; die Fußnote nennt passende weniger starke Alternativen. „Größer“ und „weiß alles“ erhalten die theologische und sprachliche Weite des Ausgangstextes.
