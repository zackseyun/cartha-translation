id: 1JN.3.20
reference: 1 John 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: de
  text: Denn wenn unser Herz uns verurteilt[a], ist Gott größer als unser Herz[b], und er weiß alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns anklagt“, „uns tadelt“ oder „etwas gegen uns vorbringt“.'
    reason: lexical_alternative
  - marker: b
    text: „Gott ist größer als unser Herz“ kann darauf hinweisen, dass er die ganze Wahrheit über uns kennt und sein Urteil über unserer Selbstverurteilung steht. Die Aussage selbst bleibt umfassender.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Das erste ὅτι begründet bzw. erläutert die vorausgehende Aussage. „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: ἐὰν
  choice: wenn
  rationale: Mit dem Präsens Konjunktiv καταγινώσκῃ bezeichnet ἐὰν einen möglichen oder wiederkehrenden Fall. Das deutsche „wenn“ lässt beide Nuancen offen.
- source_word: καταγινώσκῃ
  choice: verurteilt
  rationale: Das Verb kann bedeuten, etwas gegen jemanden festzustellen, ihn zu tadeln oder zu verurteilen. „Verurteilt“ bewahrt hier den starken, urteilenden Sinn der inneren Selbstanklage.
- source_word: ἡ καρδία ἡμῶν
  choice: unser Herz
  rationale: „Herz“ wird beibehalten und nicht deutend durch „Gewissen“ ersetzt, da καρδία das innere Zentrum des Menschen umfassender bezeichnet.
- source_word: ὅτι
  choice: nicht eigens wiedergegeben
  rationale: Das zweite ὅτι leitet die Aussage ein, die auf den Bedingungssatz folgt bzw. dessen tröstenden Grund nennt. Eine zusätzliche Wiedergabe mit „dass“ oder „weil“ wäre im Deutschen schwerfällig und würde die syntaktische Deutung unnötig verengen.
- source_word: μείζων
  choice: größer
  rationale: Die offene Vergleichsaussage bleibt erhalten. Der Text legt nicht ausdrücklich fest, ob Gottes Größe hier vor allem Wissen, Autorität oder Erbarmen meint, auch wenn der folgende Satz sein umfassendes Wissen hervorhebt.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Übliche und sachlich genaue Wiedergabe von θεός.
- source_word: τῆς καρδίας ἡμῶν
  choice: als unser Herz
  rationale: Der Genitiv nach dem Komparativ wird im Deutschen idiomatisch mit „als“ wiedergegeben. Die Wiederholung von „unser Herz“ erhält den ausdrücklichen Vergleich.
- source_word: γινώσκει πάντα
  choice: er weiß alles
  rationale: „Er weiß alles“ ist eine natürliche, umfassende Wiedergabe von γινώσκει πάντα und macht Gott eindeutig zum Subjekt.
theological_decisions:
- issue: Bedeutung der Aussage, dass Gott größer als unser Herz ist
  choice: Die umfassende Aussage „Gott ist größer als unser Herz“ bleibt ohne dogmatische Eingrenzung stehen.
  alternative: 'Mögliche Deutungen sind: Gott kennt die ganze Wahrheit besser als unser Herz; sein Urteil steht über unserer Selbstverurteilung; oder sein Erbarmen übersteigt sie.'
  rationale: Der griechische Text nennt den Gesichtspunkt des Größerseins nicht ausdrücklich. „Er weiß alles“ rückt Gottes vollständige Erkenntnis in den Vordergrund, ohne Autorität oder Erbarmen auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtliche Herz-Metapher und die theologische Weite des Vergleichs bleiben erhalten; die griechische Doppelung von ὅτι wird zugunsten eines natürlichen deutschen Satzbaus nicht mechanisch nachgebildet.
