id: 1JN.3.6
reference: 1 John 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: de
  text: Jeder, der in ihm bleibt, sündigt nicht[a]; jeder, der sündigt, hat ihn weder gesehen noch erkannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Präsensformen können auch fortdauerndes oder charakteristisches Handeln bezeichnen: „sündigt nicht fortwährend … jeder, der fortwährend sündigt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: Jeder, der
  rationale: Die substantivierte Verbindung mit πᾶς bezeichnet allgemein jeden Menschen, auf den die folgende Aussage zutrifft. „Jeder, der“ ist im modernen Deutsch natürlich und bewahrt den umfassenden Sinn.
- source_word: ἐν αὐτῷ μένων
  choice: der in ihm bleibt
  rationale: „Bleiben“ bewahrt den für Johannes wichtigen Ausdruck μένω und die fortdauernde Beziehungs- bzw. Verbundenheitssprache von „in ihm“, ohne den Bezug des Pronomens näher festzulegen.
- source_word: οὐχ ἁμαρτάνει
  choice: sündigt nicht
  rationale: Die knappe Wiedergabe entspricht der griechischen Form und lässt offen, ob das Präsens allgemein, fortdauernd oder charakteristisch zu verstehen ist. Die mögliche Verlaufs- bzw. Gewohnheitsbedeutung wird in der Fußnote erläutert.
- source_word: ὁ ἁμαρτάνων
  choice: jeder, der sündigt
  rationale: Die parallele Formulierung gibt das substantivierte Präsenspartizip natürlich wieder, ohne eine einzelne Tat oder ein fortgesetztes Verhalten im Haupttext ausdrücklich festzulegen.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: hat ihn nicht gesehen
  rationale: Das deutsche Perfekt gibt den gegenwärtig relevanten Zustand des griechischen Perfekts angemessen wieder. In Verbindung mit οὐδέ wird die Negation idiomatisch als „weder … noch“ ausgedrückt.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: noch erkannt
  rationale: „Erkannt“ kann im johanneischen Sprachgebrauch sowohl Erkenntnis als auch persönliche Beziehung anklingen lassen. Die gemeinsame Perfektkonstruktion „hat ihn weder gesehen noch erkannt“ ist knapp und natürlich.
- source_word: αὐτῷ / αὐτόν
  choice: ihm / ihn
  rationale: Der griechische Text verwendet Pronomen. Ihre Beibehaltung vermeidet es, den Bezug eigenmächtig als Gott, den Sohn oder Christus zu bestimmen.
theological_decisions:
- issue: Ob der Vers völlige Sündlosigkeit oder fortgesetztes beziehungsweise charakteristisches Sündigen meint
  choice: Im Haupttext steht formal „sündigt nicht … der sündigt“; eine mögliche fortdauernde oder charakteristische Bedeutung der Präsensformen wird in einer Fußnote genannt.
  alternative: „sündigt nicht fortwährend … wer fortwährend sündigt“ oder „lebt nicht in Sünde … wer in Sünde lebt“
  rationale: Das griechische Präsens kann fortdauernde oder charakteristische Handlung bezeichnen, kodiert diese Nuance hier aber nicht zweifelsfrei. Haupttext und Fußnote bewahren daher sowohl die Schärfe der Aussage als auch die Spannung zu 1. Johannes 1,8–2,2, ohne sie durch die Übersetzung vorzeitig aufzulösen.
- issue: Bezug der Pronomen „ihm/ihn“
  choice: Die Pronomen bleiben unaufgelöst.
  alternative: Ausdrückliche Wiedergabe als „Gott“, „der Sohn“ oder „Christus“
  rationale: Da der griechische Vers selbst nur Pronomen gebraucht und der Zusammenhang Vater und Sohn thematisiert, wäre eine ausdrückliche Identifizierung im Vers präziser, als die Quelle es erlaubt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wiederholung von „jeder, der“ und die Pronomenstruktur folgen bewusst dem griechischen Parallelismus. Der Fußnotenmarker [a] steht unmittelbar nach der ersten Aussage, auf die sich die Erläuterung beider Präsensformen bezieht.
