source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: de
  text: Jeder, der seinen Bruder[a] hasst, ist ein Mörder, und ihr wisst, dass in keinem Mörder ewiges Leben bleibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seinen Bruder“ meint im Zusammenhang wahrscheinlich einen Bruder im Glauben; der griechische Ausdruck steht im maskulinen Singular.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Jeder, der … hasst
  rationale: Der substantivierte Präsenspartizip bezeichnet allgemein jeden, auf den das Hassen zutrifft; die deutsche Relativsatzkonstruktion ist natürlich und bewahrt die charakterisierende Aussage.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Dies bildet den maskulinen Singular genau ab. Im johanneischen Zusammenhang ist wahrscheinlich ein Bruder im Glauben gemeint; diese kontextuelle Reichweite wird in der Fußnote erläutert, ohne sie im Haupttext festzulegen.
- source_word: ἀνθρωποκτόνος
  choice: Mörder
  rationale: „Mörder“ ist die geläufige und moralisch starke deutsche Entsprechung für jemanden, der einen Menschen tötet.
- source_word: οἴδατε
  choice: ihr wisst
  rationale: Die zweite Person Plural wird im Deutschen ausdrücklich mit „ihr“ wiedergegeben.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: kein Mörder … hat
  rationale: Die deutsche Negativformulierung gibt den Sinn der griechischen Verbindung aus Universalquantor und Negation klar und idiomatisch wieder.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Dies ist die etablierte und sachlich passende Wiedergabe des zentralen johanneischen Ausdrucks.
- source_word: ἐν αὐτῷ μένουσαν
  choice: bleibend in sich
  rationale: „Bleibend“ wahrt den durativen Sinn und den für Johannes wichtigen Wortstamm μένω. Das reflexive „in sich“ bezieht sich im Deutschen eindeutig auf den jeweiligen Mörder.
theological_decisions:
- issue: Bedeutungsumfang von „Bruder“
  choice: Im Haupttext steht „seinen Bruder“; die wahrscheinliche Bedeutung „Bruder im Glauben“ wird nur angemerkt.
  alternative: „seinen Bruder oder seine Schwester“ beziehungsweise „einen Glaubensbruder“
  rationale: Der Kontext betrifft die Gemeinschaft der Glaubenden, doch der griechische Text hat den maskulinen Singular. Die Übersetzung bewahrt diese Form und legt ihre repräsentative Reichweite nicht ausdrücklich fest.
- issue: Johanneisches μένω
  choice: „bleibend in sich“
  alternative: „in sich wohnen“ oder „in sich bleiben“
  rationale: 'Die gewählte Form hält die Aussage eng zusammen: Das ewige Leben ist nicht als in einem Mörder bleibende Wirklichkeit vorhanden. Zugleich bleibt die johanneische Leitwortverbindung zu „bleiben“ sichtbar.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mörder“ bewahrt die zugespitzte moralische Aussage. Die etwas markierte Wortfolge „ewiges Leben bleibend in sich“ erhält die enge grammatische Verbindung des Partizips μένουσαν mit „ewiges Leben“ und vermeidet eine unnötige Aufspaltung in einen Relativsatz.
