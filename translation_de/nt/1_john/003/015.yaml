  source_fidelity: Die Kernaussagen sind zutreffend wiedergegeben. Die Konstruktion „ewiges Leben bleibend in sich hat“ ist jedoch keine natürliche deutsche Entsprechung von ζωὴν αἰώνιον ἐν αὐτῷ μένουσαν und schwächt die klare syntaktische Beziehung von „bleibt“ zu „ewiges Leben“. „In keinem Mörder ewiges Leben bleibt“ gibt sowohl die Negation als auch das im Betreffenden bleibende Leben präzise wieder.
  naturalness: Der erste Satz ist natürlich und angemessen. Im zweiten Satz ist „bleibend in sich hat“ deutlich unidiomatisch. Die Umstellung zu „dass in keinem Mörder ewiges Leben bleibt“ ist modernes, würdiges Standarddeutsch und wahrt zugleich das johanneische Leitwort „bleiben“.
  terminology: „Bruder“, „Mörder“ und „ewiges Leben“ sind treffend und registergerecht. Die Fußnote zu „Bruder“ soll unmittelbar an diesem Wort verankert werden. Die Erklärung sollte die kontextuelle Einengung als wahrscheinlich, nicht als zwingend, kennzeichnen.
