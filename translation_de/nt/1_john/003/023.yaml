revisions:
- from: 'Und dies ist sein Gebot: Wir sollen an den Namen seines Sohnes Jesus Christus glauben[a] und einander lieben, so wie er es uns geboten hat.[b]'
  to: 'Und dies ist sein Gebot: dass wir an den Namen seines Sohnes Jesus, des Messias, glauben und einander lieben, wie er uns ein Gebot gegeben hat.[a][b]'
  rationale: Die Revision bewahrt die syntaktische und semantische Struktur des griechischen Satzes, einschließlich der beiden durch ἵνα verbundenen Inhalte und der abschließenden Wiederholung von ἐντολή. Sie folgt zugleich dem englischen Audit-Trail, der Χριστός in diesem Vers als Titel mit „Messiah“ wiedergibt. Die Fußnoten sind an ihren sachlichen Bezug verschoben und auf klare, nicht übererklärende Alternativen beschränkt.
