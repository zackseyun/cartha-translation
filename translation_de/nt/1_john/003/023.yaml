  verdict: revise
  source_fidelity: 'Der Entwurf gibt die beiden Inhalte des einen Gebots zutreffend wieder: Glauben an den Namen von Gottes Sohn und gegenseitige Liebe. Die Wiedergabe des Schlusssatzes mit „er es uns geboten hat“ ist jedoch stärker interpretierend als der griechische Wortlaut, der ausdrücklich nochmals von einem „Gebot“ spricht. Außerdem sollte Χριστός entsprechend der auditierbaren Titelwiedergabe als „Messias“ erscheinen, nicht nur in einer erläuternden Fußnote.'
  naturalness: „Dass wir … glauben und einander lieben“ ist als Inhaltsangabe nach „Dies ist sein Gebot“ modernes, natürliches Deutsch. „An den Namen … glauben“ ist bewusst bibelsprachlich, aber im johanneischen Kontext verständlich und nahe am griechischen Ausdruck. „Wie er uns ein Gebot gegeben hat“ ist idiomatisch möglich und erhält die substantivische Wiederholung.
  terminology: „Gebot“ und „einander lieben“ sind treffend. „Jesus, den Messias“ macht die titularische Funktion von Χριστός im Deutschen sichtbar; „Jesus Christus“ kann als etablierte Namensform verstanden werden und verdeckt diese Funktion eher.
