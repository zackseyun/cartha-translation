    rationale: Der englische Audit-Trail behandelt Χριστός hier ausdrücklich als Titel („the Messiah“). Die deutsche Fassung sollte diese Entscheidung im Haupttext nachvollziehbar abbilden; eine Fußnote allein ersetzt die Titelwiedergabe nicht.
  - severity: medium
