    rationale: Das griechische „wie er uns ein Gebot gegeben hat“ wiederholt bewusst die Terminologie. Die Pronomenfassung ist als Sinnwiedergabe möglich, aber weniger quellennah und legt den genauen Bezug von „es“ stärker fest.
  - severity: low
