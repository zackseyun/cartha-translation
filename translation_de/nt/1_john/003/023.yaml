reference: 1 John 3:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: de
  text: 'Und dies ist sein Gebot: dass wir an den Namen seines Sohnes Jesus, des Messias, glauben und einander lieben, wie er uns ein Gebot gegeben hat.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Messias“ gibt den griechischen Titel „Christus“ wieder. Traditionell lautet die Namensform „Jesus Christus“.
    reason: Erläuterung der titelhaften Wiedergabe von Χριστός und Dokumentation der etablierten deutschen Alternative.
  - marker: b
    text: 'Wörtlicher: „wie er uns ein Gebot gab“. Die Wiederholung von „Gebot“ entspricht dem griechischen Wortlaut.'
    reason: Dokumentiert die Wiederholung von ἐντολή und die knappere griechische Verbform.
lexical_decisions:
- source_word: ἐντολή
  choice: Gebot
  rationale: „Gebot“ bewahrt den verbindlichen, autoritativen Sinn und entspricht dem etablierten johanneischen Sprachgebrauch.
- source_word: ἵνα πιστεύσωμεν
  choice: wir sollen … glauben
  rationale: Nach „dies ist sein Gebot“ bezeichnet ἵνα mit dem Konjunktiv den Inhalt des Gebots. Die deutsche Soll-Konstruktion gibt diesen auffordernden Sinn natürlich wieder.
- source_word: πιστεύω τῷ ὀνόματι
  choice: an den Namen … glauben
  rationale: Die Wendung bezeichnet Glauben, der sich auf die im Namen offenbarte Person richtet. „An … glauben“ ist im Deutschen die natürliche Entsprechung zur Dativkonstruktion.
- source_word: τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ
  choice: seines Sohnes Jesus Christus
  rationale: Die eng verbundene griechische Bezeichnung wird in geläufigem, würdigem Deutsch wiedergegeben; „Christus“ bewahrt den messianischen Titel in seiner etablierten deutschen Form.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: einander lieben
  rationale: Die knappe reziproke Formulierung gibt sowohl das Verb als auch die gemeinschaftliche Gegenseitigkeit direkt wieder.
- source_word: καθὼς ἔδωκεν ἐντολὴν ἡμῖν
  choice: so wie er es uns geboten hat
  rationale: Die verbale Wiedergabe ist natürliches modernes Deutsch und bewahrt Vergleich, Autorität und Rückbezug, auch wenn sie die griechische Substantivwiederholung nicht im Haupttext nachbildet.
theological_decisions:
- issue: Bedeutung von Χριστός
  choice: Christus
  alternative: Messias
  rationale: „Christus“ ist im modernen deutschen Bibel- und Allgemeingebrauch die geläufige Form des Titels bei „Jesus Christus“. Die Fußnote macht seine Bedeutung als „Messias“ ausdrücklich sichtbar, ohne ihn als bloßen Familiennamen zu behandeln.
- issue: Ausrichtung von πιστεύω τῷ ὀνόματι
  choice: an den Namen glauben
  alternative: auf den Namen vertrauen
  rationale: Die Formulierung wahrt die johanneische Rede vom „Namen“ und lässt sowohl Glauben als Bekenntnis als auch Vertrauen anklingen, ohne die Wendung erklärend aufzulösen.
- issue: Bezug des abschließenden Gebots
  choice: so wie er es uns geboten hat
  alternative: so wie er uns ein Gebot gegeben hat
  rationale: Das Pronomen „es“ bezieht sich natürlich auf die Forderung, einander zu lieben. Der griechische Wortlaut lässt zugleich die allgemeinere substantivische Formulierung „ein Gebot gegeben“ zu; diese wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am Griechischen, während „wir sollen“ und „er es uns geboten hat“ idiomatisches Deutsch gewährleisten. Keine konfessionell geprägte Zusatzdeutung.
