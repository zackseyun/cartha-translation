source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: de
  text: 'Wir wissen: Jeder, der aus Gott geboren ist, sündigt nicht[a]. Vielmehr bewahrt ihn der, der aus Gott geboren wurde[b], und der Böse tastet ihn nicht an[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Präsens kann hier einen andauernden oder gewohnheitsmäßigen Sinn haben: Der aus Gott Geborene lebt nicht in fortgesetzter Sünde. Die Formulierung besagt nicht notwendigerweise, dass Glaubende niemals sündigen (vgl. 1 Joh 1,8–10; 2,1).'
    reason: cross_reference
  - marker: b
    text: 'Kann auch so verstanden werden: „Vielmehr bewahrt der aus Gott Geborene sich selbst.“ Andere verstehen „der, der aus Gott geboren wurde“ als Hinweis auf Jesus, den Sohn, der den Glaubenden bewahrt. Der griechische Text lässt die Bezüge offen.'
    reason: alternative_reading
  - marker: c
    text: „Antasten“ kann hier bedeuten, jemanden zu ergreifen, um ihm zu schaden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Wir wissen
  rationale: Die Perfektform οἶδα hat hier präsentische, zustandsbezeichnende Bedeutung. „Wir wissen“ ist daher sachgerecht und natürlich.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: Jeder, der aus Gott geboren ist
  rationale: πᾶς ὁ mit Partizip bezeichnet distributiv jeden Einzelnen. Das Perfektpartizip betont den fortbestehenden Zustand, was „geboren ist“ angemessen wiedergibt.
- source_word: οὐχ ἁμαρτάνει
  choice: sündigt nicht fortwährend
  rationale: Das Präsens stellt das Sündigen als andauernde beziehungsweise wiederholte Praxis dar. „Fortwährend“ macht diesen Aspekt sichtbar, ohne eine absolute Sündlosigkeit zu behaupten.
- source_word: ἀλλ’
  choice: Vielmehr
  rationale: Die Konjunktion leitet einen deutlichen Gegensatz beziehungsweise eine korrigierende Gegenüberstellung ein.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: der, der aus Gott geboren wurde
  rationale: Die Formulierung bildet das Aoristpartizip ab und lässt offen, ob der zuvor genannte Gläubige oder Jesus, der Sohn, gemeint ist.
- source_word: τηρεῖ αὐτόν
  choice: bewahrt ihn
  rationale: τηρέω kann „bewahren“, „behüten“ oder „schützen“ bedeuten. „Bewahrt“ wahrt die formale Nähe und den schützenden Sinn; das nichtreflexive Pronomen αὐτόν wird als „ihn“ wiedergegeben.
- source_word: ὁ πονηρὸς
  choice: der Böse
  rationale: Der substantivierte Ausdruck mit Artikel bezeichnet im johanneischen Sprachgebrauch am ehesten eine persönliche böse Macht, also den Bösen, nicht lediglich abstraktes Böses.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: tastet ihn nicht an
  rationale: ἅπτομαι bedeutet grundlegend „berühren“ oder „anfassen“, kann aber ein ergreifendes Antasten mit schädigender Absicht bezeichnen. Die deutsche Wendung erhält beide Nuancen.
theological_decisions:
- issue: Bedeutung der Präsensform οὐχ ἁμαρτάνει
  choice: Die Aussage verneint fortwährendes beziehungsweise gewohnheitsmäßiges Sündigen.
  alternative: Der aus Gott Geborene begeht überhaupt keine Sünde.
  rationale: Der imperfektive Aspekt des Präsens und 1. Johannes 1,8–10 sowie 2,1 sprechen dagegen, die Aussage als Behauptung absoluter Sündlosigkeit zu formulieren.
- issue: Bezug von ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Der Haupttext lässt mit „der, der aus Gott geboren wurde“ offen, wer gemeint ist.
  alternative: Der Ausdruck kann den Gläubigen oder Jesus, den Sohn Gottes, bezeichnen.
  rationale: Der griechische Ausdruck legt den Bezug nicht eindeutig fest. Die Übersetzung nennt Jesus deshalb nicht ausdrücklich, verschweigt die christologische Deutung aber auch nicht.
- issue: Bezug von αὐτόν und αὐτοῦ
  choice: 'Beide Pronomen beziehen sich in der Übersetzung auf den bewahrten Gläubigen: „ihn“.'
  alternative: Wenn das Subjekt ebenfalls der Gläubige ist, kann τηρεῖ αὐτόν dem Sinn nach reflexiv als „bewahrt sich selbst“ verstanden werden.
  rationale: Der vorliegende griechische Text hat das nichtreflexive αὐτόν. „Ihn“ folgt dieser Form, während die alternative syntaktische Deutung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Der Doppelpunkt nach „Wir wissen“ führt die inhaltliche Aussage klar ein. Die Wiederholung von „aus Gott geboren“ bewahrt die johanneische Ausdrucksweise; die unterschiedlichen deutschen Verbformen spiegeln soweit möglich Perfekt- und Aoristpartizip. Die echten Mehrdeutigkeiten beim Subjekt von „bewahrt“ und beim Pronomen werden nicht konfessionell aufgelöst.
