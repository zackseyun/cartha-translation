  naturalness: Das Deutsch ist klar und idiomatisch. „tastet ihn nicht an“ ist eine natürliche, dem Kontext angemessene Wiedergabe von ἅπτεται. Der schlichtere Haupttext „sündigt nicht“ ist zugleich natürlicher und formnäher; die mögliche aspektuelle Nuance kann die Fußnote erläutern.
