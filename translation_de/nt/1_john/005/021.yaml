  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: de
  text: Kinder[a], hütet euch vor den Götzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Meine Kinder“ beziehungsweise „Liebe Kinder“. Das griechische Wort ist eine liebevolle, verkleinernde Anrede, die Johannes mehrfach gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Kinder
  rationale: Die Anrede ist ein liebevoller Diminutiv. Im heutigen Deutschen gibt „Kinder“ die familiäre Anrede natürlich wieder; die zärtliche Nuance wird in der Fußnote erläutert, da „Kindlein“ veraltet klingt und „liebe Kinder“ ein nicht ausdrücklich vorhandenes Adjektiv ergänzt.
- source_word: φυλάξατε
  choice: hütet
  rationale: Der Aorist-Imperativ fordert zu entschiedener Wachsamkeit auf. Die feste Verbindung „sich vor etwas hüten“ ist im Deutschen prägnant und idiomatisch.
- source_word: ἑαυτὰ
  choice: euch
  rationale: Das Reflexivpronomen wird in der idiomatischen Wendung „hütet euch“ unmittelbar und vollständig wiedergegeben.
- source_word: ἀπὸ
  choice: vor
  rationale: Bei „sich hüten“ verlangt natürliches Deutsch „vor“; damit bleibt der Gedanke der Abgrenzung beziehungsweise Distanz gewahrt.
- source_word: εἰδώλων
  choice: den Götzen
  rationale: „Götzen“ ist die klare, etablierte Wiedergabe für Kultbilder beziehungsweise Gegenstände falscher Verehrung und vermeidet eine ausweitende Paraphrase.
theological_decisions:
- issue: Bedeutungsumfang von εἰδώλων
  choice: konkret mit „den Götzen“ übersetzen
  alternative: „allem, was Gottes Stelle einnimmt“ oder „falscher Anbetung“
  rationale: Der griechische Text nennt unmittelbar Götzen. Eine weiter gefasste geistliche Anwendung mag möglich sein, soll aber nicht in den Wortlaut der Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kinder“ ist natürlicher als das veraltete „Kindlein“; „hütet euch vor“ bewahrt den knappen, eindringlichen Charakter der abschließenden Mahnung.
