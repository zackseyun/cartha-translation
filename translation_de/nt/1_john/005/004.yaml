  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: de
  text: 'Denn jeder, der aus Gott geboren ist,[a] überwindet die Welt. Und das ist der Sieg, der die Welt überwunden hat: unser Glaube.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „alles, was aus Gott geboren ist“. Die griechische Form ist sächlich und kann die Gesamtheit der aus Gott Geborenen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unsere Treue“. Das griechische Wort kann je nach Zusammenhang „Glaube“, „Vertrauen“ oder „Treue“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet hier die vorangehende Aussage. „Denn“ gibt diese begründende Funktion im Deutschen natürlich wieder.
- source_word: πᾶν τὸ γεγεννημένον
  choice: jeder, der … geboren ist
  rationale: Die griechische Form ist zwar sächlich und singularisch, bezeichnet im johanneischen Zusammenhang aber kollektiv die Menschen, die aus Gott geboren sind. Die personenbezogene Wiedergabe ist im Deutschen klar und idiomatisch; die formnähere Alternative wird in einer Fußnote bewahrt.
- source_word: γεγεννημένον
  choice: geboren ist
  rationale: Das Perfektpassiv bezeichnet eine vollzogene Geburt mit fortbestehendem Ergebnis. „Geboren ist“ entspricht dem geläufigen johanneischen Sprachgebrauch von der Geburt aus Gott.
- source_word: ἐκ τοῦ θεοῦ
  choice: aus Gott
  rationale: „Aus Gott“ bringt den Ursprung beziehungsweise die Herkunft der neuen Geburt präzise und im Deutschen idiomatisch zum Ausdruck.
- source_word: νικᾷ
  choice: überwindet
  rationale: „Überwindet“ passt zum johanneischen Kontext und wahrt die Wortverbindung mit νίκη und νικήσασα durch „Sieg“ und „überwunden“.
- source_word: τὸν κόσμον
  choice: die Welt
  rationale: „Die Welt“ bewahrt den etablierten johanneischen Ausdruck, ohne dessen Bedeutung als gottwidrige Weltordnung im Haupttext erklärend festzulegen.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: das ist der Sieg
  rationale: Die direkte Wiedergabe erhält die demonstrative Hervorhebung und den Zusammenhang mit dem Verb „überwinden“.
- source_word: ἡ νικήσασα
  choice: der … überwunden hat
  rationale: Das substantivbezogene Aoristpartizip wird als natürlicher deutscher Relativsatz wiedergegeben. Das Perfekt stellt den Sieg als vollzogen und gegenwärtig bedeutsam dar.
- source_word: ἡ πίστις ἡμῶν
  choice: unser Glaube
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe von πίστις und bezeichnet das Vertrauen der Glaubenden; die lexikalisch mögliche Bedeutung „Treue“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Bezug von πᾶν τὸ γεγεννημένον
  choice: 'personenbezogen und kollektiv: „jeder, der aus Gott geboren ist“'
  alternative: 'formnäher und sächlich: „alles, was aus Gott geboren ist“'
  rationale: Der Zusammenhang spricht von Glaubenden. Die personenbezogene Form macht den gemeinten Bezug verständlich, während die Fußnote die grammatische Gestalt und deren mögliche Nuance offenhält.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: Im Zusammenhang ist „unser Glaube“ die natürlichste Deutung. Da πίστις je nach Kontext auch „Treue“ bezeichnen kann, wird diese Möglichkeit nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wortverbindung „überwindet – Sieg – überwunden“ bildet die griechische Verbindung von νικάω und νίκη sichtbar nach. Die Satzstruktur bleibt knapp und rhetorisch nah am Ausgangstext.
