  text: Denn drei sind es, die Zeugnis ablegen,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Spätere Handschriften enthalten eine längere Lesart, die oft als Comma Johanneum bezeichnet wird: „im Himmel: der Vater, das Wort und der Heilige Geist, und diese drei sind eins. Und drei legen auf der Erde Zeugnis ab …“ Diese Formulierung fehlt in den frühesten griechischen Handschriften und gehört nicht zum Text des SBLGNT.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι leitet hier eine Begründung beziehungsweise Erläuterung des vorangehenden Gedankens ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: τρεῖς
  choice: drei
  rationale: Das Kardinalzahlwort wird entsprechend seiner Grundbedeutung wiedergegeben.
- source_word: εἰσιν
  choice: sind es
  rationale: Die präsentische Kopula wird mit „sind“ wiedergegeben; das Korrelat „es“ ermöglicht zusammen mit dem folgenden Relativsatz eine natürliche deutsche Satzstellung.
- source_word: οἱ μαρτυροῦντες
  choice: die Zeugnis ablegen
  rationale: Das substantivierte Präsenspartizip bezeichnet diejenigen, die Zeugnis geben. Der Relativsatz bewahrt den verbalen Charakter und die fortdauernde Zeugnisfunktion.
theological_decisions:
- issue: Textgestalt von 1. Johannes 5,7 und das Comma Johanneum
  choice: 'Im Haupttext wird ausschließlich der kürzere Text des SBLGNT übersetzt: „Denn drei sind es, die Zeugnis ablegen,“'
  alternative: 'Eine spätere Überlieferungsform fügt sinngemäß hinzu: „im Himmel: der Vater, das Wort und der Heilige Geist, und diese drei sind eins. Und drei legen auf der Erde Zeugnis ab …“'
  rationale: Die vorgegebene griechische Ausgangsausgabe enthält die längere trinitarische Erweiterung nicht. Daher folgt der Haupttext dem SBLGNT; die historisch bedeutsame spätere Lesart wird aus Gründen textkritischer Transparenz in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zeugnis ablegen“ ist idiomatisch und bewahrt zugleich den forensisch-religiösen Sinn von μαρτυρέω. Das Komma zeigt, dass der Satz im folgenden Vers weitergeführt wird.
