id: 1JN.5.20
reference: 1 John 5:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: de
  text: Wir wissen aber, dass der Sohn Gottes gekommen ist und uns Einsicht gegeben hat, damit wir den Wahrhaftigen erkennen. Und wir sind in dem Wahrhaftigen, in seinem Sohn Jesus, dem Messias. Dieser[a] ist der wahre Gott und das ewige Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dieser“ kann sich unmittelbar auf Jesus, den Messias, beziehen. Manche verstehen das Wort jedoch als Rückbezug auf „den Wahrhaftigen“, also auf den Vater, im vorhergehenden Satz.
    reason: Mehrdeutiger Bezug des griechischen Demonstrativpronomens οὗτός.
lexical_decisions:
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Die Perfektform οἶδα hat präsentische, stative Bedeutung und bezeichnet gefestigtes Wissen.
- source_word: ἥκει
  choice: ist gekommen
  rationale: Die Form bezeichnet ein vollzogenes Kommen mit gegenwärtigem Ergebnis; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: δέδωκεν
  choice: hat gegeben
  rationale: Das Perfekt hebt die fortdauernde Wirkung der gegebenen Gabe hervor.
- source_word: διάνοιαν
  choice: Einsicht
  rationale: Gemeint ist hier die von Gott gegebene Fähigkeit, die Wahrheit zu erfassen; „Einsicht“ ist prägnant und gegenwärtig.
- source_word: ἵνα γινώσκωμεν
  choice: damit wir … erkennen
  rationale: ἵνα mit dem Konjunktiv drückt den Zweck aus. „Erkennen“ bewahrt den relationalen Erkenntnissinn des johanneischen Sprachgebrauchs.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: den Wahrhaftigen / in dem Wahrhaftigen
  rationale: Das substantivierte Adjektiv bezeichnet eine Person. Die gleiche Benennung in beiden Fällen bewahrt die bewusste Wiederholung des Griechischen.
- source_word: ἐσμὲν ἐν
  choice: wir sind in
  rationale: Die schlichte johanneische Verhältnisformulierung wird ohne die interpretierende Erweiterung „bleiben“ oder „vereint sein“ wiedergegeben.
- source_word: ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ
  choice: in seinem Sohn Jesus, dem Messias
  rationale: Die Formulierung bewahrt das Sohnverhältnis und gibt Χριστός als Titel „Messias“ in idiomatischem Deutsch wieder.
- source_word: οὗτός
  choice: Dieser
  rationale: Das Demonstrativpronomen wird direkt abgebildet und lässt seinen Bezug im Haupttext so offen, wie es die griechische Syntax zulässt.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: der wahre Gott
  rationale: Dies ist die natürliche und traditionelle deutsche Wiedergabe der Prädikatsfügung.
- source_word: ζωὴ αἰώνιος
  choice: das ewige Leben
  rationale: Die etablierte deutsche Wendung entspricht dem johanneischen Ausdruck und umfasst sowohl Dauer als auch Qualität des Lebens.
theological_decisions:
- issue: Bezug von οὗτός in „οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος“
  choice: „Dieser“ steht im Haupttext und kann sich aufgrund des nächstliegenden persönlichen Bezugs auf Jesus, den Messias, beziehen.
  alternative: Das Demonstrativpronomen kann auf „den Wahrhaftigen“, also den Vater, zurückbezogen werden; „in seinem Sohn Jesus, dem Messias“ erläutert dann, wie die Glaubenden in dem Wahrhaftigen sind.
  rationale: Der nächstliegende persönliche Bezug ist Jesus, der Messias, doch die Satzstruktur wurde unterschiedlich verstanden. Die Übersetzung bewahrt daher mit „Dieser“ die demonstrative Kraft und markiert die echte Bezugsambiguität in einer Fußnote, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Der Wahrhaftige“ erhält die substantivische Wiederholung des Griechischen; „Jesus, der Messias“ macht Χριστός als Titel verständlich. Der Fußnotenmarker steht unmittelbar am mehrdeutigen Demonstrativpronomen.
