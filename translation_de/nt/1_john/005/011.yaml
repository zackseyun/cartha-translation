source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: de
  text: 'Und dies ist das Zeugnis[a]: Gott hat uns ewiges Leben gegeben[b], und dieses Leben ist in seinem Sohn[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zeugenaussage“.'
    reason: lexical_alternative
  - marker: b
    text: 'Dem griechischen Aorist entsprechend ist auch möglich: „gab uns ewiges Leben“; das deutsche Perfekt hebt die fortdauernde Bedeutung der vollzogenen Gabe hervor.'
    reason: lexical_alternative
  - marker: c
    text: „In seinem Sohn“ bewahrt die griechische Ausdrucksweise. Eine Wiedergabe wie „durch seinen Sohn“ deutet die knappe johanneische Wendung stärker aus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: Zeugnis
  rationale: „Zeugnis“ gibt den johanneischen Sinn einer bezeugten Aussage beziehungsweise ihres Inhalts knapp und geläufig wieder. Es bewahrt zugleich die Verbindung zum Verb „bezeugen“ im Kontext.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen den Inhalt des Zeugnisses natürlich und unmittelbar ein; ein ausdrückliches „dass“ würde hier einen schwerfälligeren Satzbau erzeugen.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Die geläufige deutsche Wiedergabe bewahrt sowohl den zeitlichen als auch den theologischen Gehalt der johanneischen Wendung.
- source_word: ἔδωκεν
  choice: hat ... gegeben
  rationale: Das Perfekt gibt die abgeschlossene Gabe Gottes mit ihrer fortdauernden Bedeutung im Deutschen idiomatisch wieder, ohne den Aorist auf eine bestimmte dogmatische Deutung festzulegen.
- source_word: ὁ θεὸς ἡμῖν
  choice: Gott hat uns
  rationale: Direkte und natürliche Wiedergabe von Subjekt und indirektem Objekt; „uns“ wird nicht über den im Kontext bezeichneten Kreis hinaus näher bestimmt.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: in seinem Sohn
  rationale: Die Wiedergabe mit „in“ bewahrt die knappe johanneische Ausdrucksweise und lässt deren räumlich-relationale und theologische Dichte bestehen.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: dies ... dieses Leben
  rationale: Die Wiederholung des Demonstrativpronomens wird erhalten und verbindet das Zeugnis nachdrücklich mit dem soeben genannten Leben.
theological_decisions:
- issue: Aussagekraft des Aorists ἔδωκεν im Blick auf den gegenwärtigen Besitz des Lebens
  choice: „hat uns ewiges Leben gegeben“
  alternative: „gab uns ewiges Leben“
  rationale: Das deutsche Perfekt bezeichnet die vollzogene Gabe und lässt ihre gegenwärtige Bedeutung hervortreten. Die Fußnote bewahrt die formal näher am griechischen Aorist liegende Alternative.
- issue: Bedeutung der Aussage, das Leben sei ἐν dem Sohn
  choice: „in seinem Sohn“
  alternative: „bei seinem Sohn“ oder deutend „durch seinen Sohn“
  rationale: „In seinem Sohn“ erhält die Formulierung des griechischen Textes und löst ihre theologische Spannung nicht einseitig als bloßen Besitz oder bloße Vermittlung auf.
- issue: Bezeichnung υἱός für Jesus
  choice: „Sohn“ mit Großschreibung
  alternative: „Sohn“ mit Kleinschreibung
  rationale: Die Großschreibung kennzeichnet im deutschen Bibelstil die einzigartige christologische Bezeichnung, ohne dem Text eine zusätzliche Aussage hinzuzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Register. Der Satzbau bleibt knapp und bewahrt die zweimalige demonstrative Hervorhebung. Der Doppelpunkt gibt die inhaltseinleitende Funktion von ὅτι idiomatisch wieder.
