id: 1JN.5.13
reference: 1 John 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: de
  text: Dies habe ich euch geschrieben, die ihr an den Namen des Sohnes Gottes glaubt,[a] damit ihr wisst, dass ihr ewiges Leben habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Weniger flüssig, aber näher an der griechischen Wortfolge: „Dies habe ich euch geschrieben, damit ihr wisst, dass ihr ewiges Leben habt – euch, die ihr an den Namen des Sohnes Gottes glaubt.“'
    reason: Die griechische Wortstellung lässt die Beschreibung der Glaubenden erst auf die Aussage über das ewige Leben folgen.
lexical_decisions:
- source_word: Ταῦτα
  choice: Dies
  rationale: Das substantivisch gebrauchte neutrale Pluralpronomen verweist auf das Geschriebene; im Deutschen fasst „dies“ den Briefinhalt natürlich zusammen.
- source_word: ἔγραψα
  choice: habe ich ... geschrieben
  rationale: Das griechische Aorist lässt sich im deutschen Briefzusammenhang idiomatisch mit dem Perfekt als abgeschlossene, gegenwartsbezogene Schreibhandlung wiedergeben.
- source_word: ἵνα εἰδῆτε
  choice: damit ihr wisst
  rationale: „Damit“ gibt den Zweck wieder; der Indikativ „wisst“ ist im modernen Deutschen nach „damit“ natürlich und bewahrt den Gedanken der Gewissheit.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Die geläufige und sachlich genaue Wiedergabe des johanneischen Ausdrucks bewahrt sowohl seine zeitliche als auch seine qualitative Dimension.
- source_word: ἔχετε
  choice: ihr ... habt
  rationale: Der Präsensindikativ bezeichnet gegenwärtigen Besitz und nicht nur eine künftige Hoffnung.
- source_word: τοῖς πιστεύουσιν εἰς
  choice: die ihr an ... glaubt
  rationale: Die partizipiale Dativfügung wird als Apposition zu „euch“ verstanden; „an ... glauben“ ist die natürliche deutsche Wiedergabe von πιστεύω εἰς.
- source_word: τὸ ὄνομα
  choice: den Namen
  rationale: Die biblische Rede vom Namen bleibt erhalten und bezeichnet die offenbarte Person und Autorität, ohne sie paraphrasierend einzuengen.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: des Sohnes Gottes
  rationale: Die direkte, etablierte Wiedergabe bewahrt den christologischen Titel und die griechische Genitivverbindung.
theological_decisions:
- issue: Stellung und syntaktische Zuordnung von τοῖς πιστεύουσιν
  choice: 'Als Apposition zu ὑμῖν: „euch, die ihr an den Namen des Sohnes Gottes glaubt“'
  alternative: 'Nachgestellt und wiederaufnehmend: „damit ihr wisst, dass ihr ewiges Leben habt – ihr, die ihr an den Namen des Sohnes Gottes glaubt“'
  rationale: Die griechische Wortstellung setzt die Partizipialfügung erst nach der Aussage über das ewige Leben. Inhaltlich identifiziert sie wahrscheinlich die mit „euch“ Angeredeten; die Hauptfassung stellt diese Beziehung im Deutschen klar und flüssig dar. Die echte Unsicherheit der Zuordnung beziehungsweise Hervorhebung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertrauten johanneischen Wendungen „an den Namen ... glauben“ und „ewiges Leben“ bleiben erhalten; Satzbau und Perfekt sind zugleich natürlich und allgemein verständlich.
