  source_fidelity: 'Der deutsche Text gibt die syntaktischen Beziehungen und den argumentativen Verlauf des griechischen Ausgangstextes zuverlässig wieder: Der Glaubende besitzt das Zeugnis „in sich selbst“ (ἐν ἑαυτῷ), während derjenige, der Gott nicht glaubt, Gott faktisch „zum Lügner gemacht“ hat. Der Begründungssatz bewahrt zutreffend den Bezug auf Gottes Zeugnis über seinen Sohn. Die Perfektformen sind angemessen mit „hat ... gemacht“, „hat ... abgelegt“ und „hat ... nicht geglaubt“ wiedergegeben.'
