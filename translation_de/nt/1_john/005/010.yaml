source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: de
  text: Wer an den Sohn Gottes glaubt, hat das Zeugnis in sich selbst[a]. Wer Gott nicht glaubt, hat ihn zum Lügner gemacht[b], denn er hat dem Zeugnis, das Gott über seinen Sohn abgelegt hat, nicht geglaubt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben „in ihm“ statt „in sich selbst“. Dann könnte sich die Wendung auf den Sohn statt auf den Glaubenden beziehen.
    reason: textual_variant
  - marker: b
    text: 'Oder: „hat ihn als Lügner hingestellt“. Wörtlich steht im Griechischen „hat ihn zum Lügner gemacht“; wer Gottes Zeugnis verwirft, behandelt Gott damit als unwahrhaftig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Wer … glaubt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden Glaubenden; „Wer … glaubt“ gibt dies in natürlichem, inklusivem Deutsch wieder.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: an den Sohn Gottes
  rationale: Bei πιστεύω bezeichnet εἰς den auf eine Person gerichteten Glauben beziehungsweise das Vertrauen; die idiomatische deutsche Entsprechung lautet „an … glauben“.
- source_word: τὴν μαρτυρίαν
  choice: das Zeugnis
  rationale: „Zeugnis“ bewahrt sowohl den Inhalt der göttlichen Aussage als auch den im johanneischen Sprachgebrauch mitschwingenden Zeugencharakter.
- source_word: ἐν αὑτῷ
  choice: in sich selbst
  rationale: Das Reflexivpronomen bezieht sich am natürlichsten auf den zuvor genannten Glaubenden und wird durch „sich selbst“ ausdrücklich wiedergegeben.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: Wer Gott nicht glaubt
  rationale: Der Dativ bei πιστεύω bedeutet hier, Gottes Aussage nicht als wahr anzunehmen. „Gott nicht glauben“ vermeidet die allgemeinere Bedeutung von „nicht an Gott glauben“.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: hat ihn zum Lügner gemacht
  rationale: Die direkte Formulierung bewahrt das scharfe griechische Bild und gibt das Perfekt als Handlung mit fortdauernder Bedeutung wieder.
- source_word: οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν
  choice: hat dem Zeugnis … nicht geglaubt
  rationale: Im Deutschen ist „einem Zeugnis glauben“ die natürliche Ausdrucksweise für die Annahme seiner Wahrheit; das Perfekt wahrt die gegenwärtige Tragweite des Unglaubens.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: das Gott … abgelegt hat
  rationale: „Ein Zeugnis ablegen“ ist im Deutschen die natürliche Verbindung und bewahrt die enge Beziehung zwischen μαρτυρία und μαρτυρέω.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: über seinen Sohn
  rationale: περί mit Genitiv bezeichnet hier den Gegenstand des Zeugnisses; „über seinen Sohn“ ist präzise und gegenwärtiges Standarddeutsch.
theological_decisions:
- issue: Bezug des Zeugnisses „in sich selbst“
  choice: Das Zeugnis befindet sich im Glaubenden selbst.
  alternative: Nach der Lesart „in ihm“ könnte sich die Wendung auf den Sohn beziehen.
  rationale: Der vorgelegte SBLGNT-Text hat das Reflexivpronomen αὑτῷ, das am natürlichsten auf den Glaubenden zurückweist. Die abweichende Lesart wird in einer Fußnote offengehalten.
- issue: Bedeutung von „Gott nicht glauben“
  choice: Gemeint ist die Zurückweisung von Gottes Zeugnis.
  alternative: Allgemeiner Unglaube an Gottes Existenz.
  rationale: Der mit ὅτι eingeleitete Begründungssatz bestimmt den Unglauben näher als Nichtannahme des Zeugnisses Gottes über seinen Sohn.
- issue: Aussage „zum Lügner gemacht“
  choice: Die scharfe wörtliche Form bleibt im Haupttext erhalten.
  alternative: „ihn als Lügner hingestellt“ beziehungsweise „ihn wie einen Lügner behandelt“
  rationale: Die Übersetzung wahrt die rhetorische und theologische Spannung des griechischen Ausdrucks, ohne zu behaupten, ein Mensch könne Gottes Wesen tatsächlich verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die generische Form „Wer …“ vermeidet unnötig geschlechtsspezifische oder altertümliche Sprache. Die Wiederholung von „Zeugnis“ und „glauben“ bewahrt die johanneische Argumentationsstruktur; der markante Ausdruck „zum Lügner gemacht“ bleibt bewusst unverflacht.
