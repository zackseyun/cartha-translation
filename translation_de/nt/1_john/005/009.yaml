source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: de
  text: 'Wenn wir das Zeugnis von Menschen annehmen, ist Gottes Zeugnis größer; denn dies ist das Zeugnis Gottes: dass er über seinen Sohn Zeugnis abgelegt hat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die letzte Aussage kann auch als Begründung verstanden werden: „weil er über seinen Sohn Zeugnis abgelegt hat“.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: Zeugnis
  rationale: Bewahrt die dreifache Wiederholung und den beweisbezogenen Sinn des griechischen Ausdrucks; im Deutschen ist „Zeugnis“ hier natürlicher als „Bezeugung“.
- source_word: ἀνθρώπων
  choice: von Menschen
  rationale: ἄνθρωπος bezeichnet hier Menschen allgemein und stellt menschliches Zeugnis dem Zeugnis Gottes gegenüber; „Menschen“ gibt diesen generischen Sinn im modernen Deutschen genau wieder.
- source_word: λαμβάνομεν
  choice: annehmen
  rationale: Im Zusammenhang mit einem Zeugnis bedeutet λαμβάνω, es gelten zu lassen beziehungsweise anzuerkennen; „annehmen“ ist im Deutschen idiomatischer als das wörtlichere „empfangen“.
- source_word: μείζων
  choice: größer
  rationale: Gibt den Komparativ direkt wieder und lässt offen, in welcher Hinsicht Gottes Zeugnis das menschliche überragt.
- source_word: ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: denn dies ist das Zeugnis Gottes
  rationale: Das erste ὅτι wird kausal verstanden. „Denn“ stellt den Begründungszusammenhang würdig und natürlich dar und bewahrt die Wiederholung von „Zeugnis Gottes“.
- source_word: ὅτι μεμαρτύρηκεν
  choice: Er hat … Zeugnis abgelegt
  rationale: Das zweite ὅτι wird als Inhaltsmarker aufgefasst und im Deutschen durch einen Doppelpunkt ausgedrückt. Das Perfekt μεμαρτύρηκεν bezeichnet ein erfolgtes Bezeugen mit fortdauernder Geltung.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: über seinen Sohn
  rationale: „Über“ ist eine natürliche moderne Wiedergabe von περί mit Genitiv in der Bedeutung „betreffend“ oder „von“.
theological_decisions:
- issue: Generischer Sinn von ἀνθρώπων
  choice: Menschen
  alternative: Männer
  rationale: Der Kontext stellt menschliches Zeugnis allgemein dem göttlichen Zeugnis gegenüber; eine geschlechtsspezifische Wiedergabe würde den Referenzbereich im heutigen Deutschen unnötig verengen.
- issue: Funktion des zweiten ὅτι
  choice: Inhaltssatz, durch Doppelpunkt wiedergegeben
  alternative: 'Kausalsatz: „weil er über seinen Sohn Zeugnis abgelegt hat“'
  rationale: Am natürlichsten erläutert die Schlussklausel den Inhalt des unmittelbar zuvor genannten Zeugnisses Gottes. Da ὅτι jedoch auch kausal verstanden werden kann, wird diese echte syntaktische Mehrdeutigkeit in einer Fußnote ausgewiesen.
- issue: Aussage von μεμαρτύρηκεν
  choice: „hat … Zeugnis abgelegt“
  alternative: „hat … bezeugt“
  rationale: Die Form wahrt den sprachlichen Zusammenhang mit μαρτυρία („Zeugnis“) und gibt den resultativ fortwirkenden Sinn des griechischen Perfekts wieder, ohne den Inhalt des Zeugnisses näher festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Wiederholung von „Zeugnis“ bleibt erhalten. Der Doppelpunkt macht den bevorzugten Inhaltssinn des zweiten ὅτι gut lesbar; die mögliche kausale Deutung wird in der Fußnote bewahrt.
