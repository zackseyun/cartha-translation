  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: de
  text: Jede Ungerechtigkeit ist Sünde[a], und es gibt Sünde, die nicht zum Tod führt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jedes Unrecht ist Sünde.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »und es gibt Sünde nicht zum Tod«; auch möglich: »und es gibt Sünde, die nicht im Tod endet«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: Jede Ungerechtigkeit
  rationale: Das distributive „jede“ gibt πᾶσα beim artikellosen Singular natürlich wieder und bewahrt den umfassenden Sinn. „Ungerechtigkeit“ hält die moralisch-theologische Bedeutung von ἀδικία fest; „Unrecht“ ist eine mögliche, idiomatischere Alternative.
- source_word: ἁμαρτία
  choice: Sünde
  rationale: „Sünde“ ist in beiden Vorkommen die geläufige und kontextuell genaue Wiedergabe von ἁμαρτία.
- source_word: καὶ
  choice: doch
  rationale: καί verbindet die allgemeine Aussage mit einer abgrenzenden Feststellung. Im Deutschen macht „doch“ diesen sachlichen Kontrast natürlich sichtbar, ohne ihn stärker als im Zusammenhang anzulegen.
- source_word: οὐ πρὸς θάνατον
  choice: die nicht zum Tod führt
  rationale: Die ergänzte Relativkonstruktion ergibt einen klaren deutschen Satz und gibt die Ziel- beziehungsweise Ergebnisrichtung von πρὸς θάνατον wieder. Sie entspricht zugleich der Wendung des vorhergehenden Verses.
- source_word: θάνατον
  choice: Tod
  rationale: Die direkte Wiedergabe lässt offen, ob körperlicher Tod, geistlicher Tod oder endgültiges Gericht gemeint ist.
theological_decisions:
- issue: Art des „Todes“ in der Wendung οὐ πρὸς θάνατον
  choice: Nur „Tod“, ohne deutenden Zusatz
  alternative: körperlicher Tod; geistlicher Tod; endgültige Verdammnis
  rationale: Der griechische Text bestimmt die Art des Todes nicht näher. Die Übersetzung bewahrt daher die theologische Offenheit.
- issue: Bedeutungsumfang von ἀδικία
  choice: „Ungerechtigkeit“ im Haupttext
  alternative: „Unrecht“; „falsches Handeln“
  rationale: „Ungerechtigkeit“ wahrt den breiten moralisch-theologischen Gehalt und vermeidet eine Beschränkung auf einzelne Verfehlungen oder nur gesellschaftliche Ungerechtigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Sünde“ wird wie im Griechischen beibehalten. Die Formulierung „zum Tod führt“ ist verständlich, ohne die Art des Todes festzulegen.
