id: 1JN.5.12
reference: 1 John 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: de
  text: Wer den Sohn hat, hat das Leben[a]; wer den Sohn Gottes nicht hat, hat das Leben nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das ewige Leben«; im johanneischen Sprachgebrauch bezeichnet »Leben« hier das Leben, das im Sohn zu finden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: wer … hat
  rationale: Der substantivierte Präsenspartizip bezeichnet allgemein eine Person, die dadurch gekennzeichnet ist, dass sie den Sohn hat. „Wer … hat“ ist im modernen Deutsch natürlich und bewahrt den generischen Sinn.
- source_word: τὸν υἱόν
  choice: den Sohn
  rationale: Im ersten Satzteil steht nur „der Sohn“. Die kürzere Form bewahrt die Variation des griechischen Textes und ist im Kontext eindeutig.
- source_word: ἔχει
  choice: hat
  rationale: „Hat“ gibt ἔχω direkt und idiomatisch wieder, ohne die relationale und theologische Bedeutung durch „besitzt“ unnötig einzuengen.
- source_word: τὴν ζωήν
  choice: das Leben
  rationale: Der bestimmte Artikel lässt sich im Deutschen natürlich mit „das Leben“ wiedergeben. Die Formulierung bewahrt das johanneische Gewicht des Ausdrucks, ohne ihn im Haupttext zu „ewiges Leben“ zu erweitern.
- source_word: ὁ μὴ ἔχων
  choice: wer … nicht hat
  rationale: μή verneint den substantivierten Partizipialausdruck. Die Wiedergabe entspricht dem ersten Satzteil und erhält den ausgewogenen Gegensatz.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: den Sohn Gottes
  rationale: Die Formulierung gibt den ausdrücklichen Genitiv und den vollen christologischen Titel klar und geläufig wieder.
- source_word: οὐκ ἔχει
  choice: hat … nicht
  rationale: οὐκ verneint das finite Verb. Die deutsche Satzstellung „hat das Leben nicht“ ist natürlich und hält die Parallelität zum positiven Satzteil aufrecht.
theological_decisions:
- issue: Bedeutung von ζωή im johanneischen Zusammenhang
  choice: Im Haupttext „das Leben“ statt der Erweiterung „das ewige Leben“.
  alternative: das ewige Leben
  rationale: Im 1. Johannesbrief bezeichnet ζωή häufig das ewige Leben, das im Sohn zu finden ist. Da der Vers selbst jedoch nur ζωή sagt, bleibt der Haupttext bei „das Leben“; eine Fußnote erläutert den kontextuellen Sinn.
- issue: Generischer substantivierter Partizip im Maskulinum Singular
  choice: Wiedergabe mit „wer …“
  alternative: derjenige, der …; wer auch immer …
  rationale: Das grammatische Maskulinum Singular bezeichnet hier allgemein jeden Menschen. „Wer …“ ist inklusiv im gemeinten Umfang, prägnant und modernes Standarddeutsch, ohne die Aussage zu pluralisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe antithetische Satzstruktur des griechischen Textes bleibt erhalten; die Wiederholung von „hat“ und „Leben“ wird nicht stilistisch geglättet, weil sie die Aussage zuspitzt.
