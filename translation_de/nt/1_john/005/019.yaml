    rationale: »im Bösen« bildet im Deutschen vor allem die abstrakte Deutung ab. Für die am griechischen Wortlaut orientierte Wiedergabe mit möglichem personalem Bezug ist »in dem Bösen« präziser; die abstrakte Lesart kann anschließend ausdrücklich genannt werden.
