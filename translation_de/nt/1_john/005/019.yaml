  source_fidelity: Die Aussage wird insgesamt zutreffend wiedergegeben. Für ἐκ τοῦ θεοῦ ist »von Gott sind« im modernen Standarddeutsch idiomatischer als das in dieser Verwendung sehr ungewohnte »aus Gott sind«, ohne die offene Herkunfts- und Zugehörigkeitsbeziehung enger als der griechische Text festzulegen. »unter der Macht des Bösen« gibt den durch ἐν τῷ πονηρῷ und κεῖται ausgedrückten Zustand des Ausgeliefertseins natürlich wieder und wahrt zugleich den im johanneischen Kontext wahrscheinlichen personalen Bezug.
  naturalness: »Wir wissen, dass wir von Gott sind« ist natürliches, würdiges modernes Deutsch. »Die ganze Welt steht unter der Macht des Bösen« wäre zwar sehr idiomatisch, entfernte sich aber vom Bild von κεῖται; daher wird »liegt unter der Macht des Bösen« bevorzugt. Die knappe Fußnote erläutert die formal nähere, im Deutschen jedoch weniger geläufige Wiedergabe.
  terminology: »der Böse« ist als personal verstandene Bezeichnung angemessen und entspricht dem wahrscheinlichen johanneischen Gebrauch von ὁ πονηρός. Die Fußnote hält die abstrakte Deutung als echte Möglichkeit offen, ohne sie dem Haupttext aufzuzwingen.
