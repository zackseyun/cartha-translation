  text: οἴδαμεν ὅτι ἐκ τοῦ θεοῦ ἐσμεν, καὶ ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: de
  text: Wir wissen, dass wir von Gott sind, und die ganze Welt liegt unter der Macht des Bösen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und die ganze Welt liegt in dem Bösen«. Die griechische Form kann auch auf das Böse als abstrakte Macht bezogen werden; im Sprachgebrauch des 1. Johannesbriefs ist jedoch wahrscheinlich der Böse als Person gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: Wir wissen
  rationale: Die Form bezeichnet hier ein gefestigtes Wissen beziehungsweise eine sichere Überzeugung. »Wir wissen« ist direkt, natürlich und bewahrt den Ton der Gewissheit.
- source_word: ἐκ τοῦ θεοῦ
  choice: aus Gott
  rationale: ἐκ bezeichnet Herkunft oder Zugehörigkeit. »Aus Gott« erhält diese Offenheit und trägt nicht ausdrücklich die spezifischere Vorstellung »von Gott geboren« in den Satz ein.
- source_word: ὁ κόσμος ὅλος
  choice: die ganze Welt
  rationale: Die Wortgruppe bezeichnet umfassend die gesamte Welt; im johanneischen Zusammenhang kann »Welt« zugleich die von Gott entfremdete Weltordnung meinen.
- source_word: ἐν τῷ πονηρῷ
  choice: in der Gewalt des Bösen
  rationale: Im johanneischen Sprachgebrauch ist ein persönlicher Bezug auf den Bösen wahrscheinlich. »In der Gewalt des Bösen« gibt den gemeinten Herrschaftsbereich in natürlichem Deutsch wieder, während die Fußnote die formalere und mehrdeutige Fassung dokumentiert.
- source_word: κεῖται
  choice: liegt
  rationale: »Liegt« bewahrt das Bild des griechischen Verbs und beschreibt zugleich einen bestehenden Zustand.
theological_decisions:
- issue: Bezeichnet τῷ πονηρῷ den Bösen als Person oder das Böse als abstrakte Macht?
  choice: 'Haupttext: persönlicher Bezug auf »den Bösen«'
  alternative: 'Abstrakter Bezug: »im Bösen«'
  rationale: Der persönliche Gebrauch von ὁ πονηρός im 1. Johannesbrief spricht für »den Bösen«. Da die griechische Form formal auch abstrakt verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Aus Gott« bewahrt bewusst die knappe Herkunfts- und Zugehörigkeitsaussage des Originals; »in der Gewalt des Bösen« macht die Wendung verständlich, ohne die in der Fußnote ausgewiesene Mehrdeutigkeit zu verschweigen.
