id: 1JN.5.3
reference: 1 John 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: de
  text: 'Denn darin besteht die Liebe zu Gott[a]: dass wir seine Gebote halten. Und seine Gebote sind nicht belastend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Liebe Gottes“. Die griechische Wendung kann sowohl die Liebe zu Gott als auch die von Gott ausgehende Liebe bezeichnen; der unmittelbare Zusammenhang spricht eher für „Liebe zu Gott“.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: darin besteht
  rationale: Das Demonstrativpronomen weist auf den folgenden Inhaltssatz voraus. Die deutsche Wendung macht diese erklärende Funktion natürlich und deutlich.
- source_word: γάρ
  choice: Denn
  rationale: Kennzeichnet die Begründung beziehungsweise Erläuterung des vorherigen Gedankens und wahrt den Zusammenhang.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: Liebe zu Gott
  rationale: Der unmittelbare Kontext verbindet die Liebe der Glaubenden zu Gott mit dem Halten seiner Gebote. Daher ist der Genitiv hier am ehesten objektiv zu verstehen; die mögliche andere Deutung wird in der Fußnote bewahrt.
- source_word: ἵνα
  choice: dass
  rationale: Leitet hier den Inhalt beziehungsweise die Erläuterung dessen ein, worin die Liebe zu Gott besteht, nicht bloß einen Zweck.
- source_word: ἐντολάς
  choice: Gebote
  rationale: Entspricht dem gewichtigen johanneischen Gebrauch und ist im modernen Deutschen klar und vertraut.
- source_word: τηρῶμεν
  choice: wir … halten
  rationale: Gibt den johanneischen Sinn von τηρέω als bewahren, beachten beziehungsweise befolgen wieder und erhält die geläufige Verbindung „Gebote halten“.
- source_word: βαρεῖαι
  choice: belastend
  rationale: Vermittelt den übertragenen Sinn von etwas Schwerem beziehungsweise schwer zu Tragendem in natürlichem modernem Deutsch.
theological_decisions:
- issue: Genitivbedeutung in ἡ ἀγάπη τοῦ θεοῦ
  choice: 'Objektiver Genitiv: die Liebe der Glaubenden zu Gott'
  alternative: 'Subjektiver Genitiv: Gottes Liebe zu den Glaubenden; auch eine bewusste Offenheit für beide Bezüge ist möglich'
  rationale: Vers 2 verbindet die Liebe zu Gott mit dem Tun seiner Gebote, und Vers 3 erläutert diese Liebe unmittelbar als das Halten seiner Gebote. Deshalb spricht der Kontext stärker für „Liebe zu Gott“. Die grammatische Alternative wird jedoch nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darin besteht“ stellt den vorausweisenden Charakter von αὕτη und den erläuternden ἵνα-Satz idiomatisch dar. Der zweite Hauptsatz bleibt eigenständig, um die nachdrückliche Aussage des Griechischen klar wiederzugeben.
