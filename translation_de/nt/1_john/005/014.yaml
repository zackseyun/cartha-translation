id: 1JN.5.14
reference: 1 John 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: de
  text: 'Und darin besteht die Zuversicht, die wir vor ihm haben: Wenn wir um etwas bitten, das seinem Willen entspricht, hört er uns.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρρησία
  choice: Zuversicht
  rationale: Im johanneischen Zusammenhang bezeichnet das Wort ein vertrauensvolles, offenes Auftreten vor Gott. »Zuversicht« ist im Gebetskontext natürlich und bewahrt diesen Sinn besser als bloße »Kühnheit«.
- source_word: πρὸς αὐτόν
  choice: vor ihm
  rationale: Die Präposition bezeichnet hier die personale Ausrichtung beziehungsweise das Sein in Gottes Gegenwart. »Vor ihm« gibt dies im Deutschen idiomatisch wieder.
- source_word: ὅτι
  choice: Doppelpunkt mit folgendem Inhaltssatz
  rationale: ὅτι führt hier den Inhalt der Zuversicht ein, nicht deren Ursache. Im Deutschen drückt der Doppelpunkt diese erläuternde Funktion natürlich aus.
- source_word: ἐάν τι αἰτώμεθα
  choice: wenn wir um etwas bitten
  rationale: Die Formulierung bewahrt die allgemeine Bedingung und den offenen Umfang von τι, ohne ein zeitliches »wann immer« ausdrücklich hinzuzufügen.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: das seinem Willen entspricht
  rationale: Diese natürliche deutsche Formulierung gibt κατά als Übereinstimmung mit einer Norm wieder und bewahrt das theologische Gewicht von θέλημα.
- source_word: ἀκούει ἡμῶν
  choice: hört er uns
  rationale: Die übliche deutsche Gebetssprache gibt die griechische Genitivkonstruktion treffend wieder. Die Formulierung besagt, dass Gott das Gebet hört und ihm Beachtung schenkt, ohne bereits ausdrücklich dessen Erfüllung zu behaupten.
theological_decisions:
- issue: Bedeutung des göttlichen Hörens beim Gebet
  choice: »hört er uns« als Hören und Beachten des Gebets
  alternative: »er erhört uns« oder »er gewährt uns unsere Bitten«
  rationale: Der griechische Ausdruck sagt, dass Gott die seinem Willen entsprechenden Bitten hört. Die stärkere Aussage ihrer Gewährung wird hier nicht ausdrücklich in das Verb hineingelesen; so bleibt die Spannung zum folgenden Vers erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und gut verständlich; »Zuversicht« und »Wille« bewahren den gewichtigen theologischen Ton ohne konfessionelle Zusätze.
