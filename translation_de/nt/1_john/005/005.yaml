id: 1JN.5.5
reference: 1 John 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: de
  text: Wer aber ist es, der die Welt überwindet, wenn nicht der, der glaubt, dass Jesus der Sohn Gottes ist?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Überwindende … der Glaubende“. Die griechischen Partizipien stehen im maskulinen Singular, sind hier jedoch repräsentativ gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: wer
  rationale: Das Interrogativpronomen eröffnet eine rhetorische Frage; „wer“ gibt sie schlicht und natürlich wieder.
- source_word: δέ
  choice: aber
  rationale: δέ knüpft an den vorherigen Gedanken an und setzt zugleich einen leichten rhetorischen Akzent; „aber“ ist hier im Deutschen idiomatisch, ohne einen scharfen Gegensatz zu erzwingen.
- source_word: ὁ νικῶν
  choice: der … die Welt überwindet
  rationale: Das substantivierte Präsenspartizip bezeichnet die Person in charakteristischer beziehungsweise fortdauernder Hinsicht. Die Relativkonstruktion bewahrt die verbale Aussage in natürlichem Deutsch.
- source_word: τὸν κόσμον
  choice: die Welt
  rationale: Die einfache Wiedergabe lässt die johanneische Bedeutungsspanne von κόσμος bestehen und vermeidet die interpretierende Erweiterung „Weltsystem“.
- source_word: εἰ μὴ
  choice: wenn nicht
  rationale: In der rhetorischen Frage drückt εἰ μή Ausschließlichkeit aus. „Wenn nicht“ entspricht der griechischen Form und ist im Deutschen natürlich.
- source_word: ὁ πιστεύων
  choice: der, der glaubt
  rationale: Die Relativkonstruktion erhält den verbalen Charakter des substantivierten Präsenspartizips und bezeichnet Glauben als kennzeichnende Haltung.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Inhalt des Glaubens ein, nicht eine Begründung.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Übliche deutsche Namensform.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Die Wiedergabe bewahrt den bestimmten christologischen Titel direkt und ohne erklärende Erweiterung.
theological_decisions:
- issue: Generische Aussage der substantivierten maskulinen Partizipien ὁ νικῶν und ὁ πιστεύων
  choice: der … / der, der glaubt
  alternative: derjenige, der … / wer glaubt
  rationale: Die griechischen Formen stehen grammatisch im maskulinen Singular, haben hier aber repräsentative, allgemeine Kraft. Die deutsche Form bleibt nahe an der Satzgestalt; die Fußnote verhindert eine unnötige Beschränkung auf Männer.
- issue: Christologisches Bekenntnis ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  alternative: Gottes Sohn
  rationale: „Der Sohn Gottes“ bewahrt Artikel, Titelcharakter und bekenntnishafte Prägnanz, ohne den theologischen Gehalt auszuweiten oder abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die exklusive Wendung bleiben erhalten; „die Welt“ wird bewusst nicht interpretierend erweitert.
