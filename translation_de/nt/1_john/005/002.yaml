base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: de
  text: 'Daran erkennen wir, dass wir die Kinder Gottes lieben: wenn wir Gott lieben und seine Gebote befolgen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Gebote halten“ beziehungsweise „seinen Geboten gehorchen“. Das hier verwendete griechische Verb bedeutet wörtlich „tun“ (ποιῶμεν), nicht das sonst häufigere „halten“ (τηρέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Daran
  rationale: Die idiomatische deutsche Wiedergabe bewahrt die hinweisende Funktion der johanneischen Wendung und bezeichnet das folgende Kriterium der Erkenntnis.
- source_word: γινώσκομεν
  choice: erkennen wir
  rationale: „Erkennen“ gibt den gegenwärtigen Vorgang beziehungsweise die Feststellung in diesem Zusammenhang natürlicher wieder als das statischere „wissen wir“.
- source_word: ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ
  choice: wir die Kinder Gottes lieben
  rationale: „Kinder Gottes“ wahrt den inklusiven Kindschaftsbegriff von τέκνα und entspricht der johanneischen Ausdrucksweise.
- source_word: ὅταν
  choice: wenn
  rationale: Mit den Präsens-Konjunktiven kann ὅταν „wenn“ oder „wann immer“ bedeuten; „wenn“ bewahrt hier die offen bleibende zeitlich-kriterielle Beziehung in natürlichem Deutsch.
- source_word: τὸν θεὸν ἀγαπῶμεν
  choice: wir Gott lieben
  rationale: Schlichte und genaue Wiedergabe des griechischen Ausdrucks ohne unnötige Ergänzung.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: seine Gebote tun
  rationale: „Tun“ bildet ποιέω unmittelbar ab und bewahrt den auffälligen Unterschied zum sonst häufigen τηρέω („halten“), auch wenn „Gebote halten“ im Deutschen geläufiger ist.
theological_decisions:
- issue: Verhältnis der Liebe zu Gottes Kindern zur Liebe zu Gott und zum Tun seiner Gebote
  choice: Der Vers nennt die Liebe zu Gott und das Tun seiner Gebote als das Kriterium, an dem Liebe zu Gottes Kindern erkannt wird.
  alternative: Die Aussage ausdrücklich als Ursache, Beweis oder vollständige Definition der Geschwisterliebe festzulegen.
  rationale: Der griechische Text formuliert den Zusammenhang knapp und lässt seine genaue logische Einordnung offen. Der Doppelpunkt und „wenn“ bewahren diese Spannung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Daran erkennen wir“ ist idiomatisch und klar; das bewusst etwas markantere „Gebote tun“ bewahrt die konkrete Wortwahl des griechischen Textes und wird durch die Fußnote erläutert.
