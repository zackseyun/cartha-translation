  terminology: „Bruder“, „Sünde“, „Tod“, „bitten“ und „Leben“ sind angemessen und bewahren die theologische Offenheit des Ausgangstextes. Die explizite Nennung Gottes ist als kontextuelle Verdeutlichung vertretbar, sofern die Fußnote klarstellt, dass das Subjekt im Griechischen nicht ausgedrückt ist.
