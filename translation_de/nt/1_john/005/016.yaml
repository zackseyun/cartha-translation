reference: 1 John 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: de
  text: Wenn jemand sieht, dass sein Bruder[a] eine Sünde begeht, die nicht zum Tod führt,[b] soll er bitten, und Gott[c] wird ihm Leben geben – denen, die Sünde begehen, die nicht zum Tod führt. Es gibt Sünde, die zum Tod führt. Ich sage nicht, dass er in Bezug auf diese bitten soll.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bruder“ steht im Griechischen im maskulinen Singular und meint hier wahrscheinlich einen Glaubensbruder; im Zusammenhang kann die Bezeichnung allgemeiner einen Mitchristen einschließen.
    reason: cultural_note
  - marker: b
    text: Der griechische Text lässt offen, ob mit „Tod“ körperlicher Tod, geistlicher Tod oder endgültige Verdammnis gemeint ist.
    reason: theological_ambiguity
  - marker: c
    text: 'Wörtlich steht: „und wird ihm Leben geben“. Das Subjekt ist im Griechischen nicht ausdrücklich genannt; aus dem Zusammenhang des Bittens wird Gott als Geber verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: Bruder
  rationale: Die maskuline Singularform wird formal bewahrt. Im johanneischen Gemeindekontext bezeichnet das Wort wahrscheinlich einen Glaubensbruder; ein möglicherweise weiter gemeinter christlicher Gebrauch wird in der Fußnote erläutert.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: eine Sünde begeht
  rationale: Die Verbindung aus Partizip und stammverwandtem Akkusativ bezeichnet konkret das Begehen einer Sünde; die gewählte Formulierung ist idiomatisches modernes Deutsch.
- source_word: μὴ πρὸς θάνατον
  choice: nicht zum Tod führt
  rationale: Die Wendung gibt die Ziel- oder Ergebnisrichtung von πρός wieder, ohne festzulegen, ob körperlicher, geistlicher oder endgültiger Tod gemeint ist.
- source_word: αἰτήσει
  choice: soll er bitten
  rationale: Der Futur Indikativ hat hier wahrscheinlich auffordernde Bedeutung. „Soll er bitten“ vermittelt diese Funktion in natürlichem Deutsch; die Bitte ist im Kontext Gebet.
- source_word: δώσει αὐτῷ ζωήν
  choice: Gott wird ihm Leben geben
  rationale: Das griechische Verb nennt kein ausdrückliches Subjekt. Im Zusammenhang der Bitte ist Gott am plausibelsten als Geber des Lebens zu verstehen; die Ergänzung wird durch eine Fußnote kenntlich gemacht.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: denen, die Sünde begehen, die nicht zum Tod führt
  rationale: Die nachgestellte Dativphrase wird nach einem Gedankenstrich beibehalten. So bleibt der auffällige Wechsel vom singularischen „ihm“ zur pluralischen Erläuterung sichtbar, ohne die schwierige Syntax stärker umzudeuten.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: Es gibt Sünde, die zum Tod führt
  rationale: Die artikellose und knappe griechische Formulierung wird ohne unbestimmten Artikel wiedergegeben, sodass nicht entschieden wird, ob eine einzelne bestimmte Sünde oder eine Kategorie gemeint ist.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: Ich sage nicht, dass er wegen dieser bitten soll
  rationale: „Wegen dieser“ nimmt die zuvor genannte Sünde auf. „Bitten“ wahrt den Zusammenhang mit dem vorherigen Gebetsbitten, ohne aus der Aussage ein ausdrückliches Verbot zu machen.
theological_decisions:
- issue: Bedeutung des Todes bei „Sünde, die zum Tod führt“
  choice: Die nicht näher bestimmte Bezeichnung „Tod“ bleibt stehen.
  alternative: Körperlicher Tod als Gericht, geistlicher Tod oder endgültige Verdammnis.
  rationale: Der Vers bestimmt die Art des Todes nicht. Die Übersetzung bewahrt daher die exegetische und theologische Offenheit.
- issue: Subjekt von „wird ihm Leben geben“
  choice: Gott wird als im Kontext verstandenes Subjekt ausdrücklich genannt.
  alternative: Das Pronomen „er“ verwenden und das Subjekt formal unbestimmt lassen oder den Bittenden als Geber verstehen.
  rationale: Im Gebetszusammenhang ist Gott am ehesten als derjenige verstanden, der Leben gibt. Da der griechische Text das Subjekt nicht ausdrücklich nennt, weist eine Fußnote auf die Ergänzung hin.
- issue: Aussage über das Bitten bei Sünde zum Tod
  choice: „Ich sage nicht, dass er … bitten soll“ wird als zurückhaltende Nichtaufforderung formuliert.
  alternative: 'Als ausdrückliches Verbot wiedergeben: „Er soll nicht darum bitten.“'
  rationale: οὐ … λέγω ἵνα ist weniger eindeutig als ein direktes Verbot. Die Übersetzung verschärft die Aussage deshalb nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierungen sind für gewöhnliche Leser verständlich, bewahren aber die knappe Aussageweise und die syntaktische Spannung des griechischen Textes. Der Gedankenstrich markiert die nachgestellte pluralische Erläuterung.
