  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: de
  text: Dieser ist es, der durch Wasser und Blut gekommen ist, Jesus, der Messias; nicht im Wasser allein, sondern im Wasser und im Blut[a]. Und der Geist ist es, der Zeugnis ablegt, weil[b] der Geist die Wahrheit ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Was »Wasser und Blut« hier genau bezeichnet, ist umstritten; vorgeschlagen werden unter anderem Jesu Taufe und Tod, seine Geburt und sein Tod oder eine sakramentale Bildsprache. Der Text legt keine dieser Deutungen ausdrücklich fest.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »dass der Geist die Wahrheit ist«. Das griechische Bindewort kann hier einen Grund oder den Inhalt des Zeugnisses einführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: Dieser ist es, der … gekommen ist
  rationale: Bewahrt die nachdrückliche Identifikation des Demonstrativpronomens und gibt das substantivierte Aoristpartizip in natürlichem, würdigem Deutsch wieder.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: durch Wasser und Blut
  rationale: „Durch“ entspricht διά mit Genitiv eng und lässt die umstrittene sachliche Deutung der beiden Begriffe offen.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  rationale: Χριστός hat hier in der Apposition erkennbaren Titelcharakter; die Formulierung ist im Deutschen idiomatisch und macht den Titel verständlich.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: nicht durch das Wasser allein, sondern durch das Wasser und durch das Blut
  rationale: Die wiederholte Präposition und die Artikel werden zur Wahrung des Kontrasts und der Betonung wiedergegeben; „durch“ hält zugleich den Anschluss an den ersten Satzteil.
- source_word: τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν
  choice: der Geist ist es, der Zeugnis ablegt
  rationale: Die Konstruktion gibt das substantivierte Präsenspartizip mit seiner fortdauernden verbalen Aussage natürlich wieder.
- source_word: ὅτι
  choice: weil
  rationale: Die kausale Lesart bietet hier den Grund für die Verlässlichkeit des Zeugnisses; die mögliche inhaltliche Lesart wird in einer Fußnote bewahrt.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Der bestimmte Artikel und die identifizierende Prädikatsaussage werden unmittelbar wiedergegeben.
theological_decisions:
- issue: Bedeutung von „Wasser und Blut“
  choice: Die Ausdrücke bleiben ohne auslegende Ergänzung stehen.
  alternative: Taufe und Tod Jesu; Geburt und Tod; sakramentale Bildsprache
  rationale: Der griechische Text erklärt die Begriffe nicht. Die Übersetzung wahrt deshalb die echte Auslegungsoffenheit.
- issue: Referent von τὸ πνεῦμα
  choice: der Geist, verstanden als der Heilige Geist
  alternative: ein unbestimmter Geist
  rationale: Der Kontext des göttlichen Zeugnisses und der johanneische Sprachgebrauch stützen diesen Referenten; die Übersetzung fügt jedoch „Heilige“ nicht ausdrücklich hinzu.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: In der appositionellen Identifikation ist der Titelcharakter deutlich; „Messias“ vermittelt diesen im heutigen Deutsch transparent.
- issue: Funktion von ὅτι
  choice: 'kausal: „weil“'
  alternative: 'inhaltlich: „dass“'
  rationale: Die kausale Lesart passt gut zum Gedankengang, doch die grammatisch mögliche inhaltliche Lesart wird ausdrücklich vermerkt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die emphatische Satzgestalt „Dieser ist es …“ und die Wiederholung „durch das Wasser … durch das Blut“ bewahren die Struktur und Betonung des griechischen Textes, ohne die umstrittene Bildsprache auszudeuten.
