source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: de
  text: Jeder, der glaubt, dass Jesus der Messias[a] ist, ist aus Gott geboren; und jeder, der den liebt, der ihn gezeugt hat, liebt auch den, der aus ihm geboren ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Der griechische Titel Χριστός bezeichnet den Gesalbten, den Messias.'
    reason: alternative_reading
  - marker: b
    text: 'Das Griechische verwendet in diesem Vers durchgehend Formen desselben Verbs γεννάω. Im Deutschen erfordert die aktive Form hier „zeugen“, während die passive Form idiomatisch mit „geboren“ wiedergegeben wird; entsprechend auch: „aus Gott gezeugt … der ihn gezeugt hat … der aus ihm gezeugt ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Jeder, der glaubt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden Menschen, auf den die Aussage zutrifft. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den generischen Sinn.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: dass Jesus der Messias ist
  rationale: Χριστός steht als Titel für den verheißenen Gesalbten. „Messias“ gibt diesen Titelgehalt deutlicher wieder als die im Deutschen leicht namensartig verstandene Form „Christus“.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ist aus Gott geboren
  rationale: Das Perfekt bezeichnet eine vollzogene Geburt mit fortbestehendem Ergebnis; „ist aus Gott geboren“ ist zugleich idiomatisch und entspricht dem johanneischen Sprachgebrauch. „Aus“ bewahrt die durch ἐκ bezeichnete Herkunft.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: jeder, der … liebt
  rationale: Auch hier hat das substantivierte Präsenspartizip generische Bedeutung. Die Wiedergabe bleibt klar und parallel zum ersten Satzteil.
- source_word: τὸν γεννήσαντα
  choice: den, der gezeugt hat
  rationale: Das aktive Aoristpartizip bezeichnet den Zeugenden, ohne im Griechischen ein ausdrückliches Objekt zu nennen. Die Übersetzung wahrt dies und hält den Bezug zum folgenden Passivpartizip sichtbar.
- source_word: ἀγαπᾷ καὶ
  choice: liebt auch
  rationale: καί fügt das zweite Objekt der Liebe hinzu; die deutsche Stellung von „auch“ gibt diesen Zusammenhang natürlich wieder.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: den, der aus ihm gezeugt ist
  rationale: Das substantivierte Perfektpassiv bezeichnet den aus dem Zeugenden Hervorgegangenen mit bleibendem Status. Die verbale Formulierung erhält die bewusste Wortverbindung zu γεννήσαντα und vermeidet die interpretierende Verengung auf „Kind“.
theological_decisions:
- issue: Wiedergabe der γεννάω-Wortgruppe bei göttlicher Geburt beziehungsweise Zeugung
  choice: Im ersten Satzteil „aus Gott geboren“, im zweiten „der gezeugt hat“ und „aus ihm gezeugt ist“
  alternative: Durchgehend „gezeugt“; oder glättend „den Vater“ und „dessen Kind“
  rationale: Der erste Ausdruck entspricht dem verständlichen johanneischen Bild der Geburt aus Gott. Im zweiten Satzteil macht „zeugen/gezeugt“ die aktive und passive Beziehung deutlich, ohne „Vater“ oder „Kind“ einzusetzen, die der griechische Wortlaut dort nicht ausdrücklich nennt. Die Variation wird in einer Fußnote offengelegt.
- issue: Der Titel ὁ χριστός
  choice: der Messias
  alternative: der Christus
  rationale: Die Aussage bekennt Jesus als den verheißenen Gesalbten. „Messias“ bewahrt im heutigen Deutsch den Titelcharakter, während „Christus“ häufig wie ein Eigenname verstanden wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Parallelismus des griechischen Satzes bleibt erhalten. Das Semikolon trennt die beiden eng verbundenen allgemeinen Aussagen, ohne ihren gedanklichen Zusammenhang aufzulösen.
