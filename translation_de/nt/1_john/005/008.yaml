  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: de
  text: der Geist und das Wasser und das Blut, und die drei stimmen überein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formnäher: „und die drei sind eins.“ Die griechische Wendung meint hier wahrscheinlich, dass ihr Zeugnis übereinstimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der bestimmte Artikel wird bewahrt; im unmittelbaren Zusammenhang von 1. Johannes 5,6–8 bezeichnet πνεῦμα am ehesten den Heiligen Geist als Zeugen. Die Großschreibung ist im Deutschen ohnehin substantivisch erforderlich.
- source_word: τὸ ὕδωρ
  choice: das Wasser
  rationale: Die konkrete Bildsprache und der bestimmte Artikel bleiben erhalten. Der Vers selbst legt den genauen Bezug des Wassers nicht ausdrücklich aus.
- source_word: τὸ αἷμα
  choice: das Blut
  rationale: Die konkrete Bezeichnung und der bestimmte Artikel werden bewahrt, ohne den im Vers nicht näher erklärten Bezug interpretierend zu ergänzen.
- source_word: οἱ τρεῖς
  choice: die drei
  rationale: Die substantivische Wendung verweist unmittelbar auf Geist, Wasser und Blut und wird knapp und formal entsprechend wiedergegeben.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: stimmen überein
  rationale: Im Zusammenhang dreier Zeugen bezeichnet die Wendung am wahrscheinlichsten das Zusammenlaufen ihrer Aussage auf dasselbe Zeugnis. Die idiomatische deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne eine ontologische Einheit zu behaupten.
theological_decisions:
- issue: Ob εἰς τὸ ἕν εἰσιν ontologische Einheit oder Übereinstimmung im Zeugnis ausdrückt
  choice: „die drei stimmen überein“
  alternative: „die drei sind eins“ bzw. formnäher „die drei sind auf das Eine hin“
  rationale: Der Zusammenhang handelt vom Zeugnis des Geistes, des Wassers und des Blutes. Daher liegt eine Konvergenz ihrer Zeugnisse näher als eine Aussage über Wesenseinheit. Die Fußnote bewahrt zugleich die ungewöhnliche griechische Formulierung und ihre mögliche traditionellere Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Verbindung mit „und“ bildet die griechische Reihung bewusst nach; die Schlusswendung wird idiomatisch verständlich wiedergegeben, während die Fußnote die formale Mehrdeutigkeit offenhält.
