  source_fidelity: 'Der Haupttext gibt τὸ πνεῦμα, τὸ ὕδωρ und τὸ αἷμα vollständig und ohne zusätzliche Deutung wieder. „Die drei stimmen überein“ trifft im Zeugnis-Kontext den wahrscheinlichen Sinn von εἰς τὸ ἕν εἰσιν und vermeidet den im Deutschen möglichen Eindruck einer ontologischen Identität bei „sind eins“. Die Fußnote sollte jedoch die formnähere Alternative präziser darstellen: „auf das Eine hin“ ist keine gute wörtliche deutsche Wiedergabe der griechischen idiomatischen Wendung.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Die wiederholte Reihung mit „und“ ist bewusst quellennahe und bleibt gut lesbar. Die Satzschluss-Fußnotenmarke ist eindeutig auf die Schlusswendung bezogen.
  terminology: „Geist“, „Wasser“ und „Blut“ bewahren die im Vers absichtlich nicht näher erläuterten Begriffe. „Übereinstimmen“ ist für zusammenstimmendes Zeugnis natürlich und sachlich angemessen. Die alternative Formulierung „die drei sind eins“ gehört als formnahe, traditionelle Möglichkeit in die Fußnote, sollte aber kontextuell erklärt werden.
