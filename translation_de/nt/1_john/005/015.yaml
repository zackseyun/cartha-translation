  source_fidelity: Die Übersetzung gibt die Satzstruktur und die zweimalige Gewissheitsaussage von οἴδαμεν zuverlässig wieder. „Er uns hört“ wahrt gegenüber „erhört“ die im griechischen Wortlaut bestehende Zurückhaltung. „Worum wir auch bitten“ gibt den indefiniten Relativsatz ὃ ἐὰν αἰτώμεθα treffend als offene, nicht zeitliche Aussage wieder. „Das Erbetene“ ist eine idiomatische kollektive Wiedergabe von τὰ αἰτήματα; „haben“ bewahrt ἔχομεν, und „von ihm erbeten haben“ bildet das Perfekt sowie ἀπ’ αὐτοῦ angemessen ab.
