id: 1JN.5.15
reference: 1 John 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: de
  text: Und wenn wir wissen, dass er uns hört, worum wir auch bitten, dann wissen wir, dass wir das Erbetene haben, das wir von ihm erbeten haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: er uns hört
  rationale: ἀκούω mit dem Genitiv bezeichnet hier das Hören einer Bitte. „Uns hört“ ist im Gebetszusammenhang natürlich und legt nicht bereits die weitergehende Bedeutung „erhört“ oder „antwortet“ fest.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: worum wir auch bitten
  rationale: 'Relativpronomen und ἐάν bilden einen indefiniten Relativsatz mit offener Bedeutung: „worum auch immer“. Die deutsche Wendung ist idiomatisch und bewahrt diese inhaltliche Weite; sie bedeutet nicht lediglich „wann immer“.'
- source_word: ἔχομεν
  choice: wir … haben
  rationale: Das Präsens wird direkt mit „haben“ wiedergegeben. „Empfangen“ würde einen im Verb nicht ausdrücklich enthaltenen Deutungsschritt vornehmen.
- source_word: τὰ αἰτήματα
  choice: das Erbetene
  rationale: αἴτημα kann die erbetene Sache bezeichnen. „Das Erbetene“ klingt im Deutschen natürlicher als „die Bitten haben“ und hält zugleich die Wortverbindung zu αἰτέω sichtbar.
- source_word: ἃ ᾐτήκαμεν ἀπ’ αὐτοῦ
  choice: das wir von ihm erbeten haben
  rationale: Das Perfekt bezeichnet eine vollzogene Bitte mit gegenwärtigem Bezug. „Von ihm erbeten“ bewahrt ἀπό als Angabe der Quelle beziehungsweise der Person, von der etwas erbeten wird.
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Die zweimalige Wiederholung von οἴδαμεν wird beibehalten und wahrt den johanneischen Akzent auf Gewissheit und Erkenntnis.
theological_decisions:
- issue: Ob ἀκούει im Gebetszusammenhang bloß als „hört“ oder bereits als „erhört/antwortet“ wiederzugeben ist.
  choice: er uns hört
  alternative: er uns erhört
  rationale: Der griechische Wortlaut spricht ausdrücklich vom Hören und folgert daraus, dass die Betenden das Erbetene haben. „Erhört“ würde diese gedankliche Spannung vorzeitig auflösen und mehr festlegen, als das Verb allein ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „erbeten … erbeten“ bildet die griechische Wortverwandtschaft zwischen αἴτημα und αἰτέω ab, ohne in die im Deutschen schwerfällige Formulierung „Bitten haben“ auszuweichen.
