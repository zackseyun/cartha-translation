  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: de
  text: Wer aber seinen Bruder[a] hasst, ist in der Finsternis und geht in der Finsternis. Er weiß nicht, wohin er geht, denn die Finsternis hat seine Augen blind gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Bruder oder seine Schwester“. Im Griechischen steht „Bruder“; wahrscheinlich ist ein anderer Gläubiger innerhalb der christlichen Gemeinschaft gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: hasst
  rationale: Das substantivierte Präsenspartizip bezeichnet denjenigen, dessen Haltung vom Hass geprägt ist; die idiomatische deutsche Wiedergabe lautet „wer … hasst“.
- source_word: ἀδελφὸν
  choice: Bruder
  rationale: Das griechische Wort steht im maskulinen Singular und bezeichnet im johanneischen Zusammenhang wahrscheinlich ein Mitglied der Glaubensgemeinschaft; die weitere mögliche Referenz wird in einer Fußnote erläutert.
- source_word: ἐν τῇ σκοτίᾳ
  choice: in der Finsternis
  rationale: Der bestimmte Artikel und die zweimalige Wiederholung werden bewahrt; „Finsternis“ trägt im johanneischen Sprachgebrauch die moralisch-geistliche Bildkraft des Ausdrucks.
- source_word: περιπατεῖ
  choice: geht … umher
  rationale: Die konkrete Metapher des Gehens wird erhalten, ohne sie interpretierend zu „lebt“ oder „führt sein Leben“ aufzulösen.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: Er weiß nicht, wohin er geht
  rationale: Diese natürliche deutsche Formulierung bewahrt sowohl die gegenwärtige Bewegung als auch die Orientierungslosigkeit des griechischen Ausdrucks.
- source_word: ἐτύφλωσεν
  choice: hat … blind gemacht
  rationale: Das Perfekt gibt die vollzogene Handlung und ihren fortdauernden Zustand wieder; „blind gemacht“ ist im modernen Deutsch natürlicher als das hier mögliche „geblendet“.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: seine Augen
  rationale: Die konkrete Bildsprache und das Possessivverhältnis werden direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Moralisch-geistlicher Sinn der Finsternis im johanneischen Gegensatz von Licht und Finsternis
  choice: σκοτία wird bildhaft und wörtlich mit „Finsternis“ wiedergegeben.
  alternative: „das Böse“ oder „die Finsternis der Sünde“
  rationale: Die Metapher bleibt in ihrer theologischen Weite erhalten und wird nicht auf eine einzelne Deutung verengt.
- issue: Referenz von ἀδελφός
  choice: Im Haupttext steht entsprechend der maskulinen Singularform „Bruder“; eine Fußnote weist auf die mögliche umfassendere Referenz hin.
  alternative: „Bruder oder Schwester“ oder „Glaubensgeschwister“
  rationale: So bleiben Form und gemeinschaftsbezogener Sinn des Ausgangstextes sichtbar, ohne weibliche Mitglieder der Glaubensgemeinschaft als mögliche Referenten auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die johanneische Wiederholung von „in der Finsternis“ und die Wegmetaphorik bleiben erhalten. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, den die Anmerkung erläutert.
