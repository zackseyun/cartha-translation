  source_fidelity: Der Entwurf gibt κόσμος, ἐπιθυμία, den Gegensatz mit δέ sowie μένει εἰς τὸν αἰῶνα sachgerecht wieder. Die Formulierung »mit ihrem Begehren« kann zwar begleitend verstanden werden, bildet aber die zweite mit καί koordinierte Aussage weniger eindeutig ab als eine explizite Parallele.
  naturalness: Der Text ist überwiegend natürliches modernes Standarddeutsch mit angemessen würdigem Ton. »Und mit ihr ihr Begehren« macht den parallelen Verfall von Welt und Begehren klar und bleibt idiomatisch.
  terminology: »Welt«, »Begehren«, »Wille Gottes«, »bleibt« und »in Ewigkeit« sind treffend. Die Fußnotenalternative »verweilt« für μένω ist hier nicht geeignet, weil sie im Deutschen gewöhnlich ein zeitweiliges Aufenthalten nahelegt und damit die Dauerhaftigkeit abschwächen kann.
