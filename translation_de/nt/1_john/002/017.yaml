    rationale: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ sagt, dass sowohl die Welt als auch ihr Begehren vergehen. »Die Welt vergeht mit ihrem Begehren« ist möglich, kann jedoch auch eine bloße Begleitumstands- oder Mittelrelation suggerieren. »Und mit ihr ihr Begehren« stellt die gemeinte Parallelität deutlich her.
  - severity: medium
