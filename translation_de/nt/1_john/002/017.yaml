revisions:
- from: Und die Welt vergeht mit ihrem Begehren[a]; wer aber den Willen Gottes tut, bleibt in Ewigkeit.[b]
  to: Und die Welt vergeht, und mit ihr ihr Begehren; wer aber den Willen Gottes tut, bleibt in Ewigkeit.[a]
  rationale: Die Revision macht die im Griechischen durch καί ausgedrückte Aussage deutlich, dass auch das Begehren der Welt vergeht. Die Fußnote zu μένω wird zugleich von der missverständlichen Alternative »verweilt« bereinigt. Eine Fußnote zu »Begehren« ist nicht erforderlich, da der Haupttext den breiten negativen Sinn im Kontext angemessen wiedergibt.
