source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: de
  text: Und die Welt vergeht, und mit ihr ihr Begehren; wer aber den Willen Gottes tut, bleibt in Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Bleibt« gibt ein in den johanneischen Schriften wichtiges Verb wieder, das auch mit »besteht« oder »bleibend ist« umschrieben werden kann. Gemeint ist hier dauerhafter Bestand.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: die Welt
  rationale: Die übliche und bewusst weit gefasste Wiedergabe passt zum unmittelbaren Zusammenhang in 1 Joh 2,15–16. Dort bezeichnet »Welt« besonders die von Gott abgewandte menschliche Lebensordnung, ohne dass die Übersetzung den Ausdruck unnötig verengt.
- source_word: παράγεται
  choice: vergeht
  rationale: Das deutsche Präsens bezeichnet hier natürlich den bereits stattfindenden Vorgang und bewahrt den Gedanken der Vergänglichkeit.
- source_word: ἐπιθυμία αὐτοῦ
  choice: ihr Begehren
  rationale: »Begehren« gibt die starke, im Kontext fehlgeleitete Ausrichtung der Welt wieder, ohne den Ausdruck auf sexuelles Verlangen zu beschränken. Das Possessivpronomen bezieht sich auf »die Welt«.
- source_word: ὁ δὲ ποιῶν
  choice: wer aber … tut
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet jeden Menschen, dessen Handeln dadurch gekennzeichnet ist, dass er Gottes Willen tut. »Wer« ist im heutigen Deutsch natürlich und bewahrt den allgemeinen Sinn.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: den Willen Gottes
  rationale: Die formnahe und geläufige Wendung erhält das theologische Gewicht von θέλημα und bezeichnet Gottes gewollte Absicht beziehungsweise Weisung.
- source_word: μένει
  choice: bleibt
  rationale: »Bleibt« ist die natürliche deutsche Entsprechung des für die johanneischen Schriften wichtigen Verbs μένω und bezeichnet fortdauernden Bestand.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste Wendung drückt in diesem Zusammenhang unbegrenzte Dauer aus. »In Ewigkeit« ist würdig, verständlich und weniger umgangssprachlich als »für immer«.
theological_decisions:
- issue: Bedeutung von κόσμος im johanneischen Zusammenhang
  choice: »die Welt« als vergängliche, von Gott abgewandte menschliche Lebensordnung
  alternative: die physische Schöpfung als solche
  rationale: Der unmittelbare Zusammenhang bestimmt die Welt durch ihr Begehren und ihren Hochmut. Der Haupttext behält dennoch den offenen Ausdruck »die Welt« bei, statt die theologische Deutung erklärend in die Übersetzung einzubauen.
- issue: Aussage von μένει εἰς τὸν αἰῶνα
  choice: Der Mensch, der Gottes Willen tut, hat bleibenden Bestand in Ewigkeit.
  alternative: Eine ausdrücklich ausgeführte Lehraussage über das ewige Leben
  rationale: Der griechische Text behauptet dauerhaftes Bleiben, erläutert aber an dieser Stelle weder dessen Grundlage noch seinen genauen Modus. Die Übersetzung bewahrt diese Dichte, ohne zusätzliche dogmatische Kategorien einzutragen.
- issue: Verhältnis von Tun und bleibendem Bestand
  choice: Der im Text gesetzte Gegensatz zwischen dem Tun des Willens Gottes und dem Vergehen der Welt bleibt unkommentiert stehen.
  alternative: Das Tun ausdrücklich als Verdienst, Bedingung, Beweis oder Folge zu bestimmen
  rationale: Die Formulierung beschreibt den Handelnden, erklärt jedoch in diesem Vers nicht näher, wie sein Tun theologisch zum Bleiben in Ewigkeit steht. Diese Spannung darf die Übersetzung nicht vorentscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Begehren« wahrt den umfassenden ethischen Sinn, während »in Ewigkeit« die feierliche Dauerformel erhält. Das Semikolon macht den scharfen Gegensatz zwischen vergänglicher Welt und bleibendem Menschen deutlich.
