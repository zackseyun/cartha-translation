id: 1JN.2.10
reference: 1 John 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: de
  text: Wer seinen Bruder liebt, bleibt im Licht, und in ihm ist kein Anlass zum Stolpern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für ihn gibt es keinen Stolperstein.« Die griechische Formulierung kann entweder beschreiben, was nicht in ihm ist, oder was ihm nicht als Hindernis begegnet.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Wer … liebt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein und mit fortdauerndem Aspekt denjenigen, der liebt. Die deutsche Wer-Konstruktion ist natürlich und nicht geschlechtlich über den ausdrücklich genannten »Bruder« hinaus festgelegt.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Die grammatisch maskuline Singularform wird quellennah wiedergegeben. Im Kontext kann ein Glaubensbruder gemeint sein; diese Deutung wird jedoch nicht in den Haupttext eingetragen.
- source_word: ἐν τῷ φωτὶ
  choice: im Licht
  rationale: Die feste deutsche Wendung bewahrt das johanneische Lichtbild und dessen metaphorische Offenheit.
- source_word: μένει
  choice: bleibt
  rationale: »Bleibt« ist modernes, natürliches Deutsch und bewahrt den durativen Sinn des für Johannes wichtigen Verbs μένω.
- source_word: σκάνδαλον
  choice: Anlass zum Stolpern
  rationale: Die Formulierung erhält die Metapher eines Hindernisses beziehungsweise einer Ursache des Fallens, ohne vorschnell festzulegen, ob die Person selbst oder andere stolpern.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die formale Entsprechung bezieht das maskuline Pronomen am naheliegendsten auf den Liebenden und bewahrt zugleich die Mehrdeutigkeit des Schlussglieds.
- source_word: οὐκ ἔστιν
  choice: ist kein
  rationale: Diese idiomatische Existenzkonstruktion gibt die verneinte Aussage knapp und natürlich wieder.
theological_decisions:
- issue: Sinn und Bezug von καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: In dem Liebenden ist kein Anlass zum Stolpern.
  alternative: 'Für ihn gibt es keinen Stolperstein; beziehungsweise: In ihm ist nichts, was andere zu Fall bringt.'
  rationale: ἐν αὐτῷ kann den inneren Zustand der Person beschreiben, aber auch sinngemäß das bezeichnen, was ihr als Hindernis begegnet. Der Haupttext bleibt eng an der griechischen Form; die Fußnote erhält die alternative Deutung, ohne die ethische beziehungsweise theologische Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die johanneischen Leitbegriffe »lieben«, »bleiben« und »Licht« werden klar und konkordant wiedergegeben; die Schlussmetapher bleibt bewusst offen.
