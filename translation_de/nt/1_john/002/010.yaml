  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und die zentralen Lexeme des griechischen Textes treffend wieder: das generische Partizip mit „Wer“, ἀδελφόν mit „seinen Bruder“, ἐν τῷ φωτί mit „im Licht“ und μένει mit „bleibt“. „In ihm ist kein Anlass zum Stolpern“ bewahrt die Wortstellung sowie die syntaktische und semantische Offenheit von σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν.'
