id: 1JN.2.14
reference: 1 John 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: de
  text: Ich habe euch geschrieben[a], Kinder, weil ihr den Vater erkannt habt. Ich habe euch geschrieben, Väter, weil ihr den erkannt habt, der von Anfang an ist[b]. Ich habe euch geschrieben, junge Männer, weil ihr stark seid und das Wort Gottes in euch bleibt[c] und ihr den Bösen überwunden habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich schrieb euch“; entsprechend auch bei den beiden weiteren Vorkommen in diesem Vers.'
    reason: lexical_alternative
  - marker: b
    text: „Der von Anfang an ist“ bezeichnet im johanneischen Sprachgebrauch wahrscheinlich den präexistenten Sohn; der Vers nennt den Gemeinten jedoch nicht ausdrücklich.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „in euch wohnt“ beziehungsweise „in euch verweilt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: ich habe euch geschrieben
  rationale: Das deutsche Perfekt gibt die abgeschlossene Handlung mit ihrer gegenwärtigen Bedeutung im Briefzusammenhang natürlich wieder; das Präteritum bleibt als mögliche Wiedergabe in einer Fußnote erhalten.
- source_word: παιδία
  choice: Kinder
  rationale: Die Anrede bewahrt das familiäre Bild, ohne durch „liebe“ oder „meine“ eine im griechischen Wortlaut nicht ausdrücklich vorhandene Nuance hinzuzufügen.
- source_word: ἐγνώκατε
  choice: ihr habt erkannt
  rationale: Das Perfekt bezeichnet eine erlangte und fortbestehende Erkenntnis. „Erkannt habt“ wahrt diesen Aspekt besser als ein bloßes „kennt“.
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: Im johanneischen Zusammenhang ist dies eine Gottesbezeichnung; die Großschreibung entspricht dem deutschen Gebrauch.
- source_word: πατέρες
  choice: Väter
  rationale: Die direkte Wiedergabe erhält die dreigliedrige Anrede und legt sie nicht vorschnell ausschließlich als Alters- oder Reifegruppe aus.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: den, der von Anfang an ist
  rationale: Die Formulierung bewahrt den ungenannten persönlichen Bezug und ergänzt nur das im Deutschen notwendige Verb, ohne den Gemeinten ausdrücklich als Christus oder den Sohn zu benennen.
- source_word: νεανίσκοι
  choice: junge Männer
  rationale: Dies gibt die maskuline Pluralform genau wieder und erhält den Gegensatz zu „Väter“ und „Kinder“.
- source_word: ἰσχυροί
  choice: stark
  rationale: „Stark“ ist im geistlich-moralischen Zusammenhang die direkte und natürliche Entsprechung.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die vertraute Formulierung lässt offen, ob Gottes Botschaft allgemein oder besonders die verkündigte Heilsbotschaft gemeint ist.
- source_word: μένει
  choice: bleibt
  rationale: „Bleibt“ ist modernes, natürliches Deutsch und bewahrt die für Johannes wichtige Vorstellung eines fortdauernden Verbleibens.
- source_word: νενικήκατε
  choice: ihr habt besiegt
  rationale: Das Perfekt bezeichnet einen errungenen Sieg mit fortbestehender Bedeutung. „Besiegt habt“ ist im Deutschen klar und idiomatisch.
- source_word: τὸν πονηρόν
  choice: den Bösen
  rationale: Artikel und maskuline Form sprechen für einen persönlichen Gegenspieler statt für das Böse als abstrakte Macht.
theological_decisions:
- issue: Bezug von „der von Anfang an ist“
  choice: Der Bezug bleibt unausgesprochen.
  alternative: Ausdrückliche Identifikation als Christus beziehungsweise der Sohn oder allgemein als Gott.
  rationale: Der johanneische Sprachgebrauch legt wahrscheinlich den präexistenten Sohn nahe, doch der griechische Vers nennt ihn nicht ausdrücklich. Die Übersetzung erhält diese Offenheit.
- issue: Geschlecht und mögliche Bildhaftigkeit der angeredeten Gruppen
  choice: παιδία wird mit „Kinder“, πατέρες und νεανίσκοι werden mit „Väter“ und „junge Männer“ wiedergegeben.
  alternative: Alle drei Bezeichnungen geschlechtsneutral oder ausschließlich als geistliche Reifestufen wiederzugeben.
  rationale: Der griechische Text verwendet bei den letzten beiden Gruppen maskuline Ausdrücke. Die genaue Wiedergabe bewahrt sowohl die sprachliche Form als auch die Möglichkeit einer metaphorischen oder repräsentativen Verwendung.
- issue: Persönliches oder abstraktes Verständnis von τὸν πονηρόν
  choice: „den Bösen“ als persönliche Bezeichnung.
  alternative: „das Böse“ als abstrakte Macht.
  rationale: Die substantivierte maskuline Form mit Artikel weist hier am ehesten auf den persönlichen bösen Gegenspieler hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die dreifache Satzstruktur des Griechischen bleibt erhalten. Wiederholungen werden nicht geglättet, und theologisch bedeutsame Mehrdeutigkeiten werden nicht im Haupttext aufgelöst.
