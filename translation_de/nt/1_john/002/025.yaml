source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: de
  text: 'Und das ist die Verheißung, die er selbst uns verheißen hat: das ewige Leben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das betonte „er selbst“ kann sich im Zusammenhang auf den Vater oder auf den Sohn beziehen; der Vers nennt den Bezug nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὕτη ἐστὶν
  choice: Und das ist
  rationale: Die Formulierung nimmt den vorherigen Gedankengang auf und führt unmittelbar den Inhalt der Verheißung ein.
- source_word: ἡ ἐπαγγελία … ἐπηγγείλατο
  choice: die Verheißung … verheißen hat
  rationale: Die verwandten deutschen Wörter bewahren die im Griechischen beabsichtigte Verbindung zwischen Substantiv und Verb. Die leichte Wiederholung entspricht der Ausdrucksweise des Ausgangstextes.
- source_word: αὐτός
  choice: er selbst
  rationale: Das betonte Pronomen wird ausdrücklich wiedergegeben, ohne seinen im Vers nicht genannten Bezug festzulegen.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der Verheißung und lässt sich im Deutschen natürlich mit „uns“ wiedergeben.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: das ewige Leben
  rationale: Die Akkusativphrase erläutert als Apposition den Inhalt der Verheißung. Der bestimmte Artikel wird im Deutschen natürlich beibehalten.
theological_decisions:
- issue: Bezug von αὐτός („er selbst“)
  choice: Der Bezug bleibt mit „er selbst“ offen.
  alternative: Ausdrückliche Festlegung auf den Vater oder auf den Sohn.
  rationale: Der griechische Vers nennt den Bezug des Pronomens nicht erneut. Daher wird die mögliche Spannung im Zusammenhang bewahrt und nicht durch eine ergänzte Benennung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusste Wiederholung „Verheißung … verheißen“ folgt der griechischen Wortverwandtschaft; „das ewige Leben“ ist idiomatisch und bewahrt die Bestimmtheit des Ausdrucks.
