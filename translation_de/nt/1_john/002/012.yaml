base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: de
  text: Ich schreibe[a] euch, meine Kinder, weil[b] euch eure Sünden vergeben sind um seines Namens willen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Präsens kann im Briefzusammenhang den gegenwärtigen Schreibakt hervorheben. Im Deutschen gibt „Ich schreibe“ diese Nuance idiomatisch wieder.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „dass“. Das griechische Wort kann hier den Inhalt des Schreibens einleiten, bezeichnet aber wahrscheinlich dessen Grund.'
    reason: alternative_reading
  - marker: c
    text: Worauf sich „seines“ bezieht, kann aus dem Zusammenhang als Gott oder als Jesus verstanden werden; der griechische Wortlaut lässt den Bezug unausgesprochen.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: Ich schreibe
  rationale: Das griechische Präsens bezeichnet hier natürlich den gegenwärtigen Schreibakt; das deutsche einfache Präsens gibt dies idiomatisch wieder.
- source_word: τεκνία
  choice: meine Kinder
  rationale: Die Anrede ist liebevoll und familiär, nicht primär eine Altersangabe. „Meine Kinder“ vermittelt die Zuneigung im heutigen Deutsch natürlicher als „Kindlein“ oder „kleine Kinder“.
- source_word: ὅτι
  choice: weil
  rationale: Im Zusammenhang führt ὅτι am ehesten den Grund für das Schreiben an. Die mögliche Inhaltslesart „dass“ bleibt in einer Fußnote erhalten.
- source_word: ἀφέωνται
  choice: vergeben sind
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Vergebung mit fortdauerndem Ergebnis. „Vergeben sind“ drückt im Deutschen den bestehenden Zustand knapp und natürlich aus.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: euch die Sünden
  rationale: Die Dativkonstruktion wird formal bewahrt und bleibt im Deutschen verständlich; gemeint sind die Sünden der Angesprochenen.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: um seines Namens willen
  rationale: διά mit Akkusativ bezeichnet hier Grund beziehungsweise Grundlage. Die traditionelle, weiterhin verständliche Wendung bewahrt das biblische Gewicht von „Name“, ohne es auf „Ruf“ zu verengen.
theological_decisions:
- issue: Bezug von αὐτοῦ („seines“)
  choice: Das Pronomen bleibt im Haupttext ohne ausdrückliche Identifikation.
  alternative: „Gottes“ oder „Jesu Christi“
  rationale: Der unmittelbare Wortlaut nennt den Bezug nicht ausdrücklich. Die Mehrdeutigkeit zwischen Gott und Jesus wird daher nicht stillschweigend aufgelöst.
- issue: Funktion von ὅτι
  choice: 'kausal: „weil“'
  alternative: 'inhaltlich: „dass“'
  rationale: Der Aufbau des Abschnitts legt eine Begründung für das Schreiben nahe; grammatisch ist jedoch auch eine Inhaltseinleitung möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Meine Kinder“ wahrt den liebevollen Ton der Anrede ohne das veraltete „Kindlein“. „Um seines Namens willen“ ist leicht gehoben, aber geläufig und erhält die biblische Ausdrucksweise.
