id: 1JN.2.9
reference: 1 John 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: de
  text: Wer sagt, er sei im Licht, und seinen Bruder hasst, ist bis jetzt in der Finsternis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Bruder oder seine Schwester“. Das griechische Wort steht in der männlichen Einzahl („Bruder“), kann in diesem ethischen Zusammenhang aber repräsentativ gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Wer sagt
  rationale: Der substantivierte Partizipialausdruck bezeichnet allgemein eine Person. „Wer sagt“ ist im Deutschen natürlich und bewahrt den repräsentativen Charakter.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: er sei im Licht
  rationale: Nach „sagt“ gibt der Konjunktiv der indirekten Rede die Behauptung natürlich wieder; „im Licht“ erhält die johanneische Bildsprache.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Die maskuline Singularform wird lexikalisch genau wiedergegeben, ohne den möglichen Bezug auf Glaubensgeschwister im Haupttext vorwegzunehmen.
- source_word: μισῶν
  choice: hasst
  rationale: Das Präsens bringt eine gegenwärtige beziehungsweise kennzeichnende Haltung idiomatisch zum Ausdruck.
- source_word: ἐν τῇ σκοτίᾳ
  choice: in der Finsternis
  rationale: „Finsternis“ wahrt den würdevollen Ton und den begrifflichen Gegensatz zu „Licht“.
- source_word: ἕως ἄρτι
  choice: bis jetzt
  rationale: Die Wendung bezeichnet das Fortbestehen des Zustands bis zur Gegenwart und wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφός in einer repräsentativen ethischen Aussage
  choice: Bruder
  alternative: Bruder oder seine Schwester; Glaubensgeschwister
  rationale: „Bruder“ bewahrt Form und relationale Bildwelt des griechischen Textes. Da ἀδελφός in diesem Zusammenhang auch repräsentativ beziehungsweise einschließlich gebraucht sein kann, wird dies in einer Fußnote kenntlich gemacht, ohne den Haupttext interpretierend einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gegenüberstellung von Licht und Finsternis sowie die Spannung zwischen behauptetem und tatsächlichem Zustand bleiben erhalten.
