  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: de
  text: 'Was euch betrifft: Was ihr von Anfang an gehört habt,[a] soll in euch bleiben. Wenn in euch bleibt, was ihr von Anfang an gehört habt, dann werdet auch ihr im Sohn und im Vater bleiben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung bleibt im Griechischen allgemein; dem Zusammenhang nach bezieht sie sich wahrscheinlich auf die ursprüngliche Verkündigung über den Sohn.
    reason: lexical_alternative
  - marker: b
    text: „Bleiben“ gibt in allen drei Fällen dieses Verses dasselbe griechische Verb wieder; traditionell auch „bleiben“ im Sinne von „verweilen“ oder „verbunden bleiben“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Was euch betrifft
  rationale: Das vorangestellte Pronomen ist kontrastiv hervorgehoben und markiert das Thema; die Wendung gibt dies im Deutschen natürlich wieder.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: was ihr von Anfang an gehört habt
  rationale: Das substantivierte neutrale Relativpronomen bleibt bewusst allgemein; »Botschaft« wäre eine plausible, aber erklärende Präzisierung.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Die feste johanneische Wendung wird unmittelbar und mit ihrer möglichen theologischen Resonanz wiedergegeben.
- source_word: ἐν ὑμῖν μενέτω
  choice: soll in euch bleiben
  rationale: Der Imperativ fordert fortdauerndes Bleiben. Die Konstruktion mit »soll« ist würdig und im modernen Deutsch natürlicher als ein vorangestelltes »Lasst … bleiben« bei einem nicht persönlich gedachten Subjekt.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Wenn in euch bleibt
  rationale: Die Bedingung wird klar wiedergegeben; zugleich bleibt die Wiederholung desselben Verbs wie im übrigen Vers erhalten.
- source_word: καὶ ὑμεῖς
  choice: dann werdet auch ihr
  rationale: »auch ihr« bewahrt sowohl das καί als auch die ausdrückliche Hervorhebung des Pronomens; »dann« verdeutlicht idiomatisch die Folge der Wenn-Konstruktion.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: in dem Sohn und in dem Vater
  rationale: Die Wiederholung von ἐν wird bewahrt, um die parallele Beziehung zum Sohn und zum Vater abzubilden.
- source_word: μενεῖτε
  choice: werdet … bleiben
  rationale: Das Futur wird direkt wiedergegeben und die lexikalische Verbindung zu den beiden vorangehenden Formen von μένω erhalten.
theological_decisions:
- issue: Art der bedingten Aussage im Schlusssatz
  choice: Das Futur wird als »werdet … bleiben« wiedergegeben, ohne die Aussage systematisch-theologisch als bloße Aufforderung, Heilsgewissheit oder bestimmte Lehre vom Beharren auszudeuten.
  alternative: Die Schlussaussage als Aufforderung oder als ausdrücklichen Lehrsatz über das Beharren interpretieren.
  rationale: Der griechische Text verbindet das Bleiben im Sohn und Vater bedingt mit dem Bleiben des ursprünglich Gehörten in den Adressaten. Diese Spannung soll bestehen bleiben.
- issue: Bezug von »was ihr von Anfang an gehört habt«
  choice: Die offene Formulierung des Relativpronomens bleibt im Haupttext erhalten.
  alternative: Im Haupttext »die Botschaft«, »das Evangelium« oder »die apostolische Verkündigung« einsetzen.
  rationale: Der Kontext legt die ursprüngliche Verkündigung über den Sohn nahe, doch der griechische Wortlaut benennt sie nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von »bleiben« sowie die parallele Formulierung »in dem Sohn und in dem Vater« wurden bewusst erhalten. Der Fußnotenmarker steht am Versende, weil die Anmerkung sowohl die Verbwiederholung als auch den offen gehaltenen Bezug des Gehörten erläutert.
