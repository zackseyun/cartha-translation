id: 1JN.2.2
reference: 1 John 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: de
  text: Und er selbst ist das Sühnopfer für unsere Sünden[a], und nicht nur für unsere, sondern auch für die der ganzen Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sühne für unsere Sünden“. Der Ausdruck kann sowohl die Beseitigung von Schuld als auch die Abwendung von Zorn einschließen.'
    reason: lexikalische Alternative und Bewahrung der theologischen Bedeutungsbreite von ἱλασμός
lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Die intensivierende Verwendung von αὐτός wird ausdrücklich wiedergegeben und hebt Christi persönliche Rolle hervor.
- source_word: ἱλασμός
  choice: Sühnopfer
  rationale: Das Wort bezeichnet hier das Mittel bzw. Opfer der Sühne. „Sühnopfer“ ist im Deutschen prägnant und verständlich, ohne die umstrittenen Aspekte der Abwendung von Zorn oder der Beseitigung von Schuld einseitig festzulegen.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: für unsere Sünden
  rationale: In Verbindung mit ἱλασμός gibt „für“ die Beziehung zu den Sünden idiomatisch und sachgerecht wieder.
- source_word: τῶν ἡμετέρων
  choice: für unsere
  rationale: Das substantivierte Possessivpronomen bezieht sich elliptisch auf die zuvor genannten Sünden; die knappe deutsche Form bewahrt diese Struktur.
- source_word: ὅλου τοῦ κόσμου
  choice: der ganzen Welt
  rationale: Die Formulierung bewahrt die umfassende Aussage des griechischen Textes, ohne ihren Geltungsbereich theologisch einzuengen.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: nicht nur ... sondern auch
  rationale: Diese geläufige deutsche Korrelativkonstruktion entspricht dem griechischen Gegensatz und liest sich natürlich.
theological_decisions:
- issue: Bedeutungsumfang von ἱλασμός
  choice: Sühnopfer im Haupttext, mit Bedeutungsnuancen in der Fußnote
  alternative: Sühne; Versöhnung; Opfer zur Wegnahme der Schuld oder zur Abwendung des Zorns
  rationale: Der Haupttext bleibt zugänglich und wahrt zugleich die genuine lexikalisch-theologische Spannung, statt eine einzelne Sühnetheorie festzuschreiben.
- issue: Umfang von „die ganze Welt“
  choice: Die volle Wendung bleibt uneingeschränkt stehen
  alternative: Menschen aus aller Welt; die Erwählten in aller Welt
  rationale: Der griechische Text enthält diese Einschränkungen nicht. Die Übersetzung bewahrt daher seine Weite und löst die daraus entstehende theologische Spannung nicht konfessionell auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sühnopfer“ ist ein etablierter, noch verständlicher theologischer Begriff; die Fußnote erläutert seine Bedeutungsbreite. Die Ergänzung „die“ vor „der ganzen Welt“ macht im Deutschen den elliptischen Bezug auf die Sünden eindeutig, ohne den Sinn auszuweiten.
