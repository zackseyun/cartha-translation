  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: de
  text: Denn alles, was in der Welt ist – das Verlangen[a] des Fleisches[b], das Verlangen der Augen und der Hochmut des Lebens[c] –, stammt nicht vom Vater, sondern von der Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Begierde“. Das griechische Wort kann starkes Verlangen, Begehren oder Begierde bezeichnen. „Verlangen“ ist hier gewählt, damit der Sinn nicht auf sexuelles Begehren eingeengt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der sündigen menschlichen Natur“. „Fleisch“ kann hier bildlich die von der Sünde geprägte menschliche Natur bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „der prahlerische Stolz auf den Lebensunterhalt oder Besitz“. Das griechische Wort für „Leben“ kann hier auch Lebensunterhalt und damit Besitz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aufforderung ein und bewahrt die kausale Verknüpfung.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: alles, was in der Welt ist
  rationale: Gibt die kollektiv gebrauchte neutrale Singularform umfassend und in natürlichem Deutsch wieder.
- source_word: κόσμος
  choice: Welt
  rationale: Bewahrt den bewusst weit gefassten johanneischen Begriff, ohne ihn deutend zu einem „Weltsystem“ zu verengen.
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Bezeichnet hier ein starkes, im Kontext fehlgeleitetes Begehren; „Verlangen“ wahrt die Breite des Ausdrucks und beschränkt ihn nicht auf Sexualität.
- source_word: σάρξ
  choice: Fleisch
  rationale: Die formnahe Wiedergabe erhält die bildhafte und theologisch vielschichtige Ausdrucksweise, statt sie vorschnell als „sündige Natur“ auszulegen.
- source_word: ὀφθαλμοί
  choice: Augen
  rationale: Entspricht dem griechischen Plural und bildet die parallele Wendung natürlich ab.
- source_word: ἀλαζονεία
  choice: Hochmut
  rationale: Erfasst überhebliche Selbstgeltung; eine Fußnote weist zusätzlich auf den möglichen Aspekt prahlerischer Selbstdarstellung hin.
- source_word: βίος
  choice: Leben
  rationale: Bewahrt die Mehrdeutigkeit zwischen Lebensführung, Lebensunterhalt und Besitzmitteln, die eine engere Wiedergabe auflösen würde.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: stammt nicht vom Vater, sondern von der Welt
  rationale: „Stammt“ macht den durch ἐκ bezeichneten Ursprung idiomatisch deutlich und erhält den scharfen Parallelkontrast.
theological_decisions:
- issue: Bedeutung von σάρξ in der moralisch geprägten Aufzählung
  choice: Fleisch
  alternative: sündige menschliche Natur
  rationale: „Fleisch“ lässt die anthropologische Aussage offen und erhält die Spannung des griechischen Bildes; die mögliche übertragene Bedeutung wird nur in der Fußnote genannt.
- issue: Bedeutung von κόσμος
  choice: Welt
  alternative: gottfeindliche Weltordnung
  rationale: Der Kontext legt eine dem Vater entgegengesetzte Ordnung nahe, doch die Übersetzung übernimmt keine erklärende Systematisierung, die über den Wortlaut hinausgeht.
- issue: Deutung von ἀλαζονεία τοῦ βίου
  choice: Hochmut des Lebens
  alternative: Prahlen mit Besitz und Lebensstellung
  rationale: Die formnahe Wendung bewahrt, dass βίος Lebensweise, Lebensunterhalt oder Besitzmittel meinen kann, und legt die genaue Reichweite nicht im Haupttext fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche gliedern die dreiteilige Erläuterung, ohne den Satzfluss zu unterbrechen. Wiederholungen wie „Verlangen“ sowie der Kontrast „vom Vater … von der Welt“ sind bewusst erhalten.
