id: 1JN.2.7
reference: 1 John 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: de
  text: Ihr Lieben, ich schreibe euch kein neues Gebot, sondern ein altes Gebot, das ihr von Anfang an habt. Das alte Gebot ist die Botschaft[a], die ihr gehört habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „das Wort“: „Das alte Gebot ist das Wort, das ihr gehört habt.“'
    reason: Lexikalische Alternative für λόγος; „Wort“ ist formaler und bewahrt mögliche johanneische Anklänge, klingt hier im modernen Deutsch jedoch weniger unmittelbar als „Botschaft“.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ihr Lieben
  rationale: Die substantivierte Anrede gibt den liebevollen, pastoralen Ton natürlich wieder und bewahrt im Deutschen die erkennbare Verbindung zum Wortfeld der Liebe.
- source_word: ἐντολήν
  choice: Gebot
  rationale: „Gebot“ ist die geläufige und theologisch gewichtige deutsche Entsprechung und erhält den johanneischen Sprachgebrauch.
- source_word: καινήν
  choice: neu
  rationale: Die direkte Entsprechung wahrt den ausdrücklichen Gegensatz zu παλαιάν („alt“), ohne eine zusätzliche Nuance wie „neuartig“ einzutragen.
- source_word: γράφω
  choice: ich schreibe
  rationale: Das deutsche Präsens entspricht dem griechischen Präsens und ist im Briefstil natürlich.
- source_word: παλαιάν / παλαιά
  choice: alt / alte
  rationale: Die Wiedergabe erhält den unmittelbaren Gegensatz zu „neu“ und die Wiederholung des griechischen Textes.
- source_word: εἴχετε
  choice: habt
  rationale: Das deutsche Präsens mit „von Anfang an“ bringt den seit früher bestehendenden und weiterhin geltenden Besitz natürlich zum Ausdruck; „hattet“ könnte fälschlich nahelegen, das Gebot gelte oder bestehe für die Adressaten nicht mehr.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Die charakteristische johanneische Formulierung bleibt erhalten, ohne näher festzulegen, welcher Anfang gemeint ist.
- source_word: λόγος
  choice: Botschaft
  rationale: Hier bezeichnet λόγος den gehörten Mitteilungs- oder Verkündigungsinhalt. „Botschaft“ ist im heutigen Deutsch klar; die formalere Alternative „Wort“ wird in der Fußnote dokumentiert.
- source_word: ἠκούσατε
  choice: die ihr gehört habt
  rationale: Das Perfekt ist im Deutschen in diesem Relativsatz idiomatisch und gibt den abgeschlossenen Empfang der Botschaft wieder.
theological_decisions:
- issue: Bezug von „von Anfang an“
  choice: Die offene Formulierung „von Anfang an“ bleibt ohne nähere Bestimmung stehen.
  alternative: „seit dem Anfang eures Glaubenslebens“ oder „seit dem Beginn der Evangeliumsverkündigung“
  rationale: Der unmittelbare Zusammenhang legt den Anfang der Unterweisung der Adressaten nahe, doch der griechische Text legt diesen Bezug nicht ausdrücklich fest.
- issue: Gleichsetzung des alten Gebots mit dem gehörten λόγος
  choice: Das alte Gebot wird ohne erklärende Erweiterung mit der gehörten „Botschaft“ gleichgesetzt.
  alternative: Eine erläuternde Harmonisierung mit dem Liebesgebot oder mit dem Evangelium.
  rationale: Die knappe Gleichsetzung des griechischen Textes soll in ihrer theologischen Spannung stehen bleiben und nicht durch Kontextwissen aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit warmer brieflicher Anrede. Die Wiederholung von „Gebot“ und „altes Gebot“ folgt bewusst der rhetorischen Struktur des griechischen Textes. Der Fußnotenmarker [a] steht unmittelbar bei „Botschaft“, auf die sich die lexikalische Alternative bezieht.
