  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: de
  text: Ich habe euch nicht geschrieben[a], weil ihr die Wahrheit nicht kennt, sondern weil ihr sie kennt und weil keine Lüge aus der Wahrheit stammt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formnäher: „Ich schrieb euch nicht.“ Der griechische Aorist kann als einfache Vergangenheit wiedergegeben werden; das Perfekt entspricht im Deutschen natürlich der Situation eines Briefes, der den Empfängern nun vorliegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: habe … geschrieben
  rationale: Der griechische Aorist bezeichnet hier den Schreibakt. Das deutsche Perfekt ist in einem gegenwärtig vorliegenden Brief natürlich; das Präteritum bleibt als formnähere Möglichkeit in der Fußnote erhalten.
- source_word: οἴδατε
  choice: ihr … kennt
  rationale: οἶδα bedeutet hier „kennen/wissen“. Da sich das Verb auf „die Wahrheit“ bezieht, ist „die Wahrheit kennen“ im Deutschen idiomatisch und bewahrt den scharfen Gegensatz zwischen Nichtkennen und Kennen.
- source_word: τὴν ἀλήθειαν / τῆς ἀληθείας
  choice: die Wahrheit / aus der Wahrheit
  rationale: Der bestimmte Artikel wird beibehalten. Die offene, theologisch gewichtige Formulierung des Johannes wird nicht zu „wahre Botschaft“ oder „Evangelium“ verengt.
- source_word: πᾶν ψεῦδος … οὐκ ἔστιν
  choice: keine Lüge … stammt
  rationale: Die Verbindung von πᾶν mit der Verneinung wird im Deutschen idiomatisch als universale Verneinung „keine Lüge“ wiedergegeben.
- source_word: ἐκ τῆς ἀληθείας
  choice: aus der Wahrheit stammt
  rationale: ἐκ bezeichnet Herkunft oder Ursprung. „Aus der Wahrheit stammt“ ist natürliches, präzises Deutsch und erhält die Aussage über den Ursprung der Lüge.
theological_decisions:
- issue: Bedeutungsumfang von „die Wahrheit“ im johanneischen Sprachgebrauch
  choice: die Wahrheit
  alternative: die wahre Botschaft; die Wahrheit des Evangeliums
  rationale: Der Vers selbst legt keine engere Umschreibung fest. Die wörtlich offene Form bewahrt den theologischen Bedeutungsreichtum, ohne ihn konfessionell auszudeuten.
- issue: Verhältnis der Lüge zur Wahrheit
  choice: keine Lüge stammt aus der Wahrheit
  alternative: keine Lüge ist aus der Wahrheit; alles Lügenhafte ist nicht aus der Wahrheit
  rationale: Die Übersetzung gibt ἐκ als Herkunftsangabe wieder und bewahrt den absoluten Gegensatz, ohne daraus eine weitergehende metaphysische Aussage zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „weil“ und „kennt“ bleibt erhalten, um die argumentierende Struktur und den deutlichen Gegensatz des griechischen Textes sichtbar zu machen.
