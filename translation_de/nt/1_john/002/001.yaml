  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes sachgerecht wieder: die liebevolle Anrede, den Zweck des Schreibens, die reale Bedingung einer möglichen Sünde, παράκλητος im Kontext der Beziehung zum Vater sowie die abschließende Charakterisierung Jesu als Messias und Gerechter. „Beim Vater“ ist für πρὸς τὸν πατέρα im gegebenen Kontext idiomatisch und angemessen.'
  naturalness: 'Modernes Standarddeutsch mit würdigem, gut verständlichem Register. Die Konstruktion „einen Fürsprecher: Jesus, den Messias, den Gerechten“ ist bewusst knapp und markiert die griechischen Akkusativ-Appositionen; sie ist trotz ihrer leicht gehobenen biblischen Prägung grammatisch und stilistisch tragfähig.'
  terminology: „Fürsprecher“ trifft die hier naheliegende vertretende bzw. fürbittende Bedeutung von παράκλητος. „Messias“ macht den Titel Χριστός transparent, während die Fußnote die traditionelle Wiedergabe „Jesus Christus“ korrekt dokumentiert. „den Gerechten“ gibt δίκαιον als hervorgehobene substantivische Charakterisierung angemessen wieder.
