id: 1JN.2.1
reference: 1 John 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: de
  text: 'Meine Kinder, ich schreibe euch dies, damit ihr nicht sündigt. Doch wenn jemand sündigt, haben wir beim Vater einen Fürsprecher[a]: Jesus, den Messias[b], den Gerechten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort παράκλητος kann je nach Zusammenhang auch „Beistand“, „Helfer“ oder „Anwalt“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „Jesus Christus“. Der griechische Titel Χριστός bedeutet „Messias“, kann aber auch namensähnlich als „Christus“ gebraucht werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Meine Kinder
  rationale: Τεκνία ist eine liebevolle, familiäre Anrede. „Meine Kinder“ bewahrt sowohl das Zugehörigkeitsverhältnis als auch den warmen seelsorgerlichen Ton; „meine kleinen Kinder“ wäre im heutigen Deutschen leicht missverständlich oder unnötig verniedlichend.
- source_word: ταῦτα γράφω ὑμῖν
  choice: ich schreibe euch dies
  rationale: Die Formulierung entspricht dem Präsens γράφω und bewahrt mit „dies“ den absichtlich nicht näher bestimmten Rückverweis von ταῦτα.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: damit ihr nicht sündigt
  rationale: ἵνα mit dem Aorist Konjunktiv bezeichnet hier den Zweck des Schreibens. Die deutsche Formulierung gibt diesen Zweck wieder, ohne darüber hinaus Sündlosigkeit als bereits erreichten Zustand zu behaupten.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Doch wenn jemand sündigt
  rationale: 'καί hat im Zusammenhang eine leicht gegensätzliche Funktion: Johannes stellt dem Ziel, nicht zu sündigen, den möglichen Fall einer Sünde gegenüber. „Doch“ macht diesen Übergang natürlich kenntlich.'
- source_word: παράκλητον
  choice: Fürsprecher
  rationale: Im Zusammenhang mit dem Vater bezeichnet παράκλητος jemanden, der für einen anderen eintritt. „Fürsprecher“ bewahrt den rechtlichen und vermittelnden Anklang, ohne das Wort ausschließlich auf einen modernen Rechtsanwalt einzuengen.
- source_word: πρὸς τὸν πατέρα
  choice: beim Vater
  rationale: πρός mit Akkusativ bezeichnet hier Gegenwart und Hinwendung. „Beim Vater“ drückt den Zugang und das Eintreten in seiner Gegenwart idiomatisch aus.
- source_word: Ἰησοῦν Χριστὸν
  choice: Jesus, den Messias
  rationale: Χριστός wird hier als messianischer Titel verstanden. Die deutsche Apposition „Jesus, den Messias“ macht den Titelcharakter deutlich; die traditionelle Wiedergabe „Jesus Christus“ bleibt in einer Fußnote erhalten.
- source_word: δίκαιον
  choice: den Gerechten
  rationale: δίκαιον stimmt mit Ἰησοῦν Χριστόν überein und charakterisiert Jesus als gerecht. Die substantivische Apposition „den Gerechten“ bewahrt die knappe, hervorgehobene Form des Griechischen.
theological_decisions:
- issue: Bedeutung von Χριστός als Titel oder namensähnlicher Bestandteil
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Die appositionelle Folge mit δίκαιον lässt Χριστός hier als Titel hervortreten. „Messias“ macht dessen Bedeutung transparent; „Christus“ ist die traditionelle und ebenfalls mögliche namensähnliche Wiedergabe.
- issue: Mögliche Folgerung einer vollkommenen Sündlosigkeit aus ἵνα μὴ ἁμάρτητε
  choice: Die Zweckangabe „damit ihr nicht sündigt“ wird unverändert neben dem Bedingungssatz „wenn jemand sündigt“ stehen gelassen.
  alternative: Eine Auslegung, nach der der Satz entweder absolute Sündlosigkeit fordert oder die Aufforderung durch die Möglichkeit des Sündigens abschwächt.
  rationale: Der Vers hält das Ziel, nicht zu sündigen, und die reale Möglichkeit einer Sünde zusammen. Die Übersetzung bewahrt diese Spannung, statt sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die familiäre Anrede bleibt schlicht; „Fürsprecher“ erhält den repräsentativen und rechtlichen Anklang. Die beiden knappen Appositionen „den Messias, den Gerechten“ spiegeln die griechische Hervorhebung, ohne unnatürliche Satzstellung.
