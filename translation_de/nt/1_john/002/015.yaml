id: 1JN.2.15
reference: 1 John 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: de
  text: Liebt nicht die Welt und auch nicht das, was in der Welt ist. Wenn jemand die Welt liebt, ist die Liebe zum Vater[a] nicht in ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Liebe des Vaters“. Der griechische Ausdruck kann die Liebe zum Vater oder die vom Vater ausgehende Liebe bezeichnen; im Zusammenhang ist wahrscheinlich die Liebe zum Vater gemeint.'
    reason: alternative_reading
  - marker: b
    text: Das griechische „in ihm“ steht im maskulinen Singular, ist hier aber allgemein auf jeden Menschen bezogen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: Liebt nicht
  rationale: Der Präsensimperativ mit μή kann eine allgemeine Untersagung oder das Beenden eines bereits bestehenden Handelns ausdrücken. „Liebt nicht“ bewahrt diese Offenheit, ohne den Aspekt überzuinterpretieren.
- source_word: κόσμον
  choice: die Welt
  rationale: κόσμος bezeichnet hier im Zusammenhang die von Gott entfremdete menschliche Ordnung, nicht schlicht die Schöpfung. Die traditionelle und breite Wiedergabe „die Welt“ lässt den Kontext diesen Sinn bestimmen.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: und auch nicht das, was in der Welt ist
  rationale: Die Formulierung gibt die Erweiterung des Verbots auf alles innerhalb der Welt natürlich und eng am Griechischen wieder.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Wenn jemand … liebt
  rationale: „Jemand“ entspricht dem unbestimmten τις und erhält den allgemeinen Geltungsbereich der Bedingung.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: die Liebe zum Vater
  rationale: Der Genitiv kann grundsätzlich objektiv oder subjektiv verstanden werden. Der unmittelbare Gegensatz zwischen der Liebe zur Welt und dieser Liebe spricht am ehesten für die auf den Vater gerichtete Liebe; die alternative Deutung wird in einer Fußnote bewahrt.
- source_word: πατρὸς
  choice: der Vater
  rationale: „Der Vater“ bewahrt den johanneischen Beziehungstitel ohne die erklärende Erweiterung „Gott, der Vater“.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Das griechische Pronomen steht im generisch verwendeten maskulinen Singular. Die Wiedergabe folgt dieser Form; eine Fußnote erläutert den allgemeinen Bezug.
theological_decisions:
- issue: Bedeutung von „die Welt“ in der johanneischen Ethik
  choice: „die Welt“ ohne ausdeutenden Zusatz
  alternative: „die weltliche Ordnung“ oder „das Weltsystem“
  rationale: Gemeint ist kontextuell die Gott entgegenstehende Ordnung, nicht die Schöpfung oder die Menschen als solche. Eine wörtlich breite Wiedergabe vermeidet eine vorschnelle Verengung.
- issue: Genitiv in ἡ ἀγάπη τοῦ πατρὸς
  choice: „die Liebe zum Vater“ im Haupttext
  alternative: „die Liebe des Vaters“
  rationale: Der Gegensatz zur Liebe zur Welt legt den objektiven Genitiv, also Liebe zum Vater, nahe. Da der griechische Ausdruck auch als vom Vater ausgehende Liebe verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural und der klare Satzbau bewahren den mahnenden Ton. „Und auch nicht“ klingt natürlicher als ein steifes „noch“, ohne die koordinierende Kraft von μηδέ abzuschwächen.
