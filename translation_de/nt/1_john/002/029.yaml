  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: de
  text: Wenn ihr wisst, dass er gerecht ist,[a] erkennt ihr, dass jeder, der gerecht handelt, aus ihm geboren ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Pronomen „er“ und „ihm“ können sich auf Gott, den Vater, oder auf den Sohn beziehen; der griechische Text legt den Bezug hier nicht ausdrücklich fest.
    reason: alternative_reading
  - marker: b
    text: 'Oder als Aufforderung: „erkennt“. Die griechische Verbform kann als Aussage oder als Aufforderung verstanden werden.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Wenn ihr wisst
  rationale: Die Bedingung wird im Deutschen natürlich mit „wenn“ ausgedrückt; οἶδα bezeichnet hier ein Wissen oder Erkennen.
- source_word: δίκαιός
  choice: gerecht
  rationale: „Gerecht“ gibt den moralisch-theologischen Sinn wieder und stellt zugleich den Zusammenhang mit δικαιοσύνη her.
- source_word: γινώσκετε
  choice: dann erkennt ihr auch
  rationale: „Erkennen“ bildet den Wechsel von οἶδα zu γινώσκω ab. Im Haupttext wird die Form als Indikativ verstanden; die ebenfalls mögliche imperativische Auffassung wird in einer Fußnote genannt.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: jeder, der gerecht handelt
  rationale: Die Formulierung ist in modernem Deutsch natürlicher als „jeder, der die Gerechtigkeit tut“ und vermittelt die für das Präsenspartizip charakteristische Lebenspraxis, ohne eine sündlose Einzeltat zu behaupten.
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: aus ihm geboren ist
  rationale: „Aus ihm geboren“ bewahrt das Herkunfts- und Geburtsbild von ἐκ. Das deutsche Zustandspassiv gibt den bleibenden Zustand wieder, der aus dem griechischen Perfekt hervorgeht.
theological_decisions:
- issue: Bezug von „er/ihm“ in δίκαιός ἐστιν und ἐξ αὐτοῦ
  choice: Die Pronomen bleiben ohne ausdrückliche Benennung ihres Bezugs stehen.
  alternative: „Gott, der Vater“ oder „der Sohn“ ausdrücklich einsetzen.
  rationale: Der unmittelbare Zusammenhang lässt sowohl einen Bezug auf den Vater als auch auf den Sohn zu; der griechische Vers benennt den Bezug nicht ausdrücklich.
- issue: Indikativ oder Imperativ bei γινώσκετε
  choice: 'Indikativ: „dann erkennt ihr auch“'
  alternative: 'Imperativ: „dann erkennt auch“'
  rationale: Die Verbform kann formal Indikativ oder Imperativ sein. Der Indikativ ergibt einen stimmigen parallelen Gedankengang; die andere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gerecht handelt“ vermeidet die im heutigen Deutsch sperrige Wendung „die Gerechtigkeit tut“, erhält aber durch die Wiederholung von „gerecht“ den Zusammenhang zwischen δίκαιος und δικαιοσύνη. Die Mehrdeutigkeit des pronominalen Bezugs und der Verbform wird nicht stillschweigend aufgelöst.
