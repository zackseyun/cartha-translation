  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: de
  text: Dies habe ich euch im Hinblick auf diejenigen geschrieben, die euch in die Irre führen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die versuchen, euch in die Irre zu führen“ oder „die euch täuschen“. Das griechische Partizip bezeichnet Personen, die euch in die Irre führen; ob ihnen dies gelingt, wird nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Dies
  rationale: Das substantivisch gebrauchte „Dies“ verweist im Deutschen natürlich auf den vorausgehenden Inhalt; es gibt den griechischen sächlichen Plural sinngemäß wieder, ohne künstlich „diese Dinge“ zu formulieren.
- source_word: ἔγραψα
  choice: habe ich … geschrieben
  rationale: Das deutsche Perfekt bezeichnet die abgeschlossene Niederschrift mit fortdauernder Bedeutung für die Leser und klingt in diesem Zusammenhang natürlich.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger des Geschriebenen und wird unmittelbar mit „euch“ wiedergegeben.
- source_word: περὶ
  choice: im Blick auf
  rationale: Die Wendung bezeichnet das Thema beziehungsweise den Anlass des Schreibens und ist im modernen Deutsch klar und angemessen würdevoll.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: die euch in die Irre führen
  rationale: Die Formulierung bewahrt das Bild des Abirrens in πλανάω und gibt das aktive Präsenspartizip direkt wieder, ohne ausdrücklich festzulegen, dass die Irreführung bereits erfolgreich war.
theological_decisions:
- issue: Ob πλανώντων eine erfolgreiche Täuschung oder den Versuch der Irreführung bezeichnet
  choice: die euch in die Irre führen
  alternative: die versuchen, euch in die Irre zu führen; die euch täuschen
  rationale: Das griechische Partizip kennzeichnet die betreffenden Personen durch ihre gegen die Adressaten gerichtete Tätigkeit, entscheidet aber nicht ausdrücklich darüber, ob sie ihr Ziel erreichen. Die direkte Formulierung bleibt nahe am Wortlaut; die Fußnote macht die mögliche Nuance des Versuchs sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit ruhigem, würdigem Briefstil. „In die Irre führen“ bewahrt die Bildhaftigkeit des griechischen Verbs; „im Blick auf“ vermeidet einen schwerfälligen Satzbau.
