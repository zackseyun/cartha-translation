reference: 1 John 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: de
  text: Wiederum schreibe ich euch ein neues Gebot, das in ihm[a] und in euch wahr ist, denn die Finsternis vergeht, und das wahre Licht leuchtet schon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „darin und in euch“, wenn sich das Pronomen auf das Gebot beziehungsweise den vorausgehenden Sachverhalt bezieht und nicht persönlich auf Christus.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Wiederum
  rationale: Das Wort nimmt Vers 7 auf und kennzeichnet eine erneute, zugleich kontrastierende Aussage. „Wiederum“ bewahrt diese Offenheit, ohne den Gegensatz stärker auszudeuten, als es der griechische Text tut.
- source_word: ἐντολὴν καινὴν
  choice: ein neues Gebot
  rationale: Die übliche und treffende Wiedergabe; καινός bezeichnet hier etwas qualitativ Neues und knüpft an den johanneischen Ausdruck „neues Gebot“ an.
- source_word: γράφω
  choice: schreibe ich
  rationale: Das Präsens bezeichnet den gegenwärtigen Schreibakt und lässt sich im Deutschen natürlich mit dem einfachen Präsens wiedergeben.
- source_word: ὅ ἐστιν ἀληθές
  choice: Es ist wahr
  rationale: Das sächliche Relativpronomen greift den vorausgehenden Gedanken als Ganzes auf. Ein neuer deutscher Satz vermeidet eine schwerfällige Relativkonstruktion und erhält die Aussage, dass dies wahr beziehungsweise wirklich ist.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Im Zusammenhang ist Christus der wahrscheinlichste persönliche Bezug. Die Form αὐτῷ kann morphologisch jedoch auch sächlich verstanden werden; diese echte Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Die direkte Wiedergabe bewahrt die Parallele zu „in ihm“ und kann sowohl die Wirklichkeit in den einzelnen Lesern als auch in ihrer Gemeinschaft umfassen.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion nennt den Grund für die vorausgehende Aussage. „Denn“ verbindet die Sätze in gehobenem, aber natürlichem Deutsch.
- source_word: ἡ σκοτία παράγεται
  choice: die Finsternis vergeht
  rationale: Das Präsens beschreibt einen bereits fortschreitenden Vorgang. „Vergeht“ erhält das Bild vom Zurückweichen der moralisch-geistlichen Finsternis.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: das wahre Licht
  rationale: Die Formulierung bewahrt den charakteristischen johanneischen Ausdruck und den deutlichen Gegensatz zur Finsternis.
- source_word: ἤδη φαίνει
  choice: leuchtet schon
  rationale: „Schon“ gibt die bereits gegenwärtige Wirklichkeit wieder; „leuchtet“ ist für das aktive Scheinen des Lichts natürlich und prägnant.
theological_decisions:
- issue: Bezugswort von αὐτῷ
  choice: '„in ihm“: Bezug auf Christus'
  alternative: '„darin“: Bezug auf das Gebot beziehungsweise den vorausgehenden Sachverhalt'
  rationale: Der persönliche Bezug auf Christus passt am besten zum johanneischen Kontext und zur Parallelität „in ihm und in euch“. Da αὐτῷ formal auch sächlich sein kann und der Satzbau einen sachlichen Bezug zulässt, wird die Alternative nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wiederum“ ist bewusst etwas gehobener, gibt aber den knappen und offenen Diskursmarker πάλιν genauer wieder als eine stärker deutende Formulierung. Die Bildsprache von Finsternis und wahrem Licht bleibt unverändert.
