  rationale: Die Revision beseitigt die im Deutschen stilistisch und referenziell schwache Satztrennung. Sie erhält die vom griechischen Neutrum getragene Verknüpfung mit dem „neuen Gebot“, ohne den umstrittenen Bezug von αὐτῷ über die Fußnote festzulegen. Alle übrigen Formulierungen bleiben unverändert, da sie den Ausgangstext genau und idiomatisch wiedergeben.
