  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und die zentralen Elemente des griechischen Textes zuverlässig wieder: der generische Singular von ὁ λέγων („Wer sagt“), das Bleiben „in ihm“, die ethische Verpflichtung von ὀφείλει, die Vergleichsrelation von καθώς, das hervorgehobene ἐκεῖνος („jener“) sowie die Lebensführungsmetapher von περιπατεῖν. „Auch selbst“ bildet καὶ αὐτός angemessen ab.'
  naturalness: Modernes Standarddeutsch mit sachlich-würdigem Register. „Wer sagt, dass er in ihm bleibt“ und „so zu leben, wie jener gelebt hat“ sind idiomatisch. „Ist verpflichtet“ ist etwas formeller, aber klar und für den ethischen Nachdruck des Verses gut vertretbar.
  terminology: „Bleibt“ bewahrt den johanneischen Schlüsselbegriff μένω. Die sinngemäße Wiedergabe von περιπατεῖν durch „leben“ ist im modernen Deutsch angemessen; die Fußnote macht die zugrunde liegende Geh- bzw. Wandelmetapher transparent. „Jener“ erhält die demonstrative Hervorhebung, ohne den im griechischen Vers nicht ausdrücklich genannten Namen Jesus in den Haupttext einzutragen.
