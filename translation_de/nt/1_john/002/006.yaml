id: 1JN.2.6
reference: 1 John 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: de
  text: Wer sagt, dass er in ihm bleibt, ist verpflichtet, auch selbst so zu leben, wie jener gelebt hat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auch selbst so zu gehen, wie jener gegangen ist“. „Gehen“ beziehungsweise „wandeln“ ist ein biblisches Bild für die Lebensführung.'
    reason: cultural_note
  - marker: b
    text: „Jener“ bezieht sich im Zusammenhang auf Jesus und bewahrt die hervorhebende Demonstrativform des griechischen Ausdrucks; möglich wäre auch schlicht „er“.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Wer sagt
  rationale: Das substantivierte Partizip bezeichnet allgemein eine Person. Die deutsche Konstruktion „Wer sagt“ gibt diesen repräsentativen Singular natürlich und prägnant wieder.
- source_word: ἐν αὐτῷ μένειν
  choice: dass er in ihm bleibt
  rationale: Das Infinitivgefüge bezeichnet den Inhalt der Behauptung. „Bleiben“ bewahrt den für Johannes wichtigen Ausdruck μένω sowie dessen Beziehungs- und Fortdaueraspekt.
- source_word: ὀφείλει
  choice: ist verpflichtet
  rationale: ὀφείλω bezeichnet hier eine sittliche Verpflichtung. „Ist verpflichtet“ ist im modernen Deutsch klar und wahrt die stärkere Verbindlichkeit des Ausdrucks.
- source_word: καθὼς
  choice: so … wie
  rationale: Die korrelative deutsche Wendung gibt die durch καθώς bezeichnete Entsprechung der Lebensweise idiomatisch wieder.
- source_word: ἐκεῖνος
  choice: jener
  rationale: „Jener“ erhält die demonstrative und leicht hervorhebende Kraft von ἐκεῖνος. Der Bezug auf Jesus ergibt sich aus dem Kontext, ohne ihn ausdrücklich in den Vers einzutragen.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: gelebt hat ... zu leben
  rationale: περιπατέω ist hier metaphorisch auf die Lebensführung bezogen. Im heutigen Deutschen vermittelt „leben“ diesen Sinn unmittelbar; eine wörtliche Wiedergabe mit „wandeln“ wäre gehoben bis altertümlich, „gehen“ dagegen missverständlich.
- source_word: καὶ αὐτὸς
  choice: auch selbst
  rationale: „Auch selbst“ bewahrt sowohl die additive Kraft von καί als auch die Hervorhebung des Subjekts durch αὐτός.
theological_decisions:
- issue: Bezug von αὐτῷ und ἐκεῖνος
  choice: Die Pronomen bleiben als „ihm“ und „jener“ stehen; aus dem Zusammenhang ist Jesus als Bezugsperson zu verstehen.
  alternative: „in Jesus bleibt … wie Jesus gelebt hat“ oder eine ehrerbietige Großschreibung der Pronomen
  rationale: Der unmittelbare Zusammenhang legt den Bezug auf Jesus nahe. Der griechische Text nennt den Namen hier jedoch nicht und kennzeichnet göttliche Pronomen nicht durch Großschreibung; daher wird die kontextuelle Zuordnung nicht stärker expliziert als im Ausgangstext.
- issue: Stärke der ethischen Verpflichtung
  choice: „ist verpflichtet“
  alternative: „sollte“ oder „muss“
  rationale: Die Formulierung hält die sittliche Verbindlichkeit von ὀφείλει fest, ohne sie als bloße Empfehlung abzuschwächen oder als uneingeschränkten Zwang zuzuspitzen.
- issue: Metapher der Lebensführung
  choice: Die Geh-Metapher wird im Haupttext sinngemäß mit „leben“ wiedergegeben und in einer Fußnote offengelegt.
  alternative: „so wandeln, wie jener gewandelt ist“
  rationale: Die ethische Aussage bleibt verständlich und würdevoll, während die Fußnote den bildhaften griechischen Ausdruck und seinen biblischen Hintergrund transparent macht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der johanneische Schlüsselbegriff „bleiben“ wird formal bewahrt; die im Deutschen weniger natürliche Geh-Metapher wird im Haupttext als „leben“ wiedergegeben und per Fußnote kenntlich gemacht. Der repräsentative Singular bleibt erhalten.
