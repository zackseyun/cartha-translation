source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: de
  text: Kinder, es ist die letzte Stunde. Und wie ihr gehört habt, dass der Antichrist kommt, so sind schon jetzt viele Antichristen aufgetreten. Daran erkennen wir, dass es die letzte Stunde ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παιδία
  choice: Kinder
  rationale: Die Anrede bewahrt den familiären, seelsorgerlichen Ton des griechischen Vokativs, ohne durch „kleine“ eine unnötig starke Verkleinerung einzutragen.
- source_word: ἐσχάτη ὥρα
  choice: die letzte Stunde
  rationale: Die transparente Wiedergabe erhält das eschatologische Zeitbild, ohne es als buchstäbliche Stunde oder als genau bestimmtes Endzeitschema auszulegen.
- source_word: καθὼς ἠκούσατε
  choice: wie ihr gehört habt
  rationale: Natürliches modernes Deutsch für den Bezug auf die den Adressaten bereits vermittelte Lehre; das Perfekt ist im Deutschen idiomatisch.
- source_word: ἀντίχριστος
  choice: der Antichrist
  rationale: Obwohl das griechische Substantiv artikellos ist, verlangt beziehungsweise begünstigt das Deutsche bei einer erwarteten bekannten Gestalt den bestimmten Artikel. Eine Fußnote hält die formal mögliche unbestimmtere Wiedergabe offen.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens bringt die erwartete Ankunft knapp und natürlich zum Ausdruck.
- source_word: καὶ νῦν
  choice: schon jetzt
  rationale: Hebt den Kontrast zwischen der erwarteten Ankunft und der bereits gegenwärtigen Vielzahl deutlich hervor.
- source_word: ἀντίχριστοι πολλοὶ
  choice: viele Antichristen
  rationale: Bewahrt die direkte Wortverbindung zum Singular und die bewusste Gegenüberstellung von einem erwarteten Antichristen und vielen gegenwärtigen Antichristen.
- source_word: γεγόνασιν
  choice: sind aufgetreten
  rationale: Gibt das Hervortreten in die geschichtliche Erscheinung und den daraus folgenden gegenwärtigen Bestand idiomatisch wieder; die Fußnote weist auf die Ergebnisbedeutung des Perfekts hin.
- source_word: ὅθεν γινώσκομεν
  choice: Daran erkennen wir
  rationale: Stellt den Schluss aus dem zuvor genannten Sachverhalt prägnant dar und gibt γινώσκω hier als Erkennen anhand eines Zeichens wieder.
theological_decisions:
- issue: Bedeutung von „die letzte Stunde“
  choice: Das eschatologische Zeitbild bleibt unverändert stehen.
  alternative: Eine buchstäbliche letzte Zeitstunde, eine bloße Krisenmetapher oder ein näher bestimmtes Endzeitschema.
  rationale: Der Kontext verleiht der Wendung eschatologisches Gewicht, legt aber keine präzisierende Systematik fest.
- issue: Singular „Antichrist“ und Plural „Antichristen“
  choice: Die Spannung zwischen der erwarteten Einzelfigur und den bereits aufgetretenen vielen Antichristen bleibt erhalten.
  alternative: Den Singular nur als Gattungsbegriff oder ausdrücklich als vollständig definierte individuelle Endzeitgestalt auszulegen.
  rationale: Der Vers stellt Singular und Plural bewusst nebeneinander; die Übersetzung soll diese Spannung nicht harmonisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Syntax. Die traditionelle johanneische Bezeichnung „Antichrist“ bleibt erhalten; konfessionelle oder endzeitliche Präzisierungen werden vermieden.
