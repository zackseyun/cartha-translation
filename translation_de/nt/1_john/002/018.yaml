review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die zentralen Begriffe und die Gegenüberstellung von singularischem ἀντίχριστος und pluralischem ἀντίχριστοι. Im Haupttext sollte jedoch das von ὅτι eingeleitete Inhaltsgefüge ausdrücklich mit „dass“ wiedergegeben werden.
  naturalness: „Wie ihr gehört habt, kommt der Antichrist“ ist im heutigen Standarddeutsch syntaktisch missverständlich, weil nach „gehört habt“ der Inhaltssatzanschluss fehlt. Die korrelative Formulierung mit „so“ ist klar und natürlich.
  terminology: „Kinder“, „letzte Stunde“ und „Antichrist/Antichristen“ sind angemessen, traditionsbewusst und ohne konfessionelle Überdeutung wiedergegeben.
  issues:
  - severity: medium
    issue: Der dass-Satz nach „gehört habt“ fehlt im Haupttext.
    rationale: Das griechische ὅτι leitet den Inhalt des zuvor Gehörten ein. Ohne „dass“ kann der deutsche Satz „wie ihr gehört habt, kommt der Antichrist“ fälschlich so verstanden werden, als beziehe sich „wie“ auf die Art seines Kommens, statt auf den Inhalt der empfangenen Unterweisung.
  revised_text: Kinder, es ist die letzte Stunde. Und wie ihr gehört habt, dass der Antichrist kommt, so sind schon jetzt viele Antichristen aufgetreten. Daran erkennen wir, dass es die letzte Stunde ist.
  revised_footnotes:
  - marker: a
    text: 'Wörtlicher auch: „dass Antichrist kommt“. Im Griechischen steht das Wort ohne Artikel; im Deutschen kann der bestimmte Artikel eine den Lesern bekannte erwartete Gestalt bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „sind entstanden“ beziehungsweise „sind in Erscheinung getreten“. Die griechische Perfektform betont, dass sie aufgetreten und nun gegenwärtig sind.'
    reason: lexical_alternative
