  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: de
  text: Doch ihr habt eine Salbung vom Heiligen, und ihr alle wisst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer anderen Textlesart: „und ihr wisst alles“. Die Lesart des SBLGNT lautet: „und ihr alle wisst“.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Doch
  rationale: Das erste καί stellt hier im Zusammenhang einen Gegensatz zu den im vorherigen Vers genannten Gegnern her; „Doch“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen ist im Griechischen betont. Die Verbindung „Doch ihr“ bewahrt diese Hervorhebung.
- source_word: χρῖσμα
  choice: eine Salbung
  rationale: „Salbung“ erhält das Bild des griechischen Ausdrucks, ohne es vorschnell als den Heiligen Geist oder dessen Wirken auszudeuten.
- source_word: ἔχετε
  choice: habt
  rationale: „Habt“ ist die direkte und natürliche Wiedergabe des Präsens.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: vom Heiligen
  rationale: Die substantivierte Gottesbezeichnung bleibt bewusst offen und wird nicht genauer als Vater, Sohn oder Heiliger Geist bestimmt.
- source_word: καὶ
  choice: und
  rationale: Das zweite καί verbindet die beiden Aussagen schlicht miteinander.
- source_word: οἴδατε
  choice: wisst es
  rationale: „Wisst“ gibt οἴδατε direkt wieder. Das im Deutschen idiomatisch nötige „es“ nimmt den aus dem Zusammenhang erschließbaren Inhalt auf, ohne einen neuen konkreten Gegenstand festzulegen.
- source_word: πάντες
  choice: ihr alle
  rationale: 'πάντες wird gemäß dem SBLGNT als Nominativ Plural und damit als Subjekt verstanden: Alle Angesprochenen wissen, nicht: Sie wissen alles.'
theological_decisions:
- issue: Bezug der Bezeichnung „der Heilige“
  choice: Die offene Bezeichnung „der Heilige“ wurde beibehalten.
  alternative: Gott der Vater; Jesus Christus; der Heilige Geist
  rationale: Der griechische Text bestimmt den Bezug nicht ausdrücklich. Eine genauere Benennung würde eine mögliche Deutung in den Haupttext eintragen.
- issue: Bedeutung von χρῖσμα
  choice: Das Bild wurde mit „Salbung“ bewahrt.
  alternative: der Heilige Geist; die Wirkung des Geistes; eine geistliche Gabe
  rationale: Auch wenn die Salbung vielfach auf den Heiligen Geist oder sein Wirken bezogen wird, nennt der Text dies nicht ausdrücklich. Die metaphorische Formulierung bewahrt die theologische Offenheit.
- issue: Lesart und Funktion von πάντες
  choice: 'πάντες wurde auf die Angesprochenen bezogen: „ihr alle“.'
  alternative: 'πάντα als Akkusativ: „alles“'
  rationale: Diese Wiedergabe folgt dem angegebenen SBLGNT-Text und vermeidet es, den Lesern ein Wissen um alle Dinge zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Salbung“ und „der Heilige“ bewahren die Bildsprache und die Offenheit des Ausgangstextes; „ihr alle wisst es“ ist gegenüber dem wörtlicheren, aber im Deutschen unvollständig wirkenden „ihr alle wisst“ idiomatisch geglättet.
