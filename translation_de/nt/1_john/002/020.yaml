  naturalness: „Doch ihr habt eine Salbung vom Heiligen“ ist modernes, würdevolles Standarddeutsch. Die elliptische Formulierung „und ihr alle wisst“ ist im literarisch-biblischen Register möglich und bewahrt die im Griechischen nicht ausgedrückte Objektstelle besser als „wisst es“.
  terminology: „Salbung“ ist die passende metaphorische Wiedergabe von χρῖσμα. „der Heilige“ gibt τοῦ ἁγίου offen wieder, ohne den Referenten interpretativ auf Vater, Sohn oder Geist festzulegen.
