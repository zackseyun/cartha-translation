id: 1JN.2.28
reference: 1 John 2:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: de
  text: Und nun, Kinder, bleibt in ihm, damit wir, wenn er offenbar wird[a], Zuversicht haben und bei seiner Ankunft[b] nicht beschämt vor ihm zurückweichen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er erscheint“. Das griechische Verb steht im Passiv und bedeutet wörtlicher „offenbar wird“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei seiner Gegenwart“. Das griechische Wort kann „Gegenwart“ oder „Ankunft“ bedeuten und bezeichnet hier sein künftiges Kommen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nicht vor ihm beschämt werden“. Die Wendung kann die Scham in seiner Gegenwart bezeichnen; die Präposition kann zugleich ein Zurückweichen von ihm nahelegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Kinder
  rationale: Die Anrede ist herzlich und familiär. „Kinder“ ist im heutigen Deutsch natürlich und würdig; „Kindlein“ wäre zwar diminutivischer, klingt aber deutlich veraltet.
- source_word: μένετε
  choice: bleibt
  rationale: „Bleiben“ bewahrt den johanneischen Leitbegriff und dessen fortdauernde, relationale Bedeutung.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die knappe räumlich-relationale Metapher wird erhalten, ohne sie als „in Gemeinschaft mit ihm“ ausdeutend zu erweitern.
- source_word: φανερωθῇ
  choice: er offenbar wird
  rationale: Die passive Form des Aorist Konjunktiv wird gewahrt. „Offenbar wird“ ist verständlich und lässt erkennen, dass es um sein sichtbares Hervortreten beziehungsweise Offenbarwerden geht.
- source_word: σχῶμεν παρρησίαν
  choice: Zuversicht haben
  rationale: Die Wendung bezeichnet hier freimütige, unerschrockene Gewissheit angesichts seiner Offenbarung; „Zuversicht“ ist im Deutschen natürlich und nicht konfrontativ.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: nicht beschämt vor ihm zurückweichen
  rationale: Die Wiedergabe verbindet den Schamaspekt des Verbs mit der von ἀπό nahegelegten Bewegung weg von ihm. Eine weniger bewegungsbetonte Deutung wird in der Fußnote bewahrt.
- source_word: παρουσίᾳ
  choice: Ankunft
  rationale: Im eschatologischen Zusammenhang bezeichnet παρουσία das künftige Eintreffen beziehungsweise Kommen Christi. „Ankunft“ wahrt zugleich den Ereignischarakter und die Nähe zur Grundbedeutung.
theological_decisions:
- issue: Bezug der Pronomen und eschatologische Offenbarung
  choice: Die Pronomen werden kontextgemäß auf Jesus Christus bezogen; der Vers spricht von seinem künftigen Offenbarwerden und seiner Ankunft.
  alternative: Ein allgemeinerer Bezug auf Gott, ohne den Sohn ausdrücklich als Referenten festzulegen.
  rationale: Der unmittelbare Zusammenhang handelt vom Bleiben im Sohn und von seinem Offenbarwerden. Die Übersetzung benennt den Referenten jedoch nicht zusätzlich und bewahrt damit die pronominale Form des Griechischen.
- issue: Bedeutung der Scham bei seiner Ankunft
  choice: Die Formulierung beschreibt ein beschämtes Zurückweichen vor ihm, ohne dies ausdrücklich mit endgültiger Verurteilung gleichzusetzen.
  alternative: „Vor ihm beschämt werden“ beziehungsweise „sich vor ihm schämen“, ohne die Nuance des Zurückweichens.
  rationale: Die Verbindung von αἰσχυνθῶμεν mit ἀπ’ αὐτοῦ kann eine Bewegung weg von ihm nahelegen, bleibt aber deutungsoffen; deshalb wird die Alternative in einer Fußnote genannt.
- issue: Bedingung oder zeitliche Erwartung bei ἐὰν φανερωθῇ
  choice: „wenn er offenbar wird“ gibt die erwartete künftige Manifestation wieder, ohne ihren Eintritt infrage zu stellen.
  alternative: „falls er offenbar wird“ als formal stärker konditionale Wiedergabe.
  rationale: ἐάν mit Konjunktiv kann „wenn“ oder „falls“ bedeuten. Im eschatologischen Kontext ist „wenn“ im Deutschen natürlicher; die Bedingungsform betrifft den Zeitpunkt beziehungsweise das Eintreten der Situation, nicht notwendig Zweifel an der Offenbarung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der johanneische Leitbegriff „bleiben“ und die knappe Wendung „in ihm“ werden bewusst beibehalten. Archaisches „Kindlein“ sowie stärker konfessionell geprägte oder ausdeutende Formulierungen werden vermieden.
