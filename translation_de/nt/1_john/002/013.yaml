id: 1JN.2.13
reference: 1 John 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: de
  text: Ich schreibe euch, Väter, weil ihr den erkannt habt, der von Anfang an ist[a]. Ich schreibe euch, junge Männer, weil ihr den Bösen besiegt habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich der Sohn; manche verstehen die Wendung allgemeiner als einen Bezug auf Gott.
    reason: Der griechische Ausdruck benennt den Referenten nicht ausdrücklich und lässt ihn daher formal offen.
lexical_decisions:
- source_word: γράφω
  choice: Ich schreibe
  rationale: Das griechische Präsens wird im deutschen Briefstil natürlich und unmittelbar mit „ich schreibe“ wiedergegeben.
- source_word: πατέρες
  choice: Väter
  rationale: Die wörtliche Anrede bleibt erhalten; sie kann hier über leibliche Vaterschaft hinaus geistlich reife Männer bezeichnen, ohne dass diese Deutung in den Text eingetragen wird.
- source_word: ἐγνώκατε
  choice: ihr habt erkannt
  rationale: Das Perfekt bezeichnet ein erfolgtes Erkennen mit fortdauernder Geltung. „Erkannt habt“ bewahrt diesen Aspekt und entspricht dem johanneischen Sprachgebrauch.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: den, der von Anfang an ist
  rationale: Die substantivierte Wendung wird persönlich und ohne ausdrückliche Benennung ihres Referenten wiedergegeben. „Ist“ bewahrt die präsentische Aussage der griechischen Formulierung.
- source_word: νεανίσκοι
  choice: junge Männer
  rationale: Das Substantiv ist maskulin und bezeichnet junge Männer; eine geschlechtsneutrale Wiedergabe wäre weniger genau.
- source_word: νενικήκατε
  choice: ihr habt besiegt
  rationale: Das Perfekt bezeichnet einen errungenen Sieg mit bleibender Wirkung. „Besiegt habt“ ist im Deutschen klar und idiomatisch.
- source_word: τὸν πονηρόν
  choice: den Bösen
  rationale: Artikel und substantiviertes maskulines Adjektiv sprechen für einen persönlichen bösen Widersacher statt für das abstrakte Böse.
theological_decisions:
- issue: Referent von „der von Anfang an ist“
  choice: Der Referent wird im Haupttext nicht ausdrücklich benannt.
  alternative: Die Wendung kann auf den Sohn bezogen werden; manche verstehen sie allgemeiner als Bezug auf Gott.
  rationale: Der johanneische Zusammenhang legt besonders den Sohn nahe, doch der griechische Text nennt den Referenten an dieser Stelle nicht ausdrücklich. Die offene Formulierung bewahrt diese Spannung.
- issue: Bedeutung von „den Bösen“
  choice: Persönlicher böser Widersacher
  alternative: Das abstrakte Böse
  rationale: Die maskuline substantivierte Form mit Artikel weist deutlich auf eine Person, ohne dass der Eigenname „Satan“ in den Text eingefügt werden sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzstruktur und die direkten Anreden des griechischen Textes bleiben erhalten; theologisch mögliche Referenten werden nicht im Haupttext vereindeutigt.
