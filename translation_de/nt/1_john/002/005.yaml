id: 1JN.2.5
reference: 1 John 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: de
  text: 'Wer aber sein Wort hält, in dem[a] ist die Liebe Gottes[b] wirklich vollendet. Daran erkennen wir, dass wir in ihm sind:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in diesem“. Der griechische Ausdruck kann sich auf den Menschen beziehen, der sein Wort hält, oder auf den genannten Sachverhalt als Kennzeichen.'
    reason: alternative_reading
  - marker: b
    text: „Die Liebe Gottes“ kann Gottes Liebe im Glaubenden oder die Liebe des Glaubenden zu Gott bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Wer aber
  rationale: Das Relativpronomen mit ἄν bezeichnet allgemein jeden, auf den die Aussage zutrifft. „Aber“ gibt den milden Gegensatz von δέ zum vorausgehenden Gedanken wieder.
- source_word: τηρῇ
  choice: hält
  rationale: „Halten“ bewahrt die johanneische Ausdrucksweise vom Halten des Wortes beziehungsweise der Gebote und verengt die Bedeutung nicht auf rein äußerlichen Gehorsam.
- source_word: αὐτοῦ τὸν λόγον
  choice: sein Wort
  rationale: Der Singular λόγος bezeichnet hier das mitgeteilte Wort beziehungsweise die Botschaft Gottes oder Christi. „Wort“ erhält die johanneische Begrifflichkeit und lässt den Bezug des Pronomens wie im Griechischen stehen.
- source_word: ἀληθῶς
  choice: wirklich
  rationale: „Wirklich“ gibt die bekräftigende adverbiale Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: ἐν τούτῳ
  choice: in dem
  rationale: Die Formulierung bezieht sich naheliegend auf den Menschen, der Gottes Wort hält. „In dem“ ist im Deutschen klar und bewahrt zugleich die demonstrative Form besser als eine vollständige Auflösung zu „in ihm“.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: die Liebe Gottes
  rationale: Der deutsche Genitiv bewahrt wie der griechische die mögliche Bedeutung sowohl von Gottes Liebe als auch der Liebe zu Gott.
- source_word: τετελείωται
  choice: ist vollendet
  rationale: Das Perfekt Passiv bezeichnet einen erreichten, fortbestehenden Zustand. „Ist vollendet“ bewahrt sowohl den Vollendungsaspekt als auch die knappe Form des griechischen Ausdrucks.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Daran erkennen wir
  rationale: Die johanneische Wendung nennt das Kennzeichen oder die Grundlage einer Erkenntnis. „Daran erkennen wir“ ist dafür die natürliche deutsche Entsprechung.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: dass wir in ihm sind
  rationale: „In ihm“ erhält die zentrale johanneische Wendung, ohne sie deutend als Gemeinschaft oder Vereinigung auszubauen.
theological_decisions:
- issue: Bedeutung des Genitivs in ἡ ἀγάπη τοῦ θεοῦ
  choice: die Liebe Gottes
  alternative: Gottes Liebe zu uns; unsere Liebe zu Gott
  rationale: Der griechische Genitiv ist tatsächlich mehrdeutig und kann sowohl die von Gott ausgehende Liebe als auch die auf Gott gerichtete Liebe bezeichnen. Die Hauptübersetzung bewahrt diese theologische Spannung.
- issue: Bezug von ἐν τούτῳ im ersten Satz
  choice: in dem
  alternative: darin; in diesem
  rationale: Der Ausdruck kann auf die Person zurückweisen, die Gottes Wort hält, oder allgemeiner auf den genannten Sachverhalt. Der Haupttext gibt den naheliegenden Personenbezug wieder; die Fußnote hält die sachliche Lesart offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die johanneischen Schlüsselwendungen „sein Wort halten“, „die Liebe Gottes“ und „in ihm sein“ bleiben erhalten. Die genuine Mehrdeutigkeit des Genitivs und des ersten ἐν τούτῳ wird nicht stillschweigend aufgelöst.
