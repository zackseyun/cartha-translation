id: 1JN.2.22
reference: 1 John 2:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: de
  text: 'Wer ist der Lügner, wenn nicht der, der leugnet, dass Jesus der Messias[a] ist? Dieser ist der Antichrist[b]: der, der den Vater und den Sohn leugnet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische ὁ χριστός ist hier ein Titel und wird deshalb mit „der Messias“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder einfach: „Antichrist“. Im Griechischen steht der bestimmte Artikel: „der Antichrist“. In den Johannesbriefen kann der Ausdruck auch einen Gegner-Typus bezeichnen, der durch die Leugnung des Vaters und des Sohnes gekennzeichnet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: der Lügner
  rationale: Der bestimmte Artikel und die zugespitzte rhetorische Frage bezeichnen hier den exemplarischen Lügner, nicht lediglich irgendeinen Lügner.
- source_word: ἀρνούμενος
  choice: der, der leugnet
  rationale: Das substantivierte Präsenspartizip beschreibt die Person anhand ihres kennzeichnenden, fortdauernden Leugnens. Die Wiederholung entspricht der Struktur des griechischen Satzes.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: dass Jesus der Messias ist
  rationale: 'Nach einem Verb des Leugnens bezeichnet die ὅτι-Konstruktion den bestrittenen Inhalt: Geleugnet wird die Aussage, dass Jesus der Messias ist. Diese idiomatische deutsche Wiedergabe vermeidet eine missverständliche doppelte Verneinung.'
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός fungiert hier als Titel. „Messias“ gibt dessen Sinn und den jüdisch-messianischen Zusammenhang im Deutschen klarer wieder als die stärker namensähnliche Form „Christus“.
- source_word: ἀντίχριστος
  choice: der Antichrist
  rationale: Der griechische Artikel wird bewahrt. Der etablierte deutsche Ausdruck lässt offen, ob hier ein bestimmter Gegner oder ein durch diese Leugnung gekennzeichneter Typus gemeint ist.
- source_word: οὗτός ἐστιν
  choice: Dieser ist
  rationale: Das Demonstrativpronomen verweist auf den unmittelbar zuvor beschriebenen Leugner und hebt die Identifizierung hervor.
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: den Vater und den Sohn
  rationale: Die paarweise gebrauchten Bezeichnungen meinen im johanneischen Zusammenhang Gott den Vater und den Sohn; die Großschreibung macht diesen Bezug sichtbar.
theological_decisions:
- issue: Wiedergabe von Χριστός in der christologischen Bekenntnisformel
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck ist hier eindeutig ein Titel und bezeichnet den Anspruch, der über Jesus bejaht oder geleugnet wird. „Messias“ übersetzt den Titel, ohne ihn wie einen Eigennamen erscheinen zu lassen.
- issue: Referenz von ἀντίχριστος
  choice: der Antichrist
  alternative: Antichrist; Gegenmessias
  rationale: Die bestimmte Form folgt dem griechischen Artikel, legt aber nicht fest, ob Johannes ausschließlich eine einzelne endzeitliche Gestalt oder einen repräsentativen Typus von Gegner meint. Diese Spannung bleibt erhalten.
- issue: Negation in der ὅτι-Konstruktion nach ἀρνούμενος
  choice: „leugnet, dass Jesus der Messias ist“
  alternative: '„leugnet: Jesus ist nicht der Messias“'
  rationale: Beide Fassungen erfassen, dass der Gegner die Messianität Jesu verneint. Die gewählte Form ist im Deutschen natürlicher und schließt die logisch irreführende Lesart aus, jemand leugne die negative Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Zuspitzung und die wiederholte Kennzeichnung durch „der, der leugnet“ bleiben erhalten; unnötige konfessionelle oder endzeitliche Festlegungen werden vermieden.
