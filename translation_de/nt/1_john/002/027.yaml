source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: de
  text: 'Und was euch betrifft: Die Salbung, die ihr von ihm empfangen habt, bleibt in euch, und ihr habt es nicht nötig, dass euch jemand lehrt. Sondern wie seine Salbung euch über alle Dinge lehrt und wahr ist und keine Lüge, so bleibt in ihm.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen am Schluss sinngemäß: „Und so, wie sie euch gelehrt hat, bleibt ihr in ihm.“'
    reason: textual_variant
  - marker: b
    text: Für „bleibt in euch“ und „bleibt in ihm“ stehen im Griechischen Formen desselben Verbs.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: Salbung
  rationale: Bewahrt die johanneische Metapher, ohne sie im Haupttext ausdrücklich als den Heiligen Geist oder dessen Wirken zu deuten.
- source_word: ἀπ’ αὐτοῦ
  choice: von ihm
  rationale: Gibt das Pronomen wieder und überlässt die Bestimmung des Bezugs dem Kontext.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: bleibt in euch / bleibt in ihm
  rationale: Die einheitliche Wiedergabe mit „bleiben“ bewahrt die für Johannes wichtige Wiederholung desselben griechischen Verbs μένω. Im Schlusssatz ist „bleibt“ als Imperativ Plural gemeint.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: ihr habt es nicht nötig, dass euch jemand lehrt
  rationale: Folgt der griechischen Aussage eng, ohne ihren Geltungsbereich erläuternd einzuschränken oder sie zu einer ausdrücklichen Leugnung jedes menschlichen Lehrens auszuweiten.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: lehrt / lehrt / gelehrt hat
  rationale: Bewahrt die Wiederholung des Verbs und damit den argumentativen Zusammenhang.
- source_word: περὶ πάντων
  choice: über alles
  rationale: Gibt die Weite der Formulierung wieder, ohne ihren sachlichen Umfang im Haupttext einzugrenzen.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: sie ist wahr und keine Lüge
  rationale: Bewahrt den scharfen johanneischen Gegensatz zwischen Wahrheit und Lüge in natürlichem Deutsch.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: so, wie sie euch gelehrt hat
  rationale: Erhält den vergleichenden Anschluss des abschließenden Aufrufs an das vorausgehende Lehren der Salbung.
theological_decisions:
- issue: Bezug der „Salbung“ (χρῖσμα)
  choice: Die Metapher „Salbung“ bleibt im Haupttext stehen.
  alternative: Ausdrückliche Wiedergabe als „Heiliger Geist“, als Wirken des Geistes oder als empfangene Botschaft.
  rationale: Obwohl im Kontext wahrscheinlich der Geist beziehungsweise sein heiligendes und lehrendes Wirken gemeint ist, benennt der Vers selbst dies metaphorisch als „Salbung“. Eine ausdrückliche Identifizierung würde die mögliche Bedeutung stärker festlegen als der Wortlaut.
- issue: Aussage, niemand müsse die Adressaten lehren
  choice: Die Aussage wird ohne Abschwächung und ohne interpretierende Einschränkung wiedergegeben.
  alternative: Ausdrückliche Beschränkung auf die Irrlehrer oder Deutung als generelle Ablehnung aller menschlichen Lehrer.
  rationale: Der Wortlaut soll weder abgeschwächt noch zu einer weitergehenden ekklesiologischen Lehraussage ausgebaut werden; der Kontext muss die Reichweite bestimmen.
- issue: Form des Schlussverbs μένετε
  choice: 'Imperativ: „bleibt in ihm“'
  alternative: 'Indikativ: „ihr bleibt in ihm“'
  rationale: Die gedruckte SBLGNT-Lesart wird im Zusammenhang am natürlichsten als Aufforderung verstanden. Die abweichende Überlieferung und mögliche indikativische Lesart wird in einer Fußnote kenntlich gemacht.
- issue: Bezug von ἐν αὐτῷ im Schlusssatz
  choice: „in ihm“ mit personalem Bezug
  alternative: „in ihr“, bezogen auf die Salbung
  rationale: Das maskuline griechische Pronomen und der weitere Kontext sprechen für einen personalen Bezug; die Übersetzung vermeidet dennoch eine namentliche Festlegung des Antezedens.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Und was euch betrifft“ hebt das betonte ὑμεῖς natürlich hervor. „Salbung“ erhält die biblische Metapher; die konsequente Verwendung von „bleiben“ wahrt den johanneischen Leitbegriff. Die Fußnotenmarker stehen gemeinsam am Satzende, da beide den Schlusssatz beziehungsweise dessen Verbindung mit dem wiederholten Verb erläutern.
