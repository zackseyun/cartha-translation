source:
  edition: SBLGNT
  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: de
  text: 'Und daran erkennen wir, dass wir ihn erkannt haben: wenn wir seine Gebote halten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „dass wir ihn kennengelernt haben“. Das griechische Perfekt kann ein erfolgtes Erkennen mit fortdauernder Wirkung ausdrücken.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: daran
  rationale: Die idiomatische deutsche Wendung „daran erkennen“ gibt den demonstrativen Beweis- oder Erkenntnisgrund natürlich und präzise wieder.
- source_word: γινώσκομεν
  choice: erkennen wir
  rationale: Das Präsens bezeichnet gegenwärtige Erkenntnis oder Gewissheit; im Zusammenhang mit „daran“ ist „erkennen“ idiomatischer als „wissen“.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: dass wir ihn erkannt haben
  rationale: Das Perfekt beschreibt ein erfolgtes Erkennen mit fortdauernder Wirkung. Die formal nahe Wiedergabe bewahrt zugleich eine im Deutschen verständliche resultative Nuance.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bleibt wie im Griechischen unbestimmt; weder Gott noch Christus wird ausdrücklich eingesetzt.
- source_word: ἐὰν
  choice: wenn
  rationale: „Wenn“ leitet die Bedingungs- beziehungsweise Beweisklausel im Deutschen natürlich ein; „falls“ könnte zu hypothetisch wirken.
- source_word: ἐντολάς
  choice: Gebote
  rationale: „Gebote“ bewahrt das moralische und biblische Gewicht von ἐντολή, ohne altertümlich zu klingen.
- source_word: τηρῶμεν
  choice: halten
  rationale: „Gebote halten“ ist eine natürliche und traditionsfähige Wiedergabe, die sowohl Bewahren als auch gehorsames Befolgen einschließt.
theological_decisions:
- issue: Bezugswort von αὐτόν („ihn“)
  choice: Das Pronomen „ihn“ bleibt im Haupttext erhalten.
  alternative: „Gott“ oder „Jesus/Christus“ ausdrücklich einsetzen.
  rationale: Der griechische Text verwendet nur das Pronomen. Die Übersetzung soll die enge Beziehung zwischen Gott und dem Sohn im Kontext nicht durch eine eindeutige Ergänzung enger festlegen, als es dieser Vers tut.
- issue: Bedeutung des Perfekts ἐγνώκαμεν
  choice: „erkannt haben“ im Haupttext, mit Erläuterung der möglichen ingressiv-resultativen Bedeutung in der Fußnote.
  alternative: „kennen gelernt haben“ oder „zu der Erkenntnis gelangt sind“.
  rationale: „Erkannt haben“ bleibt der griechischen Form nahe und bewahrt die theologische Dichte des Erkennens; die Fußnote macht deutlich, dass auch der Eintritt in eine fortdauernde Erkenntnisbeziehung gemeint sein kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Daran erkennen wir“ und „seine Gebote halten“ sind allgemein verständlich und bewahren zugleich den johanneischen und biblischen Sprachklang.
