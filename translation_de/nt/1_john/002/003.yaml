  terminology: „Gebote“ für ἐντολάς und „halten“ für τηρῶμεν bewahren die johanneische Terminologie und deren Bedeutung von bewahrendem, gehorsamem Befolgen. „Ihn erkannt haben“ ist eine etablierte und hier vertretbare Wiedergabe des Perfekts; die Fußnote erläutert sachgerecht die mögliche ingressiv-resultative Nuance, ohne sie dogmatisch festzulegen.
