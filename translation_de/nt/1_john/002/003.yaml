  source_fidelity: '„Und daran erkennen wir, dass wir ihn erkannt haben: wenn wir seine Gebote halten“ gibt alle Elemente des griechischen Satzes wieder: den anaphorisch-demonstrativen Erkenntnisgrund (ἐν τούτῳ), das gegenwärtige γινώσκομεν, das Perfekt ἐγνώκαμεν, das unbestimmte Pronomen αὐτόν sowie die konditionale Aussage mit τηρῶμεν. Die Übersetzung legt den Referenten von „ihn“ nicht über den griechischen Wortlaut hinaus fest.'
