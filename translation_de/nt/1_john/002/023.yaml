id: 1JN.2.23
reference: 1 John 2:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: de
  text: Jeder, der den Sohn verleugnet, hat auch den Vater nicht; wer den Sohn bekennt, hat auch den Vater.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In einigen Handschriften fehlt: „wer den Sohn bekennt, hat auch den Vater“.'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Jeder, der … verleugnet
  rationale: Das substantivierte Partizip Präsens hat allgemeinen Sinn. Die Formulierung ist im modernen Deutschen natürlich und bewahrt sowohl den universalen Umfang als auch den generischen Charakter.
- source_word: ἀρνούμενος
  choice: verleugnet
  rationale: ἀρνέομαι bezeichnet hier das ausdrückliche Bestreiten beziehungsweise die Zurückweisung des Sohnes. „Verleugnet“ bewahrt den bekenntnishaften Gegensatz zu „bekennt“ besser als das allgemeinere „ablehnt“.
- source_word: τὸν υἱὸν
  choice: den Sohn
  rationale: Der griechische Text verwendet den bestimmten christologischen Titel ohne den Zusatz „Gottes“. Daher wird dieser nicht erläuternd ergänzt.
- source_word: οὐδὲ
  choice: auch … nicht
  rationale: 'Die deutsche Wendung gibt die weitergeführte Verneinung idiomatisch wieder: Wer den Sohn verleugnet, hat auch den Vater nicht.'
- source_word: τὸν πατέρα ἔχει
  choice: hat den Vater
  rationale: Die johanneische Ausdrucksweise wird wörtlich und verständlich beibehalten. Ihre relationale Tragweite wird nicht durch eine engere Deutung wie „Gemeinschaft mit dem Vater haben“ festgelegt.
- source_word: ὁ ὁμολογῶν
  choice: wer … bekennt
  rationale: Das substantivierte Partizip Präsens ist generisch. „Bekennt“ bringt die ausdrückliche, bekenntnishafte Anerkennung zur Geltung und bildet den passenden Gegensatz zu „verleugnet“.
- source_word: καὶ
  choice: auch
  rationale: 'Im antithetischen Parallelismus bezeichnet καὶ die entsprechende Hinzufügung: Wer den Sohn bekennt, hat auch den Vater.'
theological_decisions:
- issue: Textkritisch markierter zweiter Satzteil
  choice: Der Satzteil „wer den Sohn bekennt, hat auch den Vater“ steht im Haupttext.
  alternative: Den zweiten Satzteil auslassen, da er in einigen Handschriften fehlt.
  rationale: Der bereitgestellte SBLGNT-Text druckt den Satzteil mit textkritischer Markierung, nimmt ihn aber in den Text auf. Deshalb wird er übersetzt; die Überlieferungsvariante wird in einer Fußnote kenntlich gemacht.
- issue: Relationale Bedeutung von „den Vater haben“
  choice: Die wörtliche Wendung „den Vater haben“ bleibt erhalten.
  alternative: Deutend mit „Gemeinschaft mit dem Vater haben“ oder „zum Vater gehören“ wiedergeben.
  rationale: Die Formulierung wahrt die starke johanneische Aussage über die Untrennbarkeit von Sohn und Vater, ohne ihre relationale Bedeutung auf eine einzelne theologische Erklärung einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verben „verleugnet“ und „bekennt“ erhalten den bekenntnishaften Gegensatz; die knappe johanneische Wendung „den Vater haben“ bleibt bewusst unaufgelöst.
