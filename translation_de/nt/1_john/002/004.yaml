  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: de
  text: 'Wer sagt: „Ich habe ihn kennengelernt“[a], aber seine Gebote nicht hält, ist ein Lügner, und in ihm[b] ist die Wahrheit nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich kenne ihn.“ Das griechische Perfekt bezeichnet ein erfolgtes Kennenlernen, dessen Wirkung fortbesteht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „in diesem“; gemeint ist wohl der so beschriebene Mensch.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Wer sagt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden Menschen, der diese Aussage macht. „Wer sagt“ ist im modernen Deutschen natürlich und bewahrt den generischen Sinn.
- source_word: ὅτι
  choice: direkte Rede mit Doppelpunkt und Anführungszeichen
  rationale: ὅτι leitet hier den Inhalt der Aussage ein. Im Deutschen gibt direkte Rede die griechische Konstruktion idiomatisch wieder.
- source_word: Ἔγνωκα
  choice: Ich habe ihn erkannt
  rationale: Das Perfekt von γινώσκω bezeichnet ein erfolgtes Erkennen mit fortdauernder Bedeutung. „Habe erkannt“ bewahrt diesen Aspekt besser als das schlichtere „kenne“, ohne die relationale Bedeutung unnötig auszudeuten.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bleibt wie im Griechischen unbestimmt und vermeidet eine ausdrückliche Festlegung auf Gott oder Christus.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: seine Gebote
  rationale: „Gebote“ entspricht dem johanneischen Gebrauch von ἐντολή und bewahrt die biblischen Anklänge sowie das Gewicht göttlicher Weisungen.
- source_word: μὴ τηρῶν
  choice: aber seine Gebote nicht hält
  rationale: Das Präsenspartizip beschreibt anhaltendes Nichtbefolgen. „Halten“ entspricht dem johanneischen τηρέω und bewahrt dessen Bedeutung von beachten und bewahren. „Aber“ gibt den sachlichen Gegensatz im Deutschen natürlicher wieder als ein bloßes „und“.
- source_word: ψεύστης
  choice: ein Lügner
  rationale: Das prädikative Substantiv wird direkt wiedergegeben und bewahrt die persönliche moralische Charakterisierung.
- source_word: ἐν τούτῳ
  choice: in ihm
  rationale: Das Demonstrativpronomen verweist am natürlichsten auf den zuvor beschriebenen Menschen. Die Formulierung bleibt nahe am griechischen Bild.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: ist die Wahrheit nicht
  rationale: Die einfache verneinte Kopula und der theologisch dichte Ausdruck „die Wahrheit“ werden ohne einengende Paraphrase bewahrt.
theological_decisions:
- issue: Bezug von αὐτόν und αὐτοῦ
  choice: Die Pronomen bleiben als „ihn“ und „seine“ stehen.
  alternative: Ausdrückliche Wiedergabe als „Gott“ beziehungsweise „Gottes“ oder als „Christus“ beziehungsweise „seine“.
  rationale: Der unmittelbare Zusammenhang legt Gott nahe, während die johanneische Theologie Gott und den Sohn eng verbindet. Die pronominale Wiedergabe bewahrt die Formulierung und ihre mögliche Spannung.
- issue: Bedeutung des johanneischen Erkennens
  choice: „Ich habe ihn erkannt“
  alternative: „Ich kenne ihn“
  rationale: Das griechische Perfekt verbindet das vorausgegangene Erkennen mit einem gegenwärtigen Verhältnis. Die gewählte Form wahrt diesen Aspekt, ohne das Erkennen auf bloßes Wissen zu reduzieren oder mystisch zu überhöhen.
- issue: Anaphorischer Bezug von ἐν τούτῳ
  choice: „in ihm“
  alternative: „in diesem Menschen“ oder „in einem solchen Menschen“
  rationale: Der Dativ verweist wahrscheinlich auf den beschriebenen Menschen. Die wörtlichere pronominale Form bewahrt zugleich die knappe johanneische Ausdrucksweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die generische Form „Wer“ vermeidet unnötige Geschlechtsmarkierung. Satzbau und Schlüsselbegriffe bleiben nahe am Griechischen; zugleich sorgt „aber“ für einen natürlichen deutschen Gegensatz.
