  naturalness: Die Formulierung ist würdevoll und gut verständlich. Die Änderung zu „kennengelernt“ verhindert eine im modernen Deutsch naheliegende Fehlbedeutung. Die Stellung „in ihm ist die Wahrheit nicht“ bewahrt die knappe, hervorgehobene Struktur und bleibt in diesem Register natürlich.
  terminology: „Gebote“, „hält“, „Lügner“ und „die Wahrheit“ sind treffende, im johanneischen Kontext angemessene Entsprechungen. Die Pronomen bleiben zu Recht unaufgelöst. Die Fußnote zu ἐν τούτῳ sollte direkt bei „ihm“ verankert sein, da sie genau diese Wendung erläutert.
