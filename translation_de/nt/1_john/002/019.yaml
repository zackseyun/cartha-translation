  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: de
  text: Sie sind von uns weggegangen, aber sie waren nicht von uns. Denn wenn sie von uns gewesen wären, wären sie bei uns geblieben.[a] Doch dies geschah, damit sie offenbar würden,[b] dass sie nicht alle von uns sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wären sie weiter bei uns geblieben“.'
    reason: Lexikalische Alternative für μένω mit Betonung des Fortdauerns.
  - marker: b
    text: 'Oder: „damit sie sichtbar würden“ oder „damit sie erkennbar würden“.'
    reason: Lexikalische Alternativen für das pluralische Passiv φανερωθῶσιν.
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: von uns
  rationale: Die einheitliche Wiedergabe bewahrt die auffällige griechische Wiederholung. Beim ersten Vorkommen bezeichnet die Wendung den Ausgangspunkt des Weggehens, bei den weiteren Vorkommen Zugehörigkeit oder Herkunft; der Kontext lässt diese Bedeutungsnuance erkennen, ohne sie erklärend festzulegen.
- source_word: ἐξῆλθαν
  choice: sind … weggegangen
  rationale: Die Form bezeichnet ein vollzogenes Weggehen. „Weggegangen“ ist im heutigen Deutsch natürlich und vermeidet, schon im Verb eine theologische Deutung wie „abgefallen“ einzutragen.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: sie waren nicht von uns
  rationale: Die knappe relationale Formulierung bleibt nahe am Griechischen und legt nicht ausdrücklich fest, ob sichtbare Gemeinschaft, innere Zugehörigkeit oder ein systematisch-theologischer Status gemeint ist.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: wären sie bei uns geblieben
  rationale: Der irreale Bedingungssatz wird idiomatisch mit deutschem Konjunktiv II wiedergegeben. „Geblieben“ wahrt zugleich das johanneische Motiv des Bleibens.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: Doch dies geschah, damit offenbar würde
  rationale: Das im Griechischen elliptische ἀλλά wird im Deutschen durch „dies geschah“ vervollständigt. „Offenbar würde“ gibt den passiven Gedanken des Sichtbar- beziehungsweise Erkennbarwerdens wieder, ohne eine handelnde Instanz hinzuzufügen.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: dass sie nicht alle von uns sind
  rationale: Die Stellung der Verneinung bei „alle“ bleibt erhalten. So wird weder interpretierend „keiner von ihnen“ noch eine dogmatische Erklärung eingesetzt.
theological_decisions:
- issue: Bedeutung der wiederholten Wendung ἐξ ἡμῶν für die Gemeinschaftszugehörigkeit
  choice: Durchgehend „von uns“, ohne Ausweitung zu „wahre Gläubige“ oder „wirklich gerettet“
  alternative: „Sie gehörten in Wahrheit nie zu uns“
  rationale: Der Text unterscheidet zwischen äußerem Weggehen und einem tieferen Nicht-von-uns-Sein, benennt dieses Verhältnis aber in gemeinschaftlicher Sprache. Die knappe Formulierung bewahrt diese theologische Spannung.
- issue: Reichweite von οὐκ … πάντες
  choice: „dass sie nicht alle von uns sind“
  alternative: „dass keiner von ihnen zu uns gehört“
  rationale: Die gewählte Fassung bildet die griechische Negation möglichst unmittelbar ab und vermeidet, die mögliche Reichweite von „nicht alle“ stillschweigend zu „keiner“ zu verschärfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „von uns“ wurde bewusst beibehalten, obwohl „zu uns gehören“ stellenweise idiomatischer wäre, weil die Wiederholung und die Bedeutungsverschiebung des griechischen Ausdrucks für die Aussage wesentlich sind.
