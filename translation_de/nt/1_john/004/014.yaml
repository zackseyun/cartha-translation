id: 1JN.4.14
reference: 1 John 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: de
  text: Und wir haben gesehen und bezeugen, dass der Vater den Sohn als Retter der Welt gesandt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „… dass der Vater den Sohn, den Retter der Welt, gesandt hat.“'
    reason: Die griechische appositionelle Fügung enthält kein ausdrückliches Wort für „als“; die Hauptübersetzung gibt sie in natürlichem Deutsch wieder.
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: Und wir
  rationale: Bewahrt den Anschluss durch καί und die leichte Hervorhebung des ausdrücklich gesetzten Pronomens ἡμεῖς, ohne sie im Deutschen zu überzeichnen.
- source_word: τεθεάμεθα
  choice: haben gesehen
  rationale: Das Perfekt bezeichnet ein erfolgtes Sehen mit fortdauernder Bedeutung. „Haben gesehen“ ist gegenwärtiges, natürliches Deutsch und erhält den Augenzeugencharakter.
- source_word: μαρτυροῦμεν
  choice: bezeugen
  rationale: Das Präsens bezeichnet das fortdauernde Zeugnis, das aus dem vorausgegangenen Sehen hervorgeht. „Bezeugen“ ist präzise, verständlich und dem würdigen Register angemessen.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Inhalt des Zeugnisses ein, nicht dessen Begründung.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Die bestimmte relationale Bezeichnung wird entsprechend dem johanneischen Sprachgebrauch als Titel für Gott wiedergegeben.
- source_word: ἀπέσταλκεν
  choice: gesandt hat
  rationale: Das deutsche Perfekt gibt die vollzogene Sendung mit ihrer bleibenden Bedeutung angemessen wieder; „senden“ bewahrt zudem den feierlichen, aber geläufigen biblischen Ausdruck.
- source_word: τὸν υἱόν
  choice: den Sohn
  rationale: Der griechische Text enthält den Artikel, aber kein ausdrückliches Possessivpronomen. „Den Sohn“ bewahrt die relationale Titelsprache gegenüber „dem Vater“.
- source_word: σωτῆρα
  choice: Retter
  rationale: „Retter“ gibt die Grundbedeutung von σωτήρ in modernem Standarddeutsch klar und würdig wieder, ohne die Aussage konfessionell auszuweiten.
- source_word: τοῦ κόσμου
  choice: der Welt
  rationale: 'Der Genitiv hängt von σωτήρ ab und bezeichnet den umfassenden Bezugsbereich: „Retter der Welt“.'
- source_word: σωτῆρα τοῦ κόσμου
  choice: als Retter der Welt
  rationale: Die appositionelle Akkusativfügung wird im Deutschen mit „als“ idiomatisch und verständlich wiedergegeben. Eine formal engere Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Reichweite der Bezeichnung „Retter der Welt“
  choice: Die umfassende johanneische Formulierung „Retter der Welt“ bleibt uneingeschränkt stehen.
  alternative: Eine Eingrenzung etwa auf „Retter der Erwählten“ oder eine Abschwächung zu „möglicher Retter der Welt“.
  rationale: Der griechische Text nennt Titel und Bezugsbereich unmittelbar, ohne hier eine bestimmte Heilslehre näher auszuführen. Die Übersetzung darf diese Spannung weder verengen noch ergänzen.
- issue: Vater-Sohn-Sprache
  choice: Die relationalen Titel werden schlicht als „der Vater“ und „der Sohn“ wiedergegeben.
  alternative: Eine erläuternde Erweiterung wie „Gott, der Vater, sandte Jesus Christus“.
  rationale: Der Vers selbst verwendet die relationalen Titel und nicht die Namen oder weiteren Bezeichnungen. Die knappe johanneische Ausdrucksweise bleibt deshalb erhalten.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit klarer johanneischer Satzstruktur. Die beiden Zeitformen werden unterschieden: abgeschlossenes Sehen mit bleibender Bedeutung („haben gesehen“) und gegenwärtiges, fortdauerndes Zeugnis („bezeugen“).'
