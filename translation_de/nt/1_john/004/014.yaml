  source_fidelity: 'Die Übersetzung gibt den griechischen Satzinhalt zuverlässig wieder: Das Perfekt τεθεάμεθα ist mit „haben gesehen“ angemessen erfasst, das gegenwärtige μαρτυροῦμεν mit „bezeugen“, und ἀπέσταλκεν mit dem deutschen Perfekt „gesandt hat“. Die Titel „der Vater“ und „den Sohn“ bleiben ohne nicht im Text stehende Namens- oder Besitzergänzung erhalten. „als Retter der Welt“ gibt die appositionelle Akkusativfügung idiomatisch wieder, ohne ihren Sinn zu verändern.'
  naturalness: Der Satz ist klares, modernes Standarddeutsch und wahrt einen würdigen, aber nicht altertümlichen Registerton. Die Verbindung „haben gesehen und bezeugen“ bildet die unterschiedliche zeitliche Perspektive verständlich ab. Auch „Retter der Welt“ ist im deutschen biblischen Sprachgebrauch natürlich und verständlich.
  terminology: „Vater“, „Sohn“ und „Retter der Welt“ entsprechen den johanneischen Schlüsselbezeichnungen. Die Formulierung bewahrt die weite Aussage von κόσμος und legt keine bestimmte Heilslehre hinein. Die Fußnote erläutert sachgerecht, dass „als“ eine idiomatische Ausformung der griechischen Apposition ist.
