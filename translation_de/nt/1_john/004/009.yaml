id: 1JN.4.9
reference: 1 John 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: de
  text: 'Darin ist die Liebe Gottes unter uns[a] offenbar geworden: Gott hat seinen einzigen Sohn[b] in die Welt gesandt, damit wir durch ihn leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in uns“. Die griechische Wendung kann bedeuten, dass Gottes Liebe in den Glaubenden oder in ihrer Mitte offenbar geworden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „seinen eingeborenen Sohn“. Das griechische Wort betont die Einzigkeit des Sohnes; „eingeboren“ bewahrt die geschichtlich vertraute kirchliche Ausdrucksweise.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Darin
  rationale: Die johanneische Wendung verweist auf das Folgende als die Weise, in der Gottes Liebe sichtbar wurde; „Darin“ bewahrt die knappe griechische Struktur.
- source_word: ἐφανερώθη
  choice: ist … sichtbar geworden
  rationale: Die passive Aoristform bezeichnet, dass etwas zuvor Verborgenes erkennbar hervortrat. Die deutsche Perfektform klingt natürlich und gibt den gegenwärtig bedeutsamen Vorgang angemessen wieder.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: die Liebe Gottes
  rationale: Der Genitiv bezeichnet im Zusammenhang am natürlichsten die von Gott ausgehende Liebe, die sich in der Sendung seines Sohnes zeigt.
- source_word: ἐν ἡμῖν
  choice: unter uns
  rationale: Die Wendung kann die Offenbarung im gemeinschaftlichen Bereich bezeichnen. „Unter uns“ gibt diesen korporativen Sinn idiomatisch wieder; die wörtlichere Alternative „in uns“ bleibt in einer Fußnote erhalten.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt lässt den folgenden Satz im Deutschen natürlich als inhaltliche Erklärung dessen erscheinen, worin Gottes Liebe sichtbar wurde.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: seinen einzigen Sohn
  rationale: μονογενής hebt hier die Einzigkeit der Sohnschaft hervor. „Seinen einzigen Sohn“ ist klares, heutiges Deutsch; die traditionelle Wiedergabe wird in einer Fußnote genannt.
- source_word: ἀπέσταλκεν
  choice: hat … gesandt
  rationale: Das deutsche Perfekt entspricht der griechischen Perfektform und lässt die fortdauernde Bedeutung der vollzogenen Sendung erkennen. „Gesandt“ wahrt den würdigen biblischen Sprachgebrauch.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Zielangabe.
- source_word: ἵνα ζήσωμεν
  choice: damit wir … leben
  rationale: „Damit“ gibt den Zweck der Sendung wieder, während „leben“ die knappe Aussage des griechischen Verbs bewahrt.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: 'διά mit Genitiv bezeichnet hier Vermittlung oder Mittel: Das Leben wird durch den Sohn ermöglicht.'
theological_decisions:
- issue: Bedeutung von μονογενής in Bezug auf den Sohn
  choice: Im Haupttext „einzigen Sohn“
  alternative: „eingeborenen Sohn“ oder „einzigartigen Sohn“
  rationale: Die Übersetzung bringt die einzigartige Beziehung des Sohnes zu Gott zum Ausdruck, ohne die spätere dogmatische Begrifflichkeit unmittelbar in das Wort hineinzulesen. Die geschichtlich bedeutsame traditionelle Formulierung bleibt in der Fußnote sichtbar.
- issue: Bedeutung von ἐν ἡμῖν
  choice: Im Haupttext „unter uns“
  alternative: „in uns“
  rationale: Der Zusammenhang erlaubt eine gemeinschaftliche, auf Gottes Handeln in der Mitte der Glaubenden bezogene Lesart. Da die griechische Wendung ebenso eine Offenbarung in den Glaubenden bezeichnen kann, wird diese echte Mehrdeutigkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt knapp; „gesandt“ trägt den gehobenen Registerton, ohne altertümlich zu wirken. Echte lexikalische und theologische Mehrdeutigkeiten werden durch unmittelbar zugeordnete Fußnoten offengehalten.
