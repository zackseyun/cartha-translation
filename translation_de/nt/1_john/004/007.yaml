id: 1JN.4.7
reference: 1 John 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: de
  text: Geliebte[a], lasst uns einander lieben, denn die Liebe kommt von Gott. Jeder, der liebt, ist aus Gott geboren und kennt Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Lieben.“ Die griechische Anrede ist wörtlich „Geliebte“ und greift dieselbe Wortfamilie auf wie „lieben“ und „Liebe“ im weiteren Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Geliebte
  rationale: Die substantivierte Anrede bewahrt die Verbindung zur mehrfach wiederholten Wortfamilie ἀγαπάω/ἀγάπη und klingt zugleich würdevoll.
- source_word: ἀγαπῶμεν
  choice: lasst uns lieben
  rationale: Der hortative Konjunktiv wird im Deutschen natürlich als gemeinsame Aufforderung wiedergegeben; ein ausdrücklich fortdauerndes „weiter lieben“ würde den Präsensaspekt überpräzisieren.
- source_word: ἀλλήλους
  choice: einander
  rationale: Die übliche und knappe deutsche Entsprechung des reziproken Pronomens.
- source_word: ὅτι
  choice: denn
  rationale: Kennzeichnet den folgenden Satz klar als Begründung der Aufforderung und passt zum gehobenen, aber gegenwärtigen Register.
- source_word: ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν
  choice: die Liebe kommt von Gott
  rationale: Gibt den Gedanken göttlicher Herkunft in natürlichem modernem Deutsch wieder. „Ist aus Gott“ wäre formaler, im heutigen Deutsch jedoch unnötig sperrig.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: jeder, der liebt
  rationale: Bewahrt den allgemeinen, uneingeschränkten Aussagecharakter der substantivierten Partizipialkonstruktion.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ist aus Gott geboren
  rationale: Bewahrt die johanneische Herkunftsformel und gibt das Perfekt mit seinem fortbestehenden Ergebnis angemessen wieder.
- source_word: γινώσκει τὸν θεόν
  choice: kennt Gott
  rationale: Gibt das präsentische, relationale Erkennen direkt wieder, ohne einen im Verb nicht ausdrücklich bezeichneten Beginn des Erkennens hinzuzufügen.
theological_decisions:
- issue: Verhältnis von Liebe, Geburt aus Gott und Gotteserkenntnis
  choice: Die Aussagen werden unmittelbar miteinander verbunden, ohne ihre Beziehung systematisch-theologisch weiter zu bestimmen.
  alternative: Die Liebe als technischen Beweis einer bestimmten Heilsordnung deuten oder die Aussage auf eine rein ethische Mahnung reduzieren.
  rationale: Der griechische Text verknüpft das Lieben ausdrücklich mit der Geburt aus Gott und der Erkenntnis Gottes, legt aber keine ausgearbeitete Reihenfolge des Heilsgeschehens dar.
- issue: Wiederholung der Wortfamilie ἀγαπ-
  choice: „Geliebte“ und „lieben/Liebe“ machen die rhetorische Wortverbindung im Deutschen sichtbar.
  alternative: Die Anrede ausschließlich als „Liebe Freunde“ wiedergeben und damit die lexikalische Verbindung abschwächen.
  rationale: Die Wiederholung trägt die literarische und theologische Aussage des Verses; die alternative, idiomatischere Anrede wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdevoller biblischer Färbung. „Geliebte“ ist bewusst markierter als alltägliche Rede, bewahrt aber das Wortspiel des griechischen Textes; die geläufigere Anrede steht in der Fußnote.
