source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: de
  text: 'Daran erkennen wir, dass wir in ihm bleiben und er in uns bleibt: Denn er hat uns von seinem Geist gegeben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus seinem Geist“. Die griechische Wendung betont die Herkunft und kann zugleich eine partitive Nuance haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: Daran
  rationale: Die johanneische Erkenntnisformel bezeichnet hier den Grund bzw. das Erkennungszeichen. „Daran“ ist im modernen Deutschen natürlich und bewahrt den evidenziellen Sinn.
- source_word: γινώσκομεν
  choice: erkennen wir
  rationale: „Erkennen“ passt idiomatisch zur Formel „daran erkennen wir“ und gibt die gegenwärtige Gewissheit des Präsens wieder.
- source_word: ἐν αὐτῷ μένομεν
  choice: wir in ihm bleiben
  rationale: „Bleiben“ bewahrt den durativen und relationalen Sinn des johanneischen Schlüsselverbs μένω, ohne altertümlich zu wirken.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: und er in uns
  rationale: Wie im Griechischen wird das Verb nicht wiederholt; aus dem ersten Glied ist eindeutig „bleibt“ mitzudenken. So bleibt der knappe Parallelismus erhalten.
- source_word: ὅτι
  choice: dass / Doppelpunkt mit erklärendem Satz
  rationale: Das erste ὅτι leitet den Inhalt des Erkennens ein. Das zweite begründet bzw. erläutert diese Erkenntnis; nach dem Doppelpunkt wirkt im Deutschen ein selbstständiger Satz natürlicher als ein weiteres „dass“.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: von seinem Geist
  rationale: „Von“ wahrt die durch ἐκ bezeichnete Herkunft und lässt zugleich die mögliche partitive Nuance offen, statt den Ausdruck zu „seinen Geist“ zu glätten.
- source_word: δέδωκεν ἡμῖν
  choice: hat uns gegeben
  rationale: Das deutsche Perfekt gibt die vollendete Gabe mit fortdauernder Bedeutung natürlich wieder.
theological_decisions:
- issue: Bezug von αὐτοῦ und Identität des πνεῦμα
  choice: „seinem Geist“ mit Großschreibung
  alternative: „seinem geist“ als unpersönliche Haltung oder geistliche Gabe
  rationale: Im unmittelbaren Zusammenhang ist Gottes Geist das Zeichen des gegenseitigen Bleibens. Die Großschreibung kennzeichnet den Heiligen Geist, ohne zusätzliche trinitarische Formulierungen einzutragen.
- issue: Gegenseitiges Bleiben
  choice: „dass wir in ihm bleiben und er in uns“
  alternative: „dass wir in ihm wohnen und er in uns wohnt“
  rationale: Die elliptische Form erhält die Gegenseitigkeit und die knappe Gestalt des griechischen Satzes; „bleiben“ wahrt zugleich die johanneische Terminologie.
- issue: Nuance von ἐκ τοῦ πνεύματος
  choice: „von seinem Geist gegeben“
  alternative: „seinen Geist gegeben“
  rationale: Die Übersetzung bewahrt die Herkunfts- bzw. partitive Nuance von ἐκ und entscheidet nicht stillschweigend, ob die Wendung die Gabe des Geistes als Ganze oder Anteilhabe an ihm hervorhebt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Daran erkennen wir“ ist idiomatisch und präzise; „bleiben“ hält die johanneische Leitwortverbindung sichtbar. Der Doppelpunkt macht den begründenden Charakter des zweiten ὅτι deutlich, ohne die syntaktische Mehrdeutigkeit unnötig festzulegen.
