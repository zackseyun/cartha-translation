id: 1JN.4.15
reference: 1 John 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: de
  text: Wer bekennt, dass Jesus der Sohn Gottes ist, in dem bleibt Gott, und er bleibt in Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb μένω kann auch mit „verweilen“ oder, je nach Zusammenhang, „wohnen“ wiedergegeben werden. Es ist ein wichtiges Leitwort in den johanneischen Schriften.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Wer
  rationale: Das Relativpronomen mit ἐάν bildet eine verallgemeinernde Relativkonstruktion. „Wer“ gibt im Deutschen knapp und natürlich den Sinn „jeder, der“ wieder.
- source_word: ὁμολογήσῃ
  choice: bekennt
  rationale: ὁμολογέω bezeichnet hier das ausdrückliche Anerkennen und Bekennen einer Wahrheit über Jesus. „Bekennt“ bewahrt sowohl den öffentlichen als auch den theologischen Gehalt.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet unmittelbar den Inhalt des Bekenntnisses ein.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: Jesus der Sohn Gottes ist
  rationale: „Der Sohn Gottes“ bewahrt den bestimmten christologischen Titel; die deutsche Wortstellung folgt dem durch „dass“ eingeleiteten Nebensatz.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: in dem bleibt Gott
  rationale: Die Wiederaufnahme mit „in dem“ ist nach dem einleitenden „Wer“ idiomatisches Deutsch. „Bleibt“ gibt die fortdauernde, relationale Bedeutung des johanneischen Schlüsselworts μένω wieder.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: und er bleibt in Gott
  rationale: Im Griechischen ist das Verb im zweiten Glied ausgelassen und aus dem ersten zu ergänzen. Im Deutschen wird „bleibt“ zur Klarheit wiederholt, ohne dem Sinn etwas hinzuzufügen.
theological_decisions:
- issue: Gegenseitiges Innebleiben
  choice: „in dem bleibt Gott, und er bleibt in Gott“
  alternative: „in dem wohnt Gott, und er wohnt in Gott“
  rationale: Die wechselseitige Beziehung zwischen Gott und dem Bekennenden wird unverändert wiedergegeben und weder erklärt noch systematisiert. „Bleibt“ erhält zudem die johanneische Leitwortverbindung von μένω.
- issue: Christologischer Titel
  choice: „der Sohn Gottes“
  alternative: „Gottes Sohn“
  rationale: Die gewählte Form bewahrt die ausdrückliche Titelform des griechischen Textes, ohne zusätzliche dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „bleibt“ löst die griechische Ellipse für ein natürliches deutsches Verständnis auf; die gegenseitige Aussage bleibt dabei vollständig erhalten.
