id: 1JN.4.5
reference: 1 John 4:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: de
  text: Sie sind aus der Welt; deshalb reden sie aus der Welt, und die Welt hört auf sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit »Welt« ist hier die von Gott entfremdete menschliche Ordnung gemeint, nicht die Schöpfung als solche. Das Griechische wiederholt wörtlich »aus der Welt« und betont damit Herkunft oder Quelle; möglich wäre auch: »Sie gehören zur Welt; deshalb reden sie von dem, was zur Welt gehört.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: Sie
  rationale: Das Pronomen verweist im Zusammenhang auf die falschen Propheten und bewahrt den Gegensatz zum folgenden »wir«, ohne die Emphase durch »sie selbst« unnötig zu verstärken.
- source_word: ἐκ τοῦ κόσμου
  choice: aus der Welt
  rationale: Die Präposition ἐκ bezeichnet Herkunft oder Ursprung. »Aus der Welt« bewahrt diesen Gedanken und lässt sich an beiden Stellen gleich wiedergeben.
- source_word: κόσμος
  choice: Welt
  rationale: Hier bezeichnet κόσμος die von Gott entfremdete menschliche Ordnung, nicht die Schöpfung als solche. »Welt« erhält die johanneische Bild- und Begriffssprache, ohne sie im Haupttext auszudeuten.
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Die knappe kausale Verknüpfung macht deutlich, dass ihre Herkunft der Grund für ihr Reden ist.
- source_word: λαλοῦσιν
  choice: reden
  rationale: Das Präsens hat allgemeinen beziehungsweise wiederholten Sinn. »Reden« klingt natürlich und würdig und passt zur Redeweise beziehungsweise Botschaft.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: reden sie aus der Welt
  rationale: Die Formulierung hält die auffällige Wiederholung von ἐκ τοῦ κόσμου fest und lässt offen, ob besonders Quelle, Prägung oder Inhalt ihres Redens im Blick ist.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: die Welt hört auf sie
  rationale: ἀκούω bezeichnet hier nicht nur akustisches Hören, sondern zustimmende Aufnahme. Die deutsche Wendung »auf jemanden hören« bringt diese Reaktion prägnant zum Ausdruck.
theological_decisions:
- issue: Bedeutung von κόσμος im johanneischen Zusammenhang
  choice: »Welt« bezeichnet die von Gott entfremdete menschliche Ordnung
  alternative: die physische Schöpfung oder die Menschheit in neutralem Sinn
  rationale: Der unmittelbare Zusammenhang stellt Menschen, die »aus Gott« sind, denen gegenüber, die »aus der Welt« sind. Gemeint sind daher geistlich-ethische Herkunft und entsprechende Aufnahmebereitschaft. Der Haupttext behält dennoch den offenen Leitbegriff »Welt« bei.
- issue: Sinn von ἐκ τοῦ κόσμου λαλοῦσιν
  choice: Die Herkunftsformulierung wird wörtlich-strukturnah als »reden sie aus der Welt« bewahrt
  alternative: »reden sie von der Welt« oder »reden sie weltlich«
  rationale: Die griechische Wiederholung betont Quelle oder Ursprung. Eine stärker idiomatische Festlegung auf Inhalt oder Art des Redens würde die echte Bedeutungsbreite verengen.
- issue: Emphase von αὐτοὶ
  choice: Keine ausdrückliche Wiedergabe durch »sie selbst«
  alternative: »Sie selbst sind aus der Welt«
  rationale: Der Kontrast ist durch »sie« und den Zusammenhang ausreichend erkennbar; »sie selbst« könnte im Deutschen überbetont wirken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung »aus der Welt« bleibt trotz ihrer leichten Fremdheit stehen, weil sie die rhetorische und theologische Struktur des griechischen Textes trägt. »Hört auf sie« vermittelt zustimmende Aufnahme stärker als bloßes »hört sie«.
