source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: de
  text: Wir sind von Gott. Wer Gott kennt, hört auf uns[a]; wer nicht von Gott ist, hört nicht auf uns. Daran erkennen wir den Geist der Wahrheit[b] und den Geist des Irrtums[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hört uns“. Das griechische Verb kann einfach „hören“ bedeuten; hier meint es wahrscheinlich das aufnahmebereite Hören auf das apostolische Zeugnis.'
    reason: lexical_alternative
  - marker: b
    text: „Geist der Wahrheit“ begegnet auch in Johannes 14,17; 15,26; 16,13 und bezeichnet dort den Heiligen Geist. Die Wendung kann sprachlich auch allgemeiner verstanden werden.
    reason: alternative_reading_and_cross_reference
  - marker: c
    text: 'Oder: „Geist der Irreführung“. Das griechische Wort kann Irrtum, Täuschung oder das Abirren von der Wahrheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: aus Gott
  rationale: „Aus“ bewahrt die Herkunfts- bzw. Ursprungsbedeutung von ἐκ und gibt den johanneischen Gegensatz natürlich wieder.
- source_word: ὁ γινώσκων τὸν θεόν
  choice: wer Gott kennt
  rationale: Die substantivierte Präsenspartizipialform wird als allgemeine, charakteristische Aussage wiedergegeben; „kennt“ wahrt die persönliche und relationale Bedeutung von γινώσκω.
- source_word: ἀκούει ἡμῶν
  choice: hört auf uns
  rationale: 'Im Zusammenhang bezeichnet ἀκούω mehr als bloßes akustisches Hören: Es geht um die aufnahmebereite Reaktion auf das apostolische Zeugnis. „Auf uns hören“ drückt dies aus, ohne bis zu „gehorchen“ zu verstärken.'
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: wer nicht aus Gott ist
  rationale: Die generische Aussage des Relativpronomens wird in idiomatischem Deutsch bewahrt; „aus Gott“ hält erneut die Herkunftsbedeutung von ἐκ fest.
- source_word: ἐκ τούτου
  choice: daran
  rationale: „Daran“ ist die natürliche deutsche Form für das johanneische Erkennungsmerkmal, das sich aus der vorangehenden Reaktion auf das Zeugnis ergibt.
- source_word: γινώσκομεν
  choice: erkennen wir
  rationale: Hier steht das unterscheidende Erkennen im Vordergrund. „Erkennen“ ist idiomatisch und bewahrt zugleich die Verbindung zum Wortfeld von γινώσκω.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: den Geist der Wahrheit
  rationale: Die feste johanneische Wendung bezeichnet wahrscheinlich den Heiligen Geist, lässt in der Formulierung aber die sprachlich mögliche allgemeinere Lesart bestehen.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: den Geist des Irrtums
  rationale: πλάνη bezeichnet Irrtum, Irreführung oder Abweichen von der Wahrheit. „Irrtum“ bildet einen klaren Gegenpol zu „Wahrheit“, ohne die Art des geistlichen Einflusses enger festzulegen als der griechische Text.
theological_decisions:
- issue: Bezeichnet τὸ πνεῦμα τῆς ἀληθείας ausdrücklich den Heiligen Geist oder allgemeiner einen Geist, der durch Wahrheit gekennzeichnet ist?
  choice: den Geist der Wahrheit
  alternative: einen durch Wahrheit gekennzeichneten Geist beziehungsweise die wahrheitsgemäße geistliche Wirkung
  rationale: Der johanneische Sprachgebrauch, besonders Johannes 14,17; 15,26; 16,13, spricht wahrscheinlich für den Heiligen Geist. Da deutsche Substantive ohnehin großgeschrieben werden, erzwingt die Übersetzung typografisch keine Entscheidung und die Fußnote wahrt die mögliche allgemeinere Lesart.
- issue: Bezeichnet ἀκούει ἡμῶν bloßes Hören oder die positive Aufnahme des apostolischen Zeugnisses?
  choice: hört auf uns
  alternative: hört uns
  rationale: Der Zusammenhang des Prüfens und Erkennens wahrer und falscher Geister legt aufnahmebereites Hören nahe. Die gewählte Formulierung vermeidet jedoch die stärkere Festlegung auf ausdrücklichen Gehorsam.
- issue: Wie persönlich ist τὸ πνεῦμα τῆς πλάνης zu verstehen?
  choice: den Geist des Irrtums
  alternative: die irreführende geistliche Wirkung
  rationale: Die parallele Formulierung mit „Geist der Wahrheit“ wird bewahrt. Der Text lässt offen, ob hier vorrangig ein persönlicher Geist oder allgemein ein irreführender geistlicher Einfluss gemeint ist.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die knappe Parallelstruktur des griechischen Textes bleibt erhalten. „Aus Gott“ bewahrt bewusst die ungewohnte, aber verständliche Herkunftssprache des Johannes; „hört auf uns“ gibt die kontextuelle Aufnahme des apostolischen Zeugnisses wieder.
