id: 1JN.4.12
reference: 1 John 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: de
  text: Niemand hat Gott je gesehen. Wenn wir einander lieben, bleibt Gott in uns, und seine Liebe[a] ist in uns vollendet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Liebe zu Gott“. Der griechische Ausdruck „seine Liebe“ kann sowohl Gottes Liebe zu uns als auch unsere auf Gott gerichtete Liebe bezeichnen; der Zusammenhang spricht eher für Gottes Liebe.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ist in uns zur Vollendung gebracht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: gesehen
  rationale: „Gesehen“ gibt das Perfekt von θεάομαι zusammen mit πώποτε in natürlichem, heutigem Deutsch wieder, ohne durch „geschaut“ oder „erblickt“ eine stärkere Nuance aufzuzwingen.
- source_word: πώποτε
  choice: je
  rationale: 'Mit der Verneinung verstärkt „je“ die umfassende Aussage knapp und idiomatisch: „Niemand hat Gott je gesehen.“'
- source_word: ἐὰν ἀγαπῶμεν
  choice: wenn wir … lieben
  rationale: ἐάν mit Präsens Konjunktiv bezeichnet hier eine reale Bedingung; „wenn“ bewahrt den bedingenden Sinn und klingt im Deutschen natürlicher als „falls“.
- source_word: ἀλλήλους
  choice: einander
  rationale: „Einander“ ist die präzise und stilistisch angemessene Wiedergabe des reziproken Pronomens.
- source_word: μένει
  choice: bleibt
  rationale: „Bleibt“ bewahrt den für Johannes wichtigen fortdauernden und relationalen Sinn von μένω in verständlichem modernem Deutsch.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: seine Liebe
  rationale: Die Formulierung wahrt die genitivische Mehrdeutigkeit weitgehend. Im Zusammenhang mit Gottes vorausgehender Liebe in den Versen 10–11 liegt primär Gottes Liebe zu uns nahe; die mögliche Deutung als unsere Liebe zu Gott wird in der Fußnote genannt.
- source_word: ἐν ἡμῖν
  choice: in uns
  rationale: „In uns“ entspricht der wiederholten Wendung ἐν ἡμῖν und passt zum johanneischen Motiv des Bleibens Gottes in den Glaubenden.
- source_word: τετελειωμένη ἐστιν
  choice: ist … vollendet
  rationale: Die periphrastische Perfektform bezeichnet einen erreichten, fortbestehenden Zustand. „Ist vollendet“ erhält zudem die sprachliche Verbindung zu τελειόω an anderen Stellen des Briefes.
theological_decisions:
- issue: Bedeutung von ἡ ἀγάπη αὐτοῦ
  choice: Gottes Liebe ist in uns vollendet
  alternative: Unsere Liebe zu Gott ist in uns vollendet
  rationale: Der unmittelbare Zusammenhang betont Gottes vorausgehende und tätige Liebe (Verse 10–11), weshalb ein subjektiver beziehungsweise possessiver Genitiv wahrscheinlicher ist. Da ein objektiver Genitiv grammatisch möglich bleibt, wird diese Deutung nicht verschwiegen, sondern als Alternative in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper johanneischer Satzführung. „Bleibt“ und „vollendet“ bewahren zentrale Wortverbindungen des Briefes, ohne altertümlich zu klingen. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
