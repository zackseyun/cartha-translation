id: 1JN.4.17
reference: 1 John 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: de
  text: Darin[a] ist die Liebe bei uns zur Vollendung gekommen, damit wir am Tag des Gerichts Zuversicht[b] haben; denn wie er[c] ist, so sind auch wir in dieser Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dadurch“ beziehungsweise „Auf diese Weise“. Die griechische Wendung kann rück- oder vorausweisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Freimut“, das heißt furchtlose Gewissheit und Offenheit.'
    reason: lexical_alternative
  - marker: c
    text: „Er“ bezieht sich wahrscheinlich auf Jesus; manche verstehen die Aussage allgemeiner als Bezug auf Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Darin
  rationale: Die Wendung kann rück- oder vorausweisen und den Gesichtspunkt beziehungsweise die Weise bezeichnen. „Darin“ bewahrt diese Offenheit im Deutschen, ohne den Bezug vorschnell festzulegen.
- source_word: τετελείωται
  choice: ist … zur Vollendung gekommen
  rationale: Das Perfekt Passiv bezeichnet einen vollendeten Vorgang mit fortdauerndem Ergebnis. Die Formulierung gibt den Gedanken des Erreichens des vorgesehenen Ziels natürlich wieder.
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: die Liebe bei uns
  rationale: „Bei uns“ gibt μετά mit Genitiv transparent wieder und lässt offen, ob die Liebe in Beziehung zu den Glaubenden oder in ihrer Gemeinschaft gemeint ist; zugleich vermeidet es die unnatürliche Formulierung „mit uns“.
- source_word: ἵνα παρρησίαν ἔχωμεν
  choice: sodass wir … Zuversicht haben können
  rationale: „Sodass“ bewahrt die Ziel- beziehungsweise Ergebnisbeziehung; „Zuversicht“ bezeichnet hier das freie, furchtlose Auftreten vor Gott natürlicher als „Freimut“.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: am Tag des Gerichts
  rationale: Dies ist die geläufige und inhaltlich genaue deutsche Wiedergabe der eschatologischen Zeitangabe.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion führt den Grund für die Zuversicht ein. „Denn“ verbindet die Aussage in würdigem, natürlichem Deutsch.
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: wie er ist, so sind auch wir
  rationale: Die korrelative Vergleichsstruktur sowie die Präsensformen des Griechischen bleiben erhalten; das Pronomen lässt den Bezug wie im Ausgangstext implizit.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: in dieser Welt
  rationale: Die übliche Wiedergabe bezeichnet den gegenwärtigen Lebensbereich der Glaubenden.
theological_decisions:
- issue: Bezugswort von ἐκεῖνος („er“)
  choice: Das Pronomen bleibt im Haupttext ohne erklärenden Namen stehen; wahrscheinlich ist Christus beziehungsweise der Sohn gemeint.
  alternative: Allgemeiner Bezug auf Gott.
  rationale: Im 1. Johannesbrief verweist ἐκεῖνος mehrfach auf Jesus. Da das Griechische den Namen hier jedoch nicht nennt, bewahrt die Übersetzung diese implizite Bezugnahme und nennt die Alternative in der Fußnote.
- issue: Bedeutung der vollendeten Liebe
  choice: Die Liebe ist bei den Glaubenden zu ihrem vorgesehenen Ziel gelangt und führt zu Zuversicht angesichts des Gerichts.
  alternative: Ausschließlich die Liebe der Glaubenden zu Gott oder ausschließlich Gottes Liebe zu ihnen wird vollkommen.
  rationale: Der griechische Wortlaut legt die Richtung der Liebe nicht eindeutig fest. Die Übersetzung vermeidet daher sowohl eine perfektionistische Deutung als auch eine Beschränkung auf nur eine Richtung der Liebe.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. „Zur Vollendung gekommen“ wahrt den johanneischen Gedanken des Zielerreichens; „bei uns“ erhält die Mehrdeutigkeit von μεθ’ ἡμῶν, ohne im Deutschen unnatürlich zu wirken.
