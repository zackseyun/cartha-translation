id: 1JN.4.21
reference: 1 John 4:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: de
  text: 'Und dieses Gebot haben wir von ihm: Wer Gott liebt, soll auch seinen Bruder[a] lieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Bruder oder seine Schwester“. Im Griechischen steht die maskuline Singularform „seinen Bruder“; sie kann hier repräsentativ einen Mitglaubenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: Gebot
  rationale: „Gebot“ gibt die verbindliche moralische Weisung im johanneischen Sprachgebrauch natürlich und präzise wieder.
- source_word: ἀπ’ αὐτοῦ
  choice: von ihm
  rationale: Die pronominale Form des Griechischen bleibt erhalten; im unmittelbaren Zusammenhang bezieht sich „ihm“ auf Gott.
- source_word: ἵνα
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen idiomatisch den Inhalt des Gebots ein, den ἵνα hier bezeichnet, ohne einen unpassenden Zwecksinn aufzudrängen.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: Wer Gott liebt
  rationale: „Wer“ gibt das substantivierte Partizip natürlich, allgemein und in seiner bedingungsartigen Aussage wieder.
- source_word: ἀγαπᾷ
  choice: soll … lieben
  rationale: „Soll“ bringt den durch das Gebot bestimmten Aufforderungscharakter des Konjunktivs zum Ausdruck, ohne ihn unnötig zu verstärken.
- source_word: ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Die maskuline Singularform des Ausgangstextes wird bewahrt. Im johanneischen Zusammenhang kann „Bruder“ repräsentativ einen Mitglaubenden bezeichnen; darauf weist die Fußnote hin.
- source_word: καὶ
  choice: auch
  rationale: '„Auch“ bildet die additive Kraft ab: Zur Liebe zu Gott gehört die Liebe zum Bruder.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: lieben / liebt
  rationale: Die einheitliche Wiedergabe mit „lieben“ bewahrt den johanneischen Wortzusammenhang.
theological_decisions:
- issue: Maskuline Singularform in ἀδελφὸν αὐτοῦ
  choice: „seinen Bruder“ im Haupttext, mit Hinweis auf den möglichen inklusiven Sinn in der Fußnote
  alternative: „seinen Bruder oder seine Schwester“ beziehungsweise „seinen Mitgläubigen“
  rationale: Der Haupttext wahrt Form und Bild des griechischen Ausdrucks. Zugleich wird nicht verschwiegen, dass die maskuline Singularform im Kontext repräsentativ für Glaubensgeschwister stehen kann.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und knappem Satzbau. Der Doppelpunkt vermeidet eine schwerfällige Inhaltseinleitung mit „dass“.
