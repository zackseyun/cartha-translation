  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: de
  text: Wir lieben, weil er uns zuerst geliebt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Wir lieben ihn, weil er uns zuerst geliebt hat.“'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Subjekt trägt im Griechischen eine leichte Hervorhebung. Im Deutschen ist „wir“ erforderlich und gibt den Sinn natürlich wieder, ohne mit „wir selbst“ zu überzeichnen.
- source_word: ἀγαπῶμεν
  choice: lieben
  rationale: Präsens Aktiv, erste Person Plural. Das schlichte Präsens bewahrt den im Zusammenhang wichtigen Wortstamm der Liebe und lässt das Objekt entsprechend dem Ausgangstext offen.
- source_word: ὅτι
  choice: weil
  rationale: 'Die Konjunktion ist hier kausal: Gottes vorausgehende Liebe begründet unser Lieben.'
- source_word: αὐτὸς
  choice: er
  rationale: Das Pronomen bezieht sich im Kontext auf Gott. „Er“ ist im Deutschen natürlich und lässt die leichte griechische Hervorhebung aus dem Satzbau hervorgehen.
- source_word: πρῶτος
  choice: zuerst
  rationale: Gemeint ist der zeitliche und begründende Vorrang der Liebe Gottes. „Zuerst“ bringt dies unmittelbar zum Ausdruck.
- source_word: ἠγάπησεν
  choice: geliebt hat
  rationale: Das griechische Aorist bezeichnet hier Gottes vorausgehendes Liebeshandeln. Das deutsche Perfekt ist in gegenwärtiger Standardsprache idiomatisch und stellt zugleich dessen bleibende Bedeutung heraus, ohne die Aktionsart unnötig festzulegen.
- source_word: ἡμᾶς
  choice: uns
  rationale: Direktes Objekt zu „geliebt hat“; die natürliche und genaue deutsche Entsprechung ist „uns“.
theological_decisions:
- issue: Ob zu „wir lieben“ ein Objekt ergänzt werden soll
  choice: 'Das Objekt bleibt unausgesprochen: „Wir lieben“'
  alternative: „Wir lieben ihn“ beziehungsweise „Wir lieben Gott“
  rationale: Der zugrunde gelegte SBLGNT-Text enthält nach ἀγαπῶμεν kein Objekt. Daher wird keines ergänzt. So bleibt offen, ob das Lieben hier besonders Gott, andere Menschen oder beides umfasst; zugleich wird die abweichende Textüberlieferung in der Fußnote genannt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Satzform und die Wiederholung von „lieben/geliebt“ bewahren die Prägnanz und den inneren Zusammenhang des griechischen Textes.
