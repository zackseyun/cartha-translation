    issue: Abweichende Fußnotenposition im englischen Audit Trail
    rationale: Im englischen Referenztext steht Marker a nach „God“, obwohl seine Erläuterung die Gegner beziehungsweise falschen Propheten betrifft. Der deutsche Entwurf setzt den entsprechenden Marker sachgerecht bei „sie“ und weist daher keinen Ankerfehler auf.
