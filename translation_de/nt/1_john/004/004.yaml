id: 1JN.4.4
reference: 1 John 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: de
  text: Ihr seid aus Gott, Kinder, und habt sie überwunden[a], weil der, der in euch ist, größer ist als der, der in der Welt ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die unmittelbar zuvor erwähnten Gegner, besonders die falschen Propheten.
    reason: cross_reference
  - marker: b
    text: Der griechische Text nennt beide nicht ausdrücklich. Der Zusammenhang weist beim Ersten auf Gott oder seinen Geist, beim Zweiten auf den Bösen hinter der Welt hin.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ihr
  rationale: Das ausdrücklich gesetzte Pronomen ist im Griechischen hervorgehoben. Das vorangestellte „Ihr“ bewahrt diesen Nachdruck im Deutschen, ohne das stärkere „ihr selbst“ hinzuzufügen.
- source_word: ἐκ τοῦ θεοῦ
  choice: aus Gott
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise die aus Gott begründete Zugehörigkeit. „Aus Gott“ erhält zugleich die für den 1. Johannesbrief charakteristische Ausdrucksweise.
- source_word: τεκνία
  choice: Kinder
  rationale: Die Anrede ist familiär und liebevoll. „Kinder“ klingt im modernen Deutschen natürlich; „meine Kinder“ würde ein im griechischen Text nicht ausdrücklich vorhandenes Possessivpronomen ergänzen.
- source_word: νενικήκατε
  choice: habt ... überwunden
  rationale: Das Perfekt bezeichnet einen errungenen Sieg mit fortdauernder Wirkung. Das deutsche Perfekt gibt dies idiomatisch wieder, ohne den Ausdruck unnötig militärisch zuzuspitzen.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor erwähnten Gegner, besonders die falschen Propheten. Die Übersetzung lässt diesen Rückbezug wie der griechische Text unausgeführt.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι nennt hier den Grund dafür, dass die Angeredeten ihre Gegner überwunden haben.
- source_word: μείζων
  choice: größer
  rationale: „Größer“ bewahrt den umfassenden Vergleich und verengt ihn nicht auf bloße Stärke oder Macht.
- source_word: ὁ ἐν ὑμῖν
  choice: der, der in euch ist
  rationale: Die substantivierte griechische Wendung bezeichnet eine Person, nennt sie aber nicht ausdrücklich. Die deutsche Formulierung wahrt diese Offenheit.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: der, der in der Welt ist
  rationale: Die parallele Wiedergabe erhält den rhetorischen Gegensatz zur vorhergehenden Wendung und lässt die genaue Identität wie im Ausgangstext unausgesprochen.
- source_word: κόσμῳ
  choice: Welt
  rationale: „Welt“ ist die angemessene Grundbedeutung. Eine Wiedergabe wie „Weltsystem“ würde die johanneische Bedeutung bereits auslegen und den Text unnötig verengen.
theological_decisions:
- issue: Identität dessen, der in den Glaubenden ist, und dessen, der in der Welt ist
  choice: Beide werden im Haupttext nur als „der, der ... ist“ bezeichnet.
  alternative: Den ersten ausdrücklich als Gott oder den Heiligen Geist und den zweiten als den Bösen beziehungsweise Satan benennen.
  rationale: Der Zusammenhang legt diese Identifizierungen nahe, doch der griechische Wortlaut lässt beide Bezugsgrößen unausgesprochen. Die Übersetzung bewahrt diese Spannung und erläutert die wahrscheinlichen Bezüge lediglich in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die johanneische Ausdrucksweise. „Aus Gott“ ist bewusst beibehalten; die elliptischen Personenbezeichnungen werden nicht dogmatisch ausgedeutet. Die Fußnotenmarker stehen jeweils an der sachlich passenden Stelle im Haupttext.
