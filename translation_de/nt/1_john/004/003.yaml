  to: Und jeder Geist, der Jesus nicht bekennt, ist nicht aus Gott.[a] Und dies ist der Geist des Antichristen,[b] von dem ihr gehört habt, dass er kommt; und schon jetzt ist er in der Welt.
  rationale: Die Revision stellt die direkte griechische Kopula-Aussage („dies ist“) wieder her, behält aber die für natürliches Deutsch gerechtfertigte kontextuelle Ergänzung „Geist“ bei. Die Pronomen dürfen sich dadurch grammatisch auf „Geist des Antichristen“ beziehen, ohne einen unmittelbaren Personenbezug auf den Antichristen zu erzwingen. Die Fußnote bewahrt sowohl die bedeutende längere Textvariante als auch die Ellipse des kritischen griechischen Textes.
