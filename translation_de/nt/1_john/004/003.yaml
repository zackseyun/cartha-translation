  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: de
  text: Und jeder Geist, der Jesus nicht bekennt, ist nicht aus Gott.[a] Und dies ist der Geist des Antichristen,[b] von dem ihr gehört habt, dass er kommt; und schon jetzt ist er in der Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „der nicht bekennt, dass Jesus Christus im Fleisch gekommen ist“.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich steht im Griechischen elliptisch: „Dies ist das des Antichristen.“ Gemeint ist im Zusammenhang der Geist des Antichristen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: jeder Geist
  rationale: Die distributive Verbindung bezeichnet jeden einzelnen geistlichen Einfluss bzw. Anspruch; im Deutschen ist „Geist“ als Substantiv großzuschreiben.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: Jesus bekennt
  rationale: „Bekennen“ bewahrt den Sinn eines ausdrücklichen, verbindlichen Bekenntnisses besser als das schwächere „anerkennen“; der kürzere Text des SBLGNT wird im Haupttext wiedergegeben.
- source_word: ἐκ τοῦ θεοῦ
  choice: aus Gott
  rationale: ἐκ bezeichnet Herkunft oder Ursprung; „aus Gott“ ist idiomatisch und entspricht zudem dem johanneischen Sprachgebrauch.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Darin zeigt sich der Geist des Antichristen
  rationale: Die griechische Wendung ist elliptisch; aus dem Kontext ist πνεῦμα zu ergänzen. Die Formulierung macht den Bezug verständlich, ohne das Neutrum fälschlich unmittelbar mit der Person des Antichristen gleichzusetzen.
- source_word: ἀντιχρίστου
  choice: des Antichristen
  rationale: Der Artikel verweist auf die den Lesern bekannte Erwartung des Antichristen; die bestimmte Form wird beibehalten.
- source_word: ὃ ἀκηκόατε ὅτι ἔρχεται
  choice: von dem ihr gehört habt, dass er kommt
  rationale: Das griechische Relativpronomen ist Neutrum und bezieht sich auf die elliptische Größe; nach der verständlich machenden Ergänzung „Geist“ ist im Deutschen der maskuline Rückbezug grammatisch erforderlich.
- source_word: καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη
  choice: und schon jetzt ist er in der Welt
  rationale: „Schon jetzt“ gibt die Verbindung von νῦν und ἤδη natürlich wieder und betont die gegenwärtige Wirksamkeit.
theological_decisions:
- issue: Textform des verweigerten Bekenntnisses
  choice: Im Haupttext steht gemäß SBLGNT die kürzere Lesart „Jesus nicht bekennt“.
  alternative: „nicht bekennt, dass Jesus Christus im Fleisch gekommen ist“
  rationale: Die längere Lesart dürfte den Wortlaut an Vers 2 angleichen. Sie wird als bedeutsame Textvariante in einer Fußnote bewahrt, aber nicht in den kritischen Haupttext eingefügt.
- issue: Ergänzung der Ellipse τὸ τοῦ ἀντιχρίστου
  choice: „der Geist des Antichristen“ wird für natürliches und klares Deutsch ergänzt.
  alternative: 'Wörtlicher: „das des Antichristen“ bzw. „das, was zum Antichristen gehört“'
  rationale: Das ausgelassene πνεῦμα ergibt sich unmittelbar aus dem ersten Satzteil. Die Ergänzung verbessert die Verständlichkeit, während die Fußnote die Ellipse des Ausgangstextes offenlegt.
- issue: Bezug des kommenden und bereits gegenwärtigen Phänomens
  choice: Die Pronomen beziehen sich auf den ergänzten „Geist des Antichristen“.
  alternative: Ein unmittelbarer Personenbezug auf den Antichristen
  rationale: Das griechische ὃ ist Neutrum und stützt zunächst den Bezug auf die vorherige elliptische Wendung, nicht eine stillschweigende Umdeutung auf eine männliche Person. Die Spannung zwischen angekündigtem Kommen und gegenwärtiger Wirksamkeit bleibt bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Aus Gott“ und „in der Welt“ bewahren die prägnante johanneische Ausdrucksweise. Die griechische Ellipse wird im Haupttext verständlich ergänzt und in der Fußnote transparent gemacht.
