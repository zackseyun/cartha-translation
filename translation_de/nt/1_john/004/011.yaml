id: 1JN.4.11
reference: 1 John 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: de
  text: Geliebte[a], wenn Gott uns so geliebt hat, sind auch wir verpflichtet, einander zu lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Lieben“. Die Anrede „Geliebte“ greift im Griechischen dasselbe Wortfeld auf wie „geliebt“ und „lieben“ im weiteren Satz.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die substantivierte Anrede bewahrt die Verbindung zum Wortfeld der Liebe (ἀγαπάω) und den herzlichen, theologisch geprägten Ton des Johannes.
- source_word: εἰ
  choice: wenn
  rationale: „Wenn“ erhält die griechische Bedingungsform; im Zusammenhang wird ihre Wahrheit vorausgesetzt, ohne dass dies in eine ausdrückliche Begründung umgedeutet wird.
- source_word: οὕτως
  choice: so
  rationale: „So“ kann sowohl auf die zuvor beschriebene Weise als auch auf das Ausmaß der Liebe Gottes zurückverweisen und bleibt im Deutschen knapp und natürlich.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und idiomatische Wiedergabe des Subjekts.
- source_word: ἠγάπησεν
  choice: geliebt hat
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des griechischen Aorists und bezeichnet hier Gottes erwiesene Liebe; zugleich bleibt das zentrale Liebesvokabular erhalten.
- source_word: ἡμᾶς
  choice: uns
  rationale: Direkte Wiedergabe des Akkusativobjekts.
- source_word: καὶ ἡμεῖς
  choice: auch wir
  rationale: Die Stellung gibt sowohl καί als auch die Hervorhebung des ausdrücklich gesetzten Pronomens wieder.
- source_word: ὀφείλομεν
  choice: sind … verpflichtet
  rationale: Die Formulierung drückt die moralische Verbindlichkeit von ὀφείλω deutlicher aus als ein bloß empfehlendes „sollten“, ohne einen Imperativ in den Text einzutragen.
- source_word: ἀλλήλους
  choice: einander
  rationale: Natürliche und präzise deutsche Wiedergabe des reziproken Pronomens.
- source_word: ἀγαπᾶν
  choice: zu lieben
  rationale: Natürliche Wiedergabe des ergänzenden Infinitivs; das wiederkehrende Wortfeld der Liebe bleibt sichtbar.
theological_decisions:
- issue: Aussagekraft des Bedingungssatzes εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: Die formale Bedingung wird mit „wenn Gott uns so geliebt hat“ beibehalten.
  alternative: „Da Gott uns auf diese Weise geliebt hat“ beziehungsweise „weil Gott uns so geliebt hat“.
  rationale: Der Zusammenhang setzt Gottes Liebe als wirklich voraus, doch der griechische Text formuliert rhetorisch eine Bedingung. „Wenn“ bewahrt diese Form und Spannung, statt sie ausdrücklich kausal aufzulösen.
- issue: Stärke der Verpflichtung in ὀφείλομεν
  choice: „sind … verpflichtet“
  alternative: „sollten“ oder „müssen“
  rationale: ὀφείλομεν bezeichnet eine aus Gottes Liebe erwachsende moralische Schuld beziehungsweise Verpflichtung. „Verpflichtet“ wahrt diesen Nachdruck, ohne die Aussage in einen direkten Befehl umzuwandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Geliebte“ erhält bewusst die dreifache Verbindung des griechischen Liebeswortfeldes; die mögliche ungewohnte Wirkung wird durch die Fußnote abgefedert. Der Satzbau bleibt nah am Original und zugleich gut verständlich.
