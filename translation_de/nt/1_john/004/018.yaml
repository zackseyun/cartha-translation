id: 1JN.4.18
reference: 1 John 4:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: de
  text: In der Liebe gibt es keine Furcht. Vielmehr treibt die vollkommene[a] Liebe die Furcht hinaus, denn die Furcht ist mit Strafe verbunden.[b] Wer sich aber fürchtet, ist in der Liebe nicht vollendet worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Vollkommen“ kann hier auch „vollständig“ oder „zur Reife gelangt“ bedeuten: Liebe, die zu ihrer vorgesehenen Fülle gekommen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn die Furcht hat Strafe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: Furcht / wer sich fürchtet
  rationale: „Furcht“ gibt den im Zusammenhang des Gerichts stehenden φόβος treffend wieder und bewahrt durch „fürchtet“ die Wiederholung des griechischen Wortstamms.
- source_word: ἀγάπῃ / ἀγάπη
  choice: Liebe
  rationale: Die übliche und natürliche Wiedergabe von ἀγάπη; der wiederholte Schlüsselbegriff bleibt einheitlich erhalten.
- source_word: τελεία
  choice: vollkommen
  rationale: „Vollkommen“ bezeichnet hier Liebe, die zu ihrer vorgesehenen Fülle gelangt ist, und hält zugleich die sprachliche Verbindung zu „vollendet worden“ aufrecht.
- source_word: ἔξω βάλλει
  choice: treibt … hinaus
  rationale: Die Formulierung bewahrt das Bild eines kraftvollen Hinauswerfens und klingt zugleich in modernem Deutsch natürlich.
- source_word: κόλασιν ἔχει
  choice: ist mit Strafe verbunden
  rationale: Diese idiomatische Formulierung wahrt die knappe Zuordnung von Furcht und Strafe, ohne ausdrücklich festzulegen, ob erwartete, gegenwärtige oder daraus folgende Strafe gemeint ist.
- source_word: τετελείωται
  choice: ist … nicht vollendet worden
  rationale: Das Perfekt Passiv wird als fortbestehendes Ergebnis eines Vollendungsvorgangs wiedergegeben; zugleich bleibt die Wortverbindung zu τελεία sichtbar.
- source_word: ἐν τῇ ἀγάπῃ
  choice: in der Liebe
  rationale: Die schlichte Präpositionalformulierung gibt den Beziehungs- beziehungsweise Wirkungsbereich des griechischen Ausdrucks angemessen wieder.
theological_decisions:
- issue: Bedeutung von „vollkommener Liebe“ und „nicht vollendet worden“
  choice: „vollkommene Liebe“ und „in der Liebe nicht vollendet worden“
  alternative: „reife Liebe“ und „in der Liebe nicht zur Reife gelangt“
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen der Vollkommenheit der Liebe und der noch nicht abgeschlossenen Vollendung des sich fürchtenden Menschen. Sie legt weder sündlose Vollkommenheit noch bloß emotionale Reife in den Text hinein.
- issue: Verhältnis von Furcht und Strafe
  choice: „die Furcht ist mit Strafe verbunden“
  alternative: „die Furcht rechnet mit Strafe“ oder wörtlich „die Furcht hat Strafe“
  rationale: Die Übersetzung erhält die im Griechischen offen formulierte Verbindung, ohne sie ausschließlich als subjektive Straferwartung oder als eindeutige Kausalfolge auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Furcht“ ist in diesem Gerichtszusammenhang präziser als das stärker psychologisch klingende „Angst“. Die Satzteilung verbessert die Lesbarkeit, ohne die gedanklichen Gegensätze des griechischen Textes aufzulösen.
