  text: ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: de
  text: Wer nicht liebt, hat Gott nicht erkannt[a], denn Gott ist Liebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kennt Gott nicht“. Der griechische Aorist kann hier auch mit dem deutschen Präsens wiedergegeben werden; „hat … nicht erkannt“ hebt hervor, dass ein solcher Mensch nicht dazu gelangt ist, Gott zu erkennen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Wer nicht liebt
  rationale: Der substantivierte Präsenspartizip bezeichnet allgemein einen Menschen, dessen Verhalten dadurch gekennzeichnet ist, dass er nicht liebt. Die deutsche Konstruktion mit „wer“ ist natürlich und bewahrt den generischen Sinn.
- source_word: ἀγαπῶν
  choice: liebt
  rationale: „Lieben“ gibt ἀγαπάω direkt wieder und erhält die erkennbare Wortverbindung zu ἀγάπη („Liebe“) im zweiten Satzteil.
- source_word: οὐκ ἔγνω
  choice: hat … nicht erkannt
  rationale: Das Perfekt gibt den griechischen Aorist hier idiomatisch wieder und kann sowohl das Nicht-zur-Erkenntnis-Gelangtsein als auch dessen gegenwärtige Folge ausdrücken. „Erkennen“ wahrt zudem den relationalen Sinn von γινώσκω besser als „verstehen“.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Direktes Objekt von ἔγνω; die übliche deutsche Wiedergabe benötigt keinen Artikel.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet die vorangehende Aussage. „Denn“ gibt diese kausale Funktion in einem würdigen, natürlichen deutschen Satz wieder.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Subjekt des Nominalsatzes; im Deutschen steht die Gottesbezeichnung hier ohne Artikel.
- source_word: ἀγάπη
  choice: Liebe
  rationale: Das abstrakte Substantiv bewahrt die prägnante Prädikatsaussage und die lexikalische Verbindung zu „liebt“.
- source_word: ἐστίν
  choice: ist
  rationale: Schlichte Wiedergabe der Kopula im Präsens ohne interpretierende Erweiterung.
theological_decisions:
- issue: Aussagekraft von „Gott ist Liebe“
  choice: Die substantivische Prädikatsaussage „Gott ist Liebe“ wird beibehalten.
  alternative: „Gott ist liebevoll“ oder die Umkehrung „Liebe ist Gott“
  rationale: Im Griechischen ist „Gott“ durch den Artikel als Subjekt gekennzeichnet und „Liebe“ das Prädikatsnomen. Die Übersetzung bewahrt die starke Aussage über Gottes Wesen bzw. Charakter, ohne sie umzukehren oder zu einer erschöpfenden Definition auszuweiten.
- issue: Aspekt und Sinn des Erkennens Gottes
  choice: „hat Gott nicht erkannt“
  alternative: „kennt Gott nicht“ oder „hat Gott nicht verstanden“
  rationale: Die Formulierung bewahrt die punktuelle Aoristform mit möglicher gegenwärtiger Folgewirkung und lässt den johanneischen relationalen Sinn des Erkennens bestehen, statt ihn auf intellektuelles Verstehen zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper und würdiger Form. „Wer nicht liebt“ ist idiomatischer als eine substantivierte Form wie „der Nichtliebende“. Die Wiederholung des Wortstamms in „liebt/Liebe“ bildet die griechische Verbindung ἀγαπῶν/ἀγάπη sichtbar ab.
