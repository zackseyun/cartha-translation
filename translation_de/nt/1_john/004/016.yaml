    issue: „ihr Glauben geschenkt“ ist in diesem Zusammenhang weniger natürlich als „an sie geglaubt“.
    rationale: πιστεύειν mit einem sachlichen Akkusativobjekt wird im Deutschen idiomatisch durch „an etwas glauben“ wiedergegeben. Die Revision bewahrt dabei die Parallelität der beiden Perfekte und den Bezug auf „die Liebe“.
