source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: de
  text: Und wir haben die Liebe erkannt, die Gott in uns hat[a], und an sie geglaubt. Gott ist Liebe, und wer in der Liebe bleibt, bleibt in Gott, und Gott bleibt in ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Liebe, die Gott zu uns hat“. Die griechische Wendung kann auch die Liebe bezeichnen, die in uns oder unter uns gegenwärtig ist.'
    reason: alternative_reading
  - marker: b
    text: „Ihm“ bezeichnet hier denjenigen Menschen, der in der Liebe bleibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: haben … erkannt
  rationale: Das Perfekt bezeichnet eine gewonnene Erkenntnis, die fortbesteht. Das deutsche Perfekt gibt dies natürlich wieder.
- source_word: πεπιστεύκαμεν
  choice: haben … Glauben geschenkt
  rationale: Das Perfekt bezeichnet einen zum gegenwärtigen Zeitpunkt bestehenden Glauben bzw. ein gefestigtes Vertrauen. Die Formulierung erlaubt, dass die Liebe als Inhalt und Gegenstand des Glaubens verstanden wird.
- source_word: τὴν ἀγάπην
  choice: die Liebe
  rationale: Der Artikel und der Bezug auf Gottes zuvor beschriebene Liebe werden bewahrt.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: die Gott in uns hat
  rationale: Dies bildet die örtliche Grundbedeutung von ἐν ἡμῖν unmittelbar ab und lässt offen, ob die Liebe in den Glaubenden oder in ihrer Gemeinschaft gegenwärtig ist. Die verbreitete Wiedergabe „zu uns“ bzw. „für uns“ ist möglich, aber stärker deutend.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Gott ist Liebe
  rationale: Die prädikative Aussage wird direkt und ohne erklärenden Zusatz wiedergegeben.
- source_word: ὁ μένων
  choice: wer … bleibt
  rationale: „Wer“ gibt das substantivierte Partizip im Deutschen allgemein und natürlich wieder; „bleibt“ bewahrt das johanneische Leitwort μένω.
- source_word: ἐν τῇ ἀγάπῃ
  choice: in der Liebe
  rationale: Der bestimmte Artikel wird beibehalten, weil die im Kontext bestimmte göttliche Liebe gemeint ist.
- source_word: ἐν τῷ θεῷ μένει
  choice: bleibt in Gott
  rationale: Die räumlich-relationale Formulierung und die Wiederholung von μένω werden bewahrt.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: Gott bleibt in ihm
  rationale: Das maskuline Singularpronomen wird formnah wiedergegeben und nimmt den durch „wer“ bezeichneten Menschen repräsentativ auf.
theological_decisions:
- issue: Bedeutung von ἐν ἡμῖν im ersten Satz
  choice: „in uns“ als bewusst offene örtliche Wiedergabe
  alternative: „unter uns“, „zu uns“ oder „für uns“
  rationale: ἐν bezeichnet primär „in/unter“. „In uns“ wahrt sowohl die Möglichkeit innerer Gegenwart als auch – im pluralischen Zusammenhang – gemeinschaftlicher Verwirklichung, ohne die Liebe ausschließlich als Gottes Zuwendung zu uns auszulegen.
- issue: Verhältnis von Erkennen und Glauben
  choice: Beide Perfektformen werden als fortbestehende, vollzogene Haltungen wiedergegeben
  alternative: 'Präsens: „wir kennen und glauben“'
  rationale: Die griechischen Perfekte blicken auf ein erfolgtes Erkennen und Glauben mit gegenwärtigem Bestand; die Übersetzung wahrt diese Spannung, ohne eine zeitliche Abfolge zu behaupten.
- issue: Repräsentative Bedeutung von αὐτῷ
  choice: „ihm“
  alternative: „diesem Menschen“ bzw. Wiederaufnahme mit „wer“
  rationale: Die grammatisch maskuline Singularform bleibt sichtbar; sie bezeichnet hier repräsentativ jeden Menschen, der in der Liebe bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „bleibt“ wird als bewusstes johanneisches Stilmerkmal erhalten. Die ungewöhnliche Wendung „die Gott in uns hat“ bleibt im Haupttext stehen, um die Mehrdeutigkeit von ἐν ἡμῖν nicht vorschnell zugunsten von „zu uns/für uns“ aufzulösen.
