  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: de
  text: 'Daran erkennt ihr den Geist Gottes: Jeder Geist, der bekennt, dass Jesus, der Messias,[a] im Fleisch gekommen ist,[b] stammt von Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“. Das griechische Χριστός bedeutet „Messias“ beziehungsweise „Gesalbter“ und wird hier als Titel verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Jesus, den im Fleisch gekommenen Messias, bekennt“. Das Griechische verwendet ein Perfektpartizip; es stellt Jesu Kommen als geschehen und weiterhin bedeutsam dar.'
    reason: formal_rendering
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Daran
  rationale: Die idiomatische deutsche Wendung führt das nachfolgende Erkennungsmerkmal ein und gibt den instrumentalen Sinn der griechischen Konstruktion wieder.
- source_word: γινώσκετε
  choice: erkennt ihr
  rationale: Die Form wird als Präsens Indikativ verstanden. „Erkennt“ passt im Zusammenhang der Prüfung und Unterscheidung von Geistern besser als das allgemeinere „wisst“.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: den Geist Gottes
  rationale: Artikel und Kontext sprechen für Gottes Geist als Gegenüber zu den zu prüfenden Geistern. Die Großschreibung folgt deutscher Konvention.
- source_word: πᾶν πνεῦμα
  choice: Jeder Geist
  rationale: Die distributive Form bezeichnet jeden einzelnen geistlichen Anspruch beziehungsweise jede geistliche Wirkmacht, die geprüft wird.
- source_word: ὁμολογεῖ
  choice: bekennt
  rationale: Das Verb bezeichnet ein zustimmendes, offenes Bekennen und wahrt den für den johanneischen Zusammenhang wichtigen Bekenntnischarakter.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, der Messias
  rationale: Χριστός wird als bedeutungsvoller Titel wiedergegeben. Die Apposition ist im Deutschen idiomatisch und hält Jesus und seinen messianischen Titel zusammen.
- source_word: ἐν σαρκὶ
  choice: im Fleisch
  rationale: Die konkrete Formulierung des Griechischen wird beibehalten; sie bekräftigt Jesu wirkliches leibliches Kommen, ohne spätere Fachsprache einzutragen.
- source_word: ἐληλυθότα
  choice: gekommen ist
  rationale: Der griechische Perfektpartizip wird in natürlichem Deutsch durch einen dass-Satz mit Perfekt wiedergegeben. So bleiben das geschehene Kommen und seine fortdauernde Bedeutung erkennbar.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: stammt von Gott
  rationale: „Stammt von“ drückt den durch ἐκ bezeichneten Ursprung in klarem, natürlichem Deutsch aus.
theological_decisions:
- issue: Bezug von τὸ πνεῦμα τοῦ θεοῦ
  choice: „den Geist Gottes“ als Bezeichnung für Gottes Geist
  alternative: „den Geist von Gott“ im allgemeineren Sinn eines von Gott stammenden Geistes
  rationale: Der bestimmte Singular wird im unmittelbaren Zusammenhang den vielen zu prüfenden Geistern gegenübergestellt und weist daher am ehesten auf Gottes Geist. Die Übersetzung macht darüber hinaus keine technische Aussage.
- issue: Christologische Aussage von ἐν σαρκὶ ἐληλυθότα
  choice: „dass Jesus, der Messias, im Fleisch gekommen ist“
  alternative: „Jesus, den im Fleisch gekommenen Messias, bekennt“
  rationale: 'Der dass-Satz ist im modernen Deutsch deutlich und bewahrt die Aussage des Perfektpartizips: Der bekannte Jesus, der Messias, ist wirklich im Fleisch gekommen. Technische Inkarnationssprache wird nicht hinzugefügt.'
- issue: Syntaktische Beziehung des Partizips zu Ἰησοῦν Χριστόν
  choice: Als Inhalt des Bekenntnisses in einem dass-Satz entfaltet
  alternative: 'Enger formal als attributive Akkusativfügung: „Jesus, den im Fleisch gekommenen Messias“'
  rationale: Das Griechische setzt Jesus Christus im Akkusativ und lässt das Partizip dazu kongruieren. Die gewählte deutsche Entfaltung vermittelt diese Beziehung verständlich, ohne eine zusätzliche theologische Deutung einzubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Daran erkennt ihr“ und „stammt von Gott“ sind natürlich und zugleich textnah. Der komplexe griechische Akkusativ mit Partizip wird zur besseren Verständlichkeit als dass-Satz wiedergegeben; die formal nähere Fassung steht in der Fußnote.
