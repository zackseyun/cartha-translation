source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: de
  text: 'Wenn jemand sagt: »Ich liebe Gott«, und seinen Bruder hasst, ist er ein Lügner. Denn wer seinen Bruder, den er gesehen hat, nicht liebt, kann Gott, den er nicht gesehen hat, nicht lieben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen Bruder oder seine Schwester«. Das griechische Wort steht im maskulinen Singular, kann hier aber repräsentativ gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Wenn jemand sagt
  rationale: ἐάν mit dem Aorist Konjunktiv εἴπῃ formuliert eine allgemeine Bedingung; »wenn jemand sagt« gibt die unbestimmte Aussage natürlich wieder.
- source_word: Ἀγαπῶ
  choice: Ich liebe
  rationale: Die schlichte Wiedergabe bewahrt die lexikalische Verbindung zu den weiteren Formen von ἀγαπάω im Vers.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: ἀδελφός steht im maskulinen Singular. »Bruder« bewahrt die Form des Ausgangstextes; die mögliche repräsentative Bedeutung wird in der Fußnote erläutert.
- source_word: μισῇ
  choice: hasst
  rationale: Das Präsens wird im Deutschen idiomatisch durch das einfache Präsens wiedergegeben.
- source_word: ψεύστης ἐστίν
  choice: ist er ein Lügner
  rationale: ψεύστης ist ein Prädikatsnomen und bezeichnet die Person kategorisch als Lügner, nicht lediglich ihre einzelne Aussage als unwahr.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: Denn wer … nicht liebt
  rationale: Das substantivierte Partizip wird durch den natürlichen deutschen Relativsatz »wer … nicht liebt« wiedergegeben; »denn« bewahrt die begründende Funktion von γάρ.
- source_word: ὃν ἑώρακεν
  choice: den er gesehen hat
  rationale: Das deutsche Perfekt entspricht hier dem griechischen Perfekt und bezeichnet ein Sehen mit gegenwärtiger Relevanz.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: kann … nicht lieben
  rationale: Die Formulierung bewahrt die starke Aussage über Unvermögen beziehungsweise Unmöglichkeit.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφός im Kontext der Glaubensgemeinschaft
  choice: Bruder
  alternative: Bruder oder Schwester; Glaubensbruder beziehungsweise Glaubensgeschwister
  rationale: Der Haupttext folgt dem maskulinen Singular des Griechischen, ohne den möglichen Bezug auf Glaubende beider Geschlechter zu leugnen; diese repräsentative Verwendung wird in der Fußnote offengelegt.
- issue: Aussagekraft von οὐ δύναται ἀγαπᾶν
  choice: kann Gott … nicht lieben
  alternative: ist nicht imstande, Gott zu lieben
  rationale: Die Übersetzung erhält die moralisch-geistliche Unmöglichkeit in der Argumentation des Johannes, ohne sie philosophisch oder konfessionell näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz »sagt … aber … hasst« wird klar und natürlich formuliert. Die Wiederholung von »lieben« bleibt erhalten. Der Fußnotenmarker steht am Versende, da er die beiden Vorkommen von »Bruder« im gesamten Satz betrifft.
