  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: de
  text: 'Darin besteht die Liebe: nicht darin, dass wir Gott geliebt haben, sondern darin, dass er uns geliebt und seinen Sohn als Sühnopfer für unsere Sünden gesandt hat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Sühne für unsere Sünden«. Das griechische Wort bezeichnet hier den Sohn als das Opfer, durch das die Sünden wirksam gesühnt werden; dabei können sowohl die Tilgung der Sünden als auch die Abwendung des göttlichen Gerichts mitgemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Darin besteht die Liebe
  rationale: Gibt die johanneische Wendung knapp und natürlich wieder und weist auf das Folgende als maßgeblichen Ausdruck der Liebe.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: nicht darin, dass ... sondern darin, dass
  rationale: Bewahrt die definierende Gegenüberstellung des Griechischen und stellt keine bloße Kausalbeziehung her.
- source_word: ἠγαπήκαμεν
  choice: wir Gott geliebt haben
  rationale: Das deutsche Perfekt bildet die griechische Perfektform verständlich ab und steht dem punktueller dargestellten Handeln Gottes gegenüber.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: er uns geliebt hat
  rationale: Die betonte Gegenüberstellung von menschlicher und göttlicher Liebe wird durch die Konstruktion »nicht ... sondern« ausreichend vermittelt.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn ... gesandt hat
  rationale: Bewahrt die für die johanneischen Schriften wichtige Sendungssprache und klingt zugleich würdig und natürlich.
- source_word: ἱλασμὸν
  choice: als Sühnopfer
  rationale: Bezeichnet verständlich das Opfer, durch das der Sohn wirksam mit den Sünden umgeht, ohne die umstrittene Frage einseitig auf Zornbesänftigung oder Sündentilgung zu verengen.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: für unsere Sünden
  rationale: Im Zusammenhang mit Opfersprache ist »für« die natürliche und sachlich passende Wiedergabe von περί.
theological_decisions:
- issue: Wiedergabe von ἱλασμός im sühnetheologisch sensiblen Zusammenhang
  choice: Sühnopfer
  alternative: Sühne; Opfer zur Tilgung unserer Sünden; Opfer, das Gottes Zorn abwendet
  rationale: »Sühnopfer« hält Opfercharakter und wirksamen Umgang mit Sünde zusammen. Die Fußnote benennt die Deutungsspannweite, ohne eine einzelne Sühnetheorie in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. »Darin besteht« ist idiomatischer als eine formale Nachbildung wie »Darin ist«. Die Parallelstruktur macht den theologischen Gegensatz deutlich, ohne ihn erklärend aufzulösen.
