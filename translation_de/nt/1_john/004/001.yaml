  naturalness: „Ihr Lieben“, „glaubt nicht jedem Geist“ und „prüft die Geister“ sind natürlich und angemessen. Für moderne Standardsprache ist „ob sie von Gott kommen“ klarer als „ob sie aus Gott sind“. „In die Welt hinausgegangen“ erhält das Bewegungsbild ohne die bei „hinausgezogen“ mögliche Assoziation eines dauerhaften Umzugs.
