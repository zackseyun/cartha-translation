id: 1JN.4.1
reference: 1 John 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: de
  text: Ihr Lieben[a], glaubt nicht jedem Geist, sondern prüft die Geister, ob sie von Gott kommen[b]; denn viele falsche Propheten sind in die Welt hinausgegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Geliebte“. Die griechische Anrede bedeutet wörtlich „Geliebte“ beziehungsweise „geliebte Menschen“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die Prüfung der geistlichen Quelle hinter prophetischen Ansprüchen; die falschen Propheten werden als menschliche Vermittler genannt.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ihr Lieben
  rationale: Die substantivierte Anrede gibt den warmen, von Liebe geprägten Ton natürlich wieder und bewahrt die sprachliche Verbindung zum johanneischen Liebeswortfeld.
- source_word: παντὶ πνεύματι
  choice: jedem Geist
  rationale: Die direkte Wiedergabe erhält die geistliche beziehungsweise übernatürliche Ebene des griechischen Textes, ohne den Ausdruck auf Menschen oder Äußerungen zu verengen.
- source_word: πιστεύετε
  choice: glaubt
  rationale: Der allgemeine verneinte Imperativ warnt davor, geistliche Ansprüche ungeprüft als wahr anzunehmen.
- source_word: δοκιμάζετε
  choice: prüft
  rationale: Das Verb bezeichnet eine Prüfung auf Echtheit oder Bewährung; „prüft“ ist präzise, geläufig und würdevoll.
- source_word: τὰ πνεύματα
  choice: die Geister
  rationale: Die wörtliche Wiedergabe bewahrt die Mehrdeutigkeit zwischen geistlichen Mächten, Quellen und den durch Menschen vermittelten prophetischen Ansprüchen.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: ob sie aus Gott sind
  rationale: „Aus Gott“ gibt die Herkunftsangabe ἐκ prägnant wieder. Das deutsche Pluralpronomen richtet sich natürlich nach „die Geister“.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: viele falsche Propheten
  rationale: Dies ist die direkte und im Deutschen etablierte Wiedergabe des Ausdrucks.
- source_word: ἐξεληλύθασιν
  choice: sind ... hinausgezogen
  rationale: Das Perfekt beschreibt ein vollzogenes Hinausgehen mit fortdauernder Gegenwartswirkung; die Formulierung erhält zudem das Bewegungsbild.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: Die Formulierung gibt den menschlichen Wirkungsraum wieder, ohne κόσμος durch eine stärker deutende Ergänzung einzuengen.
theological_decisions:
- issue: Bezug von „Geister“
  choice: Der Ausdruck bleibt als „Geister“ stehen und bezeichnet geistliche Quellen, die sich in prophetischen Ansprüchen zeigen.
  alternative: Nur menschliche Lehrer oder lediglich prophetische Äußerungen.
  rationale: Der folgende Hinweis auf falsche Propheten unterscheidet die menschlichen Akteure von den zu prüfenden Geistern, erklärt aber zugleich, wo diese Prüfung praktisch ansetzt. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller biblischer Anrede. „Ihr Lieben“ klingt gegenwärtig und herzlich; „Geister“ und „aus Gott“ bewahren bewusst die markante johanneische Ausdrucksweise.
