  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: mr
  text: आरंभी[b] शब्द होता, आणि शब्द देवाबरोबर होता, आणि शब्द देव होता.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: किंवा, “शब्द दैवी होता,” अथवा, “देव जसा होता तसाच शब्द होता.” अंतिम विधानातील “देव” हा ग्रीक शब्द गुणात्मक अर्थ सूचित करतो. तो शब्दाच्या दैवी स्वरूपावर भर देतो; परंतु आधीच्या विधानातील “देव” आणि शब्द यांना एकच व्यक्ती ठरवत नाही.
    reason: alternative_reading
  - marker: b
    text: “आरंभी” हा शब्द उत्पत्ति १:१ चा प्रतिध्वनी करतो आणि शब्दाचा संबंध सृष्टीच्या आरंभाशी जोडतो.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: आरंभी
  rationale: हे संक्षिप्त व नैसर्गिक मराठी रूप उत्पत्ति १:१ चा प्रतिध्वनी जपते आणि सृष्टीच्या आरंभाशी या विधानाचा संबंध राखते.
- source_word: ἦν
  choice: होता
  rationale: εἰμί या क्रियापदाच्या अपूर्ण भूतकाळी रूपाचा साधा, स्वाभाविक अनुवाद; तिन्ही विधानांतील लयही यामुळे टिकते.
- source_word: ὁ λόγος
  choice: शब्द
  rationale: λόγος येथे योहानाच्या प्रस्तावनेतील व्यक्तिवाचक व ख्रिस्तविषयक पदवी आहे. ‘शब्द’ हे देवाचे बोलणे, प्रकटीकरण आणि पुढे स्पष्ट होणारी वैयक्तिक ओळख यांचे अर्थछटांचे क्षेत्र अनावश्यक स्पष्टीकरण न घालता जपते.
- source_word: πρὸς τὸν θεόν
  choice: देवाबरोबर
  rationale: πρός येथे केवळ स्थान नव्हे तर निकट वैयक्तिक संबंध आणि तरीही भिन्नता सूचित करते. ‘देवाबरोबर’ हे आधुनिक मराठीत नैसर्गिक असून ‘देवाकडे’पेक्षा संदर्भातील सहवास अधिक स्पष्ट करते.
- source_word: τὸν θεόν
  choice: देव
  rationale: ग्रीक निश्चित उपपदासहित असलेले हे रूप विशिष्टपणे देवाचा निर्देश करते; मराठीत ‘देव’ या नावापूर्वी स्वतंत्र निश्चित उपपदाची गरज नाही.
- source_word: θεὸς ἦν ὁ λόγος
  choice: शब्द देव होता
  rationale: विधेय म्हणून क्रियापदापूर्वी आलेले उपपदविरहित θεός शब्दाचे स्वरूप देवाचेच असल्याचे ठळक करते, पण मागील विधानातील देव आणि शब्द यांची वैयक्तिक भिन्नता नाहीशी करत नाही. ‘शब्द देव होता’ हे थेट, स्वाभाविक आणि पूर्ण जोर राखणारे भाषांतर आहे.
theological_decisions:
- issue: अंतिम विधानातील उपपदविरहित विधेय θεός कसे व्यक्त करावे
  choice: शब्द देव होता
  alternative: शब्द दैवी होता; किंवा, देव जसा होता तसाच शब्द होता
  rationale: 'ग्रीक रचना येथे मुख्यतः गुणात्मक आहे: ती शब्दाचे स्वरूप पूर्णपणे देवाचे असल्याचे सांगते, तरी आधीच्या ‘देवाबरोबर’ या विधानातील वैयक्तिक भिन्नता राखते. मुख्य मजकुरातील सरळ भाषांतर मूळ विधानाचा जोर राखते; पर्यायी मांडण्या अर्थछटा दाखवण्यासाठी तळटीपेत दिल्या आहेत.'
translation_notes:
  register: आधुनिक प्रमाण मराठीतील सुबोध, गंभीर आणि पठणास योग्य शैली वापरली आहे. मूळ ग्रीकची त्रिखंडी पुनरुक्ती राखण्यासाठी ‘शब्द’ आणि ‘होता’ यांची पुनरावृत्ती जाणीवपूर्वक ठेवली आहे. तळटीप-चिन्हे ज्या आशयाचे स्पष्टीकरण करतात त्याच ठिकाणी ठेवली आहेत.
