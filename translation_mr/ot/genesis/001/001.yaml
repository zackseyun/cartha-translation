source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: mr
  text: आरंभी, देवाने आकाश व पृथ्वी निर्माण केली तेव्हा[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'परंपरेने याचे भाषांतर पूर्ण वाक्य म्हणून केले जाते: “आरंभी देवाने आकाश व पृथ्वी निर्माण केली.” हिब्रूमध्ये निर्धारक नसलेले בְּרֵאשִׁית आणि त्यानंतर आलेले सान्त क्रियापद בָּרָא यांमुळे हे उत्पत्ती 2:4ब प्रमाणे कालदर्शक गौण वाक्य म्हणून अधिक स्वाभाविकपणे वाचता येते. त्या वाचनात मुख्य वाक्य तिसऱ्या वचनात येते: “देव म्हणाला, ‘प्रकाश होवो.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: प्रारंभी, ... त्या वेळी
  rationale: उपपदविरहित בְּרֵאשִׁית आणि त्यानंतरचे सीमित क्रियापद בָּרָא यांमुळे हे वाक्य स्वतंत्र विधानापेक्षा कालदर्शक गौण वाक्य म्हणून अधिक स्वाभाविक वाचले जाते. ‘प्रारंभी’ רֵאשִׁיתचा अर्थ जपते, तर ‘त्या वेळी’ मराठीत गौण-वाक्यरचना स्पष्ट करते.
- source_word: בָּרָא
  choice: निर्माण केली
  rationale: בָּרָא हे देवाच्या सर्जनक्रियेसाठी वापरलेले प्रमाणित हिब्रू क्रियापद आहे. ‘निर्माण केली’ यंत्रणा किंवा पदार्थाविषयी अनावश्यक अर्थ न जोडता थेट अर्थ देते.
- source_word: אֱלֹהִים
  choice: देवाने
  rationale: शब्दाचे रूप आकाराने अनेकवचनी असले, तरी येथे त्याच्याबरोबर एकवचनी क्रियापद בָּרָא आले आहे; म्हणून संदर्भ एकवचनी ‘देव’ असा आहे. मराठी कर्तृ-करणी रचनेनुसार ‘देवाने’ वापरले.
- source_word: אֵת
  choice: '[स्वतंत्र भाषांतर नाही; निश्चित कर्मदर्शक चिन्ह]'
  rationale: אֵת हे हिब्रूमधील निश्चित प्रत्यक्ष कर्माचे व्याकरणिक चिन्ह असून मराठीत त्याला स्वतंत्र प्रतिशब्द आवश्यक नाही.
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: שָׁמַיִם चे रूप बहुवचनी/द्विवचनीसदृश असले तरी आधुनिक मराठीत या वैश्विक संदर्भात ‘आकाश’ हा नैसर्गिक आणि प्रतिष्ठित पर्याय आहे. ‘आकाश आणि पृथ्वी’ हा संपूर्ण सृष्टीचा निर्देश करणारा द्वंद्वप्रयोग आहे.
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ चा अर्थ ‘भूमी/देश’ किंवा ‘पृथ्वी’ होऊ शकतो; परंतु ‘आकाश’ याच्याबरोबरच्या वैश्विक द्वंद्वप्रयोगात ‘पृथ्वी’ अभिप्रेत आहे.
theological_decisions:
- issue: आरंभीच्या वाक्याची वाक्यरचना
  choice: 'कालदर्शक गौण वाक्य: ‘प्रारंभी, देवाने आकाश आणि पृथ्वी निर्माण केली, त्या वेळी—’'
  alternative: 'स्वतंत्र मुख्य वाक्य: ‘प्रारंभी देवाने आकाश आणि पृथ्वी निर्माण केली.’'
  rationale: उपपदविरहित בְּרֵאשִׁית, त्यानंतर आलेले सीमित क्रियापद בָּרָא, तसेच उत्पत्ती 2:4ब आणि होशेय 1:2 मधील समांतर कालदर्शक आरंभ यांमुळे गौण-वाक्य वाचनास प्राधान्य दिले. पारंपरिक स्वतंत्र-वाक्य वाचन तळटीपेत राखले आहे; अशा प्रकारे हिब्रूमधील खरी संदिग्धता आणि तिचा धर्मवैचारिक ताण न मिटवता सादर केला आहे.
translation_notes:
  register: आधुनिक प्रमाण मराठीतील सुबोध, प्रतिष्ठित शैली. कालदर्शक अवलंबित्व स्पष्ट करण्यासाठी ‘त्या वेळी’ वापरले असून शेवटचा दीर्घ विराम पुढील वचनांशी व्याकरणिक सलगता दर्शवतो. ‘आकाश आणि पृथ्वी’ हा मराठीत स्वाभाविक असलेला वैश्विक द्वंद्वप्रयोग राखला आहे.
