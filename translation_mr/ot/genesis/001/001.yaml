  naturalness: ‘प्रारंभी, देवाने आकाश आणि पृथ्वी निर्माण केली, त्या वेळी’ is grammatically cumbersome and reads as though ‘त्या वेळी’ is appended after an already complete clause. Recasting it as ‘आरंभी, देवाने आकाश व पृथ्वी निर्माण केली तेव्हा—’ gives natural Marathi temporal-clause order while retaining the hybrid force of ‘In the beginning, when …’.
  terminology: ‘देव,’ ‘निर्माण,’ ‘आकाश,’ and ‘पृथ्वी’ are clear, standard, and suitably elevated without adding doctrinal claims. In the footnote, ‘उपपद’ is not the best description of Hebrew anarthrousness; ‘निर्धारक नसलेले’ is more accurate. ‘सान्त क्रियापद’ is preferable to ‘सीमित क्रियापद’ for a finite verb in Marathi grammatical usage.
