  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: mr
  text: “श्वासांचा श्वास,” कोहेलेथ[b] म्हणतो, “श्वासांचा श्वास[a]; सर्व काही केवळ श्वास आहे.”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: हिब्रू הֶבֶל (हेवेल) याचा शब्दशः अर्थ ‘श्वास’ किंवा ‘वाफ’ असा होतो. या पुस्तकात हा शब्द ३८ वेळा येतो आणि तो क्षणभंगुर, पकडता न येणारे व अपेक्षेपेक्षा वेगळे ठरणारे वास्तव अशा जोडलेल्या अर्थछटा सूचित करतो. ‘श्वासांचा श्वास’ ही हिब्रूतील परमोत्कर्षाची रचना आहे—‘गीतांचे गीत’ किंवा ‘परमपवित्र स्थान’ यांसारखी.
    reason: lexical_choice
  - marker: b
    text: ‘कोहेलेथ’ ही हिब्रू पदवी किंवा नाव आहे. तिचे पारंपरिक भाषांतर ‘उपदेशक’ किंवा ‘शिक्षक’ असे केले जाते; परंतु प्रत्येक पर्याय मूळ अर्थाची व्याप्ती वेगवेगळ्या प्रकारे संकुचित करतो. म्हणून येथे लिप्यंतरण केले आहे.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל / הָבֶל (hevel)
  choice: श्वास / केवळ श्वास
  rationale: या शब्दाचा मूळ ठोस अर्थ ‘श्वास’ किंवा ‘वाफ’ असा आहे. उपदेशकाच्या पुस्तकात तो क्षणभंगुरता, हातात न सापडणारे स्वरूप आणि अपेक्षा व प्रत्यक्ष परिणाम यांतील विसंगती या परस्पर जोडलेल्या छटा वाहतो. ‘व्यर्थता’ किंवा ‘निरर्थकता’ यांसारखा एकच अमूर्त शब्द या अर्थछटा संकुचित करतो. विधेयातील ‘केवळ’ मूळ मजकुरातील अवमूल्यनात्मक जोर मराठीत स्वाभाविकपणे व्यक्त करतो.
- source_word: הֲבֵל הֲבָלִים
  choice: श्वासांचा श्वास
  rationale: हिब्रूतील ‘X चा X’ ही रचना परमोत्कर्ष दर्शवते. मराठीत ही रचना जपल्याने मूळ प्रतिमा आणि तीव्रता दोन्ही टिकतात.
- source_word: אָמַר
  choice: म्हणतो
  rationale: रूप भूतकाळी असले तरी ही साहित्यिक उक्ती सादर करणारी भाषिक चौकट आहे; मराठी वर्तमानकाळ विधानाला जिवंत आणि सूत्रात्मक ठेवतो.
- source_word: קֹהֶלֶת
  choice: कोहेलेथ
  rationale: या हिब्रू पदवीचे ‘उपदेशक’, ‘शिक्षक’ किंवा ‘सभासंचालक’ असे भाषांतर केल्यास तिचा अर्थ आधीच संकुचित होतो. लिप्यंतरण मूळची संदिग्धता जपते.
- source_word: הַכֹּל
  choice: सर्व काही
  rationale: मूळच्या व्यापक, सर्वसमावेशक जोरासाठी ही आधुनिक मराठीतील स्वाभाविक अभिव्यक्ती आहे.
theological_decisions:
- issue: कोहेलेथच्या मुख्य प्रतिमेचा הֶבֶל अर्थ कसा व्यक्त करावा
  choice: ‘श्वास’ ही ठोस प्रतिमा जपणे; विधेयात ‘केवळ श्वास’ वापरणे
  alternative: व्यर्थता, निरर्थकता, निष्फळता, क्षणभंगुरता, वाफ
  rationale: मूळ शब्द एकाच वेळी क्षणभंगुरता, अगम्यता आणि विसंगती सूचित करू शकतो. ‘निरर्थकता’ हा शब्द मजकुरात नसलेला सर्वंकष शून्यवाद सुचवू शकतो, तर ‘व्यर्थता’ किंवा ‘निष्फळता’ अर्थाला फक्त निष्फळ प्रयत्नांपुरते मर्यादित करू शकते. ठोस ‘श्वास’ ही प्रतिमा तात्त्विक ताण आणि अर्थाची मोकळीक जपते.
translation_notes:
  register: भाषा आधुनिक, सन्मानपूर्ण आणि सामान्य वाचकाला समजणारी ठेवली आहे. ‘श्वासांचा श्वास’ ही किंचित काव्यात्मक रचना मुद्दाम राखली आहे, कारण ती हिब्रू परमोत्कर्ष आणि पुस्तकाची मध्यवर्ती ठोस प्रतिमा दोन्ही जपते. अवतरणचिन्हे उक्तीची साहित्यिक चौकट स्पष्ट करतात.
