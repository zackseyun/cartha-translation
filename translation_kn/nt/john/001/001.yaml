id: JHN.1.1
reference: John 1:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: kn
  text: ಆದಿಯಲ್ಲಿ[b] ವಾಕ್ಯವಿತ್ತು; ವಾಕ್ಯವು ದೇವರೊಂದಿಗಿತ್ತು; ವಾಕ್ಯವು ದೇವರಾಗಿತ್ತು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ವಾಕ್ಯವು ದೈವಿಕವಾಗಿತ್ತು’; ಇಲ್ಲವೆ, ‘ದೇವರು ಎಂಥವರೋ ವಾಕ್ಯವೂ ಅಂಥದ್ದೇ ಆಗಿತ್ತು.’ ಕೊನೆಯ ಖಂಡದ ಗ್ರೀಕ್ ಪದರಚನೆ ‘ದೇವರು’ ಎಂಬುದನ್ನು ಗುಣಾತ್ಮಕವಾಗಿ ಬಳಸುತ್ತದೆ. ಅದು ವಾಕ್ಯದ ಪೂರ್ಣ ದೇವತ್ವವನ್ನು ದೃಢಪಡಿಸುವುದರ ಜೊತೆಗೆ, ಹಿಂದಿನ ಖಂಡದಲ್ಲಿ ಹೇಳಿದ ‘ದೇವರು’ ಮತ್ತು ವಾಕ್ಯದ ನಡುವಿನ ವ್ಯಕ್ತಿಗತ ಭೇದವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
    reason: alternative_reading
  - marker: b
    text: ‘ಆದಿಯಲ್ಲಿ’ ಎಂಬ ಆರಂಭಿಕ ಪದಬಂಧವು ಆದಿಕಾಂಡ 1:1ನ್ನು ಪ್ರತಿಧ್ವನಿಸಿ, ವಾಕ್ಯವನ್ನು ಸೃಷ್ಟಿಯ ಆರಂಭದೊಂದಿಗೆ ಜೋಡಿಸುತ್ತದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: ಆದಿಯಲ್ಲಿ
  rationale: ಇದು ಆದಿಕಾಂಡ 1:1ರ ಆರಂಭವನ್ನು ಪ್ರತಿಧ್ವನಿಸುತ್ತದೆ. ‘ಆದಿಯಲ್ಲಿ’ ಎಂಬುದು ಆ ಸಾಹಿತ್ಯಿಕ ಮತ್ತು ಸೃಷ್ಟಿಸಂಬಂಧಿ ನಂಟನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἦν
  choice: ಇತ್ತು
  rationale: εἰμί ಕ್ರಿಯಾಪದದ ಅಪೂರ್ಣ ಭೂತಕಾಲರೂಪವನ್ನು ಸರಳವಾಗಿ ಮತ್ತು ಪುನರಾವರ್ತಿತ ಲಯವನ್ನು ಉಳಿಸುವಂತೆ ‘ಇತ್ತು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. ‘ವಾಕ್ಯ’ ಎಂಬ ನಪುಂಸಕಲಿಂಗ ನಾಮಪದಕ್ಕೆ ಅನುಗುಣವಾಗಿ ‘ವಿತ್ತು/ಇತ್ತು’ ರೂಪಗಳು ಬಳಕೆಯಾಗಿವೆ.
- source_word: ὁ λόγος
  choice: ವಾಕ್ಯ
  rationale: λόγος ಇಲ್ಲಿ ಯೋಹಾನನ ಕ್ರಿಸ್ತಸಂಬಂಧಿ ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ‘ವಾಕ್ಯ’ ಎಂಬ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದವು ದೇವರ ಮಾತು, ಪ್ರಕಟಣೆ ಮತ್ತು ವ್ಯಕ್ತಿಗತ ಗುರುತು ಎಂಬ ಅರ್ಥವಲಯವನ್ನು ಅತಿಯಾಗಿ ವಿವರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: πρὸς τὸν θεόν
  choice: ದೇವರೊಂದಿಗೆ
  rationale: πρός ಇಲ್ಲಿ ದಿಕ್ಕಿಗಿಂತಲೂ ಸಂಬಂಧ ಮತ್ತು ಸಾನ್ನಿಧ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದೇವರೊಂದಿಗೆ’ ಎಂಬುದು ವಾಕ್ಯ ಮತ್ತು ದೇವರ ನಡುವಿನ ಭೇದವನ್ನೂ ಆಪ್ತ ಸಂಬಂಧವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸν θεόν
  choice: ದೇವರು
  rationale: ನಿರ್ದಿಷ್ಟ ಉಪಪದವಿರುವ ಗ್ರೀಕ್ ರೂಪವು ದೇವರನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ದೇವರು’ ಅದನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: θεὸς ἦν ὁ λόγος
  choice: ವಾಕ್ಯವು ದೇವರಾಗಿತ್ತು
  rationale: ಕ್ರಿಯಾಪದದ ಮೊದಲು ಉಪಪದವಿಲ್ಲದೆ ಬಂದ θεός ಮುಖ್ಯವಾಗಿ ವಾಕ್ಯದ ಸ್ವಭಾವವನ್ನು ವರ್ಣಿಸುತ್ತದೆ. ‘ವಾಕ್ಯವು ದೇವರಾಗಿತ್ತು’ ಎಂಬುದು ದೇವತ್ವದ ಪೂರ್ಣ ಬಲವನ್ನು ಉಳಿಸುತ್ತಾ, ಹಿಂದಿನ ಖಂಡದಲ್ಲಿನ ದೇವರು ಮತ್ತು ವಾಕ್ಯ ಒಂದೇ ವ್ಯಕ್ತಿ ಎಂದು ಅನಿವಾರ್ಯವಾಗಿ ಸಮೀಕರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಕೊನೆಯ ಖಂಡದಲ್ಲಿನ ಉಪಪದವಿಲ್ಲದ θεός ಪದದ ಅನುವಾದ
  choice: ವಾಕ್ಯವು ದೇವರಾಗಿತ್ತು
  alternative: ವಾಕ್ಯವು ದೈವಿಕವಾಗಿತ್ತು; ಅಥವಾ, ದೇವರು ಎಂಥವರೋ ವಾಕ್ಯವೂ ಅಂಥದ್ದೇ ಆಗಿತ್ತು
  rationale: 'ಗ್ರೀಕ್ ಪದಕ್ರಮವು ವಾಕ್ಯದ ಸ್ವಭಾವವನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ: ಅದು ವಾಕ್ಯದ ಪೂರ್ಣ ದೇವತ್ವವನ್ನು ದೃಢಪಡಿಸುತ್ತದೆ; ಜೊತೆಗೆ ಹಿಂದಿನ ಖಂಡದಲ್ಲಿ ‘ದೇವರು’ ಎಂದು ಉಲ್ಲೇಖಿಸಲಾದವರಿಂದ ವಾಕ್ಯವನ್ನು ವ್ಯಕ್ತಿಗತವಾಗಿ ಭಿನ್ನವಾಗಿರಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯವು ನೇರವಾದ ಅನುವಾದವನ್ನು ಉಳಿಸುತ್ತದೆ; ಗುಣಾತ್ಮಕ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಪರ್ಯಾಯ ರೂಪಗಳು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.'
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ‘ವಾಕ್ಯ’ ಎಂಬ ಸ್ಥಾಪಿತ ಧಾರ್ಮಿಕ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಆದರೆ ವಾಕ್ಯರಚನೆಯನ್ನು ಅತಿಯಾಗಿ ಪುರಾತನಗೊಳಿಸಿಲ್ಲ. ಅಡಿಕುರಿಪಿನ ಗುರುತುಗಳನ್ನು ಅವು ವಿವರಿಸುವ ಖಂಡಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
