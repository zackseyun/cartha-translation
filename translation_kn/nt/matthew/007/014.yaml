id: MAT.7.14
reference: Matthew 7:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಬಾಗಿಲು ಕಿರಿದಾಗಿದೆ ಮತ್ತು ಜೀವಕ್ಕೆ ನಡೆಸುವ ದಾರಿ ಕಷ್ಟಕರವಾಗಿದೆ; ಅದನ್ನು ಕಂಡುಕೊಳ್ಳುವವರು ಕೆಲವೇ ಜನ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: ಇಕ್ಕಟ್ಟಾಗಿದೆ
  rationale: ಬಾಗಿಲಿನ ಸೀಮಿತ ಅಗಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಕಿರಿದಾಗಿದೆ’ ಎಂಬುದಕ್ಕಿಂತ ಪ್ರವೇಶದ ಸಂಕೀರ್ಣತೆಯ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: τεθλιμμένη
  choice: ಕಷ್ಟಕರವಾಗಿದೆ
  rationale: ಪದದ ಮೂಲಭಾವವಾದ ಒತ್ತಡಕ್ಕೆ ಒಳಗಾದ/ಇಕ್ಕಟ್ಟಾದ ಸ್ಥಿತಿಯಿಂದ ಉಂಟಾಗುವ ಕಠಿಣತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಇಂಗ್ಲಿಷ್ ಪರಿಶೀಲನಾ ಪದರದ ‘hard’ಗೂ ಹೊಂದುತ್ತದೆ.
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: ಜೀವಕ್ಕೆ ನಡೆಸುವ
  rationale: ವರ್ತಮಾನ ಕೃದಂತದ ನಿರಂತರ ದಿಕ್ಕು ಮತ್ತು ಗುರಿಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὀλίγοι ... οἱ εὑρίσκοντες αὐτήν
  choice: ಅದನ್ನು ಕಂಡುಕೊಳ್ಳುವವರು ಕೆಲವೇ ಜನ
  rationale: ಮೂಲದ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡ ಪದಕ್ರಮದಲ್ಲಿ ಉಳಿಸಿ, ‘ಅದನ್ನು’ ಎಂಬುದು ದಾರಿಯನ್ನು ಸೂಚಿಸುವಂತೆ ಮಾಡುತ್ತದೆ.
theological_decisions:
- issue: ‘ಜೀವ’ ಎಂಬುದರ ಸ್ವರೂಪ
  choice: ಜೀವ
  alternative: ನಿತ್ಯಜೀವ
  rationale: ಮೂಲದಲ್ಲಿ ζωή ಮಾತ್ರ ಇದೆ; ‘ನಿತ್ಯ’ ಎಂದು ಸೇರಿಸಿ ಅರ್ಥವನ್ನು ಸಿದ್ಧಾಂತಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸದೆ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ದಾರಿಯ ಕಠಿಣತೆಯ ಅರ್ಥ
  choice: ಕಷ್ಟಕರವಾಗಿದೆ
  alternative: ಇಕ್ಕಟ್ಟಾಗಿದೆ / ಸಂಕೀರ್ಣವಾಗಿದೆ
  rationale: τεθλιμμένη ಪದದಲ್ಲಿರುವ ಒತ್ತಡ ಮತ್ತು ಸಂಕಟದ ಭಾವವನ್ನು ಓದುಗರಿಗೆ ಸಹಜವಾಗಿ ತಲುಪಿಸುತ್ತದೆ; ಅದು ಕೇವಲ ಭೌತಿಕವಾಗಿ ಕಿರಿದಾಗಿದೆ ಎಂದು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ಬಾಗಿಲು ಮತ್ತು ದಾರಿ ಎಂಬ ರೂಪಕಗಳನ್ನು ಉಳಿಸಿ, ಅನಗತ್ಯ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಗಳನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
