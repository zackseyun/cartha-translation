revisions:
- from: ಏಕೆಂದರೆ ಜೀವಕ್ಕೆ ನಡೆಸುವ ಬಾಗಿಲು ಇಕ್ಕಟ್ಟಾಗಿದೆ; ದಾರಿ ಕಷ್ಟಕರವಾಗಿದೆ. ಅದನ್ನು ಕಂಡುಕೊಳ್ಳುವವರು ಕೆಲವೇ ಜನ.
  to: ಏಕೆಂದರೆ ಬಾಗಿಲು ಕಿರಿದಾಗಿದೆ ಮತ್ತು ಜೀವಕ್ಕೆ ನಡೆಸುವ ದಾರಿ ಕಷ್ಟಕರವಾಗಿದೆ; ಅದನ್ನು ಕಂಡುಕೊಳ್ಳುವವರು ಕೆಲವೇ ಜನ.
  rationale: The revision replaces the less idiomatic ‘ಇಕ್ಕಟ್ಟಾಗಿದೆ’ with ‘ಕಿರಿದಾಗಿದೆ’ for the narrow gate and restores a clear coordinated structure in which ‘ಜೀವಕ್ಕೆ ನಡೆಸುವ’ modifies ‘ದಾರಿ.’ It retains ‘ಕಷ್ಟಕರವಾಗಿದೆ’ for the constrained/afflicted way, ‘ಜೀವ’ without theological expansion, and the explicit statement that few find it.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the causal opening, the contrastive imagery of gate and way, the destination ‘life,’ and the statement that few find the way. However, στενή more directly describes a narrow gate; ‘ಇಕ್ಕಟ್ಟಾಗಿದೆ’ normally describes a cramped condition or space and is less idiomatic for a gate. The Greek also directly coordinates the narrow gate with the afflicted/hard way that leads to life.
  naturalness: ‘ಬಾಗಿಲು ಇಕ್ಕಟ್ಟಾಗಿದೆ’ is somewhat unnatural in modern standard Kannada. ‘ಬಾಗಿಲು ಕಿರಿದಾಗಿದೆ’ is the normal, clear expression. Keeping the two coordinated clauses in one sentence improves public-reading flow and makes the modifier ‘ಜೀವಕ್ಕೆ ನಡೆಸುವ’ unambiguously modify ‘ದಾರಿ.’
  terminology: ‘ಜೀವ’ appropriately renders ζωή without adding ‘eternal.’ ‘ಕಷ್ಟಕರವಾಗಿದೆ’ is a natural contextual rendering of τεθλιμμένη and aligns with the English audit rendering ‘hard’; it avoids importing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘ಇಕ್ಕಟ್ಟಾಗಿದೆ’ is used for στενή with ‘ಬಾಗಿಲು.’
    rationale: While it can evoke restriction, it is not the most natural Kannada predicate for a gate and can suggest that the gate is in a cramped location rather than that its opening is narrow. ‘ಕಿರಿದಾಗಿದೆ’ directly and idiomatically conveys στενή.
  - severity: low
    issue: The phrase ‘ಜೀವಕ್ಕೆ ನಡೆಸುವ’ is fronted before ‘ಬಾಗಿಲು,’ and the gate/way clauses are separated by a semicolon and full stop.
    rationale: The intended reference remains recoverable, but the Greek explicitly describes the way as leading to life and coordinates the gate and way. Reordering improves syntactic clarity without altering meaning.
  revised_text: ಏಕೆಂದರೆ ಬಾಗಿಲು ಕಿರಿದಾಗಿದೆ ಮತ್ತು ಜೀವಕ್ಕೆ ನಡೆಸುವ ದಾರಿ ಕಷ್ಟಕರವಾಗಿದೆ; ಅದನ್ನು ಕಂಡುಕೊಳ್ಳುವವರು ಕೆಲವೇ ಜನ.
  revised_footnotes: []
  revision_rationale: The revision replaces the less idiomatic ‘ಇಕ್ಕಟ್ಟಾಗಿದೆ’ with ‘ಕಿರಿದಾಗಿದೆ’ for the narrow gate and restores a clear coordinated structure in which ‘ಜೀವಕ್ಕೆ ನಡೆಸುವ’ modifies ‘ದಾರಿ.’ It retains ‘ಕಷ್ಟಕರವಾಗಿದೆ’ for the constrained/afflicted way, ‘ಜೀವ’ without theological expansion, and the explicit statement that few find it.
