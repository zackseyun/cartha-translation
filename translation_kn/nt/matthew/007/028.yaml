  to: 'ಯೇಸು ಈ ಮಾತುಗಳನ್ನು ಹೇಳಿ ಮುಗಿಸಿದಾಗ ಹೀಗಾಯಿತು: ಜನಸಮೂಹಗಳು ಅವರ ಬೋಧನೆಗೆ ಬೆರಗಾದವು.'
  rationale: The revision restores the Greek narrative transition (Καὶ ἐγένετο) with idiomatic ‘ಹೀಗಾಯಿತು,’ while preserving the draft’s accurate and natural renderings of the temporal clause, completed discourse, plural crowds, and their response to Jesus’ teaching. The unnecessary footnote is removed.
