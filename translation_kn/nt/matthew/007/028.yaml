id: MAT.7.28
reference: Matthew 7:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: kn
  text: 'ಯೇಸು ಈ ಮಾತುಗಳನ್ನು ಹೇಳಿ ಮುಗಿಸಿದಾಗ ಹೀಗಾಯಿತು: ಜನಸಮೂಹಗಳು ಅವರ ಬೋಧನೆಗೆ ಬೆರಗಾದವು.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: …ಆಗ
  rationale: ಈ ಗ್ರೀಕ್ ಕಥನಸೂತ್ರವು ಹಿಂದಿನ ಘಟನೆಯಿಂದ ಅದರ ಫಲಿತಾಂಶದ ಕಡೆಗೆ ಸಾಗಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘…ಆಗ’ ಎಂಬ ರಚನೆ ಸಹಜವಾಗಿದ್ದು ಪೂರ್ಣ ಕಾಲಸಂಬಂಧವನ್ನು ತಿಳಿಸುತ್ತದೆ; ‘ಹೀಗಾಯಿತು’ ಎಂದು ಪ್ರತ್ಯೇಕವಾಗಿ ಸೇರಿಸುವುದು ಕನ್ನಡದಲ್ಲಿ ಭಾರವಾಗುತ್ತದೆ.
- source_word: ἐτέλεσεν
  choice: ಹೇಳಿ ಮುಗಿಸಿದಾಗ
  rationale: ಕ್ರಿಯಾಪದವು ಪೂರ್ಣಗೊಳಿಸುವ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ. λόγους ಎಂಬುದರೊಂದಿಗೆ ಕನ್ನಡದಲ್ಲಿ ‘ಮಾತುಗಳನ್ನು ಹೇಳಿ ಮುಗಿಸಿದಾಗ’ ಎನ್ನುವುದು ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ.
- source_word: τοὺς λόγους τούτους
  choice: ಈ ಮಾತುಗಳನ್ನು
  rationale: λόγοιಗೆ ‘ಮಾತುಗಳು’ ಅಥವಾ ‘ಹೇಳಿಕೆಗಳು’ ಎಂಬ ಅರ್ಥವಿರಬಹುದು. ಇಲ್ಲಿ ತಕ್ಷಣ ಹಿಂದಿನ ಉಪದೇಶವನ್ನು ಸೂಚಿಸುವ ಸರಳ, ಸಹಜ ಆಯ್ಕೆ ‘ಈ ಮಾತುಗಳು’.
- source_word: ἐξεπλήσσοντο
  choice: ಬೆರಗಾದವು
  rationale: ಈ ಪದವು ತೀವ್ರ ಆಶ್ಚರ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಜನರ ಸಮೂಹಿಕ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ; ಕನ್ನಡದ ‘ಬೆರಗಾದವು’ ಆ ಬಲವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ ὄχλοι
  choice: ಜನಸಮೂಹಗಳು
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಉಳಿಸಲು ‘ಜನಸಮೂಹಗಳು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; ಏಕವಚನ ‘ಜನಸಮೂಹ’ ಮೂಲದ ಸಂಖ್ಯೆಯನ್ನು ಸಮತಟ್ಟಾಗಿಸುತ್ತದೆ.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ಅವರ ಬೋಧನೆಗೆ
  rationale: ἐπί ಮತ್ತು ಚತುರ್ಥೀ ವಿಭಕ್ತಿ ಇಲ್ಲಿ ಬೆರಗಾಗುವಿಕೆಯ ಆಧಾರ ಅಥವಾ ಕಾರಣವನ್ನು ಸೂಚಿಸುತ್ತವೆ. ‘ಅವರ ಬೋಧನೆಗೆ’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಆ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಭಾಷಣದ ಉಲ್ಲೇಖ
  choice: ‘ಈ ಮಾತುಗಳು’ ಎಂಬುದನ್ನು ತಕ್ಷಣ ಹಿಂದಿನ ಯೇಸುವಿನ ಬೋಧನೆಗೆ ಸೂಚಿಸುವಂತೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಈ ಉಪದೇಶ’ ಅಥವಾ ‘ಈ ಪ್ರಸಂಗ’
  rationale: ಮೂಲದಲ್ಲಿ λόγους ಇದೆ; ನಿರ್ದಿಷ್ಟ ಧಾರ್ಮಿಕ ಅಥವಾ ಸಾಹಿತ್ಯಿಕ ಶೀರ್ಷಿಕೆಯನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ವ್ಯಾಪ್ತಿ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವ ಸೂಚಕ ಬಹುವಚನ ಸರ್ವನಾಮವನ್ನು ಬಳಸಿದ್ದು, ‘ಜನಸಮೂಹಗಳು’ ಎಂಬ ಬಹುವಚನಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಕ್ರಿಯಾಪದವನ್ನು ‘ಬೆರಗಾದವು’ ಎಂದು ರೂಪಿಸಲಾಗಿದೆ.
