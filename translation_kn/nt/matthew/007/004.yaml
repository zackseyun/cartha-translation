id: MAT.7.4
reference: Matthew 7:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: kn
  text: ಇಲ್ಲವೆ, ನೀನು ನಿನ್ನ ಸಹೋದರನಿಗೆ[a], ‘ನಿನ್ನ ಕಣ್ಣಿನಿಂದ ಆ ಚಿಕ್ಕ ಕಸವನ್ನು ತೆಗೆಯಲು ನನ್ನನ್ನು ಬಿಡು,’ ಎಂದು ಹೇಗೆ ಹೇಳುವೆ, ಇಗೋ, ನಿನ್ನ ಕಣ್ಣಿನಲ್ಲೇ ತೊಲೆ[b] ಇದೆ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಸಹೋದರ” ಎಂಬ ಗ್ರೀಕ್ ಪದವು ಪುಲ್ಲಿಂಗ ಏಕವಚನದಲ್ಲಿದೆ; ಇಲ್ಲಿ ಅದು ಪ್ರತಿನಿಧಿಕ ಅರ್ಥದಲ್ಲಿ ಸಹಶಿಷ್ಯನನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: cultural_note
  - marker: b
    text: “ತೊಲೆ” ಎಂಬುದನ್ನು “ತೀರುಮರ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಗ್ರೀಕ್ ಪದವು ಕಟ್ಟಡದಲ್ಲಿ ತೀರುವಾಗಿ ಬಳಸಬಹುದಾದ ದೊಡ್ಡ ಮರದ ತುಂಡನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: ಇಲ್ಲವೆ, ... ಹೇಗೆ ಹೇಳುವೆ?
  rationale: ἢ ಅನ್ನು ಹಿಂದಿನ ವಾದಕ್ಕೆ ಜೋಡಿಸುವ ಪರ್ಯಾಯ ಪ್ರಶ್ನೆಯಾಗಿ ‘ಇಲ್ಲವೆ’ ಎಂದೂ, ಭವಿಷ್ಯ ಸೂಚಕ ἐρεῖς ಅನ್ನು ‘ಹೇಳುವೆ’ ಎಂದೂ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τῷ ἀδελφῷ σου
  choice: ನಿನ್ನ ಸಹೋದರನಿಗೆ
  rationale: ಮೂಲದ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಕಲ್ಪಿತ ವ್ಯಕ್ತಿಗೆ ನೇರ ಸಂಬೋಧನೆ ಇದೆ.
- source_word: Ἄφες ἐκβάλω
  choice: ತೆಗೆಯಲು ಬಿಡು
  rationale: ಅನುಮತಿ ಕೇಳುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸ κάρφος
  choice: ಚಿಕ್ಕ ಕಸ
  rationale: ಕಣ್ಣಿನಲ್ಲಿರುವ ಒಣ ವಸ್ತುವಿನ ಸಣ್ಣ ತುಣುಕು ಎಂಬ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಮುಳ್ಳುಚೂರು’ ಎಂದರೆ ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾಗಬಹುದು.
- source_word: καὶ ἰδοὺ
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ἰδού ಪದದ ಬಲವನ್ನು ಸಂಕ್ಷಿಪ್ತ, ಗೌರವಯುತ ಮತ್ತು ಪ್ರಚಲಿತ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ δοκὸς
  choice: ತೊಲೆ
  rationale: δοκός ಸೂಚಿಸುವ ದೊಡ್ಡ ಮರದ ತೊಲೆ ಅಥವಾ ಕಟ್ಟಡದ ತೀರುಮರದ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಿ, ಸಣ್ಣ ಕಸದೊಡನೆಯ ಅತಿಶಯೋಕ್ತಿಯ ವೈರುಧ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: ನಿನ್ನ ಸ್ವಂತ ಕಣ್ಣಿನಲ್ಲೇ
  rationale: ಸ್ಥಳಾರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ಸಂದರ್ಭದಲ್ಲಿರುವ ತೀಕ್ಷ್ಣ ವೈರುಧ್ಯವನ್ನು ‘ಸ್ವಂತ’ ಮತ್ತು ‘-ಲೇ’ ಮೂಲಕ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἀδελφῷ ಪದದ ಲಿಂಗಸೂಚಕ ಅನುವಾದ
  choice: ಸಹೋದರ
  alternative: ಸಹೋದರ ಅಥವಾ ಸಹೋದರಿ; ಜೊತೆ ವಿಶ್ವಾಸಿ
  rationale: ಮೂಲವು ಪುಲ್ಲಿಂಗ ಏಕವಚನದಲ್ಲಿದೆ. ವ್ಯಾಪಕ ಪ್ರತಿನಿಧಿ ಅರ್ಥ ಸಾಧ್ಯವಾದರೂ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟೀಕರಿಸಿ ಮೂಲದ ರೂಪವನ್ನು ಬದಲಾಯಿಸಲಾಗಿಲ್ಲ.
- issue: κάρφος / δοκός ಅತಿಶಯೋಕ್ತಿಯ ವೈರುಧ್ಯ
  choice: ಚಿಕ್ಕ ಕಸ / ತೊಲೆ
  alternative: ಮರದ ಚೂರು / ದೊಡ್ಡ ಮರದ ತೊಲೆ; ಧೂಳಿನ ಕಣ / ತೀರುಮರ
  rationale: ಯೇಸುವಿನ ಉದ್ದೇಶಿತ ಅಸಮಾನ ಪ್ರಮಾಣದ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ವಸ್ತುಗಳ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಗೊಳಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ಪ್ರಶ್ನೆಯ ವಾಕ್ಯಕ್ರಮವನ್ನು ಕನ್ನಡಕ್ಕೆ ಹೊಂದಿಸಿ, ἰδού ಪದದ ಗಮನಸೆಳೆಯುವ ಬಲಕ್ಕೆ ‘ಇಗೋ’ ಮತ್ತು ವಾಕ್ಯಾಂತ್ಯದ ‘ಇದೆಯಲ್ಲ!’ ಬಳಸಿ ವಾಕ್ಚಾತುರ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
