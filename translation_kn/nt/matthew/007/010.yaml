id: MAT.7.10
reference: Matthew 7:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: kn
  text: ಅಥವಾ ಅವನು ಮೀನು ಕೇಳಿದರೆ—ಅವನಿಗೆ ಹಾವನ್ನು[a] ಕೊಡುವುದಿಲ್ಲವಲ್ಲವೇ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಸರ್ಪವನ್ನು.’
    reason: ὄφις ಎಂಬ ಗ್ರೀಕ್ ಪದಕ್ಕೆ ‘ಹಾವು’ ಅಥವಾ ‘ಸರ್ಪ’ ಎಂದು ಅನುವಾದಿಸಬಹುದು; ಆಧುನಿಕ ಸಾಮಾನ್ಯ ಕನ್ನಡಕ್ಕಾಗಿ ‘ಹಾವು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ.
lexical_decisions:
- source_word: ἢ καὶ
  choice: ಅಥವಾ
  rationale: ಮುಂದಿನ ಜೋಡಿ ಉದಾಹರಣೆಯನ್ನು ಪರಿಚಯಿಸುವ ವಿಭಜಕ ಸಂಪರ್ಕಪದ. ಇಲ್ಲಿ καί ಅನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸುವುದು ಕನ್ನಡದಲ್ಲಿ ಅನಗತ್ಯವಾಗಿ ಭಾರವಾಗುವುದರಿಂದ ‘ಅಥವಾ’ ಸಹಜವಾಗಿ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἰχθὺν
  choice: ಮೀನು
  rationale: ಮನೆಯ ಆಹಾರದ ಸನ್ನಿವೇಶಕ್ಕೆ ಸರಿಹೊಂದುವ ಸಾಮಾನ್ಯ ಅರ್ಥ.
- source_word: αἰτήσει
  choice: ಕೇಳಿದರೆ
  rationale: ರೂಪದಲ್ಲಿ ಭವಿಷ್ಯತ್ ಸೂಚಕವಾದರೂ ಇದು ಸಾಮಾನ್ಯ ಷರತ್ತಿನಂತಿರುವ ಉದಾಹರಣೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಕೇಳಿದರೆ’ ಸಹಜವಾಗಿ ಅದೇ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: μὴ
  choice: ಕೊಡುವನೇ?
  rationale: μή ನಿರಾಕಾರ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಪ್ರಶ್ನೆಯನ್ನು ಗುರುತಿಸುತ್ತದೆ. ಕನ್ನಡದ ಈ ಪ್ರಶ್ನಾರೂಪವು ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಖಂಡಿತ ಕೊಡುವುದಿಲ್ಲ’ ಎಂಬ ನಿರೀಕ್ಷಿತ ಉತ್ತರವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὄφιν
  choice: ಹಾವು
  rationale: ಆಧುನಿಕ ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ಪ್ರಾಣಿಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಪದ; ‘ಸರ್ಪ’ ಸಾಧ್ಯವಾದರೂ ಹೆಚ್ಚು ಸಾಹಿತ್ಯಿಕವಾಗಿದೆ.
- source_word: ἐπιδώσει
  choice: ಕೊಡುವನೇ
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಕ್ರಿಯಾಪದದ ಸರಳ ಅರ್ಥ ‘ಕೊಡು’; ಪ್ರಶ್ನಾರ್ಥಕ ರೂಪವು ಮೂಲದ ವಾಕ್ಚಾತುರ್ಯದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτῷ
  choice: ಅವನಿಗೆ
  rationale: ದತ್ತಿವ್ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಅವನಿಗೆ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ನಿರಾಕಾರ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ವಾಕ್ಚಾತುರ್ಯದ ಪ್ರಶ್ನೆ
  choice: ‘ಅವನಿಗೆ ಹಾವನ್ನು ಕೊಡುವನೇ?’ ಎಂಬ ಪ್ರಶ್ನಾರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಅವನಿಗೆ ಹಾವನ್ನು ಕೊಡುವುದಿಲ್ಲವಲ್ಲವೇ?’ ಎಂದು ಸ್ಪಷ್ಟ ನಿರಾಕಾರ ಟ್ಯಾಗ್ ಪ್ರಶ್ನೆಯಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ಮೂಲದ μή ಪ್ರಶ್ನೆಯು ನಿರಾಕಾರ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಕೊಡುವನೇ?’ ಎಂಬ ರೂಪವು ಸುತ್ತಲಿನ ತಂದೆ–ಮಗ ಉದಾಹರಣೆಯಲ್ಲಿ ಆ ನಿರೀಕ್ಷೆಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ನಿರಾಕಾರವನ್ನು ಹೇಳಿಕೆಯಾಗಿ ಪರಿವರ್ತಿಸದೆ ಮೂಲದ ಪ್ರಶ್ನಾತ್ಮಕ ಒತ್ತಡವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಸರಳ, ಆಧುನಿಕ, ಗೌರವಪೂರ್ಣ ಕನ್ನಡ. ಷರತ್ತು ಮತ್ತು ಮುಖ್ಯ ಪ್ರಶ್ನೆಯ ನಡುವಿನ ತೀಕ್ಷ್ಣ ವಾಕ್ಚಾತುರ್ಯದ ವಿರಾಮವನ್ನು ದೀರ್ಘಗೆರೆಯಿಂದ ಉಳಿಸಲಾಗಿದೆ.
