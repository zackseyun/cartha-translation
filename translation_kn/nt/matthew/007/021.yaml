id: MAT.7.21
reference: Matthew 7:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: kn
  text: ನನಗೆ, ‘ಕರ್ತನೇ, ಕರ್ತನೇ’ ಎಂದು ಹೇಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಪರಲೋಕದ ರಾಜ್ಯವನ್ನು[a] ಪ್ರವೇಶಿಸುವುದಿಲ್ಲ; ಬದಲಾಗಿ, ಪರಲೋಕದಲ್ಲಿರುವ[b] ನನ್ನ ತಂದೆಯ ಚಿತ್ತವನ್ನು ಮಾಡುವವನು ಪ್ರವೇಶಿಸುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಕ್ಷರಶಃ, “ಪರಲೋಕಗಳ ರಾಜ್ಯವನ್ನು.” ಮತ್ತಾಯನು ಈ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಪದೇಪದೇ ಬಳಸುತ್ತಾನೆ; ಇತರ ಸಂದರ್ಭಗಳಲ್ಲಿ “ದೇವರ ರಾಜ್ಯ” ಎಂದೂ ಬರುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲಿ “ಪರಲೋಕಗಳಲ್ಲಿ” ಎಂಬ ಬಹುವಚನವಿದೆ; ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ “ಪರಲೋಕದಲ್ಲಿ” ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: ನನ್ನನ್ನು ನೋಡಿ ... ಎಂದು ಹೇಳುವವರೆಲ್ಲರೂ ... ಪ್ರವೇಶಿಸುವುದಿಲ್ಲ
  rationale: 'Οὐ πᾶς ಎಂಬುದು ಸಂಪೂರ್ಣ ನಿರಾಕರಣೆಯಲ್ಲ, ಭಾಗಶಃ ನಿರಾಕರಣೆ: ‘ಹೇಳುವ ಯಾರೂ ಅಲ್ಲ’ ಎಂಬುದಕ್ಕಿಂತ ‘ಹೇಳುವವರೆಲ್ಲರೂ ಅಲ್ಲ.’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿರುವ ‘ಎಲ್ಲರೂ ... ಇಲ್ಲ’ ರಚನೆ ಇದನ್ನು ಉಳಿಸುತ್ತದೆ; μοι ಅನ್ನು ‘ನನ್ನನ್ನು ನೋಡಿ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.'
- source_word: Κύριε κύριε
  choice: ಕರ್ತನೇ, ಕರ್ತನೇ
  rationale: κύριοςಗೆ ಗೌರವಪೂರ್ಣವೂ ಕನ್ನಡ ಸಾಂಪ್ರದಾಯಿಕ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವೂ ಆದ ‘ಕರ್ತನು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ಸಂಬೋಧನೆಯ ಪುನರುಕ್ತಿಯನ್ನು ಒತ್ತನ್ನು ಉಳಿಸಲು ಯಥಾವತ್ತಾಗಿ ಇಡಲಾಗಿದೆ.
- source_word: εἰσελεύσεται
  choice: ಪ್ರವೇಶಿಸುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಪ್ರವೇಶಿಸುವನು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ಎರಡನೆಯ ಖಂಡದಲ್ಲಿ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕ್ರಿಯಾಪದ ಅಧ್ಯಾಹಾರವಾಗಿದ್ದರೂ, ಅರ್ಥಸ್ಪಷ್ಟತೆಗೆ ಕನ್ನಡದಲ್ಲಿ ಮತ್ತೆ ಹೇಳಲಾಗಿದೆ.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯವನ್ನು
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ τῶν οὐρανῶν ಎಂಬ ಬಹುವಚನ ರೂಪವನ್ನು ಕನ್ನಡದ ಸ್ಥಿರವಾದ, ಸಹಜವಾದ ‘ಪರಲೋಕ’ ಎಂಬ ಏಕವಚನ ಸಮೂಹಾರ್ಥ ಪದದಿಂದ ನೀಡಲಾಗಿದೆ; βασιλείαಗೆ ‘ರಾಜ್ಯ’ ಬಳಸಲಾಗಿದೆ.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: ಬದಲಾಗಿ ... ಮಾಡುವವನೇ
  rationale: ἀλλά ಸೂಚಿಸುವ ತೀಕ್ಷ್ಣ ವ್ಯತ್ಯಾಸವನ್ನು ‘ಬದಲಾಗಿ’ ಉಳಿಸುತ್ತದೆ. ನಿರ್ದಿಷ್ಟ ಏಕವಚನದ articular participle ಅನ್ನು ‘ಮಾಡುವವನೇ’ ಎಂದು ನೀಡಿ ವಿರುದ್ಧತೆಯ ಒತ್ತನ್ನು ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: τὸ θέλημα
  choice: ಚಿತ್ತವನ್ನು
  rationale: θέλημαಗೆ ಈ ದೇವತಾತ್ಮಕ-ನೈತಿಕ ಸಂದರ್ಭದಲ್ಲಿ ಕನ್ನಡದಲ್ಲಿ dignified ಮತ್ತು ಪರಿಚಿತವಾದ ‘ಚಿತ್ತ’ ಸೂಕ್ತ; ಇದು ತಂದೆಯ ಉದ್ದೇಶ/ಇಚ್ಛೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿವರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: τοῦ πατρός μου
  choice: ನನ್ನ ತಂದೆಯ
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧ ಮತ್ತು ಯೇಸುವಿನ ಪುತ್ರಸಂಬಂಧದ ಭಾಷೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: ಪರಲೋಕದಲ್ಲಿರುವ
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನ ‘ಆಕಾಶಗಳು/ಪರಲೋಕಗಳು’ ಎಂಬುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಏಕವಚನ ‘ಪರಲೋಕ’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಪದಗುಚ್ಛವು ‘ನನ್ನ ತಂದೆ’ಯನ್ನು ವಿಶೇಷಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವನ್ನು ಬಾಯಿಂದ ‘ಕರ್ತನು’ ಎಂದು ಕರೆಯುವುದಕ್ಕೂ ತಂದೆಯ ಚಿತ್ತವನ್ನು ಮಾಡುವುದಕ್ಕೂ ಇರುವ ಸಂಬಂಧ
  choice: ಕೇವಲ ಮಾತಿನ ಸಂಬೋಧನೆ ಮತ್ತು ತಂದೆಯ ಚಿತ್ತವನ್ನು ನಿಜವಾಗಿ ಮಾಡುವುದರ ನಡುವಿನ ಪಾಠದ ಸ್ಪಷ್ಟ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ಕೃತ್ಯಗಳಿಂದಲೇ ರಕ್ಷಣೆ ದೊರೆಯುತ್ತದೆ ಎಂಬ ಪೂರ್ಣ ಸಿದ್ಧಾಂತವಾಗಲಿ, ಮಾತಿನ ಅಂಗೀಕಾರ ಮಾತ್ರ ಸಾಕು ಎಂಬ ಸಿದ್ಧಾಂತವಾಗಲಿ ವಿವರಿಸುವುದು.
  rationale: ವಚನವು ಹೇಳುವುದನ್ನೂ ಮಾಡುವುದನ್ನೂ ವಿರುದ್ಧವಾಗಿ ನಿಲ್ಲಿಸುತ್ತದೆ; ಆದರೆ ರಕ್ಷಣೆಯ ಸಂಪೂರ್ಣ ಸಿದ್ಧಾಂತವನ್ನು ಇಲ್ಲಿ ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ದೇವತಾತ್ಮಕ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ‘ಕರ್ತನೇ’ ಮತ್ತು ‘ಚಿತ್ತ’ ಪದಗಳು ಬೈಬಲ್ ಭಾಷೆಗೆ ಪರಿಚಿತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತಿವೆ. ಗ್ರೀಕ್‌ನ ಭಾಗಶಃ ನಿರಾಕರಣೆ ಮತ್ತು ಎರಡೂ ಖಂಡಗಳ ತೀಕ್ಷ್ಣ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
