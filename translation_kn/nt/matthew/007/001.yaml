review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the prohibition and preserves the lexical correspondence between κρίνετε and κριθῆτε. However, «ನಿಮಗೂ» introduces an unnecessary additive nuance (“you also”), not explicitly present in the Greek, and the compound verbal spelling should be separated in modern standard Kannada.
  naturalness: «ತೀರ್ಪು ಮಾಡಬೇಡಿ» and «ತೀರ್ಪು ಆಗುವುದಿಲ್ಲ» are more natural and orthographically standard than the unspaced forms. The revised sentence remains concise and appropriately elevated for scripture.
  terminology: «ತೀರ್ಪು ಮಾಡು» is a suitably broad rendering of κρίνω and avoids prematurely narrowing it to condemnation. Repeating «ತೀರ್ಪು» appropriately reflects the Greek rhetorical repetition without imposing an interpretation.
  issues:
  - severity: low
    issue: Unspaced compound verb forms
    rationale: Modern standard Kannada ordinarily writes these as «ತೀರ್ಪು ಮಾಡಬೇಡಿ» and «ತೀರ್ಪು ಆಗುವುದಿಲ್ಲ», improving readability without changing meaning.
  - severity: low
    issue: «ನಿಮಗೂ» adds an additive implication
    rationale: The Greek passive subjunctive means that the hearers will not be judged; it does not expressly include an additive “also.” «ನಿಮಗೆ» conveys the passive/impersonal Kannada construction without this added nuance.
  revised_text: ತೀರ್ಪು ಮಾಡಬೇಡಿ; ಆಗ ನಿಮಗೆ ತೀರ್ಪು ಆಗುವುದಿಲ್ಲ.
