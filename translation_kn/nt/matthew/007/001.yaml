id: MAT.7.1
reference: Matthew 7:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: kn
  text: ತೀರ್ಪು ಮಾಡಬೇಡಿ; ಆಗ ನಿಮಗೆ ತೀರ್ಪು ಆಗುವುದಿಲ್ಲ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: ತೀರ್ಪುಮಾಡಬೇಡಿ
  rationale: μή ಜೊತೆಯಲ್ಲಿರುವ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕ ರೂಪವು ನಿಷೇಧವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. κρίνω ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ನಿಷೇಧಾತ್ಮಕ ಆಜ್ಞೆಯಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἵνα μὴ
  choice: ಆಗ ... ಆಗುವುದಿಲ್ಲ
  rationale: ಇಲ್ಲಿ ἵνα ಉದ್ದೇಶ ಅಥವಾ ಫಲಿತಾಂಶದ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ‘ಆಗ’ ಎಂಬುದು ಮೊದಲ ಆಜ್ಞೆ ಮತ್ತು ಅದರ ಪರಿಣಾಮದ ನಡುವಿನ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: κριθῆτε
  choice: ನಿಮಗೂ ತೀರ್ಪಾಗುವುದಿಲ್ಲ
  rationale: κρίνω ಎಂಬ ಅದೇ ಮೂಲಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ‘ತೀರ್ಪು’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ. ಕರ್ಮಣಿ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುವುದರ ಜೊತೆಗೆ, ‘ನಿಮಗೂ’ ಎಂಬುದು ತೀರ್ಪು ಮಾಡುವವರ ಮೇಲೆಯೂ ತೀರ್ಪು ಬರುವ ಪರಸ್ಪರ ಸಂಬಂಧವನ್ನು ತೋರಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ನಿಷೇಧದಲ್ಲಿ κρίνω ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ‘ಖಂಡಿಸಬೇಡಿ’ ಎಂದು ಅರ್ಥವನ್ನು ಕಿರಿದಾಗಿಸದೆ, ವಿಶಾಲವಾದ ‘ತೀರ್ಪುಮಾಡಬೇಡಿ’ ಎಂಬ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಿಕೊಳ್ಳಲಾಗಿದೆ.
  alternative: ಖಂಡಿಸಬೇಡಿ; ಆಗ ನೀವೂ ಖಂಡಿಸಲ್ಪಡುವುದಿಲ್ಲ.
  rationale: ಈ ವಚನದಲ್ಲೇ ನೈತಿಕ ವಿವೇಚನೆಯ ಎಲ್ಲ ಮಿತಿಗಳನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ; ತಕ್ಷಣದ ಸಂದರ್ಭವು ನಿಷೇಧದ ಸ್ವರೂಪವನ್ನು ವಿವರಿಸುತ್ತದೆ. ವಿಶಾಲ ಪದವನ್ನು ಉಳಿಸುವುದು ಮೂಲದ ಅರ್ಥಸಾಧ್ಯತೆ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಸಂರಕ್ಷಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಮೂಲ ಗ್ರೀಕ್‌ನ ಎರಡು ಸಮಾನಧಾತು ಕ್ರಿಯಾರೂಪಗಳ ವಾಕ್ಚಾತುರ್ಯವನ್ನು ‘ತೀರ್ಪು’ ಎಂಬ ಪದದ ಪುನರಾವರ್ತನೆಯಿಂದ ಉಳಿಸಲಾಗಿದೆ.
