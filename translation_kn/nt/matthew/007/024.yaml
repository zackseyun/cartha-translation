id: MAT.7.24
reference: Matthew 7:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ನನ್ನ ಈ ಮಾತುಗಳನ್ನು ಕೇಳಿ ಅವುಗಳಂತೆ ನಡೆಯುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಬಂಡೆಯ ಮೇಲೆ ತನ್ನ ಮನೆಯನ್ನು ಕಟ್ಟಿದ ವಿವೇಕಿಯಾದ ಮನುಷ್ಯನಿಗೆ[b] ಹೋಲಿಸಲ್ಪಡುವನು[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ವಿವೇಕಿಯಾದ ಮನುಷ್ಯನಿಗೆ ಹೋಲಿಸಲಾಗುವನು’ ಅಥವಾ ‘ವಿವೇಕಿಯಾದ ಮನುಷ್ಯನಂತಿರುವನು.’
    reason: lexical_alternative
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ವಿವೇಕಿಯಾದ ಮನುಷ್ಯ’; ಮೂಲಪಠ್ಯದ ಉಪಮೆ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಪುಲ್ಲಿಂಗದಲ್ಲಿದೆ.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: ಆದ್ದರಿಂದ ... ಪ್ರತಿಯೊಬ್ಬನೂ
  rationale: οὖν ಹಿಂದಿನ ಬೋಧನೆಯಿಂದ ಬರುವ ನಿರ್ಣಯವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದ್ದರಿಂದ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. Πᾶς ... ὅστις ವಿತರಕವಾದ ಸಾಮಾನ್ಯ ಅರ್ಥ ಹೊಂದಿರುವುದರಿಂದ ‘ಪ್ರತಿಯೊಬ್ಬನೂ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: ನನ್ನ ಈ ಮಾತುಗಳನ್ನು ಕೇಳಿ
  rationale: λόγοι ಇಲ್ಲಿ ಯೇಸುವಿನ ಮಾತುಗಳು ಅಥವಾ ಬೋಧನೆಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮಾತುಗಳು’ ಸಹಜವೂ ನೇರವೂ ಆಗಿದೆ. μου ಎಂಬ ಸಂಬಂಧವನ್ನು ‘ನನ್ನ’ ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ ποιεῖ αὐτούς
  choice: ಅವುಗಳಂತೆ ನಡೆಯುವ
  rationale: ಪದಶಃ ‘ಅವುಗಳನ್ನು ಮಾಡುವ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗಬಹುದು. ಇಲ್ಲಿ ಕೇಳಿದ ಮಾತುಗಳನ್ನು ಆಚರಣೆಗೆ ತರುವ ಅರ್ಥವನ್ನು ‘ಅವುಗಳಂತೆ ನಡೆಯುವ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁμοιωθήσεται
  choice: ಹೋಲಿಸಲ್ಪಡುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ‘ಹೋಲಿಸಲ್ಪಡುವನು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ಇದು ‘ಹಾಗಿರುವನು’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಒಳಗೊಂಡ ಹೋಲಿಕೆಯ ಭಾಷೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἀνδρὶ φρονίμῳ
  choice: ವಿವೇಕಿಯಾದ ಮನುಷ್ಯನಿಗೆ
  rationale: ἀνήρ ಇಲ್ಲಿ ಪುರುಷನನ್ನು ಸೂಚಿಸುತ್ತದೆ; φρόνιμος ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ವಿವೇಕಿ ಅಥವಾ ಜಾಣ ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ. ‘ವಿವೇಕಿಯಾದ ಮನುಷ್ಯ’ dignified modern Kannada ರೂಪವಾಗಿದೆ.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: ತನ್ನ ಮನೆಯನ್ನು ಕಟ್ಟಿದ
  rationale: αὐτοῦ ಯ ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ಕನ್ನಡದ ಪ್ರತಿಬಿಂಬಕ ಸರ್ವನಾಮ ‘ತನ್ನ’ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; οἰκία ಮತ್ತು οἰκοδομέωಗಳನ್ನು ‘ಮನೆ’ ಮತ್ತು ‘ಕಟ್ಟು’ ಎಂದು ನೇರವಾಗಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἐπὶ τὴν πέτραν
  choice: ಬಂಡೆಯ ಮೇಲೆ
  rationale: πέτρα ಗಟ್ಟಿಯಾದ ಬಂಡೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಬಂಡೆಯ ಮೇಲೆ’ ಮೂಲದ ನಿರ್ಮಾಣ-ರೂಪಕವನ್ನು ಅತಿವಿವರಣೆ ಇಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಉಪಮೆಯಲ್ಲಿನ ಲಿಂಗಸೂಚಿತ ಪ್ರತಿನಿಧಿ ಭಾಷೆ
  choice: ವಿವೇಕಿಯಾದ ಮನುಷ್ಯನಿಗೆ
  alternative: ವಿವೇಕಿಯಾದ ವ್ಯಕ್ತಿಗೆ
  rationale: ಗ್ರೀಕ್ ἀνήρ ನಿರ್ದಿಷ್ಟವಾಗಿ ಪುರುಷನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಉಪಮೆಯ ವ್ಯಾಕರಣಾತ್ಮಕ ಪುಲ್ಲಿಂಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ವಾಕ್ಯದ ಆರಂಭದ ‘ಪ್ರತಿಯೊಬ್ಬನೂ’ ಅದರ ಸಾಮಾನ್ಯ ಅನ್ವಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- issue: ὁμοιωθήσεται ಎಂಬ ಕರ್ಮಣಿ ರೂಪದ ಅರ್ಥ
  choice: ಹೋಲಿಸಲ್ಪಡುವನು
  alternative: ಹಾಗಿರುವನು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪ ಮತ್ತು ಹೋಲಿಕೆಯ ಸ್ವಲ್ಪ ಅಧಿಕೃತ ಶೈಲಿಯನ್ನು ಉಳಿಸಲು ‘ಹೋಲಿಸಲ್ಪಡುವನು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ಇದು ಯಾರಿಂದ ಹೋಲಿಸಲಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ‘ಅವುಗಳಂತೆ ನಡೆಯುವ’ ಎಂಬುದು ಪದಶಃ ‘ಅವುಗಳನ್ನು ಮಾಡುವ’ ಬದಲಾಗಿ ಕನ್ನಡದಲ್ಲಿ ಆಚರಣೆಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತರುತ್ತದೆ; ‘ಹೋಲಿಸಲ್ಪಡುವನು’ ಮೂಲದ ಭವಿಷ್ಯ ಕರ್ಮಣಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
