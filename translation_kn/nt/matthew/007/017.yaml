id: MAT.7.17
reference: Matthew 7:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: kn
  text: ಹೀಗೆ[a], ಪ್ರತಿಯೊಂದು ಒಳ್ಳೆಯ ಮರವು ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳನ್ನು ಕೊಡುತ್ತದೆ; ಆದರೆ ಕೊಳೆತ[b] ಮರವು ಕೆಟ್ಟ ಹಣ್ಣುಗಳನ್ನು ಕೊಡುತ್ತದೆ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಹೀಗೆ’ ಎಂಬುದನ್ನು ‘ಹಾಗೆಯೇ’ ಅಥವಾ ‘ಅದೇ ರೀತಿಯಲ್ಲಿ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಕೊಳೆತ’ ಎಂಬುದು ಗ್ರೀಕ್ σαπρόν ಪದದ ಅನುವಾದವಾಗಿದೆ; ಇದನ್ನು ‘ಹಾಳಾದ,’ ‘ಕೆಟ್ಟ,’ ಅಥವಾ ‘ಭ್ರಷ್ಟವಾದ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: c
    text: ‘ಕೆಟ್ಟ ಹಣ್ಣುಗಳು’ ಎಂಬುದನ್ನು ‘ದುಷ್ಟ ಹಣ್ಣುಗಳು’ ಅಥವಾ ‘ನಿಷ್ಪ್ರಯೋಜಕ ಹಣ್ಣುಗಳು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಇಲ್ಲಿ ಕೃಷಿ ರೂಪಕಕ್ಕೆ ಸಹಜವಾದ ‘ಕೆಟ್ಟ’ ಎಂಬ ಪದವು ಸಂದರ್ಭದ ನೈತಿಕ ಸೂಚನೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ಹಾಗೆಯೇ
  rationale: ಹಿಂದಿನ ಉದಾಹರಣೆಯಿಂದ ಬರುವ ಹೋಲಿಕೆ ಅಥವಾ ನಿರ್ಣಯದ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πᾶν δένδρον
  choice: ಪ್ರತಿಯೊಂದು ... ಮರವು
  rationale: ಏಕವಚನ ನಾಮಪದದೊಂದಿಗೆ πᾶν ಹೊಂದಿರುವ ವಿತರಣಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀγαθὸν
  choice: ಒಳ್ಳೆಯ
  rationale: ಮರದ ಸಕಾರಾತ್ಮಕ ಗುಣವನ್ನು ಸರಳವಾಗಿ ಸೂಚಿಸಿ, ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳೊಂದಿಗಿನ ಸಮಾಂತರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καρποὺς καλοὺς
  choice: ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳನ್ನು
  rationale: καλός ಇಲ್ಲಿ ಗುಣಮಟ್ಟದ ದೃಷ್ಟಿಯಿಂದ ಒಳ್ಳೆಯದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕೃಷಿ ರೂಪಕದಲ್ಲಿ ಇದು ಸಹಜವಾಗಿದೆ.
- source_word: ποιεῖ
  choice: ಕೊಡುತ್ತದೆ
  rationale: ಮರವು ಹಣ್ಣು ಕೊಡುವುದೆಂಬ ಕನ್ನಡದ ಸಹಜ ನುಡಿಗಟ್ಟನ್ನು ಬಳಸುತ್ತದೆ; ಗ್ರೀಕ್ ಕ್ರಿಯೆಯ ಫಲೋತ್ಪಾದನೆಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸ δὲ
  choice: ಆದರೆ ... ಮರವು
  rationale: δέ ಸೂಚಿಸುವ ಎರಡು ಬಗೆಯ ಮರಗಳ ನಡುವಿನ ವಿರೋಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: σαπρὸν
  choice: ಕೊಳೆತ
  rationale: σαπρός ಪದದ ಹಾಳಾದ, ಕೊಳೆತ ಅಥವಾ ಉಪಯೋಗವಿಲ್ಲದ ಎಂಬ ಜೀವಂತ ಅರ್ಥವನ್ನು ಮರದ ಚಿತ್ರಣದಲ್ಲಿ ನಿಖರವಾಗಿ ಹಿಡಿಯುತ್ತದೆ.
- source_word: καρποὺς πονηροὺς
  choice: ಕೆಟ್ಟ ಹಣ್ಣುಗಳನ್ನು
  rationale: ಕೃಷಿ ರೂಪಕದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಸಂದರ್ಭದಲ್ಲಿರುವ ನೈತಿಕ ಸೂಚನೆಯನ್ನು ಅಳಿಸದೆ πονηρός ಪದದ ವಿಶಾಲ ನಕಾರಾತ್ಮಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಚಿತ್ರಣದ ನೈತಿಕ ಅರ್ಥ ಮತ್ತು ಅದರ ನೇರ ಕೃಷಿಸಂಬಂಧಿ ಅರ್ಥ
  choice: ಮರ ಮತ್ತು ಹಣ್ಣಿನ ರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ಅದರ ನೈತಿಕ ಅನ್ವಯವನ್ನು ವಾಕ್ಯದಲ್ಲೇ ವಿವರಿಸದೆ ಬಿಡಲಾಗಿದೆ.
  alternative: ‘ನೀತಿವಂತನು ಒಳ್ಳೆಯ ಕಾರ್ಯಗಳನ್ನು ಮಾಡುತ್ತಾನೆ’ ಎಂಬಂತೆ ರೂಪಕದ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ವಿವರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ರೂಪಕವನ್ನೇ ಹೇಳುತ್ತದೆ; ಸುಳ್ಳು ಪ್ರವಾದಿಗಳ ಕುರಿತ ಸಂದರ್ಭವು ಅದರ ನೈತಿಕ ಅರ್ಥವನ್ನು ಒದಗಿಸುತ್ತದೆ. ಅನುವಾದವು ಆ ಅರ್ಥವನ್ನು ಮುಂಚಿತವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಗಾದೆಯಂತಿರುವ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಹಣ್ಣು ಕೊಡುತ್ತದೆ’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟನ್ನು ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ರೂಪಕವನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸಲಾಗಿಲ್ಲ.
