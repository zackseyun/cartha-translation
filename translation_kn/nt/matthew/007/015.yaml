id: MAT.7.15
reference: Matthew 7:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: kn
  text: ಸುಳ್ಳು ಪ್ರವಾದಿಗಳಿಂದ ಎಚ್ಚರವಾಗಿರಿ[a]. ಅವರು ಕುರಿಗಳ ಉಡುಪಿನಲ್ಲಿ[b] ನಿಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಾರೆ; ಆದರೆ ಒಳಗಂತೂ ಅವರು ಹಿಂಸ್ರ ತೋಳಗಳಾಗಿದ್ದಾರೆ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಸುಳ್ಳು ಪ್ರವಾದಿಗಳ ಬಗ್ಗೆ ಜಾಗರೂಕರಾಗಿರಿ.”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ಕುರಿಗಳ ವೇಷದಲ್ಲಿ.”
    reason: lexical_alternative
  - marker: c
    text: ಅಥವಾ “ಒಳಗಿನಿಂದ ಅವರು ಕಬಳಿಸುವ ತೋಳಗಳು.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: ಬಗ್ಗೆ ಎಚ್ಚರವಾಗಿರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಬಹುವಚನ ಆಜ್ಞೆಯು ನಿರಂತರ ಜಾಗರೂಕತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. προσέχω ಜೊತೆಗೆ ἀπό ಎಚ್ಚರಿಕೆಗೆ ಗುರಿಯಾದವರನ್ನು ಸೂಚಿಸುವುದರಿಂದ, ಈ ಕನ್ನಡ ಪದಪ್ರಯೋಗವು ಸಹಜವಾಗಿಯೂ ಎಚ್ಚರಿಕೆಯ ಬಲವನ್ನು ಉಳಿಸಿಕೊಂಡೂ ಇದೆ.
- source_word: ψευδοπροφητῶν
  choice: ಸುಳ್ಳು ಪ್ರವಾದಿಗಳು
  rationale: ಪ್ರವಾದಿತ್ವದ ಅಧಿಕಾರವನ್ನು ಸುಳ್ಳಾಗಿ ಹೇಳಿಕೊಳ್ಳುವವರನ್ನಾಗಲಿ, ಪ್ರವಾದಿಗಳೆಂದು ಸುಳ್ಳು ನುಡಿಯುವವರನ್ನಾಗಲಿ ಸೂಚಿಸುವ ψευδοπροφήτης ಪದದ ನೇರ ಮತ್ತು ರೂಢಿಗತ ಕನ್ನಡ ರೂಪ.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: ಅವರು ... ನಿಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಾರೆ
  rationale: οἵτινες ಇಲ್ಲಿ ಅವರ ಸ್ವಭಾವವನ್ನು ವಿವರಿಸುವ ಸಂಬಂಧವಾಕ್ಯವನ್ನು ಆರಂಭಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ವಾಕ್ಯವಾಗಿ ‘ಅವರು’ ಎಂದು ಹೇಳುವುದು ಸಹಜವಾಗಿದ್ದು, ವರ್ತಮಾನಕಾಲದ ಸಮೀಪಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: ಕುರಿಗಳ ವೇಷದಲ್ಲಿ
  rationale: ಹೊರಗೆ ನಿರಪಾಯಿಗಳಂತೆ ಕಾಣಿಸಿಕೊಂಡು ಮೋಸಮಾಡುವ ರೂಪಕವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಅಕ್ಷರಶಃ ಇರುವ ‘ಕುರಿಗಳ ಉಡುಪುಗಳಲ್ಲಿ’ ಎಂಬ ಚಿತ್ರಣವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἔσωθεν δέ
  choice: ಆದರೆ ಒಳಗೆ
  rationale: ಹೊರಗಿನ ಕಾಣಿಕೆ ಮತ್ತು ಒಳಗಿನ ನಿಜಸ್ವಭಾವದ ನಡುವಿನ ತೀಕ್ಷ್ಣ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: λύκοι ἅρπαγες
  choice: ಕಬಳಿಸುವ ತೋಳಗಳು
  rationale: ἅρπαγες ಪದದಲ್ಲಿರುವ ಬೇಟೆಯನ್ನು ಹಿಡಿದು ಕಸಿದುಕೊಳ್ಳುವ, ನಾಶಮಾಡುವ ಸ್ವಭಾವವನ್ನು ‘ಕಬಳಿಸುವ’ ಎಂಬ ಪದ ಸ್ಪಷ್ಟವಾಗಿ ಹೊತ್ತುಕೊಳ್ಳುತ್ತದೆ; ಕೇವಲ ಹಸಿವಿನ ಭಾವಕ್ಕೆ ಇದನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಮೋಸಗೊಳಿಸುವ ಧಾರ್ಮಿಕ ನಾಯಕರ ವಿರುದ್ಧದ ಎಚ್ಚರಿಕೆಯ ಸ್ವರೂಪ
  choice: ಹೊರಗಿನ ಕಾಣಿಕೆ ಮತ್ತು ಒಳಗಿನ ನಿಜಸ್ವಭಾವದ ರೂಪಕವನ್ನು ನೇರವಾದ ನೈತಿಕ-ಆತ್ಮಿಕ ಎಚ್ಚರಿಕೆಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಈ ವಾಕ್ಯವನ್ನು ನಂತರದ ಕಾಲದ ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ಅರ್ಥದಲ್ಲಿ ‘ವಿಧರ್ಮಿ ಬೋಧಕರಿಗೆ’ ಮಾತ್ರ ಅನ್ವಯಿಸುವಂತೆ ಭಾಷಾಂತರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ‘ಸುಳ್ಳು ಪ್ರವಾದಿಗಳು’ ಎಂದು ಹೇಳಿ ಅವರ ಮೋಸಕರ ಕಾಣಿಕೆ ಮತ್ತು ಹಾನಿಕರ ಸ್ವಭಾವವನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ. ಅದರಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲದ ನಂತರದ ಸಭಾ ಅಥವಾ ಪಂಥೀಯ ವರ್ಗೀಕರಣವನ್ನು ಅನುವಾದದಲ್ಲಿ ಸೇರಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ಎಚ್ಚರಿಕೆಯ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಕುರಿಗಳ ವೇಷ’ ಮತ್ತು ‘ಕಬಳಿಸುವ ತೋಳಗಳು’ ಎಂಬ ಪದಗಳು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ರೂಪಕವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಲುಪಿಸುತ್ತವೆ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಂಬಂಧಿಸಿದ ಸ್ಥಳದಲ್ಲಿವೆ.
