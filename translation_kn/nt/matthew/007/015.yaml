  terminology: ‘ಸುಳ್ಳು ಪ್ರವಾದಿಗಳು’ is the established, clear equivalent of ψευδοπροφῆται. ‘ಹಿಂಸ್ರ ತೋಳಗಳು’ conveys the destructive predatory force of λύκοι ἅρπαγες without importing a doctrinal interpretation.
