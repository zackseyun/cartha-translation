id: MAT.7.2
reference: Matthew 7:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: kn
  text: ಏಕೆಂದರೆ, ನೀವು ಯಾವ ತೀರ್ಪಿನಿಂದ ತೀರ್ಪು ನೀಡುತ್ತೀರೋ, ಅದೇ ತೀರ್ಪಿನಿಂದ ನಿಮಗೂ ತೀರ್ಪು ನೀಡಲಾಗುವುದು; ನೀವು ಯಾವ ಅಳತೆಯಿಂದ ಅಳೆಯುತ್ತೀರೋ, ಅದೇ ಅಳತೆಯಿಂದ ನಿಮಗೂ ಅಳೆಯಲಾಗುವುದು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅದೇ ಅಳತೆಯಿಂದ ನಿಮಗೆ ಹಿಂದಿರುಗಿ ಅಳೆಯಲಾಗುವುದು.” ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ “ಹಿಂದಿರುಗಿ” ಎಂಬ ಪದವು ಸ್ಪಷ್ಟವಾಗಿ ಇಲ್ಲ; ಆದರೆ ಪರಸ್ಪರ ಪ್ರತಿಫಲದ ಅರ್ಥವು ಸೂಚಿತವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: ತೀರ್ಪು / ತೀರ್ಪು ಮಾಡು / ತೀರ್ಪಾಗು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಒಂದೇ ಪದಮೂಲದ ಪುನರಾವರ್ತನೆ ಮತ್ತು ಪರಸ್ಪರ ಪ್ರತಿಫಲದ ರಚನೆಯನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ. ‘ಖಂಡಿಸು’ ಎಂಬುದು ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸಂಕುಚಿತಗೊಳಿಸುವುದರಿಂದ ಬಳಸಿಲ್ಲ.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: ಅಳತೆ / ಅಳೆ / ಅಳೆಯಲಾಗುವುದು
  rationale: ಅಳತೆಯ ರೂಪಕವನ್ನೂ ನಾಮಪದ–ಕ್ರಿಯಾಪದ ಪದಾಟವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ಪ್ರಮಾಣ’ ಎಂದರೆ ರೂಪಕದ ಸ್ಪಷ್ಟತೆ ಮತ್ತು ಪುನರಾವರ್ತನೆ ದುರ್ಬಲವಾಗಬಹುದು.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: ಯಾವುದರಿಂದಲೋ ಅದರಿಂದಲೇ ಎಂಬ ಅರ್ಥದಲ್ಲಿ ‘-ದಿಂದಲೇ’
  rationale: ಇಲ್ಲಿ ἐν ᾧ ಸಾಧನ ಅಥವಾ ಮಾನದಂಡವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘-ದಿಂದಲೇ’ ಅದೇ ಮಾನದಂಡದ ಪ್ರತಿಫಲವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಹಾಗೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ವಚನದ ಎಚ್ಚರಿಕೆಗೆ ಈ ವಚನವು ನೀಡುವ ಕಾರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑμῖν
  choice: ನಿಮಗೂ
  rationale: ದತ್ತಿವ್ ಅರ್ಥವನ್ನು ಮತ್ತು ಇತರರಿಗೆ ಬಳಸಿದ ಮಾನದಂಡವೇ ಕೇಳುವವರಿಗೂ ಅನ್ವಯಿಸುವ ಪರಸ್ಪರತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪ್ರತಿಫಲಿಸುವ ತೀರ್ಪಿನ ಕರ್ತೃ
  choice: ನಿಷ್ಕ್ರಿಯ ರೂಪಗಳ ಮೂಲಕ ತೀರ್ಪು ಮಾಡುವ ಅಥವಾ ಅಳೆಯುವ ಕರ್ತೃವನ್ನು ಹೇಳದೆ ಬಿಡಲಾಗಿದೆ.
  alternative: ‘ದೇವರು ನಿಮಗೆ ತೀರ್ಪು ಮಾಡುವನು’ ಅಥವಾ ‘ಇತರರು ನಿಮಗೆ ತೀರ್ಪು ಮಾಡುವರು’ ಎಂದು ಕರ್ತೃವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ನಿಷ್ಕ್ರಿಯ ಕ್ರಿಯಾಪದಗಳ ಕರ್ತೃ ಹೇಳಲ್ಪಟ್ಟಿಲ್ಲ. ಆದ್ದರಿಂದ ಇದು ದೈವಿಕ ತೀರ್ಪೋ, ಮಾನವ ಪ್ರತಿಕ್ರಿಯೆಯೋ, ಅಥವಾ ಎರಡನ್ನೂ ಒಳಗೊಂಡ ತತ್ವವೋ ಎಂಬ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಮುಕ್ತತೆಯನ್ನು ಅನುವಾದವು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗಂಭೀರ ಮತ್ತು ಗಾದೆಯಂತಹ ಸಮಾಂತರ ರಚನೆಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ತೀರ್ಪು’ ಮತ್ತು ‘ಅಳತೆ’ ಪದಗಳ ಪುನರಾವರ್ತನೆಯ ಮೂಲಕ ಗ್ರೀಕ್ ಮೂಲದ ವಾಕ್ಚಾತುರ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
