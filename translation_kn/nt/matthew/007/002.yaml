revisions:
- from: ಏಕೆಂದರೆ, ನೀವು ಮಾಡುವ ತೀರ್ಪಿನಿಂದಲೇ ನಿಮಗೂ ತೀರ್ಪಾಗುವುದು; ನೀವು ಅಳೆಯುವ ಅಳತೆಯಿಂದಲೇ ನಿಮಗೂ ಅಳೆಯಲಾಗುವುದು.[a]
  to: ಏಕೆಂದರೆ, ನೀವು ಯಾವ ತೀರ್ಪಿನಿಂದ ತೀರ್ಪು ನೀಡುತ್ತೀರೋ, ಅದೇ ತೀರ್ಪಿನಿಂದ ನಿಮಗೂ ತೀರ್ಪು ನೀಡಲಾಗುವುದು; ನೀವು ಯಾವ ಅಳತೆಯಿಂದ ಅಳೆಯುತ್ತೀರೋ, ಅದೇ ಅಳತೆಯಿಂದ ನಿಮಗೂ ಅಳೆಯಲಾಗುವುದು.[a]
  rationale: The revision makes the two ἐν ᾧ clauses explicit with matching Kannada relative-correlative phrasing (“ಯಾವ ... ಅದೇ ...”), improves idiomatic modern Kannada, and retains the source’s judgment/measure wordplay, future passives, and ambiguity about the agent of judgment.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the explanatory γάρ, the reciprocal parallelism, the unstated agent in the future passives, and the implied-but-not-explicit reciprocal sense. However, “ನೀವು ಮಾಡುವ ತೀರ್ಪಿನಿಂದ” is less exact and less idiomatic than an explicit relative-correlative construction corresponding to the repeated ἐν ᾧ clauses.
  naturalness: The present wording is understandable, but “ಮಾಡುವ ತೀರ್ಪು” and the compressed “-ದಿಂದಲೇ” construction sound somewhat awkward in modern standard Kannada. A “ಯಾವ ... ಅದೇ ...” structure is clearer, proverbial in cadence, and preserves the Greek parallelism.
  terminology: “ತೀರ್ಪು” appropriately retains the κρίμα/κρίνω lexical linkage without narrowing it to condemnation. “ಅಳತೆ / ಅಳೆಯು” preserves the μέτρον/μετρέω wordplay. “ತೀರ್ಪು ನೀಡಲಾಗುವುದು” is a natural Kannada passive and does not specify the agent.
  issues:
  - severity: low
    issue: The first instrumental-relative phrase is compressed and slightly awkward.
    rationale: “ನೀವು ಮಾಡುವ ತೀರ್ಪಿನಿಂದಲೇ” does not as clearly express “with/by the judgment with which you judge” as a relative-correlative construction does. The revision preserves both the repeated standard and the verbal action.
  - severity: low
    issue: The passive expression “ನಿಮಗೂ ತೀರ್ಪಾಗುವುದು” is less natural than a passive verbal form.
    rationale: “ನಿಮಗೂ ತೀರ್ಪು ನೀಡಲಾಗುವುದು” clearly renders κριθήσεσθε (“you will be judged”) while retaining the unspecified agent.
  revised_text: ಏಕೆಂದರೆ, ನೀವು ಯಾವ ತೀರ್ಪಿನಿಂದ ತೀರ್ಪು ನೀಡುತ್ತೀರೋ, ಅದೇ ತೀರ್ಪಿನಿಂದ ನಿಮಗೂ ತೀರ್ಪು ನೀಡಲಾಗುವುದು; ನೀವು ಯಾವ ಅಳತೆಯಿಂದ ಅಳೆಯುತ್ತೀರೋ, ಅದೇ ಅಳತೆಯಿಂದ ನಿಮಗೂ ಅಳೆಯಲಾಗುವುದು.[a]
