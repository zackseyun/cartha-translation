- from: 'ಆಗ ನಾನು ಅವರಿಗೆ ಬಹಿರಂಗವಾಗಿ ಹೇಳುವೆನು[a]: ‘ನಾನು ನಿಮ್ಮನ್ನು ಎಂದೂ ಅರಿತಿರಲಿಲ್ಲ. ಅಧರ್ಮವನ್ನು ಆಚರಿಸುವವರೇ, ನನ್ನಿಂದ ದೂರ ಸರಿಯಿರಿ[b].’'
  to: 'ಆಗ ನಾನು ಅವರಿಗೆ ಬಹಿರಂಗವಾಗಿ ಹೇಳುವೆನು[a]: ‘ನಾನು ನಿಮ್ಮನ್ನು ಎಂದೂ ಅರಿತಿರಲಿಲ್ಲ. ಅಧರ್ಮವನ್ನು ಮಾಡುವವರೇ, ನನ್ನಿಂದ ಹೊರಟುಹೋಗಿರಿ[b].’'
