id: MAT.7.23
reference: Matthew 7:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: kn
  text: 'ಆಗ ನಾನು ಅವರಿಗೆ ಬಹಿರಂಗವಾಗಿ ಹೇಳುವೆನು[a]: ‘ನಾನು ನಿಮ್ಮನ್ನು ಎಂದೂ ಅರಿತಿರಲಿಲ್ಲ. ಅಧರ್ಮವನ್ನು ಮಾಡುವವರೇ, ನನ್ನಿಂದ ಹೊರಟುಹೋಗಿರಿ[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಆಗ ನಾನು ಅವರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಘೋಷಿಸುವೆನು.’
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಅಕ್ರಮವನ್ನು ಮಾಡುವವರೇ’ / ‘ದುಷ್ಕೃತ್ಯವನ್ನು ಮಾಡುವವರೇ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: ಆಗ
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದ ಕಾಲಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಮತ್ತು ಆಗ’ ಎಂಬ ಅಸಹಜ ಕಟ್ಟುವಿಕೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ὁμολογήσω
  choice: ಬಹಿರಂಗವಾಗಿ ಹೇಳುವೆನು
  rationale: ನ್ಯಾಯತೀರ್ಪಿನ ಸಂದರ್ಭದಲ್ಲಿ ಬಹಿರಂಗವಾಗಿ, ಸ್ಪಷ್ಟವಾಗಿ ಘೋಷಿಸುವ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: Οὐδέποτε
  choice: ಎಂದೂ ... ಇಲ್ಲ
  rationale: ಯಾವ ಕಾಲದಲ್ಲಿಯೂ ಇಲ್ಲ ಎಂಬ ಸಂಪೂರ್ಣ ಮತ್ತು ಒತ್ತಿನ ನಿರಾಕರಣೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔγνων
  choice: ಅರಿತಿರಲಿಲ್ಲ
  rationale: ಕೇವಲ ಮಾಹಿತಿ ತಿಳಿದಿರುವುದಕ್ಕಿಂತ ಸಂಬಂಧಾತ್ಮಕವಾಗಿ ಅರಿಯುವ ಸಾಧ್ಯತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಅಂಗೀಕರಿಸಲಿಲ್ಲ’ ಎಂದು ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ἀποχωρεῖτε
  choice: ದೂರ ಸರಿಯಿರಿ
  rationale: ತಿರಸ್ಕರಿಸಿ ಕಳುಹಿಸುವ ಗಂಭೀರ ಆಜ್ಞೆಯನ್ನು ಆಧುನಿಕ, ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐργαζόμενοι
  choice: ಆಚರಿಸುವವರೇ
  rationale: ನಿರಂತರ ಅಥವಾ ವ್ಯಕ್ತಿಯನ್ನು ಲಕ್ಷಣಗೊಳಿಸುವ ನಡತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಒಂದೇ ಕೃತಿಗೆ ಸೀಮಿತವಾಗುವುದಿಲ್ಲ.
- source_word: ἀνομίαν
  choice: ಅಧರ್ಮವನ್ನು
  rationale: ದೇವರ ಧರ್ಮನಿಯಮಕ್ಕೆ ವಿರುದ್ಧವಾದ ನಡತೆಯ ನೈತಿಕ-ನಿಯಮಾತ್ಮಕ ಬಲವನ್ನು ಉಳಿಸುವ ಪರಿಚಿತ ಕನ್ನಡ ಪದ.
theological_decisions:
- issue: ‘ನಾನು ನಿಮ್ಮನ್ನು ಎಂದೂ ಅರಿತಿರಲಿಲ್ಲ’ ಎಂಬ ಮಾತಿನ ಅರ್ಥ
  choice: ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥಕ್ಕೆ ಅವಕಾಶವಿರುವ ‘ಅರಿತಿರಲಿಲ್ಲ’ ಎಂಬ ನೇರ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನಾನು ನಿಮ್ಮನ್ನು ಎಂದೂ ಅಂಗೀಕರಿಸಲಿಲ್ಲ’ ಅಥವಾ ‘ನೀವು ಎಂದೂ ನನ್ನವರಾಗಿರಲಿಲ್ಲ.’
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಸಂಬಂಧಾತ್ಮಕ ಅರಿವನ್ನು ಸೂಚಿಸಬಹುದಾದರೂ, ಅನುಮೋದನೆ ಅಥವಾ ರಕ್ಷಣೆಯ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ವಾಕ್ಯದ ಉದ್ದೇಶಿತ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ἀνομία ಪದದ ನೈತಿಕ-ನಿಯಮಾತ್ಮಕ ಬಲ
  choice: ‘ಅಧರ್ಮ’
  alternative: ‘ದುಷ್ಟತನ’ ಅಥವಾ ‘ನಿಯಮರಾಹಿತ್ಯ’
  rationale: ‘ದುಷ್ಟತನ’ ತುಂಬ ವ್ಯಾಪಕ; ‘ನಿಯಮರಾಹಿತ್ಯ’ ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗಿದ್ದು ಸಾಮಾಜಿಕ ಅರಾಜಕತೆಯ ಅರ್ಥ ಕೊಡಬಹುದು. ‘ಅಧರ್ಮ’ ದೇವರ ಧರ್ಮನಿಯಮಕ್ಕೆ ವಿರುದ್ಧವಾದ ಆಚರಣೆಯ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ‘ಬಹಿರಂಗವಾಗಿ ಹೇಳುವೆನು’ ನ್ಯಾಯತೀರ್ಪಿನ ಘೋಷಣಾತ್ಮಕ ಸ್ವರವನ್ನು ನೀಡುತ್ತದೆ; ‘ಅರಿತಿರಲಿಲ್ಲ’ ಮೂಲದ ಸಂಬಂಧಾತ್ಮಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಎಲ್ಲಾ ಅಡಿಕುರಿತು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
