id: MAT.7.26
reference: Matthew 7:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: kn
  text: ನನ್ನ ಈ ಮಾತುಗಳನ್ನು ಕೇಳಿಯೂ ಅವುಗಳಂತೆ ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನು ಮರಳಿನ ಮೇಲೆ ತನ್ನ ಮನೆಯನ್ನು ಕಟ್ಟಿದ ಮೂರ್ಖ ಮನುಷ್ಯನಿಗೆ ಹೋಲುವನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಮೂರ್ಖ ವ್ಯಕ್ತಿಗೆ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಮೂರ್ಖ ಮನುಷ್ಯನಿಗೆ’ ಎಂದು ಪುರುಷವಾಚಕ ಪ್ರತಿನಿಧಿ ಭಾಷೆಯನ್ನು ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: ಕೇಳಿಯೂ ... ಪ್ರತಿಯೊಬ್ಬನು
  rationale: ಈ ವರ್ತಮಾನಕಾಲದ ಕೃದಂತ ಪದಗುಚ್ಛವು ಸಾಮಾನ್ಯವಾಗಿ ಎಲ್ಲರನ್ನೂ ಒಳಗೊಂಡಿದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಪ್ರತಿಯೊಬ್ಬನು’ ಅದರ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಕೇಳಿಯೂ’ ಮುಂದಿನ ನಿರಾಕರಣೆಯೊಂದಿಗೆ ಇರುವ ವೈರುಧ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: μου τοὺς λόγους τούτους
  choice: ನನ್ನ ಈ ಮಾತುಗಳನ್ನು
  rationale: ‘ಈ’ ಎಂಬ ಸೂಚಕದ ಒತ್ತನ್ನೂ ‘ನನ್ನ’ ಎಂಬ ಸಂಬಂಧವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ. λόγοιಗೆ ಇಲ್ಲಿ ‘ಮಾತುಗಳು’ ಸಹಜ ಮತ್ತು ಸರಳ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
- source_word: μὴ ποιῶν αὐτούς
  choice: ಅವುಗಳಂತೆ ನಡೆಯದ
  rationale: ಗ್ರೀಕ್ ಪದಶಃ ‘ಅವುಗಳನ್ನು ಮಾಡದ’ ಎಂದಿದ್ದರೂ, ಮಾತುಗಳನ್ನು ಆಚರಣೆಗೆ ತರುವ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಅವುಗಳಂತೆ ನಡೆಯದ’ ಎಂಬುದು ಸಹಜವಾಗಿ ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁμοιωθήσεται
  choice: ಹೋಲುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ನಿಷ್ಕ್ರಿಯ ಹೋಲಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಹಾಗೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀνδρὶ μωρῷ
  choice: ಮೂರ್ಖ ಮನುಷ್ಯನಿಗೆ
  rationale: ἀνήρ ನಿರ್ದಿಷ್ಟವಾಗಿ ಪುರುಷವಾಚಕವಾಗಿರುವುದರಿಂದ ‘ಮನುಷ್ಯ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ; μωρόςಗೆ ‘ಮೂರ್ಖ’ ಗೌರವಯುತವಾದರೂ ನೇರವಾದ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: ತನ್ನ ಮನೆಯನ್ನು ಕಟ್ಟಿದ
  rationale: ಮನೆಯು ಅದೇ ವ್ಯಕ್ತಿಗೆ ಸೇರಿದೆ ಎಂಬುದನ್ನು ಕನ್ನಡದ ಪ್ರತಿಫಲಕ ಸರ್ವನಾಮ ‘ತನ್ನ’ ನಿಖರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಕಟ್ಟಿದ’ ಕ್ರಿಯೆಯ ಸರಳ ಭೂತಕಾಲದ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: ἐπὶ τὴν ἄμμον
  choice: ಮರಳಿನ ಮೇಲೆ
  rationale: ಅಸ್ಥಿರ ಅಡಿಪಾಯದ ಮೇಲಿನ ಸ್ಥಳಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಹೋಲಿಕೆಯಲ್ಲಿ ಪುರುಷವಾಚಕ ಪ್ರತಿನಿಧಿ ಭಾಷೆ
  choice: ಮೂರ್ಖ ಮನುಷ್ಯ
  alternative: ಮೂರ್ಖ ವ್ಯಕ್ತಿ
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನ ἀνδρί ಪುರುಷವಾಚಕ ಏಕವಚನವಾಗಿದೆ. ಹೋಲಿಕೆ ಎಲ್ಲರಿಗೂ ಅನ್ವಯಿಸಿದರೂ, ಮೂಲದಲ್ಲಿರುವ ಪುರುಷವಾಚಕ ಚಿತ್ರಣವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ ಅದರ ಪ್ರತಿನಿಧಿ ವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಮಾತಿನ ಸಹಜ ಹರಿವಿರುವ ಶೈಲಿ. ‘ಅವುಗಳಂತೆ ನಡೆಯದ’ ಎಂಬುದು ಪದಶಃ ರೂಪಕ್ಕಿಂತ ಸಹಜವಾದರೂ, ಕೇಳಿದ ಮಾತುಗಳನ್ನು ಕಾರ್ಯರೂಪಕ್ಕೆ ತರದಿರುವ ಮೂಲ ಅರ್ಥವನ್ನು ಕಾಪಾಡುತ್ತದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
