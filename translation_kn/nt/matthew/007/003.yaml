id: MAT.7.3
reference: Matthew 7:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: kn
  text: ಆದರೆ ನಿನ್ನ ಸಹೋದರನ ಕಣ್ಣಿನಲ್ಲಿರುವ ಚಿಕ್ಕ ಕಣವನ್ನು ನೀನು ಏಕೆ ನೋಡುತ್ತೀ, ನಿನ್ನ ಸ್ವಂತ ಕಣ್ಣಿನಲ್ಲಿರುವ ತೊಲೆಯನ್ನು ಗಮನಿಸುವುದಿಲ್ಲ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: ಏಕೆ
  rationale: βλέπεις ಜೊತೆಯಲ್ಲಿರುವ ಈ ಪ್ರಶ್ನಾರ್ಥಕ ಬಳಕೆ ಅಕ್ಷರಶಃ ‘ಏನು’ ಎಂಬುದಕ್ಕಿಂತ ಕಾರಣವನ್ನು ಪ್ರಶ್ನಿಸುವ ‘ಏಕೆ’ ಎಂಬ ವಾಕ್ಚಾತುರ್ಯದ ಅರ್ಥ ನೀಡುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಬೋಧನೆಯಿಂದ ಇಲ್ಲಿನ ವಿರೋಧಾತ್ಮಕ ಪ್ರಶ್ನೆಗೆ ಸಾಗುವ ಸೌಮ್ಯ ವೈರುಧ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: βλέπεις
  choice: ನೋಡುತ್ತೀ
  rationale: ಕಣ್ಣಿನ ದೃಶ್ಯರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ ಮತ್ತು κατανοεῖςಗೆ ಬಳಸಿದ ‘ಗಮನಿಸುವುದಿಲ್ಲ’ ಎಂಬ ಪದದೊಂದಿಗೆ ಅರ್ಥಪೂರ್ಣ ವ್ಯತ್ಯಾಸ ಕಾಯುತ್ತದೆ.
- source_word: κάρφος
  choice: ಚಿಕ್ಕ ಕಣ
  rationale: ಒಣ ಹುಲ್ಲಿನ ತುಂಡು, ಸೀಳುಚೂರು ಅಥವಾ ಹೊಟ್ಟಿನ ಕಣದಂಥ ಅತಿ ಸಣ್ಣ ವಸ್ತುವನ್ನು ಸೂಚಿಸುವ ಪದ; ಕನ್ನಡದಲ್ಲಿ ಕಣ್ಣಿನೊಳಗಿನ ಅಲ್ಪ ವಸ್ತುವಿಗೆ ‘ಚಿಕ್ಕ ಕಣ’ ಸಹಜವಾಗಿದ್ದು, ದೊಡ್ಡ ತೊಲೆಯೊಂದಿಗಿನ ಅತಿಶಯೋಕ್ತಿಯ ವೈರುಧ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἀδελφοῦ
  choice: ಸಹೋದರನ
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಸಂಬಂಧಪದವನ್ನು ಅನಿರ್ದಿಷ್ಟ ಅಥವಾ ಲಿಂಗತಟಸ್ಥ ಪದದಿಂದ ಬದಲಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: σῷ
  choice: ನಿನ್ನ ಸ್ವಂತ
  rationale: ಇನ್ನೊಬ್ಬನ ಕಣ್ಣು ಮತ್ತು ಕೇಳುವವನದೇ ಕಣ್ಣುಗಳ ನಡುವಿನ ಒತ್ತಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೊರತರುತ್ತದೆ.
- source_word: δοκόν
  choice: ತೊಲೆ
  rationale: ಕಟ್ಟಡದಲ್ಲಿ ಬಳಸುವ ದೊಡ್ಡ ಮರದ ಅಡ್ಡತೊಲೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಚಿಕ್ಕ ಕಣ’ದೊಂದಿಗೆ ಉದ್ದೇಶಿತ ಅತಿಶಯೋಕ್ತಿಯ ವೈರುಧ್ಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: οὐ κατανοεῖς
  choice: ಗಮನಿಸುವುದಿಲ್ಲ
  rationale: ಸೂಕ್ಷ್ಮವಾಗಿ ಅರಿಯುವುದು ಅಥವಾ ಗಮನಕ್ಕೆ ತರುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ನೀಡುತ್ತಾ, βλέπεις (‘ನೋಡುತ್ತೀ’) ಎಂಬುದರಿಂದ ಪದಾರ್ಥದ ವ್ಯತ್ಯಾಸವನ್ನು ಕಾಯುತ್ತದೆ.
- source_word: ὀφθαλμῷ
  choice: ಕಣ್ಣು
  rationale: ಈ ಸ್ಪಷ್ಟ ದೃಶ್ಯರೂಪಕದಲ್ಲಿ ὀφθαλμόςಗೆ ಸಹಜವಾದ ನೇರ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
theological_decisions:
- issue: ἀδελφοῦ ಎಂಬ ಲಿಂಗಸೂಚಿತ ಸಂಬಂಧಪದ
  choice: ಸಹೋದರನ
  alternative: ಸಹೋದರ ಅಥವಾ ಸಹೋದರಿಯ / ಜೊತೆವಿಶ್ವಾಸಿಯ
  rationale: ಈ ಮಾತು ವ್ಯಾಪಕವಾಗಿ ಅನ್ವಯಿಸಿದರೂ, ಮೂಲಪಾಠವು ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಬಳಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಅದರ ರೂಪವನ್ನು ಲಿಂಗತಟಸ್ಥಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಮಾತಿನ ವಾಕ್ಚಾತುರ್ಯ ಉಳಿಯುವ ಶೈಲಿ. ‘ಚಿಕ್ಕ ಕಣ’ ಮತ್ತು ‘ತೊಲೆ’ ನಡುವಿನ ಅತಿಶಯೋಕ್ತಿಯ ದೃಶ್ಯವೈರುಧ್ಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಕಾಯಲಾಗಿದೆ; ಅನಗತ್ಯ ಪಾದಟಿಪ್ಪಣಿಗಳಿಲ್ಲ.
