  source_fidelity: The draft accurately preserves the future assertion, the eschatologically suggestive but unspecified ‘that day,’ the repeated direct address ‘Lord, Lord,’ all three repetitions of ‘in your name,’ and the three affirmative-expected negative questions. ‘ಮಹತ್ಕಾರ್ಯಗಳನ್ನು’ is a suitably open rendering of δυνάμεις πολλὰς, with the footnote appropriately noting the power/miraculous-deed sense.
  naturalness: ‘ಆ ದಿನದಲ್ಲಿ’ is understandable, but ‘ಆ ದಿನದಂದು’ is more idiomatic modern standard Kannada for a specific day. ‘ದೆವ್ವಗಳನ್ನು ಹೊರಗೆ ಓಡಿಸು’ is intelligible but less natural for the established exorcism expression; ‘ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕು’ is concise, idiomatic, and closely reflects ἐκβάλλω.
  terminology: ‘ಕರ್ತನೇ, ಕರ್ತನೇ’ appropriately renders the repeated vocative Κύριε. ‘ಪ್ರವಾದಿಸು,’ ‘ನಿನ್ನ ಹೆಸರಿನಲ್ಲಿ,’ and ‘ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕು’ are natural, established terms. The footnote retains the lexical breadth of δύναμις without forcing ‘miracles’ into the main text.
