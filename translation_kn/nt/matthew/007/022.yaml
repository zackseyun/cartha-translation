id: MAT.7.22
reference: Matthew 7:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: kn
  text: ಆ ದಿನದಂದು ಅನೇಕರು ನನಗೆ, ‘ಕರ್ತನೇ, ಕರ್ತನೇ, ನಾವು ನಿನ್ನ ಹೆಸರಿನಲ್ಲಿ ಪ್ರವಾದಿಸಲಿಲ್ಲವೇ? ನಿನ್ನ ಹೆಸರಿನಲ್ಲಿ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕಲಿಲ್ಲವೇ? ನಿನ್ನ ಹೆಸರಿನಲ್ಲಿ ಅನೇಕ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು[a] ಮಾಡಲಿಲ್ಲವೇ?’ ಎಂದು ಹೇಳುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಅನೇಕ ಅದ್ಭುತಗಳನ್ನು’ ಅಥವಾ ‘ಅನೇಕ ಶಕ್ತಿಕಾರ್ಯಗಳನ್ನು.’ ಗ್ರೀಕ್ ಪದಗುಚ್ಛವು ಅಕ್ಷರಶಃ ಅನೇಕ ‘ಶಕ್ತಿಗಳನ್ನು’ ಸೂಚಿಸುತ್ತದೆ; ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಈ ಪದವನ್ನು ಹೆಚ್ಚಾಗಿ ಅದ್ಭುತ ಕಾರ್ಯಗಳಿಗೆ ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ಅನೇಕರು
  rationale: ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ವಿಶೇಷಣವು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲದ ‘ಜನರು’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸದೆ ಸಹಜವಾಗಿ ಅರ್ಥ ನೀಡುತ್ತದೆ.
- source_word: ἐροῦσίν μοι
  choice: ನನಗೆ ... ಎಂದು ಹೇಳುವರು
  rationale: λέγω ಕ್ರಿಯಾಪದದ ಭವಿಷ್ಯತ್ಕಾಲ ಮತ್ತು ಮಿ ಎಂಬ ಸಂಪ್ರದಾನರೂಪವನ್ನು ನೇರವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ಆ ದಿನದಲ್ಲಿ
  rationale: ಮೂಲದ ಕಾಲಸೂಚಕ ನುಡಿಗಟ್ಟನ್ನು ಉಳಿಸುತ್ತದೆ. ಸಂದರ್ಭವು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ಸೂಚಿಸಿದರೂ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟೀಕರಿಸಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: Κύριε κύριε
  choice: ಕರ್ತನೇ, ಕರ್ತನೇ
  rationale: ಸಂಬೋಧನೆಯ ಪುನರಾವರ್ತನೆಯಲ್ಲಿರುವ ಒತ್ತಾಯ ಮತ್ತು ಮನವಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; κύριος ಎಂಬ ಬಿರುದಿನ ಸಾಮಾನ್ಯ ಹಾಗೂ ಕ್ರಿಸ್ತಸಂಬಂಧಿ ಭಾರವನ್ನೂ ಹೊರುತ್ತದೆ.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: ನಾವು ... ಪ್ರವಾದಿಸಲಿಲ್ಲವೇ?
  rationale: ಒಪ್ಪಿಗೆಯ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಗ್ರೀಕ್ ಪ್ರಶ್ನೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ನಕಾರಾತ್ಮಕ ಪ್ರಶ್ನಾರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: τῷ σῷ ὀνόματι
  choice: ನಿನ್ನ ಹೆಸರಿನಲ್ಲಿ
  rationale: ಒಬ್ಬರ ಹೆಸರಿನ ಅಧಿಕಾರ ಅಥವಾ ಆಹ್ವಾನದ ಆಧಾರದಲ್ಲಿ ಕಾರ್ಯಮಾಡುವುದನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟು. ಮೂಲದಲ್ಲಿರುವ ಮೂರೂ ಪುನರಾವರ್ತನೆಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: ದೆವ್ವಗಳನ್ನು ಹೊರಗೆ ಓಡಿಸಲಿಲ್ಲವೇ?
  rationale: ἐκβάλλω ಎಂಬುದರ ಹೊರದಬ್ಬುವ ಅರ್ಥವನ್ನೂ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುವ ಸಂದರ್ಭವನ್ನೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: ಅನೇಕ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡಲಿಲ್ಲವೇ?
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿ δύναμις ಸೂಚಿಸುವ ಶಕ್ತಿಪೂರ್ಣ ಅಥವಾ ಅದ್ಭುತ ಕಾರ್ಯಗಳ ಅರ್ಥವನ್ನು ‘ಅದ್ಭುತಗಳು’ ಎಂದು ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸದೆ, ಓದಲು ಸಹಜವಾದ ರೀತಿಯಲ್ಲಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವನ್ನು ನೇರವಾಗಿ ಸಂಬೋಧಿಸುವಾಗ κύριος ಪದದ ಅನುವಾದ
  choice: ಕರ್ತನೇ
  alternative: ಒಡೆಯನೇ / ಗುರುಗಳೇ
  rationale: ‘ಕರ್ತನು’ ಎಂಬುದು ಬಿರುದಿನ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನೂ ಅದರ ಕ್ರಿಸ್ತತಾತ್ತ್ವಿಕ ತೂಕವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಪಠ್ಯವು ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚಿನದನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: ‘ಆ ದಿನ’ ಎಂಬ ಪದಗುಚ್ಛದ ಅಂತ್ಯಕಾಲಸಂಬಂಧಿ ಸೂಚನೆ
  choice: ಆ ದಿನದಲ್ಲಿ
  alternative: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ
  rationale: ಸಂದರ್ಭವು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆದರೂ ಗ್ರೀಕ್ ಪಠ್ಯವು ‘ಆ ದಿನ’ ಎಂದಷ್ಟೇ ಹೇಳುವುದರಿಂದ ಆ ಸೂಚಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: οὐ ಎಂಬ ನಕಾರವು ಸಮನ್ವಿತ ಮೂರು ಕ್ರಿಯೆಗಳೊಂದಿಗೆ ಹೊಂದಿರುವ ಪ್ರಶ್ನಾರ್ಥಕ ಬಲ
  choice: ಮೂರು ಕ್ರಿಯೆಗಳನ್ನೂ ಕನ್ನಡದಲ್ಲಿ ನಕಾರಾತ್ಮಕ ಪ್ರಶ್ನಾರೂಪದಲ್ಲಿ ನೀಡುವುದು
  alternative: ಮೊದಲ ಕ್ರಿಯೆಯಲ್ಲಿ ಮಾತ್ರ ‘ಅಲ್ಲವೇ’ ಬಳಸಿ ಉಳಿದ ಕ್ರಿಯೆಗಳನ್ನು ಸಮನ್ವಯಿಸುವುದು
  rationale: ಮೂರೂ ಕಾರ್ಯಗಳನ್ನು ತಮ್ಮ ಸಮರ್ಥನೆಯಾಗಿ ಉಲ್ಲೇಖಿಸುವ ವಕ್ತಾರರ ಒತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ‘ನಿನ್ನ ಹೆಸರಿನಲ್ಲಿ’ ಎಂಬ ಮೂರರ ಪುನರಾವರ್ತನೆಯನ್ನು ವಾಕ್ಚಾತುರ್ಯದ ಒತ್ತಿಗಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
