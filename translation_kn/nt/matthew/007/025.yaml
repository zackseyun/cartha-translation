id: MAT.7.25
reference: Matthew 7:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: kn
  text: ಮಳೆ ಸುರಿಯಿತು; ನದಿಗಳು ಹರಿದುಬಂದವು; ಗಾಳಿಗಳು ಬೀಸಿದವು; ಅವೆಲ್ಲವೂ ಆ ಮನೆಯ ಮೇಲೆ ಅಪ್ಪಳಿಸಿದವು. ಆದರೂ ಅದು ಬೀಳಲಿಲ್ಲ, ಏಕೆಂದರೆ ಅದರ ಅಸ್ತಿವಾರವನ್ನು ಬಂಡೆಯ ಮೇಲೆ ಹಾಕಲಾಗಿತ್ತು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: ಮಳೆ ಸುರಿಯಿತು
  rationale: ಕನ್ನಡದಲ್ಲಿ ಮಳೆ ಕೆಳಗೆ ಬರುವುದನ್ನು ಸಹಜವಾಗಿ ‘ಸುರಿಯಿತು’ ಎಂದು ಹೇಳಲಾಗುತ್ತದೆ; ಇದು ಗ್ರೀಕ್‌ನ ಕೆಳಮುಖ ಚಲನೆಯನ್ನು ಸಂದರ್ಭಾನುಸಾರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ ποταμοί
  choice: ನದಿಗಳು ಉಕ್ಕಿಬಂದವು
  rationale: ποταμοί ಎಂಬುದರ ಮೂಲ ಅರ್ಥ ‘ನದಿಗಳು.’ ಮನೆಯತ್ತ ಅಪಾಯಕಾರಿಯಾಗಿ ನೀರು ಬಂದ ಸಂದರ್ಭವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಗೊಳಿಸಲು ‘ಉಕ್ಕಿಬಂದವು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ‘ಪ್ರವಾಹಗಳು’ ಎಂದು ಮೂಲ ನಾಮಪದವನ್ನು ಬದಲಾಯಿಸಲಿಲ್ಲ.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: ಗಾಳಿಗಳು ಬೀಸಿ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನ ಮತ್ತು ಸಾಮಾನ್ಯ ಕ್ರಿಯಾರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ಆ ಮನೆಯ ಮೇಲೆ ಅಪ್ಪಳಿಸಿದವು
  rationale: προσπίπτω ಇಲ್ಲಿನ ಬಿರುಗಾಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ‘ಮೇಲೆ ಬಿದ್ದು ಬಡಿಯುವುದು/ಅಪ್ಪಳಿಸುವುದು’ ಎಂಬ ಬಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅಪ್ಪಳಿಸಿದವು’ ಸಹಜವಾಗಿದ್ದು, ಗಾಳಿ ಮತ್ತು ನೀರಿನ ಒಟ್ಟಾರೆ ಹೊಡೆತವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: οὐκ ἔπεσεν
  choice: ಅದು ಬೀಳಲಿಲ್ಲ
  rationale: ಗ್ರೀಕ್‌ನ ಸರಳವಾದ ‘ಬೀಳಲಿಲ್ಲ’ ಎಂಬ ಹೇಳಿಕೆಯನ್ನು ‘ಕುಸಿಯಲಿಲ್ಲ’ ಎಂದು ಬಲಪಡಿಸದೆ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τεθεμελίωτο
  choice: ಅದಕ್ಕೆ ಅಸ್ತಿವಾರ ಹಾಕಲಾಗಿತ್ತು
  rationale: ಪೂರ್ವಭೂತಕಾಲದ ನಿಷ್ಕ್ರಿಯ ರೂಪವು ಮನೆಯ ಸ್ಥಿರತೆಗೆ ಮುಂಚೆಯೇ ಪೂರ್ಣಗೊಂಡಿದ್ದ ಅಸ್ತಿವಾರದ ಕಾರ್ಯವೇ ಕಾರಣವೆಂದು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐπὶ τὴν πέτραν
  choice: ಬಂಡೆಯ ಮೇಲೆ
  rationale: πέτραಗೆ ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ ‘ಬಂಡೆ’; ‘ತಳಬಂಡೆ’ ಎಂಬ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಹೇರದೆ ಮೂಲ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಅಸ್ತಿವಾರದ ಸಾಮ್ಯರೂಪಕ
  choice: ಬಂಡೆಯ ಮೇಲೆ
  alternative: ತಳಬಂಡೆಯ ಮೇಲೆ
  rationale: ಈ ವಚನವೇ ಬಂಡೆಯನ್ನು ನಿರ್ದಿಷ್ಟವಾದ ದೇವತಾತ್ವಿಕ ವ್ಯಕ್ತಿ ಅಥವಾ ತತ್ತ್ವದೊಂದಿಗೆ ಗುರುತಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಸಾಮ್ಯದ ಸಾಮಾನ್ಯ ಚಿತ್ರಣ ಮತ್ತು ಅದರ ಅರ್ಥವಿಸ್ತಾರದ ಅವಕಾಶವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಹಾಗೂ ಚುರುಕಾದ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಕ್ರಮಬದ್ಧ ಬಿರುಗಾಳಿ ಚಿತ್ರಣವನ್ನು ಅರ್ಧವಿರಾಮಗಳ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
