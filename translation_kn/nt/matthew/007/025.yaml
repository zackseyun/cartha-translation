  to: ಮಳೆ ಸುರಿಯಿತು; ನದಿಗಳು ಹರಿದುಬಂದವು; ಗಾಳಿಗಳು ಬೀಸಿದವು; ಅವೆಲ್ಲವೂ ಆ ಮನೆಯ ಮೇಲೆ ಅಪ್ಪಳಿಸಿದವು. ಆದರೂ ಅದು ಬೀಳಲಿಲ್ಲ, ಏಕೆಂದರೆ ಅದರ ಅಸ್ತಿವಾರವನ್ನು ಬಂಡೆಯ ಮೇಲೆ ಹಾಕಲಾಗಿತ್ತು.
