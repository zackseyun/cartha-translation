review_pass:
  verdict: revise
  source_fidelity: The draft preserves the vocative rebuke, sequence ('first ... then'), the deliberately disproportionate objects, and masculine singular 'brother.' However, its final expression, 'ತೆಗೆದುಹಾಕಲು ನಿನಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣುವುದು,' is less direct than the Greek future active διαβλέψεις and can sound impersonal in Kannada. A revision should explicitly state that the addressed person will see clearly.
  naturalness: The sentence is generally modern and understandable. 'ಚಿಕ್ಕ ಕಡ್ಡಿ' is understandable but suggests a small stick more readily than κάρφος, which is a small dry fragment such as straw or a splinter. 'ಸಣ್ಣ ಹುಲ್ಲಿನ ಕಡ್ಡಿ' is more concrete and idiomatic in this eye-obstruction image.
  terminology: ಕಪಟಿಯೇ, ತೊಲೆ, and ಸಹೋದರನ are suitable. Retain 'ತೊಲೆ' for the large timber beam and clarify its sense in the footnote. Render κάρφος as 'ಸಣ್ಣ ಹುಲ್ಲಿನ ಕಡ್ಡಿ' and retain lexical alternatives.
  issues:
  - severity: medium
    issue: The rendering of διαβλέψεις is impersonal and syntactically less precise.
    rationale: 'The Greek has a second-person future active verb: ''then you will see clearly.'' ''ನಿನಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣುವುದು'' may be understood as ''it will become clearly visible to you,'' rather than directly stating that the addressee will see clearly.'
  - severity: low
    issue: ಚಿಕ್ಕ ಕಡ್ಡಿ is somewhat broader and more stick-like than κάρφος.
    rationale: κάρφος denotes a small dry piece, including straw, chaff, or a splinter. 'ಸಣ್ಣ ಹುಲ್ಲಿನ ಕಡ್ಡಿ' better maintains the material and exaggerated contrast with the large timber beam.
  revised_text: ಕಪಟಿಯೇ, ಮೊದಲು ನಿನ್ನ ಕಣ್ಣಿನಲ್ಲಿರುವ ತೊಲೆಯನ್ನು[a] ತೆಗೆದುಹಾಕು; ಆಗ ನಿನ್ನ ಸಹೋದರನ ಕಣ್ಣಿನಲ್ಲಿರುವ ಸಣ್ಣ ಹುಲ್ಲಿನ ಕಡ್ಡಿಯನ್ನು[b] ತೆಗೆದುಹಾಕಲು ನೀನು ಸ್ಪಷ್ಟವಾಗಿ ನೋಡುವೆ.
