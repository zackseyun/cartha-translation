id: MAT.7.5
reference: Matthew 7:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: kn
  text: ಕಪಟಿಯೇ, ಮೊದಲು ನಿನ್ನ ಕಣ್ಣಿನಲ್ಲಿರುವ ತೊಲೆಯನ್ನು[a] ತೆಗೆದುಹಾಕು; ಆಗ ನಿನ್ನ ಸಹೋದರನ ಕಣ್ಣಿನಲ್ಲಿರುವ ಸಣ್ಣ ಹುಲ್ಲಿನ ಕಡ್ಡಿಯನ್ನು[b] ತೆಗೆದುಹಾಕಲು ನೀನು ಸ್ಪಷ್ಟವಾಗಿ ನೋಡುವೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ತೊಲೆ’ಗೆ ಬದಲಾಗಿ ‘ದೊಡ್ಡ ಮರದ ದಿಮ್ಮಿ’ ಅಥವಾ ‘ಹಲಗೆ’ ಎಂದೂ ಅರ್ಥೈಸಬಹುದು (δοκός).
    reason: lexical_alternative
  - marker: b
    text: ‘ಸಣ್ಣ ಹುಲ್ಲಿನ ಕಡ್ಡಿ’ಗೆ ಬದಲಾಗಿ ‘ಮರದ ಚೂರು’ ಅಥವಾ ‘ಒಣ ಹುಲ್ಲಿನ ತುಣುಕು’ ಎಂದೂ ಅರ್ಥೈಸಬಹುದು (κάρφος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: ಕಪಟಿಯೇ
  rationale: ಏಕವಚನ ಸಂಬೋಧನೆಯ ಕಟುವಾದ ಗದರಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: ತೆಗೆದುಹಾಕು / ತೆಗೆದುಹಾಕಲು
  rationale: ಕಣ್ಣಿನಲ್ಲಿರುವ ವಸ್ತುವನ್ನು ಹೊರತೆಗೆಯುವ ರೂಪಕಕ್ಕೆ ಸಹಜವಾಗಿದ್ದು, ಎರಡೂ ಬಳಕೆಗಳಲ್ಲಿ ಒಂದೇ ಕ್ರಿಯಾಪದದ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πρῶτον
  choice: ಮೊದಲು
  rationale: ಕ್ರಮದಲ್ಲಿನ ಆದ್ಯತೆಯನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: δοκόν
  choice: ತೊಲೆ
  rationale: ಕಟ್ಟಡದಲ್ಲಿ ಬಳಸುವ ದೊಡ್ಡ ಮರದ ತೊಲೆಯನ್ನು ಸೂಚಿಸಿ, κάρφος ಎಂಬ ಸಣ್ಣ ವಸ್ತುವಿನೊಂದಿಗಿನ ಅತಿಶಯೋಕ್ತಿಯ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: διαβλέψεις
  choice: ನಿನಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣುವುದು
  rationale: διαβλέπω ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಸ್ಪಷ್ಟವಾಗಿ ನೋಡುವ ತೀವ್ರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಾಮರ್ಥ್ಯ ಎಂಬ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೆಚ್ಚಿಸುವುದಿಲ್ಲ.
- source_word: κάρφος
  choice: ಚಿಕ್ಕ ಕಡ್ಡಿ
  rationale: ಸಣ್ಣ ಒಣ ಹುಲ್ಲು ಅಥವಾ ಮರದ ಚೂರಿನ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಸರಳ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಿ, ದೊಡ್ಡ ತೊಲೆಯೊಂದಿಗಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἀδελφοῦ
  choice: ಸಹೋದರನ
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಸಂಬಂಧಪದವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಮುದಾಯಸಂಬಂಧದ ಭಾವದೊಂದಿಗೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἀδελφοῦ ಎಂಬ ಲಿಂಗಸೂಚಿತ ಸಂಬಂಧಪದ
  choice: ಸಹೋದರನ
  alternative: ಮತ್ತೊಬ್ಬನ / ನೆರೆಯವನ
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಪುಲ್ಲಿಂಗ ಏಕವಚನದಲ್ಲಿದೆ. ಸಂದರ್ಭವು ಬೇರೆ ರೀತಿಯಲ್ಲಿ ಒತ್ತಾಯಿಸದ ಕಾರಣ ಅದನ್ನು ಲಿಂಗತಟಸ್ಥಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- issue: διαβλέψεις ἐκβαλεῖν ಎಂಬ ರಚನೆಯಲ್ಲಿ ಸ್ಪಷ್ಟ ದೃಷ್ಟಿ ಮತ್ತು ಕಾರ್ಯಸಾಮರ್ಥ್ಯದ ಸಂಬಂಧ
  choice: ತೆಗೆದುಹಾಕಲು ನಿನಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣುವುದು
  alternative: ತೆಗೆದುಹಾಕಲು ನಿನಗೆ ಸಾಧ್ಯವಾಗುವುದು
  rationale: ಮೂಲಪಾಠವು ಸ್ಪಷ್ಟವಾಗಿ ನೋಡುವುದನ್ನು ನೇರವಾಗಿ ಹೇಳುತ್ತದೆ; ‘ಸಾಧ್ಯವಾಗುವುದು’ ಎಂಬುದು ಸೂಚಿತ ಪರಿಣಾಮವಾಗಬಹುದಾದರೂ ಅದನ್ನೇ ಮುಖ್ಯ ಅರ್ಥವಾಗಿ ಸ್ಥಿರಗೊಳಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾದರೂ ಗೌರವಯುತವಾದ ಗದರಿಕೆಯ ಧಾಟಿ ಬಳಸಲಾಗಿದೆ. ‘ತೊಲೆ’ ಮತ್ತು ‘ಚಿಕ್ಕ ಕಡ್ಡಿ’ ಎಂಬ ಪದಗಳು ಮೂಲದ ಉದ್ದೇಶಿತ ಅತಿಶಯೋಕ್ತಿಯ ವ್ಯತ್ಯಾಸವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ. ವಿರಾಮಚಿಹ್ನೆ ಮೂಲಕ ಆದೇಶ ಮತ್ತು ಅದರ ನಂತರದ ಫಲಿತಾಂಶವನ್ನು ಬೇರ್ಪಡಿಸಲಾಗಿದೆ.
