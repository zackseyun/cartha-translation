id: MAT.7.27
reference: Matthew 7:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: kn
  text: ಮಳೆ ಸುರಿಯಿತು, ನದಿಗಳು ಬಂದವು[a], ಗಾಳಿಗಳು ಬೀಸಿ ಆ ಮನೆಗೆ ಅಪ್ಪಳಿಸಿದವು; ಅದು ಬಿದ್ದುಹೋಯಿತು; ಅದರ ಪತನವು ಬಹಳ ದೊಡ್ಡದಾಗಿತ್ತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪ್ರವಾಹಗಳು ಬಂದವು.” ಗ್ರೀಕ್ ನಾಮಪದದ ಹೆಚ್ಚು ನೇರ ಅರ್ಥ “ನದಿಗಳು”; ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅದು ಪ್ರವಾಹದ ನೀರನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: ಮಳೆ ಸುರಿಯಿತು
  rationale: ಗ್ರೀಕ್ ಪದಗುಚ್ಛವು ಮಳೆ ಕೆಳಗೆ ಬರುವುದನ್ನು ಹೇಳುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮಳೆ ಸುರಿಯಿತು’ ಸಹಜವಾಗಿದ್ದು ಅದೇ ಘಟನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἦλθον οἱ ποταμοί
  choice: ನದಿಗಳು ಉಕ್ಕಿಬಂದವು
  rationale: ποταμοί ಎಂಬುದರ ಮೂಲ ಅರ್ಥ ‘ನದಿಗಳು’. ಬಿರುಗಾಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ನೀರು ಉಕ್ಕಿಬರುವ ಚಿತ್ರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತೋರಿಸಲು ಕ್ರಿಯಾಪದದಲ್ಲಿ ಸಂದರ್ಭಾರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ‘ಪ್ರವಾಹಗಳು ಬಂದವು’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: ಗಾಳಿಗಳು ಬೀಸಿ
  rationale: ಪದಗಳ ನೇರ ಹಾಗೂ ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥ; ಮುಂದಿನ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಗ್ರೀಕ್ ವಾಕ್ಯದ ಸರಣಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ಆ ಮನೆಯ ಮೇಲೆ ಅಪ್ಪಳಿಸಿದವು
  rationale: ಈ ಬಿರುಗಾಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ προσκόπτω ಎಂದರೆ ಹೊಡೆದು ತಾಕುವುದು. ‘ಅಪ್ಪಳಿಸಿದವು’ ಬಲವಾದ ತಾಕುವಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἔπεσεν
  choice: ಅದು ಬಿದ್ದುಹೋಯಿತು
  rationale: πίπτω ಎಂಬ ಸರಳ ‘ಬೀಳು’ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ‘ಕುಸಿದುಹೋಯಿತು’ ಎಂಬ ಹೆಚ್ಚು ವಿವರಣಾತ್ಮಕ ಪದವನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: ಅದರ ಪತನವು ಬಹಳ ದೊಡ್ಡದಾಗಿತ್ತು
  rationale: πτῶσις ಅನ್ನು ‘ಪತನ’ ಎಂದು ನೀಡಿ ಹಿಂದಿನ ‘ಬಿದ್ದುಹೋಯಿತು’ ಎಂಬ ಪದದೊಂದಿಗೆ ಮೂಲದಲ್ಲಿರುವ ಪದಸಂಬಂಧವನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸಲಾಗಿದೆ; μεγάληಯ ತೀವ್ರತೆಯನ್ನೂ ಕಡಿಮೆ ಮಾಡಿಲ್ಲ.
theological_decisions:
- issue: ದೃಷ್ಟಾಂತದ ಅಂತ್ಯದಲ್ಲಿರುವ ನ್ಯಾಯತೀರ್ಪಿನ ತೀವ್ರ ಚಿತ್ರಣ
  choice: ಅದರ ಪತನವು ಬಹಳ ದೊಡ್ಡದಾಗಿತ್ತು
  alternative: ಅದು ಭೀಕರವಾಗಿ ಸಂಪೂರ್ಣ ನಾಶವಾಯಿತು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಮನೆಯ ಪತನ ದೊಡ್ಡದಾಗಿತ್ತು ಎಂದಷ್ಟೇ ಹೇಳುತ್ತದೆ. ಅದನ್ನು ಅಂತ್ಯಕಾಲದ ನ್ಯಾಯತೀರ್ಪು ಅಥವಾ ಸಂಪೂರ್ಣ ವಿನಾಶವೆಂದು ವಿಸ್ತರಿಸದೆ, ಎಚ್ಚರಿಕೆಯ ಬಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಮತ್ತು ದೃಶ್ಯಮಯ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಕ್ರಮಬದ್ಧ ಬಿರುಗಾಳಿ ಚಿತ್ರಣವನ್ನು ಚಿಕ್ಕ ವಾಕ್ಯಖಂಡಗಳ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
