id: MAT.7.11
reference: Matthew 7:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: kn
  text: ಹೀಗಿರುವಾಗ, ಕೆಟ್ಟವರಾಗಿದ್ದರೂ ನೀವು ನಿಮ್ಮ ಮಕ್ಕಳಿಗೆ ಒಳ್ಳೆಯ ಉಡುಗೊರೆಗಳನ್ನು ಕೊಡಲು ತಿಳಿದಿದ್ದರೆ, ಪರಲೋಕಗಳಲ್ಲಿ ಇರುವ ನಿಮ್ಮ ತಂದೆಯು[a] ಆತನನ್ನು ಬೇಡುವವರಿಗೆ ಒಳ್ಳೆಯವುಗಳನ್ನು[b] ಎಷ್ಟೋ ಹೆಚ್ಚಾಗಿ ಕೊಡುವರು!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಹೆಚ್ಚು ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ, ‘ಪರಲೋಕದಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಪರಲೋಕಗಳಲ್ಲಿ’ ಎಂಬುದು ಬಹುವಚನದಲ್ಲಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಕೆಲವು ಅನುವಾದಗಳು ಇಲ್ಲಿ ‘ಒಳ್ಳೆಯ ಉಡುಗೊರೆಗಳನ್ನು’ ಎನ್ನುತ್ತವೆ; ಆದರೆ ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ‘ಒಳ್ಳೆಯವುಗಳನ್ನು’ ಎಂದಷ್ಟೇ ಇದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: ಕೆಟ್ಟವರಾಗಿದ್ದರೂ
  rationale: ಕೃದಂತದ ವಿವರಣಾತ್ಮಕ ಹಾಗೂ ಸಂದರ್ಭದಲ್ಲಿನ ಒಪ್ಪಿಕೊಳ್ಳುವಿಕೆಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ. ಮಾನವನ ನೈತಿಕ ಕೆಡುಕನ್ನು ಮೃದುಗೊಳಿಸದೆ, ‘ದುಷ್ಟರು’ ಎಂಬ ಹೆಚ್ಚು ಕಠಿಣ ಪದವನ್ನೂ ಅನಗತ್ಯವಾಗಿ ಬಳಸುವುದಿಲ್ಲ.
- source_word: οἴδατε ... διδόναι
  choice: ಕೊಡಲು ನಿಮಗೆ ತಿಳಿದಿರುವುದಾದರೆ
  rationale: ಪೂರಕ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ οἴδατε ಪ್ರಾಯೋಗಿಕ ತಿಳಿವಳಿಕೆ ಅಥವಾ ಸಾಮರ್ಥ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಕನ್ನಡ ರೂಪವು ‘ಕೊಡುವುದು ಹೇಗೆಂದು ತಿಳಿದಿದ್ದರೆ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: δόματα ἀγαθὰ
  choice: ಒಳ್ಳೆಯ ಉಡುಗೊರೆಗಳನ್ನು
  rationale: δόματα ಎಂದರೆ ಕೊಡಲ್ಪಡುವ ಉಡುಗೊರೆಗಳು; ἀγαθὰ ಅದನ್ನು ‘ಒಳ್ಳೆಯ’ ಎಂದು ವರ್ಣಿಸುತ್ತದೆ.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: ನಿಮ್ಮ ಮಕ್ಕಳಿಗೆ
  rationale: τέκνα ಲಿಂಗಸಮಾವೇಶಕವಾಗಿ ಮಕ್ಕಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಗಂಡುಮಕ್ಕಳಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: πόσῳ μᾶλλον
  choice: ಇನ್ನೆಷ್ಟು ಹೆಚ್ಚಾಗಿ
  rationale: ಕಡಿಮೆಯಿಂದ ಹೆಚ್ಚಿನದಕ್ಕೆ ಸಾಗುವ ಯುಕ್ತಿಯನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಹೋಲಿಕೆಯ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: ಪರಲೋಕಗಳಲ್ಲಿ ಇರುವ ನಿಮ್ಮ ತಂದೆಯು
  rationale: ಮೂಲದಲ್ಲಿರುವ ‘ತಂದೆ’ ಮತ್ತು ಅದನ್ನು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವ ಸ್ಥಳಸೂಚಕ ವಾಕ್ಯಾಂಶದ ರಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; οὐρανοῖς ಬಹುವಚನವಾಗಿರುವುದರಿಂದ ‘ಪರಲೋಕಗಳಲ್ಲಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: δώσει ἀγαθὰ
  choice: ಒಳ್ಳೆಯ ಸಂಗತಿಗಳನ್ನು ... ಕೊಡುವರು
  rationale: ಎರಡನೆಯ ಉಪವಾಕ್ಯದಲ್ಲಿ δόματα ಪುನರಾವರ್ತನೆಯಾಗಿಲ್ಲ; ವಿಶೇಷಣವು ನಾಮಪದಾರ್ಥದಲ್ಲಿ ಬಳಕೆಯಾದುದರಿಂದ ‘ಒಳ್ಳೆಯ ಸಂಗತಿಗಳು’ ಎಂದು ಅನುವಾದಿಸಿ ‘ಉಡುಗೊರೆಗಳು’ ಎಂಬ ಪದವನ್ನು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ಸೇರಿಸಿಲ್ಲ.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: ತಮ್ಮನ್ನು ಕೇಳುವವರಿಗೆ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಸಾಮಾನ್ಯವಾಗಿ ಕೇಳುವವರ ವರ್ಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಗೌರವಸೂಚಕ ಆತ್ಮವಾಚಕ ಸರ್ವನಾಮದೊಂದಿಗೆ ಈ ರೂಪವು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಹೋಲಿಕೆಯಲ್ಲಿ ‘ಕೆಟ್ಟವರಾಗಿರುವ’ ಎಂಬ ಮಾನವಶಾಸ್ತ್ರೀಯ ಹೇಳಿಕೆಯ ಬಲ
  choice: ‘ಕೆಟ್ಟವರಾಗಿದ್ದರೂ’ ಎಂಬ ನೇರ ನೈತಿಕ ವಿವರಣೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಪಾಪಿಗಳಾಗಿದ್ದರೂ’ ಅಥವಾ ‘ನೈತಿಕವಾಗಿ ಅಪೂರ್ಣರಾಗಿದ್ದರೂ’
  rationale: ಮೂಲವು ಮಾನವರ ಕೆಡುಕನ್ನೂ ತಂದೆಯ ಹೆಚ್ಚಿನ ಒಳ್ಳೆಯತನವನ್ನೂ ಮುಖಾಮುಖಿಯಾಗಿಸುತ್ತದೆ. ‘ಪಾಪಿಗಳು’ ಎನ್ನುವುದು ಮೂಲದಲ್ಲಿಲ್ಲದ ನಿರ್ದಿಷ್ಟ ಧಾರ್ಮಿಕ ಪದವನ್ನು ಸೇರಿಸಬಹುದು; ‘ಅಪೂರ್ಣರು’ ಎನ್ನುವುದು ಹೇಳಿಕೆಯನ್ನು ಮೃದುಗೊಳಿಸುತ್ತದೆ.
- issue: ὁ ἐν τοῖς οὐρανοῖς ಎಂಬ ಪದಗುಚ್ಛದ ರೂಪ
  choice: ‘ಪರಲೋಕಗಳಲ್ಲಿ ಇರುವ ನಿಮ್ಮ ತಂದೆ’ ಎಂದು ಬಹುವಚನ ಸ್ಥಳಸೂಚಕ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಪರಲೋಕದಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆ’ ಅಥವಾ ‘ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆ’
  rationale: ಇದು ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಪಾರದರ್ಶಕವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸಿ, ಸ್ಥಳಸೂಚಕ ಪದಗುಚ್ಛವನ್ನು ಕೇವಲ ವಿಶೇಷಣಾತ್ಮಕ ಬಿರುದಾಗಿ ಬದಲಾಯಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಪೂರ್ಣವೂ ಆದ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ದೇವರನ್ನು ಸೂಚಿಸುವ ಕ್ರಿಯಾಪದ ಮತ್ತು ಆತ್ಮವಾಚಕ ಸರ್ವನಾಮಕ್ಕೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಹೋಲಿಕೆಯ ಪ್ರಶ್ನಾರ್ಥಕ/ಉದ್ಗಾರಾತ್ಮಕ ಬಲವನ್ನು ಅಂತ್ಯದ ಉದ್ಗಾರಚಿಹ್ನೆಯಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
