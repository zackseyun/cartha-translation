id: MAT.7.20
reference: Matthew 7:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ[a] ಅವರ ಫಲಗಳಿಂದ ನೀವು ಅವರನ್ನು ಗುರುತಿಸುವಿರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹಾಗಾದರೆ ನಿಜವಾಗಿಯೂ, ಅವರ ಫಲಗಳಿಂದ ನೀವು ಅವರನ್ನು ತಿಳಿದುಕೊಳ್ಳುವಿರಿ.’
    reason: ἄρα γε ಎಂಬುದರ ಒತ್ತುನೀಡುವ ತೀರ್ಮಾನಾರ್ಥಕ್ಕೂ ἐπιγνώσεσθε ಎಂಬುದರ ‘ತಿಳಿದುಕೊಳ್ಳುವಿರಿ’ ಎಂಬ ಪರ್ಯಾಯಕ್ಕೂ ಹೆಚ್ಚು ಪದಶಃ ರೂಪ.
lexical_decisions:
- source_word: ἄρα γε
  choice: ಆದ್ದರಿಂದ
  rationale: ಈ ಪದಸಮೂಹವು ಹಿಂದಿನ ಮಾತಿನಿಂದ ಒತ್ತುನೀಡುವ ತೀರ್ಮಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಆದ್ದರಿಂದ’ ಆ ತಾರ್ಕಿಕ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಸೌಮ್ಯ ಒತ್ತನ್ನು ಪಾದಟಿಪ್ಪಣಿಯ ಪರ್ಯಾಯವು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ
  choice: -ಗಳಿಂದ
  rationale: ಇಲ್ಲಿ ಜನರನ್ನು ಗುರುತಿಸುವ ಆಧಾರ ಅಥವಾ ಸಾಧನವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅವರ ಫಲಗಳಿಂದ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಗ್ರೀಕ್‌ನ ಸಂಬಂಧವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: καρπῶν
  choice: ಫಲಗಳಿಂದ
  rationale: ಗ್ರೀಕ್‌ನ ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ಕ್ರಿಯೆಗಳು ಅಥವಾ ಪರಿಣಾಮಗಳನ್ನು ನೇರವಾಗಿ ಹೇಳದೆ ಮೂಲದ ಫಲದ ರೂಪಕವನ್ನೇ ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
- source_word: αὐτῶν
  choice: ಅವರ
  rationale: ಇದು ‘ಫಲಗಳು’ ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಸರ್ವನಾಮ; ಕನ್ನಡದಲ್ಲಿ ‘ಅವರ ಫಲಗಳಿಂದ’ ಸಹಜ ರೂಪವಾಗಿದೆ.
- source_word: ἐπιγνώσεσθε
  choice: ನೀವು ಗುರುತಿಸುವಿರಿ
  rationale: ಭವಿಷ್ಯಕಾಲದ ದ್ವಿತೀಯ ಪುರುಷ ಬಹುವಚನ. ಕಾಣುವ ಸಾಕ್ಷ್ಯದಿಂದ ಅವರು ಯಾರೆಂದು ತಿಳಿದುಕೊಳ್ಳುವ ಅಥವಾ ಗುರುತಿಸುವ ಸಂದರ್ಭಾರ್ಥವನ್ನು ‘ಗುರುತಿಸುವಿರಿ’ ನಿಖರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: αὐτούς
  choice: ಅವರನ್ನು
  rationale: ಹಿಂದೆ ಉಲ್ಲೇಖಿಸಲಾದ ಜನರನ್ನು ಸೂಚಿಸುವ ಕರ್ಮಪದ ಸರ್ವನಾಮಕ್ಕೆ ಇದು ಸಹಜ ಕನ್ನಡ ರೂಪವಾಗಿದೆ.
theological_decisions:
- issue: ಜನರನ್ನು ಮೌಲ್ಯಮಾಪನ ಮಾಡುವ ಸಂದರ್ಭದಲ್ಲಿ ‘ಫಲಗಳು’ ಎಂಬ ರೂಪಕ
  choice: ‘ಫಲಗಳು’ ಎಂಬ ರೂಪಕವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಅವರ ಕ್ರಿಯೆಗಳಿಂದ; ಅವರ ಪರಿಣಾಮಗಳಿಂದ
  rationale: ವಚನವು ಕಾಣಬಹುದಾದ ಪರಿಣಾಮಗಳ ಆಧಾರದ ಮೇಲೆ ವಿವೇಚಿಸುವುದನ್ನು ಕಲಿಸಿದರೂ, ಮೂಲಪಠ್ಯವು ಫಲದ ರೂಪಕವನ್ನೇ ಬಳಸುತ್ತದೆ. ಅದನ್ನು ಉಳಿಸುವುದು ತಕ್ಷಣದ ಸಂದರ್ಭದ ನಿರಂತರತೆಯನ್ನು ಕಾಪಾಡಿ, ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಕಿರಿದಾಗಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಘನತೆಯ ಶೈಲಿ. ‘ಫಲಗಳು’ ಎಂಬ ಬೈಬಲ್ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
