id: MAT.7.7
reference: Matthew 7:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: kn
  text: ಕೇಳಿರಿ[a], ನಿಮಗೆ ಕೊಡಲಾಗುವುದು; ಹುಡುಕಿರಿ, ನೀವು ಕಂಡುಕೊಳ್ಳುವಿರಿ; ತಟ್ಟಿರಿ, ನಿಮಗೆ ತೆರೆಯಲಾಗುವುದು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಗ್ರೀಕ್‌ನ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕ ರೂಪಗಳನ್ನು ಮುಂದುವರಿದ ಅರ್ಥದಲ್ಲಿಯೂ ಗ್ರಹಿಸಬಹುದು: “ಕೇಳುತ್ತಲೇ ಇರಿ … ಹುಡುಕುತ್ತಲೇ ಇರಿ … ತಟ್ಟುತ್ತಲೇ ಇರಿ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: ಕೇಳಿರಿ
  rationale: ವರ್ತಮಾನ ಕರ್ತರಿ ಆಜ್ಞಾರ್ಥಕ, ಬಹುವಚನ. ‘ಕೇಳಿರಿ’ ಪ್ರಾರ್ಥನೆ ಅಥವಾ ವಿನಂತಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಆಜ್ಞೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ಮುಂದುವರಿದ ಕ್ರಿಯೆಯ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: δοθήσεται
  choice: ಕೊಡಲಾಗುವುದು
  rationale: ಭವಿಷ್ಯತ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ಗ್ರೀಕ್ ಪಠ್ಯದಂತೆಯೇ ಕೊಡುವವರನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸದೆ ಬಿಡುತ್ತದೆ.
- source_word: ὑμῖν
  choice: ನಿಮಗೆ / ನಿಮಗಾಗಿ
  rationale: 'ಬಹುವಚನ ದತ್ತಿವಿಭಕ್ತಿಯ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂದರ್ಭಾನುಸಾರ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ: ಕೊಡುವುದರೊಂದಿಗೆ ‘ನಿಮಗೆ’, ತೆರೆಯುವುದರೊಂದಿಗೆ ‘ನಿಮಗಾಗಿ’.'
- source_word: ζητεῖτε
  choice: ಹುಡುಕಿರಿ
  rationale: ವರ್ತಮಾನ ಕರ್ತರಿ ಆಜ್ಞಾರ್ಥಕದ ನೇರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ರೂಪ; ಅಕ್ಷರಶಃ ಹಾಗೂ ರೂಪಕ ಅರ್ಥಗಳೆರಡಕ್ಕೂ ಹೊಂದುತ್ತದೆ.
- source_word: εὑρήσετε
  choice: ನೀವು ಕಂಡುಕೊಳ್ಳುವಿರಿ
  rationale: ಭವಿಷ್ಯತ್ ಕರ್ತರಿ ರೂಪ ಮತ್ತು ದ್ವಿತೀಯ ಪುರುಷ ಬಹುವಚನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κρούετε
  choice: ತಟ್ಟಿರಿ
  rationale: ಬಾಗಿಲನ್ನು ತಟ್ಟುವ ಅರ್ಥಕ್ಕೆ ಸಹಜ ಕನ್ನಡ ಆಜ್ಞಾರ್ಥಕ; ಮುಂದುವರಿಕೆ ಅಥವಾ ಪುನರಾವರ್ತನೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹೆಚ್ಚುವರಿಯಾಗಿ ಸೇರಿಸಿಲ್ಲ.
- source_word: ἀνοιγήσεται
  choice: ತೆರೆಯಲಾಗುವುದು
  rationale: ಗ್ರೀಕ್ ಭವಿಷ್ಯತ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ತೆರೆಯುವುದು’ ಎಂದು ಅನೈಚ್ಛಿಕ/ಅಕರ್ತೃಕವಾಗಿ ಬದಲಿಸುವುದಿಲ್ಲ.
- source_word: καὶ
  choice: ; / ವಾಕ್ಯಸಂಬಂಧದಲ್ಲಿ ಅಂತರ್ನಿಹಿತ ಸಮನ್ವಯ
  rationale: ಗ್ರೀಕ್‌ನ ಪುನರಾವರ್ತಿತ καὶ ಸಮಾನಾಂತರ ಲಯವನ್ನು ಕಟ್ಟುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಯೊಂದು ಜೋಡಿಯ ಕಾರಣ-ಫಲ ಸಂಬಂಧವು ವಿರಾಮಚಿಹ್ನೆಯಿಂದ ಸಹಜವಾಗಿ ವ್ಯಕ್ತವಾಗುತ್ತದೆ; ‘ಆಗ’ ಎಂಬ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲದ ಸ್ಪಷ್ಟ ಪರಿಣಾಮಾರ್ಥವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
theological_decisions:
- issue: ಮೂರು ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕಗಳ ಕ್ರಿಯಾಂಶ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸರಳ ಆಜ್ಞೆಗಳಾಗಿ ‘ಕೇಳಿರಿ, ಹುಡುಕಿರಿ, ತಟ್ಟಿರಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಕೇಳುತ್ತಲೇ ಇರಿ, ಹುಡುಕುತ್ತಲೇ ಇರಿ, ತಟ್ಟುತ್ತಲೇ ಇರಿ’ ಎಂದು ನಿರಂತರತೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕಗಳು ಅಪೂರ್ಣ/ಮುಂದುವರಿದ ಕ್ರಿಯೆಯ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಹೊಂದಿರಬಹುದು; ಆದರೆ ಅವು ಕಡ್ಡಾಯವಾಗಿ ‘ಮಾಡುತ್ತಲೇ ಇರಿ’ ಎಂಬ ವಿಸ್ತೃತ ಅನುವಾದವನ್ನು ಬೇಡುವುದಿಲ್ಲ. ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲು ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
- issue: ಭವಿಷ್ಯತ್ ಕರ್ಮಣಿ ರೂಪಗಳಲ್ಲಿ ಕ್ರಿಯಾಕರ್ತೃ
  choice: ‘ಕೊಡಲಾಗುವುದು’ ಮತ್ತು ‘ತೆರೆಯಲಾಗುವುದು’ ಎಂದು ಕ್ರಿಯಾಕರ್ತೃವನ್ನು ಹೇಳದೆ ಕರ್ಮಣಿ ರೂಪ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ದೇವರು ನಿಮಗೆ ಕೊಡುವನು / ದೇವರು ನಿಮಗಾಗಿ ತೆರೆಯುವನು’ ಎಂದು ಕ್ರಿಯಾಕರ್ತೃವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಸಂದರ್ಭವು ದೇವರನ್ನು ಸೂಚಿತ ಕ್ರಿಯಾಕರ್ತೃ ಎಂದು ತಿಳಿಯಲು ಅವಕಾಶಕೊಟ್ಟರೂ, ಗ್ರೀಕ್ ಪಠ್ಯವು ಇಲ್ಲಿ ದೇವರನ್ನು ನೇರವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನುವಾದವು ಆ ಧಾರ್ಮಿಕ ಸೂಚನೆಯನ್ನು ವಿವರಣೆಯಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ಮೂರು ಸಮಾನಾಂತರ ಆಜ್ಞೆ-ವಾಗ್ದಾನ ಜೋಡಿಗಳ ಸಂಕ್ಷಿಪ್ತ ಲಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಭಾಷೆ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆಗಿದೆ.
