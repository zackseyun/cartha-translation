  to: ಕಿರಿದಾದ ಬಾಗಿಲಿನ ಮೂಲಕ ಪ್ರವೇಶಿಸಿರಿ. ಏಕೆಂದರೆ ಬಾಗಿಲು ಅಗಲವಾಗಿದೆ ಮತ್ತು ನಾಶಕ್ಕೆ[b] ಕರೆದೊಯ್ಯುವ ದಾರಿ ವಿಶಾಲವಾಗಿದೆ[a]; ಅದರ ಮೂಲಕ[c] ಪ್ರವೇಶಿಸುವವರು ಅನೇಕರು.
  rationale: The revision replaces an unnecessarily explicit antecedent with Kannada ‘ಅದರ ಮೂಲಕ,’ preserving the grammatical ambiguity of the Greek while noting the contextual possibility that the gate is intended. It also corrects the erroneous gender claim in footnote c and uses ‘ಕಿರಿದಾದ’ as the most direct natural equivalent of ‘narrow.’ No theological meaning is altered.
