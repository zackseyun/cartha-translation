id: MAT.7.13
reference: Matthew 7:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: kn
  text: ಕಿರಿದಾದ ಬಾಗಿಲಿನ ಮೂಲಕ ಪ್ರವೇಶಿಸಿರಿ. ಏಕೆಂದರೆ ಬಾಗಿಲು ಅಗಲವಾಗಿದೆ ಮತ್ತು ನಾಶಕ್ಕೆ[b] ಕರೆದೊಯ್ಯುವ ದಾರಿ ವಿಶಾಲವಾಗಿದೆ[a]; ಅದರ ಮೂಲಕ[c] ಪ್ರವೇಶಿಸುವವರು ಅನೇಕರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ವಿಸ್ತಾರವಾದ’ ಅಥವಾ ‘ಸಾಕಷ್ಟು ಸ್ಥಳವಿರುವ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ εὐρύχωρος ಪದಕ್ಕೆ ಈ ಅರ್ಥವ್ಯಾಪ್ತಿ ಇದೆ.
    reason: lexical_alternative
  - marker: b
    text: ‘ಹಾಳಿಗೆ’ ಅಥವಾ ‘ದುರ್ಗತಿಗೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ἀπώλεια ಪದವು ನಾಶ, ಹಾಳು ಅಥವಾ ದುರ್ಗತಿಯನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: c
    text: ಪದಶಃ ‘ಅದರ ಮೂಲಕ.’ ಗ್ರೀಕ್ αὐτῆς ಎಂಬ ಸ್ತ್ರೀಲಿಂಗ ಸರ್ವನಾಮವು ‘ಬಾಗಿಲು’ ಮತ್ತು ‘ದಾರಿ’ ಎಂಬೆರಡಕ್ಕೂ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಹೊಂದಬಹುದು; ಸಂದರ್ಭವು ಬಾಗಿಲನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: referent_clarification
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: ಪ್ರವೇಶಿಸಿರಿ
  rationale: ಎರಡನೆಯ ಪುರುಷ ಬಹುವಚನದ ಆಜ್ಞಾರ್ಥಕ ರೂಪದ ನೇರ ಬಲವನ್ನು ಉಳಿಸುವ, ಸಹಜವೂ ಗೌರವಪೂರ್ಣವೂ ಆದ ಕನ್ನಡ ಪ್ರಯೋಗ.
- source_word: διὰ τῆς στενῆς πύλης
  choice: ಇಕ್ಕಟ್ಟಾದ ಬಾಗಿಲಿನ ಮೂಲಕ
  rationale: διά ಜೊತೆಗೆ ಷಷ್ಠೀ ವಿಭಕ್ತಿ ಚಲನೆಯ ‘ಮೂಲಕ’ ಎಂಬ ಅರ್ಥವನ್ನು ಕೊಡುತ್ತದೆ. στενός ಇಲ್ಲಿ ಅಗಲ ಕಡಿಮೆಯಿರುವುದನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಇಕ್ಕಟ್ಟಾದ’ ಎಂಬುದು ಮುಂದಿನ ‘ಅಗಲ’ ಮತ್ತು ‘ವಿಶಾಲ’ ಎಂಬ ವಿರೋಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಮುಂದಿನ ಮಾತು ಆರಂಭದ ಆಜ್ಞೆಗೆ ಕಾರಣ ಅಥವಾ ವಿವರಣೆಯನ್ನು ನೀಡುತ್ತದೆ.
- source_word: πλατεῖα ἡ πύλη
  choice: ಬಾಗಿಲು ಅಗಲವಾಗಿದೆ
  rationale: πλατύς ಪದದ ಸ್ಥಳವಾಚಕ ಅರ್ಥವನ್ನು ಸರಳ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: ದಾರಿ ವಿಶಾಲವಾಗಿದೆ
  rationale: εὐρύχωρος ಎಂದರೆ ವಿಶಾಲವಾದ ಅಥವಾ ಸಾಕಷ್ಟು ಸ್ಥಳವಿರುವುದು. ‘ವಿಶಾಲ’ ಎಂಬುದು ಪ್ರಯಾಣದ ರೂಪಕಕ್ಕೆ ಸಹಜವಾಗಿ ಹೊಂದುತ್ತದೆ; ‘ವಿಸ್ತಾರವಾದ’ ಎಂಬ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἡ ἀπάγουσα
  choice: ಕರೆದೊಯ್ಯುವ
  rationale: ವರ್ತಮಾನ ಕೃದಂತರೂಪವು ದಾರಿಯ ಗಮ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕರೆದೊಯ್ಯುವ’ ಕನ್ನಡದಲ್ಲಿ ಅದರ ದಿಕ್ಕು ಮತ್ತು ಪರಿಣಾಮ ಎರಡನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἰς τὴν ἀπώλειαν
  choice: ನಾಶಕ್ಕೆ
  rationale: ἀπώλεια ವಿನಾಶ, ಹಾಳು ಅಥವಾ ದುರ್ಗತಿಯನ್ನು ಸೂಚಿಸಬಹುದು. ‘ನಾಶ’ ಎಚ್ಚರಿಕೆಯ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಿ, ಅದರ ಪೂರ್ಣ ದೇವತಾತ್ತ್ವಿಕ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: ಆ ಬಾಗಿಲಿನ ಮೂಲಕ ಪ್ರವೇಶಿಸುವವರು ಅನೇಕರು
  rationale: ‘ಅನೇಕರು’ ಎಂಬ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ. αὐτῆς ಎಂಬ ಸ್ತ್ರೀಲಿಂಗ ಸರ್ವನಾಮವು ಸ್ತ್ರೀಲಿಂಗ πύλη (‘ಬಾಗಿಲು’) ಕಡೆಗೆ ಸೂಚಿಸುವುದರಿಂದ, ಲಿಂಗಸೂಚನೆ ಇಲ್ಲದ ಕನ್ನಡದಲ್ಲಿ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಆ ಬಾಗಿಲು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: ἀπώλεια ಎಂಬ ಪದವು ಸೂಚಿಸುವ ಅಂತಿಮ ಪರಿಣಾಮ
  choice: ನಾಶ
  alternative: ಹಾಳು; ದುರ್ಗತಿ
  rationale: ವಾಕ್ಯವು ಭೀಕರ ಅಂತ್ಯವನ್ನು ಎಚ್ಚರಿಸುತ್ತದೆ; ಆದರೆ ಆ ಅಂತ್ಯದ ಸಂಪೂರ್ಣ ದೇವತಾತ್ತ್ವಿಕ ಸ್ವರೂಪವನ್ನು ಇಲ್ಲಿ ವಿವರಿಸುವುದಿಲ್ಲ. ‘ನಾಶ’ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡೇ ಆ ಒತ್ತಡವನ್ನು ತೆರೆದಿಡುತ್ತದೆ.
- issue: δι’ αὐτῆς ಎಂಬ ಸರ್ವನಾಮದ ಪೂರ್ವಪದ
  choice: ಆ ಬಾಗಿಲಿನ ಮೂಲಕ
  alternative: ಅದರ ಮೂಲಕ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ αὐτῆς ಸ್ತ್ರೀಲಿಂಗವಾಗಿದ್ದು ಸ್ತ್ರೀಲಿಂಗ πύλη (‘ಬಾಗಿಲು’)ಗೆ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ; ὁδός (‘ದಾರಿ’) ಪುಲ್ಲಿಂಗವಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಆ ಲಿಂಗಸೂಚನೆ ಕಳೆದುಹೋಗುವುದರಿಂದ ಉದ್ದೇಶಿತ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ, ಆದರೆ ಮೂಲದ ಪದಶಃ ರೂಪವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆ ಹೊಂದಿದ ಎಚ್ಚರಿಕೆಯ ಧಾಟಿ ಬಳಸಲಾಗಿದೆ. ‘ಪ್ರವೇಶಿಸಿರಿ’ ಆಜ್ಞೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ. ಗ್ರೀಕ್‌ನ ಬಾಗಿಲು–ದಾರಿ ರೂಪಕವನ್ನು ಸ್ಪಷ್ಟವಾಗಿಯೇ ಉಳಿಸಿ, ಕನ್ನಡದಲ್ಲಿ ಕಳೆದುಹೋಗುವ ಸರ್ವನಾಮದ ಲಿಂಗಸೂಚನೆಯನ್ನು ಅಲ್ಪ ಸ್ಪಷ್ಟೀಕರಣದಿಂದ ಪೂರೈಸಲಾಗಿದೆ.
