  naturalness: The sentence is fluent modern standard Kannada. ‘ಎಲ್ಲ ವಿಷಯಗಳಲ್ಲಿಯೂ,’ ‘ನೀವೂ,’ and ‘ಹಾಗೆಯೇ ಮಾಡಿ’ are clear and appropriately direct. ‘ಸಾರಾಂಶವಾಗಿದೆ’ is natural in this established scriptural-summary expression.
