id: MAT.7.12
reference: Matthew 7:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ಎಲ್ಲ ವಿಷಯಗಳಲ್ಲಿಯೂ ಜನರು ನಿಮಗೆ ಏನು ಮಾಡಬೇಕೆಂದು ನೀವು ಬಯಸುತ್ತೀರೋ, ನೀವೂ ಅವರಿಗೆ ಹಾಗೆಯೇ ಮಾಡಿ; ಏಕೆಂದರೆ ಇದೇ ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳ ಸಾರಾಂಶವಾಗಿದೆ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: ಆದ್ದರಿಂದ, ಎಲ್ಲ ವಿಷಯಗಳಲ್ಲಿಯೂ ... ಏನು
  rationale: Πάντα ಮತ್ತು ὅσα ಸೇರಿ ಸಮಗ್ರ ವ್ಯಾಪ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತವೆ; ‘ಎಲ್ಲ ವಿಷಯಗಳಲ್ಲಿಯೂ ... ಏನು’ ಎಂಬ ರೂಪ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಆ ಸಾರ್ವತ್ರಿಕತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. οὖν ಹಿಂದಿನ ಬೋಧನೆಯಿಂದ ಬರುವ ನಿರ್ಣಯವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದ್ದರಿಂದ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν
  choice: ನಿಮಗೆ ಏನು ಮಾಡಬೇಕೆಂದು ನೀವು ಬಯಸುತ್ತೀರೋ
  rationale: θέλω ನಂತರದ ἵνα ಮತ್ತು ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯಾಪದವು ಬಯಸಿದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತವೆ. ಈ ಕನ್ನಡ ಸಂಬಂಧವಾಚಕ ರಚನೆ ಸಾಮಾನ್ಯ ನಿಯಮದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ ἄνθρωποι
  choice: ಜನರು
  rationale: ಇಲ್ಲಿ ἄνθρωποι ಪುರುಷರಿಗೆ ಮಾತ್ರ ಸೀಮಿತವಾಗದೆ ಮಾನವರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಜನರು’ ಆ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: ನೀವೂ ಅವರಿಗೆ ಹಾಗೆಯೇ ಮಾಡಿ
  rationale: οὕτως καὶ ಎಂಬ ಪರಸ್ಪರ ಹೊಂದಾಣಿಕೆಯನ್ನು ‘ಹಾಗೆಯೇ’ ಉಳಿಸುತ್ತದೆ; ποιεῖτε ಆಜ್ಞಾರ್ಥಕವಾಗಿರುವುದರಿಂದ ‘ಮಾಡಿ’ ಸೂಕ್ತವಾಗಿದೆ. ‘ನೀವೂ’ ಎಂಬುದು ὑμεῖς ಮೇಲಿನ ಒತ್ತನ್ನು ತೋರಿಸುತ್ತದೆ.
- source_word: οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται
  choice: ಏಕೆಂದರೆ ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳ ತಾತ್ಪರ್ಯ ಇದೇ
  rationale: γάρ ನೀಡುವ ಕಾರಣವನ್ನು ‘ಏಕೆಂದರೆ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ‘ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳು’ ಎಂಬ ಸ್ಥಿರ ಶಾಸ್ತ್ರೀಯ ಸೂತ್ರವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಗ್ರೀಕ್‌ನ ಸಮೀಕರಣವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥಗರ್ಭಿತವಾಗಿಸಲು ‘ತಾತ್ಪರ್ಯ ಇದೇ’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಇದು ‘ಸಾರಾಂಶ ಮಾತ್ರ’ ಎಂಬ ಸೀಮಿತ ವಿವರಣೆಯನ್ನು ಹೇರದೆ ಅವುಗಳ ನೈತಿಕ ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: οἱ ἄνθρωποι ಎಂಬ ಸಾಮಾನ್ಯ ಪುಲ್ಲಿಂಗ ರೂಪ
  choice: ಜನರು
  alternative: ಪುರುಷರು
  rationale: ಈ ಆಜ್ಞೆ ಎಲ್ಲ ಮಾನವ ಸಂಬಂಧಗಳಿಗೆ ಅನ್ವಯಿಸುತ್ತದೆ; ಮೂಲಪದವು ಇಲ್ಲಿ ಪುರುಷರನ್ನು ಮಾತ್ರ ಸೂಚಿಸುವುದಿಲ್ಲ.
- issue: ‘ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳು’ ಎಂಬ ಸೂತ್ರದ ವ್ಯಾಪ್ತಿ
  choice: ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳ ತಾತ್ಪರ್ಯ ಇದೇ
  alternative: ಇದೇ ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಯೆಹೂದ್ಯ ಶಾಸ್ತ್ರಸಂಗ್ರಹದ ಸ್ಥಿರ ಉಲ್ಲೇಖವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ನೇರ ಸಮೀಕರಣ ಅಸಹಜವಾಗಬಹುದಾದ್ದರಿಂದ ‘ತಾತ್ಪರ್ಯ’ ಬಳಸಿ ಅದರ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ಆದರೆ ‘ಇಡೀ ಶಾಸ್ತ್ರದ ಸಂಪೂರ್ಣ ಸಾರಾಂಶ’ ಎಂಬ ಹೆಚ್ಚುವರಿ ದಾವೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ನೀವೂ’ ಮತ್ತು ‘ಹಾಗೆಯೇ’ ಮೂಲದ ಒತ್ತನ್ನೂ ಪರಸ್ಪರತೆಯನ್ನೂ ಉಳಿಸುತ್ತವೆ. ಅಗತ್ಯವಿಲ್ಲದ ಕಾರಣ ಪಾದಟಿಪ್ಪಣಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
