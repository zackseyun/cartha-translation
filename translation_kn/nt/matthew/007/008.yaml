review_pass:
  verdict: revise
  source_fidelity: ‘ತಟ್ಟುವವನಿಗಾಗಿ’ does not represent the Greek dative τῷ κρούοντι as naturally or accurately as ‘ತಟ್ಟುವವನಿಗೆ’; the opening is directed to the knocker, not done on that person's behalf. The remaining clauses preserve the Greek’s general present-participial sense, future passive in the final clause, and unstated object of ‘will be opened.’
  naturalness: The proposed correction, ‘ತಟ್ಟುವವನಿಗೆ ತೆರೆಯಲಾಗುವುದು,’ is idiomatic modern standard Kannada and retains the compact parallelism. ‘ಬೇಡುವ’ distinguishes αἰτέω (‘ask/request’) more clearly than ‘ಕೇಳುವ,’ which can also mean ‘hear/listen.’
  terminology: No doctrinal terms require adjustment. ‘ಬೇಡುವ … ಪಡೆಯುತ್ತಾನೆ; ಹುಡುಕುವವನು ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ’ is clear, dignified, and appropriately direct. ‘ಬಾಗಿಲು’ is not introduced into the main text, since it is not explicit in Greek.
  issues:
  - severity: medium
    issue: The main text renders τῷ κρούοντι as ‘ತಟ್ಟುವವನಿಗಾಗಿ.’
    rationale: The Greek dative is most directly ‘to/for the one who knocks,’ and in this passive construction Kannada naturally requires ‘ತಟ್ಟುವವನಿಗೆ.’ ‘ತಟ್ಟುವವನಿಗಾಗಿ’ shifts the sense toward ‘for the benefit of the knocker.’
  - severity: low
    issue: The existing footnote’s stated alternative becomes identical to the corrected main wording.
    rationale: Once the main text reads ‘ತಟ್ಟುವವನಿಗೆ ತೆರೆಯಲಾಗುವುದು,’ a footnote beginning ‘ಅಥವಾ’ with the same wording is not a meaningful alternative. The note should instead simply explain that ‘door’ is implied but unstated.
