  to: ಏಕೆಂದರೆ ಬೇಡುವ ಪ್ರತಿಯೊಬ್ಬನು ಪಡೆಯುತ್ತಾನೆ; ಹುಡುಕುವವನು ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ; ತಟ್ಟುವವನಿಗೆ ತೆರೆಯಲಾಗುವುದು.[a]
