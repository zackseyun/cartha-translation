id: MAT.7.8
reference: Matthew 7:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಬೇಡುವ ಪ್ರತಿಯೊಬ್ಬನು ಪಡೆಯುತ್ತಾನೆ; ಹುಡುಕುವವನು ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ; ತಟ್ಟುವವನಿಗೆ ತೆರೆಯಲಾಗುವುದು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್ ಮೂಲಪಠ್ಯದಲ್ಲಿ ‘ಬಾಗಿಲು’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿಲ್ಲ; ತಟ್ಟುವ ರೂಪಕದಿಂದ ಅದು ಸೂಚಿತವಾಗಿದೆ.
    reason: ಗ್ರೀಕ್‌ನ ಹೇಳದ ಕರ್ತೃ/ತೆರೆಯಲ್ಪಡುವ ವಸ್ತುವಿನ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ವಿವರಿಸುತ್ತದೆ; ‘ಬಾಗಿಲು’ ಎಂಬ ಪದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದಿರುವುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: πᾶς
  choice: ಪ್ರತಿಯೊಬ್ಬನು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಕೃದಂತದೊಂದಿಗೆ ಇದು ಸಾಮಾನ್ಯ ವರ್ಗವನ್ನೂ ಸಾರ್ವತ್ರಿಕ ವ್ಯಾಪ್ತಿಯನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; ‘ಪ್ರತಿಯೊಬ್ಬನು’ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ವಚನದ ಪ್ರೋತ್ಸಾಹಕ್ಕೆ ಈ ವಚನವು ಕಾರಣ ಅಥವಾ ವಿವರಣೆ ನೀಡುತ್ತದೆ ಎಂಬ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ αἰτῶν
  choice: ಕೇಳುವ
  rationale: ವರ್ತಮಾನಕಾಲದ ನಾಮಪದೀಕೃತ ಕೃದಂತದ ಸಾಮಾನ್ಯ ಅಥವಾ ನಿರಂತರ ಸ್ವಭಾವವನ್ನು ‘ಕೇಳುವ ಪ್ರತಿಯೊಬ್ಬನು’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ರಚನೆ ಉಳಿಸುತ್ತದೆ.
- source_word: λαμβάνει
  choice: ಪಡೆದುಕೊಳ್ಳುತ್ತಾನೆ
  rationale: λαμβάνω ಎಂಬುದರ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಘನವಾದ, ಸುಲಭ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ ಮತ್ತು ವಾಕ್ಯದ ಭರವಸೆಯ ಸ್ವರವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ ζητῶν
  choice: ಹುಡುಕುವವನು
  rationale: ಗ್ರೀಕ್‌ನ ಸಮಾಂತರ ನಾಮಪದೀಕೃತ ಕೃದಂತ ರಚನೆಯನ್ನೂ ವಾಕ್ಯದ ಲಯವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: εὑρίσκει
  choice: ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ
  rationale: ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಸರಳ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದ; ಹುಡುಕುವುದು–ಕಂಡುಕೊಳ್ಳುವುದು ಎಂಬ ಸಮಾಂತರತೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: τῷ κρούοντι
  choice: ತಟ್ಟುವವನಿಗಾಗಿ
  rationale: ದತ್ತಿವ್ ಪದಗುಚ್ಛವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಮುಂದಿನ ಕರ್ಮಣಿ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ‘ಯಾರಿಗಾಗಿ ತೆರೆಯಲಾಗುವುದು’ ಎಂಬ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀνοιγήσεται
  choice: ತೆರೆಯಲಾಗುವುದು
  rationale: ಭವಿಷ್ಯತ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಇಲ್ಲದ ‘ಬಾಗಿಲು’ ಎಂಬ ಕರ್ತೃವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ವಾಗ್ದಾನದ ವ್ಯಾಪ್ತಿ ಮತ್ತು ಬಲ
  choice: ಸಾರ್ವತ್ರಿಕ ಪದಗಳಲ್ಲಿ ಹೇಳಿರುವ ಸಾಮಾನ್ಯ ಭರವಸೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಪ್ರತಿಯೊಂದು ನಿರ್ದಿಷ್ಟ ಬೇಡಿಕೆಯೂ ಕೇಳಿದಂತೆಯೇ ನೆರವೇರುತ್ತದೆ ಎಂದು ನಿರ್ಬಂಧರಹಿತವಾಗಿ ಹೇಳುವುದು, ಅಥವಾ ವಾಗ್ದಾನವನ್ನು ಕೆಲವು ಆತ್ಮಿಕ ಬೇಡಿಕೆಗಳಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವುದು.
  rationale: ಮೂಲಪಠ್ಯವು ‘ಪ್ರತಿಯೊಬ್ಬನು’ ಎಂಬ ವ್ಯಾಪಕ ಭಾಷೆಯನ್ನು ಬಳಸುತ್ತದೆ. ಅನುವಾದವು ಸಂದರ್ಭದಿಂದ ಬೇರ್ಪಟ್ಟ ಸಂಪೂರ್ಣ ಭರವಸೆಯನ್ನಾಗಿಯೂ ಅಥವಾ ಹೇಳದ ಮಿತಿಯನ್ನು ಸೇರಿಸಿದಂತೆಯೂ ಮಾಡದೆ, ಪಠ್ಯದ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸ್ಮರಣೀಯ ಸಮಾಂತರ ರಚನೆ. ‘ಬಾಗಿಲು’ ಎಂಬ ಸೂಚಿತ ಪದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
