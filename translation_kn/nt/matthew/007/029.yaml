id: MAT.7.29
reference: Matthew 7:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಆತನು ಅವರಿಗೆ ಅಧಿಕಾರ ಹೊಂದಿದವನಂತೆ ಬೋಧಿಸುತ್ತಿದ್ದನು, ಅವರ ಶಾಸ್ತ್ರಿಗಳಂತೆ ಅಲ್ಲ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: ಏಕೆಂದರೆ … ಬೋಧಿಸುತ್ತಿದ್ದರೇ
  rationale: ἦν ಮತ್ತು ವರ್ತಮಾನ ಕೃದಂತವು ಸೇರಿ ಭೂತಕಾಲದಲ್ಲಿ ಮುಂದುವರಿದ ಬೋಧನೆಯನ್ನು ಸೂಚಿಸುತ್ತವೆ; γάρ ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿನ ಜನರ ಬೆರಗಿಗೆ ಕಾರಣವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: αὐτούς
  choice: ಅವರಿಗೆ
  rationale: ಇದು ಕೇಳುತ್ತಿದ್ದ ಜನಸಮೂಹವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಬೋಧಿಸು’ ಕ್ರಿಯೆಯ ಸಹಜ ಪರೋಕ್ಷ ಕರ್ಮರೂಪವಾಗಿ ‘ಅವರಿಗೆ’ ಬಳಸಲಾಗಿದೆ.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: ಅಧಿಕಾರವುಳ್ಳವರಂತೆ
  rationale: ἐξουσία ಎಂದರೆ ಅಧಿಕಾರ, ಹಕ್ಕು ಅಥವಾ ಶಕ್ತಿ. ಈ ರೂಪವು ಯೇಸು ಅಧಿಕಾರ ಹೊಂದಿದ ವ್ಯಕ್ತಿಯಾಗಿ ಬೋಧಿಸಿದರೆಂಬ ಗ್ರೀಕ್ ಹೋಲಿಕೆಯ ವೈಯಕ್ತಿಕ ಸ್ವರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ οὐχ ὡς
  choice: … ಹೊರತು, … ಅಲ್ಲ
  rationale: ಗ್ರೀಕ್‌ನ ಸ್ಪಷ್ಟ ವ್ಯತ್ಯಾಸವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಮತ್ತು ಒತ್ತಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: ಅವರ ಶಾಸ್ತ್ರಿಗಳು
  rationale: γραμματεῖς ಇಲ್ಲಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಪರಿಣತರಾದ ಶಾಸ್ತ್ರಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; αὐτῶν ಅನ್ನು ‘ಅವರ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಬೋಧನೆಯಲ್ಲಿದ್ದ ಅಧಿಕಾರದ ಸ್ವರೂಪ
  choice: ‘ಅಧಿಕಾರವುಳ್ಳವರಂತೆ’ ಎಂದು ಬೋಧನೆಯ ರೀತಿಯನ್ನು ವರ್ಣಿಸುವ ಹೋಲಿಕೆಯಾಗಿಯೇ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ದೈವಿಕ ಅಧಿಕಾರವೆಂದು ಸ್ಪಷ್ಟವಾಗಿ ವಿಸ್ತರಿಸುವುದು, ಅಥವಾ ಕೇವಲ ಆತ್ಮವಿಶ್ವಾಸ/ವಾಗ್ಮಿತೆ ಎಂದು ಕುಗ್ಗಿಸುವುದು.
  rationale: ವಚನವು ಯೇಸುವಿನ ಅಧಿಕಾರವನ್ನು ನಿಜವೆಂದು ಮಂಡಿಸಿ ಅದನ್ನು ಶಾಸ್ತ್ರಿಗಳ ಬೋಧನೆಯೊಂದಿಗೆ ಹೋಲಿಸುತ್ತದೆ; ಆದರೆ ಆ ಅಧಿಕಾರದ ಸಂಪೂರ್ಣ ದೇವತಾತ್ತ್ವಿಕ ಆಧಾರವನ್ನು ಇದೇ ವಚನ ವಿವರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ಶೈಲಿ. ‘ಶಾಸ್ತ್ರಿಗಳು’ ಎಂಬ ಪದವು ಐತಿಹಾಸಿಕ ಧರ್ಮಶಾಸ್ತ್ರ ಪರಿಣತರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಗ್ರೀಕ್ ರಚನೆಗೆ ಸಮೀಪವಾದ ಮುಖ್ಯ ಪಾಠಕ್ಕೆ ಹೆಚ್ಚು ನುಡಿಗಟ್ಟಿನ ಪರ್ಯಾಯವನ್ನು ನೀಡುತ್ತದೆ.
