id: MAT.7.9
reference: Matthew 7:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: kn
  text: ಅಥವಾ, ತನ್ನ ಮಗನು ತನ್ನ ಬಳಿ ರೊಟ್ಟಿಯನ್ನು ಕೇಳಿದಾಗ ಅವನಿಗೆ ಕಲ್ಲನ್ನು ಕೊಡುವ ಯಾವ ಮನುಷ್ಯನು[a] ನಿಮ್ಮಲ್ಲಿದ್ದಾನೆ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಮನುಷ್ಯನು’ ಎಂಬ ಪದವು ಪ್ರತಿನಿಧಾರ್ಥಕವಾಗಿ ಬಳಕೆಯಾಗಿದೆ; ಸಂದರ್ಭಾನುಸಾರ ಇದು ಸಾಮಾನ್ಯ ಮಾನವನನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: ಅಥವಾ
  rationale: ಹಿಂದಿನ ಮಾತಿಗೆ ಮತ್ತೊಂದು ವಾಗ್ವೈಖರಿಯ ಉದಾಹರಣೆಯನ್ನು ಜೋಡಿಸುವ ಸಂಪರ್ಕಪದವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: ನಿಮ್ಮಲ್ಲಿ ಯಾವ ಮನುಷ್ಯನು
  rationale: ಭಾಗಸೂಚಕವಾದ ἐξ ὑμῶν ಅನ್ನು ಸಹಜ ಕನ್ನಡದ ‘ನಿಮ್ಮಲ್ಲಿ’ ಎಂದು, ಪ್ರತಿನಿಧಾರ್ಥಕ ಏಕವಚನ ἄνθρωπος ಅನ್ನು ‘ಮನುಷ್ಯನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: ತನ್ನ ಮಗನು
  rationale: ಸಂಬಂಧವಾಚಕ ರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಸಲು ‘ತನ್ನ’ ಎಂಬ ಆತ್ಮವಾಚಕ ಸರ್ವನಾಮ ಬಳಸಿದ್ದು, ಮೂಲದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ‘ಮಗ’ ಎಂಬ ಅರ್ಥವನ್ನು ಉಳಿಸಿದೆ.
- source_word: αἰτήσει
  choice: ಕೇಳಿದರೆ
  rationale: ಮೂಲದ ಭವಿಷ್ಯರೂಪವು ಇಲ್ಲಿ ಸಾಮಾನ್ಯ ಸಂಭವವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ಷರತ್ತಿನ ರೂಪವು ‘ಮಗನು ಕೇಳುವ ಸಂದರ್ಭದಲ್ಲಿ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἄρτον
  choice: ರೊಟ್ಟಿಯನ್ನು
  rationale: ರೊಟ್ಟಿಯೇ ಮೂಲಪದದ ನೇರ ಮತ್ತು ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ; ‘ಆಹಾರ’ ಎಂದರೆ ಅರ್ಥ ಅನಗತ್ಯವಾಗಿ ವಿಸ್ತರಿಸುತ್ತದೆ.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: ಅವನಿಗೆ ಕಲ್ಲನ್ನು ಕೊಡುವನು?
  rationale: μή ಸೂಚಿಸುವ ‘ಇಲ್ಲ’ ಎಂಬ ನಿರೀಕ್ಷೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ವಾಗ್ವೈಖರಿಯ ಪ್ರಶ್ನೆಯೇ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಕಲ್ಲು’ ಮತ್ತು ‘ಕೊಡು’ ಮೂಲದ ನೇರ ಅರ್ಥಗಳನ್ನು ಉಳಿಸುತ್ತವೆ.
theological_decisions:
- issue: ಪ್ರತಿನಿಧಾರ್ಥಕ ಪುಲ್ಲಿಂಗ ಭಾಷೆ
  choice: ಯಾವ ಮನುಷ್ಯನು
  alternative: ಯಾವ ವ್ಯಕ್ತಿಯು / ನಿಮ್ಮಲ್ಲಿ ಯಾರು
  rationale: ἄνθρωπος ಇಲ್ಲಿ ಒಬ್ಬ ಪುರುಷನನ್ನು ಉದಾಹರಣೆಯಾಗಿ ತೆಗೆದುಕೊಂಡ ಪ್ರತಿನಿಧಾರ್ಥಕ ಏಕವಚನವಾಗಿದೆ. ‘ಮನುಷ್ಯನು’ ಮೂಲದ ರೂಪವನ್ನು ಉಳಿಸುವುದರ ಜೊತೆಗೆ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಾಮಾನ್ಯ ಪ್ರತಿನಿಧಾರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
- issue: ವಾಗ್ವೈಖರಿಯ ಪ್ರಶ್ನೆಯಲ್ಲಿನ ನಕಾರಾತ್ಮಕ ನಿರೀಕ್ಷೆ
  choice: ಅವನಿಗೆ ಕಲ್ಲನ್ನು ಕೊಡುವನು?
  alternative: ಅವನಿಗೆ ಕಲ್ಲನ್ನು ಕೊಡುವುದಿಲ್ಲವಲ್ಲವೇ?
  rationale: μή ಪ್ರಶ್ನೆಗೆ ‘ಇಲ್ಲ’ ಎಂಬ ಉತ್ತರ ನಿರೀಕ್ಷಿತವೆಂದು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ಸಂದರ್ಭ ಮತ್ತು ಪ್ರಶ್ನಾರೂಪದಿಂದ ಅದು ಸ್ಪಷ್ಟವಾಗುವುದರಿಂದ ಮೂಲದಲ್ಲಿಲ್ಲದ ಸ್ಪಷ್ಟ ನಕಾರವನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ವಾಗ್ವೈಖರಿಯ ಪ್ರಶ್ನಾರೂಪ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯರಚನೆಯನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ಅನುಸರಿಸದೆ, ಅದರ ಅರ್ಥಸಂಬಂಧ ಮತ್ತು ನಕಾರಾತ್ಮಕ ಉತ್ತರದ ನಿರೀಕ್ಷೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
