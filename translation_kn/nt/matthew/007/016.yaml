id: MAT.7.16
reference: Matthew 7:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: kn
  text: ಅವರ ಫಲಗಳಿಂದ ನೀವು ಅವರನ್ನು ಗುರುತಿಸುವಿರಿ.[a] ಮುಳ್ಳುಗಿಡಗಳಿಂದ ದ್ರಾಕ್ಷಿಗಳನ್ನಾಗಲಿ, ಮುಳ್ಳಿನ ಕಳೆಗಿಡಗಳಿಂದ ಅಂಜೂರದ ಹಣ್ಣುಗಳನ್ನಾಗಲಿ ಕೀಳುತ್ತಾರೆಯೇ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವರ ಫಲಗಳಿಂದ ನೀವು ಅವರನ್ನು ತಿಳಿದುಕೊಳ್ಳುವಿರಿ.’
    reason: ἐπιγνώσεσθε ಎಂಬ ಪದಕ್ಕೆ ‘ಗುರುತಿಸುವಿರಿ’ ಮತ್ತು ‘ತಿಳಿದುಕೊಳ್ಳುವಿರಿ’ ಎರಡೂ ಸಾಧ್ಯ; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಂದರ್ಭಕ್ಕೆ ಹೆಚ್ಚು ಸಹಜವಾದ ಮೊದಲನೆಯದನ್ನು ಬಳಸಲಾಗಿದೆ.
  - marker: b
    text: 'ಈ ಪ್ರಶ್ನೆಗೆ ‘ಇಲ್ಲ’ ಎಂಬ ಉತ್ತರವೇ ನಿರೀಕ್ಷಿತ: ಮುಳ್ಳುಗಿಡಗಳಿಂದ ದ್ರಾಕ್ಷಿಗಳನ್ನಾಗಲಿ, ಮುಳ್ಳಿನ ಕಳೆಗಿಡಗಳಿಂದ ಅಂಜೂರದ ಹಣ್ಣುಗಳನ್ನಾಗಲಿ ಯಾರೂ ಕೀಳುವುದಿಲ್ಲ.'
    reason: μήτι ಹೊಂದಿರುವ ಗ್ರೀಕ್ ಪ್ರಶ್ನೆಯ ನಿರೀಕ್ಷಿತ ನಿರಾಕರಣಾತ್ಮಕ ಉತ್ತರವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: καρπῶν
  choice: ಫಲಗಳಿಂದ
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನದ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೊರುವ ‘ಫಲ’ ಎಂಬ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಇದು ಇಲ್ಲಿ ರೂಪಕವಾಗಿದ್ದರೂ, ‘ಕೃತ್ಯಗಳು’ ಅಥವಾ ‘ಪರಿಣಾಮಗಳು’ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಬದಲಿಸದೆ ಕೃಷಿ ಚಿತ್ರಣವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἐπιγνώσεσθε
  choice: ಗುರುತಿಸುವಿರಿ
  rationale: ಕಾಣುವ ಸಾಕ್ಷ್ಯದಿಂದ ಒಬ್ಬರ ನಿಜ ಸ್ವರೂಪವನ್ನು ತಿಳಿದುಕೊಳ್ಳುವ ಅರ್ಥವನ್ನು ‘ಗುರುತಿಸುವಿರಿ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಸಂಪೂರ್ಣವಾಗಿ ತಿಳಿಯುವಿರಿ’ ಎಂಬ ಅತಿಯಾದ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: μήτι
  choice: …ಕೀಳುತ್ತಾರೆಯೇ?
  rationale: μήτι ನಿರಾಕರಣಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಕನ್ನಡದ ಪ್ರಶ್ನಾರ್ಥಕ ರೂಪವು ಇದನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: συλλέγουσιν
  choice: ಕೀಳುತ್ತಾರೆ
  rationale: ಗಿಡಗಳಿಂದ ಹಣ್ಣು ಸಂಗ್ರಹಿಸುವ ಕ್ರಿಯೆಗೆ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಕೀಳುತ್ತಾರೆ’ ಸಹಜವಾಗಿದೆ; ಕೃಷಿ ಚಿತ್ರಣವೂ ಉಳಿಯುತ್ತದೆ.
- source_word: ἀκανθῶν
  choice: ಮುಳ್ಳುಗಿಡಗಳಿಂದ
  rationale: ಇದು ಮುಳ್ಳುಗಳು ಅಥವಾ ಮುಳ್ಳಿನ ಪೊದೆಗಳನ್ನು ಸೂಚಿಸಬಹುದು. ಹಣ್ಣು ಕೀಳುವ ಸಸ್ಯಸಂದರ್ಭದಲ್ಲಿ ‘ಮುಳ್ಳುಗಿಡಗಳು’ ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: σταφυλάς
  choice: ದ್ರಾಕ್ಷಿಹಣ್ಣುಗಳನ್ನು
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನಕ್ಕೆ ನೇರವಾದ, ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: τριβόλων
  choice: ಕಳ್ಳಿಗಿಡಗಳಿಂದ
  rationale: ಮುಳ್ಳುಳ್ಳ ಕಳೆಗಿಡವನ್ನು ಸೂಚಿಸುವ ಪದ. ‘ಕಳ್ಳಿಗಿಡ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಪರಿಚಿತವಾಗಿದ್ದು, ἀκανθῶν ಪದದಿಂದಲೂ ಸ್ವಲ್ಪ ಭೇದವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: σῦκα
  choice: ಅಂಜೂರದ ಹಣ್ಣುಗಳನ್ನು
  rationale: σῦκα ಎಂಬ ಬಹುವಚನ ನಾಮಪದಕ್ಕೆ ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: αὐτῶν / αὐτούς
  choice: ಅವರ / ಅವರನ್ನು
  rationale: ಸಂದರ್ಭದಲ್ಲಿರುವ ವ್ಯಕ್ತಿಗಳನ್ನೇ—ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿನ ಸುಳ್ಳು ಪ್ರವಾದಿಗಳನ್ನು—ಸೂಚಿಸುವ ವೈಯಕ್ತಿಕ ಸರ್ವನಾಮಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಜನರನ್ನು ವಿವೇಚಿಸುವುದರಲ್ಲಿ ‘ಫಲ’ ಎಂಬ ರೂಪಕದ ಅರ್ಥ
  choice: ‘ಕೃತ್ಯಗಳು’ ಅಥವಾ ‘ಪರಿಣಾಮಗಳು’ ಎಂದು ಅರ್ಥವಿಸ್ತಾರ ಮಾಡದೆ ‘ಫಲಗಳು’ ಎಂಬ ರೂಪಕವನ್ನು ಉಳಿಸುವುದು.
  alternative: ‘ಅವರ ಕೃತ್ಯಗಳಿಂದ ನೀವು ಅವರನ್ನು ಗುರುತಿಸುವಿರಿ’ / ‘ಅವರು ಉಂಟುಮಾಡುವ ಪರಿಣಾಮಗಳಿಂದ ಅವರನ್ನು ತಿಳಿಯುವಿರಿ’
  rationale: ಯೇಸುವಿನ ಬೋಧನೆಯ ಕೇಂದ್ರ ಕೃಷಿ ರೂಪಕವನ್ನು ಉಳಿಸುವುದರಿಂದ ಅದರ ಅಂತರಪಠ್ಯ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಪ್ರತಿಧ್ವನಿ ಕಾಪಾಡುತ್ತದೆ; ರೂಪಕವನ್ನು ಒಂದೇ ನಿರ್ದಿಷ್ಟ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಆದರೆ ಗೌರವಯುತವಾದ ಶೈಲಿ. ‘ಫಲ’ ಎಂಬ ಸಾಂಪ್ರದಾಯಿಕ ಹಾಗೂ ಜೀವಂತ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯಕ್ರಮದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
