review_pass:
  verdict: revise
  source_fidelity: The core sense and rhetorical negative-answer question are correctly conveyed. However, ‘ಲೇ’ adds an emphasis not expressed in Greek, and ‘ಕಳ್ಳಿಗಿಡ’ is not a sufficiently precise or broadly natural equivalent for τρίβολοι, which denotes a prickly weed/thistle-like plant rather than specifically a cactus-like plant.
  naturalness: The Kannada is generally fluent and suitably dignified. ‘ದ್ರಾಕ್ಷಿಗಳು’ is the ordinary concise term for grapes, and ‘ಮುಳ್ಳಿನ ಕಳೆಗಿಡಗಳು’ more clearly communicates the second botanical image for modern readers.
  terminology: ‘ಫಲ’ appropriately retains the agricultural metaphor without narrowing it to deeds or outcomes. ‘ಗುರುತಿಸುವಿರಿ’ is a sound contextual rendering of ἐπιγνώσεσθε. The revision preserves the distinction between ἀκάνθαι (thorny plants) and τρίβολοι (prickly weeds).
  issues:
  - severity: low
    issue: Unwarranted emphasis in ‘ಫಲಗಳಿಂದಲೇ’
    rationale: The Greek ἀπὸ τῶν καρπῶν αὐτῶν means ‘by/from their fruits’ and contains no particle corresponding to Kannada -ಲೇ (‘it is precisely/by means of’).
  - severity: medium
    issue: ‘ಕಳ್ಳಿಗಿಡಗಳಿಂದ’ is an uncertain rendering of τρίβολοι
    rationale: A ಕಳ್ಳಿಗಿಡ commonly suggests a particular succulent/cactus-like thorny plant, whereas τρίβολοι refers more broadly to a prickly weed or thistle-like plant. ‘ಮುಳ್ಳಿನ ಕಳೆಗಿಡಗಳು’ is clearer while retaining the botanical contrast.
  revised_text: ಅವರ ಫಲಗಳಿಂದ ನೀವು ಅವರನ್ನು ಗುರುತಿಸುವಿರಿ.[a] ಮುಳ್ಳುಗಿಡಗಳಿಂದ ದ್ರಾಕ್ಷಿಗಳನ್ನಾಗಲಿ, ಮುಳ್ಳಿನ ಕಳೆಗಿಡಗಳಿಂದ ಅಂಜೂರದ ಹಣ್ಣುಗಳನ್ನಾಗಲಿ ಕೀಳುತ್ತಾರೆಯೇ?[b]
