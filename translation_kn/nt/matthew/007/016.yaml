- from: ಅವರ ಫಲಗಳಿಂದಲೇ ನೀವು ಅವರನ್ನು ಗುರುತಿಸುವಿರಿ.[a] ಮುಳ್ಳುಗಿಡಗಳಿಂದ ದ್ರಾಕ್ಷಿಹಣ್ಣುಗಳನ್ನಾಗಲಿ, ಕಳ್ಳಿಗಿಡಗಳಿಂದ ಅಂಜೂರದ ಹಣ್ಣುಗಳನ್ನಾಗಲಿ ಕೀಳುತ್ತಾರೆಯೇ?[b]
