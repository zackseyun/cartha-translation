id: MAT.7.18
reference: Matthew 7:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: kn
  text: ಒಳ್ಳೆಯ ಮರವು ಕೆಟ್ಟ ಹಣ್ಣುಗಳನ್ನು ಕೊಡಲಾರದು; ಕೊಳೆತ ಮರವು ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳನ್ನು ಕೊಡಲಾರದು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: ಒಳ್ಳೆಯ ಮರ
  rationale: ἀγαθός ಎಂಬುದರ ಸಾಮಾನ್ಯ ಅರ್ಥವಾದ ‘ಒಳ್ಳೆಯ’ ಎಂಬುದನ್ನು ಉಳಿಸಿ, ಮರದ ನೇರ ಚಿತ್ರಣಕ್ಕೂ ಅದರ ಮೌಲ್ಯನಿರ್ಣಾಯಕ ಸೂಚನೆಗೂ ನ್ಯಾಯ ಮಾಡುತ್ತದೆ; ‘ಆರೋಗ್ಯವಂತ ಮರ’ ಎಂಬುದು ಹೆಚ್ಚು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ.
- source_word: δύναται ... ποιεῖν
  choice: ಕೊಡಲಾರದು
  rationale: δύναται ನಿರಾಕರಣೆಯೊಂದಿಗೆ ಅಸಾಮರ್ಥ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. καρπούς ಜೊತೆಗೆ ποιεῖν ಎಂಬುದು ಹಣ್ಣು ಕೊಡುವುದನ್ನು ಸೂಚಿಸುವುದರಿಂದ, ಕನ್ನಡದಲ್ಲಿ ‘ಕೊಡಲಾರದು’ ಸಹಜವಾಗಿದ್ದು ಮೂಲದ ನಿರ್ಣಾಯಕ ಅಸಾಧ್ಯತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: καρποὺς πονηρούς
  choice: ಕೆಟ್ಟ ಹಣ್ಣುಗಳು
  rationale: πονηρός ದುಷ್ಟ, ಕೆಟ್ಟ ಅಥವಾ ಹಾನಿಕರ ಎಂಬ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು. ಹಣ್ಣಿನ ರೂಪಕದಲ್ಲಿ ‘ಕೆಟ್ಟ’ ಎಂಬುದು ಸಹಜವೂ ವ್ಯಾಪಕವೂ ಆಗಿದ್ದು, ನೈತಿಕ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಕಿರಿದಾಗಿಸುವುದಿಲ್ಲ.
- source_word: οὐδέ
  choice: ಹಾಗೆಯೇ ... ಕೊಡಲಾರದು
  rationale: οὐδέ ಎರಡನೆಯ ಸಮಾನಾಂತರ ನಿರಾಕರಣೆಯನ್ನು ಜೋಡಿಸುತ್ತದೆ. ‘ಹಾಗೆಯೇ’ ಕನ್ನಡದಲ್ಲಿ ಎರಡೂ ವಾಕ್ಯಾಂಶಗಳ ಸಮತೋಲನ ಮತ್ತು ವಿರುದ್ಧತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: δένδρον σαπρόν
  choice: ಕೊಳೆತ ಮರ
  rationale: σαπρός ಕೊಳೆತ, ನಶಿಸಿದ ಅಥವಾ ಭ್ರಷ್ಟಗೊಂಡ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕೊಳೆತ’ ಮರದ ಸ್ಪಷ್ಟ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಿ, ಕೇವಲ ‘ಕೆಟ್ಟ ಮರ’ಕ್ಕಿಂತ ಮೂಲಕ್ಕೆ ಹೆಚ್ಚು ನಿಕಟವಾಗಿದೆ.
- source_word: καρποὺς καλούς
  choice: ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳು
  rationale: καλός ಇಲ್ಲಿ ಉತ್ತಮ ಗುಣಮಟ್ಟದ ಹಣ್ಣನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳು’ ಎಂಬುದು ಸಹಜವಾಗಿದ್ದು πονηρούς ಜೊತೆಗಿನ ವಿರೋಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ರೂಪಕದಲ್ಲಿ ಹೇಳಲಾದ ಅಸಾಧ್ಯತೆಯ ಸ್ವರೂಪ
  choice: ‘ಕೊಡಲಾರದು’ ಎಂಬ ನಿರ್ಣಾಯಕ ಅಸಾಮರ್ಥ್ಯದ ರೂಪದಲ್ಲಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಸಾಮಾನ್ಯವಾಗಿ ಕೊಡುವುದಿಲ್ಲ’ ಅಥವಾ ‘ಕೊಡಬಾರದು’
  rationale: οὐ δύναται ನೇರವಾಗಿ ಅಸಾಮರ್ಥ್ಯವನ್ನು ಹೇಳುತ್ತದೆ; ಅದನ್ನು ಸಂಭವನೀಯತೆ ಅಥವಾ ಕರ್ತವ್ಯದ ಹೇಳಿಕೆಯಾಗಿಸಿ ಮೃದುಗೊಳಿಸದೆ, ರೂಪಕದ ಬಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಇದರಿಂದ ರೂಪಕದಾಚೆಯ ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಘನವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮರ ‘ಹಣ್ಣುಗಳನ್ನು ಕೊಡುತ್ತದೆ’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟನ್ನು ಆರಿಸಲಾಗಿದೆ. ಮೂಲಪಾಠದಲ್ಲಿರುವ ಅರ್ಥಭೇದಗಳು ಕನ್ನಡದ ಮುಖ್ಯ ಪದಗಳಲ್ಲಿಯೇ ಸಮರ್ಪಕವಾಗಿ ಉಳಿದಿರುವುದರಿಂದ ಪಾದಟಿಪ್ಪಣಿಗಳು ಅಗತ್ಯವಿಲ್ಲ.
