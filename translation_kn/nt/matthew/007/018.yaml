revisions:
- from: ಒಳ್ಳೆಯ ಮರವು ಕೆಟ್ಟ ಹಣ್ಣುಗಳನ್ನು ಕೊಡಲಾರದು; ಹಾಗೆಯೇ ಕೊಳೆತ ಮರವು ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳನ್ನು ಕೊಡಲಾರದು.
  to: ಒಳ್ಳೆಯ ಮರವು ಕೆಟ್ಟ ಹಣ್ಣುಗಳನ್ನು ಕೊಡಲಾರದು; ಕೊಳೆತ ಮರವು ಒಳ್ಳೆಯ ಹಣ್ಣುಗಳನ್ನು ಕೊಡಲಾರದು.
