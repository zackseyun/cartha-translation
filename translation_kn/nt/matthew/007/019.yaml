- from: ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ ಪ್ರತಿಯೊಂದು ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯಲಾಗುತ್ತದೆ.[a][b]
  to: ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ ಪ್ರತಿಯೊಂದು ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ.[a][b]
