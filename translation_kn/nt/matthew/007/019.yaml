review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the distributive force of πᾶν δένδρον, the ongoing negative characterization of μὴ ποιοῦν, and the passive outcomes. However, εἰς πῦρ expresses movement into fire; ‘ಬೆಂಕಿಯಲ್ಲಿ’ more naturally locates the action in fire. ‘ಬೆಂಕಿಗೆ’ preserves the directional sense without adding an article or doctrinal specification.
  naturalness: ‘ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ’ is idiomatic modern standard Kannada. The main sentence is natural after replacing the locative ‘ಬೆಂಕಿಯಲ್ಲಿ’ with the directional ‘ಬೆಂಕಿಗೆ.’ The current footnote-a wording ‘ಫಲವನ್ನು ಬಿಡದ’ is not idiomatic for a tree bearing fruit and should be replaced.
  terminology: ‘ಒಳ್ಳೆಯ ಫಲ’ appropriately retains the evaluative and contextual moral force of καρπὸν καλόν. ‘ನ್ಯಾಯತೀರ್ಪು’ in footnote b is suitable, while the note properly avoids identifying the fire with a particular eschatological outcome.
  issues:
  - severity: medium
    issue: ‘ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯಲಾಗುತ್ತದೆ’ weakens the directional force of εἰς πῦρ.
    rationale: The Greek preposition εἰς denotes movement into, not simply location within. ‘ಬೆಂಕಿಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ’ is natural Kannada and retains this distinction.
  - severity: medium
    issue: Footnote a uses ‘ಒಳ್ಳೆಯ ಫಲವನ್ನು ಬಿಡದ.’
    rationale: ‘ಫಲವನ್ನು ಬಿಡು’ is not a natural modern Kannada idiom for a tree producing or bearing fruit. It therefore fails as a usable lexical alternative.
