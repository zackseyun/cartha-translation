id: MAT.7.19
reference: Matthew 7:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: kn
  text: ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ ಪ್ರತಿಯೊಂದು ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಒಳ್ಳೆಯ ಫಲವನ್ನು ನೀಡದ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ಬೆಂಕಿ’ ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣವಾಗಿದೆ; ಇಲ್ಲಿ ಒತ್ತು ಇಹಕಾಲದ ನ್ಯಾಯತೀರ್ಪಿನ ಮೇಲಿದೆಯೋ, ಅಂತ್ಯಕಾಲದ ನ್ಯಾಯತೀರ್ಪಿನ ಮೇಲಿದೆಯೋ, ಅಥವಾ ಎರಡರ ಮೇಲೂ ಇದೆಯೋ ಎಂಬುದನ್ನು ಈ ವಾಕ್ಯವು ಇನ್ನಷ್ಟು ನಿಖರವಾಗಿ ತಿಳಿಸುವುದಿಲ್ಲ.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: ಪ್ರತಿಯೊಂದು ಮರವನ್ನು
  rationale: ಏಕವಚನ ನಾಮಪದದೊಂದಿಗಿರುವ πᾶν ವಿತರಣಾರ್ಥಕವಾಗಿದ್ದು, ಒಂದೊಂದು ಮರವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಪ್ರತಿಯೊಂದು ಮರವನ್ನು’ ಎಂಬುದು ಸಹಜವಾಗಿಯೂ ಗಾದೆಯಂಥ ಬಲವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: μὴ ποιοῦν
  choice: ಕೊಡದ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಮರದ ನಿರಂತರ ಅಥವಾ ಸಹಜ ಲಕ್ಷಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಫಲದ ಸಂದರ್ಭದಲ್ಲಿ ‘ಫಲವನ್ನು ಕೊಡು’ ಎಂಬುದು ಸಹಜ ಕನ್ನಡ; ಇದು ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: καρπὸν καλὸν
  choice: ಒಳ್ಳೆಯ ಫಲವನ್ನು
  rationale: καλός ಇಲ್ಲಿ ಒಳ್ಳೆಯದು, ಸಮರ್ಪಕವಾದುದು ಅಥವಾ ಯೋಗ್ಯವಾದುದು ಎಂಬ ಮೌಲ್ಯಮಾಪಕ ಅರ್ಥ ಹೊಂದಿದೆ. ‘ಒಳ್ಳೆಯ ಫಲ’ ಸಹಜವಾಗಿದ್ದು ನೈತಿಕ ಸೂಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκκόπτεται
  choice: ಕಡಿದು
  rationale: ಈ ವರ್ತಮಾನ ಕರ್ಮಣಿ ಕ್ರಿಯಾಪದವು ಅಂಥ ಮರಕ್ಕೆ ಏನಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಹೇಳುತ್ತದೆ. ಮರದ ಸಂದರ್ಭದಲ್ಲಿ ‘ಕಡಿಯಲಾಗುತ್ತದೆ’ ಸಹಜ ಸಮಾನಾರ್ಥಕ; ಸಂಯುಕ್ತ ಕರ್ಮಣಿ ವಾಕ್ಯದಲ್ಲಿ ‘ಕಡಿದು ... ಎಸೆಯಲಾಗುತ್ತದೆ’ ಎಂದು ಸರಾಗವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ.
- source_word: εἰς πῦρ βάλλεται
  choice: ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯಲಾಗುತ್ತದೆ
  rationale: βάλλεται ಕರ್ಮಣಿಯಲ್ಲಿ ‘ಎಸೆಯಲಾಗುತ್ತದೆ’ ಎಂದರ್ಥ; εἰς πῦρ ಬೆಂಕಿಯೊಳಗೆ ಸಾಗಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯಲಾಗುತ್ತದೆ’ ಸಹಜವಾಗಿದ್ದು ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಬೆಂಕಿಯ ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣ
  choice: ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯುವ ರೂಪಕವನ್ನು ಉಳಿಸಿ, ಬೆಂಕಿಯ ನಿಖರ ಉಲ್ಲೇಖವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ.
  alternative: ಇಹಕಾಲದ ನ್ಯಾಯತೀರ್ಪು; ಅಂತ್ಯಕಾಲದ ನ್ಯಾಯತೀರ್ಪು; ನರಕ
  rationale: ವಾಕ್ಯವು ಕೃಷಿಯ ಚಿತ್ರಣದ ಮೂಲಕ ನ್ಯಾಯತೀರ್ಪಿನ ಎಚ್ಚರಿಕೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ; ಆದರೆ ಆ ನ್ಯಾಯತೀರ್ಪಿನ ಕಾಲ ಅಥವಾ ನಿಖರ ಸ್ವರೂಪವನ್ನು ಈ ವಾಕ್ಯವೇ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಠ್ಯದ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮತ್ತು ಅನಿಶ್ಚಿತತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಫಲವನ್ನು ಕೊಡು’ ಎಂಬ ಸಾಮಾನ್ಯ ನುಡಿಗಟ್ಟನ್ನು ಆಯ್ಕೆಮಾಡಿ, ನ್ಯಾಯತೀರ್ಪಿನ ರೂಪಕವನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
