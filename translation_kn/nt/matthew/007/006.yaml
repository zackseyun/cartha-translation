review_pass:
  verdict: revise
  source_fidelity: 'The principal images and referents are retained accurately: τὸ ἅγιον as “ಪವಿತ್ರವಾದದ್ದು,” dogs, the readers’ pearls, pigs, trampling the pearls, and violent action against the readers. However, “ತಿರುಗಿಬಿದ್ದು” means roughly “turning and falling/falling over,” adding an action absent from στραφέντες and weakening the intended sense of turning upon someone.'
  naturalness: The wording is otherwise clear and idiomatic modern standard Kannada. Replacing “ತಿರುಗಿಬಿದ್ದು” with “ತಿರುಗಿ” yields a natural, direct sequence.
  terminology: “ಪವಿತ್ರವಾದದ್ದು,” “ನಾಯಿಗಳು,” “ಮುತ್ತುಗಳು,” and “ಹಂದಿಗಳು” appropriately preserve the verse’s deliberately uninterpreted metaphors. “ಹರಿದುಹಾಕಬಹುದು” suitably conveys the violent force of ῥήξωσιν without doctrinal expansion.
  issues:
  - severity: medium
    issue: “ತಿರುಗಿಬಿದ್ದು” introduces falling.
    rationale: The Greek aorist participle στραφέντες means “having turned/turning,” not “turning and falling.” The added “ಬಿದ್ದು” is not source-supported and changes the hostile action’s portrayal.
  revised_text: ಪವಿತ್ರವಾದದ್ದನ್ನು ನಾಯಿಗಳಿಗೆ ಕೊಡಬೇಡಿ; ನಿಮ್ಮ ಮುತ್ತುಗಳನ್ನು ಹಂದಿಗಳ ಮುಂದೆ ಎಸೆಯಬೇಡಿ. ಇಲ್ಲವಾದರೆ ಅವು ಅವನ್ನು ತಮ್ಮ ಕಾಲುಗಳ ಕೆಳಗೆ ತುಳಿದು, ತಿರುಗಿ ನಿಮ್ಮನ್ನು ಹರಿದುಹಾಕಬಹುದು.
  revised_footnotes: []
