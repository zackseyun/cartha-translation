id: MAT.7.6
reference: Matthew 7:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: kn
  text: ಪವಿತ್ರವಾದದ್ದನ್ನು ನಾಯಿಗಳಿಗೆ ಕೊಡಬೇಡಿ; ನಿಮ್ಮ ಮುತ್ತುಗಳನ್ನು ಹಂದಿಗಳ ಮುಂದೆ ಎಸೆಯಬೇಡಿ. ಇಲ್ಲವಾದರೆ ಅವು ಅವನ್ನು ತಮ್ಮ ಕಾಲುಗಳ ಕೆಳಗೆ ತುಳಿದು, ತಿರುಗಿ ನಿಮ್ಮನ್ನು ಹರಿದುಹಾಕಬಹುದು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ಪವಿತ್ರವಾದದ್ದು
  rationale: ನಪುಂಸಕ ಏಕವಚನ ವಿಶೇಷಣವು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದ್ದು, ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಅದರ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τοῖς κυσίν
  choice: ನಾಯಿಗಳಿಗೆ
  rationale: ರೂಪಕದ ನೇರತೆ ಮತ್ತು ಅದರ ಕಟುವಾದ ಸಾಂಸ್ಕೃತಿಕ ಬಲವನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸುವ ಸಹಜ ಬಹುವಚನ ರೂಪ.
- source_word: βάλητε
  choice: ಎಸೆಯಬೇಡಿ
  rationale: βάλλω ಎಂಬ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: ನಿಮ್ಮ ಮುತ್ತುಗಳನ್ನು
  rationale: ಸ್ವಾಮ್ಯಸೂಚಕ ಸರ್ವನಾಮವನ್ನೂ ಮೂಲದ ಬಹುವಚನವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: ಹಂದಿಗಳ ಮುಂದೆ
  rationale: ಮೂಲದ ಸ್ಥಳಸಂಬಂಧವನ್ನೂ ರೂಪಕವನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μήποτε
  choice: ಇಲ್ಲವಾದರೆ ...ಬಹುದು
  rationale: ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಎಚ್ಚರಿಕೆಯ ಪರಿಣಾಮಾರ್ಥಕ ರಚನೆಯ ಮೂಲಕ ಸಂಭವಿಸಬಹುದಾದ ಅಪಾಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: ಅವು ಅವನ್ನು ತಮ್ಮ ಕಾಲುಗಳ ಕೆಳಗೆ ತುಳಿದು
  rationale: αὐτοὺς ಮುತ್ತುಗಳನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಅವನ್ನು’ ಎಂದು ನೀಡಿದ್ದು, ಕಾಲುಗಳಿಂದ ತುಳಿಯುವ ದೃಶ್ಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: στραφέντες ῥήξωσιν ὑμᾶς
  choice: ತಿರುಗಿಬಿದ್ದು ನಿಮ್ಮನ್ನು ಹರಿದುಹಾಕಬಹುದು
  rationale: ತಿರುಗಿ ಆಕ್ರಮಿಸುವ ಕ್ರಮವನ್ನೂ ῥήγνυμιಯ ಹಿಂಸಾತ್ಮಕ ಹರಿಯುವ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಪವಿತ್ರವಾದದ್ದು,’ ‘ನಾಯಿಗಳು,’ ‘ಮುತ್ತುಗಳು,’ ಮತ್ತು ‘ಹಂದಿಗಳು’ ಎಂಬ ರೂಪಕಗಳ ಅರ್ಥ
  choice: ರೂಪಕಗಳನ್ನು ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆಯಿಲ್ಲದೆ ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಪವಿತ್ರವಾದದ್ದು’ ಎಂಬುದನ್ನು ಪವಿತ್ರ ಬೋಧನೆ ಅಥವಾ ರಾಜ್ಯದ ಸಂದೇಶವೆಂದೂ, ನಾಯಿಗಳು ಮತ್ತು ಹಂದಿಗಳನ್ನು ನಿರ್ದಿಷ್ಟ ವರ್ಗದ ಜನರೆಂದೂ ಸ್ಪಷ್ಟೀಕರಿಸುವುದು.
  rationale: ವಚನವೇ ಈ ರೂಪಕಗಳಿಗೆ ನಿಖರ ವ್ಯಾಖ್ಯಾನ ನೀಡುವುದಿಲ್ಲ. ಅವನ್ನು ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತಾತ್ಮಕ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆ ಮತ್ತು ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ರೂಪಕಗಳ ಕಟುವನ್ನು ಮೃದುಗೊಳಿಸಿಲ್ಲ; ಅರ್ಥವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಿಲ್ಲ.
