id: MAT.2.4
reference: Matthew 2:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: kn
  text: ಅವನು ಜನರ ಎಲ್ಲ ಮುಖ್ಯ ಯಾಜಕರನ್ನೂ ಶಾಸ್ತ್ರಿಗಳನ್ನೂ ಒಟ್ಟುಗೂಡಿಸಿ, ಮೆಸ್ಸೀಯನು[a] ಎಲ್ಲಿ ಹುಟ್ಟಬೇಕೆಂದು ಅವರಿಂದ ವಿಚಾರಿಸುತ್ತಿದ್ದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಕ್ರಿಸ್ತನು.’ ಗ್ರೀಕ್‌ನ Χριστός ಎಂಬ ಬಿರುದು ‘ಅಭಿಷಿಕ್ತನು’ ಎಂಬ ಅರ್ಥವನ್ನು ಹೊಂದಿದೆ; ಇಲ್ಲಿ ಯೆಹೂದ್ಯರ ಮೆಸ್ಸೀಯ ನಿರೀಕ್ಷೆಯ ಸಂದರ್ಭವನ್ನು ಉಳಿಸಲು ‘ಮೆಸ್ಸೀಯನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: ಒಟ್ಟುಗೂಡಿಸಿ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ aorist participle ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಪೂರ್ವಕಾಲಿಕ ಕ್ರಿಯಾರೂಪದಿಂದ ತಿಳಿಸಲಾಗಿದೆ.
- source_word: πάντας
  choice: ಎಲ್ಲ
  rationale: ಗ್ರೀಕ್ ಪದದ ಸಮಗ್ರತೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀρχιερεῖς
  choice: ಮುಖ್ಯ ಯಾಜಕರು
  rationale: ಇದು ಒಬ್ಬ ಮಹಾಯಾಜಕನ ಹುದ್ದೆಯನ್ನು ಅಲ್ಲ, ಹಿರಿಯ ಯಾಜಕ ನಾಯಕತ್ವದ ಸಮೂಹವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: γραμματεῖς
  choice: ಶಾಸ್ತ್ರಿಗಳು
  rationale: ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರತಿಲೇಖನ ಮತ್ತು ವ್ಯಾಖ್ಯಾನದಲ್ಲಿ ಪರಿಣತರಾಗಿದ್ದವರನ್ನು ಸೂಚಿಸುವ ಪರಂಪರಿತವಾಗಿಯೂ ಅರ್ಥವಾಗುವ ನೇರ ಪದ.
- source_word: τοῦ λαοῦ
  choice: ಜನರ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸರಳ ಸಂಬಂಧವಾಚಕವನ್ನು ಉಳಿಸಿ, ‘ಯೆಹೂದ್ಯ ಜನರ’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐπυνθάνετο
  choice: ವಿಚಾರಿಸುತ್ತಿದ್ದನು
  rationale: imperfect ರೂಪದಲ್ಲಿರುವ ಮುಂದುವರಿದ ವಿಚಾರಣೆಯ ಅಂಶವನ್ನು ಕನ್ನಡದ ‘-ತ್ತಿದ್ದನು’ ರೂಪವು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: παρ’ αὐτῶν
  choice: ಅವರಿಂದ
  rationale: ಮಾಹಿತಿಯನ್ನು ಅವರಿಂದ ಕೇಳಿ ತಿಳಿದುಕೊಳ್ಳುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ποῦ
  choice: ಎಲ್ಲಿ
  rationale: ನೇರ ಪ್ರಶ್ನಾರ್ಥಕ ಕ್ರಿಯಾವಿಶೇಷಣದ ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ὁ χριστὸς
  choice: ಮೆಸ್ಸೀಯನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ನಿರೀಕ್ಷಿತ ಅಭಿಷಿಕ್ತ ಅರಸನ ಬಿರುದಾಗಿರುವುದರಿಂದ ಯೆಹೂದ್ಯ ಮೆಸ್ಸೀಯ ನಿರೀಕ್ಷೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: γεννᾶται
  choice: ಹುಟ್ಟಬೇಕೆಂದು
  rationale: ಭವಿಷ್ಯವಾಣಿಯ ಪ್ರಕಾರ ನಿರೀಕ್ಷಿಸಲಾದ ಜನನಸ್ಥಳದ ಕುರಿತ ಪರೋಕ್ಷ ಪ್ರಶ್ನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಇದು ನೈತಿಕ ಕರ್ತವ್ಯಕ್ಕಿಂತ ನಿರ್ಧರಿತ ಅಥವಾ ನಿರೀಕ್ಷಿತ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: Χριστός ಎಂಬ ಬಿರುದಿನ ಅನುವಾದ
  choice: ಮೆಸ್ಸೀಯನು
  alternative: ಕ್ರಿಸ್ತನು
  rationale: ಹೆರೋದನು ಯೆಹೂದ್ಯ ಪ್ರವಾದನೆಗಳಲ್ಲಿ ನಿರೀಕ್ಷಿಸಲಾದ ಅಭಿಷಿಕ್ತ ಅರಸನ ಕುರಿತು ಕೇಳುತ್ತಿರುವುದರಿಂದ, ಇಲ್ಲಿ ಪದವು ವ್ಯಕ್ತಿನಾಮದಂತೆ ಅಲ್ಲದೆ ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ‘ಮೆಸ್ಸೀಯನು’ ಎಂಬುದು ಆ ಸಾಂದರ್ಭಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ವಾಕ್ಯರಚನೆ. ‘ಮುಖ್ಯ ಯಾಜಕರು’ ಮತ್ತು ‘ಶಾಸ್ತ್ರಿಗಳು’ ಎಂಬ ಪದಗಳು ಮೂಲದ ವಿಭಿನ್ನ ನಾಯಕವರ್ಗಗಳನ್ನು ಉಳಿಸುತ್ತವೆ; imperfect ಕ್ರಿಯೆಯ ಮುಂದುವರಿದ ಸ್ವರೂಪವನ್ನು ‘ವಿಚಾರಿಸುತ್ತಿದ್ದನು’ ಎಂದು ತೋರಿಸಲಾಗಿದೆ.
