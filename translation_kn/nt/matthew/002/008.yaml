id: MAT.2.8
reference: Matthew 2:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: kn
  text: ಅವನು ಅವರನ್ನು ಬೇತ್ಲೆಹೇಮಿಗೆ ಕಳುಹಿಸಿ, “ನೀವು ಹೋಗಿ ಆ ಮಗುವಿನ ಕುರಿತು ಕೂಲಂಕಷವಾಗಿ ವಿಚಾರಿಸಿ. ಅದನ್ನು ಕಂಡಾಗ ನನಗೆ ತಿಳಿಸಿ; ಹೀಗೆ ನಾನೂ ಬಂದು ಆ ಮಗುವನ್ನು ಆರಾಧಿಸುವೆನು[a]” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಆ ಮಗುವಿಗೆ ನಮಸ್ಕರಿಸುವೆನು” ಅಥವಾ “ರಾಜನಿಗೆ ತಕ್ಕ ಗೌರವ ಸಲ್ಲಿಸುವೆನು.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಆರಾಧನೆಯನ್ನು ಅಥವಾ ರಾಜನಂತಹ ವ್ಯಕ್ತಿಯ ಮುಂದೆ ತೋರುವ ಗೌರವವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: ಕಳುಹಿಸಿ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯಾದ ‘ಹೇಳಿದನು’ಗಿಂತ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಪೂರ್ವಕಾಲಿಕ ಕೃದಂತರೂಪದಿಂದ ಸೂಚಿಸುತ್ತದೆ.
- source_word: Πορευθέντες
  choice: ನೀವು ಹೋಗಿ
  rationale: ಇದು ἐξετάσατε ಜೊತೆಗೆ ಆಜ್ಞಾರ್ಥಕ ಬಲ ಹೊಂದಿದ್ದು, ಕನ್ನಡದಲ್ಲಿ ‘ಹೋಗಿ ... ವಿಚಾರಿಸಿ’ ಎಂಬುದು ಸಹಜವಾಗಿದೆ.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: ಕೂಲಂಕಷವಾಗಿ ವಿಚಾರಿಸಿ
  rationale: ಕ್ರಿಯಾಪದ ಮತ್ತು ಕ್ರಿಯಾವಿಶೇಷಣದ ಸಂಯೋಜನೆ ನಿಖರವಾದ, ಶ್ರದ್ಧಾಪೂರ್ವಕ ತನಿಖೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕೂಲಂಕಷವಾಗಿ ವಿಚಾರಿಸಿ’ ಆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: περὶ τοῦ παιδίου
  choice: ಆ ಮಗುವಿನ ಕುರಿತು
  rationale: περίಯ ಮೂಲ ‘ಕುರಿತು/ಬಗ್ಗೆ’ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಮಗುವಿನ ಇರುವಿಕೆಯ ಕುರಿತು ನಿಖರ ಮಾಹಿತಿ ಕಲೆಹಾಕುವ ಸಂದರ್ಭಕ್ಕೆ ಹೊಂದುತ್ತದೆ.
- source_word: παιδίου
  choice: ಮಗು
  rationale: παιδίονಗೆ ಸರಳವೂ ಸಹಜವೂ ಆದ ಸಮಾನಾರ್ಥಕ; ಮೂಲಪದಕ್ಕಿಂತ ಹೆಚ್ಚು ವಯಸ್ಸಿನ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐπὰν δὲ εὕρητε
  choice: ಅದು ನಿಮಗೆ ಸಿಕ್ಕಿದಾಗ
  rationale: ನಿರೀಕ್ಷಿತವಾದರೂ ಇನ್ನೂ ಸಂಭವಿಸದ ಸಂದರ್ಭವನ್ನು ‘ಸಿಕ್ಕಿದಾಗ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಮಗುವಿಗೆ ಗೌರವಸೂಚಕವಲ್ಲದ ನಪುಂಸಕ ಸರ್ವನಾಮ ಬಳಸುವುದು ವ್ಯಾಕರಣಸಹಜವಾಗಿದೆ.
- source_word: ἀπαγγείλατέ μοι
  choice: ನನಗೆ ತಿಳಿಸಿ
  rationale: ಮರಳಿ ಮಾಹಿತಿ ನೀಡುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὅπως
  choice: ಆಗ
  rationale: ಹಿಂದಿನ ಆಜ್ಞೆಯ ಫಲವಾಗಿ ಹೆರೋದನ ಉದ್ದೇಶ ನೆರವೇರುವ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ; ‘ಹೀಗೆ ನಾನೂ’ ಎಂಬ ಗಡಸು ರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: κἀγὼ
  choice: ನಾನೂ
  rationale: ಮಾಗಿಗಳ ಉದ್ದೇಶದಲ್ಲಿ ತಾನೂ ಪಾಲುಗೊಳ್ಳುವೆನೆಂಬ ಹೆರೋದನ ಹೇಳಿಕೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: ಬಂದು ಅದಕ್ಕೆ ಅಡ್ಡಬಿದ್ದು ಆರಾಧಿಸುವೆನು
  rationale: ಪಾಲ್ಗೊಂಡ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂಯೋಜಿತ ಕ್ರಿಯೆಯಾಗಿ ನೀಡುತ್ತದೆ. ‘ಅಡ್ಡಬಿದ್ದು ಆರಾಧಿಸು’ ಎಂಬುದು προσκυνέω ಪದದಲ್ಲಿರುವ ದೈಹಿಕ ನಮನ ಮತ್ತು ಆರಾಧನೆ ಎರಡರ ಸಾಧ್ಯತೆಯನ್ನೂ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮಗು ಯೇಸುವಿನ ಸಂಬಂಧದಲ್ಲಿ προσκυνήσω αὐτῷ ಪದಪ್ರಯೋಗ
  choice: ಅದಕ್ಕೆ ಅಡ್ಡಬಿದ್ದು ಆರಾಧಿಸುವೆನು
  alternative: ಅದಕ್ಕೆ ಅಡ್ಡಬಿದ್ದು ಗೌರವ ಸಲ್ಲಿಸುವೆನು
  rationale: προσκυνέω ಆರಾಧನೆಯನ್ನೂ ರಾಜನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು ಗೌರವ ಸಲ್ಲಿಸುವುದನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು. ಮತ್ತಾಯನ ನಿರೂಪಣೆಯಲ್ಲಿ ಯೇಸುವಿನ ಕುರಿತು ಇದರ ಗಾಢ ಧಾರ್ಮಿಕ ಪ್ರತಿಧ್ವನಿ ಉಳಿದಿದ್ದರೂ, ಹೆರೋದನ ಮಾತಿನ ರಾಜಕೀಯ ಸಂದರ್ಭವೂ ಅಳಿಸಿಹೋಗಬಾರದು. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಎರಡೂ ಆಯಾಮಗಳಿಗೆ ಅವಕಾಶ ನೀಡುತ್ತದೆ ಮತ್ತು ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ದಾಖಲಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಘನತೆಯಿರುವ ನಿರೂಪಣಾ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಕೂಲಂಕಷವಾಗಿ ವಿಚಾರಿಸಿ’ ಎಂಬುದು ನಿಖರ ತನಿಖೆಯ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
