  to: ಅವನು ಅವರನ್ನು ಬೇತ್ಲೆಹೇಮಿಗೆ ಕಳುಹಿಸಿ, “ನೀವು ಹೋಗಿ ಆ ಮಗುವಿನ ಕುರಿತು ಕೂಲಂಕಷವಾಗಿ ವಿಚಾರಿಸಿ. ಅದನ್ನು ಕಂಡಾಗ ನನಗೆ ತಿಳಿಸಿ; ಹೀಗೆ ನಾನೂ ಬಂದು ಆ ಮಗುವನ್ನು ಆರಾಧಿಸುವೆನು[a]” ಎಂದು ಹೇಳಿದನು.
  rationale: The revision restores the purposive force of ὅπως, uses a more natural personal reference to the child, and renders προσκυνέω without unnecessarily specifying prostration. The footnote preserves the lexical ambiguity between worship and royal homage.
