id: MAT.2.13
reference: Matthew 2:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: kn
  text: ಅವರು ಹೊರಟುಹೋದ ಬಳಿಕ, ಇಗೋ, ಕರ್ತನ ಒಬ್ಬ ದೂತನು ಯೋಸೇಫನಿಗೆ ಕನಸಿನಲ್ಲಿ ಕಾಣಿಸಿಕೊಂಡು, “ಎದ್ದು, ಮಗುವನ್ನೂ ಅದರ ತಾಯಿಯನ್ನೂ ಕರೆದುಕೊಂಡು ಈಜಿಪ್ಟಿಗೆ ಓಡಿಹೋಗು. ನಾನು ನಿನಗೆ ಹೇಳುವ ತನಕ ಅಲ್ಲಿಯೇ ಇರು; ಏಕೆಂದರೆ ಹೆರೋದನು ಮಗುವನ್ನು ಕೊಲ್ಲುವುದಕ್ಕಾಗಿ ಅದನ್ನು ಹುಡುಕಲಿದ್ದಾನೆ[a]” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಅದನ್ನು ನಾಶಮಾಡಲು’ ಎಂದಿದೆ; ಇಲ್ಲಿ ಅದರ ಅರ್ಥ ಮಗುವನ್ನು ಕೊಲ್ಲುವುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: ಅವರು ಹೊರಟುಹೋದ ಬಳಿಕ
  rationale: ಕರ್ತೃಸಂಬಂಧಿ ನಿರಪೇಕ್ಷ ರಚನೆಯು ಹಿಂದಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಂದರ್ಭದಲ್ಲಿನ ಜ್ಞಾನಿಗಳು ಹೊರಟುಹೋದ ನಂತರದ ಕಾಲಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಹಠಾತ್ ಸಂಭವಿಸುವ ದೈವಿಕ ಹಸ್ತಕ್ಷೇಪದ ಕಡೆ ಗಮನ ಸೆಳೆಯುವ ಮತ್ತಾಯನ ಜೀವಂತ ನಿರೂಪಣಾ ಸೂಚಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἄγγελος κυρίου
  choice: ಕರ್ತನ ದೂತನು
  rationale: ἄγγελος ಪದಕ್ಕೆ ಲೇಖನವಿಲ್ಲದಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ‘ಕರ್ತನ ದೂತನು’ ಎಂಬ ರೂಪವು ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಅನಿವಾರ್ಯವಾಗಿ ತೀರ್ಮಾನಿಸದೆ ಸಹಜವಾಗಿ ಕೇಳುತ್ತದೆ; κύριος ಅನ್ನು ಗೌರವಪೂರ್ಣವಾಗಿ ‘ಕರ್ತನು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: ಯೋಸೇಫನಿಗೆ ಕನಸಿನಲ್ಲಿ ಕಾಣಿಸಿಕೊಂಡು
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನಕಾಲವನ್ನು ಕನ್ನಡ ಕಥನದ ಸಹಜ ಭೂತಕಾಲಕ್ಕೆ ಹೊಂದಿಸಲಾಗಿದೆ; κατ’ ὄναρ ಎಂಬ ನುಡಿಗಟ್ಟನ್ನು ‘ಕನಸಿನಲ್ಲಿ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: Ἐγερθεὶς παράλαβε
  choice: ಎದ್ದು, ... ಕರೆದುಕೊಂಡು
  rationale: ಆಜ್ಞೆಗಳ ಸರಣಿಯಲ್ಲಿ ಕೃದಂತರೂಪವು ಆಜ್ಞಾರ್ಥದ ಬಲ ಹೊಂದಿದೆ; παράλαβε ಇಲ್ಲಿ ತನ್ನೊಡನೆ ಕರೆದುಕೊಂಡು ಹೋಗುವ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: ಮಗುವನ್ನೂ ಅದರ ತಾಯಿಯನ್ನೂ
  rationale: ಪಠ್ಯದ ಗಮನ ಮಗುವಿನ ಮೇಲಿರುವುದನ್ನು ಮತ್ತು ತಾಯಿ ಮಗುವಿಗೆ ಸಂಬಂಧಿಸಿದ್ದಾಳೆಂಬ ಮೂಲದ ರಚನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: ಈಜಿಪ್ಟಿಗೆ ಓಡಿಹೋಗು
  rationale: φεύγω ಸೂಚಿಸುವ ಅಪಾಯ ಮತ್ತು ತುರ್ತಿನ ಭಾವವನ್ನು ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: ನಾನು ನಿನಗೆ ಹೇಳುವ ತನಕ ಅಲ್ಲಿಯೇ ಇರು
  rationale: ಭವಿಷ್ಯದ ಅನಿರ್ದಿಷ್ಟ ಕಾಲಮಿತಿಯನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಅಲ್ಲಿಯೇ ಇರು’ ಮುಂದುವರಿದ ವಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: μέλλει ... ζητεῖν
  choice: ಹುಡುಕಲಿದ್ದಾನೆ
  rationale: μέλλει ಸಮೀಪಿಸುತ್ತಿರುವ ಉದ್ದೇಶಿತ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ‘-ಲಿದ್ದಾನೆ’ ರೂಪವು ಆ ಭಾವವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: ಕೊಲ್ಲಬೇಕೆಂದು
  rationale: ἀπόλλυμι ಮೂಲತಃ ನಾಶಮಾಡುವುದನ್ನು ಸೂಚಿಸಿದರೂ, ಇಲ್ಲಿ ಮಗುವಿನ ಸಾವಿಗೆ ಕಾರಣವಾಗುವುದೇ ಸಂದರ್ಭಸ್ಪಷ್ಟ ಅರ್ಥ; ‘ಕೊಲ್ಲು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ನೇರ ಮತ್ತು ನಿಖರವಾಗಿದೆ.
theological_decisions:
- issue: ἄγγελος κυρίου ಎಂಬ ಪದಗುಚ್ಛದಲ್ಲಿನ κύριος
  choice: ಕರ್ತನ ದೂತನು
  alternative: ಯಜಮಾನನ ದೂತನು
  rationale: ಈ ಬೈಬಲೀಯ ಸಂದರ್ಭದಲ್ಲಿ κύριος ದೇವರನ್ನು ಸೂಚಿಸುವ ಗೌರವಪದ; ‘ಕರ್ತನು’ ಪಠ್ಯಕ್ಕನುಗುಣವಾಗಿದ್ದು, ದೂತನ ಗುರುತಿನ ಕುರಿತು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತವನ್ನು ಹೇರದು.
- issue: ಲೇಖನವಿಲ್ಲದ ἄγγελος ಮತ್ತು ನಿರ್ದಿಷ್ಟತೆಯ ಪ್ರಶ್ನೆ
  choice: ಕರ್ತನ ದೂತನು
  alternative: ಕರ್ತನ ಒಬ್ಬ ದೂತನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಲೇಖನವಿಲ್ಲದಿರುವುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕಡ್ಡಾಯವಾಗಿ ‘ಒಬ್ಬ’ ಎಂದು ಸೂಚಿಸುವ ಅಗತ್ಯವಿಲ್ಲ. ಆಯ್ದ ರೂಪವು ‘ಒಬ್ಬ ದೂತ’ ಮತ್ತು ಪರಿಚಿತ ಬೈಬಲೀಯ ಅಭಿವ್ಯಕ್ತಿ ಎಂಬ ಎರಡೂ ಕೇಳುವ ಸಾಧ್ಯತೆಯನ್ನು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- issue: ἀπολέσαι ಪದದ ಸಾವಿನ ಅರ್ಥ
  choice: ಕೊಲ್ಲಬೇಕೆಂದು
  alternative: ನಾಶಮಾಡಬೇಕೆಂದು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಹೆರೋದನ ಉದ್ದೇಶ ಮಗುವಿನ ಮರಣವೇ. ‘ಕೊಲ್ಲು’ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ನಾಶಮಾಡು’ ಎಂಬ ಮೂಲಪದಕ್ಕೆ ಹತ್ತಿರದ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬ ಸಾಹಿತ್ಯಿಕ ಸೂಚಕವನ್ನು ಮತ್ತಾಯನ ಜೀವಂತ ನಿರೂಪಣೆಗೆ ಉಳಿಸಲಾಗಿದೆ. ಆಜ್ಞೆಗಳು ನೇರವಾಗಿದ್ದು, ಅಪಾಯದ ತುರ್ತನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ.
