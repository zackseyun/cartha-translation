id: MAT.2.22
reference: Matthew 2:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: kn
  text: ಆದರೆ ತನ್ನ ತಂದೆಯಾದ ಹೆರೋದನ ಸ್ಥಾನದಲ್ಲಿ ಅರ್ಖೆಲಾಯನು ಯೂದಾಯವನ್ನು ರಾಜನಾಗಿ ಆಳುತ್ತಿದ್ದಾನೆಂದು ಕೇಳಿದಾಗ, ಯೋಸೇಫನು ಅಲ್ಲಿಗೆ ಹೋಗಲು ಹೆದರಿದನು. ಕನಸಿನಲ್ಲಿ ಎಚ್ಚರಿಕೆಯನ್ನು ಪಡೆದ ಬಳಿಕ[a], ಅವನು ಗಲಿಲಾಯದ ಪ್ರದೇಶಗಳಿಗೆ ತೆರಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಸೂಚನೆಯನ್ನು ಪಡೆದ ಬಳಿಕ’; ಈ ಕ್ರಿಯಾಪದವು ಸಾಮಾನ್ಯವಾಗಿ ದೇವರಿಂದ ಬರುವ ಎಚ್ಚರಿಕೆ ಅಥವಾ ಸೂಚನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: ಆದರೆ ... ಎಂದು ಕೇಳಿದಾಗ
  rationale: Aorist participleಗೆ ಸಹಜವಾದ ಕಾಲಸಂಬಂಧವನ್ನು ‘ಕೇಳಿದಾಗ’ ತಿಳಿಸುತ್ತದೆ; δέ ಹಿಂದಿನ ಉದ್ದೇಶಕ್ಕೆ ಎದುರಾದ ಹೊಸ ಅಡ್ಡಿಯನ್ನು ‘ಆದರೆ’ ಮೂಲಕ ಸೂಚಿಸುತ್ತದೆ.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: ಯೂದಾಯವನ್ನು ಆಳುತ್ತಿದ್ದಾನೆ
  rationale: ವರದಿಯಾದ ಮಾತಿನೊಳಗಿನ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಿ, ಯೂದಾಯದ ಮೇಲೆ ರಾಜಾಧಿಕಾರ ನಡೆಸುತ್ತಿದ್ದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: ತನ್ನ ತಂದೆಯಾದ ಹೆರೋದನ ಸ್ಥಾನದಲ್ಲಿ
  rationale: ἀντί ಸೂಚಿಸುವ ಬದಲಿ ಅಥವಾ ಉತ್ತರಾಧಿಕಾರದ ಸಂಬಂಧವನ್ನು ‘ಸ್ಥಾನದಲ್ಲಿ’ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: ಅಲ್ಲಿಗೆ ಹೋಗಲು ಹೆದರಿದನು
  rationale: ಭಯದ ಕಾರಣದಿಂದ ಆ ಗಮ್ಯಸ್ಥಾನಕ್ಕೆ ಹೋಗಲು ಹಿಂಜರಿದ ಅರ್ಥವನ್ನು ಸರಳ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: χρηματισθεὶς
  choice: ಎಚ್ಚರಿಕೆಯನ್ನು ಪಡೆದ ಬಳಿಕ
  rationale: ದೈವಿಕ ಎಚ್ಚರಿಕೆ ಅಥವಾ ಸೂಚನೆಯ ಅರ್ಥಛಾಯೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಆದರೆ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ತೃ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲದ ಕಾರಣ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ದೇವರಿಂದ’ ಎಂದು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: κατ’ ὄναρ
  choice: ಕನಸಿನಲ್ಲಿ
  rationale: ಮತ್ತಾಯನಲ್ಲಿ ಕನಸಿನ ಮೂಲಕ ಬಂದ ಪ್ರಕಟಣೆಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡ ರೂಪ.
- source_word: ἀνεχώρησεν
  choice: ತೆರಳಿದನು
  rationale: ಅಪಾಯದ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಬೇರೆ ಕಡೆಗೆ ಹೋದ ಅರ್ಥವನ್ನು ಸಂದರ್ಭವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಹಿಂತೆಗೆದುಕೊಂಡನು’ ಎಂಬ ಕೃತಕ ಅಥವಾ ಸೈನಿಕ ಧ್ವನಿಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: ಗಲಿಲಾಯದ ಪ್ರದೇಶಗಳಿಗೆ
  rationale: μέρη ಎಂಬ ಬಹುವಚನವನ್ನು ‘ಪ್ರದೇಶಗಳಿಗೆ’ ಎಂದು ಪ್ರತಿಬಿಂಬಿಸಿ, ನಿರ್ದಿಷ್ಟ ನಗರಕ್ಕಿಂತ ವಿಶಾಲ ಭೂಭಾಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: χρηματισθείς ಎಂಬ ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಎಚ್ಚರಿಕೆಯ ದೈವಿಕ ಮೂಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಬೇಕೇ?
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕರ್ತೃವನ್ನು ಸೇರಿಸದೆ ‘ಎಚ್ಚರಿಕೆಯನ್ನು ಪಡೆದ ಬಳಿಕ’ ಎಂದು ಇಡಲಾಗಿದೆ.
  alternative: ‘ದೇವರಿಂದ ಎಚ್ಚರಿಸಲ್ಪಟ್ಟ ಬಳಿಕ’ ಅಥವಾ ‘ದೈವಿಕ ಸೂಚನೆಯನ್ನು ಪಡೆದ ಬಳಿಕ’
  rationale: ಮತ್ತಾಯನ ಬಳಕೆಯಲ್ಲಿ ದೈವಿಕ ಸಂವಹನದ ಸೂಚನೆ ಸಾಮಾನ್ಯವಾಗಿದ್ದರೂ, ಈ ವಾಕ್ಯದಲ್ಲಿ ಕರ್ತೃ ಅಪ್ರಕಟಿತ. ಆದ್ದರಿಂದ ದೈವಿಕ ಸೂಚನೆಯನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ತಿಳಿಸಿ, ಮುಖ್ಯ ಪಠ್ಯದ ನಿಜವಾದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ನಿರೂಪಣೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಯೋಸೇಫನ ಹೆಸರು ಈ ವಾಕ್ಯದಲ್ಲಿ ಇಲ್ಲದಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ಕರ್ತೃ ಸ್ಪಷ್ಟತೆಗೆ ‘ಯೋಸೇಫನು’ ಬಳಸಲಾಗಿದೆ; ಇದು ಹಿಂದಿನ ಸಂದರ್ಭದಿಂದ ದೊರೆಯುವ ಸೂಚ್ಯ ಕರ್ತೃ. ಅಡಿಕುರಿತು ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸೇರಿಸಲಾಗಿದೆ.
