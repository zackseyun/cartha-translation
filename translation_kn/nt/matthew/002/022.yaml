  naturalness: The Kannada is clear, modern, and appropriately narrative in register. ‘ಕೇಳಿದಾಗ’ and ‘ಹೆದರಿದನು’ are idiomatic. The explicit ‘ಯೋಸೇಫನು’ is a legitimate clarification of the source’s contextually implied subject.
