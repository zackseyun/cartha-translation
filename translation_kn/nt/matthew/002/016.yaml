  terminology: “ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳು” is a defensible contextual rendering of μάγοι, provided the note identifies the Greek term and the traditional “ಜ್ಞಾನಿಗಳು” rendering. “ಕೊಲ್ಲಿಸಿದನು” appropriately conveys Herod's responsibility while naturally reflecting that he sent agents.
  issues:
  - severity: medium
    issue: Footnote b is anchored after “ಕೊಲ್ಲಿಸಿದನು,” though its content explains “ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳು.”
    rationale: The cultural footnote must be anchored to the term it explains. Its current placement can make readers associate it with the killing clause rather than with the magi.
  - severity: low
