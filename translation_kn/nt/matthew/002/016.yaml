id: MAT.2.16
reference: Matthew 2:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: kn
  text: ಆಗ ಹೆರೋದನು ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳು[b] ತನ್ನನ್ನು ಮೋಸಗೊಳಿಸಿದ್ದಾರೆ[a] ಎಂದು ತಿಳಿದು ಬಹಳ ಕೋಪಗೊಂಡನು. ಅವನು ಜನರನ್ನು ಕಳುಹಿಸಿ, ಬೇತ್ಲೆಹೇಮಿನಲ್ಲಿಯೂ ಅದರ ಸುತ್ತಮುತ್ತಲಿನ ಎಲ್ಲ ಪ್ರದೇಶಗಳಲ್ಲಿಯೂ ಇದ್ದ ಎರಡು ವರ್ಷ ವಯಸ್ಸಿನ ಮತ್ತು ಅದಕ್ಕಿಂತ ಕಡಿಮೆ ವಯಸ್ಸಿನ ಗಂಡುಮಕ್ಕಳನ್ನೆಲ್ಲ, ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳಿಂದ ತಾನು ಖಚಿತವಾಗಿ ತಿಳಿದುಕೊಂಡಿದ್ದ ಸಮಯದ ಪ್ರಕಾರ, ಕೊಲ್ಲಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃವಾಗಿ, “ತನ್ನನ್ನು ಅಪಹಾಸ್ಯ ಮಾಡಿದ್ದಾರೆ” ಅಥವಾ “ತನ್ನನ್ನು ಮೂರ್ಖನನ್ನಾಗಿ ಮಾಡಿದ್ದಾರೆ.”
    reason: lexical_alternative
  - marker: b
    text: “ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳು” ಎಂಬುದಕ್ಕೆ ಗ್ರೀಕ್ ಪದ ಮಾಗೊಯ್; ಇದು ಪೂರ್ವದ ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಇವರನ್ನು “ಜ್ಞಾನಿಗಳು” ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಘಟನೆಗಳ ಅನುಕ್ರಮವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುವ ಆಧುನಿಕ ಕನ್ನಡದ ಕಾಲಸಂಬಂಧಿ ಪದ.
- source_word: ἰδὼν ὅτι
  choice: ಎಂದು ತಿಳಿದು
  rationale: ಹೆರೋದನು ಒಂದು ಸಂಗತಿಯನ್ನು ಗ್ರಹಿಸಿದನೆಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐνεπαίχθη
  choice: ತನ್ನನ್ನು ವಂಚಿಸಿದ್ದಾರೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳು ಹಿಂದಿರುಗದೆ ಹೆರೋದನ ಯೋಜನೆಯನ್ನು ವಿಫಲಗೊಳಿಸಿದ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ‘ಅಪಹಾಸ್ಯ ಮಾಡಿದ್ದಾರೆ’ ಎಂಬ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ಅರ್ಥವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: μάγων
  choice: ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳು
  rationale: ಪೂರ್ವದ ಜ್ಞಾನಿಗಳೂ ಜ್ಯೋತಿಷಿಗಳೂ ಆಗಿದ್ದ ವ್ಯಕ್ತಿಗಳ ಸಾಂಸ್ಕೃತಿಕ ಗುರುತನ್ನು ‘ಜ್ಞಾನಿಗಳು’ ಎಂಬ ಪದಕ್ಕಿಂತ ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐθυμώθη λίαν
  choice: ಬಹಳ ಕೋಪಗೊಂಡನು
  rationale: ಕ್ರಿಯಾಪದದ ಕೋಪದ ಅರ್ಥವನ್ನೂ λίαν ಎಂಬ ತೀವ್ರತೆಯನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: ಜನರನ್ನು ಕಳುಹಿಸಿ ... ಕೊಲ್ಲಿಸಿದನು
  rationale: ಹೆರೋದನು ಕಾರ್ಯನಿರ್ವಾಹಕರನ್ನು ಕಳುಹಿಸಿ ಅವರ ಮೂಲಕ ಕೊಲೆ ಮಾಡಿಸಿದನೆಂಬ ಗ್ರೀಕ್ ವಾಕ್ಯದ ಸಹಜ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: πάντας τοὺς παῖδας
  choice: ಗಂಡುಮಕ್ಕಳನ್ನೆಲ್ಲ
  rationale: ಈ ಕಥನಸಂದರ್ಭದಲ್ಲಿ παῖδας ಗಂಡುಮಕ್ಕಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಲಿಂಗವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: ಅದರ ಸುತ್ತಮುತ್ತಲಿನ ಎಲ್ಲ ಪ್ರದೇಶಗಳಲ್ಲಿಯೂ
  rationale: ὅρια ಎಂಬುದು ಗಡಿ ಮಾತ್ರವಲ್ಲದೆ ಸುತ್ತಲಿನ ಪ್ರದೇಶವನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು; ಈ ಆಯ್ಕೆ ಸಹಜ ಮತ್ತು ಸಂದರ್ಭೋಚಿತ.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: ಎರಡು ವರ್ಷದ ಮತ್ತು ಅದಕ್ಕಿಂತ ಕಡಿಮೆ ವಯಸ್ಸಿನ
  rationale: ಎರಡು ವರ್ಷವನ್ನು ಒಳಗೊಂಡ ಮೇಲಿನ ವಯೋಮಿತಿಯನ್ನು ನಿಖರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν
  choice: ತಾನು ಖಚಿತವಾಗಿ ತಿಳಿದುಕೊಂಡಿದ್ದ ಕಾಲದ ಪ್ರಕಾರ
  rationale: ಕಾಲದ ಮಾಹಿತಿಯನ್ನು ವಿಚಾರಿಸಿ ನಿಖರವಾಗಿ ನಿರ್ಧರಿಸಿದ್ದನೆಂಬ ἀκριβόω ಪದದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: μάγοι ಎಂಬ ಪದದ ನಿರೂಪಣೆ
  choice: ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳು
  alternative: ಜ್ಞಾನಿಗಳು / ಮಾಗಿಗಳು
  rationale: ನಂತರದ ಪರಂಪರೆಯ ಚಿತ್ರಣವನ್ನು ಆಮದು ಮಾಡದೆ, ಮೂಲಪದವು ಸೂಚಿಸುವ ಪೂರ್ವದ ಜ್ಞಾನಿ-ಜ್ಯೋತಿಷಿಗಳ ಗುರುತನ್ನು ಓದುಗರಿಗೆ ತಿಳಿಸುತ್ತದೆ.
- issue: ἐνεπαίχθη ಎಂಬ ಪದದ ಅರ್ಥ
  choice: ವಂಚಿಸಿದ್ದಾರೆ
  alternative: ಅಪಹಾಸ್ಯ ಮಾಡಿದ್ದಾರೆ
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಹೆರೋದನು ಮೋಸಹೋದ ಅಥವಾ ಮೂರ್ಖನಾಗಿಸಲ್ಪಟ್ಟ ಭಾವನೆ ಮುಖ್ಯ; ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ಪರ್ಯಾಯವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡುವುದರಿಂದ ಮೂಲದ ಅರ್ಥವ್ಯಾಪ್ತಿಯೂ ಉಳಿಯುತ್ತದೆ.
- issue: ಹೆರೋದನ ಕಾರ್ಯಕಾರಿತ್ವ
  choice: ಜನರನ್ನು ಕಳುಹಿಸಿ ... ಕೊಲ್ಲಿಸಿದನು
  alternative: ಕಳುಹಿಸಿ ... ಕೊಂದನು
  rationale: ἀποστείλας ಎಂಬುದು ಪ್ರತಿನಿಧಿಗಳನ್ನು ಕಳುಹಿಸಿದುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ಕಾರಣಾರ್ಥಕ ರೂಪವು ಹೆರೋದನ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಮತ್ತು ಕಾರ್ಯವು ಅವನ ಆದೇಶದ ಮೂಲಕ ನಡೆದದ್ದನ್ನು ಎರಡನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ದೀರ್ಘ ರಚನೆಯನ್ನು ಕನ್ನಡದ ಓದುಗತೆಗೆ ಅನುಗುಣವಾಗಿ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿಭಜಿಸಲಾಗಿದೆ. ಹೆರೋದನು ಪ್ರತಿನಿಧಿಗಳ ಮೂಲಕ ಕೊಲೆ ಮಾಡಿಸಿದ್ದನ್ನು ‘ಕೊಲ್ಲಿಸಿದನು’ ಎಂದು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ. ಎಲ್ಲ [a], [b] ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
