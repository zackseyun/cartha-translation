id: MAT.2.18
reference: Matthew 2:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: kn
  text: “ರಾಮದಲ್ಲಿ ಒಂದು ಧ್ವನಿ ಕೇಳಿಸಿತು—ಅಳುವಿಕೆಯೂ ಬಹಳ ಗೋಳಾಟವೂ; ತನ್ನ ಮಕ್ಕಳಿಗಾಗಿ ಅಳುತ್ತಿದ್ದ ರಾಹೇಲಳು, ಅವರು ಇಲ್ಲದಿರುವುದರಿಂದ ಸಾಂತ್ವನ ಪಡೆಯಲು ಇಷ್ಟಪಡಲಿಲ್ಲ.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಸಾಂತ್ವನ ಪಡೆಯಲು ಅವಳು ನಿರಾಕರಿಸಿದಳು.”
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, “ಏಕೆಂದರೆ ಅವರು ಇಲ್ಲ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: ಒಂದು ಧ್ವನಿ
  rationale: ವ್ಯಕ್ತೀಕೃತ ಪ್ರವಾದನಾತ್ಮಕ ಧಾಟಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಮುಂದಿನ ಅಳುವಿಕೆ ಮತ್ತು ಗೋಳಾಟವನ್ನು ಪರಿಚಯಿಸುವುದಕ್ಕೂ ಸಹಜವಾಗಿದೆ.
- source_word: ἐν Ῥαμὰ
  choice: ರಾಮದಲ್ಲಿ
  rationale: ಸ್ಥಳನಾಮದೊಂದಿಗೆ ἐν ಎಂಬುದರ ಸಹಜ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ‘ರಾಮ’ ಎಂಬುದು ಕನ್ನಡ ಸಾಂಪ್ರದಾಯಿಕ ಲಿಪ್ಯಂತರ.
- source_word: ἠκούσθη
  choice: ಕೇಳಿಸಿತು
  rationale: ಗ್ರೀಕ್ ಕರ್ತರಹಿತ ಭೂತಕಾಲದ ಕರ್ಮಣಿ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κλαυθμὸς
  choice: ಅಳುವಿಕೆ
  rationale: ಕೇಳಿಸುವ ಅಳು ಅಥವಾ ರೋದನವನ್ನು ಸೂಚಿಸುತ್ತದೆ ಮತ್ತು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: ὀδυρμὸς πολύς
  choice: ಮಹಾ ಗೋಳಾಟ
  rationale: ದುಃಖಭರಿತ ಶೋಕಧ್ವನಿಯನ್ನೂ πολύς ನೀಡುವ ತೀವ್ರತೆಯನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ῥαχὴλ
  choice: ರಾಹೇಲಳು
  rationale: ಹೆಸರಿನ ಪರಿಚಿತ ಕನ್ನಡ ರೂಪವನ್ನು ಬಳಸಿದ್ದು, ಸ್ತ್ರೀಲಿಂಗ ಕರ್ತೃವಿಭಕ್ತಿಯು ವಾಕ್ಯದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ.
- source_word: κλαίουσα
  choice: ಅಳುತ್ತಿದ್ದಾಳೆ
  rationale: ವರ್ತಮಾನ ಕೃದಂತದ ಮುಂದುವರಿಯುವ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: τὰ τέκνα αὐτῆς
  choice: ತನ್ನ ಮಕ್ಕಳಿಗಾಗಿ
  rationale: τέκνα ಲಿಂಗನಿರಪೇಕ್ಷವಾಗಿ ‘ಮಕ್ಕಳು’ ಎಂದರ್ಥ; ಸಂಬಂಧಾತ್ಮಕ ಸರ್ವನಾಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ತನ್ನ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: οὐκ ἤθελεν
  choice: ಇಷ್ಟಪಡಲಿಲ್ಲ
  rationale: θέλω ಎಂಬುದರ ಇಚ್ಛೆ ಅಥವಾ ಸಮ್ಮತಿಯ ಅರ್ಥವನ್ನು ‘ನಿರಾಕರಿಸಿದಳು’ ಎಂಬ ಹೆಚ್ಚು ಬಲವಾದ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ತಳ್ಳದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: παρακληθῆναι
  choice: ಸಮಾಧಾನ ಹೊಂದಲು
  rationale: ಈ ಶೋಕಸಂದರ್ಭದಲ್ಲಿ ಸಾಂತ್ವನ ಅಥವಾ ಸಮಾಧಾನವನ್ನು ಸ್ವೀಕರಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὅτι οὐκ εἰσίν
  choice: ಅವರು ಇಲ್ಲದಿರುವುದರಿಂದ
  rationale: ಗ್ರೀಕ್‌ನ ಅಕ್ಷರಶಃ ಮತ್ತು ಕಟುವಾದ ‘ಅವರು ಇಲ್ಲ’ ಎಂಬ ಹೇಳಿಕೆಯನ್ನು ಮರಣವೆಂದು ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಉಲ್ಲೇಖದಲ್ಲಿನ ರಾಹೇಲಳ ಸ್ವರೂಪ
  choice: ಯೆರೆಮೀಯನ ಪ್ರವಾದನಾತ್ಮಕ ಮಾತಿನ ತಾಯಿಸ್ವರೂಪದ ವ್ಯಕ್ತಿಯಾಗಿ ರಾಹೇಲಳನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ; ಸಂಕೇತಾರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ವಿವರಿಸಿಲ್ಲ.
  alternative: ರಾಹೇಲಳನ್ನು ಇಸ್ರಾಯೇಲಿನ ತಾಯಂದಿರ ನೇರ ಸಂಕೇತವೆಂದು ಅಥವಾ ಅಕ್ಷರಶಃ ಮಾತನಾಡುವ ಐತಿಹಾಸಿಕ ತಾಯಿಯೆಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಮತ್ತಾಯನು ಉಲ್ಲೇಖವನ್ನು ರೂಪಸಾದೃಶ್ಯಾತ್ಮಕವಾಗಿ ಬಳಸಿದರೂ, ಗ್ರೀಕ್ ಪಠ್ಯವೇ ಸಂಕೇತದ ಮಟ್ಟವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅದರ ಅರ್ಥತಣತಣಿಕೆಯನ್ನು ಅನಿರ್ಣೀತವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗಂಭೀರವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ಕಾವ್ಯಾತ್ಮಕ ಉಲ್ಲೇಖದ ಸಮಾಂತರತೆಯನ್ನು ಡ್ಯಾಶ್ ಮತ್ತು ಅರ್ಧವಿರಾಮದ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ; ಮರಣ ಅಥವಾ ಸಂಕೇತಾರ್ಥವನ್ನು ಪಠ್ಯಕ್ಕೆ ಹೆಚ್ಚುವರಿಯಾಗಿ ಸೇರಿಸಿಲ್ಲ.
