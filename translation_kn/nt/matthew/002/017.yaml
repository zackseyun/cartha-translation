id: MAT.2.17
reference: Matthew 2:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: kn
  text: 'ಆಗ ಪ್ರವಾದಿ ಯೆರೆಮೀಯನ ಮೂಲಕ ಹೀಗೆಂದು ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರಿತು[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಆಗ ಪ್ರವಾದಿ ಯೆರೆಮೀಯನ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರಿತು; ಅವರು ಹೀಗೆಂದರು:”
    reason: λέγοντος ಅನ್ನು ಯೆರೆಮೀಯನ ಮಾತಿನ ಕ್ರಿಯೆಯಾಗಿ ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾಗಿ ಅನುವಾದಿಸುವ ಸಾಧ್ಯತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಕಥನದಲ್ಲಿನ ಕಾಲಾನುಕ್ರಮವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐπληρώθη
  choice: ನೆರವೇರಿತು
  rationale: ಮತ್ತಾಯನ ಪ್ರವಾದನಾ-ನೆರವೇರಿಕೆಯ ಸೂತ್ರವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುವ ರೂಢಿಯ ಮತ್ತು ಸಹಜವಾದ ಕನ್ನಡ ಪದ.
- source_word: τὸ ῥηθὲν
  choice: ಹೇಳಲ್ಪಟ್ಟದ್ದು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಕರ್ಮಣಿ ಕೃದಂತದ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: διὰ Ἰερεμίου
  choice: ಯೆರೆಮೀಯನ ಮೂಲಕ
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮಾಧ್ಯಮ ಅಥವಾ ಕರ್ತೃತ್ವದ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಯೆರೆಮೀಯನು ಪ್ರವಾದನಾ ವಾಕ್ಯದ ವಾಹಕನೆಂದು ತೋರಿಸುತ್ತದೆ.
- source_word: τοῦ προφήτου
  choice: ಪ್ರವಾದಿ ಯೆರೆಮೀಯನ
  rationale: ಯೆರೆಮೀಯನ ಪಾತ್ರವನ್ನು ಸಹಜ ಕನ್ನಡ ಪದಕ್ರಮದಲ್ಲಿ ಗುರುತಿಸುತ್ತದೆ.
- source_word: λέγοντος
  choice: ಹೀಗೆಂದು
  rationale: ಮುಂದಿನ ವಚನದಲ್ಲಿರುವ ಉಲ್ಲೇಖವನ್ನು ಸಹಜವಾಗಿ ಪರಿಚಯಿಸುತ್ತದೆ; ಗ್ರೀಕ್ ಕೃದಂತದ ಉಲ್ಲೇಖ-ಪರಿಚಯ ಕಾರ್ಯವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ ನೆರವೇರಿಕೆಯ ಸೂತ್ರ
  choice: ‘ನೆರವೇರಿತು’ ಎಂಬ ಸ್ಪಷ್ಟ ಭಾಷೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ‘ನೆರವೇರಿಸುವುದಕ್ಕಾಗಿ ಸಂಭವಿಸಿತು’
  rationale: ἐπληρώθη ಕರ್ಮಣಿ ರೂಪದಲ್ಲಿದ್ದು, ಪ್ರವಾದನಾ ಮಾತು ನೆರವೇರಿತು ಎಂಬ ಮತ್ತಾಯನ ಸಾಹಿತ್ಯಿಕ-ದೈವಶಾಸ್ತ್ರೀಯ ಪ್ರತಿಪಾದನೆಯನ್ನು ನೀಡುತ್ತದೆ; ಉದ್ದೇಶಾರ್ಥವನ್ನು ಹೆಚ್ಚುವರಿಯಾಗಿ ಸೇರಿಸಬಾರದು.
- issue: λέγοντος ಪದದ ಸಂಬಂಧ ಮತ್ತು ಉಲ್ಲೇಖದ ಪರಿಚಯ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಹೀಗೆಂದು’ ಎಂದು ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸಲಾಗಿದೆ
  alternative: ‘ಅವರು ಹೀಗೆಂದರು’ ಎಂದು ಯೆರೆಮೀಯನನ್ನು ಸ್ಪಷ್ಟ ಕರ್ತೃವಾಗಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ರೂಪವು ಯೆರೆಮೀಯನೊಂದಿಗೆ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಸಂಬಂಧಿಸಿದರೂ, ಕನ್ನಡದಲ್ಲಿ ‘ಹೀಗೆಂದು ಹೇಳಲ್ಪಟ್ಟದ್ದು’ ಎಂಬ ರೂಪವು ಅನಗತ್ಯ ಕರ್ತೃ ಸೇರ್ಪಡೆಯಿಲ್ಲದೆ ಉಲ್ಲೇಖದತ್ತ ಕೊಂಡೊಯ್ಯುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವ ಶೈಲಿ. ‘ಪೂರ್ಣವಾಯಿತು’ಗಿಂತ ಪ್ರವಾದನಾ ಮಾತಿನ ಸಾಕಾರಗೊಳ್ಳುವಿಕೆಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುವ ‘ನೆರವೇರಿತು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ.
