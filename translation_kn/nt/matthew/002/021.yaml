id: MAT.2.21
reference: Matthew 2:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: kn
  text: ಆಗ ಅವನು ಎದ್ದು, ಮಗುವನ್ನೂ ಅದರ ತಾಯಿಯನ್ನೂ ಕರೆದುಕೊಂಡು ಇಸ್ರಾಯೇಲ್ ದೇಶಕ್ಕೆ ಪ್ರವೇಶಿಸಿದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ಆಗ
  rationale: ಇಲ್ಲಿ δέ ಬಲವಾದ ವಿರೋಧವನ್ನು ಸೂಚಿಸದೆ ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆಗ’ ಸಹಜ ಕನ್ನಡ ಕಥನಶೈಲಿಯಲ್ಲಿ ಆ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐγερθεὶς
  choice: ಎದ್ದು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿನ ಕರ್ಮಣಿ ರೂಪದ ಕೃದಂತವು ಅಕರ್ಮಕ ಅರ್ಥದಲ್ಲಿ ‘ಎದ್ದು’ ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮುಂದಿನ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಮವನ್ನೂ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: παρέλαβε
  choice: ಕರೆದುಕೊಂಡು
  rationale: παραλαμβάνω ಇಲ್ಲಿ ತನ್ನೊಂದಿಗೆ ಕರೆದುಕೊಂಡು ಹೋಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕರೆದುಕೊಂಡು’ ಎಂಬುದು ಕೇವಲ ‘ತೆಗೆದುಕೊಂಡು’ಗಿಂತ ವ್ಯಕ್ತಿಗಳ ಕುರಿತು ಹೆಚ್ಚು ಸಹಜವಾಗಿದೆ.
- source_word: τὸ παιδίον
  choice: ಮಗುವನ್ನು
  rationale: παιδίον ಸಾಮಾನ್ಯವಾಗಿ ಮಗುವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ವಯಸ್ಸಿನ ಕುರಿತು ಮೂಲದಲ್ಲಿಲ್ಲದ ಹೆಚ್ಚಿನ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ಅದರ ತಾಯಿಯನ್ನು
  rationale: αὐτοῦ ಎಂಬ ಸರ್ವನಾಮವು ಸಹಜವಾಗಿ ಮಗುವನ್ನೇ ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಅದರ ತಾಯಿ’ ಈ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἰσῆλθεν
  choice: ಪ್ರವೇಶಿಸಿದನು
  rationale: εἰσέρχομαι ಎಂಬುದರ ‘ಒಳಗೆ ಪ್ರವೇಶಿಸು’ ಎಂಬ ದಿಕ್ಕುಸೂಚಕ ಅರ್ಥವನ್ನು ಗೌರವಯುತವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ಇಸ್ರಾಯೇಲ್ ದೇಶಕ್ಕೆ
  rationale: γῆ Ἰσραήλ ಎಂಬುದು ಭೌಗೋಳಿಕ-ರಾಷ್ಟ್ರೀಯ ಅರ್ಥದ ‘ಇಸ್ರಾಯೇಲ್ ದೇಶ’ವನ್ನು ಸೂಚಿಸುತ್ತದೆ; εἰς‌ನ ಗಮ್ಯದ ಅರ್ಥವನ್ನು ‘-ಕ್ಕೆ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
