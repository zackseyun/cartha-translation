id: MAT.2.20
reference: Matthew 2:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: kn
  text: 'ಹೀಗೆ ಹೇಳಿದನು: “ಎದ್ದು, ಮಗುವನ್ನೂ ಆ ಮಗುವಿನ ತಾಯಿಯನ್ನೂ ಕರೆದುಕೊಂಡು ಇಸ್ರಾಯೇಲ್ ದೇಶಕ್ಕೆ ಹೋಗು; ಏಕೆಂದರೆ ಮಗುವಿನ ಪ್ರಾಣವನ್ನು ತೆಗೆಯಲು ಯತ್ನಿಸುತ್ತಿದ್ದವರು ಸತ್ತಿದ್ದಾರೆ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: ಹೀಗೆ ಹೇಳಿದನು
  rationale: ಈ ವರ್ತಮಾನ ಕೃದಂತವು ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿರುವ ದೂತನ ಪ್ರತ್ಯಕ್ಷತೆಯೊಂದಿಗೆ ಅವನ ಮಾತನ್ನು ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಹೀಗೆ ಹೇಳಿದನು’ ಎಂಬುದು ಆ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Ἐγερθεὶς
  choice: ಎದ್ದು
  rationale: ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯೆಗೆ ಮುಂಚೆ ಬಂದಿರುವ ಈ ಕೃದಂತವು ‘ಎದ್ದು’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: παράλαβε
  choice: ಕರೆದುಕೊಂಡು
  rationale: ಇಲ್ಲಿ παραλαμβάνω ಎಂದರೆ ಒಬ್ಬರನ್ನು ತನ್ನೊಂದಿಗೆ ಕರೆದೊಯ್ಯುವುದು; ‘ಕರೆದುಕೊಂಡು’ ಎಂಬುದು ಆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: τὸ παιδίον
  choice: ಮಗುವನ್ನು
  rationale: παιδίον ಎಂಬುದಕ್ಕೆ ಸರಳವಾದ, ವಯಸ್ಸಿನ ಅನಗತ್ಯ ನಿರ್ದಿಷ್ಟತೆ ಸೇರಿಸದ ಸಮಾನಾರ್ಥಕ ಪದ ‘ಮಗು’.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ಅದರ ತಾಯಿಯನ್ನು
  rationale: αὐτοῦ ಎಂಬ ಸರ್ವನಾಮವು ಮಗುವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಮಗುವಿಗೆ ಸಂಬಂಧಿಸಿ ‘ಅದರ’ ಎನ್ನುವುದು ಸಹಜವೂ ಸ್ಪಷ್ಟವೂ ಆಗಿದೆ.
- source_word: πορεύου
  choice: ಹೋಗು
  rationale: ಈ ಮಧ್ಯಮರೂಪದ ಆಜ್ಞೆಯು ಇಲ್ಲಿ ಸರಳವಾಗಿ ಪ್ರಯಾಣ ಆರಂಭಿಸಿ ಹೋಗುವಂತೆ ಹೇಳುತ್ತದೆ; ‘ಹೋಗು’ ನೇರ ಮತ್ತು ಸಹಜ.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ಇಸ್ರಾಯೇಲ್ ದೇಶಕ್ಕೆ
  rationale: γῆ Ἰσραήλ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಇಸ್ರಾಯೇಲ್ ದೇಶಕ್ಕೆ’ ಅದರ ಭೌಗೋಳಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τεθνήκασιν
  choice: ಸತ್ತಿದ್ದಾರೆ
  rationale: ಪೂರ್ಣಕಾಲವು ಮರಣ ಹೊಂದಿದ ಪರಿಣಾಮದ ಇಂದಿನ ಸ್ಥಿತಿಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ; ಕನ್ನಡದ ‘ಸತ್ತಿದ್ದಾರೆ’ ಇದನ್ನು ಸಹಜವಾಗಿ ಹಿಡಿಯುತ್ತದೆ.
- source_word: οἱ ζητοῦντες
  choice: ಹುಡುಕುತ್ತಿದ್ದವರು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಕೃದಂತವು ಮಗುವಿನ ಪ್ರಾಣ ತೆಗೆಯುವ ಉದ್ದೇಶದಿಂದ ಹುಡುಕುತ್ತಿದ್ದವರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅಪೂರ್ಣ ಭೂತಕಾಲದ ರೂಪವು ಕಥನಸಂದರ್ಭಕ್ಕೆ ಸಹಜ.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: ಮಗುವಿನ ಪ್ರಾಣವನ್ನು ತೆಗೆಯಲು
  rationale: ‘ಯಾರೊಬ್ಬರ ψυχήಯನ್ನು ಹುಡುಕು’ ಎಂಬ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಇಲ್ಲಿ ಅವರನ್ನು ಕೊಲ್ಲಲು ಯತ್ನಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಪ್ರಾಣವನ್ನು ತೆಗೆಯಲು ಹುಡುಕು’ ಉದ್ದೇಶವನ್ನು ನೈಸರ್ಗಿಕವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮರಣದ ಬೆದರಿಕೆಯ ಸಂದರ್ಭದಲ್ಲಿ ψυχή ಪದದ ಅನುವಾದ
  choice: ಪ್ರಾಣ
  alternative: ಆತ್ಮ
  rationale: ಈ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ψυχή ಎಂದರೆ ವ್ಯಕ್ತಿಯ ಜೀವ ಅಥವಾ ಪ್ರಾಣ; ಅಮೂರ್ತ ಆತ್ಮವಲ್ಲ. ‘ಆತ್ಮ’ ಎಂದು ಅನುವಾದಿಸಿದರೆ ಈ ಸಂದರ್ಭದಲ್ಲಿಲ್ಲದ ತಾತ್ತ್ವಿಕ ಅರ್ಥವನ್ನು ಸೇರಿಸಿದಂತಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಗ್ರೀಕ್ ಕೃದಂತಗಳ ಸರಣಿಯನ್ನು ಕನ್ನಡದ ಸಹಜ ಕ್ರಿಯಾಕ್ರಮವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ; ವಾಕ್ಯದ ನೇರ ಆಜ್ಞಾರ್ಥಕ ಧ್ವನಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
