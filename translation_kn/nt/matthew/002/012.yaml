  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: kn
  text: ಹೆರೋದನ ಬಳಿಗೆ ಹಿಂದಿರುಗಬಾರದೆಂದು ಕನಸಿನಲ್ಲಿ ಎಚ್ಚರಿಕೆ ಪಡೆದ ಅವರು[a], ಬೇರೊಂದು ಮಾರ್ಗವಾಗಿ[b] ತಮ್ಮ ದೇಶಕ್ಕೆ ಹೊರಟುಹೋದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ದೈವಿಕ ಎಚ್ಚರಿಕೆ ಪಡೆದ ಅವರು.’ ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ರೂಪವು ಎಚ್ಚರಿಕೆ ದೇವರಿಂದ ಬಂದದ್ದೆಂದು ಸೂಚಿಸುತ್ತದೆ; ಆದರೆ ಈ ವಾಕ್ಯದಲ್ಲಿ ದೇವರನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸಿಲ್ಲ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಬೇರೊಂದು ದಾರಿಯಿಂದ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: ಎಚ್ಚರಿಕೆ ಪಡೆದ
  rationale: ಈ ಕರ್ಮಣಿ ಕೃದಂತವು ದೈವಿಕ ಮೂಲದಿಂದ ಬಂದ ಎಚ್ಚರಿಕೆ ಅಥವಾ ಸೂಚನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಎಚ್ಚರಿಕೆ ಪಡೆದ’ ಎಂಬುದು ಸಹಜ ಕನ್ನಡವಾಗಿದ್ದು, ವಾಕ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸದ ದೇವರನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: κατ’ ὄναρ
  choice: ಕನಸಿನಲ್ಲಿ
  rationale: ಮತ್ತಾಯನ ಬಳಕೆಯಲ್ಲಿ ಇದು ಕನಸಿನ ಮೂಲಕ ದೊರೆತ ಪ್ರಕಟಣೆ ಅಥವಾ ಎಚ್ಚರಿಕೆಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ನುಡಿಗಟ್ಟು.
- source_word: μὴ ἀνακάμψαι
  choice: ಹಿಂದಿರುಗಬಾರದೆಂದು
  rationale: μή ಸಹಿತ infinitive ಎಚ್ಚರಿಕೆಯ ವಿಷಯವನ್ನು ತಿಳಿಸುತ್ತದೆ; ಪ್ರಯಾಣದ ಸಂದರ್ಭದಲ್ಲಿ ‘ಹಿಂದಿರುಗಬಾರದೆಂದು’ ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: πρὸς Ἡρῴδην
  choice: ಹೆರೋದನ ಬಳಿಗೆ
  rationale: πρός + accusative ಇಲ್ಲಿ ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಕಡೆಗೆ ಅಥವಾ ಬಳಿಗೆ ಚಲಿಸುವ ಅರ್ಥ ನೀಡುತ್ತದೆ.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: ಬೇರೊಂದು ಮಾರ್ಗವಾಗಿ
  rationale: ὁδός ಇಲ್ಲಿ ಪ್ರಯಾಣದ ರಸ್ತೆ ಅಥವಾ ಮಾರ್ಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಬೇರೊಂದು ಮಾರ್ಗವಾಗಿ’ ಆ ನೇರ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἀνεχώρησαν
  choice: ಹೊರಟುಹೋದರು
  rationale: ἀναχωρέω ಇಲ್ಲಿ ಅಲ್ಲಿಂದ ನಿರ್ಗಮಿಸಿ ತೆರಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಹೊರಟುಹೋದರು’ ಪ್ರಯಾಣದ ಕಥನಕ್ಕೆ ಸಹಜವಾಗಿದೆ.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: ತಮ್ಮ ದೇಶಕ್ಕೆ
  rationale: χώρα ದೇಶ, ನಾಡು ಅಥವಾ ಪ್ರದೇಶವೆಂದಾಗಬಹುದು. ಜ್ಞಾನಿಗಳು ತಮ್ಮ ತಾಯ್ನಾಡಿಗೆ ಮರಳುತ್ತಿರುವ ಸಂದರ್ಭದಲ್ಲಿ ‘ತಮ್ಮ ದೇಶಕ್ಕೆ’ ಗಮ್ಯಸ್ಥಾನ ಮತ್ತು ಸ್ವಕೀಯತೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಎಚ್ಚರಿಕೆಯ ಅಪ್ರತ್ಯಕ್ಷ ದೈವಿಕ ಮೂಲ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಎಚ್ಚರಿಕೆ ಪಡೆದ’ ಎಂಬ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ದೇವರಿಂದ ಎಚ್ಚರಿಕೆ ಪಡೆದ’ ಅಥವಾ ‘ದೈವಿಕ ಎಚ್ಚರಿಕೆ ಪಡೆದ’
  rationale: ಸಂದರ್ಭ ಮತ್ತು χρηματισθέντες ಪದವು ದೈವಿಕ ಕರ್ತೃತ್ವವನ್ನು ಬಲವಾಗಿ ಸೂಚಿಸಿದರೂ, ಈ ವಾಕ್ಯವು ದೇವರನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಸೂಚನೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅಸ್ಪಷ್ಟ ಕರ್ತೃವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಹೆರೋದನ ಬಳಿಗೆ’ ಮತ್ತು ‘ತಮ್ಮ ದೇಶಕ್ಕೆ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿವೆ. ಮೂಲದ ಅಪ್ರತ್ಯಕ್ಷ ದೈವಿಕ ಕರ್ತೃತ್ವವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅತಿಸ್ಪಷ್ಟಗೊಳಿಸದೆ, ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
