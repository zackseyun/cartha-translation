id: MAT.2.1
reference: Matthew 2:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: kn
  text: ಅರಸನಾದ ಹೆರೋದನ ಕಾಲದಲ್ಲಿ ಯೇಸು ಯೂದಾಯದ ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ಹುಟ್ಟಿದ ಬಳಿಕ, ಇಗೋ, ಪೂರ್ವದೇಶಗಳಿಂದ ಜ್ಞಾನಿಗಳು[a] ಯೆರೂಸಲೇಮಿಗೆ ಬಂದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಮಾಗಿಗಳು.’ ಗ್ರೀಕ್ ಪದವು ಪೂರ್ವದೇಶಗಳ ವಿದ್ಯಾವಂತರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅವರು ಬಹುಶಃ ಜ್ಯೋತಿಷ್ಯ ಅಥವಾ ರಾಜದರ್ಬಾರದ ಜ್ಞಾನಕ್ಕೆ ಸಂಬಂಧಿಸಿದವರಾಗಿದ್ದರು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: ಯೇಸು ... ಹುಟ್ಟಿದ ಬಳಿಕ
  rationale: ಕರ್ತೃವಿಭಕ್ತಿಯ ಸ್ವತಂತ್ರ ಪದಗುಚ್ಛವು ಮುಖ್ಯ ಘಟನೆಯ ಹಿಂದಿನ ಹಿನ್ನೆಲೆ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಹುಟ್ಟಿದ ಬಳಿಕ’ ಅದರ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ. δέಯ ಸೌಮ್ಯ ಕಥನ ಸಂಕ್ರಮಣವನ್ನು ಪ್ರತ್ಯೇಕ ಪದದಿಂದ ಅನಗತ್ಯವಾಗಿ ಹೆಚ್ಚಿಸಲಿಲ್ಲ.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: ಯೂದಾಯದ ಬೇತ್ಲೆಹೇಮಿನಲ್ಲಿ
  rationale: ಸ್ಥಳನಾಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ರೂಪದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಿ, τῆς Ἰουδαίας ಅನ್ನು ಈ ಬೇತ್ಲೆಹೇಮನ್ನು ಗುರುತಿಸುವ ಸಂಬಂಧವಾಚಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: ಅರಸನಾದ ಹೆರೋದನ ಕಾಲದಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿನ ಐತಿಹಾಸಿಕ ಕಾಲಸೂಚನೆಯನ್ನು ಆಧುನಿಕ ಕನ್ನಡದ ಸಹಜ ರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ; ‘ಅರಸನಾದ’ ಎಂಬುದು τοῦ βασιλέως ಎಂಬ ಸಮಾನಾಧಿಕರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಮುಂದಿನ ಅನಿರೀಕ್ಷಿತ ಪ್ರವೇಶದ ಕಡೆ ಗಮನ ಸೆಳೆಯುವ ಗುರುತಿಸಲ್ಪಟ್ಟ ಕಥನ ಸೂಚಕವಾಗಿ ἰδούಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: μάγοι
  choice: ಜ್ಞಾನಿಗಳು
  rationale: ಪೂರ್ವದೇಶದ ವಿದ್ಯಾವಂತರು, ಜ್ಯೋತಿಷಿಗಳು ಅಥವಾ ಆಸ್ಥಾನ ಪರಿಣತರು ಎಂಬ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ರಾಜರು’ ಅಥವಾ ಅವರ ಸಂಖ್ಯೆಯಂತಹ ನಂತರದ ಪರಂಪರೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ. ಹೆಚ್ಚು ತಾಂತ್ರಿಕ ಮಾಹಿತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἀπὸ ἀνατολῶν
  choice: ಪೂರ್ವದೇಶಗಳಿಂದ
  rationale: ಬಹುವಚನ ರೂಪವು ಪೂರ್ವದ ಪ್ರದೇಶಗಳನ್ನು ಸೂಚಿಸಬಹುದಾದುದರಿಂದ, ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಮೂಲದ ಸಂಖ್ಯಾಭಾವಕ್ಕೆ ಸಮೀಪವಾಗಿಯೂ ‘ಪೂರ್ವದೇಶಗಳಿಂದ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: ಯೆರೂಸಲೇಮಿಗೆ ಬಂದರು
  rationale: ಕ್ರಿಯಾಪದವು ಒಂದು ಸ್ಥಳಕ್ಕೆ ಬಂದು ತಲುಪುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಗಮ್ಯಸ್ಥಾನವನ್ನು ‘-ಗೆ’ ವಿಭಕ್ತಿಯಿಂದ ನೀಡುವುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜ.
theological_decisions:
- issue: μάγοι ಎಂಬ ಪದವನ್ನು ನಂತರದ ಪರಂಪರೆಯ ಅಂಶಗಳನ್ನು ಸೇರಿಸದೆ ಅನುವಾದಿಸುವುದು
  choice: ಜ್ಞಾನಿಗಳು
  alternative: ಮಾಗಿಗಳು / ಜ್ಯೋತಿಷಿಗಳು
  rationale: ಮೂಲಪದವು ಪೂರ್ವದ ವಿದ್ಯಾವಂತ ಅಥವಾ ಜ್ಯೋತಿಷ್ಯಸಂಬಂಧಿತ ಪರಿಣತರನ್ನು ಸೂಚಿಸಬಹುದು, ಆದರೆ ಅವರು ರಾಜರು ಎಂದಾಗಲಿ, ಮೂವರು ಎಂದಾಗಲಿ ಹೇಳುವುದಿಲ್ಲ. ‘ಜ್ಞಾನಿಗಳು’ ಪಾತ್ರವನ್ನು ಸುಲಭವಾಗಿ ತಿಳಿಸಿ ಅತಿನಿರ್ದಿಷ್ಟತೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ; ಪದದ ತಾಂತ್ರಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಗೌರವಭರಿತವಾದ ಕಥನಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬ ಗುರುತಿಸಲ್ಪಟ್ಟ ಗಮನಸೂಚಕವನ್ನು ಮೂಲದ ಕಥನ ಬಲಕ್ಕಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಉಳಿದ ವಾಕ್ಯರಚನೆಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಮಾಡಲಾಗಿದೆ.
