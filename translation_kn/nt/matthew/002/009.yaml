id: MAT.2.9
reference: Matthew 2:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: kn
  text: ಅವರು ಅರಸನ ಮಾತನ್ನು ಕೇಳಿದ ನಂತರ ಹೊರಟರು. ಇಗೋ, ಅವರು ಪೂರ್ವದಲ್ಲಿ[a] ಕಂಡಿದ್ದ ನಕ್ಷತ್ರವು ಅವರ ಮುಂದೆ ಸಾಗುತ್ತಾ, ಮಗು ಇದ್ದ ಸ್ಥಳದ ಮೇಲೆ ಬಂದು ನಿಲ್ಲುವವರೆಗೆ ಅವರನ್ನು ಮುನ್ನಡೆಸಿತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅದರ ಉದಯದ ಸಮಯದಲ್ಲಿ.” ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಪೂರ್ವದ ಪ್ರದೇಶ ಅಥವಾ ದಿಕ್ಕನ್ನು ಸೂಚಿಸಬಹುದು; ಇಲ್ಲವೆ ನಕ್ಷತ್ರದ ಉದಯವನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: ಅರಸನ ಮಾತನ್ನು ಕೇಳಿದ ನಂತರ
  rationale: ἀκούω ಜೊತೆಯಲ್ಲಿರುವ ಷಷ್ಠೀ ವಿಭಕ್ತಿ ಕೇಳಲ್ಪಟ್ಟ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸಬಹುದು. ಕನ್ನಡದಲ್ಲಿ ‘ಅರಸನನ್ನು ಕೇಳಿದ ನಂತರ’ ಎಂಬುದು ಅವನ ವಿನಂತಿಗೆ ಕಿವಿಗೊಟ್ಟರು ಎಂಬರ್ಥ ಕೊಡಬಹುದಾದ್ದರಿಂದ, ಅವನು ಹೇಳಿದ ಮಾತನ್ನು ಕೇಳಿದರು ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ‘ಹೆರೋದನು’ ಎಂದು ಸಂದರ್ಭದಿಂದ ಹೆಸರನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: ἐπορεύθησαν
  choice: ಹೊರಟರು
  rationale: ಅರಸನ ಬಳಿಯಿಂದ ಅವರ ಮುಂದಿನ ಪ್ರಯಾಣ ಆರಂಭವಾದ ಕಥನ ಚಲನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಹಠಾತ್ ಗಮನ ಸೆಳೆಯುವ ಗ್ರೀಕ್ ಕಥನ ಸೂಚಕದ ಜೀವಂತಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ ἀστὴρ ὃν εἶδον
  choice: ಅವರು ... ಕಂಡಿದ್ದ ನಕ್ಷತ್ರವು
  rationale: ಈ ಸಂದರ್ಭಕ್ಕಿಂತ ಮುಂಚೆ ಅವರು ನಕ್ಷತ್ರವನ್ನು ಕಂಡಿದ್ದರು ಎಂಬ ಕಾಲಕ್ರಮವನ್ನು ‘ಕಂಡಿದ್ದ’ ಸಹಜವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῇ ἀνατολῇ
  choice: ಪೂರ್ವದಲ್ಲಿ
  rationale: ಭೌಗೋಳಿಕ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ನಕ್ಷತ್ರದ ಉದಯವನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: προῆγεν αὐτούς
  choice: ಅವರ ಮುಂದೆ ಮುಂದೆ ಸಾಗುತ್ತಾ ... ಅವರನ್ನು ಮುನ್ನಡೆಸಿತು
  rationale: προάγω ಪದದಲ್ಲಿರುವ ಮುಂದೆ ಸಾಗುವುದು ಮತ್ತು ಮುನ್ನಡೆಸುವುದು ಎಂಬ ಎರಡೂ ನುಡಿಸೂಚನೆಗಳನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಅದರ ವಿಧಾನವನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿವರಿಸುವುದಿಲ್ಲ.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: ಬಂದು ನಿಲ್ಲುವವರೆಗೆ
  rationale: ಬಂದು ತಲುಪಿದ ನಂತರ ನಿಂತಿತು ಎಂಬ ಗ್ರೀಕ್ ಕ್ರಿಯಾಕ್ರಮವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: ಮಗು ಇದ್ದ ಸ್ಥಳದ ಮೇಲೆ
  rationale: ಮಗುವಿದ್ದ ಸ್ಥಳದ ಮೇಲಿನ ಸ್ಥಾನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; παιδίον ಅನ್ನು ಹೆಚ್ಚುವರಿ ವಯಸ್ಸಿನ ಒತ್ತಿಲ್ಲದೆ ‘ಮಗು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ನಕ್ಷತ್ರದ ಕಥನದಲ್ಲಿ ἐν τῇ ἀνατολῇ ಎಂಬುದರ ಅರ್ಥ
  choice: ಪೂರ್ವದಲ್ಲಿ
  alternative: ಅದು ಉದಯಿಸಿದಾಗ
  rationale: ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಪೂರ್ವದ ಪ್ರದೇಶ/ದಿಕ್ಕನ್ನಾಗಲಿ, ನಕ್ಷತ್ರದ ಉದಯವನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು. ಪದ್ಯವೇ ಈ ಪ್ರಶ್ನೆಯನ್ನು ನಿರ್ಣಯಿಸದ ಕಾರಣ, ಪರಿಚಿತ ಭೌಗೋಳಿಕ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇಟ್ಟು, ಖಗೋಳಾರ್ಥದ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬ ಗಮನಾಕರ್ಷಕ ಸೂಚಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಅರಸ’ ಎಂಬ ಪದವು ಸೊಗಸಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ಹೆರೋದ’ ಹೆಸರನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
