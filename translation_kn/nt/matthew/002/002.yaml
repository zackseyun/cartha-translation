id: MAT.2.2
reference: Matthew 2:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: kn
  text: “ಯೆಹೂದ್ಯರ ಅರಸನಾಗಿ ಹುಟ್ಟಿದವನು ಎಲ್ಲಿದ್ದಾನೆ? ಏಕೆಂದರೆ ನಾವು ಅವನ ನಕ್ಷತ್ರವನ್ನು ಪೂರ್ವದಲ್ಲಿ[a] ಕಂಡು, ಅವನಿಗೆ ಅಡ್ಡಬಿದ್ದು ಗೌರವ ಸಲ್ಲಿಸಲು[b] ಬಂದಿದ್ದೇವೆ” ಎಂದು ಅವರು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಅದರ ಉದಯದಲ್ಲಿ.” ಗ್ರೀಕ್ ಪದಗುಚ್ಛವು “ಪೂರ್ವದಲ್ಲಿ” ಎಂದಾಗಲಿ, ನಕ್ಷತ್ರದ ಉದಯವನ್ನು ಸೂಚಿಸುವಂತಾಗಲಿ ಅರ್ಥವಾಗಬಹುದು.
    reason: alternative_reading
  - marker: b
    text: ಅಥವಾ “ಅವನನ್ನು ಆರಾಧಿಸಲು.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ರಾಜನಿಗೆ ಅಡ್ಡಬಿದ್ದು ಗೌರವ ಸಲ್ಲಿಸುವುದನ್ನಾಗಲಿ, ಆರಾಧಿಸುವುದನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: ಎಂದು ಕೇಳಿದರು
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಜ್ಞಾನಿಗಳು ಉಚ್ಚರಿಸಿದ ಪ್ರಶ್ನೆಯನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಕನ್ನಡದ ನಿರೂಪಣೆಯಲ್ಲಿ ‘ಎಂದು ಕೇಳಿದರು’ ಎಂಬುದು ಮಾತಿನ ಪ್ರಶ್ನಾರ್ಥಕ ಸ್ವರೂಪವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Ποῦ ἐστιν
  choice: ಎಲ್ಲಿದ್ದಾನೆ?
  rationale: ಇದು ನೇರವಾದ ಸ್ಥಳಸೂಚಕ ಪ್ರಶ್ನೆ; ಗ್ರೀಕ್‌ನ ಸರಳತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ τεχθεὶς
  choice: ಹುಟ್ಟಿರುವವನು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಭೂತಕಾಲದ ಕರ್ಮಣಿ ಕೃದಂತದ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ‘ನವಜಾತ’ ಎಂಬ ಮೂಲದಲ್ಲಿಲ್ಲದ ವಯಸ್ಸಿನ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: ಯೆಹೂದ್ಯರ ಅರಸನಾಗಿ
  rationale: ರಾಜಪದವಿಯ ರಾಜಕೀಯ ಮತ್ತು ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; τεχθεὶς ಜೊತೆಗೆ ‘ಅರಸನಾಗಿ ಹುಟ್ಟಿರುವವನು’ ಎಂಬ ರಚನೆ ಗ್ರೀಕ್‌ನ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: εἴδομεν γὰρ
  choice: ಏಕೆಂದರೆ ನಾವು … ಕಂಡು
  rationale: γάρ ಪ್ರಶ್ನೆಗೆ ಕಾರಣವನ್ನು ನೀಡುತ್ತದೆ. εἴδομεν ಅನ್ನು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಪೂರ್ಣಗೊಂಡ ಕ್ರಿಯೆಯಾಗಿ ‘ಕಂಡು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: ಅವನ ನಕ್ಷತ್ರವನ್ನು
  rationale: ಸ್ವಾಮ್ಯಸೂಚಕ ಸರ್ವನಾಮವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಆ ಆಕಾಶಚಿಹ್ನೆಯ ನಿಖರ ಸ್ವರೂಪವನ್ನು ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: ἐν τῇ ἀνατολῇ
  choice: ಪೂರ್ವದಲ್ಲಿ
  rationale: ἀνατολή ದಿಕ್ಕಾಗಿ ‘ಪೂರ್ವ’ ಎಂದೂ, ಖಗೋಳಾರ್ಥದಲ್ಲಿ ‘ಉದಯ’ ಎಂದೂ ಅರ್ಥವಾಗಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಪರಂಪರೆಯ ಹಾಗೂ ಸಂದರ್ಭೋಚಿತ ದಿಕ್ಕಿನ ಅರ್ಥವನ್ನು ಇಟ್ಟು, ನಿಜವಾದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἤλθομεν
  choice: ಬಂದಿದ್ದೇವೆ
  rationale: ಮಾತನಾಡುವ ವೇಳೆಗೆ ಪೂರ್ಣಗೊಂಡಿದ್ದರೂ ಈಗಿನ ಸಂದರ್ಭಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಆಗಮನವನ್ನು ಕನ್ನಡದ ಪೂರ್ಣಕಾಲ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: προσκυνῆσαι αὐτῷ
  choice: ಅವನಿಗೆ ಅಡ್ಡಬಿದ್ದು ಗೌರವ ಸಲ್ಲಿಸಲು
  rationale: προσκυνέω ದೇಹಬಾಗಿ ಅಥವಾ ಅಡ್ಡಬಿದ್ದು ರಾಜನಿಗೆ ಗೌರವ ಸಲ್ಲಿಸುವುದರಿಂದ ಹಿಡಿದು ಆರಾಧಿಸುವವರೆಗಿನ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ. ಈ ರೂಪವು ದೈಹಿಕ ಭಂಗಿ ಮತ್ತು ರಾಜಗೌರವವನ್ನು ವ್ಯಕ್ತಪಡಿಸಿ, ದೈವಾರಾಧನೆಯ ಅರ್ಥವನ್ನು ಮುಂಚಿತವಾಗಿ ಏಕೈಕ ಅರ್ಥವೆಂದು ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಬಾಲ ಯೇಸುವಿನ ಸಂಬಂಧದಲ್ಲಿ προσκυνῆσαι ಪದದ ಅನುವಾದ
  choice: ಅವನಿಗೆ ಅಡ್ಡಬಿದ್ದು ಗೌರವ ಸಲ್ಲಿಸಲು
  alternative: ಅವನನ್ನು ಆರಾಧಿಸಲು
  rationale: ಮಾತನಾಡುವವರು ‘ಯೆಹೂದ್ಯರ ಅರಸನಾಗಿ’ ಹುಟ್ಟಿದವನನ್ನು ಹುಡುಕುತ್ತಿರುವುದರಿಂದ ತಕ್ಷಣದ ಸಂದರ್ಭವು ರಾಜನಿಗೆ ಸಲ್ಲಿಸುವ ಗೌರವವನ್ನು ಮುನ್ನೆಲೆಗೆ ತರುತ್ತದೆ. ಆದರೂ ಈ ಕ್ರಿಯಾಪದವು ಆರಾಧನೆಯ ಅರ್ಥವನ್ನೂ ಹೊಂದಬಹುದು; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ರಾಜಗೌರವವನ್ನು ವ್ಯಕ್ತಪಡಿಸಿ, ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಘನತೆಯುಳ್ಳ ನಿರೂಪಣೆ ಬಳಸಲಾಗಿದೆ. ‘ಅರಸ’ ಎಂಬ ಪದವು ರಾಜಪದವಿಯ ಶಾಸ್ತ್ರೀಯ ಗೌರವವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಅಡ್ಡಬಿದ್ದು ಗೌರವ ಸಲ್ಲಿಸಲು’ ಎಂಬುದು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಕ್ರಿಯೆಯ ದೃಶ್ಯ ಮತ್ತು ರಾಜಗೌರವ ಎರಡನ್ನೂ ತಿಳಿಸುತ್ತದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಪದಗುಚ್ಛಗಳ ತಕ್ಷಣವೇ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇವೆ.
