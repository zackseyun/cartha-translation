revisions:
- from: ಅವನು ಬಂದು ನಜರೇತ್ ಎಂಬ ಪಟ್ಟಣದಲ್ಲಿ ವಾಸಿಸಿದನು. ಹೀಗೆ, “ಅವನು ನಜರೇಯನು[a] ಎಂದು ಕರೆಯಲ್ಪಡುವನು” ಎಂದು ಪ್ರವಾದಿಗಳ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತಾಯಿತು.
  to: “ಅವನು ನಜರೇತಿನವನು[a] ಎಂದು ಕರೆಯಲ್ಪಡುವನು” ಎಂದು ಪ್ರವಾದಿಗಳ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತೆ, ಅವನು ಬಂದು ನಜರೇತ್ ಎಂಬ ಪಟ್ಟಣದಲ್ಲಿ ವಾಸಿಸಿದನು.
  rationale: 'The revision changes only two matters: it restores the purpose/fulfillment force of ὅπως πληρωθῇ with ‘ನೆರವೇರುವಂತೆ,’ and it uses the clearer modern Kannada designation ‘ನಜರೇತಿನವನು.’ The quotation is placed before the fulfillment clause, a natural Kannada arrangement that retains the Greek sense. The footnote continues to avoid identifying a speculative single prophetic source.'
  reviewer_model: gpt-5.6-terra
