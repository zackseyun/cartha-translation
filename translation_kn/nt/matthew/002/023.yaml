id: MAT.2.23
reference: Matthew 2:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: kn
  text: “ಅವನು ನಜರೇತಿನವನು[a] ಎಂದು ಕರೆಯಲ್ಪಡುವನು” ಎಂದು ಪ್ರವಾದಿಗಳ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತೆ, ಅವನು ಬಂದು ನಜರೇತ್ ಎಂಬ ಪಟ್ಟಣದಲ್ಲಿ ವಾಸಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ನಜೋರಾಯನು.” “ಅವನು ನಜರೇತಿನವನು ಎಂದು ಕರೆಯಲ್ಪಡುವನು” ಎಂಬ ಮಾತಿನ ನಿಖರವಾದ ಪ್ರವಾದನಾ ಹಿನ್ನೆಲೆ ವಿವಾದಿತವಾಗಿದೆ. ಮತ್ತಾಯನು ಒಬ್ಬ ನಿರ್ದಿಷ್ಟ ಪ್ರವಾದಿಯ ಮಾತನ್ನು ಉಲ್ಲೇಖಿಸುವ ಬದಲು, ಪ್ರವಾದಿಗಳಲ್ಲಿರುವ ಹಲವು ವಿಷಯಗಳ ಸಾರಾಂಶವನ್ನು ಹೇಳುತ್ತಿರಬಹುದು.
    reason: Ναζωραῖος ಪದಕ್ಕೆ ಇರುವ ಪರ್ಯಾಯ ರೂಪವನ್ನೂ, ಈ ಪೂರ್ಣತೆ-ವಾಕ್ಯದ ಪ್ರವಾದನಾ ಹಿನ್ನೆಲೆಯ ಕುರಿತ ನಿಜವಾದ ಅನಿಶ್ಚಿತತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: ἐλθὼν
  choice: ಅವನು ಬಂದು
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಭೂತಕಾಲದ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ಬಂದು’ ಎಂಬ ಪೂರ್ವಕಾಲಿಕ ಕ್ರಿಯಾರೂಪದಿಂದ ನೀಡಲಾಗಿದೆ.
- source_word: κατῴκησεν
  choice: ವಾಸಿಸಿದನು
  rationale: ಆ ಸ್ಥಳದಲ್ಲಿ ನೆಲೆಸಿ ಜೀವಿಸಿದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ವಾಸಿಸಿದನು’ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆಗಿದೆ.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: ನಜರೇತ್ ಎಂಬ ಪಟ್ಟಣದಲ್ಲಿ
  rationale: κατοικέω ಜೊತೆಯಲ್ಲಿರುವ εἰς ಅನ್ನು ಕನ್ನಡದ ಸ್ಥಳವಾಚಕ ಬಳಕೆಗೆ ತಕ್ಕಂತೆ ‘ಪಟ್ಟಣದಲ್ಲಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. πόλιςಗೆ ಇಲ್ಲಿ ‘ಪಟ್ಟಣ’ ಎಂಬುದು ನಜರೇತಿನ ಸ್ವರೂಪಕ್ಕೂ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಬಳಕೆಗೂ ಹೊಂದಿಕೆಯಾಗುತ್ತದೆ.
- source_word: ὅπως πληρωθῇ
  choice: ಹೀಗೆ … ನೆರವೇರುವಂತಾಯಿತು
  rationale: ὅπως ಸೂಚಿಸುವ ಉದ್ದೇಶ/ಫಲದ ಸಂಬಂಧವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ಅತಿಯಾಗಿ ಕೃತಕವಾಗದ ಪೂರ್ಣತೆ-ಸೂತ್ರವನ್ನು ಬಳಸಲಾಗಿದೆ; ಇದು ಸಂಬಂಧವನ್ನು ಒಂದೇ ದಿಕ್ಕಿನಲ್ಲಿ ಕಟ್ಟುನಿಟ್ಟಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: ಪ್ರವಾದಿಗಳ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮಧ್ಯಸ್ಥ ಸಾಧನಾರ್ಥವನ್ನು ‘ಮೂಲಕ’ ಉಳಿಸುತ್ತದೆ; ಪ್ರವಾದಿಗಳು ಬಹುವಚನದಲ್ಲಿರುವುದನ್ನೂ ಯಥಾವತ್ತಾಗಿ ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
- source_word: Ναζωραῖος
  choice: ನಜರೇಯನು
  rationale: ನಜರೇತಿಗೆ ಸಂಬಂಧಿಸಿದ ವ್ಯಕ್ತಿಯ ಬಿರುದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಕನ್ನಡದಲ್ಲಿ ಹೆಸರಿನಂತೆಯೇ ಗುರುತಿಸಬಹುದಾಗಿ ನೀಡುತ್ತದೆ; ‘ನಾಜೀರನು’ ಎಂಬ ವ್ರತಸಂಬಂಧಿ ಬೇರೆ ಪದದೊಂದಿಗೆ ಗೊಂದಲವಾಗದಂತೆ ಮಾಡುತ್ತದೆ.
- source_word: κληθήσεται
  choice: ಕರೆಯಲ್ಪಡುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ ಪ್ರವಾದನಾ ಶೈಲಿಯನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
theological_decisions:
- issue: ನಿಖರವಾದ ಒಂದೇ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಉಲ್ಲೇಖವಿಲ್ಲದ ಪೂರ್ಣತೆ-ವಾಕ್ಯದ ಸ್ವರೂಪ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಪ್ರವಾದಿಗಳ ಮೂಲಕ’ ಎಂಬ ಬಹುವಚನವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಿ, ನಿರ್ದಿಷ್ಟ ಪ್ರವಾದನಾ ವಾಕ್ಯವನ್ನು ಗುರುತಿಸದೆ ಇರುವುದು.
  alternative: ಯೆಶಾಯ 11:1ರ ‘ಚಿಗುರು’ ಪದಕ್ಕೆ ನೇರ ಸೂಚನೆ ಎಂದು ಗುರುತಿಸುವುದು, ಅಥವಾ ಮೆಸ್ಸೀಯನ ತಿರಸ್ಕೃತ ಸ್ಥಿತಿಯ ಕುರಿತ ಪ್ರವಾದನಾ ವಿಷಯಗಳ ಸಾರಾಂಶವೆಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಪ್ರವಾದಿಗಳನ್ನು ಬಹುವಚನದಲ್ಲಿ ಹೇಳುತ್ತದೆ ಮತ್ತು ಯಾವುದೇ ಒಬ್ಬ ಪ್ರವಾದಿಯ ಹೆಸರನ್ನೂ ನೀಡುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ವಿವಾದಿತ ಹಿನ್ನೆಲೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ನಿರ್ಣಯಿಸದೆ, ಮತ್ತಾಯನ ಮಾತನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
- issue: Ναζωραῖος ಪದದ ಅರ್ಥ
  choice: ನಜರೇಯನು
  alternative: ನಜೋರಾಯನು; ನಜರೇತಿನವನು; ನಾಜೀರನು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಇದು ನಜರೇತಿನೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದ ಬಿರುದು. ‘ನಾಜೀರನು’ ಎಂದರೆ ವಿಭಿನ್ನವಾದ ವ್ರತಸಂಬಂಧಿ ಪದವಾಗುವುದರಿಂದ ಅದನ್ನು ತಿರಸ್ಕರಿಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ರೂಪಕ್ಕೆ ಇನ್ನಷ್ಟು ಸಮೀಪವಾದ ಲಿಪ್ಯಂತರವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ನಿರೂಪಣೆ ಬಳಸಲಾಗಿದೆ. ‘ಪಟ್ಟಣ’, ‘ವಾಸಿಸಿದನು’, ‘ಮೂಲಕ’ ಎಂಬ ಪದಗಳು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿದ್ದು ಮೂಲದ ಕ್ರಮ, ಮಧ್ಯಸ್ಥ ಕಾರ್ಯ ಮತ್ತು ಪ್ರವಾದನಾ ಶೈಲಿಯನ್ನು ಉಳಿಸುತ್ತವೆ.
