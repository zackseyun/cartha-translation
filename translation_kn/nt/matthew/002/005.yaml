id: MAT.2.5
reference: Matthew 2:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: kn
  text: ಅವರು ಅವನಿಗೆ, “ಯೂದಾಯದ ಬೇತ್ಲೆಹೇಮಿನಲ್ಲಿ; ಏಕೆಂದರೆ ಪ್ರವಾದಿಯ ಮೂಲಕ ಹೀಗೆ ಬರೆಯಲ್ಪಟ್ಟಿದೆ[a]:” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಬರೆಯಲಾಗಿದೆ.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ರೂಪವಿದ್ದು, ಇದು ಪವಿತ್ರ ಗ್ರಂಥವನ್ನು ಉಲ್ಲೇಖಿಸುವ ಸಾಮಾನ್ಯ ಸೂತ್ರವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ಅವರು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಗ್ರೀಕ್ ನಿರ್ದಿಷ್ಟ ಲೇಖನವು ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಮುಖ್ಯಯಾಜಕರನ್ನೂ ಶಾಸ್ತ್ರಿಗಳನ್ನೂ ಸೂಚಿಸುತ್ತದೆ. δέ ಇಲ್ಲಿ ಸೌಮ್ಯ ಸಂಪರ್ಕಕವಾಗಿದ್ದು, ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಪದವಿಲ್ಲದಿದ್ದರೂ ವಾಕ್ಯದ ಹರಿವು ಸಹಜವಾಗಿದೆ.
- source_word: εἶπαν αὐτῷ
  choice: ಅವನಿಗೆ … ಎಂದು ಹೇಳಿದರು
  rationale: λέγω ಮತ್ತು ಪರೋಕ್ಷ ಕರ್ಮ αὐτῷ ಎಂಬ ಸರಳ ವರದಿ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದ ನೇರ ಉಲ್ಲೇಖ ವಿನ್ಯಾಸದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: Ἐν Βηθλέεμ
  choice: ಬೇತ್ಲೆಹೇಮಿನಲ್ಲಿ
  rationale: ἐν ಸ್ಥಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ಸ್ಥಳವಾಚಕ ವಿಭಕ್ತಿ ಅದನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τῆς Ἰουδαίας
  choice: ಯೂದಾಯದ
  rationale: ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಯಾವ ಬೇತ್ಲೆಹೇಮ್ ಎಂಬುದನ್ನು ಗುರುತಿಸುತ್ತದೆ. ಗ್ರೀಕ್ ರಚನೆಯ ಗುರುತಿಸುವ ಬಲವನ್ನು ಕನ್ನಡದ ಸಂಬಂಧವಾಚಕ ರೂಪ ಉಳಿಸುತ್ತದೆ.
- source_word: οὕτως γὰρ
  choice: ಏಕೆಂದರೆ … ಹೀಗೆ
  rationale: γάρ ಉತ್ತರದ ಆಧಾರವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ; οὕτως ಮುಂದಿನ ಪ್ರವಾದನಾ ಉಲ್ಲೇಖದ ಕಡೆ ಸೂಚಿಸುತ್ತದೆ.
- source_word: γέγραπται
  choice: ಬರೆಯಲ್ಪಟ್ಟಿದೆ
  rationale: ಗ್ರೀಕ್ ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ರೂಪವು ಹಿಂದೆಯೇ ಬರೆಯಲ್ಪಟ್ಟು ಈಗಲೂ ಪ್ರಾಮಾಣಿಕವಾಗಿ ನಿಂತಿರುವ ಶಾಸ್ತ್ರೋಕ್ತಿಯ ಅರ್ಥವನ್ನು ಕೊಡುತ್ತದೆ. ಕನ್ನಡದ ಈ ರೂಪವು ‘ಬರೆಯಲಾಗಿದೆ’ಗಿಂತ ಸ್ವಲ್ಪ ಅಧಿಕ ಶಾಸ್ತ್ರೀಯವಾದರೂ ಸ್ಪಷ್ಟ ಮತ್ತು ಗೌರವಯುತವಾಗಿದೆ.
- source_word: διὰ τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯ ಮೂಲಕ
  rationale: διά + ಷಷ್ಠೀ ಮಧ್ಯಸ್ಥ ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮೂಲಕ’ ಎಂಬುದು ಪ್ರವಾದಿಯನ್ನು ಸಂದೇಶದ ಮಾನವ ಮಧ್ಯಸ್ಥನಾಗಿ ತೋರಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪ್ರವಾದಿಯ ಮಧ್ಯಸ್ಥಿಕೆಯ ಸೂತ್ರ
  choice: ಪ್ರವಾದಿಯ ಮೂಲಕ
  alternative: ಪ್ರವಾದಿಯಿಂದ
  rationale: ‘ಮೂಲಕ’ ಎಂಬುದು ಗ್ರೀಕ್ διά + ಷಷ್ಠೀ ರೂಪವನ್ನು ನಿಕಟವಾಗಿ ಉಳಿಸಿ, ಪ್ರವಾದಿಯು ಸಂದೇಶದ ಮಧ್ಯಸ್ಥನೆಂಬ ಅರ್ಥಕ್ಕೆ ಅವಕಾಶ ಕೊಡುತ್ತದೆ; ದೇವರ ಅಂತಿಮ ಕರ್ತೃತ್ವವನ್ನು ಅನುವಾದದಲ್ಲೇ ಹೆಚ್ಚುವರಿಯಾಗಿ ಹೇಳುವುದಿಲ್ಲ.
- issue: γέγραπται ಎಂಬ ಶಾಸ್ತ್ರೋಕ್ತಿ ಸೂತ್ರದ ಕಾಲಾರ್ಥ
  choice: ಬರೆಯಲ್ಪಟ್ಟಿದೆ
  alternative: ಬರೆದಿದೆ / ಬರೆಯಲಾಗಿದೆ
  rationale: ಈ ಆಯ್ಕೆ ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ಸ್ವರೂಪವನ್ನೂ ಈಗಲೂ ಅನ್ವಯಿಸುವ ಲಿಖಿತ ಸಾಕ್ಷಿಯ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಶಾಸ್ತ್ರಪ್ರೇರಣಾ ಸಿದ್ಧಾಂತವನ್ನು ಹೆಚ್ಚಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಗೌರವಯುತವಾದ ಧಾಟಿ. ‘ಯೂದಾಯದ ಬೇತ್ಲೆಹೇಮಿನಲ್ಲಿ’ ಎಂಬ ರೂಪವು ಗ್ರೀಕ್ ಷಷ್ಠೀ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ. ಮುಂದಿನ ವಚನದ ಉಲ್ಲೇಖಕ್ಕೆ ದ್ವಿಬಿಂದು ಇಡಲಾಗಿದೆ; ಸೆಮಿಕೋಲನ್ ಉತ್ತರ ಮತ್ತು ಅದರ ಶಾಸ್ತ್ರೀಯ ಆಧಾರದ ನಡುವಿನ ಸ್ಪಷ್ಟ ವಿರಾಮವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
