id: MAT.2.3
reference: Matthew 2:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: kn
  text: ರಾಜ ಹೆರೋದನು ಇದನ್ನು ಕೇಳಿದಾಗ[a] ಕಳವಳಗೊಂಡನು; ಅವನೊಂದಿಗೆ ಇಡೀ ಯೆರೂಸಲೇಮೂ ಕಳವಳಗೊಂಡಿತು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಇದನ್ನು ಕೇಳಿ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಇಡೀ ಯೆರೂಸಲೇಮು’ ಎಂಬಲ್ಲಿ ನಗರನಾಮವು ಅದರ ನಿವಾಸಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಇದು ನಗರದ ಸಾಮೂಹಿಕ ಆತಂಕವನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಅಥವಾ ಅತಿಶಯೋಕ್ತಿಯಾಗಿ ವರ್ಣಿಸಿರಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ಇದನ್ನು ಕೇಳಿದಾಗ
  rationale: ಕೃದಂತವು ಇಲ್ಲಿ ಕಾಲಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಜ್ಞಾನಿಗಳ ವರದಿಯನ್ನು ಸೂಚಿಸಲು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ಇದನ್ನು’ ಎಂಬ ಸೂಚಿತ ಕರ್ಮವನ್ನು ಸೇರಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದೆ ಕಾಲವಾಕ್ಯದಲ್ಲಿ ಒಳಗೊಳ್ಳಿಸಲಾಗಿದೆ
  rationale: δέ ಇಲ್ಲಿ ಸೌಮ್ಯವಾದ ಸಂಕ್ರಮಣ ಸೂಚಕ. ἀκούσας ಜೊತೆಗೆ ಅದರ ಪ್ರವಾಹವನ್ನು ‘ಕೇಳಿದಾಗ’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ರಚನೆಯೇ ಸಮರ್ಪಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ರಾಜ ಹೆರೋದನು
  rationale: ಪದವಿಯನ್ನೂ ವ್ಯಕ್ತಿನಾಮವನ್ನೂ ಉಳಿಸಿಕೊಂಡು, ಆಧುನಿಕ ಕನ್ನಡಕ್ಕೆ ಸಹಜವಾದ ಕ್ರಮವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ἐταράχθη
  choice: ಕಳವಳಗೊಂಡನು
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಮನಸ್ಸಿನ ಅಶಾಂತಿ, ತಳಮಳ ಅಥವಾ ಆತಂಕವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕಳವಳಗೊಂಡನು’ ಭಾವದ ತೀವ್ರತೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೆಚ್ಚಿಸದೆ ಅದನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: ಇಡೀ ಯೆರೂಸಲೇಮೂ
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ನಗರನಾಮದ ಮೂಲಕ ಅದರ ನಿವಾಸಿಗಳನ್ನು ಸೂಚಿಸುವ ಲಕ್ಷಣೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಜನರು’ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಸೇರಿಸಿಲ್ಲ.
- source_word: μετ’ αὐτοῦ
  choice: ಅವನೊಂದಿಗೆ
  rationale: ಹೆರೋದನ ಕಳವಳಕ್ಕೂ ಯೆರೂಸಲೇಮಿನ ಕಳವಳಕ್ಕೂ ಇರುವ ಸಹಭಾಗಿತ್ವವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: πᾶσα Ἱεροσόλυμα ಎಂಬುದರ ವ್ಯಾಪ್ತಿ
  choice: ನಗರವನ್ನೇ ಸಮೂಹಾರ್ಥದಲ್ಲಿ ಉಲ್ಲೇಖಿಸುವ ‘ಇಡೀ ಯೆರೂಸಲೇಮು’ ಎಂಬ ರೂಪ
  alternative: ಯೆರೂಸಲೇಮಿನ ಅನೇಕ ಜನರು ಅಥವಾ ವಿಶೇಷವಾಗಿ ಅದರ ನಾಯಕವರ್ಗ
  rationale: ಮೂಲಪಠ್ಯವು ನಗರವನ್ನು ಸಮಗ್ರವಾಗಿ ಹೆಸರಿಸುತ್ತದೆ. ಅದನ್ನು ನಾಯಕವರ್ಗಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಮತ್ತು ಪ್ರತಿಯೊಬ್ಬ ನಿವಾಸಿಯ ಕುರಿತ ಕಟ್ಟುನಿಟ್ಟಾದ ಹೇಳಿಕೆಯೆಂದು ನಿರ್ಧರಿಸದೆ, ಮೂಲದ ಸಮೂಹಾರ್ಥ ಹಾಗೂ ಸಾಧ್ಯ ಅತಿಶಯೋಕ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ‘ಕಳವಳಗೊಂಡನು/ಕಳವಳಗೊಂಡಿತು’ ಎಂಬ ಸಮಾನಾಂತರ ರಚನೆ ಮೂಲದ ಹಂಚಿಕೊಂಡ ಆತಂಕವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ನಗರನಾಮದ ಸಮೂಹಾರ್ಥವನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
