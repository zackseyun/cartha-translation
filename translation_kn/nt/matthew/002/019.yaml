id: MAT.2.19
reference: Matthew 2:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: kn
  text: ಆದರೆ ಹೆರೋದನು ಸತ್ತ ನಂತರ, ಇಗೋ, ಕರ್ತನ ದೂತನೊಬ್ಬನು[a] ಐಗುಪ್ತದಲ್ಲಿದ್ದ ಯೋಸೇಫನಿಗೆ ಕನಸಿನಲ್ಲಿ ಕಾಣಿಸಿಕೊಳ್ಳುತ್ತಾನೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಕರ್ತನ ದೂತನು.” ಇಲ್ಲಿ ಗ್ರೀಕ್ ಭಾಷೆಯಲ್ಲಿ “ದೂತ” ಎಂಬ ಪದದ ಮುಂದೆ ನಿರ್ದಿಷ್ಟ ಉಪಪದ ಇಲ್ಲ.
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: ಸತ್ತ ನಂತರ
  rationale: ಹೆರೋದನನ್ನು ಕರ್ತೃವಾಗಿಟ್ಟುಕೊಂಡಿರುವ aorist participle ಇರುವ genitive absolute ಕಾಲಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆ ಹಿಂದಿನ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಸತ್ತ ನಂತರ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಕಥನದ ಮುಂದುವರಿಕೆಯಲ್ಲಿ ಸೌಮ್ಯವಾದ ತಿರುವು ಅಥವಾ ವ್ಯತ್ಯಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಕಥನದಲ್ಲಿನ ಗಮನ ಸೆಳೆಯುವ ಜೀವಂತ ಮತ್ತು ಘನವಾದ ಸೂಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἄγγελος κυρίου
  choice: ಕರ್ತನ ದೂತನೊಬ್ಬನು
  rationale: ἄγγελος ಪದದ ಮುಂದೆ ಗ್ರೀಕ್ ನಿರ್ದಿಷ್ಟ ಉಪಪದ ಇಲ್ಲದ ಕಾರಣ ‘ದೂತನೊಬ್ಬನು’ ಎಂದು ಅನಿರ್ದಿಷ್ಟವಾಗಿ ನೀಡಲಾಗಿದೆ; κυρίου ಅನ್ನು ‘ಕರ್ತನ’ ಎಂದು ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
- source_word: φαίνεται
  choice: ಕಾಣಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನಕಾಲದ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಉಳಿಸಿ, ದೃಶ್ಯದ ಜೀವಂತಿಕೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: κατ’ ὄναρ
  choice: ಕನಸಿನಲ್ಲಿ
  rationale: ಮತ್ತಾಯನಲ್ಲಿ ಕನಸಿನ ಮೂಲಕ ದೊರೆಯುವ ಪ್ರಕಟಣೆಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: τῷ Ἰωσὴφ
  choice: ಯೋಸೇಫನಿಗೆ
  rationale: ದತ್ತಿವ್ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ಸಹಜ ಕನ್ನಡದ ಸಂಪ್ರದಾನ ವಿಭಕ್ತಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἐν Αἰγύπτῳ
  choice: ಐಗುಪ್ತದಲ್ಲಿದ್ದ
  rationale: ಕನಸು ಬಂದ ಸಮಯದಲ್ಲಿ ಯೋಸೇಫನಿದ್ದ ಸ್ಥಳವನ್ನು ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἄγγελος κυρίου ಎಂಬ ಪದಗುಚ್ಛದಲ್ಲಿನ κύριος
  choice: ಕರ್ತನು
  alternative: ಒಡೆಯನು
  rationale: ದೈವಿಕ ಬಿರುದಾಗಿ κύριος ಅನ್ನು ಕನ್ನಡ ಬೈಬಲ್ ಶೈಲಿಗೆ ಸಹಜವಾದ ‘ಕರ್ತನು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- issue: ἄγγελος ಪದದ ನಿರ್ದಿಷ್ಟತೆ
  choice: ಕರ್ತನ ದೂತನೊಬ್ಬನು
  alternative: ಕರ್ತನ ದೂತನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ἄγγελος ಪದದ ಮುಂದೆ ನಿರ್ದಿಷ್ಟ ಉಪಪದ ಇಲ್ಲ; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಸಂಪ್ರದಾಯಬದ್ಧ ನಿರ್ದಿಷ್ಟ ಓದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಘನವಾಗಿಯೂ ಇರುವ ಕಥನಶೈಲಿ. ‘ಇಗೋ’ ಮತ್ತು ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವಾದ ‘ಕಾಣಿಸಿಕೊಳ್ಳುತ್ತಾನೆ’ ಎಂಬ ರೂಪಗಳು ಮೂಲದ ಜೀವಂತಿಕೆಯನ್ನು ಉಳಿಸುತ್ತವೆ; ‘ಐಗುಪ್ತ’ ಮತ್ತು ‘ಯೋಸೇಫ’ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಬೈಬಲ್ ಹೆಸರುರೂಪಗಳಿಗೆ ಅನುಗುಣವಾಗಿವೆ.
