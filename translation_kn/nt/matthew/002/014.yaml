  to: ಆಗ ಅವನು ಎದ್ದು, ರಾತ್ರಿಯಲ್ಲಿ ಮಗುವನ್ನೂ ಅದರ ತಾಯಿಯನ್ನೂ ಕರೆದುಕೊಂಡು ಈಜಿಪ್ಟಿಗೆ[a] ಹೊರಟನು.
