id: MAT.2.14
reference: Matthew 2:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: kn
  text: ಆಗ ಅವನು ಎದ್ದು, ರಾತ್ರಿಯಲ್ಲಿ ಮಗುವನ್ನೂ ಅದರ ತಾಯಿಯನ್ನೂ ಕರೆದುಕೊಂಡು ಈಜಿಪ್ಟಿಗೆ[a] ಹೊರಟನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಈಜಿಪ್ಟಿನ ಕಡೆಗೆ.’
    reason: εἰς ಗಮ್ಯಸ್ಥಾನದತ್ತ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಈಜಿಪ್ಟಿನ ಕಡೆಗೆ’ ಎಂಬುದು ದಿಕ್ಕನ್ನು ಮುನ್ನೆಲೆಗೆ ತರುವ ಪರ್ಯಾಯವಾಗಿದೆ.
lexical_decisions:
- source_word: δὲ
  choice: ಆಗ
  rationale: ಇದು ಕಥನವನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಪರ್ಕಪದ. ಹಿಂದಿನ ಆಜ್ಞೆಗೆ ಯೋಸೇಫನು ತಕ್ಷಣ ಪ್ರತಿಕ್ರಿಯಿಸಿದ ಕ್ರಮವನ್ನು ‘ಆಗ’ ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: ἐγερθεὶς
  choice: ಎದ್ದು
  rationale: ಅವನು ನಿದ್ರೆಯಿಂದ ಎದ್ದು ತಕ್ಷಣ ಕಾರ್ಯಪ್ರವೃತ್ತನಾದ ಕಥನಕ್ರಮವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ತಿಳಿಸುತ್ತದೆ.
- source_word: παρέλαβε
  choice: ಕರೆದುಕೊಂಡು
  rationale: παραλαμβάνω ಇಲ್ಲಿ ಯಾರನ್ನಾದರೂ ತನ್ನೊಂದಿಗೆ ಕರೆದೊಯ್ಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕರೆದುಕೊಂಡು’ ಎಂಬುದು ಆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: τὸ παιδίον
  choice: ಮಗುವನ್ನು
  rationale: παιδίον ಎಂಬ ಪದದ ಸರಳ ಅರ್ಥ ‘ಮಗು’; ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ಹೆಚ್ಚುವರಿ ವಯಸ್ಸಿನ ಒತ್ತನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ಅದರ ತಾಯಿಯನ್ನು
  rationale: αὐτοῦ ಎಂಬ ಸರ್ವನಾಮವು ಮಗುವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಅದರ ತಾಯಿ’ ಎಂದರೆ ತಾಯಿ ಮಗುವಿನವಳು ಎಂಬ ಸಂಬಂಧ ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ; ಯೋಸೇಫನ ತಾಯಿ ಎಂಬ ತಪ್ಪುಗ್ರಹಿಕೆಗೆ ಅವಕಾಶವಿಲ್ಲ.
- source_word: νυκτὸς
  choice: ರಾತ್ರಿಯಲ್ಲೇ
  rationale: ಕಾಲಸೂಚಕ ಷಷ್ಠೀ ವಿಭಕ್ತಿ ಈ ಕ್ರಿಯೆಗಳು ರಾತ್ರಿಯಲ್ಲಿ ನಡೆದವು ಎಂದು ಸೂಚಿಸುತ್ತದೆ. ‘-ಲೇ’ ಹಿಂದಿನ ಆಜ್ಞೆಗೆ ತಕ್ಷಣ ನೀಡಿದ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕಥನಶೈಲಿಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀνεχώρησεν
  choice: ಹೊರಟನು
  rationale: ἀναχωρέω ಇಲ್ಲಿ ಒಂದು ಸ್ಥಳವನ್ನು ಬಿಟ್ಟು ಮತ್ತೊಂದು ಗಮ್ಯಸ್ಥಾನದತ್ತ ತೆರಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೊರಟನು’ ಉದ್ದೇಶಪೂರ್ವಕ ಪ್ರಯಾಣವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ಅಪಾಯದಿಂದ ಹಿಮ್ಮೆಟ್ಟಿದನು ಎಂಬ ಹೆಚ್ಚುವರಿ ಅರ್ಥವನ್ನು ಹೇರದು.
- source_word: εἰς Αἴγυπτον
  choice: ಈಜಿಪ್ಟಿಗೆ
  rationale: εἰς ಗಮ್ಯಸ್ಥಾನದತ್ತ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಈಜಿಪ್ಟಿಗೆ’ ಎಂಬುದು ನೇರವೂ ಸಹಜವೂ ಆದ ಕನ್ನಡ ರೂಪ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಕ್ರಮವನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಲು ‘ರಾತ್ರಿಯಲ್ಲೇ’ ಎಂಬುದನ್ನು ಮುಖ್ಯ ಕ್ರಿಯಾಸರಣಿಯ ಮುಂಚೆ ಇರಿಸಲಾಗಿದೆ.
