id: MAT.2.11
reference: Matthew 2:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: kn
  text: ಅವರು ಮನೆಯೊಳಗೆ ಪ್ರವೇಶಿಸಿ, ಮಗುವನ್ನು ಅದರ ತಾಯಿ ಮರಿಯಳೊಂದಿಗೆ ಕಂಡರು. ನೆಲಕ್ಕೆ ಬಿದ್ದು, ಅವರು ಅವನಿಗೆ ಗೌರವ ಸಲ್ಲಿಸಿದರು[a]. ನಂತರ ತಮ್ಮ ಬೊಕ್ಕಸಗಳನ್ನು ತೆರೆದು, ಬಂಗಾರ, ಲೋಬಾನ ಮತ್ತು ರಕ್ತಬೋಳ ಎಂಬ ಉಡುಗೊರೆಗಳನ್ನು ಅವನಿಗೆ ಅರ್ಪಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವನನ್ನು ಆರಾಧಿಸಿದರು.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಆರಾಧನೆಯನ್ನಾಗಲಿ ಭಕ್ತಿಪೂರ್ವಕ ಗೌರವ ಸಲ್ಲಿಸುವ ಕ್ರಿಯೆಯನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: ಮನೆ
  rationale: ನಿರ್ದಿಷ್ಟ ವಾಸಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ನೇರವಾದ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದ; ‘ಮನೆಯೊಳಗೆ’ ಎಂಬ ರೂಪವು εἰς ಎಂಬ ಒಳಪ್ರವೇಶದ ಅರ್ಥವನ್ನೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: παιδίον
  choice: ಮಗು
  rationale: ವಯಸ್ಸು ಅಥವಾ ಲಿಂಗದ ಕುರಿತು ಗ್ರೀಕ್ ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಸೇರಿಸದೆ παιδίον ಎಂಬ ಪದದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: ಅದರ ತಾಯಿ ಮರಿಯಳೊಂದಿಗೆ
  rationale: μετά ಎಂಬುದರ ‘ಜೊತೆಯಲ್ಲಿ’ ಎಂಬ ಸಂಬಂಧವನ್ನೂ, ಮರಿಯಳು ಮಗುವಿನ ತಾಯಿ ಎಂಬ ಸಮಾನಾಧಿಕರಣದ ಗುರುತನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πεσόντες
  choice: ಅಡ್ಡಬಿದ್ದು
  rationale: ನೆಲಕ್ಕೆ ಬಿದ್ದು ದೇಹವನ್ನು ತಗ್ಗಿಸುವ ಸ್ಪಷ್ಟ ಭಂಗಿಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕೇವಲ ‘ತಲೆಬಾಗಿ’ ಎನ್ನುವುದಕ್ಕಿಂತ ಮೂಲದ ತೀವ್ರತೆಯನ್ನು ಚೆನ್ನಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: προσεκύνησαν
  choice: ಗೌರವ ಸಲ್ಲಿಸಿದರು
  rationale: ರಾಜನಿಗೆ ಸಲ್ಲಿಸುವ ಭಕ್ತಿಪೂರ್ವಕ ನಮನದಿಂದ ಆರಾಧನೆಯವರೆಗೆ ಇರುವ προσκυνέω ಪದದ ವ್ಯಾಪ್ತಿಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅತಿಯಾಗಿ ಸಂಕುಚಿತಗೊಳಿಸದೆ ಇಡುತ್ತದೆ.
- source_word: θησαυρούς
  choice: ಬೊಕ್ಕಸಗಳು
  rationale: ತೆರೆಯಬಹುದಾದ ಅಮೂಲ್ಯ ವಸ್ತುಗಳ ಸಂಗ್ರಹ ಅಥವಾ ಅವುಗಳ ಪೆಟ್ಟಿಗೆಗಳನ್ನು ಸೂಚಿಸುವ ಸಂದರ್ಭೋಚಿತ ಕನ್ನಡ ಪದ; ನಿರ್ದಿಷ್ಟವಾಗಿ ‘ಪೆಟ್ಟಿಗೆಗಳು’ ಎಂದು ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: προσήνεγκαν ... δῶρα
  choice: ಉಡುಗೊರೆಗಳಾಗಿ ... ಅರ್ಪಿಸಿದರು
  rationale: ಔಪಚಾರಿಕವಾಗಿ ಕೊಡುವ ಕ್ರಿಯೆಯನ್ನೂ ಕೊಟ್ಟ ವಸ್ತುಗಳು ಉಡುಗೊರೆಗಳಾಗಿದ್ದುದನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: χρυσὸν
  choice: ಬಂಗಾರ
  rationale: ಚಿನ್ನವನ್ನು ಸೂಚಿಸುವ ನೇರವಾದ, ಸಾಮಾನ್ಯ ಕನ್ನಡ ಪದ.
- source_word: λίβανον
  choice: ಸಾಂಬ್ರಾಣಿ
  rationale: ಸುಗಂಧದ ರಾಳವಾದ frankincense ಅನ್ನು ಸೂಚಿಸುವ ಪರಿಚಿತ ಮತ್ತು ಸಂದರ್ಭೋಚಿತ ಕನ್ನಡ ಹೆಸರು.
- source_word: σμύρναν
  choice: ರಕ್ತಬೋಳ
  rationale: myrrh ಎಂಬ ಸುಗಂಧಯುಕ್ತ ರಾಳಕ್ಕೆ ಬಳಕೆಯಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ಕನ್ನಡ ಹೆಸರು.
theological_decisions:
- issue: ಮಗು ಯೇಸುವಿಗೆ ಸಂಬಂಧಿಸಿದಂತೆ προσκυνέω ಪದದ ಅನುವಾದ
  choice: ಗೌರವ ಸಲ್ಲಿಸಿದರು
  alternative: ಆರಾಧಿಸಿದರು
  rationale: ಈ ಕ್ರಿಯೆಯನ್ನು ರಾಜಮಗುವಿಗೆ ಸಲ್ಲಿಸಿದ ಆಳವಾದ ಗೌರವವೆಂದೂ, ಬಲವಾದ ಧಾರ್ಮಿಕ ಅರ್ಥದಲ್ಲಿ ಆರಾಧನೆ ಎಂದೂ ಗ್ರಹಿಸಬಹುದು. ತಕ್ಷಣದ ಸಂದರ್ಭವು ನಿರ್ಣಯಿಸದ ಈ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ‘ಆರಾಧಿಸಿದರು’ ಎಂಬ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಮಗುವನ್ನು ಸೂಚಿಸುವ ಸರ್ವನಾಮವು ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ನಪುಂಸಕಲಿಂಗದಲ್ಲಿರುವುದರಿಂದ ಮತ್ತು ಕನ್ನಡದಲ್ಲಿ ‘ಮಗು’ ನಪುಂಸಕಲಿಂಗವಾಗಿರುವುದರಿಂದ ‘ಅದಕ್ಕೆ’ ಎಂಬ ರೂಪವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ಮೂಲ ಇಂಗ್ಲಿಷ್ ಸಲಹಾ ಪಠ್ಯದಲ್ಲಿ [a] ಗುರುತು ‘house’ ಬಳಿಕ ಕಾಣಿಸಿದರೂ ಅದರ ಅಡಿಕುರಿಪು προσκυνέω ಕುರಿತು ಇರುವುದರಿಂದ, ಕನ್ನಡ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಗುರುತನ್ನು ಸಂಬಂಧಿತ ‘ಗೌರವ ಸಲ್ಲಿಸಿದರು’ ಎಂಬ ಪದಗುಚ್ಛದ ಬಳಿಕ ಇಡಲಾಗಿದೆ.
