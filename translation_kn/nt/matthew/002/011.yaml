revisions:
- from: ಅವರು ಮನೆಯೊಳಗೆ ಬಂದು, ಮಗುವನ್ನು ಅದರ ತಾಯಿ ಮರಿಯಳೊಂದಿಗೆ ಕಂಡರು. ಅವರು ಅಡ್ಡಬಿದ್ದು ಅದಕ್ಕೆ ಗೌರವ ಸಲ್ಲಿಸಿದರು[a]. ನಂತರ ತಮ್ಮ ಬೊಕ್ಕಸಗಳನ್ನು ತೆರೆದು, ಬಂಗಾರ, ಸಾಂಬ್ರಾಣಿ ಮತ್ತು ರಕ್ತಬೋಳವನ್ನು ಉಡುಗೊರೆಗಳಾಗಿ ಅದಕ್ಕೆ ಅರ್ಪಿಸಿದರು.
