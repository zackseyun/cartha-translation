id: MAT.2.6
reference: Matthew 2:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: kn
  text: '“ಯೆಹೂದ ನಾಡಿನ ಬೆತ್ಲೆಹೇಮೇ,


    ನೀನು ಯೆಹೂದದ ಅಧಿಪತಿಗಳಲ್ಲಿ


    ಯಾವ ರೀತಿಯಲ್ಲಿಯೂ ಅತಿ ಅಲ್ಪವಲ್ಲ;


    ಏಕೆಂದರೆ ನಿನ್ನಿಂದ ಒಬ್ಬ ಅಧಿಪತಿ ಹೊರಹೊಮ್ಮುವನು[a];


    ಅವನು ನನ್ನ ಜನರಾದ ಇಸ್ರಾಯೇಲರನ್ನು ಮೇಯಿಸುವನು[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಹೊರಗೆ ಬರುವನು.”
    reason: ἐξελεύσεται ಎಂಬ ಪದದ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ಪರ್ಯಾಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
  - marker: b
    text: “ಮೇಯಿಸುವನು” ಎಂಬುದಕ್ಕೆ “ಆಳುವನು” ಎಂಬ ಅರ್ಥವೂ ಇರಬಹುದು; ಇದರಲ್ಲಿ ಕುರುಬನ ಪಾಲನೆಯ ಚಿತ್ರಣದ ಜೊತೆಗೆ ರಾಜನ ಆಡಳಿತದ ಚಿತ್ರಣವೂ ಸೇರಿದೆ.
    reason: ποιμανεῖ ಪದದಲ್ಲಿರುವ ಕುರುಬನ ಪಾಲನೆ ಮತ್ತು ರಾಜಕೀಯ ಆಡಳಿತದ ದ್ವಂದ್ವ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ತಿಳಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: γῆ
  choice: ನಾಡು
  rationale: ಬೆತ್ಲೆಹೇಮನ್ನು ಯೆಹೂದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಭೌಗೋಳಿಕ ಪ್ರದೇಶದೊಳಗೆ ಗುರುತಿಸುವುದರಿಂದ ‘ನಾಡು’ ಎಂಬುದು ಮಣ್ಣು ಅಥವಾ ಭೂಮಿಗಿಂತ ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾಗಿದೆ.
- source_word: οὐδαμῶς
  choice: ಯಾವ ರೀತಿಯಲ್ಲಿಯೂ ... ಅಲ್ಲ
  rationale: ಸರಳ ನಿರಾಕರಣೆಗಿಂತ ಗ್ರೀಕ್ ಕ್ರಿಯಾವಿಶೇಷಣದ ಒತ್ತನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐλαχίστη
  choice: ಅಲ್ಪ
  rationale: ಇಲ್ಲಿ ಗಾತ್ರಕ್ಕಿಂತ ಸ್ಥಾನ ಅಥವಾ ಮಹತ್ವ ಮುಖ್ಯವಾಗಿರುವುದರಿಂದ ‘ಅತಿ ಚಿಕ್ಕದು’ ಎನ್ನುವುದಕ್ಕಿಂತ ‘ಅಲ್ಪ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: ἡγεμόσιν
  choice: ಅಧಿಪತಿಗಳು
  rationale: ಆಡಳಿತ ಮತ್ತು ಪ್ರಾಮುಖ್ಯದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ನಿರ್ದಿಷ್ಟ ರಾಜಕೀಯ ಹುದ್ದೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: ἐξελεύσεται
  choice: ಹೊರಹೊಮ್ಮುವನು
  rationale: ἐξέρχομαι ಎಂಬ ಪದದ ‘ಹೊರಗೆ ಬರುವುದು’ ಎಂಬ ಮೂಲಚಿತ್ರವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡγούμενος
  choice: ಒಬ್ಬ ಅಧಿಪತಿ
  rationale: ನಾಮಪದವಾಗಿ ಬಳಕೆಯಾದ ಕೃದಂತವು ಬರಲಿರುವ ವ್ಯಕ್ತಿಯ ಆಡಳಿತದ ಪಾತ್ರವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ποιμανεῖ
  choice: ಮೇಯಿಸುವನು
  rationale: ಕುರುಬನ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುವುದರ ಜೊತೆಗೆ ಜನರನ್ನು ಮುನ್ನಡೆಸಿ ಆಳುವ ವಿಸ್ತೃತ ಅರ್ಥಕ್ಕೂ ಅವಕಾಶ ಕೊಡುತ್ತದೆ.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: ನನ್ನ ಜನರಾದ ಇಸ್ರಾಯೇಲರು
  rationale: ಒಡಂಬಡಿಕೆಯ ‘ನನ್ನ ಜನ’ ಎಂಬ ಅಭಿವ್ಯಕ್ತಿಯನ್ನೂ ಇಸ್ರಾಯೇಲ್ ಎಂಬ ಸಮಾನಾಧಿಕರಣವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಬರಲಿರುವ ವ್ಯಕ್ತಿಯ ರಾಜಕೀಯ ಮತ್ತು ಕುರುಬನಂಥ ಪಾತ್ರಗಳ ನಡುವಿನ ಸಂಬಂಧ
  choice: ἡγούμενος ಅನ್ನು ‘ಅಧಿಪತಿ’ ಎಂದೂ ποιμανεῖ ಅನ್ನು ‘ಮೇಯಿಸುವನು’ ಎಂದೂ ಅನುವಾದಿಸಿ ಎರಡೂ ಚಿತ್ರಣಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಎರಡನ್ನೂ ಕೇವಲ ರಾಜಕೀಯ ಭಾಷೆಯಲ್ಲಿ ‘ನಾಯಕ/ಆಳುವನು’ ಎಂದು ಅಥವಾ ಎರಡನ್ನೂ ಕೇವಲ ಪಾಲನೆಯ ಭಾಷೆಯಲ್ಲಿ ಅನುವಾದಿಸುವುದು.
  rationale: ವಾಕ್ಯವು ಆಡಳಿತ ಮತ್ತು ಕುರುಬನ ಸೇವೆ ಎಂಬ ಎರಡೂ ಆಯಾಮಗಳನ್ನು ಒಟ್ಟಿಗೆ ಇಡುತ್ತದೆ; ಒಂದನ್ನು ಮತ್ತೊಂದರಲ್ಲಿ ಕರಗಿಸುವುದು ಮೂಲದ ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ, ಆದರೆ ಶಾಸ್ತ್ರೋಚಿತ ಗೌರವ ಮತ್ತು ಕಾವ್ಯಾತ್ಮಕ ಉದ್ಧರಣದ ವಿನ್ಯಾಸ ಉಳಿಯುವಂತೆ ರೂಪಿಸಲಾಗಿದೆ. ಬೆತ್ಲೆಹೇಮಿಗೆ ನೇರ ಸಂಬೋಧನೆ ಇರುವುದರಿಂದ ‘ಬೆತ್ಲೆಹೇಮೇ’ ಬಳಸಲಾಗಿದೆ; ಮೂಲದ ಬಲವಾದ ನಿರಾಕರಣೆಯನ್ನು ‘ಯಾವ ರೀತಿಯಲ್ಲಿಯೂ ಅಲ್ಪವಲ್ಲ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
