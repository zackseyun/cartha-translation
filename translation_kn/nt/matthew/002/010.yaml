  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಅತ್ಯಂತ ಮಹಾ ಸಂತೋಷದಿಂದ ಹರ್ಷಿಸಿದರು’ ಎಂಬ ಉದ್ದೇಶಿತ ತೀವ್ರತೆ ಮೂಲದ ಪುನರುಕ್ತಿಯ ಒತ್ತನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸುತ್ತದೆ.
