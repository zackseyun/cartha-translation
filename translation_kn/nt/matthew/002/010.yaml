id: MAT.2.10
reference: Matthew 2:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: kn
  text: ಅವರು ಆ ನಕ್ಷತ್ರವನ್ನು ಕಂಡಾಗ, ಬಹಳವೇ ಮಹಾ ಸಂತೋಷದಿಂದ ಹರ್ಷಿಸಿದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ, ‘ಅವರು ಮಹಾ ಸಂತೋಷವನ್ನು ಬಹಳವಾಗಿ ಹರ್ಷಿಸಿದರು’; ಇದು ಅತ್ಯಂತ ಒತ್ತಿನ ಅಭಿವ್ಯಕ್ತಿ.
    reason: ಮೂಲ ಗ್ರೀಕ್‌ನ ತೀವ್ರಗೊಳಿಸುವ ಪುನರುಕ್ತಿಯ ಒತ್ತನ್ನು ಕನ್ನಡದ ಸಹಜ ಅನುವಾದದಲ್ಲಿ ಪೂರ್ಣವಾಗಿ ತೋರಿಸಲಾಗದಿರುವುದರಿಂದ.
lexical_decisions:
- source_word: ἰδόντες
  choice: ಕಂಡಾಗ
  rationale: ὁράω ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲಿಕ ಕೃದಂತರೂಪವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಕಾಲಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕಂಡಾಗ’ ಎಂಬುದು ಆ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: —
  rationale: ಇಲ್ಲಿ δέ ಸೌಮ್ಯವಾದ ಕಥನ-ಸಂಪರ್ಕಕವಾಗಿದೆ. ಹಿಂದಿನ ವಾಕ್ಯದೊಡನೆ ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಸಂಯೋಜಕವಿಲ್ಲದೇ ಸಹಜವಾಗಿ ಕಥನ ಮುಂದುವರಿಯುವುದರಿಂದ ಅದನ್ನು ಸ್ಪಷ್ಟ ಪದವಾಗಿ ಅನುವಾದಿಸಲಾಗಿಲ್ಲ.
- source_word: τὸν ἀστέρα
  choice: ಆ ನಕ್ಷತ್ರವನ್ನು
  rationale: ἀστήρ ಎಂದರೆ ‘ನಕ್ಷತ್ರ.’ ನಿರ್ದಿಷ್ಟ ಲೇಖನವು ಹಿಂದೆ ಉಲ್ಲೇಖಿಸಲಾದ ನಿರ್ದಿಷ್ಟ ನಕ್ಷತ್ರವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆ’ ಬಳಸಲಾಗಿದೆ.
- source_word: ἐχάρησαν
  choice: ಹರ್ಷಿಸಿದರು
  rationale: χαίρω ಎಂಬ ಕ್ರಿಯೆಯ ಈ ರೂಪವು ಅರ್ಥದಲ್ಲಿ ಕರ್ತರಿ ಪ್ರಯೋಗವಾಗಿದೆ. ‘ಹರ್ಷಿಸಿದರು’ ಕ್ರಿಯಾತ್ಮಕ ಬಲವನ್ನೂ ಗೌರವಯುತ ಶೈಲಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: χαρὰν μεγάλην
  choice: ಮಹಾ ಸಂತೋಷದಿಂದ
  rationale: ಇದು ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನೇ ಪುನರಾವರ್ತಿಸಿ ತೀವ್ರಗೊಳಿಸುವ cognate accusative ರಚನೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮಹಾ ಸಂತೋಷದಿಂದ’ ಎಂಬ ಕರಣಾರ್ಥಕ ನುಡಿಗಟ್ಟು ಅದರ ಬಲವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: σφόδρα
  choice: ಅತ್ಯಂತ
  rationale: σφόδρα ಇಡೀ ಸಂತೋಷದ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಮತ್ತಷ್ಟು ತೀವ್ರಗೊಳಿಸುತ್ತದೆ. ‘ಅತ್ಯಂತ’ ಮೂಲದ ಒತ್ತನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
