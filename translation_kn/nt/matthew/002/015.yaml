  to: 'ಹೆರೋದನ ಮರಣದವರೆಗೆ ಅವನು ಅಲ್ಲಿಯೇ ಇದ್ದನು; ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು ಹೇಳಿದ ಮಾತು ನೆರವೇರಲೆಂದು ಹೀಗಾಯಿತು: “ಈಜಿಪ್ಟಿನಿಂದ ನನ್ನ ಮಗನನ್ನು ಕರೆದೆನು.”[a]'
