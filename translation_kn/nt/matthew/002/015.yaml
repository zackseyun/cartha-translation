id: MAT.2.15
reference: Matthew 2:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: kn
  text: 'ಹೆರೋದನ ಮರಣದವರೆಗೆ ಅವನು ಅಲ್ಲಿಯೇ ಇದ್ದನು; ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು ಹೇಳಿದ ಮಾತು ನೆರವೇರಲೆಂದು ಹೀಗಾಯಿತು: “ಈಜಿಪ್ಟಿನಿಂದ ನನ್ನ ಮಗನನ್ನು ಕರೆದೆನು.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮತ್ತಾಯನು ಹೋಶೇಯ 11:1ನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ. ಮೂಲ ಸಂದರ್ಭದಲ್ಲಿ ಅದು ದೇವರ ಮಗನೆಂದು ಕರೆಯಲ್ಪಟ್ಟ ಇಸ್ರಾಯೇಲನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಮತ್ತಾಯನು ಆ ವಾಕ್ಯವು ಯೇಸುವಿನಲ್ಲಿ ನೆರವೇರಿದುದಾಗಿ ಪ್ರಸ್ತುತಪಡಿಸುತ್ತಾನೆ.
    reason: ಮೂಲ ಉಲ್ಲೇಖದ ಸಂದರ್ಭ ಮತ್ತು ಮತ್ತಾಯನ ಅನ್ವಯವನ್ನು ತಿಳಿಸುವ ಅಡ್ಡಉಲ್ಲೇಖ.
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: ಅವನು ಅಲ್ಲಿಯೇ ಇದ್ದನು
  rationale: ಇದು εἰμί ಕ್ರಿಯಾಪದದ ಸರಳ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ‘ತಂಗಿದ್ದನು’ ಎಂಬ ಸಂದರ್ಭಾಧಾರಿತ ಹೆಚ್ಚುವರಿ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಹೇರದು.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: ಹೆರೋದನ ಮರಣದವರೆಗೂ
  rationale: τελευτή ಇಲ್ಲಿ ಜೀವಿತದ ಅಂತ್ಯ, ಅಂದರೆ ಮರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಗ್ರೀಕ್‌ನ ನಾಮಪದ ರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἵνα πληρωθῇ
  choice: ಹೀಗೆ ... ನೆರವೇರಿತು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಉದ್ದೇಶ ಮತ್ತು ಫಲಿತಾಂಶ ಎರಡಕ್ಕೂ ಅವಕಾಶವಿರುವ ἵνα ರಚನೆಯನ್ನು ಅಸಹಜವಾದ ಪದಶಃ ರೂಪವಿಲ್ಲದೆ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ನೆರವೇರಿಕೆಯ ದಾವೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ ῥηθὲν
  choice: ಹೇಳಿದ ಮಾತು
  rationale: ಕರ್ತನಿಂದ ಹೇಳಲ್ಪಟ್ಟ ವಿಷಯವನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡ ನಾಮಪದೀಯ ಪದಗುಚ್ಛವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ὑπὸ κυρίου
  choice: ಕರ್ತನು
  rationale: κύριος ಅನ್ನು ಯೋಜನೆಯ ಪದಬಳಕೆಯಂತೆ ‘ಕರ್ತನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲದ ‘ದೇವರು’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: διὰ τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯ ಮೂಲಕ
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮಧ್ಯಸ್ಥ ಕರ್ತೃತ್ವವನ್ನು ಉಳಿಸಿ, ಕರ್ತನು ಮೂಲ ವಕ್ತಾರನೂ ಪ್ರವಾದಿ ಮಾನವ ಮಾಧ್ಯಮನೂ ಎಂಬ ವ್ಯತ್ಯಾಸವನ್ನು ತೋರಿಸುತ್ತದೆ.
- source_word: λέγοντος
  choice: ಎಂದು
  rationale: ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುವ ಕೃದಂತವನ್ನು ಕನ್ನಡದ ಸಹಜ ನೇರೋಕ್ತಿ ಸೂಚಕದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: Ἐξ Αἰγύπτου
  choice: ಈಜಿಪ್ಟಿನಿಂದ
  rationale: ἐξ ಸೂಚಿಸುವ ಮೂಲಸ್ಥಾನ ಮತ್ತು ಹೊರಗೆ ಕರೆತರುವ ಚಲನೆಯನ್ನು ಸಂದರ್ಭದಲ್ಲೇ ಗ್ರಹಿಸಬಹುದಾದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐκάλεσα
  choice: ಕರೆದೆನು
  rationale: καλέω ಕ್ರಿಯೆಯ ವಿಶಾಲವಾದ ‘ಕರೆಯು’ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ‘ಆಜ್ಞಾಪಿಸಿ ಕರೆಸಿದೆನು’ ಎಂಬಷ್ಟು ಸಂಕುಚಿತ ಅರ್ಥವನ್ನು ಹೇರದು.
- source_word: τὸν υἱόν μου
  choice: ನನ್ನ ಮಗನನ್ನು
  rationale: υἱός ಎಂಬ ಪುತ್ರಸಂಬಂಧದ ನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಹೋಶೇಯನ ಉಲ್ಲೇಖ ಮತ್ತು ಮತ್ತಾಯನ ಅನ್ವಯಕ್ಕೆ ಮುಖ್ಯವಾದ ಏಕವಚನ ಸಂಬಂಧವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
theological_decisions:
- issue: ಹೋಶೇಯ 11:1ರ ಉಲ್ಲೇಖ ಮತ್ತು ನೆರವೇರಿಕೆಯ ಸೂತ್ರ
  choice: ಯೇಸುವಿನ ಈಜಿಪ್ಟಿನಿಂದ ಮರಳುವಿಕೆಯಲ್ಲಿ ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು ಹೇಳಿದ ಮಾತು ನೆರವೇರಿತು ಎಂಬ ಮತ್ತಾಯನ ಹೇಳಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ಕೇವಲ ನೇರ ಮುನ್ಸೂಚನೆ ಎಂದು ಅಥವಾ ಇಸ್ರಾಯೇಲಿನ ಪುತ್ರತ್ವವನ್ನು ಮೆಸ್ಸೀಯನು ಮಾದರಿಯಾಗಿ ಮರುಪೂರೈಸಿದನೆಂದು ಅನುವಾದದಲ್ಲೇ ವಿವರಿಸುವುದು.
  rationale: ಮತ್ತಾಯನು ಸ್ಪಷ್ಟವಾಗಿ ‘ನೆರವೇರಿತು’ ಎಂದು ಹೇಳುತ್ತಾನೆ; ಆದರೆ ನೆರವೇರಿಕೆಯ ವಿಧಾನವನ್ನು ಅನುವಾದವೇ ನಿರ್ಧರಿಸಬಾರದು. ಆದ್ದರಿಂದ ಪಠ್ಯದ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮತ್ತು ನೈಜ ಅಸ್ಪಷ್ಟತೆ ಉಳಿದಿವೆ.
- issue: ನೆರವೇರಿಕೆಯ ಸೂತ್ರದಲ್ಲಿನ κύριος
  choice: ಕರ್ತನು
  alternative: ಯೆಹೋವನು / ಕರ್ತನಾದ ದೇವರು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿರುವ κυρίουಗೆ ನೇರವಾದ ಗೌರವಪೂರ್ಣ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕವನ್ನು ಬಳಸಲಾಗಿದೆ; ಹೀಬ್ರೂ ಹಿನ್ನೆಲೆಯನ್ನು ಆಧರಿಸಿ ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಹೆಚ್ಚುವರಿ ಹೆಸರನ್ನಾಗಲಿ ಪದವನ್ನಾಗಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಪೂರ್ಣ, ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಹೆರೋದನ ಮರಣದವರೆಗೂ’ ಮತ್ತು ‘ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು’ ಎಂಬ ರೂಪಗಳು ಮೂಲದ ರಚನೆ ಮತ್ತು ಕರ್ತೃತ್ವದ ವ್ಯತ್ಯಾಸವನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತವೆ. ಎಲ್ಲ ಅಡಿಕುರಿತು ಗುರುತುಗಳನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಂಬಂಧಿತ ಸ್ಥಳದಲ್ಲೇ ಇರಿಸಲಾಗಿದೆ.
