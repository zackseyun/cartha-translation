- from: ಬಾಬೆಲಿಗೆ ಜನರನ್ನು ಬಲವಂತವಾಗಿ ಒಯ್ದ ನಂತರ[a], ಯೆಕೊನ್ಯನು ಶೆಯಲ್ತಿಯೇಲನಿಗೆ ತಂದೆಯಾದನು; ಶೆಯಲ್ತಿಯೇಲನು ಜೆರುಬ್ಬಾಬೆಲನಿಗೆ ತಂದೆಯಾದನು.
  to: ಬಾಬೆಲಿಗೆ ನಡೆದ ಬಲವಂತದ ಸ್ಥಳಾಂತರದ ನಂತರ[a], ಯೆಕೊನ್ಯನು ಶೆಯಲ್ತಿಯೇಲನ ತಂದೆಯಾದನು; ಶೆಯಲ್ತಿಯೇಲನು ಜೆರುಬ್ಬಾಬೆಲನ ತಂದೆಯಾದನು.
