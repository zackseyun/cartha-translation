id: MAT.1.12
reference: Matthew 1:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: kn
  text: ಬಾಬೆಲಿಗೆ ನಡೆದ ಬಲವಂತದ ಸ್ಥಳಾಂತರದ ನಂತರ[a], ಯೆಕೊನ್ಯನು ಶೆಯಲ್ತಿಯೇಲನ ತಂದೆಯಾದನು; ಶೆಯಲ್ತಿಯೇಲನು ಜೆರುಬ್ಬಾಬೆಲನ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಬಾಬೆಲಿನ ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರ.’ ಗ್ರೀಕ್ ಪದವು ಜನರನ್ನು ಬಲವಂತವಾಗಿ ಬಾಬೆಲಿಗೆ ಸ್ಥಳಾಂತರಿಸಿ ದೇಶಭ್ರಷ್ಟರನ್ನಾಗಿಸಿದ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: ನಂತರ
  rationale: μετά + accusative ಕಾಲಾನುಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ. δέ ಸೌಮ್ಯವಾದ ಸಂಪರ್ಕಕವಾಗಿರುವುದರಿಂದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದೆ ವಾಕ್ಯದ ಹರಿವಿನಲ್ಲಿ ಒಳಗೊಳ್ಳಿಸಲಾಗಿದೆ.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: ಬಾಬೆಲಿಗೆ ಜನರನ್ನು ಬಲವಂತವಾಗಿ ಒಯ್ದ
  rationale: μετοικεσία ಜನರನ್ನು ಅವರ ನೆಲೆಯಿಂದ ಬಲವಂತವಾಗಿ ಸ್ಥಳಾಂತರಿಸಿ ದೇಶಭ್ರಷ್ಟರನ್ನಾಗಿಸಿದ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ವಾಕ್ಯರೂಪವು ಗಮ್ಯಸ್ಥಾನವಾದ ಬಾಬೆಲನ್ನೂ ಬಲವಂತದ ಸ್ವಭಾವವನ್ನೂ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: Ἰεχονίας
  choice: ಯೆಕೊನ್ಯನು
  rationale: ಗ್ರೀಕ್ ಹೆಸರಿನ ಮೂಲರೂಪಕ್ಕೆ ಸಮೀಪವಾಗಿಯೂ ಕನ್ನಡದ ವಿಭಕ್ತಿ ಬಳಕೆಗೆ ಸಹಜವಾಗಿಯೂ ಇರುವ ಲಿಪ್ಯಂತರ.
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯಲ್ಲಿ γεννάω ಪುರುಷ ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಂದೆಯಾದನು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಪ್ರತಿಯೊಂದು ಕೊಂಡಿಯೂ ತಕ್ಷಣದ ಜೈವಿಕ ಪಿತೃತ್ವವೇ ಎಂದು ಅಗತ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: Σαλαθιήλ
  choice: ಶೆಯಲ್ತಿಯೇಲ್
  rationale: ಹೀಬ್ರೂ ಹಿನ್ನೆಲೆಗೆ ಹೊಂದುವ, ಕನ್ನಡದಲ್ಲಿ ಗುರುತಿಸಬಹುದಾದ ಹೆಸರಿನ ರೂಪ; ವಿಭಕ್ತಿಯೊಂದಿಗೆ ‘ಶೆಯಲ್ತಿಯೇಲನಿಗೆ/ಶೆಯಲ್ತಿಯೇಲನು’ ಎಂದು ಬಳಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ;
  rationale: ಎರಡನೆಯ δέ ಮುಂದಿನ ವಂಶಾವಳಿ ಕೊಂಡಿಯನ್ನು ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಅರ್ಧವಿರಾಮವು ಪುನರಾವರ್ತಿತ ಸೂತ್ರದ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: Ζοροβαβέλ
  choice: ಜೆರುಬ್ಬಾಬೆಲ್
  rationale: ಹೀಬ್ರೂ ಹಿನ್ನೆಲೆಗೆ ಹೊಂದುವ ಮತ್ತು ಕನ್ನಡ ಬೈಬಲ್ ಓದುಗರಿಗೆ ಗುರುತಿಸಬಹುದಾದ ರೂಪ; ವಿಭಕ್ತಿಯೊಂದಿಗೆ ‘ಜೆರುಬ್ಬಾಬೆಲನಿಗೆ’ ಎಂದು ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: ವಂಶಾವಳಿಯಲ್ಲಿ γεννάω ಪದದ ಅರ್ಥ
  choice: ‘ತಂದೆಯಾದನು’ ಎಂಬ ವಂಶಾವಳಿ ಸೂತ್ರವನ್ನು ಬಳಸುವುದು
  alternative: ‘ಹುಟ್ಟಿಸಿದನು’ ಅಥವಾ ‘ಜನ್ಮಕೊಟ್ಟನು’
  rationale: ಮತ್ತಾಯನ ವಂಶಾವಳಿ ಪೂರ್ವಜ-ವಂಶಜ ಸಂಬಂಧವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸಬಹುದು. ‘ತಂದೆಯಾದನು’ ಪುರುಷ ವಂಶರೇಖೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಪ್ರತಿಯೊಂದು ಸಂಬಂಧದ ಜೈವಿಕ ತಕ್ಷಣಿಕತೆಯನ್ನು ಅನುವಾದದಲ್ಲೇ ಅನಗತ್ಯವಾಗಿ ನಿಶ್ಚಯಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಪೂರ್ಣವಾದ ವಂಶಾವಳಿ ಶೈಲಿ. ‘ಬಲವಂತವಾಗಿ ಒಯ್ದ’ ಎಂಬ ರೂಪವು ಮೂಲಪದದ ಬಲಾತ್ಕೃತ ಸ್ಥಳಾಂತರದ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪರಂಪರೆಯ ‘ದೇಶಭ್ರಷ್ಟತೆ’ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
