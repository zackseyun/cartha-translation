id: MAT.1.20
reference: Matthew 1:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: kn
  text: ಆದರೆ ಅವನು ಈ ವಿಷಯಗಳನ್ನು ಆಲೋಚಿಸುತ್ತಿರುವಾಗ, ಇಗೋ, ಕರ್ತನ ದೂತನು ಕನಸಿನಲ್ಲಿ ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಂಡು, “ದಾವೀದನ ಮಗನಾದ ಯೋಸೇಫನೇ, ನಿನ್ನ ಹೆಂಡತಿಯಾದ ಮರಿಯಳನ್ನು ಸ್ವೀಕರಿಸಿಕೊಳ್ಳಲು[a] ಹೆದರಬೇಡ; ಏಕೆಂದರೆ ಅವಳಲ್ಲಿ ಉಂಟಾಗಿರುವುದು ಪವಿತ್ರಾತ್ಮನಿಂದ,” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಿನ್ನ ಹೆಂಡತಿಯಾದ ಮರಿಯಳನ್ನು ತೆಗೆದುಕೊಳ್ಳಲು.” ಇಲ್ಲಿ ಬಳಸಿರುವ ಗ್ರೀಕ್ ಪದಬಂಧವು ವಿವಾಹ ಸಂಬಂಧದಲ್ಲಿ ಅವಳನ್ನು ತನ್ನ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಸ್ವೀಕರಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: ಆಲೋಚಿಸುತ್ತಿರುವಾಗ
  rationale: ಯೋಸೇಫನು ವಿಷಯದ ಕುರಿತು ಮನಸ್ಸಿನಲ್ಲಿ ನಡೆಸುತ್ತಿದ್ದ ಆಲೋಚನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅದನ್ನು ಈಗಾಗಲೇ ಕೈಗೊಂಡ ಅಂತಿಮ ನಿರ್ಧಾರವೆಂದು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಕಥನದಲ್ಲಿ ಹಠಾತ್ ಗಮನ ಸೆಳೆಯುವ ಮತ್ತು ಘಟನೆಯನ್ನು ಸಜೀವಗೊಳಿಸುವ ಮೂಲದ ಸಂವಾದಸೂಚಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἄγγελος κυρίου
  choice: ಕರ್ತನ ದೂತನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ἄγγελος ಅನಿರ್ದಿಷ್ಟವಾಗಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ‘ಕರ್ತನ ದೂತನೊಬ್ಬನು’ ಎಂಬುದು ಅಸಹಜವಾಗಿ ಕೇಳಬಹುದು; ‘ಕರ್ತನ ದೂತನು’ ಸಹಜ ಕಥನರೂಪವಾಗಿದ್ದು ನಿರ್ದಿಷ್ಟ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ದೇವದರ್ಶನವೆಂದು ಬಲವಂತಪಡಿಸುವುದಿಲ್ಲ.
- source_word: κατ’ ὄναρ
  choice: ಕನಸಿನಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿನ ಸಹಜ ಮತ್ತು ನೇರ ಕನ್ನಡ ರೂಪ.
- source_word: ἐφάνη
  choice: ಕಾಣಿಸಿಕೊಂಡು
  rationale: ದೈವಿಕ ಪ್ರಕಟಣಾತ್ಮಕ ಪ್ರತ್ಯಕ್ಷತೆಯನ್ನು ಸಹಜ ಕಥನ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: υἱὸς Δαυίδ
  choice: ದಾವೀದನ ಮಗನಾದ
  rationale: ಯೋಸೇಫನ ದಾವೀದ ವಂಶಸಂಬಂಧವನ್ನೂ ಅದರ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: μὴ φοβηθῇς
  choice: ಹೆದರಬೇಡ
  rationale: ನಿಷೇಧವನ್ನೂ ಭಯದ ಭಾವವನ್ನೂ ಸರಳ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: ನಿನ್ನ ಹೆಂಡತಿಯಾದ ಮರಿಯಳನ್ನು ನಿನ್ನ ಮನೆಗೆ ಸೇರಿಸಿಕೊಳ್ಳಲು
  rationale: τὴν γυναῖκά σου ಅನ್ನು ‘ನಿನ್ನ ಹೆಂಡತಿಯಾದ’ ಎಂದು ಉಳಿಸಿ, παραλαμβάνω ಇಲ್ಲಿ ವಿವಾಹ ಸಂಬಂಧದಲ್ಲಿ ಅವಳನ್ನು ತನ್ನ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಸ್ವೀಕರಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂಬ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: ಅವಳಲ್ಲಿ ಉಂಟಾಗಿರುವುದು
  rationale: ನಪುಂಸಕಲಿಂಗದ substantival participle‌ನ ‘what’ ಎಂಬ ತೆರೆಯಾದ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಮಗು’ ಎಂದು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ಸ್ಪಷ್ಟೀಕರಿಸುವುದಿಲ್ಲ.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: ಪವಿತ್ರಾತ್ಮನಿಂದಲೇ
  rationale: ἐκ ಸೂಚಿಸುವ ಮೂಲ ಅಥವಾ ಉಗಮವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಲೇ’ ಕಾರಣದ ವಿರುದ್ಧತೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಒತ್ತಿಹೇಳುತ್ತದೆ.
theological_decisions:
- issue: ἄγγελος κυρίου ಎಂಬ ಪದಬಂಧದಲ್ಲಿನ κυρίου
  choice: ಕರ್ತನ
  alternative: ಯೆಹೋವನ / ಕರ್ತನಾದ ದೇವರ
  rationale: ‘ಕರ್ತನು’ κύριος ಪದದ ನೇರ ಮತ್ತು ಪರಂಪರಿತ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ; ಇದು ಪಠ್ಯಕ್ಕಿಂತ ಮೀರಿ ನಿರ್ದಿಷ್ಟ ದೇವದರ್ಶನದ ಗುರುತನ್ನು ಹೇರದು.
- issue: πνεύματός ... ἁγίου ಎಂಬುದರ ಗುರುತು
  choice: ಪವಿತ್ರಾತ್ಮ
  alternative: ಪವಿತ್ರ ಶಕ್ತಿ / ಒಂದು ಪವಿತ್ರ ಆತ್ಮ
  rationale: ಮತ್ತಾಯನ ಜನನಕಥನದ ಸಂದರ್ಭದಲ್ಲಿ ಇದು ದೈವಿಕ ಪವಿತ್ರಾತ್ಮನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ನಿರ್ಜೀವ ಶಕ್ತಿಯೆಂದಾಗಲಿ ಅನಿರ್ದಿಷ್ಟ ಆತ್ಮವೆಂದಾಗಲಿ ಅನುವಾದಿಸುವುದಿಲ್ಲ.
- issue: ಮರಿಯಳ ವೈವಾಹಿಕ ಸ್ಥಿತಿ
  choice: ನಿನ್ನ ಹೆಂಡತಿಯಾದ ಮರಿಯಳು
  alternative: ಮರಿಯಳನ್ನು ನಿನ್ನ ಹೆಂಡತಿಯಾಗಿ
  rationale: ಗ್ರೀಕ್ τὴν γυναῖκά σου ನೇರವಾಗಿ ‘ನಿನ್ನ ಹೆಂಡತಿ’ ಎಂದು ಹೇಳುತ್ತದೆ. ಹೀಗಾಗಿ ಅವಳು ಈಗ ಹೆಂಡತಿಯಾಗಲಿರುವಳು ಎಂಬ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸದೆ, παραλαβεῖν‌ನ ಗೃಹಕ್ಕೆ ಸ್ವೀಕರಿಸುವ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬ ಎತ್ತರದ ಸಂವಾದಸೂಚಕವನ್ನು ಮೂಲದ ಕಥನಾತ್ಮಕ ಒತ್ತಿಗಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ‘ನಿನ್ನ ಮನೆಗೆ ಸೇರಿಸಿಕೊಳ್ಳಲು’ ಎಂಬ ರೂಪವು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ನಿಶ್ಚಿತಾರ್ಥದ ನಂತರದ ವೈವಾಹಿಕ ಸ್ವೀಕಾರವನ್ನು ಗ್ರಹಿಸಲು ನೆರವಾಗುತ್ತದೆ; ಅಡಿಕುರಿಪು ನೇರ ಪರ್ಯಾಯವನ್ನು ಕೊಡುತ್ತದೆ.
