id: MAT.1.18
reference: Matthew 1:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: kn
  text: 'ಮೆಸ್ಸೀಯನಾದ ಯೇಸುವಿನ ಜನನವು ಹೀಗೆ ಸಂಭವಿಸಿತು: ಅವನ ತಾಯಿ ಮರಿಯಳು ಯೋಸೇಫನಿಗೆ ನಿಶ್ಚಿತಾರ್ಥವಾಗಿದ್ದಾಗ[a], ಅವರು ಸೇರಿಕೊಳ್ಳುವ ಮೊದಲು[c], ಅವಳು ಪವಿತ್ರಾತ್ಮನಿಂದ ಗರ್ಭಿಣಿಯಾಗಿದ್ದಳೆಂದು ತಿಳಿದುಬಂತು.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಯೇಸು ಕ್ರಿಸ್ತನ.’ ಗ್ರೀಕ್‌ನ Χριστός ಎಂಬ ಬಿರುದಿನ ಅರ್ಥವನ್ನು ಉಳಿಸಲು ಇಲ್ಲಿ ‘ಮೆಸ್ಸೀಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: alternative_reading
  - marker: c
    text: ‘ಸೇರಿಕೊಳ್ಳುವುದು’ ಎಂಬುದು ದಾಂಪತ್ಯವಾಗಿ ಸೇರುವುದನ್ನು, ಅದರಲ್ಲೂ ವಿವಾಹ ಸಂಬಂಧವನ್ನು ಪೂರ್ಣಗೊಳಿಸುವುದನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: ಜನನ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಈ ಪದವು ಯೇಸುವಿನ ಹುಟ್ಟು ಅಥವಾ ಲೋಕಕ್ಕೆ ಬಂದ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮೂಲ’ ಎಂಬುದಕ್ಕಿಂತ ‘ಜನನ’ ನಿರೂಪಣೆಗೆ ಸಹಜವಾಗಿದೆ.
- source_word: Ἰησοῦ χριστοῦ
  choice: ಯೇಸು ಮೆಸ್ಸೀಯ
  rationale: Χριστός ಇಲ್ಲಿ ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ಅದರ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಅರ್ಥವನ್ನು ಉಳಿಸಲು ‘ಮೆಸ್ಸೀಯ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: οὕτως ἦν
  choice: ಹೀಗೆ ಸಂಭವಿಸಿತು
  rationale: ಮುಂದೆ ವಿವರಿಸಲಾಗುವ ಘಟನೆ ನಡೆದ ರೀತಿಯನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μνηστευθείσης
  choice: ನಿಶ್ಚಿತಾರ್ಥವಾಗಿದ್ದಾಗ
  rationale: ವಿವಾಹಕ್ಕೆ ಮುಂಚಿನ ಅಧಿಕೃತ ಬದ್ಧತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆ ಕಾಲದ ಕಾನೂನುಬದ್ಧ ಗಂಭೀರತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: ಅವರು ಒಂದಾಗುವುದಕ್ಕಿಂತ ಮುಂಚೆ
  rationale: ಗ್ರೀಕ್‌ನ ಮಿತಭಾಷೆಯನ್ನೂ, ದಾಂಪತ್ಯವಾಗಿ ಸೇರುವ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನೂ ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: εὑρέθη
  choice: ಕಂಡುಬಂತು
  rationale: ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಯಾರು ಕಂಡುಕೊಂಡರು ಎಂಬುದನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: ಗರ್ಭಿಣಿಯಾಗಿರುವುದು
  rationale: ‘ಗರ್ಭದಲ್ಲಿ ಹೊಂದಿರುವುದು’ ಎಂಬ ಮೂಲ ನುಡಿಗಟ್ಟಿನ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡ ಅರ್ಥ.
- source_word: ἐκ πνεύματος ἁγίου
  choice: ಪವಿತ್ರಾತ್ಮನಿಂದ
  rationale: ἐκ ಸೂಚಿಸುವ ಮೂಲ ಅಥವಾ ಉಗಮದ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ಸಂದರ್ಭವು ದೈವಿಕ ಪವಿತ್ರಾತ್ಮನನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: Χριστός ಪದದ ನಿರೂಪಣೆ
  choice: ಮೆಸ್ಸೀಯ
  alternative: ಕ್ರಿಸ್ತನು
  rationale: ಇಲ್ಲಿ ಪದವು ಕೇವಲ ಹೆಸರಿನ ಭಾಗವಾಗದೆ ಬಿರುದಿನಂತೆ ಬಳಕೆಯಾಗಿದೆ. ‘ಮೆಸ್ಸೀಯ’ ಅದರ ಬಿರುದಾತ್ಮಕ ಅರ್ಥವನ್ನು ಮುಂದಿರಿಸುತ್ತದೆ; ಪರಿಚಿತ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: πνεύματος ἁγίου ಪದಗುಚ್ಛದ ಉಲ್ಲೇಖ
  choice: ಪವಿತ್ರಾತ್ಮ
  alternative: ಪವಿತ್ರ ಆತ್ಮ / ಒಬ್ಬ ಪವಿತ್ರಾತ್ಮ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಉಪಪದ ಇಲ್ಲದಿದ್ದರೂ, ಮತ್ತಾಯನ ಜನನ ವೃತ್ತಾಂತದ ಸಂದರ್ಭದಲ್ಲಿ ಇದು ಅನಿರ್ದಿಷ್ಟ ಆತ್ಮಿಕ ಶಕ್ತಿಯನ್ನಲ್ಲ, ದೈವಿಕ ಪವಿತ್ರಾತ್ಮನನ್ನೇ ಸೂಚಿಸುತ್ತದೆ.
- issue: συνελθεῖν ಪದದ ದಾಂಪತ್ಯ ಸೂಚನೆ
  choice: ಒಂದಾಗುವುದು
  alternative: ಒಟ್ಟಿಗೆ ವಾಸಿಸುವುದು / ಲೈಂಗಿಕ ಸಂಬಂಧ ಹೊಂದುವುದು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಮಿತಭಾಷೆ ಮತ್ತು ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಿ, ದಾಂಪತ್ಯ ಸಂಗಮದ ಸಾಧ್ಯ ಸೂಚನೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ನಿರೂಪಣೆ ಬಳಸಲಾಗಿದೆ. ‘ಹೀಗೆ ಸಂಭವಿಸಿತು’ ವೃತ್ತಾಂತದ ಪರಿಚಯವನ್ನು ಸರಳವಾಗಿ ಕೊಡುತ್ತದೆ; ‘ಒಂದಾಗುವುದು’ ಮೂಲದ ಮಿತಭಾಷೆ ಮತ್ತು ಉದ್ದೇಶಿತ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
