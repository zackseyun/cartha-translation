- from: 'ಯೇಸು ಮೆಸ್ಸೀಯನ[a] ಜನನವು ಹೀಗೆ ಸಂಭವಿಸಿತು: ಅವನ ತಾಯಿ ಮರಿಯಳು ಯೋಸೇಫನಿಗೆ ನಿಶ್ಚಿತಾರ್ಥವಾಗಿದ್ದಾಗ[b], ಅವರು ಒಂದಾಗುವುದಕ್ಕಿಂತ ಮುಂಚೆ[c], ಅವಳು ಪವಿತ್ರಾತ್ಮನಿಂದ ಗರ್ಭಿಣಿಯಾಗಿರುವುದು ಕಂಡುಬಂತು.'
  to: 'ಮೆಸ್ಸೀಯನಾದ ಯೇಸುವಿನ ಜನನವು ಹೀಗೆ ಸಂಭವಿಸಿತು: ಅವನ ತಾಯಿ ಮರಿಯಳು ಯೋಸೇಫನಿಗೆ ನಿಶ್ಚಿತಾರ್ಥವಾಗಿದ್ದಾಗ[a], ಅವರು ಸೇರಿಕೊಳ್ಳುವ ಮೊದಲು[c], ಅವಳು ಪವಿತ್ರಾತ್ಮನಿಂದ ಗರ್ಭಿಣಿಯಾಗಿದ್ದಳೆಂದು ತಿಳಿದುಬಂತು.'
  rationale: ಕಾಲಸೂಚಕ ವಾಕ್ಯರಚನೆಯನ್ನು ಸರಿಪಡಿಸಿ, Χριστός ಎಂಬ ಬಿರುದಿಗೆ ಸಹಜ ಕನ್ನಡ ಪದಕ್ರಮವನ್ನು ಒದಗಿಸಲಾಗಿದೆ. ‘ಸೇರಿಕೊಳ್ಳುವುದು’ ಮತ್ತು ಅದರ ಪಾದಟಿಪ್ಪಣಿ ಮೂಲದಲ್ಲಿರುವ ಮಿತಭಾಷೆ ಹಾಗೂ ದಾಂಪತ್ಯ ಸಂಗಮ/ಒಟ್ಟಿಗೆ ಬರುವುದು ಎಂಬ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಉಳಿಸುತ್ತವೆ. ಪಾದಟಿಪ್ಪಣಿ a ಯ ನಂಗೂರನ್ನು ‘ಮೆಸ್ಸೀಯ’ಗೆ, b ಯನ್ನು ‘ನಿಶ್ಚಿತಾರ್ಥ’ಕ್ಕೆ, c ಯನ್ನು ‘ಸೇರಿಕೊಳ್ಳುವ’ಗೆ ಸರಿಯಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
