id: MAT.1.16
reference: Matthew 1:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: kn
  text: ಯಾಕೋಬನು ಮರಿಯಳ ಗಂಡನಾದ ಯೋಸೇಫನಿಗೆ ತಂದೆಯಾದನು. ಆ ಮರಿಯಳಿಂದ ಮೆಸ್ಸೀಯನೆಂದು ಕರೆಯಲ್ಪಡುವ ಯೇಸು ಹುಟ್ಟಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಕ್ರಿಸ್ತನೆಂದು ಕರೆಯಲ್ಪಡುವ ಯೇಸು.”
    reason: Χριστός ಎಂಬ ಗ್ರೀಕ್ ಬಿರುದನ್ನು ‘ಕ್ರಿಸ್ತನು’ ಎಂದೂ ನಿರೂಪಿಸಬಹುದು; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅದರ ಬಿರುದಿನ ಕಾರ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಮೆಸ್ಸೀಯ’ ಬಳಸಲಾಗಿದೆ.
lexical_decisions:
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸದೆ, ವಂಶಾವಳಿಯ ಸಹಜ ಮುಂದುವರಿಕೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ
  rationale: ಇಲ್ಲಿ δέ ವಿರೋಧವನ್ನು ಸೂಚಿಸುವುದಕ್ಕಿಂತ ವಂಶಾವಳಿಯನ್ನು ಸೌಮ್ಯವಾಗಿ ಮುಂದುವರಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿ ವಾಕ್ಯದ ಆರಂಭದಲ್ಲಿ ‘ಮತ್ತು’ ಎನ್ನುವುದು ಕೃತಕವಾಗಿ ಕೇಳುವುದರಿಂದ, ವಾಕ್ಯಕ್ರಮವೇ ಅದರ ಸಂಪರ್ಕಕಾರ್ಯವನ್ನು ಹೊರುತ್ತದೆ.
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯಲ್ಲಿ ಗಂಡಿನ ಮೂಲಕ ಸಂತಾನಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಂದೆಯಾದನು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಪುರಾತನ ಅಥವಾ ಅಸ್ಪಷ್ಟ ಪದಪ್ರಯೋಗವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: τὸν ἄνδρα Μαρίας
  choice: ಮರಿಯಳ ಗಂಡನಾದ
  rationale: ಮರಿಯಳೊಂದಿಗಿನ ಷಷ್ಠೀ ಸಂಬಂಧದಲ್ಲಿ ἀνήρ ಸ್ಪಷ್ಟವಾಗಿ ‘ಗಂಡ’ ಎಂಬ ವೈವಾಹಿಕ ಅರ್ಥವನ್ನು ಹೊಂದಿದೆ.
- source_word: ἐξ ἧς
  choice: ಆ ಮರಿಯಳಿಂದ
  rationale: ಸ್ತ್ರೀಲಿಂಗ ಏಕವಚನ ಸಂಬಂಧಸರ್ವನಾಮವು ನಿರ್ದಿಷ್ಟವಾಗಿ ಮರಿಯಳನ್ನೇ ಸೂಚಿಸುತ್ತದೆ. ‘ಆ ಮರಿಯಳಿಂದ’ ಎಂಬುದು ಈ ಉಲ್ಲೇಖವನ್ನೂ ἐκ ಎಂಬ ಮೂಲ/ಉಗಮದ ಅರ್ಥವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐγεννήθη
  choice: ಹುಟ್ಟಿದನು
  rationale: ಕ್ರಿಯಾಪದವು ಇಲ್ಲಿ ಕರ್ಮಣಿ ರೂಪದಲ್ಲಿದ್ದು, ಯೋಸೇಫನ ಕುರಿತು ಬಳಸಿದ ಸಕ್ರಿಯ ‘ತಂದೆಯಾದನು’ ಎಂಬ ವಂಶಾವಳಿ ಸೂತ್ರದಿಂದ ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಬದಲಾಗುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಹುಟ್ಟಿದನು’ ಸಹಜವಾಗಿ ಜನನವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: ὁ λεγόμενος
  choice: ಎಂದು ಕರೆಯಲ್ಪಡುವ
  rationale: ಯೇಸುವಿಗೆ ಬಳಕೆಯಾದ ಬಿರುದನ್ನು ನೇರವಾಗಿ ಗುರುತಿಸುವ ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: χριστός
  choice: ಮೆಸ್ಸೀಯ
  rationale: ಈ ಗುರುತಿಸುವ ವಾಕ್ಯದಲ್ಲಿ Χριστός ಹೆಸರುಸಮಾನ ರೂಪಕ್ಕಿಂತ ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ; ಆದ್ದರಿಂದ ಅದರ ಅಭಿಷಿಕ್ತ ರಾಜನ ಅರ್ಥವನ್ನು ಸೂಚಿಸುವ ‘ಮೆಸ್ಸೀಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: Χριστός ಅನ್ನು ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಗುರುತಿಸುವ ಸೂತ್ರದಲ್ಲಿ ಹೇಗೆ ನಿರೂಪಿಸಬೇಕು
  choice: ಮೆಸ್ಸೀಯ
  alternative: ಕ್ರಿಸ್ತನು
  rationale: ὁ λεγόμενος χριστός ಎಂಬುದು χριστός ಅನ್ನು ಯೇಸುವಿನ ಬಿರುದಾಗಿ ಮಂಡಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಬಿರುದಿನ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಅರ್ಥವನ್ನು ಉಳಿಸುವ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಳಸಲಾಗಿದೆ; ಪರಿಚಿತ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ಯೋಸೇಫನ ವಂಶಸಂಬಂಧದಿಂದ ಯೇಸುವಿನ ಜನನಕ್ಕೆ ಬರುವ ಪದಪ್ರಯೋಗದ ಬದಲಾವಣೆ
  choice: ಯಾಕೋಬನು ಯೋಸೇಫನಿಗೆ ತಂದೆಯಾದನು; ಯೇಸು ಮರಿಯಳಿಂದ ಹುಟ್ಟಿದನು
  alternative: ಒಂದೇ ರೀತಿಯ ‘ತಂದೆಯಾದನು’ ಎಂಬ ವಂಶಾವಳಿ ಸೂತ್ರವನ್ನು ಎರಡೂ ಸಂಬಂಧಗಳಿಗೆ ಬಳಸುವುದು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಯಾಕೋಬನ ಕುರಿತು ಸಕ್ರಿಯ ἐγέννησεν ಅನ್ನು ಬಳಸಿದ ನಂತರ, ಸ್ತ್ರೀಲಿಂಗ ἐξ ἧς ಜೊತೆಗೆ ಕರ್ಮಣಿ ἐγεννήθηಗೆ ಬದಲಾಗುತ್ತದೆ. ಅನುವಾದವು ಯೋಸೇಫನು ಯೇಸುವಿಗೆ ತಂದೆಯಾದನು ಎಂದು ಸೇರಿಸದೆ, ಈ ಉದ್ದೇಶಿತ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ವಂಶಾವಳಿ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಪಡೆದನು’ ಅಥವಾ ಪುರಾತನ ‘ಜನ್ಮಕೊಟ್ಟನು’ ಎಂಬ ಅಸಹಜ ರೂಪಗಳ ಬದಲು ‘ತಂದೆಯಾದನು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದೀರ್ಘ ಗ್ರೀಕ್ ವಾಕ್ಯವನ್ನು ಕನ್ನಡದ ಸ್ಪಷ್ಟತೆಗೆ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿಭಜಿಸಿದರೂ, ಮರಿಯಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಸ್ತ್ರೀಲಿಂಗ ಉಲ್ಲೇಖ ಮತ್ತು ಯೇಸುವಿನ ಜನನದ ಪದಪ್ರಯೋಗದ ಬದಲಾವಣೆ ಉಳಿಸಲಾಗಿದೆ.
