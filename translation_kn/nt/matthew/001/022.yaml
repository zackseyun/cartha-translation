id: MAT.1.22
reference: Matthew 1:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: kn
  text: 'ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು ಹೇಳಿದ ಮಾತು ನೆರವೇರುವಂತೆ ಇದೆಲ್ಲವೂ ಸಂಭವಿಸಿತು; ಪ್ರವಾದಿಯು ಹೀಗೆಂದು ಹೇಳಿದನು:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: ಇದೆಲ್ಲವೂ
  rationale: τοῦτο ಎಂಬ ಏಕವಚನ ಸೂಚಕವು ಹಿಂದಿನ ಘಟನೆಗಳನ್ನು ಒಟ್ಟಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ὅλον ಅವುಗಳ ಸಮಗ್ರತೆಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ. ‘ಇದೆಲ್ಲವೂ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಈ ಎರಡೂ ಅಂಶಗಳನ್ನು ಉಳಿಸುತ್ತದೆ. δὲ ಇಲ್ಲಿ ಬಲವಾದ ವಿರೋಧಕ್ಕಿಂತ ನಿರೂಪಣೆಯ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಆದರೆ’ ಎಂದು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: γέγονεν
  choice: ಸಂಭವಿಸಿತು
  rationale: γίνομαι ಕ್ರಿಯಾಪದದ perfect ರೂಪವು ನಡೆದ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆಧುನಿಕ ಕನ್ನಡದ ನಿರೂಪಣೆಯಲ್ಲಿ ‘ಸಂಭವಿಸಿತು’ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆಗಿದೆ.
- source_word: ἵνα πληρωθῇ
  choice: ನೆರವೇರುವಂತೆ
  rationale: ἵνα ಮತ್ತು passive subjunctive ಸೇರಿ ಉದ್ದೇಶ ಅಥವಾ ಫಲಿತಾಂಶ—ಅಥವಾ ಎರಡನ್ನೂ—ಸೂಚಿಸಬಹುದು. ‘ನೆರವೇರುವಂತೆ’ ಆ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು ಹೇಳಿದ ಮಾತು
  rationale: ὑπό ಕರ್ತನನ್ನು ಮೂಲ ವಕ್ತಾರನಾಗಿ ಮತ್ತು διά ಪ್ರವಾದಿಯನ್ನು ಮಧ್ಯವರ್ತಿಯಾಗಿ ಗುರುತಿಸುತ್ತದೆ. ಕನ್ನಡದ ಈ ಪದಕ್ರಮವು ಆ ಭೇದವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λέγοντος
  choice: ಪ್ರವಾದಿ ಹೀಗೆ ಹೇಳಿದ್ದನು
  rationale: ಈ genitive participle ಮುಂದಿನ ವಚನದ ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ ಮತ್ತು ವ್ಯಾಕರಣದ ದೃಷ್ಟಿಯಿಂದ ‘ಪ್ರವಾದಿ’ಗೆ ಸಂಬಂಧಿಸಿದೆ. ಸ್ವತಂತ್ರ ಕನ್ನಡ ವಾಕ್ಯವಾಗಿ ರೂಪಿಸುವುದು ಸಹಜವಾಗಿದ್ದು ಉಲ್ಲೇಖದ ಪ್ರವೇಶವನ್ನೂ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪ್ರವಾದನೆಯಲ್ಲಿ ವಕ್ತೃತ್ವದ ಕರ್ತೃತ್ವ
  choice: ಕರ್ತನು ಮೂಲ ವಕ್ತಾರ; ಪ್ರವಾದಿ ಮಧ್ಯವರ್ತಿ ಎಂಬ ಭೇದವನ್ನು ‘ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು ಹೇಳಿದ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಪ್ರವಾದಿಯು ಕರ್ತನಿಂದ ಹೇಳಿದ ಮಾತು
  rationale: ಗ್ರೀಕ್‌ನ ὑπό + genitive ಮತ್ತು διά + genitive ವಿಭಿನ್ನ ಪಾತ್ರಗಳನ್ನು ಸೂಚಿಸುತ್ತವೆ. ಆಯ್ದ ಅನುವಾದವು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಪ್ರೇರಣಾ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸದೆ ಆ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
- issue: ನೆರವೇರುವಿಕೆಯ ಸೂತ್ರ
  choice: ‘ನೆರವೇರುವಂತೆ’
  alternative: ‘ಇದರಿಂದ ... ನೆರವೇರಿತು’ ಅಥವಾ ‘ನೆರವೇರಿಸುವುದಕ್ಕಾಗಿ’
  rationale: ἵνα + subjunctive ಉದ್ದೇಶ ಮತ್ತು ಫಲಿತಾಂಶದ ನಡುವಿನ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ. ಆಯ್ದ ರೂಪವು ಒಂದೇ ಅರ್ಥವನ್ನು ಬಲವಂತವಾಗಿ ನಿಗದಿಪಡಿಸದೆ ಮತ್ತಾಯನ ನೆರವೇರುವಿಕೆಯ ಭಾಷೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ನಿರೂಪಣಾಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಅಸಹಜವಾದ ಶಬ್ದಶಃ passive ರೂಪವನ್ನು ತಪ್ಪಿಸಿ ‘ನೆರವೇರುವಂತೆ’ ಎಂದಿದ್ದರೂ ಮೂಲದ ಉದ್ದೇಶ/ಫಲಿತಾಂಶದ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುವ λέγοντος ಅನ್ನು ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ಪ್ರತ್ಯೇಕ ವಾಕ್ಯವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ.
