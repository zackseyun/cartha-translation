  to: 'ಪ್ರವಾದಿಯ ಮೂಲಕ ಕರ್ತನು ಹೇಳಿದ ಮಾತು ನೆರವೇರುವಂತೆ ಇದೆಲ್ಲವೂ ಸಂಭವಿಸಿತು; ಪ್ರವಾದಿಯು ಹೀಗೆಂದು ಹೇಳಿದನು:'
