id: MAT.1.7
reference: Matthew 1:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: kn
  text: ಸೊಲೊಮೋನನು ರೆಹಬ್ಬಾಮನ ತಂದೆಯಾದನು; ರೆಹಬ್ಬಾಮನು ಅಬೀಯನ ತಂದೆಯಾದನು; ಅಬೀಯನು ಆಸಾಫನ[a] ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ ‘ಆಸ’ ಎಂದಿದೆ. ಇದು 1 ಅರಸುಗಳು 15 ಮತ್ತು 2 ಪೂರ್ವಕಾಲವೃತ್ತಾಂತ 14–16ರಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಯೆಹೂದದ ಅರಸನ ಹೆಸರಿಗೆ ಹೊಂದುತ್ತದೆ; ಇಲ್ಲಿ ಅನುಸರಿಸಿರುವ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿ ‘ಆಸಾಫ’ ಎಂದಿದೆ.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಪುರುಷನ ಮೂಲಕ ಸಂತಾನೋತ್ಪತ್ತಿ ಮತ್ತು ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಂದೆಯಾದನು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆಗಿದ್ದು, ಅತಿಯಾಗಿ ಪುರಾತನವಾಗಿ ಕೇಳಿಸುವ ರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ; (ವಾಕ್ಯಕ್ರಮದಿಂದ ಸಂಪರ್ಕ ಸೂಚಿಸಲಾಗಿದೆ)
  rationale: ಇಲ್ಲಿ δέ ವಿರೋಧಾರ್ಥಕವಲ್ಲ; ವಂಶಾವಳಿಯ ಸರಣಿಯನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಪರ್ಕಕ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಸಲವೂ ‘ಮತ್ತು’ ಸೇರಿಸುವುದಕ್ಕಿಂತ ಸಮಾನಾಂತರ ವಾಕ್ಯಖಂಡಗಳು ಮತ್ತು ಅರ್ಧವಿರಾಮಗಳು ಸಂಪರ್ಕವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ.
- source_word: Σολομών
  choice: ಸೊಲೊಮೋನನು
  rationale: ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪ; ಕರ್ತೃವಿಭಕ್ತಿಗೆ ‘ನು’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: Ῥοβοάμ
  choice: ರೆಹಬ್ಬಾಮನು
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಹೆಸರಿನೊಂದಿಗೆ ಓದುಗರಿಗೆ ಗುರುತಿಸಬಹುದಾದ ಕನ್ನಡ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ἀβιά
  choice: ಅಬೀಯನು
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ರಾಜನ ಹೆಸರಿನೊಂದಿಗೆ ನಿರಂತರತೆ ಕಾಪಾಡುವ, ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪ.
- source_word: Ἀσάφ
  choice: ಆಸಾಫನು
  rationale: ಕೊಟ್ಟಿರುವ SBLGNT ಗ್ರೀಕ್ ಪಾಠವು Ἀσάφ ಎಂದು ಓದುತ್ತದೆ. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ‘ಆಸಾಫ’ ಉಳಿಸಿ, ‘ಆಸ’ ಎಂಬ ಪರ್ಯಾಯ ಪಾಠವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ ವಂಶಾವಳಿಯನ್ನು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಯೆಹೂದದ ಅರಸರ ಪಟ್ಟಿಗೆ ಹೊಂದಿಸಲು Ἀσάφ ಅನ್ನು ‘ಆಸ’ ಎಂದು ಭಾಷಾಂತರಿಸಬೇಕೇ?
  choice: ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ‘ಆಸಾಫ’ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಆಸ’ ಎಂದು ಓದುವುದು; ಇದು 1 ಅರಸುಗಳು 15 ಮತ್ತು 2 ಪೂರ್ವಕಾಲವೃತ್ತಾಂತ 14–16ರಲ್ಲಿ ಬರುವ ಯೆಹೂದದ ಅರಸನ ಹೆಸರಿಗೆ ಹೊಂದುತ್ತದೆ.
  rationale: ಒದಗಿಸಿದ ಗ್ರೀಕ್ ಮೂಲಪಾಠದಲ್ಲಿ Ἀσάφ ಇದೆ. ಮೂಲಪಾಠಕ್ಕೆ ಆದ್ಯತೆ ನೀಡಿ ಅದನ್ನು ಮೌನವಾಗಿ ಸಮನ್ವಯಗೊಳಿಸದೆ ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ; ಪಾಠಾಂತರವನ್ನು ಪಾರದರ್ಶಕವಾಗಿ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಗೌರವಯುತ ವಂಶಾವಳಿ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಹೆಸರುಗಳಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಬೈಬಲ್ ರೂಪಗಳನ್ನು ಬಳಸಿದ್ದು, ಮೂಲ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿರುವ ಗಮನಾರ್ಹ ಪಾಠಭೇದವನ್ನು ಮುಖ್ಯ ಪಾಠ ಮತ್ತು ಅಡಿಕುರಿಪಿನ ಮೂಲಕ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
