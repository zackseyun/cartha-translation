id: MAT.1.13
reference: Matthew 1:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: kn
  text: ಜೆರುಬ್ಬಾಬೆಲನು ಅಬೀಹೂದನ ತಂದೆಯಾದನು[a]; ಅಬೀಹೂದನು ಎಲ್ಯಾಕೀಮನ ತಂದೆಯಾದನು; ಎಲ್ಯಾಕೀಮನು ಅಜೋರನ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅಬೀಹೂದನನ್ನು ಹುಟ್ಟಿಸಿದನು’; ಸತ್ಯವೇದದ ವಂಶಾವಳಿಗಳಲ್ಲಿ ಪುನರಾವರ್ತನೆಯಾಗುವ ಈ ಕ್ರಿಯಾಪದವು ಕೆಲವೊಮ್ಮೆ ತಲೆಮಾರುಗಳನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: ಜೆರುಬ್ಬಾಬೆಲ್
  rationale: ಹೆಸರನ್ನು ಅನುವಾದಿಸದೆ, ಮೂಲ ಗ್ರೀಕ್ ರೂಪವನ್ನೂ ಕನ್ನಡದ ಪ್ರಚಲಿತ ಸತ್ಯವೇದ ನಾಮರೂಪವನ್ನೂ ಗಮನಿಸಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: δέ
  choice: — / ;
  rationale: ವಂಶಾವಳಿಯ ಸರಣಿಯನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಬಂಧಸೂಚಕ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿ ಉಪವಾಕ್ಯದಲ್ಲೂ ‘ಮತ್ತು’ ಎಂದು ಪುನರಾವರ್ತಿಸುವ ಬದಲು ವಿರಾಮಚಿಹ್ನೆಯಿಂದ ಸಹಜವಾದ ಸಂಚಿತ ಹರಿವು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ಪುರುಷ ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದಕ್ಕೆ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ. ‘ಹುಟ್ಟಿಸಿದನು’ ಎಂಬ ಕೃತಕ/ನೇರ ದೈಹಿಕ ಧ್ವನಿಯನ್ನು ತಪ್ಪಿಸಿ, ವಂಶಾವಳಿಯ ಸೂತ್ರರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Ἀβιούδ
  choice: ಅಬೀಹೂದ್
  rationale: ಗ್ರೀಕ್ ವೈಯಕ್ತಿಕ ಹೆಸರನ್ನು ಕನ್ನಡ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಉಚ್ಚರಿಸಬಹುದಾದ ರೂಪದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: Ἐλιακίμ
  choice: ಎಲ್ಯಾಕೀಮ್
  rationale: ಗ್ರೀಕ್ ಹೆಸರಿನ ಧ್ವನಿಗೆ ಸಮೀಪವಾಗಿದ್ದು, ಕನ್ನಡದ ಸತ್ಯವೇದ ಬಳಕೆಗೆ ಹೊಂದುವ ಲಿಪ್ಯಂತರ.
- source_word: Ἀζώρ
  choice: ಅಜೋರ್
  rationale: ಗ್ರೀಕ್ ಹೆಸರನ್ನು ದೀರ್ಘಸ್ವರದ ಧ್ವನಿಯನ್ನು ಪ್ರತಿಬಿಂಬಿಸುವ, ಓದಲು ಸಹಜವಾದ ಕನ್ನಡ ರೂಪದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ವಂಶಾವಳಿಯಲ್ಲಿ γεννάω ಕ್ರಿಯಾಪದವು ತಲೆಮಾರುಗಳನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸಬಹುದಾದ ಸಾಧ್ಯತೆ
  choice: ತಂದೆಯಾದನು
  alternative: ಪೂರ್ವಜನಾದನು / ಅವನಿಂದ ವಂಶವು ಮುಂದುವರಿಯಿತು
  rationale: ‘ತಂದೆಯಾದನು’ ಮೂಲದ ಪುನರಾವರ್ತಿತ ವಂಶಾವಳಿ ಸೂತ್ರಕ್ಕೆ ನೇರವಾಗಿ ಹೊಂದಿ, ಪ್ರತಿಯೊಂದು ಕೊಂಡಿಯೂ ತಕ್ಷಣದ ತಂದೆ–ಮಗ ಸಂಬಂಧವೇ ಎಂಬ ಪ್ರಶ್ನೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯ ಮೂಲಕ ಮುಕ್ತವಾಗಿರಿಸುತ್ತದೆ. ‘ಪೂರ್ವಜನಾದನು’ ಎಂದು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಕೊಡುವುದು ಸಂಕ್ಷಿಪ್ತ ವಂಶಕ್ರಮದ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸಿಬಿಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಗೌರವಯುತ ವಂಶಾವಳಿ ಶೈಲಿ. ಹೆಸರುಗಳ ವಿಭಕ್ತಿರೂಪಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜವಾಗಿ ಬಂದರೂ, ನಿಘಂಟು ರೂಪಗಳನ್ನು ಪದನಿರ್ಣಯಗಳಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ನೀಡಲಾಗಿದೆ.
