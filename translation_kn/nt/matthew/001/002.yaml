    reason: lexical_alternative
  revision_rationale: The revision preserves the source's stepwise genealogy and mild connective flow while clarifying that the brothers are Judah's. It retains the modern, non-archaic ‘ತಂದೆಯಾದನು’ and supplies a conventional alternative in the footnote without adding claims about whether every genealogical link is immediate.
