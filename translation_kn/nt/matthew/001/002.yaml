id: MAT.1.2
reference: Matthew 1:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: kn
  text: ಅಬ್ರಹಾಮನು ಇಸಾಕನ ತಂದೆಯಾದನು[a]; ಇಸಾಕನು ಯಾಕೋಬನ ತಂದೆಯಾದನು; ಯಾಕೋಬನು ಯೆಹೂದನ ಹಾಗೂ ಅವನ ಸಹೋದರರ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಇಸಾಕನನ್ನು ಹೆತ್ತನು.’ ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವನ್ನು ಹೀಗೆ ಸಹ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಈ ಕ್ರಿಯಾಪದವು ಪುರುಷನ ಮೂಲಕ ಸಂತಾನೋತ್ಪತ್ತಿ ಅಥವಾ ಪಿತೃವಂಶದ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಂದೆಯಾದನು’ ಎಂಬುದು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆಗಿದ್ದು, ನೇರ ತಂದೆ-ಮಗ ಸಂಬಂಧವೋ ಅಥವಾ ವಿಶಾಲ ವಂಶಸಂಬಂಧವೋ ಎಂಬುದನ್ನು ಅನಗತ್ಯವಾಗಿ ತೀರ್ಮಾನಿಸುವುದಿಲ್ಲ.
- source_word: δὲ
  choice: ವಾಕ್ಯಕ್ರಮ ಮತ್ತು ವಿರಾಮಚಿಹ್ನೆಗಳ ಮೂಲಕ ಮೃದುವಾದ ಮುಂದುವರಿಕೆ
  rationale: ಇಲ್ಲಿ δέ ವಿರೋಧವನ್ನು ಸೂಚಿಸುವುದಕ್ಕಿಂತ ವಂಶಾವಳಿಯ ಮುಂದಿನ ಹಂತವನ್ನು ಜೋಡಿಸುತ್ತದೆ. ಪ್ರತಿಸಾರಿ ‘ಮತ್ತು’ ಎಂದು ಹಾಕುವುದಕ್ಕಿಂತ ಕನ್ನಡದಲ್ಲಿ ಅಲ್ಪವಿರಾಮ/ಅರ್ಧವಿರಾಮದ ಕ್ರಮ ಸಹಜವಾಗಿ ಅದೇ ಮುಂದುವರಿಕೆಯನ್ನು ನೀಡುತ್ತದೆ.
- source_word: Ἰούδαν
  choice: ಯೆಹೂದ
  rationale: ಇಲ್ಲಿ ಉಲ್ಲೇಖವಾಗಿರುವವನು ಯಾಕೋಬನ ಮಗನಾದ ಪಿತಾಮಹ ಯೆಹೂದನು; ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಯೂದನಲ್ಲ. ಆದ್ದರಿಂದ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ‘ಯೆಹೂದ’ ರೂಪವನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ಅವನ ಸಹೋದರರು
  rationale: ಗ್ರೀಕ್ ಪದವು ಇಲ್ಲಿ ಯೆಹೂದನ ಪುರುಷ ಸಹೋದರರನ್ನು, ಅಂದರೆ ಯಾಕೋಬನ ಇತರ ಪುತ್ರರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಹೀಗಾಗಿ ಲಿಂಗ ಮತ್ತು ಸಂದರ್ಭ ಎರಡನ್ನೂ ನಿಖರವಾಗಿ ಉಳಿಸುವ ‘ಅವನ ಸಹೋದರರು’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: ಅಬ್ರಹಾಮ / ಇಸಾಕ / ಯಾಕೋಬ
  rationale: ವ್ಯಕ್ತಿನಾಮಗಳಿಗೆ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾಗಿರುವ ಲಿಪ್ಯಂತರ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: ವಂಶಾವಳಿಯ ಕ್ರಿಯಾಪದದ ಅನುವಾದ
  choice: ಎಲ್ಲೆಡೆ ‘ತಂದೆಯಾದನು’ ಎಂಬ ರೂಪ
  alternative: ‘ಹುಟ್ಟಿಸಿದನು’ ಅಥವಾ ಹೆಚ್ಚು ಪಾರಂಪರಿಕವಾದ ‘ಪಡೆದನು’
  rationale: ‘ತಂದೆಯಾದನು’ ಎಂಬುದು ಗ್ರೀಕ್‌ನ ಪಿತೃವಂಶದ ಒತ್ತನ್ನು ಉಳಿಸಿಕೊಂಡು, ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಕೇಳಿಸುತ್ತದೆ. ಜೊತೆಗೆ ಪ್ರತಿಯೊಂದು ಕೊಂಡಿಯೂ ತಕ್ಷಣದ ಜೈವಿಕ ತಂದೆ-ಮಗ ಸಂಬಂಧವೇ ಎಂಬ ಹೆಚ್ಚುವರಿ ನಿರ್ಣಯವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಂಶಾವಳಿಗೆ ತಕ್ಕ ಲಯವನ್ನು ಬಳಸಲಾಗಿದೆ. ಹೆಸರುಗಳ ಪುನರಾವರ್ತನೆ ಮತ್ತು ಪಿತೃವಂಶದ ರಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; δέಯ ಮೃದುವಾದ ಸಂಪರ್ಕವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಿರಾಮಕ್ರಮದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
