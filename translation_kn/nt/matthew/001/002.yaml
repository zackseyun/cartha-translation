revisions:
- from: ಅಬ್ರಹಾಮನು ಇಸಾಕನಿಗೆ ತಂದೆಯಾದನು[a]; ಇಸಾಕನು ಯಾಕೋಬನಿಗೆ ತಂದೆಯಾದನು; ಯಾಕೋಬನು ಯೆಹೂದನಿಗೂ ಅವನ ಸಹೋದರರಿಗೂ ತಂದೆಯಾದನು.
  to: ಅಬ್ರಹಾಮನು ಇಸಾಕನ ತಂದೆಯಾದನು[a]; ಇಸಾಕನು ಯಾಕೋಬನ ತಂದೆಯಾದನು; ಯಾಕೋಬನು ಯೆಹೂದನ ಹಾಗೂ ಅವನ ಸಹೋದರರ ತಂದೆಯಾದನು.
  rationale: The revision preserves the source's stepwise genealogy and mild connective flow while clarifying that the brothers are Judah's. It retains the modern, non-archaic ‘ತಂದೆಯಾದನು’ and supplies a conventional alternative in the footnote without adding claims about whether every genealogical link is immediate.
  reviewer_model: gpt-5.6-terra
