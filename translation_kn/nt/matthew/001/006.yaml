  to: ಇಷಯನು ಅರಸನಾದ ದಾವೀದನ ತಂದೆಯಾದನು. ದಾವೀದನು ಊರೀಯನ ಹೆಂಡತಿಯಿಂದ[a] ಸೊಲೊಮೋನನ ತಂದೆಯಾದನು.
  rationale: ‘ಮೂಲಕ’ ಬದಲಿಗೆ ‘ಇಂದ/ಇಂದಿನಿಂದ’ ಅಲ್ಲದೆ ಇಲ್ಲಿ ಸೂಕ್ತವಾದ ‘ಹೆಂಡತಿಯಿಂದ’ ಬಳಸಲಾಗಿದೆ, ಏಕೆಂದರೆ ಅದು ವಂಶಾವಳಿಯ ಸಂತಾನಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ಮಹಿಳೆಯನ್ನು ಊರೀಯನ ಸಂಬಂಧದ ಮೂಲಕವೇ ಗುರುತಿಸುವ ಮೂಲದ ಪರೋಕ್ಷತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
