source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: kn
  text: ಇಷಯನು ಅರಸನಾದ ದಾವೀದನ ತಂದೆಯಾದನು. ದಾವೀದನು ಊರೀಯನ ಹೆಂಡತಿಯಿಂದ[a] ಸೊಲೊಮೋನನ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ, “ಊರೀಯನ [ಸ್ತ್ರೀಯ] ಇಂದ” ಎಂದಿದೆ. ಇದು ‘ಊರೀಯನ ಹೆಂಡತಿಯಿಂದ’ ಎಂಬ ಅರ್ಥದ ಅಪೂರ್ಣ ಪದಪ್ರಯೋಗ. ಮತ್ತಾಯನು ಇಲ್ಲಿ ಬತ್ಷೆಬಳ ಹೆಸರನ್ನು ಹೇಳುವುದಿಲ್ಲ.
    reason: ಮೂಲದ ಅಂಡಾಕಾರದ ಅಭಿವ್ಯಕ್ತಿ ಮತ್ತು ಅದರ ಸಹಜ ಕನ್ನಡ ಅನುವಾದವನ್ನು ವಿವರಿಸಲು.
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ γεννάω ಪುರುಷನ ಮೂಲಕ ಸಂತಾನೋತ್ಪತ್ತಿ ಅಥವಾ ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಂದೆಯಾದನು’ ಎಂಬುದು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಪುರುಷಕೇಂದ್ರಿತ ವಂಶಾವಳಿಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: ಅರಸನಾದ ದಾವೀದನ
  rationale: ಎರಡನೆಯ ನಿರ್ದಿಷ್ಟ ಉಪಪದವು ದಾವೀದನನ್ನು ವಿಶೇಷವಾಗಿ ‘ಅರಸನು’ ಎಂದು ಗುರುತಿಸುತ್ತದೆ. ‘ಅರಸನಾದ ದಾವೀದ’ ಈ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: ಊರೀಯನ ಹೆಂಡತಿಯ ಮೂಲಕ
  rationale: ಗ್ರೀಕ್ ಪದಬಂಧವು ಅಕ್ಷರಶಃ ‘ಊರೀಯನ [ಸ್ತ್ರೀಯ] ಮೂಲಕ/ಇಂದ’ ಎಂಬ ಅಂಡಾಕಾರದ ಅಭಿವ್ಯಕ್ತಿ; ‘ಸ್ತ್ರೀ’ ಅಥವಾ ‘ಹೆಂಡತಿ’ ಎಂಬ ಪದ ಅಧ್ಯಾಹಾರವಾಗಿದೆ. ‘ಊರೀಯನ ಹೆಂಡತಿಯ ಮೂಲಕ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಮತ್ತಾಯನು ಬತ್ಷೆಬಳ ಹೆಸರನ್ನು ಹೇಳದೆ ಊರೀಯನೊಂದಿಗೆ ಅವಳ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವುದನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰεσσαὶ
  choice: ಇಷಯ
  rationale: ಕನ್ನಡ ಸತ್ಯವೇದ ಪರಂಪರೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪ.
- source_word: Δαυὶδ
  choice: ದಾವೀದ
  rationale: ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಿರವಾಗಿ ಬಳಕೆಯಲ್ಲಿರುವ ಹೆಸರಿನ ರೂಪ.
- source_word: Σολομῶνα
  choice: ಸೊಲೊಮೋನ
  rationale: ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪ.
- source_word: Οὐρίου
  choice: ಊರೀಯ
  rationale: ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪ.
- source_word: δέ
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಇಲ್ಲಿ δέ ವಂಶಾವಳಿಯ ಕೊಂಡಿಗಳನ್ನು ಸೌಮ್ಯವಾಗಿ ಜೋಡಿಸುತ್ತದೆ. ಪ್ರತಿ ವಾಕ್ಯದಲ್ಲೂ ‘ಮತ್ತು’ ಸೇರಿಸದೆ ಇರುವುದೇ ಸಹಜ ಕನ್ನಡ; ಅನುಕ್ರಮವು ವಾಕ್ಯರಚನೆಯಿಂದಲೇ ಸ್ಪಷ್ಟವಾಗಿದೆ.
theological_decisions:
- issue: ಬತ್ಷೆಬಳಿಗೆ ಮತ್ತಾಯನು ಮಾಡಿದ ಪರೋಕ್ಷ ಉಲ್ಲೇಖ
  choice: ‘ಊರೀಯನ ಹೆಂಡತಿ’ ಎಂಬ ಪರೋಕ್ಷ ಗುರುತನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಬತ್ಷೆಬಳ ಮೂಲಕ’ ಅಥವಾ ‘ಹಿಂದೆ ಊರೀಯನ ಹೆಂಡತಿಯಾಗಿದ್ದವಳ ಮೂಲಕ’
  rationale: ಗ್ರೀಕ್ ಪಾಠವು ಮಹಿಳೆಯ ಹೆಸರನ್ನು ಹೇಳದೆ ಊರೀಯನ ಮೂಲಕ ಅವಳನ್ನು ಗುರುತಿಸುತ್ತದೆ. ಇದರಿಂದ 2 ಸಮುವೇಲದಲ್ಲಿನ ಕಥನದ ನೈತಿಕ ಮತ್ತು ಸಾಹಿತ್ಯಿಕ ಪ್ರತಿಧ್ವನಿ ಉಳಿಯುತ್ತದೆ; ಪರಿಚಿತ ಹೆಸರನ್ನು ಸೇರಿಸಿ ಮೂಲದ ಉದ್ದೇಶಪೂರ್ವಕ ಪರೋಕ್ಷತೆಯನ್ನು ನಿವಾರಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಕನ್ನಡವನ್ನು ಬಳಸಲಾಗಿದೆ. ವಂಶಾವಳಿಯ ಪುನರಾವರ್ತಿತ ಶೈಲಿಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಹಳೆಯದಾಗಿ ಕೇಳಿಸುವ ‘ಜನಿಸಿದನು/ಹೆತ್ತನು’ ಬದಲು ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವ ‘ತಂದೆಯಾದನು’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
