id: MAT.1.14
reference: Matthew 1:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: kn
  text: ಅಜೋರನು ಸಾದೋಕನ ತಂದೆಯಾದನು; ಸಾದೋಕ್ ಅಖೀಮನ ತಂದೆಯಾದನು; ಅಖೀಮ್ ಎಲಿಯೂದನ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: ಆಜೋರ
  rationale: ಗ್ರೀಕ್ ರೂಪವನ್ನು ಆಧರಿಸಿ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಚ್ಚರಿಸಬಹುದಾದಂತೆ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: δέ
  choice: ; (ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಸೂಚಿತ ಸಂಪರ್ಕ)
  rationale: ವಂಶಾವಳಿಯ ಸರಣಿ ಸಂಪರ್ಕವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪುನರಾವರ್ತಿತ ಉಪವಾಕ್ಯಗಳು ಮತ್ತು ಅರ್ಧವಿರಾಮಗಳು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತವೆ; ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಎಂದು ಮೂರೂ ಕಡೆ ಅನುವಾದಿಸುವುದು ಅಗತ್ಯವಿಲ್ಲ.
- source_word: ἐγέννησεν
  choice: ಪಡೆದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಪುರುಷ ಪೂರ್ವಜನಿಂದ ಸಂತತಿಯ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವ, ಕನ್ನಡ ಸತ್ಯವೇದ ಪರಂಪರೆಯಲ್ಲಿ ಪರಿಚಿತವೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆದ ಕ್ರಿಯಾಪದ. ಇದು ತಕ್ಷಣದ ಜೈವಿಕ ಪಿತೃತ್ವವನ್ನಷ್ಟೇ ಅನಿವಾರ್ಯವಾಗಿ ನಿರ್ಧರಿಸದೆ ವಂಶಸಂಬಂಧದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὸν
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ವ್ಯಕ್ತಿನಾಮವನ್ನು ಕರ್ಮಪದವಾಗಿ ಗುರುತಿಸುವ accusative article; ಕನ್ನಡದ ಈ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ‘-ನನ್ನು’ ಎಂಬ ವಿಭಕ್ತಿ ಅದರ ಕಾರ್ಯವನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ.
- source_word: Σαδώκ
  choice: ಚಾದೋಕ
  rationale: SBLGNT ಗ್ರೀಕ್ ಉಚ್ಚಾರಣಾರೂಪವನ್ನು ಆಧರಿಸಿದ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
- source_word: Ἀχίμ
  choice: ಆಕೀಮ
  rationale: SBLGNT ಗ್ರೀಕ್ ರೂಪವನ್ನು ಆಧರಿಸಿದ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
- source_word: Ἐλιούδ
  choice: ಎಲೀಯೂದ
  rationale: SBLGNT ಗ್ರೀಕ್ ರೂಪವನ್ನು ಆಧರಿಸಿದ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
theological_decisions:
- issue: ἐγέννησεν ಸೂಚಿಸುವ ವಂಶಸಂಬಂಧದ ಸ್ವರೂಪ
  choice: ‘ಪಡೆದನು’ ಎಂದು ಅನುವಾದಿಸಿ ವಂಶಾವಳಿಯ ಸಂಬಂಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ತಂದೆಯಾದನು’ ಅಥವಾ ‘ಜನ್ಮಕೊಟ್ಟನು’
  rationale: ವಂಶಾವಳಿಗಳಲ್ಲಿ γεννάω ನೇರ ಪಿತೃತ್ವವನ್ನಾಗಲಿ ವಿಶಾಲ ಪೂರ್ವಜ ಸಂಬಂಧವನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು. ‘ಪಡೆದನು’ ಈ ಸಾಧ್ಯ ವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಕುಗ್ಗಿಸದೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ವಂಶಾವಳಿ ಶೈಲಿಯನ್ನು ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಮಾನಕ ಕನ್ನಡದಲ್ಲಿ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಓದಲು ಸುಲಭವಾದ ವಂಶಾವಳಿ ಶೈಲಿ. ಹೆಸರುಗಳನ್ನು ಮೂಲ ಗ್ರೀಕ್ ರೂಪಗಳಿಗೆ ಸಮೀಪವಾಗಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ; ಪುನರಾವರ್ತಿತ ರಚನೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ಅರ್ಧವಿರಾಮಗಳನ್ನು ಬಳಸಲಾಗಿದೆ.
