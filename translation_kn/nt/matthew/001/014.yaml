revisions:
- from: ಆಜೋರನು ಚಾದೋಕನನ್ನು ಪಡೆದನು; ಚಾದೋಕನು ಆಕೀಮನನ್ನು ಪಡೆದನು; ಆಕೀಮನು ಎಲೀಯೂದನನ್ನು ಪಡೆದನು.
  to: ಅಜೋರನು ಸಾದೋಕನ ತಂದೆಯಾದನು; ಸಾದೋಕ್ ಅಖೀಮನ ತಂದೆಯಾದನು; ಅಖೀಮ್ ಎಲಿಯೂದನ ತಂದೆಯಾದನು.
  rationale: The revision makes the genealogical fatherhood explicit in modern standard Kannada and regularizes the transliteration of the four personal names according to their Greek forms. The sequential relation is retained without unnecessarily repeating ‘ಮತ್ತು.’
