id: MAT.1.9
reference: Matthew 1:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: kn
  text: ಉಜ್ಜೀಯನು ಯೋತಾಮನ ತಂದೆಯಾದನು[a]; ಯೋತಾಮನು ಆಹಾಜನ ತಂದೆಯಾದನು; ಆಹಾಜನು ಹಿಜ್ಕೀಯನ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್ ἐγέννησεν ಪದವನ್ನು ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ‘ಹೆತ್ತನು’ ಅಥವಾ ‘ಜನಿಸಿದನು’ ಎಂದೂ ಅನುವಾದಿಸಲಾಗುತ್ತದೆ; ಇಲ್ಲಿ ವಂಶಾವಳಿಯ ಪಿತೃಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ತಂದೆಯಾದನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: ಉಜ್ಜೀಯ
  rationale: ಗ್ರೀಕ್ ರೂಪವನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ಲಿಪ್ಯಂತರಿಸದೆ, ಹಳೆಯ ಒಡಂಬಡಿಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಯೆಹೂದದ ಅರಸನ ಹೆಸರಿನ ಆಧುನಿಕ ಕನ್ನಡ ಬೈಬಲ್ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಪುನರಾವರ್ತಿತ ವಾಕ್ಯರಚನೆ ಮತ್ತು ವಿರಾಮಚಿಹ್ನೆಗಳ ಮೂಲಕ ಸೂಚಿಸಲಾಗಿದೆ
  rationale: ವಂಶಾವಳಿಯಲ್ಲಿ δέ ಪಟ್ಟಿಯನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಯೋಜಕ. ಪ್ರತಿಬಾರಿಯೂ ‘ಮತ್ತು’ ಎಂದು ಹಾಕುವುದಕ್ಕಿಂತ ಕನ್ನಡದಲ್ಲಿ ಅರ್ಧವಿರಾಮಗಳೊಂದಿಗೆ ಪುನರಾವರ್ತಿತ ರಚನೆ ಸಹಜವಾಗಿ ಅದೇ ಪ್ರವಾಹವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: ἐγέννησεν
  choice: ಪಡೆದನು
  rationale: ತಂದೆಯ ವಂಶಕ್ರಮವನ್ನು ಸೂಚಿಸುವ ಕನ್ನಡ ವಂಶಾವಳಿ ಪ್ರಯೋಗ. ಇದು ಹಳೆಯ ಶೈಲಿಯ ‘ಜನಿಸಿದನು’ ಎಂಬ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ತಪ್ಪಿಸಿ, ಸಂಕ್ಷಿಪ್ತವಾದ ಪುನರಾವರ್ತಿತ ಲಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰωαθάμ
  choice: ಯೋತಾಮ
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಯೆಹೂದದ ಅರಸನಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: Ἀχάζ
  choice: ಆಹಾಜ
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಅರಸನಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಬಳಕೆಯಲ್ಲಿರುವ ಪರಿಚಿತ ರೂಪವನ್ನು ಅನುಸರಿಸಲಾಗಿದೆ.
- source_word: Ἑζεκίαν
  choice: ಹಿಜ್ಕೀಯ
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಯೆಹೂದದ ಅರಸನಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: γεννάω ಪದದ ವಂಶಾವಳಿಯ ಅರ್ಥ
  choice: ನೇರವಾದ ತಂದೆ–ಮಗ ವಂಶಕ್ರಮವಾಗಿ ‘ಪಡೆದನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ತಂದೆಯಾದನು’, ‘ಪೂರ್ವಜನಾದನು’
  rationale: ಮತ್ತಾಯನ ಶೈಲೀಕೃತ ವಂಶಾವಳಿ ಸೂತ್ರದ ಅರ್ಥ ಮತ್ತು ಪುನರಾವರ್ತಿತ ಲಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಬೈಬಲ್ ವಂಶಾವಳಿಗಳು ಕೆಲವೊಮ್ಮೆ ಮಧ್ಯದ ತಲೆಮಾರುಗಳನ್ನು ಬಿಡಬಹುದಾದರೂ, ಈ ವಾಕ್ಯವು ಹೇಳುವುದಕ್ಕಿಂತ ವಿಶಾಲವಾದ ‘ಪೂರ್ವಜನಾದನು’ ಎಂಬ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗುವ dignified ವಂಶಾವಳಿ ಶೈಲಿ. ಹೆಸರುಗಳಿಗೆ ಗ್ರೀಕ್ ರೂಪಗಳ ಯಾಂತ್ರಿಕ ಲಿಪ್ಯಂತರಕ್ಕಿಂತ ಕನ್ನಡ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪಗಳನ್ನು ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ಅರ್ಧವಿರಾಮಗಳಿಂದ ಮೂಲದ ಮೂರು ಸಮಾನ ಘಟಕಗಳ ಲಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
