id: MAT.1.10
reference: Matthew 1:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: kn
  text: ಹಿಜ್ಕೀಯನು ಮನಸ್ಸೆಗೆ ತಂದೆಯಾದನು; ಮನಸ್ಸೆಯು ಆಮೋಸನಿಗೆ[a] ತಂದೆಯಾದನು; ಆಮೋಸನು ಯೋಷೀಯನಿಗೆ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಅನುವಾದಗಳು ಇಲ್ಲಿ 2 ಅರಸುಗಳು 21ರಲ್ಲಿ ಬರುವ ಯೆಹೂದದ ಅರಸನ ಹೆಸರಿನೊಂದಿಗೆ ಹೊಂದಿಸಿ, “ಆಮೋನ” ಎಂದು ಓದುತ್ತವೆ; ಆದರೆ ಮತ್ತಾಯನ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿ “ಆಮೋಸ” ಎಂದಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಪುರುಷ ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಂದೆಯಾದನು’ ಎಂಬುದು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆಗಿದ್ದು, ಮೂಲದ ಪುನರಾವರ್ತಿತ ರಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Ἑζεκίας
  choice: ಹಿಜ್ಕೀಯ
  rationale: ಯೆಹೂದದ ಅರಸನ ಹೆಸರಿಗೆ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪ.
- source_word: Μανασσῆς
  choice: ಮನಸ್ಸೆ
  rationale: ವೈಯಕ್ತಿಕ ಹೆಸರಿನ ಪರಿಚಿತ ಕನ್ನಡ ರೂಪ.
- source_word: Ἀμώς
  choice: ಆಮೋಸ
  rationale: SBLGNT ಮೂಲಪಾಠದಲ್ಲಿರುವ Ἀμώς ಅನ್ನು ನೇರವಾಗಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ; ಹಳೆಯ ಒಡಂಬಡಿಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ‘ಆಮೋನ’ ಎಂದು ಪಾಠವನ್ನು ಮೌನವಾಗಿ ಸಮನ್ವಯಗೊಳಿಸಲಾಗಿಲ್ಲ.
- source_word: Ἰωσίας
  choice: ಯೋಷೀಯ
  rationale: ವೈಯಕ್ತಿಕ ಹೆಸರಿನ ಪರಿಚಿತ ಕನ್ನಡ ರೂಪ.
- source_word: δέ
  choice: ; / ವಾಕ್ಯಸಂಬಂಧದಿಂದ ಸೂಚಿತ
  rationale: ಈ ಪುನರಾವರ್ತಿತ ವಂಶಾವಳಿ ಪಟ್ಟಿಯಲ್ಲಿ δέ ಸರಳ ಮುಂದುವರಿಕೆಯ ಸಂಪರ್ಕಕವಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಬಾರಿಯೂ ‘ಮತ್ತು’ ಎಂದು ಹೇಳುವುದಕ್ಕಿಂತ ಅರ್ಧವಿರಾಮವು ಸಹಜವಾಗಿ ಸರಣಿಯನ್ನು ಮುಂದುವರಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿನ ಹೆಸರು ಮತ್ತು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಅರಸನ ಹೆಸರಿನ ವ್ಯತ್ಯಾಸ
  choice: ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ಗ್ರೀಕ್ Ἀμώς ಅನುಸಾರ ‘ಆಮೋಸ’
  alternative: 2 ಅರಸುಗಳು 21ರಲ್ಲಿ ಬರುವ ಅರಸನ ಹೆಸರಿನೊಂದಿಗೆ ಹೊಂದಿಸಲು ‘ಆಮೋನ’
  rationale: ಮೂಲಭಾಷೆಯ ಪಾಠಕ್ಕೆ ಆದ್ಯತೆ ನೀಡಿ ಹೆಸರಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಮೌನವಾಗಿ ಸರಿಪಡಿಸಿಲ್ಲ. ಓದುಗರಿಗೆ ಪರಿಚಿತವಾಗಿರಬಹುದಾದ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಗೌರವಯುತ ವಂಶಾವಳಿ ಶೈಲಿ. ಮೂಲದಲ್ಲಿರುವ ಹೆಸರಿನ ರೂಪ ಮತ್ತು ಪುನರಾವರ್ತಿತ ವಾಕ್ಯವಿನ್ಯಾಸವನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸಲಾಗಿದೆ.
