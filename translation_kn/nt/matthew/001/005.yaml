base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: kn
  text: ಸಲ್ಮೋನನು ರಾಹಾಬಳಿಂದ[a] ಬೋವಜನಿಗೆ ತಂದೆಯಾದನು; ಬೋವಜನು ರೂತಳಿಂದ ಓಬೇದನಿಗೆ ತಂದೆಯಾದನು; ಓಬೇದನು ಇಷಯನಿಗೆ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಎರಡೂ ತಾಯಂದಿರ ಹೆಸರಿನೊಂದಿಗೆ ἐκ ಎಂಬ ಉಪಸರ್ಗವಿದೆ; ಇದರ ಅರ್ಥ ‘ಇಂದ’ ಅಥವಾ ‘ಮೂಲವಾಗಿ’ ಎಂದಾಗುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ಪಡೆದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಪುರುಷನ ಮೂಲಕ ಸಂತಾನೋತ್ಪತ್ತಿ ಮತ್ತು ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮಗನಾಗಿ ಪಡೆದನು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಹೊರುವ ‘ಪಡೆದನು’ ಸಂಕ್ಷಿಪ್ತವೂ ಗೌರವಯುತವೂ ಆಗಿದೆ; ‘ಹುಟ್ಟಿಸಿದನು’ಗಿಂತ ಕಡಿಮೆ ಯಾಂತ್ರಿಕವಾಗಿದೆ.
- source_word: ἐκ
  choice: -ಳಿಂದ
  rationale: ತಾಯಿಯ ಹೆಸರಿನೊಂದಿಗೆ ಬಂದಿರುವ ἐκ ಮಾತೃಮೂಲ ಅಥವಾ ಮಾತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ರಾಹಾಬಳಿಂದ’ ಮತ್ತು ‘ರೂತಳಿಂದ’ ಎಂಬ ರೂಪಗಳು ಗ್ರೀಕ್‌ನ ವಿಶೇಷ ಮಾತೃಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತವೆ.
- source_word: δὲ
  choice: ವಾಕ್ಯಕ್ರಮದ ವಿರಾಮಚಿಹ್ನೆಯಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ
  rationale: ಇಲ್ಲಿ δέ ವಿರೋಧಾರ್ಥಕವಲ್ಲ, ವಂಶಾವಳಿಯ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುವ ಸೌಮ್ಯ ಸಂಪರ್ಕಕ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿ ಘಟಕಕ್ಕೂ ‘ಮತ್ತು’ ಸೇರಿಸುವುದಕ್ಕಿಂತ ಅರ್ಧವಿರಾಮದ ಸರಣಿ ಸಹಜವಾಗಿದೆ.
- source_word: Σαλμὼν
  choice: ಸಲ್ಮೋನ
  rationale: ಗ್ರೀಕ್ ಹೆಸರಿನ ಧ್ವನಿಯನ್ನು ಅನುಸರಿಸುವ, ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಗೆ ಹೊಂದುವ ರೂಪ.
- source_word: Βόες
  choice: ಬೋವಜ
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಪರಿಚಿತ ವ್ಯಕ್ತಿಯಾದ ಬೋವಜನೊಂದಿಗೆ ಗ್ರಂಥಾಂತರ ನಿರಂತರತೆಯನ್ನು ಉಳಿಸುವ ಸಾಂಪ್ರದಾಯಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: Ῥαχάβ
  choice: ರಾಹಾಬ
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ವ್ಯಕ್ತಿಯೊಂದಿಗೆ ಗುರುತಿಸಬಹುದಾದ ಸ್ಥಿರ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
- source_word: Ἰωβὴδ
  choice: ಓಬೇದ
  rationale: ಹೀಬ್ರೂ ಮೂಲದ ಪರಿಚಿತ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಹೆಸರಿನ ಕನ್ನಡ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ῥούθ
  choice: ರೂತ
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಪುಸ್ತಕ ಮತ್ತು ವ್ಯಕ್ತಿಯೊಂದಿಗೆ ಹೊಂದುವ ಕನ್ನಡ ರೂಪ.
- source_word: Ἰεσσαί
  choice: ಇಷಯ
  rationale: ದಾವೀದನ ತಂದೆಯ ಹೆಸರಿಗೆ ಕನ್ನಡ ಬೈಬಲ್ ಪರಂಪರೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪ; ಯಾಂತ್ರಿಕ ಗ್ರೀಕ್ ಲಿಪ್ಯಂತರಕ್ಕಿಂತ ಗ್ರಂಥಾಂತರ ಗುರುತನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ವಂಶಾವಳಿ ಸೂತ್ರ ಮತ್ತು ತಾಯಂದಿರ ಉಲ್ಲೇಖ
  choice: ‘ರಾಹಾಬಳಿಂದ’ ಮತ್ತು ‘ರೂತಳಿಂದ’ ಎಂಬ ಮಾತೃಉಲ್ಲೇಖಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಿ, ‘ಪಡೆದನು’ ಮೂಲಕ ಪಿತೃವಂಶದ ಸರಣಿಯನ್ನು ನಿರೂಪಿಸಲಾಗಿದೆ.
  alternative: ತಾಯಂದಿರ ಉಲ್ಲೇಖವಿಲ್ಲದೆ ‘ತಂದೆಯಾದನು’ ಎಂದು ಹೇಳುವುದು, ಅಥವಾ ಹೆಚ್ಚು ಪದಶಃವಾಗಿ ‘ಹುಟ್ಟಿಸಿದನು’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ἐκ + ತಾಯಿಯ ಹೆಸರು ಎಂಬ ಅಸಾಮಾನ್ಯ ಮತ್ತು ಉದ್ದೇಶಪೂರ್ವಕ ರಚನೆಯನ್ನು ಬಳಸುತ್ತದೆ. ಅನುವಾದವು ಅದನ್ನು ಸಮತಟ್ಟಾಗಿಸದೆ, ಪಿತೃವಂಶ ಮತ್ತು ಮಾತೃಸಂಬಂಧ ಎರಡನ್ನೂ ಗೋಚರವಾಗಿರಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ವಂಶಾವಳಿ ಶೈಲಿ. ಹೆಸರುಗಳಲ್ಲಿ ಹಳೆಯ ಮತ್ತು ಹೊಸ ಒಡಂಬಡಿಕೆಗಳ ನಡುವಿನ ಪರಿಚಿತ ಕನ್ನಡ ರೂಪಗಳ ನಿರಂತರತೆಯನ್ನು ಆದ್ಯತೆ ನೀಡಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿರುವ [a] ಗುರುತು ಪಾದಟಿಪ್ಪಣಿಗೆ ಸರಿಯಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ.
