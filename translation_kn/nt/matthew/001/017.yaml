  terminology: ‘ತಲೆಮಾರುಗಳು,’ ‘ಅಬ್ರಹಾಮ,’ ‘ದಾವೀದ,’ ‘ಬಾಬಿಲೋನ್,’ and ‘ಮೆಸ್ಸೀಯ’ are appropriate modern-standard Kannada choices. ‘ಸೆರೆ ಒಯ್ಯಲ್ಪಟ್ಟ ಕಾಲ’ accurately conveys deportation/exile without importing an interpretive explanation.
