  source_fidelity: 'The threefold fourteen-generation summary, the inclusive force of Πᾶσαι, and the titular rendering of τοῦ χριστοῦ as ‘ಮೆಸ್ಸೀಯ’ are retained. However, ‘ಬಾಬಿಲೋನಿಗೆ ಗಡಿಪಾರಾದ ಕಾಲ’ is not the most faithful or idiomatic expression for μετοικεσία: it can suggest a general border expulsion rather than the specific deportation into Babylonian exile.'
