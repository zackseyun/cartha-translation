id: MAT.1.17
reference: Matthew 1:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: kn
  text: ಹೀಗೆ, ಅಬ್ರಹಾಮನಿಂದ ದಾವೀದನವರೆಗೆ ಇದ್ದ ತಲೆಮಾರುಗಳೆಲ್ಲವೂ ಹದಿನಾಲ್ಕು; ದಾವೀದನಿಂದ ಬಾಬಿಲೋನಿಗೆ ಸೆರೆ ಒಯ್ಯಲ್ಪಟ್ಟ ಕಾಲದವರೆಗೆ ಹದಿನಾಲ್ಕು ತಲೆಮಾರುಗಳು; ಬಾಬಿಲೋನಿಗೆ ಸೆರೆ ಒಯ್ಯಲ್ಪಟ್ಟ ಕಾಲದಿಂದ ಮೆಸ್ಸೀಯನವರೆಗೆ[a] ಹದಿನಾಲ್ಕು ತಲೆಮಾರುಗಳು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಕ್ರಿಸ್ತನವರೆಗೆ.’ ಗ್ರೀಕ್‌ನ χριστός ಎಂಬ ಬಿರುದನ್ನು ಇಲ್ಲಿ ವಂಶಾವಳಿಯ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಪರಾಕಾಷ್ಠೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಮೆಸ್ಸೀಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: ಹೀಗೆ ... ತಲೆಮಾರುಗಳೆಲ್ಲವೂ
  rationale: οὖν ಎಂಬುದು ಹಿಂದಿನ ವಂಶಾವಳಿಯನ್ನು ಸಂಗ್ರಹಿಸಿ ಸಾರುವ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಹೀಗೆ’ ಎಂದು ಕೊಡಲಾಗಿದೆ. Πᾶσαι αἱ γενεαὶಯ ಸಮಗ್ರತೆಯನ್ನು ‘ತಲೆಮಾರುಗಳೆಲ್ಲವೂ’ ಉಳಿಸುತ್ತದೆ.
- source_word: γενεαὶ
  choice: ತಲೆಮಾರುಗಳು
  rationale: ವಂಶಾವಳಿಯಲ್ಲಿನ ಅನುಕ್ರಮ ಸಂತತಿಗಳನ್ನು ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ, ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡ ಪದ.
- source_word: ἀπὸ ... ἕως
  choice: '...ನಿಂದ ...ವರೆಗೆ'
  rationale: ವಂಶಾವಳಿಯ ಎರಡು ಗಡಿಬಿಂದುಗಳ ನಡುವಿನ ವ್ಯಾಪ್ತಿಯನ್ನು ಮೂಲದಂತೆಯೇ ಸೂಚಿಸುತ್ತದೆ.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: ಬಾಬಿಲೋನಿಗೆ ಗಡಿಪಾರಾದ ಕಾಲ
  rationale: μετοικεσία ಬಲವಂತದ ಸ್ಥಳಾಂತರ ಅಥವಾ ಗಡಿಪಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಗಡಿಪಾರಾದ ಕಾಲ’ ಎಂಬುದು ಘಟನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಗುರುತಿಸಿ, ಕೇವಲ ಸೆರೆಯ ಸ್ಥಿತಿಯೆಂದು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: τοῦ χριστοῦ
  choice: ಮೆಸ್ಸೀಯನು
  rationale: ಇಲ್ಲಿ χριστός ವಂಶಾವಳಿಯ ಪರಾಕಾಷ್ಠೆಯಲ್ಲಿರುವ ಬಿರುದಾಗಿ ಬಳಕೆಯಾಗಿದೆ; ಆದ್ದರಿಂದ ಅದರ ಅಭಿಷಿಕ್ತ ರಕ್ಷಕನ ಅರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸುವ ‘ಮೆಸ್ಸೀಯನು’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: γενεαὶ δεκατέσσαρες
  choice: ಹದಿನಾಲ್ಕು ತಲೆಮಾರುಗಳು
  rationale: ಮೂರು ವಿಭಾಗಗಳಲ್ಲಿಯೂ ಪುನರಾವರ್ತಿತ ಸಂಖ್ಯಾತ್ಮಕ ವಿನ್ಯಾಸವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: ಅಬ್ರಹಾಮ / ದಾವೀದ / ಬಾಬಿಲೋನ್
  rationale: ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಗುರುತಿಸಬಹುದಾದ, ಸ್ಥಿರವಾದ ಬೈಬಲ್ ಹೆಸರುರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: Χριστός ಪದದ ಅನುವಾದ
  choice: ಮೆಸ್ಸೀಯನು
  alternative: ಕ್ರಿಸ್ತನು
  rationale: ನಿರ್ದಿಷ್ಟ ಉಪಪದದೊಂದಿಗೆ ಬಂದಿರುವ τοῦ χριστοῦ ಇಲ್ಲಿ ವೈಯಕ್ತಿಕ ಹೆಸರಿಗಿಂತ ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ‘ಮೆಸ್ಸೀಯನು’ ಅದರ ಯೆಹೂದ್ಯ ನಿರೀಕ್ಷೆ ಮತ್ತು ವಂಶಾವಳಿಯ ಉದ್ದೇಶಿತ ಪರಾಕಾಷ್ಠೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯ ಪರಂಪರಾಗತ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ವಂಶಾವಳಿಯ ಮೂರು ಹದಿನಾಲ್ಕರ ವಿಭಾಗಗಳು
  choice: ಮೂಲದಲ್ಲಿರುವ ಸಾರಾಂಶದ ಹೇಳಿಕೆಯನ್ನು ವಿವರಣೆಯಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ
  alternative: ಬಿಟ್ಟುಹೋದ ಹೆಸರುಗಳು ಅಥವಾ ಎಣಿಕೆಯ ವಿಧಾನವನ್ನು ಪಠ್ಯದಲ್ಲೇ ವಿವರಿಸುವುದು
  rationale: ವಚನವು ಮೂರು ವಿಭಾಗಗಳನ್ನೂ ಹದಿನಾಲ್ಕು ತಲೆಮಾರುಗಳೆಂದು ಸಾರುತ್ತದೆ. ಆ ಎಣಿಕೆಯನ್ನು ಸಮನ್ವಯಗೊಳಿಸುವ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ, ಮೂಲದ ಹೇಳಿಕೆ ಮತ್ತು ಅದರ ಸಾಹಿತ್ಯಿಕ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಸರಳವಾದರೂ ಘನತೆಯ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಮೂರು ಸಮಾಂತರ ವಿಭಾಗಗಳನ್ನು ಅರ್ಧವಿರಾಮಗಳಿಂದ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ. ಮೊದಲ ವಿಭಾಗದಲ್ಲಿನ Πᾶσαι (‘ಎಲ್ಲ’) ಎಂಬ ಒತ್ತನ್ನು ‘ತಲೆಮಾರುಗಳೆಲ್ಲವೂ’ ಮೂಲಕ ಉಳಿಸಿ, ಮುಂದಿನ ಎರಡು ವಿಭಾಗಗಳ ಪುನರಾವರ್ತಿತ ಲಯವನ್ನೂ ಕಾಪಾಡಲಾಗಿದೆ.
