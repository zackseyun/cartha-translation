id: MAT.1.23
reference: Matthew 1:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: kn
  text: “ಇಗೋ, ಕನ್ಯೆ ಗರ್ಭಧರಿಸಿ ಒಬ್ಬ ಮಗನನ್ನು ಹೆರುವಳು; ಅವರು ಆತನಿಗೆ ಇಮ್ಮಾನುವೇಲ್ ಎಂದು ಹೆಸರಿಡುವರು[a].” ಇಮ್ಮಾನುವೇಲ್ ಎಂಬ ಹೆಸರಿನ ಅರ್ಥ, “ದೇವರು ನಮ್ಮೊಂದಿಗಿದ್ದಾನೆ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಅವರು ಹೆಸರಿಡುವರು’; ಇಲ್ಲಿ ‘ಅವರು’ ಎಂಬುದು ಯಾರನ್ನಾದರೂ ನಿರ್ದಿಷ್ಟವಾಗಿ ಸೂಚಿಸದ ಬಹುವಚನ ಪ್ರಯೋಗ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ಇಗೋ
  rationale: ಪ್ರವಾದನಾತ್ಮಕ ಉಲ್ಲೇಖದಲ್ಲಿ ಗಮನ ಸೆಳೆಯುವ ಗಂಭೀರ ಧ್ವನಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ παρθένος
  choice: ಕನ್ಯೆ
  rationale: ಮತ್ತಾಯನ ಗ್ರೀಕ್ ಪದದ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನೂ ಅದ್ಭುತ ಗರ್ಭಧಾರಣೆಯ ತಕ್ಷಣದ ಕಥಾಸಂದರ್ಭವನ್ನೂ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ἐν γαστρὶ ἕξει
  choice: ಗರ್ಭಧರಿಸಿ
  rationale: ‘ಗರ್ಭದಲ್ಲಿ ಹೊಂದುವಳು’ ಎಂಬ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿಗೆ ಸಹಜವಾದ, ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: τέξεται υἱόν
  choice: ಒಬ್ಬ ಮಗನನ್ನು ಹೆರುವಳು
  rationale: ಭವಿಷ್ಯಕಾಲ ಮತ್ತು ಹೆರಿಗೆಯ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: ಅವರು ಆತನಿಗೆ … ಎಂದು ಹೆಸರಿಡುವರು
  rationale: ಗ್ರೀಕ್‌ನ ಅನಿರ್ದಿಷ್ಟ ತೃತೀಯ ಪುರುಷ ಬಹುವಚನವನ್ನು ನಿಷ್ಕ್ರಿಯ ರೂಪಕ್ಕೆ ಬದಲಿಸದೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἐμμανουήλ
  choice: ಇಮ್ಮಾನುವೇಲ್
  rationale: ಗ್ರೀಕ್ ಹೆಸರಿನ ಕನ್ನಡ ಲಿಪ್ಯಂತರ; ಅದರ ಅರ್ಥವನ್ನು ವಾಕ್ಯವೇ ಮುಂದೆ ವಿವರಿಸುತ್ತದೆ.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: ಎಂದರೆ … ಎಂದರ್ಥ
  rationale: ಹೆಸರಿನ ಅನುವಾದಿತ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: ದೇವರು ನಮ್ಮೊಂದಿಗಿದ್ದಾನೆ
  rationale: ಹೆಸರಿನ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ; ವಾಕ್ಯದಲ್ಲಿಲ್ಲದ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: παρθένος ಪದದ ಅರ್ಥ
  choice: ಕನ್ಯೆ
  alternative: ಯುವತಿ
  rationale: ಮತ್ತಾಯ 1ರ ತಕ್ಷಣದ ಕಥಾಸಂದರ್ಭ ಮತ್ತು παρθένος ಪದದ ಸಾಮಾನ್ಯ ಗ್ರೀಕ್ ಅರ್ಥ ‘ಕನ್ಯೆ’ ಎಂಬ ಮುಖ್ಯಪಠ್ಯವನ್ನು ಸಮರ್ಥಿಸುತ್ತವೆ. ಯೆಶಾಯ 7:14ರ ಹೀಬ್ರೂ ಪದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಚರ್ಚೆಯನ್ನು ಮತ್ತಾಯನ ಗ್ರೀಕ್ ಪಠ್ಯದ ಮೇಲೆ ಹೇರುವುದಿಲ್ಲ.
- issue: ‘ಇಮ್ಮಾನುವೇಲ್’ ಹೆಸರಿನ ವಿವರಣೆ
  choice: ‘ದೇವರು ನಮ್ಮೊಂದಿಗಿದ್ದಾನೆ’ ಎಂದು ಮಾತ್ರ ಅರ್ಥ ನೀಡುವುದು
  alternative: ದೇವರ ಅವತಾರದ ಕುರಿತು ವಿಸ್ತೃತ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆ ಸೇರಿಸುವುದು
  rationale: ಮತ್ತಾಯನು ನೀಡಿದ ಅರ್ಥದ ಧಾರ್ಮಿಕ ತೂಕವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಪಠ್ಯದಲ್ಲಿ ಹೇಳದ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಇರುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದರೂ, ಪ್ರವಾದನಾತ್ಮಕ ಉಲ್ಲೇಖಕ್ಕೆ ತಕ್ಕ ಗೌರವಯುತ ಧಾಟಿ ಉಳಿಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬುದು ಗಮನ ಸೆಳೆಯುವ ಮೂಲಪದದ ಬಲವನ್ನು ಕಾಪಾಡುತ್ತದೆ; ‘ಆತನಿಗೆ’ ಎಂಬ ಗೌರವಸೂಚಕ ರೂಪವು ಕನ್ನಡದ ಸಾಂಪ್ರದಾಯಿಕ ಶಾಸ್ತ್ರಗ್ರಂಥ ಶೈಲಿಗೆ ಹೊಂದಿದ್ದರೂ ವಾಕ್ಯವನ್ನು ದುರ್ಬೋಧಗೊಳಿಸುವುದಿಲ್ಲ.
