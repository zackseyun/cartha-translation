id: MAT.1.11
reference: Matthew 1:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: kn
  text: ಯೋಷೀಯನು ಯೆಕೊನ್ಯನಿಗೂ ಅವನ ಸಹೋದರರಿಗೂ ತಂದೆಯಾದನು, ಬಾಬೆಲಿಗೆ ಗಡೀಪಾರು ಮಾಡಲ್ಪಟ್ಟ ಕಾಲದಲ್ಲಿ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಬಾಬೆಲಿನ ಸೆರೆಯ ಕಾಲದಲ್ಲಿ.” ಗ್ರೀಕ್ ಪದವು ಬಲವಂತದ ಸ್ಥಳಾಂತರ ಅಥವಾ ಸೆರೆಯನ್ನು ಸೂಚಿಸಬಹುದು; “ಗಡೀಪಾರು” ಎಂಬುದು ಆ ಘಟನೆಯ ಬಲಾತ್ಕಾರದ ಸ್ವಭಾವವನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯಲ್ಲಿ ಪುರುಷನ ಮೂಲಕ ಬಂದ ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವ ಸಹಜ, ಗೌರವಯುತ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ; ‘ಜನ್ಮಕೊಟ್ಟನು’ ಎಂಬ ಅಸಹಜ ಪದಪ್ರಯೋಗವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: Ἰεχονίαν
  choice: ಯೆಕೊನ್ಯ
  rationale: ಗ್ರೀಕ್ Ἰεχονίας ಹೆಸರಿನ ಕನ್ನಡ ಲಿಪ್ಯಂತರ; ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯದೊಂದಿಗೆ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಯೆಕೊನ್ಯನಿಗೂ’ ಎಂದು ಬಂದಿದೆ.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ಅವನ ಸಹೋದರರು
  rationale: ಗ್ರೀಕ್ ಪದವು ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾಗಿರುವುದರಿಂದ ಲಿಂಗಸೂಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ವಾಕ್ಯದಲ್ಲಿ ‘ಅವನ ಸಹೋದರರಿಗೂ’ ಎಂಬ ರೂಪ ಬಳಕೆಯಾಗಿದೆ.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: ಬಾಬೆಲಿಗೆ ಗಡೀಪಾರು ಮಾಡಿದ ಕಾಲದಲ್ಲಿ
  rationale: μετοικεσία ಬಲವಂತದ ಸ್ಥಳಾಂತರವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಗಡೀಪಾರು’ ಅದರ ಬಲಾತ್ಕಾರದ ಸ್ವಭಾವವನ್ನು ತೋರಿಸುತ್ತದೆ. ἐπί + ಷಷ್ಠೀ ಇಲ್ಲಿ ಕಾಲಸೂಚಕವಾಗಿದ್ದು ‘ಕಾಲದಲ್ಲಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ವಂಶಾವಳಿಯಲ್ಲಿನ ಸೌಮ್ಯ ಸಂಪರ್ಕಕ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಸಮಾನಾರ್ಥಕವನ್ನು ಸೇರಿಸದೆ ಇರುವುದರಿಂದ ಅರ್ಥಹಾನಿಯಿಲ್ಲದೆ ವಾಕ್ಯ ಸಹಜವಾಗುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ ವಂಶಾವಳಿಯಲ್ಲಿನ ತಲೆಮಾರುಗಳ ಸಂಕ್ಷೇಪ
  choice: ಗ್ರೀಕ್ ಪಠ್ಯ ಹೇಳುವ ವಂಶಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ; ಐತಿಹಾಸಿಕ ಪ್ರಶ್ನೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಪರಿಹರಿಸಲು ಪ್ರಯತ್ನಿಸಿಲ್ಲ.
  alternative: ἐγέννησεν ಎಂಬುದನ್ನು ಪ್ರತಿಯೊಂದು ಕೊಂಡಿಯಲ್ಲೂ ನೇರ ಜೈವಿಕ ಪಿತೃತ್ವವೆಂದು ಮಾತ್ರವಲ್ಲದೆ ಪೂರ್ವಜನ ಮೂಲಕ ಬಂದ ವಂಶಸಂಬಂಧವನ್ನೂ ಒಳಗೊಳ್ಳುವಂತೆ ವಿವರಿಸುವುದು.
  rationale: ಮತ್ತಾಯನ ವಂಶಾವಳಿ ತಲೆಮಾರುಗಳನ್ನು ಸಂಕ್ಷೇಪಿಸಬಹುದಾದರೂ, ಅನುವಾದವು ಸಮನ್ವಯಕಾರಿ ವಿವರಣೆಯನ್ನು ಒಳಸೇರಿಸದೆ ಮೂಲದ ವಂಶಾವಳಿ ಸೂತ್ರವನ್ನು ಉಳಿಸಬೇಕು. ‘ತಂದೆಯಾದನು’ ಸಂಬಂಧವನ್ನು ಹೇಳುತ್ತದೆ; ಅದರ ನಿಖರ ತಲೆಮಾರು ಅಂತರವನ್ನು ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ವಂಶಾವಳಿ ಶೈಲಿ. ‘ಬಾಬೆಲು’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಸ್ಥಳನಾಮವನ್ನು ವಿಭಕ್ತಿಯೊಂದಿಗೆ ‘ಬಾಬೆಲಿಗೆ’ ಎಂದು ಬಳಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿರುವ ಅರ್ಥದ ಅನಿಶ್ಚಿತತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
