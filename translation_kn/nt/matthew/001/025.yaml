id: MAT.1.25
reference: Matthew 1:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: kn
  text: ಅವಳು ಒಬ್ಬ ಮಗನಿಗೆ ಜನ್ಮ ನೀಡುವ ತನಕ[b] ಅವನು ಅವಳೊಂದಿಗೆ ದಾಂಪತ್ಯ ಸಂಬಂಧ ಹೊಂದಿರಲಿಲ್ಲ[a]. ಅವನು ಅವನಿಗೆ ಯೇಸು ಎಂದು ಹೆಸರಿಟ್ಟನು[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಶಾಬ್ದಿಕವಾಗಿ, “ಆಕೆಯನ್ನು ತಿಳಿದುಕೊಳ್ಳಲಿಲ್ಲ.” ಇಲ್ಲಿ “ತಿಳಿದುಕೊಳ್ಳು” ಎಂಬುದು ದಾಂಪತ್ಯ ಸಂಬಂಧಕ್ಕೆ ಬಳಸಿದ ಸೌಮ್ಯೋಕ್ತಿ.
    reason: lexical_alternative
  - marker: b
    text: “ತನಕ” ಎಂಬುದು ಯೇಸುವಿನ ಜನನದವರೆಗೆ ಸತ್ಯವಾಗಿದ್ದುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅದರ ನಂತರ ಏನಾಯಿತು ಎಂಬುದನ್ನು ಈ ಪದವೇ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
    reason: alternative_reading
  - marker: c
    text: ಇನ್ನಷ್ಟು ಶಾಬ್ದಿಕವಾಗಿ, “ಅವನ ಹೆಸರನ್ನು ಯೇಸು ಎಂದು ಕರೆದನು.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: ಆಕೆಯೊಂದಿಗೆ ದಾಂಪತ್ಯ ಸಂಬಂಧ ಹೊಂದಲಿಲ್ಲ
  rationale: ಇಲ್ಲಿ γινώσκω (‘ತಿಳಿದುಕೊಳ್ಳು’) ಲೈಂಗಿಕ ಸಂಬಂಧಕ್ಕೆ ಸೌಮ್ಯೋಕ್ತಿಯಾಗಿ ಬಳಕೆಯಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಆಕೆಯನ್ನು ತಿಳಿದುಕೊಳ್ಳಲಿಲ್ಲ’ ಎಂದರೆ ಉದ್ದೇಶಿತ ಅರ್ಥ ಸಹಜವಾಗಿ ತಲುಪದ ಕಾರಣ, ಅರ್ಥವನ್ನು ಗೌರವಯುತವಾಗಿ ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἕως οὗ
  choice: ತನಕ
  rationale: ಜನನದವರೆಗಿನ ಕಾಲಮಿತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಅದರ ನಂತರ ಏನಾಯಿತು ಎಂಬುದನ್ನು ಈ ಪದಬಂಧ ಮಾತ್ರ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: ἔτεκεν
  choice: ಹೆರುವ
  rationale: τίκτω ಎಂಬ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ಆಧುನಿಕ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: υἱόν
  choice: ಒಬ್ಬ ಮಗನನ್ನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಲೇಖನವಿಲ್ಲದ ಕಾರಣ ‘ಒಬ್ಬ ಮಗನನ್ನು’ ಎಂದು ಅನಿರ್ದಿಷ್ಟವಾಗಿ ಭಾಷಾಂತರಿಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ಒತ್ತನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: ಆ ಮಗುವಿಗೆ ಯೇಸು ಎಂದು ಹೆಸರಿಟ್ಟನು
  rationale: ಮೂಲದ ಸೆಮಿಟಿಕ್-ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ‘ಅವನ ಹೆಸರನ್ನು ಯೇಸು ಎಂದು ಕರೆದನು’ ಎಂಬ ರೂಪ ಹೆಚ್ಚು ಶಾಬ್ದಿಕವಾದರೂ ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜ.
- source_word: Ἰησοῦν
  choice: ಯೇಸು
  rationale: ಹೊಸ ಒಡಂಬಡಿಕೆಯಲ್ಲಿ ಈ ವ್ಯಕ್ತಿನಾಮಕ್ಕೆ ಸ್ಥಿರವಾದ ಮತ್ತು ವ್ಯಾಪಕವಾಗಿ ಗ್ರಹಿಸಲ್ಪಡುವ ಕನ್ನಡ ರೂಪ ‘ಯೇಸು’.
theological_decisions:
- issue: ‘ತನಕ’ ಎಂಬುದರಿಂದ ಮರಿಯಳ ಮುಂದಿನ ಕನ್ಯತ್ವದ ಕುರಿತು ಉಂಟಾಗಬಹುದಾದ ಸೂಚನೆ
  choice: ἕως οὗ ಅನ್ನು ‘ತನಕ’ ಎಂದು ಮಾತ್ರ ಭಾಷಾಂತರಿಸಿ, ನಂತರ ದಾಂಪತ್ಯ ಸಂಬಂಧ ಉಂಟಾಯಿತೇ ಇಲ್ಲವೇ ಎಂಬುದನ್ನು ಪಠ್ಯದಲ್ಲಿ ನಿರ್ಧರಿಸದೆ ಬಿಡಲಾಗಿದೆ.
  alternative: ಕೆಲವರು ನಂತರ ಸಾಮಾನ್ಯ ದಾಂಪತ್ಯ ಸಂಬಂಧ ಆರಂಭವಾಯಿತು ಎಂದು ಊಹಿಸುತ್ತಾರೆ; ಇತರರು ಈ ಪದಬಂಧವು ನಂತರದ ಸ್ಥಿತಿಯಲ್ಲಿ ಬದಲಾವಣೆ ಸಂಭವಿಸಿತು ಎಂದು ಸೂಚಿಸುವುದಿಲ್ಲ ಎನ್ನುತ್ತಾರೆ.
  rationale: ಗ್ರೀಕ್ ಕಾಲಸೂಚಕ ಪದಬಂಧವು ಯೇಸುವಿನ ಜನನದವರೆಗೆ ಸತ್ಯವಾಗಿದ್ದ ಸ್ಥಿತಿಯನ್ನು ಹೇಳುತ್ತದೆ; ಅದರ ನಂತರದ ವಿಷಯವನ್ನು ಅದು ಸ್ವತಃ ಇತ್ಯರ್ಥಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಂಥೀಯ ತೀರ್ಮಾನವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ನಿಜವಾದ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ, ಸರಳ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಮೂಲದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವಲ್ಲಿ ಸಹಜ ಕನ್ನಡಕ್ಕೆ ಆದ್ಯತೆ ನೀಡಲಾಗಿದೆ; ಆದರೆ ‘ತನಕ’ ಎಂಬ ಪದದ ನಿಜವಾದ ಕಾಲಾತ್ಮಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಆಕೆ/ಅವನು’ ಎಂಬ ರೂಪಗಳು ಹಿಂದಿನ ವಚನದ ಸನ್ನಿವೇಶದೊಂದಿಗೆ ಹೊಂದಿಕೊಳ್ಳುತ್ತವೆ.
