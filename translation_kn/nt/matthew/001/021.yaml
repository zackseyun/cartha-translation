  to: ಅವಳು ಒಬ್ಬ ಮಗನನ್ನು ಹೆರುವಳು, ಮತ್ತು ನೀನು ಆತನಿಗೆ ಯೇಸು[a] ಎಂದು ಹೆಸರಿಡಬೇಕು. ಏಕೆಂದರೆ ಆತನೇ ತನ್ನ ಜನರನ್ನು ಅವರ ಪಾಪಗಳಿಂದ ರಕ್ಷಿಸುವನು.
  rationale: ಮುಖ್ಯ ಅನುವಾದದ ಅರ್ಥವನ್ನು ಬದಲಾಯಿಸದೆ, ಪಾದಟಿಪ್ಪಣಿ ಆಂಕರ್ ಅನ್ನು ಅದರ ವಿಷಯವಾದ ಹೆಸರಿನ ತಕ್ಷಣಕ್ಕೆ ಸ್ಥಳಾಂತರಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಹೆಸರಿನ ವ್ಯುತ್ಪತ್ತಿಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸಿ, ನೀಡಲಾದ ಇಂಗ್ಲಿಷ್ audit trail‌ನ ‘Yahweh saves’ ಎಂಬ ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ಪ್ರತಿನಿಧಿಸಲಾಗಿದೆ. δέಯ ಮೃದುವಾದ ಸಂಪರ್ಕವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತೋರಿಸಲು ಅಲ್ಪ ವಿರಾಮದೊಂದಿಗೆ ‘ಮತ್ತು’ ಬಳಸಲಾಗಿದೆ.
