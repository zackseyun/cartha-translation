id: MAT.1.21
reference: Matthew 1:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: kn
  text: ಅವಳು ಒಬ್ಬ ಮಗನನ್ನು ಹೆರುವಳು, ಮತ್ತು ನೀನು ಆತನಿಗೆ ಯೇಸು[a] ಎಂದು ಹೆಸರಿಡಬೇಕು. ಏಕೆಂದರೆ ಆತನೇ ತನ್ನ ಜನರನ್ನು ಅವರ ಪಾಪಗಳಿಂದ ರಕ್ಷಿಸುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಯೇಸು’ ಎಂಬುದು ಹೀಬ್ರೂ/ಅರಾಮಾಯಿಕ ‘ಯೇಶುವಾ’ಗೆ ಹೊಂದುವ ಗ್ರೀಕ್ ರೂಪವಾಗಿದೆ; ‘ಯೇಶುವಾ’ ಎಂಬುದು ‘ಯೆಹೋಶುವಾ’ದ ಸಂಕ್ಷಿಪ್ತ ರೂಪವಾಗಿದೆ. ಈ ಹೆಸರು ‘ಯಹ್ವೇ ರಕ್ಷಿಸುತ್ತಾನೆ’ ಎಂಬ ಅರ್ಥದೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದೆ. ‘ಆತನೇ ... ರಕ್ಷಿಸುವನು’ ಎಂಬ ಮತ್ತಾಯನ ವಿವರಣೆ ಈ ಪದಸಂಬಂಧವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: ಹೆರುವಳು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಹೆರಿಗೆಸಂಬಂಧಿ ಕ್ರಿಯೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ;
  rationale: δέ ಇಲ್ಲಿ ಮೃದುವಾದ ಸಂಪರ್ಕಕ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಪದವನ್ನು ಸೇರಿಸದೆ ವಿರಾಮಚಿಹ್ನೆಯಿಂದ ಪ್ರವಾಹವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: υἱὸν
  choice: ಒಬ್ಬ ಮಗನನ್ನು
  rationale: ನಿರ್ದಿಷ್ಟ ಲೇಖನವಿಲ್ಲದ υἱόν ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಜನನ-ಘೋಷಣೆಯ ರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ಆತನಿಗೆ ... ಎಂದು ಹೆಸರಿಡಬೇಕು
  rationale: ಗ್ರೀಕ್‌ನ ನಾಮಕರಣ ಸೂತ್ರದ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ದೈವದೂತನ ನಿರ್ದೇಶನದ ಬಲವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰησοῦν
  choice: ಯೇಸು
  rationale: ಹೊಸ ಒಡಂಬಡಿಕೆಯ ವ್ಯಕ್ತಿನಾಮಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಿರವಾಗಿ ಬಳಕೆಯಲ್ಲಿರುವ ರೂಪ.
- source_word: αὐτὸς
  choice: ಆತನೇ
  rationale: ಪ್ರತ್ಯೇಕವಾಗಿ ಬಂದಿರುವ ಸರ್ವನಾಮದ ಒತ್ತನ್ನು ಕನ್ನಡದ ‘-ನೇ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹೆಸರಿಡುವ ನಿರ್ದೇಶನಕ್ಕೆ ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುವ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: σώσει
  choice: ರಕ್ಷಿಸುವನು
  rationale: σῴζω ಎಂಬ ಪದದ ರಕ್ಷಣೆ/ವಿಮೋಚನೆಯ ಅರ್ಥವನ್ನು ‘ಪಾಪಗಳಿಂದ’ ಎಂಬ ಸಂದರ್ಭಕ್ಕೆ ಸೂಕ್ತವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ತನ್ನ ಜನರನ್ನು
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಜನರ ವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ ಅಥವಾ ವಿಸ್ತರಿಸುವುದಿಲ್ಲ.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: ಅವರ ಪಾಪಗಳಿಂದ
  rationale: ἀπό ಸೂಚಿಸುವ ಬೇರ್ಪಡಿಸುವಿಕೆಯನ್ನು ಮತ್ತು ἁμαρτιῶν ಎಂಬ ಬಹುವಚನವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: αὐτὸς ಎಂಬ ಒತ್ತಿನ ಸರ್ವನಾಮ ಮತ್ತು ಯೇಸುವಿನ ರಕ್ಷಣಾ ಕಾರ್ಯ
  choice: ‘ಆತನೇ ... ರಕ್ಷಿಸುವನು’ ಎಂದು ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ‘ಆತ ... ರಕ್ಷಿಸುವನು’
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯದಲ್ಲಿನ ಪ್ರತ್ಯೇಕ αὐτός ಯೇಸುವೇ ರಕ್ಷಣೆಯ ಕರ್ತೃ ಎಂಬ ಒತ್ತನ್ನು ನೀಡುತ್ತದೆ; ‘ಆತನೇ’ ಅದನ್ನು ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆ ಇಲ್ಲದೆ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- issue: ‘ತನ್ನ ಜನರು’ ಎಂಬ ಪದಗುಚ್ಛದ ವ್ಯಾಪ್ತಿ
  choice: ‘ತನ್ನ ಜನರನ್ನು’ ಎಂದಷ್ಟೇ ಅನುವಾದಿಸಲಾಗಿದೆ
  alternative: ‘ತನ್ನ ಜನರಾದ ಇಸ್ರಾಯೇಲ್ಯರನ್ನು’ ಅಥವಾ ‘ತನಗೆ ಸೇರಿದ ಎಲ್ಲ ಜನರನ್ನು’
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭ ಯೆಹೂದ್ಯ ಮತ್ತು ಒಡಂಬಡಿಕೆಯ ಹಿನ್ನೆಲೆಯದ್ದಾದರೂ ಈ ವಾಕ್ಯವೇ ವ್ಯಾಪ್ತಿಯನ್ನು ಇನ್ನಷ್ಟು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ಹೆರುವಳು’ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ ಭವಿಷ್ಯವಾಣಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಹೆಸರಿಡಬೇಕು’ ನಾಮಕರಣದ ನಿರ್ದೇಶನವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು ಹೆಸರಿನ ನಂತರ ಇಡಲಾಗಿದೆ, ಏಕೆಂದರೆ ಟಿಪ್ಪಣಿ ‘ಯೇಸು’ ಎಂಬ ಹೆಸರಿನ ಪದಸಂಬಂಧವನ್ನು ವಿವರಿಸುತ್ತದೆ.
