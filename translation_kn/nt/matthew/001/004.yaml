    reason: alternative_reading
  revision_rationale: The revision uses the idiomatic Kannada genealogical expression ‘[name]ನ ತಂದೆಯಾದನು’ and explicitly renders the repeated sequential force of δέ with ‘ಮತ್ತು.’ The footnote is normalized to the uninflected alternative personal name without altering its textual-critical information.
