id: MAT.1.4
reference: Matthew 1:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: kn
  text: ಅರಾಮನು ಅಮ್ಮೀನಾದಾಬನ ತಂದೆಯಾದನು; ಮತ್ತು ಅಮ್ಮೀನಾದಾಬನು ನಹಶೋನನ ತಂದೆಯಾದನು; ಮತ್ತು ನಹಶೋನನು ಸಲ್ಮೋನನ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρὰμ
  choice: ಅರಾಮ
  rationale: SBLGNT ಗ್ರೀಕ್ ರೂಪವಾದ Ἀράμ ಅನ್ನು ನೇರವಾಗಿ ಪ್ರತಿನಿಧಿಸುವ ಕನ್ನಡ ಲಿಪ್ಯಂತರ; ಹೀಬ್ರೂ ವಂಶಾವಳಿ ರೂಪಕ್ಕೆ ಹೊಂದುವ ಪರ್ಯಾಯ ‘ರಾಮ’ ಅನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ; (ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸದೆ ವಾಕ್ಯಕ್ರಮದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ)
  rationale: ಇಲ್ಲಿ δέ ವಿರೋಧವನ್ನು ಸೂಚಿಸದೆ ವಂಶಾವಳಿಯ ಮುಂದಿನ ಕೊಂಡಿಯನ್ನು ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪುನಃಪುನಃ ‘ಮತ್ತು’ ಎನ್ನುವುದಕ್ಕಿಂತ ಅರ್ಧವಿರಾಮದ ಮೂಲಕ ಕ್ರಮವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಪುರುಷ ವಂಶೋತ್ಪತ್ತಿ ಅಥವಾ ಪಿತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಂದೆಯಾದನು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವೂ ಗೌರವಯುತವೂ ಆಗಿದ್ದು, ಸಂಬಂಧದ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿಸ್ತರಿಸುವುದಿಲ್ಲ.
- source_word: Ἀμιναδάβ
  choice: ಅಮ್ಮೀನಾದಾಬ
  rationale: ಗ್ರೀಕ್ ಹೆಸರಿನ ಧ್ವನಿರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರತಿನಿಧಿಸುವ ಲಿಪ್ಯಂತರ.
- source_word: Ναασσών
  choice: ನಹಶೋನ
  rationale: ಹೀಬ್ರೂ ಹಿನ್ನೆಲೆಯೊಂದಿಗೆ ಹೊಂದುವ, ಕನ್ನಡ ಬೈಬಲ್ ಓದುಗರಿಗೆ ಗುರುತಿಸಬಹುದಾದ ಹೆಸರಿನ ರೂಪ; ಕಟ್ಟುನಿಟ್ಟಾದ ಗ್ರೀಕ್ ಲಿಪ್ಯಂತರಕ್ಕಿಂತ ವ್ಯಕ್ತಿಯ ಗುರುತನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: Σαλμών
  choice: ಸಲ್ಮೋನ
  rationale: ಗ್ರೀಕ್ Σαλμών ಹೆಸರಿನ ಧ್ವನಿಯನ್ನು ಸಹಜ ಕನ್ನಡ ರೂಪದಲ್ಲಿ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ.
