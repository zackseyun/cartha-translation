translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೂ ಸೂಕ್ತವಾದ ಸರಳ ಹಾಗೂ ಘನತೆಯ ವಂಶಾವಳಿ ಶೈಲಿ. ಪುನರಾವರ್ತಿತ ಗ್ರೀಕ್ ರಚನೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, δέಯ ಸಂಪರ್ಕಕಾರ್ಯವನ್ನು ಕನ್ನಡದ ವಿರಾಮಚಿಹ್ನೆಗಳಿಂದ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
