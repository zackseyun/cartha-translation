  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಶೀರ್ಷಿಕೆಯಂತಿರುವ ಸಂಕ್ಷಿಪ್ತ ವಾಕ್ಯರಚನೆ ಮತ್ತು ದಾವೀದ–ಅಬ್ರಹಾಮ ಎಂಬ ಕ್ರಮ ಉಳಿಸಲಾಗಿದೆ. ‘ಮಗ’ ಎಂಬ ಬೈಬಲೀಯ ವಂಶಾವಳಿ ನುಡಿಗಟ್ಟನ್ನು ಸಹಜ ಕನ್ನಡ ವಿಭಕ್ತಿಗಳೊಂದಿಗೆ ನೀಡಲಾಗಿದೆ.
