id: MAT.1.1
reference: Matthew 1:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: kn
  text: ದಾವೀದನ ಮಗನೂ ಅಬ್ರಹಾಮನ ಮಗನೂ ಆದ ಮೆಸ್ಸೀಯನಾದ[b] ಯೇಸುವಿನ ವಂಶಾವಳಿಯ[a] ಗ್ರಂಥ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ವಂಶಾವಳಿಯ ಗ್ರಂಥ’ ಎಂಬುದನ್ನು ‘ಉಗಮದ ಗ್ರಂಥ’ ಅಥವಾ ‘ಜನನದ ಗ್ರಂಥ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಪದವು ಈ ವಿಶಾಲ ಅರ್ಥಗಳನ್ನು ಹೊಂದಿದ್ದರೂ, ಮುಂದೆ ಬರುವ ವಂಶಪಟ್ಟಿಗೆ ‘ವಂಶಾವಳಿ’ ಹೆಚ್ಚು ಸರಿಹೊಂದುತ್ತದೆ.
    reason: alternative_reading
  - marker: b
    text: ‘ಮೆಸ್ಸೀಯ’ ಎಂಬುದು ಗ್ರೀಕ್ Χριστός ಎಂಬ ಬಿರುದಿನ ಅರ್ಥಾನುವಾದ; ಪರಂಪರಾಗತವಾಗಿ ಇದನ್ನು ‘ಕ್ರಿಸ್ತ’ ಎಂದು ಲಿಪ್ಯಂತರಿಸಲಾಗುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: ಗ್ರಂಥ
  rationale: βίβλος ಎಂದರೆ ಪುಸ್ತಕ, ಸುರುಳಿ ಅಥವಾ ಲಿಖಿತ ದಾಖಲೆ. ಇಲ್ಲಿ ಇದು ಶೀರ್ಷಿಕೆಯಂತಿರುವುದರಿಂದ ‘ಗ್ರಂಥ’ ಎಂಬ ಪದವು ಸಂಕ್ಷಿಪ್ತವಾದ, ಗೌರವಯುತವಾದ ಶೈಲಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: γενέσεως
  choice: ವಂಶಾವಳಿಯ
  rationale: γένεσις ಎಂಬುದಕ್ಕೆ ಉಗಮ, ಜನನ ಅಥವಾ ವಂಶಾವಳಿ ಎಂಬ ಅರ್ಥಗಳಿವೆ. ತಕ್ಷಣ ಮುಂದುವರಿಯುವ ಪೂರ್ವಜರ ಪಟ್ಟಿಯ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ‘ವಂಶಾವಳಿ’ ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಅತ್ಯಂತ ಸೂಕ್ತ; ವಿಶಾಲವಾದ ‘ಉಗಮ/ಜನನ’ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ἰησοῦ
  choice: ಯೇಸುವಿನ
  rationale: Ἰησοῦ ಎಂಬ ಹೆಸರನ್ನು ಕನ್ನಡದ ಸ್ಥಾಪಿತ ರೂಪವಾದ ‘ಯೇಸು’ ಎಂದು ಲಿಪ್ಯಂತರಿಸಿ, ಗ್ರೀಕ್‌ನ ಸಂಬಂಧವಾಚಕ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಯೇಸುವಿನ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: χριστοῦ
  choice: ಮೆಸ್ಸೀಯನಾದ
  rationale: Χριστός ಇಲ್ಲಿ ವೈಯಕ್ತಿಕ ಹೆಸರಿನ ಭಾಗಕ್ಕಿಂತ ಅಭಿಷಿಕ್ತ ರಾಜನ ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ‘ಮೆಸ್ಸೀಯನಾದ’ ಎಂಬುದು ಆ ಬಿರುದಿನ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: υἱοῦ Δαυὶδ
  choice: ದಾವೀದನ ಮಗನೂ
  rationale: υἱός ಪದದ ‘ಮಗ’ ಎಂಬ ನೇರ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಇಲ್ಲಿ ಅದು ವಂಶಜನನ್ನೂ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ರಾಜಬಿರುದನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು; ‘ವಂಶಜ’ ಎಂದು ಮಾತ್ರ ಅನುವಾದಿಸಿದರೆ ಆ ಶಕ್ತಿ ಕುಗ್ಗುತ್ತದೆ.
- source_word: υἱοῦ Ἀβραάμ
  choice: ಅಬ್ರಹಾಮನ ಮಗನೂ
  rationale: ವಂಶಕ್ರಮದ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ‘ಮಗ’ ಎಂದರೆ ದೂರದ ವಂಶಜನೂ ಆಗಬಹುದು. ನೇರ ರೂಪವು ಅಬ್ರಹಾಮನೊಂದಿಗಿನ ವಂಶೀಯ ಹಾಗೂ ಒಡಂಬಡಿಕೆಯ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: Χριστός ಪದದ ಅನುವಾದ
  choice: ಮೆಸ್ಸೀಯನಾದ
  alternative: ಕ್ರಿಸ್ತನಾದ
  rationale: ಈ ವಾಕ್ಯದಲ್ಲಿ ಪದವು ಯೇಸುವಿನ ಅಭಿಷಿಕ್ತ ರಾಜನ ಗುರುತನ್ನು ಪರಿಚಯಿಸುವ ಬಿರುದಾಗಿದೆ. ಆದ್ದರಿಂದ ‘ಮೆಸ್ಸೀಯ’ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಳಸಲಾಗಿದೆ; ಪರಂಪರಾಗತ ‘ಕ್ರಿಸ್ತ’ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: γενέσεως ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ವಂಶಾವಳಿ
  alternative: ಉಗಮ ಅಥವಾ ಜನನ
  rationale: ಮುಂದಿನ ವಂಶಪಟ್ಟಿಯ ಕಾರಣ ‘ವಂಶಾವಳಿ’ ಸಂದರ್ಭಕ್ಕೆ ಅತ್ಯಂತ ಸರಿಹೊಂದುತ್ತದೆ. ಆದರೂ ಗ್ರೀಕ್ ಪದದಲ್ಲಿರುವ ಉಗಮ/ಜನನದ ಪ್ರತಿಧ್ವನಿಯನ್ನು ನಿರಾಕರಿಸದೆ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: υἱός ಪದದ ವಂಶೀಯ ಬಳಕೆ
  choice: ಮಗ
  alternative: ವಂಶಜ
  rationale: ‘ಮಗ’ ಎಂಬ ನೇರ ರೂಪವು ದಾವೀದ ಮತ್ತು ಅಬ್ರಹಾಮರೊಂದಿಗಿನ ವಂಶಸಂಬಂಧದ ಜೊತೆಗೆ ‘ದಾವೀದನ ಮಗ’ ಎಂಬ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಬಿರುದಿನ ಗಾಢತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಓದುಗನು ಇದನ್ನು ತಕ್ಷಣದ ಪುತ್ರತ್ವವೆಂದು ತಪ್ಪಾಗಿ ಗ್ರಹಿಸದಂತೆ ಟಿಪ್ಪಣಿಯ ಅಗತ್ಯ ಇಲ್ಲದಷ್ಟು ವಂಶಾವಳಿ ಸಂದರ್ಭ ಸ್ಪಷ್ಟವಾಗಿದೆ.
