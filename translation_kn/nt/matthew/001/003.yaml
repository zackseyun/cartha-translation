id: MAT.1.3
reference: Matthew 1:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: kn
  text: ಯೆಹೂದನು ತಾಮಾರಳಿಂದ ಪೆರೆಚ ಮತ್ತು ಜೆರಹರಿಗೆ ತಂದೆಯಾದನು; ಪೆರೆಚನು ಹೆಚ್ರೋನನಿಗೆ ತಂದೆಯಾದನು; ಹೆಚ್ರೋನನು ಅರಾಮನಿಗೆ[a] ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಇಂಗ್ಲಿಷ್ ಭಾಷಾಂತರಗಳು ಇಲ್ಲಿ ‘ರಾಮ’ ಎಂದು ಕೊಡುತ್ತವೆ; ಅದು ಬೇರೆ ಲಿಪ್ಯಂತರ ಅಥವಾ ವಂಶಾವಳಿ ಸಂಪ್ರದಾಯವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ. ಇಲ್ಲಿನ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿ ‘ಅರಾಮ’ ಎಂದಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: ಯೆಹೂದ
  rationale: ಇಲ್ಲಿ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಮೂಲಪಿತೃ ಮತ್ತು ಗೋತ್ರದ ಪೂರ್ವಜನನ್ನು ಸೂಚಿಸುವುದರಿಂದ, ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಯೂದ ಎಂಬ ಹೆಸರಿನ ವ್ಯಕ್ತಿಗಳೊಂದಿಗೆ ಗೊಂದಲವಾಗದಂತೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ‘ಯೆಹೂದ’ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ವಿರಾಮಚಿಹ್ನೆಗಳ ಮೂಲಕ ಕ್ರಮಸಂಬಂಧ
  rationale: ಇಲ್ಲಿ δέ ವಿರೋಧವನ್ನು ಸೂಚಿಸುವುದಿಲ್ಲ; ವಂಶಾವಳಿಯ ಮುಂದುವರಿಕೆಯನ್ನು ಸೌಮ್ಯವಾಗಿ ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಯೊಂದು ಬಾರಿ ಪ್ರತ್ಯೇಕ ಸಂಯೋಜಕವನ್ನು ಸೇರಿಸುವುದಕ್ಕಿಂತ ಅರ್ಧವಿರಾಮಗಳ ಮೂಲಕ ಆ ಕ್ರಮವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.
- source_word: ἐγέννησεν
  choice: ಪಡೆದನು
  rationale: ವಂಶಾವಳಿಯಲ್ಲಿ ತಂದೆಯ ಮೂಲಕ ಸಂತಾನಕ್ರಮವನ್ನು ಸೂಚಿಸುವ ಜನνάω ಎಂಬ ಕ್ರಿಯೆಯನ್ನು ಆಧುನಿಕ, ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ‘ಪಡೆದನು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ‘ಹುಟ್ಟಿಸಿದನು’ ಹೆಚ್ಚು ನೇರವಾದರೂ ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗಿ ಅಥವಾ ಕಾರಣಾರ್ಥಕವಾಗಿ ಕೇಳಿಸಬಹುದು.
- source_word: Φαρὲς
  choice: ಪೆರೆಚ
  rationale: ಹೀಬ್ರೂ ಪֶּרֶץ ಹೆಸರಿನೊಂದಿಗೆ ಸಾಂಪ್ರದಾಯಿಕ ಗ್ರಂಥಸಂಬಂಧ ಉಳಿಸುವ ಕನ್ನಡ ರೂಪ.
- source_word: Ζάρα
  choice: ಜೆರಹ
  rationale: ಹೀಬ್ರೂ זֶרַח ಹೆಸರಿನೊಂದಿಗೆ ಗ್ರಂಥಸಂಬಂಧ ಉಳಿಸುವ ಕನ್ನಡ ರೂಪ.
- source_word: ἐκ τῆς Θαμάρ
  choice: ತಾಮಾರಳಿಂದ
  rationale: ἐκ ಇಲ್ಲಿ ತಾಯಿಯ ಮೂಲಕದ ವಂಶಮೂಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಾಮಾರಳಿಂದ’ ಎಂಬುದು ಅದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἑσρώμ
  choice: ಹೆಚ್ರೋನ
  rationale: ಹೀಬ್ರೂ חֶצְרוֹן ಹೆಸರಿನೊಂದಿಗೆ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಸಂಬಂಧವನ್ನು ಉಳಿಸುವ ಕನ್ನಡ ರೂಪ.
- source_word: Ἀράμ
  choice: ಅರಾಮ
  rationale: ಒದಗಿಸಿದ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿರುವ Ἀράμ ಅನ್ನು ನೇರವಾಗಿ ಅನುಸರಿಸಲಾಗಿದೆ; ಬೇರೆ ವಂಶಾವಳಿ ಸಂಪ್ರದಾಯಕ್ಕೆ ಹೊಂದಿಸಲು ‘ರಾಮ’ ಎಂದು ಬದಲಾಯಿಸಲಾಗಿಲ್ಲ.
theological_decisions:
- issue: ಕೊನೆಯ ಹೆಸರನ್ನು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಕೆಲವು ವಂಶಾವಳಿ ಸಂಪ್ರದಾಯಗಳೊಂದಿಗೆ ಹೊಂದಿಸಬೇಕೇ?
  choice: ಅರಾಮ
  alternative: ರಾಮ
  rationale: ಮೂಲಭಾಷೆಯ ಪಾಠಕ್ಕೆ ಆದ್ಯತೆ ನೀಡಲಾಗಿದೆ. ಒದಗಿಸಿದ ಗ್ರೀಕ್ ಪಾಠವು Ἀράμ ಎಂದು ಓದುತ್ತದೆ; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ‘ಅರಾಮ’ ಇಡಲಾಗಿದೆ. ಓದುಗರಿಗೆ ಪರಿಚಿತವಾಗಿರಬಹುದಾದ ‘ರಾಮ’ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ವಂಶಾವಳಿಗೆ ತಕ್ಕ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಗೌರವಯುತ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಹೆಸರುಗಳನ್ನು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಕನ್ನಡ ರೂಪಗಳೊಂದಿಗೆ ಸಾಧ್ಯವಾದಷ್ಟು ಹೊಂದಿಸಲಾಗಿದೆ; ಆದರೆ Ἀράμ ಎಂಬ ಗ್ರೀಕ್ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
