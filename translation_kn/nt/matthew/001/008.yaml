reference: Matthew 1:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: kn
  text: ಆಸಾಫನು ಯೆಹೋಷಾಫಾಟನಿಗೆ ತಂದೆಯಾದನು[a]; ಯೆಹೋಷಾಫಾಟನು ಯೋರಾಮನಿಗೆ ತಂದೆಯಾದನು; ಯೋರಾಮನು ಉಜ್ಜೀಯನಿಗೆ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ ‘ಆಸಾಫ’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ಆಸಾ’ ಎಂದಿದೆ; ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ವಂಶಾವಳಿಯಲ್ಲಿ ಉಲ್ಲೇಖವಾಗಿರುವ ಯೆಹೂದದ ಅರಸನ ಹೆಸರೂ ‘ಆಸಾ’ ಆಗಿದೆ.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: ಆಸಾಫ
  rationale: SBLGNT ಮುಖ್ಯಪಾಠದಲ್ಲಿರುವ Ἀσὰφ ಎಂಬ ಹೆಸರನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ. ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ವಂಶಾವಳಿಗೆ ಹೊಂದಿಸಲು ಮುಖ್ಯಪಾಠವನ್ನು ಮೌನವಾಗಿ ‘ಆಸಾ’ ಎಂದು ಬದಲಾಯಿಸದೆ, ಆ ಪಾಠಾಂತರವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ವಿರಾಮಚಿಹ್ನೆಗಳ ಮೂಲಕ ಕ್ರಮಬದ್ಧ ಸಂಪರ್ಕ
  rationale: ಇಲ್ಲಿ δέ ವಿರೋಧಾರ್ಥಕವಲ್ಲ; ವಂಶಾವಳಿಯ ಪ್ರತಿಯೊಂದು ಕೊಂಡಿಯನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಪರ್ಕಪದ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಬಾರಿಯೂ ‘ಮತ್ತು’ ಎಂದು ಹಾಕುವುದಕ್ಕಿಂತ ಅರ್ಧವಿರಾಮಗಳಿಂದ ಕ್ರಮವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.
- source_word: ἐγέννησεν
  choice: ಪಡೆದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಇದು ತಂದೆಯ ವಂಶಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಪಡೆದನು’ ಕನ್ನಡ ಸತ್ಯವೇದಿಕೆಯ ವಂಶಾವಳಿ ಶೈಲಿಗೆ ಹೊಂದುವ, ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ಗೌರವಯುತ ಪದ; ಇದು ಜೀವಶಾಸ್ತ್ರೀಯ ವಿವರಕ್ಕಿಂತ ವಂಶಕ್ರಮದ ಹೇಳಿಕೆಗೆ ಒತ್ತು ನೀಡುತ್ತದೆ.
- source_word: Ἰωσαφάτ
  choice: ಯೆಹೋಷಾಫಾಟ್
  rationale: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಯೆಹೂದದ ಅರಸನಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾಗಿರುವ ಹೆಸರಿನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: Ἰωράμ
  choice: ಯೋರಾಮ್
  rationale: ಗ್ರೀಕ್ Ἰωράμ ರೂಪಕ್ಕೆ ಸಮೀಪವಾಗಿದ್ದು, ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾಗಿರುವ ಸಂಕ್ಷಿಪ್ತ ಹೆಸರಿನ ರೂಪ.
- source_word: Ὀζίαν
  choice: ಉಜ್ಜೀಯ
  rationale: ಯೆಹೂದದ ಅರಸನಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಹೆಸರನ್ನು ಬಳಸಲಾಗಿದೆ; ಗ್ರೀಕ್ ಧ್ವನಿಗೆ ನೇರವಾದ ‘ಒಜೀಯಾಸ್’ಗಿಂತ ಗುರುತಿಸಲು ಸುಲಭ.
theological_decisions:
- issue: ಪುನರಾವರ್ತಿತ δὲ ಮತ್ತು ἐγέννησεν ಇರುವ ವಂಶಕ್ರಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಹೇಗೆ ನೀಡಬೇಕು
  choice: ಪ್ರತಿಯೊಂದು ತಂದೆ–ಮಗನ ಕೊಂಡಿಯನ್ನು ಪೂರ್ಣವಾಗಿ ಉಳಿಸಿ, ಅರ್ಧವಿರಾಮಗಳಿಂದ ಸಹಜವಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
  alternative: ಪ್ರತಿಯೊಂದು ವಾಕ್ಯಾಂಶದ ಮೊದಲು ‘ಮತ್ತು’ ಅಥವಾ ‘ಆಮೇಲೆ’ ಎಂದು ಪುನರಾವರ್ತಿಸುವುದು.
  rationale: ಮೂಲದ ಮೂರು ವಂಶಸಂಬಂಧಗಳೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಯುತ್ತವೆ; ಅದೇ ಸಮಯದಲ್ಲಿ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಅನಗತ್ಯ ಸಂಪರ್ಕಪದಗಳ ಪುನರಾವರ್ತನೆ ತಪ್ಪುತ್ತದೆ.
- issue: ಮುಖ್ಯಪಾಠದ Ἀσὰφ ಅನ್ನು ನಿರೀಕ್ಷಿತ ಐತಿಹಾಸಿಕ ಹೆಸರು ‘ಆಸಾ’ಗೆ ಹೊಂದಿಸಬೇಕೇ
  choice: ಮುಖ್ಯಪಾಠದಲ್ಲಿ ‘ಆಸಾಫ’ ಉಳಿಸಿ, ‘ಆಸಾ’ ಎಂಬ ಪಾಠಾಂತರ ಮತ್ತು ವಂಶಾವಳಿ ಸಂಬಂಧವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
  alternative: ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ವಂಶಾವಳಿಗೆ ಹೊಂದಿಸಿ ಮುಖ್ಯಪಾಠದಲ್ಲೇ ‘ಆಸಾ’ ಬಳಸುವುದು.
  rationale: ಲಭ್ಯವಿರುವ ಗ್ರೀಕ್ ಮುಖ್ಯಪಾಠಕ್ಕೆ ಆದ್ಯತೆ ನೀಡುತ್ತಾ, ನಿಜವಾದ ಪಾಠಾಂತರವನ್ನೂ ಐತಿಹಾಸಿಕ ಗುರುತಿನ ಪ್ರಶ್ನೆಯನ್ನೂ ಮರೆಮಾಡದೆ ಓದುಗರಿಗೆ ತಿಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗುವ ಗೌರವಯುತ ವಂಶಾವಳಿ ಶೈಲಿ. ಹೆಸರುಗಳಿಗೆ ಕನ್ನಡ ಸತ್ಯವೇದಿಕೆ ಪರಂಪರೆಯಲ್ಲಿ ಪರಿಚಿತ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ; ಮೂಲಪಾಠದ ವೈವಿಧ್ಯವನ್ನು ಅಡಿಕುರಿಪಿನ ಮೂಲಕ ಪಾರದರ್ಶಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
