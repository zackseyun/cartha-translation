id: MAT.1.19
reference: Matthew 1:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: kn
  text: ಅವಳ ಗಂಡನಾದ ಯೋಸೇಫನು[a] ನೀತಿವಂತನಾಗಿದ್ದನು. ಅವಳನ್ನು ಬಹಿರಂಗವಾಗಿ ಅವಮಾನಕ್ಕೆ ಗುರಿಮಾಡಲು[b] ಅವನು ಬಯಸದೆ, ಅವಳಿಗೆ ಗುಟ್ಟಾಗಿ ವಿಚ್ಛೇದನ ನೀಡಲು[c] ಉದ್ದೇಶಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವಳಿಗೆ ನಿಶ್ಚಿತಾರ್ಥವಾಗಿದ್ದ ಯೋಸೇಫನು.’ ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ‘ಅವಳ ಪುರುಷನು/ಗಂಡನು’ ಎಂದಿದೆ; ಇದು ಯೆಹೂದ್ಯರ ನಿಶ್ಚಿತಾರ್ಥದ ಕಾನೂನುಬದ್ಧ ಬಲವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಅವಳನ್ನು ಎಲ್ಲರ ಮುಂದೆ ನಾಚಿಕೆಗೀಡುಮಾಡಲು’ ಅಥವಾ ‘ಅವಳನ್ನು ಉದಾಹರಣೆಯಾಗಿ ತೋರಿಸಲು.’
    reason: lexical_alternative
  - marker: c
    text: ಪದಶಃ, ‘ಅವಳನ್ನು ಗುಟ್ಟಾಗಿ ಕಳುಹಿಸಿಬಿಡಲು.’ ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಇದು ನಿಶ್ಚಿತಾರ್ಥದ ಅವಧಿಯಲ್ಲೇ ವಿಧಿಪೂರ್ವಕವಾಗಿ ವಿಚ್ಛೇದನ ನೀಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: ಅವಳ ಗಂಡನಾದ
  rationale: ἀνήρ ಸಂಬಂಧದ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಗಂಡ’ ಎಂದರ್ಥ ಕೊಡುತ್ತದೆ. ಯೆಹೂದ್ಯರ ನಿಶ್ಚಿತಾರ್ಥವು ಕಾನೂನುಬದ್ಧವಾಗಿದ್ದು ಅದನ್ನು ವಿಧಿಪೂರ್ವಕವಾಗಿ ಕೊನೆಗೊಳಿಸಬೇಕಾಗಿದ್ದುದರಿಂದ, ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಗಂಡ’ ಸಹಜವೂ ಕಾನೂನುಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವುದೂ ಆಗಿದೆ; ಸಂಬಂಧದ ಹಂತವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
- source_word: δίκαιος
  choice: ನೀತಿವಂತನು
  rationale: δίκαιος ಯೋಸೇಫನ ನೈತಿಕ ಸಚ್ಚಾರಿತ್ರ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನೀತಿವಂತನು’ ಎಂಬುದು ಬೈಬಲಿನ ಧಾರ್ಮಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸಿಕೊಂಡು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲೂ ಸಹಜವಾಗಿದೆ.
- source_word: δειγματίσαι
  choice: ಬಹಿರಂಗವಾಗಿ ಅವಮಾನಕ್ಕೆ ಗುರಿಮಾಡಲು
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಒಬ್ಬರನ್ನು ಸಾರ್ವಜನಿಕವಾಗಿ ಬಯಲಿಗೆಳೆದು ನಾಚಿಕೆಗೀಡುಮಾಡುವ ಅರ್ಥ ಹೊಂದಿದೆ. ಈ ಅನುವಾದವು ಅದರ ಬಹಿರಂಗತೆ ಮತ್ತು ಅವಮಾನದ ಪರಿಣಾಮ ಎರಡನ್ನೂ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἐβουλήθη
  choice: ಉದ್ದೇಶಿಸಿದನು
  rationale: βούλομαι ಯೋಚಿಸಿ ಕೈಗೊಂಡ ಮನಸ್ಸು ಅಥವಾ ಸಂಕಲ್ಪವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಉದ್ದೇಶಿಸಿದನು’ ಆ ಪರಿಗಣಿತ ಮನೋಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: λάθρᾳ
  choice: ಗುಟ್ಟಾಗಿ
  rationale: λάθρᾳ ಸಾರ್ವಜನಿಕ ಗಮನಕ್ಕೆ ಬಾರದ, ಖಾಸಗಿ ರೀತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಗುಟ್ಟಾಗಿ’ ಬಹಿರಂಗ ಅವಮಾನವನ್ನು ತಪ್ಪಿಸುವ ಸನ್ನಿವೇಶಕ್ಕೆ ಹೊಂದಿಕೆಯಾಗುತ್ತದೆ.
- source_word: ἀπολῦσαι
  choice: ವಿಚ್ಛೇದನ ನೀಡಲು
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ἀπολύω ಕಾನೂನುಬದ್ಧ ನಿಶ್ಚಿತಾರ್ಥ ಸಂಬಂಧವನ್ನು ವಿಧಿಪೂರ್ವಕವಾಗಿ ರದ್ದುಪಡಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ವಿಚ್ಛೇದನ ನೀಡಲು’ ಅದರ ಕಾನೂನುಬಲವನ್ನು ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸದೆ ವಾಕ್ಯಕ್ರಮದಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ
  rationale: δὲ ಇಲ್ಲಿ ಕಥನವನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಯೋಜಕ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ‘ಮತ್ತು/ಆದರೆ’ ಸೇರಿಸುವುದಕ್ಕಿಂತ ಸಹಜ ವಾಕ್ಯಕ್ರಮವೇ ಅದರ ಕಾರ್ಯವನ್ನು ಸಮರ್ಪಕವಾಗಿ ನಿರ್ವಹಿಸುತ್ತದೆ.
- source_word: ὢν καὶ μὴ θέλων
  choice: ನೀತಿವಂತನಾಗಿದ್ದನು. ... ಬಯಸದೆ
  rationale: ಗ್ರೀಕ್ ಕೃದಂತ ರಚನೆ ಯೋಸೇಫನ ಉದ್ದೇಶಕ್ಕೆ ಹಿನ್ನೆಲೆ ನೀಡುತ್ತದೆ. ಓದಲು ಸುಲಭವಾದ ಆಧುನಿಕ ಕನ್ನಡಕ್ಕಾಗಿ ಇದನ್ನು ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿನ್ಯಾಸಗೊಳಿಸಿದ್ದರೂ, ನೀತಿವಂತಿಕೆ ಮತ್ತು ಅವಳನ್ನು ಅವಮಾನಿಸದಿರಬೇಕೆಂಬ ಬಯಕೆ ಎರಡನ್ನೂ ಅವನ ನಿರ್ಧಾರದ ಹಿನ್ನೆಲೆಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೋಸೇಫನನ್ನು δίκαιος ಎಂದು ವರ್ಣಿಸುವುದು
  choice: ‘ನೀತಿವಂತನು’ ಎಂದು ಅನುವಾದಿಸಿ, ಅದು ಕಟ್ಟುನಿಟ್ಟಿನ ಧರ್ಮಶಾಸ್ತ್ರ ಪಾಲನೆ, ಕರುಣೆ ಅಥವಾ ಎರಡನ್ನೂ ಸೂಚಿಸುತ್ತದೆಯೇ ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ.
  alternative: ‘ನ್ಯಾಯವಂತನು’ ಎಂದು ಕಾನೂನುನಿಷ್ಠೆಯನ್ನು ಒತ್ತಿಹೇಳುವುದು ಅಥವಾ ಕರುಣೆಯನ್ನು ಮಾತ್ರ ಮುಂದಿರಿಸುವ ವಿವರಣಾತ್ಮಕ ಅನುವಾದ.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಯೋಸೇಫನನ್ನು δίκαιος ಎಂದು ಹೇಳುವುದರ ಜೊತೆಗೆ ಮರಿಯಳನ್ನು ಬಹಿರಂಗವಾಗಿ ಅವಮಾನಿಸಲು ಅವನು ಬಯಸಲಿಲ್ಲವೆಂದು ತಿಳಿಸುತ್ತದೆ. ಅನುವಾದವು ನೈತಿಕ ಸಚ್ಚಾರಿತ್ರ್ಯ ಮತ್ತು ಕರುಣಾಮಯ ಸಂಯಮದ ನಡುವಿನ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- issue: ಯೋಸೇಫ ಮತ್ತು ಮರಿಯಳ ಕಾನೂನುಬದ್ಧ ಸಂಬಂಧ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಗಂಡ’ ಮತ್ತು ‘ವಿಚ್ಛೇದನ’ ಬಳಸಲಾಗಿದೆ.
  alternative: ‘ನಿಶ್ಚಿತಾರ್ಥ ಮಾಡಿಕೊಂಡವನು’ ಮತ್ತು ‘ನಿಶ್ಚಿತಾರ್ಥ ಮುರಿಯಲು’, ಅಥವಾ ಹೆಚ್ಚು ಪದಶಃ ‘ಅವಳ ಪುರುಷನು’ ಮತ್ತು ‘ಕಳುಹಿಸಿಬಿಡಲು’.
  rationale: ಗ್ರೀಕ್ ಪದಪ್ರಯೋಗ ಮತ್ತು ಮೊದಲ ಶತಮಾನದ ಯೆಹೂದ್ಯ ನಿಶ್ಚಿತಾರ್ಥದ ಹಿನ್ನೆಲೆ ಕಾನೂನುಬದ್ಧವಾಗಿ ಬಂಧಿಸುವ ಸಂಬಂಧವನ್ನೂ ಅದನ್ನು ವಿಧಿಪೂರ್ವಕವಾಗಿ ಕೊನೆಗೊಳಿಸುವ ಅಗತ್ಯವನ್ನೂ ಸೂಚಿಸುತ್ತವೆ. ಮುಖ್ಯ ಪಠ್ಯವು ಈ ಕಾನೂನುಬಲವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ, ಸ್ಪಷ್ಟ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ದೀರ್ಘ ಕೃದಂತ ರಚನೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ಓಟಕ್ಕಾಗಿ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿಭಜಿಸಲಾಗಿದೆ. ‘ನೀತಿವಂತನು’ ಎಂಬ ಬೈಬಲೀಯ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡು ಅದರ ಅರ್ಥವನ್ನು ಕರುಣೆ ಅಥವಾ ಕಾನೂನುನಿಷ್ಠೆ ಎಂಬ ಒಂದೇ ದಿಕ್ಕಿಗೆ ಸೀಮಿತಗೊಳಿಸಿಲ್ಲ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕ್ರಮವಾಗಿ ಸೇರಿವೆ.
