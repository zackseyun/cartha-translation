id: MAT.1.24
reference: Matthew 1:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: kn
  text: ಆಗ ಯೋಸೇಫನು ನಿದ್ರೆಯಿಂದ ಎಚ್ಚೆತ್ತು, ಕರ್ತನ ದೂತನು ತನಗೆ ಆಜ್ಞಾಪಿಸಿದಂತೆಯೇ ಮಾಡಿ, ತನ್ನ ಹೆಂಡತಿಯನ್ನು ಸ್ವೀಕರಿಸಿಕೊಂಡನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ತನ್ನ ಹೆಂಡತಿಯನ್ನು ತನ್ನ ಬಳಿಗೆ ಸೇರಿಸಿಕೊಂಡನು” ಅಥವಾ “ತನ್ನ ಹೆಂಡತಿಯನ್ನು ತನ್ನ ಮನೆಗೆ ಕರೆದುಕೊಂಡನು.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಒಬ್ಬರನ್ನು ತನ್ನ ಮನೆಯೊಳಗೆ ಸೇರಿಸಿಕೊಳ್ಳುವ ಅರ್ಥವನ್ನೂ ಹೊಂದಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ... ἀπὸ τοῦ ὕπνου
  choice: ಆಗ ... ನಿದ್ರೆಯಿಂದ ಎಚ್ಚೆತ್ತು
  rationale: δέ ಇಲ್ಲಿ ವಿರೋಧಕ್ಕಿಂತ ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἐγερθεὶς ಮತ್ತು ἀπὸ τοῦ ὕπνου ಸೇರಿ ನಿದ್ರೆಯಿಂದ ಎಚ್ಚರಗೊಳ್ಳುವುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ.
- source_word: ἐποίησεν ὡς
  choice: ಆಜ್ಞಾಪಿಸಿದಂತೆಯೇ ಮಾಡಿ
  rationale: ಆಜ್ಞೆಗೆ ಅನುಸಾರವಾಗಿ ನಡೆದುಕೊಂಡನು ಎಂಬ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ಉಳಿಸುತ್ತದೆ.
- source_word: προσέταξεν
  choice: ಆಜ್ಞಾಪಿಸಿದ
  rationale: ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಅಧಿಕಾರಪೂರ್ಣ ನಿರ್ದೇಶನದ ಬಲವನ್ನು ‘ಆಜ್ಞಾಪಿಸಿದ’ ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ὁ ἄγγελος κυρίου
  choice: ಕರ್ತನ ದೂತನು
  rationale: ಮತ್ತಾಯನಲ್ಲಿರುವ ಬೈಬಲೀಯ ಪದಪ್ರಯೋಗವನ್ನು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: παρέλαβεν
  choice: ತನ್ನ ಬಳಿಗೆ ಸೇರಿಸಿಕೊಂಡನು
  rationale: παραλαμβάνω ಇಲ್ಲಿ ಒಬ್ಬರನ್ನು ತನ್ನೊಡನೆ ಅಥವಾ ತನ್ನ ಗೃಹಕ್ಕೆ ಸ್ವೀಕರಿಸಿಕೊಳ್ಳುವ ಅರ್ಥವನ್ನು ಹೊಂದಬಹುದು. ‘ತನ್ನ ಬಳಿಗೆ ಸೇರಿಸಿಕೊಂಡನು’ ಎಂಬುದು ಕೇವಲ ದೈಹಿಕವಾಗಿ ‘ಕರೆದೊಯ್ದನು’ ಎನ್ನುವ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸಿ, ಸಂಬಂಧಾತ್ಮಕ ಹಾಗೂ ಗೃಹಸಂಬಂಧಿ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ತನ್ನ ಹೆಂಡತಿಯನ್ನು
  rationale: γυνή ಪದಕ್ಕೆ ‘ಸ್ತ್ರೀ’ ಅಥವಾ ‘ಹೆಂಡತಿ’ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ಇಲ್ಲಿನ ನಿಶ್ಚಿತಾರ್ಥ ಮತ್ತು ಕಾನೂನುಬದ್ಧ ವಿವಾಹದ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಹೆಂಡತಿ’ ಸಹಜವಾದ ಅರ್ಥವಾಗಿದೆ.
theological_decisions:
- issue: ದಾಂಪತ್ಯಸಂಬಂಧ ಪೂರ್ಣಗೊಳ್ಳುವ ಮೊದಲು γυνή ಪದದ ಅನುವಾದ
  choice: ತನ್ನ ಹೆಂಡತಿಯನ್ನು
  alternative: ಆ ಸ್ತ್ರೀಯನ್ನು
  rationale: ಮುಂದಿನ ವಚನವು ದಾಂಪತ್ಯಸಂಬಂಧ ಇನ್ನೂ ನಡೆದಿರಲಿಲ್ಲವೆಂದು ತಿಳಿಸಿದರೂ, ಮತ್ತಾಯನು ಮರಿಯಳನ್ನು ಸಾಮಾಜಿಕ-ಕಾನೂನುಬದ್ಧ ವಿವಾಹದ ಚೌಕಟ್ಟಿನಲ್ಲಿ ನಿರೂಪಿಸುತ್ತಾನೆ. ‘ಹೆಂಡತಿ’ ಎಂಬುದು ದಾಂಪತ್ಯಸಂಬಂಧ ಪೂರ್ಣಗೊಂಡಿತೆಂದು ಹೆಚ್ಚುವರಿಯಾಗಿ ಸೂಚಿಸದೆ ಆ ಚೌಕಟ್ಟನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: ἄγγελος κυρίου ಎಂಬ ಪದಗುಚ್ಛದಲ್ಲಿ κύριος ಅನುವಾದ
  choice: ಕರ್ತನ ದೂತನು
  alternative: ಯಹೋವನ ದೂತನು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿರುವ κύριος ಪದವನ್ನು ನೇರವಾಗಿ ‘ಕರ್ತನು’ ಎಂದು ಅನುವಾದಿಸುವುದು ಮೂಲದ ರೂಪವನ್ನೂ ಕನ್ನಡದ ಸ್ಥಾಪಿತ ಬೈಬಲೀಯ ಪದಪ್ರಯೋಗವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿಲ್ಲದ ನಿರ್ದಿಷ್ಟ ಹೀಬ್ರೂ ದೈವನಾಮವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: παρέλαβεν ಪದದ ವೈವಾಹಿಕ ಮತ್ತು ಗೃಹಸಂಬಂಧಿ ಸೂಕ್ಷ್ಮತೆ
  choice: ತನ್ನ ಬಳಿಗೆ ಸೇರಿಸಿಕೊಂಡನು
  alternative: ಕರೆದುಕೊಂಡನು
  rationale: ಈ ಪದವು ಅವಳನ್ನು ತನ್ನೊಡನೆ ಅಥವಾ ತನ್ನ ಮನೆಯೊಳಗೆ ಸ್ವೀಕರಿಸಿಕೊಂಡ ಅರ್ಥವನ್ನು ಹೊಂದಿರಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯವು ಆ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಅರ್ಥದ ಪರ್ಯಾಯವನ್ನು ಅಡಿಟಿಪ್ಪಣಿ ದಾಖಲಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆಗ’ ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತನ್ನ ಬಳಿಗೆ ಸೇರಿಸಿಕೊಂಡನು’ ಎಂಬ ಆಯ್ಕೆ ಮೂಲ ಕ್ರಿಯಾಪದದ ಸ್ವೀಕರಿಸಿಕೊಳ್ಳುವ ಮತ್ತು ಗೃಹಕ್ಕೆ ಸೇರಿಸಿಕೊಳ್ಳುವ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; [a] ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ನೀಡಲಾಗಿದೆ.
