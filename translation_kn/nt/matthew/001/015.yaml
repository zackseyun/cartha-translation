id: MAT.1.15
reference: Matthew 1:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: kn
  text: ಎಲಿಯೂದನು ಎಲಿಯಾಜರನ ತಂದೆಯಾದನು; ಎಲಿಯಾಜರನು ಮತ್ತಾನನ ತಂದೆಯಾದನು; ಮತ್ತಾನನು ಯಾಕೋಬನ ತಂದೆಯಾದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: ಎಲಿಯೂದ
  rationale: ಗ್ರೀಕ್ ವ್ಯಕ್ತಿನಾಮವನ್ನು ಅದರ ಧ್ವನಿಗೆ ಹೊಂದುವಂತೆ ಕನ್ನಡ ಲಿಪಿಯಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಕ್ರಮಸಂಬಂಧವನ್ನು ವಿರಾಮಚಿಹ್ನೆಯ ಮೂಲಕ ಸೂಚಿಸಲಾಗಿದೆ
  rationale: ವಂಶಾವಳಿಯ ಈ ಸರಣಿಯಲ್ಲಿ δέ ಸೌಮ್ಯವಾದ ಮುಂದುವರಿಕೆಯ ಸೂಚಕವಾಗಿದೆ. ಪ್ರತಿಯೊಂದು ಉಪವಾಕ್ಯದಲ್ಲೂ ‘ಮತ್ತು’ ಎಂದು ಪುನರಾವರ್ತಿಸುವುದಕ್ಕಿಂತ ಅರ್ಧವಿರಾಮವು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಕ್ರಮಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐγέννησεν
  choice: ತಂದೆಯಾದನು
  rationale: ವಂಶಾವಳಿಯ ಸಂದರ್ಭದಲ್ಲಿ ಪುರುಷ ವಂಶಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಹುಟ್ಟಿಸಿದನು’ ಎಂಬ ಅಸಹಜವಾದ ನೇರ causative ರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: τὸν
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಗ್ರೀಕ್ ನಿರ್ದಿಷ್ಟ ಲೇಖನವು ಕರ್ಮಪದವಾದ ವ್ಯಕ್ತಿನಾಮವನ್ನು ಗುರುತಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಈ ರಚನೆಯಲ್ಲಿ ಅದಕ್ಕೆ ಪ್ರತ್ಯೇಕ ಸಮಾನಪದ ಅಗತ್ಯವಿಲ್ಲ.
- source_word: Ἐλεάζαρ
  choice: ಎಲಿಯಾಜರ
  rationale: ಗ್ರೀಕ್ ವ್ಯಕ್ತಿನಾಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸುಲಭವಾಗಿ ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯ ಸೇರಿಸಬಹುದಾದ ರೂಪದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: Ματθάν
  choice: ಮತ್ತಾನ
  rationale: ಗ್ರೀಕ್ ವ್ಯಕ್ತಿನಾಮದ ಧ್ವನಿಯನ್ನು ಅನುಸರಿಸಿ ಕನ್ನಡದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: Ἰακώβ
  choice: ಯಾಕೋಬ
  rationale: ಗ್ರೀಕ್ ರೂಪಕ್ಕೆ ಹೊಂದುವ ಹಾಗೂ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ವ್ಯಕ್ತಿನಾಮದ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಪೂರ್ಣ ವಂಶಾವಳಿ ಶೈಲಿ. ಒಂದೇ ವಾಕ್ಯರಚನೆಯನ್ನು ಪುನರಾವರ್ತಿಸಿ ಮೂಲದ ಲಯ ಮತ್ತು ವಂಶಕ್ರಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
