id: MAT.15.5
reference: Matthew 15:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: kn
  text: 'ಆದರೆ ನೀವು ಹೀಗೆ ಹೇಳುತ್ತೀರಿ: ‘ಯಾರಾದರೂ ತನ್ನ ತಂದೆಗೆ ಅಥವಾ ತಾಯಿಗೆ, “ನನ್ನಿಂದ ನಿಮಗೆ ದೊರಕಬೇಕಾಗಿದ್ದದ್ದು ಕಾಣಿಕೆ[a]” ಎಂದು ಹೇಳಿದರೆ—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, “ಅರ್ಪಣೆ.” ಇದರ ಅರ್ಥ: ತಂದೆತಾಯಿಯ ಪೋಷಣೆಗೆ ಬಳಸಬಹುದಾಗಿದ್ದುದನ್ನು ದೇವರಿಗೆ ಮೀಸಲಿಟ್ಟದ್ದೆಂದು ಘೋಷಿಸುವುದು. “ಕೊರ್ಬಾನ್” ಎಂಬ ಪದವನ್ನು ಬಳಸುವ ಮಾರ್ಕ 7:11ನ್ನು ಹೋಲಿಸಿ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: ಆದರೆ ನೀವು ಹೀಗೆ ಹೇಳುತ್ತೀರಿ
  rationale: δὲ ಹಿಂದಿನ ದೇವಾಜ್ಞೆಯೊಂದಿಗೆ ವಿರೋಧವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; λέγετεಯ ಸಾಮಾನ್ಯ ವರ್ತಮಾನಾರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಹೀಗೆ ಹೇಳುತ್ತೀರಿ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: Ὃς ἂν εἴπῃ
  choice: ಯಾರಾದರೂ ... ಹೇಳಿದರೆ
  rationale: ಸಂಬಂಧವಾಚಕ ಸರ್ವನಾಮ, ἄν ಮತ್ತು ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯಾಪದವು ಅನಿರ್ದಿಷ್ಟ ಸಾಮಾನ್ಯ ಷರತ್ತನ್ನು ಸೂಚಿಸುತ್ತವೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಯಾರಾದರೂ ... ಹೇಳಿದರೆ’ ಅದನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: ತನ್ನ ತಂದೆಗೆ ಅಥವಾ ತಾಯಿಗೆ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ‘ಗೆ’ ಮೂಲಕ ಸೂಚಿಸಲಾಗಿದೆ; ವಾಕ್ಯದ ಅನಿರ್ದಿಷ್ಟ ವ್ಯಕ್ತಿಯೊಂದಿಗಿನ ಸಂಬಂಧವನ್ನು ‘ತನ್ನ’ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: Δῶρον
  choice: ದೇವರಿಗೆ ಅರ್ಪಿಸಿದ ಕಾಣಿಕೆ
  rationale: δῶρονಗೆ ‘ಕಾಣಿಕೆ’ ಅಥವಾ ‘ಅರ್ಪಣೆ’ ಎಂಬ ಅರ್ಥವಿದೆ. ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅದು ದೇವರಿಗೆ ಮೀಸಲಿಟ್ಟದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ದೇವರಿಗೆ ಅರ್ಪಿಸಿದ’ ಎಂಬುದು ಕನ್ನಡ ಓದುಗರಿಗೆ ಉದ್ದೇಶವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ, ಆದರೆ ಮಾರ್ಕ 7:11ರ ‘ಕೊರ್ಬಾನ್’ ಪದವನ್ನು ಮತ್ತಾಯನ ಪಠ್ಯಕ್ಕೆ ಆಮದು ಮಾಡುವುದಿಲ್ಲ.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ನನ್ನಿಂದ ನಿಮಗೆ ಸಿಗಬೇಕಾಗಿದ್ದ ಸಹಾಯವು
  rationale: ἐξ ἐμοῦಯ ‘ನನ್ನಿಂದ’ ಎಂಬ ಮೂಲಾಭಿಮುಖತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ὠφεληθῇςನ ಸಹಾಯ ಅಥವಾ ಪ್ರಯೋಜನ ಪಡೆಯುವ ಅರ್ಥವನ್ನೂ, ಆ ನೆರವು ವಾಸ್ತವವಾಗಿ ದೊರೆಯದೆ ಉಳಿಯುವ ಸಂದರ್ಭವನ್ನೂ ‘ಸಿಗಬೇಕಾಗಿದ್ದ ಸಹಾಯ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ δῶρον ಪದದ ಬದಲು ಮಾರ್ಕನ ತಾಂತ್ರಿಕ ‘ಕೊರ್ಬಾನ್’ ಪದವನ್ನು ಬಳಸಬೇಕೇ?
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ದೇವರಿಗೆ ಅರ್ಪಿಸಿದ ಕಾಣಿಕೆ’ ಎಂದು ಉಳಿಸುವುದು
  alternative: ‘ಕೊರ್ಬಾನ್’ ಅಥವಾ ‘ದೇವರಿಗೆ ಮೀಸಲಿಟ್ಟ ಅರ್ಪಣೆ’
  rationale: ಮತ್ತಾಯನು δῶρον ಎಂಬ ಪದವನ್ನು ಬಳಸುತ್ತಾನೆ; ಮಾರ್ಕ 7:11ರ κορβᾶν ಪದವನ್ನು ಅಲ್ಲ. ಆದ್ದರಿಂದ ಮತ್ತಾಯನ ಸ್ವಂತ ಪದಪ್ರಯೋಗಕ್ಕೆ ಆದ್ಯತೆ ನೀಡಿ, ಆಚರಣಾತ್ಮಕ ಹಿನ್ನೆಲೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ಶೈಲಿ. ಮೂಲ ವಾಕ್ಯವು ಮುಂದಿನ ವಚನದಲ್ಲಿ ಪೂರ್ಣಗೊಳ್ಳುವುದರಿಂದ ಕೊನೆಯಲ್ಲಿ ದೀರ್ಘಗೆರೆ ಇಟ್ಟು ಅಪೂರ್ಣ ಷರತ್ತುಬದ್ಧ ರಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಉಲ್ಲೇಖದೊಳಗಿನ ಮಾತು ಒಬ್ಬ ತಂದೆ ಅಥವಾ ತಾಯಿಗೆ ಉದ್ದೇಶಿತವಾದರೂ ಕನ್ನಡ ಗೌರವಪ್ರಯೋಗದಂತೆ ‘ನಿಮಗೆ’ ಬಳಸಲಾಗಿದೆ.
