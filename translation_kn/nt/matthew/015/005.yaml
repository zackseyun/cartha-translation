review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the contrast, the indefinite conditional, and the prospective benefit from the speaker. However, it places “devoted to God” in the main text, although Matthew’s Greek has only δῶρον (“gift/offering”). The cultic dedication is contextual and belongs appropriately in the note.
  naturalness: The Kannada is generally natural and maintains the deliberately unfinished construction leading into verse 6. “ನನ್ನಿಂದ ನಿಮಗೆ ದೊರಕಬೇಕಾಗಿದ್ದದ್ದು” is more concise and less interpretively narrow than “ಸಿಗಬೇಕಾಗಿದ್ದ ಸಹಾಯವು.”
  terminology: Use “ಕಾಣಿಕೆ” for δῶρον in the text. This retains the lexical sense without importing either “God” or Mark’s technical term “Corban.” The note may explain the contextual sense and offer “ಅರ್ಪಣೆ” as an alternative.
  issues:
  - severity: medium
    issue: “ದೇವರಿಗೆ ಅರ್ಪಿಸಿದ” is added to the main text.
    rationale: The source reads Δῶρον, ‘gift/offering,’ without explicitly saying ‘to God.’ Although the context supports such a dedication, adding it in the text reduces the source’s lexical restraint. The explanation should remain in the footnote.
  - severity: low
    issue: “ಸಹಾಯವು” narrows the source’s general ‘benefit.’
    rationale: ὠφεληθῇς refers broadly to receiving benefit. “ದೊರಕಬೇಕಾಗಿದ್ದದ್ದು” retains the open reference to whatever benefit or provision might have come from the speaker.
