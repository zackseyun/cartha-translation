  to: 'ಆದರೆ ನೀವು ಹೀಗೆ ಹೇಳುತ್ತೀರಿ: ‘ಯಾರಾದರೂ ತನ್ನ ತಂದೆಗೆ ಅಥವಾ ತಾಯಿಗೆ, “ನನ್ನಿಂದ ನಿಮಗೆ ದೊರಕಬೇಕಾಗಿದ್ದದ್ದು ಕಾಣಿಕೆ[a]” ಎಂದು ಹೇಳಿದರೆ—’'
