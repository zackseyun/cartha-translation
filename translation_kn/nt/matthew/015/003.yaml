id: MAT.15.3
reference: Matthew 15:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: kn
  text: 'ಆದರೆ ಆತನು ಅವರಿಗೆ ಉತ್ತರವಾಗಿ ಹೇಳಿದನು: “ನಿಮ್ಮ ಸಂಪ್ರದಾಯದ ಕಾರಣದಿಂದ ನೀವೂ ದೇವರ ಆಜ್ಞೆಯನ್ನು ಏಕೆ ಮೀರುತ್ತೀರಿ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ಉತ್ತರವಾಗಿ ಹೇಳಿದ್ದು
  rationale: ಕೃದಂತ ಮತ್ತು ಮುಖ್ಯ ಕ್ರಿಯಾಪದ ಎರಡನ್ನೂ ಪ್ರತಿಬಿಂಬಿಸುವುದರ ಜೊತೆಗೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಕೇಳಿಸುವ ರೂಪ.
- source_word: Διὰ τί
  choice: ಏಕೆ
  rationale: ಕಾರಣವನ್ನು ಪ್ರಶ್ನಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿಗೆ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: καὶ ὑμεῖς
  choice: ನೀವೂ
  rationale: ಹಿಂದಿನ ಆರೋಪಕ್ಕೆ ಪ್ರತಿಯಾಗಿ ‘ನೀವು ಸಹ’ ಎಂಬ ಹೋಲಿಕೆ ಮತ್ತು ಪ್ರತಿವಾದದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: παραβαίνετε
  choice: ಮೀರುತ್ತೀರಿ
  rationale: ಆಜ್ಞೆಯ ಮಿತಿಯನ್ನು ದಾಟುವುದು ಅಥವಾ ಅದನ್ನು ಉಲ್ಲಂಘಿಸುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟ, ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: ದೇವರ ಆಜ್ಞೆಯನ್ನು
  rationale: ದೈವಿಕ ಅಧಿಕಾರದ ಸ್ಪಷ್ಟತೆಯನ್ನೂ ಮೂಲದ ಸಂಬಂಧವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: ನಿಮ್ಮ ಸಂಪ್ರದಾಯದ ನಿಮಿತ್ತ
  rationale: διά + accusative ಸೂಚಿಸುವ ಕಾರಣ ಅಥವಾ ಆಧಾರವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಸಂಪ್ರದಾಯ’ವು ಹಸ್ತಾಂತರಿಸಲ್ಪಟ್ಟ ಆಚರಣೆ/ಬೋಧನೆ ಎಂಬ παράδοσις ಪದದ ಅರ್ಥವನ್ನು ಹೊರುತ್ತದೆ.
theological_decisions:
- issue: ದೇವರ ಆಜ್ಞೆ ಮತ್ತು ಮಾನವ ಸಂಪ್ರದಾಯದ ನಡುವಿನ ವ್ಯತ್ಯಾಸ
  choice: ‘ದೇವರ ಆಜ್ಞೆ’ ಮತ್ತು ‘ನಿಮ್ಮ ಸಂಪ್ರದಾಯ’ ಎಂಬ ನೇರ ವಿರೋಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಸಂಪ್ರದಾಯ’ವನ್ನು ‘ಬೋಧನೆ’ ಅಥವಾ ‘ಪದ್ಧತಿ’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಯೇಸುವಿನ ಖಂಡನೆ ಎಲ್ಲ ಸಂಪ್ರದಾಯಗಳ ಮೇಲಲ್ಲ; ಇಲ್ಲಿ ಉದ್ದೇಶಿಸಲಾದ ಅವರ ಸಂಪ್ರದಾಯವು ದೇವರ ಆಜ್ಞೆಗೆ ವಿರುದ್ಧವಾಗಿರುವುದರ ಮೇಲೆ. ‘ನಿಮ್ಮ’ ಎಂಬುದು ಆ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಕಾಯುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗುವಂತೆ, ಆದರೆ ವಾಕ್ಯದ ಶಾಸ್ತ್ರೀಯ ಗೌರವ ಮತ್ತು ಪ್ರತಿವಾದದ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಈ ಕರಡಿನಲ್ಲಿ ಪಾದಟಿಪ್ಪಣಿ ಅಗತ್ಯವಿಲ್ಲ.
