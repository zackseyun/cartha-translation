- from: 'ಆದರೆ ಆತನು ಅವರಿಗೆ ಉತ್ತರವಾಗಿ ಹೇಳಿದ್ದು: “ನಿಮ್ಮ ಸಂಪ್ರದಾಯದ ನಿಮಿತ್ತ ನೀವೂ ದೇವರ ಆಜ್ಞೆಯನ್ನು ಏಕೆ ಮೀರುತ್ತೀರಿ?”'
  to: 'ಆದರೆ ಆತನು ಅವರಿಗೆ ಉತ್ತರವಾಗಿ ಹೇಳಿದನು: “ನಿಮ್ಮ ಸಂಪ್ರದಾಯದ ಕಾರಣದಿಂದ ನೀವೂ ದೇವರ ಆಜ್ಞೆಯನ್ನು ಏಕೆ ಮೀರುತ್ತೀರಿ?”'
  rationale: The revision corrects the Kannada finite verb required for the direct-speech introduction and clarifies the causal force of διὰ τὴν παράδοσιν ὑμῶν. It otherwise preserves the draft’s faithful terminology, formal register, and rhetorical emphasis.
  reviewer_model: gpt-5.6-terra
