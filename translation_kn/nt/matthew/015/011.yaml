id: MAT.15.11
reference: Matthew 15:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: kn
  text: ಬಾಯಿಯೊಳಗೆ ಹೋಗುವುದು ಮನುಷ್ಯನನ್ನು[a] ಅಶುದ್ಧಗೊಳಿಸುವುದಿಲ್ಲ; ಆದರೆ ಬಾಯಿಯಿಂದ ಹೊರಗೆ ಬರುವುದೇ ಮನುಷ್ಯನನ್ನು ಅಶುದ್ಧಗೊಳಿಸುತ್ತದೆ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಇಲ್ಲಿ “ಮನುಷ್ಯ” ಎಂಬುದು ಸಾಮಾನ್ಯವಾಗಿ ಯಾವುದೇ ಮಾನವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: cultural_note
  - marker: b
    text: “ಅಶುದ್ಧಗೊಳಿಸುತ್ತದೆ” ಎಂಬುದನ್ನು “ಅಶುದ್ಧನನ್ನಾಗಿ ಮಾಡುತ್ತದೆ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಶುದ್ಧಾಶುದ್ಧತೆಯ ಅರ್ಥದಲ್ಲಿ ಒಬ್ಬನನ್ನು ಅಶುದ್ಧನನ್ನಾಗಿ ಮಾಡುವುದನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: ಅಶುದ್ಧಗೊಳಿಸುತ್ತದೆ
  rationale: ಶುದ್ಧಾಶುದ್ಧತೆಯ ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಕ್ರಿಯಾಪದವು ಒಬ್ಬನನ್ನು ಅಶುದ್ಧನನ್ನಾಗಿ ಮಾಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಆಯ್ಕೆ ಕೇವಲ ದೈಹಿಕ ಕೊಳಕನ್ನು ಸೂಚಿಸದೆ, ಧಾರ್ಮಿಕ ಹಾಗೂ ನೈತಿಕ ಅಶುದ್ಧತೆಯ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ಬಾಯಿಯೊಳಗೆ ಹೋಗುವುದು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಹೋಗುವುದು’ ಎಂದು ಕೊಟ್ಟಿದ್ದು, εἰς ಸೂಚಿಸುವ ಒಳಮುಖ ಚಲನೆಯನ್ನು ‘ಬಾಯಿಯೊಳಗೆ’ ಎಂಬುದರಿಂದ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ಬಾಯಿಯಿಂದ ಹೊರಗೆ ಬರುವುದು
  rationale: ἐκπορευόμενον ಮತ್ತು ἐκ ಸೂಚಿಸುವ ಹೊರಮುಖ ಚಲನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹಾಗೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἄνθρωπον
  choice: ಮನುಷ್ಯನನ್ನು
  rationale: ಮೂಲದ ಏಕವಚನ ಪ್ರತಿನಿಧಿಕ ಪದವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಮನುಷ್ಯ’ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಮಾನವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸಬಲ್ಲದು.
- source_word: τοῦτο
  choice: ಬರುವುದೇ
  rationale: ‘ಏ’ ಒತ್ತನ್ನು ಬಳಸಿ, ಒಳಗೆ ಹೋಗುವುದಲ್ಲ, ಹೊರಗೆ ಬರುವುದೇ ಅಶುದ್ಧಗೊಳಿಸುತ್ತದೆ ಎಂಬ ಗ್ರೀಕ್ ಸೂಚಕಪದದ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: οὐ ... ἀλλὰ
  choice: …ಅಶುದ್ಧಗೊಳಿಸುವುದಿಲ್ಲ; ಆದರೆ…
  rationale: ಮೂಲದ ನಿರಾಕರಣೆ–ವಿರೋಧ ರಚನೆಯನ್ನು ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: κοινόω ಪದದಲ್ಲಿರುವ ಶುದ್ಧಾಶುದ್ಧತೆಯ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ‘ಅಶುದ್ಧಗೊಳಿಸುತ್ತದೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಕಲುಷಿತಗೊಳಿಸುತ್ತದೆ’ ಅಥವಾ ‘ಮೈಲಿಗೆಯಾಗಿಸುತ್ತದೆ’
  rationale: ‘ಅಶುದ್ಧಗೊಳಿಸುತ್ತದೆ’ ಎಂಬುದು ಆಚರಣಾತ್ಮಕ ಮತ್ತು ನೈತಿಕ ಅಶುದ್ಧತೆ ಎರಡರ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಮಾತನ್ನು ಕೇವಲ ಸ್ವಚ್ಛತೆ ಅಥವಾ ಕೊಳಕಿನ ವಿಷಯಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: ἄνθρωπον ಪದದ ಪ್ರತಿನಿಧಿಕ ಏಕವಚನ
  choice: ‘ಮನುಷ್ಯನನ್ನು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ವ್ಯಕ್ತಿಯನ್ನು’ ಅಥವಾ ‘ಜನರನ್ನು’
  rationale: ಮೂಲದ ಏಕವಚನ ರೂಪವನ್ನು ಉಳಿಸುತ್ತಲೇ, ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯ ಮಾನವ ವ್ಯಕ್ತಿಯ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ಮೂಲದ ಸಮಾಂತರ ವಿರೋಧ ಹಾಗೂ ಎರಡನೇ ಭಾಗದ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ.
