id: MAT.15.6
reference: Matthew 15:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: kn
  text: ‘ಅವನು ತನ್ನ ತಂದೆಯನ್ನು ಖಂಡಿತವಾಗಿಯೂ ಗೌರವಿಸಬೇಕಾಗಿಲ್ಲ’[b]. ಮತ್ತು ನಿಮ್ಮ ಸಂಪ್ರದಾಯದ ನಿಮಿತ್ತ ನೀವು ದೇವರ ವಾಕ್ಯವನ್ನು ನಿರರ್ಥಕಗೊಳಿಸಿದ್ದೀರಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ ‘ದೇವರ ವಾಕ್ಯ’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ದೇವರ ಆಜ್ಞೆ’ ಎಂದಿದೆ.
    reason: textual_variant
  - marker: b
    text: ಇಲ್ಲಿ ‘ಗೌರವಿಸುವುದು’ ಎಂದರೆ ಕೇವಲ ಮರ್ಯಾದೆ ತೋರಿಸುವುದಷ್ಟೇ ಅಲ್ಲದೆ, ತಂದೆತಾಯಿಗಳನ್ನು ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪೋಷಿಸುವ ಕರ್ತವ್ಯವನ್ನೂ ಒಳಗೊಂಡಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: ಗೌರವಿಸಬೇಕಾಗಿಲ್ಲ
  rationale: οὐ μή ಎಂಬ ಒತ್ತಿಹೇಳುವ ನಿಷೇಧವು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಂಪ್ರದಾಯದ ತೀರ್ಪಿನಿಂದ ಕರ್ತವ್ಯವಿಲ್ಲವೆಂದು ಹೇಳುವ ಅರ್ಥ ನೀಡುತ್ತದೆ. ‘ಗೌರವಿಸಬೇಕಾಗಿಲ್ಲ’ ಎಂಬುದು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಆ ಅನುಮತಿಸೂಚಕ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ; ಸಂದರ್ಭವು ಅದರ ಖಚಿತತೆಯನ್ನೂ ಬಲವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τιμήσει
  choice: ಗೌರವಿಸು
  rationale: τιμάω ಎಂಬುದರ ಮೂಲ ಅರ್ಥ ‘ಗೌರವಿಸು.’ ಇಲ್ಲಿ ತಂದೆತಾಯಿಯ ಆರ್ಥಿಕ ಪಾಲನೆಯೂ ಒಳಗೊಂಡಿರಬಹುದಾದರೂ, ಮೂಲ ಆಜ್ಞೆಯ ಪದಸಂಬಂಧ ಉಳಿಯುವಂತೆ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಗೌರವಿಸು’ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τὸν πατέρα αὐτοῦ
  choice: ತನ್ನ ತಂದೆಯನ್ನು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ಏಕವಚನದಲ್ಲಿ ‘ಅವನ ತಂದೆ’ ಎಂದಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಕರ್ತೃಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸಲು ‘ತನ್ನ ತಂದೆಯನ್ನು’ ಬಳಸಲಾಗಿದೆ; ‘ತಂದೆ ಅಥವಾ ತಾಯಿ’ ಎಂದು ವಿಸ್ತರಿಸಿಲ್ಲ.
- source_word: ἠκυρώσατε
  choice: ನಿರರ್ಥಕಗೊಳಿಸಿದ್ದೀರಿ
  rationale: ἀκυρόω ಎಂದರೆ ಅಮಾನ್ಯಗೊಳಿಸುವುದು ಅಥವಾ ಪರಿಣಾಮವಿಲ್ಲದಂತೆ ಮಾಡುವುದು. ‘ನಿರರ್ಥಕಗೊಳಿಸಿದ್ದೀರಿ’ ದೇವರ ವಾಕ್ಯವನ್ನು ಅವರ ಸಂಪ್ರದಾಯವು ಕಾರ್ಯತಃ ಫಲವಿಲ್ಲದಂತೆ ಮಾಡಿದೆ ಎಂಬ ಬಲವಾದ ಆರೋಪವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ದೇವರ ವಾಕ್ಯವನ್ನು
  rationale: SBLGNTಯ λόγον ಎಂಬ ಪಾಠವನ್ನು ನೇರವಾಗಿ ಅನುಸರಿಸಲಾಗಿದೆ. ‘ದೇವರ ಆಜ್ಞೆ’ ಎಂಬ ಪರ್ಯಾಯ ಪಾಠವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ತರದೆ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: ನಿಮ್ಮ ಸಂಪ್ರದಾಯದ ನಿಮಿತ್ತ
  rationale: ಆಪಾದನ ವಿಭಕ್ತಿಯೊಂದಿಗಿನ διά ಕಾರಣ ಅಥವಾ ನಿಮಿತ್ತವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನಿಮ್ಮ ಸಂಪ್ರದಾಯದ ನಿಮಿತ್ತ’ ಎಂಬುದು ಅವರ ಸಂಪ್ರದಾಯವೇ ದೇವರ ವಾಕ್ಯವನ್ನು ನಿರರ್ಥಕಗೊಳಿಸುವ ಕಾರಣವಾಗಿದೆ ಎಂಬುದನ್ನು ಘನವಾದ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹೇಳುತ್ತದೆ.
theological_decisions:
- issue: ‘ಗೌರವಿಸು’ ಎಂಬುದರಲ್ಲಿ ತಂದೆತಾಯಿಗೆ ಭೌತಿಕ ನೆರವು ನೀಡುವ ಕರ್ತವ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಬೇಕೇ?
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಗೌರವಿಸು’ ಎಂದೇ ಉಳಿಸಿ, ಅದರ ಪ್ರಾಯೋಗಿಕ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಪೋಷಿಸು’ ಅಥವಾ ‘ಆರ್ಥಿಕವಾಗಿ ನೆರವಾಗು’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ವಾದದ ಸಂದರ್ಭವು ಭೌತಿಕ ನೆರವನ್ನು ಒಳಗೊಂಡಿದ್ದರೂ, ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ವಿಶಾಲ ಅರ್ಥದ τιμάω. ‘ಗೌರವಿಸು’ ಎಂದು ಉಳಿಸುವುದರಿಂದ ಆಜ್ಞೆಯೊಂದಿಗಿನ ಪದಸಂಬಂಧ ಮತ್ತು ಅರ್ಥವ್ಯಾಪ್ತಿ ಎರಡೂ ಉಳಿಯುತ್ತವೆ.
- issue: ಸಮೀಪದ ಸಂದರ್ಭ ಅಥವಾ ಪಾಠಾಂತರಕ್ಕೆ ಹೊಂದಿಸುವುದೇ?
  choice: SBLGNTಯಲ್ಲಿರುವ ಏಕವಚನ ‘ತಂದೆ’ ಮತ್ತು ‘ದೇವರ ವಾಕ್ಯ’ವನ್ನೇ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ತಂದೆ ಅಥವಾ ತಾಯಿ’ ಎಂದು ವಿಸ್ತರಿಸುವುದು ಅಥವಾ ‘ದೇವರ ಆಜ್ಞೆ’ ಎಂಬ ಪಾಠವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಳಸುವುದು.
  rationale: ಮೂಲಭಾಷಾ ಪಠ್ಯಕ್ಕೆ ಪ್ರಾಮುಖ್ಯ ನೀಡಿ, ಸಂದರ್ಭದ ಆಧಾರದ ಮೇಲೆ ವಿಸ್ತರಿಸುವುದನ್ನೂ ಪಾಠಾಂತರವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದನ್ನೂ ತಪ್ಪಿಸಲಾಗಿದೆ.
- issue: ಮೊದಲ ವಾಕ್ಯಾಂಶದ ಅಪೂರ್ಣ ಸಂವಾದಾತ್ಮಕ ಸ್ವರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಹೇಗೆ ನಿರ್ವಹಿಸಬೇಕು?
  choice: ಹಿಂದಿನ ವಾಕ್ಯದ ಸಂಪ್ರದಾಯದ ಹೇಳಿಕೆಯ ಮುಂದುವರಿಕೆಯಾಗಿರುವುದನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸಲು ‘ಎಂದು ನೀವು ಹೇಳುತ್ತೀರಿ’ ಸೇರಿಸಲಾಗಿದೆ.
  alternative: ‘ಅವನು ತನ್ನ ತಂದೆಯನ್ನು ಗೌರವಿಸಬೇಕಾಗಿಲ್ಲ’ ಎಂದು ಮಾತ್ರ ಇಡುವುದು.
  rationale: ಕೊಟ್ಟಿರುವ ವಚನವು ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿನ ಷರತ್ತುಬದ್ಧ ಹೇಳಿಕೆಯನ್ನು ಮುಂದುವರಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ವಚನವಾಗಿ ಓದಿದಾಗ ವಕ್ತೃ ಮತ್ತು ಉಲ್ಲೇಖ ಸ್ಪಷ್ಟವಾಗಲು ಈ ಕನಿಷ್ಠ ಪೂರಕ ಪದಗಳು ಅಗತ್ಯ; ಅವು ಹೊಸ ತಾತ್ವಿಕ ಅರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ವಚನವು ಹಿಂದಿನ ವಾಕ್ಯದ ಮಧ್ಯದಿಂದ ಆರಂಭವಾಗುವುದರಿಂದ ಉಲ್ಲೇಖಚಿಹ್ನೆ ಮತ್ತು ‘ಎಂದು ನೀವು ಹೇಳುತ್ತೀರಿ’ ಎಂಬ ಕನಿಷ್ಠ ಸಂದರ್ಭಪೂರಕ ರೂಪ ಬಳಸಲಾಗಿದೆ. ಎರಡೂ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
