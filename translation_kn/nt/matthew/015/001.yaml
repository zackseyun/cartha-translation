id: MAT.15.1
reference: Matthew 15:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: kn
  text: 'ಆಗ ಯೆರೂಸಲೇಮಿನಿಂದ ಫರಿಸಾಯರೂ ಶಾಸ್ತ್ರಿಗಳೂ[b] ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು[a], ಹೀಗೆಂದರು:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಯೇಸುವನ್ನು ಸಮೀಪಿಸಿ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ಶಾಸ್ತ್ರಿಗಳು’ ಎಂಬುದು ಈ ಸಂದರ್ಭದಲ್ಲಿ ‘ಧರ್ಮಶಾಸ್ತ್ರದ ಪರಿಣತರು’ ಅಥವಾ ‘ಧರ್ಮಶಾಸ್ತ್ರದ ಬೋಧಕರು’ ಎಂದೂ ಅರ್ಥವಾಗಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಪರಿಚಯಿಸುವ ಕಾಲಸೂಚಕವಾಗಿ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು ಕಥನದ ಹರಿವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: προσέρχονται
  choice: ಬಳಿಗೆ ಬಂದು
  rationale: ಯೇಸುವಿನ ಕಡೆಗೆ ಬಂದು ಸಮೀಪಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕನ್ನಡ ಕಥನಶೈಲಿಗೆ ತಕ್ಕಂತೆ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಭೂತಕಾಲದ ಸಂಯೋಜಕ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: τῷ Ἰησοῦ
  choice: ಯೇಸುವಿನ ಬಳಿಗೆ
  rationale: προσέρχομαι ಜೊತೆಗಿನ ದತ್ತಿವಿಭಕ್ತಿಯು ಸಮೀಪಿಸಲ್ಪಟ್ಟ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: ಯೆರೂಸಲೇಮಿನಿಂದ
  rationale: ἀπό ಸೂಚಿಸುವ ಮೂಲಸ್ಥಳವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಅಧಿಕೃತ ನಿಯೋಗವೆಂಬ ಅರ್ಥವನ್ನು ಹೆಚ್ಚುವರಿಯಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: Φαρισαῖοι
  choice: ಫರಿಸಾಯರು
  rationale: ಐತಿಹಾಸಿಕ-ಧಾರ್ಮಿಕ ಗುಂಪಿನ ಪರಿಚಿತ ಕನ್ನಡ ನಾಮರೂಪ.
- source_word: γραμματεῖς
  choice: ಶಾಸ್ತ್ರಿಗಳು
  rationale: ಧರ್ಮಶಾಸ್ತ್ರದ ನಕಲು, ಅಧ್ಯಯನ ಮತ್ತು ವ್ಯಾಖ್ಯಾನದಲ್ಲಿ ಪರಿಣತರಾಗಿದ್ದವರನ್ನು ಸೂಚಿಸುವ ಸುವಾರ್ತಾ ಸಂದರ್ಭದ ಪರಿಚಿತ ಕನ್ನಡ ಪದ; ಪರ್ಯಾಯ ವಿವರಣೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: καὶ
  choice: -ರೂ ... -ರೂ
  rationale: ಎರಡು ಗುಂಪುಗಳನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸಮನ್ವಯಗೊಳಿಸುತ್ತದೆ.
- source_word: λέγοντες
  choice: ಹೀಗೆ ಕೇಳಿದರು
  rationale: ಮುಂದಿನ ವಚನದಲ್ಲಿರುವ ಪ್ರಶ್ನೆಯನ್ನು ಪರಿಚಯಿಸುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ‘ಹೀಗೆ ಕೇಳಿದರು’ ಸಹಜವಾಗಿದೆ; ಗ್ರೀಕ್‌ನ ಶಾಬ್ದಿಕ ಅರ್ಥ ‘ಹೇಳುತ್ತಾ’ ಎಂಬುದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಕಥನದ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲ
  choice: ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಗಾಗಿ ‘ಬಂದು ... ಕೇಳಿದರು’ ಎಂಬ ಭೂತಕಾಲದ ರೂಪ
  alternative: ‘ಬರುತ್ತಾರೆ ... ಹೇಳುತ್ತಾ’ ಎಂದು ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸುವುದು
  rationale: ಗ್ರೀಕ್ προσέρχονται ಐತಿಹಾಸಿಕ ವರ್ತಮಾನದಲ್ಲಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ಅದನ್ನು ಅಕ್ಷರಶಃ ಉಳಿಸುವುದು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅಸಹಜವಾಗಿ ಕೇಳಬಹುದು. ಭೂತಕಾಲವು ಘಟನೆಯ ಅರ್ಥವನ್ನು ಉಳಿಸಿ ಸರಾಗ ಕಥನ ನೀಡುತ್ತದೆ; ಯಾವುದೇ ತಾತ್ತ್ವಿಕ ನಿರ್ಣಯವನ್ನು ಬದಲಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಅನುಕೂಲವಾದ ಶೈಲಿ. ‘ಶಾಸ್ತ್ರಿಗಳು’ ಎಂಬ ಪರಂಪರೆಯಿಂದ ಪರಿಚಿತ ಪದವನ್ನು ಉಳಿಸಿ ಅದರ ಕಾನೂನುಪಂಡಿತ/ಧರ್ಮಶಾಸ್ತ್ರ ಬೋಧಕ ಅರ್ಥವನ್ನು ಸಂದರ್ಭವೇ ಹೊರುವಂತೆ ಮಾಡಲಾಗಿದೆ.
