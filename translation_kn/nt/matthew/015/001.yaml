  terminology: ‘ಫರಿಸಾಯರು’ and ‘ಶಾಸ್ತ್ರಿಗಳು’ are established and suitable renderings. A footnote should properly provide the contextual alternative for ‘ಶಾಸ್ತ್ರಿಗಳು,’ rather than commenting on the following verse’s question form.
