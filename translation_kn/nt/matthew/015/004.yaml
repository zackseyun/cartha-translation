id: MAT.15.4
reference: Matthew 15:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: kn
  text: 'ಏಕೆಂದರೆ ದೇವರು ಹೇಳಿದನು: “ನಿನ್ನ ತಂದೆತಾಯಿಗಳನ್ನು ಗೌರವಿಸು,” ಮತ್ತು “ತಂದೆಯನ್ನಾಗಲಿ ತಾಯಿಯನ್ನಾಗಲಿ ದೂಷಿಸುವವನು[a] ಖಂಡಿತವಾಗಿ ಸಾಯಬೇಕು.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ತಂದೆಯನ್ನಾಗಲಿ ತಾಯಿಯನ್ನಾಗಲಿ ಶಪಿಸುವವನು ಖಂಡಿತವಾಗಿ ಸಾಯಬೇಕು.”
    reason: κακολογῶν ಎಂಬ ಪದಕ್ಕೆ ‘ಶಪಿಸುವವನು’ ಎಂಬುದು ಸಾಧ್ಯವಾದ ಪರ್ಯಾಯ ಅನುವಾದವಾಗಿದೆ; θανάτῳ τελευτάτω ಎಂಬ ಮರಣದಂಡನಾ ಸೂತ್ರದ ಮೂಲಪಠ್ಯದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: ಏಕೆಂದರೆ ದೇವರು
  rationale: γάρ ಹಿಂದಿನ ಮಾತಿಗೆ ಕಾರಣ ಅಥವಾ ವಿವರಣೆಯನ್ನು ಜೋಡಿಸುತ್ತದೆ; ‘ಏಕೆಂದರೆ ದೇವರು’ ಎಂಬುದು ಆ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἶπεν
  choice: ಹೇಳಿದ್ದು
  rationale: λέγω ಇಲ್ಲಿ ಶಾಸ್ತ್ರೋಕ್ತಿಯನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ‘ಹೇಳಿದ್ದು’ ಸರಳ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ಪಠ್ಯದಲ್ಲಿಲ್ಲದ ಬಲವಾದ ‘ಆಜ್ಞಾಪಿಸಿದ್ದು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: Τίμα
  choice: ಗೌರವಿಸು
  rationale: τιμάω ಯೋಗ್ಯವಾದ ಗೌರವವನ್ನು ಸಲ್ಲಿಸುವ ಅರ್ಥ ಹೊಂದಿದೆ; ‘ಗೌರವಿಸು’ ಆಜ್ಞೆಯ ನೈತಿಕ ಭಾರವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ನಿನ್ನ ತಂದೆತಾಯಿಗಳನ್ನು
  rationale: ಉಲ್ಲೇಖಿತ ದಶಾಜ್ಞೆಯ ಅರ್ಥಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಸ್ವಾಮ್ಯಸೂಚಕ ‘ನಿನ್ನ’ ಸಹಜವಾಗಿದೆ; ‘ತಂದೆತಾಯಿಗಳು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಎರಡರನ್ನೂ ಒಟ್ಟಾಗಿ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ὁ κακολογῶν
  choice: ದೂಷಿಸುವವನು
  rationale: κακολογέω ಕೆಟ್ಟದಾಗಿ ಮಾತನಾಡುವುದು, ನಿಂದಿಸುವುದು ಅಥವಾ ಶಪಿಸುವುದು ಎಂಬ ವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ. ‘ದೂಷಿಸುವವನು’ ಆ ಗಂಭೀರ ನಕಾರಾತ್ಮಕ ಮಾತಿನ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πατέρα ἢ μητέρα
  choice: ತಂದೆಯನ್ನಾಗಲಿ ತಾಯಿಯನ್ನಾಗಲಿ
  rationale: ἢ ಯ ಪರ್ಯಾಯ ಸಂಬಂಧವನ್ನು ‘-ಆಗಲಿ ... -ಆಗಲಿ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಗ್ರೀಕ್‌ನ ಸಾಮಾನ್ಯ ಉಲ್ಲೇಖಕ್ಕೆ ಅನಗತ್ಯ ಸ್ವಾಮ್ಯಸೂಚಕವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: θανάτῳ τελευτάτω
  choice: ಖಂಡಿತವಾಗಿ ಸಾಯಬೇಕು
  rationale: ಇದು ಗಂಭೀರ ಮರಣದಂಡನಾ ಸೂತ್ರ. ‘ಖಂಡಿತವಾಗಿ ಸಾಯಬೇಕು’ ಅದರ ನಿಶ್ಚಿತತೆ ಮತ್ತು ಕಾನೂನುಬದ್ಧ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆಯಾದರೂ, ಗ್ರೀಕ್ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದ ಮಾನವ ಕಾರ್ಯಕರ್ತನನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಶಾಸ್ತ್ರೀಯ ಕಾನೂನಿನ ಮರಣದಂಡನಾ ಸೂತ್ರದ ಅನುವಾದ
  choice: ಖಂಡಿತವಾಗಿ ಸಾಯಬೇಕು
  alternative: ಮರಣದಂಡನೆಗೆ ಒಳಗಾಗಬೇಕು
  rationale: θανάτῳ τελευτάτω ಮರಣದ ನಿಶ್ಚಿತತೆಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ; ‘ಖಂಡಿತವಾಗಿ ಸಾಯಬೇಕು’ ಅದರ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸಿ, ಮರಣವನ್ನು ಯಾರು ಜಾರಿಗೊಳಿಸುತ್ತಾರೆ ಎಂಬುದನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ಶಾಸ್ತ್ರೋಕ್ತಿಯ ಆಜ್ಞಾತ್ಮಕ ಹಾಗೂ ಕಾನೂನುಬದ್ಧ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅಡಿಕುರಿತಿನ ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
