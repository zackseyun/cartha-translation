  to: 'ಏಕೆಂದರೆ ದೇವರು ಹೇಳಿದನು: “ನಿನ್ನ ತಂದೆತಾಯಿಗಳನ್ನು ಗೌರವಿಸು,” ಮತ್ತು “ತಂದೆಯನ್ನಾಗಲಿ ತಾಯಿಯನ್ನಾಗಲಿ ದೂಷಿಸುವವನು[a] ಖಂಡಿತವಾಗಿ ಸಾಯಬೇಕು.”'
