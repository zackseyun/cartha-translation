id: MAT.15.8
reference: Matthew 15:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: kn
  text: ಈ ಜನರು ತಮ್ಮ ತುಟಿಗಳಿಂದ ನನ್ನನ್ನು ಗೌರವಿಸುತ್ತಾರೆ; ಆದರೆ ಅವರ ಹೃದಯವು[a] ನನ್ನಿಂದ ಬಹಳ ದೂರವಾಗಿದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಅವರ ಹೃದಯಗಳು.’ ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ‘ಹೃದಯ’ ಏಕವಚನದಲ್ಲಿದೆ; ಅದು ಬಹುಶಃ ಇಡೀ ಜನಸಮೂಹವನ್ನು ಒಟ್ಟಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: ಈ ಜನರು
  rationale: λαός ಸಮೂಹವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಗೌರವಸೂಚಕವಲ್ಲದ ಬಹುವಚನ ಕ್ರಿಯೆಯೊಂದಿಗೆ ‘ಈ ಜನರು’ ಸಹಜವಾಗಿದ್ದು οὗτος ಎಂಬ ಸೂಚಕದ ಬಲವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: τοῖς χείλεσίν
  choice: ತಮ್ಮ ತುಟಿಗಳಿಂದ
  rationale: ಕರಣಾರ್ಥಕ ದತ್ತಿವನ್ನು ‘-ದಿಂದ’ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸಿ, χείλη ಎಂಬ ದೇಹಾಂಗದ ಸ್ಪಷ್ಟ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಕರ್ತೃ ‘ಈ ಜನರು’ ಆಗಿರುವುದರಿಂದ ಕನ್ನಡದ ಸಹಜ ಆತ್ಮವಾಚಕ ಸ್ವಾಮ್ಯರೂಪ ‘ತಮ್ಮ’ ಬಳಸಲಾಗಿದೆ.
- source_word: με
  choice: ನನ್ನನ್ನು
  rationale: τιμᾷ ಕ್ರಿಯೆಯ ನೇರ ಕರ್ಮವನ್ನು ಸಹಜ ಕನ್ನಡದ ಕರ್ಮವಿಭಕ್ತಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: τιμᾷ
  choice: ಗೌರವಿಸುತ್ತಾರೆ
  rationale: τιμάω ಇಲ್ಲಿ ಗೌರವ ಸಲ್ಲಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮಹಿಮೆಪಡಿಸುತ್ತಾರೆ’ ಎಂಬ ಹೆಚ್ಚು ತೀವ್ರವಾದ ಅರ್ಥವನ್ನು ಸೇರಿಸದೆ ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ಆದರೆ ಅವರ ಹೃದಯವು
  rationale: δέಯ ವಿರೋಧಾರ್ಥವನ್ನು ‘ಆದರೆ’ ಮೂಲಕ ನೀಡಲಾಗಿದೆ. ಗ್ರೀಕ್ ಏಕವಚನ καρδίαಯ ಸಮೂಹಾತ್ಮಕ ಬಲವನ್ನು ‘ಅವರ ಹೃದಯವು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: πόρρω
  choice: ಬಹಳ ದೂರ
  rationale: πόρρω ಸೂಚಿಸುವ ಗಣನೀಯ ದೂರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಬಹಳ ದೂರ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἀπέχει ἀπ’ ἐμοῦ
  choice: ನನ್ನಿಂದ ಬಹಳ ದೂರವಾಗಿದೆ
  rationale: ἀπέχω + ἀπό ಸೂಚಿಸುವ ದೂರವಿರುವ ಸ್ಥಿತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ನನ್ನಿಂದ ... ದೂರವಾಗಿದೆ’ ಎಂದು ಸಹಜವಾಗಿ ನೀಡಿದ್ದು, ಸಂಬಂಧಾತ್ಮಕ ಅಂತರದ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಸಮೂಹಾತ್ಮಕ ಏಕವಚನ ‘ಹೃದಯ’ ಅಥವಾ ವ್ಯಕ್ತಿವಾಚಕ ಬಹುವಚನ
  choice: ‘ಅವರ ಹೃದಯವು’ ಎಂಬ ಏಕವಚನವನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ‘ಅವರ ಹೃದಯಗಳು’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ καρδία ಏಕವಚನದಲ್ಲಿದ್ದು, ಜನರನ್ನು ಒಟ್ಟಾರೆ ಒಂದೇ ಆಂತರಿಕ ಮನೋಭಾವವಿರುವ ಸಮೂಹವಾಗಿ ಚಿತ್ರಿಸಬಹುದು. ಅದನ್ನು ಉಳಿಸುವುದು ಪ್ರವಾದನಾ ಉಲ್ಲೇಖದ ವಾಗ್ವೈಖರಿಯನ್ನು ಕಾಪಾಡುತ್ತದೆ; ಬಹುವಚನವು ಸಾಧ್ಯವಾದ ಸಹಜ ಕನ್ನಡ ಪರ್ಯಾಯವಾಗಿರುವುದರಿಂದ ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಓದಿಗೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ತುಟಿಗಳು–ಹೃದಯ ಎಂಬ ಸ್ಪಷ್ಟ ವೈರುಧ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಸಮೂಹಾತ್ಮಕ ಏಕವಚನ ಅಸಹಜವಾಗದಂತೆ ‘ಅವರ ಹೃದಯವು’ ಬಳಸಲಾಗಿದೆ.
