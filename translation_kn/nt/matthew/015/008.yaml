  source_fidelity: 'The Kannada accurately represents the Greek: ‘ಈ ಜನರು’ conveys the demonstrative collective Ὁ λαὸς οὗτος; ‘ತಮ್ಮ ತುಟಿಗಳಿಂದ’ preserves the instrumental bodily image; ‘ನನ್ನನ್ನು ಗೌರವಿಸುತ್ತಾರೆ’ correctly renders με τιμᾷ; and ‘ಆದರೆ ಅವರ ಹೃದಯವು ನನ್ನಿಂದ ಬಹಳ ದೂರವಾಗಿದೆ’ preserves the adversative contrast, the singular collective καρδία, and relational distance of ἀπέχει ἀπ’ ἐμοῦ. The plural verb with the collective expression ‘ಈ ಜನರು’ is idiomatic Kannada and does not alter the sense.'
