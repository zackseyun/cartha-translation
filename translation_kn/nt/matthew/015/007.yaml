  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: kn
  text: 'ಕಪಟಿಗಳೇ, ನಿಮ್ಮ ಕುರಿತು ಯೆಶಾಯನು ಸರಿಯಾಗಿಯೇ ಪ್ರವಾದಿಸಿದನು; ಅವನು ಹೀಗೆ ಹೇಳಿದನು:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: ಕಪಟಿಗಳೇ
  rationale: ಬಹುವಚನ ಸಂಬೋಧನೆಯನ್ನು ನೇರವಾಗಿಯೂ ತೀಕ್ಷ್ಣವಾಗಿಯೂ ಉಳಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೈತಿಕ-ಧಾರ್ಮಿಕ ಕಪಟವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: καλῶς
  choice: ಸರಿಯಾಗಿಯೇ
  rationale: ಯೆಶಾಯನ ಪ್ರವಾದನೆಯು ಇವರಿಗೆ ನಿಖರವಾಗಿ ಮತ್ತು ಯುಕ್ತವಾಗಿ ಅನ್ವಯಿಸುತ್ತದೆ ಎಂಬ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐπροφήτευσεν
  choice: ಪ್ರವಾದಿಸಿದನು
  rationale: ಪ್ರವಾದಿಯ ಮಾತು ಎಂಬ ಶಾಸ್ತ್ರೀಯ ಅರ್ಥವಲಯವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುವ ರೂಢಿಯಾದ ಕನ್ನಡ ಪದ.
- source_word: περὶ ὑμῶν
  choice: ನಿಮ್ಮ ಕುರಿತು
  rationale: περί + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ‘ನಿಮ್ಮ ಬಗ್ಗೆ/ಕುರಿತು’ ಎಂಬ ಸಂಬಂಧಾರ್ಥವನ್ನು ಗೌರವಯುತ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: Ἠσαΐας
  choice: ಯೆಶಾಯನು
  rationale: ಪ್ರವಾದಿಯ ಹೆಸರಿಗೆ ಕನ್ನಡ ಸತ್ಯವೇದ ಪರಂಪರೆಯಲ್ಲಿ ವ್ಯಾಪಕವಾಗಿರುವ ರೂಪವನ್ನು ಬಳಸಿ, ಕರ್ತೃವಿಭಕ್ತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- source_word: λέγων
  choice: 'ಅವನು ಹೀಗೆ ಹೇಳಿದನು:'
  rationale: ಮುಂದಿನ ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುವ ವರ್ತಮಾನ ಕೃದಂತದ ಕಾರ್ಯವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ನೇರ ಸಂಬೋಧನೆಯ ತೀಕ್ಷ್ಣತೆ
  choice: ಕಪಟಿಗಳೇ
  alternative: ನಟಿಸುವವರೇ / ಕಪಟಿಗಳಾದ ನೀವು
  rationale: ὑποκριταί ಇಲ್ಲಿ ನೇರವಾದ ಖಂಡನಾತ್ಮಕ ಬಹುವಚನ ಸಂಬೋಧನೆ. ಅದನ್ನು ಮೃದುಗೊಳಿಸದೆ, ಅನಗತ್ಯ ವಿವರಣೆಯನ್ನೂ ಸೇರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- issue: καλῶς ಎಂಬ ಪದದ ಅರ್ಥಛಾಯೆ
  choice: ಸರಿಯಾಗಿಯೇ ಪ್ರವಾದಿಸಿದನು
  alternative: ಚೆನ್ನಾಗಿಯೇ ಪ್ರವಾದಿಸಿದನು
  rationale: ಇಲ್ಲಿ ಮಾತಿನ ಸಾಹಿತ್ಯಿಕ ಗುಣಕ್ಕಿಂತ ಯೆಶಾಯನ ಪ್ರವಾದನೆ ಶ್ರೋತೃಗಳಿಗೆ ಸರಿಯಾಗಿ ಅನ್ವಯಿಸುತ್ತದೆ ಎಂಬ ಅರ್ಥ ಮುಖ್ಯ. ಆದರೂ ‘ಚೆನ್ನಾಗಿಯೇ’ ಎಂಬ ಹೆಚ್ಚು ರೂಪಸನ್ನಿಹಿತ ಪರ್ಯಾಯದ ಸಾಧ್ಯತೆಯನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ನಿರಾಕರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ನೇರ, ಘನತೆಯುಳ್ಳ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ ಶೈಲಿ. ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ ಖಂಡನೆ ಮತ್ತು ಮುಂದಿನ ಉಲ್ಲೇಖದ ಪರಿಚಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಒದಗಿಸಲಾದ ಇಂಗ್ಲಿಷ್ ಟಿಪ್ಪಣಿಯಲ್ಲಿ marker [a]ಗೆ ನೀಡಿರುವ ಪಠ್ಯವು ಗುರುತಿಸಿದ ಪದದೊಂದಿಗೆ ಹೊಂದಿಕೆಯಾಗದಂತೆ ಕಾಣುವುದರಿಂದ, ಮೂಲ ಗ್ರೀಕ್ ಪಾಠಕ್ಕೆ ಅಗತ್ಯವಿಲ್ಲದ ಟಿಪ್ಪಣಿಯನ್ನು ಕನ್ನಡ ಕರಡಿನಲ್ಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
