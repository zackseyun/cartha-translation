review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal terms: the disciples, the tradition of the elders, washing their hands, and eating bread. However, the final Kannada tag-question form “ತೊಳೆಯುವುದಿಲ್ಲವಲ್ಲ?” turns the Greek causal assertion introduced by γάρ (‘for/because’) into a second question. The source has one question followed by a supporting statement.'
  naturalness: The wording is modern and generally natural. Recasting the second sentence as a declarative introduced by “ಏಕೆಂದರೆ” makes the causal relationship explicit and avoids the somewhat colloquial rhetorical-question effect of “ಇಲ್ಲವಲ್ಲ?”.
  terminology: “ಹಿರಿಯರ ಸಂಪ್ರದಾಯ” appropriately retains the established sense of the elders’ received tradition, and “ಉಲ್ಲಂಘಿಸುತ್ತಾರೆ” suitably renders παραβαίνουσιν. “ರೊಟ್ಟಿ” preserves the literal sense of ἄρτον; the lexical alternative is appropriately footnoted.
  issues:
  - severity: medium
    issue: The sentence-final “ತೊಳೆಯುವುದಿಲ್ಲವಲ್ಲ?” makes the γάρ clause interrogative.
    rationale: οὐ γὰρ νίπτονται... is a declarative clause giving the reason for the accusation, not an additional question. A declarative causal sentence better reflects the Greek syntax and discourse relation.
  - severity: low
    issue: Footnote a states that the tradition ‘required’ the practice.
    rationale: This is consistent with the immediate dispute context and the supplied English audit note, but wording it as a practice associated with the tradition is slightly less categorical and better avoids adding details beyond this verse.
