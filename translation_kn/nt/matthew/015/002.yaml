  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: kn
  text: “ನಿಮ್ಮ ಶಿಷ್ಯರು ಹಿರಿಯರ ಸಂಪ್ರದಾಯವನ್ನು ಏಕೆ ಉಲ್ಲಂಘಿಸುತ್ತಾರೆ? ಏಕೆಂದರೆ, ಅವರು ರೊಟ್ಟಿ ತಿನ್ನುವಾಗ ತಮ್ಮ ಕೈಗಳನ್ನು ತೊಳೆಯುವುದಿಲ್ಲ.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಇದು ಕೇವಲ ಸಾಮಾನ್ಯ ಸ್ವಚ್ಛತೆಯ ವಿಷಯವಲ್ಲ; ಹಿರಿಯರ ಸಂಪ್ರದಾಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಕೈತೊಳೆಯುವ ಪದ್ಧತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: cultural_note
  - marker: b
    text: ಅಥವಾ, ‘ಊಟ ಮಾಡುವಾಗ’; ‘ರೊಟ್ಟಿ’ ಎಂಬ ಗ್ರೀಕ್ ಪದವು ಕೆಲವೊಮ್ಮೆ ಆಹಾರ ಅಥವಾ ಊಟವನ್ನು ವಿಶಾಲವಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: ಏಕೆ
  rationale: ಕಾರಣವನ್ನು ಪ್ರಶ್ನಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿಗೆ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: οἱ μαθηταί σου
  choice: ನಿಮ್ಮ ಶಿಷ್ಯರು
  rationale: ದ್ವಿತೀಯ ಪುರುಷ ಏಕವಚನ ಸ್ವಾಮ್ಯಸೂಚಕದ ಗೌರವಯುತ ಕನ್ನಡ ನಿರೂಪಣೆ.
- source_word: παραβαίνουσιν
  choice: ಉಲ್ಲಂಘಿಸುತ್ತಾರೆ
  rationale: ಅಧಿಕಾರಯುತ ಸಂಪ್ರದಾಯದ ಮೇರೆಯನ್ನು ಮೀರುವುದು ಅಥವಾ ಅದನ್ನು ಉಲ್ಲಂಘಿಸುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: ಹಿರಿಯರ ಸಂಪ್ರದಾಯವನ್ನು
  rationale: παράδοσις ಎಂಬ ಹಸ್ತಾಂತರಿತ ಸಂಪ್ರದಾಯದ ಅರ್ಥವನ್ನೂ, πρεσβύτεροι ಎಂಬ ಮಾನ್ಯ ಪೂರ್ವಿಕ ಅಧಿಕಾರಿಗಳ ಉಲ್ಲೇಖವನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὐ γὰρ
  choice: ಇಲ್ಲವಲ್ಲ
  rationale: ಹಿಂದಿನ ಆರೋಪಕ್ಕೆ ಆಧಾರ ನೀಡುವ γάρ ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಕಾರಣಸೂಚಕ-ಒತ್ತಿಹೇಳುವ ವಾಕ್ಯಾಂತ್ಯದ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: ತಮ್ಮ ಕೈಗಳನ್ನು ತೊಳೆಯುವುದಿಲ್ಲ
  rationale: ದೇಹದ ಒಂದು ಭಾಗವನ್ನು ತೊಳೆಯುವ νίπτω ಎಂಬ ಕ್ರಿಯೆಯ ನೇರ ಅರ್ಥವನ್ನು ಸಹಜ ಆತ್ಮವಾಚಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ὅταν
  choice: ತಿನ್ನುವಾಗ
  rationale: ಪುನರಾವರ್ತಿತ ಅಥವಾ ಸಾಮಾನ್ಯ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುವ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἄρτον
  choice: ರೊಟ್ಟಿ
  rationale: ಗ್ರೀಕ್ ಪದದ ಮೂಲ ಅರ್ಥವಾದ bread ಅನ್ನು ಉಳಿಸುತ್ತದೆ; ವಿಶಾಲವಾದ ‘ಊಟ’ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἐσθίωσιν
  choice: ತಿನ್ನುವಾಗ
  rationale: ὅταν ಜೊತೆಯಲ್ಲಿರುವ ವರ್ತಮಾನ ಸಬ್ಜಂಕ್ಟಿವ್‌ನ ಸಾಮಾನ್ಯ/ಅಭ್ಯಾಸಾತ್ಮಕ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಕಾಲರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಕೈತೊಳೆಯುವ ಉಲ್ಲೇಖದ ಸ್ವರೂಪ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇದನ್ನು ಹಿರಿಯರ ಸಂಪ್ರದಾಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಕೈತೊಳೆಯುವ ಪದ್ಧತಿಯಾಗಿ ಮಾತ್ರ ನಿರೂಪಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ನೇರವಾಗಿ ‘ಆಚಾರದ ಶುದ್ಧೀಕರಣ’ ಅಥವಾ ಸಾಮಾನ್ಯ ಸ್ವಚ್ಛತೆಯ ಕ್ರಮ ಎಂದು ವಿವರಿಸುವುದು.
  rationale: ವಚನವು ವಿವಾದವನ್ನು ‘ಹಿರಿಯರ ಸಂಪ್ರದಾಯ’ದ ನಿಷ್ಠೆಯ ವಿಷಯವಾಗಿ ರೂಪಿಸುತ್ತದೆ; ಅದರ ಆಚರಣಾತ್ಮಕ ಅಥವಾ ಆರೋಗ್ಯಸಂಬಂಧಿ ಸ್ವರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇನ್ನಷ್ಟು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದು ಮೂಲಕ್ಕಿಂತ ಮೀರಿಹೋಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ನೇರ ಪ್ರಶ್ನಾರೂಪ ಬಳಸಲಾಗಿದೆ. ‘ಹಿರಿಯರು’ ಎಂಬುದು ಕೇವಲ ವಯಸ್ಸಾದವರಿಗಿಂತ ಮಾನ್ಯ ಪೂರ್ವಿಕ ಅಧಿಕಾರಿಗಳನ್ನು ಸೂಚಿಸುವ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಹೊರುತ್ತದೆ. ‘ರೊಟ್ಟಿ’ ಮೂಲದ ನಿಖರ ಪದವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಊಟ’ ಎಂಬ ಸಂದರ್ಭಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
