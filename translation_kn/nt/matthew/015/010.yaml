  terminology: Key terms are handled accurately and without doctrinal expansion. ‘ಜನಸಮೂಹ’ is suitable for ὄχλος, and the imperative plural forms are appropriate. The alternative footnote is a legitimate lexical alternative and its marker is correctly anchored.
