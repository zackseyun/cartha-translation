id: MAT.15.10
reference: Matthew 15:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον εἶπεν αὐτοῖς· Ἀκούετε καὶ συνίετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/010.yaml
  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: kn
  text: ಆತನು ಜನಸಮೂಹವನ್ನು ತನ್ನ ಬಳಿಗೆ ಕರೆದು ಅವರಿಗೆ, “ಕೇಳಿರಿ ಮತ್ತು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಿರಿ[a],” ಎಂದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಆಲಿಸಿರಿ ಮತ್ತು ಗ್ರಹಿಸಿರಿ.”
    reason: Ἀκούετε ಮತ್ತು συνίετε ಪದಗಳಿಗೆ ಸಾಧ್ಯವಾದ ಸಮೀಪಾರ್ಥಕ ಅನುವಾದವನ್ನು ನೀಡುತ್ತದೆ.
lexical_decisions:
- source_word: Καὶ
  choice: ವಾಕ್ಯವನ್ನು ಸಹಜ ಕನ್ನಡ ನಿರೂಪಣೆಯಾಗಿ ಆರಂಭಿಸುವುದು
  rationale: ಈ ಸಂಪರ್ಕಪದವು ಹಿಂದಿನ ಘಟನೆಯ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಎಂದು ಹಾಕಿದರೆ ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗುವುದರಿಂದ, ಅದರ ನಿರೂಪಣಾತ್ಮಕ ಕಾರ್ಯವನ್ನು ವಾಕ್ಯಕ್ರಮವೇ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: προσκαλεσάμενος
  choice: ತನ್ನ ಬಳಿಗೆ ಕರೆದು
  rationale: ಅಓರಿಸ್ಟ್ ಮಧ್ಯಮ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ, ಅದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತನ್ನ ಬಳಿಗೆ’ ಎಂಬುದು προσκαλέομαι ಪದದ ದಿಕ್ಕನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸν ὄχλον
  choice: ಜನಸಮೂಹವನ್ನು
  rationale: ὄχλος ಇಲ್ಲಿ ಒಟ್ಟುಗೂಡಿದ್ದ ಜನರ ಗುಂಪನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಜನಸಮೂಹ’ ಆಧುನಿಕ, ಸ್ಪಷ್ಟ ಮತ್ತು ಗೌರವಯುತ ಕನ್ನಡ ಪದವಾಗಿದೆ.
- source_word: εἶπεν αὐτοῖς
  choice: ಅವರಿಗೆ … ಎಂದನು
  rationale: ಗ್ರೀಕ್‌ನ ಹೇಳುವ ಕ್ರಿಯೆ ಮತ್ತು ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ಕನ್ನಡದ ನೇರ ಉಕ್ತಿಯ ಸಹಜ ವಿನ್ಯಾಸದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ἀκούετε
  choice: ಕೇಳಿರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ಇಲ್ಲಿ ಕೇವಲ ಧ್ವನಿ ಕೇಳುವುದಕ್ಕಿಂತ ಗಮನವಿಟ್ಟು ಆಲಿಸುವ ಕರೆಯೂ ಅಡಕವಾಗಿದೆ.
- source_word: συνίετε
  choice: ಅರ್ಥಮಾಡಿಕೊಳ್ಳಿರಿ
  rationale: ಕೇಳಿದ ವಿಷಯದ ಅರ್ಥವನ್ನು ಗ್ರಹಿಸುವಂತೆ ನೀಡಿದ ಆಜ್ಞೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ ಮತ್ತು Ἀκούετε ಎಂಬುದರಿಂದ ಇರುವ ಅರ್ಥಭೇದವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ನಿರೂಪಣೆ. ‘ಕರೆದು … ಎಂದನು’ ಎಂಬ ವಿನ್ಯಾಸವು ಗ್ರೀಕ್ ಕೃದಂತ ಮತ್ತು ಮುಖ್ಯ ಕ್ರಿಯೆಯ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಆಜ್ಞಾರ್ಥಗಳಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ.
