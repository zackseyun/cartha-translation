base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: kn
  text: ಆದರೆ ಅವರು ಮನುಷ್ಯರ[b] ಆಜ್ಞೆಗಳನ್ನು ಉಪದೇಶಗಳೆಂದು[a] ಬೋಧಿಸುತ್ತಾ, ವ್ಯರ್ಥವಾಗಿ ನನ್ನನ್ನು ಆರಾಧಿಸುತ್ತಾರೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ: “ಮಾನವ ಆಜ್ಞೆಗಳನ್ನು ಉಪದೇಶಗಳಾಗಿ ಬೋಧಿಸುತ್ತಾ.”'
    reason: alternative_reading
  - marker: b
    text: 'ಅಥವಾ: “ಜನರ.” ಗ್ರೀಕ್ ಪದವು ಪುರುಷರನ್ನು ಮಾತ್ರವಲ್ಲ, ಮನುಷ್ಯರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸಿ, ಮಾನವ ಮೂಲವನ್ನು ದೈವಿಕ ಮೂಲಕ್ಕೆ ವಿರುದ್ಧವಾಗಿ ತೋರಿಸುತ್ತದೆ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάτην
  choice: ವ್ಯರ್ಥವಾಗಿ
  rationale: ‘ಯಾವ ಪ್ರಯೋಜನವೂ ಇಲ್ಲದಂತೆ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ತಿಳಿಸಿ, ಉಲ್ಲೇಖದಲ್ಲಿರುವ ಖಂಡನೆಯ ಧಾಟಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿನ ಸೌಮ್ಯ ವಿರೋಧ ಮತ್ತು ಗದರಿಕೆಯ ತಿರುವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: σέβονταί
  choice: ಆರಾಧಿಸುತ್ತಾರೆ
  rationale: ದೇವರ ಕಡೆಗೆ ತೋರಿಸುವ ಭಕ್ತಿಪೂರ್ವಕ ಗೌರವ ಅಥವಾ ಆರಾಧನೆಯನ್ನು ಇಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: με
  choice: ನನ್ನನ್ನು
  rationale: ಯೆಶಾಯನ ಉಲ್ಲೇಖದಲ್ಲಿ ದೇವರನ್ನು ಸೂಚಿಸುವ ನೇರ ಕರ್ಮ ಸರ್ವನಾಮವನ್ನು ಯಥಾರೂಪವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: διδάσκοντες
  choice: ಬೋಧಿಸುತ್ತಾ
  rationale: ಅವರ ಆರಾಧನೆ ಏಕೆ ವ್ಯರ್ಥವೆಂಬುದನ್ನು ವಿವರಿಸುವ ಸಹವರ್ತಿ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಕಾಲಸಂಬಂಧವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: διδασκαλίας
  choice: ಉಪದೇಶಗಳೆಂದು
  rationale: ಮನುಷ್ಯರ ಆಜ್ಞೆಗಳಿಗೆ ಉಪದೇಶದ ಅಥವಾ ಅಧಿಕೃತ ಬೋಧನೆಯ ಸ್ಥಾನ ನೀಡಲಾಗುತ್ತಿದೆ ಎಂಬ ಸಂಕ್ಷಿಪ್ತ ಗ್ರೀಕ್ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἐντάλματα
  choice: ಆಜ್ಞೆಗಳನ್ನು
  rationale: ಧಾರ್ಮಿಕವಾಗಿ ವಿಧಿಸಲಾದ ಆದೇಶಗಳು ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜ ಹಾಗೂ ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἀνθρώπων
  choice: ಮನುಷ್ಯರ
  rationale: ಇದು ಪುರುಷರಿಗೆ ಮಾತ್ರ ಸೀಮಿತವಲ್ಲದ ಸಾಮಾನ್ಯ ಮಾನವಪದ; ದೈವಿಕ ಮೂಲಕ್ಕೆ ವಿರುದ್ಧವಾದ ಮಾನವ ಮೂಲದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: διδασκαλίας ἐντάλματα ἀνθρώπων ಎಂಬ ಸಂಕ್ಷಿಪ್ತ ಪದಸಂಬಂಧ
  choice: ಮನುಷ್ಯರ ಆಜ್ಞೆಗಳನ್ನು ಉಪದೇಶಗಳೆಂದು ಬೋಧಿಸುತ್ತಾ
  alternative: ಮಾನವ ಆಜ್ಞೆಗಳನ್ನು ಉಪದೇಶಗಳಾಗಿ ಬೋಧಿಸುತ್ತಾ
  rationale: ಮಾನವ ಆಜ್ಞೆಗಳಿಗೆ ಅಧಿಕೃತ ಉಪದೇಶದ ಸ್ಥಾನ ನೀಡುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಆದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ಹೆಚ್ಚುವರಿ ತಾತ್ತ್ವಿಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: ἀνθρώπων ಪದದ ಸಾಮಾನ್ಯ ಮಾನವ ಅರ್ಥ
  choice: ಮನುಷ್ಯರ
  alternative: ಜನರ / ಮಾನವ
  rationale: ಪದವು ಪುರುಷರನ್ನು ಮಾತ್ರ ಸೂಚಿಸುವುದಿಲ್ಲ. ‘ಮನುಷ್ಯರ’ ಎಂಬುದು ಮಾನವ ಮೂಲ ಮತ್ತು ದೈವಿಕ ಮೂಲದ ನಡುವಿನ ವ್ಯತ್ಯಾಸವನ್ನು ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಶಾಸ್ತ್ರೋಕ್ತ ಧಾಟಿ. ‘ಆರಾಧಿಸುತ್ತಾರೆ,’ ‘ಆಜ್ಞೆಗಳು,’ ಮತ್ತು ‘ಉಪದೇಶಗಳು’ ಎಂಬ ಪದಗಳು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆಯೇ ಧಾರ್ಮಿಕ ಸಂದರ್ಭದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತವೆ.
