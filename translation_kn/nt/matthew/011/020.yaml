id: MAT.11.20
reference: Matthew 11:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: kn
  text: ಆಗ ಯೇಸು ತನ್ನ ಶಕ್ತಿಯುತ ಕಾರ್ಯಗಳಲ್ಲಿ ಹೆಚ್ಚಿನವು ನಡೆದಿದ್ದ ಪಟ್ಟಣಗಳನ್ನು, ಅಲ್ಲಿನ ಜನರು ಪಶ್ಚಾತ್ತಾಪಪಡಲಿಲ್ಲವಾದ್ದರಿಂದ, ಖಂಡಿಸಲು ಆರಂಭಿಸಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“ಶಕ್ತಿಯುತ ಕಾರ್ಯಗಳು” ಎಂಬುದಕ್ಕೆ “ಅದ್ಭುತಗಳು” ಅಥವಾ “ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು (ಗ್ರೀಕ್: ದುನಾಮೇಯ್ಸ್).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಪರಿಚಯಿಸುವ ಕಾಲಸೂಚಕವಾಗಿ ಸಹಜವೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆಗಿದೆ.
- source_word: ἤρξατο ὀνειδίζειν
  choice: ಖಂಡಿಸಲು ಪ್ರಾರಂಭಿಸಿದನು
  rationale: ἤρξατο ಎಂಬ ಆರಂಭಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ὀνειδίζειν ಇಲ್ಲಿನ ತೀಕ್ಷ್ಣ ಗದರಿಕೆ ಮತ್ತು ದೋಷಾರೋಪಣೆಯ ಅರ್ಥವನ್ನು ‘ಖಂಡಿಸಲು’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὰς πόλεις ἐν αἷς
  choice: ಯಾವ ಪಟ್ಟಣಗಳಲ್ಲಿ ... ಆ ಪಟ್ಟಣಗಳ ಜನರು
  rationale: ಗಲಿಲಾಯದ ಸ್ಥಳಗಳಿಗೆ ‘ಪಟ್ಟಣಗಳು’ ಸಹಜವಾಗಿದೆ. ಪಟ್ಟಣಗಳನ್ನು ಉದ್ದೇಶಿಸಿ ಖಂಡಿಸುವುದು ಅವುಗಳ ನಿವಾಸಿಗಳನ್ನು ಸೂಚಿಸುವ ಲಕ್ಷಣಾರ್ಥಕ ಬಳಕೆ; ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥ ಸ್ಪಷ್ಟವಾಗಲು ‘ಜನರು’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: ತನ್ನ ಮಹತ್ತರವಾದ ಕಾರ್ಯಗಳಲ್ಲಿ ಹೆಚ್ಚಿನವು ... ನಡೆದಿದ್ದವೋ
  rationale: ಹಿಂದೆ ಸಂಭವಿಸಿದ್ದ ಕಾರ್ಯಗಳನ್ನು ಸೂಚಿಸಲು ‘ನಡೆದಿದ್ದವೋ’ ಬಳಸಲಾಗಿದೆ; πλεῖσται ಅನ್ನು ‘ಹೆಚ್ಚಿನವು’ ಎಂದು ಮತ್ತು δυνάμεις ಅನ್ನು ಶಕ್ತಿಯ ಆಯಾಮ ಉಳಿಯುವಂತೆ ‘ಮಹತ್ತರವಾದ ಕಾರ್ಯಗಳು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὅτι οὐ μετενόησαν
  choice: ಪಶ್ಚಾತ್ತಾಪಪಡದ ಕಾರಣ
  rationale: ὅτι ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ; μετανοέω ಇಲ್ಲಿನ ನೈತಿಕ-ಆಧ್ಯಾತ್ಮಿಕ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ‘ಪಶ್ಚಾತ್ತಾಪಪಡು’ ನಿಖರವಾಗಿ ಮತ್ತು ಪರಿಚಿತವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: αὐτοῦ
  choice: ತನ್ನ
  rationale: ಕರ್ತೃ ಯೇಸುವೇ ಎಂಬುದನ್ನು ಕನ್ನಡದ ಸ್ವವಾಚಕ ಸರ್ವನಾಮ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಅಸ್ಪಷ್ಟತೆ ತಪ್ಪಿಸಲು ವಾಕ್ಯದಲ್ಲಿ ‘ಯೇಸು’ ಸ್ಪಷ್ಟವಾಗಿ ಕೊಡಲಾಗಿದೆ.
theological_decisions:
- issue: δυνάμεις ಎಂಬ ಪದವನ್ನು ಅದ್ಭುತಕಾರ್ಯಗಳ ಸಂದರ್ಭದಲ್ಲಿ ಅನುವಾದಿಸುವುದು
  choice: ಮಹತ್ತರವಾದ ಕಾರ್ಯಗಳು
  alternative: ಅದ್ಭುತಗಳು; ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು
  rationale: ಈ ಪದವು ಯೇಸುವಿನ ಅಸಾಮಾನ್ಯ ಶಕ್ತಿಯುತ ಕೃತ್ಯಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮಹತ್ತರವಾದ ಕಾರ್ಯಗಳು’ ಶಕ್ತಿಯ ಅರ್ಥಛಾಯೆಯನ್ನು ಉಳಿಸಿ, ಮೂಲಪದಕ್ಕಿಂತ ಕಿರಿದಾದ ವರ್ಗಕ್ಕೆ ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ; ಪರ್ಯಾಯಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: μετενόησαν ಎಂಬುದರ ನೈತಿಕ-ಆಧ್ಯಾತ್ಮಿಕ ಅರ್ಥ
  choice: ಪಶ್ಚಾತ್ತಾಪಪಡಲಿಲ್ಲ
  alternative: ಮನಸ್ಸು ಬದಲಾಯಿಸಲಿಲ್ಲ; ಹಿಂದಿರುಗಲಿಲ್ಲ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸುವಿನ ಕಾರ್ಯಗಳಿಗೆ ತಕ್ಕ ಪ್ರತಿಕ್ರಿಯೆ ನೀಡದಿರುವುದನ್ನು ಸೂಚಿಸುವ ಸ್ಥಾಪಿತ ಮತ್ತು ಅರ್ಥಭರಿತ ಪದ ‘ಪಶ್ಚಾತ್ತಾಪಪಡು’; ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಪಟ್ಟಣಗಳು’ ಎಂಬ ಲಕ್ಷಣಾರ್ಥಕ ಗ್ರೀಕ್ ಬಳಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಗೊಳಿಸಲು ‘ಪಟ್ಟಣಗಳ ಜನರು’ ಎಂದು ಹೇಳಲಾಗಿದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
