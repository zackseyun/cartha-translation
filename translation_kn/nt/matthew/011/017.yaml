  to: 'ಅವರು ಹೇಳುತ್ತಾರೆ: “ನಾವು ನಿಮಗಾಗಿ ಕೊಳಲು ಊದಿದೆವು, ಆದರೆ ನೀವು ಕುಣಿಯಲಿಲ್ಲ; ನಾವು ಶೋಕಗೀತೆ ಹಾಡಿದೆವು, ಆದರೆ ನೀವು ಶೋಕಿಸಲಿಲ್ಲ[a].”'
