id: MAT.11.17
reference: Matthew 11:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: kn
  text: 'ಅವರು ಹೇಳುತ್ತಾರೆ: “ನಾವು ನಿಮಗಾಗಿ ಕೊಳಲು ಊದಿದೆವು, ಆದರೆ ನೀವು ಕುಣಿಯಲಿಲ್ಲ; ನಾವು ಶೋಕಗೀತೆ ಹಾಡಿದೆವು, ಆದರೆ ನೀವು ಶೋಕಿಸಲಿಲ್ಲ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಕ್ಷರಶಃ, “ನೀವು ನಿಮ್ಮನ್ನು ತಾವೇ ಬಡಿದುಕೊಳ್ಳಲಿಲ್ಲ.” ಇದು ಶೋಕದ ಸಂದರ್ಭದಲ್ಲಿ ಎದೆ ಬಡಿದುಕೊಳ್ಳುವಂತಹ ರೂಢಿಯ ದುಃಖಸೂಚಕ ಅಂಗಚೇಷ್ಟೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: ಅವರು ಹೇಳುತ್ತಾರೆ
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನಕಾಲವು ದೃಷ್ಟಾಂತದ ದೃಶ್ಯದಲ್ಲಿನ ಮಕ್ಕಳ ದೂರನ್ನು ಜೀವಂತವಾಗಿ ಪರಿಚಯಿಸುತ್ತದೆ; ಕನ್ನಡದ ಸರಳ ವರ್ತಮಾನಕಾಲ ಅದನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ηὐλήσαμεν
  choice: ನಾವು ನಿಮಗಾಗಿ ಕೊಳಲು ಊದಿದೆವು
  rationale: αὐλέω ನಿರ್ದಿಷ್ಟವಾಗಿ ಕೊಳಲು ಅಥವಾ ಪೈಪ್ ವಾದ್ಯವನ್ನು ನುಡಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕೊಳಲು ಊದಿದೆವು’ ಆ ವಾದ್ಯದ ಅರ್ಥವನ್ನೂ ಪ್ರದರ್ಶನವು ಅವರಿಗೆ ಉದ್ದೇಶಿತವಾಗಿತ್ತೆಂಬುದನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὠρχήσασθε
  choice: ನೀವು ಕುಣಿಯಲಿಲ್ಲ
  rationale: ಈ ಮಧ್ಯಮ ರೂಪಕ್ಕೆ ಇಲ್ಲಿ ವಿಶೇಷ ಆತ್ಮನಿರ್ದೇಶಕ ಅರ್ಥವನ್ನು ಸೇರಿಸುವ ಅಗತ್ಯವಿಲ್ಲ; ಸಾಮಾನ್ಯವಾಗಿ ನೃತ್ಯ ಮಾಡುವುದನ್ನೇ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐθρηνήσαμεν
  choice: ನಾವು ಶೋಕಗೀತೆ ಹಾಡಿದೆವು
  rationale: θρηνέω ವಿಶೇಷವಾಗಿ ಮರಣಶೋಕದ ವಿಲಾಪವನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಶೋಕಗೀತೆ ಹಾಡಿದೆವು’ ಎಂಬುದು ಮೊದಲ ಭಾಗದ ಸಂಗೀತಾತ್ಮಕ ಸಮಾಂತರತೆಯನ್ನು ಮತ್ತು ಮಕ್ಕಳ ಆಟದ ದೃಶ್ಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκόψασθε
  choice: ನೀವು ಎದೆ ಬಡಿದುಕೊಂಡು ಶೋಕಿಸಲಿಲ್ಲ
  rationale: κόπτω ಎಂಬ ಮಧ್ಯಮ ರೂಪವು ಇಲ್ಲಿ ಶೋಕದ ಅಂಗವಾಗಿ ತನ್ನನ್ನು, ವಿಶೇಷವಾಗಿ ಎದೆಯನ್ನು, ಬಡಿದುಕೊಳ್ಳುವ ಆಚರಣೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಕ್ರಿಯೆಯ ಸಾಂಸ್ಕೃತಿಕ ಚಿತ್ರವನ್ನೂ ಅದರ ಅರ್ಥವನ್ನೂ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
