translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಮಾತಿನ ದೃಶ್ಯಕ್ಕೆ ಹೊಂದುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಕೊಳಲು ಊದಿದೆವು’ ಮತ್ತು ‘ಶೋಕಗೀತೆ ಹಾಡಿದೆವು’ ಎಂಬ ಸಮಾಂತರ ಪದಪ್ರಯೋಗಗಳು ಹರ್ಷದ ಸಂದರ್ಭಕ್ಕೂ ಶೋಕದ ಸಂದರ್ಭಕ್ಕೂ ಸ್ಪಂದಿಸದಿರುವ ವಿರೋಧಾಭಾಸವನ್ನು ಉಳಿಸುತ್ತವೆ.
