id: MAT.11.8
reference: Matthew 11:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: kn
  text: ಆದರೆ ನೀವು ಏನನ್ನು ನೋಡಲು ಹೊರಗೆ ಹೋದಿರಿ? ಮೃದುವಾದ ಬಟ್ಟೆಗಳನ್ನು ಧರಿಸಿದ್ದ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನೋ? ನೋಡಿ, ಮೃದುವಾದ ಬಟ್ಟೆಗಳನ್ನು ಧರಿಸುವವರು ಅರಸರ ಮನೆಗಳಲ್ಲಿ ಇರುತ್ತಾರೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅರಮನೆಗಳಲ್ಲಿ ಇರುತ್ತಾರೆ.” ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ, “ಅರಸರ ಮನೆಗಳಲ್ಲಿ ಇರುತ್ತಾರೆ” ಎಂದಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದ ಪ್ರಶ್ನೆಗೆ ವಿರುದ್ಧವಾದ ಮುಂದಿನ ಸಾಧ್ಯತೆಯನ್ನು ಪರಿಚಯಿಸುವ ವೈರುಧ್ಯಸೂಚಕ ಸಂಯೋಜಕವಾಗಿ ಸಹಜವಾಗಿದೆ.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ನೀವು ಏನನ್ನು ನೋಡಲು ಹೊರಗೆ ಹೋದಿರಿ
  rationale: τί ಎಂಬುದನ್ನು ‘ಏನನ್ನು’ ಎಂದು ನೇರವಾಗಿ ಉಳಿಸಿ, ἐξήλθατε ἰδεῖν ಎಂಬ ಉದ್ದೇಶಸೂಚಕ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ನೋಡಲು ಹೊರಗೆ ಹೋದಿರಿ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἄνθρωπον
  choice: ಒಬ್ಬ ಮನುಷ್ಯನನ್ನೋ
  rationale: ಏಕವಚನ ಪುರುಷನನ್ನು ಸೂಚಿಸುವ ಮೂಲಪದಕ್ಕೆ ಹೊಂದಿ, ಯೋಹಾನನ ತಕ್ಷಣದ ಸಂದರ್ಭವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಪ್ರಶ್ನಾರ್ಥಕ ಪರ್ಯಾಯವನ್ನು ಕನ್ನಡದ ‘-ಓ’ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: ಮೃದುವಾದ ಬಟ್ಟೆಗಳನ್ನು ಧರಿಸಿದ್ದ
  rationale: μαλακοῖς ಎಂಬುದರ ಅಕ್ಷರಾರ್ಥವಾದ ‘ಮೃದುವಾದ’ ಮತ್ತು ἠμφιεσμένον ಎಂಬುದರ ಉಡುಪು ಧರಿಸಿರುವ ಸ್ಥಿತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಐಷಾರಾಮಿ ಉಡುಪಿನ ಸೂಚಿತ ಅರ್ಥವನ್ನು ಪಠ್ಯದಲ್ಲೇ ಅತಿಯಾಗಿ ವಿವರಿಸಿಲ್ಲ.
- source_word: ἰδοὺ
  choice: ನೋಡಿ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಮೂಲ ಅವ್ಯಯದ ವಾಕ್ಚಾತುರ್ಯದ ಬಲವನ್ನು ಆಧುನಿಕ, ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: ಮೃದುವಾದ ಬಟ್ಟೆಗಳನ್ನು ಧರಿಸುವವರು
  rationale: φοροῦντες ಸೂಚಿಸುವ ರೂಢಿಯಾದ ಧರಿಸುವಿಕೆಯನ್ನು ‘ಧರಿಸುವವರು’ ಎಂದು ನೀಡಿದ್ದು, μαλακὰ ಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ಹಿಂದಿನ ವಾಕ್ಯಾಂಶದೊಂದಿಗೆ ಉಳಿಸಿದೆ.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: ಅರಸರ ಮನೆಗಳಲ್ಲಿ ಇರುತ್ತಾರೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನ ‘ಅರಸರು’ ಮತ್ತು ‘ಮನೆಗಳು’ ಎರಡನ್ನೂ ಉಳಿಸುವ ಸಮೀಪದ, ಅರ್ಥಗರ್ಭಿತ ಕನ್ನಡ ರೂಪ; ‘ಅರಮನೆಗಳಲ್ಲಿ’ ಎಂಬ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಸರಣಿ ವಾಗ್ವೈಖರಿಯ ಪ್ರಶ್ನೆಗಳು, ‘ಮೃದುವಾದ’ ಎಂಬ ಪದದ ಪುನರಾವರ್ತನೆ ಮತ್ತು ‘ಅರಸರ ಮನೆಗಳು’ ಎಂಬ ಬಹುವಚನ ರೂಪ ಉಳಿಸಲಾಗಿದೆ.
