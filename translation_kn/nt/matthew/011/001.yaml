  terminology: “ಶಿಷ್ಯರು,” “ಬೋಧಿಸುವುದು,” and “ಸಾರುವುದು” are appropriate Gospel-register terms. The footnoted “ಆಜ್ಞಾಪಿಸಿ” is a legitimate stronger lexical alternative for διατάσσων. “ಪಟ್ಟಣಗಳಲ್ಲಿ” suitably reflects πόλεσιν without over-specifying city size.
