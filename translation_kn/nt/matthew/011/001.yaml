id: MAT.11.1
reference: Matthew 11:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: kn
  text: ಯೇಸು ತನ್ನ ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ ಸೂಚನೆಗಳನ್ನು ಕೊಟ್ಟು ಮುಗಿಸಿದಾಗ[a], ಅವರ ಪಟ್ಟಣಗಳಲ್ಲಿ[b] ಬೋಧಿಸುವುದಕ್ಕೂ ಸಾರುವುದಕ್ಕೂ ಅಲ್ಲಿಂದ ಹೊರಟುಹೋದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ತನ್ನ ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ ಆಜ್ಞಾಪಿಸಿ ಮುಗಿಸಿದಾಗ.”
    reason: lexical_alternative
  - marker: b
    text: “ಅವರ ಪಟ್ಟಣಗಳು” ಎಂಬ ಗ್ರೀಕ್ ಪದಗುಚ್ಛ ಅಸ್ಪಷ್ಟವಾಗಿದೆ; ಅದು ಶಿಷ್ಯರ ಪಟ್ಟಣಗಳನ್ನು ಅಥವಾ ಸುತ್ತಮುತ್ತಲಿನ ಜನರ ಪಟ್ಟಣಗಳನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: …ಮುಗಿಸಿದಾಗ
  rationale: ಮತ್ತಾಯನ ವೃತ್ತಾಂತದಲ್ಲಿನ ಈ ಸಂಕ್ರಮಣ ಸೂತ್ರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಕಾಲಸಂಬಂಧಿ ಉಪವಾಕ್ಯವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಆಗ ಸಂಭವಿಸಿತು’ ಎನ್ನುವುದು ಅಸಹಜವಾಗುತ್ತದೆ.
- source_word: ἐτέλεσεν
  choice: ಮುಗಿಸಿದಾಗ
  rationale: ಮುಂದಿನ ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮೊದಲು ಸೂಚನೆ ನೀಡುವ ಕಾರ್ಯ ಪೂರ್ಣಗೊಂಡಿತೆಂಬ ಕ್ರಮವನ್ನು ಕನ್ನಡದ ಸಹಜ ರೂಪದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: διατάσσων
  choice: ಸೂಚನೆಗಳನ್ನು ಕೊಟ್ಟು
  rationale: ಈ ಕೃದಂತವು ಅಧಿಕಾರಪೂರ್ವಕ ನಿರ್ದೇಶನ ನೀಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸೂಚನೆಗಳನ್ನು ಕೊಟ್ಟು’ ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾಗಿದ್ದು, ‘ಆಜ್ಞಾಪಿಸಿ’ ಎಂಬ ಬಲವಾದ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: ತನ್ನ ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ
  rationale: μαθηταίಗೆ ಸುವಾರ್ತೆಗಳ ಸಂದರ್ಭದಲ್ಲಿ ರೂಢಿಯಾದ ‘ಶಿಷ್ಯರು’ ಬಳಸಲಾಗಿದೆ; ಹನ್ನೆರಡು ಎಂಬ ಸಂಖ್ಯೆಯನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: μετέβη ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ ಹೊರಟುಹೋದನು
  rationale: ಒಂದು ಸ್ಥಳದಿಂದ ಮತ್ತೊಂದಕ್ಕೆ ತೆರಳುವ ಅರ್ಥವನ್ನೂ ವೃತ್ತಾಂತದ ಮುಂದುವರಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: ಬೋಧಿಸುವುದಕ್ಕೂ ಸಾರುವುದಕ್ಕೂ
  rationale: ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ರಚನೆಯನ್ನು ಕನ್ನಡದ ಉದ್ದೇಶಾರ್ಥಕ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ಬೋಧನೆ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಘೋಷಣೆ ಎಂಬ ಎರಡು ವಿಭಿನ್ನ ಕ್ರಿಯೆಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: κηρύσσειν
  choice: ಸಾರುವುದಕ್ಕೂ
  rationale: ಸಂದೇಶವನ್ನು ಬಹಿರಂಗವಾಗಿ ಘೋಷಿಸುವ ಅರ್ಥವನ್ನು ‘ಸಾರು’ ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ; ‘ಪ್ರಸಂಗಿಸು’ಗಿಂತ ಧಾರ್ಮಿಕ ತಾಂತ್ರಿಕ ಛಾಯೆ ಕಡಿಮೆ.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: ಅವರ ಪಟ್ಟಣಗಳಲ್ಲಿ
  rationale: αὐτῶνನ ಅಸ್ಪಷ್ಟ ಸಂಬಂಧವನ್ನು ‘ಅವರ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ. πόλις ಇಲ್ಲಿ ದೊಡ್ಡ ನಗರಗಳಿಗೆ ಮಾತ್ರ ಸೀಮಿತವಲ್ಲದ ವಸತಿಕೇಂದ್ರಗಳನ್ನು ಸೂಚಿಸಬಹುದಾದ್ದರಿಂದ ‘ಪಟ್ಟಣಗಳು’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
theological_decisions:
- issue: ἐν ταῖς πόλεσιν αὐτῶν ಎಂಬಲ್ಲಿನ αὐτῶν ಯಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ?
  choice: ‘ಅವರ ಪಟ್ಟಣಗಳಲ್ಲಿ’ ಎಂದು ಸಂಬಂಧವನ್ನು ಅಸ್ಪಷ್ಟವಾಗಿಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಶಿಷ್ಯರ ಪಟ್ಟಣಗಳಲ್ಲಿ’ ಅಥವಾ ‘ಆ ಪ್ರದೇಶದ ಪಟ್ಟಣಗಳಲ್ಲಿ’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಸರ್ವನಾಮದ ಪೂರ್ವಪದವನ್ನು ವಾಕ್ಯವು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನುವಾದವು ಶಿಷ್ಯರನ್ನಾಗಲಿ, ಸುತ್ತಲಿನ ಜನರನ್ನಾಗಲಿ ನಿರ್ಣಾಯಕವಾಗಿ ಗುರುತಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ ಅನುಸರಿಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ಅಧಿಕಾರಪೂರ್ವಕ ಸೂಚನೆಯ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜವಾಗಿ ನೀಡಿದ್ದು, ಹೆಚ್ಚು ಬಲವಾದ ‘ಆಜ್ಞಾಪಿಸಿ’ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಅವು ಸಂಬಂಧಿಸುವ ಪದಗುಚ್ಛಗಳ ತಕ್ಷಣ ಇರಿಸಲಾಗಿದೆ.
