review_pass:
  verdict: revise
  source_fidelity: 'The counterfactual construction, the plural reference to deeds performed among the addressed communities, and the repentance imagery are substantially preserved. However, the place name Χοραζίν is more accurately and conventionally rendered in Kannada as “ಕೊರಜಿನ್” (vocative: “ಕೊರಜಿನೇ”), rather than “ಕೊರಾಜೀನ್.”'
  naturalness: The draft is generally clear and uses an appropriate solemn register. Reordering the opening as “ಅಯ್ಯೋ, ...” is more idiomatic Kannada while retaining the prophetic lament/judgment force. “ಗೋಣಿತಟ್ಟು ಮತ್ತು ಬೂದಿಯಲ್ಲಿ” more directly represents the Greek locative expression “in sackcloth and ashes” than the expanded actions of putting them on.
  terminology: “ಮಹತ್ಕಾರ್ಯಗಳು” is a defensible rendering of δυνάμεις, with the footnote appropriately offering “ಅದ್ಭುತಕಾರ್ಯಗಳು.” “ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟಿರುತ್ತಿದ್ದರು” accurately conveys μετενόησαν in the contrary-to-fact apodosis.
  issues:
  - severity: medium
    issue: The transliteration “ಕೊರಾಜೀನ್” does not represent Χοραζίν as accurately or as conventionally as “ಕೊರಜಿನ್.”
    rationale: The Greek name has the form Chorazin/Korazin, not a long final ī vowel. The direct-address form should therefore be “ಕೊರಜಿನೇ.”
  - severity: low
    issue: “ಗೋಣಿತಟ್ಟನ್ನು ಹೊದ್ದು ಬೂದಿ ಹಾಕಿಕೊಂಡು” expands the source’s locative imagery into specific actions.
    rationale: The expansion is understandable but is less formally equivalent than “ಗೋಣಿತಟ್ಟು ಮತ್ತು ಬೂದಿಯಲ್ಲಿ,” which preserves the conventional biblical expression without adding actions.
  revised_text: “ಅಯ್ಯೋ, ಕೊರಜಿನೇ! ಅಯ್ಯೋ, ಬೇತ್ಸಾಯಿದಾವೇ! ಏಕೆಂದರೆ ನಿಮ್ಮಲ್ಲಿ ನಡೆದ ಮಹತ್ಕಾರ್ಯಗಳು[a] ತೂರ್ ಮತ್ತು ಸೀದೋನ್‌ನಲ್ಲಿ ನಡೆದಿದ್ದರೆ, ಅವರು ಬಹಳ ಹಿಂದೆಯೇ ಗೋಣಿತಟ್ಟು ಮತ್ತು ಬೂದಿಯಲ್ಲಿ ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟಿರುತ್ತಿದ್ದರು.”
