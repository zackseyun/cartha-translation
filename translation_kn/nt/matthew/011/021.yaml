id: MAT.11.21
reference: Matthew 11:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: kn
  text: “ಅಯ್ಯೋ, ಕೊರಜಿನೇ! ಅಯ್ಯೋ, ಬೇತ್ಸಾಯಿದಾವೇ! ಏಕೆಂದರೆ ನಿಮ್ಮಲ್ಲಿ ನಡೆದ ಮಹತ್ಕಾರ್ಯಗಳು[a] ತೂರ್ ಮತ್ತು ಸೀದೋನ್‌ನಲ್ಲಿ ನಡೆದಿದ್ದರೆ, ಅವರು ಬಹಳ ಹಿಂದೆಯೇ ಗೋಣಿತಟ್ಟು ಮತ್ತು ಬೂದಿಯಲ್ಲಿ ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟಿರುತ್ತಿದ್ದರು.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಅದ್ಭುತಕಾರ್ಯಗಳು”; ಗ್ರೀಕ್‌ನಲ್ಲಿ “ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: ನಿನಗೆ ಅಯ್ಯೋ
  rationale: ಪ್ರವಾದನಾತ್ಮಕ ದುಃಖೋದ್ಗಾರ ಮತ್ತು ನ್ಯಾಯತೀರ್ಪಿನ ಎಚ್ಚರಿಕೆ ಎರಡನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ವಿಷಾದವನ್ನು ಸೂಚಿಸುವ ಮೃದು ಅಭಿವ್ಯಕ್ತಿಗಿಂತ ಸಂದರ್ಭಕ್ಕೆ ಹೆಚ್ಚು ಸೂಕ್ತವಾಗಿದೆ.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: ಕೊರಾಜೀನ್ / ಬೇತ್ಸಾಯಿದಾ
  rationale: ಸ್ಥಳನಾಮಗಳನ್ನು ಕನ್ನಡದ ಸಹಜ ಉಚ್ಚಾರಣೆಗೆ ಅನುಗುಣವಾಗಿ ಲಿಪ್ಯಂತರಿಸಿ, ನೇರ ಸಂಬೋಧನೆಯಲ್ಲಿ ‘ಕೊರಾಜೀನೇ / ಬೇತ್ಸಾಯಿದಾವೇ’ ಎಂದು ರೂಪಿಸಲಾಗಿದೆ.
- source_word: αἱ δυνάμεις
  choice: ಮಹತ್ಕಾರ್ಯಗಳು
  rationale: ದೈವಿಕ ಶಕ್ತಿಯಿಂದ ನಡೆದ ಕಾರ್ಯಗಳು ಎಂಬ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಅದ್ಭುತಗಳು’ ಎಂಬ ಮಾನ್ಯ ಪರ್ಯಾಯಕ್ಕಿಂತ ಗ್ರೀಕ್ ಪದದಲ್ಲಿರುವ ‘ಶಕ್ತಿ’ಯ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ವಿಶಾಲವಾಗಿ ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
- source_word: ἐν ὑμῖν
  choice: ನಿಮ್ಮಲ್ಲಿ
  rationale: ಬಹುವಚನದಲ್ಲಿ ಸಂಬೋಧಿಸಲ್ಪಟ್ಟ ಪಟ್ಟಣಗಳ ಜನರ ಮಧ್ಯದಲ್ಲಿ ಆ ಕಾರ್ಯಗಳು ನಡೆದವು ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: ಬಹಳ ಹಿಂದೆಯೇ ... ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟಿರುತ್ತಿದ್ದರು
  rationale: ಅವಾಸ್ತವ ಭೂತಕಾಲದ ಷರತ್ತನ್ನು ‘ಪಟ್ಟಿರುತ್ತಿದ್ದರು’ ಎಂಬ ರೂಪದಲ್ಲಿ ಮತ್ತು πάλαιಯ ಕಾಲಸೂಚನೆಯನ್ನು ‘ಬಹಳ ಹಿಂದೆಯೇ’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: ಗೋಣಿತಟ್ಟನ್ನು ಹೊದ್ದು ಬೂದಿ ಹಾಕಿಕೊಂಡು
  rationale: ಶೋಕ ಮತ್ತು ಪಶ್ಚಾತ್ತಾಪದ ಸಾಂಸ್ಕೃತಿಕ ಚಿತ್ರವನ್ನು ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸಹಜವಾಗುವ ಕ್ರಿಯಾತ್ಮಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ತೂರ್ ಮತ್ತು ಸೀದೋನ್ ಪಟ್ಟಣಗಳೊಂದಿಗೆ ಯೇಸು ಮಾಡುವ ಹೋಲಿಕೆಯ ಸ್ವರೂಪ
  choice: ಯೇಸುವಿನ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಕಂಡಿದ್ದರೂ ಪಶ್ಚಾತ್ತಾಪಪಡದ ಪಟ್ಟಣಗಳ ಹೆಚ್ಚಿನ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಸೂಚಿಸುವ ನಿಜವಾದ ಪ್ರತಿಕಲ್ಪಿತ ಹೋಲಿಕೆಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ವಾಸ್ತವವಾದ ತುಲನಾತ್ಮಕ ನ್ಯಾಯತೀರ್ಪನ್ನು ಸೂಚಿಸದ ಕೇವಲ ಅತಿಶಯೋಕ್ತಿಯ ಮಾತು.
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಅವಾಸ್ತವ ಷರತ್ತಿನ ಮೂಲಕ ನೈತಿಕ ವ್ಯತ್ಯಾಸವನ್ನು ತೀವ್ರಗೊಳಿಸುತ್ತದೆ. ಅದರಾಚೆಗೆ ಯಾವುದೇ ಪಂಥೀಯ ಅಥವಾ ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಣಯವನ್ನು ಅನುವಾದದಲ್ಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಪಟ್ಟಣಗಳನ್ನು ಏಕವಚನದಲ್ಲಿ ನೇರವಾಗಿ ಸಂಬೋಧಿಸುವ ಗ್ರೀಕ್ ರೂಪವನ್ನು ಉಳಿಸಿಕೊಂಡು, ‘ನಿಮ್ಮಲ್ಲಿ’ ಎಂಬ ಬಹುವಚನದ ಮೂಲಕ ಅಲ್ಲಿನ ಜನರನ್ನು ಒಳಗೊಂಡ ಮೂಲದ ಬದಲಾವಣೆಯನ್ನೂ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
