id: MAT.11.3
reference: Matthew 11:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: kn
  text: ಅವನಿಗೆ, “ಬರಲಿರುವವನು[a] ನೀನೇನಾ, ಅಥವಾ ನಾವು ಬೇರೊಬ್ಬನನ್ನು ನಿರೀಕ್ಷಿಸಬೇಕೇ?” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಬರುವವನು.” ಗ್ರೀಕ್‌ನ ಈ ಪದಗುಚ್ಛವು ನಿರೀಕ್ಷಿತ ಮೆಸ್ಸೀಯನನ್ನು ಸೂಚಿಸುವ ಬಿರುದಿನಂತೆ ಬಳಕೆಯಾಗಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: ಅವನಿಗೆ … ಎಂದು ಕೇಳಿದರು
  rationale: ಮೂಲದಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಅವನಿಗೆ ಹೇಳಿದರು’ ಎಂದಿದ್ದರೂ, ನೇರ ಪ್ರಶ್ನೆಯನ್ನು ಪರಿಚಯಿಸುವ ಕನ್ನಡದ ಸಹಜ ನಿರೂಪಣೆಯಲ್ಲಿ ‘ಎಂದು ಕೇಳಿದರು’ ಎಂಬುದು ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ಕರ್ತೃ ಹಿಂದಿನ ವಚನದಿಂದ ತಿಳಿಯುವುದರಿಂದ ಇಲ್ಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: Σὺ εἶ
  choice: ನೀನೇನಾ
  rationale: ಪ್ರಶ್ನಾರ್ಥಕ ರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುವುದರ ಜೊತೆಗೆ, ಸ್ಪಷ್ಟವಾಗಿ ಬಳಕೆಯಾದ σύ ಸರ್ವನಾಮದ ಒತ್ತನ್ನು ‘ನೀನೇ’ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ ἐρχόμενος
  choice: ಬರಲಿರುವವನು
  rationale: ಲೇಖಸಹಿತ ವರ್ತಮಾನ ಕೃದಂತವು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದ್ದು, ನಿರೀಕ್ಷಿತವಾಗಿ ಬರುವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಬರಲಿರುವವನು’ ಅದರ ಶೀರ್ಷಿಕೆಸಮಾನವಾದ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಸೂಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆಯಾದರೂ, ‘ಮೆಸ್ಸೀಯ’ ಎಂದು ಅತಿಯಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: ἢ
  choice: ಅಥವಾ
  rationale: ಪರ್ಯಾಯ ಪ್ರಶ್ನೆಯನ್ನು ಪರಿಚಯಿಸುವ ಸಹಜ ವಿಭಾಜಕ ಸಂಯೋಜಕ.
- source_word: ἕτερον
  choice: ಬೇರೊಬ್ಬನನ್ನು
  rationale: ‘ಇನ್ನೊಬ್ಬನು/ಬೇರೆಯವನು’ ಎಂಬ ಅರ್ಥವನ್ನು ಇಲ್ಲಿ ವ್ಯಕ್ತಿಗೆ ಸಂಬಂಧಿಸಿದಂತೆ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: προσδοκῶμεν
  choice: ನಾವು … ನಿರೀಕ್ಷಿಸಬೇಕೇ
  rationale: ರೂಪತಃ ವರ್ತಮಾನ ಸೂಚಕಾರ್ಥಕವಾಗಿದ್ದರೂ, ಈ ಪರ್ಯಾಲೋಚನಾ ಪ್ರಶ್ನೆಯಲ್ಲಿ ‘ನಿರೀಕ್ಷಿಸಬೇಕೇ’ ಎಂಬುದು ಅದರ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ; ಕೇವಲ ಕಾಯುವುದಕ್ಕಿಂತ ನಿರೀಕ್ಷೆಯ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ὁ ἐρχόμενος ಎಂಬುದರ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ/ಶೀರ್ಷಿಕೆಸಮಾನ ಬಲ
  choice: ‘ಬರಲಿರುವವನು’ ಎಂದು ನೀಡಲಾಗಿದೆ
  alternative: ‘ಬರುವವನು’ ಅಥವಾ ನೇರವಾಗಿ ‘ಮೆಸ್ಸೀಯನು’
  rationale: ಲೇಖ ಮತ್ತು ಸಂದರ್ಭವು ನಿರೀಕ್ಷಿತ ವಿಶೇಷ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತವೆ. ‘ಬರಲಿರುವವನು’ ಈ ಶೀರ್ಷಿಕೆಸಮಾನ ಸೂಚನೆಯನ್ನು ಉಳಿಸಿ, ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ಮೆಸ್ಸೀಯನು’ ಎಂಬ ಸ್ಪಷ್ಟೀಕರಣವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಆಮದು ಮಾಡುವುದಿಲ್ಲ; ಸಾಮಾನ್ಯ ಕೃದಂತಾರ್ಥದ ಸಾಧ್ಯತೆಯನ್ನೂ ಸಂಪೂರ್ಣವಾಗಿ ಮುಚ್ಚುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಪ್ರಶ್ನಾರೂಪ ಬಳಸಲಾಗಿದೆ. ‘ನೀನೇನಾ’ ಮೂಲದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಬರಲಿರುವವನು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿದ್ದು ಶೀರ್ಷಿಕೆಸಮಾನ ಧಾರ್ಮಿಕ ಸೂಚನೆಯನ್ನು ಅತಿವ್ಯಾಖ್ಯಾನವಿಲ್ಲದೆ ಕಾಪಾಡುತ್ತದೆ.
