  naturalness: The proposed revision is natural modern standard Kannada. ‘ನೀನೇನಾ’ preserves the emphasis of σύ, and ‘ನಿರೀಕ್ಷಿಸಬೇಕೇ’ is idiomatic for the deliberative προσδοκῶμεν.
