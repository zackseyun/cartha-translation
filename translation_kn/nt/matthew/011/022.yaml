id: MAT.11.22
reference: Matthew 11:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: kn
  text: 'ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ನಿಮಗಿಂತ ತೂರ್ ಮತ್ತು ಸೀದೋನ್ ಪಟ್ಟಣಗಳಿಗೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುತ್ತದೆ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹೆಚ್ಚು ತಾಳಿಕೊಳ್ಳಬಹುದಾಗಿರುತ್ತದೆ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಖಂಡನೆಗೆ ಬಲವಾದ ವ್ಯತಿರಿಕ್ತತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಸ್ಪಷ್ಟವೂ ಆಗಿದೆ.
- source_word: λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ
  rationale: ವೈಯಕ್ತಿಕ ಸಂಬೋಧನೆಯನ್ನೂ ಮಾತಿನ ಗಂಭೀರತೆಯನ್ನೂ ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟು.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: ತೂರ್ ಮತ್ತು ಸೀದೋನ್ ಪಟ್ಟಣಗಳಿಗೆ
  rationale: ತುಲನಾತ್ಮಕ ವಿಶೇಷಣದೊಂದಿಗೆ ಬಂದಿರುವ ದತ್ತಿವಿಭಕ್ತಿಯು ತೀರ್ಪು ಯಾರಿಗೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ನಗರಗಳ ಹೆಸರುಗಳೆಂಬುದು ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಲು ‘ಪಟ್ಟಣಗಳಿಗೆ’ ಬಳಸಲಾಗಿದೆ.
- source_word: ἀνεκτότερον
  choice: ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುತ್ತದೆ
  rationale: ಸಹಿಸಬಹುದಾದ ಅಥವಾ ತಾಳಿಕೊಳ್ಳಬಹುದಾದ ಸ್ಥಿತಿಯ ತುಲನಾತ್ಮಕ ಅರ್ಥವನ್ನು ಗಂಭೀರವಾದರೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἔσται
  choice: ಆಗಿರುತ್ತದೆ
  rationale: ಭವಿಷ್ಯಕಾಲದ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ
  rationale: ನ್ಯಾಯಿಕ ತೀರ್ಪು ನಡೆಯುವ ಕಾಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ನ್ಯಾಯತೀರ್ಪು’ ಎಂಬುದು κρίσις ಪದದ ವಿಶಾಲ ನ್ಯಾಯಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἢ ὑμῖν
  choice: ನಿಮಗಿಂತ
  rationale: ಸಂಬೋಧಿಸಲ್ಪಟ್ಟವರೊಂದಿಗೆ ಮಾಡಿರುವ ಹೋಲಿಕೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮುಂದೆ ಬರುವ ತೀರ್ಪಿನ ಸ್ವರೂಪ
  choice: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನ
  alternative: ಒಂದು ತೀರ್ಪಿನ ದಿನ
  rationale: ಗ್ರೀಕ್ ಪದಗುಚ್ಛದಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಉಪಪದ ಇಲ್ಲದಿದ್ದರೂ, ಮತ್ತಾಯನ ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಪರಿಚಿತವಾದ ಭವಿಷ್ಯದ ನ್ಯಾಯತೀರ್ಪಿನ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಗಳನ್ನು ಸೇರಿಸದೆ ಆ ಅರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ತೀರ್ಪಿನ ತುಲನಾತ್ಮಕ ಸಹನೀಯತೆ
  choice: ತೂರ್ ಮತ್ತು ಸೀದೋನ್ ಪಟ್ಟಣಗಳಿಗೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುತ್ತದೆ
  alternative: ತೂರ್ ಮತ್ತು ಸೀದೋನ್ ಪಟ್ಟಣಗಳ ಶಿಕ್ಷೆ ಕಡಿಮೆಯಾಗಿರುತ್ತದೆ
  rationale: ಮೂಲವು ಶಿಕ್ಷೆಯ ಪ್ರಮಾಣ ಅಥವಾ ನಿಖರ ಸ್ವರೂಪವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ‘ಕಡಿಮೆ ಶಿಕ್ಷೆ’ ಎಂದು ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸದೆ ಮೂಲದ ತುಲನಾತ್ಮಕ ಒತ್ತಡ ಮತ್ತು theological tension ಅನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಶೈಲಿ. ‘ಪಟ್ಟಣಗಳಿಗೆ’ ಎಂಬ ಸ್ಪಷ್ಟೀಕರಣವು ತೂರ್ ಮತ್ತು ಸೀದೋನ್ ಸ್ಥಳನಾಮಗಳೆಂಬುದನ್ನು ತಿಳಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ಶಿಕ್ಷೆಯ ಸ್ವರೂಪ ಅಥವಾ ಪ್ರಮಾಣವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
