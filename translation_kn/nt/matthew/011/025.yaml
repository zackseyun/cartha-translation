id: MAT.11.25
reference: Matthew 11:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: kn
  text: 'ಆ ಸಮಯದಲ್ಲಿ ಯೇಸು ಉತ್ತರವಾಗಿ ಹೀಗೆ ಹೇಳಿದರು: “ತಂದೆಯೇ, ಆಕಾಶಕ್ಕೂ ಭೂಮಿಗೂ ಕರ್ತನೇ, ನಾನು ನಿನ್ನನ್ನು ಸ್ತುತಿಸುತ್ತೇನೆ[a]. ಏಕೆಂದರೆ ನೀನು ಈ ವಿಷಯಗಳನ್ನು ಜ್ಞಾನಿಗಳಿಂದಲೂ ವಿವೇಕಿಗಳಿಂದಲೂ ಮರೆಮಾಡಿ, ಅವುಗಳನ್ನು ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ[b] ಪ್ರಕಟಿಸಿದ್ದೀ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಿನಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸುತ್ತೇನೆ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಕೃತಜ್ಞತೆ, ಸ್ತುತಿ ಅಥವಾ ಬಹಿರಂಗ ಅಂಗೀಕಾರವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಶಿಶುಗಳಿಗೆ.” ಇಲ್ಲಿ ‘ಚಿಕ್ಕ ಮಕ್ಕಳು’ ಎಂಬುದು ವಿನಯಶೀಲರು ಅಥವಾ ಮಗುವಿನಂತೆ ಸ್ವೀಕರಿಸುವವರನ್ನು ರೂಪಕವಾಗಿ ಸೂಚಿಸುವ ಸಾಧ್ಯತೆಯಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ಆ ಸಮಯದಲ್ಲಿ
  rationale: ನಿರೂಪಣೆಯ ಕಾಲಸಂದರ್ಭವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ಪ್ರತಿಕ್ರಿಯಿಸಿ ಹೀಗೆ ಹೇಳಿದರು
  rationale: ಮೊದಲು ಸ್ಪಷ್ಟ ಪ್ರಶ್ನೆ ಇಲ್ಲದಿದ್ದರೂ ಮೂಲದ ಸೆಮಿಟಿಕ್ ಪ್ರಭಾವಿತ ದ್ವಿಕ್ರಿಯಾ ನಿರೂಪಣಾ ಸೂತ್ರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗದಂತೆ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἐξομολογοῦμαί σοι
  choice: ನಾನು ನಿನ್ನನ್ನು ಸ್ತುತಿಸುತ್ತೇನೆ
  rationale: ಇಲ್ಲಿ ಕ್ರಿಯಾಪದವು ಪಾಪವನ್ನು ಅರಿಕೆ ಮಾಡುವುದಕ್ಕಿಂತ ಬಹಿರಂಗ ಅಂಗೀಕಾರ, ಸ್ತುತಿ ಅಥವಾ ಕೃತಜ್ಞತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಂಬೋಧನೆಯ ಸ್ತುತಿಪರ ಧ್ವನಿಗೆ ಈ ಆಯ್ಕೆ ಹೊಂದುತ್ತದೆ.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: ತಂದೆಯೇ, ಆಕಾಶಕ್ಕೂ ಭೂಮಿಗೂ ಒಡೆಯನೇ
  rationale: ಎರಡೂ ಸಂಬೋಧನೆಗಳನ್ನು ಮತ್ತು ದೇವರ ಸಾರ್ವಭೌಮತ್ವವನ್ನು ಸಹಜವಾದ, ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಯೇಸುವಿನ ಸ್ತುತಿಗೆ ಆಧಾರವಾದ ಕಾರಣವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವ ಕಾರಣಾರ್ಥಕ ಸಂಬಂಧವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἔκρυψας
  choice: ನೀನು ... ಮರೆಮಾಡಿ
  rationale: ದೇವರ ನೇರ ಕರ್ತೃತ್ವವನ್ನು ಮೃದುಗೊಳಿಸದೆ ಗ್ರೀಕ್ ಸಕ್ರಿಯ ಕ್ರಿಯಾಪದವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ταῦτα ... αὐτά
  choice: ಈ ವಿಷಯಗಳನ್ನು
  rationale: ಯಾವ ವಿಷಯಗಳೆಂಬುದನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿವರಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ಸಂದರ್ಭಾಧಾರಿತ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದ ಸಂಯುಕ್ತ ವಾಕ್ಯದಲ್ಲಿ ಪುನರಾವರ್ತಿತ ಕರ್ಮವನ್ನು ಬಿಡುವುದು ಸಹಜ.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: ಜ್ಞಾನಿಗಳಿಗೂ ವಿವೇಕಿಗಳಿಗೂ
  rationale: ಎರಡು ಗುಣವಾಚಕ ನಾಮರೂಪಗಳ ವ್ಯತ್ಯಾಸವನ್ನು—ಜ್ಞಾನ ಮತ್ತು ಗ್ರಹಿಕೆ/ವಿವೇಕ—ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπεκάλυψας
  choice: ಪ್ರಕಟಿಸಿದ್ದೀ
  rationale: ದೈವಿಕ ಬಹಿರಂಗಪಡಿಸುವಿಕೆಯ ಅರ್ಥವನ್ನು ಹೊರುವ ರೂಢಿಯಾದ ಬೈಬಲ್ ಕನ್ನಡ ಪದ.
- source_word: νηπίοις
  choice: ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ
  rationale: ಪದದ ಶಿಶು/ಚಿಕ್ಕ ಮಗು ಎಂಬ ಚಿತ್ರವನ್ನು ಉಳಿಸಿ, ‘ದೀನರು’ ಎಂಬ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಅಮೂರ್ತೀಕರಣವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮರೆಮಾಡುವಿಕೆ ಮತ್ತು ಪ್ರಕಟಿಸುವಿಕೆಯಲ್ಲಿ ದೇವರ ಕರ್ತೃತ್ವ
  choice: ‘ನೀನು ... ಮರೆಮಾಡಿ ... ಪ್ರಕಟಿಸಿದ್ದೀ’ ಎಂದು ನೇರ ಕರ್ತೃತ್ವವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಮರೆಯಾಗಿರಲು ನೀನು ಅನುಮತಿಸಿದೆ’ ಎಂಬ ಅನುಮತಿಸೂಚಕ ರೂಪ.
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿ ತಂದೆಯೇ ಎರಡೂ ಸಕ್ರಿಯ ಕ್ರಿಯೆಗಳ ಕರ್ತೃ. ಪೂರ್ವನಿರ್ಣಯ ಅಥವಾ ಕಠಿಣೀಕರಣದ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: νηπίοις ಪದದ ಅರ್ಥ
  choice: ರೂಪಕದ ಚಿತ್ರವನ್ನು ಉಳಿಸುವ ‘ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ’.
  alternative: ಅಕ್ಷರಶಃ ‘ಶಿಶುಗಳಿಗೆ’ ಅಥವಾ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ‘ದೀನರಿಗೆ’.
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಇದು ಜ್ಞಾನಿಗಳು ಮತ್ತು ವಿವೇಕಿಗಳಿಗೆ ವಿರುದ್ಧವಾಗಿ ಮಗುವಿನಂಥ ಸ್ವೀಕಾರಶೀಲತೆಯವರನ್ನು ಸೂಚಿಸಬಹುದು; ಆದರೆ ಅನುವಾದವು ಆ ರೂಪಕವನ್ನು ನಿರ್ದಿಷ್ಟ ಗುಣಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ ಆದರೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ದೇವರನ್ನು ಉದ್ದೇಶಿಸುವಲ್ಲಿ ಏಕವಚನ ಆತ್ಮೀಯ ಸಂಬೋಧನೆ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ನೇರ ದೈವಿಕ ಕರ್ತೃತ್ವ ಮತ್ತು νηπίοις ಪದದ ರೂಪಕಾತ್ಮಕ ಅನಿಶ್ಚಿತತೆ ಎರಡನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
