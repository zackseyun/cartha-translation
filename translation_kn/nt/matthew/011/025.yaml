revisions:
- from: 'ಆ ಸಮಯದಲ್ಲಿ ಯೇಸು ಪ್ರತಿಕ್ರಿಯಿಸಿ ಹೀಗೆ ಹೇಳಿದರು: “ತಂದೆಯೇ, ಆಕಾಶಕ್ಕೂ ಭೂಮಿಗೂ ಒಡೆಯನೇ, ನಾನು ನಿನ್ನನ್ನು ಸ್ತುತಿಸುತ್ತೇನೆ[a]. ಏಕೆಂದರೆ ನೀನು ಈ ವಿಷಯಗಳನ್ನು ಜ್ಞಾನಿಗಳಿಗೂ ವಿವೇಕಿಗಳಿಗೂ ಮರೆಮಾಡಿ, ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ[b] ಪ್ರಕಟಿಸಿದ್ದೀ.”'
  to: 'ಆ ಸಮಯದಲ್ಲಿ ಯೇಸು ಉತ್ತರವಾಗಿ ಹೀಗೆ ಹೇಳಿದರು: “ತಂದೆಯೇ, ಆಕಾಶಕ್ಕೂ ಭೂಮಿಗೂ ಕರ್ತನೇ, ನಾನು ನಿನ್ನನ್ನು ಸ್ತುತಿಸುತ್ತೇನೆ[a]. ಏಕೆಂದರೆ ನೀನು ಈ ವಿಷಯಗಳನ್ನು ಜ್ಞಾನಿಗಳಿಂದಲೂ ವಿವೇಕಿಗಳಿಂದಲೂ ಮರೆಮಾಡಿ, ಅವುಗಳನ್ನು ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ[b] ಪ್ರಕಟಿಸಿದ್ದೀ.”'
  rationale: The required revision corrects the reversal of ἀπό by changing the recipients from dative (‘to the wise and understanding’) to source/separation phrasing (‘from the wise and understanding’). It preserves the source’s direct attribution of both hiding and revealing to the Father, retains the metaphorical child image without doctrinal expansion, and uses established Kannada biblical terminology for ‘Lord.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the temporal setting, direct divine agency, open reference of ‘these things,’ and the child imagery. However, ‘ಜ್ಞಾನಿಗಳಿಗೂ ವಿವೇಕಿಗಳಿಗೂ’ is dative (‘to the wise and understanding’) and reverses the required ἀπό (‘from’). It must be ‘ಜ್ಞಾನಿಗಳಿಂದಲೂ ವಿವೇಕಿಗಳಿಂದಲೂ’ (or equivalent). The revised text also restores the explicit pronoun for the second occurrence of ταῦτα/αὐτά.
  naturalness: The revised wording is fluent modern standard Kannada with an appropriately reverent biblical register. ‘ಕರ್ತನೇ’ is a well-established and clear Kannada biblical equivalent for κύριε in this address.
  terminology: ‘ಕರ್ತನೇ’ more consistently represents κύριε (‘Lord’) than ‘ಒಡೆಯನೇ’ in this theological and liturgical vocative. ‘ಪ್ರಕಟಿಸಿದ್ದೀ’ suitably conveys ἀπεκάλυψας, and ‘ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ’ retains the metaphorical image of νηπίοις without interpretive reduction.
  issues:
  - severity: high
    issue: Incorrect case for ἀπὸ σοφῶν καὶ συνετῶν
    rationale: ‘ಜ್ಞಾನಿಗಳಿಗೂ ವಿವೇಕಿಗಳಿಗೂ’ means ‘to the wise and understanding,’ whereas the Greek explicitly says that these things were hidden ‘from the wise and understanding.’ This changes the syntactic and semantic relation and requires correction.
  - severity: low
    issue: Second demonstrative object is implicit
    rationale: The omitted object after ‘ಮರೆಮಾಡಿ’ is recoverable in Kannada, but adding ‘ಅವುಗಳನ್ನು’ before ‘ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ ಪ್ರಕಟಿಸಿದ್ದೀ’ more clearly represents the Greek ταῦτα ... αὐτά contrast without adding interpretation.
  - severity: low
    issue: Rendering of κύριε
    rationale: ‘ಒಡೆಯನೇ’ can mean owner or master. ‘ಕರ್ತನೇ’ is the more conventional and precise Kannada biblical rendering of ‘Lord’ in a divine address.
