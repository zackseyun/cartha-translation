review_pass:
  verdict: revise
  source_fidelity: ಮುಖ್ಯ ಅರ್ಥ ಮತ್ತು ವಾಕ್ಯದ ವಿರೋಧಾಭಾಸವನ್ನು ಕರಡು ಸರಿಯಾಗಿ ಉಳಿಸುತ್ತದೆ. ಆದರೆ ‘ಸ್ತ್ರೀಯರಲ್ಲಿ ಹುಟ್ಟಿದವರಲ್ಲಿ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಜನನದ ಮೂಲವನ್ನು ಸರಿಯಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ; ಗ್ರೀಕ್ γεννητοῖς γυναικῶνಗೆ ‘ಸ್ತ್ರೀಯರಿಂದ ಹುಟ್ಟಿದವರಲ್ಲಿ’ ಹೆಚ್ಚು ನಿಖರವಾಗಿದೆ. ‘ಉದಯಿಸಿಲ್ಲ’ ವ್ಯಕ್ತಿಯ ಇತಿಹಾಸದಲ್ಲಿ ಕಾಣಿಸಿಕೊಳ್ಳುವಿಕೆಗೆ ಸಾಧ್ಯವಾದರೂ, ‘ಎದ್ದು ಬಂದಿಲ್ಲ’ ಇಲ್ಲಿ ಹೆಚ್ಚು ಸಹಜವಾಗಿದ್ದು ἐγήγερταιಯ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
  naturalness: ‘ಸ್ತ್ರೀಯರಿಂದ ಹುಟ್ಟಿದವರಲ್ಲಿ’ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾದರೂ ಬೈಬಲೀಯ ನುಡಿಗಟ್ಟಿನ ಸ್ವರೂಪವನ್ನು ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ. ‘ಮಹಾನನು’ ಎಂಬುದು ಈ ಎರಡೂ ಹೋಲಿಕೆಗಳಲ್ಲಿ ‘ದೊಡ್ಡವನು’ಗಿಂತ ಸ್ಥಾನಮಾನ/ಮಹತ್ವದ ಉದ್ದೇಶವನ್ನು ಹೆಚ್ಚು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ. ‘ಸ್ವರ್ಗರಾಜ್ಯ’ವು τῇ βασιλείᾳ τῶν οὐρανῶνಗೆ ‘ಪರಲೋಕರಾಜ್ಯ’ಕ್ಕಿಂತ ಕಡಿಮೆ ಪರಲೋಕ-ಕೇಂದ್ರಿತ ಮತ್ತು ನೇರವಾದ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
  terminology: ‘ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನ’ ಎಂಬ ಪರಿಚಿತ ಕಾರ್ಯನಾಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಸ್ವರ್ಗರಾಜ್ಯ’ ಮತ್ತಾಯನ ಸ್ಥಿರ ಪದಪ್ರಯೋಗಕ್ಕೆ ಹೊಂದಿಕೆಯಾಗುತ್ತದೆ. ‘ಮಹಾನನು’ ಗ್ರೀಕ್ μείζωνನ ಹೋಲಿಕೆಯ ಅರ್ಥವನ್ನು ಸಂದರ್ಭೋಚಿತವಾಗಿ ನೀಡುತ್ತದೆ; ‘ಅತಿ ಚಿಕ್ಕವನು’ಗೆ ಸಂಬಂಧಿಸಿದ ಸ್ಥಾನಮಾನದ ವಿವರಣೆ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಮಾತ್ರ ಇದೆ.
  issues:
  - severity: medium
    issue: ‘ಸ್ತ್ರೀಯರಲ್ಲಿ ಹುಟ್ಟಿದವರಲ್ಲಿ’ ಎಂಬ ಪದಸಂಯೋಜನೆ
    rationale: ಇದು ‘women among whom people were born’ ಎಂಬಂತೆ ಅಸ್ಪಷ್ಟವಾಗಬಹುದು. γεννητοῖς γυναικῶν ಎಂದರೆ ‘born of/from women’; ‘ಸ್ತ್ರೀಯರಿಂದ ಹುಟ್ಟಿದವರಲ್ಲಿ’ ಅದನ್ನು ನಿಖರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
  - severity: low
