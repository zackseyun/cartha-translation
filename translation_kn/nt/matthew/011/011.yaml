- from: 'ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಸ್ತ್ರೀಯರಲ್ಲಿ ಹುಟ್ಟಿದವರಲ್ಲಿ ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನನಿಗಿಂತ ದೊಡ್ಡವನು ಯಾರೂ ಉದಯಿಸಿಲ್ಲ[a][b]. ಆದರೂ ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ ಅತಿ ಚಿಕ್ಕವನು[c] ಅವನಿಗಿಂತ ದೊಡ್ಡವನಾಗಿದ್ದಾನೆ.'
  to: 'ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಸ್ತ್ರೀಯರಿಂದ ಹುಟ್ಟಿದವರಲ್ಲಿ ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನನಿಗಿಂತ ಮಹಾನನು ಯಾರೂ ಎದ್ದು ಬಂದಿಲ್ಲ[a][b]. ಆದರೂ ಸ್ವರ್ಗರಾಜ್ಯದಲ್ಲಿ ಅತಿ ಚಿಕ್ಕವನು[c] ಅವನಿಗಿಂತ ಮಹಾನನಾಗಿದ್ದಾನೆ.'
  rationale: ಜನನದ ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟನ್ನು ಕನ್ನಡದಲ್ಲಿ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿಯೂ ಅರ್ಥಸ್ಪಷ್ಟವಾಗಿಯೂ ಮಾಡಲಾಗಿದೆ. ವ್ಯಕ್ತಿಯ ‘arising/appearing’ ಅರ್ಥಕ್ಕೆ ಸಹಜವಾದ ಕ್ರಿಯಾಪದವನ್ನು ಬಳಸಲಾಗಿದೆ. ಎರಡೂ μείζωνಗಳಿಗೆ ‘ಮಹಾನನು’ ಬಳಸಿ ಹೋಲಿಕೆಯ ಉದ್ದೇಶವನ್ನು ಒಂದೇ ರೀತಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ. ವಾಕ್ಯವು ಹೇಳದ ತಾತ್ತ್ವಿಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಅದರ ವಿರೋಧಾಭಾಸವನ್ನು ಕಾಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ.
