id: MAT.11.11
reference: Matthew 11:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: kn
  text: 'ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಸ್ತ್ರೀಯರಿಂದ ಹುಟ್ಟಿದವರಲ್ಲಿ ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನನಿಗಿಂತ ಮಹಾನನು ಯಾರೂ ಎದ್ದು ಬಂದಿಲ್ಲ[a][b]. ಆದರೂ ಸ್ವರ್ಗರಾಜ್ಯದಲ್ಲಿ ಅತಿ ಚಿಕ್ಕವನು[c] ಅವನಿಗಿಂತ ಮಹಾನನಾಗಿದ್ದಾನೆ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಎಬ್ಬಿಸಲ್ಪಟ್ಟಿಲ್ಲ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದಕ್ಕೆ ‘ಎದ್ದು ಬಂದಿದ್ದಾನೆ’ ಅಥವಾ ‘ಎಬ್ಬಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ’ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ಇಲ್ಲಿ ಅದು ಪುನರುತ್ಥಾನಕ್ಕಿಂತ ಇತಿಹಾಸದಲ್ಲಿ ಒಬ್ಬನು ಕಾಣಿಸಿಕೊಂಡದ್ದನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಸ್ತ್ರೀಯರಿಂದ ಹುಟ್ಟಿದವರು’ ಎಂಬುದು ಮಾನವರನ್ನು ಸೂಚಿಸುವ ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟು.
    reason: cultural_note
  - marker: c
    text: ಅಥವಾ, ‘ಚಿಕ್ಕವನು’ / ‘ಕಡಿಮೆಯವನು.’ ಗ್ರೀಕ್ ಪದವು ರೂಪದಲ್ಲಿ ಹೋಲಿಕೆಯ ಪದವಾಗಿದ್ದರೂ, ಇಲ್ಲಿ ಸ್ವರ್ಗರಾಜ್ಯದಲ್ಲಿ ಸ್ಥಾನಮಾನದಲ್ಲಿ ಅತ್ಯಲ್ಪನನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ
  rationale: ಗಂಭೀರವೂ ಅಧಿಕೃತವೂ ಆದ ಪರಿಚಯಸೂತ್ರವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὐκ ἐγήγερται
  choice: ಯಾರೂ ಉದಯಿಸಿಲ್ಲ
  rationale: ಕ್ರಿಯಾಪದದ ಪರಿಪೂರ್ಣಕಾಲದ ಫಲಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತಾ, ಇತಿಹಾಸದಲ್ಲಿ ಕಾಣಿಸಿಕೊಂಡಿರುವ ಅರ್ಥಕ್ಕೆ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ; ಪುನರುತ್ಥಾನದ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: ಸ್ತ್ರೀಯರಲ್ಲಿ ಹುಟ್ಟಿದವರಲ್ಲಿ
  rationale: ಮಾನವರನ್ನು ಸೂಚಿಸುವ ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟಿನ ರೂಪಕಟ್ಟನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನ
  rationale: βαπτιστής ಎಂಬ ಕಾರ್ಯನಾಮವನ್ನು ಕನ್ನಡದ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಪ್ರಯೋಗದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ δὲ μικρότερος
  choice: ಆದರೂ ... ಅತಿ ಚಿಕ್ಕವನು
  rationale: ಹೋಲಿಕೆಯ ರೂಪದಲ್ಲಿರುವ μικρότερος ಇಲ್ಲಿ ಸ್ಥಾನಮಾನದಲ್ಲಿ ಅತ್ಯಲ್ಪನನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಕನ್ನಡದ ಸಹಜ ಪರಮಾವಧಿ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ; ಪರ್ಯಾಯವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ
  rationale: ಮತ್ತಾಯನಲ್ಲಿನ ಸ್ಥಿರ ಅಭಿವ್ಯಕ್ತಿಗೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ, ಸಂಕ್ಷಿಪ್ತ ಸಮಾನಾರ್ಥಕ.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ಅವನಿಗಿಂತ ದೊಡ್ಡವನಾಗಿದ್ದಾನೆ
  rationale: ಮೂಲದ ನೇರ ಹೋಲಿಕೆಯನ್ನು ಮತ್ತು ವರ್ತಮಾನ ಸ್ಥಿತಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೋಹಾನನ ಮಹತ್ವ ಮತ್ತು ಪರಲೋಕರಾಜ್ಯದ ಅತಿ ಚಿಕ್ಕವನ ನಡುವಿನ ಸಂಬಂಧ
  choice: ಹೋಲಿಕೆಯನ್ನು ವಿವರಣೆಯಿಲ್ಲದೆ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದು ಒಡಂಬಡಿಕೆಯ ಯುಗ, ರಕ್ಷಣಾ ಇತಿಹಾಸದಲ್ಲಿನ ಸ್ಥಾನಮಾನ, ಅಥವಾ ಶಿಷ್ಯರಿಗೆ ದೊರೆತ ಸೌಲಭ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂದು ವಿವರಿಸುವುದು.
  rationale: ವಾಕ್ಯವೇ ಈ ವಿರೋಧಾಭಾಸದ ತಾತ್ತ್ವಿಕ ಕಾರಣವನ್ನು ತಿಳಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ಅದರ ಒತ್ತಡ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅನುವಾದದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ‘ಸ್ತ್ರೀಯರಲ್ಲಿ ಹುಟ್ಟಿದವರು’ ಎಂಬ ಶಾಸ್ತ್ರೀಯ ನುಡಿಗಟ್ಟನ್ನು ಉಳಿಸಲಾಗಿದೆ; ತಾತ್ತ್ವಿಕ ವಿರೋಧಾಭಾಸವನ್ನು ವಿವರಿಸಿ ಪರಿಹರಿಸಲಾಗಿಲ್ಲ.
