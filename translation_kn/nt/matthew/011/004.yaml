id: MAT.11.4
reference: Matthew 11:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: kn
  text: 'ಯೇಸು ಅವರಿಗೆ ಉತ್ತರಿಸಿ ಹೇಳಿದರು: “ನೀವು ಹೋಗಿ, ನೀವು ಕೇಳುವುದನ್ನೂ ನೋಡುವುದನ್ನೂ ಯೋಹಾನನಿಗೆ ತಿಳಿಸಿ:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: '[ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ]'
  rationale: ಆರಂಭದ καί ಹಿಂದಿನ ವಾಕ್ಯದೊಂದಿಗೆ ಕಥನವನ್ನು ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಇಲ್ಲಿ ‘ಆಗ’ ಎಂದು ಸೇರಿಸಿದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ಕಾಲಸೂಚನೆ ಬರುತ್ತದೆ; ಪ್ರತ್ಯೇಕ ‘ಮತ್ತು’ ಸಹ ಅಸಹಜವಾಗುತ್ತದೆ. ಆದ್ದರಿಂದ ನಿರಂತರತೆಯನ್ನು ವಾಕ್ಯಕ್ರಮವೇ ಸೂಚಿಸುವಂತೆ ಬಿಡಲಾಗಿದೆ.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: ಅವರಿಗೆ ಉತ್ತರವಾಗಿ
  rationale: ಈ ಗ್ರೀಕ್ ಕಥನಪ್ರಯೋಗವನ್ನು ಪದಶಃ ‘ಉತ್ತರಿಸಿ ಅವರಿಗೆ ಹೇಳಿದರು’ ಎಂದು ಪುನರುಕ್ತಿಗೊಳಿಸದೆ, ಮಾತಿನ ಪರಿಚಯವನ್ನು ಉದ್ಧರಣಚಿಹ್ನೆ ಮತ್ತು ‘ಉತ್ತರವಾಗಿ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ. ‘ಅವರಿಗೆ’ αὐτοῖς ಅನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ Ἰησοῦς
  choice: ಯೇಸು
  rationale: ವ್ಯಕ್ತಿನಾಮದ ಮುಂಚಿನ ಗ್ರೀಕ್ ನಿರ್ದಿಷ್ಟ ಲೇಖನವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
- source_word: Πορευθέντες
  choice: ನೀವು ಹೋಗಿ
  rationale: ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯಾಪದದೊಡನೆ ಬಂದ attendant participle ಕ್ರಮಬದ್ಧ ಆಜ್ಞೆಯ ಬಲ ಹೊಂದಿದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಹೋಗಿ ... ತಿಳಿಸಿ’ ಸಹಜವಾಗಿದೆ. ಕರ್ತೃವನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸಲು ‘ನೀವು’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: ἀπαγγείλατε
  choice: ತಿಳಿಸಿ
  rationale: ಕಂಡು ಕೇಳಿದ ಸಂಗತಿಯನ್ನು ಯೋಹಾನನ ಬಳಿಗೆ ಹಿಂದಿರುಗಿ ವರದಿ ಮಾಡುವ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾದ ‘ತಿಳಿಸಿ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Ἰωάννῃ
  choice: ಯೋಹಾನನಿಗೆ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ಕನ್ನಡದ ‘-ಗೆ’ ವಿಭಕ್ತಿಯಿಂದ ಸಹಜವಾಗಿ ನೀಡಲಾಗಿದೆ; ಹೆಸರನ್ನು ಸ್ಥಾಪಿತ ಕನ್ನಡ ಬೈಬಲ್ ರೂಪದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: ἃ
  choice: -ುವುದನ್ನು
  rationale: ನಪುಂಸಕ ಬಹುವಚನ ಸಂಬಂಧವಾಚಕದ ವಿಷಯಾರ್ಥವನ್ನು ಜೋಡಿ ಕ್ರಿಯಾನಾಮಗಳಾದ ‘ಕೇಳುತ್ತಿರುವುದನ್ನೂ ನೋಡುತ್ತಿರುವುದನ್ನೂ’ ಮೂಲಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἀκούετε
  choice: ಕೇಳುತ್ತಿರುವುದನ್ನು
  rationale: ವರ್ತಮಾನಕಾಲವು ಅವರ ಪ್ರಸ್ತುತ ಅನುಭವವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕೇಳುತ್ತಿರುವುದು’ ಆ ನಡೆಯುತ್ತಿರುವ ಅನುಭವವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ βλέπετε
  choice: ನೋಡುತ್ತಿರುವುದನ್ನೂ
  rationale: ಎರಡು ಸಮಾನ ಅನುಭವಗಳನ್ನು ಕನ್ನಡದ ‘-ನ್ನೂ ... -ನ್ನೂ’ ಜೋಡಣೆಯಿಂದ ಸಂಪರ್ಕಿಸಿ, ವರ್ತಮಾನಕಾಲದ ನಡೆಯುತ್ತಿರುವ ವೀಕ್ಷಣೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν ಎಂಬ ಕಥನ ಸೂತ್ರದ ಅನುವಾದ
  choice: ಯೇಸು ಅವರಿಗೆ ಉತ್ತರವಾಗಿ
  alternative: ಯೇಸು ಉತ್ತರಿಸಿ ಅವರಿಗೆ ಹೇಳಿದರು
  rationale: ಇದು ತಾತ್ವಿಕ ನಿರ್ಣಯವಲ್ಲ, ಶೈಲಿಗತ ಅನುವಾದ ನಿರ್ಣಯ. ಕನ್ನಡದಲ್ಲಿ ಪದಶಃ ಪೂರ್ಣ ಸೂತ್ರವು ಪುನರುಕ್ತಿಯಂತೆ ಕೇಳುತ್ತದೆ; ಆಯ್ದ ರೂಪವು ಉತ್ತರದ ಸಂವಾದಾತ್ಮಕ ಕಾರ್ಯವನ್ನೂ ಮಾತಿನ ಪರಿಚಯವನ್ನೂ ಕಳೆದುಕೊಳ್ಳದೆ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ವಾಕ್ಯವು ಮುಂದಿನ ವಚನದ ಪಟ್ಟಿಯನ್ನು ಪರಿಚಯಿಸುವುದರಿಂದ ಕೊನೆಯಲ್ಲಿ ದ್ವಿಬಿಂದು ಉಳಿಸಲಾಗಿದೆ. ಅಗತ್ಯವಿಲ್ಲದ ಕಾರಣ ಪಾದಟಿಪ್ಪಣಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
