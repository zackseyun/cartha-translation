id: MAT.11.18
reference: Matthew 11:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಯೋಹಾನನು ತಿನ್ನದೆಯೂ ಕುಡಿಯದೆಯೂ ಬಂದನು; ಅವರು, “ಅವನಿಗೆ ದೆವ್ವವಿದೆ[a]” ಎನ್ನುತ್ತಾರೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅವನು ದೆವ್ವವನ್ನು ಹೊಂದಿದ್ದಾನೆ.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ, “ಅವನು ಒಂದು ದೆವ್ವವನ್ನು ಹೊಂದಿದ್ದಾನೆ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: ಬಂದನು
  rationale: ἔρχομαι ಎಂಬ ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲರೂಪವು ಇಲ್ಲಿ ಯೋಹಾನನು ಜನರ ನಡುವೆ ಬಂದು ಸೇವೆ ಆರಂಭಿಸಿದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಬಂದನು’ ಸಹಜವಾಗಿಯೂ ಮೂಲಕ್ಕೆ ಸಮೀಪವಾಗಿಯೂ ಇದೆ.
- source_word: γὰρ
  choice: ಆದ್ದರಿಂದ
  rationale: γάρ ಹಿಂದಿನ ಹೇಳಿಕೆಗೆ ವಿವರಣೆ ಅಥವಾ ಕಾರಣವನ್ನು ನೀಡುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯದ ಮಧ್ಯಭಾಗದಲ್ಲಿರುವ ‘ಆದ್ದರಿಂದ’ ಈ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ἰωάννης
  choice: ಯೋಹಾನನು
  rationale: Ἰωάννης ಎಂಬ ಹೆಸರಿನ ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಿರವಾದ ಬೈಬಲ್ ರೂಪ; ಸಂದರ್ಭದಿಂದ ಇದು ದೀಕ್ಷಾಸ್ನಾನಿಕ ಯೋಹಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: ತಿನ್ನದೆಯೂ ಕುಡಿಯದೆಯೂ
  rationale: μήτε...μήτε ಎಂಬ ಜೋಡಿ ನಿರಾಕರಣೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಮೂಲದಲ್ಲಿ ರೊಟ್ಟಿ ಅಥವಾ ದ್ರಾಕ್ಷಾರಸ ಎಂಬ ನಿರ್ದಿಷ್ಟ ಪದಗಳಿಲ್ಲದ ಕಾರಣ ಅವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ; ಇದು ಯೋಹಾನನ ತಪಸ್ವಿ ಜೀವನಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: καὶ λέγουσιν
  choice: ಅವರು ... ಎನ್ನುತ್ತಾರೆ
  rationale: ವರ್ತಮಾನಕಾಲದ λέγουσιν ಆರೋಪವನ್ನು ಜೀವಂತವಾಗಿ ಮತ್ತು ಸಾಮಾನ್ಯೀಕರಿಸಿ ಹೇಳುತ್ತದೆ. ಕರ್ತೃವನ್ನು ಹೆಚ್ಚಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ‘ಅವರು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: Δαιμόνιον ἔχει
  choice: ಅವನಿಗೆ ದೆವ್ವ ಹಿಡಿದಿದೆ
  rationale: ಗ್ರೀಕ್ ಪದಶಃ ‘ಅವನು ದೆವ್ವವನ್ನು ಹೊಂದಿದ್ದಾನೆ’ ಎಂದಾದರೂ ಅದು ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜ. ‘ದೆವ್ವ ಹಿಡಿದಿದೆ’ ಮೂಲದ ರೂಢಿಪ್ರಯೋಗದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ ಮತ್ತು δαιμόνιον ಅನ್ನು διάβολος ಎಂಬ ‘ಸೈತಾನ’ನೊಂದಿಗೆ ಗೊಂದಲಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: δαιμόνιον ἔχει ಎಂಬ ಆರೋಪದ ನಿರೂಪಣೆ
  choice: ಅವನಿಗೆ ದೆವ್ವ ಹಿಡಿದಿದೆ
  alternative: ಅವನಲ್ಲಿ ದೆವ್ವವಿದೆ
  rationale: ಇದು ಯೋಹಾನನ ಕುರಿತು ವಿರೋಧಿಗಳು ಮಾಡಿದ ಆರೋಪವೇ ಹೊರತು ನಿರೂಪಕನ ದೃಢೀಕರಣವಲ್ಲ ಎಂಬುದು ಉದ್ಧರಣದಿಂದ ಸ್ಪಷ್ಟ. ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ಸಹಜ ಕನ್ನಡದ ರೂಢಿಪ್ರಯೋಗವನ್ನು ಬಳಸಿದ್ದು, ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ‘ತಿನ್ನದೆಯೂ ಕುಡಿಯದೆಯೂ’ ಎಂಬ ಸಂಕ್ಷಿಪ್ತ ಜೋಡಿ ಮೂಲದ ತಪಸ್ವಿ ಅರ್ಥವನ್ನು ವಿವರಿಸದೆ ಉಳಿಸುತ್ತದೆ. ಆರೋಪವನ್ನು ನೇರ ಉದ್ಧರಣವಾಗಿ ನೀಡಲಾಗಿದೆ.
