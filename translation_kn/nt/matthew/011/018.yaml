revisions:
- from: ಯೋಹಾನನು ತಿನ್ನದೆಯೂ ಕುಡಿಯದೆಯೂ ಬಂದನು; ಆದ್ದರಿಂದ ಅವರು, “ಅವನಿಗೆ ದೆವ್ವ ಹಿಡಿದಿದೆ[a]” ಎನ್ನುತ್ತಾರೆ.
  to: ಏಕೆಂದರೆ ಯೋಹಾನನು ತಿನ್ನದೆಯೂ ಕುಡಿಯದೆಯೂ ಬಂದನು; ಅವರು, “ಅವನಿಗೆ ದೆವ್ವವಿದೆ[a]” ಎನ್ನುತ್ತಾರೆ.
  rationale: The revision restores γάρ’s explanatory force with ‘ಏಕೆಂದರೆ’ and renders the accusation with ‘ಅವನಿಗೆ ದೆವ್ವವಿದೆ,’ a natural Kannada equivalent that stays closer to the Greek idiom without asserting the more specific possession sense. The footnote supplies a more formally literal alternative.
