id: MAT.11.19
reference: Matthew 11:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: kn
  text: ಮನುಷ್ಯಕುಮಾರನು ತಿನ್ನುತ್ತಾ ಕುಡಿಯುತ್ತಾ ಬಂದನು; ಮತ್ತು ಅವರು, ‘ನೋಡಿ, ಇವನು ಹೊಟ್ಟೆಬಾಕ ಮತ್ತು ಕುಡುಕ, ಸುಂಕವಸೂಲಿಗಾರರ ಮತ್ತು ಪಾಪಿಗಳ ಸ್ನೇಹಿತ!’ ಎನ್ನುತ್ತಾರೆ. ಜ್ಞಾನವು ತನ್ನ ಕೃತ್ಯಗಳಿಂದ ಸರಿ ಎಂದು ಸಾಬೀತಾಯಿತು.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಜ್ಞಾನವು ತನ್ನ ಕೃತ್ಯಗಳಿಂದ ಸರಿ ಎಂದು ತೋರಿಸಲ್ಪಟ್ಟಿತು.’
    reason: lexical_alternative
  - marker: b
    text: 'ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ ‘ಕೃತ್ಯಗಳು’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ಮಕ್ಕಳು’ ಎಂದಿದೆ: ‘ಜ್ಞಾನವು ತನ್ನ ಮಕ್ಕಳಿಂದ ಸರಿ ಎಂದು ಸಾಬೀತಾಯಿತು.’'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಯೇಸುವಿನ ಸ್ವಯಂಸೂಚಕ ಬಿರುದಿಗೆ ಕನ್ನಡ ಸತ್ಯವೇದ ಪರಂಪರೆಯಲ್ಲಿ ಸ್ಥಿರವಾಗಿರುವ ರೂಪ; ಅದರ ಸೆಮಿಟಿಕ್ ಹಿನ್ನೆಲೆ ಮತ್ತು ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಪ್ರತಿಧ್ವನಿಗಳನ್ನು ವ್ಯಾಖ್ಯಾನಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐσθίων καὶ πίνων
  choice: ತಿನ್ನುತ್ತಾ ಕುಡಿಯುತ್ತಾ
  rationale: ಸಂದರ್ಭದಲ್ಲಿನ ಯೋಹಾನನ ತಪಸ್ವೀ ಜೀವನಶೈಲಿಗೆ ವಿರುದ್ಧವಾದ ಸಾಮಾನ್ಯ ಚಟುವಟಿಕೆಯನ್ನು ನೇರವಾಗಿ ಹೇಳುತ್ತದೆ; ‘ಔತಣಮಾಡುತ್ತಾ’ ಎಂಬ ಅತಿರೇಕವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: Ἰδοὺ
  choice: ನೋಡಿ
  rationale: ಸಾರ್ವಜನಿಕ ಆರೋಪದ ಉದ್ಗಾರಬಲವನ್ನು ಉಳಿಸುವ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: φάγος
  choice: ಹೊಟ್ಟೆಬಾಕ
  rationale: ಅತಿಯಾಗಿ ತಿನ್ನುವವನ ಕುರಿತು ಬಳಸಿದ ನಿಂದಾತ್ಮಕ ನಾಮಪದದ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹಿಡಿದಿಡುತ್ತದೆ.
- source_word: οἰνοπότης
  choice: ಕುಡುಕ
  rationale: ಇದು ತಟಸ್ಥವಾಗಿ ಮದ್ಯ ಕುಡಿಯುವವನನ್ನು ಸೂಚಿಸದೆ, ಅತಿಯಾದ ಕುಡಿಯುವಿಕೆಯ ಆರೋಪವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: ಸುಂಕದವರಿಗೂ ಪಾಪಿಗಳಿಗೂ ಸ್ನೇಹಿತ
  rationale: ಮೂಲದ ಸಂಬಂಧಕಾರಕ ರಚನೆಯನ್ನೂ ಆ ಕಾಲದ ಸಾಮಾಜಿಕ-ಧಾರ್ಮಿಕ ಹಣೆಪಟ್ಟಿಗಳ ಬಲವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐδικαιώθη
  choice: ಸರಿ ಎಂದು ಸಾಬೀತಾಯಿತು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ‘ಸರಿಯೆಂದು ತೋರಿಸಲಾಯಿತು/ಸಮರ್ಥಿಸಲಾಯಿತು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ನೈಸರ್ಗಿಕವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ನ್ಯಾಯೀಕರಣದ ತಾಂತ್ರಿಕ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರದು.
- source_word: ἡ σοφία
  choice: ಜ್ಞಾನವು
  rationale: ಜ್ಞಾನವನ್ನು ಯೇಸು, ದೇವರ ಯೋಜನೆ ಅಥವಾ ಮತ್ತಾವುದೋ ನಿರ್ದಿಷ್ಟ ಅರ್ಥದೊಂದಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಸಮೀಕರಿಸದೆ ಮೂಲದ ವ್ಯಕ್ತೀಕೃತ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: ತನ್ನ ಕೃತ್ಯಗಳಿಂದ
  rationale: SBLGNTಯ ‘ಕೃತ್ಯಗಳು’ ಎಂಬ ಪಾಠವನ್ನು ಅನುಸರಿಸಿ, ಜ್ಞಾನದ ಸತ್ಯತೆ ಅದು ಉಂಟುಮಾಡುವ ಫಲಿತಾಂಶಗಳಿಂದ ಕಾಣುತ್ತದೆ ಎಂಬ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಕೊನೆಯ ವಾಕ್ಯದಲ್ಲಿನ ‘ಜ್ಞಾನ’ದ ಗುರುತು
  choice: ‘ಜ್ಞಾನ’ ಎಂಬ ವ್ಯಕ್ತೀಕೃತ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಗುರುತಿಗೆ ಸೀಮಿತಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಅದು ಯೇಸುವನ್ನೇ ಅಥವಾ ದೇವರ ರಕ್ಷಣಾ ಯೋಜನೆಯನ್ನೇ ಸೂಚಿಸುತ್ತದೆ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಮೂಲಪಠ್ಯವು ಗುರುತನ್ನು ನೇರವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ಅದರ ಸಾಹಿತ್ಯಿಕ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ಕೊನೆಯ ವಾಕ್ಯದ ಪಾಠಭೇದ
  choice: SBLGNTಯ ἔργων (‘ಕೃತ್ಯಗಳು’) ಅನ್ನು ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಅನುಸರಿಸಲಾಗಿದೆ.
  alternative: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳ τέκνων (‘ಮಕ್ಕಳು’) ಎಂಬ ಪಾಠ.
  rationale: ನೀಡಲಾದ ಮೂಲಪಠ್ಯದ ಸಾಕ್ಷ್ಯವನ್ನು ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಅನುಸರಿಸಿ, ಪ್ರಮುಖ ಪಾಠಭೇದವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಆರೋಪಗಳ ನಿಂದಾತ್ಮಕ ಬಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಜ್ಞಾನ’ದ ಅರ್ಥವನ್ನು ಪಂಥೀಯವಾಗಿ ಅಥವಾ ಅತಿವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ನಿರ್ಧರಿಸಲಾಗಿಲ್ಲ. ಎರಡೂ ಅಡಿಕುರಿಪು ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿತ ಅಂತಿಮ ವಾಕ್ಯದ ಬಳಿಕ ನೀಡಲಾಗಿದೆ.
