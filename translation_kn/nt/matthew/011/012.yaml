id: MAT.11.12
reference: Matthew 11:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: kn
  text: ಆದರೆ ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನನ ದಿನಗಳಿಂದ ಈವರೆಗೂ[a], ಪರಲೋಕರಾಜ್ಯವು ಹಿಂಸೆಗೆ ಗುರಿಯಾಗುತ್ತಿದೆ; ಹಿಂಸಕರು ಅದನ್ನು ಕಸಿದುಕೊಳ್ಳುತ್ತಿದ್ದಾರೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪರಲೋಕರಾಜ್ಯವು ಬಲದಿಂದ ಮುನ್ನಡೆಯುತ್ತಿದೆ; ಬಲಪ್ರಯೋಗ ಮಾಡುವವರು ಅದನ್ನು ವಶಪಡಿಸಿಕೊಳ್ಳುತ್ತಾರೆ.” ‘ಹಿಂಸೆಗೆ ಗುರಿಯಾಗುತ್ತಿದೆ’ ಎಂದು ಭಾಷಾಂತರಿಸಿದ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವನ್ನು ಮಧ್ಯಾರ್ಥದಲ್ಲಿಯೂ ಗ್ರಹಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: ಆದರೆ ... ದಿನಗಳಿಂದ
  rationale: ἀπό ಸೂಚಿಸುವ ಆರಂಭಬಿಂದುವನ್ನು ‘ದಿನಗಳಿಂದ’ ಎಂಬುದರಿಂದಲೂ, δέ ಸೂಚಿಸುವ ಸೌಮ್ಯವಾದ ಸಂವಾದ ತಿರುವನ್ನು ‘ಆದರೆ’ ಎಂಬುದರಿಂದಲೂ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನನ ದಿನಗಳಿಂದ
  rationale: ‘ದಿನಗಳು’ ಎಂಬ ಗ್ರೀಕ್ ಕಾಲಸೂಚಕ ನುಡಿಗಟ್ಟನ್ನು ಉಳಿಸಿಕೊಂಡು, ὁ βαπτιστής ಎಂಬ ಬಿರುದನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἕως ἄρτι
  choice: ಇಂದಿನವರೆಗೆ
  rationale: ಯೋಹಾನನ ದಿನಗಳಿಂದ ಯೇಸು ಮಾತನಾಡುತ್ತಿದ್ದ ಪ್ರಸ್ತುತ ಸಮಯದವರೆಗಿನ ನಿರಂತರ ಕಾಲಾವಧಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯ
  rationale: ಮತ್ತಾಯನ ವೈಶಿಷ್ಟ್ಯಪೂರ್ಣ ಪದಪ್ರಯೋಗಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆದ ಸಮಾನಾರ್ಥಕ ಪದ.
- source_word: βιάζεται
  choice: ಹಿಂಸೆಗೆ ಗುರಿಯಾಗುತ್ತಿದೆ
  rationale: ಮಧ್ಯ/ಕರ್ಮಣಿ ರೂಪದ ನಿಜವಾದ ಸಂದಿಗ್ಧತೆಯಲ್ಲಿ ಮುಖ್ಯಪಠ್ಯವು ಕರ್ಮಣಿ ಅರ್ಥವನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತದೆ; ಮುಂದಿನ ‘ಹಿಂಸಕರು’ ಎಂಬ ಪದದೊಡನೆ ಇದು ನೇರವಾಗಿ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ. ಮಧ್ಯಾರ್ಥದ ಓದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: βιασταὶ
  choice: ಹಿಂಸಕರು
  rationale: ಬಲ ಅಥವಾ ಹಿಂಸೆಯನ್ನು ಪ್ರಯೋಗಿಸುವ ವ್ಯಕ್ತಿಗಳನ್ನು ಸೂಚಿಸುವ ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ಕರ್ತೃನಾಮಕ್ಕೆ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: ἁρπάζουσιν αὐτήν
  choice: ಅದನ್ನು ಕಸಿದುಕೊಳ್ಳುತ್ತಿದ್ದಾರೆ
  rationale: ἁρπάζω ಪದದಲ್ಲಿರುವ ಬಲವಂತವಾಗಿ ಹಿಡಿದುಕೊಳ್ಳುವ ಅಥವಾ ಕಿತ್ತುಕೊಳ್ಳುವ ತೀವ್ರತೆಯನ್ನು ‘ಕಸಿದುಕೊಳ್ಳು’ ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪರಲೋಕರಾಜ್ಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ βιάζεται ಪದದ ಅರ್ಥ
  choice: 'ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಕರ್ಮಣಿ ಅರ್ಥ: ‘ಪರಲೋಕರಾಜ್ಯವು ಹಿಂಸೆಗೆ ಗುರಿಯಾಗುತ್ತಿದೆ’'
  alternative: 'ಮಧ್ಯ/ಅಕರ್ಮಕ ಅರ್ಥ: ‘ಪರಲೋಕರಾಜ್ಯವು ಬಲದಿಂದ ಮುನ್ನಡೆಯುತ್ತಿದೆ’'
  rationale: ಗ್ರೀಕ್ ರೂಪವು ಕರ್ಮಣಿ ಹಾಗೂ ಮಧ್ಯ/ಅಕರ್ಮಕ ಅರ್ಥಗಳೆರಡಕ್ಕೂ ಅವಕಾಶ ಕೊಡುತ್ತದೆ. ನಂತರ ಬರುವ ‘ಹಿಂಸಕರು ಅದನ್ನು ಕಸಿದುಕೊಳ್ಳುತ್ತಿದ್ದಾರೆ’ ಎಂಬ ಮಾತಿಗೆ ಕರ್ಮಣಿ ಅರ್ಥ ಚೆನ್ನಾಗಿ ಹೊಂದಿದರೂ, ಬಲದಿಂದ ಮುನ್ನಡೆಯುವ ಅರ್ಥಕ್ಕೂ ಗಣನೀಯ ಭಾಷಾಶಾಸ್ತ್ರೀಯ ಬೆಂಬಲವಿದೆ. ಆದ್ದರಿಂದ ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಒಂದು ಸಮರ್ಥ ಓದನ್ನು ತೆಗೆದುಕೊಂಡು ಮತ್ತೊಂದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ಪಠ್ಯದ ‘ದಿನಗಳು’ ಎಂಬ ನುಡಿಗಟ್ಟನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಮುಖ್ಯಪಠ್ಯದ ಗಂಭೀರ ಹಿಂಸಾತ್ಮಕ ಧ್ವನಿಯನ್ನು ‘ಹಿಂಸೆಗೆ ಗುರಿಯಾಗುತ್ತಿದೆ,’ ‘ಹಿಂಸಕರು,’ ಮತ್ತು ‘ಕಸಿದುಕೊಳ್ಳುತ್ತಿದ್ದಾರೆ’ ಎಂಬ ಪರಸ್ಪರ ಸಂಬಂಧಿತ ಪದಗಳಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
