source:
  edition: SBLGNT
  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: kn
  text: ಮತ್ತು ನೀವು ಇದನ್ನು ಸ್ವೀಕರಿಸಲು ಸಿದ್ಧರಾಗಿದ್ದರೆ,[a] ಇವನೇ ಬರಲಿರುವ ಎಲೀಯನು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನೀವು ಇದನ್ನು ಒಪ್ಪಿಕೊಳ್ಳಲು ಸಿದ್ಧರಾಗಿದ್ದರೆ.’
    reason: lexical_alternative
  - marker: b
    text: ಅಂದರೆ, ಸ್ನಾನಿಕನಾದ ಯೋಹಾನನನ್ನು ಬರಲಿರುವ ಎಲೀಯನೆಂದು ಇಲ್ಲಿ ಗುರುತಿಸಲಾಗಿದೆ; ಮಲಾಕಿ 4:5 ಮತ್ತು ಮತ್ತಾಯ 17:10–13 ಹೋಲಿಸಿ.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ θέλετε δέξασθαι
  choice: ನೀವು ಇದನ್ನು ಸ್ವೀಕರಿಸಲು ಮನಸ್ಸಿದ್ದರೆ
  rationale: θέλετε ಎಂಬುದು ಕೇವಲ ಆಸೆಯನ್ನಲ್ಲ, ಸ್ವೀಕರಿಸುವ ಮನಸ್ಸು ಅಥವಾ ಸಮ್ಮತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. δέξασθαιಗೆ ‘ಸ್ವೀಕರಿಸಲು’ ನೇರವೂ ಸಹಜವೂ ಆದ ಸಮಾನಾರ್ಥಕ; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಹೇಳದಿರುವ ಕರ್ಮಪದವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥಸ್ಪಷ್ಟತೆಗಾಗಿ ‘ಇದನ್ನು’ ಎಂದು ಪೂರೈಸಲಾಗಿದೆ.
- source_word: αὐτός
  choice: ಇವನೇ
  rationale: ಈ ಸರ್ವನಾಮವು ಸ್ನಾನಿಕನಾದ ಯೋಹಾನನನ್ನು ಹಿಂದಿರುಗಿ ಸೂಚಿಸುತ್ತದೆ. ‘ಇವನೇ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಲ್ಲೇಖವನ್ನೂ ಗ್ರೀಕ್‌ನ ಸಾಧ್ಯ ಒತ್ತನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐστιν Ἠλίας
  choice: ಎಲೀಯನು
  rationale: Ἠλίας ಎಂಬ ಹೆಸರನ್ನು ಕನ್ನಡದ ಸ್ಥಾಪಿತ ಬೈಬಲ್ ರೂಪವಾದ ‘ಎಲೀಯ’ ಎಂದು ನೀಡಲಾಗಿದೆ. ‘ಇವನೇ’ ಜೊತೆಗೆ ಇದು ಗ್ರೀಕ್‌ನ ನೇರ ಗುರುತಿಸುವಿಕೆಯನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: ಬರಲಿರುವ
  rationale: ಈ ಪದಗುಚ್ಛವು ನಿರೀಕ್ಷಿಸಲ್ಪಟ್ಟ ಭವಿಷ್ಯದ ಆಗಮನವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಬರಲಿರುವ’ ಎಂಬುದು ಪ್ರವಾದನಾತ್ಮಕ ನಿರೀಕ್ಷೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ತಕ್ಷಣವೇ ಬರಲಿದ್ದನು ಎಂಬ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯದ ಸರಳ ಸಂಪರ್ಕವನ್ನು ಅತಿಯಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಸ್ನಾನಿಕನಾದ ಯೋಹಾನನನ್ನು ಎಲೀಯನೆಂದು ಗುರುತಿಸುವುದು
  choice: ‘ಬರಲಿರುವ ಎಲೀಯನು ಇವನೇ’ ಎಂದು ಹೇಳಿಕೆಯನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಿ, ‘ನೀವು ಇದನ್ನು ಸ್ವೀಕರಿಸಲು ಮನಸ್ಸಿದ್ದರೆ’ ಎಂಬ ಷರತ್ತನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಇವನು ಎಲೀಯನ ಪಾತ್ರವನ್ನು ನೆರವೇರಿಸುತ್ತಾನೆ’ ಅಥವಾ ‘ಇವನು ಎಲೀಯನಂತಿದ್ದಾನೆ’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು αὐτός ἐστιν Ἠλίας ಎಂದು ನೇರವಾಗಿ ಗುರುತಿಸುತ್ತದೆ; ಆದರೆ ಕೇಳುವವರು ಅದನ್ನು ಸ್ವೀಕರಿಸುವುದರ ಕುರಿತು ಷರತ್ತಿನ ಮಾತನ್ನೂ ಸೇರಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಅದನ್ನು ಕೇವಲ ಹೋಲಿಕೆ ಅಥವಾ ಪಾತ್ರವೆಂದು ಮೃದುಗೊಳಿಸದೆ, ಪ್ರವಾದನೆಯೊಂದಿಗೆ ಅದರ ಸಂಬಂಧವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ವಿವರಿಸಿ ತೀರ್ಮಾನಿಸದೆ, ಪಠ್ಯದ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಓದಿಗೆ ಸೂಕ್ತವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇವನೇ’ ಗುರುತಿಸುವಿಕೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಬರಲಿರುವ’ ಪ್ರವಾದನಾತ್ಮಕ ನಿರೀಕ್ಷೆಯನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
