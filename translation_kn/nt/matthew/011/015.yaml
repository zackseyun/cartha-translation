id: MAT.11.15
reference: Matthew 11:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: kn
  text: ಕಿವಿಗಳಿರುವವನು ಕೇಳಲಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಯಾರಿಗೆ ಕಿವಿಗಳಿವೆಯೋ ಅವರು ಕೇಳಲಿ.” ಗ್ರೀಕ್ ಭಾಷೆಯಲ್ಲಿ ಏಕವಚನದ ಸಾಮಾನ್ಯ ಅಭಿವ್ಯಕ್ತಿ ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ಇರುವವನು
  rationale: ನಾಮಪದದಂತೆ ಕಾರ್ಯನಿರ್ವಹಿಸುವ ನಿರ್ದಿಷ್ಟ ಉಪಪದಸಹಿತ ವರ್ತಮಾನ ಕೃದಂತವು, ಈ ಗುಣವಿರುವ ಯಾವುದೇ ವ್ಯಕ್ತಿಯನ್ನು ಏಕವಚನದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಕಿವಿಗಳಿರುವವನು’ ಎಂಬುದು ಈ ಏಕವಚನ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὦτα
  choice: ಕಿವಿಗಳು
  rationale: ಗ್ರೀಕ್ ಪದವು ಬಹುವಚನದಲ್ಲಿದೆ. ‘ಕಿವಿಗಳು’ ರೂಪಾತ್ಮಕ ನಿಖರತೆಯನ್ನೂ ಗಮನವಿಟ್ಟು ಗ್ರಹಿಸಬೇಕೆಂಬ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀκουέτω
  choice: ಕೇಳಲಿ
  rationale: ಮೂರನೇ ಪುರುಷ ಏಕವಚನ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥವನ್ನು ‘ಕೇಳಲಿ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ಇದು ಕೇವಲ ಧ್ವನಿ ಕೇಳುವುದಷ್ಟೇ ಅಲ್ಲದೆ, ಗಮನಕೊಟ್ಟು ಗ್ರಹಿಸುವ ಅಥವಾ ಕಿವಿಗೊಡುವ ಸಾಧ್ಯ ಅರ್ಥವನ್ನೂ ತೆರೆದಿಡುತ್ತದೆ.
theological_decisions:
- issue: ಏಕವಚನದ ಸಾಮಾನ್ಯ ಪುಲ್ಲಿಂಗ ಅಭಿವ್ಯಕ್ತಿ
  choice: ಕಿವಿಗಳಿರುವವನು ಕೇಳಲಿ.
  alternative: ಯಾರಿಗೆ ಕಿವಿಗಳಿವೆಯೋ ಅವರು ಕೇಳಲಿ.
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಸಾಮಾನ್ಯ ರಚನೆಯಿದೆ. ‘ಇರುವವನು ... ಕೇಳಲಿ’ ಅದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತಲೇ, ಅರ್ಥದಲ್ಲಿ ಯಾವುದೇ ವ್ಯಕ್ತಿಗೆ ಅನ್ವಯಿಸುವ ಕರೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ, ಘನತೆಯುಳ್ಳ, ಶಾಸ್ತ್ರೀಯ ಆಜ್ಞಾರ್ಥ ಶೈಲಿ. ‘ಕೇಳಲಿ’ ಎಂಬುದು ಮೂಲದಲ್ಲಿರುವ ‘ಕೇಳುವುದು/ಕಿವಿಗೊಡುವುದು’ ನಡುವಿನ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
