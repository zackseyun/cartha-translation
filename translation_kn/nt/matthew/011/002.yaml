id: MAT.11.2
reference: Matthew 11:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: kn
  text: ಯೋಹಾನನು ಸೆರೆಮನೆಯಲ್ಲಿ ಮೆಸ್ಸೀಯನ[a] ಕಾರ್ಯಗಳ ಕುರಿತು ಕೇಳಿ, ತನ್ನ ಶಿಷ್ಯರ ಮೂಲಕ ಸಂದೇಶ ಕಳುಹಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಕ್ರಿಸ್ತನ.”
    reason: Χριστός ಎಂಬ ಬಿರುದಿಗೆ ಸಾಂಪ್ರದಾಯಿಕ ಪರ್ಯಾಯ ನಿರೂಪಣೆಯನ್ನು ನೀಡುತ್ತದೆ.
lexical_decisions:
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಇದು ಇಲ್ಲಿ ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುವ ಮೃದು ಸಂಪರ್ಕಕ; ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯದ ಸಹಜ ಮುಂದುವರಿಕೆಯೇ ಅದರ ಕಾರ್ಯವನ್ನು ಹೊರುತ್ತದೆ. ಸ್ಪಷ್ಟ ಕಾಲಸೂಚಕ ಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἀκούσας
  choice: ಕೇಳಿ
  rationale: ಅಓರಿಸ್ಟ್ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ‘ಕೇಳಿ’ ಎಂಬ ಕೃದಂತರೂಪವು ಅದನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: ಸೆರೆಮನೆಯಲ್ಲಿ
  rationale: ಸ್ಥಳಾರ್ಥವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὰ ἔργα
  choice: ಕಾರ್ಯಗಳು
  rationale: ἔργα ಎಂಬ ಪದದ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಮೆಸ್ಸೀಯನ ಅದ್ಭುತಗಳು ಮತ್ತು ಸೇವಾಕಾರ್ಯಗಳೆರಡನ್ನೂ ಒಳಗೊಳ್ಳಲು ಅವಕಾಶ ನೀಡುತ್ತದೆ.
- source_word: τοῦ χριστοῦ
  choice: ಮೆಸ್ಸೀಯನ
  rationale: χριστός ಇಲ್ಲಿ ವ್ಯಕ್ತಿನಾಮಕ್ಕಿಂತ ಅಭಿಷಿಕ್ತನ ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ; ‘ಮೆಸ್ಸೀಯ’ ಅದರ ಯೆಹೂದ್ಯ ಹಿನ್ನೆಲೆ ಮತ್ತು ಬಿರುದಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πέμψας
  choice: ಸಂದೇಶ ಕಳುಹಿಸಿದನು
  rationale: ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿ ಕಳುಹಿಸಲಾದ ವಿಷಯವು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಲ್ಪಟ್ಟಿಲ್ಲ; ಮುಂದಿನ ವಚನದ ಪ್ರಶ್ನೆಯನ್ನು ಗಮನಿಸಿ ಕನ್ನಡದಲ್ಲಿ ಕ್ರಿಯೆಯ ಸಂವಹನಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: ತನ್ನ ಶಿಷ್ಯರ ಮೂಲಕ
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮಧ್ಯಸ್ಥಿಕೆ ಅಥವಾ ಸಾಧನಾರ್ಥವನ್ನು ‘ಮೂಲಕ’ ನಿಖರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ತನ್ನ’ ಎಂಬುದು ಕರ್ತೃ ಯೋಹಾನನೇ ಎಂಬುದನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: Χριστός ಪದದ ನಿರೂಪಣೆ
  choice: ಮೆಸ್ಸೀಯ
  alternative: ಕ್ರಿಸ್ತ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಯೇಸುವಿನ ಮೆಸ್ಸೀಯ ಬಿರುದು ಮತ್ತು ಅದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಕಾರ್ಯಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸಾಂಪ್ರದಾಯಿಕ ‘ಕ್ರಿಸ್ತ’ ರೂಪವನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ಪರ್ಯಾಯವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ಮೂಲದ ಕೃದಂತ ರಚನೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ‘ಕೇಳಿ’ ರೂಪದಿಂದ ಉಳಿಸಲಾಗಿದೆ; δὲಗಾಗಿ ಅನಗತ್ಯವಾದ ‘ಈಗ’ ಅಥವಾ ‘ಆಗ’ ಸೇರಿಸಲಾಗಿಲ್ಲ.
