revisions:
- from: ಎಲ್ಲವೂ ನನ್ನ ತಂದೆಯಿಂದ ನನಗೆ ಒಪ್ಪಿಸಲ್ಪಟ್ಟಿದೆ. ತಂದೆಯ ಹೊರತು ಬೇರೆ ಯಾರೂ ಮಗನನ್ನು ನಿಜವಾಗಿ ಅರಿಯುವುದಿಲ್ಲ; ಹಾಗೆಯೇ ಮಗನ ಹೊರತು ಮತ್ತು ಮಗನು ಯಾರಿಗೆ ತಂದೆಯನ್ನು ಪ್ರಕಟಿಸಲು ಬಯಸುತ್ತಾನೋ ಅವರ ಹೊರತು ಬೇರೆ ಯಾರೂ ತಂದೆಯನ್ನು ನಿಜವಾಗಿ ಅರಿಯುವುದಿಲ್ಲ.[a]
  to: ಎಲ್ಲವೂ ನನ್ನ ತಂದೆಯಿಂದ ನನಗೆ ಒಪ್ಪಿಸಲ್ಪಟ್ಟಿವೆ; ತಂದೆಯ ಹೊರತು ಯಾರೂ ಮಗನನ್ನು ಅರಿಯುವುದಿಲ್ಲ. ಹಾಗೆಯೇ, ಮಗನಿಗೂ ಮಗನು ತಂದೆಯನ್ನು ಬಹಿರಂಗಪಡಿಸಲು ಬಯಸುವ ಯಾರಿಗಾದರೂ ಹೊರತು, ಯಾರೂ ತಂದೆಯನ್ನು ಅರಿಯುವುದಿಲ್ಲ.[a]
  rationale: The revision removes the potentially misleading adverb ‘ನಿಜವಾಗಿ,’ recasts the final exception clause into natural modern Kannada, and uses ‘ಬಹಿರಂಗಪಡಿಸಲು’ for revelation. It retains the broad ‘ಎಲ್ಲವೂ,’ the completed passive transfer, the Father–Son titles, and the Son’s volitional act of revealing the Father. The footnote preserves the possible fuller force of ἐπιγινώσκω without overstating it in the main text.
