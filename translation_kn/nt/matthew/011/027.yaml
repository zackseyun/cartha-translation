id: MAT.11.27
reference: Matthew 11:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: kn
  text: ಎಲ್ಲವೂ ನನ್ನ ತಂದೆಯಿಂದ ನನಗೆ ಒಪ್ಪಿಸಲ್ಪಟ್ಟಿವೆ; ತಂದೆಯ ಹೊರತು ಯಾರೂ ಮಗನನ್ನು ಅರಿಯುವುದಿಲ್ಲ. ಹಾಗೆಯೇ, ಮಗನಿಗೂ ಮಗನು ತಂದೆಯನ್ನು ಬಹಿರಂಗಪಡಿಸಲು ಬಯಸುವ ಯಾರಿಗಾದರೂ ಹೊರತು, ಯಾರೂ ತಂದೆಯನ್ನು ಅರಿಯುವುದಿಲ್ಲ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಅರಿಯುವುದಿಲ್ಲ’ ಎಂಬುದಕ್ಕೆ ‘ಸಂಪೂರ್ಣವಾಗಿ ಅರಿಯುವುದಿಲ್ಲ’ ಅಥವಾ ‘ಆಳವಾಗಿ ಅರಿಯುವುದಿಲ್ಲ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಪೂರ್ಣವಾದ ಅಥವಾ ಆಳವಾದ ಅರಿವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: ಎಲ್ಲವೂ
  rationale: ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನವು ಸಮಗ್ರ ವ್ಯಾಪ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಎಲ್ಲವೂ’ ಸಹಜವಾಗಿಯೂ ವ್ಯಾಪಕವಾಗಿಯೂ ಇದೆ.
- source_word: παρεδόθη
  choice: ಒಪ್ಪಿಸಲ್ಪಟ್ಟಿದೆ
  rationale: ಪೂರ್ಣಗೊಂಡ ಹಸ್ತಾಂತರ ಮತ್ತು ಅದರ ಮುಂದುವರಿಯುವ ಫಲಿತಾಂಶವನ್ನು ಸೂಚಿಸುವ ಅಓರಿಸ್ಟ್ ಕರ್ಮಣಿ ರೂಪಕ್ಕೆ ಇದು ನೇರವಾದ, ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ἐπιγινώσκει
  choice: ನಿಜವಾಗಿ ಅರಿಯುವುದಿಲ್ಲ
  rationale: ἐπιγινώσκω ಇಲ್ಲಿ ಕೇವಲ ಪರಿಚಯಕ್ಕಿಂತ ಆಳವಾದ ವೈಯಕ್ತಿಕ ತಿಳಿವಳಿಕೆಯನ್ನು ಸೂಚಿಸಬಹುದು. ‘ನಿಜವಾಗಿ ಅರಿಯುವುದು’ ಆ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಸಂಪೂರ್ಣವಾಗಿ’ ಎಂಬ ಅತಿಸ್ಪಷ್ಟ ತೀವ್ರತೆಯನ್ನು ಪಠ್ಯಕ್ಕೆ ಹೇರದು.
- source_word: εἰ μὴ
  choice: ಹೊರತು
  rationale: ನಕಾರಾತ್ಮಕ ಹೊರತಾಗಿಸುವ ವಾಕ್ಯದಲ್ಲಿ ಇದು ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: ಮಗನು ಯಾರಿಗೆ ತಂದೆಯನ್ನು ಪ್ರಕಟಿಸಲು ಬಯಸುತ್ತಾನೋ ಅವರ ಹೊರತು
  rationale: βούληται ಎಂಬ ಇಚ್ಛಾತ್ಮಕ ಅಂಶವನ್ನೂ, ἀποκαλύψαι ಎಂಬ ಪ್ರಕಟಿಸುವ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಗೊಂದಲ ತಪ್ಪಿಸಲು ಅರ್ಥಗತ ಕರ್ಮವಾದ ‘ತಂದೆಯನ್ನು’ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಲಾಗಿದೆ.
theological_decisions:
- issue: ἐπιγινώσκω ಪದದ ತೀವ್ರತೆ
  choice: ಎರಡೂ ಪರಸ್ಪರ ಅರಿವಿನ ವಾಕ್ಯಗಳಲ್ಲಿ ‘ನಿಜವಾಗಿ ಅರಿಯುವುದು’
  alternative: ‘ಅರಿಯುವುದು’ ಅಥವಾ ‘ಸಂಪೂರ್ಣವಾಗಿ ಅರಿಯುವುದು’
  rationale: ಈ ಪದವು ಆಳವಾದ ಅಥವಾ ಪೂರ್ಣ ಅರಿವನ್ನು ಸೂಚಿಸಬಹುದಾದರೂ, ಪ್ರತಿಯೊಂದು ಬಳಕೆಯಲ್ಲೂ ಸ್ಪಷ್ಟ ತೀವ್ರಕಾರಕವೆಂದು ನಿರ್ಧರಿಸಲಾಗದು. ಆಯ್ದ ರೂಪವು ವಿಶಿಷ್ಟ ಪರಸ್ಪರ ಅರಿವಿನ ಒತ್ತನ್ನು ಉಳಿಸಿ, ಅತಿವ್ಯಾಖ್ಯಾನವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- issue: βούληταιಯಲ್ಲಿರುವ ಮಗನ ಇಚ್ಛಾತ್ಮಕ ಪಾತ್ರ
  choice: ‘ಪ್ರಕಟಿಸಲು ಬಯಸುತ್ತಾನೋ’
  alternative: ‘ಪ್ರಕಟಿಸಲು ಆಯ್ಕೆಮಾಡುತ್ತಾನೋ’ ಅಥವಾ ‘ಪ್ರಕಟಿಸಲು ಇಚ್ಛಿಸುತ್ತಾನೋ’
  rationale: ಇದು ಮಗನ ಪ್ರಕಟಣಾತ್ಮಕ ಮುಂದಾಳತ್ವ ಮತ್ತು ನಿಜವಾದ ಇಚ್ಛೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ನಿರ್ಣಯವನ್ನು ಹೇರದು.
- issue: ἀποκαλύψαιಯ ಅರ್ಥಗತ ಕರ್ಮ
  choice: ‘ತಂದೆಯನ್ನು ಪ್ರಕಟಿಸಲು’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ
  alternative: ‘ಅವನನ್ನು ಪ್ರಕಟಿಸಲು’
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ಮವು ಸಂದರ್ಭದಿಂದ—ತಂದೆಯನ್ನು—ತಿಳಿಯುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಸರ್ವನಾಮದ ಸಂದಿಗ್ಧತೆಯನ್ನು ತಪ್ಪಿಸಲು ನಾಮಪದವನ್ನು ಮರುಹೇಳುವುದು ಅರ್ಥವನ್ನು ಬದಲಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ತಂದೆ–ಮಗ ಎಂಬ ಸಮಾಂತರ ಸಂಬಂಧ ಮತ್ತು ಹೊರತಾಗಿಸುವ ವಾಕ್ಯರಚನೆ ಉಳಿಸಲಾಗಿದೆ. ಎಲ್ಲಾ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
