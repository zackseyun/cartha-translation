- from: ಹೌದು[a], ತಂದೆಯೇ, ಏಕೆಂದರೆ ಹೀಗೆ ಆಗುವುದೇ ನಿಮಗೆ ಮೆಚ್ಚಿಕೆಯಾಗಿತ್ತು.
  to: ಹೌದು[a], ತಂದೆಯೇ, ಏಕೆಂದರೆ ಹೀಗೆ ಆಗಿದ್ದು ನಿಮ್ಮ ದೃಷ್ಟಿಗೆ ಮೆಚ್ಚಿನದ್ದಾಗಿತ್ತು.
  rationale: The revision preserves the Greek causal affirmation and its ambiguity concerning εὐδοκία, while making the completed reference of ἐγένετο and the ‘in your sight’ sense of ἔμπροσθέν σου explicit in natural modern Kannada. The footnote is adjusted to match the revised grammar and to avoid the awkward prospective ‘ಆಗುವುದು’ formulation.
