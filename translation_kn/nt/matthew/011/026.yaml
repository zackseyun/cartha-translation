id: MAT.11.26
reference: Matthew 11:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: kn
  text: ಹೌದು[a], ತಂದೆಯೇ, ಏಕೆಂದರೆ ಹೀಗೆ ಆಗಿದ್ದು ನಿಮ್ಮ ದೃಷ್ಟಿಗೆ ಮೆಚ್ಚಿನದ್ದಾಗಿತ್ತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಿಜವಾಗಿ, ತಂದೆಯೇ; ಏಕೆಂದರೆ ಹೀಗೆ ಆಗಿರುವುದು ನಿಮ್ಮ ಒಳ್ಳೆಯ ಇಚ್ಛೆಯಾಗಿತ್ತು,” ಅಥವಾ “ಏಕೆಂದರೆ ಇದು ನಿಮ್ಮ ದೃಷ್ಟಿಗೆ ಮೆಚ್ಚಿನದ್ದಾಗಿತ್ತು.”
    reason: ναί ಗೆ ‘ನಿಜವಾಗಿ’ ಎಂಬ ಪರ್ಯಾಯವನ್ನೂ, εὐδοκία ἐγένετο ἔμπροσθέν σου ಗೆ ‘ಒಳ್ಳೆಯ ಇಚ್ಛೆ’ ಮತ್ತು ‘ನಿಮ್ಮ ದೃಷ್ಟಿಗೆ ಮೆಚ್ಚಿನದ್ದು’ ಎಂಬ ಸಹಜ ಪರ್ಯಾಯ ಭಾಷಾಂತರಗಳನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: ναί
  choice: ಹೌದು
  rationale: ಪ್ರಾರ್ಥನೆಯ ಸಂದರ್ಭದಲ್ಲಿ ಒಪ್ಪಿಗೆ ಮತ್ತು ದೃಢೀಕರಣವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುವ ನೇರ ಕನ್ನಡ ಪದ.
- source_word: ὁ πατήρ
  choice: ತಂದೆಯೇ
  rationale: ಲೇಖಸಹಿತ ಕರ್ತೃರೂಪವು ಇಲ್ಲಿ ಸಂಬೋಧನೆಯಾಗಿ ಬಳಕೆಯಾಗಿದೆ; ಕನ್ನಡದ ಸಂಬೋಧನಾ ರೂಪ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಮುಂದಿನ ಮಾತು ಹಿಂದಿನ ಒಪ್ಪಿಗೆಯ ಕಾರಣವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಕಾರಣಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὕτως
  choice: ಹೀಗೆ ಆಗುವುದು
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಹೇಳಿದ ಮರೆಮಾಡುವಿಕೆ ಮತ್ತು ಪ್ರಕಟಿಸುವಿಕೆಯ ರೀತಿಯನ್ನು ಹಿಂದಿರುಗಿ ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಕೇವಲ ‘ಹೀಗೆ’ ಎನ್ನುವುದಕ್ಕಿಂತ ಈ ರೂಪ ವಾಕ್ಯವನ್ನು ಪೂರ್ಣ ಮತ್ತು ಸಹಜವಾಗಿಸುತ್ತದೆ.
- source_word: εὐδοκία
  choice: ಮೆಚ್ಚಿಕೆ
  rationale: ದೇವರ ನಿರ್ಣಯ ಅಥವಾ ಪೂರ್ವಯೋಜನೆ ಎಂಬ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಹೇರದೆ, ಇಷ್ಟ ಮತ್ತು ಅನುಮೋದನೆಯ ಮೌಲ್ಯಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐγένετο
  choice: ಆಗುವುದೇ ... ಆಗಿತ್ತು
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ‘ಆಗು/ಉಂಟಾಗು’ ಅಂಶವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἔμπροσθέν σου
  choice: ನಿಮಗೆ
  rationale: ಅಕ್ಷರಶಃ ‘ನಿಮ್ಮ ಮುಂದೆ’ ಎಂಬುದರ ಇಲ್ಲಿ ಉದ್ದೇಶಿತ ಅರ್ಥ ‘ನಿಮ್ಮ ದೃಷ್ಟಿಯಲ್ಲಿ/ನಿಮ್ಮ ಮೆಚ್ಚಿಕೆಗೆ’; ‘ನಿಮಗೆ ಮೆಚ್ಚಿಕೆಯಾಗಿತ್ತು’ ಎಂಬುದು ಆ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹೇಳುತ್ತದೆ.
theological_decisions:
- issue: εὐδοκία ಎಂಬುದು ದೇವರ ನಿರ್ಣಯ/ಉದ್ದೇಶವನ್ನೋ ಅಥವಾ ಆತನ ಮೆಚ್ಚಿಕೆ/ಅನುಮೋದನೆಯನ್ನೋ ಸೂಚಿಸುತ್ತದೆಯೇ
  choice: ‘ಮೆಚ್ಚಿಕೆಯಾಗಿತ್ತು’ ಎಂದು ಭಾಷಾಂತರಿಸಿ ತಂದೆಯ ಇಷ್ಟ ಮತ್ತು ಅನುಮೋದನೆಯನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
  alternative: ‘ನಿಮ್ಮ ಸದುದ್ದೇಶವಾಗಿತ್ತು’ ಅಥವಾ ‘ನಿಮ್ಮ ಒಳ್ಳೆಯ ಇಚ್ಛೆಯಾಗಿತ್ತು’
  rationale: ‘ಸದುದ್ದೇಶ’ ಎಂಬುದು ಮೂಲಪದಕ್ಕಿಂತ ಬಲವಾದ ಯೋಜನೆ ಅಥವಾ ನಿರ್ಣಯದ ಅರ್ಥವನ್ನು ತರಬಹುದು. ‘ಮೆಚ್ಚಿಕೆ’ ಮೂಲದಲ್ಲಿರುವ ದೈವಿಕ ಇಷ್ಟವನ್ನು ಉಳಿಸಿ, providence ಅಥವಾ election ಕುರಿತ ವಿಶಾಲ ತಾತ್ತ್ವಿಕ ಪ್ರಶ್ನೆಯನ್ನು ಈ ವಾಕ್ಯದಲ್ಲೇ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಮತ್ತು ಪ್ರಾರ್ಥನಾ ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ದೇವರನ್ನು ಉದ್ದೇಶಿಸುವಾಗ ‘ನಿಮಗೆ’ ಎಂಬ ಗೌರವಸೂಚಕ ರೂಪ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ಭಾಷೆ ಅತಿಯಾಗಿ ಪುರಾತನವಾಗದಂತೆ ನೋಡಿಕೊಳ್ಳಲಾಗಿದೆ.
