id: MAT.11.28
reference: Matthew 11:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: kn
  text: ಶ್ರಮಪಡುವವರೂ ಹೊರೆಗಳಿಂದ ನಲುಗಿರುವವರೂ ಆದ ಎಲ್ಲರೂ ನನ್ನ ಬಳಿಗೆ ಬನ್ನಿರಿ[a]; ನಾನು ನಿಮಗೆ ವಿಶ್ರಾಂತಿ ಕೊಡುತ್ತೇನೆ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಹೊರೆ ಹೊರಿಸಲ್ಪಟ್ಟವರೂ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್‌ನ ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ಕೃದಂತವು ಹಿಂದೆ ಹೊರೆ ಹೊರಿಸಲ್ಪಟ್ಟದ್ದರ ಪರಿಣಾಮವಾಗಿ ಮುಂದುವರಿಯುವ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ‘ನಾನು ನಿಮ್ಮನ್ನು ಚೈತನ್ಯಗೊಳಿಸುತ್ತೇನೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಇಲ್ಲಿ ಬಳಸಿರುವ ಕ್ರಿಯಾಪದವು ಒಬ್ಬರಿಗೆ ವಿಶ್ರಾಂತಿ ನೀಡುವುದು ಅಥವಾ ಚೈತನ್ಯಗೊಳಿಸುವುದು ಎಂಬ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: ನನ್ನ ಬಳಿಗೆ ಬನ್ನಿರಿ
  rationale: ಆಹ್ವಾನರೂಪದ Δεῦτε ಮತ್ತು ವ್ಯಕ್ತಿಯ ಕಡೆಗೆ ಚಲನೆಯನ್ನು ಸೂಚಿಸುವ πρός με ಎರಡನ್ನೂ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಕನ್ನಡದಲ್ಲಿ ಒಟ್ಟಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πάντες
  choice: ಎಲ್ಲರೂ
  rationale: ಆಹ್ವಾನದ ಸಮಗ್ರ ವ್ಯಾಪ್ತಿಯನ್ನು ಹೆಚ್ಚುವರಿ ಒತ್ತಿಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: οἱ κοπιῶντες
  choice: ದುಡಿದು ದಣಿದವರೂ
  rationale: ಕೊπιάω ಪದದಲ್ಲಿರುವ ಶ್ರಮಿಸುವ ಕ್ರಿಯೆ ಮತ್ತು ಅದರಿಂದ ಉಂಟಾಗುವ ದಣಿವು ಎರಡನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹಿಡಿದಿಡುತ್ತದೆ.
- source_word: πεφορτισμένοι
  choice: ಹೊರೆಹೊತ್ತವರೂ ಆದ
  rationale: ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ಕೃದಂತವು ಹಿಂದೆ ಹೊರೆ ಹೊರಿಸಲ್ಪಟ್ಟು ಈಗಲೂ ಅದರ ಭಾರದಲ್ಲಿರುವ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಆಯ್ಕೆ ಆ ಮುಂದುವರಿಯುವ ಸ್ಥಿತಿಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κἀγὼ
  choice: ನಾನು
  rationale: ಕರ್ತೃವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ‘ಮತ್ತು’ ಸೇರಿಸುವುದು ಅನಗತ್ಯವಾಗಿ ಕೃತಕವಾಗುವುದರಿಂದ ವಿರಾಮಚಿಹ್ನೆಯ ಮೂಲಕ ಸಂಬಂಧವನ್ನು ತೋರಿಸಲಾಗಿದೆ.
- source_word: ἀναπαύσω ὑμᾶς
  choice: ನಾನು ನಿಮಗೆ ವಿಶ್ರಾಂತಿ ಕೊಡುತ್ತೇನೆ
  rationale: ಕಾರಣಾರ್ಥಕ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ ಮತ್ತು ವಿಶ್ರಾಂತಿಯ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ἀναπαύσω ಸೂಚಿಸುವ ವಿಶ್ರಾಂತಿಯ ಸ್ವರೂಪ
  choice: ‘ನಿಮಗೆ ವಿಶ್ರಾಂತಿ ಕೊಡುತ್ತೇನೆ’ ಎಂದು ವಿಶಾಲವಾಗಿ ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
  alternative: ‘ನಿಮಗೆ ಚೈತನ್ಯ ನೀಡುತ್ತೇನೆ’ ಅಥವಾ ‘ನಿಮ್ಮ ಆತ್ಮಗಳಿಗೆ ವಿಶ್ರಾಂತಿ ಕೊಡುತ್ತೇನೆ’
  rationale: ಈ ವಚನದಲ್ಲಿ ವಿಶ್ರಾಂತಿಯು ಆತ್ಮಿಕವೇ, ಭಾವನಾತ್ಮಕವೇ, ದೈಹಿಕವೇ ಅಥವಾ ಅಂತ್ಯಕಾಲೀನವೇ ಎಂದು ಪ್ರತ್ಯೇಕವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ. ಆದ್ದರಿಂದ ಮೂಲದ ವ್ಯಾಪ್ತಿ ಮತ್ತು ಧಾರ್ಮಿಕ ಅರ್ಥತಣತಣಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನತೆಯುಳ್ಳ ಆಹ್ವಾನಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಬನ್ನಿರಿ’ ಗೌರವಪೂರ್ಣ ಬಹುವಚನವಾಗಿದ್ದು πάντες ಎಂಬ ಸಮಗ್ರ ಆಹ್ವಾನಕ್ಕೆ ಹೊಂದುತ್ತದೆ. ಮೂಲದಲ್ಲಿರುವ ಎರಡು ವಿಭಿನ್ನ ಸ್ಥಿತಿಗಳು—ಸಕ್ರಿಯವಾಗಿ ದುಡಿದು ದಣಿಯುವುದು ಮತ್ತು ಹೊರೆ ಹೊರಿಸಲ್ಪಟ್ಟ ಸ್ಥಿತಿಯಲ್ಲಿ ಇರುವುದು—ಪ್ರತ್ಯೇಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
