id: MAT.11.30
reference: Matthew 11:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ನನ್ನ ನೊಗವು ಹಿತಕರವಾಗಿದೆ[a], ಮತ್ತು ನನ್ನ ಹೊರೆ ಹಗುರವಾಗಿದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್ ಪದಕ್ಕೆ ‘ದಯೆಯುಳ್ಳ’, ‘ಒಳ್ಳೆಯ’, ‘ಹಿತವಾದ’ ಅಥವಾ ‘ಹೊರಲು ಸುಲಭವಾದ’ ಎಂಬ ಅರ್ಥಗಳೂ ಇರಬಹುದು.
    reason: χρηστός ಪದದ ನಿಜವಾದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಿ, ‘ಹಿತಕರ’ ಎಂಬ ಒಂದೇ ಕನ್ನಡ ಆಯ್ಕೆಯಿಂದ ಉಂಟಾಗಬಹುದಾದ ಅರ್ಥಸಂಕುಚನವನ್ನು ತಪ್ಪಿಸಲು.
lexical_decisions:
- source_word: ζυγός
  choice: ನೊಗ
  rationale: ಕನ್ನಡದಲ್ಲಿ ಪ್ರಾಣಿಗಳ ಮೇಲೆ ಹಾಕುವ ನೊಗವನ್ನೂ, ರೂಪಕವಾಗಿ ವಿಧಿಸಲಾದ ಅಧೀನತೆ ಅಥವಾ ಹೊಣೆಗಾರಿಕೆಯನ್ನೂ ಸೂಚಿಸಬಲ್ಲ ನೇರ ಸಮಾನಾರ್ಥಕ ಪದ.
- source_word: χρηστός
  choice: ಹಿತಕರವಾಗಿದೆ
  rationale: ಈ ಪದವು ‘ದಯೆಯುಳ್ಳ, ಒಳ್ಳೆಯ, ಹಿತವಾದ, ಸುಲಭವಾಗಿ ಹೊರುವಂಥ’ ಎಂಬ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ. ನೊಗದ ಕುರಿತು ಸಹಜವಾಗಿ ಬಳಕೆಯಾಗುವ ‘ಹಿತಕರ’ ಎಂಬ ಪದವು ಅದನ್ನು ಕೇವಲ ‘ಸುಲಭ’ ಎಂದು ಸೀಮಿತಗೊಳಿಸದೆ ಅದರ ಒಳ್ಳೆಯತನ ಮತ್ತು ಅನುಕೂಲಕರ ಸ್ವಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: φορτίον
  choice: ಹೊರೆ
  rationale: ಹೊತ್ತುಕೊಳ್ಳಬೇಕಾದ ಭಾರ ಅಥವಾ ರೂಪಕವಾದ ಹೊಣೆಗಾರಿಕೆ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಸಹಜವಾಗಿ ಒಳಗೊಂಡಿದೆ.
- source_word: ἐλαφρόν
  choice: ಹಗುರವಾಗಿದೆ
  rationale: ಮೂಲದ ಭಾರದ ರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ರೂಪ.
theological_decisions:
- issue: ಯೇಸುವಿನ ‘ನೊಗ’ವನ್ನು ಕೇವಲ ಸುಲಭವೆಂದು ಅರ್ಥೈಸಬೇಕೇ ಅಥವಾ ಅದರ ಹಿತಕರ ಸ್ವಭಾವವನ್ನು ಒತ್ತಿಹೇಳಬೇಕೇ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಹಿತಕರವಾಗಿದೆ’ ಎಂದು ಅನುವಾದಿಸಿ, ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
  alternative: ‘ಸುಲಭವಾಗಿದೆ’ ಅಥವಾ ‘ಹೊರಲು ಸುಲಭವಾಗಿದೆ’
  rationale: χρηστός ಪದವನ್ನು ಕೇವಲ ಕಷ್ಟವಿಲ್ಲದದ್ದು ಎಂದು ಸೀಮಿತಗೊಳಿಸದೆ, ಅದರ ಒಳ್ಳೆಯತನ, ದಯಾಪರತೆ ಮತ್ತು ಅನುಕೂಲತೆಯ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಜೊತೆಗೆ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ವಾಕ್ಯರಚನೆ. ‘ನೊಗ’ ಮತ್ತು ‘ಹೊರೆ’ ಎಂಬ ಪದಗಳು ಮೂಲದ ಸಮಾಂತರ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತವೆ.
