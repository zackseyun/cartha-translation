id: MAT.11.10
reference: Matthew 11:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: kn
  text: 'ಯಾರ ಕುರಿತು ಹೀಗೆ ಬರೆಯಲಾಗಿದೆಯೋ, ಅವನು ಇವನೇ: “ಇಗೋ, ನಾನು ನನ್ನ ದೂತನನ್ನು ನಿನ್ನ ಮುಖದ ಮುಂದೆ[a] ಕಳುಹಿಸುತ್ತೇನೆ; ಅವನು ನಿನ್ನ ಮುಂದೆ ನಿನ್ನ ಮಾರ್ಗವನ್ನು ಸಿದ್ಧಪಡಿಸುವನು.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಹೆಚ್ಚು ನುಡಿಗಟ್ಟಿನ ಕನ್ನಡದಲ್ಲಿ: “ನಿನ್ನ ಮುಂದೆ” ಅಥವಾ “ನಿನಗಿಂತ ಮುಂದೆ.” ಗ್ರೀಕ್ ಶಾಸ್ತ್ರೋಕ್ತ ಉಲ್ಲೇಖವು ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾದ “ನಿನ್ನ ಮುಖದ ಮುಂದೆ” ಎಂಬ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸಿಕೊಂಡಿದೆ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός … περὶ οὗ
  choice: ಯಾರ ಕುರಿತು … ಅವನು ಇವನೇ
  rationale: ಗ್ರೀಕ್‌ನ ಗುರುತಿಸುವ ಒತ್ತನ್ನು ಉಳಿಸಿಕೊಂಡು, ಸಂಬಂಧಸೂಚಕ–ಸಹಸಂಬಂಧಸೂಚಕ ರಚನೆಯ ಮೂಲಕ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γέγραπται
  choice: ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ
  rationale: ಪವಿತ್ರಗ್ರಂಥದ ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುವ ಪರಿಪೂರ್ಣ ಕರ್ಮಣಿ ರೂಪದ ಸ್ಥಿರ ಫಲಿತಾಂಶ ಮತ್ತು ಪ್ರಾಮಾಣಿಕತೆಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ἰδοὺ
  choice: ಇಗೋ
  rationale: ಪ್ರವಾದನಾತ್ಮಕ ಉಲ್ಲೇಖದ ಗಮನಸೆಳೆಯುವ, ಗಂಭೀರ ಧಾಟಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀποστέλλω
  choice: ಕಳುಹಿಸುತ್ತೇನೆ
  rationale: ಉಲ್ಲೇಖದಲ್ಲಿರುವ ವರ್ತಮಾನಕಾಲದ ಜೀವಂತಿಕೆಯನ್ನೂ ಸಮೀಪ ಭವಿಷ್ಯದ ಅರ್ಥವನ್ನೂ ಕನ್ನಡದ ಸಹಜ ವರ್ತಮಾನ ರೂಪದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἄγγελόν
  choice: ದೂತನನ್ನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸ್ನಾನಿಕ ಯೋಹಾನನೆಂಬ ಮಾನವ ಮುಂಚೂಣಿ ದೂತನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ದೂತ’ ಎಂಬುದು ಸಂದೇಶ ಹೊತ್ತು ಕಳುಹಿಸಲ್ಪಟ್ಟವನ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ ಮತ್ತು ಕಡ್ಡಾಯವಾಗಿ ಪರಲೋಕದ ದೇವದೂತನನ್ನೇ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: πρὸ προσώπου σου
  choice: ನಿನ್ನ ಮುಖದ ಮುಂದೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸ್ಪಷ್ಟವಾದ ‘ಮುಖದ ಮುಂದೆ’ ಎಂಬ ಚಿತ್ರಣವನ್ನೂ ಶಾಸ್ತ್ರೋಕ್ತ ಉಲ್ಲೇಖದ ರೂಪವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: κατασκευάσει
  choice: ಸಿದ್ಧಪಡಿಸುವನು
  rationale: ಮಾರ್ಗವನ್ನು ಮುಂಚಿತವಾಗಿ ಸಜ್ಜುಗೊಳಿಸುವ ಭವಿಷ್ಯ ಕ್ರಿಯೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὴν ὁδόν σου
  choice: ನಿನ್ನ ಮಾರ್ಗವನ್ನು
  rationale: ὁδός ಪದದ ನೇರವಾದ ದಾರಿ ಎಂಬ ಅರ್ಥವನ್ನೂ ರೂಪಕಾರ್ಥದ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔμπροσθέν σου
  choice: ನಿನ್ನ ಮುಂದೆ
  rationale: ಸ್ಥಳಸೂಚಕ ಅರ್ಥವನ್ನು ಗಂಭೀರವಾದರೂ ಸಹಜವಾದ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಶಾಸ್ತ್ರೋಕ್ತ ಉಲ್ಲೇಖದಲ್ಲಿನ ಎರಡು ಸಮಾನ ಸ್ಥಳಸೂಚಕ ಪದಗುಚ್ಛಗಳು
  choice: ‘ನಿನ್ನ ಮುಖದ ಮುಂದೆ’ ಮತ್ತು ‘ನಿನ್ನ ಮುಂದೆ’ ಎರಡನ್ನೂ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ
  alternative: ಎರಡನ್ನೂ ಒಟ್ಟುಗೂಡಿಸಿ ‘ನಿನಗಿಂತ ಮುಂದೆ’ ಎಂದು ಒಂದೇ ಬಾರಿ ಹೇಳುವುದು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು πρὸ προσώπου σου ಮತ್ತು ἔμπροσθέν σου ಎಂಬ ಎರಡೂ ಪದಗುಚ್ಛಗಳನ್ನು ಹೊಂದಿದೆ. ಅವುಗಳನ್ನು ಉಳಿಸುವುದು ಉಲ್ಲೇಖದ ಔಪಚಾರಿಕ ವಿನ್ಯಾಸ ಮತ್ತು ಒತ್ತನ್ನು ಕಾಪಾಡುತ್ತದೆ; ಅರ್ಥವನ್ನು ಸುಗಮಗೊಳಿಸುವ ನೆಪದಲ್ಲಿ ಪುನರಾವರ್ತನೆಯನ್ನು ತೆಗೆದುಹಾಕುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಂಬಂಧಸೂಚಕ ವಾಕ್ಯರಚನೆಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಉಲ್ಲೇಖದ ಪ್ರವಾದನಾತ್ಮಕ ಗಾಂಭೀರ್ಯಕ್ಕಾಗಿ ‘ಇಗೋ,’ ‘ದೂತ,’ ಮತ್ತು ‘ಮಾರ್ಗ’ ಪದಗಳನ್ನು ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ಮೂಲದ ಪುನರಾವರ್ತಿತ ಸ್ಥಳಸೂಚಕ ರಚನೆಯನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
