id: MAT.11.5
reference: Matthew 11:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: kn
  text: ಕುರುಡರು ದೃಷ್ಟಿ ಪಡೆಯುತ್ತಾರೆ, ಕುಂಟರು ನಡೆಯುತ್ತಾರೆ, ಕುಷ್ಠರೋಗಿಗಳು ಶುದ್ಧರಾಗುತ್ತಾರೆ, ಕಿವುಡರು ಕೇಳುತ್ತಾರೆ, ಸತ್ತವರು ಎಬ್ಬಿಸಲ್ಪಡುತ್ತಾರೆ ಮತ್ತು ಬಡವರಿಗೆ ಶುಭಸುದ್ದಿ ಸಾರಲಾಗುತ್ತದೆ[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಬಡವರಿಗೆ ಸುವಾರ್ತೆ ಸಾರಲಾಗುತ್ತದೆ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಕರ್ಮಣಿ ರೂಪದಲ್ಲಿದೆ; ಅಂದರೆ ಬಡವರು ತಮಗೆ ಸಾರಲಾಗುವ ಶುಭಸುದ್ದಿಯ ಸ್ವೀಕರಿಸುವವರು.
    reason: lexical_alternative
  - marker: b
    text: ಈ ಪಟ್ಟಿಯು ಯೆಶಾಯ 35:5–6 ಮತ್ತು 61:1ನ್ನು ಪ್ರತಿಧ್ವನಿಸುತ್ತದೆ; ಇವು ಮೆಸ್ಸೀಯನ ಕಾರ್ಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಗುರುತುಗಳನ್ನು ಮುಂದಿಡುತ್ತವೆ.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: ಕುರುಡರು
  rationale: ವಿಶೇಷಣವನ್ನು ವ್ಯಕ್ತಿಗಳ ವರ್ಗವನ್ನು ಸೂಚಿಸುವ ನಾಮಪದವಾಗಿ ಬಳಸಿರುವ ಗ್ರೀಕ್ ರೂಪದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀναβλέπουσιν
  choice: ದೃಷ್ಟಿ ಪಡೆಯುತ್ತಾರೆ
  rationale: ಗುಣಪಡಿಸುವಿಕೆಯ ಸಂದರ್ಭದಲ್ಲಿ ‘ಮೇಲೆ ನೋಡುತ್ತಾರೆ’ ಎಂಬುದಕ್ಕಿಂತ ದೃಷ್ಟಿಯನ್ನು ಪಡೆಯುವುದು ಅಥವಾ ಮರಳಿ ಪಡೆಯುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ; ಮೊದಲೇ ದೃಷ್ಟಿಯಿತ್ತೆಂದು ಪಠ್ಯವು ಹೇಳದಿರುವುದರಿಂದ ‘ಮರಳಿ’ ಎಂದು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: χωλοὶ
  choice: ಕುಂಟರು
  rationale: ನಡೆಯಲು ಅಸಮರ್ಥರಾಗಿರುವ ಅಥವಾ ಸರಿಯಾಗಿ ನಡೆಯಲಾಗದವರನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: περιπατοῦσιν
  choice: ನಡೆಯುತ್ತಾರೆ
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನಕಾಲ ಮತ್ತು ಪಟ್ಟಿಯ ಸರಳ ನಿರೂಪಣೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: λεπροὶ
  choice: ಕುಷ್ಠರೋಗಿಗಳು
  rationale: ಪ್ರಾಚೀನ ರೋಗವರ್ಗವು ಆಧುನಿಕ ವೈದ್ಯಕೀಯ ನಿರ್ಣಯಕ್ಕೆ ಸಂಪೂರ್ಣ ಸಮಾನವಾಗಿರದಿರಬಹುದಾದರೂ, ಸುವಾರ್ತೆಗಳ ಸಾಂಪ್ರದಾಯಿಕ ಉಲ್ಲೇಖವನ್ನು ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: καθαρίζονται
  choice: ಶುದ್ಧರಾಗುತ್ತಾರೆ
  rationale: ಕೇವಲ ‘ಗುಣಮುಖರಾಗುತ್ತಾರೆ’ ಎನ್ನುವುದಕ್ಕಿಂತ ದೈಹಿಕ ಗುಣಪಡಿಸುವಿಕೆ ಮತ್ತು ವಿಧಿಸಂಬಂಧಿತ ಶುದ್ಧೀಕರಣ ಎರಡರ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: κωφοὶ
  choice: ಕಿವುಡರು
  rationale: κωφός ಎಂಬುದು ಕೆಲ ಸಂದರ್ಭಗಳಲ್ಲಿ ಮೂಕರನ್ನೂ ಸೂಚಿಸಬಹುದು; ಇಲ್ಲಿ ‘ಕೇಳುತ್ತಾರೆ’ ಎಂಬ ಕ್ರಿಯಾಪದದ ಜೋಡಣೆಯಿಂದ ಕಿವುಡರು ಎಂಬ ಅರ್ಥ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: ἀκούουσιν
  choice: ಕೇಳುತ್ತಾರೆ
  rationale: ಮರುಸ್ಥಾಪಿತ ಸಾಮರ್ಥ್ಯವನ್ನು ಸರಳ ವರ್ತಮಾನಕಾಲದಲ್ಲಿ ಹೇಳುತ್ತದೆ.
- source_word: νεκροὶ
  choice: ಸತ್ತವರು
  rationale: ಮೃತ ವ್ಯಕ್ತಿಗಳನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ನಾಮಪದೀಯ ವಿಶೇಷಣವನ್ನು ಸಹಜ ಮತ್ತು ಗಂಭೀರ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐγείρονται
  choice: ಎಬ್ಬಿಸಲ್ಪಡುತ್ತಾರೆ
  rationale: ಮೃತರ ಮೇಲೆ ನಡೆಯುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ಅವರು ತಾವಾಗಿಯೇ ಏಳುತ್ತಾರೆ ಎಂಬ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: πτωχοὶ
  choice: ಬಡವರು
  rationale: ಆರ್ಥಿಕವಾಗಿ ಬಡವರನ್ನೂ ಯೆಶಾಯನ ಹಿನ್ನೆಲೆಯನ್ನೂ ಅನಗತ್ಯವಾಗಿ ಸಂಕುಚಿತಗೊಳಿಸದೆ ಉಳಿಸುವ ಸಾಮಾನ್ಯ ಪದ.
- source_word: εὐαγγελίζονται
  choice: ಬಡವರಿಗೆ ಶುಭಸುದ್ದಿ ಸಾರಲಾಗುತ್ತದೆ
  rationale: ಬಡವರು ಪ್ರಕಟಿಸಲ್ಪಡುವ ಶುಭಸುದ್ದಿಯ ಸ್ವೀಕರಿಸುವವರು ಎಂಬ ಗ್ರೀಕ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ನಂತರದ ಕಾಲದ ತಾಂತ್ರಿಕ ಸಭಾ ಪರಿಭಾಷೆಗೆ ವಾಕ್ಯವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: εὐαγγελίζονται ಎಂಬ ಪದದಲ್ಲಿರುವ ‘ಸುವಾರ್ತೆ/ಶುಭಸುದ್ದಿ’ ಸಂಬಂಧ ಮತ್ತು ಕರ್ಮಣಿ ರೂಪ
  choice: ಬಡವರಿಗೆ ಶುಭಸುದ್ದಿ ಸಾರಲಾಗುತ್ತದೆ
  alternative: ಬಡವರಿಗೆ ಸುವಾರ್ತೆ ಸಾರಲಾಗುತ್ತದೆ; ಬಡವರು ಶುಭಸುದ್ದಿ ಕೇಳುತ್ತಾರೆ
  rationale: ‘ಶುಭಸುದ್ದಿ’ ಎಂಬ ಮೂಲಭಾವವನ್ನೂ ಬಡವರು ಅದರ ಸ್ವೀಕರಿಸುವವರು ಎಂಬ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ. ‘ಕೇಳುತ್ತಾರೆ’ ಎನ್ನುವುದು ಫಲಿತಾಂಶವನ್ನು ಹೇಳಿದರೂ ಮೂಲದ ಕರ್ಮಣಿ ವ್ಯಾಕರಣವನ್ನು ಮಸುಕಾಗಿಸುತ್ತದೆ.
- issue: ಪಟ್ಟಿಯನ್ನು ಮೆಸ್ಸೀಯನ ಕಾರ್ಯದ ನೆರವೇರಿಕೆ ಎಂದು ಅರ್ಥೈಸುವುದು
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅದ್ಭುತ ಕಾರ್ಯಗಳನ್ನು ಮಾತ್ರ ನೇರವಾಗಿ ಹೇಳಿ, ಯೆಶಾಯನ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ
  alternative: ‘ಯೆಶಾಯನ ಪ್ರವಾದನೆಯ ನೆರವೇರಿಕೆಯಾಗಿ’ ಎಂಬ ವಿವರಣೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸೇರಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಕಾರ್ಯಗಳನ್ನು ಸಾಕ್ಷಿಯಾಗಿ ಪಟ್ಟಿ ಮಾಡುತ್ತದೆ; ನೆರವೇರಿಕೆ ಎಂಬ ವಿವರಣೆಯನ್ನು ನೇರವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅದರ ದೇವತಾಶಾಸ್ತ್ರೀಯ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸಿಕೊಂಡು ವ್ಯಾಖ್ಯಾನವನ್ನು ಪಠ್ಯಕ್ಕೆ ಆಮದು ಮಾಡಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನವಾದ ಪಟ್ಟಿಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಪ್ರತಿ ಗ್ರೀಕ್ ವರ್ತಮಾನಕಾಲದ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ವರ್ತಮಾನ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ. ‘ಶುದ್ಧರಾಗುತ್ತಾರೆ’ ಎಂಬುದು ವಿಧಿಸಂಬಂಧಿತ ಮತ್ತು ದೈಹಿಕ ಅರ್ಥಗಳ ಒತ್ತಡವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಎಬ್ಬಿಸಲ್ಪಡುತ್ತಾರೆ’ ಮತ್ತು ‘ಸಾರಲಾಗುತ್ತದೆ’ ಎಂಬ ಕರ್ಮಣಿ ರೂಪಗಳು ಮೂಲದ ದೈವಿಕ ಕ್ರಿಯೆ ಹಾಗೂ ಸ್ವೀಕರಿಸುವವರ ಪಾತ್ರವನ್ನು ಮಸುಕಾಗದಂತೆ ಮಾಡುತ್ತವೆ. ಅಡಿಕುರಿಪು ಗುರುತುಗಳನ್ನು ಅವು ಸಂಬಂಧಿಸುವ ಸ್ಥಳಗಳಲ್ಲೇ ಇರಿಸಲಾಗಿದೆ.
