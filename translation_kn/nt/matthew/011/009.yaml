id: MAT.11.9
reference: Matthew 11:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: kn
  text: ಆದರೆ ನೀವು ಏನನ್ನು ನೋಡಲು ಹೊರಗೆ ಹೋದಿರಿ? ಒಬ್ಬ ಪ್ರವಾದಿಯನ್ನೋ? ಹೌದು, ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ, ಪ್ರವಾದಿಗಿಂತಲೂ ಹೆಚ್ಚಿನವನನ್ನು[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ, ‘ಪ್ರವಾದಿಗಿಂತಲೂ ಹೆಚ್ಚು.’ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸಲು ‘ಹೆಚ್ಚಿನವನನ್ನು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ‘ಪ್ರವಾದಿಗಿಂತ ಶ್ರೇಷ್ಠನಾದವನನ್ನು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಆಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಗಳ ಸರಣಿಗೆ ವ್ಯತಿರಿಕ್ತತೆಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಸಂಯೋಜಕ.
- source_word: τί ἐξήλθατε
  choice: ನೀವು ಏನನ್ನು ... ಹೊರಗೆ ಹೋದಿರಿ
  rationale: τί ಅನ್ನು ‘ಏಕೆ’ ಎಂದು ಅಲ್ಲ, ನೋಡಲು ಹೋದ ವಸ್ತು ಅಥವಾ ವ್ಯಕ್ತಿಯನ್ನು ಕೇಳುವ ‘ಏನನ್ನು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἰδεῖν
  choice: ನೋಡಲು
  rationale: ἐξήλθατε ನಂತರ ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುವ infinitiveಗೆ ಸರಳವಾದ, ಸಹಜ ಸಮಾನಾರ್ಥಕ.
- source_word: προφήτην
  choice: ಒಬ್ಬ ಪ್ರವಾದಿಯನ್ನೋ
  rationale: ಲೇಖನವಿಲ್ಲದ ಏಕವಚನ ನಾಮಪದವನ್ನು ಆಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಗೆ ಹೊಂದುವ ಅನಿರ್ದಿಷ್ಟ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ναί
  choice: ಹೌದು
  rationale: ಹಿಂದಿನ ಪ್ರಶ್ನೆಗೆ ನೇರವಾದ ದೃಢೀಕರಣ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜ.
- source_word: λέγω ὑμῖν
  choice: ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ
  rationale: ಸಾಮಾನ್ಯ ವಾಕ್ಯಪ್ರಯೋಗದ ಬಲವನ್ನು ನೈಸರ್ಗಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ περισσότερον προφήτου
  choice: ಪ್ರವಾದಿಗಿಂತಲೂ ಹೆಚ್ಚಿನವನನ್ನು
  rationale: Genitive comparison ಅನ್ನು ‘ಪ್ರವಾದಿಗಿಂತಲೂ’ ಎಂದು ಉಳಿಸಿ, ಕನ್ನಡ ವಾಕ್ಯಕ್ಕೆ ಅಗತ್ಯವಾದ ಸೂಚ್ಯ ಪುರುಷಾರ್ಥವನ್ನು ‘ಹೆಚ್ಚಿನವನನ್ನು’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ಯಾವ ಅರ್ಥದಲ್ಲಿ ಹೆಚ್ಚು ಎಂಬುದನ್ನು ವಿವರಿಸಿಲ್ಲ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಮಾತಿನಲ್ಲಿ ಸ್ನಾನಿಕ ಯೋಹಾನನ ಗುರುತು ಮತ್ತು ಸ್ಥಾನಮಾನ
  choice: ಪ್ರವಾದಿಗಿಂತಲೂ ಹೆಚ್ಚಿನವನನ್ನು
  alternative: ಪ್ರವಾದಿಗಿಂತ ಶ್ರೇಷ್ಠನಾದವನನ್ನು
  rationale: ಮೂಲವು ಯೋಹಾನನನ್ನು ಪ್ರವಾದಿಯ ವರ್ಗಕ್ಕಿಂತ ಮೇಲಿರಿಸುತ್ತದೆ, ಆದರೆ ಈ ಉಪವಾಕ್ಯದಲ್ಲಿ ಅದು ಯಾವ ರೀತಿಯಲ್ಲಿ ಎಂಬುದನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ. ‘ಹೆಚ್ಚಿನವನು’ ಆ ಮುಕ್ತತೆಯನ್ನೂ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ‘ಹೊರಗೆ ಹೋದಿರಿ’ ಎಂಬುದು ಮೂಲದ ಚಲನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಹೆಚ್ಚಿನವನನ್ನು’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿದರೂ, ಅವನು ಯಾವ ಅರ್ಥದಲ್ಲಿ ಹೆಚ್ಚು ಎಂಬುದನ್ನು ತೆರೆದೆಯೇ ಬಿಡುತ್ತದೆ.
