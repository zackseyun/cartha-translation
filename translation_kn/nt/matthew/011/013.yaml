id: MAT.11.13
reference: Matthew 11:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಎಲ್ಲಾ ಪ್ರವಾದಿಗಳೂ ಧರ್ಮಶಾಸ್ತ್ರವೂ ಯೋಹಾನನವರೆಗೆ[a] ಪ್ರವಾದಿಸಿದವು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಯೋಹಾನನ ತನಕ” ಅಥವಾ “ಯೋಹಾನನ ಕಾಲದವರೆಗೆ.” ಈ ಪದಪ್ರಯೋಗವು ಯೋಹಾನನನ್ನು ಪ್ರವಾದನಾತ್ಮಕ ಸಾಕ್ಷಿಯ ಪರಾಕಾಷ್ಠೆಯಾಗಿ ತೋರಿಸಬಹುದು; ಇಲ್ಲವೇ ಅದರ ಪರಿವರ್ತನೆಯ ಗಡಿಯಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ಎಲ್ಲಾ
  rationale: οἱ προφῆται ಎಂಬ ಸಮೂಹದ ಸಮಗ್ರತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಎಲ್ಲಾ ಪ್ರವಾದಿಗಳು’ ಸಹಜವಾಗಿದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಮಾತಿಗೆ ಕಾರಣ ಅಥವಾ ವಿವರಣೆಯನ್ನು ಜೋಡಿಸುವ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: προφῆται
  choice: ಪ್ರವಾದಿಗಳು
  rationale: ದೇವರ ಪರವಾಗಿ ಪ್ರವಾದನಾತ್ಮಕವಾಗಿ ಮಾತನಾಡುವವರಿಗಾಗಿ ಬಳಕೆಯಾಗುವ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಪದ.
- source_word: ὁ νόμος
  choice: ಧರ್ಮಶಾಸ್ತ್ರ
  rationale: ಇಲ್ಲಿ ಸಾಮಾನ್ಯ ನಿಯಮವಲ್ಲ, ಇಸ್ರಾಯೇಲಿನ ಮಾನ್ಯ ಶಾಸ್ತ್ರಸಂಗ್ರಹವಾದ ತೋರಾವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಪ್ರವಾದಿಗಳು ಮತ್ತು ಧರ್ಮಶಾಸ್ತ್ರ’ ಎಂಬ ಜೋಡಣೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἕως Ἰωάννου
  choice: ಯೋಹಾನನವರೆಗೆ
  rationale: ಕಾಲಮಿತಿಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸಿ, ಯೋಹಾನನು ಪ್ರವಾದನಾತ್ಮಕ ಸಾಕ್ಷ್ಯದ ಪರಾಕಾಷ್ಠೆಯೋ ಅಥವಾ ಅದರ ಪರಿವರ್ತನೆಯ ಗಡಿಯೋ ಎಂಬ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐπροφήτευσαν
  choice: ಪ್ರವಾದಿಸಿದವು
  rationale: ಮೂಲದ ಭೂತಕಾಲದ ಸಕ್ರಿಯ ಕ್ರಿಯೆಯನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ಪ್ರವಾದಿಗಳಿಗೂ ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೂ ಒಟ್ಟಾಗಿ ಅನ್ವಯಿಸಿ, ಧರ್ಮಶಾಸ್ತ್ರವೇ ಪ್ರವಾದನಾತ್ಮಕ ಸಾಕ್ಷಿ ನೀಡಿತು ಎಂಬ ವ್ಯಕ್ತೀಕರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ὁ νόμος ಸಾಮಾನ್ಯ ನಿಯಮವೋ ಅಥವಾ ಶಾಸ್ತ್ರಸಂಗ್ರಹದ ಹೆಸರೋ
  choice: ಧರ್ಮಶಾಸ್ತ್ರ
  alternative: ನಿಯಮ / ಶಾಸನ
  rationale: ಸಂದರ್ಭದಲ್ಲಿನ ‘ಪ್ರವಾದಿಗಳು ಮತ್ತು ಧರ್ಮಶಾಸ್ತ್ರ’ ಎಂಬ ಜೋಡಿ ಇಸ್ರಾಯೇಲಿನ ಶಾಸ್ತ್ರೀಯ ಸಾಕ್ಷಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಾಮಾನ್ಯ ಕಾನೂನುತತ್ತ್ವವನ್ನು ಅಲ್ಲ.
- issue: ἕως Ἰωάννου ಎಂಬುದು ಯೋಹಾನನನ್ನು ಪ್ರವಾದನಾತ್ಮಕ ಯುಗದೊಳಗೆ ಸೇರಿಸುತ್ತದೆಯೋ ಅಥವಾ ಅದರ ಅಂತ್ಯಗಡಿಯನ್ನಾಗಿ ಮಾಡುತ್ತದೆಯೋ
  choice: ಯೋಹಾನನವರೆಗೆ
  alternative: ಯೋಹಾನನ ಕಾಲದವರೆಗೆ
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯಪ್ರಯೋಗವು ಈ ಪ್ರಶ್ನೆಯನ್ನು ಪೂರ್ಣವಾಗಿ ನಿರ್ಣಯಿಸುವುದಿಲ್ಲ. ಆಯ್ದ ರೂಪವು ಕಾಲಮಿತಿಯನ್ನು ಉಳಿಸಿ, ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತಾತ್ಮಕ ತೀರ್ಮಾನವನ್ನು ಹೇರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ಶೈಲಿ. ‘ಧರ್ಮಶಾಸ್ತ್ರ’ವನ್ನು ಶಾಸ್ತ್ರಸಂಗ್ರಹದ ಹೆಸರಾಗಿ ಬಳಸಲಾಗಿದೆ. ‘ಪ್ರವಾದಿಸಿದವು’ ಎಂಬ ಬಹುವಚನ ನಪುಂಸಕ ಕ್ರಿಯಾರೂಪವು ‘ಪ್ರವಾದಿಗಳು’ ಮತ್ತು ‘ಧರ್ಮಶಾಸ್ತ್ರ’ ಎಂಬ ಸಂಯುಕ್ತ ಕರ್ತೃಗೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೊಂದಿ, ಧರ್ಮಶಾಸ್ತ್ರದ ವ್ಯಕ್ತೀಕರಣವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
