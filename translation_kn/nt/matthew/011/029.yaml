id: MAT.11.29
reference: Matthew 11:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: kn
  text: ನನ್ನ ನೊಗವನ್ನು ನಿಮ್ಮ ಮೇಲೆ ಹೊತ್ತುಕೊಳ್ಳಿರಿ ಮತ್ತು ನನ್ನಿಂದ ಕಲಿಯಿರಿ; ಏಕೆಂದರೆ ನಾನು ಸೌಮ್ಯನೂ ಹೃದಯದಲ್ಲಿ ವಿನಮ್ರನೂ ಆಗಿದ್ದೇನೆ.[a] ಮತ್ತು ನಿಮ್ಮ ಆತ್ಮಗಳಿಗೆ ವಿಶ್ರಾಂತಿ ದೊರೆಯುತ್ತದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಾನು ಸಾಧುವೂ ಹೃದಯದಲ್ಲಿ ದೀನನೂ ಆಗಿದ್ದೇನೆ.”
    reason: πραΰς ಮತ್ತು ταπεινὸς τῇ καρδίᾳಗೆ ಇರುವ ಪರಂಪರಾಗತ/ಲೆಕ್ಸಿಕಲ್ ಪರ್ಯಾಯವನ್ನು ದಾಖಲಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: ನನ್ನ ನೊಗವನ್ನು ನಿಮ್ಮ ಮೇಲೆ ಹೊತ್ತುಕೊಳ್ಳಿರಿ
  rationale: ನೊಗದ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತಾ, αἴρω ಮತ್ತು ἐπίಯ ಸಂಯುಕ್ತ ಅರ್ಥವಾದ ಅದನ್ನು ಸ್ವೀಕರಿಸಿ ತನ್ನ ಮೇಲೆ ಹೊರುವುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: καὶ μάθετε ἀπ’ ἐμοῦ
  choice: ನನ್ನಿಂದ ಕಲಿಯಿರಿ
  rationale: ἀπόಯ ಮೂಲಭಾವವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ಯೇಸುವಿನಿಂದ ಉಪದೇಶ ಮತ್ತು ಶಿಷ್ಯತ್ವ ಕಲಿಯುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಮುಂದಿನ ಸ್ವವಿವರಣೆ ಯಾಕೆ ಆತನಿಂದ ಕಲಿಯಬೇಕು ಎಂಬ ಕಾರಣವನ್ನು ನೀಡುತ್ತದೆ ಎಂಬ ವ್ಯಾಕರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: πραΰς
  choice: ಸೌಮ್ಯನು
  rationale: ಕಠೋರನಲ್ಲದ, ಮೃದು ಸ್ವಭಾವದ ಸಕಾರಾತ್ಮಕ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ದೌರ್ಬಲ್ಯವೆಂಬ ತಪ್ಪು ಸೂಚನೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: ಹೃದಯದಲ್ಲಿ ದೀನನು
  rationale: ταπεινός ಎಂಬ ತಗ್ಗಿದ/ವಿನೀತ ಸ್ಥಿತಿಯ ಅರ್ಥವನ್ನೂ τῇ καρδίᾳ ಸೂಚಿಸುವ ಆಂತರಿಕ ಮನೋಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: ವಿಶ್ರಾಂತಿ ದೊರೆಯುತ್ತದೆ
  rationale: ಭವಿಷ್ಯಕಾಲದ ವಾಗ್ದಾನವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸಿ, ἀνάπαυσιςನ ವಿಶ್ರಾಂತಿಯ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: ನಿಮ್ಮ ಆತ್ಮಗಳಿಗೆ
  rationale: ದತ್ತಿ ವಿಭಕ್ತಿಯ ಫಲಾನುಭವಿ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ‘-ಗಳಿಗೆ’ ಮೂಲಕ ಸೂಚಿಸಿ, ψυχήಯ ಒಳಜೀವ/ವ್ಯಕ್ತಿತ್ವದ ಬೈಬಲೀಯ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ ಎಂಬ ಯೇಸುವಿನ ಸ್ವಭಾವವರ್ಣನೆ
  choice: ನಾನು ಸೌಮ್ಯನೂ ಹೃದಯದಲ್ಲಿ ದೀನನೂ ಆಗಿದ್ದೇನೆ
  alternative: ನಾನು ಸಾಧುವೂ ಹೃದಯದಲ್ಲಿ ವಿನೀತನೂ ಆಗಿದ್ದೇನೆ
  rationale: ಯೇಸುವಿನ ವೈಯಕ್ತಿಕ ಸ್ವವಿವರಣೆಯನ್ನು ಮತ್ತು ಎರಡು ಗುಣಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ. ‘ಸೌಮ್ಯ’ ಕಠೋರತೆಯ ಅಭಾವವನ್ನು, ‘ದೀನ’ ಆಂತರಿಕ ತಗ್ಗಿಸಿಕೊಳ್ಳುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತವೆ; ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವನ್ನು ಹೇರಲಾಗಿಲ್ಲ.
- issue: καὶ εὑρήσετεಯ ಸಂಬಂಧ
  choice: ಆಗ ನಿಮ್ಮ ಆತ್ಮಗಳಿಗೆ ವಿಶ್ರಾಂತಿ ದೊರೆಯುತ್ತದೆ
  alternative: ಮತ್ತು ನಿಮ್ಮ ಆತ್ಮಗಳಿಗೆ ವಿಶ್ರಾಂತಿ ದೊರೆಯುತ್ತದೆ
  rationale: καίಯನ್ನು ಫಲಸೂಚಕವಾಗಿ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಆಗ’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಕಲಿಯುವ ಆಹ್ವಾನ ಮತ್ತು ವಿಶ್ರಾಂತಿಯ ವಾಗ್ದಾನದ ಸಂಬಂಧ ಉಳಿದಿದೆ, ಆದರೆ ಅದರ ಧಾರ್ಮಿಕ ಕ್ರಮವನ್ನು ಹೆಚ್ಚಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ನೊಗ’ ಎಂಬ ಕೇಂದ್ರ ರೂಪಕವನ್ನು ಅನುವಾದಿಸದೆ ಉಳಿಸಲಾಗಿದೆ. ವಾಕ್ಯದ ದೀರ್ಘತೆಯನ್ನು ನಿಯಂತ್ರಿಸಲು ಕಾರಣವಾಕ್ಯ ಮತ್ತು ಫಲವಾಕ್ಯವನ್ನು ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ನೀಡಲಾಗಿದೆ; ಮೂಲದ ತಾರ್ಕಿಕ ಸಂಬಂಧವನ್ನು ‘ಏಕೆಂದರೆ’ ಮತ್ತು ‘ಆಗ’ ಉಳಿಸುತ್ತವೆ.
