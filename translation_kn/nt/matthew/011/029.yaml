  to: ನನ್ನ ನೊಗವನ್ನು ನಿಮ್ಮ ಮೇಲೆ ಹೊತ್ತುಕೊಳ್ಳಿರಿ ಮತ್ತು ನನ್ನಿಂದ ಕಲಿಯಿರಿ; ಏಕೆಂದರೆ ನಾನು ಸೌಮ್ಯನೂ ಹೃದಯದಲ್ಲಿ ವಿನಮ್ರನೂ ಆಗಿದ್ದೇನೆ.[a] ಮತ್ತು ನಿಮ್ಮ ಆತ್ಮಗಳಿಗೆ ವಿಶ್ರಾಂತಿ ದೊರೆಯುತ್ತದೆ.
