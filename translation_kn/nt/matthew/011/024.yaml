id: MAT.11.24
reference: Matthew 11:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: kn
  text: ಆದರೆ ನಾನು ನಿನಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ನಿನಗಿಂತ ಸೊದೋಮಿನ ನಾಡಿಗೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುತ್ತದೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹೆಚ್ಚು ತಾಳಿಕೊಳ್ಳಬಹುದಾದುದು.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಘೋಷಣೆಗೆ ವಿರುದ್ಧವಾದ ಗಂಭೀರ ತೀರ್ಪಿನ ಮಾತನ್ನು ಪರಿಚಯಿಸುವ ಬಲವಾದ ಸಂಕ್ರಮಣವಾಗಿ ಇಲ್ಲಿ ಬಳಕೆಯಾಗಿದೆ.
- source_word: λέγω ὑμῖν
  choice: ನಾನು ನಿನಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: ὑμῖν ರೂಪತಃ ಬಹುವಚನವಾದರೂ, ಸಂದರ್ಭದಲ್ಲಿನ ನಗರಕ್ಕೆ ನೇರ ಸಂಬೋಧನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಏಕವಚನವಾಗಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ‘ಹೇಳುವುದೇನೆಂದರೆ’ ಮುಂದಿನ ὅτι ವಾಕ್ಯವನ್ನು ಸರಾಗವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: γῇ Σοδόμων
  choice: ಸೊದೋಮಿನ ನಾಡಿಗೆ
  rationale: γῇ ಎಂಬ ‘ನಾಡು/ಪ್ರದೇಶ’ದ ಸ್ಪಷ್ಟ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಕೇವಲ ನಗರದ ಹೆಸರಿಗೆ ಸೀಮಿತಗೊಳಿಸದೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἀνεκτότερον
  choice: ಹೆಚ್ಚು ಸಹನೀಯ
  rationale: ಹೋಲಿಕೆಯ ಅರ್ಥವಾದ ‘ಹೆಚ್ಚು ತಾಳಿಕೊಳ್ಳಬಹುದಾದ/ಸಹಿಸಬಹುದಾದ’ ಎಂಬುದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾದ, ಘನವಾದ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔσται
  choice: ಆಗಿರುವುದು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಸರಳ ಸಂಯೋಜಕ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ತೀರ್ಪಿನ ಘೋಷಣೆಗೆ ಸಹಜವಾದ ರೂಪದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ
  rationale: ನಿರ್ಣಾಯಕ ನ್ಯಾಯವಿಚಾರಣೆಯ ದಿನ ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಮೂಲ ರಚನೆಗೆ ಸಮೀಪವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἢ σοί
  choice: ನಿನಗಿಂತ
  rationale: ಹೋಲಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದ ‘-ಗಿಂತ’ ರೂಪದಲ್ಲಿ ನೀಡಿದ್ದು, σοίಯ ಏಕವಚನ ನೇರ ಸಂಬೋಧನೆಯನ್ನು ಉಳಿಸಿದೆ.
theological_decisions:
- issue: σοί ಎಂಬ ಏಕವಚನದ ಉಲ್ಲೇಖ
  choice: ‘ನಿನಗಿಂತ’ ಎಂದು ಏಕವಚನ ನೇರ ಸಂಬೋಧನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನಿಮಗಿಂತ’ ಅಥವಾ ‘ನಿಮ್ಮ ಜನರಿಗಿಂತ’ ಎಂದು ಬಹುವಚನಗೊಳಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ σοί ಏಕವಚನವಾಗಿದ್ದು, ಸುತ್ತಲಿನ ಸಂದರ್ಭದಲ್ಲಿ ನಗರವನ್ನು ವ್ಯಕ್ತೀಕರಿಸಿ ಸಂಬೋಧಿಸುತ್ತದೆ. ಅದನ್ನು ವಿಸ್ತರಿಸದೆ ಉಳಿಸುವುದು ಪ್ರವಾದನಾತ್ಮಕ ಘೋಷಣೆಯ ವಾಗ್ಬಲವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಘನವಾದ ನೇರ ಸಂಬೋಧನೆ ಬಳಸಲಾಗಿದೆ. ‘ಸೊದೋಮಿನ ನಾಡು’ ಎಂಬುದು γῇಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ನಿನಗೆ/ನಿನಗಿಂತ’ ಎಂಬ ಏಕವಚನವು ನಗರವನ್ನು ವ್ಯಕ್ತೀಕರಿಸಿದ ಮೂಲದ ವಾಗ್ವೈಖರಿಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
