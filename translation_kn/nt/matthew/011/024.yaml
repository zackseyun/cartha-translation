revisions:
- from: ಆದರೆ ನಾನು ನಿನಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ನಿನಗಿಂತ ಸೊದೋಮಿನ ನಾಡಿಗೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುವುದು.[a]
  to: ಆದರೆ ನಾನು ನಿನಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ನಿನಗಿಂತ ಸೊದೋಮಿನ ನಾಡಿಗೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುತ್ತದೆ.[a]
  rationale: The revision changes only the Kannada predicate to a finite future form, faithfully representing ἔσται and producing a complete modern Kannada sentence. The footnote is streamlined to provide a direct lexical alternative for ‘ಸಹನೀಯ’ without adding an interpretive state expression. The singular ‘ನಿನಗೆ/ನಿನಗಿಂತ’ is retained to reflect the Greek singular address to the personified city in context.
