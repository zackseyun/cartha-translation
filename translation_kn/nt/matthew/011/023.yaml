id: MAT.11.23
reference: Matthew 11:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: kn
  text: ನೀನು ಸಹ, ಕಪೆರ್ನೌಮ್, ಸ್ವರ್ಗದವರೆಗೆ ಮೇಲಕ್ಕೇರಿಸಲ್ಪಡುವೆಯೋ? ನೀನು ಹೇಡೀಸ್‌ಗೆ[a] ಇಳಿದುಹೋಗುವೆ. ಏಕೆಂದರೆ ನಿನ್ನಲ್ಲಿ ನಡೆದ ಮಹತ್ಕಾರ್ಯಗಳು ಸೊದೋಮಿನಲ್ಲಿ ನಡೆದಿದ್ದರೆ, ಅದು ಇಂದಿನವರೆಗೂ ಉಳಿದಿರುತ್ತಿತ್ತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಮೃತರ ಲೋಕ.” ಗ್ರೀಕ್ ᾅδης (ಹೇಡೀಸ್); ಇದು ಗೆಹೆನ್ನಾ ಅಲ್ಲ.
    reason: ᾅδης ಪದಕ್ಕೆ ವಿವರಣಾತ್ಮಕ ಪರ್ಯಾಯವನ್ನು ನೀಡುತ್ತಾ, ಅದನ್ನು ಬೇರೆ ನ್ಯಾಯತೀರ್ಪಿನ ಪದವಾದ ಗೆಹೆನ್ನಾದಿಂದ ಪ್ರತ್ಯೇಕಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: ಕಪೆರ್ನೌಮ್
  rationale: ಸ್ಥಳನಾಮವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಧ್ವನಿಲಿಪ್ಯಂತರ ರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: ಸ್ವರ್ಗದವರೆಗೆ ಮೇಲಕ್ಕೇರಿಸಲ್ಪಡುವೆಯೋ?
  rationale: μή ಜೊತೆಯ ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ಕ್ರಿಯೆಯನ್ನು ನಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ‘ಸ್ವರ್ಗದವರೆಗೆ’ ಎಂಬ ಸ್ಥಳರೂಪಕವನ್ನೂ ಕಾಪಾಡಲಾಗಿದೆ.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: ನೀನು ಹೇಡೀಸ್‌ಗೆ ಇಳಿದುಹೋಗುವೆ
  rationale: καταβαίνω ಎಂಬುದರ ಇಳಿಯುವ ಚಲನೆಯನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ᾅδης ಅನ್ನು ಗೆಹೆನ್ನಾ ಅಥವಾ ಸಾಮಾನ್ಯ ‘ನರಕ’ ಎಂಬ ಪದದೊಂದಿಗೆ ಬೆರೆಸದಂತೆ ಧ್ವನಿಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: δυνάμεις
  choice: ಮಹತ್ಕಾರ್ಯಗಳು
  rationale: ಯೇಸುವಿನ ಶಕ್ತಿಯನ್ನು ಪ್ರಕಟಿಸುವ ನೈಜ ಕಾರ್ಯಗಳ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹಿಡಿಯುತ್ತದೆ; ಕೇವಲ ಆಧುನಿಕ ಅರ್ಥದ ‘ಅದ್ಭುತ’ಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: γενόμεναι ἐν σοί
  choice: ನಿನ್ನಲ್ಲಿ ನಡೆದ
  rationale: ನಗರವನ್ನು ಏಕವಚನದಲ್ಲಿ ನೇರವಾಗಿ ಸಂಬೋಧಿಸುವ ರೂಪವನ್ನೂ, ಘಟನೆಗಳು ಅದರಲ್ಲಿ ಸಂಭವಿಸಿದವು ಎಂಬ ಸ್ಥಳಾರ್ಥವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐγενήθησαν
  choice: ನಡೆದಿದ್ದರೆ
  rationale: ನಡೆಯದ ಭೂತಕಾಲದ ಷರತ್ತನ್ನು ಕನ್ನಡದ ಪ್ರತಿವಾಸ್ತವಿಕ ಷರತ್ತು ರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἔμεινεν ἂν
  choice: ಅದು ... ಉಳಿದಿರುತ್ತಿತ್ತು
  rationale: ಸೊದೋಮ್ ನಗರವನ್ನು ಸೂಚಿಸುವ ಏಕವಚನ ಕ್ರಿಯೆಯನ್ನೂ, ನೆರವೇರದ ಫಲಿತಾಂಶವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: μέχρι τῆς σήμερον
  choice: ಇಂದಿನವರೆಗೂ
  rationale: ಮೂಲದ ಕಾಲಮಿತಿಯನ್ನು ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ᾅδης ಪದದ ಅನುವಾದ
  choice: ಹೇಡೀಸ್
  alternative: ಮೃತರ ಲೋಕ; ನರಕ
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಪದವನ್ನು ಗೆಹೆನ್ನಾ ಮತ್ತು ನಂತರದ ವಿಶಾಲ ‘ನರಕ’ ಕಲ್ಪನೆಗಳಿಂದ ಬೇರ್ಪಡಿಸಿ ಉಳಿಸಲು ಧ್ವನಿಲಿಪ್ಯಂತರವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಳಸಲಾಗಿದೆ; ಅರ್ಥವಿವರಣೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: μή ಇರುವ ವಾಕ್ಯದ ಸ್ವರೂಪ
  choice: ನಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ
  alternative: ‘ನೀನು ಸ್ವರ್ಗದವರೆಗೆ ಮೇಲಕ್ಕೇರಿಸಲ್ಪಡುವುದಿಲ್ಲ’ ಎಂಬ ನೇರ ನಿರಾಕರಣೆ
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯರಚನೆಯ ಪ್ರಶ್ನಾರ್ಥಕ ಬಲವನ್ನೂ ಅದರ ವ್ಯಂಗ್ಯಾತ್ಮಕ ತೀವ್ರತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ; ನಿರೀಕ್ಷಿತ ಉತ್ತರವನ್ನು ಪಠ್ಯದಲ್ಲೇ ವಿವರಣೆಯಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ನಗರದ ನೇರ ಸಂಬೋಧನೆಗೆ ‘ಕಪೆರ್ನೌಮೇ’ ಮತ್ತು ಏಕವಚನ ‘ನೀನು’ ಉಳಿಸಲಾಗಿದೆ. ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ, ಕೆಳಗಿಳಿಯುವ ವಿರುದ್ಧಚಿತ್ರ, ಮತ್ತು ಪ್ರತಿವಾಸ್ತವಿಕ ಷರತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಕಾಪಾಡಲ್ಪಟ್ಟಿವೆ.
