id: MAT.11.7
reference: Matthew 11:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: kn
  text: 'ಅವರು ಹೊರಟುಹೋಗುತ್ತಿದ್ದಾಗ, ಯೇಸು ಯೋಹಾನನ ಕುರಿತು ಜನಸಮೂಹಗಳಿಗೆ ಹೇಳಲು ಆರಂಭಿಸಿದನು: “ನೀವು ಏನನ್ನು ನೋಡಲು ಅರಣ್ಯಕ್ಕೆ ಹೊರಟುಹೋದಿರಿ? ಗಾಳಿಯಿಂದ ಅಲುಗಾಡುವ ಒಂದು ಜೊಂಡನ್ನೋ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗಾಳಿಯಿಂದ ಅಲುಗಾಡುವ ಜೊಂಡಿನ ಚಿತ್ರವು ಅಸ್ಥಿರತೆ ಅಥವಾ ನಿರ್ಧಾರಹೀನತೆಯನ್ನು ಸೂಚಿಸಬಹುದು; ಯೋಹಾನನು ಅಂಥವನಲ್ಲ ಎಂಬ ನಿರಾಕಾರ ಉತ್ತರವನ್ನು ಯೇಸುವಿನ ಪ್ರಶ್ನೆ ನಿರೀಕ್ಷಿಸುತ್ತದೆ.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: ಅವರು ಹೊರಟುಹೋಗುತ್ತಿದ್ದಾಗ
  rationale: ಸಂಬಂಧಿತ ಹಿಂದಿನ ವಚನದಲ್ಲಿ ಯೋಹಾನನ ಶಿಷ್ಯರು ಸ್ಪಷ್ಟವಾಗಿರುವುದರಿಂದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಅವರು’ ಸಾಕಾಗುತ್ತದೆ; ಅಪೂರ್ಣಕಾಲದ ಸಮಕಾಲೀನ ಕ್ರಿಯೆಯನ್ನು ‘ಹೊರಟುಹೋಗುತ್ತಿದ್ದಾಗ’ ಉಳಿಸುತ್ತದೆ.
- source_word: ἤρξατο ... λέγειν
  choice: ಹೇಳಲು ಆರಂಭಿಸಿದನು
  rationale: ἄρχομαι + infinitive ರಚನೆಯ ‘ಆರಂಭಿಸಿದನು’ ಎಂಬ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τοῖς ὄχλοις
  choice: ಜನಸಮೂಹಗಳಿಗೆ
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: περὶ Ἰωάννου
  choice: ಯೋಹಾನನ ಕುರಿತು
  rationale: περί + genitive ಇಲ್ಲಿ ಮಾತಿನ ವಿಷಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕುರಿತು’ ಗೌರವಪೂರ್ಣವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: ನೀವು ಏನನ್ನು ನೋಡಲು ಅರಣ್ಯಕ್ಕೆ ಹೊರಟುಹೋದಿರಿ?
  rationale: τί ಅನ್ನು ‘ಏನನ್ನು?’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ, ‘ಏಕೆ?’ ಎಂದು ವಿವರಣೆಗೊಳಿಸಿಲ್ಲ. θεάομαιಯ ವೀಕ್ಷಿಸುವ/ನೋಡುವ ಅರ್ಥಕ್ಕೆ ‘ನೋಡಲು’ ಸಹಜವಾಗಿದೆ; ἔρημοςಗೆ ಸಂದರ್ಭಸೂಕ್ತವಾಗಿ ‘ಅರಣ್ಯ’ ಬಳಸಲಾಗಿದೆ.
- source_word: κάλαμον
  choice: ಒಂದು ಜೊಂಡನ್ನು
  rationale: κάλαμοςನ ಸಾಮಾನ್ಯ ಅರ್ಥವಾದ reed ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಜೊಂಡು’ ಎಂದು, ಏಕವಚನ ರೂಪಕವನ್ನು ಉಳಿಸಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: ಗಾಳಿಯಿಂದ ಅಲುಗಾಡಿಸಲ್ಪಡುವ
  rationale: ὑπό ಸೂಚಿಸುವ ಕರ್ತೃಸಾಧನ ಸಂಬಂಧವನ್ನೂ ವರ್ತಮಾನ ಕರ್ಮಣಿ ಕೃದಂತದ ಸ್ವರೂಪವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ರೂಪಕವನ್ನು ‘ತೂಗಾಡುವ’ ಎಂದು ಮೃದುಗೊಳಿಸದೆ ಅಸ್ಥಿರ ಚಲನೆಯನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: Τούτων (‘ಇವರು/ಅವರು’) ಎಂಬುದರ ಉಲ್ಲೇಖ
  choice: ಮುಂದಿನ ಸಂದರ್ಭದಿಂದ ಯೋಹಾನನ ಶಿಷ್ಯರನ್ನು ಸೂಚಿಸುವ ‘ಅವರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ
  alternative: ‘ಈ ಜನರು’ ಅಥವಾ ‘ಯೋಹಾನನ ಶಿಷ್ಯರು’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ವ್ಯಕ್ತಿಗಳನ್ನು ಹೆಸರಿಸುವುದಿಲ್ಲ. ಕನ್ನಡದಲ್ಲಿ ‘ಅವರು’ ಸಂದರ್ಭವನ್ನು ಸ್ಪಷ್ಟವಾಗಿಯೇ ಉಳಿಸಿ, ಮೂಲದಲ್ಲಿಲ್ಲದ ಗುರುತಿಸುವಿಕೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: ಗಾಳಿಯಿಂದ ಅಲುಗಾಡುವ ಜೊಂಡಿನ ರೂಪಕದ ಅರ್ಥ
  choice: ರೂಪಕವನ್ನು ವಿವರಣೆಯಿಲ್ಲದೆ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಸೂಚಿತ ಅಸ್ಥಿರತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ
  alternative: ‘ಅಸ್ಥಿರ ಮನುಷ್ಯನನ್ನೋ?’ ಎಂದು ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಬಿಚ್ಚಿಡುವುದು
  rationale: ಯೇಸುವಿನ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯ ಚಿತ್ರಣ ಮತ್ತು ಪರೋಕ್ಷತೆಯನ್ನು ಉಳಿಸುವುದು ಮೂಲಕ್ಕೆ ನಿಷ್ಠವಾಗಿದೆ; ಪ್ರಶ್ನೆ ಯೋಹಾನನ ಕುರಿತು ನಿರಾಕಾರ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ಓದುಗರಿಗೆ ಅಡಿಕುರಿಪು ನೆರವಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನವಾದ ಶೈಲಿ. ‘ಜನಸಮೂಹಗಳು’, ‘ಕುರಿತು’, ‘ಅರಣ್ಯ’ ಮುಂತಾದ ಪದಗಳು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿದ್ದು ಮೂಲದ ಬಹುವಚನ ಮತ್ತು ವಾಕ್ಯರಚನೆಯ ಮುಖ್ಯ ಲಕ್ಷಣಗಳನ್ನು ಉಳಿಸುತ್ತವೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ [a] ಗುರುತು ಸಂಬಂಧಿತ ಅಡಿಕುರಿಪಿಗೆ ಸರಿಹೊಂದುತ್ತದೆ.
