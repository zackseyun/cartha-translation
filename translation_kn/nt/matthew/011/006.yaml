  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: kn
  text: ಮತ್ತು ನನ್ನ ನಿಮಿತ್ತ ಎಡವದವನು ಧನ್ಯನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನನ್ನ ವಿಷಯದಲ್ಲಿ ಅಭ್ಯಂತರಪಡದವನು’ ಅಥವಾ ‘ನನ್ನಿಂದ ಅಭ್ಯಂತರಪಡದವನು.’
    reason: σκανδαλισθῇ ἐν ἐμοί ಎಂಬ ಪದಗುಚ್ಛವು ಎಡವುವುದರ ಜೊತೆಗೆ ಯೇಸುವಿನ ವಿಷಯದಲ್ಲಿ ಅಥವಾ ಆತನಿಂದ ಅಭ್ಯಂತರಪಡುವ ಅರ್ಥವನ್ನೂ ಹೊಂದಬಹುದು.
lexical_decisions:
- source_word: καί
  choice: ಮತ್ತು
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದೊಂದಿಗೆ ಈ ವಾಕ್ಯಕ್ಕಿರುವ ಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μακάριος
  choice: ಧನ್ಯನು
  rationale: ಸುಖಿ ಅಥವಾ ಅದೃಷ್ಟವಂತನು ಎಂಬುದಕ್ಕಿಂತ ದೈವಿಕ ಮೆಚ್ಚುಗೆ ಮತ್ತು ಆಶೀರ್ವಾದದ ಘೋಷಣೆಯನ್ನು ಹೊತ್ತಿರುವ, ಧನ್ಯವಾಕ್ಯಗಳಿಗೆ ಸಹಜವಾದ ಕನ್ನಡ ಪದ.
- source_word: ὃς ἐὰν μὴ
  choice: ಎಡವದವನು
  rationale: ಅನಿರ್ದಿಷ್ಟವಾದ ಯಾವುದೇ ವ್ಯಕ್ತಿಗೆ ಅನ್ವಯಿಸುವ ಷರತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: σκανδαλισθῇ
  choice: ಎಡವದವನು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಎಡವುವ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ; ಇದು ಕೇವಲ ಮನನೊಂದುವುದಲ್ಲ, ಯೇಸುವಿನ ಕಾರಣದಿಂದ ನಂಬಿಕೆಯಲ್ಲಿ ಅಡ್ಡಿ ಉಂಟಾಗುವುದು ಅಥವಾ ಹಿಂದೆ ಸರಿಯುವುದನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು.
- source_word: ἐν ἐμοί
  choice: ನನ್ನ ನಿಮಿತ್ತ
  rationale: ಯೇಸು ಎಡವಿಕೆಗೆ ಸಂದರ್ಭ ಅಥವಾ ಕಾರಣವಾಗುವ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ನನ್ನ ವಿಷಯದಲ್ಲಿ’ ಎಂಬ ಸಾಧ್ಯತೆಯನ್ನೂ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: σκανδαλισθῇ ಪದದ ಬಲವನ್ನು ಕೇವಲ ಭಾವನಾತ್ಮಕ ಮನನೋವಿಗೆ ಸೀಮಿತಗೊಳಿಸುವ ಸಾಧ್ಯತೆ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಎಡವದವನು’ ಎಂಬ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ನನ್ನ ವಿಷಯದಲ್ಲಿ ಅಭ್ಯಂತರಪಡದವನು / ನನ್ನಿಂದ ಮನನೊಂದಿರದವನು
  rationale: ಈ ಮಾತು ಯೇಸುವಿನ ವ್ಯಕ್ತಿತ್ವ ಮತ್ತು ಕಾರ್ಯಗಳಿಂದ ಅಡ್ಡಿಪಟ್ಟು ನಂಬಿಕೆಯಿಂದ ಹಿಂದೆ ಸರಿಯದವನನ್ನು ಧನ್ಯನೆಂದು ಘೋಷಿಸುತ್ತದೆ. ‘ಎಡವು’ ಎಂಬ ರೂಪಕವು ಅಪರಾಧಭಾವ, ಅಭ್ಯಂತರ ಮತ್ತು ನಂಬಿಕೆಯ ಕುಸಿತದ ನಡುವಿನ ಮೂಲದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಸಂಕೋಚಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ, ಘನತೆಯ ಧನ್ಯವಾಕ್ಯ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಎಡವದವನು’ ಮೂಲದ ರೂಪಕವನ್ನು ಉಳಿಸಿಕೊಂಡು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೂ ಗ್ರಾಹ್ಯವಾಗಿದೆ; ‘ನನ್ನ ನಿಮಿತ್ತ’ ಕಾರಣ ಅಥವಾ ಸಂದರ್ಭದ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
