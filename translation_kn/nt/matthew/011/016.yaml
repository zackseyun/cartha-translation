translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಓದಿಗೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಪ್ರಶ್ನೆಯ ಆಲೋಚನಾತ್ಮಕ ಸ್ವರ ಮತ್ತು ‘ಉಳಿದವರು’ ಎಂಬ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆ ಉಳಿಸಲಾಗಿದೆ. ಮುಂದಿನ ವಚನದಲ್ಲಿ ಮಕ್ಕಳ ಮಾತು ಬರುವುದರಿಂದ ಕೊನೆಯಲ್ಲಿ ದ್ವಿಬಿಂದು ಬಳಸಲಾಗಿದೆ.
