source:
  edition: SBLGNT
  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: kn
  text: 'ಆದರೆ ಈ ಪೀಳಿಗೆಯನ್ನು ನಾನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಲಿ? ಇದು ಮಾರುಕಟ್ಟೆ ಚೌಕಗಳಲ್ಲಿ[a] ಕುಳಿತು, ಇತರರಿಗೆ[b] ಕೂಗಿ ಕರೆಯುವ ಮಕ್ಕಳಂತಿದೆ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಮಾರುಕಟ್ಟೆ ಪ್ರದೇಶಗಳಲ್ಲಿ.’ ಗ್ರೀಕ್ ಪದವು ಜನರು ಸೇರುತ್ತಿದ್ದ ಸಾರ್ವಜನಿಕ ಮಾರುಕಟ್ಟೆ ಪ್ರದೇಶಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಇತರ ಮಕ್ಕಳಿಗೆ.’ ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ‘ಇತರರಿಗೆ’ ಎಂದಷ್ಟೇ ಇದೆ; ಅವರು ಮಕ್ಕಳೆಂಬುದು ಉಪಮೆಯ ಸಂದರ್ಭದಿಂದ ತಿಳಿಯುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಲಿ
  rationale: ದತ್ತಿವ್ ಪ್ರಶ್ನಾರ್ಥಕ ಪದವು ಹೋಲಿಕೆಯ ಮಾನದಂಡವನ್ನು ಕೇಳುತ್ತದೆ; ಭವಿಷ್ಯತ್ಕಾಲದ ಕ್ರಿಯಾಪದದ ಆಲೋಚನಾತ್ಮಕ-ಪ್ರಶ್ನಾರ್ಥಕ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಹೋಲಿಸಲಿ’ ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಸೌಮ್ಯವಾದ ಸಂಕ್ರಮಣ ಅಥವಾ ವ್ಯತ್ಯಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆದರೆ’ ಇಲ್ಲಿ ವಾಕ್ಚಾತುರ್ಯದ ತಿರುವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: τὴν γενεὰν ταύτην
  choice: ಈ ಪೀಳಿಗೆಯನ್ನು
  rationale: ಯೇಸುವಿನ ಸಮಕಾಲೀನ ಜನಸಮೂಹವನ್ನು ಸೂಚಿಸುವ ಸ್ಥಿರವೂ ಸಹಜವೂ ಆದ ಕನ್ನಡ ರೂಪ.
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: ಮಕ್ಕಳಂತಿದೆ
  rationale: ಸರಳ ಹೋಲಿಕೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅನಗತ್ಯವಾಗಿ ಅಲ್ಪವಯಸ್ಸಿನ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: καθημένοις
  choice: ಕುಳಿತುಕೊಂಡು
  rationale: ಮಕ್ಕಳ ಭಂಗಿ ಮತ್ತು ನಡೆಯುತ್ತಿರುವ ದೃಶ್ಯವನ್ನು ಸಹಜವಾಗಿ ವರ್ಣಿಸುತ್ತದೆ.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ಮಾರುಕಟ್ಟೆಯ ಬಯಲುಗಳಲ್ಲಿ
  rationale: ἀγορά ಕೇವಲ ಅಂಗಡಿಗಳ ಮಾರುಕಟ್ಟೆಯಲ್ಲ, ಜನರು ಸೇರುವ ಸಾರ್ವಜನಿಕ ಮಾರುಕಟ್ಟೆ ಪ್ರದೇಶ ಅಥವಾ ಚೌಕವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
- source_word: προσφωνοῦντα
  choice: ಕೂಗಿ ಕರೆಯುವ
  rationale: ಬಹಿರಂಗ ಸ್ಥಳದಲ್ಲಿ ಧ್ವನಿಯಿಂದ ಸಂಬೋಧಿಸುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: τοῖς ἑτέροις
  choice: ಉಳಿದವರನ್ನು
  rationale: ಗ್ರೀಕ್‌ನ ‘ಇತರರು/ಉಳಿದವರು’ ಎಂಬ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭದಿಂದ ಅವರು ಇತರ ಮಕ್ಕಳೆಂದು ತಿಳಿಯುತ್ತದೆ.
