  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನತೆಯ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಮತ್ತು ಸರ್ವನಾಮವನ್ನು ಬಳಸಲಾಗಿದೆ; ‘ಅವನನ್ನು’ ಎಂಬ ಏಕವಚನವು ಹಿಂದಿನ ವಚನದ ಅಧಿಕಾರಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
