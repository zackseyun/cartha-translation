id: MAT.9.19
reference: Matthew 9:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: kn
  text: ಯೇಸು ಎದ್ದು ಅವನನ್ನು ಹಿಂಬಾಲಿಸಿದರು; ಅವರ ಶಿಷ್ಯರೂ ಹಿಂಬಾಲಿಸಿದರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: ಎದ್ದು
  rationale: ἐγείρω ಪದದ ಏಕಕಾಲಿಕ ಕೃದಂತರೂಪವು ಇಲ್ಲಿ ಅಕರ್ಮಕ ಅರ್ಥದಲ್ಲಿ ಮುಂದಿನ ಕ್ರಿಯೆಗೆ ಮುನ್ನ ನಡೆದ ಎದ್ದೇಳುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಎದ್ದು’ ಎಂಬುದು ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಯಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವೂ ನಿಖರವೂ ಆಗಿದೆ.
- source_word: ἠκολούθει
  choice: ಹಿಂಬಾಲಿಸಿದರು
  rationale: ἀκολουθέω ಪದದ ಅಪೂರ್ಣ ಭೂತಕಾಲರೂಪವು ಸಾಗುತ್ತಿದ್ದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸಬಹುದಾದರೂ, ಈ ಕಥನದಲ್ಲಿ ಸರಳ ಭೂತಕಾಲದ ‘ಹಿಂಬಾಲಿಸಿದರು’ ಸಹಜವಾಗಿ ಘಟನೆಯನ್ನು ತಿಳಿಸುತ್ತದೆ ಮತ್ತು ಒಬ್ಬರ ಹಿಂದೆ ಹೋಗುವ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτῷ
  choice: ಅವನನ್ನು
  rationale: ಈ ಸರ್ವನಾಮವು ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಸಭಾಮಂದಿರದ ಅಧಿಕಾರಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಹಿಂಬಾಲಿಸು’ ಎಂಬ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯ ‘ಅವನನ್ನು’ ಸಹಜವಾಗಿದೆ.
- source_word: μαθηταὶ
  choice: ಶಿಷ್ಯರು
  rationale: ಸುವಾರ್ತೆಗಳ ಗುರು–ಶಿಷ್ಯ ಸಂಬಂಧವನ್ನು ‘ಶಿಷ್ಯರು’ ನಿಖರವಾಗಿ ಮತ್ತು ರೂಢಿಯಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ವಿದ್ಯಾರ್ಥಿಗಳು’ ಅತಿಯಾಗಿ ಶೈಕ್ಷಣಿಕವಾಗಿದ್ದು, ‘ಹಿಂಬಾಲಕರು’ ತಾಂತ್ರಿಕ ಅರ್ಥವನ್ನು ದುರ್ಬಲಗೊಳಿಸುತ್ತದೆ.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ಅವರ ಶಿಷ್ಯರೂ ಹಿಂಬಾಲಿಸಿದರು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಎರಡನೆಯ ಖಂಡದಲ್ಲಿ ಕ್ರಿಯಾಪದವನ್ನು ಪುನರುಕ್ತಿಸದಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಪುನರಾವರ್ತಿಸುವುದು ಸಹಜ ಮತ್ತು ಅರ್ಥಸಂದಿಗ್ಧತೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ. ‘ರೂ’ καί ಪದದ ‘ಸಹ/ಕೂಡ’ ಅರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
