id: MAT.9.32
reference: Matthew 9:32
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: kn
  text: ಅವರು ಹೊರಗೆ ಹೋಗುತ್ತಿದ್ದಾಗ, ಇಗೋ, ದೆವ್ವ ಹಿಡಿದಿದ್ದ ಒಬ್ಬ ಮೂಕ ಮನುಷ್ಯನನ್ನು ಆತನ ಬಳಿಗೆ ಕರೆತಂದರು.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಕಿವುಡನಾದ”; ಗ್ರೀಕ್ ಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ “ಮೂಕ” ಅಥವಾ “ಕಿವುಡ” ಎಂದರ್ಥ ಕೊಡಬಹುದು. ಮುಂದಿನ ವಚನದಲ್ಲಿ ಅವನು ಮಾತನಾಡಿದನೆಂದು ಇರುವುದರಿಂದ ಇಲ್ಲಿ “ಮೂಕ” ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ದೆವ್ವದ ವಶದಲ್ಲಿದ್ದ” ಅಥವಾ “ದೆವ್ವಪೀಡಿತನಾಗಿದ್ದ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: ಅವರು ಹೊರಗೆ ಹೋಗುತ್ತಿದ್ದಾಗ
  rationale: ಸಂಬಂಧವಿಭಕ್ತಿ ಸ್ವತಂತ್ರ ರಚನೆಯ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; δέ ಸೂಚಿಸುವ ದೃಶ್ಯಬದಲಾವಣೆಯನ್ನು ಪ್ರತ್ಯೇಕ ಸಂಯೋಜಕದಿಂದ ಭಾರಗೊಳಿಸಿಲ್ಲ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಘಟನೆಯತ್ತ ಗಮನ ಸೆಳೆಯುವ ಮತ್ತು ನಿರೂಪಣೆಗೆ ಜೀವಂತಿಕೆ ನೀಡುವ ಮೂಲದ ಸಂವಾದಾತ್ಮಕ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: προσήνεγκαν αὐτῷ
  choice: ಆತನ ಬಳಿಗೆ ಕರೆತಂದರು
  rationale: ಯಾರನ್ನಾದರೂ ಯೇಸುವಿನ ಬಳಿಗೆ ತರುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ ಮತ್ತು αὐτῷ ಅನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ἄνθρωπον
  choice: ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು
  rationale: ಈ ಗುಣಪಡಿಸುವಿಕೆಯ ನಿರೂಪಣೆಯಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಪುರುಷ ವ್ಯಕ್ತಿಯನ್ನು ನಿಖರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: κωφὸν
  choice: ಮೂಕನಾದ
  rationale: κωφός ಕಿವುಡ ಅಥವಾ ಮೂಕ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು; ಮುಂದಿನ ವಚನದಲ್ಲಿ ಅವನು ಮಾತನಾಡಿದನೆಂಬುದರಿಂದ ಇಲ್ಲಿ ‘ಮೂಕ’ ಸಂದರ್ಭೋಚಿತವಾಗಿದೆ.
- source_word: δαιμονιζόμενον
  choice: ದೆವ್ವ ಹಿಡಿದಿದ್ದ
  rationale: ಸುವಾರ್ತೆಗಳ ಭೂತಬಾಧೆಯ ಸಂದರ್ಭಕ್ಕೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ, ಸಹಜ ಕನ್ನಡ; ಸ್ಥಿತಿಯ ನಿಖರ ವಿಧಾನ ಕುರಿತು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ಹೇಳುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಭೂತಬಾಧೆಯನ್ನು ಸೂಚಿಸುವ ಭಾಷೆ
  choice: ದೆವ್ವ ಹಿಡಿದಿದ್ದ
  alternative: ದೆವ್ವದ ವಶದಲ್ಲಿದ್ದ / ದೆವ್ವಪೀಡಿತನಾಗಿದ್ದ
  rationale: ವಚನವು ನಿಜವಾದ ದೆವ್ವದ ಬಾಧೆಯನ್ನು ನೇರವಾಗಿ ನಿರೂಪಿಸುತ್ತದೆ. ಆಯ್ದ ರೂಪವು ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವೂ ಸ್ಪಷ್ಟವೂ ಆಗಿದ್ದು, ಆ ಬಾಧೆಯ ಸ್ವರೂಪದ ಕುರಿತು ಊಹಾತ್ಮಕ ವಿವರಗಳನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ನಿರೂಪಣಾಶೈಲಿ. ‘ಇಗೋ’ ಮೂಲದ ಗಮನಸೆಳೆಯುವ ಶಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ. ವಿಶೇಷಣಗಳ ಗೊಂದಲ ತಪ್ಪಿಸಲು δαιμονιζόμενον ಅನ್ನು ‘ದೆವ್ವ ಹಿಡಿದಿದ್ದ’ ಎಂದೂ κωφόν ಅನ್ನು ‘ಮೂಕನಾದ’ ಎಂದೂ ಕ್ರಮಬದ್ಧವಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
