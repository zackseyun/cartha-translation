id: MAT.9.18
reference: Matthew 9:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: kn
  text: ಅವನು ಅವರಿಗೆ ಈ ಸಂಗತಿಗಳನ್ನು ಹೇಳುತ್ತಿರುವಾಗ, ಇಗೋ, ಒಬ್ಬ ಅಧಿಕಾರಿಯು ಬಂದು ಅವನಿಗೆ ನಮಸ್ಕರಿಸಿ, “ನನ್ನ ಮಗಳು ಈಗಷ್ಟೇ ಸತ್ತಳು. ಆದರೆ ನೀನು ಬಂದು ಅವಳ ಮೇಲೆ ನಿನ್ನ ಕೈಯನ್ನು ಇಡು; ಅವಳು ಬದುಕುವಳು” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಕಥನದಲ್ಲಿನ ಹಠಾತ್ ಗಮನಸೆಳೆಯುವ ಸೂಚನೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἄρχων
  choice: ಅಧಿಕಾರಿ
  rationale: ಯಾವ ವಿಧದ ಅಧಿಕಾರಿ ಎಂಬುದನ್ನು ಮತ್ತಾಯನು ಇಲ್ಲಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದಿರುವುದರಿಂದ ಸಾಮಾನ್ಯ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: προσεκύνει
  choice: ಅವನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಗೌರವಪೂರ್ವಕವಾಗಿ ನೆಲಕ್ಕೆ ಬಾಗುವ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಆರಾಧನೆ ಎಂಬ ನಿರ್ದಿಷ್ಟ ಧಾರ್ಮಿಕ ಅರ್ಥವನ್ನು ಅನಿವಾರ್ಯವಾಗಿ ಹೇರದು.
- source_word: ἄρτι ἐτελεύτησεν
  choice: ಈಗಷ್ಟೇ ಸತ್ತಳು
  rationale: ἄρτιಯ ತಕ್ಷಣದ ಕಾಲಸೂಚನೆಯನ್ನೂ ἐτελεύτησενನ ಸ್ಪಷ್ಟ ಮರಣಾರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ζήσεται
  choice: ಬದುಕುವಳು
  rationale: ಭವಿಷ್ಯಕಾಲದ ನೇರ ಹೇಳಿಕೆಯನ್ನು ಉಳಿಸಿ, ಪುನರುತ್ಥಾನ ಎಂಬ ವಿವರಣಾತ್ಮಕ ಪದವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: προσεκύνει ಎಂಬ ಕ್ರಿಯೆಯ ಅರ್ಥ
  choice: ಅವನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು
  alternative: ಅವನನ್ನು ಆರಾಧಿಸಿ
  rationale: ಗ್ರೀಕ್ ಪದವು ನಮಸ್ಕಾರ, ಗೌರವಪೂರ್ವಕ ಅಡ್ಡಬೀಳುವಿಕೆ ಅಥವಾ ಆರಾಧನೆ ಎಂದಾಗಬಹುದು. ಈ ವಾಕ್ಯದಲ್ಲೇ ಉದ್ದೇಶವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನಿರ್ಧರಿಸಲಾಗದ ಕಾರಣ ದೇಹಭಂಗಿಯನ್ನು ಸೂಚಿಸುವ ಅನಿರ್ಣಾಯಕ ಅನುವಾದವನ್ನು ಆರಿಸಲಾಗಿದೆ.
- issue: ಕೈಯಿಟ್ಟ ನಂತರ ಮಗಳು ಬದುಕುವಳೆಂಬ ಮಾತು
  choice: ಆಗ ಅವಳು ಬದುಕುವಳು
  alternative: ಆಗ ಅವಳು ಮತ್ತೆ ಜೀವಂತಳಾಗುವಳು
  rationale: ಮೂಲದ καὶ ζήσεται ಸಂಕ್ಷಿಪ್ತ ಹೇಳಿಕೆಯನ್ನೇ ಉಳಿಸಲಾಗಿದೆ; ‘ಮತ್ತೆ’ ಎಂಬುದು ಸಂದರ್ಭದಿಂದ ಗ್ರಹಿಸಬಹುದಾದರೂ ಮೂಲದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಇಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಗೌರವಯುತವಾಗಿಯೂ ರಚಿಸಲಾಗಿದೆ. ಮೂಲದ ಕಥನಕ್ರಮ, ತುರ್ತುಭಾವ ಮತ್ತು ಅಧಿಕಾರಿಯ ದೃಢ ನಿರೀಕ್ಷೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
