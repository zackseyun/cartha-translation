id: MAT.9.36
reference: Matthew 9:36
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: kn
  text: ಅವರು ಜನಸಮೂಹಗಳನ್ನು ಕಂಡಾಗ, ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟರು; ಏಕೆಂದರೆ ಅವರು ಕುರುಬನಿಲ್ಲದ ಕುರಿಗಳಂತೆ ಕಿರುಕುಳಕ್ಕೊಳಗಾಗಿ ತಳ್ಳಿಹಾಕಲ್ಪಟ್ಟವರಾಗಿದ್ದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಕಿರುಕುಳಕ್ಕೊಳಗಾಗಿ ಅಸಹಾಯಕರಾಗಿದ್ದರು.” ಗ್ರೀಕ್ ಪದಗಳನ್ನು ಜನರು ಜರ್ಜರಿತರಾಗಿ ತಮ್ಮನ್ನು ತಾವು ನೋಡಿಕೊಳ್ಳಲಾಗದ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದರು ಎಂಬ ಅರ್ಥದಲ್ಲಿಯೂ ಗ್ರಹಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ಅವರು ... ಕಂಡಾಗ
  rationale: Aorist participle is naturally expressed as a temporal clause in Kannada. δέ is a mild narrative connective and need not be represented separately where Kannada flow does not require it.
- source_word: τοὺς ὄχλους
  choice: ಜನಸಮೂಹಗಳನ್ನು
  rationale: A current, natural plural equivalent for gathered crowds, avoiding archaic diction.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟರು
  rationale: Expresses deep compassion in dignified, idiomatic Kannada without making the inward-emotion idiom wooden.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: Clearly introduces the reason for Jesus’ compassion.
- source_word: ἐσκυλμένοι
  choice: ಕಿರುಕುಳಕ್ಕೊಳಗಾಗಿ
  rationale: Preserves the sense of being harassed, troubled, or badly treated rather than reducing it merely to weariness.
- source_word: ἐρριμμένοι
  choice: ನೆಲಕ್ಕುರುಳಿದವರಾಗಿದ್ದರು
  rationale: Retains the passive image of having been thrown or cast down; the accompanying footnote records the more interpretive sense ‘helpless.’
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: ಕುರುಬನಿಲ್ಲದ ಕುರಿಗಳಂತೆ
  rationale: Natural Kannada that preserves the pastoral comparison and the crowds’ leaderless vulnerability.
theological_decisions:
- issue: Jesus’ compassion
  choice: ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟರು
  alternative: ಅವರಿಗಾಗಿ ಆಳವಾದ ಕನಿಕರದಿಂದ ಮರುಗಿದರು
  rationale: The chosen wording clearly conveys mercy and compassion while remaining natural and avoiding unnecessary interpretive expansion.
- issue: Condition of the crowds
  choice: ಕಿರುಕುಳಕ್ಕೊಳಗಾಗಿ ನೆಲಕ್ಕುರುಳಿದವರಾಗಿದ್ದರು
  alternative: ಕಿರುಕುಳಕ್ಕೊಳಗಾಗಿ ಅಸಹಾಯಕರಾಗಿದ್ದರು
  rationale: The main text stays close to the concrete passive imagery of the Greek participles. The alternative reflects a legitimate interpretive understanding but is not allowed to replace the source image silently.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ವಾಕ್ಯಶೈಲಿ. ಯೇಸುವನ್ನು ಸೂಚಿಸುವ ಗೌರವ ಬಹುವಚನವನ್ನು ಬಳಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಗ್ರೀಕ್‌ನ ರೂಪಕಾತ್ಮಕ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸಿ, ಅರ್ಥವಿವರಣಾತ್ಮಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
