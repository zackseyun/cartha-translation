revisions:
- from: ಅವರು ಜನಸಮೂಹಗಳನ್ನು ಕಂಡಾಗ, ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟರು; ಏಕೆಂದರೆ ಅವರು ಕುರುಬನಿಲ್ಲದ ಕುರಿಗಳಂತೆ ಕಿರುಕುಳಕ್ಕೊಳಗಾಗಿ ನೆಲಕ್ಕುರುಳಿದವರಾಗಿದ್ದರು.[a]
  to: ಅವರು ಜನಸಮೂಹಗಳನ್ನು ಕಂಡಾಗ, ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟರು; ಏಕೆಂದರೆ ಅವರು ಕುರುಬನಿಲ್ಲದ ಕುರಿಗಳಂತೆ ಕಿರುಕುಳಕ್ಕೊಳಗಾಗಿ ತಳ್ಳಿಹಾಕಲ್ಪಟ್ಟವರಾಗಿದ್ದರು.[a]
  rationale: The revision replaces an overly concrete “fallen to the ground” expression with “cast aside,” which better reflects the Greek passive participle ἐρριμμένοι in this pastoral comparison. The footnote remains anchored to the paired description and preserves the legitimate interpretive alternative.
  reviewer_model: gpt-5.6-terra
