id: MAT.9.8
reference: Matthew 9:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: kn
  text: ಆದರೆ ಜನಸಮೂಹಗಳು ಅದನ್ನು ಕಂಡಾಗ, ಅವರು ಭಯಪಟ್ಟರು[a]; ಮನುಷ್ಯರಿಗೆ[b] ಇಂಥ ಅಧಿಕಾರವನ್ನು ಕೊಟ್ಟ ದೇವರನ್ನು ಮಹಿಮೆಪಡಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಭಕ್ತಿಭರಿತ ವಿಸ್ಮಯಕ್ಕೆ ಒಳಗಾದರು.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ಹೆಚ್ಚು ನೇರ ಅರ್ಥ ‘ಭಯಪಟ್ಟರು’; ಆದರೆ ಇಲ್ಲಿ ಆ ಭಯವು ಭಕ್ತಿಭರಿತ ವಿಸ್ಮಯವನ್ನೂ ಒಳಗೊಂಡಿರಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಮನುಷ್ಯರಿಗೆ’ ಎಂಬ ಗ್ರೀಕ್ ಪದವನ್ನು ‘ಮಾನವರಿಗೆ’ ಅಥವಾ ‘ಜನರಿಗೆ’ ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ಅದನ್ನು ಕಂಡಾಗ
  rationale: ಭೂತಕಾಲದ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಕಾಲಸೂಚಕ ಉಪವಾಕ್ಯವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ. ‘ಅದನ್ನು’ ಎಂಬುದು ಸಂದರ್ಭದಲ್ಲಿನ ಕ್ಷಮಾಪಣೆ ಮತ್ತು ಗುಣಪಡಿಸುವ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಕಥನದ ತಿರುವನ್ನೂ ಜನರ ಪ್ರತಿಕ್ರಿಯೆಯತ್ತ ಸಾಗುವ ವ್ಯತ್ಯಾಸವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
- source_word: οἱ ὄχλοι
  choice: ಜನಸಮೂಹಗಳು
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನವನ್ನು ಉಳಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆಗಿದೆ.
- source_word: ἐφοβήθησαν
  choice: ಭಯಪಟ್ಟರು
  rationale: φοβέομαι ಎಂಬ ಕ್ರಿಯಾಪದದ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಭಯ ಮತ್ತು ಭಕ್ತಿಭರಿತ ವಿಸ್ಮಯದ ನಡುವಿನ ಸಂದರ್ಭಸಾಧ್ಯ ಒತ್ತಡವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಪರಿಹರಿಸುವುದಿಲ್ಲ.
- source_word: ἐδόξασαν
  choice: ಮಹಿಮೆಪಡಿಸಿದರು
  rationale: δοξάζω ಎಂಬ ಪ್ರಮುಖ ಧಾರ್ಮಿಕ ಪದದ ಅರ್ಥ ಮತ್ತು ಪದಸಂಗತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಹೊಗಳಿದರು’ಗಿಂತ ಹೆಚ್ಚು ನಿಖರವಾಗಿದೆ.
- source_word: τὸν θεὸν
  choice: ದೇವರನ್ನು
  rationale: ಕ್ರಿಯಾಪದದ ನೇರ ಕರ್ಮವಾಗಿ ಮೂಲದ ವ್ಯಾಕರಣ ಸಂಬಂಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: τὸν δόντα
  choice: ಕೊಟ್ಟ
  rationale: ದೇವರನ್ನು ವಿವರಿಸುವ ಗುಣವಾಚಕ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಂಬಂಧಾರ್ಥಕ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἐξουσίαν
  choice: ಅಧಿಕಾರವನ್ನು
  rationale: ἐξουσία ಕೇವಲ ಶಕ್ತಿಯನ್ನಲ್ಲ, ಅಧಿಕಾರ ಅಥವಾ ಹಕ್ಕನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸುವ ಸಂದರ್ಭದಲ್ಲಿದು ಮುಖ್ಯ.
- source_word: τοιαύτην
  choice: ಇಂಥ
  rationale: ‘ಈ ರೀತಿಯ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τοῖς ἀνθρώποις
  choice: ಮನುಷ್ಯರಿಗೆ
  rationale: ἄνθρωποι ಎಂಬ ಬಹುವಚನ ರೂಪವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ಮನುಷ್ಯರು’ ಸಂದರ್ಭಾನುಸಾರ ಪುರುಷರನ್ನು ಅಥವಾ ಮಾನವರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸಬಲ್ಲುದರಿಂದ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಜನರ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಭಯವೆಂದು ಅನುವಾದಿಸಬೇಕೋ ಭಕ್ತಿಭರಿತ ವಿಸ್ಮಯವೆಂದು ಅನುವಾದಿಸಬೇಕೋ
  choice: ಅವರು ಭಯಪಟ್ಟರು
  alternative: ಅವರು ಭಕ್ತಿಭರಿತ ವಿಸ್ಮಯಗೊಂಡರು
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ನೇರವಾಗಿ ಭಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸಂದರ್ಭವು ಭಕ್ತಿಭರಿತ ವಿಸ್ಮಯವನ್ನೂ ಒಳಗೊಂಡಿರಬಹುದು; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಲವಾದ ಮೂಲಾರ್ಥವನ್ನು ಉಳಿಸಿ ಪರ್ಯಾಯ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- issue: τοῖς ἀνθρώποις ಎಂಬುದರ ವ್ಯಾಪ್ತಿ
  choice: ಮನುಷ್ಯರಿಗೆ
  alternative: ಮಾನವರಿಗೆ / ಜನರಿಗೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ವ್ಯಾಕರಣಾತ್ಮಕ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವು ಪುರುಷರನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಅಥವಾ ಮಾನವಕುಲವನ್ನು ಪ್ರತಿನಿಧಿಯಾಗಿ ಸೂಚಿಸಬಹುದು. ‘ಮನುಷ್ಯರಿಗೆ’ ಈ ಒತ್ತಡವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಾಮಾನ್ಯ ಮಾನವ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಗ್ರಾಹ್ಯವಾಗುವ ಶೈಲಿ. ಮೂಲದ ಬಹುವಚನ, ಭಯದ ತೀವ್ರತೆ ಮತ್ತು ‘ಮನುಷ್ಯರಿಗೆ’ ಎಂಬ ಪದದ ವ್ಯಾಪ್ತಿಯ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
