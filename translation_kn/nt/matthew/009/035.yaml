id: MAT.9.35
reference: Matthew 9:35
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: kn
  text: ಯೇಸು ಎಲ್ಲಾ ಪಟ್ಟಣಗಳಲ್ಲಿಯೂ ಹಳ್ಳಿಗಳಲ್ಲಿಯೂ ಸಂಚರಿಸುತ್ತಾ, ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ ಬೋಧಿಸುತ್ತಾ, ರಾಜ್ಯದ ಶುಭಸಂದೇಶವನ್ನು[a] ಸಾರುತ್ತಾ, ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ[b] ಗುಣಪಡಿಸುತ್ತಿದ್ದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ರಾಜ್ಯದ ಸುವಾರ್ತೆಯನ್ನು.”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ದೌರ್ಬಲ್ಯವನ್ನೂ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: ಸಂಚರಿಸುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಯೇಸುವಿನ ಮುಂದುವರಿದ ಸಂಚಾರವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ರೂಪವು ಆ ನಿರಂತರ ಚಟುವಟಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: ಎಲ್ಲಾ ಪಟ್ಟಣಗಳಲ್ಲಿಯೂ ಹಳ್ಳಿಗಳಲ್ಲಿಯೂ
  rationale: πόλεις ಮತ್ತು κώμας ಸೂಚಿಸುವ ದೊಡ್ಡ ಹಾಗೂ ಸಣ್ಣ ವಸತಿಗಳ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸಿ, πάσας‌ನ ಸಮಗ್ರ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: διδάσκων
  choice: ಬೋಧಿಸುತ್ತಾ
  rationale: ಮುಂದುವರಿದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಕೃದಂತವನ್ನು ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಆಧುನಿಕ ಧಾರ್ಮಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದೆ.
- source_word: συναγωγαῖς αὐτῶν
  choice: ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ
  rationale: ಯೆಹೂದ್ಯರ ಐತಿಹಾಸಿಕ ಆರಾಧನಾ ಮತ್ತು ಬೋಧನಾ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದವನ್ನು ಬಳಸುತ್ತಾ αὐτῶν ಎಂಬ ಸರ್ವನಾಮವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: κηρύσσων
  choice: ಸಾರುತ್ತಾ
  rationale: ಸಾರ್ವಜನಿಕವಾಗಿ ಪ್ರಕಟಿಸುವ κηρύσσω ಎಂಬ ಪದದ ಘೋಷಣಾತ್ಮಕ ಬಲವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ರಾಜ್ಯದ ಶುಭಸಂದೇಶವನ್ನು
  rationale: εὐαγγέλιον‌ನ ಮೂಲ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಪಾರದರ್ಶಕವಾಗಿ ತಿಳಿಸುತ್ತದೆ; τῆς βασιλείας ಅನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: θεραπεύων
  choice: ಗುಣಪಡಿಸುತ್ತಿದ್ದರು
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿನ ರೋಗನಿವಾರಣೆಯ ಸಂದರ್ಭದಲ್ಲಿ θεραπεύωಗೆ ಸಹಜ ಮತ್ತು ನೇರ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
- source_word: πᾶσαν νόσον
  choice: ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ
  rationale: πᾶσαν‌ನ ಸಮಗ್ರತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಿ νόσος ಅನ್ನು ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ನಿಖರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: πᾶσαν μαλακίαν
  choice: ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ
  rationale: μαλακία ಸೂಚಿಸಬಹುದಾದ ಕಾಯಿಲೆ ಅಥವಾ ದೈಹಿಕ ದುರ್ಬಲ ಸ್ಥಿತಿಯನ್ನು ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿ ತಿಳಿಸಿ, νόσος‌ನೊಂದಿಗೆ ಇರುವ ಪದಭೇದವನ್ನೂ ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: εὐαγγέλιον ಪದದ ಅನುವಾದ
  choice: ಶುಭಸಂದೇಶ
  alternative: ಸುವಾರ್ತೆ
  rationale: ಸಾಂಪ್ರದಾಯಿಕ ಪದವನ್ನು ಕಡ್ಡಾಯವಾಗಿ ಬಳಸದೆ ಗ್ರೀಕ್ ಪದದ ‘ಒಳ್ಳೆಯ ಸುದ್ದಿ’ ಎಂಬ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν‌ನ ವ್ಯಾಪ್ತಿ
  choice: ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ
  alternative: ಎಲ್ಲಾ ರೋಗಗಳನ್ನೂ ಎಲ್ಲಾ ದೌರ್ಬಲ್ಯಗಳನ್ನೂ
  rationale: ಎರಡೂ ನಾಮಪದಗಳೊಂದಿಗೆ ಪುನರಾವರ್ತಿತ πᾶσαν ಅನ್ನು ಉಳಿಸಿ ವಾಕ್ಯದ ಸಮಗ್ರ ವ್ಯಾಪ್ತಿಯನ್ನು ಮೃದುಗೊಳಿಸದೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಇದು ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಣಯವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ರೂಪವನ್ನು ಬಳಸಿದ್ದು, ಮೂರು ಸಮಕಾಲೀನ ಚಟುವಟಿಕೆಗಳನ್ನು ‘-ತ್ತಾ’ ರೂಪಗಳಿಂದ ಜೋಡಿಸಲಾಗಿದೆ. ‘ದೇವರ ರಾಜ್ಯ’ ಎಂದು ವಿಸ್ತರಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ‘ರಾಜ್ಯ’ ಎಂಬ ಅನಿರ್ದಿಷ್ಟ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
