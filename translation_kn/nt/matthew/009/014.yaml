id: MAT.9.14
reference: Matthew 9:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: kn
  text: ಆಗ ಯೋಹಾನನ ಶಿಷ್ಯರು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು, “ನಾವೂ ಫರಿಸಾಯರೂ ಆಗಾಗ[a] ಉಪವಾಸ ಮಾಡುತ್ತೇವೆ; ಆದರೆ ನಿನ್ನ ಶಿಷ್ಯರು ಉಪವಾಸ ಮಾಡುವುದಿಲ್ಲವೇಕೆ?” ಎಂದು ಕೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಹೆಚ್ಚಾಗಿ” ಅಥವಾ “ಅನೇಕ ಬಾರಿ”; ಉಪವಾಸ ಮಾಡುವುದರೊಂದಿಗೆ ಬಂದಿರುವ ಗ್ರೀಕ್ πολλά ಪದವು ಆ ಆಚರಣೆಯ ಪುನರಾವರ್ತಿತ ಸ್ವರೂಪವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಕಾಲಾನುಕ್ರಮವಾಗಿ ಪರಿಚಯಿಸುವ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: προσέρχονται αὐτῷ
  choice: ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು
  rationale: προσέρχομαι ಎಂಬುದು ‘ಬಳಿಗೆ ಬರು/ಸಮೀಪಿಸು’ ಎಂಬ ಅರ್ಥ ಕೊಡುತ್ತದೆ. ಹಿಂದಿನ ಸಂದರ್ಭದ ಸೂಚ್ಯ ಸರ್ವನಾಮ ಯಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಗೊಳಿಸಲು ‘ಯೇಸುವಿನ’ ಎಂದು ಬಳಸಲಾಗಿದೆ.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ಯೋಹಾನನ ಶಿಷ್ಯರು
  rationale: ಗ್ರೀಕ್ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದ ಸ್ವಾಮ್ಯರೂಪದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λέγοντες
  choice: ಎಂದು ಕೇಳಿದರು
  rationale: ಮಾತಿನ ವಿಷಯವು ಪ್ರಶ್ನೆಯಾಗಿರುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ‘ಎಂದು ಕೇಳಿದರು’ ಎಂಬುದು ಸಹಜ; ಅವರು ಬಂದು ಪ್ರಶ್ನಿಸಿದ ಕ್ರಿಯಾಪ್ರವಾಹವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: Διὰ τί
  choice: ಮಾಡುವುದಿಲ್ಲವೇಕೆ?
  rationale: ಕಾರಣವನ್ನು ಕೇಳುವ ಪ್ರಶ್ನೆಯನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯಕ್ರಮದಲ್ಲಿ ಕೊನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: ನಾವೂ ಫರಿಸಾಯರೂ
  rationale: ಎರಡೂ ಗುಂಪುಗಳನ್ನು ಒಟ್ಟಿಗೆ ಒತ್ತಿಹೇಳುವ ಗ್ರೀಕ್ ರಚನೆಯನ್ನು ಕನ್ನಡದ ‘-ಊ’ ಸಮುಚ್ಚಯ ರೂಪದಿಂದ ಉಳಿಸಲಾಗಿದೆ.
- source_word: νηστεύομεν
  choice: ಉಪವಾಸ ಮಾಡುತ್ತೇವೆ
  rationale: ಧಾರ್ಮಿಕ ಉದ್ದೇಶದಿಂದ ಆಹಾರ ತ್ಯಜಿಸುವ ಪದ್ಧತಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಅರ್ಥವಾಗುವ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಪದಪ್ರಯೋಗ.
- source_word: πολλά
  choice: ಆಗಾಗ
  rationale: νηστεύω ಜೊತೆಗೆ ಕ್ರಿಯಾವಿಶೇಷಣವಾಗಿ ಬಳಕೆಯಾದ πολλά ಉಪವಾಸದ ಪುನರಾವರ್ತಿತ ಅಥವಾ ಆಗಾಗಿನ ಆಚರಣೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: οἱ δὲ μαθηταί σου
  choice: ಆದರೆ ನಿನ್ನ ಶಿಷ್ಯರು
  rationale: δέ ಸೂಚಿಸುವ ವ್ಯತ್ಯಾಸವನ್ನು ‘ಆದರೆ’ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὐ νηστεύουσιν
  choice: ಉಪವಾಸ ಮಾಡುವುದಿಲ್ಲ
  rationale: ವರ್ತಮಾನಕಾಲವು ಇಲ್ಲಿ ಒಂದೇ ಕ್ಷಣದ ಕ್ರಿಯೆಗಿಂತ ಸಾಮಾನ್ಯ ಆಚರಣೆಯ ಮಾದರಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಉಪವಾಸದ ಕುರಿತ ದೂರಿನ ಸ್ವರೂಪ
  choice: ಪ್ರಶ್ನೆಯನ್ನು ಎರಡು ಗುಂಪುಗಳ ರೂಢಿಯಾದ ಧಾರ್ಮಿಕ ಆಚರಣೆಗಳ ಹೋಲಿಕೆಯಾಗಿಯೇ ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
  alternative: ಯೇಸುವಿನ ಶಿಷ್ಯರು ಕಡ್ಡಾಯ ಧಾರ್ಮಿಕ ಕರ್ತವ್ಯವನ್ನು ನಿರ್ಲಕ್ಷಿಸುತ್ತಿದ್ದಾರೆ ಎಂಬ ಆರೋಪವಾಗಿ ಅಥವಾ ಒಂದೇ ನಿರ್ದಿಷ್ಟ ಉಪವಾಸದ ಸಂದರ್ಭವಾಗಿ ಅರ್ಥೈಸುವುದು.
  rationale: ವರ್ತಮಾನಕಾಲದ ಕ್ರಿಯಾಪದಗಳು ಮತ್ತು πολλά ಸಾಮಾನ್ಯವಾಗಿ ಮರುಕಳಿಸುವ ಪದ್ಧತಿಯನ್ನು ಸೂಚಿಸುತ್ತವೆ. ಮೂಲಪಠ್ಯಕ್ಕಿಂತ ಬಲವಾದ ಧಾರ್ಮಿಕ ತೀರ್ಪನ್ನು ಭಾಷಾಂತರವು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಪ್ರಶ್ನೆಯ ವ್ಯತ್ಯಾಸ ಮತ್ತು ರೂಢಿಯಾದ ಆಚರಣೆಯ ಅರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
