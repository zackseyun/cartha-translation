id: MAT.9.31
reference: Matthew 9:31
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: kn
  text: ಆದರೆ ಅವರು ಹೊರಗೆ ಹೋದ ಬಳಿಕ, ಆ ಪ್ರದೇಶದಾದ್ಯಂತ ಆತನ ಸುದ್ದಿಯನ್ನು ಹಬ್ಬಿಸಿದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಆ ನಾಡಿನಾದ್ಯಂತ.” ಗ್ರೀಕ್‌ನ γῆ ಪದಕ್ಕೆ ‘ನಾಡು,’ ‘ಪ್ರದೇಶ’ ಅಥವಾ ‘ಭೂಭಾಗ’ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಯೇಸು ನೀಡಿದ ಕಟ್ಟುನಿಟ್ಟಿನ ಎಚ್ಚರಿಕೆಗೆ ವಿರುದ್ಧವಾಗಿ ನಡೆದದ್ದನ್ನು ಸೂಚಿಸುವ ಸೌಮ್ಯ ವ್ಯತಿರಿಕ್ತತೆಯನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐξελθόντες
  choice: ಅವರು ಹೊರಗೆ ಹೋದ ಬಳಿಕ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿತವಾಗಿ ನಡೆದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಏರಿಸ್ಟ್ ಕೃದಂತದ ಕಾಲಾನುಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: διεφήμισαν
  choice: ಸುದ್ದಿಯನ್ನು ಹಬ್ಬಿಸಿದರು
  rationale: ವಿಷಯವನ್ನು ವ್ಯಾಪಕವಾಗಿ ಪ್ರಸಾರಮಾಡಿದರು ಎಂಬ ಕ್ರಿಯಾಪದದ ಅರ್ಥವನ್ನು ಆಧುನಿಕ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: αὐτὸν
  choice: ಆತನ ಸುದ್ದಿಯನ್ನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ನೇರ ಕರ್ಮವಾಗಿರುವ ‘ಆತನನ್ನು’ ಎಂಬುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಆತನ ಸುದ್ದಿ’ ಎಂದು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಅವರು ಆತನ ಕುರಿತು ಪ್ರಸಾರಮಾಡಿದರು ಎಂಬ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: ಆ ಪ್ರದೇಶದಾದ್ಯಂತ
  rationale: ἐν ὅλῃ ಎಂಬ ವ್ಯಾಪಕ ವಿತರಣಾರ್ಥವನ್ನು ‘ದಾದ್ಯಂತ’ ಹಿಡಿದಿಡುತ್ತದೆ; γῆಗೆ ಈ ಸ್ಥಳೀಯ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಪ್ರದೇಶ’ ಸೂಕ್ತವಾದರೂ ‘ನಾಡು’ ಎಂಬ ಅರ್ಥವೂ ಸಾಧ್ಯ.
theological_decisions:
- issue: γῆ ಪದದ ಭೌಗೋಳಿಕ ವ್ಯಾಪ್ತಿ
  choice: ಪ್ರದೇಶ
  alternative: ನಾಡು
  rationale: ಸಂದರ್ಭವು ಯೇಸುವಿನ ಸುದ್ದಿ ಹರಡಿದ ಸ್ಥಳೀಯ ಭೂಭಾಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಪ್ರದೇಶ’ ವ್ಯಾಪ್ತಿಯನ್ನು ಅತಿರಂಜಿತಗೊಳಿಸದೆ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ಮೂಲಪದದಲ್ಲಿರುವ ‘ನಾಡು’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಪೂರ್ಣವೂ ಆದ ನಿರೂಪಣೆ. ‘ಆತನು’ ರೂಪವು ಸುವಾರ್ತಾ ನಿರೂಪಣೆಯ ಘನತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ವಾಕ್ಯರಚನೆ ಸರಳವಾಗಿ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿದೆ.
