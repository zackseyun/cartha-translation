source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: kn
  text: ಆದ್ದರಿಂದ ಕೊಯ್ಲಿನ ಒಡೆಯನನ್ನು, ತನ್ನ ಕೊಯ್ಲಿನೊಳಗೆ ಕೆಲಸಗಾರರನ್ನು ಕಳುಹಿಸಬೇಕೆಂದು ಮನಃಪೂರ್ವಕವಾಗಿ ಬೇಡಿಕೊಳ್ಳಿರಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಕೆಲಸಗಾರರನ್ನು ಹೊರಕ್ಕೆ ಕಳುಹಿಸಬೇಕೆಂದು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸರಳವಾದ ‘ಕಳುಹಿಸು’ ಎಂಬುದಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಲವುಳ್ಳದ್ದಾಗಿದೆ. ಆದರೆ ಇಲ್ಲಿ ಕೆಲಸಗಾರರನ್ನು ಕೊಯ್ಲಿನ ಕಾರ್ಯಕ್ಕೆ ರವಾನಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: ಮನಃಪೂರ್ವಕವಾಗಿ ಬೇಡಿಕೊಳ್ಳಿರಿ
  rationale: δέομαι ಎಂಬ ಕ್ರಿಯಾಪದವು ತುರ್ತಾಗಿ ಅಥವಾ ಕಳಕಳಿಯಿಂದ ಬೇಡುವ ಅರ್ಥ ಹೊಂದಿದೆ. ‘ಮನಃಪೂರ್ವಕವಾಗಿ ಬೇಡಿಕೊಳ್ಳಿರಿ’ ಎಂಬುದು ಪ್ರಾರ್ಥನೆಯ ಸಂದರ್ಭವನ್ನೂ ಕಳಕಳಿಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὖν
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿರುವ ‘ಕೊಯ್ಲು ಬಹಳ, ಕೆಲಸಗಾರರು ಕಡಿಮೆ’ ಎಂಬ ಮಾತಿನಿಂದ ಬರುವ ನಿರ್ಣಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: κυρίου
  choice: ಒಡೆಯನನ್ನು
  rationale: ಈ ಕೃಷಿರೂಪಕದಲ್ಲಿ κύριος ಕೊಯ್ಲಿನ ಮೇಲೆ ಅಧಿಕಾರ ಮತ್ತು ಸ್ವಾಮ್ಯ ಹೊಂದಿರುವವನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕೊಯ್ಲಿನ ಒಡೆಯ’ ಎಂಬುದು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಆ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಅವನು ಯಾರು ಎಂಬುದನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: θερισμοῦ
  choice: ಕೊಯ್ಲು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಕೊಯ್ಲಿನ ರೂಪಕವನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ಬದಲಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὅπως
  choice: ಬೇಕೆಂದು
  rationale: ಬೇಡಿಕೆಯ ವಿಷಯವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಪರಿಚಯಿಸುತ್ತದೆ.
- source_word: ἐκβάλῃ
  choice: ಕಳುಹಿಸಬೇಕೆಂದು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಕೆಲಸಗಾರರನ್ನು ಕೊಯ್ಲಿನ ಕಾರ್ಯಕ್ಕೆ ರವಾನಿಸುವ ಅರ್ಥವೇ ಮುಖ್ಯ. ಆದರೆ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಹೆಚ್ಚು ಬಲವಾದ ‘ಹೊರಡಿಸು/ತಳ್ಳಿಕಳುಹಿಸು’ ಎಂಬ ಛಾಯೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐργάτας
  choice: ಕೆಲಸಗಾರರನ್ನು
  rationale: ಕೊಯ್ಲಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುವವರನ್ನು ಸೂಚಿಸುವ ಸರಳ, ಆಧುನಿಕ ಮತ್ತು ವ್ಯಾಪಕವಾಗಿ ಅರ್ಥವಾಗುವ ಕನ್ನಡ ಪದ.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: ತನ್ನ ಕೊಯ್ಲಿಗೆ
  rationale: εἰς ಸೂಚಿಸುವ ಗುರಿ ಅಥವಾ ಚಲನವನ್ನೂ αὐτοῦ ಸೂಚಿಸುವ ಸ್ವಾಮ್ಯವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ‘ಹೊಲ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ‘ಕೊಯ್ಲಿನ ಒಡೆಯ’ ಯಾರು ಎಂಬ ಗುರುತು
  choice: ‘ಕೊಯ್ಲಿನ ಒಡೆಯ’ ಎಂದಷ್ಟೇ ಅನುವಾದಿಸಿ, ಅವನು ತಂದೆಯೇ, ಯೇಸುವೇ ಅಥವಾ ದೇವರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತಾನೆಯೇ ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ.
  alternative: ತಂದೆ ಎಂದು ಅಥವಾ ಯೇಸು ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಗುರುತಿಸುವುದು.
  rationale: ಈ ವಚನವು ಸೂಚ್ಯವ್ಯಕ್ತಿಯನ್ನು ‘ಕೊಯ್ಲಿನ ಒಡೆಯ’ ಎಂಬುದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಸ್ಪಷ್ಟತೆಯಿಂದ ಗುರುತಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಮೂಲದಲ್ಲಿರುವ ದೇವತಾತ್ತ್ವಿಕ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥವನ್ನು ಬಳಸಲಾಗಿದೆ. ಕೃಷಿಯ ‘ಕೊಯ್ಲು’ ರೂಪಕವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಿ, ವಾಕ್ಯವನ್ನು ಸಹಜ ಕನ್ನಡ ಪದಕ್ರಮದಲ್ಲಿ ಕಟ್ಟಲಾಗಿದೆ.
