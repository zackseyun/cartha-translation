review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents δεήθητε, οὖν, κύριος, θερισμός, ἐργάτας, and the possessive αὐτοῦ. However, ‘ತನ್ನ ಕೊಯ್ಲಿಗೆ’ weakens εἰς, which here depicts dispatch into the harvest/work, not merely for its benefit. ‘ಕೊಯ್ಲಿನೊಳಗೆ’ preserves the directional sense without adding ‘field.’
  naturalness: The sentence is understandable and broadly natural in modern standard Kannada. Removing the comma after ‘ಒಡೆಯನನ್ನು’ improves flow. ‘ಮನಃಪೂರ್ವಕವಾಗಿ ಬೇಡಿಕೊಳ್ಳಿರಿ’ is an acceptable reverent and urgent rendering, though ‘ಕಳಕಳಿಯಿಂದ ಪ್ರಾರ್ಥಿಸಿರಿ’ would be less literal; the present choice may stand.
  terminology: ‘ಕೊಯ್ಲಿನ ಒಡೆಯ’ preserves the text’s non-specific title and avoids resolving its referent. ‘ಕೆಲಸಗಾರರು’ is modern and clear. The footnote should represent ἐκβάλῃ as ‘ಹೊರಕ್ಕೆ ಕಳುಹಿಸು’ / ‘ಹೊರಡಿಸು,’ while explaining its forceful nuance; ‘ಹೊರಡಿಸು’ by itself can be ambiguous in Kannada.
  issues:
  - severity: medium
    issue: εἰς τὸν θερισμὸν αὐτοῦ is rendered ‘ತನ್ನ ಕೊಯ್ಲಿಗೆ.’
    rationale: ‘ಗೆ’ can mean ‘for’ and does not adequately retain εἰς as movement/dispatch into the harvest. ‘ತನ್ನ ಕೊಯ್ಲಿನೊಳಗೆ’ retains the metaphorical directional sense and possessive.
  - severity: low
    issue: The footnote’s alternative ‘ಕೆಲಸಗಾರರನ್ನು ಹೊರಡಿಸಬೇಕೆಂದು’ is potentially unclear.
    rationale: In Kannada, ‘ಹೊರಡಿಸು’ can be understood broadly as setting out/sending away. ‘ಹೊರಕ್ಕೆ ಕಳುಹಿಸು’ more transparently reflects the lexical force of ἐκβάλλω; the note can then explain that the contextual meaning is dispatching workers.
  revised_text: ಆದ್ದರಿಂದ ಕೊಯ್ಲಿನ ಒಡೆಯನನ್ನು, ತನ್ನ ಕೊಯ್ಲಿನೊಳಗೆ ಕೆಲಸಗಾರರನ್ನು ಕಳುಹಿಸಬೇಕೆಂದು ಮನಃಪೂರ್ವಕವಾಗಿ ಬೇಡಿಕೊಳ್ಳಿರಿ.[a]
