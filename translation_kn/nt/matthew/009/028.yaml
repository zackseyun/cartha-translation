id: MAT.9.28
reference: Matthew 9:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: kn
  text: ಅವನು ಮನೆಯೊಳಗೆ ಬಂದಾಗ, ಆ ಕುರುಡರು ಅವನ ಬಳಿಗೆ ಬಂದರು. ಆಗ ಯೇಸು ಅವರಿಗೆ, “ನಾನು ಇದನ್ನು ಮಾಡಬಲ್ಲೆನೆಂದು ನೀವು ನಂಬುತ್ತೀರಾ?” ಎಂದು ಕೇಳಿದನು. ಅವರು ಅವನಿಗೆ, “ಹೌದು, ಸ್ವಾಮಿ[a]” ಎಂದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅಯ್ಯಾ.’ ಗ್ರೀಕ್‌ನ κύριε ಎಂಬುದು ಗೌರವಪೂರ್ಣ ಸಂಬೋಧನೆಯಾಗಿರಬಹುದು; ‘ಸ್ವಾಮಿ’ ಎಂಬ ಅನುವಾದವು ಯೇಸುವಿನ ಅಧಿಕಾರವನ್ನು ಅವರು ಗುರುತಿಸಿದ್ದಿರಬಹುದಾದ ಸಾಧ್ಯತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: ಅವನು ಮನೆಯೊಳಗೆ ಬಂದಾಗ
  rationale: ಏಕಕಾಲಿಕ ಕಾಲಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವ aorist participle ಅನ್ನು ಸಹಜ ಕನ್ನಡದ ‘ಬಂದಾಗ’ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; οἰκίαಗೆ ಸಂದರ್ಭೋಚಿತವಾಗಿ ‘ಮನೆ’ ಬಳಸಲಾಗಿದೆ.
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: ಆ ಕುರುಡರು ಅವನ ಬಳಿಗೆ ಬಂದರು
  rationale: προσέρχομαιಯ ‘ಯಾರನ್ನಾದರೂ ಸಮೀಪಿಸುವುದು/ಬಳಿಗೆ ಬರುವುದು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ. ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಇಬ್ಬರು ಪುರುಷರನ್ನು ‘ಆ ಕುರುಡರು’ ಗುರುತಿಸುತ್ತದೆ.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: ಆಗ ಯೇಸು ಅವರಿಗೆ … ಎಂದು ಕೇಳಿದನು
  rationale: ಗ್ರೀಕ್‌ನ historical present ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಗೆ ತಕ್ಕ ಭೂತಕಾಲದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ಪ್ರಶ್ನಾರ್ಥಕ ಮಾತಿನ ಕ್ರಿಯೆಯನ್ನು ‘ಕೇಳಿದನು’ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: ನಾನು ಇದನ್ನು ಮಾಡಬಲ್ಲೆನೆಂದು ನೀವು ನಂಬುತ್ತೀರಾ?
  rationale: πιστεύωಗೆ ‘ನಂಬು’ ಮತ್ತು δύναμαιಗೆ ಸಾಮರ್ಥ್ಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುವ ‘ಮಾಡಬಲ್ಲೆ’ ಬಳಸಲಾಗಿದೆ; τοῦτοಯ ಸೂಚನಾತ್ಮಕ ಅಸ್ಪಷ್ಟತೆ ‘ಇದನ್ನು’ ಎಂಬುದರಲ್ಲಿ ಉಳಿದಿದೆ.
- source_word: Ναί
  choice: ಹೌದು
  rationale: ಸರಳ ದೃಢೀಕರಣವನ್ನು ನೇರವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: κύριε
  choice: ಸ್ವಾಮಿ
  rationale: ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಸಂಬೋಧನೆಯನ್ನೂ ಯೇಸುವಿನ ಅಧಿಕಾರದ ಸಾಧ್ಯ ಗುರುತಿಸುವಿಕೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ಸಾಮಾನ್ಯ ಗೌರವಸೂಚಕವಾಗಿ ಓದುವ ಸಾಧ್ಯತೆಯನ್ನೂ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿಗೆ κύριε ಎಂಬ ನೇರ ಸಂಬೋಧನೆ
  choice: ಸ್ವಾಮಿ
  alternative: ಅಯ್ಯಾ
  rationale: κύριε ಇಲ್ಲಿ ಗೌರವಸೂಚಕ ಸಂಬೋಧನೆಯಾಗಿರಬಹುದು; ಜೊತೆಗೆ ಯೇಸುವಿನ ಅಧಿಕಾರದ ಆಳವಾದ ಅಂಗೀಕಾರವನ್ನೂ ಸೂಚಿಸಬಹುದು. ‘ಸ್ವಾಮಿ’ ಎರಡನೆಯ ಸಾಧ್ಯತೆಯನ್ನು ಅಳಿಸದೆ ಉಳಿಸುತ್ತದೆ, ಆದರೆ ಪಾದಟಿಪ್ಪಣಿ ಮೊದಲನೆಯ ಸಾಧ್ಯತೆಯನ್ನು ತಿಳಿಸುತ್ತದೆ.
- issue: λέγει / λέγουσιν ಎಂಬ historical present ರೂಪಗಳು
  choice: 'ಕನ್ನಡದ ಕಥನಕ್ಕೆ ಸಹಜವಾದ ಭೂತಕಾಲ: ‘ಕೇಳಿದನು’ / ‘ಎಂದರು’'
  alternative: 'ವರ್ತಮಾನಕಾಲ: ‘ಕೇಳುತ್ತಾನೆ’ / ‘ಎನ್ನುತ್ತಾರೆ’'
  rationale: ಗ್ರೀಕ್‌ನ ಕಥನಾತ್ಮಕ ಜೀವಂತಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಯಾಂತ್ರಿಕವಾಗಿ ವರ್ತಮಾನಕಾಲಕ್ಕೆ ಬದಲಿಸುವುದಕ್ಕಿಂತ, ಸಹಜ ಹಾಗೂ ಘನವಾದ ಕನ್ನಡ ಕಥನದಲ್ಲಿ ಭೂತಕಾಲ ಬಳಸುವುದು ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ಸಾರುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸರಳ, ಘನ ಕಥನಶೈಲಿ. ‘ಕುರುಡರು’ ಎಂಬುದು ಮೂಲದ substantival adjective ಅನ್ನು ಸಹಜವಾಗಿ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ. ಒಂದೇ ವಾಕ್ಯದಲ್ಲಿ ಅತಿಯಾದ ಉಪವಾಕ್ಯಭಾರ ತಪ್ಪಿಸಲು ಗ್ರೀಕ್ ವಾಕ್ಯವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿನ್ಯಾಸಗೊಳಿಸಲಾಗಿದೆ.
