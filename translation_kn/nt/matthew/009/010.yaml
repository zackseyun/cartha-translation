id: MAT.9.10
reference: Matthew 9:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: kn
  text: ಆತನು ಆ ಮನೆಯಲ್ಲಿ[b] ಊಟಕ್ಕೆ ಒರಗಿ ಕುಳಿತಿದ್ದಾಗ[a], ಇಗೋ, ಅನೇಕ ತೆರಿಗೆ ವಸೂಲಿಗಾರರೂ ಪಾಪಿಗಳೂ ಬಂದು ಯೇಸು ಮತ್ತು ಆತನ ಶಿಷ್ಯರ ಸಂಗಡ ಊಟಕ್ಕೆ ಒರಗಿ ಕುಳಿತಿದ್ದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಹೆಚ್ಚು ಸಹಜವಾಗಿ, “ಆ ಮನೆಯಲ್ಲಿ ಊಟ ಮಾಡುತ್ತಿದ್ದಾಗ.” ಗ್ರೀಕ್ ಮೂಲವು ಆಗಿನ ಪದ್ಧತಿಯಂತೆ ಊಟಕ್ಕೆ ಒರಗಿ ಕುಳಿತಿದ್ದ ಭಂಗಿಯನ್ನು ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಮೂಲಪಾಠವು ಕೇವಲ “ಆ ಮನೆಯಲ್ಲಿ” ಎಂದು ಹೇಳುತ್ತದೆ; ಈ ವಚನದಲ್ಲಿ ಅದು ಯಾರ ಮನೆಯೆಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο αὐτοῦ ἀνακειμένου
  choice: ಆತನು ... ಊಟಕ್ಕೆ ಒರಗಿಕೊಂಡಿದ್ದಾಗ
  rationale: καὶ ἐγένετο ಇಲ್ಲಿ ಕಥನದ ಕಾಲಸಂಬಂಧಿ ಸಂಕ್ರಮಣವಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘...ಇದ್ದಾಗ’ ಎಂಬ ರೂಪ ಸಹಜವಾಗಿ ಆ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ἀνάκειμαιನ ಭೋಜನಸಂದರ್ಭದ ಒರಗಿಕೊಂಡಿರುವ ಭಂಗಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ಆ ಮನೆಯಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ಪದಬಂಧವು ನಿರ್ದಿಷ್ಟವಾಗಿ ‘ಆ ಮನೆಯಲ್ಲಿ’ ಎನ್ನುತ್ತದೆ; ಮನೆ ಯಾರದು ಎಂಬುದನ್ನು ಈ ವಚನವೇ ಹೇಳದಿರುವುದರಿಂದ ಅದನ್ನು ಅನುವಾದದಲ್ಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಮುಂದಿನ ದೃಶ್ಯಕ್ಕೆ ಗಮನ ಸೆಳೆಯುವ ಗುರುತಿಸಲ್ಪಟ್ಟ ಕಥನ ಸೂಚಕವನ್ನು ಸಹಜವಾದ, ಘನತೆಯ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τελῶναι
  choice: ತೆರಿಗೆ ವಸೂಲಿಗಾರರು
  rationale: ರೋಮನ್ ಕಾಲದ ತೆರಿಗೆ ಸಂಗ್ರಹಿಸುವವರನ್ನು ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಪದಪ್ರಯೋಗ.
- source_word: ἁμαρτωλοὶ
  choice: ಪಾಪಿಗಳು
  rationale: ಇಲ್ಲಿ ವಿಶೇಷಣವು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದ್ದು, ಸಾಮಾಜಿಕ-ಧಾರ್ಮಿಕ ವರ್ಗೀಕರಣವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐλθόντες
  choice: ಬಂದು
  rationale: ಅಓರಿಸ್ಟ್ ಕೃದಂತದ ಕ್ರಮಾರ್ಥವನ್ನು ಕನ್ನಡದ ಸಹಜ ಸಂಯೋಜಕ ಕೃದಂತವು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: συνανέκειντο
  choice: ಸಂಗಡ ಊಟಕ್ಕೆ ಒರಗಿಕೊಂಡರು
  rationale: ಸಹಭೋಜನ ಮತ್ತು ಆಗಿನ ಭೋಜನ ಭಂಗಿ ಎರಡನ್ನೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕೇವಲ ‘ಊಟ ಮಾಡಿದರು’ ಎನ್ನುವುದಕ್ಕಿಂತ ಮೂಲದ ಚಿತ್ರಣವನ್ನು ಹೆಚ್ಚು ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ
  choice: ಯೇಸುವಿನ ಮತ್ತು ಆತನ ಶಿಷ್ಯರ ಸಂಗಡ
  rationale: ಯೇಸು ಎಂಬ ಸ್ಥಾಪಿತ ಕನ್ನಡ ರೂಪವನ್ನೂ μαθηταίಯ ಗುರು-ಅನುಯಾಯಿ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವ ‘ಶಿಷ್ಯರು’ ಎಂಬ ಪದವನ್ನೂ ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಭೋಜನದ ಭಂಗಿ ಮತ್ತು ಮೇಜಿನ ಸಹವಾಸದ ಚಿತ್ರಣ
  choice: ‘ಊಟಕ್ಕೆ ಒರಗಿಕೊಂಡಿದ್ದರು’ ಎಂಬ ಭಾಷೆಯನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಊಟ ಮಾಡುತ್ತಿದ್ದರು’ ಅಥವಾ ‘ಭೋಜನ ಮಾಡುತ್ತಿದ್ದರು’
  rationale: ಮೂಲವು ಕೇವಲ ತಿನ್ನುವ ಕ್ರಿಯೆಯನ್ನಲ್ಲ, ಒಟ್ಟಾಗಿ ಭೋಜನಕ್ಕೆ ಒರಗಿಕೊಂಡಿರುವುದನ್ನು ಹೇಳುತ್ತದೆ. ಈ ಚಿತ್ರಣವು ಸಹಭೋಜನದ ಸಾಮಾಜಿಕ ಮಹತ್ವವನ್ನು ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- issue: ‘ಆ ಮನೆ’ ಯಾರದು ಎಂಬ ಗುರುತು
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಮನೆಯ ಒಡೆಯನನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸದಿರುವುದು
  alternative: ‘ಮತ್ತಾಯನ ಮನೆಯಲ್ಲಿ’ ಅಥವಾ ‘ಅವನ ಮನೆಯಲ್ಲಿ’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಈ ವಚನದಲ್ಲಿ ಕೇವಲ ‘ಆ ಮನೆಯಲ್ಲಿ’ ಎಂದು ಹೇಳುತ್ತದೆ. ಸನ್ನಿವೇಶದಿಂದ ಊಹಿಸಬಹುದಾದ ಗುರುತನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ಮೂಲದ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯೂ ಆದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬ ಗಮನಾಕರ್ಷಕ ಕಥನ ಸೂಚಕವನ್ನೂ, ‘ಊಟಕ್ಕೆ ಒರಗಿಕೊಂಡರು’ ಎಂಬ ಐತಿಹಾಸಿಕ ಭೋಜನ ಭಂಗಿಯನ್ನೂ ಉಳಿಸಲಾಗಿದೆ. ಮನೆಯ ಒಡೆತನವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸಲಾಗಿಲ್ಲ.
