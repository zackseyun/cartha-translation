review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the central image and outcomes accurately: new wine, old leather containers, bursting, spillage, ruin, and preservation of both. However, “ಹಾಗೆ ಹಾಕಿದರೆ” (“if they put it that way”) recasts εἰ δὲ μή γε as a positive condition rather than the Greek warning, “otherwise/if not.”'
  naturalness: The Kannada is generally clear and modern. “ಹೊಸ ಸ್ಥಿತಿಯಲ್ಲಿರುವ ಚರ್ಮದ ಚೀಲಗಳು” is understandable but cumbersome in running text. “ಹೊಸ ಚರ್ಮದ ಚೀಲಗಳು,” with the lexical distinction explained in the footnote, is more idiomatic. “ಕಾಪಾಡಲ್ಪಡುತ್ತವೆ” more directly expresses συντηροῦνται than “ಸುರಕ್ಷಿತವಾಗಿರುತ್ತವೆ.”
  terminology: “ದ್ರಾಕ್ಷಾರಸ” and “ಚರ್ಮದ ಚೀಲಗಳು” are suitable, clear renderings. The distinction between νέος (new wine) and καινός (new/fresh wineskins) should be retained through the footnote without making the main text unnaturally elaborate.
  issues:
  - severity: medium
    issue: The conditional phrase “ಹಾಗೆ ಹಾಕಿದರೆ” does not represent εἰ δὲ μή γε closely.
    rationale: The Greek means “otherwise” or “if not,” introducing the adverse result of putting new wine into old wineskins. “ಇಲ್ಲವಾದರೆ” preserves that warning and its logical relation to the preceding negative statement.
  - severity: low
    issue: “ಹೊಸ ಸ್ಥಿತಿಯಲ್ಲಿರುವ ಚರ್ಮದ ಚೀಲಗಳು” is overly periphrastic.
    rationale: It explains καινούς but is less natural than “ಹೊಸ ಚರ್ಮದ ಚೀಲಗಳು.” The footnote can appropriately document the Greek lexical nuance.
  - severity: low
    issue: “ಸುರಕ್ಷಿತವಾಗಿರುತ್ತವೆ” is somewhat less direct for συντηροῦνται.
    rationale: The verb denotes being preserved/kept. “ಕಾಪಾಡಲ್ಪಡುತ್ತವೆ” expresses the result more precisely in Kannada.
