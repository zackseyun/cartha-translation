id: MAT.9.17
reference: Matthew 9:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: kn
  text: ಹೊಸ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಹಳೆಯ ಚರ್ಮದ ಚೀಲಗಳಲ್ಲಿ ಯಾರೂ ಹಾಕುವುದಿಲ್ಲ. ಇಲ್ಲವಾದರೆ, ಚೀಲಗಳು ಒಡೆದುಹೋಗುತ್ತವೆ; ದ್ರಾಕ್ಷಾರಸವು ಚೆಲ್ಲಿಹೋಗುತ್ತದೆ, ಮತ್ತು ಚೀಲಗಳು ಹಾಳಾಗುತ್ತವೆ. ಬದಲಾಗಿ, ಹೊಸ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಹೊಸ ಚರ್ಮದ ಚೀಲಗಳಲ್ಲಿ ಹಾಕುತ್ತಾರೆ; ಆಗ ಎರಡೂ ಕಾಪಾಡಲ್ಪಡುತ್ತವೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸಕ್ಕೆ νέος (‘ಹೊಸದು,’ ಕಾಲದ ದೃಷ್ಟಿಯಿಂದ ಹೊಸದು) ಎಂಬ ಪದವನ್ನೂ, ಚರ್ಮದ ಚೀಲಗಳಿಗೆ καινός (‘ಹೊಸದು/ತಾಜಾ ಸ್ಥಿತಿಯಲ್ಲಿರುವುದು’) ಎಂಬ ಬೇರೆ ಪದವನ್ನೂ ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: ಯಾರೂ ಹಾಕುವುದಿಲ್ಲ
  rationale: ಹಿಂದಿನ ಉದಾಹರಣೆಗೆ ಮತ್ತೊಂದು ನಕಾರಾತ್ಮಕ ಉದಾಹರಣೆಯನ್ನು ಸೇರಿಸುವ οὐδὲಯ ಸಂಪರ್ಕಾರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಾಮಾನ್ಯ ಹೇಳಿಕೆಯ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἶνον νέον
  choice: ಹೊಸ ದ್ರಾಕ್ಷಾರಸ
  rationale: ಹೊಸದಾಗಿ ತಯಾರಿಸಿದ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ; νέοςನ ಕಾಲಸಂಬಂಧಿತ ಹೊಸತನವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀσκοὺς παλαιούς
  choice: ಹಳೆಯ ಚರ್ಮದ ಚೀಲಗಳು
  rationale: ದ್ರಾಕ್ಷಾರಸವನ್ನು ಇಡಲು ಬಳಸುತ್ತಿದ್ದ ಪ್ರಾಣಿಚರ್ಮದ ಪಾತ್ರೆಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ ಮತ್ತು παλαιόςನ ‘ಹಳೆಯ’ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: εἰ δὲ μή γε
  choice: ಹಾಗೆ ಹಾಕಿದರೆ
  rationale: ಮೂಲದ ನಕಾರಾತ್ಮಕ ಷರತ್ತಿನ ಪರಿಣಾಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ, ಹಿಂದಿನ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಲ್ಲೇಖಿಸಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ῥήγνυνται
  choice: ಒಡೆದುಹೋಗುತ್ತವೆ
  rationale: ಒತ್ತಡದಿಂದ ಚರ್ಮದ ಚೀಲಗಳು ಸೀಳಿ ತೆರೆಯುವ ಅರ್ಥವನ್ನು ಸರಳವಾಗಿ ಮತ್ತು ಜೀವಂತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκχεῖται
  choice: ಚೆಲ್ಲಿಹೋಗುತ್ತದೆ
  rationale: ಚೀಲ ಒಡೆದ ಪರಿಣಾಮವಾಗಿ ದ್ರಾಕ್ಷಾರಸ ನಷ್ಟವಾಗುವುದನ್ನು ಸಂದರ್ಭೋಚಿತವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀπόλλυνται
  choice: ಹಾಳಾಗುತ್ತವೆ
  rationale: ಚೀಲಗಳು ಬಳಕೆಗೆ ಬಾರದಂತಾಗುವ ಪ್ರಾಯೋಗಿಕ ನಾಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅತಿಯಾದ ಸಂಪೂರ್ಣ ವಿನಾಶದ ಅರ್ಥವನ್ನು ಹೇರದು.
- source_word: ἀσκοὺς καινούς
  choice: ಹೊಸ ಸ್ಥಿತಿಯಲ್ಲಿರುವ ಚರ್ಮದ ಚೀಲಗಳು
  rationale: καινός ಸೂಚಿಸುವ ಹೊಸತನ/ತಾಜಾ ಸ್ಥಿತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ, νέος ಎಂಬ ಹೊಸ ದ್ರಾಕ್ಷಾರಸದ ಪದಪ್ರಯೋಗದಿಂದ ಸಾಧ್ಯವಾದಷ್ಟು ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀμφότεροι συντηροῦνται
  choice: ಎರಡೂ ಸುರಕ್ಷಿತವಾಗಿರುತ್ತವೆ
  rationale: ದ್ರಾಕ್ಷಾರಸ ಮತ್ತು ಚೀಲಗಳೆರಡೂ ಕಾಪಾಡಲ್ಪಡುತ್ತವೆ ಎಂಬ ಮೂಲದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: νέος ಮತ್ತು καινός ನಡುವಿನ ವ್ಯತ್ಯಾಸ
  choice: νέος ಅನ್ನು ‘ಹೊಸ’ ಎಂದೂ καινός ಅನ್ನು ‘ಹೊಸ ಸ್ಥಿತಿಯಲ್ಲಿರುವ’ ಎಂದೂ ಅನುವಾದಿಸಲಾಗಿದೆ
  alternative: ಎರಡನ್ನೂ ಕೇವಲ ‘ಹೊಸ’ ಎಂದು ಅನುವಾದಿಸುವುದು
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಎರಡು ವಿಭಿನ್ನ ವಿಶೇಷಣಗಳನ್ನು ಬಳಸುತ್ತದೆ. ದ್ರಾಕ್ಷಾರಸವು ಕಾಲದ ದೃಷ್ಟಿಯಿಂದ ಹೊಸದು; ಚರ್ಮದ ಚೀಲಗಳು ಸ್ಥಿತಿಯ ದೃಷ್ಟಿಯಿಂದ ಹೊಸವು ಅಥವಾ ಇನ್ನೂ ಬಳಕೆಗೆ ಯೋಗ್ಯವಾದವು. ಈ ಸೂಕ್ಷ್ಮ ವ್ಯತ್ಯಾಸವನ್ನು ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಪ್ರಾಚೀನ ἀσκός ಅನ್ನು ‘ಚರ್ಮದ ಚೀಲ’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ [a] ಗುರುತು ಸಂಬಂಧಿತ ವಾಕ್ಯದ ಕೊನೆಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
