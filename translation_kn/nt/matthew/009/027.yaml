id: MAT.9.27
reference: Matthew 9:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: kn
  text: ಯೇಸು ಅಲ್ಲಿಂದ ಮುಂದೆ ಹೋಗುತ್ತಿದ್ದಾಗ, ಇಬ್ಬರು ಕುರುಡರು ಆತನನ್ನು ಹಿಂಬಾಲಿಸುತ್ತಾ, “ದಾವೀದನ ಮಗನೇ,[a] ನಮ್ಮ ಮೇಲೆ ಕರುಣೆ ತೋರಿಸು!” ಎಂದು ಕೂಗಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ದಾವೀದನ ಮಗ” ಎಂಬುದು ರಾಜವಂಶೀಯ-ಮೆಸ್ಸೀಯ ಬಿರುದು; ಇದು ಯೇಸುವನ್ನು ದಾವೀದನ ವಂಶದಲ್ಲಿ ಬರಬೇಕಾಗಿದ್ದ ವಾಗ್ದತ್ತ ಉತ್ತರಾಧಿಕಾರಿಯೆಂದು ಗುರುತಿಸುತ್ತದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ ಮುಂದೆ ಹೋಗುತ್ತಿದ್ದಾಗ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಯೇಸು ಆ ಸ್ಥಳದಿಂದ ಮುಂದೆ ಸಾಗುತ್ತಿದ್ದ ಅದೇ ಸಮಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ರೂಪವು ಕಥನದ ಚಲನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ಆತನನ್ನು ಹಿಂಬಾಲಿಸುತ್ತಾ
  rationale: ಇಲ್ಲಿ ἀκολουθέω ಎಂಬುದು ದೈಹಿಕವಾಗಿ ಹಿಂದೆ ಹೋಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮುಂದಿನ ಸಮಕಾಲೀನ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಜೋಡಿಸಲು ಕೃದಂತರೂಪ ಬಳಸಲಾಗಿದೆ.
- source_word: δύο τυφλοὶ
  choice: ಇಬ್ಬರು ಕುರುಡರು
  rationale: ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ರೂಪವು ಇಬ್ಬರು ಪುರುಷರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಇಬ್ಬರು ಕುರುಡರು’ ನಿಖರವಾದ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪ್ರಯೋಗ.
- source_word: κράζοντες καὶ λέγοντες
  choice: ಎಂದು ಕೂಗಿದರು
  rationale: κράζω ಜೋರಾದ, ತುರ್ತಿನ ಮೊರೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಗ್ರೀಕಿನ ‘ಕೂಗುತ್ತಾ ಮತ್ತು ಹೇಳುತ್ತಾ’ ಎಂಬ ಎರಡು ಕೃದಂತಗಳನ್ನು ಕನ್ನಡದ ಸಹಜ ನೇರಮಾತಿನ ವಿನ್ಯಾಸದಲ್ಲಿ ‘ಎಂದು ಕೂಗಿದರು’ ಎಂದು ಸಂಕ್ಷಿಪ್ತಗೊಳಿಸಲಾಗಿದೆ; ಅರ್ಥದ ಯಾವುದೇ ಅಂಶ ಕಳೆದುಹೋಗುವುದಿಲ್ಲ.
- source_word: Ἐλέησον ἡμᾶς
  choice: ನಮ್ಮ ಮೇಲೆ ಕರುಣೆ ತೋರಿಸು
  rationale: ಏಕವಚನ ಆಜ್ಞಾರ್ಥಕವು ಯೇಸುವಿಗೆ ನೇರವಾಗಿ ಮಾಡಿರುವ ಕರುಣೆಯ ಕ್ರಿಯೆಗಾಗಿ ಮೊರೆ. ಈ ಕನ್ನಡ ರೂಪವು ಸ್ಪಷ್ಟವೂ ಗೌರವಪೂರ್ಣವೂ ಆಗಿದೆ.
- source_word: υἱὲ Δαυίδ
  choice: ದಾವೀದನ ಮಗನೇ
  rationale: ವಂಶಜ ಎಂಬ ವಿವರಣೆಗೆ ಬದಲಿಸದೆ, ಮತ್ತಾಯನಲ್ಲಿ ರಾಜಕೀಯ-ಮೆಸ್ಸೀಯ ಅರ್ಥವಿರುವ ಸಾಂಪ್ರದಾಯಿಕ ಸಂಬೋಧನಾ ಬಿರುದನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ‘ದಾವೀದನ ಮಗ’ ಎಂಬ ಬಿರುದಿನ ಮೆಸ್ಸೀಯ ಮಹತ್ವ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ದಾವೀದನ ಮಗನೇ’ ಎಂಬ ಬಿರುದನ್ನೇ ಉಳಿಸುವುದು
  alternative: ‘ದಾವೀದನ ವಂಶದ ಮೆಸ್ಸೀಯನೇ’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ಅನುವಾದ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ವಿವರಣೆಯಿಲ್ಲದೆ ಸಾಂಪ್ರದಾಯಿಕ ಬಿರುದನ್ನೇ ಬಳಸುತ್ತದೆ. ಅದನ್ನು ಹಾಗೆಯೇ ಉಳಿಸುವುದು ಮತ್ತಾಯನ ಕಥನದಲ್ಲಿರುವ ರಾಜಕೀಯ-ಮೆಸ್ಸೀಯ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಕಾಪಾಡುತ್ತದೆ; ವಿವರಣೆಯನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆತನನ್ನು’ ಎಂಬ ರೂಪವು ಸುವಾರ್ತಾ ಪಠ್ಯದ ಘನತೆಗೆ ಹೊಂದಿದ್ದು, ನೇರ ಮೊರೆಯ ತುರ್ತನ್ನು ‘ಕೂಗಿದರು’ ಎಂಬ ಪದ ಉಳಿಸುತ್ತದೆ.
