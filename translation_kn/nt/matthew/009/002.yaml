id: MAT.9.2
reference: Matthew 9:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: kn
  text: ಇಗೋ, ಹಾಸಿಗೆಯ ಮೇಲೆ ಮಲಗಿದ್ದ ಒಬ್ಬ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನನ್ನು ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ತರುತ್ತಿದ್ದರು. ಯೇಸು ಅವರ ನಂಬಿಕೆಯನ್ನು ಕಂಡು ಆ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನಿಗೆ, “ಧೈರ್ಯ ತಾಳು, ಮಗನೇ; ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ,” ಎಂದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಮತ್ತಾಯನ ನಿರೂಪಣೆಯಲ್ಲಿರುವ ಗಮನ ಸೆಳೆಯುವ, ದೃಶ್ಯವನ್ನು ಜೀವಂತಗೊಳಿಸುವ ಸಂವಾದ ಸೂಚಕದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: προσέφερον
  choice: ತಂದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ರೂಪವಿದ್ದರೂ, ಈ ಕಥನ ಸನ್ನಿವೇಶದಲ್ಲಿ ಕನ್ನಡದ ಸರಳ ಭೂತಕಾಲ ಸಹಜವಾಗಿದ್ದು ಘಟನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮುಂದುವರಿಸುತ್ತದೆ.
- source_word: παραλυτικὸν
  choice: ಒಬ್ಬ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನನ್ನು
  rationale: ವಿಶೇಷಣವನ್ನು ನಾಮಪದಾರ್ಥದಲ್ಲಿ ಬಳಸಿರುವ ಗ್ರೀಕ್ ರೂಪದ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: ಹಾಸಿಗೆಯ ಮೇಲೆ ಮಲಗಿದ್ದ
  rationale: ವ್ಯಕ್ತಿಯ ಸ್ಥಿತಿ ಮತ್ತು ಸ್ಥಾನವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; κλίνη ಎಂಬುದಕ್ಕೆ ಅನಿಶ್ಚಿತವಾದ ‘ಚಾಪೆ’ಯನ್ನು ಹೇರದೆ ‘ಹಾಸಿಗೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: πίστιν
  choice: ನಂಬಿಕೆಯನ್ನು
  rationale: ಇಲ್ಲಿ ಕ್ರಿಯೆಯಲ್ಲಿ ವ್ಯಕ್ತವಾದ ಭರವಸೆಯ ನಂಬಿಕೆಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಸ್ಥಿರ ಕನ್ನಡ ಪದ.
- source_word: Θάρσει
  choice: ಧೈರ್ಯವಾಗಿರು
  rationale: ಸಾಂತ್ವನ ಮತ್ತು ಧೈರ್ಯ ತುಂಬುವ ಆಜ್ಞಾರ್ಥಕದ ನೇರ, ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: τέκνον
  choice: ಮಗನೇ
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಆತ್ಮೀಯ ಮತ್ತು ಮಮತೆಯ ಸಂಬೋಧನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ಕೇವಲ ಜೈವಿಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ
  rationale: ಕ್ಷಮೆಯ ಘೋಷಣೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುವುದರ ಜೊತೆಗೆ, ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ರೂಪದಲ್ಲಿ ಕ್ರಿಯಾಕರ್ತನನ್ನು ಹೇಳದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ἁμαρτίαι
  choice: ಪಾಪಗಳು
  rationale: ಬಹುವಚನದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ಅಪರಾಧಗಳ ಅರ್ಥವನ್ನು ಸಂಕ್ಷೇಪಿಸದೆ ಉಳಿಸುವ ಪ್ರಮಾಣಿತ ಅನುವಾದ.
theological_decisions:
- issue: τὴν πίστιν αὐτῶν ಎಂಬುದರಲ್ಲಿ ‘ಅವರ’ ಎಂಬ ಬಹುವಚನ ಯಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ?
  choice: ‘ಅವರ ನಂಬಿಕೆ’ ಎಂಬ ಬಹುವಚನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಅದು ಹೊತ್ತು ತಂದವರನ್ನು ಮಾತ್ರ ಸೂಚಿಸುತ್ತದೆ, ಅಥವಾ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನನ್ನೂ ಅವರೊಂದಿಗೆ ಒಳಗೊಂಡಿದೆ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವು ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ವ್ಯಕ್ತಿಗಳನ್ನು ಸೂಚಿಸಿದರೂ, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನು ಅದರಲ್ಲಿ ಸೇರಿದ್ದಾನೆಯೇ ಎಂಬುದನ್ನು ನಿರ್ಣಯಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನುವಾದವು ಆ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಪರಿಹರಿಸುವುದಿಲ್ಲ.
- issue: ಯೇಸುವಿನ ಕ್ಷಮೆಯ ಘೋಷಣೆಯ ಸ್ವರೂಪ
  choice: ಕ್ರಿಯಾಕರ್ತನನ್ನು ಹೇಳದ ಕರ್ಮಣಿ ಘೋಷಣೆಯಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ದೇವರು ನಿನ್ನ ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸಿದ್ದಾನೆ’ ಎಂದು ಕ್ರಿಯಾಕರ್ತನನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು, ಅಥವಾ ತಕ್ಷಣದ ಕ್ರಿಯೆಯನ್ನು ಒತ್ತಿಹೇಳುವಂತೆ ರೂಪಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಕ್ಷಮೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಘೋಷಿಸುತ್ತದೆಯಾದರೂ ಕ್ರಿಯಾಕರ್ತನನ್ನು ಹೆಸರಿಸುವುದಿಲ್ಲ. ಕರ್ಮಣಿ ರೂಪವು ಯೇಸುವಿನ ಅಧಿಕಾರದ ಕಥನಾತ್ಮಕ ಸೂಚನೆಯನ್ನು ಉಳಿಸಿಕೊಂಡೇ ಹೆಚ್ಚುವರಿ ವಿವರಣೆಯನ್ನು ಹೇರದಂತೆ ಮಾಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ಇಗೋ’ ಮೂಲಕ ಮತ್ತಾಯನ ಜೀವಂತ ಕಥನ ಸೂಚಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಸಂಬೋಧನೆಯಲ್ಲಿ ಮಮತೆಯ ಸ್ವರಕ್ಕಾಗಿ ‘ಮಗನೇ’ ಬಳಸಲಾಗಿದೆ; ತಾಂತ್ರಿಕ ಅಥವಾ ಪಂಥೀಯ ಪದಪ್ರಯೋಗಗಳನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
