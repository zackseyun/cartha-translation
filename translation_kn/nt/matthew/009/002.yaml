revisions:
- from: ಇಗೋ, ಹಾಸಿಗೆಯ ಮೇಲೆ ಮಲಗಿದ್ದ ಒಬ್ಬ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನನ್ನು ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ತಂದರು. ಯೇಸು ಅವರ ನಂಬಿಕೆಯನ್ನು ಕಂಡು ಆ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನಿಗೆ, “ಧೈರ್ಯವಾಗಿರು, ಮಗನೇ; ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ[a],” ಎಂದನು.
  to: ಇಗೋ, ಹಾಸಿಗೆಯ ಮೇಲೆ ಮಲಗಿದ್ದ ಒಬ್ಬ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನನ್ನು ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ತರುತ್ತಿದ್ದರು. ಯೇಸು ಅವರ ನಂಬಿಕೆಯನ್ನು ಕಂಡು ಆ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನಿಗೆ, “ಧೈರ್ಯ ತಾಳು, ಮಗನೇ; ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ,” ಎಂದನು.
  rationale: 'The revision retains the draft’s source-faithful lexical choices and its preservation of the plural ambiguity in ‘ಅವರ ನಂಬಿಕೆ.’ It corrects the imperfective force of προσέφερον and improves the idiomatic force of Jesus’ reassurance. The optional footnote about a processive present passive is omitted: the Kannada main text already gives a natural passive declaration, and the proposed alternative is not needed to preserve a material ambiguity in this verse.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the paralytic, the bed, the plural ‘their faith,’ the tender address, and the agent-unspecified passive declaration of forgiveness. However, προσέφερον is imperfect; ‘ತಂದರು’ loses its ongoing/imperfective portrayal. ‘ತರುತ್ತಿದ್ದರು’ preserves it naturally in Kannada.
  naturalness: ‘ಧೈರ್ಯ ತಾಳು’ is a more idiomatic modern Kannada reassurance than ‘ಧೈರ್ಯವಾಗಿರು.’ The remaining wording is clear and suitably reverent.
  terminology: '‘ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತ’ is an established and understandable biblical rendering for παραλυτικός. ‘ಮಗನೇ’ is appropriate in context: the masculine grammatical reference to the paralytic supports this natural tender form of address, without asserting a biological relationship.'
  issues:
  - severity: medium
    issue: The imperfect προσέφερον is translated as completed simple past ‘ತಂದರು.’
    rationale: The Greek depicts the action in progress (‘were bringing’). Kannada ‘ತರುತ್ತಿದ್ದರು’ preserves this aspect without making the sentence unnatural.
  - severity: low
    issue: ‘ಧೈರ್ಯವಾಗಿರು’ is less idiomatic than ‘ಧೈರ್ಯ ತಾಳು.’
    rationale: Both communicate the imperative Θάρσει, but ‘ಧೈರ್ಯ ತಾಳು’ is the more natural modern Kannada expression of reassurance.
  revised_text: ಇಗೋ, ಹಾಸಿಗೆಯ ಮೇಲೆ ಮಲಗಿದ್ದ ಒಬ್ಬ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನನ್ನು ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ತರುತ್ತಿದ್ದರು. ಯೇಸು ಅವರ ನಂಬಿಕೆಯನ್ನು ಕಂಡು ಆ ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನಿಗೆ, “ಧೈರ್ಯ ತಾಳು, ಮಗನೇ; ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ,” ಎಂದನು.
