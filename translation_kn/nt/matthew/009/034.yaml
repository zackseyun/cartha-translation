revisions:
- from: ಆದರೆ ಫರಿಸಾಯರು, “ಇವನು ದೆವ್ವಗಳ ಅಧಿಪತಿಯ ಶಕ್ತಿಯಿಂದಲೇ ದೆವ್ವಗಳನ್ನು ಹೊರಡಿಸುತ್ತಾನೆ” ಎಂದು ಹೇಳುತ್ತಿದ್ದರು.[a]
  to: ಆದರೆ ಫರಿಸಾಯರು, “ಇವನು ದೆವ್ವಗಳ ಅಧಿಪತಿಯ ಮೂಲಕ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತಾನೆ” ಎಂದು ಹೇಳುತ್ತಿದ್ದರು.[a]
  rationale: The revision removes the unsupported explicit reference to power and the added emphasis, retains the instrumental ambiguity of ἐν τῷ ἄρχοντι through a primary 'ಮೂಲಕ' rendering and a closely related footnote alternative, and uses a more precise Kannada exorcism verb for ἐκβάλλει. The imperfect accusation remains in 'ಹೇಳುತ್ತಿದ್ದರು.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the adversative δέ, the imperfect sense of ἔλεγον ('ಹೇಳುತ್ತಿದ್ದರು'), the Pharisees' accusatory direct speech, and the repeated δαιμόνια. However, 'ಅಧಿಪತಿಯ ಶಕ್ತಿಯಿಂದಲೇ' adds both an explicit noun ('power') and emphatic '-ಲೇ', neither of which is present in the Greek. A more direct instrumental rendering is preferable. 'ಹೊರಹಾಕುತ್ತಾನೆ' more clearly conveys ἐκβάλλει in this exorcism context than 'ಹೊರಡಿಸುತ್ತಾನೆ.'
  naturalness: The revised wording is natural modern standard Kannada. 'ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತಾನೆ' is clear and idiomatic for expelling demons, while retaining the force of the verb.
  terminology: '''ಫರಿಸಾಯರು,'' ''ಅಧಿಪತಿ,'' and ''ದೆವ್ವಗಳು'' are appropriate. ''ಅಧಿಪತಿ'' suitably renders ἄρχων without importing a particular identification or doctrinal interpretation.'
  issues:
  - severity: medium
    issue: The primary rendering adds 'ಶಕ್ತಿಯಿಂದಲೇ.'
    rationale: The Greek ἐν τῷ ἄρχοντι is instrumental, but does not explicitly contain 'power' or an emphatic equivalent of '-ಲೇ'. The addition narrows and intensifies the wording beyond the source.
  - severity: low
    issue: '''ಹೊರಡಿಸುತ್ತಾನೆ'' is less precise in this context.'
    rationale: Although understandable with an object, it can suggest simply causing something to leave. 'ಹೊರಹಾಕುತ್ತಾನೆ' more naturally and explicitly renders ἐκβάλλει, 'casts/drives out.'
  revised_text: ಆದರೆ ಫರಿಸಾಯರು, “ಇವನು ದೆವ್ವಗಳ ಅಧಿಪತಿಯ ಮೂಲಕ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತಾನೆ” ಎಂದು ಹೇಳುತ್ತಿದ್ದರು.[a]
