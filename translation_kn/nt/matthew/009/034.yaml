id: MAT.9.34
reference: Matthew 9:34
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: kn
  text: ಆದರೆ ಫರಿಸಾಯರು, “ಇವನು ದೆವ್ವಗಳ ಅಧಿಪತಿಯ ಮೂಲಕ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತಾನೆ” ಎಂದು ಹೇಳುತ್ತಿದ್ದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ: “ಇವನು ದೆವ್ವಗಳ ಅಧಿಪತಿಯ ಅಧಿಕಾರದಿಂದ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತಾನೆ.”'
    reason: ἐν τῷ ἄρχοντι ಎಂಬ ಸಾಧನಾರ್ಥಕ ಬಳಕೆಯನ್ನು ‘ಮೂಲಕ’ ಅಥವಾ ‘ಅಧಿಕಾರದಿಂದ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಬಹುದಾದ ಪದಾರ್ಥ-ಪರ್ಯಾಯವನ್ನು ದಾಖಲಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಜನರ ಆಶ್ಚರ್ಯಭರಿತ ಪ್ರತಿಕ್ರಿಯೆಗೆ ಫರಿಸಾಯರ ವಿರೋಧಾತ್ಮಕ ವ್ಯಾಖ್ಯಾನವನ್ನು ಎದುರುನಿಲ್ಲಿಸುವ ಭಾವವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: Φαρισαῖοι
  choice: ಫರಿಸಾಯರು
  rationale: ಈ ಯೆಹೂದ್ಯ ಧಾರ್ಮಿಕ ಗುಂಪಿಗೆ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾಗಿರುವ ಸಹಜ ಲಿಪ್ಯಂತರ.
- source_word: ἔλεγον
  choice: ಹೇಳುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಮುಂದುವರಿದ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಮಾತಿನ ಅಂಶವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Ἐν τῷ ἄρχοντι
  choice: ಅಧಿಪತಿಯ ಶಕ್ತಿಯಿಂದಲೇ
  rationale: ἐν ಜೊತೆಗೆ ದತ್ತಿವಿಭಕ್ತಿ ಇಲ್ಲಿ ಸಾಧನ ಅಥವಾ ಅಧಿಕಾರದ ಮೂಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಶಕ್ತಿಯಿಂದ’ ಎಂಬುದು ಆರೋಪದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ, ಮತ್ತು ‘ಲೇ’ ಒತ್ತನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ἄρχοντι
  choice: ಅಧಿಪತಿ
  rationale: ಆಳುವ ಅಥವಾ ಅಧಿಕಾರ ಹೊಂದಿರುವ ಮುಖ್ಯಸ್ಥನ ಅರ್ಥವನ್ನು dignified ಹಾಗೂ ಸುಲಭ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: ದೆವ್ವಗಳ / ದೆವ್ವಗಳನ್ನು
  rationale: δαιμόνια ಎಂಬ ನಿರ್ದಿಷ್ಟ ಅಲೌಕಿಕ ಜೀವಿಗಳ ಪದವನ್ನು ‘ದುಷ್ಟಾತ್ಮಗಳು’ ಎಂದು ಸಾಮಾನ್ಯೀಕರಿಸದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸುತ್ತದೆ.
- source_word: ἐκβάλλει
  choice: ಹೊರಡಿಸುತ್ತಾನೆ
  rationale: ಭೂತೋಚ್ಚಾಟನೆಯ ಸಂದರ್ಭದಲ್ಲಿ ಬಲವಂತವಾಗಿ ಹೊರಗೆ ಕಳುಹಿಸುವ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದೆವ್ವಗಳನ್ನು ಹೊರಡಿಸುವ ಶಕ್ತಿಯ ಮೂಲದ ಕುರಿತು ಫರಿಸಾಯರ ಆರೋಪ
  choice: ಅಧಿಪತಿಯ ಶಕ್ತಿಯಿಂದಲೇ
  alternative: ಅಧಿಪತಿಯ ಮೂಲಕ
  rationale: ಮೂಲದ ἐν τῷ ἄρχοντι ಅನ್ನು ಸಾಧನಾರ್ಥಕವಾಗಿ ಉಳಿಸಿ, ಯೇಸುವಿನ ಅಧಿಕಾರವು ದೆವ್ವಗಳ ಮುಖ್ಯಸ್ಥನಿಂದ ಬರುತ್ತದೆ ಎಂಬ ಆರೋಪವನ್ನು ಅನುವಾದಕನು ಒಪ್ಪಿಕೊಂಡ ಸತ್ಯದಂತೆ ಅಲ್ಲ, ಫರಿಸಾಯರ ನೇರ ಮಾತಿನಂತೆ ಉಳಿಸಲಾಗಿದೆ.
- issue: δαιμόνια ಪದದ ಅನುವಾದ
  choice: ದೆವ್ವಗಳು
  alternative: ದುಷ್ಟಾತ್ಮಗಳು
  rationale: ಮೂಲಪದವು πνεύματα ಅಲ್ಲ; ಆದ್ದರಿಂದ ಅದರ ನಿರ್ದಿಷ್ಟ ಅಲೌಕಿಕ ಸೂಚನೆಯನ್ನು ಮೃದುವಾಗಿಸದೆ ‘ದೆವ್ವಗಳು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಸಹಜ ವಾಕ್ಯಕ್ರಮವನ್ನು ಬಳಸಿದ್ದು, ‘ಅಧಿಪತಿ’ ಎಂಬ ಗೌರವಯುತ ಹಾಗೂ ಅಧಿಕಾರಸೂಚಕ ಪದದಿಂದ ಮೂಲದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ನೇರ ಉಕ್ತಿಯೊಳಗಿನ ಆರೋಪ ಮತ್ತು ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಮುಂದುವರಿದ ಅಂಶ ಎರಡನ್ನೂ ಕಾಪಾಡಲಾಗಿದೆ.
