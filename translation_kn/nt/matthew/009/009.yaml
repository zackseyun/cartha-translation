    issue: ‘ಸುಂಕ ವಸೂಲಿಯ ಕಟ್ಟೆ’ is not an idiomatic or precise rendering of τελώνιον.
    rationale: In modern standard Kannada, ಕಟ್ಟೆ normally suggests a platform or raised bank rather than a tax booth/station. The Greek denotes the place where tolls or taxes were collected; ‘ಸುಂಕ ವಸೂಲಿ ಕೇಂದ್ರ’ communicates this naturally.
