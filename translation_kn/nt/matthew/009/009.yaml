id: MAT.9.9
reference: Matthew 9:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: kn
  text: ಯೇಸು ಅಲ್ಲಿಂದ ಮುಂದೆ ಹೋಗುತ್ತಿದ್ದಾಗ, ಸುಂಕ ವಸೂಲಿ ಕೇಂದ್ರದಲ್ಲಿ ಕುಳಿತಿದ್ದ ಮತ್ತಾಯನೆಂಬ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಕಂಡರು. ಅವರು ಅವನಿಗೆ, “ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು” ಎಂದು ಹೇಳಿದರು.[a] ಅವನು ಎದ್ದು ಅವರನ್ನು ಹಿಂಬಾಲಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲಿ ಕಥನವನ್ನು ಜೀವಂತಗೊಳಿಸುವ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವಿದೆ: ಅಕ್ಷರಶಃ, “ಹೇಳುತ್ತಾರೆ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ ಮುಂದೆ ಹೋಗುತ್ತಿದ್ದಾಗ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ನಡೆಯುತ್ತಿದ್ದ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἐκεῖθεν ಎಂಬ ಸ್ಥಳಸೂಚಕ ಕ್ರಿಯಾವಿಶೇಷಣವನ್ನು ‘ಅಲ್ಲಿಂದ’ ಎಂದು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἄνθρωπον
  choice: ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು
  rationale: ಇಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಪುರುಷನನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಸಹಜ ಹಾಗೂ ಲಿಂಗಸೂಕ್ತವಾದ ಪದಪ್ರಯೋಗ.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: ಸುಂಕ ವಸೂಲಿಯ ಕಟ್ಟೆಯಲ್ಲಿ ಕುಳಿತಿದ್ದ
  rationale: τελώνιον ಸುಂಕ ಅಥವಾ ತೆರಿಗೆ ವಸೂಲಿ ಮಾಡುವ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕಟ್ಟೆ’ ಸನ್ನಿವೇಶಕ್ಕೆ ತಕ್ಕ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಪದ.
- source_word: Μαθθαῖον λεγόμενον
  choice: ಮತ್ತಾಯನೆಂಬ
  rationale: ‘ಮತ್ತಾಯ ಎಂದು ಕರೆಯಲ್ಪಡುವ/ಹೆಸರಿನ’ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: λέγει αὐτῷ
  choice: ಅವರು ಅವನಿಗೆ ... ಎಂದು ಹೇಳಿದರು
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಕನ್ನಡ ಕಥನದ ಸಹಜ ಭೂತಕಾಲದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ಗೌರವಸೂಚಕ ಏಕವಚನವನ್ನು ಯೇಸುವಿಗೆ ಅನ್ವಯಿಸಲಾಗಿದೆ.
- source_word: Ἀκολούθει μοι
  choice: ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು
  rationale: ಆಜ್ಞಾರ್ಥಕ ರೂಪವನ್ನೂ ಯೇಸುವಿನ ಹಿಂದೆ ನಡೆಯುವ ಮತ್ತು ಶಿಷ್ಯನಾಗುವ ಎರಡೂ ಸಾಧ್ಯ ಅರ್ಥಛಾಯೆಗಳನ್ನೂ ಅನಗತ್ಯ ವಿವರಣೆ ಇಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀναστὰς
  choice: ಅವನು ಎದ್ದು
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ತಕ್ಷಣದ ಕ್ರಿಯೆಯನ್ನು ಸರಳ ಕನ್ನಡ ಕ್ರಮದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἠκολούθησεν αὐτῷ
  choice: ಅವರನ್ನು ಹಿಂಬಾಲಿಸಿದನು
  rationale: ಮತ್ತಾಯನ ನೈಜ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನೂ ಶಿಷ್ಯತ್ವದ ಅರ್ಥಛಾಯೆಯನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನಿಗೆ ಯೇಸು ನೀಡಿದ ಕರೆಯ ಸ್ವರೂಪ
  choice: “ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು” ಎಂದು ಸರಳವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: “ಬಂದು ನನ್ನ ಶಿಷ್ಯನಾಗು”
  rationale: ಈ ಘಟನೆಯು ಶಿಷ್ಯತ್ವದ ಕರೆಯಾದರೂ, ಮೂಲದಲ್ಲಿಲ್ಲದ ವಿವರಣಾತ್ಮಕ ಪದಗಳನ್ನು ಸೇರಿಸದೆ ಆಜ್ಞೆಯೇ ಅದರ ಧಾರ್ಮಿಕ ಮಹತ್ವವನ್ನು ಹೊರುವಂತೆ ಮಾಡಲಾಗಿದೆ.
- issue: λέγει ಎಂಬ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನದ ನಿರೂಪಣೆ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕನ್ನಡಕ್ಕೆ ಸಹಜವಾದ ಭೂತಕಾಲ ‘ಹೇಳಿದರು’ ಬಳಸಲಾಗಿದೆ.
  alternative: ವರ್ತಮಾನದ ‘ಹೇಳುತ್ತಾರೆ’
  rationale: ಗ್ರೀಕ್ ಕಥನದ ಜೀವಂತ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಯಾಂತ್ರಿಕವಾಗಿ ಉಳಿಸಿದರೆ ಕಾಲಕ್ರಮ ಅಸಹಜವಾಗಬಹುದು; ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ, ಮತ್ತಾಯನಿಗೆ ಏಕವಚನ ಬಳಸಲಾಗಿದೆ. ಇಂಗ್ಲಿಷ್ ಸಲಹಾ ಪಠ್ಯದ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮೂಲ ಪದಗಳಿಗೆ ಹೊಂದಿಕೆಯಾಗದಂತೆ ಕಂಡುದರಿಂದ, ಮೂಲ ಗ್ರೀಕ್‌ನ ನಿಜವಾದ ಅನುವಾದ ಪರ್ಯಾಯಕ್ಕೆ ಮಾತ್ರ [a] ನೀಡಲಾಗಿದೆ.
