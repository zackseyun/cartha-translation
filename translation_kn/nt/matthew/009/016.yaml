id: MAT.9.16
reference: Matthew 9:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: kn
  text: ಆದರೆ ಯಾರೂ ಹಳೆಯ ಉಡುಪಿಗೆ ಕುಗ್ಗಿಸದ ಬಟ್ಟೆಯ ತೇಪೆಯನ್ನು ಹಾಕುವುದಿಲ್ಲ[a]. ಏಕೆಂದರೆ ಆ ತೇಪೆಯು ಉಡುಪನ್ನು ಕಿತ್ತುಕೊಳ್ಳುತ್ತದೆ, ಮತ್ತು ಇನ್ನೂ ದೊಡ್ಡ ಹರಿತ ಉಂಟಾಗುತ್ತದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಪೂರ್ಣವಾಗಿ ಸಂಸ್ಕರಿಸದ ಬಟ್ಟೆಯ’; ಗ್ರೀಕ್ ಪದವು ಇನ್ನೂ ಫುಲ್ಲಿಂಗ್ ಸಂಸ್ಕರಣೆಗೆ ಒಳಗಾಗದ, ಆದ್ದರಿಂದ ಕುಗ್ಗುವ ಬಟ್ಟೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ಯಾರೂ ... ಇಲ್ಲ
  rationale: ಲಿಂಗನಿರಪೇಕ್ಷವಾದ ಸಾರ್ವತ್ರಿಕ ನಿರಾಕರಣೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದೊಂದಿಗೆ ಇರುವ ಸೌಮ್ಯವಾದ ವಿರೋಧ ಅಥವಾ ತಿರುವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: ತೇಪೆಯನ್ನು ಹಾಕುವುದಿಲ್ಲ
  rationale: ಕ್ರಿಯಾಪದವು ಮೂಲತಃ ‘ಮೇಲೆ ಹಾಕು/ಅಳವಡಿಸು’ ಎಂದರ್ಥ; ಉಡುಪಿನ ಸಂದರ್ಭದಲ್ಲಿ ‘ತೇಪೆ ಹಾಕು’ ಸಹಜವಾಗಿದ್ದು, ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಇಲ್ಲದ ‘ಹೊಲಿಯು’ ಎಂಬುದನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ῥάκους ἀγνάφου
  choice: ಕುಗ್ಗಿಸದ ಬಟ್ಟೆಯ
  rationale: ಪೂರ್ಣ ಸಂಸ್ಕರಣೆಗೆ ಒಳಪಡದ, ಮುಂದೆ ಕುಗ್ಗುವ ಬಟ್ಟೆಯ ಪ್ರಾಯೋಗಿಕ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: ಹಳೆಯ ಉಡುಪಿಗೆ
  rationale: ἱμάτιον ಎಂಬ ಸಾಮಾನ್ಯ ಉಡುಪಿನ ಪದವನ್ನು ವ್ಯಾಪಕ ಅರ್ಥದ ‘ಉಡುಪು’ ಎಂದು ನೀಡುತ್ತದೆ.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: ಉಡುಪಿನಿಂದ ಎಳೆದುಕೊಂಡು ಬೇರೆಯಾಗುತ್ತದೆ
  rationale: ತೇಪೆಯು ಉಡುಪಿನ ಮೇಲೆ ಒತ್ತಡ ಉಂಟುಮಾಡಿ ಅದರಿಂದ ಬೇರ್ಪಡುವ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ತೋರಿಸುತ್ತದೆ; ಕೇವಲ ‘ತೆಗೆದುಹಾಕುತ್ತದೆ’ ಎಂಬ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: ಆ ತೇಪೆಯು
  rationale: ಅಕ್ಷರಶಃ ‘ಅದರ ತುಂಬುವ ತುಂಡು’ ಎಂಬ ಅಭಿವ್ಯಕ್ತಿ ಇಲ್ಲಿ ರಂಧ್ರವನ್ನು ತುಂಬುವ ತೇಪೆಯನ್ನೇ ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸುತ್ತದೆ.
- source_word: χεῖρον σχίσμα γίνεται
  choice: ಹರಿದ ಭಾಗವು ಇನ್ನೂ ಹದಗೆಡುತ್ತದೆ
  rationale: χείρον ಎಂಬ ಹೋಲಿಕೆಯ ಅರ್ಥವನ್ನೂ σχίσμα ಎಂಬ ಹರಿತದ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಪರಿಣಾಮವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ದೃಶ್ಯಾತ್ಮಕ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಕುಗ್ಗಿಸದ ಬಟ್ಟೆ’ ಎಂಬುದು ಪುರಾತನ ಬಟ್ಟೆ ಸಂಸ್ಕರಣೆಯ ತಾಂತ್ರಿಕ ಪದಕ್ಕಿಂತ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಪರಿಣಾಮವನ್ನು ಹೆಚ್ಚು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
