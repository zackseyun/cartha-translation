id: MAT.9.24
reference: Matthew 9:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: kn
  text: ಯೇಸು, “ಹೊರಟುಹೋಗಿರಿ; ಏಕೆಂದರೆ ಹುಡುಗಿ ಸತ್ತಿಲ್ಲ, ನಿದ್ರಿಸುತ್ತಿದ್ದಾಳೆ” ಎಂದು ಹೇಳುತ್ತಿದ್ದರು. ಆಗ ಅವರು ಆತನನ್ನು ಅಪಹಾಸ್ಯ ಮಾಡಿ ನಗುತ್ತಿದ್ದರು[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವರು ಆತನನ್ನು ಗೇಲಿ ಮಾಡುತ್ತಿದ್ದರು.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಯಾರನ್ನಾದರೂ ಅಪಹಾಸ್ಯದಿಂದ ನಗುವುದನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ಎಂದು ಹೇಳುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಆ ಸನ್ನಿವೇಶದಲ್ಲಿ ನಡೆಯುತ್ತಿದ್ದ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಮಾತನ್ನು ಸೂಚಿಸಬಹುದು; ಕನ್ನಡದ ‘ಹೇಳುತ್ತಿದ್ದರು’ ಆ ಅಂಶವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἀναχωρεῖτε
  choice: ಹೊರಗೆ ಹೋಗಿರಿ
  rationale: ಬಹುವಚನ ಆಜ್ಞಾರ್ಥದ ಬಲವನ್ನು ಆಧುನಿಕ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οὐ γὰρ
  choice: ಏಕೆಂದರೆ ... ಸತ್ತಿಲ್ಲ
  rationale: γάρ ಹಿಂದಿನ ಆಜ್ಞೆಗೆ ಕಾರಣವನ್ನು ನೀಡುತ್ತದೆ; ‘ಏಕೆಂದರೆ’ ಆ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπέθανεν
  choice: ಸತ್ತಿಲ್ಲ
  rationale: ಸಾವನ್ನು ಒಂದು ಸಂಭವಿಸಿದ ಘಟನೆಯಾಗಿ ಸೂಚಿಸುವ ಭೂತಕಾಲದ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τὸ κοράσιον
  choice: ಹುಡುಗಿ
  rationale: κοράσιον ಎಂದರೆ ಬಾಲಕಿ ಅಥವಾ ಚಿಕ್ಕವಯಸ್ಸಿನ ಹುಡುಗಿ; ಇಲ್ಲಿ ಹೆಚ್ಚುವರಿ ಒತ್ತನ್ನು ಸೇರಿಸದೆ ‘ಹುಡುಗಿ’ ಸಹಜವಾಗಿದೆ.
- source_word: ἀλλὰ καθεύδει
  choice: ನಿದ್ರಿಸುತ್ತಿದ್ದಾಳೆ
  rationale: ಪ್ರಸ್ತುತ ನಡೆಯುತ್ತಿರುವ ಸ್ಥಿತಿಯನ್ನು ಉಳಿಸಿ, ಸಾವಿನೊಂದಿಗೆ ಯೇಸು ಮಾಡಿದ ಉದ್ದೇಶಪೂರ್ವಕ ವಿರೋಧವನ್ನು ನಿರ್ವಚಿಸದೆ ಬಿಡುತ್ತದೆ.
- source_word: κατεγέλων αὐτοῦ
  choice: ಯೇಸುವನ್ನು ನೋಡಿ ನಗುತ್ತಿದ್ದರು
  rationale: ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಯಾರನ್ನಾದರೂ ಅಪಹಾಸ್ಯದಿಂದ ನಗುವ ಚಿತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅಪೂರ್ಣ ಭೂತಕಾಲವನ್ನು ‘ನಗುತ್ತಿದ್ದರು’ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಹುಡುಗಿ ‘ಸತ್ತಿಲ್ಲ, ನಿದ್ರಿಸುತ್ತಿದ್ದಾಳೆ’ ಎಂಬ ಯೇಸುವಿನ ಮಾತು
  choice: ‘ನಿದ್ರಿಸುತ್ತಿದ್ದಾಳೆ’ ಎಂಬ ರೂಪಕಾತ್ಮಕ ಹೇಳಿಕೆಯನ್ನು ವಿವರಣೆಯಿಲ್ಲದೆ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಕೇವಲ ನಿದ್ರಿಸುತ್ತಿದ್ದಾಳೆ’ ಎಂದು ಅನುವಾದಿಸುವುದು ಅಥವಾ ಇದು ಸಾವಿನ ರೂಪಕವೆಂದು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ವಿವರಿಸುವುದು.
  rationale: ಮೂಲಪಠ್ಯವು ಈ ಮಾತಿನ ಕಥನಾತ್ಮಕ ಮತ್ತು ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ತಾನೇ ಪರಿಹರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅದು ರೂಪಕವೋ, ಕಾಣಿಕೆಯ ಆಧಾರದ ಮಾತೋ, ಮುಂದಾಗಲಿರುವ ಜೀವಪ್ರಾಪ್ತಿಯನ್ನು ಮುಂಗಾಣುವ ಮಾತೋ ಎಂಬುದನ್ನು ಅನುವಾದವು ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಗೌರವಪೂರ್ಣವಾಗಿಯೂ ರೂಪಿಸಲಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಕರ್ತೃಗಳ ಗೊಂದಲ ತಪ್ಪಿಸಲು ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸೂಚ್ಯವಾಗಿರುವ ಯೇಸುವಿನ ಹೆಸರನ್ನು ಸಂದರ್ಭಾನುಸಾರ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ. ‘ನಿದ್ರಿಸುತ್ತಿದ್ದಾಳೆ’ ಎಂಬ ಮಾತಿನ ಅರ್ಥವನ್ನು ವಿಸ್ತರಿಸದೆ ಮೂಲದ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
