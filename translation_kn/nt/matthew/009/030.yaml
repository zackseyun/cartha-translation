id: MAT.9.30
reference: Matthew 9:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: kn
  text: ಆಗ ಅವರ ಕಣ್ಣುಗಳು ತೆರೆದವು. ಯೇಸು ಅವರಿಗೆ ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಎಚ್ಚರಿಸಿ[a], “ಯಾರಿಗೂ ತಿಳಿಯದಂತೆ ನೋಡಿಕೊಳ್ಳಿರಿ[b]” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಕಠಿಣವಾಗಿ ಆಜ್ಞಾಪಿಸಿ” ಅಥವಾ “ತೀವ್ರವಾಗಿ ತಾಕೀತು ಮಾಡಿ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಬಲವಾದ ಭಾವನೆಯನ್ನೂ ಎಚ್ಚರಿಕೆಯ ತೀವ್ರತೆಯನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, “ಯಾರಿಗೂ ತಿಳಿಯದಂತೆ ನೋಡಿಕೊಳ್ಳಿರಿ.” ಏನು ತಿಳಿಯಬಾರದು ಎಂಬುದು ಗುಣಪಡಿಸುವ ಘಟನೆಯ ಸಂದರ್ಭದಿಂದ ತಿಳಿಯುತ್ತದೆ; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅದಕ್ಕೆ ನೇರ ಕರ್ಮಪದವಿಲ್ಲ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: ತೆರೆದವು
  rationale: ἀνοίγω ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಕನ್ನಡದ ಸಹಜ ಪ್ರಯೋಗದಲ್ಲಿ ‘ಅವರ ಕಣ್ಣುಗಳು ತೆರೆದವು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ದೃಷ್ಟಿಯನ್ನು ಯಾರು ಮರುಸ್ಥಾಪಿಸಿದರು ಎಂಬುದನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸಿಲ್ಲ.
- source_word: οἱ ὀφθαλμοί
  choice: ಅವರ ಕಣ್ಣುಗಳು
  rationale: ಗ್ರೀಕ್‌ನ ಸ್ವಾಮ್ಯಸೂಚಕ ವಿನ್ಯಾಸವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐνεβριμήθη
  choice: ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಎಚ್ಚರಿಸುತ್ತಾ
  rationale: ಈ ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಬಲವಾದ ಭಾವನೆ ಮತ್ತು ಆಜ್ಞಾತ್ಮಕ ಎಚ್ಚರಿಕೆಯ ತೀವ್ರತೆಯನ್ನು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಗದರಿಸಿದನು’ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಸಂದರ್ಭದ ಮೇಲೆ ಹೇರಿಕೊಳ್ಳುವುದಿಲ್ಲ.
- source_word: λέγων
  choice: ಎಂದು ಹೇಳಿದನು
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಡನೆ ಸಮಕಾಲೀನವಾಗಿರುವ ಕೃದಂತದ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Ὁρᾶτε
  choice: ನೋಡಿಕೊಳ್ಳಿರಿ
  rationale: ಇದು ಅಕ್ಷರಶಃ ನೋಡುವುದನ್ನು ಸೂಚಿಸದೆ, ಎಚ್ಚರಿಕೆಯಿಂದ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಬೇಕೆಂಬ ಆಜ್ಞೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: μηδεὶς γινωσκέτω
  choice: ಇದು ಯಾರಿಗೂ ತಿಳಿಯದಂತೆ
  rationale: μηδείς ಜೊತೆಯ ಮೂರನೆಯ ಪುರುಷ ಆಜ್ಞಾರ್ಥಕವು ನಿಷೇಧವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಇದು’ ಎಂಬ ಸಂದರ್ಭಸೂಚಿತ ಕರ್ಮಪದವು ಗುಣಮುಖವಾದ ಸಂಗತಿಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಗುಣಪಡಿಸಿದ ಬಳಿಕ ಯೇಸು ಕೊಟ್ಟ ಆಜ್ಞೆಯ ತೀವ್ರತೆ
  choice: ಯೇಸು ಈ ಸಂಗತಿಯನ್ನು ಯಾರಿಗೂ ತಿಳಿಸಬಾರದೆಂದು ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಎಚ್ಚರಿಸಿದನು.
  alternative: ಯೇಸು ಅವರನ್ನು ಗದರಿಸಿದನು / ಕಠಿಣವಾಗಿ ಆಜ್ಞಾಪಿಸಿದನು.
  rationale: ಮೂಲಪಾಠವು ಬಲವಾದ ನಿಷೇಧವನ್ನು ತೋರಿಸುತ್ತದೆ, ಆದರೆ ಅದರ ಕಾರಣವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಆಜ್ಞೆಯ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸಿ, ಯೇಸುವಿನ ಉದ್ದೇಶದ ಬಗ್ಗೆ ಯಾವುದೇ ಪಂಥೀಯ ಅಥವಾ ಊಹಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ಆಜ್ಞಾರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ. ಭಾಷೆ ಸರಳ, ಸಹಜ ಮತ್ತು ಘನವಾಗಿದೆ; ಮೂಲದ ಬಲವಾದ ಎಚ್ಚರಿಕೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು ಅದರ ಹಿಂದಿನ ಉದ್ದೇಶವನ್ನು ವಿವರಿಸುವ ಹೆಚ್ಚುವರಿ ಅರ್ಥವನ್ನು ಸೇರಿಸಿಲ್ಲ.
