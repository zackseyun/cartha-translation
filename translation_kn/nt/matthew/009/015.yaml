review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the wedding-attendant image, the temporal contrast, fasting, and the passive force of ἀπαρθῇ. However, the Kannada question “ದುಃಖಿಸುವುದಕ್ಕೆ ಸಾಧ್ಯವೇ?” does not clearly carry the negative-answer force of μή in the Greek rhetorical question. “ಅವರಿಂದ ತೆಗೆದುಹಾಕಲ್ಪಡುವ” can also be read as removal by them; “ಅವರ ಬಳಿಯಿಂದ” clearly represents ἀπ’ αὐτῶν (“from them”).
  naturalness: The revision uses idiomatic modern standard Kannada. “ಶೋಕಿಸಬಲ್ಲರೇ?” is a natural rhetorical question in context, and “ಅವರ ಬಳಿಯಿಂದ” removes an avoidable ambiguity.
  terminology: “ಮದುಮಗನು,” “ಮದುವೆಯ ಸಂಗಡಿಗರು,” “ಶೋಕಿಸುವುದು,” and “ಉಪವಾಸ ಮಾಡುವರು” appropriately retain the wedding and mourning/fasting imagery. The footnote preserves the literal idiom without treating it as the primary meaning.
  issues:
  - severity: medium
    issue: The rhetorical question lacks a clear negative-answer orientation.
    rationale: Μὴ δύνανται ...; expects the answer “No.” The original Kannada wording can function as a neutral question about possibility, whereas “ಶೋಕಿಸಬಲ್ಲರೇ?” naturally functions as a rhetorical denial in this context.
  - severity: low
    issue: “ಅವರಿಂದ ತೆಗೆದುಹಾಕಲ್ಪಡುವ” is directionally ambiguous.
    rationale: Greek ἀπ’ αὐτῶν means that the bridegroom is taken away from the attendants, not that they are necessarily the agents of removal. “ಅವರ ಬಳಿಯಿಂದ” clearly expresses separation from them.
  revised_text: ಯೇಸು ಅವರಿಗೆ, “ಮದುಮಗನು ಅವರೊಂದಿಗೆ ಇರುವ ತನಕ ಮದುವೆಯ ಸಂಗಡಿಗರು[a] ಶೋಕಿಸಬಲ್ಲರೇ? ಆದರೆ ಮದುಮಗನು ಅವರ ಬಳಿಯಿಂದ ತೆಗೆದುಹಾಕಲ್ಪಡುವ ದಿನಗಳು ಬರಲಿವೆ[b]; ಆಗ ಅವರು ಉಪವಾಸ ಮಾಡುವರು” ಎಂದು ಹೇಳಿದರು.
