reference: Matthew 9:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: kn
  text: ಯೇಸು ಅವರಿಗೆ, “ಮದುಮಗನು ಅವರೊಂದಿಗೆ ಇರುವ ತನಕ ಮದುವೆಯ ಸಂಗಡಿಗರು[a] ಶೋಕಿಸಬಲ್ಲರೇ? ಆದರೆ ಮದುಮಗನು ಅವರ ಬಳಿಯಿಂದ ತೆಗೆದುಹಾಕಲ್ಪಡುವ ದಿನಗಳು ಬರಲಿವೆ[b]; ಆಗ ಅವರು ಉಪವಾಸ ಮಾಡುವರು” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಪದಶಃ, ‘ಮದುವೆ ಕೋಣೆಯ ಪುತ್ರರು’; ಇದು ಮದುಮಗನ ಸಂಗಡಿಗರು ಅಥವಾ ಮದುವೆಯ ಸಮಾರಂಭದಲ್ಲಿ ಅವನೊಂದಿಗಿರುವವರನ್ನು ಸೂಚಿಸುವ ನುಡಿಗಟ್ಟು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಮದುಮಗನು ಅವರ ಬಳಿಯಿಂದ ದೂರಮಾಡಲ್ಪಡುವ.’ ಇಲ್ಲಿನ ನಿಷ್ಕ್ರಿಯ ಕ್ರಿಯಾರೂಪವು ಸಾಮಾನ್ಯ ನಿರ್ಗಮನಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಅರ್ಥವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: ಮದುವೆಯ ಸಂಗಡಿಗರು
  rationale: ಪದಶಃ ‘ಮದುವೆ ಕೋಣೆಯ ಪುತ್ರರು’ ಎಂಬ ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಮದುಮಗನ ಸಂಗಡಿಗರು ಅಥವಾ ಮದುವೆ ಸಮಾರಂಭಕ್ಕೆ ಸೇರಿದವರು ಎಂಬ ಸಾಮಾಜಿಕ ಅರ್ಥದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: πενθεῖν
  choice: ದುಃಖಿಸುವುದು
  rationale: ಶೋಕಿಸುವುದು ಅಥವಾ ದುಃಖಪಡುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ಹೊತ್ತು, ಉಪವಾಸದೊಂದಿಗಿನ ಸಂದರ್ಭೋಚಿತ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐφ’ ὅσον
  choice: ಇರುವ ತನಕ
  rationale: ಕಾಲಾವಧಿಯನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಅಭಿವ್ಯಕ್ತಿಗೆ ಸಹಜವಾದ ಕನ್ನಡ ರೂಪ.
- source_word: νυμφίος
  choice: ಮದುಮಗನು
  rationale: ಮದುವೆಯ ರೂಪಕವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುವ ಪ್ರಚಲಿತ ಕನ್ನಡ ಪದ.
- source_word: ἀπαρθῇ
  choice: ತೆಗೆದುಹಾಕಲ್ಪಡುವ
  rationale: ಸಾಧಾರಣವಾಗಿ ಹೊರಟುಹೋಗುವುದಕ್ಕಿಂತ, ಇತರರಿಂದ ದೂರಮಾಡಲ್ಪಡುವ ಅಥವಾ ಕೊಂಡೊಯ್ಯಲ್ಪಡುವ ನಿಷ್ಕ್ರಿಯ ಕ್ರಿಯೆಯ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: νηστεύσουσιν
  choice: ಉಪವಾಸ ಮಾಡುವರು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಸರಳ ಮತ್ತು ನೇರ ಅನುವಾದ.
- source_word: Μὴ δύνανται ... ;
  choice: ದುಃಖಿಸುವುದಕ್ಕೆ ಸಾಧ್ಯವೇ?
  rationale: ನಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: ಆದರೆ ... ದಿನಗಳು ಬರುವವು
  rationale: δέಯ ಸೌಮ್ಯ ವಿರೋಧಭಾವವನ್ನೂ ಭವಿಷ್ಯದ ಕಾಲಸೂಚನೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮದುಮಗನ ರೂಪಕದಲ್ಲಿರುವ ಸಂಭಾವ್ಯ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಮಹತ್ವ
  choice: ‘ಮದುಮಗನು’ ಎಂಬ ರೂಪಕವನ್ನು ಯಾವುದೇ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆಯಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಯೇಸುವನ್ನು ಮೆಸ್ಸೀಯ ಮದುಮಗನೆಂದು ಅನುವಾದದಲ್ಲೇ ಸ್ಪಷ್ಟವಾಗಿ ಗುರುತಿಸುವುದು.
  rationale: ವಚನವೇ ರೂಪಕವನ್ನು ಒದಗಿಸುತ್ತದೆ; ಅದರ ಧಾರ್ಮಿಕ ಸೂಚನೆಯನ್ನು ಅನುವಾದವು ಹೆಚ್ಚುವರಿಯಾಗಿ ನಿರ್ಣಯಿಸದೆ, ಓದುಗರಿಗೆ ಅದರ ಒತ್ತಡ ಮತ್ತು ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಗ್ರಹಿಸಲು ಬಿಡುತ್ತದೆ.
- issue: ἀπαρθῇ ಎಂಬ ನಿಷ್ಕ್ರಿಯ ಕ್ರಿಯೆಯ ಅರ್ಥಸೂಚನೆ
  choice: ‘ತೆಗೆದುಹಾಕಲ್ಪಡುವ’ ಎಂದು ನಿಷ್ಕ್ರಿಯ ಹಾಗೂ ಸಂಭವನೀಯ ಬಲವಂತದ ದೂರಮಾಡುವಿಕೆಯ ಛಾಯೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಹೊರಟುಹೋಗುವ’ ಎಂದು ಸಾಮಾನ್ಯ ನಿರ್ಗಮನವಾಗಿ ಹೇಳುವುದು.
  rationale: ಮೂಲಪಾಠವು ಸಾಮಾನ್ಯ ನಿರ್ಗಮನಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಸೂಚನೆಯನ್ನು ಕೊಡಬಹುದು; ಆದರೆ ಯೇಸುವಿನ ಮರಣವನ್ನು ಅನುವಾದದಲ್ಲೇ ನೇರವಾಗಿ ವಿವರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ಮೂಲದ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ, ಮದುವೆಯ ರೂಪಕ ಮತ್ತು ನಿಷ್ಕ್ರಿಯ ಕ್ರಿಯೆಯ ಅರ್ಥಸೂಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
