id: MAT.9.12
reference: Matthew 9:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: kn
  text: ಆದರೆ ಯೇಸು ಅದನ್ನು ಕೇಳಿ, “ಆರೋಗ್ಯವಂತರಿಗೆ ವೈದ್ಯನ ಅಗತ್ಯವಿಲ್ಲ; ಅಸ್ವಸ್ಥರಿಗೆ ಅಗತ್ಯವಿದೆ” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: ಅದನ್ನು ಕೇಳಿ
  rationale: ಪೂರ್ವಸಂದರ್ಭದಲ್ಲಿನ ಮಾತನ್ನು ಸೂಚಿಸುವ ಅಪ್ರಕಟಿತ ಕರ್ಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಅದನ್ನು’ ಎಂದು ಸಹಜವಾಗಿ ಪೂರೈಸಲಾಗಿದೆ; ಕೃದಂತದ ಕಾಲಸಂಬಂಧವನ್ನು ‘ಕೇಳಿ’ ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: δέ ಸೂಚಿಸುವ ಸೌಮ್ಯ ವಿರೋಧಾತ್ಮಕ ತಿರುವನ್ನು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἶπεν
  choice: ಎಂದು ಹೇಳಿದರು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸಾಮಾನ್ಯ ಮಾತಿನ ಕ್ರಿಯಾಪದವನ್ನು ‘ಉತ್ತರಿಸಿದರು’ ಎಂದು ಹೆಚ್ಚು ವ್ಯಾಖ್ಯಾನಿಸದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: ಅಗತ್ಯವಿಲ್ಲ
  rationale: χρείαν ἔχειν ಎಂಬ ನುಡಿಗಟ್ಟಿಗೆ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆದ ಕನ್ನಡ ರೂಪ.
- source_word: οἱ ἰσχύοντες
  choice: ಆರೋಗ್ಯವಾಗಿರುವವರು
  rationale: ἰσχύω ಮೂಲತಃ ಬಲವಾಗಿರುವುದನ್ನು ಸೂಚಿಸಿದರೂ, ವೈದ್ಯ ಮತ್ತು ಅಸ್ವಸ್ಥರ ನಡುವಿನ ಈ ವೈದ್ಯಕೀಯ ವಿರೋಧದಲ್ಲಿ ‘ಆರೋಗ್ಯವಾಗಿರುವವರು’ ಎಂಬುದು ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἰατροῦ
  choice: ವೈದ್ಯನ
  rationale: ἰατρός ಪದದ ನೇರ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: οἱ κακῶς ἔχοντες
  choice: ಅಸ್ವಸ್ಥರಾಗಿರುವವರು
  rationale: κακῶς ἔχω ಎಂಬ ನುಡಿಗಟ್ಟು ಇಲ್ಲಿ ಕಾಯಿಲೆಯಿಂದ ಬಳಲುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಅಸ್ವಸ್ಥರಾಗಿರುವವರು’ ವೈದ್ಯಕೀಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಗಾದೆಯ ರೂಪಕಾತ್ಮಕ ಅರ್ಥವೇ ಅಥವಾ ಕೇವಲ ದೈಹಿಕ ಅರ್ಥವೇ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಮಾತನ್ನು ನೇರವಾದ ವೈದ್ಯಕೀಯ ರೂಪದಲ್ಲೇ ನೀಡಲಾಗಿದೆ.
  alternative: ‘ಪಾಪಿಗಳಿಗೆ ಆತ್ಮಿಕ ವೈದ್ಯನ ಅಗತ್ಯವಿದೆ’ ಎಂಬ ಅನ್ವಯವನ್ನು ಅನುವಾದದಲ್ಲೇ ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಸಂದರ್ಭವು ಈ ಮಾತನ್ನು ಪಾಪಿಗಳೊಂದಿಗೆ ಯೇಸುವಿನ ಒಡನಾಟಕ್ಕೆ ಅನ್ವಯಿಸುತ್ತದೆ; ಆದರೆ ಗ್ರೀಕ್ ವಾಕ್ಯವೇ ವೈದ್ಯಕೀಯ ಚಿತ್ರಣದಲ್ಲಿ ಮಾತನಾಡುತ್ತದೆ. ಅದನ್ನು ಉಳಿಸುವುದರಿಂದ ಸಂದರ್ಭವೇ ಆತ್ಮಿಕ ಅನ್ವಯವನ್ನು ಒದಗಿಸುತ್ತದೆ ಮತ್ತು ಮೂಲದ ಅರ್ಥತಣಿವು ಕಾಪಾಡಲ್ಪಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ ಶೈಲಿ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ತೃ ಸರ್ವನಾಮ ಅಪ್ರಕಟಿತವಾಗಿದ್ದರೂ ಸಂದರ್ಭದ ಸ್ಪಷ್ಟತೆಗಾಗಿ ‘ಯೇಸು’ ಎಂದು ಪೂರೈಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿಲ್ಲದ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು ಸೇರಿಸಲಾಗಿಲ್ಲ.
