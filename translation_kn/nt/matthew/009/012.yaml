review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal participle ('having/when he heard'), the mild contrast, the medical proverb, and the implied repetition of 'physician' in the second clause. Rendering οἱ ἰσχύοντες as ‘healthy’ is justified by the explicit medical antithesis with οἱ κακῶς ἔχοντες; it does not force a spiritual interpretation.
  naturalness: The meaning is clear, but ‘ಆರೋಗ್ಯವಾಗಿರುವವರಿಗೆ’ and especially ‘ಅಸ್ವಸ್ಥರಾಗಿರುವವರಿಗೆ’ are more periphrastic than needed in modern standard Kannada. ‘ಆರೋಗ್ಯವಂತರಿಗೆ’ and ‘ಅಸ್ವಸ್ಥರಿಗೆ’ are more idiomatic and retain the same referential force. The second-clause ellipsis is natural because ‘ವೈದ್ಯನ’ is established in the first clause.
  terminology: ‘ವೈದ್ಯ’ is an appropriate modern, respectful equivalent of ἰατρός. ‘ಆರೋಗ್ಯವಂತರು’ / ‘ಅಸ್ವಸ್ಥರು’ provides a balanced medical contrast and preserves the proverb’s literal medical imagery without introducing theological interpretation. No footnote is required.
  issues:
  - severity: low
    issue: Periphrastic participant expressions
    rationale: ‘ಆರೋಗ್ಯವಾಗಿರುವವರಿಗೆ’ and ‘ಅಸ್ವಸ್ಥರಾಗಿರುವವರಿಗೆ’ are understandable, but the concise noun/adjective forms are more natural in modern standard Kannada and better suit the aphoristic register.
  revised_text: ಆದರೆ ಯೇಸು ಅದನ್ನು ಕೇಳಿ, “ಆರೋಗ್ಯವಂತರಿಗೆ ವೈದ್ಯನ ಅಗತ್ಯವಿಲ್ಲ; ಅಸ್ವಸ್ಥರಿಗೆ ಅಗತ್ಯವಿದೆ” ಎಂದು ಹೇಳಿದರು.
