id: MAT.9.1
reference: Matthew 9:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: kn
  text: ದೋಣಿಗೆ ಹತ್ತಿ, ಆಚೆಗೆ ದಾಟಿ, ತನ್ನ ಸ್ವಂತ ನಗರಕ್ಕೆ[a] ಬಂದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಶಬ್ದಶಃ, “ತನ್ನ ಸ್ವಂತ ನಗರಕ್ಕೆ.” ಇದು ಈ ಕಥನದ ಹಂತದಲ್ಲಿ ಯೇಸುವಿಗೆ ಸಂಬಂಧಿಸಿದ ನಗರವನ್ನು ಸೂಚಿಸಬಹುದು; ಸಂದರ್ಭದ ಪ್ರಕಾರ ಅದು ಬಹುಶಃ ಕಪೆರ್ನೌಮ್ ಆಗಿರಬಹುದು.
    reason: ‘ತನ್ನ ಸ್ವಂತ ನಗರ’ ಎಂಬ ಮೂಲದ ನೇರ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಪಠ್ಯದಲ್ಲಿ ಹೆಸರಿಸದ ನಗರದ ಸಂದರ್ಭೋಚಿತ ಸಾಧ್ಯ ಗುರುತಿಸುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: ἐμβὰς
  choice: ದೋಣಿಯನ್ನು ಹತ್ತಿ
  rationale: ಅಪೂರ್ಣವಲ್ಲದ ಭೂತಕಾಲದ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗಳಿಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ‘ಹತ್ತಿ’ ಸಹಜವಾಗಿ ಆ ಕ್ರಮವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πλοῖον
  choice: ದೋಣಿ
  rationale: ಇದು ಸಾಮಾನ್ಯ ಜಲವಾಹನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಗಲಿಲಾಯ ಸಮುದ್ರದ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಹಡಗು’ಗಿಂತ ‘ದೋಣಿ’ ಸಹಜ ಮತ್ತು ಪ್ರಮಾಣೋಚಿತವಾಗಿದೆ.
- source_word: διεπέρασεν
  choice: ಆಚೆ ದಡಕ್ಕೆ ದಾಟಿ
  rationale: διαπεράω ಒಂದು ಕಡೆಯಿಂದ ಮತ್ತೊಂದು ಕಡೆಗೆ, ವಿಶೇಷವಾಗಿ ನೀರಿನ ಮೇಲೆ, ದಾಟುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆಚೆ ದಡಕ್ಕೆ ದಾಟಿ’ ದಿಕ್ಕಿನ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἦλθεν
  choice: ಬಂದನು
  rationale: ἔρχομαιಯ ಮೂಲ ಅರ್ಥ ‘ಬರು/ಹೋಗು’; ಇಲ್ಲಿನ ಕಥನದ ದೃಷ್ಟಿಕೋನಕ್ಕೆ ‘ಬಂದನು’ ನೇರವಾಗಿ ಹೊಂದುತ್ತದೆ.
- source_word: ἰδίαν πόλιν
  choice: ತನ್ನ ಸ್ವಂತ ಊರಿಗೆ
  rationale: ἴδιος ಸಂಬಂಧ ಅಥವಾ ಸ್ವಂತಿಕೆಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ. πόλιςಗೆ ಶಬ್ದಶಃ ‘ನಗರ’ ಸಾಧ್ಯವಾದರೂ, ಆ ಸ್ಥಳವನ್ನು ಅನಗತ್ಯವಾಗಿ ದೊಡ್ಡ ನಗರವೆಂದು ಸೂಚಿಸದೆ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೇಳಲು ‘ಊರು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ‘ಸ್ವಂತ’ ಮೂಲದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Καὶ ... καὶ
  choice: ಆಗ ... ದಾಟಿ
  rationale: ಪುನರಾವರ್ತಿತ καί ಕ್ರಿಯೆಗಳನ್ನು ಸರಳ ಕಥನಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಯೊಂದು καίಯನ್ನೂ ‘ಮತ್ತು’ ಎಂದು ಅನುವಾದಿಸುವುದಕ್ಕಿಂತ ‘ಆಗ’ ಮತ್ತು ಕೃದಂತ ಸರಣಿ ಸಹಜವಾಗಿ ಅದೇ ಕ್ರಮವನ್ನು ನೀಡುತ್ತವೆ.
theological_decisions:
- issue: ‘ತನ್ನ ಸ್ವಂತ ಊರು’ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ?
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಊರಿನ ಹೆಸರನ್ನು ಹೇಳದೆ ಮೂಲದಂತೆ ತಟಸ್ಥವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಮತ್ತಾಯನ ಕಥನಸಂದರ್ಭದ ಆಧಾರದಿಂದ ಇದನ್ನು ಕಪೆರ್ನೌಮ್ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದು, ಅಥವಾ ಗಲಿಲಾಯದಲ್ಲಿದ್ದ ಯೇಸುವಿನ ಕಾರ್ಯಕೇಂದ್ರವೆಂದು ಹೇಳುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಊರಿನ ಹೆಸರನ್ನು ಹೇಳುವುದಿಲ್ಲ. ಸಂದರ್ಭವು ಬಹುಶಃ ಕಪೆರ್ನೌಮನ್ನು ಸೂಚಿಸಿದರೂ, ಆ ಗುರುತಿಸುವಿಕೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸುವುದು ಸೂಕ್ತ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಯೇಸು’ ಎಂಬ ಕರ್ತೃ ಗ್ರೀಕ್ ವಾಕ್ಯದಲ್ಲಿ ಅಪ್ರಕಟಿತವಾಗಿದ್ದರೂ, ಹಿಂದಿನ ಸಂದರ್ಭದ ಕರ್ತೃವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಿ ಸಹಜ ಓದನ್ನು ಒದಗಿಸಲಾಗಿದೆ. ಕೃದಂತಗಳ ಮೂಲಕ ಕ್ರಿಯೆಗಳ ಕ್ರಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
