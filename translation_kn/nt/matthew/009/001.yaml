- from: ಆಗ ಯೇಸು ದೋಣಿಯನ್ನು ಹತ್ತಿ, ಆಚೆ ದಡಕ್ಕೆ ದಾಟಿ, ತನ್ನ ಸ್ವಂತ ಊರಿಗೆ[a] ಬಂದನು.
  to: ದೋಣಿಗೆ ಹತ್ತಿ, ಆಚೆಗೆ ದಾಟಿ, ತನ್ನ ಸ್ವಂತ ನಗರಕ್ಕೆ[a] ಬಂದನು.
  rationale: The revision changes ‘ಊರು’ to ‘ನಗರ’ for closer fidelity to πόλις, smooths the expression for crossing over, and removes the unnecessary explicit subject name while preserving a clear and idiomatic Kannada narrative sequence. The footnote retains the source’s open wording and presents Capernaum only as a contextual likelihood, not as an asserted identification.
