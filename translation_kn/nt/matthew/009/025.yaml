id: MAT.9.25
reference: Matthew 9:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: kn
  text: ಆದರೆ ಜನರ ಗುಂಪನ್ನು ಹೊರಗೆ ಕಳುಹಿಸಲ್ಪಟ್ಟ ನಂತರ, ಅವರು ಒಳಗೆ ಹೋಗಿ ಆಕೆಯ ಕೈ ಹಿಡಿದರು; ಆಗ ಆ ಹುಡುಗಿ ಎದ್ದಳು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಆ ಹುಡುಗಿಯನ್ನು ಎಬ್ಬಿಸಲಾಯಿತು.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವನ್ನು ಎರಡೂ ರೀತಿಯಲ್ಲಿ ಅನುವಾದಿಸಬಹುದು.
    reason: ἠγέρθη ಎಂಬ ಪ್ಯಾಸಿವ್ ರೂಪವನ್ನು ಸಂದರ್ಭಾನುಸಾರ ಅಕರ್ತೃಕವಾಗಿ “ಎದ್ದಳು” ಎಂದೂ, ಪ್ಯಾಸಿವ್ ಆಗಿ “ಎಬ್ಬಿಸಲಾಯಿತು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಎರಡನೆಯ ರೂಪದಲ್ಲಿ ಕ್ರಿಯಾಕರ್ತನನ್ನು ಪಠ್ಯವು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ಆದರೆ ... ಬಳಿಕ
  rationale: ὅτε ಸೂಚಿಸುವ ಕಾಲಸಂಬಂಧವನ್ನು ‘ಬಳಿಕ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; δέಯ ಸೌಮ್ಯವಾದ ಕಥನ ತಿರುವನ್ನು ‘ಆದರೆ’ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: ಜನರ ಗುಂಪನ್ನು ಹೊರಗೆ ಕಳುಹಿಸಿದ
  rationale: ἐκβάλλω ಕ್ರಿಯೆಯ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ ಜನರನ್ನು ಸ್ಥಳದಿಂದ ಹೊರಗೆ ಕಳುಹಿಸುವುದು. ‘ಹೊರದಬ್ಬಿದ’ ಎನ್ನುವುದು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಲಪ್ರಯೋಗದ ಭಾವ ನೀಡಬಹುದು; ಕನ್ನಡದ ಈ ಕರ್ತೃಲೋಪದ ರಚನೆ ಕ್ರಿಯೆಗೊಳಗಾದ ಗುಂಪಿನ ಮೇಲೆ ಗಮನ ಇಡುತ್ತದೆ.
- source_word: εἰσελθὼν
  choice: ಅವರು ಒಳಗೆ ಹೋಗಿ
  rationale: ಅಯೋರಿಸ್ಟ್ ಕೃದಂತವು ಮುಂದಿನ ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಅನುಕ್ರಮ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಒಳಗೆ ಹೋಗಿ’ ಸಹಜ ಕಥನ ರೂಪ.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: ಆಕೆಯ ಕೈಹಿಡಿದರು
  rationale: κρατέω ಜೊತೆಗೆ ಷಷ್ಠೀ ವಿಭಕ್ತಿ ‘ಹಿಡಿದುಕೊಳ್ಳು/ಹಿಡಿಯು’ ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ. ‘ಕೈಹಿಡಿದರು’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು ಅನಗತ್ಯ ಬಲದ ಭಾವವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἠγέρθη
  choice: ಎದ್ದಳು
  rationale: ἐγείρωದ ಅಯೋರಿಸ್ಟ್ ಪ್ಯಾಸಿವ್ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂದರ್ಭಾನುಸಾರ ಅಕರ್ತೃಕವಾಗಿ ‘ಎದ್ದಳು’ ಎಂದು ಸಹಜವಾಗಿ ಹೇಳಬಹುದು. ಇದು ಫಲಿತಾಂಶವನ್ನು ತಿಳಿಸಿ, ಕ್ರಿಯಾಕರ್ತನನ್ನು ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: τὸ κοράσιον
  choice: ಆ ಹುಡುಗಿ
  rationale: κοράσιον ಎಂದರೆ ಹುಡುಗಿ ಅಥವಾ ಚಿಕ್ಕ ಹುಡುಗಿ. ‘ಆ ಹುಡುಗಿ’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟ ಮತ್ತು ಸಂದರ್ಭಕ್ಕೆ ಸಮರ್ಪಕ.
theological_decisions:
- issue: ಜೀವಕ್ಕೆ ಮರಳಿಸುವ ಸಂದರ್ಭದಲ್ಲಿನ ἠγέρθη ಪದದ ಅನುವಾದ
  choice: ಎದ್ದಳು
  alternative: ಎಬ್ಬಿಸಲಾಯಿತು
  rationale: ಗ್ರೀಕ್ ಪ್ಯಾಸಿವ್ ರೂಪವು ‘ಎದ್ದಳು’ ಎಂಬ ಅಕರ್ತೃಕ ಫಲಿತಾಂಶವನ್ನಾಗಿಯೂ ‘ಎಬ್ಬಿಸಲಾಯಿತು’ ಎಂಬ ಪ್ಯಾಸಿವ್ ಅರ್ಥವನ್ನಾಗಿಯೂ ಪ್ರತಿನಿಧಿಸಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜ ಕನ್ನಡವನ್ನು ಬಳಸಿದ್ದು, ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಿ ಕ್ರಿಯಾಕರ್ತನ ಕುರಿತ ಅರ್ಥವನ್ನು ಮೌನವಾಗಿ ನಿರ್ಧರಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವನ್ನು ಸೂಚಿಸಲು ಗೌರವ ಏಕವಚನವಾದ ‘ಅವರು’ ಬಳಸಲಾಗಿದೆ; ಅತಿಪುರಾತನ ಪದಗಳು ಮತ್ತು ಸಂದರ್ಭಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಲ ಸೂಚಿಸುವ ಪದಗಳನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
