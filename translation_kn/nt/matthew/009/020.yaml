    rationale: προσελθοῦσα specifically denotes approaching or coming near. ‘ಹಿಂದಿನಿಂದ ಬಂದು’ indicates direction and movement but can leave the approach component less explicit. ‘ಹಿಂದಿನಿಂದ ಹತ್ತಿರ ಬಂದು’ represents both elements naturally.
