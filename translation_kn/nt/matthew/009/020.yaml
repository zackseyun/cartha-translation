id: MAT.9.20
reference: Matthew 9:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: kn
  text: ಆಗ ಇಗೋ, ಹನ್ನೆರಡು ವರ್ಷಗಳಿಂದ ರಕ್ತಸ್ರಾವದಿಂದ ಬಳಲುತ್ತಿದ್ದ ಒಬ್ಬ ಸ್ತ್ರೀ ಹಿಂದಿನಿಂದ ಹತ್ತಿರ ಬಂದು, ಅವರ ಮೇಲಂಗಿಯ ಅಂಚನ್ನು[a][b] ಮುಟ್ಟಿದಳು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಜಾಲರು’ ಅಥವಾ ‘ಕುಚ್ಚು’; ಗ್ರೀಕ್ ಪದವು ಉಡುಪಿನ ಅಂಚನ್ನಾಗಲಿ, ಯೆಹೂದ್ಯರ ಉಡುಪಿಗೆ ಸಂಬಂಧಿಸಿದ ಕುಚ್ಚುಳ್ಳ ಅಂಚನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಇಸ್ರಾಯೇಲಿನ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಉಡುಪಿನ ಜಾಲರು ಅಥವಾ ಕುಚ್ಚುಗಳ ಹಿನ್ನೆಲೆಗಾಗಿ ಅರಣ್ಯಕಾಂಡ 15:38 ಮತ್ತು ಧರ್ಮೋಪದೇಶಕಾಂಡ 22:12 ನೋಡಿ.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: ಆಗ ಇಗೋ
  rationale: Καί ಅನ್ನು ಕಥನದ ಮುಂದುವರಿಕೆಗೆ ಸಹಜವಾದ ‘ಆಗ’ ಎಂದೂ, ἰδού ಪದದ ಗಮನಸೆಳೆಯುವ ಮತ್ತು ಅಚ್ಚರಿಯನ್ನು ಸೂಚಿಸುವ ಬಲವನ್ನು ‘ಇಗೋ’ ಎಂದೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: γυνὴ
  choice: ಒಬ್ಬ ಸ್ತ್ರೀ
  rationale: ಅನಿರ್ದಿಷ್ಟವಾಗಿ ಪರಿಚಯಿಸಲ್ಪಡುವ ಮಹಿಳೆಯನ್ನು ಆಧುನಿಕ, ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: αἱμορροοῦσα δώδεκα ἔτη
  choice: ಹನ್ನೆರಡು ವರ್ಷಗಳಿಂದ ರಕ್ತಸ್ರಾವದಿಂದ ಬಳಲುತ್ತಿದ್ದ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಸೂಚಿಸುವ ನಿರಂತರ ರಕ್ತಸ್ರಾವವನ್ನೂ, ಕಾಲಾವಧಿಯ ದೀರ್ಘತೆಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ತೀವ್ರವಾದ ತಕ್ಷಣದ ರಕ್ತಸ್ರಾವವೆಂದು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: προσελθοῦσα ὄπισθεν
  choice: ಹಿಂದಿನಿಂದ ಬಂದು
  rationale: ಆಕೆ ಯೇಸುವಿನ ಹಿಂಬದಿಯಿಂದ ಸಮೀಪಿಸಿದ ಚಲನೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἥψατο
  choice: ಮುಟ್ಟಿದಳು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ἅπτω ಪದದ ಸರಳ ಅರ್ಥವಾದ ಸ್ಪರ್ಶವನ್ನು ಕೊಡುತ್ತದೆ; ಹಿಡಿದುಕೊಂಡಳು ಅಥವಾ ಬಿಗಿಯಾಗಿ ಗ್ರಹಿಸಿದಳು ಎಂಬ ಹೆಚ್ಚುವರಿ ಅರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: τοῦ κρασπέδου
  choice: ಅಂಚನ್ನು
  rationale: κράσπεδον ಬಟ್ಟೆಯ ಅಂಚು, ಅಂಚಿನ ಜಾಲರು ಅಥವಾ ಕುಚ್ಚನ್ನು ಸೂಚಿಸಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಅಂಚು’ ಸಹಜವಾಗಿದ್ದು ಅರ್ಥವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯಗಳನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ಅವರ ಮೇಲಂಗಿಯ
  rationale: ἱμάτιον ಸಾಮಾನ್ಯವಾಗಿ ಹೊರಗೆ ಧರಿಸುವ ಉಡುಪನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮೇಲಂಗಿ’ ಕನ್ನಡದಲ್ಲಿ ಆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಕೊಡುತ್ತದೆ; ಯೇಸುವಿಗೆ ಗೌರವ ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸರ್ವನಾಮರೂಪ ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: κράσπεδον ಪದವು ಯೆಹೂದ್ಯರ ಉಡುಪಿನ ಕುಚ್ಚು ಅಥವಾ ಜಾಲರಿನ ಧಾರ್ಮಿಕ ಹಿನ್ನೆಲೆಯನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಅಂಚು’ ಎಂದು ಅನುವಾದಿಸಿ, ‘ಜಾಲರು’ ಅಥವಾ ‘ಕುಚ್ಚು’ ಎಂಬ ಸಾಧ್ಯತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸುವುದು
  alternative: ‘ಕುಚ್ಚು’ ಎಂದು ನೇರವಾಗಿ ಅನುವಾದಿಸಿ ಅರಣ್ಯಕಾಂಡ 15:38 ಮತ್ತು ಧರ್ಮೋಪದೇಶಕಾಂಡ 22:12ರ ಹಿನ್ನೆಲೆಯನ್ನು ಮುಂಚೂಣಿಗೆ ತರುವುದು
  rationale: ಗ್ರೀಕ್ ಪದವು ಉಡುಪಿನ ಅಂಚನ್ನಾಗಲಿ ಅಂಚಿಗೆ ಜೋಡಿಸಿದ ಕುಚ್ಚನ್ನಾಗಲಿ ಸೂಚಿಸಬಲ್ಲದು. ಈ ವಾಕ್ಯವೇ ಅದರ ಧಾರ್ಮಿಕ ಸಂಕೇತಾರ್ಥವನ್ನು ವಿವರಿಸದಿರುವುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಒಂದೇ ವ್ಯಾಖ್ಯಾನವನ್ನು ಬಲವಂತವಾಗಿ ನಿಗದಿಪಡಿಸದೆ, ಸಾಧ್ಯ ಹಿನ್ನೆಲೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಮೂಲಕ ಮೂಲದ ಜೀವಂತ ಗಮನಸೆಳೆಯುವ ಸೂಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ದೀರ್ಘಕಾಲದ ವೈದ್ಯಕೀಯ ಸ್ಥಿತಿಗೆ ‘ರಕ್ತಸ್ರಾವದಿಂದ ಬಳಲುತ್ತಿದ್ದ’ ಎಂಬ ಸ್ಪಷ್ಟವಾದರೂ ಶಿಷ್ಟವಾದ ಪದಪ್ರಯೋಗ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಸಂಬಂಧಿತ ‘ಅಂಚನ್ನು’ ಪದದ ನಂತರ ಕ್ರಮವಾಗಿ ಸೇರಿವೆ.
