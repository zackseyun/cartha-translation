  source_fidelity: 'ಮೂಲ ಗ್ರೀಕ್ ಪಠ್ಯದ ಎಲ್ಲಾ ಮುಖ್ಯ ಅಂಶಗಳು ನಿಷ್ಠೆಯಿಂದ ಪ್ರತಿಬಿಂಬಗೊಂಡಿವೆ: ಯೇಸುವಿನ ತಿರುಗಿ ನೋಡುವಿಕೆ, ಆತ್ಮೀಯವಾದ “ಮಗಳೇ” ಸಂಬೋಧನೆ, ಧೈರ್ಯದ ಆಜ್ಞೆ, πίστις‌ನ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುವ “ನಂಬಿಕೆ,” σέσωκέν σεಗೆ “ರಕ್ಷಿಸಿದೆ,” ಮತ್ತು ತಕ್ಷಣದ ದೈಹಿಕ ಗುಣಮುಖತೆಯನ್ನು ಸೂಚಿಸುವ ἐσώθηಗೆ “ಗುಣಮುಖಳಾದಳು.” “ಆ ಕ್ಷಣದಿಂದಲೇ” ಎಂಬುದು ἀπὸ τῆς ὥρας ἐκείνηςಗೆ ಸಹಜ ಮತ್ತು ಸಮರ್ಪಕವಾಗಿದೆ.'
  naturalness: ಪಠ್ಯವು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸ್ವಾಭಾವಿಕ, ಸ್ಪಷ್ಟ ಮತ್ತು ಗೌರವಯುತವಾಗಿದೆ. “ತಿರುಗಿ ಆಕೆಯನ್ನು ನೋಡಿ … ಎಂದನು” ಎಂಬ ಕೃದಂತ ಬಳಕೆ ಕನ್ನಡದ ಕಥನಶೈಲಿಗೆ ಸಹಜವಾಗಿದೆ. “ಧೈರ್ಯವಾಗಿರು” ಇಲ್ಲಿ ನೇರವಾದ ಮತ್ತು ಅರ್ಥಪೂರ್ಣ ಸಂಬೋಧನೆಯಾಗಿದೆ.
  terminology: “ಮಗಳೇ,” “ನಂಬಿಕೆ,” “ರಕ್ಷಿಸಿದೆ,” ಮತ್ತು “ಗುಣಮುಖಳಾದಳು” ಎಂಬ ಪದಚಯನಗಳು ಸಂದರ್ಭಕ್ಕೆ ಸೂಕ್ತವಾಗಿವೆ. ಯೇಸುವಿನ ಮಾತಿನಲ್ಲಿರುವ σῴζωಯ ರಕ್ಷಣೆ/ಗುಣಪಡಿಸುವಿಕೆಯ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು “ರಕ್ಷಿಸಿದೆ” ಉಳಿಸುತ್ತದೆ; ನಂತರದ ಕಥನದಲ್ಲಿ “ಗುಣಮುಖಳಾದಳು” ತಕ್ಷಣದ ದೈಹಿಕ ಫಲಿತಾಂಶವನ್ನು ಸರಿಯಾಗಿ ತಿಳಿಸುತ್ತದೆ. ಟಿಪ್ಪಣಿಗಳು ಪರ್ಯಾಯಗಳನ್ನು ಸಮರ್ಪಕವಾಗಿ ಒದಗಿಸುತ್ತವೆ.
