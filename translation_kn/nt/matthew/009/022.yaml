id: MAT.9.22
reference: Matthew 9:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: kn
  text: ಆದರೆ ಯೇಸು ತಿರುಗಿ ಆಕೆಯನ್ನು ನೋಡಿ, “ಮಗಳೇ, ಧೈರ್ಯವಾಗಿರು[a]; ನಿನ್ನ ನಂಬಿಕೆ[b] ನಿನ್ನನ್ನು ರಕ್ಷಿಸಿದೆ[c]” ಎಂದನು. ಆ ಕ್ಷಣದಿಂದಲೇ ಆ ಮಹಿಳೆ ಗುಣಮುಖಳಾದಳು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಎದೆಗುಂದಬೇಡ.”
    reason: lexical_alternative
  - marker: b
    text: ಇಲ್ಲಿ “ನಂಬಿಕೆ” ಎಂಬುದನ್ನು “ವಿಶ್ವಾಸ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: alternative_reading
  - marker: c
    text: ಅಥವಾ, “ನಿನ್ನನ್ನು ಗುಣಪಡಿಸಿದೆ” ಅಥವಾ “ನಿನ್ನನ್ನು ಗುಣಮುಖಳನ್ನಾಗಿ ಮಾಡಿದೆ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ರಕ್ಷಿಸುವುದು, ಗುಣಪಡಿಸುವುದು ಅಥವಾ ಕ್ಷೇಮಗೊಳಿಸುವುದು ಎಂಬ ಅರ್ಥಗಳನ್ನು ಕೊಡಬಲ್ಲದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: ತಿರುಗಿ ಆಕೆಯನ್ನು ನೋಡಿ
  rationale: ಎರಡೂ ಕೃದಂತಗಳ ಕ್ರಮಬದ್ಧ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ; ತಿರುಗಿದ ದಿಕ್ಕನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: Θάρσει
  choice: ಧೈರ್ಯವಾಗಿರು
  rationale: ಧೈರ್ಯ ಮತ್ತು ಭರವಸೆಯಿಂದ ಇರುವಂತೆ ಹೇಳುವ ಏಕವಚನ ಆಜ್ಞೆಯನ್ನು ನೇರವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: θύγατερ
  choice: ಮಗಳೇ
  rationale: ಮೂಲದ ಆತ್ಮೀಯ ಕುಟುಂಬಸಂಬಂಧದ ಸಂಬೋಧನೆಯನ್ನು ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ಭಾವಾರ್ಥ ಸೇರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: πίστις
  choice: ನಂಬಿಕೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸುವಿನ ಮೇಲೆ ಇಟ್ಟ ವಿಶ್ವಾಸವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ; ‘ವಿಶ್ವಾಸ’ವೂ ಸಾಧ್ಯವಾದ ಪರ್ಯಾಯ.
- source_word: σέσωκέν σε
  choice: ನಿನ್ನನ್ನು ರಕ್ಷಿಸಿದೆ
  rationale: σῴζω ಪದದ ರಕ್ಷಣೆ, ಉದ್ಧಾರ ಮತ್ತು ಗುಣಪಡಿಸುವಿಕೆ ಎಂಬ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಯೇಸುವಿನ ಮಾತಿನಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐσώθη
  choice: ಗುಣಮುಖಳಾದಳು
  rationale: ಇಲ್ಲಿ ಕಥನದ ತಕ್ಷಣದ ಫಲಿತಾಂಶ ದೈಹಿಕ ಗುಣಮುಖತೆಯಾಗಿರುವುದರಿಂದ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ಆ ಕ್ಷಣದಿಂದಲೇ
  rationale: ಆ ಸಮಯದಿಂದ ಆರಂಭವಾದ ತಕ್ಷಣದ ಮತ್ತು ಮುಂದುವರಿದ ಫಲಿತಾಂಶವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: πίστις ಪದದ ಅರ್ಥ
  choice: ನಂಬಿಕೆ
  alternative: ವಿಶ್ವಾಸ
  rationale: ಮಹಿಳೆಯ ಭರವಸೆಯ ನಂಬಿಕೆಯೇ ಇಲ್ಲಿ ಮುಖ್ಯ; ‘ನಂಬಿಕೆ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದ್ದು, ‘ವಿಶ್ವಾಸ’ ಎಂಬ ಸಮೀಪಾರ್ಥವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ಯೇಸುವಿನ ಮಾತು ಮತ್ತು ಕಥನದಲ್ಲಿ σῴζω ಪದದ ನಿರೂಪಣೆ
  choice: ಯೇಸುವಿನ ಮಾತಿನಲ್ಲಿ ‘ರಕ್ಷಿಸಿದೆ’; ಕಥನದ ಫಲಿತಾಂಶದಲ್ಲಿ ‘ಗುಣಮುಖಳಾದಳು’
  alternative: ಎರಡೂ ಕಡೆ ‘ಗುಣಪಡಿಸಿದೆ/ಗುಣಮುಖಳಾದಳು’ ಅಥವಾ ಎರಡೂ ಕಡೆ ‘ರಕ್ಷಿಸಿದೆ/ರಕ್ಷಿಸಲ್ಪಟ್ಟಳು’
  rationale: ಒಂದೇ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ರಕ್ಷಣೆ ಮತ್ತು ಗುಣಪಡಿಸುವಿಕೆ ಎರಡನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲದು. ಯೇಸುವಿನ ಮಾತಿನಲ್ಲಿ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಕಥನದಲ್ಲಿ ದೈಹಿಕ ಫಲಿತಾಂಶವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದರಿಂದ ಮೂಲದಲ್ಲಿರುವ ಅರ್ಥದ ಒತ್ತಡವನ್ನು ಅಳಿಸದೆ ಕಾಪಾಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಮಗಳೇ’ ಎಂಬ ಸಂಬೋಧನೆಯ ಆತ್ಮೀಯತೆ ಮತ್ತು ‘ರಕ್ಷಿಸಿದೆ/ಗುಣಮುಖಳಾದಳು’ ಎಂಬ ಅರ್ಥವ್ಯಾಪ್ತಿಯ ವ್ಯತ್ಯಾಸವನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
