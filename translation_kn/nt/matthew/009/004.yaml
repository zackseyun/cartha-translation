  naturalness: The wording is clear, idiomatic modern standard Kannada, and the direct-question construction is natural. “ಕೆಟ್ಟದ್ದನ್ನು” is an acceptable natural substantival rendering of the Greek neuter plural in this context; it does not require an added noun such as “ವಿಷಯಗಳನ್ನು.”
  terminology: “ಆಲೋಚನೆಗಳು,” “ತಿಳಿದು,” and “ಹೃದಯಗಳಲ್ಲಿ” are suitable, consistent choices. The footnote provides a legitimate lexical alternative for εἰδὼς and its marker is correctly anchored after “ತಿಳಿದು.”
