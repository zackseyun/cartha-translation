id: MAT.9.4
reference: Matthew 9:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: kn
  text: ಯೇಸು ಅವರ ಆಲೋಚನೆಗಳನ್ನು ತಿಳಿದು[a], “ನೀವು ನಿಮ್ಮ ಹೃದಯಗಳಲ್ಲಿ ಕೆಟ್ಟದ್ದನ್ನು ಏಕೆ ಯೋಚಿಸುತ್ತಿದ್ದೀರಿ?” ಎಂದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅವರ ಆಲೋಚನೆಗಳನ್ನು ಗ್ರಹಿಸಿ.”
    reason: εἰδὼς ಎಂಬ ಪದವು ತಿಳಿದಿರುವುದು ಅಥವಾ ಗ್ರಹಿಸುವುದು ಎಂಬ ಅರ್ಥಛಾಯೆಗಳನ್ನು ಹೊಂದಿರುವುದರಿಂದ ಈ ಪರ್ಯಾಯವನ್ನು ನೀಡಲಾಗಿದೆ.
lexical_decisions:
- source_word: εἰδὼς
  choice: ತಿಳಿದು
  rationale: ಈ ಕೃದಂತವು ಯೇಸು ಅವರ ಅಂತರಂಗದ ಆಲೋಚನೆಗಳನ್ನು ಅರಿತಿದ್ದುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಿಳಿದು’ ಎಂಬುದು ಸಹಜವೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆಗಿದ್ದು, ಮೂಲದಲ್ಲಿರುವ ಜ್ಞಾನ ಅಥವಾ ಗ್ರಹಿಕೆಯ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐνθυμήσεις
  choice: ಆಲೋಚನೆಗಳನ್ನು
  rationale: ಈ ನಾಮಪದವು ಮನಸ್ಸಿನೊಳಗಿನ ಚಿಂತನೆ ಅಥವಾ ತರ್ಕವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಆಲೋಚನೆಗಳು’ ಆ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: Ἱνατί
  choice: ಏಕೆ
  rationale: ಕಾರಣ ಅಥವಾ ಉದ್ದೇಶವನ್ನು ಪ್ರಶ್ನಿಸುವ ಈ ಪದಕ್ಕೆ ‘ಏಕೆ’ ಸ್ಪಷ್ಟವಾದ ಮತ್ತು ಸಹಜವಾದ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
- source_word: ἐνθυμεῖσθε
  choice: ಯೋಚಿಸುತ್ತಿದ್ದೀರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಈ ಕ್ರಿಯಾಪದವು ನಡೆಯುತ್ತಿರುವ ಅಂತರಂಗದ ಚಿಂತನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಯೋಚಿಸುತ್ತಿದ್ದೀರಿ’ ಆ ನಿರಂತರತೆಯನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πονηρὰ
  choice: ಕೆಟ್ಟದ್ದನ್ನು
  rationale: ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನ ವಿಶೇಷಣವು ಇಲ್ಲಿ ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿ ಕೆಟ್ಟ ಅಥವಾ ದುಷ್ಟ ವಿಷಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕೆಟ್ಟದ್ದನ್ನು’ ಅನಗತ್ಯ ವಿವರಣೆ ಸೇರಿಸದೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: καρδίαις
  choice: ಹೃದಯಗಳಲ್ಲಿ
  rationale: ಮೂಲದ ‘ಹೃದಯ’ ರೂಪಕವು ಆಲೋಚನೆ ಮತ್ತು ಉದ್ದೇಶಗಳನ್ನೊಳಗೊಂಡ ಅಂತರಂಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮನಸ್ಸುಗಳಲ್ಲಿ’ ಎಂದು ಸೀಮಿತಗೊಳಿಸದೆ ಮೂಲದ ಧಾರ್ಮಿಕ ಮತ್ತು ರೂಪಕಾತ್ಮಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸು ಹೇಳದೆ ಉಳಿದ ಅವರ ಅಂತರಂಗದ ಆಲೋಚನೆಗಳನ್ನು ಅರಿತಿರುವುದು
  choice: ಯೇಸು ಅವರ ಆಲೋಚನೆಗಳನ್ನು ತಿಳಿದು
  alternative: ಯೇಸು ಅವರ ಆಲೋಚನೆಗಳನ್ನು ಗ್ರಹಿಸಿ
  rationale: ವಾಕ್ಯವು ಯೇಸು ಅವರ ಅಂತರಂಗದ ತರ್ಕವನ್ನು ಅರಿತಿದ್ದನೆಂದು ಹೇಳುತ್ತದೆ. ‘ತಿಳಿದು’ ಆ ಹೇಳಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಆದರೆ ಅದನ್ನು ಮೂಲಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ವಿಸ್ತರಿಸಿ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತದ ವಿವರಣೆಯಾಗಿ ರೂಪಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಹೃದಯಗಳಲ್ಲಿ’ ಎಂಬ ಮೂಲ ರೂಪಕವನ್ನು ಉಳಿಸಿ, ಪ್ರಶ್ನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದ ಪದಕ್ರಮದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
