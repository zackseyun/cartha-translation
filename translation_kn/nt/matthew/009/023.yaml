source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: kn
  text: ಯೇಸು ಆ ಮುಖ್ಯಸ್ಥನ[a] ಮನೆಗೆ ಬಂದು, ಕೊಳಲು ವಾದಕರನ್ನೂ[b] ಗದ್ದಲ ಮಾಡುತ್ತಿದ್ದ ಜನರ ಗುಂಪನ್ನೂ[c] ಕಂಡನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಅಧಿಕಾರಿಯ.’ ಸಮಾನಾಂತರ ವೃತ್ತಾಂತಗಳ ಆಧಾರದಲ್ಲಿ ‘ಸಭಾಮಂದಿರದ ಮುಖ್ಯಸ್ಥ’ ಎಂದೂ ತಿಳಿಯಬಹುದು; ಆದರೆ ಮತ್ತಾಯನು ಇಲ್ಲಿ ಸರಳವಾಗಿ ‘ಮುಖ್ಯಸ್ಥ’ ಎಂಬ ಸಾಮಾನ್ಯ ಪದವನ್ನೇ ಬಳಸಿದ್ದಾನೆ.
    reason: alternative_reading
  - marker: b
    text: ಆ ಕಾಲದ ಯೆಹೂದಿ ಶೋಕಾಚರಣೆಗಳಲ್ಲಿ ಕೊಳಲು ವಾದಕರು ರೂಢಿಯಾಗಿದ್ದರು.
    reason: cultural_note
  - marker: c
    text: ಅಥವಾ ‘ಕೋಲಾಹಲದಲ್ಲಿದ್ದ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ಬಂದು
  rationale: ಭೂತಕಾಲದ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಸಹಜ ಕಾಲಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಬಂದು ... ಕಂಡನು’ ಎಂಬುದು ನೇರವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: οἰκίαν
  choice: ಮನೆಗೆ
  rationale: οἰκία ಎಂಬ ಪದದ ಸರಳ ಅರ್ಥವನ್ನು ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἄρχοντος
  choice: ಅಧಿಕಾರಿಯ
  rationale: ಮತ್ತಾಯನು ಇಲ್ಲಿ ಬಳಸಿರುವ ವಿಶಾಲ ಅರ್ಥದ ἄρχων ಪದವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಮಾನಾಂತರ ವೃತ್ತಾಂತಗಳ ಆಧಾರದಲ್ಲಿ ‘ಸಭಾಮಂದಿರದ ಅಧಿಕಾರಿ’ ಎಂದು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἰδὼν
  choice: ಕಂಡನು
  rationale: ಸರಳ ನಿರೂಪಣಾತ್ಮಕ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: αὐλητὰς
  choice: ಕೊಳಲು ವಾದಕರನ್ನು
  rationale: ಶೋಕಾಚರಣೆಯಲ್ಲಿ ಕೊಳಲು ಅಥವಾ ನಳಿಕೆಯ ವಾದ್ಯ ನುಡಿಸುವವರನ್ನು ಸೂಚಿಸುವ ಪದಕ್ಕೆ ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: ὄχλον
  choice: ಜನರ ಗುಂಪನ್ನು
  rationale: ὄχλος ಪದದ ಸಾಮಾನ್ಯ ನಿರೂಪಣಾತ್ಮಕ ಅರ್ಥವನ್ನು ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: θορυβούμενον
  choice: ಗದ್ದಲ ಮಾಡುತ್ತಿದ್ದ
  rationale: ನಡೆಯುತ್ತಿದ್ದ ಶಬ್ದಭರಿತ ಗೊಂದಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಶೋಕದ ಭಾವನೆಯನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಮನೆಯ ಯಜಮಾನನ ಗುರುತು
  choice: ಅಧಿಕಾರಿ
  alternative: ಆಡಳಿತಗಾರ; ಸಭಾಮಂದಿರದ ಅಧಿಕಾರಿ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ἄρχων ಎಂಬ ಸಾಮಾನ್ಯ ಪದ ಮಾತ್ರ ಇದೆ. ಆದ್ದರಿಂದ ಸಮಾನಾಂತರ ವೃತ್ತಾಂತಗಳಿಂದ ಹೆಚ್ಚಿನ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ತರದೆ ಮೂಲದ ವ್ಯಾಪಕತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
