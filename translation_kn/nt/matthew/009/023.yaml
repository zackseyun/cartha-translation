  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ನಿರೂಪಣಾತ್ಮಕ ಶೈಲಿ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಕಾಲಕ್ರಮವನ್ನು ‘ಬಂದು ... ಕಂಡನು’ ಮೂಲಕ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ಎಲ್ಲಾ ಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಅವು ವಿವರಿಸುವ ಪದಗುಚ್ಛಗಳ ತಕ್ಷಣ ಇರಿಸಲಾಗಿದೆ.
