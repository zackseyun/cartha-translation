id: MAT.9.29
reference: Matthew 9:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: kn
  text: ಆಗ ಆತನು ಅವರ ಕಣ್ಣುಗಳನ್ನು ಮುಟ್ಟಿ, “ನಿಮ್ಮ ನಂಬಿಕೆಯ[a] ಪ್ರಕಾರ ನಿಮಗೆ ಆಗಲಿ” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಿಮ್ಮ ಭರವಸೆಗೆ ತಕ್ಕಂತೆ ನಿಮಗೆ ಆಗಲಿ.” ಗ್ರೀಕ್ ಪದ πίστις ಅನ್ನು “ನಂಬಿಕೆ” ಅಥವಾ “ಭರವಸೆ” ಎಂದೂ, ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ “ನಿಷ್ಠೆ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಘಟನೆಗಳ ಕ್ರಮದಲ್ಲಿ ಮುಂದಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಹಾಗೂ ಸಂಕ್ಷಿಪ್ತ ಕಥನರೂಪ.
- source_word: ἥψατο
  choice: ಮುಟ್ಟಿ
  rationale: ἅπτομαι ಎಂಬ ಮಧ್ಯಮ ರೂಪವು ಇಲ್ಲಿ ದೈಹಿಕವಾಗಿ ಸ್ಪರ್ಶಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಮುಟ್ಟಿ’ ಸರಳ ಮತ್ತು ಸಹಜ.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: ಅವರ ಕಣ್ಣುಗಳನ್ನು
  rationale: ἅπτομαι ನಂತರದ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ನೇರ ಕರ್ಮವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: λέγων
  choice: ಎಂದು ಹೇಳಿದನು
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಡನೆ ಸಮಕಾಲೀನವಾದ ವರ್ತಮಾನ ಕೃದಂತರವನ್ನು ಸಹಜ ಕನ್ನಡದ ನೇರ ಉಕ್ತಿರಚನೆಯಾಗಿ ನೀಡಲಾಗಿದೆ.
- source_word: Κατὰ
  choice: ಪ್ರಕಾರ
  rationale: κατά ಇಲ್ಲಿ ಹೊಂದಾಣಿಕೆ ಅಥವಾ ಅಳತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಪ್ರಕಾರ’ ಕಾರಣಾತ್ಮಕ ಅರ್ಥವನ್ನು ಹೆಚ್ಚಿಸದೆ ಅದನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὴν πίστιν ὑμῶν
  choice: ನಿಮ್ಮ ನಂಬಿಕೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ πίστις ಯೇಸುವಿನ ಗುಣಪಡಿಸುವ ಸಾಮರ್ಥ್ಯದ ಮೇಲಿನ ಅಂಧರ ಭರವಸೆ/ವಿಶ್ವಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆಧುನಿಕ ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ‘ನಂಬಿಕೆ’ ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ.
- source_word: γενηθήτω
  choice: ಆಗಲಿ
  rationale: γίνομαι ಎಂಬ ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲಿಕ ನಿಷ್ಕ್ರಿಯ ಆಜ್ಞಾರ್ಥಕ ರೂಪದ ಕಾರ್ಯಸಾಧಕ ಘೋಷಣೆಯನ್ನು ಕನ್ನಡದ ‘ಆಗಲಿ’ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಗೌರವಯುತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑμῖν
  choice: ನಿಮಗೆ
  rationale: ಪ್ರಯೋಜನಾರ್ಥಕ ದತ್ತಿವನ್ನು ಈ ಗುಣಪಡಿಸುವ ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾದ ಕನ್ನಡ ದತ್ತಿ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: ಗುಣಪಡಿಸುವಿಕೆಯ ಮಾತಿನಲ್ಲಿ πίστις ಪದದ ಅನುವಾದ
  choice: ನಂಬಿಕೆ
  alternative: ಭರವಸೆ; ನಂಬಿಗಸ್ತಿಕೆ
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿ ಇದು ಯೇಸು ಗುಣಪಡಿಸಬಲ್ಲನೆಂಬ ಆ ಪುರುಷರ ವಿಶ್ವಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನಂಬಿಕೆ’ ಸಾಮಾನ್ಯವಾಗಿ ಅರ್ಥವಾಗುವ ಮುಖ್ಯ ಪದ; ‘ಭರವಸೆ’ ಸಂದರ್ಭಸಾಧ್ಯ ಪರ್ಯಾಯ. ‘ನಂಬಿಗಸ್ತಿಕೆ’ ಪದಕೋಶಾತ್ಮಕವಾಗಿ ಸಾಧ್ಯವಾದರೂ ಇಲ್ಲಿ ಸಂದರ್ಭಕ್ಕೆ ಕಡಿಮೆ ಹೊಂದಿಕೆಯಾಗುತ್ತದೆ.
- issue: κατά ಮೂಲಕ ನಂಬಿಕೆ ಮತ್ತು ಫಲದ ಸಂಬಂಧ
  choice: ನಿಮ್ಮ ನಂಬಿಕೆಯ ಪ್ರಕಾರ
  alternative: ನಿಮ್ಮ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಹೊಂದಾಣಿಕೆ ಅಥವಾ ಅಳತೆಯನ್ನು ಹೇಳುತ್ತದೆ; ನಂಬಿಕೆಯನ್ನು ಯಾಂತ್ರಿಕ ಕಾರಣ ಅಥವಾ ಅರ್ಹತೆಯಾಗಿ ನಿರ್ಧರಿಸುವ ಬಲವಾದ ಅರ್ಥವನ್ನು ಸೇರಿಸದಿರಲು ‘ಪ್ರಕಾರ’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆತನು’ ಎಂಬ ರೂಪವು ಬೈಬಲ್ ಕಥನಕ್ಕೆ ತಕ್ಕ ಘನತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಉಕ್ತಿ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವಂತೆ ಸಂಕ್ಷಿಪ್ತವಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
