id: MAT.9.37
reference: Matthew 9:37
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: kn
  text: 'ಆಗ ಆತನು ತನ್ನ ಶಿಷ್ಯರಿಗೆ ಹೇಳುತ್ತಾನೆ[a]: “ಕೊಯ್ಲು ಹೇರಳವಾಗಿದೆ[b]; ಆದರೆ ಕೆಲಸಗಾರರು ಕೆಲವೇ ಮಂದಿ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲಿ ಕಥನಾತ್ಮಕ ವರ್ತಮಾನಕಾಲವಿದೆ: “ಹೇಳುತ್ತಾನೆ.” ಕೆಲವು ಅನುವಾದಗಳು “ಹೇಳಿದನು” ಎಂದು ಕೊಡುತ್ತವೆ.'
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ಕೊಯ್ಲು ಬಹಳವಾಗಿದೆ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಕಥನದ ಕಾಲಾನುಕ್ರಮವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: λέγει
  choice: ಹೇಳುತ್ತಾನೆ
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನ ಕಥನಾತ್ಮಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಿ, ದೃಶ್ಯಕ್ಕೆ ಜೀವಂತಿಕೆಯನ್ನು ನೀಡುತ್ತದೆ.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ತನ್ನ ಶಿಷ್ಯರಿಗೆ
  rationale: αὐτοῦ ಎಂಬ ಸ್ಪಷ್ಟ ಸ್ವಾಮ್ಯಸೂಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಶಿಷ್ಯರು’ μαθηταί ಪದದ ರೂಢಿಯಾದ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: …; ಆದರೆ …
  rationale: μέν…δέ ರಚನೆಯ ವಿರೋಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕೃತಕವಾದ ‘ಒಂದೆಡೆ…ಮತ್ತೊಂದೆಡೆ’ ರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: θερισμός
  choice: ಕೊಯ್ಲು
  rationale: ಕೃಷಿಗೆ ಸಂಬಂಧಿಸಿದ ಮೂಲ ರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: πολύς
  choice: ಹೇರಳವಾಗಿದೆ
  rationale: ಕೊಯ್ಲಿನ ಸಮೃದ್ಧಿ ಅಥವಾ ಅಧಿಕ ಪ್ರಮಾಣವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐργάται
  choice: ಕೆಲಸಗಾರರು
  rationale: ಕೆಲಸ ಮಾಡುವವರನ್ನು ಸೂಚಿಸುವ ಆಧುನಿಕ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಮತ್ತು ಲಿಂಗನಿರಪೇಕ್ಷವಾದ ಕನ್ನಡ ಪದ.
- source_word: ὀλίγοι
  choice: ಕೆಲವೇ ಮಂದಿ
  rationale: ಕೆಲಸಗಾರರ ಸಂಖ್ಯೆ ಕಡಿಮೆ ಎಂಬ ಸರಳ ವಿರೋಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ತೀರಾ ಕಡಿಮೆ’ ಎಂಬ ತೀವ್ರತೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಕೊಯ್ಲಿನ ರೂಪಕದ ಅರ್ಥ
  choice: ಕೃಷಿಗೆ ಸಂಬಂಧಿಸಿದ ‘ಕೊಯ್ಲು’ ರೂಪಕವನ್ನು ವಿವರಣೆ ಸೇರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಕೊಯ್ಲು ಎಂದರೆ ಸೇವೆಗೆ ಸಿದ್ಧರಾಗಿರುವ ಜನರು ಎಂದು ಅನುವಾದದಲ್ಲೇ ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಈ ವಾಕ್ಯವೇ ರೂಪಕದ ಉದ್ದೇಶಿತ ಅರ್ಥವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಸುತ್ತಲಿನ ಸಂದರ್ಭಕ್ಕೆ ಸೇರಿದ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ, ಮೂಲದ ರೂಪಕ ಮತ್ತು ಅದರ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಸ್ಪಷ್ಟ ಮತ್ತು ಗೌರವಪೂರ್ಣ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಕಥನಾತ್ಮಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಕೃಷಿ ರೂಪಕವನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ನೀಡಲಾಗಿದೆ.
