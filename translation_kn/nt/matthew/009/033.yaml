id: MAT.9.33
reference: Matthew 9:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: kn
  text: ದೆವ್ವವನ್ನು ಹೊರಹಾಕಿದಾಗ, ಮೂಕನು[a] ಮಾತನಾಡಿದನು. ಜನಸಮೂಹಗಳು ಆಶ್ಚರ್ಯಪಟ್ಟು, “ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ ಇಂಥದ್ದು ಎಂದೂ ಕಂಡುಬಂದಿಲ್ಲ” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಕಿವುಡನು.” ಗ್ರೀಕ್ ಪದಕ್ಕೆ “ಕಿವುಡ” ಅಥವಾ “ಮೂಕ” ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳಿರಬಹುದು; ಇಲ್ಲಿ ಅವನು ಮಾತನಾಡಿದನೆಂಬುದಕ್ಕೆ ಒತ್ತು ಇರುವುದರಿಂದ ಸಂದರ್ಭವು “ಮೂಕನು” ಎಂಬ ಅರ್ಥವನ್ನು ಬೆಂಬಲಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: ಹೊರಗೆ ಓಡಿಸಿದಾಗ
  rationale: ಕರ್ತೃವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ, ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚೆ ದೆವ್ವವನ್ನು ಹೊರಹಾಕಿದ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δαιμονίου
  choice: ದೆವ್ವವನ್ನು
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿನ ದೆವ್ವ ಬಿಡಿಸುವ ಸಂದರ್ಭಕ್ಕೆ δαιμόνιον ಎಂಬ ಪದದ ನೇರ ಮತ್ತು ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ἐλάλησεν
  choice: ಮಾತನಾಡಿದನು
  rationale: ಸರಳ ಭೂತಕಾಲದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಮಾತನಾಡಲು ಆರಂಭಿಸಿದನು’ ಎಂಬ ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಲ್ಲದ ಆರಂಭಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ὁ κωφός
  choice: ಮೂಕನು
  rationale: κωφός ಕಿವುಡ ಅಥವಾ ಮೂಕ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದಾದರೂ, ತಕ್ಷಣದ ಫಲಿತಾಂಶವಾಗಿ ಅವನು ಮಾತನಾಡಿದನೆಂದು ಹೇಳಿರುವುದರಿಂದ ಇಲ್ಲಿ ಮಾತಿನ ಅಸಮರ್ಥತೆಯೇ ಒತ್ತಿಹೇಳಲ್ಪಟ್ಟಿದೆ.
- source_word: ἐθαύμασαν
  choice: ಬೆರಗಾಗಿ
  rationale: ಜನರ ಆಶ್ಚರ್ಯ ಮತ್ತು ವಿಸ್ಮಯವನ್ನು ಆಧುನಿಕ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ ὄχλοι
  choice: ಜನಸಮೂಹಗಳು
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ಉಳಿಸುತ್ತದೆ.
- source_word: Οὐδέποτε
  choice: ಎಂದೂ ... ಇಲ್ಲ
  rationale: ‘ಎಂದಿಗೂ ಇಲ್ಲ’ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಸಹಜ ನಿರಾಕರಣಾ ವಿನ್ಯಾಸದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐφάνη
  choice: ಕಂಡುಬಂದಿಲ್ಲ
  rationale: φαίνω ಪದದ ನಿಷ್ಕ್ರಿಯ ರೂಪವನ್ನು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಕಂಡುಬರು’ ಎಂದು ನೀಡಿದ್ದು, ಇಂಥ ಘಟನೆ ಹಿಂದೆ ಸಂಭವಿಸಿರಲಿಲ್ಲ ಎಂಬ ಮಾತಿನ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: οὕτως
  choice: ಇಂಥದ್ದು
  rationale: ಈಗಷ್ಟೇ ಕಂಡ ಘಟನೆಯ ಸ್ವರೂಪವನ್ನು ಸೂಚಿಸುವ οὕτως ಪದಕ್ಕೆ ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: ἐν τῷ Ἰσραήλ
  choice: ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ
  rationale: ಸ್ಥಳ ಅಥವಾ ಜನಾಂಗೀಯ ವಲಯ ಎರಡನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಾಮಾನ್ಯ ಅನುವಾದ.
theological_decisions:
- issue: ಗುಣಪಡಿಸುವಿಕೆ ಮತ್ತು ದೆವ್ವ ಬಿಡಿಸುವಿಕೆಯ ಸಂದರ್ಭದಲ್ಲಿ κωφός ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ಮೂಕನು
  alternative: ಕಿವುಡನು
  rationale: ಈ ಪದವು ಕಿವುಡತನವನ್ನೂ ಮೂಕತನವನ್ನೂ ಸೂಚಿಸಬಹುದು. ಆದರೆ ‘ಮಾತನಾಡಿದನು’ ಎಂಬ ತಕ್ಷಣದ ಪರಿಣಾಮವು ಇಲ್ಲಿ ಮಾತಿನ ಅಸಮರ್ಥತೆಯನ್ನು ಮುಖ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಸಂದರ್ಭ ಹೇಳದ ಮತ್ತೊಂದು ದೈಹಿಕ ಸ್ಥಿತಿಯನ್ನು ಅನುವಾದದಲ್ಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ದೆವ್ವವನ್ನು ಹೊರಗೆ ಓಡಿಸಿದಾಗ’ ಎಂಬುದು ಗ್ರೀಕ್ ನಿಷ್ಕ್ರಿಯ ಪೂರ್ವಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗದಂತೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ‘ಜನಸಮೂಹಗಳು’ ಮೂಲಕ ಮೂಲದ ಬಹುವಚನ ಉಳಿಸಲಾಗಿದೆ; ಅಡಿಕುರಿತು ಗುರುತನ್ನು ಅದು ವಿವರಿಸುವ ‘ಮೂಕನು’ ಪದದ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
