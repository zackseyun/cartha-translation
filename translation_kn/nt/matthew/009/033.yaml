  to: ದೆವ್ವವನ್ನು ಹೊರಹಾಕಿದಾಗ, ಮೂಕನು[a] ಮಾತನಾಡಿದನು. ಜನಸಮೂಹಗಳು ಆಶ್ಚರ್ಯಪಟ್ಟು, “ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ ಇಂಥದ್ದು ಎಂದೂ ಕಂಡುಬಂದಿಲ್ಲ” ಎಂದು ಹೇಳಿದರು.
  rationale: 'The revision makes two limited idiomatic improvements: it uses the customary exorcism expression ‘ಹೊರಹಾಕಿದಾಗ’ for the demon’s expulsion and replaces the less natural ‘ಬೆರಗಾಗಿ’ with ‘ಆಶ್ಚರ್ಯಪಟ್ಟು.’ The wording continues to preserve the source’s temporal sequence, its contextual rendering of κωφός as ‘mute,’ the plural crowds, and the unprecedented character of the event. The footnote remains anchored to ‘ಮೂಕನು’ and retains the lexical ambiguity.'
