id: MAT.9.5
reference: Matthew 9:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: kn
  text: ಯಾಕೆಂದರೆ, ‘ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ’[a] ಎಂದು ಹೇಳುವುದೋ, ‘ಎದ್ದು ನಡೆ’ ಎಂದು ಹೇಳುವುದೋ—ಯಾವುದು ಸುಲಭ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲಾಗಿದೆ.’ ಗ್ರೀಕ್ ವರ್ತಮಾನಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಫಲಿತಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಅರ್ಥದಲ್ಲಿಯೂ ಗ್ರಹಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: ಯಾಕೆಂದರೆ ... ಯಾವುದು ಸುಲಭ?
  rationale: τί comparative construction ಎರಡು ಆಯ್ಕೆಗಳ ನಡುವೆ ‘ಯಾವುದು’ ಎಂದು ಕೇಳುತ್ತದೆ. γάρ ಹಿಂದಿನ ಮಾತಿಗೆ ಕಾರಣಾತ್ಮಕ/ವಿವರಣಾತ್ಮಕ ಸಂಪರ್ಕ ಕೊಡುವುದರಿಂದ ‘ಯಾಕೆಂದರೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: εἰπεῖν
  choice: ಎಂದು ಹೇಳುವುದು
  rationale: ಎರಡೂ ಉಪವಾಕ್ಯಗಳಲ್ಲಿ ಸಾಮಾನ್ಯ ಮಾತಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಸರಳ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ
  rationale: ವರ್ತಮಾನಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಫಲಿತಸ್ಥಿತಿ ಸೂಚಿಸುವ ‘ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಇದು ಕ್ಷಮೆಯು ಜಾರಿಯಲ್ಲಿರುವ ಸ್ಥಿತಿಯನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: ἁμαρτίαι
  choice: ಪಾಪಗಳು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನವನ್ನು ಉಳಿಸುವ ಪ್ರಮಾಣಿತ ಮತ್ತು ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಪದ.
- source_word: Ἔγειρε
  choice: ಎದ್ದು
  rationale: ಗುಣಪಡಿಸುವ ಸಂದರ್ಭದ ಆಜ್ಞೆಗೆ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ; ಮುಂದಿನ ‘ನಡೆ’ ಎಂಬ ಆಜ್ಞೆಯೊಂದಿಗೆ ಸಂಯುಕ್ತವಾಗಿ ಬರುತ್ತದೆ.
- source_word: καὶ περιπάτει
  choice: ನಡೆ
  rationale: ದೈಹಿಕವಾಗಿ ನಡೆಯುವಂತೆ ಕೊಟ್ಟ ಆಜ್ಞೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: σου
  choice: ನಿನ್ನ
  rationale: ದ್ವಿತೀಯ ಪುರುಷ ಏಕವಚನ ಸ್ವಾಮ್ಯವನ್ನು ಗೌರವಬಹುವಚನಕ್ಕೆ ಬದಲಿಸದೆ ಮೂಲದ ನೇರ ಏಕವಚನ ಸಂಬೋಧನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಕ್ಷಮೆಯ ಘೋಷಣೆಯ ಕಾಲಾರ್ಥ
  choice: ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ
  alternative: ನಿನ್ನ ಪಾಪಗಳು ಕ್ಷಮಿಸಲ್ಪಡುತ್ತವೆ
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನ ಕರ್ಮಣಿ ರೂಪವು ಫಲಿತಸ್ಥಿತಿಯ ಅರ್ಥ ಹೊಂದಿರಬಹುದು. ಕನ್ನಡದ ‘ಕ್ಷಮಿಸಲ್ಪಟ್ಟಿವೆ’ ಆ ಸ್ಥಿತಿಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಕ್ಷಮೆಯ ಸಮಯ ಅಥವಾ ವಿಧಾನ ಕುರಿತು ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ನೇರ ಪ್ರಶ್ನಾರೂಪ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಏಕವಚನ ಸಂಬೋಧನೆ, ಎರಡು ಪರ್ಯಾಯ ಮಾತುಗಳ ಸಮಾಂತರ ರಚನೆ ಮತ್ತು γάρ ಮೂಲಕ ಹಿಂದಿನ ವಾಕ್ಯದೊಂದಿಗಿರುವ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧ ಉಳಿಸಲಾಗಿದೆ.
