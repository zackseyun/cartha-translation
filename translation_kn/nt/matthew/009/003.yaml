    text: ಅಥವಾ, “ತಮ್ಮ ಮನಸ್ಸಿನಲ್ಲಿ.” ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಖಾಸಗಿ ಮಾತನ್ನಾಗಲಿ ಮನಸ್ಸಿನೊಳಗಿನ ಆಲೋಚನೆಯನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
