- from: ಆಗ ಇಗೋ, ಶಾಸ್ತ್ರಿಗಳಲ್ಲಿ ಕೆಲವರು ತಮ್ಮೊಳಗೆ[a], “ಈತನು ದೇವದೂಷಣೆ ಮಾಡುತ್ತಿದ್ದಾನೆ” ಎಂದುಕೊಂಡರು.
  to: ಆಗ, ಇಗೋ, ಶಾಸ್ತ್ರಿಗಳಲ್ಲಿ ಕೆಲವರು ತಮ್ಮತಮ್ಮೊಳಗೆ[a], “ಈತನು ದೇವದೂಷಣೆ ಮಾಡುತ್ತಿದ್ದಾನೆ” ಎಂದು ಹೇಳಿದರು.
  rationale: The revision retains the source verb ‘said’ while leaving open whether the scribes spoke privately among themselves or deliberated inwardly. It also improves punctuation at the narrative opening and aligns the footnote with the remaining lexical ambiguity.
