id: MAT.9.3
reference: Matthew 9:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: kn
  text: ಆಗ, ಇಗೋ, ಶಾಸ್ತ್ರಿಗಳಲ್ಲಿ ಕೆಲವರು ತಮ್ಮತಮ್ಮೊಳಗೆ[a], “ಈತನು ದೇವದೂಷಣೆ ಮಾಡುತ್ತಿದ್ದಾನೆ” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ತಮ್ಮ ಮನಸ್ಸಿನಲ್ಲಿ.” ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಖಾಸಗಿ ಮಾತನ್ನಾಗಲಿ ಮನಸ್ಸಿನೊಳಗಿನ ಆಲೋಚನೆಯನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ಆಗ
  rationale: ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಸರಳ ಸಮನ್ವಯಾರ್ಥದ ‘ಮತ್ತು’ಗಿಂತ ಇಲ್ಲಿ ‘ಆಗ’ ಸಂದರ್ಭಕ್ಕೆ ಹೆಚ್ಚು ಸರಿಹೊಂದುತ್ತದೆ.
- source_word: ἰδού
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಮೂಲಪದದ ಕಥನಾತ್ಮಕ ಬಲವನ್ನು ಉಳಿಸುವ, ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಗೌರವಯುತ ರೂಪ.
- source_word: τινες τῶν γραμματέων
  choice: ಶಾಸ್ತ್ರಿಗಳಲ್ಲಿ ಕೆಲವರು
  rationale: ಅನಿರ್ದಿಷ್ಟ ಉಪಗುಂಪನ್ನು ನಿಖರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; γραμματεῖς ಪದಕ್ಕೆ ಸುವಾರ್ತಾ ಸಂದರ್ಭದಲ್ಲಿನ ರೂಢಿಯಾದ ಕನ್ನಡ ಪದ ‘ಶಾಸ್ತ್ರಿಗಳು’.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: ತಮ್ಮೊಳಗೆ … ಎಂದುಕೊಂಡರು
  rationale: ಬಹುವಚನದ ಒಳಗಿನ ಅಥವಾ ಖಾಸಗಿ ಮಾತುಕತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅದು ಮೌನವಾದ ಮನೋಚಿಂತನೆಯೋ ಪರಸ್ಪರದ ಗುಪ್ತ ಮಾತೋ ಎಂಬ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: Οὗτος
  choice: ಈತನು
  rationale: ಸಂದರ್ಭದ ಸೂಚಕ ಹಾಗೂ ಸ್ವಲ್ಪ ತಿರಸ್ಕಾರಭಾವವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಹೆಚ್ಚುವರಿ ನಿಂದಾತ್ಮಕ ಪದವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: βλασφημεῖ
  choice: ದೇವದೂಷಣೆ ಮಾಡುತ್ತಿದ್ದಾನೆ
  rationale: ವರ್ತಮಾನಕಾಲದ ನಡೆಯುತ್ತಿರುವ ಆರೋಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಿ, ದೇವರಿಗೆ ಅವಮಾನಕರವಾಗಿ ಮಾತಾಡುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ವಿರುದ್ಧ ಶಾಸ್ತ್ರಿಗಳು ಮಾಡಿದ ಆರೋಪದ ನಿರೂಪಣೆ
  choice: ಈತನು ದೇವದೂಷಣೆ ಮಾಡುತ್ತಿದ್ದಾನೆ
  alternative: ಈತನು ದೂಷಣೆ ಮಾಡುತ್ತಿದ್ದಾನೆ / ಈತನು ದೇವನಿಂದೆ ಮಾಡುತ್ತಿದ್ದಾನೆ
  rationale: ಆರೋಪದ ನೇರ ಬಲವನ್ನು ಉಳಿಸಿ, ಅದು ಸತ್ಯವೋ ಸುಳ್ಳೋ ಎಂಬುದನ್ನು ಅನುವಾದವೇ ತೀರ್ಮಾನಿಸುವುದಿಲ್ಲ; ಹೀಗೆ ಕಥನದಲ್ಲಿರುವ ದೇವತಾತ್ವಿಕ ಒತ್ತಡ ಅಚಲವಾಗಿರುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಮೂಲದ ಗಮನ ಸೆಳೆಯುವ ಅಂಶವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಶಾಸ್ತ್ರಿಗಳು’ ಸುವಾರ್ತಾ ಸಂದರ್ಭದ ಸ್ಥಿರ ಪದವಾಗಿದೆ. ಮುಖ್ಯಪಾಠದಲ್ಲಿನ [a] ಗುರುತು ಪಾದಟಿಪ್ಪಣಿಗೆ ಸರಿಯಾಗಿ ಹೊಂದಿದೆ.
