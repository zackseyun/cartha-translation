source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: kn
  text: ಫರಿಸಾಯರು ಇದನ್ನು ಕಂಡಾಗ[a], ಆತನ ಶಿಷ್ಯರಿಗೆ, “ನಿಮ್ಮ ಬೋಧಕನು ತೆರಿಗೆ ವಸೂಲಿಗಾರರು ಮತ್ತು ಪಾಪಿಗಳ ಜೊತೆಯಲ್ಲಿ ಏಕೆ ಊಟ ಮಾಡುತ್ತಾನೆ?” ಎಂದು ಹೇಳುತ್ತಿದ್ದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಹೆಚ್ಚು ಔಪಚಾರಿಕವಾಗಿ, “ಇದನ್ನು ಕಂಡು ಫರಿಸಾಯರು ಆತನ ಶಿಷ್ಯರಿಗೆ ಹೇಳುತ್ತಿದ್ದರು…” ಗ್ರೀಕ್ ಭೂತಕೃದಂತವು ‘ಕಂಡರು’ ಎಂಬುದರ ಕರ್ಮವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ; ಸಂದರ್ಭದಲ್ಲಿನ ಊಟದ ದೃಶ್ಯವೇ ಇಲ್ಲಿ ಸೂಚಿತವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ಕಂಡಾಗ
  rationale: ὁράω ಕ್ರಿಯಾಪದದ ಏಕಕಾಲಿಕ ಭೂತಕೃದಂತವನ್ನು ಕನ್ನಡದ ಸಹಜ ಕಾಲಸೂಚಕ ರಚನೆಯಾದ ‘ಕಂಡಾಗ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ಮ ಸೂಚಿತವಾಗಿರುವುದರಿಂದ ಸಂದರ್ಭದಲ್ಲಿನ ಊಟದ ದೃಶ್ಯವನ್ನು ಸೂಚಿಸಲು ‘ಇದನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: ἔλεγον
  choice: ಎಂದು ಹೇಳುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಮುಂದುವರಿಯುವ ಅಥವಾ ನಡೆಯುತ್ತಿದ್ದ ಮಾತಿನ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ‘ಹೇಳುತ್ತಿದ್ದರು’ ಉಳಿಸುತ್ತದೆ; ಪ್ರಶ್ನೆಯ ರೂಪವನ್ನೂ ಯಥಾಸ್ಥಿತಿಯಲ್ಲಿ ಇರಿಸುತ್ತದೆ.
- source_word: μαθηταῖς
  choice: ಶಿಷ್ಯರಿಗೆ
  rationale: ಸುಸಮಾಚಾರದ ಗುರು–ಶಿಷ್ಯ ಸಂಬಂಧಕ್ಕೆ ಸಹಜವೂ ಸ್ಥಿರವೂ ಆದ ಕನ್ನಡ ಪದ.
- source_word: Διὰ τί
  choice: ಏಕೆ
  rationale: ಕಾರಣವನ್ನು ಕೇಳುವ ಗ್ರೀಕ್ ಪ್ರಶ್ನೆಗೆ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: τελωνῶν
  choice: ಸುಂಕ ವಸೂಲಿಗಾರರ
  rationale: τελώνης ಸೂಚಿಸುವ ಸಾಮಾಜಿಕವಾಗಿ ಕಳಂಕಿತವಾಗಿದ್ದ ಸುಂಕ ಅಥವಾ ತೆರಿಗೆ ಸಂಗ್ರಹದ ವೃತ್ತಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಅನಗತ್ಯ ತಾಂತ್ರಿಕತೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἁμαρτωλῶν
  choice: ಪಾಪಿಗಳ
  rationale: ἁμαρτωλός ಪದದ ನೇರ ಮತ್ತು ರೂಢಿಯಾದ ಅನುವಾದ; ಇಲ್ಲಿ ಸಾಮಾಜಿಕ ಹಾಗೂ ನೈತಿಕವಾಗಿ ಗುರುತಿಸಲ್ಪಟ್ಟ ವರ್ಗದ ಸೂಚನೆಯನ್ನು ತೆರೆದೆಯೇ ಇಡುತ್ತದೆ.
- source_word: ἐσθίει
  choice: ಊಟಮಾಡುತ್ತಾನೆ
  rationale: ಮೂಲದ ವರ್ತಮಾನಕಾಲವನ್ನೂ ಮೂಲಭೂತ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: διδάσκαλος
  choice: ಬೋಧಕನು
  rationale: διδάσκαλος ಪದದ ‘ಬೋಧಿಸುವವನು/ಶಿಕ್ಷಕ’ ಎಂಬ ಅರ್ಥವನ್ನು ಪದವಿಯಾಗಿ ಅನುವಾದಿಸುತ್ತದೆ; ‘ರಬ್ಬಿ’ ಎಂಬ ಲಿಪ್ಯಂತರವನ್ನಾಗಲಿ ‘ಗುರು’ ಪದದಲ್ಲಿರಬಹುದಾದ ಹೆಚ್ಚುವರಿ ಧಾರ್ಮಿಕ ಭಾವವನ್ನಾಗಲಿ ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ‘ಕಂಡರು’ ಎಂಬ ಕ್ರಿಯೆಗೆ ಕರ್ಮವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಬೇಕೇ ಎಂಬುದು
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಇದನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ
  alternative: ‘ಫರಿಸಾಯರು ಕಂಡಾಗ’ ಅಥವಾ ಹೆಚ್ಚು ಔಪಚಾರಿಕವಾಗಿ ‘ಇದನ್ನು ಕಂಡು’ ಎಂದು ಕೊಡಬಹುದು
  rationale: ಗ್ರೀಕ್ ಭೂತಕೃದಂತವು ಕಂಡದ್ದರ ಕರ್ಮವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದೆ, ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿನ ಊಟದ ದೃಶ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯ ಸಹಜವಾಗಲು ‘ಇದನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ; ಇದು ಯಾವುದೇ ಹೊಸ ತಾತ್ತ್ವಿಕ ಅರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ‘ಹೇಳುತ್ತಿದ್ದರು’ ಮೂಲಕ ಗ್ರೀಕ್ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಅಂಶವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಇದನ್ನು’ ಸೇರಿಸಿರುವುದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
