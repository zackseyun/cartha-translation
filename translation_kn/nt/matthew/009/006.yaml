id: MAT.9.6
reference: Matthew 9:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: kn
  text: ಆದರೆ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ಭೂಮಿಯ ಮೇಲೆ ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸುವ ಅಧಿಕಾರವಿದೆ ಎಂದು ನೀವು ತಿಳಿದುಕೊಳ್ಳುವಂತೆ—ಆಗ ಆತನು ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನಿಗೆ[a], “ಎದ್ದು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು[b] ಎತ್ತಿಕೊಂಡು ನಿನ್ನ ಮನೆಗೆ ಹೋಗು” ಎಂದು ಹೇಳುತ್ತಾನೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಪಾರ್ಶ್ವವಾಯುವಿನಿಂದ ಅಂಗವಿಕಲನಾದವನಿಗೆ.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ವಿಶೇಷಣವನ್ನು ನಾಮಪದದಂತೆ ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ಮಲಗುವ ಚಾಪೆಯನ್ನು” ಅಥವಾ “ಮಂಚವನ್ನು.” ಗ್ರೀಕ್ κλίνη ಪದವು ಹಾಸಿಗೆ, ಮಂಚ ಅಥವಾ ಮಲಗುವ ಚಾಪೆಯನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: ಆದರೆ ... ಎಂಬುದು ನಿಮಗೆ ತಿಳಿಯಬೇಕೆಂದು
  rationale: δέಯ ಸೌಮ್ಯವಾದ ವ್ಯತ್ಯಾಸವನ್ನೂ ἵναಯ ಉದ್ದೇಶಾರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ವಾಕ್ಯವು ಮುಂದಿನ ನೇರ ಆಜ್ಞೆಗೆ ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಅಪೂರ್ಣವಾಗಿರುವ ಮೂಲದ ರಚನೆಯನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἐξουσίαν ἔχει
  choice: ಅಧಿಕಾರವಿದೆ
  rationale: ಇಲ್ಲಿ ಕೇವಲ ಸಾಮರ್ಥ್ಯವಲ್ಲ, ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸುವ ಹಕ್ಕು ಮತ್ತು ಅಧಿಕಾರ ಮುಖ್ಯವಾಗಿದೆ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಯೇಸುವಿನ ಸ್ಥಿರವಾದ ಸ್ವನಾಮಧೇಯವನ್ನೂ ದಾನಿಯೇಲ 7ರ ಸಂಭವನೀಯ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುವ ರೂಢಿಯಾದ ಕನ್ನಡ ರೂಪ.
- source_word: ἐπὶ τῆς γῆς
  choice: ಭೂಮಿಯ ಮೇಲೆ
  rationale: ಅಧಿಕಾರವು ಕಾರ್ಯನಿರ್ವಹಿಸುವ ಭೌಮಿಕ ವಲಯವನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸುವ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ἀφίημιಯ ಅರ್ಥ ಪಾಪಗಳನ್ನು ಮನ್ನಿಸುವುದು ಅಥವಾ ಕ್ಷಮಿಸುವುದು.
- source_word: τότε λέγει
  choice: ಆಗ ಆತನು ... ಎಂದು ಹೇಳುತ್ತಾನೆ
  rationale: τότεಯ ಕ್ರಮಸೂಚನೆಯನ್ನು ಮತ್ತು λέγειಯ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲದ ನಿರೂಪಣಾ ಜೀವಂತಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τῷ παραλυτικῷ
  choice: ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನಿಗೆ
  rationale: ವಿಶೇಷಣದ ನಾಮಪದೀಯ ಬಳಕೆಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಗೌರವಯುತ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: Ἐγερθεὶς
  choice: ಎದ್ದು
  rationale: ರೂಪತಃ ಭೂತಕೃದಂತವಾದರೂ, ಮುಂದಿನ ಆಜ್ಞೆಗಳ ಸರಣಿಯಲ್ಲಿ ಆಜ್ಞಾರ್ಥಕ ಬಲ ಹೊಂದಿದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಎದ್ದು’ ಸಹಜವಾಗಿದೆ.
- source_word: ἆρόν
  choice: ಎತ್ತಿಕೊಂಡು
  rationale: ಹಾಸಿಗೆಯನ್ನು ಮೇಲಕ್ಕೆತ್ತಿ ತನ್ನೊಂದಿಗೆ ಕೊಂಡೊಯ್ಯುವ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κλίνην
  choice: ಹಾಸಿಗೆಯನ್ನು
  rationale: κλίνηಗೆ ಹಾಸಿಗೆ, ಮಂಚ ಅಥವಾ ಮಲಗುವ ಚಾಪೆ ಎಂಬ ವ್ಯಾಪ್ತಿ ಇದೆ; ‘ಹಾಸಿಗೆ’ ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸದ ಸಹಜ ಆಯ್ಕೆ.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: ನಿನ್ನ ಮನೆಗೆ ಹೋಗು
  rationale: ಗಮ್ಯಸ್ಥಾನ ಮತ್ತು ನೇರ ಆಜ್ಞೆಯನ್ನು ಸರಳವಾಗಿ, ಮೂಲಕ್ಕೆ ಸಮೀಪವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου ಎಂಬ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಬಿರುದು
  choice: ಮನುಷ್ಯಕುಮಾರನು
  alternative: ಮಾನವನು / ಮನುಷ್ಯನಾದವನು
  rationale: ಪಾರಂಪರಿಕ ಬಿರುದು ಯೇಸುವಿನ ಸ್ವನಾಮಧೇಯ ಮತ್ತು ದಾನಿಯೇಲ 7ರ ಸಂಭವನೀಯ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ; ವಿವರಣಾತ್ಮಕ ಪರ್ಯಾಯವು ಆ ಅಂತರ್ಪಠ್ಯ ಒತ್ತಡವನ್ನು ಸಮತಟ್ಟಾಗಿಸಬಹುದು.
- issue: ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸುವಲ್ಲಿ ἐξουσίαಯ ಸ್ವರೂಪ
  choice: ಅಧಿಕಾರ
  alternative: ಶಕ್ತಿ / ಹಕ್ಕು
  rationale: ಪದ್ಯವು ಕೇವಲ ಅದ್ಭುತ ಮಾಡುವ ಸಾಮರ್ಥ್ಯಕ್ಕಿಂತ ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸುವ ನ್ಯಾಯಸಮ್ಮತ ಅಧಿಕಾರವನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ; ಆದರೂ ಮೂಲ ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ತಾತ್ತ್ವಿಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನವಾದ ನಿರೂಪಣೆ. ಮೂಲದ ಮಧ್ಯವಾಕ್ಯ ವಿರಾಮ ಮತ್ತು ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತನು’ ಎಂಬುದು ಸ್ಪಷ್ಟ ಹಾಗೂ ಗೌರವಯುತ; ‘ಹಾಸಿಗೆ’ ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
