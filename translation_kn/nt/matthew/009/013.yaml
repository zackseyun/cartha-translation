review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the aorist-participle-plus-imperative idiom (''ಹೋಗಿ ... ಕಲಿತುಕೊಳ್ಳಿರಿ''), the Hosea citation, and the unqualified categories ''the righteous'' and ''sinners.'' The final mission clause, however, is syntactically awkward in Kannada: ''ನಾನು ಕರೆಯಲು ಬಂದದ್ದು ನೀತಿವಂತರನ್ನಲ್ಲ, ಪಾಪಿಗಳನ್ನು'' leaves the contrast poorly governed and omits a natural finite completion.'
  naturalness: Most wording is modern, respectful, and natural. Revising the final clause to make both contrasted objects and Jesus' purpose explicit produces idiomatic Kannada while retaining the Greek contrast. The quotation marks are also made consistent.
  terminology: ಕರುಣೆ, ಬಲಿ, ನೀತಿವಂತರು, and ಪಾಪಿಗಳು are appropriate established Kannada biblical terms. No doctrinal interpretation is added; 'ನೀತಿವಂತರನ್ನು' remains deliberately unqualified.
  issues:
  - severity: medium
    issue: The final clause is grammatically and stylistically incomplete/awkward in Kannada.
    rationale: The Greek says that Jesus did not come to call righteous people but sinners. Rendering it as 'ನಾನು ನೀತಿವಂತರನ್ನು ಕರೆಯಲು ಅಲ್ಲ, ಪಾಪಿಗಳನ್ನು ಕರೆಯಲು ಬಂದೆನು' clearly preserves the negated purpose and contrast without making 'the righteous' mean self-righteous people.
  - severity: low
    issue: Quotation punctuation is inconsistent.
    rationale: The citation opens with a single quotation mark but ends with a double quotation mark. Consistent quotation marks improve publication readiness.
