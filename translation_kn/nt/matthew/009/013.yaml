id: MAT.9.13
reference: Matthew 9:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: kn
  text: ಆದರೆ ನೀವು ಹೋಗಿ, ಇದರ ಅರ್ಥವೇನೆಂದು ಕಲಿತುಕೊಳ್ಳಿರಿ:[a] ‘ನಾನು ಬಲಿಯನ್ನಲ್ಲ, ಕರುಣೆಯನ್ನೇ ಬಯಸುತ್ತೇನೆ.’[b] ಏಕೆಂದರೆ ನಾನು ನೀತಿವಂತರನ್ನು ಕರೆಯಲು ಅಲ್ಲ, ಪಾಪಿಗಳನ್ನು ಕರೆಯಲು ಬಂದೆನು.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃ: “ಇದು ಏನೆಂದು ಕಲಿತುಕೊಳ್ಳಿರಿ.”'
    reason: lexical_alternative
  - marker: b
    text: ಹೋಶೇಯ 6:6ರಿಂದ ಉಲ್ಲೇಖಿಸಲಾಗಿದೆ.
    reason: cross_reference
  - marker: c
    text: ಅಥವಾ ಬಹುಶಃ, “ತಾವು ನೀತಿವಂತರೆಂದು ಭಾವಿಸುವವರನ್ನು”; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕೇವಲ “ನೀತಿವಂತರನ್ನು” ಎಂದಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: ನೀವು ಹೋಗಿ
  rationale: ಮುಂದಿನ ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಸೇರಿ ‘ಹೋಗಿ ... ಕಲಿತುಕೊಳ್ಳಿರಿ’ ಎಂಬ ನುಡಿಗಟ್ಟಿನ ಆಜ್ಞೆಯನ್ನು ನೀಡುತ್ತದೆ; ಬಹುವಚನದ ಸಂಬೋಧನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: μάθετε
  choice: ಕಲಿತುಕೊಳ್ಳಿರಿ
  rationale: ಅರ್ಥವನ್ನು ಗ್ರಹಿಸಿಕೊಳ್ಳುವಂತೆ ಮಾಡುವ ಆಜ್ಞೆ ಮತ್ತು ಗದರಿಕೆಯ ಧ್ವನಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τί ἐστιν
  choice: ಇದರ ಅರ್ಥವೇನೆಂದು
  rationale: ಉಲ್ಲೇಖಿತ ವಾಕ್ಯದ ಮಹತ್ವವನ್ನು ತಿಳಿದುಕೊಳ್ಳುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἔλεος
  choice: ಕರುಣೆ
  rationale: ವ್ಯಕ್ತಿಗಳ ಕಡೆಗಿನ ದಯೆ ಹಾಗೂ ಹೋಶೇಯನ ಉಲ್ಲೇಖದಲ್ಲಿರುವ ಒಡಂಬಡಿಕೆಯ ನಿಷ್ಠೆಯ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಅತಿಯಾಗಿ ವಿಸ್ತರಿಸದೆ ಹೊರುತ್ತದೆ.
- source_word: θέλω
  choice: ಬಯಸುತ್ತೇನೆ
  rationale: ದೈವಿಕ ಇಚ್ಛೆ ಮತ್ತು ಆದ್ಯತೆಯನ್ನು ಗೌರವಪೂರ್ಣ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: θυσίαν
  choice: ಬಲಿ
  rationale: ಪ್ರವಾದನಾತ್ಮಕ ಉಲ್ಲೇಖದಲ್ಲಿರುವ ಯಜ್ಞಬಲಿಯನ್ನು ಸೂಚಿಸುವ ನೇರ ಮತ್ತು ರೂಢಿಯಾದ ಪದ.
- source_word: καλέσαι
  choice: ಕರೆಯಲು
  rationale: ಆಹ್ವಾನಿಸುವುದು ಅಥವಾ ಕರೆ ನೀಡುವುದು ಎಂಬ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಹೇರದು.
- source_word: δικαίους
  choice: ನೀತಿವಂತರು
  rationale: ಗ್ರೀಕ್‌ನ ನಾಮಪದವಾಗಿ ಬಳಕೆಯಾದ ವಿಶೇಷಣವನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಿ, ನಿಜವಾಗಿ ನೀತಿವಂತರೋ ಅಥವಾ ತಾವು ನೀತಿವಂತರೆಂದು ಭಾವಿಸುವವರೋ ಎಂಬ ಪ್ರಶ್ನೆಯನ್ನು ಮೂಲಪಠ್ಯದಂತೆಯೇ ಮುಕ್ತವಾಗಿಡುತ್ತದೆ.
- source_word: ἁμαρτωλούς
  choice: ಪಾಪಿಗಳು
  rationale: ಮೂಲದಲ್ಲಿರುವ ತೀಕ್ಷ್ಣ ನೈತಿಕ ವೈರುಧ್ಯವನ್ನು ಉಳಿಸುವ ಸಾಮಾನ್ಯ ಮತ್ತು ಸ್ಪಷ್ಟ ಪದ.
theological_decisions:
- issue: ಹೋಶೇಯ 6:6ರ ಉಲ್ಲೇಖದಲ್ಲಿ ಕರುಣೆ ಮತ್ತು ಬಲಿಯ ನಡುವಿನ ವೈರುಧ್ಯ
  choice: ‘ನಾನು ಬಲಿಯನ್ನಲ್ಲ, ಕರುಣೆಯನ್ನೇ ಬಯಸುತ್ತೇನೆ’ ಎಂದು ಪ್ರವಾದನಾತ್ಮಕ ವೈರುಧ್ಯವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ದೇವರು ಎಲ್ಲ ಬಲಿಗಳನ್ನೂ ಸಂಪೂರ್ಣವಾಗಿ ತಿರಸ್ಕರಿಸುತ್ತಾನೆಂದು ವಿಸ್ತರಿಸುವುದು, ಅಥವಾ ಇದನ್ನು ಈ ಸಂದರ್ಭದ ಸೌಮ್ಯ ಆದ್ಯತೆಯಷ್ಟಾಗಿ ಕುಗ್ಗಿಸುವುದು.
  rationale: ಮೂಲವು ಕರುಣೆಗೆ ಒತ್ತುಕೊಟ್ಟು ಬಲಿಯೊಂದಿಗೆ ತೀಕ್ಷ್ಣ ವೈರುಧ್ಯವನ್ನು ರೂಪಿಸುತ್ತದೆ; ಆದರೆ ಬಲಿಯ ಕುರಿತು ಸಮಗ್ರ ಸಿದ್ಧಾಂತಾತ್ಮಕ ತೀರ್ಪನ್ನು ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುವುದಿಲ್ಲ.
- issue: ‘ನೀತಿವಂತರು’ ಎಂಬ ಪದದ ಉದ್ದೇಶಿತ ಉಲ್ಲೇಖ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ನೀತಿವಂತರು’ ಎಂದೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ತಾವು ನೀತಿವಂತರೆಂದು ಭಾವಿಸುವವರು’ ಅಥವಾ ‘ಸ್ವನೀತಿವಂತರು’ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ವ್ಯಂಗ್ಯಾರ್ಥ ಸಾಧ್ಯವಾದರೂ ಗ್ರೀಕ್ ಪದವೇ ಅದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿರಿಸಿ, ಶಾಸ್ತ್ರೋಕ್ತ ಉಲ್ಲೇಖದ ಘನತೆ ಮತ್ತು ಯೇಸುವಿನ ಗದರಿಕೆಯ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
