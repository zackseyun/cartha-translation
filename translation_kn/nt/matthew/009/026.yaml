id: MAT.9.26
reference: Matthew 9:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: kn
  text: ಈ ಸುದ್ದಿಯು ಆ ಪ್ರದೇಶದ ಎಲ್ಲೆಡೆಯೂ ಹರಡಿತು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಆ ನಾಡಿನಾದ್ಯಂತ’ ಅಥವಾ ‘ಆ ಜಿಲ್ಲೆಯ ಎಲ್ಲೆಡೆಯೂ.’ ಗ್ರೀಕ್ γῆ ಎಂಬ ಪದಕ್ಕೆ ಭೂಮಿ, ನಾಡು ಅಥವಾ ಪ್ರದೇಶ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ಇಲ್ಲಿ ಅದು ಇಡೀ ಭೂಮಿಗಿಂತ ಸುತ್ತಮುತ್ತಲಿನ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆಯೇ ಹೆಚ್ಚು.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ಆ
  rationale: ಕನ್ನಡದ ಸಹಜ ಕಥನಪ್ರವಾಹದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಎನ್ನುವುದಕ್ಕಿಂತ, ಮುಂದಿನ ‘ಆ ಸುದ್ದಿಯು’ ಹಿಂದಿನ ಘಟನೆಯೊಂದಿಗೆ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐξῆλθεν
  choice: ಹರಡಿತು
  rationale: ಪದಶಃ ‘ಹೊರಟುಹೋಯಿತು’ ಎಂಬ ರೂಪಕವಿದ್ದರೂ, ಸುದ್ದಿ ಸಾರ್ವಜನಿಕವಾಗಿ ವ್ಯಾಪಿಸಿತು ಎಂಬ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಹರಡಿತು’ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἡ φήμη αὕτη
  choice: ಆ ಸುದ್ದಿಯು
  rationale: φήμη ಇಲ್ಲಿ ಸುಳ್ಳಾಗಿರಬಹುದೆಂಬ ಛಾಯೆಯ ‘ವದಂತಿ’ಗಿಂತ, ಘಟನೆಯ ಕುರಿತು ಪ್ರಸಾರವಾದ ‘ಸುದ್ದಿ’ಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. αὕτη ಹಿಂದಿನ ಘಟನೆಯನ್ನು ನಿರ್ದೇಶಿಸುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ‘ಆ’ ಸಹಜವಾಗಿದೆ.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: ಆ ಪ್ರದೇಶದ ಎಲ್ಲೆಡೆಯೂ
  rationale: γῆಗೆ ಭೂಮಿ, ನಾಡು, ಪ್ರದೇಶ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ಸ್ಥಳೀಯ ಕಥನಸಂದರ್ಭದಲ್ಲಿ ಸುತ್ತಮುತ್ತಲಿನ ಪ್ರದೇಶವೇ ಉದ್ದೇಶಿತ. ‘ಎಲ್ಲೆಡೆಯೂ’ ὅλην ಸೂಚಿಸುವ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಪದಶಃ ಇರುವ ‘ಸುದ್ದಿ ಹೊರಟುಹೋಯಿತು’ ಎಂಬ ರೂಪಕಕ್ಕಿಂತ ಸಹಜವಾದ ‘ಸುದ್ದಿ ಹರಡಿತು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; γῆಯ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
