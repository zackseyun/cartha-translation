id: MAT.9.21
reference: Matthew 9:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಅವಳು ತನ್ನೊಳಗೇ, “ನಾನು ಅವರ ಉಡುಪನ್ನು ಮಾತ್ರ ಮುಟ್ಟಿದರೆ, ರಕ್ಷಿಸಲ್ಪಡುವೆನು[a]” ಎಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಿದ್ದಳು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಗುಣಮುಖಳಾಗುವೆನು” ಅಥವಾ “ಸ್ವಸ್ಥಳಾಗುವೆನು.” ಗ್ರೀಕ್‌ನಲ್ಲಿ “ನಾನು ರಕ್ಷಿಸಲ್ಪಡುವೆನು” ಎಂಬ ಅರ್ಥದ ಕ್ರಿಯಾಪದವಿದೆ; ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ಅದು ಗುಣಮುಖವಾಗುವುದನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ಹೇಳಿಕೊಳ್ಳುತ್ತಿದ್ದಳು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ನಿರಂತರ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಅಂತರಂಗ ಮಾತಿನ ಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಸುತ್ತಲಿನ ವೃತ್ತಾಂತಕ್ಕೆ ಈ ವಾಕ್ಯವು ನೀಡುವ ವಿವರಣಾತ್ಮಕ ಕಾರಣಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἐν ἑαυτῇ
  choice: ತನ್ನೊಳಗೆ
  rationale: ಅವಳು ಮನಸ್ಸಿನಲ್ಲೇ ತನಗೆ ತಾನೇ ಹೇಳಿಕೊಂಡಳು ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἐὰν μόνον
  choice: …ಆದರೂ …ದರೆ
  rationale: ಕೇವಲ ಉಡುಪನ್ನು ಮುಟ್ಟುವುದೇ ಸಾಕು ಎಂಬ ಕನಿಷ್ಠ ಷರತ್ತು ಮತ್ತು ಒತ್ತನ್ನು ಕನ್ನಡದ ಸಹಜ ವಿನ್ಯಾಸದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ.
- source_word: ἅψωμαι
  choice: ಮುಟ್ಟಿದರೆ
  rationale: ἐάν ಜೊತೆಯಲ್ಲಿರುವ ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯೆಯ ಷರತ್ತಿನ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಷರತ್ತು ರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ; ಇಲ್ಲಿ ಹಿಡಿದುಕೊಳ್ಳುವುದು ಎಂಬುದಕ್ಕಿಂತ ಮುಟ್ಟುವುದು ಸೂಕ್ತ.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ಅವರ ಉಡುಪನ್ನು
  rationale: ἱμάτιον ಹೊರ ಉಡುಪು ಅಥವಾ ಮೇಲಂಗಿಯನ್ನು ಸೂಚಿಸಬಹುದಾದರೂ, ‘ಉಡುಪು’ ಅನಗತ್ಯವಾಗಿ ರೂಪವನ್ನು ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಗೌರವಸೂಚಕ ಸರ್ವನಾಮವು ಆಧುನಿಕ ಕನ್ನಡಕ್ಕೆ ಸಹಜ.
- source_word: σωθήσομαι
  choice: ರಕ್ಷಣೆ ಹೊಂದುವೆನು
  rationale: σῴζω ಎಂಬ ಕ್ರಿಯೆಯ ಮೂಲಭೂತವಾದ ‘ರಕ್ಷಿಸು/ಉಳಿಸು’ ಎಂಬ ವ್ಯಾಪಕತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಈ ಸಂದರ್ಭದಲ್ಲಿರುವ ದೈಹಿಕ ಗುಣಮುಖತೆಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಗುಣಪಡಿಸುವ ಸಂದರ್ಭದಲ್ಲಿನ σωθήσομαι ಪದದ ಅನುವಾದ
  choice: ರಕ್ಷಣೆ ಹೊಂದುವೆನು
  alternative: ಗುಣಮುಖಳಾಗುವೆನು / ಸ್ವಸ್ಥಳಾಗುವೆನು
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭವು ದೈಹಿಕ ಗುಣಮುಖತೆಯನ್ನು ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್ ಪಠ್ಯವು ಕೇವಲ ವೈದ್ಯಕೀಯ ಅರ್ಥದ ಪದದ ಬದಲು ರಕ್ಷಣೆ, ಉಳಿವು ಮತ್ತು ಸ್ವಸ್ಥತೆಯನ್ನು ಸೂಚಿಸಬಲ್ಲ σῴζω ಪದವನ್ನು ಬಳಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅದರ ವ್ಯಾಪಕತೆಯನ್ನು ಉಳಿಸಿ, ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಕೊಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಪೂರ್ಣ ವೃತ್ತಾಂತ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಹೇಳಿಕೊಳ್ಳುತ್ತಿದ್ದಳು’ ಎಂಬ ರೂಪವು ಅಂತರಂಗದಲ್ಲಿ ಮುಂದುವರಿದ ಮಾತನ್ನು ತೋರಿಸುತ್ತದೆ. ‘ಅವರ’ ಎಂಬ ಗೌರವಸೂಚಕ ರೂಪ ಕನ್ನಡದ ಸಾಮಾನ್ಯ ಕ್ರೈಸ್ತ ವಾಚನಶೈಲಿಗೆ ಸಹಜವಾಗಿದ್ದು, ಮೂಲದ ಅರ್ಥಕ್ಕೆ ಹೊಸ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
