    rationale: The Greek verb denotes casting/expelling out, but does not require separately stating ‘outside.’ Kannada ‘ಆತ್ಮಗಳನ್ನು ಹೊರಹಾಕಿದನು’ is the established, natural expression and preserves the force of expulsion.
