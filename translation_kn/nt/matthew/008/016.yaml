id: MAT.8.16
reference: Matthew 8:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: kn
  text: ಸಂಜೆಯಾದಾಗ, ದೆವ್ವಪೀಡಿತರಾಗಿದ್ದ ಅನೇಕರನ್ನು[a] ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆತಂದರು. ಆತನು ಒಂದು ಮಾತಿನಿಂದ ಆತ್ಮಗಳನ್ನು ಹೊರಹಾಕಿ, ಅಸ್ವಸ್ಥರಾಗಿದ್ದವರೆಲ್ಲರನ್ನೂ ಗುಣಪಡಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ದೆವ್ವಗಳ ಪ್ರಭಾವಕ್ಕೆ ಒಳಗಾಗಿದ್ದ ಅನೇಕರನ್ನು.’ ಗ್ರೀಕ್ ಕೃದಂತವು ದೆವ್ವಗಳ ಪ್ರಭಾವ ಅಥವಾ ನಿಯಂತ್ರಣಕ್ಕೆ ಒಳಗಾದ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅದರ ನಿಖರ ಸ್ವರೂಪವನ್ನು ಪದವೇ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: ಸಂಜೆಯಾದಾಗ
  rationale: ಈ ಕರ್ತೃರಹಿತ ಷಷ್ಠೀ ಪ್ರಯೋಗವು ಕಾಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸಂಜೆಯಾದಾಗ’ ಮೂಲದ ಅರ್ಥವನ್ನು ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: προσήνεγκαν αὐτῷ
  choice: ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆತಂದರು
  rationale: ಇಲ್ಲಿ προσφέρω ಜನರನ್ನು ಒಬ್ಬರ ಬಳಿಗೆ ತರುವ ಅರ್ಥದಲ್ಲಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಸರ್ವನಾಮದ ಉಲ್ಲೇಖ ಸ್ಪಷ್ಟವಾಗಲು ‘ಯೇಸುವಿನ’ ಎಂದು ಬಳಸಲಾಗಿದೆ.
- source_word: δαιμονιζομένους πολλούς
  choice: ದೆವ್ವಪೀಡಿತರಾಗಿದ್ದ ಅನೇಕರನ್ನು
  rationale: ಈ ಕೃದಂತವು ದೆವ್ವಗಳ ಪ್ರಭಾವ ಅಥವಾ ನಿಯಂತ್ರಣಕ್ಕೆ ಒಳಗಾದವರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದೆವ್ವಪೀಡಿತರು’ ಎಂಬುದು ಸ್ಥಿತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆಯಾದರೂ ಅದರ ನಿಖರ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: ಆತನು ಆತ್ಮಗಳನ್ನು ಹೊರಗೆ ಓಡಿಸಿ
  rationale: ἐκβάλλω ಇಲ್ಲಿ ಬಲವಾಗಿ ಹೊರಡಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮೂಲದಲ್ಲಿರುವ ‘ಆತ್ಮಗಳು’ ಎಂಬ ನೇರ ಕರ್ಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಸಂದರ್ಭವು ಅವು ದುಷ್ಟಾತ್ಮಗಳೆಂದು ತಿಳಿಸುತ್ತದೆ.
- source_word: λόγῳ
  choice: ಒಂದು ಮಾತಿನಿಂದ
  rationale: ಕರಣಾರ್ಥಕ ಚತುರ್ಥೀ ಪ್ರಯೋಗ. ‘ಒಂದು ಮಾತಿನಿಂದ’ ಎಂಬುದು ಯೇಸುವಿನ ಆಜ್ಞೆಯ ಅಧಿಕಾರವನ್ನು ತೋರಿಸಿ, ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ತನ್ನ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ಅಸ್ವಸ್ಥರಾಗಿದ್ದವರೆಲ್ಲರನ್ನೂ
  rationale: κακῶς ἔχειν ಎಂಬ ನುಡಿಗಟ್ಟು ಅಸ್ವಸ್ಥರಾಗಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಆಯ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಗುಣಪಡಿಸುವ ಸಂದರ್ಭಕ್ಕೆ ಹೊಂದುತ್ತದೆ.
- source_word: ἐθεράπευσεν
  choice: ಗುಣಪಡಿಸಿದನು
  rationale: ಸುವಾರ್ತೆಗಳ ಗುಣಪಡಿಸುವ ಘಟನಾವಳಿಗಳಲ್ಲಿ θεραπεύωಗೆ ‘ಗುಣಪಡಿಸು’ ಸಹಜ ಮತ್ತು ನಿಖರವಾದ ಕನ್ನಡ ಪದವಾಗಿದೆ.
theological_decisions:
- issue: δαιμονιζομένους ಮತ್ತು τὰ πνεύματα ಸೂಚಿಸುವ ಸ್ಥಿತಿ
  choice: ‘ದೆವ್ವಪೀಡಿತರು’ ಮತ್ತು ‘ಆತ್ಮಗಳು’ ಎಂದು ಪಠ್ಯದ ಅತೀಂದ್ರಿಯ ವರ್ಗಗಳನ್ನು ಉಳಿಸುವುದು
  alternative: ಇದನ್ನು ಕೇವಲ ಮಾನಸಿಕ ಅಸ್ವಸ್ಥತೆ ಎಂದು ವಿವರಿಸುವುದು ಅಥವಾ ‘ದೆವ್ವ ಹಿಡಿದವರು’ ಎಂದು ಇನ್ನಷ್ಟು ನಿರ್ದಿಷ್ಟವಾಗಿ ಹೇಳುವುದು
  rationale: ವಚನವು ಆತ್ಮಗಳನ್ನು ಹೊರಡಿಸುವುದನ್ನೂ ಅಸ್ವಸ್ಥರನ್ನು ಗುಣಪಡಿಸುವುದನ್ನೂ ಪ್ರತ್ಯೇಕವಾಗಿ ಹೇಳುತ್ತದೆ. ಆದ್ದರಿಂದ ಪಠ್ಯದ ಸ್ವಂತ ವರ್ಗಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅದೇ ವೇಳೆ δαιμονίζομαι ಸೂಚಿಸುವ ಪ್ರಭಾವದ ನಿಖರ ಸ್ವರೂಪವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸಿಲ್ಲ.
- issue: λόγῳಯ ಕರಣಾರ್ಥ
  choice: ‘ಒಂದು ಮಾತಿನಿಂದ’
  alternative: ‘ತನ್ನ ಮಾತಿನಿಂದ’ ಅಥವಾ ‘ಮಾತನಾಡುವ ಮೂಲಕ’
  rationale: ಈ ರೂಪವು ಯೇಸುವಿನ ಅಧಿಕಾರಯುತ ಆಜ್ಞೆಯ ಕಥನಾತ್ಮಕ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಮೂಲದಲ್ಲಿಲ್ಲದ ಸ್ವಾಮ್ಯಸೂಚಕ ಪದವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆತನು’ ಎಂಬ ರೂಪವು ಯೇಸುವಿನ ಉಲ್ಲೇಖಕ್ಕೆ ತಕ್ಕ ಗೌರವವನ್ನು ನೀಡುತ್ತದೆ. ಇಂಗ್ಲಿಷ್ ಸಲಹಾ ಪಠ್ಯದಲ್ಲಿನ [a] ಗುರುತು ಕಾಲವಾಕ್ಯದ ಬಳಿ ಕಂಡರೂ ಅದರ ಟಿಪ್ಪಣಿ δαιμονιζομένους ಪದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಕಾರಣ, ಕನ್ನಡದಲ್ಲಿ ಗುರುತನ್ನು ‘ದೆವ್ವಪೀಡಿತರಾಗಿದ್ದ ಅನೇಕರನ್ನು’ ಎಂಬ ಪದಗುಚ್ಛದ ಬಳಿಗೆ ಇರಿಸಲಾಗಿದೆ.
