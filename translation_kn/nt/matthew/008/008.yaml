id: MAT.8.8
reference: Matthew 8:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: kn
  text: ಅದಕ್ಕೆ ಶತಾಧಿಪತಿ, “ಕರ್ತನೇ, ನೀವು ನನ್ನ ಮನೆಯ ಛಾವಣಿಯ ಕೆಳಗೆ ಬರುವುದಕ್ಕೆ ನಾನು ಯೋಗ್ಯನಲ್ಲ. ಆದರೆ ಒಂದು ಮಾತು ಮಾತ್ರ ಹೇಳಿ[a]; ಆಗ ನನ್ನ ಸೇವಕನು[b] ಗುಣವಾಗುವನು” ಎಂದು ಉತ್ತರಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಮಾತನ್ನು ಹೇಳಿ.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ “ಒಂದು ಮಾತು ಹೇಳಿ” ಎಂದಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: “ಸೇವಕನು” ಎಂಬುದಕ್ಕೆ ಬಳಸಿದ ಗ್ರೀಕ್ ಪದಕ್ಕೆ “ಹುಡುಗನು” ಅಥವಾ “ಮಗು” ಎಂದೂ ಅರ್ಥವಾಗಬಹುದು; ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಅದು ಮಗು, ಯುವಕ ಅಥವಾ ಸೇವಕನನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: ಉತ್ತರಿಸಿದನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕೃದಂತ ಮತ್ತು ಮಾತಿನ ಕ್ರಿಯಾಪದ ಒಟ್ಟಾಗಿ ಸಹಜವಾದ ಪ್ರತಿಕ್ರಿಯಾತ್ಮಕ ಮಾತಿನ ಪರಿಚಯವನ್ನು ರೂಪಿಸುತ್ತವೆ; ಕನ್ನಡದಲ್ಲಿ ಪುನರುಕ್ತಿಯಿಲ್ಲದೆ ‘ಉತ್ತರಿಸಿದನು’ ಎಂದು ಒಂದೇ ಕ್ರಿಯಾಪದದಿಂದ ಹೇಳುವುದು ಸಹಜ.
- source_word: ἑκατόνταρχος
  choice: ಶತಾಧಿಪತಿ
  rationale: ಸುಮಾರು ನೂರು ಸೈನಿಕರ ಮೇಲಧಿಕಾರಿಯನ್ನು ಸೂಚಿಸುವ ಸ್ಥಾಪಿತ ಹಾಗೂ ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡ ಪದ.
- source_word: Κύριε
  choice: ಕರ್ತನೇ
  rationale: ಯೇಸುವಿಗೆ ಗೌರವಪೂರ್ವಕ ಸಂಬೋಧನೆಯನ್ನು ಮತ್ತು ಸಾಧ್ಯವಾದ ಧಾರ್ಮಿಕ ತೂಕವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ‘ಸ್ವಾಮೀ’ ಅಥವಾ ‘ಅಯ್ಯಾ’ ಎಂದು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ἱκανὸς
  choice: ಯೋಗ್ಯನು
  rationale: ಇಲ್ಲಿ ಸಾಮರ್ಥ್ಯಕ್ಕಿಂತ ವಿನಯದಿಂದ ವ್ಯಕ್ತಪಡಿಸುವ ಅರ್ಹತೆ ಅಥವಾ ಯೋಗ್ಯತೆಯ ಅರ್ಥ ಮುಖ್ಯವಾಗಿದೆ.
- source_word: ὑπὸ τὴν στέγην
  choice: ನನ್ನ ಮನೆಯ ಛಾವಣಿಯ ಕೆಳಗೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ‘ಛಾವಣಿಯ ಕೆಳಗೆ’ ಎಂಬ ಸಜೀವ ಗೃಹರೂಪಕವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μόνον εἰπὲ λόγῳ
  choice: ಒಂದು ಮಾತು ಮಾತ್ರ ಹೇಳಿ
  rationale: λόγῳ ಪದದ ಅನಿರ್ದಿಷ್ಟ ಸ್ವರೂಪವನ್ನೂ μόνον ಪದದ ನಿರ್ಬಂಧಕ ಒತ್ತನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἰαθήσεται
  choice: ಗುಣವಾಗುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಗುಣಮುಖತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ಅನುಸರಿಸದೆ ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: παῖς
  choice: ಸೇವಕನು
  rationale: ಶತಾಧಿಪತಿಯ ಸಾಮಾಜಿಕ ಸಂದರ್ಭ ಮತ್ತು ಸಮಾನಾಂತರ ವೃತ್ತಾಂತ ‘ಸೇವಕ’ ಅರ್ಥಕ್ಕೆ ಬೆಂಬಲ ನೀಡುತ್ತವೆ; ಆದರೂ ಪದದ ‘ಹುಡುಗ/ಮಗು’ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿಗೆ ಸಂಬೋಧನೆಯಾದ κύριος
  choice: ಕರ್ತನೇ
  alternative: ಸ್ವಾಮೀ / ಅಯ್ಯಾ
  rationale: ಗೌರವಪೂರ್ವಕ ಸಂಬೋಧನೆಯ ಜೊತೆಗೆ ಸಾಧ್ಯವಾದ ಕ್ರಿಸ್ತತಾತ್ತ್ವಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಆದರೆ ವಾಕ್ಯವೇ ಸಾಬೀತುಪಡಿಸುವುದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: παῖς ಪದದ ಅರ್ಥ
  choice: ಸೇವಕನು
  alternative: ಹುಡುಗನು / ಮಗು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ‘ಸೇವಕ’ ಹೆಚ್ಚು ಸಂಭವನೀಯವಾದರೂ ಗ್ರೀಕ್ ಪದವು ವಯಸ್ಸು ಅಥವಾ ಸಂಬಂಧವನ್ನು ಬೇರೆ ರೀತಿಯಲ್ಲಿಯೂ ಸೂಚಿಸಬಲ್ಲದು; ಆದ್ದರಿಂದ ಪರ್ಯಾಯಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ (‘ನೀವು’, ‘ಹೇಳಿ’) ಬಳಸಿ, ಕಥನಕ್ರಿಯೆಯಲ್ಲಿ ಏಕವಚನ ಪುಲ್ಲಿಂಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಭಾಷೆ ಘನವಾಗಿದ್ದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
