id: MAT.8.31
reference: Matthew 8:31
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: kn
  text: ಆ ದುಷ್ಟಾತ್ಮಗಳು ಆತನಿಗೆ ಮತ್ತೆ ಮತ್ತೆ ಬೇಡಿಕೊಂಡು[a], “ನೀನು ನಮ್ಮನ್ನು ಹೊರಹಾಕುವುದಾದರೆ, ಹಂದಿಗಳ ಹಿಂಡಿನೊಳಗೆ ನಮ್ಮನ್ನು ಕಳುಹಿಸು” ಎಂದು ಹೀಗೆ ಹೇಳಿದವು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಆತನಿಗೆ ಬೇಡಿಕೊಂಡವು” ಅಥವಾ “ಆತನಿಗೆ ಮನವಿ ಮಾಡುತ್ತಾ ಇದ್ದವು”; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಅಪೂರ್ಣ ಭೂತಕಾಲದಲ್ಲಿದ್ದು, ಮುಂದುವರಿದ ಅಥವಾ ಮರುಮರು ನಡೆದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: ದೆವ್ವಗಳು
  rationale: ವೈಯಕ್ತಿಕ ದುಷ್ಟ ಆತ್ಮಿಕ ಜೀವಿಗಳನ್ನು ಸೂಚಿಸುವ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಅರ್ಥವಾಗುವ ಪದ; ಮೂಲದ ಅತೀಂದ್ರಿಯ ಅರ್ಥವನ್ನು ಮೃದುಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: παρεκάλουν
  choice: ಬೇಡಿಕೊಳ್ಳುತ್ತಲೇ
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಮುಂದುವರಿದ ಅಥವಾ ಮರುಮರು ನಡೆಯುವ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: λέγοντες
  choice: ಎಂದು ಹೇಳಿದವು
  rationale: ನೇರ ಮಾತನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯಕ್ರಮದಲ್ಲಿ ನಿರೂಪಿಸುತ್ತದೆ.
- source_word: Εἰ
  choice: –ವಾದರೆ
  rationale: ಮಾತನಾಡುವವರ ದೃಷ್ಟಿಯಿಂದ ಷರತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಯಾಕೆಂದರೆ’ ಅಥವಾ ‘ನೀನು ಖಂಡಿತ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐκβάλλεις
  choice: ಹೊರಗೆ ಓಡಿಸುವುದಾದರೆ
  rationale: ದೆವ್ವ ಬಿಡಿಸುವ ಸಂದರ್ಭದಲ್ಲಿನ ಬಲಾತ್ಕಾರಪೂರ್ವಕ ಹೊರಹಾಕುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπόστειλον
  choice: ಕಳುಹಿಸು
  rationale: ತಕ್ಷಣದ ವಿನಂತಿಯನ್ನು ಸೂಚಿಸುವ ಆಜ್ಞಾರ್ಥಕ ರೂಪಕ್ಕೆ ನೇರ ಹಾಗೂ ಸಹಜ ಸಮಾನಾರ್ಥಕ.
- source_word: ἀγέλην
  choice: ಹಿಂಡಿನೊಳಗೆ
  rationale: ಪ್ರಾಣಿಗಳ ಗುಂಪಿಗೆ ಕನ್ನಡದ ಸಹಜ ಪದ; εἰς ಸೂಚಿಸುವ ಒಳಮುಖ ಗತಿಯನ್ನು ‘ಒಳಗೆ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
- source_word: χοίρων
  choice: ಹಂದಿಗಳ
  rationale: ಸಮಕಾಲೀನ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟ ಮತ್ತು ಸಾಮಾನ್ಯ ಪದ.
- source_word: οἱ δὲ
  choice: ಆ
  rationale: ಹಿಂದಿನ ನಿರೂಪಣೆಯಲ್ಲಿರುವ ದೆವ್ವಗಳನ್ನು ಸಹಜವಾಗಿ ಮುಂದುವರಿಸಿ ಸೂಚಿಸುತ್ತದೆ; δέಯನ್ನು ಅನಗತ್ಯವಾಗಿ ತೀವ್ರ ವಿರೋಧಾರ್ಥಕವಾಗಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ದುಷ್ಟ ಆತ್ಮಜೀವಿಗಳ ನಿರೂಪಣೆ
  choice: ದೆವ್ವಗಳು
  alternative: ದುಷ್ಟಾತ್ಮಗಳು
  rationale: ವಾಕ್ಯವು ಯೇಸುವಿನೊಂದಿಗೆ ಮಾತನಾಡುವ ವೈಯಕ್ತಿಕ ದುಷ್ಟ ಜೀವಿಗಳನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ. ‘ದೆವ್ವಗಳು’ ಮೂಲದ ಅತೀಂದ್ರಿಯ ಪ್ರತಿಪಾದನೆಯನ್ನು ಉಳಿಸಿ, ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: ಷರತ್ತಿನ ಸ್ವರೂಪ
  choice: ನೀನು ನಮ್ಮನ್ನು ಹೊರಗೆ ಓಡಿಸುವುದಾದರೆ
  alternative: ನೀನು ನಮ್ಮನ್ನು ಹೊರಗೆ ಓಡಿಸುತ್ತಿರುವುದರಿಂದ
  rationale: Εἰಯ ನಿಜವಾದ ಷರತ್ತಿನ ರೂಪ ಮತ್ತು ಅದರಲ್ಲಿರುವ ಸ್ವಲ್ಪ ತೆರೆದತನವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಕಾರಣಾರ್ಥಕವಾಗಿ ನಿರ್ಧರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ‘ಬೇಡಿಕೊಳ್ಳುತ್ತಲೇ’ ಎಂಬುದು ಗ್ರೀಕ್ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ನಿರಂತರತೆಯನ್ನು ಹೊರುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸೇರಿಸಲಾಗಿದೆ.
