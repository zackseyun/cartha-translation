- from: ಆ ದೆವ್ವಗಳು ಆತನನ್ನು ಬೇಡಿಕೊಳ್ಳುತ್ತಲೇ[a], “ನೀನು ನಮ್ಮನ್ನು ಹೊರಗೆ ಓಡಿಸುವುದಾದರೆ, ಹಂದಿಗಳ ಹಿಂಡಿನೊಳಗೆ ನಮ್ಮನ್ನು ಕಳುಹಿಸು” ಎಂದು ಹೇಳಿದವು.
  to: ಆ ದುಷ್ಟಾತ್ಮಗಳು ಆತನಿಗೆ ಮತ್ತೆ ಮತ್ತೆ ಬೇಡಿಕೊಂಡು[a], “ನೀನು ನಮ್ಮನ್ನು ಹೊರಹಾಕುವುದಾದರೆ, ಹಂದಿಗಳ ಹಿಂಡಿನೊಳಗೆ ನಮ್ಮನ್ನು ಕಳುಹಿಸು” ಎಂದು ಹೀಗೆ ಹೇಳಿದವು.
