review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the historical present ('ಹೇಳುತ್ತಾನೆ'), the imperative to follow Jesus, and the deliberate repetition of νεκρούς. However, 'ತಮ್ಮವರಲ್ಲಿ ಸತ್ತವರನ್ನು' does not faithfully convey τοὺς ἑαυτῶν νεκρούς ('their own dead'); it instead suggests 'the dead among their people.' The imperative ἄφες is also more directly represented by 'ಬಿಟ್ಟುಬಿಡು' than by a bare third-person permissive 'ಮಾಡಲಿ'.
  naturalness: The proposed revision is natural modern standard Kannada. 'ತಮ್ಮ ಸತ್ತವರನ್ನು' is idiomatic and sufficiently reflects the reflexive possessive without the awkwardness of a literal 'ತಮ್ಮದೇ'. 'ಸಮಾಧಿ ಮಾಡಲಿ' is understandable, but 'ಹೂಣಿಡಲಿ' is the more direct everyday literary term for burial in this context.
  terminology: ‘ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು’ appropriately conveys discipleship. Retaining ‘ಸತ್ತವರು ... ಸತ್ತವರನ್ನು’ preserves the Greek wordplay and does not prematurely impose a theological interpretation. The footnote should remain explicitly tentative and should not say the metaphorical group certainly may bury the literal dead.
  issues:
  - severity: medium
    issue: The phrase ‘ತಮ್ಮವರಲ್ಲಿ ಸತ್ತವರನ್ನು’ mistranslates τοὺς ἑαυτῶν νεκρούς.
    rationale: 'ἑαυτῶν marks reflexive possession: ‘their own dead.’ ‘ತಮ್ಮವರಲ್ಲಿ’ means ‘among their own people’ and changes the relation expressed by the Greek.'
  - severity: medium
    issue: ‘ಮಾಡಲಿ’ underrepresents the direct imperative ἄφες.
    rationale: The Greek commands the interlocutor to leave/let the dead bury their own dead. ‘ಸತ್ತವರು ... ಹೂಣಿಡಲಿ’ can occur within the quoted directive, but ‘ಬಿಟ್ಟುಬಿಡು’ should explicitly render the command addressed to him.
  - severity: low
    issue: The footnote's final ‘ಮಾಡಬಹುದು’ weakens the saying into mere possibility.
    rationale: The note is interpretive, but it should describe the common understanding of the wordplay without changing the force of the command.
  revised_text: ಆದರೆ ಯೇಸು ಅವನಿಗೆ, “ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು; ಸತ್ತವರು ತಮ್ಮ ಸತ್ತವರನ್ನು ಹೂಣಿಡಲಿ ಎಂದು ಬಿಟ್ಟುಬಿಡು[a]” ಎಂದು ಹೇಳುತ್ತಾನೆ.
  revised_footnotes:
