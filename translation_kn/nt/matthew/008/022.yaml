revisions:
- from: ಆದರೆ ಯೇಸು ಅವನಿಗೆ, “ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು; ಸತ್ತವರು ತಮ್ಮವರಲ್ಲಿ ಸತ್ತವರನ್ನು ಸಮಾಧಿಮಾಡಲಿ[a]” ಎಂದು ಹೇಳುತ್ತಾನೆ.
  to: ಆದರೆ ಯೇಸು ಅವನಿಗೆ, “ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು; ಸತ್ತವರು ತಮ್ಮ ಸತ್ತವರನ್ನು ಹೂಣಿಡಲಿ ಎಂದು ಬಿಟ್ಟುಬಿಡು[a]” ಎಂದು ಹೇಳುತ್ತಾನೆ.
  rationale: The revision preserves the Greek historical present, repetition, and unresolved rhetorical force while correcting the reflexive possessive and making the imperative to relinquish responsibility explicit. The footnote identifies a common metaphorical reading as tentative interpretation rather than inserting it into the main text.
