id: MAT.8.22
reference: Matthew 8:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: kn
  text: ಆದರೆ ಯೇಸು ಅವನಿಗೆ, “ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು; ಸತ್ತವರು ತಮ್ಮ ಸತ್ತವರನ್ನು ಹೂಣಿಡಲಿ ಎಂದು ಬಿಟ್ಟುಬಿಡು[a]” ಎಂದು ಹೇಳುತ್ತಾನೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೊದಲನೆಯ ‘ಸತ್ತವರು’ ಎಂಬುದನ್ನು ರೂಪಕಾರ್ಥದಲ್ಲಿ, ಅಂದರೆ ಆತ್ಮಿಕವಾಗಿ ಸ್ಪಂದಿಸದವರು ಎಂದು ಸಾಮಾನ್ಯವಾಗಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಾಗುತ್ತದೆ; ಎರಡನೆಯದು ದೈಹಿಕವಾಗಿ ಸತ್ತವರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಮನವಿಗೆ ಯೇಸು ನೀಡುವ ತಿದ್ದುವ ಉತ್ತರದಲ್ಲಿರುವ ಸೌಮ್ಯ ವಿರೋಧವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: λέγει
  choice: ಎಂದು ಹೇಳುತ್ತಾನೆ
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಿ, ನಿರೂಪಣೆಯ ಜೀವಂತಿಕೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: Ἀκολούθει μοι
  choice: ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸು
  rationale: ನೇರ ಆಜ್ಞೆಯನ್ನು ಹಾಗೂ ಶಿಷ್ಯನಾಗಿ ಯೇಸುವನ್ನು ಅನುಸರಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἄφες
  choice: ಮಾಡಲಿ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ‘ಬಿಟ್ಟುಬಿಡು/ಅವರಿಗೆ ಬಿಡು’ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಅನುಮತಿಸೂಚಕ ರಚನೆಯ ಮೂಲಕ ಸಹಜವಾಗಿ ಕೊಡುತ್ತದೆ; ತನ್ನ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಬಿಟ್ಟುಕೊಡುವ ಸೂಚನೆಯೂ ಉಳಿಯುತ್ತದೆ.
- source_word: νεκρούς ... νεκρούς
  choice: ಸತ್ತವರು ... ಸತ್ತವರನ್ನು
  rationale: ಎರಡೂ ಕಡೆ ಒಂದೇ ಪದವನ್ನು ಬಳಸಿ ಮೂಲದ ಉದ್ದೇಶಿತ ಪದಪ್ರಯೋಗ, ಅಸ್ಪಷ್ಟತೆ ಮತ್ತು ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: θάψαι
  choice: ಸಮಾಧಿಮಾಡಲಿ
  rationale: ಮೃತದೇಹವನ್ನು ಹೂಣಿಡುವ ಅರ್ಥವನ್ನು ಆಧುನಿಕ, ಗೌರವಯುತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: ತಮ್ಮವರಲ್ಲಿ ಸತ್ತವರನ್ನು
  rationale: ἑαυτῶνನ ಸ್ವಕೀಯ ಸಂಬಂಧದ ಒತ್ತನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ‘ತಮ್ಮದೇ ಸತ್ತವರು’ ಎಂಬ ಅಸಹಜ ಅಥವಾ ಸ್ವಾಮ್ಯಭಾವದ ಧ್ವನಿಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಮಾತಿನಲ್ಲಿರುವ ‘ಸತ್ತವರು’ ಎಂಬ ಪದದ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸತ್ತವರು ... ಸತ್ತವರನ್ನು’ ಎಂಬ ಒಂದೇ ಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಮೊದಲನೆಯ ‘ಸತ್ತವರು’ ಎಂದರೆ ಆತ್ಮಿಕವಾಗಿ ಸ್ಪಂದಿಸದವರು; ಎರಡನೆಯದು ದೈಹಿಕವಾಗಿ ಸತ್ತವರು ಎಂದು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಉದ್ದೇಶಪೂರ್ವಕ ಪದಪ್ರಯೋಗ ಮತ್ತು ಪ್ರಚೋದಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಹೊಂದಿದೆ. ‘ಆತ್ಮಿಕವಾಗಿ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸುವುದು ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುತ್ತದೆ; ಸಾಧ್ಯವಾದ ರೂಪಕಾರ್ಥವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ನಿರೂಪಣೆ. ‘ಹಿಂಬಾಲಿಸು’ ಶಿಷ್ಯತ್ವದ ಕರೆಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ಮೂಲದ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲ ಮತ್ತು ‘ಸತ್ತವರು’ ಎಂಬ ಪುನರಾವರ್ತನೆ ಉಳಿಸಲಾಗಿದೆ.
