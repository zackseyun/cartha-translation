id: MAT.8.9
reference: Matthew 8:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ನಾನೂ ಅಧಿಕಾರದ ಕೆಳಗಿರುವ ಮನುಷ್ಯನಾಗಿದ್ದರೂ, ನನ್ನ ಅಧೀನದಲ್ಲಿ ಸೈನಿಕರಿದ್ದಾರೆ. ನಾನು ಒಬ್ಬನಿಗೆ, ‘ಹೋಗು’ ಎಂದರೆ ಅವನು ಹೋಗುತ್ತಾನೆ; ಮತ್ತೊಬ್ಬನಿಗೆ, ‘ಬಾ’ ಎಂದರೆ ಅವನು ಬರುತ್ತಾನೆ; ನನ್ನ ಸೇವಕನಿಗೆ[a], ‘ಇದನ್ನು ಮಾಡು’ ಎಂದರೆ ಅವನು ಮಾಡುತ್ತಾನೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ ‘ಗುಲಾಮ’ (ಗ್ರೀಕ್: δοῦλος, doulos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಶತಾಧಿಪತಿಯ ಮಾತಿಗೆ ಆಧಾರವನ್ನು ನೀಡುವ γάρ ಪದದ ವಿವರಣಾತ್ಮಕ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; καίಯ ‘ನಾನೂ’ ಎಂಬ ಅರ್ಥವನ್ನು ಮುಂದಿನ ಪದಗುಚ್ಛದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: ನಾನೂ ... ಮನುಷ್ಯನು
  rationale: ಸ್ಪಷ್ಟವಾಗಿ ಬಂದಿರುವ ἐγώಯ ಒತ್ತನ್ನು ‘ನಾನೂ’ ಉಳಿಸುತ್ತದೆ; ἄνθρωπος ಅನ್ನು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ನೇರವಾಗಿ ‘ಮನುಷ್ಯನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὑπὸ ἐξουσίαν
  choice: ಅಧಿಕಾರದ ಕೆಳಗಿರುವ
  rationale: ಬೇರೊಬ್ಬರ ನಿಯೋಜಿತ ಅಧಿಕಾರಕ್ಕೆ ಒಳಪಟ್ಟಿರುವ ಸೈನಿಕ ಆಜ್ಞಾಶ್ರೇಣಿಯ ಅರ್ಥವನ್ನು ರೂಪಕವನ್ನು ಉಳಿಸಿಕೊಂಡೇ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: ನನ್ನ ಅಧೀನದಲ್ಲಿ ಸೈನಿಕರಿದ್ದಾರೆ
  rationale: ಶತಾಧಿಪತಿ ತಾನೇ ಅಧಿಕಾರದ ಕೆಳಗಿದ್ದು, ತನ್ನ ಕೆಳಗೂ ಸೈನಿಕರನ್ನು ಹೊಂದಿದ್ದಾನೆ ಎಂಬ ಸಮಾಂತರ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λέγω τούτῳ ... καὶ ἄλλῳ
  choice: ನಾನು ಒಬ್ಬನಿಗೆ ... ಮತ್ತೊಬ್ಬನಿಗೆ ... ಎಂದರೆ
  rationale: τούτῳ ಮತ್ತು ἄλλῳ ಸೂಚಿಸುವ ವ್ಯಕ್ತಿಗತ ಹಾಗೂ ಹಂಚಿಕೆಯ ಮಾದರಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ; ‘ಈ ಒಬ್ಬನಿಗೆ’ ಎಂಬ ಅಸಹಜ ಕಠಿಣತೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: Πορεύθητι / Ἔρχου
  choice: ಹೋಗು / ಬಾ
  rationale: ಎರಡೂ ಸರಳ ನೇರ ಆಜ್ಞೆಗಳು; ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆ ಮತ್ತು ಸಮತೋಲನವನ್ನು ಉಳಿಸುತ್ತವೆ.
- source_word: δοῦλος
  choice: ಸೇವಕ
  rationale: ಇಲ್ಲಿ ಮುಖ್ಯ ಒತ್ತು ಮನೆಯ ವ್ಯಕ್ತಿಯ ಬಂಧಿತ ಸಾಮಾಜಿಕ ಸ್ಥಿತಿಗಿಂತ ಶತಾಧಿಪತಿಯ ಅಧಿಕಾರ ಮತ್ತು ತಕ್ಷಣದ ವಿಧೇಯತೆಯ ಮೇಲಿದೆ; ಆದರೂ ‘ಗುಲಾಮ’ ಎಂಬ ಹೆಚ್ಚು ನೇರ ಸಾಮಾಜಿಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: δοῦλος ಪದದ ಸಾಮಾಜಿಕ ಹಾಗೂ ಅಧಿಕಾರಸಂಬಂಧಿತ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸೇವಕ’
  alternative: ‘ಗುಲಾಮ’
  rationale: ವಾಕ್ಯದ ತರ್ಕವು ಶತಾಧಿಪತಿಯ ಅಧೀನದಲ್ಲಿರುವವರ ಮೇಲಿನ ಅವನ ಆಜ್ಞಾಧಿಕಾರವನ್ನು ಉದಾಹರಿಸುತ್ತದೆ. ಓದಲು ಸಹಜವಾದ ‘ಸೇವಕ’ ಇದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಆದರೆ ಮೂಲಪದವು ದಾಸ್ಯಸ್ಥಿತಿಯ ವ್ಯಕ್ತಿಯನ್ನೂ ಸೂಚಿಸಬಹುದಾದ್ದರಿಂದ ಆ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಮುಚ್ಚಿಹಾಕದೆ ಉಳಿಸಲಾಗಿದೆ.
- issue: ಶತಾಧಿಪತಿಯ ಅಧಿಕಾರದ ಹೋಲಿಕೆ
  choice: ‘ಅಧಿಕಾರದ ಕೆಳಗಿರುವ’ ಮತ್ತು ‘ನನ್ನ ಅಧೀನದಲ್ಲಿ’ ಎಂಬ ಎರಡೂ ದಿಕ್ಕುಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ಕೇವಲ ಅವನಿಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ಸರಳೀಕರಿಸುವುದು
  rationale: ಮೂಲವು ಅವನು ತಾನೂ ಮೇಲಧಿಕಾರಕ್ಕೆ ಒಳಪಟ್ಟವನು ಮತ್ತು ಕೆಳಗಿನವರ ಮೇಲೆ ಅಧಿಕಾರ ಹೊಂದಿದವನು ಎಂಬ ಒತ್ತಡವನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಜೊತೆಯಿಡುತ್ತದೆ; ಯೇಸುವಿನ ಅಧಿಕಾರದ ಕುರಿತು ಅದರ ಸೂಚನೆಯನ್ನು ಅನುವಾದದಲ್ಲಿ ವಿವರಿಸಿ ನಿರ್ಧರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ಸೈನಿಕ ಆಜ್ಞಾಶ್ರೇಣಿಗೆ ‘ಅಧಿಕಾರದ ಕೆಳಗೆ’ ಮತ್ತು ‘ಅಧೀನದಲ್ಲಿ’ ಎಂಬ ಪರಿಚಿತ ಪದಪ್ರಯೋಗಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ನೇರ ಆಜ್ಞೆಗಳ ಚುರುಕು ಮತ್ತು ಪುನರಾವರ್ತಿತ ವಾಕ್ಯರಚನೆ ಉಳಿಸಲಾಗಿದೆ.
