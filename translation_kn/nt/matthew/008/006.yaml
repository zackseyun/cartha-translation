id: MAT.8.6
reference: Matthew 8:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: kn
  text: 'ಎಂದು ಹೇಳಿದನು: “ಕರ್ತನೇ, ನನ್ನ ಸೇವಕನು[a] ಪಾರ್ಶ್ವವಾಯು ಬಡಿದು ಮನೆಯಲ್ಲಿ ಮಲಗಿದ್ದಾನೆ; ಅವನು ತೀವ್ರವಾಗಿ ನರಳುತ್ತಿದ್ದಾನೆ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ನನ್ನ ಹುಡುಗನು’ ಅಥವಾ ‘ನನ್ನ ಮಗುವು’; ಗ್ರೀಕ್ ಪದವು ಸೇವಕನನ್ನಾಗಲಿ ಮಗುವನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು. ಈ ಶತಾಧಿಪತಿಯ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಸೇವಕನು’ ಹೆಚ್ಚು ಹೊಂದಿಕೆಯಾಗುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ಬಹಳವಾಗಿ ಯಾತನೆಪಡುತ್ತಿದ್ದಾನೆ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: ಎಂದು ಹೇಳಿದನು
  rationale: ಗ್ರೀಕ್‌ನ ವರ್ತಮಾನ ಕೃದಂತವು ಹಿಂದಿನ ವಾಕ್ಯದ ಕ್ರಿಯೆಗೆ ಈ ಮಾತನ್ನು ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ನಿರೂಪಣಾ ಹರಿವಿಗಾಗಿ ಇದನ್ನು ಸಮಾಪಕ ಕ್ರಿಯೆಯಾಗಿ ನೀಡಲಾಗಿದೆ.
- source_word: Κύριε
  choice: ಕರ್ತನೇ
  rationale: ಈ ಸಂಬೋಧನೆಯು ಗೌರವಪೂರ್ವಕ ಕರೆಯನ್ನೂ ಹೆಚ್ಚು ಉನ್ನತವಾದ ಅರ್ಥವನ್ನೂ ಹೊಂದಿರಬಹುದು. ‘ಕರ್ತನೇ’ ಎಂಬುದು ಆ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ತೆರೆದಿಡುತ್ತದೆ.
- source_word: ὁ παῖς μου
  choice: ನನ್ನ ಸೇವಕನು
  rationale: παῖς ಎಂಬ ಪದಕ್ಕೆ ‘ಸೇವಕ’, ‘ಹುಡುಗ’ ಅಥವಾ ‘ಮಗು’ ಎಂಬ ಅರ್ಥಗಳು ಸಾಧ್ಯ. ಶತಾಧಿಪತಿಯ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಸೇವಕನು’ ಹೆಚ್ಚು ಹೊಂದಿಕೆಯಾಗುತ್ತದೆ; ಉಳಿದ ಸಾಧ್ಯತೆಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: βέβληται
  choice: ಮಲಗಿದ್ದಾನೆ
  rationale: ಪರಿಪೂರ್ಣ ಕರ್ಮಣಿ ರೂಪವು ಉಂಟಾದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಇಲ್ಲಿ ರೋಗದ ಕಾರಣದಿಂದ ಮಲಗಿರುವ ಸ್ಥಿತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ಮನೆಯಲ್ಲಿ
  rationale: ಸ್ಥಳಸೂಚಕ ಪದಗುಚ್ಛದ ನೇರವೂ ಸಹಜವೂ ಆದ ಕನ್ನಡ ರೂಪ.
- source_word: παραλυτικός
  choice: ಪಾರ್ಶ್ವವಾಯು ಬಡಿದು
  rationale: ರೋಗಿಯ ಸ್ಥಿತಿಯನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ವ್ಯಕ್ತಿಯನ್ನು ರೋಗದ ಹೆಸರಿನಿಂದ ಗುರುತಿಸುವ ನಾಮಪದರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: δεινῶς βασανιζόμενος
  choice: ತೀವ್ರವಾಗಿ ನರಳುತ್ತಿದ್ದಾನೆ
  rationale: ಈ ಪದಗುಚ್ಛವು ತೀವ್ರವಾದ ನೋವು ಅಥವಾ ಯಾತನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನರಳುತ್ತಿದ್ದಾನೆ’ ಎಂಬುದು ಅತಿರೇಕವಿಲ್ಲದೆ ದೈಹಿಕ ಸಂಕಟವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ಹೆಚ್ಚು ಶಾಬ್ದಿಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವನ್ನು ಸಂಬೋಧಿಸುವಾಗ Κύριε ಪದದ ಭಾವ
  choice: ಕರ್ತನೇ
  alternative: ಸ್ವಾಮಿಯೇ
  rationale: ಸನ್ನಿವೇಶದಲ್ಲಿ ಇದು ಗೌರವಪೂರ್ವಕ ಸಂಬೋಧನೆಯಾಗಿರಬಹುದು ಅಥವಾ ಯೇಸುವಿನ ಬಗ್ಗೆ ಹೆಚ್ಚಿನ ಮಾನ್ಯತೆಯನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಕರ್ತನೇ’ ಎಂಬ ಆಯ್ಕೆ ಯಾವುದನ್ನೂ ಅಂತಿಮವಾಗಿ ಹೇರದೆ ಆ ಧಾರ್ಮಿಕ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ, ಗೌರವಯುತ ನಿರೂಪಣಾಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಕೃದಂತ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಗಾಗಿ ಸಮಾಪಕ ಕ್ರಿಯೆಯಾಗಿ ಮಾಡಲಾಗಿದೆ; ಸೇವಕ/ಮಗು ಎಂಬ ನಿಜವಾದ ಪದಾರ್ಥದ ದ್ವಂದ್ವವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
