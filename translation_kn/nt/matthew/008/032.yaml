id: MAT.8.32
reference: Matthew 8:32
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: kn
  text: ಆತನು ಅವುಗಳಿಗೆ, “ಹೋಗಿರಿ” ಎಂದನು. ಆಗ ಅವು ಹೊರಬಂದು ಹಂದಿಗಳೊಳಗೆ ಹೋದವು. ಇಗೋ, ಇಡೀ ಹಿಂಡು ಕಡಿದಾದ ಇಳಿಜಾರಿನಲ್ಲಿ ಕೆಳಕ್ಕೆ ಧಾವಿಸಿ[a] ಸಮುದ್ರದೊಳಕ್ಕೆ ನುಗ್ಗಿ, ನೀರಿನಲ್ಲಿ ಸತ್ತಿತು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಕಡಿದಾದ ಬಂಡೆಯ ಮೇಲಿಂದ ಕೆಳಕ್ಕೆ.’ ಗ್ರೀಕ್ ಪದವು ಕಡಿದಾದ ಇಳಿಜಾರು, ದಡ, ಅಥವಾ ಪ್ರಪಾತವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ನೀರಿನಲ್ಲಿ ಮುಳುಗಿ ಸತ್ತಿತು.’ ಗ್ರೀಕ್ ಮೂಲವು ಹೆಚ್ಚು ನೇರವಾಗಿ ‘ನೀರಿನಲ್ಲಿ ಸತ್ತಿತು’ ಎನ್ನುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: ಹೋಗಿರಿ
  rationale: ಯೇಸುವಿನ ಸಂಕ್ಷಿಪ್ತ ಬಹುವಚನ ಆಜ್ಞೆಯನ್ನು ಸಹಜವಾಗಿಯೂ ನೇರವಾಗಿಯೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐξελθόντες
  choice: ಹೊರಬಂದು
  rationale: ದೆವ್ವಗಳು ಪೀಡಿತರೊಳಗಿಂದ ಹೊರಬಂದ ಚಲನೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: ಹಂದಿಗಳೊಳಗೆ ಹೋದವು
  rationale: ದೆವ್ವಗಳು ಪ್ರಾಣಿಗಳೊಳಗೆ ಪ್ರವೇಶಿಸಿದುದನ್ನು ಮೂಲದ ಚಲನೆಯ ಭಾಷೆಗೆ ಸಮೀಪವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: χοίρους
  choice: ಹಂದಿಗಳು
  rationale: ಆಧುನಿಕ ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ಈ ಪ್ರಾಣಿಗೆ ಸಹಜವೂ ಸ್ಪಷ್ಟವೂ ಆದ ಪದ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಮುಂದಿನ ಹಠಾತ್ ಘಟನೆಯ ಕಡೆ ಗಮನ ಸೆಳೆಯುವ ಮೂಲದ ಜೀವಂತ ಕಥನಸೂಚಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πᾶσα ἡ ἀγέλη
  choice: ಇಡೀ ಹಿಂಡು
  rationale: πᾶσα ಎಂಬ ಸಂಪೂರ್ಣತೆಯ ಅರ್ಥವನ್ನೂ ἀγέλη ಎಂಬ ಸಮೂಹವಾಚಕ ಅರ್ಥವನ್ನೂ ಸಹಜವಾಗಿ ಒಟ್ಟುಗೂಡಿಸುತ್ತದೆ.
- source_word: ὥρμησεν
  choice: ನುಗ್ಗಿ
  rationale: ಹಿಂಡಿನ ಹಠಾತ್ ಮತ್ತು ಬಲವಾದ ಚಲನೆಯನ್ನು ಅನಗತ್ಯ ವಿವರಣೆ ಸೇರಿಸದೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: ಕಡಿದಾದ ದಡವನ್ನಿಳಿದು
  rationale: κρημνός ಸೂಚಿಸಬಹುದಾದ ಕಡಿದಾದ ಇಳಿಜಾರು ಅಥವಾ ಪ್ರಪಾತದ ಅಂಚಿನ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಓದಲು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: θάλασσαν
  choice: ಸಮುದ್ರ
  rationale: θάλασσα ಎಂಬ ಮೂಲಪದವನ್ನು ಭೌಗೋಳಿಕವಾಗಿ ‘ಸರೋವರ’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸುತ್ತದೆ.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: ನೀರಿನಲ್ಲಿ ಸತ್ತಿತು
  rationale: ಮುಳುಗಿ ಸತ್ತಿತು ಎಂಬ ಸಂದರ್ಭಸಿದ್ಧ ಅರ್ಥವನ್ನು ಮುಖ್ಯಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ, ಗ್ರೀಕ್‌ನ ನೇರ ಹೇಳಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಹಿಂಡು ಹೇಗೆ ಸತ್ತಿತು ಎಂಬ ವಿವರಣೆಯ ನಿರ್ದಿಷ್ಟತೆ
  choice: ‘ನೀರಿನಲ್ಲಿ ಸತ್ತಿತು’ ಎಂಬ ಮೂಲದ ನೇರ ಹೇಳಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನೀರಿನಲ್ಲಿ ಮುಳುಗಿ ಸತ್ತಿತು’
  rationale: ಸಂದರ್ಭವು ಮುಳುಗಿ ಸತ್ತುದನ್ನು ಬಲವಾಗಿ ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಕೇವಲ ‘ಸತ್ತವು’ ಎಂದು ಹೇಳುತ್ತದೆ; ಆದ್ದರಿಂದ ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಹೆಚ್ಚಿನ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- issue: θάλασσα ಎಂಬ ಜಲಾಶಯದ ಹೆಸರು
  choice: ಸಮುದ್ರ
  alternative: ಸರೋವರ
  rationale: ಇಲ್ಲಿ ಗ್ರೀಕ್ ಪಠ್ಯವು θάλασσα (‘ಸಮುದ್ರ’) ಎನ್ನುತ್ತದೆ. ಭೌಗೋಳಿಕ ವಿವರಣೆಯನ್ನು ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸುವ ಬದಲು ಮೂಲದ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸರಳ, ಘನತೆಯ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಮೂಲಕ ಮೂಲದ ಗಮನಸೆಳೆಯುವ discourse marker ಉಳಿಸಲಾಗಿದೆ. ‘ಹಿಂಡು’ ಏಕವಚನ ಸಮೂಹವಾಚಕವಾದುದರಿಂದ ‘ನುಗ್ಗಿ ... ಸತ್ತಿತು’ ಎಂಬ ಏಕವಚನ ಹೊಂದಾಣಿಕೆ ಬಳಸಲಾಗಿದೆ.
