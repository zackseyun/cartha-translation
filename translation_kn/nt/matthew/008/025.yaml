id: MAT.8.25
reference: Matthew 8:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: kn
  text: ಅವರು ಆತನ ಬಳಿಗೆ ಬಂದು ಆತನನ್ನು ಎಬ್ಬಿಸಿ, “ಕರ್ತನೇ, ನಮ್ಮನ್ನು ರಕ್ಷಿಸು[a]! ನಾವು ನಾಶವಾಗುತ್ತಿದ್ದೇವೆ!” ಎಂದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ನಮ್ಮನ್ನು ಕಾಪಾಡು.” ಗ್ರೀಕ್‌ನ σῶσον ಎಂಬ ಆಜ್ಞಾರ್ಥಕ ಪದವು ತಕ್ಷಣದ ಅಪಾಯದಿಂದ ಪಾರುಮಾಡುವುದನ್ನೂ, ವಿಶಾಲ ಅರ್ಥದಲ್ಲಿ ‘ರಕ್ಷಿಸುವುದನ್ನೂ’ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: ಆತನ ಬಳಿಗೆ ಬಂದು
  rationale: ಈ ಭೂತಕಾಲದ ಕೃದಂತವು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಆತನ ಬಳಿಗೆ ಬಂದು’ ಎಂಬುದು ಉದ್ದೇಶಿತ ದಿಕ್ಕನ್ನೂ ಕ್ರಿಯೆಗಳ ಕ್ರಮವನ್ನೂ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἤγειραν
  choice: ಆತನನ್ನು ಎಬ್ಬಿಸಿ
  rationale: ἐγείρω ಇಲ್ಲಿ ನಿದ್ರಿಸುತ್ತಿದ್ದವನನ್ನು ಎಬ್ಬಿಸುವ ನೇರ ಅರ್ಥದಲ್ಲಿದೆ; ಪುನರುತ್ಥಾನ ಅಥವಾ ಬೇರೆ ಧಾರ್ಮಿಕ ಅರ್ಥವನ್ನು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: λέγοντες
  choice: ಎಂದರು
  rationale: ಮಾತಿನ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುವ ಕೃದಂತವನ್ನು ಕನ್ನಡದ ನೇರ ಉಕ್ತಿಯ ಸಹಜ ರಚನೆಗೆ ಅನುಗುಣವಾಗಿ ‘ಎಂದರು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ಕೂಗಿದರು’ ಎಂಬ ಭಾವತೀವ್ರತೆಯನ್ನು ಸೇರಿಸಿಲ್ಲ.
- source_word: Κύριε
  choice: ಕರ್ತನೇ
  rationale: κύριος ಎಂಬ ಸಂಬೋಧನೆಯನ್ನು ‘ಕರ್ತನೇ’ ಎಂದು ಭಾಷಾಂತರಿಸುವುದರಿಂದ ಗೌರವಪೂರ್ಣ ಸಂಬೋಧನೆಯನ್ನೂ ಅದರ ಸಾಧ್ಯ ಕ್ರಿಸ್ತತಾತ್ತ್ವಿಕ ತೂಕವನ್ನೂ ಕಡಿಮೆ ಮಾಡದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: σῶσον
  choice: ನಮ್ಮನ್ನು ರಕ್ಷಿಸು
  rationale: ಈ ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯಾಪದವು ತಕ್ಷಣದ ಅಪಾಯದಿಂದ ಪಾರುಮಾಡುವಂತೆ ಮಾಡುವ ಬೇಡಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮುಂದಿನ ಬಹುವಚನ ಕ್ರಿಯಾಪದ ಮತ್ತು ಸಂದರ್ಭದಿಂದ ಸೂಚಿತವಾದ ‘ನಮ್ಮನ್ನು’ ಎಂಬ ಕರ್ಮಪದವನ್ನು ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ಸ್ಪಷ್ಟವಾಗಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἀπολλύμεθα
  choice: ನಾವು ನಾಶವಾಗುತ್ತಿದ್ದೇವೆ
  rationale: ವರ್ತಮಾನಕಾಲದ ರೂಪವು ನಡೆಯುತ್ತಿರುವ ಅಥವಾ ಸನ್ನಿಹಿತವಾದ ಮರಣಕರ ವಿನಾಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನಾಶವಾಗುತ್ತಿದ್ದೇವೆ’ ಎಂಬುದು ಅದರ ತುರ್ತುಭಾವವನ್ನೂ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿಗೆ ಸಂಬೋಧನೆಯಾಗಿ κύριος ಅನ್ನು ಭಾಷಾಂತರಿಸುವುದು
  choice: ಕರ್ತನೇ
  alternative: ಗುರುವೇ
  rationale: ಈ ಸಂಬೋಧನೆಯು ಗೌರವಪೂರ್ಣ ಕರೆಯಿಂದ ಹಿಡಿದು ಆಳವಾದ ಕ್ರಿಸ್ತತಾತ್ತ್ವಿಕ ತೂಕದವರೆಗೆ ಅರ್ಥ ಹೊಂದಿರಬಹುದು. ‘ಕರ್ತನೇ’ ಆ ಒತ್ತಡವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದನ್ನು ಕೇವಲ ಕಾರ್ಯಾತ್ಮಕವಾದ ‘ಗುರುವೇ’ ಎಂದು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: σῶσον ಕ್ರಿಯಾಪದದ ಸೂಚಿತ ಬಹುವಚನ ಕರ್ಮಪದವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು
  choice: ನಮ್ಮನ್ನು ರಕ್ಷಿಸು
  alternative: ರಕ್ಷಿಸು
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದಲ್ಲೇ ಕರ್ಮಪದ ಪ್ರತ್ಯೇಕವಾಗಿ ಕಾಣದಿದ್ದರೂ, ‘ನಾವು ನಾಶವಾಗುತ್ತಿದ್ದೇವೆ’ ಎಂಬ ಮುಂದಿನ ವಾಕ್ಯ ಮತ್ತು ಸಂದರ್ಭವು ‘ನಮ್ಮನ್ನು’ ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತವೆ. ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಅದನ್ನು ವ್ಯಕ್ತಪಡಿಸುವುದು ಅರ್ಥಸ್ಪಷ್ಟತೆಗಾಗಿ, ಧಾರ್ಮಿಕ ಅಂಶವೊಂದನ್ನು ಸೇರಿಸುವುದಕ್ಕಾಗಿ ಅಲ್ಲ.
