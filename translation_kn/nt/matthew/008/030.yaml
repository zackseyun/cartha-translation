id: MAT.8.30
reference: Matthew 8:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: kn
  text: ಅವರಿಂದ ಬಹಳ ದೂರದಲ್ಲಿ ಹಂದಿಗಳ ದೊಡ್ಡ ಹಿಂಡೊಂದು ಮೇಯುತ್ತಿತ್ತು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ
  choice: ಇತ್ತು / ಮೇಯುತ್ತಿತ್ತು
  rationale: δέ ಸೌಮ್ಯವಾದ ಕಥನ-ಸಂಪರ್ಕಕ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಈಗ’ ಅಥವಾ ‘ಆದರೆ’ ಎಂದು ಸೇರಿಸದೆ, ಸಹಜ ವಾಕ್ಯಕ್ರಮದಲ್ಲೇ ಅದರ ಕಥನಪ್ರವಾಹವನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ. ἦν ಎಂಬ ಅಸ್ತಿತ್ವಾರ್ಥವು ‘ಮೇಯುತ್ತಿತ್ತು’ ಎಂಬ ಕ್ರಿಯಾರೂಪದಲ್ಲಿ ಒಳಗೊಂಡಿದೆ.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: ಅವರಿಂದ ಸ್ವಲ್ಪ ದೂರದಲ್ಲಿ
  rationale: ಈ ಪದಗುಚ್ಛವು ಸ್ಥಳೀಯ ದೂರವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸ್ವಲ್ಪ ದೂರದಲ್ಲಿ’ ಎಂಬುದು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡ; ‘ಬಹಳ ದೂರದಲ್ಲಿ’ ಎಂಬ ಹೆಚ್ಚು ಬಲವಾದ ಪರ್ಯಾಯದ ಸಾಧ್ಯತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἀγέλη
  choice: ಹಿಂಡು
  rationale: ಪ್ರಾಣಿಗಳ ಸಮೂಹವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: χοίρων
  choice: ಹಂದಿಗಳ
  rationale: χοῖροςಗೆ ಸ್ಪಷ್ಟವೂ ಸಾಮಾನ್ಯವೂ ಆದ ಆಧುನಿಕ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: πολλῶν
  choice: ದೊಡ್ಡ
  rationale: ಅಕ್ಷರಶಃ ‘ಅನೇಕ’ ಎಂದಾದರೂ, ಸಮೂಹವಾಚಕವಾದ ‘ಹಿಂಡು’ ಜೊತೆಗೆ ‘ದೊಡ್ಡ ಹಿಂಡು’ ಎನ್ನುವುದು ಸಹಜವಾಗಿ ಸಂಖ್ಯಾಬಾಹುಳ್ಯವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: βοσκομένη
  choice: ಮೇಯುತ್ತಿತ್ತು
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಹಿಂಡು ಆಹಾರ ತಿನ್ನುತ್ತಿದೆಯೆಂಬ ನಿರಂತರ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರಾಣಿಗಳ ಆಹಾರ ಸೇವನೆಗೆ ‘ಮೇಯುತ್ತಿತ್ತು’ ಸಹಜ; ಯಾರೋ ಅದನ್ನು ಮೇಯಿಸುತ್ತಿದ್ದರು ಎಂಬ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಕಥನಕ್ಕೆ ಸಹಜವಾದ ಶೈಲಿ. ಮೂಲದಲ್ಲಿಲ್ಲದ ಸ್ಪಷ್ಟ ಕಾಲಸೂಚಕ ಅಥವಾ ವಿರೋಧಾರ್ಥಕ ಸಂಪರ್ಕಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
