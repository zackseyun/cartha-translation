  to: ಅವರಿಂದ ಬಹಳ ದೂರದಲ್ಲಿ ಹಂದಿಗಳ ದೊಡ್ಡ ಹಿಂಡೊಂದು ಮೇಯುತ್ತಿತ್ತು.
