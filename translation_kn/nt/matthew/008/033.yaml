id: MAT.8.33
reference: Matthew 8:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: kn
  text: ಆಗ ಹಂದಿಗಳನ್ನು ಮೇಯಿಸುತ್ತಿದ್ದವರು ಓಡಿಹೋಗಿ, ಪಟ್ಟಣಕ್ಕೆ ತೆರಳಿ, ಎಲ್ಲವನ್ನೂ, ದೆವ್ವಪೀಡಿತರ ವಿಷಯವನ್ನೂ[a] ತಿಳಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃ: ‘ದೆವ್ವಪೀಡಿತರಿಗೆ ಸಂಬಂಧಿಸಿದ ಸಂಗತಿಗಳನ್ನೂ.’'
    reason: ಗ್ರೀಕ್ τὰ τῶν δαιμονιζομένων ಎಂಬುದು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ವ್ಯಾಪಕ ನುಡಿಗಟ್ಟು; ಅದರ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ಸೂಚಿಸಲು.
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: ಆಗ ಹಂದಿಗಳನ್ನು ಮೇಯಿಸುತ್ತಿದ್ದವರು
  rationale: βόσκοντες ಎಂದರೆ ಅಕ್ಷರಶಃ ‘ಮೇಯಿಸುತ್ತಿದ್ದವರು/ಆಹಾರ ಕೊಡುತ್ತಿದ್ದವರು’; ಸಂದರ್ಭದಿಂದ ಅವರು ಹಂದಿಗಳ ಹಿಂಡನ್ನು ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದವರು ಎಂಬುದು ಸ್ಪಷ್ಟ. ಕನ್ನಡದಲ್ಲಿ ಸಂದರ್ಭವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸಲು ‘ಹಂದಿಗಳನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ; δέ ಕಥೆಯ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುವ ‘ಆಗ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἔφυγον
  choice: ಓಡಿಹೋಗಿ
  rationale: φεύγω ಇಲ್ಲಿ ಭಯದಿಂದ ಅಥವಾ ಅಪಾಯದಿಂದ ಓಡಿಹೋಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಓಡಿಹೋಗಿ’ ಆ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಹಾಗೂ ಸ್ಪಷ್ಟ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: ಪಟ್ಟಣಕ್ಕೆ ತೆರಳಿ
  rationale: ಅಓರಿಸ್ಟ್ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಪಟ್ಟಣಕ್ಕೆ ತೆರಳಿ’ ಎಂಬುದು εἰς‌ನ ಗಮ್ಯಾರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡು ಕನ್ನಡದಲ್ಲಿ ಸರಾಗವಾಗಿದೆ.
- source_word: ἀπήγγειλαν πάντα
  choice: ಎಲ್ಲವನ್ನೂ ... ತಿಳಿಸಿದರು
  rationale: ἀπαγγέλλω ಎಂದರೆ ಸುದ್ದಿ ಅಥವಾ ಸಂಭವವನ್ನು ತಿಳಿಸುವುದು; πάντα ಅದರ ಸಮಗ್ರತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಎಲ್ಲವನ್ನೂ ತಿಳಿಸಿದರು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದೆ.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: ದೆವ್ವಪೀಡಿತರ ವಿಷಯವನ್ನೂ
  rationale: ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಅಕ್ಷರಶಃ ‘ದೆವ್ವಪೀಡಿತರ ಸಂಬಂಧದ ಸಂಗತಿಗಳನ್ನೂ’ ಎಂದರ್ಥ. ಘಟನೆ ಏನಾಗಿತ್ತೆಂದು ನಿರ್ದಿಷ್ಟವಾಗಿ ಸೇರಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ವ್ಯಾಪಕತೆ ಮತ್ತು ಸ್ವಲ್ಪ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: δαιμονιζομένων
  choice: ದೆವ್ವಪೀಡಿತರ
  rationale: ಈ ರೂಪವು ದೆವ್ವಗಳ ಪ್ರಭಾವಕ್ಕೆ ಒಳಗಾದವರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದೆವ್ವಪೀಡಿತರು’ ನೈಜ ದೆವ್ವಸಂಬಂಧಿ ಬಾಧೆಯನ್ನು ತಿಳಿಸುವುದರ ಜೊತೆಗೆ ಅದರ ಸ್ವರೂಪದ ಕುರಿತು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿಖರತೆಯನ್ನು ಹೇರದು.
theological_decisions:
- issue: δαιμονιζομένων ಪದದಲ್ಲಿ ದೆವ್ವಸಂಬಂಧಿ ಬಾಧೆಯ ಸ್ವರೂಪ
  choice: ದೆವ್ವಪೀಡಿತರ
  alternative: ದೆವ್ವಹಿಡಿದವರ / ದೆವ್ವದ ವಶದಲ್ಲಿದ್ದವರ
  rationale: ‘ದೆವ್ವಪೀಡಿತರು’ ಪಠ್ಯದಲ್ಲಿರುವ ನೈಜ ದೆವ್ವಸಂಬಂಧಿ ಬಾಧೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಆದರೆ ‘ವಶ’ ಅಥವಾ ಸ್ವಾಮ್ಯಭಾವದಂತಹ ಮೂಲದಲ್ಲಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ಅರ್ಥವನ್ನು ಕಡ್ಡಾಯಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: τὰ τῶν δαιμονιζομένων ಎಂಬ ಸಂಕ್ಷಿಪ್ತ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥ
  choice: ದೆವ್ವಪೀಡಿತರ ವಿಷಯವನ್ನೂ
  alternative: ದೆವ್ವಪೀಡಿತರಿಗೆ ಏನಾಗಿತ್ತೆಂಬುದನ್ನೂ
  rationale: ಮೂಲವು ‘ಅವರಿಗೆ ಏನಾಯಿತು’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದೆ ಅವರ ಕುರಿತ ಸಂಗತಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆಯ್ದ ರೂಪವು ಆ ಅರ್ಥವ್ಯಾಪ್ತಿ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಸಂರಕ್ಷಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಹಂದಿಗಳನ್ನು’ ಎಂಬ ಪದವನ್ನು ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟೀಕರಣವಾಗಿ ಸೇರಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಉಳಿಸಲು ‘ದೆವ್ವಪೀಡಿತರ ವಿಷಯವನ್ನೂ’ ಎಂದು ಇಟ್ಟು, ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
