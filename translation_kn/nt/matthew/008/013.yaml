source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: kn
  text: ಯೇಸು ಶತಾಧಿಪತಿಗೆ, “ಹೋಗು; ನೀನು ನಂಬಿದಂತೆಯೇ ನಿನಗೆ ಆಗಲಿ” ಎಂದನು. ಆ ಗಳಿಗೆಯಲ್ಲಿ ಆ ಸೇವಕನು[a] ಸ್ವಸ್ಥನಾದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಹುಡುಗನು” ಅಥವಾ “ಮಗು.” ಗ್ರೀಕ್ παῖς ಎಂಬ ಪದವು ಸೇವಕನನ್ನಾಗಲಿ, ಹುಡುಗನನ್ನಾಗಲಿ ಅಥವಾ ಮಗುವನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು. ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಶತಾಧಿಪತಿಯ ಅಧೀನದಲ್ಲಿದ್ದವನನ್ನು ಸೂಚಿಸುವುದರಿಂದ “ಸೇವಕನು” ಎಂಬುದು ಹೆಚ್ಚು ಸೂಕ್ತ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: ಶತಾಧಿಪತಿಗೆ
  rationale: ಸುಮಾರು ನೂರು ಸೈನಿಕರ ಹೊಣೆ ಹೊತ್ತಿದ್ದ ರೋಮನ್ ಸೇನಾಧಿಕಾರಿಯನ್ನು ಸೂಚಿಸುವ ನಿಖರವಾದ ಮತ್ತು ಕನ್ನಡ ಸತ್ಯವೇದ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಪದ.
- source_word: Ὕπαγε
  choice: ಹೋಗು
  rationale: ಹೊರಡುವಂತೆ ಹೇಳುವ ಆಜ್ಞಾರ್ಥವನ್ನು ಹೆಚ್ಚುವರಿ ಅರ್ಥ ಸೇರಿಸದೆ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὡς ἐπίστευσας
  choice: ನೀನು ನಂಬಿದಂತೆಯೇ
  rationale: πίστευσας ಎಂಬ ಕ್ರಿಯಾಪದದ ವೈಯಕ್ತಿಕ ಕ್ರಿಯಾರ್ಥವನ್ನು ಉಳಿಸಿ, ಅದನ್ನು ‘ನಿನ್ನ ನಂಬಿಕೆಯ ಪ್ರಕಾರ’ ಎಂಬ ನಾಮಪದೀಯ ವ್ಯಾಖ್ಯಾನವಾಗಿ ಬದಲಿಸುವುದಿಲ್ಲ.
- source_word: γενηθήτω σοι
  choice: ನಿನಗೆ ಆಗಲಿ
  rationale: γίνομαι ಪದದ ಆಜ್ಞಾರ್ಥಕ/ಅನುಮತಿಸೂಚಕ ಬಲವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: παῖς
  choice: ಸೇವಕನು
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಶತಾಧಿಪತಿಯ ಅಧೀನದಲ್ಲಿರುವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಸೇವಕ’ ಅತ್ಯುತ್ತಮವಾಗಿ ಹೊಂದುತ್ತದೆ; ಪದವು ಯುವಕ ಅಥವಾ ಮಗುವನ್ನೂ ಸೂಚಿಸಬಹುದಾದ ಕಾರಣ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἰάθη
  choice: ಗುಣಮುಖನಾದನು
  rationale: ἰάομαι ಪದದ ನಿಷ್ಕ್ರಿಯ ಗುಣಪಡಿಸುವಿಕೆಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: ಅದೇ ಗಳಿಗೆಯಲ್ಲಿ
  rationale: ಮೂಲದ ಕಾಲಸೂಚಕ ಅಭಿವ್ಯಕ್ತಿಯನ್ನೂ ಸನ್ನಿವೇಶದಲ್ಲಿನ ತಕ್ಷಣದ ಗುಣಮುಖತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: πιστεύω ಎಂಬ ನಂಬಿಕೆಸಂಬಂಧಿ ಭಾಷೆಯ ಅನುವಾದ
  choice: ನಂಬಿದಂತೆಯೇ
  alternative: ಭರವಸೆ ಇಟ್ಟಂತೆಯೇ / ನಿನ್ನ ನಂಬಿಕೆಯ ಪ್ರಕಾರ
  rationale: ಕ್ರಿಯಾಪದದ ನೇರ ಮತ್ತು ವೈಯಕ್ತಿಕ ಸ್ವರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ನಂಬಿಕೆ’ಯನ್ನು ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ವಿವರಣೆಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಶತಾಧಿಪತಿ’ ಎಂಬ ಪರಿಚಿತ ತಾಂತ್ರಿಕ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಉಳಿದ ವಾಕ್ಯರಚನೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗುವಂತೆ ಮಾಡಲಾಗಿದೆ.
