id: MAT.8.15
reference: Matthew 8:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: kn
  text: ಅವನು ಆಕೆಯ ಕೈಯನ್ನು ಮುಟ್ಟಿದನು; ಆಗ ಜ್ವರವು ಆಕೆಯನ್ನು ಬಿಟ್ಟುಹೋಯಿತು. ಆಕೆ ಎದ್ದು ಅವನಿಗೆ ಸೇವೆಮಾಡಿದಳು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವನಿಗೆ ಸೇವೆಮಾಡುತ್ತಿದ್ದಳು.’ ಗ್ರೀಕ್‌ನ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯಾರೂಪವು ಮುಂದುವರಿದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸಬಹುದು; ಸಂದರ್ಭಾನುಸಾರ ‘ಸೇವೆಮಾಡತೊಡಗಿದಳು’ ಎಂದೂ ಅರ್ಥವಾಗಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: ಮುಟ್ಟಿದನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ἅπτομαι ಎಂದರೆ ಸ್ಪರ್ಶಿಸುವುದು ಅಥವಾ ದೈಹಿಕ ಸಂಪರ್ಕ ಮಾಡುವುದು. ‘ಮುಟ್ಟಿದನು’ ಸಹಜವಾಗಿದ್ದು ಕ್ರಿಯೆಯನ್ನು ಅತಿಯಾಗಿ ಬಲಪಡಿಸುವುದಿಲ್ಲ.
- source_word: τῆς χειρὸς αὐτῆς
  choice: ಆಕೆಯ ಕೈಯನ್ನು
  rationale: χείρ ಎಂಬುದು ಸಾಮಾನ್ಯವಾಗಿ ‘ಕೈ’ ಎಂದರ್ಥ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ἅπτομαι ಜೊತೆಗೆ ಬಂದಿರುವ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜ ಕರ್ಮರೂಪವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: ಜ್ವರವು ಆಕೆಯನ್ನು ಬಿಟ್ಟುಹೋಯಿತು
  rationale: ἀφίημι ಇಲ್ಲಿ ‘ಬಿಟ್ಟುಹೋಗು’ ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ. ಈ ರೂಪವು ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಜ್ವರದ ವ್ಯಕ್ತೀಕರಣವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: πυρετός
  choice: ಜ್ವರ
  rationale: ಈ ನಾಮಪದವು ನೇರವಾಗಿ ಜ್ವರವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅನಗತ್ಯ ವಿವರಣೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἠγέρθη
  choice: ಆಕೆ ಎದ್ದು
  rationale: ಇಲ್ಲಿ ἐγείρω ಕ್ರಿಯೆಯ ನಿಷ್ಕ್ರಿಯ ರೂಪವು ಗುಣಮುಖಳಾದ ಬಳಿಕ ಆಕೆ ಎದ್ದದ್ದನ್ನು ಸಾಮಾನ್ಯ ಕಥನಾರ್ಥದಲ್ಲಿ ಹೇಳುತ್ತದೆ. ‘ಎಬ್ಬಿಸಲ್ಪಟ್ಟಳು’ ಎಂಬ ರೂಪವು ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಅನಗತ್ಯ ಧಾರ್ಮಿಕ ಸೂಚನೆಯನ್ನು ಉಂಟುಮಾಡಬಹುದು.
- source_word: διηκόνει αὐτῷ
  choice: ಅವನಿಗೆ ಸೇವೆಮಾಡತೊಡಗಿದಳು
  rationale: διακονέω ಎಂದರೆ ಸೇವೆಮಾಡುವುದು ಅಥವಾ ಉಪಚರಿಸುವುದು. ಅಪೂರ್ಣ ಭೂತಕಾಲದ ರೂಪವು ಮುಂದುವರಿದ ಕ್ರಿಯೆಯನ್ನು ವಿವರಿಸಬಹುದು; ಸನ್ನಿವೇಶದಲ್ಲಿ ಕ್ರಿಯೆಯ ಆರಂಭವನ್ನೂ ಸೂಚಿಸಬಹುದಾದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸೇವೆಮಾಡತೊಡಗಿದಳು’ ಎಂದು ನೀಡಲಾಗಿದೆ ಮತ್ತು ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ἠγέρθη ಎಂಬ ಪದಕ್ಕೆ ಪುನರುತ್ಥಾನದ ಅರ್ಥವನ್ನು ಅತಿಯಾಗಿ ಹೇರಬಹುದಾದ ಸಾಧ್ಯತೆ
  choice: ಸಾಮಾನ್ಯ ಕಥನಾರ್ಥದಲ್ಲಿ ‘ಆಕೆ ಎದ್ದು’ ಎಂದು ಅನುವಾದಿಸುವುದು
  alternative: ‘ಆಕೆ ಎಬ್ಬಿಸಲ್ಪಟ್ಟಳು’
  rationale: ἐγείρω ಬೇರೆ ಸಂದರ್ಭಗಳಲ್ಲಿ ಪುನರುತ್ಥಾನದ ಸಂಬಂಧಿತ ಅರ್ಥ ಹೊಂದಬಹುದಾದರೂ, ಇಲ್ಲಿ ತಕ್ಷಣದ ಅರ್ಥ ಗುಣಮುಖಳಾದ ಮಹಿಳೆ ಎದ್ದಳು ಎಂಬುದಾಗಿದೆ. ಈ ವಾಕ್ಯವು ಅಗತ್ಯಪಡಿಸದ ಪುನರುತ್ಥಾನ ಸಂಬಂಧಿತ ಅರ್ಥವನ್ನು ಅನುವಾದವು ಸೇರಿಸಬಾರದು.
- issue: διηκόνει ಎಂಬ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯಾರೂಪದ ಅರ್ಥಸೂಕ್ಷ್ಮತೆ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸೇವೆಮಾಡತೊಡಗಿದಳು’
  alternative: ‘ಸೇವೆಮಾಡುತ್ತಿದ್ದಳು’ ಅಥವಾ ‘ಸೇವೆಮಾಡಿದಳು’
  rationale: ಗ್ರೀಕ್ ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಮುಂದುವರಿದ ಕ್ರಿಯೆಯನ್ನು ವರ್ಣಿಸುತ್ತದೆ ಮತ್ತು ಕೆಲವೊಮ್ಮೆ ಅದರ ಆರಂಭವನ್ನು ಸೂಚಿಸಬಹುದು. ಈ ಸಾಧ್ಯತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಸರಳ ಅಥವಾ ಮುಂದುವರಿದ ಕ್ರಿಯೆಯ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆಕೆ’ ಎಂಬ ಗೌರವಪೂರ್ಣ ಸ್ತ್ರೀಲಿಂಗ ಸರ್ವನಾಮವನ್ನು ನಿರಂತರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಗ್ರೀಕ್ ವಾಕ್ಯದ ಸರಳ ಕ್ರಮ ಮತ್ತು ಜ್ವರದ ವ್ಯಕ್ತೀಕರಣವನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಕಾಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ.
