    issue: The main text specifies that she ‘began’ serving.
    rationale: The Greek imperfect διηκόνει may be inceptive in context, but it may also be simply progressive/ongoing. Making inception the unqualified main-text sense narrows the source unnecessarily. The English audit trail’s current preference does not override the need to preserve the Greek ambiguity.
