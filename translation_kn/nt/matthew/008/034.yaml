id: MAT.8.34
reference: Matthew 8:34
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: kn
  text: ಇಗೋ, ಪಟ್ಟಣದವರೆಲ್ಲರೂ ಯೇಸುವನ್ನು ಭೇಟಿಯಾಗಲು ಹೊರಗೆ ಬಂದರು. ಅವರು ಆತನನ್ನು ಕಂಡಾಗ, ತಮ್ಮ ಪ್ರದೇಶದಿಂದ[a] ಹೊರಟುಹೋಗುವಂತೆ ಆತನನ್ನು ಬೇಡಿಕೊಂಡರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ತಮ್ಮ ಸೀಮೆಯಿಂದ’; ಹೆಚ್ಚು ಅಕ್ಷರಶಃ, ‘ತಮ್ಮ ಗಡಿಗಳಿಂದ.’
    reason: ὅρια ಎಂಬ ಪದವು ಅಕ್ಷರಶಃ ಗಡಿಗಳು ಅಥವಾ ಸೀಮೆಗಳು ಎಂದರ್ಥವಾದರೂ, ಇಲ್ಲಿ ಅವುಗಳಿಂದ ಗುರುತಿಸಲ್ಪಡುವ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸಬಹುದು.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಗ್ರೀಕ್ ಸಂವಾದಸೂಚಕದ ಬಲವನ್ನೂ ಕಥನದ ಜೀವಂತಿಕೆಯನ್ನೂ ಸಹಜವಾದ, ಘನತೆಯ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πᾶσα ἡ πόλις
  choice: ಪಟ್ಟಣದವರೆಲ್ಲರೂ
  rationale: ಇದು ಕಟ್ಟಡಗಳುಳ್ಳ ಪಟ್ಟಣವನ್ನಲ್ಲ, ಅದರ ಜನರನ್ನು ಸಮೂಹವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಈ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ ಮತ್ತು ಪ್ರತಿಯೊಬ್ಬ ವ್ಯಕ್ತಿಯೂ ವಿನಾಯಿತಿಯಿಲ್ಲದೆ ಬಂದನೆಂದು ಅನಿವಾರ್ಯವಾಗಿ ಹೇಳುವುದಿಲ್ಲ.
- source_word: ἐξῆλθεν
  choice: ಹೊರಗೆ ಬಂದರು
  rationale: ಪಟ್ಟಣದಿಂದ ಹೊರಬರುವ ಚಲನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಸಮೂಹವನ್ನು ಜನರಾಗಿ ನಿರೂಪಿಸಿರುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ಬಹುವಚನ ಕ್ರಿಯಾಪದ ಸಹಜವಾಗಿದೆ.
- source_word: εἰς ὑπάντησιν
  choice: ಭೇಟಿಯಾಗಲು
  rationale: ಯಾರನ್ನಾದರೂ ಎದುರಿಗೆ ಹೋಗಿ ಭೇಟಿಯಾಗುವ ಉದ್ದೇಶವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ಅನಗತ್ಯವಾಗಿ ವಿರೋಧದ ಭಾವವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: Ἰησοῦ
  choice: ಯೇಸು
  rationale: ಕನ್ನಡ ಸುವಾರ್ತಾ ಪರಂಪರೆಯಲ್ಲಿ ಸುಪರಿಚಿತವಾದ ಪ್ರಮಾಣಿತ ನಾಮರೂಪ.
- source_word: ἰδόντες αὐτὸν
  choice: ಅವರು ಆತನನ್ನು ಕಂಡಾಗ
  rationale: ಅಓರಿಸ್ಟ್ ಕೃದಂತದ ಕಾಲಸಂಬಂಧವನ್ನು ಸರಳವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತೋರಿಸಿ, ಮೊದಲು ಕಂಡರು ನಂತರ ಬೇಡಿಕೊಂಡರು ಎಂಬ ಕಥನಕ್ರಮವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: παρεκάλεσαν
  choice: ಬೇಡಿಕೊಂಡರು
  rationale: ಸರಳವಾಗಿ ಕೇಳುವುದಕ್ಕಿಂತಲೂ earnest entreaty ಇರುವ ಕ್ರಿಯೆಯ ಬಲವನ್ನು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὅπως μεταβῇ
  choice: ಹೊರಟುಹೋಗುವಂತೆ
  rationale: ಅವರ ಬೇಡಿಕೆಯ ವಿಷಯವಾದ ಅಲ್ಲಿಂದ ತೆರಳುವ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ತಮ್ಮ ಪ್ರದೇಶದಿಂದ
  rationale: ὅρια ಎಂಬ ಪದದ ಮೂಲ ಅರ್ಥ ಗಡಿಗಳು/ಸೀಮೆಗಳು ಆದರೂ, ಇಲ್ಲಿ ಆ ಗಡಿಗಳೊಳಗಿನ ಭೂಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಪ್ರದೇಶ’ ಸಂದರ್ಭದ ಭೌಗೋಳಿಕ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಪಟ್ಟಣದ ಜನರು ಯೇಸುವನ್ನು ತೆರಳುವಂತೆ ಬೇಡಿಕೊಂಡ ಕಾರಣ
  choice: ಅವರು ಯೇಸುವನ್ನು ತಮ್ಮ ಪ್ರದೇಶದಿಂದ ಹೊರಟುಹೋಗುವಂತೆ ಬೇಡಿಕೊಂಡರು ಎಂದು ಮಾತ್ರ ಪಠ್ಯ ಹೇಳುತ್ತದೆ; ಕಾರಣವನ್ನು ಅನಿರ್ದಿಷ್ಟವಾಗಿಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಯೇಸುವಿನ ಶಕ್ತಿಯ ಭಯ, ಹಂದಿಗಳ ನಷ್ಟದ ಮೇಲಿನ ಕೋಪ, ಅಥವಾ ಘಟನೆಯಿಂದ ಉಂಟಾದ ಸಾಮಾನ್ಯ ಆತಂಕ ಎಂದು ಕಾರಣವನ್ನು ವಿವರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಅವರ ಉದ್ದೇಶ ಅಥವಾ ಮನೋಭಾವದ ಕಾರಣವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಯಾವುದೇ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ಕಥನಾತ್ಮಕ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಮೂಲದ ಗಮನಸೆಳೆಯುವ ಶಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಪಟ್ಟಣದವರೆಲ್ಲರೂ’ ಎಂಬುದು ಸಮೂಹದ ಜನರನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ಜನರ ಮನೋಭಾವದ ಕಾರಣವನ್ನು ಅನುವಾದದಲ್ಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
