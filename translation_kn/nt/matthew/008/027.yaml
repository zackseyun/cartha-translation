id: MAT.8.27
reference: Matthew 8:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: kn
  text: 'ಆ ಮನುಷ್ಯರು ವಿಸ್ಮಯಗೊಂಡು ಹೀಗೆಂದರು: “ಗಾಳಿಗಳೂ ಸಮುದ್ರವೂ ಸಹ ಇವನಿಗೆ ವಿಧೇಯರಾಗುತ್ತವೆ; ಇವನು ಎಂಥ ಮನುಷ್ಯನು?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: ಆ ಪುರುಷರು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ದೋಣಿಯಲ್ಲಿದ್ದ ಪುರುಷ ಶಿಷ್ಯರನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಲಿಂಗ ಮತ್ತು ಸಂದರ್ಭದ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಮನುಷ್ಯರು’ ಎಂಬುದಕ್ಕಿಂತ ಇಲ್ಲಿ ‘ಪುರುಷರು’ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: ἐθαύμασαν
  choice: ಬೆರಗಾಗಿ
  rationale: ಹಠಾತ್ ಉಂಟಾದ ಆಶ್ಚರ್ಯ ಮತ್ತು ವಿಸ್ಮಯವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: λέγοντες
  choice: …ಎಂದರು
  rationale: ಗ್ರೀಕ್ ಕೃದಂತದ ಸಂಬಂಧವನ್ನು ಕನ್ನಡ ನಿರೂಪಣೆಗೆ ಸಹಜವಾದ ನೇರ ಮಾತಿನ ಅಂತ್ಯದ ಕ್ರಿಯಾಪದದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: Ποταπός
  choice: ಎಂಥವನು
  rationale: ವ್ಯಕ್ತಿಯ ಸ್ವರೂಪ ಅಥವಾ ಗುಣದ ಕುರಿತು ವಿಸ್ಮಯದಿಂದ ಕೇಳುವ ಪ್ರಶ್ನೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὗτος
  choice: ಇವನು
  rationale: ಯೇಸುವನ್ನು ತಕ್ಷಣದ ಸನ್ನಿವೇಶದಲ್ಲಿ ಸೂಚಿಸುವ ಗ್ರೀಕ್ ನಿರ್ದೇಶಕ ಸರ್ವನಾಮದ ನೇರ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ವಿರಾಮಚಿಹ್ನೆ ಮತ್ತು ‘ವಲ್ಲ’ ರೂಪದ ಮೂಲಕ ಸಂಬಂಧಿಸಲಾಗಿದೆ
  rationale: ಪ್ರಶ್ನೆಗೆ ಕಾರಣವಾಗಿರುವ ಸಂಗತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಜೋಡಿಸುತ್ತದೆ; ‘ಏಕೆಂದರೆ’ ಎಂದು ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಅನುವಾದಿಸಿ ವಾಕ್ಯವನ್ನು ಅಸಹಜಗೊಳಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: ಗಾಳಿಗಳೂ ಸಮುದ್ರವೂ ಸಹ
  rationale: ಪುನರಾವರ್ತಿತ καίಯ ಒತ್ತನ್ನು ‘ವೂ…ವೂ ಸಹ’ ಎಂಬ ರಚನೆಯ ಮೂಲಕ ತೋರಿಸಿ, ಪ್ರಕೃತಿಯ ಶಕ್ತಿಗಳೂ ಅವನಿಗೆ ಒಳಪಡುತ್ತವೆ ಎಂಬ ವಿಸ್ಮಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτῷ ὑπακούουσιν
  choice: ಇವನಿಗೆ ವಿಧೇಯವಾಗುತ್ತವಲ್ಲ
  rationale: ὑπακούω ಸೂಚಿಸುವ ಕೇಳಿ ಪಾಲಿಸುವಿಕೆ ಅಥವಾ ಅಧೀನತೆಯನ್ನು ‘ವಿಧೇಯವಾಗು’ ನಿಖರವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ವರ್ತಮಾನಕಾಲದ ಜೀವಂತಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಶಿಷ್ಯರ ಪ್ರಶ್ನೆಯ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಬಲ
  choice: ಯೇಸು ಸೃಷ್ಟಿಯ ಮೇಲೆ ಅಧಿಕಾರ ನಡೆಸುತ್ತಾನೆಂಬ ಸೂಚನೆಯನ್ನು ಉಳಿಸಿ, ಅವನ ಗುರುತಿನ ಕುರಿತು ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಪ್ರಶ್ನೆಯನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಇವನು ದೇವರೇ ಆಗಿರಬೇಕು’ ಎಂಬಂಥ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದು, ಅಥವಾ ಇದನ್ನು ಕೇವಲ ಒಂದು ಅದ್ಭುತದ ಕುರಿತ ಆಶ್ಚರ್ಯವೆಂದು ದುರ್ಬಲಗೊಳಿಸುವುದು.
  rationale: ಮೂಲಪಾಠವು ಯೇಸುವಿನ ಅಸಾಧಾರಣ ಅಧಿಕಾರದ ಮೂಲಕ ಪ್ರಶ್ನೆಯನ್ನು ತೀವ್ರಗೊಳಿಸುತ್ತದೆ, ಆದರೆ ಉತ್ತರವನ್ನು ಈ ವಾಕ್ಯದಲ್ಲೇ ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ಅದರ ದೇವತಾಶಾಸ್ತ್ರೀಯ ಒತ್ತಡ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆ ಎರಡನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ನಿರೂಪಣಾಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಎಂಥವನು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿದ್ದು, ವಿಸ್ಮಯಭರಿತ ಪ್ರಶ್ನೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ವಿಧೇಯವಾಗುತ್ತವಲ್ಲ’ ಪ್ರಶ್ನೆಯ ಆಶ್ಚರ್ಯ ಮತ್ತು ಪ್ರಕೃತಿಯ ಮೇಲಿನ ವೈಯಕ್ತಿಕ ಅಧಿಕಾರ ಎರಡನ್ನೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
