id: MAT.8.26
reference: Matthew 8:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: kn
  text: ಆತನು ಅವರಿಗೆ, “ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ, ನೀವೇಕೆ ಭಯಭೀತರಾಗಿದ್ದೀರಿ?” ಎಂದು ಹೇಳಿದನು. ಅನಂತರ ಆತನು ಎದ್ದು ಗಾಳಿಗಳನ್ನೂ ಸಮುದ್ರವನ್ನೂ ಗದರಿಸಿದನು; ಆಗ ಮಹಾ ಶಾಂತಿ ಉಂಟಾಯಿತು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: ಇಷ್ಟು ಭಯಪಡುತ್ತೀರಿ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಶಿಷ್ಯರ ಭಯಭೀತ ಸ್ಥಿತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಪ್ರಶ್ನೆಯ ಗದರಿಕೆಯ ಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὀλιγόπιστοι
  choice: ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ
  rationale: ಮೂಲದ ಸಂಬೋಧನಾ ರೂಪ ಮತ್ತು ‘ಕಡಿಮೆ/ಅಲ್ಪ ವಿಶ್ವಾಸವುಳ್ಳವರು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐπετίμησεν
  choice: ಗದರಿಸಿದನು
  rationale: ಗಾಳಿ ಮತ್ತು ಸಮುದ್ರದ ಮೇಲೆ ಅಧಿಕಾರಪೂರ್ವಕವಾಗಿ ಆಜ್ಞಾಪಿಸುವ ಮೂಲ ಕ್ರಿಯಾಪದದ ಬಲವನ್ನು ಉಳಿಸುವ ಸಾಮಾನ್ಯ ಬೈಬಲ್-ಕನ್ನಡ ಪದ.
- source_word: γαλήνη μεγάλη
  choice: ಸಂಪೂರ್ಣ ನಿಶ್ಶಬ್ದವಾಯಿತು
  rationale: ಬಿರುಗಾಳಿಗೆ ವಿರುದ್ಧವಾದ ಮಹಾ ಶಾಂತ ಸ್ಥಿತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; μεγάλη ಪದದ ತೀವ್ರತೆಯನ್ನು ‘ಸಂಪೂರ್ಣ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ὀλιγόπιστοι ಎಂಬ ಸಂಬೋಧನೆಯ ಅರ್ಥ
  choice: ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ
  alternative: ವಿಶ್ವಾಸವೇ ಇಲ್ಲದವರೇ
  rationale: ಮೂಲವು ವಿಶ್ವಾಸದ ಸಂಪೂರ್ಣ ಅಭಾವವನ್ನಲ್ಲ, ಅಲ್ಪತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆದ್ದರಿಂದ ಆ ಒತ್ತಡವನ್ನು ಬದಲಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- issue: ಯೇಸುವಿನ ಗಾಳಿ ಮತ್ತು ಸಮುದ್ರದ ಮೇಲಿನ ಅಧಿಕಾರ
  choice: ಗಾಳಿಗಳನ್ನೂ ಸಮುದ್ರವನ್ನೂ ಗದರಿಸಿದನು
  alternative: ಗಾಳಿ ಮತ್ತು ಸಮುದ್ರವನ್ನು ಶಾಂತಗೊಳಿಸಿದನು
  rationale: ಮೂಲದಲ್ಲಿರುವ ವ್ಯಕ್ತೀಕರಣಸಹಿತ ಅಧಿಕಾರಪೂರ್ಣ ‘ಗದರಿಸಿದನು’ ಎಂಬ ಕ್ರಿಯೆಯನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಗೌರವಯುತ ಮತ್ತು ಕಥನಾತ್ಮಕ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಪ್ರಶ್ನೆ, ಸಂಬೋಧನೆ, ಕ್ರಮ ಮತ್ತು ತೀವ್ರತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು ಅತಿಯಾದ ಅಕ್ಷರಶಃ ಕಠಿಣತೆಯನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
