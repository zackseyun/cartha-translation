id: MAT.8.20
reference: Matthew 8:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: kn
  text: ಯೇಸು ಅವನಿಗೆ, “ನರಿಗಳಿಗೆ ಬಿಲಗಳಿವೆ; ಆಕಾಶದ ಹಕ್ಕಿಗಳಿಗೆ ಗೂಡುಗಳಿವೆ; ಆದರೆ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ತಲೆ ಒರಗಿಸಲು ಸ್ಥಳವಿಲ್ಲ” ಎಂದು ಹೇಳುತ್ತಾರೆ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ಹೇಳುತ್ತಾರೆ
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಿ, ಕನ್ನಡದ ಸುವಾರ್ತಾ ನಿರೂಪಣೆಯಲ್ಲಿ ಸಹಜವಾಗಿ ಕೇಳಿಸುವ ಗೌರವಸೂಚಕ ವರ್ತಮಾನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ἀλώπεκες
  choice: ನರಿಗಳು
  rationale: ಬಹುವಚನ ನಾಮಪದಕ್ಕೆ ನೇರವಾದ, ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: φωλεοὺς
  choice: ಗುಹೆಗಳು
  rationale: ಪ್ರಾಣಿಗಳು ಆಶ್ರಯಿಸುವ ಬಿಲ ಅಥವಾ ಗುಹೆಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ‘ಬಿಲಗಳು’ ಸಹ ಸಾಧ್ಯವಾದ ಪರ್ಯಾಯ.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ಆಕಾಶದ ಹಕ್ಕಿಗಳು
  rationale: οὐρανός ಎಂಬ ಪದದ ದೃಶ್ಯರೂಪವನ್ನು ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದಬಂಧ.
- source_word: κατασκηνώσεις
  choice: ಗೂಡುಗಳು
  rationale: ಪದವು ವಾಸಸ್ಥಳಗಳು ಅಥವಾ ತಂಗುದಾಣಗಳು ಎಂದೂ ಅರ್ಥವಾಗಬಹುದು; ಹಕ್ಕಿಗಳ ಸಂದರ್ಭದಲ್ಲಿ ‘ಗೂಡುಗಳು’ ಅತ್ಯಂತ ಸಹಜವಾಗಿದೆ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಯೇಸುವಿನ ಸ್ವನಾಮಕರಣದ ಸ್ಥಾಪಿತ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸುತ್ತದೆ; ದಾನಿಯೇಲ 7ರ ಸಂಭಾವ್ಯ ಪ್ರತಿಧ್ವನಿ ಹಾಗೂ ಪದಬಂಧದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಮುಚ್ಚುವುದಿಲ್ಲ.
- source_word: ποῦ ... οὐκ ἔχει
  choice: ಸ್ಥಳವಿಲ್ಲ
  rationale: ‘ಎಲ್ಲಿ ... ಇಲ್ಲ’ ಎಂಬ ಗ್ರೀಕ್ ರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಮತ್ತು ನಿಷ್ಠೆಯಿಂದ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: ತಲೆ ಒರಗಿಸಲು
  rationale: ತಲೆಯನ್ನು ಇಳಿಸಿ ವಿಶ್ರಾಂತಿ ಪಡೆಯುವ ಸ್ಪಷ್ಟ ಚಿತ್ರವನ್ನು ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಸ್ವನಾಮಕರಣ ὁ υἱὸς τοῦ ἀνθρώπου ಅನ್ನು ಹೇಗೆ ಅನುವಾದಿಸುವುದು
  choice: ಮನುಷ್ಯಕುಮಾರನು
  alternative: ಮಾನವನು / ಮಾನವಪುತ್ರನು
  rationale: ‘ಮನುಷ್ಯಕುಮಾರನು’ ಎಂಬುದು ಪದರೂಪವನ್ನೂ ಸ್ಥಾಪಿತ ಧಾರ್ಮಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ. ‘ಮಾನವನು’ ಎಂದು ಅರ್ಥವಿವರಣೆ ಮಾಡುವುದರಿಂದ ಮೂಲದಲ್ಲಿರುವ ಬಿರುದು, ಸಾಮಾನ್ಯ ಮಾನವಸೂಚನೆ ಮತ್ತು ದಾನಿಯೇಲೀಯ ಪ್ರತಿಧ್ವನಿಯ ನಡುವಿನ ಒತ್ತಡ ಕಡಿಮೆಯಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಬಳಸಲಾಗಿದೆ; ನೇರ ಮಾತಿನ ಒಳಗೆ ‘ಮನುಷ್ಯಕುಮಾರನಿಗೆ’ ಎಂಬ ಏಕವಚನ ಸ್ವನಾಮಕರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
