  to: ಯೇಸು ಅವನಿಗೆ, “ನರಿಗಳಿಗೆ ಬಿಲಗಳಿವೆ; ಆಕಾಶದ ಹಕ್ಕಿಗಳಿಗೆ ಗೂಡುಗಳಿವೆ; ಆದರೆ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ತಲೆ ಒರಗಿಸಲು ಸ್ಥಳವಿಲ್ಲ” ಎಂದು ಹೇಳುತ್ತಾರೆ.
