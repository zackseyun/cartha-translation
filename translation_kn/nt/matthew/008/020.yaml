review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ historical-present speech, the contrast between animals’ places of shelter and the Son of Man’s lack of a place to rest, and retains the established title “ಮನುಷ್ಯಕುಮಾರ.” However, “ಗುಹೆಗಳು” normally means caves and is not the best equivalent for foxes’ φωλεοί in this context; “ಬಿಲಗಳು” more precisely denotes animal burrows/holes.
  naturalness: The sentence is clear and natural in modern standard Kannada. Replacing “ಗುಹೆಗಳು” with “ಬಿಲಗಳು” improves idiomatic precision. The respectful present form “ಹೇಳುತ್ತಾರೆ” is appropriate in this register.
  terminology: “ಮನುಷ್ಯಕುಮಾರ” appropriately preserves the titular and interpretively open force of ὁ υἱὸς τοῦ ἀνθρώπου. “ತಲೆ ಒರಗಿಸಲು ಸ್ಥಳವಿಲ್ಲ” is a natural Kannada rendering of the concrete Greek expression and should be retained.
  issues:
  - severity: low
    issue: “ಗುಹೆಗಳು” for φωλεούς
    rationale: Although foxes can occupy caves, “ಗುಹೆಗಳು” specifically evokes caves. The source refers more generally to foxes’ holes, burrows, or dens. “ಬಿಲಗಳು” is the more accurate and natural Kannada term here.
  revised_text: ಯೇಸು ಅವನಿಗೆ, “ನರಿಗಳಿಗೆ ಬಿಲಗಳಿವೆ; ಆಕಾಶದ ಹಕ್ಕಿಗಳಿಗೆ ಗೂಡುಗಳಿವೆ; ಆದರೆ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ತಲೆ ಒರಗಿಸಲು ಸ್ಥಳವಿಲ್ಲ” ಎಂದು ಹೇಳುತ್ತಾರೆ.
  revised_footnotes: []
  revision_rationale: 'A single lexical correction changes “ಗುಹೆಗಳು” to “ಬಿಲಗಳು” to represent foxes’ dwelling-holes/dens more faithfully. No footnote is required: “ಬಿಲಗಳು” is sufficiently clear, and the verse’s key ambiguity in “ಮನುಷ್ಯಕುಮಾರ” is preserved in the translation itself.'
