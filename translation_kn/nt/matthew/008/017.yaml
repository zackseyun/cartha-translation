id: MAT.8.17
reference: Matthew 8:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: kn
  text: 'ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತೆ ಆಯಿತು: “ಆತನೇ ನಮ್ಮ ಅಸ್ವಸ್ಥತೆಗಳನ್ನು ತೆಗೆದುಕೊಂಡನು; ನಮ್ಮ ರೋಗಗಳನ್ನು ಹೊತ್ತುಕೊಂಡನು.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಅಸ್ವಸ್ಥತೆಗಳು” ಎಂಬುದನ್ನು “ದೌರ್ಬಲ್ಯಗಳು” ಅಥವಾ “ಕಾಯಿಲೆಗಳು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. “ಹೊತ್ತುಕೊಂಡನು” ಎಂಬುದಕ್ಕೆ “ಹೊತ್ತನು” ಎಂದೂ ಹೇಳಬಹುದು.
    reason: ἀσθενείας ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನೂ ἐβάστασεν ಪದದ ಪರ್ಯಾಯ ಕನ್ನಡ ರೂಪವನ್ನೂ ಸೂಚಿಸಲು.
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ನೆರವೇರುವಂತೆ ಇದು ಸಂಭವಿಸಿತು
  rationale: ὅπως ಜೊತೆಯಲ್ಲಿರುವ ಕರ್ಮಣಿ ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯಾಪದವು ಉದ್ದೇಶ/ಫಲದ ಛಾಯೆಯನ್ನು ಹೊಂದಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಪೂರ್ವಸಂದರ್ಭದ ಕ್ರಿಯೆಗಳಿಗೆ ಸಹಜವಾಗಿ ಜೋಡಿಸಲು ‘ಇದು ಸಂಭವಿಸಿತು’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ‘ನೆರವೇರುವಂತೆ’ ಮತ್ತಾಯನ ನೆರವೇರಿಕೆಯ ಸೂತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ ῥηθὲν
  choice: ಹೇಳಲ್ಪಟ್ಟದ್ದು
  rationale: ಕರ್ಮಣಿ ಭಾವವನ್ನೂ ನಾಮೀಕೃತ ಕೃದಂತದ ಅರ್ಥವನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನ ಮೂಲಕ
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮಾಧ್ಯಮ/ಕರ್ತೃತ್ವದ ಅರ್ಥವನ್ನು ‘ಮೂಲಕ’ ಉಳಿಸುತ್ತದೆ; ದೇವರು ಪ್ರವಾದಿಯ ಮೂಲಕ ಮಾತಾಡಿದನೆಂಬ ಸೂತ್ರವನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿಸ್ತರಿಸುವುದಿಲ್ಲ.
- source_word: λέγοντος
  choice: ಎಂದು
  rationale: ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುವ ಕೃದಂತಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಉಲ್ಲೇಖಸೂಚಕ ರೂಪ.
- source_word: Αὐτὸς
  choice: ಆತನೇ
  rationale: ಗ್ರೀಕ್ ಸರ್ವನಾಮದ ಒತ್ತನ್ನು ಕನ್ನಡದ ‘-ನೇ’ ಒತ್ತಿನ ಪ್ರತ್ಯಯದಿಂದ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἀσθενείας
  choice: ಅಸ್ವಸ್ಥತೆಗಳನ್ನು
  rationale: ಗುಣಹೀನತೆ, ದೌರ್ಬಲ್ಯ ಅಥವಾ ಅನಾರೋಗ್ಯವನ್ನು ಸೂಚಿಸಬಲ್ಲ ಪದ. ತಕ್ಷಣದ ಗುಣಪಡಿಸುವಿಕೆಯ ಸಂದರ್ಭದಲ್ಲಿ ‘ಅಸ್ವಸ್ಥತೆಗಳು’ ದೈಹಿಕ ಅನಾರೋಗ್ಯವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸಿ, ‘ರೋಗಗಳು’ ಎಂಬ ಮುಂದಿನ ಪದದೊಂದಿಗೆ ಸಂಪೂರ್ಣವಾಗಿ ಒಂದಾಗದಷ್ಟು ವ್ಯಾಪಕತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔλαβεν
  choice: ತೆಗೆದುಕೊಂಡನು
  rationale: λαμβάνω ಎಂಬ ಕ್ರಿಯಾಪದದ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸಿದೆ; ‘ತೆಗೆದುಹಾಕಿದನು’ ಎಂದು ಫಲವನ್ನು ಹೆಚ್ಚಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದಿಲ್ಲ ಮತ್ತು ಮುಂದಿನ ‘ಹೊತ್ತುಕೊಂಡನು’ ಎಂಬ ಕ್ರಿಯೆಯಿಂದ ಭೇದವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: νόσους
  choice: ರೋಗಗಳನ್ನು
  rationale: νόσος ಎಂಬ ನಿರ್ದಿಷ್ಟ ದೈಹಿಕ ಕಾಯಿಲೆಯ ಅರ್ಥಕ್ಕೆ ನಿಖರವಾದ, ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡ ಪದ.
- source_word: ἐβάστασεν
  choice: ಹೊತ್ತುಕೊಂಡನು
  rationale: ಭಾರವನ್ನು ಹೊರುವುದು/ಸಾಗಿಸುವುದು ಎಂಬ βαστάζω ಪದದ ಚಿತ್ರಣವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಯೆಶಾಯ 53:4ರ ಪ್ರತಿಧ್ವನಿಗೂ ಅವಕಾಶ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ ಗುಣಪಡಿಸುವಿಕೆಯ ಸಂದರ್ಭದಲ್ಲಿ ಯೆಶಾಯ 53:4ರ ಉಲ್ಲೇಖ
  choice: ದೈಹಿಕ ಬಾಧೆಯನ್ನು ಸೂಚಿಸುವ ‘ಅಸ್ವಸ್ಥತೆಗಳು’ ಮತ್ತು ‘ರೋಗಗಳು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ದೌರ್ಬಲ್ಯಗಳು’ ಮತ್ತು ‘ಕಾಯಿಲೆಗಳು’; ಅಥವಾ ಹೆಚ್ಚು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ‘ನೋವುಗಳು’ ಮತ್ತು ‘ದುಃಖಗಳು’.
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭವು ಯೇಸುವಿನ ಗುಣಪಡಿಸುವ ಸೇವೆಯನ್ನು ಉಲ್ಲೇಖಕ್ಕೆ ಜೋಡಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ದೈಹಿಕ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಆದರೆ ‘ಹೊತ್ತುಕೊಂಡನು’ ಎಂಬ ರೂಪವು ಯೆಶಾಯನ ವಿಶಾಲ ಧಾರ್ಮಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ನಿರಾಕರಿಸದೆ, ನಿರ್ದಿಷ್ಟ ಪ್ರಾಯಶ್ಚಿತ್ತ ಸಿದ್ಧಾಂತವನ್ನು ಈ ವಾಕ್ಯಕ್ಕೆ ಹೇರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ, ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ‘ಆತನೇ’ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯ’ ಸಹಜ ಕನ್ನಡ ಪದಕ್ರಮ. ಉಲ್ಲೇಖದ ಕೊನೆಯಲ್ಲಿ ಮಾತ್ರ [a] ಗುರುತನ್ನು ಇಟ್ಟು, ಎರಡೂ ಸಂಬಂಧಿತ ಪದಪರ್ಯಾಯಗಳನ್ನು ಒಂದೇ ಸಂಕ್ಷಿಪ್ತ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
