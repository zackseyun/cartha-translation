  to: ಅವರು ಕಪೆರ್ನೌಮಿಗೆ ಪ್ರವೇಶಿಸಿದಾಗ, ಒಬ್ಬ ಶತಾಧಿಪತಿ ಅವರ ಬಳಿಗೆ ಬಂದು, ಅವರನ್ನು ಬೇಡಿಕೊಳ್ಳುತ್ತಾ[a],
