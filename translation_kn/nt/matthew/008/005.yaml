  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂Εἰσελθόντος δὲ αὐτοῦ⸃ εἰς Καφαρναοὺμ προσῆλθεν αὐτῷ ἑκατόνταρχος παρακαλῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: kn
  text: ಅವರು ಕಪೆರ್ನೌಮಿಗೆ ಪ್ರವೇಶಿಸಿದಾಗ, ಒಬ್ಬ ಶತಾಧಿಪತಿ ಅವರ ಬಳಿಗೆ ಬಂದು, ಅವರನ್ನು ಬೇಡಿಕೊಳ್ಳುತ್ತಾ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವರಿಗೆ ಮೊರೆಯಿಡುತ್ತಾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: ಅವರು ಪ್ರವೇಶಿಸಿದಾಗ
  rationale: ಕರ್ತೃ ಯೇಸು ಎಂಬುದು ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟ. Aorist genitive absolute ಅನ್ನು ಕ್ರಿಯೆಗಳ ಸಂಬಂಧವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಸಹಜವಾದ ಕಾಲವಾಚಕ ಉಪವಾಕ್ಯವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: εἰς Καφαρναοὺμ
  choice: ಕಪೆರ್ನೌಮಿಗೆ
  rationale: ಸ್ಥಳನಾಮವನ್ನು ಕನ್ನಡದ ಪ್ರಚಲಿತ ಲಿಪ್ಯಂತರದಲ್ಲಿ ನೀಡಿದ್ದು, εἰς ಸೂಚಿಸುವ ಪ್ರವೇಶದ ದಿಕ್ಕನ್ನು -ಗೆ ವಿಭಕ್ತಿಯಿಂದ ಉಳಿಸಲಾಗಿದೆ.
- source_word: προσῆλθεν αὐτῷ
  choice: ಅವರ ಬಳಿಗೆ ಬಂದು
  rationale: προσέρχομαι ಪದದ ‘ಬಳಿಗೆ ಬರು/ಸಮೀಪಿಸು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾದ ಕನ್ನಡ ಕಥನಶೈಲಿಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἑκατόνταρχος
  choice: ಶತಾಧಿಪತಿ
  rationale: ನೂರು ಸೈನಿಕರ ಮೇಲಿನ ಅಧಿಕಾರಿಯನ್ನು ಸೂಚಿಸುವ ನಿರ್ದಿಷ್ಟ ಸೈನಿಕ ಹುದ್ದೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಪರಂಪರೆಯಿಂದ ಪರಿಚಿತವಾದ ಕನ್ನಡ ಪದದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: παρακαλῶν αὐτὸν
  choice: ಅವರನ್ನು ಬೇಡಿಕೊಂಡನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಮುಂದಿನ ವಚನದಲ್ಲಿ ಬರುವ earnest request ಅನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ‘ಬೇಡಿಕೊಂಡನು’ ಸಾಮಾನ್ಯ ಕೇಳುವಿಕೆಗೆ ಮೀರಿದ ವಿನಂತಿಯನ್ನು ಸೂಚಿಸಿದರೂ ಭಾವತೀವ್ರತೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೆಚ್ಚಿಸುವುದಿಲ್ಲ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ಪ್ರಯೋಗಿಸಲಾಗಿದೆ. ವಾಕ್ಯವು ಮುಂದಿನ ವಚನದಲ್ಲಿ ಪೂರ್ಣಗೊಳ್ಳುವ ವಿನಂತಿಯನ್ನು ಪರಿಚಯಿಸುವುದರಿಂದ ಅಂತ್ಯದಲ್ಲಿ ಅಲ್ಪವಿರಾಮ ಉಳಿಸಲಾಗಿದೆ.
