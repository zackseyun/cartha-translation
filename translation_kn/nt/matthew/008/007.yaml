id: MAT.8.7
reference: Matthew 8:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: kn
  text: ಆಗ ಯೇಸು ಅವನಿಗೆ, “ನಾನು ಬಂದು ಅವನನ್ನು ಗುಣಪಡಿಸುವೆನು” ಎಂದು ಹೇಳಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಾನು ಬಂದು ಅವನನ್ನು ಗುಣಪಡಿಸಬೇಕೇ?” ಸಂದರ್ಭದ ಆಧಾರದಲ್ಲಿ ಕೆಲವು ವ್ಯಾಖ್ಯಾನಕಾರರು ಯೇಸುವಿನ ಮಾತುಗಳನ್ನು ಪ್ರಶ್ನೆಯಾಗಿ ಗ್ರಹಿಸುತ್ತಾರೆ; ಆದರೆ ಗ್ರೀಕ್ ವಾಕ್ಯರಚನೆ ಸಹಜವಾಗಿ ಹೇಳಿಕೆಯಂತೆ ಓದಲ್ಪಡುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: ಆಗ
  rationale: ಸರಳ ನಿರೂಪಣಾ ಸಂಪರ್ಕವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಕಾಲಕ್ರಮದ ಭಾರವನ್ನು ಅತಿಯಾಗಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: λέγει
  choice: ಹೇಳಿದನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವಿದ್ದರೂ, ಆಧುನಿಕ ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಯಲ್ಲಿ ಭೂತಕಾಲ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: αὐτῷ
  choice: ಅವನಿಗೆ
  rationale: λέγει ಕ್ರಿಯಾಪದದ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Ἐγὼ
  choice: ನಾನು
  rationale: ವ್ಯಕ್ತ ಸರ್ವನಾಮವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅನಗತ್ಯವಾಗಿ ‘ನಾನೇ’ ಎಂಬ ಹೆಚ್ಚಿನ ಒತ್ತನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐλθὼν
  choice: ಬಂದು
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಅಥವಾ ಅದರೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ಪೂರ್ವಕಾಲಿಕ ಕ್ರಿಯಾರೂಪದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: θεραπεύσω
  choice: ಗುಣಪಡಿಸುವೆನು
  rationale: ರೋಗಿಯನ್ನು ಸ್ವಸ್ಥಗೊಳಿಸುವ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಗೌರವಯುತವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: αὐτόν
  choice: ಅವನನ್ನು
  rationale: ಅಸ್ವಸ್ಥ ಸೇವಕನನ್ನು ಸೂಚಿಸುವ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ನೇರ ಕರ್ಮವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಈ ಮಾತನ್ನು ಹೇಳಿಕೆಯಾಗಿ ಅನುವಾದಿಸಬೇಕೋ ಪ್ರಶ್ನೆಯಾಗಿ ಅನುವಾದಿಸಬೇಕೋ
  choice: 'ಹೇಳಿಕೆ: “ನಾನು ಬಂದು ಅವನನ್ನು ಗುಣಪಡಿಸುವೆನು.”'
  alternative: 'ಪ್ರಶ್ನೆ: “ನಾನು ಬಂದು ಅವನನ್ನು ಗುಣಪಡಿಸಬೇಕೇ?”'
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯದಲ್ಲಿ ಪ್ರಶ್ನಾರ್ಥಕ ಕಣವಿಲ್ಲ; ಅದರ ಸಹಜ ವ್ಯಾಕರಣಿಕ ಓದು ಹೇಳಿಕೆಯಾಗಿದೆ. ಸಂದರ್ಭದ ಆಧಾರದಲ್ಲಿ ಪ್ರಶ್ನೆಯಾಗಿ ಗ್ರಹಿಸುವ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕ್ಕಿಂತ ಭೂತಕಾಲ ಹೆಚ್ಚು ಸಹಜವಾದುದರಿಂದ λέγει ಅನ್ನು ‘ಹೇಳಿದನು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ಪದ್ಯದ ಸಂದರ್ಭವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ಕರ್ತೃವನ್ನು ‘ಯೇಸು’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
