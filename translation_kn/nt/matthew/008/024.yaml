id: MAT.8.24
reference: Matthew 8:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: kn
  text: ಇಗೋ[a], ಸಮುದ್ರದಲ್ಲಿ ದೊಡ್ಡ ಬಿರುಗಾಳಿ ಎದ್ದಿತು; ಅದರ ಪರಿಣಾಮವಾಗಿ ದೋಣಿಯು ಅಲೆಗಳಿಂದ ಮುಚ್ಚಲ್ಪಡುತ್ತಿತ್ತು[b]. ಆದರೆ ಅವರು ನಿದ್ರಿಸುತ್ತಿದ್ದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನ σεισμός ಎಂಬ ಪದಕ್ಕೆ ಸಾಮಾನ್ಯವಾಗಿ ‘ಭೂಕಂಪ’ ಅಥವಾ ‘ಕಂಪನ’ ಎಂಬ ಅರ್ಥವೂ ಇದೆ; ಇಲ್ಲಿ ಸನ್ನಿವೇಶದಲ್ಲಿ ಅದು ಸಮುದ್ರದ ಭೀಕರ ಬಿರುಗಾಳಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಅಲೆಗಳಿಂದ ಮುಳುಗಿಹೋಗುತ್ತಿತ್ತು.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಮತ್ತು ಘಟನೆಯ ಹಠಾತ್ತನವನ್ನು ಜೀವಂತವಾಗಿ ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಸಂವಾದಸೂಚಕದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: σεισμὸς μέγας
  choice: ದೊಡ್ಡ ಬಿರುಗಾಳಿ
  rationale: σεισμός ಸಾಮಾನ್ಯವಾಗಿ ‘ಭೂಕಂಪ’ ಅಥವಾ ‘ಕಂಪನ’ ಎಂದಾಗಬಹುದಾದರೂ, ಸಮುದ್ರ, ದೋಣಿ ಮತ್ತು ಅಲೆಗಳ ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಭೀಕರ ಸಮುದ್ರದ ಬಿರುಗಾಳಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐγένετο
  choice: ಎದ್ದಿತು
  rationale: ಹವಾಮಾನ ಘಟನೆಯ ಆರಂಭವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ θαλάσσῃ
  choice: ಸಮುದ್ರದಲ್ಲಿ
  rationale: ಮೂಲದ θάλασσα ಎಂಬ ‘ಸಮುದ್ರ’ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡು ಘಟನೆಯ ಸ್ಥಳವನ್ನು ಸಹಜವಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: ὥστε
  choice: ಮುಚ್ಚಿಬಿಡುವಷ್ಟು
  rationale: ಬಿರುಗಾಳಿಯ ಪರಿಣಾಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಫಲಿತಾಂಶ ಸೂಚಕ ರಚನೆಯಿಂದ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸ πλοῖον
  choice: ದೋಣಿ
  rationale: ಗಲಿಲಾಯ ಸಮುದ್ರದ ಸುವಾರ್ತಾ ಸನ್ನಿವೇಶದಲ್ಲಿ πλοῖονಗೆ ‘ದೋಣಿ’ ಸಹಜ ಮತ್ತು ಸೂಕ್ತ.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: ಅಲೆಗಳು ದೋಣಿಯನ್ನು ಮುಚ್ಚಿಬಿಡುವಷ್ಟು ಅಪ್ಪಳಿಸುತ್ತಿದ್ದವು
  rationale: ಅಲೆಗಳಿಂದ ದೋಣಿ ನಿರಂತರವಾಗಿ ಮುಚ್ಚಲ್ಪಡುತ್ತಿದ್ದ ಅರ್ಥವನ್ನು ಸಹಜ, ಜೀವಂತ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ಅಪೂರ್ಣಕಾಲದ ಮುಂದುವರಿಯುವ ಕ್ರಿಯಾಭಾವವನ್ನೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: αὐτὸς δὲ
  choice: ಆದರೆ ಅವರು
  rationale: ಸುತ್ತಲಿನ ಗದ್ದಲಕ್ಕೂ ಯೇಸುವಿನ ಸ್ಥಿತಿಗೂ ಇರುವ ಸ್ಪಷ್ಟ ವಿರೋಧವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮವನ್ನು ಬಳಸುತ್ತದೆ.
- source_word: ἐκάθευδεν
  choice: ನಿದ್ರಿಸುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣಕಾಲ ಸೂಚಿಸುವ ಮುಂದುವರಿದ ಹಿಂದಿನ ಕ್ರಿಯೆಯನ್ನು ಸಹಜವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
theological_decisions:
- issue: σεισμός ಸೂಚಿಸುವ ಘಟನೆಯ ಸ್ವರೂಪ
  choice: ಸಮುದ್ರದ ಸನ್ನಿವೇಶಕ್ಕೆ ಅನುಗುಣವಾಗಿ ‘ಬಿರುಗಾಳಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಭೂಕಂಪ’ ಅಥವಾ ‘ದೊಡ್ಡ ಕಂಪನ’ ಎಂದು ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ಅನುವಾದಿಸುವುದು.
  rationale: ಇದು ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಧಾರವಲ್ಲ, ಸನ್ನಿವೇಶಾಧಾರಿತ ಪದಾರ್ಥ ನಿರ್ಧಾರ. ಅಲೆಗಳು ದೋಣಿಯನ್ನು ಮುಚ್ಚುವ ಸಮುದ್ರದ ಸನ್ನಿವೇಶವು ಭೀಕರ ಬಿರುಗಾಳಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಪೂರ್ಣ ಮತ್ತು ವಾಚನಕ್ಕೆ ಸಹಜವಾದ ಶೈಲಿ. ‘ಅವರು’ ಎಂಬುದು ಯೇಸುವಿಗೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ಗೌರವಸೂಚಕ ಏಕವಚನ; ಮೂಲದಲ್ಲಿರುವ ವ್ಯಕ್ತಿವಿರೋಧವನ್ನು ಹೆಚ್ಚಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
