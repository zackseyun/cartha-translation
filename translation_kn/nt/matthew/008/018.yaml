id: MAT.8.18
reference: Matthew 8:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: kn
  text: ಯೇಸು ತನ್ನ ಸುತ್ತಲೂ ಅನೇಕ ಜನಗುಂಪುಗಳನ್ನು ಕಂಡಾಗ, ಆಚೆ ದಡಕ್ಕೆ ಹೋಗುವಂತೆ ಆಜ್ಞಾಪಿಸಿದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: ಬಹಳ ಜನರ ಗುಂಪುಗಳನ್ನು
  rationale: ಬಹುವಚನವಾದ ὄχλους ಅನ್ನು ಉಳಿಸಿಕೊಂಡು, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಅನೇಕ ಜನಸಮೂಹಗಳು ಸುತ್ತಲೂ ಇದ್ದವು ಎಂಬ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐκέλευσεν
  choice: ಆಜ್ಞಾಪಿಸಿದನು
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಕೇವಲ ಹೇಳುವುದಕ್ಕಿಂತ ಅಧಿಕಾರಪೂರ್ವಕ ಆದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀπελθεῖν
  choice: ಹೋಗುವಂತೆ
  rationale: ಗ್ರೀಕ್ infinitive ಆದೇಶದ ವಿಷಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಪರೋಕ್ಷ ಆದೇಶ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: εἰς τὸ πέραν
  choice: ಆಚೆ ದಡಕ್ಕೆ
  rationale: ಗಲಿಲಾಯ ಸರೋವರದ ಇನ್ನೊಂದು ದಡವನ್ನು ಸೂಚಿಸುವ ಸಂದರ್ಭೋಚಿತ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಅಭಿವ್ಯಕ್ತಿ.
theological_decisions:
- issue: ಆಜ್ಞೆಯ ಉದ್ದೇಶಿತ ಕರ್ತೃ ಮೂಲಪಾಠದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಲಾಗಿಲ್ಲ
  choice: ಕರ್ತೃವನ್ನು ಸೇರಿಸದೆ ‘ಹೋಗುವಂತೆ ಆಜ್ಞಾಪಿಸಿದನು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ
  alternative: ‘ಶಿಷ್ಯರಿಗೆ ಆಚೆ ದಡಕ್ಕೆ ಹೋಗುವಂತೆ ಆಜ್ಞಾಪಿಸಿದನು’
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಪಠ್ಯವು ಯಾರಿಗೆ ಆಜ್ಞಾಪಿಸಿದನು ಅಥವಾ ಯಾರು ಹೋಗಬೇಕು ಎಂಬುದನ್ನು ಈ ವಾಕ್ಯದಲ್ಲೇ ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ‘ಶಿಷ್ಯರಿಗೆ’ ಎಂದು ಸೇರಿಸುವುದು ಸಂದರ್ಭಾಧಾರಿತ ವ್ಯಾಖ್ಯಾನವಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಓದಲು ಸುಲಭವಾದ ಶೈಲಿ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಕಾರಣಕಾಲ ಸಂಬಂಧವನ್ನು ‘ಕಂಡಾಗ’ ಎಂಬ ರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; δέ ಅನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದೆ ಕನ್ನಡದ ಪ್ರವಾಹದಲ್ಲಿ ಒಳಗೊಳ್ಳಿಸಲಾಗಿದೆ.
