translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ನಿರೂಪಣೆ. ಯೇಸುವಿಗೆ ಗೌರವ ಸೂಚಿಸಲು ಬಹುವಚನ ಗೌರವರೂಪ ‘ಅವರು/ಅವರನ್ನು’ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನ ‘crowds many’ ಎಂಬ ಬಹುವಚನ ಅರ್ಥವನ್ನು ‘ದೊಡ್ಡ ಜನಸಮೂಹಗಳು’ ಎಂದು ಸಹಜವಾಗಿ ಉಳಿಸಿರುವುದರಿಂದ ಪಾದಟಿಪ್ಪಣಿ ಅಗತ್ಯವಿಲ್ಲ.
