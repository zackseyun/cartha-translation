id: MAT.8.21
reference: Matthew 8:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: kn
  text: ಆಗ ಶಿಷ್ಯರಲ್ಲಿ ಮತ್ತೊಬ್ಬನು ಆತನಿಗೆ, “ಕರ್ತನೇ, ನಾನು ಮೊದಲು ಹೋಗಿ ನನ್ನ ತಂದೆಯನ್ನು ಸಮಾಧಿಮಾಡಲು ನನಗೆ ಅನುಮತಿ ಕೊಡು[a],” ಎಂದು ಹೇಳಿದನು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನನಗೆ ಅವಕಾಶ ಕೊಡು’ ಅಥವಾ ‘ನನ್ನನ್ನು ಹೋಗಲು ಬಿಡು.’
    reason: lexical_alternative
  - marker: b
    text: ಈ ಕೋರಿಕೆಯು ತಕ್ಷಣದ ಸಮಾಧಿಯನ್ನು ಸೂಚಿಸಬಹುದು; ಅಥವಾ ತಂದೆ ಸಾಯುವವರೆಗೆ ಪುತ್ರಧರ್ಮವನ್ನು ನೆರವೇರಿಸುವ ವಿಶಾಲ ಕರ್ತವ್ಯವನ್ನು ಸೂಚಿಸಬಹುದು. ಗ್ರೀಕ್ ಪಠ್ಯವು ಇದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: ಆಗ ಶಿಷ್ಯರಲ್ಲಿ ಮತ್ತೊಬ್ಬನು
  rationale: ἕτερος ಒಬ್ಬ ಹೆಚ್ಚುವರಿ, ಹಿಂದಿನವನಿಗಿಂತ ಭಿನ್ನ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; τῶν μαθητῶν ಅವನು ಶಿಷ್ಯರ ಗುಂಪಿಗೆ ಸೇರಿದವನೆಂದು ತಿಳಿಸುತ್ತದೆ. δέ ಇಲ್ಲಿ ಕಥನವನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಪರ್ಕಕವಾಗಿರುವುದರಿಂದ ‘ಆಗ’ ಸಹಜವಾಗಿದೆ.
- source_word: Κύριε
  choice: ಕರ್ತನೇ
  rationale: ಯೇಸುವಿಗೆ ನೇರ ಸಂಬೋಧನೆಯಲ್ಲಿ ಗೌರವವನ್ನೂ ಸಾಧ್ಯವಾದ ಧಾರ್ಮಿಕ ತೂಕವನ್ನೂ ಉಳಿಸುವ ಸ್ಥಿರ ಕನ್ನಡ ಪದ.
- source_word: ἐπίτρεψόν μοι
  choice: ನನಗೆ ಅನುಮತಿ ಕೊಡು
  rationale: ಈ ಆಜ್ಞಾರ್ಥಕ ರೂಪವು ಗೌರವಪೂರ್ವಕ ಅನುಮತಿ ಕೋರಿಕೆಯನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: πρῶτον ἀπελθεῖν
  choice: ನಾನು ಮೊದಲು ಹೋಗಿ
  rationale: πρῶτον ಕ್ರಮದಲ್ಲಿನ ಆದ್ಯತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἀπελθεῖν ಪ್ರಸ್ತುತ ಸ್ಥಳದಿಂದ ಹೋಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ಕ್ರಿಯಾಸರಣಿಯಲ್ಲಿ ‘ಮೊದಲು ಹೋಗಿ’ ಸಹಜವಾಗಿ ಎರಡನ್ನೂ ಹಿಡಿದಿಡುತ್ತದೆ.
- source_word: θάψαι τὸν πατέρα μου
  choice: ನನ್ನ ತಂದೆಯನ್ನು ಸಮಾಧಿಮಾಡಲು
  rationale: θάψαι ಎಂಬುದು ಮೃತದೇಹವನ್ನು ಹೂಳುವುದು/ಸಮಾಧಿಮಾಡುವುದನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಸಮಾಧಿಮಾಡು’ ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಬೈಬಲ್ ಕನ್ನಡಕ್ಕೆ ಸೂಕ್ತವಾಗಿದೆ.
theological_decisions:
- issue: ತಂದೆಯನ್ನು ಸಮಾಧಿಮಾಡುವ ಕೋರಿಕೆಯ ಕಾಲಸಂದರ್ಭ
  choice: ತಂದೆಯನ್ನು ಸಮಾಧಿಮಾಡಲು ಹೋಗುವ ಸರಳ ಕೋರಿಕೆಯಾಗಿಯೇ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ತಂದೆ ಈಗಾಗಲೇ ಸತ್ತಿದ್ದು ತಕ್ಷಣದ ಅಂತ್ಯಸಂಸ್ಕಾರ ಬೇಕಾಗಿದೆ; ಅಥವಾ ತಂದೆ ಸಾಯುವವರೆಗೆ ಮನೆಯಲ್ಲಿದ್ದು ಪುತ್ರಧರ್ಮ ನೆರವೇರಿಸುವುದನ್ನು ಈ ಮಾತು ಸೂಚಿಸುತ್ತದೆ.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ತಂದೆ ಈಗಾಗಲೇ ಸತ್ತಿದ್ದಾನೆಯೇ ಅಥವಾ ಇದು ದೀರ್ಘಕಾಲದ ಕುಟುಂಬ ಕರ್ತವ್ಯವನ್ನೇ ಸೂಚಿಸುತ್ತದೆಯೇ ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಯಾವುದನ್ನೂ ತೀರ್ಮಾನಿಸದೆ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಕರ್ತನೇ’ ಧಾರ್ಮಿಕ ತೂಕವನ್ನು ಉಳಿಸುತ್ತದೆ; ವಾಕ್ಯರಚನೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗುವಂತೆ ಮಾಡಲಾಗಿದೆ. ಎಲ್ಲಾ ಅಡಿಕುರಿತು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
