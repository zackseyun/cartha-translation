- from: ಆಗ ಇಗೋ, ಕುಷ್ಠರೋಗವಿದ್ದ ಒಬ್ಬನು ಹತ್ತಿರ ಬಂದು ಆತನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು[a], “ಕರ್ತನೇ, ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ ನನ್ನನ್ನು ಶುದ್ಧಮಾಡಬಲ್ಲೆ” ಎಂದು ಹೇಳಿದನು.
  to: ಇಗೋ, ಕುಷ್ಠರೋಗವಿದ್ದ ಒಬ್ಬನು ಹತ್ತಿರ ಬಂದು ಆತನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು[a], “ಕರ್ತನೇ, ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ, ನೀನು ನನ್ನನ್ನು ಶುದ್ಧಮಾಡಬಲ್ಲೆ” ಎಂದು ಹೇಳಿದನು.
  rationale: The revision removes the unnatural temporal force introduced by «ಆಗ» while retaining the source’s vivid attention marker in «ಇಗೋ.» It also adds the explicit second-person subject «ನೀನು» in the man’s statement, clarifying that Jesus is confessed as able to cleanse him. The reverential-action rendering and its ambiguity-preserving footnote remain intact.
  reviewer_model: gpt-5.6-terra
