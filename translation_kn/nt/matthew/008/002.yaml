id: MAT.8.2
reference: Matthew 8:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: kn
  text: ಇಗೋ, ಕುಷ್ಠರೋಗವಿದ್ದ ಒಬ್ಬನು ಹತ್ತಿರ ಬಂದು ಆತನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು[a], “ಕರ್ತನೇ, ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ, ನೀನು ನನ್ನನ್ನು ಶುದ್ಧಮಾಡಬಲ್ಲೆ” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಆತನನ್ನು ಆರಾಧಿಸಿ”; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಗೌರವದಿಂದ ಅಡ್ಡಬೀಳುವುದು, ಗೌರವ ಸಲ್ಲಿಸುವುದು ಅಥವಾ ಆರಾಧಿಸುವುದು ಎಂಬ ಅರ್ಥಗಳನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಗ್ರೀಕ್ ನಿರೂಪಣಾ ಕಣದ ಬಲವನ್ನು ಉಳಿಸಿ, ಘಟನೆಯ ಜೀವಂತಿಕೆಯನ್ನು ತೋರಿಸುತ್ತದೆ.
- source_word: λεπρὸς
  choice: ಕುಷ್ಠರೋಗವಿದ್ದ ಒಬ್ಬನು
  rationale: ವ್ಯಕ್ತಿಯನ್ನು ರೋಗದ ಹೆಸರಿನಿಂದ ಮಾತ್ರ ಗುರುತಿಸದೆ, ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ‘ಕುಷ್ಠರೋಗ’ ಎಂದು ಕರೆಯಲಾಗುವ ಚರ್ಮರೋಗದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: προσελθὼν
  choice: ಹತ್ತಿರ ಬಂದು
  rationale: ಯೇಸುವಿನ ಬಳಿಗೆ ಸಮೀಪಿಸಿದ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: προσεκύνει
  choice: ಆತನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು
  rationale: ಪದವು ದಂಡಪ್ರಣಾಮ, ಗೌರವ ಸಲ್ಲಿಕೆ ಅಥವಾ ಆರಾಧನೆ ಎಂಬ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ; ದೈಹಿಕ ಗೌರವಭಾವದ ಕ್ರಿಯೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಅರ್ಥವನ್ನು ಒಂದೇ ರೀತಿಯಲ್ಲಿ ನಿರ್ಣಯಿಸುವುದಿಲ್ಲ.
- source_word: Κύριε
  choice: ಕರ್ತನೇ
  rationale: ಗೌರವಪೂರ್ಣ ಸಂಬೋಧನೆಯನ್ನೂ ಸಾಧ್ಯವಾದ ಕ್ರಿಸ್ತತಾತ್ತ್ವಿಕ ತೂಕವನ್ನೂ ಉಳಿಸುವ ರೂಢಿಯಾದ ಕನ್ನಡ ಪದ.
- source_word: ἐὰν θέλῃς
  choice: ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ
  rationale: ಯೇಸುವಿನ ಇಚ್ಛೆಯನ್ನು ಅವಲಂಬಿಸಿದ ಷರತ್ತನ್ನು ಸ್ವಾಭಾವಿಕ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δύνασαί
  choice: ಮಾಡಬಲ್ಲೆ
  rationale: ಸಾಮರ್ಥ್ಯ ಅಥವಾ ಶಕ್ತಿಯ ಸ್ಪಷ್ಟ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: καθαρίσαι
  choice: ನನ್ನನ್ನು ಶುದ್ಧಮಾಡ
  rationale: ಇದು ಕೇವಲ ಗುಣಪಡಿಸುವುದಕ್ಕಿಂತ ದೈಹಿಕ ಹಾಗೂ ಧಾರ್ಮಿಕ ಶುದ್ಧತೆಯ ಸೂಚನೆಯನ್ನು ಒಳಗೊಂಡಿರುವುದರಿಂದ ‘ಶುದ್ಧಮಾಡ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಕಡೆಗೆ προσκυνέω ಎಂಬ ಕ್ರಿಯೆಯ ಅರ್ಥ
  choice: ಆತನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು
  alternative: ಆತನನ್ನು ಆರಾಧಿಸಿ
  rationale: ಈ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸಾಷ್ಟಾಂಗ ನಮಸ್ಕಾರ, ಗೌರವ ಸಲ್ಲಿಕೆ ಅಥವಾ ಆರಾಧನೆಯನ್ನು ಸೂಚಿಸಬಹುದು. ಸನ್ನಿವೇಶದಲ್ಲಿನ ಗೌರವಪೂರ್ಣ ದೈಹಿಕ ಕ್ರಿಯೆಯನ್ನು ಅನುವಾದವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಆದರೆ ಅದನ್ನು ಕೇವಲ ‘ಆರಾಧನೆ’ ಎಂದು ನಿರ್ಣಯಿಸಿ ಮೂಲದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಕುಗ್ಗಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ನಿರೂಪಣೆ. ‘ಆಗ ಇಗೋ’ ಎಂಬುದು καὶ ἰδοὺ ಯ ನಿರೂಪಣಾ ಸಂಕ್ರಮಣ ಮತ್ತು ಗಮನ ಸೆಳೆಯುವ ಬಲ ಎರಡನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ಅಡ್ಡಬಿದ್ದು’ ಎಂಬುದು ಮೂಲದ ಅರ್ಥಸಂದಿಗ್ಧತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯೊಂದಿಗೆ ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
