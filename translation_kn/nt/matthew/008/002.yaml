review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the man’s approach, his reverential act before Jesus, the address «Lord,» the conditional appeal to Jesus’ will, and Jesus’ ability to cleanse. «ಶುದ್ಧಮಾಡ» appropriately retains the cleansing language rather than reducing it to generic healing. The source’s attention-directing ἰδού is preserved by «ಇಗೋ.»
  naturalness: Most wording is natural modern standard Kannada. However, «ಆಗ ಇಗೋ» is an awkward, overly literal pairing in Kannada; «ಇಗೋ» alone naturally carries the marked attention-directing force. Making the implied subject explicit in the direct speech also produces a smoother, clearer Kannada sentence.
  terminology: «ಕುಷ್ಠರೋಗವಿದ್ದ ಒಬ್ಬನು,» «ಕರ್ತನೇ,» and «ಶುದ್ಧಮಾಡ» are appropriate and maintain person-respecting, biblical, and theological register. «ಆತನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು» is a suitable non-overdetermined rendering of προσκυνέω; the footnote preserves the possible worship sense without imposing it on the main text.
  issues:
  - severity: low
    issue: «ಆಗ ಇಗೋ» is stylistically awkward in modern Kannada.
    rationale: While καὶ ἰδού combines a connective with an attention marker, rendering both mechanically as «ಆಗ ಇಗೋ» makes Kannada sound unnatural and gives καὶ an unwarranted temporal sense. «ಇಗೋ» preserves the salient discourse function.
  - severity: low
    issue: The subject of «ನನ್ನನ್ನು ಶುದ್ಧಮಾಡಬಲ್ಲೆ» is only implicit.
    rationale: Kannada permits an implicit subject, but «ನೀನು» makes the confession of Jesus’ ability explicit and improves the rhythm of the direct address without adding meaning.
  revised_text: ಇಗೋ, ಕುಷ್ಠರೋಗವಿದ್ದ ಒಬ್ಬನು ಹತ್ತಿರ ಬಂದು ಆತನ ಮುಂದೆ ಅಡ್ಡಬಿದ್ದು[a], “ಕರ್ತನೇ, ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ, ನೀನು ನನ್ನನ್ನು ಶುದ್ಧಮಾಡಬಲ್ಲೆ” ಎಂದು ಹೇಳಿದನು.
