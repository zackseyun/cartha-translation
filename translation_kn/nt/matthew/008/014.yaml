revisions:
- from: ಯೇಸು ಪೇತ್ರನ ಮನೆಗೆ ಬಂದಾಗ, ಪೇತ್ರನ ಅತ್ತೆ ಮಲಗಿದ್ದು[a] ಜ್ವರ ಬಂದಿರುವುದನ್ನು[b] ಕಂಡನು.
  to: ಯೇಸು ಪೇತ್ರನ ಮನೆಗೆ ಬಂದಾಗ, ಮಲಗಿದ್ದ[a] ಮತ್ತು ಜ್ವರವಿದ್ದ[b] ಪೇತ್ರನ ಅತ್ತೆಯನ್ನು ಕಂಡನು.
  rationale: The revision replaces an onset-oriented fever expression with “ಜ್ವರವಿದ್ದ,” which directly reflects the Greek depiction of an ongoing feverish condition. Recasting the two participial descriptions as modifiers of “ಪೇತ್ರನ ಅತ್ತೆಯನ್ನು” is natural Kannada and retains the source syntax and meaning without adding “bed” or an intensified sense of suffering to the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Peter as the referent of αὐτοῦ and faithfully renders Jesus’ arrival at Peter’s house. However, “ಜ್ವರ ಬಂದಿರುವುದನ್ನು” can suggest the onset or arrival of a fever rather than the Greek present-state description πυρέσσουσαν (“being feverish/having a fever”).
  naturalness: The current clause is understandable, but the revised attributive construction is more idiomatic Kannada and clearly makes Peter’s mother-in-law the person Jesus saw.
  terminology: “ಪೇತ್ರನ ಅತ್ತೆ” is accurate and appropriately removes possible ambiguity about the pronoun’s referent. “ಜ್ವರವಿದ್ದ” is a direct, modern-standard equivalent for the ongoing condition expressed by πυρέσσουσαν.
  issues:
  - severity: medium
    issue: “ಜ್ವರ ಬಂದಿರುವುದನ್ನು” is aspectually imprecise.
    rationale: This wording commonly conveys that a fever has come upon someone, potentially emphasizing onset. The Greek present participle describes her current condition, not its onset. “ಜ್ವರವಿದ್ದ” preserves the simple ongoing state.
