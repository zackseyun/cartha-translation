id: MAT.8.14
reference: Matthew 8:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: kn
  text: ಯೇಸು ಪೇತ್ರನ ಮನೆಗೆ ಬಂದಾಗ, ಮಲಗಿದ್ದ[a] ಮತ್ತು ಜ್ವರವಿದ್ದ[b] ಪೇತ್ರನ ಅತ್ತೆಯನ್ನು ಕಂಡನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹಾಸಿಗೆಯಲ್ಲಿ ಅಸ್ವಸ್ಥಳಾಗಿ ಮಲಗಿದ್ದಳು.’ ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ಅಕ್ಷರಶಃ ಆಕೆ ‘ಮಲಗಿಸಲ್ಪಟ್ಟವಳಾಗಿ/ಮಲಗಿರುವವಳಾಗಿ’ ಮತ್ತು ಜ್ವರವುಳ್ಳವಳಾಗಿ ಇದ್ದಳು ಎಂದು ಹೇಳುತ್ತದೆ; ‘ಹಾಸಿಗೆಯಲ್ಲಿ’ ಎಂಬುದು ಸಂದರ್ಭದಿಂದ ಸೂಚಿತವಾದರೂ ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಜ್ವರದಿಂದ ಬಳಲುತ್ತಿದ್ದಳು.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθὼν
  choice: ಬಂದಾಗ
  rationale: ಭೂತಕಾಲದ ಕೃದಂತದ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಬಂದು’ ಎಂಬುದಕ್ಕಿಂತ ಇಲ್ಲಿ ‘ಬಂದಾಗ’ ಸಂದರ್ಭವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: οἰκίαν Πέτρου
  choice: ಪೇತ್ರನ ಮನೆಗೆ
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; οἰκία ಎಂಬುದಕ್ಕೆ ‘ಮನೆ’ ಸಮೀಪವೂ ಸಾಮಾನ್ಯವೂ ಆದ ಪದ.
- source_word: πενθερὰν αὐτοῦ
  choice: ಪೇತ್ರನ ಅತ್ತೆ
  rationale: πενθερά ಎಂದರೆ ಅತ್ತೆ, ಅಂದರೆ ಹೆಂಡತಿಯ ತಾಯಿ. αὐτοῦ ಎಂಬ ಸರ್ವನಾಮವು ಪೇತ್ರನನ್ನು ಸೂಚಿಸುವುದರಿಂದ, ಕನ್ನಡದಲ್ಲಿ ಉಂಟಾಗಬಹುದಾದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ತಪ್ಪಿಸಲು ಹೆಸರನ್ನು ಪುನರಾವರ್ತಿಸಲಾಗಿದೆ.
- source_word: βεβλημένην
  choice: ಮಲಗಿದ್ದು
  rationale: ಈ ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ಕೃದಂತವು ಅನಾರೋಗ್ಯದ ಸಂದರ್ಭದಲ್ಲಿ ಮಲಗಿಸಲ್ಪಟ್ಟ ಅಥವಾ ಮಲಗಿರುವ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮೂಲದಲ್ಲಿ ‘ಹಾಸಿಗೆಯಲ್ಲಿ’ ಎಂಬುದು ಸ್ಪಷ್ಟವಾಗಿ ಇಲ್ಲದ ಕಾರಣ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಿಲ್ಲ.
- source_word: πυρέσσουσαν
  choice: ಜ್ವರ ಬಂದಿರುವುದನ್ನು
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಮುಂದುವರಿದ ಜ್ವರದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ರೂಪವು ಆ ಸ್ಥಿತಿಯನ್ನು ಸರಳ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹೇಳುತ್ತದೆ; ‘ಬಳಲುತ್ತಿದ್ದಳು’ ಎಂಬ ಹೆಚ್ಚುವರಿ ಅನುಭವಾತ್ಮಕ ಒತ್ತನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: αὐτοῦ ಎಂಬುದರ ಸೂಚಿತ ವ್ಯಕ್ತಿ
  choice: ಈ ಸರ್ವನಾಮವು ಪೇತ್ರನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆಕೆ ಪೇತ್ರನ ಅತ್ತೆ.
  alternative: ಕನ್ನಡದಲ್ಲಿ ಕೇವಲ ‘ಅವನ ಅತ್ತೆ’ ಎಂದರೆ ಅದು ಯೇಸುವನ್ನು ಸೂಚಿಸುವಂತೆ ತಪ್ಪಾಗಿ ಗ್ರಹಿಸಬಹುದು.
  rationale: ವಾಕ್ಯರಚನೆ ಮತ್ತು ಸಂದರ್ಭ ಎರಡರ ಪ್ರಕಾರ ಮನೆಯೂ ಪೇತ್ರನದು, ಅತ್ತೆಯೂ ಪೇತ್ರನದು. ಪಠ್ಯವು ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ವೈವಾಹಿಕ ಅಥವಾ ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಣಯವನ್ನು ಅನುವಾದವು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಪೇತ್ರನ ಅತ್ತೆ’ ಎಂದು ಹೆಸರನ್ನು ಪುನರಾವರ್ತಿಸುವುದು ಕನ್ನಡದಲ್ಲಿ ಸರ್ವನಾಮದ ತಪ್ಪು ಗ್ರಹಿಕೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ. ಎರಡೂ ಕೃದಂತ ಸ್ಥಿತಿಗಳನ್ನು ಒಂದೇ ದೃಶ್ಯವಿವರಣೆಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
