id: MAT.8.11
reference: Matthew 8:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: kn
  text: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಅನೇಕರು ಪೂರ್ವ ಮತ್ತು ಪಶ್ಚಿಮ ದಿಕ್ಕುಗಳಿಂದ ಬಂದು, ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ ಅಬ್ರಹಾಮ, ಇಸಾಕ ಮತ್ತು ಯಾಕೋಬರೊಂದಿಗೆ ಔತಣದ ಮೇಜಿನ ಬಳಿ ಒರಗಿ ಕುಳಿತುಕೊಳ್ಳುವರು[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಹೆಚ್ಚು ಅಕ್ಷರಶಃ: ‘ಒರಗಿ ಕುಳಿತುಕೊಳ್ಳುವರು.’ ಈ ಅಭಿವ್ಯಕ್ತಿ ಪ್ರಾಚೀನ ಔತಣದಲ್ಲಿ ಮೇಜಿನ ಬಳಿಯಲ್ಲಿ ಒರಗಿ ಊಟಕ್ಕೆ ತಮ್ಮ ಸ್ಥಾನವನ್ನು ತೆಗೆದುಕೊಳ್ಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.'
    reason: cultural_note
  - marker: b
    text: ‘ಪೂರ್ವ ಮತ್ತು ಪಶ್ಚಿಮ ದಿಕ್ಕುಗಳಿಂದ’ ಎಂಬುದು ದೂರದ ಪ್ರದೇಶಗಳಿಂದ, ಇಸ್ರಾಯೇಲಿನ ಹೊರಗಿನಿಂದಲೂ ಜನರು ಬರುವುದನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆಯಿದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δέ ಹಿಂದಿನ ಮಾತಿನೊಂದಿಗೆ ಸೌಮ್ಯವಾದ ವ್ಯತ್ಯಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಕನ್ನಡ ರೂಪವು ಮಾತಿನ ತಿರುವನ್ನು ಸಹಜವಾಗಿಯೂ ಗೌರವಪೂರ್ಣವಾಗಿಯೂ ಉಳಿಸುತ್ತದೆ.
- source_word: πολλοὶ
  choice: ಅನೇಕರು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವಿಶೇಷಣವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಅನೇಕರು’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: ಪೂರ್ವದಿಂದಲೂ ಪಶ್ಚಿಮದಿಂದಲೂ
  rationale: ಬಹುವಚನ ಗ್ರೀಕ್ ರೂಪಗಳು ದಿಕ್ಕುಗಳು ಅಥವಾ ವಿಶಾಲ ಪ್ರದೇಶಗಳನ್ನು ಸೂಚಿಸುವ ನುಡಿಗಟ್ಟು; ಕನ್ನಡದಲ್ಲಿ ಈ ಜೋಡಿ ರೂಪವು ಭೌಗೋಳಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἥξουσιν
  choice: ಬಂದು
  rationale: ಮುಂದಿನ ಭವಿಷ್ಯಕಾಲದ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸೇರಿಸಿ ‘ಬಂದು ... ಒರಗಿಕೊಳ್ಳುವರು’ ಎಂಬ ಕನ್ನಡ ವಾಕ್ಯರಚನೆ ‘ಬರುವರು ಮತ್ತು...’ಗಿಂತ ಹೆಚ್ಚು ಸಹಜವಾಗಿದೆ; ಭವಿಷ್ಯಾರ್ಥ ಉಳಿದಿದೆ.
- source_word: ἀνακλιθήσονται
  choice: ಔತಣಕ್ಕೆ ಒರಗಿಕೊಳ್ಳುವರು
  rationale: ಪ್ರಾಚೀನ ಕಾಲದಲ್ಲಿ ಊಟದ ಮೇಜಿನ ಬಳಿಯಲ್ಲಿ ಒರಗಿ ಭೋಜನ ಮಾಡುವ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲು ‘ಒರಗಿಕೊಳ್ಳುವರು’ ಬಳಸಲಾಗಿದೆ; ‘ಔತಣಕ್ಕೆ’ ಎಂಬುದು ಊಟದ ಸಂದರ್ಭವನ್ನು ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: ಅಬ್ರಹಾಮ, ಇಸಾಕ ಮತ್ತು ಯಾಕೋಬರೊಂದಿಗೆ
  rationale: μετά ಸಹವಾಸವನ್ನು, ಇಲ್ಲಿ ಔತಣದ ಮೇಜಿನ ಸಹವಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಹೆಸರುಗಳನ್ನು ರೂಢಿಯಾದ ಕನ್ನಡ ರೂಪಗಳಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಬಂಧಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಾಪಿತವೂ ಸಹಜವೂ ಆದ ಸಮಾನಾರ್ಥಕ ರೂಪ; ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಅಸಹಜವಾಗಿ ನಕಲಿಸದೆ ಏಕವಚನ ರಾಜ್ಯಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಔತಣದ ಚಿತ್ರಣ ಮತ್ತು ಅಂತ್ಯಕಾಲದ ಸಹವಾಸ
  choice: ‘ಔತಣಕ್ಕೆ ಒರಗಿಕೊಳ್ಳುವರು’ ಎಂದು ಭೋಜನದ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಅಬ್ರಹಾಮ, ಇಸಾಕ ಮತ್ತು ಯಾಕೋಬರೊಂದಿಗೆ ಕುಳಿತುಕೊಳ್ಳುವರು’
  rationale: ಕ್ರಿಯಾಪದವು ಕೇವಲ ಒಂದೇ ಸ್ಥಳದಲ್ಲಿ ಇರುವುದನ್ನಲ್ಲ, ಭೋಜನದಲ್ಲಿ ಪಾಲ್ಗೊಳ್ಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಅನಗತ್ಯ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಆ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ಪೂರ್ವ ಮತ್ತು ಪಶ್ಚಿಮದಿಂದ ಬರುವ ‘ಅನೇಕರ’ ವ್ಯಾಪ್ತಿ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಜನಾಂಗವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಭೌಗೋಳಿಕ ಪದಗಳನ್ನು ಮಾತ್ರ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಅನೇಕ ಅನ್ಯಜನರು ಪೂರ್ವದಿಂದಲೂ ಪಶ್ಚಿಮದಿಂದಲೂ ಬರುವರು’
  rationale: ಸಂದರ್ಭವು ಇಸ್ರಾಯೇಲಿನ ಹೊರಗಿನವರನ್ನೂ ಒಳಗೊಳ್ಳುವುದನ್ನು ಬಲವಾಗಿ ಸೂಚಿಸಬಹುದು; ಆದರೂ ಗ್ರೀಕ್ ಪಠ್ಯವು ‘ಅನ್ಯಜನರು’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಸೂಚ್ಯಾರ್ಥವನ್ನು ಪಠ್ಯದಲ್ಲೇ ನಿರ್ಣಾಯಕವಾಗಿ ವಿಸ್ತರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಒರಗಿಕೊಳ್ಳುವರು’ ಎಂಬ ಸಾಂಸ್ಕೃತಿಕವಾಗಿ ಅಪರಿಚಿತವಾಗಬಹುದಾದ ಚಿತ್ರಣವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಅಡಿಕುರಿಪಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ. ‘ಅನ್ಯಜನರು’ ಎಂಬ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಪದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಿಲ್ಲ.
