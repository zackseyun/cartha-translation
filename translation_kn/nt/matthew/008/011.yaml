    issue: Unnatural or potentially unclear banquet phrasing
    rationale: ‘ಔತಣಕ್ಕೆ ಒರಗಿಕೊಳ್ಳುವರು’ can sound as though one leans toward a banquet rather than reclines in a dining setting. Adding ‘ಔತಣದ ಮೇಜಿನ ಬಳಿ’ makes the cultural image explicit without adding interpretive content.
  - severity: low
    issue: Directional idiom can be smoother
    rationale: ‘ಪೂರ್ವ ಮತ್ತು ಪಶ್ಚಿಮ ದಿಕ್ಕುಗಳಿಂದ’ naturally conveys the source’s idiomatic plurals for eastern and western regions.
