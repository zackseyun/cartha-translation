id: MAT.8.10
reference: Matthew 8:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: kn
  text: 'ಯೇಸು ಇದನ್ನು ಕೇಳಿ ಆಶ್ಚರ್ಯಪಟ್ಟರು. ತಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸುತ್ತಿದ್ದವರಿಗೆ, “ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ ಯಾರಲ್ಲಿಯೂ ಇಂಥ ನಂಬಿಕೆಯನ್ನು ನಾನು ಕಂಡಿಲ್ಲ[a],” ಎಂದರು.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ ಇಂಥ ನಂಬಿಕೆಯುಳ್ಳ ಯಾರನ್ನೂ ನಾನು ಕಂಡಿಲ್ಲ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ಇದನ್ನು ಕೇಳಿ
  rationale: Aorist participle ಮುಖ್ಯ ಕ್ರಿಯೆಯ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಶತಾಧಿಪತಿ ಹೇಳಿದ ಮಾತುಗಳನ್ನು ‘ಇದನ್ನು’ ಎಂಬುದು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐθαύμασεν
  choice: ಆಶ್ಚರ್ಯಪಟ್ಟರು
  rationale: ಯೇಸುವಿನ ಪ್ರತಿಕ್ರಿಯೆಯ ಬಲವನ್ನು ಉಳಿಸುವ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ನಿರೂಪಣೆ.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: ತಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸುತ್ತಿದ್ದವರಿಗೆ
  rationale: ಆ ಕ್ಷಣದಲ್ಲಿ ಯೇಸುವಿನ ಹಿಂದೆ ಬರುತ್ತಿದ್ದವರನ್ನು present participle ಸೂಚಿಸುತ್ತದೆ; ಸಂಸ್ಥಾತ್ಮಕ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಬರುವ ಗಂಭೀರ ಮತ್ತು ಒತ್ತಿಹೇಳುವ ಸೂತ್ರವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: παρ’ οὐδενὶ
  choice: ಯಾರಲ್ಲಿಯೂ
  rationale: παρά + dative ಇಲ್ಲಿ ‘ಯಾರೊಬ್ಬರಲ್ಲಿಯೂ/ಯಾರ ವಿಷಯದಲ್ಲಿಯೂ’ ಎಂಬ ಸಂಬಂಧಾರ್ಥ ನೀಡುತ್ತದೆ.
- source_word: τοσαύτην πίστιν
  choice: ಇಂಥ ನಂಬಿಕೆಯನ್ನು
  rationale: τοσαύτην ನಂಬಿಕೆಯ ವಿಶಿಷ್ಟ ಪ್ರಮಾಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಇಂಥ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ
  rationale: ಜನಸಮುದಾಯ ಹಾಗೂ ಅದರ ಒಡಂಬಡಿಕೆಯ ವಲಯವನ್ನು ಒಳಗೊಂಡ locative/corporate ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: εὗρον
  choice: ನಾನು ಕಂಡಿಲ್ಲ
  rationale: Greek aorist ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಪೂರ್ಣ ಕ್ರಿಯಾರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; οὐδενί ಜೊತೆಗಿನ ನಿರಾಕರಣೆಯನ್ನು ಕ್ರಿಯಾಪದದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: πίστις ಪದದ ಅನುವಾದ
  choice: ನಂಬಿಕೆ
  alternative: ಭರವಸೆ / ನಂಬಿಗಸ್ತಿಕೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಶತಾಧಿಪತಿಯು ಯೇಸುವಿನ ಅಧಿಕಾರದ ಮೇಲೆ ಇಟ್ಟ ವಿಶ್ವಾಸವೇ ಮುಖ್ಯ; ‘ನಂಬಿಕೆ’ ಇದನ್ನು ಧಾರ್ಮಿಕ ಹಾಗೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ, ‘ನಂಬಿಗಸ್ತಿಕೆ’ ಎಂಬ ಗುಣಾರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಮುಂದಿರಿಸುವುದಿಲ್ಲ.
- issue: παρ’ οὐδενὶ ... εὗρον ಎಂಬ ವಾಕ್ಯರಚನೆ
  choice: ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ ಯಾರಲ್ಲಿಯೂ ಇಂಥ ನಂಬಿಕೆಯನ್ನು ನಾನು ಕಂಡಿಲ್ಲ
  alternative: ಇಸ್ರಾಯೇಲಿನಲ್ಲಿ ಇಂಥ ನಂಬಿಕೆಯುಳ್ಳ ಯಾರನ್ನೂ ನಾನು ಕಂಡಿಲ್ಲ
  rationale: ಮುಖ್ಯ ಪಾಠವು Greek ಪದಕ್ರಮ ಮತ್ತು ‘ಯಾರಲ್ಲಿಯೂ’ ಎಂಬ ಸಂಬಂಧಾರ್ಥವನ್ನು ಹತ್ತಿರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ವ್ಯಕ್ತಿಯನ್ನು ಕಂಡಿಲ್ಲ ಎಂಬ ಪರ್ಯಾಯವೂ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಸಾಧ್ಯವಾದ್ದರಿಂದ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಗೌರವ ಸೂಚಕ ಬಹುವಚನದಲ್ಲಿ ಯೇಸುವನ್ನು ಉಲ್ಲೇಖಿಸಲಾಗಿದೆ. ವಾಕ್ಯವು ಘನತೆಯುತವಾಗಿದ್ದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ರೂಪಿಸಲಾಗಿದೆ. English consultation layerನ ಮೊದಲ footnote ಮೂಲಪಾಠದ ಈ ವಾಕ್ಯದ ಸ್ಥಾನ/ವಿಷಯಕ್ಕೆ ಹೊಂದದಂತೆ ಕಾಣುವುದರಿಂದ ಅದನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ಅನುಸರಿಸದೆ, Greek ವಾಕ್ಯರಚನೆಯ ನಿಜವಾದ ಪರ್ಯಾಯವನ್ನು ಮಾತ್ರ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
