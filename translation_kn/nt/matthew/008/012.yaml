id: MAT.8.12
reference: Matthew 8:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: kn
  text: ಆದರೆ ರಾಜ್ಯದ ಪುತ್ರರು[a] ಹೊರಗಿನ ಕತ್ತಲೆಗೆ ಎಸೆಯಲ್ಪಡುವರು. ಅಲ್ಲಿ ಅಳುವಿಕೆಯೂ ಹಲ್ಲು ಕಡಿಯುವಿಕೆಯೂ ಆಗುವುದು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ರಾಜ್ಯದ ಪುತ್ರರು’ ಎಂಬುದು ರಾಜ್ಯಕ್ಕೆ ಸೇರಿದವರು ಅಥವಾ ಅದರ ಸಹಜ ಹಕ್ಕುದಾರರು ಎಂದು ಎಣಿಸಲ್ಪಟ್ಟವರನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τῆς βασιλείας
  choice: ರಾಜ್ಯದ ಪುತ್ರರು
  rationale: ಗ್ರೀಕ್‌ನ ‘ರಾಜ್ಯದ ಪುತ್ರರು’ ಎಂಬ ಸಂಬಂಧಸೂಚಕ ನುಡಿಗಟ್ಟನ್ನು ಉಳಿಸಿ, ರಾಜ್ಯಕ್ಕೆ ಸಹಜವಾಗಿ ಸೇರಿದವರು ಅಥವಾ ಅದರ ಹಕ್ಕುದಾರರು ಎಂದು ಭಾವಿಸಲ್ಪಟ್ಟವರೇ ಹೊರಹಾಕಲ್ಪಡುವ ವ್ಯಂಗ್ಯಾತ್ಮಕ ತೀವ್ರತೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἐκβληθήσονται
  choice: ಎಸೆಯಲ್ಪಡುವರು
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನೂ ಬಲವಂತದ ಹೊರದಬ್ಬುವಿಕೆಯ ತೀವ್ರತೆಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: ಹೊರಗಿನ ಕತ್ತಲೆ
  rationale: ಮತ್ತಾಯನಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣವನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸದೆ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κλαυθμός
  choice: ಅಳುವಿಕೆ
  rationale: ದುಃಖ ಮತ್ತು ಶೋಕವನ್ನು ಸೂಚಿಸುವ ಸರಳ, ಗೌರವಯುತ ಕನ್ನಡ ಪದ.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ಹಲ್ಲು ಕಡಿಯುವುದು
  rationale: ಗ್ರೀಕ್‌ನ ಸ್ಥಿರ ಅಭಿವ್ಯಕ್ತಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಅರ್ಥವಾಗುವ ಸಮಾನ ರೂಪ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿರುವ ಪೂರ್ವ ಮತ್ತು ಪಶ್ಚಿಮದಿಂದ ಬರುವವರಿಗೂ ಈ ವಾಕ್ಯದ ಹೊರಹಾಕಲ್ಪಡುವವರಿಗೂ ಇರುವ ವಿರೋಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐκεῖ
  choice: ಅಲ್ಲಿ
  rationale: ನ್ಯಾಯತೀರ್ಪಿನ ಸ್ಥಳದ ಮೇಲಿರುವ ಗ್ರೀಕ್ ಒತ್ತನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ನ್ಯಾಯತೀರ್ಪು ಮತ್ತು ಹೊರಗಿಡುವಿಕೆಯ ಚಿತ್ರಣ
  choice: ‘ಹೊರಗಿನ ಕತ್ತಲೆ’, ‘ಅಳುವಿಕೆ’ ಮತ್ತು ‘ಹಲ್ಲು ಕಡಿಯುವುದು’ ಎಂಬ ಮೂಲ ಚಿತ್ರಣವನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನರಕ’ ಅಥವಾ ‘ನಿತ್ಯ ಶಿಕ್ಷೆ’ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ವಚನವು ಕಠಿಣ ಅಂತ್ಯಕಾಲದ ಹೊರಗಿಡುವಿಕೆ ಮತ್ತು ಯಾತನೆಯನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ; ಆದರೆ ಇಲ್ಲಿ ಗ್ರೀಕ್ ಪಠ್ಯವು ನಿರ್ದಿಷ್ಟ ವ್ಯವಸ್ಥಿತ ಸಿದ್ಧಾಂತಪದದ ಬದಲು ರೂಪಕಾತ್ಮಕ ನ್ಯಾಯತೀರ್ಪಿನ ಭಾಷೆಯನ್ನು ಬಳಸುತ್ತದೆ.
- issue: υἱοὶ ಎಂಬ ಪುಲ್ಲಿಂಗ ರೂಪ ಮತ್ತು ಅದರ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಪುತ್ರರು’ ಎಂದು ಉಳಿಸಿ, ನುಡಿಗಟ್ಟಿನ ವ್ಯಾಪಕ ಸಂಬಂಧಾರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
  alternative: ‘ಮಕ್ಕಳು’, ‘ಹಕ್ಕುದಾರರು’ ಅಥವಾ ‘ರಾಜ್ಯಕ್ಕೆ ಸೇರಿದವರು’.
  rationale: ‘ಪುತ್ರರು’ ಮೂಲದ ಪುಲ್ಲಿಂಗ ರೂಪವನ್ನೂ ನುಡಿಗಟ್ಟಿನ ಒತ್ತನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಅಡಿಕುರಿಪು ಇದನ್ನು ಕೇವಲ ಜೈವಿಕ ಪುತ್ರತ್ವವೆಂದು ತಪ್ಪಾಗಿ ಸೀಮಿತಗೊಳಿಸದಂತೆ ನೆರವಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಹಾಗೂ ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ತೀವ್ರ ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣವನ್ನು ಮೃದುಗೊಳಿಸದೆ, ಅದಕ್ಕೆ ಮೀರಿದ ಪಂಥೀಯ ವಿವರಣೆಯನ್ನೂ ಸೇರಿಸಿಲ್ಲ.
