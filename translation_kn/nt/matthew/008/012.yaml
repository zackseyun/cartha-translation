  terminology: ‘ರಾಜ್ಯದ ಪುತ್ರರು’ appropriately preserves the masculine Greek idiom, with a helpful explanatory footnote. ‘ಎಸೆಯಲ್ಪಡುವರು’ retains the forceful passive sense of ἐκβληθήσονται. ‘ಹಲ್ಲು ಕಡಿಯುವಿಕೆ’ is an established Kannada biblical expression for βρυγμὸς τῶν ὀδόντων.
