id: MAT.8.19
reference: Matthew 8:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: kn
  text: ಒಬ್ಬ ಶಾಸ್ತ್ರಿಯು ಅವರ ಬಳಿಗೆ ಬಂದು ಅವನಿಗೆ, “ಶಿಕ್ಷಕರೇ, ನೀವು ಎಲ್ಲಿಗೆ ಹೋದರೂ ನಾನು ನಿಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸುವೆನು” ಎಂದು ಹೇಳಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನೀವು ಎಲ್ಲಿಗೆ ಹೊರಟುಹೋದರೂ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾಗಿ ‘ಹೊರಟುಹೋಗು’ ಅಥವಾ ‘ನಿರ್ಗಮಿಸು’ ಎಂದೂ ಅರ್ಥಕೊಡಬಹುದು; ಆದರೆ ಇಲ್ಲಿ ‘ಹೋಗು’ ಎಂಬುದೇ ಸಹಜವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ಅವರ ಬಳಿಗೆ ಬಂದು
  rationale: ಯೇಸುವಿನ ಕಡೆಗೆ ಸಮೀಪಿಸಿ ನಂತರ ಮಾತಾಡಿದ ಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἷς
  choice: ಒಬ್ಬ
  rationale: ವ್ಯಕ್ತಿಯೊಬ್ಬನನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಸಂಖ್ಯಾವಾಚಕದ ಸಹಜ ಕನ್ನಡ ರೂಪ; ಅದನ್ನು ಕೈಬಿಡದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: γραμματεὺς
  choice: ಶಾಸ್ತ್ರಿ
  rationale: ಸುವಾರ್ತೆಗಳ ಯೆಹೂದ್ಯ ಸನ್ನಿವೇಶದಲ್ಲಿ ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರತಿಲಿಪಿ ಮತ್ತು ವ್ಯಾಖ್ಯಾನದಲ್ಲಿ ಪರಿಣತನಾದ ವರ್ಗಕ್ಕೆ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಸಂಕ್ಷಿಪ್ತ ಪದ.
- source_word: Διδάσκαλε
  choice: ಬೋಧಕರೇ
  rationale: ನೇರ ಸಂಬೋಧನೆಯನ್ನು ಗೌರವಪೂರ್ಣವಾಗಿ ಉಳಿಸಿ, ‘ಗುರುವೇ’ ಎಂಬ ಪದಕ್ಕೆ ಸೇರಬಹುದಾದ ವಿಶಾಲ ಧಾರ್ಮಿಕ ಅಥವಾ ಶಿಷ್ಯಪರಂಪರೆಯ ಅರ್ಥಗಳನ್ನು ಅನಿವಾರ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἀκολουθήσω
  choice: ನಾನು ನಿಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸುವೆನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ದೃಢ ಉದ್ದೇಶವನ್ನೂ, ದೈಹಿಕವಾಗಿ ಹಿಂದೆ ಹೋಗುವುದು ಮತ್ತು ಶಿಷ್ಯನಾಗುವುದು ಎಂಬ ಎರಡೂ ಸಾಧ್ಯ ಅರ್ಥಛಾಯೆಗಳನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὅπου ἐὰν
  choice: ಎಲ್ಲಿಗೆ ... ಆದರೂ
  rationale: ಅನಿರ್ದಿಷ್ಟ ಮತ್ತು ಮುಕ್ತ ವ್ಯಾಪ್ತಿಯ ‘wherever’ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἀπέρχῃ
  choice: ನೀವು ... ಹೋದರೂ
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಚಲನೆ ಅಥವಾ ಗಮ್ಯಸ್ಥಾನವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಮೂಲ ಕ್ರಿಯಾಪದದ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ‘ಹೊರಟುಹೋಗು’ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿಗೆ διδάσκαλος ಎಂಬ ಸಂಬೋಧನೆಯ ಅನುವಾದ
  choice: ಬೋಧಕರೇ
  alternative: ಗುರುವೇ
  rationale: ಮೂಲ ಪದದ ‘ಬೋಧಿಸುವವನು/ಶಿಕ್ಷಕ’ ಎಂಬ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ನೀಡುತ್ತದೆ; ಪದ್ಯದಲ್ಲೇ ಸ್ಪಷ್ಟವಿಲ್ಲದ ಹೆಚ್ಚು ಉನ್ನತ ಅಧಿಕಾರ ಅಥವಾ ನಿರ್ದಿಷ್ಟ ಧಾರ್ಮಿಕ ಬಿರುದನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ನಿರೂಪಣೆ. ಯೇಸುವಿಗೆ ಬಹುವಚನ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮವನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಶಾಸ್ತ್ರಿ’ ಎಂಬ ಸಾಂಪ್ರದಾಯಿಕ ಪದವನ್ನು ಅದರ ಸುವಾರ್ತಾ-ಸನ್ನಿವೇಶದ ಗುರುತನ್ನು ಉಳಿಸಲು ಬಳಸಲಾಗಿದೆ; ‘ಹಿಂಬಾಲಿಸುವೆನು’ ದೈಹಿಕ ಅನುಸರಣೆ ಮತ್ತು ಶಿಷ್ಯತ್ವದ ಅರ್ಥಛಾಯೆ ಎರಡನ್ನೂ ತೆರೆದಿಡುತ್ತದೆ.
