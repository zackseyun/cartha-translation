id: MAT.8.4
reference: Matthew 8:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: kn
  text: ಯೇಸು ಅವನಿಗೆ, “ಯಾರಿಗೂ ಹೇಳದಂತೆ ನೋಡಿಕೋ. ಬದಲಾಗಿ, ಹೋಗಿ ಯಾಜಕನಿಗೆ ನಿನ್ನನ್ನು ತೋರಿಸು; ಮೋಶೆಯು ಆಜ್ಞಾಪಿಸಿದ[b] ಕಾಣಿಕೆಯನ್ನು ಅವರಿಗೆ ಸಾಕ್ಷಿಯಾಗಿ[a] ಅರ್ಪಿಸು” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅವರಿಗೆ ಸಾಕ್ಷಿಗಾಗಿ.” ಈ ಪದಬಂಧವು ಯಾಜಕರ ಮುಂದೆ ಸಲ್ಲಿಸಲಾದ ಪುರಾವೆಯನ್ನು ಸೂಚಿಸಬಹುದು; ನಂಬದವರ ವಿರುದ್ಧದ ಪರೋಕ್ಷ ಸಾಕ್ಷಿ ಎಂದೂ ಕೆಲವರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ.
    reason: alternative_reading
  - marker: b
    text: ಈ ಆಜ್ಞೆಯು ಕುಷ್ಠರೋಗದಿಂದ ಶುದ್ಧನಾದ ವ್ಯಕ್ತಿಗಾಗಿ ಮೋಶೆಯ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ನೀಡಿದ ಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಯಾಜಕಕಾಂಡ 14 ನೋಡಿ.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: ನೋಡು, ಯಾರಿಗೂ ಹೇಳಬೇಡ
  rationale: Ὅρα ಇಲ್ಲಿ ಎಚ್ಚರಿಕೆಯ ಆದೇಶವಾಗಿ ಬಳಕೆಯಾಗಿದೆ; ‘ನೋಡು’ ಎಂಬುದು ಅದರ ರೂಪವನ್ನು ಉಳಿಸಿದರೆ, ‘ಯಾರಿಗೂ ಹೇಳಬೇಡ’ ಎಂಬುದು ಗ್ರೀಕ್ ನಿಷೇಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὕπαγε
  choice: ಹೋಗಿ
  rationale: ಚಲನೆಯ ಸರಳ ಆಜ್ಞೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: ನಿನ್ನನ್ನು ಯಾಜಕನಿಗೆ ತೋರಿಸು
  rationale: ಪ್ರತಿಫಲಕ ರಚನೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ಶುದ್ಧನಾದ ವ್ಯಕ್ತಿಯ ಯಾಜಕೀಯ ಪರಿಶೀಲನೆಯ ಹಿನ್ನೆಲೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: προσένεγκον τὸ δῶρον
  choice: ಕಾಣಿಕೆಯನ್ನು ಅರ್ಪಿಸು
  rationale: προσφέρω ಯಜ್ಞಾರಾಧನೆಯ ಸಂದರ್ಭದಲ್ಲಿ ಅರ್ಪಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; δῶρον ಅನ್ನು ‘ಕಾಣಿಕೆ’ ಎಂದು ನೀಡುವುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಆರಾಧನಾ ಸಂದರ್ಭಕ್ಕೆ ಸೂಕ್ತವಾಗಿಯೂ ಇದೆ.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: ಮೋಶೆ ಆಜ್ಞಾಪಿಸಿದ
  rationale: ಪ್ರಸ್ತುತವಾದ ಮೋಶೆಯ ವಿಧಿಯನ್ನು ಸರಳವಾಗಿ ಮತ್ತು ಅಧಿಕಾರದ ಭಾವವನ್ನು ಉಳಿಸಿಕೊಂಡು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ಅದು ಅವರಿಗೆ ಸಾಕ್ಷಿಯಾಗಲಿ
  rationale: ಉದ್ದೇಶ ಅಥವಾ ಫಲದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; αὐτοῖς ಯಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ ಮತ್ತು ಸಾಕ್ಷಿಯ ಸ್ವರೂಪ ಏನು ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ಗ್ರೀಕ್‌ನ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: ಯೇಸು ಅವನಿಗೆ … ಎಂದು ಹೇಳಿದರು
  rationale: ಗ್ರೀಕ್ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಯಲ್ಲಿ ಭೂತಕಾಲವಾಗಿ ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς ಎಂಬ ಪದಬಂಧದ ಉಲ್ಲೇಖ ಮತ್ತು ಸ್ವರೂಪ
  choice: ‘ಅದು ಅವರಿಗೆ ಸಾಕ್ಷಿಯಾಗಲಿ’ ಎಂದು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಯಾಜಕರಿಗೆ ಪುರಾವೆಯಾಗಲಿ’ ಅಥವಾ ‘ಅವರಿಗೆ ವಿರುದ್ಧವಾದ ಸಾಕ್ಷಿಯಾಗಲಿ’
  rationale: αὐτοῖς ಎಂಬ ಸರ್ವನಾಮದ ಉಲ್ಲೇಖಿತರು ವಾಕ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟವಿಲ್ಲ; μαρτύριον ಅನುಕೂಲ ಸಾಕ್ಷಿಯನ್ನಾಗಲಿ ಪ್ರತಿಕೂಲ ಸಾಕ್ಷಿಯನ್ನಾಗಲಿ ಸ್ವತಃ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಠ್ಯವು ಬಿಡುವ theological tension ಅನ್ನು ಅನುವಾದವೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಯಾಜಕ’, ‘ಕಾಣಿಕೆ’, ‘ಅರ್ಪಿಸು’, ‘ಸಾಕ್ಷಿ’ ಎಂಬ ಪರಿಚಿತ ಧಾರ್ಮಿಕ ಪದಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಮೂಲ ಪಠ್ಯದ ಆಜ್ಞಾತ್ಮಕ ತೀವ್ರತೆಯನ್ನೂ ಅಂತಿಮ ಪದಬಂಧದ ಅಸ್ಪಷ್ಟತೆಯನ್ನೂ ಕಾಪಾಡಲಾಗಿದೆ.
