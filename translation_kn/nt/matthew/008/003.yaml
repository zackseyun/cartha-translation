review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the attendant action (ἐκτείνας τὴν χεῖρα), touch, Jesus’ willing response, cleansing imperative, immediacy, and the possessive phrase αὐτοῦ ἡ λέπρα. However, ‘ಕುಷ್ಠರೋಗವು ಶುದ್ಧವಾಯಿತು’ is not idiomatic Kannada for the removal of a disease and can suggest that the disease itself became pure.
  naturalness: ‘ಕೈಚಾಚಿ ಅವನನ್ನು ಮುಟ್ಟಿ’ and ‘ತಕ್ಷಣವೇ’ are natural modern standard Kannada. ‘ನನಗೆ ಮನಸ್ಸಿದೆ’ is understandable and suitably conveys willingness. Recasting the final result as the person being cleansed of the disease produces clear, natural Kannada while retaining the cleansing vocabulary.
  terminology: ‘ಶುದ್ಧನಾಗು’ appropriately preserves καθαρίσθητι’s cleansing/purity sense. ‘ಕುಷ್ಠರೋಗ’ is a conventional main-text equivalent for λέπρα, and the cultural footnote responsibly notes that it is broader than Hansen’s disease. ‘ಶುದ್ಧನಾದನು’ retains the καθαρίζω wordplay in a natural Kannada construction.
  issues:
  - severity: medium
    issue: The final clause says ‘ಅವನ ಕುಷ್ಠರೋಗವು ಶುದ್ಧವಾಯಿತು.’
    rationale: Although the Greek grammatically makes ‘his leprosy’ the subject, Kannada does not naturally describe a disease as becoming ‘clean.’ Saying that he was cleansed of his leprosy retains the Greek cleansing concept and supplies an idiomatic target-language expression without adding theological interpretation.
  - severity: low
    issue: Footnote a is anchored after the whole quotation rather than immediately after ‘ನನಗೆ ಮನಸ್ಸಿದೆ.’
    rationale: Moving the marker directly after the expression it explains improves anchor precision.
