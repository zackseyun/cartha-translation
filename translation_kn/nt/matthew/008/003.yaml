id: MAT.8.3
reference: Matthew 8:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: kn
  text: ಯೇಸು ಕೈಚಾಚಿ ಅವನನ್ನು ಮುಟ್ಟಿ, “ನನಗೆ ಮನಸ್ಸಿದೆ”[a]; “ಶುದ್ಧನಾಗು” ಎಂದನು. ತಕ್ಷಣವೇ ಅವನು ತನ್ನ ಕುಷ್ಠರೋಗದಿಂದ ಶುದ್ಧನಾದನು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ನನಗೆ ಮನಸ್ಸಿದೆ” ಎಂಬುದನ್ನು “ನಾನು ಬಯಸುತ್ತೇನೆ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಇಲ್ಲಿ “ಕುಷ್ಠರೋಗ” ಎಂದು ಅನುವಾದಿಸಿರುವ ಗ್ರೀಕ್ ಪದವು ಆಧುನಿಕ ಹ್ಯಾನ್ಸೆನ್ ರೋಗವನ್ನು ಮಾತ್ರವಲ್ಲದೆ ಹಲವು ಗಂಭೀರ ಚರ್ಮರೋಗಗಳನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: ಕೈಚಾಚಿ
  rationale: ಮುಂದಾಗಿ ನಡೆದ ಸ್ಪಷ್ಟ ದೈಹಿಕ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἥψατο αὐτοῦ
  choice: ಅವನನ್ನು ಮುಟ್ಟಿ
  rationale: ἅπτομαι ಎಂಬ ಮಧ್ಯರೂಪದ ಸಂದರ್ಭೋಚಿತ ಸಾಮಾನ್ಯ ಅರ್ಥವಾದ ‘ಮುಟ್ಟು’ ಎಂಬುದನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Θέλω
  choice: ನನಗೆ ಮನಸ್ಸಿದೆ
  rationale: ಹಿಂದಿನ ಬೇಡಿಕೆಯಲ್ಲಿ ಕೇಳಲಾದ ಯೇಸುವಿನ ಸಮ್ಮತಿ ಅಥವಾ ಇಚ್ಛೆಗೆ ಉತ್ತರವಾಗಿ, ಭವಿಷ್ಯಕಾಲದ ಅರ್ಥವನ್ನು ಸೇರಿಸದೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಇಚ್ಛೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: καθαρίσθητι
  choice: ಶುದ್ಧನಾಗು
  rationale: ದೈಹಿಕ ಗುಣಮುಖತೆ ಮತ್ತು ಧಾರ್ಮಿಕ ಶುದ್ಧತೆ—ಎರಡನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲ ಶುದ್ಧತೆಯ ಭಾಷೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: εὐθέως
  choice: ತಕ್ಷಣವೇ
  rationale: ಫಲಿತಾಂಶವು ಕೂಡಲೇ ಉಂಟಾದುದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುವ ಸಹಜ ಸಮಾನಾರ್ಥಕ.
- source_word: ἐκαθαρίσθη
  choice: ಶುದ್ಧವಾಯಿತು
  rationale: ಆಜ್ಞೆಯಲ್ಲಿರುವ καθαρίζω ಪದದೊಂದಿಗೆ ಪದಾರ್ಥದ ಏಕರೂಪತೆಯನ್ನು ಕಾಯ್ದುಕೊಂಡು, ಕೇವಲ ‘ಗುಣವಾಯಿತು’ ಎಂದು ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἡ λέπρα
  choice: ಅವನ ಕುಷ್ಠರೋಗವು
  rationale: αὐτοῦ ಸೂಚಿಸುವ ಸ್ವಾಮ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ, ಪರಿಚಿತವಾದ ಸಾಂಪ್ರದಾಯಿಕ ಪದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಅದರ ಪ್ರಾಚೀನ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: καθαρίζω ಪದದಲ್ಲಿರುವ ಶುದ್ಧತೆ ಮತ್ತು ಗುಣಪಡಿಸುವಿಕೆಯ ಸಂಬಂಧ
  choice: ಆಜ್ಞೆ ಮತ್ತು ಫಲಿತಾಂಶ ಎರಡರಲ್ಲೂ ‘ಶುದ್ಧ’ ಎಂಬ ಭಾಷೆಯನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಗುಣವಾಗು/ಗುಣವಾಯಿತು’ ಎಂದು ಅನುವಾದಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ದೈಹಿಕ ಗುಣಪಡಿಸುವಿಕೆಗೆ ಮಾತ್ರವಲ್ಲದೆ ಶುದ್ಧತೆಯ ಆಯಾಮಕ್ಕೂ ಒತ್ತು ನೀಡುತ್ತದೆ; ‘ಗುಣವಾಯಿತು’ ಮಾತ್ರ ಎಂದರೆ ಆ ಆಯಾಮ ಕುಗ್ಗುತ್ತದೆ.
- issue: Θέλω ಎಂಬುದರ ಅರ್ಥ
  choice: ನನಗೆ ಮನಸ್ಸಿದೆ
  alternative: ನಾನು ಬಯಸುತ್ತೇನೆ / ನಾನು ಮಾಡುವೆನು
  rationale: ಇದು ರೋಗಿಯ ಹಿಂದಿನ ಮನವಿಗೆ ಯೇಸು ನೀಡುವ ಇಚ್ಛಾಪೂರ್ವಕ ಸಮ್ಮತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನಾನು ಮಾಡುವೆನು’ ಎಂದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ಭವಿಷ್ಯಕಾಲದ ಛಾಯೆ ಮೂಡಬಹುದು.
- issue: ಕೊನೆಯ ವಾಕ್ಯದಲ್ಲಿ ವ್ಯಾಕರಣದ ಕರ್ತೃ
  choice: ಅವನ ಕುಷ್ಠರೋಗವು ಶುದ್ಧವಾಯಿತು
  alternative: ಅವನು ಕುಷ್ಠರೋಗದಿಂದ ಶುದ್ಧನಾದನು
  rationale: ಸ್ವಲ್ಪ ಅಪರೂಪದ ಕನ್ನಡ ರಚನೆಯಾದರೂ, ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ‘ಕುಷ್ಠರೋಗ’ವೇ ಕರ್ತೃ ಎಂಬ ರೂಪವನ್ನೂ ಶುದ್ಧತೆಯ ಭಾಷೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ನಿರೂಪಣೆ. ‘ಕೈಚಾಚಿ’, ‘ಮುಟ್ಟಿ’ ಎಂಬ ಸಹಜ ಕ್ರಿಯಾಪದಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಶುದ್ಧನಾಗು/ಶುದ್ಧವಾಯಿತು’ ಎಂಬ ಪದಜೋಡಿ ಮೂಲದ ಶುದ್ಧತೆಯ ಅರ್ಥವನ್ನು ಮತ್ತು ಪದಸಾಮ್ಯವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪ್ರಾಚೀನ ರೋಗಪದದ ವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಟಿಪ್ಪಣಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
