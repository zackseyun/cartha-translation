id: MAT.8.23
reference: Matthew 8:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: kn
  text: ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತಿದಾಗ[a], ಅವರ ಶಿಷ್ಯರು ಅವರನ್ನು ಹಿಂಬಾಲಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತುತ್ತಿದ್ದಾಗ’ ಅಥವಾ ಹೆಚ್ಚು ಔಪಚಾರಿಕವಾಗಿ ‘ಅವರು ದೋಣಿಯೊಳಗೆ ಪ್ರವೇಶಿಸಿದ ಬಳಿಕ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: ಹತ್ತಿದಾಗ
  rationale: ದೋಣಿಯೊಳಗೆ ಪ್ರವೇಶಿಸುವುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ದೋಣಿಯನ್ನು ಹತ್ತುವುದು’ ಎಂದು ಹೇಳಲಾಗುತ್ತದೆ. ಕಾಲಸೂಚಕ ‘-ಆಗ’ ರೂಪವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಏಒರಿಸ್ಟ್ ಕೃದಂತದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πλοῖον
  choice: ದೋಣಿಯನ್ನು
  rationale: ಗಲಿಲಾಯ ಸರೋವರದ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ದೋಣಿ’ ಸಹಜವಾದ ಪದ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಉಪಪದ ಇಲ್ಲದಿದ್ದರೂ ಕಥನದ ನಿರಂತರತೆಯಲ್ಲಿ ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಒಂದು’ ಎಂದು ಹೇಳದೆ ಬಳಸುವುದು ಸಹಜ; ವಿಭಕ್ತಿ ಕಾರಣದಿಂದ ‘ದೋಣಿಯನ್ನು’ ಬಂದಿದೆ.
- source_word: ἠκολούθησαν
  choice: ಹಿಂಬಾಲಿಸಿದರು
  rationale: ಈ ಪದವು ಇಲ್ಲಿ ದೈಹಿಕವಾಗಿ ಅವರ ಹಿಂದೆ ಹೋಗುವುದನ್ನು ಸೂಚಿಸುತ್ತಿದ್ದು, ಮತ್ತೊಂದೆಡೆ ಶಿಷ್ಯತ್ವದ ಸೂಕ್ಷ್ಮ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ. ‘ಜೊತೆಯಲ್ಲಿ ಹೋದರು’ ಎಂಬುದಕ್ಕಿಂತ ಮೂಲದ ἀκολουθέωಗೆ ಹೆಚ್ಚು ನಿಕಟವಾಗಿದೆ.
- source_word: μαθηταὶ
  choice: ಶಿಷ್ಯರು
  rationale: ಯೇಸುವಿನ ಅನುಯಾಯಿಗಳನ್ನು ಸೂಚಿಸುವ ಸುವಾರ್ತೆಗಳ ಸ್ಥಿರ ಹಾಗೂ ಸಹಜ ಕನ್ನಡ ಪದ ‘ಶಿಷ್ಯರು’.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: ಅವರು / ಅವರನ್ನು / ಅವರ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಮೂರೂ ಸರ್ವನಾಮಗಳು ಯೇಸುವನ್ನೇ ಸೂಚಿಸುತ್ತವೆ. ಗೌರವಸೂಚಕ ಏಕವಚನಾರ್ಥದ ಬಹುವಚನ ರೂಪಗಳು ಆಧುನಿಕ ಪ್ರಮಾಣ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ ಮತ್ತು ಗೌರವಯುತವಾಗಿವೆ.
theological_decisions:
- issue: ἀκολουθέω ಪದದಲ್ಲಿರುವ ಸಾಧ್ಯ ಶಿಷ್ಯತ್ವದ ಛಾಯೆ
  choice: ‘ಹಿಂಬಾಲಿಸಿದರು’ ಎಂದು ಅನುವಾದಿಸಿ, ದೈಹಿಕ ಚಲನೆ ಮತ್ತು ಶಿಷ್ಯತ್ವದ ಪ್ರತಿಧ್ವನಿ ಎರಡನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಅವರ ಜೊತೆಯಲ್ಲಿ ಹೋದರು’
  rationale: ವಚನದ ತಕ್ಷಣದ ಅರ್ಥ ದೋಣಿಗೆ ಅವರ ಹಿಂದೆ ಹೋಗುವುದಾಗಿದೆ; ಆದರೂ ಮತ್ತಾಯನಲ್ಲಿ ἀκολουθέω ಶಿಷ್ಯತ್ವದ ಅರ್ಥಛಾಯೆಯನ್ನು ಹೊಂದಿರಬಹುದು. ಅದನ್ನು ಸ್ಪಷ್ಟವಾದ ದೇವತಾತ್ವಿಕ ವಿವರಣೆಯಾಗಿ ವಿಸ್ತರಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮಗಳನ್ನು ಬಳಸಿದ್ದು, ವಾಕ್ಯವನ್ನು ಸರಳವಾಗಿಯೂ ಮೂಲದ ಕಾಲಸಂಬಂಧ ಮತ್ತು ಶಿಷ್ಯತ್ವದ ಅರ್ಥಛಾಯೆಯನ್ನು ಉಳಿಸುವಂತೆಯೂ ರೂಪಿಸಲಾಗಿದೆ.
