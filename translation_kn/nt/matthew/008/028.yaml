id: MAT.8.28
reference: Matthew 8:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: kn
  text: ಅವರು ಸರೋವರದ ಆಚೆಯ ದಡಕ್ಕೆ, ಗದರೇನರ ಸೀಮೆಗೆ[a] ಬಂದಾಗ, ಸಮಾಧಿಗಳೊಳಗಿಂದ ಹೊರಬರುತ್ತಿದ್ದ ದೆವ್ವ ಹಿಡಿದ ಇಬ್ಬರು ಮನುಷ್ಯರು ಅವರನ್ನು ಎದುರುಗೊಂಡರು. ಅವರು ಅಷ್ಟು ಉಗ್ರರಾಗಿದ್ದರು, ಆ ದಾರಿಯಲ್ಲಿ ಯಾರೂ ಹಾದುಹೋಗಲಾಗದಷ್ಟು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ “ಗದರೇನರ” ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ “ಗೆರ್ಗೆಸೇನರ” ಅಥವಾ “ಗೆರಸೇನರ” ಎಂದಿದೆ.
    reason: textual_variant
  - marker: b
    text: “ತೀರ ಅಪಾಯಕಾರಿಗಳಾಗಿದ್ದರು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: ಅವರು ... ಬಂದಾಗ
  rationale: ಕರ್ತೃ ಯೇಸುವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಗೌರವಸೂಚಕ ಏಕವಚನದ ಸಹಜ ಕನ್ನಡ ಕಾಲವಾಕ್ಯವು ಗ್ರೀಕ್ genitive absolute‌ನ ಕಾಲಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ πέραν
  choice: ಸರೋವರದ ಆಚೆಯ ದಡಕ್ಕೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಇದು ಸರೋವರದ ಎದುರು ದಡವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡ ಓದುಗರಿಗೆ ಉಲ್ಲೇಖ ಸ್ಪಷ್ಟವಾಗಲು ಸಂದರ್ಭಸಿದ್ಧವಾದ ‘ಸರೋವರದ’ ಅನ್ನು ಸೇರಿಸಲಾಗಿದೆ.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: ಗದರೇನರ ಸೀಮೆಗೆ
  rationale: χώρα ಎಂದರೆ ಪ್ರದೇಶ ಅಥವಾ ಸೀಮೆ; ಗ್ರೀಕ್ ಮುಖ್ಯಪಾಠದಲ್ಲಿರುವ ಸ್ಥಳನಾಮವನ್ನು ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: ὑπήντησαν αὐτῷ
  choice: ಅವರನ್ನು ಎದುರುಗೊಂಡರು
  rationale: ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಅಥವಾ ಮುಖಾಮುಖಿಯಾಗಿ ಎದುರಾಗುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δύο δαιμονιζόμενοι
  choice: ದೆವ್ವ ಹಿಡಿದ ಇಬ್ಬರು ಮನುಷ್ಯರು
  rationale: ದೈವಿಕವಲ್ಲದ ಆತ್ಮಿಕ ಶಕ್ತಿಯ ಅಧೀನದಲ್ಲಿರುವ ಸ್ಥಿತಿಯನ್ನು ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ; ಪುಲ್ಲಿಂಗ ಬಹುವಚನವನ್ನೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: ಸಮಾಧಿಗಳೊಳಗಿಂದ ಹೊರಗೆ ಬರುತ್ತಿದ್ದ
  rationale: μνημεῖον ಇಲ್ಲಿ ಶವವನ್ನು ಇಡುವ ಸಮಾಧಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಚಲನೆಯ ದಿಕ್ಕನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: χαλεποὶ λίαν
  choice: ಎಷ್ಟು ಉಗ್ರರಾಗಿದ್ದರೆಂದರೆ
  rationale: χαλεπός‌ನ ‘ಉಗ್ರ/ಭಯಂಕರ/ಅಪಾಯಕಾರಿ’ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಕೇವಲ ದೈಹಿಕ ಹಿಂಸೆಗೆ ಸೀಮಿತಗೊಳಿಸದೆ, λίαν ಮತ್ತು ಫಲವಾಕ್ಯದ ತೀವ್ರತೆಯನ್ನು ಸಹಜ ಕನ್ನಡ ರಚನೆಯಲ್ಲಿ ಕೊಡುತ್ತದೆ.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: ಆ ದಾರಿಯಲ್ಲಿ ಯಾರಿಗೂ ಹಾದುಹೋಗಲು ಸಾಧ್ಯವಾಗುತ್ತಿರಲಿಲ್ಲ
  rationale: ὥστε ಸೂಚಿಸುವ ಫಲವನ್ನು ಮತ್ತು ἰσχύωಯ ಸಾಮರ್ಥ್ಯಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ, διὰ τῆς ὁδοῦ ಅನ್ನು ಪ್ರಯಾಣದ ಮಾರ್ಗವಾಗಿ ಅನುವಾದಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದೈವಿಕವಲ್ಲದ ಆತ್ಮಿಕ ಅಧೀನತೆಯ ಭಾಷೆ
  choice: ದೆವ್ವ ಹಿಡಿದ
  alternative: ದೆವ್ವಗಳ ಅಧೀನದಲ್ಲಿದ್ದ
  rationale: δαιμονίζομαι ಎಂಬ ಪದವು ದೆವ್ವದ ಪ್ರಭಾವ ಅಥವಾ ಅಧೀನತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದೆವ್ವ ಹಿಡಿದ’ ಎಂಬುದು ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಾಪಿತವೂ ಸ್ಪಷ್ಟವೂ ಆಗಿದ್ದು, ಅದರ ಕಾರ್ಯವಿಧಾನದ ಕುರಿತು ಪಾಠಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ತಾಂತ್ರಿಕ ದಾವೆ ಮಾಡುವುದಿಲ್ಲ.
- issue: ಸ್ಥಳನಾಮದ ಪಾಠಾಂತರ
  choice: ಗದರೇನರು
  alternative: ಗೆರ್ಗೆಸೇನರು ಅಥವಾ ಗೆರಸೇನರು
  rationale: SBLGNT ಮುಖ್ಯಪಾಠದ Γαδαρηνῶν ಅನ್ನು ಮುಖ್ಯ ವಾಕ್ಯದಲ್ಲಿ ಅನುಸರಿಸಿ, ಪ್ರಮುಖ ಹಸ್ತಪ್ರತಿ ಪಾಠಾಂತರಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ, ಸರಳ ನಿರೂಪಣೆ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಏಕವಚನ ಬಳಸಲಾಗಿದೆ. ‘ಉಗ್ರ’ ಎಂಬ ಪದವು χαλεπός‌ನ ನಿಜವಾದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ವಾಕ್ಯವನ್ನು ಕೇವಲ ದೈಹಿಕ ಹಿಂಸೆಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ. ಎಲ್ಲಾ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
