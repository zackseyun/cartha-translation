id: MAT.8.29
reference: Matthew 8:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: kn
  text: ಇಗೋ, ಅವರು ಕೂಗಿ, “ದೇವರ ಮಗನೇ, ನಿನಗೂ ನಮಗೂ ಏನು ಸಂಬಂಧ?[a] ನಿಗದಿತ ಸಮಯಕ್ಕೆ ಮುಂಚೆಯೇ[b] ನಮಗೆ ಯಾತನೆ ಕೊಡಲು ನೀನು ಇಲ್ಲಿಗೆ ಬಂದೆಯಾ?” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೂಲಭಾಷೆಯಲ್ಲಿ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ, “ನಮಗೂ ನಿನಗೂ ಏನು?”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಸಮಯಕ್ಕೆ ಮುಂಚೆಯೇ.” ಗ್ರೀಕ್ ಪದವು ನಿಗದಿತ ಸಮಯವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: ಇಗೋ
  rationale: ἰδού ಎಂಬ ಗಮನ ಸೆಳೆಯುವ, ಘಟನೆಯ ಹಠಾತ್ ಸ್ವರೂಪವನ್ನು ಜೀವಂತಗೊಳಿಸುವ ಸೂಚಕವನ್ನು ಉಳಿಸುತ್ತದೆ; ವಾಕ್ಯಾರಂಭದ καί ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಎಂದು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸದೆ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἔκραξαν λέγοντες
  choice: ಕೂಗಿ … ಎಂದು ಕೇಳಿದರು
  rationale: κράζω ಸೂಚಿಸುವ ಗಟ್ಟಿಯಾದ ಕೂಗನ್ನು ‘ಕೂಗಿ’ ಉಳಿಸುತ್ತದೆ. λέγοντες ಮತ್ತು ಪ್ರಶ್ನಾರ್ಥಕ ಮಾತನ್ನು ಕನ್ನಡದ ಸಹಜ ನೇರೋಕ್ತಿ ರಚನೆಯಾದ ‘… ಎಂದು ಕೇಳಿದರು’ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: Τί ἡμῖν καὶ σοί
  choice: ನಿನಗೂ ನಮಗೂ ಏನು ಸಂಬಂಧ?
  rationale: ಈ ಗ್ರೀಕ್-ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟು ದೂರೀಕರಣ ಅಥವಾ ವಿರೋಧದ ಪ್ರಶ್ನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಅರ್ಥವಾಗುವಂತೆಯೂ ಅದನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: υἱὲ τοῦ θεοῦ
  choice: ದೇವರ ಮಗನೇ
  rationale: ಯೇಸುವನ್ನು ನೇರವಾಗಿ ಸಂಬೋಧಿಸುವ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಬಿರುದನ್ನು ವಿಸ್ತರಿಸದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ; ‘-ನೇ’ ಸಂಬೋಧನೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἦλθες ὧδε
  choice: ನೀನು ಇಲ್ಲಿಗೆ ಬಂದೆಯಾ?
  rationale: ἦλθες ಎಂಬ ಭೂತಕಾಲದ ಕ್ರಿಯೆ ಮತ್ತು ὧδε ಎಂಬ ಸ್ಥಳಸೂಚಕವನ್ನು ಸಹಜ ಕನ್ನಡ ಪ್ರಶ್ನಾರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: πρὸ καιροῦ
  choice: ನಿಗದಿತ ಸಮಯಕ್ಕೆ ಮುಂಚೆಯೇ
  rationale: καιρός ಕೇವಲ ಕಾಲವನ್ನಷ್ಟೇ ಅಲ್ಲದೆ ಸಂದರ್ಭಕ್ಕೆ ನಿಗದಿಯಾದ ಸಮಯವನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು. ‘ನಿಗದಿತ’ ಎಂಬುದು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಸಂಬಂಧಿಸಿದ ಸೂಚ್ಯಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ, ಆದರೆ ಯಾರು ನಿಗದಿಪಡಿಸಿದರು ಎಂಬುದನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ಹೇಳುವುದಿಲ್ಲ.
- source_word: βασανίσαι
  choice: ಯಾತನೆ ಕೊಡಲು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ βασανίζω ಸೂಚಿಸುವ ತೀವ್ರ ಪೀಡೆಯನ್ನು ‘ಯಾತನೆ ಕೊಡಲು’ ಎಂಬ ಸಾಮಾನ್ಯರಿಗೆ ಸ್ಪಷ್ಟವಾದ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ದೈಹಿಕ ಹಿಂಸೆಯೊಂದಕ್ಕೆ ಮಾತ್ರ ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ἡμᾶς
  choice: ನಮಗೆ
  rationale: ಮಾತನಾಡುತ್ತಿರುವ ದೆವ್ವಗಳನ್ನು ಸೂಚಿಸುವ ಬಹುವಚನ ಕರ್ಮಾರ್ಥವನ್ನು ಕನ್ನಡದ ಸಹಜ ಕ್ರಿಯಾರಚನೆಗೆ ತಕ್ಕಂತೆ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ದೆವ್ವಗಳು ಯೇಸುವಿನ ಗುರುತನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುವುದು
  choice: ದೇವರ ಮಗನೇ
  alternative: ದೇವಪುತ್ರನೇ
  rationale: ಮೂಲದಲ್ಲಿರುವ υἱὲ τοῦ θεοῦ ಅನ್ನು ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ಬಿರುದಿನ ಬಲವನ್ನು ಕುಗ್ಗಿಸಿಯೂ ಇಲ್ಲ, ಪಠ್ಯದಲ್ಲಿಲ್ಲದ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಿಯೂ ಇಲ್ಲ.
- issue: καιρός ಪದದ ಅಂತ್ಯಕಾಲಸಂಬಂಧಿ ಸೂಚ್ಯಾರ್ಥ
  choice: ನಿಗದಿತ ಸಮಯಕ್ಕೆ ಮುಂಚೆಯೇ
  alternative: ಸಮಯಕ್ಕೆ ಮುಂಚೆಯೇ
  rationale: ದೆವ್ವಗಳ ಪ್ರಶ್ನೆಯು ಯಾತನೆ ಅಥವಾ ನ್ಯಾಯತೀರ್ಪಿಗಾಗಿ ಒಂದು ನಿರ್ದಿಷ್ಟ ಸಮಯವಿದೆ ಎಂಬ ಸೂಚನೆಯನ್ನು ಕೊಡುತ್ತದೆ. ‘ನಿಗದಿತ ಸಮಯ’ ಆ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ಹೆಚ್ಚಿನ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರವನ್ನು ಆಮದು ಮಾಡುವುದಿಲ್ಲ.
- issue: Τί ἡμῖν καὶ σοί ನುಡಿಗಟ್ಟಿನ ಅರ್ಥ
  choice: ನಿನಗೂ ನಮಗೂ ಏನು ಸಂಬಂಧ?
  alternative: ನಮಗೂ ನಿನಗೂ ಏನು?
  rationale: ನುಡಿಗಟ್ಟಿನ ದೂರೀಕರಣ ಮತ್ತು ಸವಾಲಿನ ಭಾವವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಗ್ರಹಿಸಬಹುದಾದ ರೀತಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ. ಹೆಚ್ಚು ಶಾಬ್ದಿಕವಾದ, ಆದರೆ ಕನ್ನಡದಲ್ಲಿ ಅಪೂರ್ಣವಾಗಿ ಕೇಳಿಸುವ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಕೊಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಮೂಲದ ಜೀವಂತ ಗಮನಸೂಚಕವನ್ನು ಉಳಿಸುತ್ತದೆ. ನೇರೋಕ್ತಿಯೊಳಗಿನ ಸಂಬೋಧನೆ ಮತ್ತು ಪ್ರಶ್ನೆಗಳು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಇವೆ; ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಪದಬಂಧಗಳ ತಕ್ಷಣವೇ ಇರಿಸಲಾಗಿದೆ.
