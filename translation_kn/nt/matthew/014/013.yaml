id: MAT.14.13
reference: Matthew 14:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: kn
  text: ಯೇಸು ಇದನ್ನು ಕೇಳಿದಾಗ, ಅಲ್ಲಿಂದ ದೋಣಿಯಲ್ಲಿ ಒಂದು ನಿರ್ಜನ ಸ್ಥಳಕ್ಕೆ[a] ಏಕಾಂತವಾಗಿ ತೆರಳಿದರು. ಆದರೆ ಜನರ ಗುಂಪುಗಳು ಕೇಳಿ, ಪಟ್ಟಣಗಳಿಂದ[b] ಕಾಲ್ನಡಿಗೆಯಲ್ಲಿ ಅವರನ್ನು ಹಿಂಬಾಲಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಜನವಾಸವಿಲ್ಲದ ಸ್ಥಳಕ್ಕೆ’ ಅಥವಾ ‘ಏಕಾಂತವಾದ ಸ್ಥಳಕ್ಕೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಪದವು ಪ್ರತ್ಯೇಕವಾದ ಅಥವಾ ಜನವಾಸವಿಲ್ಲದ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅದು ಮರಳುಗಾಡೇ ಆಗಿರಬೇಕೆಂದಿಲ್ಲ.
    reason: lexical_alternative
  - marker: b
    text: ‘ನಗರಗಳಿಂದ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಪಟ್ಟಣಗಳನ್ನಾಗಲಿ ನಗರಗಳನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: ಯೇಸು ಇದನ್ನು ಕೇಳಿದಾಗ
  rationale: Ἀκούσας ಎಂಬ ಭೂತಕಾಲದ ಕೃದಂತವನ್ನು ಸಹಜವಾದ ಕಾಲಸಂಬಂಧದ ಉಪವಾಕ್ಯವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ. δέ ಇಲ್ಲಿ ಬಲವಾದ ವಿರೋಧಕ್ಕಿಂತ ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಪ್ರತ್ಯೇಕ ಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἀνεχώρησεν
  choice: ತೆರಳಿದರು
  rationale: ಸಂದರ್ಭಕ್ಕೆ ಪ್ರತಿಕ್ರಿಯೆಯಾಗಿ ಅಲ್ಲಿಂದ ದೂರ ಹೋಗುವ ಅರ್ಥವನ್ನು ಇದು ನೀಡುತ್ತದೆ. ಉದ್ದೇಶವನ್ನು ಸುರಕ್ಷತೆ, ಶೋಕ ಅಥವಾ ಪ್ರಾರ್ಥನೆ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಕ್ರಿಯೆಯನ್ನು ತಟಸ್ಥವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐν πλοίῳ
  choice: ದೋಣಿಯಲ್ಲಿ
  rationale: ಪ್ರಯಾಣದ ಸಾಧನವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: εἰς ἔρημον τόπον
  choice: ಒಂದು ನಿರ್ಜನ ಸ್ಥಳಕ್ಕೆ
  rationale: ἔρημος ಇಲ್ಲಿ ಮರಳುಗಾಡನ್ನೇ ಕಡ್ಡಾಯವಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ; ಜನವಾಸವಿಲ್ಲದ ಅಥವಾ ಒಂಟಿಯಾದ ಪ್ರದೇಶ ಎಂಬ ವಿಶಾಲ ಅರ್ಥವನ್ನು ‘ನಿರ್ಜನ’ ಉಳಿಸುತ್ತದೆ.
- source_word: κατ’ ἰδίαν
  choice: ಏಕಾಂತವಾಗಿ
  rationale: ಇತರರಿಂದ ಪ್ರತ್ಯೇಕವಾಗಿ ಅಥವಾ ಖಾಸಗಿಯಾಗಿ ಎಂಬ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ‘ಒಬ್ಬರೇ’ ಎಂದು ಹೇಳಿ ಶಿಷ್ಯರು ದೋಣಿಯಲ್ಲಿ ಇರಲಿಲ್ಲವೆಂಬ ನಿರ್ಣಯವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: οἱ ὄχλοι
  choice: ಜನರ ಗುಂಪುಗಳು
  rationale: ಬಹುವಚನ ರೂಪವನ್ನು ಉಳಿಸಿಕೊಂಡು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ಮಾಡಲಾಗಿದೆ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ಅವರನ್ನು ಹಿಂಬಾಲಿಸಿದವು
  rationale: ಇಲ್ಲಿ ದೈಹಿಕವಾಗಿ ಹಿಂದೆ ಹೋಗುವುದನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಹೆಚ್ಚುವರಿ ಶಿಷ್ಯತ್ವದ ಅರ್ಥವನ್ನು ಹೇರಲಾಗಿಲ್ಲ.
- source_word: πεζῇ
  choice: ಕಾಲ್ನಡಿಗೆಯಲ್ಲಿ
  rationale: ದೋಣಿಯ ಪ್ರಯಾಣಕ್ಕೆ ವಿರುದ್ಧವಾಗಿ ನೆಲದ ಮೇಲೆ ನಡೆದು ಹೋದ ವಿಧಾನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ τῶν πόλεων
  choice: ಪಟ್ಟಣಗಳಿಂದ
  rationale: πόλις ಪಟ್ಟಣ ಅಥವಾ ನಗರವನ್ನು ಸೂಚಿಸಬಹುದು; ಗಲಿಲಾಯದ ಸಂದರ್ಭಕ್ಕೆ ‘ಪಟ್ಟಣಗಳು’ ಸಹಜವಾಗಿದ್ದು, ಪರ್ಯಾಯವನ್ನು ಅಡಿಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸು ಅಲ್ಲಿಂದ ತೆರಳಿದ ಉದ್ದೇಶ
  choice: ಉದ್ದೇಶವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ‘ತೆರಳಿದರು’ ಎಂದು ತಟಸ್ಥವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಸುರಕ್ಷತೆಗಾಗಿ ಹಿಂದೆ ಸರಿದರು; ಶೋಕಿಸಲು ಅಥವಾ ಪ್ರಾರ್ಥಿಸಲು ಏಕಾಂತಕ್ಕೆ ಹೋದರು
  rationale: ಸುದ್ದಿ ಕೇಳಿದ ನಂತರ ಯೇಸು ನಿರ್ಜನ ಸ್ಥಳಕ್ಕೆ ತೆರಳಿದರೆಂದು ವಾಕ್ಯ ಹೇಳುತ್ತದೆ; ಆದರೆ ಅವರ ಉದ್ದೇಶವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಸಾಧ್ಯವಾದ ವ್ಯಾಖ್ಯಾನಗಳಲ್ಲಿ ಒಂದನ್ನು ಅನುವಾದದಲ್ಲೇ ನಿಗದಿಪಡಿಸಲಾಗಿಲ್ಲ.
- issue: κατ’ ἰδίαν ಎಂಬ ಪದಗುಚ್ಛವು ಸಂಪೂರ್ಣ ಏಕಾಂಗಿತನವನ್ನು ಸೂಚಿಸುವುದೇ
  choice: ‘ಏಕಾಂತವಾಗಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಒಬ್ಬರೇ’
  rationale: ಈ ಪದಗುಚ್ಛವು ಖಾಸಗಿಯಾಗಿ ಅಥವಾ ಇತರರಿಂದ ಪ್ರತ್ಯೇಕವಾಗಿ ಎಂಬ ಅರ್ಥವನ್ನು ಹೊಂದಬಹುದು. ‘ಒಬ್ಬರೇ’ ಎನ್ನುವುದು ಅವರೊಂದಿಗೆ ಯಾರೂ ಇರಲಿಲ್ಲ ಎಂಬ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ನಿರ್ಣಯಕ್ಕೆ ದಾರಿ ಮಾಡಬಹುದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಪೂರ್ಣವಾದ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಬಳಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ಜನಸಮೂಹಗಳ ಬಹುವಚನವನ್ನು ‘ಜನರ ಗುಂಪುಗಳು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ; ಎರಡನೆಯ ἀκούσαντες‌ನ ಕೇಳಿದ ವಿಷಯವನ್ನು ಮೂಲದಂತೆಯೇ ಸ್ಪಷ್ಟಪಡಿಸದೆ ‘ಇದನ್ನು ಕೇಳಿ’ ಎಂದು ತೆರೆದಿಡಲಾಗಿದೆ. ಅಡಿಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಅವು ವಿವರಿಸುವ ಪದಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
