- from: ಆದ್ದರಿಂದ ಅವನು ಅವಳು ಏನು ಕೇಳಿದರೂ ಕೊಡುವುದಾಗಿ ಆಣೆಯಿಟ್ಟು ವಾಗ್ದಾನ ಮಾಡಿದನು.[a]
  to: ಆದ್ದರಿಂದ, ಅವಳು ಏನು ಕೇಳಿದರೂ ಅದನ್ನು ಕೊಡುವುದಾಗಿ ಅವನು ಪ್ರಮಾಣಪೂರ್ವಕವಾಗಿ ವಾಗ್ದಾನ ಮಾಡಿದನು.[a]
  rationale: The revision replaces a potentially ambiguous expression for swearing with clear modern-standard Kannada, makes the object of the promised gift explicit, and retains the Greek indefinite relative clause’s open-ended sense. The footnote is adjusted to a more natural Kannada alternative while preserving its explanatory function and anchor.
  reviewer_model: gpt-5.6-terra
