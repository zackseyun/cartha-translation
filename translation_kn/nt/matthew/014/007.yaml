reference: Matthew 14:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ಅವಳು ಏನು ಕೇಳಿದರೂ ಅದನ್ನು ಕೊಡುವುದಾಗಿ ಅವನು ಪ್ರಮಾಣಪೂರ್ವಕವಾಗಿ ವಾಗ್ದಾನ ಮಾಡಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವಳು ಏನೇ ಕೇಳಿದರೂ ಅದನ್ನು.’ ಗ್ರೀಕ್‌ನ ὃ ἐὰν αἰτήσηται ಎಂಬುದು ಇನ್ನೂ ನಿರ್ದಿಷ್ಟವಾಗದ, ಮುಕ್ತವಾದ ಮುಂದಿನ ಕೋರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಘಟನೆಯಿಂದ ಉಂಟಾದ ಪರಿಣಾಮವನ್ನು ಸೂಚಿಸುವ ಅನುಮಾನಾರ್ಥಕ/ಫಲಸೂಚಕ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μετὰ ὅρκου
  choice: ಆಣೆಯಿಟ್ಟು
  rationale: ವಾಗ್ದಾನವು ಪ್ರಮಾಣಪೂರ್ವಕವಾಗಿ ಮಾಡಲ್ಪಟ್ಟದ್ದನ್ನು ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὡμολόγησεν
  choice: ವಾಗ್ದಾನ ಮಾಡಿದನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಾರ್ವಜನಿಕ ಅಥವಾ ದೃಢ ಬದ್ಧತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಒಪ್ಪಿಕೊಂಡನು’ ಅಥವಾ ‘ಅರಿಕೆ ಮಾಡಿದನು’ಗಿಂತ ಕಥನಕ್ಕೆ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: αὐτῇ
  choice: ಅವಳು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಪರೋಕ್ಷ ಕರ್ಮವಾಗಿದ್ದರೂ, ಕನ್ನಡದ ‘ಅವಳು ಏನು ಕೇಳಿದರೂ ಕೊಡುವುದಾಗಿ’ ಎಂಬ ರಚನೆಯಲ್ಲಿ ಅದೇ ಸಂಬಂಧ ಸಹಜವಾಗಿ ವ್ಯಕ್ತವಾಗುತ್ತದೆ.
- source_word: δοῦναι
  choice: ಕೊಡುವುದಾಗಿ
  rationale: ವಾಗ್ದಾನದ ವಿಷಯವನ್ನು ತಿಳಿಸುವ ಗ್ರೀಕ್ ಕ್ರಿಯಾನಾಮದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದ ವರದಿತ ರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: ಏನು ಕೇಳಿದರೂ
  rationale: ἐάν ಸಹಿತ ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯಾರೂಪದ ಅನಿರ್ದಿಷ್ಟ, ಮುಕ್ತ ಭವಿಷ್ಯ ವಿನಂತಿಯನ್ನು ಕನ್ನಡದ ಸಾಮಾನ್ಯ ಅನಿರ್ದಿಷ್ಟ ಸಂಬಂಧರೂಪವು ಸಮರ್ಪಕವಾಗಿ ಹಿಡಿದಿಡುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆಣೆಯಿಟ್ಟು ವಾಗ್ದಾನ ಮಾಡಿದನು’ ಎಂಬುದು ಮೂಲದ ಪ್ರಮಾಣಪೂರ್ವಕ ಬದ್ಧತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಏನು ಕೇಳಿದರೂ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿದ್ದು ಗ್ರೀಕ್‌ನ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
