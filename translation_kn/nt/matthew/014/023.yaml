  to: ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿದ ನಂತರ, ಪ್ರಾರ್ಥಿಸಲು ಆತನು ಒಬ್ಬನೇ ಬೆಟ್ಟಕ್ಕೆ ಏರಿ ಹೋದನು.[a] ಸಂಜೆಯಾದಾಗ ಆತನು ಅಲ್ಲಿ ಒಬ್ಬನೇ ಇದ್ದನು.
