id: MAT.14.23
reference: Matthew 14:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: kn
  text: ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿದ ನಂತರ, ಪ್ರಾರ್ಥಿಸಲು ಆತನು ಒಬ್ಬನೇ ಬೆಟ್ಟಕ್ಕೆ ಏರಿ ಹೋದನು.[a] ಸಂಜೆಯಾದಾಗ ಆತನು ಅಲ್ಲಿ ಒಬ್ಬನೇ ಇದ್ದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಏಕಾಂತವಾಗಿ’ (κατ’ ἰδίαν).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας τοὺς ὄχλους
  choice: ಜನರನ್ನು ಕಳುಹಿಸಿಬಿಟ್ಟ ನಂತರ
  rationale: ಪೂರ್ವಕಾಲಿಕ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ aorist participle ಅನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ನಂತರ’ ಎಂಬ ಕಾಲಸಂಬಂಧದೊಂದಿಗೆ ಅನುವಾದಿಸಲಾಗಿದೆ. ὄχλοι ಬಹುವಚನದಲ್ಲಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ‘ಜನರು’ ಎಂಬ ಸಮೂಹಾರ್ಥಕ ರೂಪವು ಸಹಜವಾಗಿ ಗುಂಪುಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ಬೆಟ್ಟದ ಮೇಲೆ ಹೋದನು
  rationale: ಮೇಲ್ಮುಖವಾಗಿ ಬೆಟ್ಟದ ಪ್ರದೇಶಕ್ಕೆ ಹೋದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ‘ಏರಿದನು’ ಎಂದು ಅನಗತ್ಯವಾಗಿ ಕಠಿಣ ಆರೋಹಣದ ಭಾವ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: κατ’ ἰδίαν
  choice: ಒಬ್ಬನೇ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಇತರರಿಂದ ಪ್ರತ್ಯೇಕವಾಗಿ, ತಾನೊಬ್ಬನೇ ಪ್ರಾರ್ಥಿಸಲು ಹೋದ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಏಕಾಂತವಾಗಿ’ ಎಂಬ ಪರ್ಯಾಯವನ್ನೂ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: προσεύξασθαι
  choice: ಪ್ರಾರ್ಥಿಸುವುದಕ್ಕಾಗಿ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯ ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುವ infinitive ಅನ್ನು ಸ್ಪಷ್ಟ ಉದ್ದೇಶಾರ್ಥಕ ಕನ್ನಡ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ὀψίας δὲ γενομένης
  choice: ಸಂಜೆಯಾದಾಗ
  rationale: Genitive absolute ಸೂಚಿಸುವ ಕಾಲಸಂದರ್ಭವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μόνος ἦν ἐκεῖ
  choice: ಆತನು ಅಲ್ಲಿ ಒಬ್ಬನೇ ಇದ್ದನು
  rationale: μόνος ಒತ್ತಿಹೇಳುವ ಏಕಾಂತತೆಯನ್ನು ಉಳಿಸಿ, ἐκεῖಯ ‘ಅಲ್ಲಿ’ ಎಂಬ ಸ್ಥಳಸೂಚನೆಯನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
