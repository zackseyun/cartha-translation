translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಯೇಸುವಿಗೆ ‘ಆತನು’ ಎಂಬ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮವನ್ನು ಬಳಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿರುವ ಎರಡು ಪ್ರತ್ಯೇಕ ಏಕಾಂತ ಸೂಚನೆಗಳನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
