  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: kn
  text: ಆ ಸಮಯದಲ್ಲಿ ಚತುರ್ಥಾಂಶಾಧಿಪತಿಯಾದ ಹೆರೋದನು ಯೇಸುವಿನ ಕುರಿತು ಸುದ್ದಿಯನ್ನು ಕೇಳಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
