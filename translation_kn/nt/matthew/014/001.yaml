    text: ಅಥವಾ, ‘ಯೇಸುವಿನ ಕುರಿತ ವರದಿಯನ್ನು.’
    reason: ἀκοή ಎಂಬ ಪದವು ಈ ಸಂದರ್ಭದಲ್ಲಿ ‘ಸುದ್ದಿ’ ಅಥವಾ ‘ವರದಿ’ಯನ್ನು ಸೂಚಿಸಬಹುದು.
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ಆ ಸಮಯದಲ್ಲಿ
  rationale: ಈ ಗ್ರೀಕ್ ಪದಗುಚ್ಛವು ಕಾಲವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ನುಡಿಗಟ್ಟು; ‘ಆ ಸಮಯದಲ್ಲಿ’ ಎಂಬುದು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೈಸರ್ಗಿಕವಾಗಿದ್ದು ಮೂಲದ ಕಾಲಸೂಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἤκουσεν
  choice: ಕೇಳಿದನು
  rationale: ἀκούω ಕ್ರಿಯಾಪದದ ಸರಳ ಅರ್ಥ ‘ಕೇಳು’; ಸಂದರ್ಭಕ್ಕೆ ಅನಗತ್ಯವಾದ ಹೆಚ್ಚಿನ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸದೆ ಅದನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ἡρῴδης
  choice: ಹೆರೋದನು
  rationale: ಈ ವ್ಯಕ್ತಿನಾಮದ ಕನ್ನಡದಲ್ಲಿ ಪ್ರಚಲಿತವಾದ ಲಿಪ್ಯಂತರವನ್ನು ಬಳಸಲಾಗಿದೆ; ಕರ್ತೃವಿಭಕ್ತಿಗೆ ಅನುಗುಣವಾಗಿ ‘-ನು’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: ὁ τετραάρχης
  choice: ಚತುರ್ಥಾಂಶಾಧಿಪತಿಯಾದ
  rationale: ನಿರ್ದಿಷ್ಟ ಐತಿಹಾಸಿಕ ಆಡಳಿತ ಪದವಿಯನ್ನು ಉಳಿಸಲು ಅರ್ಥಸ್ಪಷ್ಟವಾದ ಕನ್ನಡ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ; ಸಾಮಾನ್ಯವಾದ ‘ಅರಸ’ ಅಥವಾ ‘ಆಡಳಿತಗಾರ’ ಎಂಬ ಪದಗಳು ಪದವಿಯ ನಿಖರತೆಯನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತವೆ.
- source_word: τὴν ἀκοὴν
  choice: ಹರಡಿದ್ದ ಸುದ್ದಿಯನ್ನು
  rationale: ಇಲ್ಲಿ ἀκοή ಶ್ರವಣಶಕ್ತಿಯನ್ನಲ್ಲ, ಕೇಳಿಬಂದ ವರದಿ ಅಥವಾ ಸುದ್ದಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯ ಸಹಜವಾಗಲು ಸುದ್ದಿಯ ಪ್ರಸರಣದ ಅರ್ಥವನ್ನು ‘ಹರಡಿದ್ದ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: Ἰησοῦ
  choice: ಯೇಸುವಿನ ಕುರಿತು
  rationale: ἀκοή ಬಳಿಕದ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಸುದ್ದಿಯ ವಿಷಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಯೇಸುವಿನ ಕುರಿತು’ ಎಂಬುದು ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
