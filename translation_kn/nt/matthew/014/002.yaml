id: MAT.14.2
reference: Matthew 14:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: kn
  text: ಅವನು ತನ್ನ ಸೇವಕರಿಗೆ, “ಇವನು ದೀಕ್ಷಾಸ್ನಾನಿಕ ಯೋಹಾನನು. ಅವನು ಸತ್ತವರೊಳಗಿಂದ ಎಬ್ಬಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ. ಆದಕಾರಣವೇ ಈ ಶಕ್ತಿಗಳು ಅವನಲ್ಲಿ ಕಾರ್ಯನಿರತವಾಗಿವೆ” ಎಂದು ಹೇಳಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಈ ಶಕ್ತಿಗಳು” ಎಂಬುದನ್ನು “ಈ ಅದ್ಭುತ ಶಕ್ತಿಗಳು” ಎಂದೂ, ಹೆಚ್ಚು ಅರ್ಥವಿವರಣಾತ್ಮಕವಾಗಿ “ಈ ಅದ್ಭುತಗಳು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್‌ನಲ್ಲಿ “ಶಕ್ತಿಗಳು” (αἱ δυνάμεις) ಎಂದಿದ್ದು, ಮಹತ್ಕಾರ್ಯಗಳಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವ ಅಲೌಕಿಕ ಶಕ್ತಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: ಸೇವಕರಿಗೆ
  rationale: παῖς ಎಂಬ ಪದಕ್ಕೆ ಮಗು, ಸೇವಕ, ಪರಿಚಾರಕ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು. ಇಲ್ಲಿ ಹೆರೋದನು ತನ್ನ ಮನೆಯ ಅಥವಾ ಆಸ್ಥಾನದ ಅಧೀನದಲ್ಲಿದ್ದವರೊಂದಿಗೆ ಮಾತನಾಡುತ್ತಿರುವುದರಿಂದ ‘ಸೇವಕರು’ ಸಹಜವಾಗಿದ್ದು, ಅವರ ನಿರ್ದಿಷ್ಟ ಹುದ್ದೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: ὁ βαπτιστής
  choice: ದೀಕ್ಷಾಸ್ನಾನಿಕನು
  rationale: βαπτιστής ಎಂಬುದು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುವವನನ್ನು ಸೂಚಿಸುವ ಬಿರುದು. ‘ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನನು’ ಎಂಬ ರೂಪ ಕನ್ನಡದಲ್ಲಿ ಗುರುತಿಸಬಹುದಾದ, ಗೌರವಯುತ ಬಿರುದಾಗಿದ್ದು ಪದದ ಕ್ರಿಯಾತ್ಮಕ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἠγέρθη
  choice: ಎಬ್ಬಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ
  rationale: ἐγείρω ಪದದ ಭೂತಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಎದ್ದಿದ್ದಾನೆ’ ಎಂದು ಹೇಳಿ ಸ್ವಯಂ ಪುನರುತ್ಥಾನವನ್ನು ಸೂಚಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: ಸತ್ತವರೊಳಗಿಂದ
  rationale: ಬಹುವಚನದ ‘ಸತ್ತವರು’ ಮತ್ತು ಅವರ ಮಧ್ಯದಿಂದ ಎಬ್ಬಿಸಲ್ಪಟ್ಟನು ಎಂಬ ಮೂಲಭಾಷೆಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διὰ τοῦτο
  choice: ಆದಕಾರಣವೇ
  rationale: ಈ ವಾಕ್ಯಾಂಶದಲ್ಲಿರುವ ಕಾರಣಸೂಚಕ ಒತ್ತನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: αἱ δυνάμεις
  choice: ಈ ಶಕ್ತಿಗಳು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನ ‘ಶಕ್ತಿಗಳು’ ಎಂಬ ನಾಮಪದವನ್ನು ಉಳಿಸಿ, ಅದನ್ನು ನೇರವಾಗಿ ‘ಅದ್ಭುತಗಳು’ ಎಂದು ಫಲಿತಾಂಶದ ಕ್ರಿಯೆಗಳಾಗಿ ಪರಿವರ್ತಿಸುವುದಿಲ್ಲ. ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ‘ಈ’ ಎಂಬ ಸೂಚಕ ಕನ್ನಡದಲ್ಲಿ ಹಿಂದಿನ ವರದಿಯಾದ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐνεργοῦσιν
  choice: ಕಾರ್ಯಮಾಡುತ್ತಿವೆ
  rationale: ಶಕ್ತಿಗಳು ಸಕ್ರಿಯವಾಗಿ ಪರಿಣಾಮ ಬೀರುತ್ತಿವೆ ಎಂಬ ವರ್ತಮಾನಕಾಲದ ಅರ್ಥವನ್ನು ಸರಳ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐν αὐτῷ
  choice: ಅವನಲ್ಲಿ
  rationale: ἐν ಎಂಬ ಉಪಸರ್ಗದ ನೇರವಾದ ‘ಒಳಗೆ/ನಲ್ಲಿ’ ಎಂಬ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಅವನ ಮೂಲಕ’ ಎಂಬ ಹೆಚ್ಚು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೋಹಾನನ ಪುನರುತ್ಥಾನದ ಸ್ವರೂಪ
  choice: ಅವನು ಸತ್ತವರೊಳಗಿಂದ ಎಬ್ಬಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ
  alternative: ಅವನು ಸತ್ತವರೊಳಗಿಂದ ಎದ್ದಿದ್ದಾನೆ
  rationale: ಗ್ರೀಕ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುವುದರಿಂದ ಯೋಹಾನನು ತನ್ನನ್ನೇ ಎಬ್ಬಿಸಿಕೊಂಡನು ಎಂಬ ಸೂಚನೆ ಬರುವುದಿಲ್ಲ. ಇದು ಹೆರೋದನ ಮಾತನ್ನು ಮಾತ್ರ ದಾಖಲಿಸುತ್ತದೆ; ಅದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಣಯವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: δυνάμεις ಪದದ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ
  choice: ಈ ಶಕ್ತಿಗಳು ಅವನಲ್ಲಿ ಕಾರ್ಯಮಾಡುತ್ತಿವೆ
  alternative: ಈ ಅದ್ಭುತ ಶಕ್ತಿಗಳು ಅವನಲ್ಲಿ ಕಾರ್ಯಮಾಡುತ್ತಿವೆ / ಅದ್ಭುತಗಳು ಅವನ ಮೂಲಕ ನಡೆಯುತ್ತಿವೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಅಲೌಕಿಕ ಮಹತ್ಕಾರ್ಯಗಳು ಉದ್ದೇಶಿತವಾಗಿದ್ದರೂ, ಮುಖ್ಯ ಪಠ್ಯವು ಮೂಲದ ‘ಶಕ್ತಿಗಳು’ ಎಂಬ ಪದವನ್ನು ಮತ್ತು ‘ಅವನಲ್ಲಿ’ ಎಂಬ ಸ್ಥಳಸೂಚಕ ರೂಪವನ್ನು ಉಳಿಸಿ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಹೊಂದುವ ಶೈಲಿ. ‘ಎಬ್ಬಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ’ ಎಂಬ ಕರ್ಮಣಿ ರೂಪ ಮತ್ತು ‘ಅವನಲ್ಲಿ’ ಎಂಬ ಮೂಲಕ್ಕೆ ನಿಕಟವಾದ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
