id: MAT.14.3
reference: Matthew 14:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಹೆರೋದನು ಯೋಹಾನನನ್ನು ಬಂಧಿಸಿ[a], ಅವನನ್ನು ಕಟ್ಟಿ, ತನ್ನ ಸಹೋದರ ಫಿಲಿಪ್ಪನ ಹೆಂಡತಿಯಾದ ಹೆರೋದ್ಯಳ ಕಾರಣದಿಂದ ಅವನನ್ನು ಸೆರೆಮನೆಯಲ್ಲಿ ಹಾಕಿದ್ದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಯೋಹಾನನನ್ನು ಹಿಡಿದುಕೊಂಡು … ಸೆರೆಮನೆಯಲ್ಲಿ ಇಟ್ಟಿದ್ದನು.’
    reason: κρατήσας ಮತ್ತು ἀπέθετο ಪದಗಳಿಗೆ ಹೆಚ್ಚು ಶಾಬ್ದಿಕವಾದ ಪರ್ಯಾಯ ಅನುವಾದವನ್ನು ನೀಡುತ್ತದೆ.
lexical_decisions:
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯಕ್ಕೆ ಕಾರಣಾತ್ಮಕ ವಿವರಣೆ ನೀಡುವ γὰρ ಪದದ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κρατήσας
  choice: ಬಂಧಿಸಿ
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ κρατέω ಎಂದರೆ ಕೇವಲ ಹಿಡಿಯುವುದು ಅಲ್ಲ, ಅಧಿಕಾರದಿಂದ ವಶಕ್ಕೆ ಪಡೆದು ಬಂಧಿಸುವುದು; ಪೂರ್ವಕಾಲಿಕ ಕೃದಂತದ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದ ಸರಣಿ ಕ್ರಿಯಾರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἔδησεν
  choice: ಕಟ್ಟಿ
  rationale: δέω ಪದದ ಸ್ಪಷ್ಟವಾದ ದೈಹಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸರಪಳಿಯಿಂದಲೇ ಕಟ್ಟಿದನೆಂದು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: ಸೆರೆಮನೆಯಲ್ಲಿ ಹಾಕಿದ್ದನು
  rationale: ಬಂಧನದಲ್ಲಿಡುವ ಅರ್ಥದ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿಗೆ ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆದ ಆಧುನಿಕ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: διὰ Ἡρῳδιάδα
  choice: ಹೆರೋದ್ಯಳ ನಿಮಿತ್ತ
  rationale: διά + accusative ಸೂಚಿಸುವ ಕಾರಣವನ್ನು ಉಳಿಸುತ್ತದೆ; ಇಲ್ಲಿ ವ್ಯಕ್ತಿಯ ಕಾರಣದಿಂದ ನಡೆದ ಕ್ರಮವೆಂಬ ಅರ್ಥ ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ.
- source_word: γυναῖκα
  choice: ಹೆಂಡತಿ
  rationale: ಫಿಲಿಪ್ಪನೊಂದಿಗಿನ ವೈವಾಹಿಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವ ಈ ಸಂದರ್ಭದಲ್ಲಿನ γυνή ಪದದ ಸರಿಯಾದ ಅರ್ಥ.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: ತನ್ನ ಸಹೋದರ ಫಿಲಿಪ್ಪನ
  rationale: αὐτοῦ ಎಂಬುದು ಹೆರೋದನನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂಬ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅಸಂದಿಗ್ಧವಾಗಿ, ಮೂಲದ ಸಂಬಂಧವನ್ನು ಉಳಿಸಿಕೊಂಡು ಹೇಳುತ್ತದೆ.
theological_decisions:
- issue: ಫಿಲಿಪ್ಪನೊಂದಿಗೆ ಹೆರೋದ್ಯಳ ಸಂಬಂಧದ ಐತಿಹಾಸಿಕ-ನೈತಿಕ ನಿರೂಪಣೆ
  choice: ತನ್ನ ಸಹೋದರ ಫಿಲಿಪ್ಪನ ಹೆಂಡತಿಯಾದ ಹೆರೋದ್ಯಳು ಎಂದು ತಟಸ್ಥವಾಗಿ ಗುರುತಿಸುವುದು
  alternative: ತನ್ನ ಸಹೋದರ ಫಿಲಿಪ್ಪನ ಹೆಂಡತಿಯನ್ನು ಮಾಡಿಕೊಂಡ ಹೆರೋದ್ಯಳು ಎಂದು ಅಕ್ರಮ ಸಂಬಂಧವನ್ನು ಈ ವಚನದಲ್ಲೇ ಸ್ಪಷ್ಟೀಕರಿಸುವುದು
  rationale: ಈ ವಚನವು ಹೆರೋದ್ಯಳನ್ನು ಫಿಲಿಪ್ಪನ ಹೆಂಡತಿಯೆಂದು ಮಾತ್ರ ಗುರುತಿಸುತ್ತದೆ; ಸಂಬಂಧದ ಅಕ್ರಮತೆಯನ್ನು ಮುಂದಿನ ವಚನ ಹೇಳುತ್ತದೆ. ಆದ್ದರಿಂದ ಆ ತೀರ್ಪನ್ನು ಇಲ್ಲಿ ಮುಂಚಿತವಾಗಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಯುತ ನಿರೂಪಣೆ. ದೀರ್ಘವಾದ ಗ್ರೀಕ್ ವಾಕ್ಯವನ್ನು ಎರಡು ಕನ್ನಡ ವಾಕ್ಯಗಳಾಗಿ ವಿಭಜಿಸಿ ಕಾರಣ-ಕ್ರಮ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸಲಾಗಿದೆ; ಅರ್ಥಕ್ಕೆ ಹೊಸ ವಿಷಯ ಸೇರಿಸಲಾಗಿಲ್ಲ.
