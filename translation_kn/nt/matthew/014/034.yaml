  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: kn
  text: ಅವರು ದಾಟಿದ ನಂತರ, ಗೆನ್ನೆಸರೇತ್ ಪ್ರದೇಶದ ನೆಲವನ್ನು[a] ತಲುಪಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅವರು ಗೆನ್ನೆಸರೇತ್‌ನಲ್ಲಿ ನೆಲಕ್ಕೆ ಬಂದರು.” ಗ್ರೀಕ್‌ನಲ್ಲಿ “ನೆಲದ ಮೇಲೆ/ನೆಲಕ್ಕೆ” ಮತ್ತು “ಗೆನ್ನೆಸರೇತಿಗೆ” ಎಂಬ ಅಭಿವ್ಯಕ್ತಿಗಳು ಜೊತೆಯಾಗಿವೆ; ಇದು ಗೆನ್ನೆಸರೇತ್ ಪ್ರದೇಶದ ನೆಲಕ್ಕೆ, ಅಂದರೆ ದಡದ ಪ್ರದೇಶಕ್ಕೆ, ಆಗಮಿಸಿದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: ದಾಟಿ ಹೋದ ನಂತರ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚೆ ನಡೆದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಭೂತಕಾಲದ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಕಾಲಸಂಬಂಧದ ಉಪವಾಕ್ಯವಾಗಿ ನೀಡಲಾಗಿದೆ; ದೋಣಿಯಲ್ಲಿ ಎಂಬುದನ್ನು ಗ್ರೀಕ್ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದ ಕಾರಣ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἦλθον
  choice: ಬಂದು ತಲುಪಿದರು
  rationale: ἔρχομαι ಕ್ರಿಯೆಯ ಆಗಮನದ ಅರ್ಥವನ್ನು ಗಮ್ಯಸ್ಥಾನ ಸೂಚಿಸುವ ಪದಗುಚ್ಛದೊಂದಿಗೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐπὶ τὴν γῆν
  choice: ದಡಕ್ಕೆ
  rationale: ಶಾಬ್ದಿಕವಾಗಿ ‘ನೆಲದ ಮೇಲೆ/ನೆಲಕ್ಕೆ’ ಎಂದಾದರೂ, ನೀರನ್ನು ದಾಟಿ ಬಂದ ಸಂದರ್ಭದಲ್ಲಿದು ದಡ ಸೇರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ದಡಕ್ಕೆ’ ಸಹಜ ಮತ್ತು ಸಂದರ್ಭಸಮ್ಮತ.
- source_word: εἰς Γεννησαρέτ
  choice: ಗೆನ್ನೆಸರೇತ್ ಪ್ರದೇಶದ
  rationale: ಗಮ್ಯಸ್ಥಾನವಾದ ಗೆನ್ನೆಸರೇತಿನ ಪ್ರದೇಶಕ್ಕೆ ಆಗಮನವನ್ನು ಸೂಚಿಸಲು ಸ್ಥಳನಾಮವನ್ನು ‘ಪ್ರದೇಶದ’ ಎಂಬ ಸಂಬಂಧರೂಪದೊಂದಿಗೆ ನೀಡಲಾಗಿದೆ.
- source_word: Γεννησαρέτ
  choice: ಗೆನ್ನೆಸರೇತ್
  rationale: ಸ್ಥಳನಾಮವನ್ನು ಕನ್ನಡ ಲಿಪಿಯಲ್ಲಿ ಧ್ವನ್ಯಾಂತರಿಸಲಾಗಿದೆ.
