id: MAT.14.12
reference: Matthew 14:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: kn
  text: ಅವನ ಶಿಷ್ಯರು ಬಂದು, ಶವವನ್ನು[a] ತೆಗೆದುಕೊಂಡು ಅವನನ್ನು ಸಮಾಧಿಮಾಡಿದರು. ನಂತರ ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು ತಿಳಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್ ಪದದ ಅರ್ಥ ‘ಮೃತದೇಹ’ ಅಥವಾ ‘ಹೆಣ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: ಬಂದು
  rationale: ಕ್ರಿಯೆಗಳ ಸರಣಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಆರಂಭಿಸುತ್ತದೆ; ‘ಹತ್ತಿರ ಬಂದು’ ಎಂಬುದು ಸಾಧ್ಯವಾದರೂ ಇಲ್ಲಿ ಅನಗತ್ಯವಾಗಿ ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ.
- source_word: μαθηταὶ αὐτοῦ
  choice: ಅವನ ಶಿಷ್ಯರು
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿನ ಸರ್ವನಾಮವು ಸ್ನಾನಿಕ ಯೋಹಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆದರೂ ಗ್ರೀಕ್‌ನ ಸರ್ವನಾಮ ರೂಪವನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἦραν
  choice: ತೆಗೆದುಕೊಂಡು ಹೋಗಿ
  rationale: αἴρω ಎಂಬುದು ಎತ್ತುವುದು ಅಥವಾ ತೆಗೆದುಕೊಂಡು ಹೋಗುವುದನ್ನು ಸೂಚಿಸಬಹುದು; ಸಮಾಧಿಯ ಸಂದರ್ಭದಲ್ಲಿದು ಸಹಜ ಕನ್ನಡವಾಗಿದ್ದು, ಚಲನೆಯ ಅರ್ಥವನ್ನೂ ಸಮರ್ಪಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πτῶμα
  choice: ಶವವನ್ನು
  rationale: πτῶμα ನಿರ್ದಿಷ್ಟವಾಗಿ ಮೃತದೇಹವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಶವ’ ಆ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಹಾಗೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಕೊಡುತ್ತದೆ.
- source_word: ἔθαψαν αὐτόν
  choice: ಅವನನ್ನು ಸಮಾಧಿಮಾಡಿದರು
  rationale: θάπτω ಎಂಬುದರ ನೇರ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ಗೋರಿಯಲ್ಲಿ ಇಟ್ಟರು ಎಂಬ ಹೆಚ್ಚುವರಿ ವಿವರವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐλθόντες
  choice: ಅನಂತರ ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ಹೋಗಿ
  rationale: ಮುಂದಿನ ಕ್ರಮ ಮತ್ತು ಯೇಸುವಿನತ್ತ ನಡೆದ ಚಲನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀπήγγειλαν
  choice: ನಡೆದದ್ದನ್ನು ತಿಳಿಸಿದರು
  rationale: ἀπαγγέλλω ಎಂದರೆ ವರದಿ ಮಾಡುವುದು ಅಥವಾ ತಿಳಿಸುವುದು. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ಮವು ಅಪ್ರತ್ಯಕ್ಷವಾಗಿರುವುದರಿಂದ ‘ನಡೆದದ್ದನ್ನು’ ಎಂಬುದು ಸಂದರ್ಭಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಪೂರೈಸುತ್ತದೆ.
- source_word: τῷ Ἰησοῦ
  choice: ಯೇಸುವಿನ ಬಳಿಗೆ
  rationale: ಕನ್ನಡದ ಸಾಮಾನ್ಯ ಹೆಸರಿನ ರೂಪವನ್ನು ಅನುಸರಿಸಿ, ತಿಳಿಸುವ ಕ್ರಿಯೆಯ ಗುರಿಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಅವನ ಶಿಷ್ಯರು’ ಎಂಬುದರ ಗುರುತು
  choice: ಸ್ನಾನಿಕ ಯೋಹಾನನ ಶಿಷ್ಯರು ಎಂಬ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡು ‘ಅವನ ಶಿಷ್ಯರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಯೇಸುವಿನ ಶಿಷ್ಯರು
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭವು ಸ್ನಾನಿಕ ಯೋಹಾನನ ಮರಣವನ್ನು ಕುರಿತದ್ದಾಗಿರುವುದರಿಂದ αὐτοῦ ಸಹಜವಾಗಿ ಯೋಹಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆದರೆ ಮೂಲದ ಸರ್ವನಾಮವನ್ನು ಹೆಸರಿನಿಂದ ಬದಲಿಸದೆ ಉಳಿಸುವುದು ಸೂಕ್ತ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಶಿಷ್ಯರು’, ‘ಸಮಾಧಿಮಾಡಿದರು’ ಮತ್ತು ‘ಯೇಸು’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಪ್ರಯೋಗಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
