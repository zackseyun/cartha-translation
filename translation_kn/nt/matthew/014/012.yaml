  to: ಅವನ ಶಿಷ್ಯರು ಬಂದು, ಶವವನ್ನು[a] ತೆಗೆದುಕೊಂಡು ಅವನನ್ನು ಸಮಾಧಿಮಾಡಿದರು. ನಂತರ ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು ತಿಳಿಸಿದರು.
