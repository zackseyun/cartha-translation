review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies John's disciples, πτῶμα as a dead body, burial, and the subsequent report to Jesus. However, “ತೆಗೆದುಕೊಂಡು ಹೋಗಿ” can overstate αἴρω by explicitly adding ‘away’; the Greek states that they took/lifted the body without specifying the manner or destination of transport. “ನಡೆದದ್ದನ್ನು” is a reasonable contextual object for the report but is not necessary, since the Greek leaves the content implicit.
  naturalness: The narrative is clear and modern. Replacing “ತೆಗೆದುಕೊಂಡು ಹೋಗಿ” with “ತೆಗೆದುಕೊಂಡು” is equally natural and closer to the source. “ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು ತಿಳಿಸಿದರು” is idiomatic Kannada and retains the sequential movement expressed by the participle.
  terminology: “ಶಿಷ್ಯರು,” “ಶವ,” “ಸಮಾಧಿಮಾಡಿದರು,” and “ಯೇಸು” are suitable standard biblical Kannada terms. The lexical footnote appropriately records that πτῶμα means a dead body/corpse.
  issues:
  - severity: low
    issue: “ತೆಗೆದುಕೊಂಡು ಹೋಗಿ” adds an explicit ‘away’ nuance.
    rationale: αἴρω means ‘take up/take’ here; while transport is contextually likely, the Greek does not expressly state ‘away.’ “ತೆಗೆದುಕೊಂಡು” preserves the wording without that additional directional implication.
  revised_text: ಅವನ ಶಿಷ್ಯರು ಬಂದು, ಶವವನ್ನು[a] ತೆಗೆದುಕೊಂಡು ಅವನನ್ನು ಸಮಾಧಿಮಾಡಿದರು. ನಂತರ ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು ತಿಳಿಸಿದರು.
  revised_footnotes:
  - marker: a
    text: ಗ್ರೀಕ್ ಪದದ ಅರ್ಥ ‘ಮೃತದೇಹ’ ಅಥವಾ ‘ಹೆಣ’.
    reason: lexical_alternative
  revision_rationale: The revision removes the added directional sense in “ತೆಗೆದುಕೊಂಡು ಹೋಗಿ” while preserving the source sequence, the implicit contextual content of the report, and the established Kannada biblical register.
