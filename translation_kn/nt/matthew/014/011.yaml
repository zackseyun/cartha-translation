translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಹಾಗೂ ಘಟನೆಯ ಕಠೋರತೆಯನ್ನು ಮೃದುಗೊಳಿಸದೆ ಅನುವಾದಿಸಲಾಗಿದೆ. ಮೂಲದ ಕರ್ಮಣಿ-ಸಕ್ರಿಯ ಕ್ರಿಯಾ ಕ್ರಮವನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
