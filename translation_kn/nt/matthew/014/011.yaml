revisions:
- from: ಅವನ ತಲೆಯನ್ನು ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ[a] ತಂದು ಆ ಹುಡುಗಿಗೆ ಕೊಡಲಾಯಿತು; ಅವಳು ಅದನ್ನು ತನ್ನ ತಾಯಿಯ ಬಳಿಗೆ ತಂದಳು.
  to: ಅವನ ತಲೆಯನ್ನು ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ[a] ತರಲಾಯಿತು ಮತ್ತು ಆ ಹುಡುಗಿಗೆ ಕೊಡಲಾಯಿತು; ಅವಳು ಅದನ್ನು ತನ್ನ ತಾಯಿಯ ಬಳಿಗೆ ತಂದಳು.
  rationale: The revision supplies a finite passive verb for the bringing of the head, matching the Greek’s coordinated passive verbs, while retaining the direct and unsmoothed description, the lexical ambiguity of πίναξ in the footnote, and the final active action by the girl.
