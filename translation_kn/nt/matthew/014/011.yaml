id: MAT.14.11
reference: Matthew 14:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: kn
  text: ಅವನ ತಲೆಯನ್ನು ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ[a] ತರಲಾಯಿತು ಮತ್ತು ಆ ಹುಡುಗಿಗೆ ಕೊಡಲಾಯಿತು; ಅವಳು ಅದನ್ನು ತನ್ನ ತಾಯಿಯ ಬಳಿಗೆ ತಂದಳು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಬಡಿಸುವ ಹರಿವಾಣದ ಮೇಲೆ’ ಅಥವಾ ‘ಪಾತ್ರೆಯ ಮೇಲೆ.’ ಗ್ರೀಕ್ πίναξ ಎಂಬ ಪದವು ಆಹಾರ ಬಡಿಸುವ ತಟ್ಟೆ ಅಥವಾ ಹರಿವಾಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: ತಂದು
  rationale: φέρω ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲದ ಕರ್ಮಣಿ ರೂಪದ ಅರ್ಥವನ್ನು ಮುಂದಿನ ‘ಕೊಡಲಾಯಿತು’ ಎಂಬ ಕರ್ಮಣಿ ರಚನೆಯೊಂದಿಗೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: ಅವನ ತಲೆಯನ್ನು
  rationale: ಮೂಲದ ನೇರ ಮತ್ತು ಕಠೋರ ಚಿತ್ರಣವನ್ನು ಸೌಮ್ಯಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡ ವಾಕ್ಯರಚನೆಗೆ ತಕ್ಕಂತೆ ಕರ್ಮ ವಿಭಕ್ತಿ ಬಳಸಲಾಗಿದೆ.
- source_word: ἐπὶ πίνακι
  choice: ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ
  rationale: πίναξ ಇಲ್ಲಿ ಆಹಾರ ಬಡಿಸುವ ತಟ್ಟೆ ಅಥವಾ ಹರಿವಾಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಟ್ಟೆ’ ಆಧುನಿಕ ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: ἐδόθη
  choice: ಕೊಡಲಾಯಿತು
  rationale: δίδωμι ಕ್ರಿಯಾಪದದ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τῷ κορασίῳ
  choice: ಆ ಹುಡುಗಿಗೆ
  rationale: κοράσιον ಎಂದರೆ ಹುಡುಗಿ ಅಥವಾ ಎಳೆಯ ಹುಡುಗಿ. ‘ಹುಡುಗಿ’ ಸಹಜ ಆಧುನಿಕ ಪದ; ಸಂದರ್ಭದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ವ್ಯಕ್ತಿಯನ್ನು ‘ಆ’ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἤνεγκεν
  choice: ಅವಳು ಅದನ್ನು … ತಂದಳು
  rationale: ಮೂಲದ ಸಕ್ರಿಯ ಕ್ರಿಯೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟತೆಗೆ ಹಿಂದಿನ ‘ತಲೆ’ಯನ್ನು ಸೂಚಿಸುವ ‘ಅದನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: τῇ μητρὶ αὐτῆς
  choice: ತನ್ನ ತಾಯಿಯ ಬಳಿಗೆ
  rationale: ತಾಯಿ ಆ ಹುಡುಗಿಯ ತಾಯಿಯೇ ಎಂಬ ಮೂಲದ ಸರ್ವನಾಮ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದ ‘ತನ್ನ’ ಸಹಜವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
