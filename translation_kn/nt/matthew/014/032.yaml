id: MAT.14.32
reference: Matthew 14:32
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: kn
  text: ಆಮೇಲೆ ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತಿದಾಗ[a], ಗಾಳಿ ನಿಂತುಹೋಯಿತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಇನ್ನೂ ಅಕ್ಷರಶಃ: “ಅವರು ದೋಣಿಯೊಳಗೆ ಏರಿದ ನಂತರ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ಗ್ರೀಕ್ καί ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಪ್ರತ್ಯೇಕ ಕನ್ನಡ ವಾಕ್ಯದಲ್ಲಿ ‘ಮತ್ತು’ ಎಂದು ಆರಂಭಿಸುವುದಕ್ಕಿಂತ ಸಹಜ ಕಥನಪ್ರವಾಹಕ್ಕಾಗಿ ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಅನುವಾದಿಸದೆ ಬಿಡಲಾಗಿದೆ; ಘಟನಾಕ್ರಮವು ಕಾಲವಾಚಕ ಉಪವಾಕ್ಯದಲ್ಲೇ ವ್ಯಕ್ತವಾಗಿದೆ.
- source_word: ἀναβάντων αὐτῶν
  choice: ಅವರು ... ಹತ್ತಿದಾಗ
  rationale: ಕರ್ತೃಸಂಬಂಧಿ ಸ್ವತಂತ್ರ ಷಷ್ಠೀ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದ ಕಾಲವಾಚಕ ಉಪವಾಕ್ಯವಾಗಿ ನೀಡಲಾಗಿದೆ. ἀναβαίνω ಎಂಬುದರ ‘ಮೇಲೆ ಹೋಗು/ಹತ್ತು’ ಅರ್ಥವನ್ನು ‘ದೋಣಿಯನ್ನು ಹತ್ತು’ ಎಂಬ ಪ್ರಚಲಿತ ಕನ್ನಡ ಬಳಕೆ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς τὸ πλοῖον
  choice: ದೋಣಿಯನ್ನು
  rationale: ಸಂದರ್ಭವು ಗಲಿಲಾಯ ಸರೋವರದ ದೋಣಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಹಡಗು’ಗಿಂತ ‘ದೋಣಿ’ ಗಾತ್ರ ಮತ್ತು ಸನ್ನಿವೇಶಕ್ಕೆ ಸಹಜವಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ದೋಣಿಯನ್ನು ಹತ್ತಿದರು’ ಎಂಬ ಕ್ರಿಯಾರಚನೆ ಗಮ್ಯಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκόπασεν
  choice: ನಿಂತುಹೋಯಿತು
  rationale: κοπάζω ಗಾಳಿ ಅಥವಾ ಬಿರುಗಾಳಿ ತಗ್ಗಿ ನಿಲ್ಲುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನಿಂತುಹೋಯಿತು’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು, ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಿಲ್ಲದ ನಿಧಾನ ಪ್ರಕ್ರಿಯೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ὁ ἄνεμος
  choice: ಗಾಳಿ
  rationale: ನಾಮಪದದ ನೇರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ. ಕನ್ನಡದಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಲೇಖನವಿಲ್ಲದ ಕಾರಣ ಗ್ರೀಕ್ ಲೇಖನವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಗುರುತಿಸಲಾಗಿಲ್ಲ.
theological_decisions:
- issue: ಪ್ರಕೃತಿಯ ಮೇಲಿನ ಯೇಸುವಿನ ಅಧಿಕಾರದ ಕಥನಾತ್ಮಕ ಸೂಚನೆ
  choice: ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತಿದಾಗ ಗಾಳಿ ನಿಂತ ಘಟನೆಯನ್ನು ಮಾತ್ರ ನೇರವಾಗಿ ಹೇಳಲಾಗಿದೆ.
  alternative: ಯೇಸುವಿನ ಅದ್ಭುತಾಧಿಕಾರವನ್ನು ವಿವರಣಾತ್ಮಕ ಪದಗಳಿಂದ ಮುನ್ನೆಲೆಗೆ ತರುವುದು.
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ದೇವತಾತ್ತ್ವಿಕ ಮಹತ್ವ ಸೂಚಿತವಾಗಿದ್ದರೂ, ಈ ವಾಕ್ಯದ ಗ್ರೀಕ್ ಪಠ್ಯ ಅದನ್ನು ವಿವರಿಸಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನುವಾದವು ಘಟನೆಯನ್ನು ವಿಸ್ತರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ‘ದೋಣಿಯನ್ನು ಹತ್ತಿದಾಗ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜ; ಅಕ್ಷರಶಃ ಚಲನೆಯ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
