- from: ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತಿದಾಗ[a], ಗಾಳಿ ನಿಂತುಹೋಯಿತು.
  to: ಆಮೇಲೆ ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತಿದಾಗ[a], ಗಾಳಿ ನಿಂತುಹೋಯಿತು.
  rationale: The revision retains the draft’s accurate and idiomatic rendering of entry into the boat and the wind’s ceasing. ‘ಆಮೇಲೆ’ lightly represents καί as a narrative continuation. The footnote is revised for clear, modern Kannada while preserving the more literal upward-motion wording and the post-entry temporal formulation.
