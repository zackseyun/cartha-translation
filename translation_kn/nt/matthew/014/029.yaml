id: MAT.14.29
reference: Matthew 14:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: kn
  text: ಆತನು, “ಬಾ” ಎಂದನು. ಆಗ ಪೇತ್ರನು ದೋಣಿಯಿಂದ ಇಳಿದು, ನೀರಿನ ಮೇಲೆ ನಡೆದು ಯೇಸುವಿನ ಕಡೆಗೆ ಬಂದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθέ
  choice: ಬಾ
  rationale: ἔρχομαι ಎಂಬ ಕ್ರಿಯಾಪದದ ನೇರ ಆಜ್ಞಾರ್ಥಕ ರೂಪ. ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆದ ನೇರ ಕರೆಯನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: ದೋಣಿಯಿಂದ ಇಳಿದು
  rationale: ಕೃದಂತವು ಮುಂದಿನ ಕ್ರಿಯೆಗಳಿಗೆ ಮುಂಚಿನ ಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಇಳಿದು’ ಎಂಬ ರೂಪವು ಕನ್ನಡದಲ್ಲಿ ಆ ಕ್ರಮವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πλοίου
  choice: ದೋಣಿ
  rationale: ಗಲಿಲಾಯದ ಸರೋವರದ ಈ ಕಥನಸಂದರ್ಭದಲ್ಲಿ πλοῖονಗೆ ಆಧುನಿಕ ಕನ್ನಡದ ‘ದೋಣಿ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: περιεπάτησεν
  choice: ನಡೆದು
  rationale: ಇಲ್ಲಿ περιπατέω ಸರಳವಾಗಿ ನಡೆಯುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನಡೆಯಲು ಆರಂಭಿಸಿದನು’ ಎಂಬ ಹೆಚ್ಚುವರಿ ಅರ್ಥವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἐπὶ τὰ ὕδατα
  choice: ನೀರಿನ ಮೇಲೆ
  rationale: ἐπί ಜೊತೆಗೆ ಬಂದಿರುವ ಪದಸಂಯೋಗವು ನೀರಿನ ಮೇಲ್ಮೈ ಮೇಲೆ ನಡೆದ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ನೀರಿನ ಮೇಲೆ’ ಸಹಜವಾಗಿದೆ.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: ಯೇಸುವಿನ ಕಡೆಗೆ ಬಂದನು
  rationale: πρός ಯೇಸುವಿನ ದಿಕ್ಕಿನತ್ತ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕಡೆಗೆ’ ಎಂಬುದು ಅವನು ತಲುಪಿದನೆಂದು ಅನಿವಾರ್ಯವಾಗಿ ಹೇಳದೆ ದಿಕ್ಕಿನ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆತನು … ಎಂದನು
  rationale: δέ ಇಲ್ಲಿ ಸೌಮ್ಯ ಕಥನಸಂಪರ್ಕಕವಾಗಿದೆ. ಹಿಂದಿನ ಸಂದರ್ಭದೊಂದಿಗೆ ಕನ್ನಡ ವಾಕ್ಯಕ್ರಮವೇ ಸಂಪರ್ಕವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುವುದರಿಂದ ಪ್ರತ್ಯೇಕ ಸಂಯೋಜಕವನ್ನು ಬಲವಂತವಾಗಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
theological_decisions:
- issue: ಪೇತ್ರನು ಯೇಸುವಿನತ್ತ ಮಾಡಿದ ಚಲನೆಯ ವಿವರಣೆ
  choice: ಯೇಸುವಿನ ಕಡೆಗೆ ಬಂದನು
  alternative: ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದನು
  rationale: ಗ್ರೀಕ್ πρός ಮುಖ್ಯವಾಗಿ ಯೇಸುವಿನ ದಿಕ್ಕಿನತ್ತ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಬಳಿಗೆ’ ಎಂದರೆ ತಲುಪಿದ ಅಂತ್ಯಬಿಂದುವನ್ನು ಹೆಚ್ಚು ಖಚಿತಪಡಿಸಬಹುದು. ಆದ್ದರಿಂದ ಕಥನದಲ್ಲಿರುವ ಅನಿರ್ಣೀತತೆಯನ್ನು ‘ಕಡೆಗೆ’ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ಯೇಸುವಿನ ಆಜ್ಞೆಯನ್ನು ಸಹಜ ಏಕವಚನದ ‘ಬಾ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ಗೌರವಾರ್ಥಕ ಅಥವಾ ವಿವರಣಾತ್ಮಕ ಪದಗಳನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
