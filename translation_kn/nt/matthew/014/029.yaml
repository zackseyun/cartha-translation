  source_fidelity: 'The Kannada accurately represents every principal element of the Greek: Jesus'' direct imperative (Ἐλθέ, “ಬಾ”), Peter''s descent from the boat, his walking on the water, and his movement toward Jesus. “ಯೇಸುವಿನ ಕಡೆಗೆ ಬಂದನು” appropriately preserves the directional force of πρός without requiring that Peter had already reached Jesus.'
