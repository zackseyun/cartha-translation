  terminology: “ದೋಣಿ,” “ನೀರಿನ ಮೇಲೆ,” and “ಯೇಸುವಿನ ಕಡೆಗೆ” are contextually apt and consistent with the stated lexical and theological decisions. The informal singular imperative “ಬಾ” is justified by the Greek singular command and does not add unwarranted honorific force.
