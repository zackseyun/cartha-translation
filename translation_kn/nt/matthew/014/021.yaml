  terminology: ‘ಪುರುಷರು,’ ‘ಮಹಿಳೆಯರು,’ ‘ಮಕ್ಕಳು,’ and ‘ಸುಮಾರು ಐದು ಸಾವಿರ’ are appropriate modern-standard Kannada equivalents and retain the source’s gender-specific counting distinction.
