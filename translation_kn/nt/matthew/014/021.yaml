id: MAT.14.21
reference: Matthew 14:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: kn
  text: ಊಟ ಮಾಡಿದ ಪುರುಷರು ಸುಮಾರು ಐದು ಸಾವಿರ ಮಂದಿ ಇದ್ದರು; ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಇದರಲ್ಲಿ ಲೆಕ್ಕಿಸಿರಲಿಲ್ಲ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಹೊರತುಪಡಿಸಿ.”
    reason: χωρὶς ಎಂಬ ಪದವು ಇಲ್ಲಿ ಹೇಳಲಾದ ಸಂಖ್ಯೆಯಿಂದ ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಹೊರಗಿಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಹೊರತುಪಡಿಸಿ’ ಪರ್ಯಾಯವಾಗಿ ಸಾಧ್ಯವಾಗಿದೆ.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: ಊಟ ಮಾಡಿದವರು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವರ್ತಮಾನ ಕೃದಂತವು ಊಟದಲ್ಲಿ ಪಾಲ್ಗೊಂಡವರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಊಟ ಮಾಡಿದವರು’ ಸಹಜವಾಗಿದ್ದು, ಕ್ರಿಯೆಯ ಕಾಲಾಂಶವನ್ನು ಅನಗತ್ಯವಾಗಿ ಒತ್ತಿಹೇಳುವುದಿಲ್ಲ; δέ ಯ ಸೌಮ್ಯ ನಿರೂಪಣಾ ಸಂಕ್ರಮಣವನ್ನು ಪ್ರತ್ಯೇಕ ಪದದಿಂದ ಕೃತಕವಾಗಿ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἦσαν
  choice: ಆಗಿದ್ದರು
  rationale: εἰμί ಕ್ರಿಯಾಪದದ ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಇಲ್ಲಿ ಸಂಖ್ಯೆಯನ್ನು ತಿಳಿಸುವ ಸರಳ ಸಂಯೋಜಕ ಕ್ರಿಯಾಪದವಾಗಿದೆ.
- source_word: ἄνδρες
  choice: ಪುರುಷರು
  rationale: ἀνήρ ಇಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಜನರೆಂದಲ್ಲ, ನಿರ್ದಿಷ್ಟವಾಗಿ ಪುರುಷರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳು ಪ್ರತ್ಯೇಕವಾಗಿ ಉಲ್ಲೇಖಿಸಲ್ಪಟ್ಟಿರುವುದರಿಂದ ಈ ಭೇದವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὡσεὶ
  choice: ಸುಮಾರು
  rationale: ὡσεί ಅಂದಾಜನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಸುಮಾರು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
- source_word: πεντακισχίλιοι
  choice: ಐದು ಸಾವಿರ
  rationale: ಇದು ἄνδρες ಅನ್ನು ವಿಶೇಷಿಸುವ ನೇರ ಸಂಖ್ಯಾವಾಚಕ ಪದವಾಗಿದೆ.
- source_word: χωρὶς
  choice: ಹೊರತುಪಡಿಸಿ
  rationale: ಷಷ್ಠೀ ವಿಭಕ್ತಿಯೊಡನೆ ಬಂದ χωρίς ಲೆಕ್ಕದಿಂದ ಬೇರ್ಪಡಿಸುವಿಕೆ ಅಥವಾ ಹೊರಗಿಡುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೊರತುಪಡಿಸಿ’ ಮೂಲದ ರಚನೆಗೆ ಸಮೀಪವಾಗಿದ್ದು ಕನ್ನಡದಲ್ಲೂ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: γυναικῶν
  choice: ಮಹಿಳೆಯರು
  rationale: γυνή ಎಂಬುದು ಸಂದರ್ಭಾನುಸಾರ ಮಹಿಳೆ ಅಥವಾ ಹೆಂಡತಿ ಎಂದಾಗಬಹುದು; ಇಲ್ಲಿ ವೈವಾಹಿಕ ಸಂಬಂಧದ ಸೂಚನೆಯಿಲ್ಲದ ಕಾರಣ ‘ಮಹಿಳೆಯರು’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: παιδίων
  choice: ಮಕ್ಕಳು
  rationale: παιδίον ಮಗುವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಸಂದರ್ಭದಲ್ಲಿ ವಯಸ್ಸನ್ನು ಇನ್ನಷ್ಟು ಕಿರಿದಾಗಿಸದೆ ‘ಮಕ್ಕಳು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಮಿಶ್ರ ಜನಸಮೂಹದ ಲೆಕ್ಕದಲ್ಲಿ ಲಿಂಗ-ನಿರ್ದಿಷ್ಟ ಪದ
  choice: ἄνδρες ಅನ್ನು ‘ಪುರುಷರು’ ಎಂದು ಅನುವಾದಿಸಿ, ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಲೆಕ್ಕದಿಂದ ಹೊರಗಿಟ್ಟಿರುವ ವಾಕ್ಯಾಂಶವನ್ನು ಉಳಿಸುವುದು.
  alternative: ‘ಜನರು’ ಅಥವಾ ‘ವ್ಯಕ್ತಿಗಳು’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಾಠವು ಪುರುಷರನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಎಣಿಸಿ, ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಉಲ್ಲೇಖಿಸುತ್ತದೆ. ‘ಜನರು’ ಎಂಬ ಅನುವಾದವು ಈ ಮೂಲಪಾಠದ ಮಹತ್ವದ ಭೇದವನ್ನು ಅಳಿಸಿಬಿಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ನಿರೂಪಣೆ. ‘ಮಂದಿ’ ಎಂಬ ಎಣಿಕೆಪದವನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ‘ಐದು ಸಾವಿರ ಪುರುಷರು’ ಎಂಬ ನೇರ ಸಂಖ್ಯಾ ವಿನ್ಯಾಸವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು ಅದರ ಸಂಬಂಧಿತ ‘ಹೊರತುಪಡಿಸಿ’ ವಾಕ್ಯಾಂಶದ ತಕ್ಷಣ ಇರಿಸಲಾಗಿದೆ.
