id: MAT.14.30
reference: Matthew 14:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: kn
  text: ಆದರೆ ಬಲವಾದ ಗಾಳಿಯನ್ನು[a] ಕಂಡು ಅವನು ಭಯಗೊಂಡನು. ಮುಳುಗತೊಡಗಿದಾಗ ಅವನು, “ಕರ್ತನೇ, ನನ್ನನ್ನು ರಕ್ಷಿಸು[b]!” ಎಂದು ಕೂಗಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಬಿರುಸಾದ ಗಾಳಿಯನ್ನು.”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ನನ್ನನ್ನು ಕಾಪಾಡು.” ಇಲ್ಲಿ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ತಕ್ಷಣದ ಅಪಾಯದಿಂದ ಬಿಡಿಸುವುದನ್ನೂ, ಹೆಚ್ಚು ವಿಶಾಲ ಅರ್ಥದಲ್ಲಿ ರಕ್ಷಿಸುವುದನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: ಕಂಡು
  rationale: ವರ್ತಮಾನ ಕೃದಂತರವು ಗಾಳಿಯನ್ನು ಗ್ರಹಿಸಿದ ಕ್ರಿಯೆಯನ್ನು ಮುಂದಿನ ಭಯದೊಂದಿಗೆ ಜೋಡಿಸುತ್ತದೆ; ‘ಕಂಡು’ ಕನ್ನಡದಲ್ಲಿ ಈ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಪೇತ್ರನು ಮೊದಲು ನೀರಿನ ಮೇಲೆ ನಡೆದದ್ದಕ್ಕೂ ಈಗ ಭಯಗೊಂಡದ್ದಕ್ಕೂ ಇರುವ ಕಥನಾತ್ಮಕ ವ್ಯತ್ಯಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἄνεμον ἰσχυρόν
  choice: ಬಲವಾದ ಗಾಳಿ
  rationale: ἰσχυρός ಎಂಬ ವಿಶೇಷಣದ ಮೂಲ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ; ‘ಬಿರುಸಾದ ಗಾಳಿ’ ಎಂಬ ಹೆಚ್ಚು ಚಲನಾತ್ಮಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐφοβήθη
  choice: ಭಯಗೊಂಡನು
  rationale: ಭಯವು ಆಗ ಉಂಟಾಯಿತು ಎಂಬ ಆರಂಭಾತ್ಮಕ ಭಾವವನ್ನು ‘ಭಯಗೊಂಡನು’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: ಮುಳುಗತೊಡಗಿದಾಗ
  rationale: ಮುಳುಗುವ ಪ್ರಕ್ರಿಯೆ ಆರಂಭವಾಗಿತ್ತೆಂದು ಹೇಳುತ್ತದೆ; ಅವನು ಈಗಾಗಲೇ ಸಂಪೂರ್ಣ ಮುಳುಗಿದನು ಅಥವಾ ಮುಳುಗಿ ಸತ್ತನು ಎಂಬ ಅತಿರೇಕವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἔκραξεν λέγων
  choice: ಎಂದು ಕೂಗಿದನು
  rationale: ἔκραξεν ಸೂಚಿಸುವ ಜೋರಾದ, ತುರ್ತಿನ ಮೊರೆಯನ್ನು ‘ಕೂಗಿದನು’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕನ್ನಡದ ನೇರ ಮಾತಿನ ವಿನ್ಯಾಸದಲ್ಲಿ λέγων ಅನ್ನು ‘ಎಂದು’ ಸಹಜವಾಗಿ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ.
- source_word: Κύριε
  choice: ಕರ್ತನೇ
  rationale: ಯೇಸುವಿಗೆ ನೇರ ಸಂಬೋಧನೆಯಾದ κύριος ಅನ್ನು ಗೌರವಯುತವಾಗಿ ಅನುವಾದಿಸಿ, ಪದದ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ತೂಕವನ್ನು ಅನಗತ್ಯವಾಗಿ ಕುಗ್ಗಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: σῶσόν με
  choice: ನನ್ನನ್ನು ರಕ್ಷಿಸು
  rationale: ತಕ್ಷಣದ ಅಪಾಯದಿಂದ ಬಿಡಿಸಬೇಕೆಂಬ ತುರ್ತಿನ ಆಜ್ಞಾರ್ಥಕ ಮೊರೆಯನ್ನು ನೀಡುವುದರ ಜೊತೆಗೆ σῴζω ಪದದ ವಿಶಾಲವಾದ ‘ರಕ್ಷಿಸು’ ಎಂಬ ಅರ್ಥಸಂಬಂಧವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿಗೆ ನೇರ ಸಂಬೋಧನೆಯಲ್ಲಿ κύριος ಪದದ ಅನುವಾದ
  choice: ಕರ್ತನೇ
  alternative: ಗುರುವೇ / ಒಡೆಯನೇ
  rationale: ‘ಕರ್ತನೇ’ ಎಂಬುದು κύριος ಪದದ ಸಾಮಾನ್ಯ ಧಾರ್ಮಿಕ ಮತ್ತು ಕಥನಾತ್ಮಕ ತೂಕವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯಗಳು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅದರ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸಬಹುದು.
- issue: ತಕ್ಷಣದ ದೈಹಿಕ ಅಪಾಯದ ಸಂದರ್ಭದಲ್ಲಿ σῴζω ಪದದ ಅನುವಾದ
  choice: ರಕ್ಷಿಸು
  alternative: ಕಾಪಾಡು
  rationale: ಸಂದರ್ಭವು ನೀರಿನಲ್ಲಿ ಮುಳುಗುವ ಅಪಾಯವನ್ನು ಸೂಚಿಸಿದರೂ, ‘ರಕ್ಷಿಸು’ ತಕ್ಷಣದ ಬಿಡಿಸಿಕೊಡುವಿಕೆಯನ್ನು ಹೇಳುವುದರ ಜೊತೆಗೆ ಕ್ರಿಯಾಪದದ ವಿಶಾಲ ಅರ್ಥಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಚಿಕ್ಕ ವಾಕ್ಯಗಳು ಘಟನೆಯ ತುರ್ತನ್ನೂ ಪೇತ್ರನ ಕೂಗಿನ ತೀವ್ರತೆಯನ್ನೂ ಉಳಿಸುತ್ತವೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತುಗಳನ್ನು ಅವು ಸಂಬಂಧಿಸುವ ‘ಗಾಳಿ’ ಮತ್ತು ‘ರಕ್ಷಿಸು’ ಪದಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
