revisions:
- from: ಕೂಡಲೇ ಯೇಸು ಶಿಷ್ಯರನ್ನು ದೋಣಿಯನ್ನು ಹತ್ತಿ, ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಆಚೆಯ ದಡಕ್ಕೆ ಹೋಗುವಂತೆ ಬಲವಂತಪಡಿಸಿದನು. ಅಷ್ಟರಲ್ಲಿ ತಾನು ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡುವುದಾಗಿ ಹೇಳಿದನು.
  to: ಕೂಡಲೇ ಯೇಸು ಶಿಷ್ಯರನ್ನು ದೋಣಿಗೆ ಹತ್ತಿ, ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಆಚೆಯ ದಡಕ್ಕೆ ಹೋಗುವಂತೆ ಬಲವಂತಪಡಿಸಿದನು; ತಾನು ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡುವ ತನಕ.
  rationale: 'The revision removes the unsupported reference to Jesus speaking and restores the temporal force of ἕως οὗ: the disciples are to go ahead while Jesus remains until he dismisses the crowds. It also uses the more natural Kannada expression for boarding a boat, without altering the verse''s meaning.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the immediate action, the strong force of ἠνάγκασεν, boarding the boat, going ahead, and the opposite shore. However, its final sentence changes ἕως οὗ ἀπολύσῃ τοὺς ὄχλους ('until he dismisses/sends away the crowds') into a statement that Jesus said he would send the crowds away. The Greek contains neither 'said' nor a separate completed assertion; the clause sets a temporal limit on the disciples' departure ahead of him.
  naturalness: Most wording is natural modern standard Kannada. 'ದೋಣಿಗೆ ಹತ್ತಿ' is more idiomatic than 'ದೋಣಿಯನ್ನು ಹತ್ತಿ' here. Recasting the verse as one sentence more naturally preserves the Greek temporal relationship.
  terminology: '''ಶಿಷ್ಯರನ್ನು,'' ''ಬಲವಂತಪಡಿಸಿದನು,'' ''ಆಚೆಯ ದಡಕ್ಕೆ,'' and ''ಜನಸಮೂಹಗಳನ್ನು'' are suitable in register and meaning. No doctrinally loaded terminology is introduced.'
  issues:
  - severity: high
    issue: The phrase 'ಅಷ್ಟರಲ್ಲಿ ತಾನು ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡುವುದಾಗಿ ಹೇಳಿದನು' adds 'ಹೇಳಿದನು' ('he said') and fails to express the temporal 'until' clause.
    rationale: ἕως οὗ ἀπολύσῃ τοὺς ὄχλους means 'until he dismisses/sends away the crowds.' It does not report speech or merely an intention.
  - severity: low
    issue: '''ದೋಣಿಯನ್ನು ಹತ್ತಿ'' is less idiomatic than ''ದೋಣಿಗೆ ಹತ್ತಿ.'''
    rationale: With the sense of boarding, modern Kannada normally uses the destination form 'ದೋಣಿಗೆ ಹತ್ತಿ.'
  revised_text: ಕೂಡಲೇ ಯೇಸು ಶಿಷ್ಯರನ್ನು ದೋಣಿಗೆ ಹತ್ತಿ, ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಆಚೆಯ ದಡಕ್ಕೆ ಹೋಗುವಂತೆ ಬಲವಂತಪಡಿಸಿದನು; ತಾನು ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡುವ ತನಕ.
  revised_footnotes: []
  revision_rationale: 'The revision removes the unsupported reference to Jesus speaking and restores the temporal force of ἕως οὗ: the disciples are to go ahead while Jesus remains until he dismisses the crowds. It also uses the more natural Kannada expression for boarding a boat, without altering the verse''s meaning.'
