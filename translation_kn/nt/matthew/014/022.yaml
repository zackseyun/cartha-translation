id: MAT.14.22
reference: Matthew 14:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: kn
  text: ಕೂಡಲೇ ಯೇಸು ಶಿಷ್ಯರನ್ನು ದೋಣಿಗೆ ಹತ್ತಿ, ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಆಚೆಯ ದಡಕ್ಕೆ ಹೋಗುವಂತೆ ಬಲವಂತಪಡಿಸಿದನು; ತಾನು ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡುವ ತನಕ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: ಕೂಡಲೇ
  rationale: ಘಟನೆ ತಕ್ಷಣ ಮುಂದುವರಿದುದನ್ನು ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἠνάγκασεν
  choice: ಬಲವಂತಪಡಿಸಿದನು
  rationale: ἀναγκάζω ಪದದಲ್ಲಿರುವ ಬಲವಾದ ಒತ್ತಾಯ ಅಥವಾ ನಿರ್ಬಂಧದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ದೈಹಿಕ ಬಲಪ್ರಯೋಗವನ್ನು ಅನಿವಾರ್ಯವಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: τοὺς μαθητάς
  choice: ಶಿಷ್ಯರನ್ನು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಪರಿಚಿತವಾಗಿರುವ ಶಿಷ್ಯರ ಗುಂಪನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ನಿರ್ದಿಷ್ಟ ಲೇಖನ ಅಗತ್ಯವಿಲ್ಲ.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: ದೋಣಿಯನ್ನು ಹತ್ತಿ
  rationale: ದೋಣಿಯೊಳಗೆ ಪ್ರವೇಶಿಸಿ ಪ್ರಯಾಣ ಆರಂಭಿಸುವ ಕ್ರಿಯೆಗೆ ಸಹಜವಾದ ಕನ್ನಡ ನುಡಿಗಟ್ಟು.
- source_word: πλοῖον
  choice: ದೋಣಿ
  rationale: ಸಂದರ್ಭದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ದೋಣಿಯನ್ನು ಕನ್ನಡವು ಲೇಖನವಿಲ್ಲದೆ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: προάγειν αὐτόν
  choice: ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ... ಹೋಗುವಂತೆ
  rationale: ಶಿಷ್ಯರು ಯೇಸುವಿಗಿಂತ ಮೊದಲು ಹೊರಟು ಹೋಗಬೇಕೆಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς τὸ πέραν
  choice: ಆಚೆಯ ದಡಕ್ಕೆ
  rationale: ಜಲಾಶಯದ ಎದುರು ದಡವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ ಕನ್ನಡ ರೂಪ.
- source_word: ἕως οὗ ἀπολύσῃ τοὺς ὄχλους
  choice: ಅಷ್ಟರಲ್ಲಿ ತಾನು ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡುವುದಾಗಿ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಸಂಬಂಧಿಸಿದ ಮುಂದಿನ ಉದ್ದೇಶಿತ ಕಾರ್ಯವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯಸಂಯೋಜನೆಯಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τοὺς ὄχλους
  choice: ಜನಸಮೂಹಗಳನ್ನು
  rationale: ಗ್ರೀಕ್‌ನ ಬಹುವಚನವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ ಮತ್ತು ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಪದವನ್ನು ಬಳಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ನಿರೂಪಣಾತ್ಮಕ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ಕರ್ತೃ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಪ್ರಕಟವಾಗಿದ್ದರೂ ಸಂದರ್ಭದ ಸ್ಪಷ್ಟತೆಗಾಗಿ ‘ಯೇಸು’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
