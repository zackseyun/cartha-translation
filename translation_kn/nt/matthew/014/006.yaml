  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: kn
  text: ಆದರೆ ಹೆರೋದನ ಹುಟ್ಟುಹಬ್ಬದ ಆಚರಣೆ ಬಂದಾಗ[a], ಹೆರೋದ್ಯಳ ಮಗಳು ಮಧ್ಯದಲ್ಲಿ ನೃತ್ಯಮಾಡಿ ಹೆರೋದನನ್ನು ಮೆಚ್ಚಿಸಿದಳು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹೆರೋದನ ಹುಟ್ಟುಹಬ್ಬ ಬಂದಾಗ’ ಅಥವಾ ‘ಹೆರೋದನ ಹುಟ್ಟುಹಬ್ಬದ ಔತಣಕೂಟದಲ್ಲಿ.’ ಗ್ರೀಕ್ ಪದಗಳು ಹೆರೋದನ ಹುಟ್ಟುಹಬ್ಬವನ್ನು ಆಚರಿಸಿದ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತವೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, ‘ಮಧ್ಯದಲ್ಲಿ.’ ಬಹುಶಃ ಆಕೆ ಅಲ್ಲಿ ನೆರೆದಿದ್ದವರ ಮಧ್ಯದಲ್ಲಿ ನೃತ್ಯಮಾಡಿದಳು ಎಂಬರ್ಥ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: ಹೆರೋದನ ಹುಟ್ಟುಹಬ್ಬದ ಆಚರಣೆ ಬಂದಾಗ
  rationale: γενέσια ಇಲ್ಲಿ ಕೇವಲ ಹುಟ್ಟಿದ ದಿನಾಂಕವನ್ನಲ್ಲ, ಹುಟ್ಟುಹಬ್ಬವನ್ನು ಆಚರಿಸುವ ಸಂದರ್ಭವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ. ‘ಆಚರಣೆ ಬಂದಾಗ’ ಎಂಬುದು ಘಟನೆಯ ಕಾಲಸಂದರ್ಭವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: δέ ಕಥನವನ್ನು ಮುಂದುವರಿಸುತ್ತಾ ಹಿಂದಿನ ಸಂದರ್ಭದೊಂದಿಗೆ ಸೌಮ್ಯವಾದ ವೈರುಧ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ಹೆರೋದ್ಯಳ ಮಗಳು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಮಗಳಿಗೆ ಮೂಲಪಠ್ಯದಲ್ಲಿ ಇಲ್ಲದ ಹೆಸರನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ὠρχήσατο
  choice: ನೃತ್ಯಮಾಡಿ
  rationale: ಕ್ರಿಯಾಪದದ ಸರಳ ಅರ್ಥ ‘ನೃತ್ಯಮಾಡಿದಳು’; ಪ್ರದರ್ಶನದ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿವರಿಸುವುದಿಲ್ಲ.
- source_word: ἐν τῷ μέσῳ
  choice: ನೆರೆದವರ ಮಧ್ಯದಲ್ಲಿ
  rationale: ಅಕ್ಷರಶಃ ‘ಮಧ್ಯದಲ್ಲಿ’ ಎಂದರ್ಥ. ಸಂದರ್ಭದ ಪ್ರಕಾರ ಅದು ಅಲ್ಲಿ ನೆರೆದಿದ್ದವರ ಮಧ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅರ್ಥಗ್ರಾಹ್ಯತೆಗಾಗಿ ‘ನೆರೆದವರ’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: ಹೆರೋದನನ್ನು ಮೆಚ್ಚಿಸಿದಳು
  rationale: ἀρέσκω ಮತ್ತು ದತ್ತಿವಿಭಕ್ತಿಯ ಸಹಜ ಕನ್ನಡ ನಿರೂಪಣೆ; ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ಭಾವವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: ಹೆರೋದ
  rationale: ವ್ಯಕ್ತಿನಾಮದ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ಲಿಪ್ಯಂತರ.
