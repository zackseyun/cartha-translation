- from: ಆದರೆ ಯೇಸು ಅವರಿಗೆ, “ಅವರು ಹೋಗಬೇಕಾದ ಅಗತ್ಯವಿಲ್ಲ; ನೀವೇ ಅವರಿಗೆ ತಿನ್ನಲು ಕೊಡಿ” ಎಂದನು.
  to: ಆದರೆ ಯೇಸು ಅವರಿಗೆ, “ಅವರು ಹೋಗುವ ಅಗತ್ಯವಿಲ್ಲ; ನೀವೇ ಅವರಿಗೆ ತಿನ್ನಲು ಏನಾದರೂ ಕೊಡಿ,” ಎಂದನು.
  rationale: The revision retains the Greek contrast and the explicit emphasis on the disciples ('ನೀವೇ'), while using idiomatic Kannada for the crowd's lack of need to leave and for the command to provide something to eat. No footnote is needed, since the source does not present a textual ambiguity requiring annotation and the English lexical-alternative note is not essential in Kannada.
  reviewer_model: gpt-5.6-terra
