id: MAT.14.16
reference: Matthew 14:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: kn
  text: ಆದರೆ ಯೇಸು ಅವರಿಗೆ, “ಅವರು ಹೋಗುವ ಅಗತ್ಯವಿಲ್ಲ; ನೀವೇ ಅವರಿಗೆ ತಿನ್ನಲು ಏನಾದರೂ ಕೊಡಿ,” ಎಂದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಶಿಷ್ಯರು ಜನರನ್ನು ಕಳುಹಿಸಿಬಿಡಬೇಕೆಂದು ಹೇಳಿದ್ದಕ್ಕೆ ಯೇಸುವಿನ ಮಾತು ಸೌಮ್ಯವಾದ ವ್ಯತಿರಿಕ್ತತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: εἶπεν αὐτοῖς
  choice: ಅವರಿಗೆ ... ಎಂದನು
  rationale: ಕನ್ನಡದ ಸಹಜ ನೇರಮಾತಿನ ವಿನ್ಯಾಸದಲ್ಲಿ ಸರಳವಾದ ನಿರೂಪಣಾ ಪರಿಚಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: ಅವರು ... ಅಗತ್ಯವಿಲ್ಲ
  rationale: χρεία ಎಂಬುದರ ‘ಅಗತ್ಯ, ಅವಶ್ಯಕತೆ’ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀπελθεῖν
  choice: ಹೋಗಬೇಕಾದ
  rationale: ಈ ಸ್ಥಳದಿಂದ ಜನರು ಹೊರಟುಹೋಗುವ ಸಂದರ್ಭವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: δότε
  choice: ಕೊಡಿ
  rationale: ಎರಡನೆಯ ಪುರುಷ ಬಹುವಚನದ ಆಜ್ಞಾರ್ಥವನ್ನು ಗೌರವಪೂರ್ಣ/ಬಹುವಚನ ಕನ್ನಡ ರೂಪದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ಈ ಸರ್ವನಾಮವು ಜನಸಮೂಹವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὑμεῖς
  choice: ನೀವೇ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿರುವ ಸ್ಪಷ್ಟ ಕರ್ತೃಸರ್ವನಾಮದ ಒತ್ತನ್ನು ಉಳಿಸಿ, ಆಹಾರ ಕೊಡುವವರು ಶಿಷ್ಯರೇ ಎಂಬುದನ್ನು ತೋರಿಸುತ್ತದೆ.
- source_word: φαγεῖν
  choice: ತಿನ್ನಲು
  rationale: δίδωμι ಜೊತೆಯಲ್ಲಿರುವ infinitive ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಅವರಿಗೆ ತಿನ್ನಲು ಕೊಡಿ’ ಎಂದು ಸಹಜವಾಗಿಯೇ ಹೇಳಬಹುದು; ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಏನನ್ನಾದರೂ’ ಅಥವಾ ‘ಆಹಾರ’ ಸೇರಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಆಜ್ಞೆಯಲ್ಲಿ ಶಿಷ್ಯರ ಪಾತ್ರಕ್ಕೆ ಇರುವ ಒತ್ತು
  choice: ὑμεῖς ಅನ್ನು ಒತ್ತಿನ ‘ನೀವೇ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಒತ್ತಿಲ್ಲದೆ ‘ನೀವು’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಧಾರ್ಮಿಕ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸರಳ, ಘನತೆಯುಳ್ಳ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ನೇರಮಾತಿನ ಶೈಲಿ. ಮೂಲದಲ್ಲಿನ ಸೌಮ್ಯ ವ್ಯತಿರಿಕ್ತತೆ ಮತ್ತು ὑμεῖς ಮೇಲಿನ ಒತ್ತು ಉಳಿಸಲಾಗಿದೆ.
