id: MAT.14.14
reference: Matthew 14:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: kn
  text: ಅವರು ದೋಣಿಯಿಂದ ಇಳಿದು ದಡಕ್ಕೆ ಬಂದಾಗ[a], ದೊಡ್ಡ ಜನಸಮೂಹವನ್ನು ಕಂಡರು. ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟು, ಅವರಲ್ಲಿದ್ದ ರೋಗಿಗಳನ್ನು ಗುಣಪಡಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ಹೆಚ್ಚು ಪದಶಃ, ‘ಹೊರಗೆ ಬಂದಾಗ.’ ಸನ್ನಿವೇಶದಲ್ಲಿ ಇದು ದೋಣಿಯಿಂದ ಇಳಿದು ದಡಕ್ಕೆ ಬಂದದ್ದನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ದೋಣಿಯಿಂದ ಇಳಿದು ದಡಕ್ಕೆ ಬಂದಾಗ
  rationale: ಪದಶಃ ‘ಹೊರಗೆ ಬಂದಾಗ’ ಎಂದರ್ಥ. ಹಿಂದಿನ ವಚನದ ದೋಣಿ-ಪ್ರಯಾಣದ ಸನ್ನಿವೇಶದಲ್ಲಿ ದಡಕ್ಕೆ ಬಂದ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ದೋಣಿಯಿಂದ’ ಎಂಬುದು ಸಂದರ್ಭಾಧಾರಿತ ಸ್ಪಷ್ಟೀಕರಣ.
- source_word: εἶδεν
  choice: ಕಂಡರು
  rationale: ὁράω ಕ್ರಿಯಾಪದದ ಸರಳ ಭೂತಕಾಲದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: πολὺν ὄχλον
  choice: ದೊಡ್ಡ ಜನಸಮೂಹವನ್ನು
  rationale: πολύς ಪದದ ಪ್ರಮಾಣಸೂಚಕ ಅರ್ಥವನ್ನೂ ὄχλος ಪದದ ‘ಜನಸಮೂಹ’ ಅರ್ಥವನ್ನೂ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟು
  rationale: ಆಳವಾದ ಕರುಣೆ ಅಥವಾ ಕನಿಕರವನ್ನು ಸೂಚಿಸುವ σπλαγχνίζομαι ಪದದ ಭಾವನಾತ್ಮಕ ಬಲವನ್ನು ಅತಿಶಯಿಸದೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐθεράπευσεν
  choice: ಗುಣಪಡಿಸಿದರು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ θεραπεύω ದೈಹಿಕ ಕಾಯಿಲೆಯಿಂದ ಗುಣಪಡಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: ಅವರಲ್ಲಿದ್ದ ರೋಗಿಗಳನ್ನು
  rationale: αὐτῶν ಅನ್ನು ಜನಸಮೂಹಕ್ಕೆ ಸಂಬಂಧಿಸಿದಂತೆ ಗ್ರಹಿಸಿ, ಆ ಜನರ ನಡುವೆ ಇದ್ದ ಅಸ್ವಸ್ಥರನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಅವರ ರೋಗಿಗಳು’ ಎಂಬ ಅಸಹಜ ಅಥವಾ ಸ್ವಾಮ್ಯಸೂಚಕ ಭಾವವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಭಾವನಾತ್ಮಕ ಪ್ರತಿಕ್ರಿಯೆಯ ನಿರೂಪಣೆ
  choice: ಅವರ ಮೇಲೆ ಕನಿಕರಪಟ್ಟು
  alternative: ಅವರಿಗಾಗಿ ಕನಿಕರದಿಂದ ಮನಮರುಗಿ
  rationale: ಮೂಲಪಠ್ಯವು ಯೇಸುವಿನ ಆಳವಾದ ಕನಿಕರವನ್ನು ಅವರ ಗುಣಪಡಿಸುವ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಜೋಡಿಸುತ್ತದೆ. ಆಯ್ದ ರೂಪವು ಈ ಒತ್ತನ್ನು ಉಳಿಸಿಕೊಂಡು, ಮೂಲದಲ್ಲಿಲ್ಲದ ಭಾವನಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಸೂಚಕ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪಗಳನ್ನು ಬಳಸಿ, ಸರಳವಾದರೂ ಘನತೆಯ ನಿರೂಪಣೆಯನ್ನು ಕಾಪಾಡಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಕ್ರಮವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಗೆ ಹೊಂದಿಸಲಾಗಿದೆ.
