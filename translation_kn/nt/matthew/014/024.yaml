  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ಮೂಲದ ಪ್ರಾಚೀನ ಅಳತೆಯನ್ನು ಉಳಿಸಿ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ. γάρ ಸೂಚಿಸುವ ಕಾರಣಸಂಬಂಧವನ್ನು ಕನ್ನಡದ ಸಹಜ ಪದಕ್ರಮಕ್ಕಾಗಿ ವಾಕ್ಯದ ಮುಂಭಾಗಕ್ಕೆ ತರಲಾಗಿದೆ; ಅರ್ಥಸಂಬಂಧ ಬದಲಾಗಿಲ್ಲ.
