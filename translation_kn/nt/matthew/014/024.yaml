id: MAT.14.24
reference: Matthew 14:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: kn
  text: ಆದರೆ ದೋಣಿಯು ಆಗಲೇ ದಡದಿಂದ ಅನೇಕ ಸ್ಟೇಡಿಯಗಳಷ್ಟು ದೂರದಲ್ಲಿತ್ತು[a][b]; ಗಾಳಿ ಅದಕ್ಕೆ ಎದುರಾಗಿದ್ದರಿಂದ, ಅಲೆಗಳು ಅದನ್ನು ಬಲವಾಗಿ ಅಪ್ಪಳಿಸುತ್ತಿದ್ದವು[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ನೆಲದಿಂದ’ ಅಥವಾ ‘ಭೂಮಿಯಿಂದ’ ಎಂದಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಒಂದು ಸ್ಟೇಡಿಯವು ಪ್ರಾಚೀನ ದೂರಮಾನವಾಗಿದ್ದು, ಸುಮಾರು 185 ಮೀಟರ್.
    reason: cultural_note
  - marker: c
    text: ಅಥವಾ ‘ಅಲೆಗಳಿಂದ ದೋಣಿಯು ಬಡಿದುಕೊಳ್ಳುತ್ತಿತ್ತು.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: ದೋಣಿ
  rationale: ಗಲಿಲಾಯ ಸರೋವರದ ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ πλοῖονಗೆ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಮತ್ತು ಅತಿಯಾದ ಗಾತ್ರವನ್ನು ಸೂಚಿಸದ ಪದ.
- source_word: ἤδη
  choice: ಆಗಲೇ
  rationale: ಕಥನದ ಈ ಹಂತಕ್ಕೆ ಪರಿಸ್ಥಿತಿ ಈಗಾಗಲೇ ಉಂಟಾಗಿತ್ತು ಎಂಬ ಕಾಲಸೂಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: σταδίους πολλοὺς
  choice: ಅನೇಕ ಸ್ಟೇಡಿಯಗಳಷ್ಟು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಪ್ರಾಚೀನ ದೂರಮಾನವನ್ನು ಸಾಮಾನ್ಯೀಕರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ; ಅದರ ಅಂದಾಜು ಮೌಲ್ಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
- source_word: ἀπὸ τῆς γῆς
  choice: ದಡದಿಂದ
  rationale: γῆ ಅಕ್ಷರಶಃ ‘ನೆಲ/ಭೂಮಿ’ ಎಂದಾದರೂ, ನೀರಿನ ಮೇಲಿರುವ ದೋಣಿಯ ದೂರವನ್ನು ಸೂಚಿಸುವ ಈ ಸಂದರ್ಭದಲ್ಲಿ ‘ದಡದಿಂದ’ ಎಂಬುದು ಸಹಜ ಮತ್ತು ನಿಖರ.
- source_word: ἀπεῖχεν
  choice: ದೂರದಲ್ಲಿತ್ತು
  rationale: ಸ್ಥಳೀಯ ಅಂತರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: βασανιζόμενον
  choice: ಬಲವಾಗಿ ಅಪ್ಪಳಿಸುತ್ತಿದ್ದವು
  rationale: ಮೂಲ ಕ್ರಿಯಾಪದದ ತೀವ್ರ ಸಂಕಟಪಡಿಸುವ ಅಥವಾ ಹೊಡೆತಕ್ಕೊಳಪಡಿಸುವ ಭಾವವನ್ನು ಸಮುದ್ರಯಾನದ ಸಂದರ್ಭದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಕನ್ನಡ ವಾಕ್ಯರಚನೆಗಾಗಿ ಅಲೆಗಳನ್ನು ಕರ್ತೃವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ.
- source_word: ὑπὸ τῶν κυμάτων
  choice: ಅಲೆಗಳು ಅದನ್ನು
  rationale: ಗ್ರೀಕ್ ಕರ್ಮಣಿ ಪ್ರಯೋಗದ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಕರ್ತರಿ ವಾಕ್ಯವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἐναντίος
  choice: ಎದುರಾಗಿದ್ದುದರಿಂದ
  rationale: ಗಾಳಿ ದೋಣಿಯ ಸಾಗುವ ದಿಕ್ಕಿಗೆ ವಿರುದ್ಧವಾಗಿತ್ತು ಎಂಬ ಸಂಬಂಧವನ್ನು ಸಂದರ್ಭಾನುಸಾರ ತಿಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಯೇಸು ದಡದಲ್ಲಿದ್ದ ಹಿಂದಿನ ದೃಶ್ಯದಿಂದ ಸಂಕಟದಲ್ಲಿದ್ದ ದೋಣಿಯ ಕಡೆಗೆ ಆಗುವ ಸೌಮ್ಯ ವೈರುಧ್ಯಪೂರ್ಣ ಬದಲಾವಣೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: γάρ
  choice: -ದ್ದರಿಂದ
  rationale: ಗಾಳಿಯ ವಿರೋಧವೇ ಅಲೆಗಳ ಹೊಡೆತಕ್ಕೆ ಕಾರಣವೆಂಬ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಮುಂಚಿತ ಕಾರಣವಾಕ್ಯದಿಂದ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
