id: MAT.14.31
reference: Matthew 14:31
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: kn
  text: ತಕ್ಷಣವೇ ಯೇಸು ಕೈಚಾಚಿ ಅವನನ್ನು ಹಿಡಿದುಕೊಂಡು, “ಅಲ್ಪವಿಶ್ವಾಸಿಯೇ, ನೀನು ಏಕೆ ಸಂದೇಹಪಟ್ಟೆ?[a]” ಎಂದು ಅವನಿಗೆ ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಏಕೆ ಹಿಂಜರಿದೆ?” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸಂದೇಹಪಡುವುದರ ಜೊತೆಗೆ ಹಿಂಜರಿಯುವುದು ಅಥವಾ ಮನಸ್ಸು ಅಲುಗಾಡುವುದನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ತಕ್ಷಣವೇ
  rationale: ಕ್ರಿಯೆಯ ತತ್ಕ್ಷಣತೆಯನ್ನೂ ಕಥನದ ತುರಿತವನ್ನೂ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಇದು ಇಲ್ಲಿ ಸೌಮ್ಯವಾದ ಕಥನ-ಸಂಪರ್ಕಕ; ಕನ್ನಡ ವಾಕ್ಯಕ್ರಮದಲ್ಲೇ ಸಂಬಂಧ ಸ್ಪಷ್ಟವಾಗುವುದರಿಂದ ಪ್ರತ್ಯೇಕ ಪದ ಸೇರಿಸಿದರೆ ಅನಗತ್ಯ ಭಾರ ಉಂಟಾಗುತ್ತದೆ.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: ಕೈಚಾಚಿ
  rationale: ಮೂಲದ ದೃಶ್ಯಾತ್ಮಕ ಕ್ರಿಯೆಯನ್ನೂ ಮುಂದಿನ ಕ್ರಿಯೆಗೆ ಮುನ್ನ ನಡೆದ ಕ್ರಮವನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐπελάβετο αὐτοῦ
  choice: ಅವನನ್ನು ಹಿಡಿದುಕೊಂಡು
  rationale: ಮುಳುಗುತ್ತಿದ್ದ ಪೇತ್ರನನ್ನು ಯೇಸು ಭದ್ರವಾಗಿ ಹಿಡಿದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಹಿಡಿದುಕೊಂಡು’ ಎಂಬುದು ಮೂಲದ ಹಿಡಿಯುವ ಅರ್ಥವನ್ನು ಅತಿವ್ಯಾಖ್ಯಾನವಿಲ್ಲದೆ ನೀಡುತ್ತದೆ.
- source_word: λέγει αὐτῷ
  choice: ಎಂದು ಅವನಿಗೆ ಹೇಳಿದರು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವಿದ್ದರೂ, ಕನ್ನಡ ಕಥನದಲ್ಲಿ ಭೂತಕಾಲವು ಹೆಚ್ಚು ಸಹಜ; ಸಂಭಾಷಣೆಯ ಜೀವಂತಿಕೆ ನೇರ ಉಕ್ತಿಯಿಂದ ಉಳಿಯುತ್ತದೆ.
- source_word: Ὀλιγόπιστε
  choice: ಅಲ್ಪವಿಶ್ವಾಸಿಯೇ
  rationale: ಅವಿಶ್ವಾಸಿ ಎಂದು ಅತಿಯಾಗಿ ಹೇಳದೆ, ವಿಶ್ವಾಸದ ಕೊರತೆಯನ್ನು ನೇರ ಸಂಬೋಧನೆಯ ರೂಪದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς τί
  choice: ಏಕೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಕಾರಣವನ್ನು ಕೇಳುವ ಗ್ರೀಕ್ ಪದಗುಚ್ಛಕ್ಕೆ ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ἐδίστασας
  choice: ಸಂದೇಹಪಟ್ಟೆ
  rationale: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟವಾದ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ಹಿಂಜರಿಕೆ ಅಥವಾ ಮನಸ್ಸು ಅಲುಗಾಡುವ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: Ὀλιγόπιστε ಎಂಬ ಸಂಬೋಧನೆಯಲ್ಲಿ πίστις ಸಂಬಂಧಿತ ಅರ್ಥ
  choice: ಅಲ್ಪವಿಶ್ವಾಸಿಯೇ
  alternative: ನಿನಗೆ ವಿಶ್ವಾಸ ಕಡಿಮೆಯಿದೆ
  rationale: ಪೇತ್ರನನ್ನು ಸಂಪೂರ್ಣ ಅವಿಶ್ವಾಸಿ ಎಂದು ಘೋಷಿಸದೆ ಅವನ ವಿಶ್ವಾಸದ ಕೊರತೆಯನ್ನೇ ಗದರಿಕೆಯ ಕೇಂದ್ರವಾಗಿರಿಸುತ್ತದೆ; ಮೂಲದ ನೇರ ಸಂಬೋಧನೆಯ ತೀಕ್ಷ್ಣತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- issue: ἐδίστασας ಎಂಬ ಕ್ರಿಯಾಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ಸಂದೇಹಪಟ್ಟೆ
  alternative: ಹಿಂಜರಿದೆ / ಮನಸ್ಸು ಅಲುಗಾಡಿತು
  rationale: ಇದು ಸ್ಥಿರವಾದ ಅವಿಶ್ವಾಸಕ್ಕಿಂತ ಸಂದೇಹ ಅಥವಾ ದ್ವಂದ್ವವನ್ನು ಸೂಚಿಸಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಪರಿಚಿತ ಪದವನ್ನು ಬಳಸಿ, ಮೂಲದ ಉಳಿದ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ‘ಅಲ್ಪವಿಶ್ವಾಸಿಯೇ’ ಎಂಬ ಸ್ವಲ್ಪ ಸಾಹಿತ್ಯಿಕವಾದರೂ ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಸಂಬೋಧನೆ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆ ಮತ್ತು ಧಾರ್ಮಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಂಬಂಧಿತ ಪದದ ತಕ್ಷಣ ಇರಿಸಲಾಗಿದೆ.
