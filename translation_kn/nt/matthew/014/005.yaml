- from: ಅವನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ಬಯಸುತ್ತಿದ್ದರೂ[a], ಅವನು ಜನಸಮೂಹಕ್ಕೆ ಹೆದರಿದನು; ಏಕೆಂದರೆ ಅವರು ಅವನನ್ನು ಪ್ರವಾದಿಯೆಂದು ಪರಿಗಣಿಸಿದ್ದರು.[b]
