id: MAT.14.5
reference: Matthew 14:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: kn
  text: ಅವನನ್ನು ಕೊಲ್ಲಲು ಬಯಸುತ್ತಿದ್ದರೂ[a], ಅವನು ಜನಸಮೂಹಕ್ಕೆ ಹೆದರಿದನು; ಏಕೆಂದರೆ ಅವರು ಅವನನ್ನು ಪ್ರವಾದಿಯೆಂದು ಪರಿಗಣಿಸುತ್ತಿದ್ದರು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಇನ್ನಷ್ಟು ಪದಶಃ: “ಅವನನ್ನು ಕೊಲ್ಲಲು ಬಯಸುತ್ತಾ, ಅವನು ಜನಸಮೂಹಕ್ಕೆ ಹೆದರಿದನು.” ಸಂದರ್ಭದ ಪ್ರಕಾರ ಕೃದಂತವನ್ನು “ಬಯಸುತ್ತಿದ್ದರೂ” ಎಂಬ ಒಪ್ಪಿತಾರ್ಥದಲ್ಲಿ ಅನುವಾದಿಸಲಾಗಿದೆ.'
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಅವರು ಅವನನ್ನು ಪ್ರವಾದಿಯೆಂದು ಎಣಿಸುತ್ತಿದ್ದರು.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: ಬಯಸುತ್ತಿದ್ದರೂ
  rationale: 'ವರ್ತಮಾನ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸಂದರ್ಭಾನುಸಾರ ಒಪ್ಪಿತಾರ್ಥಕ ಸಂಬಂಧ ಹೊಂದಿದೆ: ಅವನನ್ನು ಕೊಲ್ಲುವ ಬಯಕೆ ಇದ್ದರೂ ಜನಸಮೂಹದ ಭಯದಿಂದ ಹಾಗೆ ಮಾಡಲಿಲ್ಲ. ಕನ್ನಡದಲ್ಲಿ ಈ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.'
- source_word: ἀποκτεῖναι
  choice: ಕೊಲ್ಲಬೇಕೆಂದು
  rationale: ಕ್ರಿಯಾಪದವು ನೇರವಾಗಿ ‘ಕೊಲ್ಲು’ ಅಥವಾ ‘ಸಾಯಿಸು’ ಎಂದರ್ಥ. ‘ಕೊಲೆಮಾಡು’ ಎಂದರೆ ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲದ ನೈತಿಕ/ಕಾನೂನು ಛಾಯೆ ಸೇರುವ ಸಾಧ್ಯತೆ ಇದೆ.
- source_word: ἐφοβήθη
  choice: ಹೆದರಿದನು
  rationale: φοβέομαι ಎಂಬ ಕ್ರಿಯೆಯ ಭೂತಕಾಲರೂಪವು ಇಲ್ಲಿ ‘ಹೆದರಿದನು’ ಅಥವಾ ‘ಭಯಪಟ್ಟನು’ ಎಂಬ ಸರಳ ಅರ್ಥ ನೀಡುತ್ತದೆ; ‘ಹೆದರಿದನು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದೆ.
- source_word: τὸν ὄχλον
  choice: ಜನಸಮೂಹಕ್ಕೆ
  rationale: ὄχλος ಎಂದರೆ ಒಟ್ಟುಗೂಡಿದ ಜನರು ಅಥವಾ ಜನಸಮೂಹ. ‘ಜನಸಮೂಹ’ ಗೌರವಯುತವಾಗಿಯೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿಯೂ ಇದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಇದು ಹೆದರಿಕೆಯ ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ; ‘ಏಕೆಂದರೆ’ ಕಾರಣಾರ್ಥವನ್ನು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὡς προφήτην
  choice: ಪ್ರವಾದಿಯೆಂದು
  rationale: ὡς ಮತ್ತು ವಿಧೇಯ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯ ರಚನೆಯು ಯೋಹಾನನನ್ನು ಅವರು ಹೇಗೆ ಎಣಿಸಿದ್ದರು ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಪ್ರವಾದಿಯೆಂದು’ ಈ ನಿರ್ಣಯವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹಿಡಿದಿಡುತ್ತದೆ.
- source_word: αὐτὸν εἶχον
  choice: ಅವನನ್ನು … ಪರಿಗಣಿಸಿದ್ದರು
  rationale: ἔχω ಜೊತೆಗೆ ವಿಧೇಯ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿ ಬಂದಾಗ ‘ಹಾಗೆ ಎಣಿಸು/ಪರಿಗಣಿಸು’ ಎಂಬ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥ ಬರುತ್ತದೆ. ‘ಪರಿಗಣಿಸಿದ್ದರು’ ಮೂಲದ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಮುಂದುವರಿದ ಮನೋಭಾವವನ್ನೂ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಗ್ರೀಕ್ ಕಥನದಲ್ಲಿ ಕರ್ತೃ ಮತ್ತು ಕರ್ಮದ ಗುರುತು ಸರ್ವನಾಮಗಳ ಮೂಲಕ ಸಂದರ್ಭಕ್ಕೆ ಬಿಡಲಾಗಿದೆ
  choice: ವಚನದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹೆಸರುಗಳನ್ನು ಸೇರಿಸದೆ ‘ಅವನು/ಅವನನ್ನು’ ಎಂಬ ಸರ್ವನಾಮಗಳನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಹೆರೋದನು ಯೋಹಾನನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ಬಯಸುತ್ತಿದ್ದರೂ…’ ಎಂದು ಹೆಸರುಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸುವುದು
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಪಠ್ಯವು ಸರ್ವನಾಮಗಳನ್ನೇ ಬಳಸುತ್ತದೆ; ತಕ್ಷಣದ ಸಂದರ್ಭವು ಹೆರೋದ ಮತ್ತು ಯೋಹಾನರನ್ನು ಗುರುತಿಸುತ್ತದೆ. ಹೆಸರು ಸೇರಿಸುವುದು ಸ್ಪಷ್ಟೀಕರಣವಾದರೂ ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ವಿವರವಾಗುತ್ತದೆ.
- issue: θέλων ಕೃದಂತದ ತಾರ್ಕಿಕ ಸಂಬಂಧ
  choice: ಸಂದರ್ಭಾನುಸಾರ ಒಪ್ಪಿತಾರ್ಥಕವಾಗಿ ‘ಬಯಸುತ್ತಿದ್ದರೂ’ ಎಂದು ಅನುವಾದಿಸುವುದು
  alternative: ರೂಪಕ್ಕೆ ಹೆಚ್ಚು ನೇರವಾಗಿ ‘ಕೊಲ್ಲಬೇಕೆಂದು ಬಯಸಿ’ ಅಥವಾ ‘ಕೊಲ್ಲಲು ಬಯಸುತ್ತಾ’ ಎಂದು ಅನುವಾದಿಸುವುದು
  rationale: ಕೃದಂತವೇ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ‘ಆದರೂ’ ಎಂಬ ಪದವನ್ನು ಹೊಂದಿಲ್ಲ; ಆದರೆ ಕೊಲ್ಲುವ ಬಯಕೆ ಮತ್ತು ಜನಸಮೂಹದ ಭಯದಿಂದ ತಡೆದಿರುವ ಮುಖ್ಯ ಕ್ರಿಯೆಯ ನಡುವಿನ ಒಪ್ಪಿತಾರ್ಥಕ ಸಂಬಂಧ ಸಂದರ್ಭದಿಂದ ಬಲವಾಗಿ ಹೊರಹೊಮ್ಮುತ್ತದೆ. ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಸರ್ವನಾಮಾತ್ಮಕ ಉಲ್ಲೇಖ ಮತ್ತು ಸಂದರ್ಭದ ತಾತ್ತ್ವಿಕ ಒತ್ತಡ ಉಳಿಸಲಾಗಿದೆ; ಅನಗತ್ಯವಾಗಿ ಹೆಸರುಗಳನ್ನಾಗಲಿ ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವನ್ನಾಗಲಿ ಸೇರಿಸಲಾಗಿಲ್ಲ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
