    issue: «ಪರಿಗಣಿಸಿದ್ದರು» renders εἶχον as a pluperfect.
    rationale: The imperfect εἶχον means that the crowd regarded/considered him a prophet. Kannada «ಪರಿಗಣಿಸುತ್ತಿದ್ದರು» preserves this ongoing past portrayal without adding anterior timing. The same correction is needed in footnote b.
