id: MAT.14.9
reference: Matthew 14:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: kn
  text: ಅರಸನು ದುಃಖಗೊಂಡಿದ್ದರೂ, ತನ್ನ ಪ್ರಮಾಣಗಳ ಹಾಗೂ ತನ್ನೊಂದಿಗೆ ಊಟಕ್ಕೆ ಕುಳಿತಿದ್ದವರ[a] ಕಾರಣದಿಂದ, ಅದನ್ನು ಕೊಡಬೇಕೆಂದು ಆಜ್ಞಾಪಿಸಿದನು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ತನ್ನೊಂದಿಗೆ ಊಟದ ಮೇಜಿನ ಬಳಿ ಒರಗಿಕೊಂಡಿದ್ದವರು’ ಎಂದಿದೆ; ಇದು ಆ ಕಾಲದ ಸಾಮಾನ್ಯ ಭೋಜನ ಭಂಗಿಯನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
    reason: cultural_note
  - marker: b
    text: ‘ಕೊಡಬೇಕೆಂದು’ ಎಂಬುದರ ಕರ್ಮವನ್ನು ಗ್ರೀಕ್ ಪಠ್ಯವು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ; ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಕೋರಿಕೆಯೇ ಇಲ್ಲಿ ಉದ್ದೇಶಿತವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: ದುಃಖಪಟ್ಟರೂ
  rationale: ಆರಿಸ್ಟ್ ಪ್ಯಾಸಿವ್ ಕೃದಂತವು ಅರಸನು ದುಃಖಕ್ಕೆ ಒಳಗಾದದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಂದರ್ಭದಲ್ಲಿನ ವಿರುದ್ಧತೆಯನ್ನು ಕನ್ನಡದ ‘-ರೂ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ βασιλεὺς
  choice: ಅರಸನು
  rationale: βασιλεύς ಎಂಬುದಕ್ಕೆ ನೇರವಾದ, ಗೌರವಯುತ ಮತ್ತು ಕಥನಶೈಲಿಗೆ ಹೊಂದುವ ಆಧುನಿಕ ಕನ್ನಡ ಪದ.
- source_word: διὰ τοὺς ὅρκους
  choice: ತಾನು ಮಾಡಿದ ಪ್ರಮಾಣಗಳ ನಿಮಿತ್ತವಾಗಿ
  rationale: διά + ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿ ಕಾರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಬಹುವಚನವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪ್ರಮಾಣಗಳು ಅರಸನವೇ ಎಂಬುದು ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟವಾಗುವುದರಿಂದ ‘ತಾನು ಮಾಡಿದ’ ಎಂದು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: τοὺς συνανακειμένους
  choice: ತನ್ನೊಂದಿಗೆ ಊಟಕ್ಕೆ ಕುಳಿತಿದ್ದವರು
  rationale: ಪದಶಃ ಒಟ್ಟಿಗೆ ಮೇಜಿನ ಬಳಿ ಒರಗಿಕೊಂಡಿದ್ದವರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಪ್ರಾಚೀನ ಭೋಜನ ಭಂಗಿಯನ್ನು ಅತಿಯಾಗಿ ಮುನ್ನೆಲೆಗೆ ತರದೆ, ಸಾಮಾಜಿಕ ಸಂದರ್ಭವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐκέλευσεν
  choice: ಆಜ್ಞಾಪಿಸಿದನು
  rationale: κελεύω ಯ ಅಧಿಕಾರಪೂರ್ಣ ಆದೇಶದ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಘನವಾದ ಕಥನಶೈಲಿಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δοθῆναι
  choice: ಅದನ್ನು ಕೊಡುವಂತೆ
  rationale: ಪ್ಯಾಸಿವ್ ಇನ್ಫಿನಿಟಿವಿನ ‘ಕೊಡಲ್ಪಡುವಂತೆ’ ಎಂಬ ರೂಪ ಕನ್ನಡದಲ್ಲಿ ಕೃತಕವಾಗಿ ಕೇಳುವುದರಿಂದ ಸಹಜವಾದ ಅನಿರ್ದಿಷ್ಟ ಕರ್ತೃ ರೂಪ ಬಳಸಲಾಗಿದೆ; ‘ಅದು’ ಹಿಂದಿನ ವಚನದ ಕೋರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆಯಾದರೂ ಅದನ್ನು ಇಲ್ಲಿ ವಿವರಿಸಿ ತುಂಬಲಾಗಿಲ್ಲ.
