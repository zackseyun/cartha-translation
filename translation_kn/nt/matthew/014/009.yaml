translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನವಾದ ಕಥನ ಶೈಲಿ ಅನುಸರಿಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನ ಕಾರಣಸೂಚಕ ಎರಡೂ ಘಟಕಗಳು ಮತ್ತು ಕರ್ಮದ ಅಸ್ಪಷ್ಟತೆ ಉಳಿಸಲ್ಪಟ್ಟಿವೆ. ಎಲ್ಲಾ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
