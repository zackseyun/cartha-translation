revisions:
- from: ಆದರೆ ತಕ್ಷಣವೇ ಯೇಸು ಅವರಿಗೆ, “ಧೈರ್ಯವಾಗಿರಿ; ನಾನೇ.[a] ಹೆದರಬೇಡಿ” ಎಂದು ಮಾತನಾಡಿದನು.
  to: 'ಆದರೆ ತಕ್ಷಣವೇ ಯೇಸು ಅವರಿಗೆ ಹೀಗೆ ಹೇಳಿದನು: “ಧೈರ್ಯವಾಗಿರಿ; ನಾನೇ[a]; ಹೆದರಬೇಡಿ.”'
  rationale: The revision retains every source element and the English audit trail’s deliberate ambiguity for ἐγώ εἰμι. It corrects the misplaced punctuation/footnote anchor and uses a more natural Kannada narrative introduction, without adding interpretive content.
