id: MAT.14.27
reference: Matthew 14:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: kn
  text: 'ಆದರೆ ತಕ್ಷಣವೇ ಯೇಸು ಅವರಿಗೆ ಹೀಗೆ ಹೇಳಿದನು: “ಧೈರ್ಯವಾಗಿರಿ; ನಾನೇ[a]; ಹೆದರಬೇಡಿ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಅಕ್ಷರಶಃ, “ನಾನು ಇದ್ದೇನೆ.” ಇಲ್ಲಿ ಗ್ರೀಕ್ ಪದಗಳು ಸರಳ ಸ್ವಗುರುತಿಸುವಿಕೆಯಾಗಿ ಬಳಕೆಯಾಗಬಹುದು; ಆದರೂ ಕೆಲವು ಓದುಗರಿಗೆ ಅವು ದೈವಿಕ ಸ್ವಗುರುತಿಸುವಿಕೆಯ ಸಂಭವನೀಯ ಪ್ರತಿಧ್ವನಿಯಂತೆ ಕೇಳಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: ತಕ್ಷಣವೇ
  rationale: ಕಾಲಸೂಚಕ ಅರ್ಥವನ್ನು ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಶಿಷ್ಯರು ಹೆದರಿದ್ದ ಸ್ಥಿತಿಗೆ ವಿರುದ್ಧವಾದ ಸೌಮ್ಯ ಕಥನ ತಿರುವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐλάλησεν
  choice: ಮಾತನಾಡಿದನು
  rationale: λαλέω ಎಂಬುದರ ಸಹಜ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, λέγων ಜೊತೆಯಲ್ಲಿರುವ ಮೂಲ ವಾಕ್ಯರಚನೆಯ ಭಾವವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ದತ್ತಿವ್ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಅನುವಾದಿಸುತ್ತದೆ.
- source_word: ὁ Ἰησοῦς
  choice: ಯೇಸು
  rationale: ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾಗಿರುವ ಹೆಸರಿನ ರೂಪ.
- source_word: λέγων
  choice: ಎಂದು
  rationale: ಕನ್ನಡದ ನೇರ ಉಕ್ತಿಯ ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಗ್ರೀಕ್ ಕೃದಂತದ ಕಾರ್ಯವನ್ನು ನಿರ್ವಹಿಸುತ್ತದೆ.
- source_word: Θαρσεῖτε
  choice: ಧೈರ್ಯವಾಗಿರಿ
  rationale: ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕದ ಧೈರ್ಯ ಮತ್ತು ಭರವಸೆಯ ಕರೆಯನ್ನು ಸ್ಪಷ್ಟ, ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐγώ εἰμι
  choice: ನಾನೇ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿನ ಸ್ವಗುರುತಿಸುವಿಕೆಯ ಸಹಜ ಕನ್ನಡ ರೂಪ; ಹೆಚ್ಚು ಅಕ್ಷರಶಃವಾದ ‘ನಾನು ಇದ್ದೇನೆ’ ಎಂಬ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: μὴ φοβεῖσθε
  choice: ಹೆದರಬೇಡಿ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ನಿಷೇಧಾತ್ಮಕ ಆಜ್ಞೆಯನ್ನು ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕ್ರಿಯೆಯ ಅವಧಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ἐγώ εἰμι ಎಂಬುದು ಸರಳ ಸ್ವಗುರುತಿಸುವಿಕೆಯೋ ಅಥವಾ ದೈವಿಕ ಸ್ವನಾಮದ ಪ್ರತಿಧ್ವನಿಯೋ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಂದರ್ಭೋಚಿತ ಸ್ವಗುರುತಿಸುವಿಕೆಯಾಗಿ ‘ನಾನೇ’
  alternative: ಹೆಚ್ಚು ಅಕ್ಷರಶಃವಾಗಿ ‘ನಾನು ಇದ್ದೇನೆ’
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸು ಭಯಗೊಂಡ ಶಿಷ್ಯರಿಗೆ ತನ್ನ ಗುರುತನ್ನು ತಿಳಿಸಿ ಧೈರ್ಯಪಡಿಸುತ್ತಾನೆ. ಆದರೂ ಗ್ರೀಕ್ ಪದಗಳಲ್ಲಿರಬಹುದಾದ ದೈವಿಕ ಸ್ವಗುರುತಿಸುವಿಕೆಯ ಪ್ರತಿಧ್ವನಿಯನ್ನು ನಿರ್ಣಾಯಕವಾಗಿ ಅಳಿಸದೆ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ, ಸಹಜ ಮತ್ತು ಘನತೆಯುಳ್ಳ ಕಥನ ಶೈಲಿ. ಮೂಲದಲ್ಲಿನ ಸಂಕ್ಷಿಪ್ತ ಆಜ್ಞೆಗಳು ಮತ್ತು θεολογಿಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
