  terminology: “ಶಿಷ್ಯರು,” “ಜನವಸತಿಯಿಲ್ಲದ ಸ್ಥಳ,” “ಜನಸಮೂಹಗಳನ್ನು,” “ಹಳ್ಳಿಗಳಿಗೆ,” and “ಆಹಾರ” are suitable, accurate choices. The singular imperative “ಕಳುಹಿಸಿಬಿಡು” correctly reflects the Greek address to Jesus without importing doctrinal or honorific interpretation.
