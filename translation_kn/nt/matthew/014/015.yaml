id: MAT.14.15
reference: Matthew 14:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: kn
  text: ಸಂಜೆಯಾದಾಗ ಶಿಷ್ಯರು ಅವನ ಬಳಿಗೆ ಬಂದು, “ಇದು ಜನವಸತಿಯಿಲ್ಲದ ಸ್ಥಳ[a]; ಈಗಾಗಲೇ ಹೊತ್ತು ಮೀರಿದೆ[b]. ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡು. ಅವರು ಹಳ್ಳಿಗಳಿಗೆ ಹೋಗಿ ತಮಗಾಗಿ ಆಹಾರವನ್ನು ಕೊಂಡುಕೊಳ್ಳಲಿ” ಎಂದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಈ ಸ್ಥಳ ನಿರ್ಜನವಾಗಿದೆ.”
    reason: lexical_alternative
  - marker: b
    text: ಪದಶಃ, “ಹೊತ್ತು ಈಗಾಗಲೇ ದಾಟಿಹೋಗಿದೆ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: ಸಂಜೆಯಾದಾಗ
  rationale: ಈ ಕರ್ತೃರಹಿತ ಷಷ್ಠೀ ವಿಭಕ್ತಿ ರಚನೆ ಕಾಲಸೂಚಕ ಕಥನಾಂತರವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸಂಜೆಯಾದಾಗ’ ಆ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಕೊಡುತ್ತದೆ; δέಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಆದರೆ’ ಅಥವಾ ‘ಆಗ’ ಸೇರಿಸುವ ಅಗತ್ಯ ಇಲ್ಲ.
- source_word: προσῆλθον αὐτῷ
  choice: ಅವನ ಬಳಿಗೆ ಬಂದು
  rationale: προσέρχομαι ಎಂದರೆ ‘ಬಳಿಗೆ ಬರು/ಸಮೀಪಿಸು.’ ಕಥನದಲ್ಲಿ ‘ಅವನ ಬಳಿಗೆ ಬಂದು’ ಸಹಜವೂ ಸ್ಪಷ್ಟವೂ ಆಗಿದೆ.
- source_word: οἱ μαθηταὶ
  choice: ಶಿಷ್ಯರು
  rationale: ನಿರ್ದಿಷ್ಟ ಲೇಖನವು ಸಂದರ್ಭದಲ್ಲೇ ಪರಿಚಿತವಾದ ಶಿಷ್ಯರ ಗುಂಪನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲದ ‘ಅವನ’ ಎಂಬ ಸ್ವಾಮ್ಯಪದವನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ಇದು ಜನವಸತಿಯಿಲ್ಲದ ಸ್ಥಳ
  rationale: ἔρημος ಇಲ್ಲಿ ಹತ್ತಿರದಲ್ಲಿ ವಾಸಸ್ಥಳ ಅಥವಾ ಸೌಲಭ್ಯಗಳಿಲ್ಲದ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಜನವಸತಿಯಿಲ್ಲದ’ ಎಂಬುದು ಭೌಗೋಳಿಕ ಮರುಭೂಮಿಯ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹುಟ್ಟಿಸದೆ ಸಂದರ್ಭವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: ಈಗಾಗಲೇ ಹೊತ್ತು ಮೀರಿದೆ
  rationale: ಪದಶಃ ‘ಹೊತ್ತು ಈಗಾಗಲೇ ದಾಟಿಹೋಗಿದೆ’; ದಿನ ಬಹಳ ತಡವಾಗಿದೆ ಎಂಬ ಸಂದರ್ಭಾರ್ಥವನ್ನು ‘ಹೊತ್ತು ಮೀರಿದೆ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: ಜನಸಮೂಹಗಳನ್ನು ಕಳುಹಿಸಿಬಿಡು
  rationale: ἀπολύω ಇಲ್ಲಿ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಿಂತ ಜನರನ್ನು ಅಲ್ಲಿಂದ ಕಳುಹಿಸುವ ಅಥವಾ ವಿಸರ್ಜಿಸುವ ಅರ್ಥದಲ್ಲಿದೆ. ಬಹುವಚನ τοὺς ὄχλους ಅನ್ನು ‘ಜನಸಮೂಹಗಳನ್ನು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἵνα ἀπελθόντες
  choice: ಅವರು ... ಹೋಗಿ ... ಕೊಂಡುಕೊಳ್ಳಲಿ
  rationale: ἵνα ಉದ್ದೇಶವನ್ನು, ἀπελθόντες ಮೊದಲು ನಡೆಯುವ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತವೆ. ಕನ್ನಡದ ‘ಹೋಗಿ ... ಕೊಂಡುಕೊಳ್ಳಲಿ’ ರಚನೆ ಎರಡನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἰς τὰς κώμας
  choice: ಹಳ್ಳಿಗಳಿಗೆ
  rationale: κώμη ಎಂದರೆ ಹಳ್ಳಿ. ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಇಲ್ಲದ ‘ಹತ್ತಿರದ’ ಎಂಬುದನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: ತಮಗಾಗಿ ಆಹಾರವನ್ನು ಕೊಂಡುಕೊಳ್ಳಲಿ
  rationale: βρώματα ಅನ್ನು ಸಾಮಾನ್ಯವಾದ ‘ಆಹಾರ’ ಎಂದು, ἑαυτοῖςನ ಆತ್ಮಾರ್ಥಕ ಒತ್ತನ್ನು ‘ತಮಗಾಗಿ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
