translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಇಂಗ್ಲಿಷ್ ಸಲಹಾ ಪಠ್ಯದಲ್ಲಿನ ಅಡಿಕುರಿತು ಗುರುತುಗಳು ಅವು ವಿವರಿಸುವ ಪದಬಂಧಗಳೊಂದಿಗೆ ಹೊಂದಿಕೆಯಾಗದಂತೆ ಕಂಡದ್ದರಿಂದ, [a] ಅನ್ನು ಸ್ಥಳದ ವರ್ಣನೆಯ ನಂತರವೂ [b] ಅನ್ನು ಹೊತ್ತು ಮೀರಿದ ಹೇಳಿಕೆಯ ನಂತರವೂ ಇಟ್ಟು ಮೂಲ ಗ್ರೀಕ್‌ಗೆ ಅನುಗುಣವಾಗಿ ಸರಿಪಡಿಸಲಾಗಿದೆ.
