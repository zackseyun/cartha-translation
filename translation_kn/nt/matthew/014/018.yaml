id: MAT.14.18
reference: Matthew 14:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: kn
  text: ಆದರೆ ಅವರು, “ಅವುಗಳನ್ನು ಇಲ್ಲಿಗೆ ನನ್ನ ಬಳಿಗೆ ತಂದುಕೊಡಿರಿ” ಎಂದು ಹೇಳಿದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಂದರೆ, ಹಿಂದಿನ ವಚನದಲ್ಲಿ ಹೇಳಿರುವ ರೊಟ್ಟಿಗಳು ಮತ್ತು ಮೀನುಗಳನ್ನು.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಇದು ಸೌಮ್ಯವಾದ ಸಂಪರ್ಕಪದ; ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಶಿಷ್ಯರು ಹೇಳಿದ ಕೊರತೆಯ ಮಾತಿಗೆ ಯೇಸುವಿನ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸಹಜವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: εἶπεν
  choice: ಎಂದು ಹೇಳಿದರು
  rationale: ಆರಿಸ್ಟ್ ರೂಪದ λέγω ಅನ್ನು ಸರಳವಾಗಿ ‘ಹೇಳಿದರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; ಕ್ರಿಯಾಪದದಲ್ಲೇ ಇಲ್ಲದ ಹೆಚ್ಚುವರಿ ಆಜ್ಞಾರ್ಥಕ ಛಾಯೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: Φέρετέ
  choice: ತನ್ನಿರಿ
  rationale: ಎರಡನೇ ಪುರುಷ ಬಹುವಚನದ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕ ರೂಪವನ್ನು ಗೌರವಪೂರ್ವಕ ಬಹುವಚನ ಆಜ್ಞೆಯಾಗಿ ನೀಡುತ್ತದೆ; ವಸ್ತುಗಳನ್ನು ಮಾತಾಡುವವನ ಬಳಿಗೆ ತರಬೇಕೆಂಬ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μοι
  choice: ನನ್ನ ಬಳಿಗೆ
  rationale: ದತ್ತಿವ್ ಸರ್ವನಾಮವು ಕ್ರಿಯೆಯ ಗುರಿ ಯೇಸು ಎಂಬುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ὧδε
  choice: ಇಲ್ಲಿಗೆ
  rationale: ಸ್ಥಳಸೂಚಕ ಕ್ರಿಯಾವಿಶೇಷಣದ ‘ಇಲ್ಲಿಗೆ/ಈ ಸ್ಥಳಕ್ಕೆ’ ಎಂಬ ದಿಕ್ಕಿನ ಅರ್ಥವನ್ನು ‘ತನ್ನಿರಿ’ ಎಂಬ ಚಲನಕ್ರಿಯೆಗೆ ಹೊಂದುವಂತೆ ನೀಡಲಾಗಿದೆ.
- source_word: αὐτούς
  choice: ಅವುಗಳನ್ನು
  rationale: ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ಸರ್ವನಾಮವು ಸಂದರ್ಭಾನುಸಾರ ಹಿಂದಿನ ವಚನದ ರೊಟ್ಟಿಗಳು ಮತ್ತು ಮೀನುಗಳನ್ನು ಒಟ್ಟಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಜಡವಸ್ತುಗಳಿಗೆ ‘ಅವುಗಳನ್ನು’ ಸಹಜವಾಗಿದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಹಜ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವನ್ನು ಸೂಚಿಸಲು ಗೌರವಸೂಚಕ ಬಹುವಚನ ‘ಅವರು/ಹೇಳಿದರು’ ಹಾಗೂ ಶಿಷ್ಯರಿಗೆ ಉದ್ದೇಶಿಸಿದ ಬಹುವಚನ ಆಜ್ಞಾರೂಪ ‘ತನ್ನಿರಿ’ ಬಳಸಲಾಗಿದೆ.
