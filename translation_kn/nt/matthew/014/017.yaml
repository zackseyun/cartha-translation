id: MAT.14.17
reference: Matthew 14:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: kn
  text: ಆದರೆ ಅವರು ಆತನಿಗೆ, “ಐದು ರೊಟ್ಟಿಗಳೂ ಎರಡು ಮೀನುಗಳೂ ಬಿಟ್ಟರೆ ಇಲ್ಲಿ ನಮ್ಮ ಬಳಿ ಬೇರೇನೂ ಇಲ್ಲ[a]” ಎಂದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಹೆಚ್ಚು ಅಕ್ಷರಶಃ: “ಐದು ರೊಟ್ಟಿಗಳೂ ಎರಡು ಮೀನುಗಳೂ ಬಿಟ್ಟರೆ ಇಲ್ಲಿ ನಮ್ಮ ಬಳಿ ಏನೂ ಇಲ್ಲ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ಆದರೆ ಅವರು
  rationale: οἱ ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಶಿಷ್ಯರನ್ನು ಸೂಚಿಸುತ್ತದೆ; δέ ಯೇಸುವಿನ ಹಿಂದಿನ ಸೂಚನೆಗೆ ಇರುವ ಸೌಮ್ಯವಾದ ವ್ಯತಿರಿಕ್ತತೆಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಎಂದು ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
- source_word: λέγουσιν αὐτῷ
  choice: ಆತನಿಗೆ … ಎಂದರು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲ (‘ಹೇಳುತ್ತಾರೆ’) ಇದ್ದರೂ, ಕನ್ನಡ ಕಥನಶೈಲಿಯಲ್ಲಿ ಭೂತಕಾಲದ ‘ಎಂದರು’ ಸಹಜವಾಗಿದ್ದು ಸಂಭಾಷಣೆಯ ಕಾರ್ಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Οὐκ ἔχομεν
  choice: ನಮ್ಮ ಬಳಿ ಬೇರೇನೂ ಇಲ್ಲ
  rationale: ನಿಷೇಧಾರ್ಥಕ ಸ್ವಾಮ್ಯವಾಕ್ಯವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೀಗೆ ಹೇಳಲಾಗುತ್ತದೆ; εἰ μὴ ಯಿಂದ ಬರುವ ಅಪವಾದದೊಂದಿಗೆ ಸೇರಿ ‘ಬೇರೇನೂ ಇಲ್ಲ’ ಎಂಬ ಅರ್ಥ ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ.
- source_word: ὧδε
  choice: ಇಲ್ಲಿ
  rationale: ಸ್ಥಳಸೂಚಕ ಕ್ರಿಯಾವಿಶೇಷಣದ ನೇರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: εἰ μὴ
  choice: ಬಿಟ್ಟರೆ
  rationale: ನಿಷೇಧಾರ್ಥಕ ವಾಕ್ಯದ ನಂತರ ಇದು ಷರತ್ತಿಗಿಂತಲೂ ಅಪವಾದವನ್ನು (‘except’) ಸೂಚಿಸುತ್ತದೆ.
- source_word: πέντε ἄρτους
  choice: ಐದು ರೊಟ್ಟಿಗಳು
  rationale: ἄρτος ಇಲ್ಲಿ ಎಣಿಸಬಹುದಾದ ರೊಟ್ಟಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಐದು ರೊಟ್ಟಿಗಳು’ ಆ ಕಾಲದ ಆಹಾರವಸ್ತುವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: δύο ἰχθύας
  choice: ಎರಡು ಮೀನುಗಳು
  rationale: ἰχθύς ಎಂಬ ಪದದ ಸರಳ ಬಹುವಚನ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ನಿಷೇಧಾರ್ಥಕ ವಾಕ್ಯರಚನೆ ಮತ್ತು ‘ಬಿಟ್ಟರೆ’ ಎಂಬ ಅಪವಾದಾರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಲು ‘ಬೇರೇನೂ’ ಹಾಗೂ ‘ನಮ್ಮ ಬಳಿ’ ಎಂಬ ಪದಪ್ರಯೋಗಗಳನ್ನು ಬಳಸಲಾಗಿದೆ.
