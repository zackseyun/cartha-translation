id: MAT.14.8
reference: Matthew 14:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: kn
  text: ಅವಳು ತನ್ನ ತಾಯಿಯಿಂದ ಪ್ರೇರೇಪಿತಳಾಗಿ, “ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುವ ಯೋಹಾನನ[a] ತಲೆಯನ್ನು ಇಲ್ಲಿಯೇ ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ ನನಗೆ ಕೊಡು” ಎಂದು ಹೇಳುತ್ತಾಳೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ, “ಸ್ನಾನಿಕನಾದ ಯೋಹಾನ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: ಪ್ರೇರಣೆಯ ಮೇರೆಗೆ
  rationale: ತಾಯಿ ಮೊದಲೇ ಅವಳ ಮೇಲೆ ಪ್ರಭಾವ ಬೀರಿದ್ದಾಳೆ ಎಂಬ ಕರ್ಮಣಿ ಕೃದಂತದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ‘ಕಲಿಸಿಕೊಟ್ಟಳು’ ಅಥವಾ ‘ಒತ್ತಾಯಿಸಿದಳು’ ಎಂದು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: ತನ್ನ ತಾಯಿಯ
  rationale: ὑπό ಜೊತೆಯ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಕರ್ಮಣಿ ಪ್ರಯೋಗದಲ್ಲಿನ ಕರ್ತೃವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತನ್ನ ತಾಯಿಯ ಪ್ರೇರಣೆಯ ಮೇರೆಗೆ’ ಎಂಬ ಪೂರ್ಣ ನುಡಿಗಟ್ಟು ಕನ್ನಡದಲ್ಲಿ ಈ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Δός μοι
  choice: ನನಗೆ ಕೊಡು
  rationale: ಏಕವಚನ ಆಜ್ಞಾರ್ಥಕ ರೂಪದ ನೇರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: φησίν
  choice: ಎಂದು ಹೇಳುತ್ತಾಳೆ
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಿ ನಿರೂಪಣೆಯ ಜೀವಂತಿಕೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: ὧδε
  choice: ಇಲ್ಲಿಯೇ
  rationale: ಸ್ಥಳಸೂಚಕ ‘ಇಲ್ಲಿ’ ಎಂಬ ಅರ್ಥದ ಜೊತೆಗೆ ಸಂದರ್ಭದಲ್ಲಿರುವ ಒತ್ತನ್ನು ‘-ಯೇ’ ಮೂಲಕ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐπὶ πίνακι
  choice: ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ
  rationale: ಔತಣದ ಸಂದರ್ಭದಲ್ಲಿ πίναξ ಎಂದರೆ ಆಹಾರ ಬಡಿಸುವ ತಟ್ಟೆ ಅಥವಾ ಹರಿವಾಣ. ‘ತಟ್ಟೆ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ.
- source_word: τὴν κεφαλὴν
  choice: ತಲೆಯನ್ನು
  rationale: ಮೂಲದ ಭೀಕರವಾದ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುವ ಯೋಹಾನನ
  rationale: βαπτιστής ಎಂಬ ಕರ್ತೃವಾಚಕ ನಾಮಪದವು ಯೋಹಾನನ ಕಾರ್ಯವನ್ನು ವರ್ಣಿಸುತ್ತದೆ. ಈ ಆಯ್ಕೆ ಆ ವರ್ಣನಾತ್ಮಕ ಅರ್ಥವನ್ನು ಪಾರದರ್ಶಕವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: βαπτιστής ಎಂಬ ಯೋಹಾನನ ಬಿರುದಿನ ಅನುವಾದ
  choice: ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುವ ಯೋಹಾನ
  alternative: ಸ್ನಾನಿಕ ಯೋಹಾನ
  rationale: ಮೂಲದ ಬಿರುದು ಯೋಹಾನನು ಮಾಡುವ ಕಾರ್ಯವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಅದನ್ನು ವರ್ಣನಾತ್ಮಕವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ. ಓದುಗರಿಗೆ ಪರಿಚಿತವಾದ ಸಾಂಪ್ರದಾಯಿಕ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ; ಯಾವುದೇ ಪಂಥೀಯ ವಿಶಿಷ್ಟಾರ್ಥವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನವಾದ ನಿರೂಪಣೆ. ‘ಪ್ರೇರೇಪಿಸಲ್ಪಟ್ಟ’ ಎಂಬ ಕೃತಕ ಕರ್ಮಣಿ ರೂಪವನ್ನು ತಪ್ಪಿಸಿ ಮೂಲದ ಪೂರ್ವಪ್ರಭಾವವನ್ನು ‘ಪ್ರೇರಣೆಯ ಮೇರೆಗೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ. ನೇರ ಮಾತಿನಲ್ಲಿ ಏಕವಚನ ಆಜ್ಞಾರ್ಥಕ ‘ಕೊಡು’ ಬಳಸಿ ಮೂಲದ ನೇರತೆಯನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
