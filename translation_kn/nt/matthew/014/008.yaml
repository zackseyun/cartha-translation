- from: ಆದರೆ ಅವಳು ತನ್ನ ತಾಯಿಯ ಪ್ರೇರಣೆಯ ಮೇರೆಗೆ, “ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುವ ಯೋಹಾನನ[a] ತಲೆಯನ್ನು ಇಲ್ಲಿಯೇ ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ ನನಗೆ ಕೊಡು” ಎಂದು ಹೇಳುತ್ತಾಳೆ.
  to: ಅವಳು ತನ್ನ ತಾಯಿಯಿಂದ ಪ್ರೇರೇಪಿತಳಾಗಿ, “ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುವ ಯೋಹಾನನ[a] ತಲೆಯನ್ನು ಇಲ್ಲಿಯೇ ಒಂದು ತಟ್ಟೆಯ ಮೇಲೆ ನನಗೆ ಕೊಡು” ಎಂದು ಹೇಳುತ್ತಾಳೆ.
