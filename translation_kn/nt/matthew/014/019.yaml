id: MAT.14.19
reference: Matthew 14:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: kn
  text: ಆಮೇಲೆ ಅವರು ಜನಸಮೂಹಗಳಿಗೆ ಹುಲ್ಲಿನ ಮೇಲೆ ಊಟಕ್ಕೆ ಒರಗಿ ಕುಳಿತುಕೊಳ್ಳುವಂತೆ ಆಜ್ಞಾಪಿಸಿದರು. ಬಳಿಕ ಆ ಐದು ರೊಟ್ಟಿಗಳನ್ನೂ ಎರಡು ಮೀನುಗಳನ್ನೂ ತೆಗೆದುಕೊಂಡು, ಆಕಾಶದ ಕಡೆಗೆ ಕಣ್ಣೆತ್ತಿ ಆಶೀರ್ವದಿಸಿದರು[a]. ರೊಟ್ಟಿಗಳನ್ನು ಮುರಿದು ಶಿಷ್ಯರಿಗೆ ಕೊಟ್ಟರು; ಶಿಷ್ಯರು ಅವುಗಳನ್ನು ಜನಸಮೂಹಗಳಿಗೆ ಕೊಟ್ಟರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ದೇವರನ್ನು ಸ್ತುತಿಸಿದರು” / “ಆಶೀರ್ವಾದದ ಮಾತು ಹೇಳಿದರು.” ಗ್ರೀಕ್ ಮೂಲವು “ಆಶೀರ್ವದಿಸಿದರು” ಎಂದಷ್ಟೇ ಹೇಳುತ್ತದೆ; ಯಾರನ್ನು ಅಥವಾ ಯಾವುದನ್ನು ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: ಆಜ್ಞಾಪಿಸಿದರು
  rationale: ಕ್ರಿಯೆಯಲ್ಲಿರುವ ಸ್ಪಷ್ಟ ನಿರ್ದೇಶನದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಗೌರವ ಏಕವಚನವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: τοὺς ὄχλους
  choice: ಜನಸಮೂಹಗಳಿಗೆ
  rationale: ಬಹುವಚನವನ್ನು ಉಳಿಸುವ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಪದ.
- source_word: ἀνακλιθῆναι
  choice: ಊಟಕ್ಕೆ ಒರಗಿ ಕುಳಿತುಕೊಳ್ಳುವಂತೆ
  rationale: ಕೇವಲ ‘ಕುಳಿತುಕೊಳ್ಳು’ ಎನ್ನುವುದಕ್ಕಿಂತ ಊಟಕ್ಕಾಗಿ ಒರಗಿ ಕುಳಿತುಕೊಳ್ಳುವ ಮೂಲ ಸಾಂಸ್ಕೃತಿಕ ಭಂಗಿಯನ್ನು ಗ್ರಾಹ್ಯವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐπὶ τοῦ χόρτου
  choice: ಹುಲ್ಲಿನ ಮೇಲೆ
  rationale: ಮತ್ತಾಯನು ಹೇಳದ ‘ಹಸಿರು’ ಎಂಬ ವಿವರವನ್ನು ಸೇರಿಸದೆ ಸ್ಥಳವನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: λαβὼν
  choice: ತೆಗೆದುಕೊಂಡು
  rationale: ಮುಂದಿನ ಕ್ರಿಯೆಗಳಿಗೆ ಮುಂಚಿನ ಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡ ಕಥನದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τοὺς πέντε ἄρτους
  choice: ಆ ಐದು ರೊಟ್ಟಿಗಳನ್ನೂ
  rationale: ಎಣಿಸಬಹುದಾದ ಸಣ್ಣ ರೊಟ್ಟಿಗಳನ್ನು ಸೂಚಿಸಲು ‘ರೊಟ್ಟಿಗಳು’ ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ.
- source_word: τοὺς δύο ἰχθύας
  choice: ಎರಡು ಮೀನುಗಳನ್ನೂ
  rationale: ಮೂಲದ ಸಂಖ್ಯೆಯನ್ನೂ ಬಹುವಚನ ಅರ್ಥವನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ಆಕಾಶದ ಕಡೆಗೆ ಕಣ್ಣೆತ್ತಿ
  rationale: ದೃಷ್ಟಿಯನ್ನು ಮೇಲಕ್ಕೆ ಎತ್ತಿದ ಕ್ರಿಯೆ ಮತ್ತು ಅದರ ದಿಕ್ಕನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εὐλόγησεν
  choice: ಆಶೀರ್ವದಿಸಿದರು
  rationale: ಮೂಲದಲ್ಲಿ ಕರ್ಮಪದವನ್ನು ಹೇಳಿಲ್ಲ; ಕನ್ನಡದಲ್ಲಿಯೂ ಅದನ್ನು ಸೇರಿಸದೆ ಕ್ರಿಯೆಯ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: κλάσας
  choice: ರೊಟ್ಟಿಗಳನ್ನು ಮುರಿದು
  rationale: ಸಂದರ್ಭದಿಂದ ತಿಳಿಯುವ ಕರ್ಮಪದವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ, ಕೊಡುವುದಕ್ಕಿಂತ ಮೊದಲು ನಡೆದ ಕ್ರಿಯೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: ಶಿಷ್ಯರಿಗೆ ಕೊಟ್ಟರು
  rationale: ಮುರಿದ ರೊಟ್ಟಿಗಳೇ ಕರ್ಮಪದವೆಂದು ಹಿಂದಿನ ವಾಕ್ಯದಿಂದ ಸ್ಪಷ್ಟವಾಗುವುದರಿಂದ ಅನಗತ್ಯ ಪುನರಾವರ್ತನೆ ತಪ್ಪಿಸಲಾಗಿದೆ.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ಶಿಷ್ಯರು ಅವುಗಳನ್ನು ಜನಸಮೂಹಗಳಿಗೆ ಕೊಟ್ಟರು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಕ್ರಿಯಾಪದದ ಅಧ್ಯಾಹಾರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತುಂಬಿಸಿ, ‘ಅವುಗಳನ್ನು’ ಎಂಬುದು ರೊಟ್ಟಿಗಳನ್ನು ಸೂಚಿಸುವಂತೆ ಮಾಡಲಾಗಿದೆ.
theological_decisions:
- issue: εὐλόγησεν ಎಂಬುದರ ಹೇಳದ ಕರ್ಮಪದ
  choice: ‘ಆಶೀರ್ವದಿಸಿದರು’ ಎಂದು ಕರ್ಮಪದವಿಲ್ಲದೆ ಅನುವಾದಿಸುವುದು
  alternative: ‘ದೇವರನ್ನು ಸ್ತುತಿಸಿದರು / ಆಶೀರ್ವಾದದ ಮಾತು ಹೇಳಿದರು’ ಅಥವಾ ‘ಅವುಗಳನ್ನು ಆಶೀರ್ವದಿಸಿದರು’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಯಾರನ್ನು ಅಥವಾ ಯಾವುದನ್ನು ಆಶೀರ್ವದಿಸಿದರು ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ಕರ್ಮಪದವಿಲ್ಲದ ಕನ್ನಡ ರೂಪವು ಈ ನಿಜವಾದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯ ಅರ್ಥಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಕಥನಶೈಲಿ. ಯೇಸುವಿಗೆ ಗೌರವ ಏಕವಚನದ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಬಳಸಲಾಗಿದೆ. ‘ಊಟಕ್ಕೆ ಒರಗಿ ಕುಳಿತುಕೊಳ್ಳು’ ಎಂಬ ರೂಪವು ಪುರಾತನ ಊಟದ ಭಂಗಿಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ಪಂಥೀಯ ಅಥವಾ ವಿವರಣಾತ್ಮಕ ಅಂಶಗಳನ್ನು ಸೇರಿಸಿಲ್ಲ.
