id: MAT.14.20
reference: Matthew 14:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: kn
  text: ಅವರೆಲ್ಲರೂ ತಿಂದು ತೃಪ್ತರಾದರು. ಅವರು ಉಳಿದ ತುಂಡುಗಳನ್ನು[a] ಕೂಡಿಸಿ, ತುಂಬಿದ್ದ ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳನ್ನು ಎತ್ತಿಕೊಂಡರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಚೂರುಗಳನ್ನು.’ ಗ್ರೀಕ್ ಪದವು ಊಟದ ನಂತರ ಉಳಿದ ಮುರಿದ ತುಂಡುಗಳನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ತಿಂದು
  rationale: ನಿರೂಪಣೆಯ ಕ್ರಮದಲ್ಲಿ ಸರಳ ಭೂತಕಾಲದ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: πάντες
  choice: ಅವರೆಲ್ಲರೂ
  rationale: ಜನಸಮೂಹದಲ್ಲಿದ್ದ ಎಲ್ಲರನ್ನೂ ಒಳಗೊಂಡ ಸಾರ್ವತ್ರಿಕ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐχορτάσθησαν
  choice: ತೃಪ್ತರಾದರು
  rationale: ಹೊಟ್ಟೆತುಂಬುವಷ್ಟು ತಿಂದು ತೃಪ್ತಿಯಾದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅದ್ಭುತದ ಫಲಿತಾಂಶಕ್ಕೆ ಹೆಚ್ಚುವರಿ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: ಮಿಕ್ಕ ತುಂಡುಗಳನ್ನು
  rationale: ಉಳಿದುಹೋದ ಮುರಿದ ಭಾಗಗಳು ಎಂಬ ಸಮಗ್ರ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἦραν
  choice: ಕೂಡಿಸಿದಾಗ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಉಳಿದ ತುಂಡುಗಳನ್ನು ಎತ್ತಿ ಸಂಗ್ರಹಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳು ತುಂಬಿದವು
  rationale: ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳು ಪೂರ್ಣವಾಗಿ ತುಂಬಿದ್ದವು ಎಂಬ ಫಲಿತಾಂಶವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಅದ್ಭುತದ ಊಟದ ಬಳಿಕ ಎಲ್ಲರೂ ಸಂಪೂರ್ಣವಾಗಿ ತೃಪ್ತರಾದರೆಂಬ ಹೇಳಿಕೆ
  choice: ತೃಪ್ತರಾದರು
  alternative: ಹೊಟ್ಟೆತುಂಬ ತಿಂದರು
  rationale: ಗ್ರೀಕ್ ನಿಷ್ಕ್ರಿಯ ರೂಪವು ಪೂರ್ಣವಾಗಿ ಆಹಾರ ಪಡೆದು ತೃಪ್ತರಾದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆಯ್ದ ಪದವು ಸಾಮಾನ್ಯ ಪೂರ್ಣತೆಯ ಭಾಷೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಪಂಥೀಯ ಅಥವಾ ಹೆಚ್ಚುವರಿ ತಾತ್ವಿಕ ಅರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಅರ್ಥಕ್ರಮವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗುವ ‘ತುಂಬಿದ ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳನ್ನು ಎತ್ತಿಕೊಂಡರು’ ಎಂಬ ರಚನೆಯ ಬದಲು ಫಲಿತಾಂಶವನ್ನು ‘ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳು ತುಂಬಿದವು’ ಎಂದು ಸಹಜವಾಗಿ ಹೇಳಲಾಗಿದೆ.
