review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the disciples seeing Jesus walking on the sea, their agitation, their cry identifying him as a φάντασμα, and their fearful outcry. However, the direct exclamation uses neuter “ಅದು” ('that/it'), whereas the Greek masculine predicate construction refers to the person they see; Kannada should naturally say “ಇವನು ಭೂತ!” ('It is a ghost!').
  naturalness: The Kannada is generally modern and clear. Revising “ಆತನು … ನಡೆಯುತ್ತಿರುವುದನ್ನು” to “ಅವರು … ನಡೆಯುವುದನ್ನು” avoids an unnecessarily formal pronoun and gives a more idiomatic narrative flow. “ಭಯದಿಂದ” naturally conveys ἀπὸ τοῦ φόβου.
  terminology: “ಭೂತ” is an accessible contextual equivalent for φάντασμα and should retain a lexical-alternative footnote. “ಪ್ರೇತರೂಪ” is suitable; “ಛಾಯಾರೂಪ” is less idiomatic and less precise as an alternative here. “ಭೂತದಂಥ ಕಾಣಿಕೆ” may be offered as a clear explanatory alternative.
  issues:
  - severity: medium
    issue: The exclamation “ಅದು ಭೂತ!” uses a neuter demonstrative for the person the disciples see.
    rationale: Φάντασμά ἐστιν is grammatically neuter because φάντασμα is neuter, but it identifies the male person before them. Kannada direct speech is more natural and referentially clear with “ಇವನು ಭೂತ!”.
  - severity: low
    issue: “ಆತನು” is somewhat formal/marked in this narrative clause.
    rationale: “ಅವರು ಸಮುದ್ರದ ಮೇಲೆ ನಡೆಯುವುದನ್ನು” is standard modern Kannada and clearly refers to Jesus in context, while preserving the participial temporal relation.
  - severity: low
    issue: The footnote alternative “ಛಾಯಾರೂಪ” is not the clearest modern Kannada equivalent for φάντασμα.
    rationale: Use “ಪ್ರೇತರೂಪ” and an explanatory alternative such as “ಭೂತದಂಥ ಕಾಣಿಕೆ” to convey apparition/phantom without suggesting a doctrinal claim.
  revised_text: ಆದರೆ ಶಿಷ್ಯರು ಅವರು ಸಮುದ್ರದ ಮೇಲೆ ನಡೆಯುವುದನ್ನು ಕಂಡಾಗ ದಿಗಿಲುಗೊಂಡು, “ಇವನು ಭೂತ[a]!” ಎಂದರು. ಅವರು ಭಯದಿಂದ ಕೂಗಿದರು.
