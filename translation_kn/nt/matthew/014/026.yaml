id: MAT.14.26
reference: Matthew 14:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: kn
  text: ಆದರೆ ಶಿಷ್ಯರು ಅವರು ಸಮುದ್ರದ ಮೇಲೆ ನಡೆಯುವುದನ್ನು ಕಂಡಾಗ ದಿಗಿಲುಗೊಂಡು, “ಇವನು ಭೂತ[a]!” ಎಂದರು. ಅವರು ಭಯದಿಂದ ಕೂಗಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪ್ರೇತರೂಪ” ಅಥವಾ “ಭೂತದಂಥ ಕಾಣಿಕೆ.”
    reason: φάντασμα ಪದಕ್ಕೆ ‘apparition’ ಅಥವಾ ‘phantom’ ಎಂಬ ಪರ್ಯಾಯ ಅರ್ಥಗಳಿವೆ; ಇಲ್ಲಿ ಇದು ಶಿಷ್ಯರ ಭಯಭರಿತ ಗ್ರಹಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದ ಘಟನೆಗೂ ಶಿಷ್ಯರ ಹಠಾತ್ ಭಯಭರಿತ ಪ್ರತಿಕ್ರಿಯೆಗೂ ಇರುವ ಸೌಮ್ಯ ವೈರುಧ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: οἱ μαθηταὶ ἰδόντες αὐτὸν
  choice: ಶಿಷ್ಯರು ಆತನು … ನಡೆಯುತ್ತಿರುವುದನ್ನು ಕಂಡಾಗ
  rationale: ನಿರ್ದಿಷ್ಟ ಶಿಷ್ಯರ ಗುಂಪನ್ನು ಸೂಚಿಸುವುದರ ಜೊತೆಗೆ, ಗ್ರೀಕ್‌ನ ಭೂತಕಾಲದ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡದ ಕಾಲಸೂಚಕ ಉಪವಾಕ್ಯವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: ಸಮುದ್ರದ ಮೇಲೆ ನಡೆಯುತ್ತಿರುವುದನ್ನು
  rationale: ἐπί ಸಹಿತ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಇಲ್ಲಿ ಸಮುದ್ರದ ಮೇಲ್ಮೈ ಮೇಲೆ ನಡೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಸಮುದ್ರದ ಮೇಲೆ’ ಮೂಲಪದಕ್ಕೆ ಸಮೀಪವಾಗಿದ್ದು ಕನ್ನಡದಲ್ಲಿಯೂ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: ἐταράχθησαν
  choice: ದಿಗಿಲುಗೊಂಡು
  rationale: ταράσσω ಸೂಚಿಸುವ ತೀವ್ರ ಮನೋಕ್ಷೋಭೆಯನ್ನು, ನಂತರದ ಭಯದ ಕೂಗಿಗೆ ತಕ್ಕಂತೆ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Φάντασμά ἐστιν
  choice: ಅದು ಭೂತ!
  rationale: φάντασμα ಎಂದರೆ ಭೂತದಂಥ ಕಾಣಿಕೆ ಅಥವಾ ಪ್ರೇತರೂಪ. ‘ಭೂತ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ತಕ್ಷಣ ಅರ್ಥವಾಗುವ ಪದವಾಗಿದ್ದು, ಇದು ಶಿಷ್ಯರ ಭಯಭರಿತ ತಪ್ಪು ಗ್ರಹಿಕೆಯನ್ನು ವರದಿ ಮಾಡುತ್ತದೆ.
- source_word: ἀπὸ τοῦ φόβου ἔκραξαν
  choice: ಅವರು ಭಯದಿಂದ ಕೂಗಿದರು
  rationale: ἀπό ಇಲ್ಲಿ ಕಾರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; κράζω ಜೋರಾಗಿ ಕೂಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಆಯ್ಕೆ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಸರಳವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: φάντασμα ಎಂಬ ಪದವು ಸೂಚಿಸುವ ಅಸ್ತಿತ್ವದ ಸ್ವರೂಪ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಭೂತ’
  alternative: ‘ಪ್ರೇತರೂಪ’ ಅಥವಾ ‘ಛಾಯಾರೂಪ’
  rationale: ವಾಕ್ಯವು ಆತ್ಮಗಳ ಅಸ್ತಿತ್ವದ ಕುರಿತು ತಾತ್ತ್ವಿಕ ಪ್ರತಿಪಾದನೆ ಮಾಡುವುದಿಲ್ಲ; ಶಿಷ್ಯರು ಕಂಡದ್ದನ್ನು ಭಯದಿಂದ ಹೇಗೆ ಅರ್ಥಮಾಡಿಕೊಂಡರೆಂಬುದನ್ನು ಮಾತ್ರ ವರದಿ ಮಾಡುತ್ತದೆ. ಆದ್ದರಿಂದ ಪರಿಚಿತ ಪದವನ್ನು ಬಳಸಿದ್ದು, ಪರ್ಯಾಯ ಅರ್ಥಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಕಥನಾತ್ಮಕ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ದಿಗಿಲುಗೊಂಡು’ ಭಯದ ತೀವ್ರತೆಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಭಯದಿಂದ ಕೂಗಿದರು’ ಗ್ರೀಕ್‌ನ ಕಾರಣಾರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
