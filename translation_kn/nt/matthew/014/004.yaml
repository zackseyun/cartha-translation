- from: ಏಕೆಂದರೆ ಯೋಹಾನನು ಅವನಿಗೆ, “ಅವಳನ್ನು ಇಟ್ಟುಕೊಳ್ಳುವುದು ನಿನಗೆ ಧರ್ಮಸಮ್ಮತವಲ್ಲ[a]” ಎಂದು ಹೇಳುತ್ತಲೇ ಇದ್ದನು.
  to: ಏಕೆಂದರೆ ಯೋಹಾನನು ಅವನಿಗೆ, “ಅವಳನ್ನು ಹೊಂದಿರುವುದು ನಿನಗೆ ಧರ್ಮಸಮ್ಮತವಲ್ಲ[a]” ಎಂದು ಹೇಳುತ್ತಿದ್ದನು.
  rationale: The revision retains the explanatory γάρ (“ಏಕೆಂದರೆ”), John’s ongoing/repeated speech in the imperfect (“ಹೇಳುತ್ತಿದ್ದನು”), and the moral-legal prohibition of οὐκ ἔξεστιν (“ಧರ್ಮಸಮ್ಮತವಲ್ಲ”). It replaces the less fitting ‘keep’ expression with “ಹೊಂದಿರುವುದು,” which conveys the contextual force of ἔχειν without adding an explicit marital label, and makes the reporting syntax smoother.
  reviewer_model: gpt-5.6-terra
