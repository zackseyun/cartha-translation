id: MAT.14.4
reference: Matthew 14:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಯೋಹಾನನು ಅವನಿಗೆ, “ಅವಳನ್ನು ಹೊಂದಿರುವುದು ನಿನಗೆ ಧರ್ಮಸಮ್ಮತವಲ್ಲ[a]” ಎಂದು ಹೇಳುತ್ತಿದ್ದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅವಳನ್ನು ಹೊಂದಲು ನಿನಗೆ ಅನುಮತಿಯಿಲ್ಲ.”
    reason: ἔξεστιν ಪದದ ‘ಅನುಮತಿಸಲ್ಪಟ್ಟಿದೆ’ ಎಂಬ ನೇರ ಪರ್ಯಾಯ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
lexical_decisions:
- source_word: ἔλεγεν
  choice: ಹೇಳುತ್ತಲೇ ಇದ್ದನು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ರೂಪವು ಹಿಂದೆ ಮುಂದುವರಿದ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆದ್ದರಿಂದ ಕೇವಲ ‘ಹೇಳಿದನು’ ಎನ್ನುವುದಕ್ಕಿಂತ ಈ ಆಯ್ಕೆ ಮೂಲದ ಕಾಲಾರ್ಥವನ್ನು ಚೆನ್ನಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭಕ್ಕೆ ಕಾರಣಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಜೋಡಿಸುವ γάρ ಪದದ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: αὐτῷ
  choice: ಅವನಿಗೆ
  rationale: λέγω ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಬಂದಿರುವ ಸಂಪ್ರದಾನ ವಿಭಕ್ತಿಯ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ὁ Ἰωάννης
  choice: ಯೋಹಾನನು
  rationale: ಮೂಲವು ‘ಯೋಹಾನ’ ಎಂದಷ್ಟೇ ಹೇಳುತ್ತದೆ; ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿ ಅವನ ಗುರುತು ಸ್ಪಷ್ಟವಾಗಿರುವುದರಿಂದ ‘ಸ್ನಾನಿಕನಾದ’ ಎಂಬ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: Οὐκ ἔξεστίν
  choice: ಧರ್ಮಸಮ್ಮತವಲ್ಲ
  rationale: ಇದು ಕೇವಲ ವೈಯಕ್ತಿಕವಾಗಿ ‘ಸರಿಯಲ್ಲ’ ಎಂಬುದಕ್ಕಿಂತ, ನೈತಿಕ-ನಿಯಮಾತ್ಮಕವಾಗಿ ಅನುಮತಿಸಲ್ಪಟ್ಟಿಲ್ಲ ಎಂಬ ತೀಕ್ಷ್ಣ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ‘ಕಾನೂನುಬದ್ಧವಲ್ಲ’ ಎಂಬ ಆಧುನಿಕ ನಾಗರಿಕ-ಕಾನೂನಿನ ಸೀಮಿತ ಭಾವವನ್ನೂ ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: σοι
  choice: ನಿನಗೆ
  rationale: ἔξεστιν ಜೊತೆಗೆ ಬಂದಿರುವ ಸಂಪ್ರದಾನ ರೂಪವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಿನ್ಯಾಸದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔχειν
  choice: ಇಟ್ಟುಕೊಳ್ಳುವುದು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸ್ತ್ರೀಯನ್ನು ವೈವಾಹಿಕ ಸಂಗಾತಿಯಾಗಿ ಹೊಂದಿರುವ ಅರ್ಥ ಸೂಚಿತವಾಗಿದೆ. ‘ಇಟ್ಟುಕೊಳ್ಳುವುದು’ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಉಳಿಸಿ, ‘ಹೆಂಡತಿಯಾಗಿ’ ಎಂಬ ಸ್ಪಷ್ಟೀಕರಣವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: αὐτήν
  choice: ಅವಳನ್ನು
  rationale: ಹೆರೋದ್ಯಳನ್ನು ಸೂಚಿಸುವ ಸ್ತ್ರೀಲಿಂಗ ಸರ್ವನಾಮವನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೋಹಾನನ ಖಂಡನೆಯ ಸ್ವರೂಪ
  choice: ‘ಧರ್ಮಸಮ್ಮತವಲ್ಲ’ ಎಂಬ ನೈತಿಕ-ನಿಯಮಾತ್ಮಕ ನಿಷೇಧ
  alternative: ‘ಸರಿಯಲ್ಲ’ ಎಂಬ ಸಾಮಾನ್ಯ ನೈತಿಕ ಮೌಲ್ಯನಿರ್ಣಯ ಅಥವಾ ‘ಅನುಮತಿಯಿಲ್ಲ’ ಎಂಬ ಅನುಮತಿ-ಕೇಂದ್ರಿತ ನಿರೂಪಣೆ
  rationale: ἔξεστιν ಅನುಮತಿ ಅಥವಾ ಸಮ್ಮತತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಂಬಂಧದ ನೈತಿಕ ಅಸಮ್ಮತತೆಯ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಉಳಿಸಬೇಕಾದರೂ, ಯಾವ ನಿರ್ದಿಷ್ಟ ನಿಯಮವನ್ನು ಉಲ್ಲೇಖಿಸಲಾಗಿದೆ ಎಂಬ ವಿವರಣೆಯನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಗಂಭೀರವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಹೇಳುತ್ತಲೇ ಇದ್ದನು’ ಎಂಬುದು ಪುನರಾವರ್ತಿತ/ಮುಂದುವರಿದ ಹಿಂದಿನ ಕ್ರಿಯೆಯನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ‘ಧರ್ಮಸಮ್ಮತವಲ್ಲ’ ನೈತಿಕ-ನಿಯಮಾತ್ಮಕ ಭಾರವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಹೆಚ್ಚು ನೇರವಾದ ಅನುಮತಿ-ಆಧಾರಿತ ಪರ್ಯಾಯವನ್ನು ದಾಖಲಿಸುತ್ತದೆ.
