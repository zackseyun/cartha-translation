review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the dative addressee, and the imperfect force of ἔλεγεν. However, “ಇಟ್ಟುಕೊಳ್ಳುವುದು” ordinarily means ‘keep/retain’ and can introduce an unintended possessive or merely custodial sense; it is not the most accurate natural equivalent here for ἔχειν in its contextual relationship sense.
  naturalness: “ಯೋಹಾನನು ಅವನಿಗೆ, … ಎಂದು” has an unnecessary pause after “ಅವನಿಗೆ,” and “ಹೇಳುತ್ತಲೇ ಇದ್ದನು” can imply insistently or uninterruptedly, stronger than the imperfect requires. “ಹೇಳುತ್ತಿದ್ದನು” naturally expresses the ongoing/repeated past action without that added emphasis.
  terminology: “ಧರ್ಮಸಮ್ಮತವಲ್ಲ” suitably conveys the moral-legal force of οὐκ ἔξεστιν without specifying a particular law. “ಹೊಂದಿರುವುದು” is a more idiomatic contextual rendering of ἔχειν than “ಇಟ್ಟುಕೊಳ್ಳುವುದು,” while retaining the source’s restraint by not adding ‘as wife.’
  issues:
  - severity: medium
    issue: “ಅವಳನ್ನು ಇಟ್ಟುಕೊಳ್ಳುವುದು” for ἔχειν
    rationale: In modern Kannada this commonly denotes keeping or retaining someone/something and may sound objectifying or custodial. In this context ἔχειν denotes having Herodias in a marital/sexual relationship; “ಅವಳನ್ನು ಹೊಂದಿರುವುದು” better conveys that contextual sense without expanding it.
  - severity: low
    issue: “ಹೇಳುತ್ತಲೇ ಇದ್ದನು” overstates the imperfect slightly
    rationale: The construction may suggest constant or emphatic repetition (‘kept right on saying’). “ಹೇಳುತ್ತಿದ್ದನು” preserves the imperfect’s durative/repeated sense more neutrally.
  - severity: low
    issue: Comma after “ಅವನಿಗೆ”
    rationale: The comma disrupts the normal Kannada reporting construction and is unnecessary.
  revised_text: ಏಕೆಂದರೆ ಯೋಹಾನನು ಅವನಿಗೆ, “ಅವಳನ್ನು ಹೊಂದಿರುವುದು ನಿನಗೆ ಧರ್ಮಸಮ್ಮತವಲ್ಲ[a]” ಎಂದು ಹೇಳುತ್ತಿದ್ದನು.
  revised_footnotes:
