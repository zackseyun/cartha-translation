    text: ಅಥವಾ, “ಅವಳನ್ನು ಹೊಂದಲು ನಿನಗೆ ಅನುಮತಿಯಿಲ್ಲ.”
    reason: ἔξεστιν ಪದದ ‘ಅನುಮತಿಸಲ್ಪಟ್ಟಿದೆ’ ಎಂಬ ನೇರ ಪರ್ಯಾಯ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
  revision_rationale: The revision retains the explanatory γάρ (“ಏಕೆಂದರೆ”), John’s ongoing/repeated speech in the imperfect (“ಹೇಳುತ್ತಿದ್ದನು”), and the moral-legal prohibition of οὐκ ἔξεστιν (“ಧರ್ಮಸಮ್ಮತವಲ್ಲ”). It replaces the less fitting ‘keep’ expression with “ಹೊಂದಿರುವುದು,” which conveys the contextual force of ἔχειν without adding an explicit marital label, and makes the reporting syntax smoother.
