translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ ಕಾರಣಾರ್ಥಕ ‘ಕಡಿಸಿದನು’ ಎಂಬ ರೂಪವು ಗ್ರೀಕ್ ವಾಕ್ಯವು ಕ್ರಿಯೆಯನ್ನು ಅರಸನಿಗೆ ಆರೋಪಿಸುತ್ತಿದ್ದರೂ ಅದು ಕಳುಹಿಸಲ್ಪಟ್ಟವರ ಮೂಲಕ ನಡೆದದ್ದೆಂಬ ಸಂದರ್ಭವನ್ನು ಸಮತೋಲನದಿಂದ ಉಳಿಸುತ್ತದೆ.
