revisions:
- from: ಅವನು ಜನರನ್ನು ಕಳುಹಿಸಿ, ಸೆರೆಮನೆಯಲ್ಲಿ ಯೋಹಾನನ ತಲೆಯನ್ನು ಕಡಿಸಿದನು.[a]
  to: ಅವನು ಕಳುಹಿಸಿ, ಸೆರೆಮನೆಯಲ್ಲಿ ಯೋಹಾನನ ತಲೆಯನ್ನು ಕತ್ತರಿಸಿದನು.[a]
  rationale: The revision removes the unsupported object ‘ಜನರನ್ನು’ while retaining the Greek sequence of sending followed by beheading. It uses a clear modern Kannada expression for decapitation and preserves the source’s narrative attribution without adding that Herod ordered the act or naming those sent.
