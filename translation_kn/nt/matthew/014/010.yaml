  edition: SBLGNT
  text: καὶ πέμψας ἀπεκεφάλισεν ⸀τὸν Ἰωάννην ἐν τῇ φυλακῇ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: kn
  text: ಅವನು ಕಳುಹಿಸಿ, ಸೆರೆಮನೆಯಲ್ಲಿ ಯೋಹಾನನ ತಲೆಯನ್ನು ಕತ್ತರಿಸಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಹೆಚ್ಚು ಶಾಬ್ದಿಕವಾಗಿ: “ಕಳುಹಿಸಿ, ಅವನು ಸೆರೆಮನೆಯಲ್ಲಿ ಯೋಹಾನನ ತಲೆಯನ್ನು ಕತ್ತರಿಸಿದನು.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ಭೂತಕಾಲದ ಕೃದಂತದ ಬಳಿಕ ಮುಖ್ಯ ಕ್ರಿಯಾಪದ ಬರುತ್ತದೆ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ಅವನು …
  rationale: ಗ್ರೀಕ್‌ನ ಸರಳ ಕಥನಸಂಬಂಧಕವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಎಂದು ಇಡುವುದಕ್ಕಿಂತ, ಹಿಂದಿನ ವಾಕ್ಯದ ಮುಂದುವರಿಕೆಯನ್ನು ಸಹಜ ವಾಕ್ಯಕ್ರಮವೇ ಸೂಚಿಸುವಂತೆ ಮಾಡಲಾಗಿದೆ.
- source_word: πέμψας
  choice: ಜನರನ್ನು ಕಳುಹಿಸಿ
  rationale: ಇದು πέμπω ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲಿಕ ಕೃದಂತವಾಗಿದ್ದು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಯಾರನ್ನು ಕಳುಹಿಸಿದನೆಂಬುದು ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸ್ಪಷ್ಟವಿಲ್ಲ; ಆದರೆ ಕನ್ನಡದಲ್ಲಿ ಕೇವಲ ‘ಕಳುಹಿಸಿ’ ಎಂದರೆ ಅಪೂರ್ಣವಾಗುವುದರಿಂದ ಅನಿರ್ದಿಷ್ಟ ಬಹುವಚನ ‘ಜನರನ್ನು’ ಬಳಸಲಾಗಿದೆ. ಇದು ಹೆರೋದನೇ ಸ್ವತಃ ಶಿರಚ್ಛೇದ ಮಾಡಿದನೆಂದು ತಪ್ಪಾಗಿ ತೋರುವುದನ್ನೂ ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἀπεκεφάλισεν
  choice: ತಲೆಯನ್ನು ಕಡಿಸಿದನು
  rationale: ἀποκεφαλίζω ಎಂಬ ಕ್ರಿಯಾಪದವು ನಿರ್ದಿಷ್ಟವಾಗಿ ಶಿರಚ್ಛೇದ ಮಾಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ಸಹಜ ಕಾರಣಾರ್ಥಕ ರೂಪವು ಕೆಲಸವನ್ನು ಕಳುಹಿಸಲ್ಪಟ್ಟವರ ಮೂಲಕ ಮಾಡಿಸಿದ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ‘ಆಜ್ಞಾಪಿಸಿದನು’ ಎಂದು ಮೂಲದಲ್ಲಿಲ್ಲದ ಕ್ರಿಯೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: τὸν Ἰωάννην
  choice: ಯೋಹಾನನ
  rationale: ಮೂಲದಲ್ಲಿರುವ ವ್ಯಕ್ತಿನಾಮವನ್ನು ಮಾತ್ರ ಉಳಿಸಲಾಗಿದೆ; ಈ ವಚನದಲ್ಲಿ ಇಲ್ಲದ ‘ಸ್ನಾನಿಕ’ ಎಂಬ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἐν τῇ φυλακῇ
  choice: ಸೆರೆಮನೆಯಲ್ಲಿ
  rationale: φυλακή ಇಲ್ಲಿ ಬಂಧನದ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸೆರೆಮನೆಯಲ್ಲಿ’ ಎಂಬುದು ನಿರ್ದಿಷ್ಟ ಸ್ಥಳಾರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
