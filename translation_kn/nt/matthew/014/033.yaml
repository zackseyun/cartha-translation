id: MAT.14.33
reference: Matthew 14:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: kn
  text: ಆಗ ದೋಣಿಯಲ್ಲಿದ್ದವರು ಆತನನ್ನು ಆರಾಧಿಸಿ[a], “ನಿಜವಾಗಿಯೂ ನೀನು ದೇವರ ಮಗನು[b]” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಆತನಿಗೆ ಅಡ್ಡಬಿದ್ದು” / “ಆತನಿಗೆ ಗೌರವ ಸಲ್ಲಿಸಿ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಮೊಣಕಾಲೂರುವುದು ಅಥವಾ ಅಡ್ಡಬೀಳುವುದರ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸುವ ಭಕ್ತಿಗೌರವವನ್ನು ಸೂಚಿಸಬಹುದು; ಇಲ್ಲಿ ಸಂದರ್ಭವು “ಆರಾಧಿಸಿ” ಎಂಬ ಅರ್ಥವನ್ನು ಬೆಂಬಲಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ದೇವಪುತ್ರನು.” ಗ್ರೀಕ್‌ನಲ್ಲಿ “ದೇವರು” ಎಂಬ ಪದದ ಮುಂದೆ ನಿರ್ದಿಷ್ಟಪದವಿಲ್ಲದಿದ್ದರೂ, ಇಲ್ಲಿ ಈ ಪದಗುಚ್ಛವು ಕೇವಲ “ದೇವರ ಒಬ್ಬ ಮಗ” ಎಂದಲ್ಲ, ಬಿರುದಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: ಆಗ ... ಇದ್ದವರು
  rationale: δέ ಇಲ್ಲಿ ಸೌಮ್ಯವಾದ ಕಥನ-ಸಂಪರ್ಕಕ; ‘ಆಗ’ ಹಿಂದಿನ ಘಟನೆಯ ಬಳಿಕದ ಸಹಜ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. οἱ ಎಂಬುದು ದೋಣಿಯಲ್ಲಿದ್ದ ಜನರನ್ನು ಸೂಚಿಸುವ ನಾಮಪದೀಯ ಬಳಕೆ.
- source_word: ἐν τῷ πλοίῳ
  choice: ದೋಣಿಯಲ್ಲಿದ್ದವರು
  rationale: πλοῖονಗೆ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡ ಪದ ‘ದೋಣಿ’; ἐν ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ದೋಣಿಯಲ್ಲಿದ್ದವರು’ ಎಂದು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: προσεκύνησαν αὐτῷ
  choice: ಆತನನ್ನು ಆರಾಧಿಸಿ
  rationale: προσκυνέω ಅಡ್ಡಬೀಳುವುದು, ಗೌರವ ಸಲ್ಲಿಸುವುದು ಅಥವಾ ಆರಾಧಿಸುವುದು ಎಂಬ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು. ಸಮುದ್ರದ ಮೇಲಿನ ಯೇಸುವಿನ ಅಧಿಕಾರ ಮತ್ತು ತಕ್ಷಣದ ಒಪ್ಪಿಗೆಯ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ‘ಆರಾಧಿಸಿ’ ಸೂಕ್ತವಾಗಿದೆ; ಪರ್ಯಾಯ ದೈಹಿಕ ಭಂಗಿಯನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: λέγοντες
  choice: ಎಂದು ಹೇಳಿದರು
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ಕನ್ನಡದ ನೇರ ಮಾತಿನ ಸಹಜ ರಚನೆಯಾದ ‘ಎಂದು ಹೇಳಿದರು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: Ἀληθῶς
  choice: ನಿಜವಾಗಿಯೂ
  rationale: ಇದು ಗಂಭೀರವಾದ ದೃಢೀಕರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನಿಜವಾಗಿಯೂ’ ಆ ಬಲವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: θεοῦ υἱὸς
  choice: ದೇವರ ಮಗನು
  rationale: ಲೇಖವಿಲ್ಲದ ಗ್ರೀಕ್ ಪದಗುಚ್ಛವು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅನಿರ್ದಿಷ್ಟ ‘ಒಬ್ಬ ಮಗ’ ಎಂಬುದಕ್ಕಿಂತ ಗುರುತು/ಬಿರುದಿನ ಬಲ ಹೊಂದಿದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ದೇವರ ಮಗನು’ ಸಹಜವಾಗಿ ನಿರ್ದಿಷ್ಟ ಒಪ್ಪಿಗೆಯನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἶ
  choice: ನೀನು ... ಮಗನು
  rationale: ಗ್ರೀಕ್ ಸಂಯೋಜಕ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ನಾಮವಾಕ್ಯದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ಪ್ರತ್ಯೇಕ ‘ಆಗಿದ್ದೀ’ ಅನಗತ್ಯ ಮತ್ತು ಅಸಹಜ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಕಡೆಗೆ προσκυνέω ಕ್ರಿಯೆಯ ಬಲ
  choice: ‘ಆತನನ್ನು ಆರಾಧಿಸಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ
  alternative: ‘ಆತನಿಗೆ ಅಡ್ಡಬಿದ್ದು’ ಅಥವಾ ‘ಆತನಿಗೆ ಗೌರವ ಸಲ್ಲಿಸಿ’
  rationale: ತಕ್ಷಣದ ಕಥನಸಂದರ್ಭದಲ್ಲಿ ಯೇಸು ಸಮುದ್ರದ ಮೇಲೆ ಅಧಿಕಾರ ತೋರಿಸಿದ ನಂತರ ‘ದೇವರ ಮಗನು’ ಎಂಬ ಒಪ್ಪಿಗೆ ಬರುತ್ತದೆ; ಆದ್ದರಿಂದ ‘ಆರಾಧಿಸಿ’ ಅತ್ಯಂತ ಸೂಕ್ತ. ಆದರೂ ಗ್ರೀಕ್ ಕ್ರಿಯೆಯ ದೈಹಿಕ ಗೌರವಭಂಗಿಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: θεοῦ υἱὸς ಪದಗುಚ್ಛದ ನಿರ್ದಿಷ್ಟತೆ
  choice: ‘ದೇವರ ಮಗನು’ ಎಂದು ಬಿರುದು/ಗುರುತಿನ ಅರ್ಥದಲ್ಲಿ ಅನುವಾದಿಸಲಾಗಿದೆ
  alternative: ‘ದೇವರ ಒಬ್ಬ ಮಗನು’ ಅಥವಾ ‘ದೇವಪುತ್ರನು’
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ θεοῦ ಮುಂಚೆ ಲೇಖವಿಲ್ಲದಿದ್ದರೂ, ವಿಧೇಯ ನಾಮಪದ ರಚನೆ ಮತ್ತು ಮತ್ತಾಯನ ಈ ಒಪ್ಪಿಗೆಯ ಸಂದರ್ಭ ಅನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಕಡ್ಡಾಯಗೊಳಿಸುವುದಿಲ್ಲ. ‘ದೇವರ ಮಗನು’ ಮೂಲದ ಸಂಬಂಧವನ್ನೂ ಬಿರುದಿನ ಬಲವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆತನನ್ನು’ ಎಂಬ ರೂಪವು ಸುವಾರ್ತಾ ಪಠ್ಯದ ಘನತೆಯನ್ನು ಕಾಯುತ್ತದೆ; ‘ನಿಜವಾಗಿಯೂ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿದ್ದು ಒಪ್ಪಿಗೆಯ ಗಂಭೀರತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ [a], [b] ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಅಡಿಕುರಿತಿಗಳಿಗೆ ಸರಿಯಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
