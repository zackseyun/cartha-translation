  to: ಆತನ ಉಡುಪಿನ ಅಂಚನ್ನು[a] ಮಾತ್ರ ಮುಟ್ಟಲು ಬಿಡಬೇಕೆಂದು ಅವರು ಆತನನ್ನು ಬೇಡಿಕೊಳ್ಳುತ್ತಿದ್ದರು. ಅದನ್ನು ಮುಟ್ಟಿದವರೆಲ್ಲರೂ ಗುಣಮುಖರಾದರು.[b]
