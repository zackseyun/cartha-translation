id: MAT.14.36
reference: Matthew 14:36
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: kn
  text: ಆತನ ಉಡುಪಿನ ಅಂಚನ್ನು[a] ಮಾತ್ರ ಮುಟ್ಟಲು ಬಿಡಬೇಕೆಂದು ಅವರು ಆತನನ್ನು ಬೇಡಿಕೊಳ್ಳುತ್ತಿದ್ದರು. ಅದನ್ನು ಮುಟ್ಟಿದವರೆಲ್ಲರೂ ಗುಣಮುಖರಾದರು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಉಡುಪಿನ ಜಾಲರಿ’ ಅಥವಾ ‘ಕುಚ್ಚು’; ಗ್ರೀಕ್ ಪದವು ಉಡುಪಿನ ಅಂಚನ್ನು ಅಥವಾ ಅಂಚಿನಲ್ಲಿದ್ದ ಕುಚ್ಚನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ಸ್ವಸ್ಥರಾದರು’; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ‘ಗುಣಮುಖರಾದರು,’ ‘ಪುನಃ ಸುಸ್ಥಿತಿಗೆ ಬಂದರು,’ ಅಥವಾ ವಿಶಾಲವಾಗಿ ‘ರಕ್ಷಿಸಲ್ಪಟ್ಟರು/ಪಾರುಮಾಡಲ್ಪಟ್ಟರು’ ಎಂಬ ಅರ್ಥ ಕೊಡಬಹುದು. ಇಲ್ಲಿ ದೈಹಿಕ ಗುಣಮುಖತೆಯೇ ಸನ್ನಿವೇಶ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: ಬೇಡಿಕೊಳ್ಳುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ರೂಪವು ಅವರು ನಿರಂತರವಾಗಿ ಅಥವಾ ಪದೇಪದೇ ಮನವಿ ಮಾಡುತ್ತಿದ್ದುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಆಯ್ಕೆ ಆ ತೀವ್ರತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἵνα μόνον ἅψωνται
  choice: ಮುಟ್ಟುವುದಕ್ಕಾದರೂ ಅವಕಾಶ ಕೊಡಬೇಕೆಂದು
  rationale: ἵνα ಮತ್ತು ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯಾರೂಪವು ಮನವಿಯ ವಿಷಯವನ್ನು ಸೂಚಿಸುತ್ತವೆ. μόνον ಇಲ್ಲಿ ಅಷ್ಟೇ ಸಾಕೆಂಬ ಕನಿಷ್ಠ ನಿರೀಕ್ಷೆಯನ್ನು ಒತ್ತಿಹೇಳುವುದರಿಂದ ‘ಮುಟ್ಟುವುದಕ್ಕಾದರೂ’ ಸಹಜವಾಗಿ ಅದನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τοῦ κρασπέδου
  choice: ಅಂಚನ್ನು
  rationale: κράσπεδον ಉಡುಪಿನ ಅಂಚು, ಅಂಚಿನ ಜಾಲರಿ, ಅಥವಾ ಕುಚ್ಚನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಅಂಚು’ ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ತಮ್ಮ ಉಡುಪಿನ
  rationale: ἱμάτιον ಸಾಮಾನ್ಯವಾಗಿ ಮೇಲಂಗಿ ಅಥವಾ ಉಡುಪನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮದೊಂದಿಗೆ ‘ತಮ್ಮ ಉಡುಪು’ ಸಹಜವೂ ವ್ಯಾಪಕವೂ ಆಗಿದೆ.
- source_word: ὅσοι ἥψαντο
  choice: ಅದನ್ನು ಮುಟ್ಟಿದವರೆಲ್ಲರೂ
  rationale: ὅσοι ಯ ಪರಿಮಾಣಾತ್ಮಕ ಅರ್ಥವನ್ನು ‘ಮುಟ್ಟಿದವರೆಲ್ಲರೂ’ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಅದನ್ನು’ ಹಿಂದಿನ ಉಡುಪಿನ ಅಂಚನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: διεσώθησαν
  choice: ಗುಣಮುಖರಾದರು
  rationale: διασῴζω ರಕ್ಷಿಸು, ಪಾರುಮಾಡು, ಸಂಪೂರ್ಣವಾಗಿ ಚೇತರಿಸು ಎಂಬ ವ್ಯಾಪಕ ಅರ್ಥಗಳನ್ನು ಹೊಂದಿದ್ದರೂ, ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ದೈಹಿಕ ಸ್ವಸ್ಥತೆಯೇ ಮುನ್ನೆಲೆಯಲ್ಲಿದೆ. ‘ಗುಣಮುಖರಾದರು’ ಅದನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಸ್ವಸ್ಥಗೊಳಿಸುವ ಅದ್ಭುತದ ಸನ್ನಿವೇಶದಲ್ಲಿ διεσώθησαν ಎಂಬ ಪದದ ಅರ್ಥ
  choice: ದೈಹಿಕವಾಗಿ ‘ಗುಣಮುಖರಾದರು’
  alternative: ‘ರಕ್ಷಿಸಲ್ಪಟ್ಟರು’ ಅಥವಾ ‘ಸ್ವಸ್ಥರಾದರು’
  rationale: ಕ್ರಿಯಾಪದವು ವಿಶಾಲವಾದ ರಕ್ಷಣೆ ಅಥವಾ ಪಾರುಮಾಡುವಿಕೆಯ ಅರ್ಥವನ್ನೂ ಹೊಂದಬಹುದು. ಆದರೆ ತಕ್ಷಣದ ಸನ್ನಿವೇಶವು ದೈಹಿಕ ರೋಗನಿವಾರಣೆಯದು; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಗುಣಮುಖರಾದರು’ ಎಂದು ನೀಡಲಾಗಿದೆ, ಮತ್ತು ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆತನನ್ನು’ ಎಂಬುದು ಬೈಬಲ್ ಕಥನಕ್ಕೆ ಪರಿಚಿತವಾದರೂ ಅತಿಪುರಾತನವಾಗದ ರೂಪ; ಯೇಸುವನ್ನು ಸೂಚಿಸುವಾಗ ‘ತಮ್ಮ’ ಎಂಬ ಗೌರವಸೂಚಕ ರೂಪ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ವಾಕ್ಯಕ್ರಮವನ್ನು ಕನ್ನಡದ ಓದಿಗೆ ಸಹಜವಾಗುವಂತೆ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ನೀಡಲಾಗಿದೆ.
