id: MAT.14.28
reference: Matthew 14:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: kn
  text: ಅದಕ್ಕೆ ಪೇತ್ರನು ಅವನಿಗೆ, “ಕರ್ತನೇ, ನೀನೇ ಆಗಿದ್ದರೆ, ನೀರಿನ ಮೇಲೆ[a] ನಿನ್ನ ಬಳಿಗೆ ಬರಲು ನನಗೆ ಆಜ್ಞಾಪಿಸು” ಎಂದು ಉತ್ತರಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಜಲಗಳ ಮೇಲೆ’ ಎಂದು ಬಹುವಚನವಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ
  choice: ಅದಕ್ಕೆ ... ಉತ್ತರಿಸಿದನು
  rationale: ಇದು ಕಥನದಲ್ಲಿ ಹಿಂದಿನ ಮಾತು ಅಥವಾ ಘಟನೆಗೆ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಜೋಡಿಸುವ ಸಾಮಾನ್ಯ ಪ್ರಯೋಗ. ‘ಅದಕ್ಕೆ’ ಎಂಬುದು δέಯನ್ನು ಅತಿಯಾಗಿ ಒತ್ತಿಹೇಳದೆ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: αὐτῷ
  choice: ಅವನಿಗೆ
  rationale: ἀποκρίνομαι ಜೊತೆ ಬಂದಿರುವ ದತ್ತಿವಿಭಕ್ತಿಯ ವ್ಯಕ್ತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಅವನಿಗೆ ... ಉತ್ತರಿಸಿದನು’ ಎಂದು ಸಹಜವಾಗಿ ಹೇಳಲಾಗುತ್ತದೆ.
- source_word: ὁ Πέτρος
  choice: ಪೇತ್ರನು
  rationale: ಕನ್ನಡ ಸತ್ಯವೇದ ಪರಂಪರೆಯಲ್ಲಿ ಸ್ಥಿರವಾಗಿರುವ ಹೆಸರಿನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: Κύριε
  choice: ಕರ್ತನೇ
  rationale: ಯೇಸುವಿಗೆ ನೇರ ಸಂಬೋಧನೆಯಾಗಿರುವ κύριε ಗೌರವವನ್ನೂ ಸಂಭವನೀಯ ಕ್ರಿಸ್ತತಾತ್ತ್ವಿಕ ಮಹತ್ವವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ಗುರುವೇ’ ಅಥವಾ ಕೇವಲ ಗೌರವಸೂಚಕ ಪದಕ್ಕಿಂತ ‘ಕರ್ತನೇ’ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉತ್ತಮವಾಗಿ ಕಾಪಾಡುತ್ತದೆ.
- source_word: εἰ σὺ εἶ
  choice: ಅದು ನೀನೇ ಆಗಿದ್ದರೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಕಾಣುತ್ತಿರುವ ವ್ಯಕ್ತಿ ನಿಜವಾಗಿಯೂ ಯೇಸುವೇ ಎಂಬ ಗುರುತಿಸುವಿಕೆಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κέλευσόν
  choice: ಆಜ್ಞಾಪಿಸು
  rationale: κελεύω ಪದದಲ್ಲಿರುವ ಅಧಿಕಾರಪೂರ್ವಕ ನಿರ್ದೇಶನದ ಬಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: με ἐλθεῖν
  choice: ಬರಲು ನನಗೆ
  rationale: ಪೇತ್ರನು ಯೇಸುವಿನ ಕಡೆಗೆ ಚಲಿಸುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ‘ಬರಲು’ ಸಹಜವಾಗಿದೆ; ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ‘ನಡೆಯಲು’ ಎಂಬ ಕ್ರಿಯೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: πρὸς σὲ
  choice: ನಿನ್ನ ಬಳಿಗೆ
  rationale: πρός ಜೊತೆಗಿನ ಆಕ್ಯೂಸೇಟಿವ್ ವ್ಯಕ್ತಿಯ ಕಡೆಗಿನ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನಿನ್ನ ಬಳಿಗೆ’ ಗುರಿಯನ್ನೂ ಸಮೀಪಿಸುವಿಕೆಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐπὶ τὰ ὕδατα
  choice: ನೀರಿನ ಮೇಲೆ
  rationale: ಕನ್ನಡದಲ್ಲಿ ನೀರನ್ನು ಈ ಅರ್ಥದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಏಕವಚನ/ದ್ರವ್ಯನಾಮ ರೂಪದಲ್ಲಿ ಹೇಳುವುದು ಸಹಜ. ಗ್ರೀಕ್‌ನ ಬಹುವಚನವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿಗೆ κύριε ಎಂಬ ಪೇತ್ರನ ಸಂಬೋಧನೆಯ ಬಲ
  choice: ಕರ್ತನೇ
  alternative: ಗುರುವೇ / ಸ್ವಾಮಿಯೇ
  rationale: ಈ ಸಂಬೋಧನೆಯನ್ನು ಕೇವಲ ಸೌಜನ್ಯಪದವಾಗಿ ಕುಗ್ಗಿಸದೆ, ಗೌರವ ಮತ್ತು ಸಂಭವನೀಯ ಕ್ರಿಸ್ತತಾತ್ತ್ವಿಕ ತೂಕ ಎರಡನ್ನೂ ಉಳಿಸಲಾಗಿದೆ; ಆದರೆ ಈ ವಚನವೇ ಪೇತ್ರನ ಪೂರ್ಣ ತಾತ್ತ್ವಿಕ ಅರಿವನ್ನು ಸಾಬೀತುಪಡಿಸುತ್ತದೆ ಎಂದು ನಿರ್ಧರಿಸಲಾಗಿಲ್ಲ.
- issue: εἰ σὺ εἶ ಎಂಬ ಷರತ್ತಿನ ಅರ್ಥ
  choice: ಅದು ನೀನೇ ಆಗಿದ್ದರೆ
  alternative: ನೀನು ಅವನೇ ಆಗಿದ್ದರೆ
  rationale: ಇದು ಅವಿಶ್ವಾಸದ ಘೋಷಣೆಯೋ ಖಚಿತ ಗುರುತಿಸುವಿಕೆಯೋ ಎಂದು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸದೆ, ಸಂದರ್ಭದಲ್ಲಿನ ವ್ಯಕ್ತಿಯ ಗುರುತಿನ ಕುರಿತ ಷರತ್ತನ್ನು ಹಾಗೆಯೇ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಘನತೆಯುಳ್ಳ ನೇರ ಮಾತಿನ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ನೀರಿನ ಮೇಲೆ’ ಎಂಬ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಪ್ರಯೋಗವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇಟ್ಟು, ಮೂಲದ ಬಹುವಚನ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
