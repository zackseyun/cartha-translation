id: MAT.14.25
reference: Matthew 14:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: kn
  text: ರಾತ್ರಿಯ ನಾಲ್ಕನೆಯ ಕಾವಲಿನಲ್ಲಿ ಯೇಸು ಸಮುದ್ರದ ಮೇಲೆ ನಡೆಯುತ್ತಾ ಅವರ ಬಳಿಗೆ ಬಂದನು.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ರಾತ್ರಿಯ ನಾಲ್ಕನೆಯ ಕಾವಲು’ ಎಂದರೆ ರೋಮನ್ ಪದ್ಧತಿಯ ಕೊನೆಯ ರಾತ್ರಿಕಾವಲು ಅವಧಿ; ಇದು ಸರಿಸುಮಾರು ಮುಂಜಾನೆ 3ರಿಂದ 6 ಗಂಟೆಯವರೆಗಿನ ಸಮಯ.
    reason: cultural_note
  - marker: b
    text: ಅಥವಾ, ‘ಸಮುದ್ರದ ಮೇಲಾಗಿ ನಡೆಯುತ್ತಾ.’ ಕೆಲವರು ಇದನ್ನು ‘ಸಮುದ್ರದ ದಡದಲ್ಲಿ ನಡೆಯುತ್ತಾ’ ಎಂದು ಗ್ರಹಿಸಿದ್ದಾರೆ; ಆದರೆ ಸಂದರ್ಭವು ನೀರಿನ ಮೇಲೆಯೇ ನಡೆದದ್ದನ್ನು ಬಲವಾಗಿ ಬೆಂಬಲಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: ರಾತ್ರಿಯ ನಾಲ್ಕನೆಯ ಜಾಮದಲ್ಲಿ
  rationale: ಕಾಲಸೂಚಕ ದತ್ತಿವಿಭಕ್ತಿಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ‘ಜಾಮ’ ಎಂಬುದು ರಾತ್ರಿಯನ್ನು ಕಾವಲು ಅವಧಿಗಳಾಗಿ ವಿಭಜಿಸುವ ಐತಿಹಾಸಿಕ ಪದ್ಧತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸಲಿಲ್ಲ
  rationale: ಇದು ಕಥನವನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಪರ್ಕಕ; ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯಕ್ರಮವೇ ಆ ಸಂಪರ್ಕವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುವುದರಿಂದ ‘ಮತ್ತು’ ಸೇರಿಸುವುದು ಕೃತಕವಾಗುತ್ತದೆ.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: ಅವರ ಬಳಿಗೆ ಬಂದನು
  rationale: πρός ವ್ಯಕ್ತಿಗಳ ಕಡೆಗಿನ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἦλθεν ಜೊತೆಗೆ ‘ಬಳಿಗೆ ಬಂದನು’ ಸಹಜ ಮತ್ತು ನೇರ ಕನ್ನಡ.
- source_word: περιπατῶν
  choice: ನಡೆದುಕೊಂಡು
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸಮಕಾಲಿಕವಾಗಿ ನಡೆಯುವ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸಂಯೋಜಕ ಕ್ರಿಯಾರೂಪವು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: ಸಮುದ್ರದ ಮೇಲೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ನೀರಿನ ಮೇಲ್ಮೈಯ ಮೇಲೆ ನಡೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; θάλασσα ಪದದ ರೂಪವನ್ನು ಉಳಿಸಲು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸರೋವರ’ಕ್ಕಿಂತ ‘ಸಮುದ್ರ’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ.
- source_word: implicit subject of ἦλθεν
  choice: ಯೇಸು
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದಲ್ಲಿ ಕರ್ತೃ ಅಂತರ್ನಿಹಿತವಾಗಿದ್ದರೂ ಹಿಂದಿನ ಸಂದರ್ಭದ ಕರ್ತೃ ಯೇಸು; ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟತೆ ಮತ್ತು ಸಹಜತೆಗೆ ಹೆಸರನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸು ನೀರಿನ ಮೇಲೆ ನಡೆದ ಅದ್ಭುತದ ವರ್ಣನೆ
  choice: ಸಮುದ್ರದ ಮೇಲೆ ನಡೆದುಕೊಂಡು
  alternative: ಸಮುದ್ರದ ದಡದಲ್ಲಿ ನಡೆದುಕೊಂಡು
  rationale: περιπατῶν ἐπὶ τὴν θάλασσαν ಎಂಬ ಪದಬಂಧವೂ ಸಮೀಪದ ಸಂದರ್ಭವೂ ನೀರಿನ ಮೇಲಿನ ಚಲನೆಯನ್ನು ಬಲವಾಗಿ ಸೂಚಿಸುತ್ತವೆ. ಅನುವಾದವು ಅದ್ಭುತದ ಅರ್ಥವನ್ನು ತಗ್ಗಿಸದೆ, ಪಠ್ಯ ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚನ್ನೂ ಸೇರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಐತಿಹಾಸಿಕ ಕಾವಲು ವಿಭಾಗವನ್ನು ಉಳಿಸಲು ‘ಜಾಮ’ ಬಳಸಿದ್ದು, ಅದರ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
