id: MAT.14.35
reference: Matthew 14:35
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: kn
  text: ಆ ಸ್ಥಳದ ಪುರುಷರು ಅವರನ್ನು ಗುರುತಿಸಿದಾಗ, ಸುತ್ತಮುತ್ತಲಿನ ಆ ಪ್ರದೇಶಕ್ಕೆಲ್ಲ ಕಳುಹಿಸಿದರು[a] ಮತ್ತು ಅಸ್ವಸ್ಥರಾಗಿದ್ದವರೆಲ್ಲರನ್ನೂ ಅವರ ಬಳಿಗೆ ಕರೆತಂದರು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಕಳುಹಿಸಿದರು’ ಎಂಬ ಕ್ರಿಯೆಯ ಕರ್ಮವನ್ನು ಹೇಳಿಲ್ಲ; ಸಂದರ್ಭಾನುಸಾರ ಅವರು ಸುದ್ದಿ ಅಥವಾ ದೂತರನ್ನು ಕಳುಹಿಸಿದ್ದರೆಂದು ತಿಳಿಯಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, “ಕೆಟ್ಟ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದವರೆಲ್ಲರನ್ನು”; ಇದು ಅಸ್ವಸ್ಥರು ಅಥವಾ ರೋಗಿಗಳು ಎಂಬ ಅರ್ಥದ ನುಡಿಗಟ್ಟು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: ಗುರುತಿಸಿದಾಗ
  rationale: ಇಲ್ಲಿ ಕ್ರಿಯಾಪದವು ಯೇಸುವನ್ನು ಕಂಡು ಗುರುತಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ವಿಶಾಲ ಅರ್ಥದ ‘ತಿಳಿದುಕೊಳ್ಳುವುದು’ ಅಲ್ಲ.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: ಆ ಸ್ಥಳದ ಪುರುಷರು
  rationale: ἀνήρ ಎಂಬ ನಿರ್ದಿಷ್ಟ ಪುಲ್ಲಿಂಗ ಪದವನ್ನು ‘ಪುರುಷರು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ; τόπος ಅನ್ನು ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾಗಿ ‘ಸ್ಥಳ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: ಸುತ್ತಮುತ್ತಲಿನ ಆ ಪ್ರದೇಶದಲ್ಲೆಲ್ಲಾ ಸುದ್ದಿ ಕಳುಹಿಸಿ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕಳುಹಿಸಲಾದ ವಸ್ತು ಹೇಳದೆ ಉಳಿದಿದ್ದರೂ, ಸಂದರ್ಭವು ಸುದ್ದಿ ಅಥವಾ ಸಂದೇಶವನ್ನು ಕಳುಹಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಸಹಜತೆಗಾಗಿ ‘ಸುದ್ದಿ’ಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: προσήνεγκαν αὐτῷ
  choice: ಅವರ ಬಳಿಗೆ ಕರೆತಂದರು
  rationale: ರೋಗಿಗಳನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆತರುವ ಕಥನಾತ್ಮಕ ಅರ್ಥವನ್ನು ಇದು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಯಜ್ಞಾರ್ಪಣೆಯ ಅರ್ಥ ಇಲ್ಲ.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ಅಸ್ವಸ್ಥರಾಗಿದ್ದವರೆಲ್ಲರನ್ನೂ
  rationale: κακῶς ἔχειν ಎಂಬ ನುಡಿಗಟ್ಟು ಅನಾರೋಗ್ಯದಿಂದಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಅಸ್ವಸ್ಥರಾಗಿದ್ದವರು’ ಆ ಅರ್ಥವನ್ನು ಗೌರವಯುತ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
