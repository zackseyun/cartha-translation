  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವನ್ನು ಸೂಚಿಸುವ ಸರ್ವನಾಮಕ್ಕೆ ಗೌರವಬಹುವಚನ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಅಸ್ಪಷ್ಟ ಕರ್ಮವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ‘ಸುದ್ದಿ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಿ, ಮೂಲದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು [a] ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
