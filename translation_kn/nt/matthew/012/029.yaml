id: MAT.12.29
reference: Matthew 12:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: kn
  text: ಅಥವಾ, ಒಬ್ಬನು ಮೊದಲು ಬಲಿಷ್ಠನನ್ನು ಕಟ್ಟಿಹಾಕದೆ[b] ಅವನ ಮನೆಯೊಳಗೆ ಪ್ರವೇಶಿಸಿ ಅವನ ಸಾಮಾನುಗಳನ್ನು[a] ಕಸಿದುಕೊಳ್ಳುವುದು ಹೇಗೆ ಸಾಧ್ಯ? ಆಗ ಅವನು ಅವನ ಮನೆಯನ್ನು ಕೊಳ್ಳೆಹೊಡೆಯುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವನ ಸೊತ್ತುಗಳನ್ನು.’ ಗ್ರೀಕ್ ಪದವು ಅಕ್ಷರಶಃ ಪಾತ್ರೆಗಳು ಅಥವಾ ಉಪಕರಣಗಳನ್ನು, ಇಲ್ಲವೆ ವಿಶಾಲವಾಗಿ ಒಬ್ಬನಿಗೆ ಸೇರಿದ ಸಾಮಾನುಗಳನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಬಂಧಿಸದೆ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: ಅಥವಾ
  rationale: ಹಿಂದಿನ ವಾದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಪರ್ಯಾಯ ವಿವರಣಾತ್ಮಕ ಹೋಲಿಕೆಯನ್ನು ಸಹಜವಾಗಿ ಪರಿಚಯಿಸುತ್ತದೆ.
- source_word: δύναταί τις
  choice: ಒಬ್ಬನು ... ಹೇಗೆ ಸಾಧ್ಯ?
  rationale: ಅನಿರ್ದಿಷ್ಟ ವ್ಯಕ್ತಿಯ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನೂ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯ ರೂಪವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: ಬಲಿಷ್ಠನು / ಬಲಿಷ್ಠನನ್ನು
  rationale: ಗ್ರೀಕ್‌ನ ವಿಶೇಷಣದ ನಾಮಪದೀಯ ಬಳಕೆಯನ್ನು ಸ್ಪಷ್ಟವಾದ ಪುಲ್ಲಿಂಗ ರೂಪದಲ್ಲಿ ಉಳಿಸಿ, ರೂಪಕದ ಬಲಿಷ್ಠ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ಅವನ ಸಾಮಾನುಗಳು
  rationale: σκεύη ಎಂಬುದು ಅಕ್ಷರಶಃ ಪಾತ್ರೆಗಳು ಅಥವಾ ಉಪಕರಣಗಳನ್ನು ಸೂಚಿಸಬಹುದಾದರೂ, ಮನೆ ದೋಚುವ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಮನೆಯಲ್ಲಿರುವ ವಸ್ತುಗಳು ಅಥವಾ ಸೊತ್ತುಗಳ ವಿಶಾಲ ಅರ್ಥವನ್ನು ‘ಸಾಮಾನುಗಳು’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἁρπάσαι
  choice: ಕಸಿದುಕೊಳ್ಳುವುದು
  rationale: ಬಲವಂತವಾಗಿ ತೆಗೆದುಕೊಳ್ಳುವ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ನಂತರದ διαρπάσει ಎಂಬ ಹೆಚ್ಚು ವ್ಯಾಪಕವಾದ ಕೊಳ್ಳೆಯ ಕ್ರಿಯೆಯಿಂದ ಇದನ್ನು ಬೇರ್ಪಡಿಸುತ್ತದೆ.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: ಮೊದಲು ... ಕಟ್ಟಿಹಾಕದೆ
  rationale: ಷರತ್ತನ್ನೂ ಕ್ರಿಯೆಗಳ ಕ್ರಮವನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಕಟ್ಟಿಹಾಕು’ ಎಂಬುದು δήσῃಯ ಸ್ಪಷ್ಟವಾದ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ.
- source_word: καὶ τότε
  choice: ನಂತರವೇ
  rationale: ಕಟ್ಟಿಹಾಕಿದ ಮೇಲೆ ಮಾತ್ರ ಕೊಳ್ಳೆಹೊಡೆಯಲು ಸಾಧ್ಯ ಎಂಬ ಕ್ರಮಾತ್ಮಕ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διαρπάσει
  choice: ಕೊಳ್ಳೆಹೊಡೆಯುವನು
  rationale: ಮನೆಯಲ್ಲಿರುವುದನ್ನು ವ್ಯಾಪಕವಾಗಿ ದೋಚುವ ತೀವ್ರ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ ಮತ್ತು ಹಿಂದಿನ ‘ಕಸಿದುಕೊಳ್ಳು’ ಎಂಬ ಕ್ರಿಯೆಯಿಂದ ವ್ಯತ್ಯಾಸವನ್ನು ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: ಅವನ ಮನೆ
  rationale: ತಕ್ಷಣದ ದೃಶ್ಯದಲ್ಲಿರುವ ಮನೆಯ ಅಕ್ಷರಾರ್ಥವನ್ನು ಉಳಿಸಿ, ‘ಆಧಿಪತ್ಯ’ ಅಥವಾ ‘ಮನೆಯವರು’ ಎಂಬ ವ್ಯಾಖ್ಯಾನವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ರೂಪಕದಲ್ಲಿನ ಪುಲ್ಲಿಂಗ ವ್ಯಕ್ತಿಸೂಚನೆ
  choice: ಬಲಿಷ್ಠನು / ಒಬ್ಬನು
  alternative: ಬಲಶಾಲಿಯಾದವನು / ಯಾರಾದರೂ
  rationale: ಗ್ರೀಕ್‌ನ ಕಾಂಕ್ರೀಟಾದ ಪುಲ್ಲಿಂಗ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತಾ, ಅನಿರ್ದಿಷ್ಟ ಕರ್ತೃವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ‘ಮನೆ’ ಮತ್ತು ‘ಸಾಮಾನುಗಳು’ ಎಂಬ ರೂಪಕದ ವ್ಯಾಪ್ತಿ
  choice: ಕಳ್ಳತನ/ಕೊಳ್ಳೆಯ ಸ್ಪಷ್ಟ ರೂಪಕವನ್ನೇ ಉಳಿಸುವುದು
  alternative: ಆಧಿಪತ್ಯ/ಸೊತ್ತುಗಳು ಎಂದು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ಭಾಷಾಂತರಿಸುವುದು
  rationale: ಸಂದರ್ಭವು ಯೇಸುವಿನ ದೆವ್ವಗಳ ಮೇಲಿನ ಅಧಿಕಾರಕ್ಕೆ ಸಂಬಂಧಿಸಿದರೂ, ವಚನದ ರೂಪಕಕ್ಕೆ ಸಂಪೂರ್ಣ ಅಲಂಕಾರಿಕ ವಿವರಣೆಯನ್ನು ಭಾಷಾಂತರದಲ್ಲೇ ಸೇರಿಸದೆ ಅದರ ನೈಜ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ dignified ಆದರೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ‘ನುಗ್ಗಿ’, ‘ಕಸಿದುಕೊಳ್ಳುವುದು’, ‘ಕೊಳ್ಳೆಹೊಡೆಯುವನು’ ಎಂಬ ಪದಗಳು ಮನೆಯೊಳಗೆ ಬಲವಂತವಾಗಿ ಪ್ರವೇಶಿಸಿ ದೋಚುವ ರೂಪಕದ ಜೀವಂತಿಕೆಯನ್ನು ಉಳಿಸುತ್ತವೆ. ಎಲ್ಲಾ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
