id: MAT.12.13
reference: Matthew 12:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: kn
  text: ಆಗ ಅವನು ಆ ಮನುಷ್ಯನಿಗೆ, “ನಿನ್ನ ಕೈಯನ್ನು ಚಾಚು” ಎಂದು ಹೇಳುತ್ತಾನೆ. ಅವನು ಅದನ್ನು ಚಾಚಿದನು; ಅದು ಪುನಃಸ್ಥಾಪಿಸಲ್ಪಟ್ಟು[a], ಇನ್ನೊಂದು ಕೈಯಂತೆಯೇ ಸ್ವಸ್ಥವಾಯಿತು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಗುಣವಾಯಿತು”; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸರಿಯಾದ ಸ್ಥಿತಿಗೆ ಪುನಃಸ್ಥಾಪನೆಯಾಗುವುದಕ್ಕೆ ಒತ್ತು ನೀಡುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, “ಇನ್ನೊಂದರಂತೆ ಸ್ವಸ್ಥವಾಗಿ”; ಇಲ್ಲಿ “ಇನ್ನೊಂದು” ಎಂಬುದು ಆ ಮನುಷ್ಯನ ಇನ್ನೊಂದು ಕೈಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಕಥನದ ಮುಂದಿನ ಘಟನೆಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುವ ಕಾಲವಾಚಕ ಪದ.
- source_word: λέγει
  choice: ಹೇಳುತ್ತಾನೆ
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಿ, ಕಥನದ ಸಜೀವತೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: τῷ ἀνθρώπῳ
  choice: ಆ ಮನುಷ್ಯನಿಗೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ಪುರುಷನನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: ನಿನ್ನ ಕೈಯನ್ನು ಚಾಚು
  rationale: ನೇರ ಆಜ್ಞೆಯನ್ನು ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; χείρ ಅನ್ನು ಅದರ ಸಾಮಾನ್ಯ ಅರ್ಥವಾದ ‘ಕೈ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἐξέτεινεν
  choice: ಅವನು ಅದನ್ನು ಚಾಚಿದನು
  rationale: ಆಜ್ಞೆ ಮತ್ತು ಪ್ರತಿಕ್ರಿಯೆಯಲ್ಲಿರುವ ಒಂದೇ ಕ್ರಿಯಾಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದ ಸ್ಪಷ್ಟತೆಗೆ ‘ಅದನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: ἀπεκατεστάθη
  choice: ಅದು ಮೊದಲಿನ ಸ್ಥಿತಿಗೆ ಬಂದು
  rationale: ಕ್ರಿಯಾಪದವು ಸರಿಯಾದ ಅಥವಾ ಹಿಂದಿನ ಸ್ಥಿತಿಗೆ ಪುನಃ ತರುವ ಅರ್ಥಕ್ಕೆ ಒತ್ತು ನೀಡುತ್ತದೆ; ಕೃತಕವಾಗಿ ಕೇಳಿಸುವ ‘ಪುನಃಸ್ಥಾಪಿಸಲ್ಪಟ್ಟಿತು’ ಎಂಬ ರೂಪವನ್ನು ತಪ್ಪಿಸಿ ಸಹಜ ಕನ್ನಡ ಬಳಸಲಾಗಿದೆ.
- source_word: ὑγιὴς
  choice: ಆರೋಗ್ಯವಾಯಿತು
  rationale: ಕೈ ದೈಹಿಕವಾಗಿ ಸ್ವಸ್ಥವಾದುದನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὡς ἡ ἄλλη
  choice: ಇನ್ನೊಂದು ಕೈಯಂತೆಯೇ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸ್ತ್ರೀಲಿಂಗ ರೂಪದಿಂದ ಸೂಚಿತವಾಗಿರುವ ‘ಇನ್ನೊಂದು ಕೈ’ ಎಂಬ ಉಲ್ಲೇಖವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಗುಣಪಡಿಸುವಿಕೆಯ ಸ್ವರೂಪದ ವರ್ಣನೆ
  choice: ಕೈ ಮೊದಲಿನ ಸ್ಥಿತಿಗೆ ಬಂದು, ಇನ್ನೊಂದು ಕೈಯಂತೆಯೇ ಆರೋಗ್ಯವಾಯಿತು
  alternative: ಕೈ ಗುಣವಾಯಿತು / ಕೈ ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥವಾಯಿತು
  rationale: ವಾಕ್ಯವು ಅದ್ಭುತವನ್ನು ಸರಳವಾಗಿ ವರ್ಣಿಸುತ್ತದೆ. ‘ಮೊದಲಿನ ಸ್ಥಿತಿಗೆ ಬಂದು’ ಎಂಬುದು ἀπεκατεστάθη ಪದದ ಪುನಃಸ್ಥಾಪನೆಯ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪಠ್ಯದಲ್ಲಿಲ್ಲದ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ‘ಹೇಳುತ್ತಾನೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ; ಮುಂದಿನ ಕ್ರಿಯೆಗಳಿಗೆ ಸಹಜ ಭೂತಕಾಲ ಬಳಸಲಾಗಿದೆ. ಅಡಿಕುರಿತು ಗುರುತುಗಳನ್ನು ಅವು ವಿವರಿಸುವ ಪದಬಂಧಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
