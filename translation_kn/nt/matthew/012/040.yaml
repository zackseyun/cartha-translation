id: MAT.12.40
reference: Matthew 12:40
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: kn
  text: ಏಕೆಂದರೆ, ಯೋನನು ದೊಡ್ಡ ಸಮುದ್ರಜೀವಿಯ[a] ಹೊಟ್ಟೆಯಲ್ಲಿ ಮೂರು ದಿನಗಳು ಮತ್ತು ಮೂರು ರಾತ್ರಿಗಳು[b] ಇದ್ದಂತೆಯೇ, ಹಾಗೆಯೇ ಮನುಷ್ಯಕುಮಾರನು ಭೂಮಿಯ ಹೃದಯದಲ್ಲಿ[c] ಮೂರು ದಿನಗಳು ಮತ್ತು ಮೂರು ರಾತ್ರಿಗಳು ಇರುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ದೊಡ್ಡ ಮೀನು.’ ಗ್ರೀಕ್ ಪದವು ದೊಡ್ಡ ಸಮುದ್ರಜೀವಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅದು ನಿರ್ದಿಷ್ಟ ಪ್ರಾಣಿಶಾಸ್ತ್ರೀಯ ಜಾತಿಗೆ ಸೀಮಿತವಲ್ಲ.
    reason: lexical_alternative
  - marker: b
    text: ‘ಮೂರು ದಿನಗಳು ಮತ್ತು ಮೂರು ರಾತ್ರಿಗಳು’ ಎಂಬುದನ್ನು ಕೆಲವರು ಮೂರು ದಿನಗಳ ಭಾಗಗಳನ್ನೂ ಒಳಗೊಂಡ ನುಡಿಗಟ್ಟಾಗಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ; ಇತರರು ಅದನ್ನು ಹೆಚ್ಚು ಕಟ್ಟುನಿಟ್ಟಾದ ಕಾಲಾವಧಿಯಾಗಿ ಗ್ರಹಿಸುತ್ತಾರೆ.
    reason: alternative_reading
  - marker: c
    text: ‘ಭೂಮಿಯ ಹೃದಯದಲ್ಲಿ’ ಎಂಬುದು ಸಮಾಧಿ, ಭೂಮಿಯ ಆಳ, ಅಥವಾ ಮೃತರ ಲೋಕವನ್ನು ಸೂಚಿಸಬಹುದು; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಗ್ರೀಕ್ ರೂಪಕವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ಇದ್ದಂತೆಯೇ
  rationale: ὥσπερ ಸೂಚಿಸುವ ಹೋಲಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ. γάρನ ಸಂಪರ್ಕಾರ್ಥವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಏಕೆಂದರೆ’ ಎಂದು ಹೇಳಿದರೆ ಕನ್ನಡ ವಾಕ್ಯ ಭಾರವಾಗುವುದರಿಂದ ಹೋಲಿಕೆಯ ರಚನೆಯಲ್ಲಿಯೇ ಒಳಗೊಳ್ಳಿಸಲಾಗಿದೆ.
- source_word: Ἰωνᾶς
  choice: ಯೋನನು
  rationale: ಕನ್ನಡ ಸಾಂಪ್ರದಾಯಿಕ ರೂಪವಾದ ‘ಯೋನ’ವನ್ನು ಕರ್ತೃವಿಭಕ್ತಿಯೊಂದಿಗೆ ಬಳಸಲಾಗಿದೆ.
- source_word: ἐν τῇ κοιλίᾳ τοῦ κήτους
  choice: ಸಮುದ್ರದ ಮಹಾ ಜೀವಿಯ ಹೊಟ್ಟೆಯಲ್ಲಿ
  rationale: κοιλίαಗೆ ಸಹಜವಾದ ‘ಹೊಟ್ಟೆ’ ಮತ್ತು κῆτοςಗೆ ನಿರ್ದಿಷ್ಟ ಪ್ರಾಣಿಶಾಸ್ತ್ರೀಯ ಜಾತಿಯನ್ನು ಹೇರದ ‘ಸಮುದ್ರದ ಮಹಾ ಜೀವಿ’ ಬಳಸಲಾಗಿದೆ.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: ಮೂರು ಹಗಲು ಮತ್ತು ಮೂರು ರಾತ್ರಿ
  rationale: ಮೂಲದ ಕಾಲಸೂಚಕ ಪದಬಂಧವನ್ನು ಎರಡೂ ಸ್ಥಳಗಳಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಯೇಸುವಿನ ಸ್ವನಾಮಪದವಿಯ ಬೈಬಲೀಯ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸುವ ಸ್ಥಿರ ಕನ್ನಡ ರೂಪ.
- source_word: ἔσται
  choice: ಇರುವನು
  rationale: εἰμί ಕ್ರಿಯಾಪದದ ಭವಿಷ್ಯಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ಉಳಿಯುವನು’ ಎಂಬ ಅವಧಿಸೂಚಕ ಛಾಯೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: ಭೂಮಿಯ ಹೃದಯದಲ್ಲಿ
  rationale: καρδία ಎಂಬ ರೂಪಕವನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ‘ಆಳದಲ್ಲಿ’ ಅಥವಾ ‘ಸಮಾಧಿಯಲ್ಲಿ’ ಎಂದು ಬದಲಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ‘ಭೂಮಿಯ ಹೃದಯದಲ್ಲಿ’ ಎಂಬುದರ ಅರ್ಥ
  choice: ರೂಪಕವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಸಮಾಧಿಯಲ್ಲಿ; ಭೂಮಿಯ ಆಳದಲ್ಲಿ; ಮೃತರ ಲೋಕದಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ಪದಬಂಧವು ಈ ವ್ಯಾಖ್ಯಾನಗಳಲ್ಲಿ ಒಂದನ್ನೇ ನಿರ್ಣಾಯಕವಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ತಾತ್ವಿಕ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಪರಿಹರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- issue: ‘ಮೂರು ಹಗಲು ಮತ್ತು ಮೂರು ರಾತ್ರಿ’ ಎಂಬುದರ ಕಾಲಾರ್ಥ
  choice: ಮೂಲದಲ್ಲಿರುವ ಕಾಲಸೂಚಕ ಪದಬಂಧವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಮೂರು ದಿನಗಳ ಭಾಗಗಳನ್ನು ಒಳಗೊಂಡ ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟು; ಕಟ್ಟುನಿಟ್ಟಾದ ಎಪ್ಪತ್ತೆರಡು ಗಂಟೆಗಳು
  rationale: ಕಾಲಗಣನೆಯ ಕುರಿತ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ, ವಚನದ ಸ್ಪಷ್ಟ ಪದಗಳನ್ನು ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. κῆτοςನ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ‘ಸಮುದ್ರದ ಮಹಾ ಜೀವಿ’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಿರುವುದರಿಂದ ಅದಕ್ಕಾಗಿ ಪ್ರತ್ಯೇಕ ಪಾದಟಿಪ್ಪಣಿ ಅಗತ್ಯವಿಲ್ಲ.
