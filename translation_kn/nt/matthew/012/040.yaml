- from: ಯೋನನು ಸಮುದ್ರದ ಮಹಾ ಜೀವಿಯ ಹೊಟ್ಟೆಯಲ್ಲಿ ಮೂರು ಹಗಲು ಮತ್ತು ಮೂರು ರಾತ್ರಿ[a] ಇದ್ದಂತೆಯೇ, ಮನುಷ್ಯಕುಮಾರನು ಭೂಮಿಯ ಹೃದಯದಲ್ಲಿ[b] ಮೂರು ಹಗಲು ಮತ್ತು ಮೂರು ರಾತ್ರಿ ಇರುವನು.
