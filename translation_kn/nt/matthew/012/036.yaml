id: MAT.12.36
reference: Matthew 12:36
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: kn
  text: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದು ಏನೆಂದರೆ, ಜನರು ಆಡುವ ಪ್ರತಿಯೊಂದು ಅಜಾಗರೂಕ ಮಾತಿನ ವಿಷಯವಾಗಿ ಅವರು ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಲೆಕ್ಕ ಕೊಡುತ್ತಾರೆ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δέ ಹಿಂದಿನ ಮಾತಿಗೆ ಸಂಬಂಧಿಸಿದ ಎಚ್ಚರಿಕೆಯ ತಿರುವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಸಹಜವಾಗಿದೆ; λέγω ὑμῖν ಎಂಬ ನೇರ ಸಂಬೋಧನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: πᾶν ῥῆμα
  choice: ಪ್ರತಿಯೊಂದು ಮಾತು
  rationale: πᾶν ಏಕವಚನ ನಾಮಪದದೊಂದಿಗೆ ವಿತರಣಾರ್ಥಕವಾದ ‘ಪ್ರತಿಯೊಂದು’ ಎಂಬ ಅರ್ಥ ಕೊಡುತ್ತದೆ; ῥῆμα ಇಲ್ಲಿ ಉಚ್ಚರಿಸಲಾದ ಮಾತನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀργὸν
  choice: ಅಜಾಗರೂಕವಾಗಿ ಆಡುವ
  rationale: ἀργός ಎಂಬ ಪದಕ್ಕೆ ‘ಕೆಲಸವಿಲ್ಲದ, ಫಲವಿಲ್ಲದ, ವ್ಯರ್ಥ’ ಎಂಬ ಮೂಲಾರ್ಥಗಳಿದ್ದರೂ, ನ್ಯಾಯತೀರ್ಪಿನ ಸನ್ನಿವೇಶದಲ್ಲಿ ಹೊಣೆಗಾರಿಕೆಯಿಲ್ಲದೆ ಆಡಿದ ಮಾತಿನ ನೈತಿಕ ಗಂಭೀರತೆಯನ್ನು ‘ಅಜಾಗರೂಕವಾಗಿ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: ಜನರು ... ಆಡುವ
  rationale: οἱ ἄνθρωποι ಎಲ್ಲ ಮಾನವರನ್ನೂ ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಜನರು’ ಲಿಂಗನಿರಪೇಕ್ಷವೂ ಸಹಜವೂ ಆಗಿದೆ. ಮಾತಿನೊಂದಿಗೆ ‘ಆಡುವ’ ಎಂಬ ಕನ್ನಡ ಪ್ರಯೋಗವು λαλέω ಅನ್ನು ಸೂಕ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: ಮಾತಿಗೂ ... ಲೆಕ್ಕ ಕೊಡಬೇಕಾಗುತ್ತದೆ
  rationale: ἀποδίδωμι ಮತ್ತು λόγος ಸೇರಿ ‘ಲೆಕ್ಕ ಕೊಡು’ ಎಂಬ ಹೊಣೆಗಾರಿಕೆಯ ನುಡಿಗಟ್ಟನ್ನು ರೂಪಿಸುತ್ತವೆ. ‘ಮಾತಿಗೂ’ ಎಂಬ ದತ್ತಿವಿಭಕ್ತಿ περὶ αὐτοῦ ಸೂಚಿಸುವ, ಆ ಮಾತಿನ ವಿಷಯವಾಗಿ ಲೆಕ್ಕ ನೀಡುವ ಸಂಬಂಧವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ
  rationale: κρίσις ಇಲ್ಲಿ ನ್ಯಾಯಾಂಗಸ್ವರೂಪದ ತೀರ್ಪನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನ್ಯಾಯತೀರ್ಪಿನ ದಿನ’ ನಿಖರವಾಗಿಯೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿಯೂ ಇದೆ.
theological_decisions:
- issue: ἀργόν ಪದದ ನೈತಿಕ ಬಲ
  choice: ಅಜಾಗರೂಕವಾಗಿ ಆಡುವ ಮಾತು
  alternative: ವ್ಯರ್ಥವಾದ ಅಥವಾ ಫಲವಿಲ್ಲದ ಮಾತು
  rationale: ಯೇಸುವಿನ ಎಚ್ಚರಿಕೆಯಲ್ಲಿ ಮಾತಿಗೆ ದೈವಿಕ ನ್ಯಾಯತೀರ್ಪಿನ ಮುಂದೆ ಹೊಣೆ ಇದೆ. ‘ಅಜಾಗರೂಕವಾಗಿ’ ಎಂಬುದು ದುರುದ್ದೇಶವನ್ನೇ ಕಡ್ಡಾಯವಾಗಿ ಆರೋಪಿಸದೆ ಹೊಣೆಗಾರಿಕೆಯ ಕೊರತೆಯನ್ನು ತೋರಿಸುತ್ತದೆ; ‘ವ್ಯರ್ಥ’ ಎಂಬ ಮೂಲಾರ್ಥದ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: οἱ ἄνθρωποι ಪದಗುಚ್ಛದ ಸಾಮಾನ್ಯ ಮಾನವಸೂಚಕ ಅರ್ಥ
  choice: ಜನರು
  alternative: ಮನುಷ್ಯರು
  rationale: ಗ್ರೀಕ್ ಪದಗುಚ್ಛವು ಪುರುಷರನ್ನು ಮಾತ್ರವಲ್ಲ, ಮಾನವರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ‘ಜನರು’ ಈ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- issue: ಅಂತಿಮ ಲೆಕ್ಕಕೊಡುವಿಕೆಯ ಸ್ವರೂಪ
  choice: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಲೆಕ್ಕ ಕೊಡಬೇಕಾಗುತ್ತದೆ
  alternative: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಅದರ ಕುರಿತು ಲೆಕ್ಕ ಕೊಡುವರು
  rationale: ಮೂಲದ ಭವಿಷ್ಯಕಾಲದ ನಿಶ್ಚಿತತೆಯನ್ನೂ ನ್ಯಾಯದ ಮುಂದೆ ಇರುವ ಹೊಣೆಗಾರಿಕೆಯನ್ನೂ ಉಳಿಸಲಾಗಿದೆ; ಲೆಕ್ಕ ಯಾರಿಗೆ ಕೊಡಲಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಮೂಲವು ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದಿರುವುದರಿಂದ ಅನುವಾದದಲ್ಲೂ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಮತ್ತು ಎಚ್ಚರಿಕೆಯ ಧಾಟಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಲೆಕ್ಕ ಕೊಡು’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟು ಮೂಲದ ನ್ಯಾಯಾಂಗ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
