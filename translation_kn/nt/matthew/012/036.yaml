revisions:
- from: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಜನರು ಅಜಾಗರೂಕವಾಗಿ ಆಡುವ ಪ್ರತಿಯೊಂದು ಮಾತಿಗೂ[a] ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಲೆಕ್ಕ ಕೊಡಬೇಕಾಗುತ್ತದೆ.
  to: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದು ಏನೆಂದರೆ, ಜನರು ಆಡುವ ಪ್ರತಿಯೊಂದು ಅಜಾಗರೂಕ ಮಾತಿನ ವಿಷಯವಾಗಿ ಅವರು ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಲೆಕ್ಕ ಕೊಡುತ್ತಾರೆ.
  rationale: The revision makes ‘ಅಜಾಗರೂಕ’ modify ‘ಮಾತು,’ as ἀργόν modifies ῥῆμα in Greek. It also renders the future accounting assertion with the direct Kannada future ‘ಲೆಕ್ಕ ಕೊಡುತ್ತಾರೆ’ and explicitly retains the Greek περὶ αὐτοῦ relation with ‘ಮಾತಿನ ವಿಷಯವಾಗಿ.’
