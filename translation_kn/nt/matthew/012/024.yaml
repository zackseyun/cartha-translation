id: MAT.12.24
reference: Matthew 12:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: kn
  text: ಆದರೆ ಫರಿಸಾಯರು ಇದನ್ನು ಕೇಳಿ, “ಇವನು ದೆವ್ವಗಳ ಅಧಿಪತಿಯಾದ ಬೇಲ್ಜೆಬೂಲನ ಮೂಲಕವಲ್ಲದೆ ದೆವ್ವಗಳನ್ನು ಓಡಿಸುವುದಿಲ್ಲ” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಜನರ ಸಕಾರಾತ್ಮಕ ಪ್ರತಿಕ್ರಿಯೆಗೆ ಫರಿಸಾಯರ ಮಾತು ವಿರುದ್ಧವಾಗಿರುವುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀκούσαντες
  choice: ಇದನ್ನು ಕೇಳಿ
  rationale: ಭೂತಕಾಲದ ಕೃದಂತವನ್ನು ಸಹಜ ಕಾಲಸಂಬಂಧದ ರೂಪದಲ್ಲಿ ಅನುವಾದಿಸಿ, ಸಂದರ್ಭದಿಂದ ಗ್ರಹಿಸಬಹುದಾದ ಕರ್ಮವನ್ನು ‘ಇದನ್ನು’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- source_word: Οὗτος
  choice: ಇವನು
  rationale: ಸಮೀಪಸೂಚಕ ಸರ್ವನಾಮದ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸುವುದರ ಜೊತೆಗೆ, ಸಂದರ್ಭದಲ್ಲಿರುವ ತಿರಸ್ಕಾರದ ಧ್ವನಿಯನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: ದೆವ್ವಗಳನ್ನು ಓಡಿಸುವುದಿಲ್ಲ
  rationale: ἐκβάλλει ಎಂಬುದು ಹೊರಗೆ ಹಾಕುವುದು ಅಥವಾ ಓಡಿಸುವುದು ಎಂಬ ಅರ್ಥ ಹೊಂದಿದೆ; ದೆವ್ವ ಬಿಡಿಸುವ ಸಂದರ್ಭಕ್ಕೆ ‘ಓಡಿಸು’ ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: εἰ μὴ
  choice: ಮೂಲಕವಲ್ಲದೆ
  rationale: ಆರೋಪಿಸಲಾದ ಏಕೈಕ ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವವನ್ನು ಸೂಚಿಸುವ ‘except by’ ರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ನಕಾರಾರ್ಥಕ ವಾಕ್ಯದೊಂದಿಗೆ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: ಬೇಲ್ಜೆಬೂಲ್ ಮೂಲಕ
  rationale: ಇಲ್ಲಿನ ἐν ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮೂಲಕ’ ಎಂಬುದು ಹೆಚ್ಚುವರಿ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಅದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: ದೆವ್ವಗಳ ಅಧಿಪತಿಯಾದ
  rationale: ἄρχων ಸೂಚಿಸುವ ಅಧಿಕಾರ ಮತ್ತು ಆಳ್ವಿಕೆಯನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾಗಿ ಹಾಗೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ‘ಅಧಿಪತಿ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: Οὗτος ಎಂಬ ವಿರೋಧಭಾವದ ಸೂಚಕ ಸರ್ವನಾಮ
  choice: ಇವನು
  alternative: ಈ ಮನುಷ್ಯನು
  rationale: ‘ಇವನು’ ಮೂಲದ ಸೂಚಕ ಸ್ವರೂಪ ಮತ್ತು ಸಂದರ್ಭದ ತಿರಸ್ಕಾರ ಎರಡನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ಈ ಮನುಷ್ಯನು’ ಎಂದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ನಾಮಪದವನ್ನು ಸೇರಿಸಬೇಕಾಗುತ್ತದೆ.
- issue: Βεελζεβοὺλ ಎಂಬ ಹೆಸರಿನ ರೂಪ
  choice: ಬೇಲ್ಜೆಬೂಲ್
  alternative: ಬೇಲ್ಜೆಬೂಬ್
  rationale: ಮುಖ್ಯ ಪಾಠವು SBLGNT ಗ್ರೀಕ್ ರೂಪ Βεελζεβοὺλ ಅನ್ನು ಲಿಪ್ಯಂತರಿಸುತ್ತದೆ; ಪರಿಚಿತ ಸಾಂಪ್ರದಾಯಿಕ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ἐν ಮೂಲಕ ಸೂಚಿಸಲಾದ ಸಂಬಂಧ
  choice: ಮೂಲಕ
  alternative: ಶಕ್ತಿಯಿಂದ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವದ ಆರೋಪವಿದೆ. ‘ಮೂಲಕ’ ಆ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಶಕ್ತಿಯಿಂದ’ ಎನ್ನುವುದು ಅರ್ಥಸಮ್ಮತವಾದರೂ ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲದ ‘ಶಕ್ತಿ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗಂಭೀರ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯದ ವಿರೋಧಭಾವ, ಫರಿಸಾಯರ ತಿರಸ್ಕಾರದ ಧ್ವನಿ ಮತ್ತು ಅವರ ಆರೋಪದ ನಕಾರಾತ್ಮಕ ರಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪಂಥೀಯ ವಿವರಣೆ ಅಥವಾ ಮೂಲದಲ್ಲಿಲ್ಲದ ತಾತ್ತ್ವಿಕ ನಿರ್ಣಯ ಸೇರಿಸಲಾಗಿಲ್ಲ.
