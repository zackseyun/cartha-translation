id: MAT.12.3
reference: Matthew 12:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: kn
  text: 'ಆದರೆ ಅವರು ಅವರಿಗೆ ಹೀಗೆ ಹೇಳಿದರು: “ದಾವೀದನು ಹಸಿದಿದ್ದಾಗ ಮತ್ತು ಅವನೊಂದಿಗೆ ಇದ್ದವರು ಹಸಿದಿದ್ದಾಗ ಅವನು ಏನು ಮಾಡಿದನೆಂದು ನೀವು ಓದಿಲ್ಲವೇ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಹಸಿದನು’ ಎಂಬ ಕ್ರಿಯಾಪದ ಏಕವಚನವಾಗಿದ್ದು, ವ್ಯಾಕರಣದ ಪ್ರಕಾರ ದಾವೀದನನ್ನೇ ಸೂಚಿಸುತ್ತದೆ. ಆದರೂ ‘ಅವನೊಂದಿಗೆ ಇದ್ದವರು’ ಎಂಬ ಮುಂದಿನ ಪದಗುಚ್ಛದಿಂದ, ಹಸಿವು ದಾವೀದನಿಗೂ ಅವನೊಂದಿಗೆ ಇದ್ದವರಿಗೂ ಅನ್ವಯಿಸುತ್ತದೆ ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: ಆದರೆ ಅವರು
  rationale: δέ ಹಿಂದಿನ ಆರೋಪಕ್ಕೆ ಯೇಸು ನೀಡಿದ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸೌಮ್ಯವಾದ ವಿರೋಧಾರ್ಥಕ ಸಂಪರ್ಕದ ಮೂಲಕ ಸೂಚಿಸುತ್ತದೆ. ಗೌರವಸೂಚಕ ಏಕವಚನಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ‘ಅವರು’ ಸಹಜವಾಗಿದೆ.
- source_word: εἶπεν αὐτοῖς
  choice: ಅವರಿಗೆ ... ಎಂದು ಹೇಳಿದರು
  rationale: λέγω ಮತ್ತು ದತ್ತಿವಿಭಕ್ತಿಯ αὐτοῖς ಅನ್ನು ಸಹಜ ಕನ್ನಡ ನೇರಮಾತಿನ ರಚನೆಯಲ್ಲಿ ‘ಅವರಿಗೆ ... ಎಂದು ಹೇಳಿದರು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: Οὐκ ἀνέγνωτε
  choice: ನೀವು ಓದಿಲ್ಲವೇ?
  rationale: ಇದು ಶಾಸ್ತ್ರದ ಪರಿಚಯವನ್ನು ಪ್ರಶ್ನಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ; ‘ಓದಿಲ್ಲವೇ?’ ಅದರ ಬಲವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τί ἐποίησεν
  choice: ಅವನು ಏನು ಮಾಡಿದನೆಂದು
  rationale: ποιέω ಇಲ್ಲಿ ಸಾಮಾನ್ಯ ಐತಿಹಾಸಿಕ ಅರ್ಥದಲ್ಲಿ ‘ಮಾಡು’ ಎಂದಾಗಿದೆ; ಹೆಚ್ಚುವರಿ ಅರ್ಥವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: Δαυὶδ
  choice: ದಾವೀದನು
  rationale: ವ್ಯಕ್ತಿನಾಮದ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ಲಿಪ್ಯಂತರವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ὅτε ἐπείνασεν
  choice: ಹಸಿದಾಗ
  rationale: πεινάω ಎಂದರೆ ‘ಹಸಿದಿರಲು’; ‘ಹಸಿದಾಗ’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು, ಕ್ರಿಯೆಯ ಕಾಲಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: ಅವನೊಂದಿಗಿದ್ದವರೂ
  rationale: ಈ ಪದಗುಚ್ಛದ ನೇರ ಅರ್ಥ ‘ಅವನೊಂದಿಗೆ ಇದ್ದವರು.’ ‘ಅವನೊಂದಿಗಿದ್ದವರೂ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು καίಯ ಸಮಾವೇಶಾತ್ಮಕ ಬಲವನ್ನೂ ತೋರಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಹಸಿವು ದಾವೀದನಿಗಷ್ಟೇ ಅನ್ವಯಿಸುತ್ತದೆಯೇ ಅಥವಾ ಅವನೊಂದಿಗಿದ್ದವರಿಗೂ ಅನ್ವಯಿಸುತ್ತದೆಯೇ ಎಂಬ ವ್ಯಾಕರಣಾತ್ಮಕ ಅಸ್ಪಷ್ಟತೆ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ದಾವೀದನೂ ಅವನೊಂದಿಗಿದ್ದವರೂ ಹಸಿದಾಗ’ ಎಂದು ಎರಡೂ ಗುಂಪುಗಳಿಗೆ ಹಸಿವನ್ನು ಅನ್ವಯಿಸಲಾಗಿದೆ.
  alternative: ‘ದಾವೀದನು ಹಸಿದಾಗ, ಅವನೊಂದಿಗಿದ್ದವರೊಂದಿಗೆ ಅವನು ಏನು ಮಾಡಿದನು’ ಎಂಬಂತೆ ಏಕವಚನ ಕ್ರಿಯೆಯ ರೂಪವನ್ನು ಹೆಚ್ಚು ನೇರವಾಗಿ ಉಳಿಸಬಹುದು.
  rationale: ἐπείνασεν ಏಕವಚನವಾಗಿದ್ದು ದಾವೀದನನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ನಂತರದ καὶ οἱ μετ’ αὐτοῦ ಅಪೂರ್ಣಸಮಾನಾಂತರ ರಚನೆಯಾಗಿ ಅವರಿಗೂ ಹಸಿವು ಅನ್ವಯಿಸುವಂತೆ ಅರ್ಥವಾಗಬಹುದು. ಕನ್ನಡದಲ್ಲಿ ಪೂರ್ಣ ಮತ್ತು ಸಹಜ ವಾಕ್ಯಕ್ಕಾಗಿ ಎರಡನೆಯ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ತೆಗೆದುಕೊಂಡು, ಮೂಲದ ವ್ಯಾಕರಣಾತ್ಮಕ ಒತ್ತಡವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ‘ಅವರು/ಹೇಳಿದರು’ ಬಳಸಲಾಗಿದೆ; ನೇರಮಾತಿನಲ್ಲಿ ದಾವೀದನಿಗೆ ಸಾಮಾನ್ಯ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಉಳಿಸಲಾಗಿದೆ.
