- from: ಆ ಸಮಯದಲ್ಲಿ ಯೇಸು ಸಬ್ಬತ್ ದಿನದಂದು[a] ಪೈರುಹೊಲಗಳ ಮೂಲಕ ಹೋದನು. ಆಗ ಅವನ ಶಿಷ್ಯರಿಗೆ ಹಸಿವಾಯಿತು; ಅವರು ತೆನೆಗಳನ್ನು ಕಿತ್ತು ತಿನ್ನಲು ಆರಂಭಿಸಿದರು.
  to: ಆ ಸಮಯದಲ್ಲಿ ಯೇಸು ಸಬ್ಬತ್ ದಿನದಂದು[a] ಧಾನ್ಯದ ಹೊಲಗಳ ಮೂಲಕ ಹೋದನು. ಅವನ ಶಿಷ್ಯರಿಗೆ ಹಸಿವಾಯಿತು; ಅವರು ತೆನೆಗಳನ್ನು ಕೀಳಲು ಮತ್ತು ತಿನ್ನಲು ಆರಂಭಿಸಿದರು.
