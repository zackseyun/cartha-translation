id: MAT.12.1
reference: Matthew 12:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: kn
  text: ಆ ಸಮಯದಲ್ಲಿ ಯೇಸು ಸಬ್ಬತ್ ದಿನದಂದು[a] ಧಾನ್ಯದ ಹೊಲಗಳ ಮೂಲಕ ಹೋದನು. ಅವನ ಶಿಷ್ಯರಿಗೆ ಹಸಿವಾಯಿತು; ಅವರು ತೆನೆಗಳನ್ನು ಕೀಳಲು ಮತ್ತು ತಿನ್ನಲು ಆರಂಭಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಸಬ್ಬತ್‌ಗಳಲ್ಲಿ’; ಇದು ‘ಸಬ್ಬತ್ ದಿನದಂದು’ ಎಂಬ ಅರ್ಥ ಕೊಡುವ ಭಾಷಾಪ್ರಯೋಗ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ಆ ಸಮಯದಲ್ಲಿ
  rationale: καιρός ಇಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಸಂದರ್ಭ ಅಥವಾ ಕಾಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆ ಸಮಯದಲ್ಲಿ’ ಸಹಜವಾದ ಕಥನಾತ್ಮಕ ಕಾಲಸೂಚಕವಾಗಿದೆ.
- source_word: ἐπορεύθη
  choice: ಹೋದನು
  rationale: πορεύομαι ಎಂಬುದರ ಸರಳ ಚಲನೆಯ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τοῖς σάββασιν
  choice: ಸಬ್ಬತ್ ದಿನದಂದು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಬಹುವಚನ ರೂಪವಿದ್ದರೂ, ಇಲ್ಲಿ ಅದು ಒಂದೇ ಸಬ್ಬತ್ ದಿನವನ್ನು ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ ಕೊಯ್ನೆ ಭಾಷಾಪ್ರಯೋಗವಾಗಿದೆ.
- source_word: διὰ τῶν σπορίμων
  choice: ಪೈರುಹೊಲಗಳ ಮೂಲಕ
  rationale: σπόριμος ಬಿತ್ತಿದ, ವಿಶೇಷವಾಗಿ ಧಾನ್ಯ ಬೆಳೆದ ಹೊಲಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಪೈರುಹೊಲಗಳು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: ಆಗ ಅವನ ಶಿಷ್ಯರಿಗೆ
  rationale: δέ ಇಲ್ಲಿ ಬಲವಾದ ವಿರೋಧವಲ್ಲ, ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಆಗ’ ಘಟನೆಗಳ ಸರಣಿಯನ್ನು ಸಹಜವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: ἐπείνασαν
  choice: ಹಸಿವಾಯಿತು
  rationale: ಕ್ರಿಯೆಯ ಆರಂಭಿಕ ಅಂಶವನ್ನು ಉಳಿಸಿ, ಶಿಷ್ಯರಿಗೆ ಆ ಸಂದರ್ಭದಲ್ಲಿ ಹಸಿವು ಉಂಟಾಯಿತು ಎಂಬುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹೇಳುತ್ತದೆ.
- source_word: ἤρξαντο
  choice: ಆರಂಭಿಸಿದರು
  rationale: ಮುಂದಿನ ಕ್ರಿಯೆಗಳ ಆರಂಭವನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τίλλειν στάχυας
  choice: ತೆನೆಗಳನ್ನು ಕಿತ್ತು
  rationale: τίλλω ಕೈಯಿಂದ ಕೀಳುವುದನ್ನು, στάχυς ಧಾನ್ಯದ ತೆನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಜೋಡಿ ಸಂಕ್ಷಿಪ್ತವೂ ನಿಖರವೂ ಆಗಿದೆ.
- source_word: καὶ ἐσθίειν
  choice: ತಿನ್ನಲು
  rationale: ಎರಡೂ ಅನಂತಕ್ರಿಯೆಗಳು ἤρξαντο ಎಂಬ ಕ್ರಿಯೆಗೆ ಸಂಬಂಧಿಸಿದವು; ಕನ್ನಡದಲ್ಲಿ ‘ಕಿತ್ತು ತಿನ್ನಲು ಆರಂಭಿಸಿದರು’ ಎಂಬುದು ಸಹಜ ಸಮನ್ವಯವಾಗಿದೆ.
theological_decisions:
- issue: σάββασιν ಪದದ ಬಹುವಚನ ರೂಪ
  choice: ಸಬ್ಬತ್ ದಿನದಂದು
  alternative: ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ
  rationale: ರೂಪತಃ ಬಹುವಚನವಾಗಿದ್ದರೂ ಈ ಕೊಯ್ನೆ ಭಾಷಾಪ್ರಯೋಗವು ಒಂದೇ ಸಬ್ಬತ್ ದಿನವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಬಹುವಚನವಾಗಿ ಅನುವಾದಿಸಿದರೆ ಹಲವು ಸಬ್ಬತ್ ದಿನಗಳ ಘಟನೆ ಎಂಬ ತಪ್ಪು ಕಲ್ಪನೆ ಮೂಡಬಹುದು; ಈ ಆಯ್ಕೆ ವ್ಯಾಕರಣ ಮತ್ತು ಸಂದರ್ಭಾಧಾರಿತವಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಸಬ್ಬತ್’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಪೈರುಹೊಲ’ ಮತ್ತು ‘ತೆನೆ’ ಎಂಬ ಪದಗಳು ಗ್ರಾಮೀಣ ಕ್ರಿಯೆಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.
