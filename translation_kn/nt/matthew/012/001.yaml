review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal setting, Jesus' movement through cultivated fields, the Sabbath idiom, the disciples' hunger, and their action. However, in the Greek, ἤρξαντο (‘they began’) governs both infinitives, τίλλειν (‘to pluck’) and ἐσθίειν (‘to eat’). The Kannada sequence ‘ತೆನೆಗಳನ್ನು ಕಿತ್ತು ತಿನ್ನಲು ಆರಂಭಿಸಿದರು’ can more naturally imply that they plucked the heads and then began to eat, rather than that they began both plucking and eating. ‘ಪೈರುಹೊಲಗಳ’ is understandable but less specific than σπορίμων in this context, which denotes grainfields.
  naturalness: The narrative is clear and uses modern standard Kannada. ‘ಸಬ್ಬತ್ ದಿನದಂದು’ is natural in Bible register, and ‘ತೆನೆಗಳು’ clearly communicates heads of grain. The revised coordinated infinitives are both idiomatic and more transparent in scope.
  terminology: ‘ಯೇಸು,’ ‘ಶಿಷ್ಯರು,’ and ‘ಸಬ್ಬತ್’ are appropriate established terms. ‘ಧಾನ್ಯದ ಹೊಲಗಳು’ more explicitly represents the grain-bearing fields meant here than the broader ‘ಪೈರುಹೊಲಗಳು.’ The footnote correctly explains the idiomatic Greek plural without presenting multiple Sabbaths as the sense.
  issues:
  - severity: medium
    issue: Scope of ‘ಆರಂಭಿಸಿದರು’ is not fully explicit
    rationale: The Greek verb ἤρξαντο governs both ‘to pluck’ and ‘to eat.’ Revising to ‘ತೆನೆಗಳನ್ನು ಕೀಳಲು ಮತ್ತು ತಿನ್ನಲು ಆರಂಭಿಸಿದರು’ preserves this coordination and avoids a possible sequential reading.
  - severity: low
    issue: ‘ಪೈರುಹೊಲಗಳ’ is broader than the contextual sense of σπορίμων
    rationale: While not wrong, ‘ಧಾನ್ಯದ ಹೊಲಗಳ’ more directly conveys ‘grainfields,’ matching both the Greek contextual sense and the English audit trail.
  revised_text: ಆ ಸಮಯದಲ್ಲಿ ಯೇಸು ಸಬ್ಬತ್ ದಿನದಂದು[a] ಧಾನ್ಯದ ಹೊಲಗಳ ಮೂಲಕ ಹೋದನು. ಅವನ ಶಿಷ್ಯರಿಗೆ ಹಸಿವಾಯಿತು; ಅವರು ತೆನೆಗಳನ್ನು ಕೀಳಲು ಮತ್ತು ತಿನ್ನಲು ಆರಂಭಿಸಿದರು.
