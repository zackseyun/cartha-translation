  terminology: “ಅಶುದ್ಧ ಆತ್ಮ” is an established, source-close rendering of τὸ ἀκάθαρτον πνεῦμα and appropriately avoids replacing πνεῦμα with the more interpretive “ದೆವ್ವ.” “ನೀರಿಲ್ಲದ ಸ್ಥಳಗಳು” faithfully preserves ἀνύδρων, while the footnote supplies the natural alternative “ಒಣ ಸ್ಥಳಗಳು.”
