id: MAT.12.43
reference: Matthew 12:43
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: kn
  text: ಅಶುದ್ಧ ಆತ್ಮವು ಮನುಷ್ಯನಿಂದ ಹೊರಗೆ ಹೋದಾಗ, ವಿಶ್ರಾಂತಿಯನ್ನು ಹುಡುಕುತ್ತ ನೀರಿಲ್ಲದ ಸ್ಥಳಗಳ[a] ಮೂಲಕ ಹಾದುಹೋಗುತ್ತದೆ; ಆದರೆ ಅದಕ್ಕೆ ವಿಶ್ರಾಂತಿ ಸಿಗುವುದಿಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಒಣ ಸ್ಥಳಗಳು.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ “ನೀರಿಲ್ಲದ ಸ್ಥಳಗಳು.”
    reason: ἀνύδρων ಎಂಬ ಪದದ ಅಕ್ಷರಶಃ ಅರ್ಥವನ್ನೂ ಸಹಜ ಪರ್ಯಾಯವನ್ನೂ ತಿಳಿಸಲು.
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: ಹೋದಾಗ
  rationale: ὅταν ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದ ‘-ಆಗ’ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ. δέ ಇಲ್ಲಿ ಸೌಮ್ಯ ಸಂಕ್ರಮಣ ಸೂಚಕವಾಗಿದ್ದು, ಪ್ರತ್ಯೇಕ ಪದ ಸೇರಿಸಿದರೆ ಕನ್ನಡದಲ್ಲಿ ಅನಗತ್ಯ ಒತ್ತಡ ಉಂಟಾಗುವುದರಿಂದ ವಾಕ್ಯಪ್ರವಾಹದಲ್ಲೇ ಪ್ರತಿಫಲಿಸಲಾಗಿದೆ.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: ಅಶುದ್ಧ ಆತ್ಮವು
  rationale: ಸುವಾರ್ತೆಗಳ ದುಷ್ಟಾತ್ಮ ಸಂದರ್ಭದಲ್ಲಿರುವ ಮೂಲದ ಶುದ್ಧತೆ–ಅಶುದ್ಧತೆ ಹಿನ್ನೆಲೆಯನ್ನು ‘ಅಶುದ್ಧ ಆತ್ಮ’ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯನಿಂದ ಹೊರಗೆ ಹೋದಾಗ
  rationale: ಚಲನೆಯು ಮನುಷ್ಯನಿಂದ ದೂರವಾಗುವುದನ್ನು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮನುಷ್ಯನು’ ಸಾಮಾನ್ಯ ಉದಾಹರಣೆಯ ನಿರ್ದಿಷ್ಟ ವ್ಯಕ್ತಿಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸಬಲ್ಲದು.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: ನೀರಿಲ್ಲದ ಸ್ಥಳಗಳ ಮೂಲಕ ಹಾದುಹೋಗುತ್ತದೆ
  rationale: ἄνυδρος ಪದದ ಅಕ್ಷರಶಃ ‘ನೀರಿಲ್ಲದ’ ಚಿತ್ರಣವನ್ನೂ, διέρχεται ಪದದ ಸ್ಥಳಗಳ ಮೂಲಕ ಸಾಗುವ ಅರ್ಥವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: ವಿಶ್ರಾಂತಿಯನ್ನು ಹುಡುಕುತ್ತ
  rationale: ವರ್ತಮಾನಕಾಲಿಕ ಸಹಚರ ಕ್ರಿಯೆಯನ್ನೂ ಉದ್ದೇಶಪೂರ್ವಕ ಹುಡುಕಾಟವನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: καὶ οὐχ εὑρίσκει
  choice: ಆದರೆ ಅದಕ್ಕೆ ವಿಶ್ರಾಂತಿ ಸಿಗುವುದಿಲ್ಲ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ಮಪದ ಸೂಚಿತವಾಗಿದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ವಿಶ್ರಾಂತಿ’ಯನ್ನು ಮರುಹೇಳುವುದು ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆಗಿದೆ. ಫಲಿತಾಂಶದ ವ್ಯತ್ಯಾಸವನ್ನು ‘ಆದರೆ’ ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದುಷ್ಟಾತ್ಮ ಸಂದರ್ಭದಲ್ಲಿನ πνεῦμα ಪದದ ಅನುವಾದ
  choice: ಆತ್ಮ
  alternative: ದೆವ್ವ
  rationale: ಉಲ್ಲೇಖಿತ ಅಸ್ತಿತ್ವವು ದುಷ್ಟವಾದದ್ದಾದರೂ, ಮೂಲಪಾಠವು δαιμόνιον ಎನ್ನದೆ πνεῦμα ಎಂದು ಹೇಳುತ್ತದೆ. ಆದ್ದರಿಂದ ಮೂಲದ ಪದಪ್ರಯೋಗ ಮತ್ತು ಅದರ ಧಾರ್ಮಿಕ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ‘ಅಶುದ್ಧ ಆತ್ಮ’ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ಅಡಿಕುರಿತು ಗುರುತನ್ನು ಅದು ವಿವರಿಸುವ ‘ನೀರಿಲ್ಲದ ಸ್ಥಳಗಳು’ ಎಂಬ ಪದಗುಚ್ಛದ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
