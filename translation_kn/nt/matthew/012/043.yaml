  source_fidelity: The Kannada accurately represents the general temporal condition (Ὅταν), the departure of the unclean spirit from the man, its movement through waterless places, its search for rest, and its failure to find it. The mild force of δέ need not be separately rendered in Kannada. The supplied object in the final clause is faithful to the implicit Greek object.
