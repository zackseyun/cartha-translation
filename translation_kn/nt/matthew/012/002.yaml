id: MAT.12.2
reference: Matthew 12:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: kn
  text: ಆದರೆ ಫರಿಸಾಯರು ಅದನ್ನು ನೋಡಿ ಅವನಿಗೆ, “ನೋಡು, ನಿನ್ನ ಶಿಷ್ಯರು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡಲು ಅನುಮತಿಯಿಲ್ಲದ್ದನ್ನು ಮಾಡುತ್ತಿದ್ದಾರೆ” ಎಂದು ಹೇಳಿದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡುವುದು ಧರ್ಮಸಮ್ಮತವಲ್ಲದ್ದನ್ನು ಮಾಡುತ್ತಿದ್ದಾರೆ.”
    reason: ἔξεστιν ಎಂಬ ಪದವು ‘ಅನುಮತಿಸಲಾಗಿದೆ’ ಅಥವಾ ‘ಧರ್ಮಸಮ್ಮತವಾಗಿದೆ’ ಎಂಬ ಕಾನೂನುಬದ್ಧ-ಅನುಮತಿಯ ಅರ್ಥವನ್ನು ಹೊಂದಿದೆ; ಈ ಪರ್ಯಾಯವು ನೈತಿಕ ತೀರ್ಪಿಗಿಂತ ಆ ಅರ್ಥವನ್ನೇ ಉಳಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಘಟನೆಯ ಕ್ರಮದಲ್ಲಿ ಫರಿಸಾಯರ ವಿರೋಧಾತ್ಮಕ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἰδόντες
  choice: ಅದನ್ನು ನೋಡಿ
  rationale: ಏಒರಿಸ್ಟ್ ಕೃದಂತವನ್ನು ಸಹಜವಾದ ಕಾಲಸೂಚಕ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ‘ಅದನ್ನು’ ಎಂಬುದು ಹಿಂದಿನ ವಚನದಲ್ಲಿನ ಶಿಷ್ಯರ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: εἶπαν αὐτῷ
  choice: ಅವನಿಗೆ ... ಎಂದು ಹೇಳಿದರು
  rationale: ಮೂಲದ ತಟಸ್ಥ ಮಾತಿನ ಸೂತ್ರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰδοὺ
  choice: ನೋಡು
  rationale: ಆರೋಪದ ಕಡೆ ಗಮನ ಸೆಳೆಯುವ ಸೂಚಕ ಉದ್ಗಾರವನ್ನು ಆಧುನಿಕ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μαθηταί
  choice: ಶಿಷ್ಯರು
  rationale: ಗುರು-ಶಿಷ್ಯ ಸಂಬಂಧವನ್ನು ನಿಖರವಾಗಿ ಉಳಿಸುವ, ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಸ್ಥಿರವಾಗಿ ಬಳಕೆಯಾಗುವ ಪದ.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: ಮಾಡುತ್ತಿದ್ದಾರೆ ... ಮಾಡಲು
  rationale: ಮೂಲದಲ್ಲಿರುವ ποιέω ಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸುತ್ತದೆ.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ಅನುಮತಿಯಿಲ್ಲದ್ದನ್ನು
  rationale: ἔξεστιν ಪದದ ಕಾನೂನುಬದ್ಧ ಅನುಮತಿ/ಅವಕಾಶದ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ; ಆಕ್ಷೇಪವು ನೇರವಾಗಿ ಶಾಸ್ತ್ರನಿಯಮದದೋ ಅಥವಾ ಫರಿಸಾಯರ ಸಂಪ್ರದಾಯದದೋ ಎಂದು ತೀರ್ಮಾನಿಸುವುದಿಲ್ಲ.
- source_word: ἐν σαββάτῳ
  choice: ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ
  rationale: ಸಬ್ಬತ್ ಆಚರಣೆಯ ಕಾಲಸಂದರ್ಭವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಫರಿಸಾಯರ ಆಕ್ಷೇಪದ ಸ್ವರೂಪ
  choice: ‘ಮಾಡಲು ಅನುಮತಿಯಿಲ್ಲದ್ದು’ ಎಂದು ಕಾನೂನು-ಅನುಮತಿ ಅರ್ಥದಲ್ಲಿ ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
  alternative: ‘ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ವಿರುದ್ಧವಾದದ್ದು’ ಅಥವಾ ‘ನ್ಯಾಯಸಮ್ಮತವಲ್ಲದ್ದು’
  rationale: ವಚನವು ಆಕ್ಷೇಪವನ್ನು ಮಾತ್ರ ದಾಖಲಿಸುತ್ತದೆ; ಅದರ ಮೂಲ ದೇವರ ಧರ್ಮಶಾಸ್ತ್ರವೋ ಫರಿಸಾಯರ ವ್ಯಾಖ್ಯಾನವೋ ಎಂದು ಇಲ್ಲಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಆ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಸುವಾರ್ತಾ ನಿರೂಪಣೆ. ‘ಸಬ್ಬತ್’ ಮತ್ತು ‘ಶಿಷ್ಯರು’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅನಗತ್ಯ ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸಿಲ್ಲ.
