id: MAT.12.18
reference: Matthew 12:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: kn
  text: '“ಇಗೋ, ನಾನು ಆರಿಸಿಕೊಂಡ ನನ್ನ ಸೇವಕನು,


    ನನ್ನ ಪ್ರಿಯನು—ಅವನಲ್ಲಿ ನನ್ನ ಮನಸ್ಸು ಮೆಚ್ಚಿದೆ.[b]


    ನಾನು ನನ್ನ ಆತ್ಮವನ್ನು ಅವನ ಮೇಲೆ ಇರಿಸುವೆನು;


    ಅವನು ಜನಾಂಗಗಳಿಗೆ[c] ನ್ಯಾಯವನ್ನು[a] ಪ್ರಕಟಿಸುವನು.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ನ್ಯಾಯವನ್ನು’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ತೀರ್ಪನ್ನು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು (κρίσις).
    reason: lexical_alternative
  - marker: b
    text: ‘ಅವನಲ್ಲಿ ನನ್ನ ಮನಸ್ಸು ಮೆಚ್ಚಿದೆ’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ಅವನಲ್ಲಿ ನನ್ನ ಪ್ರಾಣವು ಮೆಚ್ಚಿದೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: c
    text: ‘ಜನಾಂಗಗಳಿಗೆ’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ಯೆಹೂದ್ಯೇತರರಿಗೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ಇಗೋ
  rationale: ಪ್ರವಾದನಾತ್ಮಕ ಉದ್ಧರಣೆಯಲ್ಲಿರುವ ಗಮನ ಸೆಳೆಯುವ ಬಲವನ್ನು ಸಹಜವಾದ, ಸ್ವಲ್ಪ ಔನ್ನತ್ಯವುಳ್ಳ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: παῖς
  choice: ಸೇವಕನು
  rationale: ಯೆಶಾಯನ ಸೇವಕನ ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಅರ್ಥ ಇದು; ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲದ ‘ಮಗನು’ ಎಂಬ ಪುತ್ರಸಂಬಂಧದ ಅರ್ಥವನ್ನು ಪದದೊಳಗೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ᾑρέτισα
  choice: ನಾನು ಆರಿಸಿಕೊಂಡ
  rationale: ದೇವರು ಮಾಡಿದ ನಿರ್ದಿಷ್ಟ ಆಯ್ಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಮತ್ತು ಪೂರ್ಣಗೊಂಡ ಕ್ರಿಯೆಯಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀγαπητός
  choice: ನನ್ನ ಪ್ರಿಯನು
  rationale: ದೈವಿಕ ಪ್ರೀತಿಯನ್ನೂ ವಾಕ್ಯದ ಘನತೆಯನ್ನೂ ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: εἰς ὃν
  choice: ಇವನಲ್ಲಿ
  rationale: εὐδοκέω ಜೊತೆಗಿನ ಈ ಸಂಬಂಧಸೂಚಕ ನುಡಿಗಟ್ಟಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾದ ಸಮಾನಾರ್ಥಕ ರೂಪ.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: ಇವನಲ್ಲಿ ನನ್ನ ಅಂತರಂಗವು ಸಂತೋಷಿಸಿದೆ
  rationale: ಗ್ರೀಕ್‌ನ ‘ನನ್ನ ಆತ್ಮ/ಪ್ರಾಣ’ ಎಂಬ ಸ್ಪಷ್ಟ ಕರ್ತೃಭಾವವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ‘ನಾನು ಮೆಚ್ಚಿದ್ದೇನೆ’ ಎಂದು ಸರಳೀಕರಿಸದೆ, ಆಂತರಿಕ ಸಂತೋಷದ ಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: ನಾನು ನನ್ನ ಆತ್ಮವನ್ನು ಅವನ ಮೇಲೆ ಇರಿಸುವೆನು
  rationale: ಪ್ರವಾದನಾತ್ಮಕ ನೇಮಕದ ಭಾಷೆಯನ್ನು ಮತ್ತು ದೇವರ ಆತ್ಮ ಎಂಬ ಉಲ್ಲೇಖವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κρίσιν
  choice: ನ್ಯಾಯವನ್ನು
  rationale: ಸೇವಕನು ಜನಾಂಗಗಳಿಗೆ ತರುವ ದೇವರ ನೀತಿಯುತ ವ್ಯವಸ್ಥೆ ಎಂಬ ಪ್ರವಾದನಾತ್ಮಕ ಸಂದರ್ಭವನ್ನು ‘ನ್ಯಾಯ’ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ತೀರ್ಪು’ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῖς ἔθνεσιν
  choice: ಜನಾಂಗಗಳಿಗೆ
  rationale: ಯೆಶಾಯನ ಉದ್ಧರಣೆಯ ವಿಶ್ವವ್ಯಾಪಿ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಯೆಹೂದ್ಯೇತರರಿಗೆ’ ಎಂಬ ಸಂದರ್ಭಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἀπαγγελεῖ
  choice: ಪ್ರಕಟಿಸುವನು
  rationale: ಸಾರ್ವಜನಿಕವಾಗಿ ತಿಳಿಸುವ ಪ್ರವಾದನಾತ್ಮಕ ಕಾರ್ಯವನ್ನು ಘನವಾದರೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: παῖς ಪದದಲ್ಲಿನ ಮೆಸ್ಸೀಯ ಸೇವಕನ ಗುರುತು
  choice: ಯೆಶಾಯನ ಸೇವಕನ ಉದ್ಧರಣೆಗೆ ಅನುಗುಣವಾಗಿ ‘ಸೇವಕನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಮಗನು / ಬಾಲಕನು
  rationale: ಇದು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಸೇವಕನ ಹಿನ್ನೆಲೆಯನ್ನು ಉಳಿಸಿ, ಈ ನಿರ್ದಿಷ್ಟ ಪದದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲದ ಪುತ್ರತ್ವದ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: ಪ್ರವಾದನಾತ್ಮಕ ಕಾರ್ಯದಲ್ಲಿ κρίσις ಪದದ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ನ್ಯಾಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ತೀರ್ಪು
  rationale: ಇಲ್ಲಿ ಸೇವಕನು ಜನಾಂಗಗಳಿಗೆ ಪ್ರಕಟಿಸುವ ದೇವರ ನೀತಿಯುತ ಕ್ರಮ ಮುಖ್ಯವಾಗಿದೆ. ಆದರೂ ಗ್ರೀಕ್ ಪದಕ್ಕೆ ‘ತೀರ್ಪು’ ಎಂಬ ಅರ್ಥವೂ ಸಾಧ್ಯವಾದುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ψυχή ಮತ್ತು πνεῦμα ನಡುವಿನ ವ್ಯತ್ಯಾಸ
  choice: ψυχήಗೆ ‘ಅಂತರಂಗ’, πνεῦμαಗೆ ‘ಆತ್ಮ’ ಬಳಸಲಾಗಿದೆ.
  alternative: ಎರಡಕ್ಕೂ ‘ಆತ್ಮ’
  rationale: ಕನ್ನಡದಲ್ಲಿ ಎರಡಕ್ಕೂ ಒಂದೇ ಪದ ಬಳಸಿದರೆ ಮೂಲದಲ್ಲಿರುವ ಪದಭೇದ ಮಸುಕಾಗಬಹುದು. ‘ಅಂತರಂಗ’ವು ψυχήಯ ವೈಯಕ್ತಿಕ, ಭಾವಾತ್ಮಕ ಒತ್ತನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ; πνεῦμα ದೇವರ ಆತ್ಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಪ್ರವಾದನಾತ್ಮಕ ಉದ್ಧರಣೆಗೆ ತಕ್ಕ ಘನತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಕಾವ್ಯಾತ್ಮಕ ಸಾಲು ವಿಭಜನೆ ಮೂಲ ವಾಕ್ಯದ ಸಮಾಂತರ ರಚನೆಯನ್ನು ಗೋಚರಗೊಳಿಸುತ್ತದೆ.
