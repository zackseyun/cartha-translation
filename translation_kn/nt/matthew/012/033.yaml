review_pass:
  verdict: revise
  source_fidelity: The main rendering retains the repeated aorist imperatives, the good/rotten contrast, and the explanatory passive clause. However, the first imperative should also be overtly plural imperative ('ಮಾಡಿರಿ'), matching ποιήσατε and preserving the deliberate repetition. The footnote markers should be relocated to the words/construction they explain.
  naturalness: The revised wording is natural modern standard Kannada. 'ತನ್ನ ಹಣ್ಣಿನಿಂದ' is more idiomatic and referentially clear than 'ಅದರ ಹಣ್ಣಿನಿಂದಲೇ'; the added emphatic '-ಲೇ' is not required by ἐκ.
  terminology: ‘ಒಳ್ಳೆಯ’, ‘ಹಣ್ಣು’, and ‘ಕೊಳೆತ’ preserve the metaphor and its moral resonance without over-interpreting it. ‘ಗುರುತಿಸಲಾಗುತ್ತದೆ’ is a suitable passive rendering of γινώσκεται. ‘ಕೊಳೆತ’ remains appropriately qualified by the lexical footnote.
  issues:
  - severity: medium
    issue: The first occurrence of ποιήσατε is rendered ‘ಮಾಡಿ’ rather than the unambiguously plural imperative ‘ಮಾಡಿರಿ’.
    rationale: Although ‘ಮಾಡಿ’ can function politely as an imperative in Kannada, it can also be read as a conjunctive form. Using ‘ಮಾಡಿರಿ’ in both occurrences more clearly represents the Greek’s repeated plural imperative.
  - severity: medium
    issue: The existing footnote anchors do not attach to the material explained.
    rationale: Footnote a discusses σαπρός (‘ಕೊಳೆತ’) but is placed after the entire two-clause contrast; footnote b discusses the repeated imperative but is attached after the final explanatory clause. Moving b to the imperative sequence and a to the final occurrence of ‘ಕೊಳೆತದ್ದಾಗಿ’ provides clear, meaningful anchors.
  - severity: low
    issue: ‘ಅದರ ಹಣ್ಣಿನಿಂದಲೇ’ adds unnecessary emphasis and is less natural than a reflexive possessive in this metaphor.
    rationale: The Greek αὐτοῦ simply refers back to the tree. ‘ತನ್ನ ಹಣ್ಣಿನಿಂದ’ gives the intended relation naturally without introducing emphatic ‘ಲೇ’.
