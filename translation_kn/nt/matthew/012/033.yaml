- from: “ಮರವನ್ನು ಒಳ್ಳೆಯದಾಗಿ ಮಾಡಿ, ಅದರ ಹಣ್ಣನ್ನೂ ಒಳ್ಳೆಯದಾಗಿ ಮಾಡಿರಿ; ಇಲ್ಲವೆ ಮರವನ್ನು ಕೊಳೆತದ್ದಾಗಿ ಮಾಡಿ, ಅದರ ಹಣ್ಣನ್ನೂ ಕೊಳೆತದ್ದಾಗಿ ಮಾಡಿರಿ.[a] ಏಕೆಂದರೆ ಮರವು ಅದರ ಹಣ್ಣಿನಿಂದಲೇ ಗುರುತಿಸಲ್ಪಡುತ್ತದೆ.”[b]
