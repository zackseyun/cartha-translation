id: MAT.12.33
reference: Matthew 12:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: kn
  text: “ಮರವನ್ನು ಒಳ್ಳೆಯದಾಗಿ ಮಾಡಿರಿ, ಅದರ ಹಣ್ಣನ್ನೂ ಒಳ್ಳೆಯದಾಗಿ ಮಾಡಿರಿ[b]; ಇಲ್ಲವೆ ಮರವನ್ನು ಕೊಳೆತದ್ದಾಗಿ ಮಾಡಿರಿ, ಅದರ ಹಣ್ಣನ್ನೂ ಕೊಳೆತದ್ದಾಗಿ ಮಾಡಿರಿ[a]. ಏಕೆಂದರೆ ಮರವು ತನ್ನ ಹಣ್ಣಿನಿಂದ ಗುರುತಿಸಲಾಗುತ್ತದೆ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಕೊಳೆತ’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ಕೆಟ್ಟ’ ಅಥವಾ ‘ಹಾಳಾದ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಗ್ರೀಕ್ ಪದವು ಕೊಳೆತ, ಭ್ರಷ್ಟವಾದ ಅಥವಾ ಪ್ರಯೋಜನವಿಲ್ಲದದ್ದನ್ನು ಸೂಚಿಸಬಲ್ಲದು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಮಾಡಿರಿ’ ಎಂಬ ಪುನರಾವರ್ತಿತ ಆಜ್ಞೆಯು ಇಲ್ಲಿ ‘ಹಾಗೆಂದು ಪರಿಗಣಿಸಿರಿ’ ಅಥವಾ ‘ಹಾಗಿರುವುದಾಗಿ ತೋರಿಸಿರಿ’ ಎಂಬ ವಾಗ್ವೈಖರಿಯ ಬಲವನ್ನು ಹೊಂದಿರಬಹುದು; ಆದರೂ ಗ್ರೀಕ್ ರೂಪವು ಆಜ್ಞಾರ್ಥಕವಾಗಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: ಮಾಡಿರಿ
  rationale: ಗ್ರೀಕ್‌ನ ಭೂತಕಾಲರೂಪದ ಆಜ್ಞಾರ್ಥಕ ಬಹುವಚನವನ್ನು ನೇರ ಆಜ್ಞೆಯಾಗಿ ಉಳಿಸುತ್ತದೆ. ಇಲ್ಲಿ ‘ಎಂದು ಪರಿಗಣಿಸಿರಿ’ ಅಥವಾ ‘ಹಾಗೆ ತೋರಿಸಿರಿ’ ಎಂಬ ವಾಗ್ವೈಖರಿಯ ಅರ್ಥ ಸಾಧ್ಯವಾದರೂ, ‘ಮಾಡಿರಿ’ ಮೂಲದ ಸಮಾಂತರ ರಚನೆಯನ್ನೂ ಉದ್ದೇಶಪೂರ್ವಕ ತೀಕ್ಷ್ಣತೆಯನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
- source_word: δένδρον
  choice: ಮರ
  rationale: ರೂಪಕದ ಕೇಂದ್ರಚಿತ್ರಕ್ಕೆ ಸಹಜವಾದ ಮತ್ತು ನೇರವಾದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: καλός
  choice: ಒಳ್ಳೆಯ
  rationale: ಗುಣಮಟ್ಟ ಮತ್ತು ನೈತಿಕ ಪ್ರತಿಧ್ವನಿ ಎರಡನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ಆರೋಗ್ಯಕರ’ ಎನ್ನುವುದು ಅರ್ಥವನ್ನು ದೈಹಿಕ ಸ್ಥಿತಿಗೆ ಅತಿಯಾಗಿ ಸೀಮಿತಗೊಳಿಸುತ್ತದೆ.
- source_word: καρπός
  choice: ಹಣ್ಣು
  rationale: ಮರದ ರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುವ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾದ ಪದ.
- source_word: σαπρός
  choice: ಕೊಳೆತ
  rationale: ಹಾಳಾದ, ಭ್ರಷ್ಟವಾದ ಅಥವಾ ಪ್ರಯೋಜನವಿಲ್ಲದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ σαπρός ಪದದ ಸ್ಪಷ್ಟ ಚಿತ್ರಾತ್ಮಕತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಮರಕ್ಕೂ ಹಣ್ಣಿಗೂ ಕನ್ನಡದಲ್ಲಿ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: ಏಕೆಂದರೆ ... ಅದರ ಹಣ್ಣಿನಿಂದಲೇ
  rationale: γάρ ಸೂಚಿಸುವ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ‘ಏಕೆಂದರೆ’ ಎಂದು ಮತ್ತು ἐκ ಸೂಚಿಸುವ ಆಧಾರ/ಮೂಲವನ್ನು ‘ಹಣ್ಣಿನಿಂದಲೇ’ ಎಂದು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: γινώσκεται
  choice: ಗುರುತಿಸಲ್ಪಡುತ್ತದೆ
  rationale: ವರ್ತಮಾನಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ಹಣ್ಣಿನ ಆಧಾರದಿಂದ ಮರದ ಸ್ವರೂಪ ತಿಳಿಯುತ್ತದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ರೂಪಕದಲ್ಲಿರುವ ಆಜ್ಞಾರ್ಥಕಗಳ ಬಲ
  choice: ಪುನರಾವರ್ತಿತ ನೇರ ಆಜ್ಞಾರ್ಥಕವಾಗಿ ‘ಮಾಡಿ/ಮಾಡಿರಿ’ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಮರವನ್ನು ಒಳ್ಳೆಯದೆಂದು ಪರಿಗಣಿಸಿರಿ’ ಅಥವಾ ಷರತ್ತಿನ ರೂಪದಲ್ಲಿ ‘ಮರವನ್ನು ಒಳ್ಳೆಯದಾಗಿ ಮಾಡಿದರೆ’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ಎರಡೂ ಕ್ರಿಯೆಗಳು ಆಜ್ಞಾರ್ಥಕವಾಗಿವೆ. ಅವು ವಾಗ್ವೈಖರಿಯ ಸವಾಲಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸಬಹುದಾದರೂ, ವಿವರಣಾತ್ಮಕ ಪರ್ಯಾಯದಿಂದ ಮೃದುಗೊಳಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ತೀಕ್ಷ್ಣತೆಯನ್ನೂ ಅರ್ಥದ ಒತ್ತಡವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- issue: σαπρός ಪದದ ನೈತಿಕ ಮತ್ತು ಚಿತ್ರಾತ್ಮಕ ವ್ಯಾಪ್ತಿ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಕೊಳೆತ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಕೆಟ್ಟ’ ಅಥವಾ ‘ಹಾಳಾದ’.
  rationale: ‘ಕೊಳೆತ’ ಮರ ಮತ್ತು ಹಣ್ಣಿನ ದೃಶ್ಯರೂಪಕವನ್ನು ಜೀವಂತವಾಗಿರಿಸುತ್ತದೆ; ಜೊತೆಗೆ ಭ್ರಷ್ಟತೆ ಅಥವಾ ಪ್ರಯೋಜನವಿಲ್ಲದಿಕೆಯ ವಿಶಾಲ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕವನ್ನು ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯದ ಎರಡು ಭಾಗಗಳ ಸಮಾಂತರತೆ, ರೂಪಕದ ತೀಕ್ಷ್ಣತೆ ಮತ್ತು ಕೊನೆಯ ವಿವರಣಾತ್ಮಕ ಕಾರಣವಾಕ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಸಂಬಂಧಿಸಿದ ಅರ್ಥಘಟಕಗಳ ನಂತರ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸೇರಿವೆ.
