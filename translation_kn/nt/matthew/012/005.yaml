review_pass:
  verdict: revise
  source_fidelity: ಮುಖ್ಯ ಪಠ್ಯವು ಗ್ರೀಕ್‌ನ ವಾಕ್ಚಾತುರ್ಯದ ಪ್ರಶ್ನೆ, ‘ಧರ್ಮಶಾಸ್ತ್ರ,’ ಸಬ್ಬತ್‌ಗಳ ಬಹುವಚನ, ದೇವಾಲಯದ ಯಾಜಕರು, ಮತ್ತು ‘ಅಪವಿತ್ರಗೊಳಿಸುವುದು—ನಿರ್ದೋಷಿಗಳು’ ಎಂಬ ಉದ್ದೇಶಿತ ಒತ್ತಡವನ್ನು ಬಹುಮಟ್ಟಿಗೆ ಸರಿಯಾಗಿ ಉಳಿಸಿದೆ. ಆದರೆ βεβηλοῦσιν ವರ್ತಮಾನಕಾಲದಲ್ಲಿದೆ; ಕರಡಿನ ‘ಅಪವಿತ್ರಗೊಳಿಸಿದರೂ’ ಎಂಬುದು ಭೂತಕಾಲದ/ಸಂಪೂರ್ಣಗೊಂಡ ಕ್ರಿಯೆಯ ಭಾವ ನೀಡುತ್ತದೆ. ಅದನ್ನು ವರ್ತಮಾನಕಾಲಕ್ಕೆ ಸರಿಪಡಿಸುವುದು ಸುರಕ್ಷಿತವೂ ಅಗತ್ಯವೂ ಆಗಿದೆ.
  naturalness: ‘ದೇವಾಲಯದಲ್ಲಿರುವ ಯಾಜಕರು’ಗಿಂತ ‘ದೇವಾಲಯದಲ್ಲಿ ಯಾಜಕರು’ ಎಂಬುದು ἐν τῷ ἱερῷಗೆ ಹೆಚ್ಚು ನೇರವಾಗಿದೆ ಮತ್ತು ಕನ್ನಡದಲ್ಲಿ ಸುಗಮವಾಗಿದೆ. ‘ಮತ್ತು ನಿರ್ದೋಷಿಗಳಾಗಿದ್ದಾರೆ’ ಗ್ರೀಕ್ καίಯನ್ನು ನೇರವಾಗಿ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಬಲವಾದ ವಾಕ್ಚಾತುರ್ಯದ ವ್ಯಂಗ್ಯವನ್ನು ವಿವರಿಸುತ್ತದೆ.
  terminology: ‘ಧರ್ಮಶಾಸ್ತ್ರ,’ ‘ಸಬ್ಬತ್,’ ‘ಯಾಜಕರು,’ ಮತ್ತು ‘ನಿರ್ದೋಷಿಗಳು’ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಬೈಬಲ್ ಬಳಕೆಗೆ ಸೂಕ್ತವಾಗಿವೆ. ‘ಅಪವಿತ್ರಗೊಳಿಸುತ್ತಾರೆ’ βεβηλοῦσινನ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದನ್ನು ‘ಮೀರುತ್ತಾರೆ’ ಎಂದು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬದಲಾಯಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
  issues:
