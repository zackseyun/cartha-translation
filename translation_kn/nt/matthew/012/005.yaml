id: MAT.12.5
reference: Matthew 12:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: kn
  text: ಅಥವಾ, ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ ದೇವಾಲಯದಲ್ಲಿ ಯಾಜಕರು ಸಬ್ಬತ್ ದಿನವನ್ನು ಅಪವಿತ್ರಗೊಳಿಸುತ್ತಾರೆ ಮತ್ತು ನಿರ್ದೋಷಿಗಳಾಗಿದ್ದಾರೆಂದು ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ನೀವು ಓದಿಲ್ಲವೇ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಅಪವಿತ್ರಗೊಳಿಸುತ್ತಾರೆ’ ಎಂಬುದಕ್ಕೆ ‘ಉಲ್ಲಂಘಿಸುತ್ತಾರೆ’ ಅಥವಾ ‘ಮೀರುತ್ತಾರೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಪವಿತ್ರವಾದುದನ್ನು ಸಾಮಾನ್ಯವಾದುದೆಂಬಂತೆ ನಡೆಸಿಕೊಳ್ಳುವ ಅರ್ಥವನ್ನು ಹೊಂದಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ’ ಎಂದಿದೆ; ಇದು ಒಂದೇ ಸಂದರ್ಭಕ್ಕಿಂತ ಮರುಕಳಿಸುವ ಸಬ್ಬತ್ ಸಂದರ್ಭಗಳನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆಯಿದೆ.
    reason: lexical_alternative
  - marker: c
    text: ಇಲ್ಲಿನ ‘ಧರ್ಮಶಾಸ್ತ್ರ’ ಮೋಶೆಯ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು, ಅಥವಾ ಆ ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಶಾಸ್ತ್ರಭಾಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಬ್ಬತ್ ದಿನದ ಯಾಜಕಸೇವೆಯ ನಿಯಮಗಳಿಗಾಗಿ ಅರಣ್ಯಕಾಂಡ 28:9–10 ಅನ್ನು ನೋಡಿ.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: ಅಥವಾ
  rationale: ಯೇಸುವಿನ ಪ್ರತಿವಾದದಲ್ಲಿ ಮತ್ತೊಂದು ಶಾಸ್ತ್ರೀಯ ಆಧಾರವನ್ನು ಪರಿಚಯಿಸುವ ಪರ್ಯಾಯ ಸೂಚಕವನ್ನು ಸರಳವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὐκ ἀνέγνωτε
  choice: ನೀವು ಓದಿಲ್ಲವೇ?
  rationale: ಮತ್ತಾಯನಲ್ಲಿ ಕಾಣುವ ಶಾಸ್ತ್ರಜ್ಞಾನವನ್ನು ಪ್ರಶ್ನಿಸುವ ವಾಗ್ವೈಖರಿಯ ಸೂತ್ರವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῷ νόμῳ
  choice: ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ
  rationale: ಇದು ಅಮೂರ್ತ ನಿಯಮವನ್ನಲ್ಲ, ಮೋಶೆಯ ಧರ್ಮಶಾಸ್ತ್ರವೆಂಬ ಶಾಸ್ತ್ರೀಯ ಸಂಕಲನವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τοῖς σάββασιν
  choice: ಸಬ್ಬತ್‌ ದಿನಗಳಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವು ಮರುಕಳಿಸುವ ಸಬ್ಬತ್ ಸಂದರ್ಭಗಳನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಕನ್ನಡದ ಸಹಜ ಬಹುವಚನ ರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: οἱ ἱερεῖς
  choice: ಯಾಜಕರು
  rationale: ದೇವಾಲಯದ ಯಾಜಕ ಸೇವೆಯನ್ನು ನಡೆಸುವವರನ್ನು ಸೂಚಿಸುವ ಸ್ಥಿರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: ἐν τῷ ἱερῷ
  choice: ದೇವಾಲಯದಲ್ಲಿರುವ
  rationale: ἱερόν ದೇವಾಲಯದ ಸಮಗ್ರ ಆವರಣವನ್ನು ಸೂಚಿಸಬಹುದು; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ದೇವಾಲಯ’ ಸಹಜವಾಗಿದ್ದು ಸಂದರ್ಭಕ್ಕೆ ಸಾಕಷ್ಟು ನಿಖರವಾಗಿದೆ.
- source_word: τὸ σάββατον
  choice: ಸಬ್ಬತ್‌ ದಿನವನ್ನು
  rationale: ಕ್ರಿಯಾಪದದ ಏಕವಚನ ಕರ್ಮವಾಗಿ ಸಬ್ಬತ್ ದಿನ/ವ್ಯವಸ್ಥೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: βεβηλοῦσιν
  choice: ಅಪವಿತ್ರಗೊಳಿಸಿದರೂ
  rationale: ಪವಿತ್ರವಾದುದನ್ನು ಸಾಮಾನ್ಯವೆಂದು ನಡೆಸಿಕೊಳ್ಳುವ ಅಥವಾ ಅದರ ಪವಿತ್ರತೆಯನ್ನು ಉಲ್ಲಂಘಿಸುವ ಬಲವಾದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಆದರೂ’ ಎಂಬ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘-ದರೂ’ ರೂಪದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἀναίτιοί εἰσιν
  choice: ನಿರ್ದೋಷಿಗಳಾಗಿದ್ದಾರೆ
  rationale: ಕಾನೂನುಸಂಬಂಧಿ ತಪ್ಪು ಅಥವಾ ಹೊಣೆ ಅವರ ಮೇಲಿಲ್ಲ ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಯಾಜಕರು ನಿಜವಾಗಿಯೂ ಸಬ್ಬತ್ ದಿನವನ್ನು ಉಲ್ಲಂಘಿಸುತ್ತಾರೆಂಬ ಭಾವವನ್ನು ತಪ್ಪಿಸಲು ಯೇಸುವಿನ ಮಾತನ್ನು ಮೃದುಗೊಳಿಸಬೇಕೇ?
  choice: ‘ಸಬ್ಬತ್‌ ದಿನವನ್ನು ಅಪವಿತ್ರಗೊಳಿಸಿದರೂ ನಿರ್ದೋಷಿಗಳಾಗಿದ್ದಾರೆ’ ಎಂಬ ಬಲವಾದ ವಿರೋಧಾಭಾಸವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಸಬ್ಬತ್ ದಿನದ ನಿಯಮವನ್ನು ಮೀರಿ ಕೆಲಸಮಾಡಿದರೂ ತಪ್ಪಿತಸ್ಥರಲ್ಲ’ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಮೃದುಗೊಳಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು βεβηλοῦσιν ಮತ್ತು ἀναίτιοί ಎಂಬ ಪದಗಳ ನಡುವೆ ಉದ್ದೇಶಪೂರ್ವಕ ಒತ್ತಡವನ್ನು ಇಡುತ್ತದೆ. ಯಾಜಕರ ಸಬ್ಬತ್ ಸೇವೆಯು ಹೊರನೋಟಕ್ಕೆ ಅಪವಿತ್ರೀಕರಣವೆಂದು ವರ್ಣಿಸಲ್ಪಟ್ಟರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಅವರು ತಪ್ಪಿತಸ್ಥರಲ್ಲ; ಅನುವಾದವು ಈ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಉಳಿಸಬೇಕು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ‘ಸಬ್ಬತ್’, ‘ಯಾಜಕರು’, ‘ಧರ್ಮಶಾಸ್ತ್ರ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಗಳನ್ನು ಉಳಿಸಿಕೊಂಡು, ಗ್ರೀಕ್ ಪಠ್ಯದ ವಾಗ್ವೈಖರಿಯ ಪ್ರಶ್ನೆ ಮತ್ತು ‘ಅಪವಿತ್ರಗೊಳಿಸುವುದು—ನಿರ್ದೋಷಿಗಳು’ ಎಂಬ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಕಾಪಾಡಲಾಗಿದೆ.
