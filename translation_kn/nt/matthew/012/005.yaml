- from: ಅಥವಾ, ಸಬ್ಬತ್‌ ದಿನಗಳಲ್ಲಿ ದೇವಾಲಯದಲ್ಲಿರುವ ಯಾಜಕರು ಸಬ್ಬತ್‌ ದಿನವನ್ನು ಅಪವಿತ್ರಗೊಳಿಸಿದರೂ ನಿರ್ದೋಷಿಗಳಾಗಿದ್ದಾರೆಂದು ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ನೀವು ಓದಿಲ್ಲವೇ?[a][b][c]
  to: ಅಥವಾ, ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ ದೇವಾಲಯದಲ್ಲಿ ಯಾಜಕರು ಸಬ್ಬತ್ ದಿನವನ್ನು ಅಪವಿತ್ರಗೊಳಿಸುತ್ತಾರೆ ಮತ್ತು ನಿರ್ದೋಷಿಗಳಾಗಿದ್ದಾರೆಂದು ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ನೀವು ಓದಿಲ್ಲವೇ?[a][b][c]
  rationale: ಮುಖ್ಯ ತಿದ್ದುಪಡಿಯು βεβηλοῦσινನ ವರ್ತಮಾನಕಾಲವನ್ನು ‘ಅಪವಿತ್ರಗೊಳಿಸುತ್ತಾರೆ’ ಎಂಬುದರಿಂದ ಉಳಿಸುವುದಾಗಿದೆ. ‘ಮತ್ತು’ ಎಂಬ ಸಮನ್ವಯವು ಮೂಲದ καίಯನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತಲೇ, ‘ಅಪವಿತ್ರಗೊಳಿಸುವುದು’ ಮತ್ತು ‘ನಿರ್ದೋಷಿಗಳು’ ಎಂಬ ಉದ್ದೇಶಿತ ಒತ್ತಡವನ್ನು ಓದುಗರಿಗೆ ಉಳಿಸುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿ cಯನ್ನು ‘ಧರ್ಮಶಾಸ್ತ್ರ’ದ ವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಕಟ್ಟಿಹಾಕದೆ ಸ್ಪಷ್ಟಪಡಿಸಲು ಸಣ್ಣದಾಗಿ ಪರಿಷ್ಕರಿಸಲಾಗಿದೆ.
