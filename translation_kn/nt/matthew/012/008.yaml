  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಮನುಷ್ಯಕುಮಾರನು ಸಬ್ಬತ್ತಿನ ಕರ್ತನು.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಮನುಷ್ಯಕುಮಾರನು ಸಬ್ಬತ್ತಿನ ಮೇಲೆ ಅಧಿಕಾರವುಳ್ಳವನು.”
    reason: lexical_alternative
  - marker: b
    text: “ಮನುಷ್ಯಕುಮಾರನು” ಎಂಬುದು ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಯೇಸು ತನ್ನನ್ನು ಸೂಚಿಸಲು ವಿಶಿಷ್ಟವಾಗಿ ಬಳಸುವ ಬಿರುದು. ಇದನ್ನು ಹೆಚ್ಚು ಸಾಮಾನ್ಯವಾಗಿ “ಮಾನವನು” ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು; ಆದರೆ ಹಾಗೆ ಅನುವಾದಿಸಿದರೆ ಇದರ ಬಿರುದುಸಂಬಂಧಿ ಪ್ರತಿಧ್ವನಿ ದುರ್ಬಲವಾಗುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ವಾದಕ್ಕೆ ಈ ಹೇಳಿಕೆಯು ಕಾರಣ ಅಥವಾ ವಿವರಣೆಯನ್ನು ನೀಡುತ್ತದೆ ಎಂಬ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κύριος
  choice: ಕರ್ತನು
  rationale: ಅಧಿಕಾರವನ್ನೂ ಕ್ರಿಸ್ತಸಂಬಂಧಿ ಗಾಂಭೀರ್ಯವನ್ನೂ ಉಳಿಸುವ ಸ್ಥಿರವಾದ ಬಿರುದು; ‘ಒಡೆಯನು’ ಎಂಬ ಪರ್ಯಾಯಕ್ಕಿಂತ ಇಲ್ಲಿ ಹೆಚ್ಚು ತೂಕವುಳ್ಳದು.
- source_word: τοῦ σαββάτου
  choice: ಸಬ್ಬತ್ ದಿನದ
  rationale: κύριος ನಂತರದ ಸಂಬಂಧವಾಚಕ ರೂಪವನ್ನು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ; ಇದು ಸಾಮಾನ್ಯ ವಿಶ್ರಾಂತಿಗಿಂತ ಯೆಹೂದ್ಯರ ಪವಿತ್ರ ದಿನವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಯೇಸುವಿನ ವಿಶಿಷ್ಟ ಸ್ವನಾಮಕರಣವಾಗಿ ಬಳಕೆಯಾಗುವ ಬಿರುದನ್ನೂ ಅದರ ಅಂತರಪಠ್ಯ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐστιν
  choice: ಆಗಿದ್ದಾನೆ (ಕನ್ನಡದಲ್ಲಿ ‘ಕರ್ತನು’ ಎಂಬ ವಿಧೇಯರೂಪದಲ್ಲಿ ಅರ್ಥಗೊಂಡಿದೆ)
  rationale: ಗ್ರೀಕ್‌ನ ಸರಳ ವರ್ತಮಾನಕಾಲದ ಸಂಯೋಜಕ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ನಾಮವಾಕ್ಯದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಪದವಿಲ್ಲದೆ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: κύριος ... τοῦ σαββάτου ಎಂಬ ಪದಗುಚ್ಛದ ಕ್ರಿಸ್ತಸಂಬಂಧಿ ಬಲ
  choice: ‘ಸಬ್ಬತ್ ದಿನದ ಕರ್ತನು’ ಎಂದು ಬಲವಾದ ಅಧಿಕಾರಸೂಚಕ ಬಿರುದಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಸಬ್ಬತ್ ದಿನದ ಮೇಲೆ ಅಧಿಕಾರವುಳ್ಳವನು’ ಅಥವಾ ‘ಸಬ್ಬತ್ ದಿನದ ಒಡೆಯನು’
  rationale: ವಾಕ್ಯವು ಮನುಷ್ಯಕುಮಾರನಿಗೆ ಸಬ್ಬತ್ ದಿನದ ಸಂಬಂಧದಲ್ಲಿ ಇರುವ ಅಧಿಕಾರವನ್ನು ಮೃದುಗೊಳಿಸದೆ ಹೇಳುತ್ತದೆ; ಅದೇ ವೇಳೆ ಮೂಲಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಣಯವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: ὁ υἱὸς τοῦ ἀνθρώπου ಎಂಬ ಬಿರುದಿನ ನಿರೂಪಣೆ
  choice: ಸ್ಥಾಪಿತ ಬಿರುದಾದ ‘ಮನುಷ್ಯಕುಮಾರನು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಆ ಮನುಷ್ಯನು’ ಅಥವಾ ‘ಮಾನವನು’
  rationale: ಸಾಮಾನ್ಯ ಮಾನವಸೂಚಕ ಅರ್ಥಕ್ಕೆ ಸಮತಟ್ಟಾಗಿಸದೆ, ಸುವಾರ್ತಾ ಪರಂಪರೆಯಲ್ಲಿನ ಯೇಸುವಿನ ವಿಶಿಷ್ಟ ಸ್ವನಾಮಕರಣವನ್ನೂ ಸಾಧ್ಯವಾದ ದಾನಿಯೇಲ 7ರ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ರೂಪ. ‘ಸಬ್ಬತ್’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದವನ್ನು ‘ದಿನ’ದೊಂದಿಗೆ ಬಳಸಿ ಸಂಸ್ಥೆ/ಪವಿತ್ರ ದಿನದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
