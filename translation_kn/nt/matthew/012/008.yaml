    issue: “ಸಬ್ಬತ್ ದಿನದ” is narrower than the Greek expression.
    rationale: τοῦ σαββάτου refers to the Sabbath, which may denote the sacred day and institution. “ಸಬ್ಬತ್ತಿನ” retains this breadth more directly and avoids suggesting merely ownership or authority over one day.
  - severity: low
    issue: Footnote a repeats the narrower “ಸಬ್ಬತ್ ದಿನದ” wording.
    rationale: Updating it to “ಸಬ್ಬತ್ತಿನ ಮೇಲೆ” aligns the lexical alternative with the Greek and the main rendering.
