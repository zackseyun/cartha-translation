id: MAT.12.49
reference: Matthew 12:49
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: kn
  text: ಆತನು ಶಿಷ್ಯರ ಕಡೆಗೆ ತನ್ನ ಕೈಯನ್ನು ಚಾಚಿ, “ಇಗೋ[a], ನನ್ನ ತಾಯಿ ಮತ್ತು ನನ್ನ ಸಹೋದರರು[b]” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನೋಡಿ.”
    reason: Ἰδοὺ ಎಂಬ ಗಮನ ಸೆಳೆಯುವ ಪದಕ್ಕೆ ಸಾಧ್ಯವಾದ ಸಹಜ ಪರ್ಯಾಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ “ಸಹೋದರರು”; ಪುಲ್ಲಿಂಗ ಬಹುವಚನವನ್ನು “ಸಹೋದರ ಸಹೋದರಿಯರು” ಎಂದು ವಿಸ್ತರಿಸದೆ ಇಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
    reason: ಮೂಲಪದದ ವ್ಯಾಕರಣಾತ್ಮಕ ರೂಪ ಮತ್ತು ಅನುವಾದದ ವ್ಯಾಪ್ತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: ἐκτείνας
  choice: ಕೈಚಾಚಿ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚೆ ನಡೆದ ಸಹವರ್ತಿ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಕ್ರಿಯಾಪೂರ್ವಕ ರೂಪದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಯೇಸುವಿನ ದೃಶ್ಯಮಾನ ಅಂಗಸೂಚನೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: ಕೈ
  rationale: χεῖρ ಎಂಬ ಪದದ ಸಾಮಾನ್ಯ ಮತ್ತು ಸಂದರ್ಭಸೂಕ್ತ ಅರ್ಥ ‘ಕೈ’; ‘ತೋಳು’ ಎಂದು ವಿಸ್ತರಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: ತನ್ನ ಶಿಷ್ಯರ ಕಡೆಗೆ
  rationale: ಆರೋಪಣಾ ವಿಭಕ್ತಿಯೊಂದಿಗಿನ ἐπί ಇಲ್ಲಿ ಅಂಗಸೂಚನೆಯ ದಿಕ್ಕನ್ನು ಸೂಚಿಸುತ್ತದೆ. μαθηταί ಪದದಲ್ಲಿರುವ ಗುರು–ಶಿಷ್ಯ ಸಂಬಂಧವನ್ನು ‘ಶಿಷ್ಯರು’ ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰδοὺ
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಮತ್ತು ಎದುರಿರುವವರನ್ನು ಗುರುತಿಸಿ ತೋರಿಸುವ ಪದವಾಗಿ ‘ಇಗೋ’ ಸಂಕ್ಷಿಪ್ತ, ಸಹಜ ಮತ್ತು ಘನವಾಗಿದೆ.
- source_word: μήτηρ
  choice: ತಾಯಿ
  rationale: ಸಾಮಾನ್ಯ ಕುಟುಂಬಸಂಬಂಧದ ಪದಕ್ಕೆ ನೇರ ಮತ್ತು ಸಹಜ ಸಮಾನಾರ್ಥಕ.
- source_word: ἀδελφοί
  choice: ಸಹೋದರರು
  rationale: ಗ್ರೀಕ್ ಪದವು ಪುಲ್ಲಿಂಗ ಬಹುವಚನದಲ್ಲಿದೆ. ಈ ವಾಕ್ಯದಲ್ಲಿ ನೇರ ಕುಟುಂಬಪದಗಳ ಸಮಾಂತರತೆ ಇರುವುದರಿಂದ ಅದನ್ನು ‘ಒಡಹುಟ್ಟಿದವರು’ ಅಥವಾ ‘ಸಹೋದರ ಸಹೋದರಿಯರು’ ಎಂದು ವಿಸ್ತರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸು ಶಿಷ್ಯರನ್ನು ತನ್ನ ಕುಟುಂಬವೆಂದು ಗುರುತಿಸುವಾಗ ಬಳಸಿದ ಸಂಬಂಧಪದಗಳು
  choice: ‘ತಾಯಿ’ ಮತ್ತು ‘ಸಹೋದರರು’ ಎಂಬ ನೇರ ಸಂಬಂಧಪದಗಳನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಕುಟುಂಬದವರು’ ಅಥವಾ ‘ಒಡಹುಟ್ಟಿದವರು’ ಎಂಬ ಒಳಗೊಳ್ಳುವ ಪರ್ಯಾಯಪದಗಳನ್ನು ಬಳಸುವುದು
  rationale: ಮೂಲವಾಕ್ಯವು ಸ್ಪಷ್ಟವಾದ ಕುಟುಂಬಸಂಬಂಧದ ಪದಗಳ ಮೂಲಕ ಯೇಸುವಿನ ಮಾತಿನ ಪ್ರಭಾವವನ್ನು ಕಟ್ಟುತ್ತದೆ. ವಿಶಾಲಾರ್ಥದ ಪದ ಬಳಸಿದರೆ ಆ ವಾಕ್ಚಾತುರ್ಯ ಮೃದುವಾಗಿ, ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಿಲ್ಲದ ವ್ಯಾಖ್ಯಾನ ಸೇರಬಹುದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ, ಆದರೆ ವಾಕ್ಯದ ಘನತೆಯನ್ನು ಉಳಿಸುವ ಶೈಲಿ. ‘ಕೈಚಾಚಿ’ ಸಹಜವಾದ ಕ್ರಿಯಾಕ್ರಮವನ್ನು ನೀಡುತ್ತದೆ; ‘ಇಗೋ’ ಗಮನ ಸೆಳೆಯುವ ಮೂಲದ ಒತ್ತನ್ನು ಕಾಪಾಡುತ್ತದೆ.
