  terminology: ‘ಶಿಷ್ಯರು,’ ‘ತಾಯಿ,’ and ‘ಸಹೋದರರು’ are accurate and suitably consistent Gospel terminology. Retaining ‘ಸಹೋದರರು’ does not expand the masculine plural beyond the Greek wording.
