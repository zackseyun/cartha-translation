id: MAT.12.19
reference: Matthew 12:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: kn
  text: ಅವನು ಜಗಳವಾಡುವುದಿಲ್ಲ, ಕೂಗುವುದೂ ಇಲ್ಲ; ಬೀದಿಗಳಲ್ಲಿ ಅವನ ಧ್ವನಿಯನ್ನು ಯಾರೂ ಕೇಳುವುದಿಲ್ಲ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವನು ಹೋರಾಡುವುದಿಲ್ಲ, ಗಟ್ಟಿಯಾಗಿ ಕೂಗುವುದೂ ಇಲ್ಲ; ಸಾರ್ವಜನಿಕ ಚೌಕಗಳಲ್ಲಿ ಅವನ ಧ್ವನಿಯನ್ನು ಯಾರೂ ಕೇಳುವುದಿಲ್ಲ.’
    reason: ἐρίζω, κραυγάζω ಮತ್ತು πλατεῖα ಪದಗಳ ಸಾಧ್ಯವಾದ ಶಬ್ದಾರ್ಥ ಪರ್ಯಾಯಗಳನ್ನು ದಾಖಲಿಸಲು.
lexical_decisions:
- source_word: ἐρίσει
  choice: ಜಗಳವಾಡುವುದಿಲ್ಲ
  rationale: ἐρίζω ಎಂಬುದು ಕಲಹ ಅಥವಾ ವಾಗ್ವಾದದಲ್ಲಿ ತೊಡಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಜಗಳವಾಡುವುದಿಲ್ಲ’ ಎಂಬುದು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಸೇವಕನ ಕಲಹಪ್ರಿಯವಲ್ಲದ ನಡತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: κραυγάσει
  choice: ಕೂಗುವುದೂ ಇಲ್ಲ
  rationale: κραυγάζω ಗಟ್ಟಿಯಾಗಿ ಕೂಗುವುದು ಅಥವಾ ಮೊರೆಯಿಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಇಲ್ಲಿ ‘ಕೂಗುವುದೂ ಇಲ್ಲ’ ಎಂಬುದು ಸಾರ್ವಜನಿಕವಾಗಿ ಗದ್ದಲ ಮಾಡುವುದಿಲ್ಲ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀκούσει τις
  choice: ಯಾರೂ ಕೇಳುವುದಿಲ್ಲ
  rationale: ನಿಷೇಧದೊಂದಿಗೆ ಬಂದಿರುವ τις ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಯಾರೂ ... ಇಲ್ಲ’ ಎಂದು ನಿರೂಪಿಸಲಾಗಿದೆ.
- source_word: ἐν ταῖς πλατείαις
  choice: ಬೀದಿಗಳಲ್ಲಿ
  rationale: πλατεῖα ಅಗಲವಾದ ಬೀದಿ ಅಥವಾ ಸಾರ್ವಜನಿಕ ಸಂಚಾರಸ್ಥಳವನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಬೀದಿಗಳಲ್ಲಿ’ ಎಂಬುದು ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು ಸಾರ್ವಜನಿಕ ಸನ್ನಿವೇಶವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಸಾರ್ವಜನಿಕ ಚೌಕಗಳಲ್ಲಿ’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: φωνὴν αὐτοῦ
  choice: ಅವನ ಧ್ವನಿಯನ್ನು
  rationale: φωνή ಇಲ್ಲಿ ವ್ಯಕ್ತಿಯ ಧ್ವನಿಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಅವನ ಧ್ವನಿ’ ನೇರವಾದ ಮತ್ತು ಸ್ಪಷ್ಟವಾದ ಅನುವಾದವಾಗಿದೆ.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: …ವುದಿಲ್ಲ, …ವುದೂ ಇಲ್ಲ; …ಯಾರೂ …ವುದಿಲ್ಲ
  rationale: ಮೂರು ನಿರಾಕರಣೆಗಳ ಸಂಚಿತ ಬಲವನ್ನು ಕನ್ನಡದ ಸಹಜ ಸಮಾನಾಂತರ ರಚನೆಯ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೆಶಾಯನ ಸೇವಕನ ಉಲ್ಲೇಖ ಮತ್ತು ಮೆಸ್ಸೀಯನ ನಡತೆಯ ಚಿತ್ರಣ
  choice: ವಚನವು ಮೆಸ್ಸೀಯನನ್ನು ಕಲಹಪ್ರಿಯನಲ್ಲದವನಾಗಿಯೂ ಸಾರ್ವಜನಿಕವಾಗಿ ಗದ್ದಲದಿಂದ ತನ್ನನ್ನು ಪ್ರದರ್ಶಿಸದವನಾಗಿಯೂ ಚಿತ್ರಿಸುತ್ತದೆ.
  alternative: ಪಾರಂಪರಿಕ ಉಲ್ಲೇಖದ ಶೈಲಿಯನ್ನು ಪ್ರತಿಧ್ವನಿಸಲು ‘ಹೋರಾಡುವುದಿಲ್ಲ’ ಮತ್ತು ‘ಆರ್ಭಟಿಸುವುದಿಲ್ಲ’ ಎಂದು ಹೆಚ್ಚು ಔಪಚಾರಿಕವಾಗಿ ಅನುವಾದಿಸಬಹುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಯೆಶಾಯ 42:2ರ ನೆರವೇರಿಕೆಯಲ್ಲಿ ಯೇಸುವಿನ ಸೌಮ್ಯ ಮತ್ತು ಕಲಹರಹಿತ ಸಾರ್ವಜನಿಕ ನಡತೆಯನ್ನು ವರ್ಣಿಸುತ್ತದೆ. ಇದು ಅವನು ಎಂದಿಗೂ ಸಾರ್ವಜನಿಕವಾಗಿ ಮಾತನಾಡಲಿಲ್ಲ ಅಥವಾ ಸಂಪೂರ್ಣ ನಿಷ್ಕ್ರಿಯನಾಗಿದ್ದನು ಎಂಬ ಅರ್ಥವನ್ನು ಹೇರಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ‘ಜಗಳವಾಡು’ ಎಂಬುದು ಕಲಹದ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ನೀಡುತ್ತದೆ; ‘ಕೂಗು’ ಸಾರ್ವಜನಿಕ ಗದ್ದಲದ ಭಾವವನ್ನು ಅತಿಯಾಗಿ ವಿಸ್ತರಿಸದೆ ಉಳಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ [a] ಗುರುತು ಅಡಿಕುರಿಪಿಗೆ ಸರಿಯಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ.
