id: MAT.12.31
reference: Matthew 12:31
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: kn
  text: 'ಆದ್ದರಿಂದ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ: ಮನುಷ್ಯರಿಗೆ ಪ್ರತಿಯೊಂದು ಪಾಪವೂ ದೇವದೂಷಣೆಯೂ ಕ್ಷಮಿಸಲ್ಪಡುವುದು; ಆದರೆ ಆತ್ಮನ[a] ವಿರುದ್ಧದ ದೇವದೂಷಣೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದಿಲ್ಲ.


    [a] ಅಥವಾ, ‘ಪವಿತ್ರಾತ್ಮನ ವಿರುದ್ಧದ ದೇವದೂಷಣೆ.’ ಈ ವಚನದಲ್ಲಿ ಮೂಲಪಾಠವು ‘ಆತ್ಮನ’ ಎಂದಷ್ಟೇ ಹೇಳುತ್ತದೆ; ಆದರೆ ಸುತ್ತಲಿನ ಸಂದರ್ಭವು ಪವಿತ್ರಾತ್ಮನನ್ನು ಸೂಚಿಸುತ್ತದೆ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಪವಿತ್ರಾತ್ಮನ ವಿರುದ್ಧದ ದೇವದೂಷಣೆ.’ ಈ ವಚನದಲ್ಲಿ ಮೂಲಪಾಠವು ‘ಆತ್ಮನ’ ಎಂದಷ್ಟೇ ಹೇಳುತ್ತದೆ; ಆದರೆ ಸುತ್ತಲಿನ ಸಂದರ್ಭವು ಪವಿತ್ರಾತ್ಮನನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದಿಂದ ಬರುವ ತೀರ್ಮಾನಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: ನೇರ ಸಂಬೋಧನೆಯನ್ನೂ ಮಾತಿನ ಗಂಭೀರತೆಯನ್ನೂ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: ಪ್ರತಿಯೊಂದು ಪಾಪವೂ ದೇವದೂಷಣೆಯೂ
  rationale: πᾶσα ಪದದ ವಿತರಣಾತ್ಮಕ ಅರ್ಥವನ್ನು ‘ಪ್ರತಿಯೊಂದು’ ಉಳಿಸುತ್ತದೆ; ದೈವದ ವಿರುದ್ಧದ ಅವಮಾನಕರ ಮಾತಿನ ಈ ಸಂದರ್ಭದಲ್ಲಿ βλασφημίαಗೆ ‘ದೇವದೂಷಣೆ’ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: ಮನುಷ್ಯರಿಗೆ … ಕ್ಷಮಿಸಲ್ಪಡುವುದು
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನೂ ಕ್ಷಮೆ ದೊರಕುವವರನ್ನು ಸೂಚಿಸುವ ದತ್ತಿ ವಿಭಕ್ತಿಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ‘ಮನುಷ್ಯರಿಗೆ’ ಇಲ್ಲಿ ಸ್ತ್ರೀಪುರುಷರೆಲ್ಲರನ್ನೂ ಒಳಗೊಂಡ ಸಾಮಾನ್ಯ ಮಾನವ ಉಲ್ಲೇಖವಾಗಿದೆ.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: ಆದರೆ ಆತ್ಮನ ವಿರುದ್ಧದ ದೇವದೂಷಣೆ
  rationale: ಜನಿಟಿವ್ ರೂಪವನ್ನು ದೇವದೂಷಣೆಯ ಗುರಿಯನ್ನು ಸೂಚಿಸುವುದಾಗಿ ಗ್ರಹಿಸಿ ‘ವಿರುದ್ಧದ’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿ ἁγίου ಇಲ್ಲದ ಕಾರಣ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಪವಿತ್ರ’ ಎಂಬುದನ್ನು ಸೇರಿಸಿಲ್ಲ.
- source_word: οὐκ ἀφεθήσεται
  choice: ಕ್ಷಮಿಸಲ್ಪಡುವುದಿಲ್ಲ
  rationale: ನಿರಾಕೃತ ಭವಿಷ್ಯತ್ಕಾಲದ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಗಂಭೀರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: πνεύματος ಅನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಆತ್ಮನ’ ಎಂದೋ ‘ಪವಿತ್ರಾತ್ಮನ’ ಎಂದೋ ಅನುವಾದಿಸುವುದು
  choice: ಆತ್ಮನ
  alternative: ಪವಿತ್ರಾತ್ಮನ
  rationale: ಈ ವಚನದ ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ τοῦ πνεύματος (‘ಆತ್ಮನ’) ಎಂದಷ್ಟೇ ಇದೆ; ἁγίου (‘ಪವಿತ್ರ’) ಇಲ್ಲ. ಸುತ್ತಲಿನ ಸಂದರ್ಭವು ಪವಿತ್ರಾತ್ಮನನ್ನೇ ಸೂಚಿಸಿದರೂ, ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ ಸ್ಪಷ್ಟೀಕರಣವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: τοῦ πνεύματος ಎಂಬ ಜನಿಟಿವ್‌ನ ಸಂಬಂಧ
  choice: ಆತ್ಮನ ವಿರುದ್ಧದ ದೇವದೂಷಣೆ
  alternative: ಆತ್ಮನ ದೇವದೂಷಣೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಆತ್ಮನು ದೇವದೂಷಣೆಯ ಕರ್ತನಲ್ಲ, ಅದರ ಗುರಿ. ಆದ್ದರಿಂದ ಉದ್ದೇಶಿತ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ತಪ್ಪಿಲ್ಲದೆ ತಿಳಿಸಲು ‘ವಿರುದ್ಧದ’ ಬಳಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಗೌರವಯುತ ಮತ್ತು ಶಾಸ್ತ್ರೋಚಿತ ಧಾಟಿ ಬಳಸಲಾಗಿದೆ. ‘ದೇವದೂಷಣೆ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಹಿಸಬಹುದಾದ ಸ್ಥಿರ ಧಾರ್ಮಿಕ ಪದ; ‘ಕ್ಷಮಿಸಲ್ಪಡುವುದು’ ಗ್ರೀಕ್ ಕರ್ಮಣಿ ವಿನ್ಯಾಸವನ್ನೂ ಎರಡು ಉಪವಾಕ್ಯಗಳ ಸಮಾಂತರತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
