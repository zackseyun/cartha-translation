id: MAT.12.15
reference: Matthew 12:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: kn
  text: ಆದರೆ ಯೇಸು ಇದನ್ನು ತಿಳಿದುಕೊಂಡು ಅಲ್ಲಿಂದ ದೂರ ಸರಿದರು.[a] ಅನೇಕರು ಅವರನ್ನು ಹಿಂಬಾಲಿಸಿದರು, ಮತ್ತು ಅವರು ಅವರೆಲ್ಲರನ್ನೂ ಗುಣಪಡಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಯೇಸು ಅದನ್ನು ತಿಳಿದುಕೊಂಡು ಅಲ್ಲಿಂದ ದೂರ ಸರಿದರು.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ತಿಳಿದುಕೊಂಡು’ ಎಂಬುದರ ಕರ್ಮವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿಲ್ಲ; ಹಿಂದಿನ ವಚನದ ಸಂದರ್ಭವು ಅದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: ಇದನ್ನು ತಿಳಿದುಕೊಂಡು
  rationale: γινώσκω ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲದ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಅರಿವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ಮವು ಸ್ಪಷ್ಟವಾಗಿ ಇಲ್ಲದಿದ್ದರೂ, ಹಿಂದಿನ ವಚನದ ಸಂದರ್ಭವನ್ನು ‘ಇದನ್ನು’ ಎಂಬ ಪದ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀνεχώρησεν
  choice: ಹಿಂದೆ ಸರಿದರು
  rationale: ಮತ್ತಾಯನಲ್ಲಿ ἀναχωρέω ವಿರೋಧ ಅಥವಾ ಅಪಾಯದ ಸಂದರ್ಭದಲ್ಲಿ ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಸ್ಥಳದಿಂದ ದೂರವಾಗುವ ಅರ್ಥವನ್ನು ಹೊಂದುತ್ತದೆ. ‘ಹಿಂದೆ ಸರಿದರು’ ಎಂಬುದು ಕೇವಲ ‘ಹೊರಟುಹೋದರು’ಗಿಂತ ಆ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಚೆನ್ನಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ
  rationale: ಒಂದು ಸ್ಥಳದಿಂದ ದೂರ ಸಾಗುವುದನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡ ರೂಪ.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: ಅನೇಕರು ಅವರನ್ನು ಹಿಂಬಾಲಿಸಿದರು
  rationale: πολλοί ಎಂದರೆ ಸರಳವಾಗಿ ‘ಅನೇಕರು’; ಮೂಲದಲ್ಲಿ ‘ಜನಸಮೂಹಗಳು’ ಎಂಬ ಪದ ಇಲ್ಲ. ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಪದಕ್ರಮ ಬಳಸಲಾಗಿದೆ.
- source_word: ἐθεράπευσεν
  choice: ಗುಣಪಡಿಸಿದರು
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿನ ಚಿಕಿತ್ಸೆಯ ಸಂದರ್ಭದಲ್ಲಿ θεραπεύωಗೆ ‘ಗುಣಪಡಿಸು’ ಎಂಬುದು ಸ್ಪಷ್ಟವೂ ರೂಢಿಯಲ್ಲಿರುವುದೂ ಆದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: αὐτοὺς πάντας
  choice: ಅವರೆಲ್ಲರನ್ನೂ
  rationale: πάνταςನ ಸಮಗ್ರ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತಾ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: γνοὺς ಪದದ ಅಪ್ರಕಟಿತ ಕರ್ಮ
  choice: ಹಿಂದಿನ ವಚನದಲ್ಲಿ ತಿಳಿಸಿದ ಫರಿಸಾಯರ ಸಂಚನ್ನು ಯೇಸು ಅರಿತರು ಎಂಬ ಸಂದರ್ಭಸೂಚಕ ಅರ್ಥವನ್ನು ‘ಇದನ್ನು ತಿಳಿದುಕೊಂಡು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
  alternative: ‘ಯೇಸು ತಿಳಿದುಕೊಂಡು’ ಅಥವಾ ‘ಇದರ ಅರಿವಾಗಿ’
  rationale: ಈ ವಚನದ ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ಕರ್ಮವು ಹೇಳಲ್ಪಟ್ಟಿಲ್ಲ. ‘ಇದನ್ನು’ ಎಂಬುದು ಹಿಂದಿನ ಸಂದರ್ಭದ ಸಂಪರ್ಕವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಆದರೆ ನಿರ್ದಿಷ್ಟ ವಿವರವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: ಯೇಸುವಿನ ನಿರ್ಗಮನದ ಸೂಕ್ಷ್ಮಾರ್ಥ
  choice: ಹಿಂದೆ ಸರಿದರು
  alternative: ‘ಹೊರಟುಹೋದರು’ ಅಥವಾ ‘ಅಲ್ಲಿಂದ ಹೋದರು’
  rationale: ಭಯ ಅಥವಾ ಹೇಡಿತನವನ್ನು ಆರೋಪಿಸದೆ, ವಿರೋಧಕ್ಕೆ ಪ್ರತಿಕ್ರಿಯೆಯಾಗಿ ನಡೆದ ಉದ್ದೇಶಪೂರ್ವಕ ನಿರ್ಗಮನದ ಮತ್ತಾಯನ ನಿರೂಪಣಾತ್ಮಕ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಯೇಸುವನ್ನು ಉಲ್ಲೇಖಿಸುವ ಕ್ರಿಯಾಪದ ಮತ್ತು ಸರ್ವನಾಮಗಳಲ್ಲಿ ಗೌರವ ಬಹುವಚನ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ವಾಕ್ಯಸಂಬಂಧ ಮತ್ತು ಅರ್ಥದ ಒತ್ತನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆ ಅನುಸರಿಸಲಾಗಿದೆ.
