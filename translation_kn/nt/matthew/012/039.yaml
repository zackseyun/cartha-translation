id: MAT.12.39
reference: Matthew 12:39
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: kn
  text: 'ಆದರೆ ಆತನು ಅವರಿಗೆ ಉತ್ತರವಾಗಿ ಹೇಳಿದನು: “ದುಷ್ಟವೂ ವ್ಯಭಿಚಾರಿಯೂ ಆದ ಪೀಳಿಗೆ[a] ಒಂದು ಸೂಚಕಕಾರ್ಯವನ್ನು ಹುಡುಕುತ್ತದೆ; ಆದರೆ ಪ್ರವಾದಿಯಾದ ಯೋನನ ಸೂಚಕಕಾರ್ಯವಲ್ಲದೆ ಬೇರೆ ಯಾವ ಸೂಚಕಕಾರ್ಯವೂ ಅದಕ್ಕೆ ಕೊಡಲಾಗುವುದಿಲ್ಲ.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ವ್ಯಭಿಚಾರಿ’ ಎಂಬುದು ನೈಜ ಲೈಂಗಿಕ ಅನೈತಿಕತೆಯ ಜೊತೆಗೆ ದೇವರೊಂದಿಗಿನ ಒಡಂಬಡಿಕೆಗೆ ನಂಬಿಗಸ್ತರಾಗಿರದಿರುವುದನ್ನೂ ಸೂಚಿಸಬಹುದು; ಪ್ರವಾದಿಗಳ ಬರಹಗಳಲ್ಲಿ ಆತ್ಮಿಕ ದ್ರೋಹಕ್ಕೆ ವ್ಯಭಿಚಾರದ ರೂಪಕವನ್ನು ಬಳಸಲಾಗಿದೆ.
    reason: cross_reference
  - marker: b
    text: ಅಥವಾ, “ಪ್ರವಾದಿ ಯೋನನ ಸೂಚಕಕಾರ್ಯ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ಉತ್ತರವಾಗಿ ಹೇಳಿದನು
  rationale: ಗ್ರೀಕ್‌ನ ಕೃದಂತ ಮತ್ತು ಸಮಾಪಕ ಕ್ರಿಯಾಪದ ಎರಡರ ಅರ್ಥವನ್ನೂ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Γενεὰ
  choice: ಪೀಳಿಗೆ
  rationale: ಒಂದೇ ಕಾಲಘಟ್ಟದ ಜನಸಮೂಹವನ್ನು ನೈತಿಕವಾಗಿ ವರ್ಣಿಸುವ ಈ ಪದಕ್ಕೆ ‘ಪೀಳಿಗೆ’ ಸಹಜವೂ ಸಮೂಹಾರ್ಥವನ್ನು ಉಳಿಸುವುದೂ ಆಗಿದೆ.
- source_word: πονηρὰ
  choice: ದುಷ್ಟ
  rationale: ಸಂದರ್ಭದಲ್ಲಿರುವ ತೀವ್ರ ನೈತಿಕ ಖಂಡನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μοιχαλὶς
  choice: ವ್ಯಭಿಚಾರಿ
  rationale: ಪದದ ನೇರ ವ್ಯಭಿಚಾರಾರ್ಥವನ್ನೂ ಪ್ರವಾದನಾ ಪರಂಪರೆಯ ಒಡಂಬಡಿಕೆ-ದ್ರೋಹದ ರೂಪಕವನ್ನೂ ಒಂದೇ ಸಮಯದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ‘ನಂಬಿಗಸ್ತವಲ್ಲದ’ ಎಂದು ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: σημεῖον
  choice: ಸೂಚಕಕಾರ್ಯ
  rationale: ದೈವಿಕ ದೃಢೀಕರಣವಾಗಿ ಕೇಳಲ್ಪಡುವ ಕಾರ್ಯದ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಬೈಬಲ್ ಬಳಕೆಗೆ ಹೊಂದುವಂತೆ ತಿಳಿಸುತ್ತದೆ; ‘ಅದ್ಭುತ’ ಎಂಬ ವಿಶೇಷಣವನ್ನು ಸೇರಿಸಿ ಗ್ರೀಕ್‌ಗಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ἐπιζητεῖ
  choice: ಹುಡುಕುತ್ತದೆ
  rationale: ಕ್ರಿಯಾಪದದ ಮೂಲ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ; ‘ಒತ್ತಾಯಿಸುತ್ತದೆ’ ಎಂದು ಸಂದರ್ಭಾರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಬಲಪಡಿಸುವುದಿಲ್ಲ.
- source_word: δοθήσεται
  choice: ಕೊಡಲಾಗುವುದಿಲ್ಲ
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ.
- source_word: αὐτῇ
  choice: ಅದಕ್ಕೆ
  rationale: ಸ್ತ್ರೀಲಿಂಗ ಏಕವಚನ ಸರ್ವನಾಮವು ‘ಪೀಳಿಗೆ’ಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ನಪುಂಸಕ ಏಕವಚನ ಸೂಚನೆಯನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: εἰ μὴ
  choice: ವಲ್ಲದೆ ಬೇರೆ ಯಾವ...ವೂ ಇಲ್ಲ
  rationale: ನಕಾರಾತ್ಮಕ ವಾಕ್ಯದಲ್ಲಿ ಇರುವ ಏಕೈಕ ಅಪವಾದವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯಾದ ಯೋನನ ಸೂಚಕಕಾರ್ಯ
  rationale: ಯೋನನನ್ನು ‘ಪ್ರವಾದಿ’ ಎಂದು ಗುರುತಿಸುತ್ತಾ ಪದಗುಚ್ಛದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಆ ಸೂಚಕಕಾರ್ಯದ ಸ್ವರೂಪವನ್ನು ಮುಂದಿನ ಸಂದರ್ಭಕ್ಕಿಂತ ಮುಂಚೆಯೇ ವಿವರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಖಂಡನೆಯಲ್ಲಿ ‘ವ್ಯಭಿಚಾರಿ’ ಎಂಬ ಪದದ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ವ್ಯಭಿಚಾರಿ’ ಎಂಬ ತೀಕ್ಷ್ಣ ರೂಪಕವನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ನಂಬಿಗಸ್ತವಲ್ಲದ / ದ್ರೋಹಿ
  rationale: ಗ್ರೀಕ್ ಪದವು ನೈಜ ಲೈಂಗಿಕ ಅನೈತಿಕತೆಯ ಆರೋಪವನ್ನೂ ದೇವರೊಂದಿಗಿನ ಒಡಂಬಡಿಕೆಗೆ ದ್ರೋಹ ಮಾಡುವ ಪ್ರವಾದನಾ ರೂಪಕವನ್ನೂ ಪ್ರತಿಧ್ವನಿಸಬಹುದು. ಒಂದೇ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಈ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ‘ಯೋನನ ಸೂಚಕಕಾರ್ಯ’ದ ಸ್ವರೂಪ
  choice: ಪದಗುಚ್ಛವನ್ನು ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆಯಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಯೋನನ ಅನುಭವದಂತಿರುವ ಸೂಚಕಕಾರ್ಯ / ಯೋನನೇ ಆಗಿರುವ ಸೂಚನೆ
  rationale: ಈ ವಾಕ್ಯದಲ್ಲಿ ಅದರ ನಿಖರ ಸ್ವರೂಪವನ್ನು ವಿವರಿಸಲಾಗಿಲ್ಲ; ಮುಂದಿನ ಸಂದರ್ಭವೇ ಅದನ್ನು ವಿಸ್ತರಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ನಿರ್ದಿಷ್ಟ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಆಮದು ಮಾಡಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಬೈಬಲ್ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಸೂಚಕಕಾರ್ಯ’ವನ್ನು ಎರಡೂ ಸ್ಥಳಗಳಲ್ಲಿ ಒಂದೇ ರೀತಿಯಾಗಿ ಇಟ್ಟು ಪದಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ವ್ಯಭಿಚಾರಿ’ಯ ರೂಪಕಾತ್ಮಕ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಮೃದುಗೊಳಿಸಲಾಗಿಲ್ಲ.
