id: MAT.12.37
reference: Matthew 12:37
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: kn
  text: ಏಕೆಂದರೆ, ನಿನ್ನ ಮಾತುಗಳಿಂದ ನೀನು ನಿರ್ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ[a]; ನಿನ್ನ ಮಾತುಗಳಿಂದ ನೀನು ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನೀತಿವಂತನೆಂದು ಘೋಷಿಸಲ್ಪಡುವೆ’ ಅಥವಾ ‘ಸಮರ್ಥಿಸಲ್ಪಡುವೆ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ನ್ಯಾಯಾಂಗದ ಸಂದರ್ಭದಲ್ಲಿ ಒಬ್ಬನನ್ನು ಸರಿ ಅಥವಾ ನಿರ್ದೋಷಿ ಎಂದು ಘೋಷಿಸುವ ಅರ್ಥವನ್ನು ಹೊಂದಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: ಆಧಾರದ ಮೇಲೆ
  rationale: ಜನನಾರ್ಥಕ ವಿಭಕ್ತಿಯೊಂದಿಗಿರುವ ἐκ ಇಲ್ಲಿ ತೀರ್ಪಿನ ಆಧಾರ ಅಥವಾ ಸಾಕ್ಷಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಆಧಾರದ ಮೇಲೆ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ನ್ಯಾಯಾಂಗದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: γάρ
  choice: ಏಕೆಂದರೆ
  rationale: γάρ ಹಿಂದಿನ ವಾಕ್ಯದ ಎಚ್ಚರಿಕೆಗೆ ಕಾರಣ ಅಥವಾ ವಿವರಣೆ ನೀಡುತ್ತದೆ; ‘ಏಕೆಂದರೆ’ ಆ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ.
- source_word: λόγων
  choice: ಮಾತುಗಳು
  rationale: ಬಹುವಚನ λόγοι ಇಲ್ಲಿ ವ್ಯಕ್ತಿಯು ಉಚ್ಚರಿಸಿದ ಮಾತುಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಎರಡೂ ಭಾಗಗಳ ಸಮಾನಾಂತರ ಪುನರಾವರ್ತನೆಯನ್ನು ‘ಮಾತುಗಳು’ ಉಳಿಸುತ್ತದೆ.
- source_word: σου
  choice: ನಿನ್ನ
  rationale: ಏಕವಚನ ದ್ವಿತೀಯ ಪುರುಷ ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δικαιωθήσῃ
  choice: ನೀತಿವಂತನೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ಕರ್ಮಣಿ ರೂಪವು ಈ ನ್ಯಾಯತೀರ್ಪಿನ ಸಂದರ್ಭದಲ್ಲಿ ಒಬ್ಬನು ಸರಿ ಅಥವಾ ನಿರ್ದೋಷಿ ಎಂದು ಘೋಷಿಸಲ್ಪಡುವ ನ್ಯಾಯಾಂಗದ ಅರ್ಥ ಹೊಂದಿದೆ. ಈ ಆಯ್ಕೆ ಕೇವಲ ನೈತಿಕವಾಗಿ ಒಳ್ಳೆಯವನಾಗುವುದೆಂಬ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸಿ ತೀರ್ಪಿನ ಸ್ವರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καταδικασθήσῃ
  choice: ಅಪರಾಧಿಯೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ
  rationale: ಇದು ನ್ಯಾಯಾಂಗದ ದೋಷನಿರ್ಣಯವನ್ನು ಸೂಚಿಸಿ δικαιωθήσῃಗೆ ಉದ್ದೇಶಿತ ವಿರೋಧವನ್ನು ರೂಪಿಸುತ್ತದೆ. ‘ಅಪರಾಧಿಯೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ’ ಆ ನ್ಯಾಯಾಲಯದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಮಾತುಗಳು ಮತ್ತು ನ್ಯಾಯತೀರ್ಪಿನ ಸಂಬಂಧದಲ್ಲಿ δικαιόω ಪದದ ನ್ಯಾಯಾಂಗದ ಅರ್ಥ
  choice: ‘ನೀತಿವಂತನೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ’ ಎಂದು ಅನುವಾದಿಸಿ, ವ್ಯಕ್ತಿಯ ಮಾತುಗಳು ತೀರ್ಪಿಗೆ ಆಧಾರ ಅಥವಾ ಸಾಕ್ಷಿಯಾಗುವುದನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
  alternative: ‘ನಿರ್ದೋಷಿಯೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ’ ಅಥವಾ ‘ನೀನು ಸಮರ್ಥಿಸಲ್ಪಡುವೆ’
  rationale: ಮುಂದಿನ ‘ಅಪರಾಧಿಯೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ’ ಎಂಬುದರೊಂದಿಗೆ ಇರುವ ನೇರ ವಿರೋಧವು ನ್ಯಾಯಾಂಗದ ಸಂದರ್ಭವನ್ನು ಸ್ಥಾಪಿಸುತ್ತದೆ. ಈ ಅನುವಾದವು ವಾಕ್ಯ ಹೇಳುವುದಕ್ಕಿಂತ ಮೀರಿದ ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ಸಮರ್ಥನೆ ಸಿದ್ಧಾಂತವನ್ನು ಆಮದು ಮಾಡದೆ, ‘ನೀತಿವಂತನೆಂದು ಘೋಷಿಸುವ’ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ನ್ಯಾಯಾಂಗ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಎರಡು ಸಮಾನಾಂತರ ಭಾಗಗಳು ಮತ್ತು ‘ನಿನ್ನ ಮಾತುಗಳ’ ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಏಕವಚನ ಸಂಬೋಧನೆಯನ್ನೂ ಕಾಪಾಡಲಾಗಿದೆ.
