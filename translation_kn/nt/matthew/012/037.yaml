revisions:
- from: ಏಕೆಂದರೆ, ನಿನ್ನ ಮಾತುಗಳ ಆಧಾರದ ಮೇಲೆ ನೀನು ನೀತಿವಂತನೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ[a]; ನಿನ್ನ ಮಾತುಗಳ ಆಧಾರದ ಮೇಲೆಯೇ ನೀನು ಅಪರಾಧಿಯೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ.
  to: ಏಕೆಂದರೆ, ನಿನ್ನ ಮಾತುಗಳಿಂದ ನೀನು ನಿರ್ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ[a]; ನಿನ್ನ ಮಾತುಗಳಿಂದ ನೀನು ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ.
  rationale: The revision replaces a potentially moralizing rendering of δικαιωθήσῃ with a clear forensic equivalent, improves the Kannada verb collocation, and maintains the Greek parallelism and repeated evidential basis (‘ನಿನ್ನ ಮಾತುಗಳಿಂದ’). The alternative rendering in the footnote preserves the lexical breadth of δικαιόω without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains γάρ, the repeated reference to the hearer’s words, the future judicial passive sense, and the antithesis between δικαιωθήσῃ and καταδικασθήσῃ. However, ‘ನೀತಿವಂತನೆಂದು’ can suggest an assessment of inherent moral righteousness more readily than the immediate forensic contrast requires. ‘ನಿರ್ದೋಷಿಯೆಂದು’ gives the judicial acquittal sense naturally and pairs closely with ‘ದೋಷಿಯೆಂದು.’
  naturalness: ‘ತೀರ್ಪು ಹೊಂದುವೆ’ is understandable but is less idiomatic in modern standard Kannada than ‘ತೀರ್ಪು ಪಡೆಯುವೆ.’ The revised wording is concise, parallel, and preserves the formal judicial register.
  terminology: Use ‘ನಿರ್ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ’ / ‘ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ’ for the courtroom contrast. The footnote retains ‘ನೀತಿವಂತನೆಂದು ಘೋಷಿಸಲ್ಪಡುವೆ’ as a lexical alternative, so the broader δικαιόω terminology is not suppressed.
  issues:
  - severity: medium
    issue: ‘ನೀತಿವಂತನೆಂದು ತೀರ್ಪು ಹೊಂದುವೆ’ is potentially over-moralized and ‘ತೀರ್ಪು ಹೊಂದುವೆ’ is not the most idiomatic collocation.
    rationale: In this explicitly forensic antithesis, δικαιόω denotes being declared in the right/acquitted rather than primarily being characterized as morally righteous. ‘ನಿರ್ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ’ more directly conveys the judicial sense and naturally contrasts with condemnation.
  revised_text: ಏಕೆಂದರೆ, ನಿನ್ನ ಮಾತುಗಳಿಂದ ನೀನು ನಿರ್ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ[a]; ನಿನ್ನ ಮಾತುಗಳಿಂದ ನೀನು ದೋಷಿಯೆಂದು ತೀರ್ಪು ಪಡೆಯುವೆ.
