  source_fidelity: ಮುಖ್ಯ ಪಠ್ಯವು καὶ ಅನ್ನು ‘ಮತ್ತು’ ಎಂದು ಉಳಿಸಿ, τῷ ὀνόματι αὐτοῦ ಅನ್ನು ‘ಆತನ ಹೆಸರಿನಲ್ಲಿ,’ ἔθνη ಅನ್ನು ವಿಶಾಲಾರ್ಥದ ‘ಜನಾಂಗಗಳು,’ ಮತ್ತು ಭವಿಷ್ಯತ್ಕಾಲದ ἐλπιοῦσιν ಅನ್ನು ‘ನಿರೀಕ್ಷೆಯಿಡುವವು’ ಎಂದು ಸಮರ್ಪಕವಾಗಿ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ. ಮೂಲದಲ್ಲಿರುವ ಕ್ರಮ ಮತ್ತು ಅರ್ಥವ್ಯಾಪ್ತಿಗೆ ನಿಷ್ಠವಾಗಿದೆ.
  naturalness: ‘ಮತ್ತು ಜನಾಂಗಗಳು ಆತನ ಹೆಸರಿನಲ್ಲಿ ನಿರೀಕ್ಷೆಯಿಡುವವು’ ಎಂಬುದು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಶಾಸ್ತ್ರೋಚಿತ ಶೈಲಿಯಲ್ಲಿ ಸಹಜವಾಗಿದೆ. ‘ಜನಾಂಗಗಳು’ ಎಂಬ ನಪುಂಸಕ ಬಹುವಚನಕ್ಕೆ ‘ಇಡುವವು’ ಎಂಬ ಹೊಂದಾಣಿಕೆಯೂ ಸರಿಯಾಗಿದೆ.
  terminology: ‘ಹೆಸರು’ ಮೂಲದ ಧಾರ್ಮಿಕ-ಸಾಂದರ್ಭಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದನ್ನು ಖ್ಯಾತಿ ಅಥವಾ ಅಧಿಕಾರ ಎಂದು ಅನಗತ್ಯವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದಿಲ್ಲ. ‘ಜನಾಂಗಗಳು’ ἔθνηಯ ವಿಶಾಲವಾದ ಯೆಶಾಯನ-ಉಲ್ಲೇಖದ ಅರ್ಥವನ್ನು ಕಾಪಾಡುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿಯ ‘ಯೆಹೂದ್ಯೇತರರು’ ಪರ್ಯಾಯವು ಸಾಧ್ಯವಾದ ಸಂದರ್ಭಾನುಸಾರ ಅರ್ಥವನ್ನು ಸೂಕ್ತವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
