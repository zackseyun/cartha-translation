id: MAT.12.21
reference: Matthew 12:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: kn
  text: ಮತ್ತು ಜನಾಂಗಗಳು ಆತನ ಹೆಸರಿನಲ್ಲಿ ನಿರೀಕ್ಷೆಯಿಡುವವು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಯೆಹೂದ್ಯೇತರರು ಆತನ ಹೆಸರಿನಲ್ಲಿ ನಿರೀಕ್ಷೆಯಿಡುವರು.’
    reason: ἔθνη ಎಂಬ ಪದಕ್ಕೆ ‘ಜನಾಂಗಗಳು’ ಅಥವಾ ಸಂದರ್ಭಾನುಸಾರ ‘ಯೆಹೂದ್ಯೇತರರು’ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳು ಸಾಧ್ಯ; ಪರ್ಯಾಯವು ಇದೇ ಅರ್ಥಭೇದವನ್ನು ಮತ್ತು ಕನ್ನಡದ ವ್ಯಕ್ತಿವಾಚಕ ಬಹುವಚನ ಹೊಂದಾಣಿಕೆಯನ್ನು ತೋರಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿರುವ ಉಲ್ಲೇಖದೊಂದಿಗೆ ಈ ವಾಕ್ಯವನ್ನು ಜೋಡಿಸುವ ಸಾಮಾನ್ಯ ಸಂಯೋಜಕವಾಗಿ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: ಆತನ ಹೆಸರಿನಲ್ಲಿ
  rationale: ἐλπίζω ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಬಂದಿರುವ ದತ್ತಿವಿಭಕ್ತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಹೆಸರಿನಲ್ಲಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. ‘ಹೆಸರು’ ಎಂಬುದು ವ್ಯಕ್ತಿ, ಅವನ ಅಧಿಕಾರ ಮತ್ತು ಅವನ ಖ್ಯಾತಿಯನ್ನೂ ಸೂಚಿಸಬಲ್ಲುದರಿಂದ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἔθνη
  choice: ಜನಾಂಗಗಳು
  rationale: ಈ ಯೆಶಾಯನ ಉಲ್ಲೇಖದಲ್ಲಿ ಇಸ್ರಾಯೇಲಿನಾಚೆಯ ಜನಸಮುದಾಯಗಳ ವಿಶಾಲ ವ್ಯಾಪ್ತಿಯೇ ಪ್ರಧಾನವಾಗಿದೆ. ‘ಜನಾಂಗಗಳು’ ಎಂಬುದು ಅದನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಯೆಹೂದ್ಯೇತರರು’ ಎಂಬ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἐλπιοῦσιν
  choice: ನಿರೀಕ್ಷೆಯಿಡುವವು
  rationale: ಇದು ಭವಿಷ್ಯತ್ಕಾಲದ ಸಕ್ರಿಯ ಸೂಚಕ ರೂಪ. ‘ನಿರೀಕ್ಷೆಯಿಡುವವು’ ಎಂಬುದು ಅದರ ಭವಿಷ್ಯಾರ್ಥವನ್ನೂ ἐλπίζω ಪದದ ‘hope’ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮೆಸ್ಸೀಯನ ಕುರಿತ ಉಲ್ಲೇಖದಲ್ಲಿ ἔθνη ಪದದ ಅನುವಾದ
  choice: ಜನಾಂಗಗಳು
  alternative: ಯೆಹೂದ್ಯೇತರರು
  rationale: ಈ ವಾಕ್ಯವು ಯೆಶಾಯನ ಉಲ್ಲೇಖವಾಗಿ ಸೇವಕ/ಮೆಸ್ಸೀಯನಲ್ಲಿ ನಿರೀಕ್ಷೆಯಿಡುವ ವಿಶಾಲ ಜನಸಮುದಾಯಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಜನಾಂಗಗಳು’ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಯೆಹೂದ್ಯೇತರರು’ ಎಂಬ ಅರ್ಥವೂ ಸಂದರ್ಭಕ್ಕೆ ಸಾಧ್ಯವಾದುದರಿಂದ ಅದನ್ನು ಪರ್ಯಾಯವಾಗಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಶಾಸ್ತ್ರೋಚಿತ ಶೈಲಿ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಜನಾಂಗಗಳು’ ಎಂಬ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸಾಧ್ಯವಾದ ‘ಯೆಹೂದ್ಯೇತರರು’ ಅರ್ಥವನ್ನು ನೀಡಲಾಗಿದೆ.
