id: MAT.12.12
reference: Matthew 12:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: kn
  text: ಹಾಗಾದರೆ, ಮನುಷ್ಯನು ಕುರಿಗಿಂತ ಎಷ್ಟೋ ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವನು! ಆದ್ದರಿಂದ ಸಬ್ಬತ್‌ ದಿನಗಳಲ್ಲಿ[a] ಒಳ್ಳೆಯದನ್ನು ಮಾಡುವುದು ನ್ಯಾಯಸಮ್ಮತವಾಗಿದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ಹೆಚ್ಚು ಸಹಜವಾಗಿ, “ಸಬ್ಬತ್‌ ದಿನದಲ್ಲಿ.” ಗ್ರೀಕ್‌ನಲ್ಲಿ “ಸಬ್ಬತ್‌ ದಿನಗಳಲ್ಲಿ” ಎಂಬ ಬಹುವಚನವಿದೆ; ಸಬ್ಬತ್ ಆಚರಣೆಯನ್ನು ಸೂಚಿಸಲು ಇದು ಸಾಮಾನ್ಯವಾಗಿ ಬಳಸುವ ನುಡಿಗಟ್ಟು.
    reason: ಮೂಲದ ಬಹುವಚನ ರೂಪ ಮತ್ತು ಕನ್ನಡದ ಹೆಚ್ಚು ಸಹಜವಾದ ಏಕವಚನ ರೂಪ ಎರಡನ್ನೂ ಓದುಗರಿಗೆ ತಿಳಿಸಲು.
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: ಹಾಗಾದರೆ ... ಎಷ್ಟೋ ಹೆಚ್ಚು
  rationale: ಹಿಂದಿನ ಉದಾಹರಣೆಯಿಂದ ತೀರ್ಮಾನಕ್ಕೆ ಬರುವ ಸಂಬಂಧವನ್ನು ‘ಹಾಗಾದರೆ’ ಸೂಚಿಸುತ್ತದೆ; πόσῳಯ ಕಡಿಮೆಯಿಂದ ಹೆಚ್ಚಿನದಕ್ಕೆ ಸಾಗುವ ಹೋಲಿಕೆಯ ಬಲವನ್ನು ‘ಎಷ್ಟೋ ಹೆಚ್ಚು’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διαφέρει
  choice: ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಕ್ರಿಯಾಪದವು ಕೇವಲ ಭಿನ್ನತೆಯನ್ನಲ್ಲ, ಕುರಿಗೆ ಹೋಲಿಸಿದಾಗ ಮನುಷ್ಯನ ಹೆಚ್ಚಿನ ಮೌಲ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἄνθρωπος
  choice: ಮನುಷ್ಯನು
  rationale: ಏಕವಚನದಲ್ಲಿರುವ ಸಾಮಾನ್ಯ ಮಾನವಸೂಚಕ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: προβάτου
  choice: ಕುರಿಗಿಂತ
  rationale: ಷಷ್ಠೀ ವಿಭಕ್ತಿಯಿಂದ ವ್ಯಕ್ತವಾಗಿರುವ ಹೋಲಿಕೆಯನ್ನು ಕನ್ನಡದ ‘-ಗಿಂತ’ ರೂಪವು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὥστε
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಹೋಲಿಕೆಯಿಂದ ಹೊರಹೊಮ್ಮುವ ತೀರ್ಮಾನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἔξεστιν
  choice: ಧರ್ಮಸಮ್ಮತವಾಗಿದೆ
  rationale: ಸಬ್ಬತ್ ಆಚರಣೆಯ ನಿಯಮಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ವಿವಾದದಲ್ಲಿ ಕೇವಲ ಅನುಮತಿಗಿಂತ ಕಾನೂನುಬದ್ಧ ಅಥವಾ ಧಾರ್ಮಿಕವಾಗಿ ಸಮ್ಮತ ಎಂಬ ಅರ್ಥವನ್ನು ಹಿಡಿದಿಡುತ್ತದೆ.
- source_word: τοῖς σάββασιν
  choice: ಸಬ್ಬತ್‌ ದಿನಗಳಲ್ಲಿ
  rationale: ಗ್ರೀಕ್‌ನ ಬಹುವಚನ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿಕೊಂಡಿದೆ; ಅದು ಸಬ್ಬತ್ ಆಚರಣೆಯನ್ನು ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ ನುಡಿಗಟ್ಟಾಗಿರಬಹುದು.
- source_word: καλῶς ποιεῖν
  choice: ಒಳ್ಳೆಯದನ್ನು ಮಾಡುವುದು
  rationale: ಹಿತಕರವಾದ ಒಳ್ಳೆಯ ಕಾರ್ಯ ಮಾಡುವುದನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿಗೆ ಸರಳವೂ ಸಹಜವೂ ಆದ ಕನ್ನಡ ರೂಪ.
theological_decisions:
- issue: ἄνθρωπος ಪದದ ಸಾಮಾನ್ಯ ಮಾನವಸೂಚಕ ಅರ್ಥ
  choice: ಮನುಷ್ಯನು
  alternative: ಒಬ್ಬ ವ್ಯಕ್ತಿ / ಮಾನವನು
  rationale: ಕುರಿಯೊಂದಿಗೆ ಹೋಲಿಸಲ್ಪಡುವ ಏಕವಚನ ಪ್ರತಿನಿಧಿಕ ಮಾನವನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಲಿಂಗ ಅಥವಾ ವ್ಯಕ್ತಿಗೆ ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: ಸಬ್ಬತ್‌ನ ಬಹುವಚನ ನುಡಿಗಟ್ಟು
  choice: ಸಬ್ಬತ್‌ ದಿನಗಳಲ್ಲಿ
  alternative: ಸಬ್ಬತ್‌ ದಿನದಲ್ಲಿ
  rationale: ಮೂಲದಲ್ಲಿರುವ σάββασιν ಎಂಬ ಬಹುವಚನವನ್ನು ಪಠ್ಯದಲ್ಲಿ ಗೋಚರವಾಗಿರಿಸಿ, ಅದರ ಸಹಜ ಏಕವಚನ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ἔξεστιν ಪದದ ನಿಯಮಾತ್ಮಕ ಅರ್ಥ
  choice: ಧರ್ಮಸಮ್ಮತವಾಗಿದೆ
  alternative: ಅನುಮತಿ ಇದೆ
  rationale: ಸಂದರ್ಭವು ಸಬ್ಬತ್‌ನಲ್ಲಿ ಯಾವುದು ನಿಯಮಸಮ್ಮತ ಎಂಬ ಪ್ರಶ್ನೆಯಾಗಿರುವುದರಿಂದ, ಮೂಲದ ಕಾನೂನು-ನೈತಿಕ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ಇದು ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಸರಳ, ಆಧುನಿಕ ಮತ್ತು ಘನವಾದ ಕನ್ನಡವನ್ನು ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ತಾರ್ಕಿಕ ಕ್ರಮ, ಕಡಿಮೆಯಿಂದ ಹೆಚ್ಚಿನದಕ್ಕೆ ಸಾಗುವ ವಾದ ಮತ್ತು ಉದ್ಗಾರಾತ್ಮಕ ವಾಕ್ಚಾತುರ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಸಬ್ಬತ್’ ಪದವನ್ನು ಕನ್ನಡ ಕ್ರೈಸ್ತ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪವಾಗಿ ಇಡಲಾಗಿದೆ.
