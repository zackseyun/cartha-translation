id: MAT.12.42
reference: Matthew 12:42
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: kn
  text: ದಕ್ಷಿಣದ ರಾಣಿ[a] ನ್ಯಾಯತೀರ್ಪಿನಲ್ಲಿ ಈ ಪೀಳಿಗೆಯೊಂದಿಗೆ ಎದ್ದೇಳುವಳು ಮತ್ತು ಅದನ್ನು ಖಂಡಿಸುವಳು. ಏಕೆಂದರೆ ಸೊಲೊಮೋನನ ಜ್ಞಾನವನ್ನು ಕೇಳಲು ಅವಳು ಭೂಮಿಯ ಕಟ್ಟಕಡೆಯಿಂದ ಬಂದಳು. ಇಗೋ, ಸೊಲೊಮೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠವಾದದ್ದು[b] ಇಲ್ಲಿ ಇದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ದಕ್ಷಿಣದ ರಾಣಿ’ ಎಂಬುದು ಶೆಬದ ರಾಣಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ (1 ಅರಸುಗಳು 10:1–13; 2 ಪೂರ್ವಕಾಲವೃತ್ತಾಂತ 9:1–12); ಆದರೆ ಗ್ರೀಕ್ ಪಠ್ಯವು ‘ಶೆಬ’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ.
    reason: cross_reference
  - marker: b
    text: ಅಥವಾ, ‘ಸೊಲೊಮೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠನಾದವನು ಇಲ್ಲಿ ಇದ್ದಾನೆ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ನಪುಂಸಕ ರೂಪ (‘ಶ್ರೇಷ್ಠವಾದದ್ದು’) ಇದೆ; ಇದು ಯೇಸು ಮತ್ತು ಅವನ ಸೇವೆಯಲ್ಲಿ ಪ್ರಸ್ತುತವಾಗಿರುವ ಮಿಗಿಲಾದ ಮಹತ್ತನ್ನು ಒತ್ತಿಹೇಳಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: ದಕ್ಷಿಣದ ರಾಣಿ
  rationale: ಗ್ರೀಕ್‌ನ ಷಷ್ಠೀ ಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಹಿನ್ನೆಲೆಯಿಂದ ಅವಳು ಶೆಬದ ರಾಣಿ ಎಂಬುದು ತಿಳಿದರೂ, ಗ್ರೀಕ್ ಮೂಲಪಾಠವು ‘ಶೆಬ’ ಎಂದು ಹೆಸರಿಸದ ಕಾರಣ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἐγερθήσεται
  choice: ಎದ್ದೇಳುವಳು
  rationale: ಈ ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವು ‘ಎಬ್ಬಿಸಲ್ಪಡುವಳು’ ಅಥವಾ ‘ಎದ್ದು ನಿಲ್ಲುವಳು’ ಎಂಬ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು. ‘ಎದ್ದೇಳುವಳು’ ಎಂಬುದು ಪುನರುತ್ಥಾನ ಮತ್ತು ನ್ಯಾಯಸಭೆಯಲ್ಲಿ ಸಾಕ್ಷಿಯಾಗಿ ನಿಲ್ಲುವ ಎರಡೂ ಸೂಚನೆಗಳನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ κρίσει
  choice: ನ್ಯಾಯತೀರ್ಪಿನಲ್ಲಿ
  rationale: ನಿರ್ದಿಷ್ಟವಾದ ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ಸೂಚಿಸುವ ಪದಬಂಧವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ಈ ಪೀಳಿಗೆಯೊಂದಿಗೆ
  rationale: μετά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಸಾಮಾನ್ಯ ಅರ್ಥವಾದ ‘ಜೊತೆಯಲ್ಲಿ/ಒಂದಿಗೆ’ ಎಂಬುದನ್ನು ಉಳಿಸಲಾಗಿದೆ; ವಿರೋಧ ಅಥವಾ ಖಂಡನೆಯ ಭಾವ ಮುಂದಿನ ಕ್ರಿಯಾಪದದಿಂದ ಬರುತ್ತದೆ.
- source_word: κατακρινεῖ αὐτήν
  choice: ಅದನ್ನು ಖಂಡಿಸುವಳು
  rationale: κατακρίνω ಎಂಬುದರ ಬಲವಾದ ಅರ್ಥ ‘ಖಂಡಿಸು’. ‘ಅದನ್ನು’ ಎಂಬ ಸರ್ವನಾಮವು ಹಿಂದಿನ ‘ಈ ಪೀಳಿಗೆ’ಯನ್ನೇ ಸೂಚಿಸುತ್ತದೆ ಮತ್ತು ಮೂಲದ ಸರ್ವನಾಮರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: ಭೂಮಿಯ ಕಟ್ಟಕಡೆಯಿಂದ
  rationale: ಬಹಳ ದೂರದ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿಗೆ ಕನ್ನಡದ ಸಹಜ ನುಡಿಗಟ್ಟನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ಸೊಲೊಮೋನನ ಜ್ಞಾನವನ್ನು ಕೇಳಲು
  rationale: ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುವ infinitive ಮತ್ತು ಷಷ್ಠೀ ಸಂಬಂಧ ಎರಡನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಕೇಳುವವರ ಗಮನವನ್ನು ಒತ್ತಾಗಿ ಸೆಳೆಯುವ ಗಂಭೀರ ಸಂವಾದಸೂಚಕವಾಗಿ ‘ಇಗೋ’ ಸಹಜವಾಗಿದೆ.
- source_word: πλεῖον Σολομῶνος
  choice: ಸೊಲೊಮೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠವಾದದ್ದು
  rationale: πλεῖον ನಪುಂಸಕ ರೂಪದಲ್ಲಿರುವುದರಿಂದ ‘ಶ್ರೇಷ್ಠನಾದವನು’ ಎಂದು ವ್ಯಕ್ತಿಯನ್ನು ಮಾತ್ರ ಸೂಚಿಸುವಂತೆ ಮಾಡದೆ, ಮೂಲದ ವ್ಯಾಕರಣಾತ್ಮಕ ವ್ಯಾಪ್ತಿ ಮತ್ತು ಉದ್ದೇಶಿತ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὧδε
  choice: ಇಲ್ಲಿ ಇದೆ
  rationale: ಸ್ಥಳಸೂಚಕ ‘ಇಲ್ಲಿ’ಗೆ ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯ ಪೂರ್ಣವಾಗಲು ‘ಇದೆ’ ಸೇರಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: πλεῖον ಎಂಬ ನಪುಂಸಕ ತುಲನಾತ್ಮಕ ರೂಪವು ಯೇಸುವಿಗೆ ಹೇಗೆ ಸಂಬಂಧಿಸುತ್ತದೆ
  choice: ಸೊಲೊಮೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠವಾದದ್ದು ಇಲ್ಲಿ ಇದೆ
  alternative: ಸೊಲೊಮೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠನಾದವನು ಇಲ್ಲಿ ಇದ್ದಾನೆ
  rationale: ಮೂಲದ ನಪುಂಸಕ ರೂಪವು ಯೇಸು ಹಾಗೂ ಅವನ ಸೇವೆಯಲ್ಲಿ ಪ್ರಸ್ತುತವಾಗಿರುವ ಸೊಲೊಮೋನನನ್ನು ಮೀರಿದ ಮಹತ್ತನ್ನು ವಿಶಾಲವಾಗಿ ಸೂಚಿಸಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಶ್ರೇಷ್ಠವಾದದ್ದು’ ಎಂದು ನೀಡುವುದರಿಂದ ಯೇಸುವೇ ಉದ್ದೇಶಿತನಾಗಿರುವ ಸಂದರ್ಭವನ್ನು ನಿರಾಕರಿಸದೆ ವ್ಯಾಕರಣಾತ್ಮಕ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ನ್ಯಾಯತೀರ್ಪಿನಲ್ಲಿ ರಾಣಿಯು ‘ಈ ಪೀಳಿಗೆಯೊಂದಿಗೆ’ ಎದ್ದೇಳುವುದರ ಸಂಬಂಧ
  choice: ಈ ಪೀಳಿಗೆಯೊಂದಿಗೆ ಎದ್ದೇಳುವಳು ಮತ್ತು ಅದನ್ನು ಖಂಡಿಸುವಳು
  alternative: ಈ ಪೀಳಿಗೆಗೆ ವಿರುದ್ಧವಾಗಿ ಎದ್ದೇಳುವಳು
  rationale: ಗ್ರೀಕ್ μετά ಪದವು ಇಲ್ಲಿ ‘ಜೊತೆಯಲ್ಲಿ’ ಎಂಬ ಸಾಮಾನ್ಯ ಅರ್ಥ ಹೊಂದಿದೆ; ವಿರೋಧದ ಅರ್ಥವನ್ನು ‘ಖಂಡಿಸುವಳು’ ಎಂಬ ಮುಂದಿನ ಕ್ರಿಯೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಸಂಬಂಧವನ್ನು ಮುಂಚಿತವಾಗಿ ‘ವಿರುದ್ಧವಾಗಿ’ ಎಂದು ವ್ಯಾಖ್ಯಾನಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗಂಭೀರವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬ ಬೈಬಲೀಯ ಸಂವಾದಸೂಚಕವನ್ನು ಅದರ ಒತ್ತಿಗಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಉಳಿದ ವಾಕ್ಯರಚನೆಯನ್ನು ಅತಿಯಾಗಿ ಪ್ರಾಚೀನ ಅಥವಾ ಸಂಸ್ಕೃತನಿಷ್ಠವಾಗದಂತೆ ಮಾಡಲಾಗಿದೆ. ಅಡಿಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಅವು ವಿವರಿಸುವ ಪದಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
