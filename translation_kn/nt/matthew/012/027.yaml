id: MAT.12.27
reference: Matthew 12:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: kn
  text: ನಾನು ಬೇಲ್ಜೆಬೂಲನ ಶಕ್ತಿಯಿಂದ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತೇನೆಂದಾದರೆ, ನಿಮ್ಮ ಮಕ್ಕಳು ಯಾರ ಶಕ್ತಿಯಿಂದ ಅವುಗಳನ್ನು ಹೊರಹಾಕುತ್ತಾರೆ? ಆದ್ದರಿಂದ ಅವರೇ ನಿಮ್ಮ ನ್ಯಾಯಾಧೀಶರಾಗುವರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: ಬೆಲ್ಜೆಬೂಲನ ಶಕ್ತಿಯಿಂದ
  rationale: ἐν ಇಲ್ಲಿ ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಕೇವಲ ‘ಬೆಲ್ಜೆಬೂಲನಿಂದ’ ಎನ್ನುವುದಕ್ಕಿಂತ ‘ಬೆಲ್ಜೆಬೂಲನ ಶಕ್ತಿಯಿಂದ’ ಎಂಬುದು ಆರೋಪದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಹೆಸರನ್ನು ಮೂಲ ಗ್ರೀಕ್ ರೂಪಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: ದೆವ್ವಗಳನ್ನು ಹೊರಡಿಸುತ್ತೇನೆ
  rationale: ἐκβάλλω ಭೂತೋಚ್ಚಾಟನೆಯ ಸಂದರ್ಭದಲ್ಲಿ ಬಲವಂತವಾಗಿ ಹೊರಗೆ ಕಳುಹಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೊರಡಿಸು’ ಆ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; δαιμόνιαಗೆ ‘ದೆವ್ವಗಳು’ ಸಾಮಾನ್ಯರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಪದ.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ನಿಮ್ಮ ಮಕ್ಕಳು
  rationale: υἱοί ಅಕ್ಷರಶಃ ‘ಮಕ್ಕಳು/ಪುತ್ರರು’ ಎಂದರ್ಥ. ಇಲ್ಲಿ ತಮ್ಮ ಸಮುದಾಯದವರು ಅಥವಾ ಶಿಷ್ಯರನ್ನು ಸೂಚಿಸಬಹುದಾದರೂ, ಮೂಲದ ಬಂಧುತ್ವ ರೂಪಕ ಮತ್ತು ವಾದದ ಸಮಾಂತರತೆಯನ್ನು ಉಳಿಸಲು ‘ನಿಮ್ಮ ಮಕ್ಕಳು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἐν τίνι
  choice: ಯಾರ ಶಕ್ತಿಯಿಂದ
  rationale: ಮೊದಲ ἐν ನಂತೆಯೇ ಇದು ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವದ ಅರ್ಥದಲ್ಲಿದೆ. ವ್ಯಕ್ತಿಗತ ಶಕ್ತಿಯನ್ನು ಉದ್ದೇಶಿಸಿರುವ ಪ್ರಶ್ನೆಯಲ್ಲಿ ‘ಯಾರ ಶಕ್ತಿಯಿಂದ’ ಎಂಬುದು ಸ್ಪಷ್ಟವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: διὰ τοῦτο
  choice: ಆದ್ದರಿಂದ
  rationale: ಈ ನುಡಿಗಟ್ಟು ಹಿಂದಿನ ಪ್ರಶ್ನೆಯಿಂದ ಬರುವ ತೀರ್ಮಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆದ್ದರಿಂದ’ ಅದರ ನಿರ್ಣಯಾತ್ಮಕ ಬಲವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: ಅವರೇ ನಿಮಗೆ ನ್ಯಾಯಾಧೀಶರಾಗುವರು
  rationale: ಮೂಲದಲ್ಲಿರುವ ನಾಮಪದೀಯ ರಚನೆ ಮತ್ತು ಭವಿಷ್ಯಕಾಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಒತ್ತಿಹೇಳುವ αὐτοίಗೆ ‘ಅವರೇ’ ಸೂಕ್ತವಾಗಿದೆ; ‘ನಿಮಗೆ ನ್ಯಾಯಾಧೀಶರು’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಅವರ ನಡೆ ಕೇಳುಗರ ಆರೋಪವನ್ನು ಖಂಡಿಸುತ್ತದೆ ಎಂಬ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
theological_decisions:
- issue: Βεελζεβούλ ಎಂಬ ಹೆಸರಿನ ರೂಪ ಮತ್ತು ಗುರುತು
  choice: ಬೆಲ್ಜೆಬೂಲ್
  alternative: ಬೆಲ್ಜೆಬೂಬ್
  rationale: ಒದಗಿಸಿದ SBLGNT ಮೂಲದಲ್ಲಿರುವ Βεελζεβούλ ರೂಪವನ್ನು ಲಿಪ್ಯಂತರಿಸಿ ‘ಬೆಲ್ಜೆಬೂಲ್’ ಎಂದು ಬಳಸಲಾಗಿದೆ. ಹೆಚ್ಚು ಪರಿಚಿತವಾದ ಪರ್ಯಾಯ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ; ಇದು ಪಾಠರೂಪ ಮತ್ತು ಹೆಸರಿನ ಲಿಪ್ಯಂತರದ ನಿರ್ಧಾರವೇ ಹೊರತು ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವಲ್ಲ.
- issue: οἱ υἱοὶ ὑμῶν ಯಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ
  choice: ನಿಮ್ಮ ಮಕ್ಕಳು
  alternative: ನಿಮ್ಮ ಜನರು / ನಿಮ್ಮ ಶಿಷ್ಯರು
  rationale: ಈ ಪದವು ಕೇಳುಗರ ಗುಂಪಿನ ಭೂತೋಚ್ಚಾಟಕರನ್ನು ಸೂಚಿಸಬಹುದು. ಆದರೆ ಮೂಲದಲ್ಲಿರುವ ಬಂಧುತ್ವ ಪದವನ್ನು ನಿರ್ದಿಷ್ಟ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಉಳಿಸುವುದರಿಂದ ಅದರ ನಿಜವಾದ ವ್ಯಾಪ್ತಿ ಮತ್ತು ವಾಕ್ಚಾತುರ್ಯದ ಒತ್ತಡ ಉಳಿಯುತ್ತವೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯದ ವಾದಾತ್ಮಕ ಪ್ರಶ್ನೆ ಮತ್ತು ಕೊನೆಯ ತೀರ್ಪಿನ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪಂಥೀಯ ಪದಪ್ರಯೋಗ ಅಥವಾ ಅತಿವ್ಯಾಖ್ಯಾನವನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
