review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional argument, the instrumental force of ἐν, the ambiguity of ‘your sons,’ and the future judicial conclusion. However, ‘ನಿಮಗೆ ನ್ಯಾಯಾಧೀಶರಾಗುವರು’ can mean ‘will become judges for you,’ rather than ‘will be your judges.’ ‘ನಿಮ್ಮ ನ್ಯಾಯಾಧೀಶರಾಗುವರು’ directly represents ὑμῶν. ‘ಹೊರಹಾಕು’ conveys the expulsive force of ἐκβάλλω more clearly than ‘ಹೊರಡಿಸು.’
  naturalness: The revised wording is fluent, modern standard Kannada and retains the rhetorical question and conclusion. ‘ಬೇಲ್ಜೆಬೂಲ್’ more transparently reflects the initial long vowel of the Greek-form transliteration.
  terminology: ‘ದೆವ್ವಗಳು’ is a suitable common-language rendering of δαιμόνια in this context. The footnote should specify that the alternative spelling occurs in many English translations, as in the audit trail, rather than broadly saying merely ‘some translations.’
  issues:
  - severity: medium
    issue: ‘ನಿಮಗೆ ನ್ಯಾಯಾಧೀಶರಾಗುವರು’ does not clearly express possession/genitive ‘your judges.’
    rationale: The Greek ὑμῶν modifies κριταί. In Kannada, ‘ನಿಮ್ಮ ನ್ಯಾಯಾಧೀಶರಾಗುವರು’ directly conveys that they will be the hearers’ judges.
  - severity: low
    issue: ‘ಹೊರಡಿಸುತ್ತೇನೆ’ is less explicit about forcible expulsion.
    rationale: Although understandable transitively, ‘ಹೊರಹಾಕುತ್ತೇನೆ’ is the more natural and precise Kannada expression for casting out demons (ἐκβάλλω).
  - severity: low
    issue: The footnote understates and does not identify the language tradition of the alternative form.
    rationale: The English audit trail says that many English translations have ‘Beelzebub’; the Kannada footnote should preserve that limited, specific claim.
  revised_text: ನಾನು ಬೇಲ್ಜೆಬೂಲನ ಶಕ್ತಿಯಿಂದ ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತೇನೆಂದಾದರೆ, ನಿಮ್ಮ ಮಕ್ಕಳು ಯಾರ ಶಕ್ತಿಯಿಂದ ಅವುಗಳನ್ನು ಹೊರಹಾಕುತ್ತಾರೆ? ಆದ್ದರಿಂದ ಅವರೇ ನಿಮ್ಮ ನ್ಯಾಯಾಧೀಶರಾಗುವರು.
