id: MAT.12.44
reference: Matthew 12:44
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: kn
  text: ಆಗ ಅದು, “ನಾನು ಹೊರಬಂದ ನನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗುವೆನು” ಎಂದು ಹೇಳುತ್ತದೆ. ಅದು ಬಂದಾಗ, ಮನೆಯನ್ನು ಖಾಲಿಯಾಗಿ[a], ಗುಡಿಸಿ, ಅಚ್ಚುಕಟ್ಟಾಗಿ ಇಟ್ಟಿರುವುದನ್ನು[b] ಕಾಣುತ್ತದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಬಳಕೆಯಿಲ್ಲದೆ.”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಅಲಂಕರಿಸಿರುವುದನ್ನು” ಅಥವಾ “ಅಲಂಕರಿಸಲ್ಪಟ್ಟಿರುವುದನ್ನು.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಕ್ರಿಯೆಯನ್ನು ಪರಿಚಯಿಸುವ ಕಾಲಸೂಚಕ ಕ್ರಿಯಾವಿಶೇಷಣಕ್ಕೆ ಸಹಜವಾದ ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡ ರೂಪ.
- source_word: λέγει
  choice: ಅದು … ಎಂದು ಹೇಳುತ್ತದೆ
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಅಶುದ್ಧಾತ್ಮವೇ ಕರ್ತೃ. ಮೂಲದ ಸಜೀವ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಿ, ಆತ್ಮವನ್ನು ಸೂಚಿಸಲು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ಅದು’ ಬಳಸಲಾಗಿದೆ.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: ಆ ನನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗುವೆನು
  rationale: ἐπιστρέφω ಎಂಬುದರ ‘ಹಿಂದಿರುಗು’ ಅರ್ಥವನ್ನೂ, ಆತ್ಮವು ಮನೆಯನ್ನು ‘ನನ್ನ ಮನೆ’ ಎಂದು ಹೇಳುವ ಸ್ವಾಮ್ಯಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὅθεν ἐξῆλθον
  choice: ಯಾವ ಮನೆಯಿಂದ ಹೊರಬಂದೆನೋ
  rationale: ὅθεν ಮತ್ತು ἐξῆλθονಗಳ ಸ್ಥಳ ಹಾಗೂ ಹೊರಬರುವಿಕೆಯ ಚಿತ್ರಣವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ಸಂಬಂಧವಾಕ್ಯ.
- source_word: ἐλθὸν
  choice: ಅದು ಅಲ್ಲಿಗೆ ಬಂದಾಗ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಏಒರಿಸ್ಟ್ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಕಾಲವಾಚಕ ಉಪವಾಕ್ಯವಾಗಿ ನೀಡಲಾಗಿದೆ.
- source_word: εὑρίσκει
  choice: ಕಾಣುತ್ತದೆ
  rationale: ಸಜೀವ ನಿರೂಪಣೆಯ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸುವ ಸರಳ, ಸಹಜ ಸಮಾನಾರ್ಥಕ.
- source_word: σχολάζοντα
  choice: ವಾಸಿಗರಿಲ್ಲದೆ
  rationale: ಮನೆ ಖಾಲಿ ಅಥವಾ ಯಾರೂ ವಾಸಿಸದ ಸ್ಥಿತಿಯಲ್ಲಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಖಾಲಿಯಾಗಿ’ ಎಂಬ ಪರ್ಯಾಯಕ್ಕಿಂತ ಲಭ್ಯ/ಅಧಿವಾಸವಿಲ್ಲದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ, ಆದರೆ ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: σεσαρωμένον
  choice: ಗುಡಿಸಿ
  rationale: σαρόω ಎಂಬ ಕ್ರಿಯೆಯ ಪೂರ್ಣಗೊಂಡ ನಿಷ್ಕ್ರಿಯ ಸ್ಥಿತಿಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κεκοσμημένον
  choice: ಅಚ್ಚುಕಟ್ಟಾಗಿ ಇಟ್ಟಿರುವುದನ್ನು
  rationale: κοσμέω ಎಂಬುದರ ‘ಕ್ರಮವಾಗಿ ಜೋಡಿಸು/ಸುವ್ಯವಸ್ಥಿತಗೊಳಿಸು’ ಅರ್ಥವನ್ನು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ನೀಡುತ್ತದೆ; ‘ಅಲಂಕರಿಸು’ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಹಿಂದಿರುಗುವ ಅಶುದ್ಧಾತ್ಮದ ಮಾತಿನಲ್ಲಿರುವ ‘ಮನೆ’ ಎಂಬ ರೂಪಕ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಮನೆ’ ಎಂಬ ಚಿತ್ರಣವನ್ನೇ ಉಳಿಸಲಾಗಿದೆ; ಅದನ್ನು ‘ವ್ಯಕ್ತಿ’ ಅಥವಾ ‘ಜೀವನ’ ಎಂದು ವಿವರಿಸಿ ಅನುವಾದಿಸಿಲ್ಲ.
  alternative: ನಾನು ಬಿಟ್ಟುಬಂದ ವ್ಯಕ್ತಿಯ ಬಳಿಗೆ ಹಿಂದಿರುಗುವೆನು
  rationale: ಸಂದರ್ಭವು ರೂಪಕದ ಉದ್ದೇಶವನ್ನು ತಿಳಿಸಿದರೂ, ಈ ವಚನವು οἶκος (‘ಮನೆ’) ಎಂದೇ ಹೇಳುತ್ತದೆ. ಮೂಲದ ವಾಗ್ಚಿತ್ರ ಮತ್ತು ಅದರ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಉಳಿಸಲು ಅದನ್ನು ನೇರವಾಗಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ನಿರೂಪಣೆ. ಮೂಲದ ಸಜೀವ ವರ್ತಮಾನಕಾಲ, ಮನೆಯ ರೂಪಕ ಮತ್ತು ಮೂರು ಸ್ಥಿತಿವಾಚಕ ಅಭಿವ್ಯಕ್ತಿಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಅವು ಸಂಬಂಧಿಸುವ ಪದಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
