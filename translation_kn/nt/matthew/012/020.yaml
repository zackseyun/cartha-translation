id: MAT.12.20
reference: Matthew 12:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: kn
  text: ಜಜ್ಜಲ್ಪಟ್ಟ ಜೊಂಡನ್ನು ಆತನು ಮುರಿಯುವುದಿಲ್ಲ; ಹೊಗೆಯಾಡುತ್ತಿರುವ ಬತ್ತಿಯನ್ನು[a] ಆತನು ಆರಿಸುವುದಿಲ್ಲ—ನ್ಯಾಯವನ್ನು ಜಯಕ್ಕೆ ತರುವ ತನಕ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹೊಗೆಯಾಡುವ ಅಗಸೆ ನಾರನ್ನು ಆತನು ನಂದಿಸುವುದಿಲ್ಲ.’ ಗ್ರೀಕ್ ಪದವು ಅಕ್ಷರಶಃ ದೀಪದ ಬತ್ತಿಯಾಗಿ ಬಳಸುತ್ತಿದ್ದ ಅಗಸೆ ನಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ತೀರ್ಪನ್ನು ಜಯಕ್ಕೆ ತರುವ ತನಕ.’
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: ಜಜ್ಜಿಹೋದ ದಂಟು
  rationale: κάλαμος ಎಂದರೆ ಜೊಂಡಿನಂಥ ದಂಟು; συντετριμμένον ಅದು ಜಜ್ಜಿ ಹಾನಿಗೊಂಡಿದ್ದರೂ ಇನ್ನೂ ಸಂಪೂರ್ಣವಾಗಿ ಮುರಿದಿಲ್ಲವೆಂಬ ಚಿತ್ರವನ್ನು ನೀಡುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಜಜ್ಜಿಹೋದ ದಂಟು’ ಮುಂದಿನ ‘ಮುರಿಯುವುದಿಲ್ಲ’ ಎಂಬ ಕ್ರಿಯೆಯೊಡನೆ ಸಹಜವಾಗಿ ಹೊಂದುತ್ತದೆ.
- source_word: οὐ κατεάξει
  choice: ಮುರಿಯುವುದಿಲ್ಲ
  rationale: κατάγνυμι ಎಂಬುದು ಮುರಿಯುವುದು ಅಥವಾ ತುಂಡಾಗಿಸುವುದು. ಸರಳ ಭವಿಷ್ಯಾರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: λίνον τυφόμενον
  choice: ಹೊಗೆಯಾಡುತ್ತಿರುವ ಬತ್ತಿ
  rationale: λίνον ಅಕ್ಷರಶಃ ನಾರು/ಅಗಸೆ ನಾರನ್ನು ಸೂಚಿಸಿದರೂ ಇಲ್ಲಿ ಎಣ್ಣೆದೀಪದ ಬತ್ತಿಯಾಗಿದೆ; τυφόμενον ಆರಿಹೋಗುವ ಹಂತದಲ್ಲಿ ಹೊಗೆ ಬಿಡುತ್ತಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: οὐ σβέσει
  choice: ಆರಿಸುವುದಿಲ್ಲ
  rationale: σβέννυμι ಎಂದರೆ ಬೆಂಕಿ ಅಥವಾ ದೀಪವನ್ನು ಆರಿಸುವುದು. ಬತ್ತಿಯ ಸಂದರ್ಭದಲ್ಲಿ ‘ಆರಿಸುವುದು’ ನೇರವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: ἕως ἂν
  choice: ತನಕ
  rationale: ಮುಂದೆ ಸಂಭವಿಸಲಿರುವ ಗುರಿಬಿಂದುವಿನವರೆಗೆ ಎಂಬ ಕಾಲಾರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: ಜಯಕ್ಕೆ ತರುವ
  rationale: ἐκβάλλω ಇಲ್ಲಿ ಹೊರಗೆ ತರುವುದು/ಸಾಧಿಸುವುದು ಎಂಬ ಫಲಪ್ರದ ಕ್ರಿಯೆಯನ್ನು, εἰς νῖκος ಜಯಕರ ಅಂತ್ಯವನ್ನು ಸೂಚಿಸುತ್ತವೆ. ‘ಜಯಕ್ಕೆ ತರುವುದು’ ಮೂಲದ ಗುರಿಮುಖ ಚಲನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὴν κρίσιν
  choice: ನ್ಯಾಯ
  rationale: ಯೆಶಾಯನ ಸೇವಕನ ಹಿನ್ನೆಲೆಯಲ್ಲಿನ κρίσις ಕೇವಲ ತೀರ್ಪಿನ ಘೋಷಣೆಯಲ್ಲದೆ ನ್ಯಾಯಯುತ ವ್ಯವಸ್ಥೆಯ ಸ್ಥಾಪನೆಯನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು. ಆ ವಿಶಾಲ ಅರ್ಥಕ್ಕೆ ‘ನ್ಯಾಯ’ ಸೂಕ್ತ; ‘ತೀರ್ಪು’ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೆಶಾಯನ ಸೇವಕನ ಉಲ್ಲೇಖದಲ್ಲಿ κρίσις ಪದದ ಅನುವಾದ
  choice: ನ್ಯಾಯ
  alternative: ತೀರ್ಪು
  rationale: ಸೇವಕನು ದೇವರ ನ್ಯಾಯಯುತ ಉದ್ದೇಶವನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಸ್ಥಾಪಿಸುವ ಚಿತ್ರಣ ಇಲ್ಲಿದೆ. ‘ನ್ಯಾಯ’ ಅದರ ವಿಶಾಲ ಪ್ರವಾದನಾತ್ಮಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಆದರೆ ಮೂಲಪದದ ನ್ಯಾಯಾಂಗ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ‘ತೀರ್ಪು’ ಎಂಬ ಪರ್ಯಾಯದಿಂದ ಸೂಚಿಸಲಾಗಿದೆ.
- issue: ದೀಪದ ರೂಪಕದಲ್ಲಿ ಅಕ್ಷರಶಃ ನಾರು ಅಥವಾ ಉದ್ದೇಶಿತ ವಸ್ತುವಾದ ಬತ್ತಿ
  choice: ಬತ್ತಿ ... ಆರಿಸುವುದಿಲ್ಲ
  alternative: ಹೊಗೆಯಾಡುವ ಅಗಸೆ ನಾರನ್ನು ನಂದಿಸುವುದಿಲ್ಲ
  rationale: ಗ್ರೀಕ್‌ನ λίνον ಅಕ್ಷರಶಃ ಅಗಸೆ ನಾರಾದರೂ ದೀಪದಲ್ಲಿ ಬಳಸುವ ಬತ್ತಿಯನ್ನೇ ಇಲ್ಲಿ ಉದ್ದೇಶಿಸಿದೆ. ಆಧುನಿಕ ಓದುಗರಿಗೆ ಚಿತ್ರ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಬತ್ತಿ’ ಬಳಸಿದ್ದು, ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಪ್ರವಾದನಾತ್ಮಕ ಶೈಲಿ. ರೂಪಕಗಳನ್ನು ಉಳಿಸಿಕೊಂಡು, ದೀಪದ ಚಿತ್ರವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಗೊಳಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದ ಎರಡೂ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಪದಗುಚ್ಛಗಳ ಬಳಿಕವೇ ಇವೆ.
