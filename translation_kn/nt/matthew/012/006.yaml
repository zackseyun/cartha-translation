id: MAT.12.6
reference: Matthew 12:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: kn
  text: 'ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ: ದೇವಾಲಯಕ್ಕಿಂತ ಮಹತ್ತಾದುದು ಇಲ್ಲಿ ಇದೆ.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ದೇವಾಲಯಕ್ಕಿಂತ ಮಹಾನ್ ವ್ಯಕ್ತಿಯೊಬ್ಬನು ಇಲ್ಲಿ ಇದ್ದಾನೆ’ ಅಥವಾ ‘ದೇವಾಲಯಕ್ಕಿಂತ ಮಹಾನ್ ವ್ಯಕ್ತಿ ಇಲ್ಲಿ ಇದ್ದಾನೆ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಮಹತ್ತಾದುದು’ ಎಂಬ ನಪುಂಸಕಲಿಂಗದ ರೂಪವಿದ್ದು, ಅದು ಯಾರನ್ನು ಅಥವಾ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
    reason: alternative_reading
  - marker: b
    text: ಅಥವಾ, ‘ಈ ಸ್ಥಳದಲ್ಲಿ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δέ ಹಿಂದಿನ ವಾದದೊಂದಿಗೆ ಸೌಮ್ಯವಾದ ವೈರುಧ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; λέγω ὑμῖν ಎಂಬ ನೇರ ಸಂಬೋಧನೆಯ ಸಹಜ ಕನ್ನಡ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ὅτι
  choice: ಹೇಳುವುದೇನೆಂದರೆ
  rationale: ὅτι ಯೇಸುವಿನ ಮಾತಿನ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಈ ಸಂಯುಕ್ತ ರೂಪ ವಾಕ್ಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: τοῦ ἱεροῦ
  choice: ದೇವಾಲಯಕ್ಕಿಂತ
  rationale: ἱερόν ಸಾಮಾನ್ಯವಾಗಿ ಒಳಗಿನ ಪವಿತ್ರಸ್ಥಳವೊಂದನ್ನೇ ಅಲ್ಲ, ದೇವಾಲಯದ ಸಮಗ್ರ ಆವರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ದೇವಾಲಯ’ ಆ ಅರ್ಥಕ್ಕೆ ಸಹಜವಾದ ಕನ್ನಡ ಪದ.
- source_word: μεῖζόν
  choice: ದೊಡ್ಡದು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇದು ನಪುಂಸಕಲಿಂಗ ಏಕವಚನದ ಸ್ವತಂತ್ರ ತುಲನಾತ್ಮಕ ರೂಪ. ‘ದೊಡ್ಡದು’ ಎಂದರೆ ಅದರ ಸೂಚ್ಯವಸ್ತುವನ್ನು ವ್ಯಕ್ತಿ ಅಥವಾ ವಸ್ತು ಎಂದು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಮೂಲದ ರೂಪಾತ್ಮಕ ಅನಿಶ್ಚಿತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐστιν
  choice: ಇದೆ
  rationale: ಸರಳ ವರ್ತಮಾನಕಾಲದ ಅಸ್ತಿತ್ವಸೂಚಕ ಕ್ರಿಯಾಪದಕ್ಕೆ ಸಹಜವಾದ ಕನ್ನಡ ರೂಪ.
- source_word: ὧδε
  choice: ಇಲ್ಲಿ
  rationale: ಸ್ಥಳಸೂಚಕ ಕ್ರಿಯಾವಿಶೇಷಣದ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಅನುವಾದ; ‘ಈ ಸ್ಥಳದಲ್ಲಿ’ ಎಂಬ ಪರ್ಯಾಯವನ್ನೂ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ನಪುಂಸಕಲಿಂಗದ μεῖζόν ಸೂಚಿಸುವುದು ಯಾರು ಅಥವಾ ಏನು ಎಂಬುದು ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿಲ್ಲ
  choice: ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ‘ದೊಡ್ಡದು’ ಎಂದು ನಪುಂಸಕ ಮತ್ತು ಅನಿರ್ದಿಷ್ಟ ರೂಪವನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ದೊಡ್ಡವನೊಬ್ಬನು’ ಅಥವಾ ‘ದೊಡ್ಡ ವ್ಯಕ್ತಿ’ ಎಂದು ಯೇಸುವನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಿಸೂಚಕವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು
  rationale: ಸಂದರ್ಭವು ಯೇಸು ಮತ್ತು ಅವರ ಅಧಿಕಾರದ ಕಡೆಗೆ ಬಲವಾಗಿ ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್ ಪದವು ಪುಲ್ಲಿಂಗದಲ್ಲಿಲ್ಲ. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಾಠವು ಸೂಚ್ಯವಸ್ತುವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮತ್ತು ಅನಿಶ್ಚಿತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ದೊಡ್ಡದು’ ಎಂಬ ರೂಪವು ಕನ್ನಡದಲ್ಲಿ ಸ್ವಲ್ಪ ಗಂಭೀರವಾಗಿ ಕೇಳಿಸಿದರೂ, ಮೂಲ ಗ್ರೀಕ್‌ನ ನಪುಂಸಕ ಅನಿಶ್ಚಿತತೆಯನ್ನು ನಿಷ್ಠೆಯಿಂದ ಕಾಪಾಡುತ್ತದೆ; ಪರ್ಯಾಯ ವ್ಯಕ್ತಿಸೂಚಕ ಓದುಗಳನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
