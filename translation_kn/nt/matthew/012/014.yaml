source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: kn
  text: ಆದರೆ ಫರಿಸಾಯರು ಹೊರಗೆ ಹೋಗಿ, ಅವನನ್ನು ಹೇಗೆ ನಾಶಮಾಡಬೇಕೆಂದು[a] ಅವನ ವಿರುದ್ಧ ಸಂಚು ಹೂಡಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಅವನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು” ಅಥವಾ “ಅವನನ್ನು ಮರಣಕ್ಕೀಡುಮಾಡಬೇಕೆಂದು.” ಗ್ರೀಕ್‌ನಲ್ಲಿ “ನಾಶಮಾಡು” ಎಂದಿದ್ದು, ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅದು ಪ್ರಾಣ ತೆಗೆಯುವ ಉದ್ದೇಶವನ್ನೂ ಒಳಗೊಂಡಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: ಹೊರಗೆ ಹೋಗಿ
  rationale: ಈ ಭೂತಕಾಲದ ಕೃದಂತವು ಮುಂದಿನ ಕ್ರಿಯೆಗೆ ಮುಂಚೆ ನಡೆದ ನಿರ್ಗಮನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಕ್ರಮವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಯೇಸುವಿನ ಹಿಂದಿನ ಕಾರ್ಯಕ್ಕೂ ಫರಿಸಾಯರ ವೈರಭಾವದ ಪ್ರತಿಕ್ರಿಯೆಗೂ ಇರುವ ಸೌಮ್ಯ ವಿರೋಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: οἱ Φαρισαῖοι
  choice: ಫರಿಸಾಯರು
  rationale: ಯೆಹೂದ್ಯ ಧಾರ್ಮಿಕ ಗುಂಪಿನ ಹೆಸರಿನ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ಲಿಪ್ಯಂತರ.
- source_word: συμβούλιον ἔλαβον
  choice: ಸಂಚು ಹೂಡಿದರು
  rationale: ಪದಶಃ ‘ಸಮಾಲೋಚನೆ ನಡೆಸಿದರು’ ಎಂಬ ನುಡಿಗಟ್ಟು; ಮುಂದಿನ ಉದ್ದೇಶವಾಕ್ಯದಿಂದ ಸ್ಪಷ್ಟವಾಗುವ ವೈರಭಾವದ ಗುಪ್ತ ಯೋಜನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κατ’ αὐτοῦ
  choice: ಅವನ ವಿರುದ್ಧ
  rationale: κατά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಇಲ್ಲಿ ವಿರೋಧಾರ್ಥಕವಾಗಿದ್ದು, ಅವರ ವೈರಭಾವವನ್ನು ನೇರವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: ὅπως
  choice: ಹೇಗೆ … ಬೇಕೆಂದು
  rationale: ಅವರ ಸಂಚಿನ ವಿಷಯ ಅಥವಾ ಉದ್ದೇಶವನ್ನು, ಜೊತೆಗೆ ಅದನ್ನು ಸಾಧಿಸುವ ಮಾರ್ಗದ ಕುರಿತು ನಡೆದ ಆಲೋಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπολέσωσιν
  choice: ನಾಶಮಾಡಬೇಕೆಂದು
  rationale: ἀπόλλυμι ಎಂಬ ಕ್ರಿಯಾಪದದ ವಿಶಾಲವಾದ ‘ನಾಶಮಾಡು’ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭವು ಪ್ರಾಣಾಂತಿಕ ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸಿದರೂ ಮುಖ್ಯಪಾಠದಲ್ಲಿ ಅದನ್ನು ‘ಕೊಲ್ಲು’ ಎಂದು ಅನಗತ್ಯವಾಗಿ ಸಂಕುಚಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ἀπολέσωσιν ಎಂಬ ಪದದ ಅರ್ಥವನ್ನು ಎಷ್ಟು ನಿರ್ದಿಷ್ಟವಾಗಿ ಅನುವಾದಿಸಬೇಕು
  choice: ನಾಶಮಾಡಬೇಕೆಂದು
  alternative: ಕೊಲ್ಲಬೇಕೆಂದು; ಮರಣಕ್ಕೀಡುಮಾಡಬೇಕೆಂದು
  rationale: ಸಂದರ್ಭವು ಯೇಸುವನ್ನು ಕೊಲ್ಲುವ ಉದ್ದೇಶವನ್ನು ಬಲವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಆದರೂ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸ್ಪಷ್ಟವಾಗಿ ‘ಕೊಲ್ಲು’ ಎನ್ನುವುದಕ್ಕಿಂತ ವಿಶಾಲವಾಗಿದೆ. ಆದ್ದರಿಂದ ಮುಖ್ಯಪಾಠವು ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಿ, ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾದ ಅರ್ಥಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗಂಭೀರ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಸಂಚು ಹೂಡಿದರು’ ಎಂಬುದು ವೈರಭಾವದ ಸಮಾಲೋಚನೆಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ನಾಶಮಾಡಬೇಕೆಂದು’ ಮೂಲಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
