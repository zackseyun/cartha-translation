id: MAT.12.25
reference: Matthew 12:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: kn
  text: 'ಆದರೆ, ಅವರ ಆಲೋಚನೆಗಳನ್ನು[a] ತಿಳಿದ ಯೇಸು ಅವರಿಗೆ ಹೀಗೆ ಹೇಳಿದನು: “ತನ್ನ ವಿರುದ್ಧ ತಾನೇ ವಿಭಜನೆಗೊಂಡ ಪ್ರತಿಯೊಂದು ರಾಜ್ಯವೂ ಹಾಳಾಗುತ್ತದೆ[b]; ತನ್ನ ವಿರುದ್ಧ ತಾನೇ ವಿಭಜನೆಗೊಂಡ ಪ್ರತಿಯೊಂದು ನಗರವಾಗಲಿ ಮನೆಯಾಗಲಿ[c] ನಿಲ್ಲಲಾರದು.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ತರ್ಕಗಳನ್ನು’ ಅಥವಾ ‘ಉದ್ದೇಶಗಳನ್ನು’.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ನಿರ್ಜನವಾಗುತ್ತದೆ’ ಅಥವಾ ‘ನಾಶಕ್ಕೆ ಒಳಗಾಗುತ್ತದೆ’.
    reason: lexical_alternative
  - marker: c
    text: ಇಲ್ಲಿ ‘ಮನೆ’ ಎಂಬುದು ‘ಮನೆಯವರು’ ಅಥವಾ ‘ಕುಟುಂಬ’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಹೊಂದಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ತಿಳಿದಿದ್ದ
  rationale: ಈ ಕೃದಂತವು ಮಾನಸಿಕ ಅರಿವು ಅಥವಾ ತಿಳಿವಳಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಯೇಸು ಅದನ್ನು ಹೇಗೆ ತಿಳಿದನು ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ, ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗಿನ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: δέ ಇಲ್ಲಿ ಸೌಮ್ಯವಾದ ತಿರುವು ಅಥವಾ ವಿರೋಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಂದರ್ಭದ ವಾದಾತ್ಮಕ ತಿರುವಿಗೆ ‘ಆದರೆ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: ἐνθυμήσεις
  choice: ಆಲೋಚನೆಗಳನ್ನು
  rationale: ಈ ಪದವು ಮನಸ್ಸಿನ ಆಲೋಚನೆಗಳು, ತರ್ಕಗಳು ಅಥವಾ ಉದ್ದೇಶಗಳನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಆಲೋಚನೆಗಳು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದ್ದು ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಕಿರಿದಾಗಿಸುವುದಿಲ್ಲ.
- source_word: Πᾶσα βασιλεία
  choice: ಪ್ರತಿಯೊಂದು ರಾಜ್ಯವೂ
  rationale: ಏಕವಚನ ನಾಮಪದದೊಂದಿಗೆ πᾶσα ಗಾದೆಯಂತಹ ಸಾರ್ವತ್ರಿಕ ತತ್ತ್ವವನ್ನು ಹೇಳುತ್ತದೆ; ‘ಪ್ರತಿಯೊಂದು ರಾಜ್ಯವೂ’ ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: ತನ್ನ ವಿರುದ್ಧ ತಾನೇ ವಿಭಜನೆಗೊಂಡ
  rationale: ಈ ರೂಪವು ಕೇವಲ ಆಂತರಿಕ ಭೇದವನ್ನಲ್ಲ, ಸ್ವತಃ ತನ್ನ ವಿರುದ್ಧವಾದ ವಿಭಾಗವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಈ ರಚನೆ ಅದರ ವಿರೋಧಾತ್ಮಕ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐρημοῦται
  choice: ಹಾಳಾಗುತ್ತದೆ
  rationale: ಕ್ರಿಯಾಪದವು ನಿರ್ಜನವಾಗುವುದು ಅಥವಾ ನಾಶದ ಸ್ಥಿತಿಗೆ ಬರುವುದು ಎಂಬ ತೀವ್ರ ಫಲಿತಾಂಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹಾಳಾಗುತ್ತದೆ’ ಆ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: πόλις ἢ οἰκία
  choice: ಪಟ್ಟಣವಾಗಲಿ ಮನೆಯವಾಗಲಿ
  rationale: πόλιςಗೆ ‘ಪಟ್ಟಣ’ ಸಹಜವಾಗಿದೆ. οἰκία ಮನೆ ಅಥವಾ ಮನೆಯವರ ಸಮುದಾಯ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಮನೆ’ ಉಳಿಸಿ, ವಿಶಾಲ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: οὐ σταθήσεται
  choice: ನಿಲ್ಲಲಾರದು
  rationale: ಇದು ಸ್ಥಿರವಾಗಿ ಉಳಿಯದಿರುವುದು ಅಥವಾ ತಾಳಿಕೊಳ್ಳದಿರುವುದನ್ನು ಸೂಚಿಸುವ ನುಡಿಗಟ್ಟು. ‘ನಿಲ್ಲಲಾರದು’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸು ಅವರ ಅಂತರಂಗದ ಆಲೋಚನೆಗಳನ್ನು ತಿಳಿದ ವಿಧಾನ
  choice: ಯೇಸು ಅವರ ಆಲೋಚನೆಗಳನ್ನು ತಿಳಿದಿದ್ದನು ಎಂದು ಮಾತ್ರ ಹೇಳಲಾಗಿದೆ; ತಿಳಿದ ವಿಧಾನವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ.
  alternative: ಅತೀಂದ್ರಿಯ ಸರ್ವಜ್ಞಾನದಿಂದ ತಿಳಿದನು ಅಥವಾ ಸಂದರ್ಭದಿಂದ ಗ್ರಹಿಸಿದನು ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಆತನಿಗೆ ತಿಳಿದಿತ್ತು ಎಂಬ ಸಂಗತಿಯನ್ನು ಹೇಳುತ್ತದೆ, ಆದರೆ ಆ ಜ್ಞಾನದ ವಿಧಾನವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಭಾಷಾಂತರವು ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ, ಸ್ಪಷ್ಟ ಮತ್ತು ಗಾದೆಯಂತಿರುವ ವಾಕ್ಯರಚನೆಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ತನ್ನ ವಿರುದ್ಧ ತಾನೇ’ ಎಂಬ ಪುನರಾವರ್ತನೆ ಮೂಲದ ಆಂತರಿಕ ಸ್ವವಿರೋಧವನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿತ ಪದಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
