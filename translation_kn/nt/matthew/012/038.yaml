id: MAT.12.38
reference: Matthew 12:38
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: kn
  text: ಆಗ ಶಾಸ್ತ್ರಿಗಳ ಮತ್ತು ಫರಿಸಾಯರೊಳಗಿಂದ ಕೆಲವರು ಆತನಿಗೆ ಉತ್ತರವಾಗಿ, “ಗುರುವೇ, ನಿಮ್ಮಿಂದ ಒಂದು ಸೂಚನೆಯನ್ನು ನೋಡಲು ನಾವು ಬಯಸುತ್ತೇವೆ” ಎಂದು ಹೇಳಿದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಒಂದು ಅದ್ಭುತ ಸೂಚನೆಯನ್ನು.” ಗ್ರೀಕ್ ಪದವು ಅದ್ಭುತ ಮಹತ್ವವುಳ್ಳ ಸೂಚನೆಯನ್ನು ಸೂಚಿಸಬಹುದು; ಆದರೆ ಮುಖ್ಯ ಪಠ್ಯವು ಅದರ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ನಿರೂಪಣಾ ಕ್ರಮದಲ್ಲಿ ಪರಿಚಯಿಸುವ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ಪದ.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: ಆತನಿಗೆ ಉತ್ತರವಾಗಿ ... ಹೇಳಿದರು
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿ ನೇರ ಪ್ರಶ್ನೆ ಇಲ್ಲದಿದ್ದರೂ ಗ್ರೀಕ್‌ನ ‘ಉತ್ತರಿಸಿದರು/ಪ್ರತಿಕ್ರಿಯಿಸಿದರು’ ಎಂಬ ನಿರೂಪಣಾ ಪ್ರಯೋಗವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: ಶಾಸ್ತ್ರಿಗಳಲ್ಲಿಯೂ ಫರಿಸಾಯರಲ್ಲಿಯೂ ಕೆಲವರು
  rationale: ಎಲ್ಲರನ್ನೂ ಅಲ್ಲ, ಎರಡೂ ಗುಂಪುಗಳಿಗೆ ಸೇರಿದ ಕೆಲವರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಶಾಸ್ತ್ರಿಗಳು’ ಮತ್ತು ‘ಫರಿಸಾಯರು’ ಸುವಾರ್ತೆಗಳ ಪರಿಚಿತ ಗುಂಪುಹೆಸರುಗಳು.
- source_word: λέγοντες
  choice: ಎಂದು ಹೇಳಿದರು
  rationale: ನೇರ ಮಾತನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Διδάσκαλε
  choice: ಬೋಧಕರೇ
  rationale: ಯೇಸುವಿಗೆ ಬಳಸಿದ ಸಂಬೋಧನೆಯನ್ನು ‘ಗುರುವೇ’ಗಿಂತ ನಿರ್ದಿಷ್ಟವಾಗಿ ಬೋಧಿಸುವವನ ಅರ್ಥದಲ್ಲಿ ನೀಡುತ್ತದೆ; ‘ಯಜಮಾನ’ ಎಂಬ ಹೆಚ್ಚುವರಿ ಅಧಿಕಾರಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: θέλομεν
  choice: ನಾವು ಬಯಸುತ್ತೇವೆ
  rationale: ಇಚ್ಛೆ ಅಥವಾ ಉದ್ದೇಶವನ್ನು ಗೌರವಪೂರ್ಣವಾದ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ σοῦ
  choice: ನಿಮ್ಮಿಂದ
  rationale: ಗುರುತಿನ ಮೂಲ ಯೇಸು ಎಂಬುದನ್ನು ಸೂಚಿಸುವ ἀπό + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: σημεῖον
  choice: ಸೂಚಕಕಾರ್ಯ
  rationale: ಇಲ್ಲಿ ಕೇಳಲಾಗಿರುವುದು ಯೇಸುವಿನ ಅಧಿಕಾರವನ್ನು ಸೂಚಿಸುವ ಗೋಚರ ಕ್ರಿಯೆ; ‘ಸೂಚಕಕಾರ್ಯ’ವು ಕೇವಲ ಗುರುತು ಎಂಬ ಅರ್ಥಕ್ಕಿಂತ ಸಂದರ್ಭದ ಕ್ರಿಯಾತ್ಮಕ ಅಂಶವನ್ನು ತೋರಿಸುತ್ತದೆ, ಆದರೆ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ‘ಅದ್ಭುತ’ ಎಂದು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ἰδεῖν
  choice: ನೋಡಲು
  rationale: ὁράω ಕ್ರಿಯಾಪದದ ಸರಳ ದೃಷ್ಟಿಗೋಚರ ಅರ್ಥವನ್ನು ಅನಗತ್ಯ ವ್ಯಾಖ್ಯಾನವಿಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಈ ಸಂದರ್ಭದಲ್ಲಿ σημεῖον ಪದದ ಸ್ವರೂಪ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸೂಚಕಕಾರ್ಯ’
  alternative: ‘ಅದ್ಭುತ ಸೂಚಕಕಾರ್ಯ’ ಅಥವಾ ‘ಅದ್ಭುತ’
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಅವರು ಯೇಸುವಿನ ಅಧಿಕಾರವನ್ನು ದೃಢಪಡಿಸುವ ಅದ್ಭುತಕಾರ್ಯವನ್ನು ಕೇಳುತ್ತಿರುವ ಸಾಧ್ಯತೆ ಬಲವಾಗಿದೆ. ಆದರೂ ಗ್ರೀಕ್ ಪದವು ಸ್ವತಃ ‘ಸೂಚನೆ/ಗುರುತು’ ಎಂಬ ವಿಶಾಲ ಅರ್ಥ ಹೊಂದಿರುವುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಅದ್ಭುತ’ವನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ, ನಿರೂಪಣಾತ್ಮಕ ಶೈಲಿ. ‘ಆತನಿಗೆ’ ಎಂಬುದು ಬೈಬಲ್ ಗದ್ಯದಲ್ಲಿ ಪರಿಚಿತವಾದರೂ ಸ್ಪಷ್ಟ; ನೇರ ಮಾತಿನಲ್ಲಿ ಗೌರವ ಸೂಚಿಸಲು ‘ನಿಮ್ಮಿಂದ’ ಬಳಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
