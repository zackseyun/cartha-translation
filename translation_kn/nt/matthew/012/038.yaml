  to: ಆಗ ಶಾಸ್ತ್ರಿಗಳ ಮತ್ತು ಫರಿಸಾಯರೊಳಗಿಂದ ಕೆಲವರು ಆತನಿಗೆ ಉತ್ತರವಾಗಿ, “ಗುರುವೇ, ನಿಮ್ಮಿಂದ ಒಂದು ಸೂಚನೆಯನ್ನು ನೋಡಲು ನಾವು ಬಯಸುತ್ತೇವೆ” ಎಂದು ಹೇಳಿದರು.[a]
