  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: kn
  text: ಅವನು ಇನ್ನೂ ಜನಸಮೂಹಗಳಿಗೆ ಮಾತನಾಡುತ್ತಿದ್ದಾಗ, ಇಗೋ, ಅವನ ತಾಯಿಯೂ ಅವನ ಸಹೋದರರೂ[a] ಅವನಿಗೆ ಮಾತನಾಡಲು ಪ್ರಯತ್ನಿಸುತ್ತ ಹೊರಗೆ ನಿಂತಿದ್ದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವನ ಒಡಹುಟ್ಟಿದವರು’; ἀδελφοί ಎಂಬ ಗ್ರೀಕ್ ಪದವನ್ನು ವಿಶಾಲ ಅರ್ಥದಲ್ಲಿ ಸಮೀಪದ ಬಂಧುಗಳೆಂದು ಗ್ರಹಿಸಿದರೆ ಹಾಗೆಯೂ ಅರ್ಥೈಸಬಹುದು. ಇಲ್ಲಿ ಗ್ರೀಕ್ ಪದವು ಪುಲ್ಲಿಂಗ ಬಹುವಚನದಲ್ಲಿರುವುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸಹೋದರರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: ಅವನು ಇನ್ನೂ ... ಮಾತನಾಡುತ್ತಿದ್ದಾಗ
  rationale: ἔτι ongoing action ಅನ್ನು ಸೂಚಿಸುತ್ತದೆ; δέ ಸೌಮ್ಯವಾದ ಕಥನ ಸಂಕ್ರಮಣವಾಗಿದ್ದು ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದಿದ್ದರೂ ಕಾಲಸಂಬಂಧದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತವಾಗುತ್ತದೆ. Genitive absolute ಅನ್ನು ಸಮಕಾಲೀನ ಕ್ರಿಯೆ ಸೂಚಿಸುವ ‘ಮಾತನಾಡುತ್ತಿದ್ದಾಗ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: τοῖς ὄχλοις
  choice: ಜನಸಮೂಹಗಳಿಗೆ
  rationale: ὄχλοις ಬಹುವಚನವಾಗಿರುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿಯೂ ಬಹುವಚನ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಹೊಸ ಘಟನೆಯ ಕಡೆ ಗಮನ ಸೆಳೆಯುವ ἰδού ಪದದ ಜೀವಂತ ಕಥನಾತ್ಮಕ ಬಲವನ್ನು ‘ಇಗೋ’ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: ಅವನ ತಾಯಿಯೂ ಅವನ ಸಹೋದರರೂ
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ. ἀδελφοί ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾದುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸಹೋದರರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: εἱστήκεισαν ἔξω
  choice: ಹೊರಗೆ ನಿಂತಿದ್ದರು
  rationale: εἱστήκεισαν ಸೂಚಿಸುವ ಮುಂದುವರಿದ ಸ್ಥಿತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ನಿಂತಿದ್ದರು’ ಎಂದು, ἔξω ಅನ್ನು ಯಾವುದೇ ಸ್ಥಳವನ್ನು ಸೇರಿಸದೆ ‘ಹೊರಗೆ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: ಅವನೊಂದಿಗೆ ಮಾತನಾಡಲು ಬಯಸಿ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ζητέω ಉದ್ದೇಶ ಅಥವಾ ಬಯಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಬಯಸಿ’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, αὐτῷ λαλῆσαι ಅನ್ನು ‘ಅವನೊಂದಿಗೆ ಮಾತನಾಡಲು’ ಎಂದು ನಿರೂಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಕುಟುಂಬಕ್ಕೆ ಸಂಬಂಧಿಸಿ ἀδελφοί ಪದದ ಅನುವಾದ
  choice: ಅವನ ಸಹೋದರರು
  alternative: ಅವನ ಒಡಹುಟ್ಟಿದವರು / ಅವನ ಸಮೀಪದ ಬಂಧುಗಳು
  rationale: ಗ್ರೀಕ್ ರೂಪವು ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾಗಿದ್ದು ಪಠ್ಯದ ಮೇಲ್ಮೈ ಅರ್ಥವನ್ನು ‘ಸಹೋದರರು’ ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಅವರ ನಿಖರವಾದ ಕುಟುಂಬಸಂಬಂಧದ ಕುರಿತ ನಂತರದ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವಾದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯವು ನಿರ್ಣಯಿಸುವುದಿಲ್ಲ; ಪರ್ಯಾಯ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ಎಂಬುದು ಮೂಲದ ಗಮನಸೆಳೆಯುವ ಶಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಜನಸಮೂಹಗಳಿಗೆ’ ಮೂಲದ ಬಹುವಚನವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
