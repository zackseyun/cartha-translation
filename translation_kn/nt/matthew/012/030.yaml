id: MAT.12.30
reference: Matthew 12:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: kn
  text: ನನ್ನ ಸಂಗಡ ಇಲ್ಲದವನು ನನಗೆ ವಿರುದ್ಧನಾಗಿದ್ದಾನೆ; ಮತ್ತು ನನ್ನ ಸಂಗಡ ಒಟ್ಟುಗೂಡಿಸದವನು ಚದರಿಸುತ್ತಾನೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಯಾರು ನನ್ನ ಸಂಗಡ ಇಲ್ಲವೋ ಅವರು ನನಗೆ ವಿರುದ್ಧವಾಗಿದ್ದಾರೆ; ಮತ್ತು ಯಾರು ನನ್ನ ಸಂಗಡ ಒಟ್ಟುಗೂಡಿಸುವುದಿಲ್ಲವೋ ಅವರು ಚದರಿಸುತ್ತಾರೆ.’
    reason: ಸಾಮಾನ್ಯ ಏಕವಚನದ ಪರ್ಯಾಯ ಸಹಜ ಕನ್ನಡ ನಿರೂಪಣೆ.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ಇಲ್ಲದವನು
  rationale: ನಿರ್ದಿಷ್ಟ ಪದದೊಂದಿಗೆ ಬಂದ ಕೃದಂತವು ವ್ಯಕ್ತಿಯನ್ನು ಸಾಮಾನ್ಯ ಏಕವಚನದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಇಲ್ಲದವನು’ ಸಹಜವಾಗಿ ಈ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: μετ’ ἐμοῦ
  choice: ನನ್ನ ಸಂಗಡ
  rationale: μετά + ಷಷ್ಠೀ ವಿಭಕ್ತಿ ಸಹವಾಸ ಅಥವಾ ಜೊತೆಗಿರುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನನ್ನ ಸಂಗಡ’ ಸಂಬಂಧಾತ್ಮಕ ನಿಲುವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κατ’ ἐμοῦ
  choice: ನನಗೆ ವಿರೋಧವಾಗಿ
  rationale: κατά + ಷಷ್ಠೀ ಇಲ್ಲಿ ವಿರೋಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಕನ್ನಡ ರೂಪವು ಯೇಸುವಿಗೆ ವಿರುದ್ಧವಾದ ನಿಲುವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: συνάγων
  choice: ಒಟ್ಟುಗೂಡಿಸದವನು
  rationale: ಕ್ರಿಯಾಪದವು ಒಟ್ಟಿಗೆ ಸೇರಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಒಟ್ಟುಗೂಡಿಸು’ ಎಂಬುದು ಸಂಕ್ಷಿಪ್ತವಾಗಿದ್ದು, ಸಂಭವನೀಯ ಕುರುಬ ಅಥವಾ ಕೊಯ್ಲಿನ ಚಿತ್ರಣವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: σκορπίζει
  choice: ಚದರಿಸುತ್ತಾನೆ
  rationale: ಈ ಪದವು ಚದರಿಸುವುದು ಅಥವಾ ಚೆಲ್ಲಾಪಿಲ್ಲಿ ಮಾಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಒಟ್ಟುಗೂಡಿಸು’ ಎಂಬುದಕ್ಕೆ ಸಹಜವಾದ ವಿರುದ್ಧಾರ್ಥಕ ಸಮಾಂತರತೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಇದು ಎರಡು ಸಮಾಂತರ ಹೇಳಿಕೆಗಳನ್ನು ಸಂಯೋಜಿಸುವ ಯೋಗಾರ್ಥಕ ಅವ್ಯಯ; ‘ಮತ್ತು’ ಗ್ರೀಕ್ ಸಮನ್ವಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ನಿರಪೇಕ್ಷ ವಿರೋಧಾಭಾಸದ ತೀವ್ರತೆ
  choice: ಯೇಸುವಿನ ಸಂಗಡ ಇರುವಿಕೆ ಅಥವಾ ಆತನಿಗೆ ವಿರೋಧವಾಗಿರುವಿಕೆ ಎಂಬ ರಾಜಿಯಿಲ್ಲದ ಹೇಳಿಕೆಯನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಸಂಪೂರ್ಣ ವಿರೋಧವನ್ನು ದುರ್ಬಲಗೊಳಿಸುವ ಹೆಚ್ಚು ವಿವರಣಾತ್ಮಕ ಅನುವಾದ.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಯಾವುದೇ ತಗ್ಗಿಸುವ ಪದಗಳಿಲ್ಲದೆ ಎರಡು ತೀಕ್ಷ್ಣ ಸಮಾಂತರ ವಾಕ್ಯಗಳನ್ನು ನೀಡುತ್ತದೆ. ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ತೀರ್ಮಾನಗಳನ್ನು ಸೇರಿಸದೆ ಆ ತಾತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಪೂರ್ಣ ಶೈಲಿ. ‘ಸಂಗಡ’ ಎಂಬುದು ‘ಜೊತೆ’ಗಿಂತ ಸ್ವಲ್ಪ ಗಂಭೀರವಾಗಿದ್ದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುತ್ತದೆ; ಮೂಲದ ಸಮಾಂತರ ರಚನೆ ಮತ್ತು ತೀಕ್ಷ್ಣ ವಿರೋಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
