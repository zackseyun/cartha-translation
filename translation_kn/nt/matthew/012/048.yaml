id: MAT.12.48
reference: Matthew 12:48
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: kn
  text: ಆದರೆ ಅವನು ತನಗೆ ಮಾತನಾಡುತ್ತಿದ್ದವನಿಗೆ, “ನನ್ನ ತಾಯಿ ಯಾರು? ನನ್ನ ಸಹೋದರರು ಯಾರು?” ಎಂದು ಉತ್ತರಿಸಿದನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಇನ್ನಷ್ಟು ಶಬ್ದಶಃ: “ಆದರೆ ಅವನು ತನಗೆ ಮಾತನಾಡುತ್ತಿದ್ದವನಿಗೆ ಉತ್ತರಿಸಿ ಹೇಳಿದನು.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: ಆದರೆ ... ಉತ್ತರಿಸಿದನು
  rationale: ἀποκριθεὶς εἶπεν ಎಂಬುದು ‘ಉತ್ತರಿಸಿ ಹೇಳಿದನು’ ಎಂಬ ಸೆಮಿಟಿಕ್ ಪ್ರಭಾವದ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು. ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಉತ್ತರಿಸಿದನು’ ಎಂದರೆ ಪೂರ್ಣ ಅರ್ಥ ಬರುತ್ತದೆ; δέ ಸೂಚಿಸುವ ಮಾತಿನ ತಿರುವನ್ನು ‘ಆದರೆ’ ಉಳಿಸುತ್ತದೆ.
- source_word: τῷ λέγοντι αὐτῷ
  choice: ತನ್ನೊಂದಿಗೆ ಮಾತನಾಡುತ್ತಿದ್ದವನಿಗೆ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಯೇಸುವನ್ನು ಉದ್ದೇಶಿಸಿ ಮಾತನಾಡುತ್ತಿದ್ದ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮಾತನಾಡುತ್ತಿದ್ದವನಿಗೆ’ ಎಂಬುದು ಕ್ರಿಯೆಯ ನಡೆಯುತ್ತಿರುವ ಸ್ವರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: ನನ್ನ ತಾಯಿ ಯಾರು?
  rationale: ಗುರುತನ್ನು ಕೇಳುವ ಪ್ರಶ್ನೆಯನ್ನು ನೇರವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: ನನ್ನ ಸಹೋದರರು ಯಾರು?
  rationale: ಬಹುವಚನ ಪುಲ್ಲಿಂಗ ἀδελφοίಗೆ ‘ಸಹೋದರರು’ ಎಂದು ಅನುವಾದಿಸಿ, ಮೂಲದಲ್ಲಿರುವ ಕುಟುಂಬಸಂಬಂಧದ ಪುಲ್ಲಿಂಗ ಸೂಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಕುಟುಂಬದ ಗುರುತಿನ ಕುರಿತು ಯೇಸುವಿನ ಆಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ಮೃದುಗೊಳಿಸುವ ಸಾಧ್ಯತೆ
  choice: ಯಾವುದೇ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ನೇರ ಪ್ರಶ್ನೆಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: “ಯಾರನ್ನು ನನ್ನ ತಾಯಿ ಎಂದು, ಯಾರನ್ನು ನನ್ನ ಸಹೋದರರು ಎಂದು ಪರಿಗಣಿಸಬೇಕು?”
  rationale: ಮುಂದಿನ ವಚನಗಳು ಯೇಸು ಸೂಚಿಸುವ ಹೊಸ ಬಾಂಧವ್ಯವನ್ನು ವಿವರಿಸುತ್ತವೆ; ಈ ವಚನದಲ್ಲಿಯೇ ಆ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಕಥನದ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ἀδελφοί ಪದದ ಲಿಂಗಸೂಚನೆ
  choice: ಸಹೋದರರು
  alternative: ಒಡಹುಟ್ಟಿದವರು / ಸಹೋದರ ಸಹೋದರಿಯರು
  rationale: ಈ ದೃಶ್ಯದ ತಕ್ಷಣದ ಸಂದರ್ಭವು ಯೇಸುವಿನ ಕುಟುಂಬದ ಪುರುಷ ಸದಸ್ಯರನ್ನು ‘ಸಹೋದರರು’ ಎಂದು ಉಲ್ಲೇಖಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಮೂಲದ ಪುಲ್ಲಿಂಗ ಕುಟುಂಬಪದವನ್ನು ವಿಶಾಲಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಕರ್ತೃ ಹಿಂದಿನ ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟವಾಗಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟತೆಗಾಗಿ ‘ಯೇಸು’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ [a] ಗುರುತು ಸಂಬಂಧಿತ ಅಡಿಕುರಿಪಿಗೆ ಹೊಂದಿಸಲಾಗಿದೆ.
