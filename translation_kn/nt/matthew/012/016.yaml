  text: And he warned them not to make him known,[a]
translation:
  language: kn
  text: ಮತ್ತು ತಮ್ಮನ್ನು ಬಹಿರಂಗಪಡಿಸಬಾರದೆಂದು ಅವರಿಗೆ ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಎಚ್ಚರಿಸಿದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವರಿಗೆ ಕಠಿಣವಾಗಿ ಎಚ್ಚರಿಸಿದರು’ ಅಥವಾ ‘ಅವರಿಗೆ ಆಜ್ಞಾಪಿಸಿದರು.’
