lexical_decisions:
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಹಿಂದಿನ ಘಟನೆಗೆ ಸರಳವಾಗಿ ಜೋಡಿಸುವ ಗ್ರೀಕ್ ಸಂಯೋಜಕವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐπετίμησεν
  choice: ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಎಚ್ಚರಿಸಿದರು
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಗದರಿಸುವುದು, ಕಠಿಣವಾಗಿ ಎಚ್ಚರಿಸುವುದು ಅಥವಾ ಆದೇಶಿಸುವುದು ಎಂಬ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು. ಇಲ್ಲಿ ನಂತರ ಬರುವ ನಿಷೇಧಾತ್ಮಕ ವಿಷಯವಾಕ್ಯವು ಬಲವಾದ ನಿರ್ದೇಶನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಎಚ್ಚರಿಸಿದರು’ ಎಂಬುದು ತಪ್ಪು ಮಾಡಿದವರನ್ನು ಗದರಿಸಿದರು ಎಂದು ಅನಿವಾರ್ಯವಾಗಿ ಸೂಚಿಸದೆ ಆ ಬಲವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ಸಂದರ್ಭದಲ್ಲಿರುವ ಬಹುವಚನ ವ್ಯಕ್ತಿಗಳನ್ನು ಸೂಚಿಸುವ ದತ್ತಿವಿಭಕ್ತಿಯ ಸರ್ವನಾಮಕ್ಕೆ ನೇರವಾದ ಕನ್ನಡ ರೂಪ.
- source_word: ἵνα μὴ
  choice: ತಿಳಿಸಬಾರದೆಂದು
  rationale: ಎಚ್ಚರಿಕೆ ಅಥವಾ ಆದೇಶದ ನಂತರ ಬರುವ ನಿಷೇಧಾತ್ಮಕ ವಿಷಯ/ಉದ್ದೇಶವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: ತಮ್ಮ ಬಗ್ಗೆ ಯಾರಿಗೂ ತಿಳಿಸಬಾರದೆಂದು
  rationale: φανερὸν ποιέω ಎಂಬ ನುಡಿಗಟ್ಟು ಬಹಿರಂಗಪಡಿಸುವುದು ಅಥವಾ ತಿಳಿಯುವಂತೆ ಮಾಡುವುದು ಎಂದರ್ಥ. ಕನ್ನಡದಲ್ಲಿ ‘ತಮ್ಮ ಬಗ್ಗೆ ... ತಿಳಿಸು’ ಎಂಬುದು ಯೇಸುವನ್ನು ಬಹಿರಂಗವಾಗಿ ಪರಿಚಿತಗೊಳಿಸಬಾರದು ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ; ‘ಯಾರಿಗೂ’ ಎಂಬುದು ನಿಷೇಧದ ಪ್ರಾಯೋಗಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಕುರಿತ ಪ್ರಚಾರವನ್ನು ತಡೆಯುವ ನಿರ್ದೇಶನದ ಸ್ವರೂಪ
  choice: ತಮ್ಮ ಬಗ್ಗೆ ತಿಳಿಸಬಾರದೆಂಬ ಕಟ್ಟುನಿಟ್ಟಾದ ಎಚ್ಚರಿಕೆ
  alternative: ಅವರನ್ನು ಗದರಿಸುವುದು ಅಥವಾ ಔಪಚಾರಿಕವಾಗಿ ಆದೇಶಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ಪದವು ಬಲವಾದ ನಿರ್ದೇಶನವನ್ನು ಸೂಚಿಸಿದರೂ, ಅದರ ಹಿಂದಿನ ದೇವತಾತ್ವಿಕ ಕಾರಣವನ್ನು ಈ ವಚನವೇ ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನಾವಶ್ಯಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಮೂಲದಲ್ಲಿರುವ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಪೂರ್ಣವೂ ಆದ ನಿರೂಪಣೆ. ಯೇಸುವಿಗೆ ಗೌರವ ಸೂಚಿಸಲು ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಮತ್ತು ‘ತಮ್ಮ’ ಎಂಬ ಆತ್ಮವಾಚಕ ರೂಪ ಬಳಸಲಾಗಿದೆ; ἐπιτιμάω ಪದದ ತೀವ್ರತೆಯನ್ನು ಮುಖ್ಯಪಠ್ಯದಲ್ಲೂ ಪರ್ಯಾಯಗಳನ್ನು ಅಡಿಕುರಿತಲ್ಲೂ ಉಳಿಸಲಾಗಿದೆ.
