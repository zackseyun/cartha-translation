id: MAT.12.47
reference: Matthew 12:47
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: kn
  text: ಆಗ ಒಬ್ಬನು ಅವನಿಗೆ[a], “ನೋಡು, ನಿನ್ನ ತಾಯಿಯೂ ನಿನ್ನ ಸಹೋದರರೂ ಹೊರಗೆ ನಿಂತಿದ್ದಾರೆ; ಅವರು ನಿನ್ನೊಂದಿಗೆ ಮಾತನಾಡಲು ಬಯಸುತ್ತಿದ್ದಾರೆ” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ ಈ ವಚನವು ಇಲ್ಲ.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: ಆಗ ಒಬ್ಬನು ಅವನಿಗೆ … ಎಂದು ಹೇಳಿದನು
  rationale: δέ ಸೌಮ್ಯವಾದ ಕಥನ ಸಂಪರ್ಕವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆಗ’ ಸಹಜವಾದ ಮುಂದುವರಿಕೆಯನ್ನು ಕೊಡುತ್ತದೆ; τις ಅನಿರ್ದಿಷ್ಟವಾಗಿರುವುದರಿಂದ ‘ಒಬ್ಬನು’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: Ἰδοὺ
  choice: ನೋಡು
  rationale: ಗಮನ ಸೆಳೆಯುವ ἰδού ಪದದ ಸೂಚಕ ಬಲವನ್ನು ಆಧುನಿಕ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ μήτηρ σου
  choice: ನಿನ್ನ ತಾಯಿ
  rationale: ಸಾಮಾನ್ಯ ಸ್ವಾಮ್ಯಸೂಚಕ ರಚನೆಯ ನೇರ ಮತ್ತು ಸಹಜ ಅನುವಾದ.
- source_word: οἱ ἀδελφοί σου
  choice: ನಿನ್ನ ಸಹೋದರರು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಪುರುಷ ಕುಟುಂಬಸದಸ್ಯರನ್ನು ಸೂಚಿಸುವ ಬಹುವಚನ; ಮೂಲದ ಲಿಂಗಸೂಚನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἔξω ἑστήκασιν
  choice: ಹೊರಗೆ ನಿಂತಿದ್ದಾರೆ
  rationale: ἵστημι ಪದದ ಪೂರ್ಣಕಾಲವು ಉಂಟಾದ ಕ್ರಿಯೆಯಿಂದ ಮುಂದುವರಿಯುವ ಪ್ರಸ್ತುತ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἔξω ಅನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ζητοῦντές
  choice: ಬಯಸುತ್ತಿದ್ದಾರೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ζητέω ಯಾರೊಂದಿಗಾದರೂ ಮಾತನಾಡುವ ಉದ್ದೇಶ ಅಥವಾ ಇಚ್ಛೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಮಾತನಾಡಲು ಹುಡುಕುತ್ತಿದ್ದಾರೆ’ ಅಸಹಜವಾಗುವುದರಿಂದ ‘ಬಯಸುತ್ತಿದ್ದಾರೆ’ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: σοι λαλῆσαι
  choice: ನಿನ್ನೊಂದಿಗೆ ಮಾತನಾಡಲು
  rationale: ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಿಯೊಂದಿಗೆ ಸಂಭಾಷಿಸುವುದನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; σοι ಮತ್ತು λαλῆσαι ಯ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಕೊಡುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯ 12:47ರ ಪಾಠವಿಮರ್ಶಾತ್ಮಕ ಸ್ಥಾನ
  choice: ಒದಗಿಸಲಾದ SBLGNT ಮೂಲದಲ್ಲಿರುವಂತೆ ವಚನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಿ, ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿನ ಲೋಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
  alternative: ಕೆಲವು ಪಾಠಸಾಕ್ಷಿಗಳಲ್ಲಿ ಇಲ್ಲದಿರುವುದರಿಂದ ವಚನವನ್ನು ಕೈಬಿಡುವುದು.
  rationale: ಮೂಲಪಠ್ಯದಲ್ಲಿ ವಚನವನ್ನು ನೀಡಲಾಗಿದೆ ಮತ್ತು ವಿಮರ್ಶಾತ್ಮಕ ಆವೃತ್ತಿಗಳಲ್ಲಿ ಅದರ ಸ್ಥಾನ ಅನಿಶ್ಚಿತವಾಗಿದೆ. ಆದ್ದರಿಂದ ಅದನ್ನು ಮೌನವಾಗಿ ಕೈಬಿಡದೆ ಅನುವಾದಿಸಿ, ಮಹತ್ವದ ಪಾಠಾಂತರವನ್ನು ಪಾರದರ್ಶಕವಾಗಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಉಲ್ಲೇಖಿತ ಮಾತಿನೊಳಗೆ ‘ನಿನ್ನ’ ಮತ್ತು ಹೊರಗಿನ ಕಥನದಲ್ಲಿ ‘ಅವನಿಗೆ’ ಎಂಬ ಸರ್ವನಾಮಗಳು ಕನ್ನಡದ ಸಾಮಾನ್ಯ ಬಳಕೆಗೆ ಅನುಗುಣವಾಗಿವೆ.
