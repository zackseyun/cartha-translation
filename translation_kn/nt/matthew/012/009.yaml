  text: And departing from there, he went into their synagogue.
translation:
  language: kn
  text: ಅಲ್ಲಿಂದ ಹೊರಟು, ಯೇಸು ಅವರ ಸಭಾಮಂದಿರದೊಳಗೆ ಹೋದರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: (ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದೆ ವಾಕ್ಯಸಂಬಂಧದಲ್ಲಿ ಒಳಗೊಳ್ಳಿಸಲಾಗಿದೆ)
  rationale: ಗ್ರೀಕ್‌ನ ಸರಳ ಸಂಪರ್ಕಕವು ಹಿಂದಿನ ಘಟನೆಯೊಂದಿಗೆ ನಿರೂಪಣೆಯನ್ನು ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮತ್ತು’ ಎಂದು ಆರಂಭಿಸುವುದಕ್ಕಿಂತ ಕ್ರಮಬದ್ಧ ಚಲನೆಯನ್ನು ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲೇ ವ್ಯಕ್ತಪಡಿಸುವುದು ಸೂಕ್ತ.
- source_word: μεταβὰς ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ ಹೊರಟು
  rationale: ಸ್ಥಳಾಂತರವನ್ನು ಸೂಚಿಸುವ ಕ್ರಿಯಾಪದದ ಕೃದಂತ ರೂಪವನ್ನೂ, ಹಿಂದಿನ ಸ್ಥಳದಿಂದ ಹೊರಡುವ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἦλθεν
  choice: ಹೋದರು
  rationale: ἔρχομαι ಮೂಲತಃ ‘ಬರು/ಹೋಗು’ ಎಂಬ ಚಲನೆಯನ್ನು ಸೂಚಿಸಬಹುದು; ಹಿಂದಿನ ಸ್ಥಳದಿಂದ ಹೊಸ ಸ್ಥಳಕ್ಕೆ ಸಾಗುವ ಈ ನಿರೂಪಣೆಯಲ್ಲಿ ಕನ್ನಡಕ್ಕೆ ‘ಹೋದರು’ ಸಹಜವಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ಬಳಸಲಾಗಿದೆ.
- source_word: εἰς τὴν συναγωγὴν
  choice: ಸಭಾಮಂದಿರದೊಳಗೆ
  rationale: εἰς ಎಂಬುದು ಒಳಗೆ ಪ್ರವೇಶಿಸುವ ದಿಕ್ಕನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ದೊಳಗೆ’ ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ. συναγωγήಗೆ ಯೆಹೂದ್ಯರ ಸಭೆ ಮತ್ತು ಆರಾಧನೆಯ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದ ‘ಸಭಾಮಂದಿರ’ ಬಳಸಲಾಗಿದೆ.
- source_word: αὐτῶν
  choice: ಅವರ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನ ಸಂಬಂಧಸೂಚಕ ಸರ್ವನಾಮವನ್ನು ಅದರ ಉಲ್ಲೇಖಿತ ಗುಂಪನ್ನು ಇನ್ನಷ್ಟು ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ‘ಅವರ ಸಭಾಮಂದಿರ’ ಎಂಬುದರಲ್ಲಿ ‘ಅವರ’ ಎಂಬುದರ ಉಲ್ಲೇಖ
  choice: ‘ಅವರ ಸಭಾಮಂದಿರ’ ಎಂದು ತಟಸ್ಥವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಆ ಊರಿನ ಯೆಹೂದ್ಯರ ಸಭಾಮಂದಿರ’ ಅಥವಾ ‘ವಿರೋಧಿಗಳ ಸಭಾಮಂದಿರ’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು συναγωγὴν αὐτῶν ಎಂದು ಮಾತ್ರ ಹೇಳುತ್ತದೆ; ಸಂಬಂಧಿತ ಗುಂಪನ್ನು ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾಗಿ ಗುರುತಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಂಥೀಯ ಅಥವಾ ವಿರೋಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸೇರಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ನಿರೂಪಣಾಶೈಲಿ. ‘ಅವರು/ಹೋದರು’ ಎಂಬ ಗೌರವಸೂಚಕ ರೂಪಗಳು ಯೇಸುವನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತವೆ. ವಾಕ್ಯದಲ್ಲಿ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳಿಲ್ಲ, ಏಕೆಂದರೆ ಈ ವಚನಕ್ಕೆ ಅಗತ್ಯವಾದ ಪಾದಟಿಪ್ಪಣಿ ಇಲ್ಲ.
