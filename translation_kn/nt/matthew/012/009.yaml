revisions:
- from: ಅಲ್ಲಿಂದ ಹೊರಟು, ಅವರು ಅವರ ಸಭಾಮಂದಿರದೊಳಗೆ ಹೋದರು.
  to: ಅಲ್ಲಿಂದ ಹೊರಟು, ಯೇಸು ಅವರ ಸಭಾಮಂದಿರದೊಳಗೆ ಹೋದರು.
  rationale: 'The sole revision replaces the honorific subject pronoun with ‘ಯೇಸು’ to prevent confusion with the following possessive ‘ಅವರ.’ This makes no interpretive change: the narrative context supplies Jesus as the subject, and ‘ಅವರ ಸಭಾಮಂದಿರ’ continues to render συναγωγὴν αὐτῶν neutrally.'
