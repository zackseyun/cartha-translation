id: MAT.12.17
reference: Matthew 12:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: kn
  text: 'ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತೆ ಆಯಿತು; ಯೆಶಾಯನು ಹೀಗೆ ಹೇಳಿದನು:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ನೆರವೇರುವಂತೆ
  rationale: ಉದ್ದೇಶ ಅಥವಾ ಫಲಿತಾಂಶ—ಎರಡಕ್ಕೂ ಅವಕಾಶ ಕೊಡುವ ಸಹಜ ಕನ್ನಡ ರೂಪ; ಗ್ರೀಕ್‌ನ ಸಂಬಂಧವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: πληρωθῇ
  choice: ನೆರವೇರುವಂತೆ
  rationale: ಮತ್ತಾಯನ ನೆರವೇರಿಕೆ ಸೂತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ; ἵνα ಜೊತೆಯಲ್ಲಿರುವ ನಿಷ್ಕ್ರಿಯ ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಉದ್ದೇಶ/ಫಲಿತಾಂಶ ರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸ ῥηθὲν
  choice: ಹೇಳಲ್ಪಟ್ಟ ಮಾತು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ನಿಷ್ಕ್ರಿಯ ಕೃದಂತವನ್ನು ಸ್ಪಷ್ಟ ಹಾಗೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: διὰ
  choice: ಮೂಲಕ
  rationale: ಷಷ್ಠೀ ವಿಭಕ್ತಿಯೊಡನೆ διά ಮಧ್ಯಸ್ಥ ಕರ್ತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಂದೇಶದ ಅಂತಿಮ ಮೂಲ ದೇವರು, ಯೆಶಾಯನು ಅದನ್ನು ತಿಳಿಸಿದ ಪ್ರವಾದಿ ಎಂಬ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Ἠσαΐου
  choice: ಯೆಶಾಯನ
  rationale: ಕನ್ನಡ ಸತ್ಯವೇದ ಪರಂಪರೆಯಲ್ಲಿ ವ್ಯಾಪಕವಾಗಿ ಪರಿಚಿತವಾದ ಪ್ರವಾದಿಯ ಹೆಸರಿನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯಾದ
  rationale: ಯೆಶಾಯನನ್ನು ಗುರುತಿಸುವ ಮೂಲಪಾಠದ ಸಮಾನಾಧಿಕರಣ ಪದವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λέγοντος
  choice: ಹೀಗೆ … ಹೇಳಲ್ಪಟ್ಟ
  rationale: ಮುಂದಿನ ವಚನದಲ್ಲಿ ಬರುವ ಉಲ್ಲೇಖವನ್ನು ದ್ವಿಬಿಂದುವಿನ ಮೂಲಕ ಪರಿಚಯಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಹೇಳಲ್ಪಟ್ಟ ಮಾತು …:’ ಎಂಬ ರಚನೆ ಗ್ರೀಕ್ ಕೃದಂತದ ಮುಂದಿನ ಉಲ್ಲೇಖದ ಸಂಪರ್ಕವನ್ನು ಸಹಜವಾಗಿ ಒದಗಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪ್ರವಾದಿಯ ಮಧ್ಯಸ್ಥ ಕರ್ತೃತ್ವ
  choice: ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನ ಮೂಲಕ
  alternative: ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನಿಂದ
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿ ಯೆಶಾಯನನ್ನು ಸಂದೇಶದ ಮಧ್ಯಸ್ಥನಾಗಿ ತೋರಿಸುತ್ತದೆ; ಅವನೇ ಸಂದೇಶದ ಅಂತಿಮ ಮೂಲವೆಂದು ಸೂಚಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- issue: ἵναಯ ಉದ್ದೇಶ/ಫಲಿತಾಂಶದ ಅನಿಶ್ಚಿತತೆ
  choice: ನೆರವೇರುವಂತೆ
  alternative: ನೆರವೇರುವುದಕ್ಕಾಗಿ
  rationale: ‘ನೆರವೇರುವಂತೆ’ ಎಂಬುದು ಉದ್ದೇಶ ಮತ್ತು ಫಲಿತಾಂಶ ಎರಡರ ಛಾಯೆಯನ್ನೂ ಹೊಂದಬಲ್ಲದು; ‘ನೆರವೇರುವುದಕ್ಕಾಗಿ’ ಎಂಬುದು ಉದ್ದೇಶವನ್ನೇ ಹೆಚ್ಚು ಬಲವಾಗಿ ನಿರ್ಧರಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ಹಿಂದಿನ ಘಟನೆಯನ್ನು ಸೂಚಿಸಲು ‘ಹೀಗಾಯಿತು’ ಬಳಸಲಾಗಿದೆ; ಕೊನೆಯ ದ್ವಿಬಿಂದು ಮುಂದಿನ ವಚನದ ಉಲ್ಲೇಖಕ್ಕೆ ನೇರ ಸಂಪರ್ಕ ನೀಡುತ್ತದೆ.
