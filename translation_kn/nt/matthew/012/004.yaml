id: MAT.12.4
reference: Matthew 12:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: kn
  text: ಅವನು ದೇವರ ಮನೆಯನ್ನು ಪ್ರವೇಶಿಸಿ, ದೇವರ ಸನ್ನಿಧಿಯ ರೊಟ್ಟಿಗಳನ್ನು ತಾನು ಮತ್ತು ತನ್ನೊಂದಿಗಿದ್ದವರು ತಿಂದದ್ದು[a] ಹೇಗೆಂದು ನೀವು ಓದಲಿಲ್ಲವೇ? ಅವನಿಗಾಗಲಿ ಅವನೊಂದಿಗಿದ್ದವರಿಗಾಗಲಿ ಅವುಗಳನ್ನು ತಿನ್ನುವುದು ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಸಮ್ಮತವಾಗಿರಲಿಲ್ಲ; ಯಾಜಕರಿಗೆ ಮಾತ್ರ ಸಮ್ಮತವಾಗಿತ್ತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ “ತಾನು ಮತ್ತು ತನ್ನೊಂದಿಗಿದ್ದವರು ತಿಂದದ್ದು” ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ “ಅವನು ತಿಂದದ್ದು” ಎಂದಿದೆ.
    reason: textual_variant
lexical_decisions:
- source_word: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ಅವನು ದೇವರ ಆಲಯದೊಳಗೆ ಪ್ರವೇಶಿಸಿ ... ಹೇಗೆಂದು
  rationale: πῶς ಅನ್ನು ಹಿಂದಿನ ವಾಕ್ಯದ ‘ಓದಲಿಲ್ಲವೇ?’ ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಸಹಜವಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ. ‘ದೇವರ ಆಲಯ’ ಎಂಬುದು ಪವಿತ್ರ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ οἶκος τοῦ θεοῦಗೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ರೂಪ; ಸಂದರ್ಭದ ಆಧಾರದಲ್ಲಿ ನಿರ್ದಿಷ್ಟವಾಗಿ ‘ದೇವದರ್ಶನದ ಗುಡಾರ’ ಎಂದು ಮಾಡಿಲ್ಲ.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: ದೇವರ ಸನ್ನಿಧಿಯ ರೊಟ್ಟಿಗಳು
  rationale: ದೇವರ ಮುಂದೆ ಇಡಲಾಗುತ್ತಿದ್ದ ಪ್ರತಿಷ್ಠಿತ ರೊಟ್ಟಿಗಳ ಆರಾಧನಾ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἔφαγον
  choice: ತಾನು ಮತ್ತು ತನ್ನೊಂದಿಗಿದ್ದವರು ತಿಂದದ್ದು
  rationale: SBLGNTಯ ಬಹುವಚನ ಕ್ರಿಯಾಪದವನ್ನು ಅನುಸರಿಸಿ, ಕನ್ನಡದಲ್ಲಿ ಕರ್ತೃಗಳನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ ಬಹುವಚನಾರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: ಅವನು ... ತಿನ್ನುವುದು ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅನುಮತವಾಗಿರಲಿಲ್ಲ
  rationale: ἐξόν ಪದದ ಕಾನೂನುಬದ್ಧ/ಆರಾಧನಾ ನಿರ್ಬಂಧದ ಬಲವನ್ನು ‘ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅನುಮತವಾಗಿರಲಿಲ್ಲ’ ಎಂಬ ಮಾತು ಉಳಿಸುತ್ತದೆ.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: ಅವನೊಂದಿಗಿದ್ದವರಾಗಲಿ
  rationale: ದಾವೀದನ ಜೊತೆಗಿದ್ದವರನ್ನು ಮೂಲಕ್ಕೆ ಹತ್ತಿರವಾಗಿ, ಅತಿವ್ಯಾಖ್ಯಾನವಿಲ್ಲದೆ ಸೂಚಿಸುತ್ತದೆ.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ಯಾಜಕರು ಮಾತ್ರ ತಿನ್ನಬೇಕಾಗಿತ್ತೇ ಹೊರತು
  rationale: εἰ μὴ ಮತ್ತು μόνοις ಸೂಚಿಸುವ ವಿನಾಯಿತಿ ಹಾಗೂ ಪ್ರತ್ಯೇಕ ಹಕ್ಕನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἐξόν ಪದದ ಆರಾಧನಾ-ಕಾನೂನುಬದ್ಧ ಬಲ
  choice: ‘ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅನುಮತವಾಗಿರಲಿಲ್ಲ’ ಎಂದು ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
  alternative: ‘ತಿನ್ನಲು ಅನುಮತಿ ಇರಲಿಲ್ಲ’
  rationale: ಇದು ಕೇವಲ ಸಾಮಾನ್ಯ ಅನುಮತಿಯ ವಿಷಯವಲ್ಲ; ತೋರಾದಲ್ಲಿನ ಯಾಜಕೀಯ ನಿರ್ಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆದರೂ ಹೆಚ್ಚುವರಿ ಪಂಥೀಯ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- issue: ἔφαγον ಕ್ರಿಯಾಪದದ ಕರ್ತೃ
  choice: 'ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಹುವಚನಾರ್ಥ: ‘ತಾನು ಮತ್ತು ತನ್ನೊಂದಿಗಿದ್ದವರು ತಿಂದದ್ದು.’'
  alternative: 'ಏಕವಚನ ಪಾಠ: ‘ಅವನು ತಿಂದದ್ದು’'
  rationale: ಕೊಟ್ಟಿರುವ SBLGNT ಮೂಲಪಠ್ಯವು ಬಹುವಚನ ἔφαγον ಅನ್ನು ಹೊಂದಿದೆ. ಏಕವಚನ ಪಾಠವು ಪಠ್ಯಭೇದವಾಗಿರುವುದರಿಂದ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಮತ್ತು ಜನಸಾಮಾನ್ಯರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ವಾಕ್ಯವು ಹಿಂದಿನ ವಚನದಲ್ಲಿ ಆರಂಭವಾದ ‘ಓದಲಿಲ್ಲವೇ?’ ಎಂಬ ಪ್ರಶ್ನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪೂರ್ಣಗೊಳಿಸುತ್ತದೆ. ‘ದೇವರ ಸನ್ನಿಧಿಯ ರೊಟ್ಟಿಗಳು’ ಎಂಬುದು ಪಾರಂಪರಿಕ ತಾಂತ್ರಿಕ ಪದಕ್ಕಿಂತ ಅರ್ಥಸ್ಪಷ್ಟವಾಗಿದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
