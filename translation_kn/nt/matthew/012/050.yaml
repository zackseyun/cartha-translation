id: MAT.12.50
reference: Matthew 12:50
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆಯ ಚಿತ್ತವನ್ನು ಯಾರು ಮಾಡುತ್ತಾನೋ, ಅವನು ನನ್ನ ಸಹೋದರ, ಸಹೋದರಿ ಮತ್ತು ತಾಯಿ ಆಗುತ್ತಾನೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಯಾವನು ... ಅವನು’ ಎಂಬ ವ್ಯಾಕರಣಾತ್ಮಕ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ರೂಪವಿದೆ; ಇಲ್ಲಿ ಅದು ಯಾರೇ ಆಗಿದ್ದರೂ ಎಂಬ ಸಾಮಾನ್ಯ ಅರ್ಥದಲ್ಲಿ ಬಳಕೆಯಾಗಿದೆ.
    reason: ಮೂಲದ ವ್ಯಾಕರಣಾತ್ಮಕ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಮತ್ತು ಅದರ ಎಲ್ಲರನ್ನೂ ಒಳಗೊಳ್ಳುವ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ತಿಳಿಸಲು.
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: ಯಾರು ... ಅವರೇ
  rationale: ಅನಿರ್ದಿಷ್ಟ ಸಂಬಂಧವಾಚಕ ರಚನೆಯು ಎಲ್ಲರಿಗೂ ಅನ್ವಯಿಸುವ ಸಾಮಾನ್ಯ ಷರತ್ತನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಯಾರು ... ಅವರೇ’ ಎಂಬುದು ಅದರ ಮುಕ್ತವಾದ ‘ಯಾರೇ ಆಗಿದ್ದರೂ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯಕ್ಕೆ ಇರುವ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ποιήσῃ
  choice: ನೆರವೇರಿಸುತ್ತಾರೋ
  rationale: θέλημα ಜೊತೆಗಿನ ποιέω ಎಂದರೆ ಚಿತ್ತದಂತೆ ನಡೆದು ಅದನ್ನು ಕಾರ್ಯರೂಪಕ್ಕೆ ತರುವುದು. ‘ವಿಧೇಯರಾಗುವುದು’ ಎನ್ನುವುದು ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಕಿರಿದಾಗಿಸಬಹುದು.
- source_word: τὸ θέλημα
  choice: ಚಿತ್ತವನ್ನು
  rationale: ‘ಚಿತ್ತ’ ಎಂಬುದು ದೇವರ ಇಚ್ಛೆ ಅಥವಾ ಸಂಕಲ್ಪದ ಧಾರ್ಮಿಕ ಮತ್ತು ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುವ ಸ್ಥಿರವಾದ ಕನ್ನಡ ಪದ.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆಯ
  rationale: ಮೂಲದಲ್ಲಿರುವ ‘ನನ್ನ ತಂದೆ’ ಮತ್ತು ‘ಪರಲೋಕಗಳಲ್ಲಿ ಇರುವ’ ಎಂಬ ಎರಡೂ ಅಂಶಗಳನ್ನು ಸಹಜ ಕನ್ನಡ ಕ್ರಮದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ. ಬಹುವಚನ οὐρανοῖς ಅನ್ನು ಕನ್ನಡದ ರೂಢಿಯಾದ ‘ಪರಲೋಕ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: αὐτός
  choice: ಅವರೇ
  rationale: ಒತ್ತಿಹೇಳುವ αὐτός ಅನ್ನು ಕನ್ನಡದ ‘-ಏ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ. ‘ಯಾರು ... ಅವರೇ’ ಎಂಬ ಗೌರವ/ಸಾಮಾನ್ಯ ಏಕವಚನ ರೂಪವು ಆ ವ್ಯಕ್ತಿಯನ್ನೇ ಸೂಚಿಸಿ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದೆ.
- source_word: ἀδελφὸς
  choice: ಸಹೋದರನು
  rationale: ಗ್ರೀಕ್ ಏಕವಚನ ಕುಟುಂಬಪಾತ್ರವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀδελφὴ
  choice: ಸಹೋದರಿ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಕುಟುಂಬಪಾತ್ರಗಳನ್ನು ಒಂದೊಂದಾಗಿ ಹೆಸರಿಸುವುದರಿಂದ ಇದನ್ನು ಸಾಮಾನ್ಯ ‘ಒಡಹುಟ್ಟಿದವರು’ ಎಂಬ ಪದದಲ್ಲಿ ವಿಲೀನಗೊಳಿಸಿಲ್ಲ.
- source_word: μήτηρ
  choice: ತಾಯಿ
  rationale: ಗ್ರೀಕ್ ಏಕವಚನ ಕುಟುಂಬಪಾತ್ರವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐστίν
  choice: ಆಗಿದ್ದಾರೆ
  rationale: ವರ್ತಮಾನಕಾಲದ ಸರಳ ಸಂಬಂಧಸೂಚಕ ಕ್ರಿಯೆಯನ್ನು ಉಳಿಸಿ, ‘ಅವರೇ’ ಎಂಬ ಕನ್ನಡದ ಗೌರವ/ಸಾಮಾನ್ಯ ಏಕವಚನ ರೂಪಕ್ಕೆ ಹೊಂದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಸಾಮಾನ್ಯ ಅರ್ಥದಲ್ಲಿ ಬಳಸಿದ ವ್ಯಾಕರಣಾತ್ಮಕ ಪುಲ್ಲಿಂಗ ಏಕವಚನ
  choice: ಯಾರು ... ಅವರೇ
  alternative: ಯಾವನು ... ಅವನೇ
  rationale: ಗ್ರೀಕ್‌ನ ὅστις ಮತ್ತು αὐτός ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಪುಲ್ಲಿಂಗ ಏಕವಚನವಾಗಿದ್ದರೂ, ἄν ಜೊತೆಯಲ್ಲಿ ಅವು ಯಾರಿಗಾದರೂ ಅನ್ವಯಿಸುವ ಸಾಮಾನ್ಯ ಷರತ್ತನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ. ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಯಾರು ... ಅವರೇ’ ಮೂಲದ ಸಾಮಾನ್ಯ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಸಹೋದರನು, ಸಹೋದರಿ, ತಾಯಿ’ ಎಂಬ ಪ್ರತ್ಯೇಕ ಪಾತ್ರಗಳನ್ನು ಉಳಿಸುವುದರಿಂದ ಕುಟುಂಬಸಂಬಂಧದ ಚಿತ್ರಣವೂ ಸಮತಟ್ಟಾಗುವುದಿಲ್ಲ. ಮೂಲದ ಪುಲ್ಲಿಂಗ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಪಾರದರ್ಶಕವಾಗಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ಶೈಲಿ. ‘ಯಾರು ... ಅವರೇ’ ಎಂಬ ರೂಪವು ಸಾಮಾನ್ಯ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವ ರೂಢಿಯಾದ ಕನ್ನಡ ಬಳಕೆ; ‘ಚಿತ್ತ’ ಮತ್ತು ‘ಪರಲೋಕ’ ಪದಗಳು ಗ್ರಂಥೋಚಿತ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಪರಿಚಿತವಾಗಿವೆ.
