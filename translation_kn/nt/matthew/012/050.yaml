revisions:
- from: ಏಕೆಂದರೆ ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆಯ ಚಿತ್ತವನ್ನು ಯಾರು ನೆರವೇರಿಸುತ್ತಾರೋ, ಅವರೇ ನನ್ನ ಸಹೋದರನೂ ಸಹೋದರಿಯೂ ತಾಯಿಯೂ ಆಗಿದ್ದಾರೆ.[a]
  to: ಏಕೆಂದರೆ ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆಯ ಚಿತ್ತವನ್ನು ಯಾರು ಮಾಡುತ್ತಾನೋ, ಅವನು ನನ್ನ ಸಹೋದರ, ಸಹೋದರಿ ಮತ್ತು ತಾಯಿ ಆಗುತ್ತಾನೆ.[a]
  rationale: The revision uses ‘ಮಾಡುತ್ತಾನೋ’ for the direct and idiomatic equivalent of ποιήσῃ τὸ θέλημα, regularizes the generic singular syntax and finite verb, and clarifies the footnote so that it describes the Greek grammar rather than misquoting the Kannada wording. No doctrinal interpretation is introduced, and the source’s explicit brother–sister–mother triad is retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the generalizing force of ὅστις ἄν, the Father's will, and the three explicitly named family roles. However, ‘ನೆರವೇರಿಸುತ್ತಾರೋ’ can suggest bringing the will itself to completion; with θέλημα, ‘ಮಾಡುತ್ತಾನೋ’ is the closer and more natural equivalent of ποιήσῃ. The finite singular predicate ἐστίν is best represented with singular ‘ಆಗುತ್ತಾನೆ,’ rather than honorific/plural ‘ಆಗಿದ್ದಾರೆ.’
  naturalness: The sentence structure is natural modern standard Kannada. ‘ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆ’ and ‘ನನ್ನ ಸಹೋದರ, ಸಹೋದರಿ ಮತ್ತು ತಾಯಿ’ are idiomatic. Using ‘ಯಾರು ... ಅವನು’ gives a clear generic singular construction and permits a singular verb without the slightly discordant honorific plural.
  terminology: ‘ಚಿತ್ತ’ is an appropriate established rendering of θέλημα, and ‘ಪರಲೋಕ’ suitably renders the conventional biblical sense of οὐρανοῖς. ‘ಸಹೋದರ,’ ‘ಸಹೋದರಿ,’ and ‘ತಾಯಿ’ faithfully retain the source’s distinct familial terms.
  issues:
  - severity: medium
    issue: ‘ನೆರವೇರಿಸುತ್ತಾರೋ’ for ποιήσῃ
    rationale: Although possible, it tends to mean ‘fulfills/completes’ and may imply accomplishing the will as an objective. The idiomatic biblical collocation for ποιεῖν τὸ θέλημα is ‘ಚಿತ್ತವನ್ನು ಮಾಡು,’ preserving the broad sense of doing/acting according to it.
  - severity: low
    issue: Honorific/plural forms ‘ಅವರೇ ... ಆಗಿದ್ದಾರೆ’
    rationale: These forms are respectful in Kannada but obscure the Greek singular grammatical framing. A generic singular ‘ಯಾರು ... ಅವನು ... ಆಗುತ್ತಾನೆ’ is natural, preserves the singular form, and does not reduce the statement’s inclusive scope, which is made explicit by ‘brother, sister, and mother.’
  - severity: low
    issue: Footnote refers to ‘ಯಾವನು ... ಅವನೇ’ although the drafted wording is ‘ಯಾರು ... ಅವರೇ’
    rationale: The footnote should describe the Greek form directly and distinguish it from the Kannada rendering, rather than appearing to quote the translation’s wording.
