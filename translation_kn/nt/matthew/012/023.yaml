id: MAT.12.23
reference: Matthew 12:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: kn
  text: ಜನರೆಲ್ಲರೂ ಬೆರಗಾಗಿದ್ದರು ಮತ್ತು, “ಇವನೇ ದಾವೀದನ ಮಗನಾಗಿರಬಹುದೇ?” ಎಂದು ಹೇಳುತ್ತಿದ್ದರು.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ದಾವೀದನ ಮಗ” ಎಂಬುದು ದಾವೀದನ ವಂಶದಿಂದ ಬರಲಿದ್ದಾನೆಂದು ವಾಗ್ದಾನಗೊಂಡ ರಾಜನೂ ವಿಮೋಚಕನೂ ಆದ ಮೆಸ್ಸೀಯನನ್ನು ಸೂಚಿಸುವ ಬಿರುದು.
    reason: cross_reference
  - marker: b
    text: 'ಅಥವಾ, ಪ್ರಶ್ನೆಯ ನಿರಾಕಾರ ಛಾಯೆಯನ್ನು ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ತೋರಿಸಿದರೆ: “ಇವನು ದಾವೀದನ ಮಗನಲ್ಲವಲ್ಲ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ಬೆರಗಾಗುತ್ತಾ
  rationale: ಈ ಅಪೂರ್ಣಕಾಲದ ಕ್ರಿಯಾಪದವು ಯೇಸುವಿನ ಕೃತ್ಯಕ್ಕೆ ಜನರು ತೋರಿಸುತ್ತಿದ್ದ ಮುಂದುವರಿದ ತೀವ್ರ ಆಶ್ಚರ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಬೆರಗಾಗುತ್ತಾ’ ಎಂಬುದು ಸಹಜವಾಗಿಯೂ ಬಲವಾಗಿಯೂ ಅದನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: πάντες οἱ ὄχλοι
  choice: ಜನರೆಲ್ಲರೂ
  rationale: ಗ್ರೀಕ್‌ನ ಬಹುವಚನ ಸಮೂಹಪದವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಯಾಂತ್ರಿಕವಾಗಿ ‘ಎಲ್ಲ ಜನಸಮೂಹಗಳು’ ಎನ್ನುವುದಕ್ಕಿಂತ, ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾದ ‘ಜನರೆಲ್ಲರೂ’ ಎಂಬುದು ಸಮಗ್ರತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔλεγον
  choice: ಎಂದು ಹೇಳುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣಕಾಲವು ಜನರ ನಡುವೆ ನಡೆಯುತ್ತಿದ್ದ ಅಥವಾ ಮರುಮರು ವ್ಯಕ್ತವಾಗುತ್ತಿದ್ದ ಮಾತನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಹೇಳುತ್ತಿದ್ದರು’ ಆ ಮುಂದುವರಿದ ಕ್ರಿಯೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Μήτι
  choice: ಆಗಿರಬಹುದೇ?
  rationale: Μήτι ಸಾಮಾನ್ಯವಾಗಿ ನಿರಾಕಾರ ಉತ್ತರದ ನಿರೀಕ್ಷೆ ಅಥವಾ ಹಿಂಜರಿಕೆಯ ಪ್ರಶ್ನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ಆಗಿರಬಹುದೇ?’ ಆಶ್ಚರ್ಯಭರಿತ ಸಂದೇಹವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ; ಅದರ ಹೆಚ್ಚು ನೇರ ನಿರಾಕಾರ ಬಲವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὁ υἱὸς Δαυίδ
  choice: ದಾವೀದನ ಮಗ
  rationale: ಇದು ಮತ್ತಾಯನಲ್ಲಿ ಮೆಸ್ಸೀಯನನ್ನು ಸೂಚಿಸುವ ಪರಿಚಿತ ಬಿರುದು. ಮೂಲದ ರೂಪವನ್ನು ಉಳಿಸಿ, ಅದನ್ನು ನೇರವಾಗಿ ‘ಮೆಸ್ಸೀಯ’ ಎಂದು ವ್ಯಾಖ್ಯಾನಿಸಿಲ್ಲ.
theological_decisions:
- issue: ‘ದಾವೀದನ ಮಗ’ ಎಂಬ ಬಿರುದಿನ ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿತ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ದಾವೀದನ ಮಗ’ ಎಂಬ ಬಿರುದನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಮೆಸ್ಸೀಯ’ ಅಥವಾ ‘ದಾವೀದನ ವಂಶದ ವಾಗ್ದತ್ತ ರಾಜ’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಬಿರುದನ್ನೇ ಬಳಸುತ್ತದೆ. ಅದನ್ನು ವಿವರಣಾತ್ಮಕ ಪದದಿಂದ ಬದಲಿಸದೆ ಅದರ ಐತಿಹಾಸಿಕ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಅರ್ಥಭಾರವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅಗತ್ಯ ವಿವರಣೆ ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿದೆ.
- issue: Μήτι ಪ್ರಶ್ನೆಯ ನಿರಾಕಾರ ನಿರೀಕ್ಷೆ ಮತ್ತು ನಿಜವಾದ ವಿಚಾರಣೆಯ ನಡುವಿನ ಒತ್ತಡ
  choice: ‘ಇವನೇ ... ಆಗಿರಬಹುದೇ?’ ಎಂಬ ಸಂದೇಹಭರಿತ ಪ್ರಶ್ನೆ
  alternative: ‘ಇವನು ದಾವೀದನ ಮಗನಲ್ಲವಲ್ಲ?’
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಜನರು ಆಶ್ಚರ್ಯದಿಂದ ಸಾಧ್ಯತೆಯನ್ನು ಚರ್ಚಿಸುತ್ತಿದ್ದಾರೆ; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಮುಕ್ತವಾದ ಆಶ್ಚರ್ಯಭರಿತ ಪ್ರಶ್ನೆಯನ್ನು ಬಳಸುತ್ತದೆ. ಆದರೆ ಗ್ರೀಕ್ ಕಣದ ನಿರಾಕಾರ ನಿರೀಕ್ಷೆಯನ್ನು ಪರ್ಯಾಯ ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಜನರೆಲ್ಲರೂ’ ಕನ್ನಡದ ಸಹಜತೆಯನ್ನು ಕಾಪಾಡುತ್ತಾ πάντες οἱ ὄχλοι ಎಂಬುದರ ಸಮಗ್ರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿರುವ [a] ಮತ್ತು [b] ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಪಾದಟಿಪ್ಪಣಿಗಳಿಗೆ ನೇರವಾಗಿ ಹೊಂದಿವೆ.
