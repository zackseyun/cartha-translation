id: MAT.12.26
reference: Matthew 12:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: kn
  text: ಸೈತಾನನು ಸೈತಾನನನ್ನೇ ಹೊರಹಾಕುತ್ತಿದ್ದರೆ[a], ಅವನು ತನ್ನ ವಿರುದ್ಧವೇ ವಿಭಜಿತನಾಗಿದ್ದಾನೆ[b]. ಹಾಗಾದರೆ ಅವನ ರಾಜ್ಯವು ಹೇಗೆ ನಿಲ್ಲುವುದು[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹೊರಗೆ ಓಡಿಸುತ್ತಿದ್ದರೆ.’
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ತನ್ನ ವಿರುದ್ಧವೇ ವಿಭಜಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ.’
    reason: lexical_alternative
  - marker: c
    text: ಅಥವಾ, ‘ಹಾಗಾದರೆ ಅವನ ರಾಜ್ಯವು ಹೇಗೆ ಸ್ಥಿರವಾಗಿ ಉಳಿಯುವುದು?’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: …ವುದಾದರೆ
  rationale: ಹಿಂದಿನ ವಾದದೊಂದಿಗೆ ಇರುವ ಸಂಬಂಧವನ್ನು ಷರತ್ತಿನ ರೂಪದಲ್ಲಿ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಮುಂದುವರಿಸುತ್ತದೆ; ವಾಕ್ಯಾರಂಭದ καί ಅನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಎಂದು ಅನುವಾದಿಸುವುದು ಇಲ್ಲಿ ಕನ್ನಡದಲ್ಲಿ ಕೃತಕವಾಗುತ್ತದೆ.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: ಸೈತಾನನು / ಸೈತಾನನನ್ನೇ
  rationale: ಹೆಸರು/ಬಿರುದನ್ನು ರೂಢಿಯಾದ ಕನ್ನಡ ಲಿಪ್ಯಂತರದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ; ಎರಡನೆಯ ಉಲ್ಲೇಖದಲ್ಲಿನ ವಾದಾತ್ಮಕ ಒತ್ತನ್ನು ‘ಏ’ ಮೂಲಕ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἐκβάλλει
  choice: ಹೊರಗೆ ಓಡಿಸುವುದು
  rationale: ದುಷ್ಟಾತ್ಮಗಳನ್ನು ಹೊರಡಿಸುವ ಸಂದರ್ಭದಲ್ಲಿನ ‘ಹೊರಹಾಕು/ಓಡಿಸು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ನೀಡುತ್ತದೆ.
- source_word: ἐφ’ ἑαυτὸν
  choice: ತನಗೆ ತಾನೇ ವಿರುದ್ಧವಾಗಿ
  rationale: ἐπί + ಆತ್ಮವಾಚಕ ಸರ್ವನಾಮದ ಆಂತರಿಕ ವಿರೋಧದ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐμερίσθη
  choice: ವಿಭಜಿತನಾಗಿದ್ದಾನೆ
  rationale: ಅಓರಿಸ್ಟ್ ಕರ್ಮಣಿ ರೂಪವು ಊಹಿತ ಕ್ರಿಯೆಯಿಂದ ಉಂಟಾದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ಫಲಿತಸ್ಥಿತಿ ರೂಪವು ಕಾಲ ಮತ್ತು ಸ್ಥಿತಿಯ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πῶς οὖν
  choice: ಹಾಗಾದರೆ … ಹೇಗೆ
  rationale: οὖνನ ತಾರ್ಕಿಕ ನಿರ್ಣಯ ಮತ್ತು πῶςನ ಪ್ರಶ್ನಾರ್ಥ ಎರಡನ್ನೂ ಸಹಜ ಕನ್ನಡ ಪದಕ್ರಮದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: σταθήσεται
  choice: ನಿಲ್ಲಬಲ್ಲದು
  rationale: ರಾಜ್ಯವು ಸ್ಥಿರವಾಗಿ ಉಳಿಯುವ ರೂಪಕವನ್ನು ‘ನಿಲ್ಲು’ ಮೂಲಕ ಉಳಿಸಿ, ಪ್ರಶ್ನೆಯ ವ್ಯವಹಾರಿಕ ಅಸಾಧ್ಯತೆಯನ್ನು ‘ಬಲ್ಲದು’ ಮೂಲಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: ಅವನ ರಾಜ್ಯವು
  rationale: βασιλείαಯ ಆಳ್ವಿಕೆ/ರಾಜ್ಯ ಎಂಬ ಅರ್ಥಗಳಲ್ಲಿ, ವಿಭಜಿತ ಅಧಿಪತ್ಯದ ಚಿತ್ರಣಕ್ಕೆ ‘ರಾಜ್ಯ’ ಅತ್ಯಂತ ನೇರ ಮತ್ತು ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ಸೈತಾನನು ತನ್ನನ್ನೇ ಹೊರಡಿಸುವುದು ಮತ್ತು ಸ್ವವಿಭಜನೆಯ ತರ್ಕ
  choice: ಸೈತಾನನು ಸೈತಾನನನ್ನೇ ಹೊರಡಿಸಿದರೆ ಅವನು ತನಗೆ ತಾನೇ ವಿರುದ್ಧವಾಗಿ ವಿಭಜಿತನಾಗಿದ್ದು, ಅವನ ರಾಜ್ಯವು ನಿಲ್ಲಲಾರದು ಎಂಬ ಅಸಂಭವತಾಧಾರಿತ ವಾದವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಸುತ್ತಲಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ‘ವಿಭಜಿತ ಮನೆ’ ಎಂಬ ಚಿತ್ರಣವನ್ನು ಇಲ್ಲಿ ವಿವರಣಾತ್ಮಕವಾಗಿ ಸೇರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಆಂತರಿಕ ವಿಭಜನೆ ಮತ್ತು ರಾಜ್ಯದ ಅಸ್ಥಿರತೆಯನ್ನಷ್ಟೇ ನೇರವಾಗಿ ಹೇಳುತ್ತದೆ; ಹೆಚ್ಚುವರಿ ಚಿತ್ರಣ ಅಥವಾ ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸದೆ ಅದರ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಗ್ರೀಕ್‌ನ ತಾರ್ಕಿಕ ಷರತ್ತು, ಆಂತರಿಕ ವಿರೋಧ ಮತ್ತು ‘ನಿಲ್ಲುವುದು’ ಎಂಬ ರೂಪಕವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದ ಸಹಜ ಪದಕ್ರಮವನ್ನು ಅನುಸರಿಸಲಾಗಿದೆ.
