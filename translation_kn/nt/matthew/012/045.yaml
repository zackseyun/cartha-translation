id: MAT.12.45
reference: Matthew 12:45
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: kn
  text: ಆಗ ಅದು ಹೋಗಿ, ತನಗಿಂತಲೂ ಹೆಚ್ಚು ದುಷ್ಟವಾದ ಬೇರೆ ಏಳು ಆತ್ಮಗಳನ್ನು ತನ್ನೊಂದಿಗೆ ಕರೆದುಕೊಂಡು ಬರುತ್ತದೆ[a]. ಅವು ಒಳಗೆ ಪ್ರವೇಶಿಸಿ ಅಲ್ಲಿ ನೆಲೆಸುತ್ತವೆ. ಆ ಮನುಷ್ಯನ ಕೊನೆಯ ಸ್ಥಿತಿ ಮೊದಲಿನ ಸ್ಥಿತಿಗಿಂತ ಕೆಟ್ಟದಾಗುತ್ತದೆ[b]. ಈ ದುಷ್ಟ ಪೀಳಿಗೆಗೂ ಹಾಗೆಯೇ ಆಗುವುದು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ತನಗಿಂತಲೂ ಹೆಚ್ಚು ದುಷ್ಟವಾದ ವಿಭಿನ್ನ ಏಳು ಆತ್ಮಗಳನ್ನು.’
    reason: lexical_alternative
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಪದಶಃ, ‘ಆ ಮನುಷ್ಯನ ಕೊನೆಯ ಸಂಗತಿಗಳು ಮೊದಲಿನ ಸಂಗತಿಗಳಿಗಿಂತ ಕೆಟ್ಟವಾಗುತ್ತವೆ’; ಅಂದರೆ ಅವನ ಕೊನೆಯ ಸ್ಥಿತಿ ಮೊದಲಿನ ಸ್ಥಿತಿಗಿಂತ ಕೆಟ್ಟದಾಗುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಸೂಚಿಸುವ ಕಾಲಸೂಚಕ ಕ್ರಿಯಾವಿಶೇಷಣವನ್ನು ಸಹಜ ಹಾಗೂ ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πορεύεται
  choice: ಅದು ಹೋಗಿ
  rationale: ಅಶುದ್ಧಾತ್ಮವನ್ನು ಸೂಚಿಸುವ ನಪುಂಸಕ ಸರ್ವನಾಮದೊಂದಿಗೆ, ಜೀವಂತ ನಿರೂಪಣೆಯಲ್ಲಿರುವ ‘ಹೋಗುತ್ತದೆ’ ಎಂಬ ಸರಳ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: ತನ್ನೊಂದಿಗೆ ಕರೆದುಕೊಂಡು ಬರುತ್ತದೆ
  rationale: ತನ್ನ ಜೊತೆಯಲ್ಲಿ ಇತರ ಆತ್ಮಗಳನ್ನು ಕರೆತರುವ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಪರಸ್ಪರ ಸಂಗಡಿಗತ್ವದ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: ಬೇರೆ ಏಳು ಆತ್ಮಗಳನ್ನು
  rationale: ἕτερα ಎಂಬುದು ಮೊದಲನೆಯ ಆತ್ಮಕ್ಕೆ ಹೆಚ್ಚುವರಿಯಾದ ‘ಬೇರೆ’ ಆತ್ಮಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; πνεύματα ಎಂಬ ಮೂಲಪದವನ್ನು ‘ಆತ್ಮಗಳು’ ಎಂದು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: πονηρότερα ἑαυτοῦ
  choice: ತನಗಿಂತ ಹೆಚ್ಚು ದುಷ್ಟವಾಗಿರುವ
  rationale: ಹೋಲಿಕೆಯ ರೂಪವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಿ, ಅವು ಮೊದಲನೆಯ ಆತ್ಮಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ದುಷ್ಟತ್ವವುಳ್ಳವು ಎಂದು ಹೇಳುತ್ತದೆ.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: ಅವು ಒಳಗೆ ಪ್ರವೇಶಿಸಿ ಅಲ್ಲಿ ವಾಸಿಸುತ್ತವೆ
  rationale: ಗ್ರೀಕ್ ಕೃದಂತರದ ಕ್ರಿಯಾಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡದ ಸಂಯುಕ್ತ ಕ್ರಿಯೆಯಾಗಿ ನೀಡುತ್ತದೆ. ನಪುಂಸಕ ಬಹುವಚನ ಕರ್ತೃಗೆ ಏಕವಚನ ಕ್ರಿಯಾಪದ ಬರುವ ಗ್ರೀಕ್ ಬಳಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥಾನುಸಾರ ಬಹುವಚನವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: ಆ ಮನುಷ್ಯನ ಕೊನೆಯ ಸ್ಥಿತಿ
  rationale: ಪದಶಃ ‘ಆ ಮನುಷ್ಯನ ಕೊನೆಯ ಸಂಗತಿಗಳು’ ಎಂಬ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥವನ್ನು, ಅವನ ಅಂತಿಮ ಪರಿಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: χείρονα τῶν πρώτων
  choice: ಮೊದಲಿನ ಸ್ಥಿತಿಗಿಂತ ಕೆಟ್ಟದಾಗುತ್ತದೆ
  rationale: ಆರಂಭದ ಮತ್ತು ಕೊನೆಯ ಪರಿಸ್ಥಿತಿಗಳ ಹೋಲಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಸ್ಥಿತಿ’ಯನ್ನು ಪುನರಾವರ್ತಿಸಲಾಗಿದೆ.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: ಈ ದುಷ್ಟ ಪೀಳಿಗೆಗೂ ಹಾಗೆಯೇ ಆಗುವುದು
  rationale: ಉದಾಹರಣೆಯನ್ನು ಆ ಕಾಲದ ದುಷ್ಟ ಪೀಳಿಗೆಗೆ ಅನ್ವಯಿಸುವ ವಾಕ್ಯದ ಒತ್ತನ್ನು ಸಹಜ ಪದಕ್ರಮದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: πνεύματα ಎಂಬ ದೆವ್ವಸಂಬಂಧಿತ ಪದದ ನಿರೂಪಣೆ
  choice: ಆತ್ಮಗಳು
  alternative: ದೆವ್ವಗಳು
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಆತ್ಮಗಳು’ ಎಂದೇ ಇದೆ; ಹಿಂದಿನ ಸಂದರ್ಭವು ಅವುಗಳ ಅಶುದ್ಧ ಸ್ವಭಾವವನ್ನು ತಿಳಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾದ ‘ದೆವ್ವಗಳು’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- issue: ἀνθρώπου ಎಂಬ ಪದದ ಲಿಂಗಸೂಚಕ ನಿರೂಪಣೆ
  choice: ಆ ಮನುಷ್ಯನ
  alternative: ಆ ವ್ಯಕ್ತಿಯ
  rationale: ಉದಾಹರಣೆಯಲ್ಲಿರುವ ಏಕವಚನ ಪುಲ್ಲಿಂಗ ರೂಪವನ್ನು ‘ಮನುಷ್ಯ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ; ಹೀಗೆ ಮೂಲದ ಪ್ರತಿನಿಧಿಕ ವ್ಯಕ್ತಿಚಿತ್ರವನ್ನು ಲಿಂಗತಟಸ್ಥಗೊಳಿಸದೆ ಅನುವಾದಿಸಲಾಗಿದೆ.
- issue: ಕೊನೆಯ ಮತ್ತು ಮೊದಲಿನ ‘ಸಂಗತಿಗಳು’ ಎಂಬ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥ
  choice: ಕೊನೆಯ ಸ್ಥಿತಿ … ಮೊದಲಿನ ಸ್ಥಿತಿಗಿಂತ
  alternative: ಕೊನೆಯ ಸಂಗತಿಗಳು … ಮೊದಲಿನ ಸಂಗತಿಗಳಿಗಿಂತ
  rationale: ಇದು ವ್ಯಕ್ತಿಯ ಅಂತಿಮ ಪರಿಸ್ಥಿತಿಯನ್ನು ಹಿಂದಿನ ಪರಿಸ್ಥಿತಿಯೊಂದಿಗೆ ಹೋಲಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು. ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿದರೂ, ತೀರ್ಪು ಅಥವಾ ರಕ್ಷಣೆಯ ಕುರಿತು ಹೆಚ್ಚುವರಿ ತಾತ್ತ್ವಿಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಅನುಕೂಲವಾದ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ವಾಸಿಸುತ್ತವೆ,’ ‘ಕೊನೆಯ ಸ್ಥಿತಿ,’ ಮತ್ತು ‘ದುಷ್ಟ ಪೀಳಿಗೆ’ ಎಂಬ ಪದಗಳು ಮೂಲದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತಿವೆ.
