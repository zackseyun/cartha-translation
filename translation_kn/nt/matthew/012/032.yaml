id: MAT.12.32
reference: Matthew 12:32
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: kn
  text: ಯಾರಾದರೂ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಒಂದು ಮಾತು ಹೇಳಿದರೆ[a], ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದು; ಆದರೆ ಯಾರಾದರೂ ಪವಿತ್ರಾತ್ಮನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಮಾತನಾಡಿದರೆ, ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದಿಲ್ಲ—ಈ ಯುಗದಲ್ಲಾಗಲಿ[b], ಬರಲಿರುವ ಯುಗದಲ್ಲಾಗಲಿ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಒಂದು ಮಾತು ಹೇಳಿದರೆ” ಎಂಬುದನ್ನು “ಒಂದು ಮಾತನ್ನಾಡಿದರೆ” ಅಥವಾ “ಒಂದು ಮಾತು ಉಚ್ಚರಿಸಿದರೆ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಇಲ್ಲಿ ಗ್ರೀಕ್ αἰών ಎಂದರೆ “ಯುಗ”; ಕೆಲವು ಸಾಂಪ್ರದಾಯಿಕ ಅನುವಾದಗಳಲ್ಲಿ “ಲೋಕ” ಎಂದಿದೆ.
    reason: lexical_alternative
  - marker: c
    text: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ಅಕ್ಷರಶಃ “ಬರಲಿರುವುದರಲ್ಲಾಗಲಿ” ಎಂದಿದ್ದು, ಹಿಂದಿನ ವಾಕ್ಯಾಂಶದಲ್ಲಿರುವ “ಯುಗ” ಎಂಬ ಪದವನ್ನು ಇಲ್ಲಿ ಅಧ್ಯಾಹರಿಸಲಾಗಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: ಯಾರಾದರೂ ... ಆದರೆ ಯಾರಾದರೂ
  rationale: ಷರತ್ತಿನೊಡನೆ ಬರುವ ಅನಿರ್ದಿಷ್ಟ ಸಂಬಂಧವಾಚಕ ರೂಪವು ಯಾರನ್ನೂ ಹೊರತುಪಡಿಸದ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಕೊಡುತ್ತದೆ; ಆ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: εἴπῃ λόγον
  choice: ಒಂದು ಮಾತು ಹೇಳಿದರೆ
  rationale: λόγον ಎಂಬ ನಾಮಪದದ ಸ್ಪಷ್ಟ ಉಪಸ್ಥಿತಿಯನ್ನು ಉಳಿಸುತ್ತಾ, λέγω ಜೊತೆಗಿನ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κατὰ
  choice: ವಿರುದ್ಧವಾಗಿ
  rationale: ಷಷ್ಠೀ ವಿಭಕ್ತಿಯೊಡನೆಯ κατά ಇಲ್ಲಿ ಒಬ್ಬರ ವಿರುದ್ಧ ನಿರ್ದೇಶಿಸಲಾದ ವಿರೋಧಾತ್ಮಕ ಮಾತನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರ
  rationale: ಈ ಸ್ವನಾಮಧೇಯ/ಬಿರುದಿನ ಸ್ಥಾಪಿತ ಕನ್ನಡ ರೂಪವನ್ನು ಉಳಿಸಿ, ಅದರ ಮೆಸ್ಸೀಯ ಮತ್ತು ಅಂತ್ಯಕಾಲಸಂಬಂಧಿ ಪ್ರತಿಧ್ವನಿಗಳನ್ನು ಸಮತಟ್ಟಾಗಿಸದೆ ಬಿಡುತ್ತದೆ.
- source_word: ἀφεθήσεται αὐτῷ
  choice: ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನೂ, ಕ್ಷಮಿಸಲ್ಪಡುವುದು ಹೇಳಲಾದ ಅಪರಾಧವೇ ಎಂಬ ಸೂಚನೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ಅವರಿಗೆ’ ಎಂಬುದು ಲಿಂಗನಿರಪೇಕ್ಷ ಸಾಮಾನ್ಯ ವ್ಯಕ್ತಿಯನ್ನು ಸಹಜ ಗೌರವ ರೂಪದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: ಪವಿತ್ರಾತ್ಮ
  rationale: ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಈ ದೈವಿಕ ಬಿರುದಿನ ಪ್ರಮಾಣಿತ ಮತ್ತು ಗೌರವಯುತ ರೂಪ.
- source_word: οὐκ ἀφεθήσεται αὐτῷ
  choice: ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದಿಲ್ಲ
  rationale: ಮೊದಲ ವಾಕ್ಯಾಂಶದ ಕರ್ಮಣಿ ರಚನೆಯನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಿ, ಎರಡರ ನಡುವಿನ ತೀಕ್ಷ್ಣ ವೈರುಧ್ಯವನ್ನು ಕಾಯುತ್ತದೆ.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: ಈ ಯುಗದಲ್ಲಾಗಲಿ
  rationale: αἰών ಇಲ್ಲಿ ಸ್ಥಳಾತ್ಮಕ ‘ಲೋಕ’ಕ್ಕಿಂತ ಕಾಲಘಟ್ಟವಾದ ‘ಯುಗ’ವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮುಂದಿನ ಯುಗದೊಡನೆಯ ಕಾಲಾತ್ಮಕ ವೈರುಧ್ಯವನ್ನೂ ಇದು ಉಳಿಸುತ್ತದೆ.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: ಬರಲಿರುವುದರಲ್ಲಾಗಲಿ
  rationale: μέλλοντι ಎಂಬ ನಾಮಪದೀಕೃತ ಕೃದಂತದಲ್ಲಿ ‘ಯುಗ’ ಎಂಬ ಪದ ಹಿಂದಿನ ವಾಕ್ಯಾಂಶದಿಂದ ಅಧ್ಯಾಹಾರವಾಗುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿಯೂ ಆ ಅಂಡಾಕಾರದ ರಚನೆಯನ್ನು ಗ್ರಹಿಸಬಹುದಾದ ರೀತಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: αἰών / μέλλων ಎಂಬ ಕಾಲಾತ್ಮಕ ವೈರುಧ್ಯ
  choice: ಈ ಯುಗದಲ್ಲಾಗಲಿ, ಬರಲಿರುವುದರಲ್ಲಾಗಲಿ
  alternative: ಈ ಲೋಕದಲ್ಲಾಗಲಿ, ಬರಲಿರುವ ಲೋಕದಲ್ಲಾಗಲಿ; ಅಥವಾ ಈ ಯುಗದಲ್ಲಾಗಲಿ, ಬರಲಿರುವ ಯುಗದಲ್ಲಾಗಲಿ
  rationale: ಮೂಲಪಾಠವು ಸ್ಥಳಾತ್ಮಕ ಎರಡು ಲೋಕಗಳಿಗಿಂತ ಈಗಿನ ಮತ್ತು ಮುಂದಿನ ಯುಗಗಳನ್ನು ಎದುರುನಿಲ್ಲಿಸುತ್ತದೆ. ‘ಬರಲಿರುವುದು’ ಎಂಬ ರೂಪವು ಹಿಂದಿನ ‘ಯುಗ’ವನ್ನು ಅಧ್ಯಾಹರಿಸುವ ಗ್ರೀಕ್ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಹೆಚ್ಚು ಸ್ಪಷ್ಟ ರೂಪವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ಕ್ಷಮಿಸಲಾಗದ ಅಪರಾಧದ ಸ್ವರೂಪ
  choice: ಪವಿತ್ರಾತ್ಮನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಮಾತನಾಡುವುದು ಎಂಬ ಪಾಠದ ಎಚ್ಚರಿಕೆಯನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ಉಳಿಸುವುದು
  alternative: ಇದನ್ನು ಯೇಸುವಿನ ಭೂತೋಚ್ಚಾಟನೆಗಳ ವಿರುದ್ಧದ ನಿರ್ದಿಷ್ಟ ಐತಿಹಾಸಿಕ ಆರೋಪಕ್ಕೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವುದು; ಅಥವಾ ಅಂತಿಮ ಪಶ್ಚಾತ್ತಾಪರಾಹಿತ್ಯವೆಂದು ನೇರವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು
  rationale: ಈ ವಚನವು ಪರಿಣಾಮವನ್ನು ಹೇಳುತ್ತದೆ, ಆದರೆ ಆ ಅಪರಾಧಕ್ಕೆ ನಂತರದ ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿಖರ ವ್ಯಾಖ್ಯಾನವನ್ನು ನೀಡುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನುವಾದವು ನಿಜವಾದ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ. ‘ಯಾರಾದರೂ ... ಅವರಿಗೆ’ ಎಂಬ ಗೌರವಪೂರ್ಣ ಸಾಮಾನ್ಯ ರೂಪವು ಲಿಂಗನಿರಪೇಕ್ಷತೆಯನ್ನು ಕಾಯುತ್ತದೆ. ಮೂಲದ ಕರ್ಮಣಿ ವಾಕ್ಯರಚನೆ ಮತ್ತು ಈಗಿನ/ಮುಂದಿನ ಯುಗಗಳ ನಡುವಿನ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಅತಿವ್ಯಾಖ್ಯಾನವಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
