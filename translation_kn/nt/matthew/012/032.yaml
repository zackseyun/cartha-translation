review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the two indefinite conditional clauses, the contrast between the Son of Man and the Holy Spirit, the future passive of forgiveness, and the temporal contrast between the present and coming age. The explicit rendering of the implied noun in the final phrase is preferable in Kannada and does not add meaning, since αἰῶν is clearly supplied from the preceding phrase.
  naturalness: Most of the verse is natural modern standard Kannada. However, “ಬರಲಿರುವುದರಲ್ಲಾಗಲಿ” is an overly literal reproduction of the Greek ellipsis and is less clear and idiomatic in Kannada. “ಬರಲಿರುವ ಯುಗದಲ್ಲಾಗಲಿ” is natural, immediately intelligible, and preserves the source sense.
  terminology: “ಮನುಷ್ಯಕುಮಾರ,” “ಪವಿತ್ರಾತ್ಮ,” “ಕ್ಷಮಿಸಲ್ಪಡುವುದು,” and “ಯುಗ” are appropriate standard terms. The impersonal passive construction appropriately retains the Greek focus on the offense being forgiven.
  issues:
  - severity: low
    issue: The final temporal phrase uses an unnatural ellipsis.
    rationale: Greek τῷ μέλλοντι elliptically refers to αἰῶνι, but Kannada “ಬರಲಿರುವುದರಲ್ಲಾಗಲಿ” can sound as though it refers to an unspecified thing rather than to the coming age. Supplying “ಯುಗ” is faithful and idiomatic.
  revised_text: ಯಾರಾದರೂ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಒಂದು ಮಾತು ಹೇಳಿದರೆ[a], ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದು; ಆದರೆ ಯಾರಾದರೂ ಪವಿತ್ರಾತ್ಮನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಮಾತನಾಡಿದರೆ, ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದಿಲ್ಲ—ಈ ಯುಗದಲ್ಲಾಗಲಿ[b], ಬರಲಿರುವ ಯುಗದಲ್ಲಾಗಲಿ[c].
