revisions:
- from: ಯಾರಾದರೂ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಒಂದು ಮಾತು ಹೇಳಿದರೆ[a], ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದು; ಆದರೆ ಯಾರಾದರೂ ಪವಿತ್ರಾತ್ಮನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಮಾತನಾಡಿದರೆ, ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದಿಲ್ಲ—ಈ ಯುಗದಲ್ಲಾಗಲಿ[b], ಬರಲಿರುವುದರಲ್ಲಾಗಲಿ[c].
  to: ಯಾರಾದರೂ ಮನುಷ್ಯಕುಮಾರನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಒಂದು ಮಾತು ಹೇಳಿದರೆ[a], ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದು; ಆದರೆ ಯಾರಾದರೂ ಪವಿತ್ರಾತ್ಮನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಮಾತನಾಡಿದರೆ, ಅದು ಅವರಿಗೆ ಕ್ಷಮಿಸಲ್ಪಡುವುದಿಲ್ಲ—ಈ ಯುಗದಲ್ಲಾಗಲಿ[b], ಬರಲಿರುವ ಯುಗದಲ್ಲಾಗಲಿ[c].
  rationale: ಕನ್ನಡದಲ್ಲಿ ಅಂತಿಮ ವಾಕ್ಯಾಂಶವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ “ಬರಲಿರುವ ಯುಗದಲ್ಲಾಗಲಿ” ಎಂದು ಮಾಡಲಾಗಿದೆ. ಇದು ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಅಧ್ಯಾಹೃತ αἰών ಅನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕಾಲಾತ್ಮಕ ವೈರುಧ್ಯವನ್ನೂ ಮೂಲದ ಎಚ್ಚರಿಕೆಯ ಬಲವನ್ನೂ ಬದಲಾಯಿಸುವುದಿಲ್ಲ. ಟಿಪ್ಪಣಿ ಗ್ರೀಕ್‌ನ ಸಂಕ್ಷಿಪ್ತ ರೂಪವನ್ನು ದಾಖಲಿಸುತ್ತದೆ.
