id: MAT.12.28
reference: Matthew 12:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: kn
  text: ಆದರೆ ನಾನು ದೇವರ ಆತ್ಮನ ಮೂಲಕ[a] ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕುತ್ತಿದ್ದರೆ, ಆಗ ದೇವರ ರಾಜ್ಯವು ನಿಮ್ಮ ಮೇಲೆ ಬಂದಿದೆ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ದೇವರ ಆತ್ಮನಲ್ಲಿ.’ ಗ್ರೀಕ್ ಪದಗುಚ್ಛವನ್ನು ಎರಡೂ ರೀತಿಯಲ್ಲಿ ಅನುವಾದಿಸಬಹುದು; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅದು ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂದು ತೆಗೆದುಕೊಳ್ಳಲಾಗಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ನಿಮ್ಮನ್ನು ತಲುಪಿದೆ’ ಅಥವಾ ‘ನಿಮ್ಮ ಮೇಲೆ ಬಂದು ತಲುಪಿದೆ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಯೇಸುವಿನ ಕಾರ್ಯಗಳಲ್ಲಿ ದೇವರ ರಾಜ್ಯವು ಕೇಳುಗರನ್ನು ತಲುಪಿದೆ ಎಂಬುದಕ್ಕೆ ಒತ್ತು ನೀಡುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ಆದರೆ … ಇದ್ದರೆ
  rationale: δέ ಸೂಚಿಸುವ ಸೌಮ್ಯವಾದ ವೈದೃಶ್ಯವನ್ನೂ εἰಯ ಷರತ್ತನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν πνεύματι θεοῦ
  choice: ದೇವರ ಆತ್ಮನ ಮೂಲಕ
  rationale: ἐν ಜೊತೆಗೆ ಚತುರ್ಥೀ ವಿಭಕ್ತಿ ಇಲ್ಲಿ ಸಾಧನ ಅಥವಾ ಕರ್ತೃತ್ವವನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಮೂಲಕ’ ಎಂಬುದು ದೆವ್ವಗಳನ್ನು ಹೊರಗಟ್ಟುವ ಕಾರ್ಯದಲ್ಲಿ ದೇವರ ಆತ್ಮನ ಕ್ರಿಯಾಶೀಲತೆಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಆತ್ಮನಲ್ಲಿ’ ಎಂಬ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐγὼ
  choice: ನಾನು
  rationale: ಗ್ರೀಕ್‌ನ ಸ್ಪಷ್ಟ ಸರ್ವನಾಮವು ವಾದದಲ್ಲಿ ಒತ್ತನ್ನು ಹೊಂದಿರುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿಯೂ ಸರ್ವನಾಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐκβάλλω
  choice: ಹೊರಗಟ್ಟುತ್ತಿದ್ದರೆ
  rationale: ἐκβάλλωಯ ಬಲವಂತವಾಗಿ ಹೊರಗೆ ಕಳುಹಿಸುವ ಅರ್ಥವನ್ನು ದೆವ್ವಬಿಡಿಸುವ ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τὰ δαιμόνια
  choice: ದೆವ್ವಗಳನ್ನು
  rationale: ದೈವವಿರೋಧಿ ಆತ್ಮಿಕ ಜೀವಿಗಳನ್ನು ಸೂಚಿಸುವ δαιμόνιαಗೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ ಸಮಾನಾರ್ಥಕ.
- source_word: ἄρα
  choice: ಆಗ
  rationale: ಹಿಂದಿನ ಷರತ್ತಿನಿಂದ ಬರುವ ತಾರ್ಕಿಕ ತೀರ್ಮಾನವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἔφθασεν
  choice: ಬಂದಿದೆ
  rationale: φθάνω ಇಲ್ಲಿ ತಲುಪುವುದು ಅಥವಾ ಆಗಮಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಪೂರ್ಣಗೊಂಡ ಆಗಮನದ ಈಗಿನ ಪ್ರಸ್ತುತತೆಯನ್ನು ‘ಬಂದಿದೆ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐφ’ ὑμᾶς
  choice: ನಿಮ್ಮ ಮೇಲೆ
  rationale: ἐπί ಜೊತೆಗೆ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯು ಅವರವರೆಗೆ ತಲುಪಿದ ಚಲನೆಯನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ. ‘ನಿಮ್ಮ ಮೇಲೆ’ ಎಂಬುದು ಮೂಲದ ಜೀವಂತಿಕೆಯನ್ನೂ ಸಾಧ್ಯವಾದ ಮುಖಾಮುಖಿ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ದೇವರ ರಾಜ್ಯವು
  rationale: ಇದು ದೇವರ ಅರಸತ್ವ ಮತ್ತು ಆಳ್ವಿಕೆಯ ವಲಯ—ಎರಡನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲ ಸ್ಥಿರ ಹಾಗೂ ಸ್ಪಷ್ಟ ಕನ್ನಡ ರೂಪ; ಅರ್ಥವನ್ನು ಕೇವಲ ಅಮೂರ್ತ ‘ಆಳ್ವಿಕೆ’ಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಯೇಸುವಿನ ದೆವ್ವಬಿಡಿಸುವ ಕಾರ್ಯಕ್ಕೂ ದೇವರ ರಾಜ್ಯಕ್ಕೂ ಇರುವ ಸಂಬಂಧ
  choice: ದೇವರ ಆತ್ಮನ ಮೂಲಕ ಯೇಸು ದೆವ್ವಗಳನ್ನು ಹೊರಗಟ್ಟುವುದು, ದೇವರ ರಾಜ್ಯವು ಕೇಳುಗರ ಮೇಲೆ ನಿಜವಾಗಿಯೂ ಈಗಾಗಲೇ ತಲುಪಿದೆ ಎಂಬುದಕ್ಕೆ ಸಾಕ್ಷಿಯಾಗಿದೆ.
  alternative: ರಾಜ್ಯವು ಕೇವಲ ಸಮೀಪಿಸಿದೆ, ಇನ್ನೂ ಬಂದಿಲ್ಲ; ಅಥವಾ ಈ ಮಾತು ಭವಿಷ್ಯದ ಅಂತಿಮ ನೆರವೇರಿಕೆಯನ್ನು ಮಾತ್ರ ಸೂಚಿಸುತ್ತದೆ.
  rationale: ἔφθασεν ಆಗಮನ ಅಥವಾ ತಲುಪುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಯೇಸುವಿನ ಇಂದಿನ ಕಾರ್ಯಗಳಲ್ಲಿ ದೇವರ ರಾಜಾಧಿಪತ್ಯ ಪ್ರವೇಶಿಸಿದೆ ಎಂಬುದೇ ವಾದದ ತೂಕ. ಇದು ಭವಿಷ್ಯದ ಪೂರ್ಣತೆಯನ್ನು ನಿರಾಕರಿಸದೆ ಈಗಿನ ಆಗಮನವನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: ‘ದೇವರ ಆತ್ಮ’ ಎಂಬುದರ ಉಲ್ಲೇಖ
  choice: ಇದು ಕೇವಲ ನಿರ್ಜೀವ ದೈವಿಕ ಶಕ್ತಿಯಲ್ಲ, ದೇವರ ಆತ್ಮನ ವೈಯಕ್ತಿಕ ಉಲ್ಲೇಖವಾಗಿದೆ.
  alternative: ಸಾಮಾನ್ಯ ದೈವಿಕ ಬಲ ಅಥವಾ ಶಕ್ತಿಯ ಉಲ್ಲೇಖ.
  rationale: πνεύματι θεοῦ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸುವಿನ ದೆವ್ವಬಿಡಿಸುವ ಕಾರ್ಯದ ದೈವಿಕ ಕರ್ತನಾದ ಆತ್ಮನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ಆತ್ಮನ’ ಎಂಬ ಪುಲ್ಲಿಂಗ ಸಂಬಂಧರೂಪವು ಇದನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಷರತ್ತು–ತೀರ್ಮಾನ ರಚನೆ, ‘ನಾನು’ ಎಂಬ ಒತ್ತು, ಆತ್ಮನ ಕರ್ತೃತ್ವ, ಹಾಗೂ ರಾಜ್ಯವು ‘ನಿಮ್ಮ ಮೇಲೆ’ ಬಂದಿರುವ ಜೀವಂತ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
