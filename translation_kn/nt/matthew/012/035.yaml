id: MAT.12.35
reference: Matthew 12:35
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: kn
  text: ಒಳ್ಳೆಯ ಮನುಷ್ಯನು[a] ತನ್ನ ಒಳ್ಳೆಯ ಬೊಕ್ಕಸದಿಂದ ಒಳ್ಳೆಯ ಸಂಗತಿಗಳನ್ನು[b] ಹೊರತರುತ್ತಾನೆ; ದುಷ್ಟ ಮನುಷ್ಯನು ತನ್ನ ದುಷ್ಟ ಬೊಕ್ಕಸದಿಂದ ದುಷ್ಟ ಸಂಗತಿಗಳನ್ನು ಹೊರತರುತ್ತಾನೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಇಲ್ಲಿ ‘ಮನುಷ್ಯ’ ಎಂಬುದು ಗಂಡಸನ್ನು ಮಾತ್ರವಲ್ಲ, ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಸಾಮಾನ್ಯ ಅರ್ಥದಲ್ಲಿದೆ; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಈ ಪದವು ಪುಲ್ಲಿಂಗ ಏಕವಚನದಲ್ಲಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ತಕ್ಷಣದ ಸಂದರ್ಭವು ಮಾತುಗಳ ಕುರಿತಾದದ್ದು; ಆದ್ದರಿಂದ ‘ಒಳ್ಳೆಯ ಸಂಗತಿಗಳು’ ಮತ್ತು ‘ದುಷ್ಟ ಸಂಗತಿಗಳು’ ಎಂಬವು ವಿಶೇಷವಾಗಿ ಮಾತುಗಳನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: ಒಳ್ಳೆಯ / ಒಳ್ಳೆಯವುಗಳು
  rationale: ವ್ಯಕ್ತಿಯನ್ನೂ ಅವನಿಂದ ಹೊರಬರುವವುಗಳನ್ನೂ ವರ್ಣಿಸುವ ಗ್ರೀಕ್ ಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸಿ, ನೈತಿಕ ವ್ಯತ್ಯಾಸವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἄνθρωπος
  choice: ಮನುಷ್ಯ
  rationale: ಗ್ರೀಕ್‌ನ ಪ್ರತಿನಿಧಿಕ ಏಕವಚನವನ್ನು ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ; ಇಲ್ಲಿ ಇದು ಗಂಡಸನ್ನು ಮಾತ್ರ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: θησαυροῦ
  choice: ಬೊಕ್ಕಸ
  rationale: ಒಳಗೆ ಸಂಗ್ರಹವಾಗಿರುವ ನಿಧಿಯಿಂದ ಹೊರಬರುವುದೆಂಬ ರೂಪಕವನ್ನು ‘ಸಂಗ್ರಹ’ಕ್ಕಿಂತ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκβάλλει
  choice: ಹೊರತರುತ್ತಾನೆ
  rationale: ἐκ ಮತ್ತು βάλλω ಸೂಚಿಸುವ ಒಳಗಿನಿಂದ ಹೊರಗೆ ತರುವ ಚಲನೆಯನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಉಂಟುಮಾಡುತ್ತಾನೆ’ ಎಂಬುದಕ್ಕಿಂತ ರೂಪಕವನ್ನು ಚೆನ್ನಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πονηρὸς / πονηρά
  choice: ದುಷ್ಟ / ದುಷ್ಟವಾದವುಗಳು
  rationale: ‘ಕೆಟ್ಟ’ ಎಂಬ ತುಸು ದುರ್ಬಲ ಪದಕ್ಕಿಂತ ಗ್ರೀಕ್‌ನ ಗಾಢ ನೈತಿಕ ಅರ್ಥವನ್ನೂ ἀγαθός ಜೊತೆಗಿನ ವಿರೋಧವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκ
  choice: -ದಿಂದ
  rationale: ಮೂಲ ಅಥವಾ ಉಗಮವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ವಿಭಕ್ತಿ; ‘ಹೊರತರುತ್ತಾನೆ’ ಎಂಬ ಕ್ರಿಯಾಪದವೇ ಹೊರಮುಖ ಚಲನೆಯನ್ನು ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಗಾದೆಯ ರೂಪದಲ್ಲಿರುವ ಆಂತರಿಕ ನೈತಿಕ ಸ್ಥಿತಿ ಮತ್ತು ಬಾಹ್ಯ ಫಲದ ಸಂಬಂಧ
  choice: ಮೂಲದಲ್ಲಿರುವ ವಿಶಾಲವಾದ ‘ಒಳ್ಳೆಯವುಗಳು/ದುಷ್ಟವಾದವುಗಳು’ ಎಂಬ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ತಕ್ಷಣದ ಸಂದರ್ಭದ ಆಧಾರದಲ್ಲಿ ಇದನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ‘ಒಳ್ಳೆಯ ಮಾತುಗಳು/ದುಷ್ಟ ಮಾತುಗಳು’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಮತ್ತಾಯ 12:34, 36–37ರಲ್ಲಿ ಮಾತುಗಳೇ ಮುಖ್ಯ ಸಂದರ್ಭವಾದರೂ, ಇಲ್ಲಿ ಗ್ರೀಕ್ ಪಠ್ಯವು ಯಾವುದೇ ನಾಮಪದವಿಲ್ಲದ ನಪುಂಸಕ ಬಹುವಚನ ವಿಶೇಷಣಗಳನ್ನು ಬಳಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಮಾತುಗಳಿಗೆ ಮಾತ್ರ ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸದೆ, ಸಂದರ್ಭಸೂಚನೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಗಾದೆಸಮಾನ ಸಮಾಂತರ ರಚನೆಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಒಳ್ಳೆಯ’ ಮತ್ತು ‘ದುಷ್ಟ’ ಪದಗಳ ಪುನರಾವರ್ತನೆಯ ಮೂಲಕ ಗ್ರೀಕ್‌ನ ಲಯಬದ್ಧ ನೈತಿಕ ವಿರೋಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
