- from: ಒಳ್ಳೆಯ ಮನುಷ್ಯನು[a] ತನ್ನ ಒಳ್ಳೆಯ ಬೊಕ್ಕಸದಿಂದ ಒಳ್ಳೆಯವುಗಳನ್ನು[b] ಹೊರತರುತ್ತಾನೆ; ದುಷ್ಟ ಮನುಷ್ಯನು ತನ್ನ ದುಷ್ಟ ಬೊಕ್ಕಸದಿಂದ ದುಷ್ಟವಾದವುಗಳನ್ನು ಹೊರತರುತ್ತಾನೆ.
