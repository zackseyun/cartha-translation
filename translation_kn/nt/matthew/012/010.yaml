id: MAT.12.10
reference: Matthew 12:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: kn
  text: ಇಗೋ, ಕೈ ಬತ್ತಿಹೋಗಿದ್ದ ಒಬ್ಬ ಮನುಷ್ಯನು ಇದ್ದನು. ಅವರು, “ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ[a] ಗುಣಪಡಿಸುವುದು ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಸಮ್ಮತವೋ?” ಎಂದು ಯೇಸುವನ್ನು ಕೇಳಿದರು; ಆತನ ಮೇಲೆ ಆರೋಪ ಹೊರಿಸುವ ಉದ್ದೇಶದಿಂದಲೇ ಹೀಗೆ ಕೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಕನ್ನಡದಲ್ಲಿ ಹೆಚ್ಚು ರೂಢಿಯಾಗಿ, “ಸಬ್ಬತ್ ದಿನದಂದು.” ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ “ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ” ಎಂಬ ಬಹುವಚನವಿದೆ; ಇದು ಸಬ್ಬತ್ ದಿನಗಳನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುವ ರೂಢಿಪ್ರಯೋಗವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ದೃಶ್ಯದ ಕಡೆಗೆ ಓದುಗರ ಗಮನ ಸೆಳೆಯುವ ಗ್ರೀಕ್ ಸಂವಾದಸೂಚಕದ ಜೀವಂತಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἄνθρωπος
  choice: ಒಬ್ಬ ಮನುಷ್ಯನು
  rationale: ಇಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಪುರುಷ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಲಿಂಗಸೂಚಕವಾದ ಈ ಅನುವಾದ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: χεῖρα ἔχων ξηράν
  choice: ಕೈ ಬತ್ತಿಹೋಗಿದ್ದ
  rationale: ξηράν ಎಂಬುದು ಕೈ ಒಣಗಿ, ಕ್ಷೀಣಿಸಿ ಅಥವಾ ಚಲನೆ ಕಳೆದುಕೊಂಡ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸಬಹುದು; ರೋಗದ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: ಎಂದು ಆತನನ್ನು ಕೇಳಿದರು
  rationale: ಕನ್ನಡದ ನೇರ ಉಕ್ತಿಯ ಸಹಜ ರಚನೆಯನ್ನು ಬಳಸುತ್ತಾ ಮುಖ್ಯ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ನಿಷ್ಠೆಯಿಂದ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔξεστι
  choice: ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಸಮ್ಮತವೋ
  rationale: ಇದು ಸಾಮಾನ್ಯ ಅನುಮತಿಯ ಪ್ರಶ್ನೆಯಲ್ಲ, ಸಬ್ಬತ್ ಆಚರಣೆಗೆ ಸಂಬಂಧಿಸಿದ ಧಾರ್ಮಿಕ-ಕಾನೂನುಬದ್ಧ ಪ್ರಶ್ನೆ ಎಂಬ ಬಲವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τοῖς σάββασιν
  choice: ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ಸಬ್ಬತ್ ದಿನಗಳನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: θεραπεύειν
  choice: ಗುಣಪಡಿಸುವುದು
  rationale: ದೈಹಿಕ ಅಸ್ವಸ್ಥತೆಯಿಂದ ಚೇತರಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸುವಾರ್ತೆಯ ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ಆತನ ಮೇಲೆ ಆರೋಪ ಹೊರಿಸುವುದಕ್ಕಾಗಿ
  rationale: ἵνα ಇಲ್ಲಿ ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; κατηγορέω ಪದದ ವಿರೋಧಾತ್ಮಕ ಮತ್ತು ಕಾನೂನುಸಂಬಂಧಿ ಛಾಯೆಯನ್ನು ‘ಆರೋಪ ಹೊರಿಸುವುದು’ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಸಬ್ಬತ್ ಕುರಿತ ಕಾನೂನುಬದ್ಧ ಪ್ರಶ್ನೆಯಲ್ಲಿ ಗ್ರೀಕ್ ಬಹುವಚನದ ನಿರೂಪಣೆ
  choice: ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ
  alternative: ಸಬ್ಬತ್ ದಿನದಂದು
  rationale: τοῖς σάββασιν ಎಂಬುದು ರೂಪದಲ್ಲಿ ಬಹುವಚನವಾಗಿರುವುದರಿಂದ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಏಕವಚನ ರೂಪವೂ ಈ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡಬಲ್ಲುದರಿಂದ ಅದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಪರ್ಯಾಯವಾಗಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಆತನು’ ಎಂಬ ಗೌರವಪೂರ್ಣ ಸರ್ವನಾಮವು ಯೇಸುವಿನ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಇಡುತ್ತದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ಹೆಸರನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ. ವಾಕ್ಯದ ಕೊನೆಯಲ್ಲಿ ಉದ್ದೇಶವಾಕ್ಯವನ್ನು ಇಡುವ ಗ್ರೀಕ್ ಕ್ರಮಕ್ಕಿಂತ ಕನ್ನಡದಲ್ಲಿ ಪ್ರೇರಣೆಯನ್ನು ಮೊದಲು ಹೇಳುವುದು ಹೆಚ್ಚು ಸಹಜವಾದುದರಿಂದ ‘ಆರೋಪ ಹೊರಿಸುವುದಕ್ಕಾಗಿ’ ಎಂಬ ಭಾಗವನ್ನು ಪ್ರಶ್ನೆಗೆ ಮುಂಚೆ ಇರಿಸಲಾಗಿದೆ.
