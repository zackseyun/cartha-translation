id: MAT.12.41
reference: Matthew 12:41
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: kn
  text: ನಿನೆವೆಯ ಪುರುಷರು ನ್ಯಾಯತೀರ್ಪಿನಲ್ಲಿ ಈ ಪೀಳಿಗೆಯವರೊಂದಿಗೆ ಎದ್ದು ನಿಂತು ಈ ಪೀಳಿಗೆಯನ್ನು ಖಂಡಿಸುವರು; ಏಕೆಂದರೆ ಅವರು ಯೋನನ ಸಾರಿಕೆಗೆ ಪ್ರತಿಕ್ರಿಯಿಸಿ ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟರು. ಇಗೋ, ಯೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠವಾದದ್ದು ಇಲ್ಲಿದೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಯೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠನಾದವನು ಇಲ್ಲಿದ್ದಾನೆ.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ನಪುಂಸಕ ರೂಪವಿದ್ದು, ಅಕ್ಷರಶಃ “ಯೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠವಾದದ್ದು” ಎಂದಿದೆ. ಇದು ವ್ಯಕ್ತಿಗಳ ನಡುವಿನ ಹೋಲಿಕೆಯನ್ನು ಮಾತ್ರವಲ್ಲದೆ ಯೇಸುವಿನಲ್ಲಿ ಪ್ರಸ್ತುತವಾಗಿರುವ ಶ್ರೇಷ್ಠ ವಾಸ್ತವವನ್ನೂ ಒತ್ತಿಹೇಳಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: ನಿನೆವೆಯ ಪುರುಷರು
  rationale: ἄνδρες ಎಂಬ ಸ್ಪಷ್ಟ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವನ್ನು ಉಳಿಸಿಕೊಂಡು, Νινευῖται ಅನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಳಸಂಬಂಧವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀναστήσονται
  choice: ಎದ್ದು ನಿಂತು
  rationale: ನ್ಯಾಯತೀರ್ಪಿನ ಸನ್ನಿವೇಶದಲ್ಲಿ ಎದ್ದು ನಿಲ್ಲುವ ಜೀವಂತ ಚಿತ್ರಣವನ್ನೂ, ಸಾಧ್ಯವಾದ ಪುನರುತ್ಥಾನದ ಸೂಕ್ಷ್ಮಧ್ವನಿಯನ್ನೂ ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ κρίσει
  choice: ನ್ಯಾಯತೀರ್ಪಿನ ಸಮಯದಲ್ಲಿ
  rationale: ಅಂತಿಮ ನ್ಯಾಯದ ಸಂದರ್ಭವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ಈ ಪೀಳಿಗೆಯವರೊಂದಿಗೆ
  rationale: μετά + genitive ಎಂಬುದರ ನೇರವಾದ ‘ಜೊತೆಗೆ’ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ವಿರೋಧಾತ್ಮಕ ಅಂಶವು ಮುಂದಿನ ‘ಖಂಡಿಸುವರು’ ಎಂಬ ಕ್ರಿಯೆಯಿಂದ ಬರುತ್ತದೆ.
- source_word: κατακρινοῦσιν αὐτήν
  choice: ಇವರನ್ನು ಖಂಡಿಸುವರು
  rationale: αὐτήν ಸೂಚಿಸುವ ‘ಈ ಪೀಳಿಗೆ’ಯ ಜನರನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸಿ, κατακρίνω ಎಂಬುದರ ಖಂಡನೆಯ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: μετενόησαν
  choice: ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟರು
  rationale: ಪ್ರವಾದಿಯ ಸಂದೇಶಕ್ಕೆ ಪ್ರತಿಕ್ರಿಯೆಯಾಗಿ ಸಂಭವಿಸಿದ ಮನಃಪರಿವರ್ತನೆಯನ್ನು ಸ್ಥಾಪಿತವಾದ, ನಿಖರವಾದ ಕನ್ನಡ ಧಾರ್ಮಿಕ ಪದದಿಂದ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: ಯೋನನ ಸಾರುವಿಕೆಗೆ ಪ್ರತಿಕ್ರಿಯೆಯಾಗಿ
  rationale: κήρυγμα ಎಂಬ ಘೋಷಣೆ/ಸಾರುವಿಕೆಯ ಅರ್ಥವನ್ನೂ, εἰς ಇಲ್ಲಿ ಸೂಚಿಸುವ ಪ್ರತಿಕ್ರಿಯಾತ್ಮಕ ಸಂಬಂಧವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಗಂಭೀರ ಸಂಭಾಷಣಾ ಸೂಚಕವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ಯೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠವಾದದ್ದು ಇಲ್ಲಿದೆ
  rationale: πλεῖον ಎಂಬ ನಪುಂಸಕ ರೂಪವನ್ನು ‘ಶ್ರೇಷ್ಠವಾದದ್ದು’ ಎಂದು ಉಳಿಸಿ, ಕೇವಲ ವ್ಯಕ್ತಿಗಳ ಹೋಲಿಕೆಗೆ ಸೀಮಿತಗೊಳಿಸದೆ ಯೇಸುವಿನಲ್ಲಿ ಪ್ರಸ್ತುತವಾಗಿರುವ ಮಹತ್ತರ ವಾಸ್ತವದ ಸೂಚನೆಯನ್ನು ಸಂರಕ್ಷಿಸುತ್ತದೆ.
theological_decisions:
- issue: πλεῖον Ἰωνᾶ ಎಂಬ ನಪುಂಸಕ ಹೋಲಿಕೆಯ ಮೂಲಕ ಯೇಸುವಿನ ಸ್ವ-ಉಲ್ಲೇಖವನ್ನು ಹೇಗೆ ಅನುವಾದಿಸುವುದು
  choice: ಯೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠವಾದದ್ದು ಇಲ್ಲಿದೆ
  alternative: ಯೋನನಿಗಿಂತ ಶ್ರೇಷ್ಠನಾದವನು ಇಲ್ಲಿದ್ದಾನೆ
  rationale: ಗ್ರೀಕ್‌ನ ನಪುಂಸಕ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸುವುದರಿಂದ, ಕೇವಲ ಒಬ್ಬ ಪುರುಷನು ಮತ್ತೊಬ್ಬನಿಗಿಂತ ಶ್ರೇಷ್ಠನೆಂಬ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಯೇಸು ಮತ್ತು ಅವರ ಸೇವೆಯಲ್ಲಿ ಇರುವ ಶ್ರೇಷ್ಠ ವಾಸ್ತವದ ಒತ್ತನ್ನು ಸಂರಕ್ಷಿಸಲಾಗುತ್ತದೆ.
- issue: ἄνδρες ಪದದ ಲಿಂಗಸೂಚನೆಯನ್ನು ಉಳಿಸುವುದು
  choice: ಪುರುಷರು
  alternative: ಜನರು
  rationale: ಮೂಲಪಠ್ಯವು ಸಾಮಾನ್ಯ ನಿವಾಸಿಗಳನ್ನು ಸೂಚಿಸುವ ಪದವನ್ನಲ್ಲ, ಸ್ಪಷ್ಟವಾದ ಪುಲ್ಲಿಂಗ ἄνδρες ಪದವನ್ನು ಬಳಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವ ಶೈಲಿ. ‘ನ್ಯಾಯತೀರ್ಪು’, ‘ಪಶ್ಚಾತ್ತಾಪ’ ಮುಂತಾದ ಸ್ಥಾಪಿತ ಪದಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ; ವಾಕ್ಯರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಸಲು ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ನೀಡಲಾಗಿದೆ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
