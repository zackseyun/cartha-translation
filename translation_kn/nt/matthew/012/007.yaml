id: MAT.12.7
reference: Matthew 12:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: kn
  text: ಆದರೆ, ‘ನಾನು ಕರುಣೆಯನ್ನು ಬಯಸುತ್ತೇನೆ, ಯಜ್ಞವನ್ನಲ್ಲ’[a] ಎಂಬುದರ ಅರ್ಥವೇನೆಂದು ನೀವು ತಿಳಿದಿದ್ದರೆ, ನಿರ್ದೋಷಿಗಳನ್ನು[b] ದೋಷಿಗಳೆಂದು ತೀರ್ಪುಮಾಡುತ್ತಿರಲಿಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಯೇಸು ಹೋಶೇಯ 6:6ನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತಿದ್ದಾರೆ.
    reason: cross_reference
  - marker: b
    text: ಅಥವಾ ‘ಅಪರಾಧವಿಲ್ಲದವರನ್ನು.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: ನೀವು ತಿಳಿದಿದ್ದರೆ
  rationale: ಅವಾಸ್ತವ ಭೂತಕಾಲದ ಷರತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಮೊದಲೇ ತಿಳಿದುಕೊಳ್ಳಬೇಕಾಗಿದ್ದ ಅರ್ಥದ ಕುರಿತು ಯೇಸುವಿನ ಗದರಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τί ἐστιν
  choice: ಎಂಬುದರ ಅರ್ಥವೇನೆಂದು
  rationale: ಉಲ್ಲೇಖಿಸಲಾದ ವಾಕ್ಯದ ಗುರುತಿಗಿಂತ ಅದರ ಅರ್ಥಗ್ರಹಣವೇ ಇಲ್ಲಿ ಉದ್ದೇಶವಾಗಿರುವುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: Ἔλεος
  choice: ಕರುಣೆ
  rationale: ದಯೆ ಮತ್ತು ಅನುಕಂಪವನ್ನು ಒಳಗೊಂಡ ἔλεος ಪದಕ್ಕೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ, ಗೌರವಯುತ ಸಮಾನಾರ್ಥಕ.
- source_word: θέλω
  choice: ಬಯಸುತ್ತೇನೆ
  rationale: ಪ್ರವಾದನಾತ್ಮಕ ಉಲ್ಲೇಖದ ಘನತೆಯನ್ನೂ ದೇವರ ಇಚ್ಛೆಯ ಬಲವನ್ನೂ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: θυσίαν
  choice: ಯಜ್ಞ
  rationale: ದೇವರಿಗೆ ಅರ್ಪಿಸುವ ವಿಧಿಬದ್ಧ ಬಲಿಯನ್ನು ಸೂಚಿಸುವ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಪರಿಚಿತ ಧಾರ್ಮಿಕ ಪದ.
- source_word: κατεδικάσατε
  choice: ದೋಷಿಗಳೆಂದು ತೀರ್ಪುಮಾಡುತ್ತಿರಲಿಲ್ಲ
  rationale: καταδικάζω ಪದದ ನ್ಯಾಯಾಂಗ ಬಲವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ, ἄν ಜೊತೆಯ ಅವಾಸ್ತವ ಫಲವಾಕ್ಯವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀναιτίους
  choice: ನಿರ್ದೋಷಿಗಳನ್ನು
  rationale: ಯಾವ ದೋಷಾರೋಪಕ್ಕೂ ಒಳಗಾಗದವರನ್ನು ಸೂಚಿಸುವ ನ್ಯಾಯಾಂಗ ಛಾಯೆಯನ್ನು ಉಳಿಸಿ, ತೀರ್ಪಿನ ಕ್ರಿಯಾಪದಕ್ಕೆ ಸರಿಯಾಗಿ ಹೊಂದುತ್ತದೆ.
theological_decisions:
- issue: ಹೋಶೇಯ 6:6ರ ಉಲ್ಲೇಖದಲ್ಲಿ ಕರುಣೆ ಮತ್ತು ಯಜ್ಞದ ನಡುವಿನ ಪ್ರವಾದನಾತ್ಮಕ ವೈರುಧ್ಯ
  choice: ನಾನು ಕರುಣೆಯನ್ನು ಬಯಸುತ್ತೇನೆ, ಯಜ್ಞವನ್ನಲ್ಲ
  alternative: ನನಗೆ ಬೇಕಾಗಿರುವುದು ಕರುಣೆಯೇ ಹೊರತು ಯಜ್ಞವಲ್ಲ
  rationale: ಗ್ರೀಕ್‌ನ ತೀಕ್ಷ್ಣ ವೈರುಧ್ಯವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದೇ ವೇಳೆ ಯಜ್ಞದ ಮಾನ್ಯತೆಯನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ನಿರಾಕರಿಸುವ ವ್ಯಾಖ್ಯಾನವನ್ನು ಅನುವಾದದೊಳಗೆ ಸೇರಿಸದೆ, ಕರುಣೆಗೆ ನೀಡಿರುವ ಆದ್ಯತೆಯನ್ನು ಓದುಗನ ಮುಂದೆ ಹಾಗೆಯೇ ಇಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಉಲ್ಲೇಖದಲ್ಲಿ ಪ್ರವಾದನಾತ್ಮಕ ಗಾಂಭೀರ್ಯವನ್ನೂ ಕೊನೆಯ ವಾಕ್ಯದಲ್ಲಿ ನ್ಯಾಯಾಂಗ ಛಾಯೆಯನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
