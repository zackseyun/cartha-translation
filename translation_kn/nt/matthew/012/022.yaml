  rationale: ಕರೆತಂದವರನ್ನು ಸೂಚಿಸದ ಗ್ರೀಕ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ‘ಕರೆತರಲಾಯಿತು’ ಎಂದು ಪುನಃಸ್ಥಾಪಿಸಲಾಗಿದೆ. ‘ಆತನ ಬಳಿಗೆ’ ಮತ್ತು ‘ಆತನು’ ಎಂಬ ಸರ್ವನಾಮಗಳು ಗ್ರೀಕ್‌ನ αὐτῷ ಮತ್ತು ಅಡಕವಾದ ಕರ್ತೃವನ್ನು ಕಾಯ್ದುಕೊಳ್ಳುತ್ತವೆ; ಯೇಸುವಿನ ಹೆಸರನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ. κωφός‌ನ ಸಂದರ್ಭೋಚಿತ ‘ಮೂಕ’ ಅನುವಾದ ಮತ್ತು ಅದರ ‘ಕಿವುಡ’ ಪರ್ಯಾಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅಡಿಕುರಿಪು ಗುರುತನ್ನು ಸಂಬಂಧಿತ ಪದಕ್ಕೆ ಸ್ಥಳಾಂತರಿಸಲಾಗಿದೆ.
