id: MAT.12.22
reference: Matthew 12:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: kn
  text: ಆಗ ದೆವ್ವ ಹಿಡಿದಿದ್ದ, ಕುರುಡನೂ ಮೂಕನೂ[a] ಆಗಿದ್ದ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಆತನ ಬಳಿಗೆ ಕರೆತರಲಾಯಿತು. ಆತನು ಅವನನ್ನು ಗುಣಪಡಿಸಿದನು; ಆದ್ದರಿಂದ ಆ ಮೂಕನು ಮಾತನಾಡಿದನು ಮತ್ತು ನೋಡಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಕಿವುಡನೂ.’ κωφός ಎಂಬ ಗ್ರೀಕ್ ಪದವು ಕಿವುಡನನ್ನಾಗಲಿ ಮಾತಾಡಲಾರದವನನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು. ಇಲ್ಲಿ ಗುಣವಾದ ಮೇಲೆ ಅವನು ಮಾತನಾಡಿದನೆಂದು ಹೇಳಿರುವುದರಿಂದ ‘ಮೂಕನು’ ಎಂಬ ಅರ್ಥವು ಸಂದರ್ಭಕ್ಕೆ ಹೆಚ್ಚು ಹೊಂದುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಕಾಲಾನುಕ್ರಮವಾಗಿ ಪರಿಚಯಿಸುವ ಸಹಜ ಕನ್ನಡ ಸೂಚಕ.
- source_word: προσηνέχθη αὐτῷ
  choice: ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಬಂದರು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕರ್ತೃ ಸೂಚಿಸದ ಕರ್ಮಣಿ ರೂಪವಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಅನಿರ್ದಿಷ್ಟ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪವು ಕರ್ತೃವನ್ನು ಸೇರಿಸದೆ ಸಹಜವಾಗಿ ಅದೇ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ಸರ್ವನಾಮದ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟತೆಗೆ ಯೇಸು ಎಂದು ಹೇಳಲಾಗಿದೆ.
- source_word: δαιμονιζόμενος
  choice: ದೆವ್ವ ಹಿಡಿದಿದ್ದ
  rationale: ದೆವ್ವದ ಪ್ರಭಾವವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುವ, ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಅಭಿವ್ಯಕ್ತಿ; ಇದನ್ನು ವೈದ್ಯಕೀಯ ಅಥವಾ ಅಸ್ಪಷ್ಟ ಪದವಾಗಿ ಬದಲಾಯಿಸುವುದಿಲ್ಲ.
- source_word: τυφλὸς
  choice: ಕುರುಡನು
  rationale: ಮೂಲಪದದ ನೇರ ಮತ್ತು ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: κωφός
  choice: ಮೂಕನು
  rationale: ಪದವು ಕಿವುಡ ಅಥವಾ ಮಾತಾಡಲಾರದವನು ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಹೊಂದಬಹುದು; ಆದರೆ ಫಲವಾಕ್ಯದಲ್ಲಿ ಅವನು ಮಾತನಾಡಿದನೆಂದು ಹೇಳಿರುವುದರಿಂದ ಇಲ್ಲಿ ‘ಮೂಕನು’ ಸಂದರ್ಭಕ್ಕೆ ಸರಿಹೊಂದುತ್ತದೆ.
- source_word: ἐθεράπευσεν αὐτόν
  choice: ಅವನನ್ನು ಗುಣಪಡಿಸಿದನು
  rationale: ಸುವಾರ್ತೆಗಳ ಗುಣಪಡಿಸುವ ಸಂದರ್ಭಕ್ಕೆ ನೇರವಾದ ಮತ್ತು ಸಹಜವಾದ ಅನುವಾದ.
- source_word: ὥστε
  choice: ಆದ್ದರಿಂದ
  rationale: ಗುಣಪಡಿಸುವಿಕೆಯ ಫಲಿತಾಂಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಪರಿಣಾಮವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: λαλεῖν καὶ βλέπειν
  choice: ಮಾತನಾಡಿದನು ಮತ್ತು ನೋಡಿದನು
  rationale: ಗುಣಪಡಿಸುವಿಕೆಯ ಎರಡು ಫಲಿತಾಂಶಗಳನ್ನು ಮೂಲದ ಕ್ರಮದಲ್ಲಿಯೇ ಸರಳವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದೆವ್ವದ ಪೀಡೆಯ ಸ್ವರೂಪ
  choice: ‘ದೆವ್ವ ಹಿಡಿದಿದ್ದ’ ಎಂಬ ಸ್ಪಷ್ಟ ದೆವ್ವಸಂಬಂಧಿ ಭಾಷೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಮಾನಸಿಕ ಅಸ್ವಸ್ಥನಾಗಿದ್ದ / ಪೀಡಿತನಾಗಿದ್ದ
  rationale: ಮೂಲ ಗ್ರೀಕ್ ದೆವ್ವದ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ; ಅದನ್ನು ಆಧುನಿಕ ವೈದ್ಯಕೀಯ ವರ್ಗವಾಗಿ ಅಥವಾ ಅಸ್ಪಷ್ಟ ಪೀಡೆಯಾಗಿ ಪರಿವರ್ತಿಸುವುದು ಮೂಲದ ಅರ್ಥವನ್ನು ಕುಗ್ಗಿಸುತ್ತದೆ.
- issue: κωφός ಪದದ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ
  choice: ‘ಮೂಕನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಕಿವುಡನು
  rationale: κωφός ಪದಕ್ಕೆ ಎರಡೂ ಅರ್ಥಗಳ ಸಾಧ್ಯತೆ ಇದ್ದರೂ, ಗುಣವಾದ ಫಲವಾಗಿ ಅವನು ಮಾತನಾಡಿದನೆಂದು ವಾಕ್ಯ ಹೇಳುತ್ತದೆ. ಆದ್ದರಿಂದ ಮಾತಾಡಲಾರದ ಸ್ಥಿತಿಯೇ ಇಲ್ಲಿ ಪ್ರಧಾನ; ಪರ್ಯಾಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಮೊದಲ ವಾಕ್ಯದ ಉದ್ದವನ್ನು ನಿಯಂತ್ರಿಸಲು ಗ್ರೀಕ್‌ನ ಒಂದೇ ವಾಕ್ಯವನ್ನು ಎರಡು ಕನ್ನಡ ವಾಕ್ಯಗಳಾಗಿ ನೀಡಲಾಗಿದೆ. ‘ಮೂಕನು’ ಸಂಕ್ಷಿಪ್ತವಾಗಿದ್ದು ಸಂದರ್ಭದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; κωφός ಪದದ ನಿಜವಾದ ಪರ್ಯಾಯ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
