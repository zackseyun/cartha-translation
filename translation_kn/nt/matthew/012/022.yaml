  naturalness: ‘ಕರೆತರಲಾಯಿತು’ ಮತ್ತು ‘ಆತನು’ ಎಂಬ ರೂಪಗಳು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಮೂಲದ ಉಲ್ಲೇಖಸಂಬಂಧ ಮತ್ತು ಕರ್ಮಣಿ ಭಾವವನ್ನು ಉಳಿಸುತ್ತವೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತನ್ನು ಸಂಬಂಧಿತ ‘ಮೂಕನೂ’ ಪದದ ತಕ್ಷಣ ಇರಿಸುವುದು ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿದೆ.
