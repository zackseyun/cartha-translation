id: MAT.12.34
reference: Matthew 12:34
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: kn
  text: ವಿಷಸರ್ಪಗಳ ಮರಿಗಳೇ,[a] ನೀವು ದುಷ್ಟರಾಗಿರುವಾಗ ಒಳ್ಳೆಯದನ್ನು ಹೇಗೆ ಮಾತನಾಡಬಲ್ಲಿರಿ? ಏಕೆಂದರೆ ಹೃದಯದಲ್ಲಿ ತುಂಬಿ ತುಳುಕುತ್ತಿರುವುದನ್ನೇ ಬಾಯಿ ಮಾತನಾಡುತ್ತದೆ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ವಿಷಸರ್ಪಗಳ ಸಂತತಿಯೇ.”
    reason: γεννήματα ಎಂಬ ಪದವು ಹುಟ್ಟಿದ ಸಂತತಿ ಅಥವಾ ಮರಿಗಳನ್ನು ಸೂಚಿಸಬಹುದು. “ಸಂತತಿಯೇ” ಎಂಬುದು ರೂಪಕದ ವಂಶ/ಸ್ವಭಾವದ ಸೂಚನೆಯನ್ನು ಉಳಿಸುವ ಪರ್ಯಾಯವಾಗಿದೆ.
  - marker: b
    text: ಅಥವಾ, “ಹೃದಯದಲ್ಲಿ ಹೇರಳವಾಗಿರುವುದನ್ನೇ ಬಾಯಿ ಮಾತನಾಡುತ್ತದೆ.”
    reason: περίσσευμα ಎಂದರೆ ಹೇರಳತೆ, ಮಿಗಿಲು, ಅಥವಾ ತುಂಬಿ ತುಳುಕುವಿಕೆ. ಈ ಪರ್ಯಾಯವು ಆ ಪದದ ‘ಹೇರಳತೆ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: ವಿಷಸರ್ಪಗಳ ಸಂತತಿಯವರೇ
  rationale: γέννημα ಎಂದರೆ ಹುಟ್ಟಿದ ಅಥವಾ ಉತ್ಪತ್ತಿಯಾದ ಸಂತತಿ; ἐχιδνῶν ಜೊತೆಯಲ್ಲಿ ಇದು ವಂಶಸ್ವಭಾವವನ್ನು ಸೂಚಿಸುವ ಕಟುವಾದ ರೂಪಕ. ‘ಸಂತತಿಯವರೇ’ ಎಂಬುದು ಸಂಬೋಧನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ‘ವಿಷಸರ್ಪ’ ಮೂಲದ ಅಪಾಯಕಾರಿ ಹಾವಿನ ಚಿತ್ರವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: πῶς δύνασθε
  choice: ಹೇಗೆ ...ಬಲ್ಲಿರಿ?
  rationale: ಈ ಪ್ರಶ್ನೆ ಕೇವಲ ಸಾಮರ್ಥ್ಯ ವಿಚಾರಿಸುವುದಲ್ಲ; ನೈತಿಕ ಅಸಂಗತತೆಯನ್ನು ಬಯಲಿಗೆಳೆಯುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ. ‘ಹೇಗೆ ...ಬಲ್ಲಿರಿ?’ ಅದರ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀγαθὰ λαλεῖν
  choice: ಒಳ್ಳೆಯದನ್ನು ... ಮಾತನಾಡಬಲ್ಲಿರಿ
  rationale: ἀγαθά ನಪುಂಸಕ ಬಹುವಚನವಾಗಿದ್ದು ಇಲ್ಲಿ ನಾಮಪದದಂತೆ ‘ಒಳ್ಳೆಯವು/ಒಳ್ಳೆಯದನ್ನು’ ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಒಳ್ಳೆಯದನ್ನು ಮಾತನಾಡುವುದು’ ಮೂಲಕ್ಕೆ ಸಮೀಪವಾಗಿಯೂ ಗ್ರಾಹ್ಯವಾಗಿಯೂ ಇದೆ.
- source_word: πονηροὶ ὄντες
  choice: ನೀವು ದುಷ್ಟರಾಗಿರುವಾಗ
  rationale: πονηροί ಸ್ಪಷ್ಟವಾದ ನೈತಿಕ ಕೆಡುಕನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದುಷ್ಟರು’ ಅದರ ತೂಕವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಆಗಿರುವಾಗ’ ಕೃದಂತದ ಪರಿಸ್ಥಿತಿಜನ್ಯ ಸಂಬಂಧವನ್ನು ಅತಿಯಾಗಿ ಕಾರಣಾರ್ಥಕಗೊಳಿಸದೆ ನೀಡುತ್ತದೆ.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: ಏಕೆಂದರೆ ಹೃದಯದಲ್ಲಿ ತುಂಬಿ ತುಳುಕುವುದರಿಂದಲೇ
  rationale: περίσσευμα ಸಮೃದ್ಧಿ, ಮಿಗಿಲು ಅಥವಾ ಉಕ್ಕಿಹರಿಯುವ ತುಂಬುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತುಂಬಿ ತುಳುಕುವುದು’ ಒಳಗಿನ ಪೂರ್ಣತೆ ಹೊರಗೆ ವ್ಯಕ್ತವಾಗುವ ಚಿತ್ರವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; καρδίαಗೆ ‘ಹೃದಯ’ ಎಂಬ ವಿಶಾಲ ಬೈಬಲ್ ಪದವನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τὸ στόμα λαλεῖ
  choice: ಬಾಯಿ ಮಾತನಾಡುತ್ತದೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ‘ಬಾಯಿ’ ಎಂಬ ಕರ್ತೃ ಮತ್ತು ‘ಮಾತನಾಡುತ್ತದೆ’ ಎಂಬ ನೇರ ಹೇಳಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ‘ಹೃದಯ’ ಎಂಬ ರೂಪಕದ ವ್ಯಾಪ್ತಿ
  choice: ‘ಹೃದಯ’ ಎಂಬ ಬೈಬಲ್ ಪದವನ್ನೇ ಉಳಿಸುವುದು
  alternative: ಅಂತರಂಗ / ಮನಸ್ಸು
  rationale: καρδία ಭಾವನೆಗಳನ್ನು ಮಾತ್ರವಲ್ಲದೆ ಆಲೋಚನೆ, ಇಚ್ಛೆ ಮತ್ತು ನೈತಿಕ ಅಂತರಂಗವನ್ನೂ ಒಳಗೊಂಡಿದೆ. ಅದನ್ನು ‘ಮನಸ್ಸು’ ಅಥವಾ ‘ಭಾವನೆ’ ಎಂದು ಸೀಮಿತಗೊಳಿಸದೆ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: πονηροὶ ಎಂಬ ನೈತಿಕ ವರ್ಣನೆ
  choice: ದುಷ್ಟರು
  alternative: ಕೆಟ್ಟವರು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸು ಗುಣಮಟ್ಟದ ದೋಷವನ್ನಲ್ಲ, ನೈತಿಕ ಕೆಡುಕನ್ನು ಖಂಡಿಸುತ್ತಾನೆ. ‘ದುಷ್ಟರು’ ಆ ತೂಕವನ್ನು ಮೃದುಗೊಳಿಸದೆ ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ತೀಕ್ಷ್ಣವಾದ ಪ್ರವಾದನಾತ್ಮಕ ಧಾಟಿ ಉಳಿಸಲಾಗಿದೆ. ವಾಕ್ಯರಚನೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿದೆ; ಮೂಲದ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ, ಸರ್ಪಸಂತತಿಯ ರೂಪಕ, ‘ಹೃದಯ’ ಎಂಬ ವಿಶಾಲ ಅಂತರಂಗಪದ ಮತ್ತು ತುಂಬಿ ಹೊರಹೊಮ್ಮುವ ಮಾತಿನ ಚಿತ್ರವನ್ನು ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
