review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the rebuke, rhetorical impossibility, moral force of πονηροί, and the heart-to-speech image. However, the final clause is syntactically incomplete/unnatural in Kannada: “ಹೃದಯದಲ್ಲಿ ತುಂಬಿ ತುಳುಕುವುದರಿಂದ” lacks a natural nominal referent for the source expression ἐκ τοῦ περισσεύματος τῆς καρδίας. A revision should make explicit that the mouth speaks what overflows/fills the heart, without narrowing καρδία.'
  naturalness: '“ವಿಷಸರ್ಪಗಳ ಸಂತತಿಯವರೇ” is understandable but redundant and stiff: “ಸಂತತಿ” already denotes descendants, so the added plural-person suffix is not idiomatic. “ವಿಷಸರ್ಪಗಳ ಮರಿಗಳೇ” is a direct, natural vocative metaphor. The final clause is improved by using the idiomatic Kannada construction “ಹೃದಯದಲ್ಲಿ ತುಂಬಿ ತುಳುಕುತ್ತಿರುವುದನ್ನೇ ಬಾಯಿ ಮಾತನಾಡುತ್ತದೆ.”'
  terminology: Retain “ವಿಷಸರ್ಪ,” “ದುಷ್ಟ,” and “ಹೃದಯ.” These preserve the vivid viper metaphor, the ethical force of πονηροί, and the biblical breadth of καρδία. “ಒಳ್ಳೆಯದನ್ನು ಮಾತನಾಡಬಲ್ಲಿರಿ” is acceptable and suitably close to ἀγαθὰ λαλεῖν.
  issues:
  - severity: medium
    issue: The phrase “ವಿಷಸರ್ಪಗಳ ಸಂತತಿಯವರೇ” is stylistically redundant.
    rationale: “ಸಂತತಿ” already identifies offspring/descendants; appending “ಯವರೇ” makes the vocative cumbersome. “ವಿಷಸರ್ಪಗಳ ಮರಿಗಳೇ” naturally preserves the plural insult/metaphor of γεννήματα ἐχιδνῶν.
  - severity: medium
    issue: The final clause is grammatically elliptical in an unnatural way.
    rationale: “ಹೃದಯದಲ್ಲಿ ತುಂಬಿ ತುಳುಕುವುದರಿಂದಲೇ ಬಾಯಿ ಮಾತನಾಡುತ್ತದೆ” leaves “what is overflowing” unexpressed. The Greek means that speech proceeds from the heart’s abundance. “ಹೃದಯದಲ್ಲಿ ತುಂಬಿ ತುಳುಕುತ್ತಿರುವುದನ್ನೇ ಬಾಯಿ ಮಾತನಾಡುತ್ತದೆ” is idiomatic Kannada and represents the same image.
  - severity: low
    issue: Footnote b repeats the same incomplete construction.
    rationale: The alternative should likewise supply a natural expression for the heart’s abundance and maintain the full clause.
