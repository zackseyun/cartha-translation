  to: ವಿಷಸರ್ಪಗಳ ಮರಿಗಳೇ,[a] ನೀವು ದುಷ್ಟರಾಗಿರುವಾಗ ಒಳ್ಳೆಯದನ್ನು ಹೇಗೆ ಮಾತನಾಡಬಲ್ಲಿರಿ? ಏಕೆಂದರೆ ಹೃದಯದಲ್ಲಿ ತುಂಬಿ ತುಳುಕುತ್ತಿರುವುದನ್ನೇ ಬಾಯಿ ಮಾತನಾಡುತ್ತದೆ.[b]
