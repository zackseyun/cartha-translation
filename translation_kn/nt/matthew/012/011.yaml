    rationale: ‘ಯಾವ ಮನುಷ್ಯನಿಗೆ ... ಇದ್ದು’ is intelligible, but ‘ಒಂದೇ ಕುರಿಯುಳ್ಳ ಯಾವ ಮನುಷ್ಯನು’ is smoother modern Kannada and preserves the rhetorical syntax.
