id: MAT.12.11
reference: Matthew 12:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: kn
  text: 'ಆದರೆ ಆತನು ಅವರಿಗೆ ಹೀಗೆ ಹೇಳಿದನು: “ನಿಮ್ಮಲ್ಲಿ ಒಂದೇ ಕುರಿಯುಳ್ಳ ಯಾವ ಮನುಷ್ಯನು, ಅದು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ[a] ಒಂದು ಗುಂಡಿಗೆ ಬಿದ್ದರೆ, ಅದನ್ನು ಹಿಡಿದು ಮೇಲಕ್ಕೆತ್ತುವುದಿಲ್ಲವೇ?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಸಬ್ಬತ್‌ಗಳಲ್ಲಿ’; ಇದು ‘ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ’ ಎಂಬ ಅರ್ಥದ ರೂಢಿಪ್ರಯೋಗ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ಅದನ್ನು ಹಿಡಿದು ಎಬ್ಬಿಸುವುದಿಲ್ಲವೇ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: ನಿಮ್ಮಲ್ಲಿ ಯಾವ ಮನುಷ್ಯನಿಗೆ
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಪ್ರತಿನಿಧಾತ್ಮಕ ಉದಾಹರಣೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಸಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಪ್ರಶ್ನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἕξει πρόβατον ἕν
  choice: ಒಂದು ಕುರಿ ಇದ್ದು
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ರೂಪವು ಷರತ್ತಿನ ಉದಾಹರಣೆಯಲ್ಲಿ ಹೊಂದಿರುವ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಇದ್ದು’ ಎಂದು ನೀಡುತ್ತದೆ; ‘ಒಂದು’ ಎಂಬುದು ಕುರಿಯ ಏಕತ್ವದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: ಅದು ... ಬಿದ್ದರೆ
  rationale: ಷರತ್ತಿನ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಕೊಡುತ್ತದೆ; ‘ಅದು’ ಎಂಬುದು ಹಿಂದಿನ ಕುರಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τοῖς σάββασιν
  choice: ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಬಹುವಚನ ರೂಪವಿದ್ದರೂ, ಇಲ್ಲಿ ಅದು ಸಬ್ಬತ್ ದಿನವನ್ನು ಸೂಚಿಸುವ ರೂಢಿಪ್ರಯೋಗ; ಕನ್ನಡ ಏಕವಚನವು ವಿವಾದದ ಸಂದರ್ಭವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: εἰς βόθυνον
  choice: ಒಂದು ಹಳ್ಳಕ್ಕೆ
  rationale: βόθυνος ಎಂದರೆ ಗುಂಡಿ ಅಥವಾ ಹಳ್ಳ; ‘ಹಳ್ಳ’ ಎಂಬುದು ಅದರ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ಸಹಜವಾಗಿ ಚಿತ್ರಿಸುತ್ತದೆ.
- source_word: οὐχὶ κρατήσει αὐτὸ
  choice: ಅವನು ಅದನ್ನು ಹಿಡಿದು ... ಎತ್ತುವುದಿಲ್ಲವೇ?
  rationale: οὐχί ಸಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಪ್ರಶ್ನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; κρατέω ಇಲ್ಲಿಗೆ ಕುರಿಯನ್ನು ದೃಢವಾಗಿ ಹಿಡಿಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐγερεῖ
  choice: ಮೇಲಕ್ಕೆ ಎತ್ತುವುದಿಲ್ಲವೇ
  rationale: ಗುಂಡಿಯೊಳಗಿರುವ ಕುರಿಯನ್ನು ಮೇಲಕ್ಕೆತ್ತುವ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ‘ಹೊರಗೆ’ ಎಂಬ ಪದವನ್ನು ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ಕಾರಣ ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಿಲ್ಲ.
theological_decisions:
- issue: ಪ್ರತಿನಿಧಾತ್ಮಕ ಪುಲ್ಲಿಂಗ ಭಾಷೆ
  choice: ಮನುಷ್ಯ
  alternative: ವ್ಯಕ್ತಿ
  rationale: ಮೂಲದ ἄνθρωπος ಇಲ್ಲಿ ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಉದಾಹರಣೆಯಾಗಿ ಬಂದಿದೆ. ‘ಮನುಷ್ಯ’ ಎನ್ನುವುದು ಆ ರೂಪ ಮತ್ತು ವಾಕ್ಚಾತುರ್ಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: σάββασιν ಎಂಬ ಬಹುವಚನ ರೂಪ
  choice: ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ
  alternative: ಸಬ್ಬತ್ ದಿನಗಳಲ್ಲಿ
  rationale: ಈ ಬಹುವಚನವು ಸಬ್ಬತ್ ದಿನವನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ರೂಢಿಪ್ರಯೋಗ. ನೇರ ಬಹುವಚನವು ಇಲ್ಲಿ ಹಲವು ಸಬ್ಬತ್ ದಿನಗಳ ಅರ್ಥವನ್ನು ತಪ್ಪಾಗಿ ಸೂಚಿಸಬಹುದು.
- issue: ἐγερεῖ ಎಂಬ ಕ್ರಿಯಾಪದದ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ
  choice: ಮೇಲಕ್ಕೆ ಎತ್ತುವುದಿಲ್ಲವೇ
  alternative: ಎಬ್ಬಿಸುವುದಿಲ್ಲವೇ
  rationale: ಕ್ರಿಯಾಪದವು ಸಾಮಾನ್ಯವಾಗಿ ‘ಎಬ್ಬಿಸು/ಎತ್ತು’ ಎಂಬ ಅರ್ಥ ಹೊಂದಿದೆ; ಹಳ್ಳಕ್ಕೆ ಬಿದ್ದ ಕುರಿಯ ಸಂದರ್ಭದಲ್ಲಿ ‘ಮೇಲಕ್ಕೆ ಎತ್ತು’ ಸಹಜವಾಗಿದ್ದು, ಪುನರುತ್ಥಾನದಂತಹ ತಾತ್ವಿಕ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಆಮದು ಮಾಡುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಗೌರವಪೂರ್ಣವಾಗಿಯೂ ರೂಪಿಸಲಾಗಿದೆ. ಪ್ರಶ್ನೆಯು ಸಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ವಾಕ್ಚಾತುರ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಮೂಲದ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಮತ್ತು ‘ಒಂದು ಕುರಿ’ ಎಂಬ ಒತ್ತು ಕಾಪಾಡಲಾಗಿದೆ.
