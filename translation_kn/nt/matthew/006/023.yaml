id: MAT.6.23
reference: Matthew 6:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: kn
  text: ಆದರೆ ನಿನ್ನ ಕಣ್ಣು ಕೆಟ್ಟದಾಗಿದ್ದರೆ[a], ನಿನ್ನ ಇಡೀ ದೇಹವು ಕತ್ತಲೆಯಾಗಿರುತ್ತದೆ. ಹೀಗಿರುವಾಗ, ನಿನ್ನಲ್ಲಿರುವ ಬೆಳಕೇ ಕತ್ತಲಾಗಿದ್ದರೆ, ಕತ್ತಲು ಎಷ್ಟೊಂದು ದೊಡ್ಡದು!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ದುಷ್ಟ’, ‘ದೋಷವಿರುವ’, ಅಥವಾ ‘ಅನಾರೋಗ್ಯದ’ ಕಣ್ಣು; ‘ಕಣ್ಣು’ ಎಂಬ ನುಡಿಗಟ್ಟು ಮತ್ತು ಸುತ್ತಲಿನ ಸಂದರ್ಭದ ದೃಷ್ಟಿಯಿಂದ ಜಿಪುಣತನವನ್ನು ಸೂಚಿಸುವ ಅರ್ಥವೂ ಇರಬಹುದು.
    reason: πονῆρος ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನೂ ‘ಕೆಟ್ಟ ಕಣ್ಣು’ ಎಂಬ ಸಾಧ್ಯ ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟನ್ನೂ ಉಳಿಸುವ ಪರ್ಯಾಯ ಪದಾರ್ಥ.
lexical_decisions:
- source_word: πονηρὸς
  choice: ಕೆಟ್ಟದ್ದಾಗಿದ್ದರೆ
  rationale: ‘ಕೆಟ್ಟ’ ಎಂಬ ವಿಶಾಲ ಪದವು ನೈತಿಕ ಕೆಡುಕು, ದೃಷ್ಟಿಯ ದೋಷ ಮತ್ತು ಜಿಪುಣತನದ ಸಾಧ್ಯ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥಗಳನ್ನು ಒಂದಕ್ಕೇ ಸೀಮಿತಗೊಳಿಸದೆ ರೂಪಕದ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: σκοτεινὸν
  choice: ಕತ್ತಲಾಗಿರುವುದು
  rationale: ಗುಣವಾಚಕದ ವಿಧೇಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ಮೂಲದಲ್ಲಿಲ್ಲದ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: φῶς
  choice: ಬೆಳಕು
  rationale: ಮೂಲದ ಬೆಳಕು–ಕತ್ತಲು ರೂಪಕವನ್ನು ಅರ್ಥವಿವರಣೆ ಮಾಡದೆ ನೇರವಾಗಿ ಉಳಿಸುವ ಸಾಮಾನ್ಯ ಸಮಾನಾರ್ಥಕ.
- source_word: σκότος
  choice: ಕತ್ತಲು
  rationale: ಬೆಳಕಿಗೆ ವಿರುದ್ಧವಾದ ರೂಪಕವನ್ನೂ ಅಂತಿಮ ವಾಕ್ಯದ ತೀವ್ರತೆಯನ್ನೂ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πόσον
  choice: ಎಷ್ಟು ದೊಡ್ಡದು
  rationale: ಅಪೂರ್ಣವಾದ ಉದ್ಗಾರವಾಕ್ಯದಲ್ಲಿ ಪ್ರಮಾಣದ ತೀವ್ರತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὀφθαλμός
  choice: ಕಣ್ಣು
  rationale: ಗ್ರಹಿಕೆ, ಉದ್ದೇಶ ಮತ್ತು ನೈತಿಕ ದೃಷ್ಟಿಕೋನವನ್ನು ಸೂಚಿಸುವ ದೈಹಿಕ ರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὅλον τὸ σῶμά σου
  choice: ನಿನ್ನ ಇಡೀ ದೇಹ
  rationale: ὅλον ಪದದ ಸಮಗ್ರತೆಯ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: ನಿನ್ನಲ್ಲಿರುವ ಬೆಳಕು
  rationale: ‘ಆಂತರಿಕ ಬೆಳಕು’ ಎಂದು ಅತಿಯಾಗಿ ಅರ್ಥೈಸದೆ ಗ್ರೀಕ್ ಪದಗುಚ್ಛಕ್ಕೆ ಸಮೀಪವಾಗಿಯೂ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಇದೆ.
theological_decisions:
- issue: ‘ಕೆಟ್ಟ ಕಣ್ಣು’ ರೂಪಕದ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಕೆಟ್ಟ’ ಎಂಬ ವಿಶಾಲ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ದುಷ್ಟ ಕಣ್ಣು’, ‘ದೋಷವಿರುವ/ಅನಾರೋಗ್ಯದ ಕಣ್ಣು’, ಅಥವಾ ಸಂದರ್ಭದ ಸೆಮಿಟಿಕ್ ನುಡಿಗಟ್ಟಿನ ಪ್ರಕಾರ ‘ಜಿಪುಣ ಕಣ್ಣು’.
  rationale: ಮತ್ತಾಯ 6:19–24ರ ಸಂದರ್ಭವು ನೈತಿಕ ಕತ್ತಲೆ, ವಿಕೃತ ಗ್ರಹಿಕೆ ಮತ್ತು ಬಹುಶಃ ಉದಾರತೆಯ ಕೊರತೆ ಎಂಬ ಪರಸ್ಪರ ಹೊಂದಿಕೊಳ್ಳಬಹುದಾದ ಅರ್ಥಗಳಿಗೆ ಅವಕಾಶ ಕೊಡುತ್ತದೆ. ಒಂದೇ ವ್ಯಾಖ್ಯಾನವನ್ನು ಹೇರದೆ ಈ ತಾತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲು ವಿಶಾಲ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದರೂ ಘನತೆಯುಳ್ಳ ಶೈಲಿ. ‘ಕಣ್ಣು’, ‘ಬೆಳಕು’, ‘ಕತ್ತಲು’ ಎಂಬ ಮೂಲ ರೂಪಕಗಳನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ಬದಲಾಯಿಸದೆ ಉಳಿಸಲಾಗಿದೆ. ಅಂತ್ಯದ ಉದ್ಗಾರಭಾವವನ್ನು ಆಶ್ಚರ್ಯಚಿಹ್ನೆಯಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
