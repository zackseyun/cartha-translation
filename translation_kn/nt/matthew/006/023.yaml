review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional structure, the bodily metaphor, the repeated light–darkness contrast, and the climactic elliptical question. However, ‘ಕತ್ತಲಾಗಿರುವುದು’ is not the best rendering of the future ἔσται; a future-state expression is needed.
  naturalness: The Kannada is generally clear and modern. ‘ಕತ್ತಲೆಯಾಗಿರುತ್ತದೆ’ is more natural and grammatically appropriate here than ‘ಕತ್ತಲಾಗಿರುವುದು.’ The closing exclamation is smoother as ‘ಕತ್ತಲು ಎಷ್ಟೊಂದು ದೊಡ್ಡದು!’
  terminology: ‘ಕೆಟ್ಟ’ appropriately preserves the breadth of πονηρός without prematurely deciding between evil, defective/unhealthy, and ungenerous senses. ‘ಬೆಳಕು’ and ‘ಕತ್ತಲು’ preserve the source metaphor well. The footnote is retained but phrased so that each alternative clearly describes the eye/metaphor.
  issues:
  - severity: medium
    issue: Future predicate rendered with an awkward non-future form
    rationale: ἔσται means ‘will be.’ The draft’s ‘ಕತ್ತಲಾಗಿರುವುದು’ is an infinitival/nominal-style construction and does not naturally convey the Greek future assertion. ‘ಕತ್ತಲೆಯಾಗಿರುತ್ತದೆ’ expresses the resulting future state without adding interpretation.
  - severity: low
    issue: Footnote alternatives are syntactically uneven
    rationale: The isolated adjectives ‘ದುಷ್ಟ’, ‘ದೋಷವಿರುವ’, ‘ಅನಾರೋಗ್ಯದ’, and ‘ಜಿಪುಣ’ can be made clearer by explicitly identifying them as possible senses of ‘ಕಣ್ಣು,’ while preserving the lexical and idiomatic ambiguity.
