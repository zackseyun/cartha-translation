  to: ಆದರೆ ನಿನ್ನ ಕಣ್ಣು ಕೆಟ್ಟದಾಗಿದ್ದರೆ[a], ನಿನ್ನ ಇಡೀ ದೇಹವು ಕತ್ತಲೆಯಾಗಿರುತ್ತದೆ. ಹೀಗಿರುವಾಗ, ನಿನ್ನಲ್ಲಿರುವ ಬೆಳಕೇ ಕತ್ತಲಾಗಿದ್ದರೆ, ಕತ್ತಲು ಎಷ್ಟೊಂದು ದೊಡ್ಡದು!
