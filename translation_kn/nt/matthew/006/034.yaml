id: MAT.6.34
reference: Matthew 6:34
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ ನಾಳೆಯ ಕುರಿತು ಚಿಂತಿಸಬೇಡಿ; ನಾಳೆಯೇ ತನ್ನ ಕುರಿತು ಚಿಂತಿಸಿಕೊಳ್ಳುತ್ತದೆ. ಪ್ರತಿಯೊಂದು ದಿನಕ್ಕೂ ಅದರದೇ ಆದ ಕಷ್ಟ[a] ಸಾಕು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪ್ರತಿಯೊಂದು ದಿನಕ್ಕೂ ಅದರದೇ ಆದ ಕೆಡುಕು ಸಾಕು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಪದಕ್ಕೆ ‘ಕೆಡುಕು’ ಎಂಬ ಅರ್ಥವಿದೆ; ಆದರೆ ಇಲ್ಲಿ ಅದು ಆ ದಿನದ ಕಷ್ಟ ಅಥವಾ ಸಂಕಟವನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: ಚಿಂತಿಸಬೇಡಿ
  rationale: ಮತ್ತಾಯ 6:25–34ರಲ್ಲಿ ಈ ಕ್ರಿಯಾಪದವು ಆತಂಕಭರಿತ ಚಿಂತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಚಿಂತಿಸಬೇಡಿ’ ಎಂಬುದು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಸಂದರ್ಭದಲ್ಲಿನ ಪುನರಾವರ್ತಿತ ಪದಸಂಬಂಧವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς τὴν αὔριον
  choice: ನಾಳೆಯ ಕುರಿತು
  rationale: μεριμνάω ಜೊತೆಯಲ್ಲಿ εἰς ಭವಿಷ್ಯದ ದಿನದ ಕಡೆಗೆ ತಿರುಗಿದ ಚಿಂತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನಾಳೆಯ ಕುರಿತು’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜ.
- source_word: ἡ αὔριον
  choice: ನಾಳೆಯೇ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ನಾಳೆ’ಯನ್ನು ಕರ್ತೃವಾಗಿ ವ್ಯಕ್ತೀಕರಿಸಲಾಗಿದೆ. ‘ನಾಳೆಯೇ’ ಆ ವ್ಯಕ್ತೀಕರಣವನ್ನೂ ಒತ್ತನ್ನೂ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μεριμνήσει αὑτῆς
  choice: ತನ್ನ ಕುರಿತು ಚಿಂತಿಸಿಕೊಳ್ಳುತ್ತದೆ
  rationale: ಈ ರೂಪವು ಹಿಂದಿನ ‘ಚಿಂತಿಸಬೇಡಿ’ ಎಂಬ ಕ್ರಿಯಾಪದದ ಪದಸಂಬಂಧ ಮತ್ತು ವಾಕ್ಯದ ವ್ಯಕ್ತೀಕರಣವನ್ನು ಉಳಿಸುತ್ತದೆ; αὑτῆς ಅನ್ನು ‘ತನ್ನ ಕುರಿತು’ ಎಂದು ಪ್ರತಿನಿಧಿಸಲಾಗಿದೆ.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: ಪ್ರತಿಯೊಂದು ದಿನಕ್ಕೂ ... ಸಾಕು
  rationale: ἀρκετόν ಎಂದರೆ ‘ಸಾಕು/ಸಾಕಷ್ಟು’; ದತ್ತಿವಿಭಕ್ತಿಯ τῇ ἡμέρᾳ ಅನ್ನು ಜ್ಞಾನೋಕ್ತಿಯ ಹಂಚಿಕೆಭಾವದಲ್ಲಿ ‘ಪ್ರತಿಯೊಂದು ದಿನಕ್ಕೂ’ ಎಂದು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἡ κακία αὐτῆς
  choice: ಅದರದೇ ಆದ ಕಷ್ಟ
  rationale: κακία ಸಾಮಾನ್ಯವಾಗಿ ‘ಕೆಡುಕು’ ಎಂದೂ ಅರ್ಥವಾಗಬಹುದು; ಆದರೆ ಆತಂಕದ ಈ ಸಂದರ್ಭದಲ್ಲಿ ದಿನದ ತೊಂದರೆ ಅಥವಾ ಸಂಕಟವನ್ನು ಸೂಚಿಸುವ ‘ಕಷ್ಟ’ ಸಹಜವಾಗಿದೆ. αὐτῆς‌ನ ಸ್ವಾಮ್ಯ ಮತ್ತು ಒತ್ತನ್ನು ‘ಅದರದೇ ಆದ’ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಆತಂಕದ ಕುರಿತ ಜ್ಞಾನೋಕ್ತಿಯಲ್ಲಿ κακία ಪದದ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಕಷ್ಟ’
  alternative: ‘ಕೆಡುಕು’
  rationale: ಸಂದರ್ಭವು ಮುಂದಿನ ದಿನದ ಬಗ್ಗೆ ಆತಂಕಪಡುವುದನ್ನು ಕುರಿತು ಮಾತನಾಡುವುದರಿಂದ, ಇಲ್ಲಿ ದಿನವು ತರುವ ಸಂಕಟ ಅಥವಾ ತೊಂದರೆ ಮುಖ್ಯ ಅರ್ಥವಾಗಿರುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು. ಆದರೂ ಪದದ ನೈತಿಕ ‘ಕೆಡುಕು’ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಹಾಗೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ‘ನಾಳೆಯೇ ತನ್ನ ಕುರಿತು ಚಿಂತಿಸಿಕೊಳ್ಳುತ್ತದೆ’ ಎಂಬ ವ್ಯಕ್ತೀಕರಣವನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಪದ್ಯದ ಕೊನೆಯ ಭಾಗದಲ್ಲಿ ಗ್ರೀಕ್‌ನ ಸಂಕ್ಷಿಪ್ತ ಜ್ಞಾನೋಕ್ತಿ ಸ್ವರೂಪವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯವಿನ್ಯಾಸದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
