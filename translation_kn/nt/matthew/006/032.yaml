id: MAT.6.32
reference: Matthew 6:32
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಅನ್ಯಜನರು[a] ಇವೆಲ್ಲವನ್ನೂ ತವಕದಿಂದ ಹುಡುಕುತ್ತಾರೆ[b]; ಏಕೆಂದರೆ ಇವೆಲ್ಲವೂ ನಿಮಗೆ ಅಗತ್ಯವೆಂದು ನಿಮ್ಮ ಸ್ವರ್ಗೀಯ ತಂದೆಗೆ ತಿಳಿದಿದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಜನಾಂಗಗಳು’ ಅಥವಾ ‘ವಿಗ್ರಹಾರಾಧಕರು.’ ಗ್ರೀಕ್ ಪದವು ಸಾಮಾನ್ಯವಾಗಿ ಜನಾಂಗಗಳನ್ನು ಸೂಚಿಸಬಹುದು; ಇಲ್ಲಿ ಅದು ಒಡಂಬಡಿಕೆಯ ಜನರ ಹೊರಗಿನವರನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು.
    reason: alternative_reading
  - marker: b
    text: ಅಥವಾ, ‘ಹುಡುಕುತ್ತಾರೆ’ ಅಥವಾ ‘ಪಡೆಯಲು ಹೆಣಗುತ್ತಾರೆ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಉತ್ಸುಕ ಅಥವಾ ನಿರಂತರ ಅನ್ವೇಷಣೆಯನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: ಅನ್ಯಜನರು
  rationale: ಮತ್ತಾಯನ ಈ ಸಂದರ್ಭದಲ್ಲಿದು ಯೇಸುವಿನ ಶಿಷ್ಯರಿಗೆ ವ್ಯತಿರಿಕ್ತವಾಗಿ ಯೆಹೂದ್ಯೇತರ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅನ್ಯಜನರು’ ಎಂಬುದು ಐತಿಹಾಸಿಕ ಮತ್ತು ಒಡಂಬಡಿಕೆಯ ಸಾಮಾಜಿಕ ಭೇದವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ವಿಗ್ರಹಾರಾಧಕರು’ ಎನ್ನುವುದು ಮೂಲದಲ್ಲಿಲ್ಲದ ಧಾರ್ಮಿಕ ತೀರ್ಪನ್ನು ಸೇರಿಸಬಹುದು.
- source_word: ἐπιζητοῦσιν
  choice: ತವಕದಿಂದ ಹುಡುಕುತ್ತಾರೆ
  rationale: ἐπιζητέω ಇಲ್ಲಿ ಸಾಮಾನ್ಯ ಹುಡುಕುವಿಕೆಗೆ ಮೀರಿದ ಉತ್ಸುಕ ಅಥವಾ ನಿರಂತರ ಅನ್ವೇಷಣೆಯ ಛಾಯೆಯನ್ನು ಹೊಂದಿದೆ. ‘ತವಕದಿಂದ ಹುಡುಕುತ್ತಾರೆ’ ಎಂಬುದು ಅದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಪಡೆಯಲು ಹೆಣಗುತ್ತಾರೆ’ ಎಂದರೆ ಪ್ರಯತ್ನದ ತೀವ್ರತೆಯನ್ನು ಅತಿಯಾಗಿ ಹೇಳಬಹುದು.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ನಿಮ್ಮ ಸ್ವರ್ಗೀಯ ತಂದೆ
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನೂ ತಂದೆಯ ಸ್ವರ್ಗೀಯ ಗುರುತನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οἶδεν
  choice: ತಿಳಿದಿದೆ
  rationale: οἶδα ರೂಪತಃ ಪೂರ್ಣಕಾಲವಾದರೂ ವರ್ತಮಾನ ಅರ್ಥದಲ್ಲಿ ಬಳಕೆಯಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಗೌರವಾರ್ಥ ಏಕವಚನ ಕರ್ತೃ ‘ತಂದೆ’ಯೊಂದಿಗೆ ‘ತಿಳಿದಿದೆ’ ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: χρῄζετε
  choice: ನಿಮಗೆ ಅಗತ್ಯವೆಂದು
  rationale: ‘ನಿಮಗೆ ಅಗತ್ಯವಿದೆ’ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಪರೋಕ್ಷ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ನೈಸರ್ಗಿಕವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: ಇವೆಲ್ಲವನ್ನೂ ... ಇವೆಲ್ಲವೂ
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ‘ಇವೆಲ್ಲ’ ಎಂಬ ಪುನರಾವರ್ತನೆಯನ್ನು ಒತ್ತುಗಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಕನ್ನಡದ ವಿಭಕ್ತಿ ರೂಪಗಳು ಪ್ರತಿ ಉಪವಾಕ್ಯದಲ್ಲಿನ ವ್ಯಾಕರಣಪಾತ್ರವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.
- source_word: γὰρ ... γὰρ
  choice: ಏಕೆಂದರೆ ... [ಅಸಿಂಡೆಟಿಕ್ ವಿವರಣೆ]
  rationale: ಮೊದಲ γάρ ಅನ್ನು ‘ಏಕೆಂದರೆ’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡಲಾಗಿದೆ. ಎರಡನೆಯ γάρ ಕಾರಣವನ್ನು ಮುಂದುವರಿಸಿದರೂ ಕನ್ನಡದಲ್ಲಿ ಮತ್ತೊಮ್ಮೆ ‘ಏಕೆಂದರೆ’ ಎಂದರೆ ಭಾರವಾಗುತ್ತದೆ; ಅರ್ಧವಿರಾಮದ ನಂತರದ ವಿವರಣಾತ್ಮಕ ಉಪವಾಕ್ಯ ಅದೇ ತಾರ್ಕಿಕ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಬೋಧನೆಯಲ್ಲಿ τὰ ἔθνη ಪದದ ಉಲ್ಲೇಖ
  choice: ಅನ್ಯಜನರು
  alternative: ಜನಾಂಗಗಳು; ವಿಗ್ರಹಾರಾಧಕರು
  rationale: ಈ ಸಂದರ್ಭವು ತಂದೆಯ ಮೇಲೆ ಭರವಸೆಯಿಡಲು ಕರೆಯಲ್ಪಟ್ಟ ಶಿಷ್ಯರನ್ನೂ ಅವರ ಹೊರಗಿನ ಜನರನ್ನೂ ಹೋಲಿಸುತ್ತದೆ. ‘ಅನ್ಯಜನರು’ ಐತಿಹಾಸಿಕ-ಒಡಂಬಡಿಕೆಯ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ, ಆದರೆ ಎಲ್ಲ ಯೆಹೂದ್ಯೇತರರ ಕುರಿತು ಸಂಪೂರ್ಣ ನೈತಿಕ ತೀರ್ಪು ವಿಧಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವಂತೆ dignified ಮತ್ತು ಸಹಜ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಎರಡು ಕಾರಣಸೂಚಕ ಉಪವಾಕ್ಯಗಳ ಸಂಬಂಧವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ಅನಗತ್ಯ ಪುನರಾವರ್ತನೆ ತಪ್ಪಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಅವು ಸಂಬಂಧಿಸುವ ಪದಬಂಧಗಳ ತಕ್ಷಣ ಇರಿಸಲಾಗಿದೆ.
