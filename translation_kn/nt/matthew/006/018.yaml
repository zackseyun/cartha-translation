review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the purpose clause, the contrast between human observers and the Father, the repeated hidden sphere (ἐν τῷ κρυφαίῳ), and the promised recompense. However, “ಕಾಣಿಸುವಂತಾಗಲಿ” is less direct and less parallel than the Greek’s single passive verb governing both sides of the contrast. A revision can retain the intended ellipsis while making the Kannada relation clearer.
  naturalness: “ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವುದು ಜನರಿಗೆ ಕಾಣಿಸದೆ” is understandable but somewhat impersonal and syntactically loose. “ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವವನೆಂದು ಜನರಿಗೆ ಕಾಣದಂತೆ” is more idiomatic modern standard Kannada and accurately expresses appearing as one who is fasting. “ಕಾಣಿಸಲಿ” supplies the implied verb naturally in the contrasting clause.
  terminology: “ಜನರಿಗೆ” appropriately renders the generic τοῖς ἀνθρώποις. “ಮರೆಯಲ್ಲಿರುವ / ಮರೆಯಲ್ಲಿ” preserves the repeated wording and appropriately leaves open the source phrase’s hidden-sphere nuance. “ಪ್ರತಿಫಲವನ್ನು ಕೊಡುವನು” is a natural rendering of ἀποδώσει σοι in this context.
  issues:
  - severity: medium
    issue: The contrast clause uses “ಕಾಣಿಸುವಂತಾಗಲಿ.”
    rationale: This expression can sound like an exhortation that the fasting should be made visible to the Father, rather than the source’s purpose that the faster not appear before people but before the Father. “ತಂದೆಗೆ ಕಾಣಿಸಲಿ” more directly and naturally completes the implied verb without altering the contrast.
  - severity: low
    issue: The first clause is syntactically less natural than it could be.
    rationale: The current wording nominalizes the action (“ಉಪವಾಸ ಮಾಡುತ್ತಿರುವುದು”) and leaves the relation to the person less explicit. Rendering “as one who is fasting” reflects the participial construction naturally in Kannada.
  revised_text: ಹೀಗೆ ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವವನೆಂದು ಜನರಿಗೆ ಕಾಣದಂತೆ, ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ ಕಾಣಿಸಲಿ[a]; ಮತ್ತು ಮರೆಯಲ್ಲಿ ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲವನ್ನು ಕೊಡುವನು.
