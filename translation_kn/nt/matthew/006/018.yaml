id: MAT.6.18
reference: Matthew 6:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: kn
  text: ಹೀಗೆ ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವವನೆಂದು ಜನರಿಗೆ ಕಾಣದಂತೆ, ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ ಕಾಣಿಸಲಿ[a]; ಮತ್ತು ಮರೆಯಲ್ಲಿ ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲವನ್ನು ಕೊಡುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಮರೆಯಲ್ಲಿ” ಎಂಬುದನ್ನು “ಗುಪ್ತಸ್ಥಳದಲ್ಲಿ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ಹೀಗೆ … ಕಾಣಿಸುವಂತಾಗಲಿ
  rationale: ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುವ ὅπως ಎಂಬುದರ ಪ್ರಯೋಜನಾರ್ಥಕ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವುದು ಜನರಿಗೆ ಕಾಣಿಸದೆ
  rationale: φανῇς ಎಂಬ ‘ಕಾಣಿಸು/ಗೋಚರವಾಗು’ ಅರ್ಥವನ್ನೂ, νηστεύων ಸೂಚಿಸುವ ನಡೆಯುತ್ತಿರುವ ಉಪವಾಸವನ್ನೂ ಉಳಿಸುತ್ತದೆ. ἄνθρωποι ಇಲ್ಲಿ ಪುರುಷರಿಗೆ ಮಾತ್ರವಲ್ಲ, ಸಾಮಾನ್ಯ ಮಾನವ ವೀಕ್ಷಕರಿಗೆ ಸೂಚಿಸುವುದರಿಂದ ‘ಜನರಿಗೆ’ ಸಹಜವೂ ನಿಖರವೂ ಆಗಿದೆ.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: ನಿನ್ನ ತಂದೆಗೆ ಕಾಣಿಸುವಂತಾಗಲಿ
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯದಲ್ಲಿರುವ ‘ಕಾಣಿಸು’ ಎಂಬ ಕ್ರಿಯಾಪದದ ಅರ್ಥವನ್ನು ವಿರೋಧಾತ್ಮಕ ಎರಡನೆಯ ಭಾಗದಲ್ಲಿ ಕನ್ನಡದ ಸ್ಪಷ್ಟತೆಗೆ ಪುನರುಕ್ತಗೊಳಿಸಲಾಗಿದೆ; ಮಾನವರ ಮುಂದೆ ಪ್ರದರ್ಶನ ಮತ್ತು ತಂದೆಯ ಮುಂದೆ ಇರುವ ಭಕ್ತಿ ಎಂಬ ವ್ಯತ್ಯಾಸ ಉಳಿದಿದೆ.
- source_word: τῷ ἐν τῷ κρυφαίῳ / ἐν τῷ κρυφαίῳ
  choice: ಮರೆಯಲ್ಲಿರುವ / ಮರೆಯಲ್ಲಿ
  rationale: κρυφαῖος ಸೂಚಿಸುವ ಗುಪ್ತ, ಸಾರ್ವಜನಿಕ ದೃಷ್ಟಿಗೆ ಸಿಗದ ವಲಯವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ ಮತ್ತು ಎರಡೂ ಬಳಕೆಗಳ ನಡುವಿನ ಶಬ್ದಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀποδώσει σοι
  choice: ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು
  rationale: ಈ ಭಕ್ತಿಕಾರ್ಯದ ಸಂದರ್ಭದಲ್ಲಿನ ἀποδίδωμι ಪದದ ಪ್ರತಿಫಲ ಅಥವಾ ಪ್ರತಿದಾನ ನೀಡುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: τοῖς ἀνθρώποις ಎಂಬ ಸಾಮಾನ್ಯ ಮಾನವ ಉಲ್ಲೇಖ
  choice: ಜನರಿಗೆ
  alternative: ಮನುಷ್ಯರಿಗೆ
  rationale: ಸಂದರ್ಭವು ಪುರುಷರನ್ನು ಮಾತ್ರವಲ್ಲದೆ ಮಾನವ ವೀಕ್ಷಕರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಜನರಿಗೆ’ ಎಂಬುದು ಲಿಂಗವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸದೆ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: κρυφαίῳ ಎಂಬ ಪದದ ಸ್ಥಳಾತ್ಮಕ ಮತ್ತು ಗುಪ್ತತೆಯ ಅರ್ಥ
  choice: ಮರೆಯಲ್ಲಿ
  alternative: ಗುಪ್ತಸ್ಥಳದಲ್ಲಿ; ರಹಸ್ಯವಾಗಿ
  rationale: ಮೂಲವು ನಿಖರವಾದ ಭೌತಿಕ ಸ್ಥಳವೋ ಅಥವಾ ಸಾರ್ವಜನಿಕ ದೃಷ್ಟಿಗೆ ಸಿಗದ ಗುಪ್ತ ವಲಯವೋ ಎಂಬುದನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ. ‘ಮರೆಯಲ್ಲಿ’ ಎರಡೂ ಸಾಧ್ಯತೆಗಳಿಗೆ ಅವಕಾಶಕೊಟ್ಟು, ತಂದೆಯ ಅಲಕ್ಷಿತ ಸಾನ್ನಿಧ್ಯ ಮತ್ತು ಅವನ ನೋಡುವಿಕೆ ನಡುವಿನ ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: ἀλλὰ ನಂತರದ ಅಲಿಪ್ತ ಕ್ರಿಯಾಪದ
  choice: ‘ಕಾಣಿಸುವಂತಾಗಲಿ’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಪೂರೈಸಲಾಗಿದೆ
  alternative: ‘ಆದರೆ ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ’ ಎಂದು ಅಲಿಪ್ತವಾಗಿಡುವುದು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಹಿಂದಿನ φανῇς ಅರ್ಥವು ಎರಡನೆಯ ಭಾಗಕ್ಕೂ ಅನ್ವಯಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಅದನ್ನು ಹೇಳದೆ ಬಿಟ್ಟರೆ ವಾಕ್ಯ ಅಪೂರ್ಣವಾಗಿ ಕೇಳಿಸಬಹುದು; ಕ್ರಿಯೆಯನ್ನು ಪೂರೈಸುವುದು ಅರ್ಥವನ್ನು ಪರಿಹರಿಸದೆ ಕೇವಲ ವ್ಯಾಕರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಓದಿಗೆ ಅನುಕೂಲವಾದ ಶೈಲಿ. ‘ಮರೆ’ ಎಂಬ ಪದದ ಪುನರಾವರ್ತನೆ ಮೂಲದಲ್ಲಿರುವ κρυφαίῳ ಪದದ ವಾಕ್ಚಾತುರ್ಯಪೂರ್ಣ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
