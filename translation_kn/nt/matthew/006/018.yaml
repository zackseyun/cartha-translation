revisions:
- from: ಹೀಗೆ ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವುದು ಜನರಿಗೆ ಕಾಣಿಸದೆ, ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ ಕಾಣಿಸುವಂತಾಗಲಿ; ಮರೆಯಲ್ಲಿ ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು.[a]
  to: ಹೀಗೆ ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವವನೆಂದು ಜನರಿಗೆ ಕಾಣದಂತೆ, ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ ಕಾಣಿಸಲಿ[a]; ಮತ್ತು ಮರೆಯಲ್ಲಿ ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲವನ್ನು ಕೊಡುವನು.
