id: MAT.6.19
reference: Matthew 6:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: kn
  text: ಭೂಮಿಯ ಮೇಲೆ ನಿಮಗಾಗಿ ಸಂಪತ್ತನ್ನು ಕೂಡಿಸಿಟ್ಟುಕೊಳ್ಳಬೇಡಿ. ಅಲ್ಲಿ ನುಸಿಹುಳವೂ ಕ್ಷಯವೂ[a] ಅದನ್ನು ನಾಶಮಾಡುತ್ತವೆ; ಅಲ್ಲಿ ಕಳ್ಳರು ಗೋಡೆಯನ್ನು ಕೊರೆದು ಒಳನುಗ್ಗಿ[b] ಕದಿಯುತ್ತಾರೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ತುಕ್ಕು’; ಗ್ರೀಕ್ ಪದವು ಲೋಹಕ್ಕೆ ಹಿಡಿಯುವ ತುಕ್ಕನ್ನು ಮಾತ್ರವಲ್ಲದೆ, ತಿನ್ನಿಹಾಕುವಿಕೆ ಅಥವಾ ಕ್ರಮೇಣ ಉಂಟಾಗುವ ಹಾಳಾಗುವಿಕೆಯನ್ನೂ ವಿಶಾಲವಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ ‘ಕೊರೆದು ದಾಟುತ್ತಾರೆ’; ಮಣ್ಣಿನ ಇಟ್ಟಿಗೆಯ ಗೋಡೆಗಳನ್ನು ಕೊರೆದು ಒಳನುಗ್ಗುತ್ತಿದ್ದ ಕಳ್ಳರನ್ನು ಇದು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆಯಿದೆ.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: ಕೂಡಿಸಿಟ್ಟುಕೊಳ್ಳಬೇಡಿ
  rationale: ನಿಷೇಧಾರ್ಥಕ ವರ್ತಮಾನ ಆಜ್ಞೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಸಂಪತ್ತನ್ನು ಸಂಗ್ರಹಿಸಿ ಇಟ್ಟುಕೊಳ್ಳುವ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑμῖν
  choice: ನಿಮಗಾಗಿ
  rationale: ತಮ್ಮ ಸ್ವಂತ ಸ್ವಾಧೀನ ಅಥವಾ ಪ್ರಯೋಜನಕ್ಕಾಗಿ ಕೂಡಿಸಿಡುವ ಪ್ರತಿಫಲಾರ್ಥಕ ಭಾವವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: θησαυροὺς
  choice: ಸಂಪತ್ತನ್ನು
  rationale: ಮೌಲ್ಯವುಳ್ಳ ಐಹಿಕ ಧನಸಂಗ್ರಹವನ್ನು ಒಳಗೊಳ್ಳುವ ಸಹಜ ಕನ್ನಡ ಪದ; ಕನ್ನಡದಲ್ಲಿ ಸಮೂಹಾರ್ಥಕ ಏಕವಚನವು ಇಲ್ಲಿ ಸರಾಗವಾಗಿದೆ.
- source_word: ἐπὶ τῆς γῆς
  choice: ಭೂಮಿಯ ಮೇಲೆ
  rationale: ಮುಂದಿನ ವಚನದ ಪರಲೋಕದೊಂದಿಗೆ ಇರುವ ಸ್ಥಳಾತ್ಮಕ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὅπου
  choice: ಅಲ್ಲಿ
  rationale: ಮೊದಲು ಹೇಳಿದ ಭೂಮಿಯ ಮೇಲಿನ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಸಂಬಂಧಸೂಚಕ ಬಳಕೆ.
- source_word: σὴς
  choice: ನುಸಿಹುಳು
  rationale: ಸಂಗ್ರಹಿಸಿದ ಬಟ್ಟೆ ಮುಂತಾದವುಗಳನ್ನು ಹಾಳುಮಾಡುವ moth ಅನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಸೂಚಿಸುತ್ತದೆ.
- source_word: βρῶσις
  choice: ಕ್ಷಯ
  rationale: ತಿನ್ನಿಹಾಕುವಿಕೆ ಅಥವಾ ಕ್ರಮೇಣ ಹಾಳಾಗುವಿಕೆ ಎಂಬ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ಲೋಹದ ತುಕ್ಕಿಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ἀφανίζει
  choice: ನಾಶಮಾಡುತ್ತವೆ
  rationale: ಕಣ್ಮರೆಯಾಗುವಂತೆ ಮಾಡುವುದು ಅಥವಾ ಹಾಳುಮಾಡುವುದು ಎಂಬ ಕ್ರಿಯೆಯ ಬಲವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κλέπται
  choice: ಕಳ್ಳರು
  rationale: ನೇರ ಮತ್ತು ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: διορύσσουσιν
  choice: ಗೋಡೆಯನ್ನು ಕೊರೆದು ಒಳನುಗ್ಗಿ
  rationale: ಮೂಲದ ಅಕ್ಷರಶಃ ‘ಕೊರೆದು ದಾಟುವುದು’ ಎಂಬ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕಳ್ಳತನಕ್ಕಾಗಿ ಒಳನುಗ್ಗುವುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: κλέπτουσιν
  choice: ಕದಿಯುತ್ತಾರೆ
  rationale: ಕಳ್ಳತನ ಮಾಡುವ ಕ್ರಿಯೆಗೆ ಸಹಜವಾದ ನೇರ ಕನ್ನಡ ಪದ.
theological_decisions:
- issue: γῆ ಎಂಬ ಪದದ ವ್ಯಾಪ್ತಿ ಮತ್ತು ಪರಲೋಕದೊಂದಿಗಿನ ವ್ಯತ್ಯಾಸ
  choice: ಭೂಮಿಯ ಮೇಲೆ
  alternative: ಈ ಲೋಕದಲ್ಲಿ
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿರುವ ಭೂಮಿ–ಪರಲೋಕ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಈ ಲೋಕದಲ್ಲಿ’ ಎಂದು ಅರ್ಥವಿಸ್ತರಣೆ ಮಾಡುವುದಿಲ್ಲ.
- issue: βρῶσις ಪದದ ಅರ್ಥ
  choice: ಕ್ಷಯ
  alternative: ತುಕ್ಕು
  rationale: ಗ್ರೀಕ್ ಪದವು ಲೋಹದ ತುಕ್ಕಿಗಿಂತ ವಿಶಾಲವಾಗಿ ತಿನ್ನಿಹಾಕುವಿಕೆ ಅಥವಾ ಹಾಳಾಗುವಿಕೆಯನ್ನು ಸೂಚಿಸಬಲ್ಲದು. ‘ಕ್ಷಯ’ ಆ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೂ ಸೂಕ್ತವಾದ ಶೈಲಿ. ‘ನುಸಿಹುಳು’ ಎಂಬುದು moth‌ನ ಹಾನಿಕಾರಕ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಕ್ಷಯ’ ಮೂಲಪದದ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
