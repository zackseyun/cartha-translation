id: MAT.6.21
reference: Matthew 6:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ನಿನ್ನ ಸಂಪತ್ತು ಎಲ್ಲಿದೆಯೋ, ಅಲ್ಲಿಯೇ ನಿನ್ನ ಹೃದಯವೂ ಇರುತ್ತದೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಏಕೆಂದರೆ ನಿನ್ನ ಸಂಪತ್ತು ಎಲ್ಲಿದೆಯೋ, ಅಲ್ಲಿಯೇ ನಿನ್ನ ಹೃದಯವೂ ಇದೆ.” ಕೆಲವು ಅನುವಾದಗಳು ಇದನ್ನು ಸಾರ್ವಕಾಲಿಕ ವರ್ತಮಾನವಾಗಿ ಹೇಳುತ್ತವೆ; ಆದರೆ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಭವಿಷ್ಯಕಾಲದಲ್ಲಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ಎಲ್ಲಿದೆಯೋ
  rationale: ಸ್ಥಳಸೂಚಕ ಸಂಬಂಧವಾಕ್ಯವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಮುಂದಿನ ‘ಅಲ್ಲಿಯೇ’ ಎಂಬ ಪದದೊಂದಿಗೆ ಗ್ರೀಕ್‌ನ ‘ಎಲ್ಲಿ ... ಅಲ್ಲಿ’ ಸಮಾನಾಂತರವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: γάρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಬೋಧನೆಗೆ ಈ ವಾಕ್ಯವು ನೀಡುವ ವಿವರಣಾತ್ಮಕ ಕಾರಣಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: θησαυρός
  choice: ಸಂಪತ್ತು
  rationale: ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಸಂಗ್ರಹಿಸಿದ ಐಶ್ವರ್ಯ ಮತ್ತು ಮೌಲ್ಯಯುತವಾದದ್ದು ಎಂಬ ಎರಡೂ ಅರ್ಥಸಾಧ್ಯತೆಗಳನ್ನು ಅತಿಯಾಗಿ ವಿವರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: σου
  choice: ನಿನ್ನ
  rationale: ಸಂಪತ್ತು ಮತ್ತು ಹೃದಯ ಎರಡರೊಂದಿಗೂ ಇರುವ ಏಕವಚನ ದ್ವಿತೀಯಪುರುಷ ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκεῖ
  choice: ಅಲ್ಲಿಯೇ
  rationale: ὅπου ಜೊತೆಗಿನ ಸ್ಥಳಸಂಬಂಧವನ್ನು ಉಳಿಸಿ, ‘ಅದೇ ಸ್ಥಳದಲ್ಲಿ’ ಎಂಬ ಒತ್ತನ್ನು ಕನ್ನಡದ ‘-ಯೇ’ ಮೂಲಕ ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: ἔσται
  choice: ಇರುವುದು
  rationale: ಇದು ಭವಿಷ್ಯಸೂಚಕ ರೂಪವಾಗಿ ‘ಇರುತ್ತದೆ’ ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ; ಗ್ರೀಕ್‌ನ ಭವಿಷ್ಯಕಾಲವನ್ನು ವರ್ತಮಾನಕಾಲವಾಗಿ ಸಮತಟ್ಟುಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: καρδία
  choice: ಹೃದಯ
  rationale: ಆಸೆ, ನಿಷ್ಠೆ ಮತ್ತು ಅಂತರಂಗದ ಒಲವುಗಳ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುವ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದ.
- source_word: καὶ
  choice: ವೂ
  rationale: ಸಂಪತ್ತು ಇರುವ ಸ್ಥಳಕ್ಕೆ ಹೃದಯವನ್ನೂ ಸೇರಿಸುವ ಗ್ರೀಕ್‌ನ ಸಂಯೋಜಕ ಒತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಜ್ಞಾನೋಕ್ತಿಯಂತಿರುವ ವಾಕ್ಯದಲ್ಲಿ ἔσται ಎಂಬ ಭವಿಷ್ಯಕಾಲದ ಬಲ
  choice: ‘ಇರುವುದು’ ಎಂಬ ಭವಿಷ್ಯಸೂಚಕ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ಸಾರ್ವಕಾಲಿಕ ಸತ್ಯದಂತೆ ‘ಇದೆ’ ಎಂದು ವರ್ತಮಾನಕಾಲದಲ್ಲಿ ಅನುವಾದಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ಪಾಠವು ಸ್ಪಷ್ಟವಾಗಿ ಭವಿಷ್ಯಕಾಲದ ಕ್ರಿಯಾಪದವನ್ನು ಬಳಸುತ್ತದೆ. ಅದನ್ನು ಉಳಿಸುವುದರಿಂದ ವಾಕ್ಯವು ಕೇವಲ ಸ್ಥಿರ ಹೊಂದಾಣಿಕೆಯನ್ನು ಮಾತ್ರವಲ್ಲ, ಸಂಪತ್ತು ಇರುವ ಕಡೆಗೆ ಹೃದಯವೂ ನೆಲೆಗೊಳ್ಳುತ್ತದೆ ಎಂಬ ದಿಕ್ಕನ್ನೂ ಸೂಚಿಸಲು ಅವಕಾಶ ಕೊಡುತ್ತದೆ; ಆದರೆ ಆ ಸೂಚನೆಯನ್ನು ವಿವರಣೆಯಾಗಿ ಮುಖ್ಯಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ‘ಎಲ್ಲಿದೆಯೋ ... ಅಲ್ಲಿಯೇ’ ಎಂಬ ರಚನೆ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ ಸಮಾನಾಂತರವನ್ನು ಉಳಿಸುತ್ತದೆ. ಏಕವಚನದ ‘ನಿನ್ನ’ ಅನ್ನು ಮೂಲದ σου ಅನುಸಾರ ಉಳಿಸಲಾಗಿದೆ.
