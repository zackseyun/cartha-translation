revisions:
- from: ಏಕೆಂದರೆ ನಿನ್ನ ಸಂಪತ್ತು ಎಲ್ಲಿದೆಯೋ, ಅಲ್ಲಿಯೇ ನಿನ್ನ ಹೃದಯವೂ ಇರುವುದು.[a]
  to: ಏಕೆಂದರೆ ನಿನ್ನ ಸಂಪತ್ತು ಎಲ್ಲಿದೆಯೋ, ಅಲ್ಲಿಯೇ ನಿನ್ನ ಹೃದಯವೂ ಇರುತ್ತದೆ.[a]
  rationale: The revision changes only the predicate from “ಇರುವುದು” to “ಇರುತ್ತದೆ,” making the future force of ἔσται explicit in idiomatic modern standard Kannada. The footnote retains the documented present-tense alternative and correctly anchors it at the sentence-ending marker.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the locative correlation (ὅπου … ἐκεῖ), both possessive pronouns, θησαυρός as “ಸಂಪತ್ತು,” καρδία as “ಹೃದಯ,” and the additive force of καί in “ಹೃದಯವೂ.” However, “ಇರುವುದು” can function as an infinitival/nominal verbal form in Kannada and does not mark the Greek future ἔσται as clearly as a finite future verb does.
  naturalness: The wording is otherwise fluent modern standard Kannada. Replacing “ಇರುವುದು” with “ಇರುತ್ತದೆ” gives an unambiguously finite, natural future predicate.
  terminology: “ಸಂಪತ್ತು” and “ಹೃದಯ” are established, suitably broad renderings that preserve the source wording without theological over-interpretation.
  issues:
  - severity: low
    issue: The main-text verb “ಇರುವುದು” is not an explicit finite future form.
    rationale: Since ἔσται is future indicative, “ಇರುತ್ತದೆ” is the clearer modern Kannada equivalent and avoids possible reading as a non-finite or generalized construction.
  revised_text: ಏಕೆಂದರೆ ನಿನ್ನ ಸಂಪತ್ತು ಎಲ್ಲಿದೆಯೋ, ಅಲ್ಲಿಯೇ ನಿನ್ನ ಹೃದಯವೂ ಇರುತ್ತದೆ.[a]
  revised_footnotes:
