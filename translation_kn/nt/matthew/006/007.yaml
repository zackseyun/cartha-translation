  to: ನೀವು ಪ್ರಾರ್ಥಿಸುವಾಗ, ಅನ್ಯಜನರಂತೆ[b] ಅರ್ಥವಿಲ್ಲದ ಮಾತುಗಳನ್ನು ರಾಶಿ ರಾಶಿಯಾಗಿ ಹೇಳಬೇಡಿ[a]; ಏಕೆಂದರೆ ತಾವು ಬಹಳವಾಗಿ ಮಾತನಾಡುವುದರಿಂದ ತಮಗೆ ಕಿವಿಗೊಡಲಾಗುವುದು ಎಂದು ಅವರು ಭಾವಿಸುತ್ತಾರೆ.
  rationale: ಪಾದಟಿಪ್ಪಣಿ b ಯನ್ನು ಅದು ವಿವರಿಸುವ ‘ಅನ್ಯಜನರಂತೆ’ ಪದದ ತಕ್ಷಣ ಸ್ಥಳಾಂತರಿಸಲಾಗಿದೆ. ಮಾತಿನ ಅಧಿಕ್ಯವನ್ನು ಸೂಚಿಸುವ ಎರಡು ನುಡಿಗಳನ್ನು ಹೆಚ್ಚು ಸಹಜ ಕನ್ನಡಕ್ಕೆ ಪರಿಷ್ಕರಿಸಲಾಗಿದೆ. βατταλογέωಗೆ ತಪ್ಪಾಗಿ ತೊದಲುವಿಕೆಯನ್ನು ಸೂಚಿಸಬಹುದಾದ ಪರ್ಯಾಯವನ್ನು ತೆಗೆದು, ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುವ ‘ಬಡಬಡಿಸಬೇಡಿ’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ಬಳಸಲಾಗಿದೆ. ಪರಿಷ್ಕರಣೆಯು ಮೂಲಾರ್ಥ, ವಾಕ್ಯದ ಎಚ್ಚರಿಕೆಯ ಸ್ವರೂಪ, ಮತ್ತು ಎಲ್ಲ ಪ್ರಾಮಾಣಿಕ ಪುನರಾವರ್ತಿತ ಪ್ರಾರ್ಥನೆಗಳನ್ನೂ ನಿರ್ಬಂಧಿಸದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
