id: MAT.6.7
reference: Matthew 6:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: kn
  text: ನೀವು ಪ್ರಾರ್ಥಿಸುವಾಗ, ಅನ್ಯಜನರಂತೆ[b] ಅರ್ಥವಿಲ್ಲದ ಮಾತುಗಳನ್ನು ರಾಶಿ ರಾಶಿಯಾಗಿ ಹೇಳಬೇಡಿ[a]; ಏಕೆಂದರೆ ತಾವು ಬಹಳವಾಗಿ ಮಾತನಾಡುವುದರಿಂದ ತಮಗೆ ಕಿವಿಗೊಡಲಾಗುವುದು ಎಂದು ಅವರು ಭಾವಿಸುತ್ತಾರೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಬಡಬಡಿಸಬೇಡಿ’ ಅಥವಾ ‘ಅರ್ಥವಿಲ್ಲದೆ ಪುನಃ ಪುನಃ ಹೇಳಬೇಡಿ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಅಪರೂಪದ್ದು; ಅದು ಪ್ರಾಮಾಣಿಕವಾದ ಪುನರಾವರ್ತಿತ ಪ್ರಾರ್ಥನೆಗಿಂತ ಖಾಲಿ, ಯಾಂತ್ರಿಕ, ಅಥವಾ ಅತಿಯಾದ ಮಾತನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಅನ್ಯಜನರು’ ಎಂದರೆ ಇಲ್ಲಿ ಯೆಹೂದ್ಯರಲ್ಲದ ಜನರು; ಇದನ್ನು ‘ಬೇರೆ ಜನಾಂಗಗಳವರು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: ನೀವು ಪ್ರಾರ್ಥಿಸುವಾಗ
  rationale: ಈ ಕ್ರಿಯಾಪದೀಯ ರೂಪವು ಆಜ್ಞೆ ಅನ್ವಯಿಸುವ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಆಯ್ಕೆ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘when you pray’ ಎಂಬ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸದೆ ವಾಕ್ಯದ ಮುಂದುವರಿಕೆಯಲ್ಲಿ ಒಳಗೊಳ್ಳಿಸಲಾಗಿದೆ
  rationale: ಇಲ್ಲಿ δέ ಬಲವಾದ ವಿರೋಧಕ್ಕಿಂತ ಬೋಧನೆಯ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮತ್ತು’ ಎಂದು ಆರಂಭಿಸುವುದು ಅನಗತ್ಯವಾಗಿ ಕೃತಕವಾಗುವುದರಿಂದ ಅದರ ಕಾರ್ಯವನ್ನು ವಾಕ್ಯಕ್ರಮವೇ ಹೊರುತ್ತದೆ.
- source_word: μὴ βατταλογήσητε
  choice: ಅರ್ಥವಿಲ್ಲದ ಮಾತುಗಳನ್ನು ರಾಶಿಹಾಕಬೇಡಿ
  rationale: ಅಪರೂಪದ βατταλογέω ಯಾಂತ್ರಿಕ, ಟೊಳ್ಳಾದ ಅಥವಾ ಅತಿಯಾದ ಮಾತನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆಯಿದೆ. ಈ ಅನುವಾದವು ಎಲ್ಲ ಪುನರಾವರ್ತನೆಯನ್ನೂ ನಿಷೇಧಿಸಲಾಗಿದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಹೇರದೆ, ಖಾಲಿ ಮಾತಿನ ಅಧಿಕ್ಯವನ್ನು ಹಿಡಿಯುತ್ತದೆ.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: ಅನ್ಯಜನರಂತೆ
  rationale: ಯೆಹೂದ್ಯ ಸಂದರ್ಭದಲ್ಲಿನ ἐθνικοί ಒಡಂಬಡಿಕೆಯ ಜನರ ಹೊರಗಿನ ಜನಾಂಗಗಳನ್ನು, ಅಂದರೆ ಯೆಹೂದ್ಯೇತರರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅನ್ಯಜನರು’ ಕನ್ನಡದ ಸಾಂಪ್ರದಾಯಿಕವಾಗಿಯೂ ಗ್ರಾಹ್ಯವಾಗಿಯೂ ಇರುವ ನೇರ ಪದ.
- source_word: δοκοῦσιν
  choice: ಅವರು ಭಾವಿಸುತ್ತಾರೆ
  rationale: ಇದು ಅವರ ಊಹೆ ಅಥವಾ ನಂಬಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: ತಮ್ಮ ಮಾತುಗಳ ಹೆಚ್ಚಳದಿಂದಲೇ
  rationale: πολυλογία ಬಹಳವಾಗಿ ಮಾತಾಡುವುದು ಅಥವಾ ಮಾತಿನ ಅಧಿಕ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘-ದಿಂದಲೇ’ ಎಂಬ ರೂಪವು ದೇವರು ಕೇಳುವುದಕ್ಕೆ ತಮ್ಮ ಮಾತಿನ ಪ್ರಮಾಣವೇ ಕಾರಣವೆಂಬ ಅವರ ತಪ್ಪು ನಿರೀಕ್ಷೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: εἰσακουσθήσονται
  choice: ತಮಗೆ ಕಿವಿಗೊಡಲಾಗುವುದು
  rationale: ಈ ಕರ್ಮಣಿ ರೂಪವು ಅನುಕೂಲವಾಗಿ ಕೇಳಿಸಿಕೊಳ್ಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕಿವಿಗೊಡಲಾಗುವುದು’ ಎಂಬುದು ‘ಉತ್ತರ ಸಿಗುವುದು’ ಎಂಬ ಹೆಚ್ಚು ಬಲವಾದ ಅರ್ಥವನ್ನು ಸೇರಿಸದೆ, ಕೇವಲ ಧ್ವನಿ ಕೇಳಿಸುವುದಕ್ಕಿಂತ ಹೆಚ್ಚು ಗಮನಪೂರ್ವಕವಾಗಿ ಕೇಳುವುದನ್ನು ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸು ಪ್ರಾರ್ಥನೆಯಲ್ಲಿನ ಎಲ್ಲ ಪುನರಾವರ್ತನೆಯನ್ನು ನಿಷೇಧಿಸುತ್ತಾರೋ, ಅಥವಾ ಖಾಲಿ ಮತ್ತು ಅತಿಯಾದ ಮಾತನ್ನು ಮಾತ್ರ ನಿಷೇಧಿಸುತ್ತಾರೋ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಅರ್ಥವಿಲ್ಲದ ಮಾತುಗಳನ್ನು ರಾಶಿಹಾಕಬೇಡಿ’ ಎಂದು ಅನುವಾದಿಸಿ, ಖಾಲಿ ಮಾತಿನ ಅಧಿಕ್ಯವನ್ನು ನಿಷೇಧಿಸಲಾಗಿದೆ ಎಂದು ತೋರಿಸಲಾಗಿದೆ.
  alternative: ‘ತೊದಲುತ್ತ ಮಾತಾಡಬೇಡಿ’ ಅಥವಾ ‘ಅರ್ಥವಿಲ್ಲದೆ ಪುನಃ ಪುನಃ ಹೇಳಬೇಡಿ.’
  rationale: ಅಪರೂಪದ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ನಿಖರ ವ್ಯಾಪ್ತಿ ಸಂಪೂರ್ಣ ಖಚಿತವಲ್ಲ. ಈ ಆಯ್ಕೆ ಪ್ರಾಮಾಣಿಕವಾಗಿ ಪುನರಾವರ್ತಿಸುವ ಎಲ್ಲ ಪ್ರಾರ್ಥನೆಗಳನ್ನೂ ಖಂಡಿಸುವುದಿಲ್ಲ; ಅನೇಕ ಮಾತುಗಳ ಮೂಲಕ ದೇವರ ಗಮನವನ್ನು ಪಡೆಯಬಹುದು ಎಂಬ ಮನೋಭಾವವನ್ನು ವಾಕ್ಯದ ಎರಡನೇ ಭಾಗದೊಂದಿಗೆ ಸಂಬಂಧಿಸುತ್ತದೆ.
- issue: εἰσακουσθήσονται ಎಂದರೆ ಕೇವಲ ಕೇಳಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಪ್ರಾರ್ಥನೆಗೆ ಉತ್ತರ ದೊರಕುವುದೋ
  choice: ‘ತಮಗೆ ಕಿವಿಗೊಡಲಾಗುವುದು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ತಮ್ಮ ಪ್ರಾರ್ಥನೆಗೆ ಉತ್ತರ ಸಿಗುವುದು.’
  rationale: ಮೂಲದ ಕರ್ಮಣಿ ಕ್ರಿಯಾಪದವು ಅನುಕೂಲವಾಗಿ ಕೇಳಿಸಿಕೊಳ್ಳುವ ಅರ್ಥ ಹೊಂದಿದ್ದರೂ, ಉತ್ತರ ಖಚಿತವಾಗಿ ದೊರಕುತ್ತದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಅನುವಾದದಲ್ಲೇ ಪೂರ್ಣವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಅನ್ಯಜನರು’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಅದರ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ ಎರಡೂ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು [a], [b] ಕ್ರಮವಾಗಿ ಸೇರಿವೆ.
