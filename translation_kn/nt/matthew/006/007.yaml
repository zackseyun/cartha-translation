  source_fidelity: 'ಮುಖ್ಯ ಅರ್ಥವು ಗ್ರೀಕ್ ಮೂಲಕ್ಕೆ ನಿಷ್ಠವಾಗಿದೆ: βατταλογήσητε ಅನ್ನು ಖಾಲಿ/ಅತಿಯಾದ ಮಾತಿನ ವಿರುದ್ಧದ ಎಚ್ಚರಿಕೆಯಾಗಿ ನೀಡಲಾಗಿದೆ; πολυλογία ಮತ್ತು εἰσακουσθήσονται ಸಹ ಸಮರ್ಪಕವಾಗಿ ಪ್ರತಿನಿಧಿತವಾಗಿವೆ. ಆದರೆ ‘ಅನ್ಯಜನರು’ ಕುರಿತ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು ಅಂತ್ಯದ ವಾಕ್ಯಕ್ಕೆ ಬಿದ್ದಿದ್ದು, ಮೂಲಪದ ἐθνικοί ಇರುವ ಸ್ಥಳದಲ್ಲೇ ಇರಬೇಕು.'
