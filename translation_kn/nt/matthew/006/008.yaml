review_pass:
  verdict: revise
  source_fidelity: The draft conveys the inferential prohibition and the Father's prior knowledge of the disciples' needs. However, repeating “ನಿಮ್ಮ ತಂದೆಯನ್ನು” where Greek uses the pronoun αὐτόν is unnecessary, and the following honorific plural “ಅವರಿಗೆ” creates an avoidable shift in reference/agreement. A direct pronoun preserves the Greek sequence and improves clarity.
  naturalness: “ನಿಮಗೆ ಏನೇನು ಬೇಕೆಂಬುದು ಅವರಿಗೆ ತಿಳಿದಿದೆ” is understandable, but “ನಿಮಗೆ ಏನು ಬೇಕೆಂದು ನಿಮ್ಮ ತಂದೆಗೆ ತಿಳಿದಿದೆ” is more idiomatic modern standard Kannada. “ನೀವು ಆತನನ್ನು ಕೇಳುವ ಮೊದಲೇ” reads naturally and retains the explicit object of αἰτῆσαι.
  terminology: “ನಿಮ್ಮ ತಂದೆ” correctly avoids adding “heavenly.” “ಅವರಂತಾಗಬೇಡಿ” is an appropriate idiomatic rendering of the prohibition. The alternative passive nuance belongs appropriately in a footnote.
  issues:
  - severity: low
    issue: The main text repeats “ನಿಮ್ಮ ತಂದೆಯನ್ನು” for αὐτόν and then switches to “ಅವರಿಗೆ.”
    rationale: The Greek first names “your Father” and then uses “him.” Using “ಆತನನ್ನು” followed by “ನಿಮ್ಮ ತಂದೆಗೆ” makes the referent and sentence structure more consistent in Kannada without adding content.
  - severity: low
    issue: “ಏನೇನು” is somewhat colloquial and can suggest an emphatic variety of items.
    rationale: The Greek simply expresses the things that the disciples need. “ಏನು ಬೇಕೆಂದು” is concise, natural, and sufficiently broad.
  revised_text: ಆದ್ದರಿಂದ ಅವರಂತಾಗಬೇಡಿ[a]. ಏಕೆಂದರೆ, ನೀವು ಆತನನ್ನು ಕೇಳುವ ಮೊದಲೇ ನಿಮಗೆ ಏನು ಬೇಕೆಂದು ನಿಮ್ಮ ತಂದೆಗೆ ತಿಳಿದಿದೆ.
