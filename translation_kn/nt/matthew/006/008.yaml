- from: ಆದ್ದರಿಂದ, ಅವರಂತಾಗಬೇಡಿ[a]. ಏಕೆಂದರೆ ನೀವು ನಿಮ್ಮ ತಂದೆಯನ್ನು ಕೇಳುವುದಕ್ಕಿಂತ ಮುಂಚೆಯೇ ನಿಮಗೆ ಏನೇನು ಬೇಕೆಂಬುದು ಅವರಿಗೆ ತಿಳಿದಿದೆ.
  to: ಆದ್ದರಿಂದ ಅವರಂತಾಗಬೇಡಿ[a]. ಏಕೆಂದರೆ, ನೀವು ಆತನನ್ನು ಕೇಳುವ ಮೊದಲೇ ನಿಮಗೆ ಏನು ಬೇಕೆಂದು ನಿಮ್ಮ ತಂದೆಗೆ ತಿಳಿದಿದೆ.
  rationale: 'The revision preserves every source element: οὖν (“ಆದ್ದರಿಂದ”), the prohibition against becoming like “them,” the Father’s knowledge, the disciples’ needs, and the temporal priority before their asking him. It improves modern Kannada flow and referential consistency while neither adding “heavenly” nor resolving the verse’s theological implications.'
