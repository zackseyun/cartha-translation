id: MAT.6.8
reference: Matthew 6:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ ಅವರಂತಾಗಬೇಡಿ[a]. ಏಕೆಂದರೆ, ನೀವು ಆತನನ್ನು ಕೇಳುವ ಮೊದಲೇ ನಿಮಗೆ ಏನು ಬೇಕೆಂದು ನಿಮ್ಮ ತಂದೆಗೆ ತಿಳಿದಿದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃ: “ಅವರಂತೆ ಮಾಡಲ್ಪಡಬೇಡಿ”; ಅಥವಾ, “ಅವರಂತೆ ಇರಬೇಡಿ.”'
    reason: ὁμοιωθῆτε ಎಂಬ ಪ್ಯಾಸಿವ್ ರೂಪದ ಅಕ್ಷರಶಃ ಸಾಧ್ಯತೆ ಮತ್ತು ಸ್ಥಿತಿಸೂಚಕ ಪರ್ಯಾಯವನ್ನು ದಾಖಲಿಸಲು.
lexical_decisions:
- source_word: μὴ οὖν
  choice: ಆದ್ದರಿಂದ ... ಆಗಬೇಡಿ
  rationale: ನಿಷೇಧಾರ್ಥಕ μή ಮತ್ತು ಹಿಂದಿನ ಎಚ್ಚರಿಕೆಯಿಂದ ಬರುವ ತೀರ್ಮಾನವನ್ನು ಸೂಚಿಸುವ οὖν ಎರಡನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁμοιωθῆτε
  choice: ಅವರಂತಾಗಬೇಡಿ
  rationale: ಅಓರಿಸ್ಟ್ ಪ್ಯಾಸಿವ್ ಸಬ್‌ಜಂಕ್ಟಿವ್‌ನ ನಿಷೇಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಅವರ ಮಾದರಿಗೆ ಹೊಂದಿಕೊಳ್ಳುವ ಅಥವಾ ಅವರಂತೆ ಆಗುವ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರ
  rationale: ತಕ್ಷಣದ ಪೂರ್ವಸಂದರ್ಭದಲ್ಲಿರುವ ಅನ್ಯಜನರನ್ನು ಸೂಚಿಸುವ ಸರ್ವನಾಮವನ್ನು ಅನಗತ್ಯ ವಿವರಣೆಯಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: οἶδεν
  choice: ತಿಳಿದಿದೆ
  rationale: ರೂಪತಃ ಪರ್ಫೆಕ್ಟ್ ಆಗಿದ್ದರೂ ವರ್ತಮಾನಾರ್ಥ ಹೊಂದಿರುವ οἶδα ಅನ್ನು ಸಹಜ ಕನ್ನಡದ ವರ್ತಮಾನ ಸ್ಥಿತಿಯಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ನಿಮ್ಮ ತಂದೆ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿರುವ ಸರಳ ಪದಪ್ರಯೋಗವನ್ನೇ ಉಳಿಸಿ, ಇಲ್ಲಿಲ್ಲದ ‘ಪರಲೋಕದ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: ὧν χρείαν ἔχετε
  choice: ನಿಮಗೆ ಏನೇನು ಬೇಕೆಂಬುದು
  rationale: ಶಿಷ್ಯರ ಅಗತ್ಯಗಳ ವಿಷಯವಸ್ತುವನ್ನು ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: ನೀವು ನಿಮ್ಮ ತಂದೆಯನ್ನು ಕೇಳುವುದಕ್ಕಿಂತ ಮುಂಚೆಯೇ
  rationale: πρὸ τοῦ ಜೊತೆಯ ಅನಂತಕ್ರಿಯಾಪದ ಸೂಚಿಸುವ ಪೂರ್ವಕಾಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಅವರನ್ನು’ ಎಂಬುದಕ್ಕಿಂತ ಸಂಬಂಧಸೂಚಕ ‘ನಿಮ್ಮ ತಂದೆಯನ್ನು’ ಕನ್ನಡದಲ್ಲಿ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪ್ರಾರ್ಥನೆಗೆ ಸಂಬಂಧಿಸಿದ ದೈವಿಕ ಪೂರ್ವಜ್ಞಾನ
  choice: ಶಿಷ್ಯರು ಕೇಳುವ ಮೊದಲೇ ತಂದೆಗೆ ಅವರ ಅಗತ್ಯಗಳು ತಿಳಿದಿವೆ ಎಂಬ ಹೇಳಿಕೆಯನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಪ್ರಾರ್ಥನೆ ಮಾಹಿತಿ ನೀಡುವುದಕ್ಕಲ್ಲ, ಸಂಬಂಧಕ್ಕಾಗಿದೆ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಸೇರಿಸುವುದು; ಅಥವಾ ಸಮಗ್ರ ದೈವಿಕ ಪೂರ್ವಜ್ಞಾನವನ್ನು ಒತ್ತಿಹೇಳುವ ಸಿದ್ಧಾಂತಪರ ಪದಗಳನ್ನು ಸೇರಿಸುವುದು.
  rationale: ಮೂಲವಾಕ್ಯವು ತಂದೆಯ ಪೂರ್ವಜ್ಞಾನವನ್ನು ಮಾತ್ರ ಹೇಳುತ್ತದೆ. ಪ್ರಾರ್ಥನೆ ಇನ್ನೂ ಏಕೆ ಬೇಕು ಎಂಬ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಅನುವಾದವೇ ಪರಿಹರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ‘ನಿಮ್ಮ ತಂದೆ’ ಎಂಬ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅಡಿಕುರಿತು ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
