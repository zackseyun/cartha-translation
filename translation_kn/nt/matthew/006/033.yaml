review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the adversative δέ, priority πρῶτον, the paired objects, and the future passive promise. The translation of αὐτοῦ as applying to both 'kingdom' and 'righteousness' accords with the immediate context, though Greek formally places the pronoun after δικαιοσύνην. 'ಸೇರಿಸಲ್ಪಡುವವು' is overly literal and awkward in modern Kannada for προστεθήσεται.
  naturalness: The first clause is clear and appropriately reverent. Replacing 'ಸೇರಿಸಲ್ಪಡುವವು' with 'ಹೆಚ್ಚುವರಿಯಾಗಿ ಕೊಡಲ್ಪಡುವವು' gives natural Kannada while retaining the future passive and the sense that these things are given in addition.
  terminology: ರಾಜ್ಯ and ನೀತಿ are established, comprehensible renderings for βασιλεία and δικαιοσύνη. The footnote appropriately retains 'ನ್ಯಾಯ' as a lexical alternative without narrowing the main rendering.
  issues:
  - severity: medium
    issue: ‘ಸೇರಿಸಲ್ಪಡುವವು’ is not natural idiomatic Kannada in this promise.
    rationale: Though mechanically close to ‘will be added,’ it can suggest items being physically joined rather than necessities being granted in addition. ‘ಹೆಚ್ಚುವರಿಯಾಗಿ ಕೊಡಲ್ಪಡುವವು’ preserves the additive force and Greek passive in natural modern Kannada.
