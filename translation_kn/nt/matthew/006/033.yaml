id: MAT.6.33
reference: Matthew 6:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: kn
  text: ಆದರೆ ಮೊದಲು ಆತನ ರಾಜ್ಯವನ್ನೂ ಆತನ ನೀತಿಯನ್ನೂ[a] ಹುಡುಕಿರಿ; ಆಗ ಇವೆಲ್ಲವೂ ನಿಮಗೆ ಹೆಚ್ಚುವರಿಯಾಗಿ ಕೊಡಲ್ಪಡುವವು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಆತನ ನ್ಯಾಯವನ್ನು.’ ಗ್ರೀಕ್ ಪದವು ‘ನೀತಿ’ ಅಥವಾ ‘ನ್ಯಾಯ’ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಸೂಚಿಸಬಹುದು. ಇಲ್ಲಿ ದೇವರ ಮುಂದೆ ಸರಿಯಾದ ಸಂಬಂಧ ಮತ್ತು ನಡತೆಯೂ ಒಳಗೊಂಡಿರುವುದರಿಂದ ‘ನೀತಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: ಹುಡುಕಿರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಬಹುವಚನ ಆಜ್ಞೆಯು ನಿರಂತರವಾದ ಸಕ್ರಿಯ ಅನ್ವೇಷಣೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹುಡುಕಿರಿ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಆ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಚನಗಳಲ್ಲಿರುವ ಆಹಾರ, ಪಾನೀಯ, ಉಡುಪುಗಳ ಕುರಿತ ಚಿಂತೆಗೆ ವಿರುದ್ಧವಾದ ತಿರುವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: πρῶτον
  choice: ಮೊದಲು
  rationale: ಕ್ರಮದ ಅರ್ಥವನ್ನೂ ಆದ್ಯತೆಯ ಅರ್ಥವನ್ನೂ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: βασιλείαν
  choice: ರಾಜ್ಯ
  rationale: ಈ ಪದವು ರಾಜನ ಆಳ್ವಿಕೆ ಮತ್ತು ಅವನ ರಾಜ್ಯವ್ಯವಸ್ಥೆ ಎರಡನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲದು; ಮತ್ತಾಯನಲ್ಲಿ ‘ರಾಜ್ಯ’ ಸ್ಥಿರವೂ ಸಹಜವೂ ಆದ ಪದಪ್ರಯೋಗವಾಗಿದೆ.
- source_word: δικαιοσύνην
  choice: ನೀತಿ
  rationale: ‘ನೀತಿ’ ದೇವರ ಚಿತ್ತಕ್ಕೆ ಅನುಗುಣವಾದ ಸರಿಯಾದ ಸಂಬಂಧ ಮತ್ತು ನಡತೆಯ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಹೊತ್ತುಕೊಳ್ಳುತ್ತದೆ; ‘ನ್ಯಾಯ’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: αὐτοῦ
  choice: ಆತನ
  rationale: ಗ್ರೀಕ್ ಸರ್ವನಾಮವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭದಲ್ಲಿದು ದೇವರನ್ನು, ಅಂದರೆ ತಂದೆಯನ್ನು, ಸೂಚಿಸುತ್ತದೆ.
- source_word: ταῦτα πάντα
  choice: ಇವೆಲ್ಲವೂ
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿ ಹೇಳಿರುವ ಆಹಾರ, ಪಾನೀಯ ಮತ್ತು ಉಡುಪು ಮುಂತಾದ ಅಗತ್ಯಗಳನ್ನು ಸೂಚಿಸುವ ನಿರ್ದೇಶಕ ಪದಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: προστεθήσεται
  choice: ಸೇರಿಸಲ್ಪಡುವವು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನೂ ಮುಖ್ಯವಾಗಿ ಹುಡುಕಬೇಕಾದುದಕ್ಕೆ ಇವು ಹೆಚ್ಚಾಗಿ ಸೇರಿಸಲ್ಪಡುವ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑμῖν
  choice: ನಿಮಗೆ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: δικαιοσύνην ಪದದ ಅನುವಾದ
  choice: ನೀತಿ
  alternative: ನ್ಯಾಯ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಕೇವಲ ನ್ಯಾಯಾಂಗ ಅಥವಾ ಸಾಮಾಜಿಕ ನ್ಯಾಯವನ್ನಲ್ಲ, ದೇವರ ಚಿತ್ತಕ್ಕೆ ಹೊಂದುವ ಸರಿಯಾದ ಸ್ಥಿತಿ ಮತ್ತು ನಡತೆಯನ್ನೂ ಒಳಗೊಂಡಿದೆ. ಆದ್ದರಿಂದ ವಿಶಾಲಾರ್ಥದ ‘ನೀತಿ’ಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇಟ್ಟು, ‘ನ್ಯಾಯ’ವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: αὐτοῦ ಪದದ ಉಲ್ಲೇಖಿತ ವ್ಯಕ್ತಿ
  choice: ಆತನ
  alternative: ದೇವರ
  rationale: ಸಂದರ್ಭವು ದೇವರನ್ನು/ತಂದೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್‌ನ ಸರ್ವನಾಮರೂಪ ಮತ್ತು ಅದರ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ. ಮೂಲದ ಸಮಾನಾಂತರ ರಚನೆ ಮತ್ತು ಧಾರ್ಮಿಕ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸಲಾಗಿದೆ.
