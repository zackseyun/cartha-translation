id: MAT.6.3
reference: Matthew 6:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: kn
  text: ಆದರೆ ನೀನು ಬಡವರಿಗೆ ದಾನ ಕೊಡುವಾಗ[a], ನಿನ್ನ ಬಲಗೈ ಏನು ಮಾಡುತ್ತದೋ ಅದು ನಿನ್ನ ಎಡಗೈಗೆ ತಿಳಿಯದಿರಲಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನೀನು ಧರ್ಮದಾನ ಮಾಡುವಾಗ’; ಗ್ರೀಕ್ ಪದವು ಬಡವರಿಗೆ ಮಾಡುವ ದಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: ಆದರೆ ನೀನು ... ಕೊಡುವಾಗ
  rationale: δέ ಹಿಂದಿನ ಮಾತಿಗೆ ವ್ಯತ್ಯಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ; genitive absolute ಅನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಆದರೆ ನೀನು ... ಕೊಡುವಾಗ’ ಎಂದು ನೀಡಲಾಗಿದೆ. ποιέω ಮತ್ತು ἐλεημοσύνην ಒಟ್ಟಾಗಿ ಇಲ್ಲಿ ದಾನ ಮಾಡುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತವೆ.
- source_word: ἐλεημοσύνην
  choice: ಬಡವರಿಗೆ ದಾನ
  rationale: ಈ ಗ್ರೀಕ್ ಪದವು ಬಡವರಿಗೆ ಅಥವಾ ಅಗತ್ಯದಲ್ಲಿರುವವರಿಗೆ ಮಾಡುವ ಧರ್ಮದಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಬಡವರಿಗೆ ದಾನ’ ಆ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: μὴ γνώτω
  choice: ತಿಳಿಯದಿರಲಿ
  rationale: μή ಜೊತೆಯ ಮೂರನೇ ಪುರುಷ imperative ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ನಿಷೇಧಾತ್ಮಕ ಆಜ್ಞೆಯಾಗಿ ನೀಡಲಾಗಿದೆ; ಕೈಗಳ ವ್ಯಕ್ತೀಕರಣವೂ ಉಳಿದಿದೆ.
- source_word: ἡ ἀριστερά σου
  choice: ನಿನ್ನ ಎಡಗೈ
  rationale: ರೂಪಕ ಮತ್ತು ಸ್ಮರಣೀಯ ಸಮಾನಾಂತರ ರಚನೆಯನ್ನು ಉಳಿಸುವ ನೇರ ಅನುವಾದ.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ನಿನ್ನ ಬಲಗೈ ಮಾಡುವುದು
  rationale: ποιεῖ ಎಂಬ ವರ್ತಮಾನಕಾಲದ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ನಡೆಯುತ್ತಿರುವ ದಾನಕ್ರಿಯೆಯ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಎಡಗೈ ಮತ್ತು ಬಲಗೈ ಕುರಿತ ಮಾತಿನ ಅರ್ಥ
  choice: ದಾನದಲ್ಲಿ ಸ್ವಪ್ರದರ್ಶನವನ್ನು ಬಿಟ್ಟು ಅತ್ಯಂತ ರಹಸ್ಯವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂಬ ಜೀವಂತ ರೂಪಕವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ಸಾಮಾನ್ಯ ವಿನಯದ ವಿವರಣೆಯಾಗಿ ಪರಿವರ್ತಿಸುವುದು, ಅಥವಾ ಎಲ್ಲ ಸಾರ್ವಜನಿಕ ದಾನವನ್ನೂ ನಿರಪವಾದವಾಗಿ ನಿಷೇಧಿಸುವ ನಿಯಮವೆಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು.
  rationale: ಮೂಲಪಾಠವು ವ್ಯಕ್ತೀಕರಣ ಮತ್ತು ಅತಿಶಯೋಕ್ತಿಯ ಚಿತ್ರವನ್ನು ಬಳಸುತ್ತದೆ. ಅದನ್ನು ವಿವರಣಾತ್ಮಕ ಪರ್ಯಾಯವಾಕ್ಯವಾಗಿ ಸಮತಟ್ಟಾಗಿಸದೆ ಉಳಿಸುವುದು, ಪಾಠಕ್ಕಿಂತ ಕಠಿಣವಾದ ಸಿದ್ಧಾಂತವನ್ನು ಹೇರದೆ ಅದರ ಒತ್ತನ್ನು ಕಾಪಾಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ‘ಬಡವರಿಗೆ ದಾನ’ ಎಂಬುದು ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಎಡಗೈ—ಬಲಗೈ’ ರೂಪಕವನ್ನು ಅಕ್ಷುಣ್ಣವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
