review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the iterative temporal clause, the prohibition directed at performative fasting, the purpose clause, and the idiom that the reward has been received in full. However, “ಮಾಡುತ್ತಿದ್ದೇವೆಂದು” is first-person plural and does not agree with the third-person subject “ಅವರು”; it must be corrected. The first clause also folds the adjective “gloomy” into an action upon the face, whereas the Greek directly prohibits becoming gloomy like the hypocrites.
  naturalness: The wording is generally modern and readable. “ಮುಖಗಳನ್ನು ವಿಕಾರಗೊಳಿಸುತ್ತಾರೆ” can suggest physical deformation and is less idiomatic for the deliberate neglect or alteration of appearance meant here. “ತಮ್ಮ ಮುಖಗಳ ರೂಪವನ್ನು ಕೆಡಿಸಿಕೊಳ್ಳುತ್ತಾರೆ” is more natural in context.
  terminology: “ಉಪವಾಸ,” “ಕಪಟಿಗಳು,” “ಜನರು,” and “ಪ್ರತಿಫಲ” are suitable modern-standard Kannada renderings. “ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ” appropriately conveys the solemn formula without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: Person disagreement in the purpose clause
    rationale: “ತಾವು ಉಪವಾಸ ಮಾಡುತ್ತಿದ್ದೇವೆಂದು” uses first-person plural verbal morphology (‘we are fasting’) despite the subject being ‘they.’ The Greek participle νηστεύοντες refers to the hypocrites, so Kannada requires third-person wording.
  - severity: low
    issue: The prohibition is more directly about becoming gloomy
    rationale: “ಮುಖವನ್ನು ಕಳೆಗುಂದಿಸಿಕೊಳ್ಳಬೇಡಿ” is understandable, but μὴ γίνεσθε ... σκυθρωποί directly says not to become gloomy. Rendering this as “ಕಳೆಗುಂದಿದವರಾಗಬೇಡಿ” preserves the predication and leaves the following reference to faces distinct.
  - severity: low
    issue: “ವಿಕಾರಗೊಳಿಸುತ್ತಾರೆ” is overly physical and somewhat unnatural here
    rationale: ἀφανίζουσιν in this setting concerns making the face look neglected or altered to advertise fasting, not necessarily physically deforming it. A contextual expression about spoiling one’s facial appearance better preserves the image.
