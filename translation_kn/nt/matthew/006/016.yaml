revisions:
- from: 'ನೀವು ಉಪವಾಸ ಮಾಡುವಾಗಲೆಲ್ಲ, ಕಪಟಿಗಳಂತೆ ಮುಖವನ್ನು ಕಳೆಗುಂದಿಸಿಕೊಳ್ಳಬೇಡಿ. ತಾವು ಉಪವಾಸ ಮಾಡುತ್ತಿದ್ದೇವೆಂದು ಜನರಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳುವುದಕ್ಕಾಗಿ ಅವರು ತಮ್ಮ ಮುಖಗಳನ್ನು ವಿಕಾರಗೊಳಿಸುತ್ತಾರೆ. ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ತಿಯಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ.'
  to: 'ನೀವು ಉಪವಾಸ ಮಾಡುವಾಗಲೆಲ್ಲ, ಕಪಟಿಗಳಂತೆ ಕಳೆಗುಂದಿದವರಾಗಬೇಡಿ. ಅವರು ತಾವು ಉಪವಾಸ ಮಾಡುತ್ತಿದ್ದಾರೆ ಎಂದು ಜನರಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಲೆಂದು ತಮ್ಮ ಮುಖಗಳ ರೂಪವನ್ನು ಕೆಡಿಸಿಕೊಳ್ಳುತ್ತಾರೆ. ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ತಿಯಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ.'
  rationale: The revision corrects the third-person agreement error, distinguishes the command not to become gloomy from the subsequent action involving their faces, and uses more idiomatic Kannada for the intentional alteration of appearance. It retains the source’s iterative force, purpose clause, generic sense of τοῖς ἀνθρώποις, and the full-payment force of ἀπέχουσιν.
