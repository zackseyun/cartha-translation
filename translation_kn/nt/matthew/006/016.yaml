id: MAT.6.16
reference: Matthew 6:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: kn
  text: 'ನೀವು ಉಪವಾಸ ಮಾಡುವಾಗಲೆಲ್ಲ, ಕಪಟಿಗಳಂತೆ ಕಳೆಗುಂದಿದವರಾಗಬೇಡಿ. ಅವರು ತಾವು ಉಪವಾಸ ಮಾಡುತ್ತಿದ್ದಾರೆ ಎಂದು ಜನರಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಲೆಂದು ತಮ್ಮ ಮುಖಗಳ ರೂಪವನ್ನು ಕೆಡಿಸಿಕೊಳ್ಳುತ್ತಾರೆ. ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ತಿಯಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: ನೀವು ಉಪವಾಸ ಮಾಡುವಾಗಲೆಲ್ಲ
  rationale: ὅταν ಎಂಬ ಅನಿರ್ದಿಷ್ಟ ಕಾಲಸೂಚಕ ಪದದ ಪುನರಾವರ್ತಿತ ಅರ್ಥವನ್ನು ‘ಮಾಡುವಾಗಲೆಲ್ಲ’ ಸಹಜವಾಗಿ ಹಿಡಿದಿಡುತ್ತದೆ; δέಯ ಸಂಪರ್ಕಭಾವವನ್ನು ಕನ್ನಡದ ವಾಕ್ಯಪ್ರವಾಹದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಪದವಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: ಮುಖವನ್ನು ಕಳೆಗುಂದಿಸಿಕೊಳ್ಳಬೇಡಿ
  rationale: γίνεσθεಯ ಸ್ಥಿತಿಯನ್ನು ತಾಳಿಕೊಳ್ಳುವ ಭಾವವನ್ನೂ σκυθρωποίಯ ದುಃಖಭರಿತ ಮುಖಭಾವವನ್ನೂ ಸೇರಿಸಿ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὡς οἱ ὑποκριταὶ
  choice: ಕಪಟಿಗಳಂತೆ
  rationale: ὑποκριταί ಇಲ್ಲಿ ಜನರ ಮುಂದೆ ಭಕ್ತಿಯನ್ನು ಪ್ರದರ್ಶಿಸುವವರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕಪಟಿಗಳು’ ಸ್ಪಷ್ಟವೂ ರೂಢಿಯಲ್ಲಿರುವ ಪದವೂ ಆಗಿದೆ.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: ಅವರು ತಮ್ಮ ಮುಖಗಳನ್ನು ವಿಕಾರಗೊಳಿಸುತ್ತಾರೆ
  rationale: ἀφανίζωಯ ಮುಖದ ಸಹಜ ರೂಪವನ್ನು ಕೆಡಿಸುವ ಅಥವಾ ಬದಲಿಸುವ ಸಂದರ್ಭಾರ್ಥವನ್ನು ‘ವಿಕಾರಗೊಳಿಸುತ್ತಾರೆ’ ಉಳಿಸುತ್ತದೆ; πρόσωπαಯ ಸ್ಪಷ್ಟ ‘ಮುಖಗಳು’ ಎಂಬ ಚಿತ್ರಣವನ್ನೂ ಕಾಯುತ್ತದೆ.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: ತಾವು ಉಪವಾಸ ಮಾಡುತ್ತಿದ್ದೇವೆಂದು ಜನರಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳುವುದಕ್ಕಾಗಿ
  rationale: ὅπωςಯ ಉದ್ದೇಶಾರ್ಥ, φανῶσινನ ‘ಕಾಣಿಸಿಕೊಳ್ಳು’ ಭಾವ ಮತ್ತು ἄνθρωποιಯ ಸಾಮಾನ್ಯ ಮಾನವಸಮೂಹದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ
  rationale: ಯೇಸುವಿನ ಗಂಭೀರ, ಅಧಿಕಾರಪೂರ್ಣ ಘೋಷಣಾಸೂತ್ರವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ತಿಯಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ
  rationale: ἀπέχωಯ ವಾಣಿಜ್ಯರೂಢಿಯ ‘ಪೂರ್ಣ ಪಾವತಿ ಪಡೆದಿದ್ದಾರೆ; ಇನ್ನೇನೂ ಬಾಕಿಯಿಲ್ಲ’ ಎಂಬ ಅರ್ಥವನ್ನು ‘ಪೂರ್ತಿಯಾಗಿ’ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; μισθόςಗೆ ಸಂದರ್ಭಾನುಸಾರ ‘ಪ್ರತಿಫಲ’ ಸೂಕ್ತ.
theological_decisions:
- issue: τοῖς ἀνθρώποις ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ಜನರಿಗೆ
  alternative: ಮನುಷ್ಯರಿಗೆ
  rationale: ἄνθρωποι ಇಲ್ಲಿ ಪುರುಷರನ್ನು ಮಾತ್ರವಲ್ಲದೆ ಜನರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ‘ಜನರಿಗೆ’ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನಿಖರವಾಗಿ ನೀಡುತ್ತದೆ.
- issue: ἀπέχουσιν τὸν μισθὸν αὐτῶν ಎಂಬ ರೂಢಿಪ್ರಯೋಗ
  choice: ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ತಿಯಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ
  alternative: ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಹೊಂದಿದ್ದಾರೆ
  rationale: ಮೂಲವು ಕೇವಲ ಪ್ರತಿಫಲದ ಒಡೆತನವನ್ನಲ್ಲ, ಸಂಪೂರ್ಣವಾಗಿ ಸ್ವೀಕರಿಸಿ ಇನ್ನೊಂದು ಹಕ್ಕು ಉಳಿಯದಿರುವ ಭಾವವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; ‘ಪೂರ್ತಿಯಾಗಿ’ ಆ ಎಚ್ಚರಿಕೆಯ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: ಉಪವಾಸದ ಕುರಿತು ಆಜ್ಞೆಯ ಸ್ವರೂಪ
  choice: ಉಪವಾಸವನ್ನೇ ನಿಷೇಧಿಸದೆ, ಪ್ರದರ್ಶನಾತ್ಮಕ ಮುಖಭಾವವನ್ನು ನಿಷೇಧಿಸುವಂತೆ ಅನುವಾದಿಸಲಾಗಿದೆ
  alternative: ಉಪವಾಸ ಮಾಡಬೇಡಿ ಎಂಬ ಸಾಮಾನ್ಯ ನಿಷೇಧದಂತೆ ಓದುವುದು
  rationale: ಮೂಲದ ὅταν νηστεύητε ಉಪವಾಸ ನಡೆಯುವ ಸಂದರ್ಭವನ್ನು ಊಹಿಸುತ್ತದೆ; μὴ γίνεσθε ಎಂಬ ನಿಷೇಧವು ಕಪಟಿಗಳಂತಾಗುವುದರ ಮೇಲೆ ಬೀಳುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಮೂಲದ ಪುನರಾವರ್ತಿತ ಕಾಲಭಾವ, ಉದ್ದೇಶವಾಕ್ಯ ಮತ್ತು ಪೂರ್ಣ ಪ್ರತಿಫಲ ಪಡೆದಿರುವ ರೂಢಿಪ್ರಯೋಗವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
