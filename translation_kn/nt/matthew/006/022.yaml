id: MAT.6.22
reference: Matthew 6:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: kn
  text: ಕಣ್ಣು ದೇಹದ ದೀಪವಾಗಿದೆ. ಆದ್ದರಿಂದ, ನಿನ್ನ ಕಣ್ಣು ಆರೋಗ್ಯವಾಗಿದ್ದರೆ[a], ನಿನ್ನ ಇಡೀ ದೇಹವು ಬೆಳಕಿನಿಂದ ತುಂಬಿರುತ್ತದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಏಕವಾಗಿದ್ದರೆ,’ ‘ನಿರ್ಮಲವಾಗಿದ್ದರೆ,’ ಅಥವಾ ‘ಸಮರ್ಪಕವಾಗಿದ್ದರೆ’; ಗ್ರೀಕ್ ಪದವು ಅವಿಭಕ್ತ ಅಥವಾ ಏಕನಿಷ್ಠ ಅರ್ಥವನ್ನೂ, ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ ಉದಾರತೆಯ ಅರ್ಥವನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: ದೀಪ
  rationale: ಈ ಪದವು ಅಮೂರ್ತವಾದ ‘ಬೆಳಕು’ಗಿಂತ ಸಾಮಾನ್ಯವಾಗಿ ದೀಪವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಹೀಗೆ ಕಣ್ಣು ದೇಹಕ್ಕೆ ಬೆಳಕು ನೀಡುವ ದೀಪ ಎಂಬ ಸ್ಪಷ್ಟ ರೂಪಕ ಉಳಿಯುತ್ತದೆ.
- source_word: σῶμα
  choice: ದೇಹ
  rationale: ಮೂಲದ ದೈಹಿಕ ಚಿತ್ರಣವನ್ನು ಸಹಜವಾಗಿ ಮತ್ತು ನೇರವಾಗಿ ಉಳಿಸುವ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಪದ.
- source_word: ὀφθαλμός
  choice: ಕಣ್ಣು
  rationale: ಭೌತಿಕ ಕಣ್ಣನ್ನೂ ಅದರ ರೂಪಕಾರ್ಥವನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐὰν οὖν
  choice: ಆದ್ದರಿಂದ, ... ಇದ್ದರೆ
  rationale: οὖν ಹಿಂದಿನ ಹೇಳಿಕೆಯಿಂದ ಬರುವ ತೀರ್ಮಾನಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆದ್ದರಿಂದ’ ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಷರತ್ತನ್ನು ‘ಇದ್ದರೆ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἁπλοῦς
  choice: ಆರೋಗ್ಯವಾಗಿದ್ದರೆ
  rationale: ಮುಂದಿನ ವಾಕ್ಯದಲ್ಲಿನ ಕೆಟ್ಟ ಕಣ್ಣಿನ ವಿರೋಧಾರ್ಥದೊಂದಿಗೆ, ಇಲ್ಲಿ ಸರಿಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುವ ಕಣ್ಣಿನ ಅರ್ಥವು ರೂಪಕಕ್ಕೆ ಅತ್ಯಂತ ಸಹಜವಾಗಿ ಹೊಂದುತ್ತದೆ. ಪದದ ‘ಏಕಾಗ್ರ/ವಿಭಜನೆಯಿಲ್ಲದ’, ‘ನಿರ್ಮಲ’ ಅಥವಾ ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ ‘ಉದಾರ’ ಎಂಬ ಅರ್ಥಛಾಯೆಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὅλον
  choice: ಇಡೀ
  rationale: ದೇಹದ ಸಂಪೂರ್ಣತೆಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: φωτεινὸν
  choice: ಬೆಳಕಿನಿಂದ ತುಂಬಿರುತ್ತದೆ
  rationale: ಮೂಲದ ‘ಬೆಳಕಾಗಿರುವ/ಪ್ರಕಾಶಮಾನ’ ಎಂಬ ಸ್ಥಿತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೇಳಿ, ದೇಹವನ್ನೆಲ್ಲ ಬೆಳಕು ವ್ಯಾಪಿಸುವ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἔσται
  choice: ತುಂಬಿರುತ್ತದೆ
  rationale: ಗ್ರೀಕ್ ಭವಿಷ್ಯಕಾಲದ ಫಲಿತಾಂಶವನ್ನು ಕನ್ನಡದ ಸಹಜ ಭವಿಷ್ಯಸೂಚಕ ರೂಪದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಕಣ್ಣಿನ ರೂಪಕದಲ್ಲಿ ἁπλοῦς ಪದದ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಆರೋಗ್ಯವಾಗಿದ್ದರೆ’
  alternative: ‘ಏಕಾಗ್ರವಾಗಿದ್ದರೆ’, ‘ನಿರ್ಮಲವಾಗಿದ್ದರೆ’, ‘ಸಮರ್ಪಕವಾಗಿದ್ದರೆ’ ಅಥವಾ ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ ‘ಉದಾರವಾಗಿದ್ದರೆ’
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭವು ಕಣ್ಣನ್ನು ದೇಹದ ದೀಪವೆಂದು ಹೇಳುತ್ತದೆ ಮತ್ತು ಮುಂದಿನ ವಚನವು ಅದನ್ನು ಕೆಟ್ಟ ಕಣ್ಣಿಗೆ ವಿರುದ್ಧವಾಗಿ ಇಡುತ್ತದೆ. ಆದ್ದರಿಂದ ಕಣ್ಣು ಸರಿಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುವ ಅರ್ಥವು ದೃಷ್ಟಿಯ ರೂಪಕವನ್ನು ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಆದರೂ ಮೂಲಪದದ ಏಕತೆ, ಅವಿಭಕ್ತತೆ ಅಥವಾ ಉದಾರತೆಯ ಸಾಧ್ಯ ಅರ್ಥಛಾಯೆಗಳನ್ನು ತಳ್ಳಿಹಾಕದೆ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ಏಕವಚನದ ನೇರ ಸಂಬೋಧನೆಯನ್ನು ಉಳಿಸಲು ‘ನಿನ್ನ’ ಬಳಸಲಾಗಿದೆ. ರೂಪಕವನ್ನು ವಿವರಿಸಿ ಕರಗಿಸದೆ ‘ಕಣ್ಣು—ದೀಪ—ಬೆಳಕು’ ಎಂಬ ಮೂಲ ಚಿತ್ರಕ್ರಮವನ್ನು ಕಾಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ.
