    rationale: It can mean ‘do not subject [us] to,’ whereas εἰσφέρω here directly asks not to bring or lead the petitioners into πειρασμός. ‘ಕೊಂಡೊಯ್ಯಬೇಡ’ preserves the source image and is natural Kannada.
  - severity: low
    issue: Footnote b refers to ‘ಗ್ರೀಕ್ ಪದ,’ though the ambiguity belongs to a phrase.
    rationale: The source expression τοῦ πονηροῦ contains the article and the substantivized adjective. ‘ಗ್ರೀಕ್ ಪದಗುಚ್ಛ’ is more accurate.
