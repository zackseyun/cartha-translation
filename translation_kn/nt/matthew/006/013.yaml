id: MAT.6.13
reference: Matthew 6:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: kn
  text: ನಮ್ಮನ್ನು ಪ್ರಲೋಭನೆಗೆ[a] ಕೊಂಡೊಯ್ಯಬೇಡ; ಆದರೆ ಕೆಡುಕನಿಂದ[b] ನಮ್ಮನ್ನು ಬಿಡಿಸು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಪರೀಕ್ಷೆಗೆ’ ಅಥವಾ ‘ಶೋಧನೆಗೆ.’ ಗ್ರೀಕ್ ಪದವು ಪಾಪಕ್ಕೆ ಸೆಳೆಯುವ ಪ್ರಲೋಭನೆಯನ್ನಾಗಲಿ, ಪರೀಕ್ಷಿಸುವ ಕಠಿಣ ಸಂದರ್ಭವನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ಕೆಡುಕಿನಿಂದ.’ ಗ್ರೀಕ್ ಪದಗುಚ್ಛವನ್ನು ವೈಯಕ್ತಿಕವಾಗಿ (‘ಕೆಡುಕನು’) ಅಥವಾ ಅವೈಯಕ್ತಿಕವಾಗಿ (‘ಕೆಡುಕು’) ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: ಒಳಪಡಿಸಬೇಡ
  rationale: εἰσφέρω ಪದದ ‘ಒಳಗೆ ತರು/ಕೊಂಡೊಯ್ಯು’ ಎಂಬ ನೇರ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಪ್ರಾರ್ಥನಾ ವಿನಂತಿಯಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಸಿಕ್ಕಿಬೀಳಲು ಬಿಡಬೇಡ’ ಎಂಬ ಹೆಚ್ಚು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: πειρασμόν
  choice: ಪ್ರಲೋಭನೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪಾಪಕ್ಕೆ ಸೆಳೆಯುವ ಪ್ರಲೋಭನೆಯ ಅರ್ಥ ಸಹಜವಾಗಿದೆ. ಆದರೂ ಗ್ರೀಕ್ ಪದಕ್ಕೆ ಪರೀಕ್ಷೆ ಅಥವಾ ಕಠಿಣ ಶೋಧನೆಯ ಅರ್ಥವೂ ಇರುವುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ῥῦσαι
  choice: ಬಿಡಿಸು
  rationale: ῥύομαι ಸೂಚಿಸುವ ಸಕ್ರಿಯ ರಕ್ಷಣೆ ಅಥವಾ ಪಾರುಮಾಡುವಿಕೆಯನ್ನು ಸರಳ, ಘನವಾದ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τοῦ πονηροῦ
  choice: ಕೆಡುಕನಿಂದ
  rationale: ಲೇಖಸಹಿತ ಗ್ರೀಕ್ ರೂಪವು ಪುಲ್ಲಿಂಗವಾಗಿ ‘ಕೆಡುಕನು’ ಎಂಬ ವೈಯಕ್ತಿಕ ಅರ್ಥವನ್ನೂ ನಪುಂಸಕಲಿಂಗವಾಗಿ ‘ಕೆಡುಕು’ ಎಂಬ ಅವೈಯಕ್ತಿಕ ಅರ್ಥವನ್ನೂ ಕೊಡಬಲ್ಲದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ವೈಯಕ್ತಿಕ ಅರ್ಥವನ್ನು ಆಯ್ದು, ನಿಜವಾದ ದ್ವಂದ್ವಾರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: τοῦ πονηροῦ ಎಂಬ ಪದಗುಚ್ಛದ ಅರ್ಥ
  choice: ಕೆಡುಕನಿಂದ
  alternative: ಕೆಡುಕಿನಿಂದ
  rationale: ಗ್ರೀಕ್ ರೂಪವು ‘ಕೆಡುಕನು’ ಮತ್ತು ‘ಕೆಡುಕು’ ಎರಡಕ್ಕೂ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಅವಕಾಶ ಕೊಡುತ್ತದೆ. ಪ್ರಲೋಭನೆಯೊಂದಿಗಿನ ಸಂಬಂಧದಲ್ಲಿ ವೈಯಕ್ತಿಕ ವಿರೋಧಿಯ ಅರ್ಥ ಬಲವಾಗಿರುವುದರಿಂದ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇಡಲಾಗಿದೆ; ಆದರೆ ಅವೈಯಕ್ತಿಕ ಅರ್ಥವನ್ನೂ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾಗಿಯೂ ಘನವಾಗಿಯೂ ಇರುವ ಪ್ರಾರ್ಥನಾ ಶೈಲಿ. ‘ಒಳಪಡಿಸಬೇಡ’ ಮೂಲದ ನೇರ ವಿನಂತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಬಿಡಿಸು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದ್ದು ಸಕ್ರಿಯ ದೈವಿಕ ರಕ್ಷಣೆಯನ್ನು ತಿಳಿಸುತ್ತದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಪದಗಳ ತಕ್ಷಣವೇ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇವೆ.
