id: MAT.6.5
reference: Matthew 6:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: kn
  text: 'ನೀವು ಪ್ರಾರ್ಥಿಸುವಾಗಲೆಲ್ಲಾ, ಕಪಟಿಗಳಂತೆ ಇರಬೇಡಿ. ಏಕೆಂದರೆ ಜನರು ತಮ್ಮನ್ನು ನೋಡಬೇಕೆಂದು ಅವರು ಸಭಾಮಂದಿರಗಳಲ್ಲಿಯೂ ಅಗಲವಾದ ಬೀದಿಗಳ ಮೂಲೆಗಳಲ್ಲಿಯೂ[a] ನಿಂತು ಪ್ರಾರ್ಥಿಸಲು ಇಷ್ಟಪಡುತ್ತಾರೆ. ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪಡೆದಿದ್ದಾರೆ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಕ್ಷರಶಃ: “ಅಗಲವಾದ ಬೀದಿಗಳ ಮೂಲೆಗಳಲ್ಲಿ.” ಸಹಜವಾಗಿ ಇದನ್ನು “ಬೀದಿಮೂಲೆಗಳಲ್ಲಿ” ಎಂದೂ ಹೇಳಬಹುದು.'
    reason: lexical_alternative
  - marker: b
    text: “ಪಡೆದಿದ್ದಾರೆ” ಎಂಬ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಹಣವನ್ನು ಪೂರ್ಣವಾಗಿ ಪಡೆದು ರಸೀದಿ ಕೊಡುವ ವಾಣಿಜ್ಯಪ್ರಯೋಗದಲ್ಲಿಯೂ ಬರುತ್ತದೆ; ಆದ್ದರಿಂದ “ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ಣವಾಗಿ ಪಡೆದಿದ್ದಾರೆ” ಎಂಬ ಅರ್ಥವೂ ಸಾಧ್ಯ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: ನೀವು ಪ್ರಾರ್ಥಿಸುವಾಗಲೆಲ್ಲಾ
  rationale: ὅταν ಎಂಬುದರ ಅನಿರ್ದಿಷ್ಟ, ಪುನರಾವರ್ತಿತ ಕಾಲಾರ್ಥವನ್ನು ‘ಆಗಲೆಲ್ಲಾ’ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: οὐκ ἔσεσθε ὡς οἱ ὑποκριταί
  choice: ಕಪಟಿಗಳಂತೆ ಇರಬೇಡಿ
  rationale: ಭವಿಷ್ಯತ್ ಸೂಚಕದಲ್ಲಿರುವ ನಿಷೇಧಾತ್ಮಕ ಬೋಧನೆಯನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಆಜ್ಞಾರ್ಥವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: ಸಭಾಮಂದಿರಗಳಲ್ಲಿ
  rationale: ಯೆಹೂದ್ಯರ ಆರಾಧನಾ-ಸಭಾಸ್ಥಳವಾದ συναγωγή ಎಂಬ ಐತಿಹಾಸಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: ಅಗಲವಾದ ಬೀದಿಗಳ ಮೂಲೆಗಳಲ್ಲಿ
  rationale: πλατεῖα ಎಂಬುದರ ಅಗಲವಾದ ಸಾರ್ವಜನಿಕ ಬೀದಿ ಎಂಬ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: ನಿಂತು ಪ್ರಾರ್ಥಿಸಲು
  rationale: ನಿಲ್ಲುವ ಸ್ಥಿತಿಯಲ್ಲಿ ಪ್ರಾರ್ಥಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ಜನರು ತಮ್ಮನ್ನು ನೋಡಬೇಕೆಂದು
  rationale: ಉದ್ದೇಶಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ἀνθρώποις ಇಲ್ಲಿ ಸ್ತ್ರೀಪುರುಷರೆಲ್ಲರನ್ನೂ ಒಳಗೊಂಡ ಸಾಮಾನ್ಯ ‘ಜನರು’ ಎಂದರ್ಥ.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ
  rationale: ಯೇಸುವಿನ ಗಂಭೀರ ದೃಢೋಕ್ತಿ ಸೂತ್ರವನ್ನು ಗೌರವಪೂರ್ಣ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪಡೆದಿದ್ದಾರೆ
  rationale: ἀπέχουσι ಎಂಬ ವಾಣಿಜ್ಯಪ್ರಯೋಗವು ಪ್ರತಿಫಲವನ್ನು ಪಡೆದುಕೊಂಡಿರುವ ಅರ್ಥ ನೀಡುತ್ತದೆ; ‘ಸಂಪೂರ್ಣವಾಗಿ’ ಎಂಬ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಲವಂತವಾಗಿ ಸೇರಿಸದೆ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಜನರ ಮುಂದೆ ಕಾಣಿಸಿಕೊಳ್ಳುವ ಉದ್ದೇಶ
  choice: ಜನರು ತಮ್ಮನ್ನು ನೋಡಬೇಕೆಂದು
  alternative: ಮನುಷ್ಯರು ತಮ್ಮನ್ನು ನೋಡಬೇಕೆಂದು
  rationale: ἀνθρώποις ಲಿಂಗನಿರ್ದಿಷ್ಟವಲ್ಲದೆ ಮಾನವ ವೀಕ್ಷಕರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- issue: ἀπέχουσι ಎಂಬುದರ ಪ್ರತಿಫಲಾರ್ಥ
  choice: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪಡೆದಿದ್ದಾರೆ
  alternative: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಪಡೆದಿದ್ದಾರೆ
  rationale: ಕ್ರಿಯಾಪದದ ವಾಣಿಜ್ಯಸಂದರ್ಭದಲ್ಲಿ ‘ಪೂರ್ಣವಾಗಿ ಪಡೆದುಕೊಳ್ಳುವುದು’ ಎಂಬ ಛಾಯೆ ಇರಬಹುದು; ಆದರೆ ಅದು ಇಲ್ಲಿ ಎಷ್ಟು ಸ್ಪಷ್ಟವೆಂಬ ಅನಿಶ್ಚಿತತೆಯನ್ನು ಪಠ್ಯದಲ್ಲಿ ಪರಿಹರಿಸದೆ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಪೂರ್ಣ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ಕಪಟಿಗಳು’, ‘ಸಭಾಮಂದಿರ’, ‘ಪ್ರತಿಫಲ’ ಎಂಬ ಪದಗಳು ಸಂದರ್ಭದ ಧಾರ್ಮಿಕ ಮತ್ತು ಐತಿಹಾಸಿಕ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತವೆ; ವಾಕ್ಯರಚನೆ ಮಾತಿನ ಸಹಜತೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
