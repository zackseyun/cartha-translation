id: MAT.6.30
reference: Matthew 6:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: kn
  text: ಆದರೆ ಇಂದು ಇರುವ ಮತ್ತು ನಾಳೆ ಒಲೆಗೆ[b] ಎಸೆಯಲ್ಪಡುವ ಹೊಲದ ಹುಲ್ಲನ್ನು ದೇವರು ಹೀಗೆ ಹೊದಿಸುವುದಾದರೆ, ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ[a], ನಿಮಗೆ ಅದಕ್ಕಿಂತಲೂ ಎಷ್ಟೋ ಹೆಚ್ಚಾಗಿ ಹೊದಿಸುವುದಿಲ್ಲವೇ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ’ ಎಂಬುದು ನೇರ ಸಂಬೋಧನೆ; ಇದನ್ನು ‘ಸ್ವಲ್ಪ ನಂಬಿಕೆಯುಳ್ಳವರೇ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಪದವು ಅಪರ್ಯಾಪ್ತವಾದ ಭರವಸೆಯನ್ನು ಗದರಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಇಲ್ಲಿನ ‘ಒಲೆ’ ರೊಟ್ಟಿ ಬೇಯಿಸುವ ಒಲೆ. ಒಣಗಿದ ಹುಲ್ಲನ್ನೂ ಹೊಲದ ಸಸ್ಯಗಳನ್ನೂ ಅದಕ್ಕೆ ಇಂಧನವಾಗಿ ಬಳಸಬಹುದಾಗಿತ್ತು.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: ಹೊಲದ ಹುಲ್ಲು
  rationale: χόρτος ಹುಲ್ಲು ಅಥವಾ ಹೊಲದ ಸಸ್ಯಸಮೂಹವನ್ನು ಸೂಚಿಸಬಹುದು; ಸಂದರ್ಭದ ಅಲ್ಪಾಯುಷಿ ಬೆಳವಣಿಗೆಯ ಚಿತ್ರಣವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ‘ಹೊಲದ ಹುಲ್ಲು’ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: σήμερον ὄντα
  choice: ಇಂದು ಇದ್ದು
  rationale: ὄντα ಎಂಬ ‘ಇರು’ ಅರ್ಥದ ಕೃದಂತವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ಅದರ ತಾತ್ಕಾಲಿಕ ಅಸ್ತಿತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: ನಾಳೆ ಒಲೆಗೆ ಎಸೆಯಲ್ಪಡುವುದಾದರೂ
  rationale: κλίβανος ರೊಟ್ಟಿ ಬೇಯಿಸುವ ಒಲೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; βαλλόμενον ಎಂಬ ವರ್ತಮಾನ ನಿಷ್ಕ್ರಿಯ ಕೃದಂತವನ್ನು ಕನ್ನಡದ ಷರತ್ತಿನ ರಚನೆಗೆ ಹೊಂದಿಸಲಾಗಿದೆ.
- source_word: οὕτως ἀμφιέννυσιν
  choice: ಹೀಗೆ ಉಡಿಸಿದರೆ
  rationale: ἀμφιέννυμι ಎಂದರೆ ಉಡಿಸು ಅಥವಾ ತೊಡಿಸು. ಹೂವುಗಳಿಂದ ಅಲಂಕರಿಸುವ ಅರ್ಥವನ್ನು ಅನಾವಶ್ಯಕವಾಗಿ ಸೇರಿಸದೆ ಉಡುಪಿನ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: οὐ πολλῷ μᾶλλον
  choice: ಇನ್ನೂ ಎಷ್ಟೋ ಹೆಚ್ಚಾಗಿ ... ಉಡಿಸುವುದಿಲ್ಲವೇ?
  rationale: ಕಡಿಮೆಯಿಂದ ಹೆಚ್ಚಿನದಕ್ಕೆ ಸಾಗುವ ವಾದವನ್ನೂ ಬಲವಾದ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὑμᾶς
  choice: ನಿಮಗೆ
  rationale: ಪುನರುಕ್ತವಾಗಿ ಅರ್ಥಗೊಳ್ಳುವ ‘ಉಡಿಸು’ ಕ್ರಿಯೆಯ ಸ್ವೀಕರ್ತೃವಾಗಿ ಬಹುವಚನದ ನೇರ ಸಂಬೋಧನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ನಿಮಗೆ’ ಎಂದು ಸಹಜವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ.
- source_word: ὀλιγόπιστοι
  choice: ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ
  rationale: ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ಸಂಬೋಧನೆಯಾದ ὀλιγόπιστοιಯ ನೇರ ಗದರಿಕೆಯನ್ನೂ ಅಪರ್ಯಾಪ್ತ ನಂಬಿಕೆಯ ಅರ್ಥವನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰ δὲ
  choice: ಆದರೆ ... -ದಾದರೂ
  rationale: δέಯ ಸೌಮ್ಯವಾದ ತಿರುವನ್ನೂ εἰಯ ಷರತ್ತನ್ನೂ ಕನ್ನಡದ ಸಹಜ ರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದೈವಿಕ ಪೋಷಣೆಯ ಕಡಿಮೆಯಿಂದ ಹೆಚ್ಚಿನದಕ್ಕೆ ಸಾಗುವ ವಾದ
  choice: ಕ್ಷಣಿಕವಾದ ಹುಲ್ಲಿಗಿಂತ ಶಿಷ್ಯರಿಗೆ ದೇವರು ಇನ್ನೂ ಹೆಚ್ಚಾಗಿ ಉಡಿಸುವನೆಂಬುದನ್ನು ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ನೇರ ಹೇಳಿಕೆಯಾಗಿ ನಿರೂಪಿಸುವುದು.
  rationale: οὐ πολλῷ μᾶλλον ಎಂಬ ಗ್ರೀಕ್ ರಚನೆಯೂ ಕೊನೆಯ ನೇರ ಸಂಬೋಧನೆಯೂ ಪ್ರಶ್ನೆಯ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಬೆಂಬಲಿಸುತ್ತವೆ; ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಸೇರಿಸಿಲ್ಲ.
- issue: ὀλιγόπιστοιಯ ಗದರಿಕೆಯ ಸ್ವರೂಪ
  choice: ‘ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ’ ಎಂಬ ನೇರ ಸಂಬೋಧನೆ.
  alternative: ‘ಸ್ವಲ್ಪ ನಂಬಿಕೆಯುಳ್ಳವರೇ’ ಅಥವಾ ‘ನಂಬಿಕೆಯಿಲ್ಲದವರೇ’.
  rationale: ಮೂಲವು ನಂಬಿಕೆಯ ಸಂಪೂರ್ಣ ಅಭಾವವನ್ನು ಹೇಳದೆ, ಅಪರ್ಯಾಪ್ತ ನಂಬಿಕೆಯನ್ನು ಗದರಿಸುತ್ತದೆ; ಆದ್ದರಿಂದ ಆ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನವಾದ ಬೋಧನಾ ಶೈಲಿ. ‘ಉಡಿಸು’ ಎಂಬ ರೂಪಕವನ್ನು ಎರಡೂ ಭಾಗಗಳಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ವಾಕ್ಯದ ಅಂತ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ; [a] ‘ಅಲ್ಪವಿಶ್ವಾಸಿಗಳೇ’ಗೆ ಮತ್ತು [b] ‘ಒಲೆ’ಗೆ ಸಂಬಂಧಿಸುತ್ತದೆ.
