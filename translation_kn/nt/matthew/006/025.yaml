revisions:
- from: 'ಆದ್ದರಿಂದ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ: ನಿಮ್ಮ ಜೀವದ ಬಗ್ಗೆ—ಏನು ತಿನ್ನಬೇಕು ಎಂದಾಗಲಿ, ನಿಮ್ಮ ದೇಹದ ಬಗ್ಗೆ—ಏನು ಧರಿಸಬೇಕು ಎಂದಾಗಲಿ ಚಿಂತಿಸಬೇಡಿ. ಆಹಾರಕ್ಕಿಂತ ಜೀವವೂ ಉಡುಪಿಗಿಂತ ದೇಹವೂ ಹೆಚ್ಚಿನವುಗಳಲ್ಲವೇ?[a]'
