id: MAT.6.25
reference: Matthew 6:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: kn
  text: 'ಆದ್ದರಿಂದ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ: ನಿಮ್ಮ ಜೀವದ ವಿಷಯವಾಗಿ—ಏನು ತಿನ್ನುವೆವೋ ಎಂದು—ಚಿಂತಿಸಬೇಡಿ; ನಿಮ್ಮ ದೇಹದ ವಿಷಯವಾಗಿ—ಏನು ಧರಿಸುವೆವೋ ಎಂದು—ಚಿಂತಿಸಬೇಡಿ. ಜೀವವು ಆಹಾರಕ್ಕಿಂತಲೂ, ದೇಹವು ಉಡುಪಿಗಿಂತಲೂ ಹೆಚ್ಚಿನದಲ್ಲವೇ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಜೀವ” ಎಂಬುದಕ್ಕೆ ಮೂಲ ಗ್ರೀಕ್ ಪದ ψυχή; ಇದನ್ನು “ಆತ್ಮ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಆದರೆ ಇಲ್ಲಿ ತಿನ್ನುವುದು ಮತ್ತು ಉಡುಪಿನ ಸಂದರ್ಭವು “ಜೀವ” ಎಂಬ ಅರ್ಥಕ್ಕೆ ಹೆಚ್ಚು ಹೊಂದುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಬೋಧನೆಯಿಂದ ಬರುವ ತಾರ್ಕಿಕ ನಿರ್ಣಯವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: μεριμνᾶτε
  choice: ಚಿಂತಿಸಬೇಡಿ
  rationale: ಆತಂಕದಿಂದ ಕಳವಳಪಡುವುದು ಅಥವಾ ಅಗತ್ಯಗಳಲ್ಲೇ ಮನಸ್ಸನ್ನು ಮುಳುಗಿಸುವುದನ್ನು ಸೂಚಿಸುವ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾದ ಪದಪ್ರಯೋಗ.
- source_word: ψυχῇ / ψυχὴ
  choice: ಜೀವ / ಜೀವದ
  rationale: ತಿನ್ನುವುದು ಮತ್ತು ಆಹಾರದ ಸಂದರ್ಭದಲ್ಲಿದು ಅಮೂರ್ತವಾದ ಆತ್ಮವನ್ನು ಮಾತ್ರವಲ್ಲ, ವ್ಯಕ್ತಿಯ ಜೀವ ಅಥವಾ ಬದುಕನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τί φάγητε
  choice: ಏನು ತಿನ್ನಬೇಕು
  rationale: ಭವಿಷ್ಯದ ಅಗತ್ಯದ ಕುರಿತು ಇರುವ ಚಿಂತೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: σώματι / σῶμα
  choice: ದೇಹ / ದೇಹದ
  rationale: ಉಡುಪಿಗೆ ಸಂಬಂಧಿಸಿದ ಭೌತಿಕ ದೇಹವನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τί ἐνδύσησθε
  choice: ಏನು ಧರಿಸಬೇಕು
  rationale: ಬಟ್ಟೆ ತೊಡುವುದನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಗೌರವಯುತ ಆಧುನಿಕ ಕನ್ನಡ.
- source_word: οὐχὶ
  choice: ಅಲ್ಲವೇ?
  rationale: ಹೌದೆಂಬ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಗ್ರೀಕ್ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πλεῖόν
  choice: ಹೆಚ್ಚಿನವು
  rationale: ಜೀವ ಮತ್ತು ದೇಹವು ಕ್ರಮವಾಗಿ ಆಹಾರ ಮತ್ತು ಉಡುಪಿಗಿಂತ ಹೆಚ್ಚಿನ ಮಹತ್ವವುಳ್ಳವು ಎಂಬ ಹೋಲಿಕೆಯನ್ನು ಅತಿಯಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: τροφῆς
  choice: ಆಹಾರ
  rationale: ಜೀವವನ್ನು ಪೋಷಿಸುವ ಆಹಾರಕ್ಕೆ ಸ್ಪಷ್ಟವಾದ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಪದ.
- source_word: ἐνδύματος
  choice: ಉಡುಪು
  rationale: ಒಂದು ನಿರ್ದಿಷ್ಟ ವಸ್ತ್ರಕ್ಕಿಂತ ಸಾಮಾನ್ಯವಾಗಿ ಧರಿಸುವ ಬಟ್ಟೆಯನ್ನು ಸೂಚಿಸುವ ಪದ.
theological_decisions:
- issue: ψυχή ಪದದ ಅರ್ಥ
  choice: ಜೀವ
  alternative: ಆತ್ಮ
  rationale: ಆಹಾರ, ತಿನ್ನುವುದು ಮತ್ತು ದೇಹದ ಅಗತ್ಯಗಳೇ ತಕ್ಷಣದ ಸಂದರ್ಭವಾಗಿರುವುದರಿಂದ ಇಲ್ಲಿ ψυχή ವ್ಯಕ್ತಿಯ ಜೀವ ಅಥವಾ ಬದುಕನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆದರೂ ಮೂಲಪದಕ್ಕಿರುವ ‘ಆತ್ಮ’ ಎಂಬ ಸಾಧ್ಯತೆಯನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಗೌರವಯುತ ಹಾಗೂ ಸಹಜ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ತಾರ್ಕಿಕ ಸಂಪರ್ಕ, ಸಮಾಂತರ ವಿನ್ಯಾಸ ಮತ್ತು ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
