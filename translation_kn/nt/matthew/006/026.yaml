id: MAT.6.26
reference: Matthew 6:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: kn
  text: 'ಆಕಾಶದ ಪಕ್ಷಿಗಳನ್ನು ಗಮನಿಸಿ: ಅವು ಬಿತ್ತುವುದಿಲ್ಲ, ಕೊಯ್ಯುವುದಿಲ್ಲ, ಕಣಜಗಳಲ್ಲಿ ಕೂಡಿಡುವುದಿಲ್ಲ; ಮತ್ತು ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆ ಅವುಗಳಿಗೆ ಆಹಾರ ಒದಗಿಸುತ್ತಾನೆ. ನೀವು ಅವುಗಳಿಗಿಂತ ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರಲ್ಲವೇ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನೀವು ಅವುಗಳಿಗಿಂತ ಹೆಚ್ಚು ಮುಖ್ಯರಲ್ಲವೇ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: ಗಮನಿಸಿ
  rationale: ನಿರ್ದಿಷ್ಟವಾಗಿ ದೃಷ್ಟಿ ಹರಿಸಿ ಪರಿಗಣಿಸಬೇಕೆಂಬ ಆಜ್ಞಾರ್ಥಕ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ಆಕಾಶದ ಪಕ್ಷಿಗಳು
  rationale: πετεινά ಅನ್ನು ‘ಪಕ್ಷಿಗಳು’ ಎಂದೂ, ಕಾಣುವ ಆಕಾಶವನ್ನು ಸೂಚಿಸುವ τοῦ οὐρανοῦ ಅನ್ನು ‘ಆಕಾಶದ’ ಎಂದೂ ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν εἰς ἀποθήκας
  choice: ಬಿತ್ತುವುದಿಲ್ಲ, ಕೊಯ್ಯುವುದಿಲ್ಲ, ಕಣಜಗಳಲ್ಲಿ ಕೂಡಿಡುವುದಿಲ್ಲ
  rationale: ಮೂಲದ ಮೂರು ಕೃಷಿ ಕ್ರಿಯೆಗಳ ಸಮಾನಾಂತರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ἀποθήκαςಗೆ ಕೃಷಿ ಉತ್ಪನ್ನ ಸಂಗ್ರಹಿಸುವ ಸ್ಥಳ ಎಂಬ ಅರ್ಥದಲ್ಲಿ ‘ಕಣಜಗಳು’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆ
  rationale: ತಂದೆಯೊಂದಿಗಿನ ಸಂಬಂಧವನ್ನೂ οὐράνιοςನ ಪರಲೋಕೀಯ ಸೂಚನೆಯನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τρέφει
  choice: ಆಹಾರ ಕೊಡುತ್ತಾನೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪಕ್ಷಿಗಳಿಗೆ ಆಹಾರ ಒದಗಿಸುವುದನ್ನು ಸ್ಪಷ್ಟವಾದ ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ಹೇಳುತ್ತದೆ.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: ಅವುಗಳಿಗಿಂತ ನೀವು ಎಷ್ಟೋ ಹೆಚ್ಚು ಅಮೂಲ್ಯರಲ್ಲವೇ?
  rationale: ಸಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಪ್ರಶ್ನೆಯ ರೂಪವನ್ನೂ, ಪಕ್ಷಿಗಳಿಗಿಂತ ಮಾನವರಿಗೆ ಹೆಚ್ಚಿನ ಮೌಲ್ಯವಿದೆ ಎಂಬ ಹೋಲಿಕೆಯ ಬಲವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ವಾದದಲ್ಲಿ ಮಾನವರಿಗೂ ಪಕ್ಷಿಗಳಿಗೂ ಇರುವ ತುಲನಾತ್ಮಕ ಮೌಲ್ಯ
  choice: ಯೇಸುವಿನ ಶ್ರೋತರು ಪಕ್ಷಿಗಳಿಗಿಂತ ಎಷ್ಟೋ ಹೆಚ್ಚು ಅಮೂಲ್ಯರು ಎಂದು ಹೇಳಲಾಗಿದೆ; ಅದರ ಧಾರ್ಮಿಕ-ತಾತ್ತ್ವಿಕ ಆಧಾರವನ್ನು ವಚನವು ವಿವರಿಸುವುದಿಲ್ಲ.
  alternative: ದೇವರ ಸ್ವರೂಪದಲ್ಲಿ ಸೃಷ್ಟಿಸಲ್ಪಟ್ಟಿರುವುದರಿಂದ ಅಥವಾ ಒಡಂಬಡಿಕೆಯ ಸಂಬಂಧದಿಂದ ಮಾತ್ರ ಮಾನವರು ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರು ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು.
  rationale: ಮೂಲಪಾಠವು ಹೆಚ್ಚಿನ ಮೌಲ್ಯವನ್ನು ದೃಢಪಡಿಸುತ್ತದೆ, ಆದರೆ ಅದರ ಕಾರಣವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ಅನುವಾದವು ಹೊರಗಿನ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಕೃಷಿ ರೂಪಕದ ಸಮಾನಾಂತರತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಆದರೂ’ ಎಂಬ ಸಂಪರ್ಕಪದವು ಗ್ರೀಕ್ καίಯ ಸಂದರ್ಭೋಚಿತ ವಿರೋಧಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
