id: MAT.6.14
reference: Matthew 6:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: kn
  text: ಏಕೆಂದರೆ, ನೀವು ಜನರ ಅಪರಾಧಗಳನ್ನು[a] ಕ್ಷಮಿಸಿದರೆ, ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆಯೂ[b] ನಿಮ್ಮನ್ನು ಕ್ಷಮಿಸುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಉಲ್ಲಂಘನೆಗಳು,’ ‘ತಪ್ಪುಗಳು’ ಅಥವಾ ‘ತಪ್ಪುಕೃತ್ಯಗಳು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಪದವು ನೈತಿಕ ವೈಫಲ್ಯ ಅಥವಾ ತಪ್ಪು ಹೆಜ್ಜೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಪದಶಃ, ‘ನಿಮ್ಮ ತಂದೆ, ಪರಲೋಕದವರು’; ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ, ‘ಪರಲೋಕದಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ಏಕೆಂದರೆ, … ಕ್ಷಮಿಸಿದರೆ
  rationale: γάρ ಹಿಂದಿನ ಪ್ರಾರ್ಥನೆಯ ಮಾತಿಗೆ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ನೀಡುವುದರಿಂದ ‘ಏಕೆಂದರೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; ἐάν ಜೊತೆಗೆ ಬಂದಿರುವ aorist subjunctive ಅನ್ನು ಸಹಜವಾದ ಷರತ್ತಿನ ರೂಪವಾದ ‘-ದರೆ’ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἀφῆτε / ἀφήσει
  choice: ಕ್ಷಮಿಸಿದರೆ / ಕ್ಷಮಿಸುವರು
  rationale: ಈ ನೈತಿಕ ಮತ್ತು ಸಂಬಂಧಾತ್ಮಕ ಸಂದರ್ಭದಲ್ಲಿ ἀφίημι ಎಂದರೆ ‘ಕ್ಷಮಿಸು.’ ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಒಂದೇ ಕ್ರಿಯಾಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῖς ἀνθρώποις
  choice: ಜನರ
  rationale: ἄνθρωποι ಇಲ್ಲಿ ಪುರುಷರಿಗೆ ಮಾತ್ರವಲ್ಲ, ಸಾಮಾನ್ಯವಾಗಿ ಜನರಿಗೆ ಸೂಚಿಸುತ್ತದೆ. ‘ಜನರ’ ಎಂಬುದು ಸಹಜವೂ ಲಿಂಗನಿರಪೇಕ್ಷವೂ ಆಗಿದೆ.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: ಅವರ ಅಪರಾಧಗಳನ್ನು
  rationale: παράπτωμα ನೈತಿಕ ತಪ್ಪು ಹೆಜ್ಜೆ, ಉಲ್ಲಂಘನೆ ಅಥವಾ ತಪ್ಪನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅಪರಾಧಗಳು’ ಅದರ ನೈತಿಕ-ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ‘ಜನರ ಅಪರಾಧಗಳನ್ನು’ ಎಂದು ಸೇರಿಸಲಾಗಿದೆ.
- source_word: καὶ ὑμῖν
  choice: ತಂದೆಯೂ ನಿಮ್ಮನ್ನು
  rationale: καί ಸೂಚಿಸುವ ಪರಸ್ಪರ ಹೊಂದಾಣಿಕೆಯನ್ನು ‘-ಊ’ ಪ್ರತ್ಯಯದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ὑμῖν ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಕ್ಷಮಿಸು’ ಕ್ರಿಯೆಯ ಸಹಜ ಕರ್ಮರೂಪವಾದ ‘ನಿಮ್ಮನ್ನು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆ
  rationale: ಗ್ರೀಕ್‌ನ articular noun ಮತ್ತು attributive adjective ಅನ್ನು ಗೌರವಪೂರ್ಣ ಹಾಗೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: ಮಾನವರ ಕ್ಷಮೆ ಮತ್ತು ದೇವರ ಕ್ಷಮೆಯ ನಡುವಿನ ಷರತ್ತಿನ ಸಂಬಂಧ
  choice: ವಾಕ್ಯವನ್ನು ನಿಜವಾದ ಷರತ್ತಾಗಿ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಮಾನವರ ಕ್ಷಮೆಯು ದೇವರ ಕ್ಷಮೆಯನ್ನು ಸಂಪಾದಿಸುತ್ತದೆ ಎಂಬ ಬಲವಾದ ಕಾರಣಾತ್ಮಕ ವ್ಯಾಖ್ಯಾನ, ಅಥವಾ ಅದು ಈಗಾಗಲೇ ದೊರೆತ ದೇವರ ಕ್ಷಮೆಗೆ ಕೇವಲ ಸಾಕ್ಷಿ ಎಂಬ ವ್ಯಾಖ್ಯಾನ.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಸರಳವಾದ ಷರತ್ತಿನ ಹೇಳಿಕೆಯನ್ನು ನೀಡುತ್ತದೆ. ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತದ ಪರವಾಗಿ ಅದರ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಅನುವಾದದಲ್ಲೇ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಪೂರ್ಣ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ದೇವರನ್ನು ಸೂಚಿಸುವ ‘ತಂದೆ’ಗೆ ಗೌರವ ಸೂಚಿಸಲು ‘ಕ್ಷಮಿಸುವರು’ ಎಂಬ ಬಹುವಚನ ಗೌರವಕ್ರಿಯಾರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
