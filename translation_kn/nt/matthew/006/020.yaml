id: MAT.6.20
reference: Matthew 6:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: kn
  text: ಆದರೆ ಪರಲೋಕದಲ್ಲಿ ನಿಮಗಾಗಿ ನಿಧಿಗಳನ್ನು ಕೂಡಿಸಿಟ್ಟುಕೊಳ್ಳಿರಿ. ಅಲ್ಲಿ ನುಸಿಯಾಗಲಿ, ಕ್ಷಯವಾಗಲಿ[a] ಅವುಗಳನ್ನು ನಾಶಮಾಡುವುದಿಲ್ಲ; ಕಳ್ಳರು ಒಡೆದು ಒಳನುಗ್ಗುವುದೂ[b] ಇಲ್ಲ, ಕದಿಯುವುದೂ ಇಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ತುಕ್ಕು’ ಅಥವಾ ‘ಸವೆತ.’ ಗ್ರೀಕ್ ಪದವು ತಿನ್ನಿಹಾಕುವಿಕೆ, ತುಕ್ಕು ಹಿಡಿಯುವಿಕೆ ಅಥವಾ ಬೇರೆ ರೀತಿಯ ಕ್ರಮೇಣ ಹಾಳಾಗುವಿಕೆಯನ್ನು ವಿಶಾಲವಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಪದಶಃ ‘ಕೊರೆದು ಭೇದಿಸುವುದೂ ಇಲ್ಲ.’ ಆ ಕಾಲದಲ್ಲಿ ಕಳ್ಳರು ಮಣ್ಣಿನ ಇಟ್ಟಿಗೆಯ ಗೋಡೆಗಳನ್ನು ಕೊರೆದು ಮನೆಗೆ ನುಗ್ಗುವುದನ್ನು ಇದು ಸೂಚಿಸಿರಬಹುದು.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: ನಿಧಿಗಳನ್ನು ಕೂಡಿಸಿಟ್ಟುಕೊಳ್ಳಿರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಆಜ್ಞೆಯು ನಿರಂತರವಾಗಿ ಕೂಡಿಸಿಡುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕೂಡಿಸಿಟ್ಟುಕೊಳ್ಳಿರಿ’ ಎಂಬುದು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ನಿಧಿ ಸಂಗ್ರಹಿಸುವ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಭೂಲೋಕದಲ್ಲಿ ನಿಧಿ ಕೂಡಿಸಿಡಬಾರದೆಂಬ ಆಜ್ಞೆಗೆ ಇದು ಸ್ಪಷ್ಟವಾದ ವಿರೋಧಾರ್ಥಕ ಸಂಪರ್ಕವನ್ನು ಕೊಡುತ್ತದೆ.
- source_word: ὑμῖν
  choice: ನಿಮಗಾಗಿ
  rationale: ಲಾಭಾರ್ಥಕ ದತ್ತಿವಿಭಕ್ತಿಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ನಿಧಿ ಕೂಡಿಸುವುದು ಅವರದೇ ಹಿತಕ್ಕಾಗಿ ಎಂಬ ಭಾವ ಉಳಿಯುತ್ತದೆ.
- source_word: θησαυροὺς
  choice: ನಿಧಿಗಳನ್ನು
  rationale: ಮೂಲದ ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ‘treasures’ ಎಂಬ ರೂಪಕಕ್ಕೆ dignified ಮತ್ತು ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: ἐν οὐρανῷ
  choice: ಪರಲೋಕದಲ್ಲಿ
  rationale: ಸ್ಥಳಾರ್ಥವನ್ನು ಸಹಜವಾದ ಕನ್ನಡ ಬೈಬಲ್ ಭಾಷೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅತಿಯಾದ ತಾತ್ವಿಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: σὴς
  choice: ನುಸಿ
  rationale: ಸಂಗ್ರಹಿಸಿಟ್ಟ ಬಟ್ಟೆಬರೆಗಳನ್ನು ಹಾಳುಮಾಡುವ moth ಅನ್ನು ಸೂಚಿಸುವ ನಿಖರ ಮತ್ತು ಪರಿಚಿತ ಕನ್ನಡ ಪದ.
- source_word: βρῶσις
  choice: ಕ್ಷಯ
  rationale: ಈ ಪದವು ತಿನ್ನಿಹಾಕುವಿಕೆ ಅಥವಾ ವಸ್ತುವನ್ನು ಕ್ರಮೇಣ ನಾಶಮಾಡುವ ಪ್ರಕ್ರಿಯೆಯನ್ನು ವಿಶಾಲವಾಗಿ ಸೂಚಿಸಬಲ್ಲದು. ‘ಕ್ಷಯ’ ಎಂಬುದು ಅದನ್ನು ಕೇವಲ ಲೋಹದ ತುಕ್ಕಿಗೆ ಸೀಮಿತಗೊಳಿಸದೆ ವ್ಯಾಪಕವಾದ ಹಾಳಾಗುವಿಕೆಯನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀφανίζει
  choice: ನಾಶಮಾಡುವುದಿಲ್ಲ
  rationale: ಕಣ್ಮರೆಯಾಗುವಂತೆ ಮಾಡುವುದು ಅಥವಾ ಸಂಪೂರ್ಣ ಹಾಳುಮಾಡುವುದು ಎಂಬ ಮೂಲ ಕ್ರಿಯಾಪದದ ಬಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಕೊಡುತ್ತದೆ.
- source_word: κλέπται
  choice: ಕಳ್ಳರು
  rationale: ಬಹುವಚನ ನಾಮಪದದ ನೇರ ಮತ್ತು ಸಹಜ ಅನುವಾದ.
- source_word: διορύσσουσιν
  choice: ಒಡೆದು ಒಳನುಗ್ಗುವುದೂ ಇಲ್ಲ
  rationale: ಪದಶಃ ‘ಕೊರೆದು ಭೇದಿಸುವುದು’ ಎಂಬ ಕ್ರಿಯೆಯನ್ನು, ಮನೆಗೆ ಕಳ್ಳತನಕ್ಕಾಗಿ ನುಗ್ಗುವ ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ಮೂಲದ ಸಾಂಸ್ಕೃತಿಕ ಚಿತ್ರವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: κλέπτουσιν
  choice: ಕದಿಯುವುದೂ ಇಲ್ಲ
  rationale: ಮೂಲ ಕ್ರಿಯಾಪದದ ಸರಳ ಹಾಗೂ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಪರಲೋಕದಲ್ಲಿರುವ ನಿಧಿಗಳು’ ಎಂಬುದರ ಸ್ವರೂಪ
  choice: ‘ಪರಲೋಕದಲ್ಲಿ ... ನಿಧಿಗಳನ್ನು’ ಎಂಬ ರೂಪಕವನ್ನು ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಪರಲೋಕದ ಪ್ರತಿಫಲಗಳು’ ಅಥವಾ ‘ಆತ್ಮಿಕ ಐಶ್ವರ್ಯ’
  rationale: ಮೂಲವಚನವು ನಿಧಿಯ ರೂಪಕವನ್ನೇ ಬಳಸುತ್ತದೆ. ಅದನ್ನು ನಿರ್ದಿಷ್ಟ ಪ್ರತಿಫಲ-ಸಿದ್ಧಾಂತವಾಗಲಿ, ಆತ್ಮಿಕ ಸಂಪತ್ತಿನ ವ್ಯಾಖ್ಯಾನವಾಗಲಿ ಬದಲಿಸುವುದು ಮೂಲದಲ್ಲಿಲ್ಲದ ತಾತ್ವಿಕ ನಿರ್ಣಯವನ್ನು ಸೇರಿಸಬಹುದು.
- issue: βρῶσις ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ವಿಶಾಲವಾದ ಹಾಳಾಗುವಿಕೆಯನ್ನು ಸೂಚಿಸಲು ‘ಕ್ಷಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ತುಕ್ಕು’ ಅಥವಾ ‘ಸವೆತ’
  rationale: ‘ತುಕ್ಕು’ ಎಂದರೆ ಅರ್ಥವು ಲೋಹದ ಆಕ್ಸೀಕರಣಕ್ಕೆ ಸೀಮಿತವಾಗುವ ಅಪಾಯವಿದೆ. ‘ಕ್ಷಯ’ ಭೌತಿಕ ಸಂಪತ್ತನ್ನು ತಿನ್ನಿಹಾಕುವ ಅಥವಾ ಕ್ರಮೇಣ ನಾಶಮಾಡುವ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡವನ್ನು ಬಳಸಲಾಗಿದೆ. ಶೈಲಿ ಗೌರವಪೂರ್ಣವಾಗಿಯೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿಯೂ ಇದೆ. ‘ನಿಧಿ’ ಎಂಬ ಕೇಂದ್ರ ರೂಪಕ ಮತ್ತು ಮೂಲದ ವಿರೋಧಾತ್ಮಕ ರಚನೆ ಉಳಿಸಲ್ಪಟ್ಟಿವೆ; ಅಡಿಕುರಿಪು ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿಸಿದ ಪದಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
