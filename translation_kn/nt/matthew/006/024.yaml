id: MAT.6.24
reference: Matthew 6:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: kn
  text: ಯಾರೂ ಇಬ್ಬರು ಯಜಮಾನರಿಗೆ ಸೇವೆ ಮಾಡಲಾರರು. ಏಕೆಂದರೆ ಅವನು ಒಬ್ಬನನ್ನು ದ್ವೇಷಿಸಿ ಮತ್ತೊಬ್ಬನನ್ನು ಪ್ರೀತಿಸುವನು; ಇಲ್ಲವೆ ಒಬ್ಬನಿಗೆ ನಿಷ್ಠನಾಗುವನು ಮತ್ತು ಮತ್ತೊಬ್ಬನನ್ನು ಕೀಳಾಗಿ ಕಾಣುವನು. ನೀವು ದೇವರಿಗೂ ಮಮ್ಮೋನನಿಗೂ[a] ಸೇವೆ ಮಾಡಲಾರಿರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಸಂಪತ್ತು’ ಇಲ್ಲವೆ ‘ಹಣ.’ ಗ್ರೀಕ್ ಪಠ್ಯವು ಅರಾಮಾಯಿಕ ಮೂಲದ ‘ಮಮ್ಮೋನ್’ ಎಂಬ ಎರವಲುಪದವನ್ನು ಬಳಸುತ್ತದೆ; ಇಲ್ಲಿ ಸಂಪತ್ತನ್ನು ಪ್ರತಿಸ್ಪರ್ಧಿ ಯಜಮಾನನಂತೆ ವ್ಯಕ್ತೀಕರಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ಯಾರೂ
  rationale: ಸಾರ್ವತ್ರಿಕ ನಿರಾಕರಣೆಯನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ನಿಖರವಾಗಿಯೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δύναται / δύνασθε
  choice: ಸೇವೆಮಾಡಲಾರರು / ಸೇವೆಮಾಡಲಾರಿರಿ
  rationale: ಸಾಮರ್ಥ್ಯದ ಅಸಾಧ್ಯತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಿ, ವಚನದ ಆರಂಭ ಮತ್ತು ಅಂತ್ಯದಲ್ಲಿರುವ ಪುನರಾವರ್ತಿತ ಒತ್ತನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: δυσὶ κυρίοις
  choice: ಇಬ್ಬರು ಯಜಮಾನರಿಗೆ
  rationale: ಇಲ್ಲಿ κύριος ದೈವಿಕ ಬಿರುದಲ್ಲ; ದಾಸ್ಯ ಮತ್ತು ಸೇವೆಯ ಸಾಮಾಜಿಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಯಜಮಾನರು’ ಸಂದರ್ಭೋಚಿತವಾಗಿದೆ.
- source_word: δουλεύειν
  choice: ದಾಸರಾಗಿ ಸೇವೆಮಾಡಲು
  rationale: ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ದಾಸ್ಯಸೇವೆಯ ಅರ್ಥವನ್ನು ಕೇವಲ ‘ಸೇವೆ’ ಎಂದು ಮೃದುಗೊಳಿಸದೆ, ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥವಾಗುವ ಸಹಜ ರೂಪದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μισήσει / ἀγαπήσει
  choice: ದ್ವೇಷಿಸುವನು / ಪ್ರೀತಿಸುವನು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಬಲವಾದ ವಿರೋಧವನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ἑνὸς ἀνθέξεται
  choice: ಒಬ್ಬನಿಗೆ ನಿಷ್ಠನಾಗಿದ್ದು
  rationale: ಒಬ್ಬನನ್ನು ಬಿಗಿಯಾಗಿ ಹಿಡಿದುಕೊಳ್ಳುವುದು, ಅವನಿಗೆ ಅಂಟಿಕೊಂಡಿರುವುದು ಅಥವಾ ಅವನಿಗೆ ಸಮರ್ಪಿತನಾಗಿರುವುದು ಎಂಬ ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: καταφρονήσει
  choice: ತಿರಸ್ಕರಿಸುವನು
  rationale: ಇನ್ನೊಬ್ಬನನ್ನು ಕೀಳಾಗಿ ಕಾಣುವ ಮತ್ತು ಅಲಕ್ಷಿಸುವ ತೀವ್ರ ಅರ್ಥವನ್ನು ಘನವಾದ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: θεῷ
  choice: ದೇವರಿಗೆ
  rationale: δουλεύειν ಕ್ರಿಯೆಯ ದತ್ತಿವಿಭಕ್ತಿಯ ಕರ್ಮವನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುವ ಪ್ರಮಾಣಿತ ರೂಪ.
- source_word: μαμωνᾷ
  choice: ಮಮ್ಮೋನನಿಗೆ
  rationale: ಅರಾಮಾಯಿಕ ಎರವಲುಪದವನ್ನು ಉಳಿಸುವುದರಿಂದ ಸಂಪತ್ತು ದೇವರಿಗೆ ಪ್ರತಿಸ್ಪರ್ಧಿಯಾದ ಯಜಮಾನನಂತೆ ವ್ಯಕ್ತೀಕರಿಸಲ್ಪಟ್ಟಿರುವ ವಾಕ್ಚಾತುರ್ಯ ಕಾಪಾಡಲ್ಪಡುತ್ತದೆ; ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ದೈವಿಕವಲ್ಲದ ಸಾಮಾಜಿಕ ಸಂದರ್ಭದಲ್ಲಿ κύριος ಪದದ ಅನುವಾದ
  choice: ಯಜಮಾನರು
  alternative: ಪ್ರಭುಗಳು
  rationale: ಬಹುವಚನ ಮತ್ತು ದಾಸ್ಯಸೇವೆಯ ಚಿತ್ರಣವು ಅಧಿಕಾರ ಹೊಂದಿದ ಮಾನವ ಯಜಮಾನರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಪ್ರಭುಗಳು’ ಎಂದರೆ ದೈವಿಕ ಬಿರುದಿನ ಅನಗತ್ಯ ಗೊಂದಲ ಉಂಟಾಗಬಹುದು.
- issue: μαμωνᾶς ಪದದ ಅನುವಾದ
  choice: ಮಮ್ಮೋನ್
  alternative: ಹಣ ಅಥವಾ ಸಂಪತ್ತು
  rationale: ದೇವರು ಮತ್ತು ಮಮ್ಮೋನ್ ಇಬ್ಬರೂ ಪ್ರತಿಸ್ಪರ್ಧಿ ಸೇವಾಧಿಪತಿಗಳಂತೆ ಎದುರುನಿಲ್ಲುತ್ತಾರೆ. ಎರವಲುಪದವನ್ನು ಉಳಿಸುವುದು ಈ ವ್ಯಕ್ತೀಕರಣವನ್ನು ಕಾಪಾಡುತ್ತದೆ; ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪು ತಿಳಿಸುತ್ತದೆ.
- issue: μισέω ಪದದ ತೀವ್ರತೆ
  choice: ದ್ವೇಷಿಸುವನು
  alternative: ಕಡಿಮೆ ಪ್ರೀತಿಸುವನು
  rationale: ಪ್ರೀತಿಸುವುದು ಮತ್ತು ತಿರಸ್ಕರಿಸುವುದು ಎಂಬ ಸಮಾಂತರ ವಿರೋಧದ ನಡುವೆ ಮೂಲದ ಬಲವಾದ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಸಂಭವನೀಯ ತೌಲನಿಕ ಅರ್ಥವನ್ನು ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಹೇರಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನವಾದ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಯಜಮಾನ’ ಮತ್ತು ‘ದಾಸರಾಗಿ ಸೇವೆಮಾಡು’ ಎಂಬ ಪದಗಳು ಮೂಲದ ಸ್ವಾಮ್ಯ–ದಾಸ್ಯ ರೂಪಕವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ. ಮೊದಲ ವಾಕ್ಯದ ‘ಯಾರೂ’ಗೆ ಅನುಗುಣವಾಗಿ ಸಾಮಾನ್ಯ ಪುರುಷ ಏಕವಚನ ‘ಅವನು’ ಬಳಕೆಯಾಗಿದೆ; ಅಂತಿಮ ವಾಕ್ಯದಲ್ಲಿ ಮೂಲದ ಬಹುವಚನ ಸಂಬೋಧನೆಯನ್ನು ‘ನೀವು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
