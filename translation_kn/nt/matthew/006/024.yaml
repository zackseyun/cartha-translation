review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the universal impossibility, the two-master metaphor, the paired alternatives, the plural address in the final clause, and the personified force of μαμωνᾷ. However, ‘ದಾಸರಾಗಿ ಸೇವೆಮಾಡು’ is redundant in Kannada and slightly overstates the surface expression where the master–service relation already carries the intended force. ‘ತಿರಸ್ಕರಿಸುವನು’ can mean reject rather than regard with contempt; ‘ಕೀಳಾಗಿ ಕಾಣುವನು’ more directly reflects καταφρονήσει.
  naturalness: 'A small revision improves modern-standard Kannada idiom: ‘ಸೇವೆ ಮಾಡು’ should be written as two words, and omitting the redundant ‘ದಾಸರಾಗಿ’ yields a more natural proverbial formulation without losing the ownership/service imagery supplied by ‘ಯಜಮಾನ’.'
  terminology: ‘ಯಜಮಾನ’ is contextually right for κύριος, avoiding a divine-title reading. ‘ದೇವರು’ and the retained loanword ‘ಮಮ್ಮೋನ್’ are appropriate. The footnote correctly supplies ‘ಸಂಪತ್ತು’ and ‘ಹಣ’ while explaining the rhetorical personification.
  issues:
  - severity: medium
    issue: Redundant expression ‘ದಾಸರಾಗಿ ಸೇವೆಮಾಡಲು/ಸೇವೆಮಾಡಲಾರರು’
    rationale: δουλεύειν does evoke slave-service, but with ‘ಯಜಮಾನ’ already present, ‘ದಾಸರಾಗಿ ಸೇವೆಮಾಡು’ is tautological and less idiomatic in modern Kannada. ‘ಯಜಮಾನರಿಗೆ ಸೇವೆ ಮಾಡು’ preserves the source metaphor naturally.
  - severity: low
    issue: ‘ತಿರಸ್ಕರಿಸುವನು’ is less exact for καταφρονήσει
    rationale: The Greek denotes contempt or looking down on the other, not principally rejecting them. ‘ಕೀಳಾಗಿ ಕಾಣುವನು’ conveys that evaluative contempt directly.
  revised_text: ಯಾರೂ ಇಬ್ಬರು ಯಜಮಾನರಿಗೆ ಸೇವೆ ಮಾಡಲಾರರು. ಏಕೆಂದರೆ ಅವನು ಒಬ್ಬನನ್ನು ದ್ವೇಷಿಸಿ ಮತ್ತೊಬ್ಬನನ್ನು ಪ್ರೀತಿಸುವನು; ಇಲ್ಲವೆ ಒಬ್ಬನಿಗೆ ನಿಷ್ಠನಾಗುವನು ಮತ್ತು ಮತ್ತೊಬ್ಬನನ್ನು ಕೀಳಾಗಿ ಕಾಣುವನು. ನೀವು ದೇವರಿಗೂ ಮಮ್ಮೋನನಿಗೂ[a] ಸೇವೆ ಮಾಡಲಾರಿರಿ.
