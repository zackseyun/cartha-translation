revisions:
- from: ಯಾರೂ ಇಬ್ಬರು ಯಜಮಾನರಿಗೆ ದಾಸರಾಗಿ ಸೇವೆಮಾಡಲಾರರು. ಏಕೆಂದರೆ ಅವನು ಒಬ್ಬನನ್ನು ದ್ವೇಷಿಸಿ ಮತ್ತೊಬ್ಬನನ್ನು ಪ್ರೀತಿಸುವನು; ಇಲ್ಲವೆ ಒಬ್ಬನಿಗೆ ನಿಷ್ಠನಾಗಿದ್ದು ಮತ್ತೊಬ್ಬನನ್ನು ತಿರಸ್ಕರಿಸುವನು. ನೀವು ದೇವರಿಗೂ ಮಮ್ಮೋನನಿಗೂ[a] ದಾಸರಾಗಿ ಸೇವೆಮಾಡಲಾರಿರಿ.
  to: ಯಾರೂ ಇಬ್ಬರು ಯಜಮಾನರಿಗೆ ಸೇವೆ ಮಾಡಲಾರರು. ಏಕೆಂದರೆ ಅವನು ಒಬ್ಬನನ್ನು ದ್ವೇಷಿಸಿ ಮತ್ತೊಬ್ಬನನ್ನು ಪ್ರೀತಿಸುವನು; ಇಲ್ಲವೆ ಒಬ್ಬನಿಗೆ ನಿಷ್ಠನಾಗುವನು ಮತ್ತು ಮತ್ತೊಬ್ಬನನ್ನು ಕೀಳಾಗಿ ಕಾಣುವನು. ನೀವು ದೇವರಿಗೂ ಮಮ್ಮೋನನಿಗೂ[a] ಸೇವೆ ಮಾಡಲಾರಿರಿ.
  rationale: The revision removes a Kannada redundancy while retaining the social master–service metaphor, makes the rendering of καταφρονήσει more precise, and regularizes modern Kannada word spacing. The loanword and explanatory footnote are retained to preserve the source’s personified contrast between God and mammon.
