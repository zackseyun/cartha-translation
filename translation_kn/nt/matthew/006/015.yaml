id: MAT.6.15
reference: Matthew 6:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: kn
  text: ಆದರೆ ನೀವು ಜನರನ್ನು ಕ್ಷಮಿಸದಿದ್ದರೆ, ನಿಮ್ಮ ತಂದೆಯೂ ನಿಮ್ಮ ಅಪರಾಧಗಳನ್ನು[a] ಕ್ಷಮಿಸುವುದಿಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅತಿಕ್ರಮಗಳನ್ನು” ಅಥವಾ “ತಪ್ಪುಗಳನ್ನು.”
    reason: παραπτώματα ಎಂಬ ಪದಕ್ಕೆ ಸಾಧ್ಯವಿರುವ ಅರ್ಥಪೂರ್ಣ ಪರ್ಯಾಯ ಅನುವಾದಗಳು.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: ಆದರೆ ... ಕ್ಷಮಿಸದಿದ್ದರೆ
  rationale: ἐὰν ಮತ್ತು μή ಷರತ್ತಿನ ನಕಾರಾತ್ಮಕ ರೂಪವನ್ನು ಸೂಚಿಸುತ್ತವೆ; δέ ಹಿಂದಿನ ವಾಕ್ಯದೊಂದಿಗೆ ವ್ಯತ್ಯಾಸವನ್ನು ತೋರಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἀφῆτε
  choice: ಕ್ಷಮಿಸದಿದ್ದರೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ἀφίημι ಎಂಬುದು ಪರರ ಅಪರಾಧವನ್ನು ಕ್ಷಮಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಷರತ್ತಿನ ರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῖς ἀνθρώποις
  choice: ಜನರನ್ನು
  rationale: ἄνθρωποι ಇಲ್ಲಿ ಗಂಡಸರನ್ನು ಮಾತ್ರವಲ್ಲ, ಸಾಮಾನ್ಯವಾಗಿ ಮನುಷ್ಯರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಗ್ರೀಕ್ ಪಠ್ಯವು ಮೊದಲ ಉಪವಾಕ್ಯದಲ್ಲಿ ಅಪರಾಧಗಳೆಂಬ ಕರ್ಮವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಹೇಳದೆ ಜನರನ್ನೇ ಕ್ಷಮಿಸುವುದಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: οὐδὲ
  choice: ನಿಮ್ಮ ತಂದೆಯೂ ... ಕ್ಷಮಿಸುವುದಿಲ್ಲ
  rationale: οὐδέ ಷರತ್ತಿನ ಫಲವನ್ನೂ ನಕಾರಾತ್ಮಕವಾಗಿ ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘-ಯೂ ... ಇಲ್ಲ’ ರಚನೆ ‘neither’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಸಮಾನಾಂತರತೆಯನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ನಿಮ್ಮ ತಂದೆ
  rationale: ಮೂಲ ಪಠ್ಯದಲ್ಲಿ ‘ಪರಲೋಕದ’ ಎಂಬ ವಿಶೇಷಣ ಇಲ್ಲದಿರುವುದರಿಂದ ಅದನ್ನು ಸೇರಿಸದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἀφήσει
  choice: ಕ್ಷಮಿಸುವುದಿಲ್ಲ
  rationale: ಮೊದಲ ἀφίημι ಪದದಂತೆಯೇ ‘ಕ್ಷಮಿಸು’ ಎಂಬ ಪದವನ್ನು ಬಳಸುವುದರಿಂದ ಮೂಲದಲ್ಲಿರುವ ಪುನರಾವರ್ತನೆ ಮತ್ತು ಪರಸ್ಪರ ಸಂಬಂಧ ಉಳಿಯುತ್ತವೆ.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: ನಿಮ್ಮ ಅಪರಾಧಗಳನ್ನು
  rationale: παραπτώματα ಎಂದರೆ ನೈತಿಕ ತಪ್ಪುಗಳು, ಉಲ್ಲಂಘನೆಗಳು ಅಥವಾ ಅಪರಾಧಗಳು. ‘ಅಪರಾಧಗಳು’ ಆ ನೈತಿಕ ಭಾರವನ್ನು ಉಳಿಸಿಕೊಂಡು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿರುತ್ತದೆ.
theological_decisions:
- issue: ಮನುಷ್ಯರು ಕ್ಷಮಿಸುವುದಕ್ಕೂ ತಂದೆಯು ಕ್ಷಮಿಸುವುದಕ್ಕೂ ಇರುವ ಷರತ್ತಿನ ಸಂಬಂಧ
  choice: ಮೂಲದಲ್ಲಿರುವ ನೇರ ಷರತ್ತಿನ ಹೇಳಿಕೆಯನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದು ಕೇವಲ ನಿಜವಾದ ನಂಬಿಕೆಯ ಸಾಕ್ಷಿ ಎಂದು ವಿವರಿಸುವುದು, ಅಥವಾ ಕ್ಷಮೆಯ ಬದಲು ದೇವರೊಂದಿಗಿನ ಅನ್ಯೋನ್ಯತೆಯ ನಷ್ಟವೆಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ನೇರವಾದ ಷರತ್ತನ್ನು ಹೇಳುತ್ತದೆ. ವಿಶಾಲವಾದ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವಾದವನ್ನು ಅನುವಾದದಲ್ಲೇ ಪರಿಹರಿಸದೆ, ಪಠ್ಯದ ತೀವ್ರತೆ ಮತ್ತು ಒತ್ತಡವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೂ ಸೂಕ್ತವಾದ ಶೈಲಿ. ‘ಜನರನ್ನು’ ಎಂಬುದು ಲಿಂಗಸಮಾವೇಶಕವಾಗಿದ್ದು ಮೂಲದ ಸಾಮಾನ್ಯ ಮಾನವಸೂಚಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ. ಅಡಿಕುರಿತು ಗುರುತನ್ನು ಅದು ವಿವರಿಸುವ ‘ಅಪರಾಧಗಳನ್ನು’ ಎಂಬ ಪದದ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
