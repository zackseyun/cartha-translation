id: MAT.6.12
reference: Matthew 6:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: kn
  text: ಮತ್ತು ನಮ್ಮ ಸಾಲಗಳನ್ನು ನಮಗೆ ಕ್ಷಮಿಸು[a], ನಾವೂ ನಮ್ಮ ಸಾಲಗಾರರನ್ನು ಕ್ಷಮಿಸಿರುವಂತೆಯೇ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಸಾಲಗಳು’ ಎಂಬುದು ಇಲ್ಲಿ ದೇವರ ಮುಂದೆ ಇರುವ ಪಾಪಗಳು ಅಥವಾ ಅಪರಾಧಗಳನ್ನು ಸೂಚಿಸುವ ರೂಪಕವಾಗಿದೆ. ‘ಅಪರಾಧಗಳು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಕ್ಷಮಿಸಿದೆವು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಅಓರಿಸ್ಟ್ ಕ್ರಿಯಾರೂಪವನ್ನು ಸರಳ ಭೂತಕಾಲವಾಗಿಯೂ ಅನುವಾದಿಸಬಹುದು; ‘ಕ್ಷಮಿಸಿದ್ದೇವೆ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಪರ್ಯಾಯವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ಕ್ಷಮಿಸು
  rationale: ಪ್ರಾರ್ಥನೆಯ ಸಂದರ್ಭದಲ್ಲಿ ἀφίημι ಎಂಬ ಕ್ರಿಯಾಪದವು ‘ಬಿಟ್ಟುಬಿಡು’ ಅಥವಾ ‘ಬಿಡುಗಡೆಮಾಡು’ ಎಂಬ ಮೂಲಭಾವವನ್ನು ಹೊಂದಿದ್ದರೂ, ನೈತಿಕ ಸಾಲಗಳೊಂದಿಗೆ ಬಂದಿರುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ‘ಕ್ಷಮಿಸು’ ಸಹಜವೂ ನಿಖರವೂ ಆಗಿದೆ.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: ನಮ್ಮ ಸಾಲಗಳನ್ನು
  rationale: ὀφειλήματα ಎಂದರೆ ಅಕ್ಷರಶಃ ‘ಸಾಲಗಳು/ಕೊಡಬೇಕಾದವು.’ ‘ಸಾಲಗಳು’ ಎಂಬುದು ಪಾಪ ಅಥವಾ ಅಪರಾಧವನ್ನು ಸಾಲವೆಂದು ಚಿತ್ರಿಸುವ ಗ್ರೀಕ್ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὡς
  choice: ಏಕೆಂದರೆ
  rationale: ὡς ಸಾಮಾನ್ಯವಾಗಿ ಹೋಲಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಮನವಿಯಲ್ಲಿ ಆ ಹೋಲಿಕೆಗೆ ಆಧಾರ ಅಥವಾ ಅನುಸಾರ ಎಂಬ ಸೂಕ್ಷ್ಮಭಾವವೂ ಇದೆ. ಆದರೆ ‘ಹೇಗೋ ಹಾಗೆ’ ಎಂಬ ಹೆಚ್ಚು ಸ್ಪಷ್ಟ ಹೋಲಿಕೆಯ ಅನುವಾದವೂ ಸಾಧ್ಯ; ಆ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ತಾತ್ವಿಕ ನಿರ್ಧಾರದಲ್ಲಿ ಗುರುತಿಸಲಾಗಿದೆ.
- source_word: καὶ ἡμεῖς
  choice: ನಾವೂ
  rationale: ಎರಡನೆಯ καὶ ಮತ್ತು ಸ್ಪಷ್ಟ ಸರ್ವನಾಮ ἡμεῖς ಒಟ್ಟಾಗಿ ‘ನಾವೂ’ ಎಂಬ ಒತ್ತನ್ನು ನೀಡುತ್ತವೆ.
- source_word: ἀφήκαμεν
  choice: ಕ್ಷಮಿಸಿದ್ದೇವೆ
  rationale: ಅಓರಿಸ್ಟ್ ರೂಪವು ಪೂರ್ಣಗೊಂಡ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ಕ್ಷಮಿಸಿದ್ದೇವೆ’ ಆ ಕ್ರಿಯೆಯ ಈಗಿನ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಸರಳ ಭೂತಕಾಲದ ಅನುವಾದವೂ ಸಾಧ್ಯ.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: ನಮಗೆ ಸಾಲಗಾರರಾಗಿರುವವರನ್ನು
  rationale: ὀφειλέταις ಎಂಬುದು ὀφειλήματαಗೆ ಸಂಬಂಧಿಸಿದ ಪದ. ಈ ಆಯ್ಕೆ ‘ಸಾಲ’ ಎಂಬ ರೂಪಕದ ಪದಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತಾ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥವಾಗುವಂತೆ ಮಾಡುತ್ತದೆ.
theological_decisions:
- issue: ὀφειλήματα ಎಂಬ ನೈತಿಕ ಸಾಲದ ರೂಪಕ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸಾಲಗಳು’ ಎಂಬ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಅಪರಾಧಗಳು’ ಅಥವಾ ‘ಪಾಪಗಳು’
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಪಾಪವನ್ನು ನೇರವಾಗಿ ಹೆಸರಿಸದೆ, ಕೊಡಬೇಕಾದ ಸಾಲದ ರೂಪಕವನ್ನು ಬಳಸುತ್ತದೆ. ಅದನ್ನು ಉಳಿಸುವುದು ಮೂಲದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನೂ ಮುಂದಿನ ‘ಸಾಲಗಾರರು’ ಎಂಬ ಪದದ ಸಂಬಂಧವನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
- issue: ὡς ಪದದ ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥ
  choice: ‘ಏಕೆಂದರೆ’ ಎಂದು ಅನುವಾದಿಸಿ, ಕ್ಷಮೆ ಕೋರುವ ಮನವಿಗೆ ಮಾನವ ಕ್ಷಮೆಯು ಸಂಬಂಧಿತ ಆಧಾರವಾಗಿರುವ ಸೂಕ್ಷ್ಮಭಾವವನ್ನು ಮುಂದಿಟ್ಟಿದೆ.
  alternative: ‘ನಾವೂ ... ಕ್ಷಮಿಸಿರುವಂತೆಯೇ’ ಅಥವಾ ‘ಹೇಗೋ ಹಾಗೆ’
  rationale: ὡς ಮೂಲತಃ ಹೋಲಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ ಮತ್ತು ‘ಹಾಗೆಯೇ/ಅನುಸಾರವಾಗಿ’ ಎಂಬ ಅನುವಾದ ಹೆಚ್ಚು ನೇರವಾಗಿದೆ. ಸಂದರ್ಭದಲ್ಲಿನ ಆಧಾರಸೂಚಕ ಓದು ಸಾಧ್ಯವಾದರೂ ಅದು ಹೋಲಿಕೆಯ ಬಲವನ್ನು ಕಡಿಮೆ ಮಾಡಬಹುದು; ಆದ್ದರಿಂದ ಪರ್ಯಾಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ದಾಖಲಿಸಲಾಗಿದೆ.
- issue: ἀφήκαμεν ಕ್ರಿಯೆಯ ಕಾಲಸೂಕ್ಷ್ಮತೆ
  choice: ‘ಕ್ಷಮಿಸಿದ್ದೇವೆ’
  alternative: ‘ಕ್ಷಮಿಸಿದೆವು’
  rationale: ಗ್ರೀಕ್ ಅಓರಿಸ್ಟ್ ಸರಳ ಭೂತಕಾಲವಾಗಿಯೂ ಅನುವಾದಿಸಬಹುದು. ‘ಕ್ಷಮಿಸಿದ್ದೇವೆ’ ಪೂರ್ಣಗೊಂಡ ಕ್ರಿಯೆಗೆ ವರ್ತಮಾನ ಸಂಬಂಧವಿರುವುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ; ಇದು ಕಾಲರೂಪದಿಂದ ಅಗತ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ತಾತ್ವಿಕ ನಿರ್ಣಯ ಮಾಡುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ದೇವರನ್ನು ಏಕವಚನ ಗೌರವಪೂರ್ಣ ಪ್ರಾರ್ಥನಾ ಶೈಲಿಯಲ್ಲಿ ಉದ್ದೇಶಿಸುವ ‘ಕ್ಷಮಿಸು’ ರೂಪ ಬಳಸಲಾಗಿದೆ. ‘ಸಾಲ’ ಮತ್ತು ‘ಸಾಲಗಾರ’ ಎಂಬ ಮೂಲ ರೂಪಕದ ಪದಸಂಬಂಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
