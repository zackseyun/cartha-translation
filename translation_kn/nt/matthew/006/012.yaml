- from: ನಮ್ಮ ಸಾಲಗಳನ್ನು ಕ್ಷಮಿಸು[a], ಏಕೆಂದರೆ ನಮಗೆ ಸಾಲಗಾರರಾಗಿರುವವರನ್ನು ನಾವೂ ಕ್ಷಮಿಸಿದ್ದೇವೆ[b].
  to: ಮತ್ತು ನಮ್ಮ ಸಾಲಗಳನ್ನು ನಮಗೆ ಕ್ಷಮಿಸು[a], ನಾವೂ ನಮ್ಮ ಸಾಲಗಾರರನ್ನು ಕ್ಷಮಿಸಿರುವಂತೆಯೇ[b].
  rationale: The revision replaces the causal ‘ಏಕೆಂದರೆ’ with the comparative ‘...ಕ್ಷಮಿಸಿರುವಂತೆಯೇ,’ preserving the force of ὡς. It restores the initial conjunction and keeps the linked debt/debtor metaphor. The revised footnote accurately presents the aorist as permitting a simple-past alternative without assigning it an unwarranted aspectual-theological force.
  reviewer_model: gpt-5.6-terra
