id: MAT.6.31
reference: Matthew 6:31
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ‘ನಾವು ಏನು ತಿನ್ನೋಣ?’ ಅಥವಾ ‘ಏನು ಕುಡಿಯೋಣ?’ ಅಥವಾ ‘ಏನು ಧರಿಸೋಣ?’ ಎಂದು ಹೇಳುತ್ತಾ ಕಳವಳಪಡಬೇಡಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಚಿಂತಿಸಬೇಡಿ.’
    reason: μεριμνάω ಪದವು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಆಹಾರ, ಪಾನೀಯ ಮತ್ತು ಉಡುಪಿನ ಕುರಿತ ಆತಂಕಭರಿತ ಚಿಂತೆ ಅಥವಾ ಕಳವಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಚಿಂತಿಸಬೇಡಿ’ ಎಂಬುದು ವಿಶಾಲವಾದ ಪರ್ಯಾಯ ಪದಪ್ರಯೋಗವಾಗಿದೆ.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: ಆದ್ದರಿಂದ ... ಚಿಂತಿಸಬೇಡಿ
  rationale: οὖν ಹಿಂದಿನ ವಾದದಿಂದ ಬರುವ ತೀರ್ಮಾನವನ್ನು ‘ಆದ್ದರಿಂದ’ ಎಂದು ಸೂಚಿಸುತ್ತದೆ. μεριμνάω ಇಲ್ಲಿ ಆಹಾರ, ಪಾನೀಯ ಮತ್ತು ಉಡುಪಿನ ಕುರಿತ ಕಳವಳಭರಿತ ಚಿಂತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಚಿಂತಿಸಬೇಡಿ’ ಆ ನಿಷೇಧವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: λέγοντες
  choice: ಎಂದು ಹೇಳುತ್ತಾ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಚಿಂತೆಯ ಜೊತೆಗಿರುವ ಮಾತು ಅಥವಾ ಅದರ ವ್ಯಕ್ತೀಕರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಎಂದು ಹೇಳುತ್ತಾ’ ಈ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Τί φάγωμεν;
  choice: ನಾವು ಏನು ತಿನ್ನೋಣ?
  rationale: τί ಅನ್ನು ‘ಏನು’ ಎಂದೂ, deliberative aorist subjunctive φάγωμεν ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ವಿಚಾರಣಾರ್ಥಕ ‘ತಿನ್ನೋಣ?’ ಎಂದೂ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: Τί πίωμεν;
  choice: ಏನು ಕುಡಿಯೋಣ?
  rationale: πίωμεν ಕೂಡ ಮುಂದಿನ ಅಗತ್ಯದ ಕುರಿತು deliberative ಪ್ರಶ್ನೆಯಾಗಿದೆ; ‘ಕುಡಿಯೋಣ?’ ಅದರ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ. ಹಿಂದಿನ ಪ್ರಶ್ನೆಯಿಂದ ‘ನಾವು’ ಇಲ್ಲಿ ಅರ್ಥಗತವಾಗುತ್ತದೆ.
- source_word: Τί περιβαλώμεθα;
  choice: ಏನು ಧರಿಸೋಣ?
  rationale: περιβάλλω ಈ ಸಂದರ್ಭದಲ್ಲಿ ಬಟ್ಟೆ ತೊಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಏನು ಧರಿಸೋಣ?’ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು ಪ್ರತಿಫಲಕ ರೂಪದ ಅಸಹಜ ಪದಶಃ ಅನುವಾದವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἤ ... ἤ ... ἤ
  choice: ಅಥವಾ ... ಅಥವಾ
  rationale: ಮೂರು ಪ್ರಶ್ನೆಗಳ ನಡುವಿನ ಪರ್ಯಾಯ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪುನರಾವರ್ತಿತ ‘ಅಥವಾ’ ಮೂಲಕ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಗ್ರೀಕ್‌ನ ಮೊದಲ ἤ ಮೊದಲ ಮತ್ತು ಎರಡನೆಯ ಪ್ರಶ್ನೆಗಳನ್ನು ಜೋಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಭೌತಿಕ ಅಗತ್ಯಗಳ ಕುರಿತು ಯೇಸುವಿನ ನಿಷೇಧದ ಸ್ವರೂಪ
  choice: μεριμνήσητε ಅನ್ನು ಕಳವಳಭರಿತ ಚಿಂತೆಗೆ ನೀಡಿದ ನಿಷೇಧವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಯಾವುದೇ ರೀತಿಯ ಕಾಳಜಿ ಅಥವಾ ಮುನ್ನೆಚ್ಚರಿಕೆಯ ಯೋಜನೆ ಮಾಡಬಾರದು ಎಂಬ ಸಂಪೂರ್ಣ ನಿಷೇಧ.
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭವು ಆಹಾರ, ಪಾನೀಯ ಮತ್ತು ಉಡುಪಿನ ಪೂರೈಕೆಯ ಕುರಿತ ಕಳವಳವನ್ನು ಉದ್ದೇಶಿಸುತ್ತದೆ; ಜವಾಬ್ದಾರಿಯುತ ಯೋಜನೆಯನ್ನು ತಿರಸ್ಕರಿಸುವ ಹೆಚ್ಚುವರಿ ಅರ್ಥವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕವನ್ನು ಬಳಸಲಾಗಿದೆ. ನೇರ ಪ್ರಶ್ನೆಗಳು ಸರಳ, ಮಾತುಕತೆಯಲ್ಲಿಯೂ ಗ್ರಾಹ್ಯವಾಗುವ ರೂಪದಲ್ಲಿವೆ; ವಾಕ್ಯದ ಬೋಧನಾತ್ಮಕ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
