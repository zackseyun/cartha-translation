id: MAT.6.4
reference: Matthew 6:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: kn
  text: ನೀನು ಬಡವರಿಗೆ ಕೊಡುವುದು[a] ಗುಪ್ತವಾಗಿರುವಂತೆ ಮಾಡು; ಆಗ ಗುಪ್ತವಾದದ್ದನ್ನು ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ದಾನ.’ ಗ್ರೀಕ್ ಪದವು ವಿಶೇಷವಾಗಿ ಬಡವರಿಗೆ ಕೊಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ನಿನಗೆ ಪ್ರತಿಯಾಗಿ ಕೊಡುವನು.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: ಹೀಗೆ, … ಗುಪ್ತವಾಗಿರಲಿ
  rationale: ὅπως ಜೊತೆಗೆ ಬಂದಿರುವ ವರ್ತಮಾನ ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯಾಪದವು ಹಿಂದಿನ ಸೂಚನೆಯ ಉದ್ದೇಶವನ್ನು ತಿಳಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಹಿಂದಿನ ವಾಕ್ಯಕ್ಕೆ ಸಹಜವಾಗಿ ಕೊಂಡಿಹಾಕುತ್ತಾ ಉದ್ದೇಶದ ಭಾವವನ್ನು ಉಳಿಸಲು ಈ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ἐλεημοσύνη
  choice: ಬಡವರಿಗೆ ಕೊಡುವುದು
  rationale: ಈ ಪದವು ಸಾಮಾನ್ಯ ದಯೆಯನ್ನಲ್ಲ, ವಿಶೇಷವಾಗಿ ಬಡವರಿಗೆ ಕೊಡುವ ದಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ನೇರವಾಗಿ ತಿಳಿಸುವ ರೂಪವನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: ἐν τῷ κρυπτῷ
  choice: ಗುಪ್ತವಾಗಿ / ಗುಪ್ತದಲ್ಲಿ
  rationale: ಮೊದಲ ಬಳಕೆಯಲ್ಲಿ ಕೊಡುವ ಕ್ರಿಯೆ ಸಾರ್ವಜನಿಕ ದೃಷ್ಟಿಯಿಂದ ಮರೆಯಾಗಿರುವುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಗುಪ್ತವಾಗಿರಲಿ’ ಎಂದು ಹೇಳಲಾಗಿದೆ; ಎರಡನೆಯ ಬಳಕೆಯಲ್ಲಿ ಮೂಲದ ಪುನರಾವರ್ತನೆಯನ್ನು ಕಾಣುವಂತೆ ‘ಗುಪ್ತದಲ್ಲಿ’ ಎಂಬ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὁ πατήρ σου
  choice: ನಿನ್ನ ತಂದೆ
  rationale: ಮೂಲದಲ್ಲಿ ‘ಪರಲೋಕದ’ ಎಂಬ ವಿಶೇಷಣ ಇಲ್ಲದಿರುವುದರಿಂದ ಸಮೀಪದ ವಚನಗಳ ಪದಪ್ರಯೋಗವನ್ನು ಇಲ್ಲಿ ಸೇರಿಸದೆ ಸರಳವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὁ βλέπων
  choice: ನೋಡುವ
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ತಂದೆಯನ್ನು ವಿಶೇಷಿಸುವ ಸಹಜ ಕೃದಂತ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἀποδώσει σοι
  choice: ನಿನಗೆ ಪ್ರತಿಫಲ ನೀಡುವನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ದೇವರು ಗುಪ್ತವಾಗಿ ಮಾಡಿದ ನೀತಿಯ ಕಾರ್ಯಕ್ಕೆ ಅನುಕೂಲಕರವಾಗಿ ಪ್ರತಿಕ್ರಿಯಿಸುವ ಅರ್ಥವನ್ನು ‘ಪ್ರತಿಫಲ’ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಪ್ರತಿಫಲದ ಸ್ವರೂಪವನ್ನು ಮಾತ್ರ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ἀποδώσει ಸೂಚಿಸುವ ದೈವಿಕ ಪ್ರತಿಫಲದ ಸ್ವರೂಪ
  choice: ನಿನಗೆ ಪ್ರತಿಫಲ ನೀಡುವನು
  alternative: ನಿನಗೆ ಪ್ರತಿಯಾಗಿ ಕೊಡುವನು
  rationale: ವಚನವು ತಂದೆಯ ಅನುಕೂಲಕರ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ವಾಗ್ದಾನ ಮಾಡುತ್ತದೆ, ಆದರೆ ಅದು ಲೌಕಿಕವೋ, ನಿತ್ಯವೋ, ಭೌತಿಕವೋ ಅಥವಾ ಆತ್ಮಿಕವೋ ಎಂದು ಹೇಳುವುದಿಲ್ಲ. ಆಯ್ದ ಅನುವಾದವು ಆ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಪೂರ್ಣವಾದ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಗುಪ್ತ’ ಎಂಬ ಪದವನ್ನು ಎರಡೂ ಖಂಡಗಳಲ್ಲಿ ಉಳಿಸಿ ಮೂಲದ ಪ್ರಮುಖ ಪುನರಾವರ್ತನೆಯನ್ನು ಪ್ರತಿಬಿಂಬಿಸಲಾಗಿದೆ; ‘ತಂದೆ’ಗೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ಪರಲೋಕದ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
