review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys almsgiving to the poor, the purpose relation, the repeated hidden/secret setting, God as 'your Father,' and the future divine recompense. A small adjustment makes the purpose construction more explicit and idiomatic in Kannada without adding theological content.
  naturalness: ‘ಗುಪ್ತದಲ್ಲಿ ನೋಡುವ’ is understandable but somewhat literal and less natural in modern standard Kannada. ‘ಗುಪ್ತವಾದದ್ದನ್ನು ನೋಡುವ’ naturally expresses that the Father sees what is hidden. ‘ಗುಪ್ತವಾಗಿರುವಂತೆ ಮಾಡು’ also represents the verse's purpose clause more clearly in a stand-alone Kannada rendering.
  terminology: ‘ಬಡವರಿಗೆ ಕೊಡುವುದು’ correctly specifies ἐλεημοσύνη. ‘ಪ್ರತಿಫಲ ಕೊಡುವನು’ suitably conveys ἀποδώσει without defining the nature of the recompense. ‘ತಂದೆ’ properly avoids adding ‘heavenly.’
