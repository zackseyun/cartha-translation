  to: ನೀನು ಬಡವರಿಗೆ ಕೊಡುವುದು[a] ಗುಪ್ತವಾಗಿರುವಂತೆ ಮಾಡು; ಆಗ ಗುಪ್ತವಾದದ್ದನ್ನು ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು.[b]
  rationale: The revision retains all source elements while using idiomatic modern Kannada. The supplied ‘ಆಗ’ makes explicit the purpose-to-result connection inherent in the verse's dependence on the prior instruction; it does not specify the nature or timing of the promised recompense. The revised wording for the Father's seeing avoids suggesting that he sees covertly, and instead states that he sees what is hidden.
