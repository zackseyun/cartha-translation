    rationale: ‘ಹೀಗೆ, … ಗುಪ್ತವಾಗಿರಲಿ’ can be understood, but ‘… ಗುಪ್ತವಾಗಿರುವಂತೆ ಮಾಡು’ more naturally carries the purpose linked to the preceding instruction. ‘ಗುಪ್ತವಾದದ್ದನ್ನು ನೋಡುವ’ is clearer Kannada than the literal-looking ‘ಗುಪ್ತದಲ್ಲಿ ನೋಡುವ,’ while retaining the intended sense of God seeing what is hidden.
