  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: kn
  text: ನಮಗೆ ಇಂದು ನಮ್ಮ ದೈನಂದಿನ ರೊಟ್ಟಿಯನ್ನು ಕೊಡು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಇಂದಿನ ನಮ್ಮ ರೊಟ್ಟಿಯನ್ನು,” “ಬರುವ ದಿನಕ್ಕೆ ನಮ್ಮ ರೊಟ್ಟಿಯನ್ನು,” ಅಥವಾ “ನಮಗೆ ಅಗತ್ಯವಾದ ರೊಟ್ಟಿಯನ್ನು.” ἐπιούσιον ಎಂಬ ಗ್ರೀಕ್ ವಿಶೇಷಣವು ಅಪರೂಪದ ಪದವಾಗಿದ್ದು, ಅದರ ನಿಖರ ಅರ್ಥದ ಬಗ್ಗೆ ಭಿನ್ನಾಭಿಪ್ರಾಯವಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: ನಮಗೆ ಬೇಕಾದ ರೊಟ್ಟಿಯನ್ನು
  rationale: ἄρτος ಎಂಬ ಸ್ಪಷ್ಟವಾದ ‘ರೊಟ್ಟಿ’ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ἡμῶν ಅನ್ನು ಪ್ರತ್ಯೇಕ ಸ್ವಾಮ್ಯಪದವಾಗಿ ಯಾಂತ್ರಿಕವಾಗಿ ಅನುವಾದಿಸುವ ಬದಲು, ಕನ್ನಡದ ಸಹಜ ಬಳಕೆಯಲ್ಲಿ ‘ನಮಗೆ ಬೇಕಾದ’ ಎಂಬ ಪದಗುಚ್ಛದೊಳಗೆ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ಇದು ἐπιούσιον ಪದದ ಅಗತ್ಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಧ್ಯ ಅರ್ಥವನ್ನೂ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸರಳವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸν ἐπιούσιον
  choice: ಬೇಕಾದ
  rationale: ಅಪರೂಪದ ἐπιούσιος ಪದದ ನಿಖರ ಅರ್ಥ ವಿವಾದಿತವಾಗಿದೆ. ‘ಬೇಕಾದ’ ಎಂಬುದು ಜೀವನೋಪಾಯಕ್ಕೆ ಅಗತ್ಯವಾದ ರೊಟ್ಟಿ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ‘ದಿನದಿನದ’, ‘ಇಂದಿಗೆ ಬೇಕಾದ’, ‘ಮುಂದಿನ ದಿನಕ್ಕೆ ಬೇಕಾದ’ ಎಂಬ ಪರ್ಯಾಯಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: δὸς ἡμῖν
  choice: ನಮಗೆ ಕೊಡು
  rationale: δὸς ಎಂಬ ನೇರ ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯೆಗೆ ‘ಕೊಡು’ ಸಹಜ ಮತ್ತು ಸರಳವಾಗಿದೆ; ἡμῖν ದತ್ತಿವಿಭಕ್ತಿಯನ್ನು ‘ನಮಗೆ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: σήμερον
  choice: ಇಂದು
  rationale: σήμερον ಪದದ ನೇರ ಕಾಲಸೂಚಕ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದ ಸಹಜ ‘ಇಂದು’ ಎಂಬ ಪದದಿಂದ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಕರ್ತನ ಪ್ರಾರ್ಥನೆಯಲ್ಲಿ ἐπιούσιον ಪದದ ಅರ್ಥ
  choice: ಬೇಕಾದ
  alternative: ದಿನದಿನದ; ಇಂದಿಗೆ ಬೇಕಾದ; ಮುಂದಿನ ದಿನಕ್ಕೆ ಬೇಕಾದ
  rationale: ἐπιούσιος ಪದವು ಇಂದಿನ ಅಗತ್ಯ, ಬರುವ ದಿನದ ಆಹಾರ, ಅಥವಾ ಜೀವನಕ್ಕೆ ಅಗತ್ಯವಾದ ಪೋಷಣೆ ಎಂಬ ಅರ್ಥಗಳನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಬೇಕಾದ’ ಎಂಬ ಆಯ್ಕೆ ದೇವರ ಮೇಲಿನ ಅವಲಂಬನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ಆದರೆ ಒಂದೇ ವ್ಯುತ್ಪತ್ತಿಯನ್ನು ಖಚಿತವೆಂದು ನಿರ್ಧರಿಸದೆ ನಿಜವಾದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಕಾಪಾಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಪ್ರಾರ್ಥನಾ ಶೈಲಿ. ‘ರೊಟ್ಟಿ’ ಎಂಬ ಸ್ಪಷ್ಟ ಚಿತ್ರವನ್ನು ಉಳಿಸಿ, ವಿವಾದಿತ ಗ್ರೀಕ್ ವಿಶೇಷಣದ ಪರ್ಯಾಯ ಅರ್ಥಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
