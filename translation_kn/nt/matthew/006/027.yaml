id: MAT.6.27
reference: Matthew 6:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: kn
  text: ನಿಮ್ಮಲ್ಲಿ ಯಾರು ಆತಂಕಪಡುವುದರಿಂದ ತನ್ನ ಆಯುಷ್ಯಕ್ಕೆ[a] ಒಂದು ಮೊಳವನ್ನು ಸೇರಿಸಬಲ್ಲನು?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ತನ್ನ ಎತ್ತರಕ್ಕೆ ಒಂದು ಮೊಳವನ್ನು.” ಇಲ್ಲಿ ಬಳಸಿರುವ ಗ್ರೀಕ್ ಪದಕ್ಕೆ “ಆಯುಷ್ಯ” ಅಥವಾ “ಎತ್ತರ” ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: ನಿಮ್ಮಲ್ಲಿ ಯಾರು
  rationale: τίς ... ἐξ ὑμῶν ಎಂಬುದು ‘ನಿಮ್ಮಲ್ಲಿ ಯಾರು’ ಎಂಬ ಸಹಜ ಪ್ರಶ್ನಾರ್ಥಕ ನುಡಿಗಟ್ಟು. δέ ಇಲ್ಲಿ ಸೌಮ್ಯವಾದ ಸಂಪರ್ಕಕವಾಗಿದ್ದು, ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದಿದ್ದರೂ ಹಿಂದಿನ ಮಾತಿನ ಮುಂದುವರಿಕೆ ಸಹಜವಾಗಿ ಉಳಿಯುತ್ತದೆ.
- source_word: μεριμνῶν
  choice: ಚಿಂತಿಸುವುದರಿಂದ
  rationale: μεριμνάω ಇಲ್ಲಿ ಆತಂಕಪಡುವುದು ಅಥವಾ ಚಿಂತಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕೃದಂತವು ಸಾಧನ/ಮಾರ್ಗದ ಅರ್ಥ ಹೊಂದಿರುವುದರಿಂದ ‘ಚಿಂತಿಸುವುದರಿಂದ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: δύναται
  choice: ಸೇರಿಸಬಲ್ಲನು
  rationale: δύναμαι ಸಾಮರ್ಥ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ‘ಬಲ್ಲನು’ ಪ್ರಶ್ನೆಯಲ್ಲಿರುವ ಅಸಾಮರ್ಥ್ಯದ ಒತ್ತನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: προσθεῖναι
  choice: ಸೇರಿಸು
  rationale: προστίθημι ಪದದ ಮೂಲಭೂತವಾದ ‘ಸೇರಿಸು/ಹೆಚ್ಚಿಸು’ ಎಂಬ ಚಿತ್ರವನ್ನು ‘ಸೇರಿಸು’ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: ತನ್ನ ಆಯುಷ್ಯಕ್ಕೆ
  rationale: ἡλικίαಗೆ ‘ವಯಸ್ಸು/ಆಯುಷ್ಯ’ ಮತ್ತು ‘ಎತ್ತರ’ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳಿವೆ. ಚಿಂತೆ ಮತ್ತು ಜೀವದ ಕುರಿತ ಸಂದರ್ಭಕ್ಕೆ ‘ಆಯುಷ್ಯ’ ಚೆನ್ನಾಗಿ ಹೊಂದುತ್ತದೆ; αὐτοῦನ ಸ್ವಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ತನ್ನ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πῆχυν ἕνα
  choice: ಒಂದು ಮೊಳ
  rationale: πῆχυς ಒಂದು ಪ್ರಾಚೀನ ಉದ್ದದ ಅಳತೆ. ‘ಮೊಳ’ ಆ ನಿಖರವಾದ ಅಳತೆಯ ಚಿತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ; ಆಧುನಿಕ ಅಳತೆಗೆ ಪರಿವರ್ತಿಸುವುದು ರೂಪಕವನ್ನು ಅತಿಯಾಗಿ ವಿವರಿಸಿದಂತಾಗುತ್ತದೆ.
theological_decisions:
- issue: ἡλικία ಪದದ ಅರ್ಥ
  choice: ಆಯುಷ್ಯ
  alternative: ಎತ್ತರ
  rationale: ದೇವರ ಜೀವಪೋಷಣೆ ಮತ್ತು ಚಿಂತೆಯ ನಿಷ್ಫಲತೆಯ ವಿಶಾಲ ಸಂದರ್ಭಕ್ಕೆ ‘ಆಯುಷ್ಯ’ ಸೂಕ್ತವಾಗಿದೆ. ಆದರೂ ‘ಎತ್ತರ’ ಎಂಬ ಅರ್ಥವೂ ಗ್ರೀಕ್ ಪದಕ್ಕೆ ನಿಜವಾಗಿಯೂ ಸಾಧ್ಯವಾದುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ; ಹೀಗೆ ಮೂಲದ ಅರ್ಥಸಂದಿಗ್ಧತೆಯನ್ನು ಮರೆಮಾಡಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಪ್ರಶ್ನಾರ್ಥಕ ವಾಕ್ಯ. ‘ಮೊಳ’ ಎಂಬ ಸಾಂಪ್ರದಾಯಿಕ ಅಳತೆಯನ್ನು ಉಳಿಸಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಹಿಸಬಹುದಾದ ನುಡಿಯನ್ನು ಬಳಸಲಾಗಿದೆ.
