  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: kn
  text: ಆದರೆ ನೀನು ಉಪವಾಸ ಮಾಡುವಾಗ, ನಿನ್ನ ತಲೆಗೆ ಎಣ್ಣೆ ಹಚ್ಚಿಕೋ[a] ಮತ್ತು ನಿನ್ನ ಮುಖವನ್ನು ತೊಳೆದುಕೋ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿನ್ನ ತಲೆಗೆ ಎಣ್ಣೆ ಹಚ್ಚು.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸಾಮಾನ್ಯ ದೇಹಪಾಲನೆಯ ಭಾಗವಾಗಿ ಎಣ್ಣೆ ಹಚ್ಚುವುದನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಂದರೆ, ನೀನು ಉಪವಾಸ ಮಾಡುತ್ತಿರುವುದು ಇತರರಿಗೆ ಎದ್ದು ಕಾಣದಂತೆ ನಿನ್ನ ಸಹಜ ಹೊರತೋರಿಕೆಯನ್ನು ಕಾಪಾಡಿಕೋ.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: ಆದರೆ ನೀನು
  rationale: ಒತ್ತಿಹೇಳಲಾದ ಸರ್ವನಾಮ ಮತ್ತು δέ ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಕಪಟಿಗಳ ವರ್ತನೆಗೆ ವಿರುದ್ಧವಾಗಿ ಶಿಷ್ಯನನ್ನು ನೇರವಾಗಿ ಉದ್ದೇಶಿಸುತ್ತವೆ.
- source_word: νηστεύων
  choice: ಉಪವಾಸ ಮಾಡುವಾಗ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ಕಾಲಸೂಚಕ ಉಪವಾಕ್ಯವಾಗಿ ನೀಡುವುದು ಸಹಜ ಕನ್ನಡವಾಗಿದ್ದು ಸೂಚನೆಯ ಸಂದರ್ಭಕ್ಕೂ ಹೊಂದುತ್ತದೆ.
- source_word: ἄλειψαί
  choice: ಎಣ್ಣೆ ಹಚ್ಚಿಕೊಂಡು
  rationale: ಇಲ್ಲಿ ἀλείφω ಸಾಮಾನ್ಯ ಅಲಂಕಾರ ಅಥವಾ ದೇಹಪಾಲನೆಯ ಅಂಗವಾಗಿ ತಲೆಗೆ ಎಣ್ಣೆ ಹಚ್ಚುವುದನ್ನು ಸೂಚಿಸಬಲ್ಲದು; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಇದು ‘ಅಭಿಷೇಕ ಮಾಡು’ಗಿಂತ ಸಹಜವೂ ಸಂದರ್ಭಸ್ಪಷ್ಟವೂ ಆಗಿದೆ.
- source_word: τὴν κεφαλήν
  choice: ನಿನ್ನ ತಲೆಗೆ
  rationale: κεφαλή ಪದದ ನೇರ ಅರ್ಥ ‘ತಲೆ’; ಎಣ್ಣೆ ಹಚ್ಚುವ ಕ್ರಿಯೆಗೆ ಅನುಗುಣವಾಗಿ ದತ್ತಿವಿಭಕ್ತಿಯ ಸಹಜ ಕನ್ನಡ ರೂಪ ಬಳಸಲಾಗಿದೆ.
- source_word: καὶ
  choice: -ಕೊಂಡು
  rationale: ಎರಡು ಆಜ್ಞೆಗಳನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಕ್ರಮಬದ್ಧವಾಗಿ ಜೋಡಿಸುತ್ತದೆ; ಅಂತಿಮ ಆಜ್ಞೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ πρόσωπόν σου
  choice: ಮುಖವನ್ನು
  rationale: πρόσωπον ಇಲ್ಲಿ ಕಾಣುವ ಮುಖವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮುಖ’ ಸರಳ ಮತ್ತು ಆಧುನಿಕ ಕನ್ನಡ ಪದ.
- source_word: νίψαι
  choice: ತೊಳೆದುಕೋ
  rationale: νίπτω ದೇಹದ ಒಂದು ಭಾಗವನ್ನು ತೊಳೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆತ್ಮಾರ್ಥಕ ಕನ್ನಡ ಆಜ್ಞಾರೂಪವು ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ಉಪವಾಸದ ಸಮಯದ ಹೊರತೋರಿಕೆಯ ಕುರಿತು ಸೂಚನೆಯ ಸ್ವರೂಪ
  choice: ಉಪವಾಸವು ಇತರರಿಗೆ ಎದ್ದು ಕಾಣದಂತೆ ಸಾಮಾನ್ಯ ದೇಹಪಾಲನೆ ಮತ್ತು ಸಹಜ ಹೊರತೋರಿಕೆಯನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳುವ ಸೂಚನೆ
  alternative: ಇದು ವಿಧಿವತ್ತಾದ ಅಭಿಷೇಕದ ಆಜ್ಞೆ; ಅಥವಾ ಸಾರ್ವಜನಿಕ ಉಪವಾಸವನ್ನೇ ನಿಷೇಧಿಸುತ್ತದೆ
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭವು ಮುಖವನ್ನು ವಿಕಾರಗೊಳಿಸುವ ಕಪಟಿಗಳ ವರ್ತನೆಗೆ ಸಾಮಾನ್ಯ ದೇಹಪಾಲನೆಯನ್ನು ವಿರುದ್ಧವಾಗಿ ಇಡುತ್ತದೆ. ವಚನವು ಉಪವಾಸವನ್ನು ನಿಷೇಧಿಸುವುದಿಲ್ಲ; ಎಣ್ಣೆ ಹಚ್ಚುವುದನ್ನು ಕಡ್ಡಾಯ ಧಾರ್ಮಿಕ ವಿಧಿಯೆಂದೂ ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸರಳ, ಗೌರವಯುತ ಏಕವಚನ ಸಂಬೋಧನೆ ಬಳಸಲಾಗಿದೆ. ‘ಅಭಿಷೇಕ ಮಾಡು’ ಎಂಬ ಧಾರ್ಮಿಕವಾಗಿ ಭಾರಿತ ಪದದ ಬದಲು ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾದ ‘ಎಣ್ಣೆ ಹಚ್ಚಿಕೊಂಡು’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಶಬ್ದಾರ್ಥದ ಪರ್ಯಾಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
