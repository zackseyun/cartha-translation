review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrastive address, the temporal participle ('when you fast'), and the ordinary-grooming sense of ἀλείφω. However, its '-ಕೊಂಡು ... ತೊಳೆದುಕೋ' construction subordinates the first Greek imperative to the second, whereas the Greek coordinates two imperatives. Rendering both as coordinated imperatives better preserves the source syntax and force.
  naturalness: The wording is generally clear modern Kannada. Using two parallel imperatives is more balanced and idiomatic than the current serial construction. 'ನಿನ್ನ ಮುಖವನ್ನು' also makes explicit the possessive present in the Greek without sounding unnatural.
  terminology: ‘ಎಣ್ಣೆ ಹಚ್ಚಿಕೋ’ appropriately communicates ordinary application of oil and avoids the unnecessarily ritualized sense that ‘ಅಭಿಷೇಕ ಮಾಡು’ can carry. ‘ಉಪವಾಸ,’ ‘ತಲೆ,’ and ‘ಮುಖ’ are suitable standard terms. The existing notes appropriately explain the grooming sense and contextual purpose.
  issues:
  - severity: low
    issue: The first imperative is made a dependent participial action in ‘ಎಣ್ಣೆ ಹಚ್ಚಿಕೊಂಡು ... ತೊಳೆದುಕೋ.’
    rationale: ἄλειψαι and νίψαι are coordinated aorist middle imperatives. Kannada can preserve this naturally with ‘ಹಚ್ಚಿಕೋ ಮತ್ತು ... ತೊಳೆದುಕೋ.’
  - severity: low
    issue: The possessive for ‘face’ is omitted in the main text.
    rationale: Kannada can infer possession, so this is not a mistranslation; nevertheless, retaining ‘ನಿನ್ನ ಮುಖವನ್ನು’ reflects πρόσωπόν σου and produces a clear parallel with ‘ನಿನ್ನ ತಲೆಗೆ.’
