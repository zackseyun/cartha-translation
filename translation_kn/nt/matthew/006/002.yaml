id: MAT.6.2
reference: Matthew 6:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: kn
  text: 'ಆದ್ದರಿಂದ, ನೀವು ದಾನಧರ್ಮ ಮಾಡುವಾಗ[a], ಕಪಟಿಗಳು ಸಭಾಮಂದಿರಗಳಲ್ಲಿಯೂ ಬೀದಿಗಳಲ್ಲಿಯೂ ಜನರಿಂದ ಹೊಗಳಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಮಾಡುವಂತೆ, ನಿಮ್ಮ ಮುಂದೆ ತುತ್ತೂರಿ ಊದಿಸಬೇಡಿ[b]. ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ಣವಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅಗತ್ಯದಲ್ಲಿರುವವರಿಗೆ ಕೊಡುವಾಗ’ ಅಥವಾ ‘ಕರುಣೆಯ ಕಾರ್ಯಗಳನ್ನು ಮಾಡುವಾಗ.’ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಬಡವರಿಗೆ ಅಥವಾ ಅಗತ್ಯದಲ್ಲಿರುವವರಿಗೆ ದಾನ ನೀಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, ‘ನಿಮ್ಮ ಮುಂದೆ ತುತ್ತೂರಿ ಊದಬೇಡಿ.’ ಇದು ಅತಿಶಯೋಕ್ತಿ ಅಥವಾ ರೂಪಕವಾಗಿರಬಹುದು; ಆದರೆ ಮೂಲ ಗ್ರೀಕ್ ಪಠ್ಯವು ತುತ್ತೂರಿ ಊದುವ ಚಿತ್ರಣವನ್ನೇ ಬಳಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: c
    text: ‘ಪೂರ್ಣವಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ’ ಎಂಬುದು ವಾಣಿಜ್ಯ ವ್ಯವಹಾರದ ನುಡಿಗಟ್ಟು; ಅವರಿಗೆ ಸಿಗಬೇಕಾದ ಪ್ರತಿಫಲವೆಲ್ಲ ಈಗಾಗಲೇ ಸಿಕ್ಕಿದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಕೊಡುತ್ತದೆ.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: ಆದ್ದರಿಂದ, ನೀವು ... ಮಾಡುವಾಗ
  rationale: οὖν ಹಿಂದಿನ ಬೋಧನೆಯೊಂದಿಗಿನ ತಾರ್ಕಿಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ὅταν ಸಾಮಾನ್ಯವಾಗಿ ಮರುಕಳಿಸಬಹುದಾದ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮಾಡುವಾಗ’ ಇದನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ποιῇς ἐλεημοσύνην
  choice: ದಾನಧರ್ಮ ಮಾಡುವಾಗ
  rationale: ಈ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಅಗತ್ಯದಲ್ಲಿರುವವರಿಗೆ ಕರುಣೆಯಿಂದ ನೆರವು ಅಥವಾ ದಾನ ನೀಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದಾನಧರ್ಮ’ ಆ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: ನಿಮ್ಮ ಮುಂದೆ ತುತ್ತೂರಿ ಊದಿಸಬೇಡಿ
  rationale: ಮೂಲದಲ್ಲಿರುವ ತುತ್ತೂರಿಯ ಸ್ಪಷ್ಟ ಹಾಗೂ ಬಹುಶಃ ಅತಿಶಯೋಕ್ತಿಯ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಿಯೇ ಊದುವುದಕ್ಕಿಂತ ತನ್ನ ಮುಂದೆ ಊದಿಸುವ ಸಾರ್ವಜನಿಕ ಪ್ರದರ್ಶನದ ಅರ್ಥವನ್ನು ‘ಊದಿಸಬೇಡಿ’ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ὑποκριταὶ
  choice: ಕಪಟಿಗಳು
  rationale: ಹೊರಗೆ ಭಕ್ತಿಯನ್ನು ಪ್ರದರ್ಶಿಸಿ ಒಳಗಿನ ಉದ್ದೇಶ ಬೇರೆ ಇರುವವರನ್ನು ಸೂಚಿಸುವ ಸ್ಥಾಪಿತ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: συναγωγαῖς
  choice: ಸಭಾಮಂದಿರಗಳು
  rationale: ಯೆಹೂದ್ಯರ ಧಾರ್ಮಿಕ ಸಭಾಸ್ಥಳಗಳನ್ನು ಸೂಚಿಸುವ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಗೆ ಹೊಂದುವ ಪದ.
- source_word: ῥύμαις
  choice: ಬೀದಿಗಳು
  rationale: ಜನರು ಕಾಣಬಹುದಾದ ಸಾರ್ವಜನಿಕ ಬೀದಿ ಅಥವಾ ಓಣಿಗಳನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಸಾಮಾನ್ಯ ಪದ.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: ಜನರಿಂದ ಹೊಗಳಿಸಿಕೊಳ್ಳಬೇಕೆಂದು
  rationale: δοξάζω ಇಲ್ಲಿ ಸಾರ್ವಜನಿಕ ಮೆಚ್ಚುಗೆ ಅಥವಾ ಗೌರವ ಪಡೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮಹಿಮೆಪಡಿಸಿಕೊಳ್ಳಲು’ ಎಂಬ ಅಕ್ಷರಶಃ ರೂಪಕ್ಕಿಂತ ‘ಹೊಗಳಿಸಿಕೊಳ್ಳಬೇಕೆಂದು’ ಸಂದರ್ಭದ ಉದ್ದೇಶವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ
  rationale: ಯೇಸುವಿನ ಗಂಭೀರ ಮತ್ತು ಅಧಿಕಾರಪೂರ್ಣ ಘೋಷಣಾ ಸೂತ್ರದ ಬಲವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ಅವರು ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ಣವಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ
  rationale: ἀπέχουσιν ಎಂಬ ವಾಣಿಜ್ಯ ನುಡಿಗಟ್ಟಿನ ‘ಪೂರ್ತಿಯಾಗಿ ಸ್ವೀಕರಿಸಿದ್ದಾರೆ; ಇನ್ನೇನೂ ಬಾಕಿಯಿಲ್ಲ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: δοξασθῶσιν ಪದದ ಬಲ
  choice: ಹೊಗಳಿಸಿಕೊಳ್ಳಬೇಕೆಂದು
  alternative: ಜನರಿಂದ ಮಹಿಮೆಪಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು / ಗೌರವಿಸಿಕೊಳ್ಳಬೇಕೆಂದು
  rationale: ಪದಕ್ಕೆ ‘ಮಹಿಮೆಪಡಿಸು’ ಎಂಬ ಬಲವಾದ ಅರ್ಥವಿದ್ದರೂ, ಈ ಸಂದರ್ಭದಲ್ಲಿ ಮಾನವರ ಸಾರ್ವಜನಿಕ ಪ್ರಶಂಸೆಯೇ ಉದ್ದೇಶ. ಕನ್ನಡದಲ್ಲಿ ‘ಹೊಗಳಿಸಿಕೊಳ್ಳು’ ಆ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಅತಿಯಾದ ಧಾರ್ಮಿಕ ಭಾರವಿಲ್ಲದೆ ನೀಡುತ್ತದೆ.
- issue: ἀπέχουσιν ಎಂಬ ಪೂರ್ಣ ಪಾವತಿಯ ನುಡಿಗಟ್ಟು
  choice: ಪ್ರತಿಫಲವನ್ನು ಪೂರ್ಣವಾಗಿ ಪಡೆದುಕೊಂಡಿದ್ದಾರೆ
  alternative: ತಮ್ಮ ಪ್ರತಿಫಲವನ್ನು ಹೊಂದಿದ್ದಾರೆ
  rationale: ಅವರು ಮಾನವ ಪ್ರಶಂಸೆಯನ್ನೇ ಸಂಪೂರ್ಣ ಪ್ರತಿಫಲವಾಗಿ ಈಗಾಗಲೇ ಪಡೆದಿದ್ದಾರೆ ಮತ್ತು ಮತ್ತೊಂದು ಪ್ರತಿಫಲ ಬಾಕಿಯಿಲ್ಲ ಎಂಬ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ದೇವರ ತೀರ್ಪಿನ ಸ್ವರೂಪದ ಕುರಿತು ಹೆಚ್ಚುವರಿ ವಿವರಣೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- issue: ἀνθρώπων ಪದದ ಸಾಮಾನ್ಯ ಮಾನವ ಸೂಚನೆ
  choice: ಜನರಿಂದ
  alternative: ಮನುಷ್ಯರಿಂದ
  rationale: ಇಲ್ಲಿ ಲಿಂಗವಿಶೇಷವಿಲ್ಲದೆ ನೋಡುವ ಜನರೆಲ್ಲರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಜನರಿಂದ’ ಮೂಲದ ಸಾಮಾನ್ಯ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜವಾಗಿ ಕಾಪಾಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ ಬಹುವಚನ ಸಂಬೋಧನೆ ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿಡುತ್ತಾ ತುತ್ತೂರಿಯ ಮೂಲ ಚಿತ್ರಣ ಮತ್ತು ಪ್ರತಿಫಲ ಪೂರ್ಣವಾಗಿ ದೊರೆತಿದೆ ಎಂಬ ವಾಣಿಜ್ಯ ನುಡಿಗಟ್ಟನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಸಭಾಮಂದಿರ’ ಯೆಹೂದ್ಯರ ಸಭಾಸ್ಥಳಕ್ಕೆ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದವಾಗಿ ಬಳಸಲಾಗಿದೆ.
