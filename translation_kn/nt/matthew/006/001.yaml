id: MAT.6.1
reference: Matthew 6:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: kn
  text: ಆದರೆ ಜನರಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳುವ ಉದ್ದೇಶದಿಂದ ಅವರ ಮುಂದೆ ನಿಮ್ಮ ನೀತಿಯ ಕಾರ್ಯಗಳನ್ನು ಮಾಡದಂತೆ ಎಚ್ಚರವಾಗಿರಿ.[a] ಇಲ್ಲವಾದರೆ, ಪರಲೋಕಗಳಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆಯಿಂದ ನಿಮಗೆ ಯಾವುದೇ ಪ್ರತಿಫಲ ದೊರೆಯುವುದಿಲ್ಲ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಿಮ್ಮ ನೀತಿಯನ್ನು.” ಒಂದು ಪಾಠಾಂತರದಲ್ಲಿ “ನಿಮ್ಮ ದಾನಧರ್ಮವನ್ನು” ಎಂದಿದೆ.
    reason: ಮೂಲಪದದ ವಿಶಾಲ ಅರ್ಥವನ್ನೂ ತಿಳಿದಿರುವ ಪಾಠಾಂತರವನ್ನೂ ಉಳಿಸುವುದು.
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ “ಪರಲೋಕಗಳಲ್ಲಿ”; ಅನೇಕ ಭಾಷಾಂತರಗಳು ಏಕವಚನವಾಗಿ “ಪರಲೋಕದಲ್ಲಿ” ಎಂದು ಕೊಡುತ್ತವೆ.
    reason: ಮೂಲಭಾಷೆಯ ಬಹುವಚನ ರೂಪ ಮತ್ತು ಸಹಜ ಪರ್ಯಾಯವನ್ನು ಸೂಚಿಸುವುದು.
lexical_decisions:
- source_word: Προσέχετε
  choice: ಎಚ್ಚರವಾಗಿರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಬಹುವಚನ ಆಜ್ಞೆಯು ನಿರಂತರ ಜಾಗರೂಕತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಆಯ್ಕೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಎಚ್ಚರಿಕೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಬೋಧನೆಯಿಂದ ಎಚ್ಚರಿಕೆಯ ಕಡೆಗೆ ಸಾಗುವ ವಿರೋಧಾತ್ಮಕ ತಿರುವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: δικαιοσύνην
  choice: ನಿಮ್ಮ ನೀತಿಯ ಕಾರ್ಯಗಳನ್ನು
  rationale: ಮೂಲಪಾಠದಲ್ಲಿರುವ ‘ನೀತಿ’ಯ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡೇ, ποιεῖν ಜೊತೆಗಿನ ಸಹಜ ಕನ್ನಡ ಪ್ರಯೋಗಕ್ಕಾಗಿ ‘ಕಾರ್ಯಗಳನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ; ಇದನ್ನು ಕೇವಲ ದಾನಧರ್ಮಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸಲಾಗಿಲ್ಲ.
- source_word: μὴ ποιεῖν
  choice: ಮಾಡದಂತೆ
  rationale: μή ಜೊತೆಗಿನ infinitive ತಪ್ಪಿಸಬೇಕಾದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಈ ಎಚ್ಚರಿಕೆಯ ರಚನೆ ಸಹಜವಾಗಿದೆ.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: ಜನರ ಮುಂದೆ
  rationale: ἀνθρώπων ಇಲ್ಲಿ ಗಂಡಸರಿಗಷ್ಟೇ ಅಲ್ಲದೆ ಸಾಮಾನ್ಯವಾಗಿ ಮನುಷ್ಯ ವೀಕ್ಷಕರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: ಜನರು ನೋಡಬೇಕೆಂಬ ಉದ್ದೇಶದಿಂದ
  rationale: ಈ ರಚನೆಯ ಉದ್ದೇಶಾರ್ಥವನ್ನೂ ಸಾರ್ವಜನಿಕವಾಗಿ ಕಾಣಿಸಿಕೊಳ್ಳುವ ಉದ್ದೇಶವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰ δὲ μή γε
  choice: ಇಲ್ಲವಾದರೆ
  rationale: ಷರತ್ತಿನ ಎಚ್ಚರಿಕೆಯನ್ನು ಸಹಜ ಹಾಗೂ ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μισθὸν
  choice: ಪ್ರತಿಫಲ
  rationale: ದೇವರಿಂದ ದೊರೆಯುವ ಪ್ರತಿದಾನದ ಅರ್ಥಕ್ಕೆ ‘ಪ್ರತಿಫಲ’ ಸಹಜವಾಗಿದ್ದು, ಕೂಲಿ ಎಂಬ ಸಂಕುಚಿತ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: ನಿಮ್ಮ ತಂದೆಯಿಂದ
  rationale: ಪ್ರತಿಫಲದ ಮೂಲವನ್ನು ಸೂಚಿಸುವ παρά ದತ್ತಿವ್‌ನ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: ಪರಲೋಕಗಳಲ್ಲಿರುವ
  rationale: ಗ್ರೀಕ್ ಮೂಲದ ಬಹುವಚನ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥವಾಗುವ ಗೌರವಯುತ ರೂಪವಾಗಿದೆ.
theological_decisions:
- issue: δικαιοσύνην ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ‘ನೀತಿ’ಯ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಹೊಂದಿರುವ ‘ನೀತಿಯ ಕಾರ್ಯಗಳು’
  alternative: ದಾನಧರ್ಮ; ನೀತಿ
  rationale: SBLGNT ಪಾಠವು δικαιοσύνην ಎಂದು ಓದುತ್ತದೆ; ಆದ್ದರಿಂದ ಮುಖ್ಯಪಾಠವು ಇದನ್ನು ದಾನಧರ್ಮಕ್ಕೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ. ಕನ್ನಡದಲ್ಲಿ ‘ನೀತಿಯನ್ನು ಮಾಡುವುದು’ ಅಸಹಜವಾದುದರಿಂದ ‘ನೀತಿಯ ಕಾರ್ಯಗಳು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಪಾಠಾಂತರವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ἀνθρώπων ಪದದ ಸಾಮಾನ್ಯ ಉಲ್ಲೇಖ
  choice: ಜನರು
  alternative: ಮನುಷ್ಯರು; ಪುರುಷರು
  rationale: ಇಲ್ಲಿ ಉದ್ದೇಶವು ಮಾನವ ವೀಕ್ಷಕರನ್ನೆಲ್ಲ ಒಳಗೊಳ್ಳುತ್ತದೆ; ಗಂಡಸರಿಗಷ್ಟೇ ಸೀಮಿತವಲ್ಲ.
- issue: τοῖς οὐρανοῖς ಬಹುವಚನ
  choice: ಪರಲೋಕಗಳಲ್ಲಿ
  alternative: ಪರಲೋಕದಲ್ಲಿ
  rationale: ಮತ್ತಾಯನ ಗ್ರೀಕ್ ಪದಪ್ರಯೋಗದ ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ಅದರಿಂದ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ನಿರ್ಣಯಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ‘ನೀತಿಯ ಕಾರ್ಯಗಳು’ ಎಂಬುದು ಮೂಲದ ವಿಶಾಲತೆಯನ್ನೂ ಕನ್ನಡದ ಸಹಜತೆಯನ್ನೂ ಸಮತೋಲಗೊಳಿಸುತ್ತದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯಪಾಠದಲ್ಲಿ ಸೇರಿವೆ.
