review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the warning, the prohibited public-facing purpose, the loss of divine reward, and the plural form in ‘the heavens.’ However, ‘ಜನರು ನೋಡಬೇಕೆಂಬ’ can mean ‘because people want/need to see,’ rather than clearly expressing the intended passive purpose, ‘to be seen by people.’
  naturalness: The register is modern and generally fluent. Recasting the purpose clause as ‘ಜನರಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳುವ ಉದ್ದೇಶದಿಂದ’ is both idiomatic and unambiguous in Kannada.
  terminology: ‘ನೀತಿಯ ಕಾರ್ಯಗಳನ್ನು’ is an acceptable contextual rendering of δικαιοσύνην with ποιεῖν and does not reduce it to almsgiving. ‘ಪ್ರತಿಫಲ’ and ‘ಪರಲೋಕಗಳಲ್ಲಿರುವ’ appropriately retain the intended recompense and the source plural, with the latter explained in a note.
