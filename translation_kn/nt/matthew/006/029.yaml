id: MAT.6.29
reference: Matthew 6:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: kn
  text: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಸೊಲೊಮೋನನು ತನ್ನ ಸಕಲ ವೈಭವದಲ್ಲಿಯೂ ಇವುಗಳಲ್ಲಿ ಒಂದರಂತೆ ಕೂಡ ಉಡುಪನ್ನು ಧರಿಸಿರಲಿಲ್ಲ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ತನ್ನ ಸಕಲ ಮಹಿಮೆಯಲ್ಲಿಯೂ.’
    reason: δόξα ಇಲ್ಲಿ ರಾಜಸಿಕ ವೈಭವ ಅಥವಾ ಭವ್ಯತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮಹಿಮೆ’ ಶಾಬ್ದಿಕವಾಗಿ ಸಾಧ್ಯವಾದ ಪರ್ಯಾಯವಾಗಿದೆ.
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: λέγω ಮತ್ತು ὑμῖν ಅನ್ನು ಸಹಜವಾಗಿ ‘ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ’ ಎಂಬ ಅರ್ಥದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; δέ ಹಿಂದಿನ ಮಾತಿಗೆ ಸೌಮ್ಯವಾದ ವೈರುಧ್ಯವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: οὐδὲ
  choice: ಒಂದರಂತೆಯೂ ... ಧರಿಸಿರಲಿಲ್ಲ
  rationale: οὐδέಯ ‘ಸಹ ಅಲ್ಲ/ಕೂಡ ಅಲ್ಲ’ ಎಂಬ ಒತ್ತನ್ನು ಕನ್ನಡದ ಹೋಲಿಕೆ ಮತ್ತು ನಿರಾಕರಣೆಯ ಸಹಜ ವಿನ್ಯಾಸದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Σολομὼν
  choice: ಸೊಲೊಮೋನನು
  rationale: ಕನ್ನಡ ಸತ್ಯವೇದ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ವ್ಯಕ್ತಿನಾಮದ ರೂಪವನ್ನು ಅನುಸರಿಸಲಾಗಿದೆ.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: ತನ್ನ ಸಕಲ ವೈಭವದಲ್ಲಿಯೂ
  rationale: ಇಲ್ಲಿ δόξα ದೈವಿಕ ಮಹಿಮೆಯ ಬದಲು ಅರಸನ ಭವ್ಯತೆ ಮತ್ತು ಔಜ್ವಲ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ವೈಭವ’ ಆ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: περιεβάλετο
  choice: ಉಡುಪನ್ನು ಧರಿಸಿರಲಿಲ್ಲ
  rationale: ಮಧ್ಯ/ಕರ್ಮಣಿ ರೂಪವು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಉಡುಪಿನಿಂದ ಅಲಂಕರಿಸಲ್ಪಟ್ಟಿರುವ ಅಥವಾ ಉಡುಪು ಧರಿಸಿರುವ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಉಡುಪನ್ನು ಧರಿಸು’ dignified ಮತ್ತು ಸಹಜವಾಗಿದೆ.
- source_word: ὡς ἓν τούτων
  choice: ಇವುಗಳಲ್ಲಿ ಒಂದರಂತೆ
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಹೂಗಳಲ್ಲಿ ಒಂದನ್ನು ಸೂಚಿಸುವ ಏಕವಚನ ಹೋಲಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಸೊಲೊಮೋನನಿಗೆ ಸಂಬಂಧಿಸಿದ δόξα ಪದದ ಸ್ವರೂಪ
  choice: ‘ವೈಭವ’ ಎಂದು ಅನುವಾದಿಸಿ, ರಾಜಸಿಕ ಭವ್ಯತೆಯ ಅರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
  alternative: ‘ಮಹಿಮೆ’
  rationale: ಸಂದರ್ಭವು ದೇವರ ದೈವಿಕ ಮಹಿಮೆಯ ಬಗ್ಗೆ ಅಲ್ಲ, ಸೊಲೊಮೋನನ ರಾಜಸಿಕ ಔಜ್ವಲ್ಯ ಮತ್ತು ಹೂಗಳ ಅಲಂಕಾರದ ನಡುವಿನ ಹೋಲಿಕೆಯ ಬಗ್ಗೆ. ‘ವೈಭವ’ ಅನಗತ್ಯವಾದ ದೈವಿಕ ಅರ್ಥಛಾಯೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಸಕಲ ವೈಭವ’ ಎಂಬುದು ರಾಜಸಿಕ ಔಜ್ವಲ್ಯವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; [a] ಗುರುತು ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
