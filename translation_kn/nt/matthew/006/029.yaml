revisions:
- from: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಸೊಲೊಮೋನನು ತನ್ನ ಸಕಲ ವೈಭವದಲ್ಲಿಯೂ ಇವುಗಳಲ್ಲಿ ಒಂದರಂತೆಯೂ ಉಡುಪನ್ನು ಧರಿಸಿರಲಿಲ್ಲ.[a]
  to: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಸೊಲೊಮೋನನು ತನ್ನ ಸಕಲ ವೈಭವದಲ್ಲಿಯೂ ಇವುಗಳಲ್ಲಿ ಒಂದರಂತೆ ಕೂಡ ಉಡುಪನ್ನು ಧರಿಸಿರಲಿಲ್ಲ.[a]
  rationale: A small idiomatic revision moves the additive emphasis required by οὐδέ into the natural Kannada form ‘ಒಂದರಂತೆ ಕೂಡ ... ಇರಲಿಲ್ಲ.’ The wording otherwise preserves the Greek’s singular comparison, Solomon’s comprehensive royal splendor, and the clothing imagery. The footnote remains anchored and supplies the valid lexical alternative for δόξα.
