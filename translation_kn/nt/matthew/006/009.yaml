id: MAT.6.9
reference: Matthew 6:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: kn
  text: 'ಆದ್ದರಿಂದ ನೀವು ಹೀಗೆ ಪ್ರಾರ್ಥಿಸಿರಿ: “ಆಕಾಶಗಳಲ್ಲಿ ಇರುವ ನಮ್ಮ ತಂದೆಯೇ, ನಿಮ್ಮ ಹೆಸರು ಪವಿತ್ರವೆಂದು ಗೌರವಿಸಲ್ಪಡಲಿ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως
  choice: ಹೀಗೆ
  rationale: ಪ್ರಾರ್ಥನೆಯ ಮಾದರಿ ಅಥವಾ ವಿಧಾನವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಸ್ಪಷ್ಟವೂ ಆಗಿದೆ.
- source_word: οὖν
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಬೋಧನೆಯಿಂದ ಬರುವ ನಿರ್ಣಯಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: προσεύχεσθε ὑμεῖς
  choice: ನೀವು ... ಪ್ರಾರ್ಥಿಸಿರಿ
  rationale: ಬಹುವಚನ ಆಜ್ಞಾರ್ಥವನ್ನೂ, ಸ್ಪಷ್ಟ ಸರ್ವನಾಮ ὑμεῖς ನೀಡುವ ಒತ್ತನ್ನೂ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Πάτερ ἡμῶν
  choice: ನಮ್ಮ ತಂದೆಯೇ
  rationale: ನೇರ ಸಂಬೋಧನೆಯನ್ನೂ ಸಮುದಾಯಸೂಚಕ ಬಹುವಚನ ಸ್ವಾಮ್ಯವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: ಪರಲೋಕಗಳಲ್ಲಿ ಇರುವ
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನ ‘ಆಕಾಶಗಳು/ಪರಲೋಕಗಳು’ ಎಂಬ ರೂಪವನ್ನು ಉಳಿಸುತ್ತಾ, ದೇವರ ನಿವಾಸವನ್ನು ಸೂಚಿಸುವ ಕನ್ನಡದ ಗೌರವಯುತ ಧಾರ್ಮಿಕ ಪದಪ್ರಯೋಗವನ್ನು ಬಳಸುತ್ತದೆ.
- source_word: ἁγιασθήτω
  choice: ಪವಿತ್ರವೆಂದು ಗೌರವಿಸಲ್ಪಡಲಿ
  rationale: ದೇವರ ಹೆಸರು ಪವಿತ್ರವೆಂದು ಮಾನ್ಯಮಾಡಲ್ಪಡಲಿ ಎಂಬ ಕರ್ಮಣಿ ಆಜ್ಞಾರ್ಥದ ಮನವಿ-ಭಾವವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸ ὄνομά σου
  choice: ನಿಮ್ಮ ಹೆಸರು
  rationale: ಮೂಲದ ‘ಹೆಸರು’ ಎಂಬ ಪದವನ್ನು ಉಳಿಸಿ, ದೇವರಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಗೌರವಸೂಚಕ ಸಂಬೋಧನೆಯನ್ನು ಬಳಸುತ್ತದೆ.
theological_decisions:
- issue: ದೈವಿಕ ಸಂಬೋಧನೆ ಮತ್ತು ಪರಾತ್ಪರತೆಯ ಅಭಿವ್ಯಕ್ತಿ
  choice: ಪರಲೋಕಗಳಲ್ಲಿ ಇರುವ ನಮ್ಮ ತಂದೆಯೇ
  alternative: ಪರಲೋಕದಲ್ಲಿರುವ ನಮ್ಮ ತಂದೆಯೇ
  rationale: τοῖς οὐρανοῖς ಮೂಲದಲ್ಲಿ ಬಹುವಚನವಾಗಿದೆ. ಆಯ್ದ ರೂಪವು ತಂದೆಯೆಂಬ ಆತ್ಮೀಯ ಸಂಬೋಧನೆಯನ್ನೂ ಪರಲೋಕಗಳಲ್ಲಿರುವವನೆಂಬ ಪರಾತ್ಪರತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- issue: ἁγιασθήτω ಪದದ ಸಮಕಾಲೀನ ಮತ್ತು ಧಾರ್ಮಿಕವಾಗಿ ಗಂಭೀರವಾದ ನಿರೂಪಣೆ
  choice: ನಿಮ್ಮ ಹೆಸರು ಪವಿತ್ರವೆಂದು ಗೌರವಿಸಲ್ಪಡಲಿ
  alternative: ನಿಮ್ಮ ಹೆಸರು ಪವಿತ್ರೀಕರಿಸಲ್ಪಡಲಿ
  rationale: ಈ ಮನವಿಯು ದೇವರ ಹೆಸರು ಈಗ ಅಪವಿತ್ರವಾಗಿದೆ ಎಂಬ ಅರ್ಥ ಕೊಡದೆ, ಅದು ಪವಿತ್ರವೆಂದು ಅಂಗೀಕರಿಸಿ ಗೌರವಿಸಲ್ಪಡಲಿ ಎಂಬ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ. ಪರ್ಯಾಯವು ಮೂಲದ ಕರ್ಮಣಿ ರೂಪಕ್ಕೆ ಹತ್ತಿರವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ತಪ್ಪು ಅರ್ಥ ಕೊಡಬಹುದಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಭಾ ವಾಚನಕ್ಕೂ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ದೇವರನ್ನು ಉದ್ದೇಶಿಸುವಾಗ ‘ನಿಮ್ಮ’ ಎಂಬ ಗೌರವಸೂಚಕ ರೂಪ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಬಹುವಚನವನ್ನು ಉಳಿಸಲು ‘ಪರಲೋಕಗಳಲ್ಲಿ’ ಬಳಸಲಾಗಿದೆ.
