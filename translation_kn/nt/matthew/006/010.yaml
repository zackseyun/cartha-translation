id: MAT.6.10
reference: Matthew 6:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: kn
  text: ನಿನ್ನ ರಾಜ್ಯವು ಬರಲಿ; ನಿನ್ನ ಚಿತ್ತವು ಪರಲೋಕದಲ್ಲಿ ನೆರವೇರುವಂತೆಯೇ ಭೂಮಿಯ ಮೇಲೆಯೂ ನೆರವೇರಲಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿನ್ನ ರಾಜ್ಯವು ಬರಲಿ; ನಿನ್ನ ಚಿತ್ತವು ನೆರವೇರಲಿ—ಪರಲೋಕದಲ್ಲಿ ಹೇಗೋ ಹಾಗೆಯೇ ಭೂಮಿಯ ಮೇಲೆಯೂ’ ಎಂದು ಓದಿ, ‘ಪರಲೋಕದಲ್ಲಿ ಹೇಗೋ ಹಾಗೆಯೇ ಭೂಮಿಯ ಮೇಲೆಯೂ’ ಎಂಬ ಮಾತು ಹಿಂದಿನ ಎರಡೂ ಬೇಡಿಕೆಗಳಿಗೆ ಅನ್ವಯಿಸುತ್ತದೆ ಎಂದು ಗ್ರಹಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: ಬರಲಿ
  rationale: ἔρχομαι ಕ್ರಿಯಾಪದದ ತೃತೀಯ ಪುರುಷ ಏಕವಚನ ಆಜ್ಞಾರ್ಥಕ ರೂಪವು ದೇವರಿಗೆ ಸಲ್ಲಿಸುವ ಪ್ರಾರ್ಥನಾತ್ಮಕ ಬೇಡಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಬರಲಿ’ ಸಹಜವಾಗಿ ಅದೇ ಭಾವವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: βασιλεία
  choice: ರಾಜ್ಯ
  rationale: βασιλεία ಎಂಬುದು ಆಳ್ವಿಕೆ ಅಥವಾ ರಾಜ್ಯವನ್ನು ಸೂಚಿಸಬಹುದು. ಮತ್ತಾಯನ ಸನ್ನಿವೇಶದಲ್ಲಿಯೂ ಪ್ರಾರ್ಥನೆಯ ಪರಿಚಿತ ಭಾಷೆಯಲ್ಲಿಯೂ ‘ರಾಜ್ಯ’ ಸಹಜವಾಗಿದ್ದು, ದೇವರ ರಾಜಾಧಿಪತ್ಯದ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
- source_word: γενηθήτω
  choice: ನೆರವೇರಲಿ
  rationale: γίνομαι ಕ್ರಿಯಾಪದದ ತೃತೀಯ ಪುರುಷ ಏಕವಚನ ಅಓರಿಸ್ಟ್ ಪ್ಯಾಸಿವ್ ಆಜ್ಞಾರ್ಥಕ ರೂಪ. θέλημα ಜೊತೆಗೆ ದೇವರ ಚಿತ್ತವು ಸಂಭವಿಸಲಿ ಅಥವಾ ಕಾರ್ಯರೂಪಕ್ಕೆ ಬರಲಿ ಎಂಬ ಅರ್ಥವಿದ್ದು, ‘ನೆರವೇರಲಿ’ ಅದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: θέλημα
  choice: ಚಿತ್ತ
  rationale: θέλημα ಎಂದರೆ ಒಬ್ಬನು ಬಯಸುವುದು, ಸಂಕಲ್ಪಿಸುವುದು ಅಥವಾ ಉದ್ದೇಶಿಸುವುದು. ದೇವರನ್ನು ಕುರಿತ ಈ ಪ್ರಾರ್ಥನಾ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಚಿತ್ತ’ ಅರ್ಥಭಾರವನ್ನು ಉಳಿಸುವ ಸಹಜ ಮತ್ತು ಗೌರವಪೂರ್ಣ ಪದ.
- source_word: ὡς
  choice: …ವಂತೆಯೇ
  rationale: ὡς ಹೋಲಿಕೆಯನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘…ವಂತೆಯೇ’ ಪರಲೋಕ ಮತ್ತು ಭೂಮಿಯ ನಡುವಿನ ಹೋಲಿಕೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ತೋರಿಸುತ್ತದೆ.
- source_word: ἐν οὐρανῷ
  choice: ಪರಲೋಕದಲ್ಲಿ
  rationale: ἐν ಜೊತೆಗಿನ ಏಕವಚನ οὐρανός ಇಲ್ಲಿ ದೇವರ ಸ್ವರ್ಗೀಯ ವಲಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಪರಲೋಕದಲ್ಲಿ’ ಸನ್ನಿವೇಶಕ್ಕೆ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: ἐπὶ γῆς
  choice: ಭೂಮಿಯ ಮೇಲೆಯೂ
  rationale: ἐπί + ಷಷ್ಠೀ ವಿಭಕ್ತಿ ‘ಮೇಲೆ’ ಎಂಬ ಅರ್ಥ ಕೊಡುತ್ತದೆ. ಹೋಲಿಕೆಯನ್ನು ಪೂರ್ಣಗೊಳಿಸುವ καίಯ ‘ಯೂ’ ಅರ್ಥವನ್ನು ಸೇರಿಸಿ ‘ಭೂಮಿಯ ಮೇಲೆಯೂ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: καὶ
  choice: ಯೂ
  rationale: ὡς ... καὶ ಎಂಬ ಹೋಲಿಕೆಯ ರಚನೆಯಲ್ಲಿ καί ‘ಹಾಗೆಯೇ/ಸಹ’ ಎಂಬ ಅರ್ಥವನ್ನು ಪೂರ್ಣಗೊಳಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಮೇಲೆಯೂ’ ಎಂಬ ಪದದಲ್ಲಿನ ‘ಯೂ’ ಅದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς ಎಂಬ ಹೋಲಿಕೆಯ ಪದಗುಚ್ಛದ ವ್ಯಾಪ್ತಿ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇದನ್ನು ಸಮೀಪದ ಎರಡನೇ ಬೇಡಿಕೆಯಾದ ‘ನಿನ್ನ ಚಿತ್ತವು ... ನೆರವೇರಲಿ’ ಎಂಬುದಕ್ಕೆ ಜೋಡಿಸಲಾಗಿದೆ.
  alternative: ‘ಪರಲೋಕದಲ್ಲಿ ... ಭೂಮಿಯ ಮೇಲೆಯೂ’ ಎಂಬುದನ್ನು ‘ನಿನ್ನ ರಾಜ್ಯವು ಬರಲಿ’ ಮತ್ತು ‘ನಿನ್ನ ಚಿತ್ತವು ನೆರವೇರಲಿ’ ಎಂಬ ಎರಡೂ ಬೇಡಿಕೆಗಳಿಗೆ ಅನ್ವಯಿಸುವಂತೆ ಗ್ರಹಿಸಬಹುದು.
  rationale: ಗ್ರೀಕ್ ಮೂಲದ ಪದಕ್ರಮದಲ್ಲಿ ಈ ಪದಗುಚ್ಛವು ಎರಡನೇ ಬೇಡಿಕೆಗೆ ತಕ್ಷಣ ಹತ್ತಿರವಿರುವುದರಿಂದ ಅದಕ್ಕೆ ಜೋಡಿಸುವುದು ಅತ್ಯಂತ ಸಹಜ. ಆದರೂ ಪ್ರಾಚೀನ ಹಸ್ತಪ್ರತಿಗಳ ವಿರಾಮಚಿಹ್ನೆಗಳು ನಿರ್ಣಾಯಕವಲ್ಲ; ಎರಡೂ ಬೇಡಿಕೆಗಳಿಗೆ ಅನ್ವಯಿಸುವ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಪೂರ್ಣ ಪ್ರಾರ್ಥನಾ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಬರಲಿ’ ಮತ್ತು ‘ನೆರವೇರಲಿ’ ಎಂಬ ರೂಪಗಳು ಗ್ರೀಕ್ ತೃತೀಯ ಪುರುಷ ಆಜ್ಞಾರ್ಥಕಗಳ ಪ್ರಾರ್ಥನಾತ್ಮಕ ಬಲವನ್ನು ಸಹಜವಾಗಿ ತರುತ್ತವೆ. ವಾಕ್ಯವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಇಟ್ಟುಕೊಂಡು, ಹೋಲಿಕೆಯ ಪದಗುಚ್ಛದ ನಿಜವಾದ ವ್ಯಾಪ್ತಿಯ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
