- from: ಆದರೆ ನೀನು ಪ್ರಾರ್ಥಿಸುವಾಗ, ನಿನ್ನ ಒಳಕೋಣೆಗೆ[a] ಹೋಗಿ ಬಾಗಿಲನ್ನು ಮುಚ್ಚಿ, ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ ಪ್ರಾರ್ಥಿಸು. ಆಗ ಮರೆಯಲ್ಲಿ ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು.[b]
  to: ಆದರೆ ನೀನು ಪ್ರಾರ್ಥಿಸುವಾಗ, ನಿನ್ನ ಒಳಕೋಣೆಗೆ[a] ಹೋಗಿ ನಿನ್ನ ಬಾಗಿಲನ್ನು ಮುಚ್ಚಿ, ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ ಪ್ರಾರ್ಥಿಸು. ಆಗ ಮರೆಯಲ್ಲಿ ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು[b].
  rationale: ಮೂಲಪಾಠದ ‘ನಿನ್ನ ಬಾಗಿಲನ್ನು’ ಎಂಬ ಸ್ವಾಮ್ಯಸೂಚಕವನ್ನು ಪುನಃ ಸೇರಿಸಲಾಗಿದೆ. κρυπτῷಯ ಎರಡೂ ಬಳಕೆಗಳಿಗೆ ‘ಮರೆ’ ಎಂಬ ಒಂದೇ ಪದವನ್ನು ಉಳಿಸಿ, ತಂದೆಯ ಗುಪ್ತತೆಯೂ ಆತನು ಗುಪ್ತದಲ್ಲಿ ನೋಡುವುದೂ ಎಂಬ ಮೂಲದ ಉದ್ದೇಶಿತ ತೆರೆದತನವನ್ನು ಕಾಪಾಡಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ bಯ ಆಂಕರ್ ಅನ್ನು ಸಂಬಂಧಿತ ಕ್ರಿಯಾಪದದ ತಕ್ಷಣಕ್ಕೆ ಸ್ಥಳಾಂತರಿಸಲಾಗಿದೆ; aಯ ಪರ್ಯಾಯವನ್ನು ಮನೆಯ ಒಳಗಿನ ಸಂಗ್ರಹ-ಕೋಣೆಯ ಅರ್ಥಕ್ಕೆ ಹೆಚ್ಚು ನಿಖರವಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ.
