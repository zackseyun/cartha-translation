id: MAT.6.6
reference: Matthew 6:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: kn
  text: ಆದರೆ ನೀನು ಪ್ರಾರ್ಥಿಸುವಾಗ, ನಿನ್ನ ಒಳಕೋಣೆಗೆ[a] ಹೋಗಿ ನಿನ್ನ ಬಾಗಿಲನ್ನು ಮುಚ್ಚಿ, ಮರೆಯಲ್ಲಿರುವ ನಿನ್ನ ತಂದೆಗೆ ಪ್ರಾರ್ಥಿಸು. ಆಗ ಮರೆಯಲ್ಲಿ ನೋಡುವ ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಏಕಾಂತ ಕೋಣೆಗೆ’ ಅಥವಾ ‘ಸಂಗ್ರಹದ ಕೋಣೆಗೆ.’ ಗ್ರೀಕ್ ಪದವು ಏಕಾಂತಕ್ಕಾಗಿ ಅಥವಾ ವಸ್ತುಗಳನ್ನು ಸಂಗ್ರಹಿಸಲು ಬಳಸುತ್ತಿದ್ದ ಮನೆಯ ಒಳಗಿನ ಕೋಣೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ನಿನಗೆ ಮರುಕೊಡುವನು’ ಅಥವಾ ‘ತೀರಿಸುವನು.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದಕ್ಕೆ ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ‘ಮರುಕೊಡು,’ ‘ತೀರಿಸು,’ ಅಥವಾ ‘ಪ್ರತಿಫಲ ಕೊಡು’ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: ಆದರೆ ನೀನು
  rationale: ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಕಪಟಿಗಳ ನಡವಳಿಕೆಗೆ ವಿರುದ್ಧವಾಗಿ ಒತ್ತಿಹೇಳಲಾದ ‘ನೀನು’ ಎಂಬ ಸಂಬೋಧನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὅταν προσεύχῃ
  choice: ಪ್ರಾರ್ಥಿಸುವಾಗ
  rationale: ὅταν ಜೊತೆಗೆ ಬಂದಿರುವ ಸಂಭಾವನಾರ್ಥಕ ಕ್ರಿಯಾಪದದ ಸಾಮಾನ್ಯ ಕಾಲಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಪುನರಾವರ್ತಿಸಬಹುದಾದ ಸಂದರ್ಭವನ್ನೂ ಒಳಗೊಂಡಿದೆ.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: ನಿನ್ನ ಒಳಕೋಣೆಗೆ ಹೋಗಿ
  rationale: ταμεῖον ಎಂದರೆ ಏಕಾಂತ ಅಥವಾ ಸಂಗ್ರಹಕ್ಕಾಗಿ ಬಳಸುವ ಮನೆಯ ಒಳಭಾಗದ ಕೋಣೆ. ‘ಒಳಕೋಣೆ’ ಅದರ ಏಕಾಂತ ಹಾಗೂ ಒಳಸ್ಥಳದ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κλείσας τὴν θύραν σου
  choice: ಬಾಗಿಲನ್ನು ಮುಚ್ಚಿ
  rationale: ಮುಖ್ಯ ಆಜ್ಞೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ಅನುಕ್ರಮದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ; ಸ್ವಾಮ್ಯವು ‘ನಿನ್ನ ಒಳಕೋಣೆ’ ಎಂಬ ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: ನಿನ್ನ ತಂದೆಗೆ ಪ್ರಾರ್ಥಿಸು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸಂಬಂಧಾತ್ಮಕ ‘ತಂದೆ’ ಎಂಬ ಸಂಬೋಧನೆಯನ್ನು ಯಾವುದೇ ವಿವರಣಾತ್ಮಕ ಪದ ಸೇರಿಸದೆ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: ಮರೆಯಲ್ಲಿರುವ
  rationale: κρυπτός‌ನ ಗುಪ್ತತೆ/ಕಾಣದಿರುವಿಕೆಯ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಅದನ್ನು ಕೇವಲ ಭೌತಿಕ ಸ್ಥಳಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: ಮರೆಯಲ್ಲಿ ನೋಡುವ
  rationale: ἐν τῷ κρυπτῷ ಎಂಬ ಮೂಲದ ಪುನರಾವರ್ತನೆಯನ್ನು ‘ಮರೆ’ ಎಂಬ ಒಂದೇ ಪದದಿಂದ ಉಳಿಸಿ, ಕಾಣದ ವಲಯದಲ್ಲಿ ತಂದೆಯು ನೋಡುವ ಅರ್ಥವನ್ನು ತೆರೆದಿಟ್ಟಿದೆ.
- source_word: ἀποδώσει σοι
  choice: ನಿನಗೆ ಪ್ರತಿಫಲ ಕೊಡುವನು
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ದೇವರ ಸಕಾರಾತ್ಮಕ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕ್ರಿಯಾಪದಕ್ಕೆ ‘ಮರುಕೊಡು/ತೀರಿಸು’ ಎಂಬ ಅರ್ಥಗಳೂ ಸಾಧ್ಯವೆಂಬುದನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ἐν τῷ κρυπτῷ ಎಂಬ ಪುನರಾವರ್ತಿತ ಪದಗುಚ್ಛದ ಅರ್ಥ
  choice: ತಂದೆಯ ಮರೆಯಾದ ಸಾನ್ನಿಧ್ಯಕ್ಕೂ ಆತನು ಮರೆಯಲ್ಲಿ ನೋಡುವುದಕ್ಕೂ ‘ಮರೆ’ ಎಂಬ ಒಂದೇ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ.
  alternative: ‘ಏಕಾಂತ ಸ್ಥಳದಲ್ಲಿ’, ‘ರಹಸ್ಯವಾಗಿ’, ಅಥವಾ ‘ಗುಪ್ತವಾಗಿ ಮಾಡಿದುದನ್ನು’
  rationale: ಬಹಿರಂಗ ಪ್ರದರ್ಶನಕ್ಕೆ ವಿರುದ್ಧವಾದ ಗುಪ್ತತೆಯನ್ನು ಒತ್ತಿಹೇಳುವ ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದನ್ನು ಕೇವಲ ಸ್ಥಳಾರ್ಥವಾಗಿಯೂ ಕೇವಲ ಕ್ರಿಯಾವಿಶೇಷಣಾರ್ಥವಾಗಿಯೂ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- issue: ದೇವರನ್ನು ಸೂಚಿಸುವ πατήρ ಪದದ ಅನುವಾದ
  choice: ತಂದೆ
  alternative: ಪರಲೋಕದ ತಂದೆ
  rationale: ಈ ವಚನದ ಮೂಲಪಾಠದಲ್ಲಿ ಇರುವ ‘ನಿನ್ನ ತಂದೆ’ ಎಂಬ ಸಂಬಂಧಾತ್ಮಕ ಹೆಸರನ್ನೇ ಉಳಿಸಿ, ಸಮೀಪದ ವಚನಗಳಿಂದ ‘ಪರಲೋಕದ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸಿಲ್ಲ.
- issue: ἀποδώσει ಎಂಬ ಕ್ರಿಯಾಪದದ ಅರ್ಥ
  choice: ಪ್ರತಿಫಲ ಕೊಡುವನು
  alternative: ಮರುಕೊಡುವನು / ತೀರಿಸುವನು
  rationale: ಪ್ರಾರ್ಥನೆಗೆ ದೇವರು ನೀಡುವ ಸಕಾರಾತ್ಮಕ ಪ್ರತಿಕ್ರಿಯೆಯ ಸಂದರ್ಭಕ್ಕೆ ‘ಪ್ರತಿಫಲ’ ಸಹಜವಾಗಿದೆ; ಆದರೆ ಮೂಲ ಕ್ರಿಯಾಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಶೈಲಿ. ‘ಒಳಕೋಣೆ’ ಮತ್ತು ‘ಮರೆ’ ಎಂಬ ಪದಗಳು ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆ ಹಾಗೂ ಉದ್ದೇಶಿತ ಅರ್ಥದ ತೆರೆದತನವನ್ನು ಉಳಿಸುತ್ತವೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಪದಗಳ ತಕ್ಷಣವೇ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇವೆ.
