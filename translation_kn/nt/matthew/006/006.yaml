  naturalness: ‘ಒಳಕೋಣೆ,’ ‘ಮರೆಯಲ್ಲಿರುವ,’ ಮತ್ತು ‘ಮರೆಯಲ್ಲಿ ನೋಡುವ’ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗ್ರಾಹ್ಯವಾಗಿವೆ ಹಾಗೂ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ, ಸ್ವಲ್ಪ ತೆರೆದಿರುವ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತವೆ. ‘ನಿನ್ನ ಬಾಗಿಲನ್ನು’ ಸೇರಿಸುವುದರಿಂದ ವಾಕ್ಯದ ಸಹಜತೆ ಕುಂದುವುದಿಲ್ಲ.
