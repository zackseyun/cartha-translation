id: MAT.6.28
reference: Matthew 6:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: kn
  text: 'ಬಟ್ಟೆಯ ವಿಷಯದಲ್ಲಿ ನೀವು ಏಕೆ ಚಿಂತಿಸುತ್ತೀರಿ? ಹೊಲದ ಲಿಲಿ ಹೂಗಳು[a] ಹೇಗೆ ಬೆಳೆಯುತ್ತವೆ ಎಂಬುದನ್ನು ಗಮನಿಸಿ: ಅವು ದುಡಿಯುವುದಿಲ್ಲ, ನೂಲುವುದೂ ಇಲ್ಲ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಹೊಲದ ಕಾಡುಹೂಗಳು.’ κρίνα ಎಂಬ ಪದವು ಇಲ್ಲಿ ಲಿಲಿ ಹೂಗಳನ್ನು, ಅಥವಾ ಇನ್ನಷ್ಟು ವ್ಯಾಪಕವಾಗಿ ಕಾಡುಹೂಗಳನ್ನು, ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: ಬಟ್ಟೆಯ ವಿಷಯದಲ್ಲಿ
  rationale: ἔνδυμα ಇಲ್ಲಿ ಒಂದು ನಿರ್ದಿಷ್ಟ ಉಡುಪಿಗಿಂತ ಸಾಮಾನ್ಯವಾಗಿ ಧರಿಸುವ ಬಟ್ಟೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಬಟ್ಟೆಯ ವಿಷಯದಲ್ಲಿ’ ಸಹಜವಾಗಿದೆ.
- source_word: τί μεριμνᾶτε
  choice: ನೀವು ಏಕೆ ಚಿಂತಿಸುತ್ತೀರಿ?
  rationale: μεριμνάω ಈ ಸಂದರ್ಭದಲ್ಲಿರುವ ಆತಂಕಭರಿತ ಕಳವಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಚಿಂತಿಸುತ್ತೀರಿ’ ಸುತ್ತಲಿನ ಬೋಧನೆಗೆ ಹೊಂದುವ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾದ ಪದಪ್ರಯೋಗ.
- source_word: καταμάθετε
  choice: ಗಮನಿಸಿ
  rationale: ಈ ಆಜ್ಞೆಯು ಗಮನವಿಟ್ಟು ನೋಡಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವಂತೆ ಕರೆಯುತ್ತದೆ; ‘ಗಮನಿಸಿ’ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ಆ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: ಹೊಲದ ತಾವರೆಹೂಗಳು
  rationale: κρίνα ಅನ್ನು ಪರಂಪರಾಗತವಾಗಿ ‘ಲಿಲಿಗಳು’ ಎಂದು ತೆಗೆದುಕೊಳ್ಳಲಾಗುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಸಸ್ಯನಾಮವಾಗಿ ‘ತಾವರೆಹೂಗಳು’ ಬಳಸಲಾಗಿದೆ. ಆದರೂ ಇದು ಸಾಮಾನ್ಯ ಕಾಡುಹೂಗಳನ್ನು ಸೂಚಿಸಬಹುದಾದ ಸಾಧ್ಯತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: πῶς αὐξάνουσιν
  choice: ಹೇಗೆ ಬೆಳೆಯುತ್ತವೆ
  rationale: αὐξάνω ಇಲ್ಲಿ ಸಸ್ಯಗಳ ಸಹಜ ಬೆಳವಣಿಗೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಬೆಳೆಯುತ್ತವೆ’ ನೇರ ಹಾಗೂ ಸಹಜ ಸಮಾನಾರ್ಥಕ.
- source_word: οὐ κοπιῶσιν
  choice: ಅವು ದುಡಿಯುವುದಿಲ್ಲ
  rationale: κοπιάω ಶ್ರಮಪಟ್ಟು ದುಡಿಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ದುಡಿಯುವುದಿಲ್ಲ’ ಸ್ಪಷ್ಟವೂ ಸಮಕಾಲೀನವೂ ಆಗಿದೆ.
- source_word: οὐδὲ νήθουσιν
  choice: ನೂಲು ನೂಲುವುದೂ ಇಲ್ಲ
  rationale: νήθω ನಾರಿನಿಂದ ನೂಲು ತಯಾರಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಕೇವಲ ‘ನೂಲುವುದಿಲ್ಲ’ ಎನ್ನುವುದಕ್ಕಿಂತ ‘ನೂಲು ನೂಲುವುದಿಲ್ಲ’ ಹೆಚ್ಚು ಸ್ಪಷ್ಟ.
theological_decisions:
- issue: μεριμνάω ಪದವು ಸಾಮಾನ್ಯ ಕಾಳಜಿಯನ್ನೋ ಆತಂಕಭರಿತ ಚಿಂತೆಯನ್ನೋ ಸೂಚಿಸುವುದು
  choice: ಚಿಂತಿಸುತ್ತೀರಿ
  alternative: ಕಳವಳಪಡುತ್ತೀರಿ
  rationale: ಯೇಸುವಿನ ಬೋಧನೆ ಸಾಮಾನ್ಯ ಜವಾಬ್ದಾರಿಯುತ ಕಾಳಜಿಯನ್ನು ಅಲ್ಲ, ಜೀವನಾವಶ್ಯಕತೆಗಳ ಕುರಿತ ಆತಂಕವನ್ನು ಉದ್ದೇಶಿಸುತ್ತದೆ. ‘ಚಿಂತಿಸುತ್ತೀರಿ’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಸಂದರ್ಭವು ಅದರ ಆತಂಕದ ಛಾಯೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಹಜ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಪ್ರಶ್ನೆ, ಆಜ್ಞೆ ಮತ್ತು ಸಮಾಂತರ ನಿರಾಕರಣೆಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
