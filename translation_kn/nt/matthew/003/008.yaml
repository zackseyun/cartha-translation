id: MAT.3.8
reference: Matthew 3:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ ತಕ್ಕ ಫಲವನ್ನು ಫಲಿಸಿರಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ ಅನುಗುಣವಾದ ಫಲವನ್ನು ಫಲಿಸಿರಿ.’
    reason: ἄξιον ಎಂಬುದು ‘ತಕ್ಕ’ ಎಂಬ ಅರ್ಥದೊಂದಿಗೆ ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ ಹೊಂದುವ ಅಥವಾ ಅನುಗುಣವಾಗಿರುವ ಅರ್ಥವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: ποιήσατε
  choice: ಕೊಡಿ
  rationale: ಇದು ಬಹುವಚನದ ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯಾಪದ. ಕನ್ನಡದಲ್ಲಿ ‘ಫಲವನ್ನು ಕೊಡಿ’ ಎಂಬುದು ಫಲದ ರೂಪಕದೊಂದಿಗೆ ಸಹಜವಾಗಿದ್ದು, ನಿರ್ಣಾಯಕ ಕ್ರಿಯೆಗೆ ನೀಡಿದ ಕರೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: οὖν
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಎಚ್ಚರಿಕೆ ಮತ್ತು ಕರೆಯಿಂದ ಬರುವ ತೀರ್ಮಾನಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: καρπὸν
  choice: ಫಲವನ್ನು
  rationale: καρπός ಎಂಬ ಏಕವಚನವನ್ನು ಉಳಿಸಿ, ಇಲ್ಲಿ ಕಾಣಿಸಿಕೊಳ್ಳುವ ನಡೆ ಅಥವಾ ಪರಿಣಾಮವನ್ನು ಸೂಚಿಸುವ ರೂಪಕಾರ್ಥವನ್ನು ಹೊಂದಿಸಲಾಗಿದೆ.
- source_word: ἄξιον
  choice: ತಕ್ಕ
  rationale: ἄξιος + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಯೋಗ್ಯತೆ ಅಥವಾ ಹೊಂದಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಕ್ಕ’ ಎಂಬುದು ಫಲವು ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ ಅನುಗುಣವಾಗಿರಬೇಕು ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅದನ್ನು ಸಂಪಾದಿಸುವ ಅರ್ಥ ನೀಡುವುದಿಲ್ಲ.
- source_word: μετανοίας
  choice: ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ
  rationale: μετάνοια ಇಲ್ಲಿ ಯೋಹಾನನ ಕರೆಗೆ ಪ್ರತಿಕ್ರಿಯೆಯಾಗಿ ಮನಸ್ಸು ಮತ್ತು ದಿಕ್ಕಿನ ನಿಜವಾದ ಬದಲಾವಣೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಪಶ್ಚಾತ್ತಾಪ’ ಕನ್ನಡದ ಸ್ಥಾಪಿತ, ಸಹಜ ಧಾರ್ಮಿಕ ಪದವಾಗಿದ್ದು, ಕೇವಲ ಅಭಿಪ್ರಾಯ ಬದಲಾವಣೆ ಎಂಬ ಸೀಮಿತ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: καρπὸν ἄξιον τῆς μετανοίας ಎಂಬ ಪದಗುಚ್ಛದ ಅರ್ಥ
  choice: ನಿಜವಾದ ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ ಹೊಂದುವ ಹೊರಗಿನ ನಡೆ ಅಥವಾ ಫಲಕ್ಕಾಗಿ ನೀಡಿದ ಆಜ್ಞೆ
  alternative: ಪಶ್ಚಾತ್ತಾಪವನ್ನು ಸಂಪಾದಿಸುವ ಫಲ, ಅಥವಾ ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ ಸಮಮೌಲ್ಯದ ಫಲ
  rationale: ಈ ಷಷ್ಠೀ ರಚನೆಯು ಅರ್ಹತೆಯಿಂದ ಸಂಪಾದಿಸುವುದಕ್ಕಿಂತ ಹೊಂದಿಕೆ ಅಥವಾ ಅನುಗುಣತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಕ್ಕ’ ಎಂಬ ಆಯ್ಕೆ ಪಠ್ಯದ ನೈತಿಕ ಒತ್ತಾಯವನ್ನು ಉಳಿಸುತ್ತದೆಯಾದರೂ, ಕೃತಿಗಳು ಪಶ್ಚಾತ್ತಾಪವನ್ನು ಖರೀದಿಸುತ್ತವೆ ಅಥವಾ ಉಂಟುಮಾಡುತ್ತವೆ ಎಂದು ಹೇಳುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನವಾದ ಆಜ್ಞಾರ್ಥಕ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಫಲ’ ಎಂಬ ಮೂಲ ರೂಪಕ ಮತ್ತು ಏಕವಚನವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ವಾಕ್ಯವು ಬಹುವಚನದ ಶ್ರೋತೃಗಳಿಗೆ ಉದ್ದೇಶಿತವಾಗಿರುವುದರಿಂದ ‘ಕೊಡಿ’ ಬಳಸಲಾಗಿದೆ.
