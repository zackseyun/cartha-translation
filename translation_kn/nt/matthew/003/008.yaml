review_pass:
  verdict: revise
  source_fidelity: 'The Greek is a plural aorist imperative: ποιήσατε calls for producing/bearing, not literally handing over, καρπόν. The logical connector οὖν, collective singular ‘fruit,’ and the correspondence sense of ἄξιον τῆς μετανοίας are otherwise represented accurately.'
  naturalness: ‘ಫಲವನ್ನು ಕೊಡಿ’ can naturally be understood as ‘give the fruit’ rather than ‘bear/produce fruit.’ ‘ಫಲವನ್ನು ಫಲಿಸಿರಿ’ is an established, clear Kannada expression for the agricultural metaphor and preserves the imperative force in a dignified modern-standard biblical register.
  terminology: ‘ಪಶ್ಚಾತ್ತಾಪ’ is the established and suitable rendering of μετανοία here. ‘ತಕ್ಕ’ correctly communicates correspondence rather than a fruit that earns repentance. The alternative ‘ಅನುಗುಣವಾದ’ appropriately clarifies that sense.
  issues:
  - severity: medium
    issue: The main verb ‘ಕೊಡಿ’ may mean ‘give/hand over’ rather than ‘produce/bear.’
    rationale: ποιήσατε καρπόν uses the fruit metaphor to command conduct that is brought forth. Revising the verb avoids an unintended transfer/giving sense while retaining the singular metaphorical ‘fruit.’
