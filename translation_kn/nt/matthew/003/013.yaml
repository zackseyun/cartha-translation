id: MAT.3.13
reference: Matthew 3:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: kn
  text: ಆಗ ಯೇಸು ಗಲಿಲಾಯದಿಂದ ಯೊರ್ದನ್ ನದಿಗೆ, ಯೋಹಾನನ ಬಳಿಗೆ, ಅವನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳಲು ಬರುತ್ತಾನೆ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ತಲುಪುತ್ತಾನೆ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಭೂತಕಾಲದ ಘಟನೆಯನ್ನು ಜೀವಂತವಾಗಿ ನಿರೂಪಿಸುವ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲದಲ್ಲಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಇನ್ನಷ್ಟು ಸ್ಪಷ್ಟವಾಗಿ, ‘ಅವನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಉದ್ದೇಶದಿಂದ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಕಾಲಕ್ರಮದಲ್ಲಿ ಪರಿಚಯಿಸುವ ಸಹಜವಾದ ಕನ್ನಡ ನಿರೂಪಣಾ ಸೂಚಕ.
- source_word: παραγίνεται
  choice: ಬರುತ್ತಾನೆ
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲದ ಜೀವಂತಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ವರ್ತಮಾನಕಾಲದಿಂದ ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭಾನುಸಾರ ‘ತಲುಪುತ್ತಾನೆ’ ಎಂಬ ಅರ್ಥವೂ ಸಾಧ್ಯ.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: ಗಲಿಲಾಯದಿಂದ
  rationale: ἀπό ಸೂಚಿಸುವ ಹೊರಟ ಸ್ಥಳ ಅಥವಾ ಮೂಲವನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: ಯೊರ್ದನ್ ನದಿಯ ಬಳಿಗೆ
  rationale: ಚಲನೆಯ ಗಮ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡ ಓದುಗರಿಗೆ ಯೊರ್ದನ್ ಒಂದು ನದಿ ಎಂಬುದು ಸ್ಪಷ್ಟವಾಗುವಂತೆ ‘ನದಿ’ ಸೇರಿಸಲಾಗಿದೆ, ಮತ್ತು ವ್ಯಕ್ತಿಯ ಬಳಿಗೆ ಹೋಗುವುದರಿಂದ ಸ್ಥಳದ ಬಳಿಗೆ ಹೋಗುವುದನ್ನು ವಿಭೇದಿಸಲು ಸಹಜವಾಗಿದೆ.
- source_word: πρὸς τὸν Ἰωάννην
  choice: ಯೋಹಾನನ ಬಳಿಗೆ
  rationale: ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಕಡೆಗೆ ಅಥವಾ ಸನ್ನಿಧಿಗೆ ಬರುವ ಚಲನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ದೀಕ್ಷಾಸ್ನಾನಿಕ’ ಎಂಬ ಬಿರುದನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: τοῦ βαπτισθῆναι
  choice: ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳಲು
  rationale: 'ಉದ್ದೇಶಾರ್ಥಕ infinitive ಮತ್ತು passive ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ: ಯೇಸು ತಾನೇ ಕ್ರಿಯೆ ಮಾಡುವುದಲ್ಲ, ಯೋಹಾನನಿಂದ ಅದನ್ನು ಸ್ವೀಕರಿಸುತ್ತಾನೆ.'
- source_word: ὑπ’ αὐτοῦ
  choice: ಅವನಿಂದ
  rationale: ವೈಯಕ್ತಿಕ ಕರ್ತೃಸಾಧನವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಸರ್ವನಾಮವು ಸಮೀಪದ ಯೋಹಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: παραγίνεται ಎಂಬ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲ
  choice: ‘ಬರುತ್ತಾನೆ’ ಎಂದು ವರ್ತಮಾನಕಾಲದ ಜೀವಂತಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ‘ಬಂದನು’ ಅಥವಾ ‘ತಲುಪಿದನು’
  rationale: ಮತ್ತಾಯನ ಜೀವಂತ ನಿರೂಪಣಾಶೈಲಿಯನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸುತ್ತದೆ; ಇದರಿಂದ ಸಿದ್ಧಾಂತಾರ್ಥ ಬದಲಾಗುವುದಿಲ್ಲ.
- issue: ಯೋಹಾನನ ಬಿರುದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಯೋಹಾನ’ ಮಾತ್ರ
  alternative: ‘ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನ’
  rationale: ಈ ವಚನದ ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ಬಿರುದು ಇಲ್ಲ; ತಕ್ಷಣದ ಸಂದರ್ಭವೇ ವ್ಯಕ್ತಿಯನ್ನು ಗುರುತಿಸುತ್ತದೆ.
- issue: τοῦ βαπτισθῆναι ಯ ಉದ್ದೇಶಾರ್ಥ
  choice: ‘ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳಲು’
  alternative: ‘ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಉದ್ದೇಶದಿಂದ’
  rationale: ಉದ್ದೇಶವನ್ನು ಸ್ಪಷ್ಟವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ತಿಳಿಸುತ್ತದೆ; ಹೆಚ್ಚು ವಿವರಣಾತ್ಮಕ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಕೊಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ನಿರೂಪಣೆ. ‘ದೀಕ್ಷಾಸ್ನಾನ’ ಎಂಬ ಪರಿಚಿತ ಕ್ರೈಸ್ತ ಪದವನ್ನು ಬಳಸಿದರೂ passive ಅರ್ಥವನ್ನು ‘ಮಾಡಿಸಿಕೊಳ್ಳಲು’ ಮೂಲಕ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ. ಸ್ಥಳ ಮತ್ತು ವ್ಯಕ್ತಿಯ ಕಡೆಗಿನ ಎರಡು ಸಂಬಂಧಗಳನ್ನು ಕ್ರಮವಾಗಿ ‘ನದಿಯ ಬಳಿಗೆ, ಯೋಹಾನನ ಬಳಿಗೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
