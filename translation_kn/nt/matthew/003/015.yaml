id: MAT.3.15
reference: Matthew 3:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: kn
  text: ಆದರೆ ಯೇಸು ಅವನಿಗೆ ಉತ್ತರವಾಗಿ, “ಸದ್ಯಕ್ಕೆ ಹಾಗೆ ಇರಲು ಬಿಡು; ಏಕೆಂದರೆ ಹೀಗೆ ನಾವು ಎಲ್ಲ ನೀತಿಯನ್ನು[a] ನೆರವೇರಿಸುವುದು ನಮಗೆ ಯುಕ್ತವಾಗಿದೆ” ಎಂದು ಹೇಳಿದನು. ಆಗ ಯೋಹಾನನು ಅವನಿಗೆ ಅವಕಾಶಕೊಟ್ಟನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ನೀತಿ” ಎಂಬ ಪದಕ್ಕೆ “ನ್ಯಾಯ” ಎಂಬ ಅರ್ಥವೂ ಇರಬಹುದು. ಇಲ್ಲಿ ದೇವರ ಚಿತ್ತಕ್ಕೆ ಅನುಗುಣವಾಗಿರುವುದನ್ನು ಸೂಚಿಸಲು “ನೀತಿ” ಹೆಚ್ಚು ಸೂಕ್ತವಾಗಿದೆ.
    reason: δικαιοσύνηಗೆ ಇರುವ ‘righteousness/justice’ ಎಂಬ ಪದಾರ್ಥಿಕ ಪರ್ಯಾಯವನ್ನು ಸಂಬಂಧಿತ ಪದದಲ್ಲೇ ಸೂಚಿಸಲು.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: ಆದರೆ ಯೇಸು ಅವನಿಗೆ ಉತ್ತರವಾಗಿ ... ಎಂದನು
  rationale: δέ ಹಿಂದಿನ ವಚನದಲ್ಲಿನ ಯೋಹಾನನ ಆಕ್ಷೇಪಕ್ಕೆ ವ್ಯತಿರಿಕ್ತತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ἀποκριθεὶς ... εἶπεν ಎಂಬ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಉತ್ತರವಾಗಿ ... ಎಂದನು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: Ἄφες ἄρτι
  choice: ಈಗ ಇದಕ್ಕೆ ಅವಕಾಶಕೊಡು
  rationale: ἀφίημι ಇಲ್ಲಿ ‘ಕ್ಷಮಿಸು’ ಅಥವಾ ‘ಬಿಟ್ಟುಹೋಗು’ ಎಂದಲ್ಲ; ಯೋಹಾನನು ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ನಡೆಸಲು ಒಪ್ಪಬೇಕೆಂಬ ಅರ್ಥದಲ್ಲಿದೆ. ἄρτι ತಕ್ಷಣದ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಈಗ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: οὕτως γὰρ
  choice: ಏಕೆಂದರೆ ಹೀಗೆ
  rationale: οὕτως ಯೋಹಾನನು ಯೇಸುವಿಗೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುವ ರೀತಿಯನ್ನೇ ಹಿಂದಿರುಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಹೀಗೆ’ ಅದರ ಸೂಚಕ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: ನಾವು ... ಯುಕ್ತವಾಗಿದೆ
  rationale: πρέπον ನೈತಿಕವಾಗಿಯೂ ಸಂದರ್ಭೋಚಿತವಾಗಿಯೂ ಸರಿಯಾದದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಯುಕ್ತವಾಗಿದೆ’ ಆ ಅರ್ಥವನ್ನು ಘನವಾದ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: ಎಲ್ಲಾ ನೀತಿಯನ್ನು ನೆರವೇರಿಸುವುದು
  rationale: πληρόω ಗೆ ಮತ್ತಾಯನಲ್ಲಿ ಇರುವ ‘ನೆರವೇರಿಸು’ ಎಂಬ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. δικαιοσύνη ಯನ್ನು ಕೇವಲ ಕಾನೂನುಪಾಲನೆಗೆ ಸೀಮಿತಗೊಳಿಸದೆ, ದೇವರ ನೀತಿಯುತ ಚಿತ್ತಕ್ಕೆ ಅನುಗುಣವಾದದ್ದೆಲ್ಲ ಎಂಬ ವಿಶಾಲ ಅರ್ಥ ತೆರೆದಿಡಲು ‘ನೀತಿ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: τότε ἀφίησιν αὐτόν
  choice: ಆಗ ಯೋಹಾನನು ಅವನಿಗೆ ಅವಕಾಶಕೊಟ್ಟನು
  rationale: ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವಾದ ἀφίησιν ಅನ್ನು ಕನ್ನಡ ಕಥನದ ಸಹಜ ಭೂತಕಾಲದಲ್ಲಿ ನೀಡಲಾಗಿದೆ. ಅಸ್ಪಷ್ಟ ಸರ್ವನಾಮದ ಬದಲು ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟವಾಗಿರುವ ಯೋಹಾನನ ಹೆಸರನ್ನು ಬಳಸಿ, ಅವನು ಯೇಸುವಿನ ಕೋರಿಕೆಗೆ ಒಪ್ಪಿದನೆಂಬ ಅರ್ಥವನ್ನು ತಿಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: πᾶσαν δικαιοσύνην ಎಂಬುದರ ಅರ್ಥ
  choice: ದೇವರ ನೀತಿಯುತ ಚಿತ್ತಕ್ಕೆ ಅನುಗುಣವಾದ ಎಲ್ಲವನ್ನೂ ಈ ಸಂದರ್ಭದಲ್ಲಿ ನೆರವೇರಿಸುವುದು
  alternative: ಪ್ರತಿಯೊಂದು ಧರ್ಮಶಾಸ್ತ್ರೀಯ ನಿಯಮವನ್ನು ಪೂರೈಸುವುದು; ಅಥವಾ ‘ಎಲ್ಲಾ ನ್ಯಾಯವನ್ನು ನೆರವೇರಿಸುವುದು’
  rationale: ವಾಕ್ಯವು ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾದ ಸಿದ್ಧಾಂತವನ್ನು ಹೇರದೆ, ಯೋಹಾನನಿಂದ ಯೇಸು ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆಯುವುದು ದೇವರ ನೀತಿಯುತ ಉದ್ದೇಶಕ್ಕೆ ಹೊಂದಿಕೆಯಾಗಿದೆ ಎಂಬ ಮತ್ತಾಯನ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನವಾದ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ನೀತಿ’ ಮತ್ತು ‘ನೆರವೇರಿಸು’ ಎಂಬ ಪದಗಳು ಮೂಲದ ಧಾರ್ಮಿಕ-ಸಾಹಿತ್ಯಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತವೆ; ಅನಗತ್ಯ ಪಂಥೀಯ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
