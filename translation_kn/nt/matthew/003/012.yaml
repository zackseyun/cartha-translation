  source_fidelity: 'The Kannada closely reflects every principal element of the Greek: the possessive relative sense (''ಆತನ''), the winnowing implement, the intensive future action of clearing the threshing floor, gathering the wheat into storage, and completely burning the chaff with fire that cannot be quenched. The agricultural and judgment imagery remains metaphorical, as in the source, without added interpretation.'
