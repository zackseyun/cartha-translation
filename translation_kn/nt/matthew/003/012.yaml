id: MAT.3.12
reference: Matthew 3:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: kn
  text: ಆತನ ತೂರುವ ಸಲಿಕೆ ಆತನ ಕೈಯಲ್ಲಿದೆ[a]. ಆತ ತನ್ನ ಕಣವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಸ್ವಚ್ಛಗೊಳಿಸಿ, ತನ್ನ ಗೋಧಿಯನ್ನು ಕಣಜದಲ್ಲಿ[b] ಕೂಡಿಸುವನು; ಆದರೆ ಹೊಟ್ಟನ್ನು ಆರಿಸಲಾಗದ ಬೆಂಕಿಯಿಂದ ಸಂಪೂರ್ಣವಾಗಿ ಸುಟ್ಟುಬಿಡುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ತೂರುಗೋಲು.’ ಇದು ಧಾನ್ಯವನ್ನು ಗಾಳಿಗೆ ತೂರಿ ಕಾಳನ್ನು ಹೊಟ್ಟಿನಿಂದ ಬೇರ್ಪಡಿಸುವ ಉಪಕರಣ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ಧಾನ್ಯಾಗಾರ’ ಅಥವಾ ‘ಉಗ್ರಾಣ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: ತೂರುವ ಸಲಿಕೆ
  rationale: ಧಾನ್ಯವನ್ನು ಗಾಳಿಗೆ ತೂರಿ ಕಾಳನ್ನು ಹೊಟ್ಟಿನಿಂದ ಬೇರ್ಪಡಿಸಲು ಬಳಸುವ ಕೃಷಿ ಉಪಕರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ತೂರುವ ಸಲಿಕೆ’ ಕಾರ್ಯವನ್ನೂ ಉಪಕರಣವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಉಪಕರಣದ ನಿಖರ ಆಕಾರವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: διακαθαριεῖ
  choice: ಸಂಪೂರ್ಣವಾಗಿ ಸ್ವಚ್ಛಗೊಳಿಸಿ
  rationale: ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಪೂರ್ಣವಾಗಿ ಶುದ್ಧಗೊಳಿಸುವ ಅಥವಾ ತೆರವುಮಾಡುವ ತೀವ್ರತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἅλωνα
  choice: ಕಣ
  rationale: ಧಾನ್ಯವನ್ನು ಒಕ್ಕಿ ತೂರುವ ಸ್ಥಳಕ್ಕೆ ಬಳಕೆಯಾಗುವ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಕೃಷಿಪದ.
- source_word: σῖτον
  choice: ಗೋಧಿ
  rationale: ಪದವು ಸಾಮಾನ್ಯವಾಗಿ ಧಾನ್ಯವನ್ನೂ ಸೂಚಿಸಬಹುದಾದರೂ, ಹೊಟ್ಟಿನಿಂದ ಬೇರ್ಪಡಿಸುವ ಈ ದೃಶ್ಯದಲ್ಲಿ ‘ಗೋಧಿ’ ಸಹಜವಾಗಿದ್ದು ನಿರ್ದಿಷ್ಟ ಕೃಷಿ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀποθήκην
  choice: ಕಣಜ
  rationale: ಧಾನ್ಯವನ್ನು ಸಂಗ್ರಹಿಸುವ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ; ಗ್ರೀಕ್ ಪದಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾದ ಆಧುನಿಕ ಕಟ್ಟಡದ ಕಲ್ಪನೆಯನ್ನು ಹೇರದು.
- source_word: ἄχυρον
  choice: ಹೊಟ್ಟು
  rationale: ತೂರುವಿಕೆಯಲ್ಲಿ ಕಾಳಿನಿಂದ ಬೇರ್ಪಡುವ, ಸುಡಲ್ಪಡುವ ಹಗುರವಾದ ನಿರುಪಯುಕ್ತ ಭಾಗವನ್ನು ಸಂದರ್ಭಾನುಸಾರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: κατακαύσει
  choice: ಸಂಪೂರ್ಣವಾಗಿ ಸುಟ್ಟುಬಿಡುವನು
  rationale: ಕೇವಲ ಸುಡುವುದಲ್ಲ, ಪೂರ್ತಿಯಾಗಿ ದಹಿಸಿಬಿಡುವ ಅರ್ಥತೀವ್ರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πυρὶ ἀσβέστῳ
  choice: ಆರಿಸಲಾಗದ ಬೆಂಕಿಯಿಂದ
  rationale: ಬೆಂಕಿಯನ್ನು ನಂದಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ ಎಂಬ ಅರ್ಥವನ್ನೂ ದತ್ತಿವಿಭಕ್ತಿಯ ಸಾಧನಾರ್ಥವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οὗ
  choice: ಆತನ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಹೇಳಲಾದ ಬರಲಿರುವವನಿಗೆ ಸಂಬಂಧಿಸುವ ಸ್ವಾಮ್ಯಾರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಗೋಧಿ ಮತ್ತು ಹೊಟ್ಟನ್ನು ಬೇರ್ಪಡಿಸುವ ನ್ಯಾಯತೀರ್ಪಿನ ರೂಪಕ
  choice: ಕೃಷಿ ರೂಪಕವನ್ನೂ ಭವಿಷ್ಯಕಾಲದ ತೀವ್ರ ನ್ಯಾಯತೀರ್ಪಿನ ಭಾಷೆಯನ್ನೂ ಯಥಾವತ್ತಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಗೋಧಿ ಮತ್ತು ಹೊಟ್ಟು ಯಾರನ್ನು ಸಂಕೇತಿಸುತ್ತವೆ ಎಂಬುದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸುವ ಭಾವಾನುವಾದ.
  rationale: ಮೂಲ ವಾಕ್ಯವು ಸಂಕೇತಗಳ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಗುರುತಿಸದೆ ರೂಪಕವನ್ನೇ ನೀಡುತ್ತದೆ. ಆದ್ದರಿಂದ ಅದರ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಿ, ವಿವರಣಾತ್ಮಕ ಸಿದ್ಧಾಂತವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಘನವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಕೃಷಿ ರೂಪಕದ ಸಾಂಸ್ಕೃತಿಕ ಸ್ವರೂಪವನ್ನು ಉಳಿಸಲು ‘ಕಣ’, ‘ಕಣಜ’, ‘ಹೊಟ್ಟು’ ಎಂಬ ಸಹಜ ಪದಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. [a] ಮತ್ತು [b] ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸೇರಿವೆ.
