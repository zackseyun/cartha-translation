  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: kn
  text: ಆಗ ಯೆರೂಸಲೇಮಿನಿಂದಲೂ, ಯೂದಾಯದ ಎಲ್ಲೆಡೆಯಿಂದಲೂ, ಯೊರ್ದನ್ ನದಿಯ ಸುತ್ತಮುತ್ತಲಿನ ಪ್ರದೇಶವೆಲ್ಲದಿಂದಲೂ ಜನರು ಅವನ ಬಳಿಗೆ ಹೋಗುತ್ತಿದ್ದರು.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಹೋಗುತ್ತಲೇ ಇದ್ದರು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ರೂಪವು ಹಿಂದೆ ಮುಂದುವರಿದ ಅಥವಾ ಪುನಃಪುನಃ ನಡೆದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ‘ಯೂದಾಯದ ಎಲ್ಲೆಡೆಯಿಂದ’ ಮತ್ತು ‘ಯೊರ್ದನ್ ನದಿಯ ಸುತ್ತಮುತ್ತಲಿನ ಪ್ರದೇಶವೆಲ್ಲದಿಂದ’ ಎಂಬವು ಯೋಹಾನನ ಬಳಿಗೆ ಜನರು ವ್ಯಾಪಕವಾಗಿ ಬಂದದ್ದನ್ನು ಸೂಚಿಸುವ ಭೌಗೋಳಿಕ ಅಭಿವ್ಯಕ್ತಿಗಳು; ಅವು ಪ್ರತಿಯೊಬ್ಬ ವ್ಯಕ್ತಿಯೂ ಬಂದನೆಂದು ಕಡ್ಡಾಯವಾಗಿ ಅರ್ಥಕೊಡುವುದಿಲ್ಲ.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಹಿಂದಿನ ವಚನಗಳಲ್ಲಿ ವಿವರಿಸಿದ ಯೋಹಾನನ ಸೇವೆಗೆ ಜನರು ತೋರಿಸಿದ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಕಾಲಸೂಚಕವಾಗಿ ಜೋಡಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: ἐξεπορεύετο
  choice: ಹೋಗುತ್ತಿದ್ದರು
  rationale: ಗ್ರೀಕ್ ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಹಿಂದೆ ನಡೆಯುತ್ತಲೇ ಇದ್ದ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ಈ ರೂಪವು ಆ ಅಂಶವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πρὸς αὐτόν
  choice: ಅವನ ಬಳಿಗೆ
  rationale: ವ್ಯಕ್ತಿಯ ಕಡೆಗೆ ನಡೆಯುವ ಚಲನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಇಲ್ಲಿ ‘ಅವನು’ ಎಂಬುದು ಸ್ನಾನಿಕ ಯೋಹಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ἱεροσόλυμα
  choice: ಯೆರೂಸಲೇಮಿನಿಂದಲೂ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸ್ಥಳನಾಮವು ಅಲ್ಲಿನ ಜನರನ್ನು ಸೂಚಿಸುವ ಲಕ್ಷಣಾರ್ಥಕ ಬಳಕೆ. ಕನ್ನಡದಲ್ಲಿ ಜನರು ಎಲ್ಲಿಂದ ಬಂದರೆಂಬುದನ್ನು ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜವಾಗಿ ಹೇಳಲು ಅಪಾದಾನ ರೂಪ ಬಳಸಲಾಗಿದೆ.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: ಯೂದಾಯದ ಎಲ್ಲೆಡೆಯಿಂದಲೂ
  rationale: ಇಡೀ ಪ್ರದೇಶವನ್ನು ವ್ಯಾಪಕವಾಗಿ ಸೂಚಿಸುವ πᾶσα ಎಂಬ ಪದದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪ್ರತಿಯೊಬ್ಬ ನಿವಾಸಿಯನ್ನೂ ಗಣಿತಾತ್ಮಕವಾಗಿ ಒಳಗೊಳ್ಳುತ್ತದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಹೇರದು.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: ಯೊರ್ದನ್ ನದಿಯ ಸುತ್ತಮುತ್ತಲಿನ ಪ್ರದೇಶವೆಲ್ಲದಿಂದಲೂ
  rationale: περίχωρος ಎಂಬುದು ಸುತ್ತಲಿನ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡ ಓದುಗರಿಗೆ ಭೌಗೋಳಿಕ ಉಲ್ಲೇಖ ಸ್ಪಷ್ಟವಾಗಲು ‘ನದಿ’ ಸೇರಿಸಲಾಗಿದೆ; ‘ಪ್ರದೇಶವೆಲ್ಲ’ ಮೂಲದ ವ್ಯಾಪಕತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ ... καὶ
  choice: -ಲೂ ... -ಲೂ
  rationale: ಮೂರು ಭೌಗೋಳಿಕ ಮೂಲಗಳನ್ನು ಸಂಚಿತವಾಗಿ ಜೋಡಿಸುವ ಪುನರಾವರ್ತಿತ καί ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಸಮುಚ್ಚಯ ಪ್ರತ್ಯಯದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಭೌಗೋಳಿಕ ಸಮಗ್ರ ಪದಗಳ ವ್ಯಾಪ್ತಿ
  choice: ವ್ಯಾಪಕ ಜನಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಪ್ರದೇಶಾಧಾರಿತ ಭಾಷೆಯಾಗಿ ಅನುವಾದಿಸುವುದು
  alternative: ಪ್ರತಿಯೊಂದು ಪ್ರದೇಶದ ಪ್ರತಿಯೊಬ್ಬ ನಿವಾಸಿಯೂ ಬಂದನೆಂಬ ಅಕ್ಷರಶಃ ಸಮಗ್ರತೆಯಾಗಿ ನಿರೂಪಿಸುವುದು
  rationale: ಮೂಲದಲ್ಲಿನ ‘ಎಲ್ಲಾ/ಇಡೀ’ ಎಂಬ ಭೌಗೋಳಿಕ ಅಭಿವ್ಯಕ್ತಿಗಳು ಯೋಹಾನನ ಸೇವೆಗೆ ದೊರೆತ ವ್ಯಾಪಕ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ವರ್ಣಿಸುತ್ತವೆ. ಅನುವಾದವು ಆ ವ್ಯಾಪಕತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಮೂಲವು ಕಡ್ಡಾಯಪಡಿಸದ ಗಣಿತಾತ್ಮಕ ಅರ್ಥವನ್ನು ಹೇರದೆ ಬಿಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಸ್ಥಳಗಳೇ ಚಲಿಸಿದಂತೆ ತೋರುವ ಮೂಲದ ಲಕ್ಷಣಾರ್ಥಕ ರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜಗೊಳಿಸಲು ‘-ಇಂದಲೂ’ ಮತ್ತು ‘ಜನರು’ ಬಳಸಲಾಗಿದೆ; ಅಪೂರ್ಣ ಭೂತಕಾಲದ ನಿರಂತರತೆಯನ್ನು ‘ಹೋಗುತ್ತಿದ್ದರು’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
