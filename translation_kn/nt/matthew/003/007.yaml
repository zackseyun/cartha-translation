  terminology: '''ಫರಿಸಾಯರು,'' ''ಸದ್ದುಕಾಯರು,'' and ''ದೀಕ್ಷಾಸ್ನಾನ'' are appropriate standard biblical terms. ''ಕೋಪ'' preserves ὀργή without adding an explicit subject or interpretive term such as judgment. ''ತಪ್ಪಿಸಿಕೊಳ್ಳುವಂತೆ'' is an acceptable idiomatic rendering in this context, though it is slightly less image-rich than ''flee.'''
