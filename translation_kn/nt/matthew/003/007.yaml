id: MAT.3.7
reference: Matthew 3:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: kn
  text: ಆದರೆ ಫರಿಸಾಯರು ಮತ್ತು ಸದ್ದುಕಾಯರಲ್ಲಿ ಅನೇಕರು ಅವನ ದೀಕ್ಷಾಸ್ನಾನಕ್ಕೆ ಬರುತ್ತಿರುವುದನ್ನು ಅವನು ಕಂಡಾಗ, ಅವರಿಗೆ, “ವಿಷಸರ್ಪಗಳ ಸಂತತಿಯೇ[a], ಬರಲಿರುವ ಕೋಪದಿಂದ[b] ತಪ್ಪಿಸಿಕೊಳ್ಳುವಂತೆ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದವರು ಯಾರು?” ಎಂದು ಕೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ವಿಷಸರ್ಪಗಳ ಮರಿಗಳೇ.”
    reason: γεννήματα ಪದಕ್ಕೆ ‘ಸಂತತಿ’ ಮತ್ತು ‘ಮರಿಗಳು’ ಎಂಬ ಎರಡೂ ರೂಪಗಳು ಸಾಧ್ಯ; ಎರಡನೆಯದು ಗುಂಪಾಗಿ ಹುಟ್ಟಿದ ಮರಿಗಳ ಚಿತ್ರಣವನ್ನು ಹೆಚ್ಚು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
  - marker: b
    text: ಅಥವಾ, “ಮುಂದೆ ಬರಲಿರುವ ಕೋಪದಿಂದ.”
    reason: μέλλω ಪದವು ಬರಲಿರುವ ಅಥವಾ ಮುಂದೆ ಸಂಭವಿಸಲಿರುವ ಸಂಗತಿಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಈ ಪರ್ಯಾಯವೂ ಮೂಲದ ಭವಿಷ್ಯಮುಖಿ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ಆದರೆ … ಕಂಡಾಗ
  rationale: ಏಕಕಾಲಿಕ ಪೂರ್ವಕಾಲದ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಕಾಲಸೂಚಕ ಉಪವಾಕ್ಯವಾಗಿ ನೀಡಿದ್ದು, δέ ಸೂಚಿಸುವ ಸೌಮ್ಯ ವೈರುಧ್ಯವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ಫರಿಸಾಯರು ಮತ್ತು ಸದ್ದುಕಾಯರಲ್ಲಿ ಅನೇಕರು
  rationale: ಬಹುವಚನದೊಂದಿಗೆ ಬಂದಿರುವ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಭಾಗಸೂಚಕ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಈ ಎರಡು ಗುಂಪುಗಳ ಪ್ರತಿಯೊಬ್ಬರೂ ಅಲ್ಲದೆ ಅವರಲ್ಲಿ ಅನೇಕರು ಬಂದರು ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: ಅವನ ದೀಕ್ಷಾಸ್ನಾನಕ್ಕೆ ಬರುತ್ತಿರುವುದನ್ನು
  rationale: ἐπί ಸೂಚಿಸುವ ದೀಕ್ಷಾಸ್ನಾನದ ಕಡೆಗಿನ ಆಗಮನವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅವರು ನಿಜವಾಗಿಯೂ ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆದರು ಎಂದು ವಾಕ್ಯದಲ್ಲಿ ಇಲ್ಲದ ಮಾಹಿತಿಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: Γεννήματα ἐχιδνῶν
  choice: ವಿಷಸರ್ಪಗಳ ಸಂತತಿಯವರೇ
  rationale: γεννήματα ಎಂಬುದರ ಹುಟ್ಟಿದವರು ಅಥವಾ ಸಂತತಿ ಎಂಬ ಅರ್ಥವನ್ನೂ, ἐχιδνῶν ಎಂಬ ವಿಷಸರ್ಪದ ತೀಕ್ಷ್ಣ ರೂಪಕವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದವರು ಯಾರು?
  rationale: ಮುಂದಿನ ‘ಕೋಪದಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳುವುದು’ ಎಂಬ ಸಂದರ್ಭದಲ್ಲಿರುವ ὑποδείκνυμι ಪದದ ಎಚ್ಚರಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: φυγεῖν ἀπὸ
  choice: …ದಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳುವಂತೆ
  rationale: ಅಪಾಯದಿಂದ ಪಾರಾಗುವ ತುರ್ತು ಚಲನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಓಡಿಹೋಗುವಂತೆ’ ಎಂಬ ಅಕ್ಷರಶಃ ರೂಪಕ್ಕಿಂತ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: τῆς μελλούσης ὀργῆς
  choice: ಬರಲಿರುವ ಕೋಪದಿಂದ
  rationale: μέλλω ಪದದ ಭವಿಷ್ಯಮುಖಿ ಅಥವಾ ಸನ್ನಿಹಿತ ಅರ್ಥವನ್ನೂ, ὀργή ಪದದ ತೀವ್ರವಾದ ‘ಕೋಪ’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಸಂಬೋಧಿಸಲ್ಪಟ್ಟ ಗುಂಪುಗಳ ವ್ಯಾಪ್ತಿ
  choice: ಫರಿಸಾಯರು ಮತ್ತು ಸದ್ದುಕಾಯರಲ್ಲಿ ಅಲ್ಲಿಗೆ ಬಂದ ಅನೇಕರು
  alternative: ಎಲ್ಲ ಫರಿಸಾಯರು ಮತ್ತು ಸದ್ದುಕಾಯರು
  rationale: ಗ್ರೀಕ್‌ನ ಭಾಗಸೂಚಕ ರಚನೆ ಆ ಗುಂಪುಗಳಲ್ಲಿನ ಒಂದು ದೊಡ್ಡ ಭಾಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಎಲ್ಲ ಸದಸ್ಯರಿಗೂ ಮಿತಿಮೀರಿ ಅನ್ವಯಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- issue: ὀργή ಪದದ ಅಂತ್ಯಕಾಲಿಕ ತೀವ್ರತೆ
  choice: ಕೋಪ
  alternative: ತೀರ್ಪು ಅಥವಾ ಶಿಕ್ಷೆ
  rationale: ಮೂಲಪದವು ಕೋಪವನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ‘ತೀರ್ಪು’ ಅಥವಾ ‘ಶಿಕ್ಷೆ’ ಎಂದು ಅನುವಾದಿಸಿದರೆ ಅದರ ಫಲಿತಾಂಶವನ್ನು ಹೇಳಿದಂತಾಗಿ ಮೂಲದ ಧಾರ್ಮಿಕ ತೀವ್ರತೆ ಮೃದುವಾಗಬಹುದು; ಕೋಪ ಯಾರದು ಎಂಬುದನ್ನು ಮೂಲವಾಕ್ಯ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದಿರುವುದರಿಂದ ಅನುವಾದವೂ ಅದನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ನೇರವಾದ ಪ್ರವಾದನಾ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ದೀಕ್ಷಾಸ್ನಾನ’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಪರಿಚಿತವಾದ ಪದ; ‘ವಿಷಸರ್ಪಗಳ ಸಂತತಿಯವರೇ’ ಎಂಬುದು ಮೂಲದ ಕಟುವಾದ ರೂಪಕವನ್ನು ಮೃದುಗೊಳಿಸದೆ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಸಂಬಂಧಿಸಿದ ಪದಬಂಧಗಳ ಬಳಿಯೇ ಇವೆ.
