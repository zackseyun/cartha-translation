id: MAT.3.2
reference: Matthew 3:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: kn
  text: 'ಹೀಗೆ ಹೇಳುತ್ತಿದ್ದನು: “ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ[a]; ಏಕೆಂದರೆ ಪರಲೋಕದ ರಾಜ್ಯವು ಸಮೀಪಿಸಿದೆ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿಮ್ಮ ಮನಸ್ಸನ್ನು ಬದಲಾಯಿಸಿಕೊಳ್ಳಿರಿ.’ ಗ್ರೀಕ್ ಪದವು ಕೇವಲ ದುಃಖ ಅಥವಾ ಅಪರಾಧಭಾವವನ್ನಷ್ಟೇ ಅಲ್ಲ, ಮನಸ್ಸು, ಚಿಂತನೆ ಮತ್ತು ಜೀವನದ ದಿಕ್ಕಿನ ಮೂಲಭೂತ ಮರುಹೊಂದಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, ‘ಆಕಾಶಗಳ ರಾಜ್ಯವು ಸಮೀಪಿಸಿದೆ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: ಹೀಗೆ ಹೇಳುತ್ತಿದ್ದನು
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿರುವ ಯೋಹಾನನ ಕಾರ್ಯಕ್ಕೆ ಈ ವರ್ತಮಾನ ಕೃದಂತವು ಸಂಬಂಧಿಸಿದೆ. ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ನಿರೂಪಣೆಗೆ ‘ಹೀಗೆ ಹೇಳುತ್ತಿದ್ದನು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ‘ಬೋಧಿಸುತ್ತಾ’ ಅಥವಾ ‘ಘೋಷಿಸುತ್ತಾ’ ಎಂಬ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: Μετανοεῖτε
  choice: ನಿಮ್ಮ ಮನಸ್ಸನ್ನು ಬದಲಾಯಿಸಿಕೊಳ್ಳಿರಿ
  rationale: ಬಹುವಚನ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕವಾದ μετανοέω ಮನಸ್ಸು/ಚಿಂತನೆಯ ಮೂಲಭೂತ ಬದಲಾವಣೆಗೆ ಕರೆಕೊಡುತ್ತದೆ. ‘ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ’ ಎಂಬ ಸಾಂಪ್ರದಾಯಿಕ ಪದವು ಕೆಲ ಓದುಗರಿಗೆ ದುಃಖ ಅಥವಾ ಅಪರಾಧಭಾವಕ್ಕೆ ಮಾತ್ರ ಸೀಮಿತವಾಗಿ ಕೇಳಿಸಬಹುದಾದ್ದರಿಂದ, ಮೂಲದ ಜ್ಞಾನಾತ್ಮಕ ಮತ್ತು ಜೀವನಮುಖಿ ವ್ಯಾಪ್ತಿಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಮುಂದಿನ ಹೇಳಿಕೆಯು ಆಜ್ಞೆಗೆ ಕಾರಣವನ್ನು ನೀಡುವುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἤγγικεν
  choice: ಸಮೀಪಿಸಿದೆ
  rationale: ಪೂರ್ಣಕಾಲ ರೂಪವು ರಾಜ್ಯವು ಹತ್ತಿರಕ್ಕೆ ಬಂದು ಈಗ ಸಮೀಪದಲ್ಲಿದೆ ಎಂಬ ಫಲಿತ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಸಮೀಪಿಸಿದೆ’ ಇದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕದ ರಾಜ್ಯ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗವನ್ನು ದೇವರ ಆಳ್ವಿಕೆ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಬದಲಿಸದೆ ಉಳಿಸಲಾಗಿದೆ. ‘ರಾಜ್ಯ’ ಎಂಬುದು ಆಳ್ವಿಕೆ ಮತ್ತು ರಾಜ್ಯಕ್ಷೇತ್ರ ಎರಡನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲದು; ‘ಪರಲೋಕದ’ ಎಂಬುದು ಕನ್ನಡದ ಸಹಜ ಏಕವಚನ ರೂಪ.
theological_decisions:
- issue: μετανοεῖτε ಎಂಬ ಕರೆಯ ವ್ಯಾಪ್ತಿ
  choice: ನಿಮ್ಮ ಮನಸ್ಸನ್ನು ಬದಲಾಯಿಸಿಕೊಳ್ಳಿರಿ
  alternative: ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ
  rationale: ಈ ಕರೆ ಕೇವಲ ಅಪರಾಧಭಾವ ಅಥವಾ ವಿಷಾದವನ್ನಲ್ಲ, ಸಮೀಪಿಸುತ್ತಿರುವ ರಾಜ್ಯದ ಬೆಳಕಿನಲ್ಲಿ ಚಿಂತನೆ ಮತ್ತು ಜೀವನದ ದಿಕ್ಕಿನ ಮೂಲಭೂತ ಮರುಹೊಂದಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸಾಂಪ್ರದಾಯಿಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ‘ಪರಲೋಕದ ರಾಜ್ಯ’ ಎಂಬುದರ ಅರ್ಥ
  choice: ಮತ್ತಾಯನ ಪದಪ್ರಯೋಗವಾದ ‘ಪರಲೋಕದ ರಾಜ್ಯ’ವನ್ನು ಉಳಿಸುವುದು
  alternative: ದೇವರ ಆಳ್ವಿಕೆ
  rationale: ವಿವರಣಾತ್ಮಕ ಪರ್ಯಾಯವು βασιλείαಯ ಆಳ್ವಿಕೆ ಎಂಬ ಆಯಾಮವನ್ನು ಚೆನ್ನಾಗಿ ಸೂಚಿಸಿದರೂ, ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅದನ್ನು ಬಳಸುವುದು ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಮುಂಚಿತವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಮೂಲದ ಧಾರ್ಮಿಕ-ಸಾಹಿತ್ಯಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ, ಘೋಷಣಾತ್ಮಕ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಬಹುವಚನ ಆಜ್ಞೆಯನ್ನು ‘-ಕೊಳ್ಳಿರಿ’ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ. ವಾಕ್ಯವು ಹಿಂದಿನ ವಚನಕ್ಕೆ ಸಂಪರ್ಕ ಹೊಂದಿರುವುದರಿಂದ ‘ಹೀಗೆ ಹೇಳುತ್ತಿದ್ದನು’ ಎಂದು ಆರಂಭಿಸಲಾಗಿದೆ.
