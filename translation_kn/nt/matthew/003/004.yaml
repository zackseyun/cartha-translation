  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ನಿರೂಪಣೆ. ‘ಸೊಂಟ’, ‘ನಡುಪಟ್ಟಿ’, ‘ಮಿಡತೆಗಳು’, ‘ಕಾಡುಜೇನು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟ. ಮೂಲದ ಒತ್ತನ್ನು ‘ಸ್ವತಃ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ; ಎಲೀಯನ ಸೂಚನೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಆಮದು ಮಾಡಿಲ್ಲ.
