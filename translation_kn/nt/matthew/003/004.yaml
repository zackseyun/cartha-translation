source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: kn
  text: ಯೋಹಾನನು ಸ್ವತಃ ಒಂಟೆಯ ಕೂದಲಿನ ಉಡುಪನ್ನೂ ತನ್ನ ಸೊಂಟದ ಸುತ್ತ ಚರ್ಮದ ನಡುಪಟ್ಟಿಯನ್ನೂ ಧರಿಸಿದ್ದನು.[a][b][c] ಅವನ ಆಹಾರವು ಮಿಡತೆಗಳೂ ಕಾಡುಜೇನೂ ಆಗಿತ್ತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಯೋಹಾನನ ಉಡುಪು 2 ಅರಸುಗಳು 1:8ರಲ್ಲಿ ಪ್ರವಾದಿ ಎಲೀಯನ ರೂಪವನ್ನು ನೆನಪಿಸುತ್ತದೆ; ಮತ್ತಾಯನು ಯೋಹಾನನನ್ನು ಚಿತ್ರಿಸುವ ರೀತಿಗೆ ಇದು ಮಹತ್ವದ ಹಿನ್ನೆಲೆ.
    reason: cross_reference
  - marker: b
    text: ಅಥವಾ, “ಅವನ ಉಡುಪು ಒಂಟೆಯ ಕೂದಲಿನದಾಗಿತ್ತು.”
    reason: lexical_alternative
  - marker: c
    text: ಅಕ್ಷರಶಃ, “ಅವನು ಒಂಟೆಯ ಕೂದಲಿನ ಉಡುಪನ್ನು ಹೊಂದಿದ್ದನು.”
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: ಯೋಹಾನನು ಸ್ವತಃ
  rationale: αὐτόςನ ಒತ್ತನ್ನು ‘ಸ್ವತಃ’ ಉಳಿಸುತ್ತದೆ. δέಯ ಸೌಮ್ಯ ಸಂಕ್ರಮಣವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಪದದಿಂದ ಅನಗತ್ಯವಾಗಿ ಭಾರಗೊಳಿಸದೆ ವಾಕ್ಯಸಂದರ್ಭಕ್ಕೆ ಬಿಡಲಾಗಿದೆ.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: ಉಡುಪನ್ನು ಧರಿಸಿದ್ದನು
  rationale: εἶχεν ಅಕ್ಷರಶಃ ‘ಹೊಂದಿದ್ದನು’ ಎಂದಾದರೂ, ಉಡುಪಿನ ಸಂದರ್ಭದಲ್ಲಿ ಅದು ಯೋಹಾನನು ಏನು ಧರಿಸಿದ್ದನೆಂಬುದನ್ನು ವರ್ಣಿಸುತ್ತದೆ; ‘ಧರಿಸಿದ್ದನು’ ಸಹಜ ಕನ್ನಡವಾಗಿದ್ದು ಉಡುಪನ್ನು ಮಾಡಿಸಿಕೊಂಡನೆಂಬ ತಪ್ಪರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: ಒಂಟೆಯ ಕೂದಲಿನಿಂದ ಮಾಡಿದ
  rationale: ἀπό ಇಲ್ಲಿ ವಸ್ತುಸಂಯೋಜನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಪದಪ್ರಯೋಗವು ಉಡುಪಿನ ವಸ್ತುವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ζώνην δερματίνην
  choice: ಚರ್ಮದ ನಡುಪಟ್ಟಿ
  rationale: ζώνη ಸೊಂಟಕ್ಕೆ ಕಟ್ಟುವ ಪಟ್ಟಿ; ‘ನಡುಪಟ್ಟಿ’ ಆ ಕಾಲದ ವಸ್ತುವನ್ನು ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. δερματίνην ಅದರ ಚರ್ಮದ ವಸ್ತುವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: ತನ್ನ ಸೊಂಟದ ಸುತ್ತ
  rationale: ὀσφύςಗೆ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡ ‘ಸೊಂಟ’; ಪ್ರತಿಫಲಕ ‘ತನ್ನ’ ಕರ್ತೃನೊಂದಿಗಿನ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: ಅವನ ಆಹಾರವು … ಆಗಿತ್ತು
  rationale: τροφήಗೆ ‘ಆಹಾರ’ ನೇರ ಮತ್ತು ಗೌರವಯುತ ಸಮಾನಾರ್ಥಕ. δέಯ ಮುಂದುವರಿಕೆಯನ್ನು ಹೊಸ ವಾಕ್ಯದ ಸಹಜ ನಿರೂಪಣೆ ಹೊರುತ್ತದೆ.
- source_word: ἀκρίδες
  choice: ಮಿಡತೆಗಳು
  rationale: ಪದದ ಸಾಮಾನ್ಯ ಮತ್ತು ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ ತಿನ್ನಬಹುದಾದ ಲೋಕಸ್ಟ್ ಕೀಟಗಳು; ಸಸ್ಯಾಧಾರಿತ ಪರ್ಯಾಯಕ್ಕೆ ಮೂಲಭಾಷೆಯಲ್ಲಿ ಆಧಾರವಿಲ್ಲ.
- source_word: μέλι ἄγριον
  choice: ಕಾಡುಜೇನು
  rationale: ἄγριον ಕಾಡಿನಲ್ಲಿ ದೊರೆಯುವ ಜೇನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕಾಡುಜೇನು’ ಸಂಕ್ಷಿಪ್ತ, ಸಹಜ ಕನ್ನಡ.
theological_decisions:
- issue: ಯೋಹಾನನ ತಪಸ್ವಿ ರೂಪ ಮತ್ತು ಎಲೀಯನೊಂದಿಗಿನ ಪ್ರತಿಧ್ವನಿ
  choice: ವಸ್ತ್ರ ಮತ್ತು ಆಹಾರದ ವಿವರವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ನೇರವಾಗಿ ಅನುವಾದಿಸಿ, ಎಲೀಯನೊಂದಿಗಿನ ಸಂಬಂಧವನ್ನು ಅಡಿಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
  alternative: ಎಲೀಯನನ್ನು ನೆನಪಿಸುವಂತೆ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಹೆಚ್ಚು ವಿವರಣಾತ್ಮಕ ಪದಗಳನ್ನು ಸೇರಿಸುವುದು.
  rationale: ಮತ್ತಾಯನು ಇಲ್ಲಿ ವಿವರವನ್ನು ಮಾತ್ರ ನೀಡುತ್ತಾನೆ; 2 ಅರಸುಗಳು 1:8ರ ಅಂತರಪಠ್ಯ ಸಂಬಂಧ ಮಹತ್ವದ್ದಾದರೂ ಅದನ್ನು ಅನುವಾದದೊಳಗೆ ಸೇರಿಸುವುದು ವ್ಯಾಖ್ಯಾನವನ್ನು ಪಠ್ಯವನ್ನಾಗಿಸುತ್ತದೆ.
