id: MAT.3.3
reference: Matthew 3:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: kn
  text: 'ಏಕೆಂದರೆ ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನ ಮೂಲಕ ಈತನ ಕುರಿತು ಹೀಗೆ ಹೇಳಲಾಗಿದೆ:


    “ಅರಣ್ಯದಲ್ಲಿ ಕೂಗುವವನ ಧ್ವನಿ:[a]


    ‘ಕರ್ತನ[b] ಮಾರ್ಗವನ್ನು ಸಿದ್ಧಪಡಿಸಿರಿ;


    ಆತನ ಹಾದಿಗಳನ್ನು ನೇರಮಾಡಿರಿ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಪರ್ಯಾಯ ವಾಕ್ಯವಿಭಾಗ: “ಅರಣ್ಯದಲ್ಲಿ, ‘ಕರ್ತನ ಮಾರ್ಗವನ್ನು ಸಿದ್ಧಪಡಿಸಿರಿ; ಆತನ ಹಾದಿಗಳನ್ನು ನೇರಮಾಡಿರಿ’ ಎಂದು ಕೂಗುವವನ ಧ್ವನಿ.”'
    reason: ἐν τῇ ἐρήμῳ (‘ಅರಣ್ಯದಲ್ಲಿ’) ಎಂಬ ಪದಗುಚ್ಛವನ್ನು ‘ಕೂಗುವವನು’ ಎಂಬುದರೊಡನೆ ಅಥವಾ ಆಜ್ಞೆಯೊಡನೆ ಸಂಬಂಧಿಸುವ ಸಾಧ್ಯ ವಾಕ್ಯವಿಭಾಗವನ್ನು ಸೂಚಿಸಲು; ಯೆಶಾಯ 40:3ರ ಹೀಬ್ರೂ ಹಿನ್ನೆಲೆಯಲ್ಲಿಯೂ ಈ ವಾಕ್ಯವಿಭಾಗದ ಪ್ರಶ್ನೆ ಉಂಟಾಗುತ್ತದೆ.
  - marker: b
    text: ಅಥವಾ, “ಯೆಹೋವನ.” ಈ ಉಲ್ಲೇಖವು ಯೆಶಾಯ 40:3ನ್ನು ಪ್ರತಿಧ್ವನಿಸುತ್ತದೆ; ಅಲ್ಲಿನ ಹೀಬ್ರೂ ಪಾಠದಲ್ಲಿ YHWH ಎಂಬ ದೈವನಾಮವಿದೆ.
    reason: ಗ್ರೀಕ್ κυρίου (‘ಕರ್ತನ’) ಮತ್ತು ಯೆಶಾಯ 40:3ರ ಹೀಬ್ರೂ ಪಾಠದಲ್ಲಿರುವ ದೈವನಾಮದ ಅಂತರಪಾಠೀಯ ಸಂಬಂಧವನ್ನು ತಿಳಿಸಲು.
lexical_decisions:
- source_word: οὗτος
  choice: ಇವನನ್ನೇ ಕುರಿತು
  rationale: ಈ ಸೂಚಕ ಸರ್ವನಾಮವು ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿರುವ ದೀಕ್ಷಾಸ್ನಾನಿಕನಾದ ಯೋಹಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಇವನನ್ನೇ ಕುರಿತು’ ಎಂಬುದು ಅದರ ಸೂಚಕ ಬಲವನ್ನೂ ಒತ್ತನ್ನೂ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: γάρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಹೇಳಿಕೆಗೆ ವಿವರಣೆಯನ್ನು ಪರಿಚಯಿಸುವ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: ὁ ῥηθεὶς
  choice: ಹೇಳಿದ್ದು ಇವನನ್ನೇ ಕುರಿತು
  rationale: ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ಕೃದಂತವನ್ನು ಪದಶಃ ‘ಹೇಳಲ್ಪಟ್ಟವನು’ ಎಂದರೆ ಕನ್ನಡದಲ್ಲಿ ಕೃತಕವಾಗುತ್ತದೆ; ಈ ರೂಪವು ‘ಇವನ ಕುರಿತು ಹೇಳಲಾಗಿದೆ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಕಾಪಾಡುತ್ತದೆ.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: ಪ್ರವಾದಿ ಯೆಶಾಯನ ಮೂಲಕ
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮಧ್ಯವರ್ತಿ ಸಾಧನ/ಮಾಧ್ಯಮದ ಅರ್ಥವನ್ನು ‘ಮೂಲಕ’ ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Φωνὴ βοῶντος
  choice: ಕೂಗುವವನ ಧ್ವನಿ
  rationale: ಷಷ್ಠೀ ಕೃದಂತದ ‘ಕೂಗುವ ಒಬ್ಬನ ಧ್ವನಿ’ ಎಂಬ ರಚನೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ಅರಣ್ಯದಲ್ಲಿ
  rationale: ಯೋಹಾನನ ಸೇವೆಯ ನಿರ್ಜನ ಪ್ರದೇಶವನ್ನೂ ಯೆಶಾಯನ ಉಲ್ಲೇಖವನ್ನೂ ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ, ಘನವಾದ ಪದ.
- source_word: Ἑτοιμάσατε
  choice: ಸಿದ್ಧಪಡಿಸಿರಿ
  rationale: ನಿರ್ಣಾಯಕ ಕ್ರಿಯೆಗೆ ಕರೆಕೊಡುವ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥವನ್ನು ಗೌರವಪೂರ್ಣ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὴν ὁδὸν κυρίου
  choice: ಕರ್ತನ ಮಾರ್ಗವನ್ನು
  rationale: ὁδός ಪದದ ನೈಜ ಮತ್ತು ರೂಪಕಾರ್ಥ ಎರಡನ್ನೂ ‘ಮಾರ್ಗ’ ಉಳಿಸುತ್ತದೆ; κύριος ಅನ್ನು ಗ್ರೀಕ್ ಪಾಠದಂತೆ ‘ಕರ್ತನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: εὐθείας ποιεῖτε
  choice: ನೇರಮಾಡಿರಿ
  rationale: ‘ನೇರವಾಗಿ ಮಾಡಿರಿ’ ಎಂಬ ಆಜ್ಞಾರ್ಥದ ರಸ್ತೆ/ಜೀವನ ರೂಪಕವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ಆತನ ಹಾದಿಗಳನ್ನು
  rationale: τρίβος ಎಂಬ ಸಣ್ಣ ದಾರಿ ಅಥವಾ ಹಾದಿಯ ಅರ್ಥವನ್ನೂ αὐτοῦ ಎಂಬ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಸಂಬಂಧವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೆಶಾಯ 40:3ರ ಉಲ್ಲೇಖದಲ್ಲಿ κυρίου ಪದದ ಅನುವಾದ
  choice: ಕರ್ತನ
  alternative: ಯೆಹೋವನ / YHWHನ
  rationale: ಮತ್ತಾಯನ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿ κυρίου ಇದೆ; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ‘ಕರ್ತನ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. ಆದರೆ ಉಲ್ಲೇಖದ ಹೀಬ್ರೂ ಹಿನ್ನೆಲೆಯಲ್ಲಿರುವ ದೇವನ ವೈಯಕ್ತಿಕ ಹೆಸರು YHWH ಎಂಬುದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ἐν τῇ ἐρήμῳ ಪದಗುಚ್ಛವು ಯಾವುದಕ್ಕೆ ಸಂಬಂಧಿಸುತ್ತದೆ ಎಂಬ ವಿರಾಮಚಿಹ್ನಾ ಅನಿಶ್ಚಿತತೆ
  choice: ಅರಣ್ಯದಲ್ಲಿ ಕೂಗುವವನ ಧ್ವನಿ
  alternative: ಅರಣ್ಯದಲ್ಲಿ ಕರ್ತನ ಮಾರ್ಗವನ್ನು ಸಿದ್ಧಪಡಿಸಿರಿ ಎಂದು ಕೂಗುವ ಧ್ವನಿ
  rationale: ಗ್ರೀಕ್ ಪದಕ್ರಮವು ‘ಅರಣ್ಯದಲ್ಲಿ ಕೂಗುವವನು’ ಎಂಬ ಓದಿಗೆ ಸಹಜವಾಗಿ ಅವಕಾಶ ಕೊಡುತ್ತದೆ; ಯೆಶಾಯ 40:3ರ ಹೀಬ್ರೂ ವಾಕ್ಯವಿಭಾಗವು ‘ಅರಣ್ಯದಲ್ಲಿ ಮಾರ್ಗವನ್ನು ಸಿದ್ಧಪಡಿಸಿರಿ’ ಎಂಬ ಓದನ್ನು ಬೆಂಬಲಿಸಬಹುದು. ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಘನವಾದ ಪ್ರವಾದನಾ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಹೇಳಲ್ಪಟ್ಟವನು’ ಎಂಬ ಕೃತಕ ಪದಶಃ ರೂಪದ ಬದಲು ‘ಹೇಳಿದ್ದು ಇವನನ್ನೇ ಕುರಿತು’ ಎಂದು ಸಹಜಗೊಳಿಸಲಾಗಿದೆ. ಉಲ್ಲೇಖದ ಕಾವ್ಯಾತ್ಮಕ ಸಮಾಂತರತೆಯನ್ನು ಸಾಲು ವಿಭಜನೆಯ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
