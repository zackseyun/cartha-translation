  naturalness: ‘ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನ ಮೂಲಕ ಈತನ ಕುರಿತು ಹೀಗೆ ಹೇಳಲಾಗಿದೆ’ ಎಂಬುದು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ, ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿದೆ. ಕಾವ್ಯಾತ್ಮಕ ಉಲ್ಲೇಖದ ಸಮಾಂತರ ಸಾಲುಗಳು ಉಳಿಸಲಾಗಿದೆ. ಅಡಿಕುರಿಪು aಯ ಪರ್ಯಾಯ ವಾಕ್ಯವಿಭಾಗವನ್ನು ಸಂಪೂರ್ಣ ಉಲ್ಲೇಖದೊಂದಿಗೆ ಮರುರೂಪಿಸಲಾಗಿದೆ; ಹಿಂದಿನ ರೂಪವು ಅಪೂರ್ಣವಾಗಿತ್ತು.
