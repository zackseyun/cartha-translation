  rationale: ಮುಖ್ಯ ವಾಕ್ಯವನ್ನು ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ಉಲ್ಲೇಖ-ಸೂತ್ರಕ್ಕೆ ನಿಷ್ಠವಾಗಿಯೂ ಸ್ವಾಭಾವಿಕ ಕನ್ನಡದಲ್ಲಿಯೂ ಮರುರೂಪಿಸಲಾಗಿದೆ. ಅನಗತ್ಯ ಒತ್ತನ್ನು ತೆಗೆದುಹಾಕಲಾಗಿದೆ. ಅಡಿಕುರಿಪು aಯಲ್ಲಿ ವಿವಾದಾಸ್ಪದ ವಾಕ್ಯವಿಭಾಗವನ್ನು ಅರ್ಥ ಬದಲಾಗದಂತೆ, ಸಂಪೂರ್ಣ ಉಲ್ಲೇಖದೊಂದಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ಅಡಿಕುರಿಪು bಯಲ್ಲಿ κύριος ಮತ್ತು ಯೆಶಾಯನ YHWH ಹಿನ್ನೆಲೆಯ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
