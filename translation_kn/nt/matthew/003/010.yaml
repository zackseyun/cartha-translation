revisions:
- from: ಈಗಾಗಲೇ ಕೊಡಲಿಯು ಮರಗಳ ಬೇರಿನ ಬಳಿ ಇಡಲಾಗಿದೆ.[a] ಆದ್ದರಿಂದ ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ ಪ್ರತಿಯೊಂದು ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯಲಾಗುತ್ತದೆ.
  to: ಈಗಾಗಲೇ ಕೊಡಲಿಯು ಮರಗಳ ಬೇರುಗಳ ಬಳಿ ಇಡಲಾಗಿದೆ.[a] ಆದ್ದರಿಂದ ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ ಪ್ರತಿಯೊಂದು ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ.
