review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the temporal force of ἤδη, the axe/tree image, the inferential force of οὖν, the characteristic negative participle, and the two passive judgment actions. A small adjustment makes the plural reference to the trees’ roots more natural in Kannada and renders εἰς more directly as movement into the fire.
  naturalness: The register is clear modern standard Kannada. ‘ಮರಗಳ ಬೇರಿನ ಬಳಿ’ is understandable but slightly awkward because multiple trees normally have multiple roots in Kannada. ‘ಮರಗಳ ಬೇರುಗಳ ಬಳಿ’ is more idiomatic. ‘ಬೆಂಕಿಗೆ’ more naturally conveys ‘into the fire’ than locative ‘ಬೆಂಕಿಯಲ್ಲಿ’ in this context.
  terminology: ‘ಕೊಡಲಿ,’ ‘ಫಲ,’ ‘ಕಡಿಯುವುದು,’ and ‘ಬೆಂಕಿ’ are appropriate, clear terms. The judgment imagery is retained without doctrinal expansion.
  issues:
  - severity: low
    issue: ‘ಮರಗಳ ಬೇರಿನ ಬಳಿ’ uses a singular root expression with plural trees.
    rationale: Although Greek has singular ῥίζαν, it functions naturally with plural trees in the image. Kannada idiom is clearer with ‘ಮರಗಳ ಬೇರುಗಳ ಬಳಿ,’ without altering the metaphor or its meaning.
  - severity: low
    issue: ‘ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯಲಾಗುತ್ತದೆ’ can sound locative rather than directional.
    rationale: The Greek εἰς πῦρ expresses movement into the fire. ‘ಬೆಂಕಿಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ’ conveys this directional force more directly in modern Kannada.
  revised_text: ಈಗಾಗಲೇ ಕೊಡಲಿಯು ಮರಗಳ ಬೇರುಗಳ ಬಳಿ ಇಡಲಾಗಿದೆ.[a] ಆದ್ದರಿಂದ ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ ಪ್ರತಿಯೊಂದು ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ.
