id: MAT.3.10
reference: Matthew 3:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: kn
  text: ಈಗಾಗಲೇ ಕೊಡಲಿಯು ಮರಗಳ ಬೇರುಗಳ ಬಳಿ ಇಡಲಾಗಿದೆ.[a] ಆದ್ದರಿಂದ ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ ಪ್ರತಿಯೊಂದು ಮರವನ್ನು ಕಡಿದು ಬೆಂಕಿಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಮರಗಳ ಬೇರುಗಳ ಬಳಿ ಬಿದ್ದಿದೆ.’
    reason: κέῖταιಗೆ ‘ಇಡಲಾಗಿದೆ’ ಎಂಬ ಫಲಿತ ಸ್ಥಿತಿಯ ಅಥವಾ ‘ಬಿದ್ದಿದೆ/ಇದೆ’ ಎಂಬ ಸ್ಥಿತಿಸೂಚಕ ಅನುವಾದ ಸಾಧ್ಯ. ಈ ಪರ್ಯಾಯವು ಮೂಲದ ಸ್ಥಿತಿಭಾವವನ್ನು ದಾಖಲಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: ಈಗಾಗಲೇ
  rationale: ἤδηಯ ತಕ್ಷಣದ ಕಾಲಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ. δέ ಇಲ್ಲಿ ಸೌಮ್ಯ ಸಂಪರ್ಕಕವಾಗಿರುವುದರಿಂದ ಪ್ರತ್ಯೇಕ ಸಂಯೋಜಕ ಪದವನ್ನು ಸೇರಿಸದೆ ವಾಕ್ಯಪ್ರವಾಹದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἡ ἀξίνη
  choice: ಕೊಡಲಿಯು
  rationale: ಮರವನ್ನು ಕಡಿಯುವ ಸಾಧನದ ರೂಪಕಕ್ಕೆ ಸಾಮಾನ್ಯ ಹಾಗೂ ಸ್ಪಷ್ಟವಾದ ಕನ್ನಡ ಪದ.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: ಮರಗಳ ಬೇರಿನ ಬಳಿ ಇಡಲಾಗಿದೆ
  rationale: κεῖταιಯ ‘ಇದೆ/ಇಡಲಾಗಿದೆ’ ಎಂಬ ಸ್ಥಿತಿಭಾವವನ್ನೂ, πρὸς ಸೂಚಿಸುವ ಸಮೀಪತೆಯನ್ನೂ ಉಳಿಸಿ, ಕೊಡಲಿ ಬಳಸಲು ಸಿದ್ಧವಾಗಿರುವ ಚಿತ್ರಣವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: πᾶν οὖν δένδρον
  choice: ಆದ್ದರಿಂದ ... ಪ್ರತಿಯೊಂದು ಮರವನ್ನು
  rationale: οὖν ಸೂಚಿಸುವ ತಾರ್ಕಿಕ ಪರಿಣಾಮವನ್ನು ‘ಆದ್ದರಿಂದ’ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; πᾶνನ ಸಮಗ್ರ ಅರ್ಥವನ್ನು ‘ಪ್ರತಿಯೊಂದು’ ಉಳಿಸುತ್ತದೆ.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: ಒಳ್ಳೆಯ ಫಲವನ್ನು ಕೊಡದ
  rationale: ಮರದ ಕುರಿತು ಕನ್ನಡದಲ್ಲಿ ‘ಫಲ ಕೊಡು’ ಸಹಜ ಪ್ರಯೋಗ; ನಿರಾಕಾರ ವರ್ತಮಾನ ಕೃದಂತದ ಲಕ್ಷಣಾತ್ಮಕ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκκόπτεται
  choice: ಕಡಿದು
  rationale: ಮರದ ರೂಪಕದಲ್ಲಿ ‘ಕಡಿಯುವುದು’ ಸಹಜ ಸಮಾನಾರ್ಥಕ; ಮುಂದಿನ ಸಮಾನ ಕರ್ತೃವಾಚ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸರಾಗವಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
- source_word: εἰς πῦρ βάλλεται
  choice: ಬೆಂಕಿಯಲ್ಲಿ ಎಸೆಯಲಾಗುತ್ತದೆ
  rationale: βάλλεταιಯ ಕರ್ತೃವಾಚ್ಯ ಬಲವನ್ನೂ εἰςನ ಗಮ್ಯತೆಯನ್ನೂ ಸ್ಪಷ್ಟ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಬೆಂಕಿಯ ಚಿತ್ರಣದ ಸ್ವರೂಪ
  choice: ‘ಬೆಂಕಿ’ ಎಂಬ ಮೂಲ ರೂಪಕವನ್ನೇ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ವಿಸ್ತರಣೆಯಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಅಂತ್ಯಕಾಲದ ನ್ಯಾಯತೀರ್ಪು, ತಾತ್ಕಾಲಿಕ ನ್ಯಾಯತೀರ್ಪು, ಅಥವಾ ನರಕದ ಬೆಂಕಿ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು.
  rationale: ವಚನವು ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣವನ್ನು ನೀಡುತ್ತದೆ; ಆದರೆ ಬೆಂಕಿಯ ಅರ್ಥವನ್ನು ಇನ್ನಷ್ಟು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಠ್ಯದ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ಗೌರವಯುತ ಹಾಗೂ ನೇರ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ನ್ಯಾಯತೀರ್ಪಿನ ರೂಪಕದ ತೀವ್ರತೆಯನ್ನು ಮೃದುಗೊಳಿಸಿಲ್ಲ; ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ಧಾರ್ಮಿಕ ವಿವರಣೆಯನ್ನೂ ಸೇರಿಸಿಲ್ಲ.
