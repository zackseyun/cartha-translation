id: MAT.3.14
reference: Matthew 3:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: kn
  text: ಆದರೆ ಯೋಹಾನನು ಅವನನ್ನು ತಡೆಯಲು ನಿರಂತರವಾಗಿ ಪ್ರಯತ್ನಿಸುತ್ತಾ[a], “ನಾನೇ ನಿನ್ನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆಯಬೇಕಾಗಿದೆ; ನೀನು ನನ್ನ ಬಳಿಗೆ ಬರುತ್ತೀಯಾ?” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಅವನನ್ನು ತಡೆಯಲು ಪ್ರಯತ್ನಿಸುತ್ತಾ.” ಗ್ರೀಕ್‌ನ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯಾಪದವು ಪುನರಾವರ್ತಿತ ಅಥವಾ ಮುಂದುವರಿದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: ತಡೆಯಲು ಮತ್ತೆ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸುತ್ತಾ
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯಾಪದವು ಮುಂದುವರಿದ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಪ್ರಯತ್ನವನ್ನು ಸೂಚಿಸಬಹುದು. ಕನ್ನಡದಲ್ಲಿ ‘ಮತ್ತೆ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸುತ್ತಾ’ ಎಂಬುದು ಆ ಅಂಶವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಸರಳ ‘ತಡೆದನು’ಗಿಂತ ಮೂಲದ ಕ್ರಿಯಾರೂಪದ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: λέγων
  choice: ಎಂದು ಹೇಳಿದನು
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಡನೆ ಜೋಡಿಸಿ ಅನುವಾದಿಸಲಾಗಿದೆ; ಯೋಹಾನನ ತಡೆಯುವ ಪ್ರಯತ್ನಕ್ಕೆ ಅವನ ಮಾತೇ ವಿವರಣೆಯಾಗಿದೆ ಎಂಬ ಸಂಬಂಧ ಉಳಿಯುತ್ತದೆ.
- source_word: χρείαν ἔχω
  choice: ನಾನೇ ... ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕಾಗಿದೆ
  rationale: ‘ನನಗೆ ಅಗತ್ಯವಿದೆ’ ಎಂಬ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ‘ನಾನೇ’ ಎಂಬ ಒತ್ತನ್ನು ಮೂಲದ Ἐγώ ಮತ್ತು ಮುಂದಿನ σύ ನಡುವಿನ ವೈರುಧ್ಯಕ್ಕಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὑπὸ σοῦ
  choice: ನಿನ್ನಿಂದ
  rationale: ಕರ್ಮಣಿ infinitive ಜೊತೆಯಲ್ಲಿರುವ ὑπό + ಷಷ್ಠೀ ವಿಭಕ್ತಿ ಕರ್ತೃಕಾರಕವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ನಿನ್ನಿಂದ’ ನಿಖರವಾಗಿದೆ.
- source_word: βαπτισθῆναι
  choice: ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳಲು
  rationale: ಕರ್ಮಣಿ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ಮಾಡಿಸಿಕೊಳ್ಳು’ ರೂಪದಿಂದ ತಿಳಿಸಲಾಗಿದೆ. ‘ದೀಕ್ಷಾಸ್ನಾನ’ ಎಂಬ ಸ್ಥಾಪಿತ ಪದವು ಕ್ರಿಯೆಯ ವಿಧಾನದ ಕುರಿತು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: ನೀನು ನನ್ನ ಬಳಿಗೆ ಬರುತ್ತೀಯಾ?
  rationale: ಪ್ರಶ್ನೆಯ ವರ್ತಮಾನಕಾಲ ಮತ್ತು ವಾಕ್ಚಾತುರ್ಯಪೂರ್ಣ ವೈರುಧ್ಯವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ‘ಆದರೂ’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಯೇಸು ಯೋಹಾನನ ಬಳಿಗೆ ಬಂದದ್ದಕ್ಕೂ ಈಗ ಯೋಹಾನನು ತಡೆಯಲು ಯತ್ನಿಸುವುದಕ್ಕೂ ಇರುವ ಸೌಮ್ಯ ವೈರುಧ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿಗೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಲು ಯೋಹಾನನು ವ್ಯಕ್ತಪಡಿಸಿದ ಆಕ್ಷೇಪ
  choice: ಯೋಹಾನನು ತಾನೇ ಯೇಸುವಿನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಹೇಳಿದ ಮಾತನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಕಾರಣವನ್ನು ವಚನದಾಚೆಗೆ ವಿವರಿಸಲಾಗಿಲ್ಲ.
  alternative: ಇದನ್ನು ಮುಖ್ಯವಾಗಿ ಯೇಸುವಿನ ಪಾಪರಹಿತತೆ ಅಥವಾ ಸ್ಥಾನಾಧಿಕಾರದ ಕುರಿತು ಸ್ಪಷ್ಟ doctrinal ಹೇಳಿಕೆಯಾಗಿ ನಿರೂಪಿಸುವುದು.
  rationale: ವಚನವು ಯೋಹಾನನ ಅಗತ್ಯವನ್ನೂ ಯೇಸುವಿನ ಶ್ರೇಷ್ಠತೆಯ ಅರಿವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; ಆದರೆ ಅದರ ಸಂಪೂರ್ಣ ದೇವತಾತ್ತ್ವಿಕ ಆಧಾರವನ್ನು ಇಲ್ಲಿ ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಆ ಒತ್ತಡ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ಯೋಹಾನ ಮತ್ತು ಯೇಸುವಿನ ನೇರ ಸಂಭಾಷಣೆಯಲ್ಲಿ ಏಕವಚನ ‘ನೀನು/ನಿನ್ನಿಂದ’ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ Ἐγώ–σύ ವೈರುಧ್ಯವನ್ನು ‘ನಾನೇ ...; ನೀನು ...?’ ಎಂಬ ವಿನ್ಯಾಸದಿಂದ ಕಾಪಾಡಲಾಗಿದೆ.
