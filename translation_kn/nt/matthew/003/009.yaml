id: MAT.3.9
reference: Matthew 3:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: kn
  text: ‘ಅಬ್ರಹಾಮನು ನಮ್ಮ ತಂದೆ’ ಎಂದು ನಿಮ್ಮೊಳಗೆ ಹೇಳಿಕೊಳ್ಳಬಹುದು ಎಂದು ಭಾವಿಸಬೇಡಿ.[a] ಏಕೆಂದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ದೇವರು ಈ ಕಲ್ಲುಗಳಿಂದ ಅಬ್ರಹಾಮನಿಗೆ ಮಕ್ಕಳನ್ನು ಉಂಟುಮಾಡಲು ಸಮರ್ಥನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿಮ್ಮ ಮನಸ್ಸಿನಲ್ಲೇ ಹೇಳಿಕೊಳ್ಳಬಹುದು ಎಂದು.’ ಗ್ರೀಕ್ ಪದಬಂಧವು ಅಂತರಂಗದಲ್ಲಿ ತನಗೆ ತಾನೇ ಹೇಳಿಕೊಳ್ಳುವುದನ್ನಾಗಲಿ, ಗುಂಪಿನೊಳಗೆ ಪರಸ್ಪರ ಹೇಳಿಕೊಳ್ಳುವುದನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: ಹೇಳಿಕೊಳ್ಳಲು ಮುಂದಾಗಬೇಡಿ
  rationale: μή ಜೊತೆಯಲ್ಲಿರುವ aorist subjunctive ತಪ್ಪಾದ, ಆತ್ಮವಿಶ್ವಾಸಪೂರ್ಣ ಊಹೆಯನ್ನು ಸ್ವೀಕರಿಸದಂತೆ ಎಚ್ಚರಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮುಂದಾಗಬೇಡಿ’ ಎಂಬುದು ಕೇವಲ ಯೋಚನೆಯನ್ನು ಮಾತ್ರವಲ್ಲ, ಆ ನೆಲೆಯಲ್ಲಿ ಹಕ್ಕು ಮಂಡಿಸುವ ಧೋರಣೆಯನ್ನೂ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: ನಿಮ್ಮೊಳಗೆ ... ಎಂದು ಹೇಳಿಕೊಳ್ಳಲು
  rationale: ಬಹುವಚನ ಪ್ರತಿಫಲಕ ಪದಬಂಧವು ವ್ಯಕ್ತಿಯ ಅಂತರಂಗದ ಮಾತನ್ನಾಗಲಿ ಗುಂಪಿನೊಳಗಿನ ಪರಸ್ಪರ ಮಾತನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು. ‘ನಿಮ್ಮೊಳಗೆ’ ಮೂಲದ ಉದ್ದೇಶಿತ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಎರಡೂ ಸಾಧ್ಯತೆಗಳನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: ಅಬ್ರಹಾಮನು ನಮ್ಮ ತಂದೆ
  rationale: ವಂಶಪಾರಂಪರ್ಯದ ಮೇಲಿನ ದೃಢವಾದ ಹಕ್ಕುಮಂಡನೆಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅಬ್ರಹಾಮನ ಐತಿಹಾಸಿಕ ಪಿತೃತ್ವವನ್ನು ನಿರಾಕರಿಸುವುದಿಲ್ಲ.
- source_word: λέγω γὰρ ὑμῖν
  choice: ಏಕೆಂದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: γάρ ನ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ‘ಏಕೆಂದರೆ’ ಉಳಿಸುತ್ತದೆ; ಉಳಿದ ಪದಗಳು ಗಂಭೀರವಾದ ಮಾತಿನ ಸೂತ್ರವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಕೊಡುತ್ತವೆ.
- source_word: δύναται
  choice: ಸಮರ್ಥನು
  rationale: ದೇವರ ಸಾಮರ್ಥ್ಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಘನವಾದ ಶೈಲಿಯಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐκ τῶν λίθων τούτων
  choice: ಈ ಕಲ್ಲುಗಳಿಂದಲೂ
  rationale: ἐκ ಅನ್ನು ‘ಕಲ್ಲುಗಳಿಂದ’ ಎಂದು ನೇರವಾಗಿ ನೀಡಲಾಗಿದೆ. ‘ಲೂ’ ಎಂಬ ಒತ್ತುವರಿ, ಅಸಾಧ್ಯವೆನಿಸುವ ಈ ಮೂಲದಿಂದ ಸಹ ದೇವರು ಮಾಡಬಲ್ಲನೆಂಬ ಸಂದರ್ಭದ ಬಲವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: ἐγεῖραι
  choice: ಎಬ್ಬಿಸಲು
  rationale: ἐγείρω ಪದದ ‘ಎಬ್ಬಿಸು/ಉಂಟುಮಾಡು’ ಎಂಬ ರೂಪಕಶಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಪುನರುತ್ಥಾನವೆಂದು ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ಅಬ್ರಹಾಮನಿಗೆ ಸಂತತಿಯನ್ನು ಉಂಟುಮಾಡುವ ಅರ್ಥವನ್ನು ಸಂದರ್ಭವೇ ತಿಳಿಸುತ್ತದೆ.
- source_word: τέκνα
  choice: ಮಕ್ಕಳನ್ನು
  rationale: ಲಿಂಗನಿರಪೇಕ್ಷವಾದ τέκναಗೆ ನೇರ ಹಾಗೂ ಸಹಜ ಸಮಾನಾರ್ಥಕ; ಇಲ್ಲಿ ಸಂತತಿ ಎಂಬ ಸಂಬಂಧಾರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
- source_word: τῷ Ἀβραάμ
  choice: ಅಬ್ರಹಾಮನಿಗೆ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಸಂಬಂಧ/ಹಿತಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸಿ, ಅಬ್ರಹಾಮನಿಗೆ ಸೇರಿದ ಸಂತತಿ ಎಂಬ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಅಬ್ರಹಾಮನ ವಂಶಸ್ಥರಾಗಿರುವುದರ ಅರ್ಥ
  choice: ದೇವರ ಮುಂದೆ ದೈಹಿಕ ವಂಶಸಂಬಂಧವೇ ಸಾಕೆಂಬ ಭರವಸೆಯನ್ನು ವಾಕ್ಯವು ಖಂಡಿಸುತ್ತದೆ; ಆದರೆ ಅಬ್ರಹಾಮನು ಇಸ್ರಾಯೇಲಿನ ಐತಿಹಾಸಿಕ ತಂದೆ ಎಂಬುದನ್ನು ನಿರಾಕರಿಸುವುದಿಲ್ಲ.
  alternative: ಇದು ವಂಶಪಾರಂಪರ್ಯದ ಸೌಲಭ್ಯವನ್ನು ಪ್ರಶ್ನಿಸದ ಕೇವಲ ಅತಿಶಯೋಕ್ತಿ, ಅಥವಾ ಜನಾಂಗೀಯ ಇಸ್ರಾಯೇಲಿನ ಬದಲಾವಣೆಯನ್ನು ಘೋಷಿಸುವ ಹೇಳಿಕೆ.
  rationale: ಮೂಲಪಾಠವು ವಂಶದ ಮೇಲಿನ ಸ್ವಯಂನಿಶ್ಚಿತ ಭರವಸೆಯನ್ನು ನೇರವಾಗಿ ಗದರಿಸುತ್ತದೆ. ಅನಂತರದ ಯಾವುದೇ ಪಂಥೀಯ ವ್ಯವಸ್ಥೆಯನ್ನಾಗಲಿ ಪ್ರತಿಸ್ಥಾಪನಾ ಸಿದ್ಧಾಂತವನ್ನಾಗಲಿ ಅನುವಾದವು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಹಾಗೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ‘ನಿಮ್ಮೊಳಗೆ’ ಎಂಬ ಪದಪ್ರಯೋಗದಿಂದ ಮೂಲದಲ್ಲಿರುವ ಅಂತರಂಗದ ಮಾತು/ಗುಂಪಿನೊಳಗಿನ ಮಾತು ಎಂಬ ದ್ವಂದ್ವಸಾಧ್ಯತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; [a] ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಸೇರಿಸಲಾಗಿದೆ.
