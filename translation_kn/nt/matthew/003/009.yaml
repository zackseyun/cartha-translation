  to: ‘ಅಬ್ರಹಾಮನು ನಮ್ಮ ತಂದೆ’ ಎಂದು ನಿಮ್ಮೊಳಗೆ ಹೇಳಿಕೊಳ್ಳಬಹುದು ಎಂದು ಭಾವಿಸಬೇಡಿ.[a] ಏಕೆಂದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ದೇವರು ಈ ಕಲ್ಲುಗಳಿಂದ ಅಬ್ರಹಾಮನಿಗೆ ಮಕ್ಕಳನ್ನು ಉಂಟುಮಾಡಲು ಸಮರ್ಥನು.
