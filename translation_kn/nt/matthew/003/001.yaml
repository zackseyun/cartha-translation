  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: kn
  text: ಆ ದಿನಗಳಲ್ಲಿ ಸ್ನಾನ ಮಾಡಿಸುವ ಯೋಹಾನನು[a] ಯೂದಾಯದ ಅರಣ್ಯದಲ್ಲಿ ಸಾರುತ್ತಾ ಬಂದನು[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಸ್ನಾನಿಕನಾದ ಯೋಹಾನನು.”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಕಾಣಿಸಿಕೊಂಡನು.” ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲಿ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲದ ಕ್ರಿಯಾಪದವಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: ಆ ದಿನಗಳಲ್ಲಿ
  rationale: ಕಾಲಸೂಚಕ ಪದಗುಚ್ಛವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಕೊಡುತ್ತದೆ. δέ ಇಲ್ಲಿ ಸೌಮ್ಯವಾದ ನಿರೂಪಣಾ ಕೊಂಡಿಯಾಗಿರುವುದರಿಂದ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಆದರೆ’ ಅಥವಾ ‘ಈಗ’ ಎಂದು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: παραγίνεται
  choice: ಬಂದನು
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಕನ್ನಡ ನಿರೂಪಣೆಗೆ ಸಹಜವಾದ ಭೂತಕಾಲದಲ್ಲಿ ನೀಡಲಾಗಿದೆ. ಇದು ಹೊಸ ವ್ಯಕ್ತಿಯ ಕಥಾಪ್ರವೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅದ್ಭುತವಾದ ಪ್ರತ್ಯಕ್ಷತೆಯ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: Ἰωάννης
  choice: ಯೋಹಾನನು
  rationale: ಕನ್ನಡ ಸತ್ಯವೇದ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ; ಕರ್ತೃವಿಭಕ್ತಿಗೆ ತಕ್ಕಂತೆ ‘ಯೋಹಾನನು’ ಎಂದು ರೂಪಿಸಲಾಗಿದೆ.
- source_word: ὁ βαπτιστὴς
  choice: ಸ್ನಾನಿಕನಾದ
  rationale: ಯೋಹಾನನನ್ನು ಗುರುತಿಸುವ ಸ್ಥಿರ ಬಿರುದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಪರಿಚಿತವಾಗಿ ನೀಡುತ್ತದೆ. ಕ್ರಿಯಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: κηρύσσων
  choice: ಸಾರುತ್ತಾ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಡನೆ ಸಮಕಾಲೀನವಾಗಿರುವ ವರ್ತಮಾನ ಕೃದಂತದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ. ‘ಸಾರುವುದು’ ಸಾರ್ವಜನಿಕವಾಗಿ ಘೋಷಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ಅರಣ್ಯದಲ್ಲಿ
  rationale: ವಾಸವಿಲ್ಲದ, ನಿರ್ಜನ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮರಳುಗಾಡು ಎಂಬ ಅತಿಸೀಮಿತ ಆಧುನಿಕ ಕಲ್ಪನೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: τῆς Ἰουδαίας
  choice: ಯೂದಾಯದ
  rationale: ಇದು ಗೋತ್ರವಾದ ಯೆಹೂದವನ್ನಲ್ಲ, ಆ ಕಾಲದ ಭೌಗೋಳಿಕ ಪ್ರದೇಶವಾದ ಯೂದಾಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: βαπτιστής ಎಂಬ ಯೋಹಾನನ ಬಿರುದಿನ ಅನುವಾದ
  choice: ಸ್ನಾನಿಕನಾದ ಯೋಹಾನನು
  alternative: ಸ್ನಾನ ಮಾಡಿಸುವ ಯೋಹಾನನು
  rationale: ಇದು ಪಂಥೀಯ ಗುರುತಿಗಿಂತ ಯೋಹಾನನ ಕಾರ್ಯವನ್ನು ಆಧರಿಸಿದ ಬಿರುದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ಸಂಕ್ಷಿಪ್ತ ರೂಪವನ್ನು ಬಳಸಿದ್ದು, ಗ್ರೀಕ್ ಪದದ ಕ್ರಿಯಾತ್ಮಕ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನ ಪರ್ಯಾಯದಲ್ಲಿ ತೆರೆದಿಟ್ಟಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವೂ ಗೌರವಪೂರ್ಣವೂ ಆದ ನಿರೂಪಣಾ ಶೈಲಿ. ವಾಕ್ಯಾಂತ್ಯದ ಅಲ್ಪವಿರಾಮವು ಮುಂದಿನ ವಚನದಲ್ಲಿ ಮುಂದುವರಿಯುವ ಯೋಹಾನನ ಸಾರುವಿಕೆಯ ವಿಷಯಕ್ಕೆ ಕೊಂಡಿಯಾಗಿದೆ.
