id: MAT.3.6
reference: Matthew 3:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: kn
  text: ಅವರು ತಮ್ಮ ಪಾಪಗಳನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾ, ಯೊರ್ದನ್ ನದಿಯಲ್ಲಿ ಅವನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆಯುತ್ತಿದ್ದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, “ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆದರು”; ಗ್ರೀಕ್‌ನ ಅಪೂರ್ಣ ಭೂತಕಾಲವು ನಡೆಯುತ್ತಿದ್ದ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಕ್ರಿಯೆಯನ್ನು ಒತ್ತಿಹೇಳಬಹುದು: “ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆಯುತ್ತಿದ್ದರು.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ನಿಷ್ಕ್ರಿಯ ರೂಪವು ನಡೆಯುತ್ತಲೇ ಇದ್ದ ಅಥವಾ ಪುನರಾವರ್ತಿತ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸಬಹುದು. ‘ದೀಕ್ಷಾಸ್ನಾನ’ ಎಂಬ ಸ್ಥಿರ ಧಾರ್ಮಿಕ ಪದವನ್ನು ಉಳಿಸುವುದು ವಿಧಾನವನ್ನು—ಉದಾಹರಣೆಗೆ ಸಂಪೂರ್ಣ ಮುಳುಗಿಸುವುದನ್ನು—ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ‘ಮಾಡಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು’ ನಿಷ್ಕ್ರಿಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: ಯೊರ್ದನ್ ನದಿಯಲ್ಲಿ
  rationale: ἐν ಸಹಿತ ಚತುರ್ಥೀ ವಿಭಕ್ತಿ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ποταμῷ ಎಂಬ ಪದವು ಯೊರ್ದನ್ ಅನ್ನು ನದಿಯೆಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: ὑπ’ αὐτοῦ
  choice: ಅವನಿಂದ
  rationale: ὑπό ಸಹಿತ ಷಷ್ಠೀ ವಿಭಕ್ತಿ ವ್ಯಕ್ತಿಗತ ಕರ್ತೃಕಾರಕವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸರ್ವನಾಮವನ್ನು ಉಳಿಸುವುದರಿಂದ ಮೂಲದ ಅಭಿವ್ಯಕ್ತಿ ಕಾಪಾಡಲ್ಪಡುತ್ತದೆ; ಸಂದರ್ಭದಲ್ಲಿನ ಉಲ್ಲೇಖ ಯೋಹಾನನಿಗಾಗಿದೆ.
- source_word: ἐξομολογούμενοι
  choice: ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾ
  rationale: ಈ ವರ್ತಮಾನ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸಮಕಾಲೀನವಾದ ಪಾಪಗಳ ವಾಚಿಕ ಅಂಗೀಕಾರವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾ’ ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದೆ.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ತಮ್ಮ ಪಾಪಗಳನ್ನು
  rationale: ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ಕರ್ತೃಗೆ ಹಿಂದಿರುಗಿ ಸಂಬಂಧಿಸುವ ಸ್ವಾಮ್ಯವನ್ನು ಕನ್ನಡದ ಸಹಜ ಆತ್ಮವಾಚಕ ‘ತಮ್ಮ’ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: καὶ
  choice: —
  rationale: ಗ್ರೀಕ್ καὶ ಹಿಂದಿನ ವಾಕ್ಯಕ್ಕೆ ಸರಳ ಸಂಪರ್ಕ ನೀಡುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯಕ್ರಮ ಮತ್ತು ನಿರಂತರ ನಿರೂಪಣೆಯೇ ಆ ಸಂಪರ್ಕವನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತವೆ; ಪ್ರತ್ಯೇಕ ‘ಮತ್ತು’ ಬಳಸಿದರೆ ವಾಕ್ಯ ಕೃತಕವಾಗುತ್ತದೆ.
theological_decisions:
- issue: ದೀಕ್ಷಾಸ್ನಾನದ ವಿಧಾನವನ್ನು ಸೂಚಿಸುವ ಪದಪ್ರಯೋಗ
  choice: ‘ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು’ ಎಂದು ಧಾರ್ಮಿಕ ಕ್ರಿಯೆಯ ಸ್ಥಿರ ಹೆಸರನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಮುಳುಗಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು’ ಅಥವಾ ‘ತೊಳೆಯಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು’
  rationale: ಈ ವಾಕ್ಯವು ಯೊರ್ದನ್ ನದಿಯಲ್ಲಿ ಯೋಹಾನನಿಂದ ನಡೆದ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಹೇಳುತ್ತದೆ; ಆದರೆ ಅದರ ವಿಧಾನವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಯಾವುದೇ ಪಂಥೀಯ ನಿರ್ಣಯವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ಮೂಲದ ಧಾರ್ಮಿಕ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ಶೈಲಿ. ‘ತಮ್ಮ ಪಾಪಗಳನ್ನು’ ಅನ್ನು ಮೊದಲು ಇಡುವುದರಿಂದ ಕೃದಂತ ಮತ್ತು ಮುಖ್ಯ ಕ್ರಿಯೆಯ ಸಂಬಂಧ ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ. ‘ದೀಕ್ಷಾಸ್ನಾನ’ ಸ್ಥಿರ ಬೈಬಲ್-ಧಾರ್ಮಿಕ ಪದವಾಗಿದ್ದು, ಕ್ರಿಯೆಯ ವಿಧಾನವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
