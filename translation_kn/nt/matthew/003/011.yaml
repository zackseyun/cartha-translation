id: MAT.3.11
reference: Matthew 3:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: kn
  text: “ನಾನಂತೂ ಪಶ್ಚಾತ್ತಾಪಕ್ಕಾಗಿ[a] ನಿಮಗೆ ನೀರಿನಲ್ಲಿ ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುತ್ತೇನೆ. ಆದರೆ ನನ್ನ ಹಿಂದೆ ಬರುವವರು ನನಗಿಂತ ಬಲಶಾಲಿ. ಅವರ ಪಾದರಕ್ಷೆಗಳನ್ನು ಹೊರುವುದಕ್ಕೂ ನಾನು ಯೋಗ್ಯನಲ್ಲ. ಅವರೇ ನಿಮಗೆ ಪವಿತ್ರಾತ್ಮನಲ್ಲಿ[b] ಮತ್ತು ಬೆಂಕಿಯಲ್ಲಿ ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುವರು.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಪಶ್ಚಾತ್ತಾಪಕ್ಕಾಗಿ” ಎಂಬುದನ್ನು “ಪಶ್ಚಾತ್ತಾಪದ ಕಡೆಗೆ” ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು; ಗ್ರೀಕ್ ಪದಪ್ರಯೋಗವು ದಿಕ್ಕು ಅಥವಾ ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ, ಆದರೆ ದೀಕ್ಷಾಸ್ನಾನ ಮತ್ತು ಪಶ್ಚಾತ್ತಾಪದ ನಿಖರ ಸಂಬಂಧವನ್ನು ಇಲ್ಲಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
    reason: lexical_alternative
  - marker: b
    text: 'ಇಲ್ಲಿ ಮತ್ತು ಮೊದಲ ವಾಕ್ಯದಲ್ಲಿ “-ನಲ್ಲಿ” ಎಂದು ಭಾಷಾಂತರಿಸಿದ ಗ್ರೀಕ್ ಪೂರ್ವಪ್ರತ್ಯಯವನ್ನು “-ದಿಂದ” ಎಂದೂ ಭಾಷಾಂತರಿಸಬಹುದು: “ನೀರಿನಿಂದ” ಮತ್ತು “ಪವಿತ್ರಾತ್ಮನಿಂದ ಹಾಗೂ ಬೆಂಕಿಯಿಂದ.”'
    reason: lexical_alternative
  - marker: c
    text: “ಬೆಂಕಿ” ಶುದ್ಧೀಕರಣವನ್ನು ಅಥವಾ ನ್ಯಾಯತೀರ್ಪನ್ನು ಸೂಚಿಸಬಹುದು; ಗ್ರೀಕ್ ಪಠ್ಯವು ಈ ಚಿತ್ರವನ್ನು ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಒಂದೇ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುತ್ತೇನೆ / ಕೊಡುವರು
  rationale: ಕನ್ನಡ ಕ್ರೈಸ್ತ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕ್ರಿಯೆಯ ವಿಧಾನವನ್ನು ‘ಮುಳುಗಿಸುವುದು’ ಎಂದು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ವಿಧಿಸಂಬಂಧಿತ ದೀಕ್ಷಾಸ್ನಾನದ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐν ὕδατι
  choice: ನೀರಿನಲ್ಲಿ
  rationale: ἐν ಎಂಬ ಪೂರ್ವಪ್ರತ್ಯಯದ ಸ್ಥಳಾರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ನೀರಿನಿಂದ’ ಎಂಬ ಸಾಧನಾರ್ಥವೂ ಸಾಧ್ಯವಾದುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: εἰς μετάνοιαν
  choice: ಪಶ್ಚಾತ್ತಾಪಕ್ಕಾಗಿ
  rationale: εἰς ಪದದ ದಿಕ್ಕು/ಉದ್ದೇಶದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ದೀಕ್ಷಾಸ್ನಾನ ಮತ್ತು ಪಶ್ಚಾತ್ತಾಪದ ನಿಖರ ಕಾಲಕ್ರಮ ಅಥವಾ ಸಂಬಂಧವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: ಆದರೆ ನನ್ನ ಹಿಂದೆ ಬರುವವರು
  rationale: ನಿರ್ದಿಷ್ಟ ವ್ಯಕ್ತಿಯನ್ನು ಗೌರವಪೂರ್ಣ ಏಕವಚನದಲ್ಲಿ ಸೂಚಿಸುತ್ತಾ, ὀπίσω μου ಎಂಬ ಅನುಕ್ರಮದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἰσχυρότερός μού
  choice: ನನಗಿಂತ ಬಲಶಾಲಿ
  rationale: ತುಲನಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸರಳ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: ನಾನು ಯೋಗ್ಯನಲ್ಲ
  rationale: ἱκανός ಪದಕ್ಕೆ ‘ಸಮರ್ಥ/ಸಾಕಾದವನು’ ಎಂಬ ಅರ್ಥಗಳಿದ್ದರೂ, ಇಲ್ಲಿ ವಿನಯವನ್ನು ಸೂಚಿಸುವ ಸಾಂದರ್ಭಿಕ ಅರ್ಥವನ್ನು ‘ಯೋಗ್ಯನಲ್ಲ’ ಸ್ಪಷ್ಟವಾಗಿ ಹಿಡಿದಿಡುತ್ತದೆ.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: ಅವರ ಪಾದರಕ್ಷೆಗಳನ್ನು ಹೊರುವುದಕ್ಕೂ
  rationale: βαστάσαι ಎಂದರೆ ‘ಹೊರುವುದು’; ‘ಬಿಚ್ಚುವುದು’ ಅಲ್ಲ. ‘ಪಾದರಕ್ಷೆಗಳು’ ಮೂಲ ಪದದ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτὸς
  choice: ಅವರೇ
  rationale: ಯೋಹಾನನ ಕ್ರಿಯೆಗೆ ವಿರುದ್ಧವಾಗಿ ಮುಂದಿನ ವ್ಯಕ್ತಿಯನ್ನೇ ಒತ್ತಿಹೇಳುವ ಗ್ರೀಕ್ ಸರ್ವನಾಮದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: ಪವಿತ್ರಾತ್ಮನಲ್ಲಿ
  rationale: ವೈಯಕ್ತಿಕ ಪವಿತ್ರಾತ್ಮನ ಉಲ್ಲೇಖವನ್ನು ಕನ್ನಡದ ಪ್ರಮಾಣಿತ ರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ ಮತ್ತು ಪುನರಾವರ್ತಿತ ἐν ರಚನೆಯನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ πυρί
  choice: ಮತ್ತು ಬೆಂಕಿಯಲ್ಲಿ
  rationale: ‘ಬೆಂಕಿ’ ಎಂಬ ರೂಪಕವನ್ನು ವಿವರಣೆ ಸೇರಿಸದೆ ನೇರವಾಗಿ ಉಳಿಸಿ, ಶುದ್ಧೀಕರಣ ಮತ್ತು ನ್ಯಾಯತೀರ್ಪಿನ ಸಾಧ್ಯ ಅರ್ಥಗಳ ನಡುವಿನ ಮುಕ್ತತೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ.
theological_decisions:
- issue: ‘ಪವಿತ್ರಾತ್ಮ ಮತ್ತು ಬೆಂಕಿ’ ಎಂಬುದರ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಪವಿತ್ರಾತ್ಮನಲ್ಲಿ ಮತ್ತು ಬೆಂಕಿಯಲ್ಲಿ’ ಎಂಬ ನೇರ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಶುದ್ಧೀಕರಿಸುವ ಬೆಂಕಿ’ ಅಥವಾ ‘ನ್ಯಾಯತೀರ್ಪಿನ ಬೆಂಕಿ’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಬೆಂಕಿಯ ಚಿತ್ರವನ್ನು ಸ್ವತಃ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ಸಮೀಪದ ಸಂದರ್ಭವು ವಿಶೇಷವಾಗಿ ನ್ಯಾಯತೀರ್ಪಿನ ಧ್ವನಿಯನ್ನು ಹೊಂದಿದ್ದರೂ, ಭಾಷಾಂತರವು ರೂಪಕದ ವ್ಯಾಪ್ತಿಯನ್ನು ಮೌನವಾಗಿ ಸೀಮಿತಗೊಳಿಸಬಾರದು.
- issue: πνεύματι ἁγίῳ ಎಂಬುದರ ಉಲ್ಲೇಖ
  choice: ‘ಪವಿತ್ರಾತ್ಮ’ ಎಂದು ವೈಯಕ್ತಿಕ ಉಲ್ಲೇಖವಾಗಿ ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
  alternative: ‘ಪವಿತ್ರ ಶಕ್ತಿ’ ಅಥವಾ ಅನಿರ್ದಿಷ್ಟ ‘ಪವಿತ್ರ ಆತ್ಮ’.
  rationale: ಮತ್ತಾಯನ ಸಂದರ್ಭ ಮತ್ತು ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಸಾಮಾನ್ಯ ಬಳಕೆಯಲ್ಲಿ ಇದು ಪವಿತ್ರಾತ್ಮನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಶಕ್ತಿ’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ಸೇರ್ಪಡೆ ಮೂಲದಲ್ಲಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ, ವಾಚನಯೋಗ್ಯ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವನ್ನು ಸೂಚಿಸುವ ಕ್ರಿಯಾಪದಗಳು ಮತ್ತು ಸರ್ವನಾಮಗಳಿಗೆ ಗೌರವಪೂರ್ಣ ಏಕವಚನ ರೂಪ ಬಳಸಲಾಗಿದೆ. ‘ದೀಕ್ಷಾಸ್ನಾನ’ ಎಂಬ ಸ್ಥಿರ ಕ್ರೈಸ್ತ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡರೂ, ನಿರ್ದಿಷ್ಟ ದೀಕ್ಷಾಸ್ನಾನ ವಿಧಾನವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕ್ರಮವಾಗಿ ಸೇರಿವೆ.
