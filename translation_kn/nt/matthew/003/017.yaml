id: MAT.3.17
reference: Matthew 3:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: kn
  text: 'ಇಗೋ, ಪರಲೋಕಗಳಿಂದ[a] ಒಂದು ಧ್ವನಿ ಹೀಗೆ ಹೇಳಿತು: “ಇವನು ನನ್ನ ಪ್ರಿಯ ಮಗನು; ಇವನಲ್ಲಿ ನಾನು ಸಂತೋಷಪಟ್ಟಿದ್ದೇನೆ.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಪರಲೋಕದಿಂದ.” ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ “ಪರಲೋಕಗಳಿಂದ” ಎಂಬ ಬಹುವಚನವಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ಇವನ ವಿಷಯದಲ್ಲಿ ನಾನು ಸಂತೋಷಪಟ್ಟಿದ್ದೇನೆ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: ಇಗೋ
  rationale: ಇದು ಗಮನವನ್ನು ಮಹತ್ವದ ಘಟನೆಯ ಕಡೆಗೆ ಸೆಳೆಯುವ ಸಂವಾದ ಸೂಚಕ. ‘ಇಗೋ’ ಎಂಬುದು ಮೂಲದ ಗಂಭೀರ ಮತ್ತು ಗಮನಾಕರ್ಷಕ ಸ್ವರವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಇಲ್ಲಿ καί ಅನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದಿರುವುದು ಕನ್ನಡದ ಹರಿವಿಗೆ ಅನುಕೂಲ.
- source_word: φωνὴ
  choice: ಒಂದು ಧ್ವನಿ
  rationale: ಮುಂದೆ ನೇರ ಮಾತು ಬರುವುದರಿಂದ ಇಲ್ಲಿ φωνή ಕೇವಲ ಶಬ್ದವನ್ನಲ್ಲ, ಮಾತನಾಡುವ ಧ್ವನಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐκ τῶν οὐρανῶν
  choice: ಪರಲೋಕಗಳಿಂದ
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಪರಲೋಕ’ ಎಂಬುದು ಈ ದೈವಿಕ ಘೋಷಣೆಯ ಸಂದರ್ಭಕ್ಕೆ ‘ಆಕಾಶ’ಕ್ಕಿಂತ ಸೂಕ್ತವಾಗಿದೆ; ಪರಿಚಿತ ಏಕವಚನ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: λέγουσα
  choice: ಹೀಗೆ ಹೇಳಿತು
  rationale: ಈ ಕೃದಂತವು ‘ಧ್ವನಿ’ಯನ್ನು ವಿವರಿಸಿ ಉಲ್ಲೇಖಿತ ಮಾತನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪೂರ್ಣ ಕ್ರಿಯಾಪದದ ರೂಪ ಹೆಚ್ಚು ಸಹಜ.
- source_word: Οὗτός ἐστιν
  choice: ಇವನು
  rationale: ಗುರುತಿಸುವ ಬಲವನ್ನು ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ರೂಪ; ‘ಇವನೇ’ ಎಂದು ಹೆಚ್ಚುವರಿ ಒತ್ತನ್ನು ಮೂಲದಲ್ಲಿ ಇಲ್ಲದಂತೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: ನನ್ನ ಪ್ರಿಯ ಮಗನು
  rationale: ‘ಮಗನು’ ಎಂಬ ಸಂಬಂಧಪದವನ್ನೂ ἀγαπητός ಸೂಚಿಸುವ ಪ್ರೀತಿಪಾತ್ರತೆಯನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ. ‘ಪ್ರಿಯ’ ಎಂಬುದು dignified ಆಗಿಯೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿಯೂ ಇದೆ.
- source_word: ἐν ᾧ
  choice: ಇವನ ವಿಷಯದಲ್ಲಿ
  rationale: εὐδοκέω ಜೊತೆಯಲ್ಲಿರುವ ಈ ನುಡಿಗಟ್ಟನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ‘ಇವನಲ್ಲಿ’ ಎಂಬ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: εὐδόκησα
  choice: ನಾನು ಬಹಳ ಸಂತೋಷಪಟ್ಟಿದ್ದೇನೆ
  rationale: ಈ ದೈವಿಕ ಘೋಷಣೆಯಲ್ಲಿ ದೇವರ ಮೆಚ್ಚುಗೆ ಮತ್ತು ಸಂತೋಷವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ. ಗ್ರೀಕ್ aorist ಅನ್ನು ಕನ್ನಡದ ಪೂರ್ಣ ವರ್ತಮಾನ ರೂಪದಲ್ಲಿ ನೀಡುವುದರಿಂದ ಹಿಂದಿನ ಕ್ರಿಯೆಯಷ್ಟೇ ಅಲ್ಲ, ಈಗಲೂ ಅನ್ವಯಿಸುವ ಮೆಚ್ಚುಗೆಯ ಸ್ಥಿತಿ ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಪುತ್ರತ್ವದ ದೈವಿಕ ಘೋಷಣೆ
  choice: ನನ್ನ ಪ್ರಿಯ ಮಗನು
  alternative: ನಾನು ಬಹಳವಾಗಿ ಪ್ರೀತಿಸುವ ನನ್ನ ಮಗನು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಪುತ್ರತ್ವ ಮತ್ತು ಪ್ರೀತಿಪಾತ್ರತೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ದತ್ತಕಪುತ್ರತ್ವವನ್ನಾಗಲಿ ಇತರ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನಾಗಲಿ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- issue: οὐρανῶν ಎಂಬ ಬಹುವಚನ
  choice: ಪರಲೋಕಗಳಿಂದ
  alternative: ಪರಲೋಕದಿಂದ
  rationale: ಮೂಲದ ಬಹುವಚನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಕನ್ನಡದಲ್ಲಿ ಹೆಚ್ಚು ಪರಿಚಿತವಾದ ಏಕವಚನವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ἐν ᾧ εὐδόκησα ಎಂಬ ನುಡಿಗಟ್ಟು
  choice: ಇವನ ವಿಷಯದಲ್ಲಿ ನಾನು ಬಹಳ ಸಂತೋಷಪಟ್ಟಿದ್ದೇನೆ
  alternative: ಇವನಲ್ಲಿ ನಾನು ಸಂತೋಷಪಟ್ಟಿದ್ದೇನೆ
  rationale: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜ ಕನ್ನಡವನ್ನು ಬಳಸಲಾಗಿದೆ; ಆದರೂ ಮೂಲದ ἐν (‘ನಲ್ಲಿ’) ರೂಪದ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಿ, ಸಂಬಂಧದ ಸ್ವರೂಪವನ್ನು ಅನಗತ್ಯವಾಗಿ ಒಂದೇ ರೀತಿಗೆ ಸೀಮಿತಗೊಳಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಇಗೋ’ ದೈವಿಕ ಘಟನೆಯ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಉಳಿದ ವಾಕ್ಯರಚನೆ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ ಇಡಲಾಗಿದೆ.
