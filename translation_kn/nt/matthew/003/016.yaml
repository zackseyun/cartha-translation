id: MAT.3.16
reference: Matthew 3:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: kn
  text: ಯೇಸು ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆದಾಗ, ತಕ್ಷಣವೇ ನೀರಿನಿಂದ ಮೇಲಕ್ಕೆ ಬಂದರು. ಆಗ ಇಗೋ, ಆಕಾಶಗಳು ತೆರೆಯಲ್ಪಟ್ಟವು; ದೇವರ ಆತ್ಮವು ಪಾರಿವಾಳದಂತೆ ಇಳಿದು ಯೇಸುವಿನ ಮೇಲೆ ಬರುತ್ತಿರುವುದನ್ನು ಅವರು ಕಂಡರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: ಯೇಸು ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆದ ಕೂಡಲೇ
  rationale: Aorist passive participle is rendered with a natural Kannada temporal construction while retaining the passive sense; δέ functions as a mild narrative connective and need not be represented separately.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: ಕೂಡಲೇ ನೀರಿನಿಂದ ಮೇಲಕ್ಕೆ ಬಂದರು
  rationale: εὐθύς conveys immediacy, while ἀπό is represented precisely by ‘ನೀರಿನಿಂದ,’ avoiding the stronger interpretive wording ‘ನೀರಿನೊಳಗಿಂದ.’
- source_word: ἰδοὺ
  choice: ಆಗ ಇಗೋ
  rationale: ‘ಇಗೋ’ preserves the vivid attention-directing force; ‘ಆಗ’ links it naturally to Kannada narrative flow.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: ಆಕಾಶಗಳು ತೆರೆಯಲ್ಪಟ್ಟವು
  rationale: The plural ‘ಆಕಾಶಗಳು’ reflects οἱ οὐρανοί, and the passive form is retained rather than flattened to an intransitive expression.
- source_word: πνεῦμα θεοῦ
  choice: ದೇವರ ಆತ್ಮವು
  rationale: Preserves the Greek genitive expression without replacing it with the more interpretive title ‘ಪವಿತ್ರಾತ್ಮ.’
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: ಪಾರಿವಾಳದಂತೆ ಇಳಿದು
  rationale: The comparison marked by ὡσεὶ is retained, without identifying the Spirit literally as a dove.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: ತಮ್ಮ ಮೇಲೆ ಬರುವುದನ್ನು
  rationale: Closely reflects the ordinary sense of ἔρχομαι plus ἐπί and avoids the more specific, interpretive ‘ಬಂದು ಕುಳಿತುಕೊಳ್ಳುವುದನ್ನು.’
- source_word: εἶδεν
  choice: ಅವರು ಕಂಡರು
  rationale: The singular respectful pronoun and verb form are natural in dignified modern Kannada; the grammatical subject remains Jesus.
theological_decisions:
- issue: Whether πνεῦμα θεοῦ should be explicitly rendered as the Holy Spirit
  choice: ದೇವರ ಆತ್ಮವು
  alternative: ಪವಿತ್ರಾತ್ಮನು
  rationale: The baptismal context supports reference to the Holy Spirit, but the translation preserves Matthew’s exact expression and does not make the title more explicit than the Greek.
- issue: Whether the Spirit is identified as a dove or compared to one
  choice: ಪಾರಿವಾಳದಂತೆ
  alternative: ಪಾರಿವಾಳವಾಗಿ
  rationale: ὡσεὶ marks likeness or comparison, so the rendering does not assert that the Spirit literally became or was a dove.
- issue: Whether the opened heavens are singular sky or plural heavens
  choice: ಆಕಾಶಗಳು
  alternative: ಆಕಾಶ
  rationale: The plural is preserved to retain the wording and possible cosmological resonance of the Greek without resolving it into ordinary meteorological sky.
translation_notes:
  register: Modern standard Kannada with a dignified biblical register. Respectful singular forms are used for Jesus. The wording remains accessible while preserving the Greek passive, plural ‘heavens,’ comparative image, and lexical restraint.
