revisions:
- from: ಯೇಸು ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆದ ಕೂಡಲೇ ನೀರಿನಿಂದ ಮೇಲಕ್ಕೆ ಬಂದರು. ಆಗ ಇಗೋ, ಆಕಾಶಗಳು ತೆರೆಯಲ್ಪಟ್ಟವು; ದೇವರ ಆತ್ಮವು ಪಾರಿವಾಳದಂತೆ ಇಳಿದು ತಮ್ಮ ಮೇಲೆ ಬರುವುದನ್ನು ಅವರು ಕಂಡರು.[a]
  to: ಯೇಸು ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆದಾಗ, ತಕ್ಷಣವೇ ನೀರಿನಿಂದ ಮೇಲಕ್ಕೆ ಬಂದರು. ಆಗ ಇಗೋ, ಆಕಾಶಗಳು ತೆರೆಯಲ್ಪಟ್ಟವು; ದೇವರ ಆತ್ಮವು ಪಾರಿವಾಳದಂತೆ ಇಳಿದು ಯೇಸುವಿನ ಮೇಲೆ ಬರುತ್ತಿರುವುದನ್ನು ಅವರು ಕಂಡರು.
  rationale: The revision places “ತಕ್ಷಣವೇ” with “ಮೇಲಕ್ಕೆ ಬಂದರು,” matching εὐθὺς ἀνέβη, while retaining the baptism as the preceding participial circumstance. It also replaces the respectful reflexive with the explicit referent “ಯೇಸುವಿನ ಮೇಲೆ,” so no clarifying footnote is required. The renderings of the plural heavens, Spirit of God, and dove comparison are retained.
  reviewer_model: gpt-5.6-terra
