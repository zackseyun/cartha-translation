id: MAT.10.16
reference: Matthew 10:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: kn
  text: “ಇಗೋ, ನಾನು ನಿಮ್ಮನ್ನು ತೋಳಗಳ ನಡುವೆ ಕುರಿಗಳಂತೆ ಕಳುಹಿಸುತ್ತಿದ್ದೇನೆ. ಆದ್ದರಿಂದ ಹಾವುಗಳಂತೆ ವಿವೇಕಿಗಳೂ ಪಾರಿವಾಳಗಳಂತೆ ನಿಷ್ಕಪಟರೂ ಆಗಿರಿ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ಇಗೋ
  rationale: ಗಮನ ಸೆಳೆಯುವ ಮೂಲ ಉದ್ಗಾರವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಘನತೆಯಿಂದ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀποστέλλω
  choice: ಕಳುಹಿಸುತ್ತಿದ್ದೇನೆ
  rationale: ಯೇಸು ಈಗ ಶಿಷ್ಯರನ್ನು ನಿಯೋಗಿಸಿ ಕಳುಹಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν μέσῳ λύκων
  choice: ತೋಳಗಳ ಮಧ್ಯಕ್ಕೆ
  rationale: ಅಪಾಯಕರ ಪರಿಸರದೊಳಗೆ ಕಳುಹಿಸಲಾಗುತ್ತಿದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: φρόνιμοι
  choice: ಜಾಣರು
  rationale: ಸಂದರ್ಭೋಚಿತ ವಿವೇಕ ಮತ್ತು ಎಚ್ಚರಿಕೆಯ ಪ್ರಾಯೋಗಿಕ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀκέραιοι
  choice: ನಿಷ್ಕಪಟರು
  rationale: ಕೆಡುಕು ಬೆರೆಯದ, ಹಾನಿ ಮಾಡದ ಸರಳ ಸ್ವಭಾವದ ಅರ್ಥವನ್ನು ಹಿಡಿದಿಡುತ್ತದೆ; ‘ನಿರ್ದೋಷಿಗಳು’ ಎಂಬ ನ್ಯಾಯಾಂಗಧ್ವನಿಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ὄφεις / περιστεραί
  choice: ಹಾವುಗಳು / ಪಾರಿವಾಳಗಳು
  rationale: ಮೂಲದ ಎರಡು ಜೀವಂತ ಉಪಮಾನಗಳನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಹಾವುಗಳ ಜಾಣತನ ಮತ್ತು ಪಾರಿವಾಳಗಳ ನಿಷ್ಕಪಟತೆಯ ನಡುವಿನ ಒತ್ತಡ
  choice: “ಹಾವುಗಳಂತೆ ಜಾಣರೂ ಪಾರಿವಾಳಗಳಂತೆ ನಿಷ್ಕಪಟರೂ” ಎಂಬ ಸಮಾನಾಂತರ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಜಾಣತನವನ್ನು ‘ಕುತಂತ್ರ’ ಎಂದಾಗಲಿ, ನಿಷ್ಕಪಟತೆಯನ್ನು ‘ಅಮಾಯಕತನ’ ಎಂದಾಗಲಿ ವಿವರಣಾತ್ಮಕವಾಗಿ ಬದಲಿಸುವುದು.
  rationale: ಮೂಲವು ವಿವೇಕ ಮತ್ತು ನೈತಿಕ ಅಕಳಂಕತೆ ಎರಡನ್ನೂ ಒಟ್ಟಿಗೆ ಆಜ್ಞಾಪಿಸುತ್ತದೆ; ಯಾವುದನ್ನೂ ಮತ್ತೊಂದರ ಮೂಲಕ ಸಡಿಲಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವ, ಆದರೆ ಶಾಸ್ತ್ರೋಚಿತ ಘನತೆ ಉಳಿಸುವ ಶೈಲಿ. ಬಹುವಚನ ಆಜ್ಞಾರ್ಥದಲ್ಲಿ ‘ಆಗಿರಿ’ ಬಳಸಲಾಗಿದೆ.
