review_pass:
  verdict: revise
  source_fidelity: The first clause accurately renders the future passive ἀχθήσεσθε, the judicial force of ἐπὶ + accusative, and ἕνεκεν ἐμοῦ. However, ‘ಆಗ ನೀವು ... ಸಾಕ್ಷಿಯಾಗುವಿರಿ’ introduces a temporal ‘then’ absent from the Greek and shifts εἰς μαρτύριον (‘as/for a testimony’) into a personal predication (‘you will become witnesses’). Rendering the compelled appearance as testimony better preserves the Greek construction.
  naturalness: ‘ರಾಜ್ಯಪಾಲರ ಮತ್ತು ಅರಸರ ಮುಂದೆ ಕರೆದೊಯ್ಯಲಾಗುವುದು’ is natural modern standard Kannada. The revised single-sentence construction is also natural and avoids implying an additional subsequent event.
  terminology: ‘ರಾಜ್ಯಪಾಲರು,’ ‘ಅರಸರು,’ and ‘ಅನ್ಯಜನರು’ are appropriate in a dignified modern biblical register. ‘ಸಾಕ್ಷಿಯಾಗಿ’ retains the neutral noun-based sense of μαρτύριον. The footnote correctly preserves the possible contextual adversative implication without imposing it in the text.
  issues:
  - severity: medium
    issue: The phrase ‘ಆಗ ನೀವು ಅವರಿಗೆ ಮತ್ತು ಅನ್ಯಜನರಿಗೆ ಸಾಕ್ಷಿಯಾಗುವಿರಿ’ adds a temporal sequence and recasts ‘as a testimony’ as ‘you will be witnesses.’
    rationale: Greek has no equivalent of ‘ಆಗ’ and uses εἰς μαρτύριον, a purpose/result phrase describing the bearing of testimony. ‘ಸಾಕ್ಷಿಯಾಗಿ ... ಕರೆದೊಯ್ಯಲಾಗುವುದು’ preserves both the passive judicial setting and the noun-based testimony expression.
  revised_text: ನನ್ನ ನಿಮಿತ್ತವಾಗಿ, ಅವರಿಗೆ[b] ಮತ್ತು ಅನ್ಯಜನರಿಗೆ[a] ಸಾಕ್ಷಿಯಾಗಿ, ನಿಮ್ಮನ್ನು ರಾಜ್ಯಪಾಲರ ಮತ್ತು ಅರಸರ ಮುಂದೆ ಕರೆದೊಯ್ಯಲಾಗುವುದು.
