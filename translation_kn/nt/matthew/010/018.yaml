id: MAT.10.18
reference: Matthew 10:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: kn
  text: ನನ್ನ ನಿಮಿತ್ತವಾಗಿ, ಅವರಿಗೆ[b] ಮತ್ತು ಅನ್ಯಜನರಿಗೆ[a] ಸಾಕ್ಷಿಯಾಗಿ, ನಿಮ್ಮನ್ನು ರಾಜ್ಯಪಾಲರ ಮತ್ತು ಅರಸರ ಮುಂದೆ ಕರೆದೊಯ್ಯಲಾಗುವುದು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಜನಾಂಗಗಳಿಗೆ.”
    reason: lexical_alternative
  - marker: b
    text: “ಅವರಿಗೆ” ಎಂಬುದನ್ನು ಸಂದರ್ಭದಲ್ಲಿ “ಅವರಿಗೆ ವಿರುದ್ಧವಾಗಿ” ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು; ಆದರೆ ಗ್ರೀಕ್ ದತ್ತಿವಿಭಕ್ತಿ ಸ್ವತಃ ಅದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: ರಾಜ್ಯಪಾಲರ ಮತ್ತು ಅರಸರ ಮುಂದೆ
  rationale: ἐπί + accusative ಮತ್ತು ಕರೆದೊಯ್ಯುವ ಕ್ರಿಯಾಪದವು ಅಧಿಕಾರಿಗಳ ಸಮ್ಮುಖದಲ್ಲಿ ಹಾಜರುಪಡಿಸುವ ಅರ್ಥ ನೀಡುತ್ತದೆ. ἡγεμώνಗೆ ‘ರಾಜ್ಯಪಾಲ’ ಮತ್ತು βασιλεύςಗೆ ‘ಅರಸ’ ಸಹಜ ಹಾಗೂ ಗೌರವಯುತ ಕನ್ನಡ ಪದಗಳು.
- source_word: ἀχθήσεσθε
  choice: ನಿಮ್ಮನ್ನು ... ಕರೆದೊಯ್ಯಲಾಗುವುದು
  rationale: ἄγω ಕ್ರಿಯಾಪದದ ಭವಿಷ್ಯತ್ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿ ಸ್ಪಷ್ಟವಿಲ್ಲದ ಹಿಂಸಾತ್ಮಕ ಬಲವಂತವನ್ನು ‘ಎಳೆದುಕೊಂಡು ಹೋಗುವುದು’ ಎಂಬಂತೆ ಅತಿಯಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: ἕνεκεν ἐμοῦ
  choice: ನನ್ನ ನಿಮಿತ್ತವಾಗಿ
  rationale: ಕಾರಣ ಅಥವಾ ನಿಮಿತ್ತವನ್ನು ಸೂಚಿಸುವ ἕνεκεν + genitive ಅರ್ಥವನ್ನು dignified, current Kannadaಯಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς μαρτύριον
  choice: ಸಾಕ್ಷಿಯಾಗುವಿರಿ
  rationale: εἰς ಇಲ್ಲಿ ಉದ್ದೇಶ ಅಥವಾ ಫಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಸಾಕ್ಷಿಗಾಗಿ’ಗಿಂತ ‘ಸಾಕ್ಷಿಯಾಗುವಿರಿ’ ಹೆಚ್ಚು ಸಹಜವಾಗಿದ್ದು, ಅವರ ಹಾಜರುಪಡಿಸುವಿಕೆಯು ಸಾಕ್ಷಿಯಾಗಿ ಪರಿಣಮಿಸುವ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ಈ ದತ್ತಿವಿಭಕ್ತಿ ಸರ್ವನಾಮವು ಸಹಜವಾಗಿ ರಾಜ್ಯಪಾಲರು ಮತ್ತು ಅರಸರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಗ್ರೀಕ್ ಸ್ವತಃ ‘ಅವರಿಗೆ ವಿರುದ್ಧವಾಗಿ’ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸದ ಕಾರಣ ತಟಸ್ಥ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῖς ἔθνεσιν
  choice: ಅನ್ಯಜನರಿಗೆ
  rationale: ಮತ್ತಾಯನ ಸಂದರ್ಭಗಳಲ್ಲಿ ἔθνη ಪದವು ಅನೇಕ ಬಾರಿ ಇಸ್ರಾಯೇಲ್ಯರಲ್ಲದ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅನ್ಯಜನರು’ ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಈ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ; ‘ಜನಾಂಗಗಳು’ ಎಂಬ ಶಾಬ್ದಿಕ ಪರ್ಯಾಯವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: μαρτύριον αὐτοῖς ಎಂಬ ಪದಗುಚ್ಛದ ಬಲ
  choice: ತಟಸ್ಥವಾದ ‘ಅವರಿಗೆ ... ಸಾಕ್ಷಿ’
  alternative: ‘ಅವರಿಗೆ ವಿರುದ್ಧವಾದ ಸಾಕ್ಷಿ’
  rationale: αὐτοῖς ಎಂಬ ದತ್ತಿವಿಭಕ್ತಿ ಸ್ವತಃ ವಿರೋಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಕಡ್ಡಾಯಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಸಾಕ್ಷಿಯು ಆಹ್ವಾನವಾಗಬಹುದೋ ಅಥವಾ ತಿರಸ್ಕಾರದ ಸಂದರ್ಭದಲ್ಲಿ ಅವರ ವಿರುದ್ಧದ ಸಾಕ್ಷಿಯಾಗಬಹುದೋ ಎಂಬ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಮುಖ್ಯ ಪಠ್ಯವು ನಿರ್ಣಯಿಸದೆ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಮೂಲದ ನ್ಯಾಯಾಂಗ ಸನ್ನಿವೇಶವನ್ನು ‘ಮುಂದೆ ಕರೆದೊಯ್ಯಲಾಗುವುದು’ ಮೂಲಕ ಉಳಿಸಿ, ಸ್ಪಷ್ಟವಲ್ಲದ ಹಿಂಸೆ ಅಥವಾ ದಂಡನೆಯ ಅರ್ಥವನ್ನು ಸೇರಿಸಿಲ್ಲ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿತ ಪದಗಳ ಬಳಿಕ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
