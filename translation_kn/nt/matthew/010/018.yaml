revisions:
- from: ನನ್ನ ನಿಮಿತ್ತವಾಗಿ ನಿಮ್ಮನ್ನು ರಾಜ್ಯಪಾಲರ ಮತ್ತು ಅರಸರ ಮುಂದೆ ಕರೆದೊಯ್ಯಲಾಗುವುದು. ಆಗ ನೀವು ಅವರಿಗೆ[b] ಮತ್ತು ಅನ್ಯಜನರಿಗೆ[a] ಸಾಕ್ಷಿಯಾಗುವಿರಿ.
  to: ನನ್ನ ನಿಮಿತ್ತವಾಗಿ, ಅವರಿಗೆ[b] ಮತ್ತು ಅನ್ಯಜನರಿಗೆ[a] ಸಾಕ್ಷಿಯಾಗಿ, ನಿಮ್ಮನ್ನು ರಾಜ್ಯಪಾಲರ ಮತ್ತು ಅರಸರ ಮುಂದೆ ಕರೆದೊಯ್ಯಲಾಗುವುದು.
  rationale: The revision removes the unsupported temporal connective and retains εἰς μαρτύριον as ‘ಸಾಕ್ಷಿಯಾಗಿ,’ linking the disciples’ being brought before authorities to its testimonial purpose/result. Footnote anchors remain attached to their respective terms, and the lexical alternative and contextual ambiguity are preserved.
