id: MAT.10.1
reference: Matthew 10:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: kn
  text: ಯೇಸು ತನ್ನ ಹನ್ನೆರಡು ಶಿಷ್ಯರನ್ನು ತನ್ನ ಬಳಿಗೆ ಕರೆದು, ಅಶುದ್ಧಾತ್ಮಗಳ ಮೇಲೆ ಅವರಿಗೆ ಅಧಿಕಾರವನ್ನು ಕೊಟ್ಟನು; ಅವರು ಅವುಗಳನ್ನು ಹೊರಹಾಕುವುದಕ್ಕೂ ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ ಗುಣಪಡಿಸುವುದಕ್ಕೂ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ರೋಗ’ ಮತ್ತು ‘ಅಸ್ವಸ್ಥತೆ’ ಎಂಬವು νόσος ಮತ್ತು μαλακία ಎಂಬ ಸಂಬಂಧಿತ ಎರಡು ಗ್ರೀಕ್ ಪದಗಳನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತವೆ; ಎರಡನೆಯದನ್ನು ‘ದೌರ್ಬಲ್ಯ’ ಎಂದೂ ಭಾಷಾಂತರಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ತನ್ನ ಬಳಿಗೆ ಕರೆದು
  rationale: ಅಓರಿಸ್ಟ್ ಮಧ್ಯಮ ಕೃದಂತದ ಪೂರ್ವಕ್ರಿಯೆಯನ್ನೂ, προσκαλέομαι ಎಂಬ ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ‘ತನ್ನ ಬಳಿಗೆ ಕರೆಯುವುದು’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: ತನ್ನ ಹನ್ನೆರಡು ಶಿಷ್ಯರನ್ನು
  rationale: μαθητής ಎಂಬುದಕ್ಕೆ ಸುವಾರ್ತೆಗಳ ಸಂದರ್ಭದಲ್ಲಿ ರೂಢಿಯಾದ ‘ಶಿಷ್ಯ’ ಸೂಕ್ತ; αὐτοῦ ಅನ್ನು ಸಹಜವಾಗಿ ‘ತನ್ನ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἔδωκεν
  choice: ಕೊಟ್ಟನು
  rationale: δίδωμι ಎಂಬ ಸರಳ ಕ್ರಿಯಾಪದದ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐξουσίαν πνευμάτων ἀκαθάρτων
  choice: ಅಶುದ್ಧಾತ್ಮಗಳ ಮೇಲೆ ಅಧಿಕಾರವನ್ನು
  rationale: ἐξουσία ಇಲ್ಲಿ ಕೇವಲ ಶಕ್ತಿಗಿಂತ ಅಧಿಕಾರ ಅಥವಾ ಹಕ್ಕನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಂಬಂಧವಾಚಕ ವಿಭಕ್ತಿಯು ಆತ್ಮಗಳ ಮೇಲೆ ಚಲಾಯಿಸುವ ಅಧಿಕಾರವೆಂದು ಸಂದರ್ಭದಿಂದ ತಿಳಿಯುತ್ತದೆ.
- source_word: ὥστε ἐκβάλλειν αὐτά
  choice: ಅಶುದ್ಧಾತ್ಮಗಳನ್ನು ಹೊರಗಟ್ಟುವುದಕ್ಕೆ
  rationale: ὥστε ಜೊತೆಯ ಅನಂತಕ್ರಿಯಾಪದವು ಉದ್ದೇಶ/ಪರಿಣಾಮದ ನಡುವಿನ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಹೊಂದಿದೆ; ಕನ್ನಡದ ‘-ವುದಕ್ಕೆ’ ಅದನ್ನು ಅನಗತ್ಯವಾಗಿ ಒಂದೇ ರೀತಿಗೆ ಸೀಮಿತಗೊಳಿಸದೆ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: θεραπεύειν
  choice: ಗುಣಪಡಿಸುವುದಕ್ಕೆ
  rationale: ರೋಗಿಗಳನ್ನು ಸ್ವಸ್ಥಗೊಳಿಸುವ ಸಂದರ್ಭಾರ್ಥವನ್ನು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ಎಲ್ಲ ಬಗೆಯ ರೋಗಗಳನ್ನೂ ಅಸ್ವಸ್ಥತೆಗಳನ್ನೂ
  rationale: νόσος ಮತ್ತು μαλακία ಎಂಬ ಸಂಬಂಧಿತವಾದರೂ ವಿಭಿನ್ನ ಎರಡು ಪದಗಳನ್ನು ‘ರೋಗ’ ಮತ್ತು ‘ಅಸ್ವಸ್ಥತೆ’ ಎಂದು ಬೇರ್ಪಡಿಸಿ ಉಳಿಸಲಾಗಿದೆ; ಪುನರಾವರ್ತಿತ πᾶσαν ಅನ್ನು ಸಹಜ ಕನ್ನಡದ ‘ಎಲ್ಲ ಬಗೆಯ …-ಗಳನ್ನೂ …-ಗಳನ್ನೂ’ ಮೂಲಕ ವ್ಯಾಪಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಶಿಷ್ಯರಿಗೆ ಕೊಡಲಾದ ἐξουσίαಯ ಸ್ವರೂಪ
  choice: ಅಶುದ್ಧಾತ್ಮಗಳ ಮೇಲೆ ಅಧಿಕಾರ
  alternative: ಅಶುದ್ಧಾತ್ಮಗಳ ಮೇಲೆ ಶಕ್ತಿ
  rationale: ἐξουσίαಯು ಇಲ್ಲಿ ಯೇಸುವಿನಿಂದ ಕೊಡಲ್ಪಟ್ಟ ಕಾರ್ಯನಿರ್ವಹಣೆಯ ಅಧಿಕಾರವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಶಕ್ತಿ’ ಎಂದರೆ ಕೇವಲ ಸಾಮರ್ಥ್ಯವೆಂಬ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತವಾಗುವ ಸಾಧ್ಯತೆ ಇದೆ.
- issue: ὥστεಯ ಉದ್ದೇಶ/ಪರಿಣಾಮದ ಸೂಕ್ಷ್ಮತೆ
  choice: ಹೊರಗಟ್ಟುವುದಕ್ಕೂ … ಗುಣಪಡಿಸುವುದಕ್ಕೂ
  alternative: ಹೊರಗಟ್ಟುವಂತೆ ಮತ್ತು ಗುಣಪಡಿಸುವಂತೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಉದ್ದೇಶ ಮತ್ತು ಫಲಿತಾಂಶ ಎರಡಕ್ಕೂ ತೆರೆದಿರುವ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಅದನ್ನು ಕೇವಲ ಉದ್ದೇಶ ಅಥವಾ ಕೇವಲ ಪರಿಣಾಮವೆಂದು ನಿರ್ಣಯಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಅಶುದ್ಧಾತ್ಮ’, ‘ಶಿಷ್ಯ’, ‘ಅಧಿಕಾರ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಗಳನ್ನು ಉಳಿಸಿ, ಅತಿಯಾಗಿ ಪಂಥೀಯ ಅಥವಾ ಪುರಾತನ ಶೈಲಿಯನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
