review_pass:
  verdict: revise
  source_fidelity: The draft conveys the warning, handing over to local judicial councils, and flogging accurately. However, “ಜನರ ವಿಷಯದಲ್ಲಿ ಎಚ್ಚರವಾಗಿರಿ” is less direct than the Greek construction and can mean being cautious regarding a topic rather than guarding against persons. The reflexive “ತಮ್ಮ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ” can imply the persecutors’ own assembly halls; the non-reflexive possessive better represents αὐτῶν.
  naturalness: “ಜನರ ಬಗ್ಗೆ ಎಚ್ಚರವಾಗಿರಿ” is the natural modern Kannada form for a warning against people. “ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ” is clear and idiomatic in this context.
  terminology: “ನ್ಯಾಯಸಭೆಗಳು” suitably renders plural συνέδρια without identifying these bodies as the Jerusalem Sanhedrin. “ಸಭಾಮಂದಿರಗಳು” is an established Kannada rendering for synagogues in biblical register. “ಚಾಟಿಯಿಂದ ಹೊಡೆಯುವರು” adequately communicates judicial flogging.
  issues:
  - severity: medium
    issue: The phrase “ಜನರ ವಿಷಯದಲ್ಲಿ ಎಚ್ಚರವಾಗಿರಿ” weakens or shifts the direct sense of προσέχετε ἀπό.
    rationale: The Greek warns the disciples to be on guard against hostile people, not merely to exercise caution concerning the subject of people. “ಜನರ ಬಗ್ಗೆ ಎಚ್ಚರವಾಗಿರಿ” preserves the intended relation more naturally.
  - severity: low
    issue: “ತಮ್ಮ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ” uses a reflexive possessive for αὐτῶν.
    rationale: While understandable, it may add reflexive emphasis (‘their own synagogues’). “ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ” is the straightforward equivalent of the Greek pronoun.
  revised_text: ಆದರೆ ಜನರ ಬಗ್ಗೆ ಎಚ್ಚರವಾಗಿರಿ[a]. ಏಕೆಂದರೆ ಅವರು ನಿಮ್ಮನ್ನು ನ್ಯಾಯಸಭೆಗಳಿಗೆ ಒಪ್ಪಿಸಿಕೊಡುವರು ಮತ್ತು ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ ನಿಮಗೆ ಚಾಟಿಯಿಂದ ಹೊಡೆಯುವರು.
