    text: ಅಥವಾ, ‘ಮನುಷ್ಯರ ಬಗ್ಗೆ’; ಗ್ರೀಕ್ ಪದವು ವ್ಯಾಕರಣದ ದೃಷ್ಟಿಯಿಂದ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾಗಿದ್ದರೂ, ಇಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
