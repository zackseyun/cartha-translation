id: MAT.10.17
reference: Matthew 10:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: kn
  text: ಆದರೆ ಜನರ ಬಗ್ಗೆ ಎಚ್ಚರವಾಗಿರಿ[a]. ಏಕೆಂದರೆ ಅವರು ನಿಮ್ಮನ್ನು ನ್ಯಾಯಸಭೆಗಳಿಗೆ ಒಪ್ಪಿಸಿಕೊಡುವರು ಮತ್ತು ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ ನಿಮಗೆ ಚಾಟಿಯಿಂದ ಹೊಡೆಯುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಮನುಷ್ಯರ ಬಗ್ಗೆ’; ಗ್ರೀಕ್ ಪದವು ವ್ಯಾಕರಣದ ದೃಷ್ಟಿಯಿಂದ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾಗಿದ್ದರೂ, ಇಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: ಎಚ್ಚರವಾಗಿರಿ
  rationale: ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯಾಪದವು ಅಪಾಯದ ಕುರಿತು ಜಾಗರೂಕರಾಗಿರಬೇಕೆಂಬ ಎಚ್ಚರಿಕೆಯನ್ನು ನೀಡುತ್ತದೆ; ಈ ಆಯ್ಕೆ ಸಹಜವೂ ಗಂಭೀರವೂ ಆಗಿದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಮಾತಿನಿಂದ ಎಚ್ಚರಿಕೆಯ ಕಡೆಗೆ ಬರುವ ಸೌಮ್ಯ ವಿರೋಧಾತ್ಮಕ ತಿರುವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: ಜನರ ವಿಷಯದಲ್ಲಿ
  rationale: προσέχω ಜೊತೆಗೆ ἀπό ಅಪಾಯದ ಮೂಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಇಲ್ಲಿ ἄνθρωποι ಪುರುಷರಿಗೆ ಮಾತ್ರವಲ್ಲ, ಸಾಮಾನ್ಯವಾಗಿ ವಿರೋಧಿಸುವ ಮನುಷ್ಯರಿಗೆ ಅನ್ವಯಿಸುತ್ತದೆ.
- source_word: παραδώσουσιν
  choice: ಒಪ್ಪಿಸಿಕೊಡುವರು
  rationale: ಅಧಿಕಾರಿಗಳ ವಶಕ್ಕೆ ಒಪ್ಪಿಸುವ ನ್ಯಾಯಾಂಗಸಂಬಂಧಿ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ದ್ರೋಹ ಮಾಡುವರು’ ಎಂಬ ಹೆಚ್ಚುವರಿ ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಹೇರುವುದಿಲ್ಲ.
- source_word: συνέδρια
  choice: ನ್ಯಾಯಸಭೆಗಳು
  rationale: ಬಹುವಚನ ಪದವು ಯೆರೂಸಲೇಮಿನ ಒಂದೇ ಮಹಾಸಭೆಯನ್ನು ಕಡ್ಡಾಯವಾಗಿ ಸೂಚಿಸದೆ, ಸ್ಥಳೀಯ ಆಡಳಿತಾತ್ಮಕ ಅಥವಾ ನ್ಯಾಯಿಕ ಮಂಡಳಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: συναγωγαῖς
  choice: ಸಭಾಮಂದಿರಗಳು
  rationale: ಯೆಹೂದ್ಯರ ಧಾರ್ಮಿಕ ಸಭೆ ಸೇರುವ ನಿರ್ದಿಷ್ಟ ಸ್ಥಳಗಳನ್ನು ಸೂಚಿಸುವ, ಕನ್ನಡದಲ್ಲಿ ಗ್ರಾಹ್ಯವಾದ ಪದ.
- source_word: αὐτῶν
  choice: ತಮ್ಮ
  rationale: ಕರ್ತೃವಾದ ‘ಅವರು’ ಎಂಬುದರೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದ ಸಭಾಮಂದಿರಗಳೆಂದು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: μαστιγώσουσιν
  choice: ಚಾಟಿಯಿಂದ ಹೊಡೆಯುವರು
  rationale: ಶಿಕ್ಷೆಯ ರೂಪದಲ್ಲಿ ಚಾಟಿ ಅಥವಾ ಕೊರಡೆಯಿಂದ ಹೊಡೆಯುವುದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἀνθρώπων ಪದದ ಲಿಂಗಸೂಚಕ ನಿರೂಪಣೆ
  choice: ಜನರು
  alternative: ಗಂಡಸರು / ಮನುಷ್ಯರು
  rationale: ಗ್ರೀಕ್ ಪದವು ವ್ಯಾಕರಣದ ದೃಷ್ಟಿಯಿಂದ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾದರೂ, ಇಲ್ಲಿ ಅರ್ಥದ ದೃಷ್ಟಿಯಿಂದ ಪುರುಷರಿಗೆ ಮಾತ್ರ ಸೀಮಿತವಾಗದೆ ಸಾಮಾನ್ಯ ಮಾನವ ವಿರೋಧಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ನ್ಯಾಯಾಂಗ ಹಿನ್ನೆಲೆಯನ್ನು ‘ನ್ಯಾಯಸಭೆಗಳು’ ಮತ್ತು ದೈಹಿಕ ಶಿಕ್ಷೆಯನ್ನು ‘ಚಾಟಿಯಿಂದ ಹೊಡೆಯುವರು’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
