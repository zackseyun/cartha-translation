- from: ಎರಡು ಗುಬ್ಬಚ್ಚಿಗಳನ್ನು ಒಂದು ಅಸ್ಸಾರಿಯೋನ್‌ಗೆ ಮಾರುವುದಿಲ್ಲವೇ?[b] ಆದರೂ ನಿಮ್ಮ ತಂದೆಯನ್ನು ಹೊರತುಪಡಿಸಿ ಅವುಗಳಲ್ಲಿ ಒಂದೂ ನೆಲಕ್ಕೆ ಬೀಳುವುದಿಲ್ಲ.[a]
