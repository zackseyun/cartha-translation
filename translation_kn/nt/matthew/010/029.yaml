id: MAT.10.29
reference: Matthew 10:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: kn
  text: ಎರಡು ಗುಬ್ಬಚ್ಚಿಗಳನ್ನು ಒಂದು ಅಸ್ಸಾರಿಯೊನ್‌ಗೆ ಮಾರುವುದಿಲ್ಲವೇ?[b] ಆದರೂ ನಿಮ್ಮ ತಂದೆಯಿಲ್ಲದೆ ಅವುಗಳಲ್ಲಿ ಒಂದೂ ನೆಲಕ್ಕೆ ಬೀಳುವುದಿಲ್ಲ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿಮ್ಮ ತಂದೆಯಿಂದ ಪ್ರತ್ಯೇಕವಾಗಿ.’ ಈ ಮಾತು ಅವರ ಅರಿವು, ಕಾಳಜಿ ಅಥವಾ ಇಚ್ಛೆಯಿಂದ ಹೊರತಾಗಿ ಅಲ್ಲ ಎಂಬ ಅರ್ಥವನ್ನು ಸೂಚಿಸಬಹುದು; ಆದರೆ ಗ್ರೀಕ್ ಮೂಲವು ಇವುಗಳಲ್ಲಿ ಯಾವುದನ್ನೂ ನಿರ್ದಿಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ.
    reason: alternative_reading
  - marker: b
    text: ಅಸ್ಸಾರಿಯೊನ್ ಅತಿ ಕಡಿಮೆ ಮೌಲ್ಯದ ಚಿಕ್ಕ ರೋಮನ್ ತಾಮ್ರದ ನಾಣ್ಯವಾಗಿತ್ತು.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: ಗುಬ್ಬಚ್ಚಿಗಳು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಚಿಕ್ಕ ಹಕ್ಕಿಗಳಿಗಿಂತ ನಿರ್ದಿಷ್ಟವಾಗಿ ‘ಗುಬ್ಬಚ್ಚಿಗಳು’ ಎಂಬ ಅರ್ಥ ಸಹಜವಾಗಿದ್ದು, ಪ್ರಸಿದ್ಧ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀσσαρίου
  choice: ಒಂದು ಅಸ್ಸಾರಿಯೋನ್‌ಗೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ರೋಮನ್ ನಾಣ್ಯದ ಐತಿಹಾಸಿಕ ಹೆಸರನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅದರ ಅತಿ ಕಡಿಮೆ ಮೌಲ್ಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿ ವಿವರಿಸುತ್ತದೆ.
- source_word: πωλεῖται
  choice: ಮಾರುವುದಿಲ್ಲವೇ?
  rationale: ವರ್ತಮಾನಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಕನ್ನಡದ ಸಹಜ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿದೆ.
- source_word: ἓν ἐξ αὐτῶν
  choice: ಅವುಗಳಲ್ಲಿ ಒಂದೂ
  rationale: ಭಾಗಸೂಚಕ ಗ್ರೀಕ್ ಅಭಿವ್ಯಕ್ತಿಗೆ ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ; ನಕಾರಾತ್ಮಕ ವಾಕ್ಯದಲ್ಲಿ ‘ಒಂದೂ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: ನೆಲಕ್ಕೆ ಬೀಳುವುದಿಲ್ಲ
  rationale: ದಿಕ್ಕನ್ನು ಸೂಚಿಸುವ ἐπί + ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ‘ನೆಲಕ್ಕೆ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: ನಿಮ್ಮ ತಂದೆಯನ್ನು ಹೊರತುಪಡಿಸಿ
  rationale: ತಂದೆಯ ಜ್ಞಾನ, ಇಚ್ಛೆ ಅಥವಾ ಅನುಮತಿ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ, ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನೂ ಅಸ್ಪಷ್ಟತೆಯನ್ನೂ ಉಳಿಸುವ ಪ್ರಯತ್ನ.
- source_word: οὐχὶ ... ;
  choice: '... ಮಾರುವುದಿಲ್ಲವೇ?'
  rationale: ಸಮ್ಮತ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಗ್ರೀಕ್ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯ ಬಲವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ
  choice: ಆದರೂ
  rationale: ಗುಬ್ಬಚ್ಚಿಗಳ ಅಲ್ಪ ಮೌಲ್ಯಕ್ಕೂ ತಂದೆಯ ಸಂಬಂಧಕ್ಕೂ ಇರುವ ವೈರುಧ್ಯವನ್ನು ಸಂದರ್ಭಾನುಸಾರ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ನಿಮ್ಮ ತಂದೆಯನ್ನು ಹೊರತುಪಡಿಸಿ’ ಎಂಬ ಮಾತಿನಲ್ಲಿ ದೈವಿಕ ಪರಿಪಾಲನೆಯ ಸ್ವರೂಪ
  choice: ತಂದೆಯ ಸಂಬಂಧವನ್ನು ಹೇಳಿ, ಅದು ಜ್ಞಾನವೋ, ಕಾಳಜಿಯೋ, ಇಚ್ಛೆಯೋ ಎಂದು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ.
  alternative: ‘ನಿಮ್ಮ ತಂದೆಯ ಅರಿವಿಲ್ಲದೆ’ ಅಥವಾ ‘ನಿಮ್ಮ ತಂದೆಯ ಇಚ್ಛೆಯಿಲ್ಲದೆ’
  rationale: ἄνευ τοῦ πατρὸς ὑμῶν ಎಂಬ ಗ್ರೀಕ್ ನುಡಿ ತಂದೆಯೊಂದಿಗಿನ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆದರೆ ಆ ಸಂಬಂಧದ ವಿಧಾನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಂಗಡೀಯ ಅಥವಾ ಅತಿನಿರ್ದಿಷ್ಟ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ವಾಚನಸೌಕರ್ಯವುಳ್ಳ ಶೈಲಿ. ‘ಅಸ್ಸಾರಿಯೋನ್’ ಎಂಬ ಐತಿಹಾಸಿಕ ಪದವನ್ನು ಉಳಿಸಿ ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿರುವ ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಹೊಂದಿಕೆಯಾಗಿವೆ.
