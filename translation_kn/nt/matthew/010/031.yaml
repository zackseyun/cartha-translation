id: MAT.10.31
reference: Matthew 10:31
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ ಭಯಪಡಬೇಡಿ; ಅನೇಕ ಗುಬ್ಬಚ್ಚಿಗಳಿಗಿಂತ ನೀವು ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅನೇಕ ಗುಬ್ಬಚ್ಚಿಗಳಿಗಿಂತ ನೀವು ಹೆಚ್ಚು ಅಮೂಲ್ಯರು.’
    reason: διαφέρετε ಎಂಬ ಪದದ ಸನ್ನಿವೇಶಾನುಸಾರವಾದ ಮತ್ತೊಂದು ಸಹಜ ಕನ್ನಡ ರೂಪವನ್ನು ನೀಡಲು.
lexical_decisions:
- source_word: μὴ οὖν
  choice: ಆದ್ದರಿಂದ ಭಯಪಡಬೇಡಿ
  rationale: οὖν ಹಿಂದಿನ ವಾದದಿಂದ ಬರುವ ತೀರ್ಮಾನವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದ್ದರಿಂದ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; μὴ ಜೊತೆಗೆ ಬಂದಿರುವ ವರ್ತಮಾನಕಾಲದ ಆಜ್ಞಾರ್ಥಕ φοβεῖσθε ನಿಷೇಧವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಭಯಪಡಬೇಡಿ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: φοβεῖσθε
  choice: ಭಯಪಡಬೇಡಿ
  rationale: φοβέομαι ಎಂಬ ಕ್ರಿಯಾಪದದ ನಿಷೇಧಾತ್ಮಕ ಆಜ್ಞೆಯನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πολλῶν στρουθίων
  choice: ಅನೇಕ ಗುಬ್ಬಚ್ಚಿಗಳಿಗಿಂತ
  rationale: ತಕ್ಷಣದ ಸನ್ನಿವೇಶದಲ್ಲಿ στρουθίον ಗುಬ್ಬಚ್ಚಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. διαφέρετε ಜೊತೆಗಿನ ಹೋಲಿಕೆಯನ್ನು ಕನ್ನಡದ ‘-ಗಿಂತ’ ವಿಭಕ್ತಿ ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: διαφέρετε
  choice: ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರು
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ διαφέρω ಕೇವಲ ‘ಭಿನ್ನರಾಗಿರುವುದು’ ಎಂಬುದಲ್ಲ, ಮೌಲ್ಯದಲ್ಲಿ ಮಿಗಿಲಾಗಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರು’ ಆ ಹೋಲಿಕೆಯ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑμεῖς
  choice: ನೀವು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸ್ಪಷ್ಟ ಸರ್ವನಾಮವು ಶಿಷ್ಯರ ಮೇಲಿನ ಒತ್ತನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ನೀವು’ ಎಂಬುದನ್ನು ವಿಧೇಯಪದದ ಮೊದಲು ಇಡುವುದರಿಂದ ಆ ಒತ್ತು ಸಮರ್ಪಕವಾಗಿ ವ್ಯಕ್ತವಾಗುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಬೋಧನೆಯಲ್ಲಿ ಮನುಷ್ಯರು ಮತ್ತು ಗುಬ್ಬಚ್ಚಿಗಳ ಸಾಪೇಕ್ಷ ಮೌಲ್ಯ
  choice: ಅನೇಕ ಗುಬ್ಬಚ್ಚಿಗಳಿಗಿಂತ ನೀವು ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರು
  alternative: ಅನೇಕ ಗುಬ್ಬಚ್ಚಿಗಳಿಗಿಂತ ನೀವು ಹೆಚ್ಚು ಅಮೂಲ್ಯರು
  rationale: ಈ ವಾಕ್ಯವು ದೇವರು ಪ್ರಾಣಿಗಳನ್ನು ನೋಡಿಕೊಳ್ಳುವುದಿಲ್ಲವೆಂದು ಹೇಳದೆ, ಗುಬ್ಬಚ್ಚಿಗಳಿಗಿಂತ ಯೇಸುವಿನ ಶಿಷ್ಯರ ಮೇಲೆ ಆತನಿಗಿರುವ ಹೆಚ್ಚಿನ ಕಾಳಜಿಯನ್ನು ತಿಳಿಸುತ್ತದೆ. ಆಯ್ದ ಅನುವಾದವು διαφέρετε ಎಂಬ ಪದದ ಹೋಲಿಕೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಮೌಲ್ಯವುಳ್ಳವರು’ ಮೂಲದ ಹೋಲಿಕೆಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪರ್ಯಾಯವಾಗಿ ‘ಅಮೂಲ್ಯರು’ ಹೆಚ್ಚು ಭಾವಪೂರ್ಣವಾದರೂ ಅರ್ಥಸಮ್ಮತ ರೂಪವಾಗಿದೆ.
