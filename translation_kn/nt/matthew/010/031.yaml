  source_fidelity: The Kannada accurately represents μὴ οὖν φοβεῖσθε as an inferential prohibition, and renders πολλῶν στρουθίων διαφέρετε ὑμεῖς with the intended comparison of greater value. ‘ಗುಬ್ಬಚ್ಚಿಗಳು’ is contextually appropriate, matching Matthew 10:29.
  naturalness: ‘ಆದ್ದರಿಂದ ಭಯಪಡಬೇಡಿ; ಅನೇಕ ಗುಬ್ಬಚ್ಚಿಗಳಿಗಿಂತ ನೀವು ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರು’ is clear, idiomatic modern standard Kannada, and suitable for public reading. The placement of ‘ನೀವು’ adequately retains the contrastive force of the explicit Greek pronoun.
  terminology: ‘ಹೆಚ್ಚು ಮೌಲ್ಯವುಳ್ಳವರು’ appropriately conveys διαφέρετε here as surpassing in value, without importing theological claims beyond the comparison in context. The footnote’s ‘ಹೆಚ್ಚು ಅಮೂಲ್ಯರು’ is a legitimate natural alternative and remains anchored correctly.
