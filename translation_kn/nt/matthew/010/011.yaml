id: MAT.10.11
reference: Matthew 10:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: kn
  text: ನೀವು ಯಾವುದೇ ಪಟ್ಟಣಕ್ಕಾಗಲಿ ಹಳ್ಳಿಗಾಗಲಿ ಪ್ರವೇಶಿಸಿದಾಗ, ಅಲ್ಲಿ ಯಾರು ಯೋಗ್ಯರು[b] ಎಂದು ವಿಚಾರಿಸಿ[a]; ನೀವು ಅಲ್ಲಿಂದ ಹೊರಡುವ ತನಕ ಅಲ್ಲಿಯೇ ಉಳಿಯಿರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ವಿಚಾರಿಸಿ’ ಎಂಬುದನ್ನು ‘ಕೇಳಿ ತಿಳಿದುಕೊಳ್ಳಿ’ ಅಥವಾ ‘ಪರಿಶೀಲಿಸಿ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ‘ಯೋಗ್ಯರು’ ಎಂಬುದು ಇಲ್ಲಿ ಸಂದೇಶವಾಹಕರನ್ನು ಸ್ವೀಕರಿಸಲು ತಕ್ಕವರಾದ ಅಥವಾ ಸಿದ್ಧರಾದ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು; ದೇವರ ಅನುಗ್ರಹವನ್ನು ಸಂಪಾದಿಸಿಕೊಂಡ ವ್ಯಕ್ತಿ ಎಂಬ ಅರ್ಥ ಅವಶ್ಯವಲ್ಲ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: ನೀವು ಯಾವುದೇ ಪಟ್ಟಣಕ್ಕಾಗಲಿ ಹಳ್ಳಿಗಾಗಲಿ ಪ್ರವೇಶಿಸಿದಾಗ
  rationale: εἰς ದಿಕ್ಕನ್ನು ಸೂಚಿಸಿದರೂ, ಕನ್ನಡದಲ್ಲಿ ‘ಪ್ರವೇಶಿಸಿದಾಗ’ ಎಂಬ ಕ್ರಿಯೆಯೇ ಒಳಗೆ ಹೋಗುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ. ἄν ಇರುವ ಅನಿರ್ದಿಷ್ಟ ಸಂಬಂಧವಾಕ್ಯದ ಅರ್ಥವನ್ನು ‘ಯಾವುದೇ ...ಕ್ಕಾಗಲಿ’ ಉಳಿಸುತ್ತದೆ; πόλις ಮತ್ತು κώμη ನಡುವಿನ ನೆಲೆಗಾತ್ರದ ವ್ಯತ್ಯಾಸವನ್ನು ‘ಪಟ್ಟಣ’ ಮತ್ತು ‘ಹಳ್ಳಿ’ ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತವೆ.
- source_word: ἐξετάσατε
  choice: ವಿಚಾರಿಸಿ
  rationale: ಈ ಆಜ್ಞಾಪದವು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಕೇಳಿ ತಿಳಿದುಕೊಳ್ಳುವ ಅಥವಾ ಪರಿಶೀಲಿಸುವ ಅರ್ಥ ಹೊಂದಿದೆ. ‘ವಿಚಾರಿಸಿ’ ಆ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ಕೇವಲ ಆಕಸ್ಮಿಕವಾಗಿ ತಿಳಿದುಕೊಳ್ಳುವುದನ್ನು ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: ಅಲ್ಲಿ ಯಾರು ಯೋಗ್ಯರು
  rationale: τίς ವ್ಯಕ್ತಿಯ ಗುರುತನ್ನು ಕೇಳುತ್ತದೆ ಮತ್ತು ἐν αὐτῇ ಹಿಂದಿನ ಪಟ್ಟಣ ಅಥವಾ ಹಳ್ಳಿಗೆ ಸಂಬಂಧಿಸುತ್ತದೆ. ಗೌರವಾರ್ಥ ಬಹುವಚನದ ಕನ್ನಡ ಬಳಕೆಯಾದ ‘ಯಾರು ಯೋಗ್ಯರು’ ವ್ಯಕ್ತಿಯ ಲಿಂಗವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸದೆ ಸಹಜವಾಗಿ ಕೇಳಿಸುತ್ತದೆ.
- source_word: κἀκεῖ μείνατε
  choice: ಅಲ್ಲಿಯೇ ಉಳಿಯಿರಿ
  rationale: κἀκεῖಯ ‘ಅಲ್ಲೇ/ಅದೇ ಸ್ಥಳದಲ್ಲಿ’ ಎಂಬ ಒತ್ತನ್ನು ‘ಅಲ್ಲಿಯೇ’ ಉಳಿಸುತ್ತದೆ. ಗ್ರೀಕ್ ಪಠ್ಯವು ‘ಮನೆ’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದ ಕಾರಣ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಿಲ್ಲ.
- source_word: ἕως ἂν ἐξέλθητε
  choice: ನೀವು ಅಲ್ಲಿಂದ ಹೊರಡುವ ತನಕ
  rationale: ἕως ἄν ಜೊತೆಯ ಉಪವಿಧಿ ಭವಿಷ್ಯದಲ್ಲಿ ಸಂಭವಿಸುವ ನಿರ್ಗಮನದವರೆಗಿನ ಅವಧಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೊರಡುವ ತನಕ’ ಇದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ‘ಅಲ್ಲಿಂದ’ ನಿರ್ಗಮನದ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮಿಷನರಿ ಸೂಚನೆಯಲ್ಲಿ ἄξιος (‘ಯೋಗ್ಯ’) ಎಂಬುದರ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಯೋಗ್ಯರು’ ಎಂಬ ಮೌಲ್ಯನಿರ್ಣಯದ ಪದವನ್ನು ಉಳಿಸಿ, ಸಂದರ್ಭದಲ್ಲಿನ ಆತಿಥ್ಯಕ್ಕೆ ತಕ್ಕ ಅಥವಾ ಸಂದೇಶವಾಹಕರನ್ನು ಸ್ವೀಕರಿಸಲು ಸಿದ್ಧನಾದ ವ್ಯಕ್ತಿ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ನೇರವಾಗಿ ‘ಸ್ವೀಕರಿಸಲು ಸಿದ್ಧರಾಗಿರುವವರು’ ಅಥವಾ ‘ತಕ್ಕವರು’ ಎಂದು ಅನುವಾದಿಸುವುದು; ಅಥವಾ ವಿಶಾಲ ನೈತಿಕ ಅರ್ಹತೆಯಾಗಿ ಗ್ರಹಿಸುವುದು.
  rationale: ἄξιος ಮೌಲ್ಯ ಅಥವಾ ತಕ್ಕತನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆದರೆ ಈ ಸಂದರ್ಭವು ಶಿಷ್ಯರಿಗೆ ವಸತಿ ಮತ್ತು ಸ್ವಾಗತ ನೀಡುವ ವ್ಯಕ್ತಿಯನ್ನು ಕಂಡುಹಿಡಿಯುವ ಸೂಚನೆಯಾಗಿದೆ. ‘ಯೋಗ್ಯರು’ ಮೂಲದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನೂ ಸಾಧ್ಯ ಒತ್ತನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಇದನ್ನು ದೇವರ ಅನುಗ್ರಹವನ್ನು ಸಂಪಾದಿಸಿದವನು ಎಂಬ ಸಿದ್ಧಾಂತಾತ್ಮಕ ಅರ್ಥಕ್ಕೆ ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸದಂತೆ ನೆರವಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಅಲ್ಲಿಯೇ’ ಎಂಬುದು ಗ್ರೀಕ್ ಪಠ್ಯದ ಸ್ಥಳಸೂಚಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಅವನ ಮನೆಯಲ್ಲೇ’ ಎಂದು ಸಂದರ್ಭಾರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹೆಚ್ಚಿಸಿಲ್ಲ. ಎರಡೂ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿತ ವಾಕ್ಯಾಂಶಗಳ ಬಳಿಯಲ್ಲಿ ಇರಿಸಲಾಗಿದೆ.
