id: MAT.10.40
reference: Matthew 10:40
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: kn
  text: ನಿಮ್ಮನ್ನು ಸ್ವೀಕರಿಸುವವನು ನನ್ನನ್ನು ಸ್ವೀಕರಿಸುತ್ತಾನೆ[a]; ಮತ್ತು ನನ್ನನ್ನು ಸ್ವೀಕರಿಸುವವನು ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು ಸ್ವೀಕರಿಸುತ್ತಾನೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಸ್ವಾಗತಿಸುತ್ತಾನೆ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದಕ್ಕೆ ‘ಸ್ವೀಕರಿಸು,’ ‘ಅಂಗೀಕರಿಸು,’ ಅಥವಾ ‘ಸ್ವಾಗತಿಸು’ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ವಿಶೇಷವಾಗಿ ಸಂದೇಶವಾಹಕನನ್ನು ಸ್ವೀಕರಿಸುವ ಸಂದರ್ಭದಲ್ಲಿ ಈ ಅರ್ಥಗಳು ಒಂದಕ್ಕೊಂದು ಸಂಬಂಧಿಸಿವೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: ಸ್ವೀಕರಿಸುವವನು
  rationale: ಲೇಖಸಹಿತ ವರ್ತಮಾನ ಕೃದಂತವು ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವ ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದೆ. ‘ಸ್ವೀಕರಿಸುವವನು’ ಸಾಮಾನ್ಯ ಏಕವಚನದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δέχομαι / δέχεται
  choice: ಸ್ವೀಕರಿಸು / ಸ್ವೀಕರಿಸುತ್ತಾನೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಒಂದೇ ಕ್ರಿಯಾಪದದ ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸಿ, ಶಿಷ್ಯರನ್ನು ಅಂಗೀಕರಿಸುವುದು, ಯೇಸುವನ್ನು ಅಂಗೀಕರಿಸುವುದು ಮತ್ತು ಆತನನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು ಅಂಗೀಕರಿಸುವುದು ಎಂಬ ಉದ್ದೇಶಪೂರ್ವಕ ಸರಪಳಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ. ಸಂದರ್ಭಾನುಸಾರ ಇದರಲ್ಲಿ ಸ್ವಾಗತಿಸುವ ಅರ್ಥವೂ ಸೇರಿದೆ.
- source_word: ὑμᾶς
  choice: ನಿಮ್ಮನ್ನು
  rationale: ಇದು ಯೇಸುವಿನ ಶಿಷ್ಯರನ್ನು ಉದ್ದೇಶಿಸಿದ ದ್ವಿತೀಯ ಪುರುಷ ಬಹುವಚನದ ಕರ್ಮಪದ; ಕನ್ನಡದ ‘ನಿಮ್ಮನ್ನು’ ಬಹುವಚನವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐμέ
  choice: ನನ್ನನ್ನು
  rationale: ಯೇಸುವನ್ನು ಸೂಚಿಸುವ ಪ್ರಥಮ ಪುರುಷ ಏಕವಚನದ ನೇರ ಕರ್ಮಪದಕ್ಕೆ ಸರಳ ಮತ್ತು ನಿಖರ ಅನುವಾದ.
- source_word: τὸν ἀποστείλαντά με
  choice: ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು
  rationale: ಲೇಖಸಹಿತ ಭೂತಕಾಲದ ಕೃದಂತವು ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನು’ ಮೂಲದ ವೈಯಕ್ತಿಕ ಮತ್ತು ಏಕವಚನದ ಉಲ್ಲೇಖವನ್ನು ಉಳಿಸಿ, ಆ ವ್ಯಕ್ತಿಯನ್ನು ಪಠ್ಯದಲ್ಲಿರುವುದಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾಗಿ ಗುರುತಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನ ಗುರುತು
  choice: ‘ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನು’ ಎಂದು ಮೂಲದಲ್ಲಿರುವಂತೆಯೇ ನಿರೂಪಿಸಲಾಗಿದೆ.
  alternative: ‘ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ತಂದೆ’
  rationale: ಸಂದರ್ಭ ಮತ್ತು ಮತ್ತಾಯನ ಧರ್ಮಶಾಸ್ತ್ರೀಯ ನಿರೂಪಣೆ ‘ತಂದೆ’ಯನ್ನು ಬಲವಾಗಿ ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್ ಪಠ್ಯವು ಇಲ್ಲಿ ‘ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನು’ ಎಂದಷ್ಟೇ ಹೇಳುತ್ತದೆ. ಆದ್ದರಿಂದ ಸೂಚ್ಯಾರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ತಂದೆ’ ಎಂಬ ಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಪುನರಾವರ್ತಿತ ವಾಕ್ಯರಚನೆ ಮತ್ತು ಪ್ರತಿನಿಧಿಯನ್ನು ಸ್ವೀಕರಿಸುವ ಸರಪಳಿ ಉಳಿಸಲಾಗಿದೆ; ‘ಕಳುಹಿಸಿದಾತನು’ ಎಂಬ ರೂಪವು ಗೌರವಪೂರ್ಣವಾಗಿದ್ದು ಮೂಲದ ಏಕವಚನ ವೈಯಕ್ತಿಕ ಉಲ್ಲೇಖವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
