id: MAT.10.37
reference: Matthew 10:37
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: kn
  text: ತಂದೆಯನ್ನಾಗಲಿ ತಾಯಿಯನ್ನಾಗಲಿ ನನಗಿಂತ ಹೆಚ್ಚಾಗಿ ಪ್ರೀತಿಸುವವನು ನನಗೆ ಯೋಗ್ಯನಲ್ಲ[a]; ಮಗನನ್ನಾಗಲಿ ಮಗಳನ್ನಾಗಲಿ ನನಗಿಂತ ಹೆಚ್ಚಾಗಿ ಪ್ರೀತಿಸುವವನೂ ನನಗೆ ಯೋಗ್ಯನಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನನಗಿಂತ ಮೇಲಾಗಿ.’ ὑπὲρ ἐμέ ಎಂಬ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು ಯೇಸುವಿಗಿಂತ ಮತ್ತೊಬ್ಬರಿಗೆ ಆದ್ಯತೆ ನೀಡಿ ಪ್ರೀತಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: ಪ್ರೀತಿಸುವವನು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವರ್ತಮಾನ ಕೃದಂತವು ಈ ಕ್ರಿಯೆಯಿಂದ ಗುರುತಿಸಲ್ಪಡುವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಪ್ರೀತಿಸುವವನು’ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯ ಏಕವಚನದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πατέρα ἢ μητέρα
  choice: ತಂದೆಯನ್ನಾಗಲಿ ತಾಯಿಯನ್ನಾಗಲಿ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸ್ವಾಮ್ಯಸೂಚಕ ಪದವಿಲ್ಲ; ಆದ್ದರಿಂದ ‘ತನ್ನ’ ಎಂದು ಸೇರಿಸದೆ ಸಂಬಂಧಸೂಚಕ ನಾಮಪದಗಳನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ. ‘-ಆಗಲಿ ... -ಆಗಲಿ’ ಪರ್ಯಾಯ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὑπὲρ ἐμέ
  choice: ನನಗಿಂತ ಹೆಚ್ಚಾಗಿ
  rationale: ಈ ತುಲನಾತ್ಮಕ ಸಂದರ್ಭದಲ್ಲಿ ὑπέρ ಯೇಸುವಿಗಿಂತ ಮತ್ತೊಬ್ಬರಿಗೆ ಹೆಚ್ಚಿನ ಪ್ರೀತಿ ಅಥವಾ ಆದ್ಯತೆ ನೀಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಆಯ್ಕೆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ನನಗೆ ಯೋಗ್ಯನಲ್ಲ
  rationale: ἄξιος ಜೊತೆಯಲ್ಲಿರುವ μου ಎಂಬ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ನನಗೆ ಯೋಗ್ಯನಲ್ಲ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ‘ನನ್ನವನಾಗಲು’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆಯನ್ನು ಸೇರಿಸಿಲ್ಲ.
- source_word: καὶ
  choice: -ವೂ
  rationale: ಎರಡನೆಯ ಸಮಾನಾಂತರ ವಾಕ್ಯವನ್ನು ಮೊದಲನೆಯದಕ್ಕೆ ಜೋಡಿಸುವ καὶ ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕರ್ತೃಪದಕ್ಕೆ ಸೇರಿದ ‘-ವೂ’ ಮೂಲಕ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: υἱὸν ἢ θυγατέρα
  choice: ಮಗನನ್ನಾಗಲಿ ಮಗಳನ್ನಾಗಲಿ
  rationale: ಮೂಲದಲ್ಲಿಲ್ಲದ ಸ್ವಾಮ್ಯಸೂಚಕ ಪದವನ್ನು ಸೇರಿಸದೆ ಸಂಬಂಧಸೂಚಕ ನಾಮಪದಗಳನ್ನು ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಕುಟುಂಬದ ಮೇಲಿನ ಪ್ರೀತಿ ಮತ್ತು ಯೇಸುವಿನ ಮೇಲಿನ ನಿಷ್ಠೆಯ ಸಂಬಂಧ
  choice: ಅತಿ ಸಮೀಪದ ಕುಟುಂಬದವರಿಗಿಂತಲೂ ಯೇಸುವಿಗೆ ಶ್ರೇಷ್ಠ ಆದ್ಯತೆ ನೀಡಬೇಕೆಂಬ ತುಲನಾತ್ಮಕ ಬೇಡಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಕುಟುಂಬವನ್ನು ದ್ವೇಷಿಸಬೇಕೆಂದು ಅರ್ಥೈಸುವುದು, ಅಥವಾ ‘ಯೇಸುವನ್ನೂ ಅಷ್ಟೇ ಪ್ರೀತಿಸಬೇಕು’ ಎಂದು ಬೇಡಿಕೆಯನ್ನು ಮೃದುಗೊಳಿಸುವುದು.
  rationale: ὑπὲρ ἐμέ ತುಲನಾತ್ಮಕ ಆದ್ಯತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕುಟುಂಬಪ್ರೀತಿಯ ಒಳ್ಳೆಯತನವನ್ನು ನಿರಾಕರಿಸದೆ, ಯೇಸುವಿನ ಕಠಿಣ ಶಿಷ್ಯತ್ವದ ಬೇಡಿಕೆ ಮತ್ತು ‘ಯೋಗ್ಯನಲ್ಲ’ ಎಂಬ ತೀರ್ಪು ಎರಡನ್ನೂ ಅನುವಾದವು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಸಮಾನಾಂತರ ವಾಕ್ಯರಚನೆ ಮತ್ತು ಮೂಲದ ಕಠಿಣ ತೀರ್ಪನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅನಗತ್ಯ ಸ್ವಾಮ್ಯಸೂಚಕ ಪದಗಳನ್ನು ಸೇರಿಸಿಲ್ಲ.
