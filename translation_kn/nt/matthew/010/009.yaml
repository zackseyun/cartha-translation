  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: kn
  text: ಚಿನ್ನವನ್ನಾಗಲಿ, ಬೆಳ್ಳಿಯನ್ನಾಗಲಿ, ತಾಮ್ರವನ್ನಾಗಲಿ[a] ನಿಮ್ಮ ಸೊಂಟಪಟ್ಟಿಗಳಲ್ಲಿ[b] ಇಡಲು ಸಂಪಾದಿಸಿಕೊಳ್ಳಬೇಡಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಕಂಚನ್ನಾಗಲಿ.”
    reason: lexical_alternative
  - marker: b
    text: ಅಂದಿನ ಕಾಲದಲ್ಲಿ ಹಣವನ್ನು ಸೊಂಟಪಟ್ಟಿಯ ಮಡಿಕೆಗಳಲ್ಲಿ ಅಥವಾ ಸೊಂಟಕ್ಕೆ ಕಟ್ಟಿದ ಹಣದ ಚೀಲಗಳಲ್ಲಿ ಇಟ್ಟುಕೊಳ್ಳುತ್ತಿದ್ದರು.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: ಸಂಪಾದಿಸಬೇಡಿ
  rationale: κτάομαι ಎಂಬುದು ‘ಪಡೆಯುವುದು/ಸಂಪಾದಿಸಿಕೊಳ್ಳುವುದು’ ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ. ಕೇವಲ ‘ತೆಗೆದುಕೊಂಡು ಹೋಗಬೇಡಿ’ ಎನ್ನದೆ, ಪ್ರಯಾಣಕ್ಕಾಗಿ ಹಣವನ್ನು ಒದಗಿಸಿಕೊಳ್ಳಬೇಡಿ ಎಂಬ ಮೂಲದ ಒತ್ತನ್ನು ಇದು ಉಳಿಸುತ್ತದೆ.
- source_word: χρυσὸν
  choice: ಚಿನ್ನ
  rationale: ಇದು ನೇರವಾದ ಲೋಹಪದ; ಈ ಸಂದರ್ಭದಲ್ಲಿ ಚಿನ್ನದ ಹಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἄργυρον
  choice: ಬೆಳ್ಳಿ
  rationale: ಇದು ನೇರವಾದ ಲೋಹಪದ; ಈ ಸಂದರ್ಭದಲ್ಲಿ ಬೆಳ್ಳಿಯ ಹಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: χαλκὸν
  choice: ತಾಮ್ರದ ನಾಣ್ಯಗಳು
  rationale: χαλκός ತಾಮ್ರ ಅಥವಾ ಕಂಚನ್ನು ಸೂಚಿಸಬಹುದು. ಚಿನ್ನ ಮತ್ತು ಬೆಳ್ಳಿಯೊಡನೆ ಹಣದ ಪಟ್ಟಿಯಲ್ಲಿ ಬಂದಿರುವುದರಿಂದ, ಆಧುನಿಕ ಕನ್ನಡ ಓದುಗರಿಗೆ ಕಡಿಮೆ ಮೌಲ್ಯದ ನಾಣ್ಯಗಳು ಎಂಬ ಸಂದರ್ಭ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ‘ತಾಮ್ರದ ನಾಣ್ಯಗಳು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: ನಿಮ್ಮ ಸೊಂಟಪಟ್ಟಿಗಳಲ್ಲಿ ಇಟ್ಟುಕೊಳ್ಳಲು
  rationale: ζώνη ಎಂದರೆ ಸೊಂಟಪಟ್ಟಿ; ಅಂದಿನ ಕಾಲದಲ್ಲಿ ಅದರಲ್ಲಿ ಹಣ ಇಡಲಾಗುತ್ತಿತ್ತು. εἰς ಪದದ ದಿಕ್ಕು/ಉದ್ದೇಶದ ಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಈ ರೂಪ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: 'ಆಜ್ಞೆಯ ವ್ಯಾಪ್ತಿ: ಹಣವನ್ನು ಹೊತ್ತುಕೊಳ್ಳುವುದೇ ಅಥವಾ ಅದನ್ನು ಒದಗಿಸಿಕೊಳ್ಳುವುದೇ'
  choice: ಸಂಪಾದಿಸಬೇಡಿ
  alternative: ತೆಗೆದುಕೊಂಡು ಹೋಗಬೇಡಿ
  rationale: ಮೂಲದ κτήσησθε ಸಾಮಾನ್ಯವಾಗಿ ‘ಪಡೆದುಕೊಳ್ಳಿ/ಸಂಪಾದಿಸಿಕೊಳ್ಳಿ’ ಎಂದರ್ಥ. ಆದ್ದರಿಂದ ಪಠ್ಯವನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಹಣ ಹೊಂದುವುದರ ಸಂಪೂರ್ಣ ನಿಷೇಧವೆಂದು ವಿಸ್ತರಿಸದೆ, ಈ ಮಿಷನ್ ಪ್ರಯಾಣಕ್ಕಾಗಿ ಹಣ ಒದಗಿಸಿಕೊಳ್ಳದಿರಲು ನೀಡಿದ ಆಜ್ಞೆಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ಆಜ್ಞಾರ್ಥಕ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಸೊಂಟಪಟ್ಟಿ’ ಸಾಂಸ್ಕೃತಿಕ ವಸ್ತುವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದರ ಹಣ ಸಾಗಿಸುವ ಬಳಕೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
