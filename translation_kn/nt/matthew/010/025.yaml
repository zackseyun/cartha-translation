id: MAT.10.25
reference: Matthew 10:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: kn
  text: ಶಿಷ್ಯನು ತನ್ನ ಗುರುವಿನಂತಾಗುವುದೂ ದಾಸನು ತನ್ನ ಯಜಮಾನನಂತಾಗುವುದೂ ಸಾಕು. ಮನೆಯ ಯಜಮಾನನನ್ನು ‘ಬೆಲ್ಜೆಬೂಲ್’[a] ಎಂದು ಕರೆದಿದ್ದರೆ, ಅವನ ಮನೆಯವರನ್ನು ಇನ್ನೆಷ್ಟು ಹೆಚ್ಚಾಗಿ ಹಾಗೆ ಕರೆಯುವರು!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಬೆಲ್ಜೆಬಬ್’; ಇದು ಸಂಪ್ರದಾಯದಲ್ಲಿ ಪರಿಚಿತವಾದ ಪರ್ಯಾಯ ರೂಪ.
    reason: ಗ್ರೀಕ್ ಪಾಠದ ‘ಬೆಲ್ಜೆಬೂಲ್’ ರೂಪದ ಜೊತೆಗೆ ಪ್ರಸಿದ್ಧ ಪರ್ಯಾಯ/ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರಿನ ರೂಪವನ್ನು ದಾಖಲಿಸಲು.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: ಸಾಕು
  rationale: ಸಾಕಷ್ಟಾಗಿರುವುದನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ವಿಧೇಯ ವಿಶೇಷಣದ ಸಹಜ ಹಾಗೂ ನೇರ ಕನ್ನಡ ರೂಪ.
- source_word: μαθητῇ
  choice: ಶಿಷ್ಯನು
  rationale: ಗುರುವಿನೊಂದಿಗೆ ಇರುವ ಕಲಿಕೆ ಮತ್ತು ಅನುಸರಣೆಯ ಸಂಬಂಧವನ್ನು ‘ಶಿಷ್ಯ’ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἵνα γένηται
  choice: ಆಗುವುದೂ
  rationale: ἀρκετόν ಜೊತೆಯಲ್ಲಿರುವ ἵνα ವಾಕ್ಯರಚನೆಯ ಉದ್ದೇಶ/ಫಲದ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸದೆ, ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διδάσκαλος
  choice: ಗುರು
  rationale: μαθητής–διδάσκαλος ಸಂಬಂಧದಲ್ಲಿ ‘ಗುರು’ ಸಹಜವಾಗಿದ್ದು, ಮುಂದಿನ κύριος ಎಂಬ ಸಾಮಾಜಿಕ ಅಧಿಕಾರಪದದಿಂದ ಸ್ಪಷ್ಟವಾಗಿ ಭಿನ್ನವಾಗಿರುತ್ತದೆ.
- source_word: δοῦλος
  choice: ದಾಸನು
  rationale: κύριος ಜೊತೆಗಿನ ಅಧೀನ ಸಾಮಾಜಿಕ ಸಂಬಂಧವನ್ನು ‘ಸೇವಕ’ಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿಖರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿಯೂ ಗೌರವಯುತ ಪಠ್ಯಶೈಲಿಗೆ ಹೊಂದುತ್ತದೆ.
- source_word: κύριος
  choice: ಯಜಮಾನನು
  rationale: ಇಲ್ಲಿ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಬಿರುದಿಗಿಂತ ದಾಸ–ಯಜಮಾನ ಸಂಬಂಧವೇ ಮುನ್ನೆಲೆಯಲ್ಲಿರುವುದರಿಂದ ಸಾಮಾಜಿಕ ಅರ್ಥವನ್ನು ನೀಡಲಾಗಿದೆ.
- source_word: οἰκοδεσπότην
  choice: ಮನೆಯ ಯಜಮಾನನನ್ನು
  rationale: ಮನೆಯ ಮೇಲೆ ಅಧಿಕಾರ ಹೊಂದಿರುವ ವ್ಯಕ್ತಿ ಎಂಬ ಸಂಯುಕ್ತಪದದ ಅರ್ಥವನ್ನೂ ಮುಂದಿನ ಮನೆಯವರ ಚಿತ್ರಣದ ಸಂಬಂಧವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: Βεελζεβοὺλ
  choice: ಬೆಲ್ಜೆಬೂಲ್
  rationale: SBLGNT ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿರುವ -ಬೂಲ್ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಲಿಪ್ಯಂತರಿಸುತ್ತದೆ.
- source_word: ἐπεκάλεσαν
  choice: ಎಂದು ಕರೆದಿದ್ದರೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಯಾರಿಗಾದರೂ ಒಂದು ಹೆಸರನ್ನು ಅಥವಾ ನಿಂದಾತ್ಮಕ ಗುರುತನ್ನು ನೀಡುವುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πόσῳ μᾶλλον
  choice: ಇನ್ನೆಷ್ಟು ಹೆಚ್ಚಾಗಿ
  rationale: ಕಡಿಮೆಯಿಂದ ಹೆಚ್ಚಿನದಕ್ಕೆ ಸಾಗುವ ಗ್ರೀಕ್ ತರ್ಕಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: οἰκιακοὺς
  choice: ಅವನ ಮನೆಯವರನ್ನು
  rationale: ದಾಸರಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸದೆ, ಮನೆಯ ಸಮಸ್ತ ಸದಸ್ಯರನ್ನು ಒಳಗೊಳ್ಳುವ ಪದದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮನೆಯ ರೂಪಕದಲ್ಲಿ κύριος ಪದದ ಅನುವಾದ
  choice: ಯಜಮಾನನು
  alternative: ಕರ್ತನು
  rationale: δοῦλος ಪದದ ನೇರ ಸಮಾಂತರದಲ್ಲಿಯೂ ಮನೆಯ ಸಾಮಾಜಿಕ ರೂಪಕದಲ್ಲಿಯೂ ಈ ಪದವು ಯಜಮಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕರ್ತನು’ ಎಂದರೆ ಮೂಲ ವಾಕ್ಯವು ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಮುನ್ನೆಲೆಗೆ ತರದ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಬಿರುದಿನ ಅರ್ಥ ಹೆಚ್ಚಾಗಬಹುದು.
- issue: δοῦλος ಪದದ ಅನುವಾದ
  choice: ದಾಸನು
  alternative: ಸೇವಕನು
  rationale: ಈ ವಾಕ್ಯದಲ್ಲಿ ಯಜಮಾನನಿಗೆ ಅಧೀನವಾಗಿರುವ ಸ್ಥಿತಿಯೇ ಹೋಲಿಕೆಯ ಕೇಂದ್ರವಾಗಿರುವುದರಿಂದ ‘ದಾಸನು’ ಸಾಮಾಜಿಕ ಅಸಮಾನತೆಯನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- issue: ಕೊನೆಯ ಉಪವಾಕ್ಯದ ಲೋಪಿತ ಕ್ರಿಯಾಪದ
  choice: ಹಾಗೆ ಕರೆಯುವರು
  alternative: ಬೆಲ್ಜೆಬೂಲ್ ಎಂದು ಕರೆಯುವರು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕ್ರಿಯಾಪದ ಲೋಪವಾಗಿದ್ದು ಹಿಂದಿನ ‘ಕರೆದರು’ ಎಂಬುದರಿಂದ ಅರ್ಥ ಪೂರೈಸಿಕೊಳ್ಳುತ್ತದೆ. ‘ಹಾಗೆ’ ಎಂಬುದು ಆ ಲೋಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ಮನೆಯ ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಅಕ್ಷರಶಃ ಅದೇ ಹೆಸರು ಇಡಲಾಗುತ್ತದೆ ಎಂದು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನವಾದ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಗುರು–ಶಿಷ್ಯ’ ಮತ್ತು ‘ದಾಸ–ಯಜಮಾನ’ ಎಂಬ ಸಮಾಂತರ ಜೋಡಿಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ಕೊನೆಯ ವಾಕ್ಯದಲ್ಲಿ ಮೂಲದ ಬಲವರ್ಧಕ ತರ್ಕವನ್ನು ಆಶ್ಚರ್ಯಾರ್ಥಕ ರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
