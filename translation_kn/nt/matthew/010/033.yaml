id: MAT.10.33
reference: Matthew 10:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: kn
  text: ಆದರೆ ಮನುಷ್ಯರ ಮುಂದೆ[a] ಯಾರು ನನ್ನನ್ನು ನಿರಾಕರಿಸುವನೋ, ಪರಲೋಕದಲ್ಲಿರುವ[b] ನನ್ನ ತಂದೆಯ ಮುಂದೆ ನಾನೂ ಅವನನ್ನು ನಿರಾಕರಿಸುವೆನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಜನರ ಮುಂದೆ.” ಗ್ರೀಕ್ ಪದವು ರೂಪತಃ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾಗಿದ್ದರೂ ಇಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, “ಪರಲೋಕಗಳಲ್ಲಿರುವ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: ಆದರೆ ... ಯಾರು ... -ನೋ
  rationale: δέ ಹಿಂದಿನ ವಾಕ್ಯದೊಂದಿಗೆ ವ್ಯತ್ಯಾಸವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. ὅστις ಮತ್ತು ἄν ಜೊತೆಯಾಗಿ ಕೊಡುವ ಸಾಮಾನ್ಯ, ಅನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ‘ಯಾರು ... -ನೋ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀρνήσηταί με
  choice: ನನ್ನನ್ನು ನಿರಾಕರಿಸುವನೋ
  rationale: ἀρνέομαι ಸಾರ್ವಜನಿಕವಾಗಿ ಒಪ್ಪಿಕೊಳ್ಳದೆ ನಿರಾಕರಿಸುವ ಅಥವಾ ತಳ್ಳಿಹಾಕುವ ಅರ್ಥ ಹೊಂದಿದೆ. ಮುಂದಿನ ಅದೇ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಸಮಾನತೆಯನ್ನು ಉಳಿಸಲು ‘ನಿರಾಕರಿಸು’ ಬಳಸಲಾಗಿದೆ.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: ಮನುಷ್ಯರ ಮುಂದೆ
  rationale: ἔμπροσθεν ಎಂದರೆ ‘ಮುಂದೆ/ಸಮ್ಮುಖದಲ್ಲಿ.’ ἀνθρώπων ರೂಪತಃ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾಗಿದ್ದರೂ ಇಲ್ಲಿ ಸಾಮಾನ್ಯ ಮಾನವಸಮೂಹವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮನುಷ್ಯರ’ ಮೂಲದ ರೂಪಕ್ಕೂ ಸಾಮಾನ್ಯ ಅರ್ಥಕ್ಕೂ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: ನಾನೂ ಅವನನ್ನು ನಿರಾಕರಿಸುವೆನು
  rationale: κἀγώಯ ‘ನಾನೂ’ ಎಂಬ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಎರಡೂ ಕಡೆ ಒಂದೇ ‘ನಿರಾಕರಿಸು’ ಕ್ರಿಯಾಪದವನ್ನು ಬಳಸಿ ಪರಸ್ಪರ ಅನುಗುಣವಾದ ಗಂಭೀರ ಹೇಳಿಕೆಯನ್ನು ಕಾಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: ನನ್ನ ತಂದೆಯ ಮುಂದೆ
  rationale: ಯೇಸು ಬಳಸುವ ಪಿತೃಸಂಬಂಧದ ನೇರ ಹೇಳಿಕೆಯನ್ನು ಯಾವುದೇ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆಯಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: ಪರಲೋಕದಲ್ಲಿರುವ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಆಕಾಶಗಳಲ್ಲಿ/ಪರಲೋಕಗಳಲ್ಲಿ’ ಎಂಬ ಬಹುವಚನವಿದ್ದರೂ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ದೇವರ ವಾಸಸ್ಥಳದ ಸೂಚನೆಗೆ ಏಕವಚನ ‘ಪರಲೋಕದಲ್ಲಿ’ ಹೆಚ್ಚು ಸಹಜ. ಶಾಬ್ದಿಕ ಬಹುವಚನವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ἀνθρώπων ಮತ್ತು αὐτόνನ ಲಿಂಗಸೂಚಕ ರೂಪ
  choice: ಮನುಷ್ಯರ ಮುಂದೆ ... ಅವನನ್ನು
  alternative: ಜನರ ಮುಂದೆ ... ಆ ವ್ಯಕ್ತಿಯನ್ನು
  rationale: ಗ್ರೀಕ್ ರೂಪಗಳು ಪುಲ್ಲಿಂಗವಾಗಿದ್ದು ಸಾಮಾನ್ಯ ಅಥವಾ ಪ್ರತಿನಿಧಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿವೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಮನುಷ್ಯರು’ ಸಾಮಾನ್ಯ ಮಾನವಸಮೂಹವನ್ನು ಸೂಚಿಸಬಲ್ಲದು; ‘ಅವನನ್ನು’ ಮೂಲದ ಏಕವಚನ ಪುಲ್ಲಿಂಗ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ. ಹೆಚ್ಚು ಲಿಂಗತಟಸ್ಥ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- issue: ಪರಸ್ಪರ ನಿರಾಕರಣೆಯ ಭಾಷೆ
  choice: ನಿರಾಕರಿಸುವನೋ ... ನಾನೂ ಅವನನ್ನು ನಿರಾಕರಿಸುವೆನು
  alternative: ತಳ್ಳಿಹಾಕುವನೋ ... ನಾನೂ ಅವನನ್ನು ತಳ್ಳಿಹಾಕುವೆನು
  rationale: ಎರಡೂ ಕಡೆ ಇರುವ ἀρνέομαιಗೆ ಒಂದೇ ಕನ್ನಡ ಕ್ರಿಯಾಪದವನ್ನು ಬಳಸಿ ವಾಕ್ಯದ ವಾಕ್ಚಾತುರ್ಯಾತ್ಮಕ ಹಾಗೂ ಧಾರ್ಮಿಕ ಸಮಾನತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾದ ಅರ್ಥವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಯಾರು ... -ನೋ’ ಸಾಮಾನ್ಯ ಷರತ್ತಿನ ವ್ಯಾಪ್ತಿಯನ್ನು ನೀಡುತ್ತದೆ; ‘ನಾನೂ’ ಮೂಲದಲ್ಲಿನ ಒತ್ತನ್ನೂ ಪರಸ್ಪರತೆಯನ್ನೂ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
