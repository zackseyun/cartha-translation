id: MAT.10.36
reference: Matthew 10:36
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: kn
  text: ಮತ್ತು ಮನುಷ್ಯನ ಶತ್ರುಗಳು ಅವನ ಸ್ವಂತ ಮನೆಯವರೇ ಆಗಿರುವರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಶತ್ರುಗಳು ಅವನ ಮನೆಯ ಸದಸ್ಯರೇ ಆಗಿರುವರು.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ‘ಮನುಷ್ಯ’ ಎಂಬ ಪದವನ್ನು ಪ್ರತಿನಿಧಿಕವಾಗಿ ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದೊಂದಿಗೆ ಈ ಮಾತನ್ನು ಜೋಡಿಸುವ ಸರಳ ಸಂಯೋಜಕದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐχθροὶ
  choice: ಶತ್ರುಗಳು
  rationale: ವಿರೋಧಿಗಳಾಗಿರುವವರನ್ನು ಸೂಚಿಸುವ ಸಹಜವೂ ಬಲವಾದವೂ ಆದ ಆಧುನಿಕ ಕನ್ನಡ ಪದ.
- source_word: τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯನ
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಪ್ರತಿನಿಧಿಕ ಅರ್ಥದಲ್ಲಿಯೇ ಉಳಿಸಿ, ಷಷ್ಠೀ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: ಅವನ ಸ್ವಂತ ಮನೆಯವರು
  rationale: ಇದು ಭೌತಿಕ ಮನೆಯನ್ನು ಅಲ್ಲ, ಅವನ ಮನೆಗೆ ಅಥವಾ ಕುಟುಂಬ ವಲಯಕ್ಕೆ ಸೇರಿದ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಸ್ವಂತ’ ಎಂಬುದು ನಿಕಟ ಸಂಬಂಧದ ಒತ್ತನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἀνθρώπου ಪದದಲ್ಲಿರುವ ಪ್ರತಿನಿಧಿಕ ಪುಲ್ಲಿಂಗ ಭಾಷೆ
  choice: ಮನುಷ್ಯನ
  alternative: ಒಬ್ಬ ವ್ಯಕ್ತಿಯ
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಸಾಮಾನ್ಯ ಪ್ರತಿನಿಧಿಕ ಹೇಳಿಕೆಯಲ್ಲಿ ಬಳಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯವು ಆ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ಇದು ಮಾತನ್ನು ಕೇವಲ ಪುರುಷರಿಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ ಎಂಬುದನ್ನು ಅಡಿಟಿಪ್ಪಣಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಶೈಲಿ. ‘ಮನೆಯವರು’ ಎಂಬುದು οἰκιακοί ಪದದ ವ್ಯಕ್ತಿಸೂಚಕ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಕೊಡುತ್ತದೆ; ‘ಶತ್ರುಗಳು’ ಎಂಬುದು ವೈಮನಸ್ಯದ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
