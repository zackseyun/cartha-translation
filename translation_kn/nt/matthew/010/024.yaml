id: MAT.10.24
reference: Matthew 10:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: kn
  text: ಶಿಷ್ಯನು ತನ್ನ ಬೋಧಕನಿಗಿಂತ ಮೇಲಲ್ಲ; ದಾಸನು[a] ತನ್ನ ಯಜಮಾನನಿಗಿಂತ[b] ಮೇಲಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ದಾಸನು’ ಎಂಬುದಕ್ಕೆ ‘ಸೇವಕನು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಗ್ರೀಕ್‌ನ δοῦλος ಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಸೂಚಿಸಬಲ್ಲದು.
    reason: alternative_reading
  - marker: b
    text: ‘ಯಜಮಾನನು’ ಎಂಬುದಕ್ಕೆ ‘ಒಡೆಯನು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್‌ನ κύριος ಪದಕ್ಕೆ ‘ಪ್ರಭು’ ಎಂಬ ಅರ್ಥವೂ ಇದೆ; ಆದರೆ ಇಲ್ಲಿ ಅದು ಉಪಮೆಯಲ್ಲಿನ ಮಾನವ ಅಧಿಕಾರಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: ಶಿಷ್ಯನು
  rationale: ಸುವಾರ್ತೆಯ ಸಂದರ್ಭದಲ್ಲಿ μαθητής ಕೇವಲ ವಿದ್ಯಾರ್ಥಿಯನ್ನಲ್ಲ, ಬೋಧಕನನ್ನು ಅನುಸರಿಸಿ ಕಲಿಯುವ ಸಂಬಂಧವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; ‘ಶಿಷ್ಯನು’ ಈ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑπέρ
  choice: ಮೇಲಲ್ಲ
  rationale: ಆಕ್ಯೂಸೇಟಿವ್‌ನೊಂದಿಗೆ ಬಂದಿರುವ ὑπέρ ಇಲ್ಲಿ ಸ್ಥಾನಮಾನ ಅಥವಾ ಶ್ರೇಷ್ಠತೆಯ ಹೋಲಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಗಿಂತ ಮೇಲಲ್ಲ’ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: διδάσκαλος
  choice: ಬೋಧಕನು
  rationale: διδάσκαλος ಪದದ ನೇರ ಅರ್ಥವನ್ನು ‘ಬೋಧಕನು’ ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ ಮತ್ತು ಮುಂದಿನ ಯಜಮಾನ–ದಾಸ ಜೋಡಿಯಿಂದ ವ್ಯತ್ಯಾಸವನ್ನೂ ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
- source_word: δοῦλος
  choice: ದಾಸನು
  rationale: κύριος ಜೊತೆಗೆ ಇರುವ ಸಾಮಾಜಿಕ ಸ್ಥಾನಮಾನದ ಹೋಲಿಕೆಯಲ್ಲಿ ಅಧೀನತೆ ಮತ್ತು ಒಡೆತನದ ಬಲವಾದ ಅರ್ಥವಿದೆ; ‘ದಾಸನು’ ಅದನ್ನು ‘ಸೇವಕನು’ಗಿಂತ ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κύριος
  choice: ಯಜಮಾನನು
  rationale: ಇಲ್ಲಿ κύριος ದೈವಿಕ ಬಿರುದಲ್ಲ; ದಾಸನ ಮೇಲಿರುವ ಮಾನವ ಅಧಿಕಾರಿಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಯಜಮಾನನು’ ಸಂದರ್ಭಕ್ಕೆ ಸರಿಹೊಂದುತ್ತದೆ.
- source_word: αὐτοῦ
  choice: ತನ್ನ
  rationale: ಈ ಸರ್ವನಾಮವು ದಾಸನಿಗೆ ಸಂಬಂಧಿಸಿದ ಅವನ ಯಜಮಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಕರ್ತೃಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲು ‘ತನ್ನ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: οὐδέ
  choice: ; ... ಮೇಲಲ್ಲ
  rationale: ಎರಡನೇ ನಿರಾಕರಣಾತ್ಮಕ ಹೋಲಿಕೆಯನ್ನು ಮೊದಲನೆಯದಕ್ಕೆ ಸಮಾನಾಂತರವಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ; ಕನ್ನಡದಲ್ಲಿ ಅರ್ಧವಿರಾಮ ಮತ್ತು ಪುನರಾವರ್ತಿತ ನಿರಾಕರಣೆ ಮೂಲದ ಸಮತೋಲನವನ್ನು ಸಹಜವಾಗಿ ತರುತ್ತವೆ.
theological_decisions:
- issue: ಕ್ರೈಸ್ತ ರಕ್ಷಣಾಶಾಸ್ತ್ರಕ್ಕೆ ನೇರವಾಗಿ ಸಂಬಂಧಿಸದ ಸಾಮಾಜಿಕ ಉಪಮೆಯಲ್ಲಿ δοῦλος ಪದದ ಅನುವಾದ
  choice: ದಾಸನು
  alternative: ಸೇವಕನು
  rationale: ದಾಸ–ಯಜಮಾನ ಜೋಡಿಯಲ್ಲಿ ಸಾಮಾಜಿಕ ಅಧೀನತೆ ಮತ್ತು ಒಡೆತನದ ಸಂಬಂಧ ಮುಖ್ಯವಾಗಿದೆ. ಆದ್ದರಿಂದ ‘ದಾಸನು’ ಮೂಲದ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಮೃದು ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ಮಾನವ ಗೃಹಸಂಬಂಧದ ಸಂದರ್ಭದಲ್ಲಿ κύριος ಪದದ ಅನುವಾದ
  choice: ಯಜಮಾನನು
  alternative: ಒಡೆಯನು; ಪ್ರಭು
  rationale: ಈ ಉಪಮೆಯಲ್ಲಿ κύριος ದೇವರನ್ನು ಸೂಚಿಸುವ ಬಿರುದಲ್ಲ, ದಾಸನ ಮಾನವ ಯಜಮಾನನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಯಜಮಾನನು’ ಈ ಸಂದರ್ಭವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಸಾಧ್ಯ ಪರ್ಯಾಯಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನವಾದ ಗಾದೆಸಮಾನ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ಮೂಲ ಗ್ರೀಕ್‌ನ ಎರಡು ಸಮಾನಾಂತರ ನಿರಾಕರಣಾತ್ಮಕ ಹೋಲಿಕೆಗಳನ್ನು ಉಳಿಸಿ, ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅಡಿಕುರಿಪುಗಳಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
