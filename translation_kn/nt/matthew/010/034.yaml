id: MAT.10.34
reference: Matthew 10:34
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: kn
  text: “ನಾನು ಭೂಮಿಯ ಮೇಲೆ ಶಾಂತಿಯನ್ನು ತರಲು ಬಂದೆನು ಎಂದು ಭಾವಿಸಬೇಡಿರಿ.[a] ನಾನು ಶಾಂತಿಯನ್ನು ತರಲು ಬಂದದ್ದಲ್ಲ, ಆದರೆ ಕತ್ತಿಯನ್ನು ತರಲು ಬಂದೆನು.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಾನು ಬಂದಿದ್ದೇನೆ’ ಎಂದು ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಕತ್ತಿ’ ಎಂದಿದೆ; ಸಂದರ್ಭದಲ್ಲಿ ಈ ಚಿತ್ರವು ಹಿಂಸೆಯನ್ನು ಸಮರ್ಥಿಸುವುದಲ್ಲ, ವಿಭಜನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: ಭಾವಿಸಬೇಡಿರಿ
  rationale: μή ಜೊತೆಯಲ್ಲಿರುವ aorist subjunctive ಇಲ್ಲಿ ನಿಷೇಧಾರ್ಥಕವಾಗಿದೆ. ‘ಭಾವಿಸಬೇಡಿರಿ’ ಸಹಜವಾದ, ನೇರವಾದ ಕನ್ನಡವಾಗಿದ್ದು ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿಸ್ತರಿಸುವುದಿಲ್ಲ.
- source_word: ἦλθον
  choice: ಬಂದೆನು
  rationale: ಮಿಷನ್ ಅಥವಾ ಉದ್ದೇಶವನ್ನು ತಿಳಿಸುವ ಈ aorist ರೂಪಕ್ಕೆ ‘ಬಂದೆನು’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದೆ; ಸಂದರ್ಭಾನುಸಾರ ‘ಬಂದಿದ್ದೇನೆ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
- source_word: βαλεῖν
  choice: ತರಲು
  rationale: βάλλω ಪದದ ಮೂಲ ಅರ್ಥ ‘ಎಸೆಯುವುದು/ಹಾಕುವುದು’ ಆದರೂ, ಶಾಂತಿ ಮತ್ತು ಖಡ್ಗ ಎಂಬ ಕರ್ಮಪದಗಳೊಂದಿಗೆ ಇಲ್ಲಿ ಉದ್ದೇಶಿತ ಪರಿಣಾಮವನ್ನು ಸೂಚಿಸುವ ‘ತರಲು’ ಸ್ಪಷ್ಟವಾದ ಕನ್ನಡವಾಗಿದೆ.
- source_word: εἰρήνην
  choice: ಶಾಂತಿಯನ್ನು
  rationale: εἰρήνη ಪದದ ಸಾಮಾನ್ಯ ಮತ್ತು ಸಂದರ್ಭೋಚಿತ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ ‘ಶಾಂತಿ’.
- source_word: ἐπὶ τὴν γῆν
  choice: ಭೂಮಿಯ ಮೇಲೆ
  rationale: ἐπί + accusative ಇಲ್ಲಿ ಭೂಮಿಯ ಮೇಲೆ ಅಥವಾ ಭೂಮಿಗೆ ಸಂಬಂಧಿಸಿದ ವ್ಯಾಪ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಭೂಮಿಯ ಮೇಲೆ’ ಮೂಲದ ರೂಪವನ್ನು ಪಾರದರ್ಶಕವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀλλὰ
  choice: ಬದಲಾಗಿ
  rationale: ಮೊದಲ ಉದ್ದೇಶವನ್ನು ನಿರಾಕರಿಸಿ ವಿರುದ್ಧವಾದ ಚಿತ್ರವನ್ನು ಮುಂದಿಡುವ ಬಲವಾದ ವ್ಯತ್ಯಾಸವನ್ನು ‘ಬದಲಾಗಿ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μάχαιραν
  choice: ಖಡ್ಗವನ್ನು
  rationale: μάχαιρα ಕತ್ತಿ ಅಥವಾ ಚಿಕ್ಕ ಖಡ್ಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮೂಲದ ಸ್ಪಷ್ಟ ಚಿತ್ರವನ್ನು ‘ವಿಭಜನೆ’ ಎಂದು ವ್ಯಾಖ್ಯಾನಿಸಿ ಬದಲಿಸದೆ ‘ಖಡ್ಗ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಮಾತಿನಲ್ಲಿರುವ ‘ಖಡ್ಗ’ ಎಂಬ ಚಿತ್ರವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ವಿಭಜನೆ’ ಎಂದು ಮೃದುಗೊಳಿಸಬೇಕೇ?
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಖಡ್ಗ’ ಎಂಬ ಸ್ಪಷ್ಟ ಚಿತ್ರವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ವಿಭಜನೆ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ನೇರವಾಗಿ μάχαιραν (‘ಖಡ್ಗ’) ಎಂದಿದೆ. ಮುಂದಿನ ಸಂದರ್ಭವು ಕುಟುಂಬಗಳೊಳಗಿನ ವಿಭಜನೆಯನ್ನು ವಿವರಿಸಿದರೂ, ಮುಖ್ಯ ಪಠ್ಯವು ರೂಪಕವನ್ನು ವ್ಯಾಖ್ಯಾನದಿಂದ ಬದಲಿಸದೆ ಅದರ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಬೇಕು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿನ ಮೊದಲ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಗೆ ‘ಬಂದೆನು’ ಎಂಬ dignified ರೂಪವನ್ನೂ, ಬಹುವಚನ ಸಂಬೋಧನೆಗೆ ‘ಭಾವಿಸಬೇಡಿರಿ’ ಎಂಬ ರೂಪವನ್ನೂ ಬಳಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ‘ಶಾಂತಿ/ಖಡ್ಗ’ ವಿರೋಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
