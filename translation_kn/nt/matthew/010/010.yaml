id: MAT.10.10
reference: Matthew 10:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: kn
  text: ಪ್ರಯಾಣಕ್ಕಾಗಿ ಚೀಲವನ್ನಾಗಲಿ, ಎರಡು ಒಳಂಗಿಗಳನ್ನಾಗಲಿ, ಪಾದರಕ್ಷೆಗಳನ್ನಾಗಲಿ, ಕೋಲನ್ನಾಗಲಿ[a] ತೆಗೆದುಕೊಳ್ಳಬೇಡಿ; ಏಕೆಂದರೆ ಕೆಲಸಗಾರನು ತನ್ನ ಆಹಾರಕ್ಕೆ ಅರ್ಹನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮಾರ್ಕ 6:8ರಲ್ಲಿ ಕೋಲನ್ನು ತೆಗೆದುಕೊಂಡು ಹೋಗಲು ಅನುಮತಿ ಇರುವುದರ ಬೆಳಕಿನಲ್ಲಿ, ಇಲ್ಲಿ ‘ಕೋಲು’ ಎಂಬುದು ಹೆಚ್ಚುವರಿ ಕೋಲನ್ನು ನಿಷೇಧಿಸುತ್ತದೆ ಎಂದು ಕೆಲವರು ಗ್ರಹಿಸುತ್ತಾರೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: ಚೀಲ
  rationale: ಈ ಪದವು ಪ್ರಯಾಣದಲ್ಲಿ ಆಹಾರಸಾಮಗ್ರಿ ಮುಂತಾದವುಗಳನ್ನು ಹೊತ್ತೊಯ್ಯುವ ಚೀಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಪ್ರಯಾಣಕ್ಕಾಗಿ’ ಎಂಬ ಸಂದರ್ಭಪದವು ಅದರ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: εἰς ὁδὸν
  choice: ಪ್ರಯಾಣಕ್ಕಾಗಿ
  rationale: ಪ್ರಯಾಣಕ್ಕೆ ಜೊತೆಯಲ್ಲಿ ತೆಗೆದುಕೊಂಡು ಹೋಗುವುದನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δύο χιτῶνας
  choice: ಎರಡು ಒಳಂಗಿಗಳು
  rationale: χιτών ದೇಹದ ಮೇಲೆ ಧರಿಸುವ ಮೂಲಭೂತ ಒಳವಸ್ತ್ರವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಒಳಂಗಿ’ ಐತಿಹಾಸಿಕ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑποδήματα
  choice: ಪಾದರಕ್ಷೆಗಳು
  rationale: ಪಾದಕ್ಕೆ ಕಟ್ಟಿಕೊಳ್ಳುವ ಪಾದರಕ್ಷೆಯನ್ನು ಸೂಚಿಸುವ ವ್ಯಾಪಕ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದ; ಮೊದಲ ಶತಮಾನದ ಸಂದರ್ಭದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಚಪ್ಪಲಿ/ಸ್ಯಾಂಡಲ್ ಆಗಿರಬಹುದು.
- source_word: ῥάβδον
  choice: ಕೋಲು
  rationale: ಇಲ್ಲಿ ಪ್ರಯಾಣದ ವೇಳೆ ಬಳಸುವ ಕೈಕೋಲನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮತ್ತೊಂದು ಸುವಾರ್ತೆಯೊಡನೆಯ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಸಮನ್ವಯಗೊಳಿಸದೆ ಗ್ರೀಕ್ ಪಟ್ಟಿಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἄξιος
  choice: ಯೋಗ್ಯನು
  rationale: ಹಕ್ಕುದಾರನಾಗಿರುವುದು ಅಥವಾ ಪಡೆಯಲು ಅರ್ಹನಾಗಿರುವುದು ಎಂಬ ಮೌಲ್ಯನಿರ್ಣಯದ ಛಾಯೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ ἐργάτης
  choice: ಕೆಲಸಗಾರನು
  rationale: ಕೆಲಸ ಮಾಡುವ ವ್ಯಕ್ತಿ ಎಂಬ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ; ಅನಗತ್ಯವಾದ ಧಾರ್ಮಿಕ ತಾಂತ್ರಿಕ ಅರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: ತನ್ನ ಆಹಾರಕ್ಕೆ
  rationale: τροφήಯ ನೇರವಾದ ‘ಆಹಾರ/ಪೋಷಣೆ’ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ‘ಬೆಂಬಲ’ ಎಂಬ ವಿಶಾಲ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಪ್ರಯಾಣೋಪಕರಣಗಳ ಕುರಿತು ಸಮಾಂತರ ಸುವಾರ್ತೆಗಳ ನಡುವೆ ಕಾಣುವ ವ್ಯತ್ಯಾಸ
  choice: ಮತ್ತಾಯನಲ್ಲಿರುವ ‘ಕೋಲನ್ನಾಗಲಿ ತೆಗೆದುಕೊಳ್ಳಬೇಡಿ’ ಎಂಬ ನಿಷೇಧವನ್ನು ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಮಾರ್ಕ 6:8ಕ್ಕೆ ಹೊಂದಿಸಲು ಇದನ್ನು ‘ಹೆಚ್ಚುವರಿ ಕೋಲು’ ಎಂದು ಅರ್ಥೈಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ῥάβδον ಅನ್ನು ನಿಷೇಧಿತ ವಸ್ತುಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಸಮಾಂತರ ವೃತ್ತಾಂತದ ವ್ಯತ್ಯಾಸವನ್ನು ಮೌನವಾಗಿ ಪರಿಹರಿಸದೆ, ಮೂಲದ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಉಳಿಸಿ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಪರ್ಯಾಯ ಗ್ರಹಿಕೆಯನ್ನು ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಪೂರ್ಣವೂ ಆದ ಶೈಲಿ. ವಸ್ತುಪಟ್ಟಿಯ ಪುನರಾವರ್ತಿತ μηδέ ರಚನೆಯನ್ನು ‘-ವನ್ನಾಗಲಿ’ ರೂಪಗಳಿಂದ ಉಳಿಸಲಾಗಿದೆ. ಮುಖ್ಯಪಠ್ಯವು ಮೂಲ ಗ್ರೀಕ್‌ನ ಸ್ಪಷ್ಟ ನಿಷೇಧವನ್ನು ಕಾಪಾಡುತ್ತದೆ; ಸಮಾಂತರ ವೃತ್ತಾಂತದ ಸಮನ್ವಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸಲಾಗಿದೆ.
