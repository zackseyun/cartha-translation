review_pass:
  verdict: revise
  source_fidelity: 'The item sequence and prohibitions accurately reflect the SBLGNT: a travel bag, two tunics, footwear, and a staff are all included under the prohibition. The concluding clause retains the concrete sense of τροφή as food. “ಅರ್ಹನು” is a more idiomatic Kannada expression for ἄξιος in this construction than “ಯೋಗ್ಯನು.”'
  naturalness: The draft is generally clear modern standard Kannada. Moving the footnote marker directly after “ಕೋಲನ್ನಾಗಲಿ” gives it an unambiguous anchor. “ತನ್ನ ಆಹಾರಕ್ಕೆ ಅರ್ಹನು” is natural and concise while preserving the Greek sense.
  terminology: “ಚೀಲ,” “ಒಳಂಗಿಗಳು,” “ಪಾದರಕ್ಷೆಗಳು,” and “ಕೋಲು” are suitable choices. “ಒಳಂಗಿಗಳು” appropriately conveys χιτῶνες without reducing it to modern shirts. The footnote should present the extra-staff interpretation as an interpretation prompted by the Mark parallel, not as a conclusion established by it.
  issues:
  - severity: low
    issue: The footnote marker is placed at the end of the verse rather than on the phrase concerning the staff.
    rationale: The note specifically concerns ῥάβδον / “ಕೋಲನ್ನಾಗಲಿ.” Placing the marker immediately after that phrase provides a clear anchor.
  - severity: low
    issue: “ತನ್ನ ಆಹಾರಕ್ಕೆ ಯೋಗ್ಯನು” is somewhat less idiomatic in modern Kannada.
    rationale: “ತನ್ನ ಆಹಾರಕ್ಕೆ ಅರ್ಹನು” communicates “worthy/deserving of his food” more naturally without broadening τροφή into general support.
  - severity: low
    issue: The footnote’s causal wording may sound more definite than the English audit trail.
    rationale: The note should indicate that the Mark parallel motivates an interpretive proposal, while preserving Matthew’s direct prohibition in the main text.
  revised_text: ಪ್ರಯಾಣಕ್ಕಾಗಿ ಚೀಲವನ್ನಾಗಲಿ, ಎರಡು ಒಳಂಗಿಗಳನ್ನಾಗಲಿ, ಪಾದರಕ್ಷೆಗಳನ್ನಾಗಲಿ, ಕೋಲನ್ನಾಗಲಿ[a] ತೆಗೆದುಕೊಳ್ಳಬೇಡಿ; ಏಕೆಂದರೆ ಕೆಲಸಗಾರನು ತನ್ನ ಆಹಾರಕ್ಕೆ ಅರ್ಹನು.
