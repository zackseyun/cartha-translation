  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: kn
  text: ಫಿಲಿಪ್ಪ ಮತ್ತು ಬಾರ್ತೊಲೊಮಾಯ[a], ತೋಮ ಮತ್ತು ಸುಂಕ ವಸೂಲಿಗಾರನಾದ ಮತ್ತಾಯ, ಅಲ್ಫಾಯನ ಮಗನಾದ ಯಾಕೋಬ ಮತ್ತು ತದ್ದಾಯ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ ಇಲ್ಲಿ “ಲೆಬ್ಬಾಯ” (ಅಥವಾ “ತದ್ದಾಯನೆಂದು ಕರೆಯಲ್ಪಟ್ಟ ಲೆಬ್ಬಾಯ”) ಎಂದಿದೆ; ಲೂಕನು ಕೊಡುವ ಅಪೊಸ್ತಲರ ಪಟ್ಟಿಗಳಲ್ಲಿ ಇದಕ್ಕೆ ಸರಿಯಾದ ಸ್ಥಳದಲ್ಲಿ “ಯಾಕೋಬನ ಯೂದ” ಎಂದು ಹೆಸರಿಸಲಾಗಿದೆ.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: ಫಿಲಿಪ್ಪ
  rationale: ವೈಯಕ್ತಿಕ ಹೆಸರನ್ನು ಕನ್ನಡದ ಸಾಂಪ್ರದಾಯಿಕ ಹೊಸ ಒಡಂಬಡಿಕೆಯ ರೂಪದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: Βαρθολομαῖος
  choice: ಬಾರ್ತೊಲೊಮಾಯ
  rationale: ಗ್ರೀಕ್ ವೈಯಕ್ತಿಕ ಹೆಸರಿನ ಗುರುತಿಸಬಹುದಾದ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
- source_word: Θωμᾶς
  choice: ತೋಮ
  rationale: ಹೆಸರಿನ ಗ್ರೀಕ್ ರೂಪಕ್ಕೆ ಸಮೀಪವಾಗಿದ್ದು, ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪ.
- source_word: Μαθθαῖος
  choice: ಮತ್ತಾಯ
  rationale: ಕನ್ನಡ ಕ್ರೈಸ್ತ ಬಳಕೆಯಲ್ಲಿ ಸ್ಥಿರವಾಗಿ ಗುರುತಿಸಲ್ಪಡುವ ಹೆಸರಿನ ರೂಪ.
- source_word: ὁ τελώνης
  choice: ಸುಂಕ ವಸೂಲಿಗಾರನಾದ
  rationale: τελώνης ತೆರಿಗೆ ಅಥವಾ ಸುಂಕ ವಸೂಲಿಸುವವನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಪಟ್ಟಿಯೊಳಗೆ ಸಹಜವಾಗಿ ಓದಲು ವಿಶೇಷಣಾತ್ಮಕ ರೂಪ ಬಳಸಲಾಗಿದೆ.
- source_word: Ἰάκωβος
  choice: ಯಾಕೋಬ
  rationale: ಗ್ರೀಕ್ Ἰάκωβος ಹೆಸರಿನ ಮೂಲರೂಪವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುವ, ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪ.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: ಅಲ್ಫಾಯನ ಮಗ
  rationale: ಗ್ರೀಕ್ ಸಂಬಂಧಸೂಚಕ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಇಲ್ಲಿ ಪಿತೃತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಲಾಗಿದೆ.
- source_word: Ἁλφαίου
  choice: ಅಲ್ಫಾಯ
  rationale: ವೈಯಕ್ತಿಕ ಹೆಸರಿನ ಕನ್ನಡ ಲಿಪ್ಯಂತರ; ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯವನ್ನು ಕನ್ನಡ ವ್ಯಾಕರಣಕ್ಕೆ ತಕ್ಕಂತೆ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: Θαδδαῖος
  choice: ತದ್ದಾಯ
  rationale: SBLGNT ಮುಖ್ಯಪಾಠದಲ್ಲಿರುವ ಹೆಸರನ್ನು ನೇರವಾಗಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ; ಪರ್ಯಾಯ ಪಾಠಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಗ್ರೀಕ್ ಪಟ್ಟಿಯ ಸರಳ ಸಮುಚ್ಚಯ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪಟ್ಟಿಯ ಕೊನೆಯ ಅಪೊಸ್ತಲನ ಗುರುತು
  choice: ತದ್ದಾಯ
  alternative: ಲೆಬ್ಬಾಯ; ಯಾಕೋಬನ ಮಗ ಯೂದ
  rationale: ಒದಗಿಸಿದ SBLGNT ಪಾಠದಲ್ಲಿ Θαδδαῖος ಇರುವುದರಿಂದ ಮುಖ್ಯಪಾಠದಲ್ಲಿ ‘ತದ್ದಾಯ’ ಇಡಲಾಗಿದೆ. ಹಸ್ತಪ್ರತಿ ಮತ್ತು ಸಮಾಂತರ ಪಟ್ಟಿಗಳಲ್ಲಿನ ಭಿನ್ನ ಹೆಸರುಗಳನ್ನು ಸಮನ್ವಯಗೊಳಿಸದೆ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವಂತೆ ಗೌರವಯುತ ಪಟ್ಟಿಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಹೆಸರಗಳಿಗೆ ಕನ್ನಡ ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಪರಿಚಿತ ರೂಪಗಳನ್ನು ಆಯ್ದು, ಮೂಲದ ಸಮುಚ್ಚಯ ವಿನ್ಯಾಸ ಮತ್ತು ಪಾಠಭೇದದ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
