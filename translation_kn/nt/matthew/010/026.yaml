review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential ‘therefore,’ the prohibition against fearing ‘them,’ and the two parallel universal assertions. However, adding ‘ಉಳಿಯ’ in the negative-future clauses makes the future/result sense clearer and more idiomatic without specifying an agent or audience.
  naturalness: ‘ಬಯಲಾಗದೆ ಇರುವುದಿಲ್ಲ’ and especially ‘ತಿಳಿಯದೆ ಇರುವುದಿಲ್ಲ’ are understandable but slightly stiff in modern Kannada. ‘ಬಯಲಾಗದೆ ಉಳಿಯುವುದಿಲ್ಲ’ / ‘ತಿಳಿಯದೆ ಉಳಿಯುವುದಿಲ್ಲ’ are natural parallel formulations.
  terminology: ‘ಮುಚ್ಚಲ್ಪಟ್ಟಿರುವ’ suitably renders κεκαλυμμένον (‘covered/concealed’), ‘ಬಯಲಾಗುವುದು’ renders ἀποκαλυφθήσεται, and ‘ಮರೆಯಾಗಿರುವ’ suitably renders κρυπτόν. No theological terms or footnotes are required.
  issues:
  - severity: low
    issue: Negative future clauses lack ‘ಉಳಿಯ’
    rationale: The existing wording is intelligible, but ‘...ದೆ ಉಳಿಯುವುದಿಲ್ಲ’ is a more idiomatic Kannada way to express ‘will not remain unrevealed/unknown’ and preserves the Greek future passive/result sense.
  revised_text: ಆದ್ದರಿಂದ ಅವರಿಗೆ ಹೆದರಬೇಡಿ. ಏಕೆಂದರೆ ಮುಚ್ಚಲ್ಪಟ್ಟಿರುವ ಯಾವುದೂ ಬಯಲಾಗದೆ ಉಳಿಯುವುದಿಲ್ಲ; ಮರೆಯಾಗಿರುವ ಯಾವುದೂ ತಿಳಿಯದೆ ಉಳಿಯುವುದಿಲ್ಲ.
  revised_footnotes: []
  revision_rationale: A minor idiomatic revision improves the two balanced future-negative clauses while retaining the source text’s ambiguity about who reveals or knows, its parallelism, and the English audit trail’s ‘covered’/‘hidden’ distinction.
