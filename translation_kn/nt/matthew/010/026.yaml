id: MAT.10.26
reference: Matthew 10:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ ಅವರಿಗೆ ಹೆದರಬೇಡಿ. ಏಕೆಂದರೆ ಮುಚ್ಚಲ್ಪಟ್ಟಿರುವ ಯಾವುದೂ ಬಯಲಾಗದೆ ಉಳಿಯುವುದಿಲ್ಲ; ಮರೆಯಾಗಿರುವ ಯಾವುದೂ ತಿಳಿಯದೆ ಉಳಿಯುವುದಿಲ್ಲ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: ಆದ್ದರಿಂದ ಅವರಿಗೆ ಹೆದರಬೇಡಿ
  rationale: οὖν ಎಂಬ ನಿರ್ಣಾಯಕ ಸಂಬಂಧವನ್ನು ‘ಆದ್ದರಿಂದ’ ಎಂದು ಉಳಿಸಿ, φοβηθῆτε ಅನ್ನು ಸಹಜವಾದ ಆಜ್ಞಾರ್ಥಕ ಕನ್ನಡದಲ್ಲಿ ‘ಹೆದರಬೇಡಿ’ ಎಂದು ನೀಡಲಾಗಿದೆ; αὐτούς ಎಂಬ ಬಹುವಚನ ಸರ್ವನಾಮವನ್ನು ‘ಅವರಿಗೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: κεκαλυμμένον
  choice: ಮುಚ್ಚಲ್ಪಟ್ಟಿರುವ
  rationale: ಪೂರ್ಣಕೃತ ಭಾವ ಮತ್ತು ಮುಚ್ಚಿರುವ ಸ್ಥಿತಿಯನ್ನು ಉಳಿಸುವ ನೇರ, ಅರ್ಥಗ್ರಾಹ್ಯ ಪದಪ್ರಯೋಗ; ಮುಂದಿನ ἀποκαλυφθήσεται ಜೊತೆಗಿನ ಮುಚ್ಚು/ಬಯಲು ವಿರೋಧವನ್ನೂ ಕಾಯುತ್ತದೆ.
- source_word: ἀποκαλυφθήσεται
  choice: ಬಯಲಾಗದೆ ಇರುವುದಿಲ್ಲ
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಸಹಜ ದ್ವಿನಿಷೇಧ ರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಿ, ‘ಖಂಡಿತ ಬಯಲಾಗುವುದು’ ಎಂಬ ಮೂಲದ ಅರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: κρυπτὸν
  choice: ಮರೆಯಾಗಿರುವ
  rationale: ‘ಗುಪ್ತ’ಕ್ಕಿಂತ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದ್ದು, ಯಾವುದೋ ಅಡಗಿದ ಅಥವಾ ಮರೆಯಾದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: γνωσθήσεται
  choice: ತಿಳಿಯದೆ ಇರುವುದಿಲ್ಲ
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ‘ತಿಳಿಯಲ್ಪಡುವುದು/ತಿಳಿದುಬರುವುದು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸರಳ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ಯಾರು ತಿಳಿಯುವರು ಎಂಬುದನ್ನು ಮೂಲದಂತೆ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಬಯಲಾಗುವುದು ಮತ್ತು ತಿಳಿಯಲ್ಪಡುವುದರ ವ್ಯಾಪ್ತಿ ಅಥವಾ ಕರ್ತೃ
  choice: ಮೂಲದ ಸಾಮಾನ್ಯ ಹಾಗೂ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ಯಾರು ಬಯಲಿಗೆ ತರುವರು ಅಥವಾ ಯಾರಿಗೆ ತಿಳಿಯುವುದು ಎಂಬುದನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
  alternative: ‘ದೇವರು ಬಯಲಿಗೆ ತರುವನು’ ಅಥವಾ ‘ಎಲ್ಲರಿಗೂ ತಿಳಿಯುವುದು’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಕರ್ತೃ ಅಥವಾ ತಿಳಿಯುವವರ ವಲಯವನ್ನು ಹೇಳುವುದಿಲ್ಲ; ಅದನ್ನು ತುಂಬುವುದು ಅನಗತ್ಯವಾದ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ನಿರ್ಣಯವಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ವಾಕ್ಯರಚನೆ. ಎರಡು ಸಮಾಂತರ ಹೇಳಿಕೆಗಳನ್ನು ಅರ್ಧವಿರಾಮದಿಂದ ಜೋಡಿಸಿ ಮೂಲದ ವಾಕ್ಚಾತುರ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಯಾವುದೇ ಪಾದಟಿಪ್ಪಣಿ ಅಗತ್ಯವಿಲ್ಲ.
