review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the indefinite persecution condition, the urgent imperative to flee to another city, the emphatic negation, and the deliberately unresolved timing of the Son of Man's coming. However, “ಮುಗಿಸಿರುವುದಿಲ್ಲ” is ordinarily present-perfect/past-oriented in Kannada and does not as clearly convey the Greek future-oriented emphatic prediction (οὐ μὴ τελέσητε).
  naturalness: The language is modern, clear, and appropriately dignified. Replacing “ಮುಗಿಸಿರುವುದಿಲ್ಲ” with the future-perfect negative “ಮುಗಿಸಿರಲಾರಿರಿ” makes the final clause more idiomatic and temporally precise in Kannada.
  terminology: “ಹಿಂಸಿಸಿದಾಗಲೆಲ್ಲ,” “ಓಡಿಹೋಗಿರಿ,” “ಇಸ್ರಾಯೇಲಿನ,” and “ಮನುಷ್ಯಕುಮಾರನು” are suitable choices. “ಮನುಷ್ಯಕುಮಾರನು” preserves the established biblical title without imposing an interpretation.
  issues:
  - severity: medium
    issue: Future force of οὐ μὴ τελέσητε is not fully expressed by “ಮುಗಿಸಿರುವುದಿಲ್ಲ.”
    rationale: In Kannada, “ಮುಗಿಸಿರುವುದಿಲ್ಲ” normally states that something has not been completed, whereas the Greek gives an emphatic prediction that the disciples will not have completed their traversal by the time the Son of Man comes. “ಮುಗಿಸಿರಲಾರಿರಿ” naturally conveys this prospective, future-perfect sense.
