id: MAT.10.23
reference: Matthew 10:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: kn
  text: ಆದರೆ ಅವರು ಈ ಪಟ್ಟಣದಲ್ಲಿ ನಿಮ್ಮನ್ನು ಹಿಂಸಿಸಿದಾಗಲೆಲ್ಲ, ಇನ್ನೊಂದು ಪಟ್ಟಣಕ್ಕೆ ಓಡಿಹೋಗಿರಿ.[a] ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುವುದೇನೆಂದರೆ, ಮನುಷ್ಯಕುಮಾರನು ಬರುವ ತನಕ ನೀವು ಇಸ್ರಾಯೇಲಿನ ಪಟ್ಟಣಗಳಲ್ಲಿ ಸಂಚರಿಸುವುದನ್ನು ಖಂಡಿತವಾಗಿಯೂ ಮುಗಿಸಿರಲಾರಿರಿ.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಬೇರೆ ಪಟ್ಟಣಕ್ಕೆ ಓಡಿಹೋಗಿರಿ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಇನ್ನೊಂದಕ್ಕೆ’ ಎಂದಿದ್ದು, ಹಿಂದಿನ ವಾಕ್ಯಾಂಶದಿಂದ ‘ಪಟ್ಟಣ’ ಎಂಬ ಪದವು ಅಧ್ಯಾಹೃತವಾಗಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ನೀವು ಇಸ್ರಾಯೇಲಿನ ಪಟ್ಟಣಗಳನ್ನು ಖಂಡಿತವಾಗಿಯೂ ಮುಗಿಸಿರಲಾರಿರಿ.’ ‘ಪಟ್ಟಣಗಳಲ್ಲಿ ಸಂಚರಿಸುವುದನ್ನು’ ಎಂಬ ಭಾಷಾಂತರವು ಮಿಷನ್‌ಗಾಗಿ ಪಟ್ಟಣದಿಂದ ಪಟ್ಟಣಕ್ಕೆ ಹೋಗುವ ಅಧ್ಯಾಹೃತ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: c
    text: ‘ಮನುಷ್ಯಕುಮಾರನು ಬರುವ ತನಕ’ ಎಂಬುದನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಮುಕ್ತವಾಗಿಡಲಾಗಿದೆ. ಇದು ಯೇಸುವಿನ ಸಮರ್ಥನೆ, ನ್ಯಾಯತೀರ್ಪಿಗಾಗಿ ಬರುವಿಕೆ, ಅಥವಾ ಅವರ ಅಂತಿಮ ಪುನರಾಗಮನ—ಇವುಗಳಲ್ಲಿ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂಬುದರಲ್ಲಿ ವ್ಯಾಖ್ಯಾನಕಾರರ ಅಭಿಪ್ರಾಯಗಳು ಭಿನ್ನವಾಗಿವೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: ಹಿಂಸಿಸಿದಾಗಲೆಲ್ಲ
  rationale: ಅನಿರ್ದಿಷ್ಟವಾಗಿ ಸಂಭವಿಸಬಹುದಾದ ಅಥವಾ ಮರುಕಳಿಸಬಹುದಾದ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುವ ὅταν ಎಂಬುದರ ಮುಕ್ತ ಕಾಲಾರ್ಥವನ್ನು ‘-ಆಗಲೆಲ್ಲ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διώκωσιν
  choice: ಹಿಂಸಿಸಿದಾಗ
  rationale: ಮಿಷನ್ ಸಂದರ್ಭದಲ್ಲಿನ ಈ ಕ್ರಿಯಾಪದವು ಕೇವಲ ಹಿಂಬಾಲಿಸುವುದನ್ನಲ್ಲ, ಶತ್ರುತ್ವದಿಂದ ಕಿರುಕುಳ ಕೊಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: πόλει ταύτῃ
  choice: ಈ ಪಟ್ಟಣದಲ್ಲಿ
  rationale: ταύτῃಯ ಸಮೀಪಸೂಚಕ ಅರ್ಥ ಮತ್ತು ಯೇಸುವಿನ ನೇರ ಸೂಚನೆಯ ಸ್ವರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: φεύγετε
  choice: ಓಡಿಹೋಗಿರಿ
  rationale: ಹಿಂಸೆಯ ಎದುರು ತಕ್ಷಣ ಸ್ಥಳ ತೊರೆಯಬೇಕೆಂಬ ಆಜ್ಞೆಯ ತುರ್ತುತನವನ್ನು ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: εἰς τὴν ἑτέραν
  choice: ಇನ್ನೊಂದು ಪಟ್ಟಣಕ್ಕೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯಾಂಶದಿಂದ πόλις ಎಂಬ ನಾಮಪದವು ಅಧ್ಯಾಹೃತವಾಗಿದೆ; ἑτέραν ಅನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ‘ಮುಂದಿನದು’ ಎಂದು ಬಿಗಿಗೊಳಿಸದೆ ‘ಇನ್ನೊಂದು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἀμὴν
  choice: ನಿಜವಾಗಿ
  rationale: ಅಧಿಕಾರಪೂರ್ಣ ಗಂಭೀರ ಹೇಳಿಕೆಯನ್ನು ಪರಿಚಯಿಸುವ ಏಕವಚನ ಸೂತ್ರಕ್ಕೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಸಮರ್ಪಕ ಕನ್ನಡ ರೂಪ.
- source_word: οὐ μὴ τελέσητε
  choice: ಖಂಡಿತವಾಗಿಯೂ ಮುಗಿಸಿರುವುದಿಲ್ಲ
  rationale: οὐ μήಯ ಬಲವಾದ ನಿರಾಕರಣೆಯನ್ನು ‘ಖಂಡಿತವಾಗಿಯೂ ... ಇಲ್ಲ’ ಎಂದು ಉಳಿಸಿ, τελέωದ ಪೂರ್ಣಗೊಳಿಸುವ ಅರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: ಇಸ್ರಾಯೇಲಿನ ಪಟ್ಟಣಗಳಲ್ಲಿ ಸಂಚರಿಸುವುದನ್ನು
  rationale: ಮೂಲದಲ್ಲಿರುವ ‘ಇಸ್ರಾಯೇಲಿನ ಪಟ್ಟಣಗಳು’ ಎಂಬ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತಾ, ಮಿಷನ್ ಪ್ರಯಾಣದ ಸಂದರ್ಭದಲ್ಲಿ ಅಧ್ಯಾಹೃತವಾಗಿರುವ ಪಟ್ಟಣಗಳಲ್ಲಿ ಸಂಚರಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸಹಜತೆಗೆ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- source_word: ἕως ἂν ἔλθῃ
  choice: ಬರುವ ತನಕ
  rationale: ಭವಿಷ್ಯದ ಒಂದು ಬಿಂದುವಿನವರೆಗೆ ಕಾರ್ಯ ಪೂರ್ಣವಾಗುವುದಿಲ್ಲ ಎಂಬ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಈ ಸ್ವಯಂ-ಸೂಚಕ ಬಿರುದಿನ ಸ್ಥಿರ ಬೈಬಲ್ ರೂಪವಾಗಿದ್ದು, ಅದರ ಶಾಬ್ದಿಕ ಮತ್ತು ದಾನಿಯೇಲೀಯ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಮನುಷ್ಯಕುಮಾರನು ಬರುವ ತನಕ’ ಎಂಬುದರ ಸಂದರ್ಭಸೂಚಿತ ಅರ್ಥ
  choice: ಯಾವ ಘಟನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ‘ಮನುಷ್ಯಕುಮಾರನು ಬರುವ ತನಕ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದು ಯೇಸುವಿನ ಪುನರುತ್ಥಾನ/ಸಮರ್ಥನೆ, ಯೆರೂಸಲೇಮಿನ ಮೇಲಿನ ನ್ಯಾಯತೀರ್ಪು, ಅಥವಾ ಅಂತಿಮ ಪುನರಾಗಮನ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವೇ ಇಲ್ಲಿ ಉದ್ದೇಶಿತ ಘಟನೆಯನ್ನು ನಿರ್ಣಯಿಸುವುದಿಲ್ಲ; ಆದ್ದರಿಂದ ವಿವಾದಿತ ಅಂತ್ಯಕಾಲದ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ನಿಜವಾದ ದೇವತಾತ್ತ್ವಿಕ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ‘ಓಡಿಹೋಗಿರಿ’ ಆಜ್ಞೆಯ ತುರ್ತುತನವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಮನುಷ್ಯಕುಮಾರನು’ ಎಂಬ ಪರಿಚಿತ ಶಾಸ್ತ್ರೀಯ ಬಿರುದನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಎಲ್ಲಾ ಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
