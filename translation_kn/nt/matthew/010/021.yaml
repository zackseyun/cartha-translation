id: MAT.10.21
reference: Matthew 10:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: kn
  text: ಸಹೋದರನು ಸಹೋದರನನ್ನು ಮರಣಕ್ಕೆ ಒಪ್ಪಿಸಿಕೊಡುವನು[a]; ತಂದೆಯು ತನ್ನ ಮಗುವನ್ನು ಮರಣಕ್ಕೆ ಒಪ್ಪಿಸಿಕೊಡುವನು. ಮಕ್ಕಳು ತಮ್ಮ ತಂದೆತಾಯಿಗಳ ವಿರುದ್ಧ ಎದ್ದು ಅವರನ್ನು ಕೊಲ್ಲುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಒಪ್ಪಿಸುವನು’; ಈ ಕ್ರಿಯಾಪದವು ದ್ರೋಹದ ಸಂದರ್ಭಗಳಲ್ಲಿ ‘ದ್ರೋಹದಿಂದ ಹಿಡಿದುಕೊಡುವನು’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಹೊಂದಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: ಒಪ್ಪಿಸುವನು
  rationale: ಇಲ್ಲಿ ಕ್ರಿಯಾಪದವು ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನು ಮರಣಕ್ಕೆ ಅಥವಾ ವೈರಿ ಅಧಿಕಾರಿಗಳ ವಶಕ್ಕೆ ಒಪ್ಪಿಸಿಕೊಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಒಪ್ಪಿಸುವನು’ ಎಂಬುದು ದ್ರೋಹದ ಸಾಧ್ಯ ಛಾಯೆಯನ್ನು ಅಳಿಸದೆ, ಅದನ್ನೇ ಏಕೈಕ ಅರ್ಥವಾಗಿ ಹೇರದು.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: ಸಹೋದರನು ಸಹೋದರನನ್ನು
  rationale: ಮೂಲದ ಪುಲ್ಲಿಂಗ, ಪ್ರತಿನಿಧಿಕ ಏಕವಚನ ಕುಟುಂಬ ಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς θάνατον
  choice: ಮರಣಕ್ಕೆ
  rationale: ಈ ಪದಬಂಧವು ಒಪ್ಪಿಸುವಿಕೆಯ ಗುರಿ ಅಥವಾ ಫಲ ಮರಣವೆಂದು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πατὴρ τέκνον
  choice: ತಂದೆಯು ತನ್ನ ಮಗುವನ್ನು
  rationale: τέκνον ಲಿಂಗನಿರ್ದಿಷ್ಟವಲ್ಲದ ‘ಮಗು’; ಕನ್ನಡದಲ್ಲಿ ಸಂಬಂಧವನ್ನು ಸಹಜಗೊಳಿಸಲು ‘ತನ್ನ’ ಸೇರಿಸಲಾಗಿದೆ. ಮೊದಲ ಕ್ರಿಯಾಪದದ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟತೆಗಾಗಿ ಪುನರುಕ್ತಗೊಳಿಸಲಾಗಿದೆ.
- source_word: ἐπαναστήσονται
  choice: ವಿರುದ್ಧವಾಗಿ ಎದ್ದು
  rationale: ವಿರೋಧಿಸಲು ಅಥವಾ ಎದುರಾಗಿ ಏಳಲು ಎಂಬ ಜೀವಂತ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ರಾಜಕೀಯ ಬಂಡಾಯವೆಂಬ ಕಿರಿದಾದ ಅರ್ಥವನ್ನು ಹೇರುವುದಿಲ್ಲ.
- source_word: τέκνα ... ἐπὶ γονεῖς
  choice: ಮಕ್ಕಳು ತಮ್ಮ ತಂದೆತಾಯಿಗಳಿಗೆ ವಿರುದ್ಧವಾಗಿ
  rationale: τέκνα ಮತ್ತು γονεῖς ಎರಡೂ ವ್ಯಾಪಕ ಕುಟುಂಬಪದಗಳು. ‘ತಮ್ಮ’ ಕನ್ನಡದಲ್ಲಿ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: θανατώσουσιν αὐτούς
  choice: ಅವರನ್ನು ಕೊಲ್ಲಿಸುವರು
  rationale: θανατόω ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಮರಣಕ್ಕೆ ಗುರಿಮಾಡುವುದು ಅಥವಾ ಮರಣದಂಡನೆಗೆ ಕಾರಣವಾಗುವುದನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಕೊಲ್ಲಿಸುವರು’ ಎಂಬುದು ಮಕ್ಕಳು ಸ್ವತಃ ಕೊಲ್ಲಲೇಬೇಕು ಎಂದು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ, ಮರಣಕ್ಕೆ ಕಾರಣರಾಗುವ ಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಕುಟುಂಬಸಂಬಂಧದ ಲಿಂಗನಿರ್ದಿಷ್ಟ ಮತ್ತು ವ್ಯಾಪಕ ಪದಗಳು
  choice: ἀδελφός ಅನ್ನು ‘ಸಹೋದರ’ ಎಂದೂ, τέκνα/γονεῖς ಅನ್ನು ‘ಮಕ್ಕಳು/ತಂದೆತಾಯಿಗಳು’ ಎಂದೂ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ἀδελφός ಅನ್ನು ಲಿಂಗತಟಸ್ಥವಾಗಿ ‘ಒಡಹುಟ್ಟಿದವರು’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಮೂಲದಲ್ಲಿ ἀδελφός ಪುಲ್ಲಿಂಗವಾಗಿದ್ದು ನಿರ್ದಿಷ್ಟ ಸಹೋದರ ಸಂಬಂಧವನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ; τέκνα ಮತ್ತು γονεῖς ಸ್ವಭಾವತಃ ವ್ಯಾಪಕ ಪದಗಳಾಗಿರುವುದರಿಂದ ಅವುಗಳಿಗೆ ಒಳಗೊಳ್ಳುವ ಕನ್ನಡ ಪದಗಳು ಸೂಕ್ತ.
- issue: ಮರಣಕ್ಕೆ ಕಾರಣವಾಗುವ ವಿಧಾನದ ನಿರ್ದಿಷ್ಟತೆ
  choice: ‘ಕೊಲ್ಲಿಸುವರು’ ಎಂದು ಅನುವಾದಿಸಿ, ನೇರ ಹತ್ಯೆ ಮತ್ತು ಅಧಿಕಾರಿಗಳ ಮೂಲಕ ಮರಣಕ್ಕೆ ಗುರಿಮಾಡುವ ಸಾಧ್ಯತೆಗಳ ನಡುವಿನ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಕೊಲ್ಲುವರು’ ಎಂದು ನೇರ ಹತ್ಯೆಯಾಗಿ ಅಥವಾ ‘ಮರಣದಂಡನೆಗೆ ಒಪ್ಪಿಸುವರು’ ಎಂದು ನ್ಯಾಯಾಂಗ ಕ್ರಮವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು.
  rationale: θανατόω ಮರಣಕ್ಕೆ ಗುರಿಮಾಡುವುದನ್ನು ಹೇಳುತ್ತದೆ; ಆದರೆ ಈ ವಾಕ್ಯವೇ ಅದರ ನಿಖರ ವಿಧಾನವನ್ನು ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗಂಭೀರವೂ ಆದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಸಮಾನಾಂತರ ಕುಟುಂಬಸಂಬಂಧಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿಡಲು ಎರಡನೇ ಖಂಡದಲ್ಲಿ ಅರ್ಥಗತ ಕ್ರಿಯಾಪದವನ್ನು ಪುನರುಕ್ತಗೊಳಿಸಲಾಗಿದೆ; ಮೂಲದ ದ್ರೋಹ/ಒಪ್ಪಿಸುವಿಕೆ ಮತ್ತು ಮರಣದ ವಿಧಾನದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅತಿಯಾಗಿ ಪರಿಹರಿಸಿಲ್ಲ.
