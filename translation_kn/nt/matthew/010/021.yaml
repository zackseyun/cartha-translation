review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the familial relationships and the hostile rising up of children against parents. However, εἰς θάνατον modifies both coordinated acts of handing over; the second clause must therefore also state ‘to death.’ Further, θανατώσουσιν is active ‘will put them to death/kill them’; ‘ಕೊಲ್ಲಿಸುವರು’ normally means ‘will cause someone else to kill’ and introduces an unwarranted causative nuance.
  naturalness: ‘ಒಪ್ಪಿಸಿಕೊಡುವನು’ is a natural modern Kannada expression for handing a person over. The revised parallel clauses are clear, grave, and idiomatic.
  terminology: ‘ಸಹೋದರ,’ ‘ಮಗು,’ ‘ಮಕ್ಕಳು,’ and ‘ತಂದೆತಾಯಿಗಳು’ appropriately reflect the respective scope of ἀδελφός, τέκνον, τέκνα, and γονεῖς. ‘ಕೊಲ್ಲುವರು’ is the natural active equivalent here without specifying a judicial mechanism.
  issues:
  - severity: high
    issue: The second coordinated clause omits ‘to death.’
    rationale: In Greek, εἰς θάνατον follows ‘brother will hand over brother’ and is understood with the coordinated ‘and father [will hand over] child.’ Omitting it weakens the stated result of the father’s action.
  - severity: medium
    issue: ‘ಕೊಲ್ಲಿಸುವರು’ is causative rather than active.
    rationale: The active future θανατώσουσιν says that the children will put their parents to death. Kannada ‘ಕೊಲ್ಲಿಸುವರು’ can imply arranging for another person to kill them, a distinction not expressed by the Greek.
  revised_text: ಸಹೋದರನು ಸಹೋದರನನ್ನು ಮರಣಕ್ಕೆ ಒಪ್ಪಿಸಿಕೊಡುವನು[a]; ತಂದೆಯು ತನ್ನ ಮಗುವನ್ನು ಮರಣಕ್ಕೆ ಒಪ್ಪಿಸಿಕೊಡುವನು. ಮಕ್ಕಳು ತಮ್ಮ ತಂದೆತಾಯಿಗಳ ವಿರುದ್ಧ ಎದ್ದು ಅವರನ್ನು ಕೊಲ್ಲುವರು.
