id: MAT.10.7
reference: Matthew 10:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: kn
  text: ನೀವು ಹೋಗುತ್ತಾ[a], ‘ಪರಲೋಕರಾಜ್ಯವು[b] ಸಮೀಪಿಸಿದೆ[c]’ ಎಂದು ಸಾರಿರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ನೀವು ಹೋಗುವಾಗ.’ ಗ್ರೀಕ್ ಕೃದಂತವು ಹೋಗುವ ಕ್ರಿಯೆಯು ಸಾರುವ ಆಜ್ಞೆಯೊಂದಿಗೆ ಜೊತೆಯಾಗಿ ನಡೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಮತ್ತಾಯನು ನಿಯಮಿತವಾಗಿ ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂದು ಹೇಳುತ್ತಾನೆ; ಇತರ ಸುವಾರ್ತೆಗಳು ಅನೇಕ ಸಮಾನ ಸಂದರ್ಭಗಳಲ್ಲಿ ‘ದೇವರ ರಾಜ್ಯ’ ಎಂದು ಹೇಳುತ್ತವೆ.
    reason: cross_reference
  - marker: c
    text: ಅಥವಾ ‘ಸಮೀಪಕ್ಕೆ ಬಂದಿದೆ’ ಅಥವಾ ‘ಹತ್ತಿರವಾಗಿದೆ.’ ಗ್ರೀಕ್ ಪೂರ್ಣಕಾಲವು ಸಮೀಪಕ್ಕೆ ಬಂದಿರುವ ಸ್ಥಿತಿ ಈಗಲೂ ಪರಿಣಾಮಕಾರಿಯಾಗಿದೆ ಎಂಬ ಅಂಶವನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενοι
  choice: ನೀವು ಹೋಗುತ್ತಾ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಮುಖ್ಯ ಆಜ್ಞೆಯೊಡನೆ ನಡೆಯುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೋಗುತ್ತಾ’ ಎಂಬುದು ಆ ಜೊತೆಯ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಇದು ಹಿಂದಿನ ಸೂಚನೆಗಳೊಂದಿಗೆ ಸೌಮ್ಯವಾಗಿ ಸಂಪರ್ಕಿಸುವ ಅವ್ಯಯ. ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯದ ಮುಂದುವರಿಕೆಯೇ ಆ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಎಂಬ ವಿರೋಧಾರ್ಥಕ ಪದವನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: κηρύσσετε
  choice: ಸಾರಿರಿ
  rationale: ಸಾರ್ವಜನಿಕವಾಗಿ ಮತ್ತು ಅಧಿಕಾರಪೂರ್ವಕವಾಗಿ ಪ್ರಕಟಿಸುವ ಆಜ್ಞಾರ್ಥವನ್ನು ‘ಸಾರಿರಿ’ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಬೋಧಿಸಿರಿ’ ಎಂದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ಬೋಧನೆಯ ಛಾಯೆ ಬರಬಹುದು.
- source_word: λέγοντες
  choice: ಎಂದು
  rationale: ಈ ಕೃದಂತವು ಸಾರಬೇಕಾದ ಮಾತಿನ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಕನ್ನಡದ ನೇರ ಉಲ್ಲೇಖದ ನಂತರದ ‘ಎಂದು’ ಮೂಲದ ಕಾರ್ಯವನ್ನು ಸಹಜವಾಗಿ ನಿರ್ವಹಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ನೇರ ಉಲ್ಲೇಖ
  rationale: λέγοντες ನಂತರ ಸಂದೇಶದ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಉದ್ಧರಣ ಚಿಹ್ನೆಗಳು ಮತ್ತು ‘ಎಂದು’ ಬಳಕೆ ಅದರ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೊರುತ್ತವೆ.
- source_word: ἤγγικεν
  choice: ಸಮೀಪಿಸಿದೆ
  rationale: ಪೂರ್ಣಕಾಲದ ಕ್ರಿಯಾಪದವು ಸಮೀಪಕ್ಕೆ ಬಂದಿರುವ ಮತ್ತು ಅದರ ಫಲ ಮುಂದುವರಿಯುವ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸಮೀಪಿಸಿದೆ’ ಈ ಅಂಶವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία
  choice: ರಾಜ್ಯವು
  rationale: ದೇವರ ಆಳ್ವಿಕೆಯ ಕ್ರಿಯಾತ್ಮಕ ಅರ್ಥವನ್ನೂ ರಾಜ್ಯದ ವ್ಯಾಪ್ತಿಯ ಅರ್ಥವನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲ ಸ್ಥಾಪಿತ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: τῶν οὐρανῶν
  choice: ಪರಲೋಕ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟವಾದ ‘ಸ್ವರ್ಗಗಳ’ ಎಂಬ ಗೌರವಾರ್ಥಕ ಅಭಿವ್ಯಕ್ತಿಗೆ ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ. ‘ದೇವರ’ ಎಂದು ಸಮಾನಾಂತರ ಸುವಾರ್ತೆಗಳಿಗೆ ಹೊಂದಿಸಿ ಬದಲಾಯಿಸಿಲ್ಲ.
theological_decisions:
- issue: ἡ βασιλεία τῶν οὐρανῶν ಎಂಬ ಪದಗುಚ್ಛದ ಅರ್ಥ
  choice: ಪರಲೋಕರಾಜ್ಯವು
  alternative: ದೇವರ ರಾಜ್ಯವು; ಪರಲೋಕದ ಆಳ್ವಿಕೆ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ರಾಜ್ಯ’ ಎಂಬುದು ಆಳ್ವಿಕೆ ಮತ್ತು ರಾಜ್ಯಕ್ಷೇತ್ರ ಎರಡನ್ನೂ ಒಳಗೊಳ್ಳುವ ಅಗಲವನ್ನು ಕಾಪಾಡುತ್ತದೆ; ‘ದೇವರ ರಾಜ್ಯ’ ಎಂದು ಬದಲಿಸುವುದು ಮೂಲಪಾಠದ ವಿಭಿನ್ನತೆಯನ್ನು ಅಳಿಸಿಬಿಡುತ್ತದೆ.
- issue: ἤγγικεν ಕ್ರಿಯಾಪದದ ಕಾಲರೂಪ ಮತ್ತು ಅಂಶ
  choice: ಸಮೀಪಿಸಿದೆ
  alternative: ಹತ್ತಿರವಾಗಿದೆ; ಸಮೀಪಕ್ಕೆ ಬಂದಿದೆ
  rationale: ಗ್ರೀಕ್ ಪೂರ್ಣಕಾಲವು ಸಮೀಪಕ್ಕೆ ಬಂದಿರುವುದನ್ನೂ ಅದರ ಪರಿಣಾಮ ಮುಂದುವರಿಯುವುದನ್ನೂ ಸೂಚಿಸುತ್ತದೆ. ಈ ಅನುವಾದವು ರಾಜ್ಯದ ಆಗಮನದ ಕುರಿತು ಮೂಲವು ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಕಾಲತಾತ್ತ್ವಿಕ ನಿರ್ಣಯವನ್ನು ಹೇರುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಘೋಷಣೆಗೆ ತಕ್ಕ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಎಂದು ಸಾರಿರಿ’ ಎಂಬ ರಚನೆ κηρύσσετε λέγοντες ಎಂಬ ಮೂಲದ ಎರಡೂ ಅಂಶಗಳನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅನಗತ್ಯ ಪುನರುಕ್ತಿಯಿಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
