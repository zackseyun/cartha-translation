id: MAT.10.6
reference: Matthew 10:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: kn
  text: ಬದಲಾಗಿ ಇಸ್ರಾಯೇಲ್ ಮನೆತನದ ಕಳೆದುಹೋದ ಕುರಿಗಳ ಬಳಿಗೆ ಹೋಗಿರಿ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಇಸ್ರಾಯೇಲ್ ಮನೆತನದಿಂದ ಕಳೆದುಹೋಗಿರುವ ಕುರಿಗಳ ಬಳಿಗೆ ಹೋಗಿರಿ.’
    reason: ‘ಇಸ್ರಾಯೇಲ್ ಮನೆತನದ’ ಎಂಬ ಸಂಬಂಧವನ್ನು ಸೇರಿದಿಕೆಯಾಗಿ ಅಥವಾ ಆ ಮನೆತನದಿಂದ ಕಳೆದುಹೋಗಿರುವುದಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಮೂಲಭಾಷೆಯ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲು.
lexical_decisions:
- source_word: πορεύεσθε
  choice: ಹೋಗಿರಿ
  rationale: ಇದು ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕ ರೂಪ. ಶಿಷ್ಯರಿಗೆ ನೀಡಿದ ನಿರ್ದೇಶನವನ್ನು ಸಹಜವಾಗಿಯೂ ಗೌರವಯುತವಾಗಿಯೂ ತಿಳಿಸುತ್ತದೆ.
- source_word: δὲ μᾶλλον
  choice: ಆದರೆ, ಬದಲಾಗಿ
  rationale: ಹಿಂದಿನ ವಚನದಲ್ಲಿ ನಿಷೇಧಿಸಿದ ಸ್ಥಳಗಳಿಗೆ ವಿರುದ್ಧವಾಗಿ, ಈಗ ಹೋಗಬೇಕಾದ ದಿಕ್ಕನ್ನು ಸೂಚಿಸುವ ವಿರೋಧ ಮತ್ತು ಮರುನಿರ್ದೇಶನ ಎರಡನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: πρὸς
  choice: ಬಳಿಗೆ
  rationale: ಚಲನೆಯ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ವ್ಯಕ್ತಿಗಳು ಅಥವಾ ರೂಪಕಾತ್ಮಕ ಸಮುದಾಯದ ಕಡೆಗೆ ಹೋಗುವುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τὰ πρόβατα
  choice: ಕುರಿಗಳು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಪಶುಪಾಲನಾ ರೂಪಕವನ್ನು ‘ಜನರು’ ಎಂದು ವ್ಯಾಖ್ಯಾನಿಸಿ ಕರಗಿಸದೆ ಹಾಗೆಯೇ ಉಳಿಸುತ್ತದೆ.
- source_word: τὰ ἀπολωλότα
  choice: ಕಳೆದುಹೋದ
  rationale: ಪಶುಪಾಲನಾ ರೂಪಕದಲ್ಲಿ ದಾರಿ ತಪ್ಪಿ ಕಾಣೆಯಾಗಿರುವ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನಾಶವಾದ’ ಎಂಬ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರದು.
- source_word: οἴκου Ἰσραήλ
  choice: ಇಸ್ರಾಯೇಲ್ ಮನೆತನದ
  rationale: ಒಡಂಬಡಿಕೆಯ ಸಮುದಾಯವನ್ನು ಸೂಚಿಸುವ ಬೈಬಲಿನ ‘ಇಸ್ರಾಯೇಲ್ ಮನೆತನ’ ಎಂಬ ಸಾಂಸ್ಥಿಕ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಇಸ್ರಾಯೇಲನ್ನು ಕುರಿಗಳ ರೂಪಕದಲ್ಲಿ ವರ್ಣಿಸುವುದು
  choice: ‘ಇಸ್ರಾಯೇಲ್ ಮನೆತನದ ಕಳೆದುಹೋದ ಕುರಿಗಳು’ ಎಂಬ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ದಾರಿ ತಪ್ಪಿದ ಇಸ್ರಾಯೇಲ್ಯರು’ ಎಂದು ಅರ್ಥವಿವರಣಾತ್ಮಕವಾಗಿ ಹೇಳುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿರುವ ಕುರಿಗಳ ರೂಪಕವು ಹೀಬ್ರೂ ಶಾಸ್ತ್ರಗಳ ಪಶುಪಾಲನಾ ಚಿತ್ರಣದೊಂದಿಗೆ ಸಂಬಂಧ ಹೊಂದಿದೆ. ಅದನ್ನು ಜನರೆಂದು ನೇರವಾಗಿ ಬದಲಿಸುವುದು ಮೂಲದ ಸಾಹಿತ್ಯಿಕ ಮತ್ತು ಧಾರ್ಮಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಕುಗ್ಗಿಸುತ್ತದೆ.
- issue: οἴκου Ἰσραήλ ಎಂಬ ಷಷ್ಠೀ ಸಂಬಂಧದ ವ್ಯಾಪ್ತಿ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕುರಿಗಳು ಇಸ್ರಾಯೇಲ್ ಮನೆತನಕ್ಕೆ ಸೇರಿದವು ಎಂಬ ಸಹಜ ಓದನ್ನು ನೀಡಲಾಗಿದೆ.
  alternative: ‘ಇಸ್ರಾಯೇಲ್ ಮನೆತನದಿಂದ ಕಳೆದುಹೋದ ಕುರಿಗಳು’—ಅವು ಆ ಮನೆತನದಿಂದ ಕಳೆದುಹೋಗಿವೆ ಎಂಬ ಓದು.
  rationale: ಗ್ರೀಕ್ ಪದಬಂಧವು ಸೇರಿದಿಕೆ ಮತ್ತು ಯಾವುದರಿಂದ ಕಳೆದುಹೋಗಿರುವಿಕೆ ಎಂಬ ಎರಡೂ ಸಂಬಂಧಗಳಿಗೆ ಅವಕಾಶ ಕೊಡಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯವು ಹೆಚ್ಚು ಸಹಜವಾದ ಸೇರಿದಿಕೆಯ ಓದನ್ನು ಕೊಡುತ್ತದೆ; ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ಆಜ್ಞಾರ್ಥಕ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಮನೆತನ’ ಮತ್ತು ‘ಕುರಿಗಳು’ ಎಂಬ ಬೈಬಲಿನ ಸಾಂಸ್ಥಿಕ ಹಾಗೂ ರೂಪಕಾತ್ಮಕ ಭಾಷೆಯನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ಸರಳೀಕರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
