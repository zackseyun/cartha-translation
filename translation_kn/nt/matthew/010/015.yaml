id: MAT.10.15
reference: Matthew 10:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: kn
  text: 'ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಆ ಪಟ್ಟಣಕ್ಕಿಂತ ಸೊದೋಮ್ ಮತ್ತು ಗೊಮೋರದ ಪ್ರದೇಶಕ್ಕೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುತ್ತದೆ.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಹೆಚ್ಚು ತಾಳಿಕೊಳ್ಳಬಹುದಾಗಿರುತ್ತದೆ.’
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಆ ನಗರಕ್ಕಿಂತ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: ನಿಜವಾಗಿ
  rationale: ಯೇಸುವಿನ ಗಂಭೀರ ದೃಢೋಕ್ತಿ ಸೂತ್ರದ ಬಲವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಆಮೆನ್’ ಎಂಬ ಲಿಪ್ಯಂತರಣಕ್ಕಿಂತ ಅರ್ಥ ಹೆಚ್ಚು ಪಾರದರ್ಶಕವಾಗಿದೆ.
- source_word: λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ
  rationale: ಗ್ರೀಕ್‌ನ ನೇರ ಮಾತಿನ ಸೂತ್ರವನ್ನು ಸಮೀಪವಾಗಿ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀνεκτότερον
  choice: ಹೆಚ್ಚು ಸಹನೀಯ
  rationale: ‘ತಾಳಿಕೊಳ್ಳಲು ಹೆಚ್ಚು ಸಾಧ್ಯವಾದ’ ಎಂಬ ಹೋಲಿಕೆಯ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ, ಗೌರವಯುತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γῇ
  choice: ನಾಡಿಗೆ
  rationale: ಇಲ್ಲಿ ಭೂಮಂಡಲವನ್ನಲ್ಲ, ಸೊದೋಮ್ ಮತ್ತು ಗೊಮೋರಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ನಾಡು’ ಭೌಗೋಳಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: ಸೊದೋಮ್ ಮತ್ತು ಗೊಮೋರಗಳ
  rationale: ಸ್ಥಳನಾಮಗಳನ್ನು ಕನ್ನಡದ ಪರಿಚಿತ ರೂಪಗಳಲ್ಲಿ ನೀಡಿ, ಅವು γῇಗೆ ಸಂಬಂಧಿಸಿದ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯಲ್ಲಿರುವುದನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ
  rationale: ಭವಿಷ್ಯದ ದೈವಿಕ ತೀರ್ಪಿನ ದಿನವನ್ನು ಸೂಚಿಸುವ ಮೂಲದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: πόλει
  choice: ಪಟ್ಟಣಕ್ಕೆ
  rationale: πόλις ‘ನಗರ’ ಅಥವಾ ‘ಪಟ್ಟಣ’ ಎಂದಾಗಬಹುದು; ಶಿಷ್ಯರ ಸೇವೆಯ ತಕ್ಷಣದ ಸಂದರ್ಭಕ್ಕೆ ‘ಪಟ್ಟಣ’ ಸಹಜವಾಗಿ ಹೊಂದುತ್ತದೆ.
- source_word: ἐκείνῃ
  choice: ಆ
  rationale: ಸಂದೇಶವಾಹಕರನ್ನು ತಿರಸ್ಕರಿಸಿದ ನಿರ್ದಿಷ್ಟ ಪಟ್ಟಣವನ್ನು ಹಿಂದಕ್ಕೆ ಸೂಚಿಸುವ ಸರಳ ಪ್ರದರ್ಶನಪದವಾಗಿದೆ.
theological_decisions:
- issue: ‘ನ್ಯಾಯತೀರ್ಪಿನ ದಿನ’ದ ಸ್ವರೂಪ
  choice: ಭವಿಷ್ಯದ ದೈವಿಕ ನ್ಯಾಯತೀರ್ಪಿನ ದಿನವೆಂದು ಭಾಷಾಂತರಿಸಲಾಗಿದೆ; ಪಠ್ಯವು ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ವಿವರಣೆ ನೀಡಿಲ್ಲ.
  alternative: ಸಾಮಾನ್ಯವಾದ ನ್ಯಾಯತೀರ್ಪಿನ ಕಾಲ
  rationale: ἐν ἡμέρᾳ κρίσεως ಎಂಬುದು ಸಹಜವಾಗಿ ಅಂತಿಮಕಾಲದ ತೀರ್ಪಿನತ್ತ ಸೂಚಿಸುತ್ತದೆ; ಆದರೂ ಭಾಷಾಂತರವು ನಿರ್ದಿಷ್ಟ ಪಂಥೀಯ ಅಂತ್ಯಕಾಲದ ರೂಪರೇಖೆಯನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ತೆರೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗಂಭೀರವೂ ಆದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಹೋಲಿಕೆಯ ರಚನೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು ಕನ್ನಡದ ದತ್ತಿವಿಭಕ್ತಿ ವಿನ್ಯಾಸಕ್ಕೆ ಹೊಂದಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ [a], [b] ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಪರ್ಯಾಯಗಳನ್ನು ಸೂಚಿಸುತ್ತವೆ.
