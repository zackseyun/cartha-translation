revisions:
- from: 'ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಆ ಪಟ್ಟಣಕ್ಕಿಂತ ಸೊದೋಮ್ ಮತ್ತು ಗೊಮೋರಗಳ ನಾಡಿಗೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುವುದು.[a][b]'
  to: 'ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ಆ ಪಟ್ಟಣಕ್ಕಿಂತ ಸೊದೋಮ್ ಮತ್ತು ಗೊಮೋರದ ಪ್ರದೇಶಕ್ಕೆ ಹೆಚ್ಚು ಸಹನೀಯವಾಗಿರುತ್ತದೆ.[a][b]'
  rationale: The revision supplies the required finite future verb, thereby preserving the force of ἔσται, and uses a more idiomatic singular territorial expression for γῇ Σοδόμων καὶ Γομόρρων. The comparative construction, ambiguity of πόλις (‘town/city’), and restrained eschatological language are retained.
