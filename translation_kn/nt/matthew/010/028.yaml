  source_fidelity: 'ಮುಖ್ಯಾರ್ಥವು ಗ್ರೀಕ್ ಪಾಠಕ್ಕೆ ನಿಷ್ಠವಾಗಿದೆ: ದೇಹವನ್ನು ಕೊಲ್ಲುವವರ ಮತ್ತು ಆತ್ಮವನ್ನೂ ದೇಹವನ್ನೂ ಗೆಹೆನ್ನಾದಲ್ಲಿ ನಾಶಮಾಡಬಲ್ಲ ‘ಒಬ್ಬನ’ ನಡುವಿನ ವಿರುದ್ಧತೆಯನ್ನೂ, ಆ ವ್ಯಕ್ತಿಯ ಅನಿರ್ದಿಷ್ಟ ಗುರುತನ್ನೂ ಸರಿಯಾಗಿ ಉಳಿಸಿದೆ. ಆದರೆ ‘-ಗೇ’ ಎಂಬ ಒತ್ತಿನ ಪ್ರತ್ಯಯವು ಗ್ರೀಕ್‌ನಲ್ಲಿಲ್ಲದ ವಿಶೇಷ ಒತ್ತನ್ನು ಸೇರಿಸುತ್ತದೆ.'
