id: MAT.10.28
reference: Matthew 10:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: kn
  text: ದೇಹವನ್ನು ಕೊಲ್ಲುವವರಿಗೆ ಭಯಪಡಬೇಡಿ; ಅವರು ಆತ್ಮವನ್ನು ಕೊಲ್ಲಲು ಶಕ್ತರಲ್ಲ. ಬದಲಾಗಿ, ಆತ್ಮವನ್ನೂ ದೇಹವನ್ನೂ ಗೆಹೆನ್ನಾದಲ್ಲಿ[a] ನಾಶಮಾಡಲು ಶಕ್ತನಾಗಿರುವಾತನಿಗೆ ಭಯಪಡಿರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ: “ನರಕದಲ್ಲಿ.” ಗ್ರೀಕ್ ‘ಗೆಹೆನ್ನಾ’ ಪದವು ಹಿನ್ನೋಮ್ ಕಣಿವೆಯ ಹೆಸರಿನಿಂದ ವ್ಯುತ್ಪನ್ನವಾಗಿದ್ದು, ಅಂತಿಮ ನ್ಯಾಯದ ಸ್ಥಳವನ್ನು ಸೂಚಿಸಲು ಬಳಸಲಾಗಿದೆ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: ಭಯಪಡಬೇಡಿ / ಭಯಪಡಿರಿ
  rationale: ಎರಡೂ ವಾಕ್ಯಭಾಗಗಳಲ್ಲಿರುವ ಒಂದೇ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ವಿರುದ್ಧತೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ಒಂದೇ ಮೂಲಪದದಿಂದ ಉಳಿಸುತ್ತದೆ; ಎರಡನೆಯ ಬಳಕೆಯ ಎಚ್ಚರಿಕೆಯ ತೀವ್ರತೆಯನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: ದೇಹವನ್ನು ಕೊಲ್ಲುವವರಿಗೇ
  rationale: ಲೇಖಸಹಿತ ವರ್ತಮಾನ ಕೃದಂತವು ಸಾಮಾನ್ಯ ವರ್ಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕೊಲ್ಲುವವರು’ ಎಂಬುದು ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ; ‘-ಗೇ’ ರೂಪವು ಭಯದ ಗುರಿಯನ್ನು ಹಾಗೂ ಮುಂದಿನ ವಿರುದ್ಧತೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: σῶμα
  choice: ದೇಹ
  rationale: ಭೌತಿಕ ದೇಹಕ್ಕೆ ನೇರವಾದ, ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ψυχήν
  choice: ಆತ್ಮ
  rationale: ಈ ದೇಹ–ψυχή ವಿರುದ್ಧತೆಯಲ್ಲಿ ‘ಜೀವ’ ಎಂದರೆ ಭೌತಿಕ ಜೀವಿತವೆಂದು ಗ್ರಹಿಸುವ ಸಾಧ್ಯತೆ ಇದೆ; ‘ಆತ್ಮ’ ಮೂಲಪಾಠದಲ್ಲಿರುವ ವ್ಯಕ್ತಿಯ ಅಭೌತಿಕ ಅಂಶದ ಭೇದವನ್ನು ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: ಕೊಲ್ಲಲು ಶಕ್ತರಲ್ಲ
  rationale: ಅವರ ಅಸಾಮರ್ಥ್ಯದ ಮೇಲಿರುವ ಒತ್ತನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: μᾶλλον
  choice: ಬದಲಾಗಿ
  rationale: ‘ಇವರಿಗೆ ಅಲ್ಲ, ಆತನಿಗೆ’ ಎಂಬ ತಿದ್ದುಪಡಿ ಮತ್ತು ವಿರುದ್ಧತೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τὸν δυνάμενον
  choice: ಶಕ್ತನಾಗಿರುವಾತನಿಗೇ
  rationale: ಗ್ರೀಕ್ ಪಾಠವು ವ್ಯಕ್ತಿಯ ಹೆಸರನ್ನು ಹೇಳದೆ ಕೃದಂತರೂಪದಲ್ಲೇ ಬಿಡುತ್ತದೆ. ಈ ಕನ್ನಡ ರೂಪವೂ ದೇವರು ಅಥವಾ ಮತ್ತೊಬ್ಬನೆಂದು ಮುಖ್ಯಪಾಠದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಗುರುತಿಸದೆ ಅದೇ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπολέσαι
  choice: ನಾಶಮಾಡಲು
  rationale: ಅಂತಿಮ ನ್ಯಾಯದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುವ ನೇರ ಸಮಾನಾರ್ಥಕ; ನಾಶದ ತಾತ್ತ್ವಿಕ ಸ್ವರೂಪವನ್ನು ಅಗತ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: ἐν γεέννῃ
  choice: ಗೆಹೆನ್ನಾದಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ಪದದ ಯೆಹೂದಿ ಐತಿಹಾಸಿಕ ಹಿನ್ನೆಲೆಯನ್ನು ಉಳಿಸಲು ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ; ಪರಿಚಿತವಾದ ಅರ್ಥಸೂಚನೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: ಗೆಹೆನ್ನಾದಲ್ಲಿ ಆತ್ಮವನ್ನೂ ದೇಹವನ್ನೂ ನಾಶಮಾಡಲು ಶಕ್ತನಾಗಿರುವಾತನ ಗುರುತು
  choice: ಮುಖ್ಯಪಾಠದಲ್ಲಿ ‘ಶಕ್ತನಾಗಿರುವಾತನು’ ಎಂದು ಗುರುತನ್ನು ಹೆಸರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ದೇವರು; ಸೈತಾನನು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಇದು ಅಂತಿಮ ನ್ಯಾಯಾಧಿಕಾರವುಳ್ಳ ದೇವರನ್ನು ಅತ್ಯಂತ ಸಹಜವಾಗಿ ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್ ವಾಕ್ಯವು ಆ ಹೆಸರನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನುವಾದವು ಪಾಠದ ಸೂಚನೆಯನ್ನು ಉಳಿಸಿ, ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯಪಾಠಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: γέεννα ಪದದ ಅನುವಾದ
  choice: ಗೆಹೆನ್ನಾ
  alternative: ನರಕ
  rationale: ಲಿಪ್ಯಂತರವು ಮೂಲಪದದ ವಿಶೇಷ ಯೆಹೂದಿ ಮತ್ತು ಹಿನ್ನೋಮ್ ಕಣಿವೆಯ ಹಿನ್ನೆಲೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ‘ನರಕ’ ಎಂಬ ಪರಿಚಿತ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಸಮಾನಾರ್ಥಕವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೊದಲ ಮತ್ತು ಎರಡನೆಯ ಆಜ್ಞೆಗಳ ವಿರುದ್ಧತೆಯನ್ನು ‘ಭಯಪಡಬೇಡಿ … ಭಯಪಡಿರಿ’ ಹಾಗೂ ಒತ್ತಿನ ‘-ಗೇ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ. ‘ಗೆಹೆನ್ನಾ’ ಪದಕ್ಕೆ ಮುಖ್ಯಪಾಠದಲ್ಲೇ [a] ಗುರುತು ಸೇರಿಸಲಾಗಿದೆ.
