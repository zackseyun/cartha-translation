review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the twelve, preserves the two prohibitions, and renders the Gentile/Samaritan references contextually. However, “ಕಳುಹಿಸುವಾಗ” means ‘while sending,’ whereas ἀπέστειλεν is the main completed action and παραγγείλας supplies the attendant instruction. This relation should be corrected.
  naturalness: The Kannada is generally clear and modern. Recasting the opening as ‘ಕಳುಹಿಸಿ, ... ಆಜ್ಞಾಪಿಸಿದನು’ is both more natural and syntactically faithful. ‘ಯಾವುದೇ ಊರನ್ನೂ’ is idiomatic under a prohibition.
  terminology: ‘ಯೆಹೂದ್ಯರಲ್ಲದವರು’ accurately communicates ἔθνη in this context without relying on church-specific terminology. ‘ಸಮಾರ್ಯದವರು’ appropriately denotes Samaritans. ‘ಆಜ್ಞಾಪಿಸಿದನು’ suitably conveys the directive force of παραγγείλας.
  issues:
