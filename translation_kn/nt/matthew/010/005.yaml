id: MAT.10.5
reference: Matthew 10:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: kn
  text: 'ಯೇಸು ಈ ಹನ್ನೆರಡು ಮಂದಿಯನ್ನು ಕಳುಹಿಸಿ, ಅವರಿಗೆ ಹೀಗೆ ಆಜ್ಞಾಪಿಸಿದನು: “ಯೆಹೂದ್ಯರಲ್ಲದವರ ಕಡೆಗಿನ ದಾರಿಯಲ್ಲಿ ಹೋಗಬೇಡಿ[a]; ಸಮಾರ್ಯದವರ ಯಾವುದೇ ಊರನ್ನೂ ಪ್ರವೇಶಿಸಬೇಡಿ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಯೆಹೂದ್ಯರಲ್ಲದವರ ಮಾರ್ಗಕ್ಕೆ ಹೋಗಬೇಡಿ.” ಗ್ರೀಕ್ ಪದಗಳು ಅಕ್ಷರಶಃ ದಾರಿ ಅಥವಾ ಮಾರ್ಗವನ್ನು ಸೂಚಿಸುತ್ತವೆ; ಬಹುಶಃ ಯೆಹೂದ್ಯರಲ್ಲದವರ ಪ್ರದೇಶದ ಕಡೆಗೆ ಹೊರಡುವುದನ್ನು ಉದ್ದೇಶಿಸುತ್ತವೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಸಮಾರ್ಯದವರ ಊರೊಂದನ್ನೂ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: ಈ ಹನ್ನೆರಡು ಮಂದಿಯನ್ನು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸೂಚಕಪದ ಮತ್ತು ಸಂಖ್ಯೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ಸಂದರ್ಭದಿಂದ ‘ಶಿಷ್ಯರು’ ಎಂಬುದು ತಿಳಿದರೂ ಆ ಪದವನ್ನು ಮೂಲಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: ἀπέστειλεν
  choice: ಕಳುಹಿಸುವಾಗ
  rationale: ಯೇಸು ಅವರನ್ನು ನಿರ್ದಿಷ್ಟ ಕಾರ್ಯಕ್ಕಾಗಿ ಕಳುಹಿಸಿದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಮುಂದಿನ ಕೃದಂತರೂಪವನ್ನು ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸರಾಗವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: ಅವರಿಗೆ ಹೀಗೆ ಆಜ್ಞಾಪಿಸಿದನು
  rationale: παραγγέλλω ಪದದ ನಿರ್ದೇಶನಾತ್ಮಕ ಬಲವನ್ನು ‘ಆಜ್ಞಾಪಿಸಿದನು’ ಉಳಿಸುತ್ತದೆ. λέγων ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ನೇರವಚನ ಪರಿಚಯವಾದ ‘ಹೀಗೆ’ಯಲ್ಲಿ ಒಳಗೊಳ್ಳಲಾಗಿದೆ.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: ಯೆಹೂದ್ಯರಲ್ಲದವರ ಕಡೆಗೆ ಹೋಗುವ ದಾರಿಯಲ್ಲಿ
  rationale: ἔθνη ಇಲ್ಲಿ ಯೆಹೂದ್ಯರಲ್ಲದ ಜನರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ὁδός ಪದದ ದಾರಿ/ಮಾರ್ಗದ ಚಿತ್ರಣವನ್ನೂ, ಅವರ ಪ್ರದೇಶದ ಕಡೆಗೆ ಹೊರಡುವ ಸಂದರ್ಭಾರ್ಥವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ; ಗ್ರೀಕ್ ರಚನೆಯ ಸಾಧ್ಯ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: μὴ ἀπέλθητε
  choice: ಹೋಗಬೇಡಿ
  rationale: μή ಜೊತೆಯ ಅಓರಿಸ್ಟ್ ಸಬ್ಜಂಕ್ಟಿವ್‌ನ ನಿಷೇಧಾತ್ಮಕ ಆಜ್ಞೆಯನ್ನು ನೇರ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: ಸಮಾರ್ಯದವರ ಯಾವುದೇ ಊರನ್ನೂ
  rationale: πόλις ಅನ್ನು ಗಾತ್ರವನ್ನು ಅತಿಯಾಗಿ ಸೂಚಿಸದ ‘ಊರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. Σαμαριτῶν ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಗುರುತಿಸಬಹುದಾದ ಸಮುದಾಯನಾಮವಾದ ‘ಸಮಾರ್ಯದವರು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ನಿಷೇಧವಾಕ್ಯದಲ್ಲಿ ಅನಿರ್ದಿಷ್ಟ ಏಕವಚನದ ವ್ಯಾಪ್ತಿಯನ್ನು ‘ಯಾವುದೇ ... -ನ್ನೂ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μὴ εἰσέλθητε
  choice: ಪ್ರವೇಶಿಸಬೇಡಿ
  rationale: ಪಟ್ಟಣದ ಒಳಗೆ ಹೋಗಬಾರದೆಂಬ ನಿಷೇಧವನ್ನು ನಿಖರವಾಗಿ ಮತ್ತು ಗೌರವಯುತ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೆಹೂದ್ಯರಲ್ಲದವರು ಮತ್ತು ಸಮಾರ್ಯದವರ ಕುರಿತು ನಿಷೇಧದ ವ್ಯಾಪ್ತಿ ಹಾಗೂ ಕಾಲಬದ್ಧತೆ
  choice: ಈ ಕಳುಹಿಸುವಿಕೆಯ ಸಂದರ್ಭದಲ್ಲಿ ನೀಡಿದ ಬಲವಾದ ನೇರ ಆಜ್ಞೆಯಾಗಿ ಮಾತ್ರ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಯೆಹೂದ್ಯರಲ್ಲದವರು ಮತ್ತು ಸಮಾರ್ಯದವರಿಗೆ ಶಾಶ್ವತವಾದ ನಿರಾಕರಣೆ ಎಂಬಂತೆ ವಿಸ್ತರಿಸುವ ಅನುವಾದ.
  rationale: ವಚನವು ಈ ಹನ್ನೆರಡು ಮಂದಿಗೆ ನೀಡಿದ ನಿರ್ದಿಷ್ಟ ಮಿಷನ್ ನಿರ್ದೇಶನವನ್ನು ದಾಖಲಿಸುತ್ತದೆ. ಅದರ ಬಲವನ್ನು ಉಳಿಸಬೇಕು; ಆದರೆ ಪಠ್ಯದಲ್ಲಿಲ್ಲದ ಶಾಶ್ವತ ಧಾರ್ಮಿಕ ನಿರ್ಣಯವನ್ನು ಸೇರಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತ ಶೈಲಿ. ‘ಅನ್ಯಜನರು’ ಎಂಬ ಚರ್ಚ್-ನಿರ್ದಿಷ್ಟವಾಗಿ ಕೇಳಬಹುದಾದ ಪದದ ಬದಲು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ ‘ಯೆಹೂದ್ಯರಲ್ಲದವರು’ ಬಳಸಲಾಗಿದೆ. ‘ಸಮಾರ್ಯದವರು’ ಎಂಬ ರೂಪವು ಜನಸಮುದಾಯದ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳಾದ [a], [b] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
