id: MAT.10.27
reference: Matthew 10:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: kn
  text: ನಾನು ಕತ್ತಲೆಯಲ್ಲಿ ನಿಮಗೆ ಹೇಳುವುದನ್ನು ಬೆಳಕಿನಲ್ಲಿ ಹೇಳಿರಿ; ಮತ್ತು ಕಿವಿಯಲ್ಲಿ ನೀವು ಕೇಳುವುದನ್ನು[a] ಮನೆಗಳ ಮೇಲ್ಛಾವಣಿಗಳ ಮೇಲೆ ಘೋಷಿಸಿರಿ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಕಿವಿಯಲ್ಲಿ’ ಎಂಬ ನುಡಿಗಟ್ಟು ಖಾಸಗಿಯಾಗಿ ತಿಳಿಸಲ್ಪಟ್ಟದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: idiom_explanation
  - marker: b
    text: ಪ್ರಾಚೀನ ಮನೆಗಳ ಮೇಲ್ಛಾವಣಿಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಸಮತಟ್ಟಾಗಿದ್ದು, ಎಲ್ಲರಿಗೂ ಕಾಣುವ ಎತ್ತರದ ಸ್ಥಳದಿಂದ ಸಾರ್ವಜನಿಕವಾಗಿ ಪ್ರಕಟಿಸಲು ಅನುಕೂಲವಾಗಿದ್ದವು.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ಹೇಳುವುದನ್ನು
  rationale: ಸಂಬಂಧವಾಚಕ ರಚನೆಯ ವಸ್ತುಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; λέγω ಜೊತೆಗೆ ಇರುವ ಪರೋಕ್ಷ ಕರ್ಮವಾದ ὑμῖν ಅನ್ನು ‘ನಿಮಗೆ’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί
  choice: ಕತ್ತಲೆಯಲ್ಲಿ / ಬೆಳಕಿನಲ್ಲಿ
  rationale: ಗುಪ್ತತೆ ಮತ್ತು ಬಹಿರಂಗತೆಯ ಅರ್ಥವನ್ನು ಒಳಗೊಂಡಿರುವ ಮೂಲದ ಪರಸ್ಪರ ವಿರೋಧಿ ದೃಶ್ಯರೂಪವನ್ನು ವ್ಯಾಖ್ಯಾನಿಸಿ ಸಮತಟ್ಟಾಗಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: ಕಿವಿಯಲ್ಲಿ ಕೇಳುವುದನ್ನು
  rationale: εἰς τὸ οὖς ಎಂಬ ಏಕವಚನದ ಜೀವಂತ ನುಡಿಗಟ್ಟನ್ನು ಸಮೀಪವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಖಾಸಗಿಯಾಗಿ ತಿಳಿಸಲ್ಪಟ್ಟದ್ದೆಂಬ ಸೂಚ್ಯಾರ್ಥವನ್ನು ಅಡಿಕುರಿತು ವಿವರಿಸುತ್ತದೆ.
- source_word: κηρύξατε
  choice: ಘೋಷಿಸಿರಿ
  rationale: ಸಾರ್ವಜನಿಕವಾಗಿ ಸಾರುವ ಹರಿಕಾರನಂತಹ ಬಲವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಬೋಧಿಸಿರಿ’ ಅಥವಾ ‘ಪ್ರಸಂಗಿಸಿರಿ’ ಎಂಬ ಧಾರ್ಮಿಕವಾಗಿ ಕಿರಿದಾದ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: ἐπὶ τῶν δωμάτων
  choice: ಮನೆಗಳ ಮಾಳಿಗೆಗಳ ಮೇಲೆ ನಿಂತು
  rationale: ಪ್ರಾಚೀನ ಮನೆಗಳ ಸಮತಟ್ಟಾದ ಮೇಲ್ಛಾವಣಿಗಳ ಸಾಂಸ್ಕೃತಿಕ ಚಿತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಘೋಷಣೆಯ ಸ್ಥಳವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸಲು ‘ನಿಂತು’ ಅನ್ನು ಸಂದರ್ಭಾನುಸಾರ ಪೂರೈಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಕತ್ತಲೆ/ಬೆಳಕು ಮತ್ತು ಕಿವಿ/ಮಾಳಿಗೆಗಳ ಭಾಷೆಯನ್ನು ದೃಶ್ಯರೂಪವಾಗಿಯೇ ಉಳಿಸಬೇಕೋ, ಗುಪ್ತ/ಬಹಿರಂಗ ಸಂವಹನವೆಂದು ನೇರವಾಗಿ ಅರ್ಥವಿವರಣೆ ಮಾಡಬೇಕೋ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಕತ್ತಲೆಯಲ್ಲಿ ... ಬೆಳಕಿನಲ್ಲಿ ... ಕಿವಿಯಲ್ಲಿ ... ಮಾಳಿಗೆಗಳ ಮೇಲೆ’ ಎಂಬ ದೃಶ್ಯರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಗುಪ್ತವಾಗಿ ... ಬಹಿರಂಗವಾಗಿ ... ಪಿಸುಗುಟ್ಟಿದ್ದನ್ನು ... ಸಾರ್ವಜನಿಕವಾಗಿ’ ಎಂದು ಅರ್ಥವಿವರಣಾತ್ಮಕವಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಖಾಸಗಿ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಪ್ರಕಟಣೆಯ ನಡುವಿನ ತೀವ್ರ ವಿರೋಧವನ್ನು ಜೀವಂತ ಚಿತ್ರಗಳ ಮೂಲಕ ಹೇಳುತ್ತದೆ. ಆ ಚಿತ್ರಗಳನ್ನು ಉಳಿಸುವುದು ಯೇಸುವಿನ ವಾಗ್ವೈಖರಿಯನ್ನು ಕಾಪಾಡುತ್ತದೆ ಮತ್ತು ಅರ್ಥವನ್ನು ಮೌನವಾಗಿ ಒಂದೇ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥ ‘ಹೇಳಿರಿ/ಘೋಷಿಸಿರಿ’ ಬಳಸಲಾಗಿದೆ. ಭಾಷೆ ಸರಳವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆಗಿದ್ದು, ಮೂಲದ ಸಮಾಂತರ ವಾಕ್ಯರಚನೆ ಮತ್ತು ಕತ್ತಲೆ–ಬೆಳಕು, ಕಿವಿ–ಮಾಳಿಗೆ ಎಂಬ ವಿರೋಧಿ ಚಿತ್ರಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
