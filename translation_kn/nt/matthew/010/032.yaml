source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ ಜನರ ಮುಂದೆ ನನ್ನನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನನ್ನೂ, ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆಯ ಮುಂದೆ ನಾನೂ ಒಪ್ಪಿಕೊಳ್ಳುವೆನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ, ‘ನನ್ನಲ್ಲಿ ಒಪ್ಪಿಕೊಳ್ಳುವವನು … ನಾನೂ ಅವನಲ್ಲಿ ಒಪ್ಪಿಕೊಳ್ಳುವೆನು’ ಎಂದಿದೆ. ಇಲ್ಲಿ ಈ ಪ್ರಯೋಗವನ್ನು ಕನ್ನಡದ ಸಹಜ ಬಳಕೆಯಂತೆ ‘ನನ್ನನ್ನು … ಅವನನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುವೆನು’ ಎಂದು ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: ಆದ್ದರಿಂದ … ಪ್ರತಿಯೊಬ್ಬನನ್ನೂ
  rationale: Πᾶς ಜೊತೆಗೆ ὅστις ಎಲ್ಲರನ್ನೂ ಒಳಗೊಳ್ಳುವ ಸಾಮಾನ್ಯ ಅಭಿವ್ಯಕ್ತಿ. οὖν ಹಿಂದಿನ ಮಾತಿನೊಂದಿಗೆ ಇರುವ ನಿರ್ಣಯಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದ್ದರಿಂದ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: ನನ್ನನ್ನು ಬಹಿರಂಗವಾಗಿ ಒಪ್ಪಿಕೊಳ್ಳುವ
  rationale: ὁμολογέω ಇಲ್ಲಿ ಯೇಸುವನ್ನು ಜನರ ಸಮ್ಮುಖದಲ್ಲಿ ಬಹಿರಂಗವಾಗಿ ಅಂಗೀಕರಿಸುವ ಅರ್ಥ ಹೊಂದಿದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ನನ್ನನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುವ’ ಸಹಜವಾದ ರೂಪ; ಸಾರ್ವಜನಿಕ ಆಯಾಮವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಬಹಿರಂಗವಾಗಿ’ ಸೇರಿಸಲಾಗಿದೆ. ἐν ಎಂಬ ಉಪಸರ್ಗದ ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: ಜನರ ಮುಂದೆ
  rationale: ἄνθρωποι ಇಲ್ಲಿ ಲಿಂಗನಿರ್ದಿಷ್ಟವಾಗಿ ಪುರುಷರನ್ನು ಮಾತ್ರವಲ್ಲ, ಸಾಮಾನ್ಯವಾಗಿ ಮನುಷ್ಯರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಸಮಾವೇಶಕವೂ ಆದ ‘ಜನರ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: ನಾನೂ ಒಪ್ಪಿಕೊಳ್ಳುವೆನು
  rationale: ಮೊದಲ ὁμολογέω ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಉದ್ದೇಶಿತ ಸಮಾಂತರತೆಯನ್ನು ಉಳಿಸಲು ಅದೇ ‘ಒಪ್ಪಿಕೊಳ್ಳು’ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ. κἀγώಯ ಒತ್ತನ್ನು ‘ನಾನೂ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ἐν αὐτῷಯ ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆಯ ಮುಂದೆ
  rationale: ಮತ್ತಾಯನಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿರುವ ಈ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನ οὐρανοῖς ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಬಹುವಚನವಾಗಿದ್ದರೂ, ಕನ್ನಡದ ರೂಢಿಯಲ್ಲಿ ‘ಪರಲೋಕ’ ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವನ್ನು ಸಾರ್ವಜನಿಕವಾಗಿ ಒಪ್ಪಿಕೊಳ್ಳುವುದು ಮತ್ತು ಯೇಸು ಆ ವ್ಯಕ್ತಿಯನ್ನು ತಂದೆಯ ಮುಂದೆ ಒಪ್ಪಿಕೊಳ್ಳುವುದು
  choice: ವಾಕ್ಯದಲ್ಲಿರುವ ಪರಸ್ಪರ ಒಪ್ಪಿಕೊಳ್ಳುವ ವಾಗ್ದಾನವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪಿನ ನ್ಯಾಯಾಂಗ ಘೋಷಣೆ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು, ಅಥವಾ ಕೇವಲ ಪ್ರಸ್ತುತ ಶಿಷ್ಯತ್ವದ ಭಾಷೆ ಎಂದು ಸೀಮಿತಗೊಳಿಸುವುದು.
  rationale: ವಾಕ್ಯವು ತಂದೆಯ ಮುಂದೆ ಯೇಸು ಮಾಡುವ ಒಪ್ಪಿಕೊಳ್ಳುವಿಕೆಯನ್ನು ಹೇಳುತ್ತದೆ; ಆದರೆ ಅದರ ಕಾಲ ಅಥವಾ ವ್ಯವಸ್ಥಿತ ರಕ್ಷಣಾಶಾಸ್ತ್ರೀಯ ವಿಧಾನವನ್ನು ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಆ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಅನಿರ್ಣೀತವಾಗಿಯೇ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ ಸಹಜವಾದರೂ ಘನತೆಯುಳ್ಳ ಶೈಲಿ. ‘ಒಪ್ಪಿಕೊಳ್ಳು’ ಎಂಬ ಪದವನ್ನು ಎರಡೂ ಅರ್ಧಗಳಲ್ಲಿ ಪುನರಾವರ್ತಿಸಿ ಗ್ರೀಕ್‌ನ ಪರಸ್ಪರ ಸಮಾಂತರತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
