  terminology: ‘ಜನರ’ appropriately conveys the generic human sense of ἀνθρώπων. ‘ಪರಲೋಕದಲ್ಲಿರುವ ನನ್ನ ತಂದೆ’ is established, dignified Kannada biblical usage for the Matthean expression. The footnote now accurately describes the notable Greek ἐν expressions without falsely giving the first relative subject an accusative form.
