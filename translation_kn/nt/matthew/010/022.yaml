id: MAT.10.22
reference: Matthew 10:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: kn
  text: ನನ್ನ ಹೆಸರಿನ ನಿಮಿತ್ತವಾಗಿ ಎಲ್ಲರೂ ನಿಮ್ಮನ್ನು ದ್ವೇಷಿಸುವರು.[a] ಆದರೆ ಕೊನೆಯವರೆಗೂ ತಾಳಿಕೊಳ್ಳುವವನು[b] ರಕ್ಷಿಸಲ್ಪಡುವನು.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನನ್ನ ಹೆಸರಿನ ಕಾರಣದಿಂದಾಗಿ.’
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಕೊನೆಯವರೆಗೂ ದೃಢವಾಗಿ ನಿಲ್ಲುವವನು.’
    reason: lexical_alternative
  - marker: c
    text: ‘ರಕ್ಷಿಸಲ್ಪಡುವನು’ ಎಂಬುದನ್ನು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ ‘ಬಿಡಿಸಲ್ಪಡುವನು’ ಅಥವಾ ‘ಪಾರುಮಾಡಲ್ಪಡುವನು’ ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: ಎಲ್ಲರೂ ನಿಮ್ಮನ್ನು ದ್ವೇಷಿಸುವರು
  rationale: ಭವಿಷ್ಯಕಾಲದ ನಿಷ್ಕ್ರಿಯ ಸ್ಥಿತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಕರ್ತೃವಾಚ್ಯ ವಿನ್ಯಾಸದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; πάντων ಎಂಬುದರ ಸಮಗ್ರ ಅರ್ಥವನ್ನು ‘ಎಲ್ಲರೂ’ ಉಳಿಸುತ್ತದೆ.
- source_word: διὰ τὸ ὄνομά μου
  choice: ನನ್ನ ಹೆಸರಿನ ನಿಮಿತ್ತವಾಗಿ
  rationale: διά + accusative ಕಾರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಪದಪ್ರಯೋಗವು ಯೇಸುವಿನ ಹೆಸರು ಎಂದರೆ ಆತನ ವ್ಯಕ್ತಿತ್ವ, ಅಧಿಕಾರ ಮತ್ತು ಆತನೊಂದಿಗಿನ ನಿಷ್ಠೆ ಎಂಬ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಕುಗ್ಗಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ δὲ ὑπομείνας
  choice: ಆದರೆ ... ತಾಳಿಕೊಳ್ಳುವವನು
  rationale: ὑπομένω ಹಿಂಸೆಯ ಮಧ್ಯೆಯೂ ದೃಢವಾಗಿ ನಿಲ್ಲುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ತಾಳಿಕೊಳ್ಳುವವನು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದ್ದು, ನಿರ್ದಿಷ್ಟವಾದ ನಂತರದ ಸಿದ್ಧಾಂತಪದವನ್ನು ಹೇರದು.
- source_word: εἰς τέλος
  choice: ಕೊನೆಯವರೆಗೂ
  rationale: ನಿಗದಿತ ಅಂತ್ಯದವರೆಗೆ ಮುಂದುವರಿಯುವ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: οὗτος
  choice: ತಾಳಿಕೊಳ್ಳುವವನು
  rationale: ಗ್ರೀಕ್‌ನ οὗτος ಹಿಂದಿನ ಕೃದಂತ ಕರ್ತೃವನ್ನು ಒತ್ತಿಹೇಳಿ ಪುನರಾರಂಭಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಇವನೇ’ ಎಂದು ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸುವುದು ಅನಗತ್ಯವಾಗಿ ಕೃತಕವಾಗುವುದರಿಂದ, ಕರ್ತೃ-ಕ್ರಿಯಾಪದದ ಸಹಜ ಹರಿವಿನಲ್ಲಿ ಅದರ ಕೇಂದ್ರೀಕೃತ ಅರ್ಥ ಉಳಿಸಲಾಗಿದೆ.
- source_word: σωθήσεται
  choice: ರಕ್ಷಿಸಲ್ಪಡುವನು
  rationale: σῴζω ಎಂಬ ಪದದ ರಕ್ಷಣೆ, ಬಿಡಿಸಿಕೆ ಮತ್ತು ಅಂತಿಮ ಉದ್ಧಾರ ಎಂಬ ವ್ಯಾಪ್ತಿಯನ್ನು ‘ರಕ್ಷಿಸಲ್ಪಡುವನು’ ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭವನ್ನು ಕೇವಲ ದೈಹಿಕ ಪಾರುಗಾಣಿಕೆಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ತಾಳಿಕೊಳ್ಳುವಿಕೆ ಮತ್ತು ಅಂತಿಮ ರಕ್ಷಣೆಯ ಸಂಬಂಧ
  choice: ‘ರಕ್ಷಿಸಲ್ಪಡುವನು’ ಎಂಬ ವಿಶಾಲ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ದೈಹಿಕವಾಗಿ ಪಾರುಮಾಡಲ್ಪಡುವನು’ ಅಥವಾ ನಿರ್ದಿಷ್ಟ ಅಂತ್ಯಕಾಲದ/ಸಹನೆಯ ಸಿದ್ಧಾಂತವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು
  rationale: ವಾಕ್ಯವು ಹಿಂಸೆಯ ನಡುವೆ ಕೊನೆಯವರೆಗೂ ತಾಳಿಕೊಳ್ಳುವುದನ್ನು ರಕ್ಷಣೆಯೊಂದಿಗೆ ಸಂಬಂಧಿಸುತ್ತದೆ; ಆದರೆ ರಕ್ಷಣೆಯ ಸ್ವರೂಪವನ್ನು ಇಲ್ಲಿ ಕಿರಿದಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಂಥೀಯ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮತ್ತು ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ಗ್ರೀಕ್‌ನ ಅರ್ಥವ್ಯಾಪ್ತಿ ಮತ್ತು ಧಾರ್ಮಿಕ ಅನಿಶ್ಚಿತತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಕೃತಕ ಪದಕ್ರಮವನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
