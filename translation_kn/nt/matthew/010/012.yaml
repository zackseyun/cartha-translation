review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects εἰσερχόμενοι as a contemporaneous entry clause, retains the mild force of δέ without an artificial adversative, and preserves αὐτήν's singular reference to οἰκίαν. However, ‘ವಂದಿಸಿರಿ’ commonly suggests reverence, homage, or formal salutation in Kannada and can make greeting a house sound more anomalous than the Greek's conventional social greeting. ‘ಶುಭಾಶಯ ಹೇಳಿರಿ’ more accurately communicates ἀσπάσασθε in this context while retaining the deliberate metonymy.
  naturalness: ‘ನೀವು ಆ ಮನೆಗೆ ಪ್ರವೇಶಿಸುವಾಗ’ is natural modern standard Kannada. Replacing ‘ಅದನ್ನು ವಂದಿಸಿರಿ’ with ‘ಆ ಮನೆಗೆ ಶುಭಾಶಯ ಹೇಳಿರಿ’ avoids an unnatural direct-object construction and expresses the customary greeting idiom. The wording still preserves the source's reference to the house rather than prematurely substituting ‘ಮನೆಯವರು.’
  terminology: Use ‘ಶುಭಾಶಯ ಹೇಳಿರಿ’ for the ordinary interpersonal greeting commanded by ἀσπάσασθε. Retain ‘ಮನೆ’ in the main text and explain its metonymic reference to occupants in the footnote. This neither adds doctrinal interpretation nor resolves the metonymy beyond what the source and context support.
  issues:
  - severity: medium
    issue: ‘ವಂದಿಸಿರಿ’ is potentially misleading for ἀσπάσασθε.
    rationale: In contemporary Kannada, ‘ವಂದಿಸು’ often conveys paying respect, homage, or a deferential salute. Matthew 10:12 calls for an ordinary greeting upon entering; ‘ಶುಭಾಶಯ ಹೇಳಿರಿ’ is clearer and more idiomatic.
  - severity: low
    issue: The phrase ‘ಅದನ್ನು ವಂದಿಸಿರಿ’ is grammatically literal but pragmatically awkward in Kannada.
    rationale: Kannada naturally expresses greeting a place/household with the dative construction ‘ಮನೆಗೆ ಶುಭಾಶಯ ಹೇಳಿರಿ.’ This preserves the Greek metonymic house-reference without creating the impression that a building itself receives homage.
  revised_text: ನೀವು ಆ ಮನೆಗೆ ಪ್ರವೇಶಿಸುವಾಗ, ಆ ಮನೆಗೆ ಶುಭಾಶಯ ಹೇಳಿರಿ.[a]
