  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: kn
  text: ನೀವು ಆ ಮನೆಗೆ ಪ್ರವೇಶಿಸುವಾಗ, ಆ ಮನೆಗೆ ಶುಭಾಶಯ ಹೇಳಿರಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಮನೆಯವರಿಗೆ ಶುಭಾಶಯ ಹೇಳಿರಿ.’ ಗ್ರೀಕ್ ಪಠ್ಯವು ಅಕ್ಷರಶಃ ‘ಅದಕ್ಕೆ ಶುಭಾಶಯ ಹೇಳಿರಿ’ ಎಂದು ಹೇಳುತ್ತದೆ; ಇಲ್ಲಿ ‘ಮನೆ’ ಎಂಬುದು ಬಹುಶಃ ಅದರಲ್ಲಿ ವಾಸಿಸುವವರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: ನೀವು ... ಪ್ರವೇಶಿಸುವಾಗ
  rationale: ವರ್ತಮಾನಕಾಲದ ಬಹುವಚನ ಕೃದಂತವು ಆಜ್ಞೆಯೊಂದಿಗೆ ಕಾಲಸಂಬಂಧ ಸೂಚಿಸುವ ಕ್ರಿಯಾವಿಶೇಷಣೀಯ ಬಳಕೆಯಲ್ಲಿದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಪ್ರವೇಶಿಸುವಾಗ’ ಎಂಬುದು ಏಕಕಾಲಿಕತೆಯನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: δέ ಇಲ್ಲಿ ಸೌಮ್ಯ ಸಂಯೋಜಕ; ಹಿಂದಿನ ಮಾತಿನೊಂದಿಗೆ ಅದರ ಸಂಪರ್ಕವನ್ನು ಕನ್ನಡದ ವಾಕ್ಯರಚನೆಯೇ ಸಮರ್ಪಕವಾಗಿ ಹೊರುತ್ತದೆ. ‘ಆದರೆ’ ಎಂದು ಅನುವಾದಿಸಿದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದಷ್ಟು ವಿರೋಧಾರ್ಥ ಬಲವಾಗುತ್ತದೆ.
- source_word: οἰκίαν
  choice: ಆ ಮನೆಗೆ
  rationale: οἰκία ಎಂಬುದು ಮನೆ ಅಥವಾ ಮನೆಯವರನ್ನು ಸೂಚಿಸಬಹುದು. ಪ್ರವೇಶಿಸುವ ಸಂದರ್ಭದಲ್ಲಿರುವ ಭೌತಿಕ ಸ್ಥಳದ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲು ‘ಮನೆ’ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ; ಮನೆಯವರನ್ನು ಸೂಚಿಸುವ ಲಕ್ಷಣಾರ್ಥವನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
- source_word: ἀσπάσασθε
  choice: ವಂದಿಸಿರಿ
  rationale: ಇದು ದ್ವಿತೀಯ ಪುರುಷ ಬಹುವಚನದ ಭೂತಸಂಪನ್ನ ಮಧ್ಯಮ ಆಜ್ಞಾರ್ಥಕ ರೂಪ. ‘ವಂದಿಸಿರಿ’ ಗೌರವಪೂರ್ಣವಾದರೂ ಇಂದಿನ ಕನ್ನಡದಲ್ಲಿ ಗ್ರಾಹ್ಯವಾಗಿದ್ದು, ಭೇಟಿಯಾದಾಗ ಶುಭಾಶಯ ಹೇಳುವ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: αὐτήν
  choice: ಅದನ್ನು
  rationale: ಸ್ತ್ರೀಲಿಂಗ ಏಕವಚನ ಸರ್ವನಾಮವು οἰκίαν ಅನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಅದನ್ನು’ ಎನ್ನುವುದು ಮನೆಯನ್ನೇ ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಉಲ್ಲೇಖಿಸಿ ಮೂಲದ ಲಕ್ಷಣಾರ್ಥಕ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮನೆಯನ್ನೇ ವಂದಿಸುವ ಲಕ್ಷಣಾರ್ಥಕ ಹೇಳಿಕೆ ಅಥವಾ ಮನೆಯವರನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವಂದಿಸುವ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಅದನ್ನು ವಂದಿಸಿರಿ’ ಎಂದು ಮನೆಯ ಉಲ್ಲೇಖವನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ‘ಮನೆಯವರನ್ನು ವಂದಿಸಿರಿ’ ಅಥವಾ ‘ಅದರಲ್ಲಿರುವವರನ್ನು ವಂದಿಸಿರಿ’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ αὐτήν ಎಂಬ ಏಕವಚನ ಸರ್ವನಾಮವು οἰκίαν ಅನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ಉದ್ದೇಶಿತ ಸಾಮಾಜಿಕ ಅರ್ಥ ಬಹುಶಃ ಮನೆಯವರೇ ಆಗಿದ್ದರೂ, ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟೀಕರಿಸಿ ಮೂಲದ ನಿಜವಾದ ಭಾಷಾತ್ಮಕ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ, ಅಡಿಕುರಿತಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಗೌರವಪೂರ್ಣ ಆಜ್ಞಾರ್ಥಕ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಬಹುವಚನ ಸಂಬೋಧನೆಯನ್ನು ‘ನೀವು’ ಮತ್ತು ‘ವಂದಿಸಿರಿ’ ಮೂಲಕ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ಮೂಲದ ‘ಮನೆ/ಮನೆಯವರು’ ಎಂಬ ದ್ವಯಾರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯ ಮತ್ತು ಅಡಿಕುರಿತಿನ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
