id: MAT.10.39
reference: Matthew 10:39
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: kn
  text: ತನ್ನ ಜೀವವನ್ನು[a] ಕಂಡುಕೊಳ್ಳುವವನು ಅದನ್ನು ಕಳೆದುಕೊಳ್ಳುವನು; ಮತ್ತು ನನ್ನ ನಿಮಿತ್ತ ತನ್ನ ಜೀವವನ್ನು ಕಳೆದುಕೊಳ್ಳುವವನು ಅದನ್ನು ಕಂಡುಕೊಳ್ಳುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಎರಡೂ ವಾಕ್ಯಭಾಗಗಳಲ್ಲಿ ‘ಆತ್ಮ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ψυχή ಎಂಬ ಪದಕ್ಕೆ ‘ಜೀವ’ ಅಥವಾ ‘ಆತ್ಮ’ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ಆದರೆ ಇಲ್ಲಿ ಶಿಷ್ಯತ್ವದಲ್ಲಿ ತನ್ನ ಜೀವವನ್ನು ಕಳೆದುಕೊಳ್ಳುವುದು ಮತ್ತು ಕಂಡುಕೊಳ್ಳುವುದು ಎಂಬ ಸಂದರ್ಭಕ್ಕೆ ‘ಜೀವ’ ಹೆಚ್ಚು ಸೂಕ್ತವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: ಕಂಡುಕೊಳ್ಳುವವನು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಗ್ರೀಕ್ ಕೃದಂತವು ಸಾಮಾನ್ಯವಾಗಿ ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕಂಡುಕೊಳ್ಳುವವನು’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿದ್ದು, ಏಕವಚನದ ಪ್ರತಿನಿಧಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ψυχὴν (ψυχή)
  choice: ಜೀವ
  rationale: ಶಿಷ್ಯತ್ವದ ಸಂದರ್ಭದಲ್ಲಿ ψυχή ಇಲ್ಲಿ ಅಮೂರ್ತವಾದ ಆತ್ಮಕ್ಕಿಂತ ವ್ಯಕ್ತಿಯ ಜೀವವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಜೀವ’ ಎಂಬುದು ಕಂಡುಕೊಳ್ಳುವುದು–ಕಳೆದುಕೊಳ್ಳುವುದು ಎಂಬ ವಿರೋಧಾಭಾಸಕ್ಕೆ ಸರಿಹೊಂದುತ್ತದೆ; ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἀπολέσει / ὁ ἀπολέσας
  choice: ಕಳೆದುಕೊಳ್ಳುವನು / ಕಳೆದುಕೊಳ್ಳುವವನು
  rationale: ಇಲ್ಲಿ ἀπόλλυμι ನಾಶಮಾಡುವುದಕ್ಕಿಂತ ಕಳೆದುಕೊಳ್ಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಒಂದೇ ಕನ್ನಡ ಧಾತುವಿನ ಪುನರಾವರ್ತನೆ ಗ್ರೀಕ್ ವಾಕ್ಯದ ವಿರೋಧಾತ್ಮಕ ಸಮತೋಲನವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἕνεκεν ἐμοῦ
  choice: ನನ್ನ ನಿಮಿತ್ತ
  rationale: ಈ ಪದಬಂಧವು ಕಾರಣ ಅಥವಾ ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನನ್ನ ನಿಮಿತ್ತ’ ಯೇಸುವಿನ ಮೇಲಿನ ನಿಷ್ಠೆಯಿಂದ ಜೀವ ಕಳೆದುಕೊಳ್ಳುವ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: εὑρήσει
  choice: ಕಂಡುಕೊಳ್ಳುವನು
  rationale: ಮೊದಲ ಭಾಗದ εὑρὼν ಜೊತೆಯ ಉದ್ದೇಶಿತ ಪದಸಾಮ್ಯವನ್ನು ಉಳಿಸಲು ‘ಕಂಡುಕೊಳ್ಳುವನು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: αὐτοῦ / αὐτήν
  choice: ತನ್ನ / ಅದನ್ನು
  rationale: ಗ್ರೀಕ್‌ನ ಪ್ರತಿನಿಧಿಕ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ತನ್ನ’ ಮತ್ತು ಜೀವವನ್ನು ಸೂಚಿಸುವ ‘ಅದನ್ನು’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಶಿಷ್ಯತ್ವದ ವಿರೋಧಾಭಾಸದಲ್ಲಿ ψυχή ಪದದ ಅನುವಾದ
  choice: ಜೀವ
  alternative: ಆತ್ಮ
  rationale: ವಾಕ್ಯವು ಯೇಸುವಿನ ನಿಮಿತ್ತ ಜೀವವನ್ನು ಉಳಿಸಿಕೊಳ್ಳುವುದು ಅಥವಾ ಒಪ್ಪಿಸಿಕೊಡುವುದರ ಕುರಿತು ಹೇಳುತ್ತದೆ; ದೇಹ ಮತ್ತು ಆತ್ಮವನ್ನು ಮುಖ್ಯವಾಗಿ ಬೇರ್ಪಡಿಸುವುದಿಲ್ಲ. ಆದರೂ ψυχή ಪದಕ್ಕೆ ‘ಆತ್ಮ’ ಎಂಬ ಅರ್ಥವೂ ಸಾಧ್ಯವಿರುವುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- issue: ‘ಕಂಡುಕೊಳ್ಳುವುದು’ ಎಂಬುದರ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟೀಕರಿಸಬೇಕೇ ಎಂಬ ಪ್ರಶ್ನೆ
  choice: ಮೂಲದ ರೂಪಕ ಮತ್ತು ವಿರೋಧಾಭಾಸವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸುವುದು
  alternative: ತನ್ನ ಜೀವವನ್ನು ಉಳಿಸಿಕೊಳ್ಳಲು ಪ್ರಯತ್ನಿಸುವವನು
  rationale: ಗ್ರೀಕ್ ಪಾಠವು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ‘ಕಂಡುಕೊಳ್ಳುವನು/ಕಂಡುಕೊಳ್ಳುವವನು’ ಮತ್ತು ‘ಕಳೆದುಕೊಳ್ಳುವನು/ಕಳೆದುಕೊಳ್ಳುವವನು’ ಎಂಬ ಸಮಮಿತಿಯನ್ನು ಬಳಸುತ್ತದೆ. ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆ ಅರ್ಥವನ್ನು ಮುಂಚಿತವಾಗಿ ನಿರ್ಧರಿಸಬಹುದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಗಾದೆಯಂತಿರುವ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಆದರೆ’ ಮೂಲಕ ಎರಡು ಭಾಗಗಳ ವಿರೋಧವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸಲಾಗಿದೆ. ‘ನನ್ನ ನಿಮಿತ್ತ’ ಎಂಬುದು ಸ್ವಲ್ಪ ಉನ್ನತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಪರಿಚಿತವಾದ ಧಾರ್ಮಿಕ-ಸಾಹಿತ್ಯಿಕ ಬಳಕೆ.
