revisions:
- from: ಏಕೆಂದರೆ ಮಾತನಾಡುವವರು ನೀವಲ್ಲ; ನಿಮ್ಮಲ್ಲಿ ಮಾತನಾಡುವವರು ನಿಮ್ಮ ತಂದೆಯ ಆತ್ಮನೇ.[a][b]
  to: ಏಕೆಂದರೆ ಮಾತನಾಡುವವರು ನೀವಲ್ಲ, ಆದರೆ ನಿಮ್ಮಲ್ಲಿ ಮಾತನಾಡುವವರು ನಿಮ್ಮ ತಂದೆಯ ಆತ್ಮವೇ.[a][b]
  rationale: The revision explicitly renders ἀλλά with ‘ಆದರೆ’ and uses the more idiomatic emphatic ‘ಆತ್ಮವೇ.’ It retains the source’s present-speaking sense, the direct ‘ನಿಮ್ಮಲ್ಲಿ’ wording, and both existing footnote anchors. The alternative footnote continues to document the prior, more participial Kannada phrasing without changing the main-text meaning.
