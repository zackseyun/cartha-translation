review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys γάρ, the emphatic contrast between the disciples and the true speaker, ‘the Spirit of your Father,’ and the direct locative force of ἐν ὑμῖν. However, ἀλλά (‘but’) should be expressed explicitly rather than left to a semicolon and the emphatic suffix alone.
  naturalness: The parallel nominal structure is understandable and suitably formal Kannada. Adding ‘ಆದರೆ’ makes the contrast clearer and more natural in a public reading. ‘ಆತ್ಮವೇ’ is the idiomatic emphatic form here.
  terminology: ‘ನಿಮ್ಮ ತಂದೆಯ ಆತ್ಮ’ directly reflects τοῦ πατρὸς ὑμῶν without importing ‘heavenly.’ ‘ನಿಮ್ಮಲ್ಲಿ’ appropriately retains the source wording and does not prematurely resolve it as ‘through you.’
  issues:
  - severity: medium
    issue: The adversative ἀλλά is not explicitly represented.
    rationale: An internal semicolon and ‘ಆತ್ಮನೇ’ signal contrast, but they do not as clearly render the Greek’s explicit strong adversative. Adding ‘ಆದರೆ’ preserves the source relation without adding interpretation.
  - severity: low
    issue: Use of ‘ಆತ್ಮನೇ’ is less idiomatic than ‘ಆತ್ಮವೇ’ in this emphatic identification.
    rationale: ‘ಆತ್ಮವೇ’ naturally marks ‘the Spirit himself/it is the Spirit’ in this Kannada clause while preserving the Greek emphasis.
  revised_text: ಏಕೆಂದರೆ ಮಾತನಾಡುವವರು ನೀವಲ್ಲ, ಆದರೆ ನಿಮ್ಮಲ್ಲಿ ಮಾತನಾಡುವವರು ನಿಮ್ಮ ತಂದೆಯ ಆತ್ಮವೇ.[a][b]
