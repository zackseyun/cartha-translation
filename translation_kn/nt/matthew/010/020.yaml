id: MAT.10.20
reference: Matthew 10:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಮಾತನಾಡುವವರು ನೀವಲ್ಲ, ಆದರೆ ನಿಮ್ಮಲ್ಲಿ ಮಾತನಾಡುವವರು ನಿಮ್ಮ ತಂದೆಯ ಆತ್ಮವೇ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ನಿಮ್ಮ ಮೂಲಕ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ನಿಮ್ಮಲ್ಲಿ’ ಎಂದಿದೆ; ಅದು ಶಿಷ್ಯರ ಮೂಲಕ ಮಾತು ಹೊರಹೊಮ್ಮುವುದನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
  - marker: b
    text: ಅಥವಾ ‘ಆದರೆ ನಿಮ್ಮಲ್ಲಿ ಮಾತನಾಡುತ್ತಿರುವ ನಿಮ್ಮ ತಂದೆಯ ಆತ್ಮ.’
    reason: previous_rendering
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ಏಕೆಂದರೆ … ಅಲ್ಲ
  rationale: γάρ ಹಿಂದಿನ ಭರವಸೆಗೆ ವಿವರಣಾತ್ಮಕ ಕಾರಣವನ್ನು ಜೋಡಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಏಕೆಂದರೆ’ ಆ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὑμεῖς … οἱ λαλοῦντες
  choice: ಮಾತನಾಡುವವರು ನೀವಲ್ಲ
  rationale: ಸ್ಪಷ್ಟವಾಗಿ ಬಂದಿರುವ ὑμεῖς ಮತ್ತು articular participle ವಕ್ತಾರರ ಗುರುತಿನ ಮೇಲಿರುವ ಒತ್ತನ್ನು ಸೂಚಿಸುತ್ತವೆ; ಈ ಕನ್ನಡ ವಾಕ್ಯರಚನೆ ಅದನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀλλὰ
  choice: ; … ಆತ್ಮನೇ
  rationale: ἀλλάಯ ಬಲವಾದ ವಿರೋಧವನ್ನು ಅರ್ಧವಿರಾಮ ಮತ್ತು ಒತ್ತಿನ ‘ನೇ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: ನಿಮ್ಮ ತಂದೆಯ ಆತ್ಮ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸಂಬಂಧವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಪರಲೋಕದ’ ಎಂಬ ಮೂಲದಲ್ಲಿಲ್ಲದ ವಿಶೇಷಣವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: τὸ λαλοῦν ἐν ὑμῖν
  choice: ನಿಮ್ಮಲ್ಲಿ ಮಾತನಾಡುವವರು
  rationale: ವರ್ತಮಾನ ಕೃದಂತದ ನಡೆಯುತ್ತಿರುವ ಕ್ರಿಯೆಯನ್ನೂ ἐν ಎಂಬ ಉಪಸರ್ಗದ ನೇರವಾದ ‘ನಲ್ಲಿ’ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ನಿಮ್ಮ ಮೂಲಕ’ ಎಂದು ಅರ್ಥವನ್ನು ಮಿತಿಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ἐν ὑμῖν ಎಂಬುದು ‘ನಿಮ್ಮಲ್ಲಿ’ ಎಂಬ ಒಳವಾಸದ ಅರ್ಥವೋ, ‘ನಿಮ್ಮ ಮೂಲಕ’ ಎಂಬ ಸಾಧನಾರ್ಥವೋ
  choice: ನಿಮ್ಮಲ್ಲಿ
  alternative: ನಿಮ್ಮ ಮೂಲಕ
  rationale: ἐνನ ನೇರ ಅರ್ಥ ‘ನಲ್ಲಿ/ಒಳಗೆ.’ ಈ ಸಂದರ್ಭವು ಶಿಷ್ಯರ ಮೂಲಕ ಹೊರಹೊಮ್ಮುವ ಮಾತನ್ನೂ ಸೂಚಿಸಬಹುದಾದರೂ, ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆ ಮತ್ತು ತಾತ್ತ್ವಿಕ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಶೈಲಿ. ‘ಮಾತನಾಡುವವರು … ಆತ್ಮನೇ’ ಎಂಬ ಸಮಾಂತರ ರಚನೆ ಗ್ರೀಕ್‌ನ ವಕ್ತಾರರ ಗುರುತಿನ ಮೇಲಿನ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
