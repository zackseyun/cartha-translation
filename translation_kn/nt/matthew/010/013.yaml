  rationale: ಮುಖ್ಯಪಾಠದಲ್ಲಿ οἰκίαಯ ಏಕವಚನ ‘ಮನೆ’ಯನ್ನೂ, ಅದಕ್ಕೆ ಹೊಂದುವ ‘ಅದರ/ಅದು’ ಸರ್ವನಾಮಗಳನ್ನೂ ಪುನಃಸ್ಥಾಪಿಸಲಾಗಿದೆ. ಸಂದರ್ಭದಲ್ಲಿರುವ ‘ಮನೆಯವರು’ ಎಂಬ ಸಾಧ್ಯ ಒಳಾರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿ ಉಳಿಸುತ್ತದೆ. ἐλθάτωಗೆ ‘ಬರಲಿ’ ಬಳಸಿ ಮೂಲದ ಕ್ರಿಯಾತ್ಮಕ ಚಿತ್ರಣವನ್ನು ಸಂರಕ್ಷಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಮೂಲದ ಷರತ್ತು, ವಿರೋಧ, ‘ನಿಮ್ಮ ಶಾಂತಿ,’ ಅದರ ಮೇಲಿನ ಆಗಮನ, ಮತ್ತು ಶಿಷ್ಯರ ಬಳಿಗೆ ಮರಳುವಿಕೆ ಉಳಿದಿವೆ.
