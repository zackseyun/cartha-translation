id: MAT.10.13
reference: Matthew 10:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: kn
  text: ಆ ಮನೆಯು ಯೋಗ್ಯವಾಗಿದ್ದರೆ[a], ನಿಮ್ಮ ಶಾಂತಿಯು ಅದರ ಮೇಲೆ ಬರಲಿ; ಆದರೆ ಅದು ಯೋಗ್ಯವಾಗಿರದಿದ್ದರೆ[b], ನಿಮ್ಮ ಶಾಂತಿಯು ನಿಮ್ಮ ಬಳಿಗೆ ಹಿಂದಿರುಗಲಿ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಪದಶಃ, “ಮನೆ.” ಇಲ್ಲಿ “ಮನೆ” ಎಂಬುದು ವಾಸಸ್ಥಳವನ್ನೂ, ಸಂದರ್ಭಾನುಸಾರ ಅದರ ಮನೆಯವರನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಇಲ್ಲಿ “ಯೋಗ್ಯ” ಎಂದರೆ ನೈತಿಕವಾಗಿ ಪಾಪರಹಿತ ಎಂಬುದಲ್ಲ; ದೂತರನ್ನೂ ಅವರ ಶಾಂತಿಯನ್ನೂ ಸ್ವೀಕರಿಸಲು ತಕ್ಕದ್ದು ಎಂಬುದು ಸಂದರ್ಭದ ಅರ್ಥ.
    reason: cultural_note
  - marker: c
    text: “ನಿಮ್ಮ ಬಳಿಗೆ ತಿರುಗಿ ಬರಲಿ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ಆ ಮನೆಯವರು
  rationale: ಪದಶಃ ‘ಮನೆ’ ಎಂದಾದರೂ, ಈ ಸಂದರ್ಭದಲ್ಲಿ ದೂತರನ್ನು ಸ್ವೀಕರಿಸುವವರು ಮನೆಯ ಜನರು. ಕನ್ನಡದಲ್ಲಿ ‘ಮನೆ ಯೋಗ್ಯವಾಗಿದ್ದರೆ’ ಎನ್ನುವುದಕ್ಕಿಂತ ‘ಮನೆಯವರು ಯೋಗ್ಯರಾಗಿದ್ದರೆ’ ಸಹಜವಾಗಿದ್ದು ಸಂದರ್ಭದ ವಿಸ್ತೃತ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ; ಮೂಲದ ‘ಮನೆ/ಮನೆಯವರು’ ವ್ಯಾಪ್ತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἀξία
  choice: ಯೋಗ್ಯರಾಗಿದ್ದರೆ
  rationale: ‘ಯೋಗ್ಯ’ ಎಂಬುದು ಮೌಲ್ಯನಿರ್ಣಯದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದನ್ನು ಕೇವಲ ‘ಸ್ವೀಕರಿಸಲು ಸಿದ್ಧ’ ಎಂದು ಕಿರಿದಾಗಿಸುವುದಿಲ್ಲ.
- source_word: ἐλθάτω
  choice: ನೆಲೆಸಲಿ
  rationale: ಪದಶಃ ‘ಬರಲಿ’. ಆದರೆ ಶಾಂತಿ ಮನೆಯ ಮೇಲೆ ಬರುವ ಸೆಮಿಟಿಕ್ ಆಶೀರ್ವಾದದ ಚಿತ್ರಣವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಅವರ ಮೇಲೆ ನೆಲೆಸಲಿ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಮೂಲ ಕ್ರಿಯೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: εἰρήνη
  choice: ಶಾಂತಿ
  rationale: ಸಮಾಧಾನ, ಕ್ಷೇಮ ಮತ್ತು ಆಶೀರ್ವಾದದ ವಿಶಾಲ ಹಿನ್ನೆಲೆಯನ್ನು ಒಳಗೊಳ್ಳಬಲ್ಲ ಸಾಮಾನ್ಯ ಹಾಗೂ ನೇರ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ἐπ’ αὐτήν
  choice: ಅವರ ಮೇಲೆ
  rationale: οἰκίαಯನ್ನು ಸಂದರ್ಭಾನುಸಾರ ಮನೆಯವರು ಎಂದು ನೀಡಿರುವುದರಿಂದ ಸರ್ವನಾಮವನ್ನು ಮಾನವ ಬಹುವಚನವಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ; ‘ಮೇಲೆ’ ಮೂಲದ ದಿಕ್ಕು/ನೆಲೆಸುವ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: πρὸς ὑμᾶς
  choice: ನಿಮ್ಮ ಬಳಿಗೆ
  rationale: πρόςನ ‘ನಿಮ್ಮ ಕಡೆಗೆ/ನಿಮ್ಮ ಬಳಿಗೆ’ ಎಂಬ ದಿಕ್ಕಿನ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐπιστραφήτω
  choice: ಹಿಂದಿರುಗಲಿ
  rationale: ಶಾಂತಿ ಅಲ್ಲಿ ಉಳಿಯದೆ ಶಿಷ್ಯರ ಬಳಿಗೆ ಮರಳುತ್ತದೆ ಎಂಬ ಮೂಲದ ಅರ್ಥ ಮತ್ತು ಆಜ್ಞಾರ್ಥಕ ಆಶಯವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: μὲν ... δὲ
  choice: …ಇದ್ದರೆ; ಆದರೆ …ಇರದಿದ್ದರೆ
  rationale: ಎರಡು ಷರತ್ತುಗಳ ನಡುವಿನ ಸ್ಪಷ್ಟ ವಿರೋಧವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ನಿಮ್ಮ ಶಾಂತಿ’ಯ ಸ್ವರೂಪ
  choice: ಶಿಷ್ಯರೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದ ಶಾಂತಿಯ ಆಶೀರ್ವಾದವು ಮನೆಯವರ ಮೇಲೆ ನೆಲೆಸಬಹುದು ಅಥವಾ ಅವರ ಬಳಿಗೆ ಹಿಂದಿರುಗಬಹುದು ಎಂಬ ಜೀವಂತ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ಕೇವಲ ‘ನಿಮ್ಮ ಶಾಂತಿಯ ಶುಭಾಶಯ’ ಅಥವಾ ನಿರ್ದಿಷ್ಟ ರೀತಿಯಲ್ಲಿ ವರ್ಗಾಯಿಸಲ್ಪಡುವ ಆಧ್ಯಾತ್ಮಿಕ ಶಕ್ತಿ ಎಂದು ವಿವರಿಸುವುದು.
  rationale: ಮೂಲಪಾಠವು ಶಾಂತಿಯನ್ನು ಸ್ಪಷ್ಟವಾದ, ಚಲಿಸುವ ಆಶೀರ್ವಾದದಂತೆ ಚಿತ್ರಿಸಿದರೂ ಅದರ ಕಾರ್ಯವಿಧಾನವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅದನ್ನು ಕೇವಲ ಶುಭಾಶಯವೆಂದು ಕುಗ್ಗಿಸದೆ, ಸಿದ್ಧಾಂತಾತ್ಮಕವಾಗಿ ವ್ಯವಸ್ಥಿತಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- issue: ‘ಯೋಗ್ಯ’ ಎಂಬುದರ ಅರ್ಥ
  choice: ದೂತರನ್ನೂ ಅವರ ಶಾಂತಿಯನ್ನೂ ಸ್ವೀಕರಿಸಲು ತಕ್ಕವರು ಎಂಬ ಸಂದರ್ಭಸಂಬಂಧಿತ ಅರ್ಥ.
  alternative: ನೈತಿಕವಾಗಿ ಪಾಪರಹಿತರು ಅಥವಾ ಸ್ವತಃ ದೇವರ ಅನುಗ್ರಹಕ್ಕೆ ಅರ್ಹರು ಎಂಬ ಅರ್ಥ.
  rationale: ಮುಂದಿನ ಮತ್ತು ಹಿಂದಿನ ವಾಕ್ಯಗಳ ಸಂದರ್ಭವು ಆತಿಥ್ಯ ಹಾಗೂ ಮಿಷನ್ ದೂತರ ಸ್ವೀಕಾರವನ್ನು ಕುರಿತಿದೆ; ಸಂಪೂರ್ಣ ನೈತಿಕ ಅರ್ಹತೆಯನ್ನು ಪ್ರತಿಪಾದಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ‘ಮನೆ’ ಎಂಬ ಗ್ರೀಕ್ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಜೀವವಿಲ್ಲದ ಕಟ್ಟಡಕ್ಕೆ ಯೋಗ್ಯತೆ ಆರೋಪಿಸುವ ಅಸಹಜತೆಯನ್ನು ತಪ್ಪಿಸಲು ‘ಮನೆಯವರು’ ಎಂದು ಸಂದರ್ಭಾನುಸಾರ ನೀಡಲಾಗಿದೆ; ಪದಶಃ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯಪಾಠದಲ್ಲಿ ಸೇರಿವೆ.
