id: MAT.10.14
reference: Matthew 10:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: kn
  text: ಯಾರಾದರೂ ನಿಮ್ಮನ್ನು ಸ್ವೀಕರಿಸದಿದ್ದರೆ ಅಥವಾ ನಿಮ್ಮ ಮಾತುಗಳನ್ನು ಕೇಳದಿದ್ದರೆ,[a] ನೀವು ಆ ಮನೆಯಿಂದ ಅಥವಾ ಆ ಊರಿನಿಂದ[c] ಹೊರಡುವಾಗ, ನಿಮ್ಮ ಪಾದಗಳ ಧೂಳನ್ನು ಝಾಡಿಹಾಕಿರಿ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಯಾರಾದರೂ ನಿಮ್ಮನ್ನು ಸ್ವೀಕರಿಸದಿದ್ದರೆ ಅಥವಾ ನಿಮ್ಮ ಮಾತುಗಳಿಗೆ ಕಿವಿಗೊಡದಿದ್ದರೆ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ಪಾದಗಳ ಧೂಳನ್ನು ಝಾಡಿಹಾಕುವುದು’ ಸಂದೇಶವನ್ನು ತಿರಸ್ಕರಿಸಿದವರಿಂದ ಸಂಬಂಧ ಕಡಿದುಕೊಳ್ಳುವುದನ್ನೂ ಅವರ ಮೇಲಿನ ನ್ಯಾಯತೀರ್ಪನ್ನೂ ಸೂಚಿಸುವ ಸಾಂಕೇತಿಕ ಕ್ರಿಯೆಯಾಗಿತ್ತು.
    reason: cultural_note
  - marker: c
    text: ಅಥವಾ, ‘ಆ ಮನೆಯಿಂದ ಅಥವಾ ಆ ಪಟ್ಟಣದಿಂದ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: ಯಾರೇ ಆಗಿರಲಿ
  rationale: ಅನಿರ್ದಿಷ್ಟವಾದ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಮುಂದಿನ ನಿರಾಕರಣಾತ್ಮಕ ಕ್ರಿಯಾಪದಗಳೊಂದಿಗೆ ‘ಯಾರೇ ... ಆಗಿರಲಿ’ ಎಂಬ ರಚನೆ ಹೊಂದುತ್ತದೆ.
- source_word: δέξηται ὑμᾶς
  choice: ನಿಮ್ಮನ್ನು ಸ್ವೀಕರಿಸದವರೂ
  rationale: δέχομαι ಎಂಬುದು ಆತಿಥ್ಯದಿಂದ ಬರಮಾಡಿಕೊಳ್ಳುವುದನ್ನೂ ಸಂದೇಶವಾಹಕರನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುವುದನ್ನೂ ಒಳಗೊಂಡಿದೆ; ‘ಸ್ವೀಕರಿಸು’ ಈ ಎರಡೂ ಆಯಾಮಗಳನ್ನು ತೆರೆದಿಡುತ್ತದೆ.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: ನಿಮ್ಮ ಮಾತುಗಳನ್ನು ಕೇಳದವರೂ
  rationale: ἀκούω ಎಂಬುದರ ಮೂಲ ‘ಕೇಳು’ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ‘ಪಾಲಿಸು’ ಎಂದು ಅತಿಯಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἐξερχόμενοι ἔξω
  choice: ಹೊರಡುವಾಗ
  rationale: ಸ್ಥಳದಿಂದ ಹೊರಗೆ ಹೋಗುವ ಸಹಕಾಲಿಕ ಕ್ರಿಯೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: ಆ ಮನೆಯಿಂದ ಅಥವಾ ಆ ಊರಿನಿಂದ
  rationale: ἐκείνης ಎಂಬ ಸೂಚಕದ ಬಲವನ್ನು ಎರಡೂ ನಾಮಪದಗಳಿಗೆ ಸಹಜವಾಗಿ ಅನ್ವಯಿಸುತ್ತದೆ; πόλις ಅನ್ನು ವಸತಿಯ ಗಾತ್ರವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಗೊಳಿಸದ ‘ಊರು’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἐκτινάξατε
  choice: ಝಾಡಿಸಿಬಿಡಿರಿ
  rationale: ಬಲವಾಗಿ ಕಳಚಿಹಾಕುವ ಆಜ್ಞಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: ನಿಮ್ಮ ಪಾದಗಳ ಧೂಳನ್ನು
  rationale: ಕಾಲುಗಳಿಗೆ ಅಂಟಿರುವ ನಿರ್ದಿಷ್ಟ ಧೂಳಿನ concrete image ಅನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಸಂದೇಶವನ್ನು ತಿರಸ್ಕರಿಸಿದವರ ಕಡೆಗಿನ ಸಾಂಕೇತಿಕ ನ್ಯಾಯತೀರ್ಪಿನ ಕ್ರಿಯೆ
  choice: ‘ನಿಮ್ಮ ಪಾದಗಳ ಧೂಳನ್ನು ಝಾಡಿಸಿಬಿಡಿರಿ’ ಎಂಬ ಸ್ಪಷ್ಟ ಕ್ರಿಯೆಯನ್ನೇ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಸಮಾನಾಂತರ ವಾಕ್ಯಗಳಿಂದ ‘ಅವರಿಗೆ ಸಾಕ್ಷಿಯಾಗಿ’ ಎಂದು ಸೇರಿಸುವುದು ಅಥವಾ ‘ಅವರನ್ನು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಬಿಟ್ಟುಬಿಡಿರಿ’ ಎಂದು ಅರ್ಥವಿವರಣಾತ್ಮಕವಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ಈ ವಾಕ್ಯವೇ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಸಮಾನಾಂತರ ಭಾಗಗಳ ಪದಗಳನ್ನು ಸೇರಿಸದೆ, ಮೂಲದ ಚಿತ್ರ ಮತ್ತು ಅದರ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥವನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಊರು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದ್ದು πόλις‌ನ ಗಾತ್ರವನ್ನು ಪೂರ್ವನಿರ್ಧರಿಸುವುದಿಲ್ಲ; ‘ಪಟ್ಟಣ’ವನ್ನು ಪರ್ಯಾಯವಾಗಿ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
