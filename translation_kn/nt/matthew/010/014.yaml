review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the indefinite condition, reception of the messengers, hearing their words, departure from the specified house or town, and the imperative to shake off dust. However, the opening Kannada relative-clause construction is less natural and can misleadingly sound like a plural class of people rather than the Greek's generic conditional ‘whoever/if anyone.’
  naturalness: ‘ನಿಮ್ಮನ್ನು ಸ್ವೀಕರಿಸದವರೂ ನಿಮ್ಮ ಮಾತುಗಳನ್ನು ಕೇಳದವರೂ ಯಾರೇ ಆಗಿರಲಿ’ is grammatically interpretable but cumbersome in modern standard Kannada. A conditional singular-generic construction is more idiomatic. ‘ಝಾಡಿಹಾಕಿರಿ’ is also a more standard direct expression for the commanded action than ‘ಝಾಡಿಸಿಬಿಡಿರಿ.’
  terminology: ‘ಸ್ವೀಕರಿಸು,’ ‘ಮಾತುಗಳನ್ನು ಕೇಳು,’ ‘ಮನೆ,’ ‘ಊರು,’ and ‘ಪಾದಗಳ ಧೂಳು’ appropriately preserve the source imagery and register. The cultural note remains appropriately limited to explaining the symbolic action and does not insert wording into the verse.
  issues:
  - severity: medium
    issue: The opening relative construction is awkward and shifts the generic conditional expression toward a pluralized description.
    rationale: ὃς ἂν μὴ δέξηται ... μηδὲ ἀκούσῃ has a singular indefinite/generic force. ‘ಯಾರಾದರೂ ... ಇದ್ದರೆ’ is natural Kannada and preserves the conditional force without adding interpretation.
  - severity: low
    issue: The imperative ‘ಝಾಡಿಸಿಬಿಡಿರಿ’ is less idiomatic than ‘ಝಾಡಿಹಾಕಿರಿ’ in this context.
    rationale: The latter naturally expresses forcefully shaking/removing dust while retaining the concrete symbolic action of ἐκτινάξατε.
