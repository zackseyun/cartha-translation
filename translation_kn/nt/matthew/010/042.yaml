id: MAT.10.42
reference: Matthew 10:42
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: kn
  text: 'ಈ ಚಿಕ್ಕವರಲ್ಲಿ[a] ಒಬ್ಬನಿಗೆ ಅವನು ಶಿಷ್ಯನೆಂಬ ಕಾರಣಕ್ಕಾಗಿ[b] ಕೇವಲ ಒಂದು ಲೋಟ ತಣ್ಣೀರನ್ನಾದರೂ ಕುಡಿಯಲು ಕೊಡುವ ಯಾರೇ ಆಗಲಿ, ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಅವನು ತನ್ನ ಪ್ರತಿಫಲವನ್ನು ಖಂಡಿತವಾಗಿಯೂ ಕಳೆದುಕೊಳ್ಳುವುದಿಲ್ಲ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಈ ಚಿಕ್ಕವರು’ ಎಂಬುದು ಇಲ್ಲಿ ಮಕ್ಕಳನ್ನು ಮಾತ್ರ ಸೂಚಿಸಬೇಕೆಂದಿಲ್ಲ; ಸಂದರ್ಭದ ಪ್ರಕಾರ, ಯೇಸುವಿನ ಹಿಂಬಾಲಕರಲ್ಲಿ ಅಲ್ಪರೆಂದು ಪರಿಗಣಿಸಲ್ಪಡುವವರನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
  - marker: b
    text: ಹೆಚ್ಚು ಪದಶಃವಾಗಿ, ‘ಶಿಷ್ಯನ ಹೆಸರಿನಲ್ಲಿ.’ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟು, ಸ್ವೀಕರಿಸುವವನು ಶಿಷ್ಯನಾಗಿರುವುದರಿಂದ ಅವನಿಗೆ ಈ ಕೃತ್ಯವನ್ನು ಮಾಡಲಾಗುತ್ತದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: ಯಾರು ಆಗಿದ್ದರೂ
  rationale: ಸಾಪೇಕ್ಷ ಸರ್ವನಾಮದೊಡನೆ ἄν ಬರುವುದರಿಂದ ಉಂಟಾಗುವ ಅನಿರ್ದಿಷ್ಟ ಹಾಗೂ ಸಾರ್ವತ್ರಿಕ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ποτίσῃ
  choice: ಕುಡಿಯಲು ಕೊಡುವವನು
  rationale: ಕ್ರಿಯಾಪದದ ಮೂಲ ಅರ್ಥವಾದ ‘ಕುಡಿಯಲು ಕೊಡು’ ಎಂಬುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: ಈ ಚಿಕ್ಕವರಲ್ಲಿ ಒಬ್ಬನಿಗೆ
  rationale: ‘ಚಿಕ್ಕವರು’ ಎಂಬುದು ಮಕ್ಕಳಿಗಷ್ಟೇ ಸೀಮಿತಗೊಳಿಸದೆ, ಅಲ್ಪರೆಂದು ಪರಿಗಣಿಸಲ್ಪಡುವ ಅಥವಾ ದೀನಸ್ಥಿತಿಯಲ್ಲಿರುವವರ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ποτήριον ψυχροῦ
  choice: ಒಂದು ಲೋಟ ತಣ್ಣೀರು
  rationale: ψυχροῦ ಜೊತೆ ಅರ್ಥಗರ್ಭಿತವಾಗಿ ಇರುವ ‘ನೀರು’ ಎಂಬ ನಾಮಪದವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಿ, ಸಾಮಾನ್ಯವಾದ ಅಲ್ಪ ಉಪಚಾರದ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: μόνον
  choice: ತಣ್ಣೀರನ್ನಾದರೂ
  rationale: ಮೊಳಕೆಯಾದ ಸಹಾಯವೂ—ಕೇವಲ ಒಂದು ಲೋಟ ತಣ್ಣೀರು ಕೊಡುವುದೂ—ಗಮನಾರ್ಹವೆಂಬ ಒತ್ತನ್ನು ಕನ್ನಡದ ‘ಆದರೂ’ ರೂಪ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: ಅವನು ಶಿಷ್ಯನೆಂಬ ಕಾರಣಕ್ಕೆ
  rationale: ಸ್ವೀಕರಿಸುವವನ ಶಿಷ್ಯನ ಗುರುತಿನ ಕಾರಣದಿಂದ ಈ ಕಾರ್ಯ ನಡೆಯುತ್ತದೆ ಎಂಬ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿನ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಲಿಂಗಸೂಚನೆ ಗ್ರೀಕ್ μαθητοῦ ಪುಲ್ಲಿಂಗ ಏಕವಚನಕ್ಕೆ ಹೊಂದಿದೆ.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ
  rationale: ಯೇಸುವಿನ ಗಂಭೀರ ಮತ್ತು ಅಧಿಕಾರಪೂರ್ಣ ಘೋಷಣೆಯ ಸೂತ್ರವನ್ನು ಗೌರವಯುತ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ಖಂಡಿತವಾಗಿಯೂ ಕಳೆದುಕೊಳ್ಳುವುದಿಲ್ಲ
  rationale: οὐ μή ಎಂಬ ಬಲವಾದ ನಿರಾಕರಣೆಯ ನಿಶ್ಚಿತತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μισθὸν αὐτοῦ
  choice: ತನ್ನ ಪ್ರತಿಫಲವನ್ನು
  rationale: ಈ ಶಿಷ್ಯತ್ವದ ಸಂದರ್ಭದಲ್ಲಿ μισθός ಸೂಚಿಸುವ ಬಹುಮಾನ ಅಥವಾ ಪ್ರತಿದಾನವನ್ನು ‘ಪ್ರತಿಫಲ’ ಸಹಜವಾಗಿ ಒಳಗೊಳ್ಳುತ್ತದೆ; ಪ್ರತಿಬಿಂಬಾತ್ಮಕ ‘ತನ್ನ’ ಕರ್ತನೊಡನೆ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಗೊಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಈ ಚಿಕ್ಕವರು’ ಎಂಬುದರ ಉಲ್ಲೇಖ
  choice: ‘ಈ ಚಿಕ್ಕವರು’ ಎಂದು ವಿಶಾಲ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅದನ್ನು ಮಕ್ಕಳಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸಿಲ್ಲ.
  alternative: ಮಕ್ಕಳು ಮಾತ್ರ; ಅಥವಾ ಹೊಸ/ದುರ್ಬಲ ವಿಶ್ವಾಸಿಗಳು ಮಾತ್ರ
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭವು ಶಿಷ್ಯರನ್ನು ಸ್ವೀಕರಿಸುವುದರ ಕುರಿತು ಮಾತನಾಡುತ್ತದೆ. ಆದ್ದರಿಂದ ಮೂಲದ ಮುಕ್ತವಾದ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸಿ, ನಿರ್ದಿಷ್ಟ ಗುಂಪಿಗೆ ಅನಗತ್ಯವಾಗಿ ಸೀಮಿತಗೊಳಿಸಲಿಲ್ಲ.
- issue: εἰς ὄνομα μαθητοῦ ಎಂಬುದರ ಅರ್ಥ
  choice: ‘ಅವನು ಶಿಷ್ಯನೆಂಬ ಕಾರಣಕ್ಕೆ’ ಎಂದು ಸಂದರ್ಭೋಚಿತವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಶಿಷ್ಯನ ಹೆಸರಿನಲ್ಲಿ’ ಅಥವಾ ‘ಶಿಷ್ಯನೆಂದು’
  rationale: ಈ ನುಡಿಗಟ್ಟು ಸ್ವೀಕರಿಸುವವನ ಶಿಷ್ಯನ ಗುರುತಿನ ಆಧಾರದ ಮೇಲೆ ಮಾಡುವ ಕಾರ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸೂತ್ರಾತ್ಮಕ ಅಥವಾ ಪಂಥೀಯ ಅರ್ಥವನ್ನು ಹೇರದೆ ಉದ್ದೇಶವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- issue: ಪ್ರತಿಫಲವನ್ನು ಕಳೆದುಕೊಳ್ಳದಿರುವ ಭರವಸೆ
  choice: οὐ μήಯ ಬಲವನ್ನು ‘ಖಂಡಿತವಾಗಿಯೂ ... ಇಲ್ಲ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಸರಳವಾಗಿ ‘ಕಳೆದುಕೊಳ್ಳುವುದಿಲ್ಲ’
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನ ಒತ್ತನ್ನು ದುರ್ಬಲಗೊಳಿಸದೆ, ಪ್ರತಿಫಲದ ಸ್ವರೂಪ ಅಥವಾ ಕಾಲವನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ನಿರ್ಧರಿಸಲಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ಮೂಲದ ಬಲವಾದ ನಿರಾಕರಣೆ ಹಾಗೂ ‘ಚಿಕ್ಕವರು’ ಎಂಬ ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
