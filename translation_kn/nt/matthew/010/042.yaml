  naturalness: The original long, front-loaded relative clause is understandable but somewhat stiff in modern standard Kannada. ‘ಯಾರೇ ಆಗಲಿ’ and ‘ಕಾರಣಕ್ಕಾಗಿ’ provide a smoother, idiomatic construction.
  terminology: ‘ಚಿಕ್ಕವರು,’ ‘ಶಿಷ್ಯ,’ and ‘ಪ್ರತಿಫಲ’ are suitable, neutral choices. ‘ಚಿಕ್ಕವರು’ appropriately preserves the source expression without deciding that it means children alone. ‘ಅವನು ಶಿಷ್ಯನೆಂಬ ಕಾರಣಕ್ಕಾಗಿ’ naturally communicates εἰς ὄνομα μαθητοῦ without importing a ritual sense.
