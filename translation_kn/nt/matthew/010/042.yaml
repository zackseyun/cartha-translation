    rationale: Separate anchors after ‘ಚಿಕ್ಕವರು’ and ‘ಶಿಷ್ಯನೆಂಬ ಕಾರಣಕ್ಕಾಗಿ’ make the notes clearly and structurally connected to their respective terms.
