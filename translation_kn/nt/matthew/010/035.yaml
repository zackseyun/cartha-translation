id: MAT.10.35
reference: Matthew 10:35
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: kn
  text: ಏಕೆಂದರೆ ನಾನು ಒಬ್ಬ ಪುರುಷನನ್ನು ಅವನ ತಂದೆಯ ವಿರುದ್ಧವಾಗಿ, ಮಗಳನ್ನು ಅವಳ ತಾಯಿಯ ವಿರುದ್ಧವಾಗಿ, ಸೊಸೆಯನ್ನು ಅವಳ ಅತ್ತೆಯ ವಿರುದ್ಧವಾಗಿ ನಿಲ್ಲಿಸಲು[a] ಬಂದೆನು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ವಿಭಜಿಸಲು’; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವನ್ನು ಇನ್ನಷ್ಟು ಪದಶಃ ಹೀಗೆ ಅನುವಾದಿಸಬಹುದು. ಆದರೆ ಮುಂದಿನ ಪುನರಾವರ್ತಿತ ‘ವಿರುದ್ಧವಾಗಿ’ ಎಂಬ ರಚನೆಗಳು ಸಂಬಂಧಗಳಲ್ಲಿನ ವಿರೋಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.
    reason: lexical_alternative
  - marker: b
    text: ಗ್ರೀಕ್ νύμφη ಎಂಬ ಪದವು ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ ‘ವಧು’ ಎಂದಾಗಬಹುದು; ಇಲ್ಲಿ ಅದು ‘ಅತ್ತೆ’ ಎಂಬ ಪದದೊಂದಿಗೆ ಜೋಡಿಯಾಗಿರುವುದರಿಂದ ‘ಸೊಸೆ’ ಎಂದರ್ಥ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: ನಾನು ಬಂದೆನು
  rationale: ಆರಿಸ್ಟ್ ಸೂಚಕ ಕ್ರಿಯಾಪದವು ಈ ಮಾತಿನಲ್ಲಿ ಯೇಸುವಿನ ಬರುವಿಕೆ ಮತ್ತು ಕಾರ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸರಳ ಭೂತಕಾಲವು ಸಹಜವೂ ನೇರವೂ ಆಗಿದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಹೇಳಿಕೆಗೆ ಕಾರಣ ಅಥವಾ ವಿವರಣೆ ನೀಡುವ ಸಂಪರ್ಕವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: διχάσαι
  choice: ವಿರೋಧವಾಗಿ ... ನಿಲ್ಲಿಸಲು
  rationale: ಈ ಕ್ರಿಯಾಪದದ ಮೂಲ ಅರ್ಥ ‘ವಿಭಜಿಸಲು’; ಆದರೆ ಮುಂದುವರಿಯುವ κατά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮೂರು ರಚನೆಗಳು ಕುಟುಂಬ ಸದಸ್ಯರ ನಡುವಿನ ವಿರೋಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ. ಆದ್ದರಿಂದ ಸಂಬಂಧಾತ್ಮಕ ಸಂಘರ್ಷವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἄνθρωπον
  choice: ಒಬ್ಬ ಮಗನನ್ನು
  rationale: ἄνθρωπος ಸಾಮಾನ್ಯವಾಗಿ ‘ಮನುಷ್ಯ’ ಎಂದೂ ಬರಬಹುದು; ಇಲ್ಲಿ ತಂದೆ–ಮಗ, ತಾಯಿ–ಮಗಳು, ಅತ್ತೆ–ಸೊಸೆ ಎಂಬ ಕುಟುಂಬದ ಸಮಾಂತರ ಜೋಡಣೆ ಇದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಒಬ್ಬ ಮಗ’ ಈ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಮತ್ತು ಲಿಂಗಸೂಕ್ತವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: ಅವನ ತಂದೆಗೆ ವಿರೋಧವಾಗಿ
  rationale: κατά + ಷಷ್ಠೀ ವಿಭಕ್ತಿ ವಿರೋಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ವಿರೋಧವಾಗಿ’ ಅದರ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: θυγατέρα
  choice: ಮಗಳನ್ನು
  rationale: ಸ್ತ್ರೀಲಿಂಗ ಏಕವಚನ ನಾಮಪದದ ನೇರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: ಅವಳ ತಾಯಿಗೆ ವಿರೋಧವಾಗಿ
  rationale: ಹಿಂದಿನ κατά ರಚನೆಯಂತೆಯೇ ವಿರೋಧದ ಅರ್ಥವನ್ನು ಮತ್ತು ಸಮಾಂತರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: νύμφην
  choice: ಸೊಸೆಯನ್ನು
  rationale: νύμφη ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ ‘ವಧು’ ಎಂದಾಗಬಹುದು; ಇಲ್ಲಿ πενθερά ‘ಅತ್ತೆ’ ಎಂಬ ಪದದೊಂದಿಗೆ ಜೋಡಿಯಾಗಿರುವುದರಿಂದ ‘ಸೊಸೆ’ ಎಂಬ ಸಂಬಂಧಾರ್ಥವೇ ಸೂಕ್ತ.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: ಅವಳ ಅತ್ತೆಗೆ ವಿರೋಧವಾಗಿ
  rationale: πενθερά ಇಲ್ಲಿ ಗಂಡನ ತಾಯಿ/ಅತ್ತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಪುನರಾವರ್ತಿತ ವಿರೋಧದ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಬರುವಿಕೆಯ ಉದ್ದೇಶ ಮತ್ತು ಕುಟುಂಬದಲ್ಲಿ ಉಂಟಾಗುವ ವಿಭಜನೆ
  choice: ಯೇಸುವಿನ ಮಾತಿನ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಉಳಿಸಿ, ಅವನ ಬರುವಿಕೆಯಿಂದ ಕುಟುಂಬ ಸದಸ್ಯರು ಪರಸ್ಪರ ವಿರೋಧವಾಗಿ ನಿಲ್ಲುವ ಸ್ಥಿತಿಯನ್ನು ನೇರವಾಗಿ ಹೇಳಲಾಗಿದೆ.
  alternative: ‘ವಿಭಜಿಸಲು’ ಎಂದು ಹೆಚ್ಚು ಪದಶಃ ಅನುವಾದಿಸುವುದು, ಅಥವಾ ಯೇಸುವಿನ ನಿಷ್ಠೆಯಿಂದ ಉಂಟಾಗುವ ಹಿಂಸೆಯನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ಸೇರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ‘ವಿಭಜಿಸಲು/ವಿರೋಧವಾಗಿ ನಿಲ್ಲಿಸಲು’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ. ಇದನ್ನು ಕುಟುಂಬ ವೈಮನಸ್ಸಿನಲ್ಲಿ ಯೇಸು ಸಂತೋಷಪಡುತ್ತಾನೆಂದು ವಿವರಿಸಬಾರದು; ಹಾಗೆಯೇ ಸಂಘರ್ಷವು ಕೇವಲ ಅನಿರೀಕ್ಷಿತ ಪರಿಣಾಮವೆಂದು ದುರ್ಬಲಗೊಳಿಸಬಾರದು. ಮೂಲದಲ್ಲಿರುವ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ ಶೈಲಿ. ಮೂಲದ ಮೂರು ಸಮಾಂತರ ಕುಟುಂಬ-ವಿರೋಧ ರಚನೆಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಬಂದೆನು’ ಎಂಬ ರೂಪವು ಶಾಸ್ತ್ರಪಠನಕ್ಕೆ ತಕ್ಕ ಗೌರವಭರಿತ ಧಾಟಿಯನ್ನು ನೀಡುತ್ತದೆ.
