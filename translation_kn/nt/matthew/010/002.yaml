id: MAT.10.2
reference: Matthew 10:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: kn
  text: 'ಹನ್ನೆರಡು ಅಪೊಸ್ತಲರ ಹೆಸರುಗಳು ಇವು: ಮೊದಲನೆಯವನು[a] ಪೇತ್ರನೆಂದು ಕರೆಯಲ್ಪಡುವ ಸೀಮೋನನು ಮತ್ತು ಅವನ ಸಹೋದರ ಅಂದ್ರೇಯನು; ಜೆಬೆದಾಯನ ಮಗ ಯಾಕೋಬನು ಮತ್ತು ಅವನ ಸಹೋದರ ಯೋಹಾನನು,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಮೊದಲನೆಯವನು’ ಎಂಬುದು ಪಟ್ಟಿಯ ಕ್ರಮದಲ್ಲಿ ಮೊದಲು ಎಂಬುದಷ್ಟೇ ಅಲ್ಲದೆ, ಹನ್ನೆರಡು ಮಂದಿಯಲ್ಲಿ ಪ್ರಾಮುಖ್ಯವನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಇಲ್ಲಿ δέ ಸೌಮ್ಯವಾದ ವಿಷಯಾಂತರವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ವಾಕ್ಯದ ಸಹಜ ಆರಂಭವೇ ಆ ಸಂಬಂಧವನ್ನು ಹೊರುತ್ತದೆ; ಕಾಲಸೂಚಕವಾದ ‘ಈಗ’ ಅನ್ನು ಸೇರಿಸುವುದು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ಸ್ಪಷ್ಟೀಕರಣವಾಗುತ್ತದೆ.
- source_word: δώδεκα ἀποστόλων
  choice: ಹನ್ನೆರಡು ಅಪೊಸ್ತಲರ
  rationale: ἀπόστολος ಯೇಸು ನೇಮಿಸಿ ಕಳುಹಿಸಿದ ಗುರುತಿಸಲ್ಪಟ್ಟ ಗುಂಪನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅಪೊಸ್ತಲ’ ಎಂಬುದು ಕನ್ನಡ ಕ್ರೈಸ್ತ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವೂ ಸಂದರ್ಭಕ್ಕೆ ನಿಖರವೂ ಆಗಿದೆ.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: ಹೆಸರುಗಳು ಇವು
  rationale: ಮೂಲದ ನಿರ್ದೇಶಕ ರಚನೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: πρῶτος
  choice: ಮೊದಲನೆಯವನು
  rationale: ಪಟ್ಟಿಯಲ್ಲಿ ಪುಲ್ಲಿಂಗ ವ್ಯಕ್ತಿಯನ್ನು ಮೊದಲು ಹೆಸರಿಸುವುದನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಅಧಿಕಾರದ ಪ್ರಾಮುಖ್ಯವನ್ನು ಮುಖ್ಯಪಾಠದಲ್ಲೇ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: ὁ λεγόμενος Πέτρος
  choice: ಪೇತ್ರನೆಂದು ಕರೆಯಲ್ಪಡುವ
  rationale: ಸೀಮೋನನನ್ನು ಪೇತ್ರ ಎಂಬ ಹೆಸರಿನಿಂದ ಗುರುತಿಸುವ ಗ್ರೀಕ್ ಕೃದಂತರಚನೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಗೌರವಯುತವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: ಅವನ ಸಹೋದರ
  rationale: ಎರಡೂ ಸಂದರ್ಭಗಳಲ್ಲಿ ನಿಜವಾದ ಕುಟುಂಬಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮೊದಲನೆಯದರಲ್ಲಿ ಸೀಮೋನನನ್ನೂ ಎರಡನೆಯದರಲ್ಲಿ ಯಾಕೋಬನನ್ನೂ ‘ಅವನ’ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: ಜೆಬೆದಾಯನ ಮಗ
  rationale: ಗ್ರೀಕ್ ಷಷ್ಠೀವಿಭಕ್ತಿಯ ಗುರುತಿಸುವ ಪದಬಂಧವು ತಂದೆ-ಮಗ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಇದನ್ನು ‘ಜೆಬೆದಾಯನ ಮಗ’ ಎಂದು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗುತ್ತದೆ.
theological_decisions:
- issue: ಸೀಮೋನ/ಪೇತ್ರನೊಂದಿಗೆ πρῶτος ಎಂಬ ಪದದ ಅರ್ಥ
  choice: ಪಟ್ಟಿಯ ಕ್ರಮವನ್ನು ಸೂಚಿಸುವ ‘ಮೊದಲನೆಯವನು’ ಎಂದು ಮುಖ್ಯಪಾಠದಲ್ಲಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಹನ್ನೆರಡು ಮಂದಿಯಲ್ಲಿ ಪ್ರಾಮುಖ್ಯ ಅಥವಾ ಮುನ್ನಡೆಯ ಸ್ಥಾನವನ್ನು ಸೂಚಿಸಬಹುದು.
  rationale: πρῶτος ಕ್ರಮದಲ್ಲಿನ ಮೊದಲ ಸ್ಥಾನವನ್ನು ಸೂಚಿಸಬಲ್ಲದು; ಪ್ರಾಮುಖ್ಯದ ಸೂಕ್ಷ್ಮಾರ್ಥವೂ ಸಾಧ್ಯ. ಪದ್ಯವೇ ಅಧಿಕಾರದ ಸ್ವರೂಪವನ್ನು ನಿರ್ಧರಿಸದಿರುವುದರಿಂದ ಮುಖ್ಯಪಾಠವು ಸರಳ ಪದಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಪರ್ಯಾಯ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಪಟ್ಟಿಯ ಲಯವನ್ನು ಕಾಪಾಡಲು ಅಲ್ಪವಿರಾಮ ಮತ್ತು ಅರ್ಧವಿರಾಮ ಬಳಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ಕಾಲಸೂಚಕ ಸಂಪರ್ಕಪದವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
