  text: But even the hairs of your head are all numbered[a].
translation:
  language: kn
  text: ಆದರೆ ನಿಮ್ಮ ತಲೆಯ ಕೂದಲುಗಳೆಲ್ಲವೂ ಸಹ ಎಣಿಸಲ್ಪಟ್ಟಿವೆ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಎಣಿಸಲ್ಪಟ್ಟಿರುವವು.” ಗ್ರೀಕ್‌ನ ಪೂರ್ಣ ಕರ್ಮಣಿ ರೂಪವು ಕ್ರಿಯೆ ಪೂರ್ಣಗೊಂಡಿದ್ದು, ಅದರ ಫಲಿತ ಸ್ಥಿತಿ ಈಗಲೂ ಇದೆ ಎಂಬುದನ್ನು ಒತ್ತಿಹೇಳಬಹುದು.
