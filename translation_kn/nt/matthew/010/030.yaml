lexical_decisions:
- source_word: ὑμῶν
  choice: ನಿಮ್ಮ
  rationale: ಎರಡನೇ ಪುರುಷ ಬಹುವಚನದ ಸ್ವಾಮ್ಯಸೂಚಕ ರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ನಿಮ್ಮ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದ ಧೈರ್ಯವಚನಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸೌಮ್ಯವಾದ ವ್ಯತ್ಯಾಸ ಅಥವಾ ಮಾತಿನ ತಿರುವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: καὶ
  choice: -ವೂ
  rationale: ‘ಕೂದಲುಗಳೆಲ್ಲವೂ’ ಎಂಬ ರೂಪದಲ್ಲಿನ ‘-ವೂ’ ಅತಿ ಸಣ್ಣ ಸಂಗತಿಗಳೂ ಹೊರತಾಗಿಲ್ಲ ಎಂಬ ‘ಸಹ/ಕೂಡ’ ಎಂಬ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: ನಿಮ್ಮ ತಲೆಯ ಕೂದಲುಗಳು
  rationale: ತಲೆಗೆ ಸೇರಿದ ಪ್ರತ್ಯೇಕ ಕೂದಲುಗಳನ್ನು ಸಮೂಹವಾಗಿ ಸೂಚಿಸುವ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟನ್ನು ಸ್ಪಷ್ಟ ಹಾಗೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: πᾶσαι
  choice: ಎಲ್ಲವೂ
  rationale: ಯಾವುದೂ ಹೊರತಾಗಿಲ್ಲ ಎಂಬ ಸಂಪೂರ್ಣತೆಯ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἠριθμημέναι εἰσίν
  choice: ಎಣಿಸಲ್ಪಟ್ಟಿವೆ
  rationale: ಪೂರ್ಣಗೊಂಡ ಕ್ರಿಯೆಯಿಂದ ಉಂಟಾದ ಈಗಿನ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಪೂರ್ಣ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಈ ಹೇಳಿಕೆ ಸೂಚಿಸುವ ದೈವಿಕ ಜ್ಞಾನ ಮತ್ತು ಕಾಳಜಿಯ ವ್ಯಾಪ್ತಿ
  choice: ಕೂದಲುಗಳೆಲ್ಲವೂ ಎಣಿಸಲ್ಪಟ್ಟಿವೆ ಎಂಬ ಸ್ಪಷ್ಟ ಚಿತ್ರಣವನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ದೇವರ ಕಾಳಜಿ ಅಥವಾ ಸಾರ್ವಭೌಮ ನಿಯಂತ್ರಣವನ್ನು ನೇರವಾಗಿ ವಿವರಿಸುವ ಅರ್ಥವಿಸ್ತೃತ ಅನುವಾದ.
  rationale: ಮೂಲ ವಾಕ್ಯವು ದೇವರ ಜ್ಞಾನ ಅಥವಾ ಪರಿಪಾಲನೆಯ ಕುರಿತು ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸದೆ, ಕೂದಲುಗಳು ಎಣಿಸಲ್ಪಟ್ಟಿವೆ ಎಂಬ ದೃಶ್ಯರೂಪಕ ಹೇಳಿಕೆಯನ್ನು ಮಾತ್ರ ನೀಡುತ್ತದೆ; ಅದರ ಧಾರ್ಮಿಕ ಸೂಚನೆಯನ್ನು ಸಂದರ್ಭವೇ ತಿಳಿಸಲು ಬಿಡಲಾಗಿದೆ.
