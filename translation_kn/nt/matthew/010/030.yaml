  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ಕೂದಲುಗಳೆಲ್ಲವೂ’ ಎಂಬ ರೂಪವು ಮೂಲದ ಬಹುವಚನ ಮತ್ತು ಸಂಪೂರ್ಣತೆಯ ಒತ್ತನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ.
