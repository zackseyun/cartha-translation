id: MAT.10.19
reference: Matthew 10:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: kn
  text: ಆದರೆ ಅವರು ನಿಮ್ಮನ್ನು ಒಪ್ಪಿಸಿಕೊಡುವಾಗ[a], ನೀವು ಹೇಗೆ ಅಥವಾ ಏನು ಮಾತನಾಡಬೇಕೆಂದು ಚಿಂತಿಸಬೇಡಿ. ಏಕೆಂದರೆ ಆ ಗಳಿಗೆಯಲ್ಲಿ ನೀವು ಏನು ಮಾತನಾಡಬೇಕೋ ಅದು ನಿಮಗೆ ಕೊಡಲಾಗುವುದು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿಮ್ಮನ್ನು ಹಸ್ತಾಂತರಿಸುವಾಗ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ಕೊಡಲಾಗುವುದು’ ಎಂಬ ಕರ್ಮಣಿ ರೂಪವು ಕೊಡುವವರು ಯಾರೆಂದು ಇಲ್ಲಿ ಹೇಳುವುದಿಲ್ಲ; ಮುಂದಿನ ವಚನವು ನಿಮ್ಮ ಮೂಲಕ ಮಾತನಾಡುವವರು ಆತ್ಮನೆಂದು ತಿಳಿಸುತ್ತದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ಆದರೆ ... ಒಪ್ಪಿಸಿಕೊಡುವಾಗ
  rationale: ὅταν ಭವಿಷ್ಯದಲ್ಲಿ ಸಂಭವಿಸುವ ಅನಿರ್ದಿಷ್ಟ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ; δέ ಹಿಂದಿನ ಎಚ್ಚರಿಕೆಯಿಂದ ಈ ಸೂಚನೆಗೆ ಸಾಗುವ ಸೌಮ್ಯವಾದ ವ್ಯತ್ಯಾಸವನ್ನು ತೋರಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: παραδῶσιν
  choice: ಒಪ್ಪಿಸಿಕೊಡುವಾಗ
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಇಲ್ಲಿ ಶತ್ರುತ್ವಪೂರ್ಣ ನ್ಯಾಯಾಂಗ ಸನ್ನಿವೇಶದಲ್ಲಿ ಯಾರನ್ನಾದರೂ ಇತರರ ಅಧಿಕಾರಕ್ಕೆ ಒಪ್ಪಿಸುವ ಅರ್ಥ ಹೊಂದಿದೆ; ‘ದ್ರೋಹಮಾಡುವಾಗ’ ಎಂದು ಅನುವಾದಿಸುವುದರಿಂದ ಮೂಲದಲ್ಲಿಲ್ಲದ ಉದ್ದೇಶವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವ ಸಾಧ್ಯತೆ ಇದೆ.
- source_word: μὴ μεριμνήσητε
  choice: ಚಿಂತಿಸಬೇಡಿ
  rationale: ಮುಂಬರುವ ವಿಚಾರಣೆ ಅಥವಾ ಸಾಕ್ಷ್ಯದ ಕುರಿತು ಆತಂಕದಿಂದ ಕಳವಳಪಡಬಾರದೆಂಬ ಆಜ್ಞೆಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πῶς ἢ τί λαλήσητε
  choice: ನೀವು ಹೇಗೆ ಅಥವಾ ಏನು ಮಾತನಾಡಬೇಕೆಂದು
  rationale: πῶς ಮತ್ತು τί ಮಾತಿನ ವಿಧಾನ ಹಾಗೂ ವಿಷಯವನ್ನು ಪ್ರತ್ಯೇಕಿಸುತ್ತವೆ; ἤ ಯ ‘ಅಥವಾ’ ಅರ್ಥವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: δοθήσεται
  choice: ಕೊಡಲಾಗುವುದು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ಕೊಡುವವರು ಯಾರು ಎಂಬುದನ್ನು ಈ ವಚನದಲ್ಲಿರುವಂತೆಯೇ ಅಪ್ರಕಟವಾಗಿ ಬಿಡುತ್ತದೆ.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ಆ ಗಳಿಗೆಯಲ್ಲೇ
  rationale: ಅಗತ್ಯವಾದ ಅದೇ ಸಮಯದಲ್ಲಿ ನೆರವು ದೊರೆಯುವ ತಕ್ಷಣಿಕತೆಯನ್ನು ‘ಗಳಿಗೆಯಲ್ಲೇ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τί λαλήσητε
  choice: ನೀವು ಏನು ಮಾತನಾಡಬೇಕೋ
  rationale: λαλέω ಕ್ರಿಯಾಪದದ ಹಿಂದಿನ ಬಳಕೆಯೊಂದಿಗಿನ ಪದಸಂಬಂಧವನ್ನು ‘ಮಾತನಾಡು’ ಎಂಬ ಒಂದೇ ಕ್ರಿಯಾಪದದ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: δοθήσεται ಎಂಬ ಕರ್ಮಣಿ ರೂಪದಲ್ಲಿ ಕೊಡುವವರ ಗುರುತು ಅಪ್ರಕಟವಾಗಿರುವುದು
  choice: ‘ಕೊಡಲಾಗುವುದು’ ಎಂಬ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ಕೊಡುವವರನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹೆಸರಿಸದಿರುವುದು
  alternative: ‘ದೇವರು ನಿಮಗೆ ಕೊಡುವನು’ ಅಥವಾ ‘ಪವಿತ್ರಾತ್ಮನು ನಿಮಗೆ ಕೊಡುವನು’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಈ ವಚನದಲ್ಲಿ ಕೊಡುವವರನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ. ಮುಂದಿನ ವಚನವು ಆತ್ಮನ ಕಾರ್ಯವನ್ನು ವಿವರಿಸುವುದರಿಂದ, ಅದನ್ನು ಇಲ್ಲಿ ಮುಂಚಿತವಾಗಿ ಸೇರಿಸದೆ ಮೂಲದ ಸಂಯಮ ಮತ್ತು ಧಾರ್ಮಿಕ ಅರ್ಥದ ಕ್ರಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಸರಳ, ಗೌರವಯುತ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡವನ್ನು ಬಳಸಲಾಗಿದೆ. ಬಹುವಚನ ಸಂಬೋಧನೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ನ್ಯಾಯಾಂಗ ಸನ್ನಿವೇಶದ ಅರ್ಥವನ್ನು ಅತಿಯಾಗಿ ವಿವರಿಸದೆ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
