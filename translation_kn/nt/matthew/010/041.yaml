id: MAT.10.41
reference: Matthew 10:41
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: kn
  text: ಪ್ರವಾದಿಯನ್ನು ಪ್ರವಾದಿಯ ಹೆಸರಿನಲ್ಲಿ[a] ಸ್ವೀಕರಿಸುವವನು ಪ್ರವಾದಿಯ ಪ್ರತಿಫಲವನ್ನು ಪಡೆಯುವನು; ನೀತಿವಂತನನ್ನು ನೀತಿವಂತನ ಹೆಸರಿನಲ್ಲಿ[b] ಸ್ವೀಕರಿಸುವವನು ನೀತಿವಂತನ ಪ್ರತಿಫಲವನ್ನು ಪಡೆಯುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಅವನು ಪ್ರವಾದಿ ಎಂಬ ಕಾರಣದಿಂದ’ ಅಥವಾ ‘ಅವನನ್ನು ಪ್ರವಾದಿಯೆಂದು.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಪ್ರವಾದಿಯ ಹೆಸರಿನಲ್ಲಿ’ ಎಂದಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ಅವನು ನೀತಿವಂತನು ಎಂಬ ಕಾರಣದಿಂದ’ ಅಥವಾ ‘ಅವನನ್ನು ನೀತಿವಂತನೆಂದು.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ನೀತಿವಂತನ ಹೆಸರಿನಲ್ಲಿ’ ಎಂದಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: ಸ್ವೀಕರಿಸುವವನು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವರ್ತಮಾನ ಕೃದಂತದ ಸಾಮಾನ್ಯ ಸ್ವಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ; ವ್ಯಕ್ತಿಯನ್ನು ಬರಮಾಡಿಕೊಳ್ಳುವುದು ಮತ್ತು ಅಂಗೀಕರಿಸುವುದು ಎಂಬ δεχόμενος ಪದದ ವ್ಯಾಪ್ತಿಗೂ ಇದು ಸಹಜವಾಗಿ ಹೊಂದುತ್ತದೆ.
- source_word: προφήτην
  choice: ಪ್ರವಾದಿಯನ್ನು
  rationale: ಗುರುತಿಸಲ್ಪಟ್ಟ ಧಾರ್ಮಿಕ ಪಾತ್ರವನ್ನು ಯಾವುದೇ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ನೇರವಾಗಿ ಸೂಚಿಸುವ ರೂಢಿಯ ಕನ್ನಡ ಪದ.
- source_word: εἰς ὄνομα προφήτου
  choice: ಪ್ರವಾದಿಯ ಹೆಸರಿನಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ ಪದಬಂಧದ ರೂಪ ಮತ್ತು ಪುನರಾವರ್ತನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಇದರ ಅರ್ಥ ಪ್ರವಾದಿಯ ಗುರುತು ಅಥವಾ ಸ್ಥಾನಮಾನವನ್ನು ಮಾನ್ಯಮಾಡಿ ಸ್ವೀಕರಿಸುವುದಾಗಿರಬಹುದು; ಸ್ಪಷ್ಟ ಪರ್ಯಾಯಗಳನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: μισθὸν προφήτου
  choice: ಪ್ರವಾದಿಯ ಪ್ರತಿಫಲ
  rationale: ಇದು ಪ್ರವಾದಿಗೆ ದೊರೆಯುವ ಪ್ರತಿಫಲವೋ ಅಥವಾ ಪ್ರವಾದಿಯನ್ನು ಸ್ವೀಕರಿಸುವವನಿಗೆ ತಕ್ಕ ಪ್ರತಿಫಲವೋ ಎಂಬ ಸಂಬಂಧದ ಸಹಜ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: λήμψεται
  choice: ಪಡೆಯುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಅರ್ಥವನ್ನು dignified, natural Kannadaನಲ್ಲಿ ಸರಳವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δίκαιον
  choice: ನೀತಿವಂತನನ್ನು
  rationale: ನೀತಿಯುಳ್ಳವನು ಎಂಬ ಪದಾರ್ಥವನ್ನೂ ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ರೂಪವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς ὄνομα δικαίου
  choice: ನೀತಿವಂತನ ಹೆಸರಿನಲ್ಲಿ
  rationale: ಮೊದಲ ಉಪವಾಕ್ಯದ ಸಮಾನಾಂತರ ರಚನೆಯನ್ನು ಉಳಿಸಿ, ಆ ವ್ಯಕ್ತಿಯ ಗುರುತು ಅಥವಾ ಗುಣದ ಆಧಾರದ ಮೇಲೆ ಸ್ವೀಕರಿಸುವ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: μισθὸν δικαίου
  choice: ನೀತಿವಂತನ ಪ್ರತಿಫಲ
  rationale: ಮೊದಲ ಉಪವಾಕ್ಯದ ಸಮಾನಾಂತರತೆಯನ್ನೂ ಷಷ್ಠೀ ಸಂಬಂಧದ ಅಸ್ಪಷ್ಟತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: εἰς ὄνομα + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಹೆಸರಿನಲ್ಲಿ’ ಎಂಬ ರೂಪವನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಅವನು ಪ್ರವಾದಿ/ನೀತಿವಂತನು ಎಂಬ ಕಾರಣದಿಂದ’ ಅಥವಾ ‘ಪ್ರವಾದಿ/ನೀತಿವಂತನೆಂದು’
  rationale: ಈ ಪದಬಂಧವು ಆ ವ್ಯಕ್ತಿಯ ಗುರುತು, ಸ್ಥಾನ ಅಥವಾ ಸ್ವಭಾವವನ್ನು ಮಾನ್ಯಮಾಡಿ ಸ್ವೀಕರಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಹೆಚ್ಚು ವಿವರಣಾತ್ಮಕ ಅನುವಾದವು ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿದರೂ ಗ್ರೀಕ್‌ನ ಪುನರಾವರ್ತಿತ ರೂಪ ಮತ್ತು ಅದರ ಧಾರ್ಮಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಕುಗ್ಗಿಸುತ್ತದೆ.
- issue: δίκαιον / δικαίου ಪದಗಳ ಪುಲ್ಲಿಂಗ ರೂಪ
  choice: ‘ನೀತಿವಂತನು’ ಎಂಬ ಪುಲ್ಲಿಂಗ ರೂಪವನ್ನು ಬಳಸುವುದು
  alternative: ‘ನೀತಿಯುಳ್ಳ ವ್ಯಕ್ತಿ’
  rationale: ಮೂಲದಲ್ಲಿರುವ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಪಾರದರ್ಶಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಇದರಿಂದ ಈ ಹೇಳಿಕೆಯ ಪ್ರತಿನಿಧಾತ್ಮಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಸೀಮಿತಗೊಳಿಸುವ ಉದ್ದೇಶವಿಲ್ಲ.
- issue: μισθὸν προφήτου / δικαίου ಎಂಬ ಷಷ್ಠೀ ಸಂಬಂಧ
  choice: ‘ಪ್ರವಾದಿಯ/ನೀತಿವಂತನ ಪ್ರತಿಫಲ’ ಎಂದು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಪ್ರವಾದಿಗೆ/ನೀತಿವಂತನಿಗೆ ದೊರೆಯುವ ಪ್ರತಿಫಲ’
  rationale: ಗ್ರೀಕ್ ಷಷ್ಠೀ ರೂಪವು ಪ್ರತಿಫಲದ ನಿಖರ ಸಂಬಂಧವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ವಿವರಣಾತ್ಮಕವಾಗಿ ಒಂದೇ ಅರ್ಥವನ್ನು ನಿಗದಿಪಡಿಸದೆ ಮೂಲದ ತೆರೆಯನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಸ್ವೀಕರಿಸುವವನು … ಪಡೆಯುವನು’ ಎಂಬ ಸಮಾನಾಂತರ ವಿನ್ಯಾಸವು ಮೂಲದ ಲಯ ಮತ್ತು ತಾರ್ಕಿಕ ಜೋಡಣೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಹೆಸರಿನಲ್ಲಿ’ ಎಂಬ ಸ್ವಲ್ಪ ಗಾಢವಾದ ಧಾರ್ಮಿಕ ನುಡಿಗಟ್ಟನ್ನು ಪಾದಟಿಪ್ಪಣಿಗಳಿಂದ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
