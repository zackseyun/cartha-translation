  to: ಕಾನಾನೀಯನಾದ ಸೀಮೋನನು[a] ಮತ್ತು ಆತನನ್ನು ದ್ರೋಹಿಸಿದವನಾದ ಇಸ್ಕರಿಯೋತ ಯೂದನು[b].
