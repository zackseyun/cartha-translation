id: MAT.10.4
reference: Matthew 10:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: kn
  text: ಕಾನಾನೀಯನಾದ ಸೀಮೋನನು[a] ಮತ್ತು ಆತನನ್ನು ದ್ರೋಹಿಸಿದವನಾದ ಇಸ್ಕರಿಯೋತ ಯೂದನು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಉತ್ಸಾಹಿಯಾದ ಸೀಮೋನನು.’ ಇಲ್ಲಿ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಕಾನಾನೀಯ’ ಎಂದಿದೆ; ಇದು ಬಹುಶಃ ಅರಮಾಯಿಕ/ಹೀಬ್ರೂ ಮೂಲದ ಬಿರುದನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ ಮತ್ತು ಸಂಪ್ರದಾಯವಾಗಿ ‘ಉತ್ಸಾಹಿ’ ಎಂದು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಾಗಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಆತನನ್ನು ಒಪ್ಪಿಸಿಕೊಟ್ಟವನು.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದಕ್ಕೆ ‘ಒಪ್ಪಿಸಿಕೊಡು’ ಎಂಬ ವ್ಯಾಪಕ ಅರ್ಥವಿದೆ; ಯೂದನ ವಿಷಯದಲ್ಲಿ ಸನ್ನಿವೇಶವು ‘ದ್ರೋಹಿಸಿದ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: ಕಾನಾನೀಯ
  rationale: ಗ್ರೀಕ್ ಪದದ ರೂಪವನ್ನು ಅರ್ಥವಿವರಣೆಯಾಗಿ ಬದಲಿಸದೆ ಕನ್ನಡದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ. ಇದು ಅರಮಾಯಿಕ/ಹೀಬ್ರೂ ಮೂಲದ ಬಿರುದನ್ನು ಪ್ರತಿಬಿಂಬಿಸುವ ಸಾಧ್ಯತೆಯಿದ್ದು, ‘ಉತ್ಸಾಹಿ’ ಎಂಬ ಸಾಮಾನ್ಯ ಅರ್ಥವಿವರಣೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰσκαριώτης
  choice: ಇಸ್ಕರಿಯೋತ
  rationale: ವ್ಯಕ್ತಿಯ ಬಿರುದು ಅಥವಾ ಹೆಸರಿನ ರೂಢಿಯಾದ ಕನ್ನಡ ಲಿಪ್ಯಂತರವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: παραδοὺς
  choice: ದ್ರೋಹದಿಂದ ಒಪ್ಪಿಸಿಕೊಟ್ಟವನು
  rationale: ಮೂಲ ಕ್ರಿಯಾಪದದ ‘ಒಪ್ಪಿಸಿಕೊಡು’ ಎಂಬ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನೂ, ಯೂದನ ಕೃತ್ಯಕ್ಕೆ ಸುವಾರ್ತೆಯ ಸನ್ನಿವೇಶ ನೀಡುವ ದ್ರೋಹದ ಅರ್ಥವನ್ನೂ ಒಟ್ಟಾಗಿ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: ಆತನನ್ನು ದ್ರೋಹದಿಂದ ಒಪ್ಪಿಸಿಕೊಟ್ಟವನೂ ಇವನೇ
  rationale: ನಿರ್ದಿಷ್ಟ ಸೂಚಕದೊಡನೆ ಬಂದ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡದ ಗುರುತಿಸುವ ವಾಕ್ಯಾಂಶವಾಗಿ ನೀಡಲಾಗಿದೆ; καί ಪದದ ಒತ್ತನ್ನು ‘-ನೂ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: παραδοὺς ಅನ್ನು ತಟಸ್ಥವಾಗಿ ‘ಒಪ್ಪಿಸಿಕೊಟ್ಟ’ ಎಂದು ಅನುವಾದಿಸಬೇಕೋ, ದ್ರೋಹದ ಸನ್ನಿವೇಶಾರ್ಥವನ್ನೂ ವ್ಯಕ್ತಪಡಿಸಬೇಕೋ
  choice: ದ್ರೋಹದಿಂದ ಒಪ್ಪಿಸಿಕೊಟ್ಟವನು
  alternative: ಒಪ್ಪಿಸಿಕೊಟ್ಟವನು
  rationale: ಮತ್ತಾಯನ ಕಥನದಲ್ಲಿ ಯೂದನ ಕೃತ್ಯವು ದ್ರೋಹಪೂರ್ವಕವಾಗಿ ಯೇಸುವನ್ನು ಶತ್ರುಗಳ ಕೈಗೆ ಒಪ್ಪಿಸುವುದಾಗಿದೆ. ‘ದ್ರೋಹದಿಂದ ಒಪ್ಪಿಸಿಕೊಟ್ಟ’ ಎಂಬುದು ಆ ಸನ್ನಿವೇಶಾರ್ಥವನ್ನು ತಿಳಿಸುವುದರ ಜೊತೆಗೆ ಮೂಲ ಕ್ರಿಯಾಪದದ ಮೂಲಭೂತ ‘ಒಪ್ಪಿಸಿಕೊಡು’ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಹೆಚ್ಚು ತಟಸ್ಥ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಹೆಸರುಗಳನ್ನು ರೂಢಿಯಾದ ರೀತಿಯಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಿ, ಮೂಲದ ಪಟ್ಟಿಯ ಸಂಕ್ಷಿಪ್ತ ರಚನೆ ಮತ್ತು ಯೂದನನ್ನು ಗುರುತಿಸುವ ಕೊನೆಯ ವಾಕ್ಯಾಂಶವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
