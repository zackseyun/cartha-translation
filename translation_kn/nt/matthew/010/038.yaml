id: MAT.10.38
reference: Matthew 10:38
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: kn
  text: ತನ್ನ ಶಿಲುಬೆಯನ್ನು ಹೊತ್ತುಕೊಂಡು ನನ್ನ ಹಿಂದೆ ಬಾರದವನು ನನಗೆ ಯೋಗ್ಯನಲ್ಲ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ತನ್ನ ಶಿಲುಬೆ’ ಎಂಬುದು ಪ್ರತಿಯೊಬ್ಬ ಶಿಷ್ಯನು ತನ್ನದೇ ಶಿಲುಬೆಯನ್ನು ಹೊತ್ತುಕೊಳ್ಳಬೇಕು ಎಂಬ ಸಾಮಾನ್ಯ ಏಕವಚನ ಅರ್ಥವನ್ನು ಹೊಂದಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ‘ನನ್ನ ಹಿಂದೆ ಬರುವುದು’ ಎಂದರೆ ‘ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸುವುದು.’ ಗ್ರೀಕ್ ಮೂಲವು ‘ನನ್ನ ಹಿಂದೆ’ ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ಬಾರದವನು
  rationale: ಗ್ರೀಕ್‌ನ ಅನಿರ್ದಿಷ್ಟ/ಸಾಮಾನ್ಯ ಸಂಬಂಧವಾಚಕ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಏಕವಚನ ಪ್ರತಿನಿಧಿ ರೂಪದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ನಿಷೇಧವು ಎರಡೂ ಕ್ರಿಯೆಗಳಿಗೆ ಸಂಬಂಧಿಸುವಂತೆ ವಾಕ್ಯವನ್ನು ಕಟ್ಟಲಾಗಿದೆ.
- source_word: λαμβάνει
  choice: ಹೊತ್ತುಕೊಂಡು
  rationale: σταυρός ಜೊತೆಯಲ್ಲಿ ಇದು ಶಿಲುಬೆಯನ್ನು ತನ್ನ ಮೇಲೆ ತೆಗೆದುಕೊಂಡು ಸಾಗುವ ದೃಶ್ಯವನ್ನೂ, ಅದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ದುಃಖ ಮತ್ತು ಅವಮಾನವನ್ನು ಸ್ವೀಕರಿಸುವ ಶಿಷ್ಯತ್ವದ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: σταυρὸν
  choice: ಶಿಲುಬೆಯನ್ನು
  rationale: ರೋಮನ್ ಮರಣದಂಡನೆಯ ಸಾಧನವನ್ನು ಸೂಚಿಸುವ, ಸುವಾರ್ತೆಗಳ ಸಂದರ್ಭದಲ್ಲೂ ಕನ್ನಡ ಕ್ರೈಸ್ತ ಬಳಕೆಯಲ್ಲೂ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಯುವ ಪ್ರಮಾಣಿತ ಪದ.
- source_word: αὐτοῦ
  choice: ತನ್ನ
  rationale: ಕರ್ತೃಗೆ ಹಿಂದಿರುಗಿ ಸೂಚಿಸುವ ಏಕವಚನ ರೂಪ; ಪ್ರತಿಯೊಬ್ಬ ಶಿಷ್ಯನು ತನ್ನದೇ ಶಿಲುಬೆಯನ್ನು ಹೊರುವ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: ನನ್ನ ಹಿಂದೆ ಬಾರದವನು
  rationale: ἀκολουθεῖ ಎಂಬ ಹಿಂಬಾಲಿಸುವ ಕ್ರಿಯೆಯನ್ನೂ ὀπίσω μου ಎಂಬ ‘ನನ್ನ ಹಿಂದೆ’ ಎಂಬ ಸ್ಪಷ್ಟ ಸ್ಥಳಾತ್ಮಕ/ಶಿಷ್ಯತ್ವದ ಸೂಕ್ಷ್ಮತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ನನಗೆ ಯೋಗ್ಯನಲ್ಲ
  rationale: ἄξιος ಜೊತೆಗಿನ μου ಎಂಬ ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಗಂಭೀರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ನನ್ನವನಾಗಲು ಯೋಗ್ಯನಲ್ಲ’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಶಿಲುಬೆಯನ್ನು ಹೊರುವ ಶಿಷ್ಯತ್ವದ ಮಾತು
  choice: ‘ತನ್ನ ಶಿಲುಬೆಯನ್ನು ಹೊತ್ತುಕೊಂಡು’ ಎಂಬ ಸ್ಪಷ್ಟ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಸಂಕಟವನ್ನು ಸ್ವೀಕರಿಸಿ’ ಅಥವಾ ‘ಸ್ವಾರ್ಥತ್ಯಾಗ ಮಾಡಿ’ ಎಂದು ಅರ್ಥವಿವರಣೆಯಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ಮೂಲವು ಶಿಲುಬೆಯ ಐತಿಹಾಸಿಕ, ಅವಮಾನಕರ ಮತ್ತು ಮರಣಸಂಬಂಧಿ ಚಿತ್ರವನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಬಳಸುತ್ತದೆ; ಅದನ್ನು ಅಮೂರ್ತ ಅರ್ಥಕ್ಕೆ ಇಳಿಸುವುದು ಅದರ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಕುಗ್ಗಿಸುತ್ತದೆ.
- issue: αὐτοῦ ಎಂಬ ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಸಾಮಾನ್ಯ ಸೂಚನೆ
  choice: ಕನ್ನಡದ ಪ್ರತಿಬಿಂಬಕ ಏಕವಚನ ‘ತನ್ನ’ ಬಳಸಲಾಗಿದೆ.
  alternative: ‘ತಮ್ಮ’ ಅಥವಾ ‘ತಮ್ಮತಮ್ಮ’ ಎಂಬ ಬಹುವಚನ/ವಿತರಕ ರೂಪ ಬಳಸುವುದು.
  rationale: ‘ತನ್ನ’ ಮೂಲದ ಏಕವಚನ ಪ್ರತಿನಿಧಿ ವಿನ್ಯಾಸವನ್ನು ಉಳಿಸಿ, ಕನ್ನಡದಲ್ಲಿ ಲಿಂಗವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರದೆ ಪ್ರತಿಯೊಬ್ಬ ವ್ಯಕ್ತಿಗೆ ಅನ್ವಯಿಸುವ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- issue: μου ἄξιος ಎಂಬ ಸಂಬಂಧಾತ್ಮಕ ಮೌಲ್ಯನಿರ್ಣಯ
  choice: ‘ನನಗೆ ಯೋಗ್ಯನಲ್ಲ’ ಎಂದು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನನ್ನ ಶಿಷ್ಯನಾಗಲು ಯೋಗ್ಯನಲ್ಲ’ ಅಥವಾ ‘ನನ್ನವನಾಗಲು ಅರ್ಹನಲ್ಲ’ ಎಂದು ವಿಸ್ತರಿಸುವುದು.
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಶಿಷ್ಯತ್ವದ ಅರ್ಥ ಇದ್ದರೂ, ಮೂಲವು ಅದನ್ನು ಸ್ಪಷ್ಟ ಪೂರಕ ಪದಗಳಿಂದ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ; ನೇರ ರೂಪವು ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆ ಮತ್ತು ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ಶಿಲುಬೆ’ ಎಂಬ ಸ್ಥಿರ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿನ [a], [b] ಗುರುತುಗಳು ಸಂಬಂಧಿತ ಅಡಿಕುರಿತಗಳಿಗೆ ಸರಿಯಾಗಿ ಹೊಂದಿವೆ.
