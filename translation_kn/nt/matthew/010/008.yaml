  to: ರೋಗಿಗಳನ್ನು ಗುಣಪಡಿಸಿರಿ; ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿರಿ; ಕುಷ್ಠರೋಗಿಗಳನ್ನು[a] ಶುದ್ಧಪಡಿಸಿರಿ; ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕಿರಿ. ಉಚಿತವಾಗಿ ಪಡೆದಿದ್ದೀರಿ; ಉಚಿತವಾಗಿ ಕೊಡಿರಿ.
