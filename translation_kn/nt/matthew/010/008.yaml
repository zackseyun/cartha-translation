id: MAT.10.8
reference: Matthew 10:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: kn
  text: ರೋಗಿಗಳನ್ನು ಗುಣಪಡಿಸಿರಿ; ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿರಿ; ಕುಷ್ಠರೋಗಿಗಳನ್ನು[a] ಶುದ್ಧಪಡಿಸಿರಿ; ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕಿರಿ. ಉಚಿತವಾಗಿ ಪಡೆದಿದ್ದೀರಿ; ಉಚಿತವಾಗಿ ಕೊಡಿರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಚರ್ಮರೋಗವಿರುವವರನ್ನು.’ ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ‘ಕುಷ್ಠರೋಗಿಗಳು’ ಎಂದು ಭಾಷಾಂತರಿಸುವ ಮೂಲಪದವು ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಆಧುನಿಕ ಕುಷ್ಠರೋಗವನ್ನು ಮಾತ್ರವಲ್ಲದೆ ಗಂಭೀರವಾದ ವಿವಿಧ ಚರ್ಮರೋಗಗಳನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: ರೋಗಿಗಳನ್ನು
  rationale: ಗುಣಪಡಿಸುವ ಸಂದರ್ಭದಲ್ಲಿದು ಅಸ್ವಸ್ಥರಾಗಿರುವವರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ರೋಗಿಗಳನ್ನು’ ಸಹಜವೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆಗಿದೆ.
- source_word: θεραπεύετε
  choice: ಗುಣಪಡಿಸಿರಿ
  rationale: ಅದ್ಭುತ ಸೇವೆಯ ಈ ಸಂದರ್ಭದಲ್ಲಿ θεραπεύω ಎಂದರೆ ರೋಗವನ್ನು ಗುಣಪಡಿಸುವುದು; ಆಜ್ಞಾರ್ಥಕ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: νεκροὺς
  choice: ಸತ್ತವರನ್ನು
  rationale: ἐγείρετε ಎಂಬ ಕ್ರಿಯೆಯ ಕರ್ಮವಾಗಿ ಇದು ಮರಣಹೊಂದಿದ ವ್ಯಕ್ತಿಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐγείρετε
  choice: ಎಬ್ಬಿಸಿರಿ
  rationale: ಇಲ್ಲಿ ನಿದ್ರೆಯಿಂದ ಎಬ್ಬಿಸುವುದಲ್ಲ, ಮರಣದಿಂದ ಎಬ್ಬಿಸುವ ಅರ್ಥವಿದೆ; ಸಂದರ್ಭವು ಅದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: λεπροὺς
  choice: ಕುಷ್ಠರೋಗಿಗಳನ್ನು[a]
  rationale: ಸುವಾರ್ತೆಗಳ ಸಾಂಪ್ರದಾಯಿಕ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಮೂಲಪದವು ಆಧುನಿಕ ಕುಷ್ಠರೋಗಕ್ಕಿಂತ ವಿಶಾಲವಾದ ಚರ್ಮರೋಗಗಳನ್ನು ಸೂಚಿಸಬಹುದೆಂಬುದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
- source_word: καθαρίζετε
  choice: ಶುದ್ಧಪಡಿಸಿರಿ
  rationale: ಈ ಕ್ರಿಯಾಪದವು ದೈಹಿಕ ಗುಣಮುಖತೆಯ ಜೊತೆಗೆ ಧಾರ್ಮಿಕ ಶುದ್ಧತೆಯ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ; ‘ಶುದ್ಧಪಡಿಸಿರಿ’ ಎರಡೂ ಛಾಯೆಗಳನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δαιμόνια
  choice: ದೆವ್ವಗಳನ್ನು
  rationale: ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಸಂದರ್ಭದಲ್ಲಿ ದುಷ್ಟ ಆತ್ಮಿಕ ಜೀವಿಗಳನ್ನು ಸೂಚಿಸುವ ನೇರ ಮತ್ತು ಸಾಮಾನ್ಯ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ἐκβάλλετε
  choice: ಹೊರಗೆ ಓಡಿಸಿರಿ
  rationale: ಬಲವಂತವಾಗಿ ಹೊರಹಾಕುವ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δωρεὰν
  choice: ಉಚಿತವಾಗಿ
  rationale: ಹಣ ಅಥವಾ ಪ್ರತಿಫಲವಿಲ್ಲದೆ ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸಿ, ಎರಡೂ ವಾಕ್ಯಾಂಶಗಳ ವಾಕ್ಚಾತುರ್ಯಪೂರ್ಣ ಸಮಾನಾಂತರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐλάβετε
  choice: ಹೊಂದಿದ್ದೀರಿ
  rationale: ಶಿಷ್ಯರು ಈಗಾಗಲೇ ಪಡೆದಿರುವ ವರಗಳು ಮತ್ತು ಅಧಿಕಾರವನ್ನು ಸೂಚಿಸುವಂತೆ ಕನ್ನಡದ ಸಹಜ ಪೂರ್ಣಕಾಲದ ರೂಪ ಬಳಸಲಾಗಿದೆ.
- source_word: δότε
  choice: ಕೊಡಿರಿ
  rationale: ಮೂಲದ ನೇರ ಬಹುವಚನ ಆಜ್ಞೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಕೊಡಬೇಕಾದ ರೀತಿಯನ್ನು ಮುಂಚಿನ ‘ಉಚಿತವಾಗಿ’ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಅದ್ಭುತ ಕಾರ್ಯಗಳ ಆಜ್ಞೆಗಳ ವ್ಯಾಪ್ತಿ
  choice: ಈ ಸೇವಾ ಭಾಷಣದಲ್ಲಿ ಹನ್ನೆರಡು ಮಂದಿಗೆ ನೀಡಿದ ನೇರ, ವಾಸ್ತವ ಆಜ್ಞೆಗಳಾಗಿ ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
  alternative: ಕೆಲವು ಕಾರ್ಯಗಳನ್ನು ರೂಪಕಗಳಾಗಿಯೇ ಅಥವಾ ಅನಂತರದ ಸಭಾ ಆಚರಣೆಗಳಾಗಿಯೇ ನಿರೂಪಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ನಿರ್ದಿಷ್ಟ ಸೇವಾಕಾರ್ಯಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ನೇರ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕ ರೂಪಗಳನ್ನು ಬಳಸುತ್ತದೆ. ಅವುಗಳ ಅನ್ವಯವನ್ನು ಅನುವಾದದಲ್ಲೇ ಕುಗ್ಗಿಸದೆ ಅಥವಾ ವಿಸ್ತರಿಸದೆ ಪಠ್ಯದ ಐತಿಹಾಸಿಕ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕ ‘-ಿರಿ’ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ಕ್ರಿಯೆಗಳ ಸರಣಿಯಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತತೆ ಮತ್ತು ಸಮಾನಾಂತರ ವಿನ್ಯಾಸವನ್ನು ಕಾಪಾಡಿ, ಕೊನೆಯ ಎರಡು ವಾಕ್ಯಾಂಶಗಳಲ್ಲಿ ‘ಉಚಿತವಾಗಿ’ ಎಂಬ ಪುನರಾವರ್ತನೆಯ ವಾಕ್ಚಾತುರ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
