review_pass:
  verdict: revise
  source_fidelity: The imperative sequence and its objects are conveyed faithfully. However, ‘ಹೊಂದಿದ್ದೀರಿ’ means ‘you possess/have’ rather than translating ἐλάβετε (‘you received’); the source’s received/give antithesis should be explicit. ‘ಹೊರಗೆ ಓಡಿಸಿರಿ’ can suggest making demons run outside rather than expelling them, and is less precise for ἐκβάλλετε.
  naturalness: The respectful plural imperatives and parallel structure are natural modern standard Kannada. ‘ಹೊರಹಾಕಿರಿ’ is more idiomatic and exact in an exorcistic context than ‘ಹೊರಗೆ ಓಡಿಸಿರಿ.’ ‘ಪಡೆದಿದ್ದೀರಿ’ gives a natural, clear rendering of the perfective sense intended in the Kannada sentence.
  terminology: ‘ಗುಣಪಡಿಸಿರಿ,’ ‘ಶುದ್ಧಪಡಿಸಿರಿ,’ and ‘ದೆವ್ವಗಳನ್ನು’ are suitable. Retaining ‘ಕುಷ್ಠರೋಗಿಗಳನ್ನು’ with the supplied cultural footnote responsibly preserves the traditional term while avoiding a false one-to-one identification with modern leprosy.
  issues:
  - severity: medium
    issue: ‘ಉಚಿತವಾಗಿ ಹೊಂದಿದ್ದೀರಿ’ does not explicitly mean ‘freely you received.’
    rationale: ἐλάβετε is ‘you received,’ and the verse deliberately contrasts receiving with giving. ‘ಹೊಂದಿದ್ದೀರಿ’ shifts the sense toward present possession.
  - severity: low
    issue: ‘ದೆವ್ವಗಳನ್ನು ಹೊರಗೆ ಓಡಿಸಿರಿ’ is less precise and less idiomatic than ‘ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕಿರಿ.’
    rationale: ἐκβάλλετε denotes expulsion. ‘ಹೊರಹಾಕಿರಿ’ directly expresses that action without suggesting merely causing them to run outward.
  revised_text: ರೋಗಿಗಳನ್ನು ಗುಣಪಡಿಸಿರಿ; ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿರಿ; ಕುಷ್ಠರೋಗಿಗಳನ್ನು[a] ಶುದ್ಧಪಡಿಸಿರಿ; ದೆವ್ವಗಳನ್ನು ಹೊರಹಾಕಿರಿ. ಉಚಿತವಾಗಿ ಪಡೆದಿದ್ದೀರಿ; ಉಚಿತವಾಗಿ ಕೊಡಿರಿ.
