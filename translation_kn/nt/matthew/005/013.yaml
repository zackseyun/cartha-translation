id: MAT.5.13
reference: Matthew 5:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: kn
  text: “ನೀವೇ ಭೂಮಿಯ ಉಪ್ಪು. ಆದರೆ ಉಪ್ಪು ತನ್ನ ಉಪ್ಪಿನ ರುಚಿಯನ್ನು ಕಳೆದುಕೊಂಡರೆ, ಅದನ್ನು ಯಾವುದರಿಂದ ಉಪ್ಪಾಗಿಸುವರು? ಹೊರಗೆ ಎಸೆಯಲ್ಪಟ್ಟು ಜನರ ಕಾಲಡಿ ತುಳಿಯಲ್ಪಡುವುದಕ್ಕಲ್ಲದೆ ಅದು ಇನ್ನು ಬೇರೆ ಯಾವುದಕ್ಕೂ ಪ್ರಯೋಜನವಾಗುವುದಿಲ್ಲ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ನೀವೇ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಬಂದಿರುವ ಸರ್ವನಾಮದ ಒತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ನೀವೇ’ ಎಂಬ ರೂಪದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: τὸ ἅλας τῆς γῆς
  choice: ಭೂಮಿಯ ಉಪ್ಪು
  rationale: γῆ ಎಂಬುದು ‘ಭೂಮಿ,’ ‘ದೇಶ,’ ಅಥವಾ ‘ನೆಲ’ ಎಂದಾಗಬಹುದು; ಈ ವ್ಯಾಪಕ ರೂಪಕದಲ್ಲಿ ‘ಭೂಮಿ’ ಸಹಜವೂ ಸಂದರ್ಭೋಚಿತವೂ ಆಗಿದೆ.
- source_word: μωρανθῇ
  choice: ತನ್ನ ಉಪ್ಪಿನ ರುಚಿಯನ್ನು ಕಳೆದುಕೊಂಡರೆ
  rationale: ಪದವು ಮೂಲತಃ ‘ಮೂರ್ಖವಾಗು’ ಎಂಬ ಸಂಬಂಧಿತ ಅರ್ಥ ಹೊಂದಿದ್ದರೂ, ಉಪ್ಪಿನ ವಿಷಯದಲ್ಲಿ ಸಪ್ಪೆಯಾಗುವುದು ಅಥವಾ ಉಪ್ಪಿನ ಗುಣ ಕಳೆದುಕೊಳ್ಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಈ ರೂಪಕವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲು ಈ ನಿರೂಪಣೆ ಆಯ್ಕೆಯಾಗಿದೆ.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: ಅದನ್ನು ಯಾವುದರಿಂದ ಮತ್ತೆ ಉಪ್ಪಾಗಿಸುವರು?
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ಕರ್ಮಣಿ ರೂಪವು ಅದನ್ನು ಯಾವ ಸಾಧನದಿಂದ ಉಪ್ಪಾಗಿಸಬಹುದು ಎಂದು ಕೇಳುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸ್ವಾಭಾವಿಕವಾಗಿರಲು ಕರ್ತೃನಿರ್ದಿಷ್ಟವಲ್ಲದ ಬಹುವಚನ ರೂಪ ಬಳಸಲಾಗಿದೆ.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: ಬೇರೆ ಯಾವುದಕ್ಕೂ ಅದು ಇನ್ನು ಪ್ರಯೋಜನಕ್ಕೆ ಬರುವುದಿಲ್ಲ
  rationale: ಇಲ್ಲಿ ἰσχύω ಶಕ್ತಿ ಎಂಬ ನೇರ ಅರ್ಥಕ್ಕಿಂತ ಉಪಯುಕ್ತತೆ ಅಥವಾ ಪರಿಣಾಮಕಾರಿತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: ಹೊರಗೆ ಎಸೆದು ...ುವುದಕ್ಕಲ್ಲದೆ
  rationale: ἔξω ಪದದ ಸ್ಥಳಸೂಚಕ ಅರ್ಥವನ್ನು ‘ಹೊರಗೆ’ ಎಂದು ಉಳಿಸಿ, ಕನ್ನಡ ವಾಕ್ಯರಚನೆಗೆ ತಕ್ಕಂತೆ ಪ್ರಯೋಜನದ ನಿರೂಪಣೆಯೊಂದಿಗೆ ಜೋಡಿಸಲಾಗಿದೆ.
- source_word: καταπατεῖσθαι
  choice: ಕಾಲಿನಿಂದ ತುಳಿಯುವುದು
  rationale: ಮೇಲೆ ನಡೆದು ತುಳಿಯುವ ಸಜೀವ ಚಿತ್ರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: ಜನರು
  rationale: ἄνθρωποι ಇಲ್ಲಿ ಪುರುಷರಿಗೆ ಮಾತ್ರವಲ್ಲ, ಸಾಮಾನ್ಯವಾಗಿ ಮನುಷ್ಯರಿಗೆ ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ಜನರು’ ಮೂಲದ ಸಾಮಾನ್ಯ ಮಾನವ ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ಕೊಡುತ್ತದೆ.
theological_decisions:
- issue: ὑπὸ τῶν ἀνθρώπων ಎಂಬ ಸಾಮಾನ್ಯ ಮಾನವಸೂಚಕ ಪದಪ್ರಯೋಗ
  choice: ಜನರು
  alternative: ಮನುಷ್ಯರು
  rationale: ಗ್ರೀಕ್ ಪದವು ಈ ಸಂದರ್ಭದಲ್ಲಿ ಲಿಂಗನಿರ್ದಿಷ್ಟವಲ್ಲದೆ ಮನುಷ್ಯರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಜನರು’ ಆ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಪುರುಷರನ್ನು ಮಾತ್ರ ಸೂಚಿಸುವಂತೆ ಭಾಷಾಂತರಿಸುವುದು ಮೂಲಕ್ಕಿಂತ ಅರ್ಥವನ್ನು ಕಿರಿದಾಗಿಸುತ್ತದೆ.
- issue: ಉಪ್ಪು ‘ಮೂರ್ಖವಾಗುವುದು’ ಮತ್ತು ರುಚಿ ಕಳೆದುಕೊಳ್ಳುವುದು ಎಂಬ ಪದಾಟ
  choice: ತನ್ನ ಉಪ್ಪಿನ ರುಚಿಯನ್ನು ಕಳೆದುಕೊಂಡರೆ
  alternative: ಸಪ್ಪೆಯಾದರೆ
  rationale: ಸಂದರ್ಭದ ಮುಖ್ಯ ಅರ್ಥ ಉಪ್ಪಿನ ಗುಣ ಅಥವಾ ರುಚಿ ಕಳೆದುಹೋಗುವುದು. ‘ಮೂರ್ಖವಾದರೆ’ ಎಂಬ ನೇರ ವ್ಯುತ್ಪತ್ತಿಪರ ರೂಪ ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗಿ, ಉದ್ದೇಶಿಸದ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಹುಟ್ಟಿಸಬಹುದು; ‘ಸಪ್ಪೆಯಾದರೆ’ ಸಂಕ್ಷಿಪ್ತವಾದರೂ ಉಪ್ಪಿನ ವೈಶಿಷ್ಟ್ಯವನ್ನು ಅಷ್ಟಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಮೂಲದ ರೂಪಕ, ಪ್ರಶ್ನೆ, ಮತ್ತು ಉಪಯೋಗಹೀನತೆಯ ತೀಕ್ಷ್ಣ ಚಿತ್ರವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
