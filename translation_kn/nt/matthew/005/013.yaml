review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic address, the earth-wide salt metaphor, salt losing its proper quality, the rhetorical question, and the final image of rejection and trampling. However, ‘ಮತ್ತೆ’ (‘again’) is not explicit in ἐν τίνι ἁλισθήσεται and may be omitted. The closing construction is also clearer when the two Greek passive actions are represented as passive in Kannada.
  naturalness: Most of the verse is fluent modern standard Kannada. ‘ಬೇರೆ ಯಾವುದಕ್ಕೂ ಅದು ಇನ್ನು ಪ್ರಯೋಜನಕ್ಕೆ ಬರುವುದಿಲ್ಲ’ is understandable but slightly cumbersome, and ‘ಹೊರಗೆ ಎಸೆದು ಜನರು ಕಾಲಿನಿಂದ ತುಳಿಯುವುದಕ್ಕಲ್ಲದೆ’ can momentarily suggest that the salt itself throws something out. A passive construction makes the sequence idiomatic and unambiguous.
  terminology: ‘ನೀವೇ,’ ‘ಭೂಮಿಯ ಉಪ್ಪು,’ ‘ಉಪ್ಪಿನ ರುಚಿಯನ್ನು ಕಳೆದುಕೊಂಡರೆ,’ and ‘ಜನರು’ are suitable, accurate modern Kannada choices. ‘ಜನರು’ correctly preserves the generic force of ἀνθρώπων without imposing male specificity.
  issues:
  - severity: medium
    issue: The word ‘ಮತ್ತೆ’ is added in the rhetorical question.
    rationale: The Greek asks ‘with what will it be salted?’ While restoration is contextually inferable, ‘again’ is not stated and is unnecessary in Kannada.
  - severity: medium
    issue: The final clause does not clearly mark both actions as happening to the salt.
    rationale: βληθέν and καταπατεῖσθαι portray the salt as thrown outside and trampled by people. Passive Kannada wording prevents a temporary syntactic ambiguity and better reflects the source.
