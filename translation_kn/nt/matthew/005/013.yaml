revisions:
- from: “ನೀವೇ ಭೂಮಿಯ ಉಪ್ಪು. ಆದರೆ ಉಪ್ಪು ತನ್ನ ಉಪ್ಪಿನ ರುಚಿಯನ್ನು ಕಳೆದುಕೊಂಡರೆ, ಅದನ್ನು ಯಾವುದರಿಂದ ಮತ್ತೆ ಉಪ್ಪಾಗಿಸುವರು? ಅದನ್ನು ಹೊರಗೆ ಎಸೆದು ಜನರು ಕಾಲಿನಿಂದ ತುಳಿಯುವುದಕ್ಕಲ್ಲದೆ ಬೇರೆ ಯಾವುದಕ್ಕೂ ಅದು ಇನ್ನು ಪ್ರಯೋಜನಕ್ಕೆ ಬರುವುದಿಲ್ಲ.”
  to: “ನೀವೇ ಭೂಮಿಯ ಉಪ್ಪು. ಆದರೆ ಉಪ್ಪು ತನ್ನ ಉಪ್ಪಿನ ರುಚಿಯನ್ನು ಕಳೆದುಕೊಂಡರೆ, ಅದನ್ನು ಯಾವುದರಿಂದ ಉಪ್ಪಾಗಿಸುವರು? ಹೊರಗೆ ಎಸೆಯಲ್ಪಟ್ಟು ಜನರ ಕಾಲಡಿ ತುಳಿಯಲ್ಪಡುವುದಕ್ಕಲ್ಲದೆ ಅದು ಇನ್ನು ಬೇರೆ ಯಾವುದಕ್ಕೂ ಪ್ರಯೋಜನವಾಗುವುದಿಲ್ಲ.”
  rationale: 'The revision removes an unstated ‘again’ and recasts the final phrase with natural Kannada passives, preserving the Greek sequence: useless except to be thrown outside and trampled by people. No footnote is needed because ‘ಜನರು’ naturally communicates the generic human reference of ἀνθρώπων.'
  reviewer_model: gpt-5.6-terra
