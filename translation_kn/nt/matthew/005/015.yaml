  to: ಜನರು ದೀಪವನ್ನು ಹಚ್ಚಿ ಅದನ್ನು ಅಳತೆಯ ಪಾತ್ರೆಯ ಕೆಳಗೆ[a] ಇಡುವುದಿಲ್ಲ; ಬದಲಾಗಿ ದೀಪದ ನಿಲುವಿನ ಮೇಲೆ ಇಡುತ್ತಾರೆ; ಆಗ ಅದು ಮನೆಯಲ್ಲಿರುವ ಎಲ್ಲರಿಗೂ ಬೆಳಕು ಕೊಡುತ್ತದೆ.[b]
