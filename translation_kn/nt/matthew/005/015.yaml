id: MAT.5.15
reference: Matthew 5:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: kn
  text: ಜನರು ದೀಪವನ್ನು ಹಚ್ಚಿ ಅದನ್ನು ಅಳತೆಯ ಪಾತ್ರೆಯ ಕೆಳಗೆ[a] ಇಡುವುದಿಲ್ಲ; ಬದಲಾಗಿ ದೀಪದ ನಿಲುವಿನ ಮೇಲೆ ಇಡುತ್ತಾರೆ; ಆಗ ಅದು ಮನೆಯಲ್ಲಿರುವ ಎಲ್ಲರಿಗೂ ಬೆಳಕು ಕೊಡುತ್ತದೆ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅಳತೆಯ ಬುಟ್ಟಿಯ ಕೆಳಗೆ.’ ಗ್ರೀಕ್‌ನ μόδιος ಎಂಬುದು ಒಣ ಪದಾರ್ಥಗಳ ಒಂದು ಅಳತೆಯನ್ನೂ, ಆ ಅಳತೆಗೆ ಬಳಸುವ ಪಾತ್ರೆಯನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಅದು ಮನೆಯಲ್ಲಿರುವ ಎಲ್ಲರಿಗೂ ಪ್ರಕಾಶಿಸುತ್ತದೆ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ಹಾಗೆಯೇ ... ಇಡುವುದಿಲ್ಲ
  rationale: ಈ ವಾಕ್ಯವನ್ನು ಹಿಂದಿನ ನಕಾರಾತ್ಮಕ ಉದಾಹರಣೆಗೆ ಜೋಡಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಹಾಗೆಯೇ’ ಎಂಬುದು ಸಂಪರ್ಕವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: καίουσιν λύχνον
  choice: ದೀಪವನ್ನು ಹಚ್ಚಿ
  rationale: λύχνος ಇಲ್ಲಿ ಅಮೂರ್ತ ಬೆಳಕಲ್ಲ, ಎಣ್ಣೆದೀಪದಂಥ ಸ್ಪಷ್ಟ ವಸ್ತು; ಕನ್ನಡದಲ್ಲಿ ‘ದೀಪ ಹಚ್ಚುವುದು’ ಸಹಜ ನುಡಿಗಟ್ಟು.
- source_word: τιθέασιν αὐτὸν
  choice: ಅದನ್ನು ... ಇಡುವುದಿಲ್ಲ
  rationale: ಸರಳ ಕ್ರಿಯೆಯನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಸರ್ವನಾಮವು ದೀಪವನ್ನೇ ಸೂಚಿಸುವಂತೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὑπὸ τὸν μόδιον
  choice: ಅಳತೆಯ ಬುಟ್ಟಿಯ ಕೆಳಗೆ
  rationale: μόδιος ಒಣ ಪದಾರ್ಥಗಳ ಅಳತೆಗೂ ಆ ಅಳತೆಯ ಪಾತ್ರೆಗೂ ಸೂಚಕ. ‘ಅಳತೆಯ ಬುಟ್ಟಿ’ ಮೂಲದ ಸಾಂಸ್ಕೃತಿಕ ಚಿತ್ರವನ್ನು ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: ದೀಪಸ್ತಂಭದ ಮೇಲೆ
  rationale: λυχνία ದೀಪವನ್ನು ಇಡುವ ಆಧಾರ ಅಥವಾ ನಿಲುವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ದೀಪಸ್ತಂಭ’ ಸಂಕ್ಷಿಪ್ತವೂ ಗೌರವಯುತವೂ ಆಗಿದೆ.
- source_word: λάμπει
  choice: ಬೆಳಕು ಕೊಡುತ್ತದೆ
  rationale: ಪದಶಃ ‘ಪ್ರಕಾಶಿಸುತ್ತದೆ’ ಎಂದೂ ಸಾಧ್ಯ; ಇಲ್ಲಿ ಮನೆಯಲ್ಲಿರುವವರಿಗೆ ದೀಪದಿಂದ ದೊರೆಯುವ ಬೆಳಕಿನ ಕಾರ್ಯವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: ಮನೆಯಲ್ಲಿರುವ ಎಲ್ಲರಿಗೂ
  rationale: πᾶσιν ಎಂಬ ಸಮಗ್ರ ವ್ಯಾಪ್ತಿಯನ್ನೂ οἰκίᾳ ಎಂಬ ಸ್ಥಳಾರ್ಥವನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದ ಸಾಮಾನ್ಯ ತೃತೀಯ ಪುರುಷ ಬಹುವಚನ ಕರ್ತೃ
  choice: ಜನರು
  alternative: ಯಾರೂ
  rationale: καίουσιν ಮತ್ತು τιθέασιν ಎಂಬ ಬಹುವಚನ ಕ್ರಿಯಾಪದಗಳು ಸಾಮಾನ್ಯ ಮಾನವ ಆಚರಣೆಯನ್ನು ಸೂಚಿಸುತ್ತವೆ. ‘ಜನರು’ ಎಂಬುದು ಆ ಗಾದೆಸ್ವರೂಪದ ಸಾಮಾನ್ಯತೆಯನ್ನು ಉಳಿಸಿ, ಅಸ್ಪಷ್ಟವಾದ ‘ಅವರು’ ಎಂಬ ರೂಪವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- issue: λάμπει ಪದದ ಕಾರ್ಯಾತ್ಮಕ ಅಥವಾ ಪದಶಃ ನಿರೂಪಣೆ
  choice: ಬೆಳಕು ಕೊಡುತ್ತದೆ
  alternative: ಪ್ರಕಾಶಿಸುತ್ತದೆ
  rationale: ಎರಡೂ ಅರ್ಥಸಮ್ಮತ. ದತ್ತಿವಿಭಕ್ತಿಯಲ್ಲಿರುವ ‘ಎಲ್ಲರಿಗೂ’ ಎಂಬುದರೊಂದಿಗೆ ದೀಪದ ಪ್ರಯೋಜನವನ್ನು ಸಹಜವಾಗಿ ಹೇಳಲು ‘ಬೆಳಕು ಕೊಡುತ್ತದೆ’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ; ಪರ್ಯಾಯವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ. ಮೂಲದ ಗಾದೆಸ್ವರೂಪ ಮತ್ತು ದೀಪದ ಸ್ಪಷ್ಟ ಚಿತ್ರವನ್ನು ಉಳಿಸಲಾಗಿದೆ; [a], [b] ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
