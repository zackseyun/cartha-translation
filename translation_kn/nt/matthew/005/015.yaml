review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the lamp, its concealment under a μόδιος, its placement on a λυχνία, and its illumination of everyone in the house. However, ‘ಹಾಗೆಯೇ’ is not an adequate rendering of οὐδέ in this negative, continuing illustration: it more naturally means ‘likewise’ and can weaken or misstate the negative connective. The adversative ἀλλά is better represented explicitly as ‘ಬದಲಾಗಿ.’'
  naturalness: Most wording is clear modern Kannada. ‘ಅಳತೆಯ ಪಾತ್ರೆ’ is broader and more accurate than ‘ಅಳತೆಯ ಬುಟ್ಟಿ,’ since μόδιος denotes a dry measure and, by extension, its container, not necessarily a woven basket. ‘ದೀಪದ ನಿಲುವು’ is a natural functional rendering of λυχνία and avoids the potentially over-specific image of a tall pillar in ‘ದೀಪಸ್ತಂಭ.’
  terminology: ‘ದೀಪ,’ ‘ಬೆಳಕು ಕೊಡುತ್ತದೆ,’ and ‘ಮನೆಯಲ್ಲಿರುವ ಎಲ್ಲರಿಗೂ’ are suitable and preserve the concrete image and universal scope. The footnote for [b] should use natural Kannada while retaining ‘ಪ್ರಕಾಶಿಸುತ್ತದೆ’ as the lexical alternative for λάμπει.
  issues:
  - severity: medium
    issue: ‘ಹಾಗೆಯೇ’ does not faithfully convey οὐδέ.
    rationale: In this context οὐδέ continues the preceding negation (‘nor/neither’). ‘ಹಾಗೆಯೇ’ normally means ‘likewise/in the same way’ and does not itself carry that negative connective force. Omitting it is preferable to using a misleading positive linker in a self-contained Kannada verse.
  - severity: low
    issue: The contrast marked by ἀλλά is not explicit.
    rationale: A semicolon separates the clauses, but ‘ಬದಲಾಗಿ’ clearly preserves the Greek ‘but/rather’ contrast.
  - severity: low
    issue: ‘ಅಳತೆಯ ಬುಟ್ಟಿ’ is narrower than μόδιος.
    rationale: The Greek may refer to the measuring container generally. ‘ಅಳತೆಯ ಪಾತ್ರೆ’ preserves this breadth; the basket wording can remain as a footnote alternative.
  revised_text: ಜನರು ದೀಪವನ್ನು ಹಚ್ಚಿ ಅದನ್ನು ಅಳತೆಯ ಪಾತ್ರೆಯ ಕೆಳಗೆ[a] ಇಡುವುದಿಲ್ಲ; ಬದಲಾಗಿ ದೀಪದ ನಿಲುವಿನ ಮೇಲೆ ಇಡುತ್ತಾರೆ; ಆಗ ಅದು ಮನೆಯಲ್ಲಿರುವ ಎಲ್ಲರಿಗೂ ಬೆಳಕು ಕೊಡುತ್ತದೆ.[b]
