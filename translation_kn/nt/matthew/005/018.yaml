id: MAT.5.18
reference: Matthew 5:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: kn
  text: 'ಏಕೆಂದರೆ ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಆಕಾಶವೂ ಭೂಮಿಯೂ ಅಳಿದುಹೋಗುವ ತನಕ, ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಒಂದು ಇಯೋಟ ಅಕ್ಷರವೂ[a] ಅಥವಾ ಒಂದು ಸಣ್ಣ ಗೆರೆಯೂ[b] ಖಂಡಿತವಾಗಿಯೂ ಅಳಿದುಹೋಗುವುದಿಲ್ಲ—ಎಲ್ಲವೂ ಸಂಭವಿಸುವ ತನಕ.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಇಯೋಟ’ ಗ್ರೀಕ್ ವರ್ಣಮಾಲೆಯ ಅತಿ ಸಣ್ಣ ಅಕ್ಷರದ ಹೆಸರು; ಇಲ್ಲಿ ಅತಿ ಚಿಕ್ಕ ಅಕ್ಷರ ಎಂಬ ಅರ್ಥ.
    reason: lexical_alternative
  - marker: b
    text: ಅಂದರೆ, ಅಕ್ಷರಗಳನ್ನು ಒಂದರಿಂದೊಂದು ಭೇದಿಸುವ ಅತಿ ಚಿಕ್ಕ ಲಿಖಿತ ಗುರುತು.
    reason: lexical_alternative
  - marker: c
    text: 'ಅಥವಾ: “ಎಲ್ಲವೂ ನೆರವೇರುವ ತನಕ” / “ಎಲ್ಲವೂ ನಡೆದುಹೋಗುವ ತನಕ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: ನಿಜವಾಗಿ
  rationale: ಯೇಸುವಿನ ಗಂಭೀರ ಮತ್ತು ಅಧಿಕಾರಯುತ ದೃಢೋಕ್ತಿಯ ಸ್ವರವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಹೇಳಿಕೆಗೆ ವಿವರಣಾತ್ಮಕ ಆಧಾರ ನೀಡುವ ಗ್ರೀಕ್ ಸಂಯೋಜಕದ ಕಾರ್ಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ... ಹೇಳುತ್ತೇನೆ
  rationale: ಮೂಲದ ನೇರ ಹಾಗೂ ಅಧಿಕಾರಯುತ ಮಾತಿನ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ಆಕಾಶವೂ ಭೂಮಿಯೂ ಅಳಿದುಹೋಗುವ ತನಕ
  rationale: ಭವಿಷ್ಯದ ಮಿತಿಯನ್ನು ಸೂಚಿಸುವ ರಚನೆಯನ್ನೂ ಬ್ರಹ್ಮಾಂಡವ್ಯಾಪಿ ಜೋಡಿಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἰῶτα ἓν
  choice: ಒಂದು ಇಯೋಟ ಅಕ್ಷರವೂ
  rationale: ಮೂಲವು ಹೆಸರಿಸುವ ಅತಿ ಸಣ್ಣ ಅಕ್ಷರದ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸಿ, ‘ಅಕ್ಷರ’ ಎಂಬ ವಿವರಣೆಯಿಂದ ಕನ್ನಡ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ ಮಾಡುತ್ತದೆ.
- source_word: μία κεραία
  choice: ಒಂದು ಸಣ್ಣ ಗೆರೆಯೂ
  rationale: ಅಕ್ಷರಗಳನ್ನು ಭೇದಿಸುವ ಅತಿ ಚಿಕ್ಕ ಲಿಖಿತ ಗುರುತು ಅಥವಾ ಚುಕ್ಕಾಣಿ-ಗೆರೆಯ ಚಿತ್ರವನ್ನು ಸರಳ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: οὐ μὴ παρέλθῃ
  choice: ಖಂಡಿತವಾಗಿಯೂ ಅಳಿದುಹೋಗುವುದಿಲ್ಲ
  rationale: οὐ μή ರಚನೆಯ ಪ್ರಬಲ ನಿರಾಕರಣೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀπὸ τοῦ νόμου
  choice: ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ದೇವರ ಲಿಖಿತ ಶಾಸನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಾಮಾನ್ಯ ಕಾನೂನು ಎಂಬ ಅರ್ಥಕ್ಕಿಂತ ಶಾಸ್ತ್ರೀಯ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἕως ἂν πάντα γένηται
  choice: ಎಲ್ಲವೂ ಸಂಭವಿಸುವ ತನಕ
  rationale: γίνομαι ಪದದ ‘ಸಂಭವಿಸು/ನಡೆಯು’ ಎಂಬ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ‘ನೆರವೇರಿಸು’ ಎಂಬ ಒಂದೇ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: νόμος ಎಂಬ ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ಧರ್ಮಶಾಸ್ತ್ರ
  alternative: ಮೋಶೆಯ ಧರ್ಮಶಾಸ್ತ್ರ; ವಿಸ್ತೃತ ಅರ್ಥದಲ್ಲಿ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಶಾಸ್ತ್ರ
  rationale: ಮತ್ತಾಯ 5:17–19ರ ಸಂದರ್ಭದಲ್ಲಿ ಇದು ದೇವರ ಲಿಖಿತ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಅನುವಾದವು ಅದರ ವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಪಂಚಗ್ರಂಥಕ್ಕೆ ಮಾತ್ರ ಅಥವಾ ಸಂಪೂರ್ಣ ಹಳೆಯ ಒಡಂಬಡಿಕೆಗೆ ವಿಸ್ತರಿಸದೆ ಸಂದರ್ಭದ ಒತ್ತಡವನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: πάντα γένηται ಎಂಬುದರ ಬಲ
  choice: ಎಲ್ಲವೂ ಸಂಭವಿಸುವ ತನಕ
  alternative: ಎಲ್ಲವೂ ನೆರವೇರುವ ತನಕ; ಎಲ್ಲವೂ ನಡೆದುಹೋಗುವ ತನಕ
  rationale: ವಾಕ್ಯವು ಸಂಭವಿಸುವಿಕೆ ಮತ್ತು ಪೂರ್ಣಸಾಧನೆ ಎರಡರ ಛಾಯೆಯನ್ನೂ ಹೊಂದಿರಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯವು ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಾಮಾನ್ಯ ಪೂರ್ಣಸಾಧನೆಯ ಓದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗಂಭೀರವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ. ಮೂಲದ ಪುನರಾವರ್ತಿತ ‘ತನಕ’ ರಚನೆ, ಪ್ರಬಲ ನಿರಾಕರಣೆ ಮತ್ತು ಅಂತ್ಯದ ಅರ್ಥಸಂದಿಗ್ಧತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
