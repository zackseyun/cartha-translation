  source_fidelity: The beatitude structure, causal relation, possessive promise, and ‘kingdom of heaven’ are retained. However, ‘ಹಿಂಸೆಗೆ ಒಳಗಾದವರು’ can more broadly mean people subjected to violence; ‘ಹಿಂಸಿಸಲ್ಪಟ್ಟವರು’ more directly represents the Greek perfect passive participle δεδιωγμένοι (‘those who have been persecuted’).
  naturalness: The sentence is clear and appropriately elevated in modern standard Kannada. ‘ನೀತಿಯ ನಿಮಿತ್ತ’ is natural in a formal beatitude register, and ‘ಅವರದೇ’ effectively conveys the possessive emphasis.
  terminology: ‘ಧನ್ಯರು,’ ‘ನೀತಿ,’ and ‘ಪರಲೋಕರಾಜ್ಯ’ are suitable established Christian-register terms. The footnote appropriately preserves ‘ನ್ಯಾಯ’ as a plausible lexical alternative without making it the main reading.
  issues:
  - severity: medium
    issue: ‘ಹಿಂಸೆಗೆ ಒಳಗಾದವರು’ is semantically broader than persecution.
    rationale: It may be understood as having suffered violence generally, whereas δεδιωγμένοι specifically denotes people who have been persecuted. ‘ಹಿಂಸಿಸಲ್ಪಟ್ಟವರು’ is a direct and natural passive rendering that also retains the completed/resultative sense sufficiently.
