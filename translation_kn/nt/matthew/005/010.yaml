id: MAT.5.10
reference: Matthew 5:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: kn
  text: ನೀತಿಯ ನಿಮಿತ್ತ ಹಿಂಸಿಸಲ್ಪಟ್ಟವರು ಧನ್ಯರು[a]; ಏಕೆಂದರೆ ಪರಲೋಕರಾಜ್ಯವು ಅವರದೇ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನ್ಯಾಯದ ನಿಮಿತ್ತ.’ ಗ್ರೀಕ್ ಪದವು ನೈತಿಕ ಸಜ್ಜನಿಕೆ ಮತ್ತು ನ್ಯಾಯ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಹೊಂದಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ಧನ್ಯರು
  rationale: ಆಶೀರ್ವಾದದ ಘೋಷಣಾತ್ಮಕ ಹಾಗೂ ದೇವರ ಅನುಗ್ರಹಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಅರ್ಥವನ್ನು ಉಳಿಸುವ, ಕನ್ನಡದ ಧಾರ್ಮಿಕ ಬಳಕೆಯಲ್ಲಿ ಸಹಜವಾದ ಪದ.
- source_word: οἱ δεδιωγμένοι
  choice: ಹಿಂಸೆಗೆ ಒಳಗಾದವರು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಹಿಂಸೆಯನ್ನು ಅನುಭವಿಸಿ ಆ ಸ್ಥಿತಿಯಲ್ಲಿರುವವರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἕνεκεν
  choice: ನಿಮಿತ್ತ
  rationale: ಹಿಂಸೆಗೆ ಕಾರಣವಾದ ಸಂಗತಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುವ, dignified ಆದರೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಪ್ರಯೋಗ.
- source_word: δικαιοσύνης
  choice: ನೀತಿ
  rationale: ದೇವರ ಚಿತ್ತಕ್ಕೆ ಹೊಂದುವ ಸರಿಯಾದ ನಡತೆ ಮತ್ತು ನ್ಯಾಯ ಎಂಬ ಎರಡೂ ಅರ್ಥವಲಯಗಳಿಗೆ ಅವಕಾಶಕೊಡುವ ಕನ್ನಡ ಪದ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಧನ್ಯವಚನಕ್ಕೆ ಆಧಾರವಾದ ಕಾರಣವನ್ನು ನೇರವಾಗಿ ಪರಿಚಯಿಸುತ್ತದೆ.
- source_word: αὐτῶν
  choice: ಅವರದೇ
  rationale: ಸ್ವಾಮ್ಯವನ್ನು ಒತ್ತಿಹೇಳುವ αὐτῶν ಎಂಬ ರೂಪವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾಗಿಯೂ ದೇವರ ಪರಲೋಕೀಯ ಆಳ್ವಿಕೆಯ ಅರ್ಥದೊಂದಿಗೆ ಸಹಜವಾಗಿಯೂ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: δικαιοσύνη ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ನೀತಿ
  alternative: ನ್ಯಾಯ
  rationale: ಇಲ್ಲಿ ದೇವರ ಚಿತ್ತಕ್ಕೆ ಅನುಗುಣವಾದ ಸರಿ ನಡತೆ ಪ್ರಧಾನವಾಗಿದ್ದರೂ, ಸಾಮಾಜಿಕ ಅಥವಾ ನ್ಯಾಯಸಂಬಂಧಿ ಆಯಾಮವೂ ಗ್ರೀಕ್ ಪದದಲ್ಲಿದೆ. ಮುಖ್ಯಪಾಠದಲ್ಲಿ ‘ನೀತಿ’ಯನ್ನು ಇಟ್ಟು, ‘ನ್ಯಾಯ’ವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಧನ್ಯವಚನ ಶೈಲಿ. ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ಪರಿಚಿತ ಸಂಯುಕ್ತ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ; ವಾಕ್ಯದ ಕಾರಣಾತ್ಮಕ ಸಂಬಂಧ ಮತ್ತು ಸ್ವಾಮ್ಯದ ಒತ್ತು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
