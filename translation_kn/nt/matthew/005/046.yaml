id: MAT.5.46
reference: Matthew 5:46
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: kn
  text: ಏಕೆಂದರೆ ನಿಮ್ಮನ್ನು ಪ್ರೀತಿಸುವವರನ್ನೇ ನೀವು ಪ್ರೀತಿಸಿದರೆ, ನಿಮಗೆ ಯಾವ ಪ್ರತಿಫಲ ಸಿಗುತ್ತದೆ?[a] ಸುಂಕ ವಸೂಲಿಗಾರರೂ ಅದನ್ನೇ ಮಾಡುವುದಿಲ್ಲವೇ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಿಮಗೆ ಯಾವ ಕೂಲಿ ಸಿಗುತ್ತದೆ?” ಗ್ರೀಕ್ ಪದಕ್ಕೆ “ಕೂಲಿ” ಅಥವಾ “ಪ್ರತಿಫಲ” ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ಇಲ್ಲಿ ಅದು ಯೇಸುವಿನ ಬೋಧನೆಯ ಸಂದರ್ಭದಲ್ಲಿ ದೊರೆಯುವ ಪ್ರತಿದಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ಏಕೆಂದರೆ ... ಮಾಡಿದರೆ
  rationale: γάρ ಹಿಂದಿನ ಮಾತಿಗೆ ಕಾರಣಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἐάν ಷರತ್ತನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಈ ಎರಡನ್ನೂ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀγαπήσητε
  choice: ನೀವು ಪ್ರೀತಿಸಿದರೆ
  rationale: ἐάν ಜೊತೆಯಲ್ಲಿರುವ aorist subjunctive ಸಾಮಾನ್ಯ ಷರತ್ತನ್ನು ರೂಪಿಸುತ್ತದೆ; ಕನ್ನಡದ ಷರತ್ತು ರೂಪವು ಅದನ್ನು ನೈಸರ್ಗಿಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: ನಿಮ್ಮನ್ನು ಪ್ರೀತಿಸುವವರನ್ನೇ
  rationale: Substantival participle ಅನ್ನು ವ್ಯಕ್ತಿಗಳ ಗುಂಪಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ. ‘-ಏ’ ಒತ್ತು ಪರಸ್ಪರ ಪ್ರೀತಿಗೆ ಮಾತ್ರ ಸೀಮಿತವಾದ ಸ್ಥಿತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: τίνα μισθὸν ἔχετε
  choice: ನಿಮಗೆ ಯಾವ ಪ್ರತಿಫಲ ಸಿಗುತ್ತದೆ?
  rationale: μισθόςಗೆ ಕೂಲಿ ಅಥವಾ ಪ್ರತಿಫಲ ಎಂಬ ಅರ್ಥಗಳಿವೆ. ಈ ನೀತಿಬೋಧನೆಯ ಸಂದರ್ಭದಲ್ಲಿ ‘ಪ್ರತಿಫಲ’ ಸೂಕ್ತ; ‘ἔχετε’ಯನ್ನು ಶಬ್ದಶಃ ‘ಹೊಂದಿದ್ದೀರಿ’ ಎನ್ನುವುದಕ್ಕಿಂತ ಕನ್ನಡದಲ್ಲಿ ‘ಸಿಗುತ್ತದೆ’ ಸಹಜವಾಗಿದೆ.
- source_word: οὐχὶ καὶ
  choice: '...ರೂ ... ಮಾಡುವುದಿಲ್ಲವೇ?'
  rationale: οὐχί ದೃಢವಾದ ಹೌದು ಎಂಬ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ; ‘-ರೂ’ καίಯ ‘ಸಹ/ಕೂಡ’ ಎಂಬ ಒತ್ತನ್ನು ಸಹಜವಾಗಿ ತರುತ್ತದೆ.
- source_word: οἱ τελῶναι
  choice: ಸುಂಕ ವಸೂಲಿಗಾರರು
  rationale: τελώναι ತೆರಿಗೆ ಮತ್ತು ಸುಂಕಗಳನ್ನು ವಸೂಲಿಸುವವರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸುಂಕ ವಸೂಲಿಗಾರರು’ ಐತಿಹಾಸಿಕ ಪಾತ್ರವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: ಅದನ್ನೇ ಮಾಡುತ್ತಾರೆ
  rationale: ‘ಅದೇ ಕಾರ್ಯವನ್ನು ಮಾಡುವುದು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ನೈಸರ್ಗಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ನೀತಿಬೋಧನೆಯಲ್ಲಿ μισθός ಪದದ ಅರ್ಥ
  choice: ಪ್ರತಿಫಲ
  alternative: ಕೂಲಿ
  rationale: ‘ಪ್ರತಿಫಲ’ ದೈವಿಕ ಮೆಚ್ಚುಗೆ ಅಥವಾ ಪ್ರತಿದಾನ ಎಂಬ ಸಂದರ್ಭೋಚಿತ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಯಾಂತ್ರಿಕ ಪುಣ್ಯಸಂಪಾದನೆಯ ಸಿದ್ಧಾಂತವನ್ನು ಹೇರದು. ‘ಕೂಲಿ’ ಎಂಬ ನೇರ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ವಾಕ್ಯರಚನೆ. ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯ ನಿರೀಕ್ಷಿತ ಉತ್ತರ ಮತ್ತು ಮೂಲದ ತಾರ್ಕಿಕ ಸಂಪರ್ಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
