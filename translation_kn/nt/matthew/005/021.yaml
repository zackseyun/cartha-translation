revisions:
- from: “‘ಕೊಲೆ ಮಾಡಬಾರದು; ಕೊಲೆ ಮಾಡುವವನು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಗುರಿಯಾಗುವನು’ ಎಂದು ಪೂರ್ವಕಾಲದವರಿಗೆ[a] ಹೇಳಲಾಗಿತ್ತು ಎಂಬುದನ್ನು ನೀವು ಕೇಳಿದ್ದೀರಿ.
  to: ‘ಕೊಲೆ ಮಾಡಬಾರದು; ಕೊಲೆ ಮಾಡುವವನು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಗುರಿಯಾಗುವನು’ ಎಂದು ಪೂರ್ವಕಾಲದ ಜನರಿಗೆ[a] ಹೇಳಲಾಗಿತ್ತು ಎಂಬುದನ್ನು ನೀವು ಕೇಳಿದ್ದೀರಿ.
