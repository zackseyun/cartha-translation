id: MAT.5.21
reference: Matthew 5:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: kn
  text: ‘ಕೊಲೆ ಮಾಡಬಾರದು; ಕೊಲೆ ಮಾಡುವವನು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಗುರಿಯಾಗುವನು’ ಎಂದು ಪೂರ್ವಕಾಲದ ಜನರಿಗೆ[a] ಹೇಳಲಾಗಿತ್ತು ಎಂಬುದನ್ನು ನೀವು ಕೇಳಿದ್ದೀರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಹಿಂದಿನ ಕಾಲದ ಜನರಿಗೆ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: ನೀವು ಕೇಳಿದ್ದೀರಿ
  rationale: ಸಭಿಕರು ಸ್ವೀಕರಿಸಿ ತಿಳಿದಿರುವ ಹಿಂದಿನ ಬೋಧನೆಯನ್ನು ಸೂಚಿಸುವ ಈ ಪ್ರವಚನಸೂತ್ರಕ್ಕೆ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: ἐρρέθη
  choice: ಹೇಳಲಾಗಿತ್ತು
  rationale: ಹೇಳಿದವರು ಯಾರು ಎಂದು ಪಠ್ಯವು ಸ್ಪಷ್ಟಪಡಿಸದಿರುವುದರಿಂದ ಕರ್ಮಣಿ ಪ್ರಯೋಗವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τοῖς ἀρχαίοις
  choice: ಪೂರ್ವಕಾಲದವರಿಗೆ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಸ್ವೀಕರ್ತೃ ಅರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಹಿಂದಿನ ಕಾಲದ ಜನರನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: Οὐ φονεύσεις
  choice: ಕೊಲೆ ಮಾಡಬಾರದು
  rationale: φονεύω ಸಾಮಾನ್ಯವಾಗಿ ಜೀವ ತೆಗೆಯುವುದಕ್ಕಿಂತ ನಿರ್ದಿಷ್ಟವಾಗಿ ಕೊಲೆ ಮಾಡುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಆಜ್ಞೆಯ ನಿಷೇಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: ಕೊಲೆ ಮಾಡುವವನು
  rationale: ἄν ಜೊತೆಯ ಅನಿರ್ದಿಷ್ಟ ಸಾಮಾನ್ಯ ಷರತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಾಮಾನ್ಯೀಕೃತ ರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: ನ್ಯಾಯತೀರ್ಪಿಗೆ ಗುರಿಯಾಗುವನು
  rationale: ಕಾನೂನುಸಂಬಂಧಿ ಹೊಣೆಗಾರಿಕೆ ಮತ್ತು ತೀರ್ಪಿಗೆ ಒಳಪಡುವ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; κρίσις ಅನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಮಾನವ ನ್ಯಾಯಾಲಯವೆಂದೋ ಅಂತಿಮ ಖಂಡನೆಯೆಂದೋ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಆರನೆಯ ಆಜ್ಞೆಯ ಉಲ್ಲೇಖದಲ್ಲಿ φονεύω ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ಕೊಲೆ ಮಾಡಬಾರದು
  alternative: ಸಾಯಿಸಬಾರದು / ಕೊಲ್ಲಬಾರದು
  rationale: ಗ್ರೀಕ್ φονεύω ಅನಧಿಕೃತವಾಗಿ ಜೀವ ತೆಗೆಯುವ ‘ಕೊಲೆ’ಯನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಎಲ್ಲ ವಿಧದ ಜೀವಹರಣವನ್ನೂ ಒಳಗೊಂಡಂತೆ ಮೂಲಪಠ್ಯದ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿಸ್ತರಿಸಬಾರದು.
- issue: τῇ κρίσει ಸೂಚಿಸುವ ನ್ಯಾಯಿಕ ವಲಯ
  choice: ನ್ಯಾಯತೀರ್ಪಿಗೆ
  alternative: ನ್ಯಾಯಾಲಯಕ್ಕೆ / ಖಂಡನೆಗೆ
  rationale: ಮೂಲಪಠ್ಯದಲ್ಲಿರುವ ನ್ಯಾಯಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅದು ನಿರ್ದಿಷ್ಟ ಸ್ಥಳೀಯ ನ್ಯಾಯಾಲಯವೋ ಅಂತಿಮ ಖಂಡನೆಯೋ ಎಂಬುದನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ಗ್ರೀಕ್‌ನ ಒಂದೇ ಸ್ವೀಕೃತ ಬೋಧನಾ ಘಟಕವನ್ನು ಒಳಗಿನ ಏಕ ಉದ್ಧರಣವಾಗಿ, ಅರ್ಧವಿರಾಮದೊಂದಿಗೆ ನೀಡಲಾಗಿದೆ. ‘ಪೂರ್ವಿಕರಿಗೆ’ ಎಂಬ ಪದವು ವಂಶಪಾರಂಪರ್ಯ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸಬಹುದಾದ್ದರಿಂದ ‘ಪೂರ್ವಕಾಲದವರಿಗೆ’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
