id: MAT.5.7
reference: Matthew 5:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: kn
  text: ಕರುಣೆಯುಳ್ಳವರು ಧನ್ಯರು; ಏಕೆಂದರೆ ಅವರಿಗೇ ಕರುಣೆ ತೋರಿಸಲಾಗುವುದು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅವರು ಕರುಣೆಯನ್ನು ಹೊಂದುವರು.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇದು ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ಕ್ರಿಯಾಪದವಾಗಿದೆ.
    reason: ಕರ್ಮಣಿ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುವ ಪರ್ಯಾಯ ಸಹಜ ಅನುವಾದವನ್ನು ನೀಡಲು.
lexical_decisions:
- source_word: μακάριοι
  choice: ಧನ್ಯರು
  rationale: ದೇವರ ಅನುಗ್ರಹ ಮತ್ತು ನಿಜವಾದ ಹಿತಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಆಶೀರ್ವಚನದ ಸ್ಥಿರವಾದ, ಗೌರವಯುತ ಪದ; ಕೇವಲ ಮನೋಭಾವದ ಸಂತೋಷವನ್ನು ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: οἱ ἐλεήμονες
  choice: ಕರುಣೆಯುಳ್ಳವರು
  rationale: ಲೇಖಸಹಿತ ಗುಣವಾಚಕವು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದೆ. ಈ ಆಯ್ಕೆ ಕರುಣೆ ತೋರಿಸುವವರನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸಿ, ಮುಂದಿನ ಕ್ರಿಯಾಪದದಲ್ಲಿರುವ ಕರುಣೆಯ ಅರ್ಥಸಂಬಂಧವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಆಶೀರ್ವಾದಕ್ಕೆ ಕಾರಣ ಅಥವಾ ಆಧಾರವನ್ನು ಪರಿಚಯಿಸುವ ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡ ಸಂಯೋಜಕ.
- source_word: αὐτοὶ
  choice: ಅವರಿಗೇ
  rationale: ಗ್ರೀಕ್ ಸರ್ವನಾಮದ ಒತ್ತನ್ನು ‘-ಏ’ ಪ್ರತ್ಯಯದ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸಿ, ಕರುಣೆಯುಳ್ಳವರಿಗೂ ಅವರು ಪಡೆಯುವ ಕರುಣೆಗೂ ಇರುವ ಅನುರೂಪತೆಯನ್ನು ಎತ್ತಿಹಿಡಿಯುತ್ತದೆ.
- source_word: ἐλεηθήσονται
  choice: ಕರುಣೆ ತೋರಿಸಲಾಗುವುದು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಕರುಣೆಯನ್ನು ತೋರಿಸುವ ಕರ್ತೃ ಯಾರು ಎಂಬುದನ್ನು ಪಠ್ಯದಂತೆಯೇ ಹೇಳದೆ ಬಿಡುತ್ತದೆ.
theological_decisions:
- issue: ವಾಗ್ದಾನಿಸಲಾದ ಕರುಣೆಯ ಕರ್ತೃ
  choice: ‘ಕರುಣೆ ತೋರಿಸಲಾಗುವುದು’ ಎಂದು ಕರ್ತೃವನ್ನು ಹೆಸರಿಸದೆ ಕರ್ಮಣಿ ರೂಪದಲ್ಲಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ದೇವರು ಅವರಿಗೆ ಕರುಣೆ ತೋರಿಸುವನು’ ಅಥವಾ ‘ಅವರು ಕರುಣೆಯನ್ನು ಹೊಂದುವರು.’
  rationale: ಸಂದರ್ಭವು ದೇವರ ಕರುಣೆಯನ್ನು ಬಲವಾಗಿ ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್ ಪಠ್ಯವು ಕರ್ತೃವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅನುವಾದವು ಆ ಅಸ್ಪಷ್ಟತೆಯನ್ನೂ ದೇವರನ್ನು ಸೂಚಿಸಬಹುದಾದ ದೈವಿಕ ಕರ್ಮಣಿಯ ಸಾಧ್ಯತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ, ಗೌರವಯುತ ಆಶೀರ್ವಚನ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಧನ್ಯರು’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅತಿಯಾದ ಪುರಾತನ ಅಥವಾ ಪಂಥೀಯ ಭಾಷೆಯನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
