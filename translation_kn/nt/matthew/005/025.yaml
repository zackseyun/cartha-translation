id: MAT.5.25
reference: Matthew 5:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: kn
  text: ನೀನು ನಿನ್ನ ದೂರುಗಾರನೊಂದಿಗೆ ದಾರಿಯಲ್ಲಿರುವಾಗಲೇ, ಅವನ ಬಗ್ಗೆ ಬೇಗನೆ ಸದುದ್ದೇಶ ಹೊಂದಿರು[a]. ಇಲ್ಲವಾದರೆ ದೂರುಗಾರನು ನಿನ್ನನ್ನು ನ್ಯಾಯಾಧೀಶನಿಗೆ ಒಪ್ಪಿಸಬಹುದು; ನ್ಯಾಯಾಧೀಶನು ನಿನ್ನನ್ನು ಅಧಿಕಾರಿಗೆ ಒಪ್ಪಿಸಬಹುದು; ಆಗ ನೀನು ಸೆರೆಮನೆಗೆ ಹಾಕಲ್ಪಡುವೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಈ ಕಾನೂನು ಸನ್ನಿವೇಶದಲ್ಲಿ ಹೆಚ್ಚು ನುಡಿಗಟ್ಟಾಗಿ, ‘ನಿನ್ನ ದೂರುಗಾರನೊಂದಿಗೆ ಬೇಗನೆ ರಾಜಿ ಮಾಡಿಕೋ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: ಸದುದ್ದೇಶವುಳ್ಳವನಾಗಿರು
  rationale: ‘ಇರು’ ಎಂಬ ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯೆಯೊಂದಿಗೆ ವರ್ತಮಾನ ಕೃದಂತವು ಸೇರಿ ನಿರಂತರ ಮನೋಭಾವ ಅಥವಾ ನಡೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಆಯ್ಕೆ ಕಾನೂನುಬದ್ಧ ಒಪ್ಪಂದವನ್ನು ನೇರವಾಗಿ ಸೇರಿಸದೆ, εὐνοέω ಪದದ ‘ಅನುಕೂಲ ಮನೋಭಾವ ಹೊಂದಿರು’ ಎಂಬ ಮೂಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: ದೂರುಗಾರ / ದೂರುಗಾರನು
  rationale: ನ್ಯಾಯಾಧೀಶ, ಅಧಿಕಾರಿ ಮತ್ತು ಸೆರೆಮನೆ ಎಂಬ ಪದಗಳು ಕಾನೂನು ಸನ್ನಿವೇಶವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ. ‘ದೂರುಗಾರ’ ಸಾಮಾನ್ಯ ವಿರೋಧಿಗಿಂತ ನ್ಯಾಯಾಂಗದಲ್ಲಿನ ಎದುರುಪಕ್ಷದ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ταχὺ
  choice: ಬೇಗನೆ
  rationale: ಆಜ್ಞೆಯ ತುರ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: ನೀನು ನಿನ್ನ ದೂರುಗಾರನೊಂದಿಗೆ ದಾರಿಯಲ್ಲಿರುವಾಗಲೇ
  rationale: ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗುವ ದಾರಿ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಸೇರಿಸದೆ, ಒಟ್ಟಿಗೆ ದಾರಿಯಲ್ಲಿರುವ ಮೂಲ ದೃಶ್ಯವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಆಗಲೇ’ ಲಭ್ಯವಿರುವ ಅವಕಾಶದ ಮಿತಿಯನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
- source_word: μήποτέ
  choice: ಇಲ್ಲವಾದರೆ ...ಬಹುದು
  rationale: ಕನ್ನಡದಲ್ಲಿ ಎಚ್ಚರಿಕೆಯ ಸಾಧ್ಯತೆಯನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಗ್ರೀಕ್‌ನ μήποτεಯ ಅನಿಶ್ಚಿತ ಎಚ್ಚರಿಕೆಬಲವನ್ನು ಕಟ್ಟುನಿಟ್ಟಾದ ಅನಿವಾರ್ಯ ಫಲವಾಗಿ ಪರಿವರ್ತಿಸುವುದಿಲ್ಲ.
- source_word: παραδῷ
  choice: ಒಪ್ಪಿಸಬಹುದು
  rationale: ನ್ಯಾಯಾಂಗದ ಅಧಿಕಾರ ಸರಣಿಯಲ್ಲಿ ಒಬ್ಬರ ವಶಕ್ಕೆ ಮತ್ತೊಬ್ಬರನ್ನು ಹಸ್ತಾಂತರಿಸುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: κριτῇ / κριτὴς
  choice: ನ್ಯಾಯಾಧೀಶ
  rationale: ಕಾನೂನು ಸನ್ನಿವೇಶದಲ್ಲಿ κριτήςಗೆ ಪ್ರಮಾಣಿತ ಮತ್ತು ಸ್ಪಷ್ಟ ಕನ್ನಡ ಪದ.
- source_word: ὑπηρέτῃ
  choice: ಅಧಿಕಾರಿ
  rationale: ನ್ಯಾಯಾಧೀಶನ ಆದೇಶವನ್ನು ಜಾರಿಗೊಳಿಸುವ ಅಧೀನ ನ್ಯಾಯಾಂಗ ಸಿಬ್ಬಂದಿಯನ್ನು ಸೂಚಿಸಲು ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ಸಹಜ ಪದ; ನಿರ್ದಿಷ್ಟ ಆಧುನಿಕ ಹುದ್ದೆಯನ್ನು ಅನಾವಶ್ಯಕವಾಗಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: εἰς φυλακὴν
  choice: ಸೆರೆಮನೆಗೆ
  rationale: ಗಂಭೀರ ನ್ಯಾಯಾಂಗ ಬಂಧನವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಗೌರವಪೂರ್ಣ ಕನ್ನಡ ಪದ.
- source_word: βληθήσῃ
  choice: ತಳ್ಳಲ್ಪಡುವೆ
  rationale: βάλλω ಕ್ರಿಯೆಯ ಜೀವಂತ ಬಲವನ್ನು ‘ಹಾಕಲ್ಪಡುವೆ’ಗಿಂತ ಹೆಚ್ಚು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಆರಂಭದ ಆಜ್ಞೆಯನ್ನು ಕಾನೂನುಬದ್ಧ ರಾಜಿ ಮಾಡಿಕೊಳ್ಳುವಂತೆ ಅರ್ಥಾನುವಾದಿಸಬೇಕೋ ಅಥವಾ ಎದುರುಪಕ್ಷದ ಕಡೆಗಿನ ಅನುಕೂಲ ಮನೋಭಾವವಾಗಿ ಉಳಿಸಬೇಕೋ ಎಂಬುದು
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಅವನ ಕಡೆಗೆ ಸದುದ್ದೇಶವುಳ್ಳವನಾಗಿರು’ ಎಂದು εὐνοέω ಪದದ ಮೂಲ ಮನೋಭಾವದ ಅರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನಿನ್ನ ದೂರುಗಾರನೊಂದಿಗೆ ಬೇಗನೆ ಒಪ್ಪಂದಕ್ಕೆ ಬಾ’ ಅಥವಾ ‘ಬೇಗನೆ ರಾಜಿ ಮಾಡಿಕೋ.’
  rationale: ಕಾನೂನು ಸನ್ನಿವೇಶದಲ್ಲಿ ರಾಜಿ ಅಥವಾ ಒಪ್ಪಂದದ ಅರ್ಥವು ಸಾಧ್ಯವಾದರೂ, ಮೂಲ ಪದವು ನೇರವಾಗಿ ಅನುಕೂಲ ಮನೋಭಾವ ಅಥವಾ ಸದ್ಭಾವವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ವಿಶಾಲವಾದ ಕಾನೂನುಬದ್ಧ ಪರಿಣಾಮವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಸದುದ್ದೇಶವುಳ್ಳವನಾಗಿರು’ ಸ್ವಲ್ಪ ಔಪಚಾರಿಕವಾದರೂ ಮೂಲದ ಅರ್ಥವನ್ನು ಕಾಪಾಡುತ್ತದೆ; ಹೆಚ್ಚು ನುಡಿಗಟ್ಟಾದ ಕಾನೂನು ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ. ಪುರುಷ ಏಕವಚನ ಸಂಬೋಧನೆಯನ್ನು ‘ನೀನು’ ರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
