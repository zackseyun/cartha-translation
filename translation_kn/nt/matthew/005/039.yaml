id: MAT.5.39
reference: Matthew 5:39
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: kn
  text: 'ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ: ಕೆಟ್ಟವನನ್ನು ಎದುರಿಸಬೇಡಿ.[a] ಬದಲಾಗಿ, ಯಾರಾದರೂ ನಿನ್ನ ಬಲ ಕೆನ್ನೆಗೆ ಬಾರಿಸಿದರೆ, ಇನ್ನೊಂದು ಕೆನ್ನೆಯನ್ನೂ ಅವನ ಕಡೆಗೆ ತಿರುಗಿಸು.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ ‘ಕೆಟ್ಟದ್ದನ್ನು ಎದುರಿಸಬೇಡಿ’; ಮತ್ತೊಂದು ಸಾಧ್ಯತೆ: ‘ದುಷ್ಟನನ್ನು ಎದುರಿಸಬೇಡಿ.’'
    reason: alternative_reading
  - marker: b
    text: ಅಕ್ಷರಶಃ, ‘ಇನ್ನೊಂದನ್ನೂ ಅವನ ಕಡೆಗೆ ತಿರುಗಿಸು.’ ಸಂದರ್ಭದಿಂದ ‘ಇನ್ನೊಂದು ಕೆನ್ನೆ’ ಎಂದು ಅರ್ಥ.
    reason: source_clarity
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: ಎದುರಿಸಬೇಡಿ
  rationale: ἀνθίστημι ಎಂಬುದರ ‘ವಿರುದ್ಧ ನಿಲ್ಲು, ಎದುರಿಸು’ ಎಂಬ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಇದನ್ನು ಕೇವಲ ಪ್ರತೀಕಾರ ಮಾಡದಿರುವುದು ಅಥವಾ ಕಾನೂನುಬದ್ಧ ವಿರೋಧ ಎಂದು ಅನಗತ್ಯವಾಗಿ ಸಂಕುಚಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: τῷ πονηρῷ
  choice: ಕೆಟ್ಟವನನ್ನು
  rationale: ಲೇಖಸಹಿತ ವಿಶೇಷಣವು ನಪುಂಸಕವಾಗಿ ‘ಕೆಟ್ಟದ್ದನ್ನು/ಕೆಡುಕನ್ನು’, ಸಾಮಾನ್ಯ ಪುಲ್ಲಿಂಗವಾಗಿ ‘ಕೆಟ್ಟವನನ್ನು’, ಅಥವಾ ‘ದುಷ್ಟನನ್ನು’ ಸೂಚಿಸಬಹುದು. ಮುಂದಿನ ಮಾನವ ಆಕ್ರಮಣಕಾರನ ಉದಾಹರಣೆ ಇಲ್ಲಿ ಸಾಮಾನ್ಯ ವ್ಯಕ್ತಿಸೂಚಕ ಅರ್ಥಕ್ಕೆ ಒಲವು ನೀಡುತ್ತದೆ.
- source_word: ῥαπίζει
  choice: ಹೊಡೆದರೆ
  rationale: ῥαπίζω ಕೈಯಿಂದ, ವಿಶೇಷವಾಗಿ ಕೆನ್ನೆಗೆ, ಹೊಡೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಕೆನ್ನೆಗೆ ಹೊಡೆ’ ಸಹಜವಾಗಿದ್ದು, ಅವಮಾನಕರ ಪ್ರಹಾರದ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: ನಿನ್ನ ಬಲಗೆನ್ನೆಗೆ
  rationale: σιαγών ದವಡೆ ಅಥವಾ ಕೆನ್ನೆ ಎಂದಾಗಬಹುದು; ಹೊಡೆಯುವ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಕೆನ್ನೆ’ ಸಹಜ ಕನ್ನಡ ಪದ. εἰς ಅನ್ನು ಇಲ್ಲಿ ‘-ಗೆ’ ಸಮರ್ಪಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: ಇನ್ನೊಂದು ಕೆನ್ನೆಯನ್ನೂ ಅವನ ಕಡೆಗೆ ತಿರುಗಿಸು
  rationale: στρέφω ಎಂಬ ‘ತಿರುಗಿಸು’ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಸಂದರ್ಭದಿಂದ ‘ಇನ್ನೊಂದು’ ಎಂದರೆ ಇನ್ನೊಂದು ಕೆನ್ನೆ ಎಂಬುದು ಸ್ಪಷ್ಟವಾದರೂ, ಕನ್ನಡದಲ್ಲಿ ಸಹಜತೆ ಮತ್ತು ಸ್ಪಷ್ಟತೆಗಾಗಿ ‘ಕೆನ್ನೆ’ಯನ್ನು ಪುನರುಕ್ತಿಸಿದೆ.
- source_word: ὅστις
  choice: ಯಾರಾದರೂ … ಹೊಡೆದರೆ
  rationale: ಈ ಷರತ್ತುಸಮಾನ ರಚನೆಯಲ್ಲಿ ಅನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δέಯ ವಿರೋಧಾರ್ಥವನ್ನು ‘ಆದರೆ’ ಉಳಿಸುತ್ತದೆ; ಈ ಸೂತ್ರದಲ್ಲಿರುವ ಯೇಸುವಿನ ಅಧಿಕಾರಯುತ ಹೇಳಿಕೆಯ ಸ್ವರವನ್ನು ಗೌರವಪೂರ್ಣ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: τῷ πονηρῷ ಎಂಬುದರ ಅರ್ಥ
  choice: 'ವ್ಯಕ್ತಿಸೂಚಕ ಸಾಮಾನ್ಯ ಅರ್ಥ: ‘ಕೆಟ್ಟವನನ್ನು’'
  alternative: 'ಅಮೂರ್ತ ಅರ್ಥ: ‘ಕೆಟ್ಟದ್ದನ್ನು/ಕೆಡುಕನ್ನು’; ನಿರ್ದಿಷ್ಟ ವ್ಯಕ್ತಿಸೂಚಕ ಅರ್ಥ: ‘ದುಷ್ಟನನ್ನು’'
  rationale: ವ್ಯಾಕರಣದ ದೃಷ್ಟಿಯಿಂದ ಪದಬಂಧವು ನಿಜವಾಗಿಯೂ ಬಹುಅರ್ಥಕವಾಗಿದೆ. ತಕ್ಷಣದ ಉದಾಹರಣೆಯು ಹೊಡೆಯುವ ಮಾನವ ವ್ಯಕ್ತಿಯನ್ನು ಕುರಿತಿರುವುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಕೆಟ್ಟವನನ್ನು’ ಬಳಸಲಾಗಿದೆ; ಉಳಿದ ಸಾಧ್ಯತೆಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಬಹುವಚನ ಶ್ರೋತೃಗಳಿಗೆ ‘ನಿಮಗೆ/ಎದುರಿಸಬೇಡಿ’ ಮತ್ತು ಉದಾಹರಣೆಯ ಏಕವಚನ ವ್ಯಕ್ತಿಗೆ ‘ನಿನ್ನ/ತಿರುಗಿಸು’ ಎಂಬ ಗ್ರೀಕ್ ಸಂಖ್ಯಾಭೇದವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
