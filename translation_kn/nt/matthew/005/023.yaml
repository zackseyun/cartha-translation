id: MAT.5.23
reference: Matthew 5:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ನೀನು ನಿನ್ನ ಕಾಣಿಕೆಯನ್ನು ಬಲಿಪೀಠದ ಮೇಲೆ ಅರ್ಪಿಸುತ್ತಿರುವಾಗ ಅಲ್ಲಿ ನಿನ್ನ ಸಹೋದರನಿಗೆ ನಿನ್ನ ವಿರುದ್ಧ ಏನಾದರೂ ಇದೆ ಎಂದು ನಿನಗೆ ನೆನಪಾದರೆ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ನಿನ್ನ ಸಹೋದರ ಅಥವಾ ಸಹೋದರಿ’; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ‘ಸಹೋದರ’ ಎಂದಿದೆ. ಸಂದರ್ಭಾನುಸಾರ ಈ ಪದವು ಪ್ರತಿನಿಧಿಕವಾಗಿ ಬಳಕೆಯಾಗಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ಆದ್ದರಿಂದ ... ಆದರೆ
  rationale: οὖν ಹಿಂದಿನ ಬೋಧನೆಯಿಂದ ಬರುವ ನಿರ್ಣಯವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದ್ದರಿಂದ’ ಎಂದು, ἐὰν ಷರತ್ತನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವಾಕ್ಯಾಂತ್ಯದ ‘ಆದರೆ’ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: ನೀನು ನಿನ್ನ ಕಾಣಿಕೆಯನ್ನು ... ಅರ್ಪಿಸುತ್ತಿರುವಾಗ
  rationale: προσφέρῃς ಅರ್ಪಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ದೃಶ್ಯವು ನಡೆಯುತ್ತಿರುವ ಕ್ರಿಯೆಯನ್ನು ಜೀವಂತವಾಗಿ ಚಿತ್ರಿಸುವುದರಿಂದ ‘ಅರ್ಪಿಸುತ್ತಿರುವಾಗ’ ಸಹಜವಾಗಿದೆ. δῶρον ಅನ್ನು ಆರಾಧನಾ ಸಂದರ್ಭಕ್ಕೆ ಸೂಕ್ತವಾದ ‘ಕಾಣಿಕೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: ಯಜ್ಞವೇದಿಯ ಮೇಲೆ
  rationale: θυσιαστήριον ಬಲಿಯರ್ಪಣೆಯ ವೇದಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἐπί + accusative ಕಾಣಿಕೆಯನ್ನು ವೇದಿಯ ಮೇಲೆ ಅರ್ಪಿಸುವ ದಿಕ್ಕು/ಸ್ಥಳವನ್ನು ವ್ಯಕ್ತಪಡಿಸುವುದರಿಂದ ‘ಮೇಲೆ’ ಮೂಲದ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: κἀκεῖ μνησθῇς
  choice: ಅಲ್ಲಿ ... ನಿನಗೆ ನೆನಪಾದರೆ
  rationale: κἀκεῖಯ ಸ್ಥಳಸೂಚಕ ಒತ್ತನ್ನು ‘ಅಲ್ಲಿ’ ಉಳಿಸುತ್ತದೆ. μνησθῇς ಅನ್ನು ನೆನಪು ಉಂಟಾಗುವುದನ್ನು ಅತಿವ್ಯಾಖ್ಯಾನಿಸದೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ನಿನಗೆ ನೆನಪಾದರೆ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ὁ ἀδελφός σου
  choice: ನಿನ್ನ ಸಹೋದರನಿಗೆ
  rationale: ἀδελφός ಪುಲ್ಲಿಂಗ ಏಕವಚನವಾಗಿರುವುದರಿಂದ ಮೂಲರೂಪಕ್ಕೆ ನಿಷ್ಠವಾಗಿ ‘ಸಹೋದರ’ ಬಳಸಲಾಗಿದೆ; ಸಂದರ್ಭದಲ್ಲಿನ ಪ್ರತಿನಿಧಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: ἔχει τι κατὰ σοῦ
  choice: ನಿನ್ನ ವಿರುದ್ಧ ಏನೋ ಇದೆ
  rationale: ಈ ನುಡಿಗಟ್ಟು ಯಾರಿಗಾದರೂ ಮತ್ತೊಬ್ಬರ ವಿರುದ್ಧ ದೂರು ಅಥವಾ ಅಸಮಾಧಾನ ಇರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಏನೋ’ ಎಂಬುದು τιಯ ಉದ್ದೇಶಿತ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἀδελφός ಎಂಬ ಲಿಂಗಸೂಚಿತ ಬಂಧುತ್ವಪದ
  choice: ನಿನ್ನ ಸಹೋದರ
  alternative: ನಿನ್ನ ಸಹೋದರ ಅಥವಾ ಸಹೋದರಿ; ಸಹವಿಶ್ವಾಸಿ
  rationale: ಗ್ರೀಕ್ ಪದವು ಪುಲ್ಲಿಂಗ ಏಕವಚನವಾಗಿದೆ. ಅದರ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಸಂದರ್ಭಾನುಸಾರ ಅದು ಪ್ರತಿನಿಧಿಕವಾಗಿ ಬಳಕೆಯಾಗಿರಬಹುದೆಂಬುದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸುವುದು ಮೂಲದ ನಿಖರತೆಯನ್ನೂ ವಿಶಾಲ ಅನ್ವಯವನ್ನೂ ಸಮತೋಲನಗೊಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಗೌರವಯುತ ಶೈಲಿ. ಏಕವಚನದ ‘ನೀನು’ ರೂಪವು ಗ್ರೀಕ್‌ನ ದ್ವಿತೀಯ ಪುರುಷ ಏಕವಚನವನ್ನು ಉಳಿಸುತ್ತದೆ. ವಾಕ್ಯವು ಮುಂದಿನ ವಚನದಲ್ಲಿ ಪೂರ್ಣಗೊಳ್ಳುವ ಷರತ್ತುಬದ್ಧ ರಚನೆಯಾಗಿರುವುದರಿಂದ ಅಂತ್ಯದಲ್ಲಿ ಅಲ್ಪವಿರಾಮ ಉಳಿಸಲಾಗಿದೆ.
