id: MAT.5.20
reference: Matthew 5:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ನಿಮ್ಮ ನೀತಿಯು ಶಾಸ್ತ್ರಿಗಳ ಮತ್ತು ಫರಿಸಾಯರ ನೀತಿಗಿಂತ ಮಿಗಿಲಾಗದಿದ್ದರೆ[a], ನೀವು ಪರಲೋಕರಾಜ್ಯವನ್ನು ಖಂಡಿತವಾಗಿಯೂ ಪ್ರವೇಶಿಸುವುದಿಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ನ್ಯಾಯ.’ ಗ್ರೀಕ್ ಪದವು ‘ನೀತಿ’ ಮತ್ತು ‘ನ್ಯಾಯ’ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳನ್ನು ಸೂಚಿಸಬಲ್ಲದು; ಮತ್ತಾಯ 5ರ ಸಂದರ್ಭದಲ್ಲಿ ‘ನೀತಿ’ ಎಂಬುದು ಹೆಚ್ಚು ಸೂಕ್ತವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ಏಕೆಂದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: γάρನ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನೂ λέγωನ ನೇರ ಸಂಬೋಧನೆಯನ್ನೂ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐὰν μὴ
  choice: ಹೆಚ್ಚಾಗಿರದಿದ್ದರೆ
  rationale: ನಕಾರಾತ್ಮಕ ಅಗತ್ಯ ಷರತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಇದು περισσεύσῃ ಜೊತೆಗೆ ಒಟ್ಟಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: περισσεύσῃ ... πλεῖον
  choice: ನೀತಿಗಿಂತ ಹೆಚ್ಚಾಗಿರದಿದ್ದರೆ
  rationale: ಹೋಲಿಕೆಯಲ್ಲಿ ಪ್ರಮಾಣ ಅಥವಾ ಗುಣವು ಮೀರಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಹೋಲಿಕೆಯ ಆಧಾರವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ನೀತಿಗಿಂತ’ ಎಂದು ಪುನರುಕ್ತಿಸಲಾಗಿದೆ.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: ನಿಮ್ಮ ನೀತಿ
  rationale: ‘ನೀತಿ’ ಎಂಬುದು δικαιοσύνηಯ ಸರಿಯಾದ ನಡತೆ, ಧಾರ್ಮಿಕ ಸತ್ಯನಿಷ್ಠೆ ಮತ್ತು ನ್ಯಾಯಸಂಬಂಧಿತ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಹೊರುತ್ತದೆ; ಸಂದರ್ಭದಲ್ಲಿದು ಬದುಕಿನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವ ದೇವರಿಗೆ ಒಪ್ಪಿಗೆಯಾದ ಸರಿತನವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: γραμματέων
  choice: ಶಾಸ್ತ್ರಿಗಳ
  rationale: ಯೆಹೂದ್ಯ ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧಿಕೃತ ಪರಿಣತರನ್ನು ಸೂಚಿಸುವ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದ; ‘ಧರ್ಮಶಾಸ್ತ್ರ ಬೋಧಕರು’ಗಿಂತ ಕಡಿಮೆ ವಿವರಣಾತ್ಮಕ ಮತ್ತು ಮೂಲಪದಕ್ಕೆ ಹತ್ತಿರವಾಗಿದೆ.
- source_word: Φαρισαίων
  choice: ಫರಿಸಾಯರ
  rationale: ಗುಂಪಿನ ಹೆಸರಿನ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ಲಿಪ್ಯಂತರ.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ಖಂಡಿತವಾಗಿಯೂ ಪ್ರವೇಶಿಸುವುದಿಲ್ಲ
  rationale: οὐ μήಯ ಬಲವಾದ ನಿರಾಕರಣೆಯನ್ನು ಅತಿಪುರಾತನ ಶೈಲಿಯಿಲ್ಲದೆ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯವನ್ನು
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ, ಸಹಜವಾದ ಸಮಾನಾರ್ಥಕ; ಬಹುವಚನ ‘ಆಕಾಶಗಳು’ ಎಂದು ಯಾಂತ್ರಿಕವಾಗಿ ಅನುವಾದಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: δικαιοσύνη ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ನೀತಿ
  alternative: ನ್ಯಾಯ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಶಾಸ್ತ್ರಿಗಳ ಮತ್ತು ಫರಿಸಾಯರಿಗಿಂತ ಮಿಗಿಲಾದ ದೇವರಿಗೆ ಒಪ್ಪಿಗೆಯಾದ ಜೀವನ ಮತ್ತು ಸರಿಯಾದ ನಡತೆಯೇ ಪ್ರಧಾನವಾಗಿದೆ. ಆದರೂ ಮೂಲಪದವು ‘ನ್ಯಾಯ’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಹೊಂದಬಲ್ಲದು; ಆ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ಹೋಲಿಕೆಯ ವಿಷಯ
  choice: ನಿಮ್ಮ ನೀತಿಯನ್ನು ಶಾಸ್ತ್ರಿಗಳ ಮತ್ತು ಫರಿಸಾಯರ ನೀತಿಯೊಂದಿಗೆ ಹೋಲಿಸುವುದು
  alternative: ಶಿಷ್ಯರು ವ್ಯಕ್ತಿಗಳಾದ ಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರಿಗಿಂತ ಹೆಚ್ಚಾಗುವುದು
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ περισσεύσῃಯ ಕರ್ತೃ ‘ನಿಮ್ಮ ನೀತಿ’; ಆದ್ದರಿಂದ ಹೋಲಿಕೆಯ ಅಳತೆ ಅವರ ನೀತಿಯಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ನೀತಿ’ಯ ಪುನರುಕ್ತಿ ಈ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ‘ಶಾಸ್ತ್ರಿಗಳು,’ ‘ಫರಿಸಾಯರು,’ ಮತ್ತು ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ರೂಢಿಯಾದ ಬೈಬಲ್ ಪದಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಒತ್ತಿಹೇಳುವ ನಿರಾಕರಣೆಗೆ ‘ಖಂಡಿತವಾಗಿಯೂ’ ಬಳಸಲಾಗಿದೆ.
