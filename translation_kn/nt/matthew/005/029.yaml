id: MAT.5.29
reference: Matthew 5:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: kn
  text: ಆದರೆ ನಿನ್ನ ಬಲಗಣ್ಣು ನಿನ್ನನ್ನು ಎಡವಿಸಿದರೆ[a], ಅದನ್ನು ಕಿತ್ತುಹಾಕಿ ನಿನ್ನಿಂದ ದೂರ ಎಸೆದುಬಿಡು. ಏಕೆಂದರೆ ನಿನ್ನ ಇಡೀ ದೇಹವು ಗೆಹೆನ್ನಕ್ಕೆ[b] ಎಸೆಯಲ್ಪಡುವುದಕ್ಕಿಂತ, ನಿನ್ನ ಅಂಗಗಳಲ್ಲಿ ಒಂದು ನಾಶವಾಗುವುದು ನಿನಗೆ ಮೇಲು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ: “ನಿನ್ನನ್ನು ಪಾಪಮಾಡುವಂತೆ ಮಾಡಿದರೆ.”'
    reason: lexical_alternative
  - marker: b
    text: ‘ಗೆಹೆನ್ನ’ ಎಂಬುದು ಹಿನ್ನೋಮ್ ಕಣಿವೆಯ ಹೆಸರಿನ ಗ್ರೀಕ್ ರೂಪ; ಇದನ್ನು ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ‘ನರಕ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ಎಡವುವಂತೆ ಮಾಡಿದರೆ
  rationale: ಪಾಪಕ್ಕೆ ಬೀಳಿಸುವ ಅರ್ಥವಿರುವ ಮೂಲ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭದಲ್ಲಿನ ನೈತಿಕ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἔξελε
  choice: ಕಿತ್ತು
  rationale: ಕಣ್ಣನ್ನು ಬಲವಂತವಾಗಿ ತೆಗೆದುಹಾಕುವ ತೀವ್ರ ಮತ್ತು ತುರ್ತು ಚಿತ್ರಣವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: βάλε ἀπὸ σοῦ
  choice: ನಿನ್ನಿಂದ ದೂರ ಎಸೆದುಬಿಡು
  rationale: ಎಸೆಯುವ ಕ್ರಿಯೆಯ ಬಲವನ್ನೂ ತನ್ನಿಂದ ಪ್ರತ್ಯೇಕಿಸುವ ಅರ್ಥವನ್ನೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: συμφέρει
  choice: ನಿನಗೆ ಮೇಲು
  rationale: ಲಾಭ ಅಥವಾ ಹಿತ ಎಂಬ ತುಲನಾತ್ಮಕ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἀπόληται
  choice: ನಾಶವಾಗುವುದು
  rationale: ಒಂದು ಅಂಗದ ಗಂಭೀರ ನಷ್ಟವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಸಂಪೂರ್ಣ ಅಸ್ತಿತ್ವನಾಶದ ಕುರಿತು ಅಗತ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: μελῶν
  choice: ಅಂಗಗಳಲ್ಲಿ
  rationale: ಕಣ್ಣನ್ನೂ ಒಳಗೊಳ್ಳುವ ದೇಹದ ಭಾಗ ಎಂಬ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಅವಯವ’ಕ್ಕಿಂತ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಹೆಚ್ಚು ಸಹಜ.
- source_word: βληθῇ
  choice: ಎಸೆಯಲ್ಪಡುವುದಕ್ಕಿಂತ
  rationale: βάλλω ಪದದ ಬಲವಾದ ನಿಷ್ಕ್ರಿಯ ಕ್ರಿಯೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: γέενναν
  choice: ಗೆಹೆನ್ನಕ್ಕೆ
  rationale: ನಂತರದ ಸಾಮಾನ್ಯೀಕೃತ ತಾತ್ತ್ವಿಕ ಪದವನ್ನು ಹೇರದೆ ಗ್ರೀಕ್‌ನ ನಿರ್ದಿಷ್ಟ ಸ್ಥಳನಾಮವನ್ನು ಲಿಪ್ಯಂತರಿಸುತ್ತದೆ.
- source_word: ὁ δεξιὸς
  choice: ಬಲಗಣ್ಣು
  rationale: ಮೂಲದಲ್ಲಿರುವ ‘ಬಲ’ ಎಂಬ ಸ್ಪಷ್ಟ ವಿವರವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಮಾತಿನ ಮುಂದುವರಿಕೆಯಲ್ಲಿ ಕಂಡುಬರುವ ಸೌಮ್ಯ ವಿರೋಧಾರ್ಥಕ ಸಂಬಂಧವನ್ನು ತೋರಿಸುತ್ತದೆ.
theological_decisions:
- issue: γέεννα ಪದದ ಅನುವಾದ
  choice: ಗೆಹೆನ್ನ
  alternative: ನರಕ
  rationale: ಮೂಲದ ವಿಶಿಷ್ಟ ಪದ ಮತ್ತು ಅದರ ಐತಿಹಾಸಿಕ ಸಂಬಂಧಗಳನ್ನು ಉಳಿಸಿ, ‘ನರಕ’ ಎಂಬ ವಿಶಾಲ ತಾತ್ತ್ವಿಕ ಪದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹೇರದೆ ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡುತ್ತದೆ.
- issue: σκανδαλίζω ಪದದ ರೂಪಕ
  choice: ಎಡವುವಂತೆ ಮಾಡು
  alternative: ಪಾಪಮಾಡುವಂತೆ ಮಾಡು
  rationale: ಗ್ರೀಕ್‌ನ ಎಡವುವ ರೂಪಕವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಸಂದರ್ಭಸೂಚಿತ ಪಾಪದ ಅರ್ಥವನ್ನು ಪರ್ಯಾಯವಾಗಿ ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಮೂಲದ ತೀವ್ರ ಆಜ್ಞೆಗಳು, ದೇಹದ ಅಂಗ ಮತ್ತು ಇಡೀ ದೇಹದ ನಡುವಿನ ವಿರೋಧ, ಹಾಗೂ ‘ಎಡವು’ ಎಂಬ ರೂಪಕ ಉಳಿಸಲಾಗಿದೆ. ಎರಡೂ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ; [b] ಅನ್ನು ಗೆಹೆನ್ನ ಪದದ ಬಳಿ ಇಡುವುದು ಅದರ ಉಲ್ಲೇಖವನ್ನು ಹೆಚ್ಚು ಸ್ಪಷ್ಟಗೊಳಿಸುವುದರಿಂದ ಪ್ರಕಟಣೆಯಲ್ಲಿ ಗುರುತನ್ನು ‘ಗೆಹೆನ್ನಕ್ಕೆ[b]’ ಎಂದು ಸ್ಥಳಾಂತರಿಸುವುದನ್ನೂ ಪರಿಗಣಿಸಬಹುದು.
