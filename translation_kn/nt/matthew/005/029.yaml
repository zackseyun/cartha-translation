  naturalness: ‘ನಿನ್ನನ್ನು ಎಡವಿಸಿದರೆ’ ಎಂಬುದು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಹೆಚ್ಚು ಸಹಜವೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆಗಿದ್ದು, σκανδαλίζει ಯ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ. ಗೆಹೆನ್ನಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತನ್ನು ಆ ಪದದ ತಕ್ಷಣವೇ ಇರಿಸುವುದು ಅದರ ಉಲ್ಲೇಖವನ್ನು ನಿಸ್ಸಂದಿಗ್ಧಗೊಳಿಸುತ್ತದೆ.
