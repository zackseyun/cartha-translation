id: MAT.5.22
reference: Matthew 5:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: kn
  text: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ತನ್ನ ಸಹೋದರನ ಮೇಲೆ ಕೋಪಗೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ನ್ಯಾಯತೀರ್ಪಿಗೆ ಗುರಿಯಾಗುವನು.[a] ತನ್ನ ಸಹೋದರನಿಗೆ, ‘ರಾಕಾ!’ ಎಂದು ಹೇಳುವವನು ನ್ಯಾಯಸಭೆಗೆ ಗುರಿಯಾಗುವನು;[b][c][d] ‘ಮೂರ್ಖನೇ!’ ಎಂದು ಹೇಳುವವನು ಬೆಂಕಿಯ ಗೆಹೆನ್ನಾಕ್ಕೆ ಗುರಿಯಾಗುವನು.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳು ‘ತನ್ನ ಸಹೋದರನ ಮೇಲೆ ಕೋಪಗೊಳ್ಳುವ’ ಎಂಬುದರ ಬಳಿಕ ‘ಕಾರಣವಿಲ್ಲದೆ’ ಎಂದು ಸೇರಿಸುತ್ತವೆ. ಅತ್ಯಂತ ಪ್ರಾಚೀನವೂ ಉತ್ತಮ ಸಾಕ್ಷ್ಯವುಳ್ಳವೂ ಆದ ಪಾಠದಲ್ಲಿ ಈ ಪದಗಳಿಲ್ಲ.
    reason: textual_variant
  - marker: b
    text: ‘ರಾಕಾ’ ಎಂಬುದು ಅರಾಮಾಯಿಕ ನಿಂದಾಪದ; ಸರಿಸುಮಾರು ‘ಬುದ್ಧಿಯಿಲ್ಲದವನೇ’ ಅಥವಾ ‘ಕೆಲಸಕ್ಕೆ ಬಾರದವನೇ’ ಎಂಬ ಅರ್ಥ ಕೊಡುತ್ತದೆ.
    reason: cultural_note
  - marker: c
    text: ಅಥವಾ ‘ಸನ್ಹೆದ್ರಿನ್‌ಗೆ’; ಇದು ಯೆಹೂದ್ಯರ ಆಡಳಿತ ನ್ಯಾಯಸಭೆ.
    reason: alternative_reading
  - marker: d
    text: ‘ಸಹೋದರ’ ಎಂದು ಅನುವಾದಿಸಿರುವುದು ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಪದ. ಇಲ್ಲಿ ಅದು ಪ್ರತಿನಿಧಿಕವಾಗಿ ಬಳಕೆಯಾಗಿರುವುದರಿಂದ ಈ ಮಾತು ಪುರುಷ ಸಹೋದರರಿಗೆ ಮಾತ್ರ ಸೀಮಿತವಲ್ಲ.
    reason: lexical_alternative
  - marker: e
    text: ಅಥವಾ ‘ಬೆಂಕಿಯ ನರಕಕ್ಕೆ.’ ‘ಗೆಹೆನ್ನಾ’ ಎಂಬುದು ಯೇಸು ಬಳಸಿದ ವಿಶಿಷ್ಟ ಪದವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಸಂಬಂಧಿಸಿದ ಹಿನ್ನೋಮ್ ಕಣಿವೆಯ ಚಿತ್ರಣದಿಂದ ಬಂದಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δέಯ ವಿರೋಧಾತ್ಮಕ ಸಂಬಂಧವನ್ನೂ ἐγώಯ ಒತ್ತನ್ನೂ ಉಳಿಸಿ, ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: ಕೋಪಗೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ
  rationale: ವರ್ತಮಾನ ಕೃದಂತದ ಸಾಮಾನ್ಯ, ನಿತ್ಯಸತ್ಯದ ಸ್ವಭಾವವನ್ನು ಅತಿಯಾಗಿ ಕಾಲನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ತನ್ನ ಸಹೋದರನ ಮೇಲೆ
  rationale: ὀργίζομαι ಜೊತೆಯ ದತ್ತಿವಿಭಕ್ತಿಯ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಮೇಲೆ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ἀδελφόςನ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἔνοχος ἔσται
  choice: ಗುರಿಯಾಗುವನು
  rationale: ಮುಂದಿನ ನ್ಯಾಯಿಕ ದಂಡನೆ ಅಥವಾ ಉತ್ತರದಾಯಿತ್ವಕ್ಕೆ ಒಳಗಾಗುವ ಅರ್ಥವನ್ನು ಮೂರು ಸಮಾಂತರ ವಾಕ್ಯಗಳಲ್ಲೂ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τῇ κρίσει
  choice: ನ್ಯಾಯತೀರ್ಪಿಗೆ
  rationale: κρίσιςನ ನ್ಯಾಯಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಇದು ನಿರ್ದಿಷ್ಟ ಸ್ಥಳೀಯ ನ್ಯಾಯಾಲಯವೇ ಅಥವಾ ವಿಶಾಲವಾದ ತೀರ್ಪೇ ಎಂಬುದನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
- source_word: Ῥακά
  choice: ರಾಕಾ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾದ ಅರಾಮಾಯಿಕ ನಿಂದಾಪದವನ್ನು ಲಿಪ್ಯಂತರಿಸಿ, ಅದರ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
- source_word: τῷ συνεδρίῳ
  choice: ನ್ಯಾಯಸಭೆಗೆ
  rationale: συνέδριονನ ‘ಸಭೆ/ಮಂಡಳಿ’ ಎಂಬ ನ್ಯಾಯಿಕ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಸನ್ಹೆದ್ರಿನ್’ ಎಂಬ ಹೆಚ್ಚು ತಾಂತ್ರಿಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: Μωρέ
  choice: ಮೂರ್ಖನೇ
  rationale: ಸಂಬೋಧನಾ ರೂಪದ ನೇರ ನಿಂದೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ಆಧುನಿಕ ವೈದ್ಯಕೀಯ ಅಥವಾ ಬೌದ್ಧಿಕ ವರ್ಗೀಕರಣದ ಅನಗತ್ಯ ಅರ್ಥಗಳನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: ಬೆಂಕಿಯ ಗೆಹೆನ್ನಾಕ್ಕೆ
  rationale: γέεννα ಎಂಬ ಐತಿಹಾಸಿಕವಾಗಿ ವಿಶಿಷ್ಟ ಪದವನ್ನು ಲಿಪ್ಯಂತರಿಸಿ, τοῦ πυρόςನ ಬೆಂಕಿಯ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: γέεννα ಪದದ ಅನುವಾದ
  choice: ಗೆಹೆನ್ನಾ
  alternative: ನರಕ
  rationale: ಯೇಸು ಬಳಸಿದ ಹಿನ್ನೋಮ್ ಕಣಿವೆಗೆ ಸಂಬಂಧಿಸಿದ ವಿಶಿಷ್ಟ ಯೆಹೂದಿ ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ; ನಂತರದ ‘ನರಕ’ ಪದದ ಎಲ್ಲಾ ಕಲ್ಪನೆಗಳನ್ನು ಮೌನವಾಗಿ ಆಮದು ಮಾಡುವುದಿಲ್ಲ.
- issue: ἀδελφός ಪದದ ಲಿಂಗ ಮತ್ತು ವ್ಯಾಪ್ತಿ
  choice: ಸಹೋದರ
  alternative: ಸಹೋದರ ಅಥವಾ ಸಹೋದರಿ / ಜೊತೆವಿಶ್ವಾಸಿ
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ; ಅದರ ಪ್ರತಿನಿಧಿಕ, ವಿಶಾಲ ಅನ್ವಯವನ್ನು ಅಡಿಕುರಿಪು ತಿಳಿಸುತ್ತದೆ.
- issue: κρίσιςನ ನ್ಯಾಯಿಕ ಸೂಚನೆ
  choice: ನ್ಯಾಯತೀರ್ಪು
  alternative: ನ್ಯಾಯಾಲಯ
  rationale: ಪದವು ತೀರ್ಪನ್ನೋ ನ್ಯಾಯಿಕ ಪ್ರಕ್ರಿಯೆಯನ್ನೋ ಸೂಚಿಸಬಹುದಾದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಿ, ನಿರ್ದಿಷ್ಟ ಸ್ಥಳೀಯ ನ್ಯಾಯಾಲಯ ಎಂದು ತೀರ್ಮಾನಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ನ್ಯಾಯಿಕ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂರು ಎಚ್ಚರಿಕೆಗಳ ಸಮಾಂತರ ರಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ರಾಕಾ’ ಮತ್ತು ‘ಗೆಹೆನ್ನಾ’ ಎಂಬ ಮೂಲಸಂಸ್ಕೃತಿ-ಸಂಬಂಧಿತ ಪದಗಳನ್ನು ಅಡಿಕುರಿಪಿನ ವಿವರಣೆಯೊಂದಿಗೆ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
