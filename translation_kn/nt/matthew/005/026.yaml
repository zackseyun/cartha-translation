id: MAT.5.26
reference: Matthew 5:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: kn
  text: 'ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಕೊನೆಯ ಕಾಸನ್ನೂ ತೀರಿಸುವ ತನಕ ನೀವು ಅಲ್ಲಿಂದ ಖಂಡಿತವಾಗಿಯೂ ಹೊರಗೆ ಬರುವುದಿಲ್ಲ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೂಲದಲ್ಲಿರುವ ‘ಕ್ವಾಡ್ರಾನ್ಸ್’ ಅತಿ ಕಡಿಮೆ ಮೌಲ್ಯದ ಒಂದು ಚಿಕ್ಕ ರೋಮನ್ ನಾಣ್ಯವಾಗಿತ್ತು.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: ನಿಜವಾಗಿ
  rationale: ಸಭಾಸುವಾರ್ತೆಗಳಲ್ಲಿನ ಈ ಸೂತ್ರದಲ್ಲಿ ἀμήν ಗಂಭೀರವಾದ ದೃಢೀಕರಣವಾಗಿ ಬಳಕೆಯಾಗುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ನಿಜವಾಗಿ’ ಅದರ ಬಲವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: λέγω σοι
  choice: ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ
  rationale: ನೇರ ಸಂಬೋಧನೆಯನ್ನೂ ಹೇಳಿಕೆಯ ಅಧಿಕಾರಯುತ ಧಾಟಿಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ. ಗ್ರೀಕ್ ಏಕವಚನ ಸಂಬೋಧನೆ ಕನ್ನಡದ ಗೌರವ ಏಕವಚನದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ನೀವು ... ಖಂಡಿತವಾಗಿಯೂ ಹೊರಗೆ ಬರುವುದಿಲ್ಲ
  rationale: οὐ μή ಮತ್ತು aorist subjunctive ಸೇರಿ ನೀಡುವ ಬಲವಾದ ನಿರಾಕರಣೆಯನ್ನು ‘ಖಂಡಿತವಾಗಿಯೂ ... ಬರುವುದಿಲ್ಲ’ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ
  rationale: ಆ ಸ್ಥಳದಿಂದ ದೂರ ಸರಿಯುವ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἕως ἂν ἀποδῷς
  choice: ತೀರಿಸುವ ತನಕ
  rationale: ಸಾಲ ಅಥವಾ ಬಾಕಿಯನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಪಾವತಿಸುವ ಭಾವವನ್ನು ‘ತೀರಿಸುವ’ ಎಂಬ ಕ್ರಿಯಾಪದ ಸಹಜವಾಗಿ ಕೊಡುತ್ತದೆ; ‘ತನಕ’ ಮುಂದಿನ ಷರತ್ತಿನ ಗಡಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὸν ἔσχατον
  choice: ಕೊನೆಯ
  rationale: ಉಳಿದ ಮೊತ್ತದ ಅಂತಿಮ ಅಂಶವನ್ನೂ ಸಂಪೂರ್ಣ ಪಾವತಿಯ ಭಾವವನ್ನೂ ಸರಳವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κοδράντην
  choice: ಕಾಸು
  rationale: ಕೊದ್ರಾಂತೇಸ್ ಒಂದು ಅತಿ ಚಿಕ್ಕ ರೋಮನ್ ನಾಣ್ಯ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅಪರಿಚಿತ ಲಿಪ್ಯಂತರಕ್ಕಿಂತ ordinary Kannada ಓದುಗರಿಗೆ ಅಲ್ಪ ಮೊತ್ತದ ನಾಣ್ಯದ ಭಾವವನ್ನು ‘ಕಾಸು’ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಸಾಂಸ್ಕೃತಿಕ ನಿಖರತೆಯನ್ನು ಅಡಿಕುರಿಪು ಒದಗಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಈ ಮಾತು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪು, ಶುದ್ಧೀಕರಣ ಅಥವಾ ಕೇವಲ ಸಾಲದ ಕಾರಣದ ಸೆರೆವಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆಯೇ?
  choice: ಸಾಲವನ್ನು ಸಂಪೂರ್ಣ ತೀರಿಸುವವರೆಗೆ ಬಂಧನದಿಂದ ಹೊರಬರಲಾಗದು ಎಂಬ ತಕ್ಷಣದ ಚಿತ್ರಣವನ್ನು ಮಾತ್ರ ಅನುವಾದದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಇದನ್ನು ದೈವಿಕ ನ್ಯಾಯತೀರ್ಪಿನ ರೂಪಕವಾಗಿ ಅಥವಾ ನಿರ್ದಿಷ್ಟ ಮರಣಾನಂತರದ ಶುದ್ಧೀಕರಣದ ಬೋಧನೆಯಾಗಿ ಸ್ಪಷ್ಟೀಕರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಬಂಧನ ಮತ್ತು ಪೂರ್ಣ ಪಾವತಿಯ ಚಿತ್ರಣವನ್ನು ನೀಡುತ್ತದೆ; ಅದರ ವಿಶಾಲ ಧಾರ್ಮಿಕ ಅನ್ವಯವನ್ನು ಇಲ್ಲಿ ನಿರ್ದಿಷ್ಟವಾಗಿ ತೀರ್ಮಾನಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಂಥೀಯ ನಿರ್ಣಯವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿನ ನೇರ ಸಂಬೋಧನೆಗೆ ಗೌರವ ಏಕವಚನವಾದ ‘ನೀವು’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ. ಬಲವಾದ ಗ್ರೀಕ್ ನಿರಾಕರಣೆಯನ್ನು ‘ಖಂಡಿತವಾಗಿಯೂ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ; ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ಪರಲೋಕಸಂಬಂಧಿ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸಿಲ್ಲ.
