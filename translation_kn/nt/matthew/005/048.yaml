id: MAT.5.48
reference: Matthew 5:48
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆಯು ಪರಿಪೂರ್ಣನಾಗಿರುವಂತೆಯೇ ನೀವೂ ಪರಿಪೂರ್ಣರಾಗಿರಬೇಕು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಸಂಪೂರ್ಣರಾಗಿರಿ,’ ‘ಸಮಗ್ರರಾಗಿರಿ,’ ಅಥವಾ ‘ಪಕ್ವರಾಗಿರಿ.’ ಗ್ರೀಕ್‌ನ τέλειος ಎಂಬ ಪದವು ಪರಿಪೂರ್ಣತೆಯ ಜೊತೆಗೆ ಸಂಪೂರ್ಣತೆ ಅಥವಾ ಪಕ್ವತೆಯನ್ನೂ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: ಆಗಿರಬೇಕು
  rationale: ರೂಪತಃ ಭವಿಷ್ಯತ್ಕಾಲದ ಸೂಚಕವಾಗಿದ್ದರೂ, ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅದು ಆಜ್ಞಾರ್ಥಕ/ಪ್ರೇರಣಾರ್ಥಕ ಬಲ ಹೊಂದಿದೆ. ‘ಆಗಿರಬೇಕು’ ಆ ಗಂಭೀರ ಕರೆಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οὖν
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಶತ್ರುಪ್ರೇಮದ ಬೋಧನೆಯಿಂದ ಹೊರಹೊಮ್ಮುವ ತೀರ್ಮಾನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὑμεῖς
  choice: ನೀವೂ
  rationale: ಗ್ರೀಕ್‌ನ ಸ್ಪಷ್ಟ ಸರ್ವನಾಮದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ‘-ಊ’ ತಂದೆಯೊಂದಿಗೆ ಮಾಡಿರುವ ಹೋಲಿಕೆಯಲ್ಲಿ ಶಿಷ್ಯರ ಮೇಲಿನ ಅನ್ವಯವನ್ನು ಸಹಜವಾಗಿ ಎತ್ತಿಹಿಡಿಯುತ್ತದೆ.
- source_word: τέλειοι / τέλειός
  choice: ಪರಿಪೂರ್ಣರು / ಪರಿಪೂರ್ಣನು
  rationale: ಎರಡೂ ಸ್ಥಳಗಳಲ್ಲಿ ಒಂದೇ ಪದವನ್ನು ಬಳಸಿ ಗ್ರೀಕ್‌ನ ಪುನರಾವರ್ತನೆ ಮತ್ತು ತಂದೆ-ಶಿಷ್ಯರ ಹೋಲಿಕೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಪದದ ‘ಸಂಪೂರ್ಣ/ಪಕ್ವ’ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: ὡς
  choice: ಇರುವಂತೆಯೇ
  rationale: ತಂದೆಯ ಪರಿಪೂರ್ಣತೆಯನ್ನು ಮಾದರಿಯಾಗಿ ನೀಡುವ ಹೋಲಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ನಿಮ್ಮ ಪರಲೋಕದ ತಂದೆ
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧ ಮತ್ತು οὐράνιος ಎಂಬ ವಿಶೇಷಣವನ್ನು ನೇರವಾಗಿ, ಗೌರವಯುತ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ನೈತಿಕ ಪ್ರೇರಣೆಯಲ್ಲಿ τέλειος ಪದದ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಪರಿಪೂರ್ಣ’ ಎಂದು ಅನುವಾದಿಸಿ, ‘ಸಂಪೂರ್ಣ,’ ‘ಸಮಗ್ರ,’ ಅಥವಾ ‘ಪಕ್ವ’ ಎಂಬ ಅರ್ಥಸಾಧ್ಯತೆಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
  alternative: ಸಂಪೂರ್ಣ / ಸಮಗ್ರ / ಪಕ್ವ
  rationale: ‘ಪರಿಪೂರ್ಣ’ ಎಂಬುದು ಪದದ ನೇರತೆ ಮತ್ತು ವಾಕ್ಯದ ತೀಕ್ಷ್ಣ ನೈತಿಕ ಕರೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಅದೇ ಸಮಯದಲ್ಲಿ, ತಕ್ಷಣದ ಸಂದರ್ಭವು (ಶತ್ರುಗಳನ್ನೂ ಒಳಗೊಂಡ ಪೂರ್ಣ ಪ್ರೀತಿ) ಸಮಗ್ರತೆ ಮತ್ತು ಪಕ್ವತೆಯ ಛಾಯೆಯನ್ನು ಕೊಡುತ್ತದೆ; ಆದ್ದರಿಂದ ಪಾಪರಹಿತ ದೈವಸಮಾನತೆ ಎಂಬ ಅರ್ಥವನ್ನು ಅನುವಾದವೇ ಬಲವಂತವಾಗಿ ಹೇರದಂತೆ ಪರ್ಯಾಯಗಳನ್ನು ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಗೌರವಯುತ, ಸುಲಭವಾಗಿ ಗ್ರಹಿಸಬಹುದಾದ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ. ‘ಪರಲೋಕದ ತಂದೆ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲೀಯ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಆಗಿರಬೇಕು’ ಎಂಬುದು ಗ್ರೀಕ್ ಭವಿಷ್ಯತ್ಕಾಲದ ಪ್ರೇರಣಾರ್ಥಕ ಬಲವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
