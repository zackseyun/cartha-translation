id: MAT.5.41
reference: Matthew 5:41
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: kn
  text: ಯಾರಾದರೂ ನಿನ್ನನ್ನು ಒಂದು ಮೈಲಿ ಹೋಗುವಂತೆ ಬಲವಂತಪಡಿಸಿದರೆ[a], ಅವನೊಂದಿಗೆ ಎರಡು ಮೈಲಿ ಹೋಗು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಈ ಕ್ರಿಯಾಪದವು ಅಧಿಕಾರದ ಬಲದಿಂದ ಒಬ್ಬರನ್ನು ಸೇವೆಗೆ ಒತ್ತಾಯಿಸುವುದನ್ನೂ ಸೂಚಿಸಬಹುದು; ರೋಮನ್ ಕಾಲದ ಬಲವಂತದ ಸೇವೆ ಇಲ್ಲಿ ಹಿನ್ನೆಲೆಯಾಗಿರಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಮೂಲದಲ್ಲಿ ಅಕ್ಷರಶಃ, ‘ಒಂದು ಮೈಲಿ … ಎರಡು’; ಎರಡನೆಯ ಕಡೆ ‘ಮೈಲಿ’ ಎಂಬುದು ಅಧ್ಯಾಹಾರವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ಯಾರಾದರೂ
  rationale: ಅನಿರ್ದಿಷ್ಟ ಸಂಬಂಧವಾಚಕ ಸರ್ವನಾಮವು ಸಾಮಾನ್ಯವಾಗಿ ಅನ್ವಯಿಸುವ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಯಾರಾದರೂ’ ಆ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀγγαρεύσει
  choice: ಬಲವಂತಪಡಿಸಿದರೆ
  rationale: ಅಧಿಕಾರದ ಬಲದಿಂದ ಒಬ್ಬರನ್ನು ಸೇವೆಗೆ ಅಥವಾ ಪ್ರಯಾಣಕ್ಕೆ ಒತ್ತಾಯಿಸುವ ಅರ್ಥವಿದೆ. ದೂರದ ಸೂಚನೆಯೊಂದಿಗೆ ‘ಒಂದು ಮೈಲಿ ಹೋಗುವಂತೆ ಬಲವಂತಪಡಿಸಿದರೆ’ ಎಂಬುದು ಬಲಾತ್ಕಾರದ ಭಾವವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: μίλιον ἕν
  choice: ಒಂದು ಮೈಲಿ
  rationale: ಇದು ರೋಮನ್ ಮೈಲನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮೂಲದ ಸ್ಪಷ್ಟ ದೂರವನ್ನು ಪರಿಚಿತ ಅಳತೆಯ ಪದದ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὕπαγε
  choice: ಹೋಗು
  rationale: ಮುಂದುವರಿದು ಹೋಗುವಂತೆ ನೀಡಿದ ಆಜ್ಞೆಯನ್ನು ಸರಳವೂ ಸಹಜವೂ ಆದ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μετ’ αὐτοῦ
  choice: ಅವನೊಂದಿಗೆ
  rationale: μετά ಮತ್ತು ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಜೊತೆಯಾಗಿ ಸಾಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಅವನೊಂದಿಗೆ’ ನೇರ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
- source_word: δύο
  choice: ಎರಡು ಮೈಲಿ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಎರಡು’ ಎಂದಷ್ಟೇ ಇದ್ದರೂ, ಹಿಂದಿನ ‘ಮೈಲಿ’ ಪದವು ಇಲ್ಲಿ ಅಧ್ಯಾಹಾರವಾಗಿದೆ. ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ಆ ಅಳತೆಯ ಪದವನ್ನು ಪುನಃ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಅಧಿಕಾರದ ಅಡಿಯಲ್ಲಿ ಬಲವಂತದ ಸೇವೆಯ ಐತಿಹಾಸಿಕ-ಸಾಮಾಜಿಕ ಹಿನ್ನೆಲೆ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಲವಂತದ ಬೇಡಿಕೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ, ರೋಮನ್ ಸೈನಿಕರನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಉಲ್ಲೇಖಿಸದಿರುವುದು
  alternative: ಇದನ್ನು ರೋಮನ್ ಸೈನಿಕರ ಬಲವಂತದ ಸೇವೆಯೆಂದು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು
  rationale: ಕ್ರಿಯಾಪದ ಮತ್ತು ‘ಮೈಲಿ’ ಎಂಬ ಅಳತೆ ರೋಮನ್ ಕಾಲದ ಬಲವಂತದ ಸೇವೆಯನ್ನು ನೆನಪಿಸುತ್ತವೆ; ಆದರೆ ಗ್ರೀಕ್ ಪಠ್ಯವು ಸೈನಿಕರನ್ನು ನೇರವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಸಾಧ್ಯ ಹಿನ್ನೆಲೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಿ, ಮುಖ್ಯ ಪಠ್ಯದ ವ್ಯಾಪಕತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ಏಕವಚನದ ‘ನಿನ್ನನ್ನು/ಹೋಗು’ ರೂಪಗಳು ಮೂಲದ ಏಕವಚನ ಸಂಬೋಧನೆಯನ್ನು ಉಳಿಸುತ್ತವೆ.
