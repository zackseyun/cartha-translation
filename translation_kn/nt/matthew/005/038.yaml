    text: 'ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃ: “ಕಣ್ಣಿನ ಬದಲಿಗೆ ಕಣ್ಣು, ಹಲ್ಲಿನ ಬದಲಿಗೆ ಹಲ್ಲು.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: ನೀವು ಕೇಳಿದ್ದೀರಿ
  rationale: ಈ ಮತ್ತಾಯನ ಪರಿಚಯ ಸೂತ್ರದಲ್ಲಿ ಸಭಿಕರು ಸ್ವೀಕರಿಸಿ ಕೇಳಿಬಂದ ಬೋಧನೆಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ, ಕನ್ನಡದ ಪೂರ್ಣಭೂತ ರೂಪ ಸಹಜವಾಗಿದ್ದು ಅದರ ಪ್ರಸ್ತುತ ಸಂಬಂಧವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಎಂಬುದನ್ನು
  rationale: ಕೇಳಿದ ಮಾತಿನ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಪೂರಕ ಸಂಯೋಜಕವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಉಲ್ಲೇಖ-ಪೂರಕ ರೂಪದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἐρρέθη
  choice: ಹೇಳಲಾಗಿತ್ತು
  rationale: λέγω ಕ್ರಿಯಾಪದದ ಅಪ್ರತ್ಯಕ್ಷ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಿ, ಹೇಳಿದ ಕರ್ತೃವನ್ನು ಪಠ್ಯವು ಸೂಚಿಸದಿರುವುದನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: ಕಣ್ಣಿಗೆ ಕಣ್ಣು
  rationale: ἀντί ಸೂಚಿಸುವ ಪ್ರತಿಯಾಗಿ/ಬದಲಾಗಿ ಎಂಬ ಕಾನೂನುಸಂಬಂಧಿ ಸಮತೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ, ಸಮತೋಲನದ ನ್ಯಾಯಸೂತ್ರದ ರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: καὶ
  choice: ಹಲ್ಲಿಗೆ ಹಲ್ಲು
  rationale: ಕನ್ನಡದಲ್ಲಿ ಎರಡು ಸಮಾನಾಂತರ ಪದಗುಚ್ಛಗಳನ್ನು ಅಲ್ಪವಿರಾಮದಿಂದ ಜೋಡಿಸುವುದು ಸಹಜ; ಅರ್ಥದಲ್ಲಿ ಗ್ರೀಕ್ καίಯ ಸಂಯೋಜನೆ ಉಳಿದಿದೆ.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: ಹಲ್ಲಿಗೆ ಹಲ್ಲು
  rationale: ಮೊದಲ ಭಾಗಕ್ಕೆ ಸಮಾನಾಂತರವಾಗಿ ಪ್ರತಿದಾನ ಅಥವಾ ಸಮತೆಯ ಕಾನೂನುಸೂತ್ರವನ್ನು ಸಂಕ್ಷಿಪ್ತ ಹಾಗೂ ಪರಿಚಿತ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸು ಉಲ್ಲೇಖಿಸುವ ಪ್ರತಿದಂಡನೆಯ ಕಾನೂನುಸೂತ್ರದ ನಿರೂಪಣೆ
  choice: ಕಣ್ಣಿಗೆ ಕಣ್ಣು, ಹಲ್ಲಿಗೆ ಹಲ್ಲು
  alternative: ಕಣ್ಣಿನ ಬದಲಿಗೆ ಕಣ್ಣು, ಹಲ್ಲಿನ ಬದಲಿಗೆ ಹಲ್ಲು
  rationale: ಈ ಪರಿಚಿತ ಕನ್ನಡ ರೂಪವು ಗ್ರೀಕ್‌ನ ಸಮತೋಲನದ ಸೂತ್ರವನ್ನು ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಇದು ಶಿಕ್ಷೆ ಅಕ್ಷರಶಃ ಆಗಬೇಕೋ ಪ್ರಮಾಣಾನುಸಾರವಾಗಬೇಕೋ ಎಂಬ ಪ್ರಶ್ನೆಯನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಮುಂದೆ ಹೋಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಪರಿಚಿತವಾದ ಕಾನೂನುಸೂತ್ರವನ್ನು ಬಳಸಲಾಗಿದೆ. ಮುಖ್ಯ ವಾಕ್ಯದಲ್ಲಿ ಕರ್ಮಣಿ ಪ್ರಯೋಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಉಲ್ಲೇಖದೊಳಗಿನ ಸಮಾನಾಂತರತೆ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
