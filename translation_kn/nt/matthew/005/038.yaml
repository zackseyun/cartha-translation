  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: kn
  text: “‘ಕಣ್ಣಿಗೆ ಕಣ್ಣು, ಹಲ್ಲಿಗೆ ಹಲ್ಲು’ ಎಂದು ಹೇಳಲಾಗಿತ್ತು[a] ಎಂಬುದನ್ನು ನೀವು ಕೇಳಿದ್ದೀರಿ.
  philosophy: optimal-equivalence
  footnotes:
