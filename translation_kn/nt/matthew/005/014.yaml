  rationale: ಮುಖ್ಯಪಾಠದಲ್ಲಿ κρυβῆναιಯ ಅರ್ಥವನ್ನು ‘ಮರೆಮಾಡಲಾಗದು’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ಇದರಿಂದ ನಗರವು ತಾನಾಗಿಯೇ ಕಾಣೆಯಾಗುವುದಲ್ಲ, ಅದನ್ನು ಮರೆಮಾಡುವುದು ಅಸಾಧ್ಯ ಎಂಬ ಮೂಲದ ಅರ್ಥ ಉಳಿಯುತ್ತದೆ. ಉಳಿದ ಪದಪ್ರಯೋಗ, ರೂಪಕ, ಒತ್ತು, ಮತ್ತು ಗೌರವಯುತ ಆಧುನಿಕ ಶೈಲಿಯನ್ನು ಬದಲಿಸಲಾಗಿಲ್ಲ. ಅಡಿಟಿಪ್ಪಣಿಯನ್ನು ಅಕ್ಷರಶಃ ಪರ್ಯಾಯವೆಂಬ ಅದರ ಕಾರ್ಯಕ್ಕೆ ಹೊಂದುವಂತೆ ಪರಿಷ್ಕರಿಸಲಾಗಿದೆ.
