  source_fidelity: ಮೊದಲ ವಾಕ್ಯವು ಗ್ರೀಕ್‌ನ ಸ್ಪಷ್ಟ ಒತ್ತಾದ Ὑμεῖς ಮತ್ತು ನೇರ ರೂಪಕವನ್ನು ‘ನೀವೇ ಲೋಕದ ಬೆಳಕು’ ಎಂದು ನಿಷ್ಠೆಯಿಂದ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ. ಎರಡನೆಯ ವಾಕ್ಯದಲ್ಲಿ ‘ಮರೆಯಾಗಲಾರದು’ ಎಂದರೆ ಸಾಮಾನ್ಯವಾಗಿ ತಾನಾಗಿಯೇ ಕಾಣೆಯಾಗುವುದು/ಅದೃಶ್ಯವಾಗುವುದು ಎಂಬ ಅರ್ಥವೂ ಬರುವುದರಿಂದ κρυβῆναι (‘ಮರೆಮಾಡಲ್ಪಡುವುದು, ಮರೆವಾಗಿರುವುದು’)ಯ ನಿಷ್ಕ್ರಿಯ ಅರ್ಥವು ಸ್ಪಷ್ಟವಾಗುವುದಿಲ್ಲ. ‘ಮರೆಮಾಡಲಾಗದು’ ಈ ಸಂದರ್ಭದ ಅಸಾಧ್ಯತೆ ಮತ್ತು ದೃಶ್ಯರೂಪವನ್ನು ಉತ್ತಮವಾಗಿ ಉಳಿಸುತ್ತದೆ.
