id: MAT.5.14
reference: Matthew 5:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: kn
  text: ನೀವೇ ಲೋಕದ ಬೆಳಕು. ಬೆಟ್ಟದ ಮೇಲಿರುವ ಪಟ್ಟಣವು ಮರೆಮಾಡಲಾಗದು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಹೆಚ್ಚು ಅಕ್ಷರಶಃ: ‘ಪರ್ವತದ ಮೇಲೆ ನೆಲೆಗೊಂಡಿರುವ ಪಟ್ಟಣವು ಮರೆಮಾಡಲ್ಪಡಲು ಸಾಧ್ಯವಿಲ್ಲ.’'
    reason: ἐπάνω ὄρους ಮತ್ತು κειμένη ಪದಗಳಿಗೆ ಮೂಲಪಠ್ಯಕ್ಕೆ ಹೆಚ್ಚು ಸಮೀಪವಾದ ಪರ್ಯಾಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ನೀವೇ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸರ್ವನಾಮವು ಸ್ಪಷ್ಟವಾಗಿಯೂ ಒತ್ತಿಹೇಳುವಂತೆಯೂ ಇದೆ. ಕನ್ನಡದ ‘ನೀವೇ’ ನೇರ ಸಂಬೋಧನೆಯ ಜೊತೆಗೆ ಆ ಒತ್ತನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸ φῶς
  choice: ಬೆಳಕು
  rationale: ಕನ್ನಡದಲ್ಲಿ ವಿಧೇಯ ನಾಮಪದದೊಂದಿಗೆ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಪ್ರತ್ಯೇಕ ಲೇಖದಿಂದ ಸೂಚಿಸುವುದಿಲ್ಲ; ‘ಬೆಳಕು’ ಎಂಬ ರೂಪವೇ ಸಹಜವಾಗಿ ನೇರ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τοῦ κόσμου
  choice: ಲೋಕದ
  rationale: ವಿಶಾಲವಾದ ಮಾನವಲೋಕದ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಗ್ರೀಕ್ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯನ್ನು ಅರ್ಥವಿವರಣೆ ಸೇರಿಸದೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οὐ δύναται
  choice: ಮರೆಯಾಗಲಾರದು
  rationale: ಅಸಾಧ್ಯತೆಯ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πόλις
  choice: ಪಟ್ಟಣವು
  rationale: πόλις‌ಗೆ ‘ಪಟ್ಟಣ’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಾಮಾನ್ಯ ಪದ; ಇದು ದೊಡ್ಡ ನಗರವೆಂಬ ಅನಗತ್ಯ ಕಲ್ಪನೆಯನ್ನು ಹೇರುವುದಿಲ್ಲ.
- source_word: κρυβῆναι
  choice: ಮರೆಯಾಗಲು
  rationale: ನಿಷ್ಕ್ರಿಯ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹಿಡಿಯುತ್ತದೆ; ‘ಮರೆಮಾಡಲ್ಪಡಲು’ ಎಂಬ ಭಾರವಾದ ರೂಪಕ್ಕಿಂತ ಸಂದರ್ಭಕ್ಕೆ ಸರಿಹೊಂದುತ್ತದೆ.
- source_word: ἐπάνω ὄρους
  choice: ಬೆಟ್ಟದ ಮೇಲೆ
  rationale: ὄρος ಬೆಟ್ಟ ಅಥವಾ ಪರ್ವತವನ್ನು ಸೂಚಿಸಬಹುದು. ಈ ದೃಶ್ಯರೂಪದಲ್ಲಿ ‘ಬೆಟ್ಟ’ ಸಾಮಾನ್ಯ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದವಾಗಿದ್ದು ಸ್ಥಳದ ಎತ್ತರವನ್ನು ಸಮರ್ಪಕವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: κειμένη
  choice: ಇರುವ
  rationale: ನಗರವು ಆ ಸ್ಥಳದಲ್ಲಿ ನೆಲೆಗೊಂಡಿರುವ ಸ್ಥಿತಿಯನ್ನು ಅರ್ಥವಿವರಣೆ ಇಲ್ಲದೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ‘ಬಿದ್ದಿರುವ’ ಇಲ್ಲಿ ತಪ್ಪು ಭಾವವನ್ನು ಕೊಡಬಹುದು.
theological_decisions:
- issue: ಶಿಷ್ಯರನ್ನು ಲೋಕದ ಬೆಳಕೆಂದು ನೇರವಾಗಿ ಗುರುತಿಸುವ ರೂಪಕ
  choice: ‘ನೀವೇ ಲೋಕದ ಬೆಳಕು’ ಎಂಬ ನೇರ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನೀವು ಲೋಕಕ್ಕೆ ಬೆಳಕಾಗಿದ್ದೀರಿ’
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿರುವ ಗುರುತಿಸುವ ನೇರ ರೂಪಕ ಮತ್ತು ಒತ್ತನ್ನು ಉಳಿಸಿ, ಶಿಷ್ಯರ ಪಾತ್ರದ ಕುರಿತು ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಪೂರ್ಣ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸಹಜವಾದ ಶೈಲಿ. ‘ನೀವೇ’ ಮೂಲಕ ಗ್ರೀಕ್‌ನ ಸ್ಪಷ್ಟ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಉಳಿದ ವಾಕ್ಯದಲ್ಲಿ ಅನಗತ್ಯ ವಿವರಣೆಯನ್ನು ಸೇರಿಸಿಲ್ಲ.
