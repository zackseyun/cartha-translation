revisions:
- from: ನನ್ನ ನಿಮಿತ್ತ ಜನರು ನಿಮ್ಮನ್ನು ನಿಂದಿಸಿ, ಹಿಂಸಿಸಿ, ನಿಮ್ಮ ವಿರುದ್ಧ ಎಲ್ಲ ಬಗೆಯ ಕೆಟ್ಟ ಮಾತುಗಳನ್ನು ಸುಳ್ಳಾಗಿ ಹೇಳುವಾಗ ನೀವು ಧನ್ಯರು.[a][b][c]
  to: ನನ್ನ ನಿಮಿತ್ತ ಜನರು ನಿಮ್ಮನ್ನು ನಿಂದಿಸಿ, ಕಿರುಕುಳ ನೀಡಿ, ಸುಳ್ಳಾಗಿ ನಿಮ್ಮ ವಿರುದ್ಧ ಎಲ್ಲ ಬಗೆಯ ಕೆಟ್ಟ ಮಾತುಗಳನ್ನು ಹೇಳುವಾಗ ನೀವು ಧನ್ಯರು.[a][b][c]
  rationale: The revision retains the source’s Beatitude formula, three coordinated forms of hostility, the falsity of the evil speech, and the causal relation to Jesus. ‘ಕಿರುಕುಳ ನೀಡಿ’ avoids reducing persecution to physical violence, while repositioning ‘ಸುಳ್ಳಾಗಿ’ naturally and clearly qualifies the allegations.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the three coordinated actions and the causal phrase 'because of me.' However, 'ಹಿಂಸಿಸಿ' can naturally be read as inflicting violence, whereas διώκω here denotes persecution broadly. Also, the current placement of 'ಸುಳ್ಳಾಗಿ' is serviceable but can more clearly modify the false allegations.
  naturalness: The sentence is understandable and suitably dignified. 'ಕಿರುಕುಳ ನೀಡಿ' is a clearer modern-standard rendering for the broad sense of persecution, and 'ಸುಳ್ಳಾಗಿ ನಿಮ್ಮ ವಿರುದ್ಧ...' gives a smoother, unambiguous Kannada flow.
  terminology: '''ನೀವು ಧನ್ಯರು'' fittingly retains the Beatitude register. ''ನಿಂದಿಸಿ'' is appropriate for ὀνειδίζω. ''ನನ್ನ ನಿಮಿತ್ತ'' is accurate and reverent, though ''ನನ್ನ ಕಾರಣದಿಂದ'' remains a valid alternative.'
  issues:
  - severity: medium
    issue: ‘ಹಿಂಸಿಸಿ’ may narrow διώξωσιν to violence.
    rationale: The Greek term encompasses persecution and hostile pursuit/mistreatment, not necessarily physical violence. ‘ಕಿರುಕುಳ ನೀಡಿ’ better preserves this breadth in contemporary Kannada.
  - severity: low
    issue: The footnote b alternative is syntactically incomplete.
    rationale: It supplies only a noun phrase rather than a complete alternative for the relevant Greek expression; a complete phrasing more clearly serves readers.
  revised_text: ನನ್ನ ನಿಮಿತ್ತ ಜನರು ನಿಮ್ಮನ್ನು ನಿಂದಿಸಿ, ಕಿರುಕುಳ ನೀಡಿ, ಸುಳ್ಳಾಗಿ ನಿಮ್ಮ ವಿರುದ್ಧ ಎಲ್ಲ ಬಗೆಯ ಕೆಟ್ಟ ಮಾತುಗಳನ್ನು ಹೇಳುವಾಗ ನೀವು ಧನ್ಯರು.[a][b][c]
