id: MAT.5.11
reference: Matthew 5:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: kn
  text: ನನ್ನ ನಿಮಿತ್ತ ಜನರು ನಿಮ್ಮನ್ನು ನಿಂದಿಸಿ, ಕಿರುಕುಳ ನೀಡಿ, ಸುಳ್ಳಾಗಿ ನಿಮ್ಮ ವಿರುದ್ಧ ಎಲ್ಲ ಬಗೆಯ ಕೆಟ್ಟ ಮಾತುಗಳನ್ನು ಹೇಳುವಾಗ ನೀವು ಧನ್ಯರು.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ನಿಂದಿಸಿ” ಎಂಬುದಕ್ಕೆ “ದೂಷಿಸಿ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ನಿಮ್ಮ ವಿರುದ್ಧ ಎಲ್ಲ ವಿಧದ ಕೆಟ್ಟ ಮಾತುಗಳನ್ನು ಹೇಳುವಾಗ.”
    reason: lexical_alternative
  - marker: c
    text: “ನನ್ನ ನಿಮಿತ್ತ” ಎಂಬುದಕ್ಕೆ “ನನ್ನ ಕಾರಣದಿಂದ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: ನೀವು ಧನ್ಯರು
  rationale: ಪರ್ವತ ಪ್ರಸಂಗದ ಧನ್ಯವಚನದ ಸೂತ್ರರೂಪವನ್ನೂ ಅದರ ದೇವತಾತ್ತ್ವಿಕ ಭಾರವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆಗಿದೆ.
- source_word: ὅταν
  choice: ಹೇಳುವಾಗ
  rationale: ಮುಂದಿನ ಕ್ರಿಯೆಗಳೊಂದಿಗೆ ಸೇರಿ ಸಾಮಾನ್ಯವಾಗಿ ಸಂಭವಿಸಬಹುದಾದ ಸಂದರ್ಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘-ವಾಗ’ ರೂಪ ಸಹಜವಾಗಿದೆ.
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: ನಿಮ್ಮನ್ನು ನಿಂದಿಸಿ
  rationale: ಅವಮಾನಕರವಾದ ಮೌಖಿಕ ದೂಷಣೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಅತಿಯಾದ ಪುರಾತನ ಅಥವಾ ತಾಂತ್ರಿಕ ಪದಪ್ರಯೋಗವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: διώξωσιν
  choice: ಹಿಂಸಿಸಿ
  rationale: ಯೇಸುವಿನ ನಿಮಿತ್ತ ಎದುರಾಗುವ ವೈಮನಸ್ಯಪೂರ್ಣ ಕಿರುಕುಳದ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದನ್ನು ಕೇವಲ ದೈಹಿಕ ಹಿಂಸೆಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: ನಿಮ್ಮ ವಿರುದ್ಧ ಎಲ್ಲ ಬಗೆಯ ಕೆಟ್ಟ ಮಾತುಗಳನ್ನು ... ಹೇಳುವಾಗ
  rationale: πᾶν πονηρόν ಎಂಬ ವಿಶಾಲ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನಿರೂಪಿಸಿ, κατά + genitive ಸೂಚಿಸುವ ವಿರೋಧಾರ್ಥವನ್ನು ‘ವಿರುದ್ಧ’ ಮೂಲಕ ಉಳಿಸುತ್ತದೆ.
- source_word: ψευδόμενοι
  choice: ಸುಳ್ಳಾಗಿ
  rationale: ಕೆಟ್ಟ ಮಾತುಗಳು ಅಥವಾ ಆರೋಪಗಳು ಅಸತ್ಯವೆಂಬುದನ್ನು ಕ್ರಿಯಾವಿಶೇಷಣವಾಗಿ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἕνεκεν ἐμοῦ
  choice: ನನ್ನ ನಿಮಿತ್ತ
  rationale: ಯೇಸುವಿನೊಂದಿಗಿನ ಸಂಬಂಧವೇ ವಿರೋಧದ ಕಾರಣವೆಂಬುದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಗೌರವಯುತವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ವಿರೋಧದ ಸ್ವರೂಪ
  choice: ಯೇಸುವಿನ ನಿಮಿತ್ತ ಅನುಭವಿಸುವ ನಿಂದೆ, ವಿಶಾಲ ಅರ್ಥದ ಹಿಂಸೆ ಮತ್ತು ಸುಳ್ಳಾದ ದುಷ್ಟ ಮಾತು—ಈ ಮೂರನ್ನೂ ಪ್ರತ್ಯೇಕವಾಗಿಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಹಿಂಸೆಯನ್ನು ಕೇವಲ ದೈಹಿಕ ಹಿಂಸೆಗೆ ಅಥವಾ ಸಂಪೂರ್ಣ ವಾಕ್ಯವನ್ನು ಕೇವಲ ಅಪವಾದಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದು.
  rationale: ಮೂಲದಲ್ಲಿರುವ ಮೂರು ಸಮನ್ವಿತ ಕ್ರಿಯಾಪದಗಳು ವಿರೋಧದ ಹಲವು ರೂಪಗಳನ್ನು ಒಳಗೊಂಡಿವೆ; ಅನುವಾದವು ಅವುಗಳ ವ್ಯಾಪ್ತಿಯನ್ನು ಕಿರಿದಾಗಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ, ಆದರೆ ಧನ್ಯವಚನಕ್ಕೆ ತಕ್ಕ ಗೌರವಯುತ ಶೈಲಿ. ಮೂಲದ ವಾಕ್ಯಕ್ರಮವನ್ನು ಕನ್ನಡದ ಸಹಜ ಪ್ರವಾಹಕ್ಕೆ ಹೊಂದಿಸಿ, ಕಾರಣಪದಬಂಧವನ್ನು ಆರಂಭದಲ್ಲಿ ಇರಿಸಲಾಗಿದೆ.
