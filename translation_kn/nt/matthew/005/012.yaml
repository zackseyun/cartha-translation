id: MAT.5.12
reference: Matthew 5:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: kn
  text: ಸಂತೋಷಪಡಿರಿ ಮತ್ತು ಅತ್ಯಂತ ಉಲ್ಲಾಸಪಡಿರಿ; ಏಕೆಂದರೆ ಸ್ವರ್ಗದಲ್ಲಿ[a] ನಿಮ್ಮ ಪ್ರತಿಫಲವು ಮಹತ್ತರವಾಗಿದೆ. ಏಕೆಂದರೆ ಅವರು ನಿಮಗಿಂತ ಮುಂಚೆ ಇದ್ದ ಪ್ರವಾದಿಗಳನ್ನು ಇದೇ ರೀತಿಯಲ್ಲಿ ಹಿಂಸಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಸ್ವರ್ಗಗಳಲ್ಲಿ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇಲ್ಲಿ ಬಹುವಚನ ರೂಪವಿದೆ; ಮತ್ತಾಯನಲ್ಲಿ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಏಕವಚನ ‘ಸ್ವರ್ಗ’ ಎಂದು ಹೇಳುವ ಸಂದರ್ಭಗಳಲ್ಲಿಯೂ ಈ ಬಹುವಚನ ರೂಪವು հաճախ ಕಾಣುತ್ತದೆ.
    reason: ಗ್ರೀಕ್‌ನ ಬಹುವಚನ ರೂಪವನ್ನು ಸೂಚಿಸಿ, ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜ ಕನ್ನಡದ ಏಕವಚನ ಬಳಕೆಯನ್ನು ಉಳಿಸಲು.
lexical_decisions:
- source_word: χαίρετε
  choice: ಸಂತೋಷಪಡಿರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥದ ಸಕ್ರಿಯ ಸಂತೋಷದ ಕರೆಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀγαλλιᾶσθε
  choice: ಉಲ್ಲಾಸದಿಂದ ಹರ್ಷಿಸಿರಿ
  rationale: ಮೊದಲ ಕ್ರಿಯಾಪದಕ್ಕಿಂತ ತೀವ್ರವಾದ, ಉಕ್ಕಿಹರಿಯುವ ಸಂತೋಷವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಅದರ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: μισθὸς
  choice: ಪ್ರತಿಫಲ
  rationale: ಪದಕ್ಕೆ ಕೂಲಿ ಅಥವಾ ಸಂಭಾವನೆ ಎಂಬ ಅರ್ಥಗಳಿದ್ದರೂ, ದೇವರಿಂದ ದೊರೆಯುವ ಪ್ರತಿದಾನದ ಈ ಸಂದರ್ಭದಲ್ಲಿ ವಾಣಿಜ್ಯ ವ್ಯವಹಾರದ ಭಾವವಿಲ್ಲದೆ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: πολὺς
  choice: ಮಹತ್ತರವಾಗಿದೆ
  rationale: ಪ್ರತಿಫಲದ ಪ್ರಮಾಣ ಅಥವಾ ಮಹತ್ವ ದೊಡ್ಡದು ಎಂಬ ವಿಧೇಯಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ಪರಲೋಕಗಳಲ್ಲಿ
  rationale: ಗ್ರೀಕ್‌ನ ಬಹುವಚನ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಇದು ಸ್ವಲ್ಪ ಅಧಿಕೃತವಾದರೂ ಸ್ಪಷ್ಟವೂ ಗ್ರಹಿಸಬಹುದಾದುದೂ ಆಗಿದೆ.
- source_word: οὕτως
  choice: ಇದೇ ರೀತಿಯಲ್ಲಿ
  rationale: ಶಿಷ್ಯರ ಹಿಂಸೆಗೂ ಹಿಂದಿನ ಪ್ರವಾದಿಗಳ ಹಿಂಸೆಗೂ ಇರುವ ವಿಧಾನಾತ್ಮಕ ಹೋಲಿಕೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἐδίωξαν
  choice: ಹಿಂಸಿಸಿದರು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ διώκω ಎಂಬ ಪದದ ವೈರಭಾವದ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: προφήτας
  choice: ಪ್ರವಾದಿಗಳನ್ನು
  rationale: ಇಸ್ರಾಯೇಲಿನ ಪ್ರವಾದಿಗಳಿಗೆ ಬಳಸುವ ಸ್ಥಿರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಪದ.
- source_word: τοὺς πρὸ ὑμῶν
  choice: ನಿಮ್ಮ ಹಿಂದಿದ್ದ
  rationale: ಶಿಷ್ಯರಿಗಿಂತ ಮುಂಚೆ ಜೀವಿಸಿದ್ದ ಪ್ರವಾದಿಗಳ ಐತಿಹಾಸಿಕ ಪೂರ್ವತ್ವವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἐν τοῖς οὐρανοῖς ಎಂಬ ಬಹುವಚನದ ಅರ್ಥ
  choice: ಪರಲೋಕಗಳಲ್ಲಿ
  alternative: ಪರಲೋಕದಲ್ಲಿ
  rationale: ಇದು ವಿಭಿನ್ನ ಪರಲೋಕಗಳ ಕುರಿತು ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಣಯ ಮಾಡುವುದಿಲ್ಲ; ಮತ್ತಾಯನಲ್ಲಿ ಕಂಡುಬರುವ ಸೆಮಿಟಿಕ್ ಪ್ರಭಾವದ ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಗೋಚರವಾಗಿರಿಸಿ, ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸಹಜ ಕನ್ನಡದ ಏಕವಚನ ಪರ್ಯಾಯವನ್ನು ನೀಡಲಾಗಿದೆ.
- issue: ಪ್ರತಿಫಲದ ಸ್ವರೂಪ
  choice: ನಿಮಗೆ ದೊರೆಯುವ ಪ್ರತಿಫಲ
  alternative: ನಿಮ್ಮ ಪ್ರತಿಫಲ
  rationale: ὁ μισθὸς ὑμῶν ಎಂಬ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪ್ರತಿಫಲವನ್ನು ಗಳಿಸಿದ ಕೂಲಿಯೆಂದು ಅಥವಾ ಯಾವ ನಿರ್ದಿಷ್ಟ ರಕ್ಷಣಾ ಸಿದ್ಧಾಂತದ ಅಂಶವೆಂದು ಹೆಚ್ಚುವರಿಯಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಗೌರವಯುತ ಮತ್ತು ಜನಸಾಮಾನ್ಯರಿಗೆ ಗ್ರಹಿಸಬಹುದಾದ ಶೈಲಿ. ‘ಸಂತೋಷಪಡಿರಿ, ಉಲ್ಲಾಸದಿಂದ ಹರ್ಷಿಸಿರಿ’ ಎಂಬ ಜೋಡಿ ಮೂಲದ ಎರಡು ಆಜ್ಞಾರ್ಥ ಕ್ರಿಯಾಪದಗಳ ಏರಿಕೆಯಾಗುವ ತೀವ್ರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಗ್ರೀಕ್‌ನ ವಿರಾಮಚಿಹ್ನೆಯನ್ನು ಕನ್ನಡದ ಓದಿನ ಹರಿವಿಗೆ ತಕ್ಕಂತೆ ವಾಕ್ಯಗಳಾಗಿ ವಿನ್ಯಾಸಗೊಳಿಸಲಾಗಿದೆ.
