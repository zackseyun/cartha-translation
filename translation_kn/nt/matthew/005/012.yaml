  verdict: revise
  source_fidelity: 'ಮುಖ್ಯ ಅರ್ಥವು ಸರಿಯಾಗಿದೆ: ಎರಡು ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಗಳು, ಪ್ರತಿಫಲದ ಮಹತ್ತ್ವ, ಪ್ರವಾದಿಗಳ ಮೇಲಿನ ಹಿಂದಿನ ಹಿಂಸೆ ಎಲ್ಲವೂ ಉಳಿದಿವೆ. ಆದರೆ ‘ನಿಮ್ಮ ಹಿಂದಿದ್ದ ಪ್ರವಾದಿಗಳನ್ನೂ’ಯ ‘-ನ್ನೂ’ ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ಸಹ/ಕೂಡ’ ಎಂಬ ಸೂಚನೆಯನ್ನು ತರಬಹುದು. ‘ಪರಲೋಕಗಳಲ್ಲಿ’ ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ರೂಪಾತ್ಮಕವಾಗಿ ತೋರಿಸಿದರೂ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗಿದ್ದು ಬಹು ಪರಲೋಕಗಳ ಕಲ್ಪನೆಯನ್ನು ಅನವಶ್ಯವಾಗಿ ಸೂಚಿಸಬಹುದು.'
  naturalness: ‘ಸಂತೋಷಪಡಿರಿ, ಉಲ್ಲಾಸದಿಂದ ಹರ್ಷಿಸಿರಿ’ ಅರ್ಥವಾಗುತ್ತದೆ, ಆದರೆ ಒಂದೇ ಅರ್ಥಕ್ಷೇತ್ರದ ನಾಮಪದ-ಕ್ರಿಯಾಪದ ಜೋಡಿ ಸ್ವಲ್ಪ ಭಾರವಾಗುತ್ತದೆ. ‘ಸಂತೋಷಪಡಿರಿ ಮತ್ತು ಅತ್ಯಂತ ಉಲ್ಲಾಸಪಡಿರಿ’ ಎರಡು ಗ್ರೀಕ್ ಕ್ರಿಯೆಗಳ ಏರಿಕೆಯಾಗುವ ಬಲವನ್ನು ಸರಳ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ. ‘ಸ್ವರ್ಗದಲ್ಲಿ’ ಇಲ್ಲಿ ಸಾಮಾನ್ಯ ಮತ್ತು ಸ್ಪಷ್ಟ ಬಳಕೆ.
