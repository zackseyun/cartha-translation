id: MAT.5.45
reference: Matthew 5:45
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: kn
  text: ನೀವು ಪರಲೋಕದಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆಯ ಪುತ್ರರಾಗುವಂತೆ[a]; ಏಕೆಂದರೆ ಆತನು ತನ್ನ ಸೂರ್ಯನು ಕೆಟ್ಟವರ ಮೇಲೆಯೂ ಒಳ್ಳೆಯವರ ಮೇಲೆಯೂ ಉದಯಿಸುವಂತೆ ಮಾಡುತ್ತಾನೆ; ನೀತಿವಂತರ ಮೇಲೆಯೂ ಅನೀತಿವಂತರ ಮೇಲೆಯೂ ಮಳೆ ಸುರಿಸುತ್ತಾನೆ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿಮ್ಮ ತಂದೆಯ ಮಕ್ಕಳಾಗುವಂತೆ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಪುತ್ರರು’ ಎಂದಿದೆ; ಮೂಲದ ಪುತ್ರತ್ವದ ಭಾಷೆಯನ್ನು ಉಳಿಸಲು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅದನ್ನೇ ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ನೀತಿವಂತರ ಮೇಲೆಯೂ ಅನೀತಿವಂತರ ಮೇಲೆಯೂ ಮಳೆ ಬೀಳುವಂತೆ ಮಾಡುತ್ತಾನೆ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γένησθε
  choice: ಪುತ್ರರಾಗುವಂತೆ
  rationale: ὅπως ಉದ್ದೇಶ/ಫಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ; γένησθε ಯ ‘ಆಗುವುದು’ ಎಂಬ ಚಲನೆಯ ಅರ್ಥವನ್ನು ‘ಪುತ್ರರಾಗುವಂತೆ’ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: υἱοὶ τοῦ πατρὸς ὑμῶν
  choice: ನಿಮ್ಮ ತಂದೆಯ ಪುತ್ರರು
  rationale: υἱοί ಎಂಬ ಪುಲ್ಲಿಂಗ ಪುತ್ರತ್ವದ ಪದವನ್ನು ‘ಮಕ್ಕಳು’ ಎಂದು ಸಮತಟ್ಟಾಗಿಸದೆ, ಮೂಲದ ಸಂಬಂಧಾತ್ಮಕ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: ಪರಲೋಕದಲ್ಲಿರುವ
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನ οὐρανοῖς ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಮತ್ತಾಯನ ಬಳಕೆಯಂತೆ ಏಕವಚನಾರ್ಥದ ‘ಪರಲೋಕದಲ್ಲಿ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: ತನ್ನ ಸೂರ್ಯನು ... ಉದಯಿಸುವಂತೆ ಮಾಡುತ್ತಾನೆ
  rationale: αὐτοῦ ಎಂಬ ಸ್ವಾಮ್ಯಸೂಚಕವನ್ನು ಉಳಿಸಿ, ἀνατέλλει ಯ causative ಅರ್ಥ ಹಾಗೂ ದೇವರ ಕರ್ತೃತ್ವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: ಕೆಟ್ಟವರ ಮೇಲೆಯೂ ಒಳ್ಳೆಯವರ ಮೇಲೆಯೂ
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವಿಶೇಷಣಗಳನ್ನು ವ್ಯಕ್ತಿಗಳನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ರೂಪದಲ್ಲಿ, ಸಮತೋಲನದ ಜೋಡಿಯಾಗಿ ನೀಡಲಾಗಿದೆ.
- source_word: βρέχει
  choice: ಮಳೆ ಸುರಿಸುತ್ತಾನೆ
  rationale: ‘ಮಳೆ ಸುರಿಸುತ್ತಾನೆ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಕ್ರಿಯೆಯ ಕರ್ತನಾಗಿ ದೇವರನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: ನೀತಿವಂತರ ಮೇಲೆಯೂ ಅನೀತಿವಂತರ ಮೇಲೆಯೂ
  rationale: δίκαιος/ἄδικος ಎಂಬ ಸ್ಥಿರ ನೈತಿಕ ವಿರೋಧವನ್ನು ‘ನೀತಿವಂತ/ಅನೀತಿವಂತ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಜೋಡಿಯಿಂದ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಲಿಂಗಸೂಚಿತ ಪುತ್ರತ್ವದ ಭಾಷೆ
  choice: ನಿಮ್ಮ ತಂದೆಯ ಪುತ್ರರು
  alternative: ನಿಮ್ಮ ತಂದೆಯ ಮಕ್ಕಳು
  rationale: ಮೂಲದಲ್ಲಿ τέκνα ಅಲ್ಲ, υἱοί ಇದೆ. ಆದ್ದರಿಂದ ಶಿಷ್ಯರೆಲ್ಲರನ್ನೂ ಒಳಗೊಳ್ಳುವ ಸಂದರ್ಭಾತ್ಮಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಒಪ್ಪಿಕೊಂಡಿದ್ದರೂ, ಮೂಲದ ಪುತ್ರತ್ವದ ಭಾಷೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: γένησθε ಮತ್ತು ದೈವಿಕ ಪುತ್ರತ್ವದ ಸಂಬಂಧ
  choice: ಪುತ್ರರಾಗುವಂತೆ
  alternative: ಪುತ್ರರೆಂದು ತೋರಿಬರುವಂತೆ / ಪುತ್ರರಾಗಿರುವಂತೆ
  rationale: ‘ಆಗುವುದು’ ಎಂಬ ಮೂಲ ಕ್ರಿಯಾರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಆದರೆ ಮಾನವ ಕ್ರಿಯೆಗಳು ರಕ್ಷಣಾತ್ಮಕ ದತ್ತಪುತ್ರತ್ವವನ್ನು ಉಂಟುಮಾಡುತ್ತವೆ ಎಂಬ ವ್ಯವಸ್ಥಿತ ತಾತ್ವಿಕ ನಿರ್ಣಯವನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವ ಶೈಲಿ. ‘ಆತನು’ ದೇವರನ್ನು ಸೂಚಿಸುವ ಗೌರವಸೂಚಕ ರೂಪ. ಸಮಾಂತರ ಜೋಡಿಗಳ ಲಯ ಮತ್ತು ದೇವರ ಸಮಾನ ದಯೆಯ ನೈತಿಕ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ.
