id: MAT.5.37
reference: Matthew 5:37
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: kn
  text: ಆದರೆ ನಿಮ್ಮ ಮಾತು ‘ಹೌದು, ಹೌದು’ ಅಥವಾ ‘ಇಲ್ಲ, ಇಲ್ಲ’ ಎಂದಷ್ಟೇ ಇರಲಿ. ಇವುಗಳಿಗಿಂತ ಹೆಚ್ಚಿನದ್ದು ದುಷ್ಟನಿಂದ ಬರುತ್ತದೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಕೆಡುಕಿನಿಂದ ಬರುತ್ತದೆ.” ಗ್ರೀಕ್‌ನ τοῦ πονηροῦ ಎಂಬ ಪದಬಂಧವನ್ನು ವೈಯಕ್ತಿಕವಾಗಿ “ದುಷ್ಟನಿಂದ” ಎಂದಾಗಲಿ, ನಿರ್ವ್ಯಕ್ತಿಕವಾಗಿ “ಕೆಡುಕಿನಿಂದ” ಎಂದಾಗಲಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: ಎಂದಾಗಲಿ
  rationale: εἰμί ಕ್ರಿಯಾಪದದ ತೃತೀಯ ಪುರುಷ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕ ರೂಪದ ಬೋಧನಾತ್ಮಕ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಎಂದಾಗಲಿ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: λόγος
  choice: ಮಾತು
  rationale: ಇಲ್ಲಿ λόγος ಸಾಮಾನ್ಯ ಸಂಭಾಷಣೆಯಲ್ಲಿ ಒಬ್ಬನು ಹೇಳುವ ಮಾತನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಮಾತು’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು ಸೂಕ್ತವಾಗಿದೆ.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘ಹೌದು, ಹೌದು’ ... ‘ಇಲ್ಲ, ಇಲ್ಲ’
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ಪದಗಳ ದ್ವಿರುಕ್ತಿಯನ್ನು ಅದರ ಒತ್ತು ಮತ್ತು ಲಯದೊಂದಿಗೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: περισσὸν τούτων
  choice: ಇವುಗಳನ್ನು ಮೀರಿದದ್ದು
  rationale: περισσόν ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದ್ದು, ಈಗ ಹೇಳಿದ ಸರಳ ಹೌದು/ಇಲ್ಲ ಎಂಬುದಕ್ಕಿಂತ ಹೆಚ್ಚಾದದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ; τούτων ನ ಬಹುವಚನವನ್ನೂ ‘ಇವುಗಳನ್ನು’ ಎಂಬುದರಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐκ
  choice: -ನಿಂದ ಬರುತ್ತದೆ
  rationale: ἐκ ಮೂಲ ಅಥವಾ ಉಗಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಪೂರ್ಣ ಮತ್ತು ಸಹಜ ವಾಕ್ಯಕ್ಕಾಗಿ ‘ನಿಂದ ಬರುತ್ತದೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: τοῦ πονηροῦ
  choice: ದುಷ್ಟನಿಂದ
  rationale: ಲೇಖಸಹಿತ ಏಕವಚನ ರೂಪವು ವೈಯಕ್ತಿಕವಾಗಿ ‘ದುಷ್ಟನು’ ಅಥವಾ ನಿರ್ವ್ಯಕ್ತಿಕವಾಗಿ ‘ಕೆಡುಕು’ ಎಂದು ಅರ್ಥವಾಗಬಹುದು. ಮತ್ತಾಯನ ಬಳಕೆಯಲ್ಲಿ ವೈಯಕ್ತಿಕ ಅರ್ಥಕ್ಕೆ ಸಾಕಷ್ಟು ಬೆಂಬಲವಿರುವುದರಿಂದ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇಟ್ಟು, ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: τοῦ πονηροῦ ಎಂಬುದು ನಿರ್ವ್ಯಕ್ತಿಕ ‘ಕೆಡುಕು’ವನ್ನೋ ವೈಯಕ್ತಿಕ ‘ದುಷ್ಟನು’ವನ್ನೋ ಸೂಚಿಸುತ್ತದೆಯೇ?
  choice: ದುಷ್ಟನಿಂದ
  alternative: ಕೆಡುಕಿನಿಂದ
  rationale: ಗ್ರೀಕ್ ಪದಬಂಧವು ವ್ಯಾಕರಣದ ದೃಷ್ಟಿಯಿಂದ ಎರಡೂ ಅರ್ಥಗಳಿಗೆ ಅವಕಾಶ ಕೊಡುತ್ತದೆ. ಮತ್ತಾಯನಲ್ಲಿ ὁ πονηρός ವೈಯಕ್ತಿಕವಾಗಿ ಸೈತಾನನನ್ನು ಸೂಚಿಸುವ ಬಳಕೆ ಇರುವುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ದುಷ್ಟನು’ ಎಂಬ ಅರ್ಥವನ್ನು ಆರಿಸಲಾಗಿದೆ; ಮೂಲದ ನಿಜವಾದ ದ್ವಂದ್ವಾರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಗಾದೆಯಂತಿರುವ ಸಂಕ್ಷಿಪ್ತ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಹೌದು, ಹೌದು/ಇಲ್ಲ, ಇಲ್ಲ’ ಎಂಬ ದ್ವಿರುಕ್ತಿಯನ್ನು ಮೂಲದ ಒತ್ತು ಮತ್ತು ಲಯಕ್ಕಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
