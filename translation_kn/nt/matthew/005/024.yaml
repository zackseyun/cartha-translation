id: MAT.5.24
reference: Matthew 5:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: kn
  text: ನಿನ್ನ ಕಾಣಿಕೆಯನ್ನು ಅಲ್ಲೇ ಬಲಿಪೀಠದ ಮುಂದೆ ಬಿಟ್ಟುಬಿಡು; ಮೊದಲು ಹೋಗಿ ನಿನ್ನ ಸಹೋದರನೊಂದಿಗೆ[a] ಸಮಾಧಾನವಾಗು[b]. ನಂತರ ಬಂದು ನಿನ್ನ ಕಾಣಿಕೆಯನ್ನು ಅರ್ಪಿಸು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಸಹೋದರ’ ಎಂಬುದು ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಪದದ ಅನುವಾದ. ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಮಾಧಾನದ ತತ್ವವು ಇನ್ನಷ್ಟು ವ್ಯಾಪಕವಾಗಿ ಅನ್ವಯಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಸಂಧಾನ ಮಾಡಿಕೊ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ಬಿಟ್ಟು
  rationale: ಇಲ್ಲಿ ಕ್ರಿಯಾಪದವು ಕಾಣಿಕೆಯನ್ನು ಆ ಸ್ಥಳದಲ್ಲೇ ಇರಿಸಿ ಹೋಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಬಿಟ್ಟು’ ಎಂಬುದು ಸಹಜವೂ ಸಂದರ್ಭಕ್ಕೆ ನಿಖರವೂ ಆಗಿದೆ.
- source_word: ἐκεῖ
  choice: ಅಲ್ಲೇ
  rationale: ಕಾಣಿಕೆಯನ್ನು ಅರ್ಪಿಸುವ ಸ್ಥಳದಲ್ಲೇ ಬಿಡಬೇಕೆಂಬ ಸ್ಥಳಸೂಚಕ ಒತ್ತನ್ನು ‘ಅಲ್ಲೇ’ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ δῶρόν σου
  choice: ನಿನ್ನ ಕಾಣಿಕೆಯನ್ನು
  rationale: δῶρον ದೇವರಿಗೆ ತರುವ ಕಾಣಿಕೆ ಅಥವಾ ಅರ್ಪಣೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಬಲಿಪೀಠದ ಸಂದರ್ಭದಲ್ಲಿಯೂ ‘ಕಾಣಿಕೆ’ ಸ್ಪಷ್ಟವಾಗಿದೆ.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: ಬಲಿಪೀಠದ ಮುಂದೆ
  rationale: ಮೂಲದ ಸ್ಥಳಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὕπαγε
  choice: ಹೋಗು
  rationale: ಮುಂದಿನ ಆಜ್ಞೆಯತ್ತ ಕರೆದೊಯ್ಯುವ ಸಂಕ್ಷಿಪ್ತ ಚಲನಾಜ್ಞೆ.
- source_word: πρῶτον
  choice: ಮೊದಲು
  rationale: ಕಾಣಿಕೆ ಅರ್ಪಿಸುವುದಕ್ಕಿಂತ ಸಮಾಧಾನಕ್ಕೆ ನೀಡಿರುವ ಆದ್ಯತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: διαλλάγηθι
  choice: ಸಮಾಧಾನವಾಗು
  rationale: ನಿಷ್ಕ್ರಿಯ ಆಜ್ಞಾರೂಪದ ಸಂಬಂಧಾತ್ಮಕ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಏಕಪಕ್ಷೀಯ ಕ್ಷಮೆ ಅಥವಾ ಕೇವಲ ಮನಃಶಾಂತಿ ಎಂದು ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: τῷ ἀδελφῷ σου
  choice: ನಿನ್ನ ಸಹೋದರನೊಂದಿಗೆ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದ ‘ಜೊತೆಗೆ/ಒಂದಿಗೆ’ ಅರ್ಥದ ಮೂಲಕ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ; ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καὶ τότε ἐλθὼν
  choice: ನಂತರ ಬಂದು
  rationale: ಸಮಾಧಾನವಾದ ಬಳಿಕ ಮರಳಿ ಬರುವ ಕಾಲಕ್ರಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: ನಿನ್ನ ಕಾಣಿಕೆಯನ್ನು ಅರ್ಪಿಸು
  rationale: ಪೂಜಾ ಸಂದರ್ಭದ πρόσφερεಗೆ ‘ಅರ್ಪಿಸು’ ಪ್ರಮಾಣಿತವೂ ಸ್ಪಷ್ಟವೂ ಆದ ಕನ್ನಡ ಪದವಾಗಿದೆ.
theological_decisions:
- issue: ಪರಸ್ಪರ ಸಂಬಂಧದ ನೀತಿಬೋಧನೆಯಲ್ಲಿ ἀδελφός ಪದದ ಅನುವಾದ
  choice: ಸಹೋದರ
  alternative: ಸಹೋದರ ಅಥವಾ ಸಹೋದರಿ; ಸಮೀಪದವನು
  rationale: ಗ್ರೀಕ್ ಪದವು ಪುಲ್ಲಿಂಗ ಏಕವಚನದಲ್ಲಿರುವುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸಹೋದರ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ. ಆದರೆ ಈ ಸಮಾಧಾನದ ತತ್ವವು ಸಂದರ್ಭಾನುಸಾರ ಇನ್ನಷ್ಟು ವ್ಯಾಪಕವಾಗಿ ಅನ್ವಯಿಸಬಹುದು ಎಂಬುದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- issue: διαλλάγηθι ಎಂಬ ನಿಷ್ಕ್ರಿಯ ಆಜ್ಞೆಯ ಸಂಬಂಧಾತ್ಮಕ ಸ್ವರೂಪ
  choice: ಸಮಾಧಾನವಾಗು
  alternative: ಸಂಧಾನ ಮಾಡಿಕೊ; ಸಂಬಂಧವನ್ನು ಸರಿಪಡಿಸಿಕೊ
  rationale: ಮುಖ್ಯ ಅನುವಾದವು ವ್ಯಕ್ತಿಯು ಮತ್ತೊಬ್ಬನೊಂದಿಗೆ ಸಮಾಧಾನದ ಸ್ಥಿತಿಗೆ ಬರಬೇಕೆಂಬ ಮೂಲದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ಬದಲಿ ರೂಪಗಳು ಕ್ರಿಯಾಶೀಲ ಪ್ರಯತ್ನವನ್ನು ಹೆಚ್ಚು ಸ್ಪಷ್ಟಪಡಿಸಿದರೂ ಮೂಲದ ನಿಷ್ಕ್ರಿಯ ರೂಪವನ್ನು ಮಸುಕಾಗಿಸಬಹುದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಆಜ್ಞಾರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಬಲಿಪೀಠ,’ ‘ಕಾಣಿಕೆ,’ ‘ಅರ್ಪಿಸು’ ಎಂಬ ಪದಗಳು ಆರಾಧನಾ ಸಂದರ್ಭವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತವೆ. ಮೂಲದಲ್ಲಿರುವ ಕ್ರಮ—ಬಿಟ್ಟು ಹೋಗುವುದು, ಮೊದಲು ಸಮಾಧಾನವಾಗುವುದು, ನಂತರ ಬಂದು ಅರ್ಪಿಸುವುದು—ವಾಕ್ಯ ವಿನ್ಯಾಸದಲ್ಲಿಯೇ ಕಾಪಾಡಲಾಗಿದೆ.
