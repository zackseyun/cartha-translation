revisions:
- from: ಅದೇ ರೀತಿಯಲ್ಲಿ, ನಿಮ್ಮ ಬೆಳಕು ಜನರ ಮುಂದೆ ಪ್ರಕಾಶಿಸಲಿ; ಆಗ ಅವರು ನಿಮ್ಮ ಒಳ್ಳೆಯ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ, ಪರಲೋಕಗಳಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆಯನ್ನು ಮಹಿಮೆಪಡಿಸುವರು.[a]
  to: ಹೀಗೆಯೇ ನಿಮ್ಮ ಬೆಳಕು ಜನರ ಮುಂದೆ ಪ್ರಕಾಶಿಸಲಿ, ಅವರು ನಿಮ್ಮ ಒಳ್ಳೆಯ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಪರಲೋಕಗಳಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆಯನ್ನು ಮಹಿಮೆಪಡಿಸುವಂತೆ.
  rationale: The revision directly represents the purposive force of ὅπως and its two coordinated aorist subjunctives while preserving the verse’s public, dignified Kannada register. It retains “ಜನರ” for the inclusive generic sense of ἀνθρώπων and “ಪರಲೋಕಗಳಲ್ಲಿರುವ” for the plural οὐρανοῖς. No footnote is needed because the revised wording itself conveys the relevant grammatical distinction.
