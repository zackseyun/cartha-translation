id: MAT.5.16
reference: Matthew 5:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: kn
  text: ಹೀಗೆಯೇ ನಿಮ್ಮ ಬೆಳಕು ಜನರ ಮುಂದೆ ಪ್ರಕಾಶಿಸಲಿ, ಅವರು ನಿಮ್ಮ ಒಳ್ಳೆಯ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಪರಲೋಕಗಳಲ್ಲಿರುವ ನಿಮ್ಮ ತಂದೆಯನ್ನು ಮಹಿಮೆಪಡಿಸುವಂತೆ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: ಅದೇ ರೀತಿಯಲ್ಲಿ
  rationale: ಹಿಂದಿನ ದೀಪ ಮತ್ತು ಬೆಳಕಿನ ದೃಷ್ಟಾಂತಕ್ಕೆ ಈ ವಾಕ್ಯವನ್ನು ಜೋಡಿಸಿ, ಕೇವಲ ತೀವ್ರತೆಯನ್ನಲ್ಲದೆ ಮಾಡುವ ರೀತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: λαμψάτω
  choice: ಪ್ರಕಾಶಿಸಲಿ
  rationale: ಮೂರನೇ ಪುರುಷ ಏಕವಚನ ಆಜ್ಞಾರ್ಥದ ಬಲವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ φῶς ὑμῶν
  choice: ನಿಮ್ಮ ಬೆಳಕು
  rationale: ಗ್ರೀಕ್‌ನ ಏಕವಚನವನ್ನು ಮತ್ತು ಶಿಷ್ಯರ ಸಾಮೂಹಿಕ ಸಾಕ್ಷಿಯ ಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: ಜನರ ಮುಂದೆ
  rationale: ἀνθρώπων ಇಲ್ಲಿ ಗಂಡಸರಿಗಷ್ಟೇ ಸೀಮಿತವಾಗದೆ ಮಾನವರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಆ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ὅπως
  choice: ಆಗ
  rationale: ಇಲ್ಲಿ ಉದ್ದೇಶ ಮತ್ತು ನಿರೀಕ್ಷಿತ ಫಲ ಎರಡಕ್ಕೂ ಅವಕಾಶವಿರುವ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಮುಂದಿನ ಕ್ರಿಯೆಗಳೊಂದಿಗೆ ವಾಕ್ಯವನ್ನು ಸರಾಗವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: ἴδωσιν
  choice: ನೋಡಿ
  rationale: ὅπως ನಂತರದ ಅಧೀನ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸಂಯೋಜಕ ಕ್ರಿಯಾರೂಪದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὰ καλὰ ἔργα
  choice: ನಿಮ್ಮ ಒಳ್ಳೆಯ ಕಾರ್ಯಗಳನ್ನು
  rationale: καλά ಎಂಬುದರ ನೈತಿಕವಾಗಿ ಒಳ್ಳೆಯ, ಶ್ಲಾಘನೀಯ ಕಾರ್ಯಗಳ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: δοξάσωσιν
  choice: ಮಹಿಮೆಪಡಿಸುವರು
  rationale: ದೇವರಿಗೆ ಮಹಿಮೆ ಸಲ್ಲಿಸುವ ಅರ್ಥವನ್ನು ಹೊರುವ ಸಾಂಪ್ರದಾಯಿಕವಾಗಿಯೂ ಗ್ರಾಹ್ಯವಾಗಿಯೂ ಇರುವ ಪದ.
- source_word: τὸν πατέρα ὑμῶν
  choice: ನಿಮ್ಮ ತಂದೆಯನ್ನು
  rationale: ಮತ್ತಾಯನಲ್ಲಿನ ಸಂಬಂಧಾತ್ಮಕ ಪಿತೃಭಾಷೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: ಪರಲೋಕಗಳಲ್ಲಿರುವ
  rationale: ಗ್ರೀಕ್‌ನ ಬಹುವಚನ οὐρανοῖς ಅನ್ನು ಉಳಿಸುತ್ತಾ, ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಮತ್ತು ಅರ್ಥಗರ್ಭಿತ ರೂಪವನ್ನು ಬಳಸುತ್ತದೆ.
theological_decisions:
- issue: ἀνθρώπων ಎಂಬ ಸಾಮಾನ್ಯ ಮಾನವಸೂಚಕ ಪದ
  choice: ಜನರ ಮುಂದೆ
  alternative: ಮನುಷ್ಯರ ಮುಂದೆ / ಗಂಡಸರ ಮುಂದೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಎಲ್ಲ ಮಾನವರನ್ನೂ ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. 'ಜನರ' ಎಂಬುದು ಲಿಂಗಸೀಮೆಯನ್ನು ತಪ್ಪಿಸಿ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನಿಖರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- issue: ὅπως ಸೂಚಿಸುವ ಉದ್ದೇಶ ಅಥವಾ ಫಲ
  choice: ಆಗ ಅವರು ... ನೋಡಿ ... ಮಹಿಮೆಪಡಿಸುವರು
  alternative: ಅವರು ... ನೋಡಿ ... ಮಹಿಮೆಪಡಿಸುವಂತೆ
  rationale: ὅπως ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸಬಹುದಾದರೂ ನಿರೀಕ್ಷಿತ ಫಲದ ಛಾಯೆಯನ್ನೂ ಹೊರುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯವು ಎರಡನ್ನೂ ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಬೇರ್ಪಡಿಸದೆ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಪರ್ಯಾಯವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- issue: οὐρανοῖς ಎಂಬ ಬಹುವಚನ
  choice: ಪರಲೋಕಗಳಲ್ಲಿರುವ
  alternative: ಪರಲೋಕದಲ್ಲಿರುವ
  rationale: ಮೂಲ ಗ್ರೀಕ್‌ನ ಬಹುವಚನವನ್ನು ಸಮತಟ್ಟಾಗಿಸದೆ ಉಳಿಸಲಾಗಿದೆ; ಇದು ಪ್ರತ್ಯೇಕ ಸ್ವರ್ಗಶಾಸ್ತ್ರೀಯ ವ್ಯವಸ್ಥೆಯನ್ನು ಪ್ರತಿಪಾದಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಪಠಣಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. 'ಪ್ರಕಾಶಿಸಲಿ' ಮತ್ತು 'ಮಹಿಮೆಪಡಿಸುವರು' ಎಂಬ ಪದಗಳು ಬೈಬಲೀಯ ಘನತೆಯನ್ನು ಉಳಿಸುತ್ತವೆ; 'ಜನರ ಮುಂದೆ' ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
