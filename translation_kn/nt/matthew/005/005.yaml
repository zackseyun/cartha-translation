  naturalness: The sentence is clear and suitably dignified in modern standard Kannada. 'ಸ್ವಾಸ್ತ್ಯವಾಗಿ ಪಡೆಯುವರು' is a more precise and still natural biblical-register expression for receiving an inheritance.
