id: MAT.5.5
reference: Matthew 5:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: kn
  text: ಸೌಮ್ಯರು[a] ಧನ್ಯರು; ಏಕೆಂದರೆ ಅವರೇ ಭೂಮಿಯನ್ನು[b] ಸ್ವಾಸ್ತ್ಯವಾಗಿ ಪಡೆಯುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಮೃದುಸ್ವಭಾವದವರು’; ಇಲ್ಲಿ ಸೌಮ್ಯತೆ ಎಂದರೆ ವಿನಯದಿಂದ ಕೂಡಿದ ಮೃದುಸ್ವಭಾವವೇ ಹೊರತು ಬಲಹೀನತೆಯಲ್ಲ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ದೇಶವನ್ನು’; ಈ ಮಾತು ಬಹುಶಃ ಕೀರ್ತನೆ 37:11ನ್ನು ಪ್ರತಿಧ್ವನಿಸುತ್ತದೆ. ಅಲ್ಲಿ ವಾಗ್ದಾನವನ್ನು ಒಡಂಬಡಿಕೆಯ ದೇಶದ ಅರ್ಥದಲ್ಲಿಯೂ, ಇನ್ನಷ್ಟು ವಿಶಾಲವಾದ ಅರ್ಥದಲ್ಲಿಯೂ ಗ್ರಹಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: ಧನ್ಯರು
  rationale: ದೇವರ ಅನುಗ್ರಹ ಮತ್ತು ಅದರ ಫಲವಾದ ನಿಜವಾದ ಸುಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಧನ್ಯವಚನದ ಸಹಜ ಹಾಗೂ ಘನವಾದ ಕನ್ನಡ ರೂಪ; ಕೇವಲ ಭಾವನಾತ್ಮಕ ಸಂತೋಷಕ್ಕೆ ಇದನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: οἱ πραεῖς
  choice: ಸೌಮ್ಯರು
  rationale: πραεῖς ಎಂಬುದು ಬಲಹೀನತೆಯನ್ನಲ್ಲ, ವಿನಯದಿಂದ ಕೂಡಿದ ಮೃದುಸ್ವಭಾವ ಮತ್ತು ನಿಯಂತ್ರಿತ ಬಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಸೌಮ್ಯರು’ ಸಹಜವಾಗಿ ಈ ಮುಖ್ಯ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ; ‘ದೀನರು’ ಪರ್ಯಾಯವಾಗಿದ್ದರೂ ಅದು ಬಡತನ ಅಥವಾ ಹೀನಸ್ಥಿತಿಯ ಅರ್ಥವನ್ನೂ ಸೂಚಿಸಬಹುದು.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಧನ್ಯರೆಂದು ಹೇಳುವುದಕ್ಕೆ ಆಧಾರವಾದ ಕಾರಣವನ್ನು ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಯಿಸುತ್ತದೆ.
- source_word: αὐτοὶ
  choice: ಅವರೇ
  rationale: ಗ್ರೀಕ್‌ನ ಒತ್ತಿಹೇಳುವ ಸರ್ವನಾಮದ ಬಲವನ್ನು ಕನ್ನಡದ ‘ಏ’ ಪ್ರತ್ಯಯದ ಮೂಲಕ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: κληρονομήσουσι
  choice: ಆಸ್ತಿಯಾಗಿ ಪಡೆಯುವರು
  rationale: κληρονομέω ಎಂಬ ಕ್ರಿಯೆಯ ಆನುವಂಶಿಕ ಆಸ್ತಿ ಅಥವಾ ವಾಗ್ದತ್ತ ಸ್ವಾಸ್ತ್ಯವನ್ನು ಪಡೆಯುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ‘ಹೊಂದುವರು’ ಎನ್ನುವುದಕ್ಕಿಂತ ವಾಗ್ದಾನದ ಭಾಷೆಯನ್ನು ಚೆನ್ನಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: τὴν γῆν
  choice: ಭೂಮಿಯನ್ನು
  rationale: γῆ ಎಂಬ ಪದದ ವಿಶಾಲವಾದ ‘ಭೂಮಿ/ಲೋಕ’ ಅರ್ಥಕ್ಕೆ ಸಹಜವಾದ ಮುಖ್ಯಪಠ್ಯ ರೂಪ. ಕೀರ್ತನೆ 37:11ರ ಪ್ರತಿಧ್ವನಿಯಲ್ಲಿ ‘ದೇಶ’ ಎಂಬ ಒಡಂಬಡಿಕೆಯ ಅರ್ಥವೂ ಸಾಧ್ಯವಾಗಿರುವುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: τὴν γῆν ಎಂಬ ಪದಗುಚ್ಛದ ವ್ಯಾಪ್ತಿ
  choice: ಭೂಮಿಯನ್ನು
  alternative: ದೇಶವನ್ನು
  rationale: γῆ ಇಡೀ ಭೂಮಿಯನ್ನಾಗಲಿ ನಿರ್ದಿಷ್ಟ ದೇಶವನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು. ಮುಖ್ಯಪಠ್ಯದಲ್ಲಿ ವಿಶಾಲವಾದ ವಾಗ್ದಾನವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುವ ‘ಭೂಮಿ’ ಆಯ್ಕೆಗೊಂಡಿದೆ; ಆದರೆ ಕೀರ್ತನೆ 37:11ರ ಒಡಂಬಡಿಕೆಯ ದೇಶದ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಪರ್ಯಾಯವಾಗಿ ಉಳಿಸುವುದರಿಂದ ಮೂಲದಲ್ಲಿರುವ ಅರ್ಥದ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವಂತೆ, ಆದರೆ ಧನ್ಯವಚನಕ್ಕೆ ತಕ್ಕ ಘನತೆಯೊಂದಿಗೆ ರಚಿಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನ ಸಂಕ್ಷಿಪ್ತ ವಿನ್ಯಾಸ, ಕಾರಣಸೂಚಕ ಸಂಬಂಧ ಮತ್ತು αὐτοὶಯ ಒತ್ತನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
