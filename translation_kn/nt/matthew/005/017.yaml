id: MAT.5.17
reference: Matthew 5:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: kn
  text: “ನಾನು ಧರ್ಮಶಾಸ್ತ್ರವನ್ನಾಗಲಿ ಪ್ರವಾದಿಗಳನ್ನಾಗಲಿ ರದ್ದುಮಾಡಲು ಬಂದೆನು[a] ಎಂದು ಭಾವಿಸಬೇಡಿ. ನಾನು ರದ್ದುಮಾಡಲು ಬಂದಿಲ್ಲ, ಆದರೆ ನೆರವೇರಿಸಲು ಬಂದೆನು[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಬಂದಿದ್ದೇನೆ.’ ‘ಬಂದೆನು’ ಇರುವ ಎರಡೂ ಸಂದರ್ಭಗಳಿಗೆ ಇದು ಅನ್ವಯಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ‘ನೆರವೇರಿಸಲು’ ಎಂಬುದನ್ನು ‘ಪೂರ್ಣಗೊಳಿಸಲು’ ಅಥವಾ ‘ಪೂರ್ಣ ಅಭಿವ್ಯಕ್ತಿಗೆ ತರಲು’ ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: ಎಂದು ಭಾವಿಸಬೇಡಿ
  rationale: μή ಜೊತೆಯ ಅಓರಿಸ್ಟ್ ಸಬ್ಜಂಕ್ಟಿವ್ ನಿಷೇಧಾರ್ಥಕವಾಗಿದೆ. ‘ಭಾವಿಸಬೇಡಿ’ ಎಂಬುದು ನೇರವೂ ಸಹಜವೂ ಆದ ಆಧುನಿಕ ಕನ್ನಡ ಪ್ರಯೋಗ.
- source_word: ἦλθον
  choice: ಬಂದೆನು
  rationale: ಸರಳ ಅಓರಿಸ್ಟ್ ರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಬಂದೆನು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಸಂದರ್ಭಾನುಸಾರ ‘ಬಂದಿದ್ದೇನೆ’ ಎಂಬ ಅರ್ಥವೂ ಸಾಧ್ಯವಾಗಿರುವುದರಿಂದ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: καταλῦσαι
  choice: ರದ್ದುಮಾಡಲು
  rationale: ಇಲ್ಲಿ ಭೌತಿಕವಾಗಿ ನಾಶಮಾಡುವುದು ಎಂಬುದಕ್ಕಿಂತ ಧರ್ಮಶಾಸ್ತ್ರ ಅಥವಾ ಪ್ರವಾದಿಗಳ ಗ್ರಂಥಗಳನ್ನು ಅಮಾನ್ಯಗೊಳಿಸುವುದು, ತಳ್ಳಿಹಾಕುವುದು ಎಂಬ ಅರ್ಥ ಮುಖ್ಯ. ‘ರದ್ದುಮಾಡು’ ಈ ಸಂದರ್ಭದ ಕಾನೂನುಸಂಬಂಧಿತ ಬಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸν νόμον
  choice: ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು
  rationale: ‘ಧರ್ಮಶಾಸ್ತ್ರ’ ಎಂಬ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದವು ಸಾಮಾನ್ಯ ನಿಯಮವನ್ನಲ್ಲ, ಇಸ್ರಾಯೇಲಿನ ತೋರಾ/ಮೋಶೆಯ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τοὺς προφήτας
  choice: ಪ್ರವಾದಿಗಳ ಗ್ರಂಥಗಳನ್ನು
  rationale: ‘ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳು’ ಎಂಬ ಶಾಸ್ತ್ರಸಂಗ್ರಹದ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಗ್ರಂಥಗಳನ್ನು’ ಸೇರಿಸಲಾಗಿದೆ; ಇದು ಕೇವಲ ಪ್ರವಾದಿ ವ್ಯಕ್ತಿಗಳನ್ನು ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: ἀλλὰ πληρῶσαι
  choice: ನೆರವೇರಿಸಲು
  rationale: ‘ನೆರವೇರಿಸು’ ಎಂಬುದು ಪೂರ್ಣಗೊಳಿಸು, ಉದ್ದೇಶಿತ ಪೂರ್ಣತೆಗೆ ತರು, ಸಂಪೂರ್ಣ ಅಭಿವ್ಯಕ್ತಿಗೆ ತರು ಎಂಬ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಒಂದೇ ನಿರ್ದಿಷ್ಟ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: πληρῶσαι ಎಂಬ ಪದದಲ್ಲಿ ಯೇಸು ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಪ್ರವಾದಿಗಳೊಂದಿಗೆ ಹೊಂದಿರುವ ಸಂಬಂಧ
  choice: ನೆರವೇರಿಸಲು
  alternative: ಪೂರ್ಣಗೊಳಿಸಲು; ಪೂರ್ಣ ಅಭಿವ್ಯಕ್ತಿಗೆ ತರಲು; ದೃಢಪಡಿಸಲು
  rationale: ಪದದ ಅರ್ಥದ ಕುರಿತು ವಿವಿಧ ಧಾರ್ಮಿಕ ಪರಂಪರೆಗಳಲ್ಲಿ ಭಿನ್ನ ವಿವರಣೆಗಳಿವೆ. ‘ನೆರವೇರಿಸಲು’ ಎಂಬ ವಿಶಾಲ ಪದವು ಆ ದೇವತಾಶಾಸ್ತ್ರೀಯ ಒತ್ತಡವನ್ನು ಉಳಿಸಿ, ಒಂದೇ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯಪಾಠದಲ್ಲಿ ಹೇರದಂತೆ ಮಾಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ಯೇಸುವಿನ ಮಾತಿಗೆ ಸಾಂಪ್ರದಾಯಿಕ ಗೌರವದ ‘ಬಂದೆನು’ ರೂಪ ಉಳಿಸಲಾಗಿದೆ. ‘ಧರ್ಮಶಾಸ್ತ್ರ’ ಮತ್ತು ‘ಪ್ರವಾದಿಗಳ ಗ್ರಂಥಗಳು’ ಎಂಬ ಪದಗಳು ಶಾಸ್ತ್ರಸಂಗ್ರಹದ ಸೂಚನೆಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.
