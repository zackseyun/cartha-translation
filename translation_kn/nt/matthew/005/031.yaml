source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: kn
  text: 'ಇದಲ್ಲದೆ, ಹೀಗೆ ಹೇಳಲಾಗಿತ್ತು: “ತನ್ನ ಹೆಂಡತಿಗೆ ವಿಚ್ಛೇದನ ನೀಡುವವನು ಆಕೆಗೆ ವಿಚ್ಛೇದನ ಪತ್ರವನ್ನು ಕೊಡಲಿ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ತನ್ನ ಹೆಂಡತಿಯನ್ನು ಕಳುಹಿಸಿಬಿಡುವವನು … ವಿಚ್ಛೇದನ ಪತ್ರವನ್ನು ಕೊಡಲಿ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದಕ್ಕೆ “ಕಳುಹಿಸಿಬಿಡು” ಎಂಬ ಅರ್ಥವೂ ಇದೆ; ಆದರೆ ಇಲ್ಲಿ ದಾಂಪತ್ಯದ ಕಾನೂನು ಸನ್ನಿವೇಶದಲ್ಲಿ ಅದು ವಿಚ್ಛೇದನವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: ಎಂದು ಹೇಳಲಾಗಿತ್ತು
  rationale: ಮತ್ತಾಯನ ಈ ಉಲ್ಲೇಖ-ಪರಿಚಯ ಸೂತ್ರದಲ್ಲಿ ಭೂತಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಮೂಲದ ಅನಿರ್ದಿಷ್ಟ ಕರ್ತೃಭಾವವನ್ನು ಉಳಿಸುವಂತೆಯೂ ನೀಡುತ್ತದೆ.
- source_word: δέ
  choice: ಇದಲ್ಲದೆ
  rationale: ಹಿಂದಿನ ಬೋಧನಾ ಘಟಕದಿಂದ ಹೊಸದಕ್ಕೆ ಸಾಗುವ ಸಂಕ್ರಮಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಅತಿಯಾಗಿ ವಿರೋಧಾರ್ಥ ಹೇರದೆ ಪ್ರವಚನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: Ὃς ἂν
  choice: …ವನು
  rationale: ಅನಿರ್ದಿಷ್ಟ ಸಾಮಾನ್ಯ ಷರತ್ತನ್ನು ಕನ್ನಡದ ಸಂಬಂಧಾರ್ಥಕ ‘ಯಾರು…ಅವನು’ ಎಂಬ ಭಾರವಾದ ರಚನೆಯ ಬದಲು ಸಹಜವಾದ ‘…ವನು’ ರೂಪದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀπολύσῃ
  choice: ವಿಚ್ಛೇದನ ನೀಡುವ
  rationale: ἀπολύω ಸಾಮಾನ್ಯವಾಗಿ ‘ಕಳುಹಿಸಿಬಿಡು’ ಎಂದಾಗಬಹುದಾದರೂ, ಹೆಂಡತಿ ಮತ್ತು ἀποστάσιον ಇರುವ ಈ ಕಾನೂನುಬದ್ಧ ದಾಂಪತ್ಯ ಸನ್ನಿವೇಶದಲ್ಲಿ ವಿಚ್ಛೇದನವೇ ಉದ್ದೇಶಿತ ಅರ್ಥ.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ತನ್ನ ಹೆಂಡತಿಗೆ
  rationale: ಸ್ವಾಮ್ಯಸೂಚಕ ಮತ್ತು ವಿಚ್ಛೇದನದ ಸನ್ನಿವೇಶವು γυνήಗೆ ‘ಹೆಂಡತಿ’ ಎಂಬ ಅರ್ಥವನ್ನು ನಿರ್ಧರಿಸುತ್ತದೆ; αὐτοῦನ ಪುಲ್ಲಿಂಗ ಉಲ್ಲೇಖವನ್ನು ‘ತನ್ನ’ ಮತ್ತು ಕರ್ತೃರೂಪದ ಮೂಲಕ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: δότω
  choice: ಕೊಡಲಿ
  rationale: ಮೂರನೇ ಪುರುಷದ ಆಜ್ಞಾರ್ಥಕ ರೂಪವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಶಾಸನಾತ್ಮಕ ಉಲ್ಲೇಖದ ಧಾಟಿಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτῇ
  choice: ಆಕೆಗೆ
  rationale: ದತ್ತಿ ವಿಭಕ್ತಿಯ ಪರೋಕ್ಷ ಕರ್ಮವನ್ನು ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἀποστάσιον
  choice: ವಿಚ್ಛೇದನ ಪತ್ರ
  rationale: ವಿಚ್ಛೇದನವನ್ನು ದೃಢಪಡಿಸುವ ಲಿಖಿತ ಕಾನೂನು ದಾಖಲೆಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮೋಶೆಯ ವಿಚ್ಛೇದನ ವಿಧಿಗೂ ಯೇಸುವಿನ ಮುಂದಿನ ಬೋಧನೆಗೂ ಈ ಮಾತಿನ ಸಂಬಂಧ
  choice: ಇದನ್ನು ಕಾನೂನುಬದ್ಧ ಹೇಳಿಕೆಯ ಉಲ್ಲೇಖವಾಗಿ ಮಾತ್ರ ಅನುವಾದಿಸಲಾಗಿದೆ; ಈ ವಚನದಲ್ಲೇ ಒಪ್ಪಿಗೆಯನ್ನಾಗಲಿ ಖಂಡನೆಯನ್ನಾಗಲಿ ಸೇರಿಸಿಲ್ಲ.
  alternative: ವಿಚ್ಛೇದನ ಕ್ರಮವನ್ನು ಅನುಮೋದಿಸುವ ನೇರ ಆಜ್ಞೆಯಾಗಿ ಅಥವಾ ಜನಪ್ರಚಲಿತ ಅಭಿಪ್ರಾಯದ ಸರಳ ವಿವರಣೆಯಾಗಿ ಹೆಚ್ಚು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ಈ ವಚನವು ಮುಂದಿನ ವಚನದಲ್ಲಿ ಯೇಸು ಪ್ರತಿಕ್ರಿಯಿಸುವ ಹಿಂದಿನ ಹೇಳಿಕೆಯನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ವಿಚ್ಛೇದನದ ನೀತಿಶಾಸ್ತ್ರದ ವಿಶಾಲ ಚರ್ಚೆಯನ್ನು ಇಲ್ಲಿ ಮುಂಚಿತವಾಗಿ ತೀರ್ಮಾನಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಧಾಟಿ ಬಳಸಲಾಗಿದೆ. ಕಾನೂನುಬದ್ಧ ಉಲ್ಲೇಖದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಪದಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
