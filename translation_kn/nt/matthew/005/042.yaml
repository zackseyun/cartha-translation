id: MAT.5.42
reference: Matthew 5:42
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: kn
  text: ನಿನ್ನನ್ನು ಕೇಳುವವನಿಗೆ ಕೊಡು; ನಿನ್ನಿಂದ ಸಾಲವಾಗಿ ಪಡೆಯಲು ಬಯಸುವವನಿಗೆ ಬೆನ್ನು ತಿರುಗಿಸಬೇಡ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿನ್ನಿಂದ ಸಾಲವಾಗಿ ಪಡೆಯಲು ಬಯಸುವವನನ್ನು ನಿರಾಕರಿಸಬೇಡ.’
    reason: ἀποστραφῇς ಎಂಬ ಪದದ ರೂಪಕಾತ್ಮಕ ‘ಬೆನ್ನು ತಿರುಗಿಸು’ ಮತ್ತು ಸಂದರ್ಭಾನುಸಾರವಾದ ‘ನಿರಾಕರಿಸು’ ಎಂಬ ಎರಡೂ ಸಹಜ ಅರ್ಥಸಾಧ್ಯತೆಗಳನ್ನು ದಾಖಲಿಸಲು.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: ಕೇಳುವವನಿಗೆ
  rationale: ಲೇಖಸಹಿತ ವರ್ತಮಾನ ಕೃದಂತವು ಸಾಮಾನ್ಯವಾಗಿ ಕೇಳುವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕೇಳುವವನಿಗೆ’ ಎಂಬುದು ಸಹಜವಾಗಿದ್ದು ಮೂಲದ ಸಾಮಾನ್ಯ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δός
  choice: ಕೊಡು
  rationale: δίδωμι ಕ್ರಿಯೆಯ ಭೂತಕಾಲಿಕ ಆಜ್ಞಾರ್ಥಕ ರೂಪ. ‘ಕೊಡು’ ನೇರ ಆಜ್ಞೆಯನ್ನು ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ಭಾವಾರ್ಥವಿಲ್ಲದೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: θέλοντα
  choice: ಬಯಸುವವನಿಗೆ
  rationale: ಲೇಖಸಹಿತ ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ವ್ಯಕ್ತಿವಾಚಕವಾಗಿ ತೆಗೆದುಕೊಳ್ಳಲಾಗಿದೆ. ‘ಬಯಸುವವನು’ θέλω ಪದದ ಉದ್ದೇಶ ಅಥವಾ ಇಚ್ಛೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ σοῦ
  choice: ನಿನ್ನಿಂದ
  rationale: ಮೂಲ ಅಥವಾ ಯಾರ ಬಳಿಯಿಂದ ಪಡೆಯಲಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಸೂಚಿಸುವ ಉಪಸರ್ಗಪದಗುಚ್ಛಕ್ಕೆ ಸರಳ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: δανίσασθαι
  choice: ಸಾಲವಾಗಿ ಪಡೆಯಲು
  rationale: ಈ ಮಧ್ಯಮರೂಪದ ಕ್ರಿಯಾಪದವು ಇಲ್ಲಿ ಸಾಲವಾಗಿ ಪಡೆಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ವಸ್ತುವನ್ನು ಮೂಲವು ನಿರ್ದಿಷ್ಟಪಡಿಸದ ಕಾರಣ ‘ಹಣ’ ಎಂದು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- source_word: μὴ ἀποστραφῇς
  choice: ಬೆನ್ನು ತಿರುಗಿಸಬೇಡ
  rationale: ನಿಷೇಧಾತ್ಮಕ ಆಜ್ಞೆಯ ಬಲವನ್ನೂ ἀποστρέφω ಪದದಲ್ಲಿರುವ ತಿರುಗಿಕೊಳ್ಳುವ ಚಿತ್ರವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ನೈತಿಕ ಆಜ್ಞೆಯ ವ್ಯಾಪ್ತಿ ಮತ್ತು ಬಲ
  choice: ಮೂಲದಲ್ಲಿರುವಂತೆ ಆಜ್ಞೆಯನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಾಮಾನ್ಯ ವ್ಯಾಪ್ತಿಯೊಂದಿಗೆ ನೀಡಲಾಗಿದೆ.
  alternative: ‘ನಿರಾಕರಿಸಬೇಡ’ ಎಂದು ಹೆಚ್ಚು ವಿವರಣಾತ್ಮಕವಾಗಿ ಭಾಷಾಂತರಿಸುವುದು, ಅಥವಾ ಅರ್ಹರೆಂದು ಪರಿಗಣಿಸಲಾದ ಕೇಳುವವರಿಗೆ ಮಾತ್ರ ಆಜ್ಞೆಯನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದು.
  rationale: ವಚನವು ಎರಡು ನೇರ ಆಜ್ಞೆಗಳನ್ನು ನೀಡುತ್ತದೆ. ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ಅರ್ಹತಾ ಷರತ್ತುಗಳನ್ನು ಸೇರಿಸದೆ ಅದರ ನೈತಿಕ ಒತ್ತಡ ಮತ್ತು ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ನೇರ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ಏಕವಚನ ಸಂಬೋಧನೆಯನ್ನು ‘ನಿನ್ನನ್ನು/ನಿನ್ನಿಂದ’ ಎಂದು ಸತತವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿ ವಸ್ತು ನಿರ್ದಿಷ್ಟವಾಗಿಲ್ಲದ ಕಾರಣ ‘ಹಣ’ ಎಂಬುದನ್ನು ಸೇರಿಸಿಲ್ಲ.
