id: MAT.5.32
reference: Matthew 5:32
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: kn
  text: 'ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ: ಲೈಂಗಿಕ ಅನೈತಿಕತೆಯ[a] ಕಾರಣವಲ್ಲದೆ ತನ್ನ ಹೆಂಡತಿಗೆ ವಿಚ್ಛೇದನ ನೀಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಅವಳು ವ್ಯಭಿಚಾರ ಮಾಡುವಂತೆ ಮಾಡುತ್ತಾನೆ[b]; ಮತ್ತು ವಿಚ್ಛೇದನ ಪಡೆದವಳನ್ನು ಮದುವೆಯಾಗುವವನು ವ್ಯಭಿಚಾರ ಮಾಡುತ್ತಾನೆ.


    [a] “ಲೈಂಗಿಕ ಅನೈತಿಕತೆ” ಎಂಬುದು ಗ್ರೀಕ್‌ನ porneia ಎಂಬ ಪದದ ಅನುವಾದ. ಇದು ಕಾನೂನುಬಾಹಿರವಾದ ಲೈಂಗಿಕ ನಡವಳಿಕೆಯನ್ನು ಸೂಚಿಸುವ ವಿಶಾಲ ಅರ್ಥದ ಪದ; ಕೆಲವರು ಇದನ್ನು “ಜಾರತ್ವ” ಅಥವಾ “ಅಶುದ್ಧ ಲೈಂಗಿಕ ನಡವಳಿಕೆ” ಎಂದು ಅನುವಾದಿಸುತ್ತಾರೆ.


    [b] ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃ: “ಅವಳು ವ್ಯಭಿಚಾರಿಣಿಯಾಗುವಂತೆ ಮಾಡುತ್ತಾನೆ.” ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಕ್ರಿಯಾಪದದ ರೂಪ ಕರ್ಮಣಿ ಪ್ರಯೋಗದಲ್ಲಿದೆ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ಲೈಂಗಿಕ ಅನೈತಿಕತೆ” ಎಂಬುದು ಗ್ರೀಕ್‌ನ porneia ಎಂಬ ಪದದ ಅನುವಾದ. ಇದು ಕಾನೂನುಬಾಹಿರವಾದ ಲೈಂಗಿಕ ನಡವಳಿಕೆಯನ್ನು ಸೂಚಿಸುವ ವಿಶಾಲ ಅರ್ಥದ ಪದ; ಕೆಲವರು ಇದನ್ನು “ಜಾರತ್ವ” ಅಥವಾ “ಅಶುದ್ಧ ಲೈಂಗಿಕ ನಡವಳಿಕೆ” ಎಂದು ಅನುವಾದಿಸುತ್ತಾರೆ.
    reason: lexical_alternative
  - marker: b
    text: 'ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃ: “ಅವಳು ವ್ಯಭಿಚಾರಿಣಿಯಾಗುವಂತೆ ಮಾಡುತ್ತಾನೆ.” ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಕ್ರಿಯಾಪದದ ರೂಪ ಕರ್ಮಣಿ ಪ್ರಯೋಗದಲ್ಲಿದೆ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: ವಿಚ್ಛೇದನ ನೀಡುವ / ವಿಚ್ಛೇದನ ಪಡೆದವಳು
  rationale: ವೈವಾಹಿಕ ಸನ್ನಿವೇಶದಲ್ಲಿ ἀπολύω ಎಂಬುದು ಸಾಮಾನ್ಯವಾಗಿ ‘ಕಳುಹಿಸಿಬಿಡು’ ಎಂಬುದಕ್ಕಿಂತ ಕಾನೂನುಬದ್ಧ ವೈವಾಹಿಕ ಅರ್ಥದಲ್ಲಿ ‘ವಿಚ್ಛೇದನ ನೀಡು’ ಎಂದರ್ಥ. ಎರಡನೆಯ ರೂಪವನ್ನು ‘ವಿಚ್ಛೇದನ ಪಡೆದವಳು’ ಎಂದು ಅನುವಾದಿಸುವುದು ಅದರ ಕರ್ಮಣಿ ರೂಪವನ್ನೂ ಸಹಜ ಕನ್ನಡವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: γυναῖκα
  choice: ಹೆಂಡತಿ
  rationale: γυνή ಪದಕ್ಕೆ ‘ಮಹಿಳೆ’ ಅಥವಾ ‘ಹೆಂಡತಿ’ ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು; ಸ್ವಾಮ್ಯಸೂಚಕ ಪದ ಮತ್ತು ವಿಚ್ಛೇದನದ ಸನ್ನಿವೇಶ ಇಲ್ಲಿ ‘ಹೆಂಡತಿ’ ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.
- source_word: παρεκτὸς λόγου πορνείας
  choice: ಲೈಂಗಿಕ ಅನೈತಿಕತೆಯ ಕಾರಣವಲ್ಲದೆ
  rationale: παρεκτός ಅಪವಾದವನ್ನು ಸೂಚಿಸುತ್ತದೆ; λόγου ಇಲ್ಲಿ ಕಾರಣ ಅಥವಾ ಆಧಾರ ಎಂಬ ಅರ್ಥದಲ್ಲಿದೆ. πορνεία ನಿರ್ದಿಷ್ಟ ಒಂದೇ ಕೃತಿಗೆ ಸೀಮಿತವಾಗದೆ ಕಾನೂನುಬಾಹಿರ ಲೈಂಗಿಕ ನಡವಳಿಕೆಯನ್ನು ವಿಶಾಲವಾಗಿ ಸೂಚಿಸುವುದರಿಂದ ‘ಲೈಂಗಿಕ ಅನೈತಿಕತೆ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: ಅವಳು ವ್ಯಭಿಚಾರ ಮಾಡುವಂತೆ ಮಾಡುತ್ತಾನೆ
  rationale: ποιέω ಜೊತೆಗೆ ಬಂದಿರುವ ಕ್ರಿಯಾಪದವು ಯಾರನ್ನಾದರೂ ಒಂದು ಸ್ಥಿತಿಗೆ ಅಥವಾ ಕ್ರಿಯೆಗೆ ಕಾರಣನಾಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಹಜ ಕನ್ನಡವನ್ನು ಬಳಸಿದ್ದು, ಕರ್ಮಣಿ ರೂಪದ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: ಮದುವೆಯಾಗುವವನು
  rationale: ἐάν ಜೊತೆಯ ಅನಿರ್ದಿಷ್ಟ ಸಂಬಂಧವಾಚಕ ವಾಕ್ಯವು ಸಾಮಾನ್ಯವಾಗಿ ಅನ್ವಯಿಸುವ ಷರತ್ತನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಮದುವೆಯಾಗುವವನು’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: μοιχᾶται
  choice: ವ್ಯಭಿಚಾರ ಮಾಡುತ್ತಾನೆ
  rationale: ಈ ವರ್ತಮಾನಕಾಲದ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ವ್ಯಭಿಚಾರ ಮಾಡುತ್ತಾನೆ’ ಎಂದು ಹೇಳಬಹುದು; ಗ್ರೀಕ್‌ನ ವಾಚ್ಯಭೇದವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಬಲವಂತವಾಗಿ ತೋರಿಸುವುದಿಲ್ಲ.
- source_word: πᾶς ὁ ἀπολύων
  choice: ವಿಚ್ಛೇದನ ನೀಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ
  rationale: ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಈ ರಚನೆ ಸಾಮಾನ್ಯವಾಗಿ ಆ ವರ್ಗದ ಪ್ರತಿಯೊಬ್ಬನನ್ನೂ ಸೂಚಿಸುತ್ತದೆ. ‘ತನ್ನ ಹೆಂಡತಿ’ ಎಂಬ ಮುಂದಿನ ಪದಸಮೂಹವು ಆ ಕಾಲದ ಪುರುಷ-ಕೇಂದ್ರಿತ ಸಾಮಾಜಿಕ ಸನ್ನಿವೇಶವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: παρεκτὸς λόγου πορνείας ಎಂಬ ಅಪವಾದದ ವ್ಯಾಪ್ತಿ
  choice: ಇದನ್ನು ನಿಜವಾದ ಅಪವಾದವಾಗಿ ‘ಲೈಂಗಿಕ ಅನೈತಿಕತೆಯ ಕಾರಣವಲ್ಲದೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಲೈಂಗಿಕ ಅನೈತಿಕತೆ ಎನ್ನುವ ವಿಷಯವಲ್ಲದೆ’ ಅಥವಾ ‘ಕಾನೂನುಬಾಹಿರ ವಿವಾಹದ ಸಂದರ್ಭವಲ್ಲದೆ’
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಸ್ಪಷ್ಟವಾಗಿ ಅಪವಾದವನ್ನು ಮುಂದಿಡುತ್ತದೆ. ಆದರೆ πορνεία ಪದದ ನಿಖರ ವ್ಯಾಪ್ತಿಯನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ಸೀಮಿತಗೊಳಿಸದೆ, ವಿಭಿನ್ನ ಧಾರ್ಮಿಕ ವ್ಯಾಖ್ಯಾನಗಳ ನಡುವಿನ ಒತ್ತಡವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ποιεῖ ನಂತರದ μοιχευθῆναι ಪದದ ಕರ್ಮಣಿ ರೂಪ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಅವಳು ವ್ಯಭಿಚಾರ ಮಾಡುವಂತೆ ಮಾಡುತ್ತಾನೆ’ ಎಂಬ ಸಹಜ ಕನ್ನಡವನ್ನು ಬಳಸಲಾಗಿದೆ; ಕರ್ಮಣಿ/ಫಲಿತಾರ್ಥದ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
  alternative: ‘ಅವಳು ವ್ಯಭಿಚಾರಿಣಿಯಾಗುವಂತೆ ಮಾಡುತ್ತಾನೆ’
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ರೂಪತಃ ಕರ್ಮಣಿಯಲ್ಲಿದೆ. ಅದು ಕ್ರಿಯಾತ್ಮಕ ಅರ್ಥವೋ ಅಥವಾ ವ್ಯಭಿಚಾರಿಣಿಯಾಗುವ ಫಲಿತಸ್ಥಿತಿಯೋ ಎಂಬ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕೃತಕವಾಗಿ ಪರಿಹರಿಸದೆ ಪಾದಟಿಪ್ಪಣಿಯ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ವಿಚ್ಛೇದನ’, ‘ಲೈಂಗಿಕ ಅನೈತಿಕತೆ’ ಮತ್ತು ‘ವ್ಯಭಿಚಾರ’ ಎಂಬ ಪದಗಳು ಕಾನೂನು-ವೈವಾಹಿಕ ಹಾಗೂ ನೈತಿಕ ಅರ್ಥಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೊರುತ್ತವೆ. ಮೂಲ ಇಂಗ್ಲಿಷ್ ಪದರದಲ್ಲಿದ್ದ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳ ವಿಷಯ-ಸ್ಥಾನ ಅಸಂಗತಿಯನ್ನು ಸರಿಪಡಿಸಿ, porneia ವಿವರಣೆಯನ್ನು ‘ಲೈಂಗಿಕ ಅನೈತಿಕತೆ’ ಬಳಿ [a] ಎಂದೂ ಕರ್ಮಣಿ ರೂಪದ ವಿವರಣೆಯನ್ನು ಸಂಬಂಧಿತ ವಾಕ್ಯಭಾಗದ ಬಳಿ [b] ಎಂದೂ ಇರಿಸಲಾಗಿದೆ.
