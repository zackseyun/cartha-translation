id: MAT.5.40
reference: Matthew 5:40
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: kn
  text: ನಿನ್ನ ವಿರುದ್ಧ ದಾವೆ ಹೂಡಿ ನಿನ್ನ ಒಳ ಉಡುಪನ್ನು ತೆಗೆದುಕೊಳ್ಳಲು ಬಯಸುವವನಿಗೆ, ನಿನ್ನ ಹೊರ ಉಡುಪನ್ನೂ ಬಿಟ್ಟುಕೊಡು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: ಬಯಸುವವನಿಗೆ
  rationale: ವಿಶೇಷಣಾತ್ಮಕವಾಗಿ ಬಳಕೆಯಾದ ವರ್ತಮಾನ ಕೃದಂತವು ಸಾಮಾನ್ಯವಾಗಿ ಇಂಥ ಕಾರ್ಯವನ್ನು ಬಯಸುವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಬಯಸುವವನಿಗೆ’ ಎಂಬುದು ಇಚ್ಛೆಯ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: σοι κριθῆναι
  choice: ನಿನ್ನ ವಿರುದ್ಧ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗಿ
  rationale: ಕ್ರಿಯಾಪದವು ಅಕ್ಷರಶಃ ನ್ಯಾಯತೀರ್ಪಿಗೆ ಒಳಪಡುವುದನ್ನು ಅಥವಾ ನ್ಯಾಯಾಲಯದಲ್ಲಿ ವ್ಯಾಜ್ಯ ನಡೆಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಸಂದರ್ಭದಲ್ಲಿ ಉಡುಪನ್ನು ಪಡೆಯಲು ಕಾನೂನು ಕ್ರಮ ಕೈಗೊಳ್ಳುವ ಅರ್ಥವಿರುವುದರಿಂದ ಈ ರೂಪವನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.[b]
- source_word: χιτῶνά
  choice: ಒಳಉಡುಪು
  rationale: χιτών ದೇಹಕ್ಕೆ ಸಮೀಪವಾಗಿ ಧರಿಸುತ್ತಿದ್ದ ಒಳಗಿನ ಉಡುಪನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಐತಿಹಾಸಿಕ ಉಡುಪುಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಒಳಉಡುಪು’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: λαβεῖν
  choice: ತೆಗೆದುಕೊಳ್ಳಲು
  rationale: ಕಾನೂನು ವ್ಯಾಜ್ಯದ ಮೂಲಕ ಉಡುಪಿನ ಸ್ವಾಧೀನ ಪಡೆಯುವ ಸರಳ ಅರ್ಥವನ್ನು ಇದು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἄφες
  choice: ಬಿಟ್ಟುಕೊಡು
  rationale: ἀφίημι ಎಂಬ ಆಜ್ಞಾರೂಪವು ಇಲ್ಲಿ ಇನ್ನೊಂದು ಉಡುಪನ್ನೂ ಅವನ ವಶಕ್ಕೆ ಬಿಡುವ ಅಥವಾ ಒಪ್ಪಿಸುವ ಅರ್ಥ ಹೊಂದಿದೆ; ‘ಬಿಟ್ಟುಕೊಡು’ ನೇರ ಆಜ್ಞೆಯ ತೀಕ್ಷ್ಣತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἱμάτιον
  choice: ಮೇಲಂಗಿ
  rationale: ἱμάτιον ಹೊರಗೆ ಧರಿಸುವ ಉಡುಪನ್ನು ಸೂಚಿಸುತ್ತದೆ ಮತ್ತು χιτώνಗೆ ಉದ್ದೇಶಿತವಾದ ವ್ಯತ್ಯಾಸವನ್ನು ‘ಮೇಲಂಗಿ’ ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: καὶ ... καὶ
  choice: ಮತ್ತು ... -ಯನ್ನೂ
  rationale: ಮೊದಲ καί ಹಿಂದಿನ ಉಪದೇಶಕ್ಕೆ ವಾಕ್ಯವನ್ನು ಜೋಡಿಸುತ್ತದೆ; ಎರಡನೆಯದು ಮೇಲಂಗಿಯನ್ನೂ ಹೆಚ್ಚುವರಿಯಾಗಿ ಬಿಟ್ಟುಕೊಡುವ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ. ಕನ್ನಡದ ‘-ಯನ್ನೂ’ ಈ ಸೇರ್ಪಡೆಯ ಒತ್ತನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಕಾನೂನು ವಿವಾದದಲ್ಲಿ ಯೇಸುವಿನ ಬೋಧನೆಯ ನೈತಿಕ ತೀಕ್ಷ್ಣತೆ
  choice: ಪ್ರತೀಕಾರ ಮಾಡದೆ, ತನ್ನ ಹಕ್ಕಿಗಿಂತಲೂ ಹೆಚ್ಚಾಗಿ ಬಿಟ್ಟುಕೊಡುವ ನೇರ ಆಜ್ಞೆಯಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ತನ್ನ ಹಕ್ಕುಗಳನ್ನು ಬಿಟ್ಟುಕೊಡುವ ಸಾಮಾನ್ಯ ತತ್ವವೆಂದು ಹೆಚ್ಚು ಸಡಿಲವಾಗಿ ಅನುವಾದಿಸುವುದು.
  rationale: ἄφες ಎಂಬ ಆಜ್ಞಾರೂಪ ಮತ್ತು ನಿರ್ದಿಷ್ಟ ಉಡುಪುಗಳ ಚಿತ್ರಣವು ತೀಕ್ಷ್ಣವಾದ, ನೇರ ಸೂಚನೆಯನ್ನು ನೀಡುತ್ತವೆ. ಆದ್ದರಿಂದ ಅದನ್ನು ರೂಪಕ ಅಥವಾ ಅಮೂರ್ತ ತತ್ವವಾಗಿ ಮೃದುಗೊಳಿಸದೆ, ಯಾವುದೇ ಪಂಥೀಯ ವ್ಯವಸ್ಥೆಯನ್ನೂ ಸೇರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗುವಂತೆ ಗೌರವಯುತ ಮತ್ತು ನೇರ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಪ್ರಾಚೀನ ಉಡುಪುಗಳ ಭೇದವನ್ನು ಅಸ್ಪಷ್ಟ ಐತಿಹಾಸಿಕ ಪದಗಳಿಂದಲ್ಲದೆ ‘ಒಳಉಡುಪು/ಮೇಲಂಗಿ’ ಎಂಬ ಕಾರ್ಯಾತ್ಮಕ ಪದಗಳಿಂದ ತಿಳಿಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ನೇರ ಏಕವಚನ ಸಂಬೋಧನೆ ಮತ್ತು ಆಜ್ಞೆಯ ಬಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
