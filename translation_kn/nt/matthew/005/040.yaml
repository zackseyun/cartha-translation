revisions:
- from: ನಿನ್ನ ವಿರುದ್ಧ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗಿ ನಿನ್ನ ಒಳಉಡುಪನ್ನು[a] ತೆಗೆದುಕೊಳ್ಳಲು ಬಯಸುವವನಿಗೆ, ನಿನ್ನ ಮೇಲಂಗಿಯನ್ನೂ ಬಿಟ್ಟುಕೊಡು.
  to: ನಿನ್ನ ವಿರುದ್ಧ ದಾವೆ ಹೂಡಿ ನಿನ್ನ ಒಳ ಉಡುಪನ್ನು ತೆಗೆದುಕೊಳ್ಳಲು ಬಯಸುವವನಿಗೆ, ನಿನ್ನ ಹೊರ ಉಡುಪನ್ನೂ ಬಿಟ್ಟುಕೊಡು.
  rationale: The revision makes the legal action idiomatic and explicit, and it clarifies the inner/outer garment contrast with natural modern Kannada wording. It retains the generic singular participant, the legal purpose of taking the inner garment, and the sharp imperative to yield the outer garment too. The stray undeclared b reference should be removed from the lexical-decision rationale; it is not a passage footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:58Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the legal setting, the intended taking of the χιτών, and the imperative to yield the ἱμάτιον as well. However, «ನಿನ್ನ ವಿರುದ್ಧ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗಿ» is understandable but less idiomatic and less specific than a Kannada expression for initiating legal action against someone.
  naturalness: «ನಿನ್ನ ವಿರುದ್ಧ ದಾವೆ ಹೂಡಿ» is more natural modern standard Kannada for “sue you.” Writing «ಒಳ ಉಡುಪು» and «ಹೊರ ಉಡುಪು» as open compounds avoids the common modern association of «ಒಳಉಡುಪು» with underwear and makes the historical inner/outer-garment contrast clearer.
  terminology: The revised terms retain the deliberate χιτών/ἱμάτιον distinction without imposing a misleadingly specific modern garment category. «ದಾವೆ ಹೂಡಿ» preserves the forensic force of κριθῆναι in context, while «ಬಿಟ್ಟುಕೊಡು» appropriately renders the direct imperative ἄφες.
  issues:
  - severity: medium
    issue: The legal phrase is somewhat awkward and underspecified.
    rationale: «ನಿನ್ನ ವಿರುದ್ಧ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗಿ» literally suggests going to court against someone, but does not idiomatically state that the person is bringing a legal claim. «ನಿನ್ನ ವಿರುದ್ಧ ದಾವೆ ಹೂಡಿ» directly and naturally conveys the contextual sense of σοι κριθῆναι.
  - severity: low
    issue: «ಒಳಉಡುಪು» may be read as modern underwear.
    rationale: Although the supplied note clarifies the meaning, the closed compound commonly has a narrower modern sense. «ಒಳ ಉಡುಪು» paired with «ಹೊರ ಉಡುಪು» better communicates the ancient garment distinction in the verse itself.
  - severity: low
    issue: An undeclared [b] footnote reference occurs in the lexical-decision rationale.
    rationale: The rationale for σοι κριθῆναι ends with [b], but no footnote b is supplied and the passage text has no b anchor. The revised footnote set retains only the actual cultural-note anchor a.
  revised_text: ನಿನ್ನ ವಿರುದ್ಧ ದಾವೆ ಹೂಡಿ ನಿನ್ನ ಒಳ ಉಡುಪನ್ನು ತೆಗೆದುಕೊಳ್ಳಲು ಬಯಸುವವನಿಗೆ, ನಿನ್ನ ಹೊರ ಉಡುಪನ್ನೂ ಬಿಟ್ಟುಕೊಡು.
