    issue: The main text renders σκανδαλίζει as “ಪಾಪದಲ್ಲಿ ಬೀಳುವಂತೆ ಮಾಡಿದರೆ.”
    rationale: This is a valid contextual interpretation but does not preserve the source’s explicit stumbling metaphor. Render “ನಿನ್ನನ್ನು ಎಡವುವಂತೆ ಮಾಡಿದರೆ” in the text and offer “ಪಾಪಮಾಡುವಂತೆ ಮಾಡಿದರೆ” in a footnote.
  - severity: low
    issue: The draft omits a lexical-alternative footnote for σκανδαλίζει.
    rationale: The English audit trail explicitly preserves “causes you to sin” as an alternative to the metaphorical primary rendering. Adding this note improves transparency without changing meaning.
  - severity: low
