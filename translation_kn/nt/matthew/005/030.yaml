review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the right hand, decisive removal, the contrast between one bodily member and the whole body, and going into Gehenna. However, σκανδαλίζει is rendered directly as causing one to fall into sin, which replaces the Greek stumbling metaphor with an interpretive contextual gloss. A primary rendering should retain the metaphor, with the sin sense supplied in a footnote.
  naturalness: The Kannada is generally clear and uses an appropriate serious modern register. “ನಿನ್ನನ್ನು ಎಡವುವಂತೆ ಮಾಡಿದರೆ” is a natural direct equivalent in this context; “ಅದನ್ನು ಕತ್ತರಿಸಿ ತೆಗೆದು, ನಿನ್ನಿಂದ ದೂರ ಎಸೆ” clearly expresses both severance and removal.
  terminology: “ಗೆಹೆನ್ನಾ” appropriately preserves γέεννα rather than imposing “ನರಕ” in the main text. The explanatory footnote should describe it as a term derived from the name of the Valley of Hinnom, rather than simply calling it a Greek word, and the lexical alternative for σκανδαλίζει should be retained.
  issues:
