id: MAT.5.30
reference: Matthew 5:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: kn
  text: ನಿನ್ನ ಬಲಗೈ ನಿನ್ನನ್ನು ಎಡವುವಂತೆ ಮಾಡಿದರೆ,[a] ಅದನ್ನು ಕತ್ತರಿಸಿ ತೆಗೆದು, ನಿನ್ನಿಂದ ದೂರ ಎಸೆ. ಏಕೆಂದರೆ, ನಿನ್ನ ಇಡೀ ದೇಹವು ಗೆಹೆನ್ನಾಕ್ಕೆ[b] ಹೋಗುವುದಕ್ಕಿಂತ ನಿನ್ನ ಅಂಗಗಳಲ್ಲಿ ಒಂದು ನಾಶವಾಗುವುದೇ ನಿನಗೆ ಉತ್ತಮ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಿನ್ನನ್ನು ಪಾಪಮಾಡುವಂತೆ ಮಾಡಿದರೆ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ಮೂಲಾರ್ಥ “ಎಡವುವಂತೆ ಮಾಡು.”
    reason: lexical_alternative
  - marker: b
    text: “ಗೆಹೆನ್ನಾ” ಎಂಬುದು ಹಿನ್ನೋಮ್ ಕಣಿವೆಯ ಹೆಸರಿನಿಂದ ಬಂದ ಗ್ರೀಕ್ ಪದ; ಇಲ್ಲಿ ಅದು ಅಂತ್ಯಕಾಲದ ತೀರ್ಪನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಇದನ್ನು “ನರಕ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: ನಿನ್ನ ಬಲಗೈ
  rationale: ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಮೂಲದಲ್ಲಿರುವ ದೇಹದ ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: σκανδαλίζει
  choice: ನಿನ್ನನ್ನು ಪಾಪದಲ್ಲಿ ಬೀಳುವಂತೆ ಮಾಡಿದರೆ
  rationale: ಕ್ರಿಯಾಪದದ ‘ಎಡವಿಸುವುದು’ ಎಂಬ ರೂಪಕದ ಜೊತೆಗೆ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಉದ್ದೇಶಿತವಾದ ಪಾಪಕ್ಕೆ ಕಾರಣವಾಗುವ ಅರ್ಥವನ್ನೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἔκκοψον
  choice: ಅದನ್ನು ಕಡಿದು
  rationale: ತಕ್ಷಣದ, ನಿರ್ಣಾಯಕ ಕ್ರಿಯೆಗೆ ನೀಡಿದ ಆಜ್ಞೆಯ ಬಲವನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: βάλε ἀπὸ σοῦ
  choice: ನಿನ್ನಿಂದ ದೂರ ಎಸೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ದೂರಮಾಡುವಿಕೆ ಮತ್ತು ತಿರಸ್ಕಾರದ ಬಲ ಎರಡನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: συμφέρει γάρ σοι
  choice: ಏಕೆಂದರೆ ... ನಿನಗೆ ಉತ್ತಮ
  rationale: ಹಣಕಾಸಿನ ಲಾಭವಲ್ಲ, ಹೋಲಿಕಾತ್ಮಕ ಒಳಿತನ್ನು ಸೂಚಿಸುವ ಸಂದರ್ಭೋಚಿತ ಕನ್ನಡ.
- source_word: ἵνα ἀπόληται
  choice: ನಾಶವಾಗುವುದೇ
  rationale: ಒಂದು ದೇಹಾಂಗದ ನಷ್ಟ ಅಥವಾ ವಿನಾಶದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἓν τῶν μελῶν σου
  choice: ನಿನ್ನ ಅಂಗಗಳಲ್ಲಿ ಒಂದು
  rationale: μέλος ಎಂಬುದು ಕೇವಲ ಕೈಕಾಲುಗಳಿಗಷ್ಟೇ ಸೀಮಿತವಲ್ಲದ ದೇಹದ ಅಂಗವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಕನ್ನಡ ರೂಪ ಸಹಜವೂ ಸಮಗ್ರವೂ ಆಗಿದೆ.
- source_word: ὅλον τὸ σῶμά σου
  choice: ನಿನ್ನ ಇಡೀ ದೇಹವು
  rationale: ಒಂದು ಅಂಗ ಮತ್ತು ಸಮಸ್ತ ದೇಹದ ನಡುವಿನ ಮೂಲದ ವ್ಯತ್ಯಾಸವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: ಗೆಹೆನ್ನಾಕ್ಕೆ ಹೋಗುವುದು
  rationale: ἀπέλθῃಯ ‘ಹೋಗು’ ಎಂಬ ಕ್ರಿಯೆಯನ್ನು ಉಳಿಸಿ, γέεννα ಎಂಬ ಐತಿಹಾಸಿಕ ಹಾಗೂ ಅಂತ್ಯಕಾಲಿಕ ನ್ಯಾಯತೀರ್ಪಿನ ಪದವನ್ನು ಲಿಪ್ಯಂತರಿಸುತ್ತದೆ.
theological_decisions:
- issue: γέεννα ಪದದ ಅನುವಾದ
  choice: ಗೆಹೆನ್ನಾ
  alternative: ನರಕ
  rationale: ಮೂಲ ಗ್ರೀಕ್ ಪದದ ಹಿನ್ನೋಮ್ ಕಣಿವೆಯ ಐತಿಹಾಸಿಕ ಚಿತ್ರಣ ಮತ್ತು ನ್ಯಾಯತೀರ್ಪಿನ ಅರ್ಥವಲಯವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ನರಕ’ ಎಂಬ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: σκανδαλίζειಯ ರೂಪಕ ಮತ್ತು ಸಂದರ್ಭೋಚಿತ ಅರ್ಥ
  choice: ಪಾಪದಲ್ಲಿ ಬೀಳುವಂತೆ ಮಾಡು
  alternative: ಎಡವುವಂತೆ ಮಾಡು
  rationale: ಮೂಲದ ಬೀಳುವಿಕೆಯ ರೂಪಕವನ್ನು ಭಾಗಶಃ ಉಳಿಸಿಕೊಂಡು, ಈ ನೈತಿಕ ಸಂದರ್ಭದಲ್ಲಿ ಉದ್ದೇಶಿತವಾದ ಪಾಪದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪಾಠವು ನಿರ್ದಿಷ್ಟ ಪಾಪಶಾಸ್ತ್ರೀಯ ವಿವರಣೆಯನ್ನು ಹೇರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ನೇರ, ಗಂಭೀರ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಆಜ್ಞೆಗಳ ತೀಕ್ಷ್ಣತೆಯನ್ನೂ ಒಂದು ಅಂಗ ಮತ್ತು ಇಡೀ ದೇಹದ ನಡುವಿನ ವಾಕ್ಚಾತುರ್ಯಪೂರ್ಣ ವ್ಯತ್ಯಾಸವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
