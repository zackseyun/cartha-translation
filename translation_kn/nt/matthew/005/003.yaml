id: MAT.5.3
reference: Matthew 5:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: kn
  text: “ಆತ್ಮದಲ್ಲಿ ಬಡವರಾಗಿರುವವರು[b] ಧನ್ಯರು[a]; ಏಕೆಂದರೆ ಪರಲೋಕದ ರಾಜ್ಯ[c] ಅವರದೇ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಧನ್ಯರು’ ಎಂಬುದನ್ನು ‘ಸುಸ್ಥಿತಿಯಲ್ಲಿರುವವರು’ ಅಥವಾ ‘ಭಾಗ್ಯವಂತರು’ ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು. ಗ್ರೀಕ್ ಪದವು ಕೇವಲ ಸಂತೋಷದ ಭಾವನೆಯನ್ನಲ್ಲ, ದೇವರ ಅನುಗ್ರಹದಿಂದ ಉಂಟಾಗುವ ಮೆಚ್ಚತಕ್ಕ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ‘ಆತ್ಮದಲ್ಲಿ ಬಡವರು’ ಎಂಬುದನ್ನು ‘ಆಧ್ಯಾತ್ಮಿಕವಾಗಿ ಬಡವರು’ ಅಥವಾ ‘ತಮ್ಮ ಆಧ್ಯಾತ್ಮಿಕ ಅಗತ್ಯವನ್ನು ಅರಿತವರು’ ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು. ಒಂದೇ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಗ್ರೀಕ್ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಅನುವಾದವು ಉಳಿಸಿದೆ.
    reason: alternative_reading
  - marker: c
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಪರಲೋಕಗಳ ರಾಜ್ಯ.’ ಇದು ಮತ್ತಾಯನು ವಿಶಿಷ್ಟವಾಗಿ ಬಳಸುವ ಅಭಿವ್ಯಕ್ತಿ; ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ‘ಪರಲೋಕದ ರಾಜ್ಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: ಧನ್ಯರು
  rationale: ದೇವರ ಅನುಗ್ರಹಕ್ಕೆ ಪಾತ್ರವಾದ, ಮೆಚ್ಚತಕ್ಕ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಪದ. ಇದು ಕೇವಲ ಮನಸ್ಸಿನ ಸಂತೋಷವೆಂಬ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತವಾಗುವುದಿಲ್ಲ.
- source_word: οἱ πτωχοὶ
  choice: ಬಡವರಾಗಿರುವವರು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಗ್ರೀಕ್ ವಿಶೇಷಣದ ಬಹುವಚನ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ‘ಭಿಕ್ಷುಕರು’ ಎನ್ನುವುದು ಅತಿಯಾಗಿ ಸಂಕುಚಿತ ಅರ್ಥ ಕೊಡುತ್ತದೆ.
- source_word: τῷ πνεύματι
  choice: ಆತ್ಮದಲ್ಲಿ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಸಂಬಂಧವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸಿ, ‘ಆಧ್ಯಾತ್ಮಿಕವಾಗಿ’ ಅಥವಾ ‘ತಮ್ಮ ಆಧ್ಯಾತ್ಮಿಕ ಅಗತ್ಯವನ್ನು ಅರಿತವರು’ ಎಂಬ ಒಂದೇ ವ್ಯಾಖ್ಯಾನಕ್ಕೆ ವಾಕ್ಯವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ. ಇಲ್ಲಿ ಪವಿತ್ರಾತ್ಮನೇ ಉದ್ದೇಶಿತನೆಂದು ಕೂಡ ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಈ ಆಶೀರ್ವಚನಕ್ಕೆ ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಸಂಯೋಜಕವನ್ನು ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: αὐτῶν ἐστιν
  choice: ಅವರದೇ
  rationale: ವರ್ತಮಾನಕಾಲದ ಸ್ವಾಮ್ಯಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಮತ್ತು ಒತ್ತಿಹೇಳುವ ರೀತಿಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅದನ್ನು ಭವಿಷ್ಯಕಾಲದ ವಾಗ್ದಾನವಾಗಿ ಬದಲಿಸುವುದಿಲ್ಲ.
- source_word: ἡ βασιλεία
  choice: ರಾಜ್ಯ
  rationale: ರಾಜನ ಆಳ್ವಿಕೆ ಮತ್ತು ಆಳ್ವಿಕೆಯ ವಲಯ—ಎರಡೂ ಆಯಾಮಗಳನ್ನು ಒಳಗೊಳ್ಳಬಲ್ಲ, ಸ್ಥಾಪಿತ ಮತ್ತು ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಪದ.
- source_word: τῶν οὐρανῶν
  choice: ಪರಲೋಕದ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಗ್ರೀಕ್ ಬಹುವಚನ ಅಭಿವ್ಯಕ್ತಿಗೆ ಸಹಜವಾದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ; ಅಕ್ಷರಶಃ ಬಹುವಚನವನ್ನು ಹೇರುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಆತ್ಮದಲ್ಲಿ ಬಡವರು’ ಎಂಬುದರ ಅರ್ಥ
  choice: ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸುವುದು.
  alternative: ‘ಆಧ್ಯಾತ್ಮಿಕವಾಗಿ ಬಡವರು,’ ‘ದೀನರು,’ ಅಥವಾ ‘ತಮ್ಮ ಆಧ್ಯಾತ್ಮಿಕ ಅಗತ್ಯವನ್ನು ಅರಿತವರು’ ಎಂದು ವಿಸ್ತರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪದಗುಚ್ಛವು ಹಲವು ಸಂಬಂಧಿತ ಅರ್ಥಸಾಧ್ಯತೆಗಳಿಗೆ ಅವಕಾಶ ಕೊಡುತ್ತದೆ. ಒಂದೇ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸುವುದು ಮೂಲದಲ್ಲಿರುವ ಧಾರ್ಮಿಕ ಮತ್ತು ಅರ್ಥವ್ಯಾಪ್ತಿಯ ತೆರೆದತನವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ಧರಿಸುತ್ತದೆ.
- issue: ರಾಜ್ಯದ ಸ್ವಾಮ್ಯದ ಕಾಲ
  choice: ἐστιν ಅನ್ನು ವರ್ತಮಾನಾರ್ಥದಲ್ಲಿ ‘ಅವರದೇ’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  alternative: ‘ಅವರದಾಗುವುದು’ ಎಂದು ಭವಿಷ್ಯಕಾಲದಲ್ಲಿ ಹೇಳುವುದು.
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ವರ್ತಮಾನಕಾಲದಲ್ಲಿದೆ; ಆದ್ದರಿಂದ ರಾಜ್ಯದ ಸಂಬಂಧವನ್ನು ಕೇವಲ ಭವಿಷ್ಯದ ಪ್ರತಿಫಲವಾಗಿ ಮಾಡಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ‘ಧನ್ಯರು’ ಮತ್ತು ‘ಪರಲೋಕದ ರಾಜ್ಯ’ ಎಂಬ ಸ್ಥಾಪಿತ ಬೈಬಲ್ ಪದಪ್ರಯೋಗಗಳನ್ನು ಉಳಿಸಿಕೊಂಡು, ವಾಕ್ಯರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡಕ್ಕೆ ಹೊಂದಿಸಲಾಗಿದೆ.
