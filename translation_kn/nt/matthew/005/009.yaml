id: MAT.5.9
reference: Matthew 5:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: kn
  text: ಸಮಾಧಾನವನ್ನು ಉಂಟುಮಾಡುವವರು ಧನ್ಯರು, ಏಕೆಂದರೆ ಅವರೇ ದೇವರ ಪುತ್ರರು[a] ಎಂದು ಕರೆಯಲ್ಪಡುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ದೇವರ ಮಕ್ಕಳು.’ ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ‘ದೇವರ ಪುತ್ರರು’ ಎಂದಿದ್ದು, ಪುಲ್ಲಿಂಗ ಬಹುವಚನದ ಪುತ್ರಸಂಬಂಧದ ಭಾಷೆಯನ್ನು ಪ್ರತಿನಿಧಿಕ ಅರ್ಥದಲ್ಲಿ ಬಳಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ಧನ್ಯರು
  rationale: ಇದು ಕೇವಲ ಮನಸ್ಸಿನ ಸಂತೋಷವನ್ನಲ್ಲ, ದೇವರ ಅನುಗ್ರಹಕ್ಕೆ ಪಾತ್ರವಾದ ಆಶೀರ್ವದಿತ ಮತ್ತು ಅಪೇಕ್ಷಣೀಯ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಸ್ಥಿರವಾದ ಧನ್ಯವಚನದ ಪದವಾಗಿದೆ.
- source_word: εἰρηνοποιοί
  choice: ಸಮಾಧಾನವನ್ನು ಉಂಟುಮಾಡುವವರು
  rationale: ಈ ಸಂಯುಕ್ತ ನಾಮಪದದ ಕರ್ತೃವಾಚಕ ಬಲವನ್ನು ಉಳಿಸಿ, ಕೇವಲ ಶಾಂತಸ್ವಭಾವಿಗಳನ್ನಲ್ಲದೆ ಸಕ್ರಿಯವಾಗಿ ಸಮಾಧಾನವನ್ನು ಸಾಧಿಸುವವರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಧನ್ಯರೆನ್ನುವುದಕ್ಕೆ ಕಾರಣ ಅಥವಾ ಆಧಾರವನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಸಂಯೋಜಕದ ಕಾರಣಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτοὶ
  choice: ಅವರೇ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಸಮಾಧಾನವನ್ನು ಉಂಟುಮಾಡುವವರೇ ಈ ಹೆಸರನ್ನು ಪಡೆಯುತ್ತಾರೆ ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: υἱοὶ θεοῦ
  choice: ದೇವರ ಪುತ್ರರು
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ಪುತ್ರಸಂಬಂಧದ ಭಾಷೆಯನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಅದರ ಪ್ರತಿನಿಧಿಕ ಮತ್ತು ಒಳಗೊಳ್ಳುವ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
- source_word: κληθήσονται
  choice: ಎಂದು ಕರೆಯಲ್ಪಡುವರು
  rationale: καλέω ಕ್ರಿಯಾಪದದ ಭವಿಷ್ಯತ್ಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ಅದನ್ನು ಕೇವಲ ಜನರ ಸಾಮಾಜಿಕ ಗುರುತಿಸುವಿಕೆಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: υἱοὶ θεοῦ ಎಂಬಲ್ಲಿ ಲಿಂಗಸೂಚಿತ ಪುತ್ರಸಂಬಂಧದ ಭಾಷೆ
  choice: ದೇವರ ಪುತ್ರರು
  alternative: ದೇವರ ಮಕ್ಕಳು
  rationale: ಮೂಲಪಾಠವು ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾದ ‘ಪುತ್ರರು’ ಎಂದು ಹೇಳುತ್ತದೆ. ಮುಖ್ಯಪಾಠದಲ್ಲಿ ಅದನ್ನು ಉಳಿಸುವುದು ಪುತ್ರಸ್ಥಾನಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಧ್ಯವಾದ ಒಡಂಬಡಿಕೆಯ ಮತ್ತು ಹಕ್ಕುದಾರಿಕೆಯ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಕಾಪಾಡುತ್ತದೆ; ಈ ಬಹುವಚನ ಬಳಕೆಯ ಪ್ರತಿನಿಧಿಕ, ಒಳಗೊಳ್ಳುವ ವ್ಯಾಪ್ತಿಯನ್ನು ಅಡಿಕುರಿಪು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಸಮಾಧಾನವನ್ನು ಉಂಟುಮಾಡುವವರು’ ಎಂಬುದು εἰρηνοποιοί ಪದದ ಸಕ್ರಿಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಅವರೇ’ ಎಂಬುದು αὐτοὶ ಪದದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ.
