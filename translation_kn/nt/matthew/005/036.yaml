id: MAT.5.36
reference: Matthew 5:36
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: kn
  text: ನಿನ್ನ ತಲೆಯ ಮೇಲೆಯೂ ಆಣೆಯಿಡಬೇಡ; ಏಕೆಂದರೆ ಒಂದು ಕೂದಲನ್ನಾದರೂ ಬಿಳಿಯಾಗಲಿ ಕಪ್ಪಾಗಲಿ ಮಾಡಲು ನಿನಗೆ ಸಾಧ್ಯವಿಲ್ಲ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: …ಯೂ …ಬೇಡ
  rationale: ಹಿಂದಿನ ನಿಷೇಧಗಳ ಸರಣಿಯನ್ನು ಮುಂದುವರಿಸುವ ಸಮನ್ವಿತ ನಕಾರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: ನಿನ್ನ ತಲೆಯ ಮೇಲೆ
  rationale: ὀμόσῃς ಜೊತೆ ಇದು ಆಣೆಯಲ್ಲಿ ಆಹ್ವಾನಿಸುವ ವಸ್ತುವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ರೂಢಿಪ್ರಯೋಗ ‘ತಲೆಯ ಮೇಲೆ ಆಣೆಯಿಡು’ ಮೂಲದ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ὀμόσῃς
  choice: ಆಣೆಯಿಡಬೇಡ
  rationale: μήτε ಜೊತೆಗಿನ ನಿಷೇಧಾತ್ಮಕ aorist subjunctive ಅನ್ನು ನೇರವಾದ ಆಜ್ಞಾರ್ಥಕ ನಿಷೇಧವಾಗಿ, ಗಂಭೀರವಾದರೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ನಿಷೇಧಕ್ಕೆ ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುವ ಸ್ಪಷ್ಟವಾದ ಕಾರಣಸೂಚಕ ಪದ.
- source_word: οὐ δύνασαι
  choice: ನಿನಗೆ ಸಾಧ್ಯವಿಲ್ಲ
  rationale: ಮಾನವನ ಅಸಾಮರ್ಥ್ಯವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μίαν τρίχα
  choice: ಒಂದು ಕೂದಲನ್ನಾದರೂ
  rationale: μίαν ಪದದ ‘ಒಂದೇ ಒಂದು’ ಎಂಬ ಒತ್ತನ್ನು ಕನ್ನಡದ ‘ಆದರೂ’ ಮೂಲಕ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: ಬಿಳಿಯಾಗಲಿ ಕಪ್ಪಾಗಲಿ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಮೂಲಭೂತ ಬಣ್ಣಗಳ ಸ್ಪಷ್ಟ ವೈರುಧ್ಯವನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಮೃದುಗೊಳಿಸುವಿಕೆ ಇಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ποιῆσαι
  choice: ಮಾಡಲು
  rationale: ಒಂದು ಸ್ಥಿತಿಗೆ ತರುವ causative ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಆಣೆಯಿಡುವಿಕೆಯ ಮೇಲಿನ ನಿಷೇಧದ ವ್ಯಾಪ್ತಿ
  choice: ಈ ವಾಕ್ಯವನ್ನು ವ್ಯಕ್ತಿಯು ತನ್ನ ತಲೆಯ ಮೇಲೆ ಆಣೆಯಿಡುವುದಕ್ಕೆ ನೇರ ನಿಷೇಧವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಎಲ್ಲ ಸಂದರ್ಭಗಳಲ್ಲಿಯೂ ಪ್ರತಿಯೊಂದು ವಿಧದ ಪ್ರಮಾಣವನ್ನೂ ನಿಷೇಧಿಸುವ ಸಂಪೂರ್ಣ ಸಿದ್ಧಾಂತವಾಗಿ ವಿಸ್ತರಿಸುವುದು; ಅಥವಾ ಮೋಸದ ಆಣೆಸೂತ್ರಗಳಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವುದು.
  rationale: ವಾಕ್ಯವು ನಿರ್ದಿಷ್ಟವಾಗಿ ತಲೆಯ ಮೇಲೆ ಆಣೆಯಿಡುವುದನ್ನು ಹೇಳಿ, ಮಾನವನ ಅಸಾಮರ್ಥ್ಯವನ್ನು ಅದರ ಕಾರಣವಾಗಿ ನೀಡುತ್ತದೆ. ವಿಶಾಲವಾದ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವಾದವನ್ನು ಅನುವಾದವೇ ತೀರ್ಮಾನಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ನೇರವಾದ ವಾಕ್ಯರಚನೆ. ‘ತಲೆಯ ಮೇಲೆ ಆಣೆಯಿಡು’ ಎಂಬ ಸಹಜ ಕನ್ನಡದ ರೂಢಿಪ್ರಯೋಗವನ್ನು ಬಳಸಲಾಗಿದೆ. ಇಂಗ್ಲಿಷ್ ಪದರದಲ್ಲಿನ [a] ಟಿಪ್ಪಣಿ ಅದರ ಪಠ್ಯದ ಪದಕ್ರಮಕ್ಕೆ ಸಂಬಂಧಿಸಿದ್ದಾಗಿ ಕಾಣುತ್ತದೆ; ಕನ್ನಡ ಕರಡಿನಲ್ಲಿ ಬೇರೆ ಪಾಠಾಂತರ ಅಥವಾ ನಿಜವಾದ ಅರ್ಥಸಂದಿಗ್ಧತೆ ಉಂಟಾಗದ ಕಾರಣ ಕೃತಕ ಟಿಪ್ಪಣಿಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
