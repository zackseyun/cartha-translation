  verdict: approve
  source_fidelity: The Kannada accurately preserves the coordinated prohibition ('...ಯೂ ...ಬೇಡ'), the oath formula involving one's own head, the causal clause, and the stated human inability to make even one hair white or black. ‘ತಲೆಯ ಮೇಲೆ ಆಣೆಯಿಡಬೇಡ’ is an appropriate idiomatic rendering of the Greek oath-taking expression without extending the scope of the saying.
  naturalness: The wording is clear, idiomatic modern standard Kannada, and maintains a direct, dignified scriptural register. ‘ಒಂದು ಕೂದಲನ್ನಾದರೂ’ naturally conveys the emphatic singular sense in context, while ‘ಬಿಳಿಯಾಗಲಿ ಕಪ್ಪಾಗಲಿ’ is fluent and preserves the alternatives.
  terminology: ‘ಆಣೆಯಿಡಬೇಡ’ appropriately renders oath-taking; ‘ತಲೆ,’ ‘ಕೂದಲು,’ ‘ಬಿಳಿ,’ and ‘ಕಪ್ಪು’ are ordinary and precise modern Kannada terms. No doctrinal expansion or interpretive terminology has been introduced.
