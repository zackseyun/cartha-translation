- from: ಮತ್ತು ಅವರು ತಮ್ಮ ಬಾಯನ್ನು ತೆರೆದು ಅವರಿಗೆ ಬೋಧಿಸುತ್ತಾ ಹೀಗೆ ಹೇಳಿದರು:[a]
  to: ಮತ್ತು ಅವರು ತಮ್ಮ ಬಾಯನ್ನು ತೆರೆದು ಅವರಿಗೆ ಹೀಗೆಂದು ಬೋಧಿಸುತ್ತಿದ್ದರು:[a]
  rationale: The revision makes ‘ಬೋಧಿಸುತ್ತಿದ್ದರು’ the main imperfective past action corresponding to ἐδίδασκεν. ‘ಹೀಗೆಂದು’ naturally conveys λέγων as an introduction to the following discourse, without treating it as a separate completed saying. The footnote offers a more participle-preserving alternative while maintaining readable Kannada.
  reviewer_model: gpt-5.6-terra
