    reason: lexical_alternative
  revision_rationale: The revision makes ‘ಬೋಧಿಸುತ್ತಿದ್ದರು’ the main imperfective past action corresponding to ἐδίδασκεν. ‘ಹೀಗೆಂದು’ naturally conveys λέγων as an introduction to the following discourse, without treating it as a separate completed saying. The footnote offers a more participle-preserving alternative while maintaining readable Kannada.
