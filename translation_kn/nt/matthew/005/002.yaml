id: MAT.5.2
reference: Matthew 5:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἀνοίξας τὸ στόμα αὐτοῦ ἐδίδασκεν αὐτοὺς λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/002.yaml
  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: kn
  text: ಮತ್ತು ಅವರು ತಮ್ಮ ಬಾಯನ್ನು ತೆರೆದು ಅವರಿಗೆ ಹೀಗೆಂದು ಬೋಧಿಸುತ್ತಿದ್ದರು:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಇನ್ನಷ್ಟು ರೂಪನಿಷ್ಠವಾಗಿ: “ಮತ್ತು ತಮ್ಮ ಬಾಯನ್ನು ತೆರೆದು, ಅವರಿಗೆ ಬೋಧಿಸುತ್ತಾ ಹೀಗೆ ಹೇಳುತ್ತಾ:”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಸರಳ ಸಂಯೋಜಕವಾದ καί ಅನ್ನು ಅದರ ಮೂಲ ಸಂಪರ್ಕಾರ್ಥ ಉಳಿಯುವಂತೆ ‘ಮತ್ತು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; ‘ಆಗ’ ಎಂಬುದು ಮೂಲದಲ್ಲಿಲ್ಲದ ಹೆಚ್ಚು ಸ್ಪಷ್ಟ ಕಾಲಾರ್ಥವನ್ನು ಸೇರಿಸಬಹುದು.
- source_word: ἀνοίξας
  choice: ತೆರೆದು
  rationale: ἀνοίγω ಪದದ ಭೂತಕಾಲೀನ ಕೃದಂತ ರೂಪವನ್ನು ಕನ್ನಡದ ಸಹಜ ಪೂರ್ವಕಾಲಿಕ ಕೃದಂತವಾದ ‘ತೆರೆದು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ‘ಮಾತನಾಡಲು ಆರಂಭಿಸಿ’ ಎಂದು ಅರ್ಥವಿವರಣೆ ಮಾಡದೆ, ಮೂಲದ ಗಂಭೀರವಾದ ‘ಬಾಯಿ ತೆರೆಯುವ’ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: τὸ στόμα αὐτοῦ
  choice: ತಮ್ಮ ಬಾಯನ್ನು
  rationale: ಕರ್ತೃನಿಗೆ ಹಿಂತಿರುಗಿ ಸೂಚಿಸುವ ಸ್ವಾಭಾವಿಕ ಗೌರವಪೂರ್ಣ ಕನ್ನಡ ರೂಪವಾಗಿ ‘ತಮ್ಮ ಬಾಯನ್ನು’ ಬಳಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿರುವ ‘ಬಾಯಿ’ ಎಂಬ ಸ್ಪಷ್ಟ ಪದವನ್ನು ಕೈಬಿಟ್ಟಿಲ್ಲ.
- source_word: ἐδίδασκεν
  choice: ಬೋಧಿಸುತ್ತಾ
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಮುಂದುವರಿಯುವ ಕ್ರಿಯಾಭಾವವನ್ನು ‘ಬೋಧಿಸುತ್ತಾ’ ಎಂಬ ರೂಪದಲ್ಲಿ ಉಳಿಸಿ, ಮುಂದಿನ λέγων ಜೊತೆ ಸಹಜವಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
- source_word: αὐτοὺς
  choice: ಅವರಿಗೆ
  rationale: ಸರ್ವನಾಮದ ಉಲ್ಲೇಖಿತರು ಈ ವಾಕ್ಯದಲ್ಲೇ ನಿರ್ದಿಷ್ಟರಾಗಿಲ್ಲ. ಆದ್ದರಿಂದ ‘ಜನರಿಗೆ’ ಅಥವಾ ‘ಶಿಷ್ಯರಿಗೆ’ ಎಂದು ಕಿರಿದಾಗಿಸದೆ ‘ಅವರಿಗೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: λέγων
  choice: ಹೀಗೆ ಹೇಳಿದರು
  rationale: ಮುಂದೆ ಬರುವ ಬೋಧನೆಯ ಮಾತುಗಳನ್ನು ಪರಿಚಯಿಸುವ ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಉಲ್ಲೇಖ-ಪರಿಚಯ ರೂಪ ‘ಹೀಗೆ ಹೇಳಿದರು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಕ್ರಿಯೆಗಳ ಸಂಬಂಧವನ್ನು ವಾಕ್ಯರಚನೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಏಕವಚನ ರೂಪ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಗಂಭೀರವಾದ ‘ಬಾಯಿ ತೆರೆದು’ ಎಂಬ ನುಡಿಗಟ್ಟನ್ನೂ, αὐτοὺς ಎಂಬ ಸರ್ವನಾಮದ ಅನಿರ್ದಿಷ್ಟ ಉಲ್ಲೇಖವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಠ್ಯವು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿರಲು ಕೃದಂತಗಳ ಸಂಬಂಧವನ್ನು ಮರುರಚಿಸಿದೆ; ಹೆಚ್ಚು ರೂಪನಿಷ್ಠ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
