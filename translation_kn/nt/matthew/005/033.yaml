id: MAT.5.33
reference: Matthew 5:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: kn
  text: “ಮತ್ತೆ, ‘ಸುಳ್ಳು ಪ್ರಮಾಣ ಮಾಡಬೇಡ[a]; ಆದರೆ ಕರ್ತನಿಗೆ[b] ನಿನ್ನ ಪ್ರಮಾಣಗಳನ್ನು ನೆರವೇರಿಸು’ ಎಂದು ಪೂರ್ವಿಕರಿಗೆ ಹೇಳಲಾಗಿತ್ತು ಎಂದು ನೀವು ಕೇಳಿದ್ದೀರಿ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಮಾಡಿದ ಪ್ರಮಾಣವನ್ನು ಮುರಿಯಬೇಡ”; ಈ ಕ್ರಿಯಾಪದವು ಸುಳ್ಳು ಪ್ರಮಾಣ ಮಾಡುವುದನ್ನಾಗಲಿ, ಪ್ರಮಾಣವನ್ನು ಉಲ್ಲಂಘಿಸುವುದನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ಯೆಹೋವನಿಗೆ”; ಇದು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ದೇವರ ಒಡಂಬಡಿಕೆಯ ನಾಮವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: ಮತ್ತೆ
  rationale: ಹಿಂದಿನ ಉಪದೇಶಗಳ ಸರಣಿಯಲ್ಲಿ ಮತ್ತೊಂದು ಉದಾಹರಣೆಯನ್ನು ಪರಿಚಯಿಸುವ ಸಂವಾದಾತ್ಮಕ ಮುಂದುವರಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἠκούσατε
  choice: ನೀವು ಕೇಳಿದ್ದೀರಿ
  rationale: ಈ ಸೂತ್ರಬದ್ಧ ಹೇಳಿಕೆಯಲ್ಲಿ ಹಿಂದಿನ ಕೇಳುವಿಕೆಗೆ ಇಂದಿನ ಪ್ರಸ್ತುತತೆಯಿರುವುದನ್ನು ಕನ್ನಡದ ಪೂರ್ಣಕಾಲದ ರೂಪ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐρρέθη
  choice: ಹೇಳಲಾಗಿತ್ತು
  rationale: ಹೇಳಿದವರು ಯಾರು ಎಂಬುದನ್ನು ಹೆಚ್ಚಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τοῖς ἀρχαίοις
  choice: ಪುರಾತನ ಕಾಲದವರಿಗೆ
  rationale: ಇದು ವಯಸ್ಸಾದವರಿಗಲ್ಲ, ಹಿಂದಿನ ತಲೆಮಾರುಗಳ ಜನರಿಗೆ ಎಂಬ ಕಾಲಿಕ-ಐತಿಹಾಸಿಕ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: Οὐκ ἐπιορκήσεις
  choice: ಸುಳ್ಳಾಗಿ ಪ್ರಮಾಣ ಮಾಡಬೇಡ
  rationale: ἐπιορκέω ಸುಳ್ಳು ಪ್ರಮಾಣ ಮಾಡುವುದನ್ನೂ ಪ್ರಮಾಣವನ್ನು ಉಲ್ಲಂಘಿಸುವುದನ್ನೂ ಸೂಚಿಸಬಹುದು; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಮೊದಲ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ನೀಡಿದ್ದು, ಇನ್ನೊಂದು ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἀποδώσεις
  choice: ನೆರವೇರಿಸಬೇಕು
  rationale: ಪ್ರಮಾಣದಿಂದ ಸ್ವೀಕರಿಸಿದ ಬಾಧ್ಯತೆಯನ್ನು ಕೈಗೂಡಿಸುವ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τῷ κυρίῳ
  choice: ಕರ್ತನಿಗೆ
  rationale: κύριος ಪದದ ‘Lord’ ಅರ್ಥವನ್ನು ಗೌರವಪೂರ್ಣವಾದ, ಪ್ರಚಲಿತ ಕನ್ನಡ ಪದದಿಂದ ನೀಡುತ್ತದೆ; ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ದೈವನಾಮದ ಹಿನ್ನೆಲೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: τοὺς ὅρκους σου
  choice: ನೀನು ಮಾಡಿದ ಪ್ರಮಾಣಗಳನ್ನು
  rationale: ‘ನಿನ್ನ ಪ್ರಮಾಣಗಳು’ ಎಂಬ ಶಬ್ದಶಃ ರೂಪಕ್ಕಿಂತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಪ್ರಮಾಣಗಳು ವ್ಯಕ್ತಿಯೇ ಮಾಡಿದವು ಎಂಬ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಇಸ್ರಾಯೇಲಿನ ಪವಿತ್ರಗ್ರಂಥಗಳ ಸೂಚನೆಯಲ್ಲಿರುವ κύριος ಪದದ ಅನುವಾದ
  choice: ಕರ್ತನಿಗೆ
  alternative: ಯೆಹೋವನಿಗೆ
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ κυρίῳ ಇದೆ ಮತ್ತು ಇದು ನೇರ ಹೀಬ್ರೂ ಉಲ್ಲೇಖಕ್ಕಿಂತ ಪವಿತ್ರಗ್ರಂಥದ ಬೋಧನೆಯ ಸಾರಾಂಶವಾಗಿದೆ. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಕರ್ತನು’ ಸೂಕ್ತ; ಒಡಂಬಡಿಕೆಯ ದೈವನಾಮವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುವ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ἐπιορκέω ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ಸುಳ್ಳಾಗಿ ಪ್ರಮಾಣ ಮಾಡಬೇಡ
  alternative: ಮಾಡಿದ ಪ್ರಮಾಣವನ್ನು ಮುರಿಯಬೇಡ
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಸುಳ್ಳು ಪ್ರಮಾಣ ಮಾಡುವುದನ್ನೂ ಪ್ರಮಾಣಭಂಗ ಮಾಡುವುದನ್ನೂ ಒಳಗೊಳ್ಳಬಹುದು. ಆಧುನಿಕ ಕಾನೂನುಪದದಷ್ಟು ಸಂಕುಚಿತಗೊಳಿಸದೆ ಮುಖ್ಯ ಅರ್ಥವನ್ನು ಪಠ್ಯದಲ್ಲಿ ನೀಡಿ, ನಿಜವಾದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಕಾಪಾಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ಕರ್ಮಣಿ ರೂಪ ಮತ್ತು ಕಾನೂನುಸೂಚಕ ಧಾಟಿಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅತಿಯಾಗಿ ಪುರಾತನ ಅಥವಾ ತಾಂತ್ರಿಕ ಪದಗಳನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಅಡಿಕುರಿಪು ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿತ ಮುಖ್ಯಪಠ್ಯದ ಪದಗುಚ್ಛಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
