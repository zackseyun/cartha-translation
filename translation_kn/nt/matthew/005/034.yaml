review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus' contrastive personal statement, the comprehensive prohibition on swearing, and the reason that heaven is God's throne. However, rendering μήτε as a second unqualified prohibition does not clearly preserve its connective force ('nor/neither'), and 'ಪರಲೋಕ' somewhat narrows οὐρανός, which can retain the ordinary biblical 'heaven' sense here without defining its cosmological nuance.
  naturalness: The phrasing is generally understandable, but 'ಎಷ್ಟು ಮಾತ್ರಕ್ಕೂ' is less idiomatic in this imperative. 'ಯಾವ ರೀತಿಯಲ್ಲೂ' is natural modern standard Kannada for the comprehensive force of ὅλως. 'ಸ್ವರ್ಗದ ಮೇಲೆಯೂ' is a fluent way to retain the linked 'nor by heaven' construction.
  terminology: Use 'ಸ್ವರ್ಗ' for οὐρανός in this context and retain 'ದೇವರ ಸಿಂಹಾಸನ' for θρόνος τοῦ θεοῦ. 'ಆಣೆ ಮಾಡಬೇಡಿ' remains a suitable, non-interpretive rendering of ὀμόσαι.
  issues:
  - severity: medium
    issue: The connective force of μήτε is obscured.
    rationale: μήτε means 'nor/neither' and continues the comprehensive prohibition. The draft's 'ಪರಲೋಕದ ಮೇಲೆ ಆಣೆ ಮಾಡಬೇಡಿ' reads as a separate repeated command without marking that linkage. 'ಸ್ವರ್ಗದ ಮೇಲೆಯೂ ಆಣೆ ಮಾಡಬೇಡಿ' preserves it naturally.
  - severity: low
    issue: ‘ಎಷ್ಟು ಮಾತ್ರಕ್ಕೂ’ is awkward for ὅλως.
    rationale: Although understandable, it is not the most natural modern Kannada expression for 'not at all.' 'ಯಾವ ರೀತಿಯಲ್ಲೂ' conveys the unrestricted scope idiomatically without adding an interpretation.
  - severity: low
    issue: ‘ಪರಲೋಕ’ narrows the lexical breadth of οὐρανός.
    rationale: In this saying οὐρανός is heaven in the biblical idiom and is immediately called God's throne. 'ಸ್ವರ್ಗ' is the standard Kannada equivalent and avoids implying a specifically postmortem realm.
  revised_text: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಯಾವ ರೀತಿಯಲ್ಲೂ ಆಣೆ ಮಾಡಬೇಡಿ; ಸ್ವರ್ಗದ ಮೇಲೆಯೂ ಆಣೆ ಮಾಡಬೇಡಿ, ಏಕೆಂದರೆ ಅದು ದೇವರ ಸಿಂಹಾಸನವಾಗಿದೆ;
  revised_footnotes: []
  revision_rationale: The revision preserves the source's comprehensive prohibition (μὴ ὀμόσαι ὅλως), explicitly carries over the linked negative force of μήτε, and uses natural modern Kannada while retaining the unexplicated biblical image of heaven as God's throne. No footnote is needed.
