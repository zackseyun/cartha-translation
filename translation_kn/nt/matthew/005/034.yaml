id: MAT.5.34
reference: Matthew 5:34
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: kn
  text: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಯಾವ ರೀತಿಯಲ್ಲೂ ಆಣೆ ಮಾಡಬೇಡಿ; ಸ್ವರ್ಗದ ಮೇಲೆಯೂ ಆಣೆ ಮಾಡಬೇಡಿ, ಏಕೆಂದರೆ ಅದು ದೇವರ ಸಿಂಹಾಸನವಾಗಿದೆ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δὲಯ ವಿರೋಧಾತ್ಮಕ ತಿರುವನ್ನೂ ἐγώಯ ಒತ್ತನ್ನೂ ಸಹಜವಾದ, ಗೌರವಯುತ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: μὴ ὀμόσαι ὅλως
  choice: ಎಷ್ಟು ಮಾತ್ರಕ್ಕೂ ಆಣೆ ಮಾಡಬೇಡಿ
  rationale: ὅλως ಅನ್ನು ಸಂಪೂರ್ಣ ನಿರಾಕರಣೆಯಾಗಿ ತೋರಿಸಿ, ὀμόσαιಯನ್ನು ವಾಗ್ದಾನ ಮಾಡುವುದೆಂದು ಅಲ್ಲ, ಆಣೆ ಮಾಡುವುದೆಂದು ನಿಖರವಾಗಿ ಅನುವಾದಿಸುತ್ತದೆ.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: ಪರಲೋಕದ ಮೇಲೆ ಆಣೆ ಮಾಡಬೇಡಿ
  rationale: ಗ್ರೀಕ್‌ನ ἐν ಮೂಲಕ ಸೂಚಿಸಲಾದ ಆಣೆಯ ಆಧಾರವನ್ನು ಕನ್ನಡದ ರೂಢಿಯಾದ ‘ಮೇಲೆ ಆಣೆ’ ಎಂಬ ರೂಪದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪುನರುಕ್ತ ಕ್ರಿಯಾಪದವು ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥವನ್ನು ಪೂರ್ಣಗೊಳಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಮುಂದಿನ ವಾಕ್ಯಾಂಶವು ಪರಲೋಕದ ಮೇಲೆ ಆಣೆ ಮಾಡಬಾರದೆಂಬುದಕ್ಕೆ ನೀಡುವ ಕಾರಣವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: ಅದು ದೇವರ ಸಿಂಹಾಸನವಾಗಿದೆ
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ರೂಪಕವನ್ನು ವ್ಯಾಖ್ಯಾನಿಸದೆ ಹಾಗೆಯೇ ಇರಿಸುತ್ತದೆ.
theological_decisions:
- issue: μὴ ὀμόσαι ὅλως ಎಂಬ ಆಜ್ಞೆಯ ವ್ಯಾಪ್ತಿ
  choice: ಎಷ್ಟು ಮಾತ್ರಕ್ಕೂ ಆಣೆ ಮಾಡಬೇಡಿ
  alternative: ಸುಳ್ಳಾಣೆ ಮಾಡಬೇಡಿ
  rationale: ಮೂಲಪಾಠವು ‘ಸುಳ್ಳು’ ಎಂಬ ಮಿತಿಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ; ಅದರ ವ್ಯಾಪಕವಾದ ನಿಷೇಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ, ಆದರೆ ಅದರ ಅನ್ವಯವನ್ನು ಪಂಥೀಯವಾಗಿ ವಿವರಿಸಲಾಗಿಲ್ಲ.
- issue: ಪರಲೋಕವು ದೇವರ ಸಿಂಹಾಸನ ಎಂಬ ಹೇಳಿಕೆ
  choice: ಅದು ದೇವರ ಸಿಂಹಾಸನವಾಗಿದೆ
  alternative: ಅದು ದೇವರ ಆಳ್ವಿಕೆಯ ಸಂಕೇತವಾಗಿದೆ
  rationale: ಮೂಲ ರೂಪಕವನ್ನು ತಾತ್ವಿಕ ವಿವರಣೆಯಾಗಿ ಕರಗಿಸದೆ ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ, ಆದರೆ ಪರ್ವತೋಪದೇಶದ ಗಂಭೀರ ಮತ್ತು ಅಧಿಕಾರಪೂರ್ಣ ಧಾಟಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಯಾವುದೇ ಪಾದಟಿಪ್ಪಣಿ ಅಗತ್ಯವಿಲ್ಲ.
