revisions:
- from: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಎಷ್ಟು ಮಾತ್ರಕ್ಕೂ ಆಣೆ ಮಾಡಬೇಡಿ; ಪರಲೋಕದ ಮೇಲೆ ಆಣೆ ಮಾಡಬೇಡಿ, ಏಕೆಂದರೆ ಅದು ದೇವರ ಸಿಂಹಾಸನವಾಗಿದೆ;
  to: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಯಾವ ರೀತಿಯಲ್ಲೂ ಆಣೆ ಮಾಡಬೇಡಿ; ಸ್ವರ್ಗದ ಮೇಲೆಯೂ ಆಣೆ ಮಾಡಬೇಡಿ, ಏಕೆಂದರೆ ಅದು ದೇವರ ಸಿಂಹಾಸನವಾಗಿದೆ;
  rationale: The revision preserves the source's comprehensive prohibition (μὴ ὀμόσαι ὅλως), explicitly carries over the linked negative force of μήτε, and uses natural modern Kannada while retaining the unexplicated biblical image of heaven as God's throne. No footnote is needed.
