id: MAT.5.4
reference: Matthew 5:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: kn
  text: ದುಃಖಿಸುವವರು[a] ಧನ್ಯರು; ಏಕೆಂದರೆ ಅವರಿಗೆ ಸಾಂತ್ವನ ದೊರೆಯುವುದು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಶೋಕಿಸುವವರು.’ ಗ್ರೀಕ್ ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ ವಿಶಾಲವಾಗಿದ್ದು, ದುಃಖದ ಕಾರಣವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ಧನ್ಯರು
  rationale: ಸುಖದ ವೈಯಕ್ತಿಕ ಭಾವನೆಗಿಂತ ದೇವರ ದೃಷ್ಟಿಯಲ್ಲಿರುವ ಅನುಗ್ರಹಿತ ಸ್ಥಿತಿಯನ್ನು ಮತ್ತು ಧನ್ಯವಚನದ ಮೌಲ್ಯನಿರ್ಣಯಾತ್ಮಕ ಬಲವನ್ನು ಉಳಿಸುವ, ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಿರವಾಗಿ ಬಳಕೆಯಲ್ಲಿರುವ ಪದ.
- source_word: οἱ πενθοῦντες
  choice: ದುಃಖಿಸುವವರು
  rationale: ನಷ್ಟ, ಸಂಕಟ, ಪಾಪ ಅಥವಾ ಇತರ ಕಾರಣಗಳಿಂದ ಉಂಟಾಗುವ ಆಳವಾದ ಶೋಕವನ್ನು ಒಳಗೊಳ್ಳಬಲ್ಲ ವಿಶಾಲವಾದ ಸಹಜ ಕನ್ನಡ ರೂಪ; ದುಃಖದ ಕಾರಣವನ್ನು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಧನ್ಯರೆಂದು ಹೇಳುವುದಕ್ಕೆ ಕಾರಣ ಅಥವಾ ಆಧಾರವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: αὐτοὶ
  choice: ಅವರಿಗೆ
  rationale: ಗ್ರೀಕ್ ಸರ್ವನಾಮದ ಸೂಚನೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ‘ಅವರಿಗೇ’ ಎಂಬ ಅತಿಯಾದ ಒತ್ತನ್ನು ಹೇರುವುದಿಲ್ಲ.
- source_word: παρακληθήσονται
  choice: ಸಾಂತ್ವನ ದೊರೆಯುವುದು
  rationale: ಭವಿಷ್ಯದ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಸಾಂತ್ವನದ ಅಂತಿಮ ಕರ್ತೃವನ್ನು ಪಠ್ಯವು ಹೇಳದೆ ಇರುವಂತೆಯೇ ಬಿಡುತ್ತದೆ.
theological_decisions:
- issue: ಧನ್ಯವಚನದಲ್ಲಿ ದುಃಖದ ವ್ಯಾಪ್ತಿ
  choice: ದುಃಖದ ಕಾರಣವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ‘ದುಃಖಿಸುವವರು’ ಎಂದು ವಿಶಾಲವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಪಾಪಕ್ಕಾಗಿ ದುಃಖಿಸುವವರು; ಸಾಮಾನ್ಯವಾಗಿ ಶೋಕಿಸುವವರು; ಇಸ್ರಾಯೇಲಿನ ಸ್ಥಿತಿಗಾಗಿ ಗೋಳಾಡುವವರು
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ದುಃಖದ ವಿಷಯ ಅಥವಾ ಕಾರಣವನ್ನು ತಿಳಿಸುವುದಿಲ್ಲ. ವಿಶಾಲವಾದ ಅನುವಾದವು ವೈಯಕ್ತಿಕ ನಷ್ಟ, ಪಾಪ, ದಬ್ಬಾಳಿಕೆ ಅಥವಾ ಅಂತ್ಯಕಾಲದ ನಿರೀಕ್ಷೆ ಇವುಗಳಲ್ಲಿ ಒಂದಕ್ಕೆ ಮಾತ್ರ ವಾಕ್ಯವನ್ನು ಸೀಮಿತಗೊಳಿಸದೆ ಅದರ ಧಾರ್ಮಿಕ ಹಾಗೂ ಮಾನವೀಯ ಮುಕ್ತತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಧನ್ಯವಚನ ಶೈಲಿ. ‘ಧನ್ಯರು’ ಎಂಬ ಪರಿಚಿತ ಶಾಸ್ತ್ರೀಯ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಉಳಿದ ವಾಕ್ಯವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ.
