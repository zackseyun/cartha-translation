  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: kn
  text: “‘ವ್ಯಭಿಚಾರ ಮಾಡಬಾರದು’ ಎಂದು ಹೇಳಿರುವುದನ್ನು ನೀವು ಕೇಳಿದ್ದೀರಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಹೆಚ್ಚು ಅಕ್ಷರಶಃ: “ಹೇಳಲಾಯಿತು ಎಂದು ನೀವು ಕೇಳಿದಿರಿ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: ನೀವು ಕೇಳಿದ್ದೀರಿ
  rationale: ಈ ಸೂತ್ರಬದ್ಧ ಪರಿಚಯದಲ್ಲಿರುವ ಭೂತಕಾಲದ ಕ್ರಿಯೆಯು ಹಿಂದೆ ಕೇಳಿ ಈಗಲೂ ತಿಳಿದಿರುವ ಬೋಧನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಆ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಕೇಳಿದ್ದೀರಿ’ ಸಮರ್ಪಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಎಂದು
  rationale: ಕೇಳಿದ ಮಾತಿನ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಸಂಯೋಜಕಕ್ಕೆ ಕನ್ನಡದ ಸಹಜ ಉಲ್ಲೇಖಪೂರಕ ರೂಪ ‘ಎಂದು’.
- source_word: ἐρρέθη
  choice: ಹೇಳಿರುವುದನ್ನು
  rationale: λέγω ಎಂಬ ಕ್ರಿಯಾಪದದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಇಲ್ಲಿ ವ್ಯಕ್ತಿನಿರಪೇಕ್ಷವಾಗಿ ಗ್ರಹಿಸಲಾಗಿದೆ. ‘ಹೇಳಿರುವುದನ್ನು’ ಎಂಬುದು ಗ್ರೀಕ್‌ನ ‘ಹೇಳಲಾಯಿತು’ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: Οὐ μοιχεύσεις
  choice: ವ್ಯಭಿಚಾರ ಮಾಡಬಾರದು
  rationale: ಭವಿಷ್ಯತ್ ಸೂಚಕ ರೂಪದಲ್ಲಿ ವ್ಯಕ್ತವಾದ ನಿಷೇಧಾಜ್ಞೆಯನ್ನು ಕನ್ನಡದ ಸ್ಥಿರವಾದ ಆಜ್ಞಾರ್ಥಕ ಶೈಲಿಯಲ್ಲಿ ನೀಡುತ್ತದೆ; μοιχεύω ಎಂಬ ಪದದ ನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ‘ವ್ಯಭಿಚಾರ ಮಾಡು’ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದಶಾಜ್ಞೆಯ ಉಲ್ಲೇಖದೊಂದಿಗಿನ ಸಂಬಂಧ
  choice: ‘ವ್ಯಭಿಚಾರ ಮಾಡಬಾರದು’ ಎಂಬ ವಿಧಿರೂಪದ ನಿಷೇಧಾಜ್ಞೆ
  alternative: ‘ವ್ಯಭಿಚಾರ ಮಾಡಬೇಡಿ’
  rationale: ಯೇಸು ದಶಾಜ್ಞೆಯ ಆಜ್ಞೆಯನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತಿರುವುದರಿಂದ, ಸಾಮಾನ್ಯ ಸಲಹೆ ಅಥವಾ ನೇರ ಸಂಭಾಷಣಾತ್ಮಕ ಆಜ್ಞೆಯ ಬದಲು ಶಾಸನಾತ್ಮಕ ನಿಷೇಧದ ಧ್ವನಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಯುತವೂ ಆದ ಶೈಲಿ. ಉಲ್ಲೇಖಿತ ದಶಾಜ್ಞೆಯ ವಿಧಿರೂಪದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಗ್ರೀಕ್ ವಾಕ್ಯಕ್ರಮದ ಅಸಹಜ ನಕಲನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
