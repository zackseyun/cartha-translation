id: MAT.5.28
reference: Matthew 5:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: kn
  text: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ, ಒಬ್ಬ ಸ್ತ್ರೀಯನ್ನು ಬಯಸುವ ಉದ್ದೇಶದಿಂದ ಆಕೆಯನ್ನು ನೋಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಈಗಾಗಲೇ ತನ್ನ ಹೃದಯದಲ್ಲೇ ಆಕೆಯೊಂದಿಗೆ ವ್ಯಭಿಚಾರ ಎಸಗಿದ್ದಾನೆ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ: “ಒಬ್ಬ ಸ್ತ್ರೀಯ ಮೇಲೆ ಕಾಮಪಡುವುದಕ್ಕಾಗಿ ಆಕೆಯನ್ನು ನೋಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ.”'
    reason: ἐπιθυμέωಗೆ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾದ ಲೈಂಗಿಕ ಅರ್ಥ ನೀಡುವ ಪರ್ಯಾಯ.
  - marker: b
    text: ಗ್ರೀಕ್‌ನ γυνή ಎಂಬ ಪದಕ್ಕೆ ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ “ಸ್ತ್ರೀ” ಅಥವಾ “ಹೆಂಡತಿ” ಎಂಬ ಅರ್ಥ ಬರಬಹುದು.
    reason: ಮೂಲಪದದಲ್ಲಿರುವ ನಿಜವಾದ ಶಬ್ದಾರ್ಥದ ದ್ವಂದ್ವವನ್ನು ತಿಳಿಸುವುದು.
  - marker: c
    text: 'ಅಥವಾ: “ಆಕೆಯನ್ನು ಬಯಸಲು ನೋಡುವ.”'
    reason: πρὸς τὸ ἐπιθυμῆσαιಯ ಉದ್ದೇಶಾರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಹೇಳುವ ಪರ್ಯಾಯ.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δέ ಸೂಚಿಸುವ ಹಿಂದಿನ ಮಾತಿನೊಂದಿಗಿನ ವೈದೃಶ್ಯವನ್ನೂ, ἐγώ ನೀಡುವ ‘ನಾನು’ ಎಂಬ ಒತ್ತನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ನೇರ ಸಂಬೋಧನೆ.
- source_word: πᾶς ὁ βλέπων
  choice: ನೋಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ
  rationale: πᾶς‌ನ ಸಾರ್ವತ್ರಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಸಂದರ್ಭದಲ್ಲಿನ ವ್ಯಕ್ತಿಯನ್ನು ಪುಲ್ಲಿಂಗ ಏಕವಚನದಲ್ಲಿ ಮುಂದುವರಿಸುವುದರಿಂದ ಕೊನೆಯ αὐτοῦಗೆ ಸಹಜವಾಗಿ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ.
- source_word: γυναῖκα
  choice: ಒಬ್ಬ ಸ್ತ್ರೀಯನ್ನು
  rationale: γυνήಗೆ ‘ಸ್ತ್ರೀ’ ಅಥವಾ ‘ಹೆಂಡತಿ’ ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳಿರಬಹುದು. ಇಲ್ಲಿ ವೈವಾಹಿಕ ಸ್ಥಿತಿಯನ್ನು ಗ್ರೀಕ್ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳದ ಕಾರಣ ವಿಶಾಲವಾದ ‘ಸ್ತ್ರೀ’ಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಬಳಸಲಾಗಿದೆ.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: ಬಯಸುವ ಉದ್ದೇಶದಿಂದ
  rationale: πρὸς + articular infinitive ಸೂಚಿಸುವ ಉದ್ದೇಶ ಅಥವಾ ಗುರಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ. ‘ಬಯಸು’ ἐπιθυμέω ಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಿದರೂ, ವ್ಯಭಿಚಾರದ ಸಂದರ್ಭ ಇದು ತಪ್ಪಾದ ಲೈಂಗಿಕ ಬಯಕೆ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἤδη
  choice: ಈಗಾಗಲೇ
  rationale: ಹೊರಗಿನ ಕೃತ್ಯ ನಡೆಯುವ ಮೊದಲು ಹೃದಯದಲ್ಲಿಯೇ ನೈತಿಕ ಉಲ್ಲಂಘನೆ ಸಂಭವಿಸಿದೆ ಎಂಬ ἤδηಯ ಕಾಲಾತ್ಮಕ ಮತ್ತು ಒತ್ತಿನ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐμοίχευσεν αὐτὴν
  choice: ಆಕೆಯೊಂದಿಗೆ ವ್ಯಭಿಚಾರ ಎಸಗಿದ್ದಾನೆ
  rationale: μοιχεύωಯ ವ್ಯಭಿಚಾರಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ; αὐτήν ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಸಂಬಂಧವಾಚಕ ರೂಪವಾದ ‘ಆಕೆಯೊಂದಿಗೆ’ ಎಂದು ನಿರೂಪಿಸಲಾಗಿದೆ.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: ತನ್ನ ಹೃದಯದಲ್ಲೇ
  rationale: καρδία ಸೂಚಿಸುವ ಆಂತರಿಕ ಚಿಂತನೆ ಮತ್ತು ಬಯಕೆಯ ಕ್ಷೇತ್ರವನ್ನು ಸಾಂಪ್ರದಾಯಿಕವಾದರೂ ಸಹಜವಾದ ‘ಹೃದಯ’ ಪದದಿಂದ ಉಳಿಸುತ್ತದೆ; ‘-ಲೇ’ ಆಂತರಿಕ ಮಟ್ಟದಲ್ಲಿಯೇ ಕೃತ್ಯ ಸಂಭವಿಸಿದೆ ಎಂಬ ಒತ್ತನ್ನು ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: γυνή ಅನ್ನು ‘ಸ್ತ್ರೀ’ ಎಂದೋ ‘ಹೆಂಡತಿ’ ಎಂದೋ ಭಾಷಾಂತರಿಸುವುದು
  choice: ಸ್ತ್ರೀ
  alternative: ಹೆಂಡತಿ
  rationale: ಮೂಲ ಗ್ರೀಕ್ ವೈವಾಹಿಕ ಸ್ಥಿತಿಯನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ‘ಸ್ತ್ರೀ’ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಕಿರಿದಾಗಿಸುವುದಿಲ್ಲ; ವ್ಯಭಿಚಾರದ ಉಲ್ಲೇಖವು ನೈತಿಕ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: ἐπιθυμέωಗೆ ವಿಶಾಲವಾದ ‘ಬಯಸು’ ಅಥವಾ ನಿರ್ದಿಷ್ಟವಾದ ‘ಕಾಮಪಡು’ ಬಳಸುವುದು
  choice: ಬಯಸು
  alternative: ಕಾಮಪಡು
  rationale: ಕ್ರಿಯಾಪದದ ಮೂಲ ಅರ್ಥವ್ಯಾಪ್ತಿ ‘ಕಾಮಪಡು’ಗಿಂತ ವಿಶಾಲವಾಗಿದೆ; ಆದರೆ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಬಯಕೆ ಲೈಂಗಿಕವೂ ತಪ್ಪಾದದ್ದೂ ಎಂಬುದು ವ್ಯಭಿಚಾರದ ಭಾಷೆಯಿಂದ ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ. ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: πρὸς τὸ + infinitive ಅನ್ನು ಉದ್ದೇಶವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುವುದೇ ಅಥವಾ ಸರಳ ಕ್ರಿಯಾರ್ಥವಾಗಿ ನೀಡುವುದೇ
  choice: ಬಯಸುವ ಉದ್ದೇಶದಿಂದ
  alternative: ಬಯಸಲು
  rationale: ಗ್ರೀಕ್ ರಚನೆಯ ಉದ್ದೇಶಾರ್ಥವನ್ನು ಮೌನವಾಗಿ ದುರ್ಬಲಗೊಳಿಸದೆ, ಕನ್ನಡದಲ್ಲಿ ಗ್ರಾಹ್ಯವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಧಾಟಿ. ‘ಎಸಗು’ ನೈತಿಕ ಅಪರಾಧದ ಗಂಭೀರತೆಯನ್ನು ಸೂಚಿಸಿದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗಿದೆ. ಉದ್ದೇಶಾರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿರುವ ‘ಸ್ತ್ರೀ/ಹೆಂಡತಿ’ ಮತ್ತು ‘ಬಯಸು/ಕಾಮಪಡು’ ಆಯ್ಕೆಗಳನ್ನು ಅಡಿಕುರಿಪುಗಳಲ್ಲಿ ಪಾರದರ್ಶಕವಾಗಿ ದಾಖಲಿಸಲಾಗಿದೆ.
