id: MAT.5.44
reference: Matthew 5:44
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: kn
  text: 'ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ: ನಿಮ್ಮ ಶತ್ರುಗಳನ್ನು ಪ್ರೀತಿಸಿರಿ ಮತ್ತು ನಿಮ್ಮನ್ನು ಹಿಂಸಿಸುವವರಿಗಾಗಿ[a] ಪ್ರಾರ್ಥಿಸಿರಿ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ನಿಮ್ಮನ್ನು ಹಿಂಸಿಸುವವರ ಪರವಾಗಿ ಪ್ರಾರ್ಥಿಸಿರಿ.’
    reason: ὑπέρ ಪದವು ಇಲ್ಲಿ ‘ಗಾಗಿ’ ಎಂದೂ, ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾಗಿ ‘ಪರವಾಗಿ’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ಆದರೆ ನಾನು ನಿಮಗೆ ಹೇಳುವುದೇನೆಂದರೆ
  rationale: δέ ಸೂಚಿಸುವ ಹಿಂದಿನ ಮಾತಿನೊಂದಿಗಿನ ವೈರುಧ್ಯವನ್ನು ‘ಆದರೆ’ ಉಳಿಸುತ್ತದೆ; ἐγώಯ ಒತ್ತನ್ನು ‘ನಾನು’ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ. ಈ ರೂಪ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು, ಗಂಭೀರ ಬೋಧನೆಯ ಧಾಟಿಯನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἀγαπᾶτε
  choice: ಪ್ರೀತಿಸಿರಿ
  rationale: ವರ್ತಮಾನಕಾಲದ ಆಜ್ಞಾರ್ಥದ ನೇರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ರೂಪ. ಕ್ರಿಯೆಯ ನಿರಂತರತೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೆಚ್ಚಿಸದೆ ಆಜ್ಞೆಯ ಪೂರ್ಣ ನೈತಿಕ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ನಿಮ್ಮ ಶತ್ರುಗಳನ್ನು
  rationale: ವೈಯಕ್ತಿಕ ಅಥವಾ ಸಂಬಂಧಾತ್ಮಕ ವೈರವನ್ನು ಮೃದುಗೊಳಿಸದೆ ಗ್ರೀಕ್ ಪದಗುಚ್ಛವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: προσεύχεσθε
  choice: ಪ್ರಾರ್ಥಿಸಿರಿ
  rationale: προσεύχομαιಗೆ ರೂಢಿಯಾದ, ಸ್ಪಷ್ಟವಾದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ; ಆಜ್ಞಾರ್ಥವನ್ನು ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὑπὲρ
  choice: ಗಾಗಿ
  rationale: ಇಲ್ಲಿ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯೊಡನೆ ಬಂದ ὑπέρ, ಯಾರ ಹಿತಕ್ಕಾಗಿ ಅಥವಾ ಅವರ ಪರವಾಗಿ ಪ್ರಾರ್ಥಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಗಾಗಿ’ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅತ್ಯಂತ ಸಹಜ; ‘ಪರವಾಗಿ’ ಎಂಬ ಹೆಚ್ಚು ಸ್ಪಷ್ಟ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: ನಿಮ್ಮನ್ನು ಹಿಂಸಿಸುವವರಿಗಾಗಿ
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವರ್ತಮಾನ ಕೃದಂತದ ಕ್ರಿಯಾತ್ಮಕ ಹಾಗೂ ಮುಂದುವರಿಯುವ ಅರ್ಥವನ್ನು ‘ಹಿಂಸಿಸುವವರು’ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಶತ್ರುಗಳ ಕಡೆಗಿನ ಆಜ್ಞೆಯ ವ್ಯಾಪ್ತಿ
  choice: ಶತ್ರುಗಳನ್ನು ಪ್ರೀತಿಸುವುದೂ ಹಿಂಸಿಸುವವರಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುವುದೂ ಎಂಬ ಎರಡೂ ಆಜ್ಞೆಗಳನ್ನು ಯಾವುದೇ ವಿವರಣಾತ್ಮಕ ವಿಸ್ತರಣೆ ಇಲ್ಲದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಪ್ರೀತಿ’ಯನ್ನು ಕೇವಲ ಹಿತಕಾರಿ ಕ್ರಿಯೆ ಎಂದು ವಿವರಿಸುವುದು, ಅಥವಾ ಪ್ರಾರ್ಥನೆಯ ಉದ್ದೇಶವನ್ನು ಆಶೀರ್ವಾದ, ಪಶ್ಚಾತ್ತಾಪ ಅಥವಾ ಮನಪರಿವರ್ತನೆ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಪ್ರೀತಿ ಮತ್ತು ಪ್ರಾರ್ಥನೆಯನ್ನು ಆಜ್ಞಾಪಿಸುತ್ತದೆ; ಆದರೆ ಅವುಗಳ ಎಲ್ಲ ಪ್ರಾಯೋಗಿಕ ಪರಿಣಾಮಗಳನ್ನಾಗಲಿ ಪ್ರಾರ್ಥನೆಯ ನಿರ್ದಿಷ್ಟ ವಿಷಯವನ್ನಾಗಲಿ ಈ ವಚನದಲ್ಲೇ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅದರ ನೈತಿಕ ಹಾಗೂ ದೇವತಾತ್ತ್ವಿಕ ಒತ್ತಡವನ್ನು ಪರಿಹರಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಗೌರವಪೂರ್ಣವಾದ ಬೋಧನಾ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಪ್ರೀತಿಸಿರಿ’ ಮತ್ತು ‘ಪ್ರಾರ್ಥಿಸಿರಿ’ ಎಂಬ ರೂಪಗಳು ಬಹುವಚನ ಸಂಬೋಧನೆಯನ್ನೂ ಆಜ್ಞೆಯ ಗಂಭೀರತೆಯನ್ನೂ ಉಳಿಸುತ್ತವೆ; ಪಂಥೀಯ ಅಥವಾ ವಿವರಣಾತ್ಮಕ ಪದಗಳನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
