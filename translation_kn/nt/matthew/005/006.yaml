id: MAT.5.6
reference: Matthew 5:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: kn
  text: ನೀತಿಗಾಗಿ[a] ಹಸಿದು ಬಾಯಾರುವವರು ಧನ್ಯರು; ಏಕೆಂದರೆ ಅವರು ತೃಪ್ತರಾಗುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ನ್ಯಾಯಕ್ಕಾಗಿ.” ಗ್ರೀಕ್ ಪದವು ನೀತಿ, ನ್ಯಾಯ, ಅಥವಾ ದೇವರ ಮುಂದೆ ಸರಿಯಾದದ್ದನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: ಧನ್ಯರು
  rationale: ಯೇಸುವಿನ ಧನ್ಯವಚನಗಳ ಘೋಷಣಾತ್ಮಕ ಮತ್ತು ದೇವಸಂಬಂಧಿತ ಆಶೀರ್ವಾದದ ಅರ್ಥವನ್ನು ಉಳಿಸುವ, ಕನ್ನಡ ಬೈಬಲ್ ಭಾಷೆಯಲ್ಲಿ ಪರಿಚಿತವಾಗಿದ್ದರೂ ಇಂದಿಗೂ ಸಹಜವಾದ ಪದ.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: ಹಸಿದು ಬಾಯಾರುವವರು
  rationale: ವರ್ತಮಾನ ಕೃದಂತಗಳು ಸೂಚಿಸುವ ನಿರಂತರ, ತೀವ್ರ ಹಂಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಕ್ರಿಯಾತ್ಮಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὴν δικαιοσύνην
  choice: ನೀತಿಗಾಗಿ
  rationale: δικαιοσύνη ಎಂಬ ಪದದ ದೇವರ ಮುಂದೆ ಸರಿಯಾದದ್ದು, ನೈತಿಕ ನೀತಿ ಮತ್ತು ನ್ಯಾಯ ಎಂಬ ವ್ಯಾಪ್ತಿಯನ್ನು ಒಂದೇ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ, ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ನ್ಯಾಯಕ್ಕಾಗಿ’ ಎಂಬ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಮೊದಲ ವಾಕ್ಯದ ಧನ್ಯತೆಯ ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಸಂಯೋಜಕದ ವಿವರಣಾತ್ಮಕ ಬಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: αὐτοὶ
  choice: ಅವರು
  rationale: ಗ್ರೀಕ್‌ನ ಒತ್ತನ್ನು ಕನ್ನಡದ ಸಹಜ ಸರ್ವನಾಮದಿಂದ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ‘ಅವರೇ’ ಎಂದರೆ ಅಗತ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ವಿರೋಧಾತ್ಮಕ ಒತ್ತು ಉಂಟಾಗಬಹುದು.
- source_word: χορτασθήσονται
  choice: ತೃಪ್ತರಾಗುವರು
  rationale: χορτάζω ಪದದ ಹೊಟ್ಟೆತುಂಬಿಸುವ ಮತ್ತು ಸಂಪೂರ್ಣ ತೃಪ್ತಿಪಡಿಸುವ ಭಾವವನ್ನು ಹಿಡಿದಿಡುತ್ತದೆ. ಹಸಿವು-ಬಾಯಾರಿಕೆಯ ರೂಪಕಕ್ಕೆ ಸಹಜ ಕನ್ನಡದ ಸಮಾಪ್ತಿಯನ್ನು ನೀಡುತ್ತದೆ; ಕರ್ತೃ ಹೇಳದ ದೈವಿಕ ನಿಷ್ಕ್ರಿಯದ ಅಸ್ಪಷ್ಟತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: δικαιοσύνη ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ನೀತಿ
  alternative: ನ್ಯಾಯ; ದೇವರ ಮುಂದೆ ಸರಿಯಾದದ್ದು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ವೈಯಕ್ತಿಕ ಸಚ್ಚಾರಿತ್ರ್ಯಕ್ಕೆ ಮಾತ್ರ ಸೀಮಿತವಾಗದೆ ನ್ಯಾಯ ಮತ್ತು ದೇವರ ಇಚ್ಛೆಗೆ ಸರಿಯಾಗಿರುವ ಸ್ಥಿತಿಯನ್ನೂ ಒಳಗೊಳ್ಳಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ನೀತಿ’ ಇಟ್ಟು, ಪರ್ಯಾಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: χορτασθήσονται ಎಂಬ ಕರ್ತೃರಹಿತ ನಿಷ್ಕ್ರಿಯ ರೂಪ
  choice: ಅವರು ತೃಪ್ತರಾಗುವರು
  alternative: ದೇವರು ಅವರನ್ನು ತೃಪ್ತಿಪಡಿಸುವರು
  rationale: ದೇವರೇ ಕಾರ್ಯಕರ್ತನೆಂಬ ಸೂಚನೆ ಸಾಧ್ಯವಾದರೂ ಗ್ರೀಕ್ ಪಠ್ಯವು ಆತನ ಹೆಸರನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಮೂಲದ ದೈವಿಕ ನಿಷ್ಕ್ರಿಯ ರೂಪ ಮತ್ತು ಅದರ ಸಂಯಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಧನ್ಯವಚನ ಶೈಲಿ. ‘ಧನ್ಯರು’ ಎಂಬ ಪರಿಚಿತ ಶಾಸ್ತ್ರೀಯ ಪದವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಉಳಿದ ವಾಕ್ಯವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ನೈಸರ್ಗಿಕವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ.
