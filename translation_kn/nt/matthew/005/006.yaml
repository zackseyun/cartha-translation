  source_fidelity: The translation accurately represents μακάριοι as “ಧನ್ಯರು,” the paired present participles as continuing hunger and thirst, δικαιοσύνη with the main rendering “ನೀತಿ,” the causal ὅτι clause, and the future passive χορτασθήσονται. “ತೃಪ್ತರಾಗುವರು” appropriately conveys the promised filling/satisfaction without supplying an explicit agent.
  naturalness: The wording is clear, idiomatic modern standard Kannada with an appropriately elevated but accessible Beatitude register. “ನೀತಿಗಾಗಿ ಹಸಿದು ಬಾಯಾರುವವರು” is a natural fixed-style expression and preserves the metaphor effectively.
  terminology: “ಧನ್ಯರು” is suitable for μακάριοι in this scriptural genre. “ನೀತಿ” is a defensible primary rendering of δικαιοσύνη, while the footnote responsibly preserves “ನ್ಯಾಯಕ್ಕಾಗಿ” and the broader sense of what is right before God. No doctrinal narrowing is introduced.
