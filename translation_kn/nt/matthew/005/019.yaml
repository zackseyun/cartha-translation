id: MAT.5.19
reference: Matthew 5:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ[a], ಈ ಅತಿ ಚಿಕ್ಕ ಆಜ್ಞೆಗಳಲ್ಲಿ ಒಂದನ್ನಾದರೂ ಸಡಿಲಗೊಳಿಸಿ, ಹಾಗೆಯೇ ಮಾಡುವಂತೆ ಜನರಿಗೆ ಬೋಧಿಸುವವನು ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ ಅತಿ ಚಿಕ್ಕವನೆಂದು ಕರೆಯಲ್ಪಡುವನು; ಆದರೆ ಅವುಗಳನ್ನು ಆಚರಿಸಿ ಬೋಧಿಸುವ ಅಂಥವನು ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ ದೊಡ್ಡವನೆಂದು ಕರೆಯಲ್ಪಡುವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ರದ್ದುಮಾಡಿ,’ ‘ಉಲ್ಲಂಘಿಸಿ.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ಅಕ್ಷರಾರ್ಥ ‘ಸಡಿಲಿಸುವುದು’; ಇಲ್ಲಿ ಅದು ಆಜ್ಞೆಯ ಬದ್ಧತೆಯನ್ನು ದುರ್ಬಲಗೊಳಿಸುವುದನ್ನು ಅಥವಾ ಅದನ್ನು ಪಾಲಿಸಬೇಕಿಲ್ಲವೆಂದು ಪರಿಗಣಿಸುವುದನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಧರ್ಮಶಾಸ್ತ್ರದ ಸ್ಥಿರತೆಯ ಕುರಿತು ಹೇಳಿದ್ದರಿಂದ ಬರುವ ತಾರ್ಕಿಕ ಫಲಿತಾಂಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: λύσῃ
  choice: ಸಡಿಲಗೊಳಿಸಿ
  rationale: λύω ಎಂಬ ಕ್ರಿಯಾಪದದ ಮೂಲ ಅರ್ಥವಾದ ‘ಸಡಿಲಿಸುವುದು’ ಎಂಬ ರೂಪಕವನ್ನು ಉಳಿಸಿ, ಆಜ್ಞೆಯ ಬದ್ಧತೆಯನ್ನು ದುರ್ಬಲಗೊಳಿಸುವ ಅರ್ಥವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: ಈ ಅತಿ ಚಿಕ್ಕ ಆಜ್ಞೆಗಳಲ್ಲಿ ಒಂದನ್ನಾದರೂ
  rationale: ಈ ಆಜ್ಞೆಗಳೊಳಗೆ ಅತಿ ಚಿಕ್ಕವೆಂದು ಪರಿಗಣಿಸಲ್ಪಡುವ ಒಂದನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಪದಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: ಹಾಗೆಯೇ ಮಾಡುವಂತೆ ಜನರಿಗೆ ಬೋಧಿಸುವವನು
  rationale: οὕτως ಹಿಂದಿನ ‘ಸಡಿಲಗೊಳಿಸುವ’ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἀνθρώπους ಇಲ್ಲಿ ಎಲ್ಲ ಜನರನ್ನೂ ಒಳಗೊಂಡ ಸಾಮಾನ್ಯ ಅರ್ಥದಲ್ಲಿದೆ.
- source_word: ἐλάχιστος κληθήσεται
  choice: ಅತಿ ಚಿಕ್ಕವನೆಂದು ಕರೆಯಲ್ಪಡುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನೂ, ಶ್ರೇಣಿಸೂಚಕ ἐλάχιστος ಪದವನ್ನೂ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗಕ್ಕೆ ಕನ್ನಡ ಬೈಬಲ್ ಭಾಷೆಯಲ್ಲಿ ಸಹಜವೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆದ ಸಮಾನಾರ್ಥಕ.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: ಅವುಗಳನ್ನು ಆಚರಿಸಿ ಬೋಧಿಸುವವನು
  rationale: ಆಜ್ಞೆಗಳ ವಿಷಯದಲ್ಲಿ ποιέω ಕೇವಲ ಕ್ರಿಯೆ ಮಾಡುವುದಲ್ಲ, ಅವುಗಳಂತೆ ನಡೆಯುವುದನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆಚರಿಸಿ’ ಸಹಜವಾಗಿ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: μέγας
  choice: ದೊಡ್ಡವನೆಂದು
  rationale: ἐλάχιστος ಎಂಬುದಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸ್ಥಾನಮಾನವನ್ನು ಸರಳವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಅತಿ ದೊಡ್ಡವನು’ ಎಂದು ಅತಿಶಯಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ ‘ಅತಿ ಚಿಕ್ಕವನು/ದೊಡ್ಡವನು’ ಎನ್ನುವ ಸ್ಥಾನಮಾನ
  choice: ರಾಜ್ಯದೊಳಗಿನ ತೂಲನೆಯ ಸ್ಥಾನಮಾನವೆಂದು ಪಠ್ಯವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಅತಿ ಚಿಕ್ಕವನು’ ಎಂದರೆ ರಾಜ್ಯದಿಂದ ಹೊರಗಿರುವವನು ಎಂದು ವ್ಯಾಖ್ಯಾನಿಸುವುದು; ಅಥವಾ ‘ದೊಡ್ಡವನು’ ಎಂಬುದನ್ನು ಪ್ರತಿಫಲದ ತಾಂತ್ರಿಕ ಹುದ್ದೆಯಾಗಿ ನಿರ್ಧರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ‘ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ’ ಎಂದು ಹೇಳುತ್ತದೆ; ರಕ್ಷಣೆ, ಹೊರತಳ್ಳುವಿಕೆ ಅಥವಾ ಪ್ರತಿಫಲದ ಕುರಿತ ವಿವಾದಗಳನ್ನು ಅನುವಾದವೇ ಪರಿಹರಿಸಬಾರದು.
- issue: τοὺς ἀνθρώπους ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ‘ಜನರಿಗೆ’ ಎಂದು ಎಲ್ಲ ಮಾನವರನ್ನೂ ಒಳಗೊಂಡ ಸಾಮಾನ್ಯ ಅರ್ಥದಲ್ಲಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಪುರುಷರನ್ನು ಮಾತ್ರ ಸೂಚಿಸುವ ‘ಗಂಡಸರಿಗೆ/ಪುರುಷರಿಗೆ’ ಎಂಬ ಅನುವಾದ.
  rationale: ಈ ಬಹುವಚನ ರೂಪವು ಸಂದರ್ಭದಲ್ಲೆಲ್ಲ ಮಾನವರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಆ ಅರ್ಥವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಜನರಿಗೆ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- issue: ποιήσῃ ಎಂಬುದರ ಅರ್ಥ
  choice: ‘ಆಚರಿಸಿ’ ಎಂದು, ಆಜ್ಞೆಗಳ ಪ್ರಕಾರ ನಡೆದುಕೊಳ್ಳುವ ಅರ್ಥದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
  alternative: ‘ಮಾಡಿ’ ಎಂಬ ಹೆಚ್ಚು ರೂಪನಿಷ್ಠ ಅನುವಾದ ಅಥವಾ ‘ಕೈಕೊಂಡು’ ಎಂಬ ಬೇರೊಂದು ರೂಪ.
  rationale: ಆಜ್ಞೆಗಳನ್ನು ‘ಆಚರಿಸುವುದು’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ, ಇದರಿಂದ ಅರ್ಹತೆ ಅಥವಾ ಪುಣ್ಯಸಂಪಾದನೆಯ ನಿರ್ದಿಷ್ಟ ಸಿದ್ಧಾಂತವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಶೈಲಿ. ‘ಪರಲೋಕರಾಜ್ಯ’ ಮತ್ತಾಯನ ಸ್ಥಿರ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿರುವ [a] ಗುರುತು ಪಾದಟಿಪ್ಪಣಿಗೆ ಸರಿಯಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ.
