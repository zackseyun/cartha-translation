  naturalness: The Kannada is generally natural and clear in a modern standard register. ‘ಪರಲೋಕರಾಜ್ಯ’ is established biblical Kannada. Repeating ‘ಪರಲೋಕರಾಜ್ಯದಲ್ಲಿ’ is appropriate to the Greek. Adding ‘ಅಂಥವನು’ is natural and preserves the demonstrative emphasis without awkward literalism.
  terminology: ‘ಸಡಿಲಗೊಳಿಸಿ’ suitably reflects λύσῃ in this commandment context, and ‘ಆಚರಿಸಿ’ appropriately expresses ποιήσῃ with commandments as the implicit object. ‘ಜನರಿಗೆ’ naturally renders generic τοὺς ἀνθρώπους. ‘ಅತಿ ಚಿಕ್ಕವನು’ and ‘ದೊಡ್ಡವನು’ retain the least/great contrast without importing theological conclusions.
