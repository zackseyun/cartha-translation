  terminology: ‘ಸಹೋದರರನ್ನು’ appropriately retains the masculine plural form, with a footnote preserving its potentially broader in-group reference. ‘ಅನ್ಯಜನರು’ is suitable for ἐθνικοί in this Jewish-context contrast. No doctrinally loaded terminology has been introduced.
