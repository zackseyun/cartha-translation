id: MAT.5.47
reference: Matthew 5:47
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: kn
  text: ನೀವು ನಿಮ್ಮ ಸಹೋದರರಿಗೆ ಮಾತ್ರ ಶುಭಾಶಯ ಹೇಳಿದರೆ, ನೀವು ಏನು ಅಸಾಧಾರಣವಾದದ್ದನ್ನು ಮಾಡುತ್ತೀರಿ?[a] ಅನ್ಯಜನರೂ ಅದನ್ನೇ ಮಾಡುವುದಿಲ್ಲವೇ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಸಹೋದರರು’ ಎಂಬುದು ಇಲ್ಲಿ ‘ಸಹೋದರ ಸಹೋದರಿಯರು’ ಅಥವಾ ತಮ್ಮ ಸಮುದಾಯದವರನ್ನು ವಿಶಾಲವಾಗಿ ಸೂಚಿಸಬಹುದು. ‘ನೀವು ಏನು ಅಸಾಧಾರಣವಾದದ್ದನ್ನು ಮಾಡುತ್ತೀರಿ?’ ಎಂಬುದಕ್ಕೆ ‘ನೀವು ಹೆಚ್ಚಾಗಿ ಏನು ಮಾಡುತ್ತೀರಿ?’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: ἀδελφοὺς ಪದದ ಸಂಭವನೀಯ ವಿಶಾಲ ವ್ಯಾಪ್ತಿಯನ್ನೂ τί περισσὸν ποιεῖτε ಎಂಬ ಪದಬಂಧದ ಶಾಬ್ದಿಕ ಪರ್ಯಾಯವನ್ನೂ ಉಳಿಸಲು.
  - marker: b
    text: ‘ಅನ್ಯಜನರು’ ಎಂಬುದಕ್ಕೆ ‘ಯೆಹೂದ್ಯರಲ್ಲದವರು’ ಎಂದೂ ಅರ್ಥ.
    reason: ἐθνικοὶ ಪದದ ಸಂದರ್ಭೋಚಿತ ಜನಾಂಗೀಯ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲು.
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: ವಂದಿಸಿದರೆ
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಒಬ್ಬರನ್ನು ಕಂಡಾಗ ಶುಭಾಶಯ ಹೇಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಆತಿಥ್ಯ ಅಥವಾ ವಿಶೇಷ ಆದರದ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸದೆ, ಗೌರವಪೂರ್ಣವಾದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ವಂದಿಸಿದರೆ’ ಎಂದು ನೀಡಲಾಗಿದೆ.
- source_word: ἀδελφοὺς
  choice: ಸಹೋದರರನ್ನು
  rationale: ಗ್ರೀಕ್ ಪದವು ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವಾಗಿದೆ. ಅದು ಇಲ್ಲಿ ಸ್ವಂತ ಸಹೋದರರನ್ನಷ್ಟೇ ಅಲ್ಲದೆ ತಮ್ಮ ಸಮುದಾಯದವರನ್ನೂ ಸೂಚಿಸಬಹುದಾದ ಕಾರಣ, ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ರೂಪವನ್ನು ಉಳಿಸಿ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: μόνον
  choice: ಮಾತ್ರ
  rationale: ಕ್ರಿಯೆಯನ್ನು ಒಂದು ಸೀಮಿತ ಗುಂಪಿಗೆ ನಿರ್ಬಂಧಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τί περισσὸν ποιεῖτε
  choice: ಅಸಾಧಾರಣವಾದದ್ದೇನು ಮಾಡುತ್ತೀರಿ?
  rationale: περισσόν ಸಾಮಾನ್ಯಕ್ಕಿಂತ ಮಿಗಿಲಾದ ಅಥವಾ ವಿಶಿಷ್ಟವಾದದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಈ ಅನುವಾದವು ಪ್ರಶ್ನೆಯ ನೈತಿಕ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಹೆಚ್ಚಾಗಿ ಏನು ಮಾಡುತ್ತೀರಿ?’ ಎಂಬ ಹೆಚ್ಚು ಶಾಬ್ದಿಕ ಪರ್ಯಾಯವನ್ನೂ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐθνικοὶ
  choice: ಅನ್ಯಜನರು
  rationale: ಯೆಹೂದ್ಯರಲ್ಲದ ಜನರನ್ನು ಸೂಚಿಸುವ ಪದಕ್ಕೆ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ‘ಅನ್ಯಜನರು’ ಸೂಕ್ತವಾಗಿದೆ; ‘ವಿಗ್ರಹಾರಾಧಕರು’ ಎಂಬ ಬಲವಾದ ಧಾರ್ಮಿಕ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: τὸ αὐτὸ
  choice: ಅದನ್ನೇ
  rationale: ಹಿಂದಿನ ವಂದಿಸುವ ಕ್ರಿಯೆಯನ್ನೇ ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಪದಬಂಧಕ್ಕೆ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕವಾಗಿದೆ.
theological_decisions:
- issue: ἀδελφοὺς ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಸಹೋದರರನ್ನು’ ಎಂದು ಇಟ್ಟು, ಸ್ವಂತ ಗುಂಪಿನವರನ್ನೂ ಒಳಗೊಳ್ಳಬಹುದಾದ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಸಹೋದರ ಸಹೋದರಿಯರನ್ನು’ ಅಥವಾ ‘ತಮ್ಮವರನ್ನು’
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ರೂಪವನ್ನು ಅಳಿಸದೆ ಉಳಿಸುವುದರ ಜೊತೆಗೆ, ಅದರ ಸಾಮಾಜಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಕೇವಲ ಪುರುಷ ಸಹೋದರರಿಗೆ ಸೀಮಿತಗೊಳಿಸದೆ ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸಂರಕ್ಷಿಸುತ್ತದೆ.
- issue: ἐθνικοὶ ಪದದ ಅರ್ಥ
  choice: ‘ಅನ್ಯಜನರು’
  alternative: ‘ಯೆಹೂದ್ಯರಲ್ಲದವರು’ ಅಥವಾ ‘ವಿಗ್ರಹಾರಾಧಕರು’
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಮುಖ್ಯವಾಗಿ ಯೆಹೂದ್ಯರಲ್ಲದವರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಅನ್ಯಜನರು’ ಜನಾಂಗೀಯ-ಒಡಂಬಡಿಕೆಯ ವ್ಯತ್ಯಾಸವನ್ನು ಉಳಿಸಿ, ಮೂಲದಲ್ಲಿರುವುದಕ್ಕಿಂತ ತೀವ್ರವಾದ ನಿಂದಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಬೋಧನಾತ್ಮಕ ಧಾಟಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಎರಡು ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಗಳ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
