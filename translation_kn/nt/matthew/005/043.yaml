id: MAT.5.43
reference: Matthew 5:43
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: kn
  text: ‘ನಿನ್ನ ನೆರೆಯವನನ್ನು ಪ್ರೀತಿಸಬೇಕು ಮತ್ತು ನಿನ್ನ ಶತ್ರುವನ್ನು ದ್ವೇಷಿಸಬೇಕು’ ಎಂದು ಹೇಳಲಾಗಿತ್ತು[a] ಎಂಬುದನ್ನು ನೀವು ಕೇಳಿದ್ದೀರಿ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೊದಲ ವಾಕ್ಯಾಂಶವು ಯಾಜಕಕಾಂಡ 19:18ನ್ನು ಪ್ರತಿಧ್ವನಿಸುತ್ತದೆ. ಎರಡನೆಯ ವಾಕ್ಯಾಂಶವಾದ ‘ನಿನ್ನ ಶತ್ರುವನ್ನು ದ್ವೇಷಿಸಬೇಕು’ ಎಂಬುದು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯಿಂದ ತೆಗೆದುಕೊಂಡ ನೇರ ಉಲ್ಲೇಖವಲ್ಲ; ಯೇಸು ಸರಿಪಡಿಸುತ್ತಿರುವ, ಜನರು ಸ್ವೀಕರಿಸಿದ್ದ ಬೋಧನೆಯನ್ನು ಅದು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: ನೀವು ಕೇಳಿದ್ದೀರಿ
  rationale: ಬೋಧನೆಯನ್ನು ಹಿಂದೆ ಕೇಳಿ ಸ್ವೀಕರಿಸಿರುವುದನ್ನು ಸೂಚಿಸುವ ಈ ಸೂತ್ರಬದ್ಧ ಪರಿಚಯಕ್ಕೆ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ರೂಪ.
- source_word: ἐρρέθη
  choice: ಹೇಳಲಾಗಿತ್ತು
  rationale: ಹೇಳಿದವರು ಯಾರು ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ ಗ್ರೀಕ್‌ನ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Ἀγαπήσεις
  choice: ಪ್ರೀತಿಸಬೇಕು
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ರೂಪ ಇಲ್ಲಿ ಆಜ್ಞಾರ್ಥಕ ಬಲ ಹೊಂದಿರುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾದ ವಿಧ್ಯರ್ಥಕ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: τὸν πλησίον σου
  choice: ನಿನ್ನ ನೆರೆಯವನನ್ನು
  rationale: ಯಾಜಕಕಾಂಡ 19:18ರ ಪ್ರತಿಧ್ವನಿಯಿರುವ ಈ ನೈತಿಕ ಸಂದರ್ಭದಲ್ಲಿ πλησίον ಎಂಬುದಕ್ಕೆ ಸ್ಥಿರವೂ ನೇರವೂ ಆದ ಸಮಾನಾರ್ಥಕ.
- source_word: μισήσεις
  choice: ದ್ವೇಷಿಸಬೇಕು
  rationale: ಉಲ್ಲೇಖಿತ ಬೋಧನೆಯೊಳಗಿನ ಎರಡನೆಯ ವಿಧಿಯನ್ನು ಮೊದಲನೆಯದಕ್ಕೆ ಸಮಾಂತರವಾಗಿ ಮತ್ತು ಅದರ ಆಜ್ಞಾರ್ಥಕ ಬಲವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸν ἐχθρόν σου
  choice: ನಿನ್ನ ಶತ್ರುವನ್ನು
  rationale: ನೈತಿಕ ವಿರೋಧದಲ್ಲಿರುವ ἐχθρός ಪದದ ನೇರ ಮತ್ತು ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
theological_decisions:
- issue: ‘ನಿನ್ನ ಶತ್ರುವನ್ನು ದ್ವೇಷಿಸಬೇಕು’ ಎಂಬ ವಾಕ್ಯಾಂಶದ ಸ್ಥಾನಮಾನ
  choice: ಯೇಸು ತನ್ನ ಕೇಳುಗರಿಗೆ ಕೇಳಿಬಂದ ಬೋಧನೆಯ ಒಂದು ಭಾಗವಾಗಿ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ಅದು ನೇರ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಉಲ್ಲೇಖವೆಂದು ಸೂಚಿಸಿಲ್ಲ.
  alternative: ಇಡೀ ಮಾತನ್ನು ಸಮಾನವಾಗಿ ಶಾಸ್ತ್ರೋಕ್ತ ನೇರ ಉಲ್ಲೇಖವೆಂದು ತೋರಿಸುವುದು, ಅಥವಾ ಎರಡನೆಯ ವಾಕ್ಯಾಂಶವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಕೇವಲ ಪರಂಪರೆಯ ವ್ಯಾಖ್ಯಾನವೆಂದು ಗುರುತಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಎರಡೂ ವಾಕ್ಯಾಂಶಗಳನ್ನು ‘ಹೇಳಲಾಗಿತ್ತು’ ಎಂಬ ಒಂದೇ ಪರಿಚಯದಡಿ ನೀಡುತ್ತದೆ. ಆದರೆ ಎರಡನೆಯ ವಾಕ್ಯಾಂಶವು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ನೇರ ಆಜ್ಞೆಯಲ್ಲ; ಆದ್ದರಿಂದ ಪಠ್ಯದಲ್ಲಿನ ಏಕತೆಯನ್ನೂ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಅದರ ಭಿನ್ನ ಸ್ಥಾನಮಾನವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ ಶೈಲಿ. ಉಲ್ಲೇಖದೊಳಗೆ ಏಕವಚನ ‘ನಿನ್ನ’ ಮತ್ತು ಪರಿಚಯದಲ್ಲಿ ಬಹುವಚನ ಗೌರವವಿಲ್ಲದ ‘ನೀವು’ ಎಂಬ ಗ್ರೀಕ್ ಸಂಖ್ಯಾಭೇದವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
