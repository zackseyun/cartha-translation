  source_fidelity: The translation accurately represents μακάριοι, καθαροὶ τῇ καρδίᾳ, the causal ὅτι clause, the emphatic αὐτοὶ, and the future promise ὄψονται. ‘ಹೃದಯದಲ್ಲಿ ಶುದ್ಧರಾಗಿರುವವರು’ naturally conveys purity in the inner person without reducing καρδία to emotion. ‘ಅವರೇ’ appropriately retains the Greek emphasis.
