id: MAT.5.8
reference: Matthew 5:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: kn
  text: ಹೃದಯದಲ್ಲಿ ಶುದ್ಧರಾಗಿರುವವರು ಧನ್ಯರು[a]; ಏಕೆಂದರೆ ಅವರೇ ದೇವರನ್ನು ನೋಡುವರು.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಹೃದಯದಲ್ಲಿ ನಿರ್ಮಲರಾಗಿರುವವರು.’
    reason: lexical_alternative
  - marker: b
    text: ‘ದೇವರನ್ನು ನೋಡುವರು’ ಎಂಬ ವಾಗ್ದಾನವು ದೇವರ ಸನ್ನಿಧಿಗೆ ನೇರ ಪ್ರವೇಶವನ್ನೂ, ಅದರ ಭವಿಷ್ಯದ ಪರಿಪೂರ್ಣ ನೆರವೇರಿಕೆಯನ್ನೂ ಸೂಚಿಸಬಹುದು; ಅನುವಾದವು ಅರ್ಥವನ್ನು ಒಂದಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಮೂಲದ ಮಾತನ್ನೇ ಉಳಿಸಿದೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: ಧನ್ಯರು
  rationale: ದೇವರ ಅನುಗ್ರಹಕ್ಕೆ ಪಾತ್ರವಾದ ಶ್ಲಾಘನೀಯ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಧನ್ಯವಚನದ ಸಹಜ ಮತ್ತು ಗೌರವಯುತ ಕನ್ನಡ ರೂಪ; ಕೇವಲ ಭಾವನಾತ್ಮಕ ಸಂತೋಷಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: καθαροὶ
  choice: ಶುದ್ಧರಾಗಿರುವವರು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ನೈತಿಕ ಮತ್ತು ಆಂತರಿಕ ಶುದ್ಧತೆಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಸ್ವಚ್ಛ’ ಎಂಬ ಪರ್ಯಾಯವು ಬಾಹ್ಯ ಅಥವಾ ಆಚರಣಾತ್ಮಕ ಅರ್ಥವನ್ನು ಹೆಚ್ಚಾಗಿ ಸೂಚಿಸಬಹುದು.
- source_word: τῇ καρδίᾳ
  choice: ಹೃದಯದಲ್ಲಿ
  rationale: ದತ್ತಿವ್ ರೂಪವು ಶುದ್ಧತೆ ಯಾವ ವಲಯದಲ್ಲಿ ಸತ್ಯವಾಗಿದೆ ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೃದಯ’ ಇಲ್ಲಿ ಕೇವಲ ಭಾವನೆಗಳಲ್ಲ, ಒಳಗಿನ ವ್ಯಕ್ತಿತ್ವವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಧನ್ಯಸ್ಥಿತಿಗೆ ಸಂಬಂಧಿಸಿದ ಕಾರಣ ಅಥವಾ ಆಧಾರವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಪರಿಚಯಿಸುತ್ತದೆ.
- source_word: αὐτοὶ
  choice: ಅವರೇ
  rationale: ಗ್ರೀಕ್ ಸರ್ವನಾಮದ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ಇದೇ ಜನರು ವಾಗ್ದಾನವನ್ನು ಪಡೆಯುವರು ಎಂಬುದನ್ನು ಎತ್ತಿಹಿಡಿಯುತ್ತದೆ.
- source_word: τὸν θεὸν
  choice: ದೇವರನ್ನು
  rationale: ಕ್ರಿಯಾಪದದ ನೇರ ಕರ್ಮವನ್ನು ಸಹಜ ಕನ್ನಡದ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯಲ್ಲಿ ನಿಖರವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ὄψονται
  choice: ನೋಡುವರು
  rationale: ಭವಿಷ್ಯಕಾಲದ ವಾಗ್ದಾನವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಅರ್ಥವನ್ನು ‘ಅನುಭವಿಸುವರು’ ಅಥವಾ ಅಂತ್ಯಕಾಲದ ದರ್ಶನವೆಂದು ಮುಂಚಿತವಾಗಿ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ‘ದೇವರನ್ನು ನೋಡುವರು’ ಎಂಬುದರ ಅರ್ಥ
  choice: ‘ದೇವರನ್ನು ನೋಡುವರು’ ಎಂಬ ನೇರ ಮಾತನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ದೇವರ ಸನ್ನಿಧಿಯನ್ನು ಅನುಭವಿಸುವರು’ ಅಥವಾ ‘ಅಂತ್ಯಕಾಲದಲ್ಲಿ ದೇವರನ್ನು ದರ್ಶಿಸುವರು.’
  rationale: ಗ್ರೀಕ್ ಮಾತು ಸಂಕ್ಷಿಪ್ತವಾಗಿದ್ದು ದೇವರ ಸನ್ನಿಧಿಗೆ ನೇರ ಪ್ರವೇಶ ಮತ್ತು ಅದರ ಭವಿಷ್ಯದ ಪರಿಪೂರ್ಣತೆಯನ್ನು ಒಳಗೊಳ್ಳಬಹುದಾದ ಆಳವನ್ನು ಹೊಂದಿದೆ. ಅನುವಾದದಲ್ಲಿ ಅದನ್ನು ಒಂದೇ ವಿವರಣೆಗೆ ಸೀಮಿತಗೊಳಿಸದೆ ಮೂಲದ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಧನ್ಯವಚನ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಅವರೇ’ ಮೂಲಕ αὐτοὶಯ ಒತ್ತನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಸಂಬಂಧಿಸಿದ ಪದಗುಚ್ಛ ಮತ್ತು ವಾಗ್ದಾನದ ಬಳಿಕ ಇರಿಸಲಾಗಿದೆ.
