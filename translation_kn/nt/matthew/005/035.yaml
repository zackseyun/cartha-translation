translation:
  language: kn
  text: ಭೂಮಿಯ ಮೇಲೂ ಪ್ರಮಾಣ ಮಾಡಬೇಡಿ; ಏಕೆಂದರೆ ಅದು ಆತನ ಪಾದಗಳಿಗೆ ಪಾದಪೀಠವಾಗಿದೆ[a]. ಯೆರೂಸಲೇಮಿನ ಮೇಲೂ ಪ್ರಮಾಣ ಮಾಡಬೇಡಿ[b]; ಏಕೆಂದರೆ ಅದು ಮಹಾ ಅರಸನ ನಗರವಾಗಿದೆ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಯೆಶಾಯ 66:1ಕ್ಕೆ ಸೂಚನೆ: “ಭೂಮಿಯು ನನ್ನ ಪಾದಗಳಿಗೆ ಪಾದಪೀಠವಾಗಿದೆ.”'
    reason: cross_reference
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಯೆರೂಸಲೇಮಿನ ಕಡೆಗೆ’ ಎಂದಿದೆ; ಇಲ್ಲಿ ಅದು ಪ್ರಮಾಣ ಮಾಡುವ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ‘ಯೆರೂಸಲೇಮಿನ ಮೇಲೆ’ ಎಂಬ ಅರ್ಥ ನೀಡಬಹುದು.
    reason: lexical_alternative
  - marker: c
    text: ಕೀರ್ತನೆ 48:2ಕ್ಕೆ ಸೂಚನೆ; ಅಲ್ಲಿ ಯೆರೂಸಲೇಮನ್ನು ‘ಮಹಾ ಅರಸನ ನಗರ’ ಎಂದು ಕರೆಯಲಾಗಿದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: …ಮೇಲೂ ಆಣೆಯಿಡಬೇಡಿ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಿಂದ ಮುಂದುವರಿಯುವ ನಿಷೇಧಗಳ ಸರಣಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸಲು ‘-ಊ … ಬೇಡಿ’ ಎಂಬ ಸಮನ್ವಯ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ἐν τῇ γῇ
  choice: ಭೂಮಿಯ ಮೇಲೆ ಆಣೆಯಿಡುವುದು
  rationale: ἐν ಎಂಬುದನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ‘ಭೂಮಿಯಲ್ಲಿ’ ಎಂದು ಅನುವಾದಿಸದೆ, ಪ್ರಮಾಣವಚನದ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಭೂಮಿಯ ಮೇಲೆ ಆಣೆಯಿಡು’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟಿನಿಂದ ಅರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: γῇ
  choice: ಭೂಮಿ
  rationale: ಸ್ವರ್ಗ ಮತ್ತು ಯೆರೂಸಲೇಮಿನೊಂದಿಗಿನ ವೈರುಧ್ಯದಲ್ಲಿ ಇದು ನಿರ್ದಿಷ್ಟ ನಾಡಿಗಿಂತ ಇಡೀ ಭೂಮಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ನಿಷೇಧಕ್ಕೆ ನೀಡಿರುವ ಕಾರಣವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὑποπόδιον
  choice: ಪಾದಪೀಠ
  rationale: ಮೂಲಪದದ ನಿಖರ ಅರ್ಥವನ್ನೂ ಶಾಸ್ತ್ರೀಯ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ಉಳಿಸುವ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿಯೂ ಗ್ರಾಹ್ಯವಾದ ಪದ.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: ಆತನ ಪಾದಗಳ
  rationale: ಗ್ರೀಕ್ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ‘ಆತನ’ ಎಂಬ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮವು ಸಂದರ್ಭದಲ್ಲಿರುವ ದೇವರ ಸೂಚನೆಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ, ಆದರೆ ಹೆಸರನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: εἰς Ἱεροσόλυμα
  choice: ಯೆರೂಸಲೇಮಿನ ಮೇಲೆ ಆಣೆಯಿಡುವುದು
  rationale: εἰς ಪದಕ್ಕೆ ಸಾಮಾನ್ಯವಾಗಿ ದಿಕ್ಕಿನ ಅರ್ಥವಿದ್ದರೂ, ಇಲ್ಲಿ ಪ್ರಮಾಣವಚನದ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ‘ಯೆರೂಸಲೇಮಿನ ಮೇಲೆ’ ಎಂಬ ಅರ್ಥವೇ ಸಹಜ. ಪೂರ್ವಪ್ರತ್ಯಯದ ಅಕ್ಷರಶಃ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: πόλις
  choice: ಪಟ್ಟಣ
  rationale: ಯೆರೂಸಲೇಮನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಘನತೆಯ ಕನ್ನಡ ಪದ; ‘ನಗರ’ ಎಂಬುದೂ ಸಾಧ್ಯವಾದರೂ ಕೀರ್ತನೆಗೆ ಇರುವ ಪ್ರತಿಧ್ವನಿಯಲ್ಲಿ ‘ಪಟ್ಟಣ’ ಸುಗಮವಾಗಿದೆ.
- source_word: τοῦ μεγάλου βασιλέως
  choice: ಮಹಾ ಅರಸನ
  rationale: ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನೂ ಎತ್ತರದ ಶಾಸ್ತ್ರೀಯ ಧಾಟಿಯನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಆತನ ಪಾದಗಳು’ ಎಂಬಲ್ಲಿನ ಸರ್ವನಾಮದ ಸೂಚಿತ ವ್ಯಕ್ತಿ
  choice: ‘ದೇವರ’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸದೆ ‘ಆತನ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ದೇವರ ಪಾದಗಳ ಪಾದಪೀಠ’ ಎಂದು ವ್ಯಕ್ತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು.
  rationale: αὐτοῦ ಎಂಬ ಗ್ರೀಕ್ ಸರ್ವನಾಮವು ಸ್ವತಃ ‘ದೇವರು’ ಎಂಬ ನಾಮವನ್ನು ಹೊಂದಿಲ್ಲ. ಸಂದರ್ಭ ಮತ್ತು ಯೆಶಾಯ 66:1ರ ಪ್ರತಿಧ್ವನಿ ದೇವರನ್ನು ಸೂಚಿಸಿದರೂ, ಅನುವಾದವು ಮೂಲದಲ್ಲಿಲ್ಲದ ಸ್ಪಷ್ಟೀಕರಣವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: εἰς Ἱεροσόλυμα ಎಂಬುದರ ಪ್ರಮಾಣವಚನಾತ್ಮಕ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಯೆರೂಸಲೇಮಿನ ಮೇಲೆ ಆಣೆಯಿಡಬೇಡಿ’ ಎಂದು ಅರ್ಥಾನುಸಾರವಾಗಿ ನೀಡಲಾಗಿದೆ.
  alternative: ‘ಯೆರೂಸಲೇಮಿನ ಕಡೆಗೆ ಆಣೆಯಿಡಬೇಡಿ’ ಎಂದು ದಿಕ್ಕಿನ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುವುದು.
  rationale: ಪ್ರಮಾಣವಚನದ ಸನ್ನಿವೇಶ ಮತ್ತು ಸಮಾನಾಂತರ ರಚನೆ εἰς ಅನ್ನು ಇಲ್ಲಿ ನುಡಿಗಟ್ಟಿನ ರೀತಿಯಲ್ಲಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಬೆಂಬಲಿಸುತ್ತವೆ; ಆದರೂ ಅದರ ದಿಕ್ಕುಸೂಚಕ ಮೇಲ್ಮೈ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾಗುವಂತೆ ‘ಆಣೆಯಿಡು’ ಎಂಬ ಸಹಜ ನುಡಿಗಟ್ಟನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಪಾದಪೀಠ’ ಮತ್ತು ‘ಮಹಾ ಅರಸ’ ಎಂಬ ಪದಗಳು ವಾಕ್ಯದ ಘನತೆಯನ್ನೂ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಪ್ರತಿಧ್ವನಿಗಳನ್ನೂ ಉಳಿಸುತ್ತವೆ. ವಾಕ್ಯವು ಹಿಂದಿನ ವಚನದ ನಿಷೇಧಗಳ ಸರಣಿಯ ಮುಂದುವರಿಕೆಯಾಗಿರುವುದರಿಂದ ಎರಡೂ ಭಾಗಗಳಲ್ಲಿ ‘-ಊ … ಬೇಡಿ’ ರಚನೆಯನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
