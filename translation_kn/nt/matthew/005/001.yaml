  to: ಜನಸಮೂಹಗಳನ್ನು ನೋಡಿ, ಅವರು ಆ ಬೆಟ್ಟಕ್ಕೆ ಏರಿದರು; ಅವರು ಕುಳಿತುಕೊಂಡಾಗ, ಅವರ ಶಿಷ್ಯರು ಅವರ ಬಳಿಗೆ ಬಂದರು.
