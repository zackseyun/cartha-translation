id: MAT.5.1
reference: Matthew 5:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: kn
  text: ಜನಸಮೂಹಗಳನ್ನು ನೋಡಿ, ಅವರು ಆ ಬೆಟ್ಟಕ್ಕೆ ಏರಿದರು; ಅವರು ಕುಳಿತುಕೊಂಡಾಗ, ಅವರ ಶಿಷ್ಯರು ಅವರ ಬಳಿಗೆ ಬಂದರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: ಕಂಡು
  rationale: ὁράω ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲದ ಕೃದಂತ ರೂಪ; ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಸಂದರ್ಭವನ್ನು ಒದಗಿಸುವ ಕೃದಂತ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ, ಆದರೆ ಕಾಲಕ್ರಮವನ್ನು ಅನಗತ್ಯವಾಗಿ ಕಠಿಣಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: δὲ
  choice: —
  rationale: ಇಲ್ಲಿ ಇದು ಸೌಮ್ಯವಾದ ಸಂಪರ್ಕ/ವಿಷಯಾಂತರ ಸೂಚಕ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ವಿರೋಧ ಅಥವಾ ಒತ್ತನ್ನು ಸೇರಿಸಬಹುದು; ವಾಕ್ಯಪ್ರವಾಹವೇ ಅದರ ಕಾರ್ಯವನ್ನು ನಿಭಾಯಿಸುತ್ತದೆ.
- source_word: τοὺς ὄχλους
  choice: ಜನಸಮೂಹಗಳನ್ನು
  rationale: ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಜನರ ಗುಂಪುಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ಬೆಟ್ಟದ ಮೇಲಕ್ಕೆ ಹೋದರು
  rationale: ಮೇಲ್ಮುಖ ಚಲನೆ ಮತ್ತು ಬೆಟ್ಟದ ಪ್ರದೇಶವನ್ನು ತಲುಪುವ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಏರಿದರು’ಗಿಂತ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸರಳವಾಗಿದೆ.
- source_word: τὸ ὄρος
  choice: ಬೆಟ್ಟ
  rationale: ὄρος ಪದಕ್ಕೆ ಬೆಟ್ಟ ಅಥವಾ ಪರ್ವತ ಎಂಬ ಅರ್ಥಗಳಿವೆ. ಇಲ್ಲಿ ಭೂದೃಶ್ಯವನ್ನು ಅತಿಯಾಗಿ ಭವ್ಯಗೊಳಿಸದೆ ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ‘ಬೆಟ್ಟ’ ಸೂಕ್ತವಾಗಿದೆ; ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಷಷ್ಠೀ ವಿಭಕ್ತಿ ರಚನೆ ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: ಅವರು ಕುಳಿತುಕೊಂಡಾಗ
  rationale: ಷಷ್ಠೀ ಸ್ವತಂತ್ರ ರಚನೆಯ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ; ‘ಕುಳಿತುಕೊಂಡ ನಂತರ’ ಎಂದು ಕಟ್ಟುನಿಟ್ಟಾದ ಕ್ರಮವನ್ನು ಹೇರದೆ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: προσῆλθαν αὐτῷ
  choice: ಅವರ ಬಳಿಗೆ ಬಂದರು
  rationale: ಪ್ರಸಂಗಕ್ಕೆ ತಕ್ಕ ಸರಳ, ಸಹಜ ಕನ್ನಡ; ಸಮೀಪಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ಅವರ ಶಿಷ್ಯರು
  rationale: ಗುರು-ಅನುಯಾಯಿ ಸಂಬಂಧದಲ್ಲಿರುವ μαθηταί ಎಂಬ ಪದಕ್ಕೆ ಸ್ಥಿರವೂ ಪರಿಚಿತವೂ ಆದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
theological_decisions:
- issue: τὸ ὄρος ಪದದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ಲೇಖನದ ನಿರೂಪಣೆ
  choice: ಬೆಟ್ಟದ ಮೇಲಕ್ಕೆ
  alternative: ಒಂದು ಬೆಟ್ಟದ ಮೇಲಕ್ಕೆ / ಪರ್ವತದ ಮೇಲಕ್ಕೆ
  rationale: ಗ್ರೀಕ್ ನಿರ್ದಿಷ್ಟ ಲೇಖನವನ್ನು ‘ಒಂದು’ ಎಂದು ಅನಿರ್ದಿಷ್ಟಗೊಳಿಸಿಲ್ಲ. ಆದರೆ ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ನಿರ್ದಿಷ್ಟ ಲೇಖನವಿಲ್ಲದ ಕಾರಣ, ಸಹಜವಾದ ‘ಬೆಟ್ಟದ’ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ; ಇದರಿಂದ ನಿರ್ದಿಷ್ಟವಾಗಿ ಹೆಸರಿಸಲಾದ ಬೆಟ್ಟವೆಂದು ಹೆಚ್ಚುವರಿ ಗುರುತಿಸುವಿಕೆ ಹೇರಲಾಗುವುದಿಲ್ಲ.
- issue: καθίσαντος αὐτοῦ ಎಂಬ ಷಷ್ಠೀ ಸ್ವತಂತ್ರ ರಚನೆಯ ಕಾಲಾನುಕ್ರಮ
  choice: ಅವರು ಕುಳಿತುಕೊಂಡಾಗ
  alternative: ಅವರು ಕುಳಿತುಕೊಂಡ ನಂತರ
  rationale: ಈ ರಚನೆ ಕಾಲಸಂಬಂಧ ಅಥವಾ ಸನ್ನಿವೇಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆಗ’ ಎಂಬ ರೂಪವು ಕಟ್ಟುನಿಟ್ಟಾದ ನಂತರದ ಕ್ರಮವನ್ನಾಗಲಿ, ಬೋಧನೆಯ ವಿಧಿವತ್ತಾದ ಭಂಗಿಯನ್ನಾಗಲಿ ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ಯೇಸುವನ್ನು ಉಲ್ಲೇಖಿಸುವಾಗ ಗೌರವಸೂಚಕ ಬಹುವಚನ ‘ಅವರು/ಅವರ’ ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯದ ಕೃದಂತ ಪ್ರವಾಹ ಮತ್ತು ಗ್ರೀಕ್ ಪಠ್ಯದ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
