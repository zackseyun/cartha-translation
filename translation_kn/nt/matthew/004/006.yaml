  to: 'ಅವನು ಆತನಿಗೆ, “ನೀನು ದೇವರ ಮಗನಾಗಿದ್ದರೆ, ನಿನ್ನನ್ನೇ ಕೆಳಗೆ ಎಸೆದುಕೋ[a]. ಏಕೆಂದರೆ ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ:


    ‘ಆತನು ನಿನ್ನ ವಿಷಯವಾಗಿ ತನ್ನ ದೂತರಿಗೆ ಆಜ್ಞಾಪಿಸುವನು,’


    ಮತ್ತು,


    ‘ಅವರು ನಿನ್ನನ್ನು ತಮ್ಮ ಕೈಗಳ ಮೇಲೆ ಎತ್ತುವರು[b],

    ನಿನ್ನ ಕಾಲು ಕಲ್ಲಿಗೆ ಬಡಿಯದಂತೆ.’” ಎಂದನು.'
  rationale: ತಿದ್ದುಪಡಿಯು ಅರ್ಥವನ್ನು ಬದಲಿಸದೆ ಉಲ್ಲೇಖದ ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯನ್ನು ಸುಗಮಗೊಳಿಸುತ್ತದೆ; ಎರಡನೆಯ ಉಲ್ಲೇಖದಲ್ಲಿ ಗ್ರೀಕ್ ಪದಕ್ರಮವನ್ನು ಅನುಸರಿಸುತ್ತದೆ; ಮತ್ತು αἴρωಗೆ ನೇರವಾದ ‘ಎತ್ತುವರು’ ಅನ್ನು ಬಳಸುತ್ತದೆ. ಅಡಿಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮತ್ತು ಅವುಗಳ ವ್ಯಾಪ್ತಿ ಉಳಿದಿವೆ.
