id: MAT.4.6
reference: Matthew 4:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: kn
  text: 'ಅವನು ಆತನಿಗೆ, “ನೀನು ದೇವರ ಮಗನಾಗಿದ್ದರೆ, ನಿನ್ನನ್ನೇ ಕೆಳಗೆ ಎಸೆದುಕೋ[a]. ಏಕೆಂದರೆ ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ:


    ‘ಆತನು ನಿನ್ನ ವಿಷಯವಾಗಿ ತನ್ನ ದೂತರಿಗೆ ಆಜ್ಞಾಪಿಸುವನು,’


    ಮತ್ತು,


    ‘ಅವರು ನಿನ್ನನ್ನು ತಮ್ಮ ಕೈಗಳ ಮೇಲೆ ಎತ್ತುವರು[b],

    ನಿನ್ನ ಕಾಲು ಕಲ್ಲಿಗೆ ಬಡಿಯದಂತೆ.’” ಎಂದನು.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಕೆಳಗೆ ಧುಮುಕು.”
    reason: βάλε σεαυτὸν κάτω ಎಂಬುದಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿನ ಸಹಜ ಪರ್ಯಾಯ ಅಭಿವ್ಯಕ್ತಿ.
  - marker: b
    text: ಅಥವಾ, “ತಮ್ಮ ಕೈಗಳ ಮೇಲೆ ಹೊತ್ತುಕೊಳ್ಳುವರು.”
    reason: ἀροῦσίν ಪದವು ಇಲ್ಲಿ ಎತ್ತುವುದು ಅಥವಾ ಹೊರುವುದು ಎಂಬ ಎರಡೂ ಸಮೀಪಾರ್ಥಗಳನ್ನು ಹೊಂದಿದೆ.
lexical_decisions:
- source_word: λέγει
  choice: ಎಂದನು
  rationale: ಕಥನದಲ್ಲಿನ ಗ್ರೀಕ್ ವರ್ತಮಾನಕಾಲವು ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ; ಕನ್ನಡ ಕಥನದಲ್ಲಿ ಭೂತಕಾಲ ಸಹಜವಾಗಿದೆ.
- source_word: Εἰ
  choice: ಆಗಿದ್ದರೆ
  rationale: ಸವಾಲಿನ ಷರತ್ತಿನ ಸ್ವರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಆದ್ದರಿಂದ’ ಅಥವಾ ‘ನೀನು ... ಆಗಿರುವುದರಿಂದ’ ಎಂದು ಸತ್ಯವನ್ನು ಮುಂಚಿತವಾಗಿ ಒಪ್ಪಿಕೊಳ್ಳುವುದಿಲ್ಲ.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ದೇವರ ಮಗ
  rationale: ಮತ್ತಾಯನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಗುರುತಿಸಲ್ಪಟ್ಟ ಕ್ರಿಸ್ತಸಂಬಂಧಿ ಬಿರುದಿನ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: βάλε σεαυτὸν κάτω
  choice: ನಿನ್ನನ್ನೇ ಕೆಳಗೆ ಎಸೆದುಕೋ
  rationale: ಆಜ್ಞಾರ್ಥಕ ಕ್ರಿಯೆ, ಆತ್ಮವಾಚಕ ಸರ್ವನಾಮ ಮತ್ತು ‘ಕೆಳಗೆ’ ಎಂಬ ದಿಕ್ಕನ್ನು ನೇರವಾಗಿ ಹಾಗೂ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γέγραπται
  choice: ಎಂದು ಬರೆಯಲಾಗಿದೆ
  rationale: ಶಾಸ್ತ್ರೋಕ್ತಿಯನ್ನು ಪರಿಚಯಿಸುವ ಪರಿಪೂರ್ಣ ಕರ್ಮಣಿ ರೂಪಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ ಸಮಾನಾರ್ಥಕ; ಬರಹದ ನಿರಂತರ ಪ್ರಾಮಾಣಿಕತೆಯ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐντελεῖται
  choice: ಆಜ್ಞಾಪಿಸುವನು
  rationale: ದೇವರು ದೂತರಿಗೆ ಅಧಿಕೃತ ಆದೇಶ ನೀಡುವ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: περὶ σοῦ
  choice: ನಿನ್ನ ವಿಷಯವಾಗಿ
  rationale: περί + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ‘ನಿನ್ನ ಕುರಿತು/ವಿಷಯವಾಗಿ’ ಎಂಬ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐπὶ χειρῶν
  choice: ತಮ್ಮ ಕೈಗಳ ಮೇಲೆ
  rationale: ದೂತರು ಕೈಗಳ ಮೇಲೆ ಹೊತ್ತು ರಕ್ಷಿಸುವ ಮೂಲ ರೂಪಕವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἀροῦσίν σε
  choice: ನಿನ್ನನ್ನು ... ಎತ್ತಿಕೊಳ್ಳುವರು
  rationale: αἴρω ಪದದ ಇಲ್ಲಿ ಸೂಕ್ತವಾದ ಎತ್ತುವುದು ಅಥವಾ ಹೊತ್ತುಕೊಳ್ಳುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: μήποτε προσκόψῃς πρὸς λίθον
  choice: ನಿನ್ನ ಕಾಲು ಕಲ್ಲಿಗೆ ಬಡಿಯದಂತೆ
  rationale: ತಡೆಗಟ್ಟುವ μήποτε ಮತ್ತು ಕಾಲು ಕಲ್ಲಿಗೆ ತಾಗುವ/ಬಡಿಯುವ ನಿರ್ದಿಷ್ಟ ಚಿತ್ರಣವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸν πόδα σου
  choice: ನಿನ್ನ ಕಾಲು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಏಕವಚನವನ್ನು ಕನ್ನಡದಲ್ಲೂ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಪರೀಕ್ಷಕನ ಸವಾಲಿನಲ್ಲಿ ‘ದೇವರ ಮಗ’ ಎಂಬ ಪದಗುಚ್ಛದ ಕ್ರಿಸ್ತಸಂಬಂಧಿ ಬಲ
  choice: ಬಿರುದಿನ ಅರ್ಥದಲ್ಲಿ ‘ದೇವರ ಮಗ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಸಾಮಾನ್ಯ ವರ್ಗವನ್ನು ಸೂಚಿಸುವಂತೆ ‘ದೇವರ ಒಬ್ಬ ಮಗ’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಮತ್ತಾಯನ ಕಥಾಸಂದರ್ಭದಲ್ಲಿ ಇದು ಸಾಮಾನ್ಯ ವರ್ಗವಲ್ಲ, ಯೇಸುವಿನ ಗುರುತಿಗೆ ಸಂಬಂಧಿಸಿದ ಬಿರುದು. ಕನ್ನಡದಲ್ಲಿ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ಬಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ಪಿಶಾಚನು ಕೀರ್ತನೆ 91ನ್ನು ಉಲ್ಲೇಖಿಸುವುದು
  choice: ಪರೀಕ್ಷಕನು ಹೇಳಿದ ಶಾಸ್ತ್ರೋಕ್ತಿಯನ್ನೇ ಯಾವುದೇ ವಿವರಣಾತ್ಮಕ ತಿದ್ದುಪಡಿ ಇಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಆ ಉಲ್ಲೇಖದ ಬಳಕೆಯನ್ನು ಸರಿಪಡಿಸುವ ಅಥವಾ ಅರ್ಹಗೊಳಿಸುವ ವಿವರಣೆ ಸೇರಿಸುವುದು.
  rationale: ವಚನವು ಪರೀಕ್ಷಕನ ಶಾಸ್ತ್ರೋಕ್ತಿಯನ್ನು ಉದ್ವಿಗ್ನತೆಯೊಡನೆ ದಾಖಲಿಸುತ್ತದೆ; ಅನುವಾದವು ಅದನ್ನು ಮೌನವಾಗಿ ಸರಿಪಡಿಸಬಾರದು ಅಥವಾ ವ್ಯಾಖ್ಯಾನಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಶಾಸ್ತ್ರೋಕ್ತಿಯನ್ನು ಪ್ರತ್ಯೇಕ ಸಾಲುಗಳಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ಮೂಲದ ಏಕವಚನ ‘ಕಾಲು,’ ಷರತ್ತಿನ ‘ಆಗಿದ್ದರೆ,’ ಮತ್ತು ದೂತರ ಕೈಗಳ ಮೇಲಿನ ರಕ್ಷಣೆಯ ರೂಪಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
