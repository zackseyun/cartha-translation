  source_fidelity: ಷರತ್ತು, ‘ದೇವರ ಮಗ’ ಎಂಬ ಬಿರುದು, ಸ್ವತಃ ಕೆಳಗೆ ಎಸೆಯುವ ಆಜ್ಞೆ, ದೂತರಿಗೆ ನೀಡುವ ಆಜ್ಞೆ, ಮತ್ತು ಏಕವಚನ ‘ಕಾಲು’ ಎಲ್ಲವೂ ಕರಡಿನಲ್ಲಿ ನಿಷ್ಠೆಯಿಂದ ಬಂದಿವೆ. ಆದರೆ ಎರಡನೆಯ ಕೀರ್ತನೆ-ಉಲ್ಲೇಖದಲ್ಲಿ ಮೂಲದ ಕ್ರಮವನ್ನು ಹೆಚ್ಚು ಸಮೀಪವಾಗಿ ಉಳಿಸಬಹುದು.
  naturalness: ‘ಎಂದು ಬರೆಯಲಾಗಿದೆ’ ಎಂಬ ಉಲ್ಲೇಖ-ಪರಿಚಯವನ್ನು ನೇರ ವಾಕ್ಯದ ಕೊನೆಯಲ್ಲಿ ಇರಿಸುವುದಕ್ಕಿಂತ ‘ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ:’ ಎಂದು ಉಲ್ಲೇಖಕ್ಕೆ ಮುನ್ನ ಇರಿಸುವುದು ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಹೆಚ್ಚು ಸುಗಮ ಮತ್ತು ಸ್ಪಷ್ಟ. ‘ಎತ್ತುವರು’ ಇಲ್ಲಿ ‘ಎತ್ತಿಕೊಳ್ಳುವರು’ಗಿಂತ ನೇರವಾದ ಸಹಜ ರೂಪವಾಗಿದೆ.
  terminology: ‘ದೇವರ ಮಗ,’ ‘ದೂತರು,’ ಮತ್ತು ‘ಆಜ್ಞಾಪಿಸುವನು’ ಸೂಕ್ತವಾಗಿವೆ. ಯಾವುದೇ ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
