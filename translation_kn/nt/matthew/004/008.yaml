id: MAT.4.8
reference: Matthew 4:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: kn
  text: ಮತ್ತೆ ದೆವ್ವವು ಆತನನ್ನು ಬಹಳ ಎತ್ತರವಾದ ಒಂದು ಬೆಟ್ಟಕ್ಕೆ ಕರೆದುಕೊಂಡು ಹೋಗಿ, ಲೋಕದ ಎಲ್ಲಾ ರಾಜ್ಯಗಳನ್ನೂ ಅವುಗಳ ವೈಭವವನ್ನೂ[a] ಆತನಿಗೆ ತೋರಿಸುತ್ತದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಅವುಗಳ ಮಹಿಮೆಯನ್ನೂ.’
    reason: δόξα ಎಂಬ ಪದಕ್ಕೆ ‘ವೈಭವ’ ಎಂಬ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥದ ಜೊತೆಗೆ ‘ಮಹಿಮೆ’ ಎಂಬ ಹೆಚ್ಚು ಶಾಬ್ದಿಕ ಪರ್ಯಾಯವನ್ನೂ ಸೂಚಿಸಲು.
lexical_decisions:
- source_word: Πάλιν
  choice: ಮತ್ತೆ
  rationale: ಪ್ರಲೋಭನೆಗಳ ಸರಣಿಯಲ್ಲಿ ಕ್ರಿಯೆಯ ಪುನರಾವರ್ತನೆಯನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: παραλαμβάνει
  choice: ಕರೆದುಕೊಂಡು ಹೋಗಿ
  rationale: ಜೊತೆಯಲ್ಲಿ ಕರೆದೊಯ್ಯುವ ಚಲನೆಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಮುಂದಿನ ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸರಾಗವಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
- source_word: ὁ διάβολος
  choice: ದೆವ್ವವು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸೈತಾನನಿಗೆ ಬಳಸಿರುವ ಪರಿಚಿತ ಬಿರುದಿನ ಸ್ಪಷ್ಟ ಮತ್ತು ಸಾಮಾನ್ಯ ಕನ್ನಡ ರೂಪ.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: ಬಹಳ ಎತ್ತರವಾದ ಒಂದು ಬೆಟ್ಟಕ್ಕೆ
  rationale: εἰς ಸೂಚಿಸುವ ಚಲನೆಯನ್ನು ‘ಬೆಟ್ಟಕ್ಕೆ’ ಎಂದೂ, λίανನ ತೀವ್ರತೆಯನ್ನು ‘ಬಹಳ’ ಎಂದೂ ಉಳಿಸುತ್ತದೆ.
- source_word: δείκνυσιν
  choice: ತೋರಿಸುತ್ತದೆ
  rationale: ಹೆಚ್ಚುವರಿ ತೀವ್ರತೆಯನ್ನು ಸೇರಿಸದೆ ಕ್ರಿಯಾಪದದ ನೇರ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: πάσας τὰς βασιλείας
  choice: ಎಲ್ಲಾ ರಾಜ್ಯಗಳನ್ನೂ
  rationale: ಬಹುವಚನದ ಸಮಗ್ರತೆಯನ್ನೂ ರಾಜಕೀಯ-ರಾಜ್ಯಾರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: τοῦ κόσμου
  choice: ಲೋಕದ
  rationale: κόσμοςಗೆ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಹಜವೂ ವ್ಯಾಪಕವೂ ಆದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: τὴν δόξαν αὐτῶν
  choice: ಅವುಗಳ ವೈಭವವನ್ನೂ
  rationale: ರಾಜ್ಯಗಳ ದೃಶ್ಯಮಯ ಭವ್ಯತೆ ಮತ್ತು ಘನತೆಯನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಮಹಿಮೆ’ ಎಂಬ ಹೆಚ್ಚು ಶಾಬ್ದಿಕ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಪ್ರಲೋಭನೆಯ ಕಥನದಲ್ಲಿನ ಬೆಟ್ಟದ ದೃಶ್ಯದ ಸ್ವರೂಪ
  choice: ಎಲ್ಲಾ ರಾಜ್ಯಗಳನ್ನು ತೋರಿಸಿದುದು ಹೇಗೆ ಸಾಧ್ಯವಾಯಿತು ಎಂಬುದನ್ನು ವಿವರಿಸದೆ, ಕಥನದಲ್ಲಿರುವಂತೆಯೇ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಇದು ಭೌಗೋಳಿಕವಾಗಿ ಕಾಣಬಹುದಾದ ದೃಶ್ಯವೆಂದು ಅಥವಾ ದರ್ಶನಾತ್ಮಕ/ಅತೀಂದ್ರಿಯ ಪ್ರಕಟಣೆಯೆಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ದೆವ್ವವು ಯೇಸುವನ್ನು ಬಹಳ ಎತ್ತರವಾದ ಬೆಟ್ಟಕ್ಕೆ ಕರೆದೊಯ್ದು ರಾಜ್ಯಗಳನ್ನು ತೋರಿಸಿತು ಎಂದಷ್ಟೇ ಹೇಳುತ್ತದೆ; ಅದರ ವಿಧಾನವನ್ನು ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನವಾದ ಕಥನಶೈಲಿ. ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ತೋರಿಸುತ್ತದೆ’ ಎಂದು ಉಳಿಸಿ, παραλαμβάνει ಅನ್ನು ಸಹಜ ಅನುಕ್ರಮಕ್ಕಾಗಿ ‘ಕರೆದುಕೊಂಡು ಹೋಗಿ’ ಎಂದು ರೂಪಿಸಲಾಗಿದೆ. ಅಡಿಕುರಿಪಿನ [a] ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
