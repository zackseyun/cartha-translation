id: MAT.4.11
reference: Matthew 4:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: kn
  text: ಆಗ ಸೈತಾನನು ಆತನನ್ನು ಬಿಟ್ಟುಹೋದನು. ಇಗೋ, ದೇವದೂತರು ಬಂದು ಆತನಿಗೆ ಸೇವೆ ಮಾಡುತ್ತಿದ್ದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಆತನ ಸೇವೆಯಲ್ಲಿ ತೊಡಗಿದ್ದರು.’ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವನ್ನು ‘ಸೇವೆ ಮಾಡಿದರು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಅದರ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ರೂಪವು ಮುಂದುವರಿಯುತ್ತಿದ್ದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಘಟನೆಗಳ ಕ್ರಮವನ್ನು ಸೂಚಿಸುವ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದ ನಿರೂಪಣಾ ಕೊಂಡಿ.
- source_word: ἀφίησιν αὐτὸν
  choice: ಆತನನ್ನು ಬಿಟ್ಟುಹೋದನು
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಕನ್ನಡ ನಿರೂಪಣೆಗೆ ಸಹಜವಾದ ಭೂತಕಾಲದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ಇಲ್ಲಿ ಅರ್ಥವು ಯೇಸುವಿನಿಂದ ದೂರವಾಗುವುದು.
- source_word: ὁ διάβολος
  choice: ಪಿಶಾಚನು
  rationale: ಪ್ರಲೋಭನೆಯ ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಇದು ಸೈತಾನನ ವೈಯಕ್ತಿಕ ಪದವಿಯಾಗಿ ಬಳಕೆಯಾಗಿದೆ; ‘ಚಾಡಿಕೋರನು’ ಎಂಬ ಪದಶಃ ರೂಪವು ಉಲ್ಲೇಖವನ್ನು ಅಸ್ಪಷ್ಟಗೊಳಿಸಬಹುದು.
- source_word: ἰδοὺ
  choice: ಇಗೋ
  rationale: ಹಠಾತ್ ಗಮನ ಸೆಳೆಯುವ ಮತ್ತು ದೃಶ್ಯಕ್ಕೆ ಜೀವಂತಿಕೆ ನೀಡುವ ಗ್ರೀಕ್ ಸಂವಾದಸೂಚಕದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἄγγελοι
  choice: ದೇವದೂತರು
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಮಾನವ ಸಂದೇಶವಾಹಕರಿಗಿಂತ ಪರಲೋಕದ ದೂತರೇ ಉದ್ದೇಶಿತರು ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: προσῆλθον
  choice: ಬಂದು
  rationale: ‘ಬಂದರು/ಸಮೀಪಿಸಿದರು’ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಸಹಜವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.
- source_word: διηκόνουν αὐτῷ
  choice: ಆತನಿಗೆ ಸೇವೆಮಾಡುತ್ತಿದ್ದರು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಮುಂದುವರಿಯುತ್ತಿದ್ದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಮಾಡುತ್ತಿದ್ದರು’ ಅದನ್ನು ಉಳಿಸುತ್ತದೆ; ಸೇವೆಯ ಸ್ವರೂಪವನ್ನು ಪಠ್ಯವು ನಿರ್ದಿಷ್ಟಪಡಿಸದ ಕಾರಣ ಅದನ್ನು ತೆರೆದೆಯೇ ಇಡಲಾಗಿದೆ.
theological_decisions:
- issue: διάβολος ಎಂಬ ಪದವು ಸೈತಾನನನ್ನು ಸೂಚಿಸುವ ನಿರೂಪಣೆಯಲ್ಲಿ
  choice: ಪಿಶಾಚನು
  alternative: ಚಾಡಿಕೋರನು
  rationale: ಮೂಲ ಪದಕ್ಕೆ ‘ಚಾಡಿಕೋರ’ ಎಂಬ ಶಬ್ದಾರ್ಥವಿದ್ದರೂ, ಈ ಪ್ರಲೋಭನೆಯ ನಿರೂಪಣೆಯಲ್ಲಿ ಅದು ಸೈತಾನನ ಸ್ಥಿರ ವೈಯಕ್ತಿಕ ಪದವಿಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ‘ಪಿಶಾಚನು’ ಉಲ್ಲೇಖದ ಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಿ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: διηκόνουν ಪದದ ಕ್ರಿಯಾಭಾವ ಮತ್ತು ಸೇವೆಯ ಸ್ವರೂಪ
  choice: ಸೇವೆಮಾಡುತ್ತಿದ್ದರು
  alternative: ಸೇವೆಮಾಡಿದರು
  rationale: ಗ್ರೀಕ್ ಅಪೂರ್ಣ ಭೂತಕಾಲವು ನಡೆಯುತ್ತಿದೆಯೆಂದು ಚಿತ್ರಿಸುವ ಕ್ರಿಯಾಭಾವವನ್ನು ಹೊಂದಿದೆ. ಸೇವೆ ಆಹಾರ ನೀಡುವುದೋ ಬೇರೆ ಆರೈಕೆಯೋ ಎಂಬುದನ್ನು ಮೂಲವು ಹೇಳದಿರುವುದರಿಂದ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಗೌರವಪೂರ್ಣವಾದ ನಿರೂಪಣೆ. ‘ಇಗೋ’ ಮೂಲದ ಗಮನಸೆಳೆಯುವ ಶೈಲಿಯನ್ನು ಉಳಿಸುತ್ತದೆ. ‘ಆತನಿಗೆ’ ಎಂಬ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮವು ಕನ್ನಡದ ಸುವಾರ್ತಾ ನಿರೂಪಣೆಗೆ ಹೊಂದಿಕೊಳ್ಳುತ್ತದೆ; ವಾಕ್ಯವನ್ನು ಅತಿಯಾಗಿ ಧಾರ್ಮಿಕ ಅಥವಾ ಪುರಾತನ ಶೈಲಿಗೆ ತಳ್ಳಿಲ್ಲ.
