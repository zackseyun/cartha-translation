revisions:
- from: ಯೇಸು ಗಲಿಲಾಯದಾದ್ಯಂತ ಸಂಚರಿಸುತ್ತಾ, ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ ಬೋಧಿಸುತ್ತಾ, ದೇವರ ಆಳ್ವಿಕೆಯ ಸುವಾರ್ತೆಯನ್ನು[a] ಸಾರುತ್ತಾ, ಜನರಲ್ಲಿದ್ದ ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ ಗುಣಪಡಿಸುತ್ತಿದ್ದರು.
  to: ಯೇಸು ಗಲಿಲಾಯದಾದ್ಯಂತ ಸಂಚರಿಸುತ್ತಾ, ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ ಬೋಧಿಸುತ್ತಾ, ರಾಜ್ಯದ ಸುವಾರ್ತೆಯನ್ನು ಸಾರುತ್ತಾ, ಜನರ ನಡುವೆ ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ ಗುಣಪಡಿಸುತ್ತಿದ್ದರು.
  rationale: The revision removes the unsupported addition “ದೇವರ,” retaining the Greek ambiguity and wording of “the kingdom.” It also replaces “ಜನರಲ್ಲಿದ್ದ” with “ಜನರ ನಡುವೆ” for a clearer rendering of ἐν τῷ λαῷ. All other elements preserve the source’s ongoing, region-wide ministry and its paired statement of comprehensive healing.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ itinerant ministry, teaching, proclamation, and healing, and preserves the repeated comprehensive scope of πᾶσαν. However, adding “ದೇವರ” (“God’s”) to τῆς βασιλείας introduces a word not present in the Greek text. The source reads “the kingdom,” and this should remain unexpanded in the main text.
  naturalness: The participial sequence and respectful plural verb are natural modern standard Kannada. “ಜನರ ನಡುವೆ” more directly and idiomatically represents ἐν τῷ λαῷ than “ಜನರಲ್ಲಿದ್ದ,” while retaining the intended sphere of the healings.
  terminology: “ಸಭಾಮಂದಿರಗಳಲ್ಲಿ,” “ಸುವಾರ್ತೆಯನ್ನು,” “ಸಾರುತ್ತಾ,” “ರೋಗ,” and “ಅಸ್ವಸ್ಥತೆ” are appropriate. “ರಾಜ್ಯದ ಸುವಾರ್ತೆ” preserves βασιλείας without importing an unstated possessive or a doctrinally interpretive expansion.
  issues:
  - severity: medium
    issue: The main text adds “ದೇವರ” in “ದೇವರ ಆಳ್ವಿಕೆಯ ಸುವಾರ್ತೆ.”
    rationale: τῆς βασιλείας means “of the kingdom”; θεός is absent in this verse. Though Matthew’s wider context informs the phrase, a translation should not supply the possessive in the text.
  - severity: low
    issue: “ಜನರಲ್ಲಿದ್ದ” can sound as though the diseases themselves are being characterized as residing in the people.
    rationale: ἐν τῷ λαῷ identifies the sphere/population among whom healing occurred. “ಜನರ ನಡುವೆ” is clearer and more idiomatic in Kannada.
  - severity: low
    issue: The existing footnote’s stated contrast is based on a main-text expansion that is not source-explicit.
    rationale: Once “ರಾಜ್ಯದ ಸುವಾರ್ತೆ” is used in the text, the proposed lexical-alternative footnote is no longer needed.
  revised_text: ಯೇಸು ಗಲಿಲಾಯದಾದ್ಯಂತ ಸಂಚರಿಸುತ್ತಾ, ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ ಬೋಧಿಸುತ್ತಾ, ರಾಜ್ಯದ ಸುವಾರ್ತೆಯನ್ನು ಸಾರುತ್ತಾ, ಜನರ ನಡುವೆ ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ ಗುಣಪಡಿಸುತ್ತಿದ್ದರು.
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported addition “ದೇವರ,” retaining the Greek ambiguity and wording of “the kingdom.” It also replaces “ಜನರಲ್ಲಿದ್ದ” with “ಜನರ ನಡುವೆ” for a clearer rendering of ἐν τῷ λαῷ. All other elements preserve the source’s ongoing, region-wide ministry and its paired statement of comprehensive healing.
