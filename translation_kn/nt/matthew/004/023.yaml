id: MAT.4.23
reference: Matthew 4:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: kn
  text: ಯೇಸು ಗಲಿಲಾಯದಾದ್ಯಂತ ಸಂಚರಿಸುತ್ತಾ, ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ ಬೋಧಿಸುತ್ತಾ, ರಾಜ್ಯದ ಸುವಾರ್ತೆಯನ್ನು ಸಾರುತ್ತಾ, ಜನರ ನಡುವೆ ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ ಗುಣಪಡಿಸುತ್ತಿದ್ದರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιῆγεν
  choice: ಸಂಚರಿಸುತ್ತಾ
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯಾಪದವು ಪ್ರದೇಶದಾದ್ಯಂತ ಮುಂದುವರಿದ ಸಂಚಾರವನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಸಂಚರಿಸುತ್ತಾ’ ಎಂಬುದು ಆ ನಿರಂತರ ಚಲನೆಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: ಗಲಿಲಾಯದಾದ್ಯಂತ
  rationale: ಚಲನೆಯ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಈ ಪದಗುಚ್ಛವು ಇಡೀ ಪ್ರದೇಶದ ವ್ಯಾಪ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಗಲಿಲಾಯದಾದ್ಯಂತ’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: διδάσκων
  choice: ಬೋಧಿಸುತ್ತಾ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸಮಕಾಲೀನವಾಗಿ ನಡೆಯುವ ಬೋಧನೆಯನ್ನು ವರ್ತಮಾನ ಕೃದಂತದ ರೂಪದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: συναγωγαῖς αὐτῶν
  choice: ಅವರ ಸಭಾಮಂದಿರಗಳಲ್ಲಿ
  rationale: ಯೆಹೂದ್ಯರ ಸಭೆ ಸೇರುವ ಸ್ಥಳಗಳನ್ನು ಸೂಚಿಸುವ ‘ಸಭಾಮಂದಿರ’ ಕನ್ನಡ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿದ್ದು, αὐτῶν ಎಂಬ ಸ್ವಾಮ್ಯಸೂಚಕವನ್ನು ‘ಅವರ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: κηρύσσων
  choice: ಸಾರುತ್ತಾ
  rationale: ಅಧಿಕೃತವಾದ ಸಾರ್ವಜನಿಕ ಪ್ರಕಟಣೆಯ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸ εὐαγγέλιον
  choice: ಸುವಾರ್ತೆಯನ್ನು
  rationale: ‘ಸುವಾರ್ತೆ’ ಆಧುನಿಕ ಕನ್ನಡ ಕ್ರೈಸ್ತ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾಗಿದ್ದು, ಮೂಲಪದದ ‘ಒಳ್ಳೆಯ ಸುದ್ದಿ’ ಎಂಬ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
- source_word: τῆς βασιλείας
  choice: ದೇವರ ಆಳ್ವಿಕೆಯ
  rationale: ಮೂಲದಲ್ಲಿ ‘ದೇವರ’ ಎಂಬ ಪದ ಇಲ್ಲದಿದ್ದರೂ ಮತ್ತಾಯನ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ಆಳ್ವಿಕೆ’ ದೇವರ ಆಳ್ವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆಳ್ವಿಕೆ’ βασιλείαಯ ಚೇತನಾತ್ಮಕ ರಾಜಾಧಿಕಾರದ ಅಂಶವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಹೆಚ್ಚು ರೂಪನಿಷ್ಠ ಪರ್ಯಾಯವನ್ನು ನೀಡಲಾಗಿದೆ.
- source_word: θεραπεύων
  choice: ಗುಣಪಡಿಸುತ್ತಿದ್ದರು
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಕ್ರಿಯಾಪದವು ನಿಜವಾದ ಗುಣಪಡಿಸುವಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮುಖ್ಯ ವಾಕ್ಯದ ಮುಂದುವರಿದ ಭೂತಕಾಲಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ಹೊಂದಿಸಲಾಗಿದೆ.
- source_word: πᾶσαν νόσον
  choice: ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ
  rationale: πᾶσαν ಎಂಬ ವ್ಯಾಪಕತೆಯನ್ನು ‘ಪ್ರತಿಯೊಂದು’ ಎಂದು ಉಳಿಸಿ, νόσοςಗೆ ಸಾಮಾನ್ಯವಾದ ‘ರೋಗ’ವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: πᾶσαν μαλακίαν
  choice: ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ
  rationale: μαλακίαಯ ದೌರ್ಬಲ್ಯ/ಅಸ್ವಸ್ಥತೆ ಎಂಬ ವ್ಯಾಪ್ತಿಯನ್ನು ‘ಅಸ್ವಸ್ಥತೆ’ ಹಿಡಿದಿಡುತ್ತದೆ ಮತ್ತು ಹಿಂದಿನ ‘ರೋಗ’ದಿಂದ ಪದಭೇದವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῷ λαῷ
  choice: ಜನರಲ್ಲಿದ್ದ
  rationale: ಗುಣಪಡಿಸಲಾದ ರೋಗಗಳು ಜನರ ನಡುವೆ ಇದ್ದವು ಎಂಬ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: εὐαγγέλιον τῆς βασιλείας ಎಂಬ ಪದಗುಚ್ಛದ ನಿರೂಪಣೆ
  choice: ದೇವರ ಆಳ್ವಿಕೆಯ ಸುವಾರ್ತೆ
  alternative: ರಾಜ್ಯದ ಸುವಾರ್ತೆ
  rationale: ‘ಆಳ್ವಿಕೆ’ ಎಂಬುದು βασιλείαಯನ್ನು ಕೇವಲ ಭೌಗೋಳಿಕ ರಾಜ್ಯವೆಂದು ಸೀಮಿತಗೊಳಿಸದೆ ರಾಜಾಧಿಕಾರ/ಆಳುವ ಕ್ರಿಯೆಯ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ. ಸ್ಪಷ್ಟತೆಗಾಗಿ ‘ದೇವರ’ ಎಂದು ನೀಡಲಾಗಿದ್ದು, ಮೂಲದ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίανನ ವ್ಯಾಪ್ತಿ
  choice: ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನೂ ಪ್ರತಿಯೊಂದು ಅಸ್ವಸ್ಥತೆಯನ್ನೂ
  alternative: ಎಲ್ಲ ಬಗೆಯ ರೋಗಗಳನ್ನೂ ಅಸ್ವಸ್ಥತೆಗಳನ್ನೂ
  rationale: ಎರಡೂ ನಾಮಪದಗಳೊಂದಿಗೆ ಪುನರಾವರ್ತಿತ πᾶσαν ಅನ್ನು ಉಳಿಸಿ ವಾಕ್ಯದ ಒತ್ತನ್ನು ಕಾಪಾಡಲಾಗಿದೆ; ಅದನ್ನು ನಿರ್ದಿಷ್ಟ ವೈದ್ಯಕೀಯ ವರ್ಗೀಕರಣವಾಗಿ ಅತಿಯಾಗಿ ವಿವರಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪವನ್ನು ಬಳಸಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಸಹಜ ವಾಕ್ಯರಚನೆಯನ್ನು ಅನುಸರಿಸಲಾಗಿದೆ. ಸಮಕಾಲೀನ ಕೃದಂತಗಳ ಪುನರಾವರ್ತನೆ ಮೂಲದ ಕ್ರಮಬದ್ಧ ಸೇವಾಕಾರ್ಯಗಳನ್ನು ಉಳಿಸುತ್ತದೆ.
