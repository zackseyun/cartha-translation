    reason: ಕೃದಂತವಾದ νηστεύσας ಅನ್ನು ‘ಉಪವಾಸವಿದ್ದ ನಂತರ’ ಎಂದು ಕಾಲಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವ ಪರ್ಯಾಯ ಅನುವಾದ.
  revision_rationale: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ νηστεύσας ಅನ್ನು ಕೃದಂತ ರೂಪದಲ್ಲಿ «ಉಪವಾಸವಿದ್ದು» ಎಂದು ಮತ್ತು ὕστερον ಅನ್ನು «ನಂತರ» ಎಂದು ಪ್ರತ್ಯೇಕವಾಗಿ ಪ್ರತಿನಿಧಿಸಲಾಗಿದೆ. ἐπείνασεν‌ನ ಸಂದರ್ಭಾನುಸಾರವಾದ ಅಯೋರಿಸ್ಟ್ ಅರ್ಥವನ್ನು «ಅವರಿಗೆ ಹಸಿವಾಯಿತು» ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಪರ್ಯಾಯ ಕಾಲಸಂಬಂಧಿತ ರೂಪವನ್ನು ನೀಡುತ್ತದೆ; ಅದರ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸರಿಯಾಗಿ ಜೋಡಿಸಲಾಗಿದೆ.
