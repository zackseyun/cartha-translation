reference: Matthew 4:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: kn
  text: ಅವರು ನಲವತ್ತು ಹಗಲುಗಳೂ ನಲವತ್ತು ರಾತ್ರಿಗಳೂ ಉಪವಾಸವಿದ್ದು, ನಂತರ ಅವರಿಗೆ ಹಸಿವಾಯಿತು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನಲವತ್ತು ಹಗಲುಗಳೂ ನಲವತ್ತು ರಾತ್ರಿಗಳೂ ಉಪವಾಸವಿದ್ದ ನಂತರ, ಅವರಿಗೆ ಹಸಿವಾಯಿತು.”
    reason: ಕೃದಂತವಾದ νηστεύσας ಅನ್ನು ‘ಉಪವಾಸವಿದ್ದ ನಂತರ’ ಎಂದು ಕಾಲಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವ ಪರ್ಯಾಯ ಅನುವಾದ.
lexical_decisions:
- source_word: νηστεύσας
  choice: ಉಪವಾಸವಿದ್ದ ನಂತರ
  rationale: ಕರ್ತೃವಾಚಕ ಭೂತಕಾಲದ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಉಪವಾಸವಿದ್ದ ನಂತರ’ ಎಂಬುದು ಆ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: ನಲವತ್ತು ಹಗಲು ನಲವತ್ತು ರಾತ್ರಿ
  rationale: ಕಾಲಾವಧಿಯನ್ನು ಸೂಚಿಸುವ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಸಹಜ ಬೈಬಲೀಯ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὕστερον
  choice: ನಂತರ
  rationale: ὕστερον ಉಪವಾಸದ ಬಳಿಕದ ಸಮಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ನಂತರ’ ಎಂಬುದು ಕೃದಂತದೊಂದಿಗೆ ಸೇರಿ ಸರಳವಾದ ಕಾಲಾನುಕ್ರಮವನ್ನು ಕೊಡುತ್ತದೆ.
- source_word: ἐπείνασεν
  choice: ಹಸಿದಿದ್ದರು
  rationale: ಈ ಕ್ರಿಯಾಪದವು ಉಪವಾಸದ ಬಳಿಕ ಉಂಟಾದ ನಿಜವಾದ ಹಸಿವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಗೌರವಪೂರ್ವಕ ಏಕವಚನಕ್ಕೆ ಹೊಂದುವ ‘ಹಸಿದಿದ್ದರು’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದೆ.
- source_word: καὶ
  choice: ವಾಕ್ಯಸಂದರ್ಭದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಕನ್ನಡದಲ್ಲಿ ಹಿಂದಿನ ವಾಕ್ಯಕ್ಕೆ ನೇರವಾಗಿ ಜೋಡಿಸುವ ಸಂದರ್ಭದಲ್ಲಿ ‘ಮತ್ತು’ ಎಂದು ಆರಂಭಿಸುವುದು ಕೃತಕವಾಗಬಹುದು; ವಾಕ್ಯಕ್ರಮವೇ ಸರಳ ನಿರೂಪಣಾ ಸಂಪರ್ಕವನ್ನು ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಉಪವಾಸದ ಬಳಿಕ ಯೇಸುವಿನ ನಿಜವಾದ ಮಾನವೀಯ ಹಸಿವು
  choice: ಹಸಿದಿದ್ದರು
  alternative: ಅವರಿಗೆ ಹಸಿವಾಯಿತು
  rationale: ‘ಹಸಿದಿದ್ದರು’ ನಿಜವಾದ ಹಸಿವಿನ ಸ್ಥಿತಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಆದರೆ ಪದ್ಯದ ಪದಾರ್ಥವನ್ನು ಮೀರಿ ಯಾವುದೇ ಪಂಥೀಯ ಅಥವಾ ವ್ಯವಸ್ಥಿತ ತಾತ್ತ್ವಿಕ ವಿವರಣೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ಗೌರವಪೂರ್ವಕ ಏಕವಚನ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ; ‘ಹಗಲು…ರಾತ್ರಿ’ ಎಂಬ ಪರಿಚಿತ ಶಾಸ್ತ್ರೀಯ ನುಡಿಗಟ್ಟನ್ನು ಉಳಿಸಲಾಗಿದೆ.
