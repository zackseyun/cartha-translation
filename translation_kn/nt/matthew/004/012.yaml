  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: kn
  text: ಯೋಹಾನನು ಒಪ್ಪಿಸಲ್ಪಟ್ಟಿದ್ದನೆಂದು[a] ಕೇಳಿದಾಗ, ಯೇಸು ಗಲಿಲಾಯಕ್ಕೆ ತೆರಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಈ ಸಂದರ್ಭದಲ್ಲಿ ಇನ್ನಷ್ಟು ನಿರ್ದಿಷ್ಟವಾಗಿ, “ಬಂಧಿಸಲ್ಪಟ್ಟಿದ್ದನೆಂದು.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: ಕೇಳಿದಾಗ
  rationale: ἀκούω ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲದ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಸಂಬಂಧಿಸಿದ ಕಾಲಸೂಚಕ ಅರ್ಥವನ್ನು ಹೊಂದಿದೆ. ‘ಕೇಳಿದಾಗ’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಆ ಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ
  rationale: ಇಲ್ಲಿ δέ ಸೌಮ್ಯವಾದ ಕಥನ-ಸಂಪರ್ಕಕ. ಹಿಂದಿನ ಸಂದರ್ಭದೊಂದಿಗೆ ವಾಕ್ಯದ ಸಂಬಂಧವೇ ಕನ್ನಡದಲ್ಲಿ ಈ ಕಾರ್ಯವನ್ನು ನಿರ್ವಹಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಎಂದು ಅನಗತ್ಯ ವಿರೋಧಾರ್ಥವನ್ನು ಸೇರಿಸಲಿಲ್ಲ.
- source_word: Ἰωάννης
  choice: ಯೋಹಾನನು
  rationale: ಗ್ರೀಕ್ ವೈಯಕ್ತಿಕ ಹೆಸರಿನ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಸ್ಥಿರವಾಗಿರುವ ರೂಪ.
- source_word: παρεδόθη
  choice: ಒಪ್ಪಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ
  rationale: παραδίδωμιಯ ಕರ್ಮಣಿ ರೂಪದ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಬಂಧಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ’ ಎಂದು ಕೇವಲ ಬಂಧನಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ. ಹಿಂದಿನ ಘಟನೆ ಎಂಬ ಕಾಲಸಂಬಂಧವನ್ನು ‘-ಲ್ಪಟ್ಟಿದ್ದಾನೆ’ ರೂಪ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀνεχώρησεν
  choice: ತೆರಳಿದನು
  rationale: ἀναχωρέω ಇಲ್ಲಿ ಪರಿಸ್ಥಿತಿಗೆ ಪ್ರತಿಕ್ರಿಯೆಯಾಗಿ ಹೊರಟುಹೋಗುವುದು ಅಥವಾ ಹಿಂದೆ ಸರಿಯುವುದನ್ನು ಸೂಚಿಸಬಹುದು. ‘ತೆರಳಿದನು’ ಸಹಜ ಕನ್ನಡವಾಗಿದ್ದು ಭಯದಿಂದ ಹಿಮ್ಮೆಟ್ಟಿದನು ಎಂಬ ಅತಿರೇಕವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ಗಲಿಲಾಯಕ್ಕೆ
  rationale: εἰςನ ದಿಕ್ಕುಸೂಚಕ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದ ‘-ಕ್ಕೆ’ ವಿಭಕ್ತಿ ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: ಯೋಹಾನನ ಕುರಿತು παραδίδωμι ಪದದ ಅನುವಾದ
  choice: ಒಪ್ಪಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ
  alternative: ಬಂಧಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಬಂಧನಕ್ಕಿಂತ ವಿಶಾಲವಾದ ‘ಒಪ್ಪಿಸಿಕೊಡು/ಅಧಿಕಾರಕ್ಕೆ ಒಪ್ಪಿಸು’ ಎಂಬ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಹೊಂದಿದೆ ಮತ್ತು ಮತ್ತಾಯನಲ್ಲಿ ಪ್ರತಿಧ್ವನಿಸುವ ಸಾಧ್ಯತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ. ಸಂದರ್ಭಕ್ಕೆ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟವಾದ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ἀνεχώρησεν ಸೂಚಿಸುವ ಚಲನೆಯ ಸ್ವರೂಪ
  choice: ತೆರಳಿದನು
  alternative: ಹಿಂದಕ್ಕೆ ಸರಿದನು
  rationale: ಮೂಲಪದವು ಹಿಂದೆ ಸರಿಯುವ ಛಾಯೆಯನ್ನು ಹೊಂದಬಹುದಾದರೂ, ಇಲ್ಲಿ ಯೇಸು ಭಯದಿಂದ ಹಿಮ್ಮೆಟ್ಟಿದನು ಎಂದು ನಿರ್ದಿಷ್ಟವಾಗಿ ಹೇಳುವುದು ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗುತ್ತದೆ. ಸಹಜವಾದ ವಿಶಾಲ ರೂಪವನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ‘ಯೇಸು’ ಎಂಬ ಕರ್ತೃ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸಂದರ್ಭದಿಂದ ಗ್ರಹಿಸಲ್ಪಟ್ಟಿದ್ದರೂ, ಕನ್ನಡದಲ್ಲಿ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ತಪ್ಪಿಸಲು ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸಲಾಗಿದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ವಾಕ್ಯಾಂತ್ಯದಲ್ಲಿ ಇಡಲಾಗಿದೆ.
