  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: kn
  text: ಆಗ ಯೇಸು ಅವನಿಗೆ, “ಸೈತಾನನೇ, ತೊಲಗಿಹೋಗು! ಏಕೆಂದರೆ, ‘ನಿನ್ನ ದೇವರಾದ ಕರ್ತನನ್ನು ಆರಾಧಿಸಬೇಕು[a]; ಆತನೊಬ್ಬನಿಗೇ ಸೇವೆ ಸಲ್ಲಿಸಬೇಕು[b]’ ಎಂದು ಬರೆದಿದೆ” ಎನ್ನುತ್ತಾರೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ನಿನ್ನ ದೇವರಾದ ಕರ್ತನ ಮುಂದೆ ಅಡ್ಡಬೀಳಬೇಕು.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಗೌರವದಿಂದ ಅಡ್ಡಬೀಳುವುದನ್ನಾಗಲಿ ತಲೆಬಾಗುವುದನ್ನಾಗಲಿ ಹೆಚ್ಚು ಶಾಬ್ದಿಕವಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಇಲ್ಲಿ “ಸೇವೆ ಸಲ್ಲಿಸು” ಎಂದು ಅನುವಾದಿಸಿದ ಕ್ರಿಯಾಪದವು ದೇವರಿಗೆ ಅರ್ಪಿಸುವ ಪವಿತ್ರ ಅಥವಾ ಧಾರ್ಮಿಕ ಸೇವೆಯನ್ನು ವಿಶೇಷವಾಗಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ಆಗ
  rationale: ಕಥನದ ಕ್ರಮವನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡ ಪದ.
- source_word: λέγει
  choice: ಎನ್ನುತ್ತಾರೆ
  rationale: ಗ್ರೀಕ್ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲದ ಜೀವಂತಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ವರ್ತಮಾನ ರೂಪದಿಂದ ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ὕπαγε
  choice: ತೊಲಗಿಹೋಗು
  rationale: ದೂರ ಹೋಗುವಂತೆ ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಆಜ್ಞಾಪಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Σατανᾶ
  choice: ಸೈತಾನನೇ
  rationale: ಸಂಬೋಧನಾ ರೂಪವನ್ನು ‘-ನೇ’ ಮೂಲಕ ಸ್ಪಷ್ಟಪಡಿಸಿ, ರೂಢಿಯಲ್ಲಿರುವ ಹೆಸರಿನ ಲಿಪ್ಯಂತರವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: γέγραπται
  choice: ಎಂದು ಬರೆದಿದೆ
  rationale: ಶಾಸ್ತ್ರೋಕ್ತಿಯನ್ನು ಪರಿಚಯಿಸುವ ಸ್ಥಿರ ಸೂತ್ರದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: Κύριον τὸν θεόν σου
  choice: ನಿನ್ನ ದೇವರಾದ ಕರ್ತನನ್ನು
  rationale: ‘ಕರ್ತನು’ ಮತ್ತು ‘ನಿನ್ನ ದೇವರು’ ಒಂದೇ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವ ಸಮಾನಾಧಿಕರಣ ಸಂಬಂಧವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: προσκυνήσεις
  choice: ಆರಾಧಿಸಬೇಕು
  rationale: ದೇವರಿಗೆ ಸಲ್ಲಿಸುವ ಭಕ್ತಿಪೂರ್ವಕ ನಮನದ ಸಂದರ್ಭೋಚಿತ ಧಾರ್ಮಿಕ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ಶಾಬ್ದಿಕವಾದ ‘ಅಡ್ಡಬೀಳಬೇಕು’ ಎಂಬ ಸಾಧ್ಯತೆಯನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: αὐτῷ μόνῳ
  choice: ಆತನೊಬ್ಬನಿಗೇ
  rationale: ಸೇವೆ ದೇವರಿಗೆ ಮಾತ್ರ ಸಲ್ಲಬೇಕು ಎಂಬ ಗ್ರೀಕ್‌ನ ವಿಶೇಷ ಒತ್ತನ್ನು ಕನ್ನಡದ ‘ಒಬ್ಬನಿಗೇ’ ರೂಪವು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: λατρεύσεις
  choice: ಸೇವೆ ಸಲ್ಲಿಸಬೇಕು
  rationale: προσκυνέω ಪದದಿಂದ ಭೇದವನ್ನು ಉಳಿಸುವುದರ ಜೊತೆಗೆ ದೇವರಿಗೆ ಅರ್ಪಿಸುವ ಧಾರ್ಮಿಕ ಸೇವೆಯ ಅರ್ಥವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: προσκυνέω ಮತ್ತು λατρεύω ಎಂಬ ಜೋಡಿ ಕ್ರಿಯಾಪದಗಳ ಭೇದ
  choice: ‘ಆರಾಧಿಸಬೇಕು’ ಮತ್ತು ‘ಸೇವೆ ಸಲ್ಲಿಸಬೇಕು’ ಎಂದು ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಎರಡನ್ನೂ ಆರಾಧನೆಯ ಭಾಷೆಯಿಂದ ಅನುವಾದಿಸುವುದು; ಅಥವಾ ಮೊದಲನೆಯದನ್ನು ‘ಅಡ್ಡಬೀಳಬೇಕು’ ಎಂದು ನೀಡುವುದು.
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸಂಬಂಧಿತವಾದರೂ ವಿಭಿನ್ನ ಕ್ರಿಯಾಪದಗಳನ್ನು ಒಂದೇ ಅರ್ಥಕ್ಕೆ ಕುಗ್ಗಿಸದೆ, ದೇವರಿಗೆ ಮಾತ್ರ ಆರಾಧನೆಯೂ ಸಮರ್ಪಿತ ಸೇವೆಯೂ ಸಲ್ಲಬೇಕು ಎಂಬ ವಾಕ್ಯದ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: αὐτῷ μόνῳಯಲ್ಲಿನ ಏಕೈಕತ್ವದ ಒತ್ತು
  choice: ‘ಆತನೊಬ್ಬನಿಗೇ’
  alternative: ‘ಆತನಿಗೇ ಮಾತ್ರ’ ಅಥವಾ ‘ಆತನಿಗೆ ಮಾತ್ರ’
  rationale: μόνῳ ಪದವು ಸೂಚಿಸುವ ವ್ಯಕ್ತಿಯ ಏಕೈಕತ್ವವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಸೇವೆಯ ವಿಧವನ್ನು ‘ಮಾತ್ರ’ ಮಿತಿಗೊಳಿಸುವಂತೆ ತಪ್ಪಾಗಿ ಓದುವ ಸಾಧ್ಯತೆಯನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ‘ಎನ್ನುತ್ತಾರೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ. ಶಾಸ್ತ್ರೋಕ್ತಿಯ ಭಾಷೆ ಓದುಗರಿಗೆ ಸುಲಭವಾಗುವಂತೆ ಇದ್ದರೂ ಅದರ ಘನತೆ ಮತ್ತು ಮೂಲದ ಎರಡು ಕ್ರಿಯಾಪದಗಳ ಭೇದವನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
