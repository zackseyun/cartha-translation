reference: Matthew 4:7
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: kn
  text: 'ಯೇಸು ಅವನಿಗೆ, “ಮತ್ತೆ ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ: ‘ನಿನ್ನ ದೇವರಾದ ಕರ್ತನನ್ನು[b] ಪರೀಕ್ಷಿಸಬಾರದು[a].’” ಎಂದು ಹೇಳಿದನು.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಪರೀಕ್ಷಿಸಬಾರದು’ ಎಂಬುದನ್ನು ‘ಪರೀಕ್ಷೆಗೆ ಒಡ್ಡಬಾರದು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಪರೀಕ್ಷಿಸುವುದು ಅಥವಾ ಪರೀಕ್ಷೆಗೆ ಒಡ್ಡುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ನೀಡಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಇದು ಧರ್ಮೋಪದೇಶಕಾಂಡ 6:16ರ ಉಲ್ಲೇಖ. ಇಲ್ಲಿ ಗ್ರೀಕ್‌ನ ‘ಕರ್ತನು’ ಎಂಬ ಪದವು ಸೆಪ್ಟುವಜಿಂಟ್‌ನಲ್ಲಿ ದೈವನಾಮಕ್ಕೆ ಬಳಸಿದ ರೂಪವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: ಯೇಸು ಅವನಿಗೆ ಹೇಳಿದನು
  rationale: ಸರಳವಾದ ಮಾತಿನ ಪರಿಚಯವನ್ನೂ ದತ್ತಿವ್ ಸರ್ವನಾಮದ ಸಂಬಂಧವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Πάλιν
  choice: ಇನ್ನೊಂದೆಡೆ
  rationale: ಇಲ್ಲಿ ಯೇಸು ಪ್ರಲೋಭಕನು ಉಲ್ಲೇಖಿಸಿದ ವಚನಕ್ಕೆ ಪ್ರತಿಯಾಗಿ ಮತ್ತೊಂದು ಶಾಸ್ತ್ರವಚನವನ್ನು ಮುಂದಿಡುತ್ತಾನೆ. ಆದ್ದರಿಂದ ಕೇವಲ ಕಾಲಕ್ರಮದ ‘ಮತ್ತೆ’ಗಿಂತ ಪ್ರತಿವಾದದ ಭಾವವನ್ನು ‘ಇನ್ನೊಂದೆಡೆ’ ಸಹಜವಾಗಿ ಹಿಡಿಯುತ್ತದೆ; ‘ಮತ್ತೆ’ ಎಂಬ ನೇರ ಪರ್ಯಾಯವೂ ಸಾಧ್ಯ.
- source_word: γέγραπται
  choice: ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ
  rationale: ಪರಿಪೂರ್ಣ ಕರ್ಮಣಿ ರೂಪದ ಶಾಸ್ತ್ರೋಕ್ತ ಸೂತ್ರವನ್ನು ಕನ್ನಡದ ರೂಢಿಯಾದ, ಅಧಿಕಾರಪೂರ್ಣ ಉಲ್ಲೇಖ ಶೈಲಿಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: Οὐκ ἐκπειράσεις
  choice: ಪರೀಕ್ಷಿಸಬಾರದು
  rationale: ಭವಿಷ್ಯತ್ಕಾಲ ರೂಪವು ಇಲ್ಲಿ ನಿಷೇಧಾಜ್ಞೆಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ. ‘ಪರೀಕ್ಷಿಸಬಾರದು’ ಆ ಆಜ್ಞಾರ್ಥವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: κύριον τὸν θεόν σου
  choice: ನಿನ್ನ ದೇವರಾದ ಕರ್ತನನ್ನು
  rationale: κύριος ಅನ್ನು ‘ಕರ್ತನು’ ಎಂದು ಅನುವಾದಿಸಿ, τὸν θεόν σου ಎಂಬ ಸಮಾನಾಧಿಕರಣ ಪದಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ನಿನ್ನ ದೇವರಾದ’ ಎಂದು ಜೋಡಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಇಸ್ರಾಯೇಲಿನ ದೇವರನ್ನು ಸೂಚಿಸುವ ಶಾಸ್ತ್ರೋಕ್ತ ಉಲ್ಲೇಖದಲ್ಲಿನ κύριος
  choice: ಕರ್ತನು
  alternative: ಯೆಹೋವನು
  rationale: ತಕ್ಷಣದ ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ κύριος ಇದೆ; ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯವು ಗ್ರೀಕ್ ಪದವನ್ನು ‘ಕರ್ತನು’ ಎಂದು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ. ಇದು ಸೆಪ್ಟುವಜಿಂಟ್‌ನಲ್ಲಿ ದೈವನಾಮಕ್ಕೆ ಬಳಸಿದ ಪ್ರತಿನಿಧಿ ಪದವೆಂಬ ಹಿನ್ನೆಲೆಯನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ; ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿಲ್ಲದ ದೈವನಾಮದ ನಿರ್ದಿಷ್ಟ ರೂಪವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಆಮದು ಮಾಡಿಲ್ಲ.
- issue: Πάλιν ಪದದ ವಾಕ್ಚಾತುರ್ಯದ ಬಲ
  choice: ಇನ್ನೊಂದೆಡೆ
  alternative: ಮತ್ತೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಮತ್ತೊಂದು ಶಾಸ್ತ್ರೋಕ್ತ ವಾಕ್ಯವನ್ನು ಪ್ರತಿಯಾಗಿ ಮುಂದಿಡುತ್ತದೆ. ‘ಇನ್ನೊಂದೆಡೆ’ ಆ ಪ್ರತಿಯುತ್ತರದ ಸಂಬಂಧವನ್ನು ತೋರಿಸುತ್ತದೆ; ಆದರೆ ‘ಮತ್ತೆ’ ಎಂಬ ನೇರ ಅರ್ಥವನ್ನೂ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶಾಸ್ತ್ರೋಕ್ತ ಶೈಲಿ. ಉಲ್ಲೇಖದ ಆಜ್ಞಾರ್ಥವನ್ನು ಕಠಿಣ ಪುರಾತನ ರೂಪಕ್ಕಿಂತ ಜನಸಾಮಾನ್ಯರಿಗೆ ಸ್ಪಷ್ಟವಾದ ‘ಪರೀಕ್ಷಿಸಬಾರದು’ ಎಂದು ನೀಡಲಾಗಿದೆ. ಎಲ್ಲಾ ಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
