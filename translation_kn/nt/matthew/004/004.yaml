id: MAT.4.4
reference: Matthew 4:4
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: kn
  text: 'ಆದರೆ ಆತನು ಉತ್ತರಿಸಿದನು: “ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ: ‘ಮನುಷ್ಯನು[a] ರೊಟ್ಟಿಯಿಂದ ಮಾತ್ರ ಬದುಕುವುದಿಲ್ಲ; ದೇವರ ಬಾಯಿಯ ಮೂಲಕ ಹೊರಡುವ ಪ್ರತಿಯೊಂದು ಮಾತಿನಿಂದಲೂ[b] ಬದುಕುವನು.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಇಲ್ಲಿ ‘ಮನುಷ್ಯನು’ ಎಂಬುದು ಒಬ್ಬ ನಿರ್ದಿಷ್ಟ ಪುರುಷನನ್ನು ಮಾತ್ರ ಸೂಚಿಸುವುದಿಲ್ಲ; ಸಾಮಾನ್ಯವಾಗಿ ಎಲ್ಲ ಮಾನವರನ್ನೂ ಪ್ರತಿನಿಧಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅನೇಕ ಅನುವಾದಗಳು ಇಲ್ಲಿ ‘ದೇವರ ಬಾಯಿಂದ’ ಎನ್ನುತ್ತವೆ. ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ದೇವರ ಬಾಯಿಯ ಮೂಲಕ’ ಎಂದಿದ್ದು, ದೇವರು ಉಚ್ಚರಿಸುವ ಪ್ರತಿಯೊಂದು ಮಾತಿನ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ಉತ್ತರಿಸಿದನು
  rationale: ಗ್ರೀಕ್‌ನ ‘ಉತ್ತರವಾಗಿ ಹೇಳಿದನು’ ಎಂಬ ನಿರೂಪಣಾ ಪ್ರಯೋಗವನ್ನು ಅನಗತ್ಯ ಪುನರುಕ್ತಿಯಿಲ್ಲದೆ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Γέγραπται
  choice: ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ
  rationale: ಶಾಸ್ತ್ರೋಕ್ತಿಯನ್ನು ಪರಿಚಯಿಸುವ ಪರಿಪೂರ್ಣ ಕರ್ಮಣಿ ರೂಪದ ಸ್ಥಿರವಾದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἄρτῳ μόνῳ
  choice: ರೊಟ್ಟಿಯಿಂದ ಮಾತ್ರ
  rationale: ἄρτος ಎಂಬುದರ ನೇರ ಅರ್ಥವಾದ ‘ರೊಟ್ಟಿ’ಯನ್ನು ಉಳಿಸಿ, ಅದನ್ನು ವಿಶಾಲಾರ್ಥದ ‘ಆಹಾರ’ ಎಂದು ಅರ್ಥವಿಸ್ತಾರ ಮಾಡಿಲ್ಲ.
- source_word: ζήσεται
  choice: ಬದುಕುವುದಿಲ್ಲ … ಬದುಕುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಹೇಳಿಕೆಯನ್ನು ಕನ್ನಡದ ಸಹಜ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಕೊನೆಯ ‘ಬದುಕುವನು’ ಮೂಲದ ಭವಿಷ್ಯಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ ἄνθρωπος
  choice: ಮನುಷ್ಯನು
  rationale: ನಿರ್ದಿಷ್ಟ ಪುರುಷನನ್ನಲ್ಲ, ಮಾನವಕುಲದ ಪ್ರತಿನಿಧಿಯಾಗಿ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸೂಚಿಸುವ ಸಾಮಾನ್ಯ ಏಕವಚನವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: παντὶ ῥήματι
  choice: ಪ್ರತಿಯೊಂದು ಮಾತಿನಿಂದಲೂ
  rationale: ದೇವರು ಉಚ್ಚರಿಸುವ ಪ್ರತಿಯೊಂದು ಮಾತನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; ‘ಮಾತು’ ಆ ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವೂ ನಿಖರವೂ ಆಗಿದೆ.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: ದೇವರ ಬಾಯ ಮೂಲಕ ಹೊರಡುವ
  rationale: ἐκπορεύομαι ಎಂಬುದರ ಹೊರಡುವ ಚಿತ್ರಣವನ್ನೂ διά + ಷಷ್ಠಿಯ ‘ಮೂಲಕ’ ಎಂಬ ರೂಪವನ್ನೂ ಸಾಧ್ಯವಾದಷ್ಟು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ὁ ἄνθρωπος ಎಂಬ ಪ್ರತಿನಿಧಿಕ ಪುಲ್ಲಿಂಗ
  choice: ಮನುಷ್ಯನು
  alternative: ಮಾನವನು / ಒಬ್ಬ ವ್ಯಕ್ತಿ
  rationale: ಈ ವಾಕ್ಯವು ಎಲ್ಲ ಮಾನವರ ಕುರಿತು ಸಾಮಾನ್ಯ ಸತ್ಯವನ್ನು ಹೇಳುತ್ತದೆ. ‘ಮನುಷ್ಯನು’ ಮೂಲದ ಏಕವಚನ ರೂಪವನ್ನು ಉಳಿಸುವುದರ ಜೊತೆಗೆ ಕನ್ನಡದಲ್ಲಿ ಸಾಮಾನ್ಯ ಮಾನವ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ; ಅಡಿಕುರಿಪು ಅದರ ವ್ಯಾಪ್ತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- issue: Γέγραπται ಎಂಬ ಶಾಸ್ತ್ರೋಕ್ತಿ ಸೂತ್ರ
  choice: ಹೀಗೆ ಬರೆಯಲಾಗಿದೆ
  alternative: ಬರೆದಿದೆ
  rationale: ಶಾಸ್ತ್ರದಲ್ಲಿ ಬರೆಯಲ್ಪಟ್ಟಿರುವುದರ ಪ್ರಸ್ತುತ ಸ್ಥಿರತೆಯನ್ನು ಸೂಚಿಸುವ ಪರಿಚಿತ ಸೂತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ; ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- issue: διὰ στόματος θεοῦ ಎಂಬ ರೂಪಕ
  choice: ದೇವರ ಬಾಯ ಮೂಲಕ
  alternative: ದೇವರ ಬಾಯಿಂದ
  rationale: ಹೆಚ್ಚು ಪರಿಚಿತವಾದ ‘ಬಾಯಿಂದ’ ಎಂಬ ರೂಪಕ್ಕೆ ಬದಲಾಯಿಸದೆ, SBLGNT ಪಾಠದಲ್ಲಿರುವ διάಯ ‘ಮೂಲಕ’ ಎಂಬ ಅರ್ಥವನ್ನೂ ದೇವರ ಉಚ್ಚಾರಣೆಯ ರೂಪಕವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ಶಾಸ್ತ್ರೋಕ್ತಿಯ ಔಪಚಾರಿಕತೆ ಉಳಿದಿದ್ದರೂ ಹಳೆಯ ಅಥವಾ ಅಸ್ಪಷ್ಟ ಪದಪ್ರಯೋಗಗಳನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
