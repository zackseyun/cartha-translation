id: MAT.4.14
reference: Matthew 4:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: kn
  text: 'ಪ್ರವಾದಿಯಾದ ಯೆಶಾಯನ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತೆ ಹೀಗಾಯಿತು:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ನೆರವೇರುವಂತೆ
  rationale: ಉದ್ದೇಶ ಅಥವಾ ಫಲಿತಾಂಶದ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಹಿಂದಿನ ವಾಕ್ಯದ ಘಟನೆಯೊಂದಿಗೆ ಸೂತ್ರವಾಕ್ಯವನ್ನು ಜೋಡಿಸುತ್ತದೆ.
- source_word: πληρωθῇ
  choice: ನೆರವೇರುವಂತೆ
  rationale: ಆಓರಿಸ್ಟ್ ಕರ್ಮಣಿ ಸಬ್ಜಂಕ್ಟಿವ್ ರೂಪದ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನೂ, ಮತ್ತಾಯನ ಶಾಸ್ತ್ರನೆರವೇರಿಕೆಯ ಪ್ರಮುಖ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ ῥηθὲν
  choice: ಹೇಳಲ್ಪಟ್ಟದ್ದು
  rationale: ಲೇಖಸಹಿತ ಕರ್ಮಣಿ ಕೃದಂತದ ನಾಮಪದೀಯ ಬಳಕೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಹಾಗೂ ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: διὰ
  choice: ಮೂಲಕ
  rationale: ಷಷ್ಠೀ ವಿಭಕ್ತಿಯೊಂದಿಗೆ διά ಪ್ರವಾದಿಯನ್ನು ಮಧ್ಯವರ್ತಿ ವಕ್ತಾರನಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಯೆಶಾಯನು ಹೇಳಿದ್ದು’ ಎಂಬ ಸಮತಟ್ಟಾದ ನಿರೂಪಣೆಗೆ ಬದಲು ಮಧ್ಯಸ್ಥಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: Ἠσαΐου
  choice: ಯೆಶಾಯ
  rationale: ಕನ್ನಡ ಸತ್ಯವೇದ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಪ್ರವಾದಿಯ ಹೆಸರಿನ ರೂಪ.
- source_word: τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯಾದ
  rationale: ಯೆಶಾಯನ ಪಾತ್ರವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಗುರುತಿಸುವ ಸಮಾನಾಧಿಕರಣ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: λέγοντος
  choice: ಹೀಗೆ
  rationale: ಮುಂದಿನ ನೇರ ಉಲ್ಲೇಖವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಪರಿಚಯಿಸುತ್ತದೆ; ಅದರ ‘ಹೇಳುತ್ತಾ/ಹೇಳುವ’ ಎಂಬ ಕಾರ್ಯವನ್ನು ಮುಖ್ಯ ವಾಕ್ಯದ ‘ಹೇಳಲ್ಪಟ್ಟದ್ದು’ ಜೊತೆ ಅನಗತ್ಯವಾಗಿ ಪುನರಾವರ್ತಿಸದೆ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ ನೆರವೇರಿಕೆ ಸೂತ್ರ
  choice: ‘ನೆರವೇರುವಂತೆ’ ಎಂದು ಅನುವಾದಿಸಿ ಶಾಸ್ತ್ರನೆರವೇರಿಕೆಯ ಭಾವವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನಿಜವಾಯಿತು’ ಅಥವಾ ‘ಈಡೇರಿತು’
  rationale: πληρόω ಪದವು ಮತ್ತಾಯನಲ್ಲಿ ಶಾಸ್ತ್ರದ ನೆರವೇರಿಕೆಯನ್ನು ಸೂಚಿಸುವ ಉದ್ದೇಶಪೂರ್ವಕ ಪದಪ್ರಯೋಗವಾಗಿದೆ. ‘ನೆರವೇರು’ ಆ ಅಂತರಪಠ್ಯ ಮತ್ತು ದೇವತಾತ್ತ್ವಿಕ ಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ; ಆದರೆ ಅದರ ಅರ್ಥವನ್ನು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ವಿವರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ವಾಕ್ಯವು ಹಿಂದಿನ ಘಟನೆಯನ್ನು ಅವಲಂಬಿಸಿರುವುದರಿಂದ ‘ಹೀಗಾಯಿತು’ ಸೇರಿಸಿ ಕನ್ನಡದಲ್ಲಿ ಪೂರ್ಣ ಹಾಗೂ ಸಹಜ ವಾಕ್ಯವನ್ನಾಗಿ ಮಾಡಲಾಗಿದೆ; ಮುಂದಿನ ಉಲ್ಲೇಖಕ್ಕಾಗಿ ದ್ವಿಬಿಂದು ಮತ್ತು ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು ಬಳಸಲಾಗಿದೆ.
