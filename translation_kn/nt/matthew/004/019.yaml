  - severity: low
    issue: Footnote wording begins by contrasting “ಗಂಡಸರನ್ನು ಮಾತ್ರವಲ್ಲ”
    rationale: The relevant point is the generic-human reference of ἀνθρώπων. A direct statement that “ಮನುಷ್ಯರು” here denotes all human beings is more precise and less likely to imply an unnecessary lexical restriction.
