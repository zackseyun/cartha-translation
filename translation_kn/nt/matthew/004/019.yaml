  source_fidelity: The draft accurately reflects the historical present λέγει (“ಹೇಳುತ್ತಾನೆ”), the summons Δεῦτε ὀπίσω μου (“ನನ್ನ ಹಿಂದೆ ಬನ್ನಿರಿ”), the future promise ποιήσω (“ಮಾಡುವೆನು”), and the fishing metaphor. The predicate construction “ನಿಮ್ಮನ್ನು ... ಆಗಿ ಮಾಡುವೆನು” correctly represents ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
  naturalness: The sentence is clear and dignified modern Kannada. However, “ಬೆಸ್ತರು” can be understood as a community/caste-associated designation as well as an occupation in current Kannada. “ಮೀನುಗಾರರು” is more broadly transparent and avoids an unintended social designation while retaining the occupational image.
  terminology: “ಮನುಷ್ಯರನ್ನು” appropriately conveys ἀνθρώπων as human beings generally. The footnote should clarify this generic sense without suggesting that the Kannada word itself necessarily means only males. “ಮೀನುಗಾರರು” is the safer modern-standard rendering for ἁλιεῖς.
