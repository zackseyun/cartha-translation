id: MAT.4.19
reference: Matthew 4:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: kn
  text: ಆತನು ಅವರಿಗೆ, “ನನ್ನ ಹಿಂದೆ ಬನ್ನಿರಿ; ನಾನು ನಿಮ್ಮನ್ನು ಮನುಷ್ಯರನ್ನು ಹಿಡಿಯುವ ಮೀನುಗಾರರನ್ನಾಗಿ ಮಾಡುವೆನು” ಎಂದು ಹೇಳುತ್ತಾನೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಇಲ್ಲಿ “ಮನುಷ್ಯರು” ಎಂಬುದು ಸಾಮಾನ್ಯವಾಗಿ ಎಲ್ಲ ಮಾನವರನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; “ಜನರನ್ನು ಹಿಡಿಯುವ ಮೀನುಗಾರರು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ಹೇಳುತ್ತಾನೆ
  rationale: ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಸುವಾರ್ತೆಯ ನಿರೂಪಣೆಯಲ್ಲಿ ಇದು ಸಹಜವಾದ ಕಥನಶೈಲಿ.
- source_word: Δεῦτε
  choice: ಬನ್ನಿರಿ
  rationale: ಆಜ್ಞಾರ್ಥಕ ಕರೆಯನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಗೌರವಯುತ ಬಹುವಚನ ರೂಪವು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದೆ.
- source_word: ὀπίσω μου
  choice: ನನ್ನ ಹಿಂದೆ
  rationale: ‘ನನ್ನ ಹಿಂದೆ/ನನ್ನ ಅನಂತರ’ ಎಂಬ ಮೂಲ ರೂಪಕವನ್ನು ಉಳಿಸಿ, ಶಿಷ್ಯತ್ವದ ಅರ್ಥವನ್ನು ಸಂದರ್ಭದಿಂದ ವ್ಯಕ್ತವಾಗಲು ಬಿಡುತ್ತದೆ.
- source_word: ποιήσω
  choice: ಮಾಡುವೆನು
  rationale: ಯೇಸುವಿನ ಭವಿಷ್ಯಕಾಲದ ಪರಿವರ್ತಕ ಕ್ರಿಯೆಯನ್ನು ನೇರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἁλιεῖς
  choice: ಬೆಸ್ತರು
  rationale: ಮೀನು ಹಿಡಿಯುವವರನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಪದ; ರೂಪಕದ ವೃತ್ತಿಪರ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἀνθρώπων
  choice: ಮನುಷ್ಯರನ್ನು
  rationale: ಇಲ್ಲಿ ಪದವು ಗಂಡಸರಿಗಷ್ಟೇ ಅಲ್ಲ, ಸಾಮಾನ್ಯವಾಗಿ ಮಾನವರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ಮನುಷ್ಯರು’ ಈ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ.
theological_decisions:
- issue: ἁλιεῖς ἀνθρώπων ಎಂಬ ರೂಪಕದ ಲಿಂಗ ಮತ್ತು ವ್ಯಾಪ್ತಿ
  choice: ಮನುಷ್ಯರನ್ನು ಹಿಡಿಯುವ ಬೆಸ್ತರು
  alternative: ಜನರನ್ನು ಹಿಡಿಯುವ ಬೆಸ್ತರು
  rationale: ἀνθρώπων ಇಲ್ಲಿ ಸಮಸ್ತ ಮಾನವರನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮನುಷ್ಯರನ್ನು’ ಮೂಲಪದದ ಮಾನವಸಂಬಂಧಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಜನರನ್ನು’ ಸಹ ಸಾಧ್ಯವಾದ ಸಹಜ ಪರ್ಯಾಯ.
- issue: ‘ಹಿಡಿಯುವ’ ಎಂಬ ರೂಪಕದ ಸ್ವರೂಪ
  choice: ರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುವುದು
  alternative: ಮನುಷ್ಯರನ್ನು ದೇವರ ಬಳಿಗೆ ತರುವವರು
  rationale: ಮೂಲದಲ್ಲಿರುವ ಮೀನುಗಾರಿಕೆಯ ರೂಪಕವನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ಬದಲಿಸದೆ, ಅದರ ಅರ್ಥವ್ಯಾಪ್ತಿ ಮತ್ತು ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನು ಓದುಗರಿಗೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ dignified, ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ಬನ್ನಿರಿ’ ಮತ್ತು ‘ಮಾಡುವೆನು’ ಎಂಬ ರೂಪಗಳು ಗೌರವಯುತ ಶಾಸ್ತ್ರಪಠನದ ಧಾಟಿಯನ್ನು ಉಳಿಸುತ್ತವೆ; ವಾಕ್ಯಕ್ರಮವು ಗ್ರೀಕ್ ಮೂಲದ ಅರ್ಥಘಟಕಗಳನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಪ್ರತ್ಯೇಕವಾಗಿ ಕಾಪಾಡುತ್ತದೆ.
