  to: ಆತನು ಅವರಿಗೆ, “ನನ್ನ ಹಿಂದೆ ಬನ್ನಿರಿ; ನಾನು ನಿಮ್ಮನ್ನು ಮನುಷ್ಯರನ್ನು ಹಿಡಿಯುವ ಮೀನುಗಾರರನ್ನಾಗಿ ಮಾಡುವೆನು” ಎಂದು ಹೇಳುತ್ತಾನೆ.[a]
