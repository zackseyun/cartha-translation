id: MAT.4.22
reference: Matthew 4:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: kn
  text: ಅವರು ತಕ್ಷಣವೇ[a] ದೋಣಿಯನ್ನೂ ತಮ್ಮ ತಂದೆಯನ್ನೂ ಬಿಟ್ಟು ಆತನನ್ನು ಹಿಂಬಾಲಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಈ ಕೂಡಲೇ.’
    reason: εὐθέωςಗೆ ‘ತಕ್ಷಣವೇ’ ಎಂಬ ಮುಖ್ಯ ಅನುವಾದದ ಸಹಜ lexical alternative; ಇಂಗ್ಲಿಷ್ POB audit trail‌ನ ‘at once’ ಪಾದಟಿಪ್ಪಣಿಗೆ ಹೊಂದಿಕೆಯಾಗುತ್ತದೆ.
lexical_decisions:
- source_word: οἱ δὲ
  choice: ಅವರು
  rationale: οἱ ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಇಬ್ಬರು ಸಹೋದರರನ್ನು ಸೂಚಿಸುತ್ತದೆ. δέ ಇಲ್ಲಿ ಕಥನವನ್ನು ಮುಂದುವರಿಸುವ ಸೌಮ್ಯ ಸಂಪರ್ಕಪದ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಸಂಯೋಜಕವನ್ನು ಸೇರಿಸದೆ ಹೇಳುವುದು ಸಹಜವಾಗಿದ್ದು ಅದರ ಅರ್ಥವನ್ನು ಅತಿಯಾಗಿ ಒತ್ತಿಹೇಳುವುದಿಲ್ಲ.
- source_word: εὐθέως
  choice: ತಕ್ಷಣವೇ
  rationale: ಈ ಪದವು ವಿಳಂಬವಿಲ್ಲದ ತ್ವರಿತ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ತಕ್ಷಣವೇ’ ಆ ಒತ್ತನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀφέντες
  choice: ಬಿಟ್ಟು
  rationale: ಏಕಕಾಲಿಕವಲ್ಲದೆ ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ aorist participle ಇಲ್ಲಿ ‘ಬಿಟ್ಟು’ ಎಂದು ಸಹಜವಾಗಿ ಬರುತ್ತದೆ. ಇದು ‘ತ್ಯಜಿಸಿ’ ಎಂಬ ಹೆಚ್ಚು ಭಾರಿತ ಅರ್ಥವನ್ನು ಹೇರದೆ ನಿರ್ಣಾಯಕವಾಗಿ ಹೊರಟದ್ದನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: τὸ πλοῖον
  choice: ದೋಣಿಯನ್ನು
  rationale: ಮೀನುಗಾರಿಕೆಯ ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ πλοῖονಗೆ ‘ಹಡಗು’ಗಿಂತ ‘ದೋಣಿ’ ಹೆಚ್ಚು ಸೂಕ್ತ ಮತ್ತು ಸಹಜ.
- source_word: τὸν πατέρα αὐτῶν
  choice: ತಮ್ಮ ತಂದೆಯನ್ನು
  rationale: ಕರ್ತೃಗಳಾದ ಅವರನ್ನೇ ಸಂಬಂಧಿಸುವ ಪ್ರತಿಫಲಕ ಸ್ವಾಮ್ಯರೂಪ ‘ತಮ್ಮ’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ; ಕುಟುಂಬ ಸಂಬಂಧದ ಸ್ಪಷ್ಟತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ಆತನನ್ನು ಹಿಂಬಾಲಿಸಿದರು
  rationale: ἀκολουθέω ಇಲ್ಲಿ ದೈಹಿಕವಾಗಿ ಹಿಂದೆ ಹೋಗುವುದು ಮತ್ತು ಶಿಷ್ಯತ್ವದ ಅರ್ಥ ಎರಡನ್ನೂ ಹೊರುತ್ತದೆ. ‘ಹಿಂಬಾಲಿಸಿದರು’ ಈ ಎರಡೂ ಸಾಧ್ಯತೆಗಳನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಆತನನ್ನು’ ಗೌರವಪೂರ್ಣ ಸರ್ವನಾಮವಾಗಿ ಯೇಸುವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಶಿಷ್ಯತ್ವದ ಪ್ರತಿಕ್ರಿಯೆ ಮತ್ತು ತಂದೆಯಿಂದ ಬೇರ್ಪಡುವಿಕೆ
  choice: ದೋಣಿಯನ್ನೂ ತಂದೆಯನ್ನೂ ತಕ್ಷಣ ಬಿಟ್ಟು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ ನಿರ್ಣಾಯಕ ಪ್ರತಿಕ್ರಿಯೆಯಾಗಿ ಸರಳವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಅವರು ತಂದೆಯನ್ನು ಶಾಶ್ವತವಾಗಿ ತ್ಯಜಿಸಿದರು; ಅಥವಾ ಕೇವಲ ಸ್ವಲ್ಪಕಾಲ ದೂರ ಹೋದರು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಪ್ರತಿಕ್ರಿಯೆಯ ತಕ್ಷಣಿಕತೆ ಮತ್ತು ನಿರ್ಣಾಯಕತೆಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ; ಆದರೆ ἀφέντες ಎಂಬುದು ಬೇರ್ಪಡುವಿಕೆಯ ಅವಧಿ ಅಥವಾ ಶಾಶ್ವತತೆಯನ್ನು ಸ್ವತಃ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ‘ಬಿಟ್ಟು’ ಎಂಬ ತಟಸ್ಥವಾದರೂ ಬಲವಾದ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ‘ದೋಣಿಯನ್ನೂ ತಮ್ಮ ತಂದೆಯನ್ನೂ’ ಎಂಬ ಜೋಡಣೆ ಮೂಲದ καὶ ... καὶ ರಚನೆಯನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಠ್ಯದ [a] ಗುರುತು ಪಾದಟಿಪ್ಪಣಿಗೆ ಸರಿಯಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ.
