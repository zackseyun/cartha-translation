id: MAT.4.25
reference: Matthew 4:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: kn
  text: ಗಲಿಲಾಯ, ದೆಕಪೊಲಿ, ಯೆರೂಸಲೇಮ್, ಯೂದಾಯ ಮತ್ತು ಯೊರ್ದನ್ ನದಿಯ ಆಚೆಯ ಪ್ರದೇಶಗಳಿಂದ[a] ದೊಡ್ಡ ಜನಸಮೂಹಗಳು ಆತನನ್ನು ಹಿಂಬಾಲಿಸಿದವು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಯೊರ್ದನ್ ನದಿಯ ಆಚೆಯಿಂದ.”
    reason: πέραν τοῦ Ἰορδάνου ಎಂಬುದು ಆಚೆಯ ಪ್ರದೇಶವನ್ನು ಅಥವಾ ನದಿಯ ಆ ಪಾರಿನಿಂದ ಬಂದದ್ದನ್ನು ಸೂಚಿಸುವ ರೀತಿಯಲ್ಲಿ ಅನುವಾದಿಸಬಹುದು.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: ಹಿಂಬಾಲಿಸಿದವು
  rationale: ἀκολουθέω ಎಂಬ ಕ್ರಿಯೆಯ ಕಥನಸಂದರ್ಭದ ಸಹಜ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ; ದೈಹಿಕವಾಗಿ ಹಿಂದೆ ಹೋಗುವುದನ್ನೂ ಶಿಷ್ಯತ್ವದತ್ತ ಮೂಡುತ್ತಿದ್ದ ಆಸಕ್ತಿಯನ್ನೂ ಅನಗತ್ಯವಾಗಿ ಗಾಢಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- source_word: ὄχλοι πολλοὶ
  choice: ದೊಡ್ಡ ಜನಸಮೂಹಗಳು
  rationale: ಅನೇಕರು ಸೇರಿದ್ದ ದೊಡ್ಡ ಗುಂಪುಗಳನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπὸ
  choice: …ಗಳಿಂದ
  rationale: ಮೂಲ ಅಥವಾ ಬಂದ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ἀπό ಪದವು ಇಡೀ ಸ್ಥಳಪಟ್ಟಿಯನ್ನು ವ್ಯಾಪಿಸುವಂತೆ ಕನ್ನಡದ ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತವಾಗಿದೆ.
- source_word: Γαλιλαίας
  choice: ಗಲಿಲಾಯ
  rationale: ಈ ಪ್ರದೇಶದ ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಿರವಾಗಿ ಬಳಕೆಯಲ್ಲಿರುವ ರೂಪ.
- source_word: Δεκαπόλεως
  choice: ದೆಕಪೊಲಿ
  rationale: ‘ಹತ್ತು ನಗರಗಳು’ ಎಂಬ ಹೆಸರಿನಿಂದ ಪ್ರಸಿದ್ಧವಾದ ನಗರಸಂಘ/ಪ್ರದೇಶದ ರೂಢಿಯಾದ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
- source_word: Ἱεροσολύμων
  choice: ಯೆರೂಸಲೇಮ್
  rationale: ಸ್ಥಳನಾಮದ ರೂಢಿಯಾದ ಕನ್ನಡ ರೂಪ; ಗ್ರೀಕ್ ವ್ಯಾಕರಣರೂಪ ಬಹುವಚನದಂತಿದ್ದರೂ ಸ್ಥಳನಾಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಏಕವಚನವಾಗಿಯೇ ಬಳಸಲಾಗಿದೆ.
- source_word: Ἰουδαίας
  choice: ಯೂದಾಯ
  rationale: ಪ್ರದೇಶನಾಮದ ರೂಢಿಯಾದ ಕನ್ನಡ ರೂಪ.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ಯೊರ್ದನ್ ನದಿಯ ಆಚೆಯ ಪ್ರದೇಶಗಳಿಂದ
  rationale: ಯೊರ್ದನಿನ ಆಚೆ/ಆ ಪಾರಿನ ಭೂಭಾಗ ಎಂಬ ಸ್ಥಳಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ; ನಿರ್ದಿಷ್ಟ ಪ್ರದೇಶದ ಹೆಸರನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: καὶ ... καὶ ... καὶ
  choice: ಪಟ್ಟಿಯ ಕೊನೆಯಲ್ಲಿ ‘ಮತ್ತು’
  rationale: ಕನ್ನಡದ ಸಹಜ ಪಟ್ಟಿರಚನೆಯನ್ನು ಅನುಸರಿಸಿ ಸ್ಥಳಗಳ ಸಂಚಿತ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಪ್ರತಿಯೊಂದು καί ಅನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ಪುನರಾವರ್ತಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಆತನನ್ನು’ ಎಂಬ ರೂಪವು ಸನ್ನಿವೇಶದಲ್ಲಿರುವ ಯೇಸುವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸ್ಥಳಗಳ ಪಟ್ಟಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಓದುವಂತೆ ಅಲ್ಪವಿರಾಮಗಳೊಂದಿಗೆ ಕಟ್ಟಲಾಗಿದೆ; ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು [a] ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
