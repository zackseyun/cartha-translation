id: MAT.4.5
reference: Matthew 4:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: kn
  text: ಆಗ ಸೈತಾನನು ಆತನನ್ನು ಪವಿತ್ರ ನಗರಕ್ಕೆ[a] ಕರೆದುಕೊಂಡು ಹೋಗಿ, ದೇವಾಲಯದ ಶಿಖರದ ಮೇಲೆ[b] ನಿಲ್ಲಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಂದರೆ, ಯೆರೂಸಲೇಮ್.
    reason: cross_reference
  - marker: b
    text: ಅಥವಾ, ‘ದೇವಾಲಯದ ಹೊರಚಾಚಿದ ಭಾಗ’; ಗ್ರೀಕ್ ಪದವು ದೇವಾಲಯ ಸಂಕೀರ್ಣದ ಹೊರಚಾಚಿದ ಅಂಚನ್ನು ಅಥವಾ ಅತ್ಯುನ್ನತ ಭಾಗವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಸೂಚಿಸುವ ಸಹಜವಾದ ಕಾಲಾನುಕ್ರಮದ ಪದ.
- source_word: παραλαμβάνει
  choice: ಕರೆದುಕೊಂಡು ಹೋಗಿ
  rationale: ಇಲ್ಲಿ ಒಬ್ಬನನ್ನು ತನ್ನೊಂದಿಗೆ ಒಂದು ಸ್ಥಳಕ್ಕೆ ಕರೆದೊಯ್ಯುವ ಅರ್ಥವಿದೆ. ಗ್ರೀಕ್‌ನ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಯಲ್ಲಿ ಭೂತಕಾಲವಾಗಿ ನಿರೂಪಿಸಲಾಗಿದೆ.
- source_word: ὁ διάβολος
  choice: ಪಿಶಾಚನು
  rationale: ಈ ಸನ್ನಿವೇಶದಲ್ಲಿ ಇದು ಸೈತಾನನಿಗೆ ಬಳಸಿದ ವೈಯಕ್ತಿಕ ಬಿರುದು; ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಿರವೂ ಸಹಜವೂ ಆದ ಪದ.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: ಪವಿತ್ರ ನಗರಕ್ಕೆ
  rationale: ಚಲನೆಯ ಗಮ್ಯವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಮೂಲದಲ್ಲಿರುವ ಗೌರವಸೂಚಕ ವರ್ಣನೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἔστησεν
  choice: ನಿಲ್ಲಿಸಿದನು
  rationale: 'ಕ್ರಿಯಾಪದವು ಇಲ್ಲಿ ಸಕರ್ಮಕ/ಕಾರಣಾರ್ಥಕ: ಪಿಶಾಚನು ಆತನನ್ನು ಆ ಸ್ಥಳದಲ್ಲಿ ನಿಲ್ಲಿಸಿದನು.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: ಶಿಖರದ ಮೇಲೆ
  rationale: ದೇವಾಲಯದ ಹೊರಚಾಚಿದ ಎತ್ತರದ ಅಂಚು ಅಥವಾ ಅತ್ಯುನ್ನತ ಭಾಗವನ್ನು ಸೂಚಿಸಬಹುದಾದ ಪದಕ್ಕೆ ಓದಲು ಸಹಜವಾದ ಪರಂಪರಾಗತ ಸಮಾನಾರ್ಥಕ; ನಿಖರ ವಾಸ್ತುಸ್ಥಳದ ಅನಿಶ್ಚಿತತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τοῦ ἱεροῦ
  choice: ದೇವಾಲಯದ
  rationale: ἱερόν ಒಳಗಿನ ಗರ್ಭಗುಡಿಗಷ್ಟೇ ಅಲ್ಲ, ವಿಶಾಲ ದೇವಾಲಯ ಸಂಕೀರ್ಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ 'ದೇವಾಲಯ' ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ‘ಪವಿತ್ರ ನಗರ’ದ ಗುರುತು
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಪವಿತ್ರ ನಗರ’ ಎಂಬ ಮೂಲದ ವರ್ಣನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಯೆರೂಸಲೇಮ್’ ಎಂದು ನೇರವಾಗಿ ಹೆಸರಿಸುವುದು.
  rationale: ಮೂಲಪಠ್ಯವು ಸ್ಥಳನಾಮದ ಬದಲು ಗೌರವಸೂಚಕ ವರ್ಣನೆಯನ್ನು ಬಳಸುತ್ತದೆ. ಅದರ ಗುರುತನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡುವುದರಿಂದ ಮೂಲದ ರೂಪವೂ ಮಾಹಿತಿಯೂ ಉಳಿಯುತ್ತವೆ.
- issue: πτερύγιον τοῦ ἱεροῦ ಎಂಬ ವಾಸ್ತುಪದದ ಅರ್ಥ
  choice: ‘ದೇವಾಲಯದ ಶಿಖರ’
  alternative: ‘ದೇವಾಲಯದ ಹೊರಚಾಚಿದ ಅಂಚು’ ಅಥವಾ ‘ದೇವಾಲಯ ಸಂಕೀರ್ಣದ ಅತ್ಯುನ್ನತ ಭಾಗ’
  rationale: ನಿಖರ ವಾಸ್ತುಸ್ಥಳ ಖಚಿತವಲ್ಲ. ಓದಲು ಸಹಜವಾದ ಪರಂಪರಾಗತ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇಟ್ಟು, ಪರ್ಯಾಯ ಸಾಧ್ಯತೆಗಳನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ಗ್ರೀಕ್ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಭೂತಕಾಲದ ಸರಣಿಯಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತುಗಳನ್ನು ಅವು ವಿವರಿಸುವ ಪದಗಳ ಬಳಿಯೇ ಇಡಲಾಗಿದೆ.
