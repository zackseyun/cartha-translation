translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ನಿರೂಪಣಾ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಕರ್ತೃ ಸ್ಪಷ್ಟವಾಗಲು ಸಂದರ್ಭದಿಂದ ತಿಳಿಯುವ ‘ಯೇಸು’ ಎಂಬ ಹೆಸರನ್ನು ಸೇರಿಸಲಾಗಿದೆ. ‘ಬೀಸುವ ಬಲೆ’ ಎಂಬ ಪ್ರಾದೇಶಿಕವಾಗಿ ಪರಿಚಿತ ಪದಕ್ಕೆ ವಿವರಣಾತ್ಮಕ ಅಡಿಕುರಿಪು ನೀಡಲಾಗಿದೆ; ಅಡಿಕುರಿಪಿನ ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿದೆ.
