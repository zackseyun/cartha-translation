- from: ಯೇಸು ಗಲಿಲಾಯ ಸಮುದ್ರದ ದಡದಲ್ಲಿ ನಡೆದುಕೊಂಡು ಹೋಗುತ್ತಿದ್ದಾಗ, ಪೇತ್ರನೆಂದು ಕರೆಯಲ್ಪಡುವ ಸೀಮೋನನನ್ನೂ ಅವನ ಸಹೋದರ ಅಂದ್ರೆಯನನ್ನೂ ಕಂಡನು. ಆ ಇಬ್ಬರು ಸಹೋದರರು ಸಮುದ್ರದಲ್ಲಿ ಬೀಸುವ ಬಲೆಯನ್ನು ಎಸೆಯುತ್ತಿದ್ದರು[a]; ಏಕೆಂದರೆ ಅವರು ಬೆಸ್ತರಾಗಿದ್ದರು.
  to: ಯೇಸು ಗಲಿಲಾಯ ಸಮುದ್ರದ ದಡದ ಬಳಿಯಾಗಿ ನಡೆಯುತ್ತಿದ್ದಾಗ, ಪೇತ್ರನೆಂದು ಕರೆಯಲ್ಪಡುವ ಸೀಮೋನ ಮತ್ತು ಅವನ ಸಹೋದರ ಅಂದ್ರೇಯ ಎಂಬ ಇಬ್ಬರು ಸಹೋದರರನ್ನು ಕಂಡನು. ಅವರು ಸಮುದ್ರಕ್ಕೆ ಬಲೆಯನ್ನು ಬೀಸುತ್ತಿದ್ದರು[a]; ಏಕೆಂದರೆ ಅವರು ಮೀನುಗಾರರಾಗಿದ್ದರು.
  rationale: The revision corrects the ambiguous and redundant net-casting expression, replaces a potentially community-marked occupational term with the neutral modern term “ಮೀನುಗಾರರು,” and narrows the footnote to the lexical information supported by the Greek. It retains the source’s narrative force, named persons, familial relation, setting, and explanatory clause.
  reviewer_model: gpt-5.6-terra
