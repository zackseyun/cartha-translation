id: MAT.4.18
reference: Matthew 4:18
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: kn
  text: ಯೇಸು ಗಲಿಲಾಯ ಸಮುದ್ರದ ದಡದ ಬಳಿಯಾಗಿ ನಡೆಯುತ್ತಿದ್ದಾಗ, ಪೇತ್ರನೆಂದು ಕರೆಯಲ್ಪಡುವ ಸೀಮೋನ ಮತ್ತು ಅವನ ಸಹೋದರ ಅಂದ್ರೇಯ ಎಂಬ ಇಬ್ಬರು ಸಹೋದರರನ್ನು ಕಂಡನು. ಅವರು ಸಮುದ್ರಕ್ಕೆ ಬಲೆಯನ್ನು ಬೀಸುತ್ತಿದ್ದರು[a]; ಏಕೆಂದರೆ ಅವರು ಮೀನುಗಾರರಾಗಿದ್ದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಎಸೆಯುವ ಬಲೆ.” ಮೂಲ ಗ್ರೀಕ್ ಪದವು ಮೀನು ಹಿಡಿಯಲು ಎಸೆಯುವ ಬಲೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ παρὰ τὴν θάλασσαν
  choice: ಸಮುದ್ರದ ದಡದಲ್ಲಿ ನಡೆದುಕೊಂಡು ಹೋಗುತ್ತಿದ್ದಾಗ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೆ ಸಮಕಾಲೀನವಾದ ನಿರಂತರ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; παρά + ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿ ಸಮುದ್ರದ ಪಕ್ಕವಾಗಿ ಸಾಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಈ ರೂಪ ಸಹಜವಾಗಿದೆ.
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: ಗಲಿಲಾಯ ಸಮುದ್ರ
  rationale: ಸ್ಥಿರವಾದ ಭೌಗೋಳಿಕ ಹೆಸರನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅದು ಭೌಗೋಳಿಕವಾಗಿ ಸರೋವರವಾದರೂ ಮೂಲದ θάλασσα ಎಂಬ ಪದಪ್ರಯೋಗವನ್ನು ಅನುಸರಿಸಲಾಗಿದೆ.
- source_word: εἶδεν δύο ἀδελφούς
  choice: ಆ ಇಬ್ಬರು ಸಹೋದರರನ್ನು ಕಂಡನು
  rationale: εἶδεν ಎಂಬ ಸರಳ ನಿರೂಪಣಾತ್ಮಕ ಭೂತಕಾಲಕ್ಕೆ ‘ಕಂಡನು’ ಸೂಕ್ತ; δύο ἀδελφούς ನಿಜವಾದ ಇಬ್ಬರು ಗಂಡು ಸಹೋದರರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: ಪೇತ್ರನೆಂದು ಕರೆಯಲ್ಪಡುವ ಸೀಮೋನನನ್ನು
  rationale: λεγόμενον ಎಂಬ ಕೃದಂತದ ಅರ್ಥವನ್ನು ಸಹಜವಾದ ಸಂಬಂಧಾರ್ಥಕ ಕನ್ನಡ ರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ; ಹೆಸರುಗಳನ್ನು ಕನ್ನಡದ ರೂಢಿಯ ಲಿಪ್ಯಂತರದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: ಅವನ ಸಹೋದರ ಅಂದ್ರೆಯನನ್ನು
  rationale: ಅಂದ್ರೇಯನು ಸೀಮೋನನ ಸಹೋದರನೆಂಬ ಸಮಾನಾಧಿಕರಣ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: ಸಮುದ್ರದಲ್ಲಿ ಬೀಸುವ ಬಲೆಯನ್ನು ಎಸೆಯುತ್ತಿದ್ದರು
  rationale: βάλλοντας ನಡೆಯುತ್ತಿದ್ದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ἀμφίβληστρον ಸಾಮಾನ್ಯ ಬಲೆಯಲ್ಲ, ಎಸೆದು ಮೀನು ಹಿಡಿಯುವ ನಿರ್ದಿಷ್ಟ ಬಲೆ; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಅದರ ಸ್ವರೂಪವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: ಏಕೆಂದರೆ ಅವರು ಬೆಸ್ತರಾಗಿದ್ದರು
  rationale: γάρ ನೀಡುವ ಕಾರಣಾತ್ಮಕ ವಿವರಣೆಯನ್ನು ‘ಏಕೆಂದರೆ’ ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ; ἁλιεῖς ಗೆ ಸಾಮಾನ್ಯ ಕನ್ನಡದಲ್ಲಿ ವೃತ್ತಿಯನ್ನು ಸೂಚಿಸುವ ‘ಬೆಸ್ತರು’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
