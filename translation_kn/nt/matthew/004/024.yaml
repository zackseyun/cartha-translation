id: MAT.4.24
reference: Matthew 4:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: kn
  text: ಆತನ ಕುರಿತಾದ ಸುದ್ದಿ ಸಿರಿಯಾದಾದ್ಯಂತ ಹಬ್ಬಿತು. ನಾನಾ ರೋಗಗಳಿಂದಲೂ ಯಾತನೆಗಳಿಂದಲೂ ಬಳಲುತ್ತಿದ್ದ ಎಲ್ಲ ಅಸ್ವಸ್ಥರನ್ನು, ದೆವ್ವಗಳಿಂದ ಪೀಡಿತರಾಗಿದ್ದವರನ್ನು[a], ಸೆಳವುಗಳಿಗೆ ಒಳಗಾಗುತ್ತಿದ್ದವರನ್ನು[b] ಮತ್ತು ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರನ್ನು ಜನರು ಆತನ ಬಳಿಗೆ ಕರೆತಂದರು; ಆತನು ಅವರನ್ನು ಗುಣಪಡಿಸಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ದೆವ್ವ ಹಿಡಿದವರನ್ನು’ ಅಥವಾ ‘ದೆವ್ವದ ಅಧೀನದಲ್ಲಿದ್ದವರನ್ನು.’
    reason: lexical_alternative
  - marker: b
    text: ಗ್ರೀಕ್ ಪದ σεληνιαζομένους ಅನ್ನು ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ‘ಅಪಸ್ಮಾರ ಪೀಡಿತರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; ಹೆಚ್ಚು ಅಕ್ಷರಶಃ, ಚಂದ್ರನ ಪ್ರಭಾವಕ್ಕೆ ಒಳಗಾದವರೆಂದು ಭಾವಿಸಲ್ಪಟ್ಟವರು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: ಸುದ್ದಿ
  rationale: ಇಲ್ಲಿ ಇದು ಕೇಳುವ ಶಕ್ತಿಯನ್ನಲ್ಲ, ಯೇಸುವಿನ ಕುರಿತು ಜನರಲ್ಲಿ ಹರಡಿದ ಸುದ್ದಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀπῆλθεν
  choice: ಹಬ್ಬಿತು
  rationale: ಗ್ರೀಕ್‌ನ ಚಲನೆಯ ರೂಪಕವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಸುದ್ದಿ ವ್ಯಾಪಕವಾಗಿ ಹರಡಿದ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: Συρίαν
  choice: ಸಿರಿಯಾ
  rationale: ಪ್ರದೇಶದ ಹೆಸರಿನ ಕನ್ನಡದ ಪ್ರಮಾಣಿತ ರೂಪ.
- source_word: προσήνεγκαν
  choice: ಕರೆತಂದರು
  rationale: ಅಸ್ವಸ್ಥ ಜನರನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ತರುವ ಸಂದರ್ಭಕ್ಕೆ ಸಹಜವಾದ ಕನ್ನಡ ಪ್ರಯೋಗ.
- source_word: κακῶς ἔχοντας
  choice: ಎಲ್ಲ ಅಸ್ವಸ್ಥರನ್ನು
  rationale: ‘ಕೆಟ್ಟ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದವರು’ ಎಂಬ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿನ ಸಂದರ್ಭೋಚಿತ ಹಾಗೂ ಸ್ಪಷ್ಟ ಅರ್ಥ ‘ಅಸ್ವಸ್ಥರು’.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: ನಾನಾ ರೋಗಗಳಿಂದಲೂ ಯಾತನೆಗಳಿಂದಲೂ ಬಳಲುತ್ತಿದ್ದ
  rationale: ποικίλαις‌ನ ವೈವಿಧ್ಯ, νόσοις‌ನ ರೋಗಗಳು ಮತ್ತು βασάνοις‌ನ ತೀವ್ರ ನೋವು/ಯಾತನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: δαιμονιζομένους
  choice: ದೆವ್ವಗಳಿಂದ ಪೀಡಿತರಾಗಿದ್ದವರು
  rationale: ಅಲೌಕಿಕ ಪೀಡೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತಾ, ಗ್ರೀಕ್ ಪದವು ಕಡ್ಡಾಯಪಡಿಸದಷ್ಟು ಕಿರಿದಾದ ತಾಂತ್ರಿಕ ‘ಹಿಡಿತ’ ವರ್ಗವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹೇರುವುದಿಲ್ಲ.
- source_word: σεληνιαζομένους
  choice: ಸೆಳವುಗಳಿಗೆ ಒಳಗಾಗುತ್ತಿದ್ದವರು
  rationale: ಚಂದ್ರನೊಂದಿಗೆ ಪದದ ಐತಿಹಾಸಿಕ ಸಂಬಂಧವನ್ನು ಕಾರಣವೆಂದು ಅನುಮೋದಿಸದೆ, ಆಧುನಿಕ ಓದುಗರಿಗೆ ಗೋಚರಿಸುವ ಲಕ್ಷಣವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: παραλυτικούς
  choice: ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು
  rationale: ಚಲನೆಯ ಶಕ್ತಿಯನ್ನು ಕಳೆದುಕೊಂಡವರನ್ನು ಸೂಚಿಸುವ ಸಂಕ್ಷಿಪ್ತ ಮತ್ತು ಸಾಮಾನ್ಯ ಕನ್ನಡ ಪದಪ್ರಯೋಗ.
- source_word: ἐθεράπευσεν
  choice: ಗುಣಪಡಿಸಿದನು
  rationale: ಗುಣಮಾಡು/ಸ್ವಸ್ಥಪಡಿಸು ಎಂಬ ಕ್ರಿಯೆಯ ನೇರ ಮತ್ತು ಸ್ಥಾಪಿತ ಕನ್ನಡ ನಿರೂಪಣೆ.
theological_decisions:
- issue: δαιμονιζομένους ಎಂಬುದರಲ್ಲಿ ದೆವ್ವದ ಕ್ರಿಯೆಯನ್ನು ಉಳಿಸಿಕೊಂಡು, ಗ್ರೀಕ್‌ಗಿಂತ ಕಿರಿದಾದ ಆಧುನಿಕ ತಾಂತ್ರಿಕ ವರ್ಗವನ್ನು ಹೇರದಿರುವುದು
  choice: ದೆವ್ವಗಳಿಂದ ಪೀಡಿತರಾಗಿದ್ದವರು
  alternative: ದೆವ್ವ ಹಿಡಿದವರು; ದೆವ್ವದ ಅಧೀನದಲ್ಲಿದ್ದವರು
  rationale: ಮುಖ್ಯ ಪಠ್ಯವು ದೆವ್ವದ ಪೀಡೆಯ ವಾಸ್ತವಿಕತೆಯನ್ನು ಮಸುಕಾಗಿಸುವುದಿಲ್ಲ; ಅದೇ ಸಮಯದಲ್ಲಿ ‘possession’ ಎಂಬ ಒಂದೇ ನಿರ್ದಿಷ್ಟ ವಿವರಣೆಗೆ ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: σεληνιαζομένους ಎಂಬ ಪದವನ್ನು ಪ್ರಾಚೀನ ಚಂದ್ರ-ಕಾರಣ ಕಲ್ಪನೆಯನ್ನು ಅನುಮೋದಿಸದೆ ಅನುವಾದಿಸುವುದು
  choice: ಸೆಳವುಗಳಿಗೆ ಒಳಗಾಗುತ್ತಿದ್ದವರು
  alternative: ಅಪಸ್ಮಾರ ಪೀಡಿತರು; ಚಂದ್ರನ ಪ್ರಭಾವಕ್ಕೆ ಒಳಗಾದವರೆಂದು ಭಾವಿಸಲ್ಪಟ್ಟವರು
  rationale: ಮುಖ್ಯ ಪಠ್ಯವು ಆಧುನಿಕ ಓದುಗರಿಗೆ ತಿಳಿಯುವ ಲಕ್ಷಣವನ್ನು ನೀಡುತ್ತದೆ; ಮೂಲಪದದ ಹೆಚ್ಚು ನೇರ ಮತ್ತು ಸಾಂಪ್ರದಾಯಿಕ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ದೀರ್ಘ ಗ್ರೀಕ್ ವಾಕ್ಯವನ್ನು ಕನ್ನಡದ ಓದುವಿಕೆಗೆ ಅನುಗುಣವಾಗಿ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿಭಜಿಸಲಾಗಿದೆ; ಎರಡನೇ ವಾಕ್ಯದಲ್ಲಿ ಮೂಲದ ರೋಗಿಗಳ ಪಟ್ಟಿಯ ಕ್ರಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
