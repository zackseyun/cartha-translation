  source_fidelity: 'The Kannada accurately represents the Greek sequence and sense: the report concerning Jesus spread throughout Syria; people brought all who were unwell, including those afflicted by varied diseases and severe sufferings, those under demonic affliction, those with seizure-like conditions, and paralytics; Jesus healed them. The division into two Kannada sentences retains the source’s narrative progression without loss.'
  naturalness: The wording is fluent modern standard Kannada and maintains an appropriately reverent but accessible register. “ಸಿರಿಯಾದಾದ್ಯಂತ ಹಬ್ಬಿತು,” “ಕರೆತಂದರು,” and “ಗುಣಪಡಿಸಿದನು” are especially natural. The long patient list is readable and its accusative forms are consistently maintained.
  terminology: “ದೆವ್ವಗಳಿಂದ ಪೀಡಿತರಾಗಿದ್ದವರು” preserves the supernatural reference of δαιμονιζομένους without forcing a narrower technical category. “ಸೆಳವುಗಳಿಗೆ ಒಳಗಾಗುತ್ತಿದ್ದವರು” appropriately communicates the likely symptomatic referent of σεληνιαζομένους without validating a lunar cause; footnote b preserves the literal-historical issue. “ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು” is an established Kannada rendering for παραλυτικοί in this context. Footnote anchors a and b are correctly placed and correspond to the relevant expressions.
