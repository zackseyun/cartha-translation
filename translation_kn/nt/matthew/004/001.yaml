review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence, passive construction, Spirit as the leading agent, and the devil as the agent of temptation. However, «ಅರಣ್ಯ» ordinarily suggests a forest in modern Kannada, whereas ἔρημος denotes a desolate/wilderness region; «ನಿರ್ಜನ ಪ್ರದೇಶ» is broader and avoids this misleading terrain implication. «ಕರೆದೊಯ್ಯಲ್ಪಟ್ಟನು» is also more idiomatic for ἀνήχθη than «ನಡೆಸಲ್ಪಟ್ಟನು».
  naturalness: The present sentence is understandable, but placing both agent phrases before the destination is slightly heavy. The revision retains a formal narrative register while using more natural modern Kannada syntax.
  terminology: «ಆತ್ಮನಿಂದ» appropriately reflects τοῦ πνεύματος without inserting «ಪವಿತ್ರ». «ದೆವ್ವ» is acceptable for διάβολος in this context. «ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದಕ್ಕಾಗಿ» correctly represents the infinitival purpose and the contextual sense of πειράζω; the lexical alternative is retained in the note.
  issues:
  - severity: medium
    issue: «ಅರಣ್ಯಕ್ಕೆ» can imply a forested area.
    rationale: The Greek ἔρημος refers broadly to wilderness/desolate country, and the Judean setting should not be represented as a forest. «ನಿರ್ಜನ ಪ್ರದೇಶಕ್ಕೆ» preserves the breadth without over-specifying terrain.
  - severity: low
    issue: «ನಡೆಸಲ್ಪಟ್ಟನು» is less idiomatic than «ಕರೆದೊಯ್ಯಲ್ಪಟ್ಟನು» here.
    rationale: ἀνήχθη is passive and conveys being led/taken to a place. «ಕರೆದೊಯ್ಯಲ್ಪಟ್ಟನು» more naturally conveys this in modern Kannada while retaining the passive sense.
  revised_text: ಆಗ ಯೇಸು ದೆವ್ವದಿಂದ ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದಕ್ಕಾಗಿ ಆತ್ಮನಿಂದ ನಿರ್ಜನ ಪ್ರದೇಶಕ್ಕೆ ಕರೆದೊಯ್ಯಲ್ಪಟ್ಟನು.[a]
