id: MAT.4.1
reference: Matthew 4:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: kn
  text: ಆಗ ಯೇಸು ದೆವ್ವದಿಂದ ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದಕ್ಕಾಗಿ ಆತ್ಮನಿಂದ ನಿರ್ಜನ ಪ್ರದೇಶಕ್ಕೆ ಕರೆದೊಯ್ಯಲ್ಪಟ್ಟನು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪರೀಕ್ಷಿಸಲ್ಪಡುವುದಕ್ಕಾಗಿ”; ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದಕ್ಕೆ “ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗು” ಮತ್ತು “ಪರೀಕ್ಷಿಸಲ್ಪಡು” ಎಂಬ ಎರಡೂ ಅರ್ಥಗಳಿರಬಹುದು. ಇಲ್ಲಿ ತಕ್ಷಣದ ಸಂದರ್ಭವು “ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದು” ಎಂಬ ಅರ್ಥಕ್ಕೆ ಹೆಚ್ಚು ಅನುಕೂಲವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಕಾಲಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸುವ ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡ ಪದ.
- source_word: ἀνήχθη
  choice: ನಡೆಸಲ್ಪಟ್ಟನು
  rationale: ಕ್ರಿಯಾಪದದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ. ಗ್ರೀಕ್‌ನಲ್ಲಿರುವ ಮೇಲ್ಮುಖ ಚಲನೆಯ ಸೂಕ್ಷ್ಮಾರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಮೇಲಕ್ಕೆ ನಡೆಸಲ್ಪಟ್ಟನು’ ಎಂದು ಹೇಳುವುದು ಇಲ್ಲಿ ಅಸಹಜವಾಗುವುದರಿಂದ ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸಲಿಲ್ಲ.
- source_word: εἰς τὴν ἔρημον
  choice: ಅರಣ್ಯಕ್ಕೆ
  rationale: ἔρημος ಎಂಬುದು ನಿರ್ಜನ ಅಥವಾ ಕಾಡು ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸಬಹುದು; ‘ಅರಣ್ಯ’ ಪರಿಚಿತವೂ ಭೂಪ್ರದೇಶವನ್ನು ಅನಗತ್ಯವಾಗಿ ಮರುಭೂಮಿಗೆ ಸೀಮಿತಗೊಳಿಸದ ಪದವೂ ಆಗಿದೆ.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: ಆತ್ಮನಿಂದ
  rationale: ಹಿಂದಿನ ದೀಕ್ಷಾಸ್ನಾನದ ಸಂದರ್ಭವು ದೇವರ ಆತ್ಮನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಪವಿತ್ರ’ ಎಂಬ ಪದವನ್ನು ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ಕಾರಣ ಸೇರಿಸದೆ, ವ್ಯಕ್ತಿಗತ ದೈವಿಕ ಕರ್ತೃತ್ವವನ್ನು ‘ಆತ್ಮನು’ ಎಂಬ ಗೌರವಾರ್ಥಕ ರೂಪದಿಂದ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: πειρασθῆναι
  choice: ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದಕ್ಕಾಗಿ
  rationale: ಕರ್ತೃ ದೆವ್ವವಾಗಿರುವುದರಿಂದ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಕೆಟ್ಟದ್ದಕ್ಕೆ ಸೆಳೆಯುವ ಪ್ರಲೋಭನೆಯ ಅರ್ಥ ಪ್ರಧಾನ. ಆದರೂ ‘ಪರೀಕ್ಷಿಸಲ್ಪಡುವುದು’ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: ದೆವ್ವದಿಂದ
  rationale: διάβολος ಇಲ್ಲಿ ವೈಯಕ್ತಿಕ ವಿರೋಧಿಯ ಸ್ಥಿರ ಬಿರುದಾಗಿ ಬಳಕೆಯಾಗಿದೆ; ‘ದೆವ್ವ’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜ ಸಮಾನಾರ್ಥಕ.
theological_decisions:
- issue: τοῦ πνεύματος ಎಂಬುದರ ಗುರುತು
  choice: ‘ಆತ್ಮನು’ ಎಂದರೆ ದೇವರ ಆತ್ಮನು
  alternative: ಒಂದು ಆತ್ಮ ಅಥವಾ ಯೇಸುವಿನ ಮಾನವಾತ್ಮ
  rationale: ತಕ್ಷಣದ ಹಿಂದಿನ ದೀಕ್ಷಾಸ್ನಾನದ ವೃತ್ತಾಂತದಲ್ಲಿ ಯೇಸುವಿನ ಮೇಲೆ ಇಳಿದ ಆತ್ಮನನ್ನೇ ಇಲ್ಲಿ ಕಥನವು ಸಹಜವಾಗಿ ಮುಂದುವರಿಸುತ್ತದೆ. ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ‘ಪವಿತ್ರ’ ಎಂಬ ವಿಶೇಷಣವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಲಿಲ್ಲ.
- issue: πειρασθῆναι ಪದದ ಅರ್ಥ
  choice: ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದು
  alternative: ಪರೀಕ್ಷಿಸಲ್ಪಡುವುದು
  rationale: ದೆವ್ವವು ಕರ್ತೃವಾಗಿರುವುದೂ ಮುಂದಿನ ಘಟನೆಯಲ್ಲಿ ಕೆಟ್ಟದ್ದಕ್ಕೆ ಸೆಳೆಯುವ ಪ್ರಯತ್ನವಿರುವುದೂ ‘ಪ್ರಲೋಭನೆ’ಗೆ ಆದ್ಯತೆ ನೀಡುತ್ತದೆ; ಗ್ರೀಕ್ ಪದದ ಪರೀಕ್ಷೆ ಎಂಬ ವ್ಯಾಪಕ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪು ಸಂರಕ್ಷಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ‘ಆತ್ಮನಿಂದ’ ಮತ್ತು ‘ನಡೆಸಲ್ಪಟ್ಟನು’ ಎಂಬ ರೂಪಗಳು ಮೂಲದ ಕರ್ತೃತ್ವ ಹಾಗೂ ಕರ್ಮಣಿ ವಿನ್ಯಾಸವನ್ನು ಉಳಿಸುತ್ತವೆ; ಅಸಹಜವಾದ ಪದಶಃ ‘ಮೇಲಕ್ಕೆ’ ಎಂಬುದನ್ನು ಕೈಬಿಡಲಾಗಿದೆ.
