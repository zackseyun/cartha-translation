- from: ಆಗ ಯೇಸು ದೆವ್ವದಿಂದ ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದಕ್ಕಾಗಿ ಆತ್ಮನಿಂದ ಅರಣ್ಯಕ್ಕೆ ನಡೆಸಲ್ಪಟ್ಟನು.[a]
  to: ಆಗ ಯೇಸು ದೆವ್ವದಿಂದ ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗುವುದಕ್ಕಾಗಿ ಆತ್ಮನಿಂದ ನಿರ್ಜನ ಪ್ರದೇಶಕ್ಕೆ ಕರೆದೊಯ್ಯಲ್ಪಟ್ಟನು.[a]
