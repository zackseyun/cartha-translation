reference: Matthew 4:9
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: kn
  text: 'ಅವನು ಅವನಿಗೆ ಹೀಗೆ ಹೇಳಿದನು: “ಇವೆಲ್ಲವನ್ನೂ ನಾನು ನಿನಗೆ ಕೊಡುವೆನು; ನೀನು ಕೆಳಗೆ ಬಿದ್ದು ನನ್ನನ್ನು ಆರಾಧಿಸಿದರೆ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ನನ್ನ ಮುಂದೆ ತಲೆಬಾಗಿದರೆ” ಅಥವಾ “ನನಗೆ ಗೌರವ ಸಲ್ಲಿಸಿದರೆ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಸಾಷ್ಟಾಂಗವಾಗಿ ಬಾಗುವುದನ್ನಾಗಲಿ ಗೌರವ ಸಲ್ಲಿಸುವುದನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು; ಆದರೆ ಇಲ್ಲಿ ಸಂದರ್ಭವು “ಆರಾಧಿಸಿದರೆ” ಎಂಬ ಅರ್ಥಕ್ಕೆ ಹೆಚ್ಚು ಒತ್ತು ನೀಡುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ಅವನು … ಎಂದು ಹೇಳಿದನು
  rationale: ಗ್ರೀಕ್‌ನ ಸರಳ ಸಂಪರ್ಕಕವು ಕಥನವನ್ನು ಮುಂದುವರಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಎಂದು ಹಾಕುವುದು ಕೃತಕವಾಗಿ ಕೇಳಬಹುದಾದ್ದರಿಂದ, ನಿರಂತರ ಕಥನದ ವಾಕ್ಯರಚನೆಯಲ್ಲೇ ಅದರ ಕಾರ್ಯವನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: εἶπεν αὐτῷ
  choice: ಅವನು ಅವನಿಗೆ … ಎಂದು ಹೇಳಿದನು
  rationale: ಮೂಲದಲ್ಲಿ ಎರಡೂ ವ್ಯಕ್ತಿಗಳನ್ನು ಸರ್ವನಾಮಗಳಿಂದಲೇ ಸೂಚಿಸಲಾಗಿದೆ; ಹೆಸರುಗಳನ್ನು ಸೇರಿಸದೆ ಅದೇ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ταῦτά … πάντα
  choice: ಇವೆಲ್ಲವನ್ನೂ
  rationale: ನಪುಂಸಕ ಬಹುವಚನದ ಸೂಚಕಪದ ಮತ್ತು ಸಮಗ್ರತೆಯನ್ನು ಸೂಚಿಸುವ ಪದವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಒಟ್ಟುಗೂಡಿಸಿ, ಹಿಂದಿನ ವಚನದಲ್ಲಿ ತೋರಿಸಲಾದ ಎಲ್ಲವನ್ನೂ ಸೂಚಿಸುವಂತೆ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: σοι … δώσω
  choice: ನಿನಗೆ ಕೊಡುವೆನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕ್ರಿಯಾಪದವು ನೇರವಾದ ಕೊಡುಗೆ ಅಥವಾ ವಾಗ್ದಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ದತ್ತಿವಿಭಕ್ತಿಯನ್ನು ಕನ್ನಡದ ‘ನಿನಗೆ’ ಮೂಲಕ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἐὰν
  choice: ಆದರೆ
  rationale: ಷರತ್ತನ್ನು ಸೂಚಿಸುವ ἐὰν ಅನ್ನು ಕನ್ನಡದ ಸಹಜ ಷರತ್ತುಪ್ರತ್ಯಯವಾದ ‘-ದರೆ’ ಮೂಲಕ ಕ್ರಿಯಾಪದದಲ್ಲೇ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: πεσὼν
  choice: ಅಡ್ಡಬಿದ್ದು
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಜೊತೆಯಾಗಿ ನಡೆಯುವ ದೈಹಿಕವಾಗಿ ಕೆಳಗೆ ಬೀಳುವ ಅಥವಾ ಸಾಷ್ಟಾಂಗವಾಗುವ ಕ್ರಿಯೆಯ ಸ್ಪಷ್ಟ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: προσκυνήσῃς μοι
  choice: ನನ್ನನ್ನು ಆರಾಧಿಸಿದರೆ
  rationale: ಈ ಶೋಧನೆಯ ಸಂದರ್ಭದಲ್ಲಿಯೂ ಮುಂದಿನ ವಚನದಲ್ಲಿ ದೇವರಿಗೆ ಮಾತ್ರ ಸಲ್ಲಬೇಕಾದ ಆರಾಧನೆಯ ಉಲ್ಲೇಖದಲ್ಲಿಯೂ ಧಾರ್ಮಿಕ ಅರ್ಥವೇ ಪ್ರಧಾನವಾಗಿದೆ. ಆದರೂ ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ವಿಶಾಲ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಸೈತಾನನು ಯೇಸುವಿನಿಂದ ಕೇಳಿದ προσκυνέω ಕ್ರಿಯೆಯ ಅರ್ಥ
  choice: ನನ್ನನ್ನು ಆರಾಧಿಸಿದರೆ
  alternative: ನನ್ನ ಮುಂದೆ ತಲೆಬಾಗಿದರೆ; ನನಗೆ ಗೌರವವಂದನೆ ಸಲ್ಲಿಸಿದರೆ
  rationale: ಮುಂದಿನ ವಚನವು ಆರಾಧನೆ ದೇವರಿಗೆ ಮಾತ್ರ ಸಲ್ಲಬೇಕೆಂದು ಹೇಳುವುದರಿಂದ, ಇಲ್ಲಿ ಕೇವಲ ರಾಜಕೀಯ ಗೌರವಕ್ಕಿಂತ ಧಾರ್ಮಿಕ ಆರಾಧನೆಯ ಬೇಡಿಕೆಯೇ ಸಂದರ್ಭಕ್ಕೆ ಹೆಚ್ಚು ಹೊಂದುತ್ತದೆ. ಆದರೆ ಪದದ ಇತರ ಸಾಧ್ಯ ಅರ್ಥಗಳನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನತೆಯುಳ್ಳ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ಸರ್ವನಾಮಗಳನ್ನು ಹೆಸರುಗಳಿಂದ ಬದಲಿಸದೆ ಉಳಿಸಲಾಗಿದೆ; ‘ಅಡ್ಡಬಿದ್ದು’ ಎಂಬುದು ದೈಹಿಕ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
