id: MAT.4.21
reference: Matthew 4:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: kn
  text: 'ಅಲ್ಲಿಂದ ಮುಂದೆ ಹೋಗಿ, ಆತನು ಬೇರೆ ಇಬ್ಬರು ಸಹೋದರರನ್ನು ಕಂಡನು: ಜೆಬೆದಾಯನ ಮಗ ಯಾಕೋಬ ಮತ್ತು ಅವನ ಸಹೋದರ ಯೋಹಾನ. ಅವರು ತಮ್ಮ ತಂದೆಯಾದ ಜೆಬೆದಾಯನೊಂದಿಗೆ ದೋಣಿಯಲ್ಲಿ ತಮ್ಮ ಬಲೆಗಳನ್ನು ಸರಿಪಡಿಸುತ್ತಿದ್ದರು. ಆತನು ಅವರನ್ನು ಕರೆದನು.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ ಮುಂದೆ ಹೋಗಿ
  rationale: ಪ್ರೊಬೈನೋ ಕ್ರಿಯಾಪದವು ಹಿಂದಿನ ಸ್ಥಳದಿಂದ ಇನ್ನಷ್ಟು ಮುಂದೆ ಸಾಗುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ರೂಪವು ಚಲನೆಯ ನಿರಂತರತೆಯನ್ನೂ ἐκεῖθεν ಎಂಬ ‘ಅಲ್ಲಿಂದ’ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: εἶδεν
  choice: ಕಂಡನು
  rationale: ὁράω ಕ್ರಿಯಾಪದದ ಸರಳ ಕಥನರೂಪ; ‘ಕಂಡನು’ ಮೂಲದ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಅತಿರಂಜಿಸದೆ ನೀಡುತ್ತದೆ.
- source_word: ἄλλους δύο ἀδελφούς
  choice: ಬೇರೆ ಇಬ್ಬರು ಸಹೋದರರನ್ನು
  rationale: ἄλλους ಹಿಂದಿನ ಇಬ್ಬರ ಜೊತೆಗೆ ಇನ್ನಿಬ್ಬರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಬೇರೆ ಇಬ್ಬರು’ ಸಂಖ್ಯೆ ಮತ್ತು ಹೆಚ್ಚುವರಿ ಗುಂಪಿನ ಭಾವ ಎರಡನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: ಜೆಬೆದಾಯನ ಮಗ ಯಾಕೋಬ
  rationale: ಗ್ರೀಕ್‌ನ ವಂಶಸಂಬಂಧ ಸೂಚಿಸುವ ಷಷ್ಠೀ ರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ‘ಜೆಬೆದಾಯನ ಮಗ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ಹೆಸರುಗಳಿಗೆ ರೂಢಿಯಾದ ಕನ್ನಡ ಬೈಬಲ್ ರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: ಅವನ ಸಹೋದರ ಯೋಹಾನ
  rationale: αὐτοῦ ಇಲ್ಲಿ ಯಾಕೋಬನನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತದೆ.
- source_word: ἐν τῷ πλοίῳ
  choice: ದೋಣಿಯಲ್ಲಿ
  rationale: ಈ ಮೀನುಗಾರಿಕೆಯ ಸನ್ನಿವೇಶದಲ್ಲಿ πλοῖον ದೊಡ್ಡ ಹಡಗಿಗಿಂತ ಮೀನುಗಾರಿಕಾ ದೋಣಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: ತಮ್ಮ ತಂದೆಯಾದ ಜೆಬೆದಾಯನೊಂದಿಗೆ
  rationale: μετά ಸಹವಾಸವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡ ಪದಕ್ರಮವು ತಂದೆ ಎಂಬ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿ ಮೂಲದ ಮಾಹಿತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: ತಮ್ಮ ಬಲೆಗಳನ್ನು ಸರಿಪಡಿಸುತ್ತಿದ್ದರು
  rationale: ಮೀನುಗಾರಿಕೆಯ ಸನ್ನಿವೇಶದಲ್ಲಿ καταρτίζω ಬಲೆಗಳನ್ನು ಮತ್ತೆ ಸರಿಯಾದ ಸ್ಥಿತಿಗೆ ತರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಸರಿಪಡಿಸುತ್ತಿದ್ದರು’ ಹೊಲಿಯುವುದಕ್ಕಿಂತ ವಿಶಾಲವಾದ ಮೂಲಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκάλεσεν αὐτούς
  choice: ಆತನು ಅವರನ್ನು ಕರೆದನು
  rationale: καλέω ಅನ್ನು ಸರಳವಾಗಿ ಅನುವಾದಿಸಿ, ಶಿಷ್ಯತ್ವಕ್ಕೆ ಕರೆಯುವ ಅರ್ಥವನ್ನು ಸಂದರ್ಭವೇ ತಿಳಿಸಲು ಬಿಡಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ತನ್ನನ್ನು ಹಿಂಬಾಲಿಸಲು’ ಎಂಬುದನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
theological_decisions:
- issue: ἐκάλεσεν ಎಂಬುದರಲ್ಲಿ ಸೂಚಿತವಾಗಿರುವ ಶಿಷ್ಯತ್ವದ ಕರೆ
  choice: ‘ಆತನು ಅವರನ್ನು ಕರೆದನು’ ಎಂಬ ಸರಳ ವಾಕ್ಯವನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಆತನು ತನ್ನನ್ನು ಹಿಂಬಾಲಿಸಲು ಅವರನ್ನು ಕರೆದನು’
  rationale: ಸಮೀಪದ ಸಂದರ್ಭವು ಶಿಷ್ಯತ್ವದ ಕರೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿದರೂ, ಈ ವಚನದಲ್ಲಿ ಕರೆಯ ಗುರಿ ಪ್ರತ್ಯಕ್ಷವಾಗಿ ಹೇಳಿಲ್ಲ. ಆದ್ದರಿಂದ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನೂ ಸಂದರ್ಭಾಧೀನ ಅರ್ಥವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಗೌರವಪೂರ್ಣವೂ ಆದ ಕಥನಶೈಲಿ. ‘ಆತನು’ ಎಂಬ ರೂಪವು ಯೇಸುವಿನ ಉಲ್ಲೇಖಕ್ಕೆ ಕನ್ನಡ ಬೈಬಲ್ ವಾಚನದಲ್ಲಿ ಪರಿಚಿತವಾದ ಗೌರವಸ್ವರವನ್ನು ನೀಡುತ್ತದೆ. ಉದ್ದವಾದ ಗ್ರೀಕ್ ವಾಕ್ಯವನ್ನು ಓದುಗನ ಗ್ರಹಿಕೆಗೆ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿಭಜಿಸಲಾಗಿದೆ; ಮಾಹಿತಿಯ ಕ್ರಮ ಮತ್ತು ಸಂಬಂಧಗಳು ಉಳಿದಿವೆ.
