id: MAT.4.13
reference: Matthew 4:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: kn
  text: ಅವರು ನಜಾರ[a]ವನ್ನು ಬಿಟ್ಟು ಬಂದು, ಸಮುದ್ರತೀರದ ಕಪೆರ್ನೌಮಿನಲ್ಲಿ, ಜೆಬುಲೂನ್ ಮತ್ತು ನಫ್ತಾಲಿಯ ಪ್ರದೇಶದಲ್ಲಿ ನೆಲೆಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಗ್ರೀಕ್: ‘ನಜಾರ’; ಅನೇಕ ಅನುವಾದಗಳಲ್ಲಿ ‘ನಜರೇತ್’ ಎಂದಿದೆ.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: ಬಿಟ್ಟು
  rationale: Aorist participle; main verbಗಿಂತ ಮುಂಚಿನ ನಿರ್ಗಮನವನ್ನು ಸಹಜ ಕನ್ನಡದ ಕ್ರಮದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ναζαρὰ
  choice: ನಜಾರ
  rationale: ಈ ವಚನದ ಗ್ರೀಕ್ ರೂಪ Ναζαρά ಅನ್ನು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುವ ಲಿಪ್ಯಂತರ; ಪರಿಚಿತವಾದ ‘ನಜರೇತ್’ ರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἐλθὼν
  choice: ಬಂದು
  rationale: Aorist participle ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕ್ರಿಯಾನ್ಯೂನ ರೂಪವಾಗಿ ನೀಡುವುದರಿಂದ ಘಟನೆಗಳ ಅನುಕ್ರಮ ಸಹಜವಾಗಿ ಉಳಿಯುತ್ತದೆ.
- source_word: κατῴκησεν
  choice: ನೆಲೆಸಿದರು
  rationale: ಕೇವಲ ವಾಸಿಸಿದ್ದರೆಂಬುದಕ್ಕಿಂತ ಅಲ್ಲಿ ವಾಸಸ್ಥಾನ ಮಾಡಿಕೊಂಡರು ಎಂಬ ಅರ್ಥವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: Καφαρναοὺμ
  choice: ಕಪೆರ್ನೌಮ್
  rationale: ಗ್ರೀಕ್ ಸ್ಥಳನಾಮದ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
- source_word: τὴν παραθαλασσίαν
  choice: ಸರೋವರದ ತೀರದಲ್ಲಿದ್ದ
  rationale: ಪದಶಃ ‘ಸಮುದ್ರದ ಬಳಿಯ’; ಗಲಿಲಾಯದ ಜಲಾಶಯವನ್ನು ಕನ್ನಡ ಓದುಗರಿಗೆ ಭೌಗೋಳಿಕವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸಲು ‘ಸರೋವರ’ ಬಳಸಲಾಗಿದೆ, ಮತ್ತು ಇದು ಕಪೆರ್ನೌಮನ್ನು ವರ್ಣಿಸುವ ವಿಶೇಷಣವೆಂಬುದನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐν ὁρίοις
  choice: ಪ್ರದೇಶಗಳಲ್ಲಿ
  rationale: ὅρια ಇಲ್ಲಿ ಗಡಿರೇಖೆಗಳಿಗಿಂತ ಜೆಬುಲೂನ್ ಮತ್ತು ನಫ್ತಾಲಿಗೆ ಸಂಬಂಧಿಸಿದ ಭೂಪ್ರದೇಶಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ζαβουλὼν
  choice: ಜೆಬುಲೂನ್
  rationale: ಗ್ರೀಕ್ ಹೆಸರು Ζαβουλώνಗೆ ಸಮೀಪವಾದ ಕನ್ನಡ ಲಿಪ್ಯಂತರ.
- source_word: Νεφθαλίμ
  choice: ನಫ್ತಾಲಿ
  rationale: ಪರಿಚಿತ ಬೈಬಲ್ ಹೆಸರಿನ ಕನ್ನಡ ರೂಪ; ಗ್ರೀಕ್ Νεφθαλίμ ಅನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತದೆ.
