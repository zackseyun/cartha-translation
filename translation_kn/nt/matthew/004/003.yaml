id: MAT.4.3
reference: Matthew 4:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: kn
  text: ಆಗ ಪ್ರಲೋಭಕನು ಹತ್ತಿರ ಬಂದು ಅವನಿಗೆ, “ನೀನು ದೇವರ ಮಗನಾಗಿದ್ದರೆ[a], ಈ ಕಲ್ಲುಗಳು ರೊಟ್ಟಿಗಳಾಗಲಿ[b] ಎಂದು ಹೇಳು” ಎಂದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ನೀನು ದೇವರ ಮಗನಾಗಿರುವುದರಿಂದ.” ಗ್ರೀಕ್ ಷರತ್ತು ಕೇವಲ ಸಂಶಯವನ್ನು ಸೂಚಿಸುವ ಬದಲು ಸವಾಲಿನ ರೂಪದಲ್ಲಿಯೂ ಕಾರ್ಯನಿರ್ವಹಿಸಬಹುದು.
    reason: alternative_reading
  - marker: b
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ರೊಟ್ಟಿಗಳು’ ಎಂಬುದು ಬಹುವಚನದಲ್ಲಿದೆ; ಅಂದರೆ ‘ರೊಟ್ಟಿಗಳು’ ಅಥವಾ ‘ಲೋಫುಗಳು.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ಹತ್ತಿರ ಬಂದು
  rationale: ಯೇಸುವಿನ ಬಳಿಗೆ ಚಲಿಸಿ ಬಂದದ್ದನ್ನು ಸೂಚಿಸುವ ಕ್ರಿಯಾವಿಶೇಷಣಾತ್ಮಕ ಕೃದಂತವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ πειράζων
  choice: ಪ್ರಲೋಭಕನು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸುವನ್ನು ಪ್ರಲೋಭಿಸುವವನಿಗೆ ನೀಡಿದ ನಾಮರೂಪದ ಬಿರುದಾಗಿ ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ನಿರೂಪಿಸುತ್ತದೆ; ‘ಪರೀಕ್ಷಕನು’ ಎಂಬ ಅರ್ಥಸಾಧ್ಯತೆಯನ್ನು ಸಂದರ್ಭದ ದುಷ್ಟ ಉದ್ದೇಶದ ಕಾರಣ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ತೆಗೆದುಕೊಂಡಿಲ್ಲ.
- source_word: εἶπεν αὐτῷ
  choice: ಅವನಿಗೆ ... ಎಂದನು
  rationale: λέγω ಮತ್ತು ಪರೋಕ್ಷ ಕರ್ಮದ ಅರ್ಥವನ್ನು ಕನ್ನಡದ ಸಹಜ ನೇರಮಾತಿನ ವಿನ್ಯಾಸದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: Εἰ
  choice: ನೀನು ... ಆಗಿದ್ದರೆ
  rationale: ಷರತ್ತಿನ ರೂಪವನ್ನೂ, ಅದು ಸಂಶಯವೋ ಸವಾಲೋ ಎಂಬ ಅಸ್ಪಷ್ಟತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ದೇವರ ಮಗ
  rationale: ಮತ್ತಾಯನ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸುವಿನ ವಿಶಿಷ್ಟ ಬಿರುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅನಿರ್ದಿಷ್ಟ ‘ದೇವರ ಒಬ್ಬ ಮಗ’ ಎಂಬ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: εἰπὲ ἵνα
  choice: '... ಆಗಲಿ ಎಂದು ಹೇಳು'
  rationale: ಆಜ್ಞಾರ್ಥಕ λέγω ಮತ್ತು ಅದರ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುವ ἵνα ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ, ‘ಆಜ್ಞಾಪಿಸು’ ಎಂಬ ಹೆಚ್ಚುವರಿ ಬಲವನ್ನು ಸೇರಿಸದೆಯೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οἱ λίθοι οὗτοι
  choice: ಈ ಕಲ್ಲುಗಳು
  rationale: ಬಹುವಚನ ಮತ್ತು ಸೂಚಕಪದದ ಒತ್ತನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἄρτοι
  choice: ರೊಟ್ಟಿಗಳು
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸಿ, ಪ್ರತ್ಯೇಕ ರೊಟ್ಟಿಗಳ ಅರ್ಥವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γένωνται
  choice: ಆಗಲಿ
  rationale: γίνομαι ಕ್ರಿಯೆಯ ‘ಆಗು/ಉಂಟಾಗು’ ಎಂಬ ತಟಸ್ಥ ಅರ್ಥವನ್ನು ಆಜ್ಞೆಯ ವಿಷಯಕ್ಕೆ ಹೊಂದುವ ಕನ್ನಡ ರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ.
theological_decisions:
- issue: Εἰ υἱὸς εἶ τοῦ θεοῦ ಎಂಬ ಷರತ್ತಿನ ಭಾವ
  choice: ‘ನೀನು ದೇವರ ಮಗನಾಗಿದ್ದರೆ’ ಎಂದು ಸರಳ ಷರತ್ತಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ನೀನು ದೇವರ ಮಗನಾಗಿರುವುದರಿಂದ’ ಅಥವಾ ‘ನೀನು ನಿಜವಾಗಿಯೂ ದೇವರ ಮಗನಾಗಿದ್ದರೆ’
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ನೇರ ಸಂಶಯಕ್ಕಿಂತ ಸವಾಲಾಗಿಯೂ ಕಾರ್ಯನಿರ್ವಹಿಸಬಹುದು. ಮುಖ್ಯ ಪಠ್ಯವು ಅದನ್ನು ನಿರ್ಧರಿಸದೆ ಮೂಲದ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- issue: υἱὸς τοῦ θεοῦ ಎಂಬ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಬಿರುದು
  choice: ‘ದೇವರ ಮಗ’
  alternative: ‘ದೇವರ ಒಬ್ಬ ಮಗ’
  rationale: ನಾಮಪದಕ್ಕೆ ಲೇಖವಿಲ್ಲದಿದ್ದರೂ, εἰμί ನಂತರದ ವಿಧೇಯ ರಚನೆ ಮತ್ತು ಮತ್ತಾಯನ ಸಂದರ್ಭವು ಯೇಸುವನ್ನು ವಿಶಿಷ್ಟವಾಗಿ ಗುರುತಿಸುವ ಬಿರುದನ್ನು ಸೂಚಿಸುತ್ತವೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸರಳ, ಘನವಾದ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಪ್ರಲೋಭಕನು’ ಎಂಬ ಪದವು ಸಂದರ್ಭದ ದುಷ್ಟ ಪ್ರಲೋಭನವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ. ಮೂಲದ ಬಹುವಚನವನ್ನು ‘ರೊಟ್ಟಿಗಳು’ ಎಂದು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲೇ ಉಳಿಸಲಾಗಿದೆ; ಸಂಬಂಧಿತ ಪಾದಟಿಪ್ಪಣಿ ಓದುಗರಿಗೆ ಅದರ ಮೂಲರೂಪವನ್ನು ತಿಳಿಸುತ್ತದೆ.
