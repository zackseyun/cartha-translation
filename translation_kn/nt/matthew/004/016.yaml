id: MAT.4.16
reference: Matthew 4:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: kn
  text: ಕತ್ತಲೆಯಲ್ಲಿ ಕುಳಿತಿದ್ದ ಜನರು ಮಹಾ ಬೆಳಕನ್ನು ಕಂಡರು; ಮರಣದ ಪ್ರದೇಶದಲ್ಲೂ ಮರಣದ ನೆರಳಿನಲ್ಲೂ[a] ಕುಳಿತಿದ್ದವರಿಗೆ ಬೆಳಕು ಉದಯಿಸಿತು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ಮರಣದ ನೆರಳು’ ಎಂಬುದು ಗ್ರೀಕ್‌ನ ನೇರ ಅರ್ಥವಾಗಿದೆ. ಕೆಲವು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಸಂದರ್ಭಗಳಲ್ಲಿ ಇದಕ್ಕೆ ‘ಗಾಢ ಕತ್ತಲೆ’ ಎಂಬ ಅರ್ಥವೂ ಇರಬಹುದು; ಆದರೆ ಇಲ್ಲಿ ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ ‘ಮರಣ’ ಎಂಬ ಪದವು ಸ್ಪಷ್ಟವಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: ಜನರು
  rationale: ಒಂದು ಸಾಮೂಹಿಕ ಮಾನವ ಗುಂಪನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ಜನಾಂಗ’ ಎಂದರೆ ಇಲ್ಲಿ ಅಗತ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ಜನಾಂಗೀಯ ಅಥವಾ ರಾಜಕೀಯ ಅರ್ಥ ಬರಬಹುದು.
- source_word: καθήμενος / καθημένοις
  choice: ಕುಳಿತಿದ್ದ / ಕುಳಿತಿದ್ದವರಿಗೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ‘ಕುಳಿತುಕೊಳ್ಳು’ ಎಂಬ ಸಜೀವ ಚಿತ್ರಣವನ್ನೂ ಸಮಾಂತರ ರಚನೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ; ‘ವಾಸಿಸುತ್ತಿದ್ದ’ ಎಂಬುದು ಸಾಧ್ಯವಾದರೂ ರೂಪಕವನ್ನು ದುರ್ಬಲಗೊಳಿಸುತ್ತದೆ.
- source_word: σκοτίᾳ
  choice: ಕತ್ತಲೆ
  rationale: ಪದದ ನೇರ ಹಾಗೂ ರೂಪಕ ಅರ್ಥಗಳೆರಡನ್ನೂ ಉಳಿಸಿ, ಅದನ್ನು ಕೇವಲ ನೈತಿಕ ಅಥವಾ ಆಧ್ಯಾತ್ಮಿಕ ಸ್ಥಿತಿಯೆಂದು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: φῶς εἶδεν μέγα
  choice: ಮಹಾ ಬೆಳಕನ್ನು ಕಂಡರು
  rationale: ಗ್ರೀಕ್ ಪದಕ್ರಮದ ಒತ್ತನ್ನೂ ಸರಳ ಭೂತಕಾಲದ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: χώρᾳ
  choice: ಪ್ರದೇಶ
  rationale: ಆಧುನಿಕ ರಾಷ್ಟ್ರದ ಅರ್ಥವನ್ನು ಸೂಚಿಸದೆ ಭೌಗೋಳಿಕ ಅಥವಾ ರೂಪಕ ವ್ಯಾಪ್ತಿಯನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: σκιᾷ θανάτου
  choice: ಮರಣದ ... ನೆರಳು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ θανάτου ಎಂಬ ‘ಮರಣ’ ಪದ ಸ್ಪಷ್ಟವಾಗಿರುವುದರಿಂದ ಅದನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪರಿಚಿತವಾದ ಬೈಬಲ್ ಚಿತ್ರಣವನ್ನೂ ಕಾಪಾಡುತ್ತದೆ.
- source_word: ἀνέτειλεν
  choice: ಉದಯಿಸಿತು
  rationale: ಬೆಳಕು ಅಥವಾ ಆಕಾಶಕಾಯ ಮೇಲೇಳುವ ಚಿತ್ರಣವನ್ನು ಸಹಜ ಹಾಗೂ ಘನ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ದತ್ತಿವ್ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ‘ಅವರಿಗೆ ಬೆಳಕು ಉದಯಿಸಿತು’ ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ಕತ್ತಲೆ ಮತ್ತು ಬೆಳಕಿನ ಚಿತ್ರಣದ ಸ್ವರೂಪ
  choice: ಕತ್ತಲೆ ಮತ್ತು ಬೆಳಕಿನ ರೂಪಕವನ್ನು ನಿರ್ದಿಷ್ಟ ವಿವರಣೆಯಿಲ್ಲದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಕತ್ತಲೆಯನ್ನು ಪಾಪ, ಅನ್ಯಜನರ ಅಜ್ಞಾನ ಅಥವಾ ರಾಜಕೀಯ ದುಸ್ಥಿತಿ ಎಂದು; ಬೆಳಕನ್ನು ಮೆಸ್ಸೀಯನ ರಕ್ಷಣಾತ್ಮಕ ಪ್ರಕಟಣೆ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯವು ಯೆಶಾಯನ ಪ್ರವಾದನಾ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಹೊಂದಿದ್ದರೂ ಈ ಸಾಲಿನಲ್ಲಿ ರೂಪಕದ ಅರ್ಥವನ್ನು ಒಂದೇ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: χώρᾳ καὶ σκιᾷ θανάτου ಎಂಬ ಸಂಯೋಜನೆ
  choice: ‘ಮರಣದ ಪ್ರದೇಶದಲ್ಲಿಯೂ ನೆರಳಿನಲ್ಲಿಯೂ’ ಎಂದು ಎರಡು ಸಮನ್ವಿತ ಪದಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಪರಿಚಿತ ‘ಮರಣಛಾಯೆಯ ಪ್ರದೇಶದಲ್ಲಿ’ ಎಂಬ ಒಟ್ಟುಗೂಡಿಸಿದ ನುಡಿಗಟ್ಟು.
  rationale: ಮತ್ತಾಯನ ಗ್ರೀಕ್ ಪಠ್ಯದಲ್ಲಿ χώρᾳ ಮತ್ತು σκιᾷ ಎರಡಕ್ಕೂ ἐν ಸಂಬಂಧಿಸಿದ್ದು καὶ ಅವನ್ನು ಜೋಡಿಸುತ್ತದೆ; ಅವನ್ನು ಒಂದೇ ಸಮಾಸವಾಗಿ ಮೌನವಾಗಿ ಪರಿವರ್ತಿಸದೆ ಮೂಲದ ಸ್ವಲ್ಪ ಅಸಾಮಾನ್ಯವಾದ ರಚನೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಘನವಾದ ಪ್ರವಾದನಾ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಕುಳಿತಿದ್ದ’ ಎಂಬ ಪುನರಾವರ್ತನೆ ಮೂಲದ ಸಮಾಂತರ ಚಿತ್ರಣಕ್ಕಾಗಿ ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಪದ್ಯದ ರೂಪಕಗಳಿಗೆ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವರಣೆ ಸೇರಿಸಲಾಗಿಲ್ಲ.
