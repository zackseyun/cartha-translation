id: MAT.4.20
reference: Matthew 4:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: kn
  text: ಅವರು ತಕ್ಷಣವೇ ಬಲೆಗಳನ್ನು ಬಿಟ್ಟು ಆತನನ್ನು ಹಿಂಬಾಲಿಸಿದರು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ಅವರು
  rationale: δέ ಇಲ್ಲಿ ಸೌಮ್ಯವಾದ ಕಥನ-ಸಂಪರ್ಕಕ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಮತ್ತು’ ಅಥವಾ ‘ಆಗ’ ಎಂದು ಹಾಕದೆ ವಿಷಯಸೂಚಕ ‘ಅವರು’ ಮೂಲಕ ವಾಕ್ಯವನ್ನು ಮುಂದುವರಿಸುವುದು ಸಹಜವಾಗಿದ್ದು, ವಿರೋಧಾರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: εὐθέως
  choice: ತಕ್ಷಣವೇ
  rationale: ಈ ಪದವು ಪ್ರತಿಕ್ರಿಯೆಯ ತ್ವರಿತತೆಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ; ‘ತಕ್ಷಣವೇ’ ಆ ಬಲವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀφέντες
  choice: ಬಿಟ್ಟು
  rationale: 'ಅಓರಿಸ್ಟ್ ಕೃದಂತವು ಮುಖ್ಯ ಕ್ರಿಯೆಗೆ ಮುಂಚಿನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ: ಮೊದಲು ಬಲೆಗಳನ್ನು ಬಿಟ್ಟು, ಬಳಿಕ ಹಿಂಬಾಲಿಸಿದರು. ಕನ್ನಡದ ‘ಬಿಟ್ಟು’ ಈ ಕ್ರಮವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ತ್ಯಜಿಸಿ’ ಎಂದರೆ ಸಂದರ್ಭಕ್ಕಿಂತ ಹೆಚ್ಚು ತೀವ್ರವಾಗಬಹುದು.'
- source_word: τὰ δίκτυα
  choice: ಬಲೆಗಳನ್ನು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಇವು ಮೀನು ಹಿಡಿಯುವ ಬಲೆಗಳು ಎಂಬುದು ಸ್ಪಷ್ಟ. ಗ್ರೀಕ್‌ನ ನಿರ್ದಿಷ್ಟ ಲೇಖವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕಡ್ಡಾಯವಾಗಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಸೂಚಿಸುವ ಅಗತ್ಯವಿಲ್ಲ; ‘ತಮ್ಮ’ ಅಥವಾ ‘ಮೀನುಗಾರಿಕೆಯ’ ಎಂದು ಸೇರಿಸುವುದು ಮೂಲದಲ್ಲಿಲ್ಲದ ಸ್ಪಷ್ಟೀಕರಣವಾಗುತ್ತದೆ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ಆತನನ್ನು ಹಿಂಬಾಲಿಸಿದರು
  rationale: ಈ ಅಭಿವ್ಯಕ್ತಿ ದೈಹಿಕವಾಗಿ ಹಿಂದೆ ಹೋಗುವುದನ್ನೂ ಶಿಷ್ಯರಾಗಿ ಸೇರುವುದನ್ನೂ ಒಳಗೊಳ್ಳಬಲ್ಲದು. ‘ಹಿಂಬಾಲಿಸಿದರು’ ಎರಡೂ ಅರ್ಥಸಾಧ್ಯತೆಗಳನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ἠκολούθησαν αὐτῷ ಎಂಬುದರಲ್ಲಿರುವ ಶಿಷ್ಯತ್ವದ ಸೂಕ್ಷ್ಮಾರ್ಥ
  choice: ಆತನನ್ನು ಹಿಂಬಾಲಿಸಿದರು
  alternative: ಆತನ ಹಿಂದೆ ಹೋದರು
  rationale: ಸುವಾರ್ತಾ ಸಂದರ್ಭದಲ್ಲಿನ ಕ್ರಿಯಾಪದವು ನೇರವಾಗಿ ಹಿಂದೆ ನಡೆಯುವುದನ್ನೂ ಶಿಷ್ಯನಾಗಿ ಅನುಸರಿಸುವುದನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು. ‘ಹಿಂಬಾಲಿಸಿದರು’ ಈ ಕಥನಾತ್ಮಕ ಮತ್ತು ಧಾರ್ಮಿಕ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಿ, ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾದ ಸಿದ್ಧಾಂತಭಾಷೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ‘ಆತನನ್ನು’ ಎಂಬ ರೂಪವು ಬೈಬಲ್ ಕಥನದ ಗೌರವಪೂರ್ಣ ಧಾಟಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ವಾಕ್ಯಕ್ರಮವು ತಕ್ಷಣದ ಪ್ರತಿಕ್ರಿಯೆ ಮತ್ತು ಕ್ರಿಯೆಗಳ ಅನುಕ್ರಮವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
