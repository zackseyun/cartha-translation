id: MAT.4.17
reference: Matthew 4:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: kn
  text: ಆ ಸಮಯದಿಂದ ಯೇಸು, “ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ; ಏಕೆಂದರೆ ಪರಲೋಕರಾಜ್ಯವು ಸಮೀಪಿಸಿದೆ[a],” ಎಂದು ಸಾರಲು ಪ್ರಾರಂಭಿಸಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಸಮೀಪಕ್ಕೆ ಬಂದಿದೆ” ಅಥವಾ “ಹತ್ತಿರವಾಗಿದೆ.” ಗ್ರೀಕ್‌ನ ಪರಿಪೂರ್ಣಕಾಲದ ಕ್ರಿಯಾಪದವು ರಾಜ್ಯದ ಸಮೀಪತೆ ಸಂಭವಿಸಿ, ಆ ಸ್ಥಿತಿ ಮುಂದುವರಿಯುತ್ತಿದೆ ಎಂಬುದನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: ಆ ಸಮಯದಿಂದ
  rationale: ಕಥನದಲ್ಲಿನ ಹೊಸ ಹಂತವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ; ಕಾಲದ ಆರಂಭಬಿಂದುವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἤρξατο
  choice: ಪ್ರಾರಂಭಿಸಿದರು
  rationale: ಪೂರಕ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಬಂದಿರುವ ἤρξατο ಎಂಬುದರ ನೇರ ಹಾಗೂ ಗೌರವಯುತ ಕನ್ನಡ ರೂಪ.
- source_word: κηρύσσειν καὶ λέγειν
  choice: ಎಂದು ಸಾರಲು
  rationale: ಸಾರುವ ಕ್ರಿಯೆ ಮತ್ತು ಅದರ ಸಂದೇಶದ ವಿಷಯವನ್ನು ಸಹಜ ಕನ್ನಡದ ಉದ್ಧರಣ ವಿನ್ಯಾಸದಲ್ಲಿ ಜೋಡಿಸುತ್ತದೆ. ಗ್ರೀಕ್‌ನ ಎರಡೂ ಕ್ರಿಯೆಗಳ ಅರ್ಥವನ್ನು ಅನಗತ್ಯ ಪುನರುಕ್ತಿಯಿಲ್ಲದೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Μετανοεῖτε
  choice: ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ
  rationale: ಕೇವಲ ಅಭಿಪ್ರಾಯ ಬದಲಾವಣೆಯಲ್ಲದೆ ಮನಸ್ಸು ಮತ್ತು ಜೀವನದ ದಿಕ್ಕು ತಿರುಗಿಸುವ ಕರೆಯನ್ನು ಒಳಗೊಂಡಿರುವ, ಕನ್ನಡದಲ್ಲಿ ಸ್ಥಿರವಾಗಿರುವ ಸಮರ್ಪಕ ಪದ.
- source_word: ἤγγικεν
  choice: ಸಮೀಪಿಸಿದೆ
  rationale: ಪರಿಪೂರ್ಣಕಾಲದ ಅರ್ಥಕ್ಕೆ ತಕ್ಕಂತೆ, ಸಮೀಪಕ್ಕೆ ಬಂದಿರುವ ಮತ್ತು ಆ ಸ್ಥಿತಿ ಮುಂದುವರಿಯುತ್ತಿರುವ ಭಾವವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯವು
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗವನ್ನು ಕನ್ನಡದ ಪರಿಚಿತ ಮತ್ತು ಸಹಜ ರೂಪದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; βασιλείαಯ ರಾಜ್ಯ/ಆಳ್ವಿಕೆ ಅರ್ಥದ ಅಗಲವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν ಎಂಬುದರ ಅರ್ಥ
  choice: ಪರಲೋಕರಾಜ್ಯವು
  alternative: ಪರಲೋಕದ ಆಳ್ವಿಕೆಯು / ಪರಲೋಕಗಳ ರಾಜ್ಯವು
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಪರಿಚಿತ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ಅದನ್ನು ಕೇವಲ ಸ್ಥಳವೆಂದಾಗಲಿ ಅಥವಾ ಕೇವಲ ಅಮೂರ್ತ ಆಳ್ವಿಕೆಯೆಂದಾಗಲಿ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: Μετανοεῖτε ಎಂಬ ಆಜ್ಞೆಯ ವ್ಯಾಪ್ತಿ
  choice: ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ
  alternative: ಮನಸ್ಸು ಬದಲಿಸಿಕೊಳ್ಳಿರಿ / ಹಿಂದಿರುಗಿರಿ
  rationale: ನೈತಿಕ ಮತ್ತು ಆತ್ಮಿಕ ತಿರುಗುವಿಕೆಯ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ಬೌದ್ಧಿಕ ಮನೋಭಾವ ಬದಲಾವಣೆಗೆ ಅರ್ಥವನ್ನು ಕುಗ್ಗಿಸುವುದಿಲ್ಲ.
- issue: ἤγγικεν ಎಂಬ ಪರಿಪೂರ್ಣಕಾಲದ ಬಲ
  choice: ಸಮೀಪಿಸಿದೆ
  alternative: ಹತ್ತಿರವಾಗಿದೆ / ಸಮೀಪಕ್ಕೆ ಬಂದಿದೆ
  rationale: ರಾಜ್ಯವು ಸಮೀಪಕ್ಕೆ ಬಂದಿದ್ದು ಅದರ ಸಮೀಪತೆ ಈಗಲೂ ಪರಿಣಾಮಕಾರಿಯಾಗಿದೆ ಎಂಬ ಅಂಶವನ್ನು ಉಳಿಸುತ್ತದೆ; ಆಗಮನದ ನಿಖರ ಸ್ವರೂಪವನ್ನು ಹೆಚ್ಚುವರಿಯಾಗಿ ನಿರ್ಧರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ಯೇಸುವಿನ ಮಾತಿಗೆ ಗೌರವಸೂಚಕ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನ κηρύσσειν καὶ λέγειν ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಭಾರವಾಗದಂತೆ “ಎಂದು ಸಾರಲು” ಎಂದು ನಿರೂಪಿಸಲಾಗಿದೆ.
