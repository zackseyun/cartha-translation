id: MAT.4.15
reference: Matthew 4:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: kn
  text: “ಜೆಬುಲೂನಿನ ನಾಡು ಮತ್ತು ನಫ್ತಾಲಿಯ ನಾಡು, ಸಮುದ್ರದ ಮಾರ್ಗ, ಯೊರ್ದನ್ ನದಿಯ ಆಚೆ, ಯೆಹೂದ್ಯೇತರರ ಗಲಿಲಾಯ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಜನಾಂಗಗಳ ಗಲಿಲಾಯ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ Ζαβουλὼν
  choice: ಜೆಬುಲೂನಿನ ನಾಡೇ
  rationale: ಭೌಗೋಳಿಕ ಪ್ರದೇಶವನ್ನು ಸೂಚಿಸುವ Γῆಯನ್ನು ‘ನಾಡು’ ಎಂದು ಅನುವಾದಿಸಿ, ಉಲ್ಲೇಖದ ಸಂಬೋಧನಾ/ಕಾವ್ಯಾತ್ಮಕ ರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ನಾಡೇ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
- source_word: γῆ Νεφθαλίμ
  choice: ನಫ್ತಾಲಿಯ ನಾಡೇ
  rationale: ಮೊದಲ ಪದಗುಚ್ಛದ ಸಮಾಂತರ ರಚನೆಯನ್ನು ಉಳಿಸಿ, ನಫ್ತಾಲಿ ಎಂಬ ರೂಢಿಗತ ಬೈಬಲ್ ಹೆಸರನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ὁδὸν θαλάσσης
  choice: ಸಮುದ್ರದ ಮಾರ್ಗವೇ
  rationale: ಇದು ನಿರ್ದಿಷ್ಟ ದಾರಿಯನ್ನೋ ಸಮುದ್ರಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಪ್ರದೇಶವನ್ನೋ ಸೂಚಿಸಬಹುದಾದ ಮೂಲದ ಸಂಕ್ಷಿಪ್ತತೆ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ‘ಸಮುದ್ರದ ಮಾರ್ಗ’ ಉಳಿಸುತ್ತದೆ.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ಯೊರ್ದನ್ ನದಿಯ ಆಚೆಯ ಪ್ರದೇಶವೇ
  rationale: ‘ಆಚೆ’ ಎಂಬುದು ದೃಷ್ಟಿಕೋನವನ್ನು ಅತಿಯಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸದೆ πέραν ಅರ್ಥವನ್ನು ಕೊಡುತ್ತದೆ; ಕನ್ನಡ ಓದುಗರಿಗೆ ಭೌಗೋಳಿಕ ಉಲ್ಲೇಖ ಸ್ಪಷ್ಟವಾಗಲು ‘ನದಿ’ ಮತ್ತು ‘ಪ್ರದೇಶ’ ಸೇರಿಸಲಾಗಿದೆ.
- source_word: Γαλιλαία
  choice: ಗಲಿಲಾಯ
  rationale: ಪ್ರದೇಶದ ಹೆಸರಿಗೆ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪವನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: τῶν ἐθνῶν
  choice: ಯೆಹೂದ್ಯೇತರರ
  rationale: ಮತ್ತಾಯನ ಯೆಹೂದಿ ಸಂದರ್ಭದಲ್ಲಿರುವ ಜನಾಂಗೀಯ-ಧಾರ್ಮಿಕ ವ್ಯತ್ಯಾಸವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಪದಶಃ ‘ಜನಾಂಗಗಳ’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೆಶಾಯನ ಉಲ್ಲೇಖದಲ್ಲಿ τῶν ἐθνῶν ಎಂಬುದರ ಅನುವಾದ
  choice: ಯೆಹೂದ್ಯೇತರರ
  alternative: ಜನಾಂಗಗಳ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಸಾಮಾನ್ಯ ರಾಜಕೀಯ ರಾಷ್ಟ್ರಗಳಿಗಿಂತ ಯೆಹೂದ್ಯರಲ್ಲದ ಜನರನ್ನು ಮುಖ್ಯವಾಗಿ ಸೂಚಿಸುತ್ತದೆ. ಆದರೂ ‘ಜನಾಂಗಗಳ’ ಎಂಬ ಪದಶಃ ಅರ್ಥ ಸಾಧ್ಯವಾಗಿರುವುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ಇದು ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿ ಆರಂಭವಾದ ಪ್ರವಾದನಾ ಉಲ್ಲೇಖದ ಭಾಗವಾದುದರಿಂದ ಕಾವ್ಯಾತ್ಮಕ ಸಂಬೋಧನಾ ರೂಪಗಳು ಮತ್ತು ಅಂತ್ಯದ ದೀರ್ಘಗೆರೆ ಉಳಿಸಲಾಗಿದೆ.
