id: MAT.13.20
reference: Matthew 13:20
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: kn
  text: ಆದರೆ ಕಲ್ಲುಮಯವಾದ ನೆಲದಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು[a] ಎಂದರೆ, ವಾಕ್ಯವನ್ನು ಕೇಳಿ ಕೂಡಲೇ ಅದನ್ನು ಸಂತೋಷದಿಂದ ಸ್ವೀಕರಿಸುವವನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಹೆಚ್ಚು ಪದಶಃ: ‘ಕಲ್ಲುಮಯವಾದ ಸ್ಥಳಗಳಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು.’'
    reason: ಮೂಲದ ἐπὶ τὰ πετρώδη ಎಂಬ ಬಹುವಚನದ ಸ್ಥಳಸೂಚಕ ಅಭಿವ್ಯಕ್ತಿಗೆ ಹೆಚ್ಚು ಪದಶಃ ಪರ್ಯಾಯವನ್ನು ನೀಡುತ್ತದೆ.
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: ಕಲ್ಲುಮಯವಾದ ನೆಲದಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು
  rationale: ಈ ನಾಮಪದದಂತೆ ಕಾರ್ಯನಿರ್ವಹಿಸುವ ಕೃದಂತ ಪದಗುಚ್ಛವು ಬೀಜ-ನೆಲದ ರೂಪಕವನ್ನು ಉಳಿಸಿಕೊಂಡೇ ಅದು ಸೂಚಿಸುವ ವ್ಯಕ್ತಿಯ ಕಡೆಗೆ ಸಾಗುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಈ ಸಂಕ್ಷಿಪ್ತ ರೂಪಕವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πετρώδη
  choice: ಕಲ್ಲುಮಯವಾದ ನೆಲ
  rationale: ಈ ಪದವು ಕಲ್ಲುಗಳಿಂದ ಕೂಡಿದ ಅಥವಾ ಕೆಳಗೆ ಬಂಡೆಯಿರುವ ಭೂಮಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಕಲ್ಲುಮಯವಾದ ನೆಲ’ ಕೃಷಿಯ ರೂಪಕಕ್ಕೆ ಹೊಂದುವ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡವಾಗಿದೆ.
- source_word: σπαρείς
  choice: ಬಿತ್ತಲ್ಪಟ್ಟವನು
  rationale: σπείρω ಎಂಬ ಕ್ರಿಯಾಪದದ ಭೂತಕಾಲದ ಕರ್ಮಣಿ ಕೃದಂತವನ್ನು ಕರ್ಮಣಿ ರೂಪದಲ್ಲೇ ಉಳಿಸಿ, ಮೂಲದ ಸಂಕ್ಷಿಪ್ತ ರೂಪಕವನ್ನೂ ವ್ಯಕ್ತಿಸೂಚನೆಯನ್ನೂ ಕಾಪಾಡಲಾಗಿದೆ.
- source_word: οὗτός ἐστιν
  choice: ಯಾರೆಂದರೆ ... ಅವನೇ
  rationale: ಗ್ರೀಕ್‌ನ ಗುರುತಿಸುವ ವಾಕ್ಯವನ್ನು ಕನ್ನಡದ ಸಹಜ ಸಂಬಂಧಸೂಚಕ ವಿನ್ಯಾಸದಲ್ಲಿ ನೀಡಲಾಗಿದೆ; ‘ಸೂಚಿಸುತ್ತಾನೆ’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ಪದವನ್ನು ಸೇರಿಸಿಲ್ಲ.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ವಾಕ್ಯವನ್ನು ಕೇಳಿ ... ಸ್ವೀಕರಿಸುವವನು
  rationale: ವರ್ತಮಾನ ಕೃದಂತಗಳನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಂಬಂಧಾರ್ಥಕ ವಿನ್ಯಾಸವಾಗಿ ರೂಪಿಸಲಾಗಿದೆ. λόγος ಅನ್ನು ಅದರ ಮತ್ತಾಯನ ಸಾಂದರ್ಭಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸಲು ‘ವಾಕ್ಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: εὐθὺς
  choice: ಕೂಡಲೇ
  rationale: ತಕ್ಷಣದ ಪ್ರತಿಕ್ರಿಯೆಯ ಒತ್ತನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುವ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಪದ.
- source_word: μετὰ χαρᾶς
  choice: ಸಂತೋಷದಿಂದ
  rationale: χαρά ಎಂಬ ನಾಮಪದದ ಭಾವವನ್ನು ಸಹಜ ಕನ್ನಡದ ಕ್ರಿಯಾವಿಶೇಷಣೀಯ ರೂಪದಲ್ಲಿ ನಿಷ್ಠೆಯಿಂದ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: λαμβάνων αὐτόν
  choice: ಅದನ್ನು ... ಸ್ವೀಕರಿಸುವವನು
  rationale: λαμβάνω ಇಲ್ಲಿ ವಾಕ್ಯವನ್ನು ಸ್ವೀಕರಿಸುವುದು ಅಥವಾ ಅಂಗೀಕರಿಸುವುದು ಎಂಬ ಅರ್ಥದಲ್ಲಿದೆ. ‘ಸ್ವೀಕರಿಸು’ ಎರಡೂ ಛಾಯೆಗಳನ್ನು ಸಮರ್ಪಕವಾಗಿ ಹೊರುತ್ತದೆ; ‘ಅದನ್ನು’ ಎಂಬುದು ವಾಕ್ಯವನ್ನು ಹಿಂದಿರುಗಿ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದೃಷ್ಟಾಂತದ ವಿವರಣೆಯಲ್ಲಿ ‘ಬಿತ್ತಲ್ಪಟ್ಟವನು’ ಎಂಬುದರ ಸೂಚಿತಾರ್ಥ
  choice: ‘ಕಲ್ಲುಮಯವಾದ ನೆಲದಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು’ ಎಂಬ ಸಂಕ್ಷಿಪ್ತ ರೂಪಕವನ್ನು ಉಳಿಸಿ, ಮುಂದಿನ ಭಾಗವು ಅವನನ್ನು ವಾಕ್ಯವನ್ನು ಕೇಳುವ ವ್ಯಕ್ತಿಯಾಗಿ ಗುರುತಿಸುವಂತೆ ಮಾಡಲಾಗಿದೆ.
  alternative: ‘ಕಲ್ಲುಮಯವಾದ ನೆಲದಲ್ಲಿ ಬಿದ್ದ ಬೀಜವು ವಾಕ್ಯವನ್ನು ಕೇಳುವ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ’ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಬೀಜ ಮತ್ತು ವ್ಯಕ್ತಿಯ ನಡುವಿನ ರೂಪಕದ ಒತ್ತಡವನ್ನು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಅದನ್ನು ಸ್ಪಷ್ಟೀಕರಿಸುವ ಹೆಸರಿನಲ್ಲಿ ರೂಪಕವನ್ನು ಕರಗಿಸದೆ ಮೂಲದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಕೃಷಿಯ ರೂಪಕ ಮತ್ತು ‘ವಾಕ್ಯ’ ಎಂಬ ಮತ್ತಾಯನ ಪ್ರಮುಖ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
