revisions:
- from: ಅವನು ಬಹು ಬೆಲೆಬಾಳುವ ಒಂದೇ ಮುತ್ತನ್ನು ಕಂಡಾಗ[a], ಹೋಗಿ ತನ್ನಲ್ಲಿದ್ದದ್ದೆಲ್ಲವನ್ನೂ ಮಾರಿ ಅದನ್ನು ಕೊಂಡುಕೊಂಡನು.
  to: ಅವನು ಒಂದು ಬಹುಮೂಲ್ಯದ ಮುತ್ತನ್ನು ಕಂಡು[a], ಹೋಗಿ ತನ್ನಲ್ಲಿದ್ದದ್ದೆಲ್ಲವನ್ನೂ ಮಾರಿ ಅದನ್ನು ಕೊಂಡುಕೊಂಡನು.
  rationale: The revision replaces restrictive «ಒಂದೇ» with the unembellished numeral «ಒಂದು» and uses «ಬಹುಮೂಲ್ಯದ» for the pearl’s exceptional value. The footnote is adjusted to offer a close lexical alternative without implying that the pearl is literally priceless.
