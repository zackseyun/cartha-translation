id: MAT.13.46
reference: Matthew 13:46
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: kn
  text: ಅವನು ಒಂದು ಬಹುಮೂಲ್ಯದ ಮುತ್ತನ್ನು ಕಂಡು[a], ಹೋಗಿ ತನ್ನಲ್ಲಿದ್ದದ್ದೆಲ್ಲವನ್ನೂ ಮಾರಿ ಅದನ್ನು ಕೊಂಡುಕೊಂಡನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಬಹು ಬೆಲೆಯ ಮುತ್ತನ್ನು.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: ಕಂಡಾಗ
  rationale: Aorist participle marks action prior to the main verbs. In this continuing narrative, Kannada temporal construction naturally conveys that sequence; δέ is lightly connective and need not receive an explicit adversative equivalent.
- source_word: ἕνα
  choice: ಒಂದೇ
  rationale: The explicit numeral is retained, with emphatic ಏ highlighting the single pearl of exceptional worth.
- source_word: πολύτιμον
  choice: ಬಹು ಬೆಲೆಬಾಳುವ
  rationale: This is clear, dignified modern Kannada and directly conveys exceptional monetary or intrinsic value without narrowing the sense.
- source_word: μαργαρίτην
  choice: ಮುತ್ತನ್ನು
  rationale: This is the standard Kannada equivalent for ‘pearl’; the accusative ending fits its role as the object found.
- source_word: ἀπελθὼν
  choice: ಹೋಗಿ
  rationale: The conjunctive participle naturally expresses the sequential action of going away before selling and buying.
- source_word: πέπρακεν
  choice: ಮಾರಿ
  rationale: The conjunctive participle gives natural Kannada narrative flow while preserving the completed sale prior to the purchase.
- source_word: πάντα ὅσα εἶχεν
  choice: ತನ್ನಲ್ಲಿದ್ದದ್ದೆಲ್ಲವನ್ನೂ
  rationale: This idiomatic Kannada expression preserves the totality of everything he had.
- source_word: ἠγόρασεν
  choice: ಕೊಂಡುಕೊಂಡನು
  rationale: A plain modern Kannada equivalent for buying, serving as the finite culmination of the action sequence.
- source_word: αὐτόν
  choice: ಅದನ್ನು
  rationale: The pronoun refers to the inanimate pearl, so Kannada naturally uses the neuter demonstrative pronoun.
theological_decisions: []
translation_notes:
  register: Modern standard Kannada with a dignified but readily understandable narrative style. The sentence preserves the explicit singularity of the pearl, the sequence of finding, going, selling, and buying, and the totality of the merchant’s possessions.
