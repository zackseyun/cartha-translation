  terminology: ‘ಪರಲೋಕರಾಜ್ಯ’ವು ಮತ್ತಾಯನಿಗೆ ವೈಶಿಷ್ಟ್ಯವಾದ βασιλεία τῶν οὐρανῶνಗೆ ಕನ್ನಡ ಕ್ರೈಸ್ತ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ, ಸ್ವೀಕಾರಾರ್ಹ ಪದವಾಗಿದೆ. ‘ನಿಧಿ,’ ‘ಹೊಲ,’ ಮತ್ತು ‘ಮನುಷ್ಯನು’ ಕ್ರಮವಾಗಿ θησαυρός, ἀγρός, ಮತ್ತು ಪುಲ್ಲಿಂಗ ಏಕವಚನ ἄνθρωπος ಅನ್ನು ಸಮರ್ಪಕವಾಗಿ ಪ್ರತಿನಿಧಿಸುತ್ತವೆ.
  issues:
