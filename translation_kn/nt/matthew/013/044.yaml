  revision_rationale: ಪರಿಷ್ಕರಣೆಯು ಅಡಗಿರುವ ನಿಧಿಯ ಸ್ಥಿತಿಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಗ್ರೀಕ್‌ನಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಇಲ್ಲದ ‘ಮತ್ತೆ’ ಎಂಬ ಸೂಚನೆಯನ್ನು ತೆಗೆದುಹಾಕುತ್ತದೆ. ವಾಕ್ಯದ ಜೀವಂತ ವರ್ತಮಾನ ನಿರೂಪಣೆ (‘ಕೊಂಡುಕೊಳ್ಳುತ್ತಾನೆ’), ನಿರ್ದಿಷ್ಟವಾದ ‘ಆ ಹೊಲ,’ ಮತ್ತು ನೈತಿಕ ಮೌಲ್ಯಮಾಪನವಿಲ್ಲದ ಕಥನಶೈಲಿ ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿಗಳ ಅರ್ಥ ಮತ್ತು ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿತ ಪಠ್ಯಭಾಗಗಳಿಗೆ ಹೊಂದಿಸಲಾಗಿದೆ.
