id: MAT.13.44
reference: Matthew 13:44
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: kn
  text: “ಪರಲೋಕರಾಜ್ಯವು ಹೊಲದಲ್ಲಿ ಅಡಗಿದ್ದ ನಿಧಿಗೆ ಹೋಲುತ್ತದೆ.[a] ಒಬ್ಬ ಮನುಷ್ಯನು ಅದನ್ನು ಕಂಡು ಅಡಗಿಸಿದನು. ಅವನು ತನ್ನ ಸಂತೋಷದಿಂದ[b] ಹೋಗಿ, ತನಗಿರುವುದನ್ನೆಲ್ಲ ಮಾರಿ ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುತ್ತಾನೆ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪರಲೋಕರಾಜ್ಯವು ಹೊಲದಲ್ಲಿ ಅಡಗಿದ್ದ ನಿಧಿಯಂತಿದೆ.”
    reason: ಹೋಲಿಕೆಯ ವಾಕ್ಯರಚನೆಗೆ ಕನ್ನಡದಲ್ಲಿನ ಸಹಜ ಪರ್ಯಾಯ.
  - marker: b
    text: ಅಥವಾ, “ತನ್ನ ಸಂತೋಷದ ಕಾರಣದಿಂದ.”
    reason: ἀπὸ τῆς χαρᾶς αὐτοῦ ಪದಗುಚ್ಛವು ಅವನ ಸಂತೋಷವೇ ಮುಂದಿನ ಕ್ರಿಯೆಗಳಿಗೆ ಪ್ರೇರಕ ಕಾರಣವೆಂದು ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: ಹೋಲುತ್ತದೆ
  rationale: ಯೇಸುವಿನ ಸಾಮ್ಯಗಳಲ್ಲಿ ಬರುವ ಹೋಲಿಕೆಯ ಸೂತ್ರವನ್ನು ಸಹಜ ಹಾಗೂ ನೇರವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯವು
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸುವ, ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಪದ; βασιλείαಯ ರಾಜ್ಯ ಮತ್ತು ಆಳ್ವಿಕೆಯ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಒಂದಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: θησαυρῷ
  choice: ಒಂದು ನಿಧಿಗೆ
  rationale: ಅನಿರ್ದಿಷ್ಟ ಹೋಲಿಕೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ನಿಧಿ’ ಅಡಗಿಸಿಡಬಹುದಾದ ಅಮೂಲ್ಯ ಸಂಪತ್ತಿನ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: ಹೊಲದಲ್ಲಿ ಅಡಗಿಸಿಟ್ಟಿದ್ದ
  rationale: ಪರಿಪೂರ್ಣ ಕರ್ಮಣಿ ಕೃದಂತವು ಸೂಚಿಸುವ, ಹಿಂದೆ ಅಡಗಿಸಲ್ಪಟ್ಟು ಇನ್ನೂ ಅಡಗಿರುವ ಸ್ಥಿತಿಯನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: ಒಬ್ಬ ಮನುಷ್ಯನು ಅದನ್ನು ಕಂಡು
  rationale: ಸಂಬಂಧವಾಚಕ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡ ಕ್ರಮಕ್ಕೆ ಬದಲಾಯಿಸಿ, ನಿಧಿಯನ್ನೇ ಕಂಡನು ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಪುಲ್ಲಿಂಗ ಏಕವಚನ ನಿರೂಪಣೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἔκρυψεν
  choice: ಮತ್ತೆ ಅಡಗಿಸಿಟ್ಟನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಮತ್ತೆ’ ಎಂಬ ಪ್ರತ್ಯೇಕ ಪದವಿಲ್ಲದಿದ್ದರೂ, ನಿಧಿ ಈಗಾಗಲೇ ಅಡಗಿದ್ದು ಅವನು ಕಂಡ ಬಳಿಕ ἔκρυψεν ಎಂದಿರುವುದರಿಂದ ಪುನಃ ಅಡಗಿಸಿದ ಕ್ರಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: ತನ್ನ ಸಂತೋಷದ ನಿಮಿತ್ತ
  rationale: ἀπό ಪದಗುಚ್ಛದ ಕಾರಣಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅವನ ಸಂತೋಷವೇ ಮುಂದಿನ ಕ್ರಿಯೆಗೆ ಪ್ರೇರಣೆ ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὑπάγει
  choice: ಹೋಗಿ
  rationale: ವಿವರಣೆಯ ಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡ ಸಂಯೋಜಕ ಕೃದಂತದಿಂದ ನೀಡುತ್ತದೆ; ಹೊರಟುಹೋಗುವ ಅರ್ಥವನ್ನು ಅತಿಯಾಗಿ ಒತ್ತಿಹೇಳುವುದಿಲ್ಲ.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: ತನಗಿರುವುದನ್ನೆಲ್ಲ ಮಾರಿ
  rationale: πάντα ὅσαಯ ಸಮಗ್ರತೆಯನ್ನು ಉಳಿಸಿ, ಸರಳ ಮತ್ತು ಸಹಜ ಕನ್ನಡವನ್ನು ಬಳಸುತ್ತದೆ.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುತ್ತಾನೆ
  rationale: ἐκεῖνον ಸೂಚಿಸುವ ನಿರ್ದಿಷ್ಟ ಹೊಲವನ್ನು ‘ಆ ಹೊಲ’ ಎಂದು ಉಳಿಸಿ, ವರ್ತಮಾನಕಾಲದ ಜೀವಂತ ನಿರೂಪಣೆಯನ್ನೂ ಕಾಯ್ದುಕೊಳ್ಳುತ್ತದೆ.
theological_decisions:
- issue: βασιλεία ಎಂಬ ಪದದ ಅರ್ಥವ್ಯಾಪ್ತಿ
  choice: ಪರಲೋಕರಾಜ್ಯ
  alternative: ಪರಲೋಕದ ಆಳ್ವಿಕೆ
  rationale: ಈ ಪದವು ರಾಜ್ಯ ಮತ್ತು ಆಳ್ವಿಕೆ ಎರಡನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು. ಪರಿಚಿತವಾದ ‘ಪರಲೋಕರಾಜ್ಯ’ವನ್ನು ಬಳಸುವುದರಿಂದ ಸಾಮ್ಯದ ಸಂಪ್ರದಾಯಬದ್ಧ ರೂಪ ಉಳಿಯುತ್ತದೆ; ದೇವರ ಕ್ರಿಯಾಶೀಲ ಆಳ್ವಿಕೆಯ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ವಿವರಣೆಯಿಂದ ಮುಚ್ಚುವುದಿಲ್ಲ.
- issue: ἄνθρωπος ಪದದ ಲಿಂಗ ನಿರೂಪಣೆ
  choice: ಒಬ್ಬ ಮನುಷ್ಯನು
  alternative: ಒಬ್ಬ ವ್ಯಕ್ತಿ
  rationale: ಇಲ್ಲಿ ಕಥೆಯ ಪಾತ್ರವು ಪುಲ್ಲಿಂಗ ಏಕವಚನದಲ್ಲಿದೆ. ಆದ್ದರಿಂದ ಮೂಲದ ನಿರೂಪಣೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಇದರಿಂದ ಸಾಮ್ಯದ ಅನ್ವಯವನ್ನು ಪುರುಷರಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವ ಉದ್ದೇಶವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
- issue: ನಿಧಿಯನ್ನು ಮತ್ತೆ ಅಡಗಿಸುವ ಕ್ರಿಯೆಯ ನೈತಿಕ ಮೌಲ್ಯಮಾಪನ
  choice: ಘಟನೆಯನ್ನು ಮಾತ್ರ ನಿರೂಪಿಸುವುದು
  alternative: ಕ್ರಿಯೆಯನ್ನು ಸರಿ ಅಥವಾ ತಪ್ಪೆಂದು ಸೂಚಿಸುವ ಪದಗಳನ್ನು ಸೇರಿಸುವುದು
  rationale: ಮೂಲಪಾಠವು ಆ ಮನುಷ್ಯನ ಕ್ರಿಯೆಯನ್ನು ನೈತಿಕವಾಗಿ ವಿವರಿಸುವುದಿಲ್ಲ. ಅನುವಾದವು ಆ ಮೌನವನ್ನು ಉಳಿಸಿ, ಪಂಥೀಯ ಅಥವಾ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ತೀರ್ಪನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ಪರಿಚಿತ ಧಾರ್ಮಿಕ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಉಳಿದ ವಾಕ್ಯವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸಹಜವಾಗುವಂತೆ ರೂಪಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಾಠದಲ್ಲಿನ [a], [b] ಗುರುತುಗಳು ಎಲ್ಲಾ ಪಾದಟಿಪ್ಪಣಿಗಳಿಗೆ ಹೊಂದಿಕೆಯಾಗಿವೆ.
