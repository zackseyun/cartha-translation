  revised_text: “ಪರಲೋಕರಾಜ್ಯವು ಹೊಲದಲ್ಲಿ ಅಡಗಿದ್ದ ನಿಧಿಗೆ ಹೋಲುತ್ತದೆ.[a] ಒಬ್ಬ ಮನುಷ್ಯನು ಅದನ್ನು ಕಂಡು ಅಡಗಿಸಿದನು. ಅವನು ತನ್ನ ಸಂತೋಷದಿಂದ[b] ಹೋಗಿ, ತನಗಿರುವುದನ್ನೆಲ್ಲ ಮಾರಿ ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುತ್ತಾನೆ.”
