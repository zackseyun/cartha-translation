  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವಂತೆ, ಆದರೆ ಪ್ರವಾದನಾ ಉಲ್ಲೇಖದ ಘನ ಮತ್ತು ಕಾವ್ಯಾತ್ಮಕ ಧಾಟಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಮುಖ್ಯ ಪಾಠದ [a] ಗುರುತು ಅಡಿಕುರಿಪಿಗೆ ನೇರವಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ.
