id: MAT.13.35
reference: Matthew 13:35
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: kn
  text: 'ಪ್ರವಾದಿಯ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತೆ: “ನಾನು ದೃಷ್ಟಾಂತಗಳಲ್ಲಿ ನನ್ನ ಬಾಯನ್ನು ತೆರೆಯುವೆನು; ಅಸ್ತಿವಾರದಿಂದ[a] ಗುಪ್ತವಾಗಿದ್ದ ಸಂಗತಿಗಳನ್ನು ಹೊರಹೇಳುವೆನು.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ “ಲೋಕದ ಅಸ್ತಿವಾರದಿಂದ” ಎಂದು ಇದೆ; ಇಲ್ಲಿ ಅನುಸರಿಸಿದ ಗ್ರೀಕ್ ಪಾಠದಲ್ಲಿ “ಅಸ್ತಿವಾರದಿಂದ” ಎಂದಷ್ಟೇ ಇದೆ.
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ನೆರವೇರುವಂತೆ ಹೀಗೆ ಆಯಿತು
  rationale: ಉದ್ದೇಶ/ಫಲದ ಸಂಬಂಧವನ್ನೂ ಮತ್ತಾಯನ ನೆರವೇರಿಕೆಯ ಸೂತ್ರವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ಮುಖ್ಯ ವಾಕ್ಯದ ಅರ್ಥವನ್ನು ಪೂರ್ಣಗೊಳಿಸುತ್ತದೆ.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: ಪ್ರವಾದಿಯ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು
  rationale: διά + ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಮಧ್ಯಸ್ಥಿಕೆ/ಸಾಧನಾರ್ಥವನ್ನು ‘ಮೂಲಕ’ ಉಳಿಸುತ್ತದೆ; ಕರ್ಮಣಿ ರೂಪವು ಗ್ರೀಕ್ ಪದಪ್ರಯೋಗಕ್ಕೆ ಸಮೀಪವಾಗಿದೆ.
- source_word: λέγοντος
  choice: ಹೀಗೆ
  rationale: ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಉಲ್ಲೇಖ-ಪರಿಚಯವಾಗಿ ನೀಡಲಾಗಿದೆ.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: ನಾನು ಸಾಮ್ಯಗಳಲ್ಲಿ ನನ್ನ ಬಾಯನ್ನು ತೆರೆಯುವೆನು
  rationale: ಉಲ್ಲೇಖದ ಕಾವ್ಯಾತ್ಮಕ ರೂಪವನ್ನೂ ‘ಸಾಮ್ಯಗಳು’ ಎಂಬ ಮತ್ತಾಯನ ಪ್ರಮುಖ ಬೋಧನಾ ಪದವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐρεύξομαι
  choice: ನುಡಿಯುವೆನು
  rationale: ಹೊರಹಾಕಿ ಹೇಳುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ಆಧುನಿಕ, ಘನತೆಯ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅತಿಯಾದ ಶಾಬ್ದಿಕ ‘ಉಗುಳುವೆನು’ ಎಂಬ ಅನಗತ್ಯ ಭಾವವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: κεκρυμμένα
  choice: ಮರೆಯಾಗಿದ್ದ ಸಂಗತಿಗಳು
  rationale: ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ಕೃದಂತದಲ್ಲಿರುವ ಹಿಂದಿನಿಂದ ಮರೆಯಾಗಿದ್ದು ಮುಂದುವರಿದ ಸ್ಥಿತಿಯ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ರಹಸ್ಯಗಳು’ ಎಂದು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ಬದಲಿಸುವುದಿಲ್ಲ.
- source_word: ἀπὸ καταβολῆς
  choice: ಲೋಕದ ಅಸ್ತಿವಾರದಿಂದಲೂ
  rationale: καταβολή ಯನ್ನು ‘ಅಸ್ತಿವಾರ’ ಎಂದು ರೂಪಕಸಹಿತವಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ಸಂದರ್ಭದಲ್ಲಿನ ಸ್ಥಿರ ಗ್ರೀಕ್ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ‘ಲೋಕದ’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ; ಆದರೆ ಪಾಠಾಂತರದ ವಿಷಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಪ್ರವಾದಿಯ ಗುರುತು
  choice: ಪ್ರವಾದಿಯ ಮೂಲಕ
  alternative: ಆಸಾಫ್ ಪ್ರವಾದಿಯ ಮೂಲಕ
  rationale: ನೀಡಿದ SBLGNT ಪಾಠದಲ್ಲಿ ಪ್ರವಾದಿಯ ಹೆಸರು ಇಲ್ಲ; ಆದ್ದರಿಂದ ಹೆಸರನ್ನು ಸೇರಿಸದೆ ಮೂಲದ ಅನಿರ್ದಿಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: ἀπὸ καταβολῆς ಎಂಬ ಕಾಲಸೂಚಕ ನುಡಿಗಟ್ಟಿನ ವ್ಯಾಪ್ತಿ
  choice: ಲೋಕದ ಅಸ್ತಿವಾರದಿಂದಲೂ
  alternative: ಅಸ್ತಿವಾರದಿಂದಲೂ
  rationale: ಕೊಟ್ಟಿರುವ ಗ್ರೀಕ್ ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ κόσμου ಇಲ್ಲದಿದ್ದರೂ, ಈ ನುಡಿಗಟ್ಟಿನ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪೂರ್ಣವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸಲು ‘ಲೋಕದ’ ಸೇರಿಸಲಾಗಿದೆ. ಪದದ ಪಾಠಸ್ಥಿತಿಯನ್ನು ಅಡಿಕುರಿಪು ಪಾರದರ್ಶಕವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
