  naturalness: ‘ಪ್ರವಾದಿಯ ಮೂಲಕ ಹೇಳಲ್ಪಟ್ಟದ್ದು ನೆರವೇರುವಂತೆ’ ಎನ್ನುವುದು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾದರೂ ಸ್ಪಷ್ಟವಾದ ಮತ್ತಾಯನ ನೆರವೇರಿಕೆ-ಸೂತ್ರವಾಗಿದೆ. ‘ದೃಷ್ಟಾಂತಗಳಲ್ಲಿ’ ಮತ್ತು ‘ಹೊರಹೇಳುವೆನು’ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಉಲ್ಲೇಖದ ಕಾವ್ಯಾತ್ಮಕ ಧಾಟಿಯನ್ನೂ ಉಳಿಸುತ್ತವೆ.
