revisions:
- from: ಆದರೆ ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ ಬಿತ್ತಲ್ಪಟ್ಟವನು ಯಾರೆಂದರೆ, ವಾಕ್ಯವನ್ನು ಕೇಳಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವವನೇ. ಅವನು ನಿಜವಾಗಿಯೂ ಫಲಕೊಟ್ಟು ಬೆಳೆ ನೀಡುತ್ತಾನೆ—ಒಬ್ಬನು ನೂರರಷ್ಟು, ಇನ್ನೊಬ್ಬನು ಅರವತ್ತರಷ್ಟು, ಮತ್ತೊಬ್ಬನು ಮೂವತ್ತರಷ್ಟು.[a]
  to: ಆದರೆ ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ ಬಿತ್ತಲ್ಪಟ್ಟವನು ಎಂದರೆ, ವಾಕ್ಯವನ್ನು ಕೇಳಿ ಅದನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವವನು. ಅವನು ನಿಜಕ್ಕೂ ಫಲಕೊಡುತ್ತಾನೆ ಮತ್ತು ಬೆಳೆ ನೀಡುತ್ತಾನೆ—ಕೆಲವರು ನೂರು, ಕೆಲವರು ಅರವತ್ತು, ಮತ್ತು ಕೆಲವರು ಮೂವತ್ತು.[a]
  rationale: The revision corrects the Kannada identificational syntax, explicitly supplies the natural anaphoric object ‘ಅದನ್ನು’ for what is understood, retains both Greek fruit-production verbs, and renders the distributive yield pattern with idiomatic Kannada plural wording. The footnote retains the source's bare numerical expression without asserting that ‘ಪಟ್ಟು’ is explicit in the Greek.
