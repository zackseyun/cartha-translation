id: MAT.13.23
reference: Matthew 13:23
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: kn
  text: ಆದರೆ ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ ಬಿತ್ತಲ್ಪಟ್ಟವನು ಎಂದರೆ, ವಾಕ್ಯವನ್ನು ಕೇಳಿ ಅದನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವವನು. ಅವನು ನಿಜಕ್ಕೂ ಫಲಕೊಡುತ್ತಾನೆ ಮತ್ತು ಬೆಳೆ ನೀಡುತ್ತಾನೆ—ಕೆಲವರು ನೂರು, ಕೆಲವರು ಅರವತ್ತು, ಮತ್ತು ಕೆಲವರು ಮೂವತ್ತು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಮೂಲದಲ್ಲಿ ಅಕ್ಷರಶಃ, ‘ಒಂದು ನೂರು, ಇನ್ನೊಂದು ಅರವತ್ತು, ಇನ್ನೊಂದು ಮೂವತ್ತು’; ಅಂದರೆ ಬೆಳೆ ನೀಡುವ ಪ್ರಮಾಣವು ಬೇರೆಬೇರೆಯಾಗಿರುತ್ತದೆ. ಅನೇಕ ಅನುವಾದಗಳು ಇದನ್ನು ‘ನೂರು ಪಟ್ಟು ... ಅರವತ್ತು ... ಮೂವತ್ತು’ ಎಂದು ಹೇಳುತ್ತವೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ
  rationale: ಕೃಷಿಯ ಸನ್ನಿವೇಶದಲ್ಲಿ γῆ ಅನ್ನು ‘ಮಣ್ಣು’ ಎಂದು ಅನುವಾದಿಸುವುದು ಸಹಜ; καλὴν ಇಲ್ಲಿ ನೈತಿಕ ಒಳ್ಳೆಯತನಕ್ಕಿಂತ ಬೀಜ ಬೆಳೆಯಲು ಯೋಗ್ಯವಾದ ಮಣ್ಣನ್ನು ಸೂಚಿಸುತ್ತದೆ. ἐπί + accusative ಯ ‘ಮೇಲೆ’ ಎಂಬ ಸ್ಥಳಾರ್ಥವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: σπαρείς
  choice: ಬಿತ್ತಲ್ಪಟ್ಟವನು
  rationale: ಇದು ಭೂತಕಾಲಿಕ ಕರ್ಮಣಿ ಕೃದಂತವಾಗಿದ್ದು, ಬೀಜದಿಂದ ಪ್ರತಿನಿಧಿಸಲ್ಪಡುವ ವ್ಯಕ್ತಿಯನ್ನು ವರ್ಣಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಿಸೂಚಕ ರೂಪವು ಮುಂದಿನ ‘ವಾಕ್ಯವನ್ನು ಕೇಳುವವನು’ ಎಂಬ ವಿವರಣೆಗೆ ಸರಾಗವಾಗಿ ಹೊಂದುತ್ತದೆ.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ವಾಕ್ಯವನ್ನು ಕೇಳಿ ... ಅವನು
  rationale: λόγος ಗೆ ಸುವಾರ್ತಾ ಸನ್ನಿವೇಶದ ಪರಿಚಿತ ಪದವಾದ ‘ವಾಕ್ಯ’ವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ವರ್ತಮಾನ ಕೃದಂತದ ಲಕ್ಷಣಾತ್ಮಕ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಂಬಂಧವಾಕ್ಯ ವಿನ್ಯಾಸದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: συνιείς
  choice: ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವವನು
  rationale: συνίημι ಕೇಳಿದ ವಾಕ್ಯದ ಅರ್ಥವನ್ನು ಗ್ರಹಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಪಂಥೀಯ ಅಥವಾ ಹೆಚ್ಚುವರಿ ತಾತ್ತ್ವಿಕ ಅರ್ಥವನ್ನು ಸೇರಿಸದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: δὴ
  choice: ನಿಜವಾಗಿಯೂ
  rationale: δή ನೀಡುವ ಒತ್ತನ್ನು ಕನ್ನಡದಲ್ಲಿ ಹಗುರವಾಗಿ ಆದರೆ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: καρποφορεῖ
  choice: ಫಲಕೊಟ್ಟು
  rationale: ಮೂಲದ ಕೃಷಿ ರೂಪಕವನ್ನೂ ಶಿಷ್ಯತ್ವದ ಸನ್ನಿವೇಶದಲ್ಲಿನ ಅದರ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ποιεῖ
  choice: ಬೆಳೆ ನೀಡುತ್ತಾನೆ
  rationale: ಈ ಕೃಷಿ ಸನ್ನಿವೇಶದಲ್ಲಿ ποιεῖ ಉತ್ಪಾದನೆ ಅಥವಾ ಇಳುವರಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಫಲಕೊಟ್ಟು’ ಎಂಬ ಹಿಂದಿನ ಕ್ರಿಯಾಪದದಿಂದ ಇದನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಉಳಿಸಲು ‘ಬೆಳೆ ನೀಡುತ್ತಾನೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ಒಬ್ಬನು ನೂರರಷ್ಟು, ಇನ್ನೊಬ್ಬನು ಅರವತ್ತರಷ್ಟು, ಮತ್ತೊಬ್ಬನು ಮೂವತ್ತರಷ್ಟು
  rationale: ವಿತರಣಾರ್ಥಕ ಗ್ರೀಕ್ ರಚನೆಯು ವಿವಿಧ ವ್ಯಕ್ತಿಗಳಲ್ಲಿನ ವಿಭಿನ್ನ ಇಳುವರಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಒಬ್ಬನು ... ಇನ್ನೊಬ್ಬನು ... ಮತ್ತೊಬ್ಬನು’ ಎಂಬ ರೂಪವು ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ‘ಪಟ್ಟು’ ಎಂಬ ಪದ ಮೂಲದಲ್ಲಿ ಪ್ರತ್ಯಕ್ಷವಾಗಿಲ್ಲದಿದ್ದರೂ ಅರ್ಥಸ್ಪಷ್ಟತೆಗೆ ‘ರಷ್ಟು’ ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: ವಾಕ್ಯಕ್ಕೆ ನೀಡುವ ಪ್ರತಿಕ್ರಿಯೆಯ ಸ್ವರೂಪ
  choice: ಒಳ್ಳೆಯ ಮಣ್ಣಿನಿಂದ ಪ್ರತಿನಿಧಿಸಲ್ಪಟ್ಟವನು ವಾಕ್ಯವನ್ನು ಕೇಳಿ, ಅರ್ಥಮಾಡಿಕೊಂಡು, ವಿಭಿನ್ನ ಪ್ರಮಾಣದಲ್ಲಿ ಫಲಕೊಡುವವನಾಗಿ ವರ್ಣಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ.
  alternative: ತಾಳ್ಮೆ, ನಿಜವಾದ ಪರಿವರ್ತನೆ ಅಥವಾ ರಕ್ಷಣೆಯ ಖಚಿತ ಸಾಕ್ಷ್ಯವನ್ನು ಅನುವಾದದಲ್ಲೇ ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸುವುದು.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಕೇಳುವುದು, ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು ಮತ್ತು ಫಲಕೊಡುವುದನ್ನು ಹೇಳುತ್ತದೆ; ನಂತರದ ಪಂಥೀಯ ಅಥವಾ ವ್ಯವಸ್ಥಿತ ತಾತ್ತ್ವಿಕ ವರ್ಗಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಪಠ್ಯದ ಸ್ವಂತ ಒತ್ತನ್ನು ಮಾತ್ರ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ಕೃಷಿ ರೂಪಕವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಗ್ರೀಕ್ ವಾಕ್ಯದ ಪುನರುಕ್ತ ಕ್ರಿಯಾಪದಗಳನ್ನು ಸಾಧ್ಯವಾದಷ್ಟು ಪ್ರತ್ಯೇಕವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
