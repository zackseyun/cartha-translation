id: MAT.13.5
reference: Matthew 13:5
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: kn
  text: ಬೇರೆ ಕೆಲವು ಬೀಜಗಳು ಬಂಡೆಯ ನೆಲದ ಮೇಲೆ[a] ಬಿದ್ದವು. ಅಲ್ಲಿ ಹೆಚ್ಚು ಮಣ್ಣು ಇರಲಿಲ್ಲ; ಅವು ಕೂಡಲೇ ಮೊಳಕೆಯೊಡೆದವು, ಏಕೆಂದರೆ ಮಣ್ಣಿಗೆ ಆಳವಿರಲಿಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಪದಶಃ, ‘ಕಲ್ಲಿನ ಸ್ಥಳಗಳ ಮೇಲೆ’; ಇದರ ಅರ್ಥ, ಕೆಳಗೆ ಬಂಡೆಯ ಪದರವಿದ್ದು ಅದರ ಮೇಲೆ ತೆಳುವಾದ ಮಣ್ಣು ಇರುವ ಸ್ಥಳಗಳು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: ಬೇರೆ ಕೆಲವು ಬೀಜಗಳು
  rationale: ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನ ಪದವು ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಬೀಜಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥ ಸ್ಪಷ್ಟವಾಗಲು ‘ಬೀಜಗಳು’ ಎಂದು ಸೇರಿಸಲಾಗಿದೆ.
- source_word: ἔπεσεν
  choice: ಬಿದ್ದವು
  rationale: ಮೂಲ ಕ್ರಿಯಾಪದದ ಸರಳ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಬಿತ್ತಲ್ಪಟ್ಟವು’ ಎಂಬ ಹೆಚ್ಚುವರಿ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐπὶ τὰ πετρώδη
  choice: ಕಲ್ಲುನೆಲದ ಮೇಲೆ
  rationale: ಕಲ್ಲಿನ ಪದರದ ಮೇಲೆ ತೆಳುವಾಗಿ ಮಣ್ಣು ಇರುವ ಸ್ಥಳಗಳನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಕನ್ನಡ ಪ್ರಯೋಗ.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: ಅಲ್ಲಿ ಹೆಚ್ಚು ಮಣ್ಣು ಇರಲಿಲ್ಲ
  rationale: ಕೃಷಿ ಸಂದರ್ಭಕ್ಕೆ ‘ಮಣ್ಣು’ ಸಹಜವಾಗಿದ್ದು, ಸ್ಥಳದಲ್ಲಿ ಮಣ್ಣು ಕಡಿಮೆಯಿತ್ತು ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: ಅವು ಕೂಡಲೇ ಮೊಳಕೆಯೊಡೆದವು
  rationale: εὐθέωςನ ತಕ್ಷಣದ ಕಾಲಭಾವವನ್ನೂ, ಕೃಷಿ ಸಂದರ್ಭದಲ್ಲಿ ἐξανέτειλεν ಸೂಚಿಸುವ ಮೊಳಕೆಯೇಳುವ ಕ್ರಿಯೆಯನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: ಮಣ್ಣು ಆಳವಾಗಿರದ ಕಾರಣ
  rationale: διά ಸಹಿತ infinitiveನ ಕಾರಣಾರ್ಥವನ್ನು ಉಳಿಸಿ, ಮಣ್ಣಿನ ಪದರಕ್ಕೆ ಆಳವಿಲ್ಲದ ಸ್ಥಿತಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಹೇಳುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಪೂರ್ಣ ಕೃಷಿ ಭಾಷೆಯನ್ನು ಬಳಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ಬಹುವಚನ ಬೀಜಗಳ ಸೂಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಹೊಂದಿಸಲು ಬಹುವಚನ ಕ್ರಿಯಾರೂಪಗಳನ್ನು ಬಳಸಲಾಗಿದೆ.
