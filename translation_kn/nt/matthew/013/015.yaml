id: MAT.13.15
reference: Matthew 13:15
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: kn
  text: ಏಕೆಂದರೆ ಈ ಜನರ ಹೃದಯವು ಮಂದವಾಗಿದೆ; ಕಿವಿಗಳಿಂದ ಕೇಳಲು ಅವರಿಗೆ ಕಷ್ಟವಾಗಿದೆ[a]; ತಮ್ಮ ಕಣ್ಣುಗಳನ್ನು ಮುಚ್ಚಿದ್ದಾರೆ. ಅವರು ಕಣ್ಣುಗಳಿಂದ ನೋಡಿ, ಕಿವಿಗಳಿಂದ ಕೇಳಿ, ಹೃದಯದಿಂದ ಗ್ರಹಿಸಿ, ತಿರುಗಿ[b][c], ನಾನು ಅವರನ್ನು ಗುಣಪಡಿಸದಂತೆ ಹೀಗಾಗಿದೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಪದಶಃ, “ಕಿವಿಗಳಿಂದ ಭಾರವಾಗಿ ಕೇಳಿದ್ದಾರೆ”; ಅಥವಾ, “ಕೇಳುವುದು ಅವರಿಗೆ ಕಷ್ಟವಾಗಿದೆ.”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, “ಹಿಂತಿರುಗಿ” ಅಥವಾ “ತಿರುಗಿ.”
    reason: lexical_alternative
  - marker: c
    text: ಯೆಶಾಯ 6:9–10ರಿಂದ ಉಲ್ಲೇಖ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: ಜಡವಾಗಿದೆ
  rationale: ಪದಶಃ ‘ದಪ್ಪವಾಗಿದೆ’ ಎಂಬ ಅರ್ಥವಿದ್ದರೂ, ಹೃದಯದ ಕುರಿತು ಇದು ಗ್ರಹಣಶಕ್ತಿಯ ಮಂದತೆ ಅಥವಾ ಸಂವೇದನಾಹೀನತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಜಡವಾಗಿದೆ’ ಎಂಬುದು ಸಹಜವಾಗಿದ್ದು ರೂಪಕದ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: καρδία
  choice: ಹೃದಯ
  rationale: ಆಂತರಿಕ ವ್ಯಕ್ತಿತ್ವ, ಗ್ರಹಿಕೆ ಮತ್ತು ಮನೋಭಾವದ ಕೇಂದ್ರವನ್ನು ಸೂಚಿಸುವ ಸಾಂಪ್ರದಾಯಿಕ ಹಾಗೂ ಸ್ಪಷ್ಟ ಪದ.
- source_word: βαρέως ἤκουσαν
  choice: ಕಷ್ಟಪಟ್ಟು ಕೇಳಿದ್ದಾರೆ
  rationale: ಪದಶಃ ‘ಭಾರವಾಗಿ ಕೇಳಿದರು’; ಇಲ್ಲಿ ಸರಿಯಾಗಿ ಅಥವಾ ಸುಲಭವಾಗಿ ಕೇಳಲಾಗದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಕಷ್ಟಪಟ್ಟು ಕೇಳಿದ್ದಾರೆ’ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐκάμμυσαν
  choice: ಮುಚ್ಚಿಕೊಂಡಿದ್ದಾರೆ
  rationale: ಜನರೇ ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಕಣ್ಣು ಮುಚ್ಚಿದ ಸಕ್ರಿಯ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: μήποτε
  choice: ಇಲ್ಲವಾದರೆ ...ಬಹುದು
  rationale: ಗ್ರೀಕ್‌ನ ನಕಾರಾತ್ಮಕ ಉದ್ದೇಶ/ಪರಿಣಾಮದ ಒತ್ತಡವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ನ್ಯಾಯತೀರ್ಪು ಮತ್ತು ಮಾನವ ಹೊಣೆಗಾರಿಕೆಯ ನಡುವಿನ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಪರಿಹರಿಸುವುದಿಲ್ಲ.
- source_word: συνῶσιν
  choice: ಗ್ರಹಿಸಿ
  rationale: ಕೇವಲ ಮಾಹಿತಿ ತಿಳಿಯುವುದಕ್ಕಿಂತ ಒಳನೋಟದಿಂದ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐπιστρέψωσιν
  choice: ನನ್ನ ಕಡೆಗೆ ತಿರುಗಿಕೊಳ್ಳಬಹುದು
  rationale: ‘ತಿರುಗು/ಹಿಂತಿರುಗು’ ಎಂಬ ದಿಕ್ಕಿನ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಅಗತ್ಯವಾದ ಪೂರಕವನ್ನು ಸಂದರ್ಭದಿಂದ ‘ನನ್ನ ಕಡೆಗೆ’ ಎಂದು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; ಪಂಥೀಯ ‘ಮತಾಂತರ’ ಭಾಷೆಯನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
- source_word: ἰάσομαι
  choice: ನಾನು ಅವರನ್ನು ಗುಣಪಡಿಸುವೆನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ರೂಪವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ದೇವರ ಗುಣಪಡಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ನ್ಯಾಯತೀರ್ಪಿನ ಉದ್ದೇಶ ಮತ್ತು ಮಾನವ ಹೊಣೆಗಾರಿಕೆಯ ನಡುವಿನ ಉದ್ವಿಗ್ನತೆ
  choice: ಜನರು ತಮ್ಮ ಕಣ್ಣುಗಳನ್ನು ಮುಚ್ಚಿಕೊಂಡಿದ್ದಾರೆ; ಇಲ್ಲವಾದರೆ ಅವರು ನೋಡಿ, ಕೇಳಿ, ಗ್ರಹಿಸಿ, ತಿರುಗಿಕೊಳ್ಳಬಹುದು; ಆಗ ದೇವರು ಗುಣಪಡಿಸುವನು
  alternative: ಅವರು ನೋಡದಂತೆ, ಕೇಳದಂತೆ, ಗ್ರಹಿಸದಂತೆ ಮತ್ತು ತಿರುಗದಂತೆ; ನಾನು ಅವರನ್ನು ಗುಣಪಡಿಸದಂತೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ μήποτε ವಾಕ್ಯಘಟಕದ ನಕಾರಾತ್ಮಕ ಉದ್ದೇಶ/ಪರಿಣಾಮದ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸದೆ, ಜನರ ಸಕ್ರಿಯ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಮತ್ತು ದೈವಿಕ ನ್ಯಾಯತೀರ್ಪಿನ ಗಂಭೀರತೆಯನ್ನು ಎರಡನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಅಂಗಾಂಗಗಳ ಪುನರಾವರ್ತನೆ ಮತ್ತು ಕ್ರಮವನ್ನು ಮೂಲದಂತೆ ಉಳಿಸಲಾಗಿದೆ. [a], [b], [c] ಗುರುತುಗಳೆಲ್ಲ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
