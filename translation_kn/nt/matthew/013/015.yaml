review_pass:
  verdict: revise
  source_fidelity: The draft generally preserves the sequence and imagery of the Greek, but «ಇಲ್ಲವಾದರೆ» renders μήποτε as a counterfactual ‘otherwise’ and weakens the negative-purpose/result force. «ನನ್ನ ಕಡೆಗೆ» adds a first-person directional object absent from ἐπιστρέψωσιν. «ಕಷ್ಟಪಟ್ಟು ಕೇಳಿದ್ದಾರೆ» can imply that they made an effort to hear, rather than that their hearing was impaired/heavy.
  naturalness: «ಹೃದಯವು ಮಂದವಾಗಿದೆ» and «ಕಿವಿಗಳಿಂದ ಕೇಳಲು ಅವರಿಗೆ ಕಷ್ಟವಾಗಿದೆ» are clear, idiomatic modern-standard Kannada. The revised negative clause is somewhat formal, appropriately reflecting the elevated prophetic citation while remaining comprehensible.
  terminology: «ಹೃದಯ», «ಗ್ರಹಿಸಿ», «ತಿರುಗಿ», and «ಗುಣಪಡಿಸುವೆನು» appropriately retain the biblical and theological vocabulary without imposing a denominational interpretation. «ತಿರುಗಿ» preserves the source ambiguity between turn and return.
  issues:
  - severity: high
    issue: μήποτε is translated as «ಇಲ್ಲವಾದರೆ».
    rationale: «ಇಲ್ಲವಾದರೆ» means ‘otherwise,’ whereas μήποτε introduces the disputed negative purpose/result clause (‘lest/perhaps lest’). A rendering with «...ದಂತೆ» better preserves the source tension without resolving it.
  - severity: medium
    issue: «ನನ್ನ ಕಡೆಗೆ» is added to ἐπιστρέψωσιν.
    rationale: The Greek says simply ‘turn/return’ and contains no explicit object or directional phrase. The addition narrows the source and should be removed.
  - severity: medium
    issue: «ಕಷ್ಟಪಟ್ಟು ಕೇಳಿದ್ದಾರೆ» may imply strenuous effort.
    rationale: βαρέως ἤκουσαν describes heavy, difficult, or dull hearing, not necessarily an effortful attempt to hear. «ಕೇಳಲು ಅವರಿಗೆ ಕಷ್ಟವಾಗಿದೆ» expresses the impairment without that added implication.
  revised_text: ಏಕೆಂದರೆ ಈ ಜನರ ಹೃದಯವು ಮಂದವಾಗಿದೆ; ಕಿವಿಗಳಿಂದ ಕೇಳಲು ಅವರಿಗೆ ಕಷ್ಟವಾಗಿದೆ[a]; ತಮ್ಮ ಕಣ್ಣುಗಳನ್ನು ಮುಚ್ಚಿದ್ದಾರೆ. ಅವರು ಕಣ್ಣುಗಳಿಂದ ನೋಡಿ, ಕಿವಿಗಳಿಂದ ಕೇಳಿ, ಹೃದಯದಿಂದ ಗ್ರಹಿಸಿ, ತಿರುಗಿ[b][c], ನಾನು ಅವರನ್ನು ಗುಣಪಡಿಸದಂತೆ ಹೀಗಾಗಿದೆ.
