revisions:
- from: ಏಕೆಂದರೆ ಈ ಜನರ ಹೃದಯವು ಜಡವಾಗಿದೆ; ಅವರು ಕಿವಿಗಳಿಂದ ಕಷ್ಟಪಟ್ಟು ಕೇಳಿದ್ದಾರೆ[a]; ತಮ್ಮ ಕಣ್ಣುಗಳನ್ನು ಮುಚ್ಚಿಕೊಂಡಿದ್ದಾರೆ. ಇಲ್ಲವಾದರೆ ಅವರು ಕಣ್ಣುಗಳಿಂದ ಕಂಡು, ಕಿವಿಗಳಿಂದ ಕೇಳಿ, ಹೃದಯದಿಂದ ಗ್ರಹಿಸಿ, ನನ್ನ ಕಡೆಗೆ ತಿರುಗಿಕೊಳ್ಳಬಹುದು[b][c]; ಆಗ ನಾನು ಅವರನ್ನು ಗುಣಪಡಿಸುವೆನು.
  to: ಏಕೆಂದರೆ ಈ ಜನರ ಹೃದಯವು ಮಂದವಾಗಿದೆ; ಕಿವಿಗಳಿಂದ ಕೇಳಲು ಅವರಿಗೆ ಕಷ್ಟವಾಗಿದೆ[a]; ತಮ್ಮ ಕಣ್ಣುಗಳನ್ನು ಮುಚ್ಚಿದ್ದಾರೆ. ಅವರು ಕಣ್ಣುಗಳಿಂದ ನೋಡಿ, ಕಿವಿಗಳಿಂದ ಕೇಳಿ, ಹೃದಯದಿಂದ ಗ್ರಹಿಸಿ, ತಿರುಗಿ[b][c], ನಾನು ಅವರನ್ನು ಗುಣಪಡಿಸದಂತೆ ಹೀಗಾಗಿದೆ.
  rationale: The revision removes the unsupported «ನನ್ನ ಕಡೆಗೆ» and replaces «ಇಲ್ಲವಾದರೆ» with a Kannada negative-purpose construction that more closely represents μήποτε. It also changes the hearing expression to avoid suggesting that the people are trying hard to hear. The final clause is recast as «ನಾನು ಅವರನ್ನು ಗುಣಪಡಿಸದಂತೆ» to keep it within the scope of the μήποτε clause; this preserves the source’s syntactic and theological tension rather than converting it into an affirmative consequence.
  reviewer_model: gpt-5.6-terra
