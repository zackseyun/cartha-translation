id: MAT.13.14
reference: Matthew 13:14
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: kn
  text: 'ಅವರಲ್ಲಿ ಯೆಶಾಯನ ಪ್ರವಾದನೆಯು ನೆರವೇರುತ್ತಿದೆ[a]; ಅದು ಹೀಗೆ ಹೇಳುತ್ತದೆ: “ನೀವು ಕೇಳುತ್ತಲೇ ಇರುವಿರಿ, ಆದರೆ ಖಂಡಿತವಾಗಿಯೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದಿಲ್ಲ; ನೋಡುತ್ತಲೇ ಇರುವಿರಿ, ಆದರೆ ಖಂಡಿತವಾಗಿಯೂ ಗ್ರಹಿಸುವುದಿಲ್ಲ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಕ್ಷರಶಃ, “ಕೇಳಿ ಕೇಳುವಿರಿ ... ಮತ್ತು ನೋಡುತ್ತಾ ನೋಡುವಿರಿ”; ಇದು ಗ್ರೀಕ್‌ನಲ್ಲಿ ವ್ಯಕ್ತವಾದ ಹೀಬ್ರೂ-ಶೈಲಿಯ ಒತ್ತಿನ ಅಭಿವ್ಯಕ್ತಿ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: ನೆರವೇರುತ್ತಿದೆ
  rationale: ವರ್ತಮಾನಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಿ, ಈ ಜನರಲ್ಲಿ ಪ್ರವಾದನೆಯ ಮಾತು ನೆರವೇರುತ್ತಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಸಂಪೂರ್ಣವಾಗಿ ನೆರವೇರುತ್ತಿದೆ’ ಎಂಬ ಹೆಚ್ಚುವರಿ ಒತ್ತನ್ನು ಹೇರಿಲ್ಲ.
- source_word: αὐτοῖς
  choice: ಅವರಲ್ಲಿ
  rationale: ಪ್ರವಾದನೆಯು ಈ ಜನರ ವಿಷಯದಲ್ಲಿ ಸಾಕಾರಗೊಳ್ಳುತ್ತದೆ ಎಂಬ ದತ್ತಿವಿಭಕ್ತಿಯ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἡ προφητεία Ἠσαΐου ἡ λέγουσα
  choice: ಯೆಶಾಯನ ಈ ಪ್ರವಾದನೆಯ ಮಾತು
  rationale: ಉಲ್ಲೇಖವನ್ನು ಪರಿಚಯಿಸುವ ಕೃದಂತರದ ಕಾರ್ಯವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಒಳಗೊಳ್ಳಿಸಿ, ಪ್ರವಾದನೆಯ ಮೂಲವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: Ἀκοῇ ἀκούσετε
  choice: ನೀವು ಕೇಳುತ್ತಲೇ ಇರುವಿರಿ
  rationale: ಗ್ರೀಕ್ ಮೂಲಕ ಬಂದಿರುವ ಹೀಬ್ರೂ ಶೈಲಿಯ ಪುನರುಕ್ತ ಒತ್ತನ್ನು ಅಸಹಜ ಶಬ್ದಶಃ ರೂಪಕ್ಕೆ ಹೋಗದೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οὐ μὴ συνῆτε
  choice: ಆದರೆ ಖಂಡಿತವಾಗಿಯೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದಿಲ್ಲ
  rationale: οὐ μή ಎಂಬ ಬಲವಾದ ನಿರಾಕರಣೆಯನ್ನು ‘ಖಂಡಿತವಾಗಿಯೂ ... ಇಲ್ಲ’ ಎಂದು ಉಳಿಸಿ, ವಿರುದ್ಧತೆಯನ್ನು ಕನ್ನಡದ ‘ಆದರೆ’ ಮೂಲಕ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: βλέποντες βλέψετε
  choice: ನೋಡುತ್ತಲೇ ಇರುವಿರಿ
  rationale: ಮೊದಲ ಸಾಲಿನ ಒತ್ತಿನ ಪುನರುಕ್ತಿಗೆ ಸಮಾಂತರವಾದ ಕನ್ನಡ ರಚನೆಯನ್ನು ನೀಡುತ್ತದೆ.
- source_word: οὐ μὴ ἴδητε
  choice: ಆದರೆ ಖಂಡಿತವಾಗಿಯೂ ಗ್ರಹಿಸುವುದಿಲ್ಲ
  rationale: ಮೊದಲ βλέπωಗೆ ‘ನೋಡು’ ಎಂದಿರುವುದರಿಂದ, ἴδητεಯ ಸಂದರ್ಭೋಚಿತ ಆಂತರಿಕ ಅರಿವು ಅಥವಾ ಗ್ರಹಿಕೆಯನ್ನು ‘ಗ್ರಹಿಸು’ ಎಂದು ತೋರಿಸಿ ಬಲವಾದ ನಿರಾಕರಣೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪ್ರವಾದನೆಯ ನೆರವೇರಿಕೆಯ ಸ್ವರೂಪ
  choice: ಯೆಶಾಯನ ಪ್ರವಾದನೆಯ ಮಾತು ಈ ಜನರಲ್ಲಿ ನೆರವೇರುತ್ತಿದೆ ಎಂದು ಹೇಳುವುದು
  alternative: ಇದು ಅವರಲ್ಲಿ ಕೇವಲ ಉದಾಹರಣೆಯಾಗುತ್ತದೆ ಅಥವಾ ಸಂಪೂರ್ಣವಾಗಿ ಅಂತಿಮಗೊಂಡಿದೆ ಎಂದು ವಿವರಿಸುವುದು
  rationale: ಪಾಠದಲ್ಲಿರುವ ನೆರವೇರಿಕೆಯ ಹೇಳಿಕೆಯನ್ನು ಉಳಿಸುತ್ತದೆಯೇ ಹೊರತು ಕಠಿಣಗೊಳಿಸುವಿಕೆ, ಪೂರ್ವನಿರ್ಧಾರ ಅಥವಾ ಕೇವಲ ಮಾದರಿತನದ ಕುರಿತು ಯಾವುದಾದರೂ ನಿರ್ದಿಷ್ಟ ತಾತ್ತ್ವಿಕ ವ್ಯವಸ್ಥೆಯನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತವಾದರೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಉಲ್ಲೇಖದ ಸಮಾಂತರ ಲಯ ಮತ್ತು ಬಲವಾದ ನಿರಾಕರಣೆಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.
