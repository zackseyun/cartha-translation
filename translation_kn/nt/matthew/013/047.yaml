- from: ಮತ್ತೊಮ್ಮೆ, ಪರಲೋಕರಾಜ್ಯವು ಸಮುದ್ರಕ್ಕೆ ಬೀಸಲ್ಪಟ್ಟು ಎಲ್ಲ ಬಗೆಯವುಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸುವ ದೊಡ್ಡ ಬಲೆಯಂತಿದೆ.[a]
  to: ಮತ್ತೊಮ್ಮೆ, ಸ್ವರ್ಗದ ರಾಜ್ಯವು ಸಮುದ್ರಕ್ಕೆ ಎಸೆಯಲ್ಪಟ್ಟು ಎಲ್ಲ ಬಗೆಯ ಮೀನುಗಳನ್ನು ಕೂಡಿಸುವ ದೊಡ್ಡ ಎಳೆಬಲೆಯಂತಿದೆ.[a]
