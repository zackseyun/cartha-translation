source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: kn
  text: ಮತ್ತೊಮ್ಮೆ, ಸ್ವರ್ಗದ ರಾಜ್ಯವು ಸಮುದ್ರಕ್ಕೆ ಎಸೆಯಲ್ಪಟ್ಟು ಎಲ್ಲ ಬಗೆಯ ಮೀನುಗಳನ್ನು ಕೂಡಿಸುವ ದೊಡ್ಡ ಎಳೆಬಲೆಯಂತಿದೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ, ‘ಎಲ್ಲ ಬಗೆಯಿಂದ [ಸಂಗ್ರಹಿಸುವ]’ ಎಂದಿದೆ; ‘ಮೀನುಗಳನ್ನು’ ಎಂಬುದು ಮೀನುಗಾರಿಕೆಯ ಚಿತ್ರಣದಿಂದ ಸೂಚಿತವಾಗಿದೆ. «ಎಳೆಬಲೆ» ಎಂಬುದಕ್ಕೆ ಬಳಸಿರುವ ಗ್ರೀಕ್ ಪದವು ನೀರಿನಲ್ಲಿ ಎಳೆದುಕೊಂಡು ಹೋಗುವ ದೊಡ್ಡ ಬಲೆಯನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: ಮತ್ತೊಮ್ಮೆ
  rationale: ಸರಣಿಯಲ್ಲಿನ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಪರಿಚಯಿಸುವ ಕ್ರಿಯಾವಿಶೇಷಣ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಸಂಕ್ಷಿಪ್ತವೂ ಆಗಿದೆ.
- source_word: ὁμοία ἐστὶν
  choice: ಬಲೆಯಂತಿದೆ
  rationale: ಗ್ರೀಕ್‌ನ ಹೋಲಿಕೆಯ ಸೂತ್ರವನ್ನು ಕನ್ನಡದ ಸಹಜ ‘-ಅಂತಿದೆ’ ರಚನೆಯ ಮೂಲಕ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯವು
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗವನ್ನು ‘ದೇವರ ರಾಜ್ಯ’ ಎಂದು ಬದಲಿಸದೆ, ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: σαγήνῃ
  choice: ದೊಡ್ಡ ಬಲೆ
  rationale: ಇದು ಸಾಮಾನ್ಯ ಬಲೆಗಿಂತ ದೊಡ್ಡದಾಗಿ ಎಳೆದು ಹಿಡಿಯುವ ಬಲೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ತಾಂತ್ರಿಕವಾಗಿ ಅಪರಿಚಿತ ಪದ ಬಳಸದೆ ಅದರ ಮುಖ್ಯ ಲಕ್ಷಣವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: ಸಮುದ್ರಕ್ಕೆ ಬೀಸಲ್ಪಟ್ಟು
  rationale: ನಿಷ್ಕ್ರಿಯ ಕೃದಂತರೂಪವನ್ನೂ ‘ಸಮುದ್ರ’ ಎಂಬ ಮೂಲಪದವನ್ನೂ ಉಳಿಸಿ, ಬಲೆ ಹಾಕುವ ಕ್ರಿಯೆಗೆ ಸಹಜವಾದ ‘ಬೀಸು’ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: ಎಲ್ಲ ಬಗೆಯವುಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸುವ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಮೀನು’ ಸ್ಪಷ್ಟವಾಗಿ ಇಲ್ಲದ ಕಾರಣ ಅದನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಿಲ್ಲ; ಸಂದರ್ಭದಿಂದ ಅರ್ಥವಾಗುವ ವಸ್ತುಗಳನ್ನು ಸೂಚಿಸಲು ಕನ್ನಡದ ನಪುಂಸಕ ಬಹುವಚನವನ್ನು ಬಳಸಲಾಗಿದೆ.
theological_decisions:
- issue: ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ಪದಗುಚ್ಛದ ಅರ್ಥ
  choice: ಮತ್ತಾಯನ ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ವಿಶಿಷ್ಟ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ದೇವರ ರಾಜ್ಯ’ ಅಥವಾ ‘ಪರಲೋಕದ ಆಳ್ವಿಕೆ’
  rationale: ಮೂಲದಲ್ಲಿರುವ ಮತ್ತಾಯನ ಪದಪ್ರಯೋಗವನ್ನು ಬದಲಿಸದೆ ಉಳಿಸುವುದರಿಂದ ಯಾವುದೇ ನಿರ್ದಿಷ್ಟ ತಾತ್ತ್ವಿಕ ವ್ಯಾಖ್ಯಾನವನ್ನು ಪಠ್ಯಕ್ಕೆ ಹೇರಲಾಗುವುದಿಲ್ಲ.
- issue: ἐκ παντὸς γένους ಎಂಬಲ್ಲಿ ಸೂಚಿತ ವಸ್ತು
  choice: ‘ಎಲ್ಲ ಬಗೆಯವುಗಳನ್ನು’ ಎಂದು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಎಲ್ಲ ಬಗೆಯ ಮೀನುಗಳನ್ನು’
  rationale: ಮೀನುಗಳು ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿತವಾದರೂ ಮೂಲ ಗ್ರೀಕ್‌ನಲ್ಲಿ ನಾಮಪದ ವ್ಯಕ್ತವಾಗಿಲ್ಲ; ಆದ್ದರಿಂದ ಅದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಹಾಗೂ ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸಿ, ಅಪರಿಚಿತ ತಾಂತ್ರಿಕ ಮೀನುಗಾರಿಕಾ ಪದದ ಬದಲು ‘ದೊಡ್ಡ ಬಲೆ’ ಬಳಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
