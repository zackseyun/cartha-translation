review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence, Jesus' departure from the crowds, entry into the house, the disciples' approach, and their request. However, «ಸಾಮ್ಯ» is less precise and less natural in modern standard Kannada for παραβολή than «ಉಪಮೆ». Removing the added «ಅರ್ಥವನ್ನು» stays closer to the imperative «Διασάφησον» (“explain/make clear”) without narrowing the requested explanation to an abstract meaning.
  naturalness: The narrative is fluent and respectful. «ಉಪಮೆಯನ್ನು ನಮಗೆ ವಿವರಿಸಿರಿ» is a more idiomatic and immediately clear modern Kannada request than «ಸಾಮ್ಯದ ಅರ್ಥವನ್ನು ನಮಗೆ ವಿವರಿಸಿರಿ».
  terminology: Use «ಉಪಮೆ» consistently for παραβολή. Retain «ಕಳೆಗಳು» for ζιζάνια, with a footnote preserving both the traditional ‘tares’ alternative and the possible specific reference to darnel. The footnote marker should be attached directly to «ಕಳೆಗಳು», the word it qualifies.
  issues:
  - severity: medium
    issue: «ಸಾಮ್ಯ» for παραβολή
    rationale: Although understandable in some Bible-register usage, «ಸಾಮ್ಯ» commonly denotes resemblance/equality and is less clear in modern standard Kannada. «ಉಪಮೆ» is the natural, established term for a parable.
  - severity: low
    issue: Added «ಅರ್ಥವನ್ನು»
    rationale: The Greek asks Jesus to explain the parable, not specifically its ‘meaning.’ Kannada does not require this added object; omitting it preserves the breadth of the request.
  - severity: low
    issue: Footnote anchor placement
    rationale: The lexical note concerns ζιζάνια (‘weeds’), so its marker should immediately follow «ಕಳೆಗಳು» rather than the closing quotation/sentence.
