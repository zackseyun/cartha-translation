revisions:
- from: ಆಗ ಜನಸಮೂಹಗಳನ್ನು ಬಿಟ್ಟು ಅವರು ಮನೆಯೊಳಗೆ ಹೋದರು. ಅವರ ಶಿಷ್ಯರು ಅವರ ಬಳಿಗೆ ಬಂದು, “ಹೊಲದ ಕಳೆಗಳ ಸಾಮ್ಯದ ಅರ್ಥವನ್ನು ನಮಗೆ ವಿವರಿಸಿರಿ” ಎಂದು ಕೇಳಿದರು.[a]
  to: ಆಗ ಜನಸಮೂಹಗಳನ್ನು ಬಿಟ್ಟು ಅವರು ಮನೆಯೊಳಗೆ ಹೋದರು. ಅವರ ಶಿಷ್ಯರು ಅವರ ಬಳಿಗೆ ಬಂದು, “ಹೊಲದ ಕಳೆಗಳ[a] ಉಪಮೆಯನ್ನು ನಮಗೆ ವಿವರಿಸಿರಿ” ಎಂದು ಕೇಳಿದರು.
  rationale: The revision uses the clear modern Kannada term «ಉಪಮೆ» for παραβολή, avoids adding ‘meaning’ where the source simply requests an explanation, and moves the lexical-note anchor to the translated term for ζιζάνια. The respectful plural address to Jesus and the source sequence are retained.
