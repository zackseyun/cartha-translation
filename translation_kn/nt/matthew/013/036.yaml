id: MAT.13.36
reference: Matthew 13:36
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: kn
  text: ಆಗ ಜನಸಮೂಹಗಳನ್ನು ಬಿಟ್ಟು ಅವರು ಮನೆಯೊಳಗೆ ಹೋದರು. ಅವರ ಶಿಷ್ಯರು ಅವರ ಬಳಿಗೆ ಬಂದು, “ಹೊಲದ ಕಳೆಗಳ[a] ಉಪಮೆಯನ್ನು ನಮಗೆ ವಿವರಿಸಿರಿ” ಎಂದು ಕೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಹೊಲದ ವಿಷಕಳೆಗಳ ಉಪಮೆ”; ಗ್ರೀಕ್ ಪದವು ಗೋಧಿಯಂತೆಯೇ ಕಾಣುವ ಡಾರ್ನೆಲ್ ಎಂಬ ನಿರ್ದಿಷ್ಟ ಕಳೆಯನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಮುಂದಿನ ಘಟನೆಯನ್ನು ಕಾಲಾನುಕ್ರಮವಾಗಿ ಪರಿಚಯಿಸುವ ಸಹಜ ಕನ್ನಡ ನಿರೂಪಣಾ ಸೂಚಕ.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: ಜನಸಮೂಹಗಳನ್ನು ಬಿಟ್ಟು
  rationale: ಪೂರ್ವಕಾಲಿಕ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತಾ, ಬಹುವಚನ ὄχλους ಅನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: ಮನೆಯೊಳಗೆ ಹೋದರು
  rationale: ಹೊರಗಿನ ಸ್ಥಳದಿಂದ ನಿರ್ದಿಷ್ಟ ಮನೆಗೆ ಪ್ರವೇಶಿಸಿದ ಚಲನೆಯನ್ನು ನಿರೂಪಣೆಯ ದೃಷ್ಟಿಕೋನಕ್ಕೆ ತಕ್ಕಂತೆ ತಿಳಿಸುತ್ತದೆ.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: ಅವರ ಶಿಷ್ಯರು ಅವರ ಬಳಿಗೆ ಬಂದು
  rationale: προσέρχομαιಯ ಸಮೀಪಿಸುವ ಅರ್ಥವನ್ನೂ ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λέγοντες
  choice: ಎಂದು ಕೇಳಿದರು
  rationale: ಪದಶಃ ‘ಹೇಳುತ್ತಾ’ ಎಂಬುದಕ್ಕಿಂತ, ಆಜ್ಞಾರೂಪದಲ್ಲಿರುವ ವಿನಂತಿಯನ್ನು ಕನ್ನಡ ಸಂಭಾಷಣೆಯಲ್ಲಿ ಸಹಜವಾಗಿ ನಿರೂಪಿಸುತ್ತದೆ.
- source_word: Διασάφησον ἡμῖν
  choice: ಅರ್ಥವನ್ನು ನಮಗೆ ವಿವರಿಸಿರಿ
  rationale: διασαφέωಯ ‘ಸ್ಪಷ್ಟಪಡಿಸು/ವಿವರಿಸು’ ಎಂಬ ಅರ್ಥವನ್ನು ಗೌರವಪೂರ್ಣ ವಿನಂತಿಯಾಗಿ ನೀಡುತ್ತದೆ; ‘ಅರ್ಥವನ್ನು’ ಎಂಬುದು ಕನ್ನಡದಲ್ಲಿ ಅಗತ್ಯವಾದ ಸಹಜ ಪೂರಕ.
- source_word: τὴν παραβολὴν
  choice: ಸಾಮ್ಯ
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿನ παραβολήಗೆ ಕನ್ನಡ ಬೈಬಲ್ ಭಾಷೆಯಲ್ಲಿ ಪರಿಚಿತವೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವೂ ಆದ ಪದ.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: ಹೊಲದ ಕಳೆಗಳ
  rationale: ಗ್ರೀಕ್‌ನ ಸರಣಿ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಸಂಬಂಧವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ; ζιζάνιαಯ ಸಸ್ಯವಿಶೇಷದ ಸಾಧ್ಯತೆಯನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
