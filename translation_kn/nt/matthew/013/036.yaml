translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ನಿರೂಪಣೆ. ಯೇಸುವಿಗೆ ಗೌರವ ಸೂಚಿಸಲು ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಮತ್ತು ಸರ್ವನಾಮ ಬಳಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿರುವ ‘ಸಾಮ್ಯವನ್ನು ವಿವರಿಸಿರಿ’ ಎಂಬ ಸಂಕ್ಷಿಪ್ತ ವಿನಂತಿ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಲು ‘ಸಾಮ್ಯದ ಅರ್ಥವನ್ನು ... ವಿವರಿಸಿರಿ’ ಎಂದು ರೂಪಿಸಲಾಗಿದೆ.
