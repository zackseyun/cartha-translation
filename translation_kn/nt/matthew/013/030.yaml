id: MAT.13.30
reference: Matthew 13:30
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: kn
  text: ಎರಡನ್ನೂ ಸುಗ್ಗಿಯವರೆಗೆ ಒಟ್ಟಿಗೆ ಬೆಳೆಯಲು ಬಿಡಿ. ಸುಗ್ಗಿಯ ಸಮಯದಲ್ಲಿ ನಾನು ಕೊಯ್ಯುವವರಿಗೆ, ‘ಮೊದಲು ಕಳೆಗಳನ್ನು[a] ಕೂಡಿಸಿ, ಅವುಗಳನ್ನು ಸುಡುವುದಕ್ಕಾಗಿ ಕಟ್ಟುಗಳಾಗಿ ಕಟ್ಟಿ; ಆದರೆ ಗೋಧಿಯನ್ನು ನನ್ನ ಕಣಜಕ್ಕೆ ಸೇರಿಸಿ’ ಎಂದು ಹೇಳುವೆನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಡಾರ್ನೆಲ್ ಕಳೆಗಳನ್ನು’; ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ‘ಟೇರ್ಸ್’ ಎಂದು ಕರೆಯಲಾಗಿದೆ.
    reason: ζιζάνια ಎಂಬ ಪದವು ಸಾಮಾನ್ಯವಾಗಿ ಗೋಧಿಯಂತೆಯೇ ಕಾಣುವ ಡಾರ್ನೆಲ್ ಕಳೆಯನ್ನು ಸೂಚಿಸಬಹುದು; ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸುಲಭವಾದ ‘ಕಳೆಗಳು’ ಎಂಬ ಪದವನ್ನು ಇಟ್ಟು, ನಿರ್ದಿಷ್ಟ ಪರ್ಯಾಯವನ್ನು ಇಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
lexical_decisions:
- source_word: ἄφετε
  choice: ಬಿಡಿ
  rationale: ಇಲ್ಲಿ ἀφίημι ಅನುಮತಿಸುವ ಆಜ್ಞೆಯ ಅರ್ಥದಲ್ಲಿದೆ; ‘ಬೆಳೆಯಲು ಬಿಡಿ’ ಎಂಬುದು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: ಎರಡನ್ನೂ ... ಒಟ್ಟಿಗೆ ಬೆಳೆಯಲು
  rationale: συν- ಎಂಬ ಒಟ್ಟಿಗೆ ಎಂಬ ಅಂಶವನ್ನೂ, ἀμφότερα ಎಂಬ ‘ಎರಡೂ’ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: ಸುಗ್ಗಿಯವರೆಗೆ
  rationale: ನಿರ್ದಿಷ್ಟವಾದ ಕೊಯ್ಲಿನ ಘಟನೆಯನ್ನು ಸಹಜ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: ಸುಗ್ಗಿಯ ಸಮಯದಲ್ಲಿ
  rationale: καιρός ಸೂಚಿಸುವ ಸೂಕ್ತ ಅಥವಾ ನಿಗದಿತ ಸಮಯದ ಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: θερισταῖς
  choice: ಕೊಯ್ಯುವವರಿಗೆ
  rationale: ಕೃಷಿ ಸನ್ನಿವೇಶದಲ್ಲಿನ ಕೆಲಸಗಾರರನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: Συλλέξατε πρῶτον τὰ ζιζάνια
  choice: ಮೊದಲು ಕಳೆಗಳನ್ನು ಕೂಡಿಸಿ
  rationale: ಕ್ರಿಯೆಗಳ ಕ್ರಮವನ್ನು ಉಳಿಸಿ, ζιζάνιαಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ‘ಕಳೆಗಳು’ ಎಂಬ ಪದವನ್ನು ಬಳಸುತ್ತದೆ; ಅದರ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ಗುರುತನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: ಅವುಗಳನ್ನು ... ಕಟ್ಟುಗಳಾಗಿ ಕಟ್ಟಿ
  rationale: εἰς ಸೂಚಿಸುವ ಫಲಿತಾಂಶವನ್ನೂ δήσατε ಎಂಬ ಕಟ್ಟುವ ಕ್ರಿಯೆಯನ್ನೂ ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: ಅವುಗಳನ್ನು ಸುಡುವುದಕ್ಕಾಗಿ
  rationale: ಈ ರಚನೆಯ ಉದ್ದೇಶಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ನಂತರದ ವಿವರಣೆಯನ್ನು ಮುಂಚಿತವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: ಆದರೆ ಗೋಧಿಯನ್ನು ನನ್ನ ಕಣಜಕ್ಕೆ ಸೇರಿಸಿ
  rationale: δὲಯ ವಿರೋಧಾತ್ಮಕ ತಿರುವನ್ನೂ, ಧಾನ್ಯವನ್ನು ಸಂಗ್ರಹಿಸುವ ಸ್ಥಳವಾದ ἀποθήκηಯ ಕೃಷಿ ಚಿತ್ರಣವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಅಂತಿಮ ಬೇರ್ಪಡಿಸುವಿಕೆಯ ಸಾಮ್ಯಚಿತ್ರ
  choice: ಕೃಷಿಯ ಚಿತ್ರಣವನ್ನು ಮಾತ್ರ ಉಳಿಸಿ, ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪಿನ ವಿವರಣೆಯನ್ನು ಈ ವಾಕ್ಯದಲ್ಲೇ ಸ್ಪಷ್ಟವಾಗಿ ಸೇರಿಸಿಲ್ಲ.
  alternative: ‘ನಾಶಪಡಿಸಲು’ ಅಥವಾ ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುವ ಪದಗಳನ್ನು ಬಳಸುವುದು.
  rationale: ಸಾಮ್ಯದ ಅರ್ಥವಿವರಣೆ ಅಧ್ಯಾಯದ ಮುಂದಿನ ಭಾಗದಲ್ಲಿ ಬರುತ್ತದೆ. ಆದ್ದರಿಂದ ಯೇಸು ಇಲ್ಲಿ ಹೇಳಿದ ಕೃಷಿಯ ಚಿತ್ರಣ ಮತ್ತು ಅದರಲ್ಲಿರುವ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ನೇರಮಾತಿನ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಸುಗ್ಗಿ’, ‘ಕೊಯ್ಯುವವರು’, ‘ಕಣಜ’ ಎಂಬ ಪರಿಚಿತ ಕೃಷಿಪದಗಳು ಸಾಮ್ಯದ ಮೂಲ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತವೆ.
