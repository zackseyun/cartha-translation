reference: Matthew 13:53
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: kn
  text: ಯೇಸು ಈ ಸಾಮ್ಯಗಳನ್ನು ಹೇಳಿ ಮುಗಿಸಿದಾಗ[a], ಅಲ್ಲಿಂದ ಹೊರಟುಹೋದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಇನ್ನಷ್ಟು ಅಕ್ಷರಶಃ: “ಮತ್ತು ಹೀಗಾಯಿತು: ಯೇಸು ಈ ಸಾಮ್ಯಗಳನ್ನು ಮುಗಿಸಿದಾಗ, ಅವನು ಅಲ್ಲಿಂದ ಹೊರಟುಹೋದನು.”'
    reason: ಮೂಲದಲ್ಲಿರುವ καὶ ἐγένετο ಎಂಬ ಕಥನ ಸೂತ್ರದ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ರೂಪವನ್ನು ದಾಖಲಿಸಲು.
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: ಮುಗಿಸಿದಾಗ
  rationale: καὶ ἐγένετο ಎಂಬುದು ಇಲ್ಲಿ ಕಥನದ ಸಂಕ್ರಮಣ ಸೂತ್ರವಾಗಿದ್ದು, ὅτε ಜೊತೆಗೂಡಿ ಕಾಲಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಹೀಗಾಯಿತು’ ಎಂದು ಹೇಳದೆ ‘-ಆಗ’ ರೂಪದಲ್ಲಿ ನೀಡುವುದು ಸಹಜವಾಗಿದ್ದು ಮೂಲದ ಕಾಲಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἐτέλεσεν
  choice: ಹೇಳಿ ಮುಗಿಸಿದ
  rationale: τελέω ಎಂದರೆ ಪೂರ್ಣಗೊಳಿಸುವುದು ಅಥವಾ ಅಂತ್ಯಕ್ಕೆ ತರುವುದು. ಸಾಮ್ಯಗಳ ಕುರಿತು ಕನ್ನಡದಲ್ಲಿ ‘ಹೇಳಿ ಮುಗಿಸಿದ’ ಎಂಬುದು ಸಹಜವಾಗಿದ್ದು, ಅವುಗಳನ್ನು ಬೋಧಿಸುವ ಕ್ರಿಯೆ ಪೂರ್ಣಗೊಂಡಿತೆಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: παραβολὰς ταύτας
  choice: ಈ ಸಾಮ್ಯಗಳನ್ನು
  rationale: παραβολήಗೆ ಸುವಾರ್ತೆಗಳ ಬೋಧನಾ ಸನ್ನಿವೇಶದಲ್ಲಿ ಸ್ಥಿರವಾದ ಕನ್ನಡ ಪದ ‘ಸಾಮ್ಯ’; ταύτας ಹಿಂದಿನ ಭಾಗದಲ್ಲಿ ಹೇಳಿದ ನಿರ್ದಿಷ್ಟ ಸಾಮ್ಯಗಳನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಈ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: μετῆρεν
  choice: ಹೊರಟುಹೋದನು
  rationale: μεταίρω ಒಂದು ಸ್ಥಳದಿಂದ ತೆರಳುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಹೊರಟುಹೋದನು’ ಆ ಸ್ಥಳವನ್ನು ಬಿಟ್ಟು ಮುಂದಕ್ಕೆ ಹೋದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ; ಪ್ರಯಾಣದ ವಿಧಾನವನ್ನು ಅನಗತ್ಯವಾಗಿ ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: ἐκεῖθεν
  choice: ಅಲ್ಲಿಂದ
  rationale: ἐκεῖθεν ಎಂದರೆ ‘ಆ ಸ್ಥಳದಿಂದ’. ‘ಅಲ್ಲಿಂದ’ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆಗಿದ್ದು ಸ್ಥಳದ ಮೂಲಬಿಂದುವನ್ನು ನಿಖರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
