translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಸಾಮ್ಯ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಮೂಲದ ಕಥನ ಸೂತ್ರವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಕನ್ನಡದ ಸಹಜ ಕಾಲವಾಕ್ಯವಾಗಿ ರೂಪಿಸಿ, ಅದರ ಅಕ್ಷರಶಃ ಸ್ವರೂಪವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
