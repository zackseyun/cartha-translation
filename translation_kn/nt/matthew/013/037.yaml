id: MAT.13.37
reference: Matthew 13:37
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Ὁ σπείρων τὸ καλὸν σπέρμα ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: kn
  text: 'ಆತನು ಉತ್ತರಿಸಿ ಹೇಳಿದನು: “ಒಳ್ಳೆಯ ಬೀಜವನ್ನು ಬಿತ್ತುವವನು ಮನುಷ್ಯಕುಮಾರನು.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಮಾನವನು.” “ಮನುಷ್ಯಕುಮಾರನು” ಎಂಬ ಗ್ರೀಕ್ ಬಿರುದು ದಾನಿಯೇಲ 7ರ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಹೊಂದಿದೆ; ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಅದರ ಸ್ಥಿರ ಬಳಕೆ ಮತ್ತು ದೇವತಾಶಾಸ್ತ್ರೀಯ ಮಹತ್ವದ ಕಾರಣ ಇಲ್ಲಿ ಅದನ್ನು ಉಳಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ಉತ್ತರವಾಗಿ ಹೇಳಿದ್ದು
  rationale: ಗ್ರೀಕ್‌ನ ಕೃದಂತ ಮತ್ತು ಮುಖ್ಯ ಕ್ರಿಯಾಪದವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಒಂದೇ ಮಾತಿನ ಪರಿಚಯವಾಗಿ ನೀಡುತ್ತದೆ; ಉತ್ತರದ ಸಂವಾದಾತ್ಮಕ ಕಾರ್ಯವನ್ನೂ ‘ಹೇಳಿದನು’ ಎಂಬ ಮುಖ್ಯ ಕ್ರಿಯೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: Ὁ σπείρων
  choice: ಬಿತ್ತುವವನು
  rationale: ನಾಮರೂಪದಲ್ಲಿ ಬಳಕೆಯಾದ ವರ್ತಮಾನ ಕೃದಂತವು ವ್ಯಕ್ತಿಯನ್ನು ಅವನ ಕ್ರಿಯೆಯಿಂದ ಗುರುತಿಸುತ್ತದೆ; ‘ಬಿತ್ತುವವನು’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಅದರ ಸಾಮಾನ್ಯ/ನಿರಂತರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: τὸ καλὸν σπέρμα
  choice: ಒಳ್ಳೆಯ ಬೀಜವನ್ನು
  rationale: καλός ಇಲ್ಲಿ ಸುಂದರವೆಂಬುದಕ್ಕಿಂತ ಒಳ್ಳೆಯದು ಅಥವಾ ಯೋಗ್ಯವಾದದ್ದು ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ. ಏಕವಚನ ‘ಬೀಜ’ವನ್ನು ಸಾಮೂಹಿಕ ಅರ್ಥದಲ್ಲೇ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಯೇಸುವಿನ ಸ್ಥಿರ ಬಿರುದಾಗಿ ಬಳಕೆಯಾಗುವ ರೂಪ; ದಾನಿಯೇಲ 7ರ ಪ್ರತಿಧ್ವನಿ ಮತ್ತು ಕ್ರಿಸ್ತಸಂಬಂಧಿ ತೂಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου ಎಂಬ ಕ್ರಿಸ್ತಸಂಬಂಧಿ ಬಿರುದಿನ ಅನುವಾದ
  choice: ಮನುಷ್ಯಕುಮಾರನು
  alternative: ಮಾನವನು / ಮಾನವಪುತ್ರನು
  rationale: ಇದು ಕೇವಲ ಒಬ್ಬ ಮಾನವನ ಸಾಮಾನ್ಯ ಉಲ್ಲೇಖವಲ್ಲ; ಸುವಾರ್ತೆಗಳಲ್ಲಿನ ಸ್ಥಿರ ಸ್ವನಿರ್ದೇಶನವಾಗಿದ್ದು ದಾನಿಯೇಲ 7ರ ಅಪೋಕಲಿಪ್ಟಿಕ ಮತ್ತು ಮೆಸ್ಸೀಯ ಸಂಬಂಧಿ ಪ್ರತಿಧ್ವನಿಗಳನ್ನು ಹೊಂದಿದೆ. ಪರಿಚಿತವಾದ ‘ಮನುಷ್ಯಕುಮಾರನು’ ಅವುಗಳನ್ನು ಸಮತಟ್ಟಾಗಿಸದೆ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ ಮತ್ತು ಗೌರವಯುತ ಶೈಲಿ. ಗ್ರೀಕ್‌ನ ‘ಉತ್ತರಿಸಿ ಹೇಳಿದನು’ ಎಂಬ ಕನ್ನಡದಲ್ಲಿ ಸ್ವಲ್ಪ ಪುನರುಕ್ತಿಯಾಗಬಹುದಾದ ರಚನೆಯನ್ನು ‘ಉತ್ತರವಾಗಿ ಹೇಳಿದ್ದು’ ಎಂದು ಸಹಜಗೊಳಿಸಲಾಗಿದೆ. ಬಿರುದನ್ನು ಸಾಂಪ್ರದಾಯಿಕವಾದರೂ ಇನ್ನೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ‘ಮನುಷ್ಯಕುಮಾರನು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
