- from: 'ಅದಕ್ಕೆ ಆತನು ಉತ್ತರವಾಗಿ ಹೇಳಿದ್ದು: “ಒಳ್ಳೆಯ ಬೀಜವನ್ನು ಬಿತ್ತುವವನು ಮನುಷ್ಯಕುಮಾರನು.[a]”'
  to: 'ಆತನು ಉತ್ತರಿಸಿ ಹೇಳಿದನು: “ಒಳ್ಳೆಯ ಬೀಜವನ್ನು ಬಿತ್ತುವವನು ಮನುಷ್ಯಕುಮಾರನು.[a]”'
  rationale: The revision removes an unsupported discourse object, supplies the correct natural finite verb, and retains the Greek response-and-speech construction in idiomatic Kannada. It also aligns the footnote’s alternative with the documented ‘Human One’ alternative without weakening the main rendering’s established titular force.
