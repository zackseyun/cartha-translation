    text: ಅಥವಾ, “ತೀರದ ಮೇಲೆ ನಿಂತಿತ್ತು.”
    reason: αἰγιαλός ಪದಕ್ಕೆ ‘ದಡ’ ಮತ್ತು ‘ತೀರ’ ಎರಡೂ ಸಹಜವಾದ ಅರ್ಥಗಳಾಗಿವೆ.
  revision_rationale: The revision preserves the plural crowds followed by the collective singular crowd, makes the ὥστε result construction explicit in idiomatic Kannada, and retains the boat, sitting, and shore imagery without adding interpretation.
