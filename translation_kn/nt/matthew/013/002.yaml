revisions:
- from: ಬಹಳ ಜನರ ಗುಂಪುಗಳು ಅವರ ಬಳಿಗೆ ಸೇರಿಬಂದವು. ಆದ್ದರಿಂದ ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತಿ ಕುಳಿತುಕೊಂಡರು; ಜನರೆಲ್ಲರೂ ದಡದ ಮೇಲೆ ನಿಂತಿದ್ದರು.[a]
  to: ಅನೇಕ ಜನರ ಗುಂಪುಗಳು ಅವರ ಬಳಿಗೆ ಕೂಡಿಬಂದವು; ಎಷ್ಟೆಂದರೆ, ಅವರು ದೋಣಿಯೊಂದನ್ನು ಹತ್ತಿ ಕುಳಿತುಕೊಂಡರು, ಮತ್ತು ಇಡೀ ಜನಸಮೂಹವು ದಡದ ಮೇಲೆ ನಿಂತಿತ್ತು.[a]
