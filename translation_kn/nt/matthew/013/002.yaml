id: MAT.13.2
reference: Matthew 13:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: kn
  text: ಅನೇಕ ಜನರ ಗುಂಪುಗಳು ಅವರ ಬಳಿಗೆ ಕೂಡಿಬಂದವು; ಎಷ್ಟೆಂದರೆ, ಅವರು ದೋಣಿಯೊಂದನ್ನು ಹತ್ತಿ ಕುಳಿತುಕೊಂಡರು, ಮತ್ತು ಇಡೀ ಜನಸಮೂಹವು ದಡದ ಮೇಲೆ ನಿಂತಿತ್ತು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ತೀರದ ಮೇಲೆ ನಿಂತಿತ್ತು.”
    reason: αἰγιαλός ಪದಕ್ಕೆ ‘ದಡ’ ಮತ್ತು ‘ತೀರ’ ಎರಡೂ ಸಹಜವಾದ ಅರ್ಥಗಳಾಗಿವೆ.
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: ಅವರ ಬಳಿಗೆ ಸೇರಿಬಂದವು
  rationale: ಪ್ರತ್ಯಯಸಹಿತ ಕ್ರಿಯಾಪದವು ಯೇಸುವಿನ ಕಡೆಗೆ ಜನರು ಒಟ್ಟುಗೂಡಿದುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸೇರಿಬಂದವು’ ಎಂಬುದು ಚಲನೆ ಮತ್ತು ಒಟ್ಟುಗೂಡುವಿಕೆ ಎರಡನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὄχλοι πολλοί
  choice: ಬಹಳ ಜನರ ಗುಂಪುಗಳು
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಉಳಿಸಿಕೊಂಡು ಅನೇಕ ಗುಂಪುಗಳು ಸೇರಿದ್ದವು ಎಂಬ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ದೊಡ್ಡ ಜನಸಮೂಹ’ ಎಂದರೆ ಸಂಖ್ಯೆಯ ಬಹುವಚನ ಸೂಕ್ಷ್ಮತೆ ಕಳೆದುಹೋಗಬಹುದು.
- source_word: ὥστε
  choice: ಆದ್ದರಿಂದ
  rationale: ಇದು ಫಲಿತಾಂಶವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಹಿಂದಿನ ಜನಸಂದಣಿಯ ಪರಿಣಾಮವಾಗಿ ಯೇಸು ದೋಣಿಗೆ ಹತ್ತಿದರೆಂಬ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತೋರಿಸುತ್ತದೆ.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: ಅವರು ದೋಣಿಯನ್ನು ಹತ್ತಿ ಕುಳಿತುಕೊಂಡರು
  rationale: 'ಗ್ರೀಕ್ ಕೃದಂತರಚನೆಯ ಕ್ರಮವನ್ನು ಸಹಜ ಕನ್ನಡದ ಸಂಯುಕ್ತ ಕ್ರಿಯಾರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ: ಮೊದಲು ದೋಣಿಗೆ ಹತ್ತುವುದು, ನಂತರ ಕುಳಿತುಕೊಳ್ಳುವುದು.'
- source_word: πᾶς ὁ ὄχλος
  choice: ಜನರೆಲ್ಲರೂ
  rationale: ಹಿಂದಿನ ಬಹುವಚನ ಗುಂಪುಗಳನ್ನು ಇಲ್ಲಿ ಒಟ್ಟಾರೆ ಜನಸಮೂಹವಾಗಿ ಸೂಚಿಸುವ ಏಕವಚನ ಸಮೂಹಾರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: ದಡದ ಮೇಲೆ
  rationale: αἰγιαλός ಎಂಬುದು ನೀರಿನ ಅಂಚಿನ ದಡ ಅಥವಾ ತೀರವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದಡ’ ಸರೋವರದ ಸನ್ನಿವೇಶಕ್ಕೆ ಸಹಜ ಮತ್ತು ತಟಸ್ಥ ಪದವಾಗಿದೆ.
- source_word: εἱστήκει
  choice: ನಿಂತಿದ್ದರು
  rationale: ಗ್ರೀಕ್ ರೂಪವು ಆಗಲೇ ನಿಂತಿದ್ದ ಸ್ಥಿತಿಯನ್ನು ಚಿತ್ರಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ನಿಂತಿದ್ದರು’ ಆ ದೃಶ್ಯಾತ್ಮಕ, ಮುಂದುವರಿದ ಸ್ಥಿತಿಯನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಪೂರ್ಣ ಬಹುವಚನವನ್ನು ಬಳಸಿ ಯೇಸುವನ್ನು ಸೂಚಿಸಲಾಗಿದೆ. ವಾಕ್ಯವು ಮೂಲದ ದೃಶ್ಯಕ್ರಮ ಮತ್ತು ಜನರ ಬಹುವಚನದಿಂದ ಒಟ್ಟಾರೆ ಸಮೂಹಕ್ಕೆ ಆಗುವ ಬದಲಾವಣೆಯನ್ನು ಉಳಿಸಿಕೊಂಡಿದೆ.
