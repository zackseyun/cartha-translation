id: MAT.13.51
reference: Matthew 13:51
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: kn
  text: “ನೀವು ಈ ಎಲ್ಲವನ್ನೂ ಅರ್ಥಮಾಡಿಕೊಂಡಿರಾ?” ಎಂದು ಯೇಸು ಅವರನ್ನು ಕೇಳಿದರು. ಶಿಷ್ಯರು ಯೇಸುವಿಗೆ, “ಹೌದು” ಎಂದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಈ ಎಲ್ಲವೂ ನಿಮಗೆ ಅರ್ಥವಾಗುತ್ತಿದೆಯೇ?”
    reason: Συνήκατε ಎಂಬ aorist ರೂಪವನ್ನು ಸಂದರ್ಭಾನುಸಾರ ಪ್ರಸ್ತುತ ಗ್ರಹಿಕೆಯನ್ನು ವಿಚಾರಿಸುವ ಸಹಜ ಕನ್ನಡ ಪ್ರಶ್ನೆಯಾಗಿಯೂ ಅನುವಾದಿಸಬಹುದು.
lexical_decisions:
- source_word: Συνήκατε
  choice: ಅರ್ಥಮಾಡಿಕೊಂಡಿರಾ
  rationale: ಪ್ರಶ್ನೆಯಲ್ಲಿರುವ aorist indicative ಎರಡನೇ ಪುರುಷ ಬಹುವಚನವು ಈವರೆಗೆ ನೀಡಿದ ಬೋಧನೆಯನ್ನು ಗ್ರಹಿಸಿರುವ ಪೂರ್ಣಗೊಂಡ ಸ್ಥಿತಿಯನ್ನು ವಿಚಾರಿಸುತ್ತದೆ. ಕನ್ನಡದ ‘ಅರ್ಥಮಾಡಿಕೊಂಡಿರಾ?’ ಇದನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ταῦτα πάντα
  choice: ಈ ಎಲ್ಲವನ್ನೂ
  rationale: ನಪುಂಸಕ ಬಹುವಚನದ ಸೂಚಕ ಸರ್ವನಾಮ ಮತ್ತು πᾶς ಸಂಯೋಗವು ಹಿಂದೆ ಹೇಳಿದ ಉಪಮೆಗಳು ಹಾಗೂ ಬೋಧನೆಯ ಸಮಗ್ರತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಈ ಎಲ್ಲವನ್ನೂ’ ಸಹಜವೂ ಸ್ಪಷ್ಟವೂ ಆಗಿದೆ.
- source_word: λέγουσιν αὐτῷ
  choice: ಶಿಷ್ಯರು ಅವರಿಗೆ … ಎಂದರು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲ ಇದ್ದರೂ ಕನ್ನಡ ಕಥನದಲ್ಲಿ ಭೂತಕಾಲದ ‘ಎಂದರು’ ಸಹಜ. ಕ್ರಿಯಾಪದದ ಬಹುವಚನ ಕರ್ತೃ ಹಿಂದಿನ ಸಂದರ್ಭದಿಂದ ಶಿಷ್ಯರೆಂದು ಸ್ಪಷ್ಟವಾಗುವುದರಿಂದ ಕನ್ನಡದಲ್ಲಿ ಗೊಂದಲ ತಪ್ಪಿಸಲು ಅದನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ; αὐτῷ ಅನ್ನು ಗೌರವಸೂಚಕ ‘ಅವರಿಗೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ναί
  choice: ಹೌದು
  rationale: ಸರಳ ಸಮ್ಮತಿಯ ಕಣಕ್ಕೆ ನೇರವಾದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ. ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ‘ಕರ್ತನೇ’ ಮುಂತಾದ ಸಂಬೋಧನೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
theological_decisions:
- issue: ಶಿಷ್ಯರ ಉತ್ತರಕ್ಕೆ ಗೌರವಪದವನ್ನು ಸೇರಿಸಬೇಕೇ
  choice: ಮೂಲದಲ್ಲಿರುವ ಸರಳವಾದ ‘ಹೌದು’ ಎಂಬ ಉತ್ತರವನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಹೌದು, ಕರ್ತನೇ.’
  rationale: SBLGNT ಪಾಠದಲ್ಲಿ ναί ಮಾತ್ರ ಇದೆ. ಆದ್ದರಿಂದ ಅನುವಾದ ಪರಂಪರೆ ಅಥವಾ ಭಕ್ತಿಪರ ವಿಸ್ತರಣೆಯಿಂದ ಬಂದಿರಬಹುದಾದ ಗೌರವಪದವನ್ನು ಸೇರಿಸದೆ ಮೂಲಪಾಠಕ್ಕೆ ಆದ್ಯತೆ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯೇಸುವಿಗೆ ‘ಅವರು/ಅವರಿಗೆ’ ಎಂಬ ಗೌರವಸೂಚಕ ರೂಪಗಳನ್ನೂ, ಶಿಷ್ಯರ ಸಮೂಹಕ್ಕೆ ಬಹುವಚನವನ್ನೂ ಬಳಸಲಾಗಿದೆ. ಅರ್ಥದ ಪೂರ್ಣಗೊಂಡ ಅಂಶವನ್ನು ಮುಖ್ಯ ಪಾಠದಲ್ಲಿ ಉಳಿಸಿ, ಪ್ರಸ್ತುತ ಗ್ರಹಿಕೆಯ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
