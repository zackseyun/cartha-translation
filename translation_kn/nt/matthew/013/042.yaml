id: MAT.13.42
reference: Matthew 13:42
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: kn
  text: ಮತ್ತು ಅವರು ಅವರನ್ನು ಬೆಂಕಿಯ ಕುಲುಮೆಯೊಳಗೆ ಎಸೆಯುವರು; ಅಲ್ಲಿ ಅಳುವಿಕೆಯೂ ಹಲ್ಲು ಕಡಿಯುವಿಕೆಯೂ ಇರುವುದು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: ಮತ್ತು
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದೊಂದಿಗೆ ಇರುವ ಸರಳ ಸಂಪರ್ಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: βαλοῦσιν
  choice: ಎಸೆಯುವರು
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ಸಕ್ರಿಯ ಕ್ರಿಯೆಯನ್ನೂ ಬಲವಂತವಾಗಿ ಎಸೆಯುವ ಭಾವವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: αὐτοὺς
  choice: ಅವರನ್ನು
  rationale: ಹಿಂದೆ ಉಲ್ಲೇಖಿಸಲಾದ ಬಹುವಚನ ಗುಂಪನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: εἰς τὴν κάμινον τοῦ πυρός
  choice: ಬೆಂಕಿಯ ಕುಲುಮೆಯೊಳಗೆ
  rationale: ಗ್ರೀಕ್‌ನ ಗಮ್ಯಾರ್ಥಕ εἰς ಅನ್ನು ‘ಒಳಗೆ’ ಎಂದು ಮತ್ತು τοῦ πυρός ಎಂಬ ಸಂಬಂಧಪದ ರಚನೆಯನ್ನು ‘ಬೆಂಕಿಯ’ ಎಂದು ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ; ರೂಪಕವನ್ನು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸುವುದಿಲ್ಲ.
- source_word: ἐκεῖ
  choice: ಅಲ್ಲಿ
  rationale: ಈಗಷ್ಟೇ ಉಲ್ಲೇಖಿಸಿದ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ಸರಳ ಸ್ಥಳವಾಚಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ κλαυθμὸς
  choice: ಗೋಳಾಟ
  rationale: ತೀವ್ರ ದುಃಖದಿಂದ ಅಳುವಿಕೆ ಎಂಬ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ಹಲ್ಲು ಕಡಿಯುವುದು
  rationale: ಹಲ್ಲುಗಳನ್ನು ಕಚ್ಚಿ ಅರೆಯುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಸ್ಥಿರ ಕನ್ನಡ ಅಭಿವ್ಯಕ್ತಿ; ದುಃಖವೋ ಕೋಪವೋ ಎಂಬ ಅರ್ಥವನ್ನು ಕಿರಿದಾಗಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ‘ಬೆಂಕಿಯ ಕುಲುಮೆ’ ಎಂಬ ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣದ ಸ್ವರೂಪ
  choice: ಮೂಲದಲ್ಲಿರುವ ಸ್ಪಷ್ಟ ರೂಪಕವನ್ನು ‘ಬೆಂಕಿಯ ಕುಲುಮೆ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನರಕದ ಬೆಂಕಿ’ ಎಂದು ಸಿದ್ಧಾಂತಾತ್ಮಕವಾಗಿ ವಿವರಿಸುವುದು ಅಥವಾ ‘ಜ್ವಲಿಸುವ ಕುಲುಮೆ’ ಎಂದು ತೀವ್ರಗೊಳಿಸುವುದು.
  rationale: ಪಾಠವು ಕೊಡುವ ಅಂತ್ಯಕಾಲದ ನ್ಯಾಯತೀರ್ಪಿನ ಚಿತ್ರಣವನ್ನು ಮೃದುಗೊಳಿಸದೆ, ನಂತರದ ಸಿದ್ಧಾಂತಪದಗಳನ್ನು ಸೇರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- issue: ‘ಗೋಳಾಟವೂ ಹಲ್ಲು ಕಡಿಯುವುದೂ’ ಎಂಬ ಪದಗುಚ್ಛದ ಭಾವ
  choice: ತೀವ್ರ ಸಂಕಟ ಮತ್ತು ನ್ಯಾಯತೀರ್ಪನ್ನು ಸೂಚಿಸುವ ಮತ್ತಾಯನ ಸ್ಥಿರ ಅಭಿವ್ಯಕ್ತಿಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಹಲ್ಲು ಕಡಿಯುವುದನ್ನು ಕೇವಲ ಕೋಪವೆಂದು ಅಥವಾ ಇಡೀ ಪದಗುಚ್ಛವನ್ನು ಕೇವಲ ದುಃಖವೆಂದು ವಿವರಿಸುವುದು.
  rationale: ಈ ಅಭಿವ್ಯಕ್ತಿ ದುಃಖ, ಸಂಕಟ ಅಥವಾ ಆಕ್ರೋಶದ ಒತ್ತಡವನ್ನು ಒಳಗೊಂಡಿರಬಹುದು; ಅನುವಾದವು ಆ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಕಿರಿದಾಗಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ಗ್ರೀಕ್ ಪದಕ್ರಮವನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ಅನುಸರಿಸದೆ ಅದರ ಅರ್ಥ ಹಾಗೂ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
