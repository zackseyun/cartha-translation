reference: Matthew 13:17
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: kn
  text: 'ಏಕೆಂದರೆ ನಾನು ನಿಮಗೆ ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಅನೇಕ ಪ್ರವಾದಿಗಳೂ ನೀತಿವಂತರೂ[a] ನೀವು ನೋಡುವುದನ್ನು ನೋಡಬೇಕೆಂದು ಹಂಬಲಿಸಿದರು, ಆದರೆ ನೋಡಲಿಲ್ಲ; ನೀವು ಕೇಳುವುದನ್ನು ಕೇಳಬೇಕೆಂದು ಹಂಬಲಿಸಿದರು, ಆದರೆ ಕೇಳಲಿಲ್ಲ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ನೀತಿವಂತರು’ ಎಂಬುದು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ವಿಶೇಷಣ; ‘ನೀತಿವಂತ ಜನರು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: ನಿಜವಾಗಿ
  rationale: ಸಿನಾಪ್ಟಿಕ್ ಸುವಾರ್ತೆಗಳಲ್ಲಿ ಬರುವ ಗಂಭೀರ ದೃಢೀಕರಣದ ಸೂತ್ರವನ್ನು ಲಿಪ್ಯಂತರಿಸದೆ, ಅದರ ಬಲವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: γὰρ
  choice: ಏಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಮಾತಿಗೆ ಕಾರಣಾತ್ಮಕ ಅಥವಾ ವಿವರಣಾತ್ಮಕ ಆಧಾರ ನೀಡುವ ಸಂಪರ್ಕವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: λέγω ὑμῖν
  choice: ನಾನು ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ
  rationale: ಗ್ರೀಕ್ ವಾಕ್ಯಸೂತ್ರದ ನೇರತೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πολλοὶ προφῆται
  choice: ಅನೇಕ ಪ್ರವಾದಿಗಳು
  rationale: ಪರಿಮಾಣವನ್ನೂ ಇಸ್ರಾಯೇಲಿನ ಪ್ರವಾದಿಗಳ ವರ್ಗವನ್ನೂ ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: δίκαιοι
  choice: ನೀತಿವಂತರು
  rationale: ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಬಹುವಚನ ವಿಶೇಷಣವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ವ್ಯಕ್ತಿವಾಚಕ ರೂಪದಿಂದ ನೀಡುತ್ತದೆ; ಇದು ಕೇವಲ ನ್ಯಾಯನಿಷ್ಠತೆಯಲ್ಲ, ದೇವರ ಮುಂದೆ ಸರಿಯಾದ ಜೀವನದ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
- source_word: ἐπεθύμησαν
  choice: ಹಂಬಲಿಸಿದರು
  rationale: ತೀವ್ರವಾದ ಬಯಕೆಯನ್ನು ಗೌರವಯುತ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἰδεῖν ἃ βλέπετε
  choice: ನೀವು ನೋಡುವುದನ್ನು ನೋಡಬೇಕೆಂದು
  rationale: ಅಪೂರ್ಣಾರ್ಥಕ ಕ್ರಿಯಾಪದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ infinitive ಮತ್ತು relative clause ನಡುವಿನ ಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὐκ εἶδαν
  choice: ಆದರೆ ನೋಡಲಿಲ್ಲ
  rationale: ಅವರು ಬಯಸಿದ ದೃಶ್ಯಾನುಭವವನ್ನು ಪಡೆಯಲಿಲ್ಲ ಎಂಬ ಐತಿಹಾಸಿಕ ನಿರಾಕರಣೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ಗ್ರೀಕ್‌ನಲ್ಲಿಲ್ಲದ ‘ಎಂದಿಗೂ’ ಎಂಬ ಒತ್ತನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἀκοῦσαι ἃ ἀκούετε
  choice: ನೀವು ಕೇಳುವುದನ್ನು ಕೇಳಬೇಕೆಂದು
  rationale: ಮೊದಲ ಭಾಗದ ಸಮಾಂತರ ರಚನೆಯನ್ನು ಉಳಿಸಿ, ಗ್ರೀಕ್‌ನ ವರ್ತಮಾನಕಾಲದ ಅರ್ಥವನ್ನು ಸರಳ ಕನ್ನಡ ವರ್ತಮಾನದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: οὐκ ἤκουσαν
  choice: ಆದರೆ ಕೇಳಲಿಲ್ಲ
  rationale: ಗ್ರೀಕ್‌ನ ಸರಳ ನಿರಾಕರಣೆಯನ್ನು ಸಮಾಂತರ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: δίκαιοι ಎಂಬ ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ‘ಪ್ರವಾದಿಗಳು’ ಎಂಬ ವರ್ಗದ ಜೊತೆಗೆ ಪ್ರತ್ಯೇಕವಾದ ವಿಶಾಲ ವರ್ಗವಾಗಿ ‘ನೀತಿವಂತರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ನೀತಿವಂತ ಜನರು’ ಅಥವಾ ‘ನೀತಿವಂತರಾದವರು’
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಇದು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾದ ಬಹುವಚನ ವಿಶೇಷಣ. ‘ನೀತಿವಂತರು’ ಎಂಬ ಕನ್ನಡ ರೂಪವು ಅದರ ವ್ಯಕ್ತಿವಾಚಕ ಮತ್ತು ವರ್ಗವಾಚಕ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- issue: ನೋಡಿದ ಮತ್ತು ಕೇಳಿದ ವಿಷಯಗಳ ಸ್ವರೂಪ
  choice: ‘ನೀವು ನೋಡುವುದು’ ಮತ್ತು ‘ನೀವು ಕೇಳುವುದು’ ಎಂದು ವಸ್ತುಗಳನ್ನು ಸೂಚ್ಯವಾಗಿಯೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಮೆಸ್ಸೀಯನನ್ನು,’ ‘ಯೇಸುವಿನ ಕಾರ್ಯಗಳನ್ನು,’ ಅಥವಾ ‘ರಾಜ್ಯದ ರಹಸ್ಯಗಳನ್ನು’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು
  rationale: ಸಂದರ್ಭವು ಯೇಸುವಿನ ಸೇವೆಯಲ್ಲಿನ ರಾಜ್ಯದ ಪ್ರಕಟಣೆಯನ್ನು ಸೂಚಿಸಿದರೂ, ಈ ವಾಕ್ಯವು ವಸ್ತುಗಳನ್ನು relative clauses ಮೂಲಕ ಮಾತ್ರ ಹೇಳುತ್ತದೆ. ಆದ್ದರಿಂದ ಪಠ್ಯದಲ್ಲಿರುವ ಮುಕ್ತತೆಯನ್ನೂ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- issue: γὰρ ಪದದ ಸಂಬಂಧ
  choice: ‘ಏಕೆಂದರೆ’ ಎಂದು ಹಿಂದಿನ ವಾಕ್ಯಕ್ಕೆ ವಿವರಣಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ನಿಜಕ್ಕೂ’ ಎಂದು ಒತ್ತಿನ ಕಣವಾಗಿ ನೀಡುವುದು ಅಥವಾ ಬಿಡುವುದು
  rationale: γάρ ಹಿಂದಿನ ಆಶೀರ್ವಾದದ ಹೇಳಿಕೆಗೆ ಕಾರಣ ಅಥವಾ ವಿವರಣೆ ಒದಗಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಏಕೆಂದರೆ’ ಈ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗಂಭೀರ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ. ‘ನಿಜವಾಗಿ ಹೇಳುತ್ತೇನೆ’ ಎಂಬುದು ಯೇಸುವಿನ solemn asseveration ಅನ್ನು ಉಳಿಸುತ್ತದೆ. ಎರಡು ಸಮಾಂತರ ಭಾಗಗಳ ಲಯವನ್ನು ಕಾಪಾಡಲು ‘ಆದರೆ ನೋಡಲಿಲ್ಲ / ಆದರೆ ಕೇಳಲಿಲ್ಲ’ ಎಂಬ ಸಮರೂಪ ಬಳಕೆಯಾಗಿದೆ.
