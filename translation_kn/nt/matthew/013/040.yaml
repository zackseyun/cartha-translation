review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders ζιζάνια as ‘ಕಳೆಗಳನ್ನು,’ πυρί as ‘ಬೆಂಕಿಯಲ್ಲಿ,’ and τοῦ αἰῶνος as ‘ಯುಗದ.’ However, ‘ಒಟ್ಟುಗೂಡಿಸಿ ... ಸುಡುವಂತೆಯೇ’ can read as an active, generic infinitival construction rather than reflecting the Greek passive verbs συλλέγεται and καίεται. Also, ‘ಅಂತ್ಯದಲ್ಲಿಯೂ’ adds an emphatic ‘also/even’ nuance not present in ἐν τῇ συντελείᾳ.
  naturalness: The wording is generally clear modern standard Kannada. Recasting the comparison with passive ‘ಸುಡಲಾಗುತ್ತದೋ’ makes the sequence and its relation to the future consequence more explicit and idiomatic. Removing ‘-ಯೂ’ avoids an unnecessary emphasis.
  terminology: '‘ಕಳೆಗಳು’ is an appropriate nontechnical rendering of ζιζάνια, while ‘ಯುಗದ ಅಂತ್ಯ’ preserves αἰών as temporal rather than substituting ‘world.’ The first footnote should not call ‘ಹಾನಿಕರ ಕಳೆಗಳು’ the traditional rendering: the traditional English term is ‘tares,’ and the Greek likely denotes darnel or a similar harmful weed.'
  issues:
  - severity: medium
    issue: The passive force of συλλέγεται and καίεται is not explicit.
    rationale: The draft’s ‘ಒಟ್ಟುಗೂಡಿಸಿ ಬೆಂಕಿಯಲ್ಲಿ ಸುಡುವಂತೆಯೇ’ may be understood as an active/general action. ‘ಒಟ್ಟುಗೂಡಿಸಿ ಬೆಂಕಿಯಲ್ಲಿ ಸುಡಲಾಗುತ್ತದೋ’ clearly retains the passive sense without supplying an agent.
  - severity: low
    issue: ‘ಯುಗದ ಅಂತ್ಯದಲ್ಲಿಯೂ’ contains an added emphatic particle.
    rationale: The Greek has ἐν (‘at/in’) but no equivalent of ‘also/even.’ ‘ಯುಗದ ಅಂತ್ಯದಲ್ಲಿ’ is sufficient.
  - severity: low
    issue: Footnote a inaccurately labels ‘ಹಾನಿಕರ ಕಳೆಗಳು’ as the traditional alternative.
    rationale: The audit trail identifies the traditional term as ‘tares’; ‘harmful weeds’ is explanatory rather than traditional. The note should distinguish the traditional label from the likely botanical reference.
