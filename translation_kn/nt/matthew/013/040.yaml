id: MAT.13.40
reference: Matthew 13:40
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ಕಳೆಗಳನ್ನು[a] ಒಟ್ಟುಗೂಡಿಸಿ ಬೆಂಕಿಯಲ್ಲಿ ಸುಡಲಾಗುತ್ತದೋ, ಹಾಗೆಯೇ ಯುಗದ ಅಂತ್ಯದಲ್ಲಿ[b] ಆಗುವುದು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ‘ಟೇರ್ಸ್.’ ಗ್ರೀಕ್ ಪದವು ಹಾನಿಕರ ಕಳೆಗಳನ್ನು, ಬಹುಶಃ ಧಾನ್ಯವನ್ನು ಹೋಲುವ ಡಾರ್ನೆಲ್ ಎಂಬ ಕಳೆಯನ್ನು, ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ, ‘ಲೋಕದ ಅಂತ್ಯದಲ್ಲಿ’; ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಯುಗದ ಅಂತ್ಯದಲ್ಲಿ.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: ಆದ್ದರಿಂದ, ... ಸುಡುವಂತೆಯೇ
  rationale: οὖν ಸೂಚಿಸುವ ಹಿಂದಿನ ಮಾತಿನ ತಾರ್ಕಿಕ ಮುಂದುವರಿಕೆಯನ್ನು ‘ಆದ್ದರಿಂದ’ ಉಳಿಸುತ್ತದೆ; ὥσπερ ಸೂಚಿಸುವ ಹೋಲಿಕೆಯನ್ನು ‘-ವಂತೆಯೇ’ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: συλλέγεται
  choice: ಒಟ್ಟುಗೂಡಿಸಿ
  rationale: ಕೃಷಿ ಸನ್ನಿವೇಶದಲ್ಲಿ ಕಳೆಗಳನ್ನು ವಿಲೇವಾರಿಗಾಗಿ ಸೇರಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ. ಗ್ರೀಕ್‌ನ ಕರ್ತೃರಹಿತ ಕ್ರಿಯಾಭಾವವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕರ್ತೃವನ್ನು ಹೇಳದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: τὰ ζιζάνια
  choice: ಕಳೆಗಳನ್ನು
  rationale: ζιζάνια ಹಾನಿಕರ ಕಳೆಗಳನ್ನು, ಬಹುಶಃ ಡಾರ್ನೆಲ್ ಕಳೆಯನ್ನು, ಸೂಚಿಸುತ್ತದೆ. ‘ಕಳೆಗಳು’ ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸಹಜ ಮತ್ತು ಸ್ಪಷ್ಟ; ನಿರ್ದಿಷ್ಟ ಸಸ್ಯಪ್ರಭೇದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅನಗತ್ಯವಾಗಿ ನಿಗದಿಪಡಿಸುವುದಿಲ್ಲ.
- source_word: πυρὶ καίεται
  choice: ಬೆಂಕಿಯಲ್ಲಿ ಸುಡುವ
  rationale: ಬೆಂಕಿಯ ಸ್ಪಷ್ಟ ಉಲ್ಲೇಖವನ್ನೂ ಸುಡುವ ಸರಳ ಕ್ರಿಯೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ. ದತ್ತಿವಿಭಕ್ತಿಯ ಸಾಧನಾತ್ಮಕ ಅಥವಾ ಸಂಬಂಧಾತ್ಮಕ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಅತಿಯಾಗಿ ನಿರ್ಧರಿಸದೆ ಸಹಜ ಕನ್ನಡ ನೀಡುತ್ತದೆ.
- source_word: οὕτως ἔσται
  choice: ಹಾಗೆಯೇ ಆಗುವುದು
  rationale: ಹೋಲಿಕೆಯ ಎರಡನೇ ಭಾಗವನ್ನೂ ಭವಿಷ್ಯಕಾಲದ ಅರ್ಥವನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ συντελείᾳ
  choice: ಅಂತ್ಯದಲ್ಲಿ
  rationale: συντέλεια ಸೂಚಿಸುವ ಮುಕ್ತಾಯ ಅಥವಾ ಪರಿಪೂರ್ಣ ಸಮಾಪ್ತಿಯನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಅರ್ಥವಾಗುವ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: τοῦ αἰῶνος
  choice: ಯುಗದ
  rationale: αἰών ಇಲ್ಲಿ ಕಾಲಘಟ್ಟದ ಅರ್ಥ ಹೊಂದಿರುವುದರಿಂದ ‘ಯುಗ’ ಸೂಕ್ತ. ಇದು ಭೌತಿಕ ಲೋಕದ ನಾಶವೆಂದು ಅನಿವಾರ್ಯವಾಗಿ ಅರ್ಥೈಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: τοῦ αἰῶνος ಎಂಬ ಅಂತ್ಯಕಾಲಸಂಬಂಧಿ ಪದಬಂಧ
  choice: ಯುಗದ ಅಂತ್ಯದಲ್ಲಿ
  alternative: ಲೋಕದ ಅಂತ್ಯದಲ್ಲಿ
  rationale: ಗ್ರೀಕ್ αἰών ಕಾಲಸಂಬಂಧಿ ‘ಯುಗ’ವನ್ನು ಸೂಚಿಸುತ್ತದೆ; κόσμος ಎಂಬ ‘ಲೋಕ’ದ ಪದ ಇಲ್ಲ. ಆದ್ದರಿಂದ ಅಂತ್ಯಕಾಲದ ಸ್ವರೂಪದ ಕುರಿತು ನಿರ್ದಿಷ್ಟ ವ್ಯವಸ್ಥೆಯನ್ನು ಹೇರದೆ ಮೂಲದ ಕಾಲಾತ್ಮಕ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ‘ಹೇಗೆ—ಹಾಗೆಯೇ’ ಹೋಲಿಕೆ ಮತ್ತು ನಿರ್ಣಯಾತ್ಮಕ ಸಂಪರ್ಕವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಅವು ವಿವರಿಸುವ ‘ಕಳೆಗಳನ್ನು’ ಮತ್ತು ‘ಯುಗದ ಅಂತ್ಯದಲ್ಲಿ’ ಎಂಬ ಪದಬಂಧಗಳ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
