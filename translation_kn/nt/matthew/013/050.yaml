id: MAT.13.50
reference: Matthew 13:50
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: kn
  text: ಮತ್ತು ಅವರನ್ನು ಬೆಂಕಿಯ ಕುಲುಮೆಗೆ[a] ಎಸೆಯುವರು. ಅಲ್ಲಿ ಅಳುವಿಕೆಯೂ ಹಲ್ಲು ಕಡಿಯುವಿಕೆಯೂ ಇರುವವು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಹೆಚ್ಚು ನುಡಿಗಟ್ಟಾಗಿ, ‘ಉರಿಯುವ ಕುಲುಮೆಗೆ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಬೆಂಕಿಯ ಕುಲುಮೆಗೆ’ ಎಂದಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: ಎಸೆಯುವರು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕ್ರಿಯೆಯನ್ನೂ ಬಲವಂತವಾಗಿ ಹೊರಗೆಸೆದು ಹಾಕುವ ಭಾವವನ್ನೂ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτοὺς
  choice: ಅವರನ್ನು
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ದುಷ್ಟರನ್ನು ಸೂಚಿಸುವ ಪುಲ್ಲಿಂಗ ಬಹುವಚನ ಕರ್ಮಪದ ಸರ್ವನಾಮಕ್ಕೆ ಸರಳ ಕನ್ನಡ ರೂಪ.
- source_word: κάμινον τοῦ πυρός
  choice: ಬೆಂಕಿಯ ಕುಲುಮೆಗೆ
  rationale: ಗ್ರೀಕ್‌ನ ಷಷ್ಠೀ ವಿಭಕ್ತಿ ರಚನೆಯನ್ನು ನಿಕಟವಾಗಿ ಉಳಿಸಿ, ತೀರ್ಪಿನ ಸ್ಪಷ್ಟ ಚಿತ್ರಣವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐκεῖ
  choice: ಅಲ್ಲಿ
  rationale: ಸ್ಥಳವನ್ನು ಒತ್ತಿಹೇಳುವ ಗ್ರೀಕ್ ಕ್ರಿಯಾವಿಶೇಷಣಕ್ಕೆ ಸಂಕ್ಷಿಪ್ತವೂ ಸಹಜವೂ ಆದ ಸಮಾನಾರ್ಥಕ.
- source_word: ἔσται
  choice: ಇರುವವು
  rationale: ಮುಂದಿನ ಎರಡು ಭಾವನಾಮಗಳಿಗೆ ಹೊಂದುವ ಭವಿಷ್ಯಕಾಲದ ಅಸ್ತಿತ್ವ ಸೂಚಕ ರೂಪ.
- source_word: ὁ κλαυθμὸς
  choice: ಅಳುವಿಕೆ
  rationale: ದುಃಖಭರಿತ ಅಳುವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಮೂಲಪದಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ‘ಗೋಳಾಟ’ ಎಂದು ತೀವ್ರಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ಹಲ್ಲು ಕಡಿಯುವಿಕೆ
  rationale: ಮತ್ತಾಯನಲ್ಲಿ ಮರುಕಳಿಸುವ ಸ್ಥಿರ ತೀರ್ಪಿನ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತ ಹಾಗೂ ಸ್ಪಷ್ಟ ರೀತಿಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಅಂತ್ಯಕಾಲದ ತೀರ್ಪಿನ ಚಿತ್ರಣ
  choice: ‘ಬೆಂಕಿಯ ಕುಲುಮೆ’, ‘ಅಳುವಿಕೆ’, ‘ಹಲ್ಲು ಕಡಿಯುವಿಕೆ’ ಎಂಬ ಸ್ಪಷ್ಟ ಚಿತ್ರಣಗಳನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಉರಿಯುವ ಕುಲುಮೆ’ ಎಂದು ಹೆಚ್ಚು ನುಡಿಗಟ್ಟಿನಂತೆ ಹೇಳುವುದು ಅಥವಾ ದುಃಖವನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸುವುದು.
  rationale: ಮೂಲ ವಾಕ್ಯವು ತೀರ್ಪಿನ ರೂಪಕಗಳನ್ನು ನೇರವಾಗಿ ನೀಡುತ್ತದೆ. ಅವುಗಳ ಧಾರ್ಮಿಕ ಅರ್ಥವನ್ನು ಹೆಚ್ಚಿಸದೆ ಅಥವಾ ಕುಗ್ಗಿಸದೆ, ಮೂಲದಲ್ಲಿರುವ ಗಂಭೀರತೆಯನ್ನೂ ಉದ್ವಿಗ್ನತೆಯನ್ನೂ ಉಳಿಸುವುದು ಸೂಕ್ತ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನವಾದ ವಾಕ್ಯರಚನೆ ಬಳಸಲಾಗಿದೆ. ‘ಕುಲುಮೆ’ ಮತ್ತು ‘ಹಲ್ಲು ಕಡಿಯುವಿಕೆ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಚಿತ್ರಣಗಳನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅತಿಯಾಗಿ ಪುರಾತನ ಶೈಲಿಯನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ.
