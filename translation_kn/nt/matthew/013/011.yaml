id: MAT.13.11
reference: Matthew 13:11
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: kn
  text: 'ಅದಕ್ಕೆ ಆತನು ಅವರಿಗೆ ಉತ್ತರವಾಗಿ ಹೇಳಿದನು: “ಪರಲೋಕರಾಜ್ಯದ ರಹಸ್ಯಗಳನ್ನು[a] ತಿಳಿದುಕೊಳ್ಳಲು ನಿಮಗೆ ಅನುಗ್ರಹಿಸಲಾಗಿದೆ[b]; ಆದರೆ ಅವರಿಗೆ ಅನುಗ್ರಹಿಸಲಾಗಿಲ್ಲ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಪರಲೋಕರಾಜ್ಯದ ಗುಪ್ತ ಸತ್ಯಗಳನ್ನು.”
    reason: lexical_alternative
  - marker: b
    text: “ಅನುಗ್ರಹಿಸಲಾಗಿದೆ” ಎಂಬ ಕರ್ಮಣಿ ರೂಪವು ಅನುಗ್ರಹಿಸುವವನನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ; ಈ ಜ್ಞಾನವನ್ನು ದೇವರು ಅನುಗ್ರಹಿಸುತ್ತಾನೆ ಎಂಬುದು ಸೂಚಿತವಾಗಿದೆ.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ಉತ್ತರವಾಗಿ ಹೇಳಿದನು
  rationale: ಗ್ರೀಕ್‌ನ ಕೃದಂತ ಮತ್ತು ಸಮಾಪಕ ಕ್ರಿಯಾಪದದ ಸಂಯೋಜನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಅನಗತ್ಯವಾಗಿ ‘ಉತ್ತರಿಸಿ ಹೇಳಿದನು’ ಎಂಬ ಭಾರವಾದ ಪುನರುಕ್ತಿಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: Ὅτι
  choice: ನೇರ ಉತ್ತರದ ಪರಿಚಯವಾಗಿ ವಿರಾಮಚಿಹ್ನೆ
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ὅτι ಉತ್ತರದ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ‘ಏಕೆಂದರೆ’ ಅಥವಾ ‘ಎಂದು’ ಸೇರಿಸುವುದಕ್ಕಿಂತ ನೇರ ಉಲ್ಲೇಖವು ಸಹಜವಾಗಿದ್ದು ಸಂದರ್ಭದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὑμῖν δέδοται
  choice: ನಿಮಗೆ ಕೊಡಲಾಗಿದೆ
  rationale: ಪೂರ್ಣಕಾಲದ ಕರ್ಮಣಿ ರೂಪವು ಹಿಂದೆ ನೀಡಲ್ಪಟ್ಟು ಈಗಲೂ ಇರುವ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದ ಈ ರೂಪವು ನೀಡುವವನನ್ನು ಹೇಳದೆ ಮೂಲದ ಕರ್ಮಣಿ ಪ್ರಯೋಗವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: γνῶναι
  choice: ತಿಳಿದುಕೊಳ್ಳುವ
  rationale: γινώσκω ಎಂಬುದರ ‘ತಿಳಿಯುವುದು’ ಎಂಬ ಮೂಲಾರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ‘ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು’ ಎಂಬ ಹೆಚ್ಚಿನ ವ್ಯಾಖ್ಯಾನವನ್ನು ಹೇರದು.
- source_word: τὰ μυστήρια
  choice: ರಹಸ್ಯಗಳನ್ನು
  rationale: ದೇವರಿಂದ ಪ್ರಕಟಿಸಲ್ಪಡುವ, ಮೊದಲು ಮರೆಯಾಗಿದ್ದ ಸತ್ಯಗಳ ಅರ್ಥವನ್ನು ಗೌರವಪೂರ್ಣ ಹಾಗೂ ಸ್ಥಾಪಿತ ಕನ್ನಡ ಬೈಬಲ್ ಪದಪ್ರಯೋಗದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯದ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಬಂಧಕ್ಕೆ ಸಹಜವೂ ಸ್ಥಾಪಿತವೂ ಆದ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ; ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಅಸಹಜವಾಗಿ ನಕಲಿಸದೆ ಅದರ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: ಆದರೆ ಅವರಿಗೆ ಕೊಡಲಾಗಿಲ್ಲ
  rationale: ಶಿಷ್ಯರು ಮತ್ತು ಹೊರಗಿನವರ ನಡುವಿನ ವಿರೋಧವನ್ನು ‘ಆದರೆ’ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; ‘ಅವರಿಗೆ’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಸಂದರ್ಭದಲ್ಲಿನ ಉಲ್ಲೇಖವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಕೊಡಲಾಗಿದೆ’ ಎಂಬ ಕರ್ಮಣಿ ರೂಪದಲ್ಲಿ ಕೊಡುವವನು ಯಾರು ಎಂಬುದು
  choice: ಮೂಲದಂತೆ ಕೊಡುವವನನ್ನು ಹೆಸರಿಸದೆ ಕರ್ಮಣಿ ರೂಪವನ್ನು ಉಳಿಸಲಾಗಿದೆ
  alternative: ‘ದೇವರು ನಿಮಗೆ ಕೊಟ್ಟಿದ್ದಾನೆ’
  rationale: ದೇವರೇ ಕೊಡುವವನು ಎಂಬ ಅರ್ಥ ಸಾಧ್ಯವಾಗಿದ್ದರೂ ಗ್ರೀಕ್ ಅದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ದೇವರನ್ನು ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸದೆ ಅದರ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮತ್ತು ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: μυστήρια ಎಂಬ ಪದದ ಅರ್ಥ
  choice: ‘ರಹಸ್ಯಗಳು’
  alternative: ‘ಗುಪ್ತ ಸತ್ಯಗಳು’
  rationale: ಈ ಪದವು ಮೊದಲು ಮರೆಯಾಗಿದ್ದು ಈಗ ಪ್ರಕಟಗೊಳ್ಳುವ ದೈವಿಕ ವಾಸ್ತವಗಳನ್ನು ಸೂಚಿಸಬಹುದು. ‘ರಹಸ್ಯಗಳು’ ಆ ಬೈಬಲೀಯ ಪರಿಕಲ್ಪನೆಯನ್ನು ಉಳಿಸಿ, ಅದನ್ನು ಕೇವಲ ಗುಪ್ತ ಮಾಹಿತಿಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಗ್ರಾಹ್ಯವಾದ ಶೈಲಿ. ‘ಪರಲೋಕರಾಜ್ಯ’ ಮತ್ತು ‘ರಹಸ್ಯಗಳು’ ಎಂಬ ಸ್ಥಾಪಿತ ಬೈಬಲೀಯ ಪದಗಳನ್ನು ಉಳಿಸಿಕೊಂಡು, ವಾಕ್ಯರಚನೆಯನ್ನು ಕನ್ನಡಕ್ಕೆ ತಕ್ಕಂತೆ ಸರಳಗೊಳಿಸಲಾಗಿದೆ.
