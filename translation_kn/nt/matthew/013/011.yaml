    issue: “ಅವಕಾಶ” has been added to express δέδοται.
    rationale: ‘Opportunity’ can suggest external access or occasion, whereas the Greek perfect passive says that knowledge/understanding has been granted. This additional noun narrows and slightly shifts the sense.
