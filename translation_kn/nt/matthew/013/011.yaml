review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the answer formula, the contrast between the two groups, the passive construction, and the kingdom-mysteries terminology. However, “ಅವಕಾಶ” (‘opportunity’) introduces a specific nuance not expressed by δέδοται; the Greek states that knowledge has been granted, not merely that an occasion or opportunity has been provided.
  naturalness: The sentence is generally clear and idiomatic, but “ತಿಳಿದುಕೊಳ್ಳುವ ಅವಕಾಶ ... ಕೊಡಲಾಗಿದೆ” is less precise than a direct passive expression of granting. “ಅನುಗ್ರಹಿಸಲಾಗಿದೆ” is natural in this elevated biblical register and retains the implicit agent.
  terminology: “ಪರಲೋಕರಾಜ್ಯ” and “ರಹಸ್ಯಗಳು” are established Kannada biblical terms and appropriately render the Matthean expression and μυστήρια. The alternative footnote “ಗುಪ್ತ ಸತ್ಯಗಳು” is a valid lexical alternative.
  issues:
