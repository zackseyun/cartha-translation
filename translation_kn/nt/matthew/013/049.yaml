id: MAT.13.49
reference: Matthew 13:49
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: kn
  text: 'ಹಾಗೆಯೇ ಈ ಯುಗದ ಸಮಾಪ್ತಿಯಲ್ಲಿ ಆಗುವುದು: ದೇವದೂತರು ಹೊರಟುಹೋಗಿ ನೀತಿವಂತರ ಮಧ್ಯದಿಂದ ದುಷ್ಟರನ್ನು ಬೇರ್ಪಡಿಸುವರು.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಈ ಯುಗವು ಪರಿಪೂರ್ಣಗೊಳ್ಳುವಾಗ.’ ಸಾಂಪ್ರದಾಯಿಕ ಅನುವಾದಗಳಲ್ಲಿ ಕೆಲವೊಮ್ಮೆ ‘ಲೋಕದ ಅಂತ್ಯದಲ್ಲಿ’ ಎಂದಿರುತ್ತದೆ; ಆದರೆ ಗ್ರೀಕ್‌ನಲ್ಲಿ ‘ಲೋಕ’ ಎಂಬುದಲ್ಲ, ‘ಯುಗ’ (αἰών) ಎಂದಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ಹಾಗೆಯೇ
  rationale: ದೃಷ್ಟಾಂತದಲ್ಲಿ ವಿವರಿಸಿದ ಸಂಗತಿ ಅಂತ್ಯದಲ್ಲಿ ಹೇಗೆ ನೆರವೇರುತ್ತದೆ ಎಂಬ ಹೋಲಿಕೆ ಮತ್ತು ನಿರ್ಣಯದ ಬಲವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἔσται
  choice: ಆಗುವುದು
  rationale: ಸರಳ ಭವಿಷ್ಯಾರ್ಥವನ್ನು ಸಹಜ ಹಾಗೂ ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: ಈ ಯುಗದ ಸಮಾಪ್ತಿಯಲ್ಲಿ
  rationale: συντέλεια ಎಂಬ ಪೂರ್ಣಗೊಳ್ಳುವಿಕೆ/ಸಮಾಪ್ತಿಯ ಅರ್ಥವನ್ನೂ αἰών ಎಂಬ ‘ಯುಗ’ದ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ; ಭೌತಿಕ ಲೋಕವೇ ಅಂತ್ಯಗೊಳ್ಳುತ್ತದೆ ಎಂಬ ಅಗತ್ಯವಿಲ್ಲದ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: ἐξελεύσονται
  choice: ಹೊರಟುಹೋಗಿ
  rationale: ἐξέρχομαι ಪದದ ಹೊರಗೆ ಹೋಗುವ ಚಲನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: οἱ ἄγγελοι
  choice: ದೇವದೂತರು
  rationale: ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪಿನ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪದವು ಮಾನವ ಸಂದೇಶವಾಹಕರನ್ನಲ್ಲ, ಸ್ವರ್ಗೀಯ ದೂತರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀφοριοῦσιν
  choice: ಬೇರ್ಪಡಿಸುವರು
  rationale: ಒಂದು ಮಿಶ್ರ ಗುಂಪಿನೊಳಗಿಂದ ಒಂದು ವರ್ಗವನ್ನು ಪ್ರತ್ಯೇಕಿಸುವ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τοὺς πονηροὺς
  choice: ದುಷ್ಟರನ್ನು
  rationale: ಗುಣವಾಚಕದ ನಾಮಪದೀಯ ಬಳಕೆಯನ್ನು, ಅಂದರೆ ದುಷ್ಟ ವ್ಯಕ್ತಿಗಳನ್ನು, ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: ನೀತಿವಂತರ ಮಧ್ಯದಿಂದ
  rationale: ದುಷ್ಟರು ನೀತಿವಂತರ ನಡುವೆ ಇದ್ದು ಅಲ್ಲಿಂದ ಬೇರ್ಪಡಿಸಲ್ಪಡುವರು ಎಂಬ ಮೂಲದ ಸ್ಥಳಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: αἰών ಪದದ ಅಂತ್ಯಕಾಲಿಕ ಅರ್ಥ
  choice: ಯುಗ
  alternative: ಲೋಕ
  rationale: ಗ್ರೀಕ್ αἰών ಪ್ರಸ್ತುತ ಯುಗ ಅಥವಾ ವ್ಯವಸ್ಥೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಲೋಕ’ ಎಂದರೆ ಭೌತಿಕ ಸೃಷ್ಟಿಯ ಅಂತ್ಯವೆಂಬ ಅನಗತ್ಯ ಅರ್ಥ ಮೂಡಬಹುದು.
- issue: ἄγγελοι ಪದದ ಸೂಚಿತ ವ್ಯಕ್ತಿಗಳು
  choice: ಸ್ವರ್ಗೀಯ ದೇವದೂತರು
  alternative: ಮಾನವ ದೂತರು
  rationale: ಯೇಸು ವಿವರಿಸುವ ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪಿನ ಸಂದರ್ಭದಲ್ಲಿ ಸ್ವರ್ಗೀಯ ದೇವದೂತರೇ ಉದ್ದೇಶಿತರಾಗಿದ್ದಾರೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ‘ಸಮಾಪ್ತಿ’ ಮೂಲದ συντέλεια ಪದದಲ್ಲಿರುವ ಅಂತ್ಯ ಮತ್ತು ಪೂರ್ಣಗೊಳ್ಳುವಿಕೆ ಎರಡನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; ಪರ್ಯಾಯ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
