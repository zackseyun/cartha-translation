id: MAT.13.16
reference: Matthew 13:16
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: kn
  text: ಆದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳು ನೋಡುವುದರಿಂದ ಧನ್ಯವಾಗಿವೆ; ನಿಮ್ಮ ಕಿವಿಗಳು ಕೇಳುವುದರಿಂದ ಧನ್ಯವಾಗಿವೆ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಚನಗಳಲ್ಲಿ ನೋಡದ ಮತ್ತು ಕೇಳದವರ ಸ್ಥಿತಿಗೆ ಶಿಷ್ಯರ ಸ್ಥಿತಿಯನ್ನು ವಿರುದ್ಧವಾಗಿ ತೋರಿಸುವ ಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μακάριοι
  choice: ಧನ್ಯ
  rationale: ಕೇವಲ ಮನಸ್ಸಿನ ಸಂತೋಷವನ್ನಲ್ಲ, ದೇವರ ಅನುಗ್ರಹಕ್ಕೆ ಪಾತ್ರವಾದ ಶುಭಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ, ಧನ್ಯವಚನಗಳ ಶೈಲಿಗೆ ಹೊಂದುವ ಪದ.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: ನಿಮ್ಮ ಕಣ್ಣುಗಳು
  rationale: ಗ್ರೀಕ್‌ನ ಸ್ವಾಮ್ಯಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಶಿಷ್ಯರ ಸ್ವಂತ ಕಣ್ಣುಗಳ ಮೇಲಿರುವ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ὅτι βλέπουσιν
  choice: ನೋಡುವ
  rationale: ὅτιಯನ್ನು ಕಾರಣಾರ್ಥಕವಾಗಿ ಗ್ರಹಿಸಿ, ಕಣ್ಣುಗಳು ಧನ್ಯವಾಗಿರುವುದಕ್ಕೆ ಅವು ನೋಡುವುದೇ ಕಾರಣವೆಂದು ಕನ್ನಡದ ಸಹಜ ಸಂಬಂಧವಾಚಕ ರಚನೆಯಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τὰ ὦτα ὑμῶν
  choice: ನಿಮ್ಮ ಕಿವಿಗಳು
  rationale: ಕಣ್ಣುಗಳೊಂದಿಗಿನ ಸಮಾನಾಂತರತೆಯನ್ನು ಉಳಿಸುವ ಸಹಜ ಕನ್ನಡ ರೂಪ.
- source_word: ὅτι ἀκούουσιν
  choice: ಕೇಳುವ
  rationale: ὅτιಯ ಕಾರಣಾರ್ಥವನ್ನು ಕನ್ನಡದ ಸಹಜ ಸಂಬಂಧವಾಚಕ ರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಿ, ಮೂಲದ ಸರಳ ಶ್ರವಣಕ್ರಿಯೆಯನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: ನೋಡುವ / ಕೇಳುವ
  rationale: ‘ಗ್ರಹಿಸುವ’ ಅಥವಾ ‘ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವ’ ಎಂದು ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸದೆ, ಮೂಲದ ಇಂದ್ರಿಯಸಂಬಂಧಿ ಸರಳ ಪದಗಳನ್ನು ಮತ್ತು ಅವುಗಳ ವಿಶಾಲ ಸಂದರ್ಭಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ನೋಡುವುದನ್ನೂ ಕೇಳುವುದನ್ನೂ ಅನುವಾದದಲ್ಲೇ ಸ್ಪಷ್ಟವಾಗಿ ಆತ್ಮಿಕ ಗ್ರಹಿಕೆ ಎಂದು ಹೇಳಬೇಕೇ?
  choice: ‘ನೋಡುವ’ ಮತ್ತು ‘ಕೇಳುವ’ ಎಂಬ ನೇರ ಇಂದ್ರಿಯಸಂಬಂಧಿ ಭಾಷೆಯನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಗ್ರಹಿಸುವ ನಿಮ್ಮ ಕಣ್ಣುಗಳು ಧನ್ಯ; ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವ ನಿಮ್ಮ ಕಿವಿಗಳೂ ಧನ್ಯ’ ಎಂದು ಅನುವಾದಿಸುವುದು.
  rationale: ಸಂದರ್ಭವು ಆಳವಾದ ಆತ್ಮಿಕ ಗ್ರಹಿಕೆಯನ್ನು ಸೂಚಿಸಿದರೂ, ಈ ವಚನವು ಸ್ವತಃ ಕಣ್ಣುಗಳು ನೋಡುವುದನ್ನೂ ಕಿವಿಗಳು ಕೇಳುವುದನ್ನೂ ಮಾತ್ರ ಹೇಳುತ್ತದೆ. ನೇರ ಪದಗಳನ್ನು ಉಳಿಸುವುದರಿಂದ ಸಂದರ್ಭವೇ ಆಳವಾದ ಅರ್ಥವನ್ನು ಪೂರೈಸುತ್ತದೆ ಮತ್ತು ಮೂಲದ ಧಾರ್ಮಿಕ ಒತ್ತಡ ಮಸುಕಾಗುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಯುತ ಶೈಲಿ. ‘ನೋಡುವ ನಿಮ್ಮ ಕಣ್ಣುಗಳು’ ಎಂಬ ರಚನೆ ಕಾರಣಾರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ನೀಡುತ್ತದೆ; ಪುನರಾವರ್ತಿತ ‘ಧನ್ಯ’ ಮೂಲದಲ್ಲಿ ಎರಡನೆಯ ಬಾರಿ ಸೂಚಿತವಾಗಿರುವ ಸಮಾನಾಂತರತೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಗೊಳಿಸುತ್ತದೆ.
