id: MAT.13.1
reference: Matthew 13:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: kn
  text: ಆ ದಿನ[a] ಯೇಸು ಮನೆಯಿಂದ ಹೊರಟು ಸಮುದ್ರದ ಬಳಿಯಲ್ಲಿ[b] ಕುಳಿತಿದ್ದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅದೇ ದಿನ’; ಈ ಪದಗುಚ್ಛವು ಹಿಂದಿನ ಸಂದರ್ಭದೊಂದಿಗೆ ನಿರಂತರತೆಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ ಎಂದು ಗ್ರಹಿಸಿದರೆ ಹೀಗೆ ಅನುವಾದಿಸಬಹುದು.
    reason: alternative_reading
  - marker: b
    text: ಅಥವಾ, ‘ಸಮುದ್ರದ ಪಕ್ಕದಲ್ಲಿ.’ ಗ್ರೀಕ್ ಪದಪ್ರಯೋಗವು ಸಮುದ್ರದ ಸಮೀಪದ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ತೀರದಿಂದ ಎಷ್ಟು ದೂರವೆಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ಆ ದಿನ
  rationale: ಇದು ಸಹಜವಾದ ಆಧುನಿಕ ಕನ್ನಡದ ಕಾಲಸೂಚಕ ಪ್ರಯೋಗ. ಗ್ರೀಕ್‌ನ ಕಾಲಸಂಬಂಧವನ್ನು ಉಳಿಸುತ್ತದೆ; ಸಂದರ್ಭದ ನಿರಂತರತೆಯನ್ನು ಒತ್ತಿಹೇಳುವ ‘ಅದೇ ದಿನ’ ಎಂಬ ಅರ್ಥವೂ ಸಾಧ್ಯ.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: ಮನೆಯಿಂದ ಹೊರಗೆ ಹೋಗಿ
  rationale: ಕ್ರಿಯಾವಿಶೇಷಣೀಯ ಭೂತಕಾಲದ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸರಣಿ ಕ್ರಿಯೆಯಾಗಿ ನೀಡಲಾಗಿದೆ. ಷಷ್ಠೀ ವಿಭಕ್ತಿಯು ಹೊರಟ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಮನೆಯಿಂದ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ὁ Ἰησοῦς
  choice: ಯೇಸು
  rationale: ವ್ಯಕ್ತಿನಾಮವನ್ನು ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾಗಿರುವ ರೂಪದಲ್ಲಿ ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: ἐκάθητο
  choice: ಕುಳಿತುಕೊಂಡನು
  rationale: ಈ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯಾರೂಪವು ದೃಶ್ಯವನ್ನು ಹಿನ್ನೆಲೆಯಾಗಿ ಕಟ್ಟಿಕೊಡುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಕುಳಿತುಕೊಂಡನು’ ಸಹಜವಾಗಿದ್ದು, ಯೇಸು ಅಲ್ಲಿ ಕುಳಿತ ಸ್ಥಿತಿಗೆ ಬಂದದ್ದನ್ನೂ ಮುಂದಿನ ಘಟನೆಯ ನೆಲೆಯನ್ನೂ ಸಮರ್ಪಕವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: παρὰ τὴν θάλασσαν
  choice: ಸಮುದ್ರದ ಬಳಿಯಲ್ಲಿ
  rationale: παρά ಜೊತೆಗೆ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿಯ ಈ ಬಳಕೆ ಸಮುದ್ರದ ಸಮೀಪದ ಸ್ಥಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ತೀರದಿಂದ ನಿಖರ ದೂರವನ್ನು ಹೇಳುವುದಿಲ್ಲ. ‘ಬಳಿಯಲ್ಲಿ’ ಈ ಅಗಲವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಕಡಲತೀರದಲ್ಲಿ’ ಎಂದು ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ಮೂಲದ ಸ್ಥಳವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಎಲ್ಲಾ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
