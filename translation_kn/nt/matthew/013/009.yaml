translation:
  language: kn
  text: ಕಿವಿಗಳಿರುವವನು ಕೇಳಲಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ, ಹೆಚ್ಚು ಒಳಗೊಳ್ಳುವ ರೀತಿಯಲ್ಲಿ: “ಕಿವಿಗಳಿರುವವರು ಕೇಳಲಿ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ಇರುವವನು
  rationale: ನಿರ್ದಿಷ್ಟ ಗುಣವನ್ನು ಹೊಂದಿರುವ ಯಾವುದೇ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವ substantival present participle-ನ ಏಕವಚನ ಪ್ರತಿನಿಧಿಕ ಬಲವನ್ನು ಕನ್ನಡದ ‘ಇರುವವನು’ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὦτα
  choice: ಕಿವಿಗಳು
  rationale: ಗ್ರೀಕ್ ಪದವು ಬಹುವಚನದಲ್ಲಿದೆ; ಕನ್ನಡದಲ್ಲಿಯೂ ಈ ನುಡಿಗಟ್ಟಿನಲ್ಲಿ ‘ಕಿವಿಗಳು’ ನೇರವೂ ಸಹಜವೂ ಆಗಿದೆ.
- source_word: ἀκουέτω
  choice: ಕೇಳಲಿ
  rationale: ಮೂರನೆಯ ಪುರುಷ ಏಕವಚನದ ವರ್ತಮಾನ ಆಜ್ಞಾರ್ಥಕದ ಪ್ರೇರಣಾತ್ಮಕ ಬಲವನ್ನು ‘ಕೇಳಲಿ’ ಉಳಿಸುತ್ತದೆ; ಸನ್ನಿವೇಶದಲ್ಲಿ ಇದು ಶಬ್ದವನ್ನು ಆಲಿಸುವುದಕ್ಕಿಂತ ಗಮನಕೊಟ್ಟು ಗ್ರಹಿಸುವುದನ್ನೂ ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಸಾಮಾನ್ಯಾರ್ಥಕ ಅಭಿವ್ಯಕ್ತಿ
  choice: ಕಿವಿಗಳಿರುವವನು ಕೇಳಲಿ.
  alternative: ಕಿವಿಗಳಿರುವವರು ಕೇಳಲಿ.
  rationale: ಗ್ರೀಕ್ ವ್ಯಾಕರಣದಲ್ಲಿ ಪುಲ್ಲಿಂಗ ಏಕವಚನವಿದ್ದರೂ ಅದು ಸಾಮಾನ್ಯವಾಗಿ ಯಾವುದೇ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಮುಖ್ಯ ಪಾಠವು ಮೂಲದ ಏಕವಚನ ಪ್ರತಿನಿಧಿಕ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರ್ಯಾಯ ಬಹುವಚನವು ಕನ್ನಡದಲ್ಲಿ ಹೆಚ್ಚು ಒಳಗೊಳ್ಳುವ ರೀತಿಯಲ್ಲಿ ಅದೇ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ, ಘನ ಮತ್ತು ಸಹಜವಾದ ಯೇಸುವಿನ ಪ್ರೇರಣಾತ್ಮಕ ನುಡಿಗಟ್ಟನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಕೇಳಲಿ’ ಎಂಬುದು ಇಲ್ಲಿ ಗಮನವಿಟ್ಟು ಸ್ವೀಕರಿಸುವ ಅರ್ಥವನ್ನೂ ಹೊರುತ್ತದೆ.
