revisions:
- from: ಮನುಷ್ಯಕುಮಾರನು ತನ್ನ ದೂತರನ್ನು ಕಳುಹಿಸುವನು. ಅವರು ಅವನ ರಾಜ್ಯದೊಳಗಿಂದ ಪಾಪಕ್ಕೆ ಎಡೆಮಾಡಿಕೊಡುವ ಎಲ್ಲವನ್ನೂ[a] ಮತ್ತು ಅಧರ್ಮವನ್ನು ಆಚರಿಸುವವರನ್ನೂ[b] ಒಟ್ಟುಗೂಡಿಸುವರು.
