id: MAT.13.41
reference: Matthew 13:41
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: kn
  text: ಮನುಷ್ಯಕುಮಾರನು ತನ್ನ ದೂತರನ್ನು ಕಳುಹಿಸುವನು. ಅವರು ಅವನ ರಾಜ್ಯದಿಂದ ಪಾಪಕ್ಕೆ ಎಡೆಮಾಡುವ ಎಲ್ಲವನ್ನೂ[a] ಮತ್ತು ಅಧರ್ಮವನ್ನು ಮಾಡುವವರನ್ನೂ[b] ಸಂಗ್ರಹಿಸುವರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಎಡವಿಸುವ ಎಲ್ಲ ಅಡ್ಡಿಗಳನ್ನೂ.’ ಗ್ರೀಕ್ ಪದವು ಜನರು ಪಾಪಮಾಡಲು ಅಥವಾ ನಂಬಿಕೆಯಿಂದ ದೂರವಾಗಲು ಕಾರಣವಾಗುವ ಸಂಗತಿಗಳು ಅಥವಾ ಪ್ರಭಾವಗಳನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
  - marker: b
    text: ಅಕ್ಷರಶಃ, ‘ಅಧರ್ಮವನ್ನು ಮಾಡುವವರನ್ನೂ.’ ಈ ಪದಪ್ರಯೋಗವು ಮುಂದುವರಿಯುವ, ಸ್ವಭಾವಸೂಚಕವಾದ ಅಧರ್ಮದ ನಡತೆಯನ್ನು ಒತ್ತಿಹೇಳುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: ಕಳುಹಿಸುವನು
  rationale: ಭವಿಷ್ಯಕಾಲದ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ದೂತರನ್ನು ಕಾರ್ಯಕ್ಕಾಗಿ ಕಳುಹಿಸುವ ಸಂದರ್ಭದಿಂದ ನಿಯೋಗದ ಅರ್ಥವೂ ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ಮನುಷ್ಯಕುಮಾರನು
  rationale: ಮತ್ತಾಯನಲ್ಲಿನ ಸ್ಥಿರವಾದ ಬಿರುದು ಮತ್ತು ದಾನಿಯೇಲ ಗ್ರಂಥದ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಉಳಿಸುವ ಪರಿಚಿತ ಕನ್ನಡ ರೂಪ.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: ತನ್ನ ದೂತರನ್ನು
  rationale: ಈ ಅಂತ್ಯಕಾಲದ ನ್ಯಾಯತೀರ್ಪಿನ ಸಂದರ್ಭದಲ್ಲಿ ἄγγελοι ಮಾನವ ಸಂದೇಶವಾಹಕರಿಗಿಂತ ಪರಲೋಕದ ದೂತರನ್ನೇ ಸೂಚಿಸುತ್ತದೆ; ಕರ್ತೃಗೆ ಸಂಬಂಧಿಸಿದ ಪ್ರತಿಫಲಕ ಸ್ವಾಮ್ಯವನ್ನು ‘ತನ್ನ’ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: συλλέξουσιν
  choice: ಒಟ್ಟುಗೂಡಿಸುವರು
  rationale: ಸುತ್ತಲಿನ ಕೊಯ್ಲು ಮತ್ತು ನ್ಯಾಯತೀರ್ಪಿನ ರೂಪಕಕ್ಕೆ ಹೊಂದುವಂತೆ ‘ಕೂಡಿಸು/ಸಂಗ್ರಹಿಸು’ ಎಂಬ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: ಅವನ ರಾಜ್ಯದೊಳಗಿಂದ
  rationale: ἐκ ಸೂಚಿಸುವ, ರಾಜ್ಯದ ಒಳಗಿನಿಂದ ಹೊರತೆಗೆದು ಕೂಡಿಸುವ ದಿಕ್ಕನ್ನು ‘ಒಳಗಿಂದ’ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πάντα τὰ σκάνδαλα
  choice: ಪಾಪಕ್ಕೆ ಎಡೆಮಾಡಿಕೊಡುವ ಎಲ್ಲವನ್ನೂ
  rationale: σκάνδαλα ಜನರನ್ನು ಪಾಪಕ್ಕೆ ಅಥವಾ ನಂಬಿಕೆಯಿಂದ ಬೀಳುವಂತೆ ಮಾಡುವ ವ್ಯಕ್ತಿಗಳು, ಪ್ರಭಾವಗಳು ಅಥವಾ ಸಂಗತಿಗಳನ್ನು ಒಳಗೊಳ್ಳಬಹುದು. ಈ ವಿಶಾಲ ವ್ಯಾಪ್ತಿಯನ್ನು ವ್ಯಕ್ತಪಡಿಸಿ, ಕೇವಲ ಮನನೋಯಿಸುವ ‘ಅಪರಾಧ’ ಎಂಬ ಅರ್ಥಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: ಅಧರ್ಮವನ್ನು ಆಚರಿಸುವವರನ್ನು
  rationale: ವರ್ತಮಾನಕಾಲದ ಕೃದಂತವು ಮುಂದುವರಿಯುವ ಅಥವಾ ಸ್ವಭಾವಸೂಚಕ ನಡತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆಚರಿಸುವವರು’ ಅದನ್ನು ಹಿಡಿದಿಡುತ್ತದೆ. ‘ಅಧರ್ಮ’ ἀνομίαಯ ನಿಯಮವಿರೋಧಿ ನೈತಿಕ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου ಎಂಬ ಬಿರುದಿನ ಅನುವಾದ
  choice: ಮನುಷ್ಯಕುಮಾರನು
  alternative: ಮಾನವಪುತ್ರನು / ಮಾನವನಾದವನು
  rationale: ಸಾಂಪ್ರದಾಯಿಕ ಮತ್ತು ಪರಿಚಿತ ರೂಪವು ಯೇಸುವಿನ ಬಿರುದನ್ನೂ ದಾನಿಯೇಲ 7ರ ಅಪೋಕಾಲಿಪ್ಟಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನೂ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕವಾಗಿ ಸರಳೀಕರಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- issue: ನ್ಯಾಯತೀರ್ಪಿನ ಸಂದರ್ಭದಲ್ಲಿ σκάνδαλα ಪದದ ವ್ಯಾಪ್ತಿ
  choice: ಪಾಪಕ್ಕೆ ಎಡೆಮಾಡಿಕೊಡುವ ಎಲ್ಲವೂ
  alternative: ಎಡವಿಸುವ ಎಲ್ಲ ಅಡ್ಡಿಗಳು
  rationale: ಮೂಲಪದವು ವ್ಯಕ್ತಿಗಳು, ಸಂಗತಿಗಳು ಅಥವಾ ಪ್ರಭಾವಗಳನ್ನು ಸೂಚಿಸಬಹುದಾದ ನಿಜವಾದ ವ್ಯಾಪ್ತಿಯನ್ನು ವಿಶಾಲವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಅದನ್ನು ಕೇವಲ ಭಾವನಾತ್ಮಕ ಮನನೋವಿಗೆ ಸೀಮಿತಗೊಳಿಸಲಾಗಿಲ್ಲ.
- issue: ἀνομίαಯ ನೈತಿಕ-ದೈವಶಾಸ್ತ್ರೀಯ ಅರ್ಥ
  choice: ಅಧರ್ಮ
  alternative: ನಿಯಮಲಂಘನೆ
  rationale: ‘ಅಧರ್ಮ’ ದೇವರ ಚಿತ್ತ ಮತ್ತು ನಿಯಮಕ್ಕೆ ವಿರುದ್ಧವಾದ ನಡತೆಯ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಆದರೆ ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ‘ದೇವರ ನಿಯಮ’ ಎಂಬ ಪದಗಳನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯವನ್ನು ಓದಲು ಸುಲಭವಾಗುವಂತೆ ಎರಡು ವಾಕ್ಯಗಳಾಗಿ ವಿಭಜಿಸಲಾಗಿದೆ. ‘ಮನುಷ್ಯಕುಮಾರನು,’ ‘ದೂತರು,’ ‘ರಾಜ್ಯ,’ ಮತ್ತು ‘ಅಧರ್ಮ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಗಳನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅಪರೂಪದ ಅಥವಾ ಪಂಥೀಯ ಪದಪ್ರಯೋಗಗಳನ್ನು ತಪ್ಪಿಸಲಾಗಿದೆ. ಒದಗಿಸಲಾದ ಇಂಗ್ಲಿಷ್ ಪಠ್ಯದಲ್ಲಿ [a] ಗುರುತು ‘angels’ ನಂತರ ತಪ್ಪಾಗಿ ಕಾಣಿಸಿಕೊಂಡರೂ ಅದರ ಟಿಪ್ಪಣಿ σκάνδαλαಗೆ ಸೇರಿರುವುದರಿಂದ, ಕನ್ನಡ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ [a] ಗುರುತನ್ನು ಸರಿಯಾದ ಪದಗುಚ್ಛದ ನಂತರ ಇರಿಸಲಾಗಿದೆ.
