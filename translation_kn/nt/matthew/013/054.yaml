revisions:
- from: ಅವನು ತನ್ನ ಸ್ವಂತ ಊರಿಗೆ ಬಂದು, ಅವರ ಸಭಾಮಂದಿರದಲ್ಲಿ ಅವರಿಗೆ ಬೋಧಿಸುತ್ತಿದ್ದನು. ಆಗ ಅವರು ಬೆರಗಾಗಿ, “ಇವನಿಗೆ ಈ ಜ್ಞಾನವೂ ಈ ಶಕ್ತಿಯ ಕಾರ್ಯಗಳೂ[a] ಎಲ್ಲಿಂದ ಬಂದವು?” ಎಂದು ಕೇಳಿದರು.
  to: ಅವನು ತನ್ನ ಊರಿಗೆ ಬಂದು, ಅವರ ಸಭಾಮಂದಿರದಲ್ಲಿ ಅವರಿಗೆ ಬೋಧಿಸುತ್ತಿದ್ದನು. ಅದರಿಂದ ಅವರು ಬೆರಗಾಗಿ, “ಇವನಿಗೆ ಈ ಜ್ಞಾನವೂ ಈ ಶಕ್ತಿಗಳೂ[a] ಎಲ್ಲಿಂದ ಬಂದವು?” ಎಂದು ಕೇಳಿದರು.
  rationale: The revision retains the imperfect sense of ‘was teaching,’ clarifies the result relationship, and uses more idiomatic wording for Jesus’ hometown. Most importantly, it renders δυνάμεις as ‘ಶಕ್ತಿಗಳು’ in the text, preserving the Greek term’s lexical openness and the English POB’s decision, while the footnote supplies the contextual alternative ‘powerful deeds’ without imposing it on the verse.
