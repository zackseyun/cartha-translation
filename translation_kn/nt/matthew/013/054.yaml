id: MAT.13.54
reference: Matthew 13:54
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: kn
  text: ಅವನು ತನ್ನ ಊರಿಗೆ ಬಂದು, ಅವರ ಸಭಾಮಂದಿರದಲ್ಲಿ ಅವರಿಗೆ ಬೋಧಿಸುತ್ತಿದ್ದನು. ಅದರಿಂದ ಅವರು ಬೆರಗಾಗಿ, “ಇವನಿಗೆ ಈ ಜ್ಞಾನವೂ ಈ ಶಕ್ತಿಗಳೂ[a] ಎಲ್ಲಿಂದ ಬಂದವು?” ಎಂದು ಕೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ “ಶಕ್ತಿಗಳು”; ‘ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು’ ಎಂದೂ ಅನುವಾದಿಸಬಹುದು, ಅಂದರೆ ಶಕ್ತಿಯನ್ನು ತೋರಿಸುವ ಕಾರ್ಯಗಳು, ಸಾಮಾನ್ಯವಾಗಿ ಅದ್ಭುತಗಳೆಂದು ತಿಳಿಯಲಾಗುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: ಸ್ವಂತ ಊರು
  rationale: ಈ ಕಥನದ ಸಂದರ್ಭದಲ್ಲಿ ಇದು ಅವನು ಬೆಳೆದ ಮತ್ತು ಸ್ಥಳೀಯರಿಗೆ ಪರಿಚಿತನಾಗಿದ್ದ ಊರನ್ನು ಸೂಚಿಸುತ್ತದೆ; ದೇಶ ಅಥವಾ ವಿಶಾಲ ತಾಯ್ನಾಡನ್ನು ಅಲ್ಲ.
- source_word: ἐδίδασκεν
  choice: ಬೋಧಿಸುತ್ತಿದ್ದನು
  rationale: ಗ್ರೀಕ್ ಅಪೂರ್ಣ ಭೂತಕಾಲವು ಹಿಂದೆ ನಡೆಯುತ್ತಿದ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ಈ ರೂಪವು ಆ ಮುಂದುವರಿದ ಅಂಶವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: συναγωγῇ
  choice: ಸಭಾಮಂದಿರ
  rationale: ಯೆಹೂದ್ಯರ ಆರಾಧನೆ ಮತ್ತು ಬೋಧನೆಯ ನಿರ್ದಿಷ್ಟ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ, ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿರುವ ಪದ.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: ಆಗ ಅವರು ಬೆರಗಾಗಿ ... ಎಂದು ಕೇಳಿದರು
  rationale: ὥστε ಸೂಚಿಸುವ ಫಲಿತಾಂಶವನ್ನು ಸಹಜ ಕನ್ನಡ ವಾಕ್ಯರಚನೆಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ἐκπλήσσομαιಯ ಬಲವಾದ ಆಶ್ಚರ್ಯಭಾವವನ್ನು ‘ಬೆರಗಾಗಿ’ ಉಳಿಸುತ್ತದೆ.
- source_word: Πόθεν
  choice: ಎಲ್ಲಿಂದ ಬಂದವು
  rationale: ಜ್ಞಾನ ಮತ್ತು ಶಕ್ತಿಯ ಕಾರ್ಯಗಳ ಮೂಲವನ್ನು ಪ್ರಶ್ನಿಸುವ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τούτῳ
  choice: ಇವನಿಗೆ
  rationale: ಪ್ರದರ್ಶನಾತ್ಮಕ ಸರ್ವನಾಮದಲ್ಲಿರುವ ಸ್ವಲ್ಪ ದೂರವಿಡುವ ಅಥವಾ ತಿರಸ್ಕಾರಸೂಚಕ ಧ್ವನಿಯನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: σοφία
  choice: ಜ್ಞಾನ
  rationale: ಇಲ್ಲಿ ಕೇಳುವವರು ಗುರುತಿಸಿದ ಅಸಾಧಾರಣ ತಿಳಿವಳಿಕೆ ಮತ್ತು ಬೋಧನಾ ಸಾಮರ್ಥ್ಯವನ್ನು ಸೂಚಿಸುವ ನೇರ ಹಾಗೂ ಸಹಜ ಪದ.
- source_word: δυνάμεις
  choice: ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು
  rationale: ಪದದ ಮೂಲ ‘ಶಕ್ತಿಗಳು’ ಎಂಬ ಅರ್ಥವನ್ನೂ, ಇಲ್ಲಿ ಶಕ್ತಿಯನ್ನು ಪ್ರಕಟಿಸುವ ಅಸಾಧಾರಣ ಕೃತಿಗಳನ್ನು ಸೂಚಿಸುವ ಸಂದರ್ಭಾರ್ಥವನ್ನೂ ಒಟ್ಟಿಗೆ ಉಳಿಸುತ್ತದೆ; ‘ಅದ್ಭುತಗಳು’ ಎಂದು ಮಾತ್ರ ಹೇಳಿ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸಂಕುಚಿತಗೊಳಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಅಸಾಧಾರಣ ಕಾರ್ಯಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ δυνάμεις ಪದದ ಅನುವಾದ
  choice: ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು
  alternative: ಅದ್ಭುತಗಳು; ಶಕ್ತಿಗಳು
  rationale: ಈ ರೂಪವು ಗ್ರೀಕ್ ಪದದ ‘ಶಕ್ತಿ’ ಎಂಬ ಅರ್ಥವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಬಹುವಚನವು ಇಲ್ಲಿ ಶಕ್ತಿಯನ್ನು ತೋರಿಸುವ ಕಾರ್ಯಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ. ಅದನ್ನು ಕೇವಲ ತಾಂತ್ರಿಕ ಅರ್ಥದ ‘ಅದ್ಭುತಗಳು’ ಎಂದು ನಿರ್ಧರಿಸುವುದನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಇವನಿಗೆ’ ಎಂಬುದು ಜನರ ಮಾತಿನಲ್ಲಿರುವ ದೂರವಿಡುವ ಧ್ವನಿಯನ್ನು ಉಳಿಸುತ್ತದೆ. ಪಾದಟಿಪ್ಪಣಿ ಗುರುತನ್ನು ಅದು ವಿವರಿಸುವ ‘ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು’ ಎಂಬ ಪದಬಂಧದ ಬಳಿಯೇ ಇರಿಸಲಾಗಿದೆ.
