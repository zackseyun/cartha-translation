    rationale: 'Kannada more naturally places the agent before the verb in this short statement: “ಇದನ್ನು ಒಬ್ಬ ವೈರಿಯು ಮಾಡಿದ್ದಾನೆ.” This retains the Greek sense without changing emphasis materially.'
