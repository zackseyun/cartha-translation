id: MAT.13.28
reference: Matthew 13:28
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: kn
  text: ಅವನು ಅವರಿಗೆ, “ಇದನ್ನು ಒಬ್ಬ ವೈರಿಯು ಮಾಡಿದ್ದಾನೆ” ಎಂದನು. ಆಗ ಆ ದಾಸರು[a] ಅವನಿಗೆ, “ಹಾಗಾದರೆ ನಾವು ಹೋಗಿ ಅವುಗಳನ್ನು ಕೂಡಿಸಬೇಕೆಂದು ನೀವು ಬಯಸುತ್ತೀರಾ?” ಎಂದು ಕೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಸೇವಕರು.” ಗ್ರೀಕ್‌ನ δοῦλοι (ದೂಲೊಯ್) ಎಂಬ ಪದವು ಸಂದರ್ಭಕ್ಕೆ ಅನುಗುಣವಾಗಿ “ದಾಸರು” ಅಥವಾ “ಸೇವಕರು” ಎಂದರ್ಥವಾಗಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: ಎಂದನು
  rationale: ಕಥನದಲ್ಲಿನ ನೇರ ಮಾತನ್ನು ಸಹಜವಾಗಿ ಪರಿಚಯಿಸುವ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಕ್ರಿಯಾಪದ.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: ಒಬ್ಬ ವೈರಿ
  rationale: ἄνθρωπος ವ್ಯಕ್ತಿಯನ್ನು ನಿರ್ದಿಷ್ಟಗೊಳಿಸುತ್ತದೆ; ಕನ್ನಡದ ‘ಒಬ್ಬ ವೈರಿ’ ಎಂಬುದು ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: τοῦτο ἐποίησεν
  choice: ಇದನ್ನು ಮಾಡಿದ್ದು
  rationale: τοῦτο ಎಂಬ ಸೂಚಕದ ಬಲವನ್ನೂ, ನಡೆದ ಕೃತ್ಯವನ್ನು ಸೂಚಿಸುವ aorist ರೂಪವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: δοῦλοι
  choice: ದಾಸರು
  rationale: ಯಜಮಾನನ ಅಧೀನದಲ್ಲಿರುವವರ ಸಾಮಾಜಿಕ ಸ್ಥಿತಿಯನ್ನು ‘ದಾಸರು’ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಸೇವಕರು’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: Θέλεις
  choice: ನಿಮಗೆ ಇಷ್ಟವೇ
  rationale: ಬಯಕೆ ಅಥವಾ ಇಚ್ಛೆಯನ್ನು ಸೂಚಿಸುವ θέλω ಅನ್ನು ಸಂಭಾಷಣೆಗೆ ಸಹಜವಾದ ಗೌರವಪೂರ್ವಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: οὖν
  choice: ಹಾಗಾದರೆ
  rationale: ಯಜಮಾನನು ನೀಡಿದ ವಿವರಣೆಯಿಂದ ದಾಸರ ಪ್ರಶ್ನೆಗೆ ಸಾಗುವ ನಿರ್ಣಯಾತ್ಮಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἀπελθόντες
  choice: ನಾವು ಹೋಗಿ
  rationale: ಹೋಗುವುದರ ನಂತರ ಕೂಡಿಸುವ ಕ್ರಿಯೆ ನಡೆಯುವುದನ್ನು ಸಹಜ ಕನ್ನಡ ಸರಣಿಕ್ರಿಯೆಯ ಮೂಲಕ ಉಳಿಸುತ್ತದೆ.
- source_word: συλλέξωμεν
  choice: ಒಟ್ಟುಗೂಡಿಸಬೇಕೆಂದು
  rationale: ಕಳೆಗಳನ್ನು ಕೀಳುವುದನ್ನು ಮುಂದಿನ ವಚನವೇ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದರಿಂದ, ಇಲ್ಲಿ συλλέγω ಪದದ ‘ಕೂಡಿಸು’ ಎಂಬ ಅರ್ಥವನ್ನು ಮಾತ್ರ ಉಳಿಸಿ ಅನಗತ್ಯ ವಿವರವನ್ನು ಸೇರಿಸಿಲ್ಲ.
- source_word: αὐτά
  choice: ಅವುಗಳನ್ನು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಹಿಂದಿನ ವಚನದ ಕಳೆಗಳನ್ನು ಸೂಚಿಸುವ neuter plural ಸರ್ವನಾಮಕ್ಕೆ ಸಹಜವಾದ ಕನ್ನಡ ಬಹುವಚನ ರೂಪ.
theological_decisions:
- issue: ದೃಷ್ಟಾಂತದ ಸಂದರ್ಭದಲ್ಲಿ δοῦλοι ಪದದ ಅನುವಾದ
  choice: ದಾಸರು
  alternative: ಸೇವಕರು
  rationale: ಈ ಪದವು ಯಜಮಾನನ ಅಧೀನದಲ್ಲಿರುವವರನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ದಾಸರು’ ಮೂಲದ ಸಾಮಾಜಿಕ ಶ್ರೇಣಿಯನ್ನು ಹೆಚ್ಚು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ. ಆದರೆ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಕೆಲಸ ಮಾಡುವ ಮನೆಯ ಅಥವಾ ಹೊಲದ ಸೇವಕರ ಅರ್ಥವೂ ಸಾಧ್ಯವಾದ್ದರಿಂದ ಅದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಯಜಮಾನನನ್ನು ಉದ್ದೇಶಿಸುವ ಮಾತಿನಲ್ಲಿ ಸಾಮಾಜಿಕ ಗೌರವಕ್ಕೆ ಸಹಜವಾದ ‘ನಿಮಗೆ’ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ; ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸಂಬೋಧಿತ ವ್ಯಕ್ತಿ ಏಕವಚನದಲ್ಲಿದ್ದಾನೆ.
