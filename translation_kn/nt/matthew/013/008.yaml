id: MAT.13.8
reference: Matthew 13:8
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: kn
  text: 'ಆದರೆ ಇತರ ಬೀಜಗಳು ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ ಬಿದ್ದು ಫಲ ಕೊಡುತ್ತಿದ್ದವು: ಕೆಲವು ನೂರು ಪಟ್ಟು, ಕೆಲವು ಅರವತ್ತು ಪಟ್ಟು, ಇನ್ನೂ ಕೆಲವು ಮೂವತ್ತು ಪಟ್ಟು.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ಹೆಚ್ಚು ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ, “ಕೆಲವು ನೂರು ಪಟ್ಟು, ಕೆಲವು ಅರವತ್ತು ಪಟ್ಟು, ಕೆಲವು ಮೂವತ್ತು ಪಟ್ಟು.” ಗ್ರೀಕ್‌ನ ವಿತರಣಾತ್ಮಕ ರಚನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ “ಕೆಲವು... ಕೆಲವು... ಕೆಲವು” ಅಥವಾ “ಕೆಲವು... ಕೆಲವು... ಇನ್ನೂ ಕೆಲವು” ಎಂದು ವ್ಯಕ್ತಪಡಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ಬೇರೆ ಬೀಜಗಳು
  rationale: ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನ ವಿಶೇಷಣವು ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಬೀಜಗಳನ್ನು ಸೂಚಿಸುವ ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದೆ; ಕನ್ನಡದಲ್ಲಿ ಅರ್ಥ ಸ್ಪಷ್ಟವಾಗಲು ‘ಬೀಜಗಳು’ ಎಂದು ಸೇರಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ಮಣ್ಣಿನ ವಿಧಗಳಲ್ಲಿ ಬೀಜಕ್ಕೆ ಉಂಟಾದ ಫಲಿತಾಂಶಗಳೊಂದಿಗೆ ಇರುವ ವ್ಯತ್ಯಾಸವನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ἔπεσεν
  choice: ಬಿದ್ದು
  rationale: ಮೂಲ ಕ್ರಿಯಾಪದದ ನೇರ ಅರ್ಥವಾದ ‘ಬೀಳುವುದು’ ಎಂಬ ಬಿತ್ತನೆಯ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ
  rationale: ಕೃಷಿಯ ಸಂದರ್ಭದಲ್ಲಿ γῆಗೆ ‘ಮಣ್ಣು’ ಸಹಜ ಮತ್ತು ನಿಖರ; καλὴν ಫಲವತ್ತಾದ ಅಥವಾ ಸೂಕ್ತವಾದ ಅರ್ಥದಲ್ಲಿ ‘ಒಳ್ಳೆಯ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: ἐδίδου καρπόν
  choice: ಫಲ ಕೊಡುತ್ತಿದ್ದವು
  rationale: ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯೆಯ ಮುಂದುವರಿದ ಸ್ವರೂಪವನ್ನು ‘ಕೊಡುತ್ತಿದ್ದವು’ ತೋರಿಸುತ್ತದೆ; ‘ಫಲ’ ಕೃಷಿಯ ಅರ್ಥವನ್ನೂ ರೂಪಕದ ಪರಿಚಿತ ಭಾಷೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ಕೆಲವು ನೂರರಷ್ಟು, ಕೆಲವು ಅರವತ್ತರಷ್ಟು, ಇನ್ನು ಕೆಲವು ಮೂವತ್ತರಷ್ಟು
  rationale: ಗ್ರೀಕ್‌ನ ವಿತರಣಾತ್ಮಕ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಕೆಲವು... ಕೆಲವು... ಇನ್ನು ಕೆಲವು’ ಎಂದು ನೀಡಲಾಗಿದೆ; ಸಂಖ್ಯೆಗಳು ಬೀಜದ ಇಳುವರಿಯ ಗುಣಿತ ಪ್ರಮಾಣವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘-ರಷ್ಟು’ ಬಳಸಲಾಗಿದೆ.
