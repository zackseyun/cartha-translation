  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಕೃಷಿ ಭಾಷೆ ಬಳಸಲಾಗಿದೆ. ಗ್ರೀಕ್‌ನ ಬಹುವಚನ ಸೂಚನೆ ಮತ್ತು ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಮುಂದುವರಿದ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ; ಪಂಥೀಯ ವ್ಯಾಖ್ಯಾನವನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
