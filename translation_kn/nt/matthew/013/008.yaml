- from: ಆದರೆ ಬೇರೆ ಬೀಜಗಳು ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ ಬಿದ್ದು ಫಲ ಕೊಡುತ್ತಿದ್ದವು—ಕೆಲವು ನೂರರಷ್ಟು, ಕೆಲವು ಅರವತ್ತರಷ್ಟು, ಇನ್ನು ಕೆಲವು ಮೂವತ್ತರಷ್ಟು.
  to: 'ಆದರೆ ಇತರ ಬೀಜಗಳು ಒಳ್ಳೆಯ ಮಣ್ಣಿನ ಮೇಲೆ ಬಿದ್ದು ಫಲ ಕೊಡುತ್ತಿದ್ದವು: ಕೆಲವು ನೂರು ಪಟ್ಟು, ಕೆಲವು ಅರವತ್ತು ಪಟ್ಟು, ಇನ್ನೂ ಕೆಲವು ಮೂವತ್ತು ಪಟ್ಟು.[a]'
  rationale: The revision replaces the less idiomatic “-ರಷ್ಟು” forms with standard Kannada yield multiples, makes the formal register slightly smoother, and adds an anchored note for the legitimate distributive rendering alternative reflected in the audit trail. It retains the plural seed reference and the ongoing/resultative nuance conveyed by “ಫಲ ಕೊಡುತ್ತಿದ್ದವು.”
