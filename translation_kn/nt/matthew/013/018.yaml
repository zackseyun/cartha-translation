  naturalness: ‘ಬಿತ್ತಿದವನ ಸಾಮ್ಯ’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸ್ವಲ್ಪ ಅಸ್ವಾಭಾವಿಕವಾಗಿದ್ದು, ಆ ವ್ಯಕ್ತಿಯ ಒಮ್ಮೆ ನಡೆದ ಕ್ರಿಯೆಯನ್ನೇ ಮುಖ್ಯವಾಗಿಸುವಂತೆ ಕೇಳಿಸುತ್ತದೆ. ‘ಬಿತ್ತುವವನ ಸಾಮ್ಯ’ ಕನ್ನಡದ ರೂಢಿಯಾದ, ಸ್ಪಷ್ಟವಾದ ಬಳಕೆ. ವಾಕ್ಯದಲ್ಲಿನ ‘ನೀವು’ಯನ್ನು ಉಳಿಸುವುದರಿಂದ ಮೂಲದ ಒತ್ತು ಕಾಪಾಡುತ್ತದೆ.
