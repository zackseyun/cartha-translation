  text: Ὑμεῖς οὖν ἀκούσατε τὴν παραβολὴν τοῦ ⸀σπείραντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: kn
  text: ಆದ್ದರಿಂದ, ನೀವು ಬಿತ್ತುವವನ ಸಾಮ್ಯವನ್ನು ಕೇಳಿರಿ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಕ್ಷರಶಃ, ‘ಬಿತ್ತಿದವನ ಸಾಮ್ಯವನ್ನು.’
    reason: ಗ್ರೀಕ್‌ನ ಅಯೋರಿಸ್ಟ್ ಕೃದಂತ σπείραντος‌ನ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ಕನ್ನಡ ರೂಪವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ನೀವು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಸರ್ವನಾಮವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಬಳಸಿ ಒತ್ತು ನೀಡಲಾಗಿದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ನೀವು’ ಎಂದು ಪ್ರತ್ಯೇಕವಾಗಿ ಹೇಳುವುದರಿಂದ ಬಹುವಚನ ಅರ್ಥವೂ ಒತ್ತೂ ಉಳಿಯುತ್ತವೆ.
- source_word: οὖν
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಮಾತಿನಿಂದ ಈಗಿನ ಸೂಚನೆಗೆ ಬರುವ ತಾರ್ಕಿಕ ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆದ್ದರಿಂದ’ ಈ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀκούσατε
  choice: ಕೇಳಿರಿ
  rationale: ಇದು ದ್ವಿತೀಯ ಪುರುಷ ಬಹುವಚನದ ಆಜ್ಞಾರ್ಥಕ ರೂಪ. ‘ಕೇಳಿರಿ’ ಮೂಲ ಕ್ರಿಯೆಯ ಅರ್ಥ ಮತ್ತು ಆಜ್ಞೆಯ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಅರ್ಥಮಾಡಿಕೊಳ್ಳಿರಿ’ ಎಂದರೆ ಮೂಲದಲ್ಲಿಲ್ಲದ ಅರ್ಥವನ್ನು ಸೇರಿಸಿದಂತಾಗುತ್ತದೆ.
- source_word: παραβολὴν
  choice: ಸಾಮ್ಯವನ್ನು
  rationale: ಯೇಸುವಿನ ಬೋಧನೆಯ ಈ ಸಾಹಿತ್ಯರೂಪಕ್ಕೆ ‘ಸಾಮ್ಯ’ ಕನ್ನಡದ ಪರಿಚಿತ ಮತ್ತು ಗೌರವಯುತ ಪದವಾಗಿದೆ.
- source_word: τοῦ σπείραντος
  choice: ಬಿತ್ತಿದವನ
  rationale: ನಿರ್ದಿಷ್ಟ ಪದದೊಂದಿಗೆ ಬಂದಿರುವ ಭೂತಕಾಲಿಕ ಕೃದಂತವು ಅಕ್ಷರಶಃ ‘ಬಿತ್ತಿದವನು’ ಎಂಬ ಅರ್ಥ ನೀಡುತ್ತದೆ. ಇದನ್ನು ಸ್ಥಿರ ಬಿರುದಾಗಿ ಮಾಡದೆ ಮೂಲದ ರೂಪವನ್ನು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
theological_decisions:
- issue: τοῦ σπείραντος ಎಂಬ ಷಷ್ಠೀ ವಿಭಕ್ತಿಯ ಸಂಬಂಧ
  choice: ಬಿತ್ತಿದವನ ಸಾಮ್ಯ
  alternative: ಬಿತ್ತಿದವನ ಕುರಿತ ಸಾಮ್ಯ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸಂಕ್ಷಿಪ್ತ ಷಷ್ಠೀ ಸಂಬಂಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಕುರಿತ’ ಎಂದು ಸೇರಿಸುವುದು ಸಾಧ್ಯವಾದ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿದರೂ, ಮೂಲದ ಸ್ವಲ್ಪ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನು ವಿವರಣಾತ್ಮಕವಾಗಿ ವಿಸ್ತರಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಗೌರವಯುತ ಬಹುವಚನ ಆಜ್ಞಾರ್ಥಕ ‘ಕೇಳಿರಿ’ ಬಳಸಲಾಗಿದೆ. ವಾಕ್ಯವು ಸಂಕ್ಷಿಪ್ತವಾಗಿದ್ದು, ಮೂಲದ ಒತ್ತು ಮತ್ತು ಸಂಭಾಷಣಾತ್ಮಕ ತಿರುವನ್ನು ಉಳಿಸುತ್ತದೆ.
