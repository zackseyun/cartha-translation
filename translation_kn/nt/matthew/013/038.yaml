source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: kn
  text: ಹೊಲವು ಲೋಕವಾಗಿದೆ; ಒಳ್ಳೆಯ ಬೀಜವೆಂದರೆ ರಾಜ್ಯದ ಪುತ್ರರು[b]; ಕಳೆಗಳು[a] ದುಷ್ಟನ ಪುತ್ರರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಇನ್ನಷ್ಟು ನಿರ್ದಿಷ್ಟವಾಗಿ, ‘ಡಾರ್ನೆಲ್’ ಎಂಬ ಗೋಧಿಯನ್ನು ಹೋಲುವ ಕಳೆ.
    reason: lexical_alternative
  - marker: b
    text: ಇಲ್ಲಿ ‘ಪುತ್ರರು’ ಎಂಬುದು ಸಂಬಂಧ ಮತ್ತು ಸೇರಿದಿಕೆಯನ್ನು ಸೂಚಿಸುವ ನುಡಿಗಟ್ಟು; ಅಂದರೆ ರಾಜ್ಯಕ್ಕೆ ಸೇರಿದವರು.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: ಹೊಲ
  rationale: ಕೃಷಿಯ ರೂಪಕವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುವ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಪದ.
- source_word: κόσμος
  choice: ಲೋಕ
  rationale: ಬಿತ್ತನೆ ನಡೆಯುವ ವಿಶಾಲ ಕ್ಷೇತ್ರವಾಗಿ ಇಡೀ ಲೋಕವನ್ನು ಸೂಚಿಸುವ ಸರಳ ಮತ್ತು ರೂಢಿಯಾದ ಪದ.
- source_word: καλὸν σπέρμα
  choice: ಒಳ್ಳೆಯ ಬೀಜ
  rationale: ಕೃಷಿ ರೂಪಕವನ್ನೂ ಕಳೆಗಳೊಂದಿಗಿನ ನೈತಿಕ ವ್ಯತ್ಯಾಸವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: οὗτοί εἰσιν
  choice: ಎಂದರೆ ... ಪುತ್ರರು
  rationale: ಏಕವಚನ ಸಮೂಹಾರ್ಥಕ ‘ಬೀಜ’ದಿಂದ ಅದು ಪ್ರತಿನಿಧಿಸುವ ಬಹುವಚನ ವ್ಯಕ್ತಿಗಳ ಕಡೆಗಿನ ಗ್ರೀಕ್ ಬದಲಾವಣೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: υἱοὶ τῆς βασιλείας
  choice: ರಾಜ್ಯದ ಪುತ್ರರು
  rationale: ‘ಪುತ್ರರು’ ಎಂಬ ಸಂಬಂಧಸೂಚಕ ಮೂಲ ರೂಪವನ್ನೂ ಮತ್ತಾಯನ ‘ರಾಜ್ಯ’ ಪದಪ್ರಯೋಗವನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ζιζάνια
  choice: ಕಳೆಗಳು
  rationale: ಸಸ್ಯದ ನಿಖರ ಪ್ರಭೇದವನ್ನು ಖಚಿತಪಡಿಸದೆ, ಆಧುನಿಕ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಕೃಷಿಪದ; ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: τοῦ πονηροῦ
  choice: ದುಷ್ಟನ
  rationale: ನಿರ್ದಿಷ್ಟ ಗುಣವಾಚಕದ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ರೂಪವು ಇಲ್ಲಿ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ದುಷ್ಟನ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ; ಮೂಲದಲ್ಲಿಲ್ಲದ ‘ಸೈತಾನ’ ಎಂಬ ಗುರುತನ್ನು ನೇರವಾಗಿ ಸೇರಿಸಲಿಲ್ಲ.
theological_decisions:
- issue: τοῦ πονηροῦ ವ್ಯಕ್ತಿಗತವೋ ಅಥವಾ ಅಮೂರ್ತವಾದ ಕೆಡುಕನ್ನೋ ಸೂಚಿಸುತ್ತದೆಯೇ
  choice: ದುಷ್ಟನ
  alternative: ಕೆಡುಕಿನ
  rationale: ಲೇಖಸಹಿತ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಮತ್ತು ‘ಪುತ್ರರು’ ಎಂಬ ಸಂಬಂಧಪದವು ವ್ಯಕ್ತಿಗತ ಅರ್ಥವನ್ನು ಬಲವಾಗಿ ಬೆಂಬಲಿಸುತ್ತವೆ; ಆದರೂ ಅವನನ್ನು ಹೆಸರಿನಿಂದ ಗುರುತಿಸಿ ಪಠ್ಯಕ್ಕಿಂತ ಮುಂದೆ ಹೋಗಿಲ್ಲ.
- issue: υἱοὶ ಅನ್ನು ಲಿಂಗಸೂಚಕವಾಗಿ ಉಳಿಸಬೇಕೋ ಒಳಗೊಳ್ಳುವ ರೀತಿಯಲ್ಲಿ ಅನುವಾದಿಸಬೇಕೋ
  choice: ಪುತ್ರರು
  alternative: ಮಕ್ಕಳು / ಸೇರಿದವರು
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಬಹುವಚನವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಈ ಸಂಬಂಧಸೂಚಕ ನುಡಿಗಟ್ಟು ಯಾರನ್ನು ಒಳಗೊಳ್ಳುತ್ತದೆ ಎಂಬುದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ, ಘನ ಮತ್ತು ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಮೂರು ಸಮಾನಾಂತರ ವಿವರಣೆಗಳನ್ನು ಅರ್ಧವಿರಾಮ ಮತ್ತು ಪ್ರತ್ಯೇಕ ವಾಕ್ಯದ ಮೂಲಕ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ. ಇಂಗ್ಲಿಷ್ ಸಲಹಾ ಪಠ್ಯದಲ್ಲಿದ್ದ ಅಡಿಕುರಿಪು ಗುರುತುಗಳ ಅಸಂಗತ ಸ್ಥಾನಗಳನ್ನು ಮೂಲಪದಗಳಿಗೆ ಅನುಗುಣವಾಗಿ ಸರಿಪಡಿಸಲಾಗಿದೆ.
