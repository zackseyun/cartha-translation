id: MAT.13.13
reference: Matthew 13:13
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: kn
  text: ಈ ಕಾರಣಕ್ಕಾಗಿ ನಾನು ಅವರಿಗೆ ಸಾಮ್ಯಕಥೆಗಳಲ್ಲಿ ಮಾತನಾಡುತ್ತೇನೆ; ಏಕೆಂದರೆ ಅವರು ನೋಡುತ್ತಿದ್ದರೂ ನೋಡುವುದಿಲ್ಲ, ಕೇಳುತ್ತಿದ್ದರೂ ಕೇಳುವುದಿಲ್ಲ[a], ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದೂ ಇಲ್ಲ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಅಥವಾ ಹೆಚ್ಚು ಅಕ್ಷರಶಃ: “ನೋಡುತ್ತಾ ಅವರು ನೋಡುವುದಿಲ್ಲ; ಕೇಳುತ್ತಾ ಅವರು ಕೇಳುವುದಿಲ್ಲ.”'
    reason: ಗ್ರೀಕ್ ಕೃದಂತಗಳನ್ನು ವಿರೋಧಾರ್ಥಕ ‘ಇದ್ದರೂ’ ಎಂಬ ಸೂಚಕವನ್ನು ಸೇರಿಸದೆ ಹೆಚ್ಚು ರೂಪನಿಷ್ಠವಾಗಿ ಅನುವಾದಿಸುವ ಪರ್ಯಾಯವನ್ನು ದಾಖಲಿಸಲು.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ಆದುದರಿಂದ
  rationale: ಈ ಪದಗುಚ್ಛವು ಯೇಸು ಸಾಮ್ಯಕಥೆಗಳಲ್ಲಿ ಮಾತನಾಡುವುದಕ್ಕೆ ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ; ‘ಆದುದರಿಂದ’ ಕಾರಣಸಂಬಂಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν παραβολαῖς
  choice: ಸಾಮ್ಯಕಥೆಗಳ ಮೂಲಕ
  rationale: ἐν + ದತ್ತಿವಿಭಕ್ತಿಯು ಇಲ್ಲಿ ಮಾತಿನ ವಿಧಾನವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಸಾಮ್ಯಕಥೆಗಳ ಮೂಲಕ’ ಎಂಬುದು ಆ ವಿಧಾನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ದತ್ತಿವಿಭಕ್ತಿಯ ಸರ್ವನಾಮವನ್ನು ನೇರವಾಗಿ ಮತ್ತು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: λαλῶ
  choice: ಮಾತನಾಡುತ್ತೇನೆ
  rationale: ವರ್ತಮಾನಕಾಲದ ಸರಳ ಅರ್ಥವನ್ನು ಗೌರವಪೂರ್ಣವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ὅτι
  choice: ಏಕೆಂದರೆ
  rationale: ಇಲ್ಲಿ ὅτι ಹೇಳಿಕೆಯ ವಿಷಯವನ್ನಲ್ಲ, ಹಿಂದಿನ ಕ್ರಿಯೆಯ ಕಾರಣವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: ನೋಡುತ್ತಿದ್ದರೂ ನೋಡುವುದಿಲ್ಲ
  rationale: ಕಣ್ಣಿಗೆ ಕಾಣುವುದಕ್ಕೂ ಅದರ ಅರ್ಥವನ್ನು ಗ್ರಹಿಸುವುದಕ್ಕೂ ಇರುವ ವಿರೋಧಾಭಾಸವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲು ಕೃದಂತಕ್ಕೆ concessive ಅರ್ಥವನ್ನು ನೀಡಲಾಗಿದೆ.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: ಕೇಳುತ್ತಿದ್ದರೂ ಕೇಳುವುದಿಲ್ಲ
  rationale: ಹಿಂದಿನ ಸಮಾಂತರ ರಚನೆ ಮತ್ತು ಅದರ ವಿರೋಧಾಭಾಸವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὐδὲ
  choice: …ವೂ ಇಲ್ಲ
  rationale: ನಿಷೇಧಾತ್ಮಕ ಸರಣಿಯ ಕೊನೆಯ ಅಂಶವನ್ನು ಕನ್ನಡದ ಸಹಜ ಸಮುಚ್ಚಯ ರೂಪದಲ್ಲಿ ಮುಂದುವರಿಸುತ್ತದೆ.
- source_word: συνίουσιν
  choice: ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದೂ ಇಲ್ಲ
  rationale: ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಅರ್ಥಪೂರ್ಣವಾಗಿ ಗ್ರಹಿಸದಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಪಠ್ಯದಲ್ಲಿಲ್ಲದ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾರ್ಥವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
theological_decisions:
- issue: βλέποντες ಮತ್ತು ἀκούοντες ಕೃದಂತಗಳ ಅರ್ಥಬಲ
  choice: ‘ನೋಡುತ್ತಿದ್ದರೂ’ ಮತ್ತು ‘ಕೇಳುತ್ತಿದ್ದರೂ’ ಎಂದು ವಿರೋಧಾರ್ಥಕವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಹೆಚ್ಚು ಅಕ್ಷರಶಃ ‘ನೋಡುತ್ತಾ’ ಮತ್ತು ‘ಕೇಳುತ್ತಾ’ ಎಂದು ಅನುವಾದಿಸಬಹುದು.
  rationale: ಗ್ರೀಕ್ ಕೃದಂತಗಳು ರೂಪತಃ ವಿರೋಧಾರ್ಥಕ ಸೂಚಕವಿಲ್ಲದೆ ಇದ್ದರೂ, ಸಂದರ್ಭದಲ್ಲಿನ ವಿರೋಧಾಭಾಸವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ತಿಳಿಸಲು ‘ಇದ್ದರೂ’ ಸೂಕ್ತ. ಅಕ್ಷರಶಃ ಸಾಧ್ಯತೆಯನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- issue: ಸಂದರ್ಭದಲ್ಲಿ συνίουσιν ಎಂಬುದರ ಅರ್ಥ
  choice: ‘ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದೂ ಇಲ್ಲ’
  alternative: ‘ಗ್ರಹಿಸುವುದೂ ಇಲ್ಲ’
  rationale: ಈ ವಾಕ್ಯವು ಬಾಹ್ಯವಾಗಿ ನೋಡುವುದು ಮತ್ತು ಕೇಳುವುದನ್ನು ಒಳಗಿನ ಅರ್ಥಗ್ರಹಣದೊಂದಿಗೆ ಹೋಲಿಸುತ್ತದೆ. ‘ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು’ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿದ್ದು, ಅವರ ಹೊಣೆಗಾರಿಕೆ ಅಥವಾ ಅಸಮರ್ಥತೆಯ ಕುರಿತು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ನಿರ್ಣಯಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಶೈಲಿಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಸಾಮ್ಯಕಥೆ’ ಸಾಮಾನ್ಯ ಬೈಬಲ್ ಬಳಕೆಗೆ ಹೊಂದುವ ಹಾಗೂ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಪದ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಕಾರಣಸಂಬಂಧ ಮತ್ತು ಮೂರು ಭಾಗಗಳ ನಿಷೇಧಾತ್ಮಕ ಸಮಾಂತರತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
