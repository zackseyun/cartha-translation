id: MAT.13.27
reference: Matthew 13:27
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: kn
  text: ಆಗ ಮನೆಯ ಯಜಮಾನನ ದಾಸರು ಅವನ ಬಳಿಗೆ ಬಂದು, “ಒಡೆಯನೇ, ನೀನು ನಿನ್ನ ಹೊಲದಲ್ಲಿ ಒಳ್ಳೆಯ ಬೀಜವನ್ನೇ ಬಿತ್ತಲಿಲ್ಲವೇ? ಹಾಗಾದರೆ ಕಳೆಗಿಡಗಳು[a] ಎಲ್ಲಿಂದ ಬಂದವು?” ಎಂದು ಕೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಡಾರ್ನೆಲ್ ಕಳೆಗಳು”; ಗ್ರೀಕ್ ಪದವು ಬೆಳವಣಿಗೆಯ ಆರಂಭಿಕ ಹಂತಗಳಲ್ಲಿ ಗೋಧಿಯನ್ನು ಹೋಲುವ ಡಾರ್ನೆಲ್ ಎಂಬ ಕಳೆಗಿಡವನ್ನು ಬಹುಶಃ ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: ಅವನ ಬಳಿಗೆ ಬಂದು
  rationale: ಯಜಮಾನನ ಕಡೆಗೆ ಬಂದ ಚಲನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ; ಇದು ಮುಖ್ಯ ಕ್ರಿಯೆಯಾದ ‘ಕೇಳಿದರು’ಗಿಂತ ಮುಂಚಿನ ಸಹಾಯಕ ಕ್ರಿಯೆಯಾಗಿದೆ.
- source_word: δοῦλοι
  choice: ದಾಸರು
  rationale: ಯಜಮಾನನ ಅಧೀನದಲ್ಲಿರುವ ಬಂಧಿತ ಗೃಹಕಾರ್ಮಿಕರ ಸಾಮಾಜಿಕ ಸ್ಥಿತಿಯನ್ನು ‘ಸೇವಕರು’ ಎಂಬುದಕ್ಕಿಂತ ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οἰκοδεσπότου
  choice: ಮನೆಯ ಯಜಮಾನನ
  rationale: ಮನೆಯ ಮೇಲಿನ ಅಧಿಕಾರ ಮತ್ತು ದಾಸರೊಂದಿಗೆ ಇರುವ ಯಜಮಾನ–ದಾಸ ಸಂಬಂಧ ಎರಡನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Κύριε
  choice: ಒಡೆಯನೇ
  rationale: ಈ ಸಾಮ್ಯದ ಸಂಭಾಷಣೆಯಲ್ಲಿ ಮನೆಯ ಯಜಮಾನನಿಗೆ ಸಲ್ಲಿಸುವ ಗೌರವಪೂರ್ಣ ಸಂಬೋಧನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ನೇರ ಕ್ರಿಸ್ತಶಾಸ್ತ್ರೀಯ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರದೆ κύριε ಎಂಬ ಪದದ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: οὐχὶ
  choice: ಬಿತ್ತಲಿಲ್ಲವೇ?
  rationale: ಹೌದೆಂಬ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಗ್ರೀಕ್ ಪ್ರಶ್ನೆಯ ಬಲವನ್ನು ಕನ್ನಡದ ನಕಾರಾತ್ಮಕ ಪ್ರಶ್ನಾರೂಪದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: καλὸν σπέρμα
  choice: ಒಳ್ಳೆಯ ಬೀಜ
  rationale: ಕೃಷಿ ಸಂದರ್ಭಕ್ಕೆ ಸರಳವೂ ನೇರವೂ ಆದ ಸಮಾನಾರ್ಥಕ.
- source_word: ἔσπειρας
  choice: ಬಿತ್ತಲು
  rationale: σπείρω ಪದದ ನಿರ್ದಿಷ್ಟ ಕೃಷಿಕ್ರಿಯೆಯನ್ನು ‘ನೆಡಲು’ ಎಂಬ ವಿಶಾಲ ಪದಕ್ಕಿಂತ ನಿಖರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ವಾಕ್ಯದಲ್ಲಿ ‘ಬಿತ್ತಲಿಲ್ಲವೇ’ ಎಂದು ರೂಪಿಸಲಾಗಿದೆ.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: ನಿನ್ನ ಹೊಲದಲ್ಲಿ
  rationale: ಸ್ವಾಮ್ಯವನ್ನೂ ಸ್ಥಳವನ್ನೂ ಸಂಕ್ಷಿಪ್ತವಾದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πόθεν οὖν
  choice: ಹಾಗಾದರೆ ... ಎಲ್ಲಿಂದ
  rationale: πόθεν ಸೂಚಿಸುವ ಮೂಲದ ಪ್ರಶ್ನೆಯನ್ನೂ οὖν ಸೂಚಿಸುವ ತಾರ್ಕಿಕ ನಿರ್ಣಯವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔχει ζιζάνια
  choice: ಕಳೆಗಿಡಗಳು ಎಲ್ಲಿಂದ ಬಂದವು
  rationale: ಗ್ರೀಕ್‌ನ ‘ಅದು ಕಳೆಗಿಡಗಳನ್ನು ಹೊಂದಿದೆ’ ಎಂಬ ರಚನೆಯನ್ನು ಪದಶಃ ಅನುಸರಿಸದೆ, ಕಳೆಗಳ ಮೂಲದ ಕುರಿತು ಕೇಳುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ζιζάνια
  choice: ಕಳೆಗಿಡಗಳು
  rationale: ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಮುಖ್ಯಪಾಠದ ಪದ; ಗೋಧಿಯನ್ನು ಹೋಲುವ ನಿರ್ದಿಷ್ಟ ಕಳೆ ಎಂಬ ಸಾಧ್ಯ ಅರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಸಾಮ್ಯದ ಗೃಹಸಂದರ್ಭದಲ್ಲಿ δοῦλοι ಪದದ ಅನುವಾದ
  choice: ದಾಸರು
  alternative: ಸೇವಕರು
  rationale: ವಚನವು ದಾಸ್ಯವ್ಯವಸ್ಥೆಯ ಕುರಿತು ಸಿದ್ಧಾಂತ ಬೋಧನೆ ಮಾಡದಿದ್ದರೂ, ಮೂಲಪದವು ಸೂಚಿಸುವ ಅಧೀನ ಮತ್ತು ಬಂಧಿತ ಸಾಮಾಜಿಕ ಸಂಬಂಧವನ್ನು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ.
- issue: κύριε ಎಂಬ ಸಂಬೋಧನೆಯ ಅನುವಾದ
  choice: ಒಡೆಯನೇ
  alternative: ಕರ್ತನೇ
  rationale: ಇಲ್ಲಿ ಪಾತ್ರಗಳು ಮನೆಯ ಯಜಮಾನನನ್ನು ಸಂಬೋಧಿಸುತ್ತಿದ್ದಾರೆ. ಆದ್ದರಿಂದ ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಗೌರವಪೂರ್ಣ ‘ಒಡೆಯನೇ’ ಎಂಬುದು ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಈ ಸಂಬೋಧನೆಗೆ ಅನಗತ್ಯವಾಗಿ ನೇರ ದೈವಿಕ ಅರ್ಥವನ್ನು ಹೇರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಪ್ರಶ್ನೆಯ ನಿರೀಕ್ಷಿತ ಸಕಾರಾತ್ಮಕ ಉತ್ತರವನ್ನು ‘ಬಿತ್ತಲಿಲ್ಲವೇ?’ ಎಂಬ ರೂಪವು ಉಳಿಸುತ್ತದೆ; ಕೊನೆಯ ಪ್ರಶ್ನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಸಲು ಮೂಲದ ಸ್ವಾಮ್ಯರಚನೆಯನ್ನು ಮೂಲದ ಅರ್ಥ ಕಳೆದುಕೊಳ್ಳದೆ ಮರುರೂಪಿಸಲಾಗಿದೆ.
