  source_fidelity: 'The translation accurately represents the Greek: the slaves approach the householder, respectfully address him, ask the expected-positive question about sowing good seed in his field, and then ask the origin of the weeds. The natural Kannada recasting of ἔχει ζιζάνια as “ಕಳೆಗಿಡಗಳು ... ಎಲ್ಲಿಂದ ಬಂದವು?” preserves the contextual force of the question without a misleadingly literal construction.'
