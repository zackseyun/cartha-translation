  terminology: “ದಾಸರು” appropriately retains the social force of δοῦλοι, while “ಮನೆಯ ಯಜಮಾನ” and “ಒಡೆಯನೇ” suitably distinguish the householder role and the respectful address. “ಕಳೆಗಿಡಗಳು” is clear in the text, and the footnote responsibly gives the likely darnel reference without overstating lexical certainty.
