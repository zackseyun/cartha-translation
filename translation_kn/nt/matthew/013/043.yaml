id: MAT.13.43
reference: Matthew 13:43
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: kn
  text: ಆಗ ನೀತಿವಂತರು ತಮ್ಮ ತಂದೆಯ ರಾಜ್ಯದಲ್ಲಿ ಸೂರ್ಯನಂತೆ ಪ್ರಕಾಶಿಸುವರು.[a] ಕಿವಿಗಳಿರುವವನು ಕೇಳಲಿ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಪ್ರಕಾಶಿಸಿ ಹೊಳೆಯುವರು.’
    reason: lexical_alternative
  - marker: b
    text: 'ಗ್ರೀಕ್‌ನಲ್ಲಿ ಈ ಕರೆ ಏಕವಚನದಲ್ಲಿದೆ: ‘ಕಿವಿಗಳಿರುವವನು ಕೇಳಲಿ’; ಇದು ಪ್ರತಿಯೊಬ್ಬರೂ ಗಮನಕೊಟ್ಟು ಕೇಳಬೇಕೆಂಬ ಪ್ರತಿನಿಧಿಕ ಕರೆ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ಆಗ
  rationale: ಹಿಂದಿನ ವಿವರಣೆಯ ಅಂತ್ಯಕಾಲದ ಕ್ರಮವನ್ನು ಸೂಚಿಸುವ ಸಹಜವಾದ ಕಾಲಸೂಚಕ ಪದ.
- source_word: οἱ δίκαιοι
  choice: ನೀತಿವಂತರು
  rationale: ನೀತಿವಂತರೆಂದು ಎಣಿಸಲ್ಪಟ್ಟವರನ್ನು ಸೂಚಿಸುವ ನಾಮಪದರೂಪದ ವಿಶೇಷಣಕ್ಕೆ ಕನ್ನಡದಲ್ಲಿ ರೂಢಿಯಾದ, ಧಾರ್ಮಿಕ ಹಾಗೂ ನೈತಿಕ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುವ ಪದ.
- source_word: ἐκλάμψουσιν
  choice: ಪ್ರಕಾಶಿಸುವರು
  rationale: ‘ಹೊರಹೊಮ್ಮಿ ಹೊಳೆಯುವರು/ಪ್ರಕಾಶಿಸುವರು’ ಎಂಬ ಭವಿಷ್ಯಕಾಲದ ಅರ್ಥವನ್ನು dignified modern Kannadaನಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಸೂರ್ಯನ ಉಪಮೆ ಪ್ರಖರತೆಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: ὡς ὁ ἥλιος
  choice: ಸೂರ್ಯನಂತೆ
  rationale: ὡς ಸೂಚಿಸುವ ಹೋಲಿಕೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನೇರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ βασιλείᾳ
  choice: ರಾಜ್ಯದಲ್ಲಿ
  rationale: ಇಲ್ಲಿನ ಸ್ಥಳಸೂಚಕ ರಚನೆಗೆ ‘ರಾಜ್ಯದಲ್ಲಿ’ ಸೂಕ್ತ; ರಾಜಾಳ್ವಿಕೆಯ ಅರ್ಥವನ್ನು ನಿರಾಕರಿಸದೆ ರಾಜ್ಯದ ವಲಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: ತಮ್ಮ ತಂದೆಯ
  rationale: αὐτῶν ಅನ್ನು ಕರ್ತೃವಾದ ‘ನೀತಿವಂತರು’ ಕಡೆಗೆ ಸಹಜವಾಗಿ ಹಿಂದಿರುಗಿಸುವ ಕನ್ನಡದ ಸ್ವಪ್ರತಿಬಿಂಬಕ ‘ತಮ್ಮ’ ಮೂಲಕ, ಮೂಲದ ‘ಅವರ ತಂದೆ’ ಎಂಬ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ‘ಪರಲೋಕದ’ ಎಂಬ ಮೂಲದಲ್ಲಿಲ್ಲದ ಪದವನ್ನು ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ὁ ἔχων ὦτα
  choice: ಕಿವಿಗಳಿರುವವನು
  rationale: ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಪ್ರತಿನಿಧಿಕ ಕರೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀκουέτω
  choice: ಕೇಳಲಿ
  rationale: ಮೂರನೆಯ ಪುರುಷ ಏಕವಚನದ ಆಜ್ಞಾರ್ಥಕ ಬಲವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ಶಬ್ದಗ್ರಹಣವಲ್ಲದೆ ಗಮನಕೊಟ್ಟು ಸ್ವೀಕರಿಸುವ ಕರೆಯನ್ನೂ ಸಂದರ್ಭವು ಹೊರುತ್ತದೆ.
theological_decisions:
- issue: ಕೊನೆಯ ಬೋಧನಾಕರೆಯ ಪ್ರತಿನಿಧಿಕ ಏಕವಚನ
  choice: ‘ಕಿವಿಗಳಿರುವವನು ಕೇಳಲಿ’ ಎಂದು ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ಕಿವಿಗಳಿರುವವರು ಕೇಳಲಿ’ ಅಥವಾ ‘ಕಿವಿಗಳಿರುವ ಪ್ರತಿಯೊಬ್ಬರೂ ಕೇಳಲಿ’
  rationale: ಗ್ರೀಕ್ ಪಾಠವು ಪುಲ್ಲಿಂಗ ಏಕವಚನದ participle ಮತ್ತು imperative ಅನ್ನು ಪ್ರತಿನಿಧಿಕವಾಗಿ ಬಳಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿಯೂ ಮೂಲದ ರೂಪ ಮತ್ತು ಗಂಭೀರ ಕರೆಯನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸಬಹುದು.
- issue: βασιλεία ಪದದ ಅರ್ಥ
  choice: ‘ರಾಜ್ಯ’
  alternative: ‘ಆಳ್ವಿಕೆ’
  rationale: ‘ತಮ್ಮ ತಂದೆಯ ರಾಜ್ಯದಲ್ಲಿ’ ಎಂಬ ಸ್ಥಳಸೂಚಕ ವಾಕ್ಯಬಂಧವು ಈ ಸಂದರ್ಭದ ಅಂತ್ಯಕಾಲೀನ ವಲಯದ ಚಿತ್ರಣಕ್ಕೆ ಹೆಚ್ಚು ಸರಿಹೊಂದುತ್ತದೆ; ಅದೇ ಸಮಯದಲ್ಲಿ ತಂದೆಯ ರಾಜಾಳ್ವಿಕೆಯನ್ನು ಹೊರತುಪಡಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾಗುವ ಶೈಲಿ. ‘ನೀತಿವಂತರು,’ ‘ರಾಜ್ಯ,’ ಮತ್ತು ‘ಕೇಳಲಿ’ ಎಂಬ ಬೈಬಲ್‌ಗೆ ಪರಿಚಿತವಾದ ಪದಗಳನ್ನು ಉಳಿಸಿಕೊಂಡಿದ್ದರೂ ವಾಕ್ಯರಚನೆಯನ್ನು ಅನಗತ್ಯವಾಗಿ ಪುರಾತನಗೊಳಿಸಲಾಗಿಲ್ಲ. ಎಲ್ಲ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿವೆ.
