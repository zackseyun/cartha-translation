review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys their offense at Jesus, the contrastive reply, the proverbial reference to a prophet, and the two local/domestic spheres. However, “ಪ್ರವಾದಿಗೆ ... ಗೌರವವಿರುವುದಿಲ್ಲ” reverses the Greek proverb’s marked formulation: οὐκ ἔστιν προφήτης ἄτιμος means “a prophet is not without honor, except ...,” not the unqualified statement that a prophet has no honor in those places. The latter may approximate the intended implication but loses the proverb’s rhetorical structure and can overstate it.'
  naturalness: “ಮುನಿಸಿಕೊಂಡರು” can mean became angry or sulked and is narrower than taking offense/stumbling over someone. “ಆತನ ವಿಷಯದಲ್ಲಿ ಅವರಿಗೆ ಅಡ್ಡಿಯಾಯಿತು” is unnatural, while “ಅವರು ಆತನ ನಿಮಿತ್ತ ಅಸಮಾಧಾನಗೊಂಡರು” is natural but less direct. “ಅವರು ಆತನನ್ನು ನೋಡಿ ಅಡ್ಡಿಬಿದ್ದರು” is not idiomatic. “ಅವರು ಆತನ ವಿಷಯದಲ್ಲಿ ತೊಂದರೆಗೊಂಡರು” is too weak. “ಅವರು ಆತನಿಂದ ಮನನೊಂದರು” is natural and adequately conveys offense; the footnote can preserve the literal idiom. The revised proverb is idiomatic modern Kannada.
  terminology: “ಯೇಸು,” “ಪ್ರವಾದಿ,” “ಗೌರವ,” “ತನ್ನ ಊರು,” and “ಮನೆಯವರ ನಡುವೆ” are appropriate. “ತನ್ನ ಊರಿನಲ್ಲಿ” naturally represents πατρίδι in this narrative context. “ಮನೆಯವರ ನಡುವೆ” reasonably chooses the household sense of οἰκίᾳ, with the footnote preserving the house/household range.
  issues:
  - severity: high
    issue: The main proverb is rendered as “ಪ್ರವಾದಿಗೆ ... ಮಾತ್ರ ಗೌರವವಿರುವುದಿಲ್ಲ.”
    rationale: This changes οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ from “A prophet is not without honor except ...” into “A prophet has no honor only ...”. Retaining the source’s negative-proverb form is both more faithful and less categorical.
  - severity: medium
    issue: “ಮುನಿಸಿಕೊಂಡರು” is overly specific for ἐσκανδαλίζοντο ἐν αὐτῷ.
    rationale: It foregrounds anger/sulking, whereas the Greek denotes taking offense or being stumbled/offended in relation to Jesus. “ಆತನಿಂದ ಮನನೊಂದರು” is a closer natural equivalent.
  revised_text: ಅವರು ಆತನಿಂದ ಮನನೊಂದರು.[a] ಆದರೆ ಯೇಸು ಅವರಿಗೆ, “ಪ್ರವಾದಿಯು ತನ್ನ ಊರಿನಲ್ಲಿ[b] ಮತ್ತು ತನ್ನ ಮನೆಯವರ ನಡುವೆ[c] ಹೊರತು ಗೌರವವಿಲ್ಲದವನಲ್ಲ” ಎಂದು ಹೇಳಿದನು.
