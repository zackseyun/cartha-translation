id: MAT.13.57
reference: Matthew 13:57
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: kn
  text: ಅವರು ಆತನಿಂದ ಮನನೊಂದರು.[a] ಆದರೆ ಯೇಸು ಅವರಿಗೆ, “ಪ್ರವಾದಿಯು ತನ್ನ ಊರಿನಲ್ಲಿ[b] ಮತ್ತು ತನ್ನ ಮನೆಯವರ ನಡುವೆ[c] ಹೊರತು ಗೌರವವಿಲ್ಲದವನಲ್ಲ” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಅವರು ಆತನ ವಿಷಯದಲ್ಲಿ ಅಸಮಾಧಾನಗೊಂಡರು”; ಅಕ್ಷರಶಃ, “ಅವರು ಆತನಲ್ಲಿ ಎಡವಿದರು.”
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ತನ್ನ ಹುಟ್ಟೂರಿನಲ್ಲಿ” ಅಥವಾ “ತನ್ನ ಸ್ವದೇಶದಲ್ಲಿ.”
    reason: lexical_alternative
  - marker: c
    text: ಅಥವಾ “ತನ್ನ ಸ್ವಂತ ಮನೆಯಲ್ಲಿ.” ಗ್ರೀಕ್ ಪದವು ಮನೆಯನ್ನು ಅಥವಾ ಮನೆಯವರು/ಕುಟುಂಬವಲಯವನ್ನು ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: ಆತನ ವಿಷಯದಲ್ಲಿ ಮುನಿಸಿಕೊಂಡರು
  rationale: ಇಲ್ಲಿ ಕ್ರಿಯಾಪದವು ಅಕ್ಷರಶಃ ಎಡವುವುದನ್ನು ಸೂಚಿಸುವುದಕ್ಕಿಂತ ಯೇಸುವಿನ ಕಾರಣದಿಂದ ಅಸಮಾಧಾನಗೊಂಡು ಆತನನ್ನು ತಿರಸ್ಕರಿಸುವ ಭಾವವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮುನಿಸಿಕೊಂಡರು’ ಎಂಬುದು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಆ ಸಂಬಂಧಾತ್ಮಕ ವಿರೋಧವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ಆದರೆ ಯೇಸು ಅವರಿಗೆ ... ಎಂದು ಹೇಳಿದನು
  rationale: δέ ಅವರ ಪ್ರತಿಕ್ರಿಯೆಗೆ ವಿರುದ್ಧವಾದ ಸೌಮ್ಯ ಸಂವಾದ ತಿರುವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: προφήτης
  choice: ಪ್ರವಾದಿ
  rationale: ಗುರುತಿಸಬಹುದಾದ ಪ್ರಮಾಣಿತ ಕನ್ನಡ ಪದ; ಗಾದೆಯ ನೇರ ಸ್ವರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: ἄτιμος
  choice: ಗೌರವವಿರುವುದಿಲ್ಲ
  rationale: οὐκ ... ἄτιμος ಎಂಬ ನಕಾರಾತ್ಮಕ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ಗೌರವವಿರುವುದಿಲ್ಲ’ ಎಂದು ಕೊಟ್ಟು, ಗೌರವ–ಅವಮಾನ ಆಯಾಮವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: εἰ μὴ
  choice: ಮಾತ್ರ
  rationale: ನಕಾರಾತ್ಮಕ ಮುಖ್ಯವಾಕ್ಯದೊಂದಿಗೆ ನಿರ್ದಿಷ್ಟ ವಲಯಗಳನ್ನು ಹೊರತಾಗಿಸುವ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಮಾತ್ರ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πατρίδι
  choice: ತನ್ನ ಊರಿನಲ್ಲಿ
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಇದು ವಿಶಾಲ ದೇಶಕ್ಕಿಂತ ಸ್ವಂತ ಊರು ಅಥವಾ ಹುಟ್ಟಿಬೆಳೆದ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ತನ್ನ ಊರು’ ಆ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: οἰκίᾳ αὐτοῦ
  choice: ತನ್ನ ಮನೆಯವರ ನಡುವೆ
  rationale: οἰκία ಮನೆ ಎಂಬ ಕಟ್ಟಡವನ್ನೂ ಮನೆಯವರು/ಕುಟುಂಬ ವಲಯವನ್ನೂ ಸೂಚಿಸಬಹುದು. ಗಾದೆಯ ಸಾಮಾಜಿಕ ಸಂದರ್ಭಕ್ಕೆ ‘ಮನೆಯವರ ನಡುವೆ’ ಸೂಕ್ತವಾದರೂ ಮೂಲದ ದ್ವಂದ್ವಾರ್ಥವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಗಾದೆಯಲ್ಲಿ ತಿರಸ್ಕಾರದ ವ್ಯಾಪ್ತಿ
  choice: ಪ್ರವಾದಿಗೆ ತನ್ನ ಸ್ಥಳೀಯ ಹಾಗೂ ಗೃಹವಲಯದಲ್ಲಿ ಗೌರವ ಸಿಗದಿರುವ ಸಾಮಾನ್ಯ ಗಾದೆಯಾಗಿ ಭಾಷಾಂತರಿಸಲಾಗಿದೆ.
  alternative: ಕುಟುಂಬದ ಅವಿಶ್ವಾಸವನ್ನೇ ನಿರ್ದಿಷ್ಟವಾಗಿ ಒತ್ತಿಹೇಳುವ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಭಾಷಾಂತರ.
  rationale: ಗ್ರೀಕ್ ಪಠ್ಯವು ಗೌರವದ ಕೊರತೆ ಮತ್ತು ಸ್ಥಳೀಯ ತಿರಸ್ಕಾರವನ್ನು ಹೇಳುತ್ತದೆ; ಯೇಸುವಿನ ತಿರಸ್ಕಾರದ ಕುರಿತು ಇದಕ್ಕಿಂತ ವಿಶಾಲವಾದ ಸೈದ್ಧಾಂತಿಕ ಹೇಳಿಕೆಯನ್ನು ಭಾಷಾಂತರಕ್ಕೆ ಸೇರಿಸುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸಹಜ, ಘನವಾದ ಗದ್ಯವನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಆತನು’ ಎಂಬ ಗೌರವಸೂಚಕ ಸರ್ವನಾಮ ಮತ್ತು ‘ಪ್ರವಾದಿ’ ಎಂಬ ಪರಿಚಿತ ಧಾರ್ಮಿಕ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಗಾದೆಯ ಸಂಕ್ಷಿಪ್ತತೆ ಹಾಗೂ ಮೂಲದ ಮನೆ/ಮನೆಯವರು ಎಂಬ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
