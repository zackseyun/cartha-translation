revisions:
- from: ಅವರು ಆತನ ವಿಷಯದಲ್ಲಿ ಮುನಿಸಿಕೊಂಡರು.[a] ಆದರೆ ಯೇಸು ಅವರಿಗೆ, “ಪ್ರವಾದಿಗೆ ತನ್ನ ಊರಿನಲ್ಲಿ[b] ಮತ್ತು ತನ್ನ ಮನೆಯವರ ನಡುವೆ[c] ಮಾತ್ರ ಗೌರವವಿರುವುದಿಲ್ಲ” ಎಂದು ಹೇಳಿದನು.
  to: ಅವರು ಆತನಿಂದ ಮನನೊಂದರು.[a] ಆದರೆ ಯೇಸು ಅವರಿಗೆ, “ಪ್ರವಾದಿಯು ತನ್ನ ಊರಿನಲ್ಲಿ[b] ಮತ್ತು ತನ್ನ ಮನೆಯವರ ನಡುವೆ[c] ಹೊರತು ಗೌರವವಿಲ್ಲದವನಲ್ಲ” ಎಂದು ಹೇಳಿದನು.
  rationale: The revision restores the Greek proverb’s negative form (“not without honor except”) rather than converting it into an absolute denial of honor. It also replaces the narrower “ಮುನಿಸಿಕೊಂಡರು” with a natural expression for taking offense, while retaining a literal-stumble alternative in the footnote. Footnote anchors remain correctly attached to the relevant expressions.
  reviewer_model: gpt-5.6-terra
