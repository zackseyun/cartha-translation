id: MAT.13.33
reference: Matthew 13:33
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: kn
  text: 'ಅವನು ಅವರಿಗೆ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಹೇಳಿದನು: “ಪರಲೋಕದ ರಾಜ್ಯವು ಹುಳಿಹಿಟ್ಟಿನಂತಿದೆ.[a] ಒಬ್ಬ ಸ್ತ್ರೀಯು ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಮೂರು ಸಾತು ಹಿಟ್ಟಿನಲ್ಲಿ ಅಡಗಿಸಿದಳು;[b] ಇಡೀ ಹಿಟ್ಟು ಹುಳಿಯುವ ತನಕ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಹುಳಿಸುವ ಪದಾರ್ಥ.” ಗ್ರೀಕ್ ಪದವು ಹಿಟ್ಟನ್ನು ಹುಳಿಸಲು ಬಳಸುವ ಪದಾರ್ಥವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
  - marker: b
    text: “ಅಡಗಿಸಿದಳು” ಎಂಬುದನ್ನು “ಅದರೊಳಗೆ ಕಲಸಿದಳು” ಎಂದೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು. ಮೂರು ಸಾತು ಎಂಬುದು ಬಹಳ ದೊಡ್ಡ ಪ್ರಮಾಣದ ಹಿಟ್ಟು.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: ಅವರು ಅವರಿಗೆ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಹೇಳಿದರು
  rationale: ಹೆಚ್ಚುವರಿಯಾಗಿ ಇನ್ನೊಂದು ಸಾಮ್ಯವನ್ನು ಹೇಳಿದರೆಂಬ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡ ನಿರೂಪಣೆಯಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯ
  rationale: ಮತ್ತಾಯನಲ್ಲಿನ ಸ್ಥಿರ ಪದಪ್ರಯೋಗಕ್ಕೆ ಸರಿಹೊಂದುವ, ಕನ್ನಡ ಸತ್ಯವೇದ ಪರಂಪರೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಮತ್ತು ಸಹಜವಾದ ರೂಪ.
- source_word: ζύμῃ
  choice: ಹುಳಿಹಿಟ್ಟು
  rationale: ಹಿಟ್ಟನ್ನು ಹುಳಿಸುವ ಪದಾರ್ಥವೆಂಬ ಅರ್ಥವನ್ನು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ತಿಳಿಯುವಂತೆ ನೀಡುತ್ತದೆ; ಅದರ ರೂಪಕಕ್ಕೆ ಧನಾತ್ಮಕ ಅಥವಾ ಋಣಾತ್ಮಕ ಮೌಲ್ಯವನ್ನು ಅನಗತ್ಯವಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ.
- source_word: ἐνέκρυψεν εἰς
  choice: ಅಡಗಿಸಿಟ್ಟಳು
  rationale: ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದದ ಅಕ್ಷರಶಃ ‘ಒಳಗೆ ಅಡಗಿಸು’ ಎಂಬ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಕಲಸಿದಳು’ ಎಂಬ ವಿವರಣಾತ್ಮಕ ಅರ್ಥವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἀλεύρου σάτα τρία
  choice: ಮೂರು ಸಾತು ಹಿಟ್ಟು
  rationale: ಮೂಲದಲ್ಲಿರುವ ನಿರ್ದಿಷ್ಟ ಪ್ರಾಚೀನ ಅಳತೆಯ ಹೆಸರನ್ನು ಉಳಿಸಿ, ಅದರ ಪ್ರಮಾಣ ದೊಡ್ಡದಾಗಿತ್ತೆಂಬುದನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ವಿವರಿಸುತ್ತದೆ.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: ಕೊನೆಗೆ ಹಿಟ್ಟೆಲ್ಲವೂ ಹುಳಿಯಿತು
  rationale: ಇಡೀ ಪ್ರಮಾಣವು ಹುಳಿಯುವ ತನಕ ನಡೆದ ಪರಿಣಾಮವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ರಾಜ್ಯದ ಸಾಮ್ಯದಲ್ಲಿ ζύμη ಎಂಬುದರ ಮೌಲ್ಯಾರ್ಥ
  choice: ‘ಹುಳಿಹಿಟ್ಟು’ ಎಂದು ತಟಸ್ಥವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ
  alternative: ಇತರ ವಚನಗಳ ಆಧಾರದಲ್ಲಿ ಅದನ್ನು ಕೆಡುಕಿನ ಸಂಕೇತವೆಂದು ಅನುವಾದದಲ್ಲೇ ನಿರ್ಧರಿಸುವುದು
  rationale: ಈ ಸಾಮ್ಯವು ಮರೆಯಾಗಿರುವ ವ್ಯಾಪಕ ಪರಿಣಾಮದ ಚಿತ್ರವನ್ನು ಕೊಡುತ್ತದೆ; ಹುಳಿಹಿಟ್ಟಿಗೆ ಧನಾತ್ಮಕವೋ ಋಣಾತ್ಮಕವೋ ಎಂಬ ವ್ಯಾಖ್ಯಾನವನ್ನು ಅನುವಾದವು ಬಲವಂತವಾಗಿ ನಿರ್ಧರಿಸಬಾರದು.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ, ಗೌರವಯುತವಾಗಿಯೂ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿಯೂ ರೂಪಿಸಲಾಗಿದೆ. ಮೂಲದ ‘ಅಡಗಿಸಿಟ್ಟಳು’ ಎಂಬ ಗಮನಾರ್ಹ ಚಿತ್ರಣ ಮತ್ತು ‘ಮೂರು ಸಾತು’ ಎಂಬ ಸಾಂಸ್ಕೃತಿಕ ಅಳತೆಯನ್ನು ಉಳಿಸಿ ಪಾದಟಿಪ್ಪಣಿಗಳಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
