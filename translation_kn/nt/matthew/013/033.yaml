- from: 'ಅವರು ಅವರಿಗೆ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಹೇಳಿದರು: “ಪರಲೋಕರಾಜ್ಯವು ಹುಳಿಹಿಟ್ಟಿನಂತಿದೆ.[a] ಒಬ್ಬ ಸ್ತ್ರೀ ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಮೂರು ಸಾತು ಹಿಟ್ಟಿನಲ್ಲಿ ಅಡಗಿಸಿಟ್ಟಳು;[b] ಕೊನೆಗೆ ಹಿಟ್ಟೆಲ್ಲವೂ ಹುಳಿಯಿತು.”'
  to: 'ಅವನು ಅವರಿಗೆ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಹೇಳಿದನು: “ಪರಲೋಕದ ರಾಜ್ಯವು ಹುಳಿಹಿಟ್ಟಿನಂತಿದೆ.[a] ಒಬ್ಬ ಸ್ತ್ರೀಯು ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಮೂರು ಸಾತು ಹಿಟ್ಟಿನಲ್ಲಿ ಅಡಗಿಸಿದಳು;[b] ಇಡೀ ಹಿಟ್ಟು ಹುಳಿಯುವ ತನಕ.”'
  rationale: The revision corrects the singular narrative subject, improves idiomatic Kannada, and restores the explicit ‘until’ force of the Greek without altering the parable’s imagery or imposing an interpretation of leaven. The existing footnote anchors remain attached to the relevant terms and retain both lexical and cultural information.
