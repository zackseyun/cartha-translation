id: MAT.13.55
reference: Matthew 13:55
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: kn
  text: ಇವನು ಬಡಗಿಯ ಮಗನಲ್ಲವೇ? ಇವನ ತಾಯಿಯ ಹೆಸರು ಮರಿಯಳಲ್ಲವೇ? ಮತ್ತು ಇವನ ಸಹೋದರರು[a] ಯಾಕೋಬ, ಯೋಸೇಫ[b], ಸೀಮೋನ ಮತ್ತು ಯೂದ ಅಲ್ಲವೇ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಸಂಬಂಧಿಕರು’ ಅಥವಾ ‘ಬಂಧುಗಳು.’ ಗ್ರೀಕ್ ಪದವು ಸಾಮಾನ್ಯವಾಗಿ ‘ಸಹೋದರರು’ ಎಂದರ್ಥ; ಆದರೆ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಕೆಲವರು ಅದನ್ನು ವಿಶಾಲ ಕುಟುಂಬಾರ್ಥದಲ್ಲಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ.
    reason: lexical_alternative
  - marker: b
    text: ಕೆಲವು ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ ‘ಯೋಸೇಫ’ ಎಂಬುದಕ್ಕೆ ಬದಲಾಗಿ ‘ಯೋಸೇ’ ಎಂದಿದೆ.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: ಬಡಗಿಯ
  rationale: τέκτων ಎಂಬುದು ಮರದ ಕೆಲಸ ಅಥವಾ ಕಟ್ಟಡದ ಕೆಲಸ ಮಾಡುವ ಕುಶಲಕರ್ಮಿಯನ್ನು ಸೂಚಿಸಬಹುದು. ಈ ಸಂದರ್ಭದಲ್ಲಿ ‘ಬಡಗಿ’ ಸಹಜವೂ ಪರಂಪರಾಗತವೂ ಆದ ಅನುವಾದವಾಗಿದ್ದು, ಪದದ ಮುಖ್ಯ ಅರ್ಥವ್ಯಾಪ್ತಿಗೆ ಹೊಂದುತ್ತದೆ.
- source_word: υἱός
  choice: ಮಗ
  rationale: ತಕ್ಷಣದ ಕುಟುಂಬಸಂದರ್ಭದಲ್ಲಿ ನೇರವಾದ ಪುತ್ರಸಂಬಂಧವೇ ಉದ್ದೇಶಿತವಾಗಿದೆ.
- source_word: λέγεται
  choice: ಎಂದು ಕರೆಯುತ್ತಾರೆ
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನ ಕರ್ಮಣಿ ಪ್ರಯೋಗದ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಹೆಸರನ್ನು ಸೂಚಿಸುವ ರೂಢಿಪ್ರಯೋಗವಾಗಿದೆ.
- source_word: Μαριὰμ
  choice: ಮರಿಯಳು
  rationale: ಕನ್ನಡ ಸತ್ಯವೇದದ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: ἀδελφοὶ
  choice: ಸಹೋದರರು
  rationale: ಗ್ರೀಕ್ ಪದದ ಸಾಮಾನ್ಯ ಮತ್ತು ಮೇಲ್ಮೈ ಅರ್ಥ ‘ಸಹೋದರರು.’ ಕುಟುಂಬಸಂಬಂಧದ ಸ್ವರೂಪದ ಕುರಿತ ನಂತರದ ತಾತ್ತ್ವಿಕ ವಿವಾದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಪರಿಹರಿಸದೆ, ವಿಶಾಲ ಅರ್ಥದ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: Ἰάκωβος
  choice: ಯಾಕೋಬ
  rationale: ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಕನ್ನಡ ಬಳಕೆಯಲ್ಲಿ ಪರಿಚಿತವಾದ ಹೆಸರಿನ ರೂಪ.
- source_word: Ἰωσὴφ
  choice: ಯೋಸೇಫ
  rationale: SBLGNT ಮುಖ್ಯ ಪಾಠವಾದ Ἰωσήφ ಅನ್ನು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ; ಪರ್ಯಾಯ ಪಾಠವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: Σίμων
  choice: ಸೀಮೋನ
  rationale: ಗ್ರೀಕ್ ಹೆಸರಿನ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತವಾದ ರೂಪ.
- source_word: Ἰούδας
  choice: ಯೂದ
  rationale: ಈ ಹೆಸರಿನ ಕನ್ನಡ ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಪರಿಚಿತ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ.
- source_word: οὐχ ... ;
  choice: ಅಲ್ಲವೇ?
  rationale: ದೃಢೀಕರಣಾತ್ಮಕ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಗ್ರೀಕ್ ಆಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಯ ಸ್ವರವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ಕುಟುಂಬಕ್ಕೆ ಸಂಬಂಧಿಸಿದಂತೆ ἀδελφοὶ αὐτοῦ ಎಂಬುದರ ಅರ್ಥ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಇವನ ಸಹೋದರರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಇವನ ಸಂಬಂಧಿಕರು’ ಅಥವಾ ‘ಇವನ ಬಂಧುಗಳು’ ಎಂಬ ವಿಶಾಲ ಕುಟುಂಬಾರ್ಥ.
  rationale: ἀδελφοί ಪದದ ಸಾಮಾನ್ಯ ಅರ್ಥ ‘ಸಹೋದರರು.’ ಈ ಪುರುಷರು ಯೇಸುವಿಗೆ ನಿಖರವಾಗಿ ಯಾವ ಕುಟುಂಬಸಂಬಂಧ ಹೊಂದಿದ್ದರು ಎಂಬ ಸಿದ್ಧಾಂತಾತ್ಮಕ ಪ್ರಶ್ನೆಯನ್ನು ಅನುವಾದವು ತಾನೇ ನಿರ್ಧರಿಸಬಾರದು. ಆದ್ದರಿಂದ ಸಾಮಾನ್ಯ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಇಟ್ಟು, ವಿಶಾಲ ಅರ್ಥದ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಸೂಚಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಮಾತಿನ ಸಹಜತೆಯುಳ್ಳ ಶೈಲಿ. ಆಲಂಕಾರಿಕ ಪ್ರಶ್ನೆಗಳಿಗೆ ‘ಅಲ್ಲವೇ?’ ರೂಪವನ್ನು ಬಳಸಲಾಗಿದೆ. ವ್ಯಕ್ತಿನಾಮಗಳಿಗೆ ಕನ್ನಡ ಸತ್ಯವೇದದ ಪರಿಚಿತ ರೂಪಗಳನ್ನು ಅನುಸರಿಸಲಾಗಿದೆ.
