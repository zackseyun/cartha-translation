id: MAT.13.25
reference: Matthew 13:25
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: kn
  text: ಆದರೆ ಜನರು ನಿದ್ರಿಸುತ್ತಿದ್ದಾಗ, ಅವನ ಶತ್ರು ಬಂದು ಗೋಧಿಯ ನಡುವೆ ಕಳೆಗಳನ್ನು ಬಿತ್ತಿ ಹೊರಟುಹೋದನು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: ಜನರು
  rationale: ಸಂದರ್ಭದಲ್ಲಿ ಹೊಲದ ಕೆಲಸಗಾರರನ್ನು ಸೂಚಿಸಿದರೂ, ಗ್ರೀಕ್ ಪದವು ಸಾಮಾನ್ಯವಾಗಿ ‘ಜನರು/ಮನುಷ್ಯರು’ ಎಂದರ್ಥ; ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ‘ಜನರು’ ಸಹಜವಾಗಿದ್ದು ಅನಗತ್ಯ ಲಿಂಗ-ನಿರ್ದಿಷ್ಟತೆಯನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
- source_word: καθεύδειν
  choice: ನಿದ್ರಿಸುತ್ತಿದ್ದಾಗ
  rationale: ಕ್ರಿಯೆಯ ನಡೆಯುತ್ತಿರುವ ಹಿನ್ನೆಲೆಯನ್ನು ಮತ್ತು ἐν δὲ τῷ ಎಂಬ ಕಾಲಸೂಚಕ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὁ ἐχθρός
  choice: ಶತ್ರು
  rationale: ವೈಯಕ್ತಿಕ ವಿರೋಧಿಯನ್ನು ಸೂಚಿಸುವ ಮೂಲಪದದ ನೇರ ಮತ್ತು ಸಹಜ ಸಮಾನಾರ್ಥಕ.
- source_word: ἐπέσπειρεν
  choice: ಬಿತ್ತಿ
  rationale: ಬೆಳೆಯ ನಡುವೆ ಹೆಚ್ಚುವರಿಯಾಗಿ ಅಥವಾ ಮೇಲಾಗಿ ಬಿತ್ತಿದ ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ζιζάνια
  choice: ಕಳೆಬೀಜಗಳನ್ನು
  rationale: ζιζάνια ಗೋಧಿಯನ್ನು ಹೋಲುವ ಹಾನಿಕರ ಕಳೆಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಕಳೆಬೀಜಗಳು’ ಶತ್ರು ಬಿತ್ತಿದ ವಸ್ತುವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ, ಆದರೆ ನಿರ್ದಿಷ್ಟ ಸಸ್ಯಪ್ರಭೇದವನ್ನು ಅನಿಶ್ಚಿತವಾಗಿ ಹೆಸರಿಸುವುದಿಲ್ಲ.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: ಗೋಧಿಯ ನಡುವೆ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಸ್ಥಳಸಂಬಂಧವನ್ನು ಸರಳ ಮತ್ತು ನಿಖರ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀπῆλθεν
  choice: ಹೊರಟುಹೋದನು
  rationale: ಶತ್ರು ಸ್ಥಳವನ್ನು ಬಿಟ್ಟು ಹೋದನು ಎಂಬ ಚಲನೆಯನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ‘ಶತ್ರು’ ಎಂಬವನ ಗುರುತು
  choice: ಈ ವಾಕ್ಯದಲ್ಲಿರುವಂತೆ ಕೇವಲ ‘ಅವನ ಶತ್ರು’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಮುಂದಿನ ವಿವರಣೆಯ ಆಧಾರದಲ್ಲಿ ಇಲ್ಲಿ ‘ಸೈತಾನ’ ಅಥವಾ ‘ದುಷ್ಟನು’ ಎಂದು ಸ್ಪಷ್ಟೀಕರಿಸುವುದು.
  rationale: ಈ ಹಂತದ ಸಾಮ್ಯದಲ್ಲಿ ಶತ್ರುವಿನ ಗುರುತನ್ನು ಕಥನವು ಇನ್ನೂ ವಿವರಿಸಿಲ್ಲ; ಮುಂದಿನ ವ್ಯಾಖ್ಯಾನವನ್ನು ಮುಂಚಿತವಾಗಿ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಬಾರದು.
- issue: ನಿದ್ರಿಸುತ್ತಿದ್ದವರ ಲಿಂಗಸೂಚನೆ
  choice: ‘ಜನರು’
  alternative: ‘ಗಂಡಸರು’ ಅಥವಾ ‘ಕೆಲಸದವರು’
  rationale: ἀνθρώπους ವ್ಯಾಕರಣಾತ್ಮಕವಾಗಿ ಪುಲ್ಲಿಂಗ ರೂಪದಲ್ಲಿದ್ದರೂ ಇಲ್ಲಿ ಮಾನವರ ಸಮೂಹವನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಸೂಚಿಸಬಹುದು. ‘ಜನರು’ ಮೂಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸುತ್ತದೆ; ‘ಕೆಲಸದವರು’ ಸಂದರ್ಭಾಧಾರಿತ ಸ್ಪಷ್ಟೀಕರಣವಾಗುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ಮೂಲದ ಕ್ರಮ ಮತ್ತು ಅರ್ಥವನ್ನು ಸಮೀಪವಾಗಿ ಉಳಿಸಿಕೊಂಡು, ಕನ್ನಡದಲ್ಲಿ ಅಸಹಜವಾಗದಂತೆ ವಾಕ್ಯವನ್ನು ರೂಪಿಸಲಾಗಿದೆ.
