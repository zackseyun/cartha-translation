review_pass:
  verdict: revise
  source_fidelity: The temporal clause, the enemy’s arrival, sowing among the wheat, and departure are conveyed accurately. However, ζιζάνια denotes the noxious weeds themselves (traditionally often identified as darnel), not explicitly ‘weed seeds’; the act of sowing already implies seed material.
  naturalness: The sentence is fluent modern standard Kannada. Replacing ‘ಕಳೆಬೀಜಗಳನ್ನು’ with ‘ಕಳೆಗಳನ್ನು’ is both more idiomatic in this agricultural context and closer to the Greek wording.
  terminology: ‘ಜನರು,’ ‘ಅವನ ಶತ್ರು,’ ‘ಗೋಧಿ,’ and ‘ಕಳೆಗಳು’ are appropriate, non-speculative renderings. The wording preserves the passage’s lack of a specific identification for the enemy or the weed species.
  issues:
  - severity: low
    issue: ‘ಕಳೆಬೀಜಗಳನ್ನು’ adds ‘seeds’ to ζιζάνια.
    rationale: The Greek names the weeds, while ἐπέσπειρεν supplies the idea of sowing. Kannada can naturally say ‘ಕಳೆಗಳನ್ನು ಬಿತ್ತಿ’ without adding an extra lexical element.
  revised_text: ಆದರೆ ಜನರು ನಿದ್ರಿಸುತ್ತಿದ್ದಾಗ, ಅವನ ಶತ್ರು ಬಂದು ಗೋಧಿಯ ನಡುವೆ ಕಳೆಗಳನ್ನು ಬಿತ್ತಿ ಹೊರಟುಹೋದನು.
  revised_footnotes: []
