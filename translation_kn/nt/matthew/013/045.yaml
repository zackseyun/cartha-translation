id: MAT.13.45
reference: Matthew 13:45
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: kn
  text: ಮತ್ತೆ, ಪರಲೋಕರಾಜ್ಯವು ಉತ್ತಮ ಮುತ್ತುಗಳನ್ನು ಹುಡುಕುತ್ತಿರುವ ಒಬ್ಬ ವ್ಯಾಪಾರಿಗೆ ಹೋಲುತ್ತದೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ಇನ್ನೂ ಅಕ್ಷರಶಃ: “ಪರಲೋಕರಾಜ್ಯವು ಉತ್ತಮ ಮುತ್ತುಗಳನ್ನು ಹುಡುಕುತ್ತಿರುವ ಒಬ್ಬ ಮನುಷ್ಯನಿಗೆ—ಒಬ್ಬ ವ್ಯಾಪಾರಿಗೆ—ಹೋಲುತ್ತದೆ.”'
    reason: ἀνθρώπῳ ἐμπόρῳ ಎಂಬ ಗ್ರೀಕ್ ಪದಗುಚ್ಛದಲ್ಲಿರುವ ‘ಮನುಷ್ಯ’ ಮತ್ತು ‘ವ್ಯಾಪಾರಿ’ ಎಂಬ ಎರಡೂ ನಾಮಪದಗಳನ್ನು ಅಕ್ಷರಶಃ ತೋರಿಸಲು.
lexical_decisions:
- source_word: Πάλιν
  choice: ಮತ್ತೆ
  rationale: ರಾಜ್ಯದ ಕುರಿತ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಪರಿಚಯಿಸುವ ಸಂವಾದದ ಹರಿವನ್ನು ಸಹಜವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁμοία ἐστὶν
  choice: ಹೋಲುತ್ತದೆ
  rationale: ಸಾಮ್ಯದ ಹೋಲಿಕೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿಯೂ ಸಹಜವಾಗಿಯೂ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯ
  rationale: ಮತ್ತಾಯನ ವಿಶಿಷ್ಟ ಪದಪ್ರಯೋಗವನ್ನು ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಪರಿಚಿತ ಮತ್ತು ಸಹಜ ರೂಪದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: ಒಬ್ಬ ವ್ಯಾಪಾರಿಗೆ
  rationale: ಗ್ರೀಕ್‌ನ ದತ್ತಿವಿಭಕ್ತಿ ರೂಪವು ಹೋಲಿಕೆಯ ತಕ್ಷಣದ ವಿಷಯವಾಗಿ ವ್ಯಾಪಾರಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ἔμπορος ವ್ಯಕ್ತಿಯನ್ನು ಈಗಾಗಲೇ ಗುರುತಿಸುವುದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ‘ಮನುಷ್ಯ’ ಎಂದು ಪುನರಾವರ್ತಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
- source_word: ζητοῦντι
  choice: ಹುಡುಕುತ್ತಿದ್ದ
  rationale: ವರ್ತಮಾನ ಕೃದಂತವು ವ್ಯಾಪಾರಿಯ ನಡೆಯುತ್ತಿದ್ದ ಚಟುವಟಿಕೆಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಈ ರೂಪವನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: καλοὺς μαργαρίτας
  choice: ಉತ್ತಮ ಮುತ್ತುಗಳನ್ನು
  rationale: καλός ಇಲ್ಲಿ ಕೇವಲ ದೃಶ್ಯ ಸೌಂದರ್ಯಕ್ಕಿಂತ ಗುಣಮಟ್ಟ ಅಥವಾ ಶ್ರೇಷ್ಠತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಉತ್ತಮ ಮುತ್ತುಗಳು’ ವ್ಯಾಪಾರದ ಸಂದರ್ಭಕ್ಕೂ ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ಸಾಮ್ಯದ ಸೂತ್ರದಲ್ಲಿ ಹೋಲಿಕೆಯ ವ್ಯಾಪ್ತಿ
  choice: ರಾಜ್ಯವನ್ನು ತಕ್ಷಣವೇ ವ್ಯಾಪಾರಿಗೆ ಹೋಲಿಸಲಾಗಿದೆ.
  alternative: ರಾಜ್ಯವು ಉತ್ತಮ ಮುತ್ತುಗಳನ್ನು ಹುಡುಕುವ ವ್ಯಾಪಾರಿಯನ್ನು ಒಳಗೊಂಡ ಸಂಪೂರ್ಣ ಸನ್ನಿವೇಶಕ್ಕೆ ಹೋಲುತ್ತದೆ.
  rationale: ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ ಎಂಬ ಗ್ರೀಕ್ ರಚನೆ ವ್ಯಾಪಾರಿಯನ್ನೇ ತಕ್ಷಣದ ಹೋಲಿಕೆಯ ವಿಷಯವಾಗಿ ಮುಂದಿಡುತ್ತದೆ. ಆದರೂ ಸಾಮ್ಯದ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಇಲ್ಲಿ ನಿರ್ದಿಷ್ಟವಾಗಿ ಸೀಮಿತಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಶೈಲಿ. ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದಪ್ರಯೋಗವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅನಗತ್ಯವಾಗಿ ಪಂಥೀಯ ಅಥವಾ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಭಾಷೆಯನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
