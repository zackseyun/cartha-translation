id: MAT.13.32
reference: Matthew 13:32
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: kn
  text: ಅದು ಎಲ್ಲ ಬೀಜಗಳಿಗಿಂತ ಚಿಕ್ಕದು; ಆದರೆ ಅದು ಬೆಳೆದಾಗ, ತೋಟದ ಗಿಡಗಳಿಗಿಂತ ದೊಡ್ಡದಾಗುತ್ತದೆ ಮತ್ತು ಮರವಾಗುತ್ತದೆ, ಹೀಗಾಗಿ ಆಕಾಶದ ಪಕ್ಷಿಗಳು[a] ಬಂದು ಅದರ ಕೊಂಬೆಗಳಲ್ಲಿ ಗೂಡುಕಟ್ಟುತ್ತವೆ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಗಾಳಿಯ ಪಕ್ಷಿಗಳು’; ಇದು τὰ πετεινὰ τοῦ οὐρανοῦ ಎಂಬುದರ ಸಾಂಪ್ರದಾಯಿಕ ಅನುವಾದ.
    reason: lexical_alternative
  - marker: b
    text: ಕೊಂಬೆಗಳಲ್ಲಿ ಪಕ್ಷಿಗಳು ನೆಲೆಸುವ ಈ ಚಿತ್ರಣವು ಮಹಾ ರಾಜ್ಯವನ್ನು ಮರವಾಗಿ ಚಿತ್ರಿಸುವ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಭಾಗಗಳನ್ನು ನೆನಪಿಸಬಹುದು (ಉದಾಹರಣೆಗೆ, ಯೆಹೆಜ್ಕೇಲ 17:23; ದಾನಿಯೇಲ 4:12); ಆದರೆ ಈ ವಚನವು ಆ ಸಂಕೇತಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುವುದಿಲ್ಲ.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: ಎಲ್ಲ ಬೀಜಗಳಿಗಿಂತ ಚಿಕ್ಕದಾಗಿರುತ್ತದೆ
  rationale: ಗ್ರೀಕ್‌ನ ತುಲನಾತ್ಮಕ ರೂಪವಾದ ‘ಚಿಕ್ಕದು’ ಎಂಬ ಅರ್ಥವನ್ನು ‘ಎಲ್ಲ ... ಗಿಂತ’ ಎಂಬ ಸ್ಪಷ್ಟ ಹೋಲಿಕೆಯೊಂದಿಗೆ ಉಳಿಸಲಾಗಿದೆ; ಅದನ್ನು ನೇರವಾಗಿ ಅತ್ಯುನ್ನತ ರೂಪವಾದ ‘ಅತ್ಯಂತ ಚಿಕ್ಕದು’ ಎಂದು ಬದಲಾಯಿಸಿಲ್ಲ.
- source_word: μέν ... δέ
  choice: ; ಆದರೆ
  rationale: ಬೀಜದ ಚಿಕ್ಕ ಆರಂಭ ಮತ್ತು ಅದರ ದೊಡ್ಡ ಬೆಳವಣಿಗೆಯ ನಡುವಿನ ವಿರೋಧವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ. μέν ಅನ್ನು ಪ್ರತ್ಯೇಕ ಪದದಿಂದ ಭಾರಗೊಳಿಸದೆ ವಾಕ್ಯರಚನೆಯಲ್ಲೇ ಸೂಚಿಸಲಾಗಿದೆ.
- source_word: ὅταν δὲ αὐξηθῇ
  choice: ಆದರೆ ಅದು ಬೆಳೆದು ದೊಡ್ಡದಾದಾಗ
  rationale: ಬೆಳವಣಿಗೆ ಪೂರ್ಣಗೊಂಡ ಬಳಿಕದ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್‌ನ ಸಮಗ್ರ ದೃಷ್ಟಿಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: μεῖζον τῶν λαχάνων
  choice: ತೋಟದ ಗಿಡಗಳಿಗಿಂತ ದೊಡ್ಡದಾಗಿ
  rationale: λάχανα ಎಂಬುದು ಬೆಳೆಸುವ ತೋಟದ ಸಸ್ಯಗಳನ್ನು ವಿಶಾಲವಾಗಿ ಸೂಚಿಸುವುದರಿಂದ, ‘ತರಕಾರಿಗಳು’ ಅಥವಾ ‘ಮೂಲಿಕೆಗಳು’ ಎಂಬ ಕಿರಿದಾದ ಅರ್ಥದ ಬದಲು ‘ತೋಟದ ಗಿಡಗಳು’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: γίνεται δένδρον
  choice: ಮರವೂ ಆಗುತ್ತದೆ
  rationale: ಗ್ರೀಕ್‌ನ ಸ್ಪಷ್ಟ ಹಾಗೂ ಜೀವಂತ ಚಿತ್ರಣವನ್ನು ‘ಮರದಂತಾಗುತ್ತದೆ’ ಎಂದು ಮೃದುಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ὥστε ἐλθεῖν
  choice: ಹೀಗಾಗಿ ... ಬಂದು
  rationale: ὥστε + infinitive ಸೂಚಿಸುವ ಫಲಿತಾಂಶವನ್ನು ಸಹಜ ಕನ್ನಡದ ಪರಿಣಾಮಾರ್ಥಕ ರಚನೆಯಿಂದ ಹೇಳಲಾಗಿದೆ.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ಆಕಾಶದ ಪಕ್ಷಿಗಳು
  rationale: οὐρανός ಇಲ್ಲಿ ಪಕ್ಷಿಗಳ ಸಂಚಾರವಲಯವಾದ ಆಕಾಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಇದು ಮೂಲಕ್ಕೆ ಸಮೀಪವಾಗಿಯೂ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಇದೆ.
- source_word: κατασκηνοῦν
  choice: ಗೂಡುಕಟ್ಟುತ್ತವೆ
  rationale: ಕೊಂಬೆಗಳಲ್ಲಿರುವ ಪಕ್ಷಿಗಳ ಸಂದರ್ಭದಲ್ಲಿ ತಂಗುವುದು ಅಥವಾ ವಾಸಮಾಡುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: ಅದರ ಕೊಂಬೆಗಳಲ್ಲಿ
  rationale: ಮರವನ್ನು ಸೂಚಿಸುವ ಸ್ವಾಮ್ಯಸಂಬಂಧ ಮತ್ತು ಸ್ಥಳಾರ್ಥವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ದೊಡ್ಡ ಮರದ ಕೊಂಬೆಗಳಲ್ಲಿ ಪಕ್ಷಿಗಳು ನೆಲೆಸುವ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಪ್ರತಿಧ್ವನಿ
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಚಿತ್ರಣವನ್ನು ಯಥಾವತ್ತಾಗಿ ಉಳಿಸಿ, ಸಂಕೇತಾರ್ಥವನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸಿಲ್ಲ.
  alternative: ಪಕ್ಷಿಗಳನ್ನು ದೇವರ ರಾಜ್ಯದಲ್ಲಿ ಆಶ್ರಯ ಪಡೆಯುವ ಜನಾಂಗಗಳು ಅಥವಾ ಜನರು ಎಂದು ನೇರವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು.
  rationale: ಯೆಹೆಜ್ಕೇಲ 17:23 ಮತ್ತು ದಾನಿಯೇಲ 4:12ರ ಮಹಾ ರಾಜ್ಯವೃಕ್ಷದ ಚಿತ್ರಣ ಇಲ್ಲಿ ಪ್ರತಿಧ್ವನಿಸಬಹುದಾದರೂ, ಗ್ರೀಕ್ ವಾಕ್ಯವೇ ಅದರ ಸಂಕೇತಾರ್ಥವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ವ್ಯಾಖ್ಯಾನವನ್ನು ಅನುವಾದದೊಳಗೆ ಸೇರಿಸದೆ ಧಾರ್ಮಿಕ ಪ್ರತಿಧ್ವನಿಯನ್ನು ಮುಕ್ತವಾಗಿರಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಓದಲು ಸುಲಭವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ತುಲನಾತ್ಮಕ ರೂಪಗಳು, ಬೆಳವಣಿಗೆಯ ವಿರೋಧಾಭಾಸ ಮತ್ತು ಫಲಿತಾಂಶದ ಸಂಬಂಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ. [a] ಮತ್ತು [b] ಗುರುತುಗಳನ್ನು ಸಂಬಂಧಿತ ಅಂತಿಮ ಚಿತ್ರಣದ ನಂತರ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ.
