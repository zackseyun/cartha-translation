review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the aorist negation as non-performance ('ಮಾಡಲಿಲ್ಲ'), not inability, and accurately conveys the causal force of διὰ with the accusative. However, 'ಅಪನಂಬಿಕೆ' can suggest mistrust or erroneous belief; 'ಅವಿಶ್ವಾಸ' is the clearer modern standard Kannada equivalent of ἀπιστία in this rejection context. 'ಶಕ್ತಿಯುತ ಕಾರ್ಯಗಳು' is understandable but somewhat awkward and can mean merely effective/powerful actions rather than deeds of power.
  naturalness: 'A small idiomatic revision improves readability and established biblical register: ''ಅನೇಕ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು'' is natural Kannada for miraculous deeds. The footnote preserves the more explicit power-related lexical alternatives.'
  terminology: Use 'ಅವಿಶ್ವಾಸ' for unbelief. Use 'ಮಹತ್ಕಾರ್ಯಗಳು' in the main text as a natural Gospel-register term for δυνάμεις, while the footnote identifies 'ಅದ್ಭುತಗಳು' and 'ಶಕ್ತಿಯ ಕಾರ್ಯಗಳು' as alternatives.
  issues:
  - severity: low
    issue: ‘ಅಪನಂಬಿಕೆ’ is less precise than ‘ಅವಿಶ್ವಾಸ’ in this context.
    rationale: ἀπιστία denotes unbelief/lack of faith. ‘ಅವಿಶ್ವಾಸ’ is the more direct and idiomatic modern standard Kannada theological term.
  - severity: low
    issue: ‘ಶಕ್ತಿಯುತ ಕಾರ್ಯಗಳು’ is slightly unnatural and semantically broad.
    rationale: It may describe actions as powerful rather than identify them as deeds of power. ‘ಮಹತ್ಕಾರ್ಯಗಳು’ is a natural Kannada Gospel expression; the footnote can retain the explicit lexical nuance.
