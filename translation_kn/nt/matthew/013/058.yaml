id: MAT.13.58
reference: Matthew 13:58
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: kn
  text: ಅವರ ಅವಿಶ್ವಾಸದ ಕಾರಣದಿಂದ ಆತನು ಅಲ್ಲಿ ಅನೇಕ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡಲಿಲ್ಲ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಅನೇಕ ಅದ್ಭುತಗಳನ್ನು’ ಅಥವಾ ‘ಶಕ್ತಿಯ ಅನೇಕ ಕಾರ್ಯಗಳನ್ನು.’ ಗ್ರೀಕ್ ಪದವು ಶಕ್ತಿಯನ್ನು ತೋರಿಸುವ ಕಾರ್ಯಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಸಂದರ್ಭದಲ್ಲಿ ಅದು ಅದ್ಭುತ ಕಾರ್ಯಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: ಆತನು ... ಮಾಡಲಿಲ್ಲ
  rationale: καί ಕಥನದ ಮುಂದುವರಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸ್ವತಂತ್ರ ವಾಕ್ಯದ ಆರಂಭದಲ್ಲಿ ಅದನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸದೆ ಸಹಜವಾಗಿ ಮುಂದುವರಿಸಬಹುದು. οὐκ ἐποίησεν ಕ್ರಿಯೆಯನ್ನು ನಿರಾಕರಿಸುತ್ತದೆ; ಅಸಾಮರ್ಥ್ಯವನ್ನು ಸೂಚಿಸುವುದಿಲ್ಲ.
- source_word: ἐκεῖ
  choice: ಅಲ್ಲಿ
  rationale: ಯೇಸುವಿನ ಸ್ವಂತ ಊರಿನ ಆ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುವ ಸರಳ ಸ್ಥಳವಾಚಕ ಕ್ರಿಯಾವಿಶೇಷಣ.
- source_word: δυνάμεις πολλὰς
  choice: ಅನೇಕ ಶಕ್ತಿಯುತ ಕಾರ್ಯಗಳನ್ನು
  rationale: δύναμις ಮೂಲತಃ ಶಕ್ತಿ ಅಥವಾ ಶಕ್ತಿಯ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಸುವಾರ್ತೆಯ ಸಂದರ್ಭದಲ್ಲಿ ಅದ್ಭುತ ಕಾರ್ಯಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಶಕ್ತಿಯುತ ಕಾರ್ಯಗಳು’ ಎಂಬುದು ಶಕ್ತಿಯೊಂದಿಗಿನ ಪದಸಂಬಂಧವನ್ನು ಉಳಿಸಿ, ‘ಅದ್ಭುತಗಳು’ ಎಂಬ ಪರ್ಯಾಯಕ್ಕಿಂತ ಮೂಲದ ರೂಪವನ್ನು ಹೆಚ್ಚು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: ಅವರ ಅಪನಂಬಿಕೆಯ ಕಾರಣದಿಂದ
  rationale: ಆರೋಪಣಾ ವಿಭಕ್ತಿಯೊಂದಿಗೆ διά ಇಲ್ಲಿ ಕಾರಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ἀπιστία ನಂಬಿಕೆಯ ಕೊರತೆ ಅಥವಾ ನಂಬದಿರುವಿಕೆಯನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಅಪನಂಬಿಕೆ’ ಅದರ ನಕಾರಾತ್ಮಕ ಬಲವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಅಪನಂಬಿಕೆಯ ನಿಮಿತ್ತ ಯೇಸುವಿಗೆ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲವೆಂದು ವಾಕ್ಯ ಹೇಳುತ್ತದೆಯೇ, ಅಥವಾ ಆತನು ಮಾಡಲಿಲ್ಲವೆಂದಷ್ಟೇ ಹೇಳುತ್ತದೆಯೇ?
  choice: ‘ಆತನು ... ಮಾಡಲಿಲ್ಲ’ ಎಂದು ಕ್ರಿಯೆಯ ನಡೆಯದಿರುವಿಕೆಯನ್ನು ಹೇಳಲಾಗಿದೆ.
  alternative: ‘ಆತನಿಗೆ ... ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ’ ಎಂದು ಅಸಾಮರ್ಥ್ಯವನ್ನು ಸೂಚಿಸುವ ಅನುವಾದ.
  rationale: ಗ್ರೀಕ್ οὐκ ἐποίησεν ಎಂದರೆ ‘ಮಾಡಲಿಲ್ಲ’; ಅದು ಅಸಾಮರ್ಥ್ಯವನ್ನು ಸೂಚಿಸುವ ಕ್ರಿಯಾಪದವಲ್ಲ. ಆದ್ದರಿಂದ ಮತ್ತಾಯನು ಹೇಳುವುದಕ್ಕಿಂತ ಬಲವಾದ ತಾತ್ವಿಕ ನಿರ್ಣಯವನ್ನು ಅನುವಾದದಲ್ಲಿ ಸೇರಿಸಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಶಕ್ತಿಯುತ ಕಾರ್ಯಗಳು’ ಮೂಲದ δύναμις ಎಂಬ ಶಕ್ತಿ-ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಪಾದಟಿಪ್ಪಣಿ ಸಾಮಾನ್ಯವಾದ ‘ಅದ್ಭುತಗಳು’ ಎಂಬ ಪರ್ಯಾಯವನ್ನು ನೀಡುತ್ತದೆ.
