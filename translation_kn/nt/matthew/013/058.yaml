  to: ಅವರ ಅವಿಶ್ವಾಸದ ಕಾರಣದಿಂದ ಆತನು ಅಲ್ಲಿ ಅನೇಕ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡಲಿಲ್ಲ.[a]
  rationale: The revision retains the source’s statement that he did not perform many deeds there because of their unbelief, without implying inability. It substitutes more idiomatic and contextually precise Kannada terms while retaining the δύναμις (‘power’) nuance in the lexical footnote.
