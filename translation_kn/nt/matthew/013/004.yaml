source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: kn
  text: ಅವನು ಬೀಜ ಬಿತ್ತುತ್ತಿದ್ದಾಗ, ಕೆಲವು ಬೀಜಗಳು[a] ದಾರಿಯ ಪಕ್ಕದಲ್ಲಿ ಬಿದ್ದವು. ಹಕ್ಕಿಗಳು ಬಂದು ಅವುಗಳನ್ನು ತಿಂದುಬಿಟ್ಟವು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿ ಅಕ್ಷರಶಃ, ‘ಕೆಲವು ದಾರಿಯ ಪಕ್ಕದಲ್ಲಿ ಬಿದ್ದವು.’ ಬಿತ್ತುವವನ ಸಂದರ್ಭದಿಂದ ‘ಬೀಜಗಳು’ ಎಂಬುದನ್ನು ಪೂರೈಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: ಅವನು ಬೀಜ ಬಿತ್ತುತ್ತಿದ್ದಾಗ
  rationale: ἐν ಜೊತೆಗೆ ಬಂದಿರುವ articular infinitive ಸಮಕಾಲೀನ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಬಿತ್ತುತ್ತಿದ್ದಾಗ’ ಎಂಬುದು ಆ ಕಾಲಸಂಬಂಧವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: ἃ μὲν
  choice: ಕೆಲವು ಬೀಜಗಳು
  rationale: ಮೂಲದಲ್ಲಿ ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನದ ಸರ್ವನಾಮ ಮಾತ್ರ ಇದ್ದರೂ, ಸಂದರ್ಭವು ಬಿತ್ತಲ್ಪಟ್ಟ ಬೀಜಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸ್ಪಷ್ಟತೆಗಾಗಿ ‘ಬೀಜಗಳು’ ಎಂದು ಪೂರೈಸಲಾಗಿದೆ; ಇದನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
- source_word: ἔπεσεν
  choice: ಬಿದ್ದವು
  rationale: ನಿರೂಪಣೆಯಲ್ಲಿರುವ aorist ಕ್ರಿಯೆಯನ್ನು ಕನ್ನಡದ ಸರಳ ಭೂತಕಾಲದಲ್ಲಿ ಸಹಜವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
- source_word: παρὰ τὴν ὁδόν
  choice: ದಾರಿಯ ಪಕ್ಕದಲ್ಲಿ
  rationale: παρά ಜೊತೆಗೆ accusative ಇಲ್ಲಿ ದಾರಿಯ ಬದಿಯಲ್ಲಿರುವ ಸ್ಥಳವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕೃಷಿ ಸನ್ನಿವೇಶದಲ್ಲಿ ‘ದಾರಿ’ ಮತ್ತು ‘ಪಕ್ಕದಲ್ಲಿ’ ಸಹಜ ಹಾಗೂ ನಿಖರ.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: ಹಕ್ಕಿಗಳು ಬಂದು
  rationale: Aorist participle ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಅನುಕ್ರಮ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ‘ಬಂದು’ ಎಂದು ಸಹಜವಾಗಿ ನೀಡಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿ ‘ಆಕಾಶದ’ ಎಂಬ ಪದ ಇಲ್ಲದ ಕಾರಣ ಅದನ್ನು ಸೇರಿಸಿಲ್ಲ.
- source_word: κατέφαγεν
  choice: ತಿಂದುಬಿಟ್ಟವು
  rationale: κατεσθίω ಸಂಪೂರ್ಣವಾಗಿ ತಿಂದುಹಾಕುವ ತೀವ್ರ ಅರ್ಥವನ್ನು ಹೊಂದಿದೆ. ‘ತಿಂದುಬಿಟ್ಟವು’ ಸಾಮಾನ್ಯ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಆ ಪೂರ್ಣತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: αὐτά
  choice: ಅವುಗಳನ್ನು
  rationale: ಈ ಸರ್ವನಾಮವು ಬಿದ್ದ ಬೀಜಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದ ಬಹುವಚನ ಸರ್ವನಾಮವು ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
