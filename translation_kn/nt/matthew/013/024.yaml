review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence, sowing action, quality of the seed, and possessive reference to the field accurately. However, “ಹೋಲಿಕೆಯಾಗಿದೆ” is not an idiomatic or precise Kannada realization of Ὡμοιώθη in this parable formula; it can imply that the kingdom itself is a comparison rather than that it is being compared with the man.
  naturalness: “ಸಾಮ್ಯ” and “ಅವರ ಮುಂದೆ ಇಟ್ಟು” are understandable but less natural in modern standard Kannada biblical narrative than “ಉಪಮೆ” and “ಅವರಿಗೆ ... ಮುಂದಿಟ್ಟರು.” “ಒಬ್ಬ ಮನುಷ್ಯನಂತಿದೆ” is clear, idiomatic, and retains the intended comparison.
  terminology: “ಪರಲೋಕರಾಜ್ಯ” is retained as an established concise rendering of ἡ βασιλεία τῶν οὐρανῶν. “ಉಪಮೆ” is preferred for παραβολή; it is the normal modern Kannada term for a parable and avoids narrowing the term to a mere simile.
  issues:
  - severity: medium
    issue: ಹೋಲಿಕೆಯಾಗಿದೆ
    rationale: This wording is grammatically and semantically awkward in Kannada for a comparison with a person. The Greek passive aorist in Matthew’s parable formula is idiomatically represented by “...ಮನುಷ್ಯನಂತಿದೆ”; no doctrinal inference should be drawn from forcing a passive form in Kannada.
  - severity: low
    issue: ಸಾಮ್ಯವನ್ನು / ಅವರ ಮುಂದೆ ಇಟ್ಟು
    rationale: These are intelligible but stylistically literal. “ಉಪಮೆಯನ್ನು” and “ಅವರಿಗೆ ... ಮುಂದಿಟ್ಟರು” read more naturally while faithfully representing παρέθηκεν αὐτοῖς.
