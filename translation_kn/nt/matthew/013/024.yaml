id: MAT.13.24
reference: Matthew 13:24
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: kn
  text: 'ಅವರು ಅವರಿಗೆ ಮತ್ತೊಂದು ಉಪಮೆಯನ್ನು ಮುಂದಿಟ್ಟು ಹೀಗೆ ಹೇಳಿದರು: “ಪರಲೋಕರಾಜ್ಯವು ತನ್ನ ಹೊಲದಲ್ಲಿ ಒಳ್ಳೆಯ ಬೀಜವನ್ನು ಬಿತ್ತಿದ ಒಬ್ಬ ಮನುಷ್ಯನಂತಿದೆ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪರಲೋಕರಾಜ್ಯವು ತನ್ನ ಹೊಲದಲ್ಲಿ ಒಳ್ಳೆಯ ಬೀಜವನ್ನು ಬಿತ್ತಿದ ಒಬ್ಬ ಮನುಷ್ಯನಿಗೆ ಹೋಲಿಸಲ್ಪಟ್ಟಿದೆ.” ಮತ್ತಾಯನ ಉಪಮೆಗಳನ್ನು ಪರಿಚಯಿಸುವ ಈ ಗ್ರೀಕ್ ಕ್ರಿಯಾರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ “ಮನುಷ್ಯನಂತಿದೆ” ಎಂದು ಹೆಚ್ಚು ಸರಳವಾಗಿ ಅನುವಾದಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು
  rationale: ἄλλην ಅನುಕ್ರಮದಲ್ಲಿ ಇನ್ನೊಂದು ಸಾಮ್ಯವನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ; ‘ಮತ್ತೊಂದು’ ಸಹಜವಾಗಿ ಆ ನಿರೂಪಣೆಯ ಹರಿವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: παρέθηκεν αὐτοῖς
  choice: ಅವರ ಮುಂದೆ ಇಟ್ಟು
  rationale: παρατίθημι ಎಂಬ ಪದದ ‘ಮುಂದಿಡು/ಪ್ರಸ್ತುತಪಡಿಸು’ ಎಂಬ ಅರ್ಥವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿಯೂ ಅದರ ದೃಶ್ಯರೂಪಕವನ್ನು ಉಳಿಸುವಂತೆಯೂ ಹೇಳುತ್ತದೆ.
- source_word: λέγων
  choice: ಹೀಗೆ ಹೇಳಿದರು
  rationale: ಗ್ರೀಕ್ ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ಕನ್ನಡದ ಸಹಜ ನಿರೂಪಣೆಯಲ್ಲಿ ಮುಖ್ಯ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಜೋಡಿಸಿ ನೇರ ಉಕ್ತಿಯನ್ನು ಪರಿಚಯಿಸಲಾಗಿದೆ.
- source_word: Ὡμοιώθη
  choice: ಹೋಲಿಕೆಯಾಗಿದೆ
  rationale: ಅಓರಿಸ್ಟ್ ಕರ್ಮಣಿ ರೂಪದ ಹೋಲಿಕೆಗೊಳಗಾಗುವ ಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ; ಕೇವಲ ‘ಹಾಗಿರುತ್ತದೆ’ ಎನ್ನುವುದಕ್ಕಿಂತ ಮೂಲದ ಕ್ರಿಯಾರೂಪಕ್ಕೆ ಹತ್ತಿರವಾಗಿದ್ದು ಕನ್ನಡದಲ್ಲಿಯೂ ಗ್ರಾಹ್ಯವಾಗಿದೆ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯವು
  rationale: ಮತ್ತಾಯನ ವೈಶಿಷ್ಟ್ಯಪೂರ್ಣ ಪದಬಂಧಕ್ಕೆ ಸ್ಥಿರವಾದ, ಸಹಜ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ; ದೇವರ ಆಳ್ವಿಕೆಯ ಅರ್ಥವನ್ನು ಅನಗತ್ಯವಾಗಿ ವಿವರಿಸುವುದಿಲ್ಲ.
- source_word: ἀνθρώπῳ
  choice: ಒಬ್ಬ ಮನುಷ್ಯನಿಗೆ
  rationale: ಸಾಮ್ಯದಲ್ಲಿನ ಪುರುಷ ವ್ಯಕ್ತಿಯನ್ನು ಸೂಚಿಸುವ ಮೂಲದ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ನಿಖರವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: σπείραντι
  choice: ಬಿತ್ತಿದ
  rationale: ಪೂರ್ಣಗೊಂಡ ಬಿತ್ತನೆಯ ಕ್ರಿಯೆಯನ್ನು ಸಂಬಂಧಕ ಕೃದಂತರೂಪದಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: καλὸν σπέρμα
  choice: ಒಳ್ಳೆಯ ಬೀಜವನ್ನು
  rationale: καλός ಇಲ್ಲಿ ಬೀಜದ ಉತ್ತಮ ಗುಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ ಮತ್ತು ಮುಂದಿನ ಕಳೆಗಳ ವಿರೋಧಾಭಾಸಕ್ಕೆ ನೆಲೆ ಸಿದ್ಧಪಡಿಸುತ್ತದೆ.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: ತನ್ನ ಹೊಲದಲ್ಲಿ
  rationale: αὐτοῦ ಅನ್ನು ಸಾಮ್ಯದ ಮನುಷ್ಯನಿಗೆ ಸಂಬಂಧಿಸಿದ ಸ್ವಾಮ್ಯಾರ್ಥಕವಾಗಿ ಸೂಚಿಸಿ, ἀγρός ಅನ್ನು ಸಾಮಾನ್ಯ ಕೃಷಿಪದವಾದ ‘ಹೊಲ’ ಎಂದು ಅನುವಾದಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ ಪರಲೋಕರಾಜ್ಯದ ಸೂತ್ರಪದ
  choice: ಪರಲೋಕರಾಜ್ಯವು
  alternative: ಪರಲೋಕಗಳ ರಾಜ್ಯವು
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವು ಸೆಮಿಟಿಕ್ ಬಳಕೆಯನ್ನು ಪ್ರತಿಬಿಂಬಿಸಿದರೂ, ‘ಪರಲೋಕರಾಜ್ಯ’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ ಮತ್ತು ಸ್ಥಿರ ಪದವಾಗಿದೆ; ದೇವರ ಆಳ್ವಿಕೆ ಎಂಬ ಅರ್ಥವನ್ನು ಪಂಥೀಯ ವಿವರಣೆಯಿಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
- issue: Ὡμοιώθη ಎಂಬ ಕ್ರಿಯೆಯ ಬಲ
  choice: ಹೋಲಿಕೆಯಾಗಿದೆ
  alternative: ಹಾಗಿರುತ್ತದೆ
  rationale: ಮೂಲದ ಕರ್ಮಣಿ ಕ್ರಿಯಾರೂಪದ ಸೂಕ್ಷ್ಮತೆಯನ್ನು ಉಳಿಸುತ್ತದೆ; ಆದರೂ ಇದು ರಾಜ್ಯದ ಸ್ವರೂಪದ ಕುರಿತು ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತವನ್ನು ಹೇರುವುದಿಲ್ಲ, ಸಾಮ್ಯವು ಸ್ಥಾಪಿಸುವ ಹೋಲಿಕೆಯನ್ನು ಮಾತ್ರ ಸೂಚಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ನಿರೂಪಣೆ. ‘ಸಾಮ್ಯ’, ‘ಪರಲೋಕರಾಜ್ಯ’, ‘ಹೊಲ’, ‘ಬೀಜ’ ಎಂಬ ಸಾಮಾನ್ಯವಾಗಿ ಗ್ರಾಹ್ಯವಾದ ಪದಗಳನ್ನು ಬಳಸಲಾಗಿದೆ; ಮೂಲದ ಹೋಲಿಕೆಯ ಕರ್ಮಣಿ ಭಾವವನ್ನು ‘ಹೋಲಿಕೆಯಾಗಿದೆ’ ಮೂಲಕ ಉಳಿಸಲಾಗಿದೆ.
