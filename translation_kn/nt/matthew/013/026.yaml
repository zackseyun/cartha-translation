id: MAT.13.26
reference: Matthew 13:26
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: kn
  text: ಆದರೆ ಪೈರು ಮೊಳೆತು ಕಾಳು ಬಿಟ್ಟಾಗ, ಕಳೆಗಳೂ[a] ಕಾಣಿಸಿಕೊಂಡವು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಟೇರ್‌ಗಳು’; ಬಹುಶಃ ಡಾರ್ನೆಲ್‌ನಂಥ ನಿರ್ದಿಷ್ಟ ಕಳೆಯಾಗಿರಬಹುದು.
    reason: ζιζάνια ಪದದ ಸಾಂಪ್ರದಾಯಿಕ ಪರ್ಯಾಯವನ್ನು ಸೂಚಿಸುತ್ತಾ, ಅದರ ಸಂಭವನೀಯ ಆದರೆ ಅನಿಶ್ಚಿತ ಸಸ್ಯಶಾಸ್ತ್ರೀಯ ಗುರುತನ್ನು ಉಳಿಸಲು.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ಆದರೆ … ಆಗ
  rationale: ὅτε ಸೂಚಿಸುವ ಕಾಲಸಂಬಂಧವನ್ನು ‘ಆಗ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; δέ ಹಿಂದಿನ ಘಟನೆಯೊಂದಿಗೆ ಸೌಮ್ಯವಾದ ವ್ಯತ್ಯಾಸವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಆದರೆ’ ಬಳಸಲಾಗಿದೆ.
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: ಪೈರು ಮೊಳೆತು
  rationale: βλαστάνω ಎಂದರೆ ಮೊಳೆಯುವುದು; ಕೃಷಿ ಸನ್ನಿವೇಶದಲ್ಲಿ χόρτος ಅನ್ನು ಸಾಮಾನ್ಯ ‘ಹುಲ್ಲು’ ಎನ್ನುವುದಕ್ಕಿಂತ ಬೆಳೆಯುತ್ತಿರುವ ‘ಪೈರು’ ಎಂದು ಹೇಳುವುದು ಸಹಜ ಮತ್ತು ಸಂದರ್ಭೋಚಿತ.
- source_word: καρπὸν ἐποίησεν
  choice: ಕಾಳು ಬಿಟ್ಟಾಗ
  rationale: ಪದಶಃ ‘ಫಲವನ್ನು ಉಂಟುಮಾಡಿತು’; ಗೋಧಿಯ ಹೊಲದ ಸನ್ನಿವೇಶದಲ್ಲಿ ಇಳುವರಿಯ ಕಾಳು ರೂಪುಗೊಂಡದ್ದನ್ನು ‘ಕಾಳು ಬಿಟ್ಟಿತು’ ಎಂಬ ಸಹಜ ಕನ್ನಡ ನುಡಿಗಟ್ಟು ತಿಳಿಸುತ್ತದೆ.
- source_word: τότε ἐφάνη
  choice: ಕಾಣಿಸಿಕೊಂಡವು
  rationale: τότε ಯ ಕಾಲಕ್ರಮವನ್ನು ಮುಂಚಿನ ‘ಆಗ’ ಒಳಗೊಂಡಿದೆ; ἐφάνη ಎಂದರೆ ಗೋಚರವಾದವು ಅಥವಾ ಕಾಣಿಸಿಕೊಂಡವು.
- source_word: καὶ τὰ ζιζάνια
  choice: ಕಳೆಗಳೂ
  rationale: ζιζάνια ಹೊಲದಲ್ಲಿನ ಕಳೆಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅದರ ನಿಖರ ಸಸ್ಯಜಾತಿ ಖಚಿತವಲ್ಲದ ಕಾರಣ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಸಾಮಾನ್ಯ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ. καίಯ ‘ಸಹ/ಕೂಡ’ ಎಂಬ ಅರ್ಥವನ್ನು ‘-ಗಳೂ’ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ζιζάνια ಎಂಬ ಸಸ್ಯದ ನಿರ್ದಿಷ್ಟ ಗುರುತು
  choice: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ‘ಕಳೆಗಳು’
  alternative: ‘ಕಳೆಗೋಧಿ’ ಅಥವಾ ಡಾರ್ನೆಲ್ ಎಂಬ ನಿರ್ದಿಷ್ಟ ಕಳೆ
  rationale: ಗ್ರೀಕ್ ಪದವು ಹೊಲದ ಹಾನಿಕರ ಕಳೆಯನ್ನು ಸೂಚಿಸಿದರೂ ಅದರ ಸಸ್ಯಶಾಸ್ತ್ರೀಯ ಗುರುತನ್ನು ಈ ವಾಕ್ಯ ಖಚಿತಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಅರ್ಥಗರ್ಭಿತ ಸಾಮಾನ್ಯ ಪದವಿದ್ದು, ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಸಹಜ ಮತ್ತು ಘನತೆಯ ಕೃಷಿ ಭಾಷೆಯನ್ನು ಬಳಸಲಾಗಿದೆ. ‘ಪೈರು ಮೊಳೆತು ಕಾಳು ಬಿಟ್ಟಾಗ’ ಎಂಬ ರೂಪವು ಕ್ರಿಯೆಗಳ ಕ್ರಮವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ತಿಳಿಸುತ್ತದೆ. ಅಡಿಕುರಿಪಿನ ಗುರುತನ್ನು ಅದು ವಿವರಿಸುವ ‘ಕಳೆಗಳು’ ಪದದ ಮೇಲೆಯೇ ಇರಿಸಲಾಗಿದೆ.
