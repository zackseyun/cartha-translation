  to: ಆದರೆ ಅವನು, “ಬೇಡ; ನೀವು ಕಳೆಗಳನ್ನು[a] ಕೀಳುವಾಗ, ಅವುಗಳೊಂದಿಗೆ ಗೋಧಿಯನ್ನೂ ಬೇರುಸಹಿತ ಕಿತ್ತುಬಿಡುವಿರಿ” ಎಂದು ಹೇಳಿದನು.
