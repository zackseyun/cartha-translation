id: MAT.13.29
reference: Matthew 13:29
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: kn
  text: ಆದರೆ ಅವನು, “ಬೇಡ; ನೀವು ಕಳೆಗಳನ್ನು[a] ಕೀಳುವಾಗ, ಅವುಗಳೊಂದಿಗೆ ಗೋಧಿಯನ್ನೂ ಬೇರುಸಹಿತ ಕಿತ್ತುಬಿಡುವಿರಿ” ಎಂದು ಹೇಳಿದನು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಟೇರ್ಸ್”; ಇನ್ನೂ ನಿರ್ದಿಷ್ಟವಾಗಿ, ಬೆಳವಣಿಗೆಯ ಆರಂಭಿಕ ಹಂತಗಳಲ್ಲಿ ಗೋಧಿಯನ್ನು ಹೋಲುವ “ಡಾರ್ನೆಲ್” ಎಂಬ ಕಳೆಯಾಗಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: ಎಂದು ಹೇಳಿದನು
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಐತಿಹಾಸಿಕ ವರ್ತಮಾನಕಾಲ ಇದ್ದರೂ, ಕನ್ನಡದ ಸಹಜ ಕಥನಶೈಲಿಯಲ್ಲಿ ಭೂತಕಾಲವು ಸೂಕ್ತವಾಗಿದೆ.
- source_word: Οὔ
  choice: ಬೇಡ
  rationale: ಸೇವಕರು ಪ್ರಸ್ತಾಪಿಸಿದ ಕಾರ್ಯವನ್ನು ನಿರಾಕರಿಸುವ ಉತ್ತರವಾಗಿ ಕನ್ನಡದಲ್ಲಿ ‘ಬೇಡ’ ಸಹಜ ಮತ್ತು ನೇರವಾಗಿದೆ.
- source_word: μήποτε
  choice: ಕಿತ್ತುಬಿಡಬಹುದು
  rationale: ಇದು ಅನಪೇಕ್ಷಿತ ಪರಿಣಾಮ ಸಂಭವಿಸುವ ಸಾಧ್ಯತೆಯ ಕುರಿತು ಎಚ್ಚರಿಕೆ ನೀಡುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಸಾಧ್ಯತಾರ್ಥಕ ರೂಪವು ಆ ತಡೆಗಟ್ಟುವ ಭಾವವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: συλλέγοντες
  choice: ಕೀಳುವಾಗ
  rationale: ಮುಖ್ಯ ಕ್ರಿಯೆಯೊಂದಿಗೇ ನಡೆಯುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಗ್ರೀಕ್ ಕೃದಂತವನ್ನು ಕಾಲಸಂಬಂಧದ ಕನ್ನಡ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ζιζάνια
  choice: ಕಳೆಗಳು
  rationale: ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಪದ; ಮೂಲಪದವು ಬಹುಶಃ ಗೋಧಿಯನ್ನು ಹೋಲುವ ಡಾರ್ನೆಲ್ ಎಂಬ ನಿರ್ದಿಷ್ಟ ಕಳೆಯನ್ನು ಸೂಚಿಸಬಹುದು ಎಂಬುದನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐκριζώσητε
  choice: ಬೇರುಸಹಿತ ಕಿತ್ತುಬಿಡಬಹುದು
  rationale: ಬೇರಿನಿಂದಲೇ ಕಿತ್ತುಹಾಕುವ ನಿರ್ದಿಷ್ಟ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἅμα αὐτοῖς
  choice: ಅವುಗಳೊಂದಿಗೆ
  rationale: ಕಳೆಗಳ ಜೊತೆಗೇ ಗೋಧಿಯೂ ಕಿತ್ತುಹೋಗುವ ಅರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: σῖτον
  choice: ಗೋಧಿ
  rationale: ಈ ಕೃಷಿ ಸನ್ನಿವೇಶದಲ್ಲಿ ಸಾಮಾನ್ಯ ಧಾನ್ಯಕ್ಕಿಂತ ಗೋಧಿಯೇ ಉದ್ದೇಶಿತ ಅರ್ಥವಾಗಿದೆ.
theological_decisions:
- issue: ζιζάνια ಪದದ ನಿರೂಪಣೆ
  choice: ಕಳೆಗಳು
  alternative: ಡಾರ್ನೆಲ್ ಕಳೆಗಳು / ಗೋಧಿಹುಲ್ಲು
  rationale: ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಸಾಮಾನ್ಯ ಪದವನ್ನು ಬಳಸಲಾಗಿದೆ; ಗೋಧಿಯನ್ನು ಹೋಲುವ ನಿರ್ದಿಷ್ಟ ಕಳೆಯ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿತಿನಲ್ಲಿ ಸೂಚಿಸಿ ಮೂಲದ ಸಸ್ಯಶಾಸ್ತ್ರೀಯ ಅನಿಶ್ಚಿತತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಕಥನಶೈಲಿ. ‘ಬೇಡ’ ಎಂಬುದು ಪ್ರಸ್ತಾಪಿತ ಕಾರ್ಯದ ನೇರ ನಿರಾಕರಣೆಯಾಗಿ ಬಳಸಲಾಗಿದೆ; ವಾಕ್ಯರಚನೆ ಮೂಲದ ಎಚ್ಚರಿಕೆಯ ಸಾಧ್ಯತಾರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
