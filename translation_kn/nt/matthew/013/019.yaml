id: MAT.13.19
reference: Matthew 13:19
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: kn
  text: ಯಾರಾದರೂ ರಾಜ್ಯದ ವಾಕ್ಯವನ್ನು ಕೇಳಿ ಅದನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳದಿದ್ದಾಗ, ದುಷ್ಟನು[a] ಬಂದು ಅವನ ಹೃದಯದಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟದ್ದನ್ನು ಕಸಿದುಕೊಳ್ಳುತ್ತಾನೆ. ಇವನೇ ದಾರಿಯ ಪಕ್ಕದಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಕೆಟ್ಟವನು.’
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ ‘ಹಾದಿಯ ಅಂಚಿನಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು’ ಅಥವಾ ‘ರಸ್ತೆಬದಿಯಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: ಯಾರಾದರೂ ... ಕೇಳಿ ... ಅರ್ಥಮಾಡಿಕೊಳ್ಳದಿದ್ದಾಗ
  rationale: ಗ್ರೀಕ್‌ನ ಸಾಮಾನ್ಯೀಕರಿಸುವ ಕೃದಂತ ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದ ಕಾಲಸೂಚಕ ವಾಕ್ಯವಾಗಿ ನೀಡಲಾಗಿದೆ; ‘ಯಾರಾದರೂ’ ಎಂಬುದು ಪ್ರತಿಯೊಬ್ಬ ವ್ಯಕ್ತಿಗೂ ಅನ್ವಯಿಸುವ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: λόγον τῆς βασιλείας
  choice: ರಾಜ್ಯದ ವಾಕ್ಯ
  rationale: λόγος ಎಂಬುದರ ‘ವಾಕ್ಯ/ಸಂದೇಶ’ ಅರ್ಥಗಳಲ್ಲಿ ‘ವಾಕ್ಯ’ವನ್ನು ಆರಿಸುವುದರಿಂದ ಬೀಜ ಮತ್ತು ವಾಕ್ಯದ ರೂಪಕಸಂಬಂಧ ಉಳಿಯುತ್ತದೆ; ಸಂಬಂಧವಿಭಕ್ತಿ ಗ್ರೀಕ್‌ನ ಸಂಕ್ಷಿಪ್ತತೆಯನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: μὴ συνιέντος
  choice: ಅದನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳದಿದ್ದಾಗ
  rationale: συνίημι ಇಲ್ಲಿ ಅರ್ಥವನ್ನು ಗ್ರಹಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ‘ಅದನ್ನು’ ಸೇರಿಸಿ, ಅದರ ಪೂರ್ವಪದವಾಗಿ ರಾಜ್ಯದ ವಾಕ್ಯವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
- source_word: ὁ πονηρὸς
  choice: ದುಷ್ಟನು
  rationale: ಲೇಖಸಹಿತ ವಿಶೇಷಣವು ಇಲ್ಲಿ ವ್ಯಕ್ತಿಗತ ದುಷ್ಟ ಪ್ರತಿನಿಧಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ದುಷ್ಟನು’ ಅದನ್ನು ವ್ಯಕ್ತಿಯಾಗಿ ಉಳಿಸಿ, ಪಠ್ಯ ಹೇಳುವುದಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದಿಲ್ಲ.
- source_word: ἁρπάζει
  choice: ಕಸಿದುಕೊಳ್ಳುತ್ತಾನೆ
  rationale: ἁρπάζωಯಲ್ಲಿರುವ ಬಲಾತ್ಕಾರವಾದ ಮತ್ತು ತ್ವರಿತವಾಗಿ ತೆಗೆದುಹಾಕುವ ಭಾವವನ್ನು ‘ಕಸಿದುಕೊಳ್ಳುತ್ತಾನೆ’ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: τὸ ἐσπαρμένον
  choice: ಬಿತ್ತಲ್ಪಟ್ಟದ್ದನ್ನು
  rationale: ನಪುಂಸಕಲಿಂಗದ ಪೂರ್ಣಕಾಲ ಕರ್ಮಣಿ ಕೃದಂತದ ವಸ್ತುರೂಪದ ಬಳಕೆಯನ್ನೂ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನೂ ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: ಅವನ ಹೃದಯದಲ್ಲಿ
  rationale: ಮೂಲದಲ್ಲಿರುವ ಏಕವಚನ ಪುಲ್ಲಿಂಗ ಸರ್ವನಾಮ ಮತ್ತು ಬೈಬಲಿನ ‘ಹೃದಯ’ ಪದಚಿತ್ರವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: οὗτός ἐστιν
  choice: ಇವನೇ
  rationale: ಕೇಳುವ ವ್ಯಕ್ತಿಯನ್ನು ಬೀಜ/ನೆಲದ ರೂಪಕದೊಂದಿಗೆ ಗುರುತಿಸುವ ಒತ್ತನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: ದಾರಿಯ ಪಕ್ಕದಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟವನು
  rationale: ವ್ಯಕ್ತಿಯನ್ನು ಬಿತ್ತಲ್ಪಟ್ಟ ಬೀಜದೊಂದಿಗೆ ರೂಪಕವಾಗಿ ಗುರುತಿಸುವ ಮೂಲದ ಅಸಾಮಾನ್ಯ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಸರಳಗೊಳಿಸದೆ ಉಳಿಸಲಾಗಿದೆ; ὁδόςಗೆ ಇಲ್ಲಿ ‘ದಾರಿ’ ಕೃಷಿದೃಶ್ಯಕ್ಕೆ ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: ὁ πονηρὸς ಎಂಬುದರ ಗುರುತು
  choice: ವ್ಯಕ್ತಿಗತ ದುಷ್ಟ ಪ್ರತಿನಿಧಿ—‘ದುಷ್ಟನು’
  alternative: ಅಮೂರ್ತವಾದ ‘ದುಷ್ಟತನ’ ಅಥವಾ ‘ಕೆಡುಕು’
  rationale: ಬಂದು ಬಿತ್ತಲ್ಪಟ್ಟದ್ದನ್ನು ಕಸಿದುಕೊಳ್ಳುವ ಕ್ರಿಯೆಗಳು ವ್ಯಕ್ತಿಗತ ಕರ್ತೃವನ್ನು ಸೂಚಿಸುತ್ತವೆ. ಆದರೆ ‘ಸೈತಾನನು’ ಎಂದು ಪಠ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟಪಡಿಸಲಾಗಿಲ್ಲ.
- issue: αὐτοῦನ ಲಿಂಗ ಮತ್ತು ವಚನ
  choice: ‘ಅವನ ಹೃದಯದಲ್ಲಿ’
  alternative: ‘ಅವರ ಹೃದಯದಲ್ಲಿ’ ಅಥವಾ ‘ಆ ವ್ಯಕ್ತಿಯ ಹೃದಯದಲ್ಲಿ’
  rationale: ಮೂಲದ ಪ್ರತಿನಿಧಿಕ ಏಕವಚನ ಪುಲ್ಲಿಂಗವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಆರಂಭದ ‘ಯಾರಾದರೂ’ ಅದರ ಸಾಮಾನ್ಯ ಅನ್ವಯವನ್ನು ತಿಳಿಸುತ್ತದೆ.
- issue: ವ್ಯಕ್ತಿ, ಬೀಜ ಮತ್ತು ನೆಲದ ರೂಪಕಾತ್ಮಕ ಗುರುತಿಸುವಿಕೆ
  choice: ‘ಇವನೇ ... ಬಿತ್ತಲ್ಪಟ್ಟವನು’ ಎಂಬ ಮೂಲದ ರೂಪಕತಣವನ್ನು ಉಳಿಸುವುದು
  alternative: ‘ಇವನು ದಾರಿಯ ಪಕ್ಕದಲ್ಲಿ ಬಿದ್ದ ಬೀಜದಂತಿದ್ದಾನೆ’ ಎಂದು ವಿವರಣಾತ್ಮಕವಾಗಿ ಸರಳಗೊಳಿಸುವುದು
  rationale: ಗ್ರೀಕ್ ವ್ಯಕ್ತಿಯನ್ನೇ ‘ಬಿತ್ತಲ್ಪಟ್ಟವನು’ ಎಂದು ಗುರುತಿಸುತ್ತದೆ. ಅದನ್ನು ವಿವರಣೆಯ ಮೂಲಕ ಒಂದೇ ರೀತಿಯಲ್ಲಿ ಪರಿಹರಿಸದೆ ಮೂಲದ ರೂಪಕಾತ್ಮಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಪೂರ್ಣ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ರಾಜ್ಯದ ವಾಕ್ಯ,’ ‘ಹೃದಯ,’ ಮತ್ತು ‘ಬಿತ್ತಲ್ಪಟ್ಟವನು’ ಎಂಬ ಪದಗಳನ್ನು ರೂಪಕ ಹಾಗೂ ಧಾರ್ಮಿಕ ತಣವನ್ನು ಉಳಿಸಲು ಆರಿಸಲಾಗಿದೆ. ಎಲ್ಲ ಅಡಿಕುರಿತು ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
