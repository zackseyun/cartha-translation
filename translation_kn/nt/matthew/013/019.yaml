  terminology: “ದುಷ್ಟನು” appropriately renders the personal “evil one” without naming the referent beyond the text. “ವಾಕ್ಯ,” “ಹೃದಯ,” and the passive forms for what is sown maintain established biblical terminology and the Greek passive/metaphorical texture.
