id: MAT.13.52
reference: Matthew 13:52
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: kn
  text: ಆಗ ಆತನು ಅವರಿಗೆ, “ಆದ್ದರಿಂದ ಪರಲೋಕರಾಜ್ಯಕ್ಕಾಗಿ ಶಿಷ್ಯನಾಗಿ ತರಬೇತಿ ಪಡೆದ ಪ್ರತಿಯೊಬ್ಬ ಶಾಸ್ತ್ರಿಯೂ[a] ತನ್ನ ಬೊಕ್ಕಸದಿಂದ[c] ಹೊಸದನ್ನೂ ಹಳೆಯದನ್ನೂ ಹೊರಗೆ ತರುವ ಮನೆಯ ಯಜಮಾನನಂತೆ[b] ಇದ್ದಾನೆ” ಎಂದು ಹೇಳಿದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಪರಲೋಕರಾಜ್ಯದ ಶಿಷ್ಯನಾದ ಪ್ರತಿಯೊಬ್ಬ ಶಾಸ್ತ್ರಿಯೂ.” ಗ್ರೀಕ್ ಕೃದಂತವು ಶಿಷ್ಯನನ್ನಾಗಿ ಮಾಡಲ್ಪಟ್ಟವನು ಎಂಬ ಅರ್ಥವನ್ನೂ, ಬೋಧನೆ ಅಥವಾ ತರಬೇತಿ ಪಡೆದವನು ಎಂಬ ಅರ್ಥವನ್ನೂ ಕೊಡಬಲ್ಲದು.
    reason: alternative_reading
  - marker: b
    text: ಅಥವಾ, “ಮನೆಯ ಮುಖ್ಯಸ್ಥನಂತೆ.”
    reason: lexical_alternative
  - marker: c
    text: “ಬೊಕ್ಕಸ” ಎಂಬುದು ಬೆಲೆಬಾಳುವ ವಸ್ತುಗಳ ಸಂಗ್ರಹವನ್ನಾಗಲಿ, ಅವುಗಳನ್ನು ಇಡುವ ಸಂಗ್ರಹಸ್ಥಳವನ್ನಾಗಲಿ ಸೂಚಿಸಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ಆದ್ದರಿಂದ
  rationale: ಹಿಂದಿನ ಸಂಭಾಷಣೆಯಿಂದ ಬರುವ ತಾರ್ಕಿಕ ತೀರ್ಮಾನವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: πᾶς γραμματεὺς
  choice: ಪ್ರತಿಯೊಬ್ಬ ಶಾಸ್ತ್ರಿಯೂ
  rationale: γραμματεύς ಎಂಬ ಪದದ ನೇರ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ; ಇಲ್ಲಿ ಕೇವಲ ಸಾಮಾನ್ಯ ಬೋಧಕನೆಂದು ಅರ್ಥವನ್ನು ವಿಸ್ತರಿಸುವುದಿಲ್ಲ.
- source_word: μαθητευθεὶς τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯಕ್ಕಾಗಿ ಶಿಷ್ಯನಾಗಿ ತರಬೇತಿ ಪಡೆದ
  rationale: ನಿಷ್ಕ್ರಿಯ ಕೃದಂತದ ಶಿಷ್ಯನನ್ನಾಗಿ ಮಾಡಲ್ಪಡುವ/ಬೋಧಿಸಲ್ಪಡುವ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನೂ, ದತ್ತಿವಿಭಕ್ತಿಯ ರಾಜ್ಯದ ಕಡೆಗಿನ ಅಭಿಮುಖತೆಯನ್ನೂ ಕನ್ನಡದಲ್ಲಿ ಹಿಡಿದಿಡುತ್ತದೆ.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ಮನೆಯ ಯಜಮಾನನಂತೆ
  rationale: ಮನೆ ಅಥವಾ ಕುಟುಂಬದ ಮೇಲೆ ಅಧಿಕಾರ ಮತ್ತು ಹೊಣೆಗಾರಿಕೆ ಹೊಂದಿರುವ ವ್ಯಕ್ತಿಯ ರೂಪಕವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ, ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ἐκβάλλει
  choice: ಹೊರಗೆ ತರುವ
  rationale: ಇಲ್ಲಿ ಬಲವಂತವಾಗಿ ಎಸೆಯುವುದು ಎಂಬುದಕ್ಕಿಂತ ಸಂಗ್ರಹದಿಂದ ಹೊರತೆಗೆದು ತರುವುದು ಎಂಬ ಸಂದರ್ಭೋಚಿತ ಅರ್ಥವಿದೆ.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: ತನ್ನ ಬೊಕ್ಕಸದಿಂದ
  rationale: θησαυρός ಸೂಚಿಸಬಹುದಾದ ಬೆಲೆಬಾಳುವ ಸಂಗ್ರಹ ಹಾಗೂ ಅದನ್ನು ಇಡುವ ಸ್ಥಳ—ಎರಡರ ಭಾವವನ್ನೂ ‘ಬೊಕ್ಕಸ’ ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ.
- source_word: καινὰ καὶ παλαιά
  choice: ಹೊಸದನ್ನೂ ಹಳೆಯದನ್ನೂ
  rationale: ಗ್ರೀಕ್‌ನ ನಪುಂಸಕ ಬಹುವಚನ ವಿಶೇಷಣಗಳು ಸೂಚಿಸುವ ಅಪ್ರಕಟಿತ ವಸ್ತುಗಳನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸಿ ಮೂಲ ಕ್ರಮವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: γραμματεύς ಮತ್ತು ಪರಲೋಕರಾಜ್ಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ μαθητευθεὶς ಪದದ ಅರ್ಥ
  choice: ಪರಲೋಕರಾಜ್ಯಕ್ಕಾಗಿ ಶಿಷ್ಯನಾಗಿ ತರಬೇತಿ ಪಡೆದ ಶಾಸ್ತ್ರಿ
  alternative: ಪರಲೋಕರಾಜ್ಯದ ಶಿಷ್ಯನಾದ ಶಾಸ್ತ್ರಿ
  rationale: ಶಿಷ್ಯತ್ವ ಮತ್ತು ಬೋಧನೆ/ತರಬೇತಿ ಎರಡನ್ನೂ ಒಟ್ಟಾಗಿ ಉಳಿಸಿ, ಇದನ್ನು ಕೇವಲ ಮತಾಂತರವೆಂದಾಗಲಿ ಕೇವಲ ಶಾಸ್ತ್ರೀಯ ಶಿಕ್ಷಣವೆಂದಾಗಲಿ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- issue: οἰκοδεσπότης ಪದದ ಸಾಮಾಜಿಕ ರೂಪಕ
  choice: ಮನೆಯ ಯಜಮಾನ
  alternative: ಮನೆಯ ಮುಖ್ಯಸ್ಥ
  rationale: ಮನೆಯ ಮೇಲೆ ಹೊಣೆಗಾರಿಕೆ ಮತ್ತು ಅಧಿಕಾರವಿರುವ ಪಾತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ; ಅದರಿಂದ ಹೆಚ್ಚುವರಿ ಸಿದ್ಧಾಂತಾತ್ಮಕ ನಿರ್ಣಯಗಳನ್ನು ಮಾಡುವುದಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದರೂ ಗೌರವಯುತವಾದ ಶೈಲಿ. ‘ಶಾಸ್ತ್ರಿ’ ಮತ್ತು ‘ಪರಲೋಕರಾಜ್ಯ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲೀಯ ಪದಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ತಾರ್ಕಿಕ ಸಂಪರ್ಕ, ರೂಪಕ ಮತ್ತು ‘ಹೊಸದು–ಹಳೆಯದು’ ಎಂಬ ಕ್ರಮವನ್ನು ಕಾಪಾಡಲಾಗಿದೆ.
