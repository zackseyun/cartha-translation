id: MAT.13.34
reference: Matthew 13:34
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: kn
  text: ಯೇಸು ಈ ಎಲ್ಲ ಸಂಗತಿಗಳನ್ನು ಜನಸಮೂಹಗಳಿಗೆ ದೃಷ್ಟಾಂತಗಳಲ್ಲಿ ಹೇಳಿದನು; ದೃಷ್ಟಾಂತವಿಲ್ಲದೆ ಅವರಿಗೆ ಏನನ್ನೂ ಹೇಳುತ್ತಿರಲಿಲ್ಲ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ದೃಷ್ಟಾಂತವಿಲ್ಲದೆ ಅವರಿಗೆ ಏನನ್ನೂ ಹೇಳಲಿಲ್ಲ.” ಗ್ರೀಕ್‌ನ ಅಪೂರ್ಣ ಭೂತಕಾಲದ ಕ್ರಿಯಾರೂಪವನ್ನು ರೂಢಿಯಾದ ಅಥವಾ ಮುಂದುವರಿದ ಭೂತಕಾಲವಾಗಿಯೂ, ಸರಳ ಭೂತಕಾಲವಾಗಿಯೂ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಬಹುದು.
    reason: ಕ್ರಿಯೆಯ ಕಾಲಾಂಶಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಅನುವಾದ ಪರ್ಯಾಯವನ್ನು ಉಳಿಸಲು.
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: ಈ ಎಲ್ಲ ಸಂಗತಿಗಳನ್ನು
  rationale: ಸೂಚಕ ಸರ್ವನಾಮದ ‘ಈ’ ಎಂಬ ಅರ್ಥವನ್ನೂ πάντα ಪದದ ಸಮಗ್ರತೆಯನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐλάλησεν
  choice: ಹೇಳಿದನು
  rationale: ಏಕಕಾಲದಲ್ಲಿ ಹಿಂದಿನ ಬೋಧನೆಯನ್ನು ಸಾರಾಂಶಗೊಳಿಸುವ aorist ಕ್ರಿಯೆಯನ್ನು ಸಹಜವಾದ ಸರಳ ಭೂತಕಾಲದಲ್ಲಿ ನೀಡುತ್ತದೆ.
- source_word: ἐν παραβολαῖς
  choice: ದೃಷ್ಟಾಂತಗಳ ಮೂಲಕ
  rationale: ἐν ಇಲ್ಲಿ ವಿಧಾನ ಅಥವಾ ಮಾಧ್ಯಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ದೃಷ್ಟಾಂತಗಳ ಮೂಲಕ’ ಎಂಬುದು ಆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: τοῖς ὄχλοις
  choice: ಜನಸಮೂಹಗಳಿಗೆ
  rationale: ಗ್ರೀಕ್ ಬಹುವಚನವನ್ನು ಉಳಿಸಿ, ‘multitudes’ ಎಂಬ ಹಳೆಯ ಶೈಲಿಯ ಬದಲು ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಕನ್ನಡವನ್ನು ಬಳಸುತ್ತದೆ.
- source_word: χωρὶς παραβολῆς
  choice: ದೃಷ್ಟಾಂತವಿಲ್ಲದೆ
  rationale: χωρίς ಪದದ ‘ಇಲ್ಲದೆ’ ಎಂಬ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ನೀಡುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಅನಿರ್ದಿಷ್ಟ ಏಕವಚನಾರ್ಥವನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: οὐδὲν ἐλάλει
  choice: ಏನನ್ನೂ ಹೇಳುತ್ತಿರಲಿಲ್ಲ
  rationale: ನಿರಾಕರಣೆಯನ್ನು ಪೂರ್ಣವಾಗಿ ಉಳಿಸುವುದರ ಜೊತೆಗೆ imperfect ಕ್ರಿಯೆಯ ರೂಢಿಯಾದ ಅಥವಾ ಮುಂದುವರಿದ ಭೂತಕಾಲದ ಅಂಶವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ಈ ಸರ್ವನಾಮವು ಹಿಂದಿನ ‘ಜನಸಮೂಹಗಳಿಗೆ’ ಎಂಬುದನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಅನಗತ್ಯ ಪುನರಾವರ್ತನೆಯಿಲ್ಲದೆ ನೇರವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ಎರಡನೆಯ ಉಪವಾಕ್ಯದಲ್ಲಿರುವ ἐλάλει ಎಂಬ imperfect ಕ್ರಿಯೆಯ ನಿರೂಪಣಾತ್ಮಕ ಒತ್ತು
  choice: ಈ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸು ಜನಸಮೂಹಗಳಿಗೆ ರೂಢಿಯಾಗಿ ದೃಷ್ಟಾಂತಗಳಲ್ಲಿಯೇ ಮಾತನಾಡುತ್ತಿದ್ದನು ಎಂಬ ಅಂಶವನ್ನು ‘ಹೇಳುತ್ತಿರಲಿಲ್ಲ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ‘ದೃಷ್ಟಾಂತವಿಲ್ಲದೆ ಅವರಿಗೆ ಏನನ್ನೂ ಹೇಳಲಿಲ್ಲ’ ಎಂಬ ಸರಳ ಭೂತಕಾಲದ ಅನುವಾದವೂ ಸಾಧ್ಯ.
  rationale: ಇದು ಸಿದ್ಧಾಂತಾತ್ಮಕ ವಿವಾದವನ್ನು ಪರಿಹರಿಸುವ ಪ್ರಯತ್ನವಲ್ಲ; ಗ್ರೀಕ್ imperfect‌ನ ರೂಢಿಯಾದ ಅಥವಾ ಮುಂದುವರಿದ ಕ್ರಿಯೆಯ ಸಾಧ್ಯತೆಯನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಉಳಿಸಿ, ಸರಳ ಭೂತಕಾಲದ ಸಾಧ್ಯತೆಯನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ತಿಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದ ಸರಳ, ಗೌರವಯುತ ನಿರೂಪಣಾ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ಸಾಮ್ಯ’ಕ್ಕಿಂತ ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ‘ದೃಷ್ಟಾಂತ’ವನ್ನು ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ; ವಾಕ್ಯದ ಎರಡನೆಯ ಭಾಗದಲ್ಲಿ Greek imperfect‌ನ ಅಂಶವನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
