id: MAT.13.21
reference: Matthew 13:21
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: kn
  text: ಆದರೆ ಅವನೊಳಗೆ ಬೇರು ಇಲ್ಲ; ಅವನು ಸ್ವಲ್ಪಕಾಲ ಮಾತ್ರ ಉಳಿಯುತ್ತಾನೆ. ವಾಕ್ಯದ ಕಾರಣದಿಂದ ಸಂಕಟ ಅಥವಾ ಹಿಂಸೆ ಬಂದಾಗ, ಅವನು ಕೂಡಲೇ ಎಡವುತ್ತಾನೆ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ದೂರ ಸರಿಯುತ್ತಾನೆ” ಅಥವಾ “ಮನನೊಂದುಕೊಳ್ಳುತ್ತಾನೆ.” ಗ್ರೀಕ್ ಕ್ರಿಯಾಪದವು ಎಡವುವುದು, ದೂರ ಸರಿಯುವುದು, ಅಥವಾ ಮನನೊಂದುಕೊಳ್ಳುವುದು ಎಂಬ ಅರ್ಥಗಳನ್ನು ಹೊಂದಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: ಅವನೊಳಗೆ ಬೇರು
  rationale: ಬಿತ್ತನೆಯ ಸಾಮ್ಯದ ಕೃಷಿರೂಪಕವನ್ನೂ ἐν ἑαυτῷ ಎಂಬ ಆಂತರಿಕ ಅರ್ಥವನ್ನೂ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: πρόσκαιρός
  choice: ಸ್ವಲ್ಪಕಾಲ ಮಾತ್ರ ಉಳಿಯುತ್ತಾನೆ
  rationale: ಕೇವಲ ಒಂದು ಅವಧಿಯವನು ಎಂಬ ಅಕ್ಷರಶಃ ಆದರೆ ಅಸಹಜ ರೂಪದ ಬದಲು, ದೀರ್ಘಕಾಲ ತಾಳದಿರುವ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟ ಮತ್ತು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: ಸಂಕಟ ಅಥವಾ ಹಿಂಸೆ ಬಂದಾಗ
  rationale: ಗ್ರೀಕ್‌ನ genitive absolute ರಚನೆಯನ್ನು ಕಾಲಸೂಚಕ ಉಪವಾಕ್ಯವಾಗಿ ಸಹಜ ಕನ್ನಡಕ್ಕೆ ಅನುವಾದಿಸುತ್ತದೆ; θλῖψις‌ನ ಒತ್ತಡ ಮತ್ತು ಕಷ್ಟದ ಅರ್ಥಕ್ಕೆ ‘ಸಂಕಟ’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: διὰ τὸν λόγον
  choice: ವಾಕ್ಯದ ಕಾರಣದಿಂದ
  rationale: λόγος ಎಂಬ ಪದವನ್ನು ‘ವಾಕ್ಯ’ ಎಂದು ಉಳಿಸಿ, ಸಾಮ್ಯದಲ್ಲಿ ಬಿತ್ತಲ್ಪಟ್ಟ ದೇವರ ಸಂದೇಶದೊಂದಿಗಿನ ಪದಸಂಬಂಧವನ್ನು ಕಾಪಾಡುತ್ತದೆ.
- source_word: εὐθὺς
  choice: ಕೂಡಲೇ
  rationale: ಒತ್ತಡ ಎದುರಾದ ತಕ್ಷಣ ಸಂಭವಿಸುವ ಪ್ರತಿಕ್ರಿಯೆಯ ತೀವ್ರತೆಯನ್ನು ನೈಸರ್ಗಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: σκανδαλίζεται
  choice: ಎಡವಿಬೀಳುತ್ತಾನೆ
  rationale: ಪದದ ಎಡವುವ ರೂಪಕವನ್ನು ಉಳಿಸುವುದರ ಜೊತೆಗೆ, ಒತ್ತಡದ ಕಾರಣದಿಂದ ಸ್ಥಿರವಾಗಿ ಮುಂದುವರಿಯದ ಫಲಿತಾಂಶವನ್ನೂ ಸೂಚಿಸುತ್ತದೆ; ವಿಶಾಲವಾದ ಪದಾರ್ಥವನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಹಿಂದಿನ ವಾಕ್ಯದಲ್ಲಿರುವ ಸಂತೋಷದ ಸ್ವೀಕಾರಕ್ಕೂ ಇಲ್ಲಿ ಹೇಳುವ ಬೇರುರಹಿತ ಸ್ಥಿತಿಗೂ ಇರುವ ವಿರೋಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಶಿಷ್ಯತ್ವದ ಸನ್ನಿವೇಶದಲ್ಲಿ σκανδαλίζεται ಪದದ ಅರ್ಥ
  choice: ಎಡವಿಬೀಳುತ್ತಾನೆ
  alternative: ದೂರ ಸರಿಯುತ್ತಾನೆ; ಅಪರಾಧಪಡುತ್ತಾನೆ
  rationale: ‘ಎಡವಿಬೀಳುತ್ತಾನೆ’ ಗ್ರೀಕ್ ರೂಪಕ ಮತ್ತು ಶಿಷ್ಯತ್ವದಲ್ಲಿ ಉಂಟಾಗುವ ಕುಸಿತ ಎರಡನ್ನೂ ಹಿಡಿದಿಡುತ್ತದೆ. ‘ವಿಶ್ವಾಸತ್ಯಾಗ ಮಾಡುತ್ತಾನೆ’ ಎಂಬ ಹೆಚ್ಚು ನಿರ್ದಿಷ್ಟ ಧಾರ್ಮಿಕ ನಿರ್ಣಯವನ್ನು ಹೇರದೆ, ಪರ್ಯಾಯ ಅರ್ಥಗಳನ್ನು ಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನತೆಯುಳ್ಳ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಕೃಷಿರೂಪಕವಾದ ‘ಬೇರು’ ಮತ್ತು ಸುವಾರ್ತೆಯ ಪ್ರಮುಖ ಪದಸಂಬಂಧವಾದ ‘ವಾಕ್ಯ’ ಉಳಿಸಲಾಗಿದೆ; ಎರಡು ವಾಕ್ಯಗಳ ವಿರಾಮಚಿಹ್ನೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ ಓದಿಗೆ ನೆರವಾಗುತ್ತದೆ.
