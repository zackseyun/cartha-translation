    rationale: The footnote is intended to preserve the semantic range of σκανδαλίζεται. Natural alternatives such as “ದೂರ ಸರಿಯುತ್ತಾನೆ” and “ಮನನೊಂದುಕೊಳ್ಳುತ್ತಾನೆ” better communicate ‘falls away/takes offense’ without misleading the reader.
