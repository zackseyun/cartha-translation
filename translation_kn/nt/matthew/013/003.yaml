id: MAT.13.3
reference: Matthew 13:3
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ ἐλάλησεν αὐτοῖς πολλὰ ἐν παραβολαῖς λέγων· Ἰδοὺ ἐξῆλθεν ὁ σπείρων τοῦ σπείρειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: kn
  text: 'ಅವರು ಅವರಿಗೆ ಅನೇಕ ವಿಷಯಗಳನ್ನು ದೃಷ್ಟಾಂತಗಳ ಮೂಲಕ ಹೀಗೆ ಹೇಳಿದರು: “ನೋಡಿ, ಬಿತ್ತುವವನು ಬಿತ್ತಲು ಹೊರಟನು.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραβολαῖς
  choice: ದೃಷ್ಟಾಂತಗಳ ಮೂಲಕ
  rationale: ಯೇಸುವಿನ ಹೋಲಿಕೆ ಅಥವಾ ಕಥಾರೂಪದ ಬೋಧನೆಗಳನ್ನು ಸೂಚಿಸುವ ಪರಿಚಿತ, ಗೌರವಯುತ ಕನ್ನಡ ಪದಪ್ರಯೋಗ; ἐν ಎಂಬ ಸಾಧನಾರ್ಥವನ್ನೂ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: Ἰδοὺ
  choice: ನೋಡಿ
  rationale: ಕೇಳುಗರ ಗಮನ ಸೆಳೆಯುವ ಆಜ್ಞಾರ್ಥಕ ಉದ್ಗಾರವನ್ನು ಆಧುನಿಕ, ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ὁ σπείρων
  choice: ಬಿತ್ತುವವನು
  rationale: ನಿರ್ದಿಷ್ಟ ವ್ಯಕ್ತಿನಾಮ ಅಥವಾ ಹೆಚ್ಚುವರಿ ವ್ಯಾಖ್ಯಾನ ಸೇರಿಸದೆ, ವರ್ತಮಾನ ಕೃದಂತದ ಕರ್ತೃಸೂಚಕ ಅರ್ಥವನ್ನು ನೇರವಾಗಿ ಕೊಡುತ್ತದೆ.
- source_word: ἐξῆλθεν ... τοῦ σπείρειν
  choice: ಬಿತ್ತಲು ಹೊರಟನು
  rationale: ಉದ್ದೇಶವನ್ನು ಸೂಚಿಸುವ τοῦ + infinitive ರಚನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ನಿಖರವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳವಾದರೂ ಗೌರವಯುತವಾದ ಕಥನಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಗಮನಸೆಳೆಯುವ ‘Ἰδοὺ’ ಅನ್ನು ಕೈಬಿಡದೆ ‘ನೋಡಿ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
