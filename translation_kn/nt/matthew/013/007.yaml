    text: ಗ್ರೀಕ್‌ನಲ್ಲಿ ಪದಶಃ ‘ಮುಳ್ಳುಗಳ ಮೇಲೆ ಬಿದ್ದವು.’ ಕೃಷಿಯ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ‘ಮುಳ್ಳುಗಳ ನಡುವೆ’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ಬೇರೆ ಕೆಲವು ಬೀಜಗಳು
  rationale: ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನ ವಿಶೇಷಣವು ನಾಮಪದದಂತೆ ಬಳಕೆಯಾಗಿದ್ದು, ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿರುವ ಬೀಜಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜವಾಗಿ ಮಾಡಲು ‘ಬೀಜಗಳು’ ಎಂದು ಪೂರೈಸಲಾಗಿದೆ.
- source_word: δὲ
  choice: ಪ್ರತ್ಯೇಕ ಪದವಾಗಿ ಅನುವಾದಿಸದೆ ವಾಕ್ಯಕ್ರಮದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ
  rationale: ಇಲ್ಲಿ δέ ಬಲವಾದ ವಿರೋಧವನ್ನು ಸೂಚಿಸದೆ ದೃಷ್ಟಾಂತದ ಮುಂದಿನ ಘಟನೆಯನ್ನು ಪರಿಚಯಿಸುವ ಸೌಮ್ಯ ಸಂಯೋಜಕವಾಗಿದೆ; ಕನ್ನಡದಲ್ಲಿ ಹೊಸ ವಾಕ್ಯದ ಕ್ರಮವೇ ಅದರ ಕಾರ್ಯವನ್ನು ಸಹಜವಾಗಿ ಹೊರುತ್ತದೆ.
- source_word: ἔπεσεν
  choice: ಬಿದ್ದವು
  rationale: πίπτω ಕ್ರಿಯಾಪದದ ನೇರ ಅರ್ಥವಾದ ‘ಬೀಳುವುದು’ ಉಳಿಸಲಾಗಿದೆ; ‘ಬಿತ್ತಲ್ಪಟ್ಟವು’ ಎಂದು ಅರ್ಥವಿಸ್ತರಣೆ ಮಾಡಿಲ್ಲ. ಗ್ರೀಕ್‌ನಲ್ಲಿ ಕ್ರಿಯಾಪದ ಏಕವಚನದಲ್ಲಿದ್ದರೂ ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನ ಕರ್ತೃಗೆ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಬಹುವಚನ ಕ್ರಿಯಾರೂಪ ಬಳಸಲಾಗಿದೆ.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: ಮುಳ್ಳುಗಳ ನಡುವೆ
  rationale: ἐπί + accusative ರೂಪವು ಪದಶಃ ‘ಮುಳ್ಳುಗಳ ಮೇಲೆ’ ಎಂದಾಗಬಹುದಾದರೂ, ಕೃಷಿ ಸಂದರ್ಭದಲ್ಲಿನ ಅರ್ಥವು ಮುಳ್ಳಿನ ಗಿಡಗಳಿದ್ದ ಜಾಗದಲ್ಲಿ ಬೀಜಗಳು ಬೀಳುವುದಾಗಿದೆ. ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ‘ನಡುವೆ’ ಆಯ್ಕೆಮಾಡಿ, ಪದಶಃ ರೂಪವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἀκάνθας / ἄκανθαι
  choice: ಮುಳ್ಳುಗಳು
  rationale: ἀκάνθη ಮುಳ್ಳು ಅಥವಾ ಮುಳ್ಳಿನ ಗಿಡವನ್ನು ಸೂಚಿಸಬಹುದು. ದೃಷ್ಟಾಂತದ ಪರಿಚಿತ ಕೃಷಿ ಚಿತ್ರಣವನ್ನು ಸರಳವಾಗಿ ಉಳಿಸುವ ಸಾಮಾನ್ಯ ಕನ್ನಡ ಪದ ‘ಮುಳ್ಳುಗಳು’.
- source_word: ἀνέβησαν
  choice: ಬೆಳೆದು
  rationale: ἀναβαίνωಯ ‘ಮೇಲೆ ಬರುವುದು’ ಎಂಬ ಬೆಳವಣಿಗೆಯ ಚಿತ್ರಣವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ‘ಬೆಳೆದು’ ಎಂಬ ರೂಪದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.
- source_word: ἔπνιξαν
  choice: ಅಡಗಿಸಿಬಿಟ್ಟವು
  rationale: πνίγωಯ ಮೂಲ ಚಿತ್ರ ‘ಉಸಿರುಗಟ್ಟಿಸುವುದು/ಕತ್ತು ಹಿಸುಕುವುದು’; ಸಸ್ಯಗಳ ಸಂದರ್ಭದಲ್ಲಿ ಮುಳ್ಳುಗಳು ಬೆಳಕನ್ನೂ ಸ್ಥಳವನ್ನೂ ಕಸಿದು ಬೀಜದ ಸಸಿಗಳನ್ನು ಬೆಳೆಯದಂತೆ ಮಾಡುವ ಅರ್ಥಕ್ಕೆ ‘ಅಡಗಿಸಿಬಿಟ್ಟವು’ ಸಹಜ ಕೃಷಿ ರೂಪಕವಾಗಿದೆ.
- source_word: αὐτά
  choice: ಅವುಗಳನ್ನು
  rationale: ನಪುಂಸಕಲಿಂಗ ಬಹುವಚನ ಸರ್ವನಾಮದ ಅನಿರ್ದಿಷ್ಟ ಉಲ್ಲೇಖವನ್ನು ಹಾಗೆಯೇ ಉಳಿಸಲಾಗಿದೆ; ‘ಬೀಜದ ಸಸಿಗಳನ್ನು’ ಎಂದು ಹೆಚ್ಚು ಸ್ಪಷ್ಟಪಡಿಸಿ ಮೂಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸಿಲ್ಲ.
