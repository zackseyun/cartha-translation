  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: kn
  text: ಇತರ ಬೀಜಗಳು ಮುಳ್ಳುಗಳ ನಡುವೆ ಬಿದ್ದವು[a]. ಮುಳ್ಳುಗಳು ಬೆಳೆದು ಅವುಗಳನ್ನು ಉಸಿರುಗಟ್ಟಿಸಿದವು.
  philosophy: optimal-equivalence
  footnotes:
