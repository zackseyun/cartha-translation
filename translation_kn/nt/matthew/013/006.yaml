id: MAT.13.6
reference: Matthew 13:6
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: kn
  text: ಆದರೆ ಸೂರ್ಯನು ಉದಯಿಸಿದಾಗ ಅದು ಬಿಸಿಲಿಗೆ ಸುಟ್ಟುಹೋಯಿತು; ಬೇರು ಇಲ್ಲದ ಕಾರಣ ಒಣಗಿಹೋಯಿತು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ ‘ಬಾಡಿಹೋಯಿತು.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: ಆದರೆ ಸೂರ್ಯನು ಉದಯಿಸಿದಾಗ
  rationale: ಕರ್ತೃಸಂಬಂಧಿ ಸ್ವತಂತ್ರ ರಚನೆಯ ಕಾಲಸೂಚಕ ಅರ್ಥವನ್ನು ಸಹಜ ಕನ್ನಡದ ಕಾಲವಾಕ್ಯವಾಗಿ ನೀಡಲಾಗಿದೆ; δέ ಸೂಚಿಸುವ ಸೌಮ್ಯವಾದ ವ್ಯತ್ಯಾಸವನ್ನು ‘ಆದರೆ’ ಉಳಿಸುತ್ತದೆ.
- source_word: ἐκαυματίσθη
  choice: ಬಿಸಿಲಿಗೆ ಸುಟ್ಟುಹೋಯಿತು
  rationale: ಸಸ್ಯವು ಸೂರ್ಯನ ಉಷ್ಣದಿಂದ ದಹಿಸಲ್ಪಟ್ಟದ್ದನ್ನು ಸೂಚಿಸುವ ಕರ್ಮಣಿ ಅರ್ಥವನ್ನು ಸಹಜ ಸಸ್ಯಚಿತ್ರಣದೊಂದಿಗೆ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ಇಲ್ಲದ ಕಾರಣ
  rationale: διά ಜೊತೆಯಲ್ಲಿರುವ ನಾಮೀಕೃತ ಕ್ರಿಯಾರೂಪದ ಸ್ಪಷ್ಟ ಕಾರಣಾರ್ಥವನ್ನು ಸಂಕ್ಷಿಪ್ತವಾದ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ῥίζαν
  choice: ಬೇರು
  rationale: ಗ್ರೀಕ್ ಮೂಲದಲ್ಲಿರುವ ಏಕವಚನವನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ಸಹಜವಾಗಿ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἐξηράνθη
  choice: ಒಣಗಿಹೋಯಿತು
  rationale: ಸಸ್ಯದ ಸಂದರ್ಭದಲ್ಲಿ ξηραίνω ಪದವು ಒಣಗಿ ನಾಶವಾಗುವ ಫಲಿತಾಂಶವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಈ ಕನ್ನಡ ರೂಪವು ಆ ಅರ್ಥವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಸಹಜ ಮತ್ತು ಘನತೆಯುಳ್ಳ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ಮೂಲದ ಕೃಷಿಚಿತ್ರಣ ಮತ್ತು ಕಾರಣ–ಫಲ ಸಂಬಂಧವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ಇಂಗ್ಲಿಷ್ ಸಲಹಾ ಪಠ್ಯದಲ್ಲಿ [a] ಗುರುತು ‘sun rose’ ನಂತರ ಇದ್ದರೂ, ಅದರ ಟಿಪ್ಪಣಿ ξηραίνω ಎಂಬ ಕೊನೆಯ ಕ್ರಿಯಾಪದದ ಪರ್ಯಾಯ ಅರ್ಥಕ್ಕೆ ಸಂಬಂಧಿಸುವುದರಿಂದ ಗುರುತನ್ನು ‘ಒಣಗಿಹೋಯಿತು’ ನಂತರ ಇರಿಸಲಾಗಿದೆ.
