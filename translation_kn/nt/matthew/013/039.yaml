id: MAT.13.39
reference: Matthew 13:39
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: kn
  text: ಅವುಗಳನ್ನು ಬಿತ್ತಿದ ಶತ್ರು ಸೈತಾನನು ಆಗಿದ್ದಾನೆ; ಕೊಯ್ಲು ಯುಗದ ಅಂತ್ಯ[a] ಆಗಿದೆ; ಕೊಯ್ಯುವವರು ದೇವದೂತರು ಆಗಿದ್ದಾರೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಯುಗದ ಪರಿಪೂರ್ಣ ಸಮಾಪ್ತಿ”; ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ, “ಲೋಕದ ಅಂತ್ಯ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: ಶತ್ರು
  rationale: ವೈಯಕ್ತಿಕ ವಿರೋಧಿಯನ್ನು ಸೂಚಿಸುವ ಸಹಜ ಮತ್ತು ನೇರ ಕನ್ನಡ ಪದ.
- source_word: ὁ σπείρας
  choice: ಬಿತ್ತಿದ
  rationale: ಪೂರ್ಣಗೊಂಡ ಬಿತ್ತುವ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಭೂತಕಾಲದ ಕೃದಂತ; ಸಾಮ್ಯದ ಕೃಷಿ ರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτά
  choice: ಅವುಗಳನ್ನು
  rationale: ಹಿಂದೆ ಉಲ್ಲೇಖಿಸಿದ ಕಳೆಗಳನ್ನು ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: διάβολος
  choice: ಸೈತಾನನು
  rationale: ಈ ಸಂದರ್ಭದಲ್ಲಿ ದುಷ್ಟ ವೈಯಕ್ತಿಕ ಸತ್ತೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಸೂಚಿಸುವ, ಸಾಮಾನ್ಯ ಕನ್ನಡ ಬೈಬಲ್ ಬಳಕೆಯಲ್ಲಿ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವ ಪದ; ಪದಶಃ ‘ನಿಂದಕ’ ಎಂದರೆ ಉದ್ದೇಶಿತ ಗುರುತು ಮಸುಕಾಗಬಹುದು.
- source_word: θερισμὸς
  choice: ಕೊಯ್ಲು
  rationale: ಸಾಮ್ಯದ ಕೃಷಿ ಚಿತ್ರಣವನ್ನು ಉಳಿಸುವ ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡ ನಾಮಪದ.
- source_word: συντέλεια αἰῶνός
  choice: ಈ ಯುಗದ ಅಂತ್ಯ
  rationale: αἰών ಪದದ ಕಾಲಘಟ್ಟದ ಅರ್ಥವನ್ನು ಉಳಿಸಿ, ಭೌತಿಕ ಲೋಕದ ನಾಶವೆಂಬ ಅಗತ್ಯವಿಲ್ಲದ ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ; ಸಂದರ್ಭದಿಂದ ಸೂಚಿತ ‘ಈ’ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ ಸ್ಪಷ್ಟತೆಯನ್ನು ನೀಡುತ್ತದೆ.
- source_word: θερισταὶ
  choice: ಕೊಯ್ಯುವವರು
  rationale: ಕೃಷಿ ರೂಪಕವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ತಕ್ಷಣ ಅರ್ಥವಾಗುವ ರೂಪ.
- source_word: ἄγγελοί
  choice: ದೇವದೂತರು
  rationale: ಅಂತ್ಯಕಾಲದ ಸಂದರ್ಭದಲ್ಲಿ ಇದು ಮಾನವ ಸಂದೇಶವಾಹಕರಿಗಿಂತ ಸ್ವರ್ಗೀಯ ದೂತರನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: δὲ
  choice: ವಾಕ್ಯವಿನ್ಯಾಸ ಮತ್ತು ಅರ್ಧವಿರಾಮದ ಮೂಲಕ ಸಂಕ್ರಮಣ
  rationale: ಪುನರಾವರ್ತಿತ δέ ವಿವರಣೆಯ ಮುಂದುವರಿಕೆಯನ್ನು ಗುರುತಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಯೊಂದು ಖಂಡಕ್ಕೂ ಸಂಯೋಜಕವನ್ನು ಮರುಕಳಿಸುವುದಕ್ಕಿಂತ ವಿರಾಮಚಿಹ್ನೆ ಸಹಜವಾಗಿದೆ.
theological_decisions:
- issue: συντέλεια αἰῶνός ಎಂಬ ಅಂತ್ಯಕಾಲದ ಪದಗುಚ್ಛದಲ್ಲಿ αἰών ಪದದ ಅನುವಾದ
  choice: ಈ ಯುಗದ ಅಂತ್ಯ
  alternative: ಯುಗದ ಪರಿಪೂರ್ಣ ಸಮಾಪ್ತಿ; ಲೋಕದ ಅಂತ್ಯ
  rationale: αἰών ಅನ್ನು ‘ಯುಗ’ ಎಂದು ಅನುವಾದಿಸುವುದು ಅದರ ಕಾಲಸಂಬಂಧಿ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಸೃಷ್ಟಿಯ ಭೌತಿಕ ನಾಶವನ್ನು ಅನಿವಾರ್ಯವಾಗಿ ಸೂಚಿಸುವುದಿಲ್ಲ. συντέλεια ಅಂತ್ಯ ಅಥವಾ ಸಮಾಪ್ತಿಯ ಭಾವವನ್ನು ಹೊಂದಿರುವುದರಿಂದ ಪರ್ಯಾಯವನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡ; ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾಗಿ ಅರ್ಥವಾಗುವಂತೆ, ಆದರೆ ಘನತೆಯುಳ್ಳ ಸಂಕ್ಷಿಪ್ತ ಶೈಲಿ. ಕೃಷಿ ರೂಪಕ ಮತ್ತು ಅಂತ್ಯಕಾಲದ ಪದಗುಚ್ಛದ ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
