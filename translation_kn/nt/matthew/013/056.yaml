id: MAT.13.56
reference: Matthew 13:56
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: kn
  text: ಆತನ ಸಹೋದರಿಯರೆಲ್ಲರೂ ನಮ್ಮೊಂದಿಗೆ ಇದ್ದಾರಲ್ಲವೇ? ಹಾಗಾದರೆ ಈತನಿಗೆ ಇವೆಲ್ಲವೂ ಎಲ್ಲಿಂದ ಬಂದವು?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಸ್ತ್ರೀ ಬಂಧುಗಳು.’ ಇಲ್ಲಿ ಗ್ರೀಕ್ ಪದವು ಸಾಮಾನ್ಯವಾಗಿ ‘ಸಹೋದರಿಯರು’ ಎಂದರ್ಥ; ಆದರೆ ನಂತರದ ದೇವತಾಶಾಸ್ತ್ರೀಯ ಚರ್ಚೆಗಳ ಬೆಳಕಿನಲ್ಲಿ ಕೆಲವರು ಅದನ್ನು ವಿಶಾಲವಾದ ಅರ್ಥದಲ್ಲಿ ಗ್ರಹಿಸುತ್ತಾರೆ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: ಸಹೋದರಿಯರು
  rationale: ಈ ಕುಟುಂಬಸಂದರ್ಭದಲ್ಲಿ ಗ್ರೀಕ್ ಪದದ ಸಾಮಾನ್ಯ ಮತ್ತು ನೇರ ಅರ್ಥ ‘ಸಹೋದರಿಯರು’; ವಿಶಾಲ ಬಂಧುತ್ವದ ಅರ್ಥವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಆಮದು ಮಾಡಿಲ್ಲ.
- source_word: οὐχὶ πᾶσαι
  choice: ಎಲ್ಲರೂ ... ಇದ್ದಾರಲ್ಲವೇ?
  rationale: ಈ ರೂಪವು ಒಪ್ಪಿಗೆಯ ಉತ್ತರವನ್ನು ನಿರೀಕ್ಷಿಸುವ ಅಲಂಕಾರಿಕ ಪ್ರಶ್ನೆ; ಕನ್ನಡದ ‘ಅಲ್ಲವೇ?’ ಅದನ್ನು ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: πρὸς ἡμᾶς
  choice: ನಮ್ಮೊಂದಿಗೇ
  rationale: ಸ್ಥಳೀಯ ಸಮುದಾಯದೊಂದಿಗಿನ ಉಪಸ್ಥಿತಿ ಮತ್ತು ಒಡನಾಟವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘-ಏ’ ಸಮುದಾಯದವರಿಗೆ ಪರಿಚಿತರಾಗಿರುವ ಅಂಶಕ್ಕೆ ಒತ್ತು ನೀಡುತ್ತದೆ.
- source_word: πόθεν
  choice: ಎಲ್ಲಿಂದ ಬಂದವು
  rationale: ಮೂಲ ಅಥವಾ ಉಗಮದ ಕುರಿತ ಪ್ರಶ್ನೆಯನ್ನು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: οὖν
  choice: ಹಾಗಾದರೆ
  rationale: ಜನರ ತರ್ಕದಲ್ಲಿನ ನಿರ್ಣಯಾತ್ಮಕ ಮುಂದಿನ ಹೆಜ್ಜೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ.
- source_word: τούτῳ
  choice: ಈತನಿಗೆ
  rationale: ಯೇಸುವನ್ನು ಸೂಚಿಸುವ ದತ್ತಿವಿಭಕ್ತಿಯ demonstrative ಅನ್ನು ನೇರವಾಗಿ ಉಳಿಸಿ, ಸಂದರ್ಭದಲ್ಲಿರುವ ಸ್ವಲ್ಪ ತಿರಸ್ಕಾರಭಾವವನ್ನೂ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
- source_word: ταῦτα πάντα
  choice: ಇವೆಲ್ಲವೂ
  rationale: ಹಿಂದಿನ ಸಂದರ್ಭದಲ್ಲಿ ಹೇಳಲಾದ ಜ್ಞಾನ ಮತ್ತು ಅದ್ಭುತ ಕಾರ್ಯಗಳ ಸಮಗ್ರ ಸೂಚನೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಯೇಸುವಿನ ‘ಸಹೋದರಿಯರು’ ಎಂಬ ಉಲ್ಲೇಖದ ಸ್ವರೂಪ
  choice: ἀδελφαὶ ಎಂಬುದನ್ನು ಅದರ ಸಾಮಾನ್ಯ ಅರ್ಥವಾದ ‘ಸಹೋದರಿಯರು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಸ್ತ್ರೀ ಬಂಧುಗಳು / ಸಂಬಂಧಿಕ ಸ್ತ್ರೀಯರು
  rationale: ಮೂಲಪದದ ಸಹಜ ಅರ್ಥ ಮತ್ತು ಕುಟುಂಬಸಂದರ್ಭಕ್ಕೆ ‘ಸಹೋದರಿಯರು’ ಸರಿಹೊಂದುತ್ತದೆ. ನಂತರದ ಸಿದ್ಧಾಂತಾತ್ಮಕ ಚರ್ಚೆಗಳನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಪರಿಹರಿಸದೆ, ಪಠ್ಯದ ಉದ್ವಿಗ್ನತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜ, ಗೌರವಯುತ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ವಾಕ್ಯರಚನೆ. ‘ಈತನಿಗೆ’ ಎಂಬ ರೂಪವು ಮೂಲದಲ್ಲಿನ ಸೂಚಕ ಮತ್ತು ಸ್ವಲ್ಪ ತಿರಸ್ಕಾರಭರಿತ ಧ್ವನಿಯನ್ನು ಅತಿರೇಕವಿಲ್ಲದೆ ಉಳಿಸುತ್ತದೆ.
