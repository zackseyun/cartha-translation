  naturalness: The sentence is fluent modern standard Kannada. ‘ಉಪಮೆ’ is more current and broadly familiar than ‘ಸಾಮ್ಯಕಥೆ,’ while retaining the established biblical sense. ‘ಎಂದು ಹೇಳಿದರು’ is natural in direct discourse and more source-close than ‘ಎಂದು ಕೇಳಿದರು.’
  terminology: ‘ಉಪಮೆ’ appropriately renders παραβολή without imposing an interpretive meaning. No theological terminology is involved.
  issues:
