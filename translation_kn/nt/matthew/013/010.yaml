    issue: ‘ಎಂದು ಕೇಳಿದರು’ translates εἶπαν as ‘asked.’
    rationale: Though idiomatic with a direct question, it narrows the source verb ‘said.’ ‘ಎಂದು ಹೇಳಿದರು’ preserves the Greek wording while the question itself makes the speech act clear.
  - severity: low
    issue: ‘ಸಾಮ್ಯಕಥೆಗಳ’ is less natural than ‘ಉಪಮೆಗಳ’ in modern standard Kannada.
    rationale: ‘ಉಪಮೆ’ is the usual contemporary biblical and general-language equivalent for παραβολή; it retains the plural and does not overdefine the literary form.
