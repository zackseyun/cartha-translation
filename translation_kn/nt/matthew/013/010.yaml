id: MAT.13.10
reference: Matthew 13:10
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: kn
  text: ಆಗ ಶಿಷ್ಯರು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು, “ನೀನು ಅವರಿಗೆ ಉಪಮೆಗಳ ಮೂಲಕ ಏಕೆ ಮಾತನಾಡುತ್ತೀ?” ಎಂದು ಹೇಳಿದರು.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, “ಶಿಷ್ಯರು ಯೇಸುವಿನ ಬಳಿಗೆ ಸಮೀಪಿಸಿ, ‘ನೀನು ಅವರಿಗೆ ಉಪಮೆಗಳಲ್ಲಿ ಏಕೆ ಮಾತನಾಡುತ್ತೀ?’ ಎಂದು ಹೇಳಿದರು.” ಗ್ರೀಕ್‌ನ ಕೃದಂತ ರೂಪವು ಅವರು ಮಾತನಾಡುವ ಮೊದಲು ಯೇಸುವಿನ ಸಮೀಪಕ್ಕೆ ಬಂದದ್ದನ್ನು ಸೂಚಿಸುತ್ತದೆ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ಆಗ
  rationale: ಇಲ್ಲಿ καί ಮುಂದಿನ ಘಟನೆಯನ್ನು ನಿರೂಪಣೆಯಲ್ಲಿ ಮುಂದುವರಿಸುತ್ತದೆ; ‘ಆಗ’ ಸಹಜ ಕನ್ನಡ ಕಥನಪ್ರವಾಹವನ್ನು ಕೊಡುತ್ತದೆ.
- source_word: προσελθόντες
  choice: ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದು
  rationale: προσέρχομαι ಯೇಸುವಿನ ಸಮೀಪಕ್ಕೆ ಬಂದ ಚಲನೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಉಲ್ಲೇಖಿತ ವ್ಯಕ್ತಿಯನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದು ಸಹಜ; ‘ಬಳಿಗೆ ಬಂದು’ ಮಾತಾಡುವ ಮೊದಲು ಸಮೀಪಿಸಿದ ಅರ್ಥವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: οἱ μαθηταὶ
  choice: ಶಿಷ್ಯರು
  rationale: ನಿರ್ದಿಷ್ಟವಾಗಿ ಈಗಾಗಲೇ ಪರಿಚಿತವಾದ ಶಿಷ್ಯರ ಗುಂಪನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕನ್ನಡದಲ್ಲಿ ಈ ಸಂದರ್ಭದಲ್ಲಿ ಪ್ರತ್ಯೇಕ ನಿರ್ದಿಷ್ಟ ಲೇಖನ ಅಗತ್ಯವಿಲ್ಲ.
- source_word: εἶπαν αὐτῷ
  choice: ಎಂದು ಕೇಳಿದರು
  rationale: ಮೂಲ ಕ್ರಿಯಾಪದದ ಶಾಬ್ದಿಕ ಅರ್ಥ ‘ಅವನಿಗೆ ಹೇಳಿದರು’ ಆದರೂ ನೇರ ಪ್ರಶ್ನೆಯನ್ನು ಪರಿಚಯಿಸುವ ಇಲ್ಲಿ ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ‘ಕೇಳಿದರು’ ಎಂದು ಹೇಳುವುದು ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: Διὰ τί
  choice: ಏಕೆ
  rationale: ಕಾರಣವನ್ನು ಕೇಳುವ ಸಾಮಾನ್ಯ ಮತ್ತು ಸಂಕ್ಷಿಪ್ತ ಕನ್ನಡ ಪ್ರಶ್ನಾರ್ಥಕ ರೂಪ.
- source_word: ἐν παραβολαῖς
  choice: ಸಾಮ್ಯಕಥೆಗಳ ಮೂಲಕ
  rationale: ἐν ಇಲ್ಲಿ ಮಾತಿನ ವಿಧಾನ ಅಥವಾ ಮಾಧ್ಯಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಮೂಲಕ’ ಎಂಬುದು ಸಾಮ್ಯಕಥೆಗಳನ್ನು ಉಪಯೋಗಿಸಿ ಮಾತನಾಡುವ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ನೀಡುತ್ತದೆ.
- source_word: λαλεῖς
  choice: ಮಾತನಾಡುತ್ತೀ
  rationale: ವರ್ತಮಾನಕಾಲದ ಎರಡನೇ ವ್ಯಕ್ತಿ ಏಕವಚನವನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτοῖς
  choice: ಅವರಿಗೆ
  rationale: ಯೇಸು ಯಾರನ್ನು ಉದ್ದೇಶಿಸಿ ಮಾತನಾಡುತ್ತಿದ್ದಾನೋ ಆ ಶ್ರೋತೃಗಳನ್ನು ಸೂಚಿಸುವ ದತ್ತಿವಾಚಕ ಸರ್ವನಾಮವನ್ನು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
theological_decisions: []
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಪೂರ್ಣ ಮತ್ತು ಸಾಮಾನ್ಯ ಓದುಗರಿಗೆ ಸುಲಭವಾದ ಶೈಲಿ. ‘ಸಾಮ್ಯಕಥೆ’ ಎಂಬ ಪರಿಚಿತ ಬೈಬಲ್ ಪದವನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಪ್ರಶ್ನೆಯನ್ನು ಸಹಜ ಕನ್ನಡಕ್ಕಾಗಿ ‘ಎಂದು ಕೇಳಿದರು’ ಎಂದು ರೂಪಿಸಲಾಗಿದೆ. ಎಲ್ಲಾ ಪಾದಟಿಪ್ಪಣಿ ಗುರುತುಗಳು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಸೇರಿವೆ.
