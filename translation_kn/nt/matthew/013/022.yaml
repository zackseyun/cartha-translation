id: MAT.13.22
reference: Matthew 13:22
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: kn
  text: ಮುಳ್ಳುಗಳ ನಡುವೆ ಬಿತ್ತಲ್ಪಟ್ಟವನು ಎಂದರೆ, ವಾಕ್ಯವನ್ನು ಕೇಳುವವನಾಗಿದ್ದು, ಈ ಯುಗದ[a] ಚಿಂತೆ ಮತ್ತು ಐಶ್ವರ್ಯದ ಮೋಸ[b] ವಾಕ್ಯವನ್ನು ಉಸಿರುಗಟ್ಟಿಸುತ್ತವೆ; ಹೀಗೆ ಅವನು ಫಲವಿಲ್ಲದವನಾಗುತ್ತಾನೆ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ, ‘ಈ ಲೋಕದ ಚಿಂತೆ.’ ಗ್ರೀಕ್‌ನಲ್ಲಿ ಅಕ್ಷರಶಃ ‘ಈ ಯುಗದ ಚಿಂತೆ’ ಎಂದಿದೆ.
    reason: alternative_reading
  - marker: b
    text: ಅಥವಾ, ‘ಸಂಪತ್ತಿನ ಮೋಸ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: ಮುಳ್ಳುಗಳ ನಡುವೆ ಬಿತ್ತಲ್ಪಟ್ಟವನು
  rationale: ಲೇಖಸಹಿತ ಪುಲ್ಲಿಂಗ ಏಕವಚನ ಕೃದಂತವು ಸಾಮ್ಯದ ವಿವರಣೆಯಲ್ಲಿ ಬೀಜದಿಂದ ಅದನ್ನು ಪ್ರತಿನಿಧಿಸುವ ವ್ಯಕ್ತಿಯ ಕಡೆಗೆ ಸೂಚಿಸುತ್ತದೆ. ‘ಮುಳ್ಳುಗಳ ನಡುವೆ’ ಎಂಬುದು ಕೃಷಿ ರೂಪಕಕ್ಕೆ ಸಹಜವಾದ ಕನ್ನಡ ಪ್ರಯೋಗ.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ವಾಕ್ಯವನ್ನು ಕೇಳುವವನು
  rationale: ವರ್ತಮಾನ ಕೃದಂತವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾದ ಸಂಬಂಧಾರ್ಥಕ ರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ. λόγος ಇಲ್ಲಿ ಸಾರಲ್ಪಟ್ಟ ಸಂದೇಶವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಪರಂಪರಿತವೂ ಸಂದರ್ಭೋಚಿತವೂ ಆದ ‘ವಾಕ್ಯ’ ಉಳಿಸಲಾಗಿದೆ.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: ಈ ಯುಗದ ಚಿಂತೆ
  rationale: μέριμνα ಇಲ್ಲಿ ಕಳವಳಭರಿತ ಕಾಳಜಿ ಅಥವಾ ಚಿಂತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ; αἰών ಮೂಲತಃ ಲೋಕಕ್ಕಿಂತ ಕಾಲಘಟ್ಟ ಅಥವಾ ಯುಗವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ‘ಈ ಯುಗ’ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: ಐಶ್ವರ್ಯದ ಮೋಸ
  rationale: ἀπάτη ಮೋಸಗೊಳಿಸುವ ಸ್ವಭಾವವನ್ನು ಸೂಚಿಸುತ್ತದೆ; πλοῦτος ಗೆ ‘ಐಶ್ವರ್ಯ’ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿದ್ದು ಸಂಪತ್ತಿನ ಆಕರ್ಷಕವಾದರೂ ವಂಚಕ ಸ್ವಭಾವವನ್ನು ಉಳಿಸುತ್ತದೆ.
- source_word: συμπνίγει
  choice: ಉಸಿರುಗಟ್ಟಿಸುತ್ತವೆ
  rationale: ಕ್ರಿಯಾಪದವು ಸುತ್ತಲೂ ಬೆಳೆದು ಉಸಿರುಗಟ್ಟಿಸುವ ಅಥವಾ ಒತ್ತಿಹಾಕುವ ಚಿತ್ರವನ್ನು ಕೊಡುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಉಸಿರುಗಟ್ಟಿಸು’ ಮುಳ್ಳುಗಳು ಸಸ್ಯವನ್ನು ನಿಗ್ರಹಿಸುವ ಜೀವಂತ ರೂಪಕವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ; ಸಂಯುಕ್ತ ಕರ್ತೃಗೆ ತಕ್ಕಂತೆ ಬಹುವಚನ ಕ್ರಿಯಾಪದ ಬಳಸಲಾಗಿದೆ.
- source_word: ἄκαρπος γίνεται
  choice: ಅವನು ಫಲವಿಲ್ಲದವನಾಗುತ್ತಾನೆ
  rationale: ವಿವರಣೆಯು ‘ಕೇಳುವವನು’ ಎಂಬ ವ್ಯಕ್ತಿಯನ್ನು ಗುರುತಿಸುವುದರಿಂದ ಅಂತಿಮ ಪುಲ್ಲಿಂಗ ಏಕವಚನವನ್ನು ವೈಯಕ್ತಿಕವಾಗಿ ಅನುವಾದಿಸಲಾಗಿದೆ. ಇದು ವಾಕ್ಯವೇ ಸ್ವಭಾವತಃ ಫಲಹೀನವಾಗುತ್ತದೆ ಎಂಬ ತಪ್ಪು ಅರ್ಥವನ್ನು ತಪ್ಪಿಸುತ್ತದೆ.
theological_decisions:
- issue: αἰών ಪದದ ಅರ್ಥ
  choice: ಈ ಯುಗ
  alternative: ಈ ಲೋಕ
  rationale: αἰών ಸಾಮಾನ್ಯವಾಗಿ ಭೌತಿಕ ಲೋಕಕ್ಕಿಂತ ಯುಗ ಅಥವಾ ಕಾಲವ್ಯವಸ್ಥೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಈ ಯುಗ’ ಹೊಸ ಒಡಂಬಡಿಕೆಯಲ್ಲಿ ಕಂಡುಬರುವ ಕಾಲಿಕ ಮತ್ತು ನೈತಿಕ ಒತ್ತನ್ನು ಉಳಿಸುತ್ತದೆ; ಪರಿಚಿತ ಪರ್ಯಾಯವನ್ನು ಪಾದಟಿಪ್ಪಣಿಯಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- issue: ಸಾಮ್ಯದ ವಿವರಣೆಯಲ್ಲಿನ ವ್ಯಕ್ತಿವಾಚಕ ಅಥವಾ ವಸ್ತುವಾಚಕ ಉಲ್ಲೇಖ
  choice: ಅವನು ಫಲವಿಲ್ಲದವನಾಗುತ್ತಾನೆ
  alternative: ಅದು ಫಲವಿಲ್ಲದಾಗುತ್ತದೆ / ವಾಕ್ಯವು ಫಲವಿಲ್ಲದಾಗುತ್ತದೆ
  rationale: ವಾಕ್ಯವು ಬಿತ್ತಲ್ಪಡುವ ಬೀಜದ ಚಿತ್ರ ಇದ್ದರೂ, ವಿವರಣೆ ಅದನ್ನು ‘ವಾಕ್ಯವನ್ನು ಕೇಳುವವನು’ ಎಂದು ಗುರುತಿಸುತ್ತದೆ. ಆದ್ದರಿಂದ ಅಂತಿಮ ವಾಕ್ಯಭಾಗವನ್ನು ವ್ಯಕ್ತಿವಾಚಕವಾಗಿ ಇಡುವುದು ಗ್ರೀಕ್ ವ್ಯಾಕರಣವನ್ನೂ ವಿವರಣೆಯ ಚಲನವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಯೋಗ್ಯವಾದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ‘ವಾಕ್ಯ,’ ‘ಯುಗ,’ ‘ಐಶ್ವರ್ಯ’ ಎಂಬ ಪದಗಳು ಬೈಬಲ್ ಸಂದರ್ಭದ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸುತ್ತವೆ; ವಾಕ್ಯರಚನೆ ಮಾತ್ರ ಇಂದಿನ ಓದುಗರಿಗೆ ಸಹಜವಾಗಿರಿಸಲಾಗಿದೆ.
