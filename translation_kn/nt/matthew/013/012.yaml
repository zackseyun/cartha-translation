id: MAT.13.12
reference: Matthew 13:12
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: kn
  text: ಏಕೆಂದರೆ, ಯಾರಿಗಿದೆಯೋ ಅವನಿಗೆ ಕೊಡಲಾಗುವುದು ಮತ್ತು ಅವನಿಗೆ ಸಮೃದ್ಧಿ ಉಂಟಾಗುವುದು; ಆದರೆ ಯಾರಿಗಿಲ್ಲವೋ, ಅವನಿಗಿರುವುದನ್ನೂ ಅವನಿಂದ ತೆಗೆದುಹಾಕಲಾಗುವುದು.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: ಯಾರಿಗೆ ... ಅವನಿಗೆ
  rationale: ಅನಿರ್ದಿಷ್ಟ ಸಂಬಂಧವಾಚಕ ಪದವು ಸಾಮಾನ್ಯ ನಿಯಮವನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ‘ಯಾರಿಗೆ ... ಅವನಿಗೆ’ ಎಂಬ ಜೋಡಿ ಸಹಜವಾಗಿದ್ದು, ಏಕವಚನದ ಪ್ರತಿನಿಧಿಕ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: γὰρ
  choice: ಯಾಕೆಂದರೆ
  rationale: ಹಿಂದಿನ ಮಾತಿಗೆ ಕಾರಣ ಅಥವಾ ವಿವರಣೆಯನ್ನು ಜೋಡಿಸುವ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔχει / οὐκ ἔχει
  choice: ಇದೆಯೋ / ಇಲ್ಲವೋ
  rationale: ಗ್ರೀಕ್‌ನಲ್ಲಿರುವಂತೆ ಯಾವುದಿದೆ ಎಂಬ ಕರ್ಮವನ್ನು ಹೇಳದೆ ಬಿಡಲಾಗಿದೆ; ಇದರಿಂದ ವಾಕ್ಯದ ವ್ಯಾಪಕತೆ ಮತ್ತು ಸಂದರ್ಭದ ಅರ್ಥಸಾಧ್ಯತೆಗಳು ಉಳಿಯುತ್ತವೆ.
- source_word: δοθήσεται αὐτῷ
  choice: ಅವನಿಗೆ ಕೊಡಲಾಗುವುದು
  rationale: ಭವಿಷ್ಯತ್ಕಾಲದ ಕರ್ಮಣಿ ರೂಪವನ್ನು ನೇರವಾಗಿ ಉಳಿಸಲಾಗಿದೆ. ಮೂಲದಲ್ಲಿ ಇಲ್ಲದ ‘ಇನ್ನಷ್ಟು’ ಎಂಬ ಪದವನ್ನು ಮುಖ್ಯ ಪಠ್ಯಕ್ಕೆ ಸೇರಿಸಿಲ್ಲ.
- source_word: περισσευθήσεται
  choice: ಅವನಿಗೆ ಸಮೃದ್ಧಿಯಾಗುವುದು
  rationale: ಹೆಚ್ಚಾಗಿ ಅಥವಾ ಸಮೃದ್ಧಿಯಾಗಿ ಇರುವ ಫಲಿತಾಂಶವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ಅರ್ಥವನ್ನು ನಿರ್ದಿಷ್ಟ ವಸ್ತುವಿಗೆ ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: δὲ
  choice: ಆದರೆ
  rationale: ಎರಡು ವಿರುದ್ಧ ಸ್ಥಿತಿಗಳ ನಡುವಿನ ಸ್ಪಷ್ಟ ವಿರೋಧವನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: καὶ ὃ ἔχει
  choice: ಅವನಿಗಿರುವುದನ್ನೂ
  rationale: ಇಲ್ಲದವನಿಗಿರುವುದೂ ಕಳೆದುಹೋಗುತ್ತದೆ ಎಂಬ ವಿರೋಧಾಭಾಸದ ಒತ್ತನ್ನು ‘-ನ್ನೂ’ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ಅವನಿಂದ ... ತೆಗೆದುಹಾಕಲಾಗುವುದು
  rationale: αἴρω ಪದದ ತೆಗೆದುಬಿಡುವ ಅಥವಾ ದೂರಮಾಡುವ ಅರ್ಥವನ್ನೂ ἀπό ಸೂಚಿಸುವ ಮೂಲದಿಂದ ಬೇರ್ಪಡಿಸುವ ಭಾವವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: αὐτῷ / αὐτοῦ
  choice: ಅವನಿಗೆ / ಅವನಿಂದ
  rationale: ಗ್ರೀಕ್‌ನ ಪುಲ್ಲಿಂಗ ಏಕವಚನದ ಪ್ರತಿನಿಧಿಕ ನಿರ್ಮಾಣವನ್ನು ಕನ್ನಡದಲ್ಲಿಯೂ ಉಳಿಸಲಾಗಿದೆ.
theological_decisions:
- issue: ‘ಇದೆ’ ಎಂಬುದರ ಅಪ್ರಕಟಿತ ಕರ್ಮ
  choice: ಯಾವುದು ಇದೆ ಎಂಬುದನ್ನು ಮುಖ್ಯ ಪಠ್ಯದಲ್ಲಿ ಹೇಳದೆ ಬಿಡಲಾಗಿದೆ.
  alternative: ಅರಿವು, ಸ್ವೀಕಾರಶೀಲತೆ ಅಥವಾ ದೇವರ ರಾಜ್ಯದ ರಹಸ್ಯಗಳ ಜ್ಞಾನ ಎಂದು ನಿರ್ದಿಷ್ಟಪಡಿಸುವುದು.
  rationale: ತಕ್ಷಣದ ಸಂದರ್ಭದಲ್ಲಿ ಯೇಸುವಿನ ಬೋಧನೆ ಮತ್ತು ರಾಜ್ಯದ ರಹಸ್ಯಗಳ ಗ್ರಹಿಕೆ ಸಂಬಂಧಿಸಿದರೂ, ಗ್ರೀಕ್ ವಾಕ್ಯವು ಕರ್ಮವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅದರ ಉದ್ದೇಶಿತ ತೆರೆದತನವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- issue: δοθήσεταιಯ ಅಪ್ರಕಟಿತ ಕರ್ತೃ/ವಿಷಯ
  choice: ‘ಕೊಡಲಾಗುವುದು’ ಎಂದು ಮಾತ್ರ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ‘ಇನ್ನಷ್ಟು ಕೊಡಲಾಗುವುದು’ ಎಂದು ಸಂದರ್ಭದಿಂದ ಪೂರೈಸುವುದು.
  rationale: ‘ಇನ್ನಷ್ಟು’ ಎಂಬುದು ಅರ್ಥದಲ್ಲಿ ಸೂಚಿತವಾಗಬಹುದಾದರೂ ಮೂಲ ಪಠ್ಯದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಗಿ ಇಲ್ಲ. ಮುಂದಿನ περισσευθήσεται ಸಮೃದ್ಧಿಯನ್ನು ತಿಳಿಸುವುದರಿಂದ ಹೆಚ್ಚುವರಿ ಪದವನ್ನು ಸೇರಿಸುವ ಅಗತ್ಯವಿಲ್ಲ.
- issue: ಪ್ರತಿನಿಧಿಕ ಪುಲ್ಲಿಂಗ ಏಕವಚನ
  choice: ‘ಅವನಿಗೆ/ಅವನಿಂದ’ ಎಂದು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ಲಿಂಗತಟಸ್ಥ ಬಹುವಚನ ಅಥವಾ ‘ಆ ವ್ಯಕ್ತಿಗೆ’ ಎಂಬ ಮರುರಚನೆ.
  rationale: ಮೂಲದ ವ್ಯಾಕರಣಿಕ ರೂಪವನ್ನು ಉಳಿಸಿಕೊಂಡು, ಅದು ಸಾಮಾನ್ಯವಾಗಿ ಯಾರನ್ನಾದರೂ ಸೂಚಿಸುವ ಪ್ರತಿನಿಧಿಕ ಬಳಕೆ ಎಂಬುದನ್ನು ಕನ್ನಡದ ಸಂಬಂಧವಾಚಕ ನಿರ್ಮಾಣವೇ ತಿಳಿಸುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ವಾಚನಯೋಗ್ಯ ಶೈಲಿ. ಮೂಲದ ಸಮಾನಾಂತರ ರಚನೆ, ಕರ್ಮಣಿ ಕ್ರಿಯೆಗಳು ಮತ್ತು ಉದ್ದೇಶಪೂರ್ವಕ ಅಸ್ಪಷ್ಟತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ; ಅನಗತ್ಯ ವಿವರಣಾತ್ಮಕ ಪದಗಳನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
