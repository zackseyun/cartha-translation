revisions:
- from: ಯಾಕೆಂದರೆ, ಯಾರಿಗೆ ಇದೆಯೋ ಅವನಿಗೆ ಕೊಡಲಾಗುವುದು ಮತ್ತು ಅವನಿಗೆ ಸಮೃದ್ಧಿಯಾಗುವುದು; ಆದರೆ ಯಾರಿಗೆ ಇಲ್ಲವೋ ಅವನಿಂದ ಅವನಿಗಿರುವುದನ್ನೂ ತೆಗೆದುಹಾಕಲಾಗುವುದು.
  to: ಏಕೆಂದರೆ, ಯಾರಿಗಿದೆಯೋ ಅವನಿಗೆ ಕೊಡಲಾಗುವುದು ಮತ್ತು ಅವನಿಗೆ ಸಮೃದ್ಧಿ ಉಂಟಾಗುವುದು; ಆದರೆ ಯಾರಿಗಿಲ್ಲವೋ, ಅವನಿಗಿರುವುದನ್ನೂ ಅವನಿಂದ ತೆಗೆದುಹಾಕಲಾಗುವುದು.
  rationale: The revision only replaces the unnatural Kannada rendering of περισσευθήσεται with an idiomatic expression for resulting abundance. It preserves the source’s implicit object, future orientation, passive sense in “ಕೊಡಲಾಗುವುದು” and “ತೆಗೆದುಹಾಕಲಾಗುವುದು,” contrastive structure, and the emphatic sense of “ಅವನಿಗಿರುವುದನ್ನೂ.”
