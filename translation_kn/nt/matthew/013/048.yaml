id: MAT.13.48
reference: Matthew 13:48
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: kn
  text: ಅದು ತುಂಬಿದಾಗ, ಅವರು ಅದನ್ನು ದಡದ ಮೇಲೆ ಎಳೆದು ತಂದು, ಕುಳಿತುಕೊಂಡು, ಒಳ್ಳೆಯ ಮೀನುಗಳನ್ನು ಪಾತ್ರೆಗಳಲ್ಲಿ[a] ಕೂಡಿಸಿದರು; ಆದರೆ ಕೊಳೆತ ಮೀನುಗಳನ್ನು[b] ಹೊರಗೆ ಎಸೆದರು.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ಅಥವಾ “ಸಂಗ್ರಹಪಾತ್ರೆಗಳಲ್ಲಿ.” ಗ್ರೀಕ್ ಪದವು ಸಾಮಾನ್ಯವಾಗಿ ಪಾತ್ರೆಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಅವು ಬುಟ್ಟಿಗಳೇ ಆಗಿರಬೇಕೆಂದಿಲ್ಲ.
    reason: lexical_alternative
  - marker: b
    text: ಅಥವಾ “ಕೆಟ್ಟ ಮೀನುಗಳನ್ನು.” ಗ್ರೀಕ್ ಪದಕ್ಕೆ “ಕೊಳೆತ,” “ಹಾಳಾದ,” ಅಥವಾ ಹೆಚ್ಚು ಸಾಮಾನ್ಯವಾಗಿ “ನಿಷ್ಪ್ರಯೋಜಕ” ಎಂಬ ಅರ್ಥಗಳಿರಬಹುದು.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: ಅದು ತುಂಬಿದಾಗ
  rationale: ἣν ಹಿಂದಿನ ವಚನದಲ್ಲಿರುವ ಬಲೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಸಂಬಂಧವಾಚಕ ರಚನೆಯನ್ನು ಯಾಂತ್ರಿಕವಾಗಿ ಉಳಿಸುವುದಕ್ಕಿಂತ ‘ಅದು ತುಂಬಿದಾಗ’ ಎಂಬುದು ಸಹಜವಾಗಿದ್ದು, ἐπληρώθη ಎಂಬ ಕರ್ಮಣಿ ರೂಪದ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: ಅದನ್ನು ದಡಕ್ಕೆ ಎಳೆದು ತಂದು
  rationale: ಬಲೆಯನ್ನು ನೀರಿನಿಂದ ಮೇಲಕ್ಕೆ ಎಳೆದು ದಡಕ್ಕೆ ತರುವ ಕ್ರಿಯೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಹಜ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; αἰγιαλός ಅನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಮರಳಿನ ಕಡಲತೀರವೆಂದು ಸೀಮಿತಗೊಳಿಸುವುದಿಲ್ಲ.
- source_word: καθίσαντες
  choice: ಕುಳಿತುಕೊಂಡು
  rationale: ಮುಂದಿನ ಕ್ರಮಬದ್ಧ ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಕೃದಂತವನ್ನು ಕನ್ನಡದ ಸಹಜ ನಿರೂಪಣಾ ಹರಿವಿನಲ್ಲಿ ಉಳಿಸುತ್ತದೆ.
- source_word: συνέλεξαν τὰ καλὰ
  choice: ಒಳ್ಳೆಯ ಮೀನುಗಳನ್ನು ... ಕೂಡಿಸಿಟ್ಟರು
  rationale: τὰ καλὰ ಅಕ್ಷರಶಃ ‘ಒಳ್ಳೆಯವು’ ಎಂದಾದರೂ, ಮೀನುಗಳೇ ಉದ್ದೇಶಿತವೆಂಬುದು ಸಂದರ್ಭದಿಂದ ಸ್ಪಷ್ಟ. ‘ಮೀನುಗಳನ್ನು’ ಸೇರಿಸುವುದು ಹೊಸ ಅರ್ಥವನ್ನು ಆಮದು ಮಾಡದೆ ಕನ್ನಡದಲ್ಲಿ ಉಲ್ಲೇಖವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.
- source_word: εἰς ἄγγη
  choice: ಪಾತ್ರೆಗಳಲ್ಲಿ
  rationale: ἄγγη ಸಾಮಾನ್ಯವಾಗಿ ಪಾತ್ರೆ ಅಥವಾ ಸಾಮಾನು ಇಡುವ ಸಾಧನಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ. ‘ಬುಟ್ಟಿಗಳು’ ಎಂದು ನಿರ್ದಿಷ್ಟಗೊಳಿಸದೆ ವಿಶಾಲ ಅರ್ಥವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
- source_word: τὰ δὲ σαπρά
  choice: ಆದರೆ ಕೊಳೆತ ಮೀನುಗಳನ್ನು
  rationale: σαπρά ಎಂಬುದು ಕೊಳೆತ, ಹಾಳಾದ ಅಥವಾ ನಿಷ್ಪ್ರಯೋಜಕವಾದವುಗಳನ್ನು ಸೂಚಿಸಬಹುದು. ‘ಕೊಳೆತ’ ಎಂಬುದು ಮೀನುಗಾರಿಕೆಯ ದೃಶ್ಯದ ಸ್ಪಷ್ಟತೆಯನ್ನೂ ಮೂಲದ ಬಲವಾದ ಮೌಲ್ಯನಿರ್ಣಯವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: ἔξω ἔβαλον
  choice: ಹೊರಗೆ ಎಸೆದರು
  rationale: ಹೊರಕ್ಕೆ ಹಾಕಿ ತಿರಸ್ಕರಿಸುವ ಕ್ರಿಯೆಯ ಬಲವನ್ನು ನೇರವಾದ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
theological_decisions:
- issue: ದೃಷ್ಟಾಂತದಲ್ಲಿನ ವಿಂಗಡಿಸುವಿಕೆಯ ಅರ್ಥವಿವರಣೆ
  choice: ವಚನವನ್ನು ಮೀನುಗಾರಿಕೆಯ ನೈಜ ದೃಶ್ಯವಾಗಿಯೇ ಅನುವಾದಿಸಲಾಗಿದೆ.
  alternative: ಮುಂದಿನ ವಚನಗಳ ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪಿನ ವಿವರಣೆಯನ್ನು ಮುಂಚಿತವಾಗಿಯೇ ಈ ವಚನದ ಪದಗಳಲ್ಲಿ ಸೇರಿಸುವುದು.
  rationale: ಈ ವಚನವು ದೃಷ್ಟಾಂತದ ಚಿತ್ರಣವನ್ನು ಮಾತ್ರ ಹೇಳುತ್ತದೆ; ಅದರ ವಿವರಣೆ ಮುಂದಿನ ವಚನಗಳಲ್ಲಿ ಬರುತ್ತದೆ. ಆದ್ದರಿಂದ ಇಲ್ಲಿ ನ್ಯಾಯತೀರ್ಪಿಗೆ ಸಂಬಂಧಿಸಿದ ವ್ಯಾಖ್ಯಾನಾತ್ಮಕ ಪದಗಳನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಘನ ಮತ್ತು ಓದಲು ಸುಲಭವಾದ ನಿರೂಪಣೆ. ಮೂಲ ಗ್ರೀಕ್‌ನ ಕ್ರಮಬದ್ಧ ಕ್ರಿಯೆಗಳು ಕನ್ನಡದ ಕೃದಂತ ಸರಣಿಯಲ್ಲಿ ಸಹಜವಾಗಿ ಮೂಡಿವೆ. ‘ಪಾತ್ರೆಗಳು’ ಎಂಬ ಸಾಮಾನ್ಯ ಪದ ಮತ್ತು ‘ಕೊಳೆತ’ ಎಂಬ ಸ್ಪಷ್ಟ ಚಿತ್ರಾತ್ಮಕ ಪದವನ್ನು ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ.
