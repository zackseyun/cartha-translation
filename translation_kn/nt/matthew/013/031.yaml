id: MAT.13.31
reference: Matthew 13:31
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: kn
  text: 'ಆತನು ಅವರಿಗೆ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಮುಂದಿಟ್ಟು ಹೀಗೆ ಹೇಳಿದನು: “ಪರಲೋಕದ ರಾಜ್ಯವು ಸಾಸಿವೆ ಕಾಳಿನಂತಿದೆ; ಅದನ್ನು ಒಬ್ಬ ಮನುಷ್ಯನು ತೆಗೆದುಕೊಂಡು ತನ್ನ ಹೊಲದಲ್ಲಿ ಬಿತ್ತಿದನು.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν αὐτοῖς
  choice: ಅವರು ಕೇಳುವಂತೆ ... ಹೇಳಿದನು
  rationale: ಇಲ್ಲಿ παρατίθημι ಎಂದರೆ ಕೇಳುಗರ ಮುಂದೆ ಒಂದು ಸಾಮ್ಯವನ್ನು ಇಡುವುದು ಅಥವಾ ಪ್ರಸ್ತುತಪಡಿಸುವುದು. ಕನ್ನಡದಲ್ಲಿ ‘ಅವರು ಕೇಳುವಂತೆ ... ಹೇಳಿದನು’ ಎಂಬುದು ಆ ಅರ್ಥವನ್ನು ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ; ಕೇವಲ ‘ಹೇಳಿದನು’ ಎನ್ನುವುದಕ್ಕಿಂತ αὐτοῖς ಅಂಶವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: παραβολὴν
  choice: ಸಾಮ್ಯವನ್ನು
  rationale: ಸುವಾರ್ತೆಗಳ ಬೋಧನಾ ಸಂದರ್ಭದಲ್ಲಿ παραβολήಗೆ ‘ಸಾಮ್ಯ’ ಎಂಬುದು ಸ್ಥಾಪಿತವೂ ಗ್ರಾಹ್ಯವೂ ಆದ ಕನ್ನಡ ಪದ; ಹೋಲಿಕೆಯ ಮೂಲಕ ಬೋಧಿಸುವ ಕಥನರೂಪವನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: Ὁμοία ἐστὶν
  choice: '...ನಂತಿದೆ'
  rationale: ಹೋಲಿಕೆಯನ್ನು ಪರಿಚಯಿಸುವ ಗ್ರೀಕ್ ಸೂತ್ರಕ್ಕೆ ಇದು ಸಹಜ ಮತ್ತು ನೇರ ಕನ್ನಡ ಸಮಾನಾರ್ಥಕ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ಪರಲೋಕರಾಜ್ಯವು
  rationale: ಮತ್ತಾಯನ ವೈಶಿಷ್ಟ್ಯಪೂರ್ಣ ಪದಗುಚ್ಛವನ್ನು ಸ್ಥಾಪಿತ ಕನ್ನಡ ಬೈಬಲ್ ಪದಪ್ರಯೋಗದಲ್ಲಿ ಉಳಿಸುತ್ತದೆ; ‘ರಾಜ್ಯ’ ಎಂಬುದು ಆಳ್ವಿಕೆ ಮತ್ತು ಅದರ ವ್ಯಾಪ್ತಿ ಎರಡನ್ನೂ ಸೂಚಿಸಬಲ್ಲದು.
- source_word: κόκκῳ σινάπεως
  choice: ಸಾಸಿವೆಕಾಳಿನಂತಿದೆ
  rationale: κόκκος ಬೀಜ ಅಥವಾ ಕಾಳು ಎಂಬ ಅರ್ಥ ಹೊಂದಿದೆ. ಸಾಸಿವೆಯ ಅತಿ ಸಣ್ಣ ಕಾಳಿನ ಚಿತ್ರಣವನ್ನು ಕನ್ನಡದಲ್ಲಿ ‘ಸಾಸಿವೆಕಾಳು’ ಸಹಜವಾಗಿ ಮತ್ತು ಸ್ಪಷ್ಟವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ಒಬ್ಬ ಮನುಷ್ಯನು ಅದನ್ನು ತೆಗೆದುಕೊಂಡು
  rationale: ἄνθρωπος ಎಂಬ ಏಕವಚನ ಕಥಾಪಾತ್ರವನ್ನು ‘ಒಬ್ಬ ಮನುಷ್ಯನು’ ಎಂದು ಉಳಿಸಿ, λαβών ಎಂಬ ಪೂರ್ವಕಾಲಿಕ ಕ್ರಿಯೆಯನ್ನು ಸಹಜ ಕನ್ನಡ ಸಂಯುಕ್ತ ಕ್ರಿಯಾರೂಪದಲ್ಲಿ ನೀಡಲಾಗಿದೆ.
- source_word: ἔσπειρεν
  choice: ಬಿತ್ತಿದನು
  rationale: σπείρω ಬೀಜವನ್ನು ಬಿತ್ತುವುದನ್ನು ನಿರ್ದಿಷ್ಟವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘ನೆಟ್ಟನು’ಗಿಂತ ‘ಬಿತ್ತಿದನು’ ಹೆಚ್ಚು ನಿಖರ.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: ತನ್ನ ಹೊಲದಲ್ಲಿ
  rationale: ἀγρόςಗೆ ಕೃಷಿ ಸಂದರ್ಭದ ಸಹಜ ಪದ ‘ಹೊಲ’; ಕರ್ತೃನನ್ನೇ ಸೂಚಿಸುವ αὐτοῦ ಅನ್ನು ಕನ್ನಡದಲ್ಲಿ ಪ್ರತಿಬಿಂಬಾತ್ಮಕ ‘ತನ್ನ’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ನೀಡಲಾಗಿದೆ.
theological_decisions:
- issue: ಮತ್ತಾಯನ βασιλεία τῶν οὐρανῶν ಪದಗುಚ್ಛದ ಅನುವಾದ
  choice: ಪರಲೋಕರಾಜ್ಯ
  alternative: ಪರಲೋಕದ ಆಳ್ವಿಕೆ
  rationale: ‘ಪರಲೋಕರಾಜ್ಯ’ ಮತ್ತಾಯನ ಪ್ರಮುಖ ಪದಪ್ರಯೋಗದ ಸಾಂಪ್ರದಾಯಿಕ ಗುರುತನ್ನು ಉಳಿಸುತ್ತದೆ ಮತ್ತು ಅದನ್ನು ಕೇವಲ ಅಮೂರ್ತ ಆಳ್ವಿಕೆಗೆ ಸೀಮಿತಗೊಳಿಸದೆ, ದೇವರ ಆಳ್ವಿಕೆ ಹಾಗೂ ಅದರ ವ್ಯಾಪ್ತಿ ಎರಡಕ್ಕೂ ಅವಕಾಶ ನೀಡುತ್ತದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸರಳ, ಗೌರವಯುತ ಮತ್ತು ಸಾರ್ವಜನಿಕ ವಾಚನಕ್ಕೆ ಸೂಕ್ತವಾದ ಶೈಲಿ. ಗ್ರೀಕ್ ವಾಕ್ಯದ ಎರಡು ಮುಖ್ಯ ಭಾಗಗಳನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ವಿಭಜಿಸಲಾಗಿದೆ; ಯಾವುದೇ ಪಾದಟಿಪ್ಪಣಿ ಅಗತ್ಯವಿಲ್ಲ.
