review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the mustard-seed comparison, the individual man, taking the seed, and sowing it in his own field. However, “ಅವರು ಕೇಳುವಂತೆ” does not naturally or precisely render παρέθηκεν αὐτοῖς (“set/presented to them”); it can suggest purpose (“so that they might hear”) rather than the indirect object.
  naturalness: The remainder is clear modern Kannada, but the opening is idiomatically strained. “ಆತನು ಅವರಿಗೆ ಮತ್ತೊಂದು ಸಾಮ್ಯವನ್ನು ಮುಂದಿಟ್ಟು ಹೀಗೆ ಹೇಳಿದನು” is natural public-reading Kannada and retains both presentation to the audience and the saying introduction.
  terminology: “ಸಾಮ್ಯ,” “ಪರಲೋಕದ ರಾಜ್ಯ,” “ಸಾಸಿವೆ ಕಾಳು,” “ಹೊಲ,” and “ಬಿತ್ತಿದನು” are suitable. Writing “ಪರಲೋಕದ ರಾಜ್ಯ” as separate words is more transparent in modern standard Kannada while retaining the established Matthean kingdom term.
  issues:
  - severity: medium
    issue: Opening phrase “ಅವರು ಕೇಳುವಂತೆ ... ಹೇಳಿದನು”
    rationale: This is not an idiomatic equivalent of παρέθηκεν αὐτοῖς. The Greek says that he presented/set another parable before them, then spoke; it does not express a purpose that they hear.
