  to: “ಉಸಿರುಗಳ ಉಸಿರು[a],” ಎಂದು ಕೋಹೆಲೆತ್[b] ಹೇಳುತ್ತಾನೆ; “ಉಸಿರುಗಳ ಉಸಿರು, ಎಲ್ಲವೂ ಬರೀ ಉಸಿರು.”
