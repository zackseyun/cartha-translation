id: ECC.1.2
reference: Ecclesiastes 1:2
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: kn
  text: “ಉಸಿರುಗಳ ಉಸಿರು[a],” ಎಂದು ಕೋಹೆಲೆತ್[b] ಹೇಳುತ್ತಾನೆ; “ಉಸಿರುಗಳ ಉಸಿರು, ಎಲ್ಲವೂ ಬರೀ ಉಸಿರು.”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ಹೀಬ್ರೂ ಹೇವೇಲ್ (הֶבֶל) ಎಂಬುದರ ಅಕ್ಷರಾರ್ಥ ‘ಉಸಿರು’ ಅಥವಾ ‘ಆವಿ.’ ಈ ಪುಸ್ತಕದಲ್ಲಿ ಅದು ಕ್ಷಣಿಕವಾದದ್ದು, ಹಿಡಿಯಲಾಗದದ್ದು ಮತ್ತು ನಿರೀಕ್ಷಿಸಿದುದಕ್ಕೂ ನಿಜವಾಗಿ ಸಂಭವಿಸುವುದಕ್ಕೂ ಇರುವ ವ್ಯಂಗ್ಯಮಯ ವೈರುಧ್ಯ—ಈ ಸಂಬಂಧಿತ ಅರ್ಥಗಳನ್ನು ಹೊತ್ತುಕೊಳ್ಳುತ್ತದೆ. ಒಂದೇ ಕನ್ನಡ ಪದವು ಇವೆಲ್ಲವನ್ನೂ ಸಂಪೂರ್ಣವಾಗಿ ಹಿಡಿಯುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾದ ‘ಉಸಿರು’ ಎಂಬ ಚಿತ್ರವನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಉಸಿರುಗಳ ಉಸಿರು’ ಎಂಬುದು ‘ಗೀತೆಗಳ ಗೀತೆ’ ಅಥವಾ ‘ಪವಿತ್ರಗಳ ಪವಿತ್ರ’ ಎಂಬಂತಿರುವ ಹೀಬ್ರೂ ಪರಮೋತ್ಕರ್ಷ ರೂಪ.
    reason: The example is adjusted to illustrate directly the repeated noun/genitive pattern described in the note.
lexical_decisions:
- source_word: הֶבֶל
  choice: ಉಸಿರು
  rationale: 'ಈ ಪದದ ಮೂಲ ಚಿತ್ರ ‘ಉಸಿರು/ಆವಿ’: ಕ್ಷಣಿಕತೆ, ಕೈಗೆ ಸಿಗದಿರುವಿಕೆ ಮತ್ತು ನಿರೀಕ್ಷೆ-ಫಲಗಳ ನಡುವಿನ ವ್ಯಂಗ್ಯಮಯ ವೈರುಧ್ಯ—ಈ ಮೂರನ್ನೂ ಒಂದೇ ಅಮೂರ್ತ ಪದಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸದೆ ಉಳಿಸುತ್ತದೆ. ‘ವ್ಯರ್ಥತೆ’ ಅಥವಾ ‘ಅರ್ಥಹೀನತೆ’ ಎಂಬ ಪದಗಳು ಅರ್ಥವ್ಯಾಪ್ತಿಯನ್ನು ಕಿರಿದಾಗಿಸುತ್ತವೆ.'
- source_word: הֲבֵל הֲבָלִים
  choice: ಉಸಿರುಗಳ ಉಸಿರು
  rationale: ಹೀಬ್ರೂ ಭಾಷೆಯ ‘Xಗಳ X’ ಎಂಬ ಪರಮೋತ್ಕರ್ಷ ರೂಪವನ್ನು ಹಾಗೂ ಮೂಲದ ದೃಶ್ಯರೂಪಕವನ್ನು ಉಳಿಸುತ್ತದೆ. ಕನ್ನಡದಲ್ಲಿ ಇದು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಕಾವ್ಯಾತ್ಮಕ ಮತ್ತು ಪ್ರಬಲವಾಗಿ ಕೇಳಿಸುತ್ತದೆ.
- source_word: אָמַר
  choice: ಹೇಳುತ್ತಾನೆ
  rationale: ರೂಪತಃ ಪೂರ್ಣಕಾಲವಾದರೂ ಇದು ಸಾಹಿತ್ಯಿಕ ಘೋಷಣೆಯ ಸೂತ್ರವಾಕ್ಯ; ಕನ್ನಡದ ವರ್ತಮಾನಕಾಲವು ಅದರ ಜೀವಂತ, ನಿರಂತರ ಘೋಷಣಾತ್ಮಕ ಸ್ವರವನ್ನು ಸಹಜವಾಗಿ ಕೊಡುತ್ತದೆ.
- source_word: קֹהֶלֶת
  choice: ಕೋಹೆಲೆತ್
  rationale: ‘ಬೋಧಕ’ ಅಥವಾ ‘ಪ್ರಸಂಗಿ’ ಎಂದು ಅರ್ಥವನ್ನು ಮುಂಚಿತವಾಗಿ ಕಿರಿದಾಗಿಸದೆ ಹೀಬ್ರೂ ಬಿರುದು/ಹೆಸರನ್ನು ಲಿಪ್ಯಂತರಿಸಲಾಗಿದೆ.
- source_word: הַכֹּל
  choice: ಎಲ್ಲವೂ
  rationale: ಮೂಲದ ಸಮಗ್ರ, ಎಲ್ಲವನ್ನೂ ಒಳಗೊಳ್ಳುವ ವ್ಯಾಪ್ತಿಯನ್ನು ಸಹಜ ಆಧುನಿಕ ಕನ್ನಡದಲ್ಲಿ ತಿಳಿಸುತ್ತದೆ.
- source_word: הָבֶל
  choice: ಬರೀ ಉಸಿರು
  rationale: ವಿಧೇಯ ಸ್ಥಾನದಲ್ಲಿ ಕೇವಲ ‘ಉಸಿರು’ ಎಂದರೆ ವಸ್ತುವಿನ ಸ್ವರೂಪದ ಕುರಿತು ನೇರ ಹೇಳಿಕೆಯಂತೆ ತೋರುವ ಸಾಧ್ಯತೆ ಇದೆ. ‘ಬರೀ’ ಎಂಬುದು ಮೂಲದ ಸಂದರ್ಭದಲ್ಲಿರುವ ಕುಗ್ಗಿಸುವ ಮೌಲ್ಯನಿರ್ಣಯದ ಸ್ವರವನ್ನು ಕನ್ನಡದಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ; ಆದರೂ ‘ಉಸಿರು’ ಎಂಬ ಮೂಲ ಚಿತ್ರವನ್ನು ಉಳಿಸುತ್ತದೆ.
theological_decisions:
- issue: ಪ್ರಸಂಗಿಯ ಕೇಂದ್ರರೂಪಕವಾದ הֶבֶל ಅನ್ನು ಹೇಗೆ ಅನುವಾದಿಸಬೇಕು
  choice: ಪರಮೋತ್ಕರ್ಷ ರೂಪದಲ್ಲಿ ‘ಉಸಿರುಗಳ ಉಸಿರು’ ಮತ್ತು ವಿಧೇಯದಲ್ಲಿ ‘ಬರೀ ಉಸಿರು’ ಎಂದು ಮೂಲದ ಸ್ಪಷ್ಟ ಚಿತ್ರವನ್ನು ಉಳಿಸಲಾಗಿದೆ.
  alternative: ವ್ಯರ್ಥತೆ; ಅರ್ಥಹೀನತೆ; ನಿಷ್ಫಲತೆ; ಕ್ಷಣಿಕತೆ; ಆವಿ
  rationale: ಹೀಬ್ರೂ ಪದವು ಕ್ಷಣಿಕ, ಹಿಡಿಯಲಾಗದ ಮತ್ತು ನಿರೀಕ್ಷೆಗೆ ವ್ಯತಿರಿಕ್ತವಾದ ಅನುಭವಗಳನ್ನು ಒಟ್ಟಾಗಿ ಸೂಚಿಸಬಲ್ಲದು. ‘ಅರ್ಥಹೀನತೆ’ ಸಂಪೂರ್ಣ ನಿರರ್ಥಕತೆಯ ತೀರ್ಮಾನವನ್ನು ಅನಗತ್ಯವಾಗಿ ಹೇರುತ್ತದೆ; ‘ವ್ಯರ್ಥತೆ’ ಗುರಿ ಸಾಧಿಸದಿರುವಿಕೆಗೆ ಅರ್ಥವನ್ನು ಸೀಮಿತಗೊಳಿಸಬಹುದು. ‘ಉಸಿರು’ ಮೂಲದ ಬಹುಅರ್ಥಸಾಧ್ಯತೆಯನ್ನೂ ಧಾರ್ಮಿಕ ಒತ್ತಡವನ್ನೂ ತೆರೆದೆಯೇ ಇಡುತ್ತದೆ.
translation_notes:
  register: ಭಾಷೆ ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿದ್ದು, ವಾಕ್ಯದ ಘೋಷಣಾತ್ಮಕ ಮತ್ತು ಕಾವ್ಯಾತ್ಮಕ ಗಂಭೀರತೆಯನ್ನು ಉಳಿಸಲಾಗಿದೆ. ‘ಉಸಿರುಗಳ ಉಸಿರು’ ದೈನಂದಿನ ಗದ್ಯಪ್ರಯೋಗವಲ್ಲ; ಮೂಲ ಹೀಬ್ರೂ ಪರಮೋತ್ಕರ್ಷದ ರೂಪ ಮತ್ತು ಕೇಂದ್ರರೂಪಕವನ್ನು ಉಳಿಸಲು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿ ಬಳಸಿದ ಸಾಹಿತ್ಯಿಕ ವಿನ್ಯಾಸ. ಉದ್ಗಾರಚಿಹ್ನೆಗಳು ಪುನರಾವರ್ತಿತ ಘೋಷಣೆಯ ತೀವ್ರತೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.
