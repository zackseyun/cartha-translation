id: GEN.1.1
reference: Genesis 1:1
language:
  code: kn
  name: Kannada
  native_name: ಕನ್ನಡ
  variant: modern standard Kannada
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: kn
  text: ಆರಂಭದಲ್ಲಿ ದೇವರು ಆಕಾಶಗಳನ್ನೂ ಭೂಮಿಯನ್ನೂ ಸೃಷ್ಟಿಸಿದಾಗ[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'ಪರಂಪರೆಯಲ್ಲಿ ಇದನ್ನು ಪೂರ್ಣವಾಕ್ಯವಾಗಿ, “ಆರಂಭದಲ್ಲಿ ದೇವರು ಆಕಾಶಗಳನ್ನೂ ಭೂಮಿಯನ್ನೂ ಸೃಷ್ಟಿಸಿದನು” ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. ಆದರೆ ಹೀಬ್ರೂ ಭಾಷೆಯಲ್ಲಿ ನಿರ್ದಿಷ್ಟ ಉಪಪದವಿಲ್ಲದ בְּרֵאשִׁית ಪದದ ಬಳಿಕ בָּרָא ಎಂಬ ಸಮಾಪಕ ಕ್ರಿಯಾಪದ ಬಂದಿರುವುದರಿಂದ, ಇದು ಕಾಲಸೂಚಕ ಅವಲಂಬಿತ ಉಪವಾಕ್ಯವಾಗಿ ಹೆಚ್ಚು ಸಹಜವಾಗಿ ಓದಬಹುದು; ಆದಿಕಾಂಡ 2:4ರ ದ್ವಿತೀಯ ಭಾಗದಲ್ಲಿಯೂ ಇದೇ ರೀತಿಯ ರಚನೆ ಇದೆ. ಇದರ ಮುಖ್ಯವಾಕ್ಯವು 3ನೇ ವಚನದಲ್ಲಿ ಬರುತ್ತದೆ: “ದೇವರು, ‘ಬೆಳಕು ಉಂಟಾಗಲಿ’ ಎಂದನು.”'
    reason: ಪದಪ್ರಯೋಗವನ್ನು ಹೆಚ್ಚು ಸಹಜಗೊಳಿಸಲಾಗಿದೆ; ಪರ್ಯಾಯ ಪರಂಪರಾಗತ ಓದು ಮತ್ತು ಮೂಲಪಠ್ಯದ ವಿವಾದಿತ ವಾಕ್ಯರಚನೆ ಎರಡನ್ನೂ ಉಳಿಸಲಾಗಿದೆ.
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: ಆರಂಭದಲ್ಲಿ, … ಸೃಷ್ಟಿಸಿದಾಗ
  rationale: ನಿರ್ದಿಷ್ಟ ಉಪಪದವಿಲ್ಲದ בְּרֵאשִׁית ಪದದ ಬಳಿಕ ಸಮಾಪಕ ಕ್ರಿಯಾಪದ ಬರುವುದರಿಂದ, ಇದನ್ನು ಮುಂದಿನ ವಾಕ್ಯಕ್ಕೆ ಸೇರಿಕೊಳ್ಳುವ ಕಾಲಸೂಚಕ ಉಪವಾಕ್ಯವಾಗಿ ಗ್ರಹಿಸಲಾಗಿದೆ. ‘ಆರಂಭದಲ್ಲಿ’ ಎಂಬುದು רֵאשִׁית ಪದದ ಅರ್ಥವನ್ನೂ ಉಳಿಸುತ್ತದೆ.
- source_word: בָּרָא
  choice: ಸೃಷ್ಟಿಸಿದಾಗ
  rationale: ‘ಸೃಷ್ಟಿಸು’ ಎಂಬುದು ದೈವಿಕ ಸೃಷ್ಟಿಕ್ರಿಯೆಯನ್ನು ನೇರವಾಗಿ ಸೂಚಿಸುತ್ತದೆ; ‘-ಆಗ’ ಪ್ರತ್ಯಯವು ಹೀಬ್ರೂ ವಾಕ್ಯದ ಅವಲಂಬಿತ ಕಾಲಸೂಚಕ ಸ್ವರೂಪವನ್ನು ಕನ್ನಡದಲ್ಲಿ ಸಹಜವಾಗಿ ವ್ಯಕ್ತಪಡಿಸುತ್ತದೆ.
- source_word: אֱלֹהִים
  choice: ದೇವರು
  rationale: ರೂಪದಲ್ಲಿ ಬಹುವಚನವಾಗಿದ್ದರೂ ಇಲ್ಲಿ ಏಕವಚನ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಬಂದಿರುವುದರಿಂದ ಏಕವಚನ ‘ದೇವರು’ ಸೂಕ್ತವಾಗಿದೆ.
- source_word: אֵת
  choice: '[ಪ್ರತ್ಯೇಕವಾಗಿ ಅನುವಾದಿಸಿಲ್ಲ]'
  rationale: ಇದು ಹೀಬ್ರೂ ಭಾಷೆಯ ನಿರ್ದಿಷ್ಟ ಕರ್ಮಸೂಚಕ; ಕನ್ನಡದಲ್ಲಿ ‘-ಅನ್ನು’ ವಿಭಕ್ತಿಯ ಮೂಲಕ ಅದರ ಕಾರ್ಯ ವ್ಯಕ್ತವಾಗಿದೆ.
- source_word: הַשָּׁמַיִם
  choice: ಆಕಾಶಗಳು
  rationale: ಹೀಬ್ರೂ ಪದದ ಬಹುವಚನ ರೂಪವನ್ನು ಉಳಿಸಲು ‘ಆಕಾಶಗಳು’ ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. ‘ಆಕಾಶಗಳು ಮತ್ತು ಭೂಮಿ’ ಎಂಬ ಜೋಡಿ ಸಮಸ್ತ ಸೃಷ್ಟಿಯನ್ನು ಸೂಚಿಸುತ್ತದೆ.
- source_word: הָאָרֶץ
  choice: ಭೂಮಿ
  rationale: ಆಕಾಶಗಳೊಂದಿಗೆ ಬರುವ ವಿಶ್ವವ್ಯಾಪಕ ಜೋಡಿಯಲ್ಲಿ אָרֶץ ಎಂದರೆ ಸ್ಥಳೀಯ ‘ದೇಶ’ ಅಥವಾ ‘ನೆಲ’ ಅಲ್ಲ, ‘ಭೂಮಿ’.
theological_decisions:
- issue: ಆರಂಭಿಕ ವಾಕ್ಯಾಂಶದ ವಾಕ್ಯರಚನೆ
  choice: 'ಮುಂದಿನ ಮುಖ್ಯವಾಕ್ಯಕ್ಕೆ ಅವಲಂಬಿತವಾದ ಕಾಲಸೂಚಕ ಉಪವಾಕ್ಯ: ‘ಆರಂಭದಲ್ಲಿ, ದೇವರು … ಸೃಷ್ಟಿಸಿದಾಗ—’'
  alternative: 'ಸ್ವತಂತ್ರ ಪೂರ್ಣವಾಕ್ಯ: ‘ಆರಂಭದಲ್ಲಿ ದೇವರು ಆಕಾಶಗಳನ್ನೂ ಭೂಮಿಯನ್ನೂ ಸೃಷ್ಟಿಸಿದನು.’'
  rationale: ನಿರ್ದಿಷ್ಟ ಉಪಪದವಿಲ್ಲದ בְּרֵאשִׁית, ಅದರ ತಕ್ಷಣ ಬರುವ בָּרָא ಎಂಬ ಸಮಾಪಕ ಕ್ರಿಯಾಪದ, ಹಾಗೂ ಆದಿಕಾಂಡ 2:4ರ ದ್ವಿತೀಯ ಭಾಗ ಮತ್ತು ಹೋಶೇಯ 1:2ರ ಸಮಾನ ಕಾಲಸೂಚಕ ಆರಂಭಗಳು—ಇವು ಅವಲಂಬಿತ ಉಪವಾಕ್ಯದ ಓದಿಗೆ ಬೆಂಬಲ ನೀಡುತ್ತವೆ. ಆದರೂ ಪರಂಪರಾಗತ ಸ್ವತಂತ್ರ-ವಾಕ್ಯದ ಓದು ಪ್ರಾಚೀನವೂ ವ್ಯಾಪಕವೂ ಆಗಿರುವುದರಿಂದ ಅದನ್ನು ಅಡಿಕುರಿಪಿನಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.
translation_notes:
  register: ಆಧುನಿಕ ಪ್ರಮಾಣಿತ ಕನ್ನಡದಲ್ಲಿ ಸಹಜವೂ ಘನತೆಯುಳ್ಳದ್ದೂ ಆದ ಶೈಲಿ ಬಳಸಲಾಗಿದೆ. ದೀರ್ಘಗೆರೆ ವಾಕ್ಯವು ಮುಂದುವರಿಯುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ; ‘ಆಕಾಶಗಳು’ ಎಂಬ ಬಹುವಚನವು ಮೂಲ ಹೀಬ್ರೂ ರೂಪವನ್ನು ಉಳಿಸುತ್ತದೆ.
