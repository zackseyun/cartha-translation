id: PHP.1.27
reference: Philippians 1:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: vi
  text: 'Chỉ có điều này: anh chị em hãy sống sao cho xứng đáng với Tin Mừng của Đấng Christ,[a] để dù tôi đến thăm anh chị em hay vắng mặt, tôi vẫn được nghe tin về anh chị em rằng anh chị em đang đứng vững trong cùng một tinh thần,[b] đồng lòng[c] cùng nhau chiến đấu cho đức tin của Tin Mừng.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Động từ Hy Lạp được dịch là “hãy sống” có sắc thái về đời sống công dân; cũng có thể dịch: “hãy sống như những công dân sao cho xứng đáng với Tin Mừng của Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “trong cùng một Thánh Linh.”'
    reason: theological_ambiguity
  - marker: c
    text: 'Sát nghĩa: “với một tâm hồn”; cũng có thể dịch: “một lòng một dạ.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “cùng nhau chiến đấu cho việc tin vào Tin Mừng.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Μόνον
  choice: Chỉ có điều này
  rationale: Giữ sức nhấn mạnh của từ được đặt đầu câu và dẫn vào lời khuyên trọng tâm một cách tự nhiên trong tiếng Việt.
- source_word: ἀξίως
  choice: sao cho xứng đáng với
  rationale: Diễn đạt rõ đây là cách sống phải tương xứng với Tin Mừng, đồng thời giữ chức năng trạng từ của nguyên ngữ.
- source_word: πολιτεύεσθε
  choice: hãy sống
  rationale: Tự nhiên và dễ hiểu trong tiếng Việt hiện đại; sắc thái công dân của động từ Hy Lạp được bảo lưu trong chú thích.
- source_word: εὐαγγελίου
  choice: Tin Mừng
  rationale: Thuật ngữ quen thuộc, trang trọng và minh bạch trong tiếng Việt Cơ Đốc.
- source_word: Χριστοῦ
  choice: Đấng Christ
  rationale: Giữ tước hiệu của Χριστός mà không chuyển thành tên riêng thuần túy; cách gọi này thông dụng trong tiếng Việt Tin Lành.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: tôi vẫn được nghe tin về anh chị em
  rationale: Chuyển ngữ tự nhiên thành ngữ Hy Lạp và phù hợp với cả hai hoàn cảnh Phao-lô nêu ra.
- source_word: στήκετε
  choice: đang đứng vững
  rationale: Giữ hình ảnh đứng vững và ý kiên định của động từ.
- source_word: ἐν ἑνὶ πνεύματι
  choice: trong cùng một tinh thần
  rationale: Mạch văn về sự hiệp nhất và vế song song μιᾷ ψυχῇ nghiêng về tinh thần chung, nhưng khả năng chỉ Đức Thánh Linh được ghi trong chú thích.
- source_word: μιᾷ ψυχῇ
  choice: đồng lòng
  rationale: Diễn đạt tự nhiên ý một lòng, một ý chí chung; nghĩa sát hơn là 'với một tâm hồn' được nêu trong chú thích.
- source_word: συναθλοῦντες
  choice: cùng nhau chiến đấu
  rationale: Giữ ý cùng chung sức trong một cuộc tranh đấu, bao gồm sắc thái thi đấu của động từ ghép.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: cho đức tin của Tin Mừng
  rationale: Giữ quan hệ sở hữu/nguồn gốc còn hàm hồ trong cấu trúc Hy Lạp, không tự ý đồng nhất hoàn toàn với 'tin vào Tin Mừng'.
theological_decisions:
- issue: πνεύματι chỉ tinh thần chung của cộng đồng hay Đức Thánh Linh
  choice: trong cùng một tinh thần
  alternative: trong cùng một Thánh Linh
  rationale: Vế song song 'đồng lòng' hỗ trợ cách hiểu về tinh thần hiệp nhất, nhưng văn bản không loại trừ sự quy chiếu đến Đức Thánh Linh nên cần giữ phương án ấy trong chú thích.
- issue: Quan hệ của τῇ πίστει với τοῦ εὐαγγελίου
  choice: cho đức tin của Tin Mừng
  alternative: cho việc tin vào Tin Mừng
  rationale: 'Cách dịch chính giữ độ mở của sở hữu cách Hy Lạp: có thể là đức tin gắn với/nảy sinh từ/nội dung thuộc về Tin Mừng; phương án khác hiểu πίστει theo nghĩa hành vi tin.'
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm thể hiện cộng đồng gồm cả nam lẫn nữ. Viết hoa “Tin Mừng” và dùng “Đấng Christ” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; các điểm hàm hồ thực sự của πνεῦμα và πίστει τοῦ εὐαγγελίου được bảo lưu bằng chú thích.
