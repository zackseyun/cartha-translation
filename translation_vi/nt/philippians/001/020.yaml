  - severity: low
    issue: Một số kết hợp từ chưa thật tự nhiên trong tiếng Việt hiện đại.
    rationale: “Với mọi sự mạnh dạn” tự nhiên hơn “với tất cả sự dạn dĩ”; “trong thân thể tôi” phù hợp cách dùng hiện đại hơn “nơi thân thể tôi.”
