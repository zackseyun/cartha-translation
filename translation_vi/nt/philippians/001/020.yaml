  to: phù hợp với điều tôi tha thiết mong đợi và hy vọng, rằng tôi sẽ không bị hổ thẹn[a] trong bất cứ việc gì, nhưng với mọi sự mạnh dạn, như mọi khi, cả bây giờ nữa, Đấng Mê-si[b] sẽ được tôn cao trong thân thể tôi, dù qua sự sống hay qua sự chết.
