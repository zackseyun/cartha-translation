id: PHP.1.20
reference: Philippians 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: vi
  text: phù hợp với điều tôi tha thiết mong đợi và hy vọng, rằng tôi sẽ không bị hổ thẹn[a] trong bất cứ việc gì, nhưng với mọi sự mạnh dạn, như mọi khi, cả bây giờ nữa, Đấng Mê-si[b] sẽ được tôn cao trong thân thể tôi, dù qua sự sống hay qua sự chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “tôi sẽ không hổ thẹn.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “Đấng Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: đúng như
  rationale: Diễn tả sự phù hợp với điều Phao-lô tha thiết mong đợi và hy vọng; cách nói này tự nhiên trong tiếng Việt mà vẫn giữ quan hệ của nguyên văn.
- source_word: ἀποκαραδοκίαν
  choice: điều tôi tha thiết mong đợi
  rationale: Giữ sắc thái mong ngóng mãnh liệt và hướng về phía trước của danh từ Hy Lạp hiếm gặp này.
- source_word: ἐλπίδα
  choice: hy vọng
  rationale: Từ tương đương thông dụng, phù hợp với sắc thái tin tưởng trong văn mạch của Phao-lô.
- source_word: ἐν οὐδενὶ
  choice: về bất cứ điều gì
  rationale: Diễn đạt trọn vẹn ý phủ định tuyệt đối bằng tiếng Việt tự nhiên.
- source_word: αἰσχυνθήσομαι
  choice: tôi sẽ không bị hổ thẹn
  rationale: Giữ sắc thái thụ động hoặc công khai của động từ, trong khi chú thích bảo lưu khả năng hiểu là trạng thái chủ quan ‘không hổ thẹn’.
- source_word: παρρησίᾳ
  choice: sự dạn dĩ
  rationale: Thể hiện thái độ can đảm và công khai trong lời chứng, phù hợp hơn các cách dịch chỉ nhấn mạnh sự thẳng thắn.
- source_word: μεγαλυνθήσεται
  choice: sẽ được tôn cao
  rationale: Diễn đạt tự nhiên ý làm cho hoặc bày tỏ là lớn lao, đồng thời giữ sắc thái tôn vinh trong văn mạch.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός vẫn mang lực của một tước hiệu; ‘Đấng Mê-si’ truyền đạt nghĩa ấy thay vì chỉ phiên âm như tên riêng.
- source_word: ἐν τῷ σώματί μου
  choice: nơi thân thể tôi
  rationale: Giữ hình ảnh lời chứng được thể hiện nơi chính thân thể Phao-lô, dù ông sống hay chết.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: dù qua sự sống hay qua sự chết
  rationale: Giữ cấu trúc song song và không xác định quá mức διά là phương tiện hay hoàn cảnh.
theological_decisions:
- issue: Cách dịch Χριστός trong văn mạch thư tín của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Tước hiệu vẫn có ý nghĩa rõ trong mệnh đề nói về việc Chúa Giê-su được tôn cao; cách dịch này làm rõ nội dung của tước hiệu mà không thêm một lập trường hệ phái.
- issue: Sắc thái của αἰσχυνθήσομαι
  choice: tôi sẽ không bị hổ thẹn
  alternative: tôi sẽ không hổ thẹn
  rationale: Nguyên ngữ có thể nhấn mạnh việc bị làm cho hổ thẹn trước công chúng hoặc cảm nhận hổ thẹn của chủ thể. Bản chính giữ sắc thái thứ nhất và chú thích bảo lưu sắc thái thứ hai.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Câu giữ nhịp lập luận dài của nguyên văn, đồng thời dùng ‘tha thiết mong đợi’, ‘dạn dĩ’ và ‘được tôn cao’ để tránh lối diễn đạt quá cổ hoặc cứng. Các dấu chú thích được đặt ngay tại từ ngữ mà phương án thay thế liên quan.
