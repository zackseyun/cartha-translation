revisions:
- from: Một số người rao giảng Đấng Ki-tô vì lòng ganh tị và tranh cạnh, còn những người khác thì vì thiện ý.
  to: Một số người rao giảng Đấng Ki-tô vì lòng ganh tị và tranh chấp, còn những người khác rao giảng vì thiện ý.
  rationale: Đổi «tranh cạnh» thành «tranh chấp» để phản ánh tự nhiên hơn ἔρις trong văn cảnh đối địch, và lặp lại «rao giảng» ở vế sau để giữ rõ hành động chung của hai nhóm. Không cần chú thích vì không có biến thể hoặc mơ hồ văn bản đáng kể cần đánh dấu trong câu này.
  reviewer_model: gpt-5.6-terra
