source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: vi
  text: Một số người rao giảng Đấng Ki-tô vì lòng ganh tị và tranh chấp, còn những người khác rao giảng vì thiện ý.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Một số người … còn những người khác thì
  rationale: Diễn đạt tự nhiên sự đối lập giữa hai nhóm do cấu trúc μέν … δέ đánh dấu.
- source_word: διὰ φθόνον
  choice: vì lòng ganh tị
  rationale: διά với đối cách mang nghĩa nguyên nhân ở đây; cách dịch này nêu rõ động cơ.
- source_word: ἔριν
  choice: tranh cạnh
  rationale: Trong bối cảnh những động cơ không trong sáng, từ này chỉ sự ganh đua mang tính đối kháng giữa người với người; “tranh cạnh” giữ được sắc thái ấy.
- source_word: δι’ εὐδοκίαν
  choice: vì thiện ý
  rationale: Cụm từ đối lập với ganh tị và tranh cạnh, nên được hiểu về động cơ tốt lành; “thiện ý” ngắn gọn và tự nhiên.
- source_word: τὸν Χριστόν
  choice: Đấng Ki-tô
  rationale: Mạo từ đi kèm Χριστός làm nổi bật chức danh; “Đấng Ki-tô” giữ sắc thái tước hiệu và quen thuộc trong tiếng Việt hiện đại.
- source_word: κηρύσσουσιν
  choice: rao giảng
  rationale: Diễn đạt hành động công bố công khai, đồng thời tự nhiên trong văn cảnh nói về việc loan báo Đấng Ki-tô.
theological_decisions:
- issue: Χριστός là tước hiệu hay tên riêng
  choice: Đấng Ki-tô
  alternative: Chúa Cứu Thế; Ki-tô
  rationale: Bản dịch giữ từ phiên âm quen thuộc nhưng thêm “Đấng” để thể hiện chức năng tước hiệu, không áp đặt thêm một cách diễn giải hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không giữ máy móc cả hai từ καί vì tiếng Việt sẽ nặng nề; ý nhấn và thế đối lập vẫn được bảo toàn bằng cấu trúc “một số… còn những người khác thì…”.
