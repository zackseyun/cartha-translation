  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: luôn luôn
  rationale: Giữ nguyên ý chỉ tần suất liên tục và vị trí nhấn mạnh ở đầu mệnh đề.
- source_word: ἐν πάσῃ δεήσει μου
  choice: trong mỗi lời cầu nguyện của tôi
  rationale: δέησις là lời khẩn cầu/cầu nguyện; trong ngữ cảnh này, “lời cầu nguyện” tự nhiên và đủ rộng, còn πάσῃ được thể hiện bằng “mỗi”.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: cho tất cả anh chị em
  rationale: ὑπέρ chỉ đối tượng mà Phao-lô cầu nguyện; “anh chị em” diễn đạt số nhiều ngôi thứ hai trong cộng đồng tín hữu một cách bao quát và tự nhiên.
- source_word: μετὰ χαρᾶς
  choice: với niềm vui
  rationale: Diễn đạt trực tiếp trạng thái vui mừng đi cùng hành động cầu nguyện.
- source_word: τὴν δέησιν ποιούμενος
  choice: tôi cầu nguyện
  rationale: Thành ngữ Hy Lạp nghĩa đen là “thực hiện lời khẩn cầu”; chuyển thành động từ “cầu nguyện” để tiếng Việt tự nhiên mà không làm thay đổi ý nghĩa.
