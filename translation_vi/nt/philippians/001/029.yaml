    rationale: Trong ngữ cảnh này, “vì cớ/cho Đấng Mê-si-a” phản ánh tự nhiên hơn; “thay mặt” có thể được nêu như khả năng từ vựng nhưng không nên đặt ngang hàng mà không lưu ý rằng đây không phải nghĩa ưu tiên trong câu.
