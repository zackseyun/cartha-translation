id: PHP.1.29
reference: Philippians 1:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: vi
  text: 'Vì, vì cớ Đấng Mê-si-a[a], anh chị em đã được ban ân huệ này: không những tin nơi Ngài[b] mà còn chịu khổ vì Ngài[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Χριστός là tước hiệu, nghĩa là “Đấng được xức dầu.” Cụm này cũng có thể dịch “cho Đấng Mê-si-a” hoặc “vì lợi ích của Đấng Mê-si-a.”
    reason: lexical_alternative
  - marker: b
    text: Hay “đặt lòng tin nơi Ngài.”
    reason: lexical_alternative
  - marker: c
    text: Hay “chịu khổ vì cớ Ngài” hoặc “chịu khổ cho Ngài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong mạch văn, từ này nêu lý do cho thái độ không sợ hãi ở câu trước; “Vì” nối ý tự nhiên và giữ quan hệ giải thích/nguyên nhân.
- source_word: ἐχαρίσθη
  choice: đã được ban cho đặc ân
  rationale: Động từ χαρίζομαι diễn tả việc ban cách rộng lượng, bởi ân huệ, chứ không chỉ cho phép. Cách dịch này giữ sắc thái quà ban và dạng bị động hàm ý Đức Chúa Trời là Đấng ban.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: đặc ân vì Đấng Mê-si-a
  rationale: Cụm danh hóa này mở đầu và bao quát hai hành động theo sau. “Vì Đấng Mê-si-a” giữ ý rằng cả việc tin lẫn chịu khổ đều gắn với Ngài, đồng thời không ép ὑπέρ vào duy nhất một sắc thái như “thay mặt”.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός là tước hiệu chỉ Đấng được xức dầu; “Đấng Mê-si-a” làm rõ chức năng tước hiệu trong tiếng Việt hiện đại.
- source_word: πιστεύειν εἰς αὐτόν
  choice: tin nơi Ngài
  rationale: Đây là cách diễn đạt tự nhiên cho việc đặt lòng tin vào một người. “Tin nơi Ngài” giữ hướng quy chiếu của εἰς và có sắc thái trang trọng vừa phải.
- source_word: πάσχειν
  choice: chịu khổ
  rationale: Cách dịch trực tiếp, rõ ràng, không làm nhẹ nội dung của động từ.
- source_word: ὑπὲρ αὐτοῦ
  choice: vì Ngài
  rationale: Trong ngữ cảnh này, ὑπέρ diễn tả chịu khổ vì cớ hay vì lợi ích của Đấng Mê-si-a. “Vì Ngài” ngắn gọn và giữ được độ rộng ngữ nghĩa.
theological_decisions:
- issue: Cả việc tin và việc chịu khổ có nằm trong điều được ban hay không
  choice: Giữ rõ rằng một “đặc ân” bao gồm cả tin nơi Đấng Mê-si-a lẫn chịu khổ vì Ngài
  alternative: Làm yếu ἐχαρίσθη thành “được phép,” hoặc cấu trúc câu khiến chỉ việc chịu khổ được xem là điều được ban
  rationale: Cấu trúc Hy Lạp đặt cả hai động từ nguyên mẫu dưới phạm vi của ἐχαρίσθη. Bản dịch giữ nguyên căng thẳng thần học rằng cả đức tin và sự chịu khổ đều được trình bày như ân ban.
- issue: Phạm vi và sắc thái của τὸ ὑπὲρ Χριστοῦ
  choice: Dịch “đặc ân vì Đấng Mê-si-a” để cụm này bao quát cả hai vế theo sau
  alternative: Dịch theo nghĩa hẹp hơn là “thay mặt Đấng Mê-si-a,” hoặc gắn cụm này chỉ với một hành động
  rationale: Cú pháp cho phép hiểu cụm này như một đề mục danh hóa cho toàn bộ ân ban, còn ὑπέρ có thể mang sắc thái “vì cớ,” “vì lợi ích,” hay “thay mặt.” Bản chính giữ cách nói rộng và chú thích các khả năng gần nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῖν và “Ngài” để quy chiếu tôn kính đến Đấng Mê-si-a. Dấu gạch ngang giúp người đọc nhận ra hai nội dung song song cùng thuộc về một đặc ân, không bổ sung quan hệ thần học ngoài cú pháp nguồn.
