  text: I thank my God at every remembrance of you,[a]
translation:
  language: vi
  text: Tôi cảm tạ Đức Chúa Trời của tôi mỗi khi nhớ đến anh chị em,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tôi cảm tạ Đức Chúa Trời của tôi vì mỗi lần nhớ đến anh chị em.”'
    reason: ἐπὶ với tặng cách có thể nhấn mạnh dịp (“mỗi khi”) hoặc lý do/căn cớ (“vì”) của lời cảm tạ.
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Tôi cảm tạ
  rationale: Động từ hiện tại chủ động, ngôi thứ nhất số ít. “Tôi cảm tạ” tự nhiên, trang trọng vừa phải và diễn đạt trực tiếp hành động tạ ơn.
- source_word: τῷ θεῷ μου
  choice: Đức Chúa Trời của tôi
  rationale: Tặng cách đi với εὐχαριστέω chỉ đối tượng được cảm tạ; tiếng Việt diễn đạt tự nhiên không cần giới từ. Đại từ sở hữu μου được giữ lại bằng “của tôi”.
- source_word: ἐπὶ
  choice: mỗi khi
  rationale: ἐπὶ với tặng cách có thể nêu hoàn cảnh hoặc dịp của sự cảm tạ. Kết hợp với πάσῃ τῇ μνείᾳ, “mỗi khi” là cách diễn đạt tiếng Việt tự nhiên mà không khẳng định quan hệ nguyên nhân.
- source_word: πάσῃ
  choice: mỗi
  rationale: Đi với danh từ số ít μνείᾳ, từ này có sắc thái phân phối; “mỗi” phù hợp với cách nói tiếng Việt.
- source_word: μνείᾳ
  choice: nhớ đến
  rationale: Dịch danh từ Hy Lạp bằng cụm động từ giúp câu tiếng Việt tự nhiên, đồng thời vẫn giữ nghĩa hồi tưởng hay nhớ tới.
- source_word: ὑμῶν
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều được diễn đạt rõ bằng “anh chị em”, cách xưng hô cộng đồng tự nhiên và trang trọng trong thư tín Cơ Đốc.
theological_decisions: []
