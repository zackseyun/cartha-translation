  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: vi
  text: đến nỗi việc tôi bị xiềng xích vì Đấng Ki-tô[a] đã được biết đến khắp toàn đội cận vệ hoàng gia[b] và với mọi người khác,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xiềng xích của tôi trong Đấng Ki-tô.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “khắp toàn dinh tổng trấn”; từ Hy Lạp này có thể chỉ đội cận vệ hoàng gia hoặc dinh, tổng hành dinh của nhà cầm quyền.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: đến nỗi
  rationale: Diễn tả kết quả của điều được nói trước đó và phù hợp tự nhiên với cấu trúc câu tiếng Việt.
- source_word: τοὺς δεσμούς μου
  choice: việc tôi bị xiềng xích
  rationale: Giữ hình ảnh cụ thể 'xiềng xích' của nguyên văn, đồng thời dùng cấu trúc danh hóa tự nhiên để làm chủ thể của mệnh đề.
- source_word: φανεροὺς ... γενέσθαι
  choice: đã trở nên rõ ràng
  rationale: Bảo toàn sắc thái kết quả của γενέσθαι và ý công khai, hiển nhiên của φανερούς.
- source_word: ἐν Χριστῷ
  choice: vì Đấng Ki-tô
  rationale: Trong ngữ cảnh, cụm này có thể chỉ rằng xiềng xích của Phao-lô có liên hệ công khai với lòng trung thành của ông đối với Đấng Ki-tô; cách dịch chính nêu rõ cách hiểu theo nguyên nhân, còn nghĩa sát chữ được giữ trong chú thích.
- source_word: Χριστῷ
  choice: Đấng Ki-tô
  rationale: Giữ tính chất danh hiệu của Χριστός trong cách dùng tiếng Việt hiện đại và trang trọng.
- source_word: πραιτωρίῳ
  choice: đội cận vệ hoàng gia
  rationale: Đây là đối tượng có khả năng được nhắc đến trong bối cảnh thư Phi-líp; sự bất định giữa lực lượng cận vệ và dinh/tổng hành dinh được ghi ở chú thích.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: cho tất cả những người còn lại
  rationale: Theo sát ý mở rộng phạm vi sang mọi người khác ngoài nhóm vừa nêu.
theological_decisions:
- issue: Quan hệ của ἐν Χριστῷ với xiềng xích của Phao-lô
  choice: vì Đấng Ki-tô
  alternative: xiềng xích của tôi trong Đấng Ki-tô
  rationale: Ngữ cảnh nhấn mạnh lý do việc Phao-lô bị giam đã được nhiều người nhận biết, nhưng giới từ ἐν vẫn có thể diễn tả phạm vi hiệp nhất hoặc mối liên hệ với Đấng Ki-tô. Bản chính chọn cách hiểu theo nguyên nhân và chú thích bảo tồn cách hiểu sát chữ.
- issue: Đối tượng được chỉ bởi πραιτώριον
  choice: đội cận vệ hoàng gia
  alternative: toàn dinh/tổng hành dinh pháp quan
  rationale: Từ này có thể chỉ lực lượng cận vệ hoặc địa điểm, cơ sở của nhà cầm quyền. Bản chính dùng đối tượng nhân sự hợp với việc 'trở nên rõ ràng', nhưng không loại bỏ nghĩa địa điểm.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh 'xiềng xích' thay vì diễn giải hoàn toàn thành 'sự tù đày'; dùng 'Đấng Ki-tô' như một danh hiệu. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong chính văn.
