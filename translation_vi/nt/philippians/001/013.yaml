    issue: Diễn đạt «đã trở nên rõ ràng trong ... và cho ...»
    rationale: Cấu trúc này gượng trong tiếng Việt và «cho tất cả những người còn lại» không phải là bổ ngữ tự nhiên của «trở nên rõ ràng». Nguyên ngữ nói các xiềng xích đã trở nên công khai/được biết đến đối với cả hai phạm vi.
  - severity: low
    issue: Chú thích b dùng «dinh pháp quan»
    rationale: Cách gọi này không thông dụng và có thể gây hiểu lầm. «Dinh tổng trấn» diễn đạt rõ hơn nghĩa thay thế là nơi ở hoặc tổng hành dinh của nhà cầm quyền, mà không loại trừ nghĩa lực lượng cận vệ.
