  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: vi
  text: 'Phao-lô và Ti-mô-thê, những nô lệ[a] của Đấng Mê-si-a là Đức Giê-su, kính gửi tất cả các thánh đồ ở trong Đấng Mê-si-a là Đức Giê-su tại Phi-líp, cùng với các giám quản[b] và các chấp sự:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những đầy tớ” hoặc “những tôi tớ”; từ Hy Lạp chỉ những người thuộc quyền một chủ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các giám mục”; từ Hy Lạp có nghĩa căn bản là những người trông coi hoặc giám sát.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: những nô lệ
  rationale: Diễn đạt trực tiếp địa vị lệ thuộc và thuộc quyền của δοῦλος, thay vì làm nhẹ nghĩa thành “đầy tớ”; số nhiều cũng được thể hiện rõ.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a là Đức Giê-su
  rationale: Dịch Χριστός theo nghĩa tước hiệu “Đấng Mê-si-a”, đồng thời dùng cấu trúc tiếng Việt tự nhiên để xác định Đức Giê-su là Đấng ấy.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: tất cả các thánh đồ
  rationale: “Thánh đồ” là cách gọi ngắn gọn, quen thuộc trong văn cảnh thư tín, chỉ toàn thể những người được biệt riêng cho Đức Chúa Trời.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a là Đức Giê-su
  rationale: Giữ giới từ ἐν và cách diễn đạt về sự hiệp nhất với Đấng Mê-si-a, không giản lược thành một tính từ hay diễn ý.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: tại Phi-líp
  rationale: Chuyển cụm phân từ chỉ nơi chốn sang cách nói tiếng Việt gọn và tự nhiên, không làm thay đổi đối tượng được gửi thư.
- source_word: σὺν
  choice: cùng với
  rationale: Thể hiện rõ quan hệ đồng hành, bao gồm các giám quản và chấp sự trong lời gửi.
- source_word: ἐπισκόποις
  choice: các giám quản
  rationale: Chuyển tải nghĩa chức năng là những người trông coi, đồng thời tránh mặc nhiên áp đặt cơ cấu giáo phẩm phát triển về sau.
- source_word: διακόνοις
  choice: các chấp sự
  rationale: Trong cặp từ chỉ vai trò phục vụ cộng đồng tại đây, “chấp sự” là thuật ngữ tiếng Việt đã được xác lập và phù hợp hơn nghĩa chung “người phục vụ”.
theological_decisions:
- issue: Cách dịch Χριστός trong công thức xưng gọi của Phao-lô
  choice: Đấng Mê-si-a là Đức Giê-su
  alternative: Đấng Cơ Đốc Giê-su / Chúa Cứu Thế Giê-su
  rationale: Bản dịch giữ Χριστός như một tước hiệu có nội dung về Đấng được xức dầu, thay vì coi đó đơn thuần là tên riêng; cách đặt “là Đức Giê-su” giúp câu tự nhiên trong tiếng Việt.
- issue: Cách dịch δοῦλοι trong Phi-líp 1:1
  choice: những nô lệ
  alternative: những đầy tớ / những tôi tớ
  rationale: “Nô lệ” giữ được sắc thái thuộc quyền và bị ràng buộc vốn có của từ Hy Lạp. Chú thích cung cấp cách dịch truyền thống, nhẹ hơn về sắc thái xã hội.
- issue: Tính chất chức vụ của ἐπισκόποις và διακόνοις
  choice: các giám quản và các chấp sự
  alternative: các giám mục và các người phục vụ
  rationale: Cách dịch phân biệt hai nhóm được nêu trong câu nhưng không xác quyết rằng cơ cấu hoặc phạm vi chức vụ của họ hoàn toàn đồng nhất với các chức danh giáo hội về sau.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, theo thể thức mở đầu thư. Tên riêng được phiên âm quen dùng trong tiếng Việt. “Kính gửi” làm rõ chức năng của cách dữ cách trong câu Hy Lạp mà không thêm nội dung thần học. Cụm “ở trong” được giữ ở mối liên hệ với Đấng Mê-si-a, còn nơi cư trú được diễn đạt tự nhiên là “tại Phi-líp”.
