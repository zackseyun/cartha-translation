id: PHP.1.12
reference: Philippians 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: vi
  text: Thưa anh chị em[a], tôi muốn anh chị em biết rằng những điều xảy đến cho tôi thật ra đã góp phần làm cho Tin Mừng[b] tiến triển,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “anh em”, nhưng từ này ở đây có thể chỉ toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Phúc Âm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: tôi muốn anh chị em biết
  rationale: Diễn đạt tự nhiên cấu trúc nguyên mẫu đi với βούλομαι, giữ rõ ý định trực tiếp của tác giả.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ chỉ sự chuyển ý nhẹ; trật tự câu và cách mở lời bằng lời xưng hô đã thể hiện chuyển tiếp tự nhiên trong tiếng Việt, không cần thêm “bây giờ” vốn dễ mang nghĩa thời gian.
- source_word: ἀδελφοί
  choice: anh chị em[a]
  rationale: Trong lời gọi cộng đồng tín hữu, dạng giống đực số nhiều có thể bao gồm cả nam lẫn nữ; “anh chị em” truyền đạt chức năng xưng hô tự nhiên trong tiếng Việt, còn nghĩa sát chữ được ghi chú.
- source_word: τὰ κατ’ ἐμὲ
  choice: những điều xảy đến cho tôi
  rationale: Cụm từ chỉ rộng hoàn cảnh hay những việc liên quan đến Phao-lô; cách dịch này rõ nghĩa và tự nhiên mà không giới hạn vào một biến cố riêng.
- source_word: μᾶλλον
  choice: thật ra
  rationale: Thể hiện kết quả trái với điều người đọc có thể dự đoán, thay vì buộc từ này mang nghĩa so sánh đơn thuần là “hơn”.
- source_word: εἰς προκοπὴν
  choice: đã góp phần làm cho ... tiến triển
  rationale: Giữ cấu trúc chỉ kết quả/hướng đến sự tiến triển, đồng thời tránh diễn đạt thiếu tự nhiên rằng hoàn cảnh tự nó “đẩy Tin Mừng tiến lên”.
- source_word: τοῦ εὐαγγελίου
  choice: Tin Mừng[b]
  rationale: “Tin Mừng” là cách diễn đạt hiện đại, trang trọng và quen thuộc cho εὐαγγέλιον; ghi chú bảo lưu lựa chọn truyền thống “Phúc Âm”.
- source_word: ἐλήλυθεν
  choice: đã góp phần
  rationale: Dạng hoàn thành diễn tả một kết quả đã hình thành và vẫn có hiệu lực; “đã góp phần” phối hợp tự nhiên với cụm chỉ sự tiến triển.
theological_decisions:
- issue: Phạm vi của ἀδελφοί
  choice: anh chị em
  alternative: anh em
  rationale: Ngữ cảnh là lời gửi đến cả hội chúng; cách dịch bao hàm không áp đặt một lập trường thần học, và chú thích nêu rõ hình thức Hy Lạp.
- issue: Ý nghĩa của εὐαγγέλιον
  choice: Tin Mừng
  alternative: Phúc Âm
  rationale: Cả hai đều chỉ sứ điệp tốt lành; chọn cách nói dễ hiểu hiện nay và bảo lưu thuật ngữ truyền thống trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đưa lời xưng hô “Thưa anh chị em” lên đầu để câu tiếng Việt tự nhiên, không làm thay đổi quan hệ cú pháp chính. Giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang câu kế tiếp.
