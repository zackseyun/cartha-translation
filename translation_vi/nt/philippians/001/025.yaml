- from: Và vì tin chắc điều này, tôi biết rằng mình sẽ còn ở lại và tiếp tục ở với tất cả anh chị em, để anh chị em tiến bộ và vui mừng trong đức tin[a],
  to: Và vì tin chắc điều này, tôi biết rằng tôi sẽ còn ở lại và tiếp tục ở với tất cả anh chị em, vì sự tiến bộ và niềm vui trong đức tin của anh chị em[a],
  rationale: Đổi phần mục đích sang cấu trúc danh từ để phản ánh τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως sát hơn, đồng thời tránh mở rộng “trong đức tin” thành bổ ngữ chắc chắn cho cả hai vế. Những thành phần khác của bản thảo được giữ nguyên về nghĩa và thuật ngữ.
