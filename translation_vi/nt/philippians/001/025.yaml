  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: vi
  text: Và vì tin chắc điều này, tôi biết rằng tôi sẽ còn ở lại và tiếp tục ở với tất cả anh chị em, vì sự tiến bộ và niềm vui trong đức tin của anh chị em[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “niềm vui của đức tin” hoặc “niềm vui đến từ đức tin.”'
    reason: Giữ lại những cách hiểu khả dĩ của sở hữu cách trong cụm χαρὰν τῆς πίστεως.
lexical_decisions:
- source_word: πεποιθὼς
  choice: tin chắc
  rationale: Phân từ hoàn thành diễn tả trạng thái xác tín đã vững vàng; “tin chắc” tự nhiên trong tiếng Việt và không thêm sắc thái cảm xúc quá mức.
- source_word: μενῶ
  choice: sẽ còn ở lại
  rationale: Giữ nghĩa tương lai của μένω là tiếp tục hiện diện; từ “còn” phù hợp với ngữ cảnh Phao-lô dự liệu mình sẽ tiếp tục sống.
- source_word: παραμενῶ
  choice: tiếp tục ở với
  rationale: Phân biệt động từ ghép này với μενῶ và giữ sắc thái tiếp tục hiện diện bên cạnh, đồng hành với người nhận thư.
- source_word: πᾶσιν ὑμῖν
  choice: với tất cả anh chị em
  rationale: Giữ rõ πᾶσιν và diễn đạt quan hệ hiện diện bên cạnh. “Anh chị em” là cách gọi cộng đồng tín hữu tự nhiên, trang trọng và bao quát trong tiếng Việt hiện đại.
- source_word: προκοπὴν
  choice: tiến bộ
  rationale: Diễn đạt rõ ý tiến triển về phía trước của προκοπή và phù hợp với sự trưởng thành trong đời sống đức tin.
- source_word: χαρὰν τῆς πίστεως
  choice: vui mừng trong đức tin
  rationale: Cách diễn đạt tự nhiên, liên kết niềm vui với đời sống đức tin nhưng không giải nghĩa quan hệ sở hữu cách thành quan hệ nguyên nhân.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong ngữ cảnh này, πίστις chỉ đời sống tin cậy và niềm tin của cộng đồng; “đức tin” là thuật ngữ tiếng Việt chuẩn xác và quen thuộc.
theological_decisions:
- issue: Quan hệ sở hữu cách trong χαρὰν τῆς πίστεως
  choice: vui mừng trong đức tin
  alternative: niềm vui của đức tin; niềm vui đến từ đức tin
  rationale: Cấu trúc Hy Lạp cho phép nhiều sắc thái. Bản chính dùng lối diễn đạt tự nhiên mà không quyết định dứt khoát rằng đức tin là nguồn gây nên niềm vui; các khả năng khác được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chuyển tải số nhiều ὑμεῖς trong lời Phao-lô nói với toàn thể cộng đồng; giữ nhịp câu nối tiếp vì câu Hy Lạp còn tiếp diễn.
