id: PHP.1.23
reference: Philippians 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: vi
  text: Nhưng tôi bị giằng co giữa hai điều, vì tôi có niềm khao khát ra đi[a] và ở với Đấng Mê-si-a[b], vì điều đó tốt hơn rất nhiều.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Có thể hiểu là “qua đời”; nguyên văn: “ra đi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ.” Hy Lạp: Christos, nghĩa là “Đấng được xức dầu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: συνέχομαι
  choice: bị giằng ép
  rationale: Diễn tả việc Phao-lô bị hai hướng lựa chọn cùng gây sức ép; cách nói này giữ sắc thái bị dồn ép và sự căng thẳng nội tâm.
- source_word: ἐκ τῶν δύο
  choice: giữa hai điều
  rationale: Trong văn cảnh, cụm từ chỉ hai khả năng đang tạo sức ép lên Phao-lô; tiếng Việt tự nhiên diễn đạt quan hệ này bằng “giữa hai điều”.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: tôi mang niềm khao khát
  rationale: Giữ lại danh từ ἐπιθυμία (“niềm khao khát, ước muốn”) và đồng thời tạo câu văn trang trọng, dễ hiểu.
- source_word: ἀναλῦσαι
  choice: được ra đi
  rationale: Giữ hình ảnh uyển ngữ “ra đi” của nguyên văn thay vì trực tiếp thay bằng “qua đời”; ý nghĩa trong văn cảnh được nêu ở chú thích.
- source_word: Χριστῷ
  choice: Đấng Mê-si
  rationale: Thể hiện Χριστός như một tước hiệu, đồng thời tránh xem cụm từ này chỉ như tên riêng; cách dịch quen thuộc “Đấng Christ” được ghi ở chú thích.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: vì điều ấy tốt hơn rất nhiều
  rationale: Truyền đạt rõ sức nhấn mạnh mạnh mẽ của πολλῷ ... μᾶλλον cùng dạng so sánh κρεῖσσον bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Hàm ý về việc ở với Đấng Mê-si sau khi qua đời
  choice: ra đi và ở với Đấng Mê-si
  alternative: qua đời và lập tức lên thiên đàng
  rationale: Bản dịch chỉ nói điều câu Hy Lạp khẳng định—ra đi và ở với Đấng Mê-si—mà không bổ sung thời điểm, địa điểm hay một hệ thống giáo lý không được nêu trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bị giằng ép” giữ sức nặng của động từ Hy Lạp; “mang niềm khao khát” duy trì cấu trúc danh từ của nguyên văn. Dấu hai chấm làm rõ hai điều đang đặt Phao-lô vào thế căng thẳng mà không giải thích quá mức.
