  to: Thật là phải lẽ khi tôi nghĩ như vậy về tất cả anh chị em[a], vì tôi mang anh chị em trong lòng, vì cả trong cảnh tôi bị xiềng xích lẫn trong việc biện hộ và xác nhận Tin Mừng, tất cả anh chị em đều cùng tôi dự phần trong ân điển.
