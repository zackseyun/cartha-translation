  source_fidelity: Bản dịch giữ đúng mạch lập luận, nghĩa của δίκαιον, φρονεῖν, συγκοινωνούς và χάριτος, đồng thời có chú thích thích đáng cho sự mơ hồ thực sự của mệnh đề «có ... trong lòng». Tuy nhiên, «luôn» không có trong nguyên văn, và cách diễn đạt «Bởi cả khi tôi bị xiềng xích lẫn khi...» làm mờ cấu trúc ἐν ... καὶ ἐν, vốn đặt sự đồng dự phần trong ân điển vào cả hoàn cảnh bị xiềng xích lẫn việc biện hộ và xác nhận Tin Mừng.
  naturalness: «Thật là phải lẽ» tự nhiên hơn «Thật phải lẽ». Cấu trúc «cả trong cảnh ... lẫn trong việc ...» rõ ràng, trang trọng và tự nhiên trong tiếng Việt hiện đại.
