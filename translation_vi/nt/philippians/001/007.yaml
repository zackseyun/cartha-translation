id: PHP.1.7
reference: Philippians 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: vi
  text: Thật là phải lẽ khi tôi nghĩ như vậy về tất cả anh chị em[a], vì tôi mang anh chị em trong lòng, vì cả trong cảnh tôi bị xiềng xích lẫn trong việc biện hộ và xác nhận Tin Mừng, tất cả anh chị em đều cùng tôi dự phần trong ân điển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì anh chị em mang tôi trong lòng.” Cấu trúc câu Hy Lạp có thể được hiểu theo cả hai cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: phải lẽ
  rationale: Diễn đạt điều chính đáng và thích hợp trong thái độ của Phao-lô, đồng thời giữ giọng trang trọng tự nhiên.
- source_word: φρονεῖν
  choice: nghĩ như vậy
  rationale: Giữ nghĩa về suy nghĩ và thái độ nhất quán, đồng thời liên kết tự nhiên với nội dung trước đó.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: về tất cả anh chị em
  rationale: Với φρονεῖν, cụm này chỉ đối tượng mà Phao-lô nghĩ đến, không mang nghĩa đại diện hay thay mặt.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: vì tôi luôn mang anh chị em trong lòng
  rationale: Theo cách hiểu phù hợp với mạch bày tỏ tình cảm của Phao-lô; trạng từ 'luôn' làm câu tiếng Việt tự nhiên nhưng không thay đổi trọng tâm của hình ảnh trong lòng. Cách phân tích ngược lại được giữ trong chú thích.
- source_word: δεσμοῖς
  choice: bị xiềng xích
  rationale: Giữ hình ảnh cụ thể của cảnh tù đày trong δεσμοί và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀπολογίᾳ
  choice: biện hộ
  rationale: Thể hiện hành động bảo vệ Tin Mừng trước sự chất vấn hoặc chống đối, có thể bao gồm bối cảnh pháp lý.
- source_word: βεβαιώσει
  choice: xác nhận
  rationale: Giữ ý nghĩa chứng thực hoặc củng cố tính chân thật, vững chắc của Tin Mừng.
- source_word: συγκοινωνούς
  choice: cùng tôi dự phần
  rationale: Diễn đạt rõ sự đồng tham dự mà không tạo lối nói trùng lặp hoặc cứng nhắc trong tiếng Việt.
- source_word: χάριτος
  choice: ân điển
  rationale: Giữ thuật ngữ thần học quen thuộc về ân huệ nhưng không của Đức Chúa Trời; trong ngữ cảnh, ân điển bao hàm sự kêu gọi và những trải nghiệm gắn với việc phục vụ Tin Mừng.
theological_decisions:
- issue: Sự mơ hồ cú pháp trong mệnh đề nói về tấm lòng
  choice: vì tôi luôn mang anh chị em trong lòng
  alternative: vì anh chị em luôn mang tôi trong lòng
  rationale: Cả με và ὑμᾶς đều ở đối cách quanh động từ nguyên mẫu ἔχειν, nên về mặt cú pháp có thể hiểu theo hai hướng. Cách chính phù hợp với mạch tình cảm của Phao-lô, nhưng cách kia vẫn khả hữu và được ghi ở chú thích.
- issue: Phạm vi của ân điển được cùng dự phần
  choice: tất cả anh chị em đều cùng tôi dự phần trong ân điển
  alternative: tất cả anh chị em đều là những người cùng dự phần với tôi trong ân điển
  rationale: Bản dịch không thu hẹp ân điển chỉ vào sự chịu khổ, công việc truyền giáo hay một đặc ân riêng, vì nguyên văn để phạm vi này rộng và gắn nó với cả cảnh xiềng xích lẫn việc biện hộ, xác nhận Tin Mừng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ὑμῶν theo lối cộng đồng tự nhiên; “Tin Mừng” và “ân điển” giữ sắc thái Kinh Thánh quen thuộc. Câu được chia làm hai để tránh kết cấu quá nặng mà vẫn bảo toàn quan hệ lập luận của nguyên văn.
