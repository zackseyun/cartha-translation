id: PHP.1.17
reference: Philippians 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: vi
  text: Còn những người kia công bố Đấng Mê-si[a] vì tham vọng ích kỷ, không bởi động cơ trong sạch, vì nghĩ rằng như thế sẽ làm tôi thêm khốn khổ trong cảnh tù đày[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Đấng Christ.”
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “trong xiềng xích của tôi”; tức là trong cảnh tôi bị giam cầm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: tham vọng ích kỷ
  rationale: Diễn tả tham vọng vụ lợi, mang tính tranh cạnh hoặc phe phái, chứ không chỉ là sự ích kỷ nói chung.
- source_word: Χριστόν
  choice: Đấng Mê-si
  rationale: Trong ngữ cảnh nói về nội dung được công bố, Χριστός nổi bật với chức năng tước hiệu chỉ Đấng được xức dầu.
- source_word: καταγγέλλουσιν
  choice: công bố
  rationale: Giữ được ý loan báo công khai mà không giới hạn hành động này vào việc giảng thuyết chính thức.
- source_word: οὐχ ἁγνῶς
  choice: không bởi động cơ trong sạch
  rationale: Trong ngữ cảnh, trạng từ nói đến sự không thuần khiết trong động cơ; cách diễn đạt này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: οἰόμενοι
  choice: vì nghĩ rằng
  rationale: Chuyển tải nhận định hoặc ý định chủ quan của những người rao giảng và nối tự nhiên với mệnh đề sau.
- source_word: θλῖψιν ἐγείρειν
  choice: làm tôi thêm khốn khổ
  rationale: Diễn đạt tự nhiên thành ngữ mang nghĩa gây nên hoặc làm gia tăng sự khốn khó, đồng thời giữ sắc thái họ chủ ý khiến Phao-lô đau khổ.
- source_word: τοῖς δεσμοῖς μου
  choice: trong cảnh tù đày
  rationale: δεσμοί có nghĩa đen là xiềng xích và được dùng hoán dụ cho tình trạng bị giam cầm; bản dịch chính nêu rõ ý theo ngữ cảnh, còn nghĩa đen được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây từ này chỉ căn tính và tước hiệu của Đấng được rao truyền, nên “Đấng Mê-si” làm nổi bật chức năng tước hiệu mà không loại bỏ cách gọi truyền thống trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Còn những người kia” giữ thế tương phản với nhóm được nhắc đến trước đó; “không bởi động cơ trong sạch” tránh làm mờ trọng tâm về động cơ; các dấu chú thích được đặt ngay sau những từ ngữ mà chúng giải thích.
