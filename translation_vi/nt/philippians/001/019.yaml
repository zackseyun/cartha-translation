id: PHP.1.19
reference: Philippians 1:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: vi
  text: Vì tôi biết rằng điều này sẽ dẫn đến sự cứu thoát[a] cho tôi, nhờ lời cầu nguyện của anh chị em và sự tiếp trợ của Thần Khí của Giê-su, Đấng Mê-si-a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự cứu rỗi” hoặc “sự minh oan.”'
    reason: alternative_reading
  - marker: b
    text: 'Tiếng Hy Lạp: “Thần Khí của Giê-su, Đấng Mê-si-a.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: tôi biết
  rationale: Dạng hoàn thành οἶδα mang nghĩa hiện tại; “tôi biết” tự nhiên và giữ được sự xác tín của Phao-lô.
- source_word: τοῦτό
  choice: điều này
  rationale: Đại từ chỉ định số ít quy chiếu rộng đến hoàn cảnh hiện tại vừa được nói đến, không xác định quá mức.
- source_word: ἀποβήσεται
  choice: sẽ đem lại
  rationale: Động từ nói đến kết quả hay diễn tiến dẫn tới một kết cục; cách diễn đạt này tự nhiên khi đi với “sự cứu thoát cho tôi”.
- source_word: σωτηρίαν
  choice: sự cứu thoát
  rationale: Trong bối cảnh Phao-lô bị giam cầm, từ này có thể chỉ sự giải cứu, nhưng vẫn mang âm hưởng rộng hơn của sự cứu rỗi và cũng có thể hàm ý được minh oan; các khả năng ấy được giữ trong chú thích.
- source_word: δεήσεως
  choice: lời cầu nguyện
  rationale: Diễn đạt rõ ràng, tự nhiên trong tiếng Việt hiện đại và phù hợp với lời khẩn cầu thay cho Phao-lô.
- source_word: ἐπιχορηγίας
  choice: sự tiếp trợ
  rationale: Từ này chỉ sự cung ứng hoặc hỗ trợ được ban cho; “sự tiếp trợ” vừa tự nhiên vừa giữ ý về nguồn trợ giúp tích cực.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Thần của Chúa Giê-su, Đấng Mê-si-a
  rationale: Giữ trực tiếp cấu trúc sở hữu/liên hệ của nguyên văn, đồng thời chuyển Χριστός theo nghĩa tước hiệu “Đấng Mê-si-a”; “Chúa” là cách xưng hô tự nhiên, tôn kính trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của σωτηρίαν trong hoàn cảnh Phao-lô bị giam
  choice: sự cứu thoát
  alternative: sự cứu rỗi; sự minh oan
  rationale: Ngữ cảnh gần nói đến xiềng xích và kết cục hoàn cảnh hiện tại của Phao-lô, nên “sự cứu thoát” phù hợp nhất trong chính văn. Tuy nhiên, σωτηρία có trường nghĩa rộng và câu này vọng lại ngôn ngữ có thể mang ý được minh oan; chú thích bảo tồn sự căng thẳng đó.
- issue: Quan hệ trong cụm ἐπιχορηγίας τοῦ πνεύματος
  choice: sự tiếp trợ của Thần
  alternative: việc Thần được ban cho
  rationale: 'Cấu trúc sở hữu trong tiếng Việt giữ được độ mở của nguyên văn: có thể hiểu là sự tiếp trợ đến từ Thần hoặc sự cung ứng chính Thần ấy, thay vì quyết đoán loại trừ một khả năng.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ὑμῶν một cách bao quát, tự nhiên; giữ “Thần” theo cách gọi trong cụm danh xưng của nguyên văn và dùng tước hiệu “Đấng Mê-si-a” thay vì biến Χριστός thành tên riêng.
