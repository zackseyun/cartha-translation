  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: vi
  text: Những người trước làm điều đó vì lòng yêu thương,[a] biết rằng tôi được đặt vào vị trí để biện hộ cho Tin Mừng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn lược động từ: “Những người trước thì vì lòng yêu thương”; hành động được hiểu từ văn cảnh.'
    reason: implicit_action
  - marker: b
    text: 'Cũng có thể dịch: “tôi được đặt để biện hộ cho Tin Mừng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: Những người này làm vậy
  rationale: Cụm Hy Lạp lược bỏ động từ và tạo thế đối chiếu với οἱ δέ ở câu kế tiếp. “Làm vậy” diễn đạt tự nhiên hành động rao giảng Đấng Christ được hiểu từ văn cảnh mà không lặp lại quá mức.
- source_word: ἐξ ἀγάπης
  choice: vì lòng yêu thương
  rationale: ἐξ với danh từ trừu tượng chỉ động cơ hoặc nguồn thúc đẩy. Cách dịch này tự nhiên trong tiếng Việt và không tự ý xác định đối tượng của tình yêu thương.
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ nêu cơ sở cho hành động của họ. “Vì biết rằng” làm rõ quan hệ lý do trong tiếng Việt mà vẫn giữ sát ý nguồn.
- source_word: εἰς ἀπολογίαν
  choice: để biện hộ
  rationale: ἀπολογία chỉ sự biện hộ có lý lẽ, đôi khi mang sắc thái pháp lý; “biện hộ” giữ được sắc thái này rõ hơn từ khái quát “bảo vệ”.
- source_word: τοῦ εὐαγγελίου
  choice: cho Tin Mừng
  rationale: “Tin Mừng” là cách diễn đạt tiếng Việt tự nhiên, trang trọng và quen thuộc cho εὐαγγέλιον; giới từ “cho” kết hợp tự nhiên với “biện hộ”.
- source_word: κεῖμαι
  choice: tôi được chỉ định
  rationale: Trong văn cảnh, động từ mang nghĩa được đặt vào một vai trò hay hoàn cảnh nhằm một mục đích. “Được chỉ định” truyền đạt nghĩa thành ngữ mà không dùng cách dịch vật lý thiếu tự nhiên như “nằm”.
theological_decisions:
- issue: Ý nghĩa của κεῖμαι trong hoàn cảnh Phao-lô bị giam
  choice: được chỉ định
  alternative: được đặt vào hoàn cảnh này
  rationale: Bản dịch chính thể hiện vai trò có mục đích của Phao-lô nhưng không nêu rõ tác nhân vốn không xuất hiện trong câu Hy Lạp. Chú thích giữ lại khả năng nhấn mạnh hoàn cảnh ông đang ở hơn là một sự bổ nhiệm chính thức.
- issue: Đối tượng của ἀγάπη
  choice: không nêu đối tượng của lòng yêu thương
  alternative: lòng yêu Tin Mừng hoặc yêu Phao-lô
  rationale: Bản văn chỉ nói ἐξ ἀγάπης, không xác định trực tiếp họ yêu ai hay điều gì; vì vậy bản dịch không thu hẹp sự mơ hồ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm vậy” xử lý phép tỉnh lược của tiếng Hy Lạp; “biện hộ” giữ sắc thái lập luận/pháp lý của ἀπολογία; “Tin Mừng” dùng theo lối gọi phổ thông trong tiếng Việt.
