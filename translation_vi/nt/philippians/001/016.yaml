    rationale: οἱ μὲν được đối chiếu với οἱ δέ ở câu sau. “Những người trước” giữ quan hệ đối chiếu rõ hơn trong tiếng Việt.
  - severity: medium
    issue: “Được chỉ định” có thể mang sắc thái được bổ nhiệm chính thức mạnh hơn κεῖμαι.
    rationale: κέῖμαι theo ngữ cảnh chỉ việc Phao-lô được đặt/cắt đặt vào vai trò nhằm biện hộ; “được đặt vào vị trí” bảo tồn độ mở này tốt hơn.
  - severity: low
    issue: Chú thích b thêm từ chỉ định “này” vào “hoàn cảnh này”.
    rationale: Bản văn không nêu trực tiếp một hoàn cảnh cụ thể trong câu; chú thích nên nêu lựa chọn dịch mà không thêm chỉ định ngữ.
