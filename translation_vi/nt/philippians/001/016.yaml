revisions:
- from: Những người này làm vậy vì lòng yêu thương,[a] vì biết rằng tôi được chỉ định để biện hộ cho Tin Mừng.[b]
  to: Những người trước làm điều đó vì lòng yêu thương,[a] biết rằng tôi được đặt vào vị trí để biện hộ cho Tin Mừng.[b]
  rationale: Bản sửa làm rõ đối chiếu μὲν/δέ, dùng cách diễn đạt ít chuyên biệt hơn cho κεῖμαι, và điều chỉnh chú thích để phản ánh nguyên ngữ mà không thêm chi tiết ngữ cảnh. Ý nghĩa của câu, sự mơ hồ về đối tượng của tình yêu thương, và sắc thái biện hộ của ἀπολογία đều được giữ nguyên.
