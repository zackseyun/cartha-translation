id: PHP.1.28
reference: Philippians 1:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: vi
  text: và không hề nao núng trước những kẻ chống đối anh chị em[a]. Điều ấy là dấu hiệu cho họ về sự diệt vong[b], nhưng cho anh chị em về sự cứu rỗi—và điều này đến từ Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không hề hoảng sợ” hoặc “không hề bị uy hiếp.”'
    reason: lexical_alternative
  - marker: b
    text: “Dấu hiệu” cũng có thể hiểu là “bằng chứng” hoặc “sự biểu thị” về sự diệt vong.
    reason: lexical_alternative
  - marker: c
    text: Cụm từ “điều này đến từ Đức Chúa Trời” có thể chỉ riêng sự cứu rỗi, hoặc rộng hơn là toàn bộ dấu hiệu vừa được nói đến.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: nao núng
  rationale: Động từ diễn tả sự hoảng sợ hoặc bị đối phương uy hiếp. “Nao núng” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh đứng vững trước sự chống đối.
- source_word: ἐν μηδενί
  choice: không hề
  rationale: Cách diễn đạt này giữ ý tuyệt đối “không trong bất cứ phương diện nào” mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀντικειμένων
  choice: những kẻ chống đối anh chị em
  rationale: Phân từ chỉ những người đang chống lại các tín hữu; thêm đối tượng “anh chị em” làm rõ quan hệ vốn được hàm ý trong ngữ cảnh.
- source_word: ἔνδειξις
  choice: dấu hiệu
  rationale: Từ này chỉ một dấu hiệu có giá trị chứng tỏ hoặc chỉ ra một thực tại; “dấu hiệu” ngắn gọn, dễ hiểu và không diễn đạt quá mức thành “bằng chứng chắc chắn”.
- source_word: ἀπωλείας
  choice: sự diệt vong
  rationale: “Sự diệt vong” giữ sắc thái hủy diệt, mất mát và phán xét của từ Hy Lạp mà không xác định thêm điều văn bản không nói rõ.
- source_word: σωτηρίας
  choice: sự cứu rỗi
  rationale: Trong văn mạch Phao-lô, “sự cứu rỗi” giữ được trọng lượng thần học của hành động cứu độ từ Đức Chúa Trời.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: và điều này đến từ Đức Chúa Trời
  rationale: Giữ đại từ chỉ định và không xác định cứng antecedent của nó; “đến từ” diễn đạt tự nhiên nguồn gốc được nêu bởi ἀπό.
theological_decisions:
- issue: Đối tượng quy chiếu của τοῦτο (“điều này”)
  choice: 'Giữ rộng và cố ý không phân giải trong chính văn: “và điều này đến từ Đức Chúa Trời.”'
  alternative: “Điều này” có thể chỉ riêng sự cứu rỗi, hoặc chỉ rộng hơn toàn bộ dấu hiệu vừa nêu—sự không nao núng báo trước sự diệt vong của đối phương và sự cứu rỗi của tín hữu.
  rationale: Cú pháp Hy Lạp cho phép nhiều cách hiểu; bản dịch không nên tự ý giải quyết sự mơ hồ có ý nghĩa thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chuyển tải đại từ số nhiều ὑμῶν trong lời nói trực tiếp với cộng đồng tín hữu; “nao núng” giữ sắc thái bị đe dọa nhưng không quá khẩu ngữ.
