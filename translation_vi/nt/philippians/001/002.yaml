id: PHP.1.2
reference: Philippians 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: vi
  text: Ân điển[a] và bình an đến với anh chị em từ Đức Chúa Trời, Cha chúng ta, và từ Chúa[b] Giê-su, Đấng Mê-si-a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: ân huệ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: Chủ.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: Đấng Christ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: “Ân điển” là cách diễn đạt trang trọng, quen thuộc trong văn mạch Phao-lô, giữ được cả ý về ân huệ nhưng không và chiều kích thần học của χάρις.
- source_word: ὑμῖν
  choice: đến với anh chị em
  rationale: Cách diễn đạt tự nhiên cho tặng cách trong lời chào chúc phước; “anh chị em” truyền đạt đại từ số nhiều mà không mặc định chỉ một giới.
- source_word: εἰρήνη
  choice: bình an
  rationale: “Bình an” vừa tự nhiên trong tiếng Việt vừa bảo toàn âm hưởng của lời chào Hy Lạp và Do Thái.
- source_word: ἀπὸ
  choice: từ
  rationale: Diễn đạt trực tiếp nguồn ban ân điển và bình an. Lặp lại “từ” trước “Chúa” giúp câu tiếng Việt rõ ràng mà không thay đổi quan hệ cú pháp.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: 'Giữ quan hệ đồng vị tự nhiên: Đức Chúa Trời chính là Cha chúng ta; dấu phẩy tránh làm mất sắc thái này.'
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” là cách dịch trang trọng và đã ổn định của κύριος trong tước hiệu dành cho Giê-su, đồng thời giữ sức nặng Cơ Đốc học của từ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si-a
  rationale: “Đấng Mê-si-a” chuyển tải ý nghĩa tước hiệu của Χριστός thay vì chỉ phiên âm; dấu phẩy làm rõ đây là tước hiệu đồng vị của Giê-su.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong công thức chào thư tín của Phao-lô
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong công thức này, Χριστός có thể đã mang sắc thái gần như tên riêng, nhưng ý nghĩa tước hiệu vẫn còn rõ. Bản chính giữ “Đấng Mê-si-a” để chuyển tải nghĩa của từ Hy Lạp, còn cách dịch truyền thống được ghi ở chú thích.
- issue: Quan hệ giữa θεοῦ và πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  alternative: Đức Chúa Trời là Cha chúng ta
  rationale: Cách đồng vị bảo toàn cấu trúc cô đọng của nguyên văn và không diễn giải quá mức, trong khi vẫn rõ ràng bằng tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “đến với anh chị em” được bổ sung theo ngữ pháp tiếng Việt để diễn đạt tự nhiên công thức chào không có động từ trong nguyên văn; không biến lời chào thành một lời cầu chúc có động từ “nguyện”. Tên riêng dùng dạng “Giê-su”; “Đức Chúa Trời” và “Chúa” giữ vốn từ tôn giáo phổ thông trong tiếng Việt.
