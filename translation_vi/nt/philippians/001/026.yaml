id: PHP.1.26
reference: Philippians 1:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: vi
  text: để niềm hãnh diện của anh chị em trong Đấng Mê-si-a Giê-su[a] càng dồi dào hơn vì tôi[b], nhờ việc tôi trở lại với anh chị em[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “niềm hãnh diện của anh chị em càng dồi dào hơn trong Đấng Mê-si-a Giê-su.”'
    reason: Bảo lưu khả năng gắn cụm ἐν Χριστῷ Ἰησοῦ với động từ “càng dồi dào hơn” thay vì với “niềm hãnh diện”.
  - marker: b
    text: 'Nguyên văn: “trong tôi”; ở đây có thể hiểu là “vì tôi” hoặc “do tôi.”'
    reason: Nêu nghĩa sát chữ và cách hiểu theo ngữ cảnh của ἐν ἐμοὶ.
  - marker: c
    text: Từ được diễn đạt là “trở lại” cũng có thể mang nghĩa “sự hiện diện”; ở đây chỉ việc Phao-lô đích thân trở lại gặp họ.
    reason: Giải thích phạm vi nghĩa của παρουσία trong ngữ cảnh.
  - marker: d
    text: 'Cũng có thể dịch cả câu: “để nhờ việc tôi trở lại với anh chị em, lý do anh chị em hãnh diện trong Đấng Mê-si-a Giê-su càng dồi dào hơn vì tôi.”'
    reason: Bảo lưu cách hiểu καύχημα là “lý do để hãnh diện” và làm rõ một cấu trúc khả dĩ của toàn câu.
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn tả mục đích hoặc kết quả phát xuất từ câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: τὸ καύχημα ὑμῶν
  choice: niềm hãnh diện của anh chị em
  rationale: καύχημα có thể chỉ sự hãnh diện hoặc điều làm căn cứ cho sự hãnh diện. “Niềm hãnh diện” giữ được độ mở ấy và phù hợp với sắc thái tích cực trong ngữ cảnh.
- source_word: περισσεύῃ
  choice: càng thêm dồi dào
  rationale: Truyền đạt ý gia tăng, tràn đầy của động từ và phù hợp với thức giả định sau ἵνα.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong” và dịch Χριστός như một tước hiệu; cách viết Mê-si-a và Giê-su quen thuộc với độc giả tiếng Việt.
- source_word: ἐν ἐμοὶ
  choice: vì tôi
  rationale: Trong ngữ cảnh, cụm này tự nhiên nhất khi chỉ nguyên cớ hoặc duyên cớ gắn với Phao-lô, dù nghĩa sát chữ là “trong tôi”.
- source_word: διὰ τῆς ἐμῆς παρουσίας
  choice: qua việc tôi ... đến
  rationale: διά với sở hữu cách diễn tả phương tiện; παρουσία ở đây chỉ việc Phao-lô đích thân hiện diện bằng cách trở lại với họ.
- source_word: πάλιν πρὸς ὑμᾶς
  choice: lại đến với anh chị em
  rationale: Diễn đạt tự nhiên ý Phao-lô trở lại thăm cộng đồng Phi-líp.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Chúa Cứu Thế
  rationale: Χριστός vẫn mang giá trị tước hiệu trong cụm này. “Đấng Mê-si-a” truyền đạt tước hiệu mà không đưa thêm một cách diễn giải hệ phái.
- issue: Cụm ἐν Χριστῷ Ἰησοῦ bổ nghĩa cho thành phần nào
  choice: 'Gắn tự nhiên với “niềm hãnh diện”: “niềm hãnh diện ... trong Đấng Mê-si-a Giê-su”'
  alternative: 'Gắn với động từ: “càng thêm dồi dào trong Đấng Mê-si-a Giê-su”'
  rationale: Trật tự Hy Lạp cho phép cân nhắc cả hai, nhưng thành ngữ Phao-lô về sự hãnh diện “trong” Đấng Mê-si-a khiến cách gắn với καύχημα có sức thuyết phục hơn; chú thích vẫn bảo lưu khả năng kia.
- issue: Sắc thái của καύχημα
  choice: niềm hãnh diện
  alternative: lý do để hãnh diện
  rationale: Danh từ có thể chỉ chính sự hãnh diện hoặc căn cứ cho sự hãnh diện. Bản chính giữ cách nói gọn và ít diễn giải hơn; chú thích nêu nghĩa cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν/ὑμᾶς nhằm biểu đạt cộng đồng gồm cả nam lẫn nữ. “Niềm hãnh diện” tránh sắc thái tiêu cực quá mạnh của “khoe khoang” trong tiếng Việt hiện đại, nhưng các chú thích vẫn giữ độ mở từ vựng và cú pháp của nguyên bản.
