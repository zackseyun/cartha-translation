  yaml_path: translation/nt/philippians/001/030.yaml
  text: having the same struggle that you saw in me and now hear that I still have.
translation:
  language: vi
  text: anh chị em đang trải qua cùng một cuộc tranh đấu như anh chị em đã thấy nơi tôi và nay nghe về tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “và nay nghe nơi tôi.” Có thể chỉ điều anh chị em hiện nghe về hoàn cảnh của Phao-lô.'
    reason: Bảo tồn cách diễn đạt có phần cô đọng và độ mở của ἐν ἐμοί trong vế cuối, đồng thời giúp câu tiếng Việt tự nhiên.
lexical_decisions:
- source_word: ἀγῶνα
  choice: cuộc tranh đấu
  rationale: Diễn đạt cuộc đối kháng gian khổ vì đức tin, đồng thời giữ được sắc thái rộng của từ Hy Lạp thay vì giới hạn vào một loại đau khổ cụ thể.
- source_word: ἔχοντες
  choice: đang trải qua
  rationale: Trong tiếng Việt, cách nói này tự nhiên hơn bản dịch sát chữ “đang có” khi nói về một cuộc tranh đấu.
- source_word: τὸν αὐτόν
  choice: cùng một
  rationale: Giữ ý các tín hữu cùng dự phần vào loại tranh đấu mà Phao-lô đang trải qua.
- source_word: νῦν
  choice: nay
  rationale: Giữ sự tương phản về thời gian giữa điều họ từng thấy và điều hiện họ đang nghe.
theological_decisions:
- issue: Ý nghĩa của ἐν ἐμοί trong mệnh đề cuối
  choice: nghe rằng tôi vẫn đang trải qua
  alternative: nghe nơi tôi
  rationale: Ngữ cảnh cho thấy họ nghe tin cuộc tranh đấu vẫn xảy ra trong hoàn cảnh của Phao-lô; thêm “vẫn” làm rõ tính tiếp diễn được hàm ý bởi đối chiếu giữa “đã thấy” và “nay nghe”, nhưng chú thích vẫn bảo tồn cấu trúc sát chữ và độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng tín hữu; giữ cấu trúc phân từ vì câu này tiếp nối câu trước.
