id: PHP.1.21
reference: Philippians 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: vi
  text: Vì đối với tôi, sống là Đấng Christ[a], và chết là lợi ích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Mê-si-a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: đối với tôi
  rationale: Cách diễn đạt này giữ rõ thể tặng cách nhấn mạnh quan điểm riêng của Phao-lô, đồng thời tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Từ nối này đưa ra lời giải thích cho ý ngay trước đó; “Vì” bảo toàn mạch lập luận ngắn gọn của câu.
- source_word: τὸ ζῆν
  choice: sống
  rationale: Động từ nguyên mẫu có mạo từ được dùng như danh từ. “Sống” là cách diễn đạt tự nhiên, cô đọng và cân xứng với “chết” trong tiếng Việt.
- source_word: Χριστὸς
  choice: Đấng Christ
  rationale: Χριστός vừa mang sắc thái tước hiệu vừa có thể được dùng gần như tên riêng trong thư Phao-lô. “Đấng Christ” giữ cách gọi quen thuộc và trang trọng; nghĩa tước hiệu “Đấng Mê-si-a” được nêu trong chú thích.
- source_word: τὸ ἀποθανεῖν
  choice: chết
  rationale: Cách dịch cô đọng này tương ứng với “sống” và giữ cấu trúc song song nổi bật của nguyên văn.
- source_word: κέρδος
  choice: ích lợi
  rationale: “Ích lợi” diễn đạt điều có lợi hay phần thu được mà không tạo sắc thái thương mại quá mạnh, đồng thời phù hợp làm vị ngữ danh từ trong câu.
theological_decisions:
- issue: Quan hệ giữa hai vế nối bằng καί
  choice: dịch là “còn”
  alternative: “và”
  rationale: Trong cấu trúc song song này, καί nối hai mệnh đề nhưng hai ý “sống” và “chết” được đặt cạnh nhau để tương phản. “Còn” thể hiện quan hệ ngữ cảnh ấy mà không thêm cách giải nghĩa thần học.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và cô đọng. Nhịp song song “sống… còn chết…” phản ánh cấu trúc cân xứng của nguyên văn; không bổ sung động từ hay lời giải thích nhằm giữ sức nén của phát biểu.
