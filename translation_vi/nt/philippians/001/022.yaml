source:
  edition: SBLGNT
  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: vi
  text: Nhưng nếu tiếp tục sống trong xác thịt[a] thì điều đó đem lại cho tôi kết quả trong công việc[b]; còn tôi không biết mình sẽ chọn điều nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thân thể.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn có cấu trúc cô đọng: “hoa trái của công việc”; cũng có thể dịch: “công việc sinh hoa trái” hoặc “công việc có kết quả.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: tiếp tục sống
  rationale: Dạng động từ nguyên mẫu có mạo từ nói đến việc còn sống trong hoàn cảnh hiện tại; “tiếp tục sống” diễn đạt tự nhiên sắc thái kéo dài của đời sống hiện tại.
- source_word: ἐν σαρκί
  choice: trong xác thịt
  rationale: Trong văn cảnh này, σάρξ chỉ sự sống thể xác trên đất, đối lập với việc ra đi để ở với Đấng Christ. Cách dịch sát “xác thịt” giữ được lối nói của Phao-lô mà không hàm ý “bản tính tội lỗi.”
- source_word: καρπὸς ἔργου
  choice: công việc của tôi sẽ sinh hoa trái
  rationale: Cụm Hy Lạp cô đọng theo nghĩa đen là “hoa trái của công việc.” Cách diễn đạt này vừa tự nhiên trong tiếng Việt vừa giữ hình ảnh hoa trái và ý nghĩa lao tác đem lại kết quả.
- source_word: αἱρήσομαι
  choice: mình sẽ chọn
  rationale: Động từ chỉ việc lựa chọn giữa hai khả năng đang được Phao-lô cân nhắc.
- source_word: οὐ γνωρίζω
  choice: tôi không biết
  rationale: Trong văn cảnh, cụm từ biểu thị sự không xác định, nên “tôi không biết” phù hợp hơn nghĩa thường gặp khác là “làm cho biết.”
theological_decisions:
- issue: Ý nghĩa của σάρξ trong câu này
  choice: đời sống thể xác trên đất (“trong xác thịt”)
  alternative: bản tính tội lỗi
  rationale: Văn cảnh đối chiếu việc tiếp tục sống với việc ra đi để ở cùng Đấng Christ; vì vậy σάρξ ở đây nói đến sự hiện hữu trong thân xác, không phải sự sa ngã về đạo đức.
- issue: Quan hệ cú pháp của καρπὸς ἔργου
  choice: việc tiếp tục sống có nghĩa là công việc sẽ sinh hoa trái
  alternative: việc tiếp tục sống chính là “hoa trái của công việc” hoặc “công việc có kết quả”
  rationale: Câu Hy Lạp rất cô đọng và có tính tỉnh lược. Bản dịch chính diễn đạt quan hệ hợp lý trong tiếng Việt, còn chú thích giữ lại các khả năng sát cấu trúc hơn mà không áp đặt một ý nghĩa thần học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ hình ảnh “xác thịt” và “sinh hoa trái” của Phao-lô, đồng thời dùng cấu trúc điều kiện tự nhiên trong tiếng Việt. Đại từ “tôi/mình” giúp mệnh đề cuối rõ ràng mà không làm thay đổi ngôi phát biểu.
