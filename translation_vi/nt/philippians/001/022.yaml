revisions:
- from: Nhưng nếu tiếp tục sống trong xác thịt[a] có nghĩa là công việc của tôi sẽ sinh hoa trái[b], thì tôi không biết mình sẽ chọn điều nào.
  to: Nhưng nếu tiếp tục sống trong xác thịt[a] thì điều đó đem lại cho tôi kết quả trong công việc[b]; còn tôi không biết mình sẽ chọn điều nào.
  rationale: Sửa cấu trúc câu để mệnh đề điều kiện kết thúc ở ý “đem lại cho tôi kết quả trong công việc,” phù hợp với τοῦτό μοι καρπὸς ἔργου. Mệnh đề về điều Phao-lô sẽ chọn được giữ độc lập như καὶ τί αἱρήσομαι οὐ γνωρίζω. Không thay đổi ý nghĩa hay áp đặt cách hiểu giáo phái.
