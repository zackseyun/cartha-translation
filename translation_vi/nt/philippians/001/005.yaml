  terminology: “Tin Mừng” là thuật ngữ phù hợp cho εὐαγγέλιον và được dùng nhất quán. “Anh chị em” diễn đạt tự nhiên số nhiều ὑμῶν trong bối cảnh cộng đồng được ngỏ lời.
