  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: vi
  text: vì sự chung phần của anh chị em trong Tin Mừng, từ ngày đầu tiên cho đến nay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho Tin Mừng.” Cụm từ Hy Lạp có thể chỉ phạm vi của sự chung phần hoặc mục tiêu mà sự chung phần ấy hướng đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: vì sự chung phần của anh chị em
  rationale: ἐπί với cách ba nêu lý do cho lời tạ ơn trong câu bao quanh; κοινωνία chỉ sự tham dự và cộng tác thực sự, không chỉ tình thân hữu. “Sự chung phần” giữ được cả sắc thái quan hệ lẫn sự tham gia tích cực.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: trong Tin Mừng
  rationale: Cụm từ có thể chỉ phạm vi của sự chung phần hoặc mục tiêu mà sự chung phần hướng tới. “Trong Tin Mừng” tự nhiên và giữ được cách hiểu về phạm vi; khả năng chỉ mục đích được ghi ở chú thích.
- source_word: εὐαγγέλιον
  choice: Tin Mừng
  rationale: “Tin Mừng” là cách gọi quen thuộc, trang trọng trong tiếng Việt và phù hợp với nội dung thần học của từ trong thư Phi-líp.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: từ ngày đầu tiên
  rationale: Diễn đạt chính xác mốc khởi đầu của sự chung phần.
- source_word: ἄχρι τοῦ νῦν
  choice: cho đến nay
  rationale: Diễn đạt tự nhiên sự tiếp diễn từ mốc ban đầu tới thời điểm hiện tại.
theological_decisions:
- issue: Quan hệ của εἰς τὸ εὐαγγέλιον với κοινωνία
  choice: trong Tin Mừng
  alternative: vì Tin Mừng
  rationale: Ngữ pháp Hy Lạp cho phép hiểu Tin Mừng là phạm vi của sự chung phần hoặc là mục tiêu của sự cộng tác. Bản chính chọn cách diễn đạt tự nhiên mà không loại bỏ cách hiểu kia, được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm diễn đạt cộng đồng tín hữu một cách tự nhiên; “sự chung phần” bảo tồn sắc thái tham dự tích cực của κοινωνία.
