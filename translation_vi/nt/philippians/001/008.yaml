revisions:
- from: Vì Đức Chúa Trời làm chứng cho tôi rằng tôi nhớ mong tất cả anh chị em bằng tình cảm sâu xa của Đấng Mê-si-a[a] Jêsus.[b]
  to: 'Vì Đức Chúa Trời là Đấng làm chứng cho tôi: tôi nhớ mong tất cả anh chị em biết bao, với tình cảm sâu xa[b] của Đấng Mê-si-a[a] Jêsus.'
  rationale: 'Bản sửa giữ nguyên ý nghĩa và sự mơ hồ của sở hữu cách trong «tình cảm sâu xa của Đấng Mê-si-a Jêsus», đồng thời sửa hai điểm cần thiết: dùng «biết bao» để phản ánh ὡς và dùng lời diễn đạt tự nhiên hơn cho thành ngữ «Đức Chúa Trời là chứng nhân của tôi». Vị trí chú thích b được chuyển sát cụm từ mà nó giải thích; chú thích a được hoàn chỉnh để nêu toàn cụm thay thế.'
