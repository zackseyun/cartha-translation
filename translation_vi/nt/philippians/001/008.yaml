  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: vi
  text: 'Vì Đức Chúa Trời là Đấng làm chứng cho tôi: tôi nhớ mong tất cả anh chị em biết bao, với tình cảm sâu xa[b] của Đấng Mê-si-a[a] Jêsus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ Jêsus.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “với lòng thương cảm của Đấng Mê-si-a Jêsus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς γάρ μου ὁ θεός
  choice: Vì Đức Chúa Trời làm chứng cho tôi
  rationale: Diễn đạt tự nhiên lời viện dẫn long trọng đến Đức Chúa Trời như Đấng xác nhận sự chân thành của Phao-lô; γάρ được giữ bằng “Vì” để nối với mạch văn trước.
- source_word: ὡς ἐπιποθῶ
  choice: rằng tôi nhớ mong
  rationale: Trong tiếng Việt, “làm chứng cho tôi rằng...” truyền đạt tự nhiên nội dung của lời chứng; “nhớ mong” thể hiện sự khao khát tình cảm mạnh mẽ của ἐπιποθῶ.
- source_word: πάντας ὑμᾶς
  choice: tất cả anh chị em
  rationale: Giữ sự nhấn mạnh bao quát của πάντας và dùng cách xưng hô cộng đồng tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: ἐν σπλάγχνοις
  choice: bằng tình cảm sâu xa
  rationale: σπλάγχνα theo nghĩa đen chỉ nội tạng, nhưng trong ngữ cảnh là nơi phát sinh tình cảm sâu đậm; cách dịch này tránh lối nói thô cứng mà vẫn giữ chiều sâu cảm xúc. Phương án “lòng thương cảm” được ghi chú vì từ này cũng có thể mang sắc thái thương xót.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Jêsus
  rationale: Dịch Χριστός theo chức danh là “Đấng Mê-si-a” và phiên âm tên riêng Ἰησοῦ; cách gọi truyền thống “Đấng Christ Jêsus” được giữ trong chú thích.
theological_decisions:
- issue: Quan hệ của tình cảm trong cụm ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ
  choice: bằng tình cảm sâu xa của Đấng Mê-si-a Jêsus
  alternative: bằng lòng thương cảm của Đấng Mê-si-a Jêsus
  rationale: 'Giữ nguyên sự căng thẳng thần học của sở hữu cách: tình cảm ấy thuộc về, bắt nguồn từ, hoặc được chia sẻ trong Đấng Mê-si-a, mà không giải thích thêm theo một hướng duy nhất.'
- issue: Cách dịch Χριστοῦ trong tổ hợp danh hiệu–tên riêng của Phao-lô
  choice: Đấng Mê-si-a Jêsus
  alternative: Đấng Christ Jêsus
  rationale: Giữ nghĩa danh hiệu của Χριστός thay vì coi hoàn toàn như tên riêng, đồng thời ghi nhận cách gọi truyền thống quen thuộc trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều cộng đồng; “Đức Chúa Trời” theo cách gọi Tin Lành Việt ngữ quen thuộc; giữ “Đấng Mê-si-a” như một danh hiệu có nghĩa. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
