  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: vi
  text: để anh chị em phân định điều nào tốt hơn[a], hầu cho anh chị em được tinh sạch và không chỗ trách được vào ngày của Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chấp nhận những điều xuất sắc,” “nhận biết những điều quan trọng hơn,” hoặc, sát nghĩa hơn: “xét những điều khác biệt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cách dịch truyền thống: “vào ngày của Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: biết xem xét và chọn
  rationale: Động từ có thể chỉ việc thử nghiệm, xem xét và chấp thuận sau khi cân nhắc. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được cả quá trình đánh giá lẫn kết quả lựa chọn.
- source_word: τὰ διαφέροντα
  choice: những điều tốt hơn
  rationale: Cụm từ theo nghĩa sát là “những điều khác biệt,” nhưng trong văn cảnh có thể chỉ những điều vượt trội hoặc quan trọng hơn. “Những điều tốt hơn” giữ sắc thái so sánh mà không tuyệt đối hóa thành “tốt nhất.”
- source_word: εἰλικρινεῖς
  choice: tinh sạch
  rationale: Tính từ có thể mang nghĩa tinh sạch, chân thành hoặc thuần khiết. “Tinh sạch” phù hợp với văn cảnh đạo đức và kết hợp tự nhiên với “không chỗ trách được.”
- source_word: ἀπρόσκοποι
  choice: không chỗ trách được
  rationale: Từ này có thể chỉ việc không vấp phạm hoặc không gây cớ vấp phạm. Cách dịch được chọn giữ ý đời sống không đáng bị khiển trách mà không quyết định dứt khoát giữa hai hướng nghĩa.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: vào ngày của Đấng Mê-si-a
  rationale: εἰς hướng đến thời điểm cánh chung; “vào ngày” diễn đạt tự nhiên kết quả được thấy trong ngày ấy. Χριστοῦ được hiểu theo chức danh nên dịch là “Đấng Mê-si-a.”
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm từ cánh chung εἰς ἡμέραν Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn mang giá trị chức danh, vì vậy “Đấng Mê-si-a” làm rõ nghĩa “Đấng được xức dầu.” Cách gọi truyền thống “Đấng Christ” được giữ trong chú thích.
- issue: Phạm vi nghĩa của ἀπρόσκοποι
  choice: không chỗ trách được
  alternative: không vấp phạm / không gây cớ vấp phạm
  rationale: Nguyên ngữ cho phép cả ý không vấp ngã lẫn không làm người khác vấp ngã. Bản dịch chính dùng cách diễn đạt bao quát, còn chú thích ghi rõ sự mơ hồ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμᾶς một cách rõ ràng và gần gũi. Cấu trúc “hầu cho” giữ sắc thái mục đích trang trọng của ἵνα nhưng vẫn quen thuộc với độc giả Kinh Thánh tiếng Việt.
