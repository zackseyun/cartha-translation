- from: Nhưng tiếp tục ở trong xác thịt là điều cần thiết hơn vì anh chị em[a].
  to: Nhưng tiếp tục sống trong thân xác thì cần thiết hơn cho anh chị em[a].
  rationale: Bản sửa thay cách nói không tự nhiên “tiếp tục ở trong xác thịt” bằng “tiếp tục sống trong thân xác,” để phản ánh đúng nghĩa đen theo ngữ cảnh của σάρξ mà không áp đặt sắc thái đạo đức. “Cho anh chị em” làm rõ hướng ích lợi của δι’ ὑμᾶς, còn chú thích bảo tồn phương án sát chữ “xác thịt.”
