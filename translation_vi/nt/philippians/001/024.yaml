  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: vi
  text: Nhưng tiếp tục sống trong thân xác thì cần thiết hơn cho anh chị em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “còn ở trong xác thịt.”
    reason: Nêu cách dịch sát chữ của ἐν τῇ σαρκὶ; trong ngữ cảnh này cụm từ chỉ việc tiếp tục đời sống trong thân xác, không chỉ “bản tính tội lỗi.”
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: tiếp tục ở
  rationale: Động từ nguyên mẫu có mạo từ được dùng như danh từ; cách dịch này diễn đạt việc Phao-lô tiếp tục sống mà vẫn giữ sắc thái kéo dài của ἐπιμένειν.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản với ý trước đó về việc ra đi để ở với Đấng Christ.
- source_word: ἐν τῇ σαρκὶ
  choice: ở trong xác thịt
  rationale: Giữ hình ảnh sát nguyên văn về đời sống trần thế trong thân xác; ở đây σάρξ không mang nghĩa đạo đức là bản tính tội lỗi.
- source_word: ἀναγκαιότερον
  choice: cần thiết hơn
  rationale: Giữ nguyên dạng so sánh của từ Hy Lạp và diễn đạt tự nhiên trong tiếng Việt.
- source_word: δι’ ὑμᾶς
  choice: vì anh chị em
  rationale: Diễn đạt ngắn gọn ý rằng việc Phao-lô tiếp tục sống là do nhu cầu và ích lợi của cộng đồng tín hữu, đồng thời không loại bỏ hoàn toàn sắc thái nguyên nhân của διά.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong câu này
  choice: đời sống trần thế trong thân xác (“ở trong xác thịt”)
  alternative: “trong thân thể”; hoặc diễn giải “tiếp tục sống trên đời”
  rationale: Ngữ cảnh đối chiếu việc Phao-lô ra đi để ở với Đấng Christ và việc ông tiếp tục cuộc sống hiện tại vì các tín hữu Phi-líp. Hiểu theo nghĩa “bản tính tội lỗi” sẽ đưa vào câu một sắc thái đạo đức không được ngữ cảnh hỗ trợ.
- issue: Sắc thái của δι’ ὑμᾶς
  choice: “vì anh chị em”
  alternative: “cho anh chị em” hoặc “vì lợi ích của anh chị em”
  rationale: Cụm Hy Lạp có thể nhấn mạnh nguyên nhân hoặc ích lợi. Bản dịch ngắn gọn giữ được một phần độ rộng ấy, còn chú thích làm rõ nghĩa theo văn cảnh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh chị em” để gọi chung cộng đồng tín hữu. Giữ “xác thịt” trong chính văn nhằm bảo tồn hình ảnh của nguyên ngữ, đồng thời dùng chú thích để ngăn cách hiểu sai theo nghĩa đạo đức.
