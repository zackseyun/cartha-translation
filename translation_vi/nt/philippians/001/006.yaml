id: PHP.1.6
reference: Philippians 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: vi
  text: 'Tôi tin chắc chính điều này: Đấng đã khởi làm một công việc tốt lành giữa anh chị em[a] sẽ hoàn tất công việc ấy cho đến[c] ngày của Đấng Mê-si-a Giê-su[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách gọi truyền thống: “Đấng Christ Giê-su.”'
    reason: lexical_alternative
  - marker: c
    text: 'Một cách diễn đạt khác: “vào ngày.”'
    reason: previous_rendering
lexical_decisions:
- source_word: πεποιθὼς
  choice: Tôi tin chắc
  rationale: Phân từ này gắn với chủ thể ngôi thứ nhất là Phao-lô trong văn cảnh; chuyển thành mệnh đề hữu hạn giúp câu tiếng Việt tự nhiên mà vẫn giữ ý xác tín.
- source_word: αὐτὸ τοῦτο
  choice: chính điều này
  rationale: Giữ sắc thái nhấn mạnh của cụm đại từ chỉ định mà không quá sát chữ.
- source_word: ὁ ἐναρξάμενος
  choice: Đấng đã khởi làm
  rationale: Diễn đạt chủ thể có ngôi vị, được hiểu ngầm là Đức Chúa Trời, nhưng không tự ý thêm danh xưng không có trong câu Hy Lạp.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Đại từ số nhiều hướng đến cả cộng đồng Phi-líp; “giữa anh chị em” làm rõ chiều kích cộng đồng, trong khi “trong anh chị em” vẫn là khả năng từ vựng và được ghi chú.
- source_word: ἔργον ἀγαθὸν
  choice: một công việc tốt lành
  rationale: Bản dịch trực tiếp, trang trọng và dễ hiểu, không xác định thêm bản chất của công việc.
- source_word: ἐπιτελέσει
  choice: sẽ hoàn tất công việc ấy
  rationale: Diễn đạt rõ việc đưa công việc đã khởi đầu đến chỗ hoàn thành; lặp lại “công việc ấy” để tiếng Việt sáng nghĩa.
- source_word: ἄχρι ἡμέρας
  choice: cho đến ngày
  rationale: Giữ nghĩa giới hạn thời gian tự nhiên nhất của ἄχρι; không đổi thành “vào ngày” trong chính văn vì cách đó xác định thời điểm hoàn tất mạnh hơn hình thức Hy Lạp.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Dịch Χριστός theo nghĩa tước hiệu “Đấng Mê-si-a” thay vì chỉ phiên âm theo truyền thống.
theological_decisions:
- issue: Phạm vi cá nhân hay cộng đồng của công việc Đức Chúa Trời
  choice: Dùng “giữa anh chị em” để làm nổi bật lời nói với toàn thể cộng đồng Phi-líp.
  alternative: “trong anh chị em,” có thể được hiểu theo nghĩa trong từng cá nhân hoặc trong cả cộng đồng.
  rationale: ὑμῖν là số nhiều và bối cảnh thư tín mang tính cộng đồng; cách dịch này không phủ nhận sự áp dụng cho cá nhân nhưng tránh biến câu thành một khẳng định chỉ nói về sự bền đỗ của từng cá nhân.
- issue: Quan hệ thời gian của sự hoàn tất với ngày của Đấng Mê-si-a
  choice: Dùng “cho đến ngày” để giữ giới hạn thời gian trong ἄχρι ἡμέρας.
  alternative: “vào ngày,” nhấn mạnh ngày ấy là đúng thời điểm hoàn tất.
  rationale: Nguyên văn cho phép hiểu công việc tiếp diễn hướng đến ngày ấy nhưng không buộc bản dịch phải giải quyết chính xác tiến trình hoàn tất xảy ra trước hay ngay trong ngày đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có tính cộng đồng. “Anh chị em” diễn đạt tự nhiên đại từ số nhiều trong lời gửi hội thánh; “Đấng” viết hoa phản ánh chủ thể thần linh được hàm ý mà không thêm trực tiếp danh xưng “Đức Chúa Trời” vào chính văn.
