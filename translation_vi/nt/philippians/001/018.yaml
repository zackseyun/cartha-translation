id: PHP.1.18
reference: Philippians 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: vi
  text: Vậy thì sao? Chỉ cần bằng mọi cách, dù giả vờ hay chân thành, Đấng Mê-si-a[a] được rao truyền; về điều này, tôi vui mừng. Nhưng tôi cũng sẽ vui mừng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Phải, tôi sẽ còn vui mừng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Vậy thì sao?
  rationale: Giữ nguyên câu hỏi tu từ ngắn gọn, chuyển sang kết luận của Phao-lô mà không diễn giải quá mức thành “có gì quan trọng đâu?”
- source_word: πλὴν ὅτι
  choice: 'Chỉ có điều này:'
  rationale: 'Diễn đạt sức thu hẹp của cụm từ: bất kể động cơ của người rao giảng, điều tiếp theo mới là điểm Phao-lô nhấn mạnh.'
- source_word: παντὶ τρόπῳ
  choice: bằng mọi cách
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nghĩa bao quát của cụm từ Hy Lạp.
- source_word: προφάσει
  choice: giả ý
  rationale: Chỉ động cơ hoặc vẻ bề ngoài không chân thành mà không thêm các phán đoán cụ thể hơn văn bản.
- source_word: ἀληθείᾳ
  choice: chân thật
  rationale: Giữ sự đối lập ngắn gọn và trực tiếp với “giả ý”.
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Thể hiện Χριστός như một tước hiệu, đồng thời là cách gọi rõ nghĩa và dễ nhận biết trong tiếng Việt hiện đại.
- source_word: καταγγέλλεται
  choice: vẫn được rao truyền
  rationale: Giữ thể bị động và ý công bố công khai; “vẫn” làm rõ rằng sự rao truyền tiếp diễn bất chấp các động cơ trái ngược, vốn đã có trong mạch câu.
- source_word: ἐν τούτῳ
  choice: về điều đó
  rationale: Liên kết niềm vui của Phao-lô với sự kiện Đấng Mê-si-a được rao truyền, theo cách tự nhiên trong tiếng Việt.
- source_word: χαίρω
  choice: tôi vui mừng
  rationale: Giữ sắc thái mạnh và có chiều sâu của động từ chỉ niềm vui.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Phải, tôi sẽ còn vui mừng
  rationale: Diễn đạt tự nhiên sức khẳng định cộng thêm của ἀλλὰ καί và hướng tương lai của χαρήσομαι; “còn” không buộc phải hiểu là niềm vui liên tục không gián đoạn.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh nói về nội dung được rao truyền, từ này mang chức năng tước hiệu. “Đấng Mê-si-a” giữ nghĩa tước hiệu của từ Hy Lạp thay vì làm nó giống tên riêng.
- issue: Đối tượng niềm vui của Phao-lô
  choice: Niềm vui gắn với việc Đấng Mê-si-a được rao truyền
  alternative: Niềm vui bao gồm cả động cơ giả ý của người rao giảng
  rationale: ἐν τούτῳ gần nhất quy chiếu đến sự kiện Đấng Mê-si-a được rao truyền; bản dịch không nói rằng Phao-lô tán thành động cơ giả ý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu ngắn và dễ đọc. “Giả ý” và “chân thật” giữ thế đối xứng của nguyên văn; “rao truyền” phù hợp với hành động công bố công khai. Dấu chấm phẩy giúp tách sự kiện được rao truyền khỏi phản ứng vui mừng của Phao-lô mà vẫn giữ chúng trong cùng một lập luận.
