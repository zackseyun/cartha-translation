  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: vi
  text: được đầy dẫy bông trái của sự công chính[a] nhờ Giê-su, Đấng Mê-si-a[b], nhằm tôn vinh và ca ngợi Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bông trái của sự công lý.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: “Giê-su Christos”; “Đấng Mê-si-a” diễn đạt Christos như một tước hiệu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: được đầy dẫy
  rationale: Phân từ hoàn thành thể bị động diễn tả trạng thái kết quả; cách dịch này giữ sắc thái được làm cho đầy và nối tự nhiên với mệnh đề trước.
- source_word: καρπὸν
  choice: bông trái
  rationale: Giữ hình ảnh ẩn dụ về kết quả đạo đức và thuộc linh; đây là cách nói trang trọng nhưng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Diễn đạt nghĩa chính của δικαιοσύνη trong ngữ cảnh Phao-lô mà không quyết định genitive là phẩm chất, nội dung hay nguồn của bông trái.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: đến qua Chúa Giê-su, Đấng Mê-si-a
  rationale: διά với sở hữu cách chỉ phương tiện hoặc trung gian; “đến qua” cho thấy bông trái tùy thuộc vào Chúa Giê-su. Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si-a”.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: để Đức Chúa Trời được vinh hiển và ca ngợi
  rationale: εἰς biểu thị mục đích hoặc kết quả; cấu trúc tiếng Việt này tự nhiên và giữ hướng quy mọi vinh hiển, lời ca ngợi về Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của “bông trái của sự công chính”
  choice: Giữ nguyên cấu trúc sở hữu rộng nghĩa, chỉ bông trái gắn với sự công chính và đến qua Chúa Giê-su, Đấng Mê-si-a.
  alternative: “bông trái là sự công chính,” “bông trái do sự công chính sinh ra,” hoặc “bông trái được kể là công chính.”
  rationale: Cụm genitive καρπὸν δικαιοσύνης có thể được hiểu theo nhiều quan hệ. Bản dịch không thu hẹp thành một cách giải thích duy nhất.
- issue: Chức năng của Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Christ
  rationale: Giữ nội dung tước hiệu của Χριστός thay vì làm nó trở thành một phần tên riêng không còn nghĩa rõ ràng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “bông trái” để bảo toàn ẩn dụ, “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành phổ biến, và “Đấng Mê-si-a” để làm rõ tước hiệu. Câu là phần tiếp nối cú pháp từ câu trước.
