- from: được đầy dẫy bông trái của sự công chính[a] đến qua Chúa Giê-su, Đấng Mê-si-a[b], để Đức Chúa Trời được vinh hiển và ca ngợi.
  to: được đầy dẫy bông trái của sự công chính[a] nhờ Giê-su, Đấng Mê-si-a[b], nhằm tôn vinh và ca ngợi Đức Chúa Trời.
  rationale: Sửa để loại bỏ tước hiệu “Chúa” không hiện diện trong nguyên văn, thay cách nói không tự nhiên “đến qua” bằng “nhờ,” và diễn đạt mục đích bằng cấu trúc gần sát nguồn hơn. Các chú thích được giữ nguyên, với ký hiệu neo vẫn đặt đúng sau thuật ngữ liên quan.
