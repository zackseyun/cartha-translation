id: PHP.1.14
reference: Philippians 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: vi
  text: Và phần đông anh em[a], nhờ xiềng xích của tôi mà đã trở nên vững tin trong Chúa, càng thêm dám nói về sứ điệp ấy mà không sợ hãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em”; ở đây từ này có lẽ chỉ rộng hơn đến các anh chị em cùng đức tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: phần đông
  rationale: Với mạo từ và sở hữu cách chỉ bộ phận, cụm này nói đến đa số hay phần đông trong nhóm, không chỉ đơn thuần là “nhiều hơn”.
- source_word: ἀδελφῶν
  choice: anh em
  rationale: Từ Hy Lạp ở dạng giống đực số nhiều; “anh em” giữ hình thức ấy, còn chú thích nêu khả năng từ này bao gồm rộng hơn các tín hữu nam và nữ.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách nói đặc trưng của Phao-lô, diễn tả phạm vi hay nền tảng của lòng tin vững vàng.
- source_word: πεποιθότας
  choice: trở nên vững tin
  rationale: Phân từ hoàn thành diễn tả một trạng thái tin chắc hiện tại là kết quả của một tiến trình đã xảy ra.
- source_word: τοῖς δεσμοῖς μου
  choice: nhờ xiềng xích của tôi
  rationale: “Xiềng xích” giữ hình ảnh cụ thể của δεσμοί; “nhờ” diễn tả nguyên nhân, đồng thời cho thấy nghịch lý rằng cảnh tù đày của Phao-lô khiến người khác thêm vững tin.
- source_word: περισσοτέρως
  choice: càng
  rationale: 'Trong mạch câu, “càng” diễn đạt tự nhiên sắc thái gia tăng: họ dám nói hơn nữa vì đã được khích lệ.'
- source_word: τολμᾶν
  choice: dám
  rationale: Cách dịch ngắn gọn và trực tiếp, giữ ý can đảm thực hiện một hành động có thể gặp nguy hiểm.
- source_word: ἀφόβως
  choice: không sợ hãi
  rationale: Diễn đạt rõ nghĩa vắng bóng nỗi sợ, chính xác hơn một từ rộng nghĩa như “mạnh dạn”.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: “Lời” bám sát λόγος và không tự thêm “của Đức Chúa Trời”; “ấy” giúp thể hiện tính xác định của mạo từ và chỉ về sứ điệp đang được nói đến trong văn cảnh.
- source_word: λαλεῖν
  choice: nói
  rationale: Giữ nghĩa thông thường của động từ, không nâng thành “rao giảng” hay “công bố” khi bản Hy Lạp chỉ nói “nói”.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί
  choice: Dùng “anh em” trong chính văn và chú thích rằng từ này có thể bao gồm cả anh chị em cùng đức tin.
  alternative: Dịch ngay trong chính văn là “anh chị em” hoặc “các tín hữu”.
  rationale: Cách chọn này giữ hình thức giống đực số nhiều của tiếng Hy Lạp mà không loại bỏ khả năng từ ngữ được dùng theo nghĩa rộng cho cộng đồng tín hữu gồm cả nam lẫn nữ.
- issue: Nội dung của τὸν λόγον
  choice: Dịch là “lời ấy”, không thêm đối tượng sở hữu.
  alternative: “lời Đức Chúa Trời” hoặc “sứ điệp Tin Mừng”.
  rationale: Trong văn cảnh, “lời” rất có thể là sứ điệp Tin Mừng, nhưng bản văn được cung cấp không có cụm “của Đức Chúa Trời”; cách dịch giữ sự ngắn gọn và không bổ sung điều bản Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ mối liên hệ “trong Chúa” với trạng thái vững tin, còn “nhờ xiềng xích của tôi” được hiểu theo nghĩa nguyên nhân. Cụm “càng dám… mà không sợ hãi” tái hiện cả ý gia tăng lòng can đảm lẫn sự vắng bóng nỗi sợ.
