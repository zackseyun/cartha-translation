revisions:
- from: Nhưng tôi thấy cần phải phái Ép-ba-phô-đích đến với anh chị em. Anh ấy là người anh em, người cùng làm việc và người cùng chiến đấu với tôi; còn đối với anh chị em, anh ấy là sứ giả[a] và là người phục vụ tôi trong lúc thiếu thốn.
  to: Nhưng tôi xét thấy cần phải phái Ép-ba-phô-đích đến với anh chị em. Anh ấy là người anh em, người cùng làm việc và người cùng chiến đấu với tôi; còn đối với anh chị em, anh ấy là sứ giả[a] và là người phục vụ[b] cho nhu cầu của tôi.
  rationale: Sửa “tôi thấy” thành “tôi xét thấy” để thể hiện rõ hơn phán đoán cân nhắc của ἡγησάμην. Sửa phần cuối để “nhu cầu của tôi” bổ nghĩa rõ cho sự phục vụ của Ép-ba-phô-đích, phù hợp với τῆς χρείας μου. Bổ sung chú thích từ vựng có neo [b] cho λειτουργός; không thay đổi nghĩa hay áp đặt cách hiểu chức vụ.
