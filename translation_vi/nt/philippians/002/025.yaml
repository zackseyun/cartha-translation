    rationale: τῆς χρείας μου nghĩa là “nhu cầu của tôi”; λειτουργός được bổ nghĩa là người phục vụ liên hệ đến/cho nhu cầu ấy. Cách sửa làm rõ quan hệ này mà không thêm loại nhu cầu cụ thể.
  - severity: low
    issue: Thiếu chú thích về lựa chọn từ vựng cho λειτουργός so với dấu vết kiểm toán tiếng Anh.
    rationale: Chú thích thay thế “người phục vụ”/“người giúp đỡ” giúp độc giả nhận biết đây không nhất thiết là một chức danh, đồng thời có neo chú thích rõ ràng.
