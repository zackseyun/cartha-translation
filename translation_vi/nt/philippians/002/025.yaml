id: PHP.2.25
reference: Philippians 2:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: vi
  text: Nhưng tôi xét thấy cần phải phái Ép-ba-phô-đích đến với anh chị em. Anh ấy là người anh em, người cùng làm việc và người cùng chiến đấu với tôi; còn đối với anh chị em, anh ấy là sứ giả[a] và là người phục vụ[b] cho nhu cầu của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ đồ”—tức là người được anh chị em sai phái.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “người giúp đỡ cho nhu cầu của tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: cần
  rationale: Diễn đạt điều Phao-lô xét là cần thiết, tự nhiên trong cấu trúc tiếng Việt “thấy cần phải”.
- source_word: ἡγησάμην
  choice: tôi thấy
  rationale: Chuyển tải sự đánh giá có cân nhắc của Phao-lô, không chỉ là một ý nghĩ thoáng qua.
- source_word: πέμψαι
  choice: phái ... đến
  rationale: Giữ nghĩa “sai/phái đi” mà không thêm ý “trở về”, vốn không được nói rõ trong câu này.
- source_word: ἀδελφὸν
  choice: người anh em
  rationale: Giữ hình ảnh gia đình dành cho một người cùng đức tin và phù hợp văn phong Cơ Đốc tiếng Việt.
- source_word: συνεργὸν
  choice: người cùng làm việc
  rationale: Diễn đạt rõ một người cùng cộng tác trong công việc, không thêm đối tượng công việc vốn không được nêu trong câu.
- source_word: συστρατιώτην
  choice: người cùng chiến đấu
  rationale: Giữ nguyên ẩn dụ quân sự của từ Hy Lạp bằng cách diễn đạt tự nhiên, dễ hiểu.
- source_word: ἀπόστολον
  choice: sứ giả
  rationale: Trong ngữ cảnh này, Ép-ba-phô-đích là người được hội chúng Phi-líp phái đến; “sứ giả” giữ nghĩa người được sai đi mà không mặc nhiên gán chức vụ Sứ đồ.
- source_word: λειτουργὸν
  choice: người phục vụ
  rationale: Chỉ người thực hiện sự phục vụ có trách nhiệm; tránh khiến độc giả hiểu là một chức danh giáo hội hiện đại.
- source_word: τῆς χρείας μου
  choice: tôi trong lúc thiếu thốn
  rationale: Diễn đạt tự nhiên việc Ép-ba-phô-đích phục vụ nhằm đáp ứng nhu cầu thực tế của Phao-lô, đồng thời không xác định cụ thể nhu cầu ấy.
theological_decisions:
- issue: ἀπόστολον mang nghĩa chức danh “sứ đồ” hay nghĩa rộng là người được sai phái
  choice: sứ giả
  alternative: sứ đồ—tức là người được anh chị em sai phái
  rationale: Đại từ sở hữu “của anh chị em” và bối cảnh cho thấy đây là người đại diện được hội chúng Phi-líp sai đến, nên “sứ giả” tránh nhập nghĩa chức vụ kỹ thuật nhưng chú thích vẫn bảo tồn khả năng dịch sát hình thức là “sứ đồ”.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν/ὑμᾶς; giữ ba mô tả song song về quan hệ của Ép-ba-phô-đích với Phao-lô và hai mô tả về quan hệ với tín hữu Phi-líp. Dấu chấm tách câu dài để tiếng Việt tự nhiên hơn mà không thay đổi quan hệ cú pháp cơ bản.
