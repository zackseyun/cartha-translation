id: PHP.2.13
reference: Philippians 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: vi
  text: Vì Đức Chúa Trời chính là Đấng đang hành động trong anh chị em, cả về ý muốn lẫn sự hành động, vì điều đẹp lòng Ngài[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cả sự muốn lẫn sự hành động.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo ý tốt lành của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu cơ sở cho lời khuyên ở câu trước và nối câu tự nhiên trong tiếng Việt.
- source_word: ὁ ἐνεργῶν
  choice: chính ... là Đấng đang hành động
  rationale: Diễn đạt phân từ hiện tại có mạo từ như một danh xưng, đồng thời giữ sắc thái hành động đang diễn ra; từ “chính” làm rõ cấu trúc nhấn mạnh mà không thêm một tác nhân mới.
- source_word: ἐν ὑμῖν
  choice: trong anh chị em
  rationale: Giữ giới từ “trong” và đại từ số nhiều, để ngỏ cả chiều kích nơi từng tín hữu lẫn trong cộng đồng.
- source_word: τὸ θέλειν
  choice: muốn
  rationale: Diễn đạt ý chí hay sự muốn một cách tự nhiên, phổ thông, không thu hẹp thành cảm xúc hoặc chỉ thành ước ao.
- source_word: τὸ ἐνεργεῖν
  choice: hành động
  rationale: Giữ ý thực hiện hay hoạt động và tạo sự tương ứng với ἐνεργῶν, nhưng tránh lối nói tiếng Việt thiếu tự nhiên “làm việc trong anh chị em” trong ngữ cảnh này.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: vì điều đẹp lòng Ngài
  rationale: “Vì” giữ được khả năng chỉ mục đích hoặc lợi ích của ὑπέρ; “điều đẹp lòng Ngài” chuyển tải εὐδοκία tự nhiên và quy chiếu về Đức Chúa Trời, nhưng vẫn ghi nhận cách hiểu “theo ý tốt lành của Ngài” trong chú thích.
theological_decisions:
- issue: Hành động của Đức Chúa Trời và ý muốn/hành động của con người
  choice: Giữ cả hai phương diện “vừa muốn vừa hành động” dưới tác động của Đức Chúa Trời.
  alternative: Diễn giải thành “ban cho anh chị em lòng mong muốn và khả năng thực hiện.”
  rationale: Bản Hy Lạp nói Đức Chúa Trời hành động trong người tin cả về sự muốn lẫn sự hành động, nhưng không giải thích cơ chế hay xóa bỏ trách nhiệm của con người; bản dịch giữ nguyên sức căng ấy.
- issue: Quan hệ của ὑπὲρ τῆς εὐδοκίας với hành động của Đức Chúa Trời
  choice: “vì điều đẹp lòng Ngài”
  alternative: “theo ý tốt lành của Ngài”
  rationale: Cách dịch chính ưu tiên sắc thái mục đích/lợi ích tự nhiên của ὑπέρ với sở hữu được suy ra từ chủ ngữ Đức Chúa Trời; chú thích bảo tồn cách hiểu theo chuẩn mực hoặc phù hợp với ý muốn tốt lành của Ngài.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ὑμῖν số nhiều để thể hiện lời nói với cả cộng đồng; “Đức Chúa Trời” và “Ngài” theo lối gọi kính trọng phổ biến. Cấu trúc được giữ tương đối sát nguyên văn nhưng điều chỉnh vừa đủ để câu tiếng Việt tự nhiên.
