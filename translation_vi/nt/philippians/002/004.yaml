  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ cấu trúc phân phối “mỗi người” và thế cân bằng “đừng chỉ... nhưng cũng...”, đồng thời dùng “lợi ích” để diễn đạt tự nhiên các cụm danh hóa rộng nghĩa trong nguyên văn.
