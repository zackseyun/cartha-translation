  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: vi
  text: Mỗi người đừng chỉ quan tâm đến lợi ích của riêng mình,[a] nhưng cũng hãy quan tâm đến lợi ích của người khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Mỗi người đừng nhìn vào những điều của riêng mình, nhưng cũng nhìn vào những điều của người khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: quan tâm đến
  rationale: Động từ này diễn tả việc hướng sự chú ý và lưu tâm đến điều gì. “Quan tâm đến” tự nhiên trong tiếng Việt và phù hợp với lời kêu gọi thực tiễn trong ngữ cảnh.
- source_word: τὰ ἑαυτῶν
  choice: lợi ích của riêng mình
  rationale: Cụm danh hóa số nhiều trung tính có nghĩa rộng hơn của cải, bao gồm những điều thuộc về mình, mối bận tâm và quyền lợi của mình. “Lợi ích” diễn đạt rõ ý hàm ẩn mà không giới hạn vào tài sản.
- source_word: ἕκαστοι
  choice: Mỗi người
  rationale: Dạng phân phối nhấn mạnh từng cá nhân trong cộng đồng; “Mỗi người” truyền đạt trực tiếp và tự nhiên sắc thái ấy.
- source_word: ἀλλὰ καὶ
  choice: đừng chỉ ... nhưng cũng hãy
  rationale: Cấu trúc này kết hợp tương phản với bổ sung. Cách diễn đạt tiếng Việt làm rõ rằng câu không phủ nhận hoàn toàn việc lưu tâm đến điều thuộc về mình, mà yêu cầu cũng lưu tâm đến người khác.
- source_word: τὰ ἑτέρων
  choice: lợi ích của người khác
  rationale: Song song với τὰ ἑαυτῶν, cụm này chỉ rộng rãi những mối quan tâm, quyền lợi hoặc phúc lợi của người khác; “lợi ích của người khác” rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions: []
