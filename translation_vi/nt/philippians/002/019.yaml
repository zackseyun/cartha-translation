id: PHP.2.19
reference: Philippians 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: vi
  text: Nhưng tôi hy vọng trong Chúa Giê-su sẽ sớm sai Ti-mô-thê đến với anh chị em, để chính tôi cũng được phấn chấn khi biết tin về anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: tôi hy vọng
  rationale: Diễn đạt trực tiếp niềm hy vọng hiện tại của Phao-lô; tự nhiên trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: Nhưng
  rationale: Giữ nét chuyển ý nhẹ so với phần trước.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: trong Chúa Giê-su
  rationale: Giữ cách diễn đạt đặc trưng của Phao-lô, đặt niềm hy vọng trong mối liên hệ và sự lệ thuộc vào Chúa Giê-su.
- source_word: Τιμόθεον
  choice: Ti-mô-thê
  rationale: Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: ταχέως
  choice: sớm
  rationale: Chỉ thời điểm dự định sai đi, tự nhiên hơn nghĩa chỉ tốc độ là “nhanh chóng”.
- source_word: πέμψαι ὑμῖν
  choice: sai Ti-mô-thê đến với anh chị em
  rationale: “Sai” phù hợp với việc giao người đi làm nhiệm vụ; “đến với” diễn đạt tự nhiên đích đến của hành động.
- source_word: ἵνα κἀγὼ εὐψυχῶ
  choice: để chính tôi cũng được phấn chấn
  rationale: Giữ mục đích của ἵνα, nét nhấn mạnh của κἀγώ, và nghĩa “có tinh thần tốt/phấn chấn” của εὐψυχέω.
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: khi biết tin về anh chị em
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp chỉ việc biết những điều hay tình hình liên quan đến người nhận, không thu hẹp thành một khía cạnh cụ thể.
theological_decisions:
- issue: Cách dịch κύριος trong ἐν κυρίῳ Ἰησοῦ
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” là danh xưng Cơ Đốc học tự nhiên và đã được xác lập trong tiếng Việt; ngữ cảnh không đòi hỏi đổi sang nghĩa quan hệ xã hội là “chủ”.
- issue: Ý nghĩa của ἐν trong ἐν κυρίῳ Ἰησοῦ
  choice: trong Chúa Giê-su
  alternative: nhờ Chúa Giê-su
  rationale: Bản dịch giữ nguyên độ rộng quan hệ của ἐν, tránh quyết định rằng cụm từ chỉ nói về phương tiện hay tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν nhằm nói rõ cộng đồng người nhận mà không dùng dạng cổ hoặc thiếu tự nhiên. Không thêm chú thích vì bản văn chính đã chuyển tải rõ nghĩa và không có biến thể cần thiết phải ghi.
source_grounding:
  english_pob_role: consult_only
