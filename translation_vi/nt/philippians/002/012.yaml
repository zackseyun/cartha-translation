id: PHP.2.12
reference: Philippians 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: vi
  text: Vậy nên, anh chị em yêu dấu của tôi, như anh chị em vẫn luôn vâng lời—không chỉ khi tôi có mặt, mà nay càng hơn khi tôi vắng mặt—hãy làm cho sự cứu rỗi của chính anh chị em được thể hiện trong đời sống với sự kính sợ và run rẩy[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Làm cho ... được thể hiện trong đời sống” diễn đạt việc đưa sự cứu rỗi đến chỗ có hiệu quả trong đời sống, chứ không có nghĩa là kiếm được sự cứu rỗi.
    reason: alternative_reading
  - marker: b
    text: “Kính sợ và run rẩy” diễn tả lòng tôn kính sâu xa cùng thái độ nghiêm túc, khiêm nhường trước Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Vậy nên
  rationale: Đánh dấu kết luận suy ra từ phần nói về Đấng Christ và lời khuyên trước đó; cách nói tự nhiên mà vẫn giữ quan hệ logic.
- source_word: ἀγαπητοί μου
  choice: những người yêu dấu của tôi
  rationale: Giữ sắc thái xưng hô trìu mến, mục vụ và trang trọng của Phao-lô.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: như anh chị em vẫn luôn vâng lời
  rationale: Diễn đạt một nếp vâng lời đã được xác lập trong quá khứ và vẫn có ý nghĩa cho lời khuyên hiện tại.
- source_word: μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου
  choice: không chỉ khi tôi có mặt, mà nay càng hơn khi tôi vắng mặt
  rationale: Giữ rõ thế đối lập có mặt/vắng mặt và sức nhấn mạnh của πολλῷ μᾶλλον, đồng thời tránh lối diễn đạt gượng trong tiếng Việt.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: với lòng kính sợ và run rẩy
  rationale: Giữ sức nặng và tính hình tượng của thành ngữ Hy Lạp; “kính sợ” phù hợp ngữ cảnh hướng về Đức Chúa Trời mà không làm mất yếu tố sợ hãi nghiêm trang.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: sự cứu rỗi của chính mình
  rationale: Giữ nội dung thần học của σωτηρία và sắc thái nhấn mạnh của đại từ phản thân ἑαυτῶν.
- source_word: κατεργάζεσθε
  choice: hãy thực hiện
  rationale: Diễn đạt việc tích cực đưa sự cứu rỗi vào đời sống và làm cho nó được thể hiện trọn vẹn; tránh hàm ý rõ rệt rằng phải kiếm được sự cứu rỗi.
theological_decisions:
- issue: Ý nghĩa của mệnh lệnh κατεργάζεσθε τὴν ἑαυτῶν σωτηρίαν
  choice: Dịch là “hãy thực hiện sự cứu rỗi của chính mình”, giữ lời kêu gọi chủ động sống và đưa sự cứu rỗi vào thực tế.
  alternative: “Hãy làm nên/đạt được sự cứu rỗi của chính mình”, có thể bị hiểu là tự kiếm sự cứu rỗi bằng công việc.
  rationale: Động từ có thể chỉ việc tạo hiệu quả, hoàn thành hoặc thực hiện. Câu kế tiếp nói Đức Chúa Trời hành động trong họ; bản dịch không xóa bỏ trách nhiệm của con người nhưng cũng không áp đặt cách hiểu rằng họ tự cứu mình.
- issue: Sắc thái của φόβου καὶ τρόμου
  choice: Giữ “kính sợ và run rẩy” như một thái độ nghiêm trang, khiêm nhường trước Đức Chúa Trời.
  alternative: Chỉ là kinh hoàng co rúm, hoặc chỉ là tôn trọng nhẹ nhàng.
  rationale: Cụm từ mang cả sức nặng cảm xúc lẫn sự trang nghiêm. Bản dịch giữ nguyên căng thẳng ấy thay vì làm nhẹ hoặc tuyệt đối hóa thành nỗi khiếp đảm.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu gồm cả nam lẫn nữ; giữ nhịp câu khuyên bảo của nguyên bản và không giải quyết thay cho độc giả sự căng thẳng thần học giữa trách nhiệm con người với hành động của Đức Chúa Trời.
