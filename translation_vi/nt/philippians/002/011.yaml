reference: Philippians 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: vi
  text: và mọi lưỡi đều tuyên xưng rằng Giê-su, Đấng Mê-si-a, là Chúa, để tôn vinh Đức Chúa Trời là Cha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: mọi lưỡi
  rationale: Giữ hình ảnh thân thể trong nguyên văn về lời tuyên xưng phổ quát; cách nói này cũng gợi lại ngôn ngữ Kinh Thánh và vẫn dễ hiểu trong tiếng Việt.
- source_word: ἐξομολογήσηται
  choice: tuyên xưng
  rationale: Diễn đạt hành vi công khai thừa nhận và công bố, mạnh hơn “thừa nhận” nhưng không thêm ý ngoài động từ Hy Lạp.
- source_word: κύριος
  choice: Chúa
  rationale: Là cách dịch tự nhiên, quen thuộc của κύριος trong lời tuyên xưng về Đức Chúa Jêsus, đồng thời giữ âm hưởng từ ngôn ngữ Kinh Thánh mà câu này dựa vào.
- source_word: Ἰησοῦς Χριστός
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Dịch Χριστός như một tước hiệu đang còn giá trị (“Đấng Mê-si-a”), thay vì chỉ phiên âm; dấu phẩy giúp tiếng Việt nhận rõ đây là tước hiệu đồng vị với danh Jêsus.
- source_word: εἰς δόξαν
  choice: để tôn vinh
  rationale: Diễn đạt tự nhiên hướng đích của εἰς trong ngữ cảnh thờ phượng; tránh lối dịch danh hóa kém tự nhiên “đến sự vinh hiển của”.
- source_word: θεοῦ πατρός
  choice: Đức Chúa Trời là Cha
  rationale: Thể hiện tự nhiên quan hệ đồng vị của θεοῦ và πατρός trong tiếng Việt, nhận diện Đức Chúa Trời là Cha mà không biến cụm này thành một quan hệ sở hữu.
theological_decisions:
- issue: Cách dịch Χριστός trong lời tuyên xưng về Đức Chúa Jêsus
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός ở đây vẫn mang chức năng tước hiệu. “Đấng Mê-si-a” chuyển tải ý nghĩa tước hiệu trong tiếng Việt hiện đại mà không đưa thêm một lập trường hệ phái.
- issue: Quan hệ giữa việc Đức Chúa Jêsus là Chúa và sự vinh hiển của Đức Chúa Trời là Cha
  choice: để tôn vinh Đức Chúa Trời là Cha
  alternative: cho vinh quang của Đức Chúa Trời là Cha
  rationale: 'Giữ hướng đích của εἰς δόξαν: lời tuyên xưng quy về sự tôn vinh Đức Chúa Trời là Cha, không diễn giải thêm bản chất quan hệ thần học giữa Cha và Con.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp ngữ cảnh thờ phượng. Giữ “mọi lưỡi” để bảo toàn hình ảnh nguyên văn; dùng “tuyên xưng” cho sắc thái công khai. Câu được dịch như phần tiếp nối cú pháp và mục đích từ câu 10, nên không viết hoa đầu câu.
