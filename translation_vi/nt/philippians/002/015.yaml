id: PHP.2.15
reference: Philippians 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: vi
  text: để anh em trở nên không chỗ trách được và tinh tuyền, là con cái không tì vết của Đức Chúa Trời giữa một thế hệ cong quẹo và lệch lạc,[a] giữa họ, anh em chiếu sáng[b] như những vì sáng[c] trong thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thế hệ cong quẹo và lệch lạc” có lẽ vọng lại Phục Truyền Luật Lệ Ký 32:5, qua đó tương phản con cái của Đức Chúa Trời với một thế hệ hư hỏng.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “anh em hiện ra.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “các thiên thể sáng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: γένησθε
  choice: anh em trở nên
  rationale: Giữ ý nghĩa tiến đến một tình trạng của γίνομαι và sức thúc giục trong mạch văn; đại từ số nhiều phù hợp với cộng đồng được Phao-lô ngỏ lời.
- source_word: ἄμεμπτοι
  choice: không chỗ trách được
  rationale: Diễn đạt phẩm chất đạo đức không có căn cứ chính đáng để bị khiển trách, đồng thời dùng ngôn ngữ hiện đại, dễ hiểu.
- source_word: ἀκέραιοι
  choice: tinh tuyền
  rationale: Chuyển tải ý nguyên vẹn, không pha tạp và ngay thật về đạo đức; phân biệt với ἄμεμπτοι và ἄμωμα.
- source_word: τέκνα θεοῦ
  choice: những người con của Đức Chúa Trời
  rationale: τέκνα chỉ con cái không phân biệt giới tính; cách dịch này vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: ἄμωμα
  choice: không tì vết
  rationale: Giữ hình ảnh về sự không có khuyết tật hay vết nhơ và tránh lặp lại cách dịch của ἄμεμπτοι.
- source_word: μέσον γενεᾶς
  choice: giữa một thế hệ
  rationale: Phản ánh vị trí của các tín hữu ở ngay trong cộng đồng người bao quanh họ.
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: quanh co và bại hoại
  rationale: “Quanh co” giữ hình ảnh lệch khỏi đường ngay; “bại hoại” diễn đạt tình trạng đã bị làm cho sai lạc về đạo đức mà không gắn với một loại tội cụ thể.
- source_word: ἐν οἷς
  choice: giữa họ
  rationale: Hiểu đại từ quan hệ là chỉ những người thuộc “thế hệ” vừa nói đến, thay vì một phạm vi trừu tượng.
- source_word: φαίνεσθε
  choice: anh em chiếu sáng
  rationale: Trong sự kết hợp với φωστῆρες, nghĩa phát sáng là tự nhiên; nghĩa “hiện ra” vẫn được bảo lưu trong chú thích.
- source_word: φωστῆρες
  choice: những nguồn sáng
  rationale: Diễn đạt rộng các vật phát sáng mà không thu hẹp thành riêng các ngôi sao; tự nhiên hơn “các thiên thể” trong câu khuyên nhủ.
- source_word: ἐν κόσμῳ
  choice: trong thế gian
  rationale: κόσμος ở đây thích hợp với thế giới loài người, nơi cộng đồng tín hữu sống và làm chứng, hơn là khái niệm vật lý “vũ trụ”.
theological_decisions:
- issue: Quan hệ của “không tì vết” với “những người con của Đức Chúa Trời” và tiếng vọng Phục Truyền Luật Lệ Ký 32:5
  choice: Đặt “không tì vết” trực tiếp trong cụm “những người con không tì vết của Đức Chúa Trời” và để tiếng vọng giao ước hàm ẩn trong chính văn.
  alternative: Hiểu “không tì vết” là phẩm chất áp dụng rộng cho toàn bộ mệnh đề, hoặc làm rõ tiếng vọng Phục Truyền Luật Lệ Ký ngay trong chính văn.
  rationale: Trật tự Hy Lạp gắn ἄμωμα gần với τέκνα θεοῦ, còn sự đối lập với “thế hệ quanh co và bại hoại” gợi Phục Truyền Luật Lệ Ký 32:5. Bản dịch giữ mối liên hệ ấy nhưng không biến một ám chỉ khả dĩ thành lời giải thích minh nhiên.
- issue: Sắc thái của φαίνεσθε
  choice: chiếu sáng
  alternative: hiện ra như hoặc được thấy như
  rationale: Ngữ cảnh có φωστῆρες ủng hộ sắc thái phát sáng, nhưng động từ cũng có thể chỉ việc xuất hiện; phương án sau được ghi ở chú thích để giữ độ mở ngữ nghĩa.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ chuỗi lập luận dài của nguyên bản Hy Lạp, đồng thời dùng dấu phẩy để làm rõ các cụm bổ nghĩa. “Anh em” được dùng theo lối xưng hô thư tín với toàn thể cộng đồng, không hàm ý chỉ nam giới.
