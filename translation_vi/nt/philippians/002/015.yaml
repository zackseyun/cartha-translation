revisions:
- from: để anh em trở nên không chỗ trách được và tinh tuyền, là những người con không tì vết của Đức Chúa Trời giữa một thế hệ quanh co và bại hoại,[a] giữa họ, anh em chiếu sáng[b] như những nguồn sáng[c] trong thế gian.
  to: để anh em trở nên không chỗ trách được và tinh tuyền, là con cái không tì vết của Đức Chúa Trời giữa một thế hệ cong quẹo và lệch lạc,[a] giữa họ, anh em chiếu sáng[b] như những vì sáng[c] trong thế gian.
  rationale: Sửa hai chỗ để sát hơn với hình ảnh và sự song song của tiếng Hy Lạp, đồng thời làm câu tiếng Việt gọn, tự nhiên hơn. Không thay đổi quan hệ ngữ pháp của «không tì vết» với «con cái của Đức Chúa Trời», cũng không biến tiếng vọng Phục Truyền Luật Lệ Ký thành diễn giải trong chính văn. Các neo chú thích được giữ tại đúng đơn vị từ vựng.
