  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: vi
  text: Anh em hãy có tâm tình này với nhau[a], là tâm tình cũng có nơi Đấng Mê-si-a Giê-su[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh em hãy có tâm tình này với nhau, là tâm tình anh em cũng có trong Đấng Mê-si-a Giê-su.”'
    reason: alternative_reading
  - marker: b
