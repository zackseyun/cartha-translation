    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: tâm tình này
  rationale: Đại từ chỉ định hướng đến tâm tình được trình bày trong các câu tiếp theo; tiếng Việt cần nêu rõ danh từ hàm ẩn để câu tự nhiên.
- source_word: φρονεῖτε
  choice: hãy có tâm tình
  rationale: Động từ φρονέω ở đây chỉ định hướng suy nghĩ và thái độ sống, không chỉ một ý nghĩ riêng lẻ; “hãy có tâm tình” giữ được lực khuyên bảo của mệnh lệnh hiện tại.
- source_word: ἐν ὑμῖν
  choice: với nhau
  rationale: Đại từ số nhiều và văn cảnh cộng đồng trong 2:1–4 cho thấy lời khuyên hướng đến cách các tín hữu đối xử trong cộng đồng; “với nhau” diễn đạt tự nhiên chiều kích ấy.
- source_word: ὃ καὶ ἐν Χριστῷ Ἰησοῦ
  choice: là tâm tình cũng đã có nơi Đấng Mê-si-a Giê-su
  rationale: Cụm Hy Lạp cô đọng và lược động từ. Cách dịch này hiểu Đức Giê-su là mẫu mực của tâm tình sắp được mô tả, đồng thời dùng “nơi” để không xác định quá hẹp sắc thái của ἐν.
- source_word: Χριστῷ
  choice: Đấng Mê-si-a
  rationale: Χριστός mang nghĩa tước hiệu “Đấng được xức dầu”; “Đấng Mê-si-a” thể hiện chức năng tước hiệu thay vì coi đây đơn thuần là tên riêng.
theological_decisions:
- issue: Mệnh đề ὃ καὶ ἐν Χριστῷ Ἰησοῦ nói về tâm tình được thể hiện nơi Đức Giê-su hay tâm tình tín hữu có trong sự hiệp nhất với ngài.
  choice: 'Cách hiểu nêu gương: “là tâm tình cũng đã có nơi Đấng Mê-si-a Giê-su.”'
  alternative: 'Cách hiểu tham dự/hiệp nhất: “là tâm tình anh em cũng có trong Đấng Mê-si-a Giê-su.”'
  rationale: Mạch văn chuyển sang sự tự hạ của Đức Giê-su như mẫu mực cho các tín hữu, nên cách hiểu nêu gương phù hợp hơn. Tuy nhiên, nguyên văn lược động từ và vẫn cho phép cách hiểu về sự hiệp nhất với Đấng Mê-si-a; vì vậy cách hiểu ấy được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tâm tình” bao quát cả lối suy nghĩ lẫn thái độ; “với nhau” làm rõ chiều kích cộng đồng. Cấu trúc mệnh đề quan hệ và dấu phẩy cuối câu được giữ để phản ánh việc câu này dẫn trực tiếp sang phần tiếp theo.
