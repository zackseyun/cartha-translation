id: PHP.2.6
reference: Philippians 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/006.yaml
  text: who[a], though he was in the form of God, did not consider equality with God something to be grasped[c][b],
translation:
  language: vi
  text: Đấng ấy, dù hiện hữu trong hình thể của Đức Chúa Trời[a], đã không xem việc bình đẳng với Đức Chúa Trời[b] là điều để nắm lấy[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang hiện hữu trong hình thể của Đức Chúa Trời.” Từ Hy Lạp có thể được hiểu theo nghĩa nhượng bộ (“dù hiện hữu”) hoặc chỉ trạng thái (“đang hiện hữu”).'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “việc ngang bằng với Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp ở đây có thể được hiểu là “điều để nắm lấy”, “điều để chiếm đoạt”, hoặc “điều để tận dụng cho lợi mình”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς
  choice: Đấng ấy
  rationale: Đại từ quan hệ chỉ về Đấng Christ ở câu trước; “Đấng ấy” vừa nối kết tự nhiên trong tiếng Việt vừa giữ sắc thái tôn kính.
- source_word: ἐν μορφῇ θεοῦ
  choice: trong hình thể của Đức Chúa Trời
  rationale: Giữ tương đối trực tiếp μορφή là “hình thể”, không thu hẹp thành một diễn giải siêu hình như “bản tính”, đồng thời bảo toàn sức nặng Kitô học của cụm từ.
- source_word: ὑπάρχων
  choice: dù hiện hữu
  rationale: “Hiện hữu” phản ánh nghĩa trạng thái của ὑπάρχων, còn “dù” làm rõ lực nhượng bộ phù hợp với sự tương phản dẫn sang câu 7. Cách hiểu đơn thuần là “đang hiện hữu” được ghi ở chú thích.
- source_word: ἡγήσατο
  choice: đã không xem
  rationale: ἡγέομαι mang nghĩa xem, coi hay cho là; “đã không xem” tự nhiên và sát nghĩa trong tiếng Việt hiện đại.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: việc bình đẳng với Đức Chúa Trời
  rationale: Chuyển cấu trúc động từ nguyên mẫu có mạo từ thành danh ngữ tự nhiên trong tiếng Việt, vẫn giữ ý nghĩa bình đẳng của ἴσα.
- source_word: ἁρπαγμὸν
  choice: điều để nắm lấy
  rationale: Giữ hình ảnh và sự mơ hồ của từ Hy Lạp đang được tranh luận, thay vì quyết định hẳn theo nghĩa “điều để tận dụng cho lợi mình”. Chú thích nêu các khả năng chính.
theological_decisions:
- issue: Sức nặng Kitô học của ἐν μορφῇ θεοῦ
  choice: Giữ “trong hình thể của Đức Chúa Trời” trong chính văn.
  alternative: “trong bản tính Đức Chúa Trời” hoặc “vốn là Đức Chúa Trời theo bản tính”
  rationale: Cách dịch giữ cách diễn đạt của Phao-lô và cho phép sức nặng bản thể học của ngữ cảnh, nhưng không thay lời văn bằng thuật ngữ tín lý phát triển về sau.
- issue: Ý nghĩa của ἁρπαγμός liên quan đến sự bình đẳng với Đức Chúa Trời
  choice: Dịch “điều để nắm lấy” và ghi các cách hiểu khác trong chú thích.
  alternative: “điều để chiếm đoạt” hoặc “điều để tận dụng cho lợi mình”
  rationale: 'ἁρπαγμός là một điểm khó thực sự: có thể chỉ việc giành lấy, giữ chặt, hoặc dùng địa vị làm lợi thế. Chính văn giữ hình ảnh gần nguyên ngữ; chú thích bảo toàn các hướng giải thích mà không áp đặt một cách hiểu thần học duy nhất.'
- issue: Lực cú pháp của ὑπάρχων
  choice: Dùng cấu trúc nhượng bộ “dù hiện hữu”.
  alternative: “đang hiện hữu”
  rationale: Mạch văn đối chiếu địa vị của Đấng Christ với hành động tự hạ ở câu 7, nên sắc thái nhượng bộ có cơ sở; tuy nhiên, nguyên ngữ không có liên từ nhượng bộ minh thị, vì vậy cách hiểu trạng thái được ghi chú.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Đấng ấy” xác định chủ thể một cách tự nhiên; “hiện hữu” và “hình thể” giữ sắc thái trang nghiêm và gần nguyên ngữ. Trật tự chú thích đi theo vị trí xuất hiện trong chính văn.
