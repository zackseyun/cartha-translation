  text: Do everything without grumbling or arguing[b][a],
translation:
  language: vi
  text: Hãy làm mọi việc mà không càm ràm hay tranh cãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ được dịch là “tranh cãi” cũng có thể mang nghĩa “tranh luận” hoặc “chất vấn”; trong ngữ cảnh này, nhiều khả năng nó chỉ sự bất đồng mang tính đối kháng.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: mọi việc
  rationale: Dạng đối cách số nhiều của πᾶς có ý nghĩa bao quát; “mọi việc” tự nhiên trong tiếng Việt và giữ nguyên phạm vi toàn diện của mệnh lệnh.
- source_word: ποιεῖτε
  choice: Hãy làm
  rationale: Động từ mệnh lệnh hiện tại diễn tả lời truyền bảo có tính liên tục. “Hãy làm” là cách diễn đạt tự nhiên, rõ ràng và trang trọng vừa phải trong tiếng Việt.
- source_word: χωρὶς
  choice: mà không
  rationale: Trong cấu trúc này, χωρὶς chỉ điều phải vắng khỏi cách hành xử; “mà không” nối tự nhiên với mệnh lệnh ở vế trước.
- source_word: γογγυσμῶν
  choice: càm ràm
  rationale: γογγυσμός chỉ lời than phiền lẩm bẩm. “Càm ràm” dễ hiểu, hiện đại và giữ được sắc thái than phiền dai dẳng, dù sắc thái lẩm bẩm không được diễn đạt hoàn toàn.
- source_word: διαλογισμῶν
  choice: tranh cãi
  rationale: Trong ngữ cảnh khuyên bảo này, từ này có nhiều khả năng chỉ sự tranh luận mang tính đối kháng hơn là suy luận nội tâm. “Tranh cãi” rõ nghĩa và tự nhiên, đồng thời không làm mất hoàn toàn khả năng hiểu là sự chất vấn hay tranh luận.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, dễ hiểu nhưng trang nghiêm. Câu ngắn gọn theo nguyên văn Hy Lạp; dùng “càm ràm” để truyền đạt lời than phiền lẩm bẩm và “tranh cãi” cho διαλογισμῶν, đồng thời ghi chú tính đa nghĩa của từ sau.
