  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: vi
  text: Vậy, tôi hy vọng sẽ cử người ấy đi ngay sau khi tôi biết rõ tình hình của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Vậy, tôi hy vọng sẽ cử người ấy đi ngay khi tôi thấy rõ những việc liên quan đến mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: người ấy
  rationale: Đại từ chỉ định ở đối cách quy chiếu về Ti-mô-thê trong văn cảnh gần; “người ấy” tự nhiên hơn “người này” và vẫn giữ sắc thái quy chiếu.
- source_word: μὲν οὖν
  choice: Vậy
  rationale: Diễn tả bước chuyển mang tính suy luận; “Vậy” gọn, tự nhiên và phù hợp với mạch lập luận tiếng Việt.
- source_word: ἐλπίζω πέμψαι
  choice: tôi hy vọng sẽ sai ... đi
  rationale: Giữ ý hy vọng hoặc trông đợi của ἐλπίζω cùng hành động sai đi của πέμψαι; cách diễn đạt này trang trọng nhưng vẫn thông dụng.
- source_word: ὡς ἂν ἀφίδω
  choice: ngay khi biết rõ
  rationale: Cấu trúc chỉ thời điểm tương lai chưa xác định, tùy thuộc việc Phao-lô nhận biết rõ hoàn cảnh; “ngay khi” cũng phối hợp tự nhiên với ý tức thì của ἐξαυτῆς.
- source_word: ἀφίδω
  choice: biết rõ
  rationale: Trong ngữ cảnh, động từ chỉ việc nhìn ra hoặc xác định rõ tình thế, nên “biết rõ” tự nhiên hơn cách dịch thuần thị giác là “thấy”.
- source_word: τὰ περὶ ἐμέ
  choice: tình hình của tôi
  rationale: Chỉ các sự việc hoặc hoàn cảnh liên quan đến Phao-lô; “tình hình của tôi” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐξαυτῆς
  choice: ngay
  rationale: Diễn tả sự tức thì; được kết hợp vào cụm thời gian “ngay khi” để tránh câu gượng mà vẫn giữ ý hành động mau chóng.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ mạch suy luận, tính bất định về tương lai và ý mau chóng của câu Hy Lạp; chú thích bảo lưu cách diễn đạt sát hình thức hơn của τὰ περὶ ἐμέ.
