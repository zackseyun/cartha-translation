id: PHP.2.21
reference: Philippians 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: vi
  text: Vì tất cả đều tìm lợi ích riêng của mình, chứ không tìm lợi ích của Giê-su, Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Giê-su Christ.”'
    reason: Giữ cách gọi truyền thống trong tiếng Việt như một phương án cho Ἰησοῦ Χριστοῦ, trong khi chính văn làm nổi bật Χριστός là tước hiệu Mê-si-a.
lexical_decisions:
- source_word: οἱ πάντες
  choice: tất cả
  rationale: Cụm danh từ số nhiều có mạo từ chỉ toàn thể những người đang được nói đến. “Tất cả” giữ được trọng tâm tập thể mà không biến câu thành một khẳng định tuyệt đối về mọi người.
- source_word: γὰρ
  choice: vì
  rationale: Từ nối này nêu lý do cho lời khẳng định ở câu trước; “vì” thể hiện rõ quan hệ giải thích.
- source_word: τὰ ἑαυτῶν
  choice: lợi ích riêng của mình
  rationale: Cụm trung tính số nhiều chỉ những gì thuộc về bản thân. Cách dịch này tự nhiên trong tiếng Việt và làm rõ sự tương phản mang tính đạo đức, nhưng không thu hẹp nó vào của cải vật chất.
- source_word: ζητοῦσιν
  choice: tìm
  rationale: “Tìm” giữ nghĩa cơ bản của động từ và dùng tự nhiên cho cả hai vế đối lập. Động từ được lặp lại ở vế sau để câu tiếng Việt rõ nghĩa.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: lợi ích của Giê-su, Đấng Mê-si-a
  rationale: Cụm trung tính số nhiều tỉnh lược được làm rõ bằng cách lặp lại “lợi ích”. Χριστός được chuyển tải như một tước hiệu, còn dấu phẩy giúp tiếng Việt đọc tự nhiên như một danh hiệu giải thích cho Giê-su.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: “Đấng Mê-si-a” biểu đạt ý nghĩa tước hiệu của Χριστός thay vì khiến từ này bị hiểu đơn thuần như một phần của tên riêng. Cách gọi quen thuộc “Đấng Christ” được giữ trong chú thích.
- issue: Phạm vi của τὰ Ἰησοῦ Χριστοῦ
  choice: lợi ích của Giê-su, Đấng Mê-si-a
  alternative: những gì thuộc về Giê-su, Đấng Mê-si-a
  rationale: Cách dịch “lợi ích” duy trì thế đối xứng với τὰ ἑαυτῶν và truyền đạt ý nghĩa theo ngữ cảnh, nhưng không xác định cụ thể những lợi ích ấy là gì.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ phép đối giữa lợi ích riêng và lợi ích của Giê-su; tránh lối diễn đạt cổ như “hết thảy” và không thêm danh xưng “Chúa” vì nguyên văn câu này không có κύριος.
