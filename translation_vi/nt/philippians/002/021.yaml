  terminology: “Đấng Mê-si-a” giữ Χριστός như một tước hiệu thay vì chỉ như thành tố tên riêng. Chú thích “Giê-su Christ” cung cấp phương án truyền thống mà không đưa danh xưng “Chúa” vốn không có trong nguyên văn. Neo chú thích [a] được đặt đúng tại cụm tên-tước hiệu liên quan.
