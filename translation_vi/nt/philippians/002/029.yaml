base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: vi
  text: Vậy, hãy đón tiếp người ấy trong Chúa với tất cả niềm vui, và hãy coi trọng những người như thế[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp ở đây có dạng giống đực số nhiều. Tùy ngữ cảnh, dạng này có thể chỉ những người thuộc loại ấy nói chung; cũng có thể dịch là “những người nam như thế”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: hãy đón tiếp
  rationale: Diễn đạt mệnh lệnh tiếp nhận một cách nồng hậu, tự nhiên hơn cách nói chỉ hàm ý chấp nhận.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với lời giải thích ở các câu trước bằng một từ nối tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτόν
  choice: anh ấy
  rationale: Chỉ Ép-ba-phô-đích, người trước đó được gọi là anh em; cách xưng gọi này gần gũi, phù hợp văn mạch cộng đồng đức tin.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cụm từ cô đọng đặc trưng của Phao-lô và không thu hẹp ý nghĩa quan hệ thuộc linh bằng một lời diễn giải.
- source_word: μετὰ πάσης χαρᾶς
  choice: với niềm vui trọn vẹn
  rationale: Chuyển tải sắc thái đầy đủ của πάσης mà vẫn tự nhiên và trang trọng trong tiếng Việt.
- source_word: τοὺς τοιούτους
  choice: những người như thế
  rationale: Diễn đạt loại người mà Ép-ba-phô-đích là một trường hợp cụ thể, đồng thời giữ cách nói khái quát của nguyên văn.
- source_word: ἐντίμους ἔχετε
  choice: hãy kính trọng
  rationale: Truyền đạt tự nhiên mệnh lệnh coi và đối xử với những người ấy là đáng tôn trọng.
theological_decisions: []
translation_notes:
