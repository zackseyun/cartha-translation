  - severity: low
    issue: Dấu chú thích hiện ở cuối câu thay vì ngay sau cụm từ được chú thích.
    rationale: Chú thích giải thích “những người như thế”/dạng giống đực số nhiều; đặt ký hiệu sát cụm này làm phạm vi chú thích rõ ràng.
  - severity: low
    issue: Cách nói “kính trọng” hơi nghiêng về thái độ tôn kính trực tiếp.
    rationale: ἐντίμους ἔχετε nhấn mạnh việc xem hoặc đối xử với hạng người ấy là đáng trọng; “coi trọng” phản ánh cấu trúc và ý nghĩa này sát hơn.
