id: PHP.2.17
reference: Philippians 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: vi
  text: Nhưng cho dù tôi đang bị đổ ra như một lễ rượu[a] trên sinh tế và việc phụng sự[b] của đức tin của anh chị em[c], tôi vui mừng và cùng vui với tất cả anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang bị đổ ra làm lễ quán.” Đây là hình ảnh rượu được rót ra trong nghi thức dâng tế.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể dịch là “sự phục vụ” hoặc “chức vụ”; trong câu này, từ ấy vẫn mang sắc thái thờ phượng.
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “lòng trung tín”.'
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: tôi đang bị đổ ra như một lễ rượu
  rationale: Giữ thể bị động ở thì hiện tại và hình ảnh một lễ rượu được đổ ra trong nghi thức dâng tế; cách diễn đạt này dễ hiểu hơn thuật ngữ truyền thống “lễ quán” mà không làm mất ẩn dụ tế lễ.
- source_word: ἐπὶ
  choice: trên
  rationale: 'Giữ quan hệ không gian trong hình ảnh tế lễ: Phao-lô được đổ ra trên, hoặc thêm vào, sinh tế và việc phụng sự của tín hữu Phi-líp.'
- source_word: θυσίᾳ
  choice: sinh tế
  rationale: “Sinh tế” giữ rõ trường nghĩa hiến tế và phù hợp với chuỗi hình ảnh thờ phượng trong câu.
- source_word: λειτουργίᾳ
  choice: việc phụng sự
  rationale: “Phụng sự” vừa có thể chỉ sự phục vụ vừa gợi bối cảnh thờ phượng, nhưng không buộc người đọc phải hiểu đây là chức vụ tư tế theo nghĩa chuyên biệt.
- source_word: πίστεως
  choice: đức tin
  rationale: Đây là nghĩa thông thường và thích hợp nhất trong ngữ cảnh; cấu trúc sở hữu được giữ tương đối sát để không quyết định quá mức đức tin là chính sinh tế hay là nguồn sinh ra việc dâng tế và phụng sự.
- source_word: χαίρω
  choice: tôi vẫn vui mừng
  rationale: “Vui mừng” giữ từ ngữ chủ đề về niềm vui trong thư Phi-líp; “vẫn” diễn đạt tự nhiên sự tương phản với khả năng Phao-lô phải đổ mạng sống mình ra.
- source_word: συγχαίρω
  choice: cùng vui
  rationale: Diễn đạt trực tiếp niềm vui được chia sẻ với cộng đồng, đồng thời giữ sự liên hệ từ vựng với χαίρω.
- source_word: πᾶσιν ὑμῖν
  choice: với tất cả anh chị em
  rationale: Giữ sự nhấn mạnh rằng toàn thể cộng đồng đều được bao gồm; “anh chị em” là cách xưng hô tự nhiên, bao quát trong tiếng Việt hiện đại.
theological_decisions:
- issue: Hình ảnh tế lễ nói về khả năng Phao-lô phải chết
  choice: Giữ nguyên chuỗi hình ảnh “bị đổ ra như một lễ rượu trên sinh tế và việc phụng sự”.
  alternative: Diễn giải chung rằng Phao-lô hy sinh mạng sống bên cạnh sự phục vụ của tín hữu Phi-líp.
  rationale: Các từ σπένδομαι, θυσία và λειτουργία cùng tạo nên một hình ảnh thờ phượng mang tính tế lễ rõ rệt; làm phẳng thành ngôn ngữ phục vụ chung sẽ đánh mất sức căng thần học và tu từ của câu.
- issue: Quan hệ của “đức tin” với “sinh tế và việc phụng sự”
  choice: Dùng cấu trúc “sinh tế và việc phụng sự của đức tin anh chị em”, giữ tương đối nguyên tính hàm nghĩa rộng của sở hữu cách Hy Lạp.
  alternative: “Sinh tế và việc phụng sự phát xuất từ đức tin của anh chị em” hoặc “sinh tế là đức tin của anh chị em”.
  rationale: Sở hữu cách τῆς πίστεως ὑμῶν có thể chỉ đức tin như lễ vật, nguồn của sự phụng sự, hoặc phẩm chất trung tín. Bản chính không nên âm thầm khóa câu vào chỉ một quan hệ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Lễ rượu” được chọn thay cho thuật ngữ Hán-Việt ít quen thuộc “lễ quán”; “sinh tế” và “phụng sự” duy trì trường nghĩa tế lễ, thờ phượng. Cách xưng hô “anh chị em” bao quát toàn thể cộng đồng và phù hợp tiếng Việt tiêu chuẩn hiện nay.
