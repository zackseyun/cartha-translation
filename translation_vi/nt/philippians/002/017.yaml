    rationale: τῆς πίστεως ὑμῶν nghĩa là “đức tin của anh chị em.” Trong tiếng Việt hiện đại, việc thêm “của” làm quan hệ sở hữu rõ ràng mà không thu hẹp tính hàm nghĩa của sở hữu cách Hy Lạp.
  - severity: low
    issue: Từ “vẫn” thêm sắc thái không cần thiết.
    rationale: χαίρω đơn giản là “tôi vui mừng.” Sự tương phản đã được biểu đạt bởi “cho dù/ngay cả nếu”; bỏ “vẫn” giúp sát nguyên văn hơn.
