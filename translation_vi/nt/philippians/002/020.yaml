  text: οὐδένα γὰρ ἔχω ἰσόψυχον ὅστις γνησίως τὰ περὶ ὑμῶν μεριμνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/020.yaml
  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: vi
  text: Vì tôi không có ai đồng tâm với tôi[a], là người sẽ thật lòng quan tâm đến những điều liên quan đến anh chị em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng tâm tình”; sát nghĩa hơn: “có tâm hồn ngang bằng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thật lòng chăm lo cho anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối câu này với lời Phao-lô vừa nói về việc sai Ti-mô-thê đến.
- source_word: οὐδένα ... ἔχω
  choice: tôi không có ai
  rationale: Phản ánh trực tiếp cấu trúc Hy Lạp, không tự ý thêm từ “khác”.
- source_word: ἰσόψυχον
  choice: đồng tâm với tôi
  rationale: Diễn đạt tự nhiên ý ‘cùng tâm tình/cùng một lòng’ trong ngữ cảnh Phao-lô nói về Ti-mô-thê; cụm “với tôi” làm rõ quan hệ hàm ẩn mà không biến từ này thành lời so sánh chung chung.
- source_word: ὅστις
  choice: là người
  rationale: Nối tự nhiên với mệnh đề trước và nêu đặc tính của người được nói đến.
- source_word: γνησίως
  choice: thật lòng
  rationale: Thể hiện sự chân thật, thành tâm trong mối quan tâm mục vụ.
- source_word: τὰ περὶ ὑμῶν
  choice: những điều liên quan đến anh chị em
  rationale: Giữ độ rộng và phần nào cấu trúc của nguyên ngữ thay vì thu hẹp hoàn toàn thành ‘phúc lợi’ hay ‘hoàn cảnh’.
- source_word: μεριμνήσει
  choice: sẽ ... quan tâm
  rationale: Trong ngữ cảnh này, động từ chỉ sự chăm lo tích cực chứ không phải lo âu tiêu cực.
theological_decisions:
- issue: Đối tượng so sánh hoặc sự tương hợp trong ἰσόψυχον
  choice: đồng tâm với tôi
  alternative: không có ai như người / cùng tâm tình
  rationale: Ngữ cảnh cho thấy Phao-lô đề cao sự đồng tâm của Ti-mô-thê với chính mình trong việc chăm lo cho tín hữu; cách dịch vẫn giữ sắc thái nội tâm của từ ghép ψυχή.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; giữ cả hai chú thích ngay tại vị trí tương ứng trong câu.
