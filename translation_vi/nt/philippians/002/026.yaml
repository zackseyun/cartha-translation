  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: vi
  text: Vì ông ấy rất mong gặp tất cả anh chị em và vô cùng lo âu vì anh chị em đã nghe tin ông ấy bị bệnh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép: “bởi ông ấy đã nghe rằng anh chị em đã nghe tin ông ấy bị bệnh.”'
    reason: Cách diễn đạt này phản ánh một cách đọc khác có chủ ngữ là Ê-pháp-ra-đi-tô; bản văn SBLGNT đọc ἠκούσατε, “anh chị em đã nghe”.
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Vì
  rationale: Dẫn vào lý do giải thích cho việc gửi Ê-pháp-ra-đi-tô trở về; cách diễn đạt ngắn gọn, tự nhiên và giữ sắc thái nguyên nhân.
- source_word: ἐπιποθῶν ἦν
  choice: vẫn hằng mong nhớ
  rationale: Kết cấu phân từ hiện tại với động từ εἰμί ở thì chưa hoàn thành diễn tả trạng thái kéo dài trong quá khứ; “vẫn hằng mong nhớ” giữ được tính liên tục và tình cảm tha thiết.
- source_word: πάντας ὑμᾶς
  choice: tất cả anh chị em
  rationale: Giữ sự nhấn mạnh bao quát của πάντας và diễn đạt đại từ số nhiều bằng cách tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: ἀδημονῶν
  choice: hết sức lo buồn
  rationale: Diễn tả nỗi bất an, đau buồn sâu sắc chứ không chỉ là quan tâm nhẹ; cách dịch này đủ mạnh mà không cường điệu thành đau đớn thể xác.
- source_word: διότι
  choice: bởi
  rationale: Liên từ nguyên nhân giải thích lý do anh ấy lo buồn; “bởi” tránh lặp “vì” trong cùng câu.
- source_word: ἠκούσατε
  choice: anh chị em đã nghe tin
  rationale: Thì bất định được chuyển tự nhiên bằng “đã nghe”; thêm “tin” phù hợp ngữ cảnh nhận được tin về bệnh tình mà không thay đổi nội dung.
- source_word: ὅτι ἠσθένησεν
  choice: anh ấy bị bệnh
  rationale: ἀσθενέω ở đây chỉ bệnh tật thể chất; “bị bệnh” là cách nói tự nhiên và không buộc phải xác định sắc thái khởi phát có thể có của thì bất định.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” thể hiện ngôi thứ hai số nhiều và phù hợp lời gửi đến cộng đồng; “anh ấy” giữ mạch quy chiếu đến Ê-pháp-ra-đi-tô từ ngữ cảnh trước. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
