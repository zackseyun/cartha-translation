id: PHP.2.3
reference: Philippians 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: vi
  text: Đừng làm điều gì vì tham vọng ích kỷ hay hư danh[a], nhưng hãy khiêm nhường, coi người khác hơn chính mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tự phụ rỗng tuếch” hoặc “vinh quang hão huyền.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “coi người khác quan trọng hơn chính mình” hoặc “coi người khác trổi hơn mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Đừng làm điều gì
  rationale: Diễn đạt tự nhiên lời khuyên ngăn mang tính bao quát trong tiếng Việt, phù hợp với mạch khích lệ của Phao-lô.
- source_word: κατ’ ἐριθείαν
  choice: vì tham vọng ích kỷ
  rationale: Giữ sắc thái động cơ tự lợi, tranh giành và phe phái của ἐριθεία; giới từ “vì” diễn đạt nguyên do thúc đẩy hành động.
- source_word: κατὰ κενοδοξίαν
  choice: hay hư danh
  rationale: “Hư danh” ngắn gọn, tự nhiên và phản ánh ý niệm theo nghĩa đen là “vinh quang rỗng không”, tức sự tự tôn phù phiếm.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: hãy khiêm nhường
  rationale: Chuyển danh từ chỉ thái độ sang cách diễn đạt tự nhiên trong lời khuyên tiếng Việt, vẫn giữ tư thế khiêm nhường làm nền cho hành động tiếp theo.
- source_word: ἀλλήλους ἡγούμενοι
  choice: coi người khác
  rationale: “Coi” diễn đạt rõ hành động đánh giá có chủ ý của ἡγέομαι; “người khác” là cách nói tự nhiên cho quan hệ tương hỗ trong ngữ cảnh cộng đồng.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: hơn chính mình
  rationale: Giữ phép so sánh của ὑπερέχω mà không tự ý xác định đó là sự vượt trội về bản thể, phẩm giá hay năng lực; “chính mình” nhấn mạnh sự đối chiếu với bản thân mỗi người.
theological_decisions:
- issue: Ý nghĩa của việc coi người khác ὑπερέχοντας ἑαυτῶν
  choice: coi người khác hơn chính mình
  alternative: coi người khác quan trọng hơn chính mình; coi người khác trổi hơn mình
  rationale: Bản dịch chính giữ cách nói rộng và sức căng của nguyên văn, không giới hạn sự so sánh vào tầm quan trọng hay khẳng định sự ưu việt tuyệt đối; chú thích nêu các cách hiểu từ vựng khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu mệnh lệnh khuyên nhủ trực tiếp; tránh thuật ngữ giáo phái. “Hư danh” giữ được hình ảnh về thứ vinh quang trống rỗng, còn “hơn chính mình” bảo tồn độ mở của phép so sánh trong nguyên văn.
