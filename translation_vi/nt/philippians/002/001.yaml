id: PHP.2.1
reference: Philippians 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: vi
  text: Vậy, nếu có sự khích lệ nào trong Đấng Mê-si-a, nếu có sự an ủi nào đến từ tình yêu thương, nếu có sự hiệp thông nào của Thánh Linh[a], nếu có lòng trìu mến và thương xót nào,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự dự phần trong Thánh Linh”; ít có khả năng hơn: “sự hiệp thông trong tinh thần.”'
    reason: Bảo lưu sự mơ hồ của κοινωνία πνεύματος về cả quan hệ sở hữu cách lẫn khả năng hiểu πνεῦμα là Thánh Linh hay tinh thần.
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận với phần trước mà không làm câu chuyển ý nặng nề.
- source_word: παράκλησις
  choice: sự khích lệ
  rationale: Trong ngữ cảnh này, từ chỉ sự nâng đỡ và làm vững lòng; “khích lệ” giữ được sắc thái ấy mà không thu hẹp thành lời khuyên răn hay chỉ sự xoa dịu.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si-a
  rationale: Giữ giới từ ἐν là “trong” và thể hiện Χριστός như tước hiệu “Đấng Mê-si-a”, phù hợp với ý nghĩa nguồn ngữ.
- source_word: παραμύθιον
  choice: sự an ủi
  rationale: Từ này nói đến lời nói hay tác động đem lại sự an ủi; cách dịch này cũng phân biệt nó với παράκλησις là “sự khích lệ”.
- source_word: ἀγάπης
  choice: đến từ tình yêu thương
  rationale: 'Diễn đạt sở hữu cách theo nghĩa nguồn phát sinh một cách rõ ràng và tự nhiên: sự an ủi phát xuất từ tình yêu thương.'
- source_word: κοινωνία
  choice: sự hiệp thông
  rationale: Thể hiện chiều kích cùng chia sẻ và gắn kết cộng đồng; quan hệ chính xác với πνεύματος vẫn được giữ mở bằng chú thích.
- source_word: πνεύματος
  choice: của Thánh Linh
  rationale: Trong văn mạch Phao-lô, đây nhiều khả năng là Thánh Linh. Tuy nhiên, cấu trúc sở hữu cách không xác định hoàn toàn quan hệ nên các khả năng khác được nêu trong chú thích.
- source_word: σπλάγχνα
  choice: lòng trìu mến
  rationale: Nghĩa đen liên quan đến nội tạng nhưng được dùng theo thành ngữ để chỉ tình cảm sâu xa, dịu dàng; “lòng trìu mến” tự nhiên và tránh lối nói giải phẫu.
- source_word: οἰκτιρμοί
  choice: thương xót
  rationale: Diễn đạt tự nhiên lòng trắc ẩn và sự cảm thương, đồng thời kết hợp rõ ràng với “lòng trìu mến”.
theological_decisions:
- issue: πνεύματος có chỉ đích danh Thánh Linh hay tinh thần con người, và sở hữu cách đi với κοινωνία nên được hiểu thế nào
  choice: sự hiệp thông của Thánh Linh
  alternative: sự dự phần trong Thánh Linh; ít có khả năng hơn, sự hiệp thông trong tinh thần
  rationale: Chuỗi các thực tại Cơ Đốc và cách dùng quen thuộc của Phao-lô khiến việc hiểu πνεύματος là Thánh Linh có khả năng cao nhất. Tuy vậy, câu Hy Lạp cô đọng và quan hệ sở hữu cách vẫn mơ hồ, nên không loại bỏ các cách hiểu khác mà bảo lưu chúng trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc lặp “nếu có… nào” giữ nhịp tu từ của nguyên văn; dấu phẩy cuối câu phản ánh việc câu tiếp tục sang câu 2.
