id: PHP.2.27
reference: Philippians 2:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: vi
  text: Vì quả thật, ông đã lâm bệnh, gần chết[a]. Nhưng Đức Chúa Trời đã thương xót ông—không chỉ ông mà cả tôi nữa—để tôi khỏi phải chịu nỗi buồn chồng lên nỗi buồn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cận kề cái chết” hoặc “đến mức suýt chết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “nỗi buồn trên nỗi buồn,” một cách nói diễn tả đau buồn chồng chất.'
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: đã lâm bệnh
  rationale: Trong văn cảnh, động từ chỉ bệnh tật thể chất của Ép-ba-phô-đích. “Lâm bệnh” tự nhiên, trang trọng và có thể diễn đạt việc ông mắc bệnh mà không chuyển nghĩa thành sự yếu đuối nói chung.
- source_word: παραπλήσιον θανάτῳ
  choice: gần chết
  rationale: Cụm từ diễn tả tình trạng tiến sát cái chết nhưng chưa chết. “Gần chết” ngắn gọn, tự nhiên và không nói quá mức nguyên ngữ.
- source_word: ἠλέησεν
  choice: đã thương xót
  rationale: “Thương xót” giữ được cả lòng trắc ẩn lẫn sắc thái thần học về lòng thương xót của Đức Chúa Trời, thay vì chỉ diễn đạt cảm xúc thương hại.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: không chỉ ông mà cả tôi nữa
  rationale: Cách diễn đạt này nối rõ với động từ “đã thương xót”, giữ sự tương phản và nhấn mạnh rằng Phao-lô cũng là người nhận lòng thương xót.
- source_word: ἵνα μὴ
  choice: để tôi khỏi phải
  rationale: Diễn đạt tự nhiên lực mục đích của ἵνα cùng kết quả tiêu cực được tránh, không biến mệnh đề thành một lời nhận xét thuần túy về hậu quả.
- source_word: λύπην ἐπὶ λύπην
  choice: nỗi buồn chồng chất nỗi buồn
  rationale: Giữ phép lặp và ý nghĩa cộng dồn của nguyên ngữ, đồng thời là một cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: σχῶ
  choice: phải chịu
  rationale: Trong tiếng Việt, “chịu nỗi buồn” tự nhiên hơn việc dịch sát bằng “có nỗi buồn” và diễn đạt đúng trải nghiệm đau buồn mà không thêm ý nghĩa thần học.
theological_decisions:
- issue: Lòng thương xót của Đức Chúa Trời đối với cả Ép-ba-phô-đích và Phao-lô
  choice: Giữ cùng một động từ “thương xót” làm ý chi phối cả hai đối tượng
  alternative: Diễn giải rằng Đức Chúa Trời chữa lành Ép-ba-phô-đích và an ủi Phao-lô
  rationale: Nguyên văn chỉ nói Đức Chúa Trời thương xót cả hai, không trực tiếp xác định phương thức hay xây dựng một giáo lý chung về chữa lành; vì vậy bản dịch không bổ sung cách giải thích ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Trời” theo quy ước danh xưng của bản dịch; đại từ “ông” phù hợp khi Phao-lô nói về Ép-ba-phô-đích. Dấu gạch ngang làm rõ rằng lòng thương xót được áp dụng cho cả ông ấy lẫn Phao-lô.
