revisions:
- from: Thật vậy, ông đã lâm bệnh, gần chết[a]. Nhưng Đức Chúa Trời đã thương xót ông—không chỉ ông mà cả tôi nữa—để tôi khỏi phải chịu nỗi buồn chồng chất nỗi buồn.[b]
  to: Vì quả thật, ông đã lâm bệnh, gần chết[a]. Nhưng Đức Chúa Trời đã thương xót ông—không chỉ ông mà cả tôi nữa—để tôi khỏi phải chịu nỗi buồn chồng lên nỗi buồn[b].
  rationale: Bản sửa giữ nguyên nghĩa và cấu trúc trọng yếu của câu, đồng thời chuyển rõ γάρ bằng «Vì», làm tự nhiên cách diễn đạt thành ngữ tích lũy «nỗi buồn chồng lên nỗi buồn», và thay phương án chú thích «đến mức gần chết» bằng «đến mức suýt chết» để tránh lặp nghĩa không tự nhiên.
