  - severity: low
    issue: Cách nói «nỗi buồn chồng chất nỗi buồn» hơi gượng.
    rationale: Cụm này thiếu từ nối tự nhiên trong tiếng Việt. «Nỗi buồn chồng lên nỗi buồn» giữ phép lặp của λύπην ἐπὶ λύπην và diễn đạt rõ ý đau buồn gia tăng.
