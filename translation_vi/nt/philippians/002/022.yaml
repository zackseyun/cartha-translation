  rationale: Thay “đã được thử nghiệm” bằng “đã được kiểm chứng” để phản ánh chính xác hơn δοκιμή là phẩm chất đã được chứng tỏ qua thử thách. Điều chỉnh vị trí cụm so sánh cho sát trình tự và liên hệ cú pháp của nguyên văn; sửa chú thích b để không thêm yếu tố không có trong tiếng Hy Lạp.
