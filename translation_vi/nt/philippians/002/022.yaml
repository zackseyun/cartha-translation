  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: vi
  text: 'Nhưng anh chị em biết phẩm chất đã được kiểm chứng của anh ấy[a]: như con với cha[b], anh ấy đã cùng phục vụ với tôi vì Tin Mừng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giá trị đã được chứng minh”; từ này chỉ phẩm chất được tỏ ra là chân thật qua thử thách.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “như con với cha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Giữ sắc thái chuyển ý hoặc tương phản nhẹ với câu trước.
- source_word: τὴν δοκιμὴν αὐτοῦ
  choice: phẩm chất đã được thử nghiệm của anh ấy
  rationale: Diễn đạt phẩm chất của Ti-mô-thê đã được kiểm chứng qua thử thách, thay vì chỉ nói đến một sự kiểm tra trừu tượng.
- source_word: γινώσκετε
  choice: anh chị em biết
  rationale: Thể hiện sự hiểu biết sẵn có của tín hữu Phi-líp về Ti-mô-thê; đại từ bao hàm cộng đồng gồm cả nam lẫn nữ.
- source_word: ὅτι
  choice: ':'
  rationale: Dấu hai chấm tự nhiên dẫn vào nội dung cụ thể mà họ biết, không buộc ὅτι mang nghĩa nguyên nhân.
- source_word: ὡς πατρὶ τέκνον
  choice: như con với cha
  rationale: Giữ phép so sánh và từ τέκνον không xác định giới tính; tránh thêm đại từ sở hữu không có trong nguyên văn.
- source_word: σὺν ἐμοὶ ἐδούλευσεν
  choice: anh ấy đã cùng phục vụ với tôi
  rationale: Giữ rõ sự cộng tác với Phao-lô và dịch động từ theo nghĩa phục vụ trong bối cảnh sứ vụ.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: vì Tin Mừng
  rationale: Diễn đạt hướng đích và mục đích của sự phục vụ một cách gọn, tự nhiên.
theological_decisions:
- issue: Mối quan hệ giữa hình ảnh cha-con và việc phục vụ
  choice: Giữ cả sự phục vụ cùng Phao-lô lẫn phép so sánh “như con với cha”.
  alternative: Diễn giải rằng Ti-mô-thê phục vụ Phao-lô như con phục vụ cha.
  rationale: Cú pháp nói Ti-mô-thê phục vụ cùng Phao-lô vì Tin Mừng; hình ảnh gia đình mô tả cách họ cộng tác, không biến Phao-lô thành đối tượng được phục vụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều γινώσκετε và “anh ấy” để chỉ Ti-mô-thê; viết hoa “Tin Mừng” theo lối dùng phổ biến trong tiếng Việt Cơ Đốc.
