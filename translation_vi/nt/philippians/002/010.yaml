  text: ἵνα ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/010.yaml
  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: vi
  text: để mọi đầu gối của các hữu thể trên trời, trên đất và dưới đất đều quỳ xuống trước danh Đức Giê-su[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong danh Đức Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn tả mục đích hoặc kết quả phát xuất từ mệnh đề trước, tự nhiên và gọn trong tiếng Việt.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: trước danh Đức Giê-su
  rationale: Trong ngữ cảnh quỳ gối tôn kính, “trước danh” diễn tả sự đáp ứng trước địa vị và danh dự của Đức Giê-su; chú thích giữ lại khả năng dịch sát cấu trúc là “trong danh”.
- source_word: πᾶν γόνυ
  choice: mọi đầu gối
  rationale: Giữ nguyên hình ảnh thân thể sống động về sự quy phục phổ quát, thay vì diễn giải thành “mọi người”.
- source_word: κάμψῃ
  choice: đều quỳ xuống
  rationale: Thể hiện hành động cúi gối trong sự tôn kính; “đều” phối hợp với “mọi” để truyền đạt phạm vi phổ quát mà không thêm ý nghĩa bắt buộc vốn không được nêu rõ.
- source_word: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: của những loài ở trên trời, trên đất và bên dưới đất
  rationale: Phản ánh các tính từ sở hữu được dùng như danh từ, đồng thời giữ ba phạm vi vũ trụ và tránh xác định quá mức đó là thiên sứ, con người, người chết hay quỷ.
theological_decisions:
- issue: Phạm vi của cụm ba thành phần ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: 'Giữ phạm vi phổ quát của các loài thuộc ba cõi: trên trời, trên đất và bên dưới đất, nhưng không xác định cụ thể căn tính của từng nhóm.'
  alternative: Nêu rõ là thiên sứ, loài người và người chết hoặc ma quỷ.
  rationale: Bản Hy Lạp nhấn mạnh sự quy phục mang tầm vũ trụ nhưng không trực tiếp đồng nhất từng nhóm; bản dịch không nên đưa thêm cách giải thích thần học riêng.
- issue: Sắc thái của ἐν τῷ ὀνόματι Ἰησοῦ
  choice: “trước danh Đức Giê-su,” hiểu là quỳ gối đáp lại danh vị và sự tôn quý của Ngài.
  alternative: “trong danh Đức Giê-su,” có thể được hiểu theo nghĩa phạm vi, sự hiệp thông, thẩm quyền hoặc đại diện.
  rationale: Ngữ cảnh hành động quỳ gối nghiêng về sự tôn kính trước danh Đức Giê-su, nhưng giới từ ἐν vẫn có độ rộng nghĩa nên phương án sát chữ được giữ trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Đức Giê-su” thể hiện sự tôn kính mà không lệ thuộc cách phiên âm riêng của một hệ phái. Cấu trúc câu giữ hình ảnh “mọi đầu gối” và mối quan hệ sở hữu trong nguyên văn, đồng thời dùng “những loài” để bao quát các hữu thể mà không giải thích quá mức.
