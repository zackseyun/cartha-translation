review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng mệnh đề mục đích, hình ảnh “mọi đầu gối,” hành động quỳ, và phạm vi ba tầng vũ trụ. Tuy nhiên, “những loài” không phù hợp với các tính từ được danh từ hóa trong tiếng Hy Lạp, vì dễ chỉ các loài/sinh vật theo nghĩa phân loại thay vì các hữu thể thuộc những phạm vi ấy. “Các hữu thể” phản ánh trung tính hơn mà không định danh họ là thiên sứ, người sống, người chết hay quỷ.
  naturalness: Cụm “mọi đầu gối của những loài ... đều quỳ xuống” nặng và “những loài” không tự nhiên trong văn cảnh tôn kính. Đưa cụm chỉ các hữu thể lên gần “đầu gối” và đặt “trước danh Đức Giê-su” sau động từ tạo câu tiếng Việt trang trọng, rõ ràng hơn.
  terminology: Giữ “Đức Giê-su,” “danh,” “mọi đầu gối,” và “quỳ xuống” là thích hợp với văn phong Kinh Thánh hiện đại. Thay “những loài” bằng “các hữu thể” tránh thu hẹp hoặc gợi một phân loại sinh học không có trong nguyên văn.
  issues:
  - severity: medium
    issue: “những loài” dịch các từ ἐπουρανίων, ἐπιγείων, καταχθονίων
    rationale: Ba tính từ sở hữu được dùng như danh từ chỉ các hữu thể/những kẻ thuộc các lĩnh vực tương ứng. “Loài” trong tiếng Việt thường gợi species hoặc chủng loại, vừa kém tự nhiên vừa có thể làm lệch phạm vi các chủ thể quỳ gối.
  - severity: low
    issue: Trật tự cụm “trước danh Đức Giê-su”
    rationale: Không sai nghĩa, nhưng đặt cụm này sau “quỳ xuống” cho kết cấu Việt ngữ trôi chảy hơn, vẫn bảo toàn cách hiểu thành ngữ của ἐν τῷ ὀνόματι Ἰησοῦ.
