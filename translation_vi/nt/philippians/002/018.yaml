  text: τὸ δὲ αὐτὸ καὶ ὑμεῖς χαίρετε καὶ συγχαίρετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/018.yaml
  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: vi
  text: Cũng vậy, anh chị em hãy vui mừng và cùng vui với tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: Cũng vậy
  rationale: Cụm τὸ αὐτό được dùng theo nghĩa trạng từ và nối lời kêu gọi này với niềm vui được nói đến ngay trước đó. “Cũng vậy” tự nhiên, ngắn gọn và giữ được sắc thái hồi chỉ.
- source_word: χαίρετε
  choice: hãy vui mừng
  rationale: Động từ mệnh lệnh hiện tại số nhiều diễn tả lời kêu gọi vui mừng; cách dịch này giữ động lực của động từ và chủ đề niềm vui xuyên suốt thư Phi-líp.
- source_word: συγχαίρετέ
  choice: cùng vui
  rationale: Động từ ghép chỉ việc chung hưởng niềm vui với một người khác. “Cùng vui” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn thể hiện rõ tính chia sẻ.
- source_word: μοι
  choice: với tôi
  rationale: Đại từ ở cách dữ xác định Phao-lô là người mà các tín hữu Phi-líp được kêu gọi cùng chung niềm vui.
