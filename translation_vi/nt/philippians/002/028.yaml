  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: vi
  text: Vì vậy, tôi càng tha thiết phái anh ấy đi, để khi thấy lại anh ấy, anh chị em vui mừng, và tôi cũng bớt buồn phiền.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: càng sốt sắng
  rationale: Trạng từ so sánh diễn tả mức độ sốt sắng, khẩn thiết gia tăng; “càng sốt sắng” tự nhiên trong tiếng Việt và giữ được lực so sánh.
- source_word: οὖν
  choice: Vì thế
  rationale: Nêu kết luận hoặc sự tiếp nối hợp lý từ phần trình bày trước.
- source_word: ἔπεμψα
  choice: tôi ... sai ... đi
  rationale: Động từ aorist được diễn đạt bằng hành động quá khứ theo mạch thư; “sai ... đi” phù hợp với việc cử Ép-ba-phô-đích trở về.
- source_word: ἵνα
  choice: để
  rationale: Giữ rõ ý nghĩa mục đích bằng cách diễn đạt tự nhiên, gọn trong tiếng Việt.
- source_word: ἰδόντες
  choice: khi gặp lại
  rationale: Phân từ aorist chỉ hoàn cảnh đi kèm trong mệnh đề mục đích. Trong ngữ cảnh con người đoàn tụ, “gặp lại” tự nhiên hơn “thấy lại” mà vẫn phản ánh hành động nhìn thấy người ấy.
- source_word: πάλιν
  choice: lại
  rationale: Được kết hợp tự nhiên trong “gặp lại,” diễn tả việc họ được gặp người ấy một lần nữa.
- source_word: χαρῆτε
  choice: anh chị em vui mừng
  rationale: Giữ sắc thái vui mừng đặc trưng của χαίρω và hình thái mục đích dưới ἵνα; đại từ số nhiều được làm rõ bằng “anh chị em.”
- source_word: κἀγὼ
  choice: còn tôi cũng
  rationale: Crasis của καὶ ἐγώ. “Còn tôi cũng” thể hiện sự phối hợp và đối chiếu nhẹ giữa niềm vui của người nhận thư với việc Phao-lô bớt buồn.
- source_word: ἀλυπότερος
  choice: bớt buồn
  rationale: Giữ lực so sánh “ít buồn hơn” bằng lối nói hiện đại, tự nhiên; không thu hẹp nghĩa thành lo âu.
- source_word: ὦ
  choice: tôi ... bớt buồn
  rationale: Động từ hiện tại giả định εἰμί được diễn đạt tự nhiên trong tiếng Việt qua vị ngữ trạng thái, không cần dịch riêng “là/ở.”
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để biểu thị ngôi thứ hai số nhiều của cộng đồng tín hữu; giữ mối liên kết lập luận bằng “Vì thế” và không giải thích thêm nguyên nhân nỗi buồn của Phao-lô.
