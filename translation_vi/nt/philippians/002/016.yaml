  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: vi
  text: hãy giữ chặt lời sự sống[a], để đến ngày của Đấng Mê-si[b], tôi có điều để tự hào, vì tôi đã không chạy uổng công, cũng không nhọc nhằn vô ích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy đưa lời sự sống ra” hoặc “hãy trưng lời sự sống ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cách dịch truyền thống: “ngày của Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: lời sự sống
  rationale: Giữ cấu trúc cô đọng của tiếng Hy Lạp, có thể chỉ cả lời ban sự sống lẫn lời nói về sự sống.
- source_word: ἐπέχοντες
  choice: hãy giữ chặt
  rationale: Động từ có thể mang nghĩa giữ chặt hoặc đưa ra. Trong mạch văn khuyên tín hữu vâng phục và đứng vững, “giữ chặt” phù hợp hơn; nghĩa công bố/trao ra được giữ trong chú thích.
- source_word: καύχημα
  choice: điều tự hào
  rationale: Diễn đạt tự nhiên đối tượng hoặc cơ sở để Phao-lô tự hào, không hàm ý khoe khoang sai trái.
- source_word: ἡμέραν Χριστοῦ
  choice: ngày của Đấng Mê-si
  rationale: Χριστός mang sắc thái tước hiệu trong cụm từ cánh chung này; “Đấng Mê-si” bảo tồn ý nghĩa ấy.
- source_word: οὐκ εἰς κενὸν
  choice: không ... uổng công / không ... vô ích
  rationale: Hai cách diễn đạt tiếng Việt tự nhiên bảo tồn phép song hành và ý nghĩa không luống công, không mất mục đích.
- source_word: ἔδραμον
  choice: tôi đã không chạy uổng công
  rationale: Giữ nguyên ẩn dụ chạy đua về hành trình phục vụ của Phao-lô.
- source_word: ἐκοπίασα
  choice: cũng không nhọc nhằn vô ích
  rationale: “Nhọc nhằn” thể hiện sức lao động vất vả được nhấn mạnh bởi κοπιάω.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm từ chỉ ngày cánh chung
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn có lực của một tước hiệu mang tính vương quyền và cánh chung, nên dùng “Đấng Mê-si”; cách dịch truyền thống được ghi ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “hãy giữ chặt” để câu đứng tự nhiên trong mạch khuyên bảo bắt đầu từ câu trước; giữ hai hình ảnh “chạy” và “nhọc nhằn,” đồng thời dùng hai thành ngữ gần nghĩa để tránh câu văn gượng ép.
