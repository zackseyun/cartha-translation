  source_fidelity: Bản dịch phản ánh đúng mệnh lệnh πληρώσατε và chuỗi bốn diễn tả về sự hiệp nhất. “Đồng tâm” là cách dịch gọn, phù hợp cho σύμψυχοι; hai lần dùng “suy nghĩ/nghĩ” cũng duy trì được phép lặp của φρονέω mà không áp đặt sự đồng nhất tuyệt đối.
  naturalness: Câu văn tự nhiên, trang trọng và hiện đại. Cách xưng gọi “anh chị em” thích hợp với ngôi số nhiều trong ngữ cảnh thư tín.
  terminology: “Tình yêu thương” phù hợp với ἀγάπη. Tuy nhiên, “tâm linh” trong chú thích tiếng Việt hiện đại thường chỉ lĩnh vực/kinh nghiệm thuộc linh, không phải nghĩa thông thường của ψυχή trong σύμψυχοι; nên thay bằng một cách diễn đạt về sự một lòng hoặc tâm hồn.
