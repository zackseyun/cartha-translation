  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: vi
  text: hãy làm cho niềm vui của tôi được trọn vẹn, để anh chị em cùng chung một suy nghĩ, có cùng một tình yêu thương, đồng tâm[a], cùng nghĩ đến một điều[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng một tâm hồn” hoặc “một lòng một dạ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cùng hướng về một mục đích.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: hãy làm cho niềm vui của tôi được trọn vẹn
  rationale: Diễn đạt mệnh lệnh làm cho niềm vui của Phao-lô đạt đến mức đầy trọn, vừa giữ hình ảnh về sự trọn đầy vừa tự nhiên trong tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: Giữ sắc thái mục đích hoặc kết quả dự định của lời kêu gọi mà không buộc phải phân định cứng giữa hai nghĩa.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: anh chị em cùng chung một suy nghĩ
  rationale: φρονέω chỉ cách suy nghĩ hoặc tâm hướng, không chỉ một ý nghĩ thoáng qua. Cách dịch này truyền đạt lời kêu gọi hiệp nhất mà không hàm ý phải đồng nhất trong mọi chi tiết.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: có cùng một tình yêu thương
  rationale: Giữ cấu trúc phân từ và dịch ἀγάπη bằng cách nói thông dụng, trang trọng trong tiếng Việt hiện đại.
- source_word: σύμψυχοι
  choice: đồng tâm
  rationale: Từ Hy Lạp ghép ý niệm 'cùng' và 'tâm hồn/sinh khí'. 'Đồng tâm' ngắn gọn, tự nhiên và biểu đạt sự hiệp nhất sâu xa bên trong.
- source_word: τὸ ἓν φρονοῦντες
  choice: cùng nghĩ đến một điều
  rationale: Giữ sự lặp lại của φρονέω qua động từ 'nghĩ' và giữ cách nói mở của nguyên văn thay vì thu hẹp thành một mục tiêu cụ thể.
theological_decisions:
- issue: Mức độ hiệp nhất được hàm ý trong hai lần dùng φρονέω
  choice: cùng chung một suy nghĩ … cùng nghĩ đến một điều
  alternative: cùng một tâm trí … cùng hướng về một mục đích
  rationale: Bản dịch giữ phép lặp và sức nhấn của nguyên văn nhưng không biến lời kêu gọi hiệp nhất thành đòi hỏi đồng nhất tuyệt đối hoặc tự ý giới hạn nó vào một mục đích duy nhất.
- issue: Sắc thái của σύμψυχοι
  choice: đồng tâm
  alternative: cùng một tâm hồn; hiệp nhất trong tâm linh
  rationale: ‘Đồng tâm’ bảo toàn ý hiệp nhất nội tâm mà không quyết định ‘ψυχή’ ở đây là một thành phần nhân học riêng biệt hay đồng nhất nó với ‘thần linh’.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để thể hiện ngôi thứ hai số nhiều được hàm chứa trong động từ Hy Lạp. Nhịp câu giữ chuỗi diễn đạt song song của nguyên văn và lặp từ “nghĩ” để phản ánh hai lần xuất hiện của φρονέω.
