revisions:
- from: Ngài đã tự hạ mình, trở nên vâng phục cho đến chết[a]—thậm chí chết trên thập tự giá.[b]
  to: Ngài đã tự hạ mình, trở nên vâng phục cho đến chết[a]—thậm chí chết trên thập tự giá.[b]
  rationale: Giữ nguyên câu dịch vì câu này trung thành và tự nhiên. Chỉ chỉnh các chú thích để không thêm ý «phải» vào μέχρι θανάτου và để mô tả chính xác hơn cấu trúc lặp, tăng cấp của θανάτου δὲ σταυροῦ.
  reviewer_model: gpt-5.6-terra
