  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: vi
  text: Ngài đã tự hạ mình, trở nên vâng phục cho đến chết[a]—thậm chí chết trên thập tự giá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vâng phục cho đến tận cái chết”; cụm từ cho biết sự vâng phục của Ngài kéo dài đến chính cái chết.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát cấu trúc: “cái chết, lại là cái chết của thập tự giá”; ý nghĩa được diễn đạt tự nhiên là: “thậm chí chết trên thập tự giá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: đã tự hạ mình
  rationale: Diễn đạt chủ động và tự nguyện của hành động hạ mình bằng tiếng Việt hiện đại, trang trọng; kết hợp trực tiếp với đại từ phản thân ἑαυτόν.
- source_word: ἑαυτὸν
  choice: tự ... mình
  rationale: Giữ rõ sắc thái phản thân, nhấn mạnh chính Ngài chủ động hạ mình.
- source_word: γενόμενος
  choice: trở nên
  rationale: Giữ liên hệ phân từ với mệnh đề chính mà không ấn định quá mức quan hệ thời gian hay phương tiện.
- source_word: ὑπήκοος
  choice: vâng phục
  rationale: Là cách diễn đạt tự nhiên, rõ nghĩa cho trạng thái tuân phục trong ngữ cảnh này.
- source_word: μέχρι θανάτου
  choice: cho đến chết
  rationale: 'Giữ phạm vi tận cùng của sự vâng phục: kéo dài đến chính cái chết; câu gọn và tự nhiên trong tiếng Việt.'
- source_word: δὲ
  choice: thậm chí
  rationale: Trong cấu trúc lặp lại θανάτου, từ nối có tác dụng tăng cấp, nhấn mạnh loại cái chết gây kinh hoàng được nêu tiếp theo.
- source_word: σταυροῦ
  choice: trên thập tự giá
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu cô đọng θανάτου ... σταυροῦ, giữ hình ảnh cụ thể của cái chết do đóng đinh.
theological_decisions:
- issue: Sắc thái của θανάτου δὲ σταυροῦ
  choice: 'Hiểu là sự tăng cấp nhấn mạnh: “thậm chí chết trên thập tự giá.”'
  alternative: “thật vậy, cái chết trên thập tự giá” hoặc sát chữ “cái chết của thập tự giá.”
  rationale: Cách dịch giữ cao trào tu từ từ cái chết nói chung đến cái chết cụ thể trên thập tự giá, nhưng không thêm phần giải thích thần học ngoài văn bản.
- issue: Quan hệ của γενόμενος với ἐταπείνωσεν
  choice: Dùng “trở nên vâng phục” để giữ liên hệ phân từ tương đối mở.
  alternative: “bằng cách vâng phục” hoặc “sau khi trở nên vâng phục.”
  rationale: Nguyên văn cho thấy sự vâng phục gắn với việc tự hạ mình nhưng không buộc phải giải quyết hoàn toàn theo nghĩa phương tiện hay trình tự thời gian.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo văn mạch quy chiếu về Đấng Christ; dùng “thập tự giá” là thuật ngữ Kinh Thánh quen thuộc. Dấu gạch ngang thể hiện rõ sự tăng cấp ở vế cuối.
