    rationale: μέχρι θανάτου nói sự vâng phục kéo dài đến/tận cái chết; nó không tự nó nói rằng Ngài bị buộc phải chết. Cần thay bằng một lựa chọn như «cho đến tận cái chết» hoặc «đến chết».
  - severity: low
    issue: Chú thích b mô tả không chính xác là «sát chữ».
    rationale: Nguyên văn là «cái chết, nhưng/lại [cái chết] của thập tự giá», với từ «cái chết» thứ hai được lặp lại trong tiếng Hy Lạp và có tính tăng cấp. Chú thích nên phân biệt cách dịch sát cấu trúc với ý nghĩa tự nhiên trong tiếng Việt.
