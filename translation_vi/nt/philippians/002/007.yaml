  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: vi
  text: nhưng đã tự làm cho mình trở nên trống không[a], mang lấy hình thức của một nô lệ, trở nên giống như loài người[b]; và được thấy có dáng vẻ như một con người[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tự làm mình thành không.” Cụm từ Hy Lạp giữ hình ảnh “làm trống chính mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “trở nên trong sự tương đồng với những con người.” Từ “tương đồng/giống như” tự nó không hàm ý Ngài chỉ có vẻ là con người.'
    reason: source_clarity
  - marker: c
    text: Từ Hy Lạp ἄνθρωπος ở đây chỉ con người theo nghĩa chung, không nhấn mạnh giới tính.
    reason: lexical_clarity
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn tả sự tương phản mạnh với ý trước một cách tự nhiên và ngắn gọn.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: tự làm mình ra không
  rationale: Giữ lại ẩn dụ của κενόω và đối tượng phản thân, không tự ý giải thích rằng Đấng Christ đã từ bỏ một thuộc tính cụ thể nào. Chú thích cung cấp cách dịch sát hình ảnh hơn.
- source_word: μορφὴν δούλου λαβών
  choice: mang lấy hình thể của một nô lệ
  rationale: “Hình thể” giữ sự tương ứng với μορφή và sự song hành trong văn cảnh; “nô lệ” truyền đạt rõ địa vị lệ thuộc của δοῦλος, mạnh hơn nghĩa khái quát “đầy tớ”.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: trở nên giống như loài người
  rationale: “Trở nên” phản ánh trực tiếp γενόμενος; “giống như” truyền đạt ὁμοίωμα mà không biến câu thành lời phủ nhận nhân tính thật; “loài người” thể hiện số nhiều chỉ chung, không giới hạn giới tính.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: khi được nhận thấy có dáng vẻ như một con người
  rationale: “Dáng vẻ” diễn đạt phương diện có thể nhận thấy của σχῆμα và phân biệt với μορφή; “một con người” dùng theo nghĩa chỉ chung của ἄνθρωπος.
theological_decisions:
- issue: Ý nghĩa của ἑαυτὸν ἐκένωσεν trong ngữ cảnh Kitô học
  choice: Giữ ẩn dụ “tự làm mình ra không” và để các phân từ tiếp theo cho biết cách thức của hành động ấy.
  alternative: Diễn giải là từ bỏ thần tính hoặc một số thuộc tính thần linh.
  rationale: Bản văn không nói rõ Ngài làm mình trống khỏi điều gì; chính các mệnh đề “mang lấy” và “trở nên” triển khai hành động. Cách dịch này bảo toàn sức căng thần học mà không áp đặt một học thuyết kenosis cụ thể.
- issue: Sắc thái của ὁμοίωμα khi nói về việc trở nên giống loài người
  choice: Giữ ý “giống như” mà không thêm từ ngữ hàm ý chỉ có vẻ ngoài, cũng không thay bằng một khẳng định mạnh hơn nguyên văn.
  alternative: Chỉ mang dáng vẻ giả như con người; hoặc đồng nhất hoàn toàn bằng lời lẽ mạnh hơn câu Hy Lạp.
  rationale: ὁμοίωμα cần được thể hiện đúng như bản văn; mệnh đề kế tiếp bổ sung phương diện dáng vẻ, nhưng câu dịch không nên tự giải quyết sự căng thẳng trong cách diễn đạt của Phao-lô.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Bản dịch duy trì ba nét diễn đạt khác nhau của nguyên văn: μορφή là “hình thể”, ὁμοίωμα là “giống như”, và σχῆμα là “dáng vẻ”, tránh nhập chúng thành một khái niệm duy nhất.'
