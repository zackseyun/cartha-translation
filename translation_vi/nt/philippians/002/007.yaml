review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc cơ bản: mệnh đề đối lập, động từ phản thân ἐκένωσεν, rồi các phân từ giải thích bằng việc mang lấy μορφή của nô lệ, trở nên trong ὁμοίωμα của con người, và được thấy theo σχήμα như một con người. Tuy nhiên, “hình thể” dễ quy về thân thể/diện mạo vật lý và không phù hợp để diễn đạt μορφή trong thế đối ứng với σχῆμα. “Tự làm mình ra không” cũng không phải cách nói tiếng Việt chuẩn, rõ nghĩa cho ἐκένωσεν.'
  naturalness: 'Cần sửa để tiếng Việt hiện đại tự nhiên hơn: “tự làm cho mình trở nên trống không” bảo lưu ẩn dụ mà không dùng kết hợp từ bất thường “làm mình ra không”; “hình thức” và “dáng vẻ” giữ hai từ Hy Lạp riêng biệt mà vẫn dễ đọc. “Được thấy có dáng vẻ” tự nhiên hơn “khi được nhận thấy có dáng vẻ” trong chuỗi phân từ.'
  terminology: Giữ “nô lệ” cho δούλου, vì nêu rõ địa vị lệ thuộc. Dùng “hình thức” cho μορφή và “dáng vẻ” cho σχῆμα để không đồng nhất hai thuật ngữ. “Con người” trong chú thích về ἄνθρωπος được giải thích là cách dùng chung, không mang nghĩa giới tính.
  issues:
  - severity: medium
    issue: “tự làm mình ra không” không tự nhiên và không phải kết hợp từ chuẩn trong tiếng Việt hiện đại.
    rationale: Cụm này có thể gây khó hiểu hoặc bị đọc như “làm ra từ hư không,” thay vì diễn tả ἑαυτὸν ἐκένωσεν. Cần một cách diễn đạt bảo lưu ẩn dụ “làm trống/empty” nhưng rõ nghĩa hơn.
  - severity: medium
    issue: “hình thể của một nô lệ” dễ giới hạn μορφή vào hình dáng hay thân thể.
    rationale: μορφή không đơn thuần là hình thể vật lý; trong câu này cần được phân biệt với σχῆμα, là phương diện dáng vẻ có thể quan sát. “Hình thức” là lựa chọn rộng hơn và duy trì sự phân biệt ấy.
  - severity: low
    issue: “khi được nhận thấy có dáng vẻ” làm mạch phân từ nặng và hơi gượng.
    rationale: “và được thấy có dáng vẻ như một con người” tự nhiên hơn, vẫn phản ánh εὑρεθεὶς ὡς ἄνθρωπος và không biến ἄνθρωπος thành từ chỉ nam giới.
