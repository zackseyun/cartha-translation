  rationale: Chỉ sửa cách diễn đạt cụm so sánh để tiếng Việt tự nhiên hơn và sát ý “ở trên/vượt trên mọi danh”; không thay đổi tham chiếu, ý nghĩa, hay độ mở về danh tính của “danh.” Chú thích b được biên tập nhẹ cho rõ và tự nhiên.
