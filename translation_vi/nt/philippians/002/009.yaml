  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: vi
  text: Vì thế, Đức Chúa Trời cũng đã tôn ngài lên rất cao và ân ban[a] cho ngài danh[b] vượt trên mọi danh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ban cho.”
    reason: lexical_alternative
  - marker: b
    text: “Danh” có thể chỉ không chỉ một tên gọi được nói ra mà còn địa vị, phẩm vị hoặc tước hiệu; riêng câu này chưa xác định đó là danh nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Vì thế ... cũng
  rationale: Giữ được cả ý suy luận của διό lẫn ý bổ sung của καί, đồng thời phù hợp với trật tự câu tiếng Việt tự nhiên.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Chủ ngữ trong tiếng Hy Lạp được nêu rõ và có tính xác định; đây là cách gọi trang trọng, quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: ὑπερύψωσεν
  choice: tôn ngài lên rất cao
  rationale: Diễn đạt sắc thái tăng cường của động từ ghép ὑπερυψόω mà không biến nó thành một khẳng định cụ thể hơn về địa vị hoặc nơi chốn.
- source_word: ἐχαρίσατο
  choice: ân ban
  rationale: Giữ mối liên hệ từ vựng với χάρις, tức ân huệ, đồng thời dùng một cách diễn đạt ngắn gọn và trang trọng trong tiếng Việt hiện đại.
- source_word: τὸ ὄνομα
  choice: danh
  rationale: Dịch trực tiếp ὄνομα và không thu hẹp nghĩa thành một danh hiệu cụ thể; “danh” cũng có thể gợi đến tên gọi, địa vị hoặc tước hiệu tùy văn cảnh.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: danh cao hơn mọi danh
  rationale: Giữ cấu trúc so sánh của nguyên văn và diễn đạt tự nhiên bằng tiếng Việt.
theological_decisions:
- issue: Danh tính của “danh” được ban
  choice: Giữ nguyên là “danh” mà không xác định cụ thể trong chính câu này.
  alternative: Hiểu là tên “Giê-su,” hoặc là danh hiệu thần thượng “Chúa” được nêu rõ ở các câu kế tiếp.
  rationale: Câu 9 chưa trực tiếp cho biết đó là danh nào; bản dịch vì thế giữ nguyên độ mở của văn bản, không đưa kết luận từ Phi-líp 2:10–11 vào câu này.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Ngài” được dùng để quy chiếu về Đấng Christ trong ngữ cảnh, còn “Đức Chúa Trời” làm chủ ngữ được nêu rõ. Câu giữ nhịp song hành của hai hành động: tôn lên và ân ban.'
