id: PHP.2.30
reference: Philippians 2:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: vi
  text: vì chính công việc của Đấng Mê-si mà người đã đến gần cái chết, liều mạng sống mình để bù đắp phần còn thiếu trong sự phục vụ của anh chị em dành cho tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phần còn thiếu” không có ý nói anh chị em thiếu thiện chí, nhưng nói đến sự phục vụ anh chị em không thể đích thân thực hiện vì ở xa.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: vì công việc của Đấng Mê-si
  rationale: διά với đối cách diễn tả nguyên nhân hoặc lý do; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được ý người ấy chịu nguy hiểm vì công việc thuộc về Đấng Mê-si.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός mang nghĩa tước hiệu 'Đấng Mê-si/Đấng được xức dầu'; dịch tước hiệu giúp giữ rõ nội dung từ nguyên và thần học.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: đến gần cái chết
  rationale: Giữ sát hình ảnh của động từ ἐγγίζω, đồng thời diễn đạt rõ rằng người ấy đã ở sát ngưỡng chết.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: liều mạng sống mình
  rationale: Phân từ nói đến việc tự đặt mạng sống vào nguy hiểm; ψυχή ở đây là sự sống thể chất, không phải 'linh hồn' theo nghĩa phi vật chất.
- source_word: ἵνα ἀναπληρώσῃ
  choice: để bù đắp
  rationale: ἵνα nêu mục đích, còn ἀναπληρόω chỉ việc bổ sung cho đầy phần đang thiếu.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: phần còn thiếu
  rationale: Cụm từ nói đến phần phục vụ mà cộng đồng không thể trực tiếp thực hiện vì ở xa, không nhất thiết hàm ý lỗi đạo đức hay thiếu thiện chí.
- source_word: τῆς πρός με λειτουργίας
  choice: trong sự phục vụ của anh chị em dành cho tôi
  rationale: λειτουργία ở đây chỉ sự phục vụ hay trợ giúp thực tế dành cho Phao-lô; 'sự phục vụ' giữ được độ rộng nghĩa mà không thu hẹp thành một chức vụ tôn giáo.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm từ của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này, từ Hy Lạp vẫn có thể nghe như một tước hiệu; 'Đấng Mê-si' chuyển tải nghĩa của tước hiệu thay vì chỉ phiên âm theo truyền thống.
- issue: Ý nghĩa của 'phần còn thiếu' trong sự phục vụ
  choice: Không diễn đạt như lời trách cứ sự thiếu thiện chí
  alternative: Sự thiếu sót của anh chị em
  rationale: Ngữ cảnh cho thấy Ép-ba-phô-đích thay mặt cộng đồng thực hiện điều họ không thể trực tiếp làm vì khoảng cách; bản dịch cần giữ ý thiếu về mặt hiện diện hay khả năng thực hiện, không gán lỗi đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' cho đại từ số nhiều ὑμῶν; dùng 'liều mạng sống mình' để truyền đạt tự nhiên sắc thái nguy hiểm mạnh của phân từ Hy Lạp.
