id: PHP.3.21
reference: Philippians 3:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: vi
  text: Đấng sẽ biến đổi thân thể thấp hèn của chúng ta để trở nên đồng hình với thân thể vinh hiển của Ngài,[a] theo quyền năng mà nhờ đó Ngài có thể khiến muôn vật quy phục chính Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “thân thể của sự thấp hèn chúng ta” và “thân thể của vinh quang Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo sự vận hành mà bởi đó Ngài có thể khiến muôn vật quy phục chính mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: sẽ biến đổi
  rationale: Diễn tả sự thay đổi thật sự về hình dạng hoặc tình trạng, đồng thời giữ rõ ý nghĩa tương lai.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: thân thể thấp hèn của chúng ta
  rationale: Truyền đạt tự nhiên thành ngữ Hy Lạp theo nghĩa thân thể hiện đang ở tình trạng thấp hèn; chú thích bảo lưu cách dịch sát cấu trúc.
- source_word: σύμμορφον
  choice: nên đồng hình với
  rationale: Giữ ý tương ứng mạnh mẽ về hình dạng mà tính từ Hy Lạp diễn tả, nhưng không giải thích thêm cơ chế của sự biến đổi.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: thân thể vinh hiển của Ngài
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cấu trúc thuộc cách, chỉ thân thể mang đặc tính vinh hiển.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: theo quyền năng đang vận hành
  rationale: Kết hợp sắc thái chuẩn mực của κατὰ với ý sức mạnh hữu hiệu đang hoạt động của ἐνέργεια.
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: khiến Ngài có thể
  rationale: Diễn đạt tự nhiên quan hệ giữa quyền năng đang vận hành và khả năng của chủ thể, không làm suy yếu năng lực vốn thuộc về Ngài.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: quy phục muôn vật dưới chính mình
  rationale: Giữ lực nghĩa đặt mọi sự dưới quyền và nhấn mạnh đại từ phản thân; “muôn vật” diễn đạt tự nhiên phạm vi bao quát của τὰ πάντα.
theological_decisions:
- issue: Quan hệ giữa tình trạng thân thể thấp hèn hiện nay và sự vinh hiển tương lai
  choice: Câu dịch nói đến sự biến đổi trong tương lai, khiến thân thể tín hữu đồng hình với thân thể vinh hiển của Đấng Christ.
  alternative: Có thể thêm rõ ngôn ngữ về sự sống lại hoặc mô tả cơ chế biến đổi.
  rationale: Bản Hy Lạp khẳng định sự biến đổi thân thể và sự đồng hình, nhưng tại đây không nói rõ cơ chế; vì thế bản dịch không bổ sung chi tiết giáo lý.
- issue: Sắc thái của κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι
  choice: theo quyền năng đang vận hành khiến Ngài có thể
  alternative: bởi quyền năng cho phép Ngài
  rationale: Cách chọn giữ ý quyền năng hữu hiệu đang hoạt động và tránh hàm ý rằng Đấng Christ nhận khả năng từ một tác nhân bên ngoài.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đồng hình” được giữ vì chính xác hơn “giống như” trong việc diễn tả σύμμορφον; các cấu trúc thuộc cách khó được giải thích bằng chú thích. Đại từ “Ngài” phù hợp văn phong Kinh Thánh trang trọng, còn “Đấng” nối tự nhiên với chủ thể ở câu trước.
