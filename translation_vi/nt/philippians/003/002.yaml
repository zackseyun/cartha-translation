  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: vi
  text: Hãy coi chừng những con chó; hãy coi chừng những kẻ làm điều ác; hãy coi chừng sự cắt xẻo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “sự cắt xẻo”, một thuật ngữ miệt thị có dụng ý chơi chữ, đối lập với “phép cắt bì” trong câu kế tiếp.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Hãy coi chừng
  rationale: Động từ mệnh lệnh hiện tại được lặp lại ba lần, diễn tả lời cảnh báo khẩn thiết. “Hãy coi chừng” tự nhiên trong tiếng Việt hiện đại và giữ được nhịp điệp ngữ.
- source_word: τοὺς κύνας
  choice: những con chó
  rationale: Giữ nguyên ẩn dụ miệt thị mạnh trong nguyên văn, không thêm tính từ giải thích hay làm nhẹ sắc thái.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: những kẻ làm điều ác
  rationale: Cách diễn đạt tự nhiên, dễ hiểu, giữ cả ý hoạt động của ἐργάτας và phán đoán đạo đức của κακούς.
- source_word: τὴν κατατομήν
  choice: phường cắt xẻo
  rationale: κατατομή là danh từ mang nghĩa “sự cắt xẻo”, được dùng như một danh xưng tập thể đầy tính châm biếm. “Phường cắt xẻo” giữ sức công kích, chỉ đến nhóm người đang bị cảnh báo và gợi rõ lối chơi chữ đối lập với “phép cắt bì” ở câu sau.
theological_decisions:
- issue: Cách dịch κατατομήν trong mối liên hệ với περιτομή ở câu kế tiếp
  choice: phường cắt xẻo
  alternative: sự cắt xẻo; những kẻ cắt xẻo; phép cắt bì giả
  rationale: Phao-lô cố ý dùng một từ hạ thấp thay cho từ thông thường chỉ phép cắt bì. Bản dịch giữ nét châm biếm và sự đối lập thần học, nhưng không thêm chữ “giả” vốn không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. Điệp ngữ “hãy coi chừng” được giữ đủ ba lần. “Phường” truyền đạt sắc thái tập thể và công kích của cách dùng danh từ có mạo từ, còn “cắt xẻo” bảo toàn lối chơi chữ gay gắt.
