id: PHP.3.20
reference: Philippians 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: vi
  text: Vì quyền công dân của chúng ta ở trên trời[a]; từ đó chúng ta cũng tha thiết trông đợi một Đấng Cứu Thế, là Chúa Jesus, Đấng Messiah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cộng đồng công dân của chúng ta ở trên trời.” Nguyên văn: “ở trong các tầng trời.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Christ”; cả cụm cũng thường được dịch là “Chúa Jesus Christ.”
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: quê hương công dân
  rationale: Danh từ mang sắc thái công dân–chính trị và có thể chỉ địa vị công dân hoặc cộng đồng/quê hương mà người ta thuộc về. “Quê hương công dân” giữ được cả ý thuộc về một quê hương và sắc thái công dân, dù cần chú thích để nêu cách dịch gọn hơn.
- source_word: ἐν οὐρανοῖς
  choice: ở trên trời
  rationale: Nguyên văn dùng danh từ số nhiều, nhưng tiếng Việt tự nhiên thường nói “trên trời”; cách dịch này chỉ cõi trời mà không làm câu nặng nề.
- source_word: ὑπάρχει
  choice: ở
  rationale: Trong cấu trúc chỉ nơi chốn này, “ở” diễn đạt tự nhiên sự hiện hữu thực tại của πολίτευμα.
- source_word: ἐξ οὗ
  choice: từ đó
  rationale: Đại từ quan hệ số ít quy chiếu về cõi trời vừa nói đến; “từ đó” giữ rõ nghĩa không gian và tự nhiên trong tiếng Việt.
- source_word: ἀπεκδεχόμεθα
  choice: nóng lòng trông đợi
  rationale: Diễn đạt sự chờ đợi bền bỉ, tha thiết và đầy mong mỏi của động từ ghép.
- source_word: σωτῆρα
  choice: Đấng Cứu Thế
  rationale: Cách gọi trang trọng, quen thuộc, giữ nghĩa về người cứu thoát và sức nặng Kitô học của danh từ.
- source_word: κύριον
  choice: Chúa
  rationale: “Chúa” là cách tương đương tự nhiên và truyền thống trong ngữ cảnh tước hiệu dành cho Jesus.
- source_word: Χριστόν
  choice: Đấng Messiah
  rationale: Ở đây Χριστός vẫn có lực của một tước hiệu trong chuỗi κύριον Ἰησοῦν Χριστόν. Giữ “Messiah” giúp truyền đạt tước hiệu thay vì khiến từ này bị hiểu đơn thuần như một phần tên riêng.
theological_decisions:
- issue: 'Cách hiểu πολίτευμα: địa vị công dân hay cộng đồng/quê hương chính trị'
  choice: quê hương công dân
  alternative: quyền công dân; cộng đồng công dân
  rationale: Ngữ cảnh đối lập căn tính hướng về đất với sự thuộc về trời. Bản dịch chính không thu hẹp danh từ chỉ còn địa vị pháp lý, đồng thời chú thích ghi nhận cách hiểu “quyền công dân”.
- issue: Cách dịch Χριστόν trong κύριον Ἰησοῦν Χριστόν
  choice: Đấng Messiah
  alternative: Đấng Christ; Chúa Jesus Christ
  rationale: Danh từ xác định Đấng Cứu Thế đang được trông đợi và vẫn mang nghĩa tước hiệu “Đấng được xức dầu.” Chú thích bảo tồn cách gọi truyền thống “Đấng Christ” mà không biến sự lựa chọn thành một khẳng định giáo phái.
- issue: Quan hệ đồng vị của σωτῆρα với κύριον Ἰησοῦν Χριστόν
  choice: Đấng Cứu Thế, là Chúa Jesus, Đấng Messiah
  alternative: 'một Đấng Cứu Thế: Chúa Jesus Christ'
  rationale: “Là” làm rõ rằng Đấng Cứu Thế chính là Chúa Jesus, chứ không phải hai đối tượng, trong khi dấu phẩy giữ chuỗi tước hiệu trang trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Jesus” và “Messiah” theo dạng chuyển tự quốc tế; viết hoa các tước hiệu quy chiếu trực tiếp đến Chúa Jesus. Tránh thêm ý “chúng ta là công dân” vì nguyên văn nói trực tiếp về πολίτευμα của chúng ta.
