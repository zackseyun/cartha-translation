revisions:
- from: Vì quê hương công dân của chúng ta ở trên trời[a], và từ đó chúng ta cũng nóng lòng trông đợi Đấng Cứu Thế, là Chúa Jesus, Đấng Messiah.[b]
  to: Vì quyền công dân của chúng ta ở trên trời[a]; từ đó chúng ta cũng tha thiết trông đợi một Đấng Cứu Thế, là Chúa Jesus, Đấng Messiah.[b]
  rationale: Bản sửa thay cụm từ không tự nhiên “quê hương công dân” bằng “quyền công dân”, là cách diễn đạt rõ ràng và sát nghĩa trong ngữ cảnh. Cũng điều chỉnh động từ chỉ sự chờ đợi để phản ánh sắc thái mong đợi tha thiết của nguyên ngữ. Chú thích giữ các phương án từ vựng và cách gọi truyền thống cần thiết.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:59Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hướng đối lập giữa sự thuộc về trời và điều trông đợi từ trời. Tuy nhiên, “quê hương công dân” không phải là một cụm tiếng Việt tự nhiên và làm mờ nghĩa chính của πολίτευμα trong ngữ cảnh này, tức địa vị/thuộc tính công dân. “Nóng lòng” có thể gợi sự sốt ruột hơn là sự mong đợi thiết tha, bền bỉ của ἀπεκδεχόμεθα.
  naturalness: Cần thay “quê hương công dân” bằng “quyền công dân” để câu rõ ràng, hiện đại và vẫn giữ sắc thái công dân–chính trị. Dấu chấm phẩy giúp phân ranh mệnh đề tự nhiên hơn; “tha thiết trông đợi” phù hợp văn phong trang trọng mà không hàm ý thiếu kiên nhẫn.
  terminology: Giữ “Chúa Jesus” cho κύριον Ἰησοῦν và “Đấng Messiah” cho Χριστόν, vì bản dịch đang chủ ý biểu đạt tính tước hiệu của Χριστός. “Đấng Cứu Thế” có thể được giữ cho σωτῆρα; cụm đồng vị “là Chúa Jesus, Đấng Messiah” nhận diện Đấng Cứu Thế mà không thêm nội dung thần học.
