    rationale: Cụm này ghép hai khái niệm khác nhau—quê hương và địa vị công dân—mà không thành một cách diễn đạt Việt ngữ thông dụng. Trong câu này, “quyền công dân” là cách chuyển đạt sáng rõ hơn, sát với quyết định từ vựng của bản tiếng Anh và vẫn phù hợp ngữ cảnh.
