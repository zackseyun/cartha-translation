  to: Xét về lòng nhiệt thành, tôi đã bắt bớ Hội Thánh; xét về sự công chính theo luật pháp[a], tôi đã trở nên không thể chê trách.
  rationale: Chỉnh hai cụm từ để tiếng Việt hiện đại và tự nhiên hơn, đồng thời giữ nguyên ý nghĩa, cấu trúc tu từ, và phạm vi pháp lý của nguyên văn. Chú thích cho ἐν νόμῳ vẫn cần thiết vì bản chính dùng cách diễn đạt theo nghĩa phạm vi/tiêu chuẩn («theo luật pháp»), còn nguyên văn sát chữ là «trong luật pháp».
