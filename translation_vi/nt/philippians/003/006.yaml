  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: vi
  text: Xét về lòng nhiệt thành, tôi đã bắt bớ Hội Thánh; xét về sự công chính theo luật pháp[a], tôi đã trở nên không thể chê trách.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “trong luật pháp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: xét về
  rationale: Κατά mở đầu từng phương diện mà Phao-lô dùng để đánh giá đời sống trước kia của mình. “Xét về” tự nhiên trong tiếng Việt và giữ được cấu trúc tu từ lặp lại.
- source_word: ζῆλος
  choice: lòng sốt sắng
  rationale: Cụm này diễn tả nhiệt tâm tôn giáo mạnh mẽ, không mặc nhiên đánh giá nhiệt tâm ấy là đúng đắn.
- source_word: διώκων
  choice: tôi đã bắt bớ
  rationale: Trong ngữ cảnh này, διώκω chỉ hành động thù địch chống lại cộng đồng tín hữu. Dùng động từ hữu hạn với chủ ngữ “tôi” giúp câu tiếng Việt tự nhiên mà vẫn truyền đạt phân từ Hy Lạp.
- source_word: τὴν ἐκκλησίαν
  choice: Hội Thánh
  rationale: Ở đây ἐκκλησία chỉ cộng đồng những người tin Chúa Cứu Thế, không phải một cuộc hội họp nói chung.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: “Sự công chính” bao quát ý về tình trạng hay cách sống phù hợp với chuẩn mực được nêu, và trong câu này chuẩn mực ấy là luật pháp.
- source_word: ἐν νόμῳ
  choice: theo luật pháp
  rationale: Giới từ ἐν theo nghĩa đen là “trong,” nhưng ở đây có thể chỉ phạm vi hoặc tiêu chuẩn đánh giá. “Theo luật pháp” là tiếng Việt tự nhiên; nghĩa sát chữ được giữ trong chú thích.
- source_word: γενόμενος
  choice: tôi đã trở nên
  rationale: Cách dịch này giữ ý hoàn thành của phân từ γενόμενος thay vì giản lược nó thành một tính từ thuần túy.
- source_word: ἄμεμπτος
  choice: không chỗ trách được
  rationale: Cụm này diễn tả việc không thể bị quy trách theo khuôn khổ luật pháp đang được nói đến, chứ không tự động hàm ý hoàn toàn vô tội trước Đức Chúa Trời.
theological_decisions:
- issue: Phạm vi lời khẳng định “không chỗ trách được” của Phao-lô
  choice: Lời khẳng định được giới hạn trong phương diện sự công chính được đánh giá theo luật pháp.
  alternative: Phao-lô tuyên bố mình hoàn toàn vô tội hoặc không hề phạm tội.
  rationale: Cú pháp gắn ἄμεμπτος với δικαιοσύνη τὴν ἐν νόμῳ. Vì vậy, câu nói mô tả tư cách của Phao-lô trong khuôn khổ đánh giá vừa nêu, không phải một lời khẳng định tuyệt đối về sự hoàn hảo đạo đức.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “xét về…; xét về…” giữ nhịp liệt kê của nguyên văn. Chủ ngữ “tôi” được thêm theo ngữ cảnh để hai phân từ Hy Lạp thành câu tự nhiên trong tiếng Việt.
