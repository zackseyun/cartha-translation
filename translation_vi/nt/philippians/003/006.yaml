    issue: Cụm «không chỗ trách được» không tự nhiên.
    rationale: Cụm này có thể hiểu được nhưng ít thông dụng trong tiếng Việt hiện đại. «Không thể chê trách» là cách nói rõ và tự nhiên hơn cho ἄμεμπτος, không thêm ý vô tội tuyệt đối.
  - severity: low
    issue: «Lòng sốt sắng» kém tự nhiên hơn «lòng nhiệt thành».
    rationale: ζῆλος ở đây nói đến nhiệt tâm tôn giáo mãnh liệt; «lòng nhiệt thành» là lựa chọn hiện đại, rõ nghĩa, và không mặc nhiên tán thành nhiệt tâm ấy.
  revised_text: Xét về lòng nhiệt thành, tôi đã bắt bớ Hội Thánh; xét về sự công chính theo luật pháp[a], tôi đã trở nên không thể chê trách.
