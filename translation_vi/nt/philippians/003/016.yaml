- from: Dù sao, chúng ta đã đạt đến đâu thì hãy tiếp tục bước theo đúng mức ấy.[a]
  to: Dù sao, chúng ta đã đạt đến mức nào thì hãy cứ bước đi phù hợp với mức ấy.[a]
  rationale: Sửa câu để diễn đạt rõ và tự nhiên hơn lời kêu gọi bước đi nhất quán với mức đã đạt đến. Bản sửa giữ tính hàm ẩn của τῷ αὐτῷ, không thêm một danh từ thần học hay quy phạm cụ thể vào chính văn; chú thích vẫn ghi các cách diễn đạt có thêm “quy tắc/chuẩn mực”.
