id: PHP.3.16
reference: Philippians 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν εἰς ὃ ἐφθάσαμεν, τῷ αὐτῷ ⸀στοιχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: vi
  text: Dù sao, chúng ta đã đạt đến mức nào thì hãy cứ bước đi phù hợp với mức ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy bước theo cùng một quy tắc” hoặc “hãy giữ cùng một chuẩn mực.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: Dù sao
  rationale: Ở đây, πλήν chuyển ý với sắc thái giới hạn và điều chỉnh. “Dù sao” tự nhiên trong tiếng Việt, nối lời khuyên này với phần trước mà không biến câu thành một ngoại lệ đơn thuần.
- source_word: εἰς ὃ
  choice: đã đạt đến đâu
  rationale: Cụm này chỉ mức hay điểm mà người tin đã tiến tới. Cách diễn đạt “đạt đến đâu” giữ được tương quan giữa mức đã đạt và lời kêu gọi tiếp tục sống phù hợp với mức ấy.
- source_word: ἐφθάσαμεν
  choice: chúng ta đã đạt đến
  rationale: Động từ chỉ việc đã đến một mức hay giai đoạn nhất định. “Đã đạt đến” vừa sát nghĩa vừa cho thấy thành quả trước đó vẫn liên quan đến lời khuyên hiện tại.
- source_word: τῷ αὐτῷ
  choice: theo đúng mức ấy
  rationale: Dữ cách này chỉ cùng một đường hướng, chuẩn mực hoặc mức đã nói đến, nhưng bản Hy Lạp ngắn không nêu rõ một danh từ như “quy tắc”. “Theo đúng mức ấy” diễn đạt quan hệ này mà không đưa thêm một chuẩn mực cụ thể ngoài văn bản.
- source_word: στοιχεῖν
  choice: hãy tiếp tục bước theo
  rationale: στοιχεῖν gợi hình ảnh bước đi ngay hàng, phù hợp với một đường hướng hay chuẩn mực. “Tiếp tục bước theo” giữ hình ảnh chuyển động và làm rõ sắc thái khuyên duy trì nhất quán.
theological_decisions:
- issue: Có nên thêm rõ danh từ “quy tắc” hoặc “chuẩn mực” với τῷ αὐτῷ hay không
  choice: Không thêm danh từ ấy trong chính văn; dùng “tiếp tục bước theo đúng mức ấy”.
  alternative: “hãy bước theo cùng một quy tắc” hoặc “hãy giữ cùng một chuẩn mực”
  rationale: Bản SBLGNT được cung cấp để ngỏ điều được hiểu ngầm sau τῷ αὐτῷ. Việc thêm “quy tắc” có thể phản ánh cách đọc mở rộng hoặc truyền thống dịch hơn là chính văn ngắn; bản dịch chính giữ tính hàm ẩn, còn chú thích nêu cách hiểu khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ lời khuyên ở ngôi thứ nhất số nhiều; “bước theo” bảo tồn ẩn dụ của στοιχεῖν, còn “đúng mức ấy” tránh áp đặt một danh từ không được nêu rõ trong bản Hy Lạp.
