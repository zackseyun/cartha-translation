id: PHP.3.17
reference: Philippians 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: vi
  text: Thưa anh em[a], hãy cùng nhau noi gương tôi, và hãy chú ý đến những người sống theo cách ấy, vì anh em có chúng tôi làm gương[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em”; hình thức Hy Lạp là số nhiều giống đực nhưng có lẽ hướng đến toàn thể hội chúng.
    reason: cultural_note
  - marker: b
    text: Hay “khuôn mẫu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί ... γίνεσθε
  choice: hãy cùng nhau noi gương
  rationale: Cách diễn đạt này chuyển tải mệnh lệnh cùng tham gia noi theo một gương mẫu, giữ được sắc thái tập thể của Συμμιμηταί và lực mệnh lệnh của γίνεσθε, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Danh từ hô cách số nhiều giống đực được thể hiện bằng cách xưng hô quen thuộc “anh em”; trong ngữ cảnh, từ này rất có thể hướng đến toàn thể hội chúng, nên điều đó được nói rõ trong chú thích.
- source_word: σκοπεῖτε
  choice: hãy chú ý đến
  rationale: Động từ chỉ sự quan sát và lưu tâm cẩn thận. “Hãy chú ý đến” rõ ràng, tự nhiên và không thu hẹp nghĩa vào hành động nhìn bằng mắt.
- source_word: οὕτω περιπατοῦντας
  choice: những người sống theo cách ấy
  rationale: περιπατέω dùng theo nghĩa ẩn dụ về lối sống. Tiếng Việt tự nhiên dùng “sống” ở đây; “theo cách ấy” giữ liên hệ của οὕτω với lối sống vừa được nêu.
- source_word: τύπον
  choice: khuôn mẫu
  rationale: Từ này chỉ một mẫu mực để người khác noi theo. “Khuôn mẫu” giữ được ý về một mẫu định hướng, còn phương án “gương mẫu” được ghi ở chú thích.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Giữ nguyên đại từ số nhiều của bản Hy Lạp, không thu hẹp thành một mình Phao-lô.
theological_decisions:
- issue: Phạm vi bao hàm của ἀδελφοί
  choice: Giữ “anh em” trong chính văn và giải thích trong chú thích rằng lời gọi có lẽ hướng đến toàn thể hội chúng.
  alternative: Dịch ngay trong chính văn là “anh chị em”.
  rationale: Bản Hy Lạp dùng hình thức số nhiều giống đực, nhưng cách xưng hô này trong ngữ cảnh có thể bao gồm cả nam lẫn nữ. Chính văn và chú thích cùng nhau bảo toàn cả hình thức nguồn lẫn phạm vi ngữ dụng có khả năng nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thưa anh em” thể hiện lời gọi trực tiếp; “noi gương”, “chú ý đến” và “sống theo cách ấy” là các cách diễn đạt thông dụng, tránh lối văn cổ hoặc quá sát chữ.
