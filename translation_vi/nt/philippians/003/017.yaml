- from: Thưa anh em[a], hãy cùng nhau noi gương tôi, và hãy chú ý đến những người sống theo cách ấy, như anh em có chúng tôi làm khuôn mẫu[b].
  to: Thưa anh em[a], hãy cùng nhau noi gương tôi, và hãy chú ý đến những người sống theo cách ấy, vì anh em có chúng tôi làm gương[b].
  rationale: Bản sửa chỉ làm trôi chảy vế cuối và điều chỉnh chú thích từ vựng. Bản văn vẫn phân biệt “tôi” trong lời kêu gọi noi theo với “chúng tôi” là mẫu gương số nhiều, đồng thời không áp đặt cách hiểu thần học ngoài nghĩa của bản Hy Lạp.
