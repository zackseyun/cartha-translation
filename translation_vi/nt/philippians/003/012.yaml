id: PHP.3.12
reference: Philippians 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: vi
  text: Không phải là tôi đã đạt được điều ấy[a] rồi, hay đã được hoàn thiện[b] rồi; nhưng tôi vẫn theo đuổi để xem liệu tôi có thể nắm lấy điều mà chính tôi cũng đã được Đấng Christ[c] nắm lấy hay không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nhận được” hoặc “đã nắm lấy”. Tiếng Hy Lạp không nêu rõ tân ngữ; tân ngữ được hiểu từ văn cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã trở nên trọn vẹn” hoặc “đã được làm cho trọn vẹn”.'
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp là Christos; cũng có thể dịch là “Đấng Mê-si-a” hoặc “Đấng Được Xức Dầu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: đã đạt được điều ấy
  rationale: Động từ λαμβάνω không nêu rõ tân ngữ; “điều ấy” được bổ sung từ văn cảnh để câu tiếng Việt rõ nghĩa. “Đạt được” phù hợp với mục tiêu Phao-lô đang hướng tới mà không xác định quá mức mục tiêu ấy.
- source_word: τετελείωμαι
  choice: đã được hoàn thiện
  rationale: Dạng hoàn thành bị động được giữ bằng “đã được,” còn “hoàn thiện” diễn đạt trạng thái đạt đến mức trọn vẹn mà Phao-lô phủ nhận mình đã có.
- source_word: διώκω
  choice: tôi vẫn theo đuổi
  rationale: “Theo đuổi” giữ hình ảnh truy đuổi và diễn tả hành động đang tiếp diễn trong văn cảnh.
- source_word: εἰ καὶ καταλάβω
  choice: mong sao có thể nắm lấy
  rationale: Cách diễn đạt này giữ sắc thái mục tiêu chưa chắc đã đạt được của εἰ καί, đồng thời “nắm lấy” bảo tồn hình ảnh cụ thể của καταλαμβάνω.
- source_word: ἐφ’ ᾧ
  choice: điều mà vì đó
  rationale: 'Giữ cách hiểu chỉ mục đích: Đấng Christ đã nắm lấy Phao-lô nhằm một mục tiêu. Cụm Hy Lạp cũng có thể được hiểu theo quan hệ nguyên nhân, nên không mở rộng câu để loại bỏ hoàn toàn độ mở ấy.'
- source_word: κατελήμφθην
  choice: chính tôi cũng đã được ... nắm lấy
  rationale: Dạng bị động được thể hiện rõ, và việc lặp lại “nắm lấy” bảo tồn lối chơi chữ với καταλάβω.
- source_word: Χριστοῦ
  choice: Đấng Christ
  rationale: “Đấng Christ” là cách gọi quen thuộc, trang trọng trong tiếng Việt và vẫn giữ sắc thái tước hiệu của Χριστός.
theological_decisions:
- issue: Liệu τετελείωμαι có nên được dịch theo cách hàm ý giáo lý về sự hoàn hảo vô tội hay không
  choice: đã được hoàn thiện
  alternative: đã trở nên trọn vẹn; đã đạt đến mức hoàn hảo
  rationale: Bản dịch giữ ý bị động và trạng thái kết quả của động từ Hy Lạp, nhưng không đưa vào câu các phạm trù thần học về sự vô tội mà chính câu này không nêu rõ.
- issue: Quan hệ của ἐφ’ ᾧ với việc Đấng Christ nắm lấy Phao-lô
  choice: điều mà vì đó
  alternative: bởi vì tôi cũng đã được Đấng Christ nắm lấy
  rationale: Cách dịch chính thể hiện cách hiểu theo mục đích hoặc mục tiêu, phù hợp với sự liên kết giữa hai lần dùng καταλαμβάνω, trong khi ghi nhận khả năng hiểu theo nguyên nhân.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối lập “Không phải là... nhưng...” được giữ rõ. Cặp “nắm lấy/được ... nắm lấy” bảo tồn phép lặp có chủ ý trong nguyên văn; “chính tôi cũng” phản ánh καὶ và nhấn mạnh sự đảo chiều giữa hành động của Phao-lô với hành động của Đấng Christ.
