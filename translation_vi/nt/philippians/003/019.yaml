id: PHP.3.19
reference: Philippians 3:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: vi
  text: Kết cục của họ là sự hủy diệt; thần của họ là cái bụng[a]; vinh quang của họ ở trong điều đáng hổ thẹn của chính họ—họ chăm nghĩ đến những điều thuộc về đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “thần của họ là sự thèm ăn của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: kết cục
  rationale: Diễn đạt tự nhiên ý nghĩa về điểm cuối và kết quả sau cùng, đồng thời tránh sắc thái đơn thuần chỉ sự chấm dứt của “kết thúc”.
- source_word: ἀπώλεια
  choice: sự hủy diệt
  rationale: Giữ sức nặng nghiêm khắc và sắc thái chung cuộc của từ Hy Lạp mà không dùng lối diễn đạt cổ.
- source_word: κοιλία
  choice: cái bụng
  rationale: Giữ nguyên hình ảnh thân thể cụ thể và mạnh của nguyên văn; không thu hẹp ẩn dụ thành riêng sự thèm ăn.
- source_word: δόξα
  choice: vinh quang
  rationale: Là từ tương đương trực tiếp, bảo tồn nghịch lý châm biếm khi họ lấy điều đáng hổ thẹn làm vinh quang.
- source_word: αἰσχύνη
  choice: điều đáng hổ thẹn
  rationale: Trong cấu trúc tiếng Việt, cách diễn đạt này tự nhiên hơn danh từ trừu tượng “sự hổ thẹn” và vẫn giữ ý nhục nhã, ô danh.
- source_word: τὰ ἐπίγεια
  choice: những điều thuộc về đất
  rationale: Theo sát đối lập không gian của ἐπίγεια và giữ liên hệ với “ở trên trời” trong câu kế tiếp, thay vì diễn giải thành vật chất hay thế tục.
- source_word: φρονοῦντες
  choice: chỉ chăm nghĩ đến
  rationale: Thể hiện khuynh hướng tâm trí liên tục và sự chuyên chú; “chỉ” làm rõ lực mô tả của mệnh đề có mạo từ trong ngữ cảnh nhưng không xác định cụ thể các điều ấy.
- source_word: ὧν ... ὧν
  choice: của họ ... của họ
  rationale: Quy chiếu tự nhiên về những người ở câu trước và phần nào giữ phép lặp nhấn mạnh của đại từ quan hệ sở hữu.
theological_decisions:
- issue: Sức mạnh ẩn dụ của câu “thần của họ là cái bụng”
  choice: Giữ hình ảnh cụ thể “cái bụng” trong chính văn.
  alternative: thần của họ là sự thèm ăn của họ
  rationale: Nguyên văn dùng một ẩn dụ thân thể sống động có thể bao quát dục vọng và sự buông thả, nên không nên giới hạn nó vào một cách giải thích duy nhất.
- issue: Phạm vi của “những điều thuộc về đất”
  choice: Dịch sát theo định hướng về những điều thuộc cõi đất.
  alternative: những chuyện thế tục / những điều trần tục
  rationale: Các phương án thay thế dễ thêm phán đoán đạo đức cụ thể; nguyên văn nhấn mạnh định hướng về cõi đất và tạo thế đối chiếu với trời trong câu sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp ba vế mạnh của câu Hy Lạp bằng dấu chấm phẩy; dùng dấu gạch ngang để chuyển sang lời mô tả tổng kết. Đại từ “họ” nối với đối tượng được nói đến ở câu trước.
