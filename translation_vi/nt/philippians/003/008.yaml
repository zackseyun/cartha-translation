id: PHP.3.8
reference: Philippians 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: vi
  text: Hơn thế nữa, tôi xem mọi sự đều là mất mát vì giá trị vượt trội của việc biết Đấng Mê-si-a[a] Giê-su, Chúa tôi. Vì Ngài, tôi đã chịu mất mọi sự và xem chúng như rác rưởi[b], để tôi được Đấng Mê-si-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng Mê-si-a” cũng có thể dịch là “Đấng Christ.”
    reason: alternative_reading
  - marker: b
    text: Từ được dịch là “rác rưởi” là một từ mạnh, cũng có thể chỉ đồ bỏ hoặc phân.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Hơn thế nữa
  rationale: Cụm tiểu từ vừa tăng cường vừa đẩy lập luận đi xa hơn câu trước; cách dịch này tự nhiên và giữ được lực diễn ngôn.
- source_word: ἡγοῦμαι
  choice: tôi xem
  rationale: Diễn tả sự đánh giá có cân nhắc; dùng nhất quán cho cả hai lần xuất hiện.
- source_word: πάντα / τὰ πάντα
  choice: mọi sự
  rationale: Giữ phạm vi bao quát có chủ ý của nguyên văn và phù hợp với văn phong Việt ngữ trang trọng.
- source_word: ζημίαν
  choice: mất mát
  rationale: Giữ hình ảnh đối chiếu lời-lỗ xuyên suốt câu.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: vì giá trị vượt trội của việc biết
  rationale: Diễn đạt τὸ ὑπερέχον như giá trị vượt trội, đồng thời chuyển γνώσεως thành 'việc biết' để thể hiện tự nhiên sắc thái nhận biết mang tính tương giao.
- source_word: Χριστοῦ Ἰησοῦ / Χριστόν
  choice: Đấng Mê-si-a Giê-su / Đấng Mê-si-a
  rationale: Χριστός tại đây vẫn có sức nặng của một tước hiệu; cách dịch 'Đấng Mê-si-a' làm rõ nghĩa ấy trong tiếng Việt.
- source_word: τοῦ κυρίου μου
  choice: Chúa tôi
  rationale: Giữ đại từ sở hữu và sức nặng Cơ Đốc luận của κύριος.
- source_word: δι’ ὃν
  choice: Vì Ngài
  rationale: Thể hiện nguyên nhân mang tính cá vị; ngữ cảnh đã cho thấy sự hy sinh vì Đấng được nhắc đến.
- source_word: ἐζημιώθην
  choice: tôi đã chịu mất
  rationale: Giữ sắc thái bị động của động từ aorist, tức là phải gánh chịu sự mất mát.
- source_word: σκύβαλα
  choice: đồ phế thải
  rationale: Truyền đạt sắc thái khinh bỏ mạnh của từ, nhưng vẫn tự nhiên và trang nghiêm; nghĩa thô hơn được ghi ở chú thích.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: để tôi có thể được Đấng Mê-si-a
  rationale: Giữ quan hệ mục đích của ἵνα và tiếp nối phép ẩn dụ mất–được; 'được' tự nhiên hơn 'thu được' khi đối tượng là một ngôi vị.
theological_decisions:
- issue: Cách dịch Χριστός trong văn mạch Phao-lô
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Christ
  rationale: Trong câu này, từ vẫn mang ý nghĩa tước hiệu và tham gia vào khung lập luận về mối tương giao với Chúa; chú thích bảo lưu cách gọi truyền thống.
- issue: Sắc thái của γνώσεως
  choice: việc biết
  alternative: sự hiểu biết về
  rationale: Cách chọn không giới hạn từ vào kiến thức trí thức, nhưng cũng không thêm từ ngữ giải thích như 'cá nhân' hay 'tương giao' vốn không hiện diện trực tiếp trong nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được chia thành hai câu để tránh câu quá dài, trong khi vẫn giữ chuỗi lập luận về đánh giá, mất mát và được lợi của nguyên văn.
