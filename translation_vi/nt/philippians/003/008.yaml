revisions:
- from: Hơn thế nữa, tôi xem mọi sự đều là mất mát vì giá trị vượt trội của việc biết Đấng Mê-si-a[a] Giê-su, Chúa tôi. Vì Ngài, tôi đã chịu mất mọi sự và xem chúng như đồ phế thải[b], để tôi có thể được Đấng Mê-si-a.
  to: Hơn thế nữa, tôi xem mọi sự đều là mất mát vì giá trị vượt trội của việc biết Đấng Mê-si-a[a] Giê-su, Chúa tôi. Vì Ngài, tôi đã chịu mất mọi sự và xem chúng như rác rưởi[b], để tôi được Đấng Mê-si-a.
