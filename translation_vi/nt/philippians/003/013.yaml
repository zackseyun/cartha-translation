  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: vi
  text: 'Thưa anh em[a], tôi không cho rằng mình đã nắm được điều ấy. Nhưng chỉ một điều: quên đi những gì ở phía sau và vươn tới những gì ở phía trước,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch danh từ xưng hô giống đực adelphoi trong tiếng Hy Lạp; Phao-lô thường dùng từ này để gọi toàn thể cộng đồng tín hữu, gồm cả phụ nữ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Thưa anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của tiếng Hy Lạp; thêm “Thưa” để lời gọi trực tiếp tự nhiên và trang trọng trong tiếng Việt. Chú thích làm rõ rằng trong cách dùng của Phao-lô, từ này thường hướng đến cả cộng đồng tín hữu, gồm cả nữ giới.
- source_word: λογίζομαι
  choice: cho rằng
  rationale: Diễn đạt tự nhiên sự tự đánh giá hoặc nhận định của người nói, không mang sắc thái cổ.
- source_word: ἐμαυτὸν
  choice: chính mình
  rationale: Phản ánh đại từ phản thân có tính nhấn mạnh, tránh làm mất sự tương phản giữa nhận định của Phao-lô về bản thân và mục tiêu ông đang theo đuổi.
- source_word: κατειληφέναι
  choice: đã nắm được điều ấy
  rationale: Giữ hình ảnh nắm bắt từ động từ Hy Lạp và mối liên hệ với câu 12. “Điều ấy” bổ sung đối tượng được hiểu ngầm mà không xác định nội dung hẹp hơn văn mạch.
- source_word: ἓν δέ
  choice: Nhưng chỉ một điều
  rationale: Giữ cấu trúc tỉnh lược và chuyển ý đột ngột của nguyên văn; không thêm “tôi làm” vì động từ ấy không hiện diện trong tiếng Hy Lạp.
- source_word: τὰ μὲν ὀπίσω
  choice: những gì ở phía sau
  rationale: Bảo toàn ý số nhiều và hình ảnh không gian, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐπιλανθανόμενος
  choice: quên đi
  rationale: Theo nghĩa từ vựng trực tiếp, không diễn giải thành phủ nhận quá khứ hay xóa bỏ ký ức.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: những gì ở phía trước
  rationale: Tạo thế đối xứng rõ ràng với “những gì ở phía sau” và giữ hình ảnh hướng về phía trước.
- source_word: ἐπεκτεινόμενος
  choice: vươn tới
  rationale: Truyền đạt động tác duỗi mình hướng tới mục tiêu, phù hợp hình ảnh vận động trong văn mạch mà không cường điệu thành một cách giải thích riêng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu tỉnh lược sau “Nhưng chỉ một điều” và dấu phẩy cuối câu vì ý văn tiếp tục sang câu 14. Hình ảnh “nắm,” “phía sau,” “phía trước” và “vươn tới” được bảo toàn.
