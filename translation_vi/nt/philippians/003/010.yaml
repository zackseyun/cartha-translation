    rationale: Nguyên văn chỉ có một γνῶναι, chi phối cả “Ngài,” “quyền năng,” và “sự tham dự”. Bỏ lần lặp giúp câu gọn hơn và phản ánh cấu trúc tốt hơn.
  - severity: low
    issue: Chú thích b gọi “đang được làm cho đồng dạng” là “Sát nghĩa”.
    rationale: Phân từ συμμορφιζόμενος có thể mang sắc thái trung/phản hoặc bị động; cách diễn đạt bị động không nên được trình bày là lựa chọn sát nghĩa duy nhất. Chú thích nên nêu đây là một cách dịch khả dĩ.
