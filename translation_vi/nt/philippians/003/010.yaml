id: PHP.3.10
reference: Philippians 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: vi
  text: để biết Ngài, quyền năng của sự sống lại của Ngài, dự phần vào những đau khổ của Ngài[a], và trở nên đồng dạng với sự chết của Ngài[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “có sự thông công trong những đau khổ của Ngài” hoặc “tham dự vào những đau khổ của Ngài.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “đang được làm cho đồng dạng với sự chết của Ngài” hay “được nên giống với sự chết của Ngài.”
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: biết
  rationale: Động từ nguyên mẫu chỉ mục đích trong mạch câu; “biết” vừa tự nhiên vừa giữ được khả năng bao hàm sự nhận biết mang tính tương giao và trải nghiệm.
- source_word: δύναμιν
  choice: quyền năng
  rationale: “Quyền năng” diễn đạt sức mạnh hữu hiệu được bày tỏ trong sự sống lại, đồng thời phù hợp với văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: ἀναστάσεως
  choice: sự sống lại
  rationale: Đây là cách diễn đạt rõ ràng, quen thuộc và chính xác cho biến cố Đấng Christ sống lại.
- source_word: κοινωνίαν
  choice: dự phần vào
  rationale: Trong ngữ cảnh này, κοινωνία nói đến sự tham dự thực sự chứ không chỉ cảm thông hay giao hảo; “dự phần vào” truyền đạt ý đó tự nhiên trong tiếng Việt.
- source_word: παθημάτων
  choice: những đau khổ
  rationale: Dạng số nhiều được thể hiện bằng “những”; “đau khổ” bao quát các khổ nạn mà Phao-lô nói đến.
- source_word: συμμορφιζόμενος
  choice: trở nên giống như
  rationale: Phân từ hiện tại diễn tả một tiến trình đang diễn ra. Cách nói này tự nhiên hơn “được đồng dạng” trong tiếng Việt phổ thông, nhưng không quyết định rõ tác nhân của tiến trình.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: trong sự chết của Ngài
  rationale: Kết hợp với “trở nên giống như Ngài” để tạo câu tiếng Việt tự nhiên, đồng thời vẫn giữ trọng tâm là sự chết của Đấng Christ.
theological_decisions:
- issue: Ý nghĩa của κοινωνίαν παθημάτων αὐτοῦ
  choice: Sự tham dự thực sự vào những đau khổ của Đấng Christ
  alternative: Mối thông công với những đau khổ của Ngài theo nghĩa trừu tượng hơn
  rationale: Nghĩa tham dự của κοινωνία và văn mạch ủng hộ “dự phần”, nhưng chú thích vẫn bảo lưu cách diễn đạt bằng danh từ “sự thông công”.
- issue: Sắc thái của συμμορφιζόμενος
  choice: Một tiến trình trở nên giống Đấng Christ trong sự chết của Ngài
  alternative: Được làm cho đồng dạng với chính sự chết của Ngài
  rationale: Bản dịch chính ưu tiên tiếng Việt tự nhiên; chú thích bảo lưu cấu trúc sát nguyên văn và khả năng sắc thái bị động của phân từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” giữ quy chiếu tôn kính đến Đấng Christ. Câu được giữ ở dạng mệnh đề tiếp nối vì câu 10 phụ thuộc cú pháp vào văn mạch trước đó.
