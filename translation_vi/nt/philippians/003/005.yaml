translation:
  language: vi
  text: được cắt bì vào ngày thứ tám, thuộc dòng dõi Y-sơ-ra-ên, thuộc chi phái Bên-gia-min, là người Hê-bơ-rơ, xuất thân từ những người Hê-bơ-rơ[a]; xét theo Luật pháp, là người Pha-ri-si,
  philosophy: optimal-equivalence
  footnotes:
