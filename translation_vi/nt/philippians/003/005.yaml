    text: 'Hoặc: “một người Hê-bơ-rơ chính gốc.” Cụm từ nhấn mạnh nguồn gốc và căn tính Hê-bơ-rơ của Phao-lô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: được cắt bì vào ngày thứ tám
  rationale: Diễn đạt tự nhiên cấu trúc Hy Lạp cô đọng, đồng thời giữ nguyên dấu hiệu giao ước Do Thái và thời điểm được nhấn mạnh.
- source_word: ἐκ γένους Ἰσραήλ
  choice: thuộc dòng dõi Y-sơ-ra-ên
  rationale: γένος ở đây chỉ nguồn gốc huyết thống hoặc dân tộc; “dòng dõi” truyền đạt rõ lời khẳng định về tổ tiên Y-sơ-ra-ên.
- source_word: φυλῆς Βενιαμίν
  choice: thuộc chi phái Bên-gia-min
  rationale: Cụm sở hữu xác định nguồn gốc bộ tộc; “chi phái” là cách gọi Kinh Thánh quen thuộc và rõ nghĩa trong tiếng Việt.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: là người Hê-bơ-rơ sinh bởi người Hê-bơ-rơ
  rationale: Cách dịch giữ sự nhấn mạnh cô đọng về nguồn gốc và căn tính Hê-bơ-rơ, đồng thời diễn đạt ἐξ tự nhiên hơn trong tiếng Việt; chú thích bảo lưu cách hiểu rộng hơn về cha mẹ và căn tính.
- source_word: κατὰ νόμον
  choice: xét theo Luật Pháp
  rationale: κατά nêu phương diện hoặc chuẩn mực được xét đến. “Xét theo” tự nhiên trong chuỗi liệt kê, còn viết hoa “Luật Pháp” cho thấy đây là Luật Môi-se trong ngữ cảnh.
- source_word: Φαρισαῖος
  choice: người Pha-ri-si
  rationale: Dùng tên phiên âm quen thuộc để chỉ thành viên của nhóm Do Thái này, không thêm cách diễn giải mang tính hệ phái.
theological_decisions:
- issue: Phạm vi ý nghĩa của Ἑβραῖος ἐξ Ἑβραίων
  choice: Giữ trong chính văn ý về nguồn gốc Hê-bơ-rơ qua cách nói “sinh bởi người Hê-bơ-rơ”.
  alternative: “một người Hê-bơ-rơ chính gốc” hoặc “người Hê-bơ-rơ từ những người Hê-bơ-rơ”.
  rationale: Cụm Hy Lạp có thể nhấn mạnh cả cha mẹ Hê-bơ-rơ lẫn căn tính Hê-bơ-rơ sâu đậm. Bản dịch chính không thu hẹp thành một tuyên bố giáo phái hay ngôn ngữ học, và chú thích ghi nhận độ rộng của cách nói.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ nhịp liệt kê của nguyên văn. Dùng các tên phiên âm quen thuộc Y-sơ-ra-ên, Bên-gia-min, Hê-bơ-rơ và Pha-ri-si. Dấu phẩy cuối câu được giữ vì câu 5 tiếp nối cú pháp của phân đoạn.
