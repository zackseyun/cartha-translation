  source_fidelity: Bản nháp truyền đạt đúng đích đến là sự sống lại và giữ được cụm “từ giữa những người chết”. Tuy nhiên, “mong sao” chuyển εἴ πως từ một điều kiện mở (“nếu/bằng cách nào đó”) thành lời ước nguyện, còn “có thể” không diễn đạt rõ nét “bằng cách nào đó” của πως. Cần giữ cấu trúc điều kiện và sự dè dặt về phương cách mà không suy diễn thành nghi ngờ về lời hứa.
  naturalness: “Đạt đến sự sống lại từ giữa những người chết” là cách diễn đạt trang trọng, rõ nghĩa và chấp nhận được trong tiếng Việt hiện đại. “Nếu bằng cách nào đó tôi có thể...” tự nhiên trong một câu được nối với mạch câu trước của Phao-lô, đồng thời gần sát cú pháp nguồn hơn “mong sao...”.
  terminology: “Sự sống lại” là thuật ngữ phù hợp cho ἐξανάστασις. Không cần tạo từ ghép khó hiểu trong chính văn. Chú thích nên giải thích nét “ra khỏi/từ giữa” của dạng từ khác thường, nhưng tránh “ra-sống-lại”, một cấu tạo không tự nhiên trong tiếng Việt.
