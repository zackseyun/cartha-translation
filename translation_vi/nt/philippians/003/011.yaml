  text: εἴ πως καταντήσω εἰς τὴν ἐξανάστασιν ⸂τὴν ἐκ⸃ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/011.yaml
  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: vi
  text: nếu bằng cách nào đó tôi có thể đạt đến sự sống lại từ giữa những người chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “sự sống lại ra khỏi giữa những người chết.” Từ Hy Lạp dùng một hình thức khác thường, có thêm sắc thái “ra khỏi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: mong sao tôi có thể
  rationale: Diễn đạt tự nhiên sắc thái hướng tới một mục tiêu chưa nói rõ cách đạt đến; không biến câu này thành lời nghi ngờ lời hứa của Đức Chúa Trời.
- source_word: καταντήσω
  choice: đạt đến
  rationale: Động từ ở thể giả định chỉ việc tới được một đích; “đạt đến” vừa tự nhiên vừa giữ hình ảnh về mục tiêu.
- source_word: εἰς
  choice: đến
  rationale: Kết hợp tự nhiên với “đạt” để diễn tả sự hướng tới đích.
- source_word: ἐξανάστασιν
  choice: sự sống lại
  rationale: Danh từ chỉ sự phục sinh; cách dịch chuẩn, rõ nghĩa hơn một từ ghép sát chữ khó hiểu, còn sắc thái đặc biệt của từ Hy Lạp được ghi ở chú thích.
- source_word: τὴν ἐκ νεκρῶν
  choice: từ giữa những người chết
  rationale: Giữ rõ giới từ ἐκ và ý nghĩa đứng dậy ra khỏi phạm vi những người chết, đồng thời vẫn dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Liệu ἐξανάστασις có nên được dịch khác hẳn ἀνάστασις để hàm ý một sự sống lại đặc biệt hay không.
  choice: Dịch trong chính văn là “sự sống lại từ giữa những người chết”.
  alternative: “sự sống lại ra khỏi giữa những người chết” hoặc một từ ghép sát chữ tương đương “sự ra-sống-lại”.
  rationale: Từ này rõ ràng nói về sự sống lại, nhưng hình thái khác thường không đủ để áp đặt một loại phục sinh riêng biệt. Chính văn giữ rõ ý “từ giữa những người chết”, còn chú thích bảo tồn nét từ nguyên mà không giải quyết quá mức căng thẳng thần học.
- issue: Sắc thái của εἴ πως có hàm ý Phao-lô nghi ngờ sự sống lại hay không.
  choice: Dùng “mong sao tôi có thể” để giữ sắc thái khiêm nhường và hướng tới mục tiêu.
  alternative: “nếu bằng cách nào đó tôi đạt đến” hoặc “nếu có thể tôi đạt đến”.
  rationale: Cụm Hy Lạp để ngỏ cách thức đạt tới đích, chứ không nhất thiết phủ nhận niềm hy vọng hay lời hứa; bản dịch tránh khẳng định vượt quá văn bản theo cả hai hướng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mong sao” truyền đạt sắc thái khát vọng của εἴ πως; “từ giữa những người chết” giữ nét nghĩa của ἐκ νεκρῶν rõ hơn cách nói quen thuộc nhưng kém cụ thể “từ cõi chết”.
