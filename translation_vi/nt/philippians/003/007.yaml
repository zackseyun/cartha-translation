  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: vi
  text: Nhưng những gì từng là lợi cho tôi, tôi đã xem là tổn thất vì Đấng Mê-si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi đã kể là lỗ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản mạnh với những cơ sở để tin cậy vừa được liệt kê ở các câu trước.
- source_word: ἅτινα
  choice: những gì
  rationale: Đại từ quan hệ bất định bao quát toàn bộ những lợi thế Phao-lô vừa kể, thay vì chỉ một điều riêng lẻ.
- source_word: ἦν μοι κέρδη
  choice: từng là lợi cho tôi
  rationale: Giữ số nhiều theo ý nghĩa tập hợp của κέρδη và bảo tồn ẩn dụ sổ sách về những điều từng được xem là khoản lợi; “từng” diễn đạt trạng thái trước kia trong ngữ cảnh.
- source_word: ἥγημαι
  choice: tôi đã xem
  rationale: Thì hoàn thành diễn tả một sự đánh giá lại đã xảy ra nhưng kết quả vẫn còn hiệu lực; “đã xem” tự nhiên trong tiếng Việt và không làm mất sắc thái nhận định có chủ ý.
- source_word: διὰ τὸν Χριστὸν
  choice: vì Đấng Mê-si
  rationale: διά với đối cách ở đây nêu nguyên nhân hoặc lý do. Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”, không chỉ phiên âm.
- source_word: ζημίαν
  choice: tổn thất
  rationale: Từ số ít đối lập với các “khoản lợi”, duy trì trường nghĩa thương mại và diễn đạt sự đánh giá chung rằng tất cả những lợi thế trước kia nay thành một sự tổn thất.
theological_decisions:
- issue: Cách dịch Χριστόν
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này, Χριστός vẫn mang nội dung tước hiệu “Đấng được xức dầu”. “Đấng Mê-si” bảo tồn ý nghĩa ấy rõ hơn, còn “Đấng Christ” là cách phiên âm quen thuộc trong truyền thống.
- issue: Quan hệ do διὰ với đối cách biểu thị
  choice: vì Đấng Mê-si
  alternative: vì cớ Đấng Mê-si / vì lợi ích của Đấng Mê-si
  rationale: Cấu trúc có thể nhấn mạnh nguyên nhân hoặc động cơ. “Vì” giữ độ rộng tự nhiên của tiếng Việt mà không quyết định quá mức giữa “do” và “vì cớ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc đối chiếu “lợi—tổn thất” giữ ẩn dụ sổ sách của nguyên văn; đảo cụm “vì Đấng Mê-si” lên trước mệnh đề cuối giúp câu tiếng Việt rõ và tự nhiên.
