id: PHP.3.3
reference: Philippians 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: vi
  text: 'Vì chính chúng ta là sự cắt bì: chúng ta thờ phượng nhờ Thần Khí của Đức Chúa Trời,[a] tự hào trong Đấng Mê-si-a Giê-su,[b] và không cậy vào xác thịt.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một dị bản có thể được dịch: “thờ phượng Đức Chúa Trời trong Thần Khí.”'
    reason: textual_variant
  - marker: b
    text: “Mê-si-a” dịch tước hiệu Hy Lạp Christos, nghĩa là “Đấng được xức dầu.”
    reason: lexical_alternative
  - marker: c
    text: “Xác thịt” ở đây chỉ những cơ sở thuộc thân thể hoặc con người mà người ta cậy vào, chẳng hạn như phép cắt bì, nguồn gốc hay địa vị.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: những người được cắt bì
  rationale: Danh từ cụ thể được diễn đạt thành một nhóm người cho tự nhiên trong tiếng Việt, nhưng vẫn giữ hình ảnh cắt bì và lời khẳng định đầy dụng ý của Phao-lô, thay vì giải nghĩa thành “dân thật của Đức Chúa Trời”.
- source_word: πνεύματι θεοῦ
  choice: nhờ Thần Khí của Đức Chúa Trời
  rationale: Cách dịch này hiểu cụm từ theo nghĩa phương tiện hoặc năng lực đến từ Thần Khí Đức Chúa Trời, phù hợp với bản văn SBLGNT và vẫn tránh xác định quá mức sắc thái ngữ pháp.
- source_word: λατρεύοντες
  choice: thờ phượng
  rationale: Động từ chỉ sự phụng sự mang tính tôn giáo; “thờ phượng” là cách nói hiện đại, rõ ràng và tự nhiên nhất trong ngữ cảnh này.
- source_word: καυχώμενοι
  choice: hãnh diện vì
  rationale: Diễn đạt tự nhiên ý lấy Đấng Mê-si-a Giê-su làm căn cứ để hãnh diện, đồng thời duy trì sự tương phản với việc cậy vào xác thịt.
- source_word: Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Giữ Χριστός như một tước hiệu có nghĩa là Mê-si-a, thay vì để nó trở thành một phần tên riêng không được giải thích.
- source_word: σαρκί
  choice: xác thịt
  rationale: Giữ sự chồng lấp giữa thân thể và các lợi thế thuộc con người trong lập luận về cắt bì, nguồn gốc và địa vị; không thu hẹp thành “bản tính tội lỗi”.
- source_word: πεποιθότες
  choice: không cậy vào
  rationale: Diễn tả sự nương dựa hoặc đặt lòng tin một cách vững chắc, đồng thời kết hợp tự nhiên với “xác thịt” trong tiếng Việt.
- source_word: γάρ
  choice: Vì
  rationale: Giữ quan hệ giải thích của câu này với lời cảnh báo ngay trước đó.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong câu này
  choice: “Xác thịt” chủ yếu chỉ những cơ sở thuộc thân thể và con người mà người ta có thể cậy vào, gồm cắt bì, nguồn gốc và địa vị tôn giáo.
  alternative: “Bản tính tội lỗi” như một nguyên lý đạo đức bên trong.
  rationale: Các câu kế tiếp liệt kê phép cắt bì, dân tộc, luật pháp và thành tích của Phao-lô; vì vậy ngữ cảnh hướng đến những ưu thế hữu hình và thuộc con người, dù từ ngữ vẫn giữ được độ rộng vốn có.
- issue: Sắc thái của πνεύματι θεοῦ
  choice: Thần Khí của Đức Chúa Trời là phương tiện hoặc phạm vi của sự thờ phượng.
  alternative: Tâm linh con người, hoặc “thờ phượng Đức Chúa Trời trong tâm linh” theo dị bản.
  rationale: Với cách đọc θεοῦ của SBLGNT, cụm từ tự nhiên nhất quy chiếu đến Thần Khí thuộc về Đức Chúa Trời; giới từ không được thêm vào trong tiếng Hy Lạp nên bản dịch không ép phải chọn tuyệt đối giữa phương tiện và phạm vi.
- issue: Căn tính của “phép cắt bì”
  choice: Phao-lô gọi cộng đồng “chúng ta” là những người được cắt bì theo nghĩa giao ước mà ông đang tái định hướng.
  alternative: Chỉ những người đã chịu nghi thức cắt bì trên thân thể.
  rationale: Ba mệnh đề phân từ sau đó xác định nhóm này bằng sự thờ phượng nhờ Thần Khí, niềm hãnh diện trong Đấng Mê-si-a và việc không cậy vào xác thịt; bản dịch giữ nghịch lý ấy mà không thêm từ “thật”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và “Thần Khí” để diễn đạt rõ θεοῦ và πνεῦμα mà không thêm từ “thánh” vốn không có trong câu. Dấu hai chấm làm rõ rằng các mệnh đề tiếp theo mô tả “những người được cắt bì”.
