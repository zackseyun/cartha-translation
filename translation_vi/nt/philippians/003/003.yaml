revisions:
- from: 'Vì chính chúng ta là những người được cắt bì: chúng ta nhờ Thần Khí của Đức Chúa Trời mà thờ phượng,[a] hãnh diện vì Đấng Mê-si-a Giê-su,[b] và không cậy vào xác thịt.[c]'
  to: 'Vì chính chúng ta là sự cắt bì: chúng ta thờ phượng nhờ Thần Khí của Đức Chúa Trời,[a] tự hào trong Đấng Mê-si-a Giê-su,[b] và không cậy vào xác thịt.[c]'
