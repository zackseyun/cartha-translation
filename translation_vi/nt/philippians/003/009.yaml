id: PHP.3.9
reference: Philippians 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: vi
  text: và được tìm thấy trong Ngài, không có sự công chính riêng của tôi đến từ luật pháp[b], nhưng có sự công chính nhờ đức tin nơi Đấng Mê-si[a]—tức sự công chính đến từ Đức Chúa Trời, dựa trên đức tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nhờ lòng thành tín của Đấng Mê-si.”'
    reason: alternative_reading
  - marker: b
    text: Từ được dịch là “sự công chính” ở cả hai chỗ cũng có thể dịch là “công lý”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: được thấy là
  rationale: Giữ sắc thái bị động của động từ và diễn tả việc Phao-lô được nhận thấy trong một tình trạng nhất định, mà không thêm ý xét xử hay khám phá.
- source_word: ἐν αὐτῷ
  choice: ở trong Ngài
  rationale: Bảo toàn cách nói cô đọng của Phao-lô về mối liên hệ với Đấng Mê-si, không thu hẹp thành một lối giải thích như “hiệp một với Ngài”.
- source_word: μὴ ἔχων
  choice: không có
  rationale: Diễn đạt tự nhiên trạng thái đi kèm với việc được thấy là ở trong Ngài.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Đây là cách dịch quen thuộc và phù hợp trong văn mạch Phao-lô; khả năng dịch theo phạm vi nghĩa “công lý” được giữ trong chú thích.
- source_word: τὴν ἐκ νόμου
  choice: đến từ luật pháp
  rationale: Thể hiện rõ luật pháp là nguồn của thứ công chính được nói đến, đồng thời dùng tiếng Việt tự nhiên.
- source_word: διὰ πίστεως Χριστοῦ
  choice: nhờ đức tin nơi Đấng Mê-si
  rationale: Chọn cách hiểu sở hữu cách khách thể nhưng không che giấu cách hiểu sở hữu cách chủ thể; phương án “nhờ lòng thành tín của Đấng Mê-si” được nêu trong chú thích.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Giữ chức danh mang ý nghĩa đấng được xức dầu thay vì biến nó thành một tên riêng thuần túy.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: sự công chính đến từ Đức Chúa Trời
  rationale: Giữ sự lặp lại có chủ ý của δικαιοσύνη và nhấn mạnh Đức Chúa Trời là nguồn.
- source_word: ἐπὶ τῇ πίστει
  choice: dựa trên đức tin
  rationale: Diễn đạt tự nhiên ý nghĩa nền tảng hoặc cơ sở của ἐπί với tặng cách.
theological_decisions:
- issue: Ý nghĩa của πίστεως Χριστοῦ
  choice: đức tin nơi Đấng Mê-si
  alternative: lòng thành tín của Đấng Mê-si
  rationale: Cấu trúc sở hữu cách này thực sự có thể được hiểu theo khách thể hoặc chủ thể. Bản chính dùng cách hiểu “tin nơi Đấng Mê-si”, còn chú thích bảo lưu cách hiểu “Đấng Mê-si thành tín”.
- issue: Cách dịch δικαιοσύνη trong văn mạch Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” phù hợp với văn mạch nói về địa vị hoặc sự ngay chính đến từ Đức Chúa Trời; chú thích vẫn cho biết phạm vi nghĩa có thể bao gồm “công lý”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc đối lập của nguyên văn giữa sự công chính riêng đến từ luật pháp và sự công chính đến từ Đức Chúa Trời. Đại từ “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt mà không thêm nội dung thần học.
