  to: và được tìm thấy trong Ngài, không có sự công chính riêng của tôi đến từ luật pháp[b], nhưng có sự công chính nhờ đức tin nơi Đấng Mê-si[a]—tức sự công chính đến từ Đức Chúa Trời, dựa trên đức tin.
