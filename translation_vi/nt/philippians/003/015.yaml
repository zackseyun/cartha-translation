  to: Vậy, những ai trong chúng ta trưởng thành thì hãy suy nghĩ như thế[a]. Nếu anh chị em suy nghĩ khác về điều nào, Đức Chúa Trời cũng sẽ bày tỏ điều đó cho anh chị em.
