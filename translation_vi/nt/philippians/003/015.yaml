id: PHP.3.15
reference: Philippians 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: vi
  text: Vậy, những ai trong chúng ta trưởng thành thì hãy suy nghĩ như thế[a]. Nếu anh chị em suy nghĩ khác về điều nào, Đức Chúa Trời cũng sẽ bày tỏ điều đó cho anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hãy có tâm niệm này.” Từ Hy Lạp τέλειοι cũng có thể dịch là “trọn vẹn”; trong ngữ cảnh này, từ ấy có lẽ chỉ sự trưởng thành thuộc linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὅσοι
  choice: tất cả chúng ta, là những người
  rationale: Giữ phạm vi bao quát và sắc thái tự kể mình vào nhóm của Phao-lô, thay vì dịch máy móc là “bao nhiêu người”.
- source_word: τέλειοι
  choice: trưởng thành
  rationale: Trong ngữ cảnh Phao-lô vừa nói mình chưa đạt đến đích hay trở nên trọn vẹn, từ này hợp lý nhất khi chỉ sự trưởng thành; chú thích vẫn giữ nghĩa từ vựng có thể là “trọn vẹn”.
- source_word: τοῦτο φρονῶμεν
  choice: hãy suy nghĩ như thế
  rationale: Thể giả định mang chức năng khích lệ được diễn đạt bằng “hãy”; “như thế” hướng về thái độ và định hướng đã trình bày ở phần trước.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: nếu trong điều gì anh chị em suy nghĩ khác đi
  rationale: Giữ nguyên tính điều kiện, phạm vi mở của τι và sự chuyển từ ngôi thứ nhất số nhiều sang ngôi thứ hai số nhiều.
- source_word: ἀποκαλύψει
  choice: sẽ bày tỏ
  rationale: Truyền đạt trực tiếp hành động mặc khải hoặc làm cho biết của Đức Chúa Trời mà không giải thích thêm nội dung hay phương thức.
theological_decisions:
- issue: Ý nghĩa của τέλειοι trong lời khích lệ
  choice: trưởng thành
  alternative: trọn vẹn
  rationale: Mạch văn không ủng hộ việc hiểu rằng Phao-lô tuyên bố nhóm này đã đạt sự hoàn hảo tuyệt đối, vì ông vừa nói mình chưa đạt đến. Tuy vậy, nghĩa “trọn vẹn” vẫn là khả năng từ vựng chân thực nên được giữ trong chú thích.
- issue: Chủ thể và sự chuyển đổi đại từ
  choice: giữ “chúng ta” trong lời khích lệ và “anh chị em” trong mệnh đề điều kiện
  alternative: đồng nhất cả hai thành một ngôi
  rationale: Bản Hy Lạp chuyển từ φρονῶμεν ở ngôi thứ nhất số nhiều sang φρονεῖτε và ὑμῖν ở ngôi thứ hai số nhiều; giữ sự chuyển đổi này bảo toàn sắc thái Phao-lô vừa đồng hành vừa trực tiếp nói với độc giả.
- issue: Điều Đức Chúa Trời sẽ bày tỏ
  choice: điều ấy
  alternative: cách suy nghĩ đúng
  rationale: Đại từ τοῦτο không nói rõ thêm nội dung; bản dịch giữ cách quy chiếu rộng để không tự ý xác định cơ chế hoặc nội dung của sự bày tỏ.
translation_notes:
  register: Văn phong trang trọng vừa phải, tự nhiên và dễ hiểu đối với độc giả Việt Nam hiện đại. “Anh chị em” diễn đạt ngôi thứ hai số nhiều theo cách bao gồm cả nam lẫn nữ; câu giữ nguyên sự chuyển đổi đại từ trong nguyên văn.
