source:
  edition: SBLGNT
  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: vi
  text: Tôi dốc sức tiến về phía mục tiêu để nhận phần thưởng của lời kêu gọi hướng lên cao của Đức Chúa Trời trong Đấng Mê-si-a Giê-su[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời kêu gọi từ trên cao” hoặc “lời kêu gọi thiên thượng.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: “trong Christō Iēsou”; ở đây Χριστός được dịch là “Đấng Mê-si-a” vì từ này mang ý nghĩa tước hiệu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: tiến tới mục tiêu
  rationale: Cụm từ mang sắc thái ẩn dụ điền kinh, chỉ sự vận động có định hướng về một đích cố định. Cách dịch này tự nhiên trong tiếng Việt và giữ được hình ảnh cuộc đua.
- source_word: διώκω
  choice: tôi dốc sức tiến tới
  rationale: Động từ có thể có nghĩa là “theo đuổi”; trong ngữ cảnh này, nó diễn tả nỗ lực mạnh mẽ và liên tục hướng về phía trước. “Dốc sức tiến tới” truyền đạt cường độ ấy mà không thêm ý chắc chắn đạt được.
- source_word: εἰς τὸ βραβεῖον
  choice: để giành phần thưởng
  rationale: εἰς ở đây nêu mục tiêu của nỗ lực. “Để giành phần thưởng” là cách diễn đạt tự nhiên trong tiếng Việt và làm rõ chức năng mục đích trong hình ảnh cuộc đua.
- source_word: ἄνω
  choice: lên cao
  rationale: “Lên cao” giữ hướng không gian của ἄνω và không loại bỏ các khả năng hiểu là hướng lên, từ trên cao, hoặc thuộc về trời.
- source_word: κλήσεως τοῦ θεοῦ
  choice: lời kêu gọi ... của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu gần với nguyên văn và để ngỏ sắc thái lời kêu gọi thuộc về, phát xuất từ, hay do Đức Chúa Trời ban.
- source_word: Χριστῷ
  choice: Đấng Mê-si-a
  rationale: Χριστός vẫn có chức năng tước hiệu trong cụm này; “Đấng Mê-si-a” làm rõ ý nghĩa tước hiệu thay vì chỉ phiên âm thành một tên riêng.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ trực tiếp giới từ ἐν và ngôn ngữ kết hiệp đặc trưng của Phao-lô, không diễn giải quan hệ này theo một hệ phái cụ thể.
theological_decisions:
- issue: Ý nghĩa của ἄνω κλήσεως
  choice: lời kêu gọi lên cao
  alternative: lời kêu gọi từ trên cao; lời kêu gọi thiên thượng
  rationale: Cách dịch chính giữ được hướng đi lên trong hình ảnh cuộc đua, đồng thời không khép lại khả năng lời kêu gọi phát xuất từ Đức Chúa Trời ở trên cao hoặc có tính chất thiên thượng.
- issue: Quan hệ của cụm ἐν Χριστῷ Ἰησοῦ
  choice: giữ cụm “trong Đấng Mê-si-a Giê-su” ở cuối câu
  alternative: diễn giải rằng Đức Chúa Trời kêu gọi người tin qua hoặc nhờ Đấng Mê-si-a Giê-su
  rationale: Vị trí và cách dịch sát cấu trúc Hy Lạp bảo tồn độ mở về việc cụm giới từ bổ nghĩa cho lời kêu gọi, hành động kêu gọi, hay toàn bộ thực tại cứu rỗi được nói đến, thay vì giải quyết ngầm một quan hệ thần học.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Dốc sức tiến tới” truyền đạt sức nặng của διώκω; “lời kêu gọi lên cao” hơi cô đọng nhưng chủ ý giữ hình ảnh và sự mơ hồ của nguyên văn. Các danh xưng “Đức Chúa Trời” và “Đấng Mê-si-a Giê-su” được dùng nhất quán, không đưa vào thuật ngữ riêng của một hệ phái.
