    rationale: “Christ Jesus” là dạng tiếng Anh. Chú thích cần dẫn đúng dạng Hy Lạp Χριστῷ Ἰησοῦ, rồi giải thích bản dịch “trong Đấng Mê-si-a Giê-su”.
