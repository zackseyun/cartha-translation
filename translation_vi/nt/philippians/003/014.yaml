    issue: “lời kêu gọi lên cao” mơ hồ và không tự nhiên
    rationale: Cụm này có thể gợi một lời kêu gọi tự nó đi lên. Cách “lời kêu gọi hướng lên cao” biểu đạt tự nhiên hơn ý “upward call”, vẫn bảo toàn độ mở trước các cách hiểu “từ trên cao” và “thiên thượng” được nêu ở chú thích.
  - severity: low
