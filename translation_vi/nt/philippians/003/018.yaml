id: PHP.3.18
reference: Philippians 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: vi
  text: Vì có nhiều người sống như những kẻ thù của thập tự giá của Đấng Mê-si-a[a]—những người mà tôi đã nhiều lần nói với anh chị em về họ, và nay tôi còn vừa khóc vừa nói với anh chị em về họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ.”'
    reason: Nêu cách phiên chuyển truyền thống của tước hiệu Χριστός bên cạnh cách dịch theo nghĩa “Đấng Mê-si-a” trong chính văn.
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ, chỉ một số đông mà không thêm sắc thái nào khác.
- source_word: γὰρ
  choice: vì
  rationale: Liên từ nêu lý do cho lời khuyên ở câu trước; “vì” diễn đạt trực tiếp quan hệ giải thích này.
- source_word: περιπατοῦσιν
  choice: sống
  rationale: Động từ theo nghĩa đen là “bước đi”, nhưng ở đây được Phao-lô dùng theo nghĩa ẩn dụ về nếp sống. “Sống” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: tôi đã nhiều lần nói với anh chị em
  rationale: Thể chưa hoàn thành cùng πολλάκις diễn tả hành động lặp lại trong quá khứ; cách dịch này giữ rõ ý ấy.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: giờ đây tôi vừa khóc vừa nói lại điều ấy
  rationale: Phân từ hiện tại κλαίων mô tả Phao-lô đang khóc khi nói. “Vừa khóc vừa nói” giữ tính đồng thời và cảm xúc trực tiếp; “lại điều ấy” làm rõ sự tương phản giữa việc từng nói và nay tiếp tục nói.
- source_word: ἐχθροὺς
  choice: những kẻ thù
  rationale: Từ này chỉ những người chống nghịch; “kẻ thù” giữ nguyên sức nặng của cách gọi trong nguồn.
- source_word: σταυροῦ
  choice: thập tự giá
  rationale: Danh từ chỉ cây thập tự và, trong ngữ cảnh này, cái chết trên thập tự cùng ý nghĩa thần học của nó; đây là cách dịch quen thuộc và trực tiếp.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός mang chức năng tước hiệu trong cụm sở hữu “thập tự giá của Đấng Mê-si-a”; cách dịch này biểu đạt nội dung của tước hiệu thay vì coi đó đơn thuần là tên riêng.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm τοῦ σταυροῦ τοῦ Χριστοῦ
  choice: thập tự giá Đấng Mê-si-a
  alternative: thập tự giá Đấng Christ
  rationale: Ngữ cảnh không đòi hỏi cách dùng như tên riêng, nên giữ nghĩa tước hiệu của Χριστός. Cấu trúc tiếng Việt lược “của” vẫn biểu đạt rõ quan hệ sở hữu và trang trọng.
- issue: Quan hệ cú pháp giữa πολλοὶ περιπατοῦσιν và τοὺς ἐχθροὺς
  choice: nhiều người sống như những kẻ thù
  alternative: nhiều người… là những kẻ thù
  rationale: Câu Hy Lạp có sự lệch cấu trúc với τοὺς ἐχθρούς ở đối cách. Cách dịch “sống như những kẻ thù” nối tự nhiên với περιπατοῦσιν và không biến lời mô tả nếp sống thành một mệnh đề đồng nhất cứng hơn nguồn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu dài Hy Lạp được chia thành hai câu tiếng Việt để tránh cấu trúc rườm rà, trong khi vẫn giữ trình tự: nếp sống của nhiều người, lời nhắc trước đây, và nỗi đau hiện tại của Phao-lô.'
