id: PHP.3.1
reference: Philippians 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: vi
  text: Sau cùng[a], thưa anh chị em của tôi[b], hãy vui mừng trong Chúa. Việc viết lại cùng những điều ấy cho anh chị em không phải là điều phiền cho tôi[c], mà lại là sự bảo đảm cho anh chị em[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Về phần còn lại” hoặc “Từ nay trở đi.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp mang hình thức “anh em” nhưng ở đây dùng để gọi toàn thể hội chúng, tức cả anh em lẫn chị em.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “không phiền hà đối với tôi” hoặc “không làm tôi mệt mỏi.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “là một sự bảo vệ cho anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Sau cùng
  rationale: Cụm từ chuyển ý này có thể mang nghĩa “sau cùng”, “còn lại” hoặc “từ nay trở đi”. “Sau cùng” tự nhiên trong tiếng Việt, còn các khả năng khác được giữ trong chú thích.
- source_word: ἀδελφοί μου
  choice: anh chị em của tôi
  rationale: Danh từ số nhiều giống đực được dùng để gọi toàn thể hội chúng. Tiếng Việt tự nhiên dùng “anh chị em” để thể hiện đúng phạm vi bao gồm cả nam lẫn nữ; “của tôi” giữ lại đại từ sở hữu μου.
- source_word: χαίρετε
  choice: hãy vui mừng
  rationale: Thể mệnh lệnh số nhiều của χαίρω được chuyển bằng “hãy vui mừng”, giữ rõ lực khuyên bảo và cách dùng đặc trưng của Phao-lô.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cấu trúc thần học cô đọng, đặt niềm vui trong mối liên hệ với Chúa mà không giải nghĩa quá mức.
- source_word: τὰ αὐτά
  choice: những điều ấy
  rationale: 'Cách dịch để ngỏ đối tượng quy chiếu như nguyên văn: có thể là những lời khuyên được lặp lại hoặc giáo huấn trước đó nói chung.'
- source_word: γράφειν
  choice: viết lại
  rationale: “Viết lại” diễn đạt tự nhiên hành động viết cùng những điều đã nói hoặc viết trước đó, dựa trên τὰ αὐτά, nhưng không xác định cụ thể nội dung.
- source_word: οὐκ ὀκνηρόν
  choice: không khiến tôi ngại
  rationale: ὀκνηρός trong ngữ cảnh này nói đến điều gây ngại ngần, miễn cưỡng hoặc phiền nhọc. Cách dịch này tự nhiên và không thu hẹp nghĩa thành sự nhàm chán.
- source_word: ἀσφαλές
  choice: điều bảo đảm an toàn
  rationale: Tính từ ἀσφαλές mang ý an toàn, chắc chắn hoặc bảo vệ. Cấu trúc danh hóa này rõ nghĩa trong tiếng Việt, còn sắc thái “sự bảo vệ” được nêu ở chú thích.
theological_decisions:
- issue: Cách xưng hô với toàn thể hội chúng
  choice: anh chị em của tôi
  alternative: các anh em của tôi
  rationale: Dù ἀδελφοί mang hình thức giống đực, trong ngữ cảnh nó hướng đến toàn thể hội chúng. “Anh chị em” truyền đạt phạm vi quy chiếu ấy một cách tự nhiên trong tiếng Việt mà không thêm một nhóm người ngoài đối tượng nguyên văn.
- issue: Ý nghĩa bảo vệ của việc Phao-lô viết lại
  choice: điều bảo đảm an toàn cho anh chị em
  alternative: một sự bảo vệ cho anh chị em
  rationale: Bản dịch chính giữ nghĩa trực tiếp về sự an toàn hoặc chắc chắn, không xác định thêm loại nguy cơ hay cơ chế bảo vệ mà nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời khuyên gửi cho cộng đồng. Dùng “thưa anh chị em của tôi” để tái hiện lời gọi trực tiếp thân tình; tránh từ Hán-Việt khó hiểu và không giải quyết quá mức các điểm mơ hồ của Τὸ λοιπόν, τὰ αὐτά và ἀσφαλές.
