  source_fidelity: 'Bản dịch truyền đạt đúng mệnh lệnh bị động γνωσθήτω (“Hãy để ... được ... biết đến”), phạm vi phổ quát của πᾶσιν ἀνθρώποις (“mọi người”), và giữ được tính hàm súc của ὁ κύριος ἐγγύς bằng “Chúa ở gần.” “Lòng khoan hòa” diễn đạt phù hợp trường nghĩa của τὸ ἐπιεικές: một phẩm chất cư xử biết điều, mềm dẻo, nhường nhịn và rộng lượng, không thu hẹp chỉ còn sự dịu dàng.'
