id: PHP.4.5
reference: Philippians 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: vi
  text: Hãy để lòng khoan hòa của anh chị em được mọi người biết đến.[a] Chúa ở gần.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng dịu dàng,” “sự nhường nhịn” hoặc “tính phải lẽ.”
    reason: lexical_alternative
  - marker: b
    text: “Chúa ở gần” có thể có nghĩa là Chúa đang hiện diện gần bên, ngày Chúa đến đã gần, hoặc bao hàm cả hai ý.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: lòng khoan hòa
  rationale: “Khoan hòa” diễn đạt cách cư xử dịu dàng, biết nhường nhịn, rộng lượng và có lý có tình; vì vậy rộng hơn “nhu mì” và phù hợp với phẩm chất đạo đức mà từ Hy Lạp chỉ đến.
- source_word: γνωσθήτω
  choice: hãy để ... được ... biết đến
  rationale: Cách dịch này giữ sắc thái mệnh lệnh và thể bị động của động từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
- source_word: πᾶσιν ἀνθρώποις
  choice: mọi người
  rationale: Diễn đạt đầy đủ ý bao quát của cụm từ Hy Lạp bằng tiếng Việt hiện đại, tự nhiên và không giới hạn giới tính.
- source_word: κύριος
  choice: Chúa
  rationale: “Chúa” là cách gọi trang trọng, quen thuộc trong tiếng Việt và giữ được sức nặng thần học của tước hiệu κύριος.
- source_word: ἐγγύς
  choice: ở gần
  rationale: “Ở gần” không ấn định rằng câu chỉ nói về sự hiện diện gần gũi hay thời điểm Chúa đến đã gần, nhờ đó duy trì độ mở của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của ὁ κύριος ἐγγύς
  choice: Chúa ở gần
  alternative: Chúa sắp đến
  rationale: Câu Hy Lạp có thể chỉ Chúa hiện diện gần bên, việc Chúa đến đã gần, hoặc đồng thời cả hai. Bản văn chính giữ nguyên sự căng mở này thay vì thu hẹp vào một cách hiểu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμῶν theo lối xưng hô cộng đồng tự nhiên; “lòng khoan hòa” tránh thu hẹp ἐπιεικές vào riêng tính khí dịu dàng.
