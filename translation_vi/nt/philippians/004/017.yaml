  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: vi
  text: Không phải là tôi tìm kiếm món quà, nhưng tôi tìm kiếm hoa lợi đang gia tăng cho tài khoản của anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoa lợi dồi dào được ghi có vào tài khoản của anh chị em.”'
    reason: Nêu cách diễn đạt khác cho πλεονάζοντα εἰς λόγον ὑμῶν, làm rõ sắc thái gia tăng/dồi dào và hình ảnh ghi có trong sổ sách.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: tìm kiếm
  rationale: Diễn đạt hành động chủ động mong tìm và giữ nguyên sự lặp lại tạo thế tương phản trong câu.
- source_word: τὸ δόμα
  choice: quà tặng
  rationale: Chỉ món quà người Phi-líp đã gửi; cách dịch trực tiếp này không thêm ý “chính món quà” vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: τὸν καρπὸν
  choice: hoa lợi
  rationale: Vừa giữ hình ảnh καρπός là sản phẩm sinh ra, vừa phù hợp với ngôn ngữ sổ sách của εἰς λόγον ὑμῶν; “hoa lợi” tự nhiên hơn “trái” trong kết cấu này mà không thu hẹp thành lợi ích vật chất.
- source_word: τὸν πλεονάζοντα
  choice: gia tăng
  rationale: Giữ sắc thái tăng thêm, dồi dào của phân từ hiện tại và bổ nghĩa tự nhiên cho “hoa lợi”.
- source_word: εἰς λόγον ὑμῶν
  choice: vào tài khoản của anh chị em
  rationale: Giữ ẩn dụ thương mại, sổ sách trong văn cảnh, theo đó hoa lợi được ghi tăng vào phần của người nhận thư.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Không phải ... nhưng
  rationale: Giữ cấu trúc đính chính và tương phản của nguyên bản bằng lối nói rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Bản chất của “hoa lợi” được ghi vào tài khoản
  choice: Giữ nguyên ẩn dụ “hoa lợi” và “tài khoản” mà không xác định cụ thể đó là phần thưởng, công đức hay lợi ích vật chất.
  alternative: Diễn giải thành “phước lành” hoặc “phần thưởng” dành cho anh chị em.
  rationale: Nguyên văn phối hợp hình ảnh sinh trưởng với ngôn ngữ sổ sách nhưng không giải thích chính xác bản chất của khoản gia tăng; bản dịch nên bảo tồn độ mở thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng tín hữu; giữ sự đan xen giữa hình ảnh hoa lợi và ngôn ngữ tài khoản trong nguyên bản.
