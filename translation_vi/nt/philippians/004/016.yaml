    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Dẫn vào mệnh đề giải thích nguyên do trong văn cảnh; “vì” là liên từ tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: ἐν Θεσσαλονίκῃ
  choice: khi ở Tê-sa-lô-ni-ca
  rationale: Diễn đạt địa điểm gắn với hoàn cảnh của Phao-lô bằng tiếng Việt tự nhiên, không thêm ý ngoài văn cảnh.
- source_word: ἅπαξ καὶ δὶς
  choice: không chỉ một mà đến hai lần
  rationale: Giữ được cách nhấn mạnh rằng hội thánh đã gửi nhiều lần, đồng thời tránh lối dịch từng chữ thiếu tự nhiên trong tiếng Việt.
- source_word: εἰς τὴν χρείαν μοι
  choice: đáp ứng nhu cầu của tôi
  rationale: Phản ánh χρεία ở số ít và làm rõ mục đích của điều được gửi đến mà không xác định cụ thể vật phẩm.
- source_word: ἐπέμψατε
  choice: anh chị em cũng đã gửi đến
  rationale: Giữ động từ “gửi” không thêm tân ngữ như tiền bạc hay trợ giúp; “anh chị em” biểu đạt đại từ số nhiều hướng đến cộng đồng tín hữu.
