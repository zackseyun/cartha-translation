  - severity: low
    issue: Neo chú thích đặt ở cuối cả câu thay vì cạnh cụm ἐν Χριστῷ Ἰησοῦ.
    rationale: Chú thích chỉ liên quan đến cách dịch “Đấng Mê-si-a Giê-su”; đặt neo ngay sau cụm này làm phạm vi chú thích rõ ràng.
