source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: vi
  text: Và sự bình an của Đức Chúa Trời, vượt trên mọi sự hiểu biết, sẽ canh giữ lòng và tâm trí anh chị em trong Đấng Mê-si-a Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong Đấng Christ Giê-su.”'
    reason: Cách diễn đạt truyền thống tương ứng với cụm Hy Lạp ἐν Χριστῷ Ἰησοῦ.
lexical_decisions:
- source_word: εἰρήνη τοῦ θεοῦ
  choice: sự bình an của Đức Chúa Trời
  rationale: Giữ nguyên cấu trúc sở hữu của tiếng Hy Lạp, không thu hẹp thành chỉ “sự bình an đến từ Đức Chúa Trời”; “bình an” tự nhiên và vẫn bao hàm trạng thái toàn vẹn.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: là sự bình an vượt trên mọi sự hiểu biết
  rationale: Diễn đạt rõ quan hệ bổ nghĩa của phân từ ὑπερέχουσα, đồng thời giữ độ rộng của πάντα νοῦν thay vì tự ý thêm “của con người”.
- source_word: φρουρήσει
  choice: sẽ canh giữ
  rationale: “Canh giữ” bảo tồn sắc thái bảo vệ, canh phòng mạnh và có thể gợi hình ảnh quân sự của động từ Hy Lạp.
- source_word: τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν
  choice: lòng và tâm trí của anh chị em
  rationale: “Lòng” giữ nghĩa Kinh Thánh về đời sống nội tâm; “tâm trí” diễn đạt tự nhiên lĩnh vực suy nghĩ của νοήματα. “Anh chị em” thể hiện đại từ ngôi hai số nhiều mà không giới hạn giới tính.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a là Giê-su
  rationale: Dịch Χριστός như một tước hiệu có ý nghĩa và dùng cấu trúc tiếng Việt tự nhiên để xác định Giê-su là Đấng Mê-si-a; “trong” giữ ý niệm về phạm vi hiệp nhất và an toàn nơi ngài.
theological_decisions:
- issue: Cách dịch công thức ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a là Giê-su
  alternative: trong Đấng Christ Giê-su
  rationale: Bản chính dịch tước hiệu Χριστός thay vì coi đó đơn thuần là tên riêng, nhưng chú thích vẫn cho biết lối phiên âm truyền thống để không che khuất hình thức Hy Lạp.
- issue: Quan hệ nghĩa của τοῦ θεοῦ
  choice: của Đức Chúa Trời
  alternative: đến từ Đức Chúa Trời
  rationale: Cấu trúc sở hữu giữ được sự mơ hồ chính đáng giữa nguồn gốc, đặc tính và mối liên hệ với Đức Chúa Trời, thay vì chỉ quyết định theo nghĩa nguồn gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều; tránh thuật ngữ giáo phái. Cụm lặp “là sự bình an” làm rõ quan hệ ngữ pháp trong tiếng Việt mà không giải nghĩa quá mức.
