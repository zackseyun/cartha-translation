revisions:
- from: Và sự bình an của Đức Chúa Trời, là sự bình an vượt trên mọi sự hiểu biết, sẽ canh giữ lòng và tâm trí của anh chị em trong Đấng Mê-si-a là Giê-su.[a]
  to: Và sự bình an của Đức Chúa Trời, vượt trên mọi sự hiểu biết, sẽ canh giữ lòng và tâm trí anh chị em trong Đấng Mê-si-a Giê-su.[a]
  rationale: Chỉnh sửa chỉ nhằm bỏ sự lặp từ không có trong nguyên văn, làm rõ neo chú thích, và chuẩn hóa chú thích thành một phương án dịch. Ý nghĩa, sắc thái bảo vệ của φρουρήσει, đại từ số nhiều, và cách dịch tước hiệu Χριστός đều được giữ nguyên.
