id: PHP.4.2
reference: Philippians 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: vi
  text: Tôi khuyên chị Ê-u-ô-đi-a, và tôi khuyên chị Sin-ti-che hãy có cùng một tâm trí trong Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy đồng tâm trong Chúa” hoặc “hãy đồng thuận trong Chúa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Ê-u-ô-đi-a
  rationale: Phiên âm tên riêng theo cách rõ âm tiết, quen thuộc và dễ đọc trong tiếng Việt; không dịch nghĩa tên.
- source_word: παρακαλῶ
  choice: tôi khuyên
  rationale: Diễn đạt lời kêu gọi tha thiết nhưng mang tính mục vụ, tự nhiên trong tiếng Việt. Giữ sự lặp lại của động từ qua cụm “và cũng khuyên” vì Phao-lô trực tiếp kêu gọi từng người.
- source_word: Συντύχην
  choice: Sin-ti-che
  rationale: Phiên âm tên riêng Hy Lạp sang tiếng Việt, không dịch nghĩa tên.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: hãy đồng tâm
  rationale: “Đồng tâm” chuyển tải sự cùng chung suy nghĩ và thái độ, không thu hẹp câu chỉ còn sự đồng ý về một vấn đề; đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ cấu trúc cô đọng của nguyên văn và cho thấy sự đồng tâm được đặt trong mối liên hệ với Chúa, thay vì chỉ là hòa giải giữa cá nhân.
theological_decisions:
- issue: Phạm vi ý nghĩa của τὸ αὐτὸ φρονεῖν
  choice: đồng tâm
  alternative: cùng một suy nghĩ; đồng thuận
  rationale: Không giải thích cụm từ thành sự nhất trí tuyệt đối về mọi chi tiết, cũng không thu hẹp thành việc giải quyết một bất đồng cụ thể; giữ sắc thái về chung một tâm hướng trong Chúa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Thêm danh xưng “chị” trước hai tên nữ để câu tiếng Việt tự nhiên và biểu thị cách xưng gọi tôn trọng; danh xưng này được áp dụng cân xứng cho cả hai người. Dấu chú thích [a] đặt ngay sau cụm cần giải thích.
