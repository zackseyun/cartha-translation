id: PHP.4.10
reference: Philippians 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: vi
  text: Tôi rất vui mừng trong Chúa vì nay cuối cùng, lòng quan tâm của anh chị em dành cho tôi lại nở rộ[a]. Quả thật, anh chị em cũng quan tâm đến tôi[b], nhưng không có cơ hội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “anh chị em lại nở rộ trong việc nghĩ đến tôi”; hình ảnh gợi một cây lại đâm chồi hoặc trổ hoa.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “anh chị em cũng nghĩ đến tôi”; động từ Hy Lạp có thể chỉ việc suy nghĩ, có lòng hướng về hoặc quan tâm đến một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Tôi rất vui mừng
  rationale: Diễn đạt trực tiếp động từ χαίρω ở thì aorist; kết hợp với μεγάλως thành câu tiếng Việt tự nhiên mà vẫn giữ mức độ nhấn mạnh.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên thành ngữ thần học đặc trưng của Phao-lô, có thể chỉ phạm vi hoặc nền tảng của niềm vui.
- source_word: μεγάλως
  choice: rất
  rationale: Trạng từ này bổ nghĩa cho sự vui mừng; “rất vui mừng” tự nhiên hơn “vui mừng cách lớn lao” trong tiếng Việt hiện đại.
- source_word: ἤδη ποτὲ
  choice: cuối cùng
  rationale: Chuyển tải ý một điều lại xảy ra sau một khoảng thời gian, nhưng không nhất thiết hàm ý trách móc.
- source_word: ἀνεθάλετε
  choice: lại làm ... nở rộ
  rationale: Giữ hình ảnh thực vật của động từ, theo nghĩa đen là nảy nở hoặc trổ hoa trở lại, đồng thời đặt trong cấu trúc tiếng Việt dễ hiểu.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: lòng quan tâm đến tôi
  rationale: Trong ngữ cảnh này φρονέω không chỉ là suy nghĩ mà là có lòng hướng về và quan tâm thực tế đến Phao-lô.
- source_word: ἐφ’ ᾧ
  choice: Thật ra
  rationale: 'Diễn đạt tự nhiên chức năng giải thích và đính chính: sự quan tâm của họ vốn không hề mất đi.'
- source_word: ἐφρονεῖτε
  choice: anh chị em vẫn quan tâm đến tôi
  rationale: Giữ sự liên hệ từ vựng với φρονεῖν trước đó và dùng “vẫn” để nêu rõ sự quan tâm tiếp tục tồn tại.
- source_word: ἠκαιρεῖσθε
  choice: không có dịp thuận tiện
  rationale: Cho thấy điều họ thiếu là cơ hội thích hợp, chứ không phải ý muốn hay lòng quan tâm.
theological_decisions:
- issue: Ý nghĩa của ἐν κυρίῳ
  choice: trong Chúa
  alternative: nhờ Chúa
  rationale: Giữ cách diễn đạt rộng và có chủ ý mơ hồ của Phao-lô, không thu hẹp cụm từ chỉ còn quan hệ nguyên nhân hay phương tiện.
- issue: Sự liên tục trong lòng quan tâm của tín hữu Phi-líp
  choice: vẫn quan tâm đến tôi
  alternative: đã quan tâm đến tôi
  rationale: Câu sau giải tỏa khả năng hiểu lầm rằng họ từng thôi quan tâm; trở ngại là thiếu cơ hội, không phải thiếu thiện chí.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để nói với toàn thể hội chúng. Giữ hình ảnh “nở rộ” trong chính văn vì đây là ẩn dụ nổi bật của nguyên ngữ, đồng thời giải thích trong chú thích để tránh tối nghĩa.
