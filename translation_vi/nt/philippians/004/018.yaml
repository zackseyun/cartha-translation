id: PHP.4.18
reference: Philippians 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: vi
  text: Nhưng tôi đã nhận đủ mọi sự[a] và đang có dư dật. Tôi đã được cung ứng đầy đủ, sau khi nhận từ Ép-ba-phô-đích những gì anh em gửi đến—một hương thơm ngào ngạt, một sinh tế được chấp nhận, đẹp lòng Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi có đầy đủ” hoặc “tôi đã nhận đủ khoản thanh toán.”'
    reason: Động từ Hy Lạp ἀπέχω có thể chỉ việc đã nhận trọn, và trong một số ngữ cảnh mang sắc thái thương mại là đã nhận đủ khoản phải trả.
lexical_decisions:
- source_word: ἀπέχω
  choice: đã nhận đủ
  rationale: Trong bối cảnh sự hỗ trợ vật chất, động từ có thể mang sắc thái đã nhận trọn hoặc đã được thanh toán đầy đủ. “Đã nhận đủ” tự nhiên trong tiếng Việt, giữ được ý đầy đủ mà không nhấn quá mức sắc thái thương mại.
- source_word: πάντα
  choice: mọi sự
  rationale: Cụm từ diễn đạt toàn bộ những gì hội thánh Phi-líp gửi; “mọi sự” giữ phạm vi bao quát của nguyên văn.
- source_word: περισσεύω
  choice: đang có dư dật
  rationale: Động từ chỉ tình trạng có nhiều hơn mức cần thiết. Cách dịch này rõ nghĩa và duy trì sự song hành với ý được cung ứng đầy đủ.
- source_word: πεπλήρωμαι
  choice: đã được cung ứng đầy đủ
  rationale: Thể hoàn thành nhấn mạnh tình trạng đầy đủ hiện tại do món quà đem lại. Cách dịch này phù hợp với bối cảnh hỗ trợ vật chất.
- source_word: δεξάμενος
  choice: sau khi nhận
  rationale: Phân từ giải thích hoàn cảnh đưa Phao-lô đến tình trạng được cung ứng đầy đủ; “sau khi nhận” diễn đạt tự nhiên mối liên hệ ấy.
- source_word: παρὰ Ἐπαφροδίτου
  choice: từ Ép-ba-phô-đích
  rationale: Ép-ba-phô-đích là người trực tiếp chuyển món quà đến Phao-lô; giới từ “từ” phản ánh nguồn trực tiếp, còn mệnh đề kế tiếp xác định người gửi là tín hữu Phi-líp.
- source_word: τὰ παρ’ ὑμῶν
  choice: những gì anh em gửi đến
  rationale: Cụm từ chỉ những vật phẩm đến từ các tín hữu Phi-líp. “Gửi đến” diễn đạt tự nhiên hành động hàm ý trong ngữ cảnh mà không thay đổi nguồn gốc món quà.
- source_word: ὀσμὴν εὐωδίας
  choice: một hương thơm ngào ngạt
  rationale: Cách dịch giữ hình ảnh lễ tế quen thuộc trong Kinh Thánh, đồng thời tự nhiên và gợi hình trong tiếng Việt hiện đại.
- source_word: θυσίαν δεκτήν
  choice: một sinh tế được chấp nhận
  rationale: “Sinh tế” bảo tồn trực tiếp hình ảnh dâng tế, còn “được chấp nhận” diễn đạt sự tiếp nhận thuận ý của Đức Chúa Trời.
- source_word: εὐάρεστον τῷ θεῷ
  choice: đẹp lòng Đức Chúa Trời
  rationale: Thành ngữ “đẹp lòng” diễn đạt tự nhiên sự hài lòng và chấp thuận của Đức Chúa Trời, đồng thời giữ sắc thái trang trọng.
theological_decisions:
- issue: Hình ảnh dâng tế được áp dụng cho món quà vật chất của tín hữu Phi-líp
  choice: 'Giữ nguyên chuỗi hình ảnh thờ phượng: “một hương thơm ngào ngạt, một sinh tế được chấp nhận, đẹp lòng Đức Chúa Trời.”'
  alternative: Diễn giải chung thành lời cảm ơn về một món quà được Đức Chúa Trời vui nhận.
  rationale: Phao-lô chủ ý mô tả món quà bằng ngôn ngữ dâng tế. Giữ cả hương thơm, sinh tế và sự đẹp lòng Đức Chúa Trời bảo tồn sức nặng thần học của phép ẩn dụ mà không bổ sung một hệ giải thích giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc tích lũy của câu Hy Lạp và hình ảnh dâng tế; dùng “anh em” theo lối xưng hô thư tín Kinh Thánh, chỉ toàn thể cộng đồng chứ không chỉ nam giới.
