id: PHP.4.3
reference: Philippians 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: vi
  text: Vâng, tôi cũng xin bạn, người bạn đồng hành đích thực[a], hãy giúp hai phụ nữ ấy. Họ đã cùng tôi tranh đấu trong Tin Lành[b], cùng với Cơ-lê-men và các cộng sự khác của tôi, là những người có tên trong sách sự sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người bạn cùng mang ách đích thực”; một số người hiểu đây có thể là tên riêng “Syzygus”.
    reason: alternative_reading
  - marker: b
    text: Hay “đã cùng tôi tranh đấu” hoặc “đã sát cánh lao nhọc với tôi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Phải
  rationale: Giữ sắc thái khẳng định và chuyển ý trực tiếp ở đầu lời kêu gọi.
- source_word: ἐρωτῶ
  choice: tôi xin
  rationale: Diễn đạt lời thỉnh cầu mang tính cá nhân, tự nhiên hơn trong tiếng Việt mà không làm tăng mức độ thúc ép.
- source_word: γνήσιε σύζυγε
  choice: người bạn đồng hành chân thành
  rationale: Hiểu σύζυγε là danh từ chung chỉ người cộng tác gắn bó; γνήσιε nhấn mạnh tính chân thật, đáng tin. Cách hiểu như tên riêng và hình ảnh 'cùng mang ách' được giữ trong chú thích.
- source_word: συλλαμβάνου
  choice: hãy giúp
  rationale: Truyền đạt rõ mệnh lệnh hỗ trợ tích cực, phù hợp với nghĩa trong ngữ cảnh.
- source_word: αὐταῖς
  choice: hai phụ nữ ấy
  rationale: Đại từ giống cái số nhiều quy chiếu về Ê-vô-đi và Sin-ty-cơ ở câu trước; thêm 'hai' giúp tiếng Việt xác định rõ mà không thay đổi sở chỉ.
- source_word: συνήθλησάν μοι
  choice: đã cùng tôi chiến đấu
  rationale: Giữ hình ảnh thi đấu hoặc tranh đấu của συναθλέω, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: trong Tin Lành
  rationale: Bám sát giới từ ἐν và giữ nguyên độ cô đọng, không quyết đoán rằng cụm từ chỉ nội dung hay công việc phục vụ Tin Lành.
- source_word: συνεργῶν
  choice: cộng sự
  rationale: Cách gọi hiện đại, rõ ràng dành cho những người cùng làm việc với Phao-lô.
- source_word: βίβλῳ ζωῆς
  choice: sách sự sống
  rationale: Cụm từ Kinh Thánh quen thuộc và trực tiếp tương ứng với nguyên ngữ.
theological_decisions:
- issue: Cách hiểu γνήσιε σύζυγε
  choice: 'Lời gọi mô tả dành cho một nam cộng sự không nêu tên: “người bạn đồng hành chân thành”'
  alternative: Có thể là tên riêng “Syzygus”, hoặc dịch sát hình ảnh là “người bạn cùng mang ách chân chính”
  rationale: Dạng hô cách cùng tính từ γνήσιε phù hợp tự nhiên với cách hiểu đây là một lời gọi mô tả. Tuy vậy, vì σύζυγος có thể được xem là tên riêng hoặc giữ hình ảnh cùng mang ách, chú thích bảo tồn các khả năng ấy.
- issue: Phạm vi ý nghĩa của ἐν τῷ εὐαγγελίῳ
  choice: “trong Tin Lành”
  alternative: “vì Tin Lành” hoặc “trong công việc Tin Lành”
  rationale: Bản dịch sát cấu trúc Hy Lạp để không thu hẹp cụm từ vào mục đích hay một loại công tác cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Tin Lành” cho εὐαγγέλιον và “sách sự sống” theo cách diễn đạt Kinh Thánh quen thuộc; giữ hình ảnh tranh đấu của động từ συναθλέω.
