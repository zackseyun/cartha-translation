- from: Nguyện ân điển của Chúa Giê-su Cơ Đốc ở cùng tâm linh anh chị em.[a]
  to: Nguyện ân điển của Chúa Giê-su Cơ Đốc ở cùng tâm linh của anh chị em.[a]
  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt tiếng Việt để phản ánh minh bạch sở hữu cách số nhiều trong nguyên ngữ và mở rộng cách ghi chú biến thể cho đầy đủ. Câu vẫn giữ số ít «tâm linh», qua đó không quyết định quá mức giữa ý nghĩa tập thể và ý nghĩa phân phối của πνεῦμα số ít đi với ὑμῶν số nhiều.
