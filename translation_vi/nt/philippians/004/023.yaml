  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: vi
  text: Nguyện ân điển của Chúa Giê-su Cơ Đốc ở cùng tâm linh của anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Nguyện ân điển của Chúa Giê-su Cơ Đốc ở cùng tất cả anh chị em.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Cách dịch quen thuộc, trang trọng của thuật ngữ Phao-lô dùng trong lời chúc phước; giữ được cả ý nghĩa ân huệ nhưng không lẫn với nghĩa lịch thiệp thông thường của “ân huệ”.
- source_word: κυρίου
  choice: Chúa
  rationale: Phù hợp với tước hiệu dành cho Đức Giê-su trong ngữ cảnh Cơ Đốc học và với cách dùng Tân Ước thông thường.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su Cơ Đốc
  rationale: Trong công thức chúc phước này, Χριστός gắn chặt với tên Ἰησοῦ và có tính danh xưng cao; “Giê-su Cơ Đốc” tự nhiên, trang trọng trong tiếng Việt, đồng thời vẫn bảo tồn tước hiệu truyền thống.
- source_word: μετά
  choice: ở cùng
  rationale: Với sở hữu cách, μετά diễn tả sự hiện diện hoặc đồng hành; “ở cùng” tự nhiên trong lời cầu chúc.
- source_word: πνεύματος
  choice: tâm linh
  rationale: Chỉ phần nội tâm hoặc phương diện thiêng liêng của người nhận, chứ không nói rõ về Đức Thánh Linh; “tâm linh” tránh cách hiểu đơn thuần là tinh thần hay tâm trạng.
- source_word: ὑμῶν
  choice: anh chị em
  rationale: Thể hiện rõ đại từ ngôi thứ hai số nhiều và phù hợp với lời nói hướng đến toàn thể cộng đồng tín hữu.
theological_decisions:
- issue: Χριστός nên được dịch như một tước hiệu hay giữ dạng danh xưng truyền thống
  choice: Cơ Đốc
  alternative: Đấng Mê-si-a
  rationale: Trong cụm cố định “Chúa Giê-su Cơ Đốc” của lời chúc phước Phao-lô, từ này mang tính danh xưng cao. “Cơ Đốc” tự nhiên hơn trong tiếng Việt hiện đại ở vị trí này, còn “Đấng Mê-si-a” có thể khiến câu nghe như một lời giải nghĩa tước hiệu.
- issue: πνεῦμα là tâm linh con người hay Đức Thánh Linh
  choice: tâm linh anh chị em
  alternative: Thánh Linh ở cùng anh chị em
  rationale: Cấu trúc sở hữu “tâm linh của anh chị em” tự nhiên nhất chỉ phương diện nội tâm của cộng đồng. Bản văn không trực tiếp nêu Đức Thánh Linh, nên không viết hoa hoặc thêm danh xưng thần học.
- issue: Số ít πνεῦμα đi với đại từ số nhiều ὑμῶν
  choice: giữ danh từ số ít mang nghĩa tập thể
  alternative: tâm linh của mỗi người trong anh chị em
  rationale: Bản Hy Lạp đặt “tâm linh” ở số ít và “của anh chị em” ở số nhiều, có thể nói đến đời sống nội tâm chung hoặc tâm linh của từng thành viên nhìn như một tập thể. Không nên âm thầm quyết định giữa hai sắc thái ấy.
translation_notes:
  register: Văn phong chúc phước trang trọng nhưng dễ hiểu. Dùng “Nguyện” để biểu đạt tự nhiên động từ được lược trong lời chúc Hy Lạp. Dấu [a] đặt ngay sau câu liên hệ. Cách đọc chính theo SBLGNT là “tâm linh anh chị em”; chú thích phản ánh biến thể thủ bản đáng kể thay vì lặp lại nguyên văn câu chính.
