base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: vi
  text: Tất cả các thánh đồ gửi lời chào anh chị em, nhất là những người thuộc nhà Sê-sa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “nhà Sê-sa” chỉ những người thuộc hoặc có liên hệ với gia đình và cơ cấu phục vụ của hoàng đế, không nhất thiết là thân nhân của Sê-sa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: gửi lời chào
  rationale: Trong ngữ cảnh kết thư, cụm này diễn đạt tự nhiên hành động chuyển lời chào đến người nhận, đồng thời giữ sắc thái giao tiếp trực tiếp của động từ Hy Lạp.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ toàn thể cộng đồng người nhận. “Anh chị em” là cách xưng hô tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại và không thu hẹp đối tượng vào một giới.
- source_word: πάντες οἱ ἅγιοι
  choice: tất cả các thánh đồ
  rationale: “Thánh đồ” giữ thuật ngữ quen thuộc trong cách dùng của Phao-lô để chỉ các tín hữu, thay vì diễn giải rộng thành “dân Chúa” hay làm mất liên hệ với ý niệm được biệt riêng là thánh.
- source_word: μάλιστα δὲ
  choice: nhất là
  rationale: Cụm này nêu bật một nhóm trong toàn thể nhóm vừa nhắc đến. “Nhất là” gọn, tự nhiên và chuyển tải đúng trọng tâm của μάλιστα; liên từ δέ được thể hiện theo lối kết nối tiếng Việt.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: những người thuộc nhà Sê-sa
  rationale: Cách dịch này giữ hình ảnh “nhà” của nguyên văn nhưng dùng “thuộc” để cho thấy đây là những người có liên hệ với bộ máy hoặc gia hộ hoàng đế, không nhất thiết là thân nhân.
- source_word: Καίσαρος
  choice: Sê-sa
  rationale: Giữ danh hiệu lịch sử Καῖσαρ theo dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì diễn giải thành “hoàng đế”.
theological_decisions:
- issue: Ý nghĩa của “các thánh đồ” trong cách dùng của Phao-lô
  choice: Giữ danh xưng “các thánh đồ” để chỉ cộng đồng tín hữu.
  alternative: “Dân Chúa” hoặc “các tín hữu”
  rationale: Ở đây từ này không chỉ một tầng lớp tín hữu đặc biệt ưu tú. Giữ thuật ngữ của Phao-lô bảo toàn nội dung thần học và không diễn giải thay cho người đọc.
- issue: Phạm vi của “nhà Sê-sa”
  choice: Hiểu là những người thuộc hoặc có liên hệ với gia hộ và cơ cấu phục vụ hoàng đế, nhưng không xác định cụ thể địa vị của họ.
  alternative: Hiểu riêng là thân nhân hoàng đế.
  rationale: Cụm Hy Lạp có phạm vi rộng hơn gia đình huyết thống và có thể bao gồm nô lệ, người được giải phóng hay viên chức; bản dịch và chú thích tránh khẳng định quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “gửi lời chào” theo lối kết thư tự nhiên; giữ các thuật ngữ “thánh đồ” và “Sê-sa” vì tính liên tục từ vựng và sắc thái lịch sử. Chú thích giải nghĩa “nhà Sê-sa” để tránh cách hiểu hẹp là hoàng tộc.
