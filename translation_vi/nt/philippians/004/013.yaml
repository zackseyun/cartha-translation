  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: vi
  text: Tôi có thể làm được mọi sự[a] nhờ Đấng ban sức mạnh cho tôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đủ sức trong mọi sự.” Trong ngữ cảnh, Phao-lô đang nói về khả năng sống vững trong mọi hoàn cảnh, dù no hay đói, dư dật hay thiếu thốn.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp viết “Đấng ban sức mạnh cho tôi” và không trực tiếp nêu “Đấng Christ” trong câu này, dù ngữ cảnh hướng đến Ngài.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: mọi hoàn cảnh
  rationale: Dạng đối cách số nhiều có nghĩa rộng là “mọi sự”, nhưng trong ngữ cảnh 4:11–12, Phao-lô nói đến đủ loại hoàn cảnh—no hay đói, dư dật hay thiếu thốn. “Mọi hoàn cảnh” diễn đạt đúng ý theo ngữ cảnh mà không biến câu này thành lời khẳng định về khả năng làm bất cứ điều gì.
- source_word: ἰσχύω
  choice: tôi đủ sức đối diện
  rationale: Động từ chỉ việc có sức hoặc có khả năng. Kết hợp với “mọi hoàn cảnh”, cách dịch này tự nhiên trong tiếng Việt và giữ trọng tâm là khả năng chịu đựng, sống vững vàng trong các tình cảnh vừa nêu.
- source_word: ἐν
  choice: nhờ
  rationale: Trong cấu trúc này, ἐν diễn tả nền tảng hoặc phương tiện của năng lực. “Nhờ” là cách nói tiếng Việt tự nhiên, cho thấy sức lực đến từ Đấng đang làm cho Phao-lô mạnh mẽ.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: Đấng ban sức mạnh cho tôi
  rationale: Phân từ có mạo từ được dịch thành danh ngữ “Đấng…”. “Ban sức mạnh cho tôi” diễn đạt rõ hành động làm cho mạnh sức, đồng thời không thêm danh xưng “Đấng Christ” vốn không xuất hiện minh nhiên trong câu Hy Lạp này.
theological_decisions:
- issue: Phạm vi của πάντα ἰσχύω
  choice: Diễn đạt là đủ sức đối diện mọi hoàn cảnh theo mạch văn.
  alternative: Tôi có thể làm mọi sự.
  rationale: Hai câu trước xác định phạm vi là những tình cảnh khác nhau của đời sống. Bản dịch tránh cách hiểu rằng câu này hứa ban năng lực vô hạn để hoàn thành bất kỳ mục tiêu nào, nhưng chú thích vẫn ghi nhận độ rộng của nguyên văn.
- issue: Đối tượng ngầm hiểu của “Đấng ban sức mạnh cho tôi”
  choice: Không thêm “Đấng Christ” vào chính văn.
  alternative: nhờ Đấng Christ, Đấng ban sức mạnh cho tôi
  rationale: Ngữ cảnh cho thấy đối tượng nhiều khả năng là Đấng Christ, nhưng bản Hy Lạp của riêng câu này không nêu danh xưng ấy. Giữ cách gọi hàm ẩn bảo toàn chứng cứ nguyên ngữ và không giải quyết thay cho người đọc điều nguyên văn để ngầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đối diện mọi hoàn cảnh” làm rõ mạch văn mà vẫn giữ chú thích về cách diễn đạt rộng hơn của nguyên ngữ; “Đấng” được viết hoa vì đối tượng ngầm hiểu là thần linh, nhưng không chèn tên hay tước hiệu không có trong câu.
