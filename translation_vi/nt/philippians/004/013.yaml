revisions:
- from: Tôi đủ sức đối diện mọi hoàn cảnh nhờ Đấng ban sức mạnh cho tôi[a][b].
  to: Tôi có thể làm được mọi sự[a] nhờ Đấng ban sức mạnh cho tôi[b].
  rationale: Sửa chính văn để giữ độ rộng của πάντα và cách diễn đạt năng lực của ἰσχύω, theo ưu tiên nguyên ngữ và phù hợp vệt kiểm tra tiếng Anh. Ý nghĩa theo ngữ cảnh—sự bền vững trong các hoàn cảnh khác nhau—được giữ trong chú thích thay vì được áp đặt thành giới hạn của chính văn. Không bổ sung tên Đấng Christ, vì nguyên văn câu này không nêu tên ấy.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:12Z'
