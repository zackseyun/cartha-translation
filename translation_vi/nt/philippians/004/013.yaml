  terminology: “Đấng ban sức mạnh cho tôi” truyền đạt phù hợp τῷ ἐνδυναμοῦντί με và không thêm danh xưng “Đấng Christ”. Viết hoa “Đấng” phù hợp văn phong Kinh Thánh tiếng Việt khi ám chỉ Đấng thần linh; chú thích cần tiếp tục nói rõ rằng câu này không nêu đích danh Đấng Christ.
