id: PHP.4.11
reference: Philippians 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: vi
  text: Không phải tôi nói vậy vì thiếu thốn, vì tôi đã học được cách thỏa lòng[a] trong bất cứ hoàn cảnh nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tự đủ”; tính từ Hy Lạp có thể chỉ trạng thái có đủ nơi chính mình, nhưng trong văn mạch này được dịch là “thỏa lòng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: vì thiếu thốn
  rationale: Cụm từ diễn tả sự thiếu hụt hay túng thiếu như động cơ khiến một người lên tiếng. “Vì thiếu thốn” tự nhiên trong tiếng Việt và giữ được ý rằng Phao-lô không nói do nhu cầu cá nhân chưa được đáp ứng.
- source_word: λέγω
  choice: tôi nói vậy
  rationale: Thì hiện tại được diễn đạt tự nhiên trong tiếng Việt; “vậy” liên kết lời này với điều Phao-lô vừa nói ở câu trước mà không thêm nội dung mới.
- source_word: ἔμαθον
  choice: tôi đã học được
  rationale: Dạng aorist chỉ điều Phao-lô đã học qua kinh nghiệm và hiện vẫn có giá trị; “đã học được” truyền đạt cả quá trình đạt tới lẫn kết quả hiện tại.
- source_word: ἐν οἷς εἰμι
  choice: trong bất cứ hoàn cảnh nào
  rationale: Cụm quan hệ này mang nghĩa thành ngữ về tình cảnh Phao-lô đang ở. Cách dịch này rõ ràng, tự nhiên và không giới hạn ý vào địa điểm.
- source_word: αὐτάρκης
  choice: thỏa lòng
  rationale: Trong ngữ cảnh, từ này nói đến trạng thái thấy mình có đủ giữa mọi hoàn cảnh. “Thỏa lòng” dễ hiểu và tránh biến ý chính thành sự độc lập tuyệt đối hay tự lực, trong khi nghĩa từ vựng khác được giữ ở chú thích.
theological_decisions:
- issue: Sắc thái triết học có thể có của αὐτάρκης
  choice: Dịch là “thỏa lòng”.
  alternative: “tự đủ”
  rationale: Phao-lô mô tả một trạng thái đủ đầy đã học được giữa những hoàn cảnh khác nhau. “Thỏa lòng” phù hợp với văn mạch và không nhấn quá mức ý tự chủ, nhất là khi câu 13 tiếp tục đặt khả năng của ông trong Đấng ban sức. Tuy vậy, nghĩa “tự đủ” vốn có của từ Hy Lạp được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Không phải… vì…” giữ mạch lập luận phủ định rồi giải thích của nguyên văn. “Thỏa lòng” là cách nói quen thuộc nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
source_grounding:
  english_pob_role: consult_only
