source:
  edition: SBLGNT
  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: vi
  text: Hãy gửi lời chào đến từng thánh đồ trong Đấng Mê-si-a Giê-su.[a] Các anh em[b] ở với tôi gửi lời chào đến anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đấng Christ Giê-su.”'
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh này, “các anh em” có thể được hiểu theo nghĩa rộng hơn là chỉ những người cùng đức tin đang ở với Phao-lô, kể cả một nhóm có cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Diễn đạt tự nhiên mệnh lệnh chào hỏi trong phần kết thư, đồng thời cho thấy lời chào được chuyển đến những người khác.
- source_word: πάντα ἅγιον
  choice: từng thánh đồ
  rationale: Danh từ số ít đi với πᾶς mang ý nghĩa phân phối; “từng” thể hiện rõ mỗi cá nhân trong toàn thể những người thuộc về Đức Chúa Trời.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Jêsus
  rationale: Giữ nguyên giới từ “trong” và hiểu Χριστός theo chức danh “Đấng Mê-si-a”, không biến chức danh thành tên riêng.
- source_word: ἀσπάζονται ὑμᾶς
  choice: gửi lời chào đến anh chị em
  rationale: Cách nói tự nhiên trong thư tín tiếng Việt; “anh chị em” truyền đạt đại từ ngôi thứ hai số nhiều hướng đến cộng đồng tín hữu.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Các anh em ở với tôi
  rationale: Giữ hình thức giống đực số nhiều của ἀδελφοί trong chính văn, còn khả năng chỉ một nhóm tín hữu rộng hơn được nêu ở chú thích.
theological_decisions:
- issue: Cách dịch Χριστός như một chức danh
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: “Đấng Mê-si-a” thể hiện rõ nghĩa chức danh của Χριστός và tránh để độc giả hiện đại chỉ hiểu đây là một phần của tên riêng; phương án truyền thống vẫn được ghi nhận trong chú thích.
- issue: Phạm vi chỉ người của ἀδελφοί
  choice: Giữ “các anh em” trong chính văn
  alternative: các anh chị em cùng đức tin
  rationale: Bản dịch chính giữ hình thức ngữ pháp giống đực của nguyên văn mà không quyết định ngầm liệu nhóm người này chỉ gồm nam giới hay gồm cả nam lẫn nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thánh đồ” được giữ vì là cách gọi ngắn gọn, quen thuộc trong ngôn ngữ Kinh Thánh; “từng” làm rõ sắc thái phân phối. Dùng “anh chị em” cho ὑμᾶς để diễn đạt tự nhiên số nhiều trong tiếng Việt, nhưng không dùng cách gọi bao hàm ấy để xóa sự mơ hồ của ἀδελφοί ở chủ ngữ.
