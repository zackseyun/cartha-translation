id: PHP.4.4
reference: Philippians 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: vi
  text: 'Hãy vui mừng trong Chúa luôn luôn[a]. Tôi sẽ nhắc lại: Hãy vui mừng!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy hân hoan trong Chúa mọi lúc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Hãy vui mừng
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều. “Hãy vui mừng” truyền đạt rõ lời kêu gọi dành cho cả cộng đồng và phù hợp với văn phong khuyên nhủ của Phao-lô.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Cách dịch sát và tự nhiên này giữ được nét nghĩa về phạm vi hoặc mối liên hệ—vui mừng trong sự gắn bó với Chúa—mà không thu hẹp thành chỉ “vì Chúa” hay “nhờ Chúa”.
- source_word: πάντοτε
  choice: luôn luôn
  rationale: Diễn đạt tự nhiên sức nghĩa liên tục của trạng từ Hy Lạp.
- source_word: πάλιν
  choice: nhắc lại
  rationale: Trong kết cấu với ἐρῶ, “tôi sẽ nhắc lại” diễn đạt tự nhiên việc người viết sắp lặp lại chính lời khuyên vừa nêu.
- source_word: ἐρῶ
  choice: Tôi sẽ
  rationale: Giữ giá trị thì tương lai của động từ Hy Lạp thay vì chuyển thành hiện tại.
- source_word: χαίρετε
  choice: Hãy vui mừng
  rationale: Lặp lại cùng cách dịch để bảo toàn sự nhấn mạnh tu từ của nguyên bản.
theological_decisions:
- issue: Ý nghĩa của “ἐν κυρίῳ”
  choice: “trong Chúa,” giữ nét nghĩa về phạm vi và mối liên hệ của niềm vui với Chúa
  alternative: “vì Chúa” hoặc “nhờ Chúa”
  rationale: Cụm từ này trong thư Phao-lô thường chỉ phạm vi hay mối liên hệ. “Trong Chúa” bảo toàn độ rộng thần học, không quyết định rằng giới từ chỉ mang nghĩa nguyên nhân hoặc phương tiện.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dấu hai chấm giúp câu lặp tự nhiên trong tiếng Việt; dấu chấm than ở mệnh lệnh cuối thể hiện sự nhấn mạnh mà không thêm nội dung.
