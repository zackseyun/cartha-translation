revisions:
- from: Hỡi anh chị em tại Phi-líp, chính anh chị em cũng biết rằng vào buổi đầu của Tin Lành, khi tôi rời Ma-xê-đô-ni-a, không một hội thánh nào dự phần với tôi trong việc cho và nhận[a], ngoại trừ một mình anh chị em.
  to: Chính anh chị em cũng biết, hỡi người Phi-líp, rằng vào buổi đầu của Tin Lành, khi tôi rời Ma-xê-đô-ni-a, không một hội thánh nào dự phần với tôi trong việc cho và nhận[a], ngoại trừ một mình anh chị em.
  rationale: Chỉ thay lời hô gọi để phản ánh trực tiếp Φιλιππήσιοι mà không thêm cách xưng gọi “anh chị em”. Giữ nguyên các lựa chọn còn lại vì chúng truyền đạt tốt cấu trúc, sắc thái nhấn mạnh và tính mơ hồ có chủ ý của nguyên văn.
