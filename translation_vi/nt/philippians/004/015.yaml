id: PHP.4.15
reference: Philippians 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: vi
  text: Chính anh chị em cũng biết, hỡi người Phi-líp, rằng vào buổi đầu của Tin Lành, khi tôi rời Ma-xê-đô-ni-a, không một hội thánh nào dự phần với tôi trong việc cho và nhận[a], ngoại trừ một mình anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong khoản mục cho và nhận.”'
    reason: λόγος có thể mang sắc thái kế toán như một khoản mục hoặc tài khoản, bên cạnh nghĩa rộng hơn là “việc” hay “vấn đề”.
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: chính anh chị em cũng biết
  rationale: Diễn đạt οἴδατε bằng động từ trạng thái hiện tại tự nhiên trong tiếng Việt, đồng thời giữ cả sắc thái bổ sung của καί và sự nhấn mạnh nơi đại từ ὑμεῖς; δέ được thể hiện qua mạch câu tiếp nối mà không cần một liên từ tương phản rõ.
- source_word: Φιλιππήσιοι
  choice: Hỡi anh chị em tại Phi-líp
  rationale: Giữ chức năng hô cách trực tiếp, đồng thời dùng cách gọi tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: vào buổi đầu của Tin Lành
  rationale: Bám sát cấu trúc Hy Lạp và để ngỏ việc cụm từ chỉ giai đoạn đầu Tin Lành đến với họ hay giai đoạn đầu công cuộc rao truyền của Phao-lô.
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: khi tôi rời Ma-xê-đô-ni-a
  rationale: Diễn đạt tự nhiên biến cố quá khứ đơn nhất, không thêm sắc thái ngoài văn bản.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: không một hội thánh nào dự phần với tôi
  rationale: “Dự phần” giữ ý tham gia và hiệp thông thực tế của κοινωνέω, phù hợp bối cảnh hỗ trợ vật chất nhưng không thu hẹp động từ thành hành vi tài chính đơn thuần.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: trong việc cho và nhận
  rationale: Cách nói rõ ràng trong tiếng Việt hiện đại, giữ hai vế đối xứng của Hy Lạp; sắc thái sổ sách hoặc tài khoản của λόγος được bảo lưu trong chú thích.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: ngoại trừ một mình anh chị em
  rationale: Giữ sự loại trừ và nhấn mạnh của μόνοι, đồng thời phù hợp với đại từ số nhiều chỉ cộng đồng.
theological_decisions:
- issue: Phạm vi ý nghĩa của “buổi đầu của Tin Lành”
  choice: Giữ cách diễn đạt tương đối nguyên dạng
  alternative: “khi tôi mới bắt đầu rao truyền Tin Lành”
  rationale: Bản thay thế làm rõ hơn nhưng quy cụm từ trực tiếp vào hoạt động của Phao-lô; nguyên văn có thể gợi giai đoạn đầu Tin Lành đến với người Phi-líp nói chung, nên không nên âm thầm giải quyết sự mơ hồ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu số nhiều; giữ “Tin Lành” và “hội thánh” là các thuật ngữ quen thuộc, không thêm nội dung mang tính hệ phái.
