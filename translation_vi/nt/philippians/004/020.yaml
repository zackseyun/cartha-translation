  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: vi
  text: Nguyện vinh quang thuộc về Đức Chúa Trời, là Cha chúng ta, cho đến đời đời[a]. A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “cho đến các thời đại của các thời đại.”'
    reason: Nêu cách diễn đạt sát chữ của thành ngữ Hy Lạp chỉ thời gian vô tận.
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Tiểu từ này chỉ liên kết nhẹ và chuyển sang lời tôn vinh kết thúc; trong tiếng Việt, mạch văn đã thể hiện chức năng ấy, còn thêm “bây giờ”, “nhưng” hoặc “và” dễ tạo sắc thái không có trong nguyên văn.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: Đức Chúa Trời, là Cha chúng ta
  rationale: Cụm từ nói về một Đấng; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy Đức Chúa Trời chính là Cha của cộng đồng tín hữu, không tách thành hai đối tượng.
- source_word: ἡ δόξα
  choice: Nguyện vinh quang thuộc về
  rationale: Mệnh đề Hy Lạp không có động từ. “Nguyện ... thuộc về” bổ sung ý phù hợp với công thức tôn vinh, đồng thời giữ được sắc thái trang trọng và hướng lời ca ngợi về Đức Chúa Trời.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: cho đến đời đời
  rationale: Đây là thành ngữ chỉ thời gian vô tận. “Cho đến đời đời” tự nhiên, trang trọng và quen thuộc trong tiếng Việt hiện đại.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ dạng phiên âm đã quen dùng như lời xác nhận phụng vụ, thay vì dịch thành “thật vậy”.
theological_decisions:
- issue: Bổ sung động từ hàm ẩn trong lời tôn vinh
  choice: Nguyện vinh quang thuộc về
  alternative: Vinh quang thuộc về
  rationale: Nguyên văn là mệnh đề không động từ nên có thể hiểu như một lời cầu chúc hoặc lời khẳng định. Cách chọn này phù hợp chức năng tôn vinh trong ngữ cảnh nhưng không biến “vinh quang” thành một hành động con người ban cho Đức Chúa Trời.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu, dùng cấu trúc tôn vinh tự nhiên trong tiếng Việt. “Đức Chúa Trời” và “A-men” giữ cách gọi quen thuộc, không gắn với cách giải thích riêng của một hệ phái.
