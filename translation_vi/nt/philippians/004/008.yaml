id: PHP.4.8
reference: Philippians 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: vi
  text: Sau cùng, thưa anh chị em[a], bất cứ điều gì chân thật, bất cứ điều gì đáng kính, bất cứ điều gì công chính, bất cứ điều gì thanh sạch, bất cứ điều gì đáng mến, bất cứ điều gì đáng khen—nếu có điều gì tốt đẹp và nếu có điều gì đáng ca ngợi—thì hãy suy ngẫm những điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng từ “anh em”; trong cách xưng hô này, từ ấy có thể chỉ toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Sau cùng
  rationale: Một từ chuyển ý dẫn vào lời khuyên kết luận; “Sau cùng” tự nhiên trong tiếng Việt và vẫn giữ lực chuyển tiếp.
- source_word: ἀδελφοί
  choice: anh chị em[a]
  rationale: Dạng Hy Lạp là danh từ giống đực số nhiều nhưng trong cách xưng hô của Phao-lô có thể chỉ toàn thể cộng đồng tín hữu; tiếng Việt tự nhiên dùng “anh chị em” để truyền đạt đúng phạm vi quy chiếu.
- source_word: ὅσα
  choice: bất cứ điều gì
  rationale: Giữ phép lặp có tính phân phối của đại từ quan hệ trung tính số nhiều, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ἀληθῆ
  choice: chân thật
  rationale: Diễn tả phạm trù rộng về điều đúng thật và thành thực trong danh sách phẩm hạnh.
- source_word: σεμνά
  choice: đáng kính
  rationale: Truyền đạt phẩm chất nghiêm trang, cao quý và xứng đáng được tôn trọng.
- source_word: δίκαια
  choice: công chính
  rationale: Giữ chiều kích đạo đức của điều ngay thẳng, đúng đắn; không thu hẹp nghĩa chỉ còn sự công bằng xã hội.
- source_word: ἁγνά
  choice: thanh sạch
  rationale: Bao hàm sự trong sạch về đạo đức và nội tâm, tự nhiên hơn “tinh sạch” trong văn phong hiện đại.
- source_word: προσφιλῆ
  choice: đáng mến
  rationale: Diễn tả điều khơi dậy tình yêu mến hoặc thiện cảm, sát với nghĩa của từ Hy Lạp.
- source_word: εὔφημα
  choice: đáng khen
  rationale: Diễn tả điều có tiếng tốt hoặc được nói đến cách thiện hảo, đồng thời ngắn gọn trong chuỗi liệt kê.
- source_word: εἴ τις ἀρετὴ
  choice: nếu có điều gì tốt đẹp
  rationale: ἀρετή chỉ phẩm chất xuất sắc hay đức hạnh; “tốt đẹp” dễ hiểu đối với độc giả phổ thông và giữ chức năng khái quát của mệnh đề.
- source_word: εἴ τις ἔπαινος
  choice: nếu có điều gì đáng ca ngợi
  rationale: Giữ cấu trúc điều kiện song song và truyền đạt ý về điều xứng nhận lời khen.
- source_word: ταῦτα λογίζεσθε
  choice: hãy suy ngẫm những điều ấy
  rationale: λογίζεσθε đòi hỏi sự chú tâm và cân nhắc có chủ ý; “suy ngẫm” diễn tả chiều sâu hơn việc thoáng nghĩ đến mà không thêm ý niệm huyền nhiệm.
theological_decisions:
- issue: Phạm vi của ἀδελφοί trong lời xưng hô
  choice: Dịch “anh chị em” trong chính văn
  alternative: “anh em” với chú thích rằng có thể bao gồm cả nữ giới
  rationale: Trong ngữ cảnh thư gửi toàn thể hội thánh, từ giống đực số nhiều này có chức năng xưng hô đại diện. “Anh chị em” truyền đạt rõ đối tượng thực tế trong tiếng Việt mà không thay đổi nội dung thần học.
- issue: Sắc thái của δίκαια
  choice: “công chính”
  alternative: “đúng đắn” hoặc “công bằng”
  rationale: “Công chính” bảo toàn phạm vi đạo đức rộng của từ Hy Lạp; “công bằng” có thể quá hẹp, còn “đúng đắn” ít thể hiện trọng lượng luân lý hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nhịp điệp “bất cứ điều gì” của nguyên văn cùng hai mệnh đề “nếu có” để bảo toàn cấu trúc tu từ và sắc thái khái quát.
