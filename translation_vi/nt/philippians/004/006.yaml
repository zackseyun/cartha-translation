id: PHP.4.6
reference: Philippians 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: vi
  text: Đừng lo lắng về bất cứ điều gì,[a] nhưng trong mọi sự, bằng lời cầu nguyện và lời nài xin, với lòng tạ ơn, hãy trình bày những điều anh chị em cầu xin với Đức Chúa Trời.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng lo âu về bất cứ điều gì.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trước mặt Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Đừng lo lắng về bất cứ điều gì
  rationale: Diễn đạt tự nhiên cấu trúc cấm đoán với μηδὲν; “lo lắng” truyền đạt sự bận tâm đầy bất an mà không hàm ý cấm mọi sự quan tâm chính đáng.
- source_word: ἐν παντὶ
  choice: trong mọi hoàn cảnh
  rationale: Làm rõ ý bao quát của cụm Hy Lạp bằng tiếng Việt tự nhiên; không giới hạn lời dạy vào một loại hoàn cảnh nào.
- source_word: τῇ προσευχῇ
  choice: lời cầu nguyện
  rationale: Cách dịch phổ thông và trang trọng của προσευχή, chỉ việc hướng lời cầu nguyện đến Đức Chúa Trời.
- source_word: τῇ δεήσει
  choice: nài xin
  rationale: Giữ sắc thái khẩn thiết và cụ thể hơn của δέησις, đồng thời phân biệt với thuật ngữ rộng hơn là “cầu nguyện”.
- source_word: μετ’ εὐχαριστίας
  choice: cùng với sự tạ ơn
  rationale: Giữ hình thức danh từ và nhấn mạnh rằng sự tạ ơn đi kèm lời cầu nguyện, nài xin.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: những điều anh chị em cầu xin
  rationale: Diễn đạt cụ thể nội dung các lời thỉnh cầu, tránh lặp từ “nài xin”; “anh chị em” thể hiện số nhiều của ὑμῶν và phù hợp lời gửi đến cả cộng đồng.
- source_word: γνωριζέσθω
  choice: hãy ... trình bày
  rationale: Chuyển mệnh lệnh bị động sang một mệnh lệnh chủ động tự nhiên trong tiếng Việt, vẫn giữ ý làm cho các lời cầu xin được Đức Chúa Trời biết đến.
- source_word: πρὸς τὸν θεόν
  choice: lên Đức Chúa Trời
  rationale: Phù hợp tự nhiên với động từ “trình bày” và giữ hướng quy chiếu của πρὸς; “trước mặt Đức Chúa Trời” vẫn là một khả năng.
theological_decisions:
- issue: Mệnh lệnh “đừng lo lắng” có thể bị hiểu là cấm mọi sự quan tâm hoặc dự liệu.
  choice: Dùng “lo lắng” để chỉ sự bận tâm bất an.
  alternative: “Đừng bận tâm” hoặc “đừng quan tâm.”
  rationale: μεριμνάω trong ngữ cảnh này nói đến sự lo âu; các phương án thay thế dễ mở rộng mệnh lệnh thành việc cấm cả sự quan tâm chính đáng.
- issue: πρὸς τὸν θεόν có thể diễn tả hướng đến Đức Chúa Trời hoặc ở trước mặt Ngài.
  choice: Dịch trong câu chính là “lên Đức Chúa Trời.”
  alternative: “trước mặt Đức Chúa Trời.”
  rationale: Cách chính giữ nghĩa hướng đến tự nhiên với việc trình bày lời cầu xin, còn khả năng mang sắc thái hiện diện được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu thị đại từ số nhiều ὑμῶν trong lời gửi đến cộng đồng. Nhịp câu giữ sự tương phản giữa mệnh lệnh không lo lắng và lời kêu gọi cầu nguyện, nài xin với lòng tạ ơn.
