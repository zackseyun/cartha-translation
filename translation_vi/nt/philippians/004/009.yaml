  to: Những gì anh chị em cũng đã học, đã tiếp nhận, đã nghe và đã thấy nơi tôi[b], thì hãy thực hành những điều ấy[a]; và Đức Chúa Trời của sự bình an sẽ ở cùng anh chị em.
