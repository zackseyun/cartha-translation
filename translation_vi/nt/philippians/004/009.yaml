    issue: Bỏ sót từ “cũng” trong mệnh đề mở đầu.
    rationale: Nguyên văn viết ἃ καὶ ἐμάθετε (“những gì anh chị em cũng đã học”). Dù καί có thể mang sắc thái nối kết/nhấn mạnh nhẹ, bản dịch nên biểu thị bằng “cũng” để bảo toàn đầy đủ nội dung nguồn.
