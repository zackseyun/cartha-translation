id: PHP.4.9
reference: Philippians 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: vi
  text: Những gì anh chị em cũng đã học, đã tiếp nhận, đã nghe và đã thấy nơi tôi[b], thì hãy thực hành những điều ấy[a]; và Đức Chúa Trời của sự bình an sẽ ở cùng anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy làm những điều ấy.”'
    reason: lexical_alternative
  - marker: b
    text: “Thấy nơi tôi” cũng có thể diễn đạt là “thấy qua gương của tôi” hoặc “thấy trong đời sống tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: những gì
  rationale: Đại từ quan hệ số nhiều trung tính mở đầu nội dung lời khuyên; “những gì” tự nhiên trong tiếng Việt và vẫn được tiếp nối bằng “những điều ấy” để thể hiện ý số nhiều.
- source_word: ἐμάθετε
  choice: đã học
  rationale: Diễn đạt tự nhiên hành động người Phi-líp đã học từ Phao-lô, đồng thời giữ cấu trúc song song của chuỗi động từ.
- source_word: παρελάβετε
  choice: đã tiếp nhận
  rationale: “Tiếp nhận” giữ được phạm vi nghĩa là nhận lấy lời dạy hoặc truyền thống mà không thu hẹp câu vào một nghĩa chuyên biệt.
- source_word: ἠκούσατε
  choice: đã nghe
  rationale: Giữ nghĩa trực tiếp và cấu trúc song song của nguyên văn; không thêm “từ tôi” vì tiếng Hy Lạp không nói rõ trong chính động từ này.
- source_word: εἴδετε ἐν ἐμοί
  choice: đã thấy nơi tôi
  rationale: Theo sát cách diễn đạt của tiếng Hy Lạp và giữ mở việc những điều ấy được thấy trong đời sống, hành vi hay gương mẫu của Phao-lô.
- source_word: ταῦτα πράσσετε
  choice: hãy thực hành những điều ấy
  rationale: “Thực hành” diễn tả việc liên tục đưa điều đã học và quan sát vào đời sống; thể mệnh lệnh hiện tại mang sắc thái hành động thường xuyên.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Đức Chúa Trời của sự bình an
  rationale: Giữ trực tiếp kết cấu sở hữu trong danh xưng của Phao-lô, không diễn giải thành riêng nghĩa “Đấng ban sự bình an”.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: sẽ ở cùng anh chị em
  rationale: Diễn đạt thẳng lời bảo đảm về sự hiện diện của Đức Chúa Trời; “anh chị em” thể hiện đại từ số nhiều và phù hợp văn phong thư tín hiện đại.
theological_decisions:
- issue: Mối liên hệ giữa sự vâng lời và sự hiện diện của Đức Chúa Trời
  choice: Giữ lời khuyên và lời hứa nối với nhau bằng “và”, không biến câu thành công thức điều kiện minh nhiên.
  alternative: Dịch thành “nếu anh chị em làm những điều ấy, thì Đức Chúa Trời...”, nhấn mạnh quan hệ điều kiện–kết quả.
  rationale: Nguyên văn dùng καί để liên kết hai mệnh đề chứ không dùng một cấu trúc điều kiện rõ ràng; bản dịch giữ sức nặng mục vụ và sự căng thẳng thần học của câu mà không thêm quan hệ nhân quả máy móc.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ὑμῶν số nhiều nhằm tránh sự mơ hồ của “các bạn” và giữ sắc thái cộng đồng thư tín. Chuỗi bốn động từ được giữ cân đối; các dấu chú thích [b] và [a] đặt ngay sau cụm từ liên quan.
