    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Tuy vậy
  rationale: Đánh dấu sự chuyển ý tương phản nhẹ với câu trước, đồng thời vẫn giữ nguyên lời khen tích cực của Phao-lô.
- source_word: καλῶς ἐποιήσατε
  choice: anh chị em đã làm điều tốt
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp theo nghĩa đánh giá tích cực hành động của người Phi-líp; thì quá khứ phù hợp với động từ aorist.
- source_word: συγκοινωνήσαντές
  choice: khi cùng chia sẻ ... với tôi
  rationale: Giữ ý tham dự và liên đới với Phao-lô, chứ không chỉ cảm thông từ xa.
- source_word: τῇ θλίψει
  choice: hoạn nạn
  rationale: Chuyển tải sức nặng của θλῖψις là cảnh khốn khó, áp lực hoặc đau khổ, nhưng không cường điệu thành đại nạn.
