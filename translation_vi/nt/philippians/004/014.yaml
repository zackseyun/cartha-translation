  text: Nevertheless[b][a], you did well by sharing in my affliction.
translation:
  language: vi
  text: Tuy vậy[a], anh chị em đã làm tốt khi dự phần vào cảnh hoạn nạn của tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
