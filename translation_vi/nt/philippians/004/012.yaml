id: PHP.4.12
reference: Philippians 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: vi
  text: 'Tôi biết sống trong cảnh thiếu thốn, cũng biết sống trong cảnh dư dật. Trong mọi hoàn cảnh và mọi sự, tôi đã học được bí quyết[a]: dù no hay đói, dù dư dật hay túng thiếu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “tôi đã được khai tâm.” Phao-lô dùng ngôn ngữ về việc được truyền cho điều kín nhiệm như một ẩn dụ về việc học biết bí quyết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: tôi biết sống
  rationale: Khi đi với các động từ nguyên mẫu chỉ hoàn cảnh sống, cách diễn đạt này truyền đạt kiến thức thực tiễn do kinh nghiệm, đồng thời tự nhiên trong tiếng Việt.
- source_word: ταπεινοῦσθαι
  choice: sống trong cảnh thiếu thốn
  rationale: Dạng này nói đến việc bị hạ xuống hoặc ở địa vị thấp; trong ngữ cảnh đối lập với περισσεύειν và được triển khai bằng đói cùng túng thiếu, bản dịch nêu rõ phương diện hoàn cảnh mà không biến nó thành thái độ khiêm nhường.
- source_word: περισσεύειν
  choice: sống trong cảnh dư dật / dư dật
  rationale: “Dư dật” giữ nghĩa có nhiều hơn mức cần thiết và duy trì sự đối xứng với thiếu thốn, nhưng không giới hạn vào tiền bạc.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: trong mọi hoàn cảnh và mọi sự
  rationale: Giữ hai vế có tính bao quát của nguyên văn, đồng thời diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: μεμύημαι
  choice: tôi đã học được bí quyết
  rationale: Truyền đạt nghĩa ẩn dụ là đã được cho biết hay học biết điều kín nhiệm; sắc thái nguyên thủy về nghi thức khai tâm được bảo lưu trong chú thích.
- source_word: χορτάζεσθαι
  choice: 'no'
  rationale: Trong thế đối lập trực tiếp với πεινᾶν, “no” diễn đạt rõ việc được ăn đầy đủ và tạo cặp từ tự nhiên “no hay đói”.
- source_word: πεινᾶν
  choice: đói
  rationale: Cách nói giản dị, chính xác và đối xứng trực tiếp với “no”.
- source_word: ὑστερεῖσθαι
  choice: túng thiếu
  rationale: Diễn đạt tình trạng không có đủ hoặc bị thiếu hụt, đủ rộng để không chỉ nói về tài chính và đối lập rõ với “dư dật”.
theological_decisions:
- issue: Phạm vi của ταπεινοῦσθαι
  choice: Hiểu chủ yếu là hoàn cảnh bị hạ thấp hoặc thiếu thốn
  alternative: “bị hạ xuống” hoặc “sống khiêm nhường”
  rationale: Các cặp đối lập tiếp theo—no/đói và dư dật/túng thiếu—cho thấy trọng tâm là điều kiện sống, không phải phẩm hạnh khiêm nhường; tuy vậy bản dịch không quy nghĩa chỉ vào tài chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Các cặp “no hay đói” và “dư dật hay túng thiếu” giữ nhịp đối xứng của nguyên văn; “trong mọi hoàn cảnh và mọi sự” bảo lưu tính bao quát kép.
