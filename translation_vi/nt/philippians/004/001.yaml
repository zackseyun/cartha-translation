id: PHP.4.1
reference: Philippians 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: vi
  text: Vì vậy, hỡi anh em[a] yêu dấu mà tôi hằng mong nhớ, là niềm vui và vòng hoa chiến thắng[b] của tôi, hãy đứng vững trong Chúa như vậy, hỡi những người yêu dấu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng hình thức giống đực “anh em”; trong ngữ cảnh, Phao-lô đang nói với các tín hữu trong hội thánh, không chỉ riêng nam giới.
    reason: cultural_note
  - marker: b
    text: Từ Hy Lạp chỉ chiếc vòng được trao cho người chiến thắng, chứ không phải vương miện hoàng gia.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên ý suy luận và kết luận nối với phần lập luận trước.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức xưng hô giống đực của tiếng Hy Lạp; chú thích nêu rõ trong ngữ cảnh lời này hướng đến cộng đồng tín hữu, không chỉ nam giới.
- source_word: ἀγαπητοί
  choice: yêu dấu
  rationale: Giữ sắc thái trìu mến và lặp lại từ này ở cả hai vị trí như nguyên văn.
- source_word: ἐπιπόθητοι
  choice: mà tôi hằng mong nhớ
  rationale: Diễn đạt nỗi khao khát gặp lại sâu sắc bằng tiếng Việt hiện đại, tự nhiên.
- source_word: χαρά
  choice: niềm vui
  rationale: Giữ nguyên cách Phao-lô gọi chính các tín hữu Phi-líp là niềm vui của ông.
- source_word: στέφανος
  choice: vòng hoa chiến thắng
  rationale: Phản ánh cụ thể chiếc vòng trao cho người thắng cuộc, tránh gợi nhầm đến vương miện hoàng gia.
- source_word: στήκετε
  choice: hãy cứ đứng vững
  rationale: Mệnh lệnh này kêu gọi tiếp tục kiên định; “hãy cứ” làm rõ sắc thái bền đỗ mà vẫn tự nhiên.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên tính hàm súc về địa vị và mối liên hệ trong cách nói quen thuộc của Phao-lô, không diễn giải quá mức.
- source_word: οὕτως
  choice: như thế
  rationale: Giữ rõ trạng từ chỉ cách thức, tự nhiên quy chiếu về lời khuyên và mẫu mực ở phần trước.
theological_decisions:
- issue: Phạm vi đại diện của ἀδελφοί
  choice: Giữ “anh em” trong chính văn và giải thích phạm vi cộng đồng trong chú thích.
  alternative: “anh chị em” hoặc “các tín hữu”
  rationale: Nguyên văn dùng danh từ xưng hô giống đực, nhưng thư được gửi cho cả hội thánh; cách trình bày này giữ cả hình thức ngữ pháp lẫn phạm vi theo ngữ cảnh.
- issue: Ý nghĩa của ἐν κυρίῳ
  choice: “trong Chúa”
  alternative: “trong sự hiệp nhất với Chúa”
  rationale: Cách dịch ngắn gọn bảo tồn độ rộng thần học và quan hệ của cụm từ Hy Lạp, thay vì thu hẹp nó vào một cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tình cảm. Giữ lời gọi trìu mến lặp lại ở đầu và cuối câu, đồng thời dùng cấu trúc tiếng Việt tự nhiên, dễ đọc.
