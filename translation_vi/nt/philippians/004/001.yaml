revisions:
- from: Vì vậy, hỡi anh em[a] yêu dấu mà tôi hằng mong nhớ, là niềm vui và vòng hoa chiến thắng[b] của tôi, hãy cứ đứng vững trong Chúa như thế, hỡi anh em yêu dấu.
  to: Vì vậy, hỡi anh em[a] yêu dấu mà tôi hằng mong nhớ, là niềm vui và vòng hoa chiến thắng[b] của tôi, hãy đứng vững trong Chúa như vậy, hỡi những người yêu dấu.
  rationale: Bản sửa loại bỏ ‘cứ’ để không áp đặt sắc thái ngữ pháp vượt quá điều văn bản chắc chắn nói; dùng ‘như vậy’ cho cách diễn đạt hiện đại tự nhiên; và điều chỉnh lời gọi cuối để phản ánh ἀγαπητοί mà không lặp lại ἀδελφοί. Các chú thích giữ nguyên vì chính xác và được neo đúng vào các từ liên quan.
  reviewer_model: gpt-5.6-terra
