id: PHP.4.19
reference: Philippians 4:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: vi
  text: Và Đức Chúa Trời của tôi sẽ chu cấp mọi nhu cầu của anh chị em theo sự giàu có của Ngài trong vinh quang, trong Đấng Mê-si-a Giê-su.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trong Đấng Christ Giê-su.”'
    reason: lexical_alternative
  - marker: b
    text: “Theo sự giàu có của Ngài” diễn tả chuẩn mực hoặc mức độ chu cấp của Đức Chúa Trời, chứ không chỉ nói rằng sự chu cấp đến từ sự giàu có ấy.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể hiểu phần cuối là “một cách vinh hiển trong Đấng Mê-si-a Giê-su,” hoặc đọc liền: “trong vinh quang trong Đấng Mê-si-a Giê-su.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: Và Đức Chúa Trời của tôi
  rationale: δέ nối nhẹ với lời trước nên “Và” tự nhiên hơn “Nhưng”; “của tôi” giữ sắc thái cá nhân của μου.
- source_word: πληρώσει
  choice: sẽ chu cấp
  rationale: Trong ngữ cảnh này, πληρόω nói đến việc cung ứng điều còn thiếu; “chu cấp” rõ nghĩa và tự nhiên hơn cách dịch sát mặt chữ “làm đầy”.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: mọi nhu cầu của anh chị em
  rationale: Giữ lực phân bố của πᾶσαν và nghĩa nhu cầu, điều cần thiết của χρεία; “anh chị em” diễn đạt số nhiều ὑμῶν trong cộng đồng tín hữu.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: theo sự giàu có của Ngài
  rationale: κατά với đối cách chỉ chuẩn mực hoặc mức độ; “theo” giữ ý sự chu cấp tương xứng với sự giàu có của Đức Chúa Trời, không chỉ đơn thuần lấy ra từ đó.
- source_word: ἐν δόξῃ
  choice: trong vinh quang
  rationale: Giữ nguyên cấu trúc giới từ và độ mở nghĩa của tiếng Hy Lạp thay vì quyết định rằng cụm từ chỉ có nghĩa trạng từ “một cách vinh hiển”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Χριστός ở đây vẫn là tước hiệu; “Đấng Mê-si-a” chuyển tải nghĩa tước hiệu, còn cấu trúc “là Đức Chúa Jêsus” tạo tiếng Việt tự nhiên và tránh cách ghép tên khó hiểu.
theological_decisions:
- issue: Cách dịch Χριστός trong ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a là Đức Chúa Jêsus
  alternative: trong Đấng Christ Jêsus
  rationale: Bản chính chuyển tải nghĩa tước hiệu Χριστός; cách gọi truyền thống “Đấng Christ” được giữ trong chú thích để người đọc nhận biết tương đương.
- issue: Quan hệ cú pháp của ἐν δόξῃ và ἐν Χριστῷ Ἰησοῦ
  choice: giữ hai cụm “trong…” nối tiếp nhưng ngăn bằng dấu phẩy
  alternative: “trong vinh quang trong Đấng Mê-si-a là Đức Chúa Jêsus” không có dấu phẩy
  rationale: Tiếng Hy Lạp cho phép hơn một cách liên kết. Dấu phẩy giúp câu tiếng Việt dễ đọc nhưng không khẳng định dứt khoát rằng cụm sau chỉ bổ nghĩa cho riêng “vinh quang”; khả năng đọc liên tục được nêu ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời,” “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc; dùng “anh chị em” để thể hiện đại từ số nhiều bao gồm cả cộng đồng. Dấu phẩy giữa hai cụm giới từ ưu tiên độ rõ trong tiếng Việt, còn chú thích bảo lưu sự mơ hồ cú pháp của nguyên văn.
