revisions:
- from: Và Đức Chúa Trời của tôi sẽ chu cấp mọi nhu cầu của anh chị em theo sự giàu có của Ngài trong vinh quang, trong Đấng Mê-si-a là Đức Chúa Jêsus.[a][b][c]
  to: Và Đức Chúa Trời của tôi sẽ chu cấp mọi nhu cầu của anh chị em theo sự giàu có của Ngài trong vinh quang, trong Đấng Mê-si-a Giê-su.[a][b][c]
  rationale: Bản sửa loại bỏ tước hiệu “Đức Chúa” được thêm vào tên Giê-su, giữ nguyên lực của tước hiệu Χριστός bằng “Đấng Mê-si-a”, và dùng chính tả hiện đại “Giê-su”. Cụm “trong vinh quang, trong Đấng Mê-si-a Giê-su” cùng chú thích vẫn bảo lưu độ mở về quan hệ của hai cụm ἐν trong nguyên văn.
