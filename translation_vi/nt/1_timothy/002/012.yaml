id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: vi
  text: Nhưng tôi không cho phép người nữ dạy dỗ hoặc thực thi quyền trên người nam[a][b]; trái lại, người ấy phải ở trong sự yên tĩnh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người vợ ... người chồng.” Các từ Hy Lạp có thể mang nghĩa chung là “người nữ/người nam” hoặc nghĩa hôn nhân là “vợ/chồng.”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “có quyền trên”; cũng có người hiểu là “áp chế” hoặc “lấn quyền.” Động từ Hy Lạp này hiếm gặp và sắc thái của nó còn được tranh luận.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “trong sự im lặng.” Từ Hy Lạp này có thể chỉ sự yên tĩnh, trầm lặng hoặc im lặng, tùy theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: dạy dỗ
  rationale: Diễn đạt trực tiếp động từ nguyên mẫu làm bổ ngữ cho ἐπιτρέπω; cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý có tính tương phản nhẹ so với lời chỉ dẫn trước đó.
- source_word: γυναικί
  choice: người nữ
  rationale: γυνή có thể chỉ người nữ hoặc người vợ. Ngữ cảnh 2:9–15 nghiêng về nghĩa rộng; nghĩa hôn nhân được giữ trong chú thích.
- source_word: οὐκ ἐπιτρέπω
  choice: tôi không cho phép
  rationale: Phản ánh tự nhiên thì hiện tại và ngôi thứ nhất của nguyên văn, không thêm giới hạn thời gian.
- source_word: οὐδὲ
  choice: hay
  rationale: Nối hành động bị cấm thứ hai với hành động thứ nhất trong phạm vi phủ định; “hay” tự nhiên trong cú pháp tiếng Việt.
- source_word: αὐθεντεῖν
  choice: thực thi quyền trên
  rationale: Động từ hiếm và sắc thái còn được tranh luận. Cách dịch này giữ nghĩa quyền hành tương đối trung tính, không mặc nhiên gán sắc thái lạm quyền.
- source_word: ἀνδρός
  choice: người nam
  rationale: ἀνήρ có thể chỉ người nam hoặc người chồng. Ngữ cảnh ưu tiên nghĩa rộng, còn khả năng chỉ quan hệ vợ chồng được ghi chú.
- source_word: ἀλλ’
  choice: trái lại
  rationale: Nêu rõ sự tương phản giữa điều không được phép và tư thế được yêu cầu.
- source_word: εἶναι
  choice: người ấy phải
  rationale: Bổ sung chủ ngữ quy chiếu và sắc thái nghĩa vụ để chuyển cấu trúc nguyên mẫu sang tiếng Việt tự nhiên mà không đổi ý.
- source_word: ἐν ἡσυχίᾳ
  choice: giữ yên lặng
  rationale: ἡσυχία có thể diễn tả sự yên lặng, tĩnh lặng hoặc thái độ an tĩnh. Cách dịch này tự nhiên trong tiếng Việt nhưng vẫn cần chú thích phạm vi nghĩa.
theological_decisions:
- issue: Sắc thái của αὐθεντεῖν trong một phân đoạn gây tranh luận về vai trò trong hội chúng
  choice: thực thi quyền trên
  alternative: có quyền trên; lấn quyền hoặc áp chế
  rationale: Bản dịch chính giữ nghĩa quyền hành tương đối trung tính vì nguyên văn không buộc phải hiểu theo sắc thái lạm quyền; chú thích bảo tồn sự bất định từ vựng.
- issue: γυνή và ἀνήρ chỉ giới tính nói chung hay quan hệ hôn nhân
  choice: người nữ ... người nam
  alternative: người vợ ... người chồng
  rationale: Cả hai danh từ đều có hai khả năng. Mạch văn rộng hơn thiên về nghĩa chung, nhưng bản dịch không loại bỏ cách hiểu hôn nhân nên nêu trong chú thích.
- issue: Phạm vi nghĩa của ἡσυχία
  choice: giữ yên lặng
  alternative: ở trong sự an tĩnh; giữ im lặng
  rationale: Từ này không nhất thiết đòi hỏi sự câm lặng tuyệt đối; chú thích duy trì các sắc thái khả dĩ thay vì quyết định quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “người nữ/người nam” để phản ánh chính xác sự phân biệt giới tính trong nguyên văn; tránh diễn giải theo lập trường giáo phái. Hai điểm bất định chính—nghĩa hôn nhân và sắc thái của αὐθεντεῖν/ἡσυχία—được bảo tồn bằng chú thích.
