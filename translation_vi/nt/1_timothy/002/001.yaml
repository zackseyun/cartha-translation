id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: vi
  text: Vậy, tôi khuyên rằng trước hết hãy dâng những lời khẩn nguyện, lời cầu nguyện, lời cầu thay và lời tạ ơn vì mọi người[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm này cũng có thể dịch là “thay mặt mọi người” hoặc “vì lợi ích của mọi người”.
    reason: lexical_alternative
  - marker: b
    text: Một số người hiểu “mọi người” ở đây là “mọi hạng người”; nguyên văn Hy Lạp chỉ nói “mọi người”. Từ Hy Lạp được dùng chỉ con người nói chung, không riêng nam giới.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: tôi khuyên
  rationale: Diễn đạt lời thúc giục tha thiết mang thẩm quyền của sứ đồ bằng tiếng Việt tự nhiên; mạnh hơn một lời đề nghị thông thường nhưng không cổ kính như “khuyến cáo”.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với phần trước một cách gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: πρῶτον πάντων
  choice: trước hết
  rationale: Thể hiện sự ưu tiên, không nhất thiết xác định đây là mục đầu tiên trong một danh sách được đánh số.
- source_word: ποιεῖσθαι
  choice: hãy dâng
  rationale: Trong ngữ cảnh bốn hình thức cầu nguyện, “dâng” là cách nói tự nhiên về việc hướng lời cầu nguyện và tạ ơn lên Đức Chúa Trời; cấu trúc mệnh lệnh “hãy” chuyển tải lực của lời khuyên trong tiếng Việt.
- source_word: δεήσεις
  choice: những lời khẩn nguyện
  rationale: Giữ sắc thái cầu xin tha thiết phát sinh từ nhu cầu cấp thiết và phân biệt với từ ngữ chung chỉ sự cầu nguyện.
- source_word: προσευχάς
  choice: lời cầu nguyện
  rationale: Đây là từ ngữ chung về sự cầu nguyện; cách dịch trực tiếp, rõ ràng.
- source_word: ἐντεύξεις
  choice: lời cầu thay
  rationale: Trong ngữ cảnh cầu nguyện cho người khác, cách dịch này diễn đạt tự nhiên khía cạnh thay mặt người khác mà cầu xin.
- source_word: εὐχαριστίας
  choice: lời tạ ơn
  rationale: Giữ mục riêng trong chuỗi bốn danh từ và dùng cách diễn đạt trang trọng, quen thuộc trong tiếng Việt.
- source_word: ὑπὲρ
  choice: cho
  rationale: Diễn đạt tự nhiên ý vì lợi ích hoặc thay mặt người khác; sắc thái đầy đủ hơn được nêu trong chú thích.
- source_word: πάντων ἀνθρώπων
  choice: mọi người
  rationale: ἄνθρωπος ở đây chỉ con người nói chung, không chỉ nam giới; “mọi người” vừa chính xác vừa tự nhiên.
theological_decisions:
- issue: Phạm vi của πάντων ἀνθρώπων
  choice: mọi người
  alternative: mọi hạng người
  rationale: Cụm Hy Lạp trực tiếp nói “mọi người”. Bản dịch không thu hẹp phạm vi thành “mọi hạng người”, đồng thời chú thích ghi nhận cách hiểu đó để bảo tồn sự căng thẳng giải kinh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Chuỗi bốn thuật ngữ cầu nguyện được giữ riêng biệt; dấu phẩy giúp câu rõ nhịp. Các ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
