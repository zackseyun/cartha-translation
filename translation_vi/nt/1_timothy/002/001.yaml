revisions:
- from: Vậy, trước hết, tôi khuyên hãy dâng những lời khẩn nguyện, lời cầu nguyện, lời cầu thay và lời tạ ơn cho mọi người[a][b].
  to: Vậy, tôi khuyên rằng trước hết hãy dâng những lời khẩn nguyện, lời cầu nguyện, lời cầu thay và lời tạ ơn vì mọi người[a][b].
  rationale: Đổi “cho mọi người” thành “vì mọi người” để phản ánh rõ chức năng của ὑπέρ với sở hữu cách và tránh hiểu lầm rằng lời cầu nguyện được dâng lên con người. Cấu trúc “tôi khuyên rằng ... hãy dâng” giữ được Παρακαλῶ cùng infinitive ποιεῖσθαι, còn các thuật ngữ và phạm vi “mọi người” được bảo toàn.
  reviewer_model: gpt-5.6-terra
