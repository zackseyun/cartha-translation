  source_fidelity: Bản nháp nắm đúng thế đối lập với sự trang sức bề ngoài ở câu 9 và hiểu đúng δι’ ἔργων ἀγαθῶν là phương diện/phương tiện trang sức thích hợp, không phải công trạng cứu rỗi. Tuy nhiên, cụm “ấy là qua những việc lành” không tự nhiên trong tiếng Việt và làm quan hệ cú pháp với động từ được lược từ câu 9 trở nên gượng.
  naturalness: “Xưng mình kính thờ Đức Chúa Trời” không phải cách nói hiện đại tự nhiên; “xưng mình là người tin kính Đức Chúa Trời” rõ và trôi chảy hơn. Đưa “những việc lành” ngay sau “bằng” cũng phản ánh mạch đối chiếu trang sức cách tự nhiên.
