translation:
  language: vi
  text: nhưng hãy trang sức bằng những việc lành[c], là điều xứng hợp[a] với phụ nữ xưng mình là người tin kính Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều phù hợp” hoặc “điều phải lẽ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sống tin kính” hoặc “tôn kính Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “qua những việc lành”; trong ngữ cảnh, những việc lành là sự trang sức xứng hợp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: nhưng
  rationale: Đánh dấu sự tương phản với việc trang sức bề ngoài ở câu 9; “nhưng” tự nhiên và giữ đúng quan hệ đối lập.
- source_word: ὃ πρέπει
  choice: điều xứng hợp
  rationale: Diễn đạt thành ngữ chỉ điều phù hợp, phải lẽ về mặt đạo đức; đồng thời liên kết tự nhiên với ý trang sức từ câu trước.
- source_word: γυναιξὶν
  choice: với những phụ nữ
  rationale: Trong ngữ cảnh, danh từ số nhiều nói chung về phụ nữ, không riêng những người đã kết hôn.
- source_word: ἐπαγγελλομέναις
  choice: xưng mình
  rationale: Phân từ diễn tả việc công khai nhận mình theo đuổi hay gắn bó với điều gì; “xưng mình” không làm quá mạnh thành một lời thề.
- source_word: θεοσέβειαν
  choice: kính thờ Đức Chúa Trời
  rationale: Thể hiện lòng tôn kính và tận hiến hướng về Đức Chúa Trời bằng cách nói rõ đối tượng của sự kính thờ.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: qua những việc lành
  rationale: Giữ khá sát διά với sở hữu cách (“qua/bằng”), đồng thời cho thấy việc lành là phương diện biểu lộ thích hợp trong thế tương phản với đồ trang sức bên ngoài.
theological_decisions:
- issue: Mối quan hệ giữa “những việc lành” và việc xưng mình kính thờ Đức Chúa Trời
  choice: Giữ “qua những việc lành” như cách biểu lộ hay sự trang sức xứng hợp của những phụ nữ xưng mình kính thờ Đức Chúa Trời.
  alternative: Hiểu những việc lành là cơ sở tạo công trạng để được Đức Chúa Trời chấp nhận.
  rationale: Cú pháp và ngữ cảnh đối chiếu đồ trang sức bên ngoài với lối sống phù hợp cho người nhận mình kính thờ Đức Chúa Trời; câu này không trực tiếp phát biểu về cơ sở của sự cứu rỗi.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “Đức Chúa Trời” làm rõ đối tượng của θεοσέβεια. Bổ sung “hãy trang sức” từ mạch cú pháp của câu 9 để câu tiếng Việt trọn nghĩa; vẫn giữ chú thích cho nghĩa đen của δι’ ἔργων ἀγαθῶν.
