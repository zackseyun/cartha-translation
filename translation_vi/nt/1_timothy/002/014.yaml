  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: vi
  text: Và A-đam không bị lừa dối; nhưng người nữ, sau khi bị lừa dối[a], đã rơi vào sự vi phạm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi bị lừa dối triệt để.” Động từ Hy Lạp ở đây có thể mạnh hơn động từ “bị lừa dối” trong vế trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã ở trong tình trạng vi phạm” hoặc, sát chữ hơn, “đã trở nên ở trong sự vi phạm.” Động từ hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh trạng thái phát sinh từ hành động ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: A-đam
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: ἠπατήθη
  choice: bị lừa dối
  rationale: Diễn đạt trực tiếp thể bị động của ἀπατάω, với văn phong tự nhiên và trang trọng.
- source_word: γυνή
  choice: người nữ
  rationale: Ngữ cảnh nhắc đến trình thuật Sáng Thế và đối chiếu với A-đam; nghĩa “người nữ” phù hợp hơn “người vợ” mà không thu hẹp hàm ý.
- source_word: ἐξαπατηθεῖσα
  choice: sau khi bị lừa dối hoàn toàn
  rationale: Phân từ chỉ hành động xảy ra trước động từ chính; “hoàn toàn” thể hiện sắc thái tăng cường có thể có của động từ ghép ἐξαπατάω, đồng thời giữ sự phân biệt với ἀπατάω ở vế trước.
- source_word: ἐν παραβάσει
  choice: vào sự vi phạm
  rationale: Giữ danh từ trừu tượng παράβασις thay vì đổi thành nhãn gọi cá nhân như “người vi phạm”; kết hợp với “rơi vào” để câu tiếng Việt tự nhiên.
- source_word: γέγονεν
  choice: đã rơi vào
  rationale: Diễn đạt sự chuyển sang một tình trạng do thì hoàn thành của γίνομαι gợi ra. Chú thích bảo lưu cách hiểu nhấn mạnh trạng thái kết quả.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ quan hệ tương phản giữa A-đam và người nữ.
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ nối câu này với lập luận ngay trước đó mà không thêm sắc thái suy luận.
theological_decisions:
- issue: Cách diễn đạt mối liên hệ giữa người nữ và sự vi phạm mà không đưa thêm kết luận giáo lý về bản chất hay mức độ quy trách nhiệm của phụ nữ.
  choice: 'Dịch sát như một phát biểu gắn với trình thuật Sáng Thế: “người nữ… đã rơi vào sự vi phạm.”'
  alternative: “người nữ… đã trở thành người vi phạm” hoặc “người nữ… đã phạm tội.”
  rationale: Bản dịch giữ danh từ trừu tượng “sự vi phạm” của nguyên văn và không biến nó thành nhãn gọi con người hay đồng nhất với một kết luận thần học rộng hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng dấu chấm phẩy để làm rõ hai vế tương phản; giữ cấu trúc và sự căng thẳng thần học của nguyên văn, đồng thời dùng “rơi vào” cho lối diễn đạt tự nhiên.
