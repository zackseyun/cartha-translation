  source_fidelity: Bản dịch truyền đạt đúng mệnh đề phân từ “Đấng đã hiến chính mình” và ý phổ quát của ὑπὲρ πάντων. Tuy nhiên, “giá chuộc thay” không tự nhiên trong tiếng Việt và có thể khiến ἀντίλυτρον bị hiểu như một thuật ngữ ghép không rõ nghĩa. “Làm giá chuộc cho...” diễn đạt rõ nghĩa cốt lõi; sắc thái thay thế/đổi lấy nên được giữ trong chú thích. Phần τὸ μαρτύριον καιροῖς ἰδίοις là cụm cô đọng, và việc thêm “được bày tỏ” là một cách giải thích hợp lý nhưng vượt quá điều được phát biểu trực tiếp. Nên giữ cấu trúc danh ngữ đồng vị để bảo tồn tính mơ hồ.
  naturalness: “Đấng đã hiến chính mình làm giá chuộc cho tất cả mọi người” trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “lời chứng vào những thời điểm đã định” tuy cô đọng nhưng chấp nhận được trong văn phong Kinh Thánh; dấu chấm phẩy giúp nối cụm đồng vị mà không ép một động từ không có trong nguyên văn.
  terminology: “Hiến chính mình” phù hợp cho ἑαυτόν và văn phong trang trọng. “Giá chuộc” là thuật ngữ rõ và quen thuộc cho λύτρον/ἀντίλυτρον. “Tất cả mọi người” bảo toàn πάντων trong ngữ cảnh. “Lời chứng” là lựa chọn thích hợp cho μαρτύριον. “Những thời điểm đã định” phản ánh καιροῖς ἰδίοις mà không khẳng định quá mức về tác nhân ấn định.
