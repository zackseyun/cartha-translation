source:
  edition: SBLGNT
  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: vi
  text: Đấng đã hiến chính mình làm giá chuộc cho tất cả mọi người[a]; lời chứng vào những thời điểm đã định[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì lợi ích của tất cả mọi người.” Cách nói này giữ phạm vi rộng của tiếng Hy Lạp mà không quyết định ở đây “tất cả” có nghĩa là từng người hay mọi hạng người. Danh từ “giá chuộc” cũng có sắc thái đổi lấy hoặc thay thế.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn là một cụm cô đọng: “lời chứng vào những thời điểm riêng/thích hợp.” Cụm này có thể được hiểu là lời chứng được bày tỏ vào những thời điểm Đức Chúa Trời đã định, hoặc là sự tự hiến của Đấng Christ chính là lời chứng ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: đã hiến
  rationale: Phân từ bất định của δίδωμι bổ nghĩa cho Đấng Christ Jesus ở câu trước. “Đã hiến” diễn đạt tự nhiên hành động tự nguyện trao ban chính mình.
- source_word: ἑαυτὸν
  choice: chính mình
  rationale: Đại từ phản thân nhấn mạnh việc Đấng Christ tự hiến thân.
- source_word: ἀντίλυτρον
  choice: giá chuộc thay
  rationale: “Giá chuộc” truyền đạt ý nghĩa cứu chuộc; “thay” phản ánh sắc thái trao đổi hoặc thay thế của tiền tố ἀντί- mà không triển khai thành một cách giải thích thần học dài dòng.
- source_word: ὑπὲρ πάντων
  choice: cho tất cả mọi người
  rationale: ὑπέρ có nghĩa là “cho, vì, thay mặt cho”; πάντων mang phạm vi phổ quát. Cách dịch này giữ nguyên độ rộng của câu mà không quyết định cuộc tranh luận về phạm vi cứu chuộc.
- source_word: τὸ μαρτύριον
  choice: lời chứng được bày tỏ
  rationale: Cụm danh từ nén có thể đồng vị hoặc tóm lại sự tự hiến vừa nói. Thêm “được bày tỏ” làm rõ quan hệ với cụm chỉ thời điểm trong tiếng Việt, đồng thời không xác định quá mức ai là người làm chứng.
- source_word: καιροῖς ἰδίοις
  choice: vào những thời điểm đã định
  rationale: Dạng số nhiều chỉ những thời điểm thích hợp hoặc được ấn định. Cách dịch này tự nhiên và giữ số nhiều của καιροῖς.
theological_decisions:
- issue: Phạm vi của πάντων đối với giá chuộc của Đấng Christ
  choice: cho tất cả mọi người
  alternative: cho mọi hạng người
  rationale: Bản văn dùng cách nói phổ quát; bản dịch không thu hẹp thành mọi hạng người, cũng không chú giải rằng câu này tự nó giải quyết toàn bộ tranh luận về phạm vi cứu chuộc.
- issue: Sắc thái thay thế của ἀντίλυτρον
  choice: giá chuộc thay
  alternative: giá chuộc
  rationale: Tiền tố ἀντί- có sắc thái đổi lấy hoặc thay thế. “Giá chuộc thay” giữ sắc thái ấy một cách gọn, nhưng không phát triển thành một công thức tín lý vượt quá từ ngữ Hy Lạp.
- issue: Quan hệ của τὸ μαρτύριον với mệnh đề trước
  choice: Dùng dấu gạch ngang và hiểu cụm này như lời đồng vị/tóm kết về sự tự hiến của Đấng Christ
  alternative: “ấy là lời chứng vào những thời điểm đã định” hoặc giữ nguyên cụm danh từ “lời chứng vào những thời điểm đã định”
  rationale: Cú pháp Hy Lạp cô đọng và có thể hiểu theo hơn một cách. Bản chính làm rõ vừa đủ để tiếng Việt không rời rạc, còn chú thích bảo tồn tính mơ hồ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hiến chính mình” tự nhiên hơn lối dịch quá sát “cho chính mình”; “những thời điểm đã định” giữ số nhiều và hàm ý thời điểm thích hợp. Dấu gạch ngang giúp người đọc nhận ra cụm cuối có tính đồng vị với sự tự hiến, trong khi chú thích ghi nhận cú pháp cô đọng của nguyên văn.
