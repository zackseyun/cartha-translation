id: 1TI.2.4
reference: 1 Timothy 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: vi
  text: Đấng muốn[a] mọi người được cứu và đạt đến sự nhận biết chân lý[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mong muốn.” Động từ Hy Lạp có thể mang nghĩa “muốn,” “mong muốn” hoặc “có ý muốn”; chính văn dùng “muốn” để không tự giải quyết những tranh luận thần học vượt quá lời văn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự nhận biết đầy đủ về chân lý.” Danh từ Hy Lạp có thể hàm ý sự nhận biết trọn vẹn hoặc đầy đủ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Đấng
  rationale: Đại từ quan hệ này quy chiếu về Đức Chúa Trời trong câu trước. “Đấng” nối tự nhiên với tiền ngữ chỉ Đức Chúa Trời và giữ sắc thái trang trọng, dù trong tiếng Việt không cần lặp lại một đại từ quan hệ riêng.
- source_word: πάντας ἀνθρώπους
  choice: mọi người
  rationale: Cụm từ chỉ toàn thể con người nói chung, không riêng nam giới. “Mọi người” là cách diễn đạt tự nhiên, rõ ràng và không tự ý thu hẹp thành “mọi hạng người”.
- source_word: θέλει
  choice: muốn
  rationale: Động từ có thể mang nghĩa muốn, mong muốn hoặc có ý định. “Muốn” là từ tiếng Việt trực tiếp và trung tính, không biến động từ thành một thuật ngữ kỹ thuật về ý chỉ hay tiền định.
- source_word: σωθῆναι
  choice: được cứu
  rationale: Đây là động từ nguyên mẫu bị động của σῴζω; trong ngữ cảnh thư Phao-lô, “được cứu” diễn đạt rõ ý nghĩa cứu rỗi và giữ nguyên thể bị động.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: đạt đến sự nhận biết chân lý
  rationale: Giới từ εἰς cùng ἐλθεῖν diễn tả sự tiến đến một trạng thái. “Đạt đến sự nhận biết chân lý” tự nhiên trong tiếng Việt; “sự nhận biết” giữ được khả năng có sắc thái hiểu biết đầy đủ hơn mà không bắt buộc đưa sắc thái ấy vào chính văn.
- source_word: ἐλθεῖν
  choice: đạt đến
  rationale: Dạng nguyên mẫu của ἔρχομαι kết hợp với εἰς được dùng theo nghĩa đi đến hay bước vào một trạng thái; “đạt đến” phù hợp với danh ngữ trừu tượng “sự nhận biết” hơn cách dịch từng chữ “đến”.
theological_decisions:
- issue: Phạm vi của πάντας ἀνθρώπους và ý muốn cứu rỗi của Đức Chúa Trời
  choice: Dịch thẳng là “mọi người” và dùng động từ trung tính “muốn”.
  alternative: “mọi hạng người”; “quyết định cho mọi người được cứu”; “mong mọi người được cứu”
  rationale: Cụm Hy Lạp tự nhiên mang phạm vi phổ quát. Bản dịch không thu hẹp thành các hạng người, cũng không nâng θέλει thành một thuật ngữ kỹ thuật về ý chỉ quyết định; nhờ đó giữ nguyên sự căng thẳng thần học vốn có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đấng” duy trì liên kết với Đức Chúa Trời ở câu trước; “chân lý” phù hợp với ngữ vực Kinh Thánh mà vẫn thông dụng. Các dấu chú thích được đặt ngay sau từ hoặc cụm từ liên quan.
