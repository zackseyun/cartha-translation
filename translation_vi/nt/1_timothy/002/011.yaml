  - severity: low
    issue: “Người nữ” không phải lựa chọn tự nhiên nhất trong văn phong tiếng Việt hiện đại.
    rationale: “Người phụ nữ” là cách gọi chuẩn, trang trọng và dễ đọc hơn, đồng thời không đòi hỏi hiểu γυνή là “vợ”.
  - severity: low
