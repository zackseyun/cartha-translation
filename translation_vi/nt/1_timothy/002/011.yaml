base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: vi
  text: Người phụ nữ phải học trong sự yên tĩnh[b][a], trong sự thuận phục trọn vẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “người vợ”, tùy theo ngữ cảnh; từ Hy Lạp có thể mang nghĩa “người phụ nữ” hoặc “người vợ”.
    reason: alternative_reading
  - marker: b
    text: Hoặc “trong sự im lặng”; từ Hy Lạp cũng có thể chỉ sự yên tĩnh hoặc điềm tĩnh, không nhất thiết là hoàn toàn không nói.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: Người nữ
  rationale: γυνή có thể chỉ “người nữ” hoặc “vợ” tùy ngữ cảnh. Ở đây, danh từ số ít không có mạo từ được hiểu phù hợp nhất theo nghĩa khái quát; “người nữ” giữ nguyên số ít mà không mặc nhiên giới hạn vào tình trạng hôn nhân.
- source_word: ἐν ἡσυχίᾳ
  choice: trong sự yên lặng
  rationale: ἡσυχία có thể diễn tả sự yên lặng, điềm tĩnh hoặc không gây xáo trộn, chứ không nhất thiết là tuyệt đối không được nói. Cách dịch này giữ hình thức cụm giới từ và để chú thích bảo lưu nghĩa mạnh hơn là “im lặng”.
- source_word: μανθανέτω
  choice: phải học
  rationale: Động từ mệnh lệnh hiện tại ngôi ba số ít truyền đạt một chỉ thị tích cực rằng người nữ cần học. “Phải học” thể hiện rõ lực mệnh lệnh trong tiếng Việt hiện đại.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: với thái độ hoàn toàn thuận phục
  rationale: ὑποταγή chỉ sự thuận phục hoặc phục tùng, còn πάσῃ nhấn mạnh tính trọn vẹn. Cách diễn đạt tự nhiên này không thêm đối tượng của sự thuận phục, vì nguyên văn không nêu đối tượng.
theological_decisions:
- issue: ἡσυχία có đòi hỏi sự im lặng tuyệt đối hay chỉ một cung cách yên lặng, điềm tĩnh
  choice: sự yên lặng
  alternative: sự im lặng
  rationale: Từ Hy Lạp có thể mang nghĩa “im lặng”, nhưng cũng thường chỉ trạng thái yên tĩnh, điềm đạm và không gây rối. Bản dịch chính không làm mệnh lệnh tuyệt đối hơn mức từ ngữ Hy Lạp đòi hỏi, còn chú thích bảo lưu phương án kia.
- issue: γυνή nên được hiểu là “người nữ” hay “vợ”
  choice: người nữ
  alternative: vợ
  rationale: Câu này không đánh dấu rõ một ngữ cảnh hôn nhân. “Người nữ” tránh thu hẹp đối tượng quá mức, trong khi chú thích vẫn giữ khả năng hiểu là “vợ” tùy theo cách xác định ngữ cảnh.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. “Người nữ” trang trọng hơn “một phụ nữ” và giữ sắc thái khái quát của danh từ số ít; “thuận phục” bảo lưu nội dung thần học mà không tự ý nêu người hoặc thẩm quyền nhận sự thuận phục.
