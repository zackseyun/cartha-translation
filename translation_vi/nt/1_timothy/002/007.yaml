id: 1TI.2.7
reference: 1 Timothy 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: vi
  text: Vì điều này[a], tôi đã được chỉ định làm người loan báo và sứ đồ—tôi nói sự thật, không nói dối—làm người dạy dỗ các dân ngoại[b] trong đức tin và chân lý[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì việc ấy mà tôi đã được chỉ định.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm người dạy dỗ các dân tộc.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trong sự thành tín và chân lý.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Chính vì điều ấy
  rationale: Cụm giới từ và đại từ quan hệ chỉ về lời chứng hoặc mục đích cứu rỗi vừa được nói đến. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được khả năng hiểu theo nghĩa nguyên nhân hoặc mục đích; phương án sát cấu trúc hơn được ghi ở chú thích.
- source_word: ἐτέθην
  choice: tôi đã được lập
  rationale: Thể bị động của τίθημι ở đây diễn tả việc được chỉ định hay bổ nhiệm vào một nhiệm vụ, chứ không phải được đặt ở một vị trí vật lý.
- source_word: κῆρυξ
  choice: người rao truyền
  rationale: κῆρυξ là người công khai loan báo với tư cách đại diện cho một người khác. “Người rao truyền” dễ hiểu, trang trọng và ít mang sắc thái chức danh giáo phái hơn “nhà truyền đạo”.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Trong lời Phao-lô nói về chính mình, ἀπόστολος là một chức vụ được nhận biết rõ. “Sứ đồ” là cách gọi quen thuộc và phân biệt với từ phổ thông “sứ giả”.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: tôi nói sự thật, không nói dối
  rationale: Giữ nguyên lời xác quyết kép đầy nhấn mạnh, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: διδάσκαλος ἐθνῶν
  choice: làm thầy dạy các dân ngoại
  rationale: Trong văn cảnh thư Phao-lô, ἔθνη thường chỉ những dân không thuộc dân Do Thái. “Các dân ngoại” truyền đạt đối tượng ấy rõ hơn, trong khi nghĩa rộng “các dân tộc” vẫn được bảo lưu ở chú thích.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: trong đức tin và chân lý
  rationale: Giữ cấu trúc ἐν và không quyết định quá mức liệu cụm từ mô tả phạm vi, phẩm chất hay cách thức thi hành chức vụ. πίστις được dịch theo nghĩa thông dụng là “đức tin”; khả năng mang nghĩa “sự thành tín” được ghi chú.
theological_decisions:
- issue: Đối tượng của ἐθνῶν trong sứ mạng của Phao-lô
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Cách dùng quen thuộc của Phao-lô và văn cảnh phân biệt với dân Do Thái ủng hộ nghĩa “các dân ngoại”, nhưng từ Hy Lạp tự nó cũng có thể mang nghĩa rộng là “các dân tộc”.
- issue: Nghĩa của πίστις trong ἐν πίστει καὶ ἀληθείᾳ
  choice: đức tin
  alternative: sự thành tín
  rationale: “Đức tin” là nghĩa phù hợp và quen thuộc, nhưng πίστις cũng có thể chỉ phẩm chất thành tín; chú thích bảo tồn khả năng này mà không áp đặt một cách giải nghĩa thần học riêng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người rao truyền” để làm rõ chức năng của κῆρυξ, “sứ đồ” theo thuật ngữ Kinh Thánh quen thuộc, và “chân lý” để diễn đạt ἀλήθεια trong cụm mang sắc thái khái niệm. Các dấu gạch ngang giữ lời xác quyết chen giữa của Phao-lô. Các chỉ dấu chú thích được đặt sau toàn câu theo thứ tự a, b, c và từng chú thích nêu rõ cụm từ liên quan.
