  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: vi
  text: Điều này là tốt lành và được chấp nhận trước mặt Đức Chúa Trời, Đấng Cứu Rỗi của chúng ta,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Điều này
  rationale: Đại từ chỉ định giống trung số ít quy chiếu về lời chỉ dẫn cầu nguyện ở phần trước; “Điều này” tự nhiên trong tiếng Việt và không diễn giải quá mức.
- source_word: καλὸν
  choice: tốt đẹp
  rationale: Trong ngữ cảnh đạo đức, từ này nói đến điều tốt lành, đúng đắn và thích hợp hơn là vẻ đẹp thẩm mỹ; “tốt đẹp” giữ được sắc thái tích cực rộng.
- source_word: ἀπόδεκτον
  choice: đáng được chấp nhận
  rationale: Tính từ diễn tả điều được đón nhận thuận tình. Cách dịch này giữ sắc thái đánh giá mà không chuyển hẳn sang nghĩa giàu cảm xúc hơn như “đẹp lòng”.
- source_word: ἐνώπιον
  choice: trước mặt
  rationale: Cụm từ diễn tả sự đánh giá trong cái nhìn hay sự hiện diện của Đức Chúa Trời; “trước mặt” vừa sát nghĩa vừa tự nhiên, trang trọng trong tiếng Việt.
- source_word: σωτῆρος
  choice: Đấng Cứu Rỗi
  rationale: Đây là tước hiệu chỉ Đấng cứu thoát; “Đấng Cứu Rỗi” là cách gọi rõ ràng, quen thuộc và giữ được trọng lượng thần học của từ Hy Lạp.
- source_word: ἡμῶν
  choice: của chúng ta
  rationale: Đại từ sở hữu được giữ trực tiếp và bổ nghĩa cho tước hiệu “Đấng Cứu Rỗi”.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Danh từ ở sở hữu cách đồng vị với “Đấng Cứu Rỗi”; trật tự tiếng Việt “Đức Chúa Trời, Đấng Cứu Rỗi của chúng ta” diễn đạt rõ quan hệ đồng vị.
theological_decisions:
- issue: Quan hệ đồng vị trong τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Đức Chúa Trời, Đấng Cứu Rỗi của chúng ta
  alternative: Đấng Cứu Rỗi, là Đức Chúa Trời của chúng ta
  rationale: Các từ ở sở hữu cách được hiểu tự nhiên theo quan hệ đồng vị, xác định Đức Chúa Trời là Đấng Cứu Rỗi của chúng ta. Cách dịch được chọn tự nhiên trong tiếng Việt và không thêm một mệnh đề giải thích vốn không có trong nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang câu 4; không thêm chú thích vì không có dị bản hay điểm mơ hồ cần đánh dấu trong chính câu này.
