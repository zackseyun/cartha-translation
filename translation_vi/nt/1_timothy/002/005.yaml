language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: vi
  text: Vì chỉ có một Đức Chúa Trời, và chỉ có một Đấng Trung Gian giữa Đức Chúa Trời và loài người, là con người, Đấng Mê-si-a Giê-su[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là người, Đấng Mê-si-a Giê-su.” Tiếng Hy Lạp không có mạo từ trước “con người”; cụm này có tính đồng vị với “Đấng Trung Gian” và nhấn mạnh nhân tính của Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Đấng Christ Giê-su.” Từ Hy Lạp Χριστός là chức danh tương ứng với “Đấng Mê-si-a.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἷς
  choice: chỉ có một
  rationale: Giữ sự nhấn mạnh và cấu trúc song song giữa “một Đức Chúa Trời” và “một Đấng Trung Gian”; “chỉ có” diễn đạt tự nhiên ý độc nhất trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Đánh dấu quan hệ giải thích với lời khuyên và lập luận ở phần trước.
- source_word: θεός
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt dành cho θεός trong ngữ cảnh này.
- source_word: εἷς καὶ μεσίτης
  choice: cũng chỉ có một Đấng Trung Gian
  rationale: “Cũng” thể hiện καὶ và làm rõ vế song song; “Đấng Trung Gian” là cách diễn đạt tự nhiên cho người đứng giữa hai bên.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: giữa Đức Chúa Trời và loài người
  rationale: Các sở hữu cách Hy Lạp được chuyển thành cấu trúc “giữa ... và ...” theo cách dùng tự nhiên của danh từ “Đấng Trung Gian”; ἀνθρώπων chỉ toàn thể nhân loại.
- source_word: ἄνθρωπος
  choice: một con người
  rationale: Nêu rõ nhân tính thật của Đấng Trung Gian. Mạo từ “một” phù hợp với danh từ không có mạo từ trong tiếng Hy Lạp mà không buộc cụm từ phải mang nghĩa bất định tuyệt đối.
- source_word: Χριστὸς Ἰησοῦς
  choice: Đấng Mê-si-a Giê-su
  rationale: Dịch Χριστός theo chức danh là “Đấng Mê-si-a” và phiên âm tên riêng Ἰησοῦς là “Giê-su”, đồng thời giữ thứ tự chức danh–tên của nguyên văn.
theological_decisions:
- issue: Mối liên hệ giữa ἀνθρώπων và ἄνθρωπος
  choice: “loài người ... một con người”
  alternative: “nhân loại ... con người” hoặc “mọi người ... người”
  rationale: Hai cách diễn đạt có chung trường nghĩa về nhân loại, qua đó giữ được sự đối chiếu giữa toàn thể loài người và nhân tính của Đấng Trung Gian mà vẫn tự nhiên trong tiếng Việt.
- issue: Chức danh Χριστός
  choice: “Đấng Mê-si-a”
  alternative: “Đấng Christ”
  rationale: Ở đây Χριστός nhận diện Giê-su theo chức vụ được xức dầu; dịch nghĩa chức danh giúp người đọc hiện đại nhận ra chức năng ấy.
- issue: Hàm ý Kitô học của ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: Dịch thẳng là “một con người—Đấng Mê-si-a Giê-su”
  alternative: Diễn giải thêm rằng Ngài vừa là Đức Chúa Trời vừa là người
  rationale: Nguyên văn nhấn mạnh nhân tính của Đấng Trung Gian nhưng tại câu này không trực tiếp bàn về thần tính của Ngài; bản dịch giữ nguyên trọng tâm và sự căng thẳng thần học thay vì bổ sung một kết luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” và “Đấng Trung Gian” theo lối gọi tôn kính quen thuộc; dấu gạch ngang giúp cụm đồng vị cuối câu rõ ràng mà không thêm nội dung ngoài nguyên văn.
