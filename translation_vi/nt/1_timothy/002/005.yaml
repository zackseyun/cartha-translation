    rationale: ἄνθρωπος không có mạo từ và đứng đồng vị với “Đấng Trung Gian”; trong ngữ cảnh này sắc thái chính là miêu tả/nhấn mạnh nhân tính, không phải giới thiệu “một” cá thể bất định. Bỏ “ấy là một” giúp tránh sắc thái không cần thiết.
