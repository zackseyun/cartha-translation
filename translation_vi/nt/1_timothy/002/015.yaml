id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: vi
  text: Tuy vậy, người nữ sẽ được cứu qua việc sinh con[a], nếu họ[c] bền vững trong đức tin[b], tình yêu thương và sự thánh khiết, với lòng tự chủ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “qua sự sinh nở ấy”. Một số người hiểu đây là một cuộc sinh nở cụ thể, có thể là sự giáng sinh của Đấng Mê-si-a; tuy nhiên, cụm từ này cũng có thể được hiểu theo nghĩa khái quát là “qua việc sinh con”.
    reason: alternative_reading
  - marker: b
    text: “Đức tin” ở đây cũng có thể được hiểu là “lòng trung tín”.
    reason: lexical_alternative
  - marker: c
    text: Bản Hy Lạp chuyển từ số ít (“người nữ sẽ được cứu”) sang số nhiều (“nếu họ bền vững”).
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Dạng tương lai bị động của σῴζω thường mang nghĩa “được cứu” trong cách dùng của Phao-lô. Cách dịch này không thu hẹp ý thành sự an toàn thể chất khi sinh nở.
- source_word: δὲ
  choice: Tuy vậy
  rationale: δέ đánh dấu một sự tương phản hoặc chuyển ý nhẹ so với câu trước; “Tuy vậy” truyền đạt sắc thái ấy một cách tự nhiên.
- source_word: διὰ τῆς τεκνογονίας
  choice: qua việc sinh con
  rationale: τεκνογονία chỉ việc sinh con. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời không quyết định mạo từ là nghĩa khái quát hay ám chỉ một cuộc sinh nở cụ thể.
- source_word: ἐὰν
  choice: nếu
  rationale: ἐάν mở đầu một mệnh đề điều kiện; “nếu” là cách tương đương trực tiếp và tự nhiên.
- source_word: μείνωσιν
  choice: bền vững
  rationale: μένω ở đây diễn tả việc tiếp tục hoặc kiên trì trong một trạng thái. “Bền vững trong” vừa tự nhiên vừa giữ được ý kiên trì, không biến điều kiện thành một hành động nhất thời.
- source_word: ἐν πίστει
  choice: trong đức tin
  rationale: πίστις thường được dịch là “đức tin”. Nghĩa “lòng trung tín” vẫn có thể có trong ngữ cảnh này và được giữ ở chú thích.
- source_word: ἀγάπῃ
  choice: tình yêu thương
  rationale: Đây là cách dịch thông dụng, rõ ràng của ἀγάπη trong danh sách các phẩm chất Cơ Đốc.
- source_word: ἁγιασμῷ
  choice: sự thánh khiết
  rationale: ἁγιασμός có thể chỉ sự nên thánh hoặc sự thánh khiết. “Sự thánh khiết” phù hợp với danh sách phẩm chất và tránh thuật ngữ thần học quá chuyên môn.
- source_word: μετὰ σωφροσύνης
  choice: với lòng tự chủ
  rationale: σωφροσύνη bao hàm sự tự chủ, tỉnh táo và phán đoán đúng mực. “Lòng tự chủ” rõ nghĩa và phù hợp với trọng tâm đạo đức của câu.
theological_decisions:
- issue: Sự chuyển đổi từ số ít “người nữ ấy sẽ được cứu” sang số nhiều “nếu họ”
  choice: Giữ nguyên sự chuyển đổi ngữ pháp từ số ít sang số nhiều.
  alternative: Làm phẳng cách diễn đạt thành “các phụ nữ sẽ được cứu… nếu họ”, hoặc hiểu số ít là Ê-va và số nhiều là phụ nữ nói chung.
  rationale: Bản Hy Lạp thực sự chuyển từ động từ số ít sang động từ số nhiều. Giữ “người nữ ấy” và “họ” bảo tồn một đặc điểm đáng chú ý của nguồn văn bản, thay vì âm thầm quyết định người được nói đến là ai.
- issue: Ý nghĩa của “được cứu qua việc sinh con”
  choice: Giữ nguyên cách nói “được cứu qua việc sinh con” mà không xác định loại cứu rỗi hay cơ chế của sự cứu rỗi.
  alternative: Được giữ an toàn khi sinh con; được cứu nhờ đảm nhận thiên chức làm mẹ; hoặc được cứu qua sự giáng sinh của Đấng Mê-si-a.
  rationale: Cụm từ Hy Lạp có nhiều cách hiểu thực sự đang được tranh luận. Văn bản không nói rõ đây là sự an toàn thể chất, vai trò làm mẹ hay một cuộc sinh nở cụ thể, nên bản dịch chính không áp đặt một cách giải thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Người nữ ấy” làm rõ số ít của động từ Hy Lạp và liên kết với ngữ cảnh trước; “họ” cố ý giữ sự chuyển sang số nhiều. Câu dịch bảo tồn sự mơ hồ thần học của cụm “được cứu qua việc sinh con”.
