id: 1TI.2.8
reference: 1 Timothy 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: vi
  text: Vậy, tôi muốn những người nam ở mọi nơi cầu nguyện, giơ đôi tay thánh khiết lên, không giận dữ hay tranh cãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không giận dữ hay nghi ngờ.” Từ Hy Lạp có thể chỉ sự suy xét trong lòng hoặc sự nghi ngờ, nhưng tại đây có lẽ nói đến việc tranh cãi gây xung đột trong hội chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: tôi muốn
  rationale: Diễn đạt tự nhiên ý muốn có sức định hướng của Phao-lô, không làm câu trang trọng quá mức.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ mối liên hệ suy luận và tiếp nối với phần trước bằng cách nói tự nhiên trong tiếng Việt.
- source_word: προσεύχεσθαι
  choice: cầu nguyện
  rationale: Cách dịch thông dụng và chính xác của động từ chỉ sự cầu nguyện.
- source_word: τοὺς ἄνδρας
  choice: những người nam
  rationale: Giữ nét chỉ giới tính của ἀνήρ trong ngữ cảnh những lời chỉ dẫn phân biệt dành cho nam và nữ; không mở rộng thành mọi người hay thu hẹp thành các người chồng.
- source_word: ἐν παντὶ τόπῳ
  choice: ở mọi nơi
  rationale: Giữ ý phân bố của cụm từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπαίροντας
  choice: giơ ... lên
  rationale: Diễn tả tư thế đi kèm với việc cầu nguyện.
- source_word: ὁσίους χεῖρας
  choice: đôi tay thánh sạch
  rationale: “Thánh sạch” diễn đạt phẩm chất phù hợp với Đức Chúa Trời và đời sống đạo hạnh của ὅσιος, đồng thời tránh để “tay thánh” bị hiểu quá cứng hoặc như một vật tự thân linh thiêng.
- source_word: χωρὶς
  choice: không
  rationale: Diễn đạt rõ sự vắng mặt của những thái độ được nêu sau đó.
- source_word: ὀργῆς
  choice: giận dữ
  rationale: Tự nhiên và phù hợp với bối cảnh quan hệ cộng đồng hơn từ “thịnh nộ” nặng sắc thái.
- source_word: διαλογισμοῦ
  choice: tranh cãi
  rationale: Trong sự kết hợp với “giận dữ” và bối cảnh cầu nguyện trong hội chúng, từ này có khả năng chỉ sự tranh luận mang tính đối đầu; nghĩa “nghi ngờ” vẫn được giữ trong chú thích.
theological_decisions:
- issue: Phạm vi giới tính của τοὺς ἄνδρας
  choice: những người nam
  alternative: mọi người; những người chồng
  rationale: Danh từ Hy Lạp ở đây chỉ nam giới, và văn cảnh kế tiếp đưa ra những lời chỉ dẫn riêng cho nữ giới. Bản dịch không xóa bỏ cũng không thu hẹp nét nghĩa ấy.
- issue: Nghĩa của διαλογισμοῦ trong bối cảnh cầu nguyện
  choice: tranh cãi
  alternative: nghi ngờ; lý luận; tranh luận
  rationale: Cách hiểu về xung đột trong cộng đồng phù hợp nhất khi từ này đi cùng “giận dữ”, nhưng nguyên ngữ cũng có thể chỉ suy luận nội tâm hoặc nghi ngờ; vì thế phương án ấy được ghi ở chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Vậy” nối câu với lập luận trước; “những người nam” giữ tính xác định giới của nguyên văn; chú thích bảo tồn sự đa nghĩa thật sự của διαλογισμός.
