id: 1TI.2.2
reference: 1 Timothy 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: vi
  text: cho các vua và tất cả những người ở địa vị cao[a], để chúng ta có thể sống một đời sống yên ổn và yên tĩnh, với tất cả lòng tin kính và sự nghiêm trang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những người có thẩm quyền.” Cụm từ Hy Lạp theo nghĩa đen là “tất cả những người ở địa vị cao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: cho
  rationale: Trong mạch văn nói về cầu nguyện và cầu thay, từ này chỉ những người mà lời cầu nguyện hướng đến; “cho” tự nhiên và chính xác trong tiếng Việt.
- source_word: βασιλέων
  choice: các vua
  rationale: Danh từ chỉ đích danh các vua hoặc quân vương; giữ cách gọi cụ thể thay vì khái quát thành mọi nhà cai trị.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: tất cả những người ở địa vị cao
  rationale: Cụm Hy Lạp nói theo nghĩa đen về những người ở vị thế nổi trội hoặc cao hơn, rộng hơn phạm vi chức quyền chính thức.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả được nhắm tới.
- source_word: ἤρεμον καὶ ἡσύχιον
  choice: yên ổn và thanh bình
  rationale: 'Giữ hai sắc thái gần nhau nhưng không đồng nhất: không bị xáo trộn và có trạng thái an tĩnh.'
- source_word: βίον διάγωμεν
  choice: chúng ta có thể sống một cuộc đời
  rationale: βίος nói đến đời sống trên trần thế hay nếp sống, còn διάγω mô tả việc trải qua hoặc sống cuộc đời ấy; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: với lòng tin kính trọn vẹn
  rationale: εὐσέβεια chỉ lòng tôn kính Thiên Chúa được thể hiện trong đời sống; πάσῃ nhấn mạnh tính đầy đủ, toàn diện.
- source_word: σεμνότητι
  choice: phẩm giá
  rationale: Từ này nói đến tính nghiêm trang, đứng đắn và đáng kính; “phẩm giá” truyền đạt rõ sức nặng đạo đức-xã hội trong tiếng Việt hiện đại.
theological_decisions:
- issue: Phạm vi và mục đích của việc cầu nguyện cho người cai trị
  choice: Câu văn nói đến việc cầu nguyện cho các vua và những người ở địa vị cao, nhằm tạo điều kiện để cộng đồng sống yên ổn, tin kính và có phẩm giá.
  alternative: Diễn đạt theo hướng nhấn mạnh sự phục tùng nhà cầm quyền, hoặc thu hẹp đối tượng vào những người có thẩm quyền chính thức.
  rationale: Bản Hy Lạp xác định đối tượng của lời cầu nguyện và đời sống xã hội được nhắm tới, nhưng không tuyên bố rằng mọi người cai trị đều được tán thành vô điều kiện; bản dịch không thêm một lập trường chính trị-thần học ngoài câu văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Các vua” giữ nét lịch sử và từ vựng của nguyên bản; “địa vị cao” bảo toàn phạm vi rộng của ὑπεροχή. Hai tính từ ἤρεμον và ἡσύχιον được phân biệt vừa đủ bằng “yên ổn” và “thanh bình”.
