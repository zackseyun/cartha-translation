id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: vi
  text: Cũng vậy, phụ nữ phải tô điểm cho mình bằng y phục đoan trang, với sự kín đáo[a] và tự chủ, không bằng tóc tết, vàng, ngọc trai hay quần áo đắt tiền,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “với sự e dè” hoặc “với ý thức đúng mực.”
    reason: lexical_alternative
  - marker: b
    text: “Tóc tết, vàng, ngọc trai hay quần áo đắt tiền” có lẽ nói đến cách tô điểm phô trương, xa hoa, chứ không nhất thiết cấm mọi kiểu tóc tết hoặc mọi việc dùng đồ trang sức trong mọi hoàn cảnh.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên kết bổ sung với lời khuyên trước đó; tiếng Việt không cần dịch καί thành một từ riêng.
- source_word: γυναῖκας
  choice: phụ nữ
  rationale: Ngữ cảnh khuyên dạy chung và không có dấu hiệu hôn nhân, nên nghĩa rộng 'phụ nữ' thích hợp hơn 'những người vợ'.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: bằng y phục đoan trang
  rationale: καταστολή chỉ y phục/cách ăn mặc, còn κόσμιος nhấn mạnh tính đúng mực, chỉnh tề; cách dịch này tự nhiên và trang trọng trong tiếng Việt.
- source_word: μετὰ αἰδοῦς
  choice: với lòng khiêm nhường
  rationale: αἰδώς nói đến ý thức e dè, biết giữ mình trước điều không thích hợp. 'Lòng khiêm nhường' tránh nghĩa thuần túy về độ kín của trang phục, nhưng cần chú thích vì cũng có thể dịch là 'sự kín đáo' hay 'ý thức đúng mực'.
- source_word: σωφροσύνης
  choice: sự tự chủ
  rationale: Truyền đạt sự sáng suốt thể hiện qua tiết chế và biết giữ mình bằng cách nói hiện đại, rõ nghĩa.
- source_word: κοσμεῖν ἑαυτάς
  choice: phải trang điểm cho mình
  rationale: Giữ hình ảnh 'tô điểm/trang sức' của κοσμέω và mối tương phản với các hình thức phô trương phía sau; 'phải' diễn đạt lực khuyên dạy được kế thừa từ câu trước.
- source_word: μὴ ἐν πλέγμασιν
  choice: không bằng tóc tết cầu kỳ
  rationale: πλέγματα là những kiểu tóc tết/bện; thêm 'cầu kỳ' làm rõ sắc thái kiểu tóc được tạo tác để phô trương trong bối cảnh, đồng thời chú thích để không biến thành lệnh cấm mọi kiểu tóc tết.
- source_word: χρυσίῳ
  choice: vàng
  rationale: Giữ cách gọi rộng của nguyên văn, không tự giới hạn thành một loại đồ trang sức cụ thể.
- source_word: μαργαρίταις
  choice: ngọc trai
  rationale: Nghĩa từ vựng thông thường, thuộc danh sách những vật trang sức xa hoa.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: quần áo đắt tiền
  rationale: Diễn đạt rõ và hiện đại nghĩa của y phục có giá trị cao, phù hợp với sự tương phản về lối tô điểm phô trương.
theological_decisions:
- issue: Câu này nói về phụ nữ nói chung hay riêng những người vợ
  choice: phụ nữ nói chung
  alternative: những người vợ
  rationale: Danh từ số nhiều không có dấu hiệu ngữ cảnh giới hạn vào quan hệ hôn nhân; dịch 'phụ nữ' không thu hẹp đối tượng quá mức.
- issue: Danh sách tóc tết, vàng, ngọc trai và quần áo đắt tiền là lệnh cấm tuyệt đối hay phê phán sự tô điểm phô trương
  choice: Giữ nguyên hình thức phủ định trong chính văn, đồng thời chú thích rằng ngữ cảnh có thể nhắm đến sự phô trương xa hoa
  alternative: Hiểu là lệnh cấm tuyệt đối mọi kiểu tóc tết, vàng, ngọc trai và quần áo đắt tiền
  rationale: Cú pháp đặt cách tô điểm đoan trang, khiêm nhường và tự chủ đối lập với danh sách biểu hiện xa hoa. Chính văn không thêm điều kiện ngoài nguyên bản, còn chú thích trình bày ý nghĩa văn hóa có khả năng nhất mà không xóa bỏ sức căng của lời cấm.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. 'Y phục' tạo sắc thái trang trọng vừa phải; 'quần áo đắt tiền' giữ tính trực tiếp. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu 10.
