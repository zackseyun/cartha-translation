  - severity: medium
    issue: Thêm “cầu kỳ” vào “tóc tết”
    rationale: πλέγμασιν chỉ các kiểu tóc bện/tết. Dù bối cảnh có thể liên hệ đến sự phô trương, tính “cầu kỳ” không được nêu trực tiếp trong chính văn và nên để chú thích giải thích.
  - severity: low
