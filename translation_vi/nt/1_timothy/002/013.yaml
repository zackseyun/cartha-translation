  text: Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: vi
  text: Vì A-đam được tạo dựng trước[a], rồi đến Ê-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được nắn nên.” Động từ này gợi lại cách diễn đạt về việc tạo dựng trong sách Sáng Thế Ký.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giới từ liên kết này nêu lý do hoặc cơ sở cho lời chỉ dẫn ngay trước đó; “Vì” giữ được chức năng giải thích của câu Hy Lạp.
- source_word: Ἀδὰμ
  choice: A-đam
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: πρῶτος
  choice: trước
  rationale: Trong cấu trúc đối ứng với εἶτα, từ này biểu thị thứ tự thời gian; “trước” kết hợp tự nhiên với “rồi đến”.
- source_word: ἐπλάσθη
  choice: được tạo dựng
  rationale: Thể bị động của πλάσσω chỉ việc nắn tạo hay làm nên, gợi lại ngôn ngữ tạo dựng trong Sáng Thế Ký mà không dùng từ quá rộng như chỉ đơn thuần “được tạo ra”.
- source_word: εἶτα
  choice: rồi đến
  rationale: Diễn tả sự tiếp nối theo thời gian và tạo thành cặp diễn đạt tự nhiên “trước… rồi đến…” trong tiếng Việt.
- source_word: Εὕα
  choice: Ê-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mối liên hệ với thứ tự tạo dựng trong Sáng Thế Ký giữa bối cảnh tranh luận về vai trò trong hội thánh
  choice: 'Dịch như một lời khẳng định đơn giản về trình tự thời gian: A-đam được tạo dựng trước, rồi đến Ê-va.'
  alternative: Diễn giải thêm các hàm ý về thẩm quyền hoặc sự phân định vai trò.
  rationale: Bản văn Hy Lạp chỉ trực tiếp nêu thứ tự được tạo dựng, không trình bày rõ kết luận thần học ngay trong câu này. Bản dịch vì thế không đưa thêm một lập trường giáo phái hay giải quyết ngầm sự căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “trước… rồi đến…” diễn đạt rõ trình tự thời gian; chú thích giữ sắc thái cụ thể của động từ πλάσσω.
