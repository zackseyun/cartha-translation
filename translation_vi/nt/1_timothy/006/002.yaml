id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: vi
  text: Còn những người có chủ là tín hữu thì đừng khinh thường họ vì họ là anh em[a]; trái lại, càng phải phục vụ họ hơn nữa, vì những người hưởng lợi là các tín hữu yêu dấu[b]. Hãy dạy và khuyên nhủ những điều này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em”; tiếng Hy Lạp dùng từ “anh em.”
    reason: lexical_alternative
  - marker: b
    text: Mệnh đề “những người hưởng lợi” trong tiếng Hy Lạp khó hiểu. Nhiều khả năng câu này nói đến những người chủ có đức tin là những người hưởng lợi từ sự phục vụ của các nô lệ.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: là tín hữu
  rationale: Trong quan hệ với δεσπότας, từ này chỉ những người chủ tin nơi Đấng Christ, không đơn thuần là người đáng tin cậy.
- source_word: δεσπότας
  choice: chủ
  rationale: Trong bối cảnh chế độ nô lệ thuộc gia đình, từ này chỉ người có quyền sở hữu và thẩm quyền trên người phục dịch; “chủ” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: καταφρονείτωσαν
  choice: đừng khinh thường
  rationale: Diễn đạt thái độ coi thường hoặc khinh miệt, đồng thời giữ nguyên lực của mệnh lệnh cấm.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức nam số nhiều của tiếng Hy Lạp và cách gọi mang tính gia đình dành cho những người cùng đức tin.
- source_word: μᾶλλον δουλευέτωσαν
  choice: càng phải phục vụ họ tận tình hơn
  rationale: “Phục vụ” diễn đạt tự nhiên hành động làm việc trong thân phận nô lệ; “càng… hơn” bảo toàn μᾶλλον. “Tận tình” làm rõ sắc thái gia tăng mức độ phục vụ mà không lặp từ vụng về.
- source_word: πιστοί
  choice: các tín hữu
  rationale: Ở đây từ này được dùng như danh từ, chỉ những người tin nơi Đấng Christ.
- source_word: ἀγαπητοὶ
  choice: những người được yêu mến
  rationale: Giữ sắc thái trìu mến và cộng đồng của từ ngữ Cơ Đốc, đồng thời tự nhiên hơn “yêu dấu” trong cấu trúc câu này.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: những người hưởng lợi từ sự phục vụ ấy
  rationale: Cụm từ chỉ những người nhận hoặc được hưởng εὐεργεσία. Bản dịch hiểu người chủ có đức tin là bên hưởng lợi, nhưng ghi chú rằng cấu trúc Hy Lạp khó và có thể được hiểu khác.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Hãy dạy và khuyên nhủ những điều này
  rationale: Hai động từ mệnh lệnh hiện tại hướng đến Ti-mô-thê; “dạy” và “khuyên nhủ” là cách diễn đạt rõ ràng, trang trọng và tự nhiên.
theological_decisions:
- issue: Phạm vi nghĩa của ἀδελφοί trong cộng đồng đức tin
  choice: anh em
  alternative: anh chị em; người cùng đức tin
  rationale: “Anh em” bảo toàn hình thức nam số nhiều của nguyên văn và vẫn là cách gọi quen thuộc cho những người cùng đức tin; chú thích nêu khả năng dùng theo nghĩa bao gồm cả nam lẫn nữ.
- issue: Thuật ngữ địa vị xã hội trong bối cảnh nô lệ
  choice: chủ … phục vụ
  alternative: chủ … làm nô lệ cho; chủ sở hữu … phục dịch
  rationale: Câu này trực tiếp nói đến những người bị nô dịch và chủ của họ, nhưng danh từ δοῦλος không xuất hiện. “Chủ” và “phục vụ” vừa phản ánh thực trạng xã hội vừa tránh lối diễn đạt gượng ép.
- issue: Chủ thể của οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: những người chủ có đức tin là bên hưởng lợi từ sự phục vụ
  alternative: những người nô lệ có đức tin là những người tận tâm làm việc thiện; hoặc cả hai bên cùng hưởng lợi
  rationale: Theo mạch câu, cách hiểu gần nhất là những người chủ nhận lợi ích từ sự phục vụ gia tăng. Tuy nhiên, cấu trúc Hy Lạp cô đọng và gây tranh luận, nên chú thích bảo lưu độ khó thay vì trình bày cách hiểu này như điều hoàn toàn chắc chắn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tín hữu,” “anh em,” “khuyên nhủ” theo văn phong Cơ Đốc phổ thông; tránh từ cổ và không che khuất bối cảnh nô lệ của câu.
