  to: Còn những người có chủ là tín hữu thì đừng khinh thường họ vì họ là anh em[a]; trái lại, càng phải phục vụ họ hơn nữa, vì những người hưởng lợi là các tín hữu yêu dấu[b]. Hãy dạy và khuyên nhủ những điều này.
