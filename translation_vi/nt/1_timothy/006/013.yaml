reference: 1 Timothy 6:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: vi
  text: 'Trước sự hiện diện của Đức Chúa Trời, Đấng ban sự sống cho muôn vật[a], và của Đấng Mê-si-a Giê-su[b], Đấng đã làm chứng về lời tuyên xưng tốt đẹp trước Bôn-xơ Phi-lát[c], tôi truyền cho con:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng giữ cho muôn vật sống” hoặc “Đấng làm cho muôn vật sống.” Động từ Hy Lạp có thể nhấn mạnh việc duy trì sự sống hoặc làm cho sống.'
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Christ Giê-su.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.
    reason: alternative_reading
  - marker: c
    text: Cụm từ Hy Lạp cũng có thể được hiểu là “dưới thời Bôn-xơ Phi-lát” hoặc “dưới quyền Bôn-xơ Phi-lát”; trong ngữ cảnh xét xử, “trước Bôn-xơ Phi-lát” là một cách hiểu phù hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: tôi truyền lệnh cho con
  rationale: Động từ diễn tả một mệnh lệnh trang trọng; đại từ số ít được dịch là “con” để phù hợp quan hệ giữa Phao-lô và Ti-mô-thê trong thư, mà vẫn giữ sắc thái trực tiếp.
- source_word: ἐνώπιον
  choice: trước mặt
  rationale: Cách nói tự nhiên, trang trọng, biểu thị hành động diễn ra trong sự hiện diện và dưới sự chứng giám của Đức Chúa Trời cùng Đấng Messiah Jesus.
- source_word: τοῦ θεοῦ
  choice: Đức Chúa Trời
  rationale: Danh xưng quen thuộc, trang trọng trong tiếng Việt Cơ Đốc, tương ứng trực tiếp với θεός trong ngữ cảnh này.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: Đấng ban sự sống cho muôn vật
  rationale: ζῳογονέω có thể chỉ việc ban sự sống, làm cho sống hoặc duy trì sự sống. Bản dịch chính giữ nghĩa rộng và tự nhiên; các sắc thái khác được nêu trong chú thích.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Messiah Jesus
  rationale: Giữ Χριστός như một tước hiệu có nghĩa là Messiah; thêm “Đấng” giúp cụm từ vận hành tự nhiên và trang trọng trong tiếng Việt.
- source_word: μαρτυρήσαντος
  choice: Đấng đã làm chứng
  rationale: Giữ sắc thái công khai và pháp lý của lời chứng trong bối cảnh Jesus đứng trước nhà cầm quyền.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: trước Pontius Pilate
  rationale: Trong mạch văn về việc làm chứng, cụm từ hợp lý nhất là chỉ sự hiện diện trước Pontius Pilate; tuy vậy, giới từ ἐπί với sở hữu cách cũng có thể mang sắc thái “dưới thời” hoặc “dưới quyền”.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: cho lời tuyên xưng tốt đẹp
  rationale: ὁμολογία là lời tuyên xưng hoặc sự công nhận công khai. “Lời tuyên xưng tốt đẹp” vừa tự nhiên vừa giữ liên hệ với lời tuyên xưng của Ti-mô-thê trong ngữ cảnh gần.
theological_decisions:
- issue: Ý nghĩa của ζῳογονοῦντος
  choice: Đấng ban sự sống cho muôn vật
  alternative: Đấng giữ cho muôn vật sống; Đấng làm cho muôn vật sống
  rationale: Từ Hy Lạp có thể nhấn mạnh việc ban sự sống hoặc bảo tồn sự sống. Bản chính không thu hẹp quyền năng của Đức Chúa Trời vào riêng một sắc thái, và chú thích bảo lưu các khả năng.
- issue: Cách dịch Χριστός
  choice: Đấng Messiah Jesus
  alternative: Đấng Christ Jesus
  rationale: Trong lời truyền lệnh trang trọng và mang tính tuyên xưng này, Χριστός vẫn có lực của một tước hiệu. “Messiah” làm rõ nội dung tước hiệu mà không áp đặt một cách hiểu giáo phái.
- issue: Quan hệ giữa μαρτυρήσαντος và τὴν καλὴν ὁμολογίαν
  choice: đã làm chứng cho lời tuyên xưng tốt đẹp
  alternative: đã tuyên xưng lời tuyên xưng tốt đẹp; đã làm chứng lời tuyên xưng tốt đẹp
  rationale: Ngữ pháp Hy Lạp đặt “lời tuyên xưng” làm tân ngữ trực tiếp, nhưng tiếng Việt tự nhiên hơn với “làm chứng cho”. Cách dịch này bảo tồn sự phân biệt giữa hành động làm chứng và nội dung/lời tuyên xưng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc lời truyền lệnh long trọng của nguyên văn, đưa mệnh đề chính về cuối để bảo tồn sức nặng tu từ. Dùng “con” cho đại từ số ít vì đây là lời Phao-lô trực tiếp nói với Ti-mô-thê; dùng “muôn vật” để diễn đạt tự nhiên tính bao quát của τὰ πάντα.
