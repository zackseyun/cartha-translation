  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: lời truyền lệnh được đặt trước Đức Chúa Trời và Đấng Christ Jesus, Đức Chúa Trời là Đấng ban sự sống cho mọi sự, và Jesus đã làm chứng liên hệ với lời tuyên xưng tốt đẹp. Tuy nhiên, các tên/tước hiệu đang để nguyên dạng tiếng Anh-Latin (“Messiah Jesus,” “Pontius Pilate”) không phù hợp với bản tiếng Việt chuẩn hiện đại. Cách dùng “làm chứng cho lời tuyên xưng” cũng kém tự nhiên hơn “làm chứng về lời tuyên xưng.” Chú thích về ἐπί πρέπει bảo lưu khả năng “dưới thời/dưới quyền” mà không khẳng định quá mức cách hiểu “trước”.'
