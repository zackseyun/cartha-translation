id: 1TI.6.19
reference: 1 Timothy 6:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: vi
  text: tích trữ cho chính mình một nền tảng tốt đẹp cho tương lai, để họ nắm lấy sự sống đích thực.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: tích trữ
  rationale: Phân từ hiện tại tiếp nối lời khuyên ở câu trước; “tích trữ” giữ được hình ảnh gom góp kho báu và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἑαυτοῖς
  choice: cho chính mình
  rationale: Đại từ phản thân ở tặng cách diễn tả lợi ích dành cho chủ thể; “cho chính mình” thể hiện rõ sắc thái này.
- source_word: θεμέλιον καλὸν
  choice: một nền tảng tốt đẹp
  rationale: Giữ nguyên ẩn dụ xây dựng của θεμέλιον; “tốt đẹp” diễn đạt καλόν theo nghĩa tốt, đáng quý và vững vàng mà không giải thích quá mức.
- source_word: εἰς τὸ μέλλον
  choice: cho tương lai
  rationale: Diễn đạt tự nhiên điều sắp đến, đồng thời để ngỏ âm hưởng cánh chung thay vì cụ thể hóa thành “thời đại sắp đến”.
- source_word: ἵνα
  choice: để
  rationale: Liên từ chỉ mục đích được chuyển sang cấu trúc tiếng Việt ngắn gọn, tự nhiên.
- source_word: ἐπιλάβωνται
  choice: họ nắm lấy
  rationale: Giữ hình ảnh chủ động nắm giữ của động từ trung thái ἐπιλαμβάνομαι và phù hợp với lời khuyên trong văn cảnh.
- source_word: τῆς ὄντως ζωῆς
  choice: sự sống đích thực
  rationale: ὄντως mang nghĩa “thật sự, đích thực”; cách dịch này giữ danh từ ζωή và sự tương phản về phẩm chất, đồng thời tự nhiên hơn cách lặp “sự sống thật sự là sự sống” trong tiếng Việt.
theological_decisions:
- issue: Có nên dịch εἰς τὸ μέλλον theo nghĩa cánh chung cụ thể hay không
  choice: cho tương lai
  alternative: cho thời đại sắp đến
  rationale: Văn cảnh có âm hưởng cánh chung, nhưng chính cụm từ Hy Lạp chỉ nói rộng về điều ở phía trước; bản dịch không thêm khái niệm “thời đại” vốn không được nêu rõ.
- issue: Cách thể hiện τῆς ὄντως ζωῆς
  choice: sự sống đích thực
  alternative: sự sống thật sự là sự sống
  rationale: Lựa chọn chính giữ nguyên danh từ “sự sống” và nhấn mạnh tính chân thật của sự sống ấy, nhưng tránh lối diễn đạt lặp và thiếu tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu này là phần tiếp nối cú pháp của câu trước nên bắt đầu bằng động từ ở dạng phụ thuộc, không viết hoa như một câu độc lập. Không thêm thuật ngữ giáo phái hay giải nghĩa cánh chung vượt quá nguyên văn.
