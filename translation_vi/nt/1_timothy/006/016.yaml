  to: Đấng duy nhất có sự bất tử[a], ngự trong ánh sáng không thể đến gần, là Đấng không một ai trong loài người đã từng thấy và cũng không thể thấy được. Nguyện sự tôn kính và quyền thống trị đời đời thuộc về Ngài.[b] A-men.
  rationale: Chỉ sửa cách diễn đạt phủ định về việc thấy để loại bỏ hàm ý thời gian không có trong nguyên ngữ, và điều chỉnh chú thích a để không thêm sắc thái “vốn.” Các yếu tố khác được giữ vì sát nguồn, tự nhiên, và bảo toàn tính mơ hồ quy chiếu của văn cảnh.
