id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: vi
  text: Đấng duy nhất có sự bất tử[a], ngự trong ánh sáng không thể đến gần, là Đấng không một ai trong loài người đã từng thấy và cũng không thể thấy được. Nguyện sự tôn kính và quyền thống trị đời đời thuộc về Ngài.[b] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chỉ một mình Ngài có sự bất tử.”'
    reason: lexical_alternative
  - marker: b
    text: Một số người hiểu phần mô tả và lời tôn vinh này là trực tiếp chỉ về Chúa Giê-su, Đấng Mê-si-a, trong văn cảnh rộng hơn; tuy nhiên, lời nói về Đấng không ai từng thấy hay có thể thấy tự nhiên nhất chỉ về Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: duy nhất
  rationale: Diễn đạt tính độc nhất của Đấng sở hữu điều được nói tiếp theo, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔχων ἀθανασίαν
  choice: có sự bất tử
  rationale: Giữ sát cấu trúc phân từ và khẳng định rằng sự bất tử thuộc về chính Ngài; chú thích nêu một cách diễn đạt tự nhiên khác.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: ngự trong ánh sáng không thể đến gần
  rationale: “Ngự” phù hợp với văn cảnh tôn nghiêm; “không thể đến gần” giữ đúng ý của ἀπρόσιτον hơn là chỉ nói ánh sáng không thể tiếp cận theo nghĩa trừu tượng.
- source_word: οὐδεὶς ἀνθρώπων
  choice: chưa một ai trong loài người
  rationale: Thể hiện cấu trúc sở thuộc phân bộ và phạm vi bao quát toàn thể nhân loại bằng lối nói tự nhiên, không thu hẹp vào nam giới.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: và cũng không thể thấy được
  rationale: Giữ rõ yếu tố bất khả năng trong δύναται và liên kết với mệnh đề phủ định trước đó.
- source_word: τιμὴ
  choice: sự tôn kính
  rationale: Cách dịch trang trọng, tự nhiên trong lời tôn vinh; “nguyện ... thuộc về” bổ sung động từ vốn được tỉnh lược trong tiếng Hy Lạp.
- source_word: κράτος αἰώνιον
  choice: quyền thống trị đời đời
  rationale: Trong công thức tôn vinh, κράτος chỉ quyền năng được thể hiện trong sự cai trị; “quyền thống trị” giữ sắc thái ấy rõ hơn “sức mạnh” đơn thuần.
- source_word: ἀμήν
  choice: A-men
  rationale: Dùng hình thức phiên âm quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của các mệnh đề quan hệ và lời tôn vinh
  choice: Bản dịch dùng đại từ “Ngài” mà không chèn danh xưng, để mạch văn chủ yếu chỉ về Đức Chúa Trời nhưng không xóa đi độ căng về cú pháp trong văn cảnh rộng hơn.
  alternative: Hiểu phần mô tả và lời tôn vinh này là trực tiếp chỉ về Chúa Giê-su, Đấng Mê-si-a.
  rationale: Ngôn ngữ về Đấng không ai từng thấy hay có thể thấy tự nhiên nhất chỉ về Đức Chúa Trời; tuy nhiên, vì văn cảnh trước có nói đến sự hiện ra của Chúa Giê-su, chú thích ghi nhận cách liên kết khác thay vì buộc câu dịch phải giải quyết dứt khoát.
- issue: Phạm vi của ἀνθρώπων
  choice: “trong loài người”
  alternative: “trong số những người nam” hoặc “giữa nhân loại”
  rationale: Ở đây ἄνθρωπος mang nghĩa đại diện cho con người nói chung. “Loài người” vừa chính xác về phạm vi vừa trang trọng, dễ hiểu trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ngự” và cấu trúc cầu chúc “Nguyện ... thuộc về Ngài” để giữ sắc thái tôn vinh, nhưng tránh từ cổ hoặc thuật ngữ hệ phái. Dấu [a] và [b] đều xuất hiện đúng trong chính văn.
