reference: 1 Timothy 6:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: vi
  text: mà Đấng phước hạnh và Chủ Tể duy nhất—Vua của những người trị vì và Chúa của những người cầm quyền[a]—sẽ bày tỏ vào những thời điểm riêng của Ngài,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách dịch truyền thống: “Vua của các vua và Chúa của các chúa.” Tiếng Hy Lạp dùng các phân từ, theo sát chữ là “Vua của những người trị vì và Chúa của những người cầm quyền.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: mà
  rationale: Đại từ quan hệ giống cái số ít quy chiếu về ἐπιφάνειαν (“sự hiện ra”) ở câu 14; “mà” nối tự nhiên với tiền ngữ này mà không biến đối tượng thành một ngôi vị.
- source_word: καιροῖς ἰδίοις
  choice: đến những thời điểm do chính mình ấn định
  rationale: Giữ số nhiều của καιροῖς và diễn đạt ý những thời điểm thuộc quyền định liệu của chủ thể; cách nói này tự nhiên hơn lối dịch sát chữ “trong những thời điểm riêng của Ngài”.
- source_word: δείξει
  choice: sẽ bày tỏ
  rationale: Động từ tương lai của δείκνυμι mang nghĩa làm cho được thấy công khai; “bày tỏ” phù hợp với sự hiện ra và giữ sắc thái biểu lộ.
- source_word: ὁ μακάριος
  choice: Đấng phước hạnh
  rationale: Tính từ được dùng như danh xưng thần thượng; “phước hạnh” trang trọng và có nội hàm rộng hơn “hạnh phúc”.
- source_word: μόνος δυνάστης
  choice: Đấng Chủ Tể duy nhất
  rationale: δυνάστης chỉ đấng nắm quyền cai trị; “Chủ Tể” truyền đạt quyền tối thượng bằng tiếng Việt hiện đại, trang trọng.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: Vua của những người trị vì
  rationale: Giữ lực động từ của phân từ βασιλευόντων thay vì đồng nhất trực tiếp với danh từ “các vua”.
- source_word: κύριος τῶν κυριευόντων
  choice: Chúa của những người cầm quyền
  rationale: “Chúa” giữ danh hiệu κύριος, còn “những người cầm quyền” thể hiện lực động từ của κυριευόντων bằng cách nói tự nhiên.
theological_decisions:
- issue: Chủ thể sẽ bày tỏ sự hiện ra
  choice: Không thêm danh riêng; để các danh hiệu trong chính câu xác định chủ thể.
  alternative: Nói rõ là Đức Chúa Trời hoặc Đức Chúa Cha sẽ bày tỏ sự hiện ra của Đức Chúa Jêsus Christ.
  rationale: Bản Hy Lạp tại đây giới thiệu chủ thể qua các danh hiệu cao trọng chứ không dùng danh riêng. Bản dịch không giải quyết thay văn bản một vấn đề được làm rõ hơn bởi văn cảnh.
- issue: Công thức “Vua của các vua và Chúa của các chúa”
  choice: 'Dịch theo dạng phân từ: “Vua của những người trị vì và Chúa của những người cầm quyền.”'
  alternative: “Vua của các vua và Chúa của các chúa.”
  rationale: Cách chọn giữ phân biệt hình thái của βασιλευόντων và κυριευόντων, đồng thời chú thích lối dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa các danh hiệu thần thượng theo quy ước tiếng Việt. Dấu gạch ngang làm nổi bật chuỗi danh hiệu của chủ thể; dấu phẩy cuối câu phản ánh đây là phần tiếp nối của một câu dài hơn.
