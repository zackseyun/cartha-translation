  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng các yếu tố từ vựng chính: đại từ quan hệ quy chiếu về “sự hiện ra” ở câu trước, thời điểm số nhiều, động từ tương lai “sẽ bày tỏ”, và chuỗi danh hiệu với các phân từ “những người trị vì/cầm quyền”. Tuy nhiên, dấu gạch ngang hiện đặt sau “sẽ bày tỏ” khiến chuỗi “Vua … và Chúa …” có thể bị đọc như phần được bày tỏ, thay vì là các danh hiệu đồng vị của chủ thể—trái với cú pháp Hy Lạp.'
  naturalness: Cần đưa toàn bộ chuỗi danh hiệu vào cùng cụm chủ ngữ. Cấu trúc dùng hai dấu gạch ngang trong bản sửa vừa rõ quan hệ đồng vị, vừa giữ văn phong hiện đại và trang trọng. “Những thời điểm riêng của Ngài” giữ số nhiều và ý sở thuộc của vàm καιροῖς ἰδίοις, không diễn giải quá mức thành hành động ấn định.
  terminology: Giữ “Đấng phước hạnh”, “Chủ Tể”, “Vua”, và “Chúa” như các danh hiệu trang trọng. “Vua của những người trị vì và Chúa của những người cầm quyền” bảo toàn lực phân từ của βασιλευόντων và κυριευόντων; chú thích vẫn cung cấp công thức truyền thống.
