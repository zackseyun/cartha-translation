id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: vi
  text: Hãy truyền bảo những người giàu có trong thời đại hiện tại[a] đừng kiêu ngạo, cũng đừng đặt hy vọng nơi sự bấp bênh của của cải[b], nhưng nơi Đức Chúa Trời, Đấng ban cho chúng ta mọi sự cách dồi dào để vui hưởng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong thế gian hiện tại.” Từ Hy Lạp có thể chỉ một thời đại hoặc, theo nghĩa mở rộng, trật tự thế gian hiện nay; “thời đại” giữ rõ hơn sắc thái thời gian trong câu.
    reason: lexical_alternative
  - marker: b
    text: Hay “nơi của cải không chắc chắn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι
  choice: những người giàu có trong đời hiện tại
  rationale: Cụm danh từ chỉ những người giàu; αἰών mang sắc thái thời đại hoặc đời hiện tại, giữ được chiều kích thời gian trong lập luận của Phao-lô.
- source_word: παράγγελλε
  choice: Hãy truyền bảo
  rationale: Động từ mệnh lệnh mang thẩm quyền; “truyền bảo” rõ nghĩa nhưng tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: đừng kiêu ngạo
  rationale: Diễn đạt trực tiếp thái độ tự cao mà động từ Hy Lạp chỉ đến.
- source_word: μηδὲ ἠλπικέναι
  choice: cũng đừng đặt hy vọng
  rationale: Thể hoàn thành của động từ gợi một sự đặt lòng trông cậy đã xác lập; “đặt hy vọng” chuyển tải điều này tự nhiên.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: nơi sự bấp bênh của của cải
  rationale: ἀδηλότης nhấn mạnh tính không chắc chắn, không đáng tin cậy của sự giàu có; cách dịch giữ cấu trúc danh từ của nguyên văn.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: nhưng nơi Đức Chúa Trời
  rationale: Giữ sự đối lập song song giữa đối tượng sai và đúng của hy vọng.
- source_word: τῷ παρέχοντι ἡμῖν πάντα πλουσίως
  choice: Đấng ban cho chúng ta mọi sự cách dồi dào
  rationale: “Ban” phù hợp với hành động cung cấp của Đức Chúa Trời; “mọi sự” không thu hẹp phạm vi πάντα, còn “dồi dào” chuyển tải πλουσίως tự nhiên.
- source_word: εἰς ἀπόλαυσιν
  choice: để hưởng dùng
  rationale: Diễn đạt mục đích của sự ban cho; “hưởng dùng” vừa bao hàm sự vui hưởng vừa tránh sắc thái chỉ hưởng thụ.
theological_decisions:
- issue: Ý nghĩa của αἰών trong bối cảnh đạo đức và cánh chung
  choice: đời hiện tại
  alternative: thế gian hiện tại; thời đại hiện tại
  rationale: “Đời hiện tại” giữ nét thời gian và sự tương phản hàm ẩn với đời sắp đến, thay vì khiến người đọc chỉ nghĩ đến thế giới vật chất.
- issue: Phạm vi sự chu cấp của Đức Chúa Trời trong πάντα
  choice: mọi sự
  alternative: mọi điều cần thiết
  rationale: Nguyên văn dùng từ bao quát và không giới hạn vào nhu yếu phẩm; bản dịch giữ nguyên độ rộng nhưng không thêm ý bảo đảm thịnh vượng.
- issue: Mục đích của sự ban cho trong εἰς ἀπόλαυσιν
  choice: để hưởng dùng
  alternative: để vui hưởng
  rationale: Giữ lời khẳng định tích cực rằng các ân ban của Đức Chúa Trời được ban để con người hưởng, nhưng không biến câu này thành lời cổ súy hưởng lạc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi quen thuộc trong văn bản Cơ Đốc tiếng Việt; giữ mệnh lệnh có thẩm quyền và cấu trúc đối lập của nguyên văn.
