revisions:
- from: Tất cả những ai là nô lệ dưới ách phải coi chủ mình là người đáng được hoàn toàn tôn trọng, để danh Đức Chúa Trời và lời dạy không bị xúc phạm.[a][b][c]
  to: Tất cả những người là nô lệ[a] dưới ách phải coi chủ của mình là người xứng đáng nhận mọi sự tôn trọng, để danh Đức Chúa Trời và lời dạy[b] không bị phỉ báng[c].
  rationale: Sửa “hoàn toàn tôn trọng” thành “xứng đáng nhận mọi sự tôn trọng” để phản ánh chính xác và tự nhiên hơn πάσης τιμῆς ἀξίους. Sửa “bị xúc phạm” thành “bị phỉ báng” để giữ lực nghĩa của βλασφημῆται. Nội dung và hình ảnh “nô lệ dưới ách” được giữ nguyên; không có hàm ý tán thành chế độ nô lệ. Các chú thích được đặt lại tại các từ/cụm từ mà chúng giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của nguyên văn: δοῦλοι là “nô lệ”, ὑπὸ ζυγόν là “dưới ách”, τοὺς ἰδίους δεσπότας là “chủ của mình”, và mệnh đề mục đích được diễn đạt đúng. Tuy nhiên, “bị xúc phạm” giảm nhẹ βλασφημῆται, vốn chỉ sự phỉ báng/nói phạm có tính xúc phạm nghiêm trọng đối với danh Đức Chúa Trời và lời dạy.'
  naturalness: “Đáng được hoàn toàn tôn trọng” chưa tự nhiên trong tiếng Việt hiện đại và không diễn đạt sát ý “worthy of all honor”. “Xứng đáng nhận mọi sự tôn trọng” vừa tự nhiên vừa sát nghĩa hơn. Đặt các ký hiệu chú thích ngay sau từ/cụm từ liên quan làm rõ neo chú thích.
  terminology: “Nô lệ”, “dưới ách”, “chủ của mình”, “danh Đức Chúa Trời”, và “lời dạy” đều phù hợp ngữ cảnh và không áp đặt cách hiểu hệ phái. “Phỉ báng” là thuật ngữ thích hợp hơn “xúc phạm” cho βλασφημῆται khi áp dụng đồng thời cho danh Đức Chúa Trời và lời dạy.
  issues:
