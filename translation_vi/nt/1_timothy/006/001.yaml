    issue: “bị xúc phạm” dịch chưa đủ mạnh βλασφημῆται.
    rationale: βλασφημῆται nói đến việc phỉ báng, lăng mạ, hoặc nói phạm; “xúc phạm” có thể chỉ hành vi gây tổn thương hay thất lễ và làm yếu lực của nguyên văn.
  - severity: low
    issue: “đáng được hoàn toàn tôn trọng” không tự nhiên và chưa sát cấu trúc πάσης τιμῆς ἀξίους.
    rationale: Cụm Hy Lạp có nghĩa là “xứng đáng nhận mọi sự tôn trọng/kính trọng”; “hoàn toàn tôn trọng” dễ gợi mức độ hoàn tất hơn là tính bao quát của πάσης.
  - severity: low
    issue: Các dấu chú thích hiện được gom cuối câu thay vì gắn với đơn vị từ vựng liên quan.
    rationale: Gắn [a] với “nô lệ”, [b] với “lời dạy”, và [c] với “phỉ báng” giúp người đọc xác định rõ phạm vi mỗi chú thích.
