id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: vi
  text: Tất cả những người là nô lệ[a] dưới ách phải coi chủ của mình là người xứng đáng nhận mọi sự tôn trọng, để danh Đức Chúa Trời và lời dạy[b] không bị phỉ báng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đầy tớ” hoặc “tôi tớ”; tiếng Hy Lạp là δοῦλοι. Ở đây dùng “nô lệ” vì cụm “dưới ách” cho thấy rõ tình trạng nô thuộc.
    reason: alternative_reading
  - marker: b
    text: Hay “giáo lý”.
    reason: lexical_alternative
  - marker: c
    text: Hay “bị nói phạm thượng” hoặc “bị nói phạm một cách xúc phạm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: nô lệ
  rationale: Cụm “dưới ách” làm nổi bật tình trạng bị lệ thuộc; “nô lệ” phản ánh thẳng thắn thực tại xã hội trong nguyên văn hơn “đầy tớ”.
- source_word: ὑπὸ ζυγὸν
  choice: dưới ách
  rationale: Giữ nguyên hình ảnh ẩn dụ về sự lệ thuộc và là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τοὺς ἰδίους δεσπότας
  choice: chủ mình
  rationale: “Chủ” phù hợp với quan hệ chủ–nô trong ngữ cảnh; “mình” chuyển tải sắc thái sở hữu của ἰδίους một cách tự nhiên.
- source_word: πάσης τιμῆς ἀξίους
  choice: đáng được hoàn toàn tôn trọng
  rationale: Diễn đạt tự nhiên ý nghĩa đáng nhận sự kính trọng đầy đủ, không nhất thiết hàm ý mọi hình thức vinh danh.
- source_word: ἡγείσθωσαν
  choice: phải coi
  rationale: Chuyển tải lực mệnh lệnh và thái độ đánh giá liên tục của động từ.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: danh Đức Chúa Trời
  rationale: Giữ thành ngữ Kinh Thánh về danh, tức uy danh và căn tính được bày tỏ của Đức Chúa Trời.
- source_word: ἡ διδασκαλία
  choice: lời dạy
  rationale: Dễ hiểu trong tiếng Việt hiện đại và không áp đặt sắc thái kỹ thuật của “giáo lý” lên từ ngữ Hy Lạp.
- source_word: βλασφημῆται
  choice: bị xúc phạm
  rationale: Có thể dùng tự nhiên cho cả “danh Đức Chúa Trời” lẫn “lời dạy”, đồng thời giữ ý bị nói phạm hoặc phỉ báng.
theological_decisions:
- issue: Cách dịch δοῦλοι trong bối cảnh nhạy cảm về chế độ nô lệ
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Nguyên văn mô tả những người ở trong tình trạng nô thuộc, được nhấn mạnh bởi “dưới ách”. Cách dịch này phản ánh thực tại được văn bản nói đến chứ không hàm ý tán thành chế độ nô lệ.
- issue: Cách dịch διδασκαλία
  choice: lời dạy
  alternative: giáo lý
  rationale: “Lời dạy” giữ nghĩa rộng và dễ hiểu, tránh làm từ này mang tính thuật ngữ thần học nhiều hơn nguyên văn đòi hỏi.
- issue: Cách dịch βλασφημῆται với hai chủ thể phối hợp
  choice: bị xúc phạm
  alternative: bị phỉ báng; bị nói phạm thượng
  rationale: “Bị xúc phạm” áp dụng tự nhiên cho cả danh Đức Chúa Trời và lời dạy; “phạm thượng” phù hợp hơn với Đức Chúa Trời nhưng kém tự nhiên đối với lời dạy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh “dưới ách”, dùng “nô lệ” để phản ánh rõ địa vị xã hội trong nguyên văn, và tránh từ ngữ mang sắc thái hệ phái.
