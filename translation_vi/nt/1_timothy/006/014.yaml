id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: vi
  text: hãy giữ điều răn không hoen ố, không thể chê trách, cho đến khi Chúa chúng ta là Đức Giê-su, Đấng Mê-si, hiện ra.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đức Giê-su Ki-tô.” Tước hiệu Hy Lạp Χριστός có thể được dịch theo nghĩa là “Đấng Mê-si” hoặc dùng dạng truyền thống mang tính tên gọi hơn là “Ki-tô.”
    reason: alternative_reading
  - marker: b
    text: Hai cụm “không hoen ố” và “không thể chê trách” có thể mô tả chính “điều răn” hoặc cách Ti-mô-thê giữ điều răn; lời Hy Lạp diễn đạt cô đọng nên không xác định hoàn toàn mối quan hệ này.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: hãy giữ
  rationale: Động từ nguyên mẫu phụ thuộc vào lời truyền bảo ở câu trước; “giữ” diễn đạt tự nhiên việc trung thành tuân theo mà không thu hẹp nghĩa thành chỉ quan sát hay bảo vệ.
- source_word: τὴν ἐντολήν
  choice: điều răn
  rationale: Danh từ số ít xác định mang trọng lượng đạo đức và có thể chỉ lời truyền bảo vừa được nêu; “điều răn” trang trọng nhưng vẫn quen thuộc trong tiếng Việt hiện đại.
- source_word: ἄσπιλον
  choice: không hoen ố
  rationale: Diễn đạt ý không có vết nhơ hay tì ố; cách đặt liền sau “điều răn” giữ được cấu trúc cô đọng của tiếng Hy Lạp.
- source_word: ἀνεπίλημπτον
  choice: không chỗ trách được
  rationale: Chỉ tình trạng không có căn cứ chính đáng để bị khiển trách; cách nói này tự nhiên và phù hợp với cách dùng trong các thư mục vụ.
- source_word: μέχρι τῆς ἐπιφανείας
  choice: cho đến khi ... hiện ra
  rationale: Chuyển danh từ sự kiện sang mệnh đề tiếng Việt tự nhiên, vẫn giữ ý về sự xuất hiện công khai trong tương lai và không thêm ý “lần thứ hai” vốn không được nói rõ.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Chúa chúng ta
  rationale: Giữ κύριος như một tước hiệu quy về Đức Giê-su và phản ánh đại từ sở hữu số nhiều.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: “Đấng Mê-si” làm rõ giá trị tước hiệu của Χριστός trong ngữ cảnh cánh chung; “Đức Giê-su” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Quan hệ của hai tính từ ἄσπιλον và ἀνεπίλημπτον
  choice: Đặt sau “điều răn” mà không thêm chủ thể hay động từ phụ
  alternative: Diễn giải rằng chính Ti-mô-thê phải giữ mình không hoen ố và không chỗ trách được
  rationale: Cú pháp Hy Lạp cô đọng và có thể được hiểu là các tính từ mô tả điều răn hoặc cách Ti-mô-thê giữ điều răn. Bản chính không thêm từ để quyết định dứt khoát quan hệ này; chú thích nêu rõ khả năng còn lại.
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Ngữ cảnh nói về sự hiện ra long trọng khiến sắc thái tước hiệu vẫn rõ; “Đấng Mê-si” chuyển tải nghĩa của Χριστός thay vì chỉ phiên âm dạng truyền thống.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “hãy giữ” để nối tự nhiên với lời truyền bảo ở câu trước; tránh thêm “lại” vào việc hiện ra vì nguyên văn không nói rõ. Các dấu chú thích [a], [b] được đặt sau toàn câu để không làm gián đoạn cụm danh xưng.
