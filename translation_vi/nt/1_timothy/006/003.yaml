id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: vi
  text: Nếu ai dạy giáo lý khác và không thuận theo những lời dạy lành mạnh[a] của Chúa chúng ta, Đức Chúa Giê-su, Đấng Mê-si-a, cũng như sự dạy dỗ phù hợp với lòng tin kính,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những lời lành mạnh.”'
    reason: «Lời dạy lành mạnh» diễn đạt tự nhiên ὑγιαίνουσι λόγοις trong tiếng Việt; phương án sát chữ được ghi để bảo toàn sắc thái của λόγοις là “lời”.
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: dạy giáo lý khác
  rationale: Diễn đạt nội dung giảng dạy khác với giáo huấn được thừa nhận, nhưng không thêm từ “sai lạc,” vốn không được nói minh nhiên trong động từ.
- source_word: προσέρχεται
  choice: thuận theo
  rationale: Trong ngữ cảnh với bổ ngữ gián tiếp, động từ mang nghĩa chấp nhận, gắn bó hoặc làm theo giáo huấn; “thuận theo” tự nhiên và áp dụng được cho cả hai đối tượng song song.
- source_word: ὑγιαίνουσι λόγοις
  choice: những lời lành mạnh
  rationale: Giữ hình ảnh sức khỏe của ὑγιαίνω và nghĩa cụ thể “lời” của λόγοις; trong tiếng Việt, “lành mạnh” vừa dễ hiểu vừa diễn tả tính đúng đắn, bổ ích.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: những lời của Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si
  rationale: Lặp lại “những lời” để quan hệ sở hữu rõ ràng trong tiếng Việt; kết cấu đồng vị làm rõ Jêsus chính là Chúa chúng ta, còn Χριστός được chuyển nghĩa như một tước hiệu.
- source_word: κατ’ εὐσέβειαν
  choice: phù hợp với lòng tin kính
  rationale: Giữ ý tương hợp của κατά mà không quyết định quá mức rằng giáo huấn chỉ tạo ra hay bắt nguồn từ lòng tin kính.
- source_word: διδασκαλίᾳ
  choice: sự dạy dỗ
  rationale: Bao quát cả hoạt động dạy và nội dung được dạy, đồng thời tự nhiên trong văn cảnh tiếng Việt.
- source_word: εὐσέβειαν
  choice: lòng tin kính
  rationale: Diễn tả thái độ và đời sống tôn kính, hướng về Đức Chúa Trời; quen thuộc hơn “đạo hạnh” và ít cổ hơn “mộ đạo”.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong danh xưng Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn có giá trị tước hiệu trong danh xưng đầy đủ, nên chuyển nghĩa là “Đấng Mê-si”; cách truyền thống “Đấng Christ” được ghi nhận như phương án khác.
- issue: Quan hệ của κατ’ εὐσέβειαν với διδασκαλίᾳ
  choice: sự dạy dỗ phù hợp với lòng tin kính
  alternative: sự dạy dỗ dẫn đến lòng tin kính
  rationale: κατά trước hết biểu thị sự phù hợp hoặc tương ứng; bản dịch tránh thêm quan hệ nhân quả không được câu Hy Lạp xác định rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “giáo lý khác” thay vì “tà giáo” để không thêm sự phán định ngoài từ Hy Lạp; dùng “lòng tin kính” theo cách nói quen thuộc trong văn chương Cơ Đốc tiếng Việt. Câu giữ dấu phẩy cuối vì đây là mệnh đề điều kiện tiếp nối sang câu 6:4.
