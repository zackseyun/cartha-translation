revisions:
- from: Nếu ai dạy giáo lý khác và không thuận theo những lời lành mạnh[a]—những lời của Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si—cũng không thuận theo sự dạy dỗ phù hợp với lòng tin kính,
  to: Nếu ai dạy giáo lý khác và không thuận theo những lời dạy lành mạnh[a] của Chúa chúng ta, Đức Chúa Giê-su, Đấng Mê-si-a, cũng như sự dạy dỗ phù hợp với lòng tin kính,
  rationale: Sửa danh xưng để phản ánh trực tiếp quan hệ sở hữu trong tiếng Hy Lạp và dùng chính tả tiếng Việt hiện đại. Điều chỉnh cú pháp để một phủ định chi phối hai cụm song song. «Lời dạy lành mạnh» tăng tính tự nhiên mà vẫn giữ ý nghĩa và hình ảnh ẩn dụ về sự lành mạnh; phương án sát chữ được bảo lưu trong chú thích.
