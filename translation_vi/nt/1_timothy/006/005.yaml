- from: những cuộc cãi vã không ngừng giữa những người có tâm trí bại hoại và đã bị tước mất chân lý, cho rằng lòng tin kính là phương tiện để trục lợi.[a]
  to: những cuộc cãi vã không ngừng giữa những người có tâm trí bại hoại và đã bị tước đoạt chân lý, cho rằng lòng tin kính là phương tiện để kiếm lợi.[a]
  rationale: Bản sửa giữ cách dịch tự nhiên của διαπαρατριβαί và εὐσέβεια, đồng thời loại bỏ sắc thái “bất chính” không được nêu trực tiếp trong πορισμός. Chú thích được điều chỉnh tương ứng để không giới hạn lợi lộc thành lợi vật chất khi bản thân câu không nói rõ điều đó.
  reviewer_model: gpt-5.6-terra
