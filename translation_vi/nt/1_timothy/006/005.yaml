  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: vi
  text: những cuộc cãi vã không ngừng giữa những người có tâm trí bại hoại và đã bị tước đoạt chân lý, cho rằng lòng tin kính là phương tiện để kiếm lợi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho rằng lòng tin kính là lợi lộc” hoặc “là nguồn lợi.” Ý nói họ xem sự tận tụy với Đức Chúa Trời như một cách để kiếm lợi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: những cuộc cãi vã không ngừng
  rationale: Danh từ số nhiều chỉ sự cọ xát dai dẳng, theo nghĩa bóng là những tranh chấp hoặc xung đột liên miên. Cách dịch này tự nhiên trong tiếng Việt và giữ được ý kéo dài.
- source_word: διεφθαρμένων ... τὸν νοῦν
  choice: có tâm trí bại hoại
  rationale: Phân từ hoàn thành thụ động diễn tả tình trạng đã bị làm hư hoại với kết quả còn kéo dài; “tâm trí bại hoại” giữ cả chiều kích nhận thức lẫn đạo đức mà không cường điệu thành một thuật ngữ tín lý.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: đã bị tước mất chân lý
  rationale: Phân từ hoàn thành thụ động nhấn mạnh sự mất mát đã xảy ra và tình trạng thiếu vắng hiện tại. “Bị tước mất” thể hiện rõ sắc thái thụ động của động từ.
- source_word: νομιζόντων
  choice: cho rằng
  rationale: Cụm từ giới thiệu nhận định sai lầm của những người này. “Cho rằng” tự nhiên, rõ ràng và không thêm sắc thái tâm lý ngoài văn bản.
- source_word: πορισμὸν
  choice: phương tiện để trục lợi
  rationale: Danh từ có thể chỉ lợi lộc hoặc phương cách kiếm lợi. Trong ngữ cảnh, họ công cụ hóa lòng tin kính để thu lợi; “trục lợi” diễn đạt rõ sắc thái vụ lợi bất chính, còn chú thích bảo lưu cách dịch sát hơn.
- source_word: εὐσέβειαν
  choice: lòng tin kính
  rationale: Trong các thư Mục vụ, từ này chỉ thái độ và đời sống tôn kính hướng về Đức Chúa Trời. “Lòng tin kính” là cách nói quen thuộc, tích cực; điều sai trái nằm ở việc biến nó thành công cụ kiếm lợi.
theological_decisions:
- issue: Nên hiểu εὐσέβεια là lòng sùng kính chân thật hay chỉ là hình thức tôn giáo bên ngoài
  choice: Dịch là “lòng tin kính”, giữ nghĩa tích cực vốn có của từ Hy Lạp; sự sai trái thuộc về thái độ vụ lợi của những người được nói đến.
  alternative: “tôn giáo” hoặc “lòng mộ đạo”
  rationale: Văn bản không hạ thấp chính lòng tin kính thành nghi thức giả tạo, nhưng lên án việc coi lòng tin kính như công cụ kiếm lợi.
- issue: Mức độ phê phán đạo đức trong διεφθαρμένων
  choice: Dịch là “có tâm trí bại hoại”.
  alternative: “có tâm trí hư hỏng” hoặc “suy đồi trong tâm trí”
  rationale: Cách dịch giữ lời phê phán mạnh của nguyên văn và trạng thái hư hoại kéo dài, nhưng không nhập thêm một hệ thống thần học về bản tính con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Những cuộc cãi vã không ngừng” ưu tiên tính tự nhiên hơn việc tái tạo trực tiếp hình ảnh cọ xát trong διαπαρατριβαί. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
