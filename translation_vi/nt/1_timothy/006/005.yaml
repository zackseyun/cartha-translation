    issue: “trục lợi” diễn giải mạnh hơn πορισμός.
    rationale: πορισμός chỉ lợi lộc, lợi nhuận, hoặc phương tiện kiếm lợi; ngữ cảnh phê phán quan niệm sai lầm, nhưng danh từ này không đòi hỏi phải nói rõ việc kiếm lợi là bất chính.
  - severity: low
