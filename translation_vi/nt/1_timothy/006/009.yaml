reference: 1 Timothy 6:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: vi
  text: Nhưng những người muốn giàu có[a] thì sa vào cám dỗ, cạm bẫy và nhiều ham muốn dại dột, tai hại. Những ham muốn ấy nhấn chìm con người trong sự hủy hoại và diệt vong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “muốn trở nên giàu có” hoặc “muốn làm giàu.” Động từ Hy Lạp có thể nói đến khát vọng trở nên giàu, không chỉ tình trạng đang sở hữu của cải.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: Nhưng những người muốn
  rationale: “Muốn” diễn đạt tự nhiên một ước muốn hoặc ý định tương đối rõ rệt; “nhưng” giữ quan hệ tương phản với mạch văn trước.
- source_word: πλουτεῖν
  choice: giàu có
  rationale: Kết hợp với “muốn,” cách nói này có thể chỉ khát vọng ở trong tình trạng giàu có mà không buộc nghĩa phải là một kế hoạch chủ động làm giàu. Chú thích ghi nhận sắc thái “trở nên giàu có/làm giàu.”
- source_word: ἐμπίπτουσιν εἰς
  choice: sa vào
  rationale: Giữ hình ảnh bước hoặc rơi vào một tình trạng nguy hiểm, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: πειρασμόν
  choice: cám dỗ
  rationale: Trong lời cảnh báo đạo đức này, từ ngữ nói đến sức lôi kéo làm điều sai trái hơn là một thử thách trung tính.
- source_word: παγίδα
  choice: cạm bẫy
  rationale: Giữ hình ảnh chiếc bẫy và sắc thái nguy hiểm về đạo đức; đây là cách nói rõ ràng, quen thuộc trong tiếng Việt hiện đại.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: nhiều ham muốn dại dột, tai hại
  rationale: “Ham muốn” truyền đạt sức khao khát mạnh hơn từ “mong muốn”; “dại dột” và “tai hại” lần lượt phản ánh tính thiếu suy xét và tác hại của các ham muốn ấy.
- source_word: αἵτινες
  choice: Những ham muốn ấy
  rationale: Đại từ quan hệ có tiền ngữ gần nhất là “những ham muốn.” Tách thành câu mới giúp tiếng Việt rõ và tự nhiên mà vẫn bảo toàn quan hệ quy chiếu.
- source_word: βυθίζουσι
  choice: nhấn chìm
  rationale: 'Giữ hình ảnh mạnh của động từ Hy Lạp: làm cho ai đó chìm xuống hoặc ngập sâu, chứ không chỉ đưa họ đến một kết quả.'
- source_word: τοὺς ἀνθρώπους
  choice: con người
  rationale: Danh từ Hy Lạp được dùng theo nghĩa bao quát loài người, không giới hạn ở nam giới; “con người” truyền đạt nghĩa khái quát đó tự nhiên.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: sự hủy hoại và diệt vong
  rationale: Hai cách gọi gần nghĩa giữ phép tăng cường của nguyên văn và phần nào phân biệt hai danh từ, nhưng không tự ý xác định chúng chỉ riêng sự kết án đời đời.
theological_decisions:
- issue: Có nên dịch ὄλεθρον καὶ ἀπώλειαν theo cách xác định rõ đây là sự kết án đời đời hay không
  choice: sự hủy hoại và diệt vong
  alternative: sự hủy hoại và trầm luân đời đời
  rationale: Nguyên văn đưa ra lời cảnh báo hết sức nghiêm trọng nhưng riêng các từ này trong câu không bắt buộc người dịch xác định phạm vi là sự kết án đời đời. Bản dịch giữ nguyên sức nặng và độ mở thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sa vào,” “cạm bẫy” và “nhấn chìm” duy trì chuỗi hình ảnh mạnh của nguyên văn; câu được tách ở mệnh đề quan hệ để tránh cấu trúc nặng nề trong tiếng Việt.
