base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: vi
  text: Một số người tự nhận có điều ấy[a] đã lầm lạc về đức tin.[b] Nguyện ân điển ở cùng anh chị em.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc Hy Lạp: “điều mà một số người tự nhận có”. Động từ “tự nhận” ở đây chỉ việc công khai nhận mình có điều ấy.'
    reason: lexical_alternative
  - marker: b
    text: “Đức tin” ở đây nhiều khả năng chỉ đức tin Cơ Đốc như nội dung niềm tin chung, nhưng cũng có thể được hiểu rộng hơn là lòng tin cá nhân.
    reason: alternative_reading
  - marker: c
    text: Đại từ trong bản văn Hy Lạp ở số nhiều. “Anh chị em” là cách diễn đạt số nhiều bao hàm trong tiếng Việt.
    reason: textual_variant
lexical_decisions:
- source_word: ἥν
  choice: điều ấy
  rationale: Đại từ quan hệ giống cái số ít chỉ về “tri thức bị gọi sai là tri thức” ở câu trước. “Điều ấy” nối ý rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐπαγγελλόμενοι
  choice: tuyên xưng
  rationale: Trong thể trung động và văn cảnh này, động từ mang nghĩa tự nhận hoặc công khai xưng mình có điều gì, chứ không phải hứa hẹn.
- source_word: ἠστόχησαν
  choice: đã chệch khỏi
  rationale: Động từ gợi hình ảnh không đạt đúng mục tiêu, rồi phát triển nghĩa đi sai hướng. “Chệch khỏi” giữ được phần nào hình ảnh ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: περὶ τὴν πίστιν
  choice: khỏi đức tin
  rationale: Cách diễn đạt tiếng Việt đi với “chệch khỏi” truyền đạt quan hệ sai lệch đối với đức tin, thay vì dịch cứng giới từ περί là “liên quan đến”.
- source_word: Ἡ χάρις
  choice: Ân điển
  rationale: Đây là công thức chúc phước cuối thư; “Ân điển” là cách diễn đạt trang trọng, quen thuộc và phù hợp với χάρις trong văn cảnh này.
- source_word: μεθ’ ὑμῶν
  choice: ở cùng anh chị em
  rationale: Bổ sung động từ “ở” để thành câu chúc tự nhiên; “anh chị em” thể hiện đại từ ngôi thứ hai số nhiều ὑμῶν.
theological_decisions:
- issue: Ý nghĩa của “đức tin” trong lời cảnh báo
  choice: Đức tin Cơ Đốc như nội dung niềm tin chung
  alternative: Lòng tin cá nhân
  rationale: Trong các thư Mục vụ và đặc biệt trong văn cảnh chống lại thứ “tri thức” bị gọi sai, cụm từ này nhiều khả năng chỉ niềm tin Cơ Đốc được cộng đồng tiếp nhận. Tuy nhiên, chú thích vẫn ghi nhận khả năng hiểu theo nghĩa lòng tin cá nhân.
- issue: Đối tượng của lời chúc phước kết thư
  choice: Giữ nghĩa số nhiều
  alternative: Dùng số ít, chỉ riêng Ti-mô-thê
  rationale: Bản văn Hy Lạp được cung cấp có ὑμῶν ở số nhiều, vì vậy “anh chị em” cho thấy lời chúc vượt ra ngoài riêng người nhận thư được nêu tên.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Tuyên xưng” giữ sắc thái công khai tự nhận; “đã chệch khỏi” bảo tồn hình ảnh lệch mục tiêu mà không tạo câu tiếng Việt gượng ép. Lời chúc dùng “anh chị em” để biểu thị rõ số nhiều.
