revisions:
- from: Một số người tuyên xưng điều ấy[a] nên đã chệch khỏi đức tin.[b] Ân điển ở cùng anh chị em.[c]
  to: Một số người tự nhận có điều ấy[a] đã lầm lạc về đức tin.[b] Nguyện ân điển ở cùng anh chị em.[c]
  rationale: Bỏ “nên” để không áp đặt quan hệ nhân quả không được đánh dấu trong tiếng Hy Lạp; dùng “tự nhận có” để nêu rõ sắc thái của thể trung động; dùng “đã lầm lạc về đức tin” để giữ quan hệ “về/liên quan đến đức tin” của περὶ τὴν πίστιν mà vẫn tự nhiên. Thêm “Nguyện” cho công thức chúc phước, đồng thời chỉnh chú thích số nhiều cho chính xác.
  reviewer_model: gpt-5.6-terra
