source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: vi
  text: Vì chúng ta chẳng mang gì vào thế gian[a], và cũng không thể mang gì ra khỏi đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Vì chúng ta chẳng mang gì vào thế gian, bởi vì chúng ta cũng không thể mang gì ra.” Liên từ Hy Lạp có thể được hiểu theo nghĩa nguyên nhân (“bởi vì”) hoặc như từ dẫn vào vế thứ hai tương ứng.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: chẳng ... gì
  rationale: Diễn đạt tự nhiên đại từ phủ định tuyệt đối làm tân ngữ của động từ “mang vào”.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu cơ sở cho ý đứng trước.
- source_word: εἰσηνέγκαμεν
  choice: mang ... vào
  rationale: Thể hiện rõ hướng nghĩa của εἰσφέρω và hình ảnh con người bước vào thế gian khi sinh ra.
- source_word: εἰς τὸν κόσμον
  choice: vào thế gian
  rationale: “Thế gian” ở đây chỉ cõi đời mà con người sinh vào, không mang nghĩa kỹ thuật về vũ trụ.
- source_word: ὅτι
  choice: và
  rationale: Trong mệnh đề mang tính châm ngôn, từ nối có thể giới thiệu vế tương ứng thứ hai; bản dịch chính dùng “và” để câu tiếng Việt tự nhiên, còn khả năng hiểu theo quan hệ nguyên nhân được giữ trong chú thích.
- source_word: οὐδὲ
  choice: cũng không
  rationale: Nối sự phủ định ở vế sau với vế trước và giữ cấu trúc cân xứng.
- source_word: ἐξενεγκεῖν
  choice: mang ... ra khỏi đó
  rationale: Giữ hướng nghĩa “đem ra ngoài” và làm rõ điểm xuất phát là thế gian, tức hình ảnh rời đời khi chết.
- source_word: τι
  choice: gì
  rationale: Đại từ bất định dưới sự phủ định được diễn đạt tự nhiên bằng “gì”.
- source_word: δυνάμεθα
  choice: không thể
  rationale: Cách nói hiện đại, gọn và chính xác cho ý không có khả năng.
theological_decisions:
- issue: Quan hệ của vế thứ hai do ὅτι dẫn vào
  choice: 'Vế phối hợp nêu chân lý tương ứng: không mang gì vào thế gian và cũng không thể mang gì ra.'
  alternative: 'Mệnh đề chỉ nguyên nhân: “vì chúng ta cũng không thể mang gì ra”.'
  rationale: Nguyên văn với ὅτι cho phép cách hiểu nguyên nhân, nhưng ngữ cảnh cũng tạo thành hai mệnh đề cân xứng mang tính châm ngôn. Bản chính giữ sự cân xứng tự nhiên trong tiếng Việt, còn chú thích bảo tồn cách đọc nguyên nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cặp “mang ... vào / mang ... ra” giữ tính cân xứng của câu; “thế gian” phù hợp văn cảnh về việc con người đến và rời cõi đời.
