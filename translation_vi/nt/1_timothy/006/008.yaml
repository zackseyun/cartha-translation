  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: vi
  text: Nhưng nếu có thức ăn và đồ che phủ[a], chúng ta sẽ bằng lòng với những điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quần áo”; từ Hy Lạp có nghĩa rộng hơn, chỉ những thứ che phủ một người và có thể bao gồm cả nơi trú ngụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: nếu có
  rationale: Phân từ này nêu hoàn cảnh của động từ chính; cách diễn đạt có sắc thái điều kiện vừa tự nhiên trong tiếng Việt vừa không khẳng định quá mức như “vì đã có”.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản nhẹ với mạch văn trước; “Nhưng” thể hiện rõ sự chuyển ý ấy.
- source_word: διατροφὰς
  choice: thức ăn
  rationale: Từ này chỉ phương tiện nuôi sống, đặc biệt là thực phẩm; “thức ăn” là cách nói thông dụng và chính xác.
- source_word: σκεπάσματα
  choice: vật che thân
  rationale: Danh từ có nghĩa rộng là những gì dùng để che phủ một người. “Vật che thân” tự nhiên hơn “đồ che phủ” và không thu hẹp hẳn vào quần áo, dù vẫn cần chú thích khả năng bao gồm nơi trú ngụ.
- source_word: τούτοις
  choice: với những điều ấy
  rationale: Đại từ chỉ định ở cách dữ quy chiếu về những nhu cầu căn bản vừa kể và được giữ rõ bằng “những điều ấy”.
- source_word: ἀρκεσθησόμεθα
  choice: chúng ta sẽ thỏa lòng
  rationale: Hình thức tương lai diễn tả sự bằng lòng với những gì đủ dùng. Bản dịch giữ thì tương lai và không chuyển thành lời khuyên “hãy thỏa lòng”.
theological_decisions:
- issue: Phạm vi nghĩa của σκεπάσματα
  choice: vật che thân, với chú thích rằng từ này có thể bao gồm quần áo và nơi trú ngụ
  alternative: chỉ quần áo; hoặc chỉ nơi trú ngụ
  rationale: Nguyên ngữ đủ rộng để chỉ thứ che phủ con người và không buộc phải giới hạn vào một nhu cầu duy nhất. Giữ độ rộng này bảo toàn lời dạy về sự thỏa lòng với các nhu cầu căn bản mà không áp đặt cách hiểu hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thỏa lòng” truyền đạt sự bằng lòng với điều đủ dùng; “vật che thân” giữ tương đối tốt độ rộng của nguyên ngữ. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
