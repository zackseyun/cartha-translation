  to: Nhưng nếu có thức ăn và đồ che phủ[a], chúng ta sẽ bằng lòng với những điều ấy.
  rationale: Thay “vật che thân” bằng “đồ che phủ” để tránh giới hạn σκεπάσματα vào điều được mặc trực tiếp trên thân, đồng thời giữ chú thích về phạm vi rộng có thể gồm nơi trú ngụ. Thay “thỏa lòng” bằng “bằng lòng” nhằm tăng tính tự nhiên mà vẫn giữ thì tương lai và ý nghĩa của nguyên ngữ.
