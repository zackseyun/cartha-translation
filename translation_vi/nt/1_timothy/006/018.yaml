base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/018.yaml
  text: to do good, to be rich in good works, to be generous, ready to share,
translation:
  language: vi
  text: hãy làm điều lành, giàu có về các việc tốt lành, rộng rãi trong việc cho đi, sẵn lòng chia sẻ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: làm điều lành
  rationale: Động từ nguyên mẫu tiếp tục nội dung của lời truyền bảo trong câu trước. “Làm điều lành” tự nhiên, trang trọng vừa phải và giữ được tính chất hành động của động từ.
- source_word: πλουτεῖν
  choice: trở nên giàu có
  rationale: Động từ được dùng theo nghĩa ẩn dụ. Cách dịch này giữ hình ảnh về sự giàu có và sự tương phản có chủ ý với của cải vật chất trong văn cảnh.
- source_word: ἐν ἔργοις καλοῖς
  choice: trong những việc tốt đẹp
  rationale: Cụm giới từ chỉ phương diện mà họ phải trở nên giàu có. “Những việc tốt đẹp” diễn đạt tự nhiên ý nghĩa đạo đức tích cực của ἔργα καλά mà không giới hạn vào một loại hành vi cụ thể.
- source_word: εὐμεταδότους
  choice: rộng lòng ban cho
  rationale: Tính từ này nói đến thái độ sẵn lòng trao phần tài sản của mình cho người khác. “Rộng lòng ban cho” làm rõ phương diện cho đi và phù hợp với văn cảnh nói về người giàu.
- source_word: κοινωνικούς
  choice: sẵn sàng chia sẻ
  rationale: Trong văn cảnh, từ này chỉ khuynh hướng chia sẻ với người khác. Cách dịch giữ sắc thái về thái độ sẵn lòng và tránh những liên tưởng hiện đại không thích hợp của lối dịch theo nghĩa “có tính cộng đồng”.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: rộng lòng ban cho, sẵn sàng chia sẻ
  rationale: 'Hai tính từ gần nghĩa nhưng không hoàn toàn trùng nhau: từ thứ nhất nhấn mạnh lòng rộng rãi trong việc cho, còn từ thứ hai nhấn mạnh tinh thần chia sẻ. Bản dịch giữ cả hai nét nghĩa và nhịp liệt kê của nguyên văn.'
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, sáng rõ và trang trọng vừa phải. “Giàu có” được giữ như một ẩn dụ để nối với chủ đề của cải trong văn cảnh. Dấu phẩy cuối câu phản ánh việc đây là một mệnh đề tiếp nối trong câu đầy đủ.
