  source_fidelity: 'Cần chỉnh “trở nên giàu có”: πλουτεῖν ở đây diễn tả tình trạng/phẩm chất “giàu có, phong phú” trong lĩnh vực việc lành, không nhấn mạnh quá trình “trở nên”. Các thành tố còn lại giữ đúng chuỗi mệnh lệnh phụ thuộc vào lời truyền bảo ở câu trước và phân biệt hợp lý giữa lòng rộng rãi cho đi với tinh thần chia sẻ.'
  naturalness: “Giàu có về các việc tốt lành” tự nhiên trong tiếng Việt hiện đại, đồng thời giữ được ẩn dụ về sự giàu có. “Rộng rãi trong việc cho đi” rõ nghĩa, trang trọng vừa phải, và tránh sắc thái hơi văn chương/ít thông dụng của “rộng lòng ban cho”.
  terminology: “Điều lành” và “việc tốt lành” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại và phản ánh tốt ἀγαθοεργεῖν cùng ἔργοις καλοῖς. “Sẵn lòng chia sẻ” giữ sắc thái khuynh hướng/sự sẵn sàng của κοινωνικούς.
  issues:
