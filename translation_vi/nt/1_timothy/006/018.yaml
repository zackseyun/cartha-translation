    rationale: Cụm này thêm sắc thái biến chuyển hoặc đạt đến một tình trạng. πλουτεῖν trong cấu trúc này có nghĩa là “giàu có/phong phú” về việc lành; cần giữ hình ảnh tương phản với người giàu trong ngữ cảnh mà không thêm ý tiến trình.
  - severity: low
    issue: “rộng lòng ban cho”
    rationale: Cách nói hiểu được, nhưng “rộng rãi trong việc cho đi” tự nhiên và trực tiếp hơn cho εὐμεταδότους, đồng thời phân biệt rõ với “sẵn lòng chia sẻ” kế tiếp.
