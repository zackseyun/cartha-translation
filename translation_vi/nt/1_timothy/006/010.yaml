id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: vi
  text: Vì lòng ham tiền là một cội rễ sinh ra đủ mọi điều ác[a]. Do mải mê theo đuổi điều ấy, một số người đã lạc xa đức tin[b] và tự đâm thấu mình bằng nhiều nỗi đau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo lối truyền thống: “Vì lòng ham tiền là cội rễ của mọi điều ác.” Tuy nhiên, tiếng Hy Lạp tự nhiên hơn khi được hiểu là “một cội rễ sinh ra đủ mọi điều ác”, chứ không nhất thiết nói rằng mọi điều ác đều chỉ có một nguyên nhân.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đã lạc khỏi sự tin cậy.” Trong văn cảnh này, “đức tin” có lẽ chủ yếu chỉ đức tin Cơ Đốc mà họ đã tin nhận.'
    reason: lexical_alternative
  - marker: c
    text: “Nỗi đau” cũng có thể được hiểu là những nỗi thống khổ hoặc đau buồn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: một cội rễ
  rationale: Danh từ vị ngữ không có mạo từ được diễn đạt tự nhiên theo nghĩa bất định là “một cội rễ”; cách dịch này cũng giữ nguyên hình ảnh cụ thể của tiếng Hy Lạp.
- source_word: πάντων τῶν κακῶν
  choice: đủ mọi điều ác
  rationale: Cụm số nhiều chỉ phạm vi rộng của những điều xấu ác. “Đủ mọi điều ác” truyền đạt sắc thái đa dạng mà không biến câu thành khẳng định rằng mọi sự ác không ngoại lệ đều chỉ có một nguyên nhân.
- source_word: φιλαργυρία
  choice: lòng ham tiền
  rationale: Từ này chỉ sự yêu thích, ham mê tiền bạc. “Lòng ham tiền” rõ nghĩa, tự nhiên trong tiếng Việt hiện đại và hẹp nghĩa hơn “lòng tham” nói chung.
- source_word: ἧς ... ὀρεγόμενοι
  choice: Do mải mê theo đuổi điều ấy
  rationale: Đại từ quan hệ quy chiếu về φιλαργυρία, còn phân từ diễn tả sự vươn tới hoặc khao khát mãnh liệt. Cách diễn đạt này giữ mối quy chiếu mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: đã lạc xa đức tin
  rationale: Động từ gợi hình ảnh đi chệch và rời khỏi một vị trí trước đó. “Lạc xa” vừa tự nhiên vừa giữ hướng chuyển động ra khỏi đức tin.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong văn cảnh các Thư Mục vụ, từ có thể chỉ đức tin Cơ Đốc như nội dung được tin nhận; tiếng Việt “đức tin” vẫn giữ được phần nào khả năng hiểu là sự tin cậy cá nhân.
- source_word: περιέπειραν
  choice: tự đâm thấu mình
  rationale: Động từ mang hình ảnh mạnh là đâm xuyên hoặc xuyên thấu. Bản dịch giữ hình ảnh ấy và đại từ phản thân của nguyên văn.
- source_word: ὀδύναις πολλαῖς
  choice: bằng nhiều nỗi đau
  rationale: ὀδύνη bao gồm đau đớn, khổ sở và thống khổ sâu sắc; “nỗi đau” đủ rộng để không giới hạn vào đau buồn cảm xúc.
theological_decisions:
- issue: Phạm vi lời khẳng định về lòng ham tiền và sự ác
  choice: Lòng ham tiền là một cội rễ sinh ra đủ mọi điều ác.
  alternative: Lòng ham tiền là cội rễ của mọi điều ác.
  rationale: ῥίζα không có mạo từ và πάντων τῶν κακῶν ở số nhiều. Cách dịch chính tránh khẳng định lòng ham tiền là nguyên nhân duy nhất của từng điều ác, đồng thời vẫn giữ sức cảnh báo bao quát của câu.
- issue: Ý nghĩa của τῆς πίστεως
  choice: “Đức tin” chủ yếu chỉ đức tin Cơ Đốc mà họ từng gắn bó.
  alternative: “Đức tin” chỉ hành vi tin cậy mang tính cá nhân.
  rationale: Mạo từ và cách dùng trong các Thư Mục vụ nghiêng về nghĩa khách quan, nhưng bản dịch không thêm một cụm giải thích vào chính câu để tránh loại bỏ hoàn toàn sắc thái tin cậy cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Cội rễ”, “lạc xa” và “đâm thấu” duy trì chuỗi hình ảnh mạnh của nguyên văn; cấu trúc được tách thành hai câu để tiếng Việt sáng rõ mà không làm thay đổi quan hệ nguyên nhân-kết quả.
