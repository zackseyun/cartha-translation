reference: 1 Timothy 6:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: vi
  text: Hỡi Ti-mô-thê, hãy gìn giữ điều đã được giao phó cho con; hãy tránh những lời nói trống rỗng, phàm tục và những điều đối nghịch[a] của cái gọi là “tri thức” một cách giả dối[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều mâu thuẫn” hoặc “những lời chống đối.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “của thứ được gọi là ‘tri thức’.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Hỡi Ti-mô-thê
  rationale: “Hỡi” giữ được sắc thái trực tiếp, trang trọng và tha thiết của tiểu từ hô cách Ὦ, đồng thời vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: παραθήκην
  choice: điều đã được giao phó cho con
  rationale: παραθήκη chỉ một vật hay điều được trao cho ai gìn giữ. Cách dịch này chuyển tải rõ ý ký thác mà không xác định nội dung là Tin Mừng, giáo huấn sứ đồ hay chức vụ, vì câu Hy Lạp không nói rõ.
- source_word: φύλαξον
  choice: hãy gìn giữ
  rationale: φύλαξον mang ý canh giữ và bảo toàn cẩn thận. “Gìn giữ” vừa diễn đạt sự bảo vệ tích cực vừa phù hợp với điều được giao phó.
- source_word: ἐκτρεπόμενος
  choice: hãy tránh xa
  rationale: Phân từ này diễn tả việc quay khỏi hay tránh né. Trong tiếng Việt, chuyển thành mệnh lệnh phối hợp giúp câu rõ và tự nhiên mà vẫn giữ quan hệ với mệnh lệnh chính.
- source_word: βεβήλους
  choice: phàm tục
  rationale: βεβήλους đối lập điều không thánh với điều thánh. “Phàm tục” giữ được sắc thái tôn giáo và không thu hẹp nghĩa thành hoàn toàn vô thần.
- source_word: κενοφωνίας
  choice: những lời nói trống rỗng
  rationale: Từ ghép này chỉ lời lẽ rỗng tuếch, không có nội dung hay giá trị. Cách dịch hiện đại, dễ hiểu và vẫn giữ sắc thái chê trách.
- source_word: ἀντιθέσεις
  choice: những điều mâu thuẫn
  rationale: ἀντιθέσεις có thể chỉ các điều đối nghịch, mâu thuẫn hoặc lời chống đối. “Những điều mâu thuẫn” phù hợp với ngữ cảnh tranh luận, còn khả năng “chống đối” được giữ trong chú thích.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: thuộc về thứ bị gọi sai là “tri thức”
  rationale: ψευδώνυμος nói đến một danh xưng sai lệch. Cách dịch này cho thấy tác giả phủ nhận tính chính đáng của nhãn gọi “tri thức”, nhưng không xác định cụ thể hệ tư tưởng đang được nhắc đến.
theological_decisions:
- issue: Nội dung của παραθήκη
  choice: Giữ cách gọi khái quát là “điều đã được giao phó cho con”.
  alternative: Tin Mừng; giáo huấn của các sứ đồ; trách nhiệm chức vụ của Ti-mô-thê.
  rationale: Ngữ cảnh có thể gợi đến sứ điệp hay giáo huấn được giao cho Ti-mô-thê, nhưng chính câu này không xác định nội dung. Bản dịch vì thế không thu hẹp nghĩa theo một cách giải thích thần học riêng.
- issue: Quan hệ của cụm τῆς ψευδωνύμου γνώσεως
  choice: Dùng “thuộc về” để nối cụm sở thuộc với cả chuỗi những lời nói trống rỗng và những điều mâu thuẫn.
  alternative: Chỉ hiểu cụm này bổ nghĩa trực tiếp cho “những điều mâu thuẫn”.
  rationale: Cấu trúc Hy Lạp cho phép nhận ra mối liên hệ của cả hai yếu tố với thứ bị gọi sai là tri thức, nhưng phạm vi bổ nghĩa có thể được cảm nhận hẹp hơn. Cách dịch không diễn giải nội dung của thứ “tri thức” ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Hỡi” giữ sắc thái tha thiết của lời gọi; dấu chấm phẩy và mệnh lệnh lặp lại giúp câu tiếng Việt sáng rõ. Dùng “tri thức” thay vì thuật ngữ chuyên biệt để không gán cho cụm từ một hệ phái hay phong trào lịch sử cụ thể.
