- from: Hỡi Ti-mô-thê, hãy gìn giữ điều đã được giao phó cho con; hãy tránh xa những lời nói trống rỗng, phàm tục và những điều mâu thuẫn[a] thuộc về thứ bị gọi sai là “tri thức”[b].
  to: Hỡi Ti-mô-thê, hãy gìn giữ điều đã được giao phó cho con; hãy tránh những lời nói trống rỗng, phàm tục và những điều đối nghịch[a] của cái gọi là “tri thức” một cách giả dối[b].
  rationale: Bản sửa thay cách nói không tự nhiên “thuộc về thứ bị gọi sai là” bằng một kết cấu tiếng Việt rõ ràng hơn, đồng thời phản ánh ψευδώνυμος là một danh xưng giả dối. “Những điều đối nghịch” phản ánh nghĩa cơ bản của ἀντιθέσεις; chú thích giữ khả năng “mâu thuẫn” và “lời chống đối.” Cụm “của cái gọi là…” được đặt ngay sau “những điều đối nghịch,” phù hợp với sự gắn kết ngữ pháp trực tiếp của sở hữu cách trong tiếng Hy Lạp, không loại trừ sắc thái liên hệ rộng hơn trong diễn ngôn.
  reviewer_model: gpt-5.6-terra
