    rationale: 'Cách này có thể gợi phương tiện hay nguyên nhân mạnh hơn mức mà sở hữu cách τῆς πίστεως biểu thị. Nên mô tả hai khả năng: cuộc chiến được đức tin định đặc tính, hoặc cuộc chiến vì/bảo vệ đức tin.'
