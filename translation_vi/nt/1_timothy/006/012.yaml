- from: Hãy chiến đấu trong cuộc chiến cao đẹp của đức tin[a]; hãy nắm lấy sự sống đời đời mà anh đã được kêu gọi đến với. Anh cũng đã nói lên lời tuyên xưng cao đẹp ấy[b] trước mặt nhiều nhân chứng.
  to: Hãy chiến đấu cuộc chiến cao đẹp của đức tin[a]; hãy nắm lấy sự sống đời đời mà anh đã được kêu gọi đến, và anh đã đưa ra lời tuyên xưng cao đẹp trước mặt nhiều nhân chứng.[b]
  rationale: Sửa cách diễn đạt không tự nhiên của mệnh đề «được kêu gọi», và bỏ «ấy» để không biến một liên hệ gần trong mạch văn thành nội dung được xác định rõ của lời tuyên xưng. Chú thích được điều chỉnh để bảo tồn sự mơ hồ của τῆς πίστεως và quan hệ cú pháp của mệnh đề cuối.
  reviewer_model: gpt-5.6-terra
