    issue: «mà anh đã được kêu gọi đến với»
    rationale: Cụm «đến với» là thừa và không tự nhiên sau «được kêu gọi». «Đến» đủ chuyển tải εἰς như đích hướng của sự kêu gọi.
  - severity: medium
    issue: «lời tuyên xưng cao đẹp ấy»
    rationale: «Ấy» tạo liên hệ chỉ định trực tiếp với «sự sống đời đời» mà nguyên văn không nêu. Mệnh đề với ὡμολόγησας được nối bằng καί, không có đại từ hay giới từ mang nghĩa «về điều ấy».
