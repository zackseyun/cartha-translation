id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: vi
  text: Hãy chiến đấu cuộc chiến cao đẹp của đức tin[a]; hãy nắm lấy sự sống đời đời mà anh đã được kêu gọi đến, và anh đã đưa ra lời tuyên xưng cao đẹp trước mặt nhiều nhân chứng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Hãy chiến đấu cuộc chiến cao đẹp của lòng tin” hoặc “Hãy chiến đấu cho đức tin.” Cụm từ Hy Lạp có thể chỉ cuộc tranh đấu được đức tin định đặc tính, hoặc cuộc tranh đấu vì đức tin.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch đơn giản: “và anh đã đưa ra lời tuyên xưng cao đẹp trước mặt nhiều nhân chứng.” Tiếng Hy Lạp không nói rõ nội dung của lời tuyên xưng, dù mệnh đề này đứng ngay sau mệnh đề về sự kêu gọi đến sự sống đời đời.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: Hãy chiến đấu trong cuộc chiến cao đẹp
  rationale: Giữ hình ảnh tranh đấu và phần nào tái hiện kết cấu đồng gốc ἀγωνίζου/ἀγῶνα. “Cao đẹp” diễn đạt phẩm chất tốt lành, đáng quý của καλός tự nhiên hơn “tốt” trong cụm này.
- source_word: τῆς πίστεως
  choice: của đức tin
  rationale: Bám sát cấu trúc sở hữu của tiếng Hy Lạp và giữ được độ mở giữa cuộc chiến được đặc trưng bởi lòng tin với cuộc chiến vì nội dung đức tin Cơ Đốc.
- source_word: ἐπιλαβοῦ
  choice: hãy nắm lấy
  rationale: Diễn đạt mệnh lệnh dứt khoát cùng hình ảnh đưa tay nắm giữ, không làm yếu thành ý niệm chỉ tìm kiếm hay mong ước.
- source_word: τῆς αἰωνίου ζωῆς
  choice: sự sống đời đời
  rationale: Là cách nói tự nhiên, quen thuộc và chính xác trong tiếng Việt cho sự sống thuộc thời đại đời đời.
- source_word: εἰς ἣν ἐκλήθης
  choice: mà anh đã được kêu gọi đến với
  rationale: Giữ thể bị động thần học của “được kêu gọi” và sắc thái hướng tới/đích đến của εἰς mà không giải thích thêm cơ chế của sự kêu gọi.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: anh đã nói lên lời tuyên xưng cao đẹp ấy
  rationale: “Nói lên lời tuyên xưng” tránh sự lặp từ vụng về trong tiếng Việt nhưng vẫn giữ hành động công khai thừa nhận; “cao đẹp” duy trì sự song hành với καλὸν ở đầu câu.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: trước mặt nhiều nhân chứng
  rationale: Chuyển tải trực tiếp nghĩa hiện diện công khai; “nhân chứng” ở đây không bị hiểu thành “người tử đạo”.
theological_decisions:
- issue: Ý nghĩa của πίστεως trong τὸν καλὸν ἀγῶνα τῆς πίστεως
  choice: “của đức tin,” giữ cấu trúc có thể nghiêng về đức tin Cơ Đốc như một nội dung xác định
  alternative: “bởi lòng tin” hoặc “vì đức tin”
  rationale: Ngữ cảnh các thư Mục vụ và mạo từ có thể nâng đỡ nghĩa khách quan “đức tin,” nhưng ngữ pháp cũng cho phép hiểu cuộc chiến được đặc trưng bởi lòng tin. Bản chính không ép chọn một cách diễn giải và chú thích nêu rõ hai khả năng.
- issue: Mối liên hệ giữa lời tuyên xưng với sự sống đời đời và sự kêu gọi
  choice: Dùng “lời tuyên xưng cao đẹp ấy” để cho thấy một mối liên hệ gần trong mạch văn mà không xác định đầy đủ nội dung
  alternative: 'Chỉ nối ngang hàng: “và anh đã nói lên lời tuyên xưng cao đẹp trước mặt nhiều nhân chứng”'
  rationale: Tiếng Hy Lạp đặt lời tuyên xưng ngay sau mệnh đề về sự sống đời đời mà Ti-mô-thê được kêu gọi đến, nhưng không có từ tương đương trực tiếp với “về điều ấy.” Chú thích bảo tồn khả năng đọc hai mệnh đề như những lời khuyên và sự kiện được phối hợp đơn thuần.
- issue: Đại từ ngôi thứ hai số ít dành cho Ti-mô-thê
  choice: anh
  alternative: con hoặc không nêu đại từ
  rationale: Động từ Hy Lạp đánh dấu số ít nhưng không mã hóa quan hệ thân tộc. “Anh” là đại từ hiện đại, trang trọng vừa phải và tránh thêm sắc thái cha-con không được biểu thị trực tiếp trong câu này.
translation_notes:
  register: Văn phong mệnh lệnh trực tiếp, trang trọng nhưng hiện đại. Bản dịch giữ hai hình ảnh nổi bật là chiến đấu và nắm lấy, đồng thời tránh thuật ngữ giáo phái. Dấu chấm tách hai vế cuối để tiếng Việt dễ đọc; “ấy” duy trì liên kết gần nhưng chú thích giữ lại sự mơ hồ cú pháp của nguyên văn.
