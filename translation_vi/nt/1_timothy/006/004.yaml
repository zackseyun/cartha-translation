    issue: Cụm “mắc bệnh ham mê” không tự nhiên.
    rationale: Tiếng Việt thường nói “mắc chứng say mê” hoặc “bệnh hoạn vì say mê.” Sửa thành “mắc chứng say mê” vừa giữ phép ẩn dụ bệnh tật của νοσῶν vừa diễn đạt trôi chảy.
  - severity: low
    issue: “Những ngờ vực xấu xa” hơi gượng trong tiếng Việt hiện đại.
