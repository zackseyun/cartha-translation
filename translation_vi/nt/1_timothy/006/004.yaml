reference: 1 Timothy 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: vi
  text: người ấy đã trở nên kiêu căng[a], chẳng hiểu biết gì, nhưng mắc chứng say mê những cuộc tranh luận và những cuộc đấu khẩu[b]. Từ đó nảy sinh sự ganh tị, tranh chấp, những lời phỉ báng[c] và những mối nghi ngờ xấu xa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã trở nên tự phụ.” Từ Hy Lạp gợi hình ảnh một người bị lòng kiêu ngạo làm cho phồng lên.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “những cuộc tranh chấp về từ ngữ.”'
    reason: lexical_alternative
  - marker: c
    text: Ở đây, “những lời phỉ báng” chỉ lời lẽ lăng mạ hoặc bôi nhọ người khác; trong những ngữ cảnh khác, từ Hy Lạp này có thể có nghĩa là “những lời phạm thượng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: đã trở nên kiêu căng
  rationale: Thể hoàn thành diễn tả một trạng thái đã hình thành và còn tiếp diễn. Cách dịch này truyền đạt ý tự cao, dù ẩn dụ nguyên văn về sự phồng lên được ghi ở chú thích.
- source_word: μηδὲν ἐπιστάμενος
  choice: chẳng hiểu biết gì
  rationale: Diễn đạt tự nhiên ý người ấy không thực sự nắm hiểu điều gì.
- source_word: νοσῶν περὶ ζητήσεις
  choice: mắc bệnh ham mê những cuộc tranh luận
  rationale: Giữ hình ảnh bệnh tật của νοσέω, đồng thời làm rõ đây là sự say mê không lành mạnh đối với các vấn đề gây tranh cãi.
- source_word: λογομαχίας
  choice: những cuộc đấu khẩu
  rationale: Truyền đạt sắc thái giao chiến bằng lời của từ ghép λόγος và μάχη; chú thích bảo lưu nghĩa cụ thể là tranh chấp về từ ngữ.
- source_word: ἐξ ὧν γίνεται
  choice: Từ đó nảy sinh
  rationale: Nêu rõ các tật xấu tiếp theo phát sinh từ những cuộc tranh luận và đấu khẩu vừa nói.
- source_word: φθόνος
  choice: sự ganh tị
  rationale: Chỉ lòng khó chịu trước điều tốt người khác có, phù hợp với φθόνος.
- source_word: ἔρις
  choice: tranh chấp
  rationale: Diễn tả sự bất hòa và xung đột trong danh sách các tật xấu.
- source_word: βλασφημίαι
  choice: những lời phỉ báng
  rationale: Trong ngữ cảnh quan hệ giữa người với người, từ này tự nhiên nhất là lời lăng mạ hoặc bôi nhọ; nghĩa rộng khác được ghi trong chú thích.
- source_word: ὑπόνοιαι πονηραί
  choice: những ngờ vực xấu xa
  rationale: Dịch trực tiếp cả ý nghi ngờ của ὑπόνοιαι và phẩm chất xấu của πονηραί mà không thu hẹp thành động cơ ác ý.
theological_decisions:
- issue: Đối tượng của βλασφημίαι
  choice: những lời phỉ báng nhắm vào con người trong ngữ cảnh này
  alternative: những lời phạm thượng nhắm vào Đức Chúa Trời
  rationale: Danh sách mô tả hậu quả xã hội của tranh luận và đấu khẩu nên nghĩa lời lăng mạ, bôi nhọ phù hợp hơn; tuy vậy, phạm vi nghĩa khác của từ Hy Lạp được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ ẩn dụ bệnh tật của nguyên văn, dùng “đấu khẩu” để tái hiện sức mạnh của hình ảnh chiến đấu bằng lời, và đặt đầy đủ các dấu chú thích ngay sau từ ngữ liên quan.
