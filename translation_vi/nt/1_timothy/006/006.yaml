  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: vi
  text: Nhưng lòng tin kính đi đôi với sự thỏa lòng là một mối lợi lớn[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một lợi ích lớn” hoặc “một phương tiện sinh lợi lớn”. Từ Hy Lạp có nghĩa là lợi ích, lợi lộc hoặc phương tiện kiếm lợi, lặp lại ý ở câu trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự tự túc” hoặc “sự đầy đủ”. Ở đây, ý có lẽ là thỏa lòng hoặc thấy đủ, chứ không phải tự lực mà không cần đến Đức Chúa Trời hay người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản nhẹ với ý ở câu trước, nơi lòng tin kính bị xem như một phương tiện kiếm lợi.
- source_word: πορισμὸς
  choice: mối lợi
  rationale: Giữ nghĩa lợi ích/lợi lộc và sự liên hệ từ vựng với câu trước, nhưng không giới hạn vào của cải vật chất.
- source_word: μέγας
  choice: lớn
  rationale: Cách diễn đạt tự nhiên cho mức độ đáng kể của πορισμός.
- source_word: εὐσέβεια
  choice: lòng tin kính
  rationale: Chỉ thái độ tôn kính Đức Chúa Trời được thể hiện trong đời sống; cách nói này tự nhiên và trang trọng trong tiếng Việt.
- source_word: μετὰ
  choice: đi đôi với
  rationale: Diễn đạt quan hệ đồng hành/kết hợp, tự nhiên hơn cách dịch máy móc là 'với' trong câu tiếng Việt.
- source_word: αὐταρκείας
  choice: sự thỏa lòng
  rationale: Trong văn cảnh các câu 7–8, từ này nói đến việc bằng lòng với điều mình có hơn là sự độc lập tự túc.
theological_decisions:
- issue: Ý nghĩa của αὐτάρκεια trong văn cảnh Cơ Đốc
  choice: sự thỏa lòng
  alternative: sự tự túc; sự đầy đủ
  rationale: Văn cảnh kế tiếp giải thích điều này bằng việc thỏa lòng khi có thức ăn và áo mặc, không đề cao lý tưởng tự lực độc lập với Đức Chúa Trời.
- issue: Quan hệ giữa lòng tin kính và lợi ích
  choice: lòng tin kính đi đôi với sự thỏa lòng chính là một mối lợi lớn
  alternative: lòng tin kính là phương tiện đem lại lợi lớn khi có sự thỏa lòng
  rationale: Cấu trúc Hy Lạp cho phép nghe sắc thái 'mối lợi/phương tiện sinh lợi'. Bản chính giữ cách xác định trực tiếp, phù hợp với sự tương phản ở câu 5 mà không biến lòng tin kính thành công cụ vụ lợi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Lòng tin kính” phù hợp với văn phong Kinh Thánh phổ thông; “đi đôi với sự thỏa lòng” diễn đạt tự nhiên quan hệ μετά + sở hữu cách. Hai dấu chú thích đều được đặt trong bản văn.
