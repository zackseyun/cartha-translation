id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: vi
  text: Còn anh, hỡi người của Đức Chúa Trời, hãy chạy trốn những điều ấy; hãy theo đuổi sự công chính[a], lòng tin kính, đức tin[b], tình yêu thương, sự kiên trì và tính nhu hòa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lòng trung tín” hoặc “sự tin cậy.”
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp hiếm này cũng có thể được dịch là “sự nhu mì,” “lòng nhẫn nhịn” hoặc “sự nhu mì kiên nhẫn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Nhưng con
  rationale: Đại từ được nêu rõ tạo thế tương phản mạnh với phần trước; “con” là cách xưng hô tự nhiên của Phao-lô với Ti-mô-thê trong tiếng Việt và vẫn giữ ngôi thứ hai số ít.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: hỡi người của Đức Chúa Trời
  rationale: Giữ sắc thái trực tiếp, trang trọng của hô cách và thành ngữ Kinh Thánh; trong tiếng Việt, “người” không xóa bỏ việc lời này đang trực tiếp nói với Ti-mô-thê là nam giới.
- source_word: ταῦτα φεῦγε
  choice: hãy chạy trốn những điều ấy
  rationale: Diễn đạt sức mạnh và tính cấp bách của mệnh lệnh φεῦγε rõ hơn từ nhẹ hơn như “tránh”.
- source_word: δίωκε δὲ
  choice: còn hãy theo đuổi
  rationale: Giữ sự đối lập cân xứng giữa chạy trốn điều xấu và tích cực theo đuổi các đức tính.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Cách dịch quen thuộc cho δικαιοσύνη trong văn mạch Phao-lô; “công lý” là khả năng từ vựng khác nên được giữ trong chú thích.
- source_word: εὐσέβειαν
  choice: lòng tin kính
  rationale: Diễn tả đời sống kính sợ và hướng về Đức Chúa Trời, tự nhiên hơn “sự sùng đạo” trong văn phong Kinh Thánh hiện đại.
- source_word: πίστιν
  choice: đức tin
  rationale: Giữ nghĩa thông dụng của πίστις, đồng thời chú thích các nghĩa khả dĩ “lòng trung tín” và “sự tin cậy” trong danh sách phẩm chất này.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: Cách diễn đạt rõ ràng, tự nhiên và có phẩm cách cho ἀγάπη.
- source_word: ὑπομονήν
  choice: sự kiên trì
  rationale: Nhấn mạnh sự bền vững dưới áp lực; phù hợp danh sách đức tính hơn nghĩa hẹp hoặc thụ động của “kiên nhẫn”.
- source_word: πραϋπαθίαν
  choice: tính nhu hòa
  rationale: Thuật ngữ Hy Lạp hiếm, mang sắc thái hiền dịu và nhẫn nhịn; “tính nhu hòa” dễ hiểu nhưng các sắc thái khác được bảo lưu trong chú thích.
theological_decisions:
- issue: Lối xưng gọi ὦ ἄνθρωπε θεοῦ
  choice: hỡi người của Đức Chúa Trời
  alternative: hỡi người thuộc về Đức Chúa Trời; hỡi người của Chúa
  rationale: Giữ thành ngữ chỉ người thuộc về và phục vụ Đức Chúa Trời, không diễn giải thành một chức vụ giáo phái cụ thể.
- issue: Phạm vi nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: Văn mạch là danh sách đức tính nên “sự công chính” phù hợp nhất, nhưng không loại bỏ chiều kích công lý của từ Hy Lạp.
- issue: Phạm vi nghĩa của πίστις
  choice: đức tin
  alternative: lòng trung tín; sự tin cậy
  rationale: Không quyết định tuyệt đối giữa lòng tin, sự tin cậy và tính trung tín trong danh sách đức tính; bản chính dùng cách dịch thông dụng và chú thích giữ sự nhập nhằng.
- issue: Sắc thái của πραϋπαθία
  choice: tính nhu hòa
  alternative: sự nhu mì; lòng nhẫn nhịn; sự nhu mì kiên nhẫn
  rationale: Từ hiếm này kết hợp nét nghĩa hiền dịu với sự tự chế bền bỉ; chú thích bảo lưu những cách hiểu không thể gói trọn trong một từ tiếng Việt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc tương phản của hai mệnh lệnh và nhịp của danh sách đức tính; dùng “con” theo quan hệ diễn ngôn Phao-lô–Ti-mô-thê, còn danh xưng “người của Đức Chúa Trời” giữ nguyên thành ngữ Kinh Thánh.
