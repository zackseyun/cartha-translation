  to: Vì chính mục đích ấy mà chúng ta lao nhọc và bị sỉ nhục[a], vì chúng ta đã đặt hy vọng nơi Đức Chúa Trời hằng sống[b], là Đấng Cứu Rỗi của mọi người, nhất là của những người tin[c].
