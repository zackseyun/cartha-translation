  - severity: low
    issue: Chú thích c diễn đạt chưa thật trung tính và tự nhiên
    rationale: “Sự cứu rỗi Ngài ban sẵn” không phải cách diễn đạt rõ, và có thể hàm ý một phân tích thần học cụ thể. “Sự cứu rỗi Ngài cung ứng cho mọi người” sát hơn với ghi chú tiếng Anh; “được áp dụng cách đặc biệt” trình bày khả năng diễn giải mà không quyết định nghĩa chính văn.
