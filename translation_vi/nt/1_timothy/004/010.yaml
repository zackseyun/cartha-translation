id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: vi
  text: Vì chính mục đích ấy mà chúng ta lao nhọc và bị sỉ nhục[a], vì chúng ta đã đặt hy vọng nơi Đức Chúa Trời hằng sống[b], là Đấng Cứu Rỗi của mọi người, nhất là của những người tin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta khó nhọc và bị người ta lăng mạ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chúng ta đã hướng niềm hy vọng vào Đức Chúa Trời hằng sống.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cụm từ “Đấng Cứu Rỗi của mọi người, nhất là của những người tin” được dịch theo cách diễn đạt của nguyên văn. Có những cách hiểu khác nhau: “Đấng Cứu Rỗi” ở đây có thể nhấn mạnh sự chăm sóc bảo tồn của Đức Chúa Trời dành cho mọi người, sự cứu rỗi Ngài cung ứng cho mọi người, hoặc sự cứu rỗi được áp dụng cách đặc biệt cho những người tin.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: chính mục đích ấy
  rationale: Diễn đạt sức hướng đích của cụm giới từ và chỉ về mục tiêu vừa nêu ở câu trước.
- source_word: γὰρ
  choice: Vì
  rationale: Giới thiệu lời giải thích cho mệnh đề trước một cách tự nhiên trong tiếng Việt.
- source_word: κοπιῶμεν
  choice: chúng ta lao nhọc
  rationale: Giữ sắc thái làm việc vất vả, gắng sức của động từ κοπιάω.
- source_word: ὀνειδιζόμεθα
  choice: chịu sỉ nhục
  rationale: Thể bị động diễn tả việc phải hứng chịu lời lăng mạ và sự ô nhục; bản dịch giữ sắc thái mạnh của từ Hy Lạp.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: chúng ta đã đặt hy vọng nơi
  rationale: Thì hoàn thành chỉ một hành động đã xảy ra với kết quả còn tiếp diễn; cách nói này tự nhiên và thể hiện niềm hy vọng đã được đặt vững.
- source_word: θεῷ ζῶντι
  choice: Đức Chúa Trời hằng sống
  rationale: Cụm từ Kinh Thánh quen thuộc, trang trọng và sát nghĩa.
- source_word: σωτὴρ
  choice: Đấng Cứu Rỗi
  rationale: Giữ đầy đủ sức nặng thần học của σωτήρ mà không thu hẹp trước thành nghĩa 'Đấng bảo tồn' hay 'Đấng giải cứu'.
- source_word: πάντων ἀνθρώπων
  choice: của mọi người
  rationale: ἄνθρωποι được dùng theo nghĩa bao quát toàn thể loài người; 'mọi người' là cách nói hiện đại và tự nhiên.
- source_word: μάλιστα
  choice: nhất là
  rationale: Diễn đạt nghĩa 'đặc biệt là' và giữ nguyên sự căng thẳng giữa phạm vi 'mọi người' với vị trí nổi bật của người tin.
- source_word: πιστῶν
  choice: những người tin
  rationale: Trong ngữ cảnh, từ này chỉ những người có đức tin; cách diễn đạt rõ ràng và không làm mờ nét nghĩa bằng khái niệm chung về sự trung tín.
theological_decisions:
- issue: Ý nghĩa của câu 'Đấng Cứu Rỗi của mọi người, nhất là của những người tin'
  choice: Giữ nguyên cả tính phổ quát 'mọi người' lẫn nét đặc biệt 'nhất là của những người tin', không giải thích ngay trong chính văn.
  alternative: Có thể hiểu 'Đấng Cứu Rỗi' là Đấng bảo tồn mọi người nhưng cứu chuộc người tin; hoặc hiểu theo cứu rỗi phổ quát; hoặc thu hẹp 'mọi người' thành mọi hạng người.
  rationale: Câu Hy Lạp đặt hai ý cạnh nhau mà không xác định chính xác mối quan hệ giữa chúng. Bản dịch vì thế bảo toàn sự căng thẳng thần học và ghi nhận các hướng giải thích trong chú thích thay vì áp đặt một hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và “Đấng Cứu Rỗi” theo văn phong Kinh Thánh quen thuộc; cấu trúc câu giữ mạch lập luận của nguyên văn mà vẫn tự nhiên.
