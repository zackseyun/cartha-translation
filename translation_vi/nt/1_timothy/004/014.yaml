id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: vi
  text: Đừng lơ là ân tứ trong con, ân tứ đã được ban cho con qua lời tiên tri[a], cùng với việc hội đồng trưởng lão đặt tay trên con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua sự nói tiên tri”; cụm từ này có thể cho biết lời tiên tri đi kèm hoặc làm phương tiện trong việc ban ân tứ.'
    reason: lexical_alternative
  - marker: b
    text: “Hội đồng trưởng lão” chỉ tập thể các trưởng lão; cũng có thể dịch là “tập thể trưởng lão” hoặc “ban trưởng lão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Đừng sao nhãng
  rationale: Diễn đạt mệnh lệnh cấm ở thì hiện tại, nhấn mạnh không được tiếp tục lơ là hay không quan tâm đúng mức.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: ân tứ ở trong con
  rationale: “Ân tứ” diễn đạt một món quà được ban bởi ân điển; “ở trong con” giữ lại cách định vị rõ ràng của ἐν σοὶ thay vì rút gọn thành “ân tứ của con”.
- source_word: ἐδόθη σοι
  choice: đã được ban cho con
  rationale: Giữ thể bị động của động từ và không xác định rõ chủ thể ban, đúng như bản Hy Lạp.
- source_word: διὰ προφητείας
  choice: qua lời tiên tri
  rationale: διά với sở hữu cách có thể chỉ phương tiện; cách dịch này tự nhiên trong tiếng Việt mà vẫn để ngỏ việc lời tiên tri đi kèm hay làm phương tiện trong sự ban ân tứ.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: cùng với việc ... đặt tay trên con
  rationale: Diễn đạt tự nhiên nghi thức đặt tay và giữ nghĩa đi kèm của μετά.
- source_word: τοῦ πρεσβυτερίου
  choice: hội đồng trưởng lão
  rationale: Chỉ một tập thể các trưởng lão, tránh thuật ngữ giáo phái về cơ cấu hội thánh hình thành về sau.
theological_decisions:
- issue: Có nên làm cho χάρισμα mang nghĩa đặc thù về chức vụ hay hiện tượng ân tứ hay không
  choice: ân tứ
  alternative: ân tứ thuộc linh; khả năng phục vụ được ban
  rationale: Ngữ cảnh có thể nói đến một khả năng hay sự trang bị cho chức vụ, nhưng câu Hy Lạp không xác định cụ thể; vì vậy không thu hẹp nghĩa.
- issue: Mối liên hệ của lời tiên tri với việc ban ân tứ
  choice: qua lời tiên tri
  alternative: qua sự nói tiên tri; cùng với lời tiên tri
  rationale: Cách dùng διά có thể trình bày lời tiên tri như phương tiện, trong khi ngữ cảnh cũng cho phép hiểu lời ấy đi kèm sự ban cho. Bản dịch chính giữ cách diễn đạt súc tích và chú thích nêu rõ độ mở này.
- issue: Bản chất của πρεσβυτέριον
  choice: hội đồng trưởng lão
  alternative: tập thể trưởng lão; ban trưởng lão
  rationale: Từ này nói đến một tập thể trưởng lão. “Hội đồng trưởng lão” truyền đạt nghĩa tập thể mà không áp đặt một mô hình quản trị giáo hội về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cách xưng hô “con” phù hợp quan hệ mục vụ trong thư. Tránh thuật ngữ riêng của một hệ phái và không xác định quá mức bản chất của ân tứ.
