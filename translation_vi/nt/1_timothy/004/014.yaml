  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh συνεχ diễn của μὴ ἀμέλει, giữ được vị trí của ân tứ “trong con,” thể bị động không nêu rõ Đấng ban, quan hệ “qua lời tiên tri,” và sự đặt tay của tập thể trưởng lão. Tuy nhiên, “sao nhãng ân tứ” kém tự nhiên hơn cách nói thông dụng “lơ là ân tứ.”
  naturalness: “Đừng lơ là” là cách diễn đạt tiếng Việt hiện đại, trang trọng và tự nhiên hơn “Đừng sao nhãng” trong ngữ cảnh này. Bỏ từ nối “là” trước mệnh đề quan hệ giúp câu bớt lặp và sát cấu trúc bổ nghĩa của ὃ ἐδόθη hơn.
