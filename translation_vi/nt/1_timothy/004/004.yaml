id: 1TI.4.4
reference: 1 Timothy 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: vi
  text: Vì mọi vật do Đức Chúa Trời tạo nên đều tốt lành[a], và không gì là đáng bị loại bỏ nếu được tiếp nhận với sự cảm tạ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi tạo vật của Đức Chúa Trời đều tốt lành.” Từ Hy Lạp κτίσμα có thể chỉ một sinh vật hoặc, rộng hơn, bất cứ vật gì được tạo nên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không gì là đáng bị loại bỏ khi được tiếp nhận với sự cảm tạ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ nêu lý do giải thích cho lời trước đó; “Vì” tự nhiên trong tiếng Việt và giữ được quan hệ lập luận.
- source_word: πᾶν κτίσμα θεοῦ
  choice: mọi vật Đức Chúa Trời tạo nên
  rationale: Cách diễn đạt phân phối, tự nhiên, chỉ mọi sự vật được Đức Chúa Trời tạo dựng; không thu hẹp κτίσμα thành sinh vật hay riêng thức ăn.
- source_word: καλόν
  choice: tốt đẹp
  rationale: Diễn đạt phẩm chất tốt lành của công trình sáng tạo và gợi âm hưởng ngôn ngữ sáng tạo trong Kinh Thánh.
- source_word: οὐδὲν ἀπόβλητον
  choice: không gì phải bị loại bỏ
  rationale: Giữ tính tuyệt đối của οὐδὲν và chuyển tính từ ἀπόβλητον thành cách nói tự nhiên trong tiếng Việt.
- source_word: μετὰ εὐχαριστίας
  choice: với lòng biết ơn
  rationale: Diễn đạt tự nhiên thái độ cảm tạ; trong văn cảnh, lòng biết ơn hướng về Đức Chúa Trời.
- source_word: λαμβανόμενον
  choice: nếu được tiếp nhận
  rationale: Chuyển phân từ bị động thành mệnh đề điều kiện tự nhiên, đồng thời không xác định thêm đối tượng hay cách sử dụng ngoài điều nguyên văn nói.
theological_decisions:
- issue: Phạm vi của κτίσμα trong văn cảnh nói về thức ăn
  choice: mọi vật Đức Chúa Trời tạo nên
  alternative: mọi sinh vật của Đức Chúa Trời; mọi thức ăn Đức Chúa Trời tạo nên
  rationale: Nguyên văn rộng hơn riêng thức ăn hay sinh vật. Bản dịch giữ nguyên nguyên tắc về công trình sáng tạo mà tác giả áp dụng vào văn cảnh thức ăn, không đưa cách giải thích hẹp vào chính văn.
- issue: Sắc thái của λαμβανόμενον đi với μετὰ εὐχαριστίας
  choice: nếu được tiếp nhận với lòng biết ơn
  alternative: khi được tiếp nhận với lòng biết ơn; được tiếp nhận với lòng biết ơn
  rationale: “Nếu” thể hiện cách hiểu điều kiện hợp lý của phân từ trong văn cảnh nhưng chú thích vẫn bảo lưu khả năng hiểu theo hoàn cảnh/thời điểm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” được dùng nhất quán cho θεός; “tạo nên” tự nhiên hơn danh hóa “sự sáng tạo” trong cấu trúc này. Dấu phẩy cuối câu được giữ vì câu nguồn là phần đầu nối sang câu kế tiếp.
