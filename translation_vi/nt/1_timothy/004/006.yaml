id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: vi
  text: Nếu con trình bày những điều ấy cho anh chị em[a], con sẽ là một người phục vụ tốt của Đấng Mê-si-a Giê-su[b], được nuôi dưỡng bằng những lời của đức tin[c] và của giáo huấn tốt lành mà con đã noi theo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “các anh em”; trong ngữ cảnh này, từ Hy Lạp có thể chỉ chung các tín hữu, gồm cả nam lẫn nữ.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ Giê-su.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a,” tức Đấng Được Xức Dầu.'
    reason: lexical_alternative
  - marker: c
    text: Cụm này cũng có thể hiểu là “những lời thuộc về đức tin”; “đức tin” ở đây có lẽ chỉ nội dung niềm tin được cộng đồng nhìn nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ὑποτιθέμενος
  choice: Nếu con trình bày những điều ấy
  rationale: Phân từ mang sắc thái điều kiện/phương tiện trong lời khuyên; “trình bày” diễn đạt tự nhiên ý đặt các điều này trước cộng đồng mà không thu hẹp thành ra lệnh.
- source_word: τοῖς ἀδελφοῖς
  choice: cho anh chị em
  rationale: ἀδελφοί là giống đực số nhiều nhưng trong cách xưng hô cộng đồng Cơ Đốc thường bao gồm cả nam lẫn nữ; tiếng Việt tự nhiên biểu đạt phạm vi ấy bằng “anh chị em”.
- source_word: καλὸς ... διάκονος
  choice: một đầy tớ tốt
  rationale: διάκονος ở đây mô tả vai trò phục vụ, không nhất thiết là chức vụ chấp sự; καλός đánh giá phẩm chất phục vụ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: của Đấng Mê-si-a Jêsus
  rationale: Χριστός giữ nghĩa tước hiệu “Đấng Mê-si-a”; Ἰησοῦ được phiên âm theo dạng tên quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐντρεφόμενος
  choice: được nuôi dưỡng
  rationale: Giữ hình ảnh nuôi dưỡng và sắc thái thụ động của sự đào luyện liên tục.
- source_word: τοῖς λόγοις τῆς πίστεως
  choice: bằng những lời của đức tin
  rationale: Dative được hiểu theo phương tiện; giữ λόγοις là “những lời” và τῆς πίστεως là “đức tin”, đồng thời không loại bỏ khả năng cụm này nói đến nội dung đức tin.
- source_word: τῆς καλῆς διδασκαλίας
  choice: của sự dạy dỗ tốt lành
  rationale: Giữ cấu trúc song song với “của đức tin”; “sự dạy dỗ tốt lành” phản ánh cả danh từ διδασκαλία và tính từ καλῆς mà không diễn giải thành “lành mạnh”.
- source_word: ᾗ παρηκολούθηκας
  choice: mà con đã noi theo
  rationale: Đại từ quan hệ gần nhất quy chiếu về “sự dạy dỗ tốt lành”; “noi theo” bao hàm việc theo sát và gắn bó với sự dạy dỗ ấy.
theological_decisions:
- issue: Phạm vi của τοῖς ἀδελφοῖς
  choice: anh chị em
  alternative: các anh em
  rationale: Trong ngữ cảnh hội chúng, danh từ số nhiều giống đực có thể chỉ toàn thể các tín hữu. Bản dịch chính dùng cách nói tự nhiên và chính xác về phạm vi trong tiếng Việt, còn chú thích bảo lưu hình thức sát chữ.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Dịch ý nghĩa tước hiệu thay vì coi Χριστός đơn thuần như một phần của tên riêng; dạng truyền thống được ghi chú.
- issue: Ý nghĩa τῆς πίστεως
  choice: của đức tin
  alternative: thuộc về đức tin
  rationale: Cụm có thể chỉ những lời phát xuất từ đức tin hoặc nội dung đức tin được nhìn nhận. Bản chính giữ cấu trúc mơ hồ, chú thích nêu khả năng khách quan.
- issue: Phạm vi quy chiếu của ᾗ
  choice: sự dạy dỗ tốt lành mà con đã noi theo
  alternative: đức tin và sự dạy dỗ tốt lành mà con đã noi theo
  rationale: Giống và số của đại từ quan hệ phù hợp trực tiếp với danh từ gần nhất διδασκαλία, nhưng về ý nghĩa có thể liên hệ với cả cụm song song; không mở rộng rõ ràng trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cách xưng hô “con” phù hợp lời Phao-lô nói với Ti-mô-thê; giữ hình ảnh “được nuôi dưỡng” và sự song song của hai cụm sở hữu. Tất cả dấu chú thích [a]–[c] đều xuất hiện trong chính văn.
