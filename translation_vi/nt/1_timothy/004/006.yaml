    rationale: Trong tiếng Việt hiện đại, «đầy tớ» thường gợi địa vị gia nhân hoặc nô lệ. διάκονος ở đây là mô tả người phục vụ/chức vụ phục vụ, chưa xác định chức danh «chấp sự». «Người phục vụ» sát nghĩa chức năng hơn mà không thêm nghĩa chức vụ.
  - severity: low
    issue: Cách viết «Jêsus»
    rationale: «Giê-su» là dạng phiên âm hiện đại tiêu chuẩn và tự nhiên hơn trong tiếng Việt phổ thông hiện nay.
  - severity: low
    issue: «sự dạy dỗ tốt lành»
    rationale: Cụm này hơi nặng trong văn phong hiện đại. «Giáo huấn tốt lành» chuyển tải διδασκαλία và καλῆς rõ ràng, trang trọng, tự nhiên hơn.
