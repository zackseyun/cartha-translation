id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: vi
  text: Đừng để ai coi thường con vì con còn trẻ; nhưng hãy làm gương cho các tín hữu trong lời nói, trong cách sống, trong tình yêu thương, trong đức tin[a] và trong sự trong sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự trung tín”. Từ Hy Lạp ở đây có thể chỉ đức tin hoặc sự trung tín.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: Đừng để ai coi thường
  rationale: Diễn đạt tự nhiên sắc thái mệnh lệnh ngăn cấm; καταφρονέω chỉ việc xem thường hoặc khinh miệt.
- source_word: σου τῆς νεότητος
  choice: con vì con còn trẻ
  rationale: Trong tiếng Việt, cách nói này tự nhiên hơn lối dịch sát 'tuổi trẻ của con' và vẫn giữ đúng lý do khiến Ti-mô-thê có thể bị xem thường.
- source_word: τύπος γίνου
  choice: hãy làm gương
  rationale: τύπος ở đây là mẫu mực để người khác noi theo; 'làm gương' là cách diễn đạt rõ ràng, hiện đại cho mệnh lệnh γίνου.
- source_word: τῶν πιστῶν
  choice: cho các tín hữu
  rationale: Chỉ cộng đồng những người tin mà Ti-mô-thê phải làm gương cho họ.
- source_word: ἐν λόγῳ
  choice: trong lời nói
  rationale: λόγος trong danh sách phẩm chất này nói đến lời ăn tiếng nói.
- source_word: ἐν ἀναστροφῇ
  choice: trong cách sống
  rationale: ἀναστροφή chỉ cách cư xử hay nếp sống; 'cách sống' tự nhiên và bao quát.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Diễn đạt phẩm chất ἀγάπη bằng cách nói quen thuộc, rõ nghĩa trong tiếng Việt.
- source_word: ἐν πίστει
  choice: trong đức tin
  rationale: πίστις có thể chỉ đức tin hoặc sự trung tín; bản chính giữ nghĩa thông dụng 'đức tin', còn nghĩa kia được ghi chú.
- source_word: ἐν ἁγνείᾳ
  choice: trong sự trong sạch
  rationale: ἁγνεία nói đến sự thanh sạch về luân lý, có thể bao gồm phương diện tính dục; cách dịch rộng này tránh thu hẹp nghĩa quá mức.
theological_decisions:
- issue: Ý nghĩa của πίστις trong danh sách phẩm chất
  choice: đức tin
  alternative: sự trung tín
  rationale: Ngữ cảnh có thể nói đến lòng tin hoặc phẩm chất đáng tin, trung thành. Bản chính không quyết đoán theo một cách hiểu riêng; nghĩa thay thế được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ 'con' phản ánh quan hệ mục vụ của Phao-lô với Ti-mô-thê; cấu trúc lặp 'trong...' giữ nhịp của nguyên văn. Dấu chấm phẩy làm rõ sự tương phản giữa mệnh lệnh phủ định và lời kêu gọi tích cực.
