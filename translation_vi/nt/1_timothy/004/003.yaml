id: 1TI.4.3
reference: 1 Timothy 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: vi
  text: họ cấm kết hôn và buộc người ta kiêng các thức ăn mà Đức Chúa Trời đã tạo dựng để những người tin và đã nhận biết chân lý dùng với lòng tạ ơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nguyên văn hơn: “cấm kết hôn và kiêng các thức ăn.” Bản dịch chính làm rõ rằng các giáo sư giả buộc người ta kiêng một số thức ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: họ cấm
  rationale: Phân từ hiện tại tiếp tục mô tả những người ở câu trước; “cấm” diễn đạt trực tiếp hành vi ngăn cấm.
- source_word: γαμεῖν
  choice: kết hôn
  rationale: Động từ nguyên mẫu có nghĩa là “lấy vợ, lấy chồng”; “kết hôn” tự nhiên, trang trọng và không giới hạn giới tính của chủ thể.
- source_word: ἀπέχεσθαι βρωμάτων
  choice: buộc người ta kiêng các thức ăn
  rationale: Về mặt hình thức là “kiêng các thức ăn”; vì κωλυόντων không thể tự nhiên chi phối ý này theo nghĩa “cấm kiêng”, ngữ cảnh cho thấy các giáo sư giả áp đặt việc kiêng ăn. Bản dịch làm rõ lực mệnh lệnh vốn được hàm ý.
- source_word: ἃ ὁ θεὸς ἔκτισεν
  choice: mà Đức Chúa Trời đã tạo dựng
  rationale: “Tạo dựng” giữ được sắc thái sáng tạo của κτίζω và đại từ quan hệ liên kết trực tiếp với các thức ăn.
- source_word: εἰς μετάλημψιν
  choice: để ... dùng
  rationale: Cụm từ chỉ mục đích; trong ngữ cảnh thức ăn, “dùng” là cách nói tự nhiên cho việc tiếp nhận hoặc hưởng dùng.
- source_word: μετὰ εὐχαριστίας
  choice: với lòng tạ ơn
  rationale: Diễn đạt tự nhiên hành vi đón nhận thức ăn trong thái độ cảm tạ Đức Chúa Trời.
- source_word: τοῖς πιστοῖς
  choice: những người tin
  rationale: Ở đây πιστοῖς tự nhiên nhất là danh xưng chỉ người tin, thay vì phẩm chất “trung tín”.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: đã nhận biết chân lý
  rationale: Thì hoàn thành diễn tả việc đã đi đến chỗ nhận biết và đang ở trong trạng thái ấy; tiếng Việt có thể diễn đạt gọn bằng “đã nhận biết”.
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν chỉ một nhóm hay hai nhóm
  choice: 'Một nhóm được mô tả bằng hai đặc điểm: những người tin và đã nhận biết chân lý'
  alternative: 'Hai nhóm: những người tin và những người đã nhận biết chân lý'
  rationale: Mạo từ chung cùng cấu trúc phối hợp tự nhiên nhất quy hai mô tả về cùng một nhóm; bản dịch không tạo ra hai hạng người riêng biệt.
- issue: Quan hệ cú pháp của ἀπέχεσθαι với κωλυόντων
  choice: Làm rõ rằng các giáo sư giả buộc người ta kiêng thức ăn
  alternative: 'Dịch sát hình thức: “cấm kết hôn và kiêng các thức ăn”'
  rationale: Nguyên văn bị tỉnh lược và nếu coi κωλυόντων chi phối cả hai động từ nguyên mẫu thì sẽ tạo nghĩa bất hợp ngữ cảnh là “cấm kiêng thức ăn”. Cách dịch chính nêu rõ lực áp đặt được ngữ cảnh hàm ý, đồng thời chú thích bảo lưu hình thức Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong tiếng Việt Cơ Đốc; “chân lý” giữ sắc thái thần học nhưng vẫn thông dụng. Đại từ “họ” nối tự nhiên với chủ thể được mô tả từ câu trước.
