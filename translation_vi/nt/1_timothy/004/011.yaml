  text: Command these things and teach them[a].
translation:
  language: vi
  text: Hãy truyền lệnh về những điều này[a] và dạy dỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Hãy chỉ thị về những điều này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράγγελλε
  choice: Hãy truyền dạy
  rationale: Động từ mệnh lệnh hiện tại ngôi hai số ít mang sắc thái đưa ra chỉ thị có thẩm quyền và hàm ý hành động tiếp diễn. “Truyền dạy” giữ được sức nặng ấy mà vẫn tự nhiên trong văn cảnh mục vụ.
- source_word: ταῦτα
  choice: những điều này
  rationale: Đại từ chỉ định trung tính số nhiều quy chiếu về các lời dạy hoặc chỉ dẫn vừa nêu trước đó; cách dịch này giữ rõ ý số nhiều.
- source_word: καὶ
  choice: và
  rationale: Liên từ phối hợp đơn giản nối hai mệnh lệnh.
- source_word: δίδασκε
  choice: dạy dỗ họ
  rationale: Động từ mệnh lệnh hiện tại diễn tả việc dạy liên tục. “Họ” là tân ngữ được hiểu ngầm, chỉ những người nhận sự dạy dỗ; thêm từ này giúp câu tiếng Việt tự nhiên mà không thay đổi nội dung.
theological_decisions:
- issue: Thẩm quyền mục vụ hàm chứa trong Παράγγελλε
  choice: Dịch là “Hãy truyền dạy” để giữ sắc thái chỉ thị có thẩm quyền.
  alternative: “Hãy chỉ dẫn” hoặc “Hãy căn dặn”
  rationale: Nguyên văn dùng hai động từ mệnh lệnh, trong đó παραγγέλλω mạnh hơn lời khuyên đơn thuần. Cách dịch giữ sức nặng của câu nhưng không suy diễn thêm về cơ cấu hay phạm vi thẩm quyền trong Hội Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Truyền dạy” thể hiện tính có thẩm quyền; “dạy dỗ” phân biệt nhẹ hai động từ gần nghĩa trong nguyên văn. Dấu chú thích [a] được đặt trong chính văn.
