id: 1TI.4.13
reference: 1 Timothy 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: vi
  text: Cho đến khi tôi đến, hãy chuyên tâm vào việc đọc công khai[a], khuyên bảo và dạy dỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “việc đọc Kinh Thánh.” Tiếng Hy Lạp chỉ nói “việc đọc,” nhưng trong bối cảnh này, nhiều khả năng chỉ việc công khai đọc Kinh Thánh trong hội chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Cho đến khi tôi đến
  rationale: Diễn đạt tự nhiên giới hạn thời gian kéo dài cho đến lúc Phao-lô đến, đồng thời giữ ngôi thứ nhất và sắc thái hướng tới tương lai của ἔρχομαι.
- source_word: πρόσεχε
  choice: hãy chuyên tâm vào
  rationale: Mệnh lệnh này đòi hỏi sự chú tâm và tận tụy liên tục, mạnh hơn ý chỉ đơn thuần 'chú ý'.
- source_word: τῇ ἀναγνώσει
  choice: việc đọc công khai
  rationale: ἀνάγνωσις tự thân nghĩa là 'việc đọc'; trong bối cảnh sinh hoạt hội chúng, nhiều khả năng là việc đọc trước công chúng. Bản dịch không thêm tân ngữ 'Kinh Thánh' vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: τῇ παρακλήσει
  choice: khuyên bảo
  rationale: παράκλησις có thể chỉ sự khích lệ, kêu gọi hoặc khuyên nhủ. Trong chuỗi nhiệm vụ phục vụ gồm đọc, khuyên bảo và dạy dỗ, 'khuyên bảo' giữ được sắc thái mục vụ và thúc giục hành động.
- source_word: τῇ διδασκαλίᾳ
  choice: dạy dỗ
  rationale: Diễn đạt rõ ràng hoạt động giảng dạy, tránh thu hẹp từ này thành một hệ thống 'giáo lý' đã được định hình.
theological_decisions:
- issue: Có nên nói rõ ἀνάγνωσις là việc đọc Kinh Thánh trong chính văn hay không
  choice: việc đọc công khai
  alternative: việc đọc Kinh Thánh
  rationale: Bối cảnh phục vụ hội chúng khiến việc đọc Kinh Thánh công khai rất có khả năng là ý được nói đến, nhưng nguyên văn chỉ nói 'việc đọc'. Chính văn giữ đối tượng không được nêu rõ, còn chú thích trình bày cách hiểu cụ thể hơn.
- issue: Sắc thái của παράκλησις
  choice: khuyên bảo
  alternative: khích lệ
  rationale: Từ Hy Lạp chứa cả sắc thái khích lệ lẫn khuyên nhủ/thúc giục. 'Khuyên bảo' phù hợp với chuỗi chỉ dẫn mục vụ nhưng không phủ nhận sắc thái khích lệ của từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'chuyên tâm' để thể hiện sự chú tâm bền bỉ; giữ ba nhiệm vụ song song, gọn và tự nhiên.
