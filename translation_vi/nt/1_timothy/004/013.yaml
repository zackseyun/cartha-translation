  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc và ý nghĩa của nguyên văn: mốc thời gian “cho đến khi tôi đến,” mệnh lệnh συνεχ tục của πρόσεχε, và ba lĩnh vực có mạo từ song song là đọc, khuyên bảo, dạy dỗ. “Việc đọc công khai” diễn đạt hợp lý ἀνάγνωσις trong bối cảnh mà không thêm trực tiếp đối tượng “Kinh Thánh” vào chính văn.'
