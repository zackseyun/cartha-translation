  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: vi
  text: Hãy chuyên tâm thực hành những điều ấy; hãy dốc lòng vào những điều ấy[a], để sự tiến bộ của con được mọi người thấy rõ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hãy ở trong những điều ấy”; cách nói này diễn tả sự dấn thân trọn vẹn. Cũng có thể dịch: “hãy hoàn toàn chuyên tâm vào những điều ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Đại từ chỉ định số nhiều quy chiếu về các lời chỉ dạy ngay trước đó; cách dịch này tự nhiên và không thu hẹp phạm vi.
- source_word: μελέτα
  choice: hãy chuyên tâm thực hành
  rationale: Động từ có thể chỉ việc chuyên chú suy xét và kiên trì thực hiện. Trong ngữ cảnh các bổn phận mục vụ, cụm này diễn đạt cả sự chú tâm lẫn việc áp dụng đều đặn.
- source_word: ἐν τούτοις ἴσθι
  choice: hãy sống hết mình trong những điều ấy
  rationale: Nguyên văn là “hãy ở trong những điều ấy,” diễn tả sự dấn thân sâu xa và trọn vẹn. Cách nói tiếng Việt này giữ hình ảnh “trong” đồng thời dễ hiểu.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên sắc thái mục đích hoặc kết quả của liên từ Hy Lạp mà không ép phải phân biệt tuyệt đối hai sắc thái.
- source_word: σου ἡ προκοπή
  choice: sự tiến bộ của con
  rationale: προκοπή chỉ sự tiến triển hay tiến bộ. “Của con” phản ánh đại từ ngôi thứ hai số ít trong quan hệ Phao-lô nói với Ti-mô-thê.
- source_word: φανερὰ ᾖ πᾶσιν
  choice: được mọi người thấy rõ
  rationale: Diễn đạt tính công khai, hiển nhiên của sự tiến bộ đối với tất cả những người trong tầm nhìn của câu.
theological_decisions:
- issue: Phạm vi sự tiến bộ của Ti-mô-thê
  choice: Giữ nghĩa rộng, bao gồm sự trưởng thành và tiến triển trong những bổn phận vừa được truyền dạy.
  alternative: Chỉ sự trưởng thành thuộc linh hoặc chỉ hiệu quả trong chức vụ.
  rationale: Ngữ cảnh bao gồm lời dạy, cách sống và sự tận tâm; danh từ προκοπή không tự giới hạn vào riêng một phương diện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo quan hệ thân tình giữa Phao-lô và Ti-mô-thê trong thư; giữ sắc thái mệnh lệnh bằng “hãy” và duy trì hình ảnh “trong” của nguyên văn qua câu chính cùng chú thích.
