  rationale: Chỉnh một cụm thành ngữ để bản dịch tự nhiên hơn trong tiếng Việt hiện đại và sát hơn với sắc thái dấn thân trọn vẹn của ἐν τούτοις ἴσθι. Các thành phần còn lại giữ nguyên vì đã phản ánh đầy đủ mệnh lệnh, mục đích và phạm vi rộng của “sự tiến bộ”.
