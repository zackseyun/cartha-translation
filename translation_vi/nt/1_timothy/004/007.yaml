id: 1TI.4.7
reference: 1 Timothy 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: vi
  text: Nhưng hãy khước từ những chuyện hoang đường phàm tục, kiểu các bà già[a]; hãy rèn luyện chính mình để sống tin kính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “những chuyện hoang đường mang tính chất của các bà già,” một lối nói mang sắc thái miệt thị; cũng có thể dịch khái quát là “những chuyện nhảm nhí.”
    reason: Giải thích hình ảnh văn hóa và sắc thái miệt thị của γραώδεις, đồng thời ghi nhận một cách dịch khái quát hơn.
lexical_decisions:
- source_word: βεβήλους
  choice: phàm tục
  rationale: Giữ sự đối lập với điều thánh thiêng và diễn đạt tính bất kính của từ Hy Lạp mà không mở rộng thành nghĩa 'vô thần'.
- source_word: γραώδεις
  choice: kiểu chuyện của các bà già
  rationale: Phản ánh trực tiếp hình ảnh mang sắc thái miệt thị trong nguyên ngữ, đồng thời tự nhiên hơn một tính từ ghép gượng ép trong tiếng Việt.
- source_word: μύθους
  choice: chuyện hoang đường
  rationale: Chỉ những câu chuyện hư cấu hoặc suy đoán; cách nói này tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: παραιτοῦ
  choice: hãy khước từ
  rationale: Diễn đạt mệnh lệnh dứt khoát phải từ chối, không tiếp nhận hay dính líu đến các chuyện ấy.
- source_word: γύμναζε
  choice: hãy rèn luyện
  rationale: Giữ ẩn dụ luyện tập, có thể gợi việc tập luyện thể chất, và phù hợp với hành động có chủ đích, bền bỉ.
- source_word: σεαυτόν
  choice: chính mình
  rationale: Thể hiện rõ đại từ phản thân, nhấn mạnh Ti-mô-thê là người phải tự rèn luyện.
- source_word: πρὸς εὐσέβειαν
  choice: để sống tin kính
  rationale: πρός diễn tả mục tiêu; εὐσέβεια trong các Thư Mục vụ chỉ đời sống kính sợ và hướng về Đức Chúa Trời. Thêm 'sống' giúp tiếng Việt tự nhiên mà không thu hẹp nghĩa thành nghi lễ.
- source_word: δὲ
  choice: Nhưng ...; hãy
  rationale: δὲ thứ nhất đánh dấu sự tương phản với văn cảnh trước; δὲ thứ hai chuyển sang mệnh lệnh tích cực đối ứng, được thể hiện tự nhiên bằng dấu chấm phẩy thay vì lặp lại liên từ.
theological_decisions:
- issue: Cách dịch cụm từ mang sắc thái miệt thị γραώδεις μύθους
  choice: Giữ hình ảnh cụ thể là 'kiểu chuyện của các bà già' trong chính văn và đặt lời giải thích ở chú thích.
  alternative: '''chuyện nhảm nhí'' hoặc ''chuyện vớ vẩn'''
  rationale: Nguyên ngữ dùng một cách nói có dấu ấn văn hóa và sắc thái miệt thị. Dịch khái quát thành 'nhảm nhí' sẽ làm mất hình ảnh cụ thể; chú thích giúp độc giả nhận biết sắc thái tu từ ấy mà không coi đó là một nhận định phổ quát về phụ nữ lớn tuổi.
- issue: Ý nghĩa của εὐσέβεια
  choice: '''sống tin kính'''
  alternative: '''lòng mộ đạo'' hoặc ''sự đạo đức'''
  rationale: Cách dịch được chọn giữ chiều kích hướng về Đức Chúa Trời và cách sống tương ứng, tránh khiến từ này chỉ được hiểu là nghi thức tôn giáo hoặc phẩm hạnh luân lý nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. 'Khước từ' giữ lực của mệnh lệnh; 'rèn luyện' bảo toàn ẩn dụ tập luyện. Cụm từ khó γραώδεις được dịch khá sát trong chính văn nhưng có chú thích để tránh che khuất sắc thái văn hóa và tu từ của nguyên ngữ.
