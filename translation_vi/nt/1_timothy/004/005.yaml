  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc và ý nghĩa của câu Hy Lạp: γάρ là lời giải thích (“vì”), ἁγιάζεται ở hiện tại bị động là “được thánh hóa”, διά với sở hữu cách diễn tả phương tiện (“nhờ”), và hai phương tiện là “lời Đức Chúa Trời” cùng “lời cầu nguyện”. Cách dùng “nó” có tiền ngữ rõ ràng là thức ăn ở câu trước. Bản dịch không thu hẹp hoặc giải thích quá mức phạm vi của sự thánh hóa.'
  naturalness: “Vì nó được thánh hóa nhờ lời Đức Chúa Trời và lời cầu nguyện” là tiếng Việt hiện đại, trang trọng, mạch lạc và phù hợp văn phong Kinh Thánh. “Lời cầu nguyện” tự nhiên trong ngữ cảnh, dù về mặt hình thức có thể dùng “sự cầu nguyện”; lựa chọn hiện tại không gây tối nghĩa.
  terminology: “Được thánh hóa” bảo toàn sắc thái thuật ngữ và thể bị động của ἁγιάζεται mà không áp đặt cách hiểu bí tích hay cứu rỗi. “Lời Đức Chúa Trời” là cách gọi Kinh Thánh quen thuộc và vẫn để ngỏ quy chiếu chính xác của λόγος θεοῦ. Chú thích b thích đáng khi ghi nhận các khả năng “cầu thay” và “cầu xin” của ἐντεύξις.
