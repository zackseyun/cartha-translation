reference: 1 Timothy 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: vi
  text: vì nó được thánh hóa nhờ lời Đức Chúa Trời và lời cầu nguyện[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được làm nên thánh.”'
    reason: lexical_alternative
  - marker: b
    text: Từ này cũng có thể mang nghĩa “lời cầu thay” hoặc “lời cầu xin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: được thánh hóa
  rationale: Động từ hiện tại, thể bị động; cách dịch này giữ nguyên hình ảnh thánh hóa và không tự ý giải thích cụ thể hơn ý nghĩa của việc thức ăn được biệt riêng để sử dụng.
- source_word: γὰρ
  choice: vì
  rationale: Diễn đạt tự nhiên quan hệ giải thích, nêu lý do cho lời khẳng định ở câu trước.
- source_word: διὰ
  choice: nhờ
  rationale: Với sở hữu cách, giới từ này chỉ phương tiện; “nhờ” tự nhiên trong tiếng Việt và giữ được ý nghĩa phương tiện.
- source_word: λόγου θεοῦ
  choice: lời Đức Chúa Trời
  rationale: 'Giữ cách diễn đạt quen thuộc và để ngỏ phạm vi chính xác của “lời”: lời tuyên bố trong Kinh Thánh, lời phán của Đức Chúa Trời, hay sự chuẩn nhận của Ngài trong nghĩa rộng hơn.'
- source_word: ἐντεύξεως
  choice: lời cầu nguyện
  rationale: Trong bối cảnh nhận thức ăn với lòng tạ ơn, cách dịch rộng này rõ ràng và tự nhiên; những nghĩa cụ thể hơn như cầu thay hoặc cầu xin được ghi ở chú thích.
theological_decisions:
- issue: Phạm vi ý nghĩa của ngôn ngữ thánh hóa trong văn cảnh
  choice: Giữ “được thánh hóa”, để văn cảnh cho thấy đối tượng là thức ăn được biệt riêng và được tiếp nhận cách thích hợp.
  alternative: Diễn giải trực tiếp là “được biệt riêng để dùng” hoặc hiểu theo nghĩa thánh hóa tôn giáo rộng hơn.
  rationale: Văn cảnh ngay trước đó nói về thức ăn được nhận với lòng tạ ơn. Bản dịch giữ thuật ngữ thánh hóa nhưng không thêm vào câu những khẳng định về bí tích, sự thanh tẩy đạo đức hay sự cứu rỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “nó” nối tự nhiên với thức ăn được nói đến trong văn cảnh trước; “được thánh hóa” giữ sát thể bị động và sắc thái thần học của nguyên ngữ.
