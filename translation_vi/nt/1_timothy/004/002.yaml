    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: bởi
  rationale: Trong mối liên hệ với mệnh đề trước, ἐν chỉ phương tiện hay tác nhân trung gian. “Bởi” diễn đạt tự nhiên ý này mà không biến cụm từ thành một mệnh đề độc lập.
- source_word: ὑποκρίσει
  choice: sự giả hình
  rationale: “Sự giả hình” là cách diễn đạt quen thuộc, trực tiếp cho thái độ giả dối hoặc đóng vai đạo đức mà ὑπόκρισις nói đến.
- source_word: ψευδολόγων
  choice: của những kẻ nói dối
  rationale: Danh từ sở hữu số nhiều bổ nghĩa tự nhiên cho “sự giả hình”; cách dịch này vừa rõ nghĩa vừa giữ sắc thái chỉ những người có đặc tính nói điều giả dối.
- source_word: κεκαυστηριασμένων
  choice: bị sắt nung đốt
  rationale: Động từ gợi hình ảnh dùng sắt nung để đốt, có thể bao hàm việc đóng dấu hoặc làm chai lì. Cách dịch giữ hình ảnh cụ thể và trạng thái kéo dài của phân từ hoàn thành bị động mà không buộc người đọc chỉ hiểu theo một hướng.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: chính lương tâm mình
  rationale: “Chính” bảo toàn sắc thái nhấn mạnh của ἰδίαν; “mình” quy chiếu phân phối về từng kẻ nói dối, còn “lương tâm” giữ số ít như bản Hy Lạp.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của κεκαυστηριασμένων
  choice: Giữ hình ảnh “bị sắt nung đốt” mà không khẳng định rõ đó là đóng dấu hay làm mất cảm giác.
  alternative: “bị đóng dấu trên chính lương tâm mình” hoặc “có lương tâm bị đốt đến chai lì”
  rationale: Hình ảnh Hy Lạp có thể gợi một dấu đóng bằng sắt nung hoặc sự đốt làm lương tâm trở nên mất cảm giác. Bản dịch chính không xác quyết tình trạng ấy là sự chai lì không thể đảo ngược, nhờ đó tránh đưa thêm một kết luận thần học mà câu văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “bởi sự giả hình” được giữ như phần tiếp nối cú pháp của câu trước; không thêm chủ ngữ hay động từ chính vốn không có trong đơn vị nguồn được cung cấp.
