    rationale: Tiếng Việt không thường dùng “sắt nung đốt” theo cấu trúc này. Nó khiến người đọc không rõ sắt nung là công cụ để đóng dấu hay chỉ là một hình ảnh đốt cháy, dù chính sự mơ hồ này cần được bảo tồn ở mức ngữ nghĩa.
