  verdict: revise
  source_fidelity: Bản nháp giữ đúng quan hệ phương tiện của ἐν (“bởi”), ý “sự giả hình của những kẻ nói dối,” và sự nhấn mạnh “lương tâm của chính mình.” Tuy nhiên, “có chính lương tâm mình bị sắt nung đốt” không phải là một cách diễn đạt Việt ngữ tự nhiên; đồng thời nó làm hình ảnh καυστηριάζω khó hiểu. Cách sửa giữ hình ảnh bị động hoàn thành về một lương tâm đã ở trong trạng thái bị tác động, mà không quyết định dứt khoát giữa sắc thái đóng dấu và làm chai lì.
  naturalness: “Lương tâm của chính mình đã bị thiêu đốt” tự nhiên, trang trọng và dễ đọc hơn. Việc lặp “những kẻ” phản ánh chức năng bổ sung của phân từ Hy Lạp mà vẫn phù hợp với một cụm tiếp nối câu trước.
  terminology: “Sự giả hình,” “những kẻ nói dối,” và “lương tâm” đều là các thuật ngữ chuẩn, hiện đại và đúng ngữ cảnh. “Bị thiêu đốt” bảo toàn hình ảnh mạnh của động từ Hy Lạp; chú thích nêu các khả năng “đóng dấu” và “chai lì” để không áp đặt một diễn giải thần học hay ngữ nghĩa duy nhất.
