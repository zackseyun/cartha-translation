id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: vi
  text: Vì việc rèn luyện thân thể có ích ít nhiều[a], còn sự tin kính có ích về mọi mặt, vì có lời hứa về sự sống hiện nay và sự sống sẽ đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có ích trong một thời gian ngắn.” Cụm từ Hy Lạp có thể chỉ mức độ hạn chế hoặc thời gian ngắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: việc rèn luyện thân thể
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, bao quát việc luyện tập và kỷ luật thể chất, đồng thời giữ rõ nghĩa của tính từ σωματική.
- source_word: πρὸς ὀλίγον
  choice: trong một mức độ nào đó
  rationale: Cụm Hy Lạp có thể chỉ mức độ hạn chế hoặc thời gian ngắn. Ngữ cảnh đối chiếu phạm vi lợi ích khiến cách dịch theo mức độ phù hợp, nhưng chú thích vẫn bảo lưu nghĩa thời gian.
- source_word: ὠφέλιμος
  choice: có ích
  rationale: Cách nói rõ ràng, thông dụng và có thể dùng nhất quán cho cả việc rèn luyện thân thể lẫn lòng tin kính.
- source_word: εὐσέβεια
  choice: lòng tin kính
  rationale: Chỉ thái độ tôn kính Đức Chúa Trời thể hiện trong nếp sống; đây là cách dịch trang trọng nhưng dễ hiểu và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: πρὸς πάντα
  choice: về mọi mặt
  rationale: Truyền đạt phạm vi toàn diện của πάντα bằng tiếng Việt tự nhiên, không hàm ý lòng tin kính là công cụ để đạt mọi mục tiêu tùy ý.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: vì đem lại lời hứa
  rationale: Thể hiện chức năng giải thích của phân từ ἔχουσα và tránh lối dịch cứng 'có lời hứa', dù chủ thể ngầm của lời hứa vẫn không được xác định thêm.
- source_word: ζωῆς τῆς νῦν
  choice: sự sống hiện nay
  rationale: Giữ danh từ ζωή là 'sự sống' và diễn đạt rõ sự tương phản giữa hiện tại với tương lai.
- source_word: τῆς μελλούσης
  choice: sự sống sẽ đến
  rationale: Bổ sung danh từ 'sự sống' vốn được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Phạm vi giá trị của việc rèn luyện thân thể
  choice: Việc rèn luyện thân thể có ích nhưng trong phạm vi hạn chế, trái với lợi ích toàn diện của lòng tin kính.
  alternative: Việc rèn luyện thân thể chỉ có ích trong một thời gian ngắn.
  rationale: πρὸς ὀλίγον thực sự cho phép cả nghĩa mức độ lẫn thời gian. Bản chính chọn nghĩa phạm vi theo thế đối chiếu với πρὸς πάντα, nhưng chú thích bảo lưu nghĩa thời gian và không biến lời so sánh thành sự phủ nhận giá trị của việc luyện thân thể.
- issue: Lời hứa liên quan đến sự sống hiện tại và tương lai
  choice: Lòng tin kính gắn với lời hứa về cả sự sống hiện nay lẫn sự sống sẽ đến.
  alternative: Lòng tin kính tự nó tạo ra hoặc bảo đảm sự sống hiện tại và đời sau.
  rationale: Bản dịch không thêm quan hệ nhân quả hay cơ chế cứu rỗi mà nguyên văn không nói rõ; chỉ giữ mối liên hệ được diễn đạt bằng ἐπαγγελίαν ἔχουσα.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc đối chiếu “còn” để thể hiện μέν/δέ ngầm trong hai vế; tránh từ ngữ quá cổ hoặc mang sắc thái hệ phái.
