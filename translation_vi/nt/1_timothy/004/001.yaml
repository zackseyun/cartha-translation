id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: vi
  text: Nhưng Thánh Linh phán rõ rằng trong những thời kỳ về sau, một số người sẽ lìa bỏ đức tin, chú tâm đến các thần linh lừa dối và những lời dạy của các quỷ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: Thánh Linh
  rationale: Mạo từ cùng ngữ cảnh lời tiên báo trong thư Phao-lô cho thấy danh xưng này tự nhiên nhất chỉ về Đức Thánh Linh; cách viết hoa biểu thị đối tượng được nói đến.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý nhẹ và ở đây có thể giữ bằng “Nhưng”, nối lời cảnh báo này với mạch văn trước mà không tạo tương phản quá mạnh.
- source_word: ῥητῶς
  choice: rõ
  rationale: Diễn đạt lời nói minh nhiên, không mơ hồ, bằng từ ngữ tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ὑστέροις καιροῖς
  choice: trong những thời kỳ về sau
  rationale: Chỉ những giai đoạn đến sau thời điểm hiện tại của tác giả, không nhất thiết giới hạn vào thời kỳ cuối cùng theo nghĩa kỹ thuật.
- source_word: ἀποστήσονταί
  choice: sẽ lìa bỏ
  rationale: Giữ ý rời xa hoặc phản bỏ mà không áp đặt một hệ thống thần học cụ thể về sự bội đạo.
- source_word: τῆς πίστεως
  choice: đức tin
  rationale: Trong ngữ cảnh này, cụm có mạo từ tự nhiên nhất chỉ nội dung đức tin Cơ Đốc được tin nhận, đồng thời tiếng Việt vẫn giữ được phần nào độ rộng nghĩa của πίστις.
- source_word: προσέχοντες
  choice: chú tâm đến
  rationale: Diễn tả việc hướng sự chú ý và nghe theo; phân từ nêu hành vi đi kèm, có thể góp phần giải thích sự lìa bỏ.
- source_word: πνεύμασι πλάνοις
  choice: các thần linh lừa dối
  rationale: πλάνος có thể mang nghĩa lừa dối hoặc dẫn người ta lạc đường; “lừa dối” vừa tự nhiên vừa giữ sắc thái chủ động.
- source_word: διδασκαλίαις δαιμονίων
  choice: những lời dạy của các quỷ
  rationale: Giữ cấu trúc sở hữu/nguồn gốc có chủ ý của nguyên văn, không quyết định quá mức liệu sở hữu cách chỉ nguồn phát sinh hay sự liên hệ.
theological_decisions:
- issue: Đối tượng của Τὸ πνεῦμα
  choice: Đức Thánh Linh, dịch là “Thánh Linh”
  alternative: một linh tiên tri hoặc tâm linh con người
  rationale: Ngữ cảnh thư tín và lời tiên báo khiến Đức Thánh Linh là đối tượng tự nhiên nhất, nhưng câu không xác định phương thức mặc khải.
- issue: Ý nghĩa của τῆς πίστεως
  choice: đức tin theo nghĩa niềm tin/nội dung đức tin Cơ Đốc
  alternative: lòng tin cá nhân hoặc sự trung tín
  rationale: Mạo từ và ngữ cảnh về những lời dạy sai lạc nghiêng về nghĩa khách quan là đức tin được tin nhận, mà không giải quyết thêm các tranh luận giáo lý về sự bội đạo.
- issue: Quan hệ trong διδασκαλίαις δαιμονίων
  choice: “những lời dạy của các quỷ”
  alternative: những lời dạy về các quỷ hoặc những lời dạy mang tính ma quỷ
  rationale: Sở hữu cách có thể chỉ nguồn gốc hoặc sự liên hệ; bản dịch giữ cấu trúc tương đối mở thay vì âm thầm xác định một quan hệ duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thánh Linh” theo lối gọi phổ biến trong tiếng Việt Cơ Đốc; “các quỷ” chuyển δαιμόνια trực tiếp, không dùng thuật ngữ giáo phái. Không thêm dấu chú thích vì bản thảo này không cần chú thích để bảo toàn những dị biệt có ý nghĩa.
