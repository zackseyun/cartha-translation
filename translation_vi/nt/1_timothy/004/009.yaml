  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/009.yaml
  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: vi
  text: Lời này đáng tin cậy và đáng được hoàn toàn đón nhận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lời ấy đáng tin cậy” hoặc “Điều được nói ra là đáng tin cậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: đáng tin cậy
  rationale: Trong công thức πιστὸς ὁ λόγος của các Thư Mục vụ, tính từ này mô tả lời phát biểu là đáng tin và có thể nương cậy; cách dịch này tự nhiên hơn “trung tín” khi nói về một lời phát biểu.
- source_word: ὁ λόγος
  choice: lời này
  rationale: Ở đây λόγος chỉ một lời phát biểu cụ thể trong văn mạch. “Lời này” giữ được tính khái quát của từ Hy Lạp và không buộc phải phân loại đó là châm ngôn hay tuyên bố.
- source_word: πάσης
  choice: hoàn toàn
  rationale: Trong cụm πάσης ἀποδοχῆς, từ này diễn tả mức độ trọn vẹn của sự đón nhận; “hoàn toàn” truyền đạt tự nhiên ý nghĩa toàn thể.
- source_word: ἀποδοχῆς
  choice: đón nhận
  rationale: ἀποδοχή nói đến việc tiếp nhận hay hoan nghênh một điều. “Đón nhận” tự nhiên trong tiếng Việt và tránh sắc thái thiên về phê chuẩn của “chấp thuận”.
- source_word: ἄξιος
  choice: đáng được
  rationale: ἄξιος đi với sở hữu cách mang nghĩa xứng đáng hoặc đáng nhận điều gì; cấu trúc “đáng được … đón nhận” là rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ nhịp công thức của nguyên văn, đồng thời dùng “lời này” để bảo toàn độ rộng nghĩa của λόγος.
