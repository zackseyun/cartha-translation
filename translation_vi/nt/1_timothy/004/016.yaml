reference: 1 Timothy 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: vi
  text: Hãy chú tâm đến chính mình và lời dạy; hãy kiên trì trong những điều ấy.[a] Vì nhờ làm điều này, con sẽ cứu[b] cả chính mình lẫn những người nghe con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy tiếp tục trong những điều ấy” hoặc “hãy bền lòng trong những điều ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “gìn giữ.” Từ Hy Lạp được dịch là “cứu” có thể chỉ việc giải cứu, bảo toàn hoặc cứu rỗi, tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Hãy chú tâm
  rationale: Mệnh lệnh này đòi hỏi sự lưu tâm cẩn thận và liên tục. “Hãy chú tâm” tự nhiên trong tiếng Việt hiện đại và mạnh hơn một hành động để ý thoáng qua.
- source_word: σεαυτῷ
  choice: đến chính mình
  rationale: Đại từ phản thân ở cách dữ chỉ đối tượng mà Ti-mô-thê phải chú tâm; “chính mình” giữ rõ sắc thái phản thân.
- source_word: τῇ διδασκαλίᾳ
  choice: lời dạy
  rationale: διδασκαλία có thể chỉ hoạt động dạy dỗ hoặc nội dung được dạy. “Lời dạy” là cách nói dễ hiểu, không nặng thuật ngữ, đồng thời chủ yếu giữ trọng tâm vào nội dung giáo huấn trong văn cảnh.
- source_word: ἐπίμενε αὐτοῖς
  choice: hãy kiên trì trong những điều ấy
  rationale: ἐπίμενε diễn tả sự tiếp tục bền bỉ; αὐτοῖς quy chiếu tự nhiên đến những mối quan tâm vừa nêu. Cách dịch này làm rõ ý quy chiếu mà không thêm một đối tượng mới.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Vì khi làm như vậy
  rationale: Phân từ hiện tại có thể diễn tả phương cách hoặc hoàn cảnh đi kèm. “Khi làm như vậy” tự nhiên và vẫn cho thấy mối liên hệ giữa việc bền lòng thực hành với kết quả được nêu sau đó.
- source_word: σώσεις
  choice: con sẽ cứu
  rationale: Giữ nghĩa mạnh và trực tiếp của σῴζω là “cứu”, không thu hẹp thành chỉ sự bảo toàn tạm thời cũng không tự ý xác định toàn bộ phạm vi cứu rỗi.
- source_word: τοὺς ἀκούοντάς σου
  choice: những người nghe con
  rationale: Phân từ hiện tại chỉ những người đang nghe và tiếp nhận lời Ti-mô-thê dạy. Cách diễn đạt này tự nhiên và giữ được tính tiếp diễn theo văn cảnh.
theological_decisions:
- issue: Ý nghĩa của “cứu” trong lời khuyên về chức vụ
  choice: Giữ “cứu” trong chính văn mà không giới hạn vào riêng sự cứu rỗi đời đời hay sự bảo toàn trong chức vụ.
  alternative: Có thể dịch “gìn giữ” hoặc hiểu “cứu” theo nghĩa chuyên biệt về sự cứu rỗi cánh chung.
  rationale: Câu Hy Lạp liên kết sự kiên trì trong đời sống và lời dạy của Ti-mô-thê với kết quả dành cho chính ông và người nghe. Bản dịch giữ nguyên sức nặng và sự căng thẳng thần học của câu, nhưng không hàm ý con người tự lập công để cứu mình.
- issue: Chủ thể được ngầm hiểu trong các mệnh lệnh và lời hứa
  choice: Dùng “con” ở mệnh đề kết quả, phù hợp quan hệ đã được thiết lập giữa Phao-lô và Ti-mô-thê trong thư.
  alternative: Có thể dùng “anh” hoặc lược đại từ, nhưng cách sau không tự nhiên trong mệnh đề “sẽ cứu”.
  rationale: Tiếng Hy Lạp biểu thị ngôi thứ hai số ít bằng hình thái động từ. Tiếng Việt cần một đại từ rõ ràng ở mệnh đề kết quả; “con” phù hợp văn cảnh thư tín và không thay đổi nội dung mệnh đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Các mệnh lệnh được diễn đạt ngắn gọn và trực tiếp; “lời dạy” tránh sắc thái thuật ngữ của “giáo lý,” còn “cứu” giữ nguyên sức nặng thần học và sự mở nghĩa của nguyên văn.
