id: 1TI.1.8
reference: 1 Timothy 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: vi
  text: Nhưng chúng ta biết rằng luật pháp là tốt, nếu người ta sử dụng luật ấy đúng luật,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu người ta sử dụng luật ấy đúng cách” hoặc “một cách chính đáng.”'
    reason: Nêu các nghĩa tự nhiên khác của νομίμως, vì từ này có thể chỉ sự phù hợp với luật hoặc việc sử dụng đúng đắn, hợp lệ.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: chúng ta biết
  rationale: Dạng οἶδα mang nghĩa hiện tại, diễn tả một điều đã được nhận biết chắc chắn; “chúng ta biết” tự nhiên và sát nghĩa.
- source_word: δὲ
  choice: nhưng
  rationale: δὲ đánh dấu một chuyển ý nhẹ trong mạch văn. “Nhưng” thể hiện sự đối chiếu với việc dùng luật sai lạc ở câu trước, mà không biến nó thành một sự tương phản tuyệt đối.
- source_word: καλὸς
  choice: tốt
  rationale: καλός khẳng định phẩm chất tích cực của luật pháp; “tốt” giữ được nghĩa rộng mà không diễn giải quá mức.
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Giữ cách gọi không xác định thêm phạm vi, như bản Hy Lạp; trong ngữ cảnh có thể đặc biệt hướng đến luật Môi-se, nhưng câu này không nói rõ như vậy.
- source_word: ἐάν τις
  choice: nếu người ta
  rationale: Đây là điều kiện có chủ thể phiếm chỉ số ít. “Nếu người ta” là cách diễn đạt tự nhiên trong tiếng Việt và không thu hẹp đối tượng.
- source_word: αὐτῷ
  choice: luật ấy
  rationale: Đại từ chỉ lại ὁ νόμος được nêu rõ thành “luật ấy” để câu tiếng Việt rõ ràng, tránh đại từ “nó” kém trang trọng.
- source_word: νομίμως
  choice: đúng luật
  rationale: νομίμως có nghĩa là phù hợp với luật hoặc chuẩn mực đúng đắn. “Đúng luật” vừa tự nhiên vừa phần nào giữ được liên hệ từ ngữ với νόμος.
- source_word: χρῆται
  choice: sử dụng
  rationale: χράομαι có nghĩa là dùng hoặc vận dụng; “sử dụng” phù hợp với đối tượng là luật pháp và có sắc thái trang trọng vừa phải.
theological_decisions:
- issue: Phạm vi của “luật pháp”
  choice: Giữ nguyên là “luật pháp”, không thêm “luật Môi-se”.
  alternative: luật Môi-se; luật pháp nói chung
  rationale: Ngữ cảnh có thể đặc biệt nói đến luật Môi-se, nhưng nguyên văn chỉ nói ὁ νόμος. Bản dịch không thu hẹp phạm vi mà câu Hy Lạp để ngỏ.
- issue: Ý nghĩa của νομίμως
  choice: “đúng luật”, giữ sự liên hệ giữa “luật pháp” và “đúng luật”.
  alternative: đúng cách; hợp lệ; chính đáng
  rationale: Cách dịch này bảo tồn lối chơi chữ νόμος/νομίμως và không quyết định trước “cách dùng đúng” cụ thể là gì.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “đúng luật” có chủ ý giữ sự lặp từ của nguyên văn Hy Lạp; dấu phẩy cuối câu được giữ vì câu còn tiếp sang mệnh đề kế tiếp trong văn cảnh.
