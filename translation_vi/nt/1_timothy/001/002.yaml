id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: vi
  text: 'Gửi Ti-mô-thê, người con chân thật trong đức tin[a]: ân điển, lòng thương xót và bình an từ Đức Chúa Trời là Cha và từ Đấng Mê-si-a Giê-su, Chúa chúng ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người con đích thực trong niềm tin.”'
    reason: Giữ các sắc thái của γνησίῳ (“chân thật/đích thực”) và khả năng ἐν πίστει chỉ cả thực tại đức tin chung lẫn hành vi tin; nguyên văn không có đại từ sở hữu “của tôi.”
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: người con thật của tôi
  rationale: Giữ hình ảnh về quan hệ cha–con thuộc linh và diễn đạt tính chân thật, xác thực của mối quan hệ ấy; “con” không biến quan hệ này thành quan hệ huyết thống.
- source_word: ἐν πίστει
  choice: trong đức tin
  rationale: Giữ được khả năng chỉ phạm vi đức tin chung mà trong đó Ti-mô-thê là người con thuộc linh của Phao-lô, đồng thời không loại trừ sắc thái tin cậy.
- source_word: χάρις, ἔλεος, εἰρήνη
  choice: ân điển, lòng thương xót và bình an
  rationale: Các từ tương đương tự nhiên và quen thuộc trong tiếng Việt, giữ nguyên ba yếu tố riêng biệt của lời chào.
- source_word: θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  rationale: Diễn đạt tự nhiên quan hệ đồng vị trong tiếng Việt mà không thêm đại từ sở hữu không có trong nguyên văn.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Dịch Χριστός theo nghĩa tước hiệu “Mê-si-a” và giữ Giê-su là tên riêng.
- source_word: κυρίου ἡμῶν
  choice: Chúa chúng ta
  rationale: Giữ tước hiệu κύριος cùng đại từ sở hữu số nhiều của nguyên văn.
theological_decisions:
- issue: Sắc thái của ἐν πίστει
  choice: trong đức tin
  alternative: trong niềm tin
  rationale: “Trong đức tin” có thể chỉ thực tại đức tin chung gắn kết Phao-lô và Ti-mô-thê; chú thích giữ lại khả năng hiểu gần hơn với hành động tin.
- issue: Cách dịch Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Ki-tô Giê-su
  rationale: Dịch tước hiệu thay vì chỉ phiên âm truyền thống, qua đó làm rõ ý nghĩa chức danh mà không đồng nhất nó với tên riêng.
- issue: Hình thức lời chúc χάρις, ἔλεος, εἰρήνη ἀπό
  choice: Nguyện ... từ ... ở cùng con
  alternative: Ân điển, lòng thương xót và bình an từ ...
  rationale: Tiếng Hy Lạp dùng một lời chào tỉnh lược không có động từ; thêm “nguyện” và “ở cùng con” giúp câu tiếng Việt hoàn chỉnh, nhưng không thêm nội dung thần học mới.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Gửi” theo thể thư tín tự nhiên; giữ hình ảnh “người con” và dịch Χριστός như một tước hiệu. Lặp “từ” trước hai nguồn phối hợp để câu tiếng Việt rõ ràng, dù nguyên văn chỉ có một giới từ chi phối cả hai.
