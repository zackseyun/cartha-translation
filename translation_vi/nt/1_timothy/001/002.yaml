revisions:
- from: 'Gửi Ti-mô-thê, người con thật của tôi trong đức tin[a]: Nguyện ân điển, lòng thương xót và bình an từ Đức Chúa Trời là Cha và từ Đấng Mê-si-a Giê-su, Chúa chúng ta, ở cùng con.'
  to: 'Gửi Ti-mô-thê, người con chân thật trong đức tin[a]: ân điển, lòng thương xót và bình an từ Đức Chúa Trời là Cha và từ Đấng Mê-si-a Giê-su, Chúa chúng ta.'
  rationale: Bản sửa loại bỏ “của tôi,” vì yếu tố này không có trong nguyên văn Hy Lạp, và không mở rộng công thức chào bằng “Nguyện ... ở cùng con.” Những thay đổi này tăng độ sát nguồn mà vẫn giữ giọng văn tiếng Việt trang trọng, tự nhiên và các thuật ngữ thần học của bản nháp.
