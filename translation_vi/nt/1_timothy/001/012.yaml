id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: vi
  text: Tôi cảm tạ Đấng Mê-si-a Giê-su, Chúa chúng ta, Đấng đã thêm sức cho tôi, vì Ngài xét tôi là người trung tín khi giao cho tôi công việc phục vụ[b],[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tước hiệu Hy Lạp Χριστός (Christos) nghĩa là “đấng được xức dầu.” Cũng có thể dùng dạng truyền thống: “Đấng Christ Giê-su.”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “chức vụ” hoặc “sự phục vụ.” Từ Hy Lạp διακονία có nghĩa rộng, chỉ việc phục vụ hoặc chức vụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Tôi cảm tạ
  rationale: Thành ngữ Hy Lạp diễn tả lòng biết ơn hướng đến một đối tượng. “Tôi cảm tạ” tự nhiên, trang trọng và giữ rõ hành động cảm tạ.
- source_word: ἐνδυναμώσαντί με
  choice: Đấng đã ban sức cho tôi
  rationale: Cách dịch này diễn đạt việc Chúa Giê-su làm cho Phao-lô có sức và khả năng thi hành nhiệm vụ, nhưng không thu hẹp ý nghĩa thành một loại quyền năng đặc thù.
- source_word: Χριστῷ Ἰησοῦ
  choice: Giê-su, Đấng Được Xức Dầu
  rationale: Χριστός là tước hiệu mang nghĩa “Đấng được xức dầu.” Đảo sang cấu trúc đồng vị tự nhiên hơn trong tiếng Việt vẫn giữ rõ nội dung của tước hiệu và danh Giê-su.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Chúa chúng ta
  rationale: “Chúa” giữ được ý về thẩm quyền của κύριος và phù hợp với cách dùng tước hiệu này trong Tân Ước.
- source_word: πιστόν
  choice: người trung tín
  rationale: Trong bối cảnh được giao phó việc phục vụ, πιστός nói đến sự trung tín và đáng tin cậy. “Trung tín” giữ được sắc thái rộng của từ.
- source_word: ἡγήσατο
  choice: xem tôi là
  rationale: Động từ có nghĩa coi, kể hoặc đánh giá một người theo một phẩm chất nào đó. “Xem … là” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: θέμενος εἰς διακονίαν
  choice: giao cho tôi công việc phục vụ
  rationale: θέμενος trong ngữ cảnh chỉ việc đặt hoặc chỉ định vào một nhiệm vụ; διακονία có nghĩa rộng là sự phục vụ. Cách dịch này tự nhiên và không áp đặt một chức phẩm giáo hội về sau.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Giê-su, Đấng Được Xức Dầu
  alternative: Đấng Ki-tô Giê-su; Đấng Mê-si-a Giê-su
  rationale: Dịch nghĩa tước hiệu giúp người đọc nhận ra nội dung “đấng được xức dầu,” thay vì coi đây đơn thuần là một phần của tên riêng. Cấu trúc đồng vị tiếng Việt được dùng để câu tự nhiên mà không xóa sự phân biệt giữa danh và tước hiệu.
- issue: Sắc thái của việc Phao-lô được giao nhiệm vụ
  choice: giao cho tôi công việc phục vụ
  alternative: đặt tôi vào chức vụ; bổ nhiệm tôi vào chức vụ
  rationale: Bản Hy Lạp nói đến việc được đặt vào διακονία nhưng không tự nó xác định một chức phẩm giáo hội theo nghĩa kỹ thuật. “Công việc phục vụ” giữ nghĩa rộng và để ngỏ sắc thái “chức vụ,” được ghi trong chú thích.
- issue: Quan hệ giữa việc được xem là trung tín và được giao phục vụ
  choice: vì Ngài xem tôi là người trung tín và giao cho tôi công việc phục vụ
  alternative: vì Ngài xem tôi là người trung tín, khi đặt tôi vào công việc phục vụ
  rationale: Cách nối bằng “và” diễn đạt tự nhiên rằng hành động giao việc thể hiện việc Chúa xem Phao-lô là trung tín, đồng thời không biến lòng trung tín thành công trạng khiến ông được chọn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” được dùng để quy chiếu rõ về Chúa Giê-su. Dấu phẩy cuối câu được giữ vì câu nguồn tiếp tục sang câu kế tiếp.
