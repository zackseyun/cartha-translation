id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: vi
  text: Nhưng chính vì lý do này, tôi đã được thương xót, để Đấng Mê-si-a Giê-su bày tỏ nơi tôi, là người đứng đầu[a], trọn vẹn lòng nhẫn nại của Ngài, làm khuôn mẫu cho những người sau này sẽ tin nơi Ngài để nhận sự sống đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người đứng đầu” nối lại lời Phao-lô ở câu 15 rằng ông là người đứng đầu trong số những tội nhân. Từ Hy Lạp cũng có thể được dịch là “người đầu tiên.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἠλεήθην
  choice: tôi đã được thương xót
  rationale: Giữ thể bị động của động từ và không nêu đích danh tác nhân, đúng với cách diễn đạt của nguyên văn.
- source_word: πρώτῳ
  choice: là kẻ đứng đầu
  rationale: Giữ nghĩa 'đứng đầu/tiêu biểu nhất' và mối liên hệ với lời Phao-lô tự nhận là người đứng đầu trong số những tội nhân ở câu 15, thay vì diễn giải mạnh hơn thành 'tệ nhất'.
- source_word: ἐνδείξηται
  choice: bày tỏ
  rationale: Diễn đạt hành động làm cho điều gì được thấy rõ, đồng thời phù hợp tự nhiên với mệnh đề chỉ mục đích ἵνα.
- source_word: Χριστὸς Ἰησοῦς
  choice: Đấng Mê-si-a là Đức Giê-su
  rationale: Thể hiện Χριστός là tước hiệu và vẫn tạo một cụm từ tự nhiên, trang trọng trong tiếng Việt.
- source_word: τὴν ἅπασαν μακροθυμίαν
  choice: trọn vẹn lòng nhẫn nại của Ngài
  rationale: ἅπασαν nhấn mạnh toàn thể hoặc mức độ đầy đủ; μακροθυμία chỉ sự kiên nhẫn chịu đựng và chậm giận.
- source_word: πρὸς ὑποτύπωσιν
  choice: làm khuôn mẫu
  rationale: ὑποτύπωσις nói đến một mẫu hình được trình ra để những trường hợp sau nhìn vào; 'khuôn mẫu' giữ sắc thái ấy.
- source_word: τῶν μελλόντων πιστεύειν
  choice: những người về sau sẽ tin
  rationale: μέλλω với động từ nguyên mẫu diễn tả những người sẽ tin sau trường hợp của Phao-lô; 'về sau sẽ' tự nhiên trong tiếng Việt và bảo toàn hướng tương lai.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: tin nơi Ngài
  rationale: Diễn đạt đối tượng mà đức tin hướng đến, với đại từ tôn kính phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: εἰς ζωὴν αἰώνιον
  choice: để được sự sống đời đời
  rationale: εἰς nêu mục tiêu hay kết quả hướng đến; cách dịch này rõ nghĩa và tự nhiên, không xác định quá mức quan hệ thần học ngoài câu.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a là Đức Giê-su
  alternative: Đức Chúa Giê-su Cơ Đốc
  rationale: Trong cụm này, Χριστός vẫn có thể được nghe như tước hiệu chỉ Đấng được xức dầu; bản dịch thể hiện ý nghĩa tước hiệu thay vì chỉ phiên chuyển thành một thành tố gần như tên riêng.
- issue: Tác nhân của sự thương xót và lòng nhẫn nại
  choice: Giữ thể bị động 'được thương xót', rồi nêu rõ Đấng Mê-si-a là Đức Giê-su bày tỏ lòng nhẫn nại
  alternative: Nêu trực tiếp Đức Chúa Trời hoặc Đức Giê-su là Đấng thương xót Phao-lô
  rationale: Nguyên văn không chỉ rõ tác nhân của ἠλεήθην, nhưng mệnh đề mục đích gọi đích danh Đấng Mê-si-a là Đức Giê-su là Đấng bày tỏ lòng nhẫn nại. Bản dịch không đồng nhất hoặc phân tách các tác nhân quá điều văn bản nói.
- issue: Ý nghĩa của πρώτῳ
  choice: kẻ đứng đầu
  alternative: kẻ tội lỗi tệ nhất; trường hợp đầu tiên
  rationale: Cách dịch giữ được liên hệ với 'đứng đầu trong số những tội nhân' ở câu trước mà không loại bỏ hoàn toàn khả năng từ này cũng góp phần vào ý nghĩa Phao-lô là trường hợp tiêu biểu mở đầu cho những người tin về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si-a là Đức Giê-su” để làm rõ tước hiệu; dùng “Ngài” cho đại từ quy chiếu đến Đức Giê-su. Cấu trúc câu bám sát tiến trình lập luận của nguyên văn nhưng tránh lối diễn đạt gượng trong tiếng Việt.
