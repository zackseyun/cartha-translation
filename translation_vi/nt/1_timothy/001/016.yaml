revisions:
- from: Nhưng chính vì thế tôi đã được thương xót, để nơi tôi, là kẻ đứng đầu[a], Đấng Mê-si-a là Đức Giê-su bày tỏ trọn vẹn lòng nhẫn nại của Ngài, làm khuôn mẫu cho những người về sau sẽ tin nơi Ngài để được sự sống đời đời.
  to: Nhưng chính vì lý do này, tôi đã được thương xót, để Đấng Mê-si-a Giê-su bày tỏ nơi tôi, là người đứng đầu[a], trọn vẹn lòng nhẫn nại của Ngài, làm khuôn mẫu cho những người sau này sẽ tin nơi Ngài để nhận sự sống đời đời.
  rationale: Chỉnh nhẹ cách xưng danh để câu tự nhiên hơn trong tiếng Việt hiện đại, và thu gọn chú thích ώστε chỉ phản ánh sự mơ hồ từ vựng của πρώτῳ, không diễn giải quá mức. Các quan hệ ngữ pháp và ý nghĩa của nguyên văn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
