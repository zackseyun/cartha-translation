id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: vi
  text: Như khi tôi lên đường đi Ma-xê-đô-ni-a, tôi đã khuyên con ở lại Ê-phê-sô để con truyền lệnh cho một số người đừng dạy giáo lý khác,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς
  choice: Như
  rationale: Mở đầu lời nhắc lại điều Phao-lô đã căn dặn trước đó; cách dịch tự nhiên và vẫn giữ quan hệ với mạch câu còn tiếp diễn.
- source_word: παρεκάλεσά σε
  choice: tôi đã khuyên con
  rationale: παρακαλέω ở đây diễn tả lời thúc giục tha thiết nhưng không nhất thiết là mệnh lệnh. Đại từ “con” phù hợp quan hệ người viết với Ti-mô-thê và văn phong thư tín tiếng Việt.
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: ở lại Ê-phê-sô
  rationale: Diễn đạt trực tiếp ý tiếp tục lưu lại tại một nơi; địa danh được phiên âm theo cách quen dùng trong Kinh Thánh tiếng Việt.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: khi tôi đi sang Ma-xê-đô-ni-a
  rationale: Phân từ chỉ hoàn cảnh thời gian của chuyến đi của Phao-lô; “đi sang” tự nhiên trong tiếng Việt và không thêm chi tiết ngoài bản nguồn.
- source_word: ἵνα
  choice: để
  rationale: Giữ rõ ý mục đích bằng cách diễn đạt ngắn gọn, tự nhiên.
- source_word: παραγγείλῃς
  choice: con truyền bảo
  rationale: παραγγέλλω mang sắc thái chỉ thị có thẩm quyền, mạnh hơn lời khuyên thông thường; “truyền bảo” giữ được sức nặng ấy mà không cổ kính quá mức.
- source_word: τισὶν
  choice: một số người
  rationale: Chỉ những người cụ thể nhưng không được nêu tên; cách diễn đạt hiện đại và tự nhiên.
- source_word: μὴ ἑτεροδιδασκαλεῖν
  choice: đừng dạy giáo lý khác
  rationale: Giữ ý trực tiếp của động từ ghép là dạy điều khác với chuẩn mực đang được giả định, không diễn giải mạnh hơn thành “giáo lý sai lạc”.
theological_decisions:
- issue: Mức độ thẩm quyền trong παραγγείλῃς
  choice: “truyền bảo” để thể hiện một chỉ thị có thẩm quyền
  alternative: “khuyên bảo” hoặc “ra lệnh”
  rationale: Bối cảnh là sự ủy nhiệm để chấn chỉnh việc giảng dạy. “Khuyên bảo” quá nhẹ, còn “ra lệnh” có thể tạo sắc thái gay gắt hơn mức cần thiết; “truyền bảo” giữ được thẩm quyền mà vẫn trang trọng, tự nhiên.
- issue: Giá trị đánh giá của ἑτεροδιδασκαλεῖν
  choice: “dạy giáo lý khác”
  alternative: “dạy giáo lý sai lạc” hoặc “dạy khác đi”
  rationale: Từ nguồn nhấn mạnh sự khác biệt với giáo huấn chuẩn mực nhưng không trực tiếp dùng tính từ “sai.” Bản dịch giữ nguyên sức căng ấy, tránh thêm phán đoán vốn chỉ được làm rõ qua ngữ cảnh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” cho Ti-mô-thê theo quan hệ mục vụ được thể hiện trong thư; giữ dấu phẩy cuối câu vì câu Hy Lạp và đơn vị được cung cấp tiếp tục sang phần sau.
