id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: vi
  text: 'Lời này đáng tin cậy và hoàn toàn xứng đáng được đón nhận: Đấng Mê-si-a Giê-su[a] đã đến thế gian để cứu những người tội lỗi; trong số đó, chính tôi là người đứng đầu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ Giê-su.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “tôi là người tồi tệ nhất” hoặc “tôi là kẻ đứng đầu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Lời này đáng tin cậy
  rationale: Trong các Thư Mục vụ, cụm này là công thức giới thiệu một lời tuyên bố đáng tin. “Lời này” tự nhiên trong tiếng Việt và giữ được chức năng quy chiếu của ὁ λόγος.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: đáng được hoàn toàn đón nhận
  rationale: ἀποδοχή chỉ sự tiếp nhận hay chấp nhận, còn πάσης nhấn mạnh mức độ trọn vẹn. Cách dịch này tránh hiểu πάσης thành “bởi mọi người,” điều nguyên văn không nói rõ.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι giới thiệu nội dung của “lời” đáng tin cậy. Dấu hai chấm diễn đạt tự nhiên chức năng này trong tiếng Việt mà không biến mệnh đề thành quan hệ nguyên nhân.
- source_word: Χριστὸς Ἰησοῦς
  choice: Đấng Mê-si-a Giê-su
  rationale: Χριστός được hiểu theo nghĩa tước hiệu “Đấng Mê-si-a,” còn Ἰησοῦς được phiên âm là “Giê-su.”
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: đã đến thế gian
  rationale: Giữ nguyên ý chuyển động của ἦλθεν và sắc thái thần học của εἰς τὸν κόσμον bằng một cách nói quen thuộc, trang trọng trong tiếng Việt.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: để cứu những người tội lỗi
  rationale: ἁμαρτωλούς là tính từ được dùng như danh từ chỉ những người tội lỗi; σῶσαι mang nghĩa cứu trong ngữ cảnh cứu độ.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: trong số đó, chính tôi là người đứng đầu
  rationale: “Đứng đầu” giữ hình ảnh thứ bậc của πρῶτος mà không tự động diễn giải thành “tồi tệ nhất.” “Chính tôi” thể hiện sự nhấn mạnh của đại từ ἐγώ.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong lời tuyên xưng này, Χριστός vẫn có thể được nhận ra là tước hiệu. Bản chính dịch nghĩa tước hiệu; chú thích bảo lưu cách gọi truyền thống có tính tên riêng hơn.
- issue: Ý nghĩa của πρῶτος giữa những người tội lỗi
  choice: người đứng đầu
  alternative: người tồi tệ nhất; kẻ chief/đứng đầu
  rationale: πρῶτος có thể chỉ người thứ nhất hay đứng đầu về thứ bậc, từ đó hàm ý “tệ nhất” trong văn cảnh. Bản chính giữ ẩn dụ thứ bậc, còn chú thích nêu cách hiểu diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thế gian” để giữ sắc thái Kinh Thánh của κόσμος; dùng “chính tôi” để thể hiện đại từ nhấn mạnh. Dấu chấm phẩy làm rõ sự chuyển từ lời tuyên bố cứu độ sang lời tự nhận của người nói.
