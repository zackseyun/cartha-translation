id: 1TI.1.20
reference: 1 Timothy 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: vi
  text: Trong số đó có Hy-mê-nê và A-léc-xan-đơ, là những người tôi đã giao cho Sa-tan[a], để họ được sửa dạy[b], hầu không phạm thượng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trao cho Sa-tan.” Cụm từ này có lẽ nói đến một biện pháp sửa trị nghiêm khắc, chứ không nhất thiết là sự kết án chung cuộc.'
    reason: lexical_alternative
  - marker: b
    text: “Sửa dạy” cũng có thể dịch là “dạy bảo,” “rèn luyện” hoặc “kỷ luật”; từ Hy Lạp bao hàm ý uốn nắn nhằm giúp người ta thay đổi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Trong số đó có
  rationale: Diễn đạt tự nhiên quan hệ bộ phận của đại từ sở hữu số nhiều, đồng thời nối lại nhóm người đã được nhắc đến ở câu trước.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Hy-mê-nê và A-léc-xan-đơ
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc, rõ ràng đối với độc giả phổ thông.
- source_word: οὓς παρέδωκα τῷ Σατανᾷ
  choice: là những người tôi đã giao cho Sa-tan
  rationale: Giữ sát hình ảnh mạnh và có chủ ý mơ hồ của nguyên văn; thì quá khứ phù hợp với thể aorist và văn mạch tiếng Việt.
- source_word: ἵνα παιδευθῶσι
  choice: để họ được sửa dạy
  rationale: “Sửa dạy” bao hàm cả sự giáo huấn lẫn uốn nắn mang tính kỷ luật của παιδεύω, phù hợp mục đích cải sửa trong văn cảnh.
- source_word: μὴ βλασφημεῖν
  choice: mà không còn phạm thượng nữa
  rationale: “Phạm thượng” giữ sức nặng tôn giáo của βλασφημέω; “không còn… nữa” diễn đạt tự nhiên mục đích chấm dứt hành vi đang được quở trách mà không xác định cụ thể đối tượng của lời phạm thượng.
theological_decisions:
- issue: Ý nghĩa của việc “giao cho Sa-tan”
  choice: Giữ nguyên cách nói theo nghĩa đen trong chính văn, không xác định cơ chế cụ thể.
  alternative: Diễn giải là khai trừ khỏi hội thánh, gây đau đớn thể xác cách siêu nhiên, hoặc tuyên án hư mất chung cuộc.
  rationale: Mệnh đề chỉ mục đích cho thấy tính sửa trị, nhưng nguyên văn không giải thích phương thức. Bản dịch vì thế bảo toàn sự căng thẳng thần học và tránh đưa một cơ chế giáo hội cụ thể vào câu.
- issue: Mục đích của παιδευθῶσι
  choice: Sự sửa dạy nhằm khiến họ chấm dứt phạm thượng.
  alternative: Chỉ đơn thuần được giảng dạy, hoặc bị trừng phạt mà không có mục đích cải sửa.
  rationale: Động từ có trường nghĩa giáo dục, huấn luyện và sửa trị; thể bị động cùng mệnh đề mục đích ở đây phù hợp nhất với việc uốn nắn mang tính phục hồi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên hình ảnh “giao cho Sa-tan,” dùng “sửa dạy” để chuyển tải đồng thời sắc thái giáo huấn và kỷ luật, và đặt dấu chú thích ngay sau những cụm từ liên quan.
