revisions:
- from: giữ vững đức tin và một lương tâm tốt[a]. Một số người đã gạt bỏ lương tâm ấy, nên đã bị đắm tàu về phương diện đức tin[b].
  to: giữ vững đức tin và một lương tâm tốt[a]; một số người đã gạt bỏ lương tâm ấy và bị đắm tàu về đức tin[b].
  rationale: Bản sửa loại bỏ liên từ «nên» để không áp đặt quan hệ nhân quả, thay cách diễn đạt nặng tính kỹ thuật bằng «về đức tin», và dùng dấu chấm phẩy để duy trì sự liên kết chặt của câu gốc. Sở chỉ ưu tiên của ἥν là «lương tâm tốt» vẫn được nêu rõ, đồng thời chú thích bảo tồn cách hiểu rộng hơn.
  reviewer_model: gpt-5.6-terra
