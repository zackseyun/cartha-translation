source:
  edition: SBLGNT
  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: vi
  text: giữ vững đức tin và một lương tâm tốt[a]; một số người đã gạt bỏ lương tâm ấy và bị đắm tàu về đức tin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đại từ “ấy” theo ngữ pháp chỉ trực tiếp “lương tâm”; cũng có thể hiểu theo nghĩa rộng là điều một số người đã gạt bỏ gồm cả đức tin lẫn lương tâm tốt.
    reason: alternative_reading
  - marker: b
    text: Từ được dịch là “đức tin” cũng có thể mang nghĩa “lòng tin”; nghĩa “sự trung tín” ít có khả năng hơn trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: giữ vững
  rationale: Phân từ hiện tại tiếp nối lời truyền bảo ở câu trước, diễn tả việc chủ động tiếp tục nắm giữ; “giữ vững” tự nhiên và có sắc thái bền bỉ hơn “có”.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ này chủ yếu chỉ đức tin Cơ Đốc; cách dịch cũng giữ được mối liên hệ giữa hai lần xuất hiện của πίστις trong câu.
- source_word: ἀγαθὴν συνείδησιν
  choice: một lương tâm tốt
  rationale: Phản ánh trực tiếp ἀγαθή mà không thu hẹp ý nghĩa thành cảm giác chủ quan thanh thản như “lương tâm thanh thản” hoặc “lương tâm trong sạch”.
- source_word: ἥν
  choice: lương tâm ấy
  rationale: Đại từ quan hệ giống cái số ít phù hợp tự nhiên nhất với συνείδησιν; tiếng Việt cần nêu lại danh từ để câu rõ ràng và tự nhiên.
- source_word: ἀπωσάμενοι
  choice: đã gạt bỏ
  rationale: Diễn tả hành động cố ý khước từ hoặc đẩy ra; “gạt bỏ” vừa giữ hình ảnh của động từ vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: περὶ τὴν πίστιν
  choice: về phương diện đức tin
  rationale: Diễn tả lĩnh vực hoặc phương diện mà sự đắm tàu xảy ra, đồng thời mạo từ xác định hỗ trợ cách hiểu là đức tin Cơ Đốc.
- source_word: ἐναυάγησαν
  choice: đã bị đắm tàu
  rationale: Giữ nguyên ẩn dụ mạnh về tai họa hàng hải thay vì làm nhạt thành “thất bại” hay “sa sút”.
theological_decisions:
- issue: Sở chỉ của ἥν
  choice: Hiểu đại từ này trực tiếp chỉ “một lương tâm tốt”.
  alternative: Hiểu đại từ theo nghĩa rộng, tóm gồm cả “đức tin và một lương tâm tốt”.
  rationale: Về ngữ pháp, ἥν là giống cái số ít và phù hợp tự nhiên nhất với danh từ giống cái số ít gần nhất là συνείδησιν. Chú thích vẫn bảo tồn cách hiểu rộng hơn.
- issue: Quan hệ giữa việc gạt bỏ lương tâm và sự đắm tàu
  choice: Dùng “nên” để diễn đạt quan hệ hệ quả tự nhiên của phân từ đi trước động từ chính.
  alternative: 'Chỉ đặt hai hành động nối tiếp nhau: “đã gạt bỏ… và đã bị đắm tàu”.'
  rationale: Cấu trúc phân từ aorist theo sau bởi động từ chính cho phép sắc thái hoàn cảnh–hệ quả; “nên” tạo câu tiếng Việt rõ ràng mà không thêm một nguyên nhân ngoài văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ ẩn dụ “đắm tàu” của nguyên văn và dùng “lương tâm tốt” để tránh diễn giải quá mức tính từ ἀγαθή.
