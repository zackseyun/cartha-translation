id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: vi
  text: 'biết điều này: luật pháp không được đặt ra cho người công chính, nhưng cho những kẻ vô luật pháp và phản nghịch, những kẻ không tin kính và tội lỗi, những kẻ bất thánh và phàm tục, những kẻ giết cha và giết mẹ[a], những kẻ sát nhân,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những kẻ đánh cha và đánh mẹ”; các từ Hy Lạp này có thể chỉ hành vi bạo lực đối với cha mẹ, dù trong văn cảnh này nghĩa “giết” có khả năng hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: và biết điều này
  rationale: Phân từ nối với mạch câu trước và nêu điều làm cơ sở cho lời chỉ dẫn; “biết điều này” giữ trực tiếp ý nhận biết của εἰδώς.
- source_word: δικαίῳ
  choice: cho người công chính
  rationale: Giữ dạng số ít và ý nghĩa đại diện của tính từ danh hóa, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: νόμος οὐ κεῖται
  choice: luật pháp không được đặt ra
  rationale: Giữ hình ảnh pháp lý của κεῖται là được đặt/ấn định, tránh diễn giải mạnh thành “không áp dụng”.
- source_word: ἀνόμοις
  choice: những kẻ vô luật pháp
  rationale: Thể hiện rõ sự chống nghịch chuẩn mực luật pháp; cách gọi “những kẻ” phù hợp với danh sách các đối tượng bị lên án.
- source_word: ἀνυποτάκτοις
  choice: phản nghịch
  rationale: Diễn đạt tự nhiên thái độ không chịu phục tùng.
- source_word: ἀσεβέσι
  choice: không tin kính
  rationale: Chuyển tải sự thiếu lòng tôn kính đối với Đức Chúa Trời bằng thuật ngữ Kinh Thánh quen thuộc nhưng vẫn dễ hiểu.
- source_word: ἁμαρτωλοῖς
  choice: tội lỗi
  rationale: Giữ cấu trúc tính từ song song với từ đứng trước trong cặp từ.
- source_word: ἀνοσίοις
  choice: bất kính
  rationale: Chỉ thái độ không tôn trọng điều thánh, đồng thời phân biệt tương đối với ἀσεβέσι và βεβήλοις.
- source_word: βεβήλοις
  choice: phàm tục
  rationale: Giữ ý coi điều thiêng liêng như điều thông thường hoặc tục hóa nó.
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: những kẻ giết cha và giết mẹ
  rationale: Các từ hiếm này có thể chỉ việc đánh hoặc giết cha mẹ; văn cảnh danh sách trọng tội khiến nghĩa “giết” có khả năng hơn, còn nghĩa khác được ghi chú.
- source_word: ἀνδροφόνοις
  choice: những kẻ sát nhân
  rationale: Diễn đạt rõ hành vi giết người trái phép trong danh sách tội ác.
theological_decisions:
- issue: Ý nghĩa đại diện của δικαίῳ ở giống đực số ít
  choice: người công chính
  alternative: người nam công chính; những người công chính
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp ở “người”; cách dịch này giữ số ít và ý nghĩa đại diện mà không thêm ý chỉ riêng nam giới.
- issue: Phạm vi nghĩa của πατρολῴαις / μητρολῴαις
  choice: những kẻ giết cha và giết mẹ
  alternative: những kẻ đánh cha và đánh mẹ
  rationale: Nguyên ngữ có thể nói đến hành hung hoặc giết cha mẹ. Văn cảnh nghiêng về nghĩa mạnh hơn, nhưng sự bất định thực sự được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp các cặp từ trong danh sách; dùng “luật pháp” để phù hợp sắc thái pháp lý và tôn giáo. Dấu phẩy cuối cho thấy câu còn tiếp sang câu kế.
