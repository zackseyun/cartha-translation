id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: vi
  text: theo Tin Mừng về vinh quang của Đức Chúa Trời phước hạnh[a], là Tin Mừng đã được giao phó cho tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn đạt tự nhiên hơn: “Tin Mừng vinh hiển của Đức Chúa Trời phước hạnh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: theo
  rationale: Trong ngữ cảnh này, κατά với đối cách nêu chuẩn mực phù hợp với những điều được nói trước đó; “theo” vừa tự nhiên vừa giữ được quan hệ ấy.
- source_word: εὐαγγέλιον
  choice: Tin Mừng
  rationale: “Tin Mừng” là cách gọi quen thuộc, rõ nghĩa trong văn mạch Phao-lô và giữ được sắc thái thần học của εὐαγγέλιον.
- source_word: τῆς δόξης
  choice: về vinh quang
  rationale: Giữ danh từ “vinh quang” thay vì chuyển hẳn thành tính từ “vinh hiển”, nhờ đó không khóa quan hệ sở hữu/miêu tả của sở hữu cách Hy Lạp; “về” giúp câu tiếng Việt tự nhiên.
- source_word: μακαρίου
  choice: đáng chúc tụng
  rationale: Khi nói về Đức Chúa Trời, “đáng chúc tụng” trang trọng và thích hợp hơn “hạnh phúc” hay “may mắn”, đồng thời tránh gợi ý rằng Ngài nhận phước từ một nguồn cao hơn.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng và quen thuộc cho θεός trong ngữ cảnh này.
- source_word: ὃ
  choice: là Tin Mừng
  rationale: Đại từ quan hệ giống trung ὃ quy chiếu về εὐαγγέλιον; lặp lại “Tin Mừng” giúp tiếng Việt rõ ràng và tránh để mệnh đề quan hệ bị hiểu là quy chiếu về “Đức Chúa Trời”.
- source_word: ἐπιστεύθην
  choice: đã được giao phó cho tôi
  rationale: Thể bị động aorist của πιστεύω ở đây mang nghĩa được trao cho để quản nhiệm, không phải “tôi đã tin”; cấu trúc này tự nhiên trong tiếng Việt.
- source_word: ἐγώ
  choice: tôi
  rationale: Đại từ được nêu rõ trong nguyên văn; “cho tôi” chuyển tải người nhận sự giao phó, dù tiếng Việt không cần thêm phương tiện nhấn mạnh.
theological_decisions:
- issue: Quan hệ sở hữu cách trong τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: Tin Mừng về vinh quang của Đức Chúa Trời đáng chúc tụng
  alternative: Tin Mừng vinh hiển của Đức Chúa Trời đáng chúc tụng
  rationale: Bản chính giữ “vinh quang” như một danh từ và để ngỏ sắc thái của sở hữu cách, thay vì quyết định hoàn toàn rằng đây chỉ là cách dùng tính từ. Chú thích ghi cách diễn đạt cô đọng, tự nhiên hơn.
- issue: Nghĩa của ἐπιστεύθην
  choice: đã được giao phó cho tôi
  alternative: tôi đã tin
  rationale: Trong cấu trúc bị động với Tin Mừng là điều được trao, động từ mang nghĩa “giao phó”; cách hiểu “tin” không phù hợp với cú pháp và văn mạch về nhiệm vụ quản nhiệm Tin Mừng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Tin Mừng” như tên gọi sứ điệp Cơ Đốc; dùng “Đức Chúa Trời” nhất quán với lối hành văn Kinh Thánh tiếng Việt. Cụm “đáng chúc tụng” truyền đạt μακάριος khi nói về Đức Chúa Trời mà không dùng từ ngữ đời thường như “may mắn”.
