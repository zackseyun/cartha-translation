revisions:
- from: Mục đích của lời chỉ dạy[a] là tình yêu thương phát xuất từ tấm lòng trong sạch, lương tâm tốt và đức tin chân thành[b].
  to: Mục đích của chỉ thị[a] là tình yêu thương phát xuất từ tấm lòng trong sạch, lương tâm tốt và đức tin chân thành[b].
  rationale: Thay “lời chỉ dạy” bằng “chỉ thị” để biểu đạt rõ hơn sắc thái mệnh lệnh có thẩm quyền của παραγγελία trong ngữ cảnh, đồng thời loại “sự giao phó” khỏi chú thích vì không phải lựa chọn nghĩa trực tiếp ở đây. Các thành phần khác giữ nguyên vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
