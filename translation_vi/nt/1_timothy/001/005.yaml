source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: vi
  text: Mục đích của chỉ thị[a] là tình yêu thương phát xuất từ tấm lòng trong sạch, lương tâm tốt và đức tin chân thành[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mệnh lệnh” hoặc “lời truyền dạy”.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “đức tin không giả hình”. Trong một số ngữ cảnh, từ được dịch là “đức tin” cũng có thể mang nghĩa “lòng trung tín” hoặc “sự tin cậy”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: mục đích
  rationale: Trong ngữ cảnh này, từ này chỉ mục tiêu mà lời chỉ dạy hướng đến, chứ không phải sự chấm dứt.
- source_word: παραγγελίας
  choice: lời chỉ dạy
  rationale: Danh từ có thể chỉ mệnh lệnh, sự giao phó hoặc lời chỉ dạy. Ở đây, “lời chỉ dạy” phù hợp với bối cảnh mục vụ và việc dạy dỗ trong các câu 3–4, đồng thời vẫn giữ sắc thái có thẩm quyền.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phù hợp với trọng tâm đạo đức của câu.
- source_word: ἐκ
  choice: phát xuất từ
  rationale: 'Giới từ đánh dấu nguồn gốc: tình yêu thương nảy sinh từ ba phẩm chất được nêu tiếp theo.'
- source_word: καθαρᾶς καρδίας
  choice: tấm lòng trong sạch
  rationale: Giữ được ý nghĩa nội tâm và luân lý của cụm từ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: συνειδήσεως ἀγαθῆς
  choice: lương tâm tốt
  rationale: Bám sát tính từ ἀγαθῆς hơn cách diễn giải “lương tâm thanh thản” hoặc “không cắn rứt”.
- source_word: πίστεως
  choice: đức tin
  rationale: Đây là nghĩa phù hợp nhất trong ngữ cảnh, dù từ này đôi khi cũng có thể mang nghĩa lòng trung tín hoặc sự tin cậy.
- source_word: ἀνυποκρίτου
  choice: chân thành
  rationale: Diễn đạt tự nhiên ý không giả hình, không giả tạo; bổ nghĩa rõ ràng cho “đức tin”.
- source_word: δὲ
  choice: không biểu đạt bằng một từ riêng
  rationale: δέ chỉ sự chuyển ý nhẹ. Trong câu tiếng Việt đứng riêng, không cần thêm “còn” hoặc “nhưng”, vì những từ ấy dễ tạo cảm giác tương phản mạnh hơn nguyên văn.
theological_decisions:
- issue: Ý nghĩa của πίστις trong πίστεως ἀνυποκρίτου
  choice: đức tin chân thành
  alternative: lòng trung tín không giả tạo; sự tin cậy chân thành
  rationale: “Đức tin” là nghĩa khả dĩ nhất ở đây và phù hợp với cách dùng phổ biến của Phao-lô. Tuy nhiên, phạm vi nghĩa của πίστις có thể bao gồm lòng trung tín hoặc sự tin cậy, nên các khả năng ấy được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc ba nguồn phát sinh tình yêu thương của nguyên văn và không thêm một từ nối đầu câu cho δέ.
