  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: vi
  text: Phao-lô, sứ đồ của Đấng Mê-si-a[a] Giê-su theo mệnh lệnh của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta, và của Đấng Mê-si-a Giê-su, niềm hy vọng của chúng ta,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ” ở cả hai chỗ có “Đấng Mê-si-a”. Từ Hy Lạp Χριστός có thể được dịch là tước hiệu “Đấng Mê-si-a” hoặc, trong một số ngữ cảnh, mang tính tên gọi hơn là “Đấng Christ”.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể trình bày ít tường minh hơn: “theo mệnh lệnh của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta, và Đấng Mê-si-a Giê-su, niềm hy vọng của chúng ta”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng tên riêng đã quen thuộc và dễ nhận biết trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Thuật ngữ quen thuộc trong tiếng Việt, diễn đạt chức vụ và thẩm quyền được sai phái của Phao-lô rõ hơn từ khái quát như “sứ giả”.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Jêsus
  rationale: Dịch Χριστός như một tước hiệu có nội dung là “Đấng Mê-si-a”, đồng thời phiên âm tên Ἰησοῦ theo dạng quen thuộc trong tiếng Việt.
- source_word: κατ’ ἐπιταγὴν
  choice: theo mệnh lệnh
  rationale: Giữ sát ý về một chỉ thị có thẩm quyền và diễn đạt tự nhiên trong tiếng Việt.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta
  rationale: Giữ quan hệ sở hữu trong chuỗi sở cách và làm rõ rằng “Đấng Cứu Rỗi chúng ta” là danh xưng đồng vị của Đức Chúa Trời.
- source_word: καὶ
  choice: và của
  rationale: Lặp lại “của” để biểu thị rõ cả Đức Chúa Trời và Đấng Mê-si-a Jêsus đều gắn với “mệnh lệnh”, đúng quan hệ cú pháp của hai cụm sở cách song song.
- source_word: ἐλπίδος
  choice: niềm hy vọng
  rationale: “Niềm hy vọng” là cách nói tự nhiên, trang trọng, và giữ được ý nghĩa về sự trông đợi đầy tin cậy.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong lời mở đầu này, Χριστός vẫn có sức nặng của một tước hiệu. Dịch nghĩa giúp độc giả nhận ra nội dung tước hiệu thay vì chỉ đọc như một phần của tên riêng; chú thích bảo lưu cách gọi truyền thống.
- issue: Quan hệ của “niềm hy vọng của chúng ta” với Đấng Mê-si-a Jêsus
  choice: 'Cụm đồng vị: “Đấng Mê-si-a Jêsus, niềm hy vọng của chúng ta”'
  alternative: “Đấng Mê-si-a Jêsus, là niềm hy vọng của chúng ta”
  rationale: Giữ cấu trúc cô đọng của tiếng Hy Lạp và sự nhận diện trực tiếp Đấng Mê-si-a Jêsus là niềm hy vọng của cộng đồng, không thêm động từ giải thích.
- issue: Phạm vi của “theo mệnh lệnh”
  choice: Mệnh lệnh của Đức Chúa Trời và của Đấng Mê-si-a Jêsus
  alternative: Chỉ diễn đạt rõ “mệnh lệnh của Đức Chúa Trời”, rồi nối “Đấng Mê-si-a Jêsus” ít tường minh hơn
  rationale: Hai cụm sở cách được nối bằng καί tự nhiên nhất là cùng phụ thuộc vào ἐπιταγήν. Việc lặp “của” trong tiếng Việt làm rõ cấu trúc mà không thêm nội dung.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ các thuật ngữ Kinh Thánh quen thuộc “sứ đồ”, “Đức Chúa Trời”, “Đấng Cứu Rỗi”; dùng “Đấng Mê-si-a” để dịch tước hiệu Χριστός. Dấu phẩy làm rõ hai cụm đồng vị mà không phá vỡ cấu trúc câu chào mở đầu.
