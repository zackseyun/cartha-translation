  - severity: medium
    issue: Bổ sung «được thực hiện» cho τὴν ἐν πίστει
    rationale: Nguyên văn chỉ có cụm «trong/bởi đức tin» bổ nghĩa cho οἰκονομία. Động từ bị động «được thực hiện» là diễn giải và ấn định quan hệ mà văn bản để ngỏ.
