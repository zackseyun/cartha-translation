language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: vi
  text: cũng đừng chú tâm đến những chuyện hoang đường và những gia phả vô tận; những điều ấy làm nảy sinh các suy đoán[a], hơn là sự quản trị của Đức Chúa Trời trong đức tin[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm nảy sinh tranh luận” hoặc “dẫn đến những cuộc tìm tòi.” Từ Hy Lạp có thể chỉ sự tra xét hay tranh luận, nhưng tại đây mang nghĩa tiêu cực về những suy luận không sinh ích lợi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự sắp đặt của Đức Chúa Trời,” “kế hoạch của Đức Chúa Trời,” hoặc “trách nhiệm quản lý do Đức Chúa Trời giao.” Từ Hy Lạp có thể chỉ việc quản trị, sự sắp đặt hay một trách nhiệm được giao phó.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “ở trong đức tin.” “Đức tin” tại đây cũng có thể mang sắc thái “lòng tin” hoặc “sự trung tín.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: chú tâm đến
  rationale: Diễn đạt tự nhiên hành động dành sự chú ý và gắn tâm trí vào điều gì, đồng thời tiếp nối mệnh lệnh ở câu trước.
- source_word: μύθοις
  choice: những chuyện hoang đường
  rationale: Truyền đạt sắc thái các chuyện kể không đáng tin trong ngữ cảnh giáo huấn sai lạc; tự nhiên hơn từ Hán-Việt ít thông dụng “thần thoại” ở đây.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: những gia phả vô tận
  rationale: Giữ hình ảnh gia phả và sắc thái kéo dài không có điểm dừng của ἀπεράντοις.
- source_word: ἐκζητήσεις
  choice: các suy đoán
  rationale: Trong văn cảnh tiêu cực, từ này chỉ những cuộc tìm tòi hoặc tranh luận không sinh ích lợi; “suy đoán” thể hiện kết quả tư biện mà không thu hẹp nghĩa thành tranh chấp.
- source_word: παρέχουσι
  choice: làm nảy sinh
  rationale: Diễn đạt rõ ý gây ra hoặc tạo nên trong tiếng Việt hiện đại.
- source_word: μᾶλλον ἢ
  choice: thay vì
  rationale: Thể hiện sự tương phản giữa hai kết quả hơn là chỉ một phép so sánh về mức độ.
- source_word: οἰκονομίαν θεοῦ
  choice: công việc quản trị của Đức Chúa Trời
  rationale: “Công việc quản trị” giữ nghĩa cốt lõi về sự quản lý, sắp đặt hoặc thực thi; cấu trúc sở hữu vẫn để ngỏ phần nào việc đây là sự quản trị thuộc về Đức Chúa Trời hay do Ngài giao phó.
- source_word: τὴν ἐν πίστει
  choice: được thực hiện trong đức tin
  rationale: Bổ sung “được thực hiện” để câu tiếng Việt tự nhiên, đồng thời giữ ἐν πίστει như phạm vi hoặc cách thức mà công việc quản trị diễn ra.
- source_word: πίστει
  choice: đức tin
  rationale: Đây là cách dịch mặc định, quen thuộc và phù hợp với πίστις trong văn cảnh; các sắc thái “lòng tin” và “sự trung tín” được ghi nhận ở chú thích.
theological_decisions:
- issue: Ý nghĩa của οἰκονομίαν θεοῦ
  choice: công việc quản trị của Đức Chúa Trời
  alternative: sự quản lý của Đức Chúa Trời; kế hoạch của Đức Chúa Trời; trách nhiệm quản lý do Đức Chúa Trời giao
  rationale: Cách dịch chính giữ trường nghĩa quản trị/sắp đặt mà không đồng nhất từ này với riêng một hệ thống thần học hay chỉ với một kế hoạch trừu tượng.
- issue: Ý nghĩa của πίστει trong τὴν ἐν πίστει
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: “Đức tin” phù hợp cách dùng phổ biến trong thư Phao-lô, nhưng chú thích bảo lưu khả năng từ này nhấn mạnh sự tin cậy hoặc trung tín.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang cuối câu được giữ vì mệnh đề tiếp tục từ câu 3 và dẫn sang phần kế tiếp. Các chú thích được đặt ngay sau những cụm từ tương ứng theo thứ tự xuất hiện.
