  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: vi
  text: họ muốn làm người dạy luật pháp[a], nhưng không hiểu điều họ nói, cũng không hiểu những vấn đề họ quả quyết một cách đầy tự tin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người dạy luật pháp” rất có thể chỉ những người tự nhận có thẩm quyền giảng dạy luật Do Thái (Torah).
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “không hiểu điều họ nói hay những điều họ quả quyết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες εἶναι
  choice: muốn làm
  rationale: Diễn đạt tự nhiên ý muốn đảm nhận một vai trò; phân từ hiện tại tiếp nối chủ thể ở câu trước.
- source_word: νομοδιδάσκαλοι
  choice: những người dạy luật pháp
  rationale: Giữ nghĩa của danh từ ghép là người giảng dạy luật, không đưa từ “Môi-se” hay “Torah” vào chính văn dù bối cảnh rất có thể nói đến luật Do Thái.
- source_word: μὴ νοοῦντες
  choice: nhưng lại không hiểu
  rationale: Làm rõ sắc thái tương phản hàm ẩn giữa tham vọng giảng dạy và sự thiếu hiểu biết.
- source_word: μήτε ... μήτε
  choice: cũng như
  rationale: Trong câu phủ định tiếng Việt, cấu trúc “không... cũng như...” truyền đạt tự nhiên hai đối tượng đều bị phủ định.
- source_word: ἃ λέγουσιν
  choice: điều mình nói
  rationale: Đại từ “mình” quy chiếu tự nhiên về chủ thể số nhiều “họ” và cụm từ diễn đạt nội dung lời nói.
- source_word: περὶ τίνων διαβεβαιοῦνται
  choice: những điều mình quả quyết
  rationale: “Quả quyết” chuyển tải hành vi khẳng định mạnh và đầy tin chắc; περί được thể hiện qua đối tượng nội dung của động từ trong cú pháp tiếng Việt.
theological_decisions:
- issue: Phạm vi của “luật pháp” trong νομοδιδάσκαλοι
  choice: Giữ cách gọi khái quát “luật pháp” trong chính văn.
  alternative: “Luật pháp Môi-se” hoặc “Torah”
  rationale: Bối cảnh rất có thể chỉ luật Do Thái/Torah, nhưng danh từ Hy Lạp không trực tiếp nêu “Môi-se”; cách dịch không thu hẹp điều nguyên văn để ngỏ.
- issue: Quan hệ giữa hai vế của câu
  choice: Dùng “nhưng lại” để biểu thị sự tương phản.
  alternative: 'Dịch sát hình thức: “mà không hiểu”'
  rationale: 'Phân từ μὴ νοοῦντες có sắc thái nhượng bộ/tương phản trong ngữ cảnh: họ muốn dạy nhưng không hiểu. Cách diễn đạt này làm rõ quan hệ mà không thêm một khẳng định thần học.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Luật pháp” phù hợp ngữ vực Kinh Thánh tiếng Việt nhưng vẫn thông dụng; “quả quyết” giữ được sắc thái khẳng định đầy tự tin của động từ Hy Lạp. Tất cả dấu chú thích đều xuất hiện trong chính văn.
