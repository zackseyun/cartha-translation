  to: 'Nguyện sự tôn kính và vinh quang thuộc về Vua của mọi thời đại, Đấng bất tử, vô hình, là Đức Chúa Trời duy nhất[a], cho đến đời đời. A-men.


    [a] Một số bản chép tay ghi: “Đức Chúa Trời duy nhất, khôn ngoan.”'
  rationale: Bản sửa chỉ làm rõ phạm vi của thành ngữ thời gian «đến muôn đời» và giảm mơ hồ trong cách trình bày dị bản. Chính văn vẫn theo SBLGNT, không thêm «khôn ngoan».
  reviewer_model: gpt-5.6-terra
