    issue: Vị trí của «đời đời»
    rationale: Cụm này hiện đứng sát «vinh quang», nên có thể được hiểu như một đặc tính của vinh quang hơn là phạm vi thời gian của lời quy tôn kính và vinh quang. Đặt «cho đến đời đời» cuối câu phản ánh rõ hơn εἰς τοὺς αἰῶνας τῶν αἰώνων.
  - severity: low
    issue: Cách ghi dị bản «Đức Chúa Trời khôn ngoan duy nhất»
    rationale: Cụm tiếng Việt này có thể bị đọc là «Đức Chúa Trời khôn ngoan [và] duy nhất». Dấu phẩy trong «Đức Chúa Trời duy nhất, khôn ngoan» giúp biểu thị hai tính từ của dị bản mà không thay đổi nội dung.
