id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: vi
  text: 'Nguyện sự tôn kính và vinh quang thuộc về Vua của mọi thời đại, Đấng bất tử, vô hình, là Đức Chúa Trời duy nhất[a], cho đến đời đời. A-men.


    [a] Một số bản chép tay ghi: “Đức Chúa Trời duy nhất, khôn ngoan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép tay ghi: “Đức Chúa Trời duy nhất, khôn ngoan.”'
    reason: 'Dị bản văn bản: một số chứng liệu có thêm σοφῷ (“khôn ngoan”) sau μόνῳ.'
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Vua của mọi thời đại
  rationale: Giữ rõ cấu trúc sở hữu và ý niệm αἰών, diễn tả quyền trị vì của Đức Chúa Trời xuyên suốt mọi thời đại, thay vì thu gọn thành tính từ “đời đời”.
- source_word: ἀφθάρτῳ
  choice: Đấng bất tử
  rationale: Trong ngữ cảnh nói về Đức Chúa Trời, cách dịch này tự nhiên và dễ hiểu, diễn tả Ngài không chịu sự hư nát hay cái chết.
- source_word: ἀοράτῳ
  choice: vô hình
  rationale: Phản ánh trực tiếp ý nghĩa “không thể thấy được” và phù hợp với văn phong trang trọng của lời tôn vinh.
- source_word: μόνῳ θεῷ
  choice: Đức Chúa Trời duy nhất
  rationale: Chuyển tải trực tiếp lời tuyên xưng độc thần trong bản văn SBLGNT mà không thêm từ “khôn ngoan” của dị bản.
- source_word: τιμὴ καὶ δόξα
  choice: sự tôn kính và vinh quang
  rationale: Phân biệt đúng τιμή với δόξα và giữ cặp từ trang trọng thường dùng trong lời tôn vinh.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ chỉ thời gian vô tận; tránh lối dịch từng chữ thiếu tự nhiên.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ từ phiên âm quen thuộc trong Kinh Thánh và đời sống thờ phượng tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ nối riêng
  rationale: δὲ đánh dấu sự chuyển sang lời tôn vinh; trong câu tiếng Việt này, sự chuyển ý đã rõ và việc thêm “nay” hoặc “nhưng” sẽ dễ gợi một quan hệ không có trong nguyên văn.
theological_decisions:
- issue: Cách bảo toàn lời tuyên xưng độc thần của μόνῳ θεῷ
  choice: Đức Chúa Trời duy nhất
  alternative: chỉ một mình Đức Chúa Trời
  rationale: Cách dịch được chọn theo sát cấu trúc nguyên văn, không thêm lời giải thích thần học và để nguyên sức căng thần học của câu.
- issue: Dị bản có σοφῷ (“khôn ngoan”)
  choice: Không đưa “khôn ngoan” vào chính văn
  alternative: Đức Chúa Trời khôn ngoan duy nhất
  rationale: SBLGNT không có σοφῷ; dị bản quen thuộc được ghi ở chú thích để người đọc biết mà không thay thế bản văn nguồn đã chọn.
- issue: Quan hệ cú pháp giữa các danh hiệu và lời chúc tụng
  choice: Nguyện sự tôn kính và vinh quang đời đời thuộc về…
  alternative: Kính dâng… sự tôn kính và vinh quang đời đời
  rationale: Nguyên văn dùng các cách dữ cách trong một lời chúc tụng không có động từ; cách dịch này bổ sung cấu trúc tiếng Việt tối thiểu, giữ tính chất lời nguyện chứ không biến thành mệnh lệnh trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đấng” để nối tự nhiên chuỗi thuộc tính chỉ Đức Chúa Trời; giữ “Vua của mọi thời đại” nhằm bảo toàn hình ảnh αἰών trong nguyên văn. Dấu chú thích được đặt ngay sau cụm từ chịu ảnh hưởng của dị bản.
