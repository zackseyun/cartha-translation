id: 1TI.1.6
reference: 1 Timothy 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: vi
  text: Một số người đã trệch khỏi những điều ấy[a] và quay sang những lời nói rỗng tuếch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã không đạt tới những điều ấy.” Động từ có thể mang nghĩa không trúng mục tiêu hoặc đi chệch khỏi mục tiêu.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những cuộc bàn luận vô bổ” hoặc “lời nói vô nghĩa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: khỏi những điều ấy
  rationale: Đại từ quan hệ sở hữu số nhiều chỉ ngược về các phẩm chất vừa nêu ở câu 5. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời không giới hạn sở chỉ vào một thành phần riêng lẻ.
- source_word: τινες
  choice: Một số người
  rationale: Đại từ bất định nói đến một nhóm không xác định; cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀστοχήσαντες
  choice: đã trệch khỏi
  rationale: Động từ mang hình ảnh không trúng đích hoặc lệch khỏi mục tiêu. “Trệch khỏi” giữ được hình ảnh ấy và phù hợp với bổ ngữ chỉ những điều đã nêu trước.
- source_word: ἐξετράπησαν
  choice: quay sang
  rationale: Động từ chỉ việc rời khỏi hướng đúng để chuyển theo hướng khác. “Quay sang” diễn đạt tự nhiên sự chuyển hướng đến hoạt động được nêu sau đó.
- source_word: εἰς
  choice: sang
  rationale: Giới từ đánh dấu hướng đi hoặc kết quả; trong kết hợp “quay sang”, đây là cách tương đương tự nhiên nhất.
- source_word: ματαιολογίαν
  choice: những lời nói rỗng tuếch
  rationale: Danh từ chỉ lời nói vô ích, trống rỗng, không đem lại kết quả. Cụm từ này dễ hiểu, giữ sắc thái phê phán và không mang màu sắc cổ.
theological_decisions:
- issue: Sở chỉ của ὧν
  choice: Chỉ chung về những điều vừa nêu ở câu 5, không xác định hẹp hơn trong bản văn chính.
  alternative: Có thể hiểu hẹp hơn là lòng trong sạch, lương tâm tốt và đức tin chân thành; hoặc dịch sát cấu trúc là “mà một số người đã trệch khỏi”.
  rationale: Ngữ pháp cho thấy đại từ nhìn lại văn cảnh ngay trước đó, nhưng không buộc phải tách riêng một thành phần. “Những điều ấy” giữ được liên kết mà không giải quyết quá mức phạm vi sở chỉ.
- issue: Quan hệ giữa hai động từ
  choice: Nối bằng “và”, để hành động trệch khỏi và quay sang được đặt kế tiếp nhau mà không áp đặt quan hệ nhân quả rõ hơn nguyên văn.
  alternative: Có thể diễn đạt bằng “vì… nên…”, hiểu phân từ như nêu nguyên nhân.
  rationale: Phân từ aorist có thể hàm ý hoàn cảnh hoặc nguyên nhân, nhưng nguyên văn không đánh dấu quan hệ ấy một cách hoàn toàn minh nhiên. Phép nối đơn giản bảo toàn độ mở.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Rỗng tuếch” truyền đạt sắc thái trống rỗng, vô ích của từ Hy Lạp mà không dùng thuật ngữ giáo phái; cấu trúc câu ngắn gọn vẫn giữ hai hình ảnh chuyển hướng trong nguyên văn.
