source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: vi
  text: Nhưng ân điển của Chúa chúng ta đã tuôn tràn vượt bội, cùng với đức tin và tình yêu thương trong Đấng Mê-si-a Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ”.
    reason: Cung cấp cách gọi truyền thống khác để dịch tước hiệu Hy Lạp Χριστός.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: đã tuôn tràn dư dật
  rationale: Động từ ghép nhấn mạnh mức độ vượt trội của sự đầy dẫy; cách diễn đạt này vừa tự nhiên trong tiếng Việt hiện đại vừa giữ hình ảnh tuôn tràn.
- source_word: δὲ
  choice: Nhưng
  rationale: Trong ngữ cảnh, liên từ tạo thế tương phản với tình trạng phạm thượng, bắt bớ và vô tín được nhắc đến trước đó.
- source_word: χάρις
  choice: ân điển
  rationale: Đây là thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt, chỉ ân huệ nhưng không và năng động của Chúa.
- source_word: κυρίου
  choice: Chúa
  rationale: Danh xưng này phù hợp với cách dùng κύριος trong Tân Ước và tự nhiên trong tiếng Việt.
- source_word: μετὰ
  choice: cùng với
  rationale: Giữ quan hệ ngữ pháp trực tiếp giữa ân điển tuôn tràn với đức tin và tình yêu thương, nhưng không diễn giải quá mức về quan hệ nhân quả.
- source_word: πίστεως
  choice: đức tin
  rationale: Đây là nghĩa trực tiếp và thông dụng nhất trong ngữ cảnh này.
- source_word: ἀγάπης
  choice: tình yêu thương
  rationale: Cách nói tự nhiên, trang trọng, và rõ nghĩa hơn từ đơn 'tình yêu' trong văn phong Kinh Thánh tiếng Việt.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Cụm giới từ định tính cho cả đức tin lẫn tình yêu thương. 'Đấng Mê-si-a' chuyển tải ý nghĩa tước hiệu của Χριστός.
theological_decisions:
- issue: Quan hệ giữa ân điển với đức tin và tình yêu thương
  choice: Ân điển được nói là tuôn tràn cùng với đức tin và tình yêu thương trong Đấng Mê-si-a Giê-su.
  alternative: Đức tin và tình yêu thương được diễn giải rõ là kết quả do ân điển tạo ra nơi Phao-lô.
  rationale: Cú pháp gắn μετὰ πίστεως καὶ ἀγάπης với động từ và chủ ngữ 'ân điển'; bản dịch giữ quan hệ ấy mà không áp đặt một quan hệ nhân quả vốn chỉ được hàm ý.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Giữ ý nghĩa tước hiệu 'Đấng được xức dầu' thay vì để từ này bị hiểu như một tên riêng; chú thích cung cấp cách gọi truyền thống quen thuộc.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc cô đọng của nguyên văn; 'tuôn tràn dư dật' truyền đạt sắc thái tăng cường mạnh của động từ Hy Lạp.
