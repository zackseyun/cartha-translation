  - severity: low
    issue: Lý do chú thích gọi “Đấng Christ” là “cách phiên âm truyền thống.”
    rationale: “Đấng Christ” là cách gọi/dịch truyền thống cho tước hiệu Χριστός, không đơn thuần là một cách phiên âm.
