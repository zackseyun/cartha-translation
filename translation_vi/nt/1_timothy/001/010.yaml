source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: vi
  text: những kẻ sống vô luân về tình dục, những người nam quan hệ tình dục với người nam,[a] những kẻ buôn người làm nô lệ, những kẻ nói dối, những kẻ thề gian, cùng bất cứ điều gì khác chống lại giáo huấn lành mạnh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người nam thực hành hành vi đồng tính luyến ái.” Từ Hy Lạp ἀρσενοκοῖται hiếm gặp và phạm vi nghĩa còn được tranh luận; cách dịch chính phản ánh hành vi tình dục giữa nam với nam.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: những kẻ sống vô luân về tình dục
  rationale: Từ này chỉ rộng những người thực hành sự vô luân về tình dục; cách dịch này rõ nghĩa trong tiếng Việt hiện đại và không thu hẹp vào riêng quan hệ trước hôn nhân.
- source_word: ἀρσενοκοίταις
  choice: những người nam quan hệ tình dục với người nam
  rationale: Từ ghép hiếm này có các thành tố mang nghĩa “nam” và “giường”, với hàm ý quan hệ tình dục, có lẽ vọng lại bản LXX của sách Lê-vi. Cách dịch tập trung vào hành vi nam–nam mà không đưa phạm trù bản sắc tình dục hiện đại vào bản văn.
- source_word: ἀνδραποδισταῖς
  choice: những kẻ bắt cóc người khác để bán làm nô lệ
  rationale: Từ này chỉ người bắt giữ, biến người khác thành nô lệ hoặc buôn bán họ. Cách diễn đạt nêu rõ cả hành vi cưỡng bắt lẫn mục đích nô dịch, thay vì dùng từ “bắt cóc” quá rộng.
- source_word: ψεύσταις
  choice: những kẻ nói dối
  rationale: Cách tương đương tự nhiên, trực tiếp cho danh từ số nhiều chỉ những người nói điều dối trá.
- source_word: ἐπιόρκοις
  choice: những kẻ thề gian
  rationale: Chỉ những người thề dối hoặc vi phạm lời thề; “thề gian” ngắn gọn, tự nhiên và phân biệt với hành vi nói dối nói chung vừa được kể trước đó.
- source_word: καὶ εἴ τι ἕτερον
  choice: cùng bất cứ điều gì khác
  rationale: Thành ngữ này mở rộng danh sách đến mọi điều tương tự chưa được nêu; cách dịch giữ nguyên tính mở ấy.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: giáo huấn lành mạnh
  rationale: ὑγιαίνω mang nghĩa đen là khỏe mạnh và ở đây được dùng ẩn dụ. “Giáo huấn lành mạnh” giữ hình ảnh sức khỏe và có sắc thái trang trọng, dễ hiểu.
- source_word: ἀντίκειται
  choice: chống lại
  rationale: Diễn đạt trực tiếp trạng thái đối nghịch hoặc trái với điều gì đó, phù hợp với phần kết của danh sách.
theological_decisions:
- issue: Cách dịch ἀρσενοκοίταις trong một ngữ cảnh còn tranh luận về từ vựng và thần học
  choice: những người nam quan hệ tình dục với người nam
  alternative: những người nam thực hành hành vi đồng tính luyến ái
  rationale: Bản dịch chính phản ánh đối tượng nam giới và tính chất tình dục của từ Hy Lạp nhưng tránh biến hành vi được nói đến thành một phạm trù bản sắc hay khuynh hướng tâm lý hiện đại. Vì phạm vi chính xác của từ hiếm này vẫn còn được tranh luận, chú thích ghi nhận cách dịch thay thế mà không khẳng định quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc liệt kê của nguyên văn. Dùng “giáo huấn lành mạnh” để bảo toàn ẩn dụ sức khỏe của tiếng Hy Lạp. Cụm về ἀρσενοκοῖται được diễn đạt theo hành vi, không theo bản sắc hiện đại; dấu chú thích [a] xuất hiện ngay trong chính văn.
