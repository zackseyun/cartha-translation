id: 1TI.1.18
reference: 1 Timothy 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: vi
  text: Tôi trao phó cho con lời chỉ thị này, Ti-mô-thê, theo những lời tiên tri trước đó đã được nói về con[a], để nhờ những lời ấy[b], con tiến hành cuộc chiến cao đẹp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “liên quan đến con”; hoặc “trên con”, theo nghĩa những lời tiên tri được nói trên Ti-mô-thê.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “qua những lời ấy” hoặc “trong những lời ấy”. Tiếng Hy Lạp có thể chỉ phương tiện hoặc phạm vi.'
    reason: lexical_alternative
  - marker: c
    text: 'Cách dịch truyền thống: “chiến đấu trong cuộc chiến tốt lành”. Sát nghĩa hơn, tiếng Hy Lạp nói đến việc “tiến hành một cuộc chiến” hay “tham gia một chiến dịch cao đẹp”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: lời chỉ thị
  rationale: Diễn đạt một lời chỉ dẫn có thẩm quyền và tính ủy nhiệm, nhưng không làm câu văn trở nên quá cứng như “mệnh lệnh”.
- source_word: παρατίθεμαί
  choice: trao phó
  rationale: Thể trung gian ở đây mang ý giao một trách nhiệm cho người khác đảm nhận; “trao phó” giữ được cả sắc thái tin cậy lẫn trách nhiệm.
- source_word: τέκνον
  choice: con
  rationale: Giữ nguyên cách xưng hô thân tình mang hình ảnh gia đình, không chuyển thành “con trai” vì tiếng Hy Lạp không dùng từ đặc chỉ giới tính ở đây.
- source_word: κατὰ
  choice: theo
  rationale: Diễn đạt sự phù hợp hoặc tương ứng giữa lời chỉ thị hiện tại và những lời tiên tri trước đó, đồng thời tự nhiên trong tiếng Việt.
- source_word: προαγούσας
  choice: trước đó đã được nói
  rationale: Trong ngữ cảnh, phân từ chỉ những lời tiên tri đã có từ trước; cách dịch này tránh khiến người đọc hiểu lầm là “tiên đoán trước”.
- source_word: ἐπὶ σὲ
  choice: về con
  rationale: Diễn đạt tự nhiên ý các lời tiên tri có Ti-mô-thê làm đối tượng hoặc nội dung quy chiếu, nhưng vẫn ghi nhận khả năng dịch khác trong chú thích.
- source_word: προφητείας
  choice: những lời tiên tri
  rationale: Cách nói rõ ràng, phổ thông, chỉ các sứ điệp mang tính tiên tri mà không bổ sung một lý thuyết về chức vụ hay nghi lễ.
- source_word: στρατεύῃ
  choice: tiến hành
  rationale: Kết hợp tự nhiên với “cuộc chiến” và giữ hình ảnh một chiến dịch hoặc hoạt động quân sự rộng hơn một trận đánh đơn lẻ.
- source_word: ἐν αὐταῖς
  choice: nhờ những lời ấy
  rationale: 'Hiểu ἐν theo nghĩa phương tiện: các lời tiên tri giúp Ti-mô-thê thực hiện nhiệm vụ; chú thích giữ lại khả năng chỉ phạm vi hoặc môi trường.'
- source_word: τὴν καλὴν στρατείαν
  choice: cuộc chiến cao đẹp
  rationale: Giữ hình ảnh quân sự và sắc thái καλός là tốt đẹp, cao quý; tránh thu hẹp στρατεία thành một cuộc giao đấu đơn lẻ.
theological_decisions:
- issue: Vai trò của những lời tiên tri trong sự ủy nhiệm dành cho Ti-mô-thê
  choice: Những lời tiên tri trước đó về Ti-mô-thê làm cơ sở hoặc phương tiện định hướng cho trách nhiệm Phao-lô trao phó.
  alternative: Những lời tiên tri chính thức phong chức cho Ti-mô-thê, hoặc chỉ đơn thuần khích lệ riêng ông.
  rationale: Câu Hy Lạp liên kết lời chỉ thị với các lời tiên tri, nhưng không xác định đầy đủ bản chất nghi lễ hay cơ chế phong chức; bản dịch không áp đặt một hệ thống giáo hội học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cách xưng hô “con” giữ sắc thái trìu mến của người cha thuộc linh mà không thêm “con trai” hay “thân yêu”. Hình ảnh quân sự được bảo tồn nhưng diễn đạt bằng kết hợp từ tự nhiên trong tiếng Việt.
