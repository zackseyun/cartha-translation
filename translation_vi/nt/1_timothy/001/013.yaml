  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: vi
  text: Trước kia, tôi là kẻ phạm thượng, kẻ bắt bớ và người hung bạo[a]. Nhưng tôi đã được thương xót[b], vì tôi đã hành động khi chưa hiểu biết[c] và không tin[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ngạo ngược” hoặc “kẻ tàn bạo.” Từ Hy Lạp chỉ hành vi xúc phạm và bạo lực quá đáng, không chỉ đơn thuần là kiêu ngạo.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi đã nhận được lòng thương xót.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trong sự thiếu hiểu biết” hoặc “vì không biết.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “trong sự vô tín” hoặc “trong sự bất tín.” Ở đây, nghĩa có khả năng nhất là không có đức tin hơn là bất trung với giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: trước kia tôi là
  rationale: Cụm phân từ đối cách quy chiếu về Phao-lô trong câu trước và mô tả tình trạng trước đây của ông. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ rõ ý thời gian và trạng thái.
- source_word: βλάσφημον
  choice: kẻ phạm thượng
  rationale: Tính từ được dùng như danh từ trong chuỗi mô tả con người; “kẻ phạm thượng” trực tiếp, trang trọng và dễ hiểu.
- source_word: διώκτην
  choice: kẻ bắt bớ
  rationale: Diễn đạt chuẩn cho người chủ động truy bức người khác, phù hợp với sự chống đối trước kia của Phao-lô đối với hội thánh.
- source_word: ὑβριστήν
  choice: người hung bạo
  rationale: Từ Hy Lạp chỉ người có hành vi lăng nhục, ngạo mạn và bạo lực. “Người hung bạo” truyền đạt rõ yếu tố gây hại bằng bạo lực, không thu hẹp nghĩa vào sự kiêu ngạo.
- source_word: ἠλεήθην
  choice: tôi đã được thương xót
  rationale: Giữ thể bị động của động từ Hy Lạp và hàm ý hành động thương xót đến trên Phao-lô, đồng thời là cách nói tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Giữ quan hệ nguyên nhân hoặc giải thích tự nhiên của liên từ trong ngữ cảnh, nhưng không thêm ý rằng sự thiếu hiểu biết khiến Phao-lô xứng đáng được thương xót.
- source_word: ἀγνοῶν
  choice: trong sự thiếu hiểu biết
  rationale: Diễn tả hoàn cảnh nhận thức trong đó hành động xảy ra; chú thích bảo lưu cách hiểu gần với lực phân từ là “khi chưa hiểu biết.”
- source_word: ἐποίησα
  choice: tôi đã hành động
  rationale: Động từ không có tân ngữ rõ ràng ở đây; “hành động” tự nhiên hơn “đã làm” và nối thích hợp với cụm chỉ hoàn cảnh.
- source_word: ἐν ἀπιστίᾳ
  choice: trong sự vô tín
  rationale: Trong ngữ cảnh này, ἀπιστία chủ yếu chỉ tình trạng không tin. “Vô tín” cô đọng và trang trọng; chú thích nêu cách diễn đạt thông dụng hơn để tránh che mất sắc thái.
theological_decisions:
- issue: Quan hệ do ὅτι dẫn vào giữa lòng thương xót và hành động thiếu hiểu biết trong vô tín
  choice: Dịch là “vì,” giữ quan hệ nguyên nhân hoặc giải thích của câu Hy Lạp.
  alternative: Hiểu đây chỉ là hoàn cảnh giải thích, không phải lý do của việc được thương xót.
  rationale: ὅτι tự nhiên mang nghĩa nguyên nhân/giải thích. Bản dịch không nói rằng sự thiếu hiểu biết lập công hay khiến Phao-lô xứng đáng được thương xót; nó để nguyên sức căng thần học của lời tuyên bố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc liệt kê được giữ gọn; dấu chấm tách hai vế cho tự nhiên trong tiếng Việt. Các thuật ngữ “phạm thượng,” “bắt bớ,” “hung bạo,” “thương xót” quen thuộc nhưng không lệ thuộc vào cách diễn đạt riêng của một hệ phái.
