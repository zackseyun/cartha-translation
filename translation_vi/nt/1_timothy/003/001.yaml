revisions:
- from: 'Lời này đáng tin cậy: nếu ai mong muốn công việc giám sát[a], người ấy ao ước một công việc tốt đẹp.[b]'
  to: 'Lời này đáng tin cậy: nếu ai ao ước việc giám sát[a], thì người ấy mong muốn một công việc tốt đẹp[b].'
  rationale: Chỉnh «công việc giám sát» thành «việc giám sát» để bảo toàn phạm vi nghĩa của ἐπισκοπή và phân biệt nó với ἔργον ở vế sau. Các cách dịch thay thế quan trọng, tính khái quát của «nếu ai», và tính không giáo phái của bản văn chính được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:33Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc và ý chính của câu Hy Lạp. Tuy nhiên, «công việc giám sát» cho ἐπισκοπῆς dễ hòa lẫn với καλοῦ ἔργου («một công việc tốt đẹp») ở vế sau. Dịch «việc giám sát» giữ được nghĩa giám sát/vai trò giám sát của danh từ này mà không biến nó thành một chức phẩm giáo hội về sau.
  naturalness: Câu sửa vẫn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. «Ao ước» và «mong muốn» phản ánh song song hai động từ Hy Lạp mà không cần gán giới tính cho τις.
  terminology: «Việc giám sát» duy trì liên hệ từ vựng với ἐπίσκοπος trong văn mạch tiếp theo, đồng thời không áp đặt thuật ngữ «giám mục» vào bản văn chính. «Công việc tốt đẹp» bảo toàn trọng tâm của ἔργον là công việc/nhiệm vụ hơn là địa vị.
  issues:
  - severity: medium
    issue: «công việc giám sát» làm mờ sự phân biệt giữa ἐπισκοπῆς và καλοῦ ἔργου.
    rationale: Trong tiếng Việt, cả hai vế đều trở thành «công việc», trong khi nguyên văn trước hết nói đến việc/sự giám sát (hoặc vai trò giám sát), rồi xác nhận đó là một công việc tốt đẹp. Dùng «việc giám sát» giữ được phân biệt này rõ hơn.
