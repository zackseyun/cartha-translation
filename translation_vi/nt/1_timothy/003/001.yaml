  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: vi
  text: 'Lời này đáng tin cậy: nếu ai ao ước việc giám sát[a], thì người ấy mong muốn một công việc tốt đẹp[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chức vụ người giám sát”; theo cách gọi truyền thống: “chức giám mục.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “một nhiệm vụ cao quý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Lời này đáng tin cậy
  rationale: Cụm này là một công thức trong các thư Mục vụ, xác nhận điều được nói là đáng tin. “Lời này” tự nhiên trong tiếng Việt và không thu hẹp λόγος thành một từ đơn lẻ.
- source_word: εἴ τις
  choice: nếu ai
  rationale: τις là đại từ bất định mang nghĩa khái quát; “nếu ai” phản ánh đúng câu Hy Lạp mà không tự thêm giới tính vào chính cụm này.
- source_word: ἐπισκοπῆς
  choice: công việc giám sát
  rationale: ἐπισκοπή có thể chỉ sự giám sát hoặc vai trò của người giám sát. Cách dịch này giữ trọng tâm ở trách nhiệm phục vụ, đồng thời tránh áp đặt cơ cấu giáo phẩm hình thành về sau.
- source_word: ὀρέγεται
  choice: mong muốn
  rationale: Động từ diễn tả việc hướng tới hoặc khao khát đạt được điều gì; “mong muốn” là cách nói tự nhiên, không cường điệu sắc thái.
- source_word: καλοῦ ἔργου
  choice: một công việc tốt đẹp
  rationale: Giữ rõ danh từ ἔργον là “công việc” và chuyển tải καλός với sắc thái tốt, đáng quý.
- source_word: ἐπιθυμεῖ
  choice: ao ước
  rationale: “Ao ước” thể hiện ἐπιθυμέω là lòng mong muốn và duy trì sự song hành về ý nghĩa với ὀρέγεται mà không dùng lại cùng một từ.
theological_decisions:
- issue: Có nên dịch ἐπισκοπῆς bằng thuật ngữ chỉ một chức phẩm giáo hội hình thành về sau hay không
  choice: công việc giám sát
  alternative: chức vụ giám mục; chức vụ người giám sát
  rationale: Danh từ Hy Lạp có phạm vi nghĩa rộng hơn thuật ngữ giáo phẩm về sau. Bản dịch chính giữ sự liên hệ với nhiệm vụ giám sát và không mặc nhiên xác định một mô hình tổ chức giáo hội.
- issue: Có nên diễn đạt εἴ τις theo giới tính nam hay không
  choice: nếu ai ... người ấy
  alternative: nếu một người nam ... người ấy
  rationale: Bản thân τις là đại từ bất định khái quát. Cách diễn đạt trung tính giữ đúng mức độ xác định của câu này, không dùng riêng cụm ấy để giải quyết câu hỏi về giới tính của người giám sát trong văn mạch rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh đại từ giới tính mà vẫn giữ chủ thể số ít. Các chú thích bảo tồn những khả năng dịch quan trọng của ἐπισκοπή và καλός.
