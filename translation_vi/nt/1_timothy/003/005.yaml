id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: vi
  text: (Nhưng nếu ai không biết cách quản lý gia đình mình, thì người ấy sẽ chăm lo cho hội thánh của Đức Chúa Trời thế nào?[a])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hội chúng của Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện εἰ cùng sắc thái chuyển ý nhẹ của δέ một cách tự nhiên trong tiếng Việt.
- source_word: τις
  choice: ai
  rationale: Đại từ bất định, chỉ một ứng viên giám mục nói chung mà không thêm ý không có trong chính từ này.
- source_word: τοῦ ἰδίου οἴκου
  choice: chính gia đình mình
  rationale: οἶκος ở đây chỉ đơn vị gia đình thuộc trách nhiệm của người ấy, không chỉ căn nhà; “chính… mình” giữ sắc thái sở hữu nhấn mạnh của ἴδιος.
- source_word: προστῆναι
  choice: quản lý
  rationale: Trong ngữ cảnh này, động từ chỉ việc lãnh đạo và đảm trách gia đình; “quản lý” thể hiện trách nhiệm thực tế mà không làm câu mang sắc thái chuyên quyền.
- source_word: οὐκ οἶδεν
  choice: không biết cách
  rationale: οἶδα đi với động từ nguyên mẫu diễn tả việc biết cách thực hiện điều gì.
- source_word: πῶς
  choice: thì làm sao… sẽ
  rationale: Giữ hình thức câu hỏi tu từ và hướng tương lai của mệnh đề Hy Lạp.
- source_word: ἐκκλησίας θεοῦ
  choice: hội thánh của Đức Chúa Trời
  rationale: Cách dịch quen thuộc, trang trọng của cấu trúc sở hữu, thích hợp với ngữ cảnh cộng đồng đức tin.
- source_word: ἐπιμελήσεται
  choice: sẽ chăm lo cho
  rationale: Diễn đạt sự quan tâm chu đáo và việc đáp ứng nhu cầu, đồng thời phân biệt với động từ “quản lý” ở mệnh đề trước.
theological_decisions:
- issue: Mối liên hệ giữa việc lãnh đạo gia đình và chăm sóc hội thánh
  choice: Dùng “quản lý” cho gia đình và “chăm lo” cho hội thánh.
  alternative: Dùng cùng một động từ “lãnh đạo” cho cả hai mệnh đề, hoặc dùng “cai quản” cho gia đình.
  rationale: Bản Hy Lạp dùng hai động từ khác nhau, προΐστημι và ἐπιμελέομαι. Giữ sự phân biệt này bảo toàn phép so sánh nhưng không đồng nhất việc chăm sóc hội thánh với quyền cai trị.
- issue: Cách diễn đạt chủ thể bất định và giống ngữ pháp
  choice: Dùng “ai” rồi “người ấy”.
  alternative: Dùng “một người đàn ông… ông ấy” hoặc cách nói số nhiều trung tính.
  rationale: τις là đại từ bất định. Tiếng Việt không bắt buộc đánh dấu giống trong đại từ hồi chỉ; “người ấy” tự nhiên, không phủ nhận bối cảnh đang nói về ứng viên giám mục và cũng không thêm chữ “đàn ông” vào chính câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dấu ngoặc của câu nguồn; dùng “hội thánh” theo cách gọi quen thuộc trong tiếng Việt Cơ Đốc, còn nghĩa gần với “hội chúng” được ghi ở chú thích.
