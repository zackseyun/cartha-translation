  terminology: “Quản lý,” “chăm lo,” và “hội thánh của Đức Chúa Trời” phù hợp ngữ cảnh và giữ được sắc thái phân biệt của hai động từ Hy Lạp. Chú thích về “hội chúng” là một khả năng từ vựng, dù “hội thánh” phù hợp hơn trong văn cảnh thư tín.
