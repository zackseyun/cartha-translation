id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: vi
  text: Vì những người đã phục vụ tốt có được cho mình một vị thế tốt đẹp và sự dạn dĩ lớn lao[a] trong đức tin nơi Đấng Mê-si-a Giê-su[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự tự tin lớn lao”; từ Hy Lạp này có thể chỉ sự dạn dĩ, tự tin hoặc thẳng thắn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong sự trung tín nơi Đấng Mê-si-a Giê-su”. Từ Hy Lạp πίστις có thể mang nghĩa “đức tin”, “sự tin cậy” hoặc “sự trung tín”.
    reason: alternative_reading
  - marker: c
    text: Từ Hy Lạp Christos nghĩa là “Đấng Mê-si-a” hay “Đấng Được Xức Dầu”; ở đây từ này được dùng như một tước hiệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: những người phục vụ tốt
  rationale: Động từ có nghĩa là phục vụ hoặc thi hành công việc phục vụ. Cách dịch này phù hợp với ngữ cảnh nói về các chấp sự nhưng không đưa thẳng tên chức vụ vào chính động từ.
- source_word: βαθμὸν ... καλὸν
  choice: một địa vị tốt đẹp
  rationale: βαθμός có thể chỉ bậc, vị trí hoặc địa vị. Trong ngữ cảnh này, cụm từ nói đến vị thế đáng trọng có được nhờ phục vụ tốt, chứ không nhất thiết là một cấp bậc chính thức.
- source_word: περιποιοῦνται
  choice: sẽ có được cho mình
  rationale: Giữ được sắc thái quy về chủ thể của thể trung và diễn đạt tự nhiên một chân lý có tính khái quát trong tiếng Việt.
- source_word: παρρησίαν
  choice: lòng dạn dĩ
  rationale: Từ này có thể biểu thị sự dạn dĩ, tự tin hoặc thẳng thắn. “Lòng dạn dĩ” giữ được sức mạnh của từ mà vẫn tự nhiên trong ngữ cảnh đức tin.
- source_word: πίστει
  choice: đức tin
  rationale: “Đức tin” là nghĩa phù hợp nhất trong mạch văn, nhưng sắc thái “sự trung tín” vẫn có thể có và được ghi nhận trong chú thích.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: nơi Đấng Mê-si-a Giê-su
  rationale: Cụm giới từ bổ nghĩa cho “đức tin”. “Nơi” diễn đạt tự nhiên mối liên hệ của đức tin với Đấng Mê-si-a Giê-su mà không thêm ý giải thích vượt quá nguyên văn.
- source_word: Χριστῷ
  choice: Đấng Mê-si-a
  rationale: Χριστός mang chức năng tước hiệu; “Đấng Mê-si-a” truyền đạt nghĩa của tước hiệu rõ hơn là phiên âm truyền thống.
theological_decisions:
- issue: Nghĩa của πίστις trong cụm ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: đức tin
  alternative: sự trung tín
  rationale: Cụm từ có thể nói đến đức tin gắn với Đấng Mê-si-a Giê-su, và đây là cách hiểu tự nhiên hơn trong ngữ cảnh. Tuy nhiên, πίστις cũng có thể mang nghĩa “sự trung tín”, nên khả năng ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc dễ hiểu đối với độc giả phổ thông. “Phục vụ” tránh áp đặt chức danh vào động từ; “địa vị tốt đẹp” truyền đạt hình ảnh ẩn dụ của βαθμός mà không hàm ý thăng cấp trong phẩm trật. Các dấu chú thích [a], [b], [c] đều được đặt trong câu chính.
