  - severity: low
    issue: Cách diễn đạt “lòng dạn dĩ lớn lao”
    rationale: Cụm này kém tự nhiên hơn “sự dạn dĩ lớn lao”; sửa đổi không làm thay đổi sắc thái của παρρησίαν.
