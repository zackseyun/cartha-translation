  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: vi
  text: phải khéo lãnh đạo gia đình mình[a], có con cái biết vâng phục, một cách hết sức nghiêm trang[b][c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khéo quản trị gia đình mình” hoặc “khéo cai quản nhà mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “giữ con cái trong sự vâng phục” hoặc “giữ con cái trong khuôn phép.”'
    reason: lexical_alternative
  - marker: c
    text: Cụm từ “một cách hết sức nghiêm trang” có thể mô tả cách con cái vâng phục hoặc cung cách người ấy lãnh đạo toàn thể gia đình.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: gia đình mình
  rationale: οἶκος ở đây chỉ gia đình hoặc toàn thể người trong nhà thuộc phạm vi chăm nom của người ấy; “gia đình mình” tự nhiên trong tiếng Việt và giữ được ý sở hữu của ἰδίου.
- source_word: καλῶς
  choice: khéo
  rationale: καλῶς diễn tả cách thực hiện tốt, đúng đắn. Trong cụm “khéo lãnh đạo”, từ này truyền đạt năng lực và cách hành xử thích đáng, không chỉ một đánh giá đạo đức chung.
- source_word: προϊστάμενον
  choice: lãnh đạo
  rationale: προΐστημι chỉ việc đứng đầu, hướng dẫn và chịu trách nhiệm trông nom. “Lãnh đạo” giữ được thẩm quyền thực sự nhưng không mang sắc thái chuyên chế của “cai trị”.
- source_word: τέκνα ἔχοντα ἐν ὑποταγῇ
  choice: giữ con cái trong sự vâng phục
  rationale: Cách dịch này phản ánh cấu trúc ἔχοντα ... ἐν ὑποταγῇ và danh từ ὑποταγή, diễn tả con cái ở trong nề nếp thuận phục mà không thu hẹp ý nghĩa thành sự kiểm soát bên ngoài.
- source_word: μετὰ πάσης σεμνότητος
  choice: với mọi sự nghiêm trang
  rationale: σεμνότης bao hàm vẻ nghiêm trang, đứng đắn và đáng kính. “Với mọi sự nghiêm trang” giữ sắc thái đạo đức và không quyết định dứt khoát cụm này mô tả sự vâng phục của con cái hay toàn bộ cách quản trị gia đình.
theological_decisions:
- issue: Phạm vi của ngôn ngữ lãnh đạo gia đình
  choice: Câu này nói đến việc người dự kiến làm giám mục phải có trách nhiệm lãnh đạo gia đình mình.
  alternative: Hiểu theo nghĩa cai trị gia trưởng mạnh hơn, hoặc làm nhẹ đi thành việc chăm sóc mà không có thẩm quyền.
  rationale: Các phân từ và danh từ ὑποταγή cho thấy có thẩm quyền và trật tự thực sự, nhưng câu này là một tiêu chuẩn dành cho người giám sát, không phải là một trình bày đầy đủ về mọi hình thức thẩm quyền trong gia đình.
- issue: Phạm vi bổ nghĩa của μετὰ πάσης σεμνότητος
  choice: Giữ vị trí cụm từ sao cho không ấn định dứt khoát đối tượng được mô tả.
  alternative: Chỉ gắn “với mọi sự nghiêm trang” với sự vâng phục của con cái, hoặc chỉ gắn với cách người ấy lãnh đạo gia đình.
  rationale: Cú pháp Hy Lạp cho phép hiểu cụm này mô tả cách con cái vâng phục hoặc rộng hơn là cung cách quản trị gia đình; bản dịch bảo tồn sự nhập nhằng chân thực ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khéo lãnh đạo” diễn đạt sự quản trị có trách nhiệm mà không quá hành chính hay chuyên chế; “sự nghiêm trang” giữ sắc thái phẩm giá, đứng đắn của σεμνότης. Các dấu chú thích đều xuất hiện trong chính văn.
