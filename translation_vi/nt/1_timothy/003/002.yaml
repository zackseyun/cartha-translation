- from: Vì vậy, người giám sát phải không có gì đáng chê trách, là chồng của một người vợ[a], tiết độ, tự chủ, đoan trang, hiếu khách và có khả năng dạy dỗ.
  to: Vì vậy, người giám sát phải không có gì đáng chê trách, là chồng của một phụ nữ[a], tiết độ, tự chủ, đứng đắn, hiếu khách và có khả năng dạy dỗ.
