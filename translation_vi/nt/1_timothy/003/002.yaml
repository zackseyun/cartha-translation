reference: 1 Timothy 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: vi
  text: Vì vậy, người giám sát phải không có gì đáng chê trách, là chồng của một phụ nữ[a], tiết độ, tự chủ, đứng đắn, hiếu khách và có khả năng dạy dỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “người đàn ông một vợ” hoặc “người đàn ông chỉ gắn bó với một phụ nữ.” Cụm từ này có thể nhấn mạnh sự chung thủy trong hôn nhân chứ không chỉ nói đến tình trạng hôn nhân.'
    reason: Giữ lại cách hiểu thay thế của một thành ngữ Hy Lạp có ý nghĩa còn được tranh luận.
lexical_decisions:
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt yêu cầu mang tính cần thiết, không chỉ là một lời khuyên.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận với phần trình bày ngay trước đó.
- source_word: ἐπίσκοπον
  choice: người giám sát
  rationale: Chuyển dịch chức danh theo nghĩa trực tiếp, tránh đưa thuật ngữ giáo hội hình thành về sau vào bản văn.
- source_word: ἀνεπίλημπτον
  choice: không có gì đáng chê trách
  rationale: Diễn đạt việc không có cơ sở chính đáng để cáo buộc hay khiển trách, mà không hàm ý người ấy hoàn toàn vô tội hoặc không bao giờ phạm lỗi.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: là chồng của một người vợ
  rationale: Giữ cấu trúc và cách nói chỉ nam giới của tiếng Hy Lạp, đồng thời không tự ý quyết định rằng cụm từ chỉ nói về tình trạng hôn nhân hay chủ yếu nhấn mạnh sự chung thủy.
- source_word: νηφάλιον
  choice: tiết độ
  rationale: Ở đây từ này chỉ trạng thái tỉnh táo, chừng mực trong tâm trí và cách sống, không chỉ giới hạn ở việc kiêng rượu.
- source_word: σώφρονα
  choice: tự chủ
  rationale: Nêu bật khả năng làm chủ phán đoán và hành vi; đồng thời phân biệt tương đối với phẩm chất tiết độ đứng trước.
- source_word: κόσμιον
  choice: đoan trang
  rationale: Diễn đạt tư cách đúng mực, có trật tự và đáng tôn trọng bằng một từ tự nhiên trong danh sách phẩm chất.
- source_word: φιλόξενον
  choice: hiếu khách
  rationale: Cách dịch ngắn gọn, quen thuộc cho phẩm chất sẵn lòng tiếp đón khách, kể cả người xa lạ.
- source_word: διδακτικόν
  choice: có khả năng dạy dỗ
  rationale: Diễn đạt năng lực thích hợp để giảng dạy, thay vì chỉ nói đến sự sẵn lòng dạy.
theological_decisions:
- issue: Cách hiểu cụm μιᾶς γυναικὸς ἄνδρα trong các tiêu chuẩn dành cho người giám sát
  choice: Dịch sát trong chính văn là “là chồng của một người vợ”
  alternative: “người đàn ông chỉ gắn bó với một người nữ” hoặc “chung thủy với vợ”
  rationale: Cụm từ có thể nhấn mạnh lòng chung thủy trong hôn nhân, loại trừ việc đa thê, hoặc liên quan đến những hạn chế về tái hôn. Bản chính giữ cách diễn đạt gần nguyên văn và ghi cách hiểu khác trong chú thích để không âm thầm giải quyết một vấn đề còn được tranh luận.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Danh sách phẩm chất được diễn đạt cô đọng; chức danh ἐπίσκοπος được dịch theo chức năng là “người giám sát” thay vì dùng một danh xưng giáo phẩm về sau.
