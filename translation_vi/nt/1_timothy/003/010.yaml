reference: 1 Timothy 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: vi
  text: Những người này cũng phải được xem xét trước; sau đó, hãy để họ phục vụ,[b] nếu họ không có gì đáng trách.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không chỗ trách được” hoặc “không bị cáo buộc.” Cụm từ này nói đến việc không có căn cứ chính đáng để cáo buộc họ, chứ không có nghĩa là họ hoàn toàn không phạm tội.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “phục vụ với tư cách chấp sự,” vì văn cảnh đang nói về tiêu chuẩn của chấp sự. Tuy nhiên, động từ Hy Lạp ở đây chỉ nói “phục vụ”; danh xưng chức vụ không được nêu trong mệnh đề này.
    reason: contextual_clarification
lexical_decisions:
- source_word: οὗτοι
  choice: những người này cũng
  rationale: Giữ lại sắc thái chỉ định của đại từ và quan hệ bổ sung với nhóm đang được bàn đến trong văn cảnh.
- source_word: δοκιμαζέσθωσαν
  choice: phải được xem xét
  rationale: Động từ chỉ việc thử hoặc xem xét nhằm xác định tư cách thích hợp; “xem xét” tự nhiên trong ngữ cảnh tuyển chọn người phục vụ và vẫn giữ dạng bị động.
- source_word: πρῶτον … εἶτα
  choice: trước … sau đó
  rationale: 'Diễn đạt rõ trình tự: việc xem xét phải diễn ra trước khi họ được phép phục vụ.'
- source_word: διακονείτωσαν
  choice: thì mới cho họ phục vụ với tư cách chấp sự
  rationale: Động từ có nghĩa căn bản là “phục vụ”; văn cảnh trực tiếp nói về các chấp sự nên cụm từ này làm rõ chức năng theo văn cảnh, còn chú thích bảo lưu cách dịch khái quát hơn.
- source_word: ἀνέγκλητοι
  choice: không có điều gì đáng bị cáo trách
  rationale: Diễn tả tình trạng không có căn cứ chính đáng để buộc tội hay khiển trách, chứ không hàm ý hoàn toàn vô tội hoặc không bao giờ phạm tội.
- source_word: ὄντες
  choice: nếu … thì mới
  rationale: Chuyển phân từ sang cấu trúc điều kiện tự nhiên trong tiếng Việt, thể hiện rằng tư cách không đáng bị cáo trách là điều kiện đi kèm việc cho phép phục vụ.
theological_decisions:
- issue: Nên hiểu διακονείτωσαν theo nghĩa phục vụ nói chung hay theo chức vụ chấp sự
  choice: phục vụ với tư cách chấp sự
  alternative: phục vụ
  rationale: Văn cảnh ngay trước và sau đang nêu tiêu chuẩn cho chấp sự, vì vậy sắc thái chức vụ là hợp lý; chú thích vẫn nêu nghĩa từ vựng rộng hơn để không che khuất điều nguyên văn chỉ hàm ý theo văn cảnh.
- issue: ἀνέγκλητοι có hàm ý sự hoàn hảo vô tội hay không
  choice: không có điều gì đáng bị cáo trách
  alternative: không chỗ trách được
  rationale: Từ này nói đến việc không có lời cáo buộc chính đáng, không đòi hỏi sự hoàn hảo tuyệt đối không phạm tội.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Cấu trúc “thì mới cho họ” truyền đạt tự nhiên mệnh lệnh ngôi thứ ba và trình tự xét duyệt; tránh từ ngữ giáo phái hoặc thuật ngữ cổ khó hiểu.
