revisions:
- from: Những người này cũng phải được xem xét trước; sau đó, nếu không có điều gì đáng bị cáo trách,[a] thì mới cho họ phục vụ với tư cách chấp sự.[b]
  to: Những người này cũng phải được xem xét trước; sau đó, hãy để họ phục vụ,[b] nếu họ không có gì đáng trách.[a]
  rationale: Sửa bản văn chính để dịch trực tiếp động từ διακονέω là “phục vụ”, đồng thời tránh đưa danh xưng chức vụ và một cơ chế cấp phép cụ thể vào chỗ nguyên văn không nói rõ. Cấu trúc “nếu họ không có gì đáng trách” là cách tiếng Việt rõ ràng để diễn đạt phân từ đi kèm, còn chú thích bảo lưu cả phương án dịch và mối liên hệ chức vụ do văn cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo diễn đạt đúng trình tự “trước ... sau đó” và ý được khảo xét. Tuy nhiên, “thì mới cho họ phục vụ với tư cách chấp sự” vừa thêm rõ ràng danh xưng/chức vụ không có trong mệnh đề Hy Lạp, vừa làm cấu trúc mệnh lệnh trở thành một quyết định cấp phép có điều kiện mạnh hơn nguyên văn. Động từ διακονείτωσαν nên được dịch là “phục vụ”; sắc thái liên hệ đến chấp sự thuộc văn cảnh và có thể nêu ở chú thích. Phân từ ἀνέγκλητοι ὄντες có thể được diễn đạt tự nhiên như một điều kiện kèm theo (“nếu họ không có gì đáng trách”), không hàm ý vô tội tuyệt đối.
  naturalness: “Những người này cũng” là cách nói hiện đại, tự nhiên trong văn cảnh. Câu sửa giữ văn phong trang trọng, rõ ràng; “hãy để họ phục vụ” chuyển mệnh lệnh ngôi ba một cách tự nhiên hơn mà không áp đặt chủ thể cấp phép cụ thể.
  terminology: “Không có gì đáng trách” truyền đạt ἀνέγκλητοι theo nghĩa không có cáo buộc chính đáng, tránh hàm ý hoàn hảo vô tội. Không đưa “chấp sự” vào thân câu vì từ này không xuất hiện trong câu Hy Lạp; chú thích có thể giải thích liên hệ văn cảnh mà không biến hàm ý thành nội dung được nói trực tiếp.
  issues:
  - severity: medium
    issue: Thêm “với tư cách chấp sự” vào bản văn chính.
    rationale: διακονείτωσαν là động từ “phục vụ”; dù văn cảnh nói về chấp sự, câu này không nêu danh từ chức vụ. Sự liên hệ văn cảnh nên được bảo lưu trong chú thích.
  - severity: medium
    issue: “thì mới cho họ phục vụ” làm mạnh và cụ thể hóa quan hệ cú pháp.
    rationale: Nguyên văn dùng hai mệnh lệnh ngôi ba, tiếp theo là phân từ “đang là/ở tình trạng không đáng trách”. Cấu trúc này không chỉ rõ một chủ thể có thẩm quyền “cho phép”, và “thì mới” định hình quan hệ điều kiện mạnh hơn cần thiết.
  revised_text: Những người này cũng phải được xem xét trước; sau đó, hãy để họ phục vụ,[b] nếu họ không có gì đáng trách.[a]
