    issue: “trong thần linh” cho ἐν πνεύματι
    rationale: “Thần linh” trong tiếng Việt hiện đại thường chỉ tính chất/điều thuộc linh hoặc các thần linh, nên không tự nhiên như một đối ứng cú pháp với πνεύματι và có thể làm mờ sự song hành với “trong thân xác”. “Trong thần” bảo lưu tốt hơn tính cô đọng và mơ hồ của bản văn.
  - severity: low
