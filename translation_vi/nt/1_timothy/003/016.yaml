  to: 'Và mọi người đều công nhận rằng mầu nhiệm của lòng tin kính thật lớn lao:


    Ngài[a] đã được tỏ ra trong thân xác,

    được minh chứng là công chính trong thần,[b]

    được các thiên sứ trông thấy,

    được rao giảng giữa các dân tộc,[c]

    được tin nhận trong thế gian,

    được cất lên trong vinh quang.[d]'
  rationale: 'Chỉnh sửa tối thiểu để tăng độ tự nhiên và độ chính xác: thay “ai cũng phải công nhận” bằng cách diễn đạt không thêm sắc thái bắt buộc; thay “trong thần linh” bằng “trong thần” để không diễn giải quá mức ἐν πνεύματι; làm gọn “được chứng minh” thành “được minh chứng”; và chuyển neo chú thích dị bản về ngay sau “Ngài”. Nghĩa của câu và các mơ hồ văn bản/thần học đều được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
