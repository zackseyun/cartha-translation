  - severity: low
    issue: Vị trí neo chú thích dị bản [a]
    rationale: Chú thích [a] liên quan trực tiếp đến đại từ mở đầu khúc tuyên xưng; nên đặt ngay sau “Ngài” thay vì ở cuối đoạn để neo chú thích rõ ràng.
