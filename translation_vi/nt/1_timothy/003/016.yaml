reference: 1 Timothy 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: vi
  text: 'Và mọi người đều công nhận rằng mầu nhiệm của lòng tin kính thật lớn lao:


    Ngài[a] đã được tỏ ra trong thân xác,

    được minh chứng là công chính trong thần,[b]

    được các thiên sứ trông thấy,

    được rao giảng giữa các dân tộc,[c]

    được tin nhận trong thế gian,

    được cất lên trong vinh quang.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Đức Chúa Trời đã được tỏ ra trong thân xác”, thay vì “Ngài đã được tỏ ra trong thân xác”. Bản văn Hy Lạp phê bình đọc một đại từ quan hệ giống đực, có thể dịch là “Đấng mà/Ngài”, như được phản ánh trong bản dịch này.'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “được minh chứng là công chính bởi Đức Thánh Linh” hoặc “trong Thánh Linh”. Cụm từ Hy Lạp súc tích, có thể chỉ tác động của Đức Thánh Linh hoặc bình diện thuộc linh.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “được rao giảng giữa dân ngoại.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “được cất lên vào vinh quang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: ai cũng phải công nhận rằng
  rationale: Diễn đạt tự nhiên ý nghĩa một điều được công khai và rộng rãi thừa nhận, thay vì chỉ nhấn mạnh tính không thể phủ nhận.
- source_word: μέγα ἐστὶν
  choice: thật lớn lao
  rationale: Giữ sắc thái nhấn mạnh của vị ngữ đứng trước trong tiếng Hy Lạp bằng từ “thật”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: mầu nhiệm của lòng tin kính
  rationale: “Mầu nhiệm” diễn tả chân lý của Đức Chúa Trời từng ẩn giấu nay được bày tỏ; “lòng tin kính” phù hợp với cách dùng εὐσέβεια trong các thư Mục vụ.
- source_word: Ὃς
  choice: Ngài
  rationale: Đại từ quan hệ giống đực của bản văn phê bình chỉ một nhân vật; “Ngài” tiếp nối khúc tuyên xưng cách tự nhiên mà không thay đại từ bằng dị bản “Đức Chúa Trời”.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: đã được tỏ ra trong thân xác
  rationale: Giữ thể thụ động và ý nghĩa được biểu lộ công khai; “trong thân xác” diễn tả sự hiện hữu thực sự của con người mà vẫn giữ cấu trúc súc tích.
- source_word: ἐδικαιώθη
  choice: được chứng minh là công chính
  rationale: Trong ngữ cảnh này, động từ nói đến việc được xác nhận hoặc chứng tỏ là đúng và công chính, không phải được biến đổi từ bất chính thành công chính.
- source_word: ἐν πνεύματι
  choice: trong thần linh
  rationale: Giữ sự súc tích và phần nào tính mơ hồ của cụm từ không có mạo từ; chú thích nêu rõ khả năng chỉ tác nhân là Đức Thánh Linh.
- source_word: ὤφθη ἀγγέλοις
  choice: được các thiên sứ trông thấy
  rationale: Giữ dạng bị động của ὤφθη và hiểu ἀγγέλοις là các hữu thể thiên giới trong văn cảnh Kitô học.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: được rao giảng giữa các dân tộc
  rationale: “Rao giảng” giữ sắc thái công bố; “các dân tộc” rộng hơn “dân ngoại” và phản ánh trực tiếp ἔθνεσιν.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: được tin nhận trong thế gian
  rationale: “Tin nhận” tự nhiên trong tiếng Việt khi đối tượng là một ngôi vị, đồng thời giữ cấu trúc bị động và phản ứng đối với Đấng được rao giảng.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: được cất lên trong vinh quang
  rationale: Giữ thể thụ động và không quyết định quá mức liệu ἐν biểu thị hoàn cảnh “trong vinh quang” hay đích đến “vào vinh quang”.
theological_decisions:
- issue: 'Dị bản mở đầu khúc tuyên xưng: Ὃς, θεός hay ὅ'
  choice: Dịch Ὃς của SBLGNT bằng đại từ nhân xưng “Ngài”
  alternative: “Đức Chúa Trời đã được tỏ ra trong thân xác” hoặc “điều đã được tỏ ra trong thân xác”
  rationale: Bản văn nguồn đọc Ὃς (“Đấng/người mà”), không phải θεός (“Đức Chúa Trời”). “Ngài” tự nhiên trong tiếng Việt và giữ tham chiếu cá nhân đến Đấng Christ; dị bản có ý nghĩa lịch sử được ghi ở chú thích thay vì đưa vào chính văn.
- issue: Ý nghĩa của ἐν πνεύματι
  choice: Dịch trung tính là “trong thần linh”
  alternative: “bởi Đức Thánh Linh” hoặc “trong Thánh Linh”
  rationale: Cụm Hy Lạp có thể chỉ tác động của Đức Thánh Linh hoặc bình diện/trạng thái thuộc linh tương phản với “thân xác”. Chính văn không nên âm thầm giải quyết sự mơ hồ thần học này.
- issue: Giá trị của δικαιόω khi nói về Đấng Christ
  choice: “được chứng minh là công chính”
  alternative: “được xưng công chính” hoặc “được biện minh”
  rationale: Ở đây động từ không hàm ý Đấng Christ vốn bất chính rồi mới trở nên công chính, nhưng nói đến việc sự công chính của Ngài được xác nhận hoặc bày tỏ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và có nhịp điệu tuyên xưng gồm sáu vế song song. Tránh thuật ngữ cổ khó hiểu, nhưng giữ “mầu nhiệm”, “lòng tin kính”, “thiên sứ” và “vinh quang” vì đây là các từ thần học quen thuộc, dễ hiểu. Các dấu chú thích đều xuất hiện trong chính văn; [a] được đặt cuối khúc để không làm đứt nhịp ngay sau “Ngài”, còn nội dung chú thích nói rõ nó liên quan đến từ mở đầu.
