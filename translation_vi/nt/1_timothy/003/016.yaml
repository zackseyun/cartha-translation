  source_fidelity: Bản dịch nhìn chung bám sát SBLGNT, giữ đúng sáu mệnh đề bị động và xử lý phù hợp dị bản Ὃς. Tuy nhiên, “trong thần linh” không phải cách diễn đạt tự nhiên hay trung tính cho ἐν πνεύματι trong tiếng Việt; nó dễ chuyển nghĩa sang một khái niệm trừu tượng và không tương ứng tốt với sự mơ hồ của nguyên ngữ. “trong thần” giữ tính ngắn gọn, song vẫn cần chú thích nêu các cách hiểu khác.
  naturalness: “Ai cũng phải công nhận rằng” tự nhiên nhưng hơi mạnh ở “phải”; ὁμολογουμένως nhấn vào sự được công nhận chung hơn là sự bắt buộc. “Mọi người đều công nhận rằng” tự nhiên và sát hơn. “Được chứng minh là công chính” rõ nghĩa, nhưng “được minh chứng là công chính” gọn và hợp nhịp văn tuyên xưng hơn. Các phần còn lại tự nhiên, trang trọng và nhất quán.
  terminology: Giữ “mầu nhiệm”, “lòng tin kính”, “thiên sứ”, “vinh quang” là phù hợp. Dùng “thần” viết thường trong chính văn để không áp đặt cách hiểu là Đức Thánh Linh; chú thích có thể nêu “bởi Đức Thánh Linh” và “trong Thánh Linh”.
  issues:
