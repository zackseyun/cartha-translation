  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của nguyên văn: μὴ νεόφυτον là “không được là người mới tin”; τυφωθεὶς được truyền đạt là “trở nên kiêu căng”; và ἐμπέσῃ εἰς κρίμα τοῦ διαβόλου là “sa vào sự phán xét của ma quỷ.” Cụm sở hữu cách τοῦ διαβόλου vẫn được giữ mơ hồ trong bản văn chính, phù hợp với nguyên ngữ và audit trail tiếng Anh.'
