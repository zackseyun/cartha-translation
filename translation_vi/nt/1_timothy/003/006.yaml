reference: 1 Timothy 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: vi
  text: 'Người ấy không được là người mới tin, kẻo trở nên kiêu căng và sa vào sự phán xét của ma quỷ.[a]


    [a] Cũng có thể hiểu là “chịu cùng một sự kết án như ma quỷ”; hoặc “sa vào sự phán xét có liên quan đến ma quỷ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chịu cùng một sự kết án như ma quỷ”; hoặc “sa vào sự phán xét có liên quan đến ma quỷ.”
    reason: Nêu các cách hiểu khác do sở hữu cách τοῦ διαβόλου có quan hệ ngữ nghĩa không hoàn toàn xác định.
lexical_decisions:
- source_word: νεόφυτον
  choice: người mới tin
  rationale: Từ này có nghĩa đen là “mới được trồng”, được dùng theo nghĩa ẩn dụ về người mới đến với đức tin. “Người mới tin” tự nhiên, rõ nghĩa và phù hợp với văn cảnh hội thánh.
- source_word: τυφωθεὶς
  choice: trở nên kiêu căng
  rationale: Động từ diễn tả việc bị lòng tự phụ làm cho phồng lên. Cách dịch này truyền đạt rõ ý trong tiếng Việt hiện đại mà không thêm một nguyên nhân ngoài điều từ ngữ hàm chứa.
- source_word: κρίμα
  choice: sự phán xét
  rationale: κρίμα có thể chỉ sự phán xét hoặc sự kết án. “Sự phán xét” rộng hơn và giúp bảo tồn tính mơ hồ của cụm từ.
- source_word: τοῦ διαβόλου
  choice: của ma quỷ
  rationale: Sở hữu cách Hy Lạp có thể chỉ sự phán xét mà ma quỷ phải chịu hoặc sự phán xét có liên quan đến ma quỷ. Cách dịch sát này không tự ý giải quyết sự mơ hồ.
- source_word: ἐμπέσῃ
  choice: sa vào
  rationale: Giữ được hình ảnh rơi vào một tình trạng hoặc hậu quả nguy hiểm, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἵνα μὴ
  choice: kẻo
  rationale: Diễn đạt ngắn gọn và tự nhiên ý mục đích hoặc kết quả cần tránh trong lời cảnh báo.
theological_decisions:
- issue: Ý nghĩa của cụm εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: 'Giữ cách diễn đạt mơ hồ: “sa vào sự phán xét của ma quỷ”'
  alternative: “chịu cùng một sự kết án như ma quỷ” hoặc “sa vào sự phán xét có liên quan đến ma quỷ”
  rationale: Cấu trúc τοῦ διαβόλου cho phép nhiều quan hệ ngữ nghĩa hợp lý. Bản văn chính giữ nguyên sức căng của nguyên ngữ, còn chú thích nêu các cách hiểu chính mà không khẳng định một cách mang tính giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người ấy” nối tự nhiên với người đang được xét làm giám mục/người coi sóc trong văn cảnh; “ma quỷ” là cách gọi phổ thông, trang nghiêm. Dấu chú thích được đặt ngay sau cụm từ thực sự có cách hiểu khác.
