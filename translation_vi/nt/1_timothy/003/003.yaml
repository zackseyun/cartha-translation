lexical_decisions:
- source_word: πάροινον
  choice: nghiện rượu
  rationale: Từ này chỉ người thường xuyên sa vào rượu chè hoặc nghiện rượu; cách dịch ngắn gọn này diễn đạt một thói tính, không phải chỉ một lần uống rượu.
- source_word: πλήκτην
  choice: hung bạo
  rationale: Nghĩa đen liên quan đến người đánh kẻ khác; “hung bạo” tự nhiên trong tiếng Việt và giữ được ý về khuynh hướng dùng bạo lực.
- source_word: ἐπιεικῆ
  choice: ôn hòa
  rationale: Từ này có sắc thái dịu dàng, khoan dung và biết điều; “ôn hòa” phù hợp với danh sách phẩm chất và đối lập tự nhiên với tính hung bạo.
- source_word: ἄμαχον
  choice: không hay gây gổ
  rationale: Từ này phủ định khuynh hướng tranh đấu hoặc cãi cọ; cách dịch này rõ nghĩa, tự nhiên và giữ nguyên hình thức phủ định của tiếng Hy Lạp.
- source_word: ἀφιλάργυρον
  choice: không ham tiền
  rationale: Từ ghép này phủ định lòng yêu tiền bạc; “không ham tiền” diễn đạt trực tiếp động cơ bên trong, thay vì chỉ nói đến hành vi tham lợi.
