translation:
  language: vi
  text: không nghiện rượu[a], không hung bạo[b], nhưng ôn hòa, không hay gây gổ[c], không ham tiền[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không mê rượu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “không phải là người đánh người.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hiếu hòa” hoặc “không thích tranh đấu.”'
