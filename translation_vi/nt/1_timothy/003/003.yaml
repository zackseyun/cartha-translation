  source_fidelity: 'Bản dịch chuyển đạt đầy đủ năm phẩm chất trong tiếng Hy Lạp: không sa mê rượu (μὴ πάροινον), không bạo lực/đánh người (μὴ πλήκτην), ôn hòa (ἀλλὰ ἐπιεικῆ), không thích gây gổ (ἄμαχον), và không ham tiền (ἀφιλάργυρον). Các phủ định và thế đối lập với “nhưng” được giữ rõ.'
