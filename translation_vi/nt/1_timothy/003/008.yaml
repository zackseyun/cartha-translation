  rationale: Chỉ sửa cách dịch αἰσχροκερδεῖς để bảo toàn nét nghĩa ‘đáng xấu hổ/đê hèn’ thay vì giới hạn vào tính ‘bất chính’, và làm tự nhiên hơn một chú thích. Các lựa chọn còn lại giữ nguyên vì sát nguồn và phù hợp tiếng Việt hiện đại.
