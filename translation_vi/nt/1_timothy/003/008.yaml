  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: vi
  text: Các chấp sự cũng vậy, phải là người đáng kính, không ăn nói hai mặt[a], không ham uống nhiều rượu[b], không tham lợi lộc đáng hổ thẹn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không nói với người này một đằng, với người kia một nẻo.”
    reason: lexical_alternative
  - marker: b
    text: Hay “không say mê nhiều rượu.”
    reason: lexical_alternative
  - marker: c
    text: Hay “không chạy theo lợi lộc đáng hổ thẹn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: các chấp sự
  rationale: Trong danh sách phẩm chất song song với các giám nhiệm ở những câu trước, từ này chỉ một vai trò được công nhận trong hội thánh. “Chấp sự” giữ được nét nghĩa chức vụ mà không áp đặt cơ cấu giáo phái về sau.
- source_word: ὡσαύτως
  choice: cũng vậy
  rationale: Diễn tả sự tiếp nối với các tiêu chuẩn dành cho giám nhiệm, đồng thời chuyển sang một nhóm phục vụ khác; cách nói này ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: σεμνούς
  choice: người đáng kính
  rationale: Diễn đạt tư cách đứng đắn, đáng tôn trọng, nhưng không khiến người đọc hiểu thành vẻ nghiêm khắc hay buồn bã.
- source_word: μὴ διλόγους
  choice: không ăn nói hai mặt
  rationale: Thành ngữ tiếng Việt này chuyển tải hình ảnh “hai lời” theo nghĩa bất nhất, giả dối trong lời nói, tránh cách “không nói hai lời” vốn dễ bị hiểu là biết giữ lời hứa.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: không ham uống nhiều rượu
  rationale: “Ham” diễn tả sự gắn bó hoặc chuyên chú quá mức của προσέχω, còn “nhiều” giữ lại từ πολλῷ; cách dịch không áp đặt khái niệm lâm sàng hiện đại như “nghiện”.
- source_word: μὴ αἰσχροκερδεῖς
  choice: không tham lợi bất chính
  rationale: Bao quát cả lòng ham lợi và tính chất đê hèn, đáng chê trách của cách kiếm lợi; câu chữ tự nhiên, súc tích và có sức nặng đạo đức.
theological_decisions:
- issue: Thuật ngữ chỉ chức vụ hội thánh của διάκονος
  choice: Dịch là “chấp sự”, chỉ một vai trò được công nhận trong hội thánh
  alternative: đầy tớ; người phục vụ
  rationale: Ngữ cảnh là danh sách tiêu chuẩn cho các vai trò trong hội thánh, trước hết là giám nhiệm rồi đến chấp sự. “Chấp sự” bảo toàn tính cụ thể của ngữ cảnh nhưng không đưa thêm các đặc điểm tổ chức thuộc những truyền thống giáo phái về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc liệt kê được giữ gọn và cân đối; “ăn nói hai mặt” là thành ngữ phổ thông, còn các thuật ngữ đạo đức tránh sắc thái cổ hoặc biệt ngữ giáo phái.
