  text: Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ⸂ἐν τάχει⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: vi
  text: Tôi viết những điều này cho con, hy vọng sẽ sớm[a] đến với con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhanh chóng” hoặc “trong một thời gian ngắn.”'
    reason: Giữ lại phạm vi nghĩa của ἐν τάχει, vốn có thể nhấn mạnh thời điểm sớm hoặc tốc độ nhanh.
lexical_decisions:
- source_word: Ταῦτά
  choice: những điều này
  rationale: Giữ số nhiều trung tính của đại từ chỉ định và quy chiếu tự nhiên đến toàn bộ những lời chỉ dẫn trong phần trước.
- source_word: σοι
  choice: cho con
  rationale: Dativus đi với γράφω chỉ người nhận thư. Trong quan hệ Phao-lô–Ti-mô-thê, “con” là cách xưng hô tự nhiên, trang trọng vừa phải và phù hợp ngữ cảnh thư tín.
- source_word: γράφω
  choice: Tôi viết
  rationale: Thì hiện tại mang sắc thái hiện tại thư tín; tiếng Việt dùng “Tôi viết” tự nhiên hơn dạng tiếp diễn mà vẫn diễn đạt hành động đang được thực hiện trong thư.
- source_word: ἐλπίζων
  choice: và hy vọng
  rationale: Phân từ hiện tại diễn tả hoàn cảnh đi kèm với động từ chính. Dùng liên từ giúp câu tiếng Việt tự nhiên mà không làm tăng mức độ chắc chắn của niềm hy vọng.
- source_word: ἐλθεῖν
  choice: đến
  rationale: Động từ nguyên mẫu với πρὸς σέ diễn tả chuyển động đến chỗ người nhận thư.
- source_word: πρὸς σὲ
  choice: với con
  rationale: Kết hợp với “đến” thành “đến với con”, diễn đạt tự nhiên hướng chuyển động về phía người nhận.
- source_word: ἐν τάχει
  choice: sớm
  rationale: Thành ngữ có thể chỉ thời điểm gần (“sớm”) hoặc cách thức nhanh chóng (“nhanh chóng”); trong ngữ cảnh dự định thăm viếng, “sớm” tự nhiên nhất.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “tôi… con” phản ánh quan hệ giữa tác giả và Ti-mô-thê mà không thêm danh xưng không có trong câu Hy Lạp. Dấu chú thích được đặt ngay sau cụm từ mà nó giải thích.
