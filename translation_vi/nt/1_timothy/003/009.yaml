id: 1TI.3.9
reference: 1 Timothy 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: vi
  text: giữ vững lẽ mầu nhiệm của đức tin với một lương tâm trong sạch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “giữ lẽ mầu nhiệm của đức tin trong một lương tâm trong sạch.”
    reason: Bảo lưu cách dịch sát hình thức hơn của ἔχοντας (“giữ”) và ἐν (“trong”).
lexical_decisions:
- source_word: ἔχοντας
  choice: giữ vững
  rationale: Phân từ hiện tại bổ nghĩa cho các chấp sự được nói đến ở câu trước. “Giữ vững” diễn đạt việc tiếp tục nắm giữ và trung thành với điều mình tin, tự nhiên hơn cách dịch thuần sở hữu là “có”.
- source_word: τὸ μυστήριον
  choice: lẽ mầu nhiệm
  rationale: Trong cách dùng của Phao-lô, từ này thường chỉ chân lý của Đức Chúa Trời từng được che giấu nhưng nay đã được bày tỏ. “Lẽ mầu nhiệm” giữ được thuật ngữ truyền thống mà không hàm ý đây là điều mãi mãi không thể biết.
- source_word: τῆς πίστεως
  choice: của đức tin
  rationale: 'Mạo từ và văn cảnh về tiêu chuẩn của chấp sự thiên về nghĩa khách quan: nội dung đức tin Cơ Đốc. Cách dịch vẫn giữ nguyên từ “đức tin”, không diễn giải quá mức thành một hệ thống giáo lý.'
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: với một lương tâm trong sạch
  rationale: “Với” là cách diễn đạt tự nhiên trong tiếng Việt cho hoàn cảnh hoặc phẩm chất đi kèm; “lương tâm trong sạch” chuyển tải rõ ý nghĩa đạo đức của καθαρός và συνείδησις.
theological_decisions:
- issue: Ý nghĩa của τῆς πίστεως
  choice: nội dung của đức tin Cơ Đốc (“của đức tin”)
  alternative: hành động tin hoặc lòng tin chủ quan
  rationale: Trong văn cảnh về tư cách phục vụ trong hội thánh, cụm từ này nhiều khả năng nói đến chân lý đức tin mà các chấp sự phải nắm giữ. Bản dịch không thêm từ ngữ khiến cách hiểu này trở thành một thuật ngữ giáo phái cứng nhắc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lẽ mầu nhiệm” phù hợp ngữ cảnh thần học, còn “lương tâm trong sạch” là thành ngữ tự nhiên trong tiếng Việt hiện đại.
