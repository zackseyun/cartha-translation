revisions:
- from: Người ấy cũng phải được những người ở bên ngoài[a] làm chứng tốt về mình, để khỏi rơi vào cảnh bị chê trách[b] và cạm bẫy của ma quỷ.[c]
  to: Người ấy cũng phải có lời chứng tốt từ những người ở bên ngoài[a], để khỏi rơi vào sự sỉ nhục[b] và cạm bẫy của ma quỷ.[c]
  rationale: Thay “được những người ở bên ngoài làm chứng tốt về mình” bằng “có lời chứng tốt từ những người ở bên ngoài” để tiếng Việt tự nhiên mà vẫn bảo toàn nghĩa của μαρτυρίαν καλὴν ἔχειν ἀπό. Thay “cảnh bị chê trách” bằng “sự sỉ nhục” để phản ánh đầy đủ hơn sắc thái của ὀνειδισμός. Các phần còn lại, gồm sự mơ hồ có kiểm soát trong “những người ở bên ngoài” và cách hiểu “ma quỷ” có chú thích thay thế, được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: tính bắt buộc của δεῖ, sự thêm vào của καί, lời chứng thuận từ người ngoài, mục đích phủ định, sự sỉ nhục và cạm bẫy của ma quỷ. Tuy nhiên, “bị chê trách” làm yếu ὀνειδισμός, vốn chỉ sự sỉ nhục, ô nhục hoặc điều đáng hổ thẹn trước công chúng, hơn là chỉ bị phê bình.'
  naturalness: “Được những người ở bên ngoài làm chứng tốt về mình” có thể hiểu được nhưng không tự nhiên trong tiếng Việt hiện đại. “Có lời chứng tốt từ những người bên ngoài” vừa rõ vừa giữ sát cấu trúc và nghĩa của μαρτυρίαν καλὴν ἔχειν.
  terminology: “Cạm bẫy của ma quỷ” phù hợp với παγίδα τοῦ διαβόλου và giữ cách hiểu προσωπικό của διάβολος mà không áp đặt thêm diễn giải. “Sự sỉ nhục” diễn đạt ὀνειδισμός chính xác hơn “cảnh bị chê trách.” Chú thích vẫn bảo lưu lựa chọn “kẻ vu khống” cho διάβολος.
  issues:
