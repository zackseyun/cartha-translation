  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: vi
  text: Người ấy cũng phải có lời chứng tốt từ những người ở bên ngoài[a], để khỏi rơi vào sự sỉ nhục[b] và cạm bẫy của ma quỷ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người ngoài.” Cụm từ này chỉ những người không thuộc cộng đồng tín hữu.
    reason: lexical_alternative
  - marker: b
    text: Hay “rơi vào cảnh ô nhục.”
    reason: lexical_alternative
  - marker: c
    text: Hay “cạm bẫy của kẻ vu khống,” nếu διάβολος được hiểu theo nghĩa thông thường hơn; ở đây từ này được hiểu là “ma quỷ.”
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt rõ tính cần thiết và bắt buộc của tiêu chuẩn dành cho người giám sát.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Nối câu này với các tiêu chuẩn trước và thêm một yêu cầu nữa; tiếng Việt không cần dịch δέ bằng một liên từ riêng ở đây.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: được ... làm chứng tốt về mình
  rationale: Giữ ý nghĩa lời chứng hoặc sự xác nhận thuận lợi, đồng thời tự nhiên hơn trong tiếng Việt so với cách nói sát chữ “có một lời chứng tốt từ”.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: từ những người ở bên ngoài
  rationale: Giữ hình ảnh và phạm vi chưa nói tường minh của nguyên văn; chú thích giải thích đây là những người ngoài cộng đồng tín hữu.
- source_word: ἵνα μὴ
  choice: để khỏi
  rationale: Cách diễn đạt tự nhiên, gọn và vẫn bảo toàn sắc thái mục đích hoặc kết quả phủ định.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: rơi vào cảnh bị chê trách
  rationale: Giữ động từ ẩn dụ “rơi vào” và phương diện bị công khai trách cứ; chú thích bảo lưu khả năng hiểu theo nghĩa ô nhục.
- source_word: παγίδα
  choice: cạm bẫy
  rationale: Diễn đạt rõ hình ảnh một phương tiện dùng để bẫy bắt và phù hợp với văn phong Kinh Thánh hiện đại.
- source_word: τοῦ διαβόλου
  choice: của ma quỷ
  rationale: Hiểu διάβολος là nhân vật ác cá nhân, tức ma quỷ, theo cách dùng phổ biến trong Tân Ước; cấu trúc sở hữu phản ánh trực tiếp sở hữu cách Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của τοῦ διαβόλου
  choice: ma quỷ, tức nhân vật ác cá nhân
  alternative: kẻ vu khống
  rationale: Mạo từ cùng cách dùng phổ biến của διάβολος trong các thư Mục vụ và Tân Ước nghiêng về ma quỷ/Sa-tan. Tuy vậy, nghĩa từ vựng “kẻ vu khống” vẫn có thể được cân nhắc trong ngữ cảnh nói đến sự chê trách, nên được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “người ấy” nối với người giám sát được nói đến trong ngữ cảnh. Cách diễn đạt tránh bổ sung trực tiếp “hội thánh” vào câu chính, đồng thời dùng chú thích để làm rõ đối tượng của “những người ở bên ngoài” và bảo lưu các khả năng từ vựng có thật.
