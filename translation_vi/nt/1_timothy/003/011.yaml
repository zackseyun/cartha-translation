id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: vi
  text: Cũng vậy, các phụ nữ phải đáng kính[a], không vu khống, tiết độ, trung tín trong mọi sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cũng vậy, các người vợ phải đáng kính…” Từ Hy Lạp γυναῖκας có thể chỉ “các phụ nữ” hoặc “các người vợ” trong ngữ cảnh này; bản văn không nói rõ “vợ của họ”.'
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: các phụ nữ
  rationale: γυνή có thể mang nghĩa “phụ nữ” hoặc “vợ”. Bản văn không có sở hữu từ tương đương với “của họ”, nên chọn nghĩa rộng trong chính văn và ghi nghĩa “các người vợ” ở chú thích.
- source_word: ὡσαύτως
  choice: cũng vậy
  rationale: Diễn đạt tự nhiên mối liên kết song song với những tiêu chuẩn nêu trước đó.
- source_word: σεμνάς
  choice: đáng kính
  rationale: Thể hiện phẩm chất nghiêm trang, đáng tôn trọng của σεμνός bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: μὴ διαβόλους
  choice: không vu khống
  rationale: Ở đây διάβολος chỉ hành vi hoặc tính cách hay cáo gian, nói xấu, chứ không phải danh xưng “Ma Quỷ”.
- source_word: νηφαλίους
  choice: tiết độ
  rationale: Bao quát ý tỉnh táo, chừng mực và tự chủ của νηφάλιος, đồng thời phù hợp với văn phong của danh sách phẩm chất.
- source_word: πιστὰς
  choice: trung tín
  rationale: Giữ được sắc thái vừa trung thành vừa đáng tin cậy của πιστός trong ngữ cảnh phẩm hạnh.
- source_word: ἐν πᾶσιν
  choice: trong mọi sự
  rationale: Phản ánh trực tiếp phạm vi bao quát của cụm từ Hy Lạp.
theological_decisions:
- issue: Đối tượng được chỉ bởi γυναῖκας trong danh sách tiêu chuẩn
  choice: các phụ nữ
  alternative: các người vợ; các vợ của họ
  rationale: Từ Hy Lạp có thể chỉ phụ nữ nói chung hoặc người vợ. Vì bản văn không nói rõ “của họ”, chính văn không thêm quan hệ sở hữu; chú thích giữ lại cách hiểu “các người vợ” để không giải quyết thay cho độc giả một điểm còn tranh luận.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ dạng súc tích của một danh sách phẩm chất; “các phụ nữ” cùng chú thích bảo tồn sự mơ hồ thực sự của nguyên bản.
