  terminology: “Đáng kính,” “vu khống,” “tiết độ,” và “trung tín” là các lựa chọn nhất quán, tự nhiên và không áp đặt một cách giải thích giáo phái nào. Cách dùng “các phụ nữ” trong chính văn cùng chú thích “các người vợ” giữ được điểm mơ hồ quan trọng của γυναῖκας.
