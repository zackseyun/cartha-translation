  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: vi
  text: Các chấp sự phải là những người một vợ[a], quản lý tốt con cái và gia đình mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người chỉ gắn bó với một phụ nữ.” Cụm từ này có thể nhấn mạnh lòng chung thủy trong hôn nhân; một số người hiểu cụ thể hơn là không được đa thê hoặc tái hôn.'
    reason: Giữ lại các cách hiểu hợp lý của thành ngữ Hy Lạp mà không giải quyết thay cho nguyên văn.
lexical_decisions:
- source_word: διάκονοι
  choice: các chấp sự
  rationale: Trong ngữ cảnh các tiêu chuẩn phục vụ Hội Thánh, từ này chỉ một chức vụ được nhìn nhận, chứ không chỉ nói chung về người phục vụ.
- source_word: ἔστωσαν
  choice: phải là
  rationale: Thể mệnh lệnh hiện tại mang tính quy chuẩn; “phải là” diễn đạt tự nhiên sức nặng của yêu cầu.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: người chồng của một vợ
  rationale: Cách dịch sát cấu trúc Hy Lạp, giữ ngôn ngữ chỉ nam giới và không tự quyết định rằng câu này chỉ nói về chung thủy, đa thê hay tái hôn.
- source_word: τέκνων
  choice: con cái
  rationale: Ngữ cảnh và cấu trúc song song với “gia đình mình” cho thấy đây là con cái thuộc phạm vi họ chăm nom; tiếng Việt không cần lặp đại từ sở hữu.
- source_word: καλῶς
  choice: tốt
  rationale: Diễn đạt trực tiếp và tự nhiên ý nghĩa của trạng từ bổ nghĩa cho việc quản lý.
- source_word: προϊστάμενοι
  choice: biết quản lý
  rationale: Từ này nói đến việc đứng đầu và thực hiện sự chăm nom có trách nhiệm. “Biết quản lý” tự nhiên trong ngữ cảnh gia đình mà vẫn giữ ý về năng lực lãnh đạo.
- source_word: τῶν ἰδίων οἴκων
  choice: gia đình mình
  rationale: Ở đây οἶκος nói đến đơn vị gia đình/hộ gia đình, không chỉ căn nhà vật chất. “Gia đình mình” là cách nói tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của μιᾶς γυναικὸς ἄνδρες trong tiêu chuẩn dành cho chức vụ Hội Thánh
  choice: Dịch sát là “người chồng của một vợ” và giải thích sự đa nghĩa trong chú thích.
  alternative: “người chỉ gắn bó với một phụ nữ”, “chung thủy với vợ”, hoặc “chỉ kết hôn một lần”
  rationale: Cụm từ Hy Lạp ngắn gọn và có thể được hiểu theo nhiều hướng. Bản dịch chính giữ cách diễn đạt gần nguyên văn để không áp đặt một kết luận hệ phái về sự chung thủy, đa thê hoặc tái hôn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng thuật ngữ chức vụ quen thuộc “chấp sự”; giữ câu ngắn gọn và tính quy chuẩn của danh sách tiêu chuẩn.
