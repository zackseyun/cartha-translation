revisions:
- from: Nhưng nếu tôi chậm đến, thì những điều này là để anh biết người ta phải cư xử thế nào trong gia đình của Đức Chúa Trời, tức là hội chúng của Đức Chúa Trời hằng sống[a], trụ cột và chỗ dựa của chân lý[b].
  to: Nhưng nếu tôi đến chậm, thì tôi viết những điều này để anh biết người ta phải cư xử thế nào trong gia đình của Đức Chúa Trời, tức là hội chúng[a] của Đức Chúa Trời hằng sống, trụ cột và chỗ dựa của chân lý[b].
  rationale: Bản sửa làm rõ động từ “viết” được hiểu từ câu trước, nhờ đó mệnh đề mục đích của câu 15 tự nhiên và trung thành với văn mạch Hy Lạp. Đồng thời, chú thích về ἐκκλησία được chuyển đến đúng từ neo. Không thay đổi ý nghĩa của các cụm còn lại hay áp đặt diễn giải giáo phái.
