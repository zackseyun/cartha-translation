id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: vi
  text: Nhưng nếu tôi đến chậm, thì tôi viết những điều này để anh biết người ta phải cư xử thế nào trong gia đình của Đức Chúa Trời, tức là hội chúng[a] của Đức Chúa Trời hằng sống, trụ cột và chỗ dựa của chân lý[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hội chúng” cũng thường được dịch theo truyền thống là “Hội Thánh.”
    reason: lexical_alternative
  - marker: b
    text: Từ được dịch là “chỗ dựa” cũng có thể hiểu là “nền móng”, “bệ đỡ” hoặc “thành lũy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: tôi chậm đến
  rationale: Động từ dùng theo nghĩa nội động từ trong ngữ cảnh, nói đến việc Phao-lô chậm đến chứ không phải tính chậm chạp về đạo đức. Thêm “đến” làm rõ ý đã hàm chứa và tự nhiên trong tiếng Việt.
- source_word: ἵνα εἰδῇς
  choice: thì những điều này là để anh biết
  rationale: Mệnh đề mục đích dựa vào hành động viết đã nêu ở câu trước. Cách diễn đạt này nối ý tự nhiên mà không biến mục đích thành kết quả chắc chắn.
- source_word: δεῖ ... ἀναστρέφεσθαι
  choice: người ta phải cư xử thế nào
  rationale: Đại từ bất định “người ta” giữ được tính khái quát của dạng vô nhân xưng với động từ nguyên mẫu; “phải” truyền đạt sự cần thiết có tính chuẩn mực, còn “cư xử” chỉ nếp sống và hành vi.
- source_word: ἐν οἴκῳ θεοῦ
  choice: trong gia đình của Đức Chúa Trời
  rationale: οἶκος có thể chỉ nhà hoặc gia đình/hộ gia đình. Phần đồng vị tiếp theo xác định đây là cộng đồng dân Chúa, nên “gia đình” tránh khiến độc giả chỉ nghĩ đến một tòa nhà.
- source_word: ἥτις
  choice: tức là
  rationale: Đại từ quan hệ mang chức năng giải thích và đồng vị với “gia đình của Đức Chúa Trời”; “tức là” thể hiện rõ quan hệ ấy trong tiếng Việt.
- source_word: ἐκκλησία
  choice: hội chúng
  rationale: Từ này cơ bản chỉ cộng đồng được triệu tập hay quy tụ. “Hội chúng” nhấn mạnh con người cấu thành cộng đồng, đồng thời tránh giới hạn ý nghĩa vào cơ cấu hoặc địa điểm; cách dịch truyền thống được ghi ở chú thích.
- source_word: θεοῦ ζῶντος
  choice: của Đức Chúa Trời hằng sống
  rationale: Cách nói trang trọng, tự nhiên và quen thuộc trong tiếng Việt, giữ nguyên sự nhấn mạnh rằng Đức Chúa Trời là Đấng sống.
- source_word: στῦλος
  choice: trụ cột
  rationale: Giữ nguyên hình ảnh kiến trúc và diễn đạt tự nhiên vai trò nâng đỡ, làm vững chắc.
- source_word: ἑδραίωμα
  choice: chỗ dựa
  rationale: Danh từ hiếm này chỉ điều làm cho vững hoặc nâng đỡ. “Chỗ dựa” rõ nghĩa trong tiếng Việt và không quyết định quá mức giữa các khả năng “nền móng”, “thành lũy” hay “bệ đỡ”.
- source_word: τῆς ἀληθείας
  choice: của chân lý
  rationale: “Chân lý” diễn đạt tự nhiên danh từ xác định trong ngữ cảnh và phù hợp với văn phong trang trọng.
theological_decisions:
- issue: Cách dịch ἐκκλησία trong ngữ cảnh hội thánh
  choice: hội chúng
  alternative: Hội Thánh; cộng đồng
  rationale: “Hội chúng” giữ trọng tâm nơi cộng đồng dân Đức Chúa Trời được quy tụ mà không phủ nhận ý nghĩa hội thánh. Chú thích bảo lưu cách gọi truyền thống quen thuộc.
- issue: Quan hệ giữa οἶκος θεοῦ và ἐκκλησία θεοῦ ζῶντος
  choice: Dịch ἥτις bằng “tức là”, xác định gia đình Đức Chúa Trời chính là hội chúng của Ngài
  alternative: Dùng đại từ quan hệ “là nơi” hoặc “mà”
  rationale: Cú pháp Hy Lạp đặt hai cụm từ trong quan hệ giải thích/đồng vị, không mô tả một tòa nhà chứa hội chúng.
- issue: Ý nghĩa của “trụ cột và ἑδραίωμα của chân lý”
  choice: trụ cột và chỗ dựa của chân lý
  alternative: trụ cột và nền móng của chân lý; trụ cột và thành lũy của chân lý
  rationale: Bản dịch giữ nguyên lời khẳng định mạnh mẽ của câu về vai trò của hội chúng đối với chân lý, nhưng không giải thích thêm rằng hội chúng tạo ra, sở hữu độc quyền hay là nguồn tối hậu của chân lý.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh” phù hợp với lời Phao-lô trực tiếp nói với Ti-mô-thê; “người ta” giữ chủ thể khái quát của cấu trúc Hy Lạp. “Gia đình” và “hội chúng” làm rõ rằng câu nói về cộng đồng con người chứ không chủ yếu về một công trình kiến trúc.
