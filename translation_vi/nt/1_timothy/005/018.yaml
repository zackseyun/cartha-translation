base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: vi
  text: 'Vì Kinh Thánh nói: “Đừng bịt mõm con bò đang đạp lúa,”[a] và: “Người làm công đáng được nhận tiền công của mình.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang giẫm để đập lúa.” Phân từ Hy Lạp chỉ con bò đang thực hiện việc đạp hoặc giẫm để tách hạt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Người lao động xứng đáng nhận thù lao của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Vì Kinh Thánh nói
  rationale: Dịch γάρ là “Vì” để giữ quan hệ giải thích với câu trước; ἡ γραφή chỉ lời Kinh Thánh có thẩm quyền, còn thì hiện tại λέγει được diễn đạt tự nhiên là “nói”.
- source_word: Βοῦν ἀλοῶντα
  choice: con bò đang đạp lúa
  rationale: βοῦς chỉ con bò dùng trong lao động nông nghiệp; ἀλοῶντα mô tả nó đang giẫm, đạp để tách hạt khỏi bông. “Đạp lúa” vừa cụ thể vừa phù hợp bối cảnh cổ đại.
- source_word: οὐ φιμώσεις
  choice: Đừng khớp mõm
  rationale: Thì tương lai ở đây có lực cấm đoán. “Đừng” là cách diễn đạt mệnh lệnh cấm tự nhiên trong tiếng Việt; “khớp mõm” là cách nói chuẩn về việc buộc dụng cụ ngăn con vật ăn.
- source_word: καί
  choice: và
  rationale: Giữ nguyên chức năng liên kết hai lời trích dẫn.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Người làm công đáng
  rationale: ἐργάτης là người lao động; trong câu châm ngôn về thù lao, “người làm công” diễn đạt rõ mối quan hệ giữa công việc và tiền công.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: được trả tiền công mình
  rationale: μισθός ở đây là khoản thù lao do lao động, không phải phần thưởng trừu tượng. Cấu trúc “đáng được trả” tự nhiên hơn trong tiếng Việt và “mình” quy chiếu về chủ thể số ít mà không làm thay đổi ý nghĩa.
theological_decisions:
- issue: Phạm vi của ἡ γραφή đối với hai lời trích dẫn
  choice: Đặt cả hai lời dưới công thức mở đầu “Kinh Thánh nói” mà không giải thích thêm về quy điển.
  alternative: Chỉ coi lời thứ nhất là Kinh Thánh, còn lời thứ hai là tục ngữ hoặc lời của Chúa Giê-su.
  rationale: Cú pháp của câu trình bày hai lời trích dẫn sau cùng một công thức dẫn nhập. Bản dịch giữ nguyên cách trình bày này và không áp đặt một kết luận thần học chi tiết về quy điển.
- issue: Cách diễn đạt đại từ αὐτοῦ
  choice: tiền công mình
  alternative: tiền công của người ấy
  rationale: αὐτοῦ là đại từ số ít giống đực quy chiếu về ἐργάτης. “Mình” là đại từ phản thân tự nhiên trong tiếng Việt, giữ quy chiếu số ít mà không buộc phải thêm dấu hiệu giới tính vốn không cần thiết về ngữ pháp tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Kinh Thánh” theo cách gọi phổ thông; lời cấm được diễn đạt trực tiếp bằng “Đừng”. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
