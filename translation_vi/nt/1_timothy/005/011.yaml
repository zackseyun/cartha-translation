revisions:
- from: Nhưng hãy từ chối ghi tên những góa phụ trẻ hơn,[a] vì khi các ham muốn xác thịt khiến họ chống lại Đấng Mê-si, họ muốn kết hôn.[b]
  to: Nhưng hãy từ chối ghi tên các góa phụ trẻ hơn,[a] vì khi họ buông theo dục vọng mà chống lại Đấng Mê-si, họ muốn kết hôn.[b]
  rationale: Sửa câu chính để các góa phụ, thay vì «ham muốn», là chủ thể của động từ Hy Lạp. «Buông theo dục vọng mà chống lại» giữ sắc thái buông theo thôi thúc và quan hệ trực tiếp, khó hiểu với Đấng Mê-si; chú thích trình bày khả năng hiểu liên hệ đến cam kết trước đó mà không áp đặt cách giải thích đó vào bản văn.
