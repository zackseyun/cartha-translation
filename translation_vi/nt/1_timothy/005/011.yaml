id: 1TI.5.11
reference: 1 Timothy 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: vi
  text: Nhưng hãy từ chối ghi tên các góa phụ trẻ hơn,[a] vì khi họ buông theo dục vọng mà chống lại Đấng Mê-si, họ muốn kết hôn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là đừng nhận họ vào danh sách các góa phụ được nói đến ở câu 9.
    reason: contextual_clarification
  - marker: b
    text: 'Nguyên văn: “chống lại Đấng Mê-si.” Quan hệ này khó hiểu; có thể hàm ý rằng dục vọng của họ xung đột với sự tận hiến hoặc cam kết trước đó đối với ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: Nhưng ... những góa phụ trẻ hơn
  rationale: Giữ sắc thái tương phản của δέ và nghĩa so sánh của νεωτέρας trong mạch văn đối chiếu với các góa phụ lớn tuổi.
- source_word: παραιτοῦ
  choice: hãy từ chối ghi tên
  rationale: Trong ngữ cảnh danh sách ở câu 9, động từ chỉ việc không nhận vào danh sách; thêm “ghi tên” để tiếng Việt tự nhiên và tránh hàm ý ruồng bỏ con người.
- source_word: ὅταν γὰρ
  choice: vì khi
  rationale: Bảo toàn cả chức năng nêu lý do lẫn sắc thái thời gian, khái quát.
- source_word: καταστρηνιάσωσιν
  choice: các ham muốn xác thịt khiến họ
  rationale: Động từ hiếm này diễn tả việc bị những thôi thúc nhục dục hoặc buông thả chi phối. Cách dịch động hóa tự nhiên trong tiếng Việt nhưng không đồng nhất chính việc tái hôn với tội lỗi.
- source_word: τοῦ Χριστοῦ
  choice: chống lại Đấng Mê-si
  rationale: Giữ quan hệ khó và trực tiếp của sở hữu cách sau động từ, đồng thời dịch Χριστός như một tước hiệu.
- source_word: γαμεῖν θέλουσιν
  choice: họ muốn kết hôn
  rationale: Diễn đạt tự nhiên cấu trúc θέλω với động từ nguyên mẫu, giữ ý muốn hay ý định kết hôn.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός được dùng như tước hiệu; “Đấng Mê-si” truyền đạt chức danh mà không biến thành tên riêng.
- issue: Ý nghĩa của καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: các ham muốn xác thịt khiến họ chống lại Đấng Mê-si
  alternative: họ buông theo dục vọng mà lìa khỏi Đấng Mê-si
  rationale: 'Giữ sự căng thẳng của nguyên văn: những thôi thúc của họ xung đột với sự tận hiến hoặc cam kết trước đó đối với Đấng Mê-si. Không diễn giải câu như thể bản thân việc tái hôn bị lên án.'
- issue: Phạm vi của παραιτοῦ
  choice: từ chối ghi tên
  alternative: từ chối
  rationale: Ngữ cảnh gần nói về việc ghi tên góa phụ vào danh sách; cách dịch này hạn chế nguy cơ hiểu thành phải ruồng bỏ hoặc không chăm sóc mọi góa phụ trẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Góa phụ trẻ hơn” giữ nghĩa so sánh; “ham muốn xác thịt” rõ nghĩa hơn một từ cổ như “phóng đãng.” Dấu câu kết thúc câu được dùng thay cho dấu phẩy của trích đoạn Hy Lạp vì đây là một câu Kinh Thánh độc lập.
