revisions:
- from: Đừng chỉ uống nước nữa[a], nhưng hãy dùng một ít rượu vì dạ dày và những chứng đau yếu thường xuyên của con.
  to: Đừng chỉ uống nước nữa[a], nhưng hãy dùng một ít rượu vì dạ dày của con và vì con thường xuyên đau yếu.
  rationale: Sửa phần cuối để diễn đạt tự nhiên và rõ nghĩa hơn tính thường xuyên của các ἀσθενείας, không thu hẹp chúng vào một bệnh cụ thể. Chú thích được làm mượt về thành ngữ nhưng vẫn phân biệt cách dịch sát với ý được xác định bởi ngữ cảnh.
