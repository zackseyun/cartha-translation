id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: vi
  text: Đừng chỉ uống nước nữa[a], nhưng hãy dùng một ít rượu vì dạ dày của con và vì con thường xuyên đau yếu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Đừng tiếp tục là người uống nước.” Trong ngữ cảnh, ý nói Ti-mô-thê không nên tiếp tục chỉ uống nước mà thôi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: đừng ... nữa
  rationale: Diễn tả việc chấm dứt một thói quen trước đây và kết hợp tự nhiên với câu mệnh lệnh phủ định trong tiếng Việt.
- source_word: ὑδροπότει
  choice: chỉ uống nước
  rationale: Động từ có nghĩa là uống nước; trong thế đối lập với việc dùng một ít rượu, ý là không tiếp tục uống riêng nước mà thôi, chứ không phải ngừng uống nước hoàn toàn.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Giữ rõ quan hệ tương phản giữa thói quen trước đây và lời khuyên tiếp theo.
- source_word: οἴνῳ ὀλίγῳ
  choice: một ít rượu
  rationale: Giữ nguyên danh từ 'rượu' và lượng nhỏ do ὀλίγῳ biểu thị, không làm nhẹ hay mở rộng từ ngữ nguồn.
- source_word: χρῶ
  choice: hãy dùng
  rationale: Phản ánh nghĩa thông thường của χράομαι với đối tượng ở cách dữ liệu; cách nói này cũng không áp đặt rằng đây chỉ là uống giải trí hay một toa thuốc theo nghĩa kỹ thuật.
- source_word: διὰ
  choice: vì
  rationale: Với đối cách, διά nêu lý do; 'vì' ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: στόμαχον
  choice: dạ dày
  rationale: Thuật ngữ giải phẫu thông dụng, chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: πυκνάς
  choice: thường xuyên
  rationale: Truyền đạt ý tái diễn nhiều lần của tính từ nguồn.
- source_word: ἀσθενείας
  choice: những chứng đau yếu
  rationale: Trong ngữ cảnh sức khỏe, cụm này chỉ các tình trạng bệnh tật hoặc suy yếu thể chất mà không thu hẹp quá mức vào một loại bệnh cụ thể.
theological_decisions:
- issue: Có nên nói rõ Ti-mô-thê trước đó chỉ uống nước hay không
  choice: Đừng chỉ uống nước nữa
  alternative: Đừng uống nước nữa
  rationale: Sự tương phản với 'hãy dùng một ít rượu' cho thấy lời dặn không cấm uống nước hoàn toàn mà bảo đừng tiếp tục chỉ uống nước. Bản dịch làm rõ hàm ý ngữ cảnh để tránh hiểu sai.
- issue: Có nên dịch οἶνος theo nghĩa trực tiếp hay khái quát hóa thành đồ uống chữa bệnh
  choice: rượu
  alternative: rượu thuốc
  rationale: Bản Hy Lạp nói trực tiếp là οἶνος. Dịch là 'rượu' bảo toàn từ ngữ nguồn, còn 'một ít' thể hiện sự giới hạn mà câu văn nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ 'con' để phản ánh quan hệ mục vụ thân tình trong thư, đồng thời giữ lời khuyên trực tiếp và tự nhiên.
