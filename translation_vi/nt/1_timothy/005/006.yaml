id: 1TI.5.6
reference: 1 Timothy 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: vi
  text: Nhưng người phụ nữ sống hưởng lạc thì dù đang sống cũng đã chết[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sống tự nuông chiều” hoặc “sống xa hoa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: sống buông thả
  rationale: Diễn tả lối sống liên tục chạy theo khoái lạc và nuông chiều bản thân, chứ không chỉ đơn thuần hưởng niềm vui; cách nói này tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ζῶσα
  choice: dù đang sống
  rationale: Thể hiện sắc thái nhượng bộ trong nghịch lý với động từ hoàn thành theo sau, đồng thời giữ rõ ý người ấy vẫn sống về thể xác.
- source_word: τέθνηκεν
  choice: đã chết
  rationale: Thì hoàn thành Hy Lạp nhấn mạnh tình trạng hiện tại phát sinh từ việc chết; “đã chết” giữ được cả sắc thái kết quả lẫn nghịch lý của nguyên văn.
- source_word: ἡ ... σπαταλῶσα
  choice: người đàn bà sống buông thả
  rationale: Mạo từ giống cái cùng phân từ được dùng như danh từ. “Người đàn bà” bảo toàn giống ngữ pháp và quy chiếu trong ngữ cảnh nói về các góa phụ mà không thêm chữ “góa phụ” vào chính câu.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với người góa phụ thật sự được mô tả ở câu trước.
theological_decisions:
- issue: Bản chất của tình trạng “đã chết”
  choice: 'Giữ nguyên ẩn dụ nghịch lý: dù còn sống về thể xác, người ấy “đã chết”'
  alternative: Diễn giải rõ là chết về tâm linh, chết về đạo đức, hoặc coi như đã chết về mặt xã hội
  rationale: Nguyên văn không xác định bằng một thuật ngữ bổ nghĩa loại sự chết nào. Giữ nguyên ẩn dụ bảo toàn sự căng thẳng thần học, tránh áp đặt một công thức giáo lý cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm. “Sống buông thả” dễ hiểu đối với độc giả phổ thông và truyền đạt sắc thái tự nuông chiều của σπαταλάω; chú thích giữ các khả năng thiên về khoái lạc hoặc xa hoa.
