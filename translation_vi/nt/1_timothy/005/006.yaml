revisions:
- from: Nhưng người đàn bà sống buông thả thì dù đang sống cũng đã chết[a].
  to: Nhưng người phụ nữ sống hưởng lạc thì dù đang sống cũng đã chết[a].
  rationale: Thay “sống buông thả” bằng “sống hưởng lạc” để phản ánh chính xác hơn trường nghĩa của σπαταλῶσα mà không thêm hàm ý cụ thể. Thay “người đàn bà” bằng “người phụ nữ” cho cách diễn đạt trung tính, tự nhiên. Nghịch lý nguyên văn và tính mơ hồ về bản chất của sự “chết” được giữ nguyên.
