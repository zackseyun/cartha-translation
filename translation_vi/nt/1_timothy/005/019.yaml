  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: vi
  text: Đừng tiếp nhận lời tố cáo chống lại một trưởng lão[a], trừ khi dựa trên lời chứng của hai hoặc ba nhân chứng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một người lớn tuổi,” nếu πρεσβυτέρου được hiểu theo tuổi tác thay vì chỉ chức vụ “trưởng lão” trong hội thánh.
    reason: alternative_reading
  - marker: b
    text: Cách diễn đạt này phản ánh nguyên tắc pháp lý trong Cựu Ước rằng một vụ việc phải được xác lập bởi “hai hoặc ba nhân chứng” (xem Phục Truyền Luật Lệ Ký 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: một trưởng lão
  rationale: Trong ngữ cảnh gần nói về các trưởng lão và việc xử lý họ, πρεσβύτερος nhiều khả năng chỉ người lãnh đạo trong hội thánh. Tuy vậy, nghĩa theo tuổi tác là “người đàn ông lớn tuổi” vẫn có thể có, nên được ghi ở chú thích.
- source_word: κατηγορίαν
  choice: lời tố cáo
  rationale: Diễn đạt rõ một cáo buộc mang tính chính thức hoặc pháp lý, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: μὴ παραδέχου
  choice: Đừng tiếp nhận
  rationale: παραδέχομαι ở đây nói đến việc nhận và đưa một cáo buộc ra xem xét, chứ không nhất thiết là tin cáo buộc ấy đúng. “Tiếp nhận” giữ được sắc thái thủ tục đó.
- source_word: ἐκτὸς εἰ μὴ
  choice: trừ khi
  rationale: Cụm từ này đưa ra điều kiện ngoại lệ; “trừ khi” ngắn gọn và tự nhiên trong câu tiếng Việt.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: dựa trên lời chứng của hai hoặc ba nhân chứng
  rationale: Làm rõ giá trị chứng cứ của ἐπί trong ngữ cảnh pháp lý, đồng thời giữ âm hưởng nguyên tắc luật pháp Cựu Ước.
theological_decisions:
- issue: Nghĩa của πρεσβυτέρου trong ngữ cảnh hội thánh
  choice: trưởng lão, tức người lãnh đạo trong hội thánh
  alternative: người đàn ông lớn tuổi
  rationale: Ngữ cảnh trực tiếp trong 1 Ti-mô-thê 5 bàn về các trưởng lão và trách nhiệm đối với họ, nên nghĩa chức vụ có khả năng cao hơn. Chú thích giữ lại nghĩa tuổi tác có thể có mà không áp đặt cách hiểu hệ phái.
- issue: Vai trò của hai hoặc ba nhân chứng
  choice: điều kiện để tiếp nhận lời tố cáo
  alternative: điều kiện để kết tội sau khi điều tra
  rationale: Cú pháp gắn điều kiện này với μὴ παραδέχου, nên câu trực tiếp quy định việc tiếp nhận cáo buộc. Bản dịch không mở rộng câu thành một phán quyết về tội trạng.
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “Trưởng lão” là thuật ngữ quen thuộc trong ngữ cảnh hội thánh; “tiếp nhận lời tố cáo” giữ sắc thái thủ tục mà không hàm ý đã tin hay xác nhận cáo buộc.
