revisions:
- from: Đừng tiếp nhận lời tố cáo một trưởng lão[a], trừ khi dựa trên lời chứng của hai hoặc ba nhân chứng.[b]
  to: Đừng tiếp nhận lời tố cáo chống lại một trưởng lão[a], trừ khi dựa trên lời chứng của hai hoặc ba nhân chứng.[b]
  rationale: Thêm «chống lại» để thể hiện chính xác và không mơ hồ giới từ κατὰ trong cụm κατὰ πρεσβυτέρου. Điều chỉnh nhẹ chú thích a cho tự nhiên hơn trong tiếng Việt, vẫn bảo toàn khả năng nghĩa theo tuổi tác và không áp đặt cách hiểu hệ phái. Không cần thay đổi chú thích b.
  reviewer_model: gpt-5.6-terra
