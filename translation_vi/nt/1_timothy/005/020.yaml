id: 1TI.5.20
reference: 1 Timothy 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: vi
  text: Hãy khiển trách những người đang phạm tội trước mặt mọi người[b][a], để những người còn lại cũng biết sợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người cứ tiếp tục phạm tội”; dạng phân từ hiện tại có thể gợi ý hành vi phạm tội đang tiếp diễn.'
    reason: lexical_alternative
  - marker: b
    text: Văn cảnh ngay trước đó có thể cho thấy đối tượng đặc biệt là các trưởng lão phạm tội, dù chính câu này chỉ nói “những người đang phạm tội.”
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: những người đang phạm tội
  rationale: Phân từ hiện tại được dùng như danh từ, chỉ những người phạm tội. Cách dịch này giữ sắc thái đang diễn ra mà không diễn giải mạnh thành “cứ tiếp tục phạm tội”; khả năng ấy được nêu trong chú thích.
- source_word: ἐνώπιον πάντων
  choice: trước mặt mọi người
  rationale: Diễn đạt trực tiếp ý “trước tất cả mọi người,” vừa tự nhiên trong tiếng Việt vừa giữ rõ tính công khai của lời khiển trách.
- source_word: ἔλεγχε
  choice: hãy khiển trách
  rationale: Trong bối cảnh sửa trị, động từ có thể mang nghĩa vạch rõ lỗi, quở trách hoặc khiển trách. “Khiển trách” là cách nói trang trọng, dễ hiểu và nhấn mạnh việc sửa lỗi mà không thu hẹp nghĩa thành chỉ phơi bày.
- source_word: οἱ λοιποὶ
  choice: những người còn lại
  rationale: Chỉ những người khác ngoài người bị khiển trách; cách dịch này giữ nguyên phạm vi tương đối không xác định của nguyên văn.
- source_word: φόβον ἔχωσιν
  choice: biết sợ
  rationale: Thành ngữ nguyên văn là “có sự sợ hãi.” “Biết sợ” tự nhiên trong tiếng Việt và có thể bao hàm sự e sợ nghiêm túc, có tác dụng cảnh tỉnh, mà không nhất thiết chỉ sự kinh hãi.
theological_decisions:
- issue: Phạm vi của những người phạm tội trong văn cảnh
  choice: Bản văn chính giữ cách nói rộng là “những người đang phạm tội,” không thêm “trưởng lão.”
  alternative: Văn cảnh ngay trước đó có thể cho thấy đối tượng cụ thể là các trưởng lão phạm tội; nguyên tắc cũng có thể được hiểu rộng hơn trong việc sửa trị hội thánh.
  rationale: Chính câu Hy Lạp không lặp lại danh từ “trưởng lão,” dù câu 19 tạo một mối liên hệ văn cảnh mạnh. Không thêm đối tượng vào bản văn giúp bảo tồn sự căng thẳng và mức độ hàm hồ thật sự của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Khiển trách” phù hợp với lời chỉ dẫn mục vụ; “biết sợ” tự nhiên hơn lối dịch sát chữ “có sự sợ hãi” và vẫn giữ được sắc thái cảnh tỉnh. Các dấu chú thích [b][a] được đặt ngay sau cụm từ mà cả hai chú thích cùng giải thích, theo thứ tự của lớp tham khảo tiếng Anh.
