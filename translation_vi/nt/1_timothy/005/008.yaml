id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: vi
  text: Nhưng nếu ai không chăm lo cho người thân của mình[a], nhất là những người trong gia đình mình, thì người ấy đã chối bỏ[b] đức tin và còn tệ hơn người không tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người thuộc về mình”; cụm từ này rộng hơn những người cùng sống trong một gia đình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã từ bỏ đức tin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: ai
  rationale: Đại từ bất định số ít có nghĩa khái quát; “ai” tự nhiên trong tiếng Việt và không giới hạn lời này vào nam giới.
- source_word: τῶν ἰδίων
  choice: người thân của mình
  rationale: Cụm này chỉ những người thuộc về mình theo quan hệ và trách nhiệm, rộng hơn riêng những người cùng sống dưới một mái nhà; “người thân của mình” giữ được phạm vi ấy.
- source_word: μάλιστα
  choice: nhất là
  rationale: Nhấn mạnh một nhóm có trách nhiệm đặc biệt trong phạm vi rộng hơn; “nhất là” là cách diễn đạt tự nhiên, rõ nghĩa.
- source_word: οἰκείων
  choice: những người trong gia đình mình
  rationale: Chỉ những người thuộc gia hộ của một người. Cách dịch này phân biệt tương đối rõ với “người thân” ở vế trước mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: προνοεῖ
  choice: chăm lo
  rationale: Trong ngữ cảnh, động từ nói đến việc liệu trước và thực hiện sự chăm sóc, kể cả chu cấp vật chất; “chăm lo” bao quát cả sự quan tâm thực tế lẫn trách nhiệm cung ứng.
- source_word: τὴν πίστιν
  choice: đức tin
  rationale: Ở đây πίστις nói đến đức tin Cơ Đốc mà người ấy tuyên xưng, không chỉ hành vi tin tưởng nói chung. “Đức tin” là cách gọi quen thuộc và phù hợp với mạo từ xác định trong tiếng Hy Lạp.
- source_word: ἤρνηται
  choice: đã chối bỏ
  rationale: Thì hoàn thành diễn tả một hành động đã xảy ra với tình trạng còn hiệu lực. “Đã chối bỏ” giữ được sức nặng của sự phủ nhận bằng hành vi.
- source_word: ἀπίστου
  choice: người không tin
  rationale: Trong sự đối chiếu này, từ chỉ người không có đức tin, tức người ngoài cộng đồng tin nhận; “người không tin” rõ ràng và trung tính hơn các cách có thể gợi nghĩa thiếu trung tín.
- source_word: χείρων
  choice: tệ hơn
  rationale: Tính từ so sánh diễn tả sự đánh giá đạo đức mạnh; “tệ hơn” ngắn gọn và tự nhiên.
theological_decisions:
- issue: Giới tính trong cấu trúc số ít khái quát
  choice: Dùng “ai ... của mình ... người ấy” không đánh dấu giới tính.
  alternative: Dùng đại từ nam giới như “người đàn ông nào ... người ấy”.
  rationale: τις có nghĩa khái quát; tiếng Việt không buộc phải biểu thị giống ngữ pháp. Cách diễn đạt trung tính giữ đúng phạm vi áp dụng cho mọi người mà không thêm giới tính không có ý nghĩa hạn định trong câu.
- issue: Nghĩa của πίστις trong τὴν πίστιν ἤρνηται
  choice: “đức tin”, hiểu là đức tin được tuyên xưng.
  alternative: “lòng tin” hoặc “sự trung tín”.
  rationale: Trong văn cảnh các Thư Mục vụ, cụm có mạo từ thường chỉ đức tin Cơ Đốc được tuyên xưng và sống theo. Việc không chăm lo cho người nhà thực tế phủ nhận lời tuyên xưng ấy; tuy nhiên bản dịch không diễn giải thêm đối tượng của đức tin.
- issue: Quan hệ giữa τῶν ἰδίων và οἰκείων
  choice: Giữ nhóm thứ nhất rộng hơn (“người thân của mình”) và nhóm thứ hai là nhóm được nhấn mạnh (“những người trong gia đình mình”).
  alternative: Dịch cả hai cụm đều là “gia đình”, làm hai phạm vi gần như đồng nhất.
  rationale: καὶ μάλιστα cho thấy cụm sau là nhóm đặc biệt nổi bật trong phạm vi trách nhiệm đã nêu. Giữ sự phân biệt tránh làm mất chuyển động từ phạm vi rộng đến nghĩa vụ gần gũi hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Chăm lo” diễn đạt trách nhiệm thực tế mà không thu hẹp chỉ còn chu cấp tiền bạc. Đại từ “mình” tránh lặp giới tính và phù hợp với cấu trúc điều kiện khái quát trong tiếng Việt.
