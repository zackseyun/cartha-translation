id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: vi
  text: 'được tiếng về những việc lành: nếu bà đã nuôi dạy con cái, nếu bà đã tiếp đãi khách lạ, nếu bà đã rửa chân cho các thánh[a], nếu bà đã giúp đỡ những người gặp hoạn nạn, nếu bà đã theo đuổi mọi việc lành.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các thánh” ở đây chỉ dân thánh của Đức Chúa Trời, tức là các tín hữu.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã theo sát mọi việc lành.” Động từ Hy Lạp nhấn mạnh sự chủ động theo đuổi và gắn bó với việc lành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: được chứng nhận về những việc tốt
  rationale: 'Giữ sắc thái bị động của μαρτυρουμένη: người khác làm chứng về bà dựa trên những việc tốt đã thấy; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.'
- source_word: εἰ
  choice: nếu
  rationale: Giữ cấu trúc điều kiện được lặp lại trong bản Hy Lạp để trình bày các tiêu chuẩn.
- source_word: ἐτεκνοτρόφησεν
  choice: đã nuôi dạy con cái
  rationale: Diễn đạt việc chăm sóc và dưỡng dục trẻ em, nhưng không xác định đó nhất thiết là con ruột.
- source_word: ἐξενοδόχησεν
  choice: đã tiếp đãi khách lạ
  rationale: Động từ nói cụ thể đến việc đón tiếp khách hoặc người lạ; cách dịch này bảo toàn hình ảnh cụ thể hơn từ khái quát 'hiếu khách'.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: đã rửa chân cho các thánh
  rationale: Giữ hành động phục vụ khiêm nhường cụ thể và thuật ngữ Phao-lô dùng cho dân thánh của Đức Chúa Trời.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: đã giúp đỡ những người gặp hoạn nạn
  rationale: Bao quát những người đang chịu khốn khó, áp lực hoặc đau khổ, không thu hẹp vào sự bắt bớ.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: đã theo đuổi mọi việc lành
  rationale: ‘Theo đuổi’ giữ ý chủ động đi theo và dấn thân vào việc lành, tự nhiên hơn lối dịch sát chữ ‘đi theo sau’.
theological_decisions:
- issue: Đối tượng của ἁγίων
  choice: các thánh
  alternative: những người thuộc về Đức Chúa Trời; các tín hữu
  rationale: Giữ thuật ngữ thần học quen thuộc của Phao-lô mà không đồng nhất nó với một tầng lớp tín hữu đặc biệt; chú thích giải nghĩa theo văn cảnh.
- issue: Phạm vi của θλιβομένοις
  choice: những người gặp hoạn nạn
  alternative: những người bị áp bức; những người chịu đau khổ
  rationale: Từ Hy Lạp có phạm vi rộng, nên không giới hạn nguyên nhân của cảnh khốn khó vào áp bức hay bắt bớ.
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng với độc giả Việt Nam hiện đại. Duy trì nhịp liệt kê lặp lại “nếu bà đã” của nguyên văn và phân biệt “việc tốt” (καλοῖς) với “việc lành” (ἀγαθῷ) mà không cường điệu khác biệt ngữ nghĩa.
