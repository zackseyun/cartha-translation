  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: vi
  text: Đồng thời, họ cũng tập thói nhàn rỗi, đi từ nhà này sang nhà khác; không những nhàn rỗi mà còn ngồi lê đôi mách[a] và xen vào chuyện người khác[b], nói những điều không nên nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lắm lời”; từ Hy Lạp có thể chỉ lời nói phù phiếm hoặc rỗng tuếch nói chung, dù trong ngữ cảnh này có lẽ bao gồm việc ngồi lê đôi mách.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hay can thiệp vào việc người khác.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Đồng thời, họ cũng
  rationale: Diễn đạt cả ý đồng thời lẫn bổ sung của cụm từ Hy Lạp, đồng thời nối tự nhiên với câu trước.
- source_word: ἀργαὶ
  choice: nhàn rỗi
  rationale: Chỉ tình trạng không làm việc hơn là quy kết đơn thuần về tính lười biếng; giữ nguyên sự lặp lại ở cả hai vị trí.
- source_word: μανθάνουσιν
  choice: tập thói
  rationale: Trong ngữ cảnh, động từ nói đến việc hình thành một thói quen; cách diễn đạt này tự nhiên trong tiếng Việt mà không biến câu thành sự dạy dỗ chính thức.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: đi hết nhà này sang nhà khác
  rationale: Thể hiện rõ chuyển động lần lượt giữa các gia đình và phù hợp với cách nói hiện đại.
- source_word: φλύαροι
  choice: ngồi lê đôi mách
  rationale: Truyền đạt lối nói chuyện phù phiếm, thiếu dè dặt và có tính bàn tán trong ngữ cảnh; chú thích giữ lại phạm vi nghĩa rộng hơn của từ Hy Lạp.
- source_word: περίεργοι
  choice: xen vào chuyện người khác
  rationale: Diễn đạt sự can thiệp không thích đáng vào những việc không thuộc phận sự của mình bằng ngôn ngữ dễ hiểu.
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: nói những điều không nên nói
  rationale: Giữ rõ hành vi nói và ý về những điều không thích hợp hoặc không đúng phép.
theological_decisions:
- issue: Giống của các tính từ và phân từ số nhiều giống cái
  choice: họ
  alternative: những phụ nữ ấy
  rationale: Các dạng Hy Lạp chỉ những góa phụ trẻ trong văn cảnh. Đại từ “họ” nối tự nhiên với tiền ngữ đã rõ, không xóa bỏ hay mở rộng đối tượng của lời nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngồi lê đôi mách” là thành ngữ thông dụng; chú thích giúp giữ phạm vi nghĩa rộng của φλύαροι. Cấu trúc lặp “nhàn rỗi” phản ánh chủ ý lặp từ trong bản Hy Lạp.
