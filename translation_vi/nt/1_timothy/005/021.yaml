id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: vi
  text: 'Trước mặt Đức Chúa Trời, Đấng Mê-si-a Giê-su và các thiên sứ được chọn[a], tôi long trọng truyền bảo con: hãy tuân giữ những điều này, không phán đoán trước[b] và không làm gì vì thiên vị[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thiên sứ được tuyển chọn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không thành kiến.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn có ý: “không làm gì theo sự nghiêng về một phía.”'
    reason: lexical_clarification
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: tôi long trọng truyền bảo con
  rationale: Trong lời khuyên dạy của thư tín, động từ này diễn tả một lời căn dặn nghiêm trọng, có tính ràng buộc; cách dịch này giữ được sức nặng mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐνώπιον
  choice: trước mặt
  rationale: Diễn tả hành động được thực hiện trước sự chứng kiến của Đức Chúa Trời, Đấng Mê-si-a Giê-su và các thiên sứ; đây là cách nói trang trọng, tự nhiên.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Χριστός ở đây vẫn mang nội dung tước hiệu; “Đấng Mê-si-a” truyền đạt nghĩa “Đấng được xức dầu” thay vì chỉ phiên âm.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: các thiên sứ được chọn
  rationale: Giữ nghĩa cơ bản của ἐκλεκτός và tránh xác định thêm ai là chủ thể chọn khi nguyên văn không nói rõ.
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ phạm vi quy chiếu rộng của đại từ chỉ định, hướng về các lời chỉ dẫn trong văn cảnh trước đó mà không diễn giải quá mức.
- source_word: φυλάξῃς
  choice: hãy tuân giữ
  rationale: Trong ngữ cảnh này, φυλάσσω có nghĩa cẩn thận thực hiện và làm theo, không chỉ bảo vệ; “tuân giữ” thể hiện cả sự trung thành lẫn hành động.
- source_word: χωρὶς προκρίματος
  choice: không phán đoán trước
  rationale: πρόκριμα chủ yếu chỉ sự phán quyết hay kết luận được hình thành trước khi xem xét sự việc; cách dịch này phân biệt nó với πρόσκλισις ở vế sau.
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: không làm gì vì thiên vị
  rationale: Diễn đạt tự nhiên ý không hành động theo khuynh hướng nghiêng về một bên hoặc ưu ái một người.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong lời viện dẫn trang trọng này, Χριστός vẫn có thể được hiểu như tước hiệu. “Đấng Mê-si-a” bảo tồn nội dung ngữ nghĩa của tước hiệu mà không áp đặt một cách hiểu hệ phái.
- issue: Ý nghĩa của “các thiên sứ được chọn”
  choice: Giữ nguyên mô tả mà không giải thích căn tính hay vai trò của họ
  alternative: các thiên sứ tuyển chọn
  rationale: Nguyên văn chỉ gọi họ là ἐκλεκτοί, không giải thích họ được chọn theo nghĩa nào; bản dịch giữ sự chưa xác định đó.
- issue: Phân biệt πρόκριμα và πρόσκλισις
  choice: “phán đoán trước” và “thiên vị”
  alternative: “thành kiến” và “thiên vị”
  rationale: 'Hai từ gần nghĩa nhưng không hoàn toàn đồng nhất: từ thứ nhất nhấn mạnh phán quyết có trước, từ thứ hai nhấn mạnh sự nghiêng về một phía. Bản dịch bảo tồn sự căng thẳng và tiến triển của hai mệnh đề.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp quan hệ mục vụ giữa Phao-lô và Ti-mô-thê trong thư; cấu trúc được làm tự nhiên cho tiếng Việt nhưng vẫn giữ lời truyền bảo nghiêm trọng, ba nhân chứng được viện dẫn và sự phân biệt giữa phán đoán trước với thiên vị.
