  source_fidelity: Bản dịch chuyển đạt đúng mệnh lệnh về việc ghi tên chính thức, điều kiện tuổi tối thiểu sáu mươi, và không quyết đoán ý nghĩa đang được tranh luận của ἑνὸς ἀνδρὸς γυνή. Tuy nhiên, “một người chồng” không tự nhiên trong tiếng Việt và làm thành ngữ Hy Lạp trở nên gượng không cần thiết.
