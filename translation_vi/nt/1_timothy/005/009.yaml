base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: vi
  text: Một góa phụ chỉ được ghi tên vào danh sách khi bà đã đủ sáu mươi tuổi và đã từng là vợ của một người đàn ông[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn, sát chữ: “người nữ (vợ) của một người nam.” Cụm từ này có thể chỉ sự chung thủy hoặc tư cách trong hôn nhân; một số người hiểu là “chỉ kết hôn một lần.”'
    reason: Giữ lại tính hàm hồ của thành ngữ Hy Lạp và trình bày các cách hiểu chính mà không quyết định thay cho nguyên văn.
lexical_decisions:
- source_word: Χήρα
  choice: một góa phụ
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với người phụ nữ có chồng đã qua đời; ở đây bà đang được xét để ghi tên chính thức.
- source_word: καταλεγέσθω
  choice: chỉ được ghi tên vào danh sách
  rationale: Diễn đạt ý được đưa vào một danh sách chính thức. Từ “chỉ” kết hợp với điều kiện theo sau thể hiện tính giới hạn của câu.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: nếu bà đã đủ sáu mươi tuổi
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về độ tuổi tối thiểu đã đạt tới, tương ứng với nghĩa đen “không dưới sáu mươi tuổi”.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: từng là vợ của một người chồng
  rationale: Giữ tương đối sát thành ngữ Hy Lạp và không hoàn toàn quyết định rằng cụm từ chỉ nói về số lần kết hôn hay về lòng chung thủy trong hôn nhân; chú thích nêu rõ các khả năng.
theological_decisions:
- issue: Ý nghĩa của ἑνὸς ἀνδρὸς γυνή
  choice: Giữ cách diễn đạt gần với thành ngữ “vợ của một người chồng” trong chính văn.
  alternative: “chung thủy với chồng” hoặc “chỉ kết hôn một lần”
  rationale: Cụm từ có thể nhấn mạnh tư cách và lòng chung thủy trong hôn nhân, nhưng cũng có người hiểu là chỉ kết hôn một lần. Chính văn Hy Lạp không giải quyết dứt khoát vấn đề này, nên bản dịch không áp đặt một kết luận giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Góa phụ,” “ghi tên vào danh sách,” và “đã đủ sáu mươi tuổi” là các cách diễn đạt thông dụng; đại từ “bà” thể hiện sự tôn trọng phù hợp với người phụ nữ thuộc nhóm tuổi được nói đến.
