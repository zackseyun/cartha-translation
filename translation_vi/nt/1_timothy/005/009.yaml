  to: Một góa phụ chỉ được ghi tên vào danh sách khi bà đã đủ sáu mươi tuổi và đã từng là vợ của một người đàn ông[a].
  rationale: Chỉnh sửa duy nhất trong chính văn là thay cách nói không tự nhiên “một người chồng” bằng “một người đàn ông”. Việc thêm “đã” trước “từng là” làm quan hệ quá khứ rõ và trôi chảy, phù hợp với việc người được nói đến là góa phụ. Chú thích được tinh chỉnh để phân biệt cách dịch sát chữ với các diễn giải, đồng thời không áp đặt một lập trường giáo phái.
