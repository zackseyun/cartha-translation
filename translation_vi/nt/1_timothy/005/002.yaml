  terminology: “Phụ nữ lớn tuổi/phụ nữ trẻ tuổi” phân biệt đúng độ tuổi, không gợi chức vụ hội thánh. “Trong sạch” là lựa chọn rộng và phù hợp cho ἁγνεία; chú thích nên nêu rõ phương án sát cấu trúc “trong mọi sự trong sạch” đồng thời ghi nhận sắc thái tiết hạnh/đứng đắn trong quan hệ nam nữ.
