id: 1TI.5.2
reference: 1 Timothy 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: vi
  text: những phụ nữ lớn tuổi như mẹ, những phụ nữ trẻ tuổi như chị em gái, với sự trong sạch hoàn toàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong mọi sự trong sạch.” Cụm từ này cũng có thể mang sắc thái mạnh về sự tiết hạnh hoặc sự đứng đắn trong quan hệ nam nữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: những phụ nữ lớn tuổi
  rationale: Tính từ giống cái số nhiều được dùng như danh từ và đối lập với νεωτέρας, nên chỉ độ tuổi chứ không chỉ chức vụ trưởng lão.
- source_word: ὡς
  choice: như
  rationale: Diễn tả sự so sánh trong hai cấu trúc song song và tự nhiên trong tiếng Việt.
- source_word: μητέρας
  choice: mẹ
  rationale: Giữ nguyên hình ảnh gia đình mà không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: νεωτέρας
  choice: những phụ nữ trẻ tuổi
  rationale: Tính từ giống cái số nhiều được dùng như danh từ, chỉ những phụ nữ trẻ tuổi và tạo thế đối xứng với πρεσβυτέρας.
- source_word: ἀδελφὰς
  choice: chị em
  rationale: Truyền đạt tự nhiên hình ảnh quan hệ ruột thịt trong tiếng Việt; không thêm từ sở hữu.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: với sự trong sạch trọn vẹn
  rationale: Cụm từ diễn tả cách cư xử; “trong sạch” giữ phạm vi đạo đức rộng của ἁγνεία và vẫn bao hàm mạnh mẽ sự đứng đắn, tiết hạnh trong quan hệ nam nữ. “Trọn vẹn” thể hiện πάσῃ tự nhiên hơn lối dịch sát chữ “mọi sự trong sạch”.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἁγνεία trong lời dạy về phụ nữ trẻ tuổi
  choice: Dịch rộng là “sự trong sạch”, không giới hạn ngay trong chính văn vào sự tiết hạnh về tình dục.
  alternative: “với sự tiết hạnh hoàn toàn” hoặc “với sự trong sạch hoàn toàn về tình dục”
  rationale: Trong ngữ cảnh, từ này chắc chắn hàm ý mạnh về sự đứng đắn và tiết hạnh trong quan hệ với phụ nữ trẻ, nhưng vẫn có thể chỉ sự trong sạch đạo đức nói chung. Bản dịch rộng giữ được đầy đủ trường nghĩa và không giải quyết thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc tỉnh lược của nguyên văn vì câu này tiếp nối động từ khuyên bảo ở câu trước; không tự ý thêm “hãy đối xử với”. Dùng “chị em” theo cách gọi quan hệ gia đình tự nhiên trong tiếng Việt.
