id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: vi
  text: Nhưng nếu một góa phụ có con hay cháu[a], thì trước hết con cháu của bà phải học cách bày tỏ lòng tin kính đối với chính gia đình mình[b] và báo đáp các bậc thuộc thế hệ trước[c], vì điều này đẹp lòng Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “con cái hoặc hậu duệ”. Từ Hy Lạp ἔκγονα có thể mang nghĩa rộng hơn “cháu”, nhưng ở đây có lẽ chỉ thế hệ kế tiếp trong gia đình.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thực hành lòng tin kính đối với chính gia đình mình”. Tiếng Hy Lạp gắn việc chăm lo gia đình với lòng tin kính.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “những người thuộc thế hệ trước”; có thể chỉ cha mẹ, ông bà, hoặc rộng hơn là các bậc tiền bối trong gia đình.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: một góa phụ
  rationale: Cách gọi chuẩn, tự nhiên trong tiếng Việt đối với người phụ nữ có chồng đã qua đời; phù hợp với chủ đề của cả phân đoạn.
- source_word: τέκνα ἢ ἔκγονα
  choice: con hay cháu
  rationale: τέκνα là con cái; ἔκγονα có thể chỉ hậu duệ nói chung nhưng trong bối cảnh chăm sóc người góa bụa, “cháu” diễn đạt tự nhiên nhất thế hệ kế tiếp trong gia đình, đồng thời chú thích giữ lại nghĩa rộng hơn.
- source_word: μανθανέτωσαν
  choice: phải học cách
  rationale: Động từ mệnh lệnh ngôi thứ ba số nhiều mang lực truyền dạy; “phải học cách” vừa tự nhiên vừa giữ rõ tính bắt buộc.
- source_word: πρῶτον
  choice: trước hết
  rationale: 'Giữ ý ưu tiên: gia đình là phạm vi đầu tiên nơi lòng tin kính cần được thể hiện.'
- source_word: τὸν ἴδιον οἶκον
  choice: trong chính gia đình mình
  rationale: οἶκος ở đây chỉ gia đình/hộ gia đình chứ không đơn thuần là ngôi nhà; “chính… mình” phản ánh ἴδιον.
- source_word: εὐσεβεῖν
  choice: bày tỏ lòng tin kính
  rationale: Giữ sắc thái tôn giáo của εὐσεβεῖν, đồng thời cho thấy lòng tin kính được biểu hiện bằng hành động trong đời sống gia đình.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: báo đáp
  rationale: Diễn đạt ngắn gọn, tự nhiên ý hoàn trả điều đã nhận, ở đây là đáp lại sự nuôi dưỡng và chăm sóc của thế hệ trước.
- source_word: τοῖς προγόνοις
  choice: ông bà, cha mẹ
  rationale: πρόγονοι chỉ những người thuộc thế hệ trước. Trong ngữ cảnh trực tiếp về con cháu chăm sóc góa phụ, “ông bà, cha mẹ” xác định tự nhiên các quan hệ đang được nói đến; chú thích bảo lưu khả năng dịch rộng hơn.
- source_word: ἀπόδεκτον
  choice: đẹp lòng
  rationale: Truyền đạt tự nhiên rằng hành động này được Đức Chúa Trời đón nhận và chuẩn thuận; “được chấp nhận” là cách dịch sát hơn nhưng kém uyển chuyển trong câu tiếng Việt.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: Đức Chúa Trời
  rationale: Trong thành ngữ “đẹp lòng Đức Chúa Trời”, ý được đánh giá thuận nhận trước mặt Ngài đã được diễn đạt tự nhiên mà không cần dịch máy móc ἐνώπιον.
theological_decisions:
- issue: Chủ thể số nhiều của μανθανέτωσαν
  choice: Mệnh lệnh hướng đến con hoặc cháu của người góa phụ.
  alternative: Mệnh lệnh hướng đến các góa phụ nói chung, với sự chuyển đổi số hoặc một chủ thể được ngầm hiểu.
  rationale: Chủ thể số nhiều gần nhất và tự nhiên nhất là τέκνα ἢ ἔκγονα. Cách hiểu này phù hợp với việc các thành viên gia đình chăm sóc người góa phụ và báo đáp thế hệ trước.
- issue: Ý nghĩa của εὐσεβεῖν trong việc chăm lo gia đình
  choice: Việc làm tròn trách nhiệm với gia đình là một biểu hiện của lòng tin kính.
  alternative: Từ này chỉ việc chu toàn nghĩa vụ gia đình, hầu như không mang sắc thái tôn giáo.
  rationale: εὐσεβεῖν mang nội hàm rõ ràng về lòng đạo đức, tin kính; mệnh đề cuối đặt hành động ấy dưới sự chuẩn nhận của Đức Chúa Trời. Bản dịch vì thế giữ cả chiều kích thuộc linh lẫn biểu hiện thực tiễn.
- issue: Phạm vi nghĩa của τοῖς προγόνοις
  choice: Trong bối cảnh này, từ này nói đến ông bà, cha mẹ—những thế hệ trước trực tiếp trong gia đình.
  alternative: Dịch khái quát là “tổ tiên” hoặc “các bậc tiền nhân”.
  rationale: Nghĩa từ nguyên rộng hơn là người đi trước/tổ tiên, nhưng ngữ cảnh nói về nghĩa vụ chăm sóc một góa phụ còn sống. “Ông bà, cha mẹ” tránh gợi chủ yếu đến tổ tiên đã qua đời, trong khi chú thích vẫn bảo lưu độ rộng của từ Hy Lạp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Con cháu của bà” làm rõ chủ thể của mệnh lệnh số nhiều mà không thay đổi quan hệ cú pháp tự nhiên của câu Hy Lạp. “Đẹp lòng Đức Chúa Trời” là thành ngữ quen thuộc, chuyển tải tự nhiên ý được Ngài chấp nhận.
