  source_fidelity: Bản dịch truyền đạt đúng quan hệ nguyên nhân của ὅτι, ý nghĩa nghiêm trọng nhưng không quá chuyên biệt của κρίμα, và giữ được cách hiểu chính “đức tin” cùng phương án “lời cam kết” cho τὴν πρώτην πίστιν. Tuy nhiên, “nên chuốc lấy” có thể bị hiểu là “ought to incur” (hàm ý lời khuyên/điều nên làm), trong khi nguyên văn chỉ mô tả hậu quả hoặc tình trạng họ đang gánh chịu.
