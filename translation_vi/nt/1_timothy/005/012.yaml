  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: vi
  text: Họ chuốc lấy sự phán xét, vì đã gạt bỏ đức tin ban đầu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời cam kết ban đầu” hoặc “cam kết trước kia”. Từ Hy Lạp có thể mang nghĩa “đức tin”, nhưng trong văn cảnh này, một số người hiểu đó là lời cam kết đã có trước, có lẽ liên quan đến việc được ghi tên vào danh sách các góa phụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: chuốc lấy
  rationale: Phân từ này theo nghĩa đen là “có”, nhưng khi đi với κρίμα thì diễn tả việc tự đặt mình dưới sự phán xét; “chuốc lấy” tự nhiên trong tiếng Việt và giữ được sắc thái hệ quả.
- source_word: κρίμα
  choice: sự phán xét
  rationale: Từ này có thể chỉ sự phán xét, bản án hoặc sự kết án. “Sự phán xét” giữ được tính nghiêm trọng mà không xác định quá mức rằng đây là sự kết án đời đời.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu lý do họ chuốc lấy sự phán xét; “vì” là cách diễn đạt rõ ràng, tự nhiên.
- source_word: τὴν πρώτην πίστιν
  choice: đức tin ban đầu
  rationale: πρῶτος mang ý nghĩa thời gian là “ban đầu/trước kia”, còn πίστις theo nghĩa thông thường là “đức tin”. Cụm từ cũng có thể chỉ lời cam kết trước đó, nên cách hiểu ấy được giữ trong chú thích.
- source_word: ἠθέτησαν
  choice: đã gạt bỏ
  rationale: ἀθετέω có nghĩa bác bỏ, gạt sang một bên hoặc làm mất hiệu lực. “Đã gạt bỏ” truyền đạt hành động không còn giữ điều trước đó mà không áp đặt nghĩa kỹ thuật hơn văn cảnh.
theological_decisions:
- issue: Ý nghĩa của τὴν πρώτην πίστιν trong văn cảnh
  choice: đức tin ban đầu
  alternative: lời cam kết ban đầu / cam kết trước kia
  rationale: πίστις thường có nghĩa là “đức tin”, nhưng trong văn cảnh về việc ghi tên các góa phụ, cụm này có thể nói đến một lời cam kết trước đó. Bản chính giữ nghĩa thông thường, còn chú thích bảo tồn cách hiểu hợp lý khác mà không giải quyết dứt khoát sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Chuốc lấy sự phán xét” là cách diễn đạt tự nhiên cho cấu trúc phân từ; chú thích giữ nguyên sự mơ hồ thật sự của πίστις trong văn cảnh.
