  terminology: “Sự phán xét,” “đức tin ban đầu,” và chú thích về “lời cam kết ban đầu/cam kết trước kia” đều phù hợp. Chú thích bảo tồn sự mơ hồ thực sự của πίστις mà không quyết định thay nguyên văn.
