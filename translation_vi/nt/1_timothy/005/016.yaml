id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: vi
  text: Nếu một tín hữu nữ có các góa phụ[a], thì người ấy hãy chu cấp cho họ; đừng để Hội Thánh phải mang gánh nặng, để Hội Thánh có thể chu cấp cho những góa phụ thật sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản đọc: “nếu một nam hay nữ tín hữu có các góa phụ,” hoặc “nếu một tín hữu có các góa phụ,” qua đó mở rộng lời dạy, không chỉ giới hạn ở một chủ thể nữ.'
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: một nữ tín hữu
  rationale: πιστή ở giống cái số ít, nên theo bản văn SBLGNT, chủ thể được nói đến cụ thể là một phụ nữ tin Chúa. “Nữ tín hữu” diễn đạt tự nhiên căn tính Cơ Đốc trong tiếng Việt và không trung tính hóa giới tính.
- source_word: χήρας
  choice: những bà góa
  rationale: Danh từ số nhiều chỉ các phụ nữ góa chồng; trong ngữ cảnh, đây là những người có thể cần được chu cấp vật chất.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: hãy chu cấp / có thể chu cấp
  rationale: ἐπαρκέω trong văn cảnh mang nghĩa đáp ứng đủ nhu cầu thực tế. “Chu cấp” rõ nghĩa vật chất và giữ nhất quán cho cả hai lần xuất hiện.
- source_word: βαρείσθω
  choice: đừng để ... phải mang gánh nặng
  rationale: Thể mệnh lệnh bị động diễn tả việc Hội Thánh không nên bị đặt dưới gánh nặng trách nhiệm chu cấp; cách nói này tự nhiên và giữ hình ảnh về gánh nặng.
- source_word: ἡ ἐκκλησία
  choice: Hội Thánh
  rationale: Trong các thư mục vụ, ἐκκλησία chỉ cộng đồng tín hữu; “Hội Thánh” là cách dịch trang trọng, quen thuộc trong tiếng Việt.
- source_word: ταῖς ὄντως χήραις
  choice: những người thật sự là góa phụ
  rationale: ὄντως nhấn mạnh nhóm góa phụ đúng nghĩa theo tiêu chuẩn của văn cảnh—những người thực sự cô độc và cần cộng đồng chu cấp. Cách dịch này giữ sự nhấn mạnh mà không giải thích quá mức ngay trong câu.
theological_decisions:
- issue: Giới tính của chủ thể trong mệnh đề mở đầu
  choice: 'Chủ thể cụ thể là nữ: “một nữ tín hữu”'
  alternative: “một tín hữu” hoặc “một nam hay nữ tín hữu,” theo các dị bản mở rộng chủ thể
  rationale: Bản văn SBLGNT được cung cấp đọc τις πιστή, với πιστή ở giống cái số ít. Vì vậy, bản chính giữ chủ thể nữ; các cách đọc rộng hơn được ghi ở chú thích thay vì đưa vào bản văn.
- issue: Ý nghĩa của “những người thật sự là góa phụ”
  choice: Giữ cách diễn đạt nhấn mạnh của nguyên văn
  alternative: Diễn giải thành “những góa phụ không có người thân chu cấp”
  rationale: Văn cảnh cho thấy đây là các góa phụ thực sự thiếu nơi nương tựa, nhưng câu Hy Lạp không nêu toàn bộ lời giải thích ấy tại đây. Giữ cách nói của nguyên văn bảo toàn liên hệ với tiêu chuẩn đã trình bày trong chương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nữ tín hữu” xác định đúng giới tính của πιστή; “chu cấp” phù hợp bối cảnh hỗ trợ vật chất. Viết hoa “Hội Thánh” theo lối dùng phổ biến trong văn bản Kinh Thánh tiếng Việt.
