id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: vi
  text: Vì vậy, tôi muốn các góa phụ trẻ kết hôn[a], sinh con, quán xuyến gia đình và không cho kẻ chống đối[b] bất cứ cơ hội nào để phỉ báng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “kết hôn”; vì đang nói về các góa phụ trẻ nên việc tái hôn được ngụ ý.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “kẻ thù nghịch”, có thể ám chỉ Sa-tan.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: tôi muốn
  rationale: Diễn đạt ý muốn hoặc chủ trương của Phao-lô bằng lối nói tự nhiên, đồng thời giữ sắc thái ngôi thứ nhất.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ suy luận với phần bàn luận ngay trước đó.
- source_word: νεωτέρας
  choice: các góa phụ trẻ
  rationale: Tính từ có nghĩa đen là “những người nữ trẻ hơn”, nhưng danh từ “góa phụ” được bổ sung từ ngữ cảnh trực tiếp của chương 5.
- source_word: γαμεῖν
  choice: kết hôn
  rationale: Động từ chỉ nói “kết hôn”, không minh nhiên có nghĩa tố “lại”; vì đối tượng là góa phụ nên việc tái hôn được ngụ ý theo ngữ cảnh.
- source_word: τεκνογονεῖν
  choice: sinh con
  rationale: Phản ánh trực tiếp nghĩa sinh hoặc sinh ra con cái, với cách nói tự nhiên trong tiếng Việt.
- source_word: οἰκοδεσποτεῖν
  choice: quán xuyến gia đình
  rationale: Diễn đạt trách nhiệm điều hành, chăm lo và quản lý việc nhà mà không đẩy nghĩa sang sự thống trị khắc nghiệt.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: không tạo bất cứ cơ hội nào
  rationale: Chuyển tải ý không cung cấp một dịp hay chỗ hở cho hành động thù nghịch.
- source_word: τῷ ἀντικειμένῳ
  choice: kẻ chống đối
  rationale: Giữ danh xưng số ít và không tự động đồng nhất nhân vật này với Sa-tan.
- source_word: λοιδορίας χάριν
  choice: phỉ báng
  rationale: Trong kết cấu với “cơ hội”, từ này diễn tả lời lăng mạ, bôi nhọ hay nói xấu nhằm gây tổn hại.
theological_decisions:
- issue: Đối tượng được gọi là τῷ ἀντικειμένῳ
  choice: kẻ chống đối, được để mở về danh tính
  alternative: Kẻ Thù Nghịch, được hiểu là Sa-tan
  rationale: Dạng phân từ Hy Lạp chỉ “kẻ đang chống đối” chứ không minh nhiên nêu Sa-tan. Ngữ cảnh có thể nói đến một người hay phía thù nghịch dùng hành vi của tín hữu làm cớ phỉ báng; chú thích bảo lưu khả năng chỉ Sa-tan.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Quán xuyến gia đình” tự nhiên hơn lối dịch sát “làm chủ nhà” và vẫn giữ ý chủ động quản lý. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt đúng theo nội dung chú thích.
