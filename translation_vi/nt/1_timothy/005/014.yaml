  to: Vì vậy, tôi muốn các góa phụ trẻ kết hôn[a], sinh con, quán xuyến gia đình và không cho kẻ chống đối[b] bất cứ cơ hội nào để phỉ báng.
  rationale: Chỉ điều chỉnh vị trí neo chú thích và cách diễn đạt để liên kết chú thích với đúng từ Hy Lạp, đồng thời làm câu tiếng Việt tự nhiên hơn. Bản sửa vẫn giữ tính không xác định của “kẻ chống đối” trong chính văn và bảo lưu cách hiểu Sa-tan ở chú thích.
