id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: vi
  text: Cũng vậy, những việc lành thì rõ ràng; còn những việc không như thế[a] cũng không thể bị che giấu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những việc khác” hoặc “những việc không phải như vậy”; dựa vào sự tương ứng với câu trước, một số người hiểu cụm từ này là chỉ riêng các việc ác.
    reason: Giữ các khả năng diễn giải của thành ngữ Hy Lạp mà không đưa cách hiểu hẹp vào chính văn.
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên hệ song song chặt chẽ với câu trước; “cũng” chuyển tải καί mà không tạo cách nói nặng nề trong tiếng Việt.
- source_word: ἔργα τὰ καλά
  choice: những việc lành
  rationale: Giữ nghĩa cụ thể và phẩm chất đạo đức của cụm từ Hy Lạp, đồng thời là cách nói trang trọng, quen thuộc trong tiếng Việt.
- source_word: πρόδηλα
  choice: rõ ràng
  rationale: Chuyển tải ý những việc ấy hiển nhiên, dễ nhận thấy, phù hợp với sự tương phản cùng điều không thể bị che giấu.
- source_word: τὰ ἄλλως ἔχοντα
  choice: những việc không như thế
  rationale: 'Giữ lối nói khái quát và sự mơ hồ của nguyên văn: có thể chỉ những việc chưa rõ ràng theo cùng một cách, chứ không tự ý xác định đó là việc ác.'
- source_word: κρυβῆναι οὐ δύνανται
  choice: không thể bị che giấu
  rationale: Phản ánh trực tiếp cấu trúc chỉ sự bất khả của nguyên văn; ngữ cảnh hàm ý cuối cùng các việc ấy sẽ lộ ra mà không cần thêm từ không có trong bản Hy Lạp.
theological_decisions:
- issue: τὰ ἄλλως ἔχοντα có nhất thiết chỉ các việc ác hay không
  choice: 'Giữ nghĩa rộng: “những việc không như thế”'
  alternative: “những việc ác”
  rationale: Nguyên văn không dùng một tính từ có nghĩa là “ác” mà chỉ nói những việc ở tình trạng khác/không như thế. Cách dịch rộng bảo toàn sự mơ hồ thực sự, dù văn cảnh câu trước có thể khiến người đọc hiểu là các việc xấu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “việc lành” để giữ sắc thái đạo đức và “không như thế” để bảo toàn sự hàm súc của nguyên văn.
