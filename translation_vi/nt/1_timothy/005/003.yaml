  terminology: “Góa phụ” là thuật ngữ chuẩn xác cho χήρα. “Kính trọng” giữ phạm vi nghĩa rộng của τιμάω; chú thích nêu phương án “chu cấp” và hàm ý chăm lo vật chất trong văn mạch mà không thu hẹp nghĩa bản văn chính.
