  text: Χήρας τίμα τὰς ὄντως χήρας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: vi
  text: Hãy kính trọng những góa phụ thật sự là góa phụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy chu cấp cho những góa phụ thật sự là góa phụ.” Trong văn mạch này, “kính trọng” có lẽ bao gồm cả việc chăm lo vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: những góa phụ
  rationale: Danh từ χήρα chỉ người phụ nữ có chồng đã qua đời; dạng đối cách số nhiều làm bổ ngữ trực tiếp cho mệnh lệnh.
- source_word: τίμα
  choice: Hãy kính trọng
  rationale: Động từ τιμάω có nghĩa cơ bản là tôn trọng, quý trọng. Trong ngữ cảnh này, sự kính trọng có lẽ bao gồm cả việc chăm lo vật chất, nhưng không nên thu hẹp nghĩa của từ chỉ còn là chu cấp.
- source_word: τὰς ὄντως χήρας
  choice: những góa phụ thật sự là góa phụ
  rationale: Cách diễn đạt giữ lại sự lặp từ χήρας và sắc thái phân định của ὄντως, hướng đến những người thực sự cô độc và đủ điều kiện được hội thánh chăm sóc như phần văn mạch sau giải thích.
- source_word: ὄντως
  choice: thật sự
  rationale: Trạng từ này biểu thị một sự phân biệt thực chất—'thực sự, quả thật'—chứ không chỉ dùng để nhấn mạnh tu từ.
theological_decisions:
- issue: Phạm vi nghĩa của τιμάω trong văn mạch
  choice: Giữ nghĩa rộng là “kính trọng”, đồng thời chú thích rằng trong văn mạch điều này có thể bao gồm sự chu cấp vật chất.
  alternative: Hãy chu cấp cho những góa phụ thật sự là góa phụ.
  rationale: Phần tiếp theo bàn đến trách nhiệm chăm lo vật chất cho góa phụ, nhưng chính động từ Hy Lạp có nghĩa rộng hơn việc trợ cấp tài chính. Bản dịch chính không thu hẹp ý nghĩa, còn chú thích bảo tồn hàm ý thực tiễn của văn mạch.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “kính trọng” để diễn đạt tự nhiên mệnh lệnh τιμάω; giữ cụm lặp “thật sự là góa phụ” nhằm bảo tồn sự nhấn mạnh và phân định của nguyên văn.
