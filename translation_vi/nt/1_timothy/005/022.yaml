id: 1TI.5.22
reference: 1 Timothy 5:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: vi
  text: Đừng vội đặt tay trên bất cứ ai,[a] cũng đừng dự phần vào tội lỗi của người khác; hãy giữ mình trong sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong ngữ cảnh này cũng có thể hiểu cụ thể hơn là: “Đừng vội bổ nhiệm hoặc phong chức cho bất cứ ai.” Nguyên văn nói theo nghĩa đen là “đặt tay trên”, một cách nói thường gắn với việc giao phó hoặc công nhận chức vụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: đặt tay trên
  rationale: Giữ lại hình ảnh và thành ngữ của nguyên văn. Trong ngữ cảnh các trưởng lão, cụm từ này rất có thể chỉ việc công nhận hoặc giao chức vụ qua nghi thức đặt tay, nhưng bản văn không dùng một động từ chuyên biệt có nghĩa là “bổ nhiệm” hay “phong chức”.
- source_word: ταχέως
  choice: vội
  rationale: Diễn tả hành động quá sớm hoặc thiếu cân nhắc, chứ không chỉ đơn thuần là nhanh về tốc độ.
- source_word: μηδενὶ
  choice: bất cứ ai
  rationale: Kết hợp tự nhiên với mệnh lệnh phủ định “đừng” và giữ nguyên phạm vi phổ quát của đại từ.
- source_word: μηδὲ κοινώνει
  choice: cũng đừng dự phần vào
  rationale: Diễn đạt sự tham gia hoặc liên đới trách nhiệm; tự nhiên trong tiếng Việt và không thu hẹp thành sự thông công theo nghĩa nghi lễ.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: tội lỗi của người khác
  rationale: Phản ánh trực tiếp ý nghĩa “những tội thuộc về người khác” bằng cách diễn đạt rõ ràng, tự nhiên.
- source_word: σεαυτὸν ἁγνὸν τήρει
  choice: hãy giữ mình trong sạch
  rationale: Thể hiện mệnh lệnh duy trì sự thanh sạch về đạo đức. “Trong sạch” đủ rộng, không giới hạn vào sự trinh khiết về tình dục.
theological_decisions:
- issue: Ý nghĩa của việc “đặt tay trên” trong ngữ cảnh
  choice: Giữ nguyên thành ngữ “đặt tay trên”, không xác định thẳng là bổ nhiệm hay phong chức.
  alternative: “Đừng vội bổ nhiệm bất cứ ai” hoặc “Đừng vội phong chức cho bất cứ ai.”
  rationale: Ngữ cảnh nói về các trưởng lão và trách nhiệm đối với họ nên có thể hàm ý việc công nhận hoặc giao chức vụ. Tuy nhiên, nguyên văn vẫn dùng thành ngữ rộng hơn; giữ nguyên cách nói này tránh áp đặt một thủ tục giáo phái cụ thể.
- issue: Mối liên hệ giữa hai điều cấm
  choice: Giữ điều cấm thứ hai ở nghĩa rộng là không dự phần vào tội lỗi của người khác.
  alternative: Nói rõ rằng việc đặt tay quá vội khiến Ti-mô-thê mang chung trách nhiệm về tội lỗi của người được công nhận.
  rationale: Vị trí liền kề của hai mệnh đề gợi ý mối liên hệ như vậy, nhưng bản văn không giải thích tường minh. Bản dịch vì thế bảo toàn sự căng mở trong ý nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “vội” để câu gọn, tự nhiên; dùng “dự phần” nhằm diễn tả sự tham gia và liên đới trách nhiệm mà không giải thích quá mức.
