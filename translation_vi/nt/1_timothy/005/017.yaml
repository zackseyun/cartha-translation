source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: vi
  text: Các trưởng lão lãnh đạo tốt phải được coi là xứng đáng hưởng sự trọng đãi gấp đôi,[a] nhất là những người dốc sức trong việc rao giảng và dạy dỗ.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được coi là xứng đáng hưởng sự trọng đãi hai phần.” Cụm từ này có thể bao gồm cả sự kính trọng lẫn hỗ trợ vật chất, nhất là khi xét câu tiếp theo.'
    reason: lexical_alternative
  - marker: b
    text: Một số người hiểu “nhất là” theo nghĩa “tức là,” qua đó xác định các trưởng lão đang được nói đến chính là những người dốc sức rao giảng và dạy dỗ.
    reason: alternative_reading
  - marker: c
    text: “Rao giảng và dạy dỗ” nói đến chức vụ bằng lời nói, như công bố và chỉ dạy.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: các trưởng lão
  rationale: Trong các Thư Mục vụ, từ này chỉ những người giữ vai trò lãnh đạo được công nhận trong hội thánh, không đơn thuần là những người đàn ông cao tuổi.
- source_word: καλῶς προεστῶτες
  choice: lãnh đạo tốt
  rationale: προΐστημι ở đây nói đến việc thực thi vai trò lãnh đạo hoặc coi sóc; cách dịch này tự nhiên và vẫn giữ ý về thẩm quyền mà không mang sắc thái cai trị hà khắc.
- source_word: διπλῆς τιμῆς
  choice: sự tôn kính gấp đôi
  rationale: Cách dịch khá sát giữ được tính rộng nghĩa của τιμή, có thể bao gồm cả sự kính trọng lẫn hỗ trợ vật chất trong văn cảnh.
- source_word: ἀξιούσθωσαν
  choice: phải được kể là xứng đáng nhận
  rationale: Diễn đạt mệnh lệnh thể bị động, kêu gọi cộng đồng nhìn nhận họ là những người xứng đáng.
- source_word: μάλιστα
  choice: nhất là
  rationale: Cụm từ tự nhiên trong tiếng Việt, nhấn mạnh một nhóm đặc biệt mà không buộc phải hiểu theo nghĩa đồng vị là 'tức là'.
- source_word: κοπιῶντες
  choice: những người dốc sức
  rationale: Thể hiện sự lao nhọc và nỗ lực lớn của κοπιάω bằng lối nói hiện đại, trang trọng và tự nhiên.
- source_word: ἐν λόγῳ
  choice: trong việc giảng lời
  rationale: λόγος trong ngữ cảnh này nhiều khả năng chỉ chức vụ bằng lời nói, như công bố hoặc giảng truyền; 'giảng lời' rõ nghĩa trong tiếng Việt nhưng không giới hạn đối tượng của 'lời' thành một thuật ngữ giáo phái.
- source_word: διδασκαλίᾳ
  choice: dạy dỗ
  rationale: Cách nói dễ hiểu, tự nhiên, diễn tả hoạt động giảng dạy mà không mang sắc thái kỹ thuật quá mức như 'giáo lý'.
theological_decisions:
- issue: Ý nghĩa của 'sự tôn kính gấp đôi' đối với các trưởng lão
  choice: Giữ cách diễn đạt rộng 'sự tôn kính gấp đôi' trong chính văn.
  alternative: sự kính trọng đặc biệt; thù lao gấp đôi; sự tôn kính bao gồm hỗ trợ vật chất
  rationale: Câu kế tiếp hướng đến sự hỗ trợ vật chất, nhưng τιμή cũng có thể chỉ sự quý trọng. Giữ cụm từ rộng nghĩa tránh thu hẹp câu vào riêng thái độ kính trọng hoặc tiền thù lao.
- issue: Sắc thái của μάλιστα
  choice: Dịch là 'nhất là'.
  alternative: tức là
  rationale: Cách dịch này giữ nghĩa nhấn mạnh một nhóm, đồng thời không quyết định thay người đọc rằng cụm sau chỉ là lời giải thích đồng vị cho toàn bộ các trưởng lão.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'trưởng lão' theo cách gọi quen thuộc trong bối cảnh hội thánh; tránh những danh xưng gắn với một cơ cấu giáo hội riêng. Các dấu chú thích đều xuất hiện trong chính văn.
