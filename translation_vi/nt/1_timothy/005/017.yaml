revisions:
- from: Các trưởng lão lãnh đạo tốt phải được kể là xứng đáng nhận sự tôn kính gấp đôi,[a] nhất là những người dốc sức trong việc giảng lời và dạy dỗ.[b][c]
  to: Các trưởng lão lãnh đạo tốt phải được coi là xứng đáng hưởng sự trọng đãi gấp đôi,[a] nhất là những người dốc sức trong việc rao giảng và dạy dỗ.[b][c]
  rationale: Các sửa đổi chỉ nhằm giữ phạm vi ngữ nghĩa của τιμή và cải thiện tính tự nhiên của tiếng Việt. Cách dịch vẫn giữ ‘nhất là’ cho μάλιστα, không áp đặt cách hiểu đồng vị; cũng không xác định ‘trọng đãi’ chỉ là tôn kính hay hỗ trợ vật chất.
  reviewer_model: gpt-5.6-terra
