  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: vi
  text: Vì đã có một số người quay sang đi theo Sa-tan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “đã quay sang theo sau Sa-tan”; ὀπίσω nghĩa là “sau/đằng sau”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: đã
  rationale: Diễn tả việc này đã xảy ra; trong tiếng Việt, “đã” tự nhiên và đủ truyền đạt ý thời gian của ἤδη trong ngữ cảnh.
- source_word: γάρ
  choice: Vì
  rationale: Nối câu này với lời chỉ dẫn trước đó bằng cách nêu lý do hoặc lời giải thích.
- source_word: τινες
  choice: một số người
  rationale: Chỉ một nhóm không xác định; cách nói này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: ἐξετράπησαν
  choice: quay sang
  rationale: Giữ hình ảnh đổi hướng, lệch khỏi đường đang đi, mà không thêm ý bị người khác dẫn dụ vốn không được hình thái động từ đòi hỏi ở đây.
- source_word: ὀπίσω
  choice: đi theo
  rationale: Trong kết cấu với một ngôi vị, từ này có nghĩa đen là “đằng sau/sau” và gợi hành động theo bước; “đi theo” diễn đạt tự nhiên ý hướng theo và quy phục.
- source_word: Σατανᾶ
  choice: Sa-tan
  rationale: Dùng dạng phiên âm quen thuộc của danh xưng riêng trong tiếng Việt.
theological_decisions:
- issue: Nên dịch ὀπίσω τοῦ Σατανᾶ theo nghĩa đen là “đằng sau Sa-tan” hay theo nghĩa thành ngữ là “đi theo Sa-tan.”
  choice: đi theo Sa-tan
  alternative: quay sang đằng sau Sa-tan; quay sang theo sau Sa-tan
  rationale: “Đi theo Sa-tan” truyền đạt rõ ý hướng theo một ngôi vị, đồng thời vẫn giữ nét ẩn dụ về việc bước theo sau. Chú thích bảo lưu cách hiểu sát chữ của ὀπίσω.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Quay sang đi theo” giữ được cả ý đổi hướng của ἐξετράπησαν lẫn ý theo sau của ὀπίσω, tránh làm phẳng hai yếu tố thành một động từ duy nhất.
