id: 1TI.5.5
reference: 1 Timothy 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: vi
  text: Còn người thật sự là góa phụ và chỉ còn một mình[a] thì đã đặt niềm hy vọng nơi Đức Chúa Trời[b], kiên trì cầu xin và cầu nguyện đêm ngày[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã bị để lại một mình”; từ Hy Lạp nhấn mạnh tình trạng không có người thân nâng đỡ.
    reason: lexical_alternative
  - marker: b
    text: Hay “đã hy vọng nơi Đức Chúa Trời”; thể hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh niềm hy vọng đã được xác lập và vẫn còn hiệu lực.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn dùng hai từ: một từ chỉ những lời khẩn xin cụ thể, và một từ chỉ sự cầu nguyện nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντως χήρα
  choice: thật sự là góa phụ
  rationale: Diễn đạt hạng góa phụ đúng nghĩa theo văn cảnh, chứ không chỉ tình trạng hôn nhân được gọi tên.
- source_word: μεμονωμένη
  choice: chỉ còn một mình
  rationale: Thể hoàn thành nhấn mạnh tình trạng hiện tại do đã bị để lại một mình, trong văn cảnh là không còn người thân nâng đỡ.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: đặt niềm hy vọng nơi Đức Chúa Trời
  rationale: Diễn đạt niềm trông cậy đã được xác lập và vẫn còn tiếp diễn; tiếng Việt tự nhiên không nhất thiết đánh dấu thể hoàn thành bằng một trợ từ riêng.
- source_word: προσμένει
  choice: bền lòng
  rationale: Thể hiện sự tiếp tục và kiên trì trong các việc cầu nguyện.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: cầu xin và cầu nguyện
  rationale: 'Giữ hai thuật ngữ Hy Lạp: lời khẩn xin cụ thể và sự cầu nguyện theo nghĩa rộng.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: đêm ngày
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ thứ tự của nguyên văn và diễn tả việc thực hành liên tục.
- source_word: δὲ
  choice: Nhưng
  rationale: Bảo lưu sắc thái chuyển ý hoặc tương phản của δὲ trong mạch lập luận, dù mức độ tương phản nhẹ.
theological_decisions:
- issue: Đặc điểm của người thật sự là góa phụ
  choice: Câu này mô tả người góa phụ đúng nghĩa là người không còn chỗ nương tựa, đặt hy vọng nơi Đức Chúa Trời và kiên trì cầu nguyện.
  alternative: Câu này chỉ mô tả mọi góa phụ nói chung, không hàm ý một hạng người được xác định theo văn cảnh.
  rationale: ὄντως cùng văn cảnh 1 Ti-mô-thê 5 phân biệt một hạng góa phụ cụ thể; bản dịch giữ ý ấy nhưng không thêm tiêu chuẩn giáo phái hoặc cơ chế hội thánh ngoài câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Góa phụ” chính xác và thông dụng; “chỉ còn một mình” tự nhiên hơn cách dịch sát chữ cứng nhắc. Giữ cả “cầu xin” và “cầu nguyện” để phản ánh hai danh từ Hy Lạp.
