id: 1TI.5.1
reference: 1 Timothy 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: vi
  text: Đừng quở trách một người đàn ông lớn tuổi, nhưng hãy khuyên nhủ người ấy như cha; hãy khuyên nhủ những người đàn ông trẻ tuổi như anh em,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: một người đàn ông lớn tuổi
  rationale: Danh từ hóa ở giống đực số ít; thế đối chiếu với νεωτέρους trong câu này và với các nhóm nam nữ theo tuổi ở câu kế tiếp thiên về nghĩa chỉ tuổi tác, không phải chức vụ trưởng lão.
- source_word: μὴ ἐπιπλήξῃς
  choice: Đừng nặng lời quở trách
  rationale: ἐπιπλήσσω chỉ sự công kích hoặc khiển trách bằng lời; “nặng lời quở trách” truyền đạt sắc thái gay gắt của động từ mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀλλὰ παρακάλει
  choice: nhưng hãy khuyên nhủ người ấy
  rationale: παρακαλέω có thể mang nghĩa khuyên, thúc giục, an ủi hoặc kêu gọi. Trong thế tương phản với việc nặng lời và trong hình ảnh gia đình, “khuyên nhủ” diễn đạt cung cách tôn trọng, gần gũi.
- source_word: ὡς πατέρα
  choice: như cha
  rationale: ὡς nêu sự so sánh; cách nói ngắn gọn “như cha” tự nhiên và giữ nguyên hình ảnh quan hệ gia đình.
- source_word: νεωτέρους
  choice: những người đàn ông trẻ tuổi
  rationale: Tính từ giống đực số nhiều được dùng như danh từ. Câu kế tiếp nói riêng đến phụ nữ lớn tuổi và phụ nữ trẻ tuổi, nên cần giữ đối tượng nam giới ở đây.
- source_word: ὡς ἀδελφούς
  choice: như anh em
  rationale: ἀδελφούς là giống đực số nhiều và thuộc chuỗi phân nhóm theo tuổi và giới tính; “anh em” giữ được hình ảnh gia đình mà không thêm ý “trong đức tin” vốn không được nói rõ.
theological_decisions:
- issue: Πρεσβυτέρῳ chỉ người đàn ông lớn tuổi hay chức vụ trưởng lão
  choice: người đàn ông lớn tuổi
  alternative: một trưởng lão
  rationale: Cấu trúc người lớn tuổi/cha, người nam trẻ tuổi/anh em, rồi phụ nữ lớn tuổi/mẹ và phụ nữ trẻ tuổi/chị em ở câu kế tiếp ủng hộ mạnh cách hiểu theo tuổi tác. Tuy vậy, nghĩa “trưởng lão” vẫn khả hữu về mặt từ vựng nên được ghi ở chú thích.
- issue: ἀδελφούς có nên được diễn đạt bao gồm cả nam và nữ hay không
  choice: anh em
  alternative: anh chị em
  rationale: Trong văn cảnh này, các nhóm được phân biệt rõ theo giới tính và tuổi tác; vì vậy giống đực số nhiều chỉ nhóm nam trẻ tuổi, không phải cách gọi bao quát cả nam lẫn nữ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Nặng lời quở trách” giữ sắc thái mạnh của ἐπιπλήσσω; “khuyên nhủ” tạo thế tương phản mang tính tôn trọng. Dấu chấm phẩy và dấu phẩy cuối câu phản ánh đây là phần mở đầu của một câu tiếp tục sang 1 Ti-mô-thê 5:2.
