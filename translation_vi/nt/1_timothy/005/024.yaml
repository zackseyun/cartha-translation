id: 1TI.5.24
reference: 1 Timothy 5:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: vi
  text: Tội lỗi của một số người thì rõ ràng[a], đi trước họ đến sự phán xét[b]; còn tội lỗi của những người khác thì theo sau họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hiển nhiên” hoặc “lộ rõ.”'
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh, “sự phán xét” có thể chỉ việc xem xét, đánh giá ở hiện tại; tuy nhiên, cách diễn đạt này cũng có thể mang nghĩa rộng hơn là sự phán xét của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Tội lỗi của một số người
  rationale: Giữ quan hệ sở hữu của cụm sở hữu cách và dùng “người” theo nghĩa khái quát tự nhiên của ἄνθρωπος trong tiếng Việt.
- source_word: πρόδηλοί εἰσιν
  choice: thì rõ ràng
  rationale: Diễn đạt trạng thái hiện tại và ý nghĩa công khai, dễ nhận thấy của πρόδηλος bằng lối nói hiện đại, tự nhiên.
- source_word: προάγουσαι
  choice: đi trước họ
  rationale: 'Giữ hình ảnh nhân hóa: chính các tội lỗi đi trước những người ấy; “họ” được bổ sung từ ngữ cảnh để câu tiếng Việt rõ nghĩa.'
- source_word: εἰς κρίσιν
  choice: đến sự phán xét
  rationale: Giữ lực hướng tới của εἰς và không thu hẹp κρίσις thành riêng việc thẩm tra hiện tại hay sự phán xét cuối cùng.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: còn tội lỗi của những người khác thì theo sau
  rationale: Thể hiện sự tương phản giữa hai nhóm; lặp lại “tội lỗi” để xác định rõ chủ ngữ trong tiếng Việt, đồng thời giữ hình ảnh chúng theo sau.
theological_decisions:
- issue: Phạm vi nghĩa của κρίσις
  choice: sự phán xét
  alternative: sự xem xét hoặc đánh giá trong cộng đồng; sự phán xét cuối cùng của Đức Chúa Trời
  rationale: Ngữ cảnh gần nói về việc đánh giá người khác, nhưng từ ngữ Hy Lạp cũng có thể mang nghĩa rộng hơn. Bản dịch không quyết định thay người đọc mà giữ nguyên sức căng diễn giải.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chấm phẩy làm rõ hai vế tương phản. Hình ảnh nhân hóa của nguyên văn—tội lỗi đi trước hoặc theo sau con người—được bảo toàn.
