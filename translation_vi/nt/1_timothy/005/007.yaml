  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: vi
  text: Hãy truyền dạy những điều này[a], để họ không có gì đáng chê trách.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chỉ dạy” hoặc “chỉ thị”; động từ Hy Lạp mang sắc thái có thẩm quyền.'
    reason: lexical_alternative
  - marker: b
    text: Chủ thể của câu “họ không có gì đáng chê trách” không được nêu rõ trong tiếng Hy Lạp. Theo ngữ cảnh, rất có thể đó là những người được nói đến trong các chỉ thị trước, đặc biệt là các góa phụ và gia đình họ.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối câu với phần trước. Trong tiếng Việt hiện đại, mở đầu bằng “Và” ở đây khá gượng; sự tiếp nối đã rõ trong mạch văn nên có thể để hàm ẩn mà không làm mất ý.
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ cách chỉ dẫn khái quát của đại từ trung tính số nhiều, quy chiếu về các chỉ thị trong ngữ cảnh mà không thu hẹp thành một nội dung cụ thể.
- source_word: παράγγελλε
  choice: hãy truyền dạy
  rationale: Thể mệnh lệnh hiện tại mang sắc thái chỉ thị có thẩm quyền và có tính tiếp diễn. “Truyền dạy” tự nhiên, trang trọng và mạnh hơn “khuyên bảo”, nhưng không quá thiên về mệnh lệnh cưỡng chế như một số cách hiểu của “ra lệnh”.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả trong tiếng Việt.
- source_word: ἀνεπίλημπτοι
  choice: không có gì đáng chê trách
  rationale: Diễn đạt tình trạng không tạo cơ sở chính đáng cho lời khiển trách hay cáo buộc, tránh sắc thái tuyệt đối về sự vô tội hoặc hoàn hảo của “không chỗ trách được”.
- source_word: ὦσιν
  choice: họ ... có
  rationale: Trong mệnh đề với ἵνα, động từ liên hệ ở lối giả định được chuyển tự nhiên thành “để họ không có…”. Đại từ số nhiều được giữ ở mức không xác định vì chủ thể không được nêu rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Đối tượng của chủ ngữ số nhiều hàm ẩn trong ὦσιν
  choice: Dùng đại từ chung “họ”, không xác định nhóm người ngay trong chính văn.
  alternative: Nêu cụ thể các góa phụ và gia đình họ; hoặc hiểu rộng hơn là Ti-mô-thê hay cộng đồng Hội Thánh.
  rationale: Tiếng Hy Lạp không nêu chủ ngữ. Ngữ cảnh gần nhất nghiêng về những người được đề cập trong các chỉ thị trước đó, đặc biệt là các góa phụ và gia đình họ, nhưng việc xác định rõ trong chính văn sẽ giải quyết một sự mơ hồ mà nguyên bản vẫn để ngỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu mệnh lệnh giữ thẩm quyền mục vụ của nguyên văn; cách diễn đạt cuối câu tránh hàm ý sự hoàn hảo tuyệt đối và bảo toàn tính mơ hồ về chủ thể.
