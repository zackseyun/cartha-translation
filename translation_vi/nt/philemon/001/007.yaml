id: PHM.1.7
reference: Philemon 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: vi
  text: Vì tình yêu thương của anh, tôi đã có niềm vui lớn và được khích lệ, vì nhờ anh mà tấm lòng[a] của các thánh đồ đã được làm tươi mới, hỡi anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “nội tạng”; đây là thành ngữ chỉ phần tình cảm sâu kín hay đời sống nội tâm.
    reason: Bảo lưu sắc thái thành ngữ của σπλάγχνα, được dịch tự nhiên trong bản văn là “tấm lòng”.
lexical_decisions:
- source_word: χαρὰν
  choice: niềm vui
  rationale: Diễn đạt tự nhiên ý vui mừng của χαρά và giữ sắc thái tình cảm trong lời Phao-lô.
- source_word: πολλὴν ἔσχον
  choice: tôi đã có… lớn
  rationale: ἔσχον diễn tả việc trải nghiệm hay có được, còn πολλήν bổ nghĩa mức độ; tiếng Việt tự nhiên dùng “niềm vui lớn”.
- source_word: παράκλησιν
  choice: được khích lệ
  rationale: Trong ngữ cảnh này, παράκλησις chỉ sự nâng đỡ, khích lệ mà tình yêu thương của Phi-lê-môn đem lại; cách diễn đạt bằng động từ tự nhiên hơn trong tiếng Việt.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: bởi tình yêu thương của anh
  rationale: 'ἐπί với cách dữ ở đây mang ý nguyên nhân hay cơ sở: tình yêu thương của Phi-lê-môn là nguồn đem lại niềm vui và sự khích lệ.'
- source_word: ἀγάπῃ
  choice: tình yêu thương
  rationale: Cách dịch thông dụng, sáng rõ của ἀγάπη trong văn mạch Cơ Đốc.
- source_word: σπλάγχνα
  choice: tấm lòng
  rationale: Nghĩa đen liên quan đến nội tạng, nhưng theo thành ngữ chỉ phần sâu kín của tình cảm và đời sống nội tâm; “tấm lòng” tự nhiên và trang trọng trong tiếng Việt.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: Giữ cách gọi cộng đồng tín hữu là những người được biệt riêng cho Đức Chúa Trời, phù hợp với cách dùng của Phao-lô.
- source_word: ἀναπέπαυται
  choice: đã được thư thái
  rationale: Thì hoàn thành diễn tả một hành động đã đem lại trạng thái còn tiếp diễn; “được thư thái” giữ ý nghỉ ngơi, nhẹ nhõm của động từ.
- source_word: διὰ σοῦ
  choice: nhờ anh
  rationale: διά với sở hữu cách biểu thị tác nhân hay phương tiện; “nhờ anh” tự nhiên và giữ rõ vai trò của Phi-lê-môn.
- source_word: ἀδελφέ
  choice: hỡi người anh em
  rationale: Giữ lời xưng hô trực tiếp mang tính gia đình trong cộng đồng đức tin mà không thêm sắc thái không có trong nguyên văn.
theological_decisions:
- issue: Cách dịch ἅγιοι
  choice: các thánh đồ
  alternative: những người thánh; dân của Đức Chúa Trời
  rationale: “Các thánh đồ” giữ nguyên ngôn ngữ cộng đồng của Phao-lô, chỉ các tín hữu được biệt riêng cho Đức Chúa Trời, không hàm ý việc phong thánh về sau.
- issue: Thành ngữ nhân học σπλάγχνα
  choice: tấm lòng
  alternative: lòng dạ; phần tình cảm sâu kín
  rationale: Từ Hy Lạp chỉ nội tạng theo nghĩa đen nhưng được dùng cho đời sống nội tâm và tình cảm sâu xa. “Tấm lòng” truyền đạt thành ngữ tự nhiên mà không thu hẹp ý nghĩa vào cơ quan cơ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ hai mệnh đề nguyên nhân của bản Hy Lạp; “hỡi người anh em” bảo lưu lời gọi trực tiếp ở cuối câu.
