revisions:
- from: Vì tôi đã có niềm vui lớn và được khích lệ bởi tình yêu thương của anh, bởi nhờ anh mà tấm lòng[a] của các thánh đồ đã được thư thái, hỡi người anh em.
  to: Vì tình yêu thương của anh, tôi đã có niềm vui lớn và được khích lệ, vì nhờ anh mà tấm lòng[a] của các thánh đồ đã được làm tươi mới, hỡi anh em.
  rationale: Sửa cấu trúc nguyên nhân để câu tự nhiên và minh bạch hơn, đồng thời thay "đã được thư thái" bằng "đã được làm tươi mới" để phản ánh sát hơn ἀναπέπαυται. Không thay đổi nội dung, đối tượng, thì-thể, hay tính chất lời xưng hô của nguyên văn.
  reviewer_model: gpt-5.6-terra
