    rationale: περὶ τοῦ ἐμοῦ τέκνου có nghĩa cơ bản là “về/liên quan đến đứa con của tôi.” Trong ngữ cảnh lời thỉnh cầu, “vì” có thể dùng được nhưng cũng dễ hiểu là “vì lợi ích của”; “về Ô-nê-sim” rõ hơn mà không thay đổi ý.
  - severity: low
    issue: Trật tự “đứa con của tôi, là Ô-nê-sim” hơi gượng trong văn xuôi hiện đại.
    rationale: Đưa tên riêng lên ngay sau “về” làm rõ ngay đối tượng của lời thỉnh cầu; phần “đứa con của tôi” vẫn giữ được vai trò giải thích và tình cảm của nguyên văn.
