  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: vi
  text: Tôi khẩn khoản xin anh về Ô-nê-sim, đứa con của tôi[a], người tôi đã sinh ra trong xiềng xích[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đứa con của tôi” là một ẩn dụ về mối quan hệ thuộc linh thân thiết, không nói đến con ruột.
    reason: metaphor_clarification
  - marker: b
    text: “Trong xiềng xích” cũng có thể được hiểu là “trong cảnh tù đày”; nguyên văn giữ hình ảnh cụ thể của xiềng xích.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Tôi khẩn khoản xin
  rationale: Diễn đạt một lời thỉnh cầu tha thiết, mang tính cá nhân và quan hệ, thay vì một mệnh lệnh.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: vì đứa con của tôi
  rationale: Trong ngữ cảnh cầu xin cho một người, “vì” tự nhiên trong tiếng Việt và vẫn thể hiện người mà lời thỉnh cầu hướng đến; “đứa con của tôi” giữ hình ảnh thân tình của τέκνον và sở hữu cách ἐμοῦ.
- source_word: ὃν ἐγέννησα
  choice: người tôi đã sinh ra
  rationale: Giữ nguyên ẩn dụ sinh thành của γεννάω mà không giải thích thẳng thành việc dẫn Ô-nê-sim đến đức tin.
- source_word: ἐν τοῖς δεσμοῖς
  choice: trong xiềng xích
  rationale: Giữ hình ảnh cụ thể về sự trói buộc; cụm từ cũng có thể chỉ tình trạng bị cầm tù.
- source_word: Ὀνήσιμον
  choice: Ô-nê-sim
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Bản chất mối quan hệ giữa Phao-lô và Ô-nê-sim
  choice: Giữ ẩn dụ Phao-lô sinh ra Ô-nê-sim và gọi ông là con.
  alternative: người mà tôi đã trở thành cha trong thời gian bị giam cầm
  rationale: Nguyên văn gợi ý quan hệ cha con thuộc linh nhưng không trực tiếp dùng ngôn ngữ về sự cải đạo; bản dịch không nên nói rõ hơn bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tình cảm. “Khẩn khoản xin” truyền đạt sắc thái tha thiết của lời thỉnh cầu; “sinh ra” cố ý giữ ẩn dụ mạnh của nguyên văn. Câu kết bằng dấu phẩy vì câu Hy Lạp tiếp tục sang ý kế tiếp.
