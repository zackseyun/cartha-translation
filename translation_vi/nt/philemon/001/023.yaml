  - severity: low
    issue: Cụm «gửi lời chào anh» có thể tự nhiên hơn với «đến»
    rationale: «Gửi lời chào đến anh» là lối kết hợp thư tín thông dụng hơn; vẫn dịch chính xác ἀσπάζεταί σε.
