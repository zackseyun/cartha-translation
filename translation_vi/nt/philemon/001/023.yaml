source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: vi
  text: Ê-pháp-ra, người bạn tù của tôi trong Đấng Mê-si-a Giê-su[a], gửi lời chào đến anh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo lối truyền thống: “trong Đấng Christ Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: gửi lời chào
  rationale: Động từ ἀσπάζομαι ở đây mang nghĩa chào hỏi hoặc gửi lời chào; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với việc Ê-pháp-ra không trực tiếp hiện diện trước người nhận.
- source_word: σε
  choice: anh
  rationale: Đại từ ngôi thứ hai số ít chỉ trực tiếp Phi-lê-môn. “Anh” thể hiện số ít và phù hợp với giọng thư tín thân tình, tôn trọng trong ngữ cảnh.
- source_word: Ἐπαφρᾶς
  choice: Ê-pháp-ra
  rationale: Tên riêng được phiên âm theo lối quen thuộc, rõ ràng đối với độc giả Kinh Thánh tiếng Việt.
- source_word: ὁ συναιχμάλωτός μου
  choice: người bạn tù của tôi
  rationale: Danh từ ghép chỉ người cùng chịu cảnh tù đày với Phao-lô. “Bạn tù” là cách nói tiếng Việt tự nhiên, không nhất thiết hàm ý họ ở cùng một phòng giam.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong” để bảo tồn ngôn ngữ đặc trưng của Phao-lô về mối liên hiệp với Đấng Mê-si-a; Χριστός được dịch theo nghĩa tước hiệu, còn Ἰησοῦ được phiên âm như tên riêng.
theological_decisions:
- issue: Cách dịch Χριστῷ trong công thức ἐν Χριστῷ Ἰησοῦ của Phao-lô
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong cụm này, Χριστός vẫn mang sức nặng của tước hiệu chỉ Đấng được xức dầu. “Đấng Mê-si-a” chuyển tải nghĩa tước hiệu trong tiếng Việt hiện đại, trong khi vẫn giữ nguyên sự căng thẳng thần học của cụm “trong Đấng Mê-si-a” thay vì diễn giải thành “vì” hoặc “do” Giê-su.
translation_notes:
  register: Văn phong thư tín hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” để biểu đạt rõ đại từ số ít σε; dùng “gửi lời chào” thay vì lối cổ “chào thăm”. Cấu trúc đặt cụm đồng vị sau tên riêng bám sát trọng tâm của nguyên văn Hy Lạp.
