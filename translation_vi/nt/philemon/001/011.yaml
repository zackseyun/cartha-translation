source:
  edition: SBLGNT
  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: vi
  text: là người trước kia vô ích cho anh[a], nhưng nay hữu ích cho cả anh lẫn tôi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phao-lô có lẽ đang chơi chữ dựa trên tên Ô-nê-sim, một tên có liên hệ với ý nghĩa “hữu ích” hoặc “có lợi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: là người
  rationale: Mạo từ đối cách được dùng như danh từ và quy chiếu về Ô-nê-sim ở câu trước; “là người” nối tiếp câu tự nhiên trong tiếng Việt.
- source_word: ποτέ
  choice: trước kia
  rationale: Diễn đạt thời gian quá khứ rõ ràng và tạo thế đối lập tự nhiên với νυνὶ, “nay”.
- source_word: σοι
  choice: cho anh
  rationale: Dative chỉ người mà Ô-nê-sim từng không đem lại ích lợi; “cho anh” tự nhiên trong ngữ cảnh quan hệ cá nhân.
- source_word: ἄχρηστον
  choice: vô ích
  rationale: Giữ nghĩa trực tiếp là “không hữu dụng” và bảo toàn sự đối xứng từ vựng với εὔχρηστον.
- source_word: νυνὶ δὲ
  choice: nhưng nay lại
  rationale: “Nhưng nay” giữ lực tương phản; “lại” giúp câu tiếng Việt tự nhiên mà không thêm nội dung đáng kể.
- source_word: σοὶ καὶ ἐμοὶ
  choice: cho cả anh lẫn tôi
  rationale: Cấu trúc “cả… lẫn…” thể hiện rõ hai đối tượng được phối hợp trong nguyên văn.
- source_word: εὔχρηστον
  choice: hữu ích
  rationale: Là từ tương đương hiện đại, rõ nghĩa, đồng thời duy trì cặp đối lập “vô ích/hữu ích” và khả năng chơi chữ với tên Ô-nê-sim.
theological_decisions:
- issue: Khả năng chơi chữ với tên Ô-nê-sim và sự thay đổi của ông
  choice: Giữ cặp đối lập đơn giản “vô ích/hữu ích” trong chính văn
  alternative: Diễn giải rõ lối chơi chữ, chẳng hạn “trước chẳng đúng với cái tên hữu ích… nay thật sự hữu ích”
  rationale: Nguyên văn nêu sự tương phản nhưng không giải thích trực tiếp lối chơi chữ. Bản dịch giữ hiệu ứng văn chương và để chú thích cung cấp thông tin tên gọi, tránh diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh” phù hợp với lời thư trực tiếp gửi Phi-lê-môn; cặp “vô ích/hữu ích” vừa sát cấu trúc Hy Lạp vừa rõ ràng trong tiếng Việt.
