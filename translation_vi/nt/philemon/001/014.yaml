id: PHM.1.14
reference: Philemon 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: vi
  text: Nhưng không có sự đồng ý của anh[a], tôi đã không muốn làm bất cứ điều gì, để việc tốt của anh[b] không như do bị ép buộc, mà là tự nguyện.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ý kiến của anh” hoặc “sự chấp thuận của anh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lòng tốt của anh” hoặc “lòng nhân ái của anh”; tiếng Hy Lạp có thể chỉ việc tốt Phi-lê-môn làm trong trường hợp này hoặc, theo nghĩa khái quát hơn, phẩm chất tốt lành của ông.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “nhưng theo điều tự nguyện,” tức là “do chính anh tự nguyện.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: nếu không có sự đồng ý của anh
  rationale: γνώμη có thể chỉ ý kiến, sự phán đoán, chủ ý hoặc sự chấp thuận. Trong ngữ cảnh này, “sự đồng ý” diễn đạt tự nhiên việc Phao-lô không muốn hành động nếu chưa có sự chấp thuận của Phi-lê-môn; chú thích giữ lại các khả năng khác.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: tôi không muốn làm gì cả
  rationale: Giữ sắc thái ý muốn của θέλω và cấu trúc phủ định mạnh của οὐδέν, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Diễn đạt rõ mục đích của hành động mà không làm nặng câu.
- source_word: ὡς κατὰ ἀνάγκην
  choice: không giống như do bị ép buộc
  rationale: “Giống như” phản ánh ὡς, còn “do bị ép buộc” truyền đạt sắc thái cưỡng bách của κατὰ ἀνάγκην.
- source_word: τὸ ἀγαθόν σου
  choice: việc lành của anh
  rationale: Cụm này có thể chỉ một hành động tốt cụ thể hoặc phẩm chất tốt lành nói chung. “Việc lành của anh” giữ được tính tương đối rộng và không xác định quá mức hành động được nói đến.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: nhưng do tự nguyện
  rationale: Nêu rõ sự tương phản với ép buộc và diễn đạt ý hành động theo ý nguyện tự do, dù nguyên văn dùng lối diễn đạt danh hóa.
theological_decisions:
- issue: Tính chất của sự đáp ứng từ Phi-lê-môn
  choice: Nhấn mạnh rằng việc lành phải xuất phát từ sự tự nguyện chứ không do ép buộc, nhưng không xác định cụ thể việc ấy là gì.
  alternative: Dịch trừu tượng là “lòng tốt của anh” hoặc cụ thể hơn là “lòng nhân ái của anh”.
  rationale: Nguyên văn nhấn mạnh phẩm chất tự nguyện của sự đáp ứng và vẫn để ngỏ phạm vi của τὸ ἀγαθόν σου; bản dịch không nên đưa thêm một hành động hay lập trường thần học cụ thể.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Đại từ “anh” phù hợp với lời Phao-lô nói trực tiếp với Phi-lê-môn trong quan hệ thân tình; câu giữ đối lập rõ giữa “bị ép buộc” và “tự nguyện”.
