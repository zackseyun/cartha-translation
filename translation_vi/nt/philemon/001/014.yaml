  rationale: Sửa giới từ mở đầu để không thêm sắc thái điều kiện, thể hiện thì quá khứ của động từ chính, và làm rõ rằng tính tự nguyện mô tả “việc tốt” của Phi-lê-môn. Các chú thích giữ nguyên những khả năng từ vựng chính đáng và không thu hẹp điều tốt được nói đến.
