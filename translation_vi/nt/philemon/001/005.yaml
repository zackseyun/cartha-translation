  verdict: revise
  source_fidelity: Bản dịch giữ đúng lực nguyên nhân của phân từ ἀκούων trong mạch câu trước, hai danh từ ἀγάπην/πίστιν, và không tự phân phối dứt khoát hai cụm giới từ πρὸς và εἰς. Tuy nhiên, “thánh đồ” mang màu sắc truyền thống hệ phái và kém trung tính trong tiếng Việt hiện đại; “các thánh” gần với ἅγιοι hơn và là thuật ngữ Tân Ước thông dụng. Cụm “đức tin anh có” cũng cần liên kết bằng “mà” để phản ánh mệnh đề quan hệ ἣν ἔχεις một cách rõ ràng, tự nhiên.
  naturalness: “Vì tôi nghe nói về tình yêu thương và đức tin mà anh có...” là tiếng Việt hiện đại, rõ cấu trúc, đồng thời không làm trơn sự căng giữa hai danh từ với hai cụm giới từ theo sau. “Các thánh” tự nhiên và trung tính hơn “các thánh đồ.”
  terminology: Giữ “tình yêu thương,” “đức tin,” và “Chúa Giê-su.” Đổi ἅγιοι từ “các thánh đồ” thành “các thánh” để tránh một cách gọi mang sắc thái hệ phái không cần thiết. Chú thích về cách hiểu phân phối và nghĩa “lòng trung tín” vẫn cần thiết; chú thích c được điều chỉnh để thực sự nêu một phương án cấu trúc khác với bản chính.
  issues:
