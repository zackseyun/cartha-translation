source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: vi
  text: vì tôi nghe nói về tình yêu thương và đức tin mà anh có đối với Chúa Giê-su và dành cho tất cả các thánh.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn đạt rõ theo cách hiểu phân phối: “đức tin anh đặt nơi Chúa Giê-su và tình yêu thương anh dành cho tất cả các thánh.”'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “lòng trung tín mà anh có.” Từ Hy Lạp có thể chỉ đức tin, sự tin cậy hoặc lòng trung tín.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể phản ánh cấu trúc theo cách khác: “tình yêu thương của anh và đức tin mà anh có.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: vì tôi nghe nói
  rationale: Phân từ phụ thuộc vào lời tạ ơn ở câu trước và mang sắc thái nguyên nhân; cách diễn đạt này tự nhiên trong tiếng Việt đồng thời giữ ý hiện tại.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: Cách dịch tự nhiên, quen thuộc của ἀγάπη trong văn cảnh Cơ Đốc.
- source_word: πίστιν
  choice: đức tin
  rationale: Giữ cách dịch mặc định của πίστις; khả năng mang nghĩa “lòng trung tín” được ghi ở chú thích.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: đối với Chúa Giê-su
  rationale: Diễn đạt hướng quy chiếu đến một thân vị và giữ sự phân biệt với giới từ εἰς ở vế sau.
- source_word: κύριον
  choice: Chúa
  rationale: Danh xưng Cơ Đốc học thông dụng và trang trọng của κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: dành cho tất cả các thánh đồ
  rationale: “Dành cho” tự nhiên với tình yêu thương, còn “tất cả các thánh đồ” giữ nguyên phạm vi và danh xưng cộng đồng.
- source_word: ἁγίους
  choice: các thánh đồ
  rationale: Cách gọi ngắn gọn, đã quen dùng cho cộng đồng những người thuộc về Đức Chúa Trời trong thư tín Phao-lô.
theological_decisions:
- issue: Quan hệ giữa “tình yêu thương”, “đức tin” và hai cụm giới từ theo sau
  choice: Giữ trật tự bề mặt của tiếng Hy Lạp, để cả “tình yêu thương và đức tin” đứng trước “đối với Chúa Giê-su và dành cho tất cả các thánh đồ”.
  alternative: 'Diễn giải phân phối: “đức tin anh đặt nơi Chúa Giê-su và tình yêu thương anh dành cho tất cả các thánh đồ”.'
  rationale: Cách phân phối phù hợp với tư tưởng của Phao-lô và câu 7, nhưng cú pháp Hy Lạp không đánh dấu rõ việc phân phối. Bản chính vì thế giữ độ căng và tính mơ hồ của nguyên văn; chú thích nêu cách hiểu rõ nghĩa hơn.
- issue: Sắc thái của πίστις
  choice: đức tin
  alternative: lòng trung tín
  rationale: “Đức tin” là nghĩa mặc định trong văn cảnh Tân Ước, nhưng từ này cũng có thể chỉ sự trung tín; không nên tự ý quyết định sắc thái ấy trong bản chính.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” phù hợp với lời trực tiếp gửi Phi-lê-môn; giữ “thánh đồ” như danh xưng cộng đồng quen thuộc. Dấu phẩy cuối câu không được đưa vào vì câu tiếng Việt đứng độc lập trong mục này.
