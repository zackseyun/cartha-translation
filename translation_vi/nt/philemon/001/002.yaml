id: PHM.1.2
reference: Philemon 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: vi
  text: 'và gửi đến A-phi, người chị em[a], đến A-chíp, người bạn cùng chiến đấu với chúng tôi, và đến hội thánh tại nhà anh:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “người chị em của chúng tôi.”
    reason: Dị bản thêm ἡμῶν (“của chúng tôi”) sau “người chị em”; chú thích bảo tồn khác biệt thủ bản mà không thay đổi bản văn SBLGNT trong chính văn.
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Áp-phi
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt, thay vì dịch nghĩa tên.
- source_word: τῇ ἀδελφῇ
  choice: người chị em
  rationale: Giữ danh từ chỉ nữ giới và ngôn ngữ thân thuộc trong cộng đồng đức tin. Không thêm từ sở hữu “của chúng tôi” vì bản SBLGNT được cung cấp không có ἡμῶν tại đây.
- source_word: Ἀρχίππῳ
  choice: A-chíp
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
- source_word: τῷ συστρατιώτῃ ἡμῶν
  choice: người bạn cùng chiến đấu với chúng tôi
  rationale: Giữ hình ảnh quân sự của danh từ ghép συστρατιώτης và thể hiện rõ ἡμῶν; cách nói này tự nhiên hơn bản dịch sát chữ “đồng binh của chúng tôi” trong tiếng Việt hiện đại.
- source_word: τῇ κατ’ οἶκόν σου ἐκκλησίᾳ
  choice: hội thánh tại nhà anh
  rationale: “Hội thánh” là cách gọi tự nhiên, đã được xác lập cho cộng đồng Cơ Đốc; “tại nhà anh” giữ gần cấu trúc Hy Lạp mà không diễn giải thêm rằng hội thánh “nhóm họp” ở đó.
- source_word: καὶ
  choice: và… đến… và đến
  rationale: Giữ cấu trúc liệt kê có các liên từ lặp lại, đồng thời dùng “đến” để làm rõ những người nhận thư trong tiếng Việt.
theological_decisions:
- issue: Có nên thêm đại từ sở hữu vào τῇ ἀδελφῇ hay không
  choice: người chị em
  alternative: người chị em của chúng tôi
  rationale: Bản văn SBLGNT được cung cấp không có ἡμῶν sau ἀδελφῇ, nên bản dịch chính không thêm ý sở hữu. Dị bản có đại từ sở hữu được ghi trong chú thích thay vì đưa vào chính văn.
- issue: Mức độ diễn giải cụm κατ’ οἶκόν σου
  choice: hội thánh tại nhà anh
  alternative: hội thánh nhóm họp tại nhà anh
  rationale: Bản dịch chính bảo tồn cách diễn đạt cô đọng của nguyên văn và không mặc nhiên giải quyết liệu cụm từ chỉ địa điểm hiện diện hay địa điểm nhóm họp, dù ý nhóm họp rất có thể được hàm chứa.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. Dùng “anh” cho σου vì người được trực tiếp xưng hô là Phi-lê-môn, một người nam; cách dùng này cũng giúp tránh diễn giải cụm từ là “nhà của anh chị em”. Các tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
