id: PHM.1.6
reference: Philemon 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: vi
  text: để sự chia sẻ đức tin của anh trở nên hữu hiệu nhờ sự nhận biết mọi điều tốt lành ở trong chúng ta, hướng về Đấng Mê-si[a][b][c][d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự thông công của đức tin anh” hoặc “sự dự phần trong đức tin của anh.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “đức tin” đôi khi cũng có thể mang nghĩa “lòng trung tín” hoặc “sự tin cậy.”
    reason: alternative_reading
  - marker: c
    text: Một số thủ bản chép “trong anh” thay vì “trong chúng ta.”
    reason: textual_variant
  - marker: d
    text: 'Hay: “vì Đấng Ki-tô.” Tước hiệu Χριστός được dịch là “Đấng Mê-si” ở đây.'
    reason: lexical_alternative
  - marker: e
    text: Cụm “hướng về Đấng Mê-si” (εἰς Χριστόν) có quan hệ cú pháp không chắc chắn; cũng có thể hiểu là “vì Đấng Mê-si” hoặc là cụm này quy chiếu đến toàn ý của mệnh đề.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích trong lời cầu nguyện của Phao-lô.
- source_word: κοινωνία τῆς πίστεώς σου
  choice: sự thông công trong đức tin của anh
  rationale: κοινωνία có thể chỉ sự thông công, chia sẻ hay dự phần. Cách dịch này giữ sắc thái cộng đồng và không thu hẹp cụm từ vào việc truyền đạt đức tin; quan hệ của sở hữu cách vẫn thực sự mơ hồ.
- source_word: πίστεώς
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ này nhiều khả năng nói đến đức tin của Phi-lê-môn, dù cũng có thể mang sắc thái lòng trung tín hoặc sự tin cậy.
- source_word: ἐνεργὴς γένηται
  choice: trở nên hữu hiệu
  rationale: Giữ ý chuyển thành trạng thái tích cực hoặc có hiệu quả, đồng thời phù hợp với sắc thái cầu nguyện của mệnh đề.
- source_word: ἐν ἐπιγνώσει
  choice: qua việc nhận biết
  rationale: ἐν có thể mang sắc thái phương tiện; 'qua việc nhận biết' là tiếng Việt tự nhiên, còn ἐπίγνωσις chỉ sự nhận biết sâu hoặc đầy đủ mà không nhất thiết phải cường điệu trong chính văn.
- source_word: παντὸς ἀγαθοῦ
  choice: mọi điều tốt lành
  rationale: Diễn đạt tự nhiên tính từ trung tính dùng như danh từ; không thêm ý 'ân tứ' vốn không có trong nguyên văn.
- source_word: τοῦ ἐν ἡμῖν
  choice: ở trong chúng ta
  rationale: Theo bản văn SBLGNT với ἡμῖν và giữ phạm vi tập thể; một số thủ bản đọc 'trong anh'.
- source_word: εἰς Χριστόν
  choice: hướng về Đấng Mê-si
  rationale: εἰς diễn tả sự hướng đến hoặc quy chiếu về; cách dịch này giữ được tính mở của quan hệ cú pháp. Χριστός được dịch như một tước hiệu.
theological_decisions:
- issue: Ý nghĩa của κοινωνία τῆς πίστεώς σου
  choice: sự thông công trong đức tin của anh
  alternative: sự chia sẻ đức tin của anh; sự dự phần do đức tin của anh tạo nên
  rationale: Cụm Hy Lạp nổi tiếng là khó hiểu. Chính văn giữ nét cộng đồng của κοινωνία mà không quyết định rằng đây chỉ là việc chia sẻ đức tin cho người khác; các khả năng khác được ghi chú.
- issue: Đối tượng của ἐν ἡμῖν
  choice: '''chúng ta,'' chỉ Phao-lô, Phi-lê-môn và cộng đồng tín hữu'
  alternative: dị bản 'trong anh,' chỉ riêng Phi-lê-môn
  rationale: Giữ cách đọc của SBLGNT, đồng thời nêu dị bản có chứng cứ thủ bản.
- issue: Quan hệ của εἰς Χριστόν
  choice: hướng về Đấng Mê-si, với quan hệ cú pháp được giữ tương đối mở
  alternative: vì Đấng Ki-tô; dẫn đến Đấng Ki-tô
  rationale: Cụm cuối có thể được hiểu theo nhiều cách; không nên âm thầm gắn nó quá chặt với một thành phần duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” theo quan hệ trực tiếp giữa Phao-lô và Phi-lê-môn; giữ thuật ngữ quen thuộc “đức tin,” “thông công,” và tước hiệu “Đấng Mê-si.”
