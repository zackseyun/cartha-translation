language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: vi
  text: nhưng vì tình yêu thương, tôi thà khẩn cầu[a], vốn là một người như Phao-lô, một người cao tuổi[b], và nay cũng là tù nhân của Đấng Mê-si-a Giê-su[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì cớ tình yêu thương, tôi thà khẩn cầu.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “một sứ giả”, nhưng từ Hy Lạp ở đây tự nhiên hơn có nghĩa là “một người cao tuổi”.
    reason: alternative_reading
  - marker: c
    text: 'Hy Lạp: “Christ Jesus”; ở đây dịch “Đấng Mê-si-a Giê-su” vì Χριστός mang chức năng tước hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: vì tình yêu thương
  rationale: διά với đối cách ở đây diễn tả lý do; cách dịch này tự nhiên trong tiếng Việt và giữ được lực nguyên nhân của cụm từ.
- source_word: μᾶλλον παρακαλῶ
  choice: tôi thà khuyên xin
  rationale: μᾶλλον tạo thế tương phản với việc có thể truyền bảo ở câu 8; “thà” thể hiện sự lựa chọn cách nói mềm hơn, còn “khuyên xin” diễn đạt lời thỉnh cầu tha thiết mang tính quan hệ.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: Tôi là Phao-lô
  rationale: Cụm Hy Lạp có tính tỉnh lược và hơi gượng nếu bám sát từng chữ. Cách diễn đạt này đưa lời tự mô tả của Phao-lô sang tiếng Việt tự nhiên mà không thêm một phẩm chất không có trong nguyên văn.
- source_word: πρεσβύτης
  choice: một người già
  rationale: Nghĩa trực tiếp và tự nhiên nhất là người cao tuổi; từ này không phải danh từ thông thường chỉ sứ giả và trong ngữ cảnh cũng không cần hiểu là chức vụ trưởng lão.
- source_word: νυνὶ δὲ καὶ
  choice: và nay cũng
  rationale: Giữ cả nét thời gian của νυνί lẫn ý bổ sung của καί.
- source_word: δέσμιος
  choice: tù nhân
  rationale: Danh từ chỉ người đang bị giam giữ; “tù nhân” là cách dịch trực tiếp, rõ ràng và giữ nguyên hình thức danh từ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: của Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Χριστός tại đây vẫn có sức nặng của tước hiệu; cấu trúc “Đấng Mê-si-a là Đức Chúa Jêsus” làm rõ tước hiệu trong tiếng Việt và tránh để “Mê-si-a” bị hiểu như một phần tên riêng.
theological_decisions:
- issue: Nghĩa của πρεσβύτης
  choice: Phao-lô tự gọi mình là “một người già”.
  alternative: “một sứ giả” hoặc “một trưởng lão”
  rationale: πρεσβύτης thường chỉ người cao tuổi. Cách hiểu “sứ giả” dựa trên sự liên hệ với một từ Hy Lạp khác, còn “trưởng lão” dễ đưa vào đây ý chức vụ hội thánh mà văn bản không xác định.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong cụm này, Χριστός có thể nghe như một tước hiệu chứ chưa hoàn toàn chỉ là tên gọi; vì vậy bản chính nêu rõ nghĩa “Đấng Mê-si-a”, đồng thời ghi cách gọi quen thuộc “Đấng Christ” ở chú thích.
- issue: Quan hệ trong cụm δέσμιος Χριστοῦ Ἰησοῦ
  choice: “tù nhân của Đấng Mê-si-a là Đức Chúa Jêsus”, giữ nguyên quan hệ sở thuộc rộng của sở hữu cách.
  alternative: “tù nhân vì Đấng Christ Jêsus” hoặc “tù nhân thuộc về Đấng Christ Jêsus”
  rationale: Sở hữu cách có thể gợi cả việc Phao-lô thuộc về Chúa lẫn việc ông bị tù vì phục vụ Ngài. Dịch bằng “của” bảo tồn độ mở ấy thay vì chỉ định một quan hệ nhân quả duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng gần gũi. “Khuyên xin” giữ sắc thái vừa khuyên nhủ vừa thỉnh cầu; dấu gạch ngang cuối câu được giữ vì cú pháp tiếp tục sang câu kế. Các dấu chú thích [a], [b], [c] đều xuất hiện ngay sau phần văn bản liên quan.
