- from: thì vì tình yêu thương, tôi thà khuyên xin[a]. Tôi là Phao-lô, một người già[b], và nay cũng là tù nhân của Đấng Mê-si-a là Đức Chúa Jêsus[c]—
  to: nhưng vì tình yêu thương, tôi thà khẩn cầu[a], vốn là một người như Phao-lô, một người cao tuổi[b], và nay cũng là tù nhân của Đấng Mê-si-a Giê-su[c]—
  rationale: Sửa để giữ sát hơn sắc thái tự mô tả tỉnh lược của τοιοῦτος ὢν ὡς Παῦλος, dùng các cách diễn đạt tiếng Việt hiện đại tự nhiên hơn cho παρακαλῶ và πρεσβύτης, và loại bỏ “Đức Chúa”, là tước hiệu không có trong nguyên văn. “của Đấng Mê-si-a Giê-su” tiếp tục bảo tồn tính mở của sở hữu cách trong δέσμιος Χριστοῦ Ἰησοῦ.
