    rationale: 'Cụm này có thể hàm ý rằng việc nhắc đến là không cần thiết hoặc bị gạt bỏ. Trong ngữ cảnh, Phao-lô dùng lối nói tránh tu từ: ông nói mình không nói đến điều ấy, trong khi thực tế đang nêu nó ra. “chưa nói đến việc” bảo toàn thủ pháp này hơn.'
  - severity: low
