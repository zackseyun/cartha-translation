  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: vi
  text: 'Chính tôi, Phao-lô, tự tay viết: Tôi sẽ hoàn trả[a]—chưa nói đến việc tôi nói với anh rằng ngay cả chính bản thân anh, anh cũng mắc nợ tôi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Chính tôi, Phao-lô, đã tự tay viết: Tôi sẽ hoàn trả; để tôi không nói với anh rằng ngay cả chính bản thân anh, anh cũng mắc nợ tôi.”'
    reason: Nêu cách dịch sát thì aorist của ἔγραψα và cấu trúc lời nói tránh tu từ của ἵνα μὴ λέγω σοι.
lexical_decisions:
- source_word: ἔγραψα
  choice: viết
  rationale: Dù động từ Hy Lạp ở thì aorist, trong lời xác nhận bằng chính nét bút của người gửi, tiếng Việt tự nhiên dùng hiện tại để hướng sự chú ý vào điều đang được viết và được người nhận đọc.
- source_word: τῇ ἐμῇ χειρί
  choice: tự tay
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, diễn tả việc chính Phao-lô viết lời cam kết này.
- source_word: ἀποτίσω
  choice: Tôi sẽ hoàn trả
  rationale: Giữ rõ lời hứa ở tương lai về việc thanh toán khoản nợ hoặc tổn thất được nói đến ở câu trước, nhưng không thêm một tân ngữ không hiện diện trong tiếng Hy Lạp.
- source_word: ἵνα μὴ λέγω σοι
  choice: khỏi cần nhắc rằng
  rationale: Chuyển tải chức năng tu từ và sắc thái tế nhị pha chút mỉa nhẹ của câu, thay vì dịch máy móc như một mệnh đề chỉ mục đích.
- source_word: καὶ σεαυτόν
  choice: chính anh ... cả bản thân mình
  rationale: Hai yếu tố nhấn mạnh giúp thể hiện sức nặng của καί và đại từ phản thân, đồng thời giữ nguyên tính chất cá nhân của món nợ.
- source_word: προσοφείλεις
  choice: mắc nợ tôi
  rationale: Diễn đạt rõ nghĩa mắc nợ; sắc thái nợ thêm hoặc nợ ngoài khoản đang bàn được gợi ra bởi cấu trúc toàn câu, không cần giải thích quá mức.
theological_decisions:
- issue: Bản chất món nợ của Phi-lê-môn đối với Phao-lô
  choice: Giữ cách nói về sự mắc nợ mang tính cá nhân mà không xác định nguyên nhân cụ thể.
  alternative: Nói rõ rằng Phi-lê-môn nợ Phao-lô sự quy đạo, sự cứu rỗi hoặc mạng sống mình.
  rationale: Bản Hy Lạp khẳng định mạnh món nợ nhưng không nói rõ nền tảng của nó; bản dịch vì thế không áp đặt một diễn giải lịch sử hay thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính tôi” cùng “tự tay” giữ sự nhấn mạnh của lời bảo đảm cá nhân; “anh” phù hợp với lời Phao-lô trực tiếp nói với Phi-lê-môn mà không tạo sắc thái quá cổ.
