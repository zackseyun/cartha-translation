    issue: “người cùng chung phần” không tự nhiên và có thể lệch trường nghĩa
    rationale: Trong tiếng Việt, cụm này dễ được hiểu là cùng có một phần tài sản, thừa kế, hoặc quyền lợi. κοινωνός chỉ một người cùng tham dự/chia sẻ, tức một đối tác hay người cùng dự phần trong mối quan hệ giữa Phao-lô và Phi-lê-môn.
