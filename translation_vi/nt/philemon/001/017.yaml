revisions:
- from: Vậy, nếu anh coi tôi là người cùng chung phần, thì hãy đón nhận anh ấy như đón nhận chính tôi.[a]
  to: Vậy, nếu anh coi tôi là người cùng dự phần, thì hãy đón nhận anh ấy như đón nhận tôi.[a]
  rationale: Bản sửa thay cụm từ chưa tự nhiên và có thể gây hiểu lầm về κοινωνός bằng “người cùng dự phần,” vốn giữ được ý cùng chia sẻ/tham gia mà không áp đặt nghĩa chuyên biệt. Phần so sánh được giữ sát nguyên văn hơn; chú thích vẫn nêu các lựa chọn từ vựng chính của προσλαμβάνομαι.
