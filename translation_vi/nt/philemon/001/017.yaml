source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: vi
  text: Vậy, nếu anh coi tôi là người cùng dự phần, thì hãy đón nhận anh ấy như đón nhận tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy tiếp nhận anh ấy” hoặc “hãy chấp nhận anh ấy.” Động từ Hy Lạp có thể chỉ việc tiếp đón một người cách niềm nở hoặc chấp nhận người ấy vào một mối quan hệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Vậy, nếu
  rationale: Giữ quan hệ suy luận của οὖν với lời kêu gọi phía trước, đồng thời diễn đạt điều kiện εἰ một cách tự nhiên trong tiếng Việt.
- source_word: ἔχεις κοινωνόν
  choice: anh coi tôi là người cùng chung phần
  rationale: κοινωνός chỉ người cùng dự phần hay cùng chia sẻ với người khác. Cách dịch này giữ sắc thái quan hệ và sự dự phần chung, đồng thời tránh thu hẹp nghĩa thành quan hệ làm ăn như từ “đối tác” có thể gợi ra trong tiếng Việt hiện đại.
- source_word: προσλαβοῦ
  choice: hãy đón nhận
  rationale: Động từ có thể chỉ việc tiếp nhận, hoan nghênh hoặc chấp nhận một người vào mối tương giao. “Đón nhận” tự nhiên và đủ rộng để bao hàm cả sự tiếp đón lẫn chấp nhận về mặt quan hệ.
- source_word: αὐτὸν
  choice: anh ấy
  rationale: Đại từ đối cách chỉ Ô-nê-sim trong ngữ cảnh; “anh ấy” là cách quy chiếu tự nhiên và tôn trọng trong tiếng Việt hiện đại.
- source_word: ὡς ἐμέ
  choice: như đón nhận chính tôi
  rationale: Bổ sung lại động từ theo lối tỉnh lược của nguyên văn để câu tiếng Việt rõ ràng, đồng thời “chính tôi” nhấn mạnh yêu cầu đối xử với Ô-nê-sim như với Phao-lô.
theological_decisions:
- issue: Sắc thái quan hệ của κοινωνός trong lời kêu gọi của Phao-lô
  choice: người cùng chung phần
  alternative: người bạn đồng hành; người cùng dự phần; đối tác
  rationale: “Người cùng chung phần” diễn đạt sự tham dự và mối liên hệ hỗ tương giữa Phao-lô với Phi-lê-môn mà không biến từ này thành thuật ngữ giáo phái hay giới hạn nó vào quan hệ thương mại.
- issue: Phạm vi nghĩa của προσλαβοῦ
  choice: đón nhận
  alternative: tiếp nhận; chấp nhận; hoan nghênh
  rationale: “Đón nhận” giữ được cả chiều kích tiếp đón cá nhân và chấp nhận vào mối tương giao, không buộc câu chỉ nói về lòng hiếu khách hoặc chỉ về địa vị cộng đồng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh” phù hợp với lời Phao-lô trực tiếp nói với Phi-lê-môn; “anh ấy” tránh sắc thái hạ thấp người được nhắc đến. Cấu trúc lặp “đón nhận” làm rõ phép so sánh vốn được tỉnh lược trong tiếng Hy Lạp.
