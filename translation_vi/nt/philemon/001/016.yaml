id: PHM.1.16
reference: Philemon 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: vi
  text: 'không còn như một nô lệ[a], nhưng hơn cả một nô lệ: một người anh em yêu dấu—đặc biệt đối với tôi, huống chi đối với anh, cả trong xác thịt[b] lẫn trong Chúa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được dịch là “đầy tớ” hoặc “người nô bộc”; trong bối cảnh này, từ ấy có lẽ nói đến địa vị lệ thuộc của Ô-nê-sim trong xã hội.
    reason: alternative_reading
  - marker: b
    text: “Trong xác thịt” ở đây có lẽ nói đến mối quan hệ trong đời sống trần thế, về mặt thân thể hoặc xã hội; cụm từ này không mang nghĩa “bản tính tội lỗi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: không còn
  rationale: Diễn đạt tự nhiên ý phủ định thời gian và sự thay đổi so với tình trạng trước đây.
- source_word: ὡς δοῦλον
  choice: như một nô lệ
  rationale: Trong bối cảnh địa vị xã hội của Ô-nê-sim, “nô lệ” thể hiện rõ tình trạng lệ thuộc hơn “đầy tớ” và giữ được sức nặng của phép đối chiếu.
- source_word: ὑπὲρ δοῦλον
  choice: hơn cả một nô lệ
  rationale: ὑπέρ chỉ địa vị hoặc giá trị vượt quá; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên lực so sánh.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: một người anh em yêu dấu
  rationale: Giữ nguyên hình ảnh gia đình trong cộng đồng đức tin và chuyển tải tự nhiên sắc thái trìu mến của ἀγαπητός.
- source_word: μάλιστα ἐμοί
  choice: đặc biệt đối với tôi
  rationale: Thể hiện mức độ nổi bật do μάλιστα biểu đạt mà không cường điệu thành tuyệt đối.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: huống chi đối với anh
  rationale: Thành ngữ tiếng Việt này giữ được sức nhấn tu từ của phép tăng tiến từ mối quan hệ với Phao-lô sang mối quan hệ với Phi-lê-môn.
- source_word: ἐν σαρκὶ
  choice: trong xác thịt
  rationale: Giữ cách nói đặc trưng của Phao-lô và sự rộng nghĩa của σάρξ; chú thích làm rõ rằng ở đây cụm từ chỉ bình diện đời sống, thân thể hoặc quan hệ xã hội, không nhất thiết là bản tính tội lỗi.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách nói về phạm vi hiệp nhất và tương giao thuộc về Chúa, không diễn giải hẹp hơn văn bản.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh Ô-nê-sim
  choice: nô lệ
  alternative: đầy tớ; tôi tớ; người nô bộc
  rationale: Bức thư liên quan trực tiếp đến địa vị lệ thuộc của Ô-nê-sim. “Nô lệ” bảo toàn thực tại xã hội ấy và sức mạnh của lời khẳng định “hơn cả một nô lệ” mà không tự ý giải quyết các hệ quả thần học hoặc đạo đức.
- issue: Ý nghĩa của ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: cả trong xác thịt lẫn trong Chúa
  alternative: cả trong quan hệ đời này lẫn trong Chúa; cả về mặt đời thường lẫn trong Chúa; cả khi ở bên nhau lẫn trong Chúa
  rationale: Bản dịch chính giữ nguyên hai phạm vi được Phao-lô đặt cạnh nhau và không thu hẹp σάρξ vào một cách giải thích duy nhất; chú thích nêu các khả năng thích hợp với ngữ cảnh.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “anh” cho đại từ số ít σοὶ khi Phao-lô nói trực tiếp với Phi-lê-môn. Giữ các cách nói thần học “người anh em”, “trong xác thịt” và “trong Chúa”, đồng thời dùng chú thích để tránh hiểu sai mà không xóa bỏ độ mở của nguyên văn.
