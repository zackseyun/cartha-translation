id: PHM.1.13
reference: Philemon 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: vi
  text: Tôi đã muốn giữ anh ấy lại bên mình, để anh ấy thay mặt anh mà phục vụ tôi trong xiềng xích của Tin Mừng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “xiềng xích vì Tin Mừng”—tức là xiềng xích phải chịu do rao truyền Tin Mừng.
    reason: Nêu cách hiểu nguyên nhân của sở hữu cách τοῦ εὐαγγελίου mà không loại bỏ độ hàm súc của nguyên văn.
lexical_decisions:
- source_word: ὃν
  choice: anh ấy
  rationale: Đại từ quan hệ đối cách giống đực số ít chỉ Ô-nê-sim. Tiếng Việt tự nhiên nối mạch bằng đại từ “anh ấy” thay vì mô phỏng cấu trúc quan hệ của tiếng Hy Lạp.
- source_word: ἐβουλόμην
  choice: Tôi đã muốn
  rationale: Thì chưa hoàn thành diễn tả ý muốn của Phao-lô trong quá khứ; “đã muốn” truyền đạt rõ ý này mà không nhấn quá mức khía cạnh tiếp diễn.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: giữ anh ấy lại bên mình
  rationale: Cụm từ nói đến việc giữ Ô-nê-sim ở lại cùng Phao-lô. “Giữ… lại bên mình” vừa tự nhiên vừa giữ được sắc thái lưu người ấy lại.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt mục đích của việc Phao-lô muốn giữ Ô-nê-sim bên mình.
- source_word: ὑπὲρ σοῦ
  choice: thay mặt anh
  rationale: Diễn tả việc Ô-nê-sim phục vụ Phao-lô đại diện cho Phi-lê-môn, nhưng không khẳng định một ý niệm thay thế tuyệt đối.
- source_word: μοι διακονῇ
  choice: phục vụ tôi
  rationale: διακονέω ở đây chỉ sự phục vụ hoặc trợ giúp; “phục vụ tôi” đủ rộng và không áp đặt sắc thái chức vụ giáo hội.
- source_word: ἐν τοῖς δεσμοῖς
  choice: trong xiềng xích
  rationale: Giữ hình ảnh cụ thể của δεσμοί, đồng thời trong ngữ cảnh vẫn được hiểu là tình trạng bị giam cầm.
- source_word: τοῦ εὐαγγελίου
  choice: của Tin Mừng
  rationale: Giữ cấu trúc sở hữu cách cô đọng của tiếng Hy Lạp và không âm thầm quyết định rằng quan hệ này chỉ mang nghĩa nguyên nhân.
theological_decisions:
- issue: Ý nghĩa của τοῦ εὐαγγελίου bổ nghĩa cho δεσμοῖς
  choice: xiềng xích của Tin Mừng
  alternative: xiềng xích vì Tin Mừng
  rationale: 'Bản chính giữ cách nói cô đọng và phần nào mơ hồ của sở hữu cách Hy Lạp: cảnh xiềng xích gắn với Tin Mừng. Chú thích nêu cách hiểu rất có khả năng là Phao-lô chịu xiềng xích vì Tin Mừng, nhưng không đưa cách giải nghĩa ấy thẳng vào bản văn.'
translation_notes:
  register: Văn phong thư tín hiện đại, trang trọng nhưng gần gũi. Dùng “tôi—anh” phù hợp lời Phao-lô nói trực tiếp với một người đồng đức tin; “anh ấy” giúp phân biệt Ô-nê-sim với người nhận thư. Viết hoa “Tin Mừng” như tên gọi sứ điệp Cơ Đốc.
