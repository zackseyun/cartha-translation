  text: Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς, οἱ συνεργοί μου.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: vi
  text: Mác, A-ri-tạc, Đê-ma và Lu-ca, những người cùng làm việc với tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: Mác
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng Hy Lạp Μᾶρκος.
- source_word: Ἀρίσταρχος
  choice: A-ri-tạc
  rationale: Phiên âm tên riêng Ἀρίσταρχος theo cách đọc rõ ràng, quen thuộc với độc giả Kinh Thánh tiếng Việt.
- source_word: Δημᾶς
  choice: Đê-ma
  rationale: Phiên âm tên riêng Δημᾶς sang tiếng Việt, không dịch nghĩa tên.
- source_word: Λουκᾶς
  choice: Lu-ca
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt cho Λουκᾶς.
- source_word: οἱ συνεργοί μου
  choice: những người cùng làm việc với tôi
  rationale: συνεργός chỉ người cộng tác, cùng lao động với một người khác. Cách diễn đạt này tự nhiên, dễ hiểu và giữ được ý cộng tác; μου được thể hiện bằng “với tôi”.
theological_decisions: []
translation_notes:
  register: Bản dịch giữ cấu trúc liệt kê kèm cụm đồng vị của nguyên văn, không bổ sung động từ “gửi lời chào” vốn được hiểu từ văn cảnh câu trước. Văn phong hiện đại, trang trọng và dễ hiểu.
