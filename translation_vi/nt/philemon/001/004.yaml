  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: vi
  text: Tôi luôn cảm tạ Đức Chúa Trời của tôi, nhắc đến anh trong những lời cầu nguyện của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhớ đến anh trong những lời cầu nguyện của tôi.” Tiếng Hy Lạp sát nghĩa hơn là “nhắc đến anh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Tôi cảm tạ
  rationale: Động từ hiện tại, chủ động, ngôi thứ nhất số ít. “Cảm tạ” tự nhiên trong văn cảnh cầu nguyện, trang trọng vừa phải và giữ rõ ý trực tiếp tạ ơn.
- source_word: τῷ θεῷ μου
  choice: Đức Chúa Trời của tôi
  rationale: Cách tặng cách đánh dấu đối tượng được cảm tạ. Cụm sở hữu “của tôi” được giữ lại như một cách diễn đạt lòng tin kính mang tính cá nhân.
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt sự thường xuyên, bền bỉ trong công thức tạ ơn; “luôn” ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: μνείαν σου ποιούμενος
  choice: nhắc đến anh
  rationale: Thành ngữ phân từ có nghĩa sát là “làm sự nhắc đến anh.” “Nhắc đến anh” giữ được sắc thái nói đến người ấy trước mặt Đức Chúa Trời, thay vì chỉ diễn đạt sự nhớ lại trong tâm trí.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: trong những lời cầu nguyện của tôi
  rationale: ἐπί với sở hữu cách trong thành ngữ này chỉ hoàn cảnh hoặc thời điểm cầu nguyện. Cách dịch này tự nhiên, rõ nghĩa và giữ số nhiều của προσευχῶν.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh” cho đại từ số ít σου khi Phao-lô nói với Phi-lê-môn; cách gọi này phù hợp quan hệ thân tình giữa các tín hữu mà không thêm tước vị không có trong câu Hy Lạp. Dấu chú thích [a] được đặt sau toàn cụm liên quan để nêu cách hiểu thay thế.
