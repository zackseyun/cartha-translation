  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: vi
  text: Vì có lẽ vì lý do này mà anh ấy đã bị tách khỏi anh một thời gian, để anh có lại anh ấy mãi mãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh ấy đã rời xa anh một thời gian.” Thể bị động trong tiếng Hy Lạp có thể là cách tế nhị để tránh quy trách nhiệm trực tiếp, đồng thời để ngỏ khả năng về một mục đích của Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: có lẽ
  rationale: Giữ sắc thái suy đoán dè dặt của Phao-lô, không biến nhận định thành điều chắc chắn.
- source_word: γὰρ
  choice: vì
  rationale: Nối câu này với lời giải thích ở câu trước một cách tự nhiên trong tiếng Việt.
- source_word: διὰ τοῦτο
  choice: chính vì lý do này
  rationale: Diễn đạt rõ quan hệ lý do hoặc mục đích, đồng thời giữ sức nhấn của τοῦτο.
- source_word: ἐχωρίσθη
  choice: đã phải xa
  rationale: Diễn đạt trạng thái bị phân cách mà không xác định trực tiếp Ô-nê-sim tự bỏ đi hay Đức Chúa Trời khiến việc ấy xảy ra; cấu trúc tiếng Việt cũng tránh sắc thái máy móc của lối dịch sát 'đã bị phân cách'.
- source_word: πρὸς ὥραν
  choice: một thời gian
  rationale: Đây là thành ngữ chỉ một khoảng thời gian hữu hạn, không nhất thiết là đúng một giờ, và tương phản với 'mãi mãi'.
- source_word: ἵνα
  choice: để
  rationale: Giữ ý nghĩa mục đích hoặc kết quả dự kiến mà không phân định quá mức giữa hai sắc thái.
- source_word: αἰώνιον
  choice: mãi mãi
  rationale: Tính từ được dùng theo chức năng trạng từ, đối lập sự xa cách tạm thời với việc có lại lâu dài; cách dịch vẫn để ngỏ chiều kích bền vững về quan hệ và thuộc linh.
- source_word: αὐτὸν
  choice: anh ấy
  rationale: Chỉ Ô-nê-sim; đại từ này phù hợp với cách xưng hô hiện đại và tránh thêm địa vị không có trong nguyên văn.
- source_word: ἀπέχῃς
  choice: anh có lại anh ấy
  rationale: Thể hiện ý có hoặc nhận lại Ô-nê-sim trong bối cảnh quan hệ, đồng thời giữ lối diễn đạt tự nhiên.
theological_decisions:
- issue: Tác nhân hàm ẩn trong thể bị động ἐχωρίσθη
  choice: Dùng 'đã phải xa' mà không nêu Đức Chúa Trời hay Ô-nê-sim là tác nhân trực tiếp.
  alternative: Dịch 'anh ấy đã rời xa anh' hoặc 'Đức Chúa Trời đã khiến anh ấy xa anh'.
  rationale: Nguyên văn diễn đạt kín đáo, có thể giảm việc quy trách nhiệm trực tiếp và cũng có thể gợi ý sự tể trị của Đức Chúa Trời. Bản dịch giữ nguyên độ mở thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cặp 'một thời gian—mãi mãi' giữ thế tương phản của nguyên văn. Cách xưng hô 'anh—anh ấy' phù hợp với quan hệ giữa Phi-lê-môn và Ô-nê-sim mà không bổ sung tước vị.
