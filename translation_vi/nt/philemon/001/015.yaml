revisions:
- from: Vì có lẽ chính vì lý do này mà anh ấy đã phải xa anh một thời gian, để anh có lại anh ấy mãi mãi.[a]
  to: Vì có lẽ vì lý do này mà anh ấy đã bị tách khỏi anh một thời gian, để anh có lại anh ấy mãi mãi.[a]
  rationale: Đổi “đã phải xa” thành “đã bị tách khỏi” để biểu đạt thể bị động của ἐχωρίσθη mà không thêm ý bắt buộc. Bỏ “chính” để câu bớt nặng, nhưng vẫn giữ quan hệ giải thích của γάρ, tính dè dặt của τάχα, lý do nêu bởi διὰ τοῦτο, và độ mở về tác nhân của nguyên văn. Chú thích được điều chỉnh nhẹ cho khớp với bản văn và vẫn bảo toàn sự dè dặt thần học.
