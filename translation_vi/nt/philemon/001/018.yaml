revisions:
- from: Nhưng nếu người ấy đã làm điều gì sai với anh hoặc còn nợ anh điều gì, xin ghi khoản đó vào phần tôi.[a]
  to: Nhưng nếu người ấy đã đối xử bất công với anh hoặc còn nợ anh điều gì, hãy tính khoản đó vào tài khoản của tôi.[a]
  rationale: Sửa cách diễn đạt lời mệnh lệnh để thể hiện minh bạch nghĩa “quy vào tài khoản của tôi” của ἐλλογέω. Điều chỉnh nhẹ vế nói về ἀδικέω cho tự nhiên hơn trong tiếng Việt, nhưng vẫn giữ tính khái quát của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
