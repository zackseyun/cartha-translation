  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: vi
  text: Nhưng nếu người ấy đã đối xử bất công với anh hoặc còn nợ anh điều gì, hãy tính khoản đó vào tài khoản của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy ghi khoản đó vào sổ nợ của tôi.” Động từ Hy Lạp mang nghĩa kế toán: ghi hoặc tính một khoản vào tài khoản của ai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện do εἰ nêu ra và sắc thái chuyển ý, đối chiếu nhẹ của δέ với câu trước.
- source_word: τι ἠδίκησέν σε
  choice: đã làm điều gì sai với anh
  rationale: Giữ phạm vi rộng của ἀδικέω, có thể chỉ sự xúc phạm, bất công hoặc thiệt hại, mà không thu hẹp thành một hành vi cụ thể.
- source_word: ἢ ὀφείλει
  choice: hoặc còn nợ anh điều gì
  rationale: Thể hiện nghĩa nợ hay nghĩa vụ của ὀφείλω; từ “còn” tự nhiên trong tiếng Việt và phù hợp với một khoản chưa thanh toán.
- source_word: τοῦτο ἐμοὶ ἐλλόγα
  choice: xin ghi khoản đó vào phần tôi
  rationale: Bảo toàn hình ảnh sổ sách của ἐλλογέω và cho thấy Phao-lô nhận khoản phải trả về mình; “xin” chuyển mệnh lệnh thành lời đề nghị lịch thiệp phù hợp văn cảnh thư tín.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh” phù hợp lời Phao-lô nói trực tiếp với Phi-lê-môn; “người ấy” quy chiếu Ô-nê-sim mà không thêm tên vốn không có trong câu Hy Lạp.
