revisions:
- from: Phao-lô, người bị cầm tù vì Đấng Mê-si-a là Đức Chúa Jêsus[a], cùng Ti-mô-thê, người anh em của chúng tôi, kính gửi Phi-lê-môn, người yêu dấu và người cùng làm việc với chúng tôi,
  to: Phao-lô, một tù nhân của Đấng Mê-si-a Giê-su[a], và Ti-mô-thê, người anh em, gửi đến Phi-lê-môn, người yêu dấu và người cùng làm việc với chúng tôi,
