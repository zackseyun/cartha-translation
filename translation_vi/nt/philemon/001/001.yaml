  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: vi
  text: Phao-lô, một tù nhân của Đấng Mê-si-a Giê-su[a], và Ti-mô-thê, người anh em, gửi đến Phi-lê-môn, người yêu dấu và người cùng làm việc với chúng tôi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “một tù nhân vì Đấng Mê-si-a Giê-su.” Sở hữu cách trong tiếng Hy Lạp có thể diễn tả mối quan hệ/liên thuộc với Đấng Mê-si-a Giê-su hoặc nguyên nhân của việc bị cầm tù.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: δέσμιος
  choice: người bị cầm tù
  rationale: Diễn đạt tự nhiên tình trạng bị giam giữ hay xiềng xích; trong tiếng Việt hiện đại, cách này rõ hơn danh từ 'tù nhân' trong lời tự giới thiệu.
- source_word: Χριστοῦ Ἰησοῦ
  choice: vì Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Giữ Χριστός như tước hiệu 'Đấng Mê-si-a' và dùng 'là' để câu tiếng Việt tự nhiên; giới từ 'vì' thể hiện cách hiểu nguyên nhân, đồng thời chú thích bảo lưu khả năng quan hệ hay sở thuộc của sở hữu cách Hy Lạp.
- source_word: Τιμόθεος ὁ ἀδελφὸς
  choice: Ti-mô-thê, người anh em của chúng tôi
  rationale: Mạo từ Hy Lạp được diễn đạt tự nhiên bằng quan hệ cộng đồng; 'của chúng tôi' làm rõ sắc thái thân thuộc được hàm ý.
- source_word: Φιλήμονι
  choice: kính gửi Phi-lê-môn
  rationale: Dative trong lời chào thư tín được chuyển thành công thức tiếng Việt trang trọng, tự nhiên.
- source_word: τῷ ἀγαπητῷ
  choice: người yêu dấu
  rationale: Giữ sắc thái trìu mến mạnh của tính từ mà vẫn phù hợp văn phong trang trọng.
- source_word: συνεργῷ ἡμῶν
  choice: người cùng làm việc với chúng tôi
  rationale: Phản ánh nghĩa người cộng tác lao động và giữ đại từ số nhiều ἡμῶν, tránh thu hẹp thành 'với tôi'.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách Χριστοῦ Ἰησοῦ sau δέσμιος
  choice: vì Đấng Mê-si-a là Đức Chúa Jêsus
  alternative: người bị cầm tù thuộc về Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Sở hữu cách có thể chỉ nguyên nhân ('vì') hoặc mối quan hệ/sự thuộc về. Bản chính chọn cách hiểu nguyên nhân tự nhiên hơn trong tiếng Việt, nhưng chú thích bảo lưu độ mở của nguyên văn.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong lời mở đầu này, Χριστός vẫn có lực của một tước hiệu; dịch nghĩa là 'Đấng Mê-si-a' thay vì xử lý như một phần tên riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng công thức thư tín 'kính gửi'; giữ các tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt. Cấu trúc câu bảo toàn việc Phao-lô và Ti-mô-thê là hai người gửi, cùng sắc thái cộng tác và yêu mến dành cho Phi-lê-môn.
