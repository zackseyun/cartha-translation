  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: vi
  text: Đồng thời, cũng hãy chuẩn bị cho tôi một chỗ trọ[a], vì tôi hy vọng rằng nhờ lời cầu nguyện của anh em, tôi sẽ được ban cho anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một nơi lưu trú” hoặc “sự tiếp đãi”; từ Hy Lạp có thể chỉ cả việc tiếp đãi lẫn nơi được chuẩn bị cho khách.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “tôi sẽ được trao cho anh em” hoặc “tôi sẽ được ban tặng cho anh em”; động từ Hy Lạp mang sắc thái được ban cách ưu ái và có lẽ ngầm chỉ Đức Chúa Trời là Đấng hành động.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Đồng thời, cũng
  rationale: Diễn tả một lời yêu cầu bổ sung đi kèm với điều vừa nói; “đồng thời” thể hiện ἅμα, còn “cũng” giữ sắc thái của καί.
- source_word: ἑτοίμαζέ μοι
  choice: hãy chuẩn bị cho tôi
  rationale: Mệnh lệnh hiện tại được diễn đạt tự nhiên bằng lời yêu cầu trực tiếp; μοι chỉ người được hưởng việc chuẩn bị.
- source_word: ξενίαν
  choice: một chỗ trọ
  rationale: Trong kết hợp với “chuẩn bị cho tôi”, nghĩa cụ thể là nơi lưu trú phù hợp nhất, nhưng từ Hy Lạp cũng có thể chỉ sự tiếp đãi.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: vì tôi hy vọng rằng
  rationale: γάρ nêu lý do cho lời yêu cầu, còn ὅτι dẫn vào nội dung của niềm hy vọng.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: nhờ lời cầu nguyện của anh em
  rationale: διά với sở hữu cách chỉ phương tiện; “nhờ” là cách diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ vai trò của lời cầu nguyện.
- source_word: χαρισθήσομαι ὑμῖν
  choice: tôi sẽ được ban lại cho anh em
  rationale: Giữ thể bị động và sắc thái được ban cho cách ưu ái của χαρίζομαι; “lại” làm rõ ý Phao-lô mong được trở về với họ mà không chuyển thành nghĩa cụ thể hơn là “được thả”.
theological_decisions:
- issue: Tác nhân và ý nghĩa của χαρισθήσομαι trong niềm hy vọng Phao-lô trở về
  choice: Giữ thể bị động “được ban lại cho anh em”, hàm ý nhưng không nói rõ Đức Chúa Trời là Đấng ban.
  alternative: “tôi sẽ được trả tự do để về với anh em” hoặc “tôi sẽ được trao cho anh em”
  rationale: Bản Hy Lạp không nêu tác nhân và không trực tiếp nói đến việc được phóng thích. Cách dịch đã chọn giữ sắc thái ân ban, thể bị động và sự căng thẳng thần học của nguyên văn, đồng thời phù hợp với bối cảnh mong được trở lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῶν/ὑμῖν, phù hợp với nhóm người nhận được nhắc đến trong thư; tránh nói rõ tác nhân của thể bị động khi nguyên văn chỉ hàm ý.
