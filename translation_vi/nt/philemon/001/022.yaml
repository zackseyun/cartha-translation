  to: Đồng thời, cũng hãy chuẩn bị cho tôi một chỗ trọ[a], vì tôi hy vọng rằng nhờ lời cầu nguyện của anh em, tôi sẽ được ban cho anh em[b].
  rationale: Chỉ bỏ “lại” để không thêm ý ‘trở lại/lần nữa’ vốn không hiện diện trong câu Hy Lạp. Những phần còn lại, gồm sự mơ hồ về tác nhân của thể bị động, ý nghĩa phương tiện của lời cầu nguyện, và lựa chọn cụ thể ‘chỗ trọ’ kèm chú thích, đều được giữ nguyên. Chú thích b được điều chỉnh tương ứng.
