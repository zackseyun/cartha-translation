revisions:
- from: Vâng, thưa anh em, xin cho tôi được nhờ anh trong Chúa[a]; hãy làm lòng tôi[b] được tươi mới trong Đấng Mê-si[c].
  to: Vâng, anh ơi, xin cho tôi được ích lợi nhờ anh trong Chúa[a]; xin hãy làm lòng tôi[b] được khuây khỏa trong Đấng Mê-si-a[c].
  rationale: Sửa lời gọi hô số nhiều thành lời gọi hô số ít, thay cụm từ gượng về việc «làm ... tươi mới» bằng cách diễn đạt tự nhiên hơn cho ý làm khuây khỏa/nghỉ ngơi, và chuẩn hóa «Mê-si-a». Các neo chú thích được giữ đúng tại những cụm từ liên quan; không thêm diễn giải giáo phái hay giải quyết quá mức lối chơi chữ khả dĩ.
