source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: vi
  text: Vâng, anh ơi, xin cho tôi được ích lợi nhờ anh trong Chúa[a]; xin hãy làm lòng tôi[b] được khuây khỏa trong Đấng Mê-si-a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin cho tôi nhận được ích lợi từ anh” hoặc “xin cho tôi có niềm vui nhờ anh.” Phao-lô có thể đang chơi chữ giữa động từ này với tên Ô-nê-sim và ý niệm về sự hữu ích.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “nội tạng của tôi,” một thành ngữ chỉ tình cảm sâu xa hoặc con người bên trong.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trong Đấng Christ.” Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng được xức dầu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Vâng
  rationale: Diễn đạt lời xác nhận tha thiết mở đầu lời thỉnh cầu một cách tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀδελφέ
  choice: thưa anh em
  rationale: Lối xưng hô trực tiếp với Phi-lê-môn, một người nam cùng đức tin; “thưa” thể hiện sắc thái thân tình mà kính trọng, còn “anh em” là cách gọi quen thuộc trong cộng đồng tín hữu.
- source_word: ἐγώ σου ὀναίμην
  choice: xin cho tôi được nhờ anh
  rationale: Động từ ὀνίνημι nói đến việc nhận được lợi ích hay sự giúp đỡ. Cách dịch này giữ sắc thái thỉnh cầu và tương đối tự nhiên, đồng thời không giải quyết dứt khoát khả năng chơi chữ với tên Ô-nê-sim.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên ý về phạm vi và mối liên hệ với Chúa trong lời thỉnh cầu của Phao-lô.
- source_word: ἀνάπαυσόν
  choice: hãy làm ... được tươi mới
  rationale: Diễn đạt lời yêu cầu đem lại sự nâng đỡ, khuây khỏa và hồi phục; đồng thời gợi lại cách dùng cùng động từ ở câu 7.
- source_word: μου τὰ σπλάγχνα
  choice: lòng tôi
  rationale: σπλάγχνα theo nghĩa đen là nội tạng nhưng ở đây là thành ngữ chỉ tình cảm sâu xa hay con người bên trong; “lòng tôi” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Χριστός mang nghĩa tước hiệu “Đấng được xức dầu”; “Đấng Mê-si” bảo tồn rõ sắc thái tước hiệu trong ngữ cảnh này.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Bản dịch chính làm rõ nghĩa tước hiệu của Χριστός mà không biến thuật ngữ thành một tên riêng đơn thuần; cách gọi truyền thống “Đấng Christ” được ghi nhận trong chú thích.
- issue: Cách dịch κυρίῳ
  choice: Chúa
  alternative: Chủ
  rationale: Trong cách dùng của Phao-lô ở đây, “Chúa” bảo tồn tước hiệu tôn kính và tránh áp đặt sắc thái chủ–nô hẹp hơn vào cụm từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu văn giữ giọng khẩn khoản, thân tình của Phao-lô; dấu chấm phẩy bảo tồn mối liên hệ chặt chẽ giữa lời xin được ích lợi và mệnh lệnh làm tươi mới lòng ông.
