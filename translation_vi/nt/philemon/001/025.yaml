  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: vi
  text: Nguyện ân điển của Chúa Giê-su Cơ Đốc ở cùng tâm linh của anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh chị em” dịch một đại từ số nhiều trong nguyên văn; lời chúc này dành cho toàn thể những người nhận thư, không chỉ riêng Phi-lê-môn.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Cách dịch quen thuộc, trang trọng của thuật ngữ Phao-lô dùng về ân huệ nhưng không của Đức Chúa Trời; phù hợp với công thức chúc phước.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ đúng tước hiệu và sức nặng Cơ Đốc luận của κύριος trong lời chúc phước.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su Cơ Đốc
  rationale: Trong tiếng Việt hiện đại, “Cơ Đốc” là cách gọi tước hiệu Χριστός đã được xác lập và tránh khiến cụm từ bị hiểu đơn thuần như một họ riêng.
- source_word: μετὰ
  choice: ở cùng
  rationale: Hy Lạp dùng giới từ “với/cùng” trong một mệnh đề không có động từ; thêm “Nguyện” và dùng “ở cùng” tạo thành lời chúc tự nhiên trong tiếng Việt.
- source_word: πνεύματος
  choice: tâm linh
  rationale: Chỉ phương diện tinh thần hay con người bên trong của những người nhận thư; viết thường để không mặc nhiên đồng nhất với Đức Thánh Linh.
- source_word: ὑμῶν
  choice: anh chị em
  rationale: Đại từ Hy Lạp ở số nhiều. “Anh chị em” biểu đạt rõ cộng đồng người nhận thư, thay vì dùng “anh” dễ bị hiểu là chỉ riêng Phi-lê-môn.
theological_decisions:
- issue: Cách thể hiện Χριστοῦ trong lời chúc kết
  choice: Cơ Đốc
  alternative: Đấng Mê-si
  rationale: “Cơ Đốc” là tước hiệu quen thuộc và trang trọng trong tiếng Việt, vẫn giữ liên hệ với danh xưng truyền thống; “Đấng Mê-si” diễn đạt rõ nghĩa hơn nhưng kém tự nhiên trong công thức này.
- issue: Đối tượng được chỉ bởi πνεύματος trong cụm “tâm linh anh chị em”
  choice: tâm linh/con người bên trong của những người nhận thư
  alternative: Đức Thánh Linh
  rationale: Đại từ sở hữu số nhiều “của anh chị em” nghiêng rõ về tâm linh của người nhận; bản dịch không viết hoa để tránh áp đặt cách hiểu là Đức Thánh Linh.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. Dùng cấu trúc chúc nguyện “Nguyện… ở cùng…” để diễn đạt tự nhiên mệnh đề Hy Lạp không có động từ. “Anh chị em” làm rõ số nhiều của ὑμῶν.
