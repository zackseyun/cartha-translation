  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của câu: ân điển, bình an, người nhận số nhiều, và nguồn ban là Đức Chúa Trời là Cha chúng ta cùng Chúa Giê-su, Đấng Mê-si. Tuy nhiên, nguyên văn chỉ dùng một giới từ ἀπό (“từ”) chi phối cả hai danh ngữ nguồn. Việc lặp “từ” trước danh ngữ thứ hai không cần thiết và làm cấu trúc nguồn kép của nguyên văn kém sát hơn.'
