  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: vi
  text: Cầu xin ân điển và bình an từ Đức Chúa Trời, Cha chúng ta, và Chúa Giê-su, Đấng Mê-si, đến với anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Giữ được cả sắc thái lời chào trong thư tín Phao-lô lẫn nội hàm thần học về ân huệ nhưng không của Đức Chúa Trời.
- source_word: ὑμῖν
  choice: đến với anh chị em
  rationale: Đại từ số nhiều được diễn đạt tự nhiên và bao quát trong tiếng Việt; cấu trúc lời cầu chúc làm rõ ý nghĩa hàm ẩn của câu danh từ tiếng Hy Lạp.
- source_word: εἰρήνη
  choice: bình an
  rationale: Cách dịch quen thuộc, tự nhiên, đồng thời giữ được âm hưởng rộng của shalom.
- source_word: ἀπὸ
  choice: từ
  rationale: Biểu thị nguồn gốc của ân điển và bình an.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: Hiểu πατρὸς ἡμῶν là thành phần đồng vị với θεοῦ; dấu phẩy giúp thể hiện quan hệ ấy rõ ràng trong tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ sắc thái tôn xưng và sức nặng Cơ Đốc học của κύριος trong văn cảnh Phao-lô.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si
  rationale: Phiên âm tên riêng và dịch Χριστός theo nghĩa tước hiệu; dấu phẩy làm cho quan hệ đồng vị tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός bắt nguồn là một tước hiệu, nghĩa là Đấng được xức dầu. Bản chính dùng cụm công thức có thể được cảm nhận vừa như tước hiệu vừa gần với tên gọi; bản dịch chính nêu rõ nghĩa tước hiệu, còn chú thích bảo lưu cách gọi truyền thống.
- issue: Nguồn của ân điển và bình an
  choice: lặp lại “từ” trước “Chúa Giê-su”
  alternative: chỉ dùng một “từ” chung cho cả hai danh ngữ
  rationale: Tiếng Hy Lạp chỉ có một ἀπὸ chi phối hai danh ngữ nối bằng καί. Việc lặp lại “từ” là điều chỉnh cú pháp tiếng Việt để làm rõ rằng cả Đức Chúa Trời là Cha và Chúa Giê-su đều được nêu trong cấu trúc nguồn, không nhằm phân tách hai nguồn độc lập.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν nhằm bao quát cộng đồng người nhận; thêm “Cầu xin … đến với” để chuyển lời chào không có động từ trong tiếng Hy Lạp thành một lời chúc tự nhiên trong tiếng Việt.
