  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: vi
  text: Tin chắc vào sự vâng lời của anh, tôi viết cho anh, vì biết rằng anh sẽ còn làm hơn cả những điều tôi nói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vượt quá những điều tôi đang nói.” Có thể Phao-lô ngụ ý rằng Philêmôn sẽ làm nhiều hơn lời yêu cầu cụ thể của ông, nhưng câu này không nói rõ là làm thêm điều gì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Tin chắc
  rationale: Phân từ hoàn thành chủ động diễn tả một trạng thái tin tưởng vững vàng đã được xác lập; “tin chắc” tự nhiên trong tiếng Việt và giữ được sắc thái quả quyết.
- source_word: τῇ ὑπακοῇ σου
  choice: vào sự vâng lời của anh
  rationale: ὑπακοή mang nghĩa vâng lời hoặc đáp ứng lời chỉ dẫn. “Sự vâng lời” giữ nguyên sức nặng quan hệ và đạo đức của lời kêu gọi, không làm nhẹ thành sự thuận theo đơn thuần.
- source_word: ἔγραψά σοι
  choice: tôi viết cho anh
  rationale: Động từ aorist có thể là lối aorist thư tín; trong tiếng Việt, “tôi viết cho anh” tự nhiên trong chính bức thư và không buộc phải phân biệt hình thái thời như tiếng Anh.
- source_word: εἰδὼς
  choice: vì biết rằng
  rationale: Phân từ hoàn thành dùng theo chức năng trạng ngữ, nêu sự hiểu biết chắc chắn đi kèm hành động viết. “Vì biết rằng” làm rõ quan hệ cú pháp một cách tự nhiên.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: sẽ còn làm hơn cả điều tôi nói
  rationale: ὑπέρ với đối cách mang nghĩa vượt quá hoặc hơn điều được nói; “còn… hơn cả” giữ sắc thái nhấn mạnh của καί và sự cố ý không nói rõ hành động bổ sung.
- source_word: ποιήσεις
  choice: anh sẽ… làm
  rationale: Thì tương lai của ποιέω có nghĩa rộng. “Sẽ làm” giữ nguyên tính mở, không xác định cụ thể Philêmôn sẽ thực hiện thêm điều gì.
theological_decisions:
- issue: Sức nặng của ὑπακοή trong lời kêu gọi của Phao-lô
  choice: Dịch là “sự vâng lời”.
  alternative: “sự thuận theo” hoặc “sự sẵn lòng đáp ứng”
  rationale: Từ Hy Lạp trực tiếp mang nghĩa vâng lời. Cách dịch này bảo toàn chiều kích thẩm quyền trong mối quan hệ mà không thêm sắc thái cưỡng ép ngoài văn bản.
- issue: Hàm ý của cụm “hơn cả điều tôi nói”
  choice: Giữ cách diễn đạt mở, không xác định hành động Phao-lô mong đợi.
  alternative: Hiểu cụ thể là Pha-lê-môn sẽ trả tự do cho Ô-nê-sim, hoặc chỉ tiếp đón ông cách rộng lượng.
  rationale: Lời văn có tính gợi ý nhưng không nói rõ. Bản dịch giữ nguyên sự mơ hồ và sức căng thần học thay vì giải quyết một vấn đề còn được tranh luận.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Đại từ “tôi/anh” phù hợp với lời thư cá nhân giữa Phao-lô và Philêmôn; câu văn giữ giọng tin cậy, tha thiết mà không cường điệu quyền lực.
