base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: vi
  text: Tôi gửi[a] anh ấy trở về với anh—chính anh ấy, tức là tấm lòng tôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “Tôi đã gửi anh ấy trở lại với anh.” Thì aorist trong tiếng Hy Lạp có thể được diễn đạt bằng quá khứ; cách dịch ở đây nhìn hành động từ tình huống bức thư đang được chuyển đến Phi-lê-môn.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “nội tạng của tôi”; đây là thành ngữ chỉ tình cảm sâu đậm hoặc lòng trìu mến thiết tha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: anh ấy
  rationale: Đại từ quan hệ đối cách giống đực số ít, chỉ Ô-nê-sim; tiếng Việt tự nhiên dùng đại từ theo ngữ cảnh thay vì mô phỏng cấu trúc quan hệ của tiếng Hy Lạp.
- source_word: ἀνέπεμψά
  choice: Tôi gửi ... trở lại
  rationale: Động từ ἀναπέμπω có nghĩa là gửi trả hoặc gửi trở lại. Thì aorist trong bối cảnh thư tín có thể được diễn đạt tự nhiên từ góc nhìn bức thư đang được chuyển đến người nhận.
- source_word: σοι
  choice: với anh
  rationale: Đại từ ngôi hai số ít chỉ người nhận là Phi-lê-môn; “với anh” đi tự nhiên với cụm “gửi ... trở lại” trong tiếng Việt.
- source_word: αὐτόν
  choice: chính anh ấy
  rationale: Đại từ được lặp lại để nhấn mạnh Ô-nê-sim; “chính anh ấy” bảo tồn lực nhấn mạnh mà không gây tối nghĩa.
- source_word: τοῦτ’ ἔστιν
  choice: nghĩa là
  rationale: Công thức giải thích, dẫn vào cách Phao-lô đồng nhất Ô-nê-sim với điều rất quý đối với mình.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: tấm lòng của tôi
  rationale: σπλάγχνα theo nghĩa đen là nội tạng, nhưng trong văn cảnh chỉ nơi phát sinh tình cảm sâu đậm và lòng trìu mến. “Tấm lòng của tôi” là thành ngữ hiện đại, trang trọng và giữ được sức nặng tình cảm.
theological_decisions:
- issue: Ẩn dụ nhân học trong σπλάγχνα
  choice: Dịch theo thành ngữ là “tấm lòng của tôi”.
  alternative: “nội tạng của tôi”; “tình cảm sâu xa nhất của tôi”
  rationale: Đây là lựa chọn từ vựng và thành ngữ, không phải sự giải quyết một lập trường giáo lý. Cách dịch giữ sự gắn bó sâu sắc của Phao-lô với Ô-nê-sim mà không áp đặt một quan niệm nhân học riêng.
- issue: Giá trị thời của ἀνέπεμψά trong văn cảnh thư tín
  choice: “Tôi gửi ... trở lại”
  alternative: “Tôi đã gửi ... trở lại”
  rationale: Aorist Hy Lạp có thể được thể hiện bằng quá khứ, nhưng hiện tại tiếng Việt diễn đạt tự nhiên hành động đang được thực hiện qua chính bức thư và người mang thư; chú thích bảo tồn phương án quá khứ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, tự nhiên và trang trọng vừa phải. Dùng “tôi/anh” phù hợp lời Phao-lô nói trực tiếp với Phi-lê-môn; giữ sự lặp lại có tính nhấn mạnh của αὐτόν bằng “chính anh ấy”. Mọi dấu chú thích đều xuất hiện trong câu chính.
