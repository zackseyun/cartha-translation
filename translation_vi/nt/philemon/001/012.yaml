  to: Tôi gửi[a] anh ấy trở về với anh—chính anh ấy, tức là tấm lòng tôi[b].
  rationale: Chỉ sửa cách diễn đạt ‘trở về với anh’ cho tự nhiên hơn và chuyển ký hiệu chú thích a đến đúng từ mà chú thích giải thích. Cấu trúc nhấn mạnh ‘chính anh ấy’ và phép giải thích ‘tức là tấm lòng tôi’ vẫn phản ánh sát câu Hy Lạp.
