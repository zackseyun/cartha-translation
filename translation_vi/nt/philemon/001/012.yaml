  source_fidelity: 'Bản dịch giữ đúng các yếu tố cốt yếu: động từ ἀναπέμπω mang nghĩa gửi trở lại, người nhận số ít, sự lặp lại nhấn mạnh của αὐτόν, và phép đồng nhất giàu tình cảm trong τὰ ἐμὰ σπλάγχνα. Tuy nhiên, chú thích a về giá trị thời của ἀνέπεμψά hiện được neo vào “chính anh ấy”, vốn tương ứng với αὐτόν, nên cần chuyển neo về động từ “gửi”.'
