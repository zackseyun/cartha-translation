id: 2PE.3.5
reference: 2 Peter 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: vi
  text: Vì họ cố tình làm ngơ điều này:[a] các tầng trời đã có từ xa xưa, còn đất được hình thành từ nước và nhờ nước bởi lời Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì theo ý họ, điều này bị che khuất khỏi họ” hoặc “Vì họ cố tình không biết điều này.” Cách diễn đạt Hy Lạp kết hợp ý không nhận biết với một thái độ có chủ ý. “Nhờ nước” cũng có thể dịch là “qua nước”; còn “lời Đức Chúa Trời” cũng có thể dịch là “mệnh lệnh của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Vì họ cố ý làm ngơ điều này
  rationale: 'Cách diễn đạt này giữ cả hai sắc thái của thành ngữ Hy Lạp: không nhận biết hoặc không thừa nhận, đồng thời có chủ ý. “Cố ý làm ngơ” tự nhiên trong tiếng Việt và không biến sự việc thành vô tình.'
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: từ xa xưa, các tầng trời đã hiện hữu
  rationale: “Các tầng trời” giữ số nhiều của οὐρανοί; “từ xa xưa” diễn đạt ἔκπαλαι bằng văn phong hiện đại, trang trọng.
- source_word: γῆ ... συνεστῶσα
  choice: đất được hình thành
  rationale: Trong tiếng Việt, “đất” có thể chỉ cõi đất trong trật tự sáng tạo mà không cần mạo từ; “được hình thành” truyền đạt ý cấu thành/được thiết lập của phân từ συνεστῶσα trong ngữ cảnh.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: từ nước và qua nước
  rationale: Giữ sự phân biệt giữa ἐκ (“từ, ra từ”) và διά (“qua, bởi phương tiện”), đồng thời bảo toàn tính song hành của nguyên văn.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: bởi lời Đức Chúa Trời
  rationale: “Bởi” thể hiện cách công cụ của tặng cách; “lời Đức Chúa Trời” bám sát λόγος và không thu hẹp nghĩa thành một mệnh lệnh thuần túy.
theological_decisions:
- issue: Có nên dịch λόγῳ theo hướng xác định đây là Ngôi Lời mang tính ngôi vị hay không
  choice: bởi lời Đức Chúa Trời
  alternative: bởi mệnh lệnh của Đức Chúa Trời
  rationale: Trong ngữ cảnh này, λόγος nói đến lời hữu hiệu của Đức Chúa Trời trong công cuộc sáng tạo, nhưng câu không minh nhiên dùng từ này như một danh hiệu chỉ Ngôi Con. Bản dịch giữ nguyên độ mở thần học của cụm từ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “các tầng trời” để giữ số nhiều Hy Lạp và “đất” thay vì “một trái đất”, vì tiếng Việt không có mạo từ tương ứng và cách nói sau dễ gợi ý nhiều thế giới. Dấu chú thích được đặt cuối câu vì chú thích giải thích nhiều điểm trong toàn câu.
