revisions:
- from: 'Vì họ cố ý làm ngơ điều này: từ xa xưa, các tầng trời đã hiện hữu, còn đất được hình thành từ nước và qua nước bởi lời Đức Chúa Trời.[a]'
  to: Vì họ cố tình làm ngơ điều này:[a] các tầng trời đã có từ xa xưa, còn đất được hình thành từ nước và nhờ nước bởi lời Đức Chúa Trời.
  rationale: Sửa cách diễn đạt cho tự nhiên hơn trong tiếng Việt, thay “qua nước” bằng “nhờ nước” để diễn tả rõ chức năng phương tiện của διά, và chuyển neo chú thích đến thành ngữ mà chú thích chủ yếu giải thích. Không thay đổi nội dung, không thêm diễn giải giáo phái, và vẫn bảo toàn độ mở của λόγος.
