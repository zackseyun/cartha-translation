id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: vi
  text: Nhưng hãy tăng trưởng trong ân điển và sự nhận biết Chúa và Đấng Cứu Rỗi của chúng ta là Đức Giê-su, Đấng Mê-si-a.[a] Nguyện vinh quang thuộc về Ngài, cả bây giờ lẫn cho đến ngày đời đời.[b] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách gọi truyền thống: “Đức Chúa Giê-su Christ.”'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “bây giờ và mãi mãi.” Tiếng Hy Lạp sát nghĩa hơn là “bây giờ và cho đến ngày đời đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: hãy tăng trưởng
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều; cách dịch này tự nhiên trong tiếng Việt và có thể diễn tả tiến trình tiếp tục lớn lên.
- source_word: δὲ
  choice: Nhưng
  rationale: Giữ sắc thái chuyển ý có tính tương phản nhẹ với những lời cảnh báo và khuyên bảo ngay trước đó.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: trong ân điển và sự nhận biết
  rationale: Giới từ ἐν chi phối cả hai danh từ; cách diễn đạt này giữ hình ảnh tăng trưởng trong phạm vi ân điển và nhận biết.
- source_word: χάριτι
  choice: ân điển
  rationale: Thuật ngữ Tân Ước quen thuộc, chính xác và trang trọng cho χάρις trong ngữ cảnh này.
- source_word: γνώσει
  choice: sự nhận biết
  rationale: Diễn tả sự biết Chúa, không chỉ dữ kiện trí thức; vẫn tránh diễn giải quá mức thành một loại kinh nghiệm cụ thể.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: Chúa và Đấng Cứu Rỗi của chúng ta là Đức Giê-su, Đấng Mê-si-a
  rationale: Một mạo từ chung cho κύριος và σωτήρ cho thấy cả hai tước hiệu cùng chỉ một người. Dùng “là” giúp quan hệ đồng vị rõ và tự nhiên trong tiếng Việt; Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si-a”.
- source_word: αὐτῷ ἡ δόξα
  choice: Nguyện vinh quang thuộc về Ngài
  rationale: Phản ánh lời tôn vinh có động từ được hiểu ngầm, đồng thời tạo câu tiếng Việt trang trọng, tự nhiên.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: cả bây giờ lẫn cho đến ngày đời đời
  rationale: Giữ cấu trúc tương liên καὶ...καὶ, đồng thời bảo lưu từ “ngày” trong cụm từ Hy Lạp khác thường thay vì giản lược thành “mãi mãi”.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ cách phiên âm quen thuộc trong lời tôn vinh và phụng vụ tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  alternative: Đức Giê-su Christ / Đức Chúa Giê-su Christ
  rationale: Χριστός mang ý nghĩa tước hiệu; “Đấng Mê-si-a” chuyển tải nghĩa ấy thay vì chỉ phiên âm theo truyền thống.
- issue: Đối tượng của hai tước hiệu “Chúa” và “Đấng Cứu Rỗi”
  choice: Cả hai cùng chỉ Đức Giê-su, Đấng Mê-si-a
  alternative: Để cấu trúc tiếng Việt ít minh thị hơn
  rationale: Một mạo từ Hy Lạp chi phối hai danh từ nối bằng καί, và danh xưng theo sau xác định cùng một đối tượng; từ “là” làm rõ điều ngữ pháp này mà không thêm nội dung thần học ngoài văn bản.
- issue: Cách hiểu cụm εἰς ἡμέραν αἰῶνος
  choice: cho đến ngày đời đời
  alternative: mãi mãi
  rationale: Bảo tồn cách nói khác thường và khả năng gợi đến “ngày” chung cuộc, thay vì san phẳng thành một trạng từ chỉ thời gian vô hạn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hãy tăng trưởng” phù hợp với lời khuyên trực tiếp số nhiều; “sự nhận biết” tự nhiên hơn “kiến thức” khi đối tượng là một thân vị. Các đại từ tôn kính và danh xưng được dùng nhất quán.
