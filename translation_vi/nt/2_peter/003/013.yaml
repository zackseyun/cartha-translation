source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: vi
  text: Nhưng theo lời hứa của Ngài, chúng ta đang trông đợi trời mới và đất mới, nơi sự công chính[a] cư ngụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “công lý”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: trời mới và đất mới
  rationale: Giữ nguyên ngôn ngữ vũ trụ mang âm hưởng Kinh Thánh; καινός nói đến sự mới mẻ về tính chất, nhưng dịch là “được đổi mới” sẽ diễn giải vượt quá chính tính từ.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sự tương phản nhẹ với cảnh trời đất hiện tại bị hủy diệt trong câu trước.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: theo lời hứa của Ngài
  rationale: κατά với đối cách ở đây chỉ sự phù hợp với; ἐπάγγελμα là “lời hứa”. Đại từ tôn kính “Ngài” chỉ Đức Chúa Trời theo ngữ cảnh.
- source_word: προσδοκῶμεν
  choice: chúng ta đang trông đợi
  rationale: Thì hiện tại diễn tả sự mong đợi liên tục; “đang trông đợi” vừa tự nhiên vừa giữ sắc thái hướng về tương lai.
- source_word: ἐν οἷς
  choice: nơi
  rationale: Đại từ quan hệ số nhiều quy chiếu chung đến toàn thể trời mới và đất mới; “nơi” là cách diễn đạt tự nhiên trong tiếng Việt mà không buộc phải xác định riêng tiền ngữ.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: “Sự công chính” giữ được phạm vi luân lý và thần học rộng của δικαιοσύνη; sắc thái “công lý” được bảo tồn trong chú thích.
- source_word: κατοικεῖ
  choice: ngự trị
  rationale: κατοικέω theo nghĩa đen là cư ngụ hay ở; trong tiếng Việt, nói một phẩm tính “cư ngụ” kém tự nhiên. “Ngự trị” diễn đạt sự hiện diện bền vững và đặc trưng, dù có sắc thái cai quản nhẹ.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong bối cảnh cánh chung
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” bảo toàn ý nghĩa rộng về điều ngay thẳng trước mặt Đức Chúa Trời và trật tự đạo đức của tạo vật mới; “công lý” là một sắc thái thực sự nhưng hẹp hơn, nên được ghi ở chú thích.
- issue: Ẩn dụ κατοικεῖ khi chủ ngữ là δικαιοσύνη
  choice: ngự trị
  alternative: cư ngụ
  rationale: “Cư ngụ” gần hình thức Hy Lạp hơn nhưng không tự nhiên khi chủ ngữ là “sự công chính”; “ngự trị” truyền đạt sự hiện diện ổn định, mang tính đặc trưng mà không xác định cơ chế thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trời mới và đất mới” giữ âm hưởng Kinh Thánh quen thuộc; “trông đợi” diễn tả niềm mong chờ có hy vọng. Đại từ “Ngài” được viết hoa theo quy ước tiếng Việt tôn kính khi chỉ Đức Chúa Trời.
