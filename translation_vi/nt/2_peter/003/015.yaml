reference: 2 Peter 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: vi
  text: Hãy coi sự nhẫn nại của Chúa chúng ta là sự cứu rỗi[a], cũng như Phao-lô, người anh em yêu dấu của chúng ta, cũng đã viết cho anh chị em theo sự khôn ngoan được ban cho ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự kiên nhẫn” hoặc “sự nhẫn nhịn”; ý nói việc Chúa trì hoãn phán xét nhằm đem đến sự cứu rỗi, chứ không phải vì Ngài thờ ơ.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “sự khôn ngoan được ban cho ông” rất có thể ngụ ý rằng Đức Chúa Trời đã ban sự khôn ngoan ấy, dù tiếng Hy Lạp không nêu rõ Đấng ban.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: sự kiên nhẫn
  rationale: Danh từ này chỉ sự nhẫn nại, tự kiềm chế và trì hoãn phán xét. “Sự kiên nhẫn” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại và phù hợp với ngữ cảnh Chúa chưa thi hành phán xét.
- source_word: σωτηρίαν
  choice: sự cứu rỗi
  rationale: Trong ngữ cảnh cánh chung, từ này nói đến mục đích cứu độ của sự trì hoãn phán xét; “sự cứu rỗi” giữ được sức nặng thần học và quan hệ vị ngữ trực tiếp của câu Hy Lạp.
- source_word: ἡγεῖσθε
  choice: Hãy coi ... là
  rationale: Động từ mệnh lệnh yêu cầu độc giả đánh giá hoặc nhìn nhận một điều theo một cách nhất định. Cấu trúc “coi ... là” chuyển tải rõ quan hệ với σωτηρίαν.
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa chúng ta” là tước hiệu tự nhiên, trang trọng và phù hợp với tham chiếu đến Đức Chúa Giê-su trong ngữ cảnh.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: người anh em yêu dấu
  rationale: Cách dịch này giữ sắc thái thân tình của ἀγαπητός và mối quan hệ đồng đức tin được diễn tả bằng ἀδελφός.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: theo sự khôn ngoan được ban cho ông
  rationale: κατά với đối cách diễn tả sự phù hợp; dạng bị động “được ban” giữ nguyên việc tác nhân không được nêu rõ trong nguyên văn.
- source_word: ἔγραψεν ὑμῖν
  choice: đã viết cho anh chị em
  rationale: Thì aorist được chuyển bằng quá khứ đơn “đã viết”; “anh chị em” diễn đạt số nhiều của ὑμῖν một cách tự nhiên và bao quát trong tiếng Việt.
- source_word: καθὼς καὶ
  choice: cũng như ... đã
  rationale: “Cũng như” giữ cả nét so sánh và bổ sung, liên kết lời khuyên ở đây với điều Phao-lô đã viết.
theological_decisions:
- issue: Tác nhân của sự khôn ngoan được ban cho Phao-lô
  choice: Giữ dạng bị động “được ban cho ông”, không thêm “bởi Đức Chúa Trời” trong chính văn.
  alternative: “theo sự khôn ngoan Đức Chúa Trời ban cho ông”
  rationale: Ngữ cảnh rất có thể ngụ ý Đức Chúa Trời là Đấng ban, nhưng câu Hy Lạp không nêu tác nhân; giữ dạng bị động tránh biến điều hàm ý thành điều được nói rõ.
- issue: Ý nghĩa của sự chậm thi hành phán xét của Chúa
  choice: Dịch trực tiếp “sự kiên nhẫn ... là sự cứu rỗi”.
  alternative: “sự nhẫn nhịn ... là cơ hội để được cứu”
  rationale: Nguyên văn thiết lập trực tiếp quan hệ giữa sự kiên nhẫn của Chúa và sự cứu rỗi. Bản dịch giữ sự cô đọng và sức căng thần học này, thay vì diễn giải thành một cơ hội cứu rỗi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν; giữ cấu trúc cô đọng “coi ... là sự cứu rỗi” để phản ánh sát quan hệ vị ngữ của nguyên văn. Tên Παῦλος được viết theo dạng quen thuộc “Phao-lô”.
