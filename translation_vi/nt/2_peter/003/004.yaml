id: 2PE.3.4
reference: 2 Peter 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: vi
  text: 'và nói rằng: “Lời hứa về sự trở lại[a] của Ngài ở đâu? Vì từ khi cha ông đã an giấc[b], mọi sự vẫn cứ như vậy từ buổi đầu của công cuộc sáng tạo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp παρουσία cũng có thể dịch là “sự đến” hoặc “sự hiện diện”. Trong ngữ cảnh này, từ ấy chỉ sự trở lại được mong đợi của Đấng Christ.
    reason: lexical_alternative
  - marker: b
    text: “An giấc” là lối nói giảm trong tiếng Hy Lạp để chỉ việc qua đời.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: và nói rằng
  rationale: Giữ mạch phân từ hiện tại nối với phần mô tả những kẻ nhạo báng ở câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐπαγγελία
  choice: lời hứa
  rationale: Cách dịch trực tiếp và thông dụng, chỉ lời bảo đảm đã được hứa về sự trở lại của Chúa.
- source_word: παρουσίας
  choice: sự quang lâm
  rationale: Trong ngữ cảnh cánh chung, từ này chỉ việc Đấng Christ đến/hiện diện trong tương lai; “quang lâm” là cách diễn đạt trang trọng, quen thuộc trong tiếng Việt Kinh Thánh, còn các nghĩa gần được nêu ở chú thích.
- source_word: ἀφ’ ἧς
  choice: từ khi
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian tính từ một mốc quá khứ.
- source_word: οἱ πατέρες
  choice: các tổ phụ
  rationale: Giữ sắc thái chỉ những thế hệ cha ông trước kia mà không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: ἐκοιμήθησαν
  choice: đã an giấc
  rationale: Bảo tồn lối nói giảm nói tránh về cái chết trong nguyên văn, bằng một thành ngữ tự nhiên và trang trọng trong tiếng Việt.
- source_word: πάντα
  choice: mọi sự
  rationale: Truyền đạt phạm vi bao quát của danh từ trung tính số nhiều.
- source_word: οὕτως διαμένει
  choice: vẫn cứ như vậy
  rationale: Diễn đạt tự nhiên lời quả quyết của những kẻ nhạo báng rằng tình trạng của vạn vật không thay đổi.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: từ thuở tạo dựng ban đầu
  rationale: Giữ ý nghĩa tính từ khởi đầu của công cuộc tạo dựng, với nhịp văn Việt tự nhiên và trang trọng.
theological_decisions:
- issue: Ý nghĩa của παρουσία trong ngữ cảnh cánh chung
  choice: sự quang lâm
  alternative: sự đến; sự hiện diện
  rationale: Ngữ cảnh nói đến lời hứa về việc Đấng Christ trở lại trong tương lai. “Sự quang lâm” truyền đạt cách dùng cánh chung mà không ấn định thêm thời điểm hay mô hình giáo lý; chú thích bảo tồn các nét nghĩa “đến” và “hiện diện”.
- issue: Lối nói ἐκοιμήθησαν về cái chết
  choice: đã an giấc
  alternative: đã chết; đã ngủ
  rationale: Nguyên văn dùng ẩn dụ ngủ để nói về cái chết. Giữ lối nói giảm này bảo tồn sắc thái nguồn mà không suy diễn thêm một quan điểm về trạng thái sau khi chết.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ sát lập luận của nguyên văn; dùng “quang lâm” vì độ chính xác trong ngữ cảnh cánh chung và giải thích ngay bằng chú thích. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
