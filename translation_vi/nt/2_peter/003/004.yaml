revisions:
- from: 'và nói rằng: “Lời hứa về sự quang lâm[a] của Ngài ở đâu? Vì từ khi các tổ phụ đã an giấc[b], mọi sự vẫn cứ như vậy từ thuở tạo dựng ban đầu.”'
  to: 'và nói rằng: “Lời hứa về sự trở lại[a] của Ngài ở đâu? Vì từ khi cha ông đã an giấc[b], mọi sự vẫn cứ như vậy từ buổi đầu của công cuộc sáng tạo.”'
  rationale: 'Bản sửa dùng từ ngữ hiện đại và phổ thông hơn, đồng thời giữ sát ý nghĩa của nguyên văn: lời hứa về sự trở lại, cái chết được nói uyển ngữ, và tính liên tục bị những người nhạo báng khẳng định từ buổi đầu sáng tạo. Các dấu chú thích vẫn được neo đúng sau từ được giải thích.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:29:44Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng mệnh đề trích dẫn, hình ảnh uyển ngữ của ἐκοιμήθησαν, và khẳng định của những người nhạo báng rằng vạn vật không thay đổi kể từ lúc sáng tạo. Tuy nhiên, «quang lâm» là thuật ngữ Hán-Việt chuyên biệt và cổ hơn mức cần thiết cho tiếng Việt tiêu chuẩn hiện đại; «sự trở lại» diễn đạt rõ ý nghĩa theo ngữ cảnh của παρουσία mà không làm thay đổi lập luận.
  naturalness: Câu nhìn chung trôi chảy, nhưng «từ thuở tạo dựng ban đầu» có phần nặng và lặp ý. «Từ buổi đầu của công cuộc sáng tạo» tự nhiên, rõ quan hệ sở hữu của ἀρχῆς κτίσεως. «Cha ông» cũng là cách gọi hiện đại, phổ thông hơn «các tổ phụ», đồng thời không mặc định nhóm các tổ phụ theo nghĩa kỹ thuật.
  terminology: Dùng «sự trở lại» cho παρουσία trong ngữ cảnh mong đợi Đấng Christ trở lại. Chú thích nêu các khả năng từ vựng «sự đến» và «sự hiện diện», đồng thời giải thích cách hiểu theo văn mạch. Giữ «an giấc» để bảo tồn uyển ngữ về sự chết.
  issues:
  - severity: low
    issue: «sự quang lâm» ít phổ thông trong tiếng Việt hiện đại
    rationale: Từ này có truyền thống Kinh Thánh nhưng là thuật ngữ Hán-Việt chuyên biệt. «Sự trở lại» rõ ràng và tự nhiên hơn trong văn mạch, nơi lời hứa bị chế nhạo là sự trở lại tương lai của Đấng Christ.
  - severity: low
    issue: «từ thuở tạo dựng ban đầu» hơi nặng và chưa biểu đạt mượt quan hệ trong ἀπ’ ἀρχῆς κτίσεως
    rationale: Cụm Hy Lạp có nghĩa «từ buổi đầu của công cuộc sáng tạo». Cách sửa tránh cảm giác lặp giữa «thuở» và «ban đầu».
  - severity: low
    issue: Chú thích a liệt kê «sự xuất hiện» như một khả năng từ vựng
    rationale: «Sự xuất hiện» không phải là lựa chọn sát nghĩa cần thiết ở đây; các nét nghĩa chính cần bảo tồn là «sự đến/đến» và «sự hiện diện».
