id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: vi
  text: trong khi anh chị em trông đợi và thúc đẩy sự đến của ngày Đức Chúa Trời[a], vì ngày ấy các tầng trời sẽ bị lửa thiêu mà tan rã, và các nguyên tố bị đốt cháy[b] sẽ tan chảy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nóng lòng mong đợi sự đến của ngày Đức Chúa Trời.” Động từ Hy Lạp có thể mang nghĩa “thúc đẩy” hoặc “nóng lòng mong đợi.”'
    reason: alternative_reading
  - marker: b
    text: “Các nguyên tố” có thể chỉ những thành phần cơ bản của thế giới, hoặc có thể là các thiên thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: trông đợi
  rationale: Diễn đạt sự mong chờ có tính kỳ vọng của phân từ hiện tại, đồng thời nối tự nhiên với lời khuyên ở câu trước.
- source_word: σπεύδοντας
  choice: thúc đẩy
  rationale: Giữ nghĩa trực tiếp là làm cho biến cố đến sớm hơn khi động từ đi với tân ngữ τὴν παρουσίαν; nghĩa khác là nóng lòng mong đợi được ghi ở chú thích.
- source_word: παρουσίαν
  choice: đến
  rationale: Trong ngữ cảnh cánh chung, cách nói “ngày ... đến” tự nhiên hơn danh từ hóa, nhưng vẫn truyền đạt ý về sự hiện đến.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: ngày của Đức Chúa Trời
  rationale: Giữ nguyên cách diễn đạt khác thường của Hy Lạp và phân biệt với cụm quen thuộc “ngày của Chúa”.
- source_word: δι’ ἣν
  choice: Vì ngày ấy
  rationale: διά với đối cách mang nghĩa nguyên nhân; lặp lại “ngày ấy” giúp câu tiếng Việt rõ ràng hơn đại từ quan hệ sát chữ.
- source_word: οὐρανοὶ
  choice: các tầng trời
  rationale: Giữ số nhiều của nguyên văn và sắc thái vũ trụ trong ngữ cảnh.
- source_word: πυρούμενοι
  choice: sẽ bị lửa thiêu
  rationale: Thể hiện sắc thái bị động và tác động của lửa, đồng thời kết hợp tự nhiên với động từ chính tương lai.
- source_word: λυθήσονται
  choice: tan rã
  rationale: Diễn đạt sự tháo rời hoặc phân rã, không áp đặt ý hủy diệt tuyệt đối.
- source_word: στοιχεῖα
  choice: các nguyên tố
  rationale: Là cách dịch rộng, ít diễn giải, duy trì sự mơ hồ giữa các thành phần cơ bản của thế giới và các thiên thể.
- source_word: καυσούμενα
  choice: sẽ cháy
  rationale: Truyền đạt việc chịu sức nóng hoặc lửa bằng cách nói tự nhiên trong tiếng Việt.
- source_word: τήκεται
  choice: tan chảy
  rationale: Diễn đạt kết quả của sức nóng; dùng trong chuỗi tương lai để phù hợp ngữ cảnh tiên báo.
theological_decisions:
- issue: Ý nghĩa của σπεύδοντας τὴν παρουσίαν
  choice: thúc đẩy ngày ... đến
  alternative: nóng lòng mong đợi ngày ... đến
  rationale: Cấu trúc Hy Lạp cho phép hiểu là làm cho sự hiện đến mau xảy ra hoặc tha thiết mong chờ nó. Bản chính giữ nghĩa tác động trực tiếp; chú thích bảo tồn cách hiểu ít hàm ý nhân quả hơn.
- issue: Đối tượng được gọi là στοιχεῖα
  choice: các nguyên tố
  alternative: các thiên thể
  rationale: Từ này có thể chỉ các thành phần cơ bản của thế giới hoặc, trong ngữ cảnh vũ trụ, các thiên thể. Cách dịch chính tránh áp đặt một mô hình vũ trụ học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” tiếp nối chủ thể số nhiều ngầm từ mạch khuyên bảo; “các tầng trời” giữ số nhiều; hai chú thích bảo tồn các điểm mơ hồ quan trọng của nguyên văn.
