revisions:
- from: trong khi anh chị em trông đợi và thúc đẩy ngày của Đức Chúa Trời đến[a]. Vì ngày ấy, các tầng trời sẽ bị lửa thiêu mà tan rã, và các nguyên tố sẽ cháy[b] rồi tan chảy.
  to: trong khi anh chị em trông đợi và thúc đẩy sự đến của ngày Đức Chúa Trời[a], vì ngày ấy các tầng trời sẽ bị lửa thiêu mà tan rã, và các nguyên tố bị đốt cháy[b] sẽ tan chảy.
