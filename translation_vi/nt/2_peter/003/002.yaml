  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: vi
  text: để anh chị em nhớ lại những lời các tiên tri thánh đã nói từ trước, và điều răn của Chúa và Đấng Cứu Rỗi được các sứ đồ của anh chị em truyền lại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và điều răn của các sứ đồ của anh chị em, đến từ Chúa và Đấng Cứu Rỗi.” Chuỗi sở hữu cách trong tiếng Hy Lạp có thể được liên kết theo hơn một cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνησθῆναι
  choice: để anh chị em nhớ lại
  rationale: Động từ nguyên mẫu nêu mục đích trong mạch câu từ câu 1; thêm chủ thể hàm ẩn giúp tiếng Việt tự nhiên.
- source_word: προειρημένων ῥημάτων
  choice: những lời ... đã nói từ trước
  rationale: Giữ nghĩa thời gian của προλέγω mà không thu hẹp thành lời tiên báo; “lời” diễn đạt tự nhiên ῥήματα.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: các nhà tiên tri thánh
  rationale: Giữ tác nhân và phẩm tính ἁγίων; cách nói trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐντολῆς
  choice: điều răn
  rationale: Giữ số ít và sắc thái mệnh lệnh có thẩm quyền của ἐντολή.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: các sứ đồ của anh chị em
  rationale: Cho ὑμῶν bổ nghĩa trực tiếp cho ἀποστόλων theo trật tự và cú pháp tự nhiên nhất của tiếng Hy Lạp.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: của Chúa và Đấng Cứu Rỗi
  rationale: Gắn cụm sở hữu cách với “điều răn”; không thêm “chúng ta,” vốn không có trong bản Hy Lạp.
theological_decisions:
- issue: Quan hệ của ὑμῶν trong τῶν ἀποστόλων ὑμῶν
  choice: “của anh chị em” bổ nghĩa cho “các sứ đồ”
  alternative: “điều răn được các sứ đồ truyền cho anh chị em”
  rationale: Trật tự từ gắn ὑμῶν tự nhiên nhất với ἀποστόλων, chỉ các sứ đồ gắn với hoặc được sai đến cho độc giả.
- issue: Quan hệ cú pháp của τοῦ κυρίου καὶ σωτῆρος
  choice: Điều răn thuộc về Chúa và Đấng Cứu Rỗi, được truyền qua các sứ đồ
  alternative: Các sứ đồ thuộc về Chúa và Đấng Cứu Rỗi
  rationale: Cách gắn với ἐντολῆς tạo ý nghĩa mạch lạc nhất, nhưng tiếng Hy Lạp có chuỗi sở hữu cách nên ghi chú cách diễn đạt khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đối tượng số nhiều; “sứ đồ,” “điều răn,” “Chúa” và “Đấng Cứu Rỗi” giữ sắc thái Kinh Thánh quen thuộc. Dấu [a] xuất hiện trong chính văn.
