  text: δι’ ὧν ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/006.yaml
  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: vi
  text: Bởi những điều ấy[a], thế giới thời bấy giờ, sau khi bị nước nhấn chìm, đã diệt vong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “qua những điều ấy.” Đại từ “ấy” là số nhiều, quy chiếu về các phương tiện được nhắc đến trong câu trước, nhưng nguyên văn không xác định rõ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Bởi những điều ấy
  rationale: διά với sở hữu cách diễn tả phương tiện; đại từ quan hệ số nhiều được giữ bằng “những điều ấy”, không xác định quá mức điều được quy chiếu ở câu trước.
- source_word: ὁ τότε κόσμος
  choice: thế giới thời bấy giờ
  rationale: Cách dịch tự nhiên, trang trọng, giữ sự tương phản thời gian giữa thế giới khi ấy và thế giới hiện nay trong ngữ cảnh.
- source_word: ὕδατι
  choice: bị nước ngập
  rationale: Thể hiện nước là phương tiện gây ngập trong một cấu trúc tiếng Việt tự nhiên.
- source_word: κατακλυσθεὶς
  choice: đã bị nước ngập
  rationale: Giữ nghĩa bị động của động tính từ aorist, chỉ việc bị nước lũ tràn ngập.
- source_word: ἀπώλετο
  choice: bị hủy diệt
  rationale: Diễn đạt sự tiêu vong do phán xét mà không nhất thiết hàm ý bị xóa khỏi hiện hữu về mặt siêu hình.
theological_decisions:
- issue: Bản chất của sự phán xét bằng nước lụt
  choice: bị hủy diệt
  alternative: diệt vong
  rationale: Động từ Hy Lạp mô tả sự tiêu vong hoặc hủy hoại của thế giới thời ấy; cách dịch không khẳng định sự tuyệt diệt theo nghĩa siêu hình.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ đại từ số nhiều cùng quy chiếu mở của nguyên văn; tránh giải thích cụ thể rằng đó là lời Đức Chúa Trời, nước, hay cả hai.
