id: 2PE.3.11
reference: 2 Peter 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: vi
  text: Vì tất cả những điều ấy đều đang bị tan rã như vậy[a], anh em phải là những người thế nào, trong nếp sống thánh khiết và lòng tin kính?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang bị tháo rời”; từ Hy Lạp nói sát hơn về việc bị tháo tung hoặc tan rã, thay vì trực tiếp dùng từ “hủy diệt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: tất cả những điều ấy
  rationale: Cụm sở hữu cách chỉ toàn bộ những thực tại vừa được nói đến trong văn mạch; “những điều ấy” tự nhiên trong tiếng Việt và giữ được chức năng hồi chỉ.
- source_word: οὕτως
  choice: như thế
  rationale: Cách dịch này giữ nghĩa chỉ thể cách của trạng từ, mô tả cách mọi điều bị tan rã.
- source_word: λυομένων
  choice: đang bị tan rã
  rationale: Phân từ hiện tại bị động của λύω diễn tả sự tháo rời hoặc tan rã. “Đang bị tan rã” giữ được cả sắc thái từ vựng lẫn hình thái tiếp diễn, không tự ý tăng nghĩa thành “bị hủy diệt”.
- source_word: ποταποὺς
  choice: những người thế nào
  rationale: Trong câu hỏi tu từ này, ποταπός hỏi về phẩm chất và lối sống mà người đọc phải có; cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt.
- source_word: δεῖ
  choice: phải
  rationale: δεῖ biểu thị sự cần thiết. “Phải” truyền đạt rõ đòi hỏi đạo đức trong lời khuyên bảo mà không cần một cấu trúc nặng nề hơn.
- source_word: ὑπάρχειν
  choice: là
  rationale: Trong cấu trúc với δεῖ và ὑμᾶς, động từ mang nghĩa tự nhiên là “là”, nói về con người và phẩm chất của họ.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: trong nếp sống thánh khiết
  rationale: ἀναστροφή chỉ cách cư xử hoặc lối sống. Danh từ tập hợp “nếp sống” chuyển tự nhiên số nhiều Hy Lạp sang tiếng Việt, đồng thời giữ trọng tâm đạo đức.
- source_word: εὐσεβείαις
  choice: lòng tin kính
  rationale: εὐσέβεια nói đến thái độ sùng kính được thể hiện trong đời sống. “Lòng tin kính” là cách nói trang trọng, dễ hiểu và không thu hẹp nghĩa vào nghi thức tôn giáo.
theological_decisions:
- issue: Số phận cánh chung của trật tự hiện tại
  choice: “đang bị tan rã”
  alternative: “bị hủy diệt” hoặc “sẽ tan rã”
  rationale: Bản Hy Lạp dùng từ chỉ sự tháo rời hoặc tan rã, không nhất thiết khẳng định sự tiêu hủy hoàn toàn. Giữ thể tiếp diễn của phân từ hiện tại cũng tránh biến hình thái này thành thì tương lai, dù văn mạch mang hướng cánh chung.
- issue: Sức nặng của câu hỏi tu từ
  choice: Kết câu bằng dấu chấm than
  alternative: Kết bằng dấu hỏi
  rationale: Cấu trúc ποταποὺς δεῖ là câu hỏi tu từ nhấn mạnh người đọc phải sống thánh khiết và tin kính đến mức nào. Dấu chấm than thể hiện lời thôi thúc tự nhiên trong tiếng Việt mà không cung cấp một câu trả lời giáo lý ngoài bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp cách xưng hô cộng đồng trong thư tín. Câu giữ sức mạnh của câu hỏi tu từ, còn “nếp sống” và “lòng tin kính” tạo nhịp cân đối, tự nhiên trong tiếng Việt.
