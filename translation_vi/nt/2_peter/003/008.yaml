reference: 2 Peter 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: vi
  text: 'Nhưng, thưa anh chị em yêu dấu, có một điều này anh chị em đừng quên[a]: đối với Chúa, một ngày như một ngàn năm[c][b], và một ngàn năm như một ngày.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng để điều này không được anh chị em biết đến.”'
    reason: lexical_alternative
  - marker: b
    text: Từ “như” biểu thị phép so sánh, chứ không nói một ngày bằng một ngàn năm theo nghĩa đen.
    reason: cultural_note
  - marker: c
    text: Gợi lại Thi Thiên 90:4.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: Nhưng ... điều này
  rationale: Cụm Hy Lạp nhấn mạnh một điểm cụ thể. Trong tiếng Việt, “điều này” đã diễn đạt tự nhiên lực chỉ định; “nhưng” chuyển tải δὲ và nối với mạch đối lập của văn cảnh.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: xin đừng để điều này vuột khỏi sự chú ý của mình
  rationale: λανθάνω chỉ điều thoát khỏi sự nhận biết. Cách dịch này giữ cấu trúc mệnh lệnh và quan hệ với người nhận, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀγαπητοί
  choice: anh chị em yêu dấu
  rationale: Lối xưng hô này giữ sắc thái trìu mến trong cộng đồng đức tin, đồng thời rõ ràng và tự nhiên hơn nếu chỉ dịch là “những người yêu dấu”.
- source_word: παρὰ κυρίῳ
  choice: đối với Chúa
  rationale: παρά với cách dữ liệu ở đây có thể chỉ quan điểm hoặc sự đánh giá. “Đối với Chúa” giữ được nét nghĩa ấy mà không thu hẹp thành riêng ý “trước mắt Chúa”.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: một ngày như một ngàn năm
  rationale: ὡς đánh dấu phép so sánh. “Như” giữ rõ tính loại suy, không biến câu thành một phương trình thời gian theo nghĩa đen.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: và một ngàn năm như một ngày
  rationale: Giữ cấu trúc cân xứng và phép tỉnh lược động từ của nguyên văn; tiếng Việt không cần thêm “là”.
- source_word: χίλια ἔτη
  choice: một ngàn năm
  rationale: Cách diễn đạt số lượng tiêu chuẩn, trực tiếp, không áp đặt ý nghĩa biểu tượng vào bản dịch.
theological_decisions:
- issue: Bản chất của phép so sánh về thời gian
  choice: Dịch như một phép so sánh về tương quan của Chúa với thời gian, không phải sự đồng nhất theo nghĩa đen hay công thức quy đổi tiên tri.
  alternative: Hiểu một ngày bằng đúng một ngàn năm, hoặc dùng câu này làm chìa khóa tính lịch cánh chung.
  rationale: Hai lần dùng ὡς (“như”) biểu thị phép so sánh. Bản dịch duy trì tính loại suy và không du nhập một hệ thống niên đại thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em yêu dấu” cho lời xưng hô mục vụ; giữ nhịp cân xứng của hai vế. Các ký hiệu chú thích đều xuất hiện trong câu chính.
