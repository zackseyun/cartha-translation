  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: Chúa không chậm trễ, trái lại kiên nhẫn đối với người nhận thư; ý muốn là không ai hư mất nhưng mọi người đến sự ăn năn. Tuy nhiên, từ “phải” trong “một ai phải hư mất” thêm sắc thái tất yếu/áp đặt không có trong ἀπολέσθαι. Cần bỏ từ này.'
  naturalness: “Tiến đến sự ăn năn” hiểu được nhưng hơi gượng trong tiếng Việt hiện đại. “Đến sự ăn năn” là cách diễn đạt trang trọng, gọn hơn và vẫn phản ánh εἰς ... χωρῆσαι. “Bất cứ ai hư mất” tự nhiên hơn “một ai phải hư mất.”
  terminology: “Chúa,” “lời hứa,” “kiên nhẫn,” “hư mất,” và “sự ăn năn” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Anh chị em” là cách xưng hô số nhiều tự nhiên với cộng đồng độc giả. Không nên biến βουλόμενος thành thuật ngữ thần học kỹ thuật.
