revisions:
- from: Chúa không chậm trễ về lời hứa của Ngài, như một số người cho là chậm trễ, nhưng Ngài kiên nhẫn đối với anh chị em[b][c], không muốn một ai phải hư mất, nhưng muốn mọi người đều tiến đến sự ăn năn.[a]
  to: Chúa không chậm trễ về lời hứa của Ngài, như một số người cho là chậm trễ, nhưng Ngài kiên nhẫn đối với anh chị em[b][c], không muốn bất cứ ai hư mất, nhưng muốn mọi người đều đến sự ăn năn[a].
  rationale: Bản sửa chỉ loại bỏ sắc thái tất yếu được thêm bởi “phải” và thay cách nói hơi gượng “tiến đến” bằng “đến.” Cấu trúc tương phản, phạm vi vốn không được xác định rõ của “bất cứ ai/mọi người,” và sắc thái không kỹ thuật của βουλόμενος đều được giữ nguyên. Các ký hiệu chú thích vẫn được gắn đúng vào các yếu tố chúng giải thích.
