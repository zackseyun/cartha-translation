id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: vi
  text: Chúa không chậm trễ về lời hứa của Ngài, như một số người cho là chậm trễ, nhưng Ngài kiên nhẫn đối với anh chị em[b][c], không muốn bất cứ ai hư mất, nhưng muốn mọi người đều đến sự ăn năn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đều đạt đến sự ăn năn.”
    reason: lexical_alternative
  - marker: b
    text: Hay “kiên nhẫn với anh chị em.”
    reason: lexical_alternative
  - marker: c
    text: Bản Hy Lạp để ngỏ phạm vi của “bất cứ ai” và “mọi người”; có cách hiểu rằng Phi-e-rơ chỉ nói riêng về những người nhận thư, và cũng có cách hiểu rộng hơn là về toàn thể nhân loại.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Dùng danh xưng thần học quen thuộc và trang trọng trong tiếng Việt; ngữ cảnh xác định Đấng được nói đến.
- source_word: οὐ βραδύνει ... βραδύτητα
  choice: không chậm trễ ... cho là chậm trễ
  rationale: Giữ lại sự lặp từ có chủ ý giữa động từ và danh từ trong tiếng Hy Lạp, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: τῆς ἐπαγγελίας
  choice: về lời hứa của Ngài
  rationale: Diễn đạt quan hệ của sở hữu cách với βραδύνει theo lối tự nhiên; thêm đại từ sở hữu đã được ngữ cảnh hàm ý để tránh cách nói cụt trong tiếng Việt.
- source_word: μακροθυμεῖ
  choice: kiên nhẫn
  rationale: Thể hiện sự nhẫn nại lâu dài và tự kiềm chế; tự nhiên hơn các cách diễn đạt cổ như 'nhịn nhục lâu dài'.
- source_word: εἰς ὑμᾶς
  choice: đối với anh chị em
  rationale: Giữ hướng nhắm đến người nhận thư của εἰς; 'anh chị em' truyền đạt số nhiều và sắc thái cộng đồng mà không phụ thuộc giới tính.
- source_word: μὴ βουλόμενός
  choice: không muốn
  rationale: Giữ nguyên ý chí hay mong muốn của βούλομαι mà không áp đặt một phạm trù thần học kỹ thuật về ý định hay sắc lệnh.
- source_word: τινας ἀπολέσθαι
  choice: một ai phải hư mất
  rationale: '''Hư mất'' là cách diễn đạt trang trọng, quen thuộc cho nghĩa nội động ''bị mất/diệt vong''; ''một ai'' duy trì thế đối lập với ''mọi người''.'
- source_word: πάντας
  choice: mọi người đều
  rationale: Diễn đạt tự nhiên tính bao quát của πάντας và giữ thế song song với 'một ai', không tự ý giới hạn hoặc mở rộng phạm vi.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: tiến đến sự ăn năn
  rationale: χωρέω ở đây chỉ việc đi vào hay đạt đến một trạng thái; 'tiến đến' giữ phần nào hình ảnh chuyển động, còn 'sự ăn năn' là thuật ngữ tiếng Việt chuẩn cho μετάνοια.
theological_decisions:
- issue: Phạm vi của 'anh chị em', 'một ai' và 'mọi người'
  choice: 'Giữ nguyên cách nói rộng nhưng không xác định thêm của bản Hy Lạp: ''đối với anh chị em ... không muốn một ai ... nhưng muốn mọi người''.'
  alternative: Giới hạn 'một ai/mọi người' vào cộng đồng người nhận thư, hoặc xác định rõ là toàn thể nhân loại.
  rationale: Bản Hy Lạp không nêu rõ giới hạn của các đại từ này; bản dịch không nên giải quyết thay người đọc một tranh luận thần học về phạm vi ý muốn cứu rỗi của Đức Chúa Trời.
- issue: Sắc thái của βουλόμενος đối với ý muốn của Đức Chúa Trời
  choice: Dịch là 'không muốn'.
  alternative: Dịch bằng thuật ngữ mạnh hơn như 'không định' hoặc 'không quyết định', hay bằng từ kỹ thuật 'không sắc định'.
  rationale: '''Không muốn'' truyền đạt ý chí hay mong muốn mà không nhập vào câu một hệ thống phân loại các dạng ý muốn của Đức Chúa Trời.'
- issue: Quan hệ giữa sự chậm trễ bề ngoài và lòng kiên nhẫn của Chúa
  choice: 'Giữ phép tương phản trực tiếp: không chậm trễ, nhưng kiên nhẫn.'
  alternative: Diễn giải thành việc Chúa cố ý trì hoãn để ban thêm thời gian.
  rationale: Ý diễn giải ấy có thể được suy ra, nhưng câu Hy Lạp nhấn mạnh sự kiên nhẫn chứ không gọi hành động của Chúa là trì hoãn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm nói trực tiếp với cộng đồng độc giả. Giữ sự lặp “chậm trễ” và thế đối lập “một ai/mọi người”; tránh các thuật ngữ giáo phái hoặc hệ thống thần học kỹ thuật.
