id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: vi
  text: Nhưng ngày của Chúa sẽ đến như kẻ trộm. Trong ngày ấy, các tầng trời sẽ qua đi với tiếng rền vang; các thành tố[a] sẽ bị nung cháy và tan rã, còn đất cùng những công việc ở trên đó sẽ được tìm thấy[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thiên thể”; trong ngữ cảnh này, στοιχεῖα có thể chỉ cụ thể hơn các thành phần của vũ trụ.
    reason: lexical_alternative
  - marker: b
    text: Có người hiểu “sẽ được tìm thấy” theo nghĩa “sẽ bị phơi bày” hoặc “sẽ bị lộ ra”.
    reason: alternative_reading
  - marker: c
    text: Nhiều thủ bản chép “sẽ bị thiêu rụi” thay cho “sẽ được tìm thấy”.
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: sẽ đến
  rationale: Diễn đạt tự nhiên thì tương lai của ἥκω và phù hợp với chủ ngữ mang tính cánh chung là “ngày của Chúa”.
- source_word: ἡμέρα κυρίου
  choice: ngày của Chúa
  rationale: Giữ thành ngữ cánh chung quen thuộc trong truyền thống tiên tri và sứ đồ, không khiến người đọc hiểu là một ngày thờ phượng hằng tuần.
- source_word: κλέπτης
  choice: kẻ trộm
  rationale: Giữ hình ảnh nhấn mạnh sự xuất hiện bất ngờ và cách diễn đạt Kinh Thánh quen thuộc.
- source_word: ἐν ᾗ
  choice: Trong ngày ấy
  rationale: Nêu rõ từ quan hệ giống cái số ít quy về “ngày” vừa được nhắc đến, đồng thời tự nhiên hơn trong tiếng Việt.
- source_word: οἱ οὐρανοὶ
  choice: các tầng trời
  rationale: Phản ánh dạng số nhiều của οὐρανοί và phù hợp với bối cảnh vũ trụ.
- source_word: ῥοιζηδόν
  choice: với tiếng rền vang
  rationale: Truyền đạt âm thanh lao vút, cuồn cuộn hoặc gầm rền mà trạng từ này gợi lên, bằng lối nói trang trọng và dễ hiểu.
- source_word: παρελεύσονται
  choice: sẽ qua đi
  rationale: Giữ nghĩa cánh chung thông dụng của παρέρχομαι và sự liên hệ với các bản văn Kinh Thánh khác nói trời đất qua đi.
- source_word: στοιχεῖα
  choice: các thành tố
  rationale: “Thành tố” đủ rộng để không quyết định đây là các nguyên tố vật chất hay các thiên thể; khả năng thứ hai được ghi ở chú thích.
- source_word: καυσούμενα
  choice: sẽ bị nung cháy
  rationale: Phản ánh ý bị tác động bởi lửa mà không thêm một tác nhân không được nêu trong câu.
- source_word: λυθήσεται
  choice: tan rã
  rationale: Diễn đạt hình ảnh bị tháo tung hoặc phân rã chính xác hơn từ khái quát “bị hủy diệt”.
- source_word: γῆ
  choice: đất
  rationale: Trong phạm vi vũ trụ của câu, từ này chỉ đất/thế giới bên dưới các tầng trời; “đất” giữ sát từ ngữ nguồn mà không hiện đại hóa thành thuật ngữ thiên văn.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: những công việc ở trên đó
  rationale: Giữ nghĩa rộng của ἔργα là các công việc, việc làm hoặc sản phẩm của việc làm, thay vì thu hẹp thành hành vi đạo đức hay công trình vật chất.
- source_word: εὑρεθήσεται
  choice: sẽ được tìm thấy
  rationale: Giữ nghĩa trực tiếp và cách nói khó của bản văn SBLGNT, không âm thầm chuyển sang một cách giải thích trôi chảy hơn.
theological_decisions:
- issue: Ý nghĩa mệnh đề cuối καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: Giữ “đất cùng những công việc ở trên đó sẽ được tìm thấy” trong chính văn.
  alternative: “sẽ bị phơi bày” hoặc, theo một dị bản, “sẽ bị thiêu rụi”
  rationale: εὑρεθήσεται theo bản văn được cung cấp có nghĩa trực tiếp là “sẽ được tìm thấy”. Vì mệnh đề này vừa khó giải thích vừa có dị bản, bản dịch không thay thế nó bằng một cách hiểu thần học rõ hơn mà ghi các khả năng khác trong chú thích.
- issue: Đối tượng được στοιχεῖα chỉ đến
  choice: Dịch là “các thành tố”, không xác định cụ thể đó là nguyên tố vật chất hay thiên thể.
  alternative: “các thiên thể” hoặc “các thành phần cơ bản của vũ trụ”
  rationale: Trong ngữ cảnh này, từ Hy Lạp có thể chỉ các thành phần cấu tạo vũ trụ hoặc các thiên thể. Chính văn giữ độ rộng nghĩa vốn có.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Câu giữ nhịp điệu mạnh của cảnh phán xét bằng “tiếng rền vang”, “nung cháy” và “tan rã”, đồng thời cố ý bảo toàn cách nói khó “sẽ được tìm thấy”. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại cụm từ liên quan trong chính văn.
