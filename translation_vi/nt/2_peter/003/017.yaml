id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: vi
  text: Vậy, anh chị em yêu dấu, vì đã biết trước điều này, hãy giữ mình, kẻo bị sự lầm lạc của những kẻ vô luật pháp cuốn đi mà ngã khỏi[a] sự vững vàng của chính mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngã khỏi” cũng có thể dịch là “rơi khỏi”; cách dịch chính giữ hình ảnh của tiếng Hy Lạp mà không làm lời cảnh báo mang một kết luận thần học cụ thể hơn nguyên văn.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “sự kiên định của chính mình.” Từ Hy Lạp στηριγμός có thể chỉ sự vững chắc, ổn định hoặc kiên định.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Vậy, anh chị em
  rationale: “Vậy” giữ quan hệ suy luận của οὖν với phần trước; “anh chị em” diễn đạt tự nhiên đại từ số nhiều được nhấn mạnh trong lời trực tiếp.
- source_word: ἀγαπητοί
  choice: yêu dấu
  rationale: Giữ sắc thái trìu mến và trang trọng của lời xưng hô mục vụ.
- source_word: προγινώσκοντες
  choice: vì đã biết trước điều này
  rationale: Giữ ý biết trước/cảnh giác trước; “điều này” được bổ sung theo ngữ cảnh để câu tiếng Việt rõ nghĩa.
- source_word: φυλάσσεσθε
  choice: hãy giữ mình
  rationale: Thể hiện mệnh lệnh hiện tại có sắc thái phản thân, kêu gọi tiếp tục cảnh giác.
- source_word: ἵνα μὴ
  choice: kẻo
  rationale: Diễn đạt tự nhiên mệnh đề mục đích-cảnh báo phủ định mà không làm giảm sức cảnh cáo.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: sự lầm lạc của những kẻ bất chấp luật pháp
  rationale: “Sự lầm lạc” bao quát lỗi lạc và sự dẫn sai; “bất chấp luật pháp” truyền đạt việc coi thường chuẩn mực hơn là chỉ nói chung chung “gian ác”.
- source_word: συναπαχθέντες
  choice: bị ... cuốn đi
  rationale: Giữ thể bị động và hình ảnh bị kéo theo cùng sự lầm lạc.
- source_word: ἐκπέσητε
  choice: ngã khỏi
  rationale: Giữ ẩn dụ “rơi/ngã khỏi” của động từ mà không tự ý xác định đây là sự bội đạo hay mất sự cứu rỗi.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: chỗ đứng vững vàng của chính mình
  rationale: Diễn đạt tự nhiên ý về sự vững chắc, ổn định; “của chính mình” giữ nét nhấn mạnh của ἰδίου.
theological_decisions:
- issue: ἐκπέσητε có nhất thiết chỉ sự bội đạo hoặc mất sự cứu rỗi hay không
  choice: ngã khỏi chỗ đứng vững vàng của chính mình
  alternative: lìa bỏ đức tin vững chắc; mất địa vị an toàn trong đức tin
  rationale: Nguyên văn cảnh báo về việc bị lầm lạc cuốn đi và rơi khỏi tình trạng vững vàng, nhưng không tự nó giải quyết cuộc tranh luận thần học về sự kiên trì hay bội đạo.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Lời xưng hô “anh chị em yêu dấu” giữ sự ấm áp của thư tín; cấu trúc cảnh báo được diễn đạt tự nhiên nhưng vẫn bảo toàn ẩn dụ và sự căng thẳng thần học của nguyên văn.
