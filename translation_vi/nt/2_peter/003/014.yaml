id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: vi
  text: Vì vậy, anh chị em yêu dấu, trong khi trông đợi những điều ấy, hãy hết sức cố gắng để được Ngài tìm thấy[a] trong bình an, không tì vết và không chỗ trách được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “được thấy trước mặt Ngài.” Dữ cách trong tiếng Hy Lạp có thể chỉ tác nhân (“được Ngài tìm thấy”) hoặc chỉ sự quy chiếu hay hiện diện (“trước mặt Ngài”).'
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Vì vậy
  rationale: Liên từ suy luận, rút ra lời khuyên từ phần nói trước về ngày của Chúa cùng trời mới và đất mới.
- source_word: ἀγαπητοί
  choice: thưa anh chị em yêu dấu
  rationale: Giữ sắc thái trìu mến của lời xưng hô số nhiều, đồng thời diễn đạt tự nhiên và bao quát trong tiếng Việt hiện đại.
- source_word: ταῦτα προσδοκῶντες
  choice: trong khi trông đợi những điều ấy
  rationale: Giữ đối tượng chỉ định không bị diễn giải quá mức và thể hiện sự trông đợi đang tiếp diễn; “trong khi” bảo toàn sắc thái thời gian mà không loại trừ mối liên hệ làm cơ sở cho mệnh lệnh.
- source_word: σπουδάσατε
  choice: hãy hết sức cố gắng
  rationale: Truyền đạt mệnh lệnh phải chuyên tâm, khẩn thiết và nỗ lực thực sự bằng cách nói rõ ràng trong tiếng Việt hiện đại.
- source_word: ἄσπιλοι
  choice: không tì vết
  rationale: Giữ hình ảnh về sự tinh sạch và phù hợp với nghĩa luân lý trong ngữ cảnh.
- source_word: ἀμώμητοι
  choice: không chỗ trách được
  rationale: Diễn tả tình trạng không có căn cứ để bị khiển trách, đồng thời vẫn phân biệt phần nào với hình ảnh “không tì vết” ở từ đi kèm.
- source_word: αὐτῷ
  choice: được Ngài nhận thấy
  rationale: 'Hiểu dữ cách theo nghĩa tác nhân: chính Ngài là Đấng nhận thấy họ trong tình trạng ấy. Đại từ vẫn để ẩn danh tính cụ thể như câu Hy Lạp, còn cách hiểu chỉ sự hiện diện hay quy chiếu được ghi ở chú thích.'
- source_word: εὑρεθῆναι
  choice: để được ... nhận thấy
  rationale: Giữ thể bị động và ý về tình trạng được nhận ra khi cuộc thẩm định cánh chung diễn ra.
- source_word: ἐν εἰρήνῃ
  choice: ở trong bình an
  rationale: Giữ cấu trúc và độ mở của nguyên văn, không tự ý xác định đây là bình an nội tâm, hòa thuận trong cộng đồng hay mối quan hệ hòa thuận với Ngài.
theological_decisions:
- issue: Chức năng và đối tượng quy chiếu của αὐτῷ trong bối cảnh cánh chung
  choice: Dịch theo nghĩa tác nhân là “được Ngài nhận thấy,” nhưng không thêm “Chúa” hay “Đức Chúa Trời.”
  alternative: “được thấy trước mặt Ngài” hoặc “được thấy trong mắt Ngài”
  rationale: Dữ cách Hy Lạp có thể chỉ tác nhân hoặc chỉ sự quy chiếu/hiện diện. Bản chính chọn cách hiểu tác nhân phù hợp với ý về Đấng thẩm định khi ngày ấy đến, nhưng chú thích bảo tồn cách đọc thật sự khả hữu kia và không xác định danh tính rõ hơn nguyên văn.
- issue: Phạm vi ý nghĩa của ἐν εἰρήνῃ
  choice: Dùng “ở trong bình an” mà không thêm bổ ngữ.
  alternative: “được bình an với Ngài” hoặc “sống hòa thuận”
  rationale: Nguyên văn không nói rõ bình an với ai hay thuộc phương diện nào; bản dịch giữ nguyên độ mở thần học và quan hệ của cụm từ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng lời xưng hô “anh chị em yêu dấu” để vừa tự nhiên vừa giữ sự trìu mến. Cụm “Ngài” phản ánh đối tượng thần linh hàm ẩn trong ngữ cảnh mà không thêm một danh xưng không có trong câu. Dấu chú thích [a] được đặt ngay sau cụm từ có cách hiểu khác.
