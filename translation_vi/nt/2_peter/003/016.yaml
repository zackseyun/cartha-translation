id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: vi
  text: Ông cũng nói về những điều này trong tất cả các thư của ông. Trong các thư ấy có một số điều khó hiểu, mà những kẻ thiếu hiểu biết[a] và không vững vàng xuyên tạc[b], cũng như họ xuyên tạc các phần Kinh Thánh còn lại[c], để chuốc lấy sự hủy diệt cho chính mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những kẻ không được dạy dỗ.”
    reason: lexical_alternative
  - marker: b
    text: Hay “bẻ cong.”
    reason: lexical_alternative
  - marker: c
    text: Hay “các phần Kinh Thánh khác.” Từ Hy Lạp có thể mang nghĩa “còn lại” hoặc “khác”; “còn lại” phù hợp hơn với phép so sánh trong câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: các thư
  rationale: “Thư” là cách gọi tự nhiên trong tiếng Việt hiện đại đối với thư tín, rõ nghĩa hơn từ Hán-Việt chuyên biệt “thư tín” trong câu này.
- source_word: λαλῶν
  choice: nói
  rationale: Giữ nghĩa cơ bản là “nói”, dù phương tiện ở đây là các thư; tránh diễn giải quá mức thành “viết”.
- source_word: περὶ τούτων
  choice: về những điều này
  rationale: Giữ nguyên tính chỉ xuất của τούτων, hướng về các vấn đề vừa được đề cập trong văn cảnh.
- source_word: δυσνόητά τινα
  choice: một số điều khó hiểu
  rationale: Diễn đạt tự nhiên, đồng thời giữ cả ý bất định của τινα và ý “khó hiểu” của δυσνόητα.
- source_word: ἀμαθεῖς
  choice: thiếu hiểu biết
  rationale: Chỉ tình trạng thiếu kiến thức hoặc chưa được học hỏi, nhưng không hàm ý đơn thuần là mù chữ; cách nói này tự nhiên và bớt tính miệt thị hơn “ngu dốt”.
- source_word: ἀστήρικτοι
  choice: không vững vàng
  rationale: Truyền đạt tình trạng chưa được củng cố, thiếu sự kiên định về nhận thức hoặc đức tin mà không thu hẹp nghĩa vào một phạm vi duy nhất.
- source_word: στρεβλοῦσιν
  choice: xuyên tạc
  rationale: Diễn tả việc làm sai lệch ý nghĩa; hình ảnh “bẻ cong” vẫn là một khả năng và được ghi ở chú thích.
- source_word: τὰς λοιπὰς γραφὰς
  choice: các phần Kinh Thánh còn lại
  rationale: γραφή số nhiều trong văn cảnh Tân Ước chỉ các sách thánh; λοιπάς tự nhiên mang nghĩa “còn lại”, qua đó giữ sự so sánh giữa các thư của Phao-lô và những phần Kinh Thánh khác.
- source_word: ἀπώλειαν
  choice: sự hủy diệt
  rationale: Giữ mức độ nghiêm trọng của từ Hy Lạp mà không áp đặt một thuật ngữ thần học chuyên biệt hơn văn bản.
theological_decisions:
- issue: Hàm ý về địa vị Kinh Thánh trong τὰς λοιπὰς γραφὰς
  choice: các phần Kinh Thánh còn lại
  alternative: các phần Kinh Thánh khác
  rationale: Cách dịch “còn lại” giữ hàm ý tự nhiên của λοιπάς rằng các thư đang được đặt bên cạnh những sách thánh khác, nhưng không bổ sung một khẳng định tín lý vượt quá cách diễn đạt của nguyên văn.
- issue: 'Kết quả của việc xuyên tạc: πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν'
  choice: để chuốc lấy sự hủy diệt cho chính mình
  alternative: dẫn đến sự hủy diệt của chính họ
  rationale: “Chuốc lấy” thể hiện hậu quả do chính hành động của họ đem lại, nhưng không xác định thêm bản chất hay thời điểm của sự hủy diệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” vì câu này tiếp nối văn cảnh nói về Phao-lô; đại từ không tự bổ sung tên riêng. Nhịp câu bám sát cấu trúc Hy Lạp nhưng lặp “xuyên tạc” ở vế so sánh để tiếng Việt rõ nghĩa hơn.
