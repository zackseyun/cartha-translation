- from: cũng như trong tất cả các thư của ông, khi ông nói trong đó về những điều này. Trong các thư ấy có một số điều khó hiểu, mà những kẻ thiếu hiểu biết[a] và không vững vàng xuyên tạc[b], cũng như họ xuyên tạc các phần Kinh Thánh còn lại[c], để chuốc lấy sự hủy diệt cho chính mình.
  to: Ông cũng nói về những điều này trong tất cả các thư của ông. Trong các thư ấy có một số điều khó hiểu, mà những kẻ thiếu hiểu biết[a] và không vững vàng xuyên tạc[b], cũng như họ xuyên tạc các phần Kinh Thánh còn lại[c], để chuốc lấy sự hủy diệt cho chính mình.
