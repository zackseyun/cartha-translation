  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: vi
  text: 'Trước hết, cần biết điều này: trong những ngày sau cùng, những kẻ nhạo báng sẽ đến với sự nhạo báng[a], sống theo những ham muốn riêng của mình[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những kẻ nhạo báng sẽ đến mà nhạo báng.” Tiếng Hy Lạp dùng hai từ cùng gốc để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: “Ham muốn” cũng có thể dịch là “dục vọng”; từ Hy Lạp có thể chỉ những khao khát mãnh liệt nói chung, không chỉ ham muốn tình dục.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: trước hết hãy biết điều này
  rationale: Dùng lời truyền bảo tự nhiên trong tiếng Việt để diễn đạt phân từ mang sắc thái thúc giục trong văn cảnh, đồng thời giữ πρῶτον là “trước hết”.
- source_word: ἐλεύσονται
  choice: sẽ đến
  rationale: Diễn đạt trực tiếp thì tương lai của ἔρχομαι, không thêm ý “xuất hiện” vốn không được nói rõ.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: trong những ngày sau cùng
  rationale: Giữ thành ngữ thời kỳ cánh chung theo cách tự nhiên và quen thuộc trong tiếng Việt, không xác định một hệ thống thời kỳ tận thế cụ thể.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: những kẻ chế giễu sẽ đến với lời chế giễu
  rationale: Giữ phép nhấn mạnh bằng hai từ Hy Lạp cùng gốc, dù tiếng Việt có sự lặp lại có chủ ý.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: theo những ham muốn riêng của mình
  rationale: “Ham muốn” giữ được nghĩa rộng của ἐπιθυμία và sắc thái tiêu cực trong văn cảnh, không thu hẹp thành dục vọng tình dục.
- source_word: πορευόμενοι
  choice: sống
  rationale: Trong cấu trúc này, πορεύομαι chỉ cách ăn ở hay lối sống; “sống” truyền đạt ý nghĩa tự nhiên hơn là giữ nguyên ẩn dụ “bước đi”.
theological_decisions:
- issue: Ý nghĩa cánh chung của ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: trong những ngày sau cùng
  alternative: vào cuối các ngày
  rationale: Cách dịch giữ nguyên phạm vi thời gian mang tính cánh chung nhưng không áp đặt niên biểu, quan điểm thiên niên kỷ hay hệ phái nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp từ có chủ ý của nguyên văn ở mệnh đề về sự chế giễu; chuyển ẩn dụ “bước đi” thành “sống” để tiếng Việt tự nhiên mà vẫn bảo toàn ý chỉ lối sống.
