id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: vi
  text: Thưa anh chị em yêu dấu, nay tôi viết cho anh chị em bức thư thứ hai này. Trong cả hai thư, qua lời nhắc nhở, tôi khơi dậy tâm trí trong sáng của anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tâm trí chân thành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: anh chị em yêu dấu
  rationale: Cách xưng hô số nhiều này vừa tự nhiên trong văn phong Cơ Đốc tiếng Việt, vừa giữ được sắc thái trìu mến và trọng lượng của từ Hy Lạp.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: đây là thư thứ hai
  rationale: Sắp xếp lại trật tự từ để câu tiếng Việt tự nhiên, đồng thời giữ ý rằng bức thư hiện tại là thư thứ hai gửi cho cùng những người nhận.
- source_word: γράφω
  choice: tôi viết
  rationale: Thì hiện tại mang tính thư tín được diễn đạt tự nhiên bằng hiện tại đơn trong tiếng Việt.
- source_word: ἐν αἷς
  choice: Trong cả hai thư
  rationale: Đại từ quan hệ giống cái số nhiều quy chiếu tự nhiên nhất về hai bức thư; cách dịch này làm rõ số nhiều mà không thêm ý ngoài văn bản.
- source_word: διεγείρω
  choice: khơi dậy
  rationale: Giữ hình ảnh đánh thức hoặc thúc đẩy tâm trí hoạt động và chú ý trở lại, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: ἐν ὑπομνήσει
  choice: dùng lời nhắc nhở
  rationale: Diễn đạt phương tiện hoặc cách thức của hành động khơi dậy bằng một cấu trúc tiếng Việt rõ ràng.
- source_word: εἰλικρινῆ διάνοιαν
  choice: tâm trí chân thành
  rationale: διάνοια chỉ tâm trí hoặc cách suy nghĩ; εἰλικρινής có thể mang nghĩa chân thành, thuần khiết. Bản dịch chính giữ sắc thái chân thành và ghi nhận lựa chọn từ vựng khác trong chú thích.
- source_word: ὑμῶν
  choice: của anh chị em
  rationale: Diễn đạt quan hệ sở hữu của đại từ số nhiều một cách rõ ràng, tự nhiên.
theological_decisions:
- issue: Sở chỉ của đại từ quan hệ số nhiều ἐν αἷς
  choice: Quy chiếu về cả hai bức thư mà tác giả đã viết cho người nhận.
  alternative: Hiểu là chỉ bức thư hiện tại theo cách dùng số nhiều không chặt chẽ.
  rationale: Ngữ pháp tự nhiên nhất nối đại từ giống cái số nhiều với hai bức thư vừa được nhắc đến. Cách dịch này giữ nghĩa hiển nhiên của câu mà không suy diễn thêm về danh tính bức thư trước.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để thể hiện số nhiều và sắc thái cộng đồng; “yêu dấu” giữ giọng trìu mến của lời xưng hô. Tách thành hai câu để tiếng Việt sáng rõ mà vẫn bảo toàn quan hệ ý nghĩa của nguyên văn.
