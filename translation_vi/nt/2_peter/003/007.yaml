  to: Nhưng trời đất hiện nay, bởi cùng một lời ấy, đã được để dành và đang được giữ lại cho lửa, cho đến ngày phán xét và hủy diệt những người không tin kính.
  rationale: Bản sửa bảo lưu mọi yếu tố ngữ nghĩa của tiếng Hy Lạp, làm rõ ý “cùng một lời ấy,” dùng “được để dành” để phản ánh tốt hơn thể hoàn thành bị động, và bỏ chú thích không cần thiết. Cụm “ngày phán xét và hủy diệt những người không tin kính” vẫn để ngỏ câu hỏi rộng hơn về số phận của trời đất, vì sự hủy diệt trong câu trực tiếp gắn với những người không tin kính.
