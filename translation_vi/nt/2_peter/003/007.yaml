  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: trời đất hiện nay đối lập với thế giới trước, được đặt dưới tác động của cùng một lời, được giữ cho lửa, hướng tới ngày phán xét và sự hủy diệt của những người không tin kính. Tuy nhiên, “đã được dành sẵn” làm yếu hình ảnh hoàn thành của τεθησαυρισμένοι (“được để dành/tích trữ”), và “chính” không diễn đạt rõ bằng “cùng/một ... ấy” lực hồi chỉ của αὐτῷ.'
  naturalness: “Được để dành” tự nhiên hơn “được dành sẵn” trong ngữ cảnh vật được giữ lại cho một thời điểm/mục đích tương lai. “Những người không tin kính” là cách gọi trang trọng, hiện đại và ít mang sắc thái miệt thị không cần thiết hơn “những kẻ không tin kính.”
  terminology: '“Phán xét,” “lửa,” và “hủy diệt” đều phù hợp. Không cần chú thích về ἀπώλεια: bản văn Hy Lạp trực tiếp nói đến “sự hủy diệt của những người không tin kính”; chú thích hiện có không nêu một biến thể văn bản hay lựa chọn dịch thuật cần thiết.'
