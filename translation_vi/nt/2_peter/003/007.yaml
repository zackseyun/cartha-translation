source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: vi
  text: Nhưng trời đất hiện nay, bởi cùng một lời ấy, đã được để dành và đang được giữ lại cho lửa, cho đến ngày phán xét và hủy diệt những người không tin kính.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Nhưng trời đất hiện nay
  rationale: “Nhưng” thể hiện sắc thái tương phản của δέ với thế giới trước kia trong mạch văn. “Trời đất hiện nay” là cách nói tự nhiên trong tiếng Việt, vẫn giữ ý về trật tự thọ tạo hiện tồn; danh từ số nhiều οὐρανοί không buộc phải diễn đạt bằng hình thức số nhiều trong tiếng Việt.
- source_word: τῷ αὐτῷ λόγῳ
  choice: bởi chính lời ấy
  rationale: Cụm này quy chiếu về lời hữu hiệu của Đức Chúa Trời trong văn cảnh. “Bởi” diễn đạt cách dùng công cụ của cách dữ, còn “chính… ấy” giữ lực hồi chỉ và nhấn mạnh của αὐτῷ.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: đã được dành sẵn
  rationale: Thể hoàn thành chu diễn tả một hành động đã xảy ra với kết quả còn tiếp diễn. “Đã được dành sẵn” truyền đạt trạng thái được định sẵn mà không dùng hình ảnh “tích trữ” dễ gây hiểu sai trong tiếng Việt.
- source_word: πυρὶ τηρούμενοι
  choice: đang được giữ lại cho lửa
  rationale: τηρέω mang nghĩa giữ gìn hoặc giữ lại, còn πυρί chỉ điều hay mục đích mà trời đất được giữ lại cho. “Đang được” phản ánh phân từ hiện tại và phân biệt với hành động hoàn thành ở vế trước.
- source_word: εἰς ἡμέραν κρίσεως
  choice: cho đến ngày phán xét
  rationale: “Cho đến” diễn đạt tự nhiên điểm tận cùng theo thời gian của εἰς trong văn cảnh cánh chung này.
- source_word: καὶ ἀπωλείας
  choice: và hủy diệt
  rationale: ἀπώλεια chỉ sự hủy diệt hoặc diệt vong. “Hủy diệt” rõ nghĩa trong văn cảnh phán xét mà không áp đặt một hệ thống thần học kỹ thuật.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: những kẻ không tin kính
  rationale: ἀσεβής chỉ người không kính sợ hoặc không tôn kính Đức Chúa Trời. Trong tiếng Việt, “những kẻ” đã chỉ con người nói chung nên không cần đưa giới tính ngữ pháp của ἀνθρώπων vào bản dịch chính.
theological_decisions:
- issue: Bản chất của kết cuộc bằng lửa sắp đến
  choice: Giữ nguyên lời khẳng định rằng trời đất hiện nay được giữ lại cho lửa và rằng ngày ấy là ngày phán xét, hủy diệt những kẻ không tin kính.
  alternative: Diễn giải câu này là sự tiêu hủy hoàn toàn vũ trụ, hoặc là sự thanh tẩy và biến đổi công trình sáng tạo.
  rationale: Câu này xác quyết sự phán xét bằng lửa trong tương lai, nhưng “hủy diệt” trực tiếp gắn với những kẻ không tin kính. Bản dịch không quyết định cuộc tranh luận rộng hơn về việc trời đất bị tiêu hủy hoàn toàn hay được đổi mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trời đất” theo cách nói tự nhiên của tiếng Việt; “lời ấy” không viết hoa để tránh bổ sung cách hiểu thần học không được hình thức câu Hy Lạp tự thân đòi hỏi. Dấu chú thích [a] được đặt ngay sau cụm liên quan.
