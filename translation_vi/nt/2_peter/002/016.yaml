id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: vi
  text: 'Nhưng ông đã bị quở trách vì chính việc làm trái luật của mình: một con vật thồ hàng vốn không nói được[a], đã lên tiếng bằng giọng người[b] và ngăn sự điên rồ của nhà tiên tri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “một con vật thồ hàng”; ở đây nói đến con lừa của Ba-la-am (Dân Số 22:28–30).
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “bằng giọng của một người.” Cụm Hy Lạp có lẽ mang nghĩa “bằng giọng người,” nhằm tương phản con vật với người nói.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: bị quở trách
  rationale: Danh từ ἔλεγξις chỉ sự khiển trách hoặc vạch lỗi; cấu trúc ἔλεγξιν ἔσχεν được diễn đạt tự nhiên trong tiếng Việt bằng thể bị động “đã bị quở trách”.
- source_word: ἰδίας παρανομίας
  choice: chính hành vi phạm pháp của mình
  rationale: παρανομία chỉ hành vi trái luật, không chỉ một sai lầm chung chung; “chính…của mình” giữ sắc thái nhấn mạnh trách nhiệm cá nhân của ἰδίας.
- source_word: ὑποζύγιον
  choice: con vật thồ hàng
  rationale: Từ này chỉ loài vật mang ách hoặc chở nặng. Cách dịch không nói cụ thể là lừa, vì bản Hy Lạp dùng danh từ khái quát.
- source_word: ἄφωνον
  choice: không biết nói
  rationale: ἄφωνος nghĩa là không có tiếng nói hoặc không thể nói; “không biết nói” tự nhiên trong tiếng Việt và làm nổi bật nghịch lý khi con vật cất tiếng người.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: cất tiếng người
  rationale: Cụm từ diễn tả con vật phát ra tiếng nói của con người, đối lập với tình trạng không biết nói; “tiếng người” không hàm ý riêng giới tính nam.
- source_word: φθεγξάμενον
  choice: đã cất tiếng
  rationale: Phân từ này nói đến việc phát ra lời có thể hiểu được; “cất tiếng” vừa tự nhiên vừa kết hợp gọn với “tiếng người”.
- source_word: ἐκώλυσεν
  choice: ngăn
  rationale: κωλύω có nghĩa ngăn cản hoặc kìm lại; “ngăn” giữ được lực trực tiếp của động từ mà không giải thích quá mức kết quả.
- source_word: παραφρονίαν
  choice: sự điên rồ
  rationale: παραφρονία diễn tả trạng thái phi lý, mất sáng suốt, mạnh hơn “dại dột”; “sự điên rồ” giữ cường độ của nguyên văn.
- source_word: τοῦ προφήτου
  choice: của nhà tiên tri
  rationale: Giữ cách gọi của nguyên văn và không ngụ ý tán thành hành vi của Ba-la-am.
theological_decisions:
- issue: Có nên xác định ὑποζύγιον là “con lừa” dựa trên Dân Số 22 hay không
  choice: Giữ cách gọi khái quát “con vật thồ hàng” trong chính văn
  alternative: con lừa
  rationale: Ngữ cảnh rõ ràng ám chỉ con lừa của Ba-la-am, nhưng bản Hy Lạp dùng ὑποζύγιον, không dùng danh từ cụ thể chỉ con lừa. Chú thích cung cấp nhận diện từ bối cảnh Cựu Ước.
- issue: Cách hiểu ἀνθρώπου trong ἐν ἀνθρώπου φωνῇ
  choice: tiếng người
  alternative: tiếng của một người đàn ông
  rationale: Ở đây ἄνθρωπος đối lập lời nói của con người với con vật không biết nói, chứ không đối lập nam với nữ; “tiếng người” phản ánh đúng ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thế đối lập giàu tính châm biếm của nguyên văn giữa con vật vốn không biết nói và sự điên rồ của nhà tiên tri; không thêm tên Ba-la-am vào chính văn.
