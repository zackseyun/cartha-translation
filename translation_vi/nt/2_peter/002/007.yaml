source:
  edition: SBLGNT
  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: vi
  text: và Ngài đã giải cứu Lót, người công chính, đang bị hành hạ vì lối sống phóng túng của những kẻ coi thường luật pháp—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bị hành hạ” cũng có thể dịch là “bị áp bức”, “bị khổ tâm” hoặc “bị dằn vặt”.
    reason: lexical_alternative
  - marker: b
    text: “Phóng túng” chỉ sự buông thả trơ trẽn và quá độ về đạo đức; cũng có thể dịch là “trụy lạc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ nối tiếp mạch lập luận từ câu trước.
- source_word: δίκαιον Λὼτ
  choice: Lót, người công chính
  rationale: Truyền đạt rõ lời đánh giá trực tiếp của bản văn về Lót mà không làm nhẹ đi vì những khó khăn trong trình thuật Sáng Thế Ký.
- source_word: καταπονούμενον
  choice: bị khổ tâm
  rationale: Phân từ hiện tại bị động diễn tả tình trạng đau khổ kéo dài do tác động bên ngoài; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sắc thái mạnh.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: vì lối sống
  rationale: ὑπό với tác nhân/sự việc gây tác động được diễn đạt tự nhiên bằng “vì”; ἀναστροφή chỉ cách cư xử hoặc nếp sống thường xuyên.
- source_word: τῶν ἀθέσμων
  choice: của những kẻ coi thường luật pháp
  rationale: Diễn đạt sắc thái của những người bất chấp điều luật định hay điều phải lẽ, tránh khiến người đọc chỉ hiểu theo nghĩa vi phạm luật dân sự.
- source_word: ἐν ἀσελγείᾳ
  choice: phóng túng
  rationale: Chỉ sự buông thả trơ trẽn và quá độ về đạo đức, thường có sắc thái dục vọng; “phóng túng” vừa dễ hiểu vừa không thu hẹp nghĩa quá mức.
- source_word: ἐρρύσατο
  choice: Ngài đã giải cứu
  rationale: Động từ aorist diễn tả hành động cứu khỏi nguy nan; chủ ngữ được bổ sung từ mạch câu trước để câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Lời đánh giá đạo đức dành cho Lót
  choice: Giữ nguyên lời gọi Lót là “người công chính”.
  alternative: Làm nhẹ hoặc lược bỏ tính từ vì các hành động gây tranh luận của Lót trong Sáng Thế Ký.
  rationale: δίκαιον trực tiếp mô tả Lót; bản dịch cần giữ sự căng thẳng thần học của chính bản văn thay vì tự điều hòa.
- issue: Chủ ngữ ngầm của ἐρρύσατο
  choice: Dịch là “Ngài” theo chủ thể đang hành động trong mạch văn trước.
  alternative: Dịch “Đức Chúa Trời” để nêu danh xưng tường minh, hoặc bỏ chủ ngữ như cấu trúc Hy Lạp.
  rationale: Tiếng Việt cần chủ ngữ tự nhiên hơn; “Ngài” duy trì liên kết ngữ cảnh mà không thêm một danh xưng không có ngay trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lót” theo cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Dấu gạch cuối câu được giữ vì câu Hy Lạp tiếp tục sang mệnh đề kế tiếp. Các dấu chú thích được đặt tại cụm từ tương ứng trong chính văn.
