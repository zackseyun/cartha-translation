id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: vi
  text: Vì nếu họ đã thoát khỏi những điều ô uế của thế gian nhờ nhận biết Chúa và Đấng Cứu Rỗi là Đức Giê-su, Đấng Mê-si-a,[a] mà rồi lại vướng mắc vào những điều ấy và bị khuất phục, thì tình trạng sau cùng của họ đã trở nên tệ hơn tình trạng ban đầu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “nhờ sự nhận biết đầy đủ về Chúa và Đấng Cứu Rỗi là Đức Giê-su, Đấng Mê-si-a.” Từ Hy Lạp có thể gợi sự nhận biết sâu hoặc trực tiếp hơn, nhưng bản văn không tự xác định đây là sự nhận biết cứu rỗi hay chỉ là sự nhận biết bề ngoài.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những điều sau cùng đã trở nên tệ hơn những điều ban đầu,” một lối nói chỉ tình trạng về sau so với tình trạng trước đó.'
    reason: clarity
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: đã thoát khỏi
  rationale: Phân từ bất định chỉ hành động xảy ra trước việc lại vướng mắc; cách dịch này tự nhiên và giữ rõ quan hệ thời gian.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: những điều ô uế của thế gian
  rationale: μίασμα chỉ điều gây ô uế hoặc làm nhiễm bẩn, ở đây mang sắc thái luân lý; cụm từ này tự nhiên hơn lối dịch thuần vật chất như “sự ô nhiễm”.
- source_word: ἐν ἐπιγνώσει
  choice: nhờ nhận biết
  rationale: ἐν trong ngữ cảnh có thể biểu thị phương tiện; “nhận biết” truyền đạt một sự hiểu biết thực sự mà không tự quyết định mức độ hay bản chất cứu rỗi của sự hiểu biết ấy.
- source_word: τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: Chúa và Đấng Cứu Rỗi là Đức Giê-su, Đấng Mê-si-a
  rationale: Giữ hai tước hiệu κύριος và σωτήρ cùng quy về Đức Giê-su; Χριστός được thể hiện với lực tước hiệu là “Đấng Mê-si-a” trong tiếng Việt tự nhiên.
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: mà rồi lại vướng mắc vào những điều ấy
  rationale: Diễn đạt việc một lần nữa bị cuốn và mắc vào chính những điều ô uế vừa nhắc tới, đồng thời giữ quan hệ tương phản của δέ.
- source_word: ἡττῶνται
  choice: bị khuất phục
  rationale: Động từ chỉ việc bị đánh bại hoặc chế ngự; “bị khuất phục” phù hợp với ngữ cảnh đạo đức và giữ thể bị động.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: tình trạng sau cùng ... tệ hơn tình trạng ban đầu
  rationale: Các tính từ trung tính số nhiều được dùng theo lối thành ngữ để đối chiếu hoàn cảnh về sau với hoàn cảnh trước đó; thêm “tình trạng” làm câu tiếng Việt rõ và tự nhiên mà không gán ý nghĩa cánh chung.
theological_decisions:
- issue: Bản chất của ἐπίγνωσις và mối liên hệ với sự bội đạo
  choice: “nhận biết” mà không thêm “cứu rỗi”, “trọn vẹn” hay “chỉ bề ngoài”
  alternative: “sự nhận biết cứu rỗi”; “sự hiểu biết bề ngoài”; “nhận biết đầy đủ”
  rationale: Từ Hy Lạp có thể gợi sự nhận biết sâu hoặc trực tiếp hơn, nhưng tự nó không giải quyết tranh luận liệu những người này đã thật sự được tái sinh hay chưa. Bản dịch giữ nguyên sức căng thần học.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Ki-tô
  rationale: Trong cụm này, Χριστός vẫn có thể được nghe như một tước hiệu; “Đấng Mê-si-a” giữ nghĩa tước hiệu và dễ hiểu trong tiếng Việt hiện đại.
- issue: Đối tượng của “tình trạng sau cùng” và “tình trạng ban đầu”
  choice: Chỉ nêu sự đối chiếu giữa hai tình trạng
  alternative: Giải thích rõ đây là mất sự cứu rỗi hoặc chỉ là suy đồi đạo đức
  rationale: Câu văn khẳng định tình trạng về sau tệ hơn trước nhưng không trực tiếp định nghĩa giáo lý về địa vị cứu rỗi; bản dịch không thêm kết luận hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” theo cách gọi phổ biến trong tiếng Việt; “Đấng Mê-si-a” làm rõ lực tước hiệu của Χριστός. Tránh từ ngữ tự quyết định tranh luận thần học về sự cứu rỗi và bội đạo.
