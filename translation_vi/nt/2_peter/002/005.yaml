    rationale: Dự thảo đã nêu phương án này trong quyết định thần học, và vết kiểm tra tiếng Anh cũng giữ phương án “justice”; chú thích giúp bảo lưu lựa chọn từ vựng mà không thay đổi bản văn chính.
