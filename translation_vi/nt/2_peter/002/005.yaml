  to: và Ngài đã không dung tha thế giới thuở xưa, nhưng đã gìn giữ Nô-ê, người thứ tám[a], là người rao truyền sự công chính[b], khi Ngài giáng một trận lụt xuống một thế giới của những kẻ không tin kính,
