id: 2PE.2.5
reference: 2 Peter 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: vi
  text: và Ngài đã không dung tha thế giới thuở xưa, nhưng đã gìn giữ Nô-ê, người thứ tám[a], là người rao truyền sự công chính[b], khi Ngài giáng một trận lụt xuống một thế giới của những kẻ không tin kính,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Nô-ê, một trong tám người”; cách nói Hy Lạp cô đọng, theo nghĩa Nô-ê được gìn giữ cùng với bảy người khác.'
    reason: lexical_alternative
  - marker: b
    text: Hay “người công bố sự công chính.” Từ Hy Lạp chỉ một người công khai rao báo hoặc truyền đạt một thông điệp.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: thế giới thuở xưa
  rationale: Diễn đạt tự nhiên thời kỳ thế giới trước trận lụt, đồng thời giữ rõ sắc thái thời gian của ἀρχαῖος.
- source_word: οὐκ ἐφείσατο
  choice: đã không dung tha
  rationale: φείδομαι trong bối cảnh phán xét mang nghĩa không tha, không miễn khỏi hình phạt; “không dung tha” trang trọng và quen thuộc.
- source_word: ὄγδοον Νῶε
  choice: Nô-ê, người thứ tám
  rationale: Giữ cách nói bằng số thứ tự cô đọng và có phần không xác định của tiếng Hy Lạp, thay vì âm thầm giải thích thành “một trong tám người”.
- source_word: δικαιοσύνης κήρυκα
  choice: người rao truyền sự công chính
  rationale: κῆρυξ chỉ người công khai loan báo; “người rao truyền” tự nhiên hơn “sứ giả” trong tiếng Việt ở đây mà không thu hẹp thành một chức vụ giáo hội. δικαιοσύνη được dịch theo nghĩa mặc định là “sự công chính”.
- source_word: ἐφύλαξεν
  choice: gìn giữ
  rationale: Trong bối cảnh được cứu qua sự phán xét, “gìn giữ” bao quát ý bảo vệ và bảo toàn.
- source_word: κατακλυσμὸν
  choice: trận lụt
  rationale: Chỉ trận đại hồng thủy thời Nô-ê; “trận lụt” là cách nói rõ và tự nhiên, không phóng đại ngoài từ nguồn.
- source_word: κόσμῳ ἀσεβῶν
  choice: một thế giới gồm những kẻ không tin kính
  rationale: 'Giữ danh từ κόσμος và diễn đạt rõ quan hệ sở thuộc/miêu tả của ἀσεβῶν: thế giới do những người không tin kính hợp thành hoặc đặc trưng.'
- source_word: ἐπάξας
  choice: khi Ngài giáng
  rationale: Chuyển phân từ aorist thành mệnh đề thời gian tự nhiên, giữ quan hệ giữa việc gìn giữ Nô-ê và việc đưa trận lụt đến.
theological_decisions:
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: sự công bình / công lý
  rationale: “Sự công chính” giữ phạm vi đạo đức và quan hệ đúng đắn rộng của δικαιοσύνη trong lời mô tả điều Nô-ê rao truyền; “công lý” có thể khiến nghĩa bị thu hẹp về tư pháp.
- issue: Ý nghĩa của ὄγδοον Νῶε
  choice: Nô-ê, người thứ tám
  alternative: Nô-ê, một trong tám người
  rationale: Cấu trúc Hy Lạp cô đọng và dùng số thứ tự. Bản chính giữ hình thức ấy; chú thích nêu cách hiểu phổ biến rằng Nô-ê được gìn giữ cùng bảy người khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một vế nối tiếp lập luận điều kiện của văn cảnh (“và ...”), nên kết thúc bằng dấu phẩy. Đại từ “Ngài” chỉ Đức Chúa Trời theo văn cảnh; không bổ sung danh xưng không có trong câu Hy Lạp.
