id: 2PE.2.18
reference: 2 Peter 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: vi
  text: Vì họ nói những lời lẽ khoa trương trống rỗng[a], dùng những ham muốn của xác thịt[b] và sự buông thả để dụ dỗ những người đang chật vật thoát khỏi những người sống trong lầm lạc[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nói những lời huênh hoang nhưng vô nghĩa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những ham muốn của xác thịt.”'
    reason: lexical_alternative
  - marker: c
    text: 'Bản văn Hy Lạp ở đây có thể nhấn mạnh rằng họ chỉ vừa đủ hoặc chật vật thoát khỏi. Một số thủ bản đọc “thật sự”, theo đó có thể dịch: “những người thật sự đã thoát khỏi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: những lời khoa trương rỗng tuếch
  rationale: ὑπέρογκα chỉ điều quá mức, huênh hoang hoặc phô trương; vì đi với φθεγγόμενοι, việc thêm “lời” là tự nhiên. ματαιότητος mô tả tính chất vô nghĩa, không có thực chất của lời nói.
- source_word: φθεγγόμενοι
  choice: nói
  rationale: Diễn đạt tự nhiên phân từ chỉ cách thức họ dụ dỗ.
- source_word: δελεάζουσιν
  choice: dụ dỗ
  rationale: Giữ sắc thái nhử mồi và lôi kéo vào điều sai trái.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: dùng những ham muốn xác thịt
  rationale: Hiểu ἐν theo nghĩa phương tiện; “xác thịt” giữ ẩn dụ đạo đức của σάρξ mà không diễn giải quá mức thành một phạm trù giáo lý.
- source_word: ἀσελγείαις
  choice: sự buông thả
  rationale: Chỉ lối sống hoặc hành vi dục vọng không kiềm chế; cách nói này tự nhiên và đủ rộng trong tiếng Việt.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: những người vừa mới thoát
  rationale: Bản SBLGNT in ὀλίγως; từ này có thể chỉ việc mới vừa thoát hoặc chỉ thoát được rất ít/chật vật. Ngữ cảnh và chứng cứ dị bản khiến “vừa mới thoát” là cách dịch phù hợp nhưng cần chú thích phương án khác.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: những kẻ sống trong lầm lạc
  rationale: ἀναστρεφομένους nói đến nếp sống hay cách cư xử thường xuyên, còn πλάνη chỉ sự lầm lạc hoặc mê lầm.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong ngữ cảnh đạo đức
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: Giữ nguyên hình ảnh Hy Lạp và sức căng thần học, không đồng nhất từ này với một khái niệm thần học được hệ thống hóa.
- issue: Tình trạng của những người bị dụ dỗ
  choice: vừa mới thoát
  alternative: chật vật thoát / hầu như chưa thoát
  rationale: Không khẳng định cuộc thoát khỏi lầm lạc đã trọn vẹn hay có ý nghĩa cứu rỗi; phân từ hiện tại và trạng từ vẫn cho thấy tình trạng đang diễn tiến hoặc mong manh.
- issue: Đối tượng mà họ đang thoát khỏi
  choice: những kẻ sống trong lầm lạc
  alternative: chính sự lầm lạc
  rationale: Cú pháp tự nhiên nhất xem cụm danh từ cuối là nhóm người mà các nạn nhân đang thoát khỏi, thay vì biến πλάνη thành đối tượng trực tiếp của việc thoát.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Khoa trương rỗng tuếch” truyền đạt lời nói phô trương nhưng vô thực; “buông thả” tránh từ Hán-Việt quá chuyên biệt. Dùng “những kẻ” cho nhóm sống trong lầm lạc để giữ giọng cảnh cáo mạnh của ngữ cảnh.
