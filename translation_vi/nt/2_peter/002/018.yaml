    issue: “vừa mới thoát” không phản ánh chính xác trọng tâm của ὀλίγως.
    rationale: ὀλίγως thường có nghĩa “ít, hầu như không, chỉ vừa đủ”; trong ngữ cảnh này, “đang chật vật thoát khỏi” giữ được tính mong manh của cuộc thoát và thể tiếp diễn của ἀποφεύγοντας.
  - severity: low
