id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: vi
  text: Nhưng giữa dân chúng[a] cũng đã xuất hiện những tiên tri giả; cũng vậy, giữa anh em sẽ có những thầy dạy giả dối. Họ sẽ lén lút đưa vào những tà thuyết dẫn đến diệt vong[b], thậm chí chối bỏ chính Chủ đã mua họ[c], và tự chuốc lấy sự diệt vong nhanh chóng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dân chúng” ở đây nhiều khả năng chỉ dân Israel, là cộng đồng từng có các tiên tri giả.
    reason: contextual_clarification
  - marker: b
    text: 'Cũng có thể dịch: “những phe phái dẫn đến diệt vong.” Từ Hy Lạp có thể chỉ tà thuyết, giáo phái hoặc phe nhóm; ở đây nó gắn với sự dạy dỗ sai lạc và việc chối bỏ Chủ.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Chúa đã cứu chuộc họ.” Nguyên văn là “Chủ đã mua họ,” giữ hình ảnh mua mà không giải quyết những tranh luận thần học rộng hơn về phạm vi của việc mua ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: đã xuất hiện
  rationale: Diễn đạt tự nhiên việc các tiên tri giả đã nảy sinh trong cộng đồng ở quá khứ.
- source_word: ψευδοπροφῆται
  choice: những tiên tri giả
  rationale: Chuyển ngữ trực tiếp và minh bạch danh từ ghép Hy Lạp.
- source_word: ἐν τῷ λαῷ
  choice: giữa dân chúng
  rationale: Giữ cách gọi khái quát “dân” trong bản Hy Lạp; văn cảnh nhiều khả năng chỉ dân Israel, được nêu trong chú thích thay vì thêm thẳng vào câu.
- source_word: ψευδοδιδάσκαλοι
  choice: những kẻ dạy dỗ giả
  rationale: Giữ sự song hành với “những tiên tri giả” và nói rõ đây là những người giảng dạy điều sai lạc.
- source_word: παρεισάξουσιν
  choice: sẽ lén lút đưa vào
  rationale: Bảo toàn cả ý đưa vào lẫn sắc thái kín đáo, trá hình của động từ.
- source_word: αἱρέσεις ἀπωλείας
  choice: những tà thuyết dẫn đến diệt vong
  rationale: “Tà thuyết” phù hợp với hành vi giảng dạy sai lạc và chối bỏ Chủ; cụm “dẫn đến diệt vong” thể hiện sức hủy diệt hoặc kết quả của chúng mà không ép quan hệ sở hữu cách theo một nghĩa quá hẹp.
- source_word: τὸν ... δεσπότην
  choice: chính Chủ
  rationale: “Chủ” giữ sắc thái quyền sở hữu và thẩm quyền của δεσπότης, đồng thời phân biệt với κύριος, thường được dịch là “Chúa”.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: đã mua họ
  rationale: Giữ nguyên hình ảnh mua chuộc của ἀγοράζω và không thay bằng cách giải nghĩa thần học hẹp hơn như “đã cứu chuộc họ”.
- source_word: ἀρνούμενοι
  choice: chối bỏ
  rationale: Diễn đạt trực tiếp hành động phủ nhận và khước từ Chủ.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: tự chuốc lấy sự diệt vong mau chóng
  rationale: Giữ lực phản thân của ἑαυτοῖς, quan hệ hậu quả của phân từ và sắc thái nhanh chóng của ταχινήν.
theological_decisions:
- issue: Nghĩa của αἱρέσεις trong văn cảnh
  choice: tà thuyết
  alternative: phe phái; bè phái
  rationale: Từ này có thể chỉ các phe nhóm, nhưng việc chúng được bí mật đưa vào và gắn với sự chối bỏ Chủ khiến nội dung dạy dỗ sai lạc nổi bật hơn. Chú thích vẫn bảo lưu khả năng chỉ các phe phái gây diệt vong.
- issue: Ý nghĩa của τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: Chủ đã mua họ
  alternative: Chúa đã cứu chuộc họ; Đấng Chủ Tể đã mua họ
  rationale: Bản dịch giữ nguyên ẩn dụ mua và mối căng thẳng thần học trong lời tuyên bố rằng chính những kẻ dạy dỗ giả đã được Chủ mua, không tự quyết định phạm vi hay bản chất của việc mua ấy.
- issue: Phân biệt δεσπότης với κύριος
  choice: Chủ
  alternative: Chúa; Đấng Chủ Tể
  rationale: “Chủ” phản ánh quan hệ thẩm quyền và sở hữu của δεσπότης mà không đồng nhất hoàn toàn từ này với danh xưng κύριος.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” để nói với cộng đồng độc giả. Câu giữ sự đối xứng giữa tiên tri giả trong quá khứ và kẻ dạy dỗ giả trong tương lai, đồng thời lặp lại “diệt vong” để phản ánh việc ἀπώλεια xuất hiện hai lần trong nguyên văn.
