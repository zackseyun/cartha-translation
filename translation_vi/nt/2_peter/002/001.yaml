  source_fidelity: Bản dịch truyền đạt đúng cấu trúc đối chiếu giữa các tiên tri giả trong quá khứ và các giáo sư giả sẽ có giữa độc giả; cũng giữ được nét bí mật của παρεισάξουσιν, ẩn dụ “mua” của ἀγοράσαντα, và tính phản thân trong ἐπάγοντες ἑαυτοῖς. “Chính Chủ” phản ánh hợp lý sắc thái nhấn mạnh của καὶ trước tân ngữ, đồng thời phân biệt δεσπότης với κύριος. Tuy nhiên, “những kẻ dạy dỗ giả” có thể bị hiểu là những người giả vờ dạy dỗ, thay vì những người dạy điều giả dối.
  naturalness: Câu văn nhìn chung hiện đại và rõ nghĩa. “Những thầy dạy giả dối” là cách gọi tự nhiên, trực tiếp hơn trong tiếng Việt hiện đại cho ψευδοδιδάσκαλοι. “Sự diệt vong nhanh chóng” cũng tự nhiên hơn trật tự “sự diệt vong mau chóng,” mà vẫn phản ánh ταχινήν.
  terminology: Giữ “tiên tri giả,” “tà thuyết,” “Chủ,” và “diệt vong” là phù hợp. “Tà thuyết dẫn đến diệt vong” truyền đạt cách hiểu hợp ngữ cảnh của αἱρέσεις ἀπωλείας mà chú thích vẫn bảo lưu lựa chọn “phe phái.” Chú thích về “Chủ đã mua họ” thích đáng vì không giải quyết thay văn bản tranh luận thần học về phạm vi của việc mua/chuộc.
