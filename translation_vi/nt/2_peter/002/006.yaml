id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: vi
  text: và nếu sau khi biến các thành Sô-đôm và Gô-mô-rơ thành tro bụi, Ngài đã kết án chúng phải bị hủy diệt,[a] qua đó đặt chúng làm một ví dụ cho thấy điều sẽ xảy đến với những kẻ vô đạo,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể sắp xếp ý: “Ngài đã kết án các thành ấy bằng cách biến chúng thành tro bụi.”'
    reason: Cấu trúc phân từ τεφρώσας có thể được diễn đạt như hoàn cảnh đi trước hoặc như phương tiện thi hành sự kết án.
  - marker: b
    text: 'Cũng có thể hiểu: “đặt chúng làm gương cho những kẻ về sau sẽ sống vô đạo.”'
    reason: Ghi nhận cách hiểu khác của cụm μελλόντων ἀσεβέσιν và giữ sự mơ hồ có thật giữa điều sắp xảy đến cho người vô đạo với những người sẽ trở nên vô đạo.
lexical_decisions:
- source_word: τεφρώσας
  choice: sau khi biến ... thành tro bụi
  rationale: Động từ τεφρόω diễn tả kết quả là bị biến thành tro, không chỉ hành động thiêu đốt. Cách dịch này giữ quan hệ phân từ với động từ chính và tự nhiên trong tiếng Việt.
- source_word: καταστροφῇ κατέκρινεν
  choice: đã kết án chúng phải bị hủy diệt
  rationale: κατέκρινεν mang sắc thái tư pháp là tuyên án; danh từ ở cách dữ liệu καταστροφῇ diễn tả kết quả hoặc nội dung của án phạt. Cách dịch này giữ cả ý phán quyết lẫn sự hủy diệt.
- source_word: ὑπόδειγμα
  choice: một ví dụ
  rationale: Từ này có nghĩa là ví dụ hoặc hình mẫu. Trong ngữ cảnh phán xét, ví dụ ấy hàm ý cảnh báo, nhưng bản dịch không thêm trực tiếp từ “cảnh báo” để tránh giải thích quá mức.
- source_word: μελλόντων ἀσεβέσιν
  choice: điều sẽ xảy đến với những kẻ vô đạo
  rationale: Với μελλόντων ở dạng sở hữu số nhiều và ἀσεβέσιν ở cách dữ liệu số nhiều, cụm từ có thể được hiểu là “những điều sắp đến dành cho người vô đạo.” Cách dịch này phản ánh trực tiếp hình thái của bản SBLGNT đã cung cấp.
- source_word: τεθεικώς
  choice: qua đó đặt chúng làm
  rationale: 'Phân từ hoàn thành của τίθημι nhấn mạnh tình trạng kết quả: các thành ấy đã được đặt làm ví dụ. “Qua đó” nối kết tự nhiên hành động phán xét với chức năng làm ví dụ.'
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: các thành Sô-đôm và Gô-mô-rơ
  rationale: Giữ danh từ số nhiều “các thành” và dùng dạng phiên âm quen thuộc, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Chủ ngữ được ngầm hiểu từ văn cảnh
  choice: Ngài
  alternative: Đức Chúa Trời; Chúa; lược bỏ chủ ngữ
  rationale: Câu Hy Lạp tiếp nối chuỗi hành động phán xét của chủ thể đã nêu trong văn cảnh. Đại từ “Ngài” giúp câu tiếng Việt rõ và tự nhiên mà không đưa thêm một danh hiệu không có trong mệnh đề này.
- issue: Quan hệ giữa μελλόντων và ἀσεβέσιν
  choice: điều sẽ xảy đến với những kẻ vô đạo
  alternative: những kẻ về sau sẽ sống vô đạo
  rationale: Bản văn SBLGNT được cung cấp có μελλόντων ở sở hữu cách và ἀσεβέσιν ở dữ liệu cách, thuận với ý “những điều sắp xảy đến cho người vô đạo.” Tuy vậy, cách hiểu nói về những người sẽ vô đạo về sau được giữ trong chú thích vì có mặt trong lớp tham khảo tiếng Anh và phản ánh một cách đọc khác của cụm từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ ở dạng mệnh đề tiếp nối bằng “và nếu” để phù hợp với cú pháp của toàn câu trong văn cảnh. “Vô đạo” chuyển tải sắc thái bất kính đối với Đức Chúa Trời của ἀσεβής mà không gắn với thuật ngữ riêng của một hệ phái.
