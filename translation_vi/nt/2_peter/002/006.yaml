review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng sự thiêu thành tro, sự kết án dẫn đến hủy diệt, và việc các thành ấy trở thành gương. Tuy nhiên, “một ví dụ cho thấy điều sẽ xảy đến” diễn giải mạnh chức năng của ὑπόδειγμα và cấu trúc khó của μελλόντων ἀσεβέσιν. Bản sửa giữ cách hiểu theo hình thức văn bản SBLGNT là “những điều sắp xảy đến cho những kẻ vô đạo,” đồng thời để cách hiểu khác trong chú thích.
  naturalness: Câu sửa vẫn giữ mệnh đề điều kiện dang dở của văn mạch (“và nếu”) nhưng dùng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại. “Biến ... thành tro” sát nghĩa τεφρόω hơn “thành tro bụi”; “phải chịu sự hủy diệt” diễn đạt rõ kết quả của sự kết án.
  terminology: “Kết án,” “hủy diệt,” “gương,” và “những kẻ vô đạo” phù hợp sắc thái tư pháp, cảnh tỉnh, và đạo-đức/tôn giáo của nguyên văn, không áp đặt thuật ngữ hệ phái. Tên riêng Sô-đôm và Gô-mô-rơ được giữ theo dạng quen dùng.
  issues:
  - severity: medium
    issue: Cụm “một ví dụ cho thấy điều sẽ xảy đến” diễn giải thêm quan hệ giữa ὑπόδειγμα và cụm μελλόντων ἀσεβέσιν.
    rationale: Nguyên văn được cung cấp có cú pháp khó và có thể tranh luận. “Cho thấy” biến “gương/mẫu” thành một mệnh đề giải thích trực tiếp; nên dịch sát hơn là “làm gương về những điều sắp xảy đến cho...” và giữ cách hiểu nhân xưng trong chú thích.
  - severity: low
    issue: “Tro bụi” rộng nghĩa hơn τεφρόω.
    rationale: τεφρόω nhấn mạnh việc biến thành tro. “Thành tro” vừa tự nhiên vừa sát nghĩa hơn.
  - severity: low
    issue: “Qua đó” nêu rõ quan hệ phương tiện/hệ quả giữa các phân từ hơn mức cần thiết.
    rationale: Phân từ hoàn thành τεθεικώς cho biết kết quả đã được thiết lập; liên từ “và” giữ quan hệ này mà không giải thích thêm.
  revised_text: và nếu, sau khi biến các thành Sô-đôm và Gô-mô-rơ thành tro, Ngài đã kết án chúng phải chịu sự hủy diệt,[a] và đặt chúng làm gương về những điều sắp xảy đến cho những kẻ vô đạo,[b]
  revised_footnotes:
  - marker: a
    text: 'Hoặc sắp xếp ý: “Ngài đã kết án các thành ấy phải chịu sự hủy diệt bằng cách biến chúng thành tro.”'
    reason: Phân từ τεφρώσας có thể được diễn đạt là hành động đi trước hoặc là phương tiện của sự kết án.
  - marker: b
    text: 'Cũng có thể hiểu: “đặt chúng làm gương cho những người về sau sẽ sống vô đạo.”'
    reason: Cụm μελλόντων ἀσεβέσιν trong văn bản được cung cấp có cú pháp khó và được hiểu khác nhau; chú thích giữ cách hiểu thay thế mà không quyết định vượt quá nguyên văn.
  revision_rationale: Sửa tối thiểu để tránh diễn giải cú pháp đang tranh luận, dịch τεφρόω chính xác hơn, và giữ mạch phân từ của nguyên văn. Dấu câu và dạng mệnh đề điều kiện được bảo lưu vì câu này tiếp nối văn mạch trước.
