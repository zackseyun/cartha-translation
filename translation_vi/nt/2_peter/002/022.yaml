id: 2PE.2.22
reference: 2 Peter 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: vi
  text: 'Điều mà câu tục ngữ chân thật nói đã xảy đến với họ: “Chó quay lại đồ nó đã mửa ra,”[a] và: “Heo nái đã được tắm sạch lại lăn mình trong bùn nhơ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dòng đầu gợi lại Châm Ngôn 26:11. Trong tiếng Hy Lạp, hai vế tục ngữ có cấu trúc rút gọn: “Chó, đã quay lại đồ nó đã mửa ra … và heo nái đã được tắm sạch, để lăn mình trong bùn nhơ.”'
    reason: cross_reference_and_literal_form
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: đã xảy đến với họ
  rationale: Thì hoàn thành diễn tả một việc đã xảy ra và kết quả vẫn còn; cách dịch này tự nhiên và giữ quan hệ hướng đến những người mà tục ngữ ứng nghiệm.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: điều câu tục ngữ chân thật nói
  rationale: Cấu trúc Hy Lạp tỉnh lược; cách dịch làm rõ rằng nội dung tục ngữ đã ứng vào họ mà không thêm lời giải thích thần học.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Chó trở lại với chính đồ nó đã mửa ra
  rationale: Giữ hình ảnh thô, trực tiếp của nguyên văn, sắc thái sở hữu của ἴδιον, và sự liên hệ với Châm Ngôn 26:11.
- source_word: Ὗς λουσαμένη
  choice: Heo nái đã được tắm sạch
  rationale: “Heo nái” giữ giống cái của danh từ; dạng trung gian/bị động không xác định chắc con vật tự tắm hay được tắm, nên cách dịch bị động tự nhiên không khẳng định tác nhân.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: lại lăn mình trong bùn
  rationale: “Lăn mình trong bùn” truyền đạt sinh động hành động κυλισμός và chất bùn nhơ βόρβορος; “lại” được bổ sung theo ý trở về hành vi cũ trong cấu trúc tục ngữ.
theological_decisions:
- issue: Lực của lời dẫn tục ngữ tỉnh lược
  choice: Nội dung câu tục ngữ đã xảy đến và ứng vào những người được nói đến.
  alternative: Bản thân “lời của câu tục ngữ chân thật” đã xảy đến với họ.
  rationale: Cách dịch giữ phép ẩn dụ về sự quay lại tình trạng cũ, nhưng không diễn giải thêm bản chất thần học của sự sa ngã.
- issue: Quan hệ giữa việc được tắm sạch và việc trở lại bùn
  choice: 'Giữ nguyên sự căng thẳng của hình ảnh: heo nái thật sự được mô tả là đã được tắm sạch rồi lại lăn trong bùn.'
  alternative: Diễn giải việc tắm chỉ là sự thay đổi bề ngoài hoặc biểu tượng cho một giáo lý cụ thể.
  rationale: Nguyên văn không giải thích ý nghĩa tín lý chính xác của việc tắm; bản dịch không nên áp đặt một hệ phái hay cách giải nghĩa riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “tục ngữ” thay vì từ cổ; giữ hình ảnh mạnh của nguyên văn. Dấu [a] được đặt ngay sau câu tục ngữ thứ nhất vì chú thích vừa nêu đối chiếu Châm Ngôn vừa giải thích cấu trúc Hy Lạp rút gọn.
