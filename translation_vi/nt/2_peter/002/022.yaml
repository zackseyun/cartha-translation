revisions:
- from: 'Điều câu tục ngữ chân thật nói đã xảy đến với họ: “Chó trở lại với chính đồ nó đã mửa ra,”[a] và: “Heo nái đã được tắm sạch lại lăn mình trong bùn.”'
  to: 'Điều mà câu tục ngữ chân thật nói đã xảy đến với họ: “Chó quay lại đồ nó đã mửa ra,”[a] và: “Heo nái đã được tắm sạch lại lăn mình trong bùn nhơ.”'
  rationale: Bản sửa làm câu tiếng Việt tự nhiên hơn, giữ nguyên tính tỉnh lược của lời dẫn và của hai hình ảnh tục ngữ, đồng thời phản ánh rõ hơn sắc thái «bùn nhơ» của βόρβορος. Không thêm diễn giải tín lý hay hành động như «liếm/ăn» mà bản Hy Lạp không nêu.
  reviewer_model: gpt-5.6-terra
