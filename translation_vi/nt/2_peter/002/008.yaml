id: 2PE.2.8
reference: 2 Peter 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: vi
  text: vì qua những điều mắt thấy tai nghe[a], người công chính ấy, khi sống giữa họ, ngày này qua ngày khác đã giày vò tâm hồn công chính của mình bởi những việc làm trái luật của họ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “bởi cảnh ông thấy và điều ông nghe”. Trật tự Hy Lạp đặt cụm này ở đầu câu, nên quan hệ chính xác của nó với việc giày vò có thể được diễn đạt theo vài cách.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã tự giày vò trong tâm hồn công chính vì những việc làm trái luật mà ông thấy và nghe”. Hai cụm ở cách dữ—“mắt thấy tai nghe” và “những việc làm trái luật”—khiến cách sắp xếp các thành phần trong tiếng Việt có phần linh hoạt.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: qua những điều mắt thấy tai nghe
  rationale: Hai danh từ ở cách dữ cho biết phương diện hoặc phương tiện tri giác. Thành ngữ “mắt thấy tai nghe” tự nhiên trong tiếng Việt và giữ cả thị giác lẫn thính giác.
- source_word: ὁ δίκαιος
  choice: người công chính ấy
  rationale: Tính từ có mạo từ được dùng như danh từ và chỉ về Lót ở câu trước; “ấy” làm rõ sự quy chiếu mà không thêm tên riêng vào câu.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: khi sống giữa họ
  rationale: Phân từ diễn tả việc cư trú liên tục giữa những người ấy. “Khi sống giữa họ” rõ ràng, tự nhiên và không buộc phải xác định quan hệ thời gian hay nguyên nhân quá mức.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: ngày này qua ngày khác
  rationale: Thành ngữ Hy Lạp nhấn mạnh sự việc lặp lại và kéo dài liên tục.
- source_word: ψυχὴν δικαίαν
  choice: tâm hồn công chính của mình
  rationale: ψυχή ở đây chỉ đời sống nội tâm hoặc chính con người bên trong của Lót. “Tâm hồn” truyền đạt nỗi đau nội tâm mà không biến câu thành một định nghĩa kỹ thuật về cấu tạo con người.
- source_word: ἀνόμοις ἔργοις
  choice: bởi những việc làm trái luật của họ
  rationale: Cách dữ có thể chỉ phương tiện hoặc nguyên nhân. “Việc làm trái luật” giữ sắc thái đạo đức-pháp luật của ἄνομος; “của họ” được bổ sung theo văn cảnh.
- source_word: ἐβασάνιζεν
  choice: đã giày vò
  rationale: Thể chưa hoàn thành chủ động diễn tả hành động kéo dài trong quá khứ, với cường độ mạnh hơn chỉ buồn phiền. Bản dịch giữ cấu trúc chủ động, trong đó tâm hồn là tân ngữ.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong quan niệm về con người
  choice: Dịch là “tâm hồn” theo nghĩa đời sống nội tâm của Lót, không dùng như một thuật ngữ tín lý chuyên biệt.
  alternative: “linh hồn” hoặc “bản thân”
  rationale: Ngữ cảnh nói đến nỗi đau đạo đức sâu xa của Lót, chứ không trình bày một học thuyết chi tiết về quan hệ giữa thân thể và linh hồn.
- issue: Chủ thể chủ động của ἐβασάνιζεν
  choice: Giữ cách nói Lót “đã giày vò tâm hồn công chính của mình”.
  alternative: “tâm hồn ông bị giày vò” hoặc “những việc làm ấy giày vò tâm hồn ông”
  rationale: Động từ Hy Lạp ở thể chủ động và có ψυχὴν làm tân ngữ. Dù cách diễn đạt tạo một độ căng đáng chú ý, không nên âm thầm đổi sang bị động hay biến các việc làm trái luật thành chủ ngữ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Giữ sự lặp lại của δίκαιος bằng “người công chính” và “tâm hồn công chính”, đồng thời giữ dấu gạch ngang cuối câu vì câu Hy Lạp tiếp nối mạch văn.
