  source_fidelity: 'Bản dịch giữ đúng các thành phần chính của câu Hy Lạp: γὰρ (“vì”); βλέμματι καὶ ἀκοῇ (“qua những điều mắt thấy tai nghe”); ὁ δίκαιος, quy chiếu về Lót (“người công chính ấy”); phân từ ἐγκατοικῶν (“khi sống giữa họ”); ἡμέραν ἐξ ἡμέρας (“ngày này qua ngày khác”); ψυχὴν δικαίαν (“tâm hồn công chính của mình”); và ἀνόμοις ἔργοις (“những việc làm trái luật của họ”). Cấu trúc chủ động của ἐβασάνιζεν được giữ lại, kể cả độ căng cố ý trong cách nói người công chính tự giày vò tâm hồn mình.'
  naturalness: Câu văn trang trọng, rõ nghĩa và phù hợp tiếng Việt hiện đại. Thành ngữ “mắt thấy tai nghe” tự nhiên; “ngày này qua ngày khác” diễn đạt tốt sắc thái liên tục. Cụm “vì qua...” hơi dồn hai quan hệ nguyên nhân/phương tiện, nhưng vẫn đọc được tự nhiên trong văn phong Kinh Thánh và phản ánh sự cô đọng, có độ linh hoạt cú pháp của nguyên văn.
  terminology: “Công chính” nhất quán cho δίκαιος; “tâm hồn” là lựa chọn phù hợp cho ψυχή theo nghĩa nội tâm, không áp đặt một mô hình tín lý; “trái luật” truyền đạt hợp lý sắc thái ἄνομος. Không có vấn đề về tên riêng, thuật ngữ thần học, hay thanh ghi.
