id: 2PE.2.11
reference: 2 Peter 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: vi
  text: Trong khi các thiên sứ, dù lớn hơn về sức mạnh và quyền năng, không đưa ra một lời phán xét có tính lăng mạ chống lại họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Họ” có lẽ chỉ về “các bậc vinh hiển” trong câu trước, nhưng tại đây Phi-e-rơ không xác định rõ đó là ai. Cụm “lời phán xét có tính lăng mạ” cũng có thể dịch là “lời phán xét xúc phạm” hoặc “lời phán xét phỉ báng.”
    reason: Giữ sự mơ hồ về đối tượng của đại từ và nêu các sắc thái từ vựng có thể có của βλάσφημον.
lexical_decisions:
- source_word: ὅπου
  choice: trong khi
  rationale: Trong ngữ cảnh, từ này nối câu theo ý tương phản hơn là chỉ địa điểm; “trong khi” diễn đạt tự nhiên sự đối chiếu với câu trước.
- source_word: ἄγγελοι
  choice: các thiên sứ
  rationale: Ngữ cảnh nói đến các hữu thể trên trời, không phải sứ giả loài người.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: về sức mạnh và quyền năng
  rationale: Giữ lại hai danh từ gần nghĩa và diễn đạt phương diện mà các thiên sứ lớn hơn.
- source_word: μείζονες ὄντες
  choice: dù lớn hơn
  rationale: 'Phân từ mang sắc thái nhượng bộ trong ngữ cảnh: mặc dù lớn hơn, các thiên sứ vẫn không làm như những người được nói đến trước đó.'
- source_word: οὐ φέρουσιν
  choice: cũng không đưa ra
  rationale: Trong kết hợp với κρίσιν, động từ có nghĩa đưa ra hoặc tuyên một lời phán xét; “đưa ra” tự nhiên trong tiếng Việt và giữ sắc thái pháp lý.
- source_word: κατ’ αὐτῶν
  choice: chống lại họ
  rationale: Giữ nguyên đại từ quy chiếu chưa được xác định rõ trong câu Hy Lạp, thay vì nêu cụ thể đối tượng.
- source_word: βλάσφημον
  choice: nhục mạ
  rationale: Tính từ chỉ lời nói lăng mạ, xúc phạm hoặc phỉ báng; “nhục mạ” phù hợp với một lời phán xét nhằm chống lại người khác mà không giới hạn nghĩa vào sự phạm thượng đối với Đức Chúa Trời.
- source_word: κρίσιν
  choice: lời phán xét
  rationale: Chỉ một nhận định hoặc phán quyết có sắc thái tư pháp; thêm “lời” giúp kết hợp tự nhiên với tính chất ngôn từ của βλάσφημον.
theological_decisions:
- issue: Đối tượng của αὐτῶν liên hệ với “các bậc vinh hiển” ở câu trước
  choice: Giữ đại từ “họ” trong chính văn, không xác định rõ đối tượng.
  alternative: Các thiên sứ sa ngã; các nhà cầm quyền loài người; hoặc các hữu thể vinh hiển trên trời nói chung.
  rationale: Câu này không gọi đích danh đối tượng. Giữ đại từ bảo toàn sự mơ hồ của nguyên văn và tránh áp đặt một cách giải thích thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ,” “quyền năng,” và “phán xét” theo cách dùng Kinh Thánh quen thuộc, nhưng cấu trúc câu vẫn tự nhiên trong tiếng Việt đương đại.
