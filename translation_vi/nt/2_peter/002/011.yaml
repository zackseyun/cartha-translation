  - severity: low
    issue: Cụm “lời phán xét nhục mạ” hơi gượng về kết hợp từ.
    rationale: “Nhục mạ” thường hoạt động tự nhiên hơn như động từ hoặc danh từ hành động. “Lời phán xét có tính lăng mạ” làm rõ rằng tính từ βλάσφημον mô tả đặc tính của lời phán xét.
