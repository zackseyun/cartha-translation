source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: vi
  text: thì Chúa biết cách giải cứu những người tin kính khỏi cơn thử thách[a], và giữ những kẻ bất chính đang chịu hình phạt cho đến ngày phán xét[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi cơn cám dỗ.” Từ Hy Lạp có thể chỉ sự cám dỗ hoặc sự thử thách; ở đây, ngữ cảnh thiên về việc được giải cứu khỏi thử thách.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “giữ những kẻ bất chính lại để chịu hình phạt vào ngày phán xét.” Phân từ Hy Lạp có thể được hiểu là nói đến hình phạt đang tiếp diễn, hoặc hình phạt gắn với ngày phán xét sắp đến.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: biết cách
  rationale: Đi với các động từ nguyên mẫu, οἶδεν diễn tả sự biết cách hoặc khả năng hành động; “biết cách” tự nhiên trong tiếng Việt và giữ được cấu trúc của câu.
- source_word: κύριος
  choice: Chúa
  rationale: “Chúa” là cách dịch trang trọng, quen thuộc của κύριος trong ngữ cảnh nói về quyền năng giải cứu và xét xử của Đức Chúa Trời.
- source_word: εὐσεβεῖς
  choice: những người tin kính
  rationale: Tính từ được dùng như danh từ, chỉ những người có lòng kính sợ và sống tận hiến đối với Đức Chúa Trời; “những người tin kính” rõ nghĩa hơn cách danh từ hóa gượng ép.
- source_word: ἐκ πειρασμοῦ
  choice: khỏi cơn thử thách
  rationale: πειρασμός có thể là thử thách hoặc cám dỗ. Những trường hợp Nô-ê và Lót trong ngữ cảnh trước nghiêng về cảnh gian nan/thử thách, nhưng chú thích vẫn giữ nghĩa thay thế.
- source_word: ῥύεσθαι
  choice: giải cứu
  rationale: ῥύομαι chỉ việc cứu khỏi hiểm nguy; “giải cứu” vừa tự nhiên vừa phù hợp với sự bảo toàn của Đức Chúa Trời trong ngữ cảnh.
- source_word: ἀδίκους
  choice: những kẻ bất chính
  rationale: Cách dịch này giữ sắc thái luân lý và pháp lý của ἄδικος, đồng thời đối lập rõ với “những người tin kính”.
- source_word: εἰς ἡμέραν κρίσεως
  choice: cho đến ngày phán xét
  rationale: Khi đi với τηρεῖν, cụm từ hướng đến mốc ngày phán xét; “cho đến” diễn đạt tự nhiên ý được giữ lại hướng tới ngày ấy, dù cấu trúc cũng có thể hiểu là “để dành cho” ngày phán xét.
- source_word: κολαζομένους
  choice: trong hình phạt
  rationale: Phân từ hiện tại có thể mô tả họ đang ở dưới hình phạt trong khi bị giữ lại; cách dịch này bảo tồn sắc thái kéo dài mà không xác định quá mức bản chất của hình phạt.
- source_word: τηρεῖν
  choice: giữ
  rationale: τηρέω có nghĩa giữ, canh giữ hoặc để dành; “giữ” đủ rộng để duy trì sự mơ hồ liên quan đến phân từ κολαζομένους.
theological_decisions:
- issue: Nghĩa của πειρασμός trong ngữ cảnh
  choice: cơn thử thách
  alternative: cơn cám dỗ
  rationale: Các ví dụ ngay trước đó tập trung vào việc Chúa giải cứu khỏi tai họa và hoàn cảnh gian nan, nên “thử thách” phù hợp hơn; chú thích bảo lưu nghĩa từ vựng còn lại.
- issue: Quan hệ của κολαζομένους với τηρεῖν và ngày phán xét
  choice: những kẻ bất chính được giữ trong hình phạt cho đến ngày phán xét
  alternative: những kẻ bất chính được giữ lại để chịu hình phạt vào ngày phán xét
  rationale: Phân từ hiện tại có thể diễn tả tình trạng chịu hình phạt đang tiếp diễn, nhưng cũng có thể gắn hình phạt với cuộc phán xét sắp đến. Bản chính phản ánh sắc thái hiện tại; chú thích nêu cách phân tích thay thế để không áp đặt một hệ thống thần học vượt quá câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “những người tin kính” và “những kẻ bất chính” để giữ thế đối lập luân lý của nguyên văn. Các dấu chú thích [a], [b] xuất hiện đầy đủ trong bản chính.
