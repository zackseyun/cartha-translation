source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: vi
  text: Họ là những mạch nước khô cạn và những màn sương bị bão cuốn đi[a]; sự u ám của bóng tối đã được dành sẵn cho họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những đám mây bị bão cuốn đi.” Từ Hy Lạp chính xác hơn chỉ “màn sương” hoặc “sương mù,” nhưng cũng có thể được dịch rộng hơn là “đám mây.”
    reason: lexical_alternative
  - marker: b
    text: Hay “sự đen tối của bóng tối đã được giữ lại cho họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: những mạch nước không có nước
  rationale: πηγή chỉ mạch hay nguồn nước tự nhiên hơn là giếng đào; cách dịch này giữ được nghịch lý sống động về một nguồn đáng lẽ có nước nhưng lại không có.
- source_word: ὁμίχλαι
  choice: những màn sương
  rationale: ὁμίχλη chỉ sương mù hoặc màn sương; “màn sương” tự nhiên trong tiếng Việt và diễn tả được tính mong manh, chóng tan của hình ảnh.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: bị bão cuốn đi
  rationale: λαῖλαψ là trận cuồng phong hay bão dữ, còn ἐλαύνω diễn tả việc xua hoặc cuốn đi; cách dịch giữ thể bị động và có nhịp tự nhiên.
- source_word: οἷς
  choice: cho họ
  rationale: Đại từ quan hệ quy chiếu về những kẻ được nói đến bằng “Họ”, chứ không phải về các hình ảnh ẩn dụ đứng xen giữa; tiếng Việt vì thế dùng đại từ chỉ người.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: bóng tối âm u
  rationale: ζόφος diễn tả sự tối tăm u ám, còn σκότος là bóng tối. Cụm tiếng Việt giữ cả sắc thái tối tăm lẫn âm u mà không quá cổ kính.
- source_word: τετήρηται
  choice: đã được dành sẵn
  rationale: Thể hoàn thành bị động của τηρέω cho biết điều ấy đã được giữ hoặc dành lại và hiện vẫn như vậy; “đã được dành sẵn” phù hợp với ngữ cảnh phán xét và giữ nguyên tác nhân không được nêu.
theological_decisions:
- issue: Mệnh đề cuối là ngôn ngữ phán xét
  choice: 'Giữ cấu trúc bị động: “đã được dành sẵn cho họ”, không nêu tác nhân.'
  alternative: Thêm rõ “Đức Chúa Trời đã dành sẵn cho họ”.
  rationale: Bản Hy Lạp hàm ý sự phán xét của Đức Chúa Trời nhưng không gọi tên tác nhân; bản dịch không bổ sung điều văn bản không nói trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Họ” trực tiếp, tự nhiên hơn “những kẻ ấy”; các hình ảnh mạnh của nguyên văn được giữ mà không dùng lối diễn đạt quá cổ. Mọi dấu chú thích đều có mặt trong chính văn.
