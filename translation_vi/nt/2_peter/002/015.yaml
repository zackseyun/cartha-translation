id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: vi
  text: Họ đã lìa bỏ con đường ngay thẳng và đi lạc, bước theo con đường của Ba-la-am, con trai Bô-so[a], là kẻ yêu tiền công của sự bất chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bô-so là dạng tên trong bản Hy Lạp; trong Cựu Ước, Ba-la-am thường được gọi là con trai Bê-ô.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: đã lìa bỏ
  rationale: Diễn đạt phân từ bất định chỉ hành động xảy ra trước động từ chính, đồng thời giữ sắc thái chủ động rời bỏ.
- source_word: εὐθεῖαν ὁδὸν
  choice: con đường ngay thẳng
  rationale: Giữ nguyên hình ảnh cụ thể về con đường và sắc thái luân lý của εὐθεῖαν.
- source_word: ἐπλανήθησαν
  choice: đi lạc
  rationale: Chuyển tải tự nhiên ý lạc đường theo nghĩa luân lý mà không thêm một tác nhân bên ngoài.
- source_word: ἐξακολουθήσαντες
  choice: bước theo
  rationale: Giữ quan hệ phân từ với động từ chính và hình ảnh con đường; tiếng Việt tự nhiên mà không quyết định quá mức đây là phương tiện hay hành động đi kèm.
- source_word: τῇ ὁδῷ
  choice: con đường
  rationale: Duy trì sự lặp lại có chủ ý của ὁδός và phép ẩn dụ về đường lối sống.
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: của Ba-la-am, con trai Bô-so
  rationale: Phiên âm tên riêng theo dạng Hy Lạp và hiểu cụm sở hữu thứ hai theo quan hệ cha-con vốn rõ trong ngữ cảnh.
- source_word: μισθὸν ἀδικίας
  choice: tiền công của sự bất chính
  rationale: “Tiền công” giữ ý khoản thù lao hay lợi lộc nhận được; “sự bất chính” bảo toàn trọng lượng luân lý của ἀδικία.
- source_word: ἠγάπησεν
  choice: yêu
  rationale: Phản ánh trực tiếp động từ ἀγαπάω, không làm nhẹ thái độ gắn bó và ham chuộng đối với lợi bất chính.
theological_decisions:
- issue: Hình ảnh con đường trong εὐθεῖαν ὁδὸν và τῇ ὁδῷ
  choice: Giữ “con đường” ở cả hai chỗ.
  alternative: Dịch diễn giải là “lối sống đúng đắn” hoặc “đường lối chân thật”.
  rationale: Bản Hy Lạp cố ý lặp lại ὁδός; giữ hình ảnh này bảo toàn sự tương phản giữa con đường ngay thẳng và con đường của Ba-la-am.
- issue: Dạng tên Βοσόρ
  choice: Bô-so trong chính văn, kèm chú thích về Bê-ô.
  alternative: Dùng Bê-ô ngay trong chính văn.
  rationale: SBLGNT đọc Βοσόρ, nên chính văn phản ánh dạng Hy Lạp; chú thích giúp độc giả nối với tên quen thuộc trong Cựu Ước mà không sửa ngầm nguồn văn bản.
- issue: Quan hệ cú pháp của ἐξακολουθήσαντες
  choice: Dịch “bước theo”, để ngỏ sắc thái hành động đi kèm hoặc cách thức dẫn đến việc đi lạc.
  alternative: Dịch rõ là “đi lạc vì đã bước theo”.
  rationale: Phân từ có thể mang sắc thái phương tiện nhưng văn bản không bắt buộc phải giới hạn vào một quan hệ duy nhất; cách dịch chọn giữ được độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngay thẳng”, “bất chính” để giữ sắc thái luân lý-thần học; lặp “con đường” nhằm bảo toàn phép ẩn dụ và cấu trúc của nguyên văn.
