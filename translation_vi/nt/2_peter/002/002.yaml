  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của câu Hy Lạp: số lượng “nhiều”, thì tương lai của “sẽ đi theo”, nguyên nhân “vì họ”, hình ảnh “con đường của chân lý”, và thể bị động tương lai “sẽ bị phỉ báng”. Tuy nhiên, “những lối sống buông thả” diễn giải ἀσελγείαι thành các “lối sống” khá rộng và có phần làm yếu nét vô liêm sỉ/phóng đãng của danh từ này. “Sự phóng đãng” sát hơn mà vẫn không thu hẹp nghĩa vào hành vi tình dục.'
